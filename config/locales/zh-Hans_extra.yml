        subject: 解锁账号
        body: |
          <p>%{name}，您好。</p><br>
          <p>有人在 bibleox.com 多次使用错误密码尝试登录您的账号。为了保护您的账号，我们已暂时将其锁定。要解锁，请打开以下链接：%{url}。</p><br>
          <p>祝您愉快！</p>
