          <p>如果這不是您本人操作，請忽略此郵件。</p>
          <p>祝您愉快！</p>
      activation_needed:
        subject: 驗證電子郵件
        body: |
          <p>%{name}，您好。</p><br>
          <p>該電子郵件被用於註冊 bibleox.com。要啟用帳號，請開啟以下連結：%{url}。</p><br>
          <p>如果這不是您本人操作，請忽略此郵件。</p>
          <p>祝您愉快！</p>
      password_reset:
        subject: 重設密碼
        body: |
          <p>%{name}，您好。</p><br>
          <p>有人在 bibleox.com 請求為該電子郵件重設密碼。要設定新密碼，請開啟以下連結：%{url}。</p>
          <p>該連結將在 24 小時後失效。</p>
          <p>如果這不是您本人操作，請忽略此郵件。</p><br>
          <p>祝您愉快！</p>
      account_unlock:
        subject: 解鎖帳號
        body: |
          <p>%{name}，您好。</p><br>
          <p>有人在 bibleox.com 多次使用錯誤密碼嘗試登入您的帳號。為了保護您的帳號，我們已暫時將其鎖定。要解鎖，請開啟以下連結：%{url}。</p><br>
          <p>祝您愉快！</p>
