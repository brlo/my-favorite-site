    bibleox_translated_desc: |
      К сожалению, нам не всегда удаётся найти уже готовые переводы,
      но мы очень хотим, чтобы этот текст был доступен каждому — поэтому подготовили перевод для ознакомления.

      Для подготовки переводов привлекаются люди и автоматические инструменты.

      Скорее всего, какие-то фрагменты звучат ещё не очень хорошо, но мы постарались сохранить догматическую точность.

      Вы можете помочь улучшить этот текст! Присоединитесь к сообществу и предложите свой вариант правки.
      Как и материалы Wikipedia, этот текст распространяется свободно под лицензией CC BY-SA.

