    description: Հարցեր և զրույց Աստվածաշնչի և հավատքի մասին
    login_link: Մուտք
    guest_hint: Մոդերատորները կտեսնեն ձեր հաղորդագրությունները և կպատասխանեն ձեզ։ Որպեսզի բոլոր մասնակիցները տեսնեն ձեր հաղորդագրությունները, գրանցվեք և հաստատեք ձեր էլ. փոստը։
    greeting: |-
      Բարի գալուստ։ Այստեղ կարող եք հարցեր տալ Սուրբ Գրքի, հավատքի և կայքում ձեր կարդացածի մասին։

      Գրեք ձեզ հարմար ցանկացած լեզվով․ յուրաքանչյուր մականվան կողքի դրոշը ցույց է տալիս զրուցակցի լեզուն, իսկ հաղորդագրությունները կարելի է թարգմանել։
