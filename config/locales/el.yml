    bibleox_translated: Κείμενο προετοιμασμένο από την κοινότητα bibleox
    bibleox_translated_desc: |
      Θέλουμε αυτό το κείμενο να είναι προσβάσιμο σε όλους — γι' αυτό δημιουργήσαμε αυτήν την μετάφραση.

      Δυστυχώς, δεν είναι πάντα εύκολο να βρεθούν έτοιμες μεταφράσεις, οπότε τις δημιουργούμε εμείς.
      Σε αυτό συνεργάζονται αυτοματοποιημένα εργαλεία και άνθρωποι. Μπορείτε να βοηθήσετε κι εσείς!

      Μερικά μέρη μπορεί να μην ακούγονται τέλεια, αλλά προσπαθήσαμε να διατηρήσουμε την ακρίβεια της σημασίας.

      Αν παρατηρήσετε ανακρίβεια ή θέλετε να βελτιώσετε το κείμενο — η κριτική είναι ευπρόσδεκτη! Ακόμα καλύτερα — ελάτε στην κοινότητα και προτείνετε διορθώσεις.
      Όπως τα υλικά της Wikipedia, αυτό το κείμενο διανέμεται δωρεάν με άδεια CC BY-SA.

