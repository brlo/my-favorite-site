    bibleox_translated_badge: IA + humain
    bibleox_translated: Comment cette traduction a été réalisée
    bibleox_translated_desc: |
      Comme il n'existe souvent pas de traductions toutes prêtes, nous réalisons les nôtres — avec l'aide de l'IA. L'IA prépare une ébauche à partir des textes originaux (lorsqu'ils sont disponibles), en s'appuyant sur des instructions humaines détaillées, un glossaire et des traductions humaines existantes. Ces traductions sont ensuite vérifiées et, si nécessaire, révisées.

      Des imperfections sont possibles, mais nous nous efforçons de préserver l'exactitude doctrinale.

      Vous avez remarqué des erreurs ? Nous vous serions reconnaissants de nous envoyer vos remarques dans le chat. Le texte est diffusé librement sous licence CC BY-SA.

