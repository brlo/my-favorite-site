    page_search_was_return_zero_results: Ոչինչ չի գտնվել։
    bibleox_translated: Տեքստը պատրաստվել է bibleox համայնքի կողմից
    bibleox_translated_desc: |
      Մենք ցանկանում ենք, որ այս տեքստը հասանելի լինի բոլորին, դրա համար էլ պատրաստել ենք այս թարգմանությունը։

      Ցավոք, միշտ չէ, որ հնարավոր է գտնել պատրաստի թարգմանություններ, ուստի մենք դրանք ստեղծում ենք ինքներս։
      Դրա վրա աշխատում են ինչպես ավտոմատացված գործիքները, այնպես էլ մարդիկ։ Դուք նույնպես կարող եք օգնել։

      Որոշ մասեր կարող են կատարյալ չհնչել, բայց մենք փորձել ենք պահպանել իմաստի ճշգրտությունը։

      Եթե նկատում եք անճշտություն կամ ցանկանում եք բարելավել տեքստը, քննադատությունը ողջունելի է։ Ավելի լավ է՝ միացե՛ք համայնքին և առաջարկե՛ք ձեր խմբագրումները։
      Ինչպես Վիքիպեդիայի նյութերը, այս տեքստն ազատ հասանելի է CC BY-SA լիցենզիայի ներքո։

