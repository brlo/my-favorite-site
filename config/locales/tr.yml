    bibleox_translated: bibleox topluluğu tarafından hazırlanan metin
    bibleox_translated_desc: |
      Bu metnin herkes tarafından erişilebilir olmasını istiyoruz - bu yüzden bu çeviriyi hazırladık.

      Ne yazık ki her zaman hazır çeviriler bulamıyoruz, bu yüzden kendimiz oluşturuyoruz.
      Hem otomatik araçlar hem de insanlar bunun üzerinde çalışıyor. Siz de yardım edebilirsiniz!

      Bazı kısımlar mükemmel görünmeyebilir, ancak anlamın doğruluğunu korumaya çalıştık.

      Bir yanlışlık fark ederseniz veya metni geliştirmek isterseniz - eleştirileriniz memnuniyetle karşılanır! Daha iyisi - topluluğa katılın ve düzenlemelerinizi önerin.
      Wikipedia materyalleri gibi, bu metin CC BY-SA lisansıyla ücretsiz olarak dağıtılmaktadır.

