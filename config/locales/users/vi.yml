          <p>Chúc bạn một ngày tốt lành!</p>
      activation_needed:
        subject: Xác nhận email
        body: |
          <p>Xin chào %{name},</p><br>
          <p>Địa chỉ này đã được dùng để đăng ký trên bibleox.com. Để kích hoạt tài khoản, hãy mở liên kết: %{url}.</p><br>
          <p>Nếu không phải bạn, hãy bỏ qua email này.</p>
          <p>Chúc bạn một ngày tốt lành!</p>
      password_reset:
        subject: Đặt lại mật khẩu
        body: |
          <p>Xin chào %{name},</p><br>
          <p>Ai đó đã yêu cầu đặt lại mật khẩu cho địa chỉ email này trên bibleox.com. Để đặt mật khẩu mới, hãy mở liên kết: %{url}.</p>
          <p>Liên kết này sẽ hết hạn sau 24 giờ.</p>
          <p>Nếu không phải bạn, hãy bỏ qua email này.</p><br>
          <p>Chúc bạn một ngày tốt lành!</p>
      account_unlock:
        subject: Mở khóa tài khoản
        body: |
          <p>Xin chào %{name},</p><br>
          <p>Ai đó đã cố đăng nhập vào tài khoản của bạn trên bibleox.com bằng cách nhập sai mật khẩu quá nhiều lần. Để bảo vệ tài khoản, chúng tôi đã tạm khóa nó. Để mở khóa, hãy mở liên kết: %{url}.</p><br>
          <p>Chúc bạn một ngày tốt lành!</p>

