          <p>よい一日を！</p>
      activation_needed:
        subject: メールアドレスの確認
        body: |
          <p>%{name} 様</p><br>
          <p>このアドレスは bibleox.com の登録に使用されました。アカウントを有効にするには、こちらのリンクを開いてください：%{url}</p><br>
          <p>お心当たりのない場合は、このメールを無視してください。</p>
          <p>よい一日を！</p>
      password_reset:
        subject: パスワードのリセット
        body: |
          <p>%{name} 様</p><br>
          <p>bibleox.com でこのメールアドレスのパスワードリセットが要求されました。新しいパスワードを設定するには、こちらのリンクを開いてください：%{url}</p>
          <p>このリンクの有効期限は24時間です。</p>
          <p>お心当たりのない場合は、このメールを無視してください。</p><br>
          <p>よい一日を！</p>
      account_unlock:
        subject: アカウントのロック解除
        body: |
          <p>%{name} 様</p><br>
          <p>bibleox.com のあなたのアカウントに、誤ったパスワードで何度もログインが試みられました。アカウントを保護するため、一時的にロックしました。ロックを解除するには、こちらのリンクを開いてください：%{url}</p><br>
          <p>よい一日を！</p>

