      current_password: Current password
      new_password: New password
      new_password_confirmation: New password confirmation

    is_already_registred: Already have an account?
    is_not_yet_registred: Don't have an account?
    is_forgot_password: Forgot your password?
    letters:
      welcome:
        subject: You have signed up on bibleox.com
        body: |
          <p>Hello, %{name}.</p><br>
          <p>Someone has signed up on bibleox.com using your name. To log in, follow this link: %{url}.</p>
          <p>If it wasn't you, just ignore this email.</p>
          <p>Have a nice day!</p>
      activation_needed:
        subject: Email confirmation
        body: |
          <p>Hello, %{name}.</p><br>
          <p>This address was used to sign up on bibleox.com. To activate your account, follow this link: %{url}.</p><br>
          <p>If it wasn't you, just ignore this email.</p>
          <p>Have a nice day!</p>
      password_reset:
        subject: Password reset
        body: |
          <p>Hello, %{name}.</p><br>
          <p>Someone requested a password reset for this email address on bibleox.com. To set a new password, follow this link: %{url}.</p>
          <p>This link will expire in 24 hours.</p>
          <p>If it wasn't you, just ignore this email.</p><br>
          <p>Have a nice day!</p>
      account_unlock:
        subject: Account unlock
        body: |
          <p>Hello, %{name}.</p><br>
          <p>Someone tried to log in to your account on bibleox.com by entering a wrong password too many times. To protect your account, we have temporarily locked it. To unlock it, follow this link: %{url}.</p><br>
          <p>Have a nice day!</p>

  errors:
    alert: Errors occurred
