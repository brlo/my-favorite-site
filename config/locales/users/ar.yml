          <p>نتمنى لك يومًا سعيدًا!</p>
      password_reset:
        subject: إعادة تعيين كلمة المرور
        body: |
          <p>مرحبًا %{name}،</p><br>
          <p>طلب شخص ما إعادة تعيين كلمة المرور لهذا البريد الإلكتروني على موقع bibleox.com. لتعيين كلمة مرور جديدة، افتح الرابط: %{url}.</p>
          <p>ستنتهي صلاحية هذا الرابط بعد 24 ساعة.</p>
          <p>إذا لم تكن أنت، فتجاهل هذه الرسالة.</p><br>
          <p>نتمنى لك يومًا سعيدًا!</p>
      account_unlock:
        subject: فتح الحساب
        body: |
          <p>مرحبًا %{name}،</p><br>
          <p>حاول شخص ما الدخول إلى حسابك على موقع bibleox.com بإدخال كلمة مرور خاطئة مرات كثيرة جدًا. لحماية حسابك قمنا بقفله مؤقتًا. لفتحه، افتح الرابط: %{url}.</p><br>
          <p>نتمنى لك يومًا سعيدًا!</p>

