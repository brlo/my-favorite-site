      activation_needed:
        subject: تأكيد البريد الإلكتروني
        body: |
          <p>مرحبًا %{name}،</p><br>
          <p>تم استخدام هذا العنوان لإنشاء حساب على موقع bibleox.com. لتفعيل الحساب، افتح الرابط: %{url}.</p><br>
