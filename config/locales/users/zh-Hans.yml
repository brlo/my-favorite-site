    letters:
      welcome:
        subject: 您已在 bibleox.com 注册
        body: |
          <p>%{name}，您好！</p><br>
          <p>有人以您的名义在 bibleox.com 注册了账户。要登录网站，请打开链接：%{url}。</p>
          <p>如果这不是您本人操作，请忽略此邮件。</p>
          <p>祝您愉快！</p>
      activation_needed:
        subject: 邮箱确认
        body: |
          <p>%{name}，您好！</p><br>
          <p>此邮箱已被用于在 bibleox.com 注册。要激活账户，请打开链接：%{url}。</p><br>
          <p>如果这不是您本人操作，请忽略此邮件。</p>
          <p>祝您愉快！</p>
      password_reset:
        subject: 重置密码
        body: |
          <p>%{name}，您好！</p><br>
          <p>有人在 bibleox.com 请求重置此邮箱对应账户的密码。要设置新密码，请打开链接：%{url}。</p>
          <p>该链接将在24小时后失效。</p>
          <p>如果这不是您本人操作，请忽略此邮件。</p><br>
          <p>祝您愉快！</p>
      account_unlock:
        subject: 账户解锁
        body: |
          <p>%{name}，您好！</p><br>
          <p>有人多次输入错误密码，试图登录您在 bibleox.com 的账户。为保护您的账户，我们已将其暂时锁定。要解锁，请打开链接：%{url}。</p><br>
          <p>祝您愉快！</p>

