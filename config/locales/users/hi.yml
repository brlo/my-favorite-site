    letters:
      welcome:
        subject: आपने bibleox.com पर पंजीकरण किया है
        body: |
          <p>नमस्ते, %{name}।</p><br>
          <p>किसी ने आपके नाम से bibleox.com पर पंजीकरण किया है। लॉग इन करने के लिए इस लिंक पर जाएँ: %{url}।</p>
