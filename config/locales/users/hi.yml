          <p>आपका दिन शुभ हो!</p>
      activation_needed:
        subject: ईमेल की पुष्टि
        body: |
          <p>नमस्ते, %{name}।</p><br>
          <p>इस पते का उपयोग bibleox.com पर पंजीकरण के लिए किया गया है। खाता सक्रिय करने के लिए इस लिंक पर जाएँ: %{url}।</p><br>
          <p>यदि यह आप नहीं थे, तो इस ईमेल को अनदेखा करें।</p>
          <p>आपका दिन शुभ हो!</p>
      password_reset:
        subject: पासवर्ड रीसेट
        body: |
          <p>नमस्ते, %{name}।</p><br>
          <p>किसी ने bibleox.com पर इस ईमेल पते के लिए पासवर्ड रीसेट का अनुरोध किया है। नया पासवर्ड सेट करने के लिए इस लिंक पर जाएँ: %{url}।</p>
          <p>यह लिंक 24 घंटे बाद समाप्त हो जाएगा।</p>
          <p>यदि यह आप नहीं थे, तो इस ईमेल को अनदेखा करें।</p><br>
          <p>आपका दिन शुभ हो!</p>
      account_unlock:
        subject: खाता अनलॉक करना
        body: |
          <p>नमस्ते, %{name}।</p><br>
          <p>किसी ने बहुत बार गलत पासवर्ड डालकर bibleox.com पर आपके खाते में लॉग इन करने की कोशिश की। आपके खाते की सुरक्षा के लिए हमने उसे अस्थायी रूप से लॉक कर दिया है। अनलॉक करने के लिए इस लिंक पर जाएँ: %{url}।</p><br>
          <p>आपका दिन शुभ हो!</p>

