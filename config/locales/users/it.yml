    letters:
      welcome:
        subject: Ti sei registrato su bibleox.com
        body: |
          <p>Ciao %{name},</p><br>
          <p>qualcuno si è registrato su bibleox.com a tuo nome. Per accedere, segui questo link: %{url}.</p>
          <p>Se non sei stato tu, ignora semplicemente questa email.</p>
          <p>Buona giornata!</p>
      activation_needed:
        subject: Conferma dell'indirizzo email
        body: |
          <p>Ciao %{name},</p><br>
          <p>questo indirizzo è stato usato per registrarsi su bibleox.com. Per attivare il tuo account, segui questo link: %{url}.</p><br>
          <p>Se non sei stato tu, ignora semplicemente questa email.</p>
          <p>Buona giornata!</p>
      password_reset:
        subject: Reimpostazione della password
        body: |
          <p>Ciao %{name},</p><br>
          <p>qualcuno ha richiesto la reimpostazione della password per questo indirizzo email su bibleox.com. Per impostare una nuova password, segui questo link: %{url}.</p>
          <p>Questo link scadrà tra 24 ore.</p>
          <p>Se non sei stato tu, ignora semplicemente questa email.</p><br>
          <p>Buona giornata!</p>
      account_unlock:
        subject: Sblocco dell'account
        body: |
          <p>Ciao %{name},</p><br>
          <p>qualcuno ha cercato di accedere al tuo account su bibleox.com inserendo una password errata troppe volte. Per proteggere il tuo account, lo abbiamo bloccato temporaneamente. Per sbloccarlo, segui questo link: %{url}.</p><br>
          <p>Buona giornata!</p>

  errors:
    alert: Si sono verificati errori
