        body: |
          <p>שלום %{name},</p><br>
          <p>מישהו ביקש לאפס את הסיסמה עבור כתובת דוא״ל זו באתר bibleox.com. כדי להגדיר סיסמה חדשה, היכנסו לקישור: %{url}.</p>
          <p>הקישור יפוג בעוד 24 שעות.</p>
          <p>אם לא אתם עשיתם זאת, פשוט התעלמו מהודעה זו.</p><br>
          <p>יום טוב!</p>
      account_unlock:
        subject: שחרור נעילת החשבון
        body: |
          <p>שלום %{name},</p><br>
          <p>מישהו ניסה להתחבר לחשבון שלכם באתר bibleox.com והזין סיסמה שגויה פעמים רבות מדי. כדי להגן על החשבון, נעלנו אותו זמנית. כדי לשחרר את הנעילה, היכנסו לקישור: %{url}.</p><br>
