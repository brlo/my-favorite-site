      activation_required: Veuillez activer votre compte en suivant le lien reçu par e-mail
      account_blocked: Votre compte est bloqué
      not_admin: Droits insuffisants
      too_many_requests: Trop de requêtes vers le serveur. Veuillez patienter un instant.
    hints:
      email_confirmed: ✅ E-mail confirmé
      email_not_confirmed: ⚠️ E-mail non confirmé. Suivez le lien reçu par e-mail.
