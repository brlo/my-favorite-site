      current_password: Mot de passe actuel
      new_password: Nouveau mot de passe
      new_password_confirmation: Confirmation du nouveau mot de passe

    is_already_registred: Déjà inscrit ?
    is_not_yet_registred: Pas encore de compte ?
    is_forgot_password: Mot de passe oublié ?
    letters:
      welcome:
        subject: Vous vous êtes inscrit sur bibleox.com
        body: |
          <p>Bonjour %{name},</p><br>
          <p>Quelqu'un s'est inscrit sur bibleox.com en votre nom. Pour vous connecter, suivez ce lien : %{url}.</p>
          <p>Si ce n'était pas vous, ignorez simplement cet e-mail.</p>
          <p>Bonne journée !</p>
      activation_needed:
        subject: Confirmation de l'adresse e-mail
        body: |
          <p>Bonjour %{name},</p><br>
          <p>Cette adresse a été utilisée pour une inscription sur bibleox.com. Pour activer votre compte, suivez ce lien : %{url}.</p><br>
          <p>Si ce n'était pas vous, ignorez simplement cet e-mail.</p>
          <p>Bonne journée !</p>
      password_reset:
        subject: Réinitialisation du mot de passe
        body: |
          <p>Bonjour %{name},</p><br>
          <p>Quelqu'un a demandé la réinitialisation du mot de passe pour cette adresse e-mail sur bibleox.com. Pour définir un nouveau mot de passe, suivez ce lien : %{url}.</p>
          <p>Ce lien expirera dans 24 heures.</p>
          <p>Si ce n'était pas vous, ignorez simplement cet e-mail.</p><br>
          <p>Bonne journée !</p>
      account_unlock:
        subject: Déblocage du compte
        body: |
          <p>Bonjour %{name},</p><br>
          <p>Quelqu'un a tenté de se connecter à votre compte sur bibleox.com en saisissant un mot de passe incorrect trop de fois. Pour protéger votre compte, nous l'avons temporairement bloqué. Pour le débloquer, suivez ce lien : %{url}.</p><br>
          <p>Bonne journée !</p>

  errors:
    alert: Des erreurs sont survenues
