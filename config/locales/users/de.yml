    is_already_registred: Bereits registriert?
    is_not_yet_registred: Noch kein Konto?
    is_forgot_password: Passwort vergessen?
    letters:
      welcome:
        subject: Sie haben sich auf bibleox.com registriert
        body: |
          <p>Hallo %{name},</p><br>
          <p>jemand hat sich in Ihrem Namen auf bibleox.com registriert. Um sich anzumelden, folgen Sie diesem Link: %{url}.</p>
          <p>Wenn Sie das nicht waren, ignorieren Sie diese E-Mail einfach.</p>
          <p>Einen schönen Tag!</p>
      activation_needed:
        subject: E-Mail-Bestätigung
        body: |
          <p>Hallo %{name},</p><br>
          <p>diese Adresse wurde für eine Registrierung auf bibleox.com verwendet. Um Ihr Konto zu aktivieren, folgen Sie diesem Link: %{url}.</p><br>
          <p>Wenn Sie das nicht waren, ignorieren Sie diese E-Mail einfach.</p>
          <p>Einen schönen Tag!</p>
      password_reset:
        subject: Passwort zurücksetzen
        body: |
          <p>Hallo %{name},</p><br>
          <p>jemand hat für diese E-Mail-Adresse auf bibleox.com das Zurücksetzen des Passworts angefordert. Um ein neues Passwort festzulegen, folgen Sie diesem Link: %{url}.</p>
          <p>Dieser Link ist 24 Stunden lang gültig.</p>
          <p>Wenn Sie das nicht waren, ignorieren Sie diese E-Mail einfach.</p><br>
          <p>Einen schönen Tag!</p>
      account_unlock:
        subject: Konto entsperren
        body: |
          <p>Hallo %{name},</p><br>
          <p>jemand hat versucht, sich bei Ihrem Konto auf bibleox.com anzumelden, und dabei zu oft ein falsches Passwort eingegeben. Zum Schutz Ihres Kontos haben wir es vorübergehend gesperrt. Um es zu entsperren, folgen Sie diesem Link: %{url}.</p><br>
          <p>Einen schönen Tag!</p>

  errors:
    alert: Es sind Fehler aufgetreten
