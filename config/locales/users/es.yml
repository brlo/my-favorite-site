    is_already_registred: ¿Ya está registrado?
    is_not_yet_registred: ¿No tiene cuenta?
    is_forgot_password: ¿Olvidó su contraseña?
    letters:
      welcome:
        subject: Se ha registrado en bibleox.com
        body: |
          <p>Hola, %{name}.</p><br>
          <p>Alguien se ha registrado en bibleox.com en su nombre. Para iniciar sesión, siga este enlace: %{url}.</p>
          <p>Si no fue usted, simplemente ignore este correo.</p>
          <p>¡Que tenga un buen día!</p>
      activation_needed:
        subject: Confirmación del correo electrónico
        body: |
          <p>Hola, %{name}.</p><br>
          <p>Esta dirección se utilizó para registrarse en bibleox.com. Para activar su cuenta, siga este enlace: %{url}.</p><br>
          <p>Si no fue usted, simplemente ignore este correo.</p>
          <p>¡Que tenga un buen día!</p>
      password_reset:
        subject: Restablecimiento de contraseña
        body: |
          <p>Hola, %{name}.</p><br>
          <p>Alguien ha solicitado restablecer la contraseña de este correo electrónico en bibleox.com. Para establecer una nueva contraseña, siga este enlace: %{url}.</p>
          <p>Este enlace caducará en 24 horas.</p>
          <p>Si no fue usted, simplemente ignore este correo.</p><br>
          <p>¡Que tenga un buen día!</p>
      account_unlock:
        subject: Desbloqueo de la cuenta
        body: |
          <p>Hola, %{name}.</p><br>
          <p>Alguien intentó iniciar sesión en su cuenta de bibleox.com introduciendo una contraseña incorrecta demasiadas veces. Para proteger su cuenta, la hemos bloqueado temporalmente. Para desbloquearla, siga este enlace: %{url}.</p><br>
          <p>¡Que tenga un buen día!</p>

  errors:
    alert: Se han producido errores
