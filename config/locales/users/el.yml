          <p>Καλή σας μέρα!</p>
      activation_needed:
        subject: Επιβεβαίωση email
        body: |
          <p>Γεια σας, %{name}.</p><br>
          <p>Αυτή η διεύθυνση χρησιμοποιήθηκε για εγγραφή στο bibleox.com. Για να ενεργοποιήσετε τον λογαριασμό, ακολουθήστε τον σύνδεσμο: %{url}.</p><br>
          <p>Αν δεν ήσασταν εσείς, απλώς αγνοήστε αυτό το email.</p>
          <p>Καλή σας μέρα!</p>
      password_reset:
        subject: Επαναφορά κωδικού
        body: |
          <p>Γεια σας, %{name}.</p><br>
          <p>Κάποιος ζήτησε επαναφορά κωδικού για αυτή τη διεύθυνση email στο bibleox.com. Για να ορίσετε νέο κωδικό, ακολουθήστε τον σύνδεσμο: %{url}.</p>
          <p>Ο σύνδεσμος θα λήξει σε 24 ώρες.</p>
          <p>Αν δεν ήσασταν εσείς, απλώς αγνοήστε αυτό το email.</p><br>
          <p>Καλή σας μέρα!</p>
      account_unlock:
        subject: Ξεκλείδωμα λογαριασμού
        body: |
          <p>Γεια σας, %{name}.</p><br>
          <p>Κάποιος προσπάθησε να συνδεθεί στον λογαριασμό σας στο bibleox.com εισάγοντας λάθος κωδικό πάρα πολλές φορές. Για την προστασία του λογαριασμού σας τον κλειδώσαμε προσωρινά. Για να τον ξεκλειδώσετε, ακολουθήστε τον σύνδεσμο: %{url}.</p><br>
          <p>Καλή σας μέρα!</p>

