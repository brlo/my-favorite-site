    is_already_registred: 已有帳戶？
    is_not_yet_registred: 還沒有帳戶？
    is_forgot_password: 忘記密碼？
    letters:
      welcome:
        subject: 您已在 bibleox.com 註冊
        body: |
          <p>%{name}，您好！</p><br>
          <p>有人以您的名義在 bibleox.com 註冊了帳戶。要登入網站，請開啟連結：%{url}。</p>
          <p>如果這不是您本人操作，請忽略此郵件。</p>
          <p>祝您愉快！</p>
      activation_needed:
        subject: 電子郵件確認
        body: |
          <p>%{name}，您好！</p><br>
          <p>此電子郵件已被用於在 bibleox.com 註冊。要啟用帳戶，請開啟連結：%{url}。</p><br>
          <p>如果這不是您本人操作，請忽略此郵件。</p>
          <p>祝您愉快！</p>
      password_reset:
        subject: 重設密碼
        body: |
          <p>%{name}，您好！</p><br>
          <p>有人在 bibleox.com 請求重設此電子郵件對應帳戶的密碼。要設定新密碼，請開啟連結：%{url}。</p>
          <p>該連結將在24小時後失效。</p>
          <p>如果這不是您本人操作，請忽略此郵件。</p><br>
          <p>祝您愉快！</p>
      account_unlock:
        subject: 帳戶解鎖
        body: |
          <p>%{name}，您好！</p><br>
          <p>有人多次輸入錯誤密碼，試圖登入您在 bibleox.com 的帳戶。為保護您的帳戶，我們已將其暫時鎖定。要解鎖，請開啟連結：%{url}。</p><br>
          <p>祝您愉快！</p>

