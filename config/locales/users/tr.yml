          <p>İyi günler!</p>
      activation_needed:
        subject: E-posta onayı
        body: |
          <p>Merhaba %{name},</p><br>
          <p>Bu adres bibleox.com sitesine kayıt için kullanıldı. Hesabınızı etkinleştirmek için şu bağlantıya gidin: %{url}.</p><br>
          <p>Bu siz değilseniz, bu e-postayı dikkate almayın.</p>
          <p>İyi günler!</p>
      password_reset:
        subject: Şifre sıfırlama
        body: |
          <p>Merhaba %{name},</p><br>
          <p>Birisi bibleox.com sitesinde bu e-posta adresi için şifre sıfırlama talep etti. Yeni şifre belirlemek için şu bağlantıya gidin: %{url}.</p>
          <p>Bu bağlantı 24 saat sonra geçersiz olacaktır.</p>
          <p>Bu siz değilseniz, bu e-postayı dikkate almayın.</p><br>
          <p>İyi günler!</p>
      account_unlock:
        subject: Hesap kilidini açma
        body: |
          <p>Merhaba %{name},</p><br>
          <p>Birisi bibleox.com sitesindeki hesabınıza çok fazla kez yanlış şifre girerek giriş yapmaya çalıştı. Hesabınızı korumak için onu geçici olarak kilitledik. Kilidi açmak için şu bağlantıya gidin: %{url}.</p><br>
          <p>İyi günler!</p>

