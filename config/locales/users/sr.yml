      welcome:
        subject: Регистровали сте се на сајту bibleox.com
        body: |
          <p>Здраво, %{name}.</p><br>
          <p>Неко се у ваше име регистровао на сајту bibleox.com. За пријаву пратите линк: %{url}.</p>
          <p>Ако то нисте били ви, само занемарите овај имејл.</p>
          <p>Пријатан дан!</p>
      activation_needed:
        subject: Потврда имејла
        body: |
          <p>Здраво, %{name}.</p><br>
          <p>Ова адреса је коришћена за регистрацију на сајту bibleox.com. Да бисте активирали налог, пратите линк: %{url}.</p><br>
          <p>Ако то нисте били ви, само занемарите овај имејл.</p>
          <p>Пријатан дан!</p>
      password_reset:
        subject: Ресетовање лозинке
        body: |
          <p>Здраво, %{name}.</p><br>
          <p>Неко је затражио ресетовање лозинке за ову имејл адресу на сајту bibleox.com. Да бисте поставили нову лозинку, пратите линк: %{url}.</p>
          <p>Овај линк престаје да важи за 24 сата.</p>
          <p>Ако то нисте били ви, само занемарите овај имејл.</p><br>
          <p>Пријатан дан!</p>
      account_unlock:
        subject: Откључавање налога
        body: |
          <p>Здраво, %{name}.</p><br>
          <p>Неко је покушао да се пријави на ваш налог на сајту bibleox.com уносећи погрешну лозинку превише пута. Да бисмо заштитили ваш налог, привремено смо га закључали. За откључавање пратите линк: %{url}.</p><br>
          <p>Пријатан дан!</p>

