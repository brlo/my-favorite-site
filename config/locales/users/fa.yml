    letters:
      welcome:
        subject: شما در bibleox.com ثبت‌نام کردید
        body: |
          <p>سلام %{name}،</p><br>
          <p>کسی به نام شما در سایت bibleox.com ثبت‌نام کرده است. برای ورود، روی این پیوند کلیک کنید: %{url}.</p>
          <p>اگر این کار را شما انجام نداده‌اید، این ایمیل را نادیده بگیرید.</p>
          <p>روز خوبی داشته باشید!</p>
      activation_needed:
        subject: تأیید ایمیل
        body: |
          <p>سلام %{name}،</p><br>
          <p>این نشانی برای ثبت‌نام در سایت bibleox.com استفاده شده است. برای فعال کردن حساب، روی این پیوند کلیک کنید: %{url}.</p><br>
          <p>اگر این کار را شما انجام نداده‌اید، این ایمیل را نادیده بگیرید.</p>
          <p>روز خوبی داشته باشید!</p>
      password_reset:
        subject: بازنشانی رمز عبور
        body: |
          <p>سلام %{name}،</p><br>
          <p>کسی در سایت bibleox.com درخواست بازنشانی رمز عبور این نشانی ایمیل را داده است. برای تعیین رمز عبور جدید، روی این پیوند کلیک کنید: %{url}.</p>
          <p>این پیوند پس از ۲۴ ساعت منقضی می‌شود.</p>
          <p>اگر این کار را شما انجام نداده‌اید، این ایمیل را نادیده بگیرید.</p><br>
          <p>روز خوبی داشته باشید!</p>
      account_unlock:
        subject: باز کردن قفل حساب
        body: |
          <p>سلام %{name}،</p><br>
          <p>کسی تلاش کرده با وارد کردن رمز عبور نادرست به دفعات زیاد، وارد حساب شما در سایت bibleox.com شود. برای محافظت از حساب، آن را موقتاً قفل کردیم. برای باز کردن قفل، روی این پیوند کلیک کنید: %{url}.</p><br>
          <p>روز خوبی داشته باشید!</p>

