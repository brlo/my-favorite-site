      activation_needed:
        subject: Elektron pochtani tasdiqlash
        body: |
          <p>Assalomu alaykum, %{name}.</p><br>
          <p>Bu manzil bibleox.com saytida ro‘yxatdan o‘tishda ishlatilgan. Hisobni faollashtirish uchun havolaga o‘ting: %{url}.</p><br>
          <p>Agar bu siz bo‘lmasangiz, ushbu xatga e’tibor bermang.</p>
          <p>Kuningiz xayrli o‘tsin!</p>
      password_reset:
        subject: Parolni tiklash
        body: |
          <p>Assalomu alaykum, %{name}.</p><br>
          <p>Kimdir bibleox.com saytida ushbu elektron pochta manzili uchun parolni tiklashni so‘radi. Yangi parol o‘rnatish uchun havolaga o‘ting: %{url}.</p>
          <p>Bu havola 24 soatdan keyin amal qilmaydi.</p>
          <p>Agar bu siz bo‘lmasangiz, ushbu xatga e’tibor bermang.</p><br>
          <p>Kuningiz xayrli o‘tsin!</p>
      account_unlock:
        subject: Hisobni blokdan chiqarish
        body: |
          <p>Assalomu alaykum, %{name}.</p><br>
          <p>Kimdir bibleox.com saytidagi hisobingizga juda ko‘p marta noto‘g‘ri parol kiritib kirishga urindi. Hisobingizni himoya qilish uchun uni vaqtincha blokladik. Blokdan chiqarish uchun havolaga o‘ting: %{url}.</p><br>
          <p>Kuningiz xayrli o‘tsin!</p>

