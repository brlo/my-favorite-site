      welcome:
        subject: Umejisajili kwenye bibleox.com
        body: |
          <p>Habari, %{name}.</p><br>
          <p>Mtu fulani amejisajili kwenye bibleox.com kwa jina lako. Ili kuingia, fuata kiungo hiki: %{url}.</p>
          <p>Ikiwa si wewe, puuza tu barua pepe hii.</p>
          <p>Uwe na siku njema!</p>
      activation_needed:
        subject: Uthibitisho wa barua pepe
        body: |
          <p>Habari, %{name}.</p><br>
          <p>Anwani hii ilitumika kujisajili kwenye bibleox.com. Ili kuwezesha akaunti yako, fuata kiungo hiki: %{url}.</p><br>
          <p>Ikiwa si wewe, puuza tu barua pepe hii.</p>
          <p>Uwe na siku njema!</p>
      password_reset:
        subject: Kuweka upya nenosiri
        body: |
          <p>Habari, %{name}.</p><br>
          <p>Mtu fulani ameomba kuweka upya nenosiri la anwani hii ya barua pepe kwenye bibleox.com. Ili kuweka nenosiri jipya, fuata kiungo hiki: %{url}.</p>
          <p>Kiungo hiki kitaacha kufanya kazi baada ya saa 24.</p>
          <p>Ikiwa si wewe, puuza tu barua pepe hii.</p><br>
          <p>Uwe na siku njema!</p>
      account_unlock:
        subject: Kufungua akaunti
        body: |
          <p>Habari, %{name}.</p><br>
          <p>Mtu fulani alijaribu kuingia kwenye akaunti yako ya bibleox.com kwa kuingiza nenosiri lisilo sahihi mara nyingi mno. Ili kulinda akaunti yako, tumeifunga kwa muda. Ili kuifungua, fuata kiungo hiki: %{url}.</p><br>
          <p>Uwe na siku njema!</p>

