      welcome:
        subject: bibleox.com에 가입하셨습니다
        body: |
          <p>%{name}님, 안녕하세요.</p><br>
          <p>누군가 회원님의 이름으로 bibleox.com에 가입했습니다. 로그인하려면 다음 링크를 여세요: %{url}</p>
          <p>본인이 아니라면 이 메일을 무시하세요.</p>
          <p>좋은 하루 되세요!</p>
      activation_needed:
        subject: 이메일 확인
        body: |
          <p>%{name}님, 안녕하세요.</p><br>
          <p>이 주소가 bibleox.com 가입에 사용되었습니다. 계정을 활성화하려면 다음 링크를 여세요: %{url}</p><br>
          <p>본인이 아니라면 이 메일을 무시하세요.</p>
          <p>좋은 하루 되세요!</p>
      password_reset:
        subject: 비밀번호 재설정
        body: |
          <p>%{name}님, 안녕하세요.</p><br>
          <p>누군가 bibleox.com에서 이 이메일 주소의 비밀번호 재설정을 요청했습니다. 새 비밀번호를 설정하려면 다음 링크를 여세요: %{url}</p>
          <p>이 링크는 24시간 후에 만료됩니다.</p>
          <p>본인이 아니라면 이 메일을 무시하세요.</p><br>
          <p>좋은 하루 되세요!</p>
      account_unlock:
        subject: 계정 잠금 해제
        body: |
          <p>%{name}님, 안녕하세요.</p><br>
          <p>누군가 잘못된 비밀번호를 너무 많이 입력하여 bibleox.com의 회원님 계정에 로그인하려고 했습니다. 계정을 보호하기 위해 일시적으로 잠갔습니다. 잠금을 해제하려면 다음 링크를 여세요: %{url}</p><br>
          <p>좋은 하루 되세요!</p>

