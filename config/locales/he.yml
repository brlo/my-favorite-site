    bibleox_translated: טקסט שהוכן על ידי קהילת bibleox
    bibleox_translated_desc: |
      אנחנו רוצים שהטקסט הזה יהיה נגיש לכולם — לכן הכנו את התרגום הזה.

      לצערנו, לא תמיד אפשר למצוא תרגומים מוכנים, אז אנחנו יוצרים אותם בעצמנו.
      כלים אוטומטיים ובני אדם עובדים על זה. גם אתה יכול לעזור!

      ייתכן שחלקים מסוימים לא נשמעים מושלמים, אבל ניסינו לשמור על דיוק המשמעות.

      אם הבחנת בטעות או רוצה לשפר את הטקסט — ביקורת מתקבלת בברכה! אפילו טוב יותר — הצטרף לקהילה והצע את השינויים שלך.
      כמו חומרי ויקיפדיה, הטקסט הזה זמין בחופשיות תחת רישיון CC BY-SA.

