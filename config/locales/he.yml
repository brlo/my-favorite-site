    bibleox_translated_desc: |
      מכיוון שלעתים קרובות אין תרגומים מוכנים, אנחנו מכינים תרגומים משלנו — בעזרת AI. ה-AI מכין טיוטה מהטקסטים המקוריים (כאשר הם קיימים), בהסתמך על הוראות אנושיות מפורטות, מילון מונחים ותרגומים אנושיים קיימים. לאחר מכן התרגומים נבדקים ומתוקנים לפי הצורך.

      ייתכנו אי-דיוקים, אך אנו משתדלים לשמור על הדיוק הדוקטרינרי.

      שמתם לב לשגיאות? נשמח אם תשלחו את הערותיכם לצ'אט. הטקסט מופץ בחופשיות תחת רישיון CC BY-SA.

