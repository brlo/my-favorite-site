    bibleox_translated: النص مُعد من قبل مجتمع bibleox
    bibleox_translated_desc: |
      نريد أن يكون هذا النص متاحًا للجميع — لذلك أعددنا هذا الترجمة.

      لسوء الحظ، لا يمكن دائمًا العثور على ترجمات جاهزة، لذا نقوم بإنشائها بأنفسنا.
      يعمل على هذا أدوات تلقائية وأشخاص. يمكنك المساعدة أيضًا!

      قد تبدو بعض الأجزاء غير مثالية، لكننا حرصنا على الحفاظ على دقة المعنى.

      إذا لاحظت أي خطأ أو أردت تحسين النص — نرحب بالنقد! والأفضل من ذلك — انضم إلى المجتمع واقترح تعديلاتك.
      مثل مواد ويكيبيديا، هذا النص متاح مجانًا تحت رخصة CC BY-SA.

