    bibleox_translated_desc: |
      このテキストを誰もが利用できるようにしたいと考え、この翻訳を作成しました。

      残念ながら、既存の翻訳が見つからない場合があるため、私たち自身で作成しています。
      自動ツールと人間の両方が作業しています。あなたも協力できます！

      一部の表現が完璧ではないかもしれませんが、意味の正確さを保つように努めました。

      誤りを見つけたり、テキストを改善したい場合 — 批評は歓迎です！さらに良いのは、コミュニティに参加して修正を提案することです。
      Wikipediaの資料と同様、このテキストはCC BY-SAライセンスで自由に利用できます。

