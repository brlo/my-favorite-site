# Реестр источников BKV для немецкой библиотеки.
# Здесь — откуда берутся тексты, чтобы можно было вернуться и добрать
# пропущенное (например, Оригена), не разыскивая заново.
#
# Каталог: https://bkv.unifr.ch/de/works
# Метаданные версий: tmp/bkv/versions.json (script/translations/bkv/versions.py)
# Права: db/bkv_translators.yml; BKV: https://bkv.unifr.ch/about/copyrights
# У каждого импортированного труда ссылка на BKV также стоит в его references.

