- src: Богородица
  path: QW7A_上帝之母
  title: 上帝之母
  copy_cover: true
  body: <h2>预备性的共通问题</h2><p>本文以上帝的教训为前提：<strong>基督是上帝</strong>（<a href="https://bibleox.com/ru/ru/w/Христос-Бог">引文</a>）。</p><p>童贞女马利亚受敬礼，是根据敬礼圣人的教训；所以首先要证明<a href="https://bibleox.com/ru/ru/w/почитание-святых-в-Библии">敬礼圣人</a>和<a href="https://bibleox.com/ru/ru/w/молитвы-святым">为圣人祈祷</a>。</p><p>然而，这里将提出的依据，不只是把童贞女马利亚作为圣人之一来敬礼，而是<strong>特别</strong>敬礼她——作为<strong>圣仆和上帝朋友中最大的一位</strong>，作为耶稣基督的母亲（即上帝之母，因为耶稣基督是上帝）。</p><h2>特别敬礼上帝之母的缘由</h2><ol><li><p><strong>童贞女马利亚对上帝话语特别的留意</strong>；</p></li><li><p><strong>完全谦卑地顺服上帝</strong>；</p></li><li><p><strong>被上帝拣选</strong>。全宇宙中没有别的受造物蒙上帝赐予按人性生他的荣耀。她的功绩不在于生育，而在于上帝预先知道马利亚的品质（<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/8/#L29">罗 8:29</a>），因这些品质而拣选了她。上帝以这拣选指明她的伟大；</p></li><li><p><strong>上帝之子尊敬童贞女马利亚为自己的母亲</strong>。再没有别的受造物（全宇宙中）是上帝之子的母亲；</p></li><li><p><strong>预言的应验</strong>：“从今以后万代要称我有福”（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/1/#L48">路 1:48</a>）——即所有世代的人。上帝为童贞女马利亚成就了大事：“那有权能的为我成就了<strong>大事</strong>，他的名为圣”（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/1/#L49">路 1:49</a>）。</p></li></ol><h2>因谦卑被拣选</h2><blockquote><p>“马利亚说：「我心尊主为大； 我灵以上帝我的救主为乐。 因为<strong><mark>他顾念他使女的卑微</mark></strong>，<strong><mark>从今以后，万代要称我有福</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/1/#L46-48">路 1:46-48</a>)</p></blockquote><p>连最大的先知（施洗约翰）的父亲撒迦利亚，也因不信——或说得更好：因不信任、疑惑——被天使责罚（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/1/#L20">路 1:20</a>）。而上帝之母谦卑地领受了对自己的定命，谦卑地回答：</p><blockquote><p>“马利亚说：「我是主的使女，<strong><mark>情愿照你的话成就在我身上</mark></strong>。」天使就离开她去了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/1/#L38">路 1:38</a>)</p></blockquote><p>关于谦卑的重要引文：</p><blockquote><p>“你的力量，不在乎人多；你的威能，并不靠强力；但<strong>你却是谦卑者的天主</strong>，弱小者的扶助，无力者的保护，无靠者的依赖，失望者的救主。” (<a href="https://bibleox.com/zh-Hans/cn-sb/iudf/9/#L11">友 9:11</a>)</p></blockquote><blockquote><p>“<strong>你越伟大，在一切事上越当谦下</strong>；这样，你才能在上主面前，获得恩宠。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/3/#L20">德 3:20</a>)</p></blockquote><p>关于谦卑的重要引文：<a href="https://bibleox.com/ru/ru/w/смирение">谦卑</a></p><h2>上帝话语最留心的听者</h2><blockquote><p>“<strong><mark>我儿，要将你的心归我</mark></strong>，<strong><mark>你的眼目也要喜悦我的道路</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/23/#L26">箴 23:26</a>)</p></blockquote><blockquote><p>“<strong><mark>马利亚却把这一切的事存在心里，反复思想</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/2/#L19">路 2:19</a>)</p></blockquote><blockquote><p>“他就同他们下去，回到拿撒勒．并且顺从他们。<strong><mark>他母亲把这一切的事都存在心里</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/2/#L51">路 2:51</a>)</p></blockquote><blockquote><p>“耶稣正说这话的时候，众人中间有一个女人大声说：「怀你胎的和乳养你的有福了！」 耶稣说：「<strong><mark>是，却还不如听上帝之道而遵守的人有福</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/11/#L27-28">路 11:27-28</a>)</p></blockquote><p>正如圣伊格纳提（布良恰尼诺夫）所说，她成了上帝教导的最留心、最恒常的听者和实行者：</p><p>“童贞女高于所有圣徒，一方面因为她成了神人的母亲，另一方面因为<strong>她是最恒常、最留心的听者和实行神人所宣讲教导的人</strong>。”</p><p>（[俄文](https://azbyka.ru/technik/Ignatij_Brjanchaninov/asketicheskaya_propoved/54)《正教会论上帝之母的教导》）</p><h2>成为基督上帝的母亲</h2><p>特别敬礼上帝之母的缘由之一，是她——上帝之母（按人性）：因为再没有别的受造物是上帝的母亲。上帝的诫命要求尊敬父母（<a href="https://bibleox.com/ru/ru/w/10-заповедей#HH-5">第五诫</a>），所以基督上帝亲自尊敬上帝之母为自己的母亲，他信实的门徒们也跟随他。</p><h3>童贞女马利亚生了上帝之子</h3><p>正是上帝的独生子真实地由女子所生：</p><blockquote><p>“及至时候满足，<strong><mark>上帝就差遣他的儿子</mark></strong>，<strong><mark>为女子所生</mark></strong>，且生在律法以下，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/4/#L4">加 4:4</a>)</p></blockquote><p>上帝的独生子、上帝的道，真实地成了肉身：</p><blockquote><p>“<strong><mark>道成了肉身，住在我们中间</mark></strong>，充充满满的有恩典有真理。我们也见过他的荣光，正是父独生子的荣光。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/1/#L14">约 1:14</a>)</p></blockquote><p>天使加百列直接称童贞女马利亚所生的孩子为上帝之子：</p><blockquote><p>“天使回答说：「圣灵要临到你身上，至高者的能力要荫庇你，因此<strong><mark>所要生的圣者必称为上帝的儿子</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/1/#L35">路 1:35</a>)</p></blockquote><h3>童贞女马利亚——上帝之子的母亲</h3><p>义人以利沙伯——先知施洗约翰的母亲——直接称童贞女马利亚为上帝之母：</p><blockquote><p>“<strong><mark>我主的母</mark></strong>到我这里来，这是从那里得的呢？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/1/#L43">路 1:43</a>)</p></blockquote><blockquote><p>“进了房子，<strong><mark>看见小孩子和他母亲马利亚</mark></strong>，就俯伏拜那小孩子，揭开宝盒，拿黄金、乳香、没药为礼物献给他。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/2/#L11">太 2:11</a>)</p></blockquote><blockquote><p>“<strong><mark>耶稣见母亲</mark></strong>和他所爱的那门徒站在旁边，<strong><mark>就对他母亲说</mark></strong>：「母亲，看你的儿子。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/19/#L26">约 19:26</a>)</p></blockquote><blockquote><p>“<strong><mark>他母亲对用人说</mark></strong>：「他告诉你们什么，你们就作什么。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/2/#L5">约 2:5</a>)</p></blockquote><blockquote><p>“第三日，在加利利的迦拿有娶亲的筵席。<strong><mark>耶稣的母亲在那里</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/2/#L1">约 2:1</a>)</p></blockquote><p>（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/2/#L14">太 2:14</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/2/#L20">太 2:20</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/2/#L21">太 2:21</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/12/#L46">太 12:46</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/3/#L31">可 3:31</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/2/#L33">路 2:33</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/2/#L34">路 2:34</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/2/#L43">路 2:43</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/2/#L48">路 2:48</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/2/#L51">路 2:51</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/8/#L19">路 8:19</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/in/2/#L3">约 2:3</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/in/2/#L12">约 2:12</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/in/19/#L25">约 19:25</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/in/19/#L26">约 19:26</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/act/1/#L14">徒 1:14</a>）</p><p>如果上帝之子永远成了人（这是确实的），那么童贞女马利亚就永远是上帝之子的母亲。</p><h3>上帝之子——童贞女马利亚之子</h3><blockquote><p>“只是没有和她同房，<strong><mark>等她生了儿子</mark></strong>〔有古卷作『等他生了头胎的儿子』〕，就给他起名叫耶稣。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/1/#L25">太 1:25</a>)</p></blockquote><h3>童贞女马利亚——上帝之母</h3><p>童贞女马利亚生了耶稣基督。</p><p>耶稣基督——上帝之子——是<a href="https://bibleox.com/ru/ru/w/Христос-Бог">我们的上帝</a>。</p><p>童贞女马利亚所生的是<a href="https://bibleox.com/ru/ru/w/Христос-Бог">我们的上帝</a>。就是说，她是生了上帝的那位——上帝之母。</p><p>童贞女马利亚生的不是永恒的上帝本性——它存在于时间和空间之外——而是上帝之子的人性；这人性有其开始，并且从它存在之初就完全属于上帝之子（上帝）的位格。</p><p>简言之，童贞女马利亚按人性生了上帝。</p><p>然而，上帝之母的伟大恰恰在于她被拣选作上帝的母亲。她的功绩不在于生育——生育的人很多——而在于：上帝预先知道马利亚的品质（<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/8/#L29">罗 8:29</a>），从所有存在过的人中拣选的不是别人，而正是童贞女马利亚。</p><h2>上帝之母曾经是、并且仍是童贞女</h2><h3>耶稣基督诞生之前马利亚的童贞</h3><p>童贞女马利亚与义人约瑟没有夫妻关系。她虽已许配给约瑟（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/1/#L27">路 1:27</a>），却不明白自己没有夫妻关系怎么能生子：</p><blockquote><p>“马利亚对天使说：「<strong><mark>我没有出嫁，怎么有这事呢</mark></strong>？」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/1/#L34">路 1:34</a>)</p></blockquote><p>还应注意：这个问题只有在童贞女马利亚曾向上帝许愿保守童贞的情况下才有意义。否则，即使童贞女马利亚至今没有与义人约瑟有过夫妻关系，当上帝的天使宣告她将生子时，她显然应当顺服上帝、与丈夫有夫妻关系，好叫预言应验。但如果童贞女马利亚曾向上帝许愿度贞洁的生活，那就立刻产生问题：“怎么会生子呢？因为向上帝所起的愿是不可违背的（<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/30/#L3">民 30:3</a>）？”</p><p>天使回答说，向马利亚所预言的将不经丈夫、以上帝大能的奇妙运作成就：</p><blockquote><p>“天使回答说：「<strong><mark>圣灵要临到你身上</mark></strong>，<strong><mark>至高者的能力要荫庇你</mark></strong>，因此所要生的圣者必称为上帝的儿子。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/1/#L35">路 1:35</a>)</p></blockquote><p>耶稣基督只是按人们的看法是约瑟的儿子：</p><blockquote><p>“耶稣开头传道，年纪约有三十岁。<strong><mark>依人看来，他是约瑟的儿子</mark></strong>，约瑟是希里的儿子，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/3/#L23">路 3:23</a>)</p></blockquote><p>实际上，基督不是由约瑟所生，而是由圣灵的大能。</p><h3>耶稣基督诞生之后马利亚的童贞</h3><p>关于马利亚终身童贞（至今仍是童贞女）的预言：从她生的只有一个孩子——进入我们世界的上帝、基督，正如藉着童贞女马利亚、上帝之母这门一样：</p><blockquote><p>“他又带我回到圣地朝东的外门；那门关闭了。 耶和华对我说：「<strong><mark>这门必须关闭，不可敞开</mark></strong>，<strong><mark>谁也不可由其中进入，因为耶和华以色列的上帝已经由其中进入，所以必须关闭</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iez/44/#L1-2">结 44:1-2</a>)</p></blockquote><p>这样，童贞女马利亚除了耶稣基督，没有生任何别的孩子。同时，马利亚的童贞没有被破坏。</p><p>还应注意：在被钉十字架的那一天，基督把自己母亲的关怀托付给所爱的门徒——神学家约翰（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/19/#L26-27">约 19:26-27</a>）。这表明：除了基督——童贞女马利亚的独子——之外，她再没有丈夫，也没有别的本应照顾她的儿女。</p><p>义人约瑟在基督诞生时已经年老，所以在基督被钉时早已去世。确实，在记述耶稣基督的童年之后，经上再也没有提到约瑟。而马利亚被托付给约翰，是因为正是他将比其他使徒在地上活得更久。主自己指明，使徒彼得将为基督受难，而使徒约翰将活得久得多（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/21/#L22">约 21:22</a>）。我们知道，约翰是使徒中最年轻的，在地上劳苦直到第一世纪末，而其余使徒都领了殉道之死。这使使徒约翰能够比所有其他人更久地照顾童贞女马利亚。</p><p>这一事实也表明：童贞女马利亚没有别的能照顾她的儿女。</p><h2>万代都要称上帝之母有福</h2><p>上帝之母将被称为有福，上帝为她成就了大事：</p><blockquote><p>“因为他顾念他使女的卑微，<strong><mark>从今以后，万代要称我有福</mark></strong>。 <strong><mark>那有权能的，为我成就了大事</mark></strong>，他的名为圣。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/1/#L48-49">路 1:48-49</a>)</p></blockquote><p>类似的话也说及基督自己：</p><blockquote><p>“他的名要存到永远，要留传如日之久。<strong><mark>人要因他蒙福，万国要称他有福</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/72/#L17">诗 72:17</a>)</p></blockquote><h2>基督与母亲的特殊关系</h2><h3>上帝之子尊敬童贞女马利亚为自己的母亲</h3><p>上帝之子顺服律法：</p><blockquote><p>“及至时候满足，上帝就差遣他的儿子，为女子所生，<strong><mark>且生在律法以下</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/4/#L4">加 4:4</a>)</p></blockquote><p>上帝命令尊敬父亲和母亲：</p><blockquote><p>“<strong><mark>当孝敬父母</mark></strong>，使你的日子在耶和华你上帝所赐你的地上得以长久。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/20/#L12">出 20:12</a>)</p></blockquote><blockquote><p>“<strong><mark>当照耶和华你上帝所吩咐的孝敬父母</mark></strong>，使你得福。并使你的日子，在耶和华你上帝所赐你的地上得以长久。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/5/#L16">申 5:16</a>)</p></blockquote><blockquote><p>“<strong><mark>咒骂父母的，必要把他治死</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/21/#L17">出 21:17</a>)</p></blockquote><blockquote><p>“<strong><mark>凡咒骂父母的，总要治死他</mark></strong>；他咒骂了父母，他的罪要归到他身上。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/20/#L9">利 20:9</a>)</p></blockquote><blockquote><p>“<strong><mark>打父母的，必要把他治死</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/21/#L15">出 21:15</a>)</p></blockquote><blockquote><p>“诫命你是晓得的：『不可奸淫，不可杀人，不可偷盗，不可作假见证，<strong><mark>当孝敬父母</mark></strong>。』」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/18/#L20">路 18:20</a>)</p></blockquote><blockquote><p>“又说：「<strong><mark>你们诚然是废弃上帝的诫命</mark></strong>，要守自己的遗传。 &lt;…&gt; 你们倒说：『人若对父母说：我所当奉给你的，已经作了各耳板』， <strong><mark>以后你们就不容他再奉养父母</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/7/#L9,11-12">可 7:9,11-12</a>)</p></blockquote><p>全宇宙中除童贞女马利亚外，没有别的受造物是上帝之子的母亲。在这层关系上，天使和世人中没有谁高于童贞女马利亚，因为尊敬她为自己母亲的，正是上帝之子、上帝本身。</p><h3>基督听自己母亲的话</h3><p>基督指出，宣讲和奇迹（显明他的荣耀）的时候还没有到；但因母亲所求，他行了第一个奇迹：</p><blockquote><p>“酒用尽了，<strong><mark>耶稣的母亲对他说</mark></strong>：「他们没有酒了。」 耶稣说：「母亲，<strong><mark>我与你有什么相干</mark></strong>？<strong><mark>我的时候还没有到</mark></strong>。」 <strong><mark>他母亲对用人说</mark></strong>：「他告诉你们什么，你们就作什么。」 &lt;…&gt; 耶稣对用人说：「把缸倒满了水。」他们就倒满了，直到缸口。 耶稣又说：「现在可以舀出来，送给管筵席的。」他们就送了去。 &lt;…&gt; <strong><mark>这是耶稣所行的头一件神迹</mark></strong>，是在加利利的迦拿行的，<strong><mark>显出他的荣耀来</mark></strong>，他的门徒就信他了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/2/#L3-5,7-8,11">约 2:3-5,7-8,11</a>)</p></blockquote><h3>基督关怀自己的母亲</h3><p>在十字架上残酷受苦的时候，基督关怀自己的母亲：</p><blockquote><p>“<strong><mark>耶稣见母亲</mark></strong>和他所爱的那门徒站在旁边，<strong><mark>就对他母亲说</mark></strong>：「母亲，看你的儿子。」 又对那门徒说：「<strong><mark>看你的母亲</mark></strong>。」<strong><mark>从此那门徒就接她到自己家里去了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/19/#L26-27">约 19:26-27</a>)</p></blockquote><h3>基督与自己母亲个人关系的性质</h3><p>在最可怕的时辰——在十字架上经受极重的身体痛苦、被出卖、门徒逃散、人之常情的被弃感（第九个小时：“我的上帝！我的上帝！<strong>为什么离弃我</strong>？”，<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/15/#L34">可 15:34</a>）——主关怀着自己的母亲，她跟随他直到最后一刻。</p><p>在这最艰难的时刻，他转向自己的母亲，对她显出特别的关怀，把她托付给所爱的门徒——而且不是一般的“看顾她、照顾她”，而是“接她作你的母亲”：</p><blockquote><p>“耶稣见母亲和他所爱的那门徒站在旁边，<strong><mark>就对他母亲说</mark></strong>：「母亲，看你的儿子。」 又对那门徒说：「<strong><mark>看你的母亲</mark></strong>。」<strong><mark>从此那门徒就接她到自己家里去了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/19/#L26-27">约 19:26-27</a>)</p></blockquote><p>注意：所有基督指着说“看哪，我的母亲，我的弟兄”（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/12/#L48-50">太 12:48-50</a>）的人，都离开了他（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/16/#L32">约 16:32</a>）；而他的母亲却同他在一起直到末了。</p><blockquote><p>“看哪！时候将到，且是已经到了，你们要分散，各归自己的地方去，<strong><mark>留下我独自一人</mark></strong>；<strong><mark>其实我不是独自一人，因为有父与我同在</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/16/#L32">约 16:32</a>)</p></blockquote><blockquote><p>“那差我来的，是与我同在；<strong><mark>他没有撇下我独自在这里</mark></strong>，<strong><mark>因为我常作他所喜悦的事</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/8/#L29">约 8:29</a>)</p></blockquote><p>基督没有撇下自己的母亲独自一人，也是出于同样的原因。</p><h3>上帝之母与基督同到底，这重要吗？</h3><p>使徒保罗在离世前也经历了类似的被弃：</p><blockquote><p>“<strong><mark>凡在亚西亚的人都离弃我</mark></strong>，这是你知道的，其中有腓吉路和黑摩其尼。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/1/#L15">提后 1:15</a>)</p></blockquote><blockquote><p>“因为<strong><mark>底马贪爱现今的世界，就离弃我</mark></strong>往帖撒罗尼迦去了，革勒士往加拉太去，提多往挞马太去，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/4/#L10">提后 4:10</a>)</p></blockquote><p>上帝之母从起初到末了在一切事上都留心、顺服、忠于上帝。她一直是、并且仍是与上帝同在的。</p><h2>对异议的回应</h2><h3>“可是圣经里没有‘上帝之母’这个词”</h3><p>圣经里也没有“三位一体”这个词——那又怎样呢？圣经里所说的，正是“上帝之母”一词所说的：童贞女马利亚是耶稣基督的母亲；耶稣基督是上帝；童贞女马利亚生了耶稣基督，即生了上帝——当然，按人性。由她所生的，是上帝。童贞女马利亚——生了上帝的，简称：上帝之母。</p><h3>“怀你胎的和乳养你的有福了”</h3><p>人们因亲缘关系、因生养和乳养基督而赞美上帝之母；但基督亲自更正了这一理解（重新立定重点），指明自己母亲的伟大，在于她对上帝之道的特别留心和完全谦卑的顺服：</p><blockquote><p>“耶稣正说这话的时候，众人中间有一个女人大声说：「<strong><mark>怀你胎的和乳养你的有福了</mark></strong>！」 耶稣说：「<strong><mark>是，却还不如听上帝之道而遵守的人有福</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/11/#L27-28">路 11:27-28</a>)</p></blockquote><blockquote><p>“<strong><mark>马利亚却把这一切的事存在心里，反复思想</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/2/#L19">路 2:19</a>)</p></blockquote><blockquote><p>“他就同他们下去，回到拿撒勒．并且顺从他们。<strong><mark>他母亲把这一切的事都存在心里</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/2/#L51">路 2:51</a>)</p></blockquote><h3>“谁是我的母亲？”</h3><p>这里基督又一次强调：童贞女马利亚的伟大不像人们所想的那样在于亲缘关系，而在于她毫无条件地遵行上帝的旨意：</p><blockquote><p>“他却回答那人说：「<strong><mark>谁是我的母亲</mark></strong>？谁是我的弟兄？」 就伸手指着门徒说：「看哪，我的母亲，我的弟兄。 <strong><mark>凡遵行我天父旨意的人，就是我的弟兄、姐妹和母亲了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/12/#L48-50">太 12:48-50</a>)</p></blockquote><h3>“只是没有和她同房，等她生了儿子”（太 1:25）</h3><blockquote><p>“<strong><mark>只是没有和她同房，等她生了儿子</mark></strong>〔有古卷作『等他生了头胎的儿子』〕，就给他起名叫耶稣。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/1/#L25">太 1:25</a>)</p></blockquote><p>“没有和她同房，等她生了儿子”这话，并不意味着基督生下之后“就同房了”。这是圣经中常见的表达方式，并不表示后来有了改变。</p><p>例如：</p><blockquote><p>“凡我所吩咐你们的，都教训他们遵守，<strong><mark>我就常与你们同在，直到世界的末了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/28/#L20">太 28:20</a>)</p></blockquote><p>——而在世界终结之后，基督显然仍将与信他的人同在。</p><blockquote><p>“耶稣对他们说：「光在你们中间还有不多的时候，应当趁着有光行走，免得黑暗临到你们；那在黑暗里行走的，不知道往何处去。 <strong><mark>你们应当趁着有光，信从这光</mark></strong>，使你们成为光明之子。」耶稣说了这话，就离开他们，隐藏了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/12/#L35-36">约 12:35-36</a>)</p></blockquote><p>——而在基督升天之后，也应当信光（信基督）；</p><blockquote><p>“<strong><mark>因为基督必要作王，等上帝把一切仇敌都放在他的脚下</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/15/#L25">林前 15:25</a>)</p></blockquote><p>——而在仇敌被放在脚下之后，基督显然仍要作王（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/1/#L33">路 1:33</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/2pet/1/#L11">彼后 1:11</a>）。</p><blockquote><p>“（大卫的诗。）耶和华对我主说：「<strong><mark>你坐在我的右边</mark></strong>，<strong><mark>等我使你仇敌作你的脚凳</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/110/#L1">诗 110:1</a>)</p></blockquote><p>——而在仇敌被放在脚下之后，基督显然仍坐在父的右边，即仍要作王。</p><blockquote><p>“至于你们推雅推喇其余的人，就是一切不从那教训，不晓得他们素常所说撒但深奥之理的人，我告诉你们，我不将别的担子放在你们身上。 <strong><mark>但你们已经有的，总要持守，直等到我来</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/2/#L24-25">启 2:24-25</a>)</p></blockquote><p>——而在基督再来之后，显然仍须持守美德和信仰。</p><blockquote><p>“<strong><mark>扫罗的女儿米甲，直到死日，没有生养儿女</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2ts/6/#L23">撒下 6:23</a>)</p></blockquote><p>——而在她死后，米甲显然也没有生养儿女。</p><p>还应注意圣经中的这些地方：</p><blockquote><p>“『看哪，我的仆人，我所拣选、所亲爱、心里所喜悦的，我要将我的灵赐给他，他必将公理传给外邦。 他不争竞，不宣嚷．街上也没有人听见他的声音。 <strong><mark>压伤的芦苇，他不折断</mark></strong>；将残的灯火，他不吹灭。<strong><mark>等他施行公理，叫公理得胜</mark></strong>；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/12/#L18-20">太 12:18-20</a>)</p></blockquote><h3>“生了头胎的儿子——就是说还有别的孩子？”</h3><p>圣经称上帝之母的儿子为头胎的：</p><blockquote><p>“只是没有和她同房，<strong><mark>等她生了儿子〔有古卷作『等他生了头胎的儿子』〕</mark></strong>，就给他起名叫耶稣。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/1/#L25">太 1:25</a>)</p></blockquote><blockquote><p>“<strong><mark>就生了头胎的儿子</mark></strong>，用布包起来，放在马槽里，因为客店里没有地方。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/2/#L7">路 2:7</a>)</p></blockquote><p>（*在西奈和梵蒂冈抄本中没有“头胎”一词；不过这个词在路 2:7 中有。*）</p><p>教会教训的反对者认为这是指童贞女马利亚还有别的儿女，说：“既然有头胎的，就是说还有别的孩子。”圣经自己表明这种想法是错误的。</p><p>上帝自己在圣经中给“头胎的”一词下了定义——<strong>凡开胎的</strong>：</p><blockquote><p>“他们所有奉给耶和华的，连人带牲畜，<strong><mark>凡头生的都要归给你</mark></strong>；只是人头生的，总要赎出来；不洁净牲畜头生的，也要赎出来。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/18/#L15">民 18:15</a>)</p></blockquote><blockquote><p>“<strong><mark>凡头生的都是我的</mark></strong>；一切牲畜头生的，无论是牛是羊，公的都是我的。 头生的驴要用羊羔代赎，若不代赎，就要打折牠的颈项。<strong><mark>凡头生的儿子都要赎出来</mark></strong>。谁也不可空手朝见我。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/34/#L19-20">出 34:19-20</a>)</p></blockquote><p>一切头胎的都属于上帝，因此：</p><ol><li><p>人的头胎的必须被带到圣殿，从司祭手中赎出来。</p></li><li><p>洁净牲畜的头胎的被带到圣殿献上，被杀，作为祭物献给上帝。</p></li><li><p>不洁净牲畜的头胎的不能作祭物，所以必须赎出来。</p></li></ol><p>人及牲畜一旦生下第一个孩子，就应献给上帝或赎出来。显而易见，就在这一时刻，这头生的孩子是独生的，然而上帝称之为头胎的，因为他开了胎。这意味着：<strong>凡独生的都是头胎的，但并非凡头胎的都是独生的</strong>。</p><p>而如果像反对教会教训的人那样想，认为只有那些有弟兄姊妹的才叫头胎的，那就得出：生了第一个孩子的人应当对司祭说：“等生了第二个，这个才能叫头胎的；现在他不是头胎的，而是独生的，所以我不必把他献给上帝、不必赎他。”然而连这种荒谬的想法也违背圣经和常识，因为独生的救主正是按这关于头胎的律法被带进圣殿的：</p><blockquote><p>“<strong><mark>按摩西律法满了洁净的日子</mark></strong>，<strong><mark>他们带着孩子上耶路撒冷去，要把他献与主</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/2/#L22">路 2:22</a>)</p></blockquote><p>显然，主耶稣基督在这里是<strong>独生</strong>的，但他被作为<strong>头胎的</strong>带进圣殿。这样，这里的“头胎的”，按上帝的话，指的是凡开胎的，并不表明母亲是否还有别的生育。详见注[2]。</p><h3>耶稣基督的弟兄们</h3><p>圣经说基督有弟兄们：</p><blockquote><p>“这不是木匠的儿子吗？他母亲不是叫马利亚吗？<strong><mark>他弟兄们不是叫雅各</mark></strong>、约西〔有古卷作『约瑟』〕、西门，犹大吗？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/13/#L55">太 13:55</a>)</p></blockquote><blockquote><p>“<strong><mark>因为连他的弟兄说这话，是因为不信他</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/7/#L5">约 7:5</a>)</p></blockquote><blockquote><p>“当下，<strong><mark>耶稣的母亲和弟兄来</mark></strong>，站在外边，打发人去叫他。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/3/#L31">可 3:31</a>)</p></blockquote><blockquote><p>“难道我们没有权柄娶信主的姊妹为妻，带着一同往来，<strong><mark>仿佛其余的使徒和主的弟兄，并矶法一样</mark></strong>吗？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/9/#L5">林前 9:5</a>)</p></blockquote><p>这里指的是约瑟前婚的儿女，或只是亲属。弟兄们——就是一般的亲属。例如，罗得是亚伯拉罕的侄子，但在圣经里也称为弟兄：</p><blockquote><p>“<strong><mark>又把亚伯兰的姪儿罗得</mark></strong>和罗得的财物掳掠去了。当时罗得正住在所多玛。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/14/#L12">创 14:12</a>)</p></blockquote><blockquote><p>“亚伯兰就对罗得说：「你我不可相争，你的牧人和我的牧人也不可相争，<strong><mark>因为我们是骨肉</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/13/#L8">创 13:8</a>)</p></blockquote><p>约瑟在马利亚被许配给他作保护者时已经年老，因为马利亚不能没有丈夫。如果基督由马利亚所生、而她没有已知的丈夫，那么按律法她应当被石头打死（<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/22/#L20-21">申 22:20-21</a>），因为所有的人都会以为她行了淫乱（婚外）之事。所以主这样安排：马利亚有丈夫，但她以奇妙的方式、不由丈夫、由圣灵的感孕而怀孕（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/1/#L18-25">太 1:18-25</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/1/#L34-35">路 1:34-35</a>）。</p><p>在耶稣的童年之后，经上再也没有提到约瑟；而童贞女马利亚陪伴耶稣基督直到末了——直到十字架的苦难（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/19/#L25-26">约 19:25-26</a>），并且在复活之后、五旬节那天也被提到（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/1/#L14">徒 1:14</a>）。</p><p>基督把自己的母亲托付给所爱的门徒——约翰（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/19/#L27">约 19:27</a>）。显然，那时约瑟已经去世。</p><p>这样，耶稣基督的“弟兄们”——只是一般的亲属，而完全不是童贞女马利亚的别的儿女。</p><p>而预言清楚地说明，从童贞女马利亚所生的只有主耶稣基督：</p><blockquote><p>“他又带我回到圣地朝东的外门；那门关闭了。 耶和华对我说：「<strong><mark>这门必须关闭，不可敞开</mark></strong>，<strong><mark>谁也不可由其中进入，因为耶和华以色列的上帝已经由其中进入，所以必须关闭</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iez/44/#L1-2">结 44:1-2</a>)</p></blockquote><h3>任何地方都没有说童贞女马利亚不信基督</h3><p>教会的批评者常常重复这样的想法：仿佛童贞女马利亚不信她的儿子是救主、是所应许的弥赛亚、是基督。但这不是真的。圣经里没有这样的话。说的只是弟兄们（约瑟前婚的儿女）不信基督：</p><blockquote><p>“<strong><mark>因为连他的弟兄说这话，是因为不信他</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/7/#L5">约 7:5</a>)</p></blockquote><p>这是相当可以预料的：他们是约瑟前婚的儿子，已经是成年人，见过少年耶稣长大。所以他们和基督的其他同乡（加利利居民）一样，难以相信（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/13/#L54-58">太 13:54-58</a>）。但后来弟兄们也信了（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/1/#L14">徒 1:14</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/1/#L19">加 1:19</a>）。</p><h3>王的母亲——王后</h3><p>批评者责备教会称上帝之母为王后。但王的母亲正是王后。</p><blockquote><p>“<strong>王后进去，站在你的右边</strong>” (<a href="https://bibleox.com/zh-Hans/cn-sb/prs/44/#L9">智 44:9</a>)</p></blockquote><p>使徒们曾被拒绝坐在基督国里他的右边和左边：</p><blockquote><p>“<strong><mark>只是坐在我的左右</mark></strong>，不是我可以赐的，<strong><mark>乃是为谁预备的，就赐给谁</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/10/#L40">可 10:40</a>)</p></blockquote><p>如果不是使徒们“坐”在那里，那是谁？在正教的“最后审判”圣像中，写在基督旁边的正是上帝之母（在右边）和先知施洗约翰（在左边）——作为妇人所生中最大的（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/11/#L11">太 11:11</a>）。</p><h3>“上帝之母，拯救我们”这句话</h3><p>这里需要正确理解意义。救主只有一位，而在拯救的事业中有许多同工者：</p><blockquote><p>“<strong><mark>因为我们是与上帝同工的</mark></strong>；你们是上帝所耕种的田地，所建造的房屋。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/3/#L9">林前 3:9</a>)</p></blockquote><p>使徒打算拯救人：</p><blockquote><p>“向软弱的人，我就作软弱的人，为要得软弱的人；<strong><mark>向什么样的人，我就作什么样的人</mark></strong>。<strong><mark>无论如何总要救些人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/9/#L22">林前 9:22</a>)</p></blockquote><blockquote><p>“<strong><mark>或者可以激动我骨肉之亲发愤</mark></strong>，<strong><mark>好救他们一些人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/11/#L14">罗 11:14</a>)</p></blockquote><p>妻子可以救丈夫，丈夫可以救妻子：</p><blockquote><p>“<strong><mark>你这作妻子的，怎么知道不能救你的丈夫呢</mark></strong>？<strong><mark>你这作丈夫的，怎么知道不能救你的妻子呢</mark></strong>？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/7/#L16">林前 7:16</a>)</p></blockquote><p>使徒呼召拯救人：</p><blockquote><p>“有些人存疑心，你们要怜悯他们； <strong><mark>有些人你们要从火中抢出来</mark></strong>、<strong><mark>搭救他们</mark></strong>；有些人你们要存惧怕的心怜悯他们；连那被情欲沾染的衣服也当厌恶。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iud/1/#L22-23">犹 1:22-23</a>)</p></blockquote><blockquote><p>“<strong><mark>你要谨慎自己和自己的教训</mark></strong>，要在这些事上恒心。因为这样行，<strong><mark>又能救自己，又能救听你的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/4/#L16">提前 4:16</a>)</p></blockquote><h3>“上帝之母的仆人”这句话</h3><p>这与拯救的情形相同。必须正确理解意义。</p><p>我们不把上帝之母当作上帝来事奉，但我们事奉她。如果上帝之母求我们什么事，我们会乐意为她效劳。难道可以想象基督徒会作别样的事吗？</p><p>圣经里有义人不但称自己为上帝的仆人——同时仍是独一上帝的仆人——也称自己为人的仆人的地方。</p><p>使徒们——是基督徒们的仆人：</p><blockquote><p>“我们原不是传自己，乃是传基督耶稣为主，<strong><mark>并且自己因耶稣作你们的仆人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/4/#L5">林后 4:5</a>)</p></blockquote><p>亚比该——敬畏上帝的人、庇护先知脱逃逼迫的人——称自己为先知以利亚的仆人，称以利亚为主人：</p><blockquote><p>“亚哈将他的家宰俄巴底召了来。俄巴底甚是敬畏耶和华。 耶洗别杀耶和华众先知的时候，俄巴底将一百个先知藏了，每五十人藏在一个洞里，拿饼和水供养他们。 &lt;…&gt; 俄巴底在路上恰与以利亚相遇，<strong><mark>俄巴底认出他来，就俯伏在地</mark></strong>，说：「<strong><mark>你是我主以利亚不是</mark></strong>？」 回答说：「是，你去告诉你主人说：『以利亚在这里。』」 俄巴底说：「仆人有什么罪，你竟要将我交在亚哈手里，使他杀我呢？ &lt;…&gt; 恐怕我一离开你，耶和华的灵就提你到我所不知道的地方去。这样，我去告诉亚哈，他若找不着你，就必杀我。<strong><mark>仆人却是自幼敬畏耶和华的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/18/#L3-4,7-9,12">王上 18:3-4,7-9,12</a>)</p></blockquote><h3>上帝之母在安葬之后复活了</h3><p>敬礼上帝之母的人的反对者，反对正教会关于主耶稣基督使自己的母亲复活的圣传，仿佛这是不可能的，以为只有基督复活了。然而从圣经的角度，这没有任何困难：因为基督复活之后，许多圣徒复活了（无论我们怎样理解这复活的性质）：</p><blockquote><p>“忽然，殿里的幔子从上到下裂为两半，地也震动，磐石也崩裂， <strong><mark>坟墓也开了</mark></strong>，<strong><mark>已睡圣徒的身体，多有起来的</mark></strong>。 <strong><mark>到耶稣复活以后，他们从坟墓里出来</mark></strong>，<strong><mark>进了圣城，向许多人显现</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/27/#L51-53">太 27:51-53</a>)</p></blockquote><p>如果主在自己的复活中使许多圣徒复活，那他更能使自己的亲生母亲复活——他为道成肉身而拣选了她，行奇迹时听了她，并关怀她、把她托付给所爱的门徒。</p><p>为证实上帝之母复活的圣传，还应注意：既然教会从最古老的年代起就以这样的敬畏对待圣人的圣髑（详见<a href="https://bibleox.com/ru/ru/w/почитание-мощей-цитаты-святых">敬礼圣髑的引文</a>），那么教会没有上帝之母的圣髑，正如没有主耶稣基督的圣髑（因为他复活了）。</p>
