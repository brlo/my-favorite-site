    body: |-
      <h2>0</h2><p>坡旅甲和与他同在的众司祭，致在腓立比寄居的上帝的教会：愿你们从全能的上帝和我们的救主耶稣基督所得的怜悯与平安丰丰富富地加增。</p><h2>1</h2><p>1. 我在主耶稣基督里大大地与你们一同欢喜，因为你们接待了真爱的样式[1]，又照着你们所当行的，护送了那些身系圣洁可敬锁链的人；这些锁链实在是真实蒙上帝和我们的主所拣选之人的冠冕；</p><p>2. 也因为你们信仰的坚固之根——从起初的时代就已显明，直到如今仍然长存，并结出果子归给我们的主耶稣基督；祂为着我们的罪，受苦直到死亡，上帝却使祂复活，解开了阴间的阵痛[2]；</p><p>3. 你们虽然没有见过祂，却信祂，就有说不出来、满有荣光的大喜乐[3]——许多人渴望进入这喜乐——你们知道，你们得救是本乎恩，并不是出于行为，乃是出于上帝的旨意，借着耶稣基督[4]。</p><h2>2</h2><p>1. 所以，要束上你们的腰[5]，存着敬畏与真实事奉上帝，抛弃虚妄的空谈和众人的迷惑，信靠那位使我们的主耶稣基督从死里复活、又赐给祂荣耀和宝座、立祂在自己右边的[6]：天上和地上的一切都服在祂之下，一切有气息的都事奉祂；祂要来审判活人死人，上帝必向不信从祂的人追讨祂的血。</p><p>2. 使祂从死里复活的那一位，也必使我们复活，只要我们遵行祂的旨意，行在祂的诫命中，爱祂所爱的：远离一切的不义、贪心、贪财、毁谤、作假见证；不以恶报恶，不以辱骂还辱骂，不以拳还拳，不以咒骂还咒骂[7]；</p><p>3. 又要记念主教导的话：“你们不要论断人，免得你们被论断。你们要饶恕人，就必蒙饶恕；你们要怜悯人，就必蒙怜悯。你们用什么量器量给人，也必用什么量器量给你们。贫穷的人和为义受逼迫的人是有福的，因为上帝的国是他们的。”[8]</p><h2>3</h2><p>1. 弟兄们，这些关于义的话，我并不是凭自己冒昧地写给你们，而是因为你们先前邀请了我。</p><p>2. 因为我，或任何像我一样的人，都无法追随那位配受称颂、满有荣耀的保罗[9]的智慧；他亲身来到你们中间，向当时的人准确地、坚定地教导真理的道；他离开你们之后，又写信给你们。你们若进到这些书信里，就能够在所赐给你们的信仰上被建造起来[10]；</p><p>3. 这信仰是我们众人的母亲[11]，盼望伴随着它，对上帝、对基督和对邻舍的爱在它前面引领。因为人若常在这三者里面，就已经完全了义的诫命；凡有爱的，就远离一切的罪。</p><h2>4</h2><p>1. “贪财是万般祸患的开端”[12]。所以，既然知道我们没有带什么到世上来，也不能带什么去[13]，就当用公义的兵器武装自己，首先教导自己行在主的诫命中[14]；</p><p>2. 然后又教导我们的妻子：要在所赐给她们的信仰、爱与圣洁中，全然真诚地爱自己的丈夫；又教导她们以全然的节制平等地爱众人；还要以敬畏上帝的教养养育儿女[15]；</p><p>3. 又教导寡妇：要对主的信仰持守健全的心思，不住地为众人祈求，远离一切的毁谤、谗言、假见证、贪财和各样的恶；要知道她们是上帝的祭坛，一切都受到察看，没有一样心思、意念或心里的隐秘能向祂隐藏。</p><h2>5</h2><p>1. 所以，既然知道上帝是不可轻慢的[16]，我们就应当行事为人配得祂的诫命和荣耀。</p><p>2. 同样，辅祭也当在祂面前，在义上无可指摘，作上帝和基督的仆人，而不是人的仆人[17]：不毁谤人，不一口两舌，不贪财，凡事节制，仁慈，殷勤，行在主的真理中——祂自己成了众人的仆人。我们若在今世讨祂喜悦，就必得着那将来的，正如祂应许要使我们从死里复活；如果我们行事为人配得祂，并且确实相信[18]，就必与祂一同作王。</p><p>3. 同样，年幼的也当在一切事上无可指摘，首先顾念圣洁，勒住自己脱离各样的恶。在这个世界上克制自己、远离私欲是美好的，因为私欲是与灵争战的[19]；“淫乱的、作娈童的、亲男色的……都不能承受上帝的国”，凡行这些可憎之事的人也是如此[20]。所以，必须远离这一切，顺服司祭们和辅祭们，如同顺服上帝和基督；童女们则当以无可指摘、纯洁的良心行事为人。</p><h2>6</h2><p>1. 司祭们也当仁慈，怜悯众人，回转那迷失了道路的人，探望一切软弱的人，不可疏忽寡妇、孤儿或穷人；要在上帝和人面前常常顾念美善的事[21]，远离一切的怒气、偏心、枉法的判断，远离一切的贪财；不要轻易听信对人的指控，断事不要急躁，要知道我们众人都是欠了罪的债的人。</p><p>2. 我们既然求主饶恕我们，也应当饶恕别人[22]；因为我们都在主和上帝的眼目面前，人人都必须站在基督的审判台前，各人为自己向祂交代[23]。</p><p>3. 这样，我们就当存着敬畏和一切虔诚事奉祂，正如祂自己所吩咐的，也如传福音给我们的众使徒和众先知——他们预先宣讲了我们主的来临——所吩咐的：要热心于美善的事，远离绊脚石、假弟兄，以及那些假冒为善地带着主的名、把虚空的人引入迷途的人。</p><h2>7</h2><p>1. 因为凡不认耶稣基督是成了肉身来的，就是敌基督的[24]；凡不认十字架的见证的，就是出于魔鬼的；凡按自己的私欲歪曲主的言语、又说没有复活也没有审判的，这人就是撒但的长子。</p><p>2. 所以，让我们抛弃众人的虚妄和虚假的教训，回转到那从起初传给我们的道上；在祷告中警醒[25]，恒切禁食，恳求那鉴察万有的上帝不叫我们遇见试探[26]，正如主所说的：“心灵固然愿意，肉体却软弱了。”[27]</p><h2>8</h2><p>1. 所以，让我们不住地持守我们的盼望和我们公义的凭据——就是基督耶稣：祂亲自把我们的罪担在祂的身体上、担到木头上[28]；祂没有犯过罪，祂口中也找不到诡诈[29]；却是为了我们——使我们能在祂里面活着——忍受了一切。</p><p>2. 所以，让我们作祂忍耐的效法者；如果我们为祂的名受苦，就归荣耀给祂。因为祂亲自给我们立了这个榜样，我们也信了这话。</p><h2>9</h2><p>1. 所以，我劝你们众人顺服义的道，操练各样的忍耐——这是你们亲眼在配受称颂的伊格那丢[30]、琐西谟[31]、鲁孚[32]身上，也在你们中间其他的人身上，更在保罗本人和其余的使徒身上看见过的；</p><p>2. 要确信：他们这一切人都不是徒然奔跑，乃是存着信与义奔跑，如今他们在主那里，已经得了他们当得的位置，正如他们曾与祂一同受苦一样。因为他们所爱的，不是这个现今的世代，而是那位为他们死、又为他们被上帝使祂复活的主[33]。</p><h2>10</h2><p>1. 所以，你们要在这些事上站立得稳，并效法主的榜样：在信仰上坚固不动摇，爱弟兄，彼此相爱，在真理里联合，以主的温柔彼此相待，不轻看任何一个人。</p><p>2. 你们能行善的时候，不要拖延，因为施舍能救人脱离死亡[34]。你们众人要彼此顺服，在外邦人中行事为人无可指摘[35]，好叫你们因自己的善行得着称赞，主的名也不因你们而受毁谤。</p><p>3. 那使主的名受毁谤的人有祸了。所以，你们要教导众人持守节制的心，你们自己也是这样行事为人的。</p><h2>11</h2><p>1. 我为瓦伦斯[36]极其忧伤；他曾在你们中间作过司祭，竟然这样不认识赐给他的职位。所以我劝你们要远离贪心，作纯洁、诚实的人。你们要远离一切的恶。</p><p>2. 但是，谁若在这些事上不能管束自己，他怎能向别人宣讲这些事呢？人若不能克制贪心，就被偶像崇拜所玷污，要像不认识主审判的外邦人一样受审判。难道我们不知道圣徒要审判世界吗，正如保罗所教导的[37]？</p><p>3. 但我在你们中间没有察觉这样的事，也没有听说过；你们是那配受称颂的保罗劳苦作工过的教会，他在书信的开头就提到你们[38]。他为你们在众教会中夸口——那些教会当时唯有他们认识主；我们那时还没有认识[39]。</p><p>4. 所以，弟兄们，我为他和他的妻子极其忧伤；愿主赐给他们真实的悔改。你们在这件事上也当持守清醒的心，不要把他们当作仇敌[40]，而要把他们当作会受苦、会走迷的肢体，把他们挽回过来，好叫你们众人的身体都得着拯救。你们这样行，就是在建造你们自己[41]。</p><h2>12</h2><p>1. 我深信你们在圣经典籍上受过良好的操练，没有什么向你们隐藏；至于我，却没有得着这样的恩赐。只是，正如这些经卷上所说的：“生气却不要犯罪”，“不要让太阳在你们的怒气中落下”[42]。记得这话的人是有福的——我相信你们就是这样的人。</p><p>2. 愿我们主耶稣基督的上帝和父——祂自己就是永恒的大司祭，上帝的儿子耶稣基督——在信仰和真理中，在一切温柔、无怒气、忍耐、恒忍、宽容和贞洁中建立你们；愿祂赐给你们一个位置和一份产业，列在祂的众圣徒中间，也赐给我们、你们，以及一切住在天下、将要信我们的主、上帝耶稣基督，并信那位使祂从死里复活的父的人[43]。</p><p>3. 要为众圣徒祷告。也要为君王、掌权者和首领祷告，甚至为逼迫你们、恨你们的人和十字架的仇敌祷告，好叫你们的果子在众人面前显明出来，叫你们在祂里面得以完全[44]。</p><h2>13</h2><p>1. 你们和伊格那丢都写信给我，说如果有人往叙利亚去，也要把你们的信带去[45]；我或者自己，或者派一个使者去，也会为你们这样行，只要我找到合适的机会。</p><p>2. 伊格那丢寄给我们的书信，以及我们手中其他的书信，我们已经照你们的吩咐寄给你们了；它们附在这封信的后面[46]，你们可以从中得到极大的益处，因为其中有信仰、有忍耐，还有一切与我们主相称的造就。至于伊格那丢本人和与他同行的人，你们若得知更确实的消息，请告诉我们。</p><h2>14</h2><p>1. 这封信是我借着革勒士[47]写给你们的；我从前曾把他推荐给你们，如今又推荐一次。他在我们中间行事为人无可指摘；我相信他在你们中间也会同样。他的妹妹来到你们那里时，你们也要好好地接待她。愿你们在主耶稣基督的恩典里，与你们所有的人一起平安无事。阿们。</p>
    references: |-
      <ol><li><p>τὰ μιμήματα τῆς ἀληθοῦς ἀγάπης，“真爱的样式/复本”。指腓立比教会接待并护送押往罗马殉道的信徒（参<a href="#HH-13">第13章</a>；伊格那丢一行在途中经过腓立比）。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/act/2/#L24">徒 2:24</a>。使徒行传的希腊文本作“死亡的痛苦”（ὠδῖνας τοῦ θανάτου），坡旅甲在这里作“阴间的阵痛”（τὰς ὠδῖνας τοῦ ᾅδου）。和合本：“上帝却将死的痛苦解释了，叫他复活，因为他原不能被死拘禁。”</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/1/#L8">彼前 1:8</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/2/#L8-9">弗 2:8-9</a>。</p></li><li><p>“束上腰”（ἀναζωσάμενοι τὰς ὀσφύας）：用语出自<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/1/#L13">彼前 1:13</a>，但彼得前书作“束上你们心里的腰”（τὰς ὀσφύας τῆς διανοίας，和合本译作“约束你们的心”），坡旅甲在这里省去了“心里的”几个字。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/1/#L21">彼前 1:21</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/3/#L9">彼前 3:9</a>。</p></li><li><p>这段主的话综合自<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/7/#L1">太 7:1</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L37-38">路 6:37-38</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L3">太 5:3</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L10">太 5:10</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L20">路 6:20</a>。坡旅甲按自己的记忆引述，措辞与和合本略有出入：和合本太 7:1“你们不要论断人，免得你们被论断”；路 6:37“你们要饶恕人，就必蒙饶恕”；太 5:3“虚心的人有福了，因为天国是他们的”；太 5:10“为义受逼迫的人有福了，因为天国是他们的”；路 6:20“你们贫穷的人有福了，因为上帝的国是你们的”。</p></li><li><p>希腊文：τοῦ μακαρίου καὶ ἐνδόξου Παύλου，“那配受称颂、满有荣耀的保罗”。</p></li><li><p>保罗在腓立比建立教会（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/16/#L11-40">徒 16:11-40</a>），《腓立比书》也是写给他们的。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/4/#L26">加 4:26</a>：“但那在上的耶路撒冷是自主的，她是我们的母。”</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/6/#L10">提前 6:10</a>（“贪财是万恶之根”）。坡旅甲的措辞稍异：“万般祸患的开端”（ἀρχὴ πάντων χαλεπῶν）。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/6/#L7">提前 6:7</a>。</p></li><li><p>“公义的兵器”：参见<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/6/#L13-17">弗 6:13-17</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/6/#L4">弗 6:4</a>：“你们作父亲的，不要惹儿女的气，只要照着主的教训和警戒养育他们。”</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/6/#L7">加 6:7</a>：“不要自欺，上帝是轻慢不得的。”</p></li><li><p>辅祭（διάκονος）一词原意是“仆人、服事者”。这里说辅祭与基督一样作“上帝的仆人”，而不是人的仆人（参见<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/20/#L26-28">太 20:26-28</a>）。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/2/#L12">提后 2:12</a>：“我们若能忍耐，也必和他一同作王。”</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/2/#L11">彼前 2:11</a>（“这私欲是与灵魂争战的”）。希腊文的 πνεῦμα 此处作“灵”，和合本译作“灵魂”。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/6/#L9-10">林前 6:9-10</a>。坡旅甲引述的是其中的一部分；和合本：“无论是淫乱的、拜偶像的、奸淫的、作娈童的、亲男色的……都不能承受上帝的国。”</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/12/#L17">罗 12:17</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/8/#L21">林后 8:21</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/6/#L12">太 6:12</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/6/#L14">太 6:14</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/5/#L10">林后 5:10</a>（“因为我们众人必要在基督台前显露出来，叫各人按着本身所行的，或善或恶受报”）与<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/14/#L10-12">罗 14:10-12</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/2in/1/#L7">约贰 1:7</a>（“他们不认耶稣基督是成了肉身来的”）与<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/4/#L3">约壹 4:3</a>。这里针对的是不承认基督取了真实肉身的幻影说派（docetae）。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/4/#L7">彼前 4:7</a>：“你们要谨慎自守，警醒祷告。”</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/6/#L13">太 6:13</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/26/#L41">太 26:41</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/14/#L38">可 14:38</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/2/#L24">彼前 2:24</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/2/#L22">彼前 2:22</a>。</p></li><li><p>伊格那丢（约35–107年），安提阿的主教，在押往罗马殉道途中经过亚细亚，写有七封书信；坡旅甲与他在士每拿相识。书信中文译文见本站<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4A_安提阿的伊格那丢一世纪">安提阿的伊格那丢</a>。</p></li><li><p>琐西谟（Zosimus）和下文的鲁孚（Rufus），是与伊格那丢同行的基督徒，腓立比人认识他们的忍耐。</p></li><li><p>鲁孚：参见<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/16/#L13">罗 16:13</a>（“又问在主蒙拣选的鲁孚和他母亲安”）。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/8/#L34">罗 8:34</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/15/#L3-4">林前 15:3-4</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/tov/4/#L10">多 4:10</a>；12:9：“因为施舍能救人脱免死亡”（思高本）。此句出自次经《多俾亚传》，和合本没有收录次经；当时教会普遍以七十士译本为圣经，次经在其中。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/2/#L12">彼前 2:12</a>。</p></li><li><p>瓦伦斯（Valens）：腓立比教会从前的一位司祭，因贪财跌倒。坡旅甲恳请教会挽回他，不要把他当作仇敌。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/6/#L2">林前 6:2</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/fil/1/#L3-5">腓 1:3-5</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/fil/2/#L12-16">腓 2:12-16</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/fil/4/#L15-16">腓 4:15-16</a>。</p></li><li><p>这句话表明《致腓立比人书》的写作时间：保罗传道时的教会已经很多，而坡旅甲所在的士每拿教会当时尚未建立。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/2sol/3/#L15">帖后 3:15</a>：“但不要以他为仇人，要劝他如弟兄。”</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/12/#L25-26">林前 12:25-26</a>。</p></li><li><p>“生气却不要犯罪”“不可含怒到日落”：<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/4/#L26">弗 4:26</a>。其中“生气却不要犯罪”出自诗篇：和合本按希伯来文编号与措辞译作<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/4/#L4">诗 4:4</a>“你们应当畏惧，不可犯罪”；七十士译本在此节作“生气，却不要犯罪”，编号为诗 4:5。</p></li><li><p>拉丁文原文此句较晦涩：“…et nobis vobiscum et omnibus, qui sunt sub caelo, qui credituri sunt in dominum nostrum et deum Iesum Christum et in ipsius patrem, qui resuscitavit eum a mortuis”——愿位置和产业赐给你们，也赐给我们和一切住在天下、将要信我们的主和上帝耶稣基督并信祂父（使祂从死里复活的那位）的人。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L43-48">太 5:43-48</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L27-36">路 6:27-36</a>。</p></li><li><p>尤西比乌《教会史》第3卷第36章逐字引用了这两句话。</p></li><li><p>因此，本站<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4A_安提阿的伊格那丢一世纪">伊格那丢的七封书信</a>得以随这封书信的传抄保存下来。</p></li><li><p>革勒士（Crescens）：参见<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/4/#L10">提后 4:10</a>：“革勒士往加拉太去。”</p></li></ol>
      <p>翻译：罗季翁·弗拉索夫（借助人工智能工具）。底本：希腊文原文（<a href="https://bibleox.com/zh-Hans/grc/w/Επιστολή-Πολυκάρπου-προς-Φιλιππησίους">本站的希腊文版本</a>，据 Kirsopp Lake 校勘本）。第10–12章、第13章末和第14章的希腊文原文佚失，只存古拉丁文译本，此处据拉丁文译出。参考：俄文译本（《早期教父文选》，布鲁塞尔，1988年）、英文译本（Roberts–Donaldson）。圣经链接指向本站的和合本（上帝版），次经出处指向思高本。翻译原则：作者引述圣经时按他自己所用文本的字句译出（大体上即七十士译本），与和合本措辞不同处在注中说明并附和合本链接；术语与译名沿用伊格那丢书信中文译本（司祭、辅祭、大司祭、上帝等）；段落编号依希腊文原文的章–段划分，便于按章节引用。</p>
