  path: QSh1A_有趣的动物
  title: 有趣的动物
  copy_cover: true
  body: <p>会飞的蛇，下蛋：</p><blockquote><p>“论南方牲畜的默示：他们把财物驮在驴驹的脊背上，将宝物驮在骆驼的肉鞍上，经过艰难困苦之地，就是公狮、母狮、蝮蛇、<strong><mark>火焰的飞龙</mark></strong>之地，往那不利于他们的民那里去。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/30/#L6">赛 30:6</a>)</p></blockquote><blockquote><p>“<strong><mark>箭蛇要在那里作窝、下蛋、菢蛋、生子，聚子在其影下</mark></strong>；鹞鹰各与伴偶聚集在那里。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/34/#L15">赛 34:15</a>)</p></blockquote><blockquote><p>“非利士全地啊，不要因击打你的杖折断就喜乐。因为<strong><mark>从蛇的根必生出毒蛇．牠所生的，是火焰的飞龙</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/14/#L29">赛 14:29</a>)</p></blockquote><p>在水里有羽毛的动物：</p><blockquote><p>“水中可吃的乃是这些：<strong><mark>凡有翅有鳞的都可以吃</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/14/#L9">申 14:9</a>)</p></blockquote><p>有翅膀的爬虫：</p><blockquote><p>“<strong><mark>凡有翅膀爬行的物，是与你们不洁净，都不可吃</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/14/#L19">申 14:19</a>)</p></blockquote><p>河马——按描述类似恐龙：</p><blockquote><p>“<strong><mark>你且观看河马</mark></strong>。我造你也造他，他吃草与牛一样。 牠的气力在腰间，能力在肚腹的筋上。 <strong><mark>牠摇动尾巴如香柏树</mark></strong>，牠大腿的筋互相联络。 牠的骨头好像铜管，牠的肢体仿佛铁棍。 他在上帝所造的物中为首，创造他的给他刀剑。 &lt;…&gt; 莲叶的阴凉遮蔽他；溪旁的柳树环绕牠。 河水泛滥，牠不发战，就是约但河的水涨到他口边，也是安然。 在牠防备的时候，谁能捉拿牠？谁能牢笼牠、穿牠的鼻子呢？」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iov/40/#L15-19,22-24">伯 40:15-19,22-24</a>)</p></blockquote><p>利维坦——按描述类似恐龙：</p><blockquote><p>“<strong><mark>你能用鱼钩钓上鳄鱼吗</mark></strong>？能用绳子压下牠的舌头吗？ 你能用绳索穿牠的鼻子吗？能用钩穿牠的腮骨吗？ 牠岂向你连连恳求，说柔和的话吗？ 岂肯与你立约，使你拿他永远作奴仆吗？ 你岂可拿他当雀鸟玩耍吗？岂可为你的幼女将他拴住吗？ 搭伙的渔夫，岂可拿他当货物吗？能把他分给商人吗？ <strong><mark>你能用倒钩枪扎满牠的皮，能用鱼叉叉满牠的头吗</mark></strong>？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iov/41/#L1-7">伯 41:1-7</a>) <em>(和合本作「鳄鱼」，七十士译本作「利维坦」（海中巨兽）。)</em></p></blockquote><blockquote><p>“<strong><mark>人指望捉拿牠是徒然的；一见牠，岂不丧胆吗</mark></strong>？ 没有那么兇猛的人敢惹牠．这样，谁能在我面前站立得住呢？ 谁先给我什么，使我偿还呢？天下万物都是我的。 <strong><mark>论到鳄鱼的肢体和其大力，并美好的骨格，我不能缄默不言</mark></strong>。 <strong><mark>谁能剥牠的外衣</mark></strong>？<strong><mark>谁能进牠上下牙骨之间呢</mark></strong>？ <strong><mark>谁能开牠的腮颊？牠牙齿四围是可畏的</mark></strong>。 <strong><mark>牠以坚固的鳞甲为可夸</mark></strong>，<strong><mark>紧紧合闭，封得严密</mark></strong>。 <strong><mark>这鳞甲一一相连，甚至气不得透入其间</mark></strong>， <strong><mark>都是互相联络、胶结，不能分离</mark></strong>。 <strong><mark>牠打喷嚏，就发出光来</mark></strong>；<strong><mark>牠眼睛好像早晨的光线</mark></strong>。 <strong><mark>从牠口中发出烧着的火把，与飞迸的火星</mark></strong>； <strong><mark>从牠鼻孔冒出烟来</mark></strong>，如烧开的锅和点着的芦苇。 <strong><mark>牠的气点着煤炭，有火焰从他口中发出</mark></strong>。 <strong><mark>牠颈项中存着劲力，在牠面前的都恐吓蹦跳</mark></strong>。 牠的肉块互相联络，紧贴其身，不能摇动。 <strong><mark>牠的心结实如石头，如下磨石那样结实</mark></strong>。 <strong><mark>牠一起来，勇士都惊恐</mark></strong>．心里慌乱，便都昏迷。 <strong><mark>人若用刀，用枪，用标枪，用尖枪扎牠，都是无用</mark></strong>。 <strong><mark>牠以铁为干草，以铜为烂木</mark></strong>。 箭不能恐吓牠使牠逃避；<strong><mark>弹石在牠看为碎秸</mark></strong>， <strong><mark>棍棒算为禾稭；牠嗤笑短枪飕的响声</mark></strong>。 牠肚腹下如尖瓦片，牠如钉耙经过淤泥。 <strong><mark>牠使深渊开滚如锅，使洋海如锅中的膏油</mark></strong>。 <strong><mark>牠行的路随后发光，令人想深渊如同白发</mark></strong>。 <strong><mark>在地上没有像他造的那样，无所惧怕</mark></strong>。 <strong><mark>凡高大的，牠无不藐视</mark></strong>；<strong><mark>牠在骄傲的水族上作王</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iov/41/#L9-34">伯 41:9-34</a>) <em>(本段俄文本编号为 Иов 41:1,4-26（编号相差八节）。)</em></p></blockquote>
