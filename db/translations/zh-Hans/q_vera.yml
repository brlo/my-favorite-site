  body: <p>这里说的是那些想要孩子、却因不育而不能有的人：</p><blockquote><p>“<strong>荒胎无罪，而又不知床第罪恶的妇女，是有福的；到灵魂受眷顾的时候，她必富有果实。</strong>” (<a href="https://bibleox.com/zh-Hans/cn-sb/prs/3/#L13">智 3:13</a>)</p></blockquote><blockquote><p>“更好是<strong>无子而有道德</strong>，因为道德的记念，永存不朽，<strong>常为天主和世人所赏识</strong>” (<a href="https://bibleox.com/zh-Hans/cn-sb/prs/4/#L1">智 4:1</a>)</p></blockquote>
