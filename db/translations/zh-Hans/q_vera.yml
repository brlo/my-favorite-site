  title: 预定（命运）
  copy_cover: true
  body: <h2>上帝愿意人人得救</h2><blockquote><p>“这是好的，在上帝我们救主面前可蒙悦纳。 <strong><mark>他愿意万人得救</mark></strong>，明白真道。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/2/#L3-4">提前 2:3-4</a>)</p></blockquote><blockquote><p>“还是你藐视他丰富的恩慈、宽容、忍耐，不晓得<strong><mark>他的恩慈是领你悔改</mark></strong>呢？ <strong><mark>你竟任着你刚硬不悔改的心</mark></strong>，为自己积蓄忿怒，以致上帝震怒，显他公义审判的日子来到。 他必照各人的行为报应各人。 凡<strong><mark>恒心行善</mark></strong>，寻求荣耀、尊贵和不能朽坏之福的，就以<strong><mark>永生</mark></strong>报应他们； 惟有结党不顺从真理，反顺从不义的，就以忿怒、恼恨报应他们。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/2/#L4-8">罗 2:4-8</a>)</p></blockquote><h2>救恩不是强制发生的，而是向寻求的人敞开</h2><blockquote><p>“<strong><mark>人非有信，就不能得上帝的喜悦</mark></strong>；因为到上帝面前来的人，必须信有上帝，<strong><mark>且信他赏赐那寻求他的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/11/#L6">希 11:6</a>)</p></blockquote><blockquote><p>“<strong><mark>我曾寻求耶和华，他就应允我</mark></strong>；救我脱离了一切的恐惧。 <strong><mark>凡仰望他的，便有光荣</mark></strong>；他们的脸，必不蒙羞。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/34/#L4-5">诗 34:4-5</a>)</p></blockquote><blockquote><p>“爱我的，我也爱他；<strong><mark>恳切寻求我的，必寻得见</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/8/#L17">箴 8:17</a>)</p></blockquote><blockquote><p>“我儿所罗门哪，你当认识耶和华你父的上帝，诚心乐意地事奉他。因为他鉴察众人的心，知道一切心思意念。<strong><mark>你若寻求他，他必使你寻见</mark></strong>；你若离弃他，他必永远丢弃你！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1par/28/#L9">代上 28:9</a>)</p></blockquote><blockquote><p>“还是你藐视他丰富的恩慈、宽容、忍耐，不晓得<strong>他的恩慈是领你悔改</strong>呢？ <strong><mark>你竟任着你刚硬不悔改的心</mark></strong>，为自己积蓄忿怒，以致上帝震怒，显他公义审判的日子来到。 他必照各人的行为报应各人。 凡<strong><mark>恒心行善</mark></strong>，寻求荣耀、尊贵和不能朽坏之福的，就以<strong><mark>永生</mark></strong>报应他们； 惟有结党不顺从真理，反顺从不义的，就以忿怒、恼恨报应他们。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/2/#L4-8">罗 2:4-8</a>)</p></blockquote><h2>上帝怜惜罪人的灭亡，尽力拯救他们之中尽可能多的人</h2><blockquote><p>“主耶和华说，<strong><mark>恶人死亡，岂是我喜悦的吗</mark></strong>？<strong><mark>不是喜悦他回头离开所行的道存活吗</mark></strong>？ &lt;…&gt; 你们还说：『主的道不公平！』以色列家啊，你们当听，<strong><mark>我的道岂不公平吗</mark></strong>？<strong><mark>你们的道岂不是不公平吗</mark></strong>？ &lt;…&gt; 所以主耶和华说，以色列家阿，我必按你们各人所行的审判你们。<strong><mark>你们当回头离开所犯的一切罪过</mark></strong>。这样，罪孽必不使你们败亡。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iez/18/#L23,25,30">结 18:23,25,30</a>)</p></blockquote><blockquote><p>“你对他们说：『主耶和华说：我指着我的永生起誓，我断不喜悦恶人死亡，<strong><mark>惟喜悦恶人转离所行的道而活</mark></strong>。以色列家阿，<strong><mark>你们转回，转回吧</mark></strong>！<strong><mark>离开恶道，何必死亡呢</mark></strong>？』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iez/33/#L11">结 33:11</a>)</p></blockquote><blockquote><p>“耶稣对他们说：「无病的人用不着医生，<strong><mark>有病的人才用得着</mark></strong>； 我来本不是召义人悔改，<strong><mark>乃是召罪人悔改</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/5/#L31-32">路 5:31-32</a>)</p></blockquote><blockquote><p>“主所应许的尚未成就，有人以为他是耽延，其实不是耽延，<strong><mark>乃是宽容你们</mark></strong>，<strong><mark>不愿有一人沉沦，乃愿人人都悔改</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2pet/3/#L9">彼后 3:9</a>)</p></blockquote><h2>人灭亡，是由于自己不愿意把自己的意志转向上帝</h2><blockquote><p>“耶路撒冷啊，耶路撒冷啊！你常杀害先知，又用石头打死那奉差遣到你这里来的人。<strong><mark>我多次愿意聚集你的儿女</mark></strong>，好像母鸡把小鸡聚集在翅膀底下，<strong><mark>只是你们不愿意</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/23/#L37">太 23:37</a>)</p></blockquote><blockquote><p>“光来到世间，世人因自己的行为是恶的，<strong><mark>不爱光倒爱黑暗</mark></strong>，定他们的罪就是在此。 <strong><mark>凡作恶的便恨光</mark></strong>，<strong><mark>并不来就光</mark></strong>，恐怕他的行为受责备； <strong><mark>但行真理的必来就光</mark></strong>，要显明他所行的是靠上帝而行。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/3/#L19-21">约 3:19-21</a>)</p></blockquote><blockquote><p>“还是你藐视他丰富的恩慈、宽容、忍耐，不晓得<strong>他的恩慈是领你悔改</strong>呢？ <strong><mark>你竟任着你刚硬不悔改的心</mark></strong>，为自己积蓄忿怒，以致上帝震怒，显他公义审判的日子来到。 他必照各人的行为报应各人。 凡<strong><mark>恒心行善</mark></strong>，寻求荣耀、尊贵和不能朽坏之福的，就以<strong><mark>永生</mark></strong>报应他们； <strong><mark>惟有结党不顺从真理</mark></strong>，反顺从不义的，就以忿怒、恼恨报应他们。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/2/#L4-8">罗 2:4-8</a>)</p></blockquote><h2>上帝预定得救的，是他<strong>预先知道</strong>的人（即预先知道他们会选择）</h2><p>预定的发生并非不考虑人的行为；上帝在时间之外预先知道这些行为，并且正是基于这知识（预知）来预定。这是关键之处。预定不是随机发生的，而恰恰是考虑到每个人在<strong>行出来之前</strong>上帝就已知道的行为：</p><blockquote><p>“<strong><mark>因为他预先所知道的人，就预先定下效法他儿子的模样</mark></strong>，使他儿子在许多弟兄中作长子。 <strong><mark>预先所定下的人又召他们来</mark></strong>；所召来的人又称他们为义；所称为义的人又叫他们得荣耀。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/8/#L29-30">罗 8:29-30</a>)</p></blockquote><blockquote><p>“耶稣基督的使徒彼得，写信给那分散在本都、加拉太、加帕多家、亚西亚、庇推尼寄居的， <strong><mark>就是照父上帝的先见被拣选</mark></strong>，借着圣灵得成圣洁，以致顺服耶稣基督，又蒙他血所洒的人：愿恩惠、平安多多的加给你们！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/1/#L1-2">彼前 1:1-2</a>)</p></blockquote><blockquote><p>“众人都<strong>是从土来的</strong>，因为亚当就是用土造成的。<strong>上主以自己的绝大智慧，使众人各有分别</strong>，使他们的道路各有不同。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/33/#L10-11">德 33:10-11</a>)</p></blockquote><blockquote><p>“外邦人听见这话，就欢喜了，赞美上帝的道；<strong><mark>凡预定得永生的人都信了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/13/#L48">徒 13:48</a>)</p></blockquote><h2>人的命运在上帝手中</h2><blockquote><p>“你的公义好像高山；<strong><mark>你的判断如同深渊</mark></strong>。耶和华啊！人民、牲畜你都救护。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/36/#L6">诗 36:6</a>)</p></blockquote><blockquote><p>“<strong><mark>人的脚步为耶和华所定</mark></strong>，人岂能明白自己的路呢？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/20/#L24">箴 20:24</a>)</p></blockquote><blockquote><p>“求王恩的人多，<strong><mark>定人事乃在耶和华</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/29/#L26">箴 29:26</a>)</p></blockquote><blockquote><p>“有如<strong>泥土在陶工手里</strong>，可以任意捏造处置。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/33/#L13">德 33:13</a>)</p></blockquote><blockquote><p>“这也是出于万军之耶和华，<strong><mark>他的谋略奇妙</mark></strong>，他的智慧广大。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/28/#L29">赛 28:29</a>)</p></blockquote><blockquote><p>“深哉，上帝丰富的智慧和知识！<strong><mark>他的判断何其难测</mark></strong>！他的踪迹何其难寻！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/11/#L33">罗 11:33</a>)</p></blockquote><h2>耶稣基督的十字架苦难是上帝所预定的</h2><blockquote><p>“希律和本丢彼拉多、外邦人和以色列民果然在这城里聚集，要攻打你所膏的圣仆耶稣， <strong><mark>成就你手和你意旨所预定必有的事</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/4/#L27-28">徒 4:27-28</a>)</p></blockquote><h2>上帝预先拣选了使徒保罗</h2><blockquote><p>“他又说：『<strong><mark>我们祖宗的上帝拣选了你</mark></strong>，叫你明白他的旨意，又得见那义者，听他口中所出的声音。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/22/#L14">徒 22:14</a>)</p></blockquote><h2>对异议的回应</h2><h3>“如果上帝愿意人人得救，却不是人人得救，那上帝就不是全能的”</h3><p>爱是自由的情感：强扭的瓜不甜。上帝愿意他的受造物能够爱上帝，因此赐给他们自由选择上帝或不选择上帝的可能：爱他，或者恨他。</p><p>上帝能拯救所有人吗？能。上帝愿意人人得救吗？愿意，但愿他们以对上帝的爱这一品质得救。上帝不愿意把恨上帝的人注定到与他同在的永生里去，因此也不作他不愿作的事。这使上帝不全能了吗？——不，因为上帝不愿意强迫人爱。</p><p>爱人的上帝能赐给人自由地爱他或恨他的可能吗？能。如果他不能赐选择的自由，那还算是全能的吗？</p>
