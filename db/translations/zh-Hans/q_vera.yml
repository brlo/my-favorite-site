- src: Авраам-отец-верующих
  path: Qf6A_亚伯拉罕——信徒之父
  title: 亚伯拉罕——信徒之父
  copy_cover: true
  body: <p>亚伯拉罕没有律法、并在受割礼之前就算为义了：</p><blockquote><p>“正如大卫称那在行为以外蒙上帝算为义的人是有福的。 他说：『得赦免其过，遮盖其罪的，这人是有福的！ 主不算为有罪的，这人是有福的！』 如此看来，这福是单加给那受割礼的人吗？不也是加给那未受割礼的人吗？因我们所说，<strong><mark>亚伯拉罕的信，就算为他的义</mark></strong>。 是怎么算的呢？是在他受割礼的时候呢？是在他未受割礼的时候呢？<strong><mark>不是在受割礼的时候，乃是在未受割礼的时候</mark></strong>。 并且他受了割礼的记号，作他未受割礼的时候因信称义的印证，<strong><mark>叫他作一切未受割礼而信之人的父</mark></strong>，使他们也算为义； 又作受割礼之人的父，就是那些不但受割礼，并且按我们的祖宗亚伯拉罕，未受割礼而信之踪迹去行的人。 因为上帝应许亚伯拉罕和他后裔必得承受世界，<strong><mark>不是因律法，乃是因信而得的义</mark></strong>。 若是属乎律法的人才得为后嗣，信就归于虚空，应许也就废弃了。 因为律法是惹动忿怒的，那里没有律法，那里就没有过犯。 所以人得为后嗣是本乎信．因此就属乎恩，叫应许定然归给一切后裔，不但归给那属乎律法的，也归给那效法亚伯拉罕之信的。 亚伯拉罕所信的，是那叫死人复活、使无变为有的上帝，他在主面前作我们世人的父。如经上所记：『<strong><mark>我已经立你作多国的父</mark></strong>。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/4/#L6-17">罗 4:6-17</a>)</p></blockquote><blockquote><p>“亚伯兰年九十九岁的时候，耶和华向他显现，对他说：「我是全能的上帝，你当在我面前作完全人。 &lt;…&gt; 「我与你立约，<strong><mark>你要作多国的父</mark></strong>。 从此以后，你的名不再叫亚伯兰，要叫亚伯拉罕，因为<strong>我已立你作多国的父</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/17/#L1,4-5">创 17:1,4-5</a>)</p></blockquote><p>信徒是亚伯拉罕的子孙：</p><blockquote><p>“正如『亚伯拉罕信上帝，这就算为他的义』。 所以你们要知道，<strong><mark>那以信为本的人，就是亚伯拉罕的子孙</mark></strong>。 并且圣经既然预先看明，上帝要叫外邦人因信称义，就早已传福音给亚伯拉罕，说，『<strong><mark>万国都必因你得福</mark></strong>。』 <strong><mark>可见那以信为本的人和有信心的亚伯拉罕一同得福</mark></strong>。 凡以行律法为本的，都是被咒诅的，因为经上记着：『凡不常照律法书上所记一切之事去行的，就被咒诅。』 没有一个人靠着律法在上帝面前称义，这是明显的．因为经上说，『义人必因信得生。』 律法原不本乎信，只说：『行这些事的，就必因此活着。』 基督既为我们受了咒诅，就赎出我们脱离律法的咒诅，因为经上记着：『凡挂在木头上都是被咒诅的。』 这便叫亚伯拉罕的福，因基督耶稣可以临到外邦人，使我们因信得着所应许的圣灵。 弟兄们，我且照着人的常话说：虽然是人的文约，若已经立定了，就没有能废弃或加增的。 所应许的原是向亚伯拉罕和他子孙说的；上帝并不是说『众子孙』，指着许多人，<strong><mark>乃是说『你那一个子孙』，指着一个人，就是基督</mark></strong>。 &lt;…&gt; 你们<strong><mark>受洗归入基督的，都是披戴基督了</mark></strong>。 &lt;…&gt; 你们既属乎基督，<strong><mark>就是亚伯拉罕的后裔</mark></strong>，是照着应许承受产业的了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/3/#L6-16,27,29">加 3:6-16,27,29</a>)</p></blockquote><blockquote><p>“为你祝福的，我必赐福与他；那咒诅你的，我必咒诅他。<strong><mark>地上的万族都要因你得福</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/12/#L3">创 12:3</a>)</p></blockquote><blockquote><p>“<strong><mark>这便叫亚伯拉罕的福，因基督耶稣可以临到外邦人</mark></strong>，<strong>使我们因信得着所应许的圣灵</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/3/#L14">加 3:14</a>)</p></blockquote><h2>耶稣基督论亚伯拉罕的子孙</h2><blockquote><p>“不要自己心里说：『有亚伯拉罕为我们的祖宗。』我告诉你们：<strong><mark>上帝能从这些石头中给亚伯拉罕兴起子孙来</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/3/#L9">太 3:9</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/lk/3/#L8">路 3:8</a>)</p></blockquote><h2>教会——新的以色列</h2><blockquote><p>“<strong><mark>惟有你们是被拣选的族类，是有君尊的祭司</mark></strong>，是圣洁的国度，是属上帝的子民，要叫你们宣扬那召你们出黑暗、入奇妙光明者的美德。 你们<strong><mark>从前算不得子民，现在却作了上帝的子民</mark></strong>；从前未曾蒙怜恤，现在却蒙了怜恤。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/2/#L9-10">彼前 2:9-10</a>)</p></blockquote>
