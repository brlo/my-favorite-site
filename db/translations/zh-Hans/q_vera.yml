- src: суд
  path: Qf3A_审判
  title: 审判
  copy_cover: true
  body: <h2>耶稣基督将在最后的审判中审判一切人</h2><blockquote><p>“<strong>人子</strong>要在他父的荣耀里，同着众使者降临；那时候，他要<strong><mark>照各人的行为报应各人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/16/#L27">太 16:27</a>)</p></blockquote><blockquote><p>“当<strong>人子</strong>在他荣耀里，同着众天使降临的时候，要坐在他荣耀的宝座上。 万民都要聚集在他面前。<strong>他要把他们分别出来</strong>，好像牧羊的分别绵羊山羊一般；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/25/#L31-32">太 25:31-32</a>)</p></blockquote><blockquote><p>“父不审判什么人，<strong><mark>乃将审判的事全交与子</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/5/#L22">约 5:22</a>)</p></blockquote><blockquote><p>“上帝怎样以圣灵和能力膏<strong>拿撒勒人耶稣</strong>，这都是你们知道的。他周流四方，行善事，医好凡被魔鬼压制的人，因为上帝与他同在。 &lt;…&gt; 他吩咐我们传道给众人，证明他是<strong><mark>上帝所立定的，要作审判活人死人的主</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/10/#L38,42">徒 10:38,42</a>)</p></blockquote><blockquote><p>“因为他已经定了日子，<strong><mark>要借着他所设立的人按公义审判天下</mark></strong>，并且<strong>叫他从死里复活</strong>，给万人作可信的凭据。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/17/#L31">徒 17:31</a>)</p></blockquote><blockquote><p>“因为我们众人必要在<strong><mark>基督台前</mark></strong>显露出来，叫各人按着本身所行的，或善或恶受报。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/5/#L10">林后 5:10</a>)</p></blockquote><blockquote><p>“我在上帝面前，并<strong><mark>在将来审判活人死人的基督耶稣面前</mark></strong>，凭着他的显现和他的国度嘱咐你：” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/4/#L1">提后 4:1</a>)</p></blockquote><h2>人人都要受审判</h2><blockquote><p>“因为<strong><mark>我们众人</mark></strong><strong>必要在基督台前显露出来</strong>，叫各人按着本身<strong>所行的</strong>，<strong>或善或恶</strong>受报。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/5/#L10">林后 5:10</a>)</p></blockquote><blockquote><p>“你这个人，为什么论断弟兄呢？又为什么轻看弟兄呢？因<strong><mark>我们</mark></strong><strong>都要站在上帝的台前</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/14/#L10">罗 14:10</a>)</p></blockquote><blockquote><p>“你们既然要<strong><mark>按使人自由的律法受审判</mark></strong>，就该照这律法说话行事。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/2/#L12">雅 2:12</a>)</p></blockquote><blockquote><p>“因为<strong><mark>人所作的事</mark></strong>，连一切隐藏的事，<strong>无论是善是恶</strong>，上帝都必审问。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ekl/12/#L14">传 12:14</a>)</p></blockquote><blockquote><p>“当<strong>人子</strong>在他荣耀里，同着众天使降临的时候，<strong>要坐在他荣耀的宝座上</strong>。 <strong><mark>万民</mark></strong>都要聚集在他面前。<strong><mark>他要把他们分别出来</mark></strong>，好像牧羊的分别<strong><mark>绵羊山羊</mark></strong>一般；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/25/#L31-32">太 25:31-32</a>)</p></blockquote><h2>审判要从教会起首</h2><blockquote><p>“因为时候到了，<strong><mark>审判要从上帝的家起首</mark></strong>。若是<strong><mark>先从我们起首</mark></strong>，那不信从上帝福音的人将有何等的结局呢？ 『若是<strong>义人仅仅得救</strong>，那不虔敬和犯罪的人，将有何地可站呢？』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/4/#L17-18">彼前 4:17-18</a>)</p></blockquote><blockquote><p>“我被你们论断，或被别人论断，我都以为极小的事．<strong><mark>连我自己也不论断自己</mark></strong>。 我虽不觉得自己有错，却也不能因此得以称义；<strong><mark>但判断我的乃是主</mark></strong>。 所以，<strong>时候未到，什么都不要论断</strong>，只等主来，他要照出暗中的隐情，显明人心的意念。那时，各人要从上帝那里得着称赞。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/4/#L3-5">林前 4:3-5</a>)</p></blockquote><h2>基督要审判人在肉身中所行的事</h2><blockquote><p>“因为我们众人必要在基督台前显露出来，<strong>叫各人按着本身</strong><strong><mark>所行的</mark></strong>，或善或恶受报。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/5/#L10">林后 5:10</a>)</p></blockquote><p>审判按人在肉身中所行的世上之事进行：</p><blockquote><p>“王又要向那左边的说：『<strong>你们这被咒诅的人，离开我，进入那为魔鬼和他的使者所预备的永火里去</strong>！ <strong>因为我饿了，你们不给我吃</strong>；渴了，你们不给我喝； 我作客旅，你们不留我住；我赤身露体，你们不给我穿；我病了，我在监里，你们不来看顾我。』 他们也要回答说：『主啊，我们什么时候见你饿了，或渴了，或作客旅，或赤身露体，或病了，或在监里，不伺候你呢？』 王要回答说：『我实在告诉你们：<strong>这些事你们既不作在我这弟兄中一个最小的身上，就是不作在我身上了</strong>。』 <strong>这些人，要往永刑里去；那些义人，要往永生里去</strong>” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/25/#L41-46">太 25:41-46</a>)</p></blockquote>
