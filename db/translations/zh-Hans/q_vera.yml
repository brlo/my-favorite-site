- src: вера-во-Христа-для-всех-народов
  path: Qf2A_万民都蒙召信基督
  title: 万民都蒙召信基督
  copy_cover: true
  body: <h2>万民蒙召信基督——新约中的指示</h2><p>基督差遣使徒向万民、万族、说任何语言的人、普天下传福音：</p><blockquote><p>“所以，<strong><mark>你们要去，使万民作我的门徒，奉父，子、圣灵的名给他们施洗</mark></strong>。 <strong><mark>凡我所吩咐你们的，都教训他们遵守</mark></strong>，我就常与你们同在，直到世界的末了。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/28/#L19-20">太 28:19-20</a>)</p></blockquote><blockquote><p>“我们从他受了恩惠并使徒的职分，<strong><mark>在万国之中叫人为他的名信服真道</mark></strong>；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/1/#L5">罗 1:5</a>)</p></blockquote><blockquote><p>“惟有上帝能照我所传的福音，和所讲的耶稣基督，并照永古隐藏不言的奥祕，<strong><mark>坚固你们的心</mark></strong>。 这奥祕如今显明出来，而且按着永生上帝的命，藉众先知的书<strong><mark>指示万国的民，使他们信服真道</mark></strong>。 愿荣耀，因耶稣基督，归与独一全智的上帝，直到永远。阿们。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/16/#L25-27">罗 16:25-27</a>) <em>(俄文译本将这段颂赞置于 Рим 14:24-25；和合本（与希腊文文本）则在 罗 16:25-27。)</em></p></blockquote><blockquote><p>“<strong><mark>这天国的福音要传遍天下，对万民作见证</mark></strong>，然后末期才来到。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/24/#L14">太 24:14</a>)</p></blockquote><blockquote><p>“我又看见另有一位天使飞在空中，<strong><mark>有永远的福音要传给住在地上的人，就是各国、各族、各方、各民</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/14/#L6">启 14:6</a>)</p></blockquote><h2>万民蒙召信基督——旧约中的指示</h2><p>上帝对亚伯拉罕的应许：地上的万族都要因他的后裔（藉着他的一位后裔）得福：</p><blockquote><p>“并且<strong><mark>地上万国，都必因你的后裔得福</mark></strong>，因为你听从了我的话。』」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/22/#L18">创 22:18</a>)</p></blockquote><p>万民都归向真上帝的预言：</p><blockquote><p>“主啊，<strong><mark>你所造的万民都要来敬拜你</mark></strong>，他们也要荣耀你的名。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/86/#L9">诗 86:9</a>)</p></blockquote><blockquote><p>“<strong><mark>诸王都要叩拜他</mark></strong>；<strong><mark>万国都要事奉他</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/72/#L11">诗 72:11</a>)</p></blockquote><blockquote><p>“他的名要存到永远，要留传如日之久。<strong>人要因他蒙福，万国要称他有福</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/72/#L17">诗 72:17</a>)</p></blockquote><blockquote><p>“<strong><mark>万国啊，你们都当赞美耶和华</mark></strong>！万民哪，你们都当颂赞他！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/117/#L1">诗 117:1</a>)</p></blockquote><blockquote><p>“「我知道他们的行为和他们的意念。时候将到，<strong><mark>我必将万民万族</mark></strong>聚来，看见我的荣耀。 我要显神迹在他们中间，逃脱的我要差到列国去，就是到他施、普勒、拉弓的路德和土巴、雅完，并素来没有听见我名声、没有看见我荣耀辽远的海岛，他们必将我的荣耀传扬在列国中。 他们必将你们的弟兄<strong><mark>从列国中送回</mark></strong>，使他们或骑马，或坐车，坐轿，骑骡子，骑独峰驼，到我的圣山耶路撒冷，作为供物献给耶和华，好像以色列人用洁净的器皿盛供物奉到耶和华的殿中。」这是耶和华说的。 耶和华说：「我也必<strong>从他们中间取人为祭司，为利未人</strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/66/#L18-21">赛 66:18-21</a>)</p></blockquote><blockquote><p>“<strong><mark>地极的人都当仰望我，就必得救</mark></strong>。因为我是上帝，再没有别神！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/45/#L22">赛 45:22</a>)</p></blockquote><blockquote><p>“现在他说：「你作我的仆人，使雅各众支派复兴，使以色列中得保全的归回，尚为小事；<strong><mark>我还要使你作外邦人的光，叫你施行我的救恩，直到地极</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/49/#L6">赛 49:6</a>)</p></blockquote><blockquote><p>“好叫世界得知你的道路，<strong><mark>万国得知你的救恩</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/67/#L2">诗 67:2</a>)</p></blockquote><blockquote><p>“得了权柄、荣耀、国度，<strong><mark>使各方、各国、各族的人都事奉他</mark></strong>。他的权柄是永远的，不能废去，他的国必不败坏。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/dan/7/#L14">但 7:14</a>)</p></blockquote><blockquote><p>“<strong><mark>在列邦中述说他的荣耀，在万民中述说他的奇事</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1par/16/#L24">代上 16:24</a>)</p></blockquote><blockquote><p>“<strong><mark>使地上的万民都知道惟独耶和华是上帝</mark></strong>，并无别神。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/8/#L60">王上 8:60</a>)</p></blockquote><blockquote><p>“我必震动万国。<strong><mark>万国的珍宝必都运来</mark></strong>，我就使这殿满了荣耀。』这是万军之耶和华说的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ag/2/#L7">该 2:7</a>) <em>(希腊文原文（及俄文译本）作「将要来的、万国所仰慕的」，指弥赛亚本人；和合本作「万国的珍宝」。)</em></p></blockquote><blockquote><p>“田地怎样使百谷发芽，园子怎样使所种的发生，主耶和华必照样<strong><mark>使公义和赞美在万民中发出</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/61/#L11">赛 61:11</a>)</p></blockquote><h2>别的民族的信仰不能救人</h2><p>使徒的耶稣基督的信仰是能救人的。别的民族的信仰不能救人：</p><blockquote><p>“他在从前的世代，<strong><mark>任凭万国各行其道</mark></strong>；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/14/#L16">徒 14:16</a>)</p></blockquote><p>详见<a href="https://bibleox.com/ru/ru/w/Бог-один">别的民族的神——不是上帝</a></p><p>同时，使徒的耶稣基督的信仰和这信仰的救恩，向一切人毫无例外地敞开。</p>
