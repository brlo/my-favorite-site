  path: Qf1A_使徒的信仰
  title: 使徒的信仰
  copy_cover: true
  body: <p>主耶稣基督讲到那按使徒的话信他的人：</p><blockquote><p>“我为他们的缘故自己分别为圣，叫他们也因真理成圣。 我不但为这些人祈求，也为那些<strong><mark>因他们的话信我</mark></strong>的人祈求， <strong>使他们都合而为一</strong>；正如你父在我里面，我在你里面，使他们也在我们里面，<strong><mark>叫世人可以信你差了我来</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/17/#L19-21">约 17:19-21</a>)</p></blockquote><p>使徒们多次指出必须持守那一次所传的信仰（详见<a href="https://bibleox.com/ru/ru/w/Предание">圣传</a>）。*此页尚待完善。</p>
