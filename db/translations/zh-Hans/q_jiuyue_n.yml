  path: QO22A_异教徒对偶像的信仰
  title: 异教徒对偶像的信仰
  copy_cover: true
  body: <h2>异教徒信仰偶像的种类</h2><p>异教徒对偶像的信仰有三种，从古代最普遍的一种开始：</p><ol><li><p><strong>偶像——就是神本身</strong>。异教徒所制造的物件本身就是神。</p></li><li><p><strong>偶像——是</strong>遥远之神的<strong>形像</strong>，据说那神就应当是这样。</p></li><li><p><strong>偶像——是</strong>被神化的自然元素——海、风、雨、火、土——的<strong>虚构形像</strong>。</p></li></ol><p>在所有三种情形中，受敬礼的都是<strong>虚假的神</strong>，是<strong>不存在的</strong>。这是对谎言的信仰。</p><p>圣经中遇到的正是第一种：最普遍的异教信仰是<strong>对物件本身（物质）的神化</strong>。</p><h2>异教徒把制品本身当作神</h2><blockquote><p>“所以我从古时将这事给你说明，在未成以先指示你，免得你说：『<strong><mark>这些事是我的偶像所行的</mark></strong>，<strong><mark>是我雕刻的偶像和我铸造的偶像所命定的</mark></strong>。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/48/#L5">赛 48:5</a>)</p></blockquote><blockquote><p>“他们的口舌是匠人雕琢的，包金裹银，但<strong>它们是虚假的，不能说话</strong>。人们仿佛为喜爱装饰的少女那样取金子，为他们诸神制冠冕。有时<strong>司祭偷取他们诸神上的金银</strong>，供自己享用；分一些给殿宇中的娼妓；给金银木制诸神<strong>穿上衣服装饰它们</strong>，如同装饰人。但<strong>它们虽身穿紫袍，却免不了锈蚀和虫蛀</strong>。人们在殿宇中拭去它们脸上的灰尘——那灰尘在它们身上非常多。它手中拿着权杖，如同人间的判官，却<strong>不能处死在它面前的恶人</strong>。它右手拿着刀剑和斧子，却<strong>不能保护自己免受军队和强盗的侵害</strong>：由此可知，<strong>它们不是神</strong>；所以不要怕它们。如同打碎的器皿对人无用，它们的神也是如此。它们被安放在殿宇中之后，眼睛里满是进来之人的脚所扬起的尘土。如同得罪君王的人被带去处死时其居所紧闭门户，它们的殿宇也<strong>由司祭用门、锁和闩守护着，免得被盗贼抢掠</strong>；人们为它们点灯，比为自身点的还多，而它们一盏也看不见。它们如同房中的木柱；<strong>据说地里的虫蛀蚀它们的心，把它们和它们的衣服一起吃掉，它们却毫无感觉</strong>。它们的面孔被殿宇中的烟气熏得发黑。<strong>蝙蝠、燕子和别的飞鸟落在它们的身上和头上，猫也在它们身上攀爬。由此你们可以明白：它们不是神</strong>；所以不要怕它们。若不除去包在其上作装饰的金子上的锈，它们便不发光；<strong>浇铸它们时，它们没有感觉</strong>。它们被高价买来，里面却没有神魂。它们没有脚，<strong>却被人扛在肩上</strong>，向人显明自己的无能；事奉它们的人也蒙羞辱；因为<strong>它们跌倒在地上时，不能自己起来</strong>；即使有人把它们立直，<strong>它们也不能自己移动</strong>；若有人把它们推歪，<strong>它们不能自己站直</strong>；人们却如同对死人一样在它们面前摆上供物。它们的祭物被司祭卖掉并滥用；他们的妻子也把其中一些腌起来，分文不施给穷人或病人。不洁的妇女和产妇也触摸它们的祭物。由此知道它们不是神，就不要怕它们。怎能称它们为神呢？妇女竟向这些金银木制的神献祭。在它们的殿宇中坐着司祭，身穿破烂衣服，剃去头发和胡须，也不蒙头：这些包金裹银的木制神如同山中的石头——事奉它们的人必蒙羞辱。怎能以为或说它们是神呢？它们那里所行的一切都是虚假的。这样，怎能以为或说它们是神呢？<strong>它们是匠人和金匠制造的；它们无非成了匠人想要造的样子</strong>。制造它们的人自己也不长久；他们所造的怎能是神呢？他们给自己后代留下了谎言和耻辱。那些<strong>连自己都不能从战争和灾祸中拯救</strong>的，怎能不明白它们不是神呢？既然它们是包金裹银的木头，就可以认出它们是谎言；万民和君王都将明白：<strong>这不是神，而是人手的作品，其中没有任何神性的作为</strong>。此后谁还不明白它们不是神呢？它们不能为国家立王，不能降雨给人；不能审判，不能保护受欺压者，无力如同悬于天地之间的乌鸦。即便<strong>金银木制诸神的殿宇失火，它们的司祭也会逃走得救——而它们自己如同中间的木头一样烧掉</strong>。它们不能对抗君王，也不能对抗仇敌。怎能接受或以为它们是神呢？<strong>这些包金裹银的木制神既不能保护自己免受盗贼和强盗的侵害</strong>：强盗胜过它们，剥下它们身上的金银和衣服就走，而这些东西连自己都帮不了。因此，表露勇气的君王，或主人在家中使用的有用器皿，都比虚假的神更好；或家中看守财产的门，都比虚假的神更好；或王宫中的木柱，都比虚假的神更好。这样，知道它们不是神，就不要怕它们。走兽比它们更好：它们逃到庇护之下还能自救。这样，<strong>我们无论从哪方面都看不出它们是神</strong>；所以不要怕它们。<strong>菜园中的稻草人</strong>守护不了什么，它们那包金裹银的木制神也是如此。同样，它们那包金裹银的木制神如同园中的荆棘丛，各样的鸟落在上面，又如被抛在黑暗中的尸体。从那在它们身上朽坏的紫袍与朱红线，你们可以明白它们不是神；它们自己终将被吃掉，成为那地方的耻辱。这样，没有偶像的义人更好，因为他远离耻辱。” (<a href="https://bibleox.com/zh-Hans/ru/pos/1/#L7-30,38-39,44-47,49-58,64,67-72">耶函 1:7-30,38-39,44-47,49-58,64,67-72</a>, 俄文原文无中文经文，此处自译) <em>(俄文原文无中文经文（耶利米书信不在中文译本中），此处自译。)</em></p></blockquote><h2>以色列的异教徒把制品本身、也把元素当作神</h2><blockquote><p>“<strong><mark>制造雕刻偶像的尽都虚空</mark></strong>；<strong><mark>他们所喜悦的都无益处</mark></strong>。他们的见证无所看见，无所知晓，他们便觉羞愧。 谁制造神像，铸造无益的偶像？ 看哪，他的同伴都必羞愧！工匠也不过是人，任他们聚会，任他们站立，都必惧怕，一同羞愧。 铁匠把铁在火炭中烧热，用锤打铁器，用他有力的膀臂锤成；他饥饿而无力，不喝水而发倦。 <strong><mark>木匠拉线，用笔划出样子</mark></strong>，用铇子铇成形状，用圆尺划了模样，仿照人的体态，作成人形，好住在房屋中。 <strong><mark>他砍伐香柏树</mark></strong>，又取柞树和橡树，在树林中选定了一棵。他栽种松树，得雨长养。 <strong><mark>这树，人可用以烧火</mark></strong>。他自己取些烤火，又烧着烤饼，<strong><mark>而且作神像跪拜</mark></strong>，作雕刻的偶像向它叩拜。 <strong><mark>他把一分烧在火中</mark></strong>，把一分烤肉吃饱。自己烤火说：「阿哈！我暖和了！我见火了！」 <strong><mark>他用剩下的作了一神</mark></strong>，就是雕刻的偶像。他向这偶像俯伏叩拜，祷告他说：「<strong><mark>求你拯救我，因你是我的神</mark></strong>。」 <strong><mark>他们不知道，也不思想</mark></strong>，因为<strong><mark>耶和华闭住他们的眼</mark></strong>，不能看见；塞住他们的心，不能明白。 谁心里也不醒悟，也没有知识，没有聪明，能说：「<strong><mark>我曾拿一分在火中烧了</mark></strong>，在炭火上烤过饼，我也烤过肉吃。<strong><mark>这剩下的我岂要作可憎的物吗</mark></strong>？<strong><mark>我岂可向木不子叩拜呢</mark></strong>？」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/44/#L9-19">赛 44:9-19</a>)</p></blockquote><blockquote><p>“凡不认识天主的人，都是真正的愚人，因为，他们未能从看得见的美物，去发现那自有者；注意了工程，却不认识工程师；……<strong>他们敬奉火、风、流动的空气、星辰、洪流或天上的众星，奉为掌管世界的神明</strong>。若有人因这些事物的美丽而着迷，奉之为神，那么他就应认出：那位造它们的美的创造主是多么远胜它们。……但他们中间那些更可怜的，他们把希望寄托在无灵之物上，<strong>称人手的作品——金银、工艺制品、动物的形像——为神</strong>，或称无用的石头、远古的手工为神。又如一个工匠，砍下一块合用的木头，熟练地剥去全部树皮，巧妙地加工，<strong>做成生活中有用的器皿，而把刨花用来做饭，吃饱了肚子；其中一块无用的碎木，弯曲多节，他拿起来在闲暇时精心削圆，以行家的手艺加工，把它</strong>做<strong>成人（不是神）的形像</strong>，或做成<strong>某个卑贱兽类的模样</strong>，涂上丹砂，漆成红色，遮住一切疤痕，为它安排相称的地方，挂在墙上，<strong>用铁钉固定。为使他所作的不致坠落，他预先操心，</strong>知道它自己帮不了自己<strong>：因为这是偶像，需要帮助。他在它面前为自己的产业、婚姻和儿女祈祷时，竟不羞于向无灵之物说话；求健康时呼唤无力者；向</strong>死物<strong>求生命；向</strong>完全无能者<strong>求援助；求旅途平安时，呼求</strong>不能迈步者<strong>；求收获、技艺和手工的成就时，呼求</strong>完全不能动手者**；向最无力者求力量。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prs/13/#L1-19">智 13:1-19</a>)</p></blockquote><blockquote><p>“再如：有个准备航海的人，行将在怒涛中航行之际，<strong>竟向一块比自己乘的船还易坏的木头呼求</strong>。这<strong>手造之物</strong>本身和造它的人，都因造了它而可诅咒；这<strong>腐朽之物竟被称为神</strong>。……父亲因儿子早逝而悲痛，<strong>就为他造了像，如同已死之人的像，随后竟敬奉这</strong>像<strong>，如同敬奉神</strong>，并把奥秘和祭祀传给属下。此后，这邪恶的习俗因时间而巩固，被当作法律来遵守，执政者又下令，<strong>雕像竟被当作神明来敬礼</strong>。人们因居住遥远而不能面对面敬礼的，就把远方的面容画成图像：为受敬礼的君王造出可见的像，以此殷勤讨好在位者的欢心，如同他亲自在场一样。工匠的手艺也为不知情者加添敬礼的热忱：他愿讨君王的欢心，<strong>便以技艺把像修饰得更美观；民众被工艺之美所吸引，不久前还把那像当作人来敬礼</strong>［从前敬礼的是伟人的雕像］<strong>，如今竟奉为神明</strong>。这成了人们的陷阱：他们或屈服于灾难，或屈服于强权，<strong>把不可言传的名加在石头和木头上</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prs/14/#L1,8,14-21">智 14:1,8,14-21</a>)</p></blockquote><p>在何烈山脚下，以色列民简直是在要求给他们造神：</p><blockquote><p>“百姓见摩西迟延不下山，就大家聚集到亚伦那里，对他说：「<strong><mark>起来！为我们作神像</mark></strong>，可以在我们前面引路；因为领我们出埃及地的那个摩西，我们不知道他遭了什么事。」 亚伦对他们说：「你们去摘下你们妻子、儿女，耳上的金环，拿来给我。」 &lt;…&gt; <strong><mark>亚伦从他们手里接过来，铸了一只牛犊，用雕刻的器具作成</mark></strong>。他们就说：「<strong><mark>以色列啊，这是领你出埃及地的上帝</mark></strong>！」 &lt;…&gt; 他们对我说：『<strong><mark>你为我们做神像</mark></strong>，可以在我们前面引路，因为领我们出埃及地的那个摩西，我们不知道他遭了什么事。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/32/#L1-2,4,23">出 32:1-2,4,23</a>)</p></blockquote><blockquote><p>“摩西回到耶和华那里说：「唉！<strong><mark>这百姓犯了大罪，为自己作了金像</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/32/#L31">出 32:31</a>)</p></blockquote><p>他们向蛇焚香——不是向上帝，给蛇起了名字，也就是捏造了神：</p><blockquote><p>“他废去邱坛，毁坏柱像，砍下木偶，<strong><mark>打碎摩西所造的铜蛇</mark></strong>，因为到那时<strong><mark>以色列人仍向铜蛇烧香</mark></strong>。<strong><mark>希西家叫铜蛇为铜块</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/4ts/18/#L4">王下 18:4</a>)</p></blockquote><p>他们偷走了诸神（虽然偷走的只是制品）——也就是说，制品本身被称为神：</p><blockquote><p>“现在你虽然想你父家，不得不去，<strong><mark>为什么又偷了我的神像呢</mark></strong>？」 雅各回答拉班说：「恐怕你把你的女儿从我夺去，所以我逃跑。 <strong><mark>至于你的神像，你在谁那里搜出来，就不容谁存活</mark></strong>。当着我们的众弟兄你认一认，在我这里有什么东西是你的，就拿去。」<strong><mark>原来雅各不知道拉结偷了那些神像</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/31/#L30-32">创 31:30-32</a>)</p></blockquote><p>禁止制造他们所敬拜的手造之神：</p><blockquote><p>“<strong><mark>你们不可偏向虚无的神，也不可为自己铸造神像</mark></strong>。我是耶和华你们的上帝。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/19/#L4">利 19:4</a>)</p></blockquote><blockquote><p>“<strong><mark>他们的地满了偶像，他们跪拜自己手所造的</mark></strong>，就是自己指头所作的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/2/#L8">赛 2:8</a>)</p></blockquote><h2>以色列中制造偶像的原因</h2><blockquote><p>“雅洛贝罕心中思量：「<strong>这王国迟早要归于达味王室</strong>」［这是制造偶像的原因］；如果这人民上耶路撒冷，在上主殿内献祭，他们的心难免不归向他们的主上犹大王勒哈贝罕，把我打死，再归属于犹大王勒哈贝罕。因此，雅洛贝罕王拿定了主意，<strong>制造了两只金牛犊</strong>，对人民说：你们不需要再上耶路撒冷去了；以色列！<strong>看，这就是领你们由埃及地上来的天主</strong>！［两只牛犊——两个神，而不是同一位神的两个形像］他将一只供在贝特耳，一只供在丹。……亲自上坛献祭。他也如此在贝特耳<strong>向他制造的牛犊献了祭</strong>［祭物是献给牛犊本身的］，并在贝特耳为他建造的高丘神坛，委派了司祭。” (<a href="https://bibleox.com/zh-Hans/cn-sb/3ts/12/#L26-29,32">王上 12:26-29,32</a>)</p></blockquote><h2>在巴比伦，人们把铜制品本身、也把牲畜当作神</h2><blockquote><p>“巴比伦有一个偶像名叫<strong>贝耳</strong>，每天为这偶像耗费十二袋细面，四十只绵羊和六桶酒。<strong>君王也恭敬这偶像</strong>，每天都去礼拜；但是达尼尔却崇拜自己的天主。君王曾对他说：「<strong>为什么你不崇拜贝尔？</strong>」达尼尔回答说：「我不敬拜人手制造的偶像，我只敬拜创造天地，主宰全人类的生活的天主。」君王对他说：「你不以为贝耳是生活的神吗？你不见贝耳每天吃喝那么多吗？」达尼尔笑着说：「大王，不要受欺骗！<strong>它里面是泥土，外面是黄铜</strong>，决不会吃，也不会喝。」……&lt;…&gt; <strong>贝耳的司祭共有七十人</strong>，此外还有他们的妻子和儿女。……&lt;…&gt; 达尼尔命自己的仆役拿灰来，只当着君王面前，<strong>将灰撒遍整个庙宇</strong>，然后出去，将门关好，盖上君王的御印，就走了。……&lt;…&gt; 及至开了门，君王一看见供桌，即刻大声喊叫说：「贝耳！你是伟大的！你毫无虚假！」达尼尔笑了，并请君王留步，不要进去，说：「<strong>请看看砌石的地面上</strong>；仔细查看这些脚印是谁的脚印？」君王说：「<strong>我看是男人、女人和孩子的脚印。</strong>」于是君王大怒，令人逮捕了司祭和他们的妻子儿女，这时他们才给君王指出他们是由暗门进来，吃尽供桌上的食物。<strong>君王遂将他们杀掉，将贝耳交由达尼尔处理</strong>；达尼尔便推翻了贝耳和他的庙宇。<strong>在那地方有一条巴比伦人所敬拜的大龙。</strong>君王对达尼尔说：「<strong>现在你却不能说这不是生活的神了罢</strong>，那么你就应该崇拜牠。」达尼尔回答说：「我崇拜的是上主，我的天主，因为只有他是永生的天主；这条龙不是永生的神。大王！请给我全权！我不用刀，也不用棍，就可杀死这条龙。」君王说：「我给你全权！」<strong>达尼尔取了沥青、脂油和头发</strong>，搀和在一起煎熬，作成丸子送到龙口里；<strong>龙吃下以后，就爆裂了。</strong>于是达尼尔说：「请看，你们所敬拜的神！」” (<a href="https://bibleox.com/zh-Hans/cn-sb/dan/14/#L3-28">但 14:3-28</a>) <em>(俄文本编号为 Дан 14:3-28（思高本同编号）；此段经文不在和合本中，引文按思高本。)</em></p></blockquote><h2>偶像什么也不能作，它自己还需要照料</h2><p>经文不断强调：偶像什么也不能作：</p><blockquote><p>“祭祀对偶像有什么用处？<strong>既不能吃，又不能闻</strong>：” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/30/#L19">德 30:19</a>) <em>(俄文本为 Сир 30:19。)</em></p></blockquote><blockquote><p>“其余未曾被这些灾所杀的人仍旧不悔改自己手所作的，<strong><mark>还是去拜鬼魔和那些不能看、不能听、不能走，金、银、铜、木、石的偶像</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/9/#L20">启 9:20</a>)</p></blockquote><p>但若偶像只是形像，那就不必说它什么也不能作了。异教徒自己会讥笑说：当然不能，这不过是形像罢了。</p><h2>没有偶像，对偶像的事奉就无法进行</h2><blockquote><p>“以色列家啊，至于你们，主耶和华如此说：从此以后若不听从我，<strong><mark>就任凭你们去事奉偶像</mark></strong>，<strong><mark>只是不可再因你们的供物和偶像亵渎我的圣名</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iez/20/#L39">结 20:39</a>)</p></blockquote><h2>新约中论偶像</h2><p>偶像本身被视为神：</p><blockquote><p>“有一个银匠，名叫底米丢，<strong><mark>是制造亚底米神银龛的</mark></strong>，他使这样手艺人生意发达。 他聚集他们和同行的工人，说：「众位，你们知道我们是倚靠这生意发财。 <strong><mark>这保罗不但在以弗所</mark></strong>，也几乎在亚西亚全地，引诱迷惑许多人，说：『<strong><mark>人手所作的，不是神</mark></strong>。』这是你们所看见、所听见的。 这样，<strong><mark>不独我们这事业被人藐视</mark></strong>，就是大女神亚底米的庙也要被人轻忽，<strong><mark>连亚西亚全地和普天下所敬拜的大女神之威荣也要销灭了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/19/#L24-27">徒 19:24-27</a>)</p></blockquote><h2>真上帝不回应敬拜偶像的人</h2><blockquote><p>“所以你要告诉他们：『主耶和华如此说：以色列家的人中，<strong><mark>凡将他的假神接到心里</mark></strong>，把陷于罪的绊脚石放在面前，又就了先知来的，<strong><mark>我耶和华在他所求的事上，必按他众多的假神回答他</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iez/14/#L4">结 14:4</a>)</p></blockquote><blockquote><p>“好在以色列家的心事上捉住他们，<strong><mark>因为他们都借着假神与我生疏</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iez/14/#L5">结 14:5</a>)</p></blockquote><blockquote><p>“你们奉上供物使你们儿子经火的时候，<strong><mark>仍将一切偶像玷污自己</mark></strong>，直到今日吗？以色列家啊，<strong><mark>我岂被你们求问吗</mark></strong>？主耶和华说，我指着我的永生起誓，<strong><mark>我必不被你们求问</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iez/20/#L31">结 20:31</a>)</p></blockquote><h2>其余</h2><blockquote><p>“发明偶像，是淫乱的开端；创造偶像，是人生的腐败。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prs/14/#L12">智 14:12</a>)</p></blockquote><blockquote><p>“崇拜虚无的偶像，实是万恶的起源、由来和结局。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prs/14/#L27">智 14:27</a>)</p></blockquote><blockquote><p>“因为他们信赖无生命的偶像，自以为妄发虚誓，不会受罚。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prs/14/#L29">智 14:29</a>)</p></blockquote><blockquote><p>“我出去，迎着敌人来骂阵，他就以他的偶像咒诅我。” (<a href="https://bibleox.com/zh-Hans/ru/ps/151/#L6">诗 151:6</a>, 俄文原文无中文经文，此处自译) <em>(圣咏151不在和合本中；俄文原文无中文经文，此处自译。)</em></p></blockquote>
