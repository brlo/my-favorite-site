- src: Незлобие-милосердие-прощение
  path: QV6A_不怀恶意
  title: 不怀恶意（怜悯、饶恕）
  copy_cover: true
  body: <blockquote><p>“<strong><mark>亲爱的弟兄，不要自己伸冤</mark></strong>，<strong><mark>宁可让步，听凭主怒</mark></strong>。因为经上记着：「主说：『伸冤在我，我必报应。』」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/12/#L19">罗 12:19</a>)</p></blockquote><blockquote><p>“<strong><mark>你不要说</mark></strong>：「<strong><mark>我要以恶报恶</mark></strong>；」<strong><mark>要等候耶和华，他必拯救你</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/20/#L22">箴 20:22</a>)</p></blockquote>
