- src: благодарение
  path: QV5A_感恩
  title: 感恩
  copy_cover: true
  body: <blockquote><p>“要常常喜乐， 不住的祷告， <strong><mark>凡事谢恩，因为这是上帝在基督耶稣里向你们所定的旨意</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1sol/5/#L16-18">帖前 5:16-18</a>)</p></blockquote><blockquote><p>“叫你们凡事富足，可以多多施舍，<strong><mark>就借着我们使感谢归于上帝</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/9/#L11">林后 9:11</a>)</p></blockquote><blockquote><p>“因为办这供给的事，不但补圣徒的缺乏，<strong><mark>而且叫许多人越发感谢上帝</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/9/#L12">林后 9:12</a>)</p></blockquote><blockquote><p>“在他里面生根建造，信心坚固，正如你们所领的教训，<strong><mark>感谢的心也更增长了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/2/#L7">西 2:7</a>)</p></blockquote><blockquote><p>“无论作什么，或说话，或行事，都要奉主耶稣的名，<strong><mark>借着他感谢父上帝</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/3/#L17">西 3:17</a>)</p></blockquote><blockquote><p>“应当一无挂虑，<strong><mark>只要凡事借着祷告、祈求和感谢，将你们所要的告诉上帝</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/fil/4/#L6">腓 4:6</a>)</p></blockquote><blockquote><p>“淫词、妄语和戏笑的话都不相宜，<strong><mark>总要说感谢的话</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/5/#L4">弗 5:4</a>)</p></blockquote><blockquote><p>“<strong><mark>你们要恒切祷告，在此儆醒感恩</mark></strong>；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/4/#L2">西 4:2</a>)</p></blockquote><blockquote><p>“因为他们虽然知道上帝，却不当作上帝荣耀他，<strong><mark>也不感谢他。他们的思念变为虚妄，无知的心就昏暗了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/1/#L21">罗 1:21</a>)</p></blockquote><blockquote><p>“因为那时人要专顾自己、贪爱钱财、自夸、狂傲、谤讟、违背父母、<strong><mark>忘恩负义</mark></strong>、心不圣洁、” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/3/#L2">提后 3:2</a>)</p></blockquote><p>感恩意味着以自己现在所有的美善为满足：</p><blockquote><p>“然而，<strong><mark>敬虔加上知足的心便是大利了</mark></strong>， &lt;…&gt; <strong><mark>只要有衣有食，就当知足</mark></strong>。 <strong><mark>但那些想要发财的人，就陷在迷惑</mark></strong>、落在网罗和许多无知有害的私欲里，叫人沉在败坏和灭亡中。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/6/#L6,8-9">提前 6:6,8-9</a>)</p></blockquote><blockquote><p>“我并不是因缺乏说这话，<strong><mark>我无论在什么景况都可以知足</mark></strong>，这是我已经学会了。 <strong><mark>我知道怎样处卑贱，也知道怎样处丰富</mark></strong>，或饱足、或饥饿、或有余、或缺乏，随事随在，我都得了祕诀。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/fil/4/#L11-12">腓 4:11-12</a>)</p></blockquote><blockquote><p>“<strong><mark>这些人是私下议论、常发怨言的</mark></strong>，随从自己的情欲而行，口中说夸大的话，为得便宜谄媚人。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iud/1/#L16">犹 1:16</a>)</p></blockquote>
