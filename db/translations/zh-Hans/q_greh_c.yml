- src: cICd_Ложь_обман
  path: QS4A_谎言（欺骗）
  title: 谎言（欺骗）
  copy_cover: true
  body: <blockquote><p>“<strong><mark>你们是出于你们的父魔鬼</mark></strong>，你们父的私欲，你们偏要行。他从起初是杀人的，不守真理，因他心里没有真理。他说谎是出于自己，因<strong><mark>他本来是说谎的，也是说谎之人的父</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/8/#L44">约 8:44</a>)</p></blockquote><blockquote><p>“作假见证的，必不免受罚；<strong><mark>吐出谎言的，终不能逃脱</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/19/#L5">箴 19:5</a>)</p></blockquote><blockquote><p>“<strong><mark>不可作假见证陷害人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/20/#L16">出 20:16</a>)</p></blockquote><blockquote><p>“你们不可偷盗。<strong><mark>不可欺骗。也不可彼此说谎</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/19/#L11">利 19:11</a>)</p></blockquote><blockquote><p>“但现在你们要弃绝这一切的事，以及恼恨、忿怒、恶毒、毁谤，并口中污秽的言语。 <strong><mark>不要彼此说谎</mark></strong>，因你们已经脱去旧人和旧人的行为，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/3/#L8-9">西 3:8-9</a>)</p></blockquote><blockquote><p>“<strong><mark>所以你们要弃绝谎言，各人与邻舍说实话</mark></strong>，因为我们是互相为肢体。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/4/#L25">弗 4:25</a>)</p></blockquote><blockquote><p>“<strong><mark>凡不义的事都是罪</mark></strong>，也有不至于死的罪。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/5/#L17">约壹 5:17</a>)</p></blockquote><blockquote><p>“<strong><mark>说谎言的嘴，为耶和华所憎恶</mark></strong>；行事诚实的，为他所喜悦。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/12/#L22">箴 12:22</a>)</p></blockquote><blockquote><p>“狂傲人不能站在你眼前；凡作孽的，都是你所恨恶的。 <strong><mark>说谎言的，你必灭绝</mark></strong>；好流人血弄诡诈的，都为耶和华所憎恶。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/5/#L5-6">诗 5:5-6</a>)</p></blockquote><blockquote><p>“「<strong><mark>行诡诈的在群中有公羊，他许愿却用有残疾的献给主，这人是可咒诅的</mark></strong>，因为我是大君王，我的名在外邦中是可畏的。」这是万军之耶和华说的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mal/1/#L14">玛 1:14</a>)</p></blockquote>
