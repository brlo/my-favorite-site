  path: QS3A_不饶恕
  title: 不饶恕
  copy_cover: true
  body: <blockquote><p>“<strong><mark>怜恤人的人有福了</mark></strong>，<strong><mark>因为他们必蒙怜恤</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L7">太 5:7</a>)</p></blockquote><blockquote><p>“所以，你们祷告要这样说：『我们在天上的父：愿人都尊你的名为圣。 &lt;…&gt; <strong><mark>免我们的债，如同我们免了人的债</mark></strong>。 &lt;…&gt; <strong><mark>你们饶恕人的过犯，你们的天父也必饶恕你们的过犯</mark></strong>； <strong><mark>你们不饶恕人的过犯，你们的天父也必不饶恕你们的过犯</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/6/#L9,12,14-15">太 6:9,12,14-15</a>)</p></blockquote><blockquote><p>“你们不要论断人，就不被论断；你们不要定人的罪，就不被定罪；<strong><mark>你们要饶恕人，就必蒙饶恕</mark></strong>；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L37">路 6:37</a>)</p></blockquote><blockquote><p>“那时，彼得进前来，对耶稣说：「主啊，<strong><mark>我弟兄得罪我，我当饶恕他几次呢</mark></strong>？到七次可以吗？」 耶稣说：「我对你说：不是到七次，乃是到七十个七次。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/18/#L21-22">太 18:21-22</a>)</p></blockquote><blockquote><p>“并要以恩慈相待，存怜悯的心，<strong><mark>彼此饶恕</mark></strong>，<strong><mark>正如上帝在基督里饶恕了你们一样</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/4/#L32">弗 4:32</a>)</p></blockquote><blockquote><p>“<strong>我们从前也是</strong>无知，悖逆，受迷惑，服事各样私欲和宴乐，<strong><mark>常存恶毒</mark></strong>、嫉妒的心，是可恨的，又是<strong><mark>彼此相恨</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/tit/3/#L3">多 3:3</a>)</p></blockquote><blockquote><p>“所以，你在祭坛上献礼物的时候，<strong><mark>若想起弟兄向你怀怨</mark></strong>， <strong><mark>就把礼物留在坛前，先去同弟兄和好，然后来献礼物</mark></strong>。 <strong><mark>你同告你的对头还在路上，就赶紧与他和息</mark></strong>，恐怕他把你送给审判官，审判官交付衙役，你就下在监里了。 我实在告诉你：若有一文钱没有还清，你断不能从那里出来。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L23-26">太 5:23-26</a>)</p></blockquote><blockquote><p>“弟兄们，<strong><mark>你们不要彼此埋怨，免得受审判</mark></strong>。看哪，审判的主站在门前了！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/5/#L9">雅 5:9</a>)</p></blockquote><blockquote><p>“装满了各样不义、邪恶、贪婪、恶毒，满心是嫉妒、凶杀、<strong><mark>争竞</mark></strong>、诡诈、毒恨， 又是谗毁的、背后说人的、怨恨上帝的、<strong><mark>侮慢人的</mark></strong>、<strong><mark>狂傲的</mark></strong>、自夸的、捏造恶事的、违背父母的、 无知的、背约的、无亲情的、<strong><mark>不怜悯人的</mark></strong>。 他们虽知道上帝判定<strong><mark>行这样事的人是当死的</mark></strong>，然而他们不但自己去行，还喜欢别人去行。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/1/#L29-32">罗 1:29-32</a>)</p></blockquote><blockquote><p>“情欲的事都是显而易见的，就如奸淫、污秽、邪荡、 拜偶像、邪术、<strong><mark>仇恨</mark></strong>、争竞、忌恨、<strong><mark>恼怒</mark></strong>、结党、<strong><mark>纷争</mark></strong>、异端、 <strong><mark>嫉妒</mark></strong>〔有古卷在此有『凶杀』二字〕、醉酒、荒宴等类。我从前告诉你们，现在又告诉你们，<strong><mark>行这样事的人必不能承受上帝的国</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/5/#L19-21">加 5:19-21</a>)</p></blockquote><blockquote><p>“于是，主人叫了他来，对他说：『<strong><mark>你这恶奴才！你央求我，我就把你所欠的都免了</mark></strong>。 <strong><mark>你不应当怜恤你的同伴，像我怜恤你吗</mark></strong>？』 主人就大怒，把他交给掌刑的，等他还清了所欠的债。 <strong><mark>你们各人若不从心里饶恕你的弟兄，我天父也要这样待你们了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/18/#L32-35">太 18:32-35</a>)</p></blockquote>
