  path: QA2A_魔鬼
  title: 魔鬼（撒但）
  copy_cover: true
  body: <h2>魔鬼（撒但）——堕落的天使</h2><p>魔鬼是上帝所造众多天使中的一位，但他不愿日后事奉上帝，也就是从上帝面前堕落了、堕落了：</p><blockquote><p>“「人子啊，你为推罗王作起哀歌说：『主耶和华如此说：你无所不备，智慧充足，全然美丽。 你曾在伊甸上帝的园中，佩戴各样宝石，就是红宝石、红璧玺、金钢石、水苍玉、红玛瑙、碧玉、蓝宝石、绿宝石、红玉和黄金，又有精美的鼓笛在你那里，都是在你受造之日预备齐全的。 <strong><mark>你是那受膏遮掩约柜的基路伯</mark></strong>，我将你安置在上帝的圣山上，你在发光如火的宝石中间往来。 你从受造之日所行的都完全，<strong><mark>后来在你中间又察出不义</mark></strong>。 因你贸易很多，就被强暴的事充满，<strong><mark>以致犯罪</mark></strong>，所以我因你亵渎圣地，就从上帝的山驱逐你。遮掩约柜的基路伯阿，我已将你从发光如火的宝石中除灭。 <strong><mark>你因美丽心中高傲</mark></strong>，<strong><mark>又因荣光败坏智慧</mark></strong>，<strong><mark>我已将你摔倒在地</mark></strong>，使你倒在君王面前，好叫他们目睹眼见。 你因罪孽众多，贸易不公，就亵渎你那里的圣所。故此，<strong><mark>我使火从你中间发出烧灭你</mark></strong>，使你在所有观看的人眼前变为地上的炉灰。 各国民中，凡认识你的都必为你惊奇。你令人惊恐，不再存留于世，直到永远。』」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iez/28/#L12-19">结 28:12-19</a>)</p></blockquote><p>这些从上帝面前堕落的天使，用不同的词来称呼：鬼（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/8/#L31">太 8:31</a>）、魔（<a href="https://bibleox.com/zh-Hans/cn-cuv/tov/6/#L8">多 6:8</a>）、撒但的差役（<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/12/#L7">林后 12:7</a>）、污鬼（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/10/#L1">太 10:1</a>）、「黑鬼」（民间的称呼）。撒但还被称为蛇（<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/3/#L1">创 3:1</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/is/27/#L1">赛 27:1</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/12/#L9">启 12:9</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/20/#L2">启 20:2</a>）、龙（<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/12/#L9">启 12:9</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/20/#L2">启 20:2</a>）、明亮之星（<a href="https://bibleox.com/zh-Hans/cn-cuv/is/14/#L12">赛 14:12</a>）、鳄鱼（利维坦）（<a href="https://bibleox.com/zh-Hans/cn-cuv/is/27/#L1">赛 27:1</a>）、这世界的王（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/12/#L31">约 12:31</a>）、恶者（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/13/#L19">太 13:19</a>）、谎言的灵（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/22/#L22">王上 22:22</a>）。魔鬼不是一种没有位格的感觉，不是人心中某种抽象的冲动，也不是寓意。他是真实的存有，是一个位格。魔鬼是最初犯罪的存有：</p><blockquote><p>“<strong><mark>犯罪的是属魔鬼，因为魔鬼从起初就犯罪</mark></strong>。上帝的儿子显现出来，为要除灭魔鬼的作为。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/3/#L8">约壹 3:8</a>)</p></blockquote><h2>魔鬼有自己的意志</h2><blockquote><p>“叫他们这<strong><mark>已经被魔鬼任意掳去的</mark></strong>，可以醒悟，脱离他的网罗。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/2/#L26">提后 2:26</a>)</p></blockquote><h2>魔鬼借着把恶念提供给人而行动</h2><blockquote><p>“彼得说：「亚拿尼亚，<strong><mark>为什么撒但充满了你的心，叫你欺哄圣灵</mark></strong>，把田地的价银私自留下几分呢？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/5/#L3">徒 5:3</a>)</p></blockquote><blockquote><p>“吃晚饭的时候<strong>（魔鬼已将卖耶稣的意思，放在西门的儿子加略人犹大心里）</strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/13/#L2">约 13:2</a>)</p></blockquote><h2>撒但从天上坠落了</h2><blockquote><p>“耶稣对他们说：「<strong><mark>我曾看见撒但从天上坠落，像闪电一样</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/10/#L18">路 10:18</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/iez/28/#L12-19">结 28:12-19</a>)</p></blockquote><h2>他拉走了另一些天使</h2><blockquote><p>“<strong><mark>就是天使犯了罪，上帝也没有宽容，曾把他们丢在地狱</mark></strong>，交在黑暗坑中，等候审判；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2pet/2/#L4">彼后 2:4</a>)</p></blockquote><h2>因着魔鬼，死亡进入了世界</h2><blockquote><p>“但<strong>因魔鬼的嫉妒，死亡才进入了世界</strong>；只有与他结缘的人，才经历死亡。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prs/2/#L24">智 2:24</a>)</p></blockquote><h2>魔鬼——人的仇敌。寻找可吞吃、可拉人一同灭亡的人</h2><blockquote><p>“务要谨守、儆醒，因为<strong><mark>你们的仇敌魔鬼，如同吼叫的狮子</mark></strong>，遍地游行，<strong><mark>寻找可吞吃的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/5/#L8">彼前 5:8</a>)</p></blockquote><h2>魔鬼——人得救恩的敌对者</h2><blockquote><p>“这比喻乃是这样：种子就是上帝的道。 那些在路旁的，就是人听了道，<strong><mark>随后魔鬼来，从他们心里把道夺去</mark></strong>，<strong><mark>恐怕他们信了得救</mark></strong>；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/8/#L11-12">路 8:11-12</a>)</p></blockquote><blockquote><p>“天使又指给我看，大祭司约书亚站在耶和华的使者面前，<strong><mark>撒但也站在约书亚的右边，与他作对</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/zah/3/#L1">亚 3:1</a>)</p></blockquote><h2>魔鬼装作上帝的天使</h2><blockquote><p>“这也不足为怪，因为<strong><mark>连撒但也装作光明的天使</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/11/#L14">林后 11:14</a>)</p></blockquote><h2>魔鬼逃离顺服上帝、抵挡魔鬼的人</h2><blockquote><p>“故此，<strong><mark>你们要顺服上帝。务要抵挡魔鬼，魔鬼就必离开你们逃跑了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/4/#L7">雅 4:7</a>)</p></blockquote><h2>魔鬼通晓圣经，并用它试探人、改变其意义</h2><blockquote><p>“魔鬼又领他到耶路撒冷去，叫他站在殿顶上，对他说：「<strong><mark>你若是上帝的儿子，可以从这里跳下去</mark></strong>； 因为经上记着说：『主要为你吩咐他的使者保护你。 他们要用手托着你，免得你的脚碰在石头上。』」 耶稣对他说：「经上说：『<strong><mark>不可试探主你的上帝</mark></strong>。』」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/4/#L9-12">路 4:9-12</a>)</p></blockquote><h2>魔鬼——谎言之父</h2><blockquote><p>“你们是出于你们的父魔鬼，你们父的私欲，你们偏要行。他从起初是杀人的，不守真理，<strong><mark>因他心里没有真理</mark></strong>。他说谎是出于自己，因<strong><mark>他本来是说谎的，也是说谎之人的父</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/8/#L44">约 8:44</a>)</p></blockquote><h2>魔鬼能行奇迹，能从天上降下火来</h2><blockquote><p>“耶和华对撒但说：「<strong><mark>凡他所有的都在你手中</mark></strong>，只是不可伸手加害于他。」于是撒但从耶和华面前退去。 &lt;…&gt; 他还说话的时候，又有人来说：「<strong><mark>上帝从天上降下火来，将群羊，和仆人都烧灭了</mark></strong>；惟有我一人逃脱，来报信给你。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iov/1/#L12,16">伯 1:12,16</a>)</p></blockquote><blockquote><p>“这不法的人来，<strong><mark>是照撒但的运动，行各样的异能、神迹和一切虚假的奇事</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2sol/2/#L9">帖后 2:9</a>)</p></blockquote><h2>魔鬼与上帝的天使争辩</h2><blockquote><p>“<strong><mark>天使长米迦勒为摩西的尸首与魔鬼争辩的时候</mark></strong>，尚且不敢用毁谤的话罪责他，只说：『主责备你吧！』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iud/1/#L9">犹 1:9</a>)</p></blockquote><h2>堕落的天使们，为永恒的刑罚预备了地方</h2><blockquote><p>“王又要向那左边的说：『<strong><mark>你们这被咒诅的人，离开我，进入那为魔鬼和他的使者所预备的永火里去</mark></strong>！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/25/#L41">太 25:41</a>)</p></blockquote><blockquote><p>“<strong><mark>那迷惑他们的魔鬼被扔在硫磺的火湖里</mark></strong>，就是兽和假先知所在的地方，<strong><mark>他们必昼夜受痛苦，直到永永远远</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/20/#L10">启 20:10</a>)</p></blockquote><h3>鬼知道这一点</h3><blockquote><p>“他们喊着说：「上帝的儿子，我们与你有什么相干？<strong><mark>时候还没有到，你就上这里来叫我们受苦吗</mark></strong>？」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/8/#L29">太 8:29</a>)</p></blockquote><h2>鬼不寻求（甘愿）遵行上帝的旨意，却不能不服从上帝的命令</h2><blockquote><p>“众人都惊讶，以致彼此对问说：「这是什么事？是个新道理啊！<strong><mark>他用权柄吩咐污鬼，连污鬼也听从了他</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/1/#L27">可 1:27</a>)</p></blockquote><blockquote><p>“鬼就央求耶稣说：「<strong><mark>若把我们赶出去，就打发我们进入猪群吧</mark></strong>！」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/8/#L31">太 8:31</a>)</p></blockquote>
