  title: 接触死者
  copy_cover: true
  body: <h2>旧约中接触死人的禁令</h2><p>接触死人使人不洁（受玷污）。但亲属可以接触自己死去的亲人而不受玷污：</p><blockquote><p>“耶和华对摩西说：「你告诉亚伦子孙作祭司的说：『<strong><mark>祭司不可为民中的死人沾染自己</mark></strong>。 <strong><mark>除非为他骨肉之亲的父母、儿女、弟兄</mark></strong>， <strong><mark>和未曾出嫁作处女的姊妹，才可以沾染自己</mark></strong>。 祭司既在民中为首，<strong><mark>就不可从俗沾染自己</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/21/#L1-4">利 21:1-4</a>)</p></blockquote><blockquote><p>“<strong><mark>有几个人因死尸而不洁净，不能在那日守逾越节</mark></strong>。当日他们到摩西、亚伦面前，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/9/#L6">民 9:6</a>)</p></blockquote><blockquote><p>“<strong><mark>凡摸了人死尸、不洁净自己的</mark></strong>，就玷污了耶和华的帐幕，这人必从以色列中剪除；因为那除污秽的水没有洒在他身上，<strong><mark>他就为不洁净，污秽还在他身上</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/19/#L13">民 19:13</a>)</p></blockquote><blockquote><p>“<strong><mark>他们不可挨近死尸沾染自己</mark></strong>，<strong><mark>只可为父亲、母亲、儿子、女儿、弟兄和未嫁人的姐妹沾染自己</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iez/44/#L25">结 44:25</a>)</p></blockquote><blockquote><p>“哈该又说：「<strong><mark>若有人因摸死尸染了污秽</mark></strong>，然后挨着这些物的那一样，这物算污秽吗？」祭司说：「<strong><mark>必算污秽</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ag/2/#L13">该 2:13</a>)</p></blockquote><h2>接触义人的遗骸</h2><p>旧约时代，有人因接触先知以利沙的圣髑而复活：</p><blockquote><p>“有人正葬死人，忽然看见一群人，就把死人抛在以利沙的坟墓里，<strong><mark>一碰着以利沙的骸骨，死人就复活站起来了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/4ts/13/#L21">王下 13:21</a>)</p></blockquote><h2>犹太规条的废除</h2><blockquote><p>“因为圣灵和我们定意<strong><mark>不将别的重担放在你们身上</mark></strong>，<strong><mark>惟有几件事是不可少</mark></strong>的， 就是禁戒祭偶像的物和血，并勒死的牲畜和奸淫。这几件你们若能自己禁戒不犯就好了。愿你们平安！」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/15/#L28-29">徒 15:28-29</a>)</p></blockquote><blockquote><p>“至于信主的外邦人，我们已经写信拟定，<strong><mark>叫他们谨忌那祭偶像之物和血，并勒死的牲畜与奸淫</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/21/#L25">徒 21:25</a>)</p></blockquote><p>详情：<a href="https://bibleox.com/ru/ru/w/Библия-Закон-Моисея-отмена">犹太规条的废除</a>。</p><h2>新约中接触死人</h2><p>主耶稣基督接触了睚鲁死去的女儿：</p><blockquote><p>“<strong><mark>就拉着孩子的手，对她说</mark></strong>：「大利大，古米！」繙出来就是说：「闺女，我吩咐你起来！」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/5/#L41">可 5:41</a>)</p></blockquote><p>按律法，基督死在十字架上之后，不能像接触已死之人那样接触他。只有上帝之母作为亲属可以这样作（<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/21/#L1-4">利 21:1-4</a>）。然而，我们不但不定神学家约翰、尼哥底母、亚利马太人约瑟的罪，反而称赞他们毫无畏惧、服事我们的救主：</p><blockquote><p>“<strong><mark>约瑟取了身体，用干净细麻布裹好</mark></strong>， <strong><mark>安放在自己的新坟墓里</mark></strong>，就是他凿在磐石里的。他又把大石头滚到墓门口，就去了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/27/#L59-60">太 27:59-60</a>)</p></blockquote><blockquote><p>“<strong><mark>约翰的门徒听见了，就来把他的尸首领去，葬在坟墓里</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/6/#L29">可 6:29</a>)</p></blockquote><blockquote><p>“既从百夫长得知实情，<strong><mark>就把耶稣的尸首赐给约瑟</mark></strong>。 <strong><mark>约瑟买了细麻布，把耶稣取下来</mark></strong>，用细麻布裹好，<strong><mark>安放在磐石中凿出来的坟墓里</mark></strong>，又滚过一块石头来挡住墓门。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/15/#L45-46">可 15:45-46</a>)</p></blockquote><blockquote><p>“既成就了经上指着他所记的一切话，<strong><mark>就把他从木头上取下来，放在坟墓里</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/13/#L29">徒 13:29</a>)</p></blockquote><p>使徒接触死去的孩子：</p><blockquote><p>“有一个少年人，名叫犹推古，坐在窗台上困倦沉睡。保罗讲了多时，少年人睡熟了，就从三层楼上掉下去；扶起他来，已经死了。 <strong><mark>保罗下去，伏在他身上，抱着他说</mark></strong>：「你们不要发慌，他的灵魂还在身上。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/20/#L9-10">徒 20:9-10</a>)</p></blockquote>
