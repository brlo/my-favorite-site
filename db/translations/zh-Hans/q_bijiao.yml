- src: притча-о-работниках-в-винограднике
  path: QPr2A_葡萄园雇工的比喻
  title: 葡萄园雇工的比喻
  copy_cover: true
  body: <p>耶稣基督关于葡萄园中不同雇工得同样工价的比喻：</p><blockquote><p>“因为天国好像家主清早去雇人进他的葡萄园作工， <strong><mark>和工人讲定一天一钱银子</mark></strong>，就打发他们进葡萄园去。 约在巳初出去，看见市上还有闲站的人， 就对他们说：『你们也进葡萄园去，所当给的，我必给你们。』他们也进去了。 约在午正和申初又出去，也是这样行。 约在酉初出去，看见还有人站在那里，就问他们说：『你们为什么整天在这里闲站呢？』 他们说：『因为没有人雇我们。』他说：『你们也进葡萄园去。』 到了晚上，园主对管事的说：『叫工人都来，给他们工钱，<strong><mark>从后来的起，到先来的为止</mark></strong>。』 约在酉初雇的人来了，各人得了一钱银子。 <strong><mark>及至那先雇的来了，他们以为必要多得，谁知也是各得一钱</mark></strong>。 他们得了，就埋怨家主说： 『我们整天劳苦受热，那后来的只做了一小时，你竟叫他们和我们一样吗？』 家主回答其中的一人说：『朋友，<strong><mark>我不亏负你</mark></strong>，你与我讲定的不是一钱银子吗？ 拿你的走吧！我给那后来的和给你一样，这是我愿意的。 <strong><mark>我的东西难道不可随我的意思用吗？因为我作好人，你就红了眼吗</mark></strong>？』 <strong><mark>这样，那在后的将要在前；在前的将要在后了</mark></strong>〔有古卷在此有『因为被召的人多，选上的人少』〕。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/20/#L1-16">太 20:1-16</a>)</p></blockquote>
