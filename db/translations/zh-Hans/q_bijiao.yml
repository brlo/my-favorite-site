- src: притча-о-званных-на-пир
  path: QPr7A_婚宴的比喻
  title: 婚宴的比喻
  copy_cover: true
  body: <blockquote><p>“「<strong><mark>天国好比一个王为他儿子摆设娶亲的筵席</mark></strong>， 就打发仆人去，请那些被召的人来赴席；<strong><mark>他们却不肯来</mark></strong>。 王又打发别的仆人，说：『你们告诉那被召的人，我的筵席已经预备好了，牛和肥畜已经宰了，各样都齐备．请你们来赴席。』 那些人不理就走了：一个到自己田里去，一个作买卖去， 其余的拿住仆人，凌辱他们，把他们杀了。 王就大怒，发兵除灭那些凶手，烧毁他们的城。 于是对仆人说：『喜筵已经齐备，只是<strong><mark>所召的人不配</mark></strong>。 所以你们要往岔路口上去，<strong><mark>凡遇见的，都召来赴席</mark></strong>。』 那些仆人就出去到大路上，凡遇见的，不论善恶都召聚了来，筵席上就坐满了客。 王进来观看宾客，见那里有一个没有穿礼服的， 就对他说：『朋友，你到这里来，<strong><mark>怎么不穿礼服呢</mark></strong>？』那人无言可答。 于是王对使唤的人说：『捆起他的手脚来，<strong><mark>把他丢在外边的黑暗里</mark></strong>．在那里必要哀哭切齿了。』 <strong><mark>因为被召的人多，选上的人少</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/22/#L2-14">太 22:2-14</a>)</p></blockquote>
  menu:
    parent: 比喻
    title: 婚宴的比喻
    priority: 4
  references: "<p>翻译：罗季翁·弗拉索夫（借助人工智能工具）。底本：俄文原文。参考：英文、日文翻译。圣经链接指向本站的和合本（上帝版）；次经书卷引文按思高译本，无中文经文处自俄文译出。</p>"
- src: притча_о_выборе_места_на_свадьбе
  path: QPr8A_挑选婚宴座位的比喻
  title: 挑选婚宴座位的比喻
  copy_cover: true
  body: <blockquote><p>“「你被人请去赴婚姻的筵席，<strong><mark>不要坐在首位上</mark></strong>，恐怕有比你尊贵的客被他请来； 那请你们的人前来对你说：『让座给这一位吧！』你就羞羞惭惭的退到末位上去了。 你被请的时候，<strong><mark>就去坐在末位上</mark></strong>，好叫那请你的人来对你说：『朋友，请上坐。』<strong><mark>那时，你在同席的人面前就有光彩了</mark></strong>。 因为，<strong><mark>凡自高的，必降为卑；自卑的，必升为高</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/14/#L8-11">路 14:8-11</a>)</p></blockquote>
