- src: притча-об-овцах-и-козлах-по-разную-сторону-от-Господа
  path: QPr13A_绵羊和山羊的比喻
  title: 绵羊和山羊的比喻（分列在主左右）
  copy_cover: true
  body: <blockquote><p>“<strong><mark>当人子在他荣耀里</mark></strong>，同着众天使降临的时候，<strong><mark>要坐在他荣耀的宝座上</mark></strong>。 <strong><mark>万民都要聚集在他面前</mark></strong>。他要把他们分别出来，<strong><mark>好像牧羊的分别绵羊山羊一般</mark></strong>； 把绵羊安置在右边，山羊在左边。 于是，王要向那右边的说：『<strong><mark>你们这蒙我父赐福的，可来承受那创世以来为你们所预备的国</mark></strong>。 因为<strong><mark>我饿了，你们给我吃</mark></strong>；渴了，你们给我喝；我作客旅，你们留我住； 我赤身露体，你们给我穿；我病了，你们看顾我；我在监里，你们来看我。』 义人就回答说：『主啊，我们什么时候见你饿了，给你吃，渴了，给你喝？ 什么时候见你作客旅，留你住，或是赤身露体，给你穿？ 又什么时候见你病了，或是在监里，来看你呢？』 王要回答说：『我实在告诉你们：<strong><mark>这些事你们既作在我这弟兄中一个最小的身上，就是作在我身上了</mark></strong>。』 王又要向那左边的说：『<strong><mark>你们这被咒诅的人，离开我</mark></strong>，进入那为魔鬼和他的使者所预备的永火里去！ 因为我饿了，你们不给我吃；渴了，你们不给我喝； 我作客旅，你们不留我住；我赤身露体，你们不给我穿；我病了，我在监里，你们不来看顾我。』 他们也要回答说：『主啊，我们什么时候见你饿了，或渴了，或作客旅，或赤身露体，或病了，或在监里，不伺候你呢？』 王要回答说：『我实在告诉你们：这些事你们既不作在我这弟兄中一个最小的身上，就是不作在我身上了。』 <strong><mark>这些人，要往永刑里去</mark></strong>；<strong><mark>那些义人，要往永生里去</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/25/#L31-46">太 25:31-46</a>)</p></blockquote>
