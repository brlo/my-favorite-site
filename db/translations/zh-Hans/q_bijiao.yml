- src: притча-о-трёх-рабах-и-талантах-5-2-1
  path: QPr12A_才干的比喻
  title: 才干的比喻（三个仆人与五千、二千、一千）
  copy_cover: true
  body: <blockquote><p>“天国又好比一个人要往外国去，就叫了仆人来，把他的家业交给他们， <strong><mark>按着各人的才干，给他们银子，一个给了五千，一个给了二千，一个给了一千</mark></strong>，就往外国去了。 那领五千的随即拿去做买卖，另外赚了五千； 那领二千的也照样另赚了二千； 但那领一千的去掘开地，把主人的银子埋藏了。 过了许久，那些仆人的主人来了，和他们算账。 <strong><mark>那领五千银子的又带着那另外的五千来</mark></strong>，说：『主啊，你交给我五千银子。请看，我又赚了五千。』 主人说：『好！你这又良善又忠心的仆人，你在不多的事上有忠心，我要把许多事派你管理；可以进来享受你主人的快乐。』 <strong><mark>那领二千的也来</mark></strong>，说：『主啊，你交给我二千银子，请看，我又赚了二千。』 主人说：『好！你这又良善又忠心的仆人，你在不多的事上有忠心，我要把许多事派你管理；可以进来享受你主人的快乐。』 那领一千的也来，说：『主啊，我知道你是忍心的人，没有种的地方要收割，没有散的地方要聚敛， 我就害怕，去把你的一千银子埋藏在地里。请看，你的原银子在这里。』 主人回答说：『<strong><mark>你这又恶又懒的仆人</mark></strong>！你既知道我没有种的地方要收割，没有散的地方要聚敛， 就当把我的银子放给兑换银钱的人，到我来的时候，可以连本带利收回。 <strong><mark>夺过他这一千来，给那有一万的</mark></strong>！ 因为凡有的，还要加给他，叫他有余；没有的，连他所有的也要夺过来。 <strong><mark>把这无用的仆人丢在外面黑暗里</mark></strong>，在那里必要哀哭切齿了。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/25/#L14-30">太 25:14-30</a>)</p></blockquote>
