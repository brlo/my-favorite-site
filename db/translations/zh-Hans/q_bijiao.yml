- src: притча-о-двух-рабах-_благоразумном-и-злом
  path: QPr10A_两个仆人的比喻
  title: 两个仆人的比喻（忠心的和恶的）
  copy_cover: true
  body: <blockquote><p>“<strong><mark>谁是忠心有见识的仆人</mark></strong>，为主人所派，管理家里的人，按时分粮给他们呢？ 主人来到，看见他这样行，那仆人就有福了。 我实在告诉你们：<strong><mark>主人要派他管理一切所有的</mark></strong>。 <strong><mark>倘若那恶仆心里说</mark></strong>：『我的主人必来得迟』， 就动手打他的同伴，又和酒醉的人一同吃喝。 在想不到的日子，不知道的时辰，那仆人的主人要来， <strong><mark>重重的处治他</mark></strong>，定他和假冒为善的人同罪。<strong><mark>在那里必要哀哭切齿了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/24/#L45-51">太 24:45-51</a>)</p></blockquote><blockquote><p>“主说：「<strong><mark>谁是那忠心有见识的管家</mark></strong>，主人派他管理家里的人，按时分粮给他们呢？ 主人来到，看见仆人这样行，那仆人就有福了。 我实在告诉你们：<strong><mark>主人要派他管理一切所有的</mark></strong>。 那仆人若心里说『我的主人必来得迟』，就动手打仆人和使女，并且吃喝醉酒． 在他想不到的日子，不知道的时辰，那仆人的主人要来，<strong><mark>重重的处治他</mark></strong>，定他和不忠心的人同罪。 仆人知道主人的意思，却不预备，又不顺他的意思行，<strong><mark>那仆人必多受责打</mark></strong>； 惟有那不知道的，作了当受责打的事，<strong><mark>必少受责打</mark></strong>。因为多给谁，就向谁多取；多托谁，就向谁多要。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/12/#L42-48">路 12:42-48</a>)</p></blockquote>
