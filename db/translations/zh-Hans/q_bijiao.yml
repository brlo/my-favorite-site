- src: притча-о-двух-сынах
  path: QPr5A_两个儿子的比喻
  title: 两个儿子的比喻
  copy_cover: true
  body: <blockquote><p>“又说：「<strong><mark>一个人有两个儿子</mark></strong>，他来对大儿子说：『我儿，你今天到葡萄园里去作工。』 他回答说：『<strong><mark>我不去』，以后自己懊悔，就去了</mark></strong>。 又来对小儿子也是这样说。他回答说：『父阿，我去』，他却不去。 你们想这两个儿子，是那一个遵行父命呢？」他们说：「大儿子。」耶稣说：「<strong><mark>我实在告诉你们：税吏和娼妓倒比你们先进上帝的国</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/21/#L28-31">太 21:28-31</a>)</p></blockquote>
