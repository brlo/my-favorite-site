  path: QPr1A_恶园户的比喻
  title: 恶园户的比喻
  copy_cover: true
  body: <p>耶稣基督关于恶园户的比喻：</p><blockquote><p>“你们再听一个比喻：<strong><mark>有个家主，栽了一个葡萄园</mark></strong>，周围圈上篱笆，里面挖了一个压酒池，盖了一座楼，租给园户，就往外国去了。 收果子的时候近了，就打发仆人到园那户里去收果子。 <strong><mark>园户拿住仆人，打了一个，杀了一个，用石头打死一个</mark></strong>。 主人又打发别的仆人去，比先前更多，园户还是照样待他们。 后来打发他的儿子到他们那里去，意思说：『他们必尊敬我的儿子。』 不料，园户看见他儿子，就彼此说：『<strong><mark>这是承受产业的。来吧！我们杀他</mark></strong>，佔他的产业！』 他们就拿住他，推出葡萄园外杀了。 园主来的时候，要怎样处治这些园户呢？」 他们说：「<strong><mark>要下毒手除灭那些恶人</mark></strong>，将葡萄园另租给那按着时候交果子的园户。」 &lt;…&gt; <strong><mark>祭司长和法利赛人听见他的比喻，就看出他是指着他们说的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/21/#L33-41,45">太 21:33-41,45</a>)</p></blockquote>
