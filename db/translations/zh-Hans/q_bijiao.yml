- src: притча-о-десяти-девах-мудрых-и-неразумных
  path: QPr11A_十个童女的比喻
  title: 十个童女的比喻（聪明的和愚拙的）
  copy_cover: true
  body: <blockquote><p>“那时，天国好比十个童女拿着灯出去迎接新郎。 <strong><mark>其中有五个是愚拙的，五个是聪明的</mark></strong>。 <strong><mark>愚拙的拿着灯，却不预备油</mark></strong>； <strong><mark>聪明的拿着灯，又预备油在器皿里</mark></strong>。 新郎迟延的时候，她们都打盹睡着了。 半夜有人喊着说：『新郎来了，你们出来迎接他！』 那些童女就都起来收拾灯。 愚拙的对聪明的说：『请分点油给我们，因为我们的灯要灭了。』 聪明的回答说：『恐怕不够你我用的，不如你们自己到卖油的那里去买吧！』 她们去买的时候，新郎到了．<strong><mark>那预备好了的，同他进去坐席，门就关了</mark></strong>。 其余的童女随后也来了，说：『主啊，主阿，给我们开门！』 他却回答说：『我实在告诉你们：<strong><mark>我不认识你们</mark></strong>。』 所以，<strong><mark>你们要儆醒，因为那日子、那时辰，你们不知道</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/25/#L1-13">太 25:1-13</a>)</p></blockquote>
