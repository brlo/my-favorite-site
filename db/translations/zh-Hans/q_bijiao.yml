- src: Притча_о_блудном_сына
  path: QPr6A_浪子的比喻
  title: 浪子的比喻
  copy_cover: true
  body: <blockquote><p>“耶稣又说：「<strong><mark>一个人有两个儿子</mark></strong>。 小儿子对父亲说：『父亲，请你把我应得的家业分给我。』他父亲就把产业分给他们。 过了不多几日，小儿子就把他一切所有的都收拾起来，往远方去了。在那里<strong><mark>任意放荡，浪费资财</mark></strong>。 既耗尽了一切所有的，又遇着那地方大遭饥荒，就穷苦起来。 于是去投靠那地方的一个人，那人打发他到田里去放猪。 他恨不得拿猪所吃的豆荚充饥，也没有人给他。 <strong><mark>他醒悟过来</mark></strong>，就说：『我父亲有多少的雇工，口粮有余，我倒在这里饿死吗？ 我要起来，到我父亲那里去，向他说：<strong><mark>父亲！我得罪了天，又得罪了你</mark></strong>； 从今以后，我不配称为你的儿子，把我当作一个雇工吧！』 于是起来，往他父亲那里去。<strong><mark>相离还远，他父亲看见，就动了慈心，跑去抱着他的颈项</mark></strong>，连连与他亲嘴。 儿子说：『父亲！我得罪了天，又得罪了你；从今以后，我不配称为你的儿子。』 父亲却吩咐仆人说：『把那上好的袍子快拿出来给他穿，把戒指戴在他指头上，把鞋穿在他脚上， 把那肥牛犊牵来宰了，我们可以吃喝快乐。 <strong><mark>因为我这个儿子是死而复活，失而又得的</mark></strong>。』他们就快乐起来。 那时，大儿子正在田里。他回来，离家不远，听见作乐跳舞的声音， 便叫过一个仆人来，问是什么事。 仆人说：『你兄弟来了。你父亲因为得他无灾无病的回来，把肥牛犊宰了！』 大儿子却生气，不肯进去。他父亲就出来劝他。 他对父亲说：『我服事你这多年，从来没有违背过你的命，你并没有给我一只山羊羔，叫我和朋友一同快乐。 但你这个儿子和娼妓吞尽了你的产业，他一来了，你倒为他宰了肥牛犊。』 父亲对他说：『儿啊！你常和我同在，我一切所有的都是你的； <strong><mark>只是你这个兄弟是死而复活、失而又得的，所以我们理当欢喜快乐</mark></strong>。』」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/15/#L11-32">路 15:11-32</a>)</p></blockquote>
  menu:
