- src: о-мытаре-и-фарисее
  path: QPr3A_税吏和法利赛人的比喻
  title: 税吏和法利赛人的比喻
  copy_cover: true
  body: <blockquote><p>“说：「有两个人上殿里去祷告：<strong><mark>一个是法利赛人，一个是税吏</mark></strong>。 法利赛人站着，自言自语的祷告说：『上帝啊，我感谢你，我不像别人勒索、不义、奸淫，也不像这个税吏。 我一个礼拜禁食两次，凡我所得的都捐上十分之一。』 <strong><mark>那税吏远远的站着，连举目望天也不敢</mark></strong>，只捶着胸说：『<strong><mark>上帝啊，开恩可怜我这个罪人</mark></strong>！』 我告诉你们：这人回家去比那人倒算为义了。因为<strong><mark>凡自高的，必降为卑；自卑的，必升为高</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/18/#L10-14">路 18:10-14</a>)</p></blockquote>
