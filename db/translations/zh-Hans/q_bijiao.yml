- src: притча_о_богаче_и_Лазаре
  path: QPr9A_财主和拉撒路的比喻
  title: 财主和拉撒路的比喻
  copy_cover: true
  body: <blockquote><p>“<strong><mark>有一个财主，穿着紫色袍和细麻布衣服，天天奢华宴乐</mark></strong>。 <strong><mark>又有一个讨饭的，名叫拉撒路</mark></strong>，浑身生疮，被人放在财主门口， 要得财主桌子上掉下来的零碎充饥，并且狗来餂他的疮。 <strong><mark>后来那讨饭的死了，被天使带去放在亚伯拉罕的怀里</mark></strong>。财主也死了，并且埋葬了。 <strong><mark>他在阴间受痛苦</mark></strong>，举目远远的望见亚伯拉罕，又望见拉撒路在他怀里， 就喊着说：『我祖亚伯拉罕哪，可怜我吧！打发拉撒路来，用指头尖蘸点水，凉凉我的舌头，因为我在这火焰里，极其痛苦。』 亚伯拉罕说：『<strong><mark>儿啊，你该回想你生前享过福，拉撒路也受过苦</mark></strong>；如今他在这里得安慰，你倒受痛苦。 不但这样，并且<strong><mark>在你我之间，有深渊限定</mark></strong>，以致人要从这边过到你们那边是不能的；要从那边过到我们这边也是不能的。』 财主说：『我祖啊！既是这样，求你打发拉撒路到我父家去， 因为我还有五个弟兄，他可以对他们作见证，免得他们也来到这痛苦的地方。』 亚伯拉罕说：『他们有摩西和先知的话可以听从。』 他说：『我祖亚伯拉罕哪，不是的．若有一个从死里复活的，到他们那里去的，他们必要悔改。』 亚伯拉罕说：『<strong><mark>若不听从摩西和先知的话</mark></strong>，就是有一个从死里复活的，他们也是不听劝。』」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/16/#L19-31">路 16:19-31</a>)</p></blockquote>
  menu:
    parent: 比喻
    title: 财主和拉撒路的比喻
