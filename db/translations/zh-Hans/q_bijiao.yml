- src: о_милосердном_самарянине
  path: QPr4A_好撒玛利亚人的比喻
  title: 好撒玛利亚人的比喻
  copy_cover: true
  body: <blockquote><p>“那人要显明自己有理，就对耶稣说：「<strong><mark>谁是我的邻舍呢</mark></strong>？」 耶稣回答说：「有一个人从耶路撒冷下耶利哥去，落在强盗手中。他们剥去他的衣裳，把他打个半死，就丢下他走了。 偶然有一个祭司从这条路下来，看见他就从那边过去了。 又有一个利未人来到这地方，看见他，也照样从那边过去了。 <strong><mark>惟有一个撒玛利亚人行路来到那里，看见他就动了慈心</mark></strong>， 上前用油和酒倒在他的伤处，包裹好了，扶他骑上自己的牲口，带到店里去照应他。 第二天拿出二钱银子来，交给店主，说：『你且照应他．此外所费用的，我回来必还你。』 <strong><mark>你想，这三个人哪一个是落在强盗手中的邻舍呢</mark></strong>？」 他说：「<strong><mark>是怜悯他的</mark></strong>。」耶稣说：「<strong><mark>你去照样行吧</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/10/#L29-37">路 10:29-37</a>)</p></blockquote>
  menu:
