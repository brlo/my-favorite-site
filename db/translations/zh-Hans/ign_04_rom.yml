    title: 致罗马人书
    meta_desc: 安提阿的圣伊格那丢（提阿弗罗斯）写给罗马教会的书信，表达他对殉道的渴望。译自希腊文原文，附注释。
    menu: { parent: "书信", title: "致罗马人书", priority: 4 }
    body: |-
      <h2>0</h2><p>伊格那丢，又名提阿弗罗斯，致在至高的父和祂的独生子耶稣基督的威严中蒙怜悯的教会：这教会照着那愿意万有存在者的旨意，按着我们的上帝耶稣基督的爱，蒙爱、蒙光照；这教会在罗马人地区居首位[1]，配得上帝，配得尊荣，配称有福，配受称赞，配得成全，配称圣洁，在爱中居首位[2]，带着基督的名，带着父的名[3]。我奉父之子耶稣基督的名问候这教会；也问候那些在肉身和灵性上与祂的一切诫命联合、毫无分别地充满上帝恩典、被滤净一切异色[4]的人，愿你们在我们的上帝耶稣基督里，无瑕地满得喜乐。</p>
      <h2>1</h2><p>1. 我向上帝祷告，得以见到你们配得上帝的面容，所得的比我所求的还多。因为我在基督耶稣里被捆绑，希望能问候你们——只要我配得坚持到底是上帝的旨意。</p><p>2. 开头已经安排得很好，只要我能得着恩典，毫无阻碍地领受我的产业。但我怕你们的爱反而害了我。因为你们要做什么都很容易，但你们若怜惜我，我要得着上帝就难了。</p>
      <h2>2</h2><p>1. 我不愿你们讨人喜欢，而愿你们讨上帝喜欢[5]，其实你们也正讨祂喜欢。因为我再也不会有这样得着上帝的机会；你们若保持沉默，也再不会有比这更好的工作记在你们名下。你们若对我保持沉默，我就成为上帝的道；你们若爱惜我的肉身，我就又只是一个声音[6]。</p><p>2. 趁着祭坛还预备着，除了让我被浇奠给上帝[7]以外，不要再给我什么，好使你们在爱中成为合唱团，在基督耶稣里向父歌唱：上帝使叙利亚的主教配得从日出之地被召到日落之地。从世界沉落到上帝那里是美好的，好使我在祂里面升起。</p>
      <h2>3</h2><p>1. 你们从来没有嫉妒过谁，倒是教导了别人。我只愿你们在教导门徒时所吩咐的那些话，（在我身上）也得以坚定。</p><p>2. 只求你们为我祈求内外的力量，使我不但口说，而且心愿；不但被称为基督徒，而且真被看为基督徒。我若真被看为基督徒，也就可以被称为基督徒；当我不再在世人眼前出现的时候，我才是忠信的。</p><p>3. 凡看得见的，没有一样是美好的[8]。我们的上帝耶稣基督既在父里面，就更加显明了。基督教不是劝说的工作，而是伟大的工作，特别是在它被世界憎恨的时候[9]。</p>
      <h2>4</h2><p>1. 我写信给众教会，向所有人宣告：我甘心为上帝而死，只要你们不阻止。我恳求你们，不要对我施以不合时宜的好意。让我成为野兽的食物吧！借着它们，我能得着上帝。我是上帝的麦子，要被野兽的牙齿磨碎，好成为基督的纯净的饼。</p><p>2. 你们倒不如安抚野兽，好使它们成为我的坟墓，不留下我身体的任何部分，免得我安息之后成为别人的负担。当世界连我的身体也看不见的时候，我才真是耶稣基督的门徒。请你们为我向基督祈求，使我借着这些工具（野兽）成为献给上帝的祭物。</p><p>3. 我不像彼得和保罗那样吩咐你们。他们是使徒，我是被定罪的人；他们是自由的，我到如今还是奴隶。但我若受苦，就必成为耶稣基督所释放的人[10]，并要在祂里面作为自由人复活。现在我被捆绑，正在学习什么都不贪求。</p>
      <h2>5</h2><p>1. 从叙利亚到罗马，在陆地和海上，日日夜夜，我都在与野兽搏斗：我被拴在十只豹子——就是一队士兵——中间；你们越善待他们，他们就越凶恶[11]。然而，借着他们的恶待，我更加学习作门徒，但我并不因此就得称为义[12]。</p><p>2. 愿我因那为我预备的野兽得喜乐！我祈求它们很快向我扑来。我还要安抚它们，使它们快快吞吃我，不要像对待某些人那样，因害怕而不碰我。即使它们不情愿，我也要强迫它们。</p><p>3. 请原谅我；我知道什么对我有益。现在我开始作门徒了。愿看得见的和看不见的一切，都不要嫉妒我，使我能得着耶稣基督。火和十字架，成群的野兽，切割，撕裂，骨头被拆散，肢体被砍碎，全身被磨碎，魔鬼的酷刑，都临到我吧——只要我能得着耶稣基督。</p>
      <h2>6</h2><p>1. 世界的极地[13]和这世代的诸国对我都毫无益处。为基督耶稣而死，胜过统治大地的四极[14]。我寻求那位为我们死了的；我渴慕那位为我们复活了的。分娩的时刻已临近我了[15]。</p><p>2. 弟兄们，请原谅我。不要阻止我活着，不要愿意我死。不要把愿意属于上帝的人交给世界，也不要用物质迷惑他。让我领受纯净的光吧；到了那里，我才成为（真正的）人。</p><p>3. 请允许我效法我的上帝的受难。谁里面有祂，就请他明白我所渴望的，体谅我，因为他知道那催逼我的是什么。</p>
      <h2>7</h2><p>1. 这世代之王想要把我掳去，败坏我向往上帝的心志。所以，你们在场的人谁也不要帮助他，而要站在我这边，就是站在上帝这边。不要口里说耶稣基督，心里却贪恋世界。不要让嫉妒住在你们中间。</p><p>2. 即使我到了你们那里亲自恳求你们，也不要听我；倒要听从我现在写给你们的这些话。我活着写信给你们，却渴慕死亡。我的爱欲（ἔρως）已经被钉在十字架上[16]，在我里面没有爱恋物质的火，只有活水[17]在我里面说话，从里面对我说：“到父那里去吧。”</p><p>3. 我不喜爱可朽坏的食物，也不喜爱今生的享乐。我所渴望的是上帝的饼，就是耶稣基督的肉身——祂出于大卫的后裔；我所渴望的饮料是祂的血，就是不朽坏的爱。</p>
      <h2>8</h2><p>1. 我不再愿意按着人生活。你们若愿意，这事就必成就。你们要愿意，好使你们也蒙（上帝）悦纳。</p><p>2. 我借这简短的信恳求你们：请相信我。耶稣基督必向你们显明我说的是真话；祂是那无伪的口，父借着祂说了真话[18]。</p><p>3. 请你们为我祈求，使我能得着。我写信给你们，不是按着肉体，而是按着上帝的心意。我若受苦，就是你们愿意我好；我若被拒绝，就是你们恨了我。</p>
      <h2>9</h2><p>1. 请你们在祷告中记念叙利亚的教会；如今那教会不再有我，而以上帝为牧人。唯有耶稣基督和你们的爱要作它的主教。</p><p>2. 至于我，我耻于被称为他们中间的一员，因为我不配，我是他们中最小的，是未到产期而生的[19]；但我若得着上帝，就是蒙了怜悯，得以成为一个人物。</p><p>3. 我的灵和那些奉耶稣基督的名接待我、不把我当作过路人的众教会的爱，向你们问安。连那些不在我肉身路途上的教会，也一城一城地为我送行。</p>
      <h2>10</h2><p>1. 我是从士每拿，借着那些配称有福的以弗所人写这封信给你们的。与我在一起的，还有别人，以及克罗库斯——我所爱慕的名字。</p><p>2. 至于那些为上帝的荣耀先我从叙利亚前往罗马的人，我相信你们已经认识了；请你们告诉他们，我已经近了。他们都是配得上帝、也配得你们的人；你们理当在一切事上使他们得到安慰。</p><p>3. 我写这信是在九月朔日前第九日[20]。愿你们在耶稣基督的忍耐中安好到底。</p>
    references: |-
      <ol><li><p>ἥτις καὶ προκάθηται ἐν τόπῳ χωρίου Ῥωμαίων。意思是：在罗马及其周边地区（领导教会），居于首位。也有学者理解为是在说罗马教会的特殊地位。</p></li><li><p>προκαθημένη τῆς ἀγάπης。可以理解为“在爱中居首位”，也可以理解为“主持爱的团契（众教会的相通）”。罗马教会以接济其他教会中贫困的弟兄而闻名。</p></li><li><p>χριστώνυμος, πατρώνυμος。古拉丁文、叙利亚文和亚美尼亚文译本作 χριστόνομος“持守基督律法的”。</p></li><li><p>意思是：被滤净一切异色，即一切错误的教训。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/gal/1/#L10">迦 1:10</a>。</p></li><li><p>意思是：你们若不阻止我殉道而保持沉默，我的死本身就成为上帝的道（为上帝作的见证）；你们若怜惜我的生命，我就只是一个没有意义的声音。叙利亚文译本作“我将成为上帝的道”。</p></li><li><p>σπονδισθῆναι，“被浇奠”。参见<a href="https://bibleox.com/zh-Hans/cn-sb/fil/2/#L17">斐 2:17</a>、<a href="https://bibleox.com/zh-Hans/cn-sb/2tim/4/#L6">弟后 4:6</a>。</p></li><li><p>古拉丁文、叙利亚文和亚美尼亚文译本在此后加上“因为看得见的是暂时的，看不见的才是永远的”（<a href="https://bibleox.com/zh-Hans/cn-sb/2kor/4/#L18">格后 4:18</a>），但希腊文本中没有这句话。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/in/15/#L18-19">若 15:18-19</a>。</p></li><li><p>ἀπελεύθερος，“被释放的奴隶”。参见<a href="https://bibleox.com/zh-Hans/cn-sb/1kor/7/#L22">格前 7:22</a>。</p></li><li><p>一般认为是指基督徒为了缓和押解士兵的严厉，送给他们礼物。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/1kor/4/#L4">格前 4:4</a>。</p></li><li><p>τὰ πέρατα τοῦ κόσμου。有些抄本作 τὰ τερπνὰ τοῦ κόσμου“世上的乐趣”。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/mf/16/#L26">玛 16:26</a>、<a href="https://bibleox.com/zh-Hans/cn-sb/fil/1/#L21">斐 1:21</a>。</p></li><li><p>ὁ τοκετός，“分娩”。指借着殉道诞生进入天上的生命。古拉丁文译本译为“利益”（lucrum）。</p></li><li><p>ὁ ἐμὸς ἔρως ἐσταύρωται。意思是：我对这世上事物的欲望已经被钉在十字架上，死了（参见<a href="https://bibleox.com/zh-Hans/cn-sb/gal/5/#L24">迦 5:24</a>、<a href="https://bibleox.com/zh-Hans/cn-sb/gal/6/#L14">6:14</a>）。自古也有人理解为“我所爱的那一位（基督）被钉了十字架”，并这样引用。</p></li><li><p>活水，指激励人殉道的圣灵（参见<a href="https://bibleox.com/zh-Hans/cn-sb/in/4/#L10">若 4:10</a>、<a href="https://bibleox.com/zh-Hans/cn-sb/in/7/#L38">若 7:38</a>）。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/in/14/#L6">若 14:6</a>、<a href="https://bibleox.com/zh-Hans/cn-sb/evr/6/#L18">希 6:18</a>。</p></li><li><p>ἔκτρωμα，“未到产期而生的”。参见<a href="https://bibleox.com/zh-Hans/cn-sb/1kor/15/#L8-9">格前 15:8-9</a>。</p></li><li><p>按罗马历“九月朔日（Kalendae）前第九日”，即8月24日。</p></li></ol>
      <p>翻译：罗季翁·弗拉索夫（借助人工智能工具）。底本：希腊文原文（<a href="https://bibleox.com/zh-Hans/grc/w/ΙγνΘ_Ρωμ">本站的希腊文版本</a>，明显的脱漏据莱特福特本和霍姆斯本补足）。参考：俄文译本（《早期教父文选》，布鲁塞尔，1988年）、英文译本（Roberts–Donaldson）、法文译本（Genoude，1837年）。圣经链接指向本站的思高本。</p>
