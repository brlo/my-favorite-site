  path: QO23A_饼与无酵饼
  title: 饼与无酵饼（ἄρτος 与 ἄζυμα）
  copy_cover: true
  body: <h2>本文论什么</h2><p>本文以新旧约圣经文本为例，分析希腊词「ἄρτος」与「ἄζυμα」在圣餐礼问题上的用法。</p><p><strong>Ἄρτος</strong>——只是饼，不指明其性质。</p><p><strong>Ἄζυμα</strong>——无酵饼。</p><p><strong>Ἄρτος ἄζυμος</strong>——无酵的饼。「ἄρτος」一词的加添，通常发生在列举不同种类的无酵饼时（无酵的饼、无酵的薄饼）。</p><p>对这些希腊词的引用，在历史争论中被用作论据。</p><h2>争论的对象</h2><p>在关于<a href="https://bibleox.com/ru/ru/w/Евхаристия">圣餐礼</a>（东正教会的主要圣奥秘）的历史讨论中，一直有争论：主耶稣基督递给使徒们、称之为自己身体时，所用的<strong>饼</strong>是什么。</p><p>争论分为两种意见：</p><ul><li><p><strong>有酵的饼</strong>（发面的）——东正教会；</p></li><li><p><strong>无酵的饼</strong>（无酵饼）——天主教（起初也用有酵的饼）和新教（有不同做法）。</p></li></ul><p>东正教会——罗马教会直到十一世纪也属于其中——从一开始就在各地使用有酵的饼。当罗马教会脱离正教时，在罗马的诸多新做法中，也考虑到罗马放弃以有酵之饼行圣礼、转用无酵之饼的问题。后来这一问题在与新教各派别的论战中再次成为焦点。</p><p>支持在圣餐礼上使用有酵之饼的论据有一系列，其一是「ἄρτος」一词。四位传道者（马太、马可、路加、约翰）都用希腊词「<strong>ἄρτος</strong>」称呼圣餐的饼，这有理由认为饼是有酵的，因为逾越节晚餐的无酵饼在圣经中总是（无一例外）用希腊词「<strong>ἄζυμος</strong>」称呼。而且凡说到无酵饼，几乎总是直接指明它是无酵的。</p><h3>传道者马太</h3><blockquote><p>“他们吃的时候，<strong><mark>耶稣拿起饼来</mark></strong>，祝福，就擘开递给门徒，说：「你们拿着吃，这是我的身体。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/26/#L26">太 26:26</a>)</p></blockquote><h3>传道者马可</h3><blockquote><p>“他们吃的时候，<strong><mark>耶稣拿起饼来</mark></strong>，祝了福，就擘开递给他们，说：「你们拿着吃，这是我的身体。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/14/#L22">可 14:22</a>)</p></blockquote><h3>传道者路加</h3><blockquote><p>“<strong><mark>又拿起饼来</mark></strong>，祝谢了，就擘开，递给他们，说：「这是我的身体，为你们舍的，你们也应当如此行，为的是记念我。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/22/#L19">路 22:19</a>)</p></blockquote><h3>传道者约翰</h3><blockquote><p>“我这话不是指着你们众人说的，我知道我所拣选的是谁。现在要应验经上的话，说：『<strong><mark>同我吃饭的人</mark></strong>，用脚踢我。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/13/#L18">约 13:18</a>)</p></blockquote><h3>使徒保罗</h3><blockquote><p>“我当日传给你们的，原是从主领受的，<strong><mark>就是主耶稣被卖的那一夜，拿起饼来</mark></strong>， 祝谢了，就擘开，说，「<strong><mark>这是我的身体，为你们舍的</mark></strong>。你们应当如此行，为的是记念我。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/11/#L23-24">林前 11:23-24</a>)</p></blockquote><h2>圣经中的「ἄζυμος」或「ἄρτος ἄζυμος」</h2><p>在圣经中，「ἄρτος」通常指有酵的饼，而「ἄζυμος」指无酵饼。凡说到逾越节的无酵饼，圣经总是直接说明：或只说<strong>ἄζυμος</strong>（无酵饼），或说<strong>ἄρτος ἄζυμος</strong>（无酵的饼）（通常在列举不同种类无酵饼时）。这对遵行律法是重要的：要指明饼是无酵的。</p><p>比如，我们今天称白面包为「面包」，而称黑面包为「黑面包」——这区别对我们未必重要，但对犹太人在律法方面却原则性地重要：饼是不是无酵的。</p><p>这样，可以只说「ἄζυμος」（无酵的），也可以说「ἄρτος ἄζυμος」（无酵的饼），但无酵饼从不被只称为「ἄρτος」而不提及这饼的无酵性。最常见的是用一个词「ἄζυμος」称呼无酵饼。</p><p>「ἄρτος ἄζυμος」（无酵的饼）这一表达出现得少得多。加添其他词是在说到不同种类的无酵饼的时候——形状和做法不同的无酵饼。于是，加 油 做成的饼状无酵饼被称为「ἄρτος ἄζυμος」（无酵的饼），而薄饼状、抹了油的无酵饼被称为「λάγανον ἄζυμον」（无酵的薄饼）。因此在少数情形下会出现这样的组合：</p><ul><li><p>无酵的饼；</p></li><li><p>无酵的薄饼。</p></li></ul><p>如果没有列举不同种类的无酵饼，那么几乎总是用一个词称呼：<strong>ἄζυμος</strong>。</p><h2>总的画面</h2><h3>旧约</h3><p>逾越节的饼总是被称为无酵的。使用的是：「ἄζυμα」或「ἄρτος ἄζυμα」。</p><h3>新约</h3><p>圣餐的饼从不被称为无酵的。传道者们总是用「ἄρτος」一词，完全不提及晚餐上有「ἄζυμα」。</p><h2>那么，ἄρτος 或许也可以是无酵饼？</h2><p>东正教会的反对者想证明圣经中任何饼——包括无酵饼——都可称为 ἄρτος，举出极罕见的情形（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L2">出 29:2</a>和<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L23">出 29:23</a>）：那里说的是无酵饼，却只称为「ἄρτος」。这正是说到两种不同无酵饼的情形：饼（ἄρτος）和薄饼（λάγανον）。</p><p>在详细考察这几节之前，可以先指出：即便在这里，也毫不含糊地指明所说的是无酵的饼：</p><ol><li><p>在<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L2">出 29:2</a>一章的开头，这些饼（饼和薄饼）被称为：无酵的饼和无酵的薄饼。</p></li><li><p>在<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L23">出 29:23</a>一章的中部，较简短地重复：一个饼和一个薄饼，并立刻指明：「从装无酵饼的筐子中」，即无酵的。</p></li></ol><p>现在详细考察。这些词是希腊文的，因此直接查考七十士译本（LXX）的希腊文本——它是在耶稣基督诞生前两个世纪由七十二位犹太译者译成的。取 LXX 的希腊文文本（附翻译）：</p><blockquote><p>καὶ［而］<strong>ἄρτους</strong>［饼］<strong>ἀζύμους</strong>［无酵的］πεφυραμένους［调合了］ἐν［用］ἐλαίῳ［油］καὶ［和］<strong>λάγανα</strong>［薄饼］<strong>ἄζυμα</strong>［无酵的］κεχρισμένα［抹了］ἐν - ἐλαίῳ［油］；σεμίδαλιν［细面］ἐκ［用］πυρῶν［小麦］ποιήσεις［你要作］αὐτά［它们］。（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L2">出 29:2</a>）</p></blockquote><p>这里出现的是：1）<strong>无酵的饼</strong>（ἄρτους ἀζύμους）用油调合（πεφυραμένους ἐν ἐλαίῳ）；2）<strong>无酵的薄饼</strong>（λάγανα ἄζυμα）抹了油（κεχρισμένα ἐν ἐλαίῳ）。七十士译本只提到这两种无酵饼（马所拉文本——三种无酵饼）。随后上帝吩咐要用小麦的细面作成。再看下一节：</p><blockquote><p>καὶ［和］<strong>ἄρτον</strong>［饼］ἕνα［一个］ἐξ［从］ἐλαίου［油的］καὶ［和］<strong>λάγανον</strong>［薄饼］ἓν［一个］ἀπὸ［从］τοῦ - κανοῦ［筐子］τῶν - <strong>ἀζύμων</strong>［无酵的］τῶν - προτεθειμένων［摆着的］ἔναντι［在］κυρίου［主］面前。</p></blockquote><p>这里提到的仍是第二节中那两个饼：</p><ul><li><p>「一个调油的饼」；</p></li><li><p>「一个薄饼」。</p></li></ul><p>并且立刻说明：它们是从装有无酵饼的筐子中取的。况且，在这一章（第2节）已经说过这饼是无酵的。</p><p>也就是说，即便在「ἄρτος」与「ἄζυμος」连用的情形中，每次也都指明饼是无酵的。但此处给「ἄζυμος」加添其他词也有原因：这里描述的是不同的无酵饼（饼和薄饼）。如果不用附加的词来描述做法，就成了「取一个无酵饼和无酵饼」，看起来相当奇怪。</p><p>由于饼彼此不同，就需要附加的词：</p><ul><li><p>ἄρτους ἀζύμους（无酵的饼）；</p></li><li><p>λάγανα ἄζυμα（无酵的薄饼）。</p></li></ul><p>第二次：</p><ul><li><p>ἄρτον（饼）；</p></li><li><p>λάγανον（薄饼）；</p></li><li><p>从装无酵饼的筐子中（ἀζύμων）。</p></li></ul><h2>无酵饼提及的汇编</h2><h3>旧约</h3><ul><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/gen/19/#L3">创 19:3</a>：无酵饼——ἀζύμους</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/ish/12/#L8">出 12:8</a>：无酵饼——ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/ish/12/#L15">出 12:15</a>：无酵饼——ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/ish/12/#L18">出 12:18</a>：无酵饼——ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/ish/12/#L20">出 12:20</a>：无酵饼——ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/ish/12/#L39">出 12:39</a>：无酵饼——ἀζύμους</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/ish/13/#L6">出 13:6</a>：无酵饼——ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/ish/13/#L7">出 13:7</a>：无酵饼——ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/ish/23/#L15">出 23:15</a>：无酵饼——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/ish/23/#L15">出 23:15</a>：无酵饼——ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L2">出 29:2</a>：无酵的饼——ἄρτους ἀζύμους</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L2">出 29:2</a>：无酵的薄饼——λάγανα ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L23">出 29:23</a>：从装无酵饼的筐子中——ἀπὸ τοῦ κανοῦ τῶν ἀζύμων（列举饼的种类，描述受圣职礼仪）</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/ish/34/#L18">出 34:18</a>：无酵饼——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/ish/34/#L18">出 34:18</a>：无酵饼——ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/lev/2/#L4">利 2:4</a>：无酵的饼——ἄρτους ἀζύμους</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/lev/2/#L4">利 2:4</a>：无酵的薄饼——λάγανα ἄζυμα（列举饼的种类）</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/lev/2/#L5">利 2:5</a>：无酵的——ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/lev/6/#L16">利 6:16</a>：无酵的——ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/lev/7/#L12">利 7:12</a>：无酵的薄饼——λάγανα ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/lev/8/#L2">利 8:2</a>：无酵饼——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/lev/8/#L26">利 8:26</a>：一个无酵饼——ἄρτον ἕνα ἄζυμον（列举饼的种类，描述受圣职礼仪）</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/lev/10/#L12">利 10:12</a>：无酵的——ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/lev/23/#L6">利 23:6</a>：无酵饼——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/lev/23/#L6">利 23:6</a>：无酵饼——ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/chis/6/#L15">民 6:15</a>：无酵饼——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/chis/6/#L15">民 6:15</a>：无酵的薄饼——λάγανα ἄζυμα（列举饼的种类）</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/chis/6/#L17">民 6:17</a>：无酵饼——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/chis/6/#L19">民 6:19</a>：无酵的饼——ἄρτον ἕνα ἄζυμον</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/chis/6/#L19">民 6:19</a>：无酵的薄饼——λάγανον ἄζυμον（列举饼的种类）</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/chis/9/#L11">民 9:11</a>：无酵饼——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/chis/28/#L17">民 28:17</a>：无酵饼——ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/16/#L3">申 16:3</a>：无酵饼、困苦饼——「ἄζυμα, ἄρτον κακώσεως」</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/16/#L16">申 16:16</a>：无酵饼——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/nav/5/#L11">书 5:11</a>：无酵饼——ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/sud/6/#L19">士 6:19</a>：无酵饼——ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/sud/6/#L20">士 6:20</a>：无酵饼——ἄρτους τοὺς ἀζύμους</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/sud/6/#L21">士 6:21</a>：无酵饼——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/sud/6/#L21">士 6:21</a>：无酵饼——ἀζύμους</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/1ts/28/#L24">撒上 28:24</a>：无酵饼——ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/4ts/23/#L9">王下 23:9</a>：无酵饼——ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/1par/23/#L29">代上 23:29</a>：无酵的薄饼——λάγανα τὰ ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/2par/8/#L13">代下 8:13</a>：无酵饼——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/2par/30/#L13">代下 30:13</a>：无酵饼——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/2par/30/#L21">代下 30:21</a>：无酵饼——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/2par/30/#L22">代下 30:22</a>：无酵饼——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/2par/35/#L17">代下 35:17</a>：无酵饼——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/ezd/6/#L22">拉 6:22</a>：无酵饼——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/2ezd/1/#L10">厄三 1:10</a>：无酵饼——ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/2ezd/1/#L17">厄三 1:17</a>：无酵饼——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/2ezd/7/#L14">厄三 7:14</a>：无酵饼——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/iez/45/#L21">结 45:21</a>：无酵饼——ἄζυμα</p></li></ul><h3>新约</h3><ul><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/mf/26/#L17">太 26:17</a>：除酵的——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/mk/14/#L1">可 14:1</a>：除酵节——ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/mk/14/#L12">可 14:12</a>：除酵节——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/lk/22/#L1">路 22:1</a>：除酵节——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/lk/22/#L7">路 22:7</a>：除酵节——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/act/12/#L3">徒 12:3</a>：除酵的日子——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/act/20/#L6">徒 20:6</a>：除酵的日子——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/5/#L8">林前 5:8</a>：无酵饼——ἀζύμοις</p></li></ul><p>可以确信：最常见的是只说「ἄζυμος」，但有时也说「ἄρτος ἄζυμος」。没有找到任何一处把逾越节的无酵饼只称为「ἄρτος」。说到逾越节晚餐时，总是简单地说：无酵饼（ἀζύμους），不加任何附加词。当旧约中出现指向新约、教会和圣餐礼的地方时，说的则是 ἄρτος（普通的饼），或者甚至是有酵的 ἄρτος（即直接指明有酵）。我们来看这些指向新约的地方。</p><h2>麦基洗德——圣餐礼的预像</h2><p>先知和使徒们称上帝之子为按麦基洗德等次的祭司：</p><blockquote><p>“并蒙上帝<strong><mark>照着麦基洗德的等次</mark></strong>称他为大祭司。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/5/#L10">希 5:10</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/evr/5/#L6">希 5:6</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/evr/6/#L20">希 6:20</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/evr/7/#L11">希 7:11</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/evr/7/#L17">希 7:17</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/evr/7/#L21">希 7:21</a>) <em>(并见 <a href="https://bibleox.com/zh-Hans/cn-cuv/ps/110/#L4">诗 110:4</a>（俄文本编号为 Пс 109:4）。)</em></p></blockquote><p>回忆麦基洗德。族长亚伯拉罕遇见了至高上帝的神秘祭司（那时祭司职分还未设立）——撒冷王麦基洗德。麦基洗德拿普通的饼（ἄρτος）和酒出来迎接亚伯拉罕，而亚伯拉罕把十分之一献给他（那时什一奉献还未设立）：</p><blockquote><p>“又有撒冷王麦基洗德<strong><mark>带着饼和酒</mark></strong>，出来迎接；他是至高上帝的祭司。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/14/#L18">创 14:18</a>)</p></blockquote><p>麦基洗德用的只是 ἄρτος。</p><h2>吗哪——圣餐礼的预像</h2><p>旧约中在旷野里赐给犹太人以维持生命的吗哪，是圣餐礼的预像，主耶稣基督亲自指明了这一点。在旧约中，上帝称吗哪为从天降下的饼（ἄρτος）：</p><blockquote><p>“耶和华对摩西说：「<strong><mark>我要将粮食从天降给你们</mark></strong>。百姓可以出去，每天收每天的分，我好试验他们遵不遵我的法度。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/16/#L4">出 16:4</a>)</p></blockquote><p>饼在这一章中提到7次，7次都称为 ἄρτος：</p><blockquote><p>“以色列人看见，不知道是什么，就彼此对问说：「这是什么呢？」摩西对他们说：「<strong><mark>这就是耶和华给你们吃的食物</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/16/#L15">出 16:15</a>)</p></blockquote><p>天上的饼（吗哪）被称为 ἄρτος。</p><h2>上帝在幔利橡树旁向亚伯拉罕显现——圣餐礼的预像</h2><p>亚伯拉罕为上帝（以三位天使的形像显现）预备了普通饼（ἄρτος）和宰杀的「又嫩又好」的牛犊（基督祭献的预像）的筵席：</p><blockquote><p>“<strong><mark>我再拿一点饼来，你们可以加添心力</mark></strong>、然后往前去。你们既到仆人这里来，理当如此。」他们说：「就照你说的行吧！」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/18/#L5">创 18:5</a>)</p></blockquote><p>亚伯拉罕在预像圣餐礼的筵席上用的只是 ἄρτος。</p><h2>关于圣餐礼的预言</h2><p>在箴言书中，说到圣餐礼时，讲的是普通的饼（ἄρτος）：</p><blockquote><p>“<strong><mark>智慧建造房屋，凿成七根柱子</mark></strong>， 宰杀牲畜，调和旨酒，设摆筵席。 打发使女出去，自己在城中至高处呼叫， 说：「谁是愚蒙人，可以转到这里来！」又对那无知的人说： 「<strong><mark>你们来，吃我的饼，喝我调和的酒</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/9/#L1-5">箴 9:1-5</a>)</p></blockquote><p>在关于圣餐礼的预言文本中，指明的是 ἄρτος。</p><h2>五旬节——教会的诞生日</h2><p>在旧约的五旬节（在新约中，五旬节是教会的诞生日），主直接命令给他献上<strong>新的</strong>祭——<strong>有酵的（ἐζυμωμένοι）饼（ἄρτοι）</strong>和七只无残疾的羊羔：</p><blockquote><p>“到第七个安息日的次日，共计五十天，<strong><mark>又要将新素祭献给耶和华</mark></strong>。 要从你们的住处取出细面伊法十分之二，<strong><mark>加酵，烤成两个摇祭的饼</mark></strong>，<strong><mark>当作初熟之物献给耶和华</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/23/#L16-17">利 23:16-17</a>)</p></blockquote><p>旧约的五旬节明确地使用有酵的 ἄρτος。</p><h2>感恩的平安祭</h2><p>旧约中有两种平安祭：</p><ul><li><p>赞美的祭（תודה，тода）；</p></li><li><p>感恩的祭（或救恩的祭）（шеламим 或 נדר，недер）。</p></li></ul><p>平安祭包含饼的供物和牲畜的祭献。<strong>赞美</strong>的平安祭用无酵的饼献上，而若在其之外还献<strong>感恩</strong>的平安祭，则用有酵的饼献上：</p><blockquote><p>“<strong><mark>要用有酵的饼和为感谢献的平安祭</mark></strong>，与供物一同献上。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/7/#L13">利 7:13</a>)</p></blockquote><p>这样，在旧约中，感恩（救恩）的祭用有酵的饼献上。在新约中，向上帝献上饼的圣奥秘被称为<strong>「感恩礼」（Евхаристия，源自希腊文——感恩）</strong>，因为基督自己在把饼递给门徒之前，先<strong>祝谢了</strong>上帝并祝福了饼（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/22/#L19">路 22:19</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/11/#L23-24">林前 11:23-24</a>）。</p><p>也就是说，在东正教会的感恩礼中，今天所做的正是：</p><ul><li><p>取有酵的饼；</p></li><li><p>只是不与之同献祭牲，因为祭物、羔羊、逾越节——就是被钉十字架并复活的基督（<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/5/#L7">林前 5:7</a>）。</p></li></ul><p>应当注意：无酵饼被称为困苦饼（「ἄζυμα, ἄρτον κακώσεως」，<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/16/#L3">申 16:3</a>），而用有酵之饼的平安祭称为感恩的祭，或救恩的祭（תֹּודַ֥ת——感恩，σωτηρίου——救恩，<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/7/#L13">利 7:13</a>）。</p><p>*注：祭肉的肉允许在当天吃掉、不留到早晨（如同逾越节），或吃两天，但严格禁止留到第三天。若没有在第三天之前吃完，剩下的就应当烧掉，否则祭物被上帝拒绝，发生玷污和罪。这把我们引向救主的复活——第三天坟墓就空了。也就是说，在这里，有酵的饼同样指向新约——救主的复活。</p><h2>新约中关于圣餐礼的话</h2><p>举行感恩礼时总是提到 ἄρτος；引文已在上面给出。这里再看其他直接和间接的引文。它们都指向 ἄρτος：</p><blockquote><p>“<strong><mark>我是从天上降下来生命的粮</mark></strong>，人若吃这粮就必永远活着；<strong><mark>我所要赐的粮就是我的肉</mark></strong>，为世人之生命所赐的。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/6/#L51">约 6:51</a>)</p></blockquote><blockquote><p>“<strong><mark>我就是生命的粮</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/6/#L48">约 6:48</a>)</p></blockquote><blockquote><p>“<strong><mark>我们日用的饮食，天天赐给我们</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/11/#L3">路 11:3</a>)</p></blockquote><blockquote><p>“他醒悟过来，就说：『<strong><mark>我父亲有多少的雇工，口粮有余</mark></strong>，我倒在这里饿死吗？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/15/#L17">路 15:17</a>)</p></blockquote><blockquote><p>“两个人就把路上所遇见，和<strong><mark>擘饼的时候怎么被他们认出来</mark></strong>的事，都述说了一遍。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/24/#L35">路 24:35</a>)</p></blockquote><blockquote><p>“都恒心遵守使徒的教训，彼此交接，<strong><mark>擘饼，祈祷</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/2/#L42">徒 2:42</a>)</p></blockquote><blockquote><p>“他们天天同心合意恒切的在殿里，<strong><mark>且在家中擘饼</mark></strong>，存着欢喜、诚实的心用饭，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/2/#L46">徒 2:46</a>)</p></blockquote><blockquote><p>“<strong><mark>七日的第一日，我们聚会擘饼的时候</mark></strong>，保罗因为要次日起行，就与他们讲论，直讲到半夜。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/20/#L7">徒 20:7</a>)</p></blockquote><blockquote><p>“<strong><mark>保罗又上去，擘饼</mark></strong>，吃了，谈论许久，直到天亮，这才走了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/20/#L11">徒 20:11</a>)</p></blockquote><blockquote><p>“我们所祝福的杯，岂不是同领基督的血吗？<strong><mark>我们所擘开的饼，岂不是同领基督的身体吗</mark></strong>？ <strong><mark>我们虽多，仍是一个饼、一个身体</mark></strong>，<strong><mark>因为我们都是分受这一个饼</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/10/#L16-17">林前 10:16-17</a>)</p></blockquote><h2>酵——罪的预像？</h2><p>有时会遇到把旧酵的比喻用作邪恶和诡诈之酵的说法。使徒保罗正是使用<strong>旧</strong>酵的比喻，指出必须除掉它：</p><blockquote><p>“你们既是无酵的面，<strong><mark>应当把旧酵除净</mark></strong>，好使你们成为新团；因为我们逾越节的羔羊基督，已经被杀献祭了。 所以我们守这节不可用旧酵，<strong><mark>也不可用恶毒、邪恶的酵</mark></strong>，<strong><mark>只用诚实真正的无酵饼</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/5/#L7-8">林前 5:7-8</a>)</p></blockquote><p>然而，基督自己以另一种方式使用酵的比喻，把它比作天国：</p><blockquote><p>“他又对他们讲个比喻说：「<strong><mark>天国好像面酵</mark></strong>，有妇人拿来，藏在三斗面里，<strong><mark>直等全团都发起来</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/13/#L33">太 13:33</a>) <em>(并见 <a href="https://bibleox.com/zh-Hans/cn-cuv/lk/13/#L21">路 13:21</a>。)</em></p></blockquote><p>也就是说，酵是不同的。它表明小小的东西可以影响巨大的东西：酵使<strong>全</strong>团发起来。类似地，救主也用盐的比喻：盐很少，却影响整个环境。可以注意，旧约中既献无酵的饼为祭，也献有酵的饼为祭。有酵之饼所献上的，是把我们引向新约的东西——感恩的平安祭（<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/7/#L13">利 7:13</a>）和五旬节的祭（<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/23/#L16-17">利 23:16-17</a>）。而无酵饼则被称为困苦饼（<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/16/#L3">申 16:3</a>），是对埃及奴役的记念。无酵的、无味的、坚硬的、配苦菜的饼，应当提醒犹太民族那些主救他们脱离的苦难。而有酵的饼则相反——应当把心思转向蒙福的时光、脱离苦难的解脱、上帝祝福的时光。</p><h2>关于 LXX 与马所拉文本的说明</h2><p>俄文正教译本（司祭宗教译本）按马所拉文本译成（该文本在基督被钉十字架之后编成），而 LXX（在基督前两个世纪编成）只在教义上有意义的地方加以参照。东正教会诵读按 LXX 编成的教会斯拉夫语文本。这一切都很重要，因为希伯来文的马所拉文本在本主题所关注的地方与同样是犹太人所编、但以希腊文写成的 LXX 略有不同。例如在（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L2">出 29:2</a>）：马所拉文本提到三种不同的饼（虽然都是无酵的），LXX 只提到两种饼（也都是无酵的）。往后也是如此。</p>
