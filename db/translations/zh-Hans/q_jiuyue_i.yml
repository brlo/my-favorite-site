  path: QO17A_旧约耶路撒冷圣殿
  title: 旧约耶路撒冷圣殿
  copy_cover: true
  body: <h2>总体信息</h2><p>圣殿由所罗门建在摩利亚山上（<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/3/#L1">代下 3:1</a>），在耶布斯人阿珥楠的禾场（收集并簸扬麦子之处）上（<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/3/#L1">代下 3:1</a>）——所罗门的父亲大卫在那里看见了击杀民众的天使，先知迦得也指定了那里（<a href="https://bibleox.com/zh-Hans/cn-cuv/2ts/24/#L16-18">撒下 24:16-18</a>）。圣殿的建造开始于以色列人出埃及之后480年（按七十士译本为440年），即所罗门在位第四年、西弗月（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L37">王上 6:37</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/3/#L2">代下 3:2</a>）。建造在七年后完工，时为所罗门在位第十一年、布勒月（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L38">王上 6:38</a>）。</p><h2>上帝建造圣殿的命令</h2><blockquote><p>“耶和华晓谕摩西说： 「<strong><mark>你告诉以色列人当为我送礼物来</mark></strong>，凡甘心乐意的，你们就可以收下归我。 &lt;…&gt; <strong><mark>又当为我造圣所</mark></strong>，使我可以住在他们中间。 &lt;…&gt; 要谨慎作这些物件，<strong><mark>都要照着在山上指示你的样式</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/25/#L1-2,8,40">出 25:1-2,8,40</a>)</p></blockquote><blockquote><p>“<strong><mark>我们的祖宗在旷野有法柜的帐幕</mark></strong>，<strong><mark>是上帝吩咐摩西叫他照所看见的样式作的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/7/#L44">徒 7:44</a>)</p></blockquote><p>地上的圣殿按天上现实的样式建造：</p><blockquote><p>“因为基督并不是进了<strong><mark>人手所造的圣所</mark></strong>（<strong><mark>这不过是真圣所的影像</mark></strong>），乃是进了天堂，如今为我们显在上帝面前；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/9/#L24">希 9:24</a>)</p></blockquote><h2>耶路撒冷圣殿的构造</h2><p>圣殿的墙用石头建成。</p><p>*以下尺寸以肘为单位。要把肘大致换算为米，须将肘数除以2。</p><h3>圣殿的尺寸（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L2">王上 6:2</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/3/#L3">代下 3:3</a>）</h3><ul><li><p>长60肘（被一堵墙分为20肘和40肘），</p></li><li><p>宽20肘，</p></li><li><p>高30肘。</p></li></ul><p>按米算：31.5×10.5×15.75。</p><p>圣殿被一堵石墙分为两部分（各20肘和40肘）（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L16-17">王上 6:16-17</a>）：</p><ul><li><p>20肘的部分称为「至圣所」（或称「内殿」，或「殿的内部」）；</p></li><li><p>40肘的部分称为「圣所」。</p></li></ul><p>圣殿有为窗棂（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L4">王上 6:4</a>）。</p><h3>廊子</h3><p>殿前还建有廊子（不算作圣殿）。其尺寸（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L3">王上 6:3</a>）：</p><ul><li><p>长20肘；</p></li><li><p>宽10肘。</p></li><li><p>高120肘（<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/3/#L4">代下 3:4</a>）？</p></li></ul><h3>旁屋</h3><p>殿的周围建有三层旁屋（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L5">王上 6:5</a>），不触及圣殿的墙（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L6">王上 6:6</a>）。各层的宽度，从下层起：5、6、7肘。</p><h3>厢房</h3><p>殿的四周还建有厢房，用香柏木的栋梁与殿相连（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L10">王上 6:10</a>）。厢房的高度：5肘。</p><h3>圣殿的墙</h3><p>墙用凿成的石头砌成。殿的内部墙和顶棚用香柏木板遮蔽（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L9,16">王上 6:9,16</a>）。殿的地板用松木板铺地（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L15">王上 6:15</a>）。一切都用木头遮蔽，殿里一点石头都不显露（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L18">王上 6:18</a>）。殿的墙和地板也在某种程度上贴了金（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L22">王上 6:22</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/3/#L5">代下 3:5</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/3/#L7">代下 3:7</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L30">王上 6:30</a>）。通常是刻像上贴金（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L32">王上 6:32</a>）。在香柏木板上（墙和顶棚）刻着基路伯、棕树和初开的花（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L29">王上 6:29</a>）、野瓜（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L18">王上 6:18</a>）。刻于「内殿外殿」（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L29">王上 6:29</a>），即在至圣所（内殿）和圣所（外殿）。殿用宝石装饰（<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/3/#L6">代下 3:6</a>）。重要：基路伯的刻像先前就有——在会幕的幔子（壁）上（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/26/#L1">出 26:1</a>）。</p><h2>至圣所</h2><p>尺寸：20×20×20肘（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L20">王上 6:20</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/3/#L8">代下 3:8</a>），贴上精金。挂着金鍊子（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L21">王上 6:21</a>）。</p><h3>入口</h3><p>进入至圣所要经过<strong>橄榄木作的五边形门</strong>（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L31">王上 6:31</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/4/#L22">代下 4:22</a>）。门（如同墙）装饰着基路伯、棕树和初开的花的刻像。刻像贴金（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L32">王上 6:32</a>）。这里还有绣着基路伯的幔子（<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/3/#L14">代下 3:14</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/1mak/1/#L22">加上 1:22</a>），用蓝色、紫色、朱红色线和细麻织成，如同会幕中那样（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/26/#L31">出 26:31</a>）。幔子前常燃着不灭的灯（<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/24/#L1-4">利 24:1-4</a>）。</p><h3>两个革鲁宾</h3><p>安放了两尊橄榄木作的大革鲁宾像（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L23">王上 6:23</a>）。用金子包裹（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L28">王上 6:28</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/3/#L10">代下 3:10</a>）。革鲁宾的高和宽各为10肘（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L23">王上 6:23</a>）；宽度从一个翅膀的边到另一个翅膀的边（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L24-27">王上 6:24-27</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/3/#L11">代下 3:11</a>）。一个革鲁宾的一个翅膀挨着殿这边的墙，另一个翅膀与相邻革鲁宾的翅膀相接（<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/3/#L11-12">代下 3:11-12</a>）。他们的脸面向外殿（<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/3/#L13">代下 3:13</a>）。</p><h3>约柜</h3><p>在中央、革鲁宾的翅膀底下，立着约柜（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L19">王上 6:19</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/8/#L6">王上 8:6</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/5/#L7">代下 5:7</a>），连同抬柜的杠（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/8/#L7">王上 8:7</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/5/#L9">代下 5:9</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/25/#L15">出 25:15</a>）。详见<a href="https://bibleox.com/ru/ru/w/ковчег_завета">约柜</a>。</p><h2>圣所</h2><h3>入口</h3><p>进入圣所要经过<strong>松木作的折叠双扇门</strong>（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L34">王上 6:34</a>），其门框用橄榄木（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L33">王上 6:33</a>）。这些门也装饰着基路伯、棕树和初开的花的刻像，并贴金（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L35">王上 6:35</a>）。</p><h3>坛</h3><p>在至圣所门前立着烧香的坛。用木头制成并贴金（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L22">王上 6:22</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/7/#L48">王上 7:48</a>）。</p><h3>桌子</h3><p>旁边是安放陈设饼的金桌（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/7/#L48">王上 7:48</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/4/#L8">代下 4:8</a>）。</p><h3>灯台</h3><p>左右各有金灯台：右边五个，左边五个（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/7/#L49">王上 7:49</a>）。它们连同灯盏、蜡剪、盘、镊子、调羹、火鼎以及门枢——全部用纯金制成（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/7/#L50">王上 7:50</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/4/#L19-22">代下 4:19-22</a>）。</p><h2>廊子</h2><p>里面贴上精金（<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/3/#L4">代下 3:4</a>）。</p><h3>柱子：雅斤和波阿斯</h3><p>廊子入口前立着两根相同的巨大铜柱，各有名字：右边——雅斤，左边——波阿斯（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/7/#L21">王上 7:21</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/3/#L17">代下 3:17</a>）。柱高<strong>18肘</strong>（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/7/#L15">王上 7:15</a>）（35肘——<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/3/#L15">代下 3:15</a>）。柱围12肘（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/7/#L15">王上 7:15</a>）。柱顶上有柱头，各高5肘（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/7/#L16">王上 7:16</a>）。柱头装饰着网子和拧成的鍊索（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/7/#L16">王上 7:16</a>）：每个柱头上七个（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/7/#L17">王上 7:17</a>）。柱头上有两行石榴（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/7/#L18">王上 7:18</a>）。也提到廊子的柱头，刻着百合花，各径4肘（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/7/#L19">王上 7:19</a>）。所有铜器都打磨光亮（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/7/#L45">王上 7:45</a>）。</p><h2>院子</h2><p>殿前有<strong>内院（祭司院）</strong>（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L36">王上 6:36</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/4/#L9">代下 4:9</a>）。它用三层凿成的石头和一层香柏木建成（围成）（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L36">王上 6:36</a>）（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/7/#L12">王上 7:12</a>）。大的外院也围了起来（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/7/#L12">王上 7:12</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/4/#L9">代下 4:9</a>）。</p><h3>祭坛</h3><p>尺寸：20×20肘，高10肘（<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/4/#L1">代下 4:1</a>）。</p><h3>铜海</h3><p>祭司沐浴用的圆形器具（<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/4/#L6">代下 4:6</a>）。在第一（内）院中有铸成的圆形「铜海」。尺寸：径10肘，高5肘（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/7/#L23">王上 7:23</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/4/#L2">代下 4:2</a>），厚约一掌（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/7/#L26">王上 7:26</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/4/#L5">代下 4:5</a>）。围30肘（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/7/#L23">王上 7:23</a>）。边缘装饰着两行野瓜：每肘十瓜（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/7/#L24">王上 7:24</a>）。可容二千罢特（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/7/#L26">王上 7:26</a>）。安在殿的东南方（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/7/#L39">王上 7:39</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/4/#L10">代下 4:10</a>）。</p><h3>12只铜牛</h3><p>铜海安在12只铜牛上（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/7/#L25">王上 7:25</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/4/#L3-4">代下 4:3-4</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/4/#L15">代下 4:15</a>）：三只向北，其余各方也各有三只。</p><h3>10个铜盆</h3><p>献燔祭前洗祭牲用的器具（<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/4/#L6">代下 4:6</a>）。每个盆容40罢特。安在殿旁：左边5个，右边5个（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/7/#L39">王上 7:39</a>）。每个盆都有可移动的带轮座的盆座。</p><h3>10个盆座</h3><p>10个可移动的方形铜盆座（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/7/#L27">王上 7:27</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/7/#L31">王上 7:31</a>）：4×4肘，高3肘。盆座的四面有狮子、牛和基路伯的像，其上有璎珞（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/7/#L28-29">王上 7:28-29</a>）。盆座安在4个铜轮上移动（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/7/#L30">王上 7:30</a>）。轮高1.5肘（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/7/#L32">王上 7:32</a>）。它们全都是一样的（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/7/#L37">王上 7:37</a>）。</p><h3>歌唱者、吹号者</h3><p>奉献圣殿时，利未人歌唱并弹奏乐器（钹、瑟和琴），祭司吹号（<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/5/#L12">代下 5:12</a>）。乐器是特为圣殿制造的（<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/7/#L6">代下 7:6</a>）。</p><h2>刻像</h2><p>基路伯的刻像在殿的墙上（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L32">王上 6:32</a>）、门上（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L32">王上 6:32</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L35">王上 6:35</a>）、至圣所门前的幔子上（<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/3/#L14">代下 3:14</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/1mak/1/#L22">加上 1:22</a>）。在至圣所立着两尊包金的大木制革鲁宾像（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L23">王上 6:23</a>）。约柜的施恩座上有两个革鲁宾像（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/25/#L18-20">出 25:18-20</a>）。殿院中大的盆座上有狮子、牛和基路伯的像（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/7/#L28-29">王上 7:28-29</a>）。</p><h2>祈祷</h2><p>所罗门王奉献圣殿时的祈祷：<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/8/#L22-53">王上 8:22-53</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/6/#L14-42">代下 6:14-42</a></p><p>上帝对所罗门祈祷的回应：<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/7/#L12-22">代下 7:12-22</a></p>
