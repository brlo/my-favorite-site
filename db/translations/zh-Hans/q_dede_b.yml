  title: 施舍
  copy_cover: true
  body: <h2>施舍、怜贫、慷慨</h2><blockquote><p>“在耶和华你上帝所赐你的地上，无论那一座城里，<strong><mark>你弟兄中若有一个穷人</mark></strong>，你<strong><mark>不可忍着心、揝着手</mark></strong>，不帮补你穷乏的弟兄； <strong><mark>总要向他松开手</mark></strong>，照他所缺乏的借给他，补他的不足。 你要谨慎，不可心里起恶念说：『第七年的豁免年快到了』，<strong><mark>你便恶眼看你穷乏的弟兄</mark></strong>，什么都不给他，以致他因你求告耶和华，罪便归于你了。 你总要给他，给他的时候，<strong><mark>心里不可愁烦</mark></strong>，因耶和华你的上帝必在你这一切所行的，并你手里所办的事上，赐福与你。 原来<strong><mark>那地上的穷人永不断绝</mark></strong>，所以我吩咐你说：『<strong><mark>总要向你地上困苦穷乏的弟兄松开手</mark></strong>。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/15/#L7-11">申 15:7-11</a>)</p></blockquote><blockquote><p>“<strong><mark>你手若有行善的力量，不可推辞</mark></strong>，就当向那应得的人施行。 你那里若有现成的，<strong><mark>不可对邻舍说</mark></strong>：「去吧！明天再来，我必给你。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/3/#L27-28">箴 3:27-28</a>)</p></blockquote><blockquote><p>“<strong>应向穷人伸手施惠</strong>，好使你的祝福和怜悯，完备无缺。<strong>对一切活人，要施与恩惠；对于死者，不要禁止哀悼</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/7/#L36-37">德 7:36-37</a>) <em>(俄文本为 Сир 7:35-36。)</em></p></blockquote><blockquote><p>“祈祷与斋戒固然是善功，但<strong>秉义施舍却超过前二者</strong>；秉义而少有，胜于不义而多有；施舍救济，胜于储蓄黄金，因为<strong>施舍救人脱免死亡，且涤除一切罪恶</strong>。施舍行义的人必享高寿；” (<a href="https://bibleox.com/zh-Hans/cn-sb/tov/12/#L8-9">多 12:8-9</a>)</p></blockquote><blockquote><p>“<strong><mark>只要把里面的施舍给人，凡物于你们就都洁净了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/11/#L41">路 11:41</a>)</p></blockquote><blockquote><p>“<strong><mark>怜恤人的人有福了</mark></strong>，<strong><mark>因为他们必蒙怜恤</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L7">太 5:7</a>)</p></blockquote>
