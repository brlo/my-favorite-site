- src: Единомыслие
  path: QV4A_同心
  title: 同心
  copy_cover: true
  body: <h2>智慧以弟兄间的同心与和睦为妆饰</h2><blockquote><p>“智慧要称扬自己，因天主而受光荣，在她的民族中，要取得荣耀；在至高者的集会中，要开启自己的口；在他的军旅前，要夸耀自己；在他的百姓中，要受举扬；在圣民间，要受景仰；……” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/24/#L1-3">德 24:1-3</a>)</p></blockquote><blockquote><p>“<strong>有三件事，我心中喜乐</strong>，这三件事也是上主与世人喜爱的，就是：<strong>兄弟和睦</strong>，<strong>邻人友爱</strong>，<strong>夫妇同心</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/25/#L1-2">德 25:1-2</a>) <em>(俄文本为 Сир 24:1-3；Сир 25:1-2。)</em></p></blockquote><h2>为教会得合一与同心而作的祈祷</h2><blockquote><p>“<strong><mark>使他们都合而为一</mark></strong>；正如你父在我里面，我在你里面，使他们也在我们里面，叫世人可以信你差了我来。 你所赐给我的荣耀，我已赐给他们，<strong><mark>使他们合而为一，像我们合而为一</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/17/#L21-22">约 17:21-22</a>)</p></blockquote><blockquote><p>“但愿赐忍耐、安慰的上帝，<strong><mark>叫你们彼此同心</mark></strong>，效法基督耶稣，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/15/#L5">罗 15:5</a>)</p></blockquote><h2>同心合意的诫命</h2><p>上帝的恩赐不是违背人的意愿强加给人的。比如，爱是上帝的恩赐（<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/4/#L7-8">约壹 4:7-8</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/5/#L22-23">加 5:22-23</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/5/#L5">罗 5:5</a>），然而它并不强加于人，来了之后，也不会违背人的意愿留在他里面。每个人都应当努力获得爱（<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/13/#L1-2,13">林前 13:1-2,13</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/3/#L14">西 3:14</a>），并使自己的意志趋向爱的行为（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/13/#L34">约 13:34</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/in/15/#L12">约 15:12</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/in/15/#L17">约 15:17</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/1/#L22">彼前 1:22</a>），而上帝则回应这些努力，赐下并保守这恩赐（<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/21/#L31">箴 21:31</a>）。</p><p>同心也是从上帝来的，因为基督和使徒们都曾为此向上帝祈祷（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/17/#L21-22">约 17:21-22</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/15/#L5">罗 15:5</a>）。虽然爱与同心的恩赐已由圣灵赐给教会，但教会中的每个人都应当以努力去获得并保守这一恩赐。每个信徒都可能单独地犯罪得罪爱，也得罪同心。因此，每个人都蒙召持守爱与同心：</p><blockquote><p>“<strong><mark>要彼此同心</mark></strong>，不要志气高大，倒要俯就卑微的人。不要自以为聪明。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/12/#L16">罗 12:16</a>)</p></blockquote><blockquote><p>“弟兄们，我藉我们主耶稣基督的名，劝你们<strong><mark>都说一样的话</mark></strong>。你们中间也不可分党，<strong><mark>只要一心一意</mark></strong>，彼此相合。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/1/#L10">林前 1:10</a>)</p></blockquote><blockquote><p>“还有末了的话：愿弟兄们都喜乐！要作完全人，要受安慰，<strong><mark>要同心合意，要彼此和睦</mark></strong>。如此，仁爱和平的上帝必常与你们同在。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/13/#L11">林后 13:11</a>)</p></blockquote><blockquote><p>“<strong><mark>你们就要意念相同，爱心相同，有一样的心思，有一样的意念</mark></strong>，使我的喜乐可以满足。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/fil/2/#L2">腓 2:2</a>)</p></blockquote><blockquote><p>“总而言之，<strong><mark>你们都要同心，彼此体恤，相爱如弟兄</mark></strong>，存慈怜谦卑的心；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/3/#L8">彼前 3:8</a>)</p></blockquote><h2>批评</h2><h3>在你们中间不免有分门结党的事</h3><blockquote><p>“<strong><mark>在你们中间不免有分门结党的事，好叫那些有经验的人显明出来</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/11/#L19">林前 11:19</a>)</p></blockquote><p>原文这里用的不是「分门结党」而是「异端」（希腊文 αἱρέσεις），也就是说，在你们中间免不了有异端。这只是关于异端产生的预言。按使徒的话，繁殖异端的人不能承受上帝的国：</p><blockquote><p>“情欲的事都是显而易见的，就如奸淫、污秽、邪荡、 拜偶像、邪术、仇恨、争竞、忌恨、恼怒、结党、纷争、<strong><mark>异端</mark></strong>、 嫉妒〔有古卷在此有『凶杀』二字〕、醉酒、荒宴等类。我从前告诉你们，现在又告诉你们，<strong><mark>行这样事的人必不能承受上帝的国</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/5/#L19-21">加 5:19-21</a>)</p></blockquote>
