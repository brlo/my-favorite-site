  path: QW6A_敬礼圣髑
  title: 敬礼圣髑
  copy_cover: true
  body: <h2>为什么敬礼圣义者的圣髑</h2><p>敬礼圣义者的圣髑，理由与敬礼圣义者本身相同（详见下一篇<a href="https://bibleox.com/ru/ru/w/почитание-святых-в-Библии">敬礼圣人</a>）；敬礼他们，是因为他们分有上帝、因为上帝的恩典在他们里面运作（<a href="https://bibleox.com/ru/ru/w/человек-храм-Божий">人——上帝的殿</a>）。敬礼的对象是义人的整体，而不是他的某一部分（<a href="https://bibleox.com/ru/ru/w/состав-человека">人性构成</a>）。受敬礼的不只是<strong>灵魂</strong>，还有<strong>身体</strong>（<a href="https://bibleox.com/zh-Hans/cn-cuv/4ts/13/#L21">王下 13:21</a>），甚至<strong>遗物</strong>（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/19/#L12">徒 19:12</a>）和<strong>像</strong>（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/5/#L15">徒 5:15</a>）——上帝藉它们施行奇迹和医治，赐下自己的恩典。</p><p>因为圣人<strong>受敬礼是由于他们分有上帝、由于上帝的恩典在他们里面运作</strong>，而上帝赐下自己的恩典，不但经由圣徒活着的身体，也经由他们死后的身体（<a href="https://bibleox.com/zh-Hans/cn-cuv/4ts/13/#L21">王下 13:21</a>），所以圣徒的身体不只在生前、在死后（身体与灵魂分离之后）也因恩典而受敬礼。</p><p>上帝不厌恶自己朋友们的遗体。上帝看顾义人的遗骸（<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/34/#L19-20">诗 34:19-20</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/in/19/#L33,36">约 19:33,36</a>），并继续藉它们行事（<a href="https://bibleox.com/zh-Hans/cn-cuv/4ts/13/#L21">王下 13:21</a>）。持香的妇女们对遗骸也没有厌恶——她们在救主死后第三天去开他的坟墓，要用香膏膏抹基督死去的身体（<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/16/#L1-3">可 16:1-3</a>），尽管摩西的律法禁止除亲属之外的任何人接触死者的身体（<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/21/#L1-4">利 21:1-4</a>）。</p><h2>常见的问题</h2><h3>为什么圣髑在圣殿里，而不在土里</h3><p><strong>圣殿就是</strong>义人遗骸的<strong>坟墓</strong>。圣髑保存在圣殿的石棺（圣髑匣、圣髑柜）里。上帝说人是土、所以要归回土（<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/3/#L19">创 3:19</a>），这话的意思是：人用土造成的身体[1]会重新变为土，即朽坏分解，重新成为它起初所是的——土。</p><p>许多义人并不是字面地被埋进土里。相反，义人们力求以某种特别的方式安葬义人，常常为安葬挑选专门的场所。</p><ol><li><p><strong>亚伯拉罕把自己亲人的遗体安葬在专门购买的洞穴里</strong>。他向当地的居民求葬地，而他们向他提出<strong>最好的</strong>葬地（<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/23/#L2-6">创 23:2-6</a>）。最后，亚伯拉罕请求并买下他们所指的洞穴为业（<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/23/#L7-13,17-20">创 23:7-13,17-20</a>），好在那里安葬自己的亲人。就在同一个洞穴里，后来安葬了亚伯拉罕本人（<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/25/#L9-10">创 25:9-10</a>）、他的妻子撒拉（<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/23/#L19">创 23:19</a>）、以撒和他的妻子利百加（<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/49/#L1,29-33">创 49:1,29-33</a>）、雅各和他的妻子利亚（<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/49/#L1,29-33">创 49:1,29-33</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/50/#L12-13">创 50:12-13</a>）；</p></li><li><p><strong>主耶稣基督被安葬在岩石中凿出的专门墓穴里</strong>——那是财主约瑟（亚利马太人）为自己凿的（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/27/#L57,60">太 27:57,60</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/15/#L46">可 15:46</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/23/#L50-53">路 23:50-53</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/in/19/#L41">约 19:41</a>）。这正是上帝起初藉先知以赛亚预言所定的：“人还使他与恶人同埋；谁知死的时候<strong>与财主同葬</strong>”（<a href="https://bibleox.com/zh-Hans/cn-cuv/is/53/#L9">赛 53:9</a>）；</p></li><li><p><strong>最早的基督徒常常把义人安葬在地下墓穴的专门墓室里</strong>，并在圣髑旁举行事奉圣礼（<a href="https://bibleox.com/ru/ru/w/почитание-мощей-цитаты-святых#HH-Община-Поликарпа-Смирнского-II-век">例子</a>）；</p></li><li><p>三百年后、四世纪基督教安全的时代来临，圣人的遗骸开始被安葬在圣殿里：或如义人约瑟那样安放在石棺中（<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/50/#L26">创 50:26</a>；<a href="https://bibleox.com/ru/ru/w/почитание-мощей-цитаты-святых#HH-Григорий-Нисский-святитель-331-394">例子</a>），或安置在圣殿主要部分（祭坛）下方专门的墓室（地窟）里，或建造专门的单独建筑（殉道者纪念堂）（<a href="https://bibleox.com/ru/ru/w/почитание-мощей-цитаты-святых#HH-Амвросий-Медиоланский-святитель-397">例子</a>）。</p></li></ol><p>这样，<strong>从最古老的年代起，义人就把义人安葬在专门的场所，而不是土里</strong>。教会在今天也是这样：义人的遗骸安放在专门场所——举行事奉圣礼的圣殿——里的石棺中。</p><p>无论我们怎么做，实质是同一个：</p><ul><li><p>或者建一座殉道者纪念堂来安放圣髑石棺，教会聚集在其中举行事奉圣礼；</p></li><li><p>或者反过来，建一座举行事奉圣礼的圣殿，把圣髑石棺安放在那里。</p></li></ul><p>教会从最古老的时代起就建造安放圣人棺柩的建筑，并在那里举行事奉圣礼。</p><h3>迁移圣髑</h3><p>圣经中多次发生义人遗骸的迁移，没有任何责难。例如，族长约瑟被安葬在埃及的石棺（圣髑匣）里（<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/50/#L26">创 50:26</a>），后来先知摩西与民众四十多年抬着约瑟的遗骸走旷野，为要在约瑟自己指定的地方安葬他。详见<a href="https://bibleox.com/ru/ru/w/почитание-мощей-святых#HH-Эпизоды-об-останках-из-Библии">下文</a>。</p><h3>圣髑的分割</h3><p>从最古老的年代起，圣义者的遗骸是在最残酷的酷刑（砍碎、焚烧）之后到达教会的——不是完整的，也不是一下子全部（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/14/#L11">太 14:11</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/6/#L28">可 6:28</a>）。而上帝后来照样经由义人的遗骸行事，无论它们是否被收拢在一起。教会本身若保存了义人完整的遗骸，就把它们整体保存在安放于圣殿中的专门棺柩（石棺、圣髑匣）里。分割可能出于不得已的原因：在自然灾害和敌人袭击时抢救圣髑。有时为了在别处敬礼义人，只取圣髑极小的一粒碎屑。</p><h2>上帝对人遗骸的态度</h2><h3>上帝保全义人的遗骸</h3><blockquote><p>“<strong><mark>义人多有苦难</mark></strong>，但耶和华救他脱离这一切； <strong><mark>又保全他一身的骨头，连一根也不折断</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/34/#L19-20">诗 34:19-20</a>)</p></blockquote><blockquote><p>“只是来到耶稣那里，见他已经死了，<strong><mark>就不打断他的腿</mark></strong>。 &lt;…&gt; 这些事成了，为要应验经上的话说：『<strong><mark>他的骨头一根也不可折断</mark></strong>。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/19/#L33,36">约 19:33,36</a>)</p></blockquote><p>由此可见上帝自己对圣人遗骸的态度。尽管如此，上帝有时容许（而不是愿意）义人受折磨，甚至被斩首，如先知施洗约翰（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/14/#L11">太 14:11</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/6/#L28">可 6:28</a>）。但上帝也藉被分割的圣人遗骸赐下恩典。</p><h3>上帝使罪人的遗骸蒙羞</h3><blockquote><p>“<strong>上帝打散讨好人的骨头</strong>：他们必蒙羞，因为上帝弃绝了他们。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/52/#L5">诗 52:5</a>)</p></blockquote><h2>上帝继续经由义人死去的身体行事</h2><p>触摸先知以利沙的骸骨，死人复活了——旁边甚至看不见祈祷的举行：</p><blockquote><p>“有人正葬死人，忽然看见一群人，就把死人抛在以利沙的坟墓里，<strong><mark>一碰着以利沙的骸骨，死人就复活站起来了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/4ts/13/#L21">王下 13:21</a>)</p></blockquote><h2>上帝继续经由义人用过的物品行事</h2><p>因使徒的衣物得医治：</p><blockquote><p>“<strong><mark>甚至有人从保罗身上拿手巾或围裙放在病人身上，病就退了，恶鬼也出去了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/19/#L12">徒 19:12</a>)</p></blockquote><h2>上帝经由义人的像行事</h2><p>因使徒的像得医治：</p><blockquote><p>“甚至有人将病人抬到街上，放在床上或褥子上，<strong><mark>指望彼得过来的时候，或者得他的影儿照在什么人身上</mark></strong>。 还有许多人带着病人和被污鬼缠磨的，从耶路撒冷四围的城邑来，<strong><mark>全都得了医治</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/5/#L15-16">徒 5:15-16</a>)</p></blockquote><h2>向圣人叩拜</h2><p>十诫的第一诫（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/20/#L2-3">出 20:2-3</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/5/#L6-7">申 5:6-7</a>）禁止敬拜假神（偶像）。假神不但虚假，而且根本不存在。</p><p>圣人则真实存在，他们是上帝的朋友；向他们叩拜，不是把他们当神。向圣人和他们的圣髑叩拜，是表达对他们的敬意——作为上帝的朋友。这样的向天使、向人、向物件的叩拜在圣经中有，而且不是拜偶像，因为拜偶像——是敬拜<strong>假</strong>神。义人们经常向人、向各种物件、向天使下拜；别人也向先知下拜。</p><h4>向以天使形像显现的上帝叩拜</h4><blockquote><p>“举目观看，<strong><mark>见有三个人在对面站着</mark></strong>。他一见，就从帐棚门口跑去迎接他们，<strong><mark>俯伏在地</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/18/#L2">创 18:2</a>)</p></blockquote><h4>向天使叩拜</h4><blockquote><p>“他回答说：「不是的，我来是要作耶和华军队的元帅。」<strong><mark>约书亚就俯伏在地下拜</mark></strong>，说：「我主有什么话吩咐仆人？」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/nav/5/#L14">书 5:14</a>)</p></blockquote><h4>向先知叩拜</h4><blockquote><p>“住耶利哥的先知门徒从对面看见他，就说：「感动以利亚的灵感动以利沙了。」他们就来迎接他，<strong><mark>在他面前俯伏于地</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/4ts/2/#L15">王下 2:15</a>)</p></blockquote><h4>向圣殿叩拜</h4><blockquote><p>“至于我，我必凭你丰盛的慈爱，进入你的居所；我必存敬畏你的心，<strong><mark>向你的圣殿下拜</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/5/#L7">诗 5:7</a>)</p></blockquote><h4>向上帝的脚凳叩拜</h4><blockquote><p>“你们当尊崇耶和华我们的上帝，<strong><mark>在他脚凳前下拜</mark></strong>；他本为圣！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/99/#L5">诗 99:5</a>)</p></blockquote><blockquote><p>“<strong><mark>我们要进他的居所，在他脚凳前下拜</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/132/#L7">诗 132:7</a>)</p></blockquote><h4>向约柜叩拜</h4><blockquote><p>“约书亚便撕裂衣服；他和以色列的长老把灰撒在头上，在耶和华的约柜前，<strong><mark>俯伏在地，直到晚上</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/nav/7/#L6">书 7:6</a>)</p></blockquote><h4>向杖叩拜</h4><p>经上记着“以色列在床头上敬拜”（<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/47/#L31">创 47:31</a>），而在七十士译本里是“在杖头上”（<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/11/#L21">希 11:21</a>）。</p><p>更多例子：<a href="https://bibleox.com/ru/ru/w/поклоны">叩拜</a></p><h2>圣经中关于遗骸的事例</h2><h3>持香的妇女们在安葬后的第三天去开坟墓、接触主耶稣基督的圣洁身体</h3><blockquote><p>“过了安息日，抹大拉的马利亚和雅各的母亲马利亚并撒罗米，<strong><mark>买了香膏要去膏耶稣的身体</mark></strong>。 七日的第一日清早，出太阳的时候，她们来到坟墓那里， 彼此说：「<strong><mark>谁给我们把石头从墓门滚开呢</mark></strong>？」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/16/#L1-3">可 16:1-3</a>)</p></blockquote><blockquote><p>“七日的头一日，黎明的时候，那些妇女<strong><mark>带着所预备的香料</mark></strong><strong><mark>来到坟墓</mark></strong>前，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/24/#L1">路 24:1</a>)</p></blockquote><blockquote><p>“安息日将尽，七日的头一日，天快亮的时候，抹大拉的马利亚和那个马利亚<strong><mark>来看坟墓</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/28/#L1">太 28:1</a>)</p></blockquote><blockquote><p>“七日的第一日清早，天还黑的时候，抹大拉的马利亚<strong><mark>来到坟墓那里</mark></strong>，看见石头从坟墓挪开了，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/20/#L1">约 20:1</a>)</p></blockquote><h3>迁移遗骸</h3><h4>约瑟</h4><p>约瑟（雅各的儿子）请求日后把他的遗骸从埃及迁到上帝应许给他的那地：</p><blockquote><p>“约瑟对他弟兄们说：「我要死了，但上帝必定看顾你们，领你们从这地上去，到他起誓所应许给亚伯拉罕、以撒、雅各之地。」 约瑟叫以色列的子孙起誓，说：「上帝必定看顾你们，<strong><mark>你们要把我的骸骨从这里搬上去</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/50/#L24-25">创 50:24-25</a>)</p></blockquote><p>约瑟死了，人们把他安葬在埃及，收殓在棺材（圣髑匣）里：</p><blockquote><p>“约瑟死了，正一百一十岁。人用香料将他薰了，把他收殓在棺材里，停在埃及。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/50/#L26">创 50:26</a>)</p></blockquote><p>先知摩西履行了约瑟的请求：</p><blockquote><p>“所以上帝领百姓绕道而行，走红海旷野的路。以色列人出埃及地，都带着兵器上去。 <strong><mark>摩西把约瑟的骸骨一同带去</mark></strong>，因为约瑟曾叫以色列人严严地起誓，对他们说：「上帝必眷顾你们，<strong><mark>你们要把我的骸骨从这里一同带上去</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/13/#L18-19">出 13:18-19</a>)</p></blockquote><p>先知摩西和以色列民<strong>四十多年</strong>抬着约瑟的遗骸在西奈半岛上漂泊。后来，约书亚把约瑟的遗骸安葬在示剑（<a href="https://bibleox.com/zh-Hans/cn-cuv/nav/24/#L32">书 24:32</a>）。</p><p>考虑到四十年的西奈旷野漂泊——即以色列从埃及的奴役到应许之地的路程——是新约教会生活的预像：教会把人从罪的奴役中领出、引领人进入上帝所应许的天国；那么在这教会的整个生命时期，上帝的民始终带着义人的圣髑。旧约教会的预像，在到达自己的国之前，始终带着义人的圣髑。</p><h4>扫罗</h4><p>扫罗被非利士人杀死；雅比的居民烧了他们的身体，把骨头葬在自己城的柳树下：</p><blockquote><p>“又将扫罗的军装放在亚斯他录庙里，<strong><mark>将他的尸身钉在伯珊的城墙上</mark></strong>。 基列雅比的居民听见非利士人向扫罗所行的事， 他们中间所有的勇士就起身，走了一夜，<strong><mark>将扫罗和他儿子的尸身从伯珊城墙上取下来</mark></strong>，送到雅比那里<strong><mark>用火烧了</mark></strong>。 <strong><mark>将他们骸骨葬在雅比的垂丝柳树下</mark></strong>，<strong><mark>就禁食七日</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1ts/31/#L10-13">撒上 31:10-13</a>)</p></blockquote><blockquote><p>“他们中间所有的勇士就起身前去，将扫罗和他儿子的尸身送到雅比，<strong><mark>将他们的尸骨葬在雅比的橡树下</mark></strong>，就禁食七日。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1par/10/#L12">代上 10:12</a>)</p></blockquote><p>大卫把扫罗的遗骸迁到便雅悯地，与扫罗父亲的遗骸一同安葬：</p><blockquote><p>“大卫就去，从基列雅比人那里<strong><mark>将扫罗和他儿子约拿单的骸骨搬了来</mark></strong>。是因非利士人从前在基利波杀扫罗，将尸身悬挂在伯珊的街市上，基列雅比人把尸身偷了去。 <strong><mark>大卫将扫罗和他儿子约拿单的骸骨从那里搬了来</mark></strong>，又收殓被悬挂七人的骸骨。 <strong><mark>将扫罗和他儿子约拿单的骸骨葬在便雅悯的洗拉</mark></strong>，<strong><mark>在扫罗父亲基士的坟墓里</mark></strong>。众人行了王所吩咐的。<strong><mark>此后上帝垂听国民所求的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2ts/21/#L12-14">撒下 21:12-14</a>)</p></blockquote><h3>延迟安葬的情形</h3><p>雅各的安葬是在77天多之后举行的：</p><blockquote><p>“约瑟伏在他父亲的面上哀哭，与他亲嘴。约瑟吩咐伺候他的医生用香料薰他父亲，医生就用香料薰了以色列。薰尸的常例是<strong>四十天</strong>；那四十天满了，埃及人为他<strong>哀哭了七十天</strong>。我父亲曾叫我起誓说：<strong>你要将我葬在迦南地，在我为自己所掘的坟墓里</strong>。现在求你让我上去葬我父亲，以后我必回来。法老说：你可以上去，照着你父亲所说的去葬他。于是约瑟上去葬他父亲。<strong>与他一同上去的，有法老的一切臣仆</strong>……” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/50/#L1-3,5-13">创 50:1-3,5-13</a>)</p></blockquote><h3>先知请求与另一位先知的圣髑同葬</h3><blockquote><p>“老先知就把神人的尸身驮在驴上，带回自己的城里，要哀哭他，葬埋他。 <strong><mark>就把他的尸身葬在自己的坟墓里</mark></strong>，哀哭他，说：「哀哉！我兄啊！」 安葬之后，老先知对他儿子们说：「<strong><mark>我死了，你们要葬我在神人的坟墓里</mark></strong>；<strong><mark>使我的尸骨靠近他的尸骨</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/13/#L29-31">王上 13:29-31</a>)</p></blockquote><h2>雅各敬礼妻子的遗骸</h2><blockquote><p>“拉结死了，葬在以法他的路旁。以法他就是伯利恒。 <strong><mark>雅各在她的坟上立了一统碑</mark></strong>，<strong><mark>就是拉结的墓碑，到今日还在</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/35/#L19-20">创 35:19-20</a>)</p></blockquote><h2>约西亚王敬礼先知的圣髑</h2><p>论到约西亚说：在他以前没有王像他、在他以后也没有兴起王像他，因为他尽心、尽性、尽力归向上帝（<a href="https://bibleox.com/zh-Hans/cn-cuv/4ts/23/#L25">王下 23:25</a>）。犹大王约西亚自幼顺服上帝，成年后开始洁净自己的国家脱离异教：他摧毁异教的像、祭坛、烧香的异教邱坛、异教的神圣树丛，禁止祭司的事奉，消灭了行邪术的和交鬼的，洁净并修理了耶路撒冷上帝的圣殿，找到了圣经的书卷，向民众宣读，民众被带入与上帝所立的约。约西亚不但摧毁异教的邱坛，还力求玷污它们——把人的骨头撒在那里：</p><blockquote><p>“从前以色列王所罗门在耶路撒冷前，邪僻山右边，为西顿人可憎的神亚斯他录、摩押人可憎的神基抹、亚扪人可憎的神米勒公所筑的邱坛，<strong><mark>王都污秽了</mark></strong>， 又打碎柱像，砍下木偶，<strong><mark>将人的骨头充满了那地方</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/4ts/23/#L13-14">王下 23:13-14</a>)</p></blockquote><p>约西亚毁灭了耶罗波安的旧偶像，玷污了那里的坟冢：</p><blockquote><p>“他将伯特利的坛，就是叫以色列人陷在罪里，尼八的儿子耶罗波安所筑的那坛，都拆毁焚烧，打碎成灰，并焚烧了亚舍拉。 约西亚回头，看见山上的坟墓，就打发人<strong><mark>将坟墓里的骸骨取出来，烧在坛上，污秽了坛</mark></strong>，正如从前神人宣传耶和华的话。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/4ts/23/#L15-16">王下 23:15-16</a>)</p></blockquote><p>然而，当他遇到一座纪念碑，查明那是预言了这些事件的先知的坟墓时，他就恭敬地对待他的圣髑。此外，纪念碑本身的存在，表明先前对先知的敬礼：</p><blockquote><p>“约西亚问说：「<strong><mark>我所看见的是什么碑</mark></strong>？」那城里的人回答说：「先前有神人从犹大来，预先说王现在向伯特利坛所行的事，<strong><mark>这就是他的墓碑</mark></strong>。」 约西亚说：「<strong><mark>由他吧！不要挪移他的骸骨</mark></strong>。」<strong><mark>他们就不动他的骸骨</mark></strong>，也不动从撒玛利亚来那先知的骸骨。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/4ts/23/#L17-18">王下 23:17-18</a>)</p></blockquote><p>这同一位神人先前就预言了这件事将要发生：</p><blockquote><p>“神人奉耶和华的命向坛呼叫说：「<strong><mark>坛哪！坛哪</mark></strong>！耶和华如此说：『<strong><mark>大卫家里必生一个儿子，名叫约西亚</mark></strong>。他必将邱坛的祭司，就是在你上面烧香的，杀在你上面，<strong><mark>人的骨头也必烧在你上面</mark></strong>。』」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/13/#L2">王上 13:2</a>)</p></blockquote><h2>西门敬礼亲人的遗骸</h2><p>大祭司约拿单（<a href="https://bibleox.com/zh-Hans/cn-cuv/1mak/10/#L20">加上 10:20</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/1mak/11/#L57">加上 11:57</a>）被安葬在巴斯加玛。后来，他的兄弟、大祭司西门（<a href="https://bibleox.com/zh-Hans/cn-cuv/1mak/13/#L36,42">加上 13:36,42</a>）把他的遗骸迁到祖城摩丁——此前犹大也被安葬在那里（<a href="https://bibleox.com/zh-Hans/cn-cuv/1mak/9/#L19">加上 9:19</a>）。西门修建了一座高大的建筑，以此敬礼亲人的遗骸：</p><blockquote><p>“当他临近巴斯加玛时，将约纳堂杀死，就埋葬在那里。<strong>息孟遣人去运回他兄弟的骨骸，将他埋葬在他祖先的摩丁城里。</strong>全以色列都举哀痛吊他，哀哭多日。之后，息孟在他父亲与他兄弟们的坟墓上，用前后光泽的石头，修了一座相当高大的纪念碑，从远处可以望见。他为父母和四个兄弟，还立了七座金字塔，彼此相对；且为塔作了一些装饰品，就是在四周，立了一些大石柱，石柱上刻了武器，<strong>作为永久的记念</strong>；又在武器旁，彫刻了船像，使航海的人都可以看到。息孟在摩丁修建的<strong>这座坟墓</strong>，至今犹存。” (<a href="https://bibleox.com/zh-Hans/cn-sb/1mak/13/#L23,25-30">加上 13:23,25-30</a>)</p></blockquote><h2>相关引文</h2><ol><li><p><a href="https://bibleox.com/ru/ru/w/почитание-святых-в-Библии">敬礼圣人</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/иконы-иконопочитание-иконоборчество">敬礼圣像</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/молитвы-святым">为圣人祈祷</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/человек-храм-Божий">人——上帝的殿</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/состав-человека">人的构成</a></p></li></ol>
