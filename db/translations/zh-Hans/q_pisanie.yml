  path: Qb3A_圣传
  title: 圣传
  copy_cover: true
  body: <h2>什么是圣传？</h2><p>圣传——父上帝的启示，他藉自己的独生子传给使徒们，使徒们又传给教会的其余部分；教会世世代代以言语（口头的和书面的）和行为传下去：</p><blockquote><p>“因为<strong>你所赐给我的道，我已经赐给他们，他们也领受了</strong>；又确实知道我是从你出来的，并且信你差了我来。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/17/#L8">约 17:8</a>)</p></blockquote><blockquote><p>“我称赞你们，因你们凡事记念我，<strong>又坚守我所传给你们的</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/11/#L2">林前 11:2</a>)</p></blockquote><h2>圣传不只是文本，也是传递信仰的、听见的言语</h2><blockquote><p>“为此，我们也不住的感谢上帝，因你们听见<strong><mark>我们所传上帝的道</mark></strong>，就领受了；不以为是人的道，乃以为是上帝的道。这道实在是上帝的，并且运行在你们信主的人心中。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1sol/2/#L13">帖前 2:13</a>)</p></blockquote><blockquote><p>“<strong><mark>你从我听的那纯正话语的规模</mark></strong>，要用在基督耶稣里的信心和爱心，常常守着。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/1/#L13">提后 1:13</a>)</p></blockquote><blockquote><p>“<strong><mark>你在许多见证人面前听见我所教训的</mark></strong>，<strong><mark>也要交托那忠心能教导别人的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/2/#L2">提后 2:2</a>)</p></blockquote><blockquote><p>“所以弟兄们，你们要<strong>站立得稳</strong>，<strong><mark>凡所领受的教训，不拘是我们口传的，是信上写的，都要坚守</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2sol/2/#L15">帖后 2:15</a>)</p></blockquote><blockquote><p>“论到你们，<strong>务要将那从起初所听见的常存在心里</strong>。<strong>若将从起初所听见的存在心里，你们就必住在子里面，也必住在父里面</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/2/#L24">约壹 2:24</a>)</p></blockquote><blockquote><p>“我称赞你们，因你们<strong>凡事记念我</strong>，又坚守我所传给你们的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/11/#L2">林前 11:2</a>)</p></blockquote><blockquote><p>“<strong>所以要回想你是怎样领受、怎样听见的</strong>，<strong>又要遵守</strong>，并要悔改。若不儆醒，我必临到你那里，如同贼一样；我几时临到，你也决不能知道。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/3/#L3">启 3:3</a>)</p></blockquote><h2>使徒们使用圣传</h2><p>使徒说出两个埃及术士的名字，圣经中没有记载：</p><blockquote><p>“<strong>从前雅尼和佯庇怎样敌挡摩西</strong>，这等人也怎样敌挡真道。他们的心地坏了，在真道上是可废弃的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/3/#L8">提后 3:8</a>)</p></blockquote><p>使徒犹大讲到圣经中没有记载的争辩：</p><blockquote><p>“<strong>天使长米迦勒为摩西的尸首与魔鬼争辩的时候</strong>，尚且不敢用毁谤的话罪责他，只说：『主责备你吧！』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iud/1/#L9">犹 1:9</a>)</p></blockquote><p>关于以诺的话，圣经中没有记载：</p><blockquote><p>“<strong>亚当的七世孙以诺曾预言这些人说</strong>：『<strong>看哪，主带着他的千万圣者降临</strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iud/1/#L14">犹 1:14</a>)</p></blockquote><p>使徒保罗讲到先知以赛亚藏在树洞里而被锯死的事：</p><blockquote><p>“被石头打死，<strong>被锯锯死</strong>，受试探，被刀杀，披着绵羊，山羊的皮各处奔跑，受穷乏、患难、苦害，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/11/#L37">希 11:37</a>)</p></blockquote><p>福音史家路加根据从目击者听来的话写下福音，即写下圣传：</p><blockquote><p>“提阿非罗大人哪，有好些人提笔作书，述说在我们中间所成就的事，是<strong>照传道的人从起初亲眼看见又传给我们的</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/1/#L1">路 1:1</a>) <em>(俄文原文引路加福音 1:2，和合本无第2节，其内容并入第1节)</em></p></blockquote><h3>传达福音书中没有的信息</h3><p>使徒保罗在对以弗所长老们的讲话中指出基督救主的一个教导，福音书中没有记载：</p><blockquote><p>“我凡事给你们作榜样，叫你们知道应当这样劳苦，扶助软弱的人，又当记念主耶稣的话，说：『<strong><mark>施比受更为有福</mark></strong>。』」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/20/#L35">徒 20:35</a>)</p></blockquote><p>又讲到复活基督向许多人显现，这也是福音书中没有记的：</p><blockquote><p>“后来<strong>一时显给五百多弟兄看</strong>，其中一大半到如今还在，却也有已经睡了的。 以后显给雅各看，再显给众使徒看，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/15/#L6-7">林前 15:6-7</a>)</p></blockquote><h2>圣传的重要性</h2><p>错误的教导不引人归向上帝：</p><blockquote><p>“凡<strong>越过</strong><strong><mark>基督的教训</mark></strong><strong>不常守着的，就没有上帝</strong>；<strong>常守这教训的</strong>，就有父又有子。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2in/1/#L9">约贰 1:9</a>)</p></blockquote><p>异端（错误的教导）不能承受上帝的国：</p><blockquote><p>“<strong><mark>异端</mark></strong>、 嫉妒〔有古卷在此有『凶杀』二字〕、醉酒、荒宴等类。我从前告诉你们，现在又告诉你们，<strong><mark>行这样事的人必不能承受上帝的国</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/5/#L20-21">加 5:20-21</a>)</p></blockquote><h2>圣传的必要性</h2><p>圣经并不是关于耶稣基督的全部信息的来源：</p><blockquote><p>“耶稣在门徒面前另外行了许多神迹，<strong><mark>没有记在这书上</mark></strong>。 但记这些事，要叫你们信耶稣是基督，是上帝的儿子，并且叫你们信了他，就可以因他的名得生命。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/20/#L30-31">约 20:30-31</a>)</p></blockquote><blockquote><p>“<strong><mark>耶稣所行的事还有许多</mark></strong>；若是一一的都写出来，我想，所写的书，就是世界也容不下了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/21/#L25">约 21:25</a>)</p></blockquote><p>任何一封书信里都没有关于如何施洗、如何按立辅祭、司祭、主教的教导：</p><blockquote><p>“所以，我们应当离开基督道理的开端，竭力进到完全的地步，<strong>不必再立根基</strong>，就如那懊悔死行、信靠上帝、 <strong><mark>各样洗礼、按手之礼</mark></strong>、死人复活，以及永远审判各等教训。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/6/#L1-2">希 6:1-2</a>)</p></blockquote><p>如上所述，使徒们愿意把某些信息以口传的方式传递：</p><blockquote><p>“我还有许多事要写给你们，<strong><mark>却不愿意用纸墨写出来</mark></strong>，但盼望到你们那里与你们当面谈论，使你们的喜乐满足。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2in/1/#L12">约贰 1:12</a>)</p></blockquote><blockquote><p>“我原有许多事要写给你；<strong><mark>却不愿意用笔墨写给你</mark></strong>， 但盼望快快的见你，我们就<strong>当面谈论</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/3in/1/#L13-14">约叁 1:13-14</a>)</p></blockquote><p>使徒保罗请求持守圣传（使徒的教导），它们不只在书信里、也在言语中领受：</p><blockquote><p>“所以弟兄们，你们要<strong>站立得稳</strong>，<strong><mark>凡所领受的教训，不拘是我们口传的，是信上写的，都要坚守</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2sol/2/#L15">帖后 2:15</a>)</p></blockquote><blockquote><p>“<strong><mark>你在许多见证人面前听见我所教训的</mark></strong>，<strong><mark>也要交托那忠心能教导别人的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/2/#L2">提后 2:2</a>)</p></blockquote><h3>使徒口传宣讲的时长</h3><p>使徒保罗教导亚西亚的长老们三年之久，昼夜不住：</p><blockquote><p>“所以你们应当儆醒，记念我<strong><mark>三年之久</mark></strong><strong>昼夜不住的流泪，劝戒你们各人</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/20/#L31">徒 20:31</a>)</p></blockquote><p>在哥林多教导团体一年半：</p><blockquote><p>“这事以后，保罗离了雅典，来到哥林多。 &lt;…&gt; 保罗<strong><mark>在那里住了一年零六个月</mark></strong>，<strong>将上帝的道教训他们</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/18/#L1,11">徒 18:1,11</a>)</p></blockquote><p>在以弗所宣讲：先在会堂里三个月，然后与门徒在学房里两年：</p><blockquote><p>“保罗进会堂放胆讲道，<strong>一连三个月</strong>，辩论上帝国的事，劝化众人。 后来，有些人心里刚硬不信，在众人面前毁谤这道。保罗就离开他们，也叫门徒与他们分离，便在推喇奴的学房<strong>天天辩论</strong>。 <strong>这样有两年之久</strong>，叫一切住在亚西亚的，无论是犹太人，是希利尼人，都听见主的道。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/19/#L8-10">徒 19:8-10</a>)</p></blockquote><p>总计，仅使徒保罗一人就宣讲了不少于30年：从他33-34年归主，到64-67年去世。</p><h2>命令持守圣传并按它教导</h2><blockquote><p>“我往马其顿去的时候，曾劝你仍住在以弗所，好嘱咐那几个人<strong><mark>不可传异教</mark></strong>， 也不可听从荒渺无凭的话语和无穷的家谱。这等事只生辩论，并不发明上帝在信上所立的章程。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/1/#L3-4">提前 1:3-4</a>)</p></blockquote><blockquote><p>“<strong><mark>你在许多见证人面前听见我所教训的</mark></strong>，<strong><mark>也要交托那忠心能教导别人的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/2/#L2">提后 2:2</a>)</p></blockquote><blockquote><p>“所以弟兄们，你们要<strong>站立得稳</strong>，<strong><mark>凡所领受的教训，不拘是我们口传的，是信上写的，都要坚守</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2sol/2/#L15">帖后 2:15</a>)</p></blockquote><blockquote><p>“我称赞你们，因你们凡事记念我，<strong>又坚守我所传给你们的</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/11/#L2">林前 11:2</a>)</p></blockquote><blockquote><p>“弟兄们，我如今把先前所传给你们的福音，告诉你们知道。这福音你们也领受了，又靠着站立得住； 并且你们若不是徒然相信，<strong><mark>能以持守我所传给你们的</mark></strong>，就必因这福音得救。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/15/#L1-2">林前 15:1-2</a>)</p></blockquote><blockquote><p>“亲爱的弟兄啊，我想尽心写信给你们，论我们同得救恩的时候，就不得不写信劝你们，要<strong>为从前</strong><strong><mark>一次</mark></strong><strong>交付圣徒的真道竭力的争辩</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iud/1/#L3">犹 1:3</a>)</p></blockquote><blockquote><p>“弟兄们，我还有话说：我们靠着主耶稣求你们、劝你们，<strong><mark>你们既然受了我们的教训</mark></strong>，知道该怎样行，可以讨上帝的喜悦，就要照你们现在所行的，<strong><mark>更加勉励</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1sol/4/#L1">帖前 4:1</a>)</p></blockquote><blockquote><p>“<strong>坚守所教真实的道理</strong>，就能将纯正的教训劝化人，又能把争辩的人驳倒了。 因为<strong>有许多人不服约束</strong>，说虚空话欺哄人，那奉割礼的更是这样。 这些人的口总要堵住。他们因贪不义之财，将不该教导的教导人，败坏人的全家。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/tit/1/#L9-11">多 1:9-11</a>)</p></blockquote><blockquote><p>“我只怕你们的心或偏于邪，失去那向基督所存纯一清洁的心，就像蛇用诡诈诱惑了夏娃一样。 假如有人来<strong>另传一个耶稣</strong>，不是我们所传过的，或者你们另受一个灵，不是你们所受过的；或者<strong>另得一个福音</strong>，不是你们所得过的，你们容让他也就罢了。 &lt;…&gt; 那等人是假使徒，行事诡诈，装作基督使徒的模样。 这也不足为怪，因为连撒但也装作光明的天使。 所以，他的差役若装作仁义的差役，也不算希奇。他们的结局必然照着他们的行为。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/11/#L3-4,13-15">林后 11:3-4,13-15</a>)</p></blockquote><h2>要远离引入新教导的人</h2><blockquote><p>“<strong>分门结党的人</strong>，警戒过一两次，<strong>就要弃绝他</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/tit/3/#L10">多 3:10</a>)</p></blockquote><blockquote><p>“<strong>若有人传异教</strong>，不服从我们主耶稣基督纯正的话与那合乎敬虔的道理， <strong>他是自高自大，一无所知</strong>，专好问难，争辩言词，从此就生出嫉妒、纷争、毁谤、妄疑， 并那坏了心术、失丧真理之人的争竞。他们以敬虔为得利的门路。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/6/#L3-5">提前 6:3-5</a>) <em>(俄文原文6:5末有“要远离这样的人”一句，和合本无)</em></p></blockquote><blockquote><p>“提摩太啊，你要<strong>保守所托付你的</strong>，<strong><mark>躲避世俗的虚谈</mark></strong>和那敌真道、似是而非的学问。 已经有人自称有这学问，就偏离了真道。愿恩惠常与你们同在。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/6/#L20-21">提前 6:20-21</a>)</p></blockquote><blockquote><p>“弟兄们，我们奉主耶稣基督的名吩咐你们：凡有弟兄不按规矩而行，<strong>不遵守从我们所受的教训</strong>，<strong>就当远离他</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2sol/3/#L6">帖后 3:6</a>)</p></blockquote><blockquote><p>“弟兄们，<strong>那些离间你们、叫你们跌倒</strong>、背乎所学之道的人，我劝你们要留意躲避他们。 因为这样的人不服事我们的主基督，只服事自己的肚腹，用花言巧语诱惑那些老实人的心。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/16/#L17-18">罗 16:17-18</a>)</p></blockquote><blockquote><p>“若有人到你们那里，不是传这教训，<strong><mark>不要接他到家里</mark></strong>，也不要问他的安。 因为问他安的就在他的恶行上有分。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2in/1/#L10-11">约贰 1:10-11</a>)</p></blockquote><blockquote><p>“但无论是我们，是天上来的使者，若传福音给你们，<strong>与我们所传给你们的不同，他就应当被咒诅</strong>。 我们已经说了，现在又说：若有人传福音给你们，<strong>与你们所领受的不同，他就应当被咒诅</strong>！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/1/#L8-9">加 1:8-9</a>)</p></blockquote><p><strong>绝罚</strong>（希腊文 ἀνάθεμα）——逐出教会。</p><h2>责备对圣传的歪曲（异端）</h2><blockquote><p>“<strong>至死要为真理奋斗</strong>，上主天主必要助你作战。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/4/#L33">德 4:33</a>)</p></blockquote><blockquote><p>“亲爱的弟兄啊，我想尽心写信给你们，论我们同得救恩的时候，就不得不写信劝你们，要<strong>为从前</strong><strong><mark>一次</mark></strong><strong>交付圣徒的真道竭力的争辩</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iud/1/#L3">犹 1:3</a>)</p></blockquote><blockquote><p>“有些人你们要从火中抢出来、搭救他们；有些人你们要<strong>存惧怕的心怜悯他们</strong>；连那被情欲沾染的衣服也当厌恶。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iud/1/#L23">犹 1:23</a>) <em>(俄文原文有“要存惧怕的心责备”一词，和合本无)</em></p></blockquote><blockquote><p>“那暗昧无益的事，不要与人同行，<strong>倒要责备</strong>行这事的人。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/5/#L11">弗 5:11</a>)</p></blockquote>
