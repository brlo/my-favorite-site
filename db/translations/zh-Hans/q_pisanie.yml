  title: 圣经
  copy_cover: true
  body: <h2>上帝藉着圣经说话</h2><blockquote><p>“这福音是<strong><mark>上帝</mark></strong>从前<strong><mark>藉众先知</mark></strong><strong><mark>在圣经上</mark></strong>所应许的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/1/#L2">罗 1:2</a>)</p></blockquote><blockquote><p>“「弟兄们，<strong><mark>圣灵藉大卫的口，在圣经上预言</mark></strong>领人捉拿耶稣的犹大，这话是必须应验的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/1/#L16">徒 1:16</a>)</p></blockquote><blockquote><p>“<strong><mark>圣经都是上帝所默示的</mark></strong>，于教训、督责、使人归正、教导人学义都是有益的，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/3/#L16">提后 3:16</a>)</p></blockquote><h2>使徒的宣讲——上帝的道</h2><blockquote><p>“到了撒拉米，就在犹太人各会堂里<strong><mark>传讲上帝的道</mark></strong>，也有约翰作他们的帮手。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/13/#L5">徒 13:5</a>)</p></blockquote><blockquote><p>“但帖撒罗尼迦的犹太人知道保罗又在庇哩亚<strong><mark>传上帝的道</mark></strong>，也就往那里去，耸动搅扰众人。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/17/#L13">徒 17:13</a>)</p></blockquote><blockquote><p>“为此，我们也不住的感谢上帝，因你们听见<strong><mark>我们所传上帝的道</mark></strong>，就领受了；不以为是人的道，<strong>乃以为是上帝的道</strong>。<strong><mark>这道实在是上帝的</mark></strong>，并且运行在你们信主的人心中。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1sol/2/#L13">帖前 2:13</a>)</p></blockquote><h2>救主关于读圣经的命令</h2><blockquote><p>“<strong><mark>你们查考圣经</mark></strong>，因你们以为内中有永生；给我作见证的就是这经；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/5/#L39">约 5:39</a>)</p></blockquote><blockquote><p>“耶稣回答说：「<strong><mark>你们错了，因为不明白圣经，也不晓得上帝的大能</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/22/#L29">太 22:29</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/mk/12/#L24">可 12:24</a>)</p></blockquote><h2>读圣经对得救有益</h2><blockquote><p>“并且知道你是从小明白圣经；<strong>这圣经能使你因信基督耶稣有得救的智慧</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/3/#L15">提后 3:15</a>)</p></blockquote><h2>圣经不能废掉</h2><blockquote><p>“<strong><mark>经上的话是不能废的</mark></strong>；若那些承受上帝道的人，尚且称为神，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/10/#L35">约 10:35</a>)</p></blockquote><h3>圣经不是历史陈迹，而是为今日的人写的</h3><blockquote><p>“从前所写的圣经，<strong><mark>都是为教训我们写的</mark></strong>，叫我们因圣经所生的忍耐和安慰，可以得着盼望。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/15/#L4">罗 15:4</a>)</p></blockquote><h2>对圣经的理解</h2><blockquote><p>“第一要紧的，该知道<strong>经上所有的预言没有可随私意解说的</strong>； 因为预言从来没有出于人意的，<strong>乃是人被圣灵感动，说出上帝的话来</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2pet/1/#L20-21">彼后 1:20-21</a>)</p></blockquote><h3>使徒们明白圣经，但仍需要救主的解释</h3><blockquote><p>“于是从摩西和众先知起，<strong>凡经上所指着自己的话都给他们讲解明白了</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/24/#L27">路 24:27</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/lk/24/#L32">路 24:32</a>)</p></blockquote><h3>上帝赐使徒明白圣经的能力</h3><blockquote><p>“于是<strong>耶稣开他们的心窍，使他们能明白圣经</strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/24/#L45">路 24:45</a>)</p></blockquote><h3>使徒在会堂里教导犹太人正确理解圣经</h3><blockquote><p>“弟兄们随即在夜间打发保罗和西拉往庇哩亚去。二人到了，就进入犹太人的会堂。 这地方的人贤于帖撒罗尼迦的人，甘心领受这道，<strong><mark>天天考查圣经，要晓得这道是与不是</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/17/#L10-11">徒 17:10-11</a>)</p></blockquote><h3>圣经中并非一切都容易明白。无知的人曲解圣经</h3><blockquote><p>“他一切的信上也都是讲论这事。<strong>信中有些难明白的</strong>，那无学问、不坚固的人强解，如强解别的经书一样，就自取沉沦。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2pet/3/#L16">彼后 3:16</a>)</p></blockquote><h3>亚波罗用圣经证明耶稣是基督</h3><blockquote><p>“在众人面前极有能力，驳倒犹太人，<strong><mark>引圣经证明耶稣是基督</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/18/#L28">徒 18:28</a>)</p></blockquote>
