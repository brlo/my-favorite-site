  title: 福音书作者引用七十士译本
  copy_cover: true
  body: <h2>七十士译本（LXX）——是什么？</h2><p><strong>七十士译本</strong>（拉丁文 Septuaginta——“七十”，简称 LXX）——旧约书卷的译本，于公元前III-II世纪由七十位（72位）犹太释经者从希伯来文译成古希腊文。</p><p>除这个希腊文本外，还有希伯来文的文本——马所拉文本。</p><p><strong>马所拉文本</strong>——旧约圣经的希伯来文本，公元VII-X世纪在其上加上了元音符号。什么是元音符号？简单地说，就是词上面的各种小点和勾勾，它们指出词中缺失的元音和读音的特点，使人能正确读出这个词。这些符号叫作区别符号。因为希伯来文本只由辅音字母组成，所以只有知道诵读传统（圣传）的人才能正确诵读。加上元音符号，是为了使文本的读法成为唯一的。</p><p>七十士译本之所以重要，是因为它是犹太人自己的文本，而且是在犹太民族拒绝耶稣为基督、为上帝<strong>之前</strong>就完成的。也就是说，那时还没有必要把圣经解释成让主耶稣基督在其中越来越没有位置。另外还要考虑到，任何翻译都同时是一种解释。在这里，七十士译本是由通晓语言和传统的人所作的解释-翻译：从难以诵读的希伯来文译成许多人易懂的希腊文。</p><h2>童女还是少女</h2><p>福音史家马太引用以赛亚关于基督由童女而生的预言：</p><blockquote><p>“说：『<strong><mark>必有童女怀孕生子</mark></strong>，人要称他的名为以马内利。』（以马内利繙出来就是『上帝与我们同在』。）” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/1/#L23">太 1:23</a>)</p></blockquote><p>这里“童女”在希腊文里是 παρθένος。</p><p>按七十士译本，基督应当由童女而生：</p><blockquote><p>“因此，主自己要给你们一个兆头，<strong><mark>必有童女怀孕生子</mark></strong>，给他起名叫以马内利。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/7/#L14">赛 7:14</a>)</p></blockquote><p>而按马所拉文本，基督由未出嫁的少女而生：希伯来文 עַלְמָ֗ה [al-maw']。</p><h2>杖还是床的头</h2><p>使徒保罗在致希伯来人书中(!)回忆，雅各敬拜自己杖的顶端：</p><blockquote><p>“雅各因着信，临死的时候，给约瑟的两个儿子各自祝福，<strong>扶着杖头</strong>敬拜上帝。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/11/#L21">希 11:21</a>)</p></blockquote><p>按七十士译本，雅各敬拜杖的顶端：</p><blockquote><p>“εἶπεν δέ Ὄμοσόν μοι. καὶ ὤμοσεν αὐτῷ. καὶ προσεκύνησεν Ισραηλ <strong>ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ</strong>” (<a href="https://bibleox.com/zh-Hans/gr-lxx-byz/gen/47/#L31">创 47:31</a>, 译自希腊文)</p></blockquote><p>而按马所拉文本，雅各敬拜床的头：希伯来文 מִּטָּֽה [mit-taw']。</p><h2>主耶稣基督族谱中的该南</h2><p>福音史家路加在救主的族谱中提到该南，在沙拉与亚法撒之间：</p><blockquote><p>“拿鹤是西鹿的儿子，西鹿是拉吴的儿子，拉吴是法勒的儿子，法勒是希伯的儿子，希伯是沙拉的儿子， 沙拉是<strong><mark>该南</mark></strong>的儿子，该南是亚法撒的儿子，亚法撒是闪的儿子，闪是挪亚的儿子，挪亚是拉麦的儿子， 拉麦是玛土撒拉的儿子，玛土撒拉是以诺的儿子，以诺是雅列的儿子，雅列是玛勒列的儿子，玛勒列是该南的儿子，该南是以挪士的儿子， 以挪士是塞特的儿子，塞特是亚当的儿子，亚当是上帝的儿子。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/3/#L35-38">路 3:35-38</a>)</p></blockquote><p>在七十士译本里有该南（130+330年）。他由亚法撒所生，又生了沙拉：</p><blockquote><p>“καὶ ἔζησεν Αρφαξαδ <strong>μετὰ τὸ γεννῆσαι αὐτὸν τὸν Καιναν</strong> ἔτη τετρακόσια τριάκοντα καὶ ἐγέννησεν υἱοὺς καὶ θυγατέρας καὶ ἀπέθανεν. <strong>Καὶ ἔζησεν Καιναν ἑκατὸν τριάκοντα ἔτη καὶ ἐγέννησεν τὸν Σαλα</strong>.” (<a href="https://bibleox.com/zh-Hans/gr-lxx-byz/gen/11/#L13">创 11:13</a>, 译自希腊文)</p></blockquote><p>在马所拉文本里，亚法撒（35+403年）直接生了沙拉，该南完全不存在：</p><blockquote><p>“<strong>亚法撒活到三十五岁，生了沙拉</strong>。 亚法撒生沙拉之后，又活了四百零三年，并且生儿养女。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/11/#L12-13">创 11:12-13</a>)</p></blockquote><p>前一章也描述了类似的情况：<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/10/#L22,24">创 10:22,24</a>。</p><h2>“使瞎眼的得看见”还是“被囚的出监牢”</h2><p>福音史家路加引用先知以赛亚的预言，按七十士译本引用：</p><blockquote><p>“『主的灵在我身上，因为他用膏膏我，叫我传福音给贫穷的人；差遣我报告被掳的得释放，<strong><mark>瞎眼的得看见</mark></strong>，叫那受压制的得自由， 报告上帝悦纳人的禧年。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/4/#L18-19">路 4:18-19</a>)</p></blockquote><p>在七十士译本里，此处有“使瞎眼的得看见”一语（希腊文 τυφλοῖς ἀνάβλεψιν）：</p><blockquote><p>“Πνεῦμα κυρίου ἐπ᾿ ἐμέ, οὗ εἵνεκεν ἔχρισέν με· εὐαγγελίσασθαι πτωχοῖς ἀπέσταλκέν με, ἰάσασθαι τοὺς συντετριμμένους τῇ καρδίᾳ, κηρύξαι αἰχμαλώτοις ἄφεσιν <strong>καὶ τυφλοῖς ἀνάβλεψιν</strong>, καλέσαι ἐνιαυτὸν κυρίου δεκτὸν καὶ ἡμέραν ἀνταποδόσεως, παρακαλέσαι πάντας τοὺς πενθοῦντας” (<a href="https://bibleox.com/zh-Hans/gr-lxx-byz/is/61/#L1-2">赛 61:1-2</a>, 译自希腊文)</p></blockquote><p>而在马所拉文本里是“被囚的出监牢”：希伯来文 אֲסוּרִים פְּקַח־קוֹחַ [aw-sar' pek-akh-ko'-akh]：</p><blockquote><p>“主耶和华的灵在我身上，因为耶和华用膏膏我，叫我传好信息给谦卑的人，差遣我医好伤心的人，报告被掳的得释放，<strong><mark>被囚的出监牢</mark></strong>； 报告耶和华的恩年，和我们上帝报仇的日子，安慰一切悲哀的人；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/61/#L1-2">赛 61:1-2</a>)</p></blockquote><p>而且在马所拉文本里，这句话以不同的措辞重复：“报告被掳的得释放，和被囚的出监牢”。</p><h2>手脚被扎了，还是被狮子撕裂？</h2><p>七十士译本里有关于基督的预言：</p><blockquote><p>“犬类围着我，恶党环绕我；<strong><mark>他们扎了我的手、我的脚</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/22/#L16">诗 22:16</a>)</p></blockquote><p>晚出的马所拉文本在<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/22/#L16">诗 22:16</a>（诗 22:16）里没有关于扎手扎脚的话，那里是“狮子”一词。文本里根本没有“撕裂”的动词，而且狮子的动作与手脚有什么关系也不清楚。</p><p>然而，正确的仍然是“扎了”。库姆兰古卷 4Q88 证实手脚被扎（详见<a href="https://bibleox.com/ru/ru/w/пророчества-о-Христе">关于基督的预言</a>）。</p><p>此外，还有一个关于“扎”的预言。它在这里被引用：</p><blockquote><p>“经上又有一句说：『<strong><mark>他们要仰望自己所扎的人</mark></strong>。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/19/#L37">约 19:37</a>)</p></blockquote><p>所引的出处：</p><blockquote><p>“我必将那施恩叫人恳求的灵，浇灌大卫家和耶路撒冷的居民．他们必仰望我，就是<strong><mark>他们所扎的</mark></strong>；必为我悲哀，如丧独生子，又为我愁苦，如丧长子。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/zah/12/#L10">亚 12:10</a>)</p></blockquote><p>希伯来原文：“וְהִבִּיטוּ אֵלַי אֵת אֲשֶׁר־<strong>דָּקָרוּ</strong>”（[希伯来文原典](https://bibleox.com/zh-Hans/heb-osm/zah/12/#L10)，亚 12:10）</p><p>דָּקָר——扎、刺穿；被刺穿、被扎透。</p><p>库姆兰卷 4Q80 也证实是“扎”。</p>
