- src: толкование-писания
  path: Qb2A_圣经的解释
  title: 圣经的解释
  copy_cover: true
  body: <h2>读圣经对得救有益</h2><p>使徒保罗说，研读圣经能帮助人得救：</p><blockquote><p>“并且知道你是从小明白圣经；<strong>这圣经能使你因信基督耶稣有得救的智慧</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/3/#L15">提后 3:15</a>)</p></blockquote><p>但若没有教会的教导，对圣经的错误解释可能把人引向灭亡：</p><blockquote><p>“并且要以我主长久忍耐为得救的因由，就如我们所亲爱的兄弟保罗，照着所赐给他的智慧写了信给你们。 他一切的信上也都是讲论这事。<strong>信中有些难明白的</strong>，<strong><mark>那无学问、不坚固的人强解</mark></strong>，如强解别的经书一样，<strong><mark>就自取沉沦</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2pet/3/#L15-16">彼后 3:15-16</a>)</p></blockquote><h2>必须正确解释圣经</h2><h3>圣灵所写的，由有圣灵的人明白</h3><p>藉圣灵感动而写下的，只有同样被同一位圣灵感动的人才能正确明白：</p><blockquote><p>“<strong>我们并有先知更确的预言</strong>，如同灯照在暗处。<strong>你们在这预言上留意</strong>，直等到天发亮，晨星在你们心里出现的时候，才是好的。 第一要紧的，该知道<strong>经上所有的预言没有可随私意解说的</strong>； 因为预言从来没有出于人意的，<strong>乃是人被圣灵感动，说出上帝的话来</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2pet/1/#L19-21">彼后 1:19-21</a>)</p></blockquote><h3>对圣经的错误解释可能导致灭亡</h3><p>无学问、未被教会坚立的人曲解圣经，自取沉沦：</p><blockquote><p>“并且要以我主长久忍耐为得救的因由，就如我们所亲爱的兄弟保罗，照着所赐给他的智慧写了信给你们。 他一切的信上也都是讲论这事。<strong>信中有些难明白的</strong>，<strong><mark>那无学问、不坚固的人强解</mark></strong>，如强解别的经书一样，<strong><mark>就自取沉沦</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2pet/3/#L15-16">彼后 3:15-16</a>)</p></blockquote><p>同样，使徒提出研读圣经，只是作为他已亲自以宣讲教导之事的补充：</p><blockquote><p>“<strong><mark>但你所学习的、所确信的，要存在心里</mark></strong>，因为你知道是跟谁学的。 并且知道<strong>你是从小明白圣经</strong>；这圣经能使你因信基督耶稣有得救的智慧。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/3/#L14-15">提后 3:14-15</a>)</p></blockquote><p><strong>况且</strong>——是在此基础上再加上。就是说，圣经的知识作为对根基的补充而有益——这根基是使徒的教导。下一节证实这一思想：</p><blockquote><p>“<strong><mark>圣经都是上帝所默示的</mark></strong>，<strong><mark>于教训</mark></strong>、督责、使人归正、教导人学义都是<strong><mark>有益</mark></strong>的，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/3/#L16">提后 3:16</a>)</p></blockquote><p>就是说，圣经本身并不自足，而是对主教提摩太在教导、责备、使人归正、教导人学义——即<strong>传递</strong>使徒信仰（圣传）——之事上有用的工具：</p><blockquote><p>“<strong>坚守所教真实的道理</strong>，就能将纯正的教训劝化人，又能把争辩的人驳倒了。 因为<strong>有许多人不服约束</strong>，说虚空话欺哄人，那奉割礼的更是这样。 这些人的口总要堵住。他们因贪不义之财，将不该教导的教导人，败坏人的全家。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/tit/1/#L9-11">多 1:9-11</a>)</p></blockquote><h3>使徒们曾错误地理解基督</h3><blockquote><p>“门徒渡到那边去，忘了带饼。 耶稣对他们说：「你们要谨慎，防备法利赛人和撒都该人的酵。」 门徒彼此议论说：「这是因为我们没有带饼吧！」 耶稣看出来，就说：「你们这小信的人，为什么因为没有饼彼此议论呢？ 你们<strong>还不明白吗</strong>？不记得那五个饼分给五千人，又收拾了多少篮子的零碎吗？ 也不记得那七个饼分给四千人，又收拾了多少筐子的零碎吗？ 我对你们说：『要防备法利赛人和撒都该人的酵』，<strong>这话不是指着饼说的</strong>，你们怎么不明白呢？」 门徒这才晓得他说的，不是叫他们防备饼的酵，乃是防备法利赛人和撒都该人的教训。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/16/#L5-12">太 16:5-12</a>)</p></blockquote><h3>埃提阿伯的太监不能明白圣经</h3><blockquote><p>“圣灵对腓利说：「你去贴近那车走。」 腓利就跑到太监那里，听见他念先知以赛亚的书，便问他说：「你所念的，你明白吗？」 他说：「<strong><mark>没有人指教我，怎能明白呢</mark></strong>？」于是请腓利上车，与他同坐。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/8/#L29-31">徒 8:29-31</a>)</p></blockquote><h3>基督向使徒们讲解圣经中的预言</h3><blockquote><p>“耶稣对他们说：「无知的人哪，先知所说的一切话，你们的心信得太迟钝了。 基督这样受害，又进入他的荣耀，岂不是应当的吗？」 <strong>于是从摩西和众先知起，凡经上所指着自己的话都给他们讲解明白了</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/24/#L25-27">路 24:25-27</a>)</p></blockquote><h2>旧约</h2><h3>解释圣经的必要性</h3><p>在旧约里不只是向民众诵读圣经：文士以斯拉与其他智慧人一同讲解，使民众明白：</p><blockquote><p>“文士以斯拉站在为这事特备的木台上。玛他提雅、示玛、亚奈雅、乌利亚、希勒家和玛西雅站在他的右边；毘大雅、米沙利、玛基雅、哈顺、哈拔大拿、撒迦利亚和米书兰站在他的左边。 &lt;…&gt; 他们清清楚楚的念上帝的律法书，<strong>讲明意思</strong>，<strong>使百姓明白所念的</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/neem/8/#L4,8">尼 8:4,8</a>)</p></blockquote>
