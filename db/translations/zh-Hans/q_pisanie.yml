  path: Qb5A_书信的写作缘由
  title: 书信的写作缘由
  copy_cover: true
  body: "<ol><li><p>[[rim 1|罗马书]]——使徒以书信预备自己到罗马来；</p></li><li><p>[[1kor 1|哥林多前书]]——责备犯淫乱的人、结党、晚餐时的混乱、滥用方言的恩赐；</p></li><li><p>[[2kor 1|哥林多后书]]——使徒职分的证明，劝勉捐输；</p></li><li><p>[[gal 1|加拉太书]]——责备“基督徒必须受割礼”的假教训；</p></li><li><p>[[ef 1|以弗所书]]——讲述对上帝奥秘的默观，安慰忧伤的人；</p></li><li><p>[[fil 1|腓立比书]]——致最爱使徒的教会的问候书信；</p></li><li><p>[[kol 1|歌罗西书]]——反对假教训以及诺斯替主义、哲学和犹太教的混合物；</p></li><li><p>[[1sol 1|帖撒罗尼迦前书]]——安慰关于已故者的命运，医治道德上的问题；</p></li><li><p>[[2sol 1|帖撒罗尼迦后书]]——澄清关于基督再来的教导；</p></li><li><p>[[1tim 1|提摩太前书]]——在以弗所假教师增多时的扶持与教导；</p></li><li><p>[[2tim 1|提摩太后书]]——使徒的临终嘱托；</p></li><li><p>[[tit 1|提多书]]——使提多在克里特人中得着权柄；</p></li><li><p>[[fm 1|腓利门书]]——愿意使腓利门与他的奴隶阿尼西母和好；</p></li><li><p>[[evr 1|希伯来书]]——基督徒堕入犹太教的危险，见证新约优于旧约，鼓励基督徒忍受苦难。</p></li></ol>"
