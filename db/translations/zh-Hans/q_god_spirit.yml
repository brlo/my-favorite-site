  path: Qg17A_圣父是上帝
  title: 圣父是上帝
  copy_cover: true
  body: <blockquote><p>“不要为那必坏的食物劳力，要为那存到永生的食物劳力，就是人子要赐给你们的，因为人子是<strong>父上帝</strong>所印证的。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/6/#L27">约 6:27</a>)</p></blockquote><blockquote><p>“耶稣回答说：「我若荣耀自己，我的荣耀就算不得什么；<strong>荣耀我的乃是我的父</strong>，<strong>就是你们所说是你们的上帝</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/8/#L54">约 8:54</a>)</p></blockquote><blockquote><p>“愿颂赞归与我们的主耶稣基督的<strong>父上帝</strong>，就是发慈悲的父，赐各样安慰的上帝。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/1/#L3">林后 1:3</a>)</p></blockquote><blockquote><p>“愿颂赞归与我们主耶稣基督的<strong>父上帝</strong>！他在基督里曾赐给我们天上各样属灵的福气。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/1/#L3">弗 1:3</a>)</p></blockquote><blockquote><p>“就是照<strong>父上帝</strong>的先见被拣选，借着圣灵得成圣洁，以致顺服耶稣基督，又蒙他血所洒的人：愿恩惠、平安多多的加给你们！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/1/#L2">彼前 1:2</a>)</p></blockquote>
