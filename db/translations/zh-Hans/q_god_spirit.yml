  copy_cover: true
  body: <h2>圣灵是上帝</h2><blockquote><p>“「灵就是上帝」（希腊文：πνεῦμα ὁ θεός）” (<a href="https://bibleox.com/zh-Hans/gr-lxx-byz/in/4/#L24">约 4:24</a>, 译自希腊文)</p></blockquote><h2>亚拿尼亚欺哄了圣灵——上帝</h2><blockquote><p>“彼得说：「亚拿尼亚，为什么撒但充满了你的心，叫你<strong><mark>欺哄圣灵</mark></strong>，把田地的价银私自留下几分呢？ 田地还没有卖，不是你自己的吗？既卖了，价银不是你作主吗？你怎么心里起这意念呢？你不是欺哄人，是<strong><mark>欺哄上帝</mark></strong>了！」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/5/#L3-4">徒 5:3-4</a>)</p></blockquote><h2>上帝借先知说话</h2><blockquote><p>“<strong><mark>上帝</mark></strong>既在古时<strong>借着众先知</strong>多次多方的<strong>晓谕</strong>列祖，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/1/#L1">希 1:1</a>)</p></blockquote><blockquote><p>“这福音是<strong><mark>上帝</mark></strong>从前<strong>藉众先知</strong>在圣经上所<strong>应许</strong>的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/1/#L2">罗 1:2</a>)</p></blockquote><blockquote><p>“但<strong><mark>上帝</mark></strong>曾<strong><mark>藉众先知的口</mark></strong>，预言基督将要受害，就这样应验了。 &lt;…&gt; 天必留他，等到万物复兴的时候，就是<strong><mark>上帝从创世以来，借着圣先知的口所说的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/3/#L18,21">徒 3:18,21</a>)</p></blockquote><h2>借先知说话的是圣灵</h2><blockquote><p>“他们彼此不合，就散了。未散以先，保罗说了一句话，说：「<strong><mark>圣灵</mark></strong><strong><mark>藉先知以赛亚</mark></strong>向你们祖宗所说的话是不错的。 他说，『你去告诉这百姓说，你们听是要听见，却不明白．看是要看见，却不晓得。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/28/#L25-26">徒 28:25-26</a>)</p></blockquote><blockquote><p>“<strong>圣灵有话说</strong>，『你们今日若听他的话，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/3/#L7">希 3:7</a>)</p></blockquote><blockquote><p>“「弟兄们，<strong>圣灵藉大卫的口</strong>，在圣经上预言领人捉拿耶稣的犹大，这话是必须应验的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/1/#L16">徒 1:16</a>)</p></blockquote>
