  body: <h2>圣灵用第一人称讲论自己</h2><blockquote><p>“彼得还思想那异象的时候，<strong>圣灵向他说</strong>：「有三个人来找你。 起来，下去，和他们同往，不要疑惑！因为<strong><mark>是我差他们来的</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/10/#L19-20">徒 10:19-20</a>)</p></blockquote><blockquote><p>“他们事奉主，禁食的时候，<strong>圣灵说</strong>：「<strong><mark>要为我</mark></strong>分派巴拿巴和扫罗，去<strong>作我召他们所作的工</strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/13/#L2">徒 13:2</a>)</p></blockquote><h2>圣灵说话</h2><blockquote><p>“<strong>圣灵对腓利说</strong>：「你去贴近那车走。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/8/#L29">徒 8:29</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/act/10/#L19-20">徒 10:19-20</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/act/13/#L2">徒 13:2</a>)</p></blockquote><h2>圣灵思想并代求</h2><blockquote><p>“鉴察人心的，晓得<strong>圣灵的意思</strong>，因为圣灵照着上帝的旨意<strong>替圣徒祈求</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/8/#L27">罗 8:27</a>)</p></blockquote><h2>圣灵随自己的意思行事</h2><blockquote><p>“这一切都是这位<strong>圣灵</strong>所运行、<strong>随己意</strong>分给各人的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/12/#L11">林前 12:11</a>)</p></blockquote><h2>圣灵借先知说话</h2><blockquote><p>“他们彼此不合，就散了。未散以先，保罗说了一句话，说：「<strong><mark>圣灵</mark></strong><strong><mark>藉先知以赛亚</mark></strong>向你们祖宗所说的话是不错的。 他说，『你去告诉这百姓说，你们听是要听见，却不明白．看是要看见，却不晓得。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/28/#L25-26">徒 28:25-26</a>)</p></blockquote><blockquote><p>“<strong>圣灵有话说</strong>，『你们今日若听他的话，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/3/#L7">希 3:7</a>)</p></blockquote><h2>从人心里呼叫父</h2><blockquote><p>“你们既为儿子，上帝就<strong>差他儿子的灵</strong>进入你们的心，<strong>呼叫</strong>：「<strong>阿爸，父！</strong>」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/4/#L6">加 4:6</a>)</p></blockquote><h2>听见</h2><blockquote><p>“只等真理的圣灵来了，他要引导你们明白一切的真理，因为他不是凭自己说的，乃是<strong>把他所听见的</strong>都说出来，并要把将来的事告诉你们。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/16/#L13">约 16:13</a>)</p></blockquote><h2>定意</h2><blockquote><p>“因为<strong>圣灵和我们定意</strong>不将别的重担放在你们身上，惟有几件事是不可少的，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/15/#L28">徒 15:28</a>)</p></blockquote><h2>住在</h2><blockquote><p>“岂不知你们是上帝的殿，<strong>上帝的灵住在你们里头</strong>吗？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/3/#L16">林前 3:16</a>)</p></blockquote><h2>指明</h2><blockquote><p>“<strong>圣灵用此指明</strong>，头一层帐幕仍存的时候，进入至圣所的路还未显明。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/9/#L8">希 9:8</a>)</p></blockquote><h2>作见证</h2><blockquote><p>“<strong>圣灵也对我们作见证</strong>，因为他既已说过：” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/10/#L15">希 10:15</a>)</p></blockquote><h2>受试探</h2><blockquote><p>“彼得说：「你们为甚么<strong>同心试探主的灵</strong>呢？埋葬你丈夫之人的脚已到门口，他们也要把你抬出去。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/5/#L9">徒 5:9</a>)</p></blockquote><h2>被亵慢</h2><blockquote><p>“何况人践踏上帝的儿子，将那使他成圣之约的血当作平常，又<strong>亵慢施恩的圣灵</strong>，你们想，他要受的刑罚该怎样加重呢？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/10/#L29">希 10:29</a>)</p></blockquote><h2>被亵渎</h2><blockquote><p>“所以我告诉你们：人一切的罪和亵渎的话，都可得赦免；惟独<strong>亵渎圣灵</strong>，总不得赦免。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/12/#L31">太 12:31</a>)</p></blockquote><h2>受欺哄</h2><blockquote><p>“彼得说：「亚拿尼亚，为什么撒但充满了你的心，叫你<strong>欺哄圣灵</strong>，把田地的价银私自留下几分呢？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/5/#L3">徒 5:3</a>)</p></blockquote><h2>遭抗拒</h2><blockquote><p>“你们这硬着颈项、心与耳未受割礼的人，常时<strong>抗拒圣灵</strong>；你们的祖宗怎样，你们也怎样！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/7/#L51">徒 7:51</a>)</p></blockquote>
