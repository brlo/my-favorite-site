  title: 说别国话的恩赐
  copy_cover: true
  body: <h2>上帝在巴别变乱了口音</h2><p>建造巴别塔形象地表达了不经上帝、靠自己达到天的企图。这导致了口音的变乱和彼此语言的不通：</p><blockquote><p>“他们说：「来吧，我们要建造一座城和一座塔，<strong><mark>塔顶通天</mark></strong>，为要传扬我们的名，免得我们分散在全地上。」 耶和华降临，要看看世人所建造的城和塔。 耶和华说：「看哪！他们成为<strong><mark>一样的人民，都是一样的言语</mark></strong>，如今既做起这事来，以后他们所要做的事，就没有不成就的了。 <strong><mark>我们下去，在那里变乱他们的口音，使他们的言语彼此不通</mark></strong>。」 于是，耶和华使他们从那里分散在全地上，他们就停工，不造那城了。 <strong><mark>因为耶和华在那里变乱天下人的言语</mark></strong>，使众人分散在全地上，所以那城名叫巴别。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/11/#L4-9">创 11:4-9</a>)</p></blockquote><h2>上帝在教会里胜过了口音的变乱</h2><p>在教会成立、圣灵降临的那一天，上帝赐给使徒明白外国语言的恩赐：</p><blockquote><p>“五旬节到了，门徒都聚集在一处。 忽然，从天上有响声下来，好像一阵大风吹过，充满了他们所坐的屋子； 又有舌头如火焰显现出来，分开落在他们各人头上。 <strong><mark>他们就都被圣灵充满</mark></strong>，<strong><mark>按着圣灵所赐的口才说起别国的话来</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/2/#L1-4">徒 2:1-4</a>)</p></blockquote><h2>别国的话——就是外国的语言</h2><p>从各地来的人惊讶：加利利人（使徒）怎么能说外国语言：</p><blockquote><p>“那时，有虔诚的犹太人从天下各国来，住在耶路撒冷。 这声音一响，众人都来聚集。<strong><mark>各人听见门徒用众人的乡谈说话</mark></strong>，就甚纳闷， 都惊讶希奇说：「看哪，<strong><mark>这说话的不都是加利利人吗</mark></strong>？ 我们各人怎么听见他们说我们生来所用的乡谈呢？ 我们<strong><mark>帕提亚人</mark></strong>、<strong><mark>玛代人</mark></strong>、<strong><mark>以拦人</mark></strong>，和<strong><mark>住在米所波大米</mark></strong>、<strong><mark>犹太</mark></strong>、<strong><mark>加帕多家</mark></strong>、<strong><mark>本都</mark></strong>、<strong><mark>亚西亚</mark></strong>、 <strong><mark>弗吕家</mark></strong>、<strong><mark>旁非利亚</mark></strong>、<strong><mark>埃及的人</mark></strong>，并<strong><mark>靠近古利奈的吕彼亚</mark></strong>一带地方的人，<strong><mark>从罗马来的客旅</mark></strong>中，或是犹太人，或是进犹太教的人， <strong><mark>革哩底和亚拉伯人</mark></strong>，<strong><mark>都听见他们用我们的乡谈，讲说上帝的大作为</mark></strong>。」 众人就都惊讶猜疑，彼此说：「这是什么意思呢？」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/2/#L5-12">徒 2:5-12</a>)</p></blockquote><h2>不是人人都有方言的恩赐</h2><ol><li><p><strong>不是</strong>人人都领受明白别国语言的恩赐。</p></li><li><p>领受方言恩赐的人，明白<strong>各种不同的</strong>语言。</p></li><li><p>一切恩赐，包括方言的恩赐，都是<strong>为了造就</strong>而赐下的：</p></li></ol><blockquote><p>“<strong><mark>恩赐原有分别</mark></strong>，圣灵却是一位。 <strong><mark>职事也有分别</mark></strong>，主却是一位。 <strong><mark>功用也有分别</mark></strong>，上帝却是一位，在众人里面运行一切的事。 圣灵显在各人身上，<strong><mark>是叫人得益处</mark></strong>。 这人蒙圣灵赐他<strong><mark>智慧的言语</mark></strong>，那人也蒙这位圣灵赐他<strong><mark>知识的言语</mark></strong>， 又有一人蒙这位圣灵赐他<strong><mark>信心</mark></strong>，还有一人蒙这位圣灵赐他<strong><mark>医病的恩赐</mark></strong>， 又叫一人<strong><mark>能行异能</mark></strong>，又叫一人<strong><mark>能作先知</mark></strong>，又叫一人<strong><mark>能辨别诸灵</mark></strong>，又叫一人<strong><mark>能说方言</mark></strong>，又叫一人<strong><mark>能繙方言</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/12/#L4-10">林前 12:4-10</a>)</p></blockquote><blockquote><p>“<strong><mark>上帝在教会所设立的</mark></strong>：第一是<strong><mark>使徒</mark></strong>，第二是<strong><mark>先知</mark></strong>，第三是<strong><mark>教师</mark></strong>，其次是<strong><mark>行异能的</mark></strong>，再次是<strong><mark>得恩赐医病的</mark></strong>，<strong><mark>帮助人的</mark></strong>，<strong><mark>治理事的</mark></strong>，<strong><mark>说方言的</mark></strong>。 <strong><mark>岂都是使徒吗</mark></strong>？<strong><mark>岂都是先知吗</mark></strong>？<strong><mark>岂都是教师吗</mark></strong>？<strong><mark>岂都是行异能的吗</mark></strong>？ <strong><mark>岂都是得恩赐医病的吗</mark></strong>？<strong><mark>岂都是说方言的吗</mark></strong>？<strong><mark>岂都是繙方言的吗</mark></strong>？ 你们要切切的求那更大的恩赐。我现今把最妙的道指示你们。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/12/#L28-31">林前 12:28-31</a>)</p></blockquote><h2>对使徒而言，懂希腊语不足以向一切人宣讲</h2><p>罗马的军官惊讶使徒竟然连最通用的语言——希腊语——都懂。也就是说，虽然希腊语流传很广（通用语），但这并不意味着人人都懂它。</p><p>受过高等教育的使徒保罗，曾受教于全民敬重的教法师迦玛列（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/22/#L3">徒 22:3</a>）——法利赛人、公会成员（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/5/#L34">徒 5:34</a>）——引用希腊哲学家和作家（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/17/#L28">徒 17:28</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/tit/1/#L12">多 1:12</a>），用希腊语向罗马的千夫长讲话。千夫长惊讶使徒保罗懂希腊语：</p><blockquote><p>“于是千夫长上前拿住他，吩咐用两条铁鍊捆锁；又问他是什么人，作的是什么事。 &lt;…&gt; 将要带他进营楼，保罗对千夫长说：「我对你说句话，可以不可以？」他说：「<strong><mark>你懂得希利尼话吗</mark></strong>？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/21/#L33,37">徒 21:33,37</a>)</p></blockquote><p>罗马的军官惊讶一个犹太人懂罗马帝国最通用的语言。只有在这种知识<strong>是罕见的</strong>时候，这才会令人惊讶。如果连希腊语的知识在如此有学问的人身上都令人惊讶，那对其他使徒而言，懂希腊语就更谈不上了——他们许多人是普通的渔夫，是没有学问的小民（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/4/#L13">徒 4:13</a>）。但问题不在于宣讲者（使徒）必须懂语言才能到处宣讲；听宣讲的人也必须懂希腊语。</p><p>所以，只有希腊语的知识是不够的，因此使徒们——作为基督生活、复活和教导的活的见证人——需要超性的恩赐，其中有明白语言恩赐，好把关于基督的见证连同自己的信仰传给万民。</p><h2>如果没有人明白说方言的人，就没有益处</h2><blockquote><p>“若有说方言的，只好两个人，至多三个人，且要轮流着说，也要一个人繙出来。 <strong><mark>若没有人繙，就当在会中闭口</mark></strong>，只对自己和上帝说就是了。 &lt;…&gt; 因为<strong><mark>上帝不是叫人混乱，乃是叫人安静</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/14/#L27-28,33">林前 14:27-28,33</a>)</p></blockquote><p>同时，先知的事奉是宣讲：</p><blockquote><p>“<strong><mark>犹大和西拉也是先知</mark></strong>，<strong><mark>就用许多话劝勉弟兄，坚固他们</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/15/#L32">徒 15:32</a>)</p></blockquote><h2>呼召人更追求作先知讲道（宣讲与解释）的恩赐，而不是方言</h2><blockquote><p>“<strong><mark>你们要追求爱</mark></strong>，也要切慕属灵的恩赐，其中<strong><mark>更要羨慕的，是作先知讲道</mark></strong>。 那说方言的，原不是对人说，乃是对上帝说．因为没有人听出来。然而他在心灵里，却是讲说各样的奥祕。 但<strong><mark>作先知讲道的，是对人说，要造就、安慰、劝勉人</mark></strong>。 <strong><mark>说方言的，是造就自己</mark></strong>；<strong><mark>作先知讲道的，乃是造就教会</mark></strong>。 我愿意你们都说方言，<strong><mark>更愿意你们作先知讲道</mark></strong>，因为说方言的，若不繙出来，使教会被造就，那作先知讲道的，就比他强了。 &lt;…&gt; 所以我弟兄们，<strong><mark>你们要切慕作先知讲道</mark></strong>，也不要禁止说方言。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/14/#L1-5,39">林前 14:1-5,39</a>)</p></blockquote><h2>方言终必停止</h2><blockquote><p>“爱是永不止息。先知讲道之能，终必归于无有；<strong><mark>说方言之能，终必停止</mark></strong>；知识也终必归于无有。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/13/#L8">林前 13:8</a>)</p></blockquote><h2>爱是最主要的恩赐，人应当追求它</h2><blockquote><p>“<strong><mark>我若能说万人的方言，并天使的话语，却没有爱</mark></strong>，我就成了鸣的锣、响的钹一般。 我若有先知讲道之能，也明白各样的奥祕、各样的知识，而且有全备的信，叫我能够移山，却没有爱，<strong><mark>我就算不得什么</mark></strong>。 &lt;…&gt; 如今常存的有信，有望，有爱；这三样，<strong><mark>其中最大的是爱</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/13/#L1-2,13">林前 13:1-2,13</a>)</p></blockquote><h2>使徒们未曾赐下的别的灵</h2><blockquote><p>“假如有人来另传一个耶稣，不是我们所传过的，或者你们<strong><mark>另受一个灵</mark></strong>，不是你们所受过的；或者另得一个福音，不是你们所得过的，你们容让他也就罢了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/11/#L4">林后 11:4</a>)</p></blockquote><h2>今天的宣教士学习语言</h2><p>在古代，使徒和最早的基督徒因非常的需要领受了明白外国语言的恩赐，好叫还很小的教会能够广泛传播，向万民宣讲。但今天的宣教士不得不学习语言，也就是要劳苦。为此现在一切手段都在，缺的可能只是心愿。</p><p>有一些信基督的人的团体（灵恩派和五旬节派）可以宣称自己有说别国话和解释它们的恩赐；但当他们到了别的国家，外国人并不懂他们的话，于是这样的宣教士要么继续说自己的母语，要么不得不借助教科书和教师用普通的方法学习语言。</p><p>在我们这个时代，这恩赐几乎没有了。正教会有一位二十世纪的圣人——圣山修士帕伊西——他除了母语（希腊语）之外从未学过别的语言，也从未宣称自己有说别国话的恩赐；但当外国人到他那里去时，他们竟能不用翻译就与他用法语、另一次用英语交谈。</p><h2>对异议的回应</h2><h3>关于哥林多前书14章经文的各种问题</h3><p>关于哥林多前书第14章有很多问题，所以有意义把整章都分析一遍。这在<a href="https://bibleox.com/ru/ru/w/K5Ou_Иные_языки_древних_христиан_и_позднейшие_симуляции">单独的一篇文章</a>里作了。</p><h3>方言只是在未来的世代才停止吗？</h3><p>正教徒向五旬节派和灵恩派指出使徒保罗关于方言必停止的话（<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/13/#L8">林前 13:8</a>），即这恩赐将要终止。当然，它不会完全消失，因为正教中极少数的现代圣人确实有过说外国语言的恩赐；但总体上，像最早基督徒那样的大规模现象不会再有了。</p><p>对此新教五旬节派回答说，方言只是在未来的世代、基督再来之后才停止。持这种看法的一些人所依据的，是关于“等那完全的来到”之时代的话（<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/13/#L10">林前 13:10</a>）。</p><p>我们在更宽的语境里看这段经文：</p><blockquote><p>“<strong><mark>爱是永不止息</mark></strong>。<strong><mark>先知讲道之能，终必归于无有</mark></strong>；<strong><mark>说方言之能，终必停止</mark></strong>；<strong><mark>知识也终必归于无有</mark></strong>。 <strong><mark>我们现在所知道的有限</mark></strong>，<strong><mark>先知所讲的也有限</mark></strong>， <strong><mark>等那完全的来到，这有限的必归于无有了</mark></strong>。 我作孩子的时候，话语像孩子，心思像孩子，意念像孩子．既成了人，就把孩子的事丢弃了。 <strong><mark>我们如今仿佛对着镜子观看，模糊不清</mark></strong>，到那时，就要面对面了。<strong><mark>我如今所知道的有限</mark></strong>，到那时就全知道，如同主知道我一样。 如今常存的有信，有望，有爱；这三样，其中最大的是爱。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/13/#L8-13">林前 13:8-13</a>)</p></blockquote><p>使徒说，当“那完全的来到”，那“有限的”就要归于无有。什么是有限的？<strong>知识</strong>。在这句话里他开始解释自己那句复杂的话——“知识也终必归于无有”。他现在要表达的是：不是知识本身要归于无有（仿佛他们那时将一无所知），而是他们现在所拥有的这有限的知识要归于无有，并且将有完全的知识。他继续发展的正是这一思想。</p><ol><li><p>他说，如今知识<strong>有限地</strong>已经有了，而别的知识<strong>有限地</strong>藉着先知讲道显明出来。</p></li><li><p>时候将到，那时赐下的将是完全的知识，而不是“有限的”。</p></li><li><p>如今知识是仿佛对着镜子观看，模糊不清地得着的。</p></li></ol><p>他这里说的是知识，而不是说方言的恩赐。基督徒对外国语言的知识不是有限的。否则他们就不能把福音完整地传给别的民族和万民。他们拥有完全的方言恩赐——五旬节来到耶路撒冷的人之所以惊讶，正因为他们听见使徒用自己乡谈说话（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/2/#L5-12">徒 2:5-12</a>）。那不是有限的。有限的是知识，而且只是知识。使徒接下去所推理的，正是知识。</p><p>那方言的恩赐什么时候停止呢？严格地说，这里没有说。只说了它要停止。而我们生活在他们之后二十个世纪，可以回顾并看到：这些话相当快就应验了——当宣讲大大传开、基督徒变得极多的时候；如今方言的恩赐已没有那样的非常需要。有非常需要的是爱，而方言的恩赐——没有。所以从那时起人们学习语言。</p><p>“爱是永不止息”这话并不表明要止息的物在永恒里止息。其余的一切什么时候止息都可以；关于永恒只说了一点：在那里爱不会止息。爱是永恒的、即使在未来的世代也不止息——这是无可争辩的。</p><p>教父们是否像五旬节派那样理解这些经文？</p><p>例如在四世纪，金口约翰认为，方言恩赐的止息说的是当今的世代，而不是未来的世代。</p><p><strong>圣金口约翰（约347-407）</strong></p><p>“他这样从各方面、以全部力量显明了爱的伟大之后，又从另一极重要的方面作同样的事，用另一个比较高举它的尊贵，说：‘先知讲道之能终必归于无有；说方言之能终必停止’。<strong>如果这两个恩赐是为信仰而赐下的，那么随着信仰在各处的传布，它们的使用已是多余的</strong>。而彼此相爱不会止息，反而无论在这里还是在未来的世代都要更加增长**，那时更要胜过如今。在这里有许多事削弱爱——钱财、（世间的事务）、肉身的情欲、灵魂的疾病；而在那里这些都没有。至于先知讲道和方言的止息，并没有什么可奇怪的；而知识的止息却似乎奇怪，所以他正是接着说：‘知识也终必归于无有’。怎样呢？难道我们那时将生活在无知中吗？不，恰恰在那时知识更当增长，正如他说的：‘到那时就全知道，如同主知道我一样’（林前 13:12）。所以，免得你以为它也像先知讲道和方言一样要归于无有，他在说了‘知识也终必归于无有’之后没有停住，而是显明了止息的方式，随即补充说：‘我们现在所知道的有限，先知所讲的也有限；等那完全的来到，这有限的必归于无有了’（林前 13:9-10）。可见，归于无有的不是知识，而是知识的有限，因为我们将知道的不仅是这些，还要多得多的东西。”</p><p>（[俄文](https://azbyka.ru/otechnik/Ioann_Zlatoust/besedy-na-1-e-poslanie-k-korinfjanam/34)《哥林多前书讲道集》第34篇）</p><p>更多引文：<a href="https://bibleox.com/ru/ru/w/ew9Dk6So_Говорение_на_языках">教父们论说别国话的引文</a></p><h3>人的语言和天使的语言</h3><p>当人们向新教五旬节派指出“别国的话就是别的民族的外国语言”的引文时，他们同意这一点，但作为回应又拿出另一节经文，说仿佛还有一种“天使的语言”的恩赐：</p><blockquote><p>“我若能说万人的方言，<strong><mark>并天使的话语</mark></strong>，却没有爱，我就成了鸣的锣、响的钹一般。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/13/#L1">林前 13:1</a>)</p></blockquote><p>但这种看法是错误的，因为天使是无形体的灵。他们没有说话的器官、没有舌头、没有肺、没有声带，也不需要空气（大气）来通过制造和接收空气的振动来交流。这样，由声带发出的任何人的声音都不可能是“天使的语言”，因为天使没有声带，也没有血肉的身体（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/24/#L39">路 24:39</a>）。</p><p>那使徒说“天使的语言”是什么意思呢？这不过是修辞的手法：先极度抬高一部分，再用另一部分把它贬低。使徒只是表明：没有爱的恩赐只是鸣的锣。当哥林多人还以为说别国的话已经是什么特别的东西时，使徒决定举得更高：即使能说天使的语言，若没有爱，这也毫无益处。</p><p>这只是使徒的修辞手法。关于这一点在圣金口约翰那里也可以读到。</p><p><strong>圣金口约翰（约347-407）</strong></p><p>“论到天使的语言，（使徒）并没有把语言归于天使，而是表达这样的意思：即使我能像天使彼此交谈那样说话，若没有它（爱），我还是无有，甚至是累赘、令人难堪。同样，在另一处他说‘天上、地上和地底下的一切都要屈膝拜他’（腓 2:10），他<strong>并没有把膝盖和骨头归于天使</strong>——绝无此事——而是藉着我们下拜的比喻来表达天使的热心敬拜。这里说语言也是一样：他指的不是肉身的器官，而是以我们熟悉的方式表达他们彼此之间的交谈。”</p><p>（[俄文](https://azbyka.ru/otechnik/Ioann_Zlatoust/besedy-na-1-e-poslanie-k-korinfjanam/32)《哥林多前书讲道集》第32篇）</p><p><strong>塞浦路斯的殉道者狄奥多莱（约386-457）</strong></p><p>“所谓天使的语言，他指的不是感官的语言，而是某种属灵的语言，天使们用它歌颂万有的上帝并彼此交谈。以赛亚听见他们歌唱，以西结、但以理、撒迦利亚和弥迦听见他们交谈。神圣的使徒<strong>以夸张的方式表达</strong>这一点，为要显明爱的优越。”</p><p>（[俄文](https://azbyka.ru/otechnik/Feodorit_Kirskij/tolkovanie_na_pervoe_poslanie_k_korinfinam/13#sel=9:83,9:128)《哥林多前书注释》第13章）</p><p>基督自己也用过类似的修辞手法：极度抬高一部分，好叫另一部分把它贬低：</p><blockquote><p>“<strong><mark>人若赚得全世界，赔上自己的生命，有什么益处呢</mark></strong>？人还能拿什么换生命呢？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/16/#L26">太 16:26</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/mk/8/#L36">可 8:36</a>)</p></blockquote><p>所以，这里讲的不是人有说天使语言的恩赐，因为人用血肉交流，而天使没有血肉。提到天使的语言只是修辞的手法。</p><h3>前五旬节派牧师的见证</h3><p>曾为五旬节团体牧师、后来转入正教的保罗，在一小段音频讲话（11分钟）里讲述了他对五旬节派中“别国的话”的感受和经验。他把以往的经验与在正教里得着的经验作了比较。</p><p>音频文件：[Яндекс.Диск](https://disk.yandex.ru/d/hHzrMNPi_lVy2w)（俄语）</p>
