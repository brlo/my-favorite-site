- src: 7PyK_Христианский_храм
  path: QL1A_基督教圣殿
  title: 基督教圣殿
  copy_cover: true
  body: <blockquote><p>“众人中有几个法利赛人对耶稣说：「夫子，责备你的门徒吧！」 耶稣说：「我告诉你们，<strong><mark>若是他们闭口不说，这些石头必要呼叫起来</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/19/#L39-40">路 19:39-40</a>)</p></blockquote><blockquote><p>“你们要守我的安息日，<strong><mark>敬我的圣所</mark></strong>。我是耶和华。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/19/#L30">利 19:30</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/lev/26/#L2">利 26:2</a>)</p></blockquote><h2>基督在世生活的时期</h2><p>基督为圣餐聚集门徒于一间大的、预备好的楼房：</p><blockquote><p>“他必指给你们<strong><mark>摆设整齐的一间大楼</mark></strong>，你们就在那里为我们预备。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/14/#L15">可 14:15</a>)</p></blockquote><p>教会建立之后，基督徒在圣殿里聚集：</p><blockquote><p>“他们<strong><mark>天天</mark></strong><strong><mark>同心合意恒切的在殿里</mark></strong>，且在家中擘饼，存着欢喜、诚实的心用饭，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/2/#L46">徒 2:46</a>)</p></blockquote><blockquote><p>“<strong><mark>常在殿里称颂上帝</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/24/#L53">路 24:53</a>)</p></blockquote><h2>基督升天之后</h2><p>基督徒常常到圣殿去：</p><blockquote><p>“<strong><mark>常在殿里称颂上帝</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/24/#L53">路 24:53</a>)</p></blockquote><blockquote><p>“他们天天<strong><mark>同心合意恒切的在殿里</mark></strong>，<strong><mark>且在家中擘饼</mark></strong>，存着欢喜、诚实的心用饭，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/2/#L46">徒 2:46</a>)</p></blockquote><blockquote><p>“申初祷告的时候，<strong><mark>彼得、约翰上圣殿去</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/3/#L1">徒 3:1</a>)</p></blockquote><blockquote><p>“后来，我回到耶路撒冷，<strong><mark>在殿里祷告的时候</mark></strong>，魂游象外，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/22/#L17">徒 22:17</a>)</p></blockquote><blockquote><p>“你查问就可以知道，<strong><mark>从我上耶路撒冷礼拜到今日</mark></strong>，不过有十二天。 他们并没有看见我<strong><mark>在殿里</mark></strong>，或是在会堂里，或是在城里，和人辩论，耸动众人。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/24/#L11-12">徒 24:11-12</a>)</p></blockquote><p>基督徒也在自己的专门场所聚集：</p><blockquote><p>“找着了，就带他到安提阿去。<strong><mark>他们足有一年的工夫和教会一同聚集，教训了许多人</mark></strong>。门徒称为基督徒是从安提阿起首。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/11/#L26">徒 11:26</a>)</p></blockquote><blockquote><p>“第一，我听说<strong><mark>你们聚会的时候</mark></strong>，彼此分门别类，我也稍微的信这话。 在你们中间不免有分门结党的事，好叫那些有经验的人显明出来。 你们聚会的时候，<strong><mark>算不得吃主的晚餐</mark></strong>； 因为吃的时候，各人先吃自己的饭，甚至这个饥饿，那个酒醉。 你们要吃喝，<strong><mark>难道没有家吗</mark></strong>？<strong><mark>还是藐视上帝的教会</mark></strong>，叫那没有的羞愧呢？我向你们可怎么说呢？可因此称赞你们吗？我不称赞！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/11/#L18-22">林前 11:18-22</a>)</p></blockquote><blockquote><p>“<strong><mark>妇女在会中要闭口不言</mark></strong>，像在圣徒的众教会一样，因为不准他们说话。<strong><mark>她们总要顺服</mark></strong>，正如律法所说的。 她们若要学什么，<strong><mark>可以在家里问自己的丈夫</mark></strong>．因为<strong><mark>妇女在会中说话原是可耻的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/14/#L34-35">林前 14:34-35</a>)</p></blockquote><h2>天上圣殿的先知性描绘</h2><p>启示录中对天上圣殿的描绘</p><p><strong>量度天上圣殿的命令</strong></p><blockquote><p>“有一根苇子赐给我，当作量度的杖，且有话说：「<strong><mark>起来，将上帝的殿和祭坛，并在殿中礼拜的人都量一量</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/11/#L1">启 11:1</a>)</p></blockquote><p><strong>宝座</strong></p><blockquote><p>“<strong><mark>那二十四位长老就俯伏在坐宝座的面前</mark></strong>，敬拜那活到永永远远的，又把他们的冠冕放在宝座前，说：” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/4/#L10">启 4:10</a>)</p></blockquote><blockquote><p>“<strong><mark>在上帝面前，坐在自己位上的二十四位长老，就面伏于地敬拜上帝</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/11/#L16">启 11:16</a>)</p></blockquote><p><strong>祭坛</strong></p><blockquote><p>“另有一位天使拿着金香炉，<strong><mark>来站在祭坛旁边</mark></strong>。有许多香赐给他，要和众圣徒的祈祷一同<strong><mark>献在宝座前的金坛上</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/8/#L3">启 8:3</a>)</p></blockquote><blockquote><p>“天使拿着香炉，<strong><mark>盛满了坛上的火</mark></strong>，倒在地上，随有雷轰、大声、闪电、地震。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/8/#L5">启 8:5</a>)</p></blockquote><blockquote><p>“第六位天使吹号，我就听见有声音<strong><mark>从上帝面前金坛的四角出来</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/9/#L13">启 9:13</a>)</p></blockquote><p><strong>七灯</strong></p><blockquote><p>“有闪电、声音、雷轰从宝座中发出。又<strong><mark>有七盏火灯在宝座前点着</mark></strong>，这七灯就是上帝的七灵。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/4/#L5">启 4:5</a>)</p></blockquote><p><strong>上香</strong></p><blockquote><p>“另有一位天使<strong><mark>拿着金香炉</mark></strong>，来站在祭坛旁边。<strong><mark>有许多香赐给他</mark></strong>，要和众圣徒的祈祷一同献在宝座前的金坛上。 &lt;…&gt; <strong><mark>天使拿着香炉</mark></strong>，盛满了坛上的火，倒在地上，随有雷轰、大声、闪电、地震。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/8/#L3,5">启 8:3,5</a>)</p></blockquote><h2>上帝命令敬重圣殿</h2><p>圣殿——<a href="https://bibleox.com/ru/ru/w/храм-образ-небесной-реальности">天上实体的像</a>。上帝命令敬重这像：</p><blockquote><p>“你们要守我的安息日，<strong><mark>敬我的圣所</mark></strong>。我是耶和华。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/19/#L30">利 19:30</a>)</p></blockquote><blockquote><p>“你们要守我的安息日，<strong><mark>敬我的圣所</mark></strong>。我是耶和华。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/26/#L2">利 26:2</a>)</p></blockquote><p>新约的圣殿，是按神学家约翰的启示录里的像建造的。</p><h2>对异议的回应</h2><h3>“使徒们去圣殿，是因为他们不明白？”</h3><p>使徒们在信仰的问题上并非一切都明白。例如，他们以为基督要去做耶路撒冷的王（<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/10/#L37-39">可 10:37-39</a>），而对基督关于受难和复活的话不明白，又不敢问（<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/9/#L31-32">可 9:31-32</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/9/#L45">路 9:45</a>）。</p><p>但这一切只是在基督复活之日圣灵的恩赐被赐给他们之前（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/20/#L21-23">约 20:21-23</a>），以及复活后第五十天之前（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/2/#L1-4">徒 2:1-4</a>）。此外，复活之后基督开他们的心窍，使他们能明白圣经（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/24/#L45">路 24:45</a>）。基督在复活之前就应许赐使徒无人能驳倒的智慧（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/21/#L15">路 21:15</a>）；使徒后来也讲到，上帝赐给他们各样智慧和知识的恩典（<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/1/#L8">弗 1:8</a>）。使徒保罗说，他在言语上（表达上）虽然是愚拙的，但在知识上却不是（<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/11/#L6">林后 11:6</a>）。</p><p>当新教徒想表明自己在信仰问题上比使徒“更有学识”时，他们引用的是圣灵降临在使徒身上之前的种种情形。然而这不成立，因为教会是在这之后建立和设立的，那时使徒们已不再有不明白信仰的情形。</p><p>这样，在圣灵被差遣之后，使徒们明白信仰的问题，在知识上并不缺乏。即使有什么不明白的，主也没有消失——他教导使徒们。例如，他藉异象使徒彼得明白，要给百夫长哥尼流施洗——也就是给非犹太人施洗，尽管这在当时教会的一些人里引起了疑惑。</p><h3>“应当用心灵和诚实敬拜上帝，而不是在圣殿里？”</h3><p>如果依着圣经，这里谈的不是圣殿，而是敬拜的地方。</p><blockquote><p>“妇人说：「先生，我看出你是先知。 <strong><mark>我们的祖宗在这山上礼拜</mark></strong>；你们倒说，<strong><mark>应当礼拜的地方是在耶路撒冷</mark></strong>。」 耶稣说：「妇人，你当信我，<strong><mark>时候将到，你们拜父，也不在这山上，也不在耶路撒冷</mark></strong>。 你们所拜的，你们不知道；我们所拜的，我们知道，因为救恩是从犹太人出来的。 时候将到，如今就是了。<strong><mark>那真正拜父的，要用心灵和诚实拜他</mark></strong>，因为父要这样的人拜他。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/4/#L19-23">约 4:19-23</a>)</p></blockquote><p>撒玛利亚妇人用她的问题把基督框起来：在哪里敬拜？</p><ul><li><p>在基利心山上；</p></li><li><p>在耶路撒冷圣殿里。</p></li></ul><p>但基督说，时候将到（并且已经到了），那时人们敬拜不在山上，也不在耶路撒冷，而是在心灵和诚实里：</p><p>这里谈的并不是圣殿，可以看出。而如果有人认为这里谈的是圣殿，那就请他禁止在山上祈祷，因为基督说的也有山。那样禁止圣殿的人，也要禁止山：住在山上吗？——不要祈祷。当然，这是不合理的。</p><p>还要注意，基督说这种敬拜的时候已经到了。然而基督仍然来到耶路撒冷圣殿，称它为父的殿、祈祷的殿，关心在那里祈祷不受任何拦阻。</p><p>就是说，虽然用心灵和诚实敬拜的时候已经到了，但这并没有取消圣殿。这座殿被基督撇下成为空的，只是在以色列多数人弃绝自己的救主之后：基督把葡萄园从先前的园户（旧约的司祭职）那里夺去，交给别人——使徒们，并对那些弃绝他的人说，他们的殿要成为荒场，即上帝的恩典离开它：</p><blockquote><p>“<strong><mark>看哪，你们的家成为荒场留给你们</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/23/#L38">太 23:38</a>)</p></blockquote><p>基督在十字架上死后，裂开的石头和撕开的幔子成了这事的标记：</p><blockquote><p>“忽然，<strong><mark>殿里的幔子从上到下裂为两半</mark></strong>，<strong><mark>地也震动，磐石也崩裂</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/27/#L51">太 27:51</a>)</p></blockquote><p>从那时起，基督徒在普天之下任何地方祈祷，随处献上圣餐礼的新祭：在有建筑的地方，也在没有建筑的地方。</p><h3>“既然幔子裂开了（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/27/#L51">太 27:51</a>），说明上帝离开了圣殿，那为什么还需要圣殿？”</h3><p>为了得救，圣殿（石头的建筑）并不需要。正教会的许多圣人在旷野里得救。然而，为了得救必须参与圣奥秘，圣奥秘在事奉圣礼中举行，而按自然的原因举行它们需要建筑。当然，必要时正教会没有建筑也可以。</p><p>既然有建筑，教会就把这地方视为奉献给上帝的地方，即圣殿。在这地方人求告上帝的名，在这里圣奥秘中显出上帝的恩典，在这里基督自己在圣餐圣奥秘中亲临。所以正教徒特别敬重这些地方，作为上帝显现的地方，正如上帝亲自要求尊敬他显现的地方（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/3/#L5">出 3:5</a>），其中包括要求敬重圣殿（<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/19/#L30">利 19:30</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/26/#L2">利 26:2</a>）。</p><p>旧约圣殿被撕开的幔子表明旧约教会的废止：表明耶路撒冷的圣殿作为旧约教会（以色列）与上帝相会的地方已被上帝撇下。葡萄园从旧约教会被夺去（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/21/#L43">太 21:43</a>），赐给了基督所建立、改变了约和司祭职的新约教会（<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/7/#L12">希 7:12</a>）。</p><p>新约教会不使用被撇下的旧约教会的圣殿，不在那里行事奉圣礼，也不期待上帝在那里向她显现。</p><h3>“圣殿只有一个，而且已被毁，所以不能建圣殿？”</h3><p>圣殿被毁不是第一次。那已经是第二座圣殿。而在此之前有可移动的圣殿——会幕，以色列人抬着它在西奈旷野中迁徙。当第一次圣殿被尼布甲尼撒毁掉时，这是否意味着上帝拒绝了在圣殿中敬拜的可能？如果没有，那为什么后来罗马人再次毁掉它时就应该这样？</p><p>弃绝基督的犹太人以为，祈祷和敬拜上帝只能在耶路撒冷圣殿里。他们把首位殉道者、六品执事司提反召到公会受审，指控他教导说这地方要被毁灭、规矩要改变（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/6/#L13-14">徒 6:13-14</a>）。六品执事的辩护词在于，详细列举圣祖的历史，表明他们在哪里都祈祷、向上帝献祭：他们无论在哪里，上帝都与他们同在（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/7/#L2-53">徒 7:2-53</a>）。</p><p>最后他指出，这座圣殿是所罗门按圣祖大卫的意愿和祈祷建造的，尽管上帝清楚地表明，他不需要为他建造殿宇：</p><blockquote><p>“大卫在上帝面前蒙恩，祈求为雅各的上帝预备居所； 却是<strong><mark>所罗门为上帝造成殿宇</mark></strong>。 <strong><mark>其实，至高者并不住人手所造的</mark></strong>，就如先知所言： 『主说：<strong><mark>天是我的座位，地是我的脚凳</mark></strong>，<strong><mark>你们要为我造何等的殿宇</mark></strong>？那里是我安息的地方呢？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/7/#L46-49">徒 7:46-49</a>)</p></blockquote><p>这样，在旧约订立之前，义人就在各处祈祷、向上帝献祭。后来，上帝为以色列设立了集中的敬拜形式：一座圣殿、一位大祭司，因为他们在地理上总是彼此相近。这种敬拜形式应当保证上帝所愿意的合一。</p><p>但当主按预言（<a href="https://bibleox.com/zh-Hans/cn-cuv/is/66/#L18-21">赛 66:18-21</a>）召万民进入教会时，他也创造了在万民中、在各处举行事奉圣礼的条件。他自己成为大祭司（作为上帝无所不在），差遣恩典，并把权柄赐给许多人——使徒们（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/18/#L18">太 18:18</a>），而不是只给一个人，不把圣餐的祭绑在任何地方（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/22/#L19">路 22:19</a>），差遣使徒往普天下去（<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/16/#L15">可 16:15</a>）。</p><p>基督徒的事奉圣礼正是围绕圣餐而建立的。为此圣殿并不需要。那些说我们正教徒行事奉圣礼必须有圣殿的人，只是编造我们并不教导的东西。必要时，事奉圣礼在任何地方举行：在医院、在军队、在监狱、在乘船、飞机、火车的旅途中、在森林里。</p><p>我们不教导说，为了得救需要圣殿（石头的建筑）。正教会的许多圣人在旷野里得救。然而，为了得救必须参与圣奥秘，圣奥秘在事奉圣礼中举行，而按自然的原因举行它们需要建筑。必要时，正教会没有建筑也可以。</p><p>既然有建筑，教会就把这地方视为奉献给上帝的地方，即圣殿。在这地方人求告上帝的名，在这里圣奥秘中显出上帝的恩典，在这里基督自己在圣餐圣奥秘中亲临。所以正教徒特别敬重这些地方，作为上帝显现的地方：</p><blockquote><p>“上帝说：「不要近前来，当把你脚上的鞋脱下来，因为<strong><mark>你所站之地是圣地</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/3/#L5">出 3:5</a>)</p></blockquote><p>上帝也要求敬重他的圣殿（<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/19/#L30">利 19:30</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/26/#L2">利 26:2</a>）。</p><p>基督的新约教会不教导说，敬拜只能在耶路撒冷，只能在撒玛利亚山上，甚至只能在圣殿里。随处都可以敬拜上帝、向他祈祷。</p><p>---</p><p>正教徒建造圣殿，不是为了进入旧约或遵守摩西的律法。旧约已经结束，摩西的律法已被废除。</p><p>我们建造共同聚会的场所，在其中祈祷并献上祭物。这样的场所从来没有人禁止建造。</p><p>旧约的圣殿作为观念是重要的。上帝指示按天上实体的样式建造它。就是说，按上帝的构想，圣殿应当是天的像。</p><p>圣经的一切必要佐证详见<a href="https://bibleox.com/ru/ru/w/храм-образ-небесной-реальности">圣殿——天上实体的象征</a>。</p><p>在旧约的时代，上帝是看不见的，而在天上的只有天使。</p><p>在新约里，基督上帝在天上有形地登基，而在天上除了天使，还有人。因此，当基督徒有了聚会的场所时，他们就按上帝先前同样的构想安排它们——使圣殿描绘天。</p><p>既然天改变了，圣殿也改变了。如今在圣殿里描绘的是成了肉身的上帝，而除了天使，还描绘天的其他居民——义的众人。</p><p>上帝从不建造空洞无意义的场所，尽管新教徒常常这样要求。他安排世界本身，使我们观看世界时能认识它的造物主。就是说，世界向我们宣讲。而圣殿的安排，为的是宣讲基督和他的天国，而不是空洞的白墙。</p><h3>奉献给圣像的圣殿</h3><p>正教圣殿只以上帝的名建造。在里面只向上帝行事奉圣礼。百分之九十五的祈祷是向上帝献上的，其余的——向他的圣人：天使和天上的义人。</p><p>每一座圣殿都有固定的神圣纪念。例如，有奉献给基督显圣容或基督升天的圣殿。这并不意味着在那里向显圣容和升天的事件祈祷。也有这样的圣殿，纪念某幅圣像（以奇妙的方式）被赐予，或纪念藉圣像使城市脱离敌人。这是神圣的纪念。当圣殿以神圣纪念之名被称呼时，这不意味着向神圣纪念祈祷。所有圣殿里的事奉圣礼都是一样的。</p>
