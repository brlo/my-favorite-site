  title: 规程、次序、礼规
  copy_cover: true
  body: <h2>定义</h2><p><strong>规程</strong>（чн）——某种重复性行为的既定次序。任何有秩序的东西都可以称为规程。</p><p><strong>礼规</strong>（чинопоследование）——某一事奉圣礼之内容的逐项详细陈述。</p><p>圣奥秘的举行也按既定的规程进行，或者照另一说法——按礼规。</p><h2>在教会里凡事都要按规程</h2><blockquote><p>“<strong><mark>凡事都要规规矩矩的按着次序行</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/14/#L40">林前 14:40</a>)</p></blockquote><blockquote><p>“弟兄们，我们奉主耶稣基督的名吩咐你们：<strong><mark>凡有弟兄不按规矩而行</mark></strong>，不遵守从我们所受的教训，就当远离他。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2sol/3/#L6">帖后 3:6</a>)</p></blockquote><blockquote><p>“因我们听说，在你们中间<strong><mark>有人不按规矩而行，什么工都不作</mark></strong>，反倒专管闲事。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2sol/3/#L11">帖后 3:11</a>)</p></blockquote>
