  title: 旧约的终结
  copy_cover: true
  body: <h2>将有新约</h2><p>旧约的预言：与犹太民族（他们违背了这约）的约将终结，将与新的民族另立新约：</p><blockquote><p>“<strong><mark>但耶书仑渐渐肥胖、粗壮</mark></strong>，光润，踢跳奔跑，<strong><mark>便离弃造他的上帝</mark></strong>，轻看救他的磐石。 <strong><mark>敬拜别神，触动上帝的愤恨</mark></strong>，行可憎恶的事，惹了他的怒气。 <strong><mark>所祭祀的鬼魔，并非真神</mark></strong>，乃是素不认识的神，是近来新兴的，是你列祖所不畏惧的。 你轻忽生你的磐石；忘记产你的上帝。 耶和华看见他的儿女惹动他，就厌恶他们； 说：「我要向他们掩面，看他们的结局如何；他们本是极乖僻的族类，心中无诚实的儿女。 他们以那不算为神的触动我的愤恨；以虚无的神惹了我的怒气。<strong><mark>我也要以那不成子民的触动他们的愤恨</mark></strong>；以愚昧的国民惹了他们的怒气。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/32/#L15-21">申 32:15-21</a>)</p></blockquote><blockquote><p>“耶和华说：「日子将到，<strong><mark>我要与以色列家和犹大家另立新约</mark></strong>。 不像我拉着他们祖宗的手，领他们出埃及地的时候，与他们所立的约。我虽作他们的丈夫，<strong><mark>他们却背了我的约</mark></strong>。」这是耶和华说的。 耶和华说：「那些日子以后，我与以色列家所立的约乃是这样：<strong><mark>我要将我的律法放在他们里面，写在他们心上</mark></strong>。<strong><mark>我要作他们的上帝，他们要作我的子民</mark></strong>。 &lt;…&gt; 「这些定例若能在我面前废掉，<strong><mark>以色列的后裔也就在我面前断绝</mark></strong>，永远不再成国。」这是耶和华说的。 耶和华如此说：「若能量度上天，寻察下地的根基，<strong><mark>我就因以色列后裔一切所行的弃绝他们</mark></strong>。」这是耶和华说的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ier/31/#L31-33,36-37">耶 31:31-33,36-37</a>)</p></blockquote><blockquote><p>“「素来没有访问我的，现在求问我没有寻找我的，我叫他们遇见；<strong><mark>没有称为我名下的</mark></strong>，我对他们说：『<strong><mark>我在这里！我在这里！</mark></strong>』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/65/#L1">赛 65:1</a>)</p></blockquote><blockquote><p>“我必将他种在这地。素不蒙怜悯的，我必怜悯；<strong><mark>本非我民的，我必对他说</mark></strong>：『<strong><mark>你是我的民</mark></strong>。』他必说：『<strong><mark>你是我的上帝</mark></strong>。』」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/os/2/#L23">何 2:23</a>)</p></blockquote><h2>论旧约的终结</h2><blockquote><p>“所以主指责他的百姓说：『日子将到，<strong><mark>我要与以色列家和犹大家另立新约</mark></strong>， &lt;…&gt; 既说新约，<strong><mark>就以前约为旧了</mark></strong>；<strong><mark>但那渐旧渐衰的，就必快归无有了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/8/#L8,13">希 8:8,13</a>)</p></blockquote><blockquote><p>“但他们的心地刚硬，直到今日<strong><mark>诵读旧约的时候，这帕子还没有揭去</mark></strong>；<strong><mark>这帕子在基督里已经废去了</mark></strong>。 然而直到今日，每逢诵读摩西书的时候，帕子还在他们心上。 <strong><mark>但他们的心几时归向主，帕子就几时除去了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/3/#L14-16">林后 3:14-16</a>)</p></blockquote><blockquote><p>“<strong><mark>他叫我们能承当这新约的执事，不是凭着字句，乃是凭着精意</mark></strong>。<strong><mark>因为那字句是叫人死，精意是叫人活</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/3/#L6">林后 3:6</a>)</p></blockquote><blockquote><p>“但我们既然在捆我们的律法上死了，<strong><mark>现今就脱离了律法</mark></strong>，叫我们服事主，<strong><mark>要按着心灵的新样，不按着仪文的旧样</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/7/#L6">罗 7:6</a>)</p></blockquote><blockquote><p>“但这因信得救的理还未来以先，<strong><mark>我们被看守在律法之下</mark></strong>，直圈到那将来的真道显明出来。 这样，<strong><mark>律法是我们训蒙的师傅</mark></strong>，引我们到基督那里，使我们因信称义。 但这因信得救的理既然来到，<strong><mark>我们从此就不在师傅的手下了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/3/#L23-25">加 3:23-25</a>)</p></blockquote><h3>警告：不要滥用基督徒的自由</h3><blockquote><p>“弟兄们，<strong><mark>你们蒙召是要得自由</mark></strong>，<strong><mark>只是不可将你们的自由当作放纵情欲的机会</mark></strong>，<strong><mark>总要用爱心互相服事</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/5/#L13">加 5:13</a>)</p></blockquote>
