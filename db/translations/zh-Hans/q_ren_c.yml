  title: 借贷生活
  copy_cover: true
  body: <blockquote><p>“富户管辖穷人，<strong><mark>欠债的是债主的仆人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/22/#L7">箴 22:7</a>)</p></blockquote><blockquote><p>“不要与人击掌，不要为欠债的作保。 <strong><mark>你若没有什么偿还，何必使人夺去你睡卧的床呢</mark></strong>？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/22/#L26-27">箴 22:26-27</a>)</p></blockquote><blockquote><p>“然而，<strong>敬虔加上知足的心便是大利了</strong>， 因为我们没有带什么到世上来，也不能带什么去， <strong><mark>只要有衣有食，就当知足</mark></strong>。 但那些想要发财的人，就陷在迷惑、落在网罗和许多无知有害的私欲里，叫人沉在败坏和灭亡中。 <strong><mark>贪财是万恶之根</mark></strong>！有人贪恋钱财，就被引诱离了真道，用许多愁苦把自己刺透了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/6/#L6-10">提前 6:6-10</a>)</p></blockquote><blockquote><p>“你们存心不可贪爱钱财，<strong><mark>要以自己所有的为足</mark></strong>。因为主曾说：『我总不撇下你，也不丢弃你。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/13/#L5">希 13:5</a>)</p></blockquote>
