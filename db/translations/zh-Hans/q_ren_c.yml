- src: медицина
  path: QR9A_医学
  title: 医学
  copy_cover: true
  body: <p>先知以赛亚容许用药治疗：</p><blockquote><p>“以赛亚说：「<strong><mark>当取一块无花果饼来</mark></strong>。」<strong><mark>人就取了来，贴在疮上</mark></strong>，王便痊愈了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/4ts/20/#L7">王下 20:7</a>)</p></blockquote><p>上帝造植物时，使其中一些具有药性：</p><blockquote><p>“应尊敬医生，因为他是非有不可的，也是上主造的。治疗原是来自至高者；君王对医生也应送礼。医生的学识使他抬头，在伟人面前，备受赞扬。<strong>上主使大地生长药材</strong>，明智人决不轻视它们。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/38/#L1-4">德 38:1-4</a>)</p></blockquote><p>求医时仰望上帝：</p><blockquote><p>“我儿，<strong>你患病时，不要失望，但要祈求上主，他要赐你病愈</strong>。你应远离过犯，管治你的手，洗净你心中的一切罪恶；你应奉献馨香和上等面粉的记念祭品，照你能备办的，应奉献肥美的祭品。<strong>但是也要请医生来诊治</strong>，因为他是上主造的，<strong>不要让他离开你，因为你需要他</strong>。有时他们妙手回春；故此他们也应该祈求上主，为使他们能给人安乐与健康，借此维持自己的生活。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/38/#L9-14">德 38:9-14</a>)</p></blockquote><p>把全部希望只寄托在医生身上，是错误的：</p><blockquote><p>“亚撒作王三十九年，他脚上有病，而且甚重。<strong><mark>病的时候没有求耶和华，只求医生</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/16/#L12">代下 16:12</a>)</p></blockquote><p>使徒传道者路加是医生：</p><blockquote><p>“<strong><mark>所亲爱的医生路加</mark></strong>和底马问你们安。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/4/#L14">西 4:14</a>)</p></blockquote>
