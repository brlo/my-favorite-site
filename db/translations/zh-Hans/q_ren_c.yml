  path: QR8A_疾病
  title: 疾病
  copy_cover: true
  body: <h2>起初的基督徒们也患病</h2><p>提摩太（以弗所主教）患胃病，使徒保罗因他的病吩咐他稍微放松斋戒：</p><blockquote><p>“<strong><mark>因你胃口不清，屡次患病</mark></strong>，<strong><mark>再不要照常喝水</mark></strong>，可以稍微用点酒。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/5/#L23">提前 5:23</a>)</p></blockquote><p>使徒保罗自己也得了一种病，免得他自高：</p><blockquote><p>“又恐怕我因所得的启示甚大，就过于自高，所以<strong><mark>有一根刺加在我肉体上</mark></strong>，就是撒但的差役要攻击我，<strong><mark>免得我过于自高</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/12/#L7">林后 12:7</a>)</p></blockquote><p>以巴弗提（使徒保罗的同工）患病，几乎要死：</p><blockquote><p>“然而，我想必须打发<strong><mark>以巴弗提</mark></strong>到你们那里去。他是我的兄弟，与我一同作工、一同当兵，是你们所差遣的，也是供给我需用的。 他很想念你们众人，并且极其难过，<strong><mark>因为你们听见他病了</mark></strong>。 <strong><mark>他实在是病了，几乎要死</mark></strong>，然而，上帝怜恤他，不但怜恤他，也怜恤我，免得我忧上加忧。 &lt;…&gt; 因他为作基督的工夫，<strong><mark>几乎至死</mark></strong>，不顾性命，要补足你们供给我的不及之处。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/fil/2/#L25-27,30">腓 2:25-27,30</a>)</p></blockquote><p>使徒保罗把一个犯罪的基督徒交给撒但，让他受疾病的打击：</p><blockquote><p>“我身子虽不在你们那里，心却在你们那里，好像我亲自与你们同在，已经判断了行这事的人。 &lt;…&gt; <strong>要把这样的人交给撒但，败坏他的肉体，使他的灵魂在主耶稣的日子可以得救</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/5/#L3,5">林前 5:3,5</a>)</p></blockquote><p>不配地参与圣餐礼曾使许多基督徒患病、软弱、甚至死亡：</p><blockquote><p>“因此，<strong><mark>在你们中间有好些软弱的与患病的</mark></strong>，死的也不少。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/11/#L30">林前 11:30</a>)</p></blockquote><p>旧约的义人也患病</p><blockquote><p>“<strong><mark>以撒年老，眼睛昏花，不能看见</mark></strong>，就叫了他大儿子以扫来，说：「我儿。」以扫说：「我在这里。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/27/#L1">创 27:1</a>)</p></blockquote><h2>身体受苦的益处</h2><h3>有助于离弃罪</h3><blockquote><p>“基督既在肉身受苦，你们也当将这样的心志作为兵器，因为<strong><mark>在肉身受过苦的，就已经与罪断绝了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/4/#L1">彼前 4:1</a>)</p></blockquote><h3>免于骄傲</h3><blockquote><p>“又恐怕我因所得的启示甚大，就过于自高，<strong><mark>所以有一根刺加在我肉体上，就是撒但的差役要攻击我，免得我过于自高</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/12/#L7">林后 12:7</a>)</p></blockquote><h3>管教</h3><blockquote><p>“这样，因痛苦缠身，<strong>他的狂傲，方开始止息</strong>；因天主的惩罚，<strong>痛苦逐渐增加，他也逐渐觉悟</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-sb/2mak/9/#L11">加下 9:11</a>)</p></blockquote><h2>上帝能以疾病施行惩罚</h2><p>上帝能因罪孽和罪恶施行惩罚：</p><blockquote><p>“你为何因损伤哀号呢？<strong><mark>你的痛苦无法医治</mark></strong>，<strong><mark>我因你的罪孽甚大，罪恶众多，曾将这些加在你身上</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ier/30/#L15">耶 30:15</a>)</p></blockquote><p>上帝因米利暗（亚伦和摩西的姊妹）毁谤摩西而以癞病惩罚她：</p><blockquote><p>“你们毁谤我的仆人摩西，为何不惧怕呢？」 <strong><mark>耶和华就向他们二人发怒而去</mark></strong>。 云彩从会幕上挪开了，不料，<strong><mark>米利暗长了大痲疯，有雪那样白</mark></strong>。亚伦一看米利暗长了大痲疯，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/12/#L8-10">民 12:8-10</a>)</p></blockquote><p>因以色列民偏离对上帝的敬拜，瘟疫临到以色列民：</p><blockquote><p>“以色列人与巴力毘珥连合，<strong><mark>耶和华的怒气就向以色列人发作</mark></strong>。 &lt;…&gt; <strong><mark>那时遭瘟疫死的，有二万四千人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/25/#L3,9">民 25:3,9</a>)</p></blockquote><p>救主指出罪是疾病的原因：</p><blockquote><p>“后来耶稣在殿里遇见他，对他说：「<strong><mark>你已经痊愈了，不要再犯罪，恐怕你遭遇的更加利害</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/5/#L14">约 5:14</a>)</p></blockquote><p>上帝也能施怜悯，护佑人免于疾病</p><blockquote><p>“又说：「<strong><mark>你若留意听耶和华你上帝的话</mark></strong>，又行我眼中看为正的事，留心听我的诫命，守我一切的律例，<strong><mark>我就不将所加与埃及人的疾病加在你身上，因为我耶和华是医治你的</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/15/#L26">出 15:26</a>)</p></blockquote><h2>并非一切疾病都出于罪</h2><blockquote><p>“耶稣过去的时候，看见一个人生来是瞎眼的。 门徒问耶稣说：「拉比，这人生来是瞎眼的，是谁犯了罪？是这人呢？是他父母呢？」 耶稣回答说：「<strong><mark>也不是这人犯了罪，也不是他父母犯了罪，是要在他身上显出上帝的作为来</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/9/#L1-3">约 9:1-3</a>)</p></blockquote><p>另见：<a href="https://bibleox.com/ru/ru/w/медицина">医学</a>。</p><h2>《十二宗徒训言》——一至二世纪的基督教文献</h2><blockquote><p>「凡临到你身上的逆境，<strong>你都要当作益处来接受</strong>，因为知道：若没有上帝，就什么也不会发生。」</p></blockquote><p>（<a href="https://bibleox.com/ru/ru/w/Дидахе/#HH-3">《十二宗徒训言》第3章</a>）</p>
