  path: QS9A_异端
  title: 异端（对信仰的歪曲）
  copy_cover: true
  body: <h2>异端的定义</h2><p><strong>异端</strong>（古希腊文 <a href="https://bibleox.com/ru/words/%CE%B1%CE%B9%CF%81%CE%B5%CF%83%CE%B9%CF%82">αἵρεσις</a> ——派别、学说、学派、选择）——是后来产生的、在先前学说之观念上形成的独立学说，通常与之相对立。异端的追随者认为他们所由分出的那个学说是错误的，也同样遭到对方的回敬。</p><p>在圣经的语境中，任何对信理的重大歪曲都被称为异端：</p><ul><li><p><strong>法利赛人</strong>——关于救恩的错误学说。在很大程度上，他们把救恩仅仅归结为严格遵守外在的规条；</p></li><li><p><strong>撒都该人</strong>——关于属灵现实的错误学说。他们否认属灵的现实：灵魂在身体死后的生命、神灵和天使的存在、死人的复活；</p></li><li><p><strong>许米乃和腓理徒的学说</strong>——关于复活的错误学说。他们教导说复活已经在过去完成了；</p></li><li><p><strong>尼哥拉一党人</strong>——关于道德生活的错误学说。他们容许肉体的淫乱。</p></li></ul><p>这些异端都不直接涉及关于上帝的教义，而是涉及信理的某些其他方面，然而它们仍然是异端。</p><h2>异端是使人失去救恩的罪</h2><blockquote><p>“情欲的事都是显而易见的，就如奸淫、污秽、邪荡、 拜偶像、邪术、仇恨、争竞、忌恨、恼怒、结党、纷争、<strong><mark>异端</mark></strong>、 嫉妒〔有古卷在此有『凶杀』二字〕、醉酒、荒宴等类。我从前告诉你们，现在又告诉你们，<strong><mark>行这样事的人必不能承受上帝的国</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/5/#L19-21">加 5:19-21</a>)</p></blockquote><blockquote><p>“弟兄们，<strong><mark>那些离间你们、叫你们跌倒、背乎所学之道的人</mark></strong>，我劝你们要留意躲避他们。 <strong><mark>因为这样的人不服事我们的主基督</mark></strong>，只服事自己的肚腹，用花言巧语诱惑那些老实人的心。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/16/#L17-18">罗 16:17-18</a>)</p></blockquote><p>错误的教导并不把人引向上帝：</p><blockquote><p>“<strong><mark>凡越过基督的教训不常守着的，就没有上帝</mark></strong>；常守这教训的，就有父又有子。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2in/1/#L9">约贰 1:9</a>)</p></blockquote><blockquote><p>“<strong>邪曲的思想，使人离开天主</strong>；愚人试探全能者，只有使自己蒙羞，” (<a href="https://bibleox.com/zh-Hans/cn-sb/prs/1/#L3">智 1:3</a>)</p></blockquote><h2>反对耶稣基督的人曾把他的教导视为异端之一</h2><p>控告基督使徒的人称基督的教导为拿撒勒异端（基督在拿撒勒长大——<a href="https://bibleox.com/zh-Hans/cn-cuv/in/1/#L45-46">约 1:45-46</a>）：</p><blockquote><p>“我们看这个人，如同瘟疫一般，是鼓动普天下众犹太人生乱的，又是<strong><mark>拿撒勒教党</mark></strong>里的一个头目，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/24/#L5">徒 24:5</a>)</p></blockquote><p>使徒们确认，法利赛人和撒都该人把他们的教导视为异端：</p><blockquote><p>“但有一件事，我向你承认，就是<strong><mark>他们所称为异端的道</mark></strong>，我正按着那道事奉我祖宗的上帝，又信合乎律法的和先知书上一切所记载的，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/24/#L14">徒 24:14</a>)</p></blockquote><p>在公会中，基督的教导被视为众多派别之一。法利赛人迦玛列列举了新派别的例子：</p><blockquote><p>“但有一个法利赛人，名叫迦玛列，是众百姓所敬重的教法师，在公会中站起来，吩咐人把使徒暂且带到外面去， 就对众人说：「以色列人哪，论到这些人，你们应当小心怎样办理。 <strong><mark>从前丢大起来</mark></strong>，自夸为大，附从他的人约有四百；他被杀后，附从他的全都散了，归于无有。 此后，报名上册的时候，<strong><mark>又有加利利的犹大起来</mark></strong>，引诱些百姓跟从他；他也灭亡，附从他的人也都四散了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/5/#L34-37">徒 5:34-37</a>)</p></blockquote><p>另见：<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/23/#L2">路 23:2</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/in/7/#L12">约 7:12</a>。</p><h3>为什么基督的教导不是异端？</h3><p>简言之，因为他是上帝（<a href="https://bibleox.com/ru/ru/w/Христос-Бог">引文</a>）、是真理（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/14/#L6">约 14:6</a>）、是立法者（「你们听见有吩咐古人的话说：&lt;…&gt;只是我告诉你们」——<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L21-22">太 5:21-22</a>）。</p><p>只有那些不承认耶稣是基督、是上帝，不相信他就是那位与亚伯拉罕、以撒和雅各说话的上帝和立法者（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/3/#L15">出 3:15</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/in/8/#L25">约 8:25</a>）、就是那位赐给以色列律法（<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/3/#L19">加 3:19</a>）、差遣先知到以色列的上帝（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/23/#L34">太 23:34</a>）的人，才把基督的教导视为虚假的、独立的。由于耶稣基督是上帝，作为立法者，他来更改了他自己所立的秩序，把他自己的葡萄园转给别人（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/20/#L16">路 20:16</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/12/#L9">可 12:9</a>）。</p><p>因此，只有不信基督的人才把基督的教导称为异端；信基督的人则认为他的教导是唯一真实的（<a href="https://bibleox.com/zh-Hans/cn-cuv/2in/1/#L9">约贰 1:9</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/in/3/#L36">约 3:36</a>）。然而，基督和使徒们曾警告说，在他们之后会出现虚假的教导，但必须持守那一次传给教会的：</p><blockquote><p>“亲爱的弟兄啊，我想尽心写信给你们，论我们同得救恩的时候，就不得不写信劝你们，<strong><mark>要为从前一次交付圣徒的真道竭力的争辩</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iud/1/#L3">犹 1:3</a>)</p></blockquote><h3>凡讲到耶稣基督的教导，都因为它讲到基督而是真实的吗？</h3><p>使徒们警告说，别人可能传讲另一个耶稣、另一个福音，并给人另一个灵：</p><blockquote><p>“我只怕你们的心或偏于邪，失去那向基督所存纯一清洁的心，就像蛇用诡诈诱惑了夏娃一样。 <strong><mark>假如有人来另传一个耶稣，不是我们所传过的</mark></strong>，<strong><mark>或者你们另受一个灵，不是你们所受过的</mark></strong>；<strong><mark>或者另得一个福音，不是你们所得过的</mark></strong>，你们容让他也就罢了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/11/#L3-4">林后 11:3-4</a>)</p></blockquote><h2>关于异端的预言</h2><h3>基督教中将出现许多异端</h3><blockquote><p>“<strong><mark>将来有好些人冒我的名来</mark></strong>，说『我是基督』，<strong><mark>并且要迷惑许多人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/13/#L6">可 13:6</a>)</p></blockquote><blockquote><p>“<strong><mark>且有好些假先知起来，迷惑多人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/24/#L11">太 24:11</a>)</p></blockquote><blockquote><p>“亲爱的弟兄啊，一切的灵，你们不可都信，总要试验那些灵是出于上帝的不是，因为<strong><mark>世上有许多假先知已经出来了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/4/#L1">约壹 4:1</a>)</p></blockquote><p>《十二宗徒训言》（一至二世纪）中也有指示：</p><blockquote><p>「因为<strong>在末后的日子里，假先知和败坏者将要增多</strong>，羊要变成狼，爱要变成恨。」</p></blockquote>（<a href="https://bibleox.com/ru/ru/w/Дидахе#L94">《十二宗徒训言》94</a>）<h3>异端将非常广泛地传播</h3><blockquote><p>“<strong><mark>他们的话如同毒疮，越烂越大</mark></strong>；其中有许米乃和腓理徒， <strong><mark>他们偏离了真道，说复活的事已过</mark></strong>，就败坏好些人的信心。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/2/#L17-18">提后 2:17-18</a>)</p></blockquote><blockquote><p>“从前在百姓中有假先知起来，<strong><mark>将来在你们中间也必有假师傅，私自引进陷害人的异端</mark></strong>，连买他们的主他们也不承认，自取速速地灭亡。 <strong><mark>将有许多人随从他们邪淫的行为</mark></strong>，便叫真道因他们的缘故被毁谤。 <strong><mark>他们因有贪心，要用捏造的言语在你们身上取利</mark></strong>。他们的刑罚，自古以来并不迟延；他们的灭亡，也必速速来到。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2pet/2/#L1-3">彼后 2:1-3</a>)</p></blockquote><h3>异端的社群将脱离教会及其信仰的合一</h3><blockquote><p>“小子们哪，如今是末时了。你们曾听见说，那敌基督的要来，<strong><mark>现在已经有好些敌基督的出来了</mark></strong>，从此我们就知道如今是末时了。 <strong><mark>他们从我们中间出去，却不是属我们的</mark></strong>；若是属我们的，就必仍旧与我们同在；他们出去显明都不是属我们的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/2/#L18-19">约壹 2:18-19</a>)</p></blockquote><blockquote><p>“他们曾对你们说过：『<strong><mark>末世必有好讥诮的人</mark></strong>随从自己不敬虔的私欲而行。』 <strong><mark>这就是那些引人结党、属乎血气、没有圣灵的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iud/1/#L18-19">犹 1:18-19</a>)</p></blockquote><h3>假师傅的任务——把信徒从教会中掳走并带他们随己而行</h3><blockquote><p>“我知道我去之后，<strong><mark>必有兇暴的豺狼进入你们中间</mark></strong>，不爱惜羊群。 <strong><mark>就是你们中间，也必有人起来，说悖谬的话，要引诱门徒跟从他们</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/20/#L29-30">徒 20:29-30</a>)</p></blockquote><h3>假师傅的手法</h3><h4>动听的学说</h4><p>假师傅们将要编出动听的学说，正是因为他们的听众将寻求悦耳的学说，忍受不了纯正的教导：</p><blockquote><p>“因为时候要到，人必厌烦纯正的道理，<strong><mark>耳朵发痒，就随从自己的情欲，增添好些师傅</mark></strong>；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/4/#L3">提后 4:3</a>)</p></blockquote><blockquote><p>“圣灵明说：在后来的时候，<strong><mark>必有人离弃真道，听从那引诱人的邪灵和鬼魔的道理</mark></strong>。 这是因为说谎之人的假冒，这等人的良心如同被热铁烙惯了一般。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/4/#L1-2">提前 4:1-2</a>)</p></blockquote><h4>虚假的敬虔</h4><blockquote><p>“你该知道，<strong><mark>末世必有危险的日子来到</mark></strong>。 因为那时人要专顾自己、贪爱钱财、自夸、狂傲、谤讟、违背父母、忘恩负义、心不圣洁、 &lt;…&gt; <strong><mark>有敬虔的外貌，却背了敬虔的实意</mark></strong>，这等人你要躲开。 &lt;…&gt; 常常学习，终久不能明白真道。 从前雅尼和佯庇怎样敌挡摩西，<strong><mark>这等人也怎样敌挡真道</mark></strong>。他们的心地坏了，在真道上是可废弃的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/3/#L1-2,5,7-8">提后 3:1-2,5,7-8</a>)</p></blockquote><blockquote><p>“<strong><mark>你们要防备假先知。他们到你们这里来，外面披着羊皮，里面却是残暴的狼</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/7/#L15">太 7:15</a>)</p></blockquote><h4>奇迹</h4><p>使徒们和古代基督徒被赐予丰富的行异能之力，不是为了作秀，而是为了益处：</p><blockquote><p>“<strong><mark>圣灵显在各人身上，是叫人得益处</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/12/#L7">林前 12:7</a>)</p></blockquote><p>一小群渔夫需要很大的帮助，才能在短短一生中把传道传遍全世界。使徒们曾警告说，这些恩赐将要止息：</p><blockquote><p>“爱是永不止息。<strong><mark>先知讲道之能，终必归于无有；说方言之能，终必停止</mark></strong>；知识也终必归于无有。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/13/#L8">林前 13:8</a>)</p></blockquote><p>基督自己也斥责寻求奇迹：</p><blockquote><p>“耶稣回答说：「<strong><mark>一个邪恶、淫乱的世代求看神迹</mark></strong>，除了先知约拿的神迹以外，再没有神迹给他们看。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/12/#L39">太 12:39</a>)</p></blockquote><p>在末后的时代，假先知将恰恰以奇迹引诱人：</p><blockquote><p>“<strong><mark>因为假基督、假先知将要起来，显大神迹、大奇事</mark></strong>。倘若能行，连选民也就迷惑了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/24/#L24">太 24:24</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/mk/13/#L22">可 13:22</a>)</p></blockquote><p>结果，在审判时，许多信徒将确信自己得救正是因为他们奉基督的名行异能、说预言、赶鬼。但他们受了欺骗，被教导行不法之事，基督不认识他们，把他们从自己面前赶走：</p><blockquote><p>“当那日，必有许多人对我说：『主阿，主阿，我们不是奉你的名传道，奉你的名赶鬼，<strong><mark>奉你的名行许多异能吗</mark></strong>？』 我就明明地告诉他们说：『<strong><mark>我从来不认识你们，你们这些作恶的人，离开我去吧</mark></strong>！』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/7/#L22-23">太 7:22-23</a>)</p></blockquote><h2>一世纪异端的例子</h2><h3>法利赛人</h3><p>使徒们称法利赛人的教导为异端（独立的、错误的学说）：</p><blockquote><p>“<strong><mark>惟有几个信徒是法利赛教门的人</mark></strong>，起来说：「必须给外邦人行割礼，吩咐他们遵守摩西的律法。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/15/#L5">徒 15:5</a>)</p></blockquote><p>从法利赛人中出来的信徒认为，外邦人要得救，必须受割礼并遵守摩西的律法。</p><p>传道者马太也指出法利赛人和撒都该人教导的危险：</p><blockquote><p>“耶稣对他们说：「你们要谨慎，<strong><mark>防备法利赛人和撒都该人的酵</mark></strong>。」 &lt;…&gt; 我对你们说：『要防备法利赛人和撒都该人的酵』，这话不是指着饼说的，你们怎么不明白呢？」 门徒这才晓得他说的，不是叫他们防备饼的酵，<strong><mark>乃是防备法利赛人和撒都该人的教训</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/16/#L6,11-12">太 16:6,11-12</a>)</p></blockquote><h3>撒都该人</h3><p>使徒们称撒都该人的教导为异端（独立的、错误的学说）：</p><blockquote><p>“大祭司和他的一切同人，就是<strong><mark>撒都该教门的人</mark></strong>，都起来，满心忌恨，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/5/#L17">徒 5:17</a>)</p></blockquote><p>撒都该人的教导否认死人复活、灵魂的死后生命、天使和神灵的存在：</p><blockquote><p>“<strong><mark>撒都该人常说没有复活的事</mark></strong>。他们来问耶稣说： &lt;…&gt; 耶稣说：「<strong><mark>你们所以错了，岂不是因为不明白圣经，不晓得上帝的大能吗</mark></strong>？ &lt;…&gt; <strong><mark>论到死人复活，你们没有念过摩西的书</mark></strong>荆棘篇上所载的吗？上帝对摩西说：『我是亚伯拉罕的上帝，以撒的上帝，雅各的上帝。』 <strong><mark>上帝不是死人的上帝，乃是活人的上帝</mark></strong>。你们是大错了。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/12/#L18,24,26-27">可 12:18,24,26-27</a>)</p></blockquote><blockquote><p>“<strong><mark>因为撒都该人说没有复活，也没有天使和鬼魂</mark></strong>；法利赛人却说两样都有，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/23/#L8">徒 23:8</a>)</p></blockquote><p>法利赛人与撒都该人相争：</p><blockquote><p>“<strong><mark>保罗看出大众一半是撒都该人，一半是法利赛人</mark></strong>，就在公会中大声说：「弟兄们，我是法利赛人，也是法利赛人的子孙。我现在受审问，是为盼望死人复活。」 说了这话，<strong><mark>法利赛人和撒都该人就争论起来，会众分为两党</mark></strong>。 因为撒都该人说没有复活，也没有天使和鬼魂；法利赛人却说两样都有，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/23/#L6-8">徒 23:6-8</a>)</p></blockquote><h3>许米乃和腓理徒的学说</h3><p>背离真理的许米乃和腓理徒的学说。他们既然背离了真理，就是说他们以前曾是基督徒。如今他们错误地教导复活，这显然是即将传播的异端，必须远离：</p><blockquote><p>“但要远避世俗的虚谈，因为这等人必进到更不敬虔的地步。 <strong><mark>他们的话如同毒疮，越烂越大</mark></strong>；<strong><mark>其中有许米乃和腓理徒</mark></strong>， <strong><mark>他们偏离了真道，说复活的事已过</mark></strong>，就败坏好些人的信心。 然而，上帝坚固的根基立住了。上面有这印记说：「主认识谁是他的人。」又说：「<strong><mark>凡称呼主名的人总要离开不义</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/2/#L16-19">提后 2:16-19</a>)</p></blockquote><h3>尼哥拉一党人</h3><p>主耶稣基督憎恶尼哥拉一党人的教导，也就是说，他们的教导显然是异端：</p><blockquote><p>“<strong><mark>你那里也有人照样服从了尼哥拉一党人的教训</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/2/#L15">启 2:15</a>)</p></blockquote><blockquote><p>“然而你还有一件可取的事，就是<strong><mark>你恨恶尼哥拉一党人的行为，这也是我所恨恶的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/2/#L6">启 2:6</a>)</p></blockquote><h2>二世纪异端的例子</h2><p>圣殉道者护教者查士丁（约100-165）写道，有些人虽然自称基督徒、承认被钉十字架的耶稣是主和基督，却传讲谎言之灵的教导，即独立的虚假学说（异端）：</p><blockquote><p>有些人<strong>自称是基督徒，承认被钉十字架的耶稣是主和基督，却传讲谎言之灵的教导，而不是他的教导</strong>……我们不与他们中的任何一位相通。</p></blockquote><p>（<a href="https://bibleox.com/ru/ru/w/Иустин_Философ-разговор_с_Трифоном_иудеем">《与特来弗对话录》</a>）</p><p>里昂的圣依勒内（约130-202）也写到无数的基督教异端。例如，他写到护教者查士丁的门徒塔提安：在查士丁殉道之前，塔提安未曾说过异端，而在那之后却编造了自己的学说：</p><blockquote><p>1. 从上述的（假师傅们）已经分出了许多异端的许多支派，因为<strong>许多人，甚至所有人，都愿意自己做师傅，离开他们原先所持守的异端。他们从另一套意见体系编造出学说，然后又由此编出另一种，力图教导新的东西，把自己当作所编学说的发明者</strong>。例如：所谓的克己派（Encratites），出自撒土尼努和马吉安，<strong>宣讲独身</strong>，拒绝上帝起初的创造，间接指摘那位为人的生育造了男性和女性的那一位；他们又<strong>戒绝食用动物</strong>，对造万物的上帝忘恩负义。他们<strong>还否认太初之人得救</strong>；不过这意见是他们中间很晚才发明的。首先提出这一亵渎的是塔提安：他作查士丁的门徒时，与他在一起，从未说过这样的话；但在查士丁殉道之后，他离开了教会，因想作高人一等的师傅而受此思想激动，编造了自己独特的学说体系。他像华伦提努派一样杜撰某些不可见的艾翁，又像马吉安和撒土尼努一样宣称婚姻是玷污和奸淫，并且凭自己否认亚当得救。</p><p>2. 另一些人相反，追随巴西理德和卡波克拉特，引入了不法同居、多妻制和对祭偶像之物的随意取用，声称上帝并不怎么在意这些。但何必再往下说呢？<strong>无法一一列举那些以这种或那种方式脱离真理的人</strong>。</p></blockquote><p>（<a href="https://bibleox.com/ru/ru/w/Ириней_Лионский-Против_ересей#HH-Глава-XXVIII-Учение-Татиана-энкратитов-и-других">《驳异端》第28章</a>）</p><h2>教会——唯一的信仰，合一与同心</h2><h3>教会里有唯一的信仰</h3><blockquote><p>“<strong><mark>身体只有一个</mark></strong>，圣灵只有一个，正如你们蒙召，同有一个指望。 <strong><mark>一主，一信，一洗</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/4/#L4-5">弗 4:4-5</a>)</p></blockquote><h3>同心的诫命</h3><blockquote><p>“<strong><mark>要彼此同心</mark></strong>，不要志气高大，倒要俯就卑微的人。不要自以为聪明。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/12/#L16">罗 12:16</a>)</p></blockquote><blockquote><p>“弟兄们，我藉我们主耶稣基督的名，劝你们<strong><mark>都说一样的话</mark></strong>。你们中间也不可分党，<strong><mark>只要一心一意</mark></strong>，彼此相合。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/1/#L10">林前 1:10</a>)</p></blockquote><p>更多关于同心的引文：<a href="https://bibleox.com/ru/ru/w/Единомыслие">同心</a>。</p><h3>上帝对合一的旨意</h3><p>主按使徒的话，愿信他的人合而为一</p><blockquote><p>“我不但为这些人祈求，也为那些因他们的话信我的人祈求， <strong><mark>使他们都合而为一</mark></strong>；正如你父在我里面，我在你里面，使他们也在我们里面，叫世人可以信你差了我来。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/17/#L20-21">约 17:20-21</a>)</p></blockquote><h2>抵挡异端的必要</h2><blockquote><p>“至死要为真理奋斗，上主天主必要助你作战。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/4/#L33">德 4:33</a>) <em>(俄文本为 Сир 4:32。)</em></p></blockquote><blockquote><p>“亲爱的弟兄啊，我想尽心写信给你们，论我们同得救恩的时候，就不得不写信劝你们，<strong><mark>要为从前一次交付圣徒的真道竭力的争辩</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iud/1/#L3">犹 1:3</a>)</p></blockquote><blockquote><p>“那暗昧无益的事，不要与人同行，<strong><mark>倒要责备行这事的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/5/#L11">弗 5:11</a>)</p></blockquote><blockquote><p>“<strong><mark>有些人你们要从火中抢出来、搭救他们</mark></strong>；有些人你们要存惧怕的心怜悯他们；<strong><mark>连那被情欲沾染的衣服也当厌恶</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iud/1/#L23">犹 1:23</a>)</p></blockquote><h2>魔鬼将始终与教会争战</h2><blockquote><p>“耶和华上帝对蛇说：「你既作了这事，就必受咒诅，比一切的牲畜野兽更甚！你必用肚子行走，终身吃土。 <strong><mark>我又要叫你和女人彼此为仇</mark></strong>；你的后裔和女人的后裔也彼此为仇。<strong><mark>女人的后裔要伤你的头；你要伤他的脚跟</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/3/#L14-15">创 3:14-15</a>)</p></blockquote><blockquote><p>“<strong><mark>龙见自己被摔在地上，就逼迫那生男孩子的妇人</mark></strong>。 &lt;…&gt; <strong><mark>龙向妇人发怒，去与她其余的儿女争战</mark></strong>，这儿女就是那守上帝诫命，为耶稣作见证的。那时龙就站在海边的沙上。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/12/#L13,17">启 12:13,17</a>)</p></blockquote><h2>批评</h2><h3>你们不羡慕奇迹吗</h3><p>异端的拥护者常常试图用奇迹、医治和赶鬼把自己的团体拉人。为此他们引用这样的话：</p><blockquote><p>“<strong><mark>你们要追求爱，也要切慕属灵的恩赐</mark></strong>，其中更要羨慕的，是作先知讲道。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/14/#L1">林前 14:1</a>)</p></blockquote><p>他们也用这节经文指摘教会不羡慕，因此教会里没有大规模的奇迹展示。</p><p>然而，使徒们和古代基督徒被赐予丰富的行异能之力，不是为了作秀，而是为了益处：</p><blockquote><p>“<strong><mark>圣灵显在各人身上，是叫人得益处</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/12/#L7">林前 12:7</a>)</p></blockquote><p>一小群渔夫需要很大的帮助，才能在短短一生中把传道传遍全世界。使徒们曾警告说，这些恩赐将要止息：</p><blockquote><p>“爱是永不止息。<strong><mark>先知讲道之能，终必归于无有；说方言之能，终必停止</mark></strong>；知识也终必归于无有。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/13/#L8">林前 13:8</a>)</p></blockquote><p>基督自己也斥责寻求奇迹：</p><blockquote><p>“耶稣回答说：「<strong><mark>一个邪恶、淫乱的世代求看神迹</mark></strong>，除了先知约拿的神迹以外，再没有神迹给他们看。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/12/#L39">太 12:39</a>)</p></blockquote><p>在末后的时代，假先知将恰恰以奇迹引诱人：</p><blockquote><p>“<strong><mark>因为假基督、假先知将要起来，显大神迹、大奇事</mark></strong>。倘若能行，连选民也就迷惑了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/24/#L24">太 24:24</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/mk/13/#L22">可 13:22</a>)</p></blockquote><p>结果，在审判时，许多信徒将确信自己得救正是因为他们奉基督的名行异能、说预言、赶鬼。但他们受了欺骗，被教导行不法之事，基督不认识他们，把他们从自己面前赶走：</p><blockquote><p>“当那日，必有许多人对我说：『主阿，主阿，我们不是奉你的名传道，奉你的名赶鬼，<strong><mark>奉你的名行许多异能吗</mark></strong>？』 我就明明地告诉他们说：『<strong><mark>我从来不认识你们，你们这些作恶的人，离开我去吧</mark></strong>！』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/7/#L22-23">太 7:22-23</a>)</p></blockquote><h3>你们没有爱心</h3><p>在与脱离教会的团体拥护者交谈时，常常出现这样的防卫反应：避开所讨论的话题，试图转到讨论对方的为人及其品质。这通常发生在出现难以回答的问题之后。无论你多么有分寸、有礼貌，你仍然可能被指控：</p><ul><li><p>论断人；</p></li><li><p>骄傲；</p></li><li><p>没有爱心。</p></li></ul><p><strong>说论断人</strong>——因为你说在异端中不能得救。然而，说这话的是使徒（<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/5/#L20">加 5:20</a>）和从一世纪起的圣教父（<a href="https://bibleox.com/ru/ru/w/7Ut6v4xr_Спасение_возможно_только_в_Церкви">引文</a>）。主赐了不要定人罪的诫命（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L37">路 6:37</a>），但另一方面也说要按公义判断（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/7/#L24">约 7:24</a>）。</p><p><strong>说骄傲</strong>——因为你说<a href="https://bibleox.com/ru/ru/w/X7l9DcTY_Спасение_возможно_только_в_Церкви">只有基督的教会才能得救</a>，教会是唯一的、有形的、合一的（<a href="https://bibleox.com/ru/ru/w/Церковь">引文</a>）。然而圣经中也这样说：基督是身体的（教会的）救主（<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/5/#L23">弗 5:23</a>），离了基督没有人能得救（<a href="https://bibleox.com/ru/ru/w/Иисус_Христос-единственный-спаситель-человечества">引文</a>）。圣教父们说的也是同样的话（<a href="https://bibleox.com/ru/ru/w/7Ut6v4xr_Спасение_возможно_только_в_Церкви">引文</a>）。</p><p>至于<strong>爱心</strong>。毫无疑问，基督徒应当温良、谦卑、始终出于爱心行事。但爱可以而且应当是什么样的呢？我们不能指摘主耶稣基督和使徒们缺乏爱心。同时，我们在圣经中遇到这样的教导：</p><blockquote><p>“我儿，你不可轻看耶和华的管教，也不可厌烦他的责备。 <strong><mark>因为耶和华所爱的，他必责备</mark></strong>，正如父亲责备所喜爱的儿子。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/3/#L11-12">箴 3:11-12</a>)</p></blockquote><blockquote><p>“<strong><mark>因为主所爱的，他必管教</mark></strong>，又鞭打凡所收纳的儿子。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/12/#L6">希 12:6</a>)</p></blockquote><blockquote><p>“<strong><mark>凡我所疼爱的，我就责备管教他</mark></strong>，所以你要发热心，也要悔改。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/3/#L19">启 3:19</a>)</p></blockquote><blockquote><p>“<strong><mark>上帝所惩治的人是有福的</mark></strong>！所以你不可轻看全能者的管教。 因为<strong><mark>他打破，又缠裹</mark></strong>；他击伤，用手医治。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iov/5/#L17-18">伯 5:17-18</a>)</p></blockquote><p>因此必须记得：如果我们把一切指摘都当作仇恨的表现，那就等于指摘上帝和使徒们有仇恨——他们不仅自己指摘谎言，还召人这样做：</p><blockquote><p>“那暗昧无益的事，不要与人同行，<strong><mark>倒要责备行这事的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/5/#L11">弗 5:11</a>)</p></blockquote><p>指出某种学说的虚假，可能不只是仇恨的表现（有些人确实出于骄傲和仇恨这样做），也可以是爱心的表现、对近人的关怀、愿他得救的意愿：</p><blockquote><p>“我的弟兄们，<strong><mark>你们中间若有失迷真道的</mark></strong>，有人使他回转； 这人该知道叫一个罪人从迷路上转回，<strong><mark>便是救一个灵魂不死，并且遮盖许多的罪</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/5/#L19-20">雅 5:19-20</a>)</p></blockquote><p>应当努力永不羞辱任何人，也不要让谈话转入对个人的讨论——在那里往往开始彼此定罪。应当谈学说，而不是谈人的品质。</p>
