  path: Qs14A_基督在巴勒斯坦的生活
  title: 基督在巴勒斯坦的生活
  copy_cover: true
  body: <h2>耶稣基督降生在伯利恒</h2><blockquote><p>“当希律王的时候，耶稣<strong>生在犹太的伯利恒</strong>。有几个博士从东方来到耶路撒冷，说：” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/2/#L1">太 2:1</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/lk/2/#L4-7">路 2:4-7</a>)</p></blockquote><p><em>这应验了预言：<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/2/#L5">太 2:5</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/in/7/#L42">约 7:42</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/mih/5/#L2">弥 5:2</a>。</em></p><h2>逃往埃及</h2><p>降生以后，约瑟和童贞女马利亚为躲避希律王的追杀，把婴孩耶稣带到埃及去了几年（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/2/#L16">太 2:16</a>）：</p><blockquote><p>“约瑟就起来，夜间带着小孩子和他母亲<strong>往埃及去</strong>， <strong>住在那里，直到希律死了</strong>。这是要应验主藉先知所说的话，说：『我从埃及召出我的儿子来。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/2/#L14-15">太 2:14-15</a>)</p></blockquote><p><em>这应验了主借先知所说的话：<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/2/#L15">太 2:15</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/os/11/#L1">何 11:1</a>。</em></p><h2>返回拿撒勒</h2><p>然后他们回到约瑟在拿撒勒的家（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/2/#L4">路 2:4</a>）：</p><blockquote><p>“「起来！带着小孩子和他母亲往以色列地去，因为要害小孩子性命的人已经死了。」 约瑟就起来，<strong>把小孩子和他母亲带到以色列地去</strong>， 只因听见亚基老接着他父亲希律作了犹太王，就怕往那里去，又在梦中被主指示，便往<strong>加利利境内</strong>去了。 到了一座城，名叫<strong>拿撒勒</strong>，就住在那里．这是要应验先知所说，他将称为拿撒勒人的话了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/2/#L20-23">太 2:20-23</a>)</p></blockquote><p><em>这应验了预言：<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/2/#L23">太 2:23</a>；可能还有 <a href="https://bibleox.com/zh-Hans/cn-cuv/sud/13/#L5">士 13:5</a>。</em></p><h2>每年上耶路撒冷</h2><p>每年，耶稣基督都与父母、亲属和熟人一起上耶路撒冷的圣殿守节（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/2/#L43-44">路 2:43-44</a>）：</p><blockquote><p>“<strong>每年到逾越节，他父母就上耶路撒冷去</strong>。 <strong>当他十二岁的时候</strong>，他们按着节期的规矩上去。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/2/#L41-42">路 2:41-42</a>)</p></blockquote><p>到十二岁时，孩童耶稣已具有令耶路撒冷圣殿中的教师惊讶的智慧：</p><blockquote><p>“每年到逾越节，他父母就上耶路撒冷去。 <strong>当他十二岁的时候</strong>，他们按着节期的规矩上去。 &lt;…&gt; 过了三天，就遇见他<strong>在殿里，坐在教师中间</strong>，一面听，一面问。 <strong>凡听见他的，都希奇他的聪明和他的应对</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/2/#L41-42,46-47">路 2:41-42,46-47</a>)</p></blockquote><p>十二岁以后，基督也住在拿撒勒，顺从父母：</p><blockquote><p>“他就同他们下去，<strong>回到拿撒勒．并且顺从他们</strong>。他母亲把这一切的事都存在心里。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/2/#L51">路 2:51</a>)</p></blockquote><h2>从拿撒勒迁往迦百农：传道的开始</h2><p>满了三十岁、在先知约翰那里受洗之后，基督才离开拿撒勒，迁往迦百农，开始宣讲：</p><blockquote><p>“耶稣听见约翰下了监，就退到加利利去； <strong>后又离开拿撒勒，往迦百农去，就住在那里</strong>。那地方靠海，在西布伦和拿弗他利的边界上。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/4/#L12-13">太 4:12-13</a>)</p></blockquote><p><em>这应验了预言：<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/4/#L14-16">太 4:14-16</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/is/9/#L1-2">赛 9:1-2</a>。</em></p><h2>若干细节</h2><h3>加利利人都熟悉耶稣是木匠的儿子</h3><p>在加利利传道时，人们都熟悉耶稣基督，知道他是普通的木匠、木匠的儿子：</p><blockquote><p>“<strong>这不是那木匠吗</strong>？不是马利亚的儿子雅各、约西、犹大、西门的长兄吗？他妹妹们不也是在我们这里吗？」他们就厌弃他。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/6/#L3">可 6:3</a>)</p></blockquote><blockquote><p>“<strong>这不是木匠的儿子吗</strong>？他母亲不是叫马利亚吗？他弟兄们不是叫雅各、约西〔有古卷作『约瑟』〕、西门，犹大吗？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/13/#L55">太 13:55</a>)</p></blockquote><h3>为守律法而常上圣殿</h3><p>为遵守律法，基督每年要三次上耶路撒冷的圣殿：</p><blockquote><p>“<strong>一切的男丁，要一年三次朝见主耶和华</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/23/#L17">出 23:17</a>)</p></blockquote><blockquote><p>“你们<strong>一切男丁，要一年三次</strong>朝见主耶和华以色列的上帝。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/34/#L23">出 34:23</a>)</p></blockquote><blockquote><p>“你<strong>一切的男丁</strong>要在<strong>除酵节、七七节、住棚节，一年三次</strong>，在耶和华你上帝所选择的地方朝见他，却不可空手朝见。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/16/#L16">申 16:16</a>)</p></blockquote><h3>基督遵行了律法</h3><blockquote><p>“莫想我来要废掉<strong>律法</strong>和先知；我来<strong>不是要废掉，乃是要成全</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L17">太 5:17</a>)</p></blockquote><blockquote><p>“耶稣回答说：「你暂且许我．因为<strong>我们理当这样尽诸般的义</strong>。」于是约翰许了他。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/3/#L15">太 3:15</a>)</p></blockquote><blockquote><p>“<strong>人子必要去世，正如经上指着他所写的</strong>，但卖人子的人有祸了，那人不生在世上倒好。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/26/#L24">太 26:24</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/mk/14/#L21">可 14:21</a>)</p></blockquote><blockquote><p>“耶稣对他们说：「这就是我从前与你们同在之时所告诉你们的话说：<strong>摩西的律法</strong>、<strong>先知的书</strong>和<strong>诗篇</strong>上所记的，凡指着我的话都必须应验。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/24/#L44">路 24:44</a>)</p></blockquote><blockquote><p>“及至时候满足，上帝就差遣他的儿子，<strong>为女子所生</strong>，且<strong>生在律法以下</strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/4/#L4">加 4:4</a>)</p></blockquote><h3>等候满龄才开始传道</h3><p>基督直到三十岁才传道行神迹，因为按上帝的定规和既成的传统，公共事奉从三十岁开始（<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/4/#L3">民 4:3</a>）。因此，来不是要废掉律法、乃是要成全的基督（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L17">太 5:17</a>），等候到三十岁才出来传道：</p><blockquote><p>“耶稣<strong>开头传道，年纪约有三十岁</strong>。依人看来，他是约瑟的儿子，约瑟是希里的儿子，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/3/#L23">路 3:23</a>)</p></blockquote><h2>他的时刻</h2><blockquote><p>“他们就想要捉拿耶稣，只是没有人下手，因为<strong>他的时候还没有到</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/7/#L30">约 7:30</a>)</p></blockquote><blockquote><p>“这些话是耶稣在殿里的库房教训人时所说的，也没有人拿他，<strong>因为他的时候还没有到</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/8/#L20">约 8:20</a>)</p></blockquote><blockquote><p>“耶稣就对他们说：「<strong>我的时候还没有到</strong>；你们的时候常是方便的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/7/#L6">约 7:6</a>)</p></blockquote><blockquote><p>“你们上去过节吧！我现在不上去过这节；<strong>因为我的时候还没有满</strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/7/#L8">约 7:8</a>)</p></blockquote><blockquote><p>“<strong>我有当受的洗还没有成就，我是何等的迫切呢</strong>！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/12/#L50">路 12:50</a>)</p></blockquote><blockquote><p>“耶稣说了这话，就举目望天说：「<strong>父啊！时候到了</strong>，愿你荣耀你的儿子，使儿子也荣耀你；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/17/#L1">约 17:1</a>)</p></blockquote>
