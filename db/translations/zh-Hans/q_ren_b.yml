- src: человек-труд
  path: QR6A_劳动
  title: 劳动
  copy_cover: true
  body: <blockquote><p>“<strong><mark>你必汗流满面才得餬口</mark></strong>，直到你归了土，因为你是从土而出的。你本是尘土，仍要归于尘土。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/3/#L19">创 3:19</a>)</p></blockquote><blockquote><p>“<strong><mark>又要立志作安静人，办自己的事，亲手作工，正如我们从前所吩咐你们的</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1sol/4/#L11">帖前 4:11</a>)</p></blockquote><blockquote><p>“这事以后，<strong>保罗</strong>离了雅典，来到哥林多。 &lt;…&gt; <strong><mark>他们本是制造帐棚为业</mark></strong>。保罗因<strong>与他们同业</strong>，就和他们同住作工。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/18/#L1,3">徒 18:1,3</a>)</p></blockquote><blockquote><p>“直到如今，我们还是又饥、又渴、又赤身露体、又挨打、又没有一定的住处， <strong><mark>并且劳苦，亲手作工</mark></strong>。被人咒骂，我们就祝福；被人逼迫，我们就忍受；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/4/#L11-12">林前 4:11-12</a>)</p></blockquote><blockquote><p>“从前偷窃的，不要再偷；<strong><mark>总要劳力，亲手作正经事</mark></strong>，就可有余，分给那缺少的人。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/4/#L28">弗 4:28</a>)</p></blockquote><blockquote><p>“<strong>我未曾贪图一个人的金、银、衣服</strong>。 <strong><mark>我这两只手常供给我和同人的需用</mark></strong>，这是你们自己知道的。 我凡事给你们作榜样，叫你们知道应当这样劳苦，扶助软弱的人，又当记念主耶稣的话，说：『施比受更为有福。』」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/20/#L33-35">徒 20:33-35</a>)</p></blockquote><blockquote><p>“我们的劝勉，不是出于错误，不是出于污秽，也不是用诡诈。 &lt;…&gt; 因为<strong><mark>我们从来没有用过谄媚的话</mark></strong>，这是你们知道的；<strong><mark>也没有藏着贪心</mark></strong>，这是上帝可以作见证的。 &lt;…&gt; 弟兄们，你们记念我们的辛苦劳碌，<strong><mark>昼夜作工</mark></strong>，传上帝的福音给你们，<strong><mark>免得叫你们一人受累</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1sol/2/#L3,5,9">帖前 2:3,5,9</a>)</p></blockquote><blockquote><p>“<strong><mark>也未尝白吃人的饭</mark></strong>，倒是<strong><mark>辛苦劳碌，昼夜作工</mark></strong>，免得叫你们一人受累。 这并不是因我们没有权柄，乃是要给你们作榜样，叫你们效法我们。 我们在你们那里的时候，曾吩咐你们说：「<strong><mark>若有人不肯作工，就不可吃饭</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2sol/3/#L8-10">帖后 3:8-10</a>)</p></blockquote><blockquote><p>“不要厌恶劳力的工作，和至高者制定的农业。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/7/#L16">德 7:16</a>) <em>(俄文本为 Сир 7:15。)</em></p></blockquote><blockquote><p>“劳而致富的人，胜于自大，而无以果腹的人。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/10/#L30">德 10:30</a>)</p></blockquote><blockquote><p>“对待恶仆只有鞭打和刑罚；要使他们操作，不得空闲。因为，空闲教给人许多坏事。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/33/#L28-29">德 33:28-29</a>)</p></blockquote><blockquote><p>“我经过<strong><mark>懒惰人</mark></strong>的田地、<strong><mark>无知人</mark></strong>的葡萄园， 荆棘长满了地皮，刺草遮盖了田面，石墙也坍塌了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/24/#L30-31">箴 24:30-31</a>)</p></blockquote>
