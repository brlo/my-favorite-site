- src: расы-и-народы
  path: QR4A_种族与民族
  title: 种族与民族
  copy_cover: true
  body: <p>起初，上帝造了亚当：</p><blockquote><p>“<strong><mark>耶和华上帝用地上的尘土造人</mark></strong>，将生气吹在他鼻孔里，他就成了有灵的活人，名叫亚当。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/2/#L7">创 2:7</a>) <em>(希伯来文：אָדָם（亚当）。)</em></p></blockquote><p>后来，上帝从亚当的肋骨造了夏娃：</p><blockquote><p>“<strong><mark>只是那人没有遇见配偶帮助他</mark></strong>。 耶和华上帝使他沉睡，他就睡了；于是取下他的一条肋骨，又把肉合起来。 <strong><mark>耶和华上帝就用那人身上所取的肋骨造成一个女人，领她到那人跟前</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/2/#L20-22">创 2:20-22</a>)</p></blockquote><p>亚当生了许多儿女：</p><blockquote><p>“<strong><mark>亚当生塞特之后</mark></strong>，又在世八百年，<strong><mark>并且生儿养女</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/5/#L4">创 5:4</a>)</p></blockquote><p>塞特出生之后（即已生了三个儿子：<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/4/#L1">创 4:1</a>该隐、<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/4/#L2">创 4:2</a>亚伯和<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/4/#L25">创 4:25</a>塞特），又生了别的儿子和女儿。创世记的作者对他们不再加以注意，因为作者的视线只投向他认为对读者重要的历史细节。此后只按父系（按犹太传统）列举该隐和塞特的某些世系。由该隐所出的世系中，提到乐器的发明者（<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/4/#L21">创 4:21</a>）、兵器的制造者（<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/4/#L22">创 4:22</a>）和多妻制的起源（<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/4/#L19">创 4:19</a>）。列举了从塞特到挪亚的某些先祖（<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/5/#L6-29">创 5:6-29</a>）。塞特生了许多儿女（<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/5/#L7">创 5:7</a>），但其中只提到一个：以挪士（<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/4/#L26">创 4:26</a>）。其余的人也是这样。后来人渐渐增多，忘记上帝，先沉溺于罪中，后又被洪水的波涛淹没。除挪亚一家外，所有的人都死了。而如今，全人类的一切族类都是从挪亚一家而出（<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/9/#L19">创 9:19</a>）。挪亚生了闪、含、雅弗：</p><blockquote><p>“挪亚五百岁生了闪、含、雅弗。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/5/#L32">创 5:32</a>)</p></blockquote><blockquote><p>“挪亚生了三个儿子，就是闪、含、雅弗。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/6/#L10">创 6:10</a>)</p></blockquote><blockquote><p>“正当那日，挪亚和他三个儿子闪、含、雅弗，并挪亚的妻子和三个儿妇，都进入方舟。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/7/#L13">创 7:13</a>)</p></blockquote><blockquote><p>“出方舟挪亚的儿子就是闪、含、雅弗。含是迦南的父亲。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/9/#L18">创 9:18</a>)</p></blockquote><p>含的后裔：</p><blockquote><p>“含的儿子是：古实、麦西、弗、迦南。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/10/#L6">创 10:6</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/1par/1/#L8">代上 1:8</a>)</p></blockquote><p><strong>古实</strong>——埃塞俄比亚（黑色人种）；<strong>麦西</strong>——埃及（浅黑色人种）；<strong>弗</strong>——利比亚（白色人种）；<strong>迦南</strong>——肥沃新月地带的西部（非黑色人种），挪亚所咒诅的正是他（<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/9/#L25,27">创 9:25,27</a>）。此外，苏美尔人（非黑色人种）也是出于古实的后裔（宁录——<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/10/#L8">创 10:8</a>）。<a href="https://www.youtube.com/watch?v=JPGyRZqSZkY">详细解析</a></p><p><strong>注</strong>：亚当的儿子们娶了自己的姊妹为妻。要遵行上帝生养众多的诫命，此外别无他路。而且，挪亚的孙辈也处在类似的处境中：洪水之后，地上所有的人都是至近的亲属。近亲通婚要到很久之后，在先知摩西的时代才被禁止。犹太民族正是出自一对兄妹——亚伯拉罕和撒拉（<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/20/#L12">创 20:12</a>）。此外，本文尚需完善：需要描述圣经中关于各族与各民族先祖的资料。</p>
