- src: образование
  path: QR5A_教育
  title: 教育
  copy_cover: true
  body: <blockquote><p>“我儿，从你幼年时起，<strong>就应接受教训</strong>；如此，直到老年，<strong>必能寻得智慧</strong>。你要亲近她，就如耕田和播种的人，等待她的美果；因为，你用智慧去工作，用功不久，很快就可吃她的出产。<strong>智慧为不肯受教的人，是酸苦的</strong>；愚昧的人，不会与智慧常久相处，因为，智慧有如放在愚昧人身上的重石，他决不会迟延抛弃她。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/6/#L18-22">德 6:18-22</a>)</p></blockquote><blockquote><p>“说：「<strong><mark>你们愚昧人喜爱愚昧，亵慢人喜欢亵慢，愚顽人恨恶知识，要到几时呢</mark></strong>？ &lt;…&gt; <strong><mark>愚昧人背道，必杀己身；愚顽人安逸，必害己命</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/1/#L22,32">箴 1:22,32</a>)</p></blockquote><blockquote><p>“行为纯正的贫穷人，胜过乖谬<strong>愚妄</strong>的富足人。 心无知识的，乃为不善；脚步急快的，难免犯罪。 <strong><mark>人的愚昧倾败他的道</mark></strong>，他的心也抱怨耶和华。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/19/#L1-3">箴 19:1-3</a>)</p></blockquote><blockquote><p>“<strong><mark>得着智慧的，爱惜生命</mark></strong>；保守聪明的，必得好处。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/19/#L8">箴 19:8</a>)</p></blockquote><blockquote><p>“我经过懒惰人的田地、<strong><mark>无知人</mark></strong>的葡萄园， <strong><mark>荆棘长满了地皮</mark></strong>，刺草遮盖了田面，石墙也坍塌了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/24/#L30-31">箴 24:30-31</a>)</p></blockquote><blockquote><p>“<strong><mark>你要谨慎自己和自己的教训，要在这些事上恒心</mark></strong>。因为这样行，又能救自己，又能救听你的人。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/4/#L16">提前 4:16</a>)</p></blockquote><blockquote><p>“<strong><mark>你们民间的畜类人当思想</mark></strong>；<strong><mark>你们愚顽人</mark></strong>到几时才有智慧呢？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/94/#L8">诗 94:8</a>)</p></blockquote><blockquote><p>“喜爱管教的，就是喜爱知识；<strong><mark>恨恶责备的，却是畜类</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/12/#L1">箴 12:1</a>)</p></blockquote><blockquote><p>“<strong><mark>愚昧人背道，必杀己身；愚顽人安逸，必害己命</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/1/#L32">箴 1:32</a>)</p></blockquote><blockquote><p>“<strong><mark>愚蒙人得愚昧为产业</mark></strong>；通达人得知识为冠冕。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/14/#L18">箴 14:18</a>)</p></blockquote><blockquote><p>“智慧人的财，为自己的冠冕；<strong><mark>愚妄人的愚昧，终是愚昧</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/14/#L24">箴 14:24</a>)</p></blockquote><blockquote><p>“<strong>谎言</strong>为人是一种可恶的污点，<strong>然而常在无知人的口里</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/20/#L26">德 20:26</a>) <em>(俄文本为 Сир 20:24。)</em></p></blockquote><blockquote><p>“<strong>智慧的真起点，是切愿受教</strong>；<strong>切愿受教就是爱</strong>；爱即在于遵守法律；遵守法律，便是不朽的保证；不朽使人亲近天主；” (<a href="https://bibleox.com/zh-Hans/cn-sb/prs/6/#L18-20">智 6:18-20</a>)</p></blockquote><blockquote><p>“从前雅尼和佯庇怎样敌挡摩西，<strong><mark>这等人也怎样敌挡真道</mark></strong>。他们的心地坏了，<strong><mark>在真道上是可废弃的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/3/#L8">提后 3:8</a>)</p></blockquote><blockquote><p>“他一切的信上也都是讲论这事。信中有些难明白的，<strong><mark>那无学问、不坚固的人强解</mark></strong>，如强解别的经书一样，<strong><mark>就自取沉沦</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2pet/3/#L16">彼后 3:16</a>)</p></blockquote>
