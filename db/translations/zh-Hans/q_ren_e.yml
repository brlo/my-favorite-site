  title: 基督徒——上帝的仆人
  copy_cover: true
  body: <p>基督徒称自己为上帝的仆人，因为他们力求遵行基督——上帝——的旨意。基督徒事奉基督，是他的仆人，把自己的意志服从于他，而且这是自愿做的。基督是这样的主：作他的仆人并不可耻。作世界创造者的仆人同样并不可耻。而在基督徒所追求的基督的国里，作万王之王的顺命仆人更是光荣的：</p><blockquote><p>“<strong><mark>主人来了，看见仆人儆醒，那仆人就有福了</mark></strong>。我实在告诉你们：主人必叫他们坐席，自己束上带，<strong>进前伺候他们</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/12/#L37">路 12:37</a>)</p></blockquote><h2>基督吩咐人称自己为他的仆人</h2><blockquote><p>“这样，你们作完了一切所吩咐的，只当说：『<strong><mark>我们是无用的仆人</mark></strong>，所作的本是我们应分作的。』」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/17/#L10">路 17:10</a>)</p></blockquote><blockquote><p>“<strong>你们称呼我</strong>夫子，<strong><mark>称呼我主</mark></strong>，<strong><mark>你们说的不错，我本来是</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/13/#L13">约 13:13</a>)</p></blockquote><blockquote><p>“你们要记念我从前对你们所说的话：『<strong><mark>仆人不能大于主人</mark></strong>。』他们若逼迫了我，也要逼迫你们；若遵守了我的话，也要遵守你们的话。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/15/#L20">约 15:20</a>)</p></blockquote><h2>使徒们吩咐作基督的仆人</h2><blockquote><p>“不要只在眼前事奉，像是讨人喜欢的，<strong><mark>要像基督的仆人</mark></strong>，<strong><mark>从心里遵行上帝的旨意</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/6/#L6">弗 6:6</a>)</p></blockquote><blockquote><p>“因为<strong><mark>作奴仆蒙召于主的</mark></strong>，就是主所释放的人；作自由之人蒙召的，就是<strong><mark>基督的奴仆</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/7/#L22">林前 7:22</a>)</p></blockquote><blockquote><p>“你们虽是自由的，却不可借着自由遮盖恶毒，<strong><mark>总要作上帝的仆人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/2/#L16">彼前 2:16</a>)</p></blockquote><h2>使徒们称自己为基督的仆人</h2><blockquote><p>“我现在是要得人的心呢？还是要得上帝的心呢？我岂是讨人的喜欢吗？若仍旧讨人的喜欢，<strong><mark>我就不是基督的仆人了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/1/#L10">加 1:10</a>)</p></blockquote><blockquote><p>“<strong><mark>上帝的仆人、耶稣基督的使徒保罗</mark></strong>，凭着上帝选民的信心与敬虔真理的知识，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/tit/1/#L1">多 1:1</a>)</p></blockquote><blockquote><p>“<strong><mark>耶稣基督的仆人，雅各的弟兄犹大</mark></strong>，写信给那被召，在父上帝里蒙爱、为耶稣基督保守的人：” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iud/1/#L1">犹 1:1</a>)</p></blockquote><blockquote><p>“<strong><mark>作上帝和主耶稣基督仆人的雅各</mark></strong>，请散住十二个支派之人的安。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/1/#L1">雅 1:1</a>)</p></blockquote><blockquote><p>“<strong><mark>作耶稣基督仆人和使徒的西门彼得</mark></strong>，写信给那因我们的上帝和救主耶稣基督之义，与我们同得一样宝贵信心的人：” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2pet/1/#L1">彼后 1:1</a>)</p></blockquote><blockquote><p>“<strong><mark>耶稣基督的仆人保罗</mark></strong>，奉召为使徒，特派传上帝的福音。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/1/#L1">罗 1:1</a>)</p></blockquote><blockquote><p>“有你们那里的人，<strong><mark>作基督耶稣仆人的以巴弗</mark></strong>问你们安。他在祷告之间，常为你们竭力的祈求，愿你们在上帝一切的旨意上得以完全，信心充足，能站立得稳。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/4/#L12">西 4:12</a>)</p></blockquote><h2>上帝之母称自己为上帝的婢女</h2><blockquote><p>“马利亚说：「<strong><mark>我是主的使女</mark></strong>，情愿照你的话成就在我身上。」天使就离开她去了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/1/#L38">路 1:38</a>)</p></blockquote><h2>在旧约里，上帝称信徒为仆人</h2><blockquote><p>“<strong><mark>我的仆人</mark></strong>因心中高兴欢呼，你们却因心中忧愁哀哭，又因心里忧伤哀号。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/65/#L14">赛 65:14</a>)</p></blockquote><blockquote><p>“我必从雅各中领出后裔，从犹大中领出承受我众山的。我的选民必承受；<strong><mark>我的仆人要在那里居住</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/65/#L9">赛 65:9</a>)</p></blockquote><h2>先知和信徒称自己为上帝的仆人</h2><blockquote><p>“因为，<strong>我是你的仆人</strong>，是<strong>你婢女的儿子</strong>，是病弱短命，对正义与法律绝少认识的人。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prs/9/#L5">智 9:5</a>)</p></blockquote><blockquote><p>“我回答他们说：「天上的上帝必使我们亨通。<strong><mark>我们作他仆人的</mark></strong>，要起来建造；你们却在耶路撒冷无分、无权、无记念。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/neem/2/#L20">尼 2:20</a>)</p></blockquote><blockquote><p>“<strong><mark>这都是你的仆人、你的百姓</mark></strong>，就是你用大力和大能的手所救赎的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/neem/1/#L10">尼 1:10</a>)</p></blockquote><blockquote><p>“许愿说：「万军之耶和华啊，你若垂顾<strong><mark>婢女的苦情</mark></strong>，<strong><mark>眷念不忘婢女</mark></strong>，赐我一个儿子，我必使他终身归与耶和华，不用剃头刀剃他的头。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1ts/1/#L11">撒上 1:11</a>)</p></blockquote><blockquote><p>“<strong>上主的众仆人</strong>，请赞美上主，歌颂称扬他，直到永远！” (<a href="https://bibleox.com/zh-Hans/cn-sb/dan/3/#L85">但 3:85</a>)</p></blockquote><blockquote><p>“他们回答说：「我们是那创造天地的上主的仆人。」” (<a href="https://bibleox.com/zh-Hans/ru/2ezd/6/#L13">厄三 6:13</a>, 俄文原文无中文经文，此处自译)</p></blockquote><h2>也曾有爱自己的主人的奴仆</h2><blockquote><p>“你任他自由的时候，不可使他空手而去。 &lt;…&gt; 他若对你说：『<strong><mark>我不愿意离开你</mark></strong>』，<strong><mark>是因他爱你和你的家</mark></strong>，且因在你那里很好。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/15/#L13,16">申 15:13,16</a>)</p></blockquote>
