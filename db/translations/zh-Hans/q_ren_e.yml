- src: 3QXG_Одежда
  path: QR13A_服装
  title: 服装
  copy_cover: true
  body: <p>关于衣服，旧约中有这样的禁令：</p><blockquote><p>“<strong><mark>妇女不可穿戴男子所穿戴的；男子也不可穿妇女的衣服</mark></strong>，因为这样行都是耶和华你上帝所憎恶的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/22/#L5">申 22:5</a>)</p></blockquote><p>显然，这一禁令是针对<a href="https://bibleox.com/ru/ru/w/XBGN_Трансвестизм">性倒错</a>而设的——即人刻意追求使自己看起来像异性、处于某种不正常状态的情形。</p><p><hr></p><p>新约中有关于蒙头的话：</p><blockquote><p>“<strong><mark>凡女人祷告或是讲道，若不蒙着头</mark></strong>，就羞辱自己的头．因为这就如同剃了头发一样。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/11/#L5">林前 11:5</a>) <em>(原文希腊文 γυνή 既可指「妻子」，也可指「女人」。)</em></p></blockquote><p>在现代社会，为妇女设计了各式各样的服装，包括女式裤子，但教会传统中形成了关于信友外表的既定规则（外表应当朴实端庄）：建议妇女穿裙子、蒙头来圣殿，尽量少用化妆品；对男子则建议穿适度遮蔽的服装（短裤和背心不适合在圣殿里穿）。这样做，是为了在上帝面前显得整洁（内心的秩序并不排除外表的秩序），也是为了不以刺眼的装束分散来到圣殿祈祷的近人的注意力。</p><p>妇女若在生活中遵守这一传统有困难，有时会随身带一条头巾或类似的东西，在进入圣殿前把它蒙在头发上。</p><p>有时，某些信友对破坏这一传统的人反应不当——这些人并非蓄意违规，只是不知道这一传统，进圣殿来想了解或祈祷。对这样的信友应当解释，请他们不要吓着、赶走这样的人，更不要对他们无礼。</p>
