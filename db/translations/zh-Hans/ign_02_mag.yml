    title: 致马格尼西亚人书
    meta_desc: 安提阿的圣伊格那丢（提阿弗罗斯）写给马格尼西亚教会的书信。译自希腊文原文，附注释。
    menu: { parent: "书信", title: "致马格尼西亚人书", priority: 2 }
    body: |-
      <h2>0</h2><p>伊格那丢，又名提阿弗罗斯，致在米安得河畔的马格尼西亚的教会：这教会在我们的救主基督耶稣里，在父上帝的恩典中蒙福。我在祂里面问候这教会，并愿你们在父上帝和耶稣基督里满得喜乐。</p>
      <h2>1</h2><p>1. 我得知你们按着上帝而有的爱井然有序，就满心欢喜，决定在对耶稣基督的信中与你们交谈。</p><p>2. 我既蒙赐一个最配得上帝的名[1]，就在我所带的锁链中歌颂众教会，并祈求在众教会中，有耶稣基督——我们永远的生命——的肉身与灵的合一，有无可比拟的信与爱的合一，更有最为要紧的耶稣与父的合一。</p><p>3. 我们在祂里面若忍受这世代之王的一切欺凌，并且逃脱，就必得着上帝。</p>
      <h2>2</h2><p>我已蒙准许借着你们配得上帝的主教达马斯、配得的司祭巴苏斯和阿波罗尼乌斯，以及我的同作仆人的辅祭左提翁，见到了你们。愿我因左提翁得喜乐，因为他顺服主教如同顺服上帝的恩典，顺服司祭团如同顺服耶稣基督的律法。</p>
      <h2>3</h2><p>1. 你们也不应当因主教年轻而轻慢他[2]，而要按着父上帝的大能，向他表示一切尊敬。据我所知，圣洁的司祭们也没有利用他表面上的年轻，而是作为在上帝里有智慧的人顺服他——其实不是顺服他，而是顺服耶稣基督的父、万人的主教。</p><p>2. 所以，为了那愿意我们（得救）者的尊荣，我们理当毫无虚伪地听从。因为欺骗这位看得见的主教的人，其实是在欺哄那看不见的一位[3]。在这种事上，所关乎的不是肉身，而是那知道隐秘之事的上帝。</p>
      <h2>4</h2><p>所以，我们不但应当被称为基督徒，也应当真是基督徒。有些人口里称主教，却撇开他行一切事。在我看来，这样的人良心不正，因为他们没有按照诫命确实地聚会[4]。</p>
      <h2>5</h2><p>1. 万事都有终结，死和生两样同时摆在我们面前，各人都要往自己的地方去。</p><p>2. 正如有两种钱币，一种是上帝的，一种是世界的，各有其印记；不信的人带着这世界的印记，信的人在爱中带着父上帝借着耶稣基督而有的印记。我们若不借着祂甘心情愿地死，进入祂的受难，祂的生命就不在我们里面[5]。</p>
      <h2>6</h2><p>1. 我既在上面提到的那些人身上，在信中看见并爱了你们全体，就劝勉你们：要努力在上帝的同心中行一切事；主教居首位代表上帝，司祭们代表使徒的议会，而我最亲爱的辅祭们则受托为耶稣基督服务。祂在万世以先就与父同在，在末世显现了。</p><p>2. 所以，你们众人都要领受上帝的心性，彼此尊重；谁也不要按着肉身看待邻舍，而要在耶稣基督里常常彼此相爱。在你们中间不可有任何能使你们分裂的事，而要与主教和那些居首位的人合而为一，作为不朽坏的标记和教导[6]。</p>
      <h2>7</h2><p>1. 主与父合而为一，无论是亲自还是借着使徒，离了父就什么也没有做[7]；照样，你们离了主教和司祭们，也什么都不要做。也不要设法使你们私下所做的事显得合理[8]，而要聚集在一处：一个祷告，一个祈求，一个心思，在爱中、在无瑕的喜乐中有一个盼望。这喜乐就是耶稣基督，没有什么比祂更好。</p><p>2. 你们众人都要像奔向同一座上帝的殿、奔向同一个祭坛那样，奔向同一位耶稣基督：祂从独一的父而出，与独一者同在，又归回独一者。</p>
      <h2>8</h2><p>1. 不要被异端的教训和古老无益的荒唐故事所迷惑[9]。因为我们若直到如今还照着犹太教生活，就是承认自己没有领受恩典。</p><p>2. 那些最神圣的先知都是按着基督耶稣生活的，所以他们也受了逼迫。他们受祂恩典的感动，使不顺从的人确信：上帝只有一位，祂借着祂的儿子耶稣基督显明了自己。这儿子是从静默中发出的祂的道[10]，在一切事上都蒙那差祂来者的喜悦。</p>
      <h2>9</h2><p>1. 那些在旧的规矩中生活过的人，既进入了新的盼望，不再守安息日，而按着主日[11]生活——在主日，我们的生命也借着祂和祂的死升起来了；有些人否认这死，但我们借着这奥秘领受了信，并且为此忍耐，好被看为我们唯一的老师耶稣基督的门徒——</p><p>2. 那么，我们离了祂怎能生活呢？连先知们在灵里也是祂的门徒，期待祂作他们的老师。因此，他们所正当等候的那一位，来到时就使他们从死人中复活了[12]。</p>
      <h2>10</h2><p>1. 所以，我们不可对祂的恩慈麻木不仁。因为祂若照我们所行的对待我们[13]，我们就不复存在了。所以，我们既作了祂的门徒，就要学习按照基督教[14]生活。凡被别的名而不是被这名称呼的人，就不是属上帝的。</p><p>2. 所以，要除去那已经陈旧变酸的坏酵，而变成新酵，就是耶稣基督[15]。要在祂里面用盐调和，免得你们中间有人败坏，因为你们必从气味上被识别出来。</p><p>3. 口称耶稣基督，却照犹太教生活，是荒谬的。因为不是基督教信了犹太教，而是犹太教信了基督教；一切信上帝的语言的人都被聚集到基督教里来了[16]。</p>
      <h2>11</h2><p>我亲爱的，我写这些事，不是因为我知道你们中间有人这样，而是因为我比你们更微小，愿意预先保护你们，免得你们落入虚荣的鱼钩；而要对那在本丢彼拉多任总督时所发生的降生、受难和复活充满确信。这些事是我们的盼望耶稣基督真实而确定地成就的；愿你们中间没有人偏离这盼望。</p>
      <h2>12</h2><p>如果我配得，愿我在一切事上因你们得喜乐。我虽然被捆绑，却比不上你们中间那些自由的任何一位。我知道你们不自高自大，因为你们里面有耶稣基督；我越称赞你们，就越知道你们会感到羞愧，正如经上所记：“义人是自己的控告者。”[17]</p>
      <h2>13</h2><p>1. 所以，你们要努力在主和使徒们的教导上坚定，好使你们所做的一切，在肉身和灵性上，在信和爱上，在子、父和圣灵里，在开始和终结时都得顺利；与你们最可敬的主教，与你们的司祭团这顶编织精美的属灵冠冕，以及按着上帝所立的辅祭们一同如此。</p><p>2. 要顺服主教，也要彼此顺服，如同耶稣基督顺服父，使徒们顺服基督和父，好使合一既是肉身的，也是属灵的[18]。</p>
      <h2>14</h2><p>我知道你们充满了上帝，所以简短地劝勉你们。请你们在祷告中记念我，使我得着上帝；也记念叙利亚的教会——我不配被称为那教会的人。我需要你们在上帝里合一的祷告和爱，好使叙利亚的教会配得借着你们的教会受到滋润。</p>
      <h2>15</h2><p>以弗所人[19]为了上帝的荣耀来到士每拿，他们问候你们；我也是从士每拿写信给你们的。他们和你们一样，连同士每拿人的主教坡旅甲，在各样事上使我得到安慰。其余的教会也在耶稣基督的尊荣中问候你们。愿你们在上帝的同心中安好，拥有那不可分离的灵——就是耶稣基督。</p>
    references: |-
      <ol><li><p>θεοπρεπέστατον ὄνομα。一般认为是指为基督被捆绑、走向殉道之人的光荣称号；也有人理解为“承载上帝者”（提阿弗罗斯）这个名字。</p></li><li><p>νεωτερικὴ τάξις，意为“年轻（外表上的年轻）”，指马格尼西亚的主教达马斯年轻（参见<a href="https://bibleox.com/zh-Hans/cn-sb/1tim/4/#L12">弟前 4:12</a>）。也有学者理解为主教职是新近的制度。</p></li><li><p>看不见的主教就是父上帝（3:1“万人的主教”）。</p></li><li><p>指撇开主教和司祭们另外聚会。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/rim/6/#L3-5">罗 6:3-5</a>。</p></li><li><p>一般理解为：与主教的合一，既映照出不朽坏的生命，也把这生命教导给人。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/in/5/#L19">若 5:19</a>、<a href="https://bibleox.com/zh-Hans/cn-sb/in/5/#L30">5:30</a>、<a href="https://bibleox.com/zh-Hans/cn-sb/in/8/#L28">若 8:28</a>。</p></li><li><p>指离开主教和司祭们的另外的聚会。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/1tim/1/#L4">弟前 1:4</a>、<a href="https://bibleox.com/zh-Hans/cn-sb/1tim/4/#L7">4:7</a>、<a href="https://bibleox.com/zh-Hans/cn-sb/tit/1/#L14">铎 1:14</a>。</p></li><li><p>λόγος ἀπὸ σιγῆς προελθών，意思是：在上帝永恒的静默之后，祂的道显现于世（参见<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4E_致以弗所人书#HH-19">《致以弗所人书》19:1</a>、<a href="https://bibleox.com/zh-Hans/cn-sb/rim/16/#L25-26">罗 16:25-26</a>）。后期抄本（俄文译本随从它）作“祂永恒的道，不是从静默中发出的”（λόγος ἀΐδιος οὐκ ἀπὸ σιγῆς προελθών）。一般认为，这是因为诺斯替派把“静默”（西革）当作一个神性的存在，为免混淆而改动的。</p></li><li><p>κυριακή，主日，即星期日（<a href="https://bibleox.com/zh-Hans/cn-sb/otkr/1/#L10">默 1:10</a>）。有些抄本作“按着主的生命生活”（κατὰ κυριακὴν ζωήν）。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/mf/27/#L52-53">玛 27:52-53</a>。</p></li><li><p>直译为“祂若照我们所行的效法我们”，意思是：祂若按我们的罪报应我们（参见<a href="https://bibleox.com/zh-Hans/cn-sb/ps/130/#L3">咏 130:3</a>）。</p></li><li><p>Χριστιανισμός。在现存文献中，“基督教”一词最早见于伊格那丢的书信（参见<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4R_致罗马人书#HH-3">《致罗马人书》3:3</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4F_致非拉铁非人书#HH-6">《致非拉铁非人书》6:1</a>）。关于“基督徒”这个称呼，参见<a href="https://bibleox.com/zh-Hans/cn-sb/act/11/#L26">宗 11:26</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/1kor/5/#L7-8">格前 5:7-8</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/is/66/#L18">依 66:18</a>。</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-sb/pr/18/#L17">箴 18:17</a>（按七十士译本；思高本译自希伯来文，措辞不同）。</p></li><li><p>外在的合一与内在的合一（参见<a href="https://bibleox.com/zh-Hans/cn-sb/ef/4/#L4">弗 4:4</a>）。</p></li><li><p>为伊格那丢来到士每拿的以弗所基督徒（参见<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4E_致以弗所人书#HH-1">《致以弗所人书》1:3</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4E_致以弗所人书#HH-2">《致以弗所人书》2:1</a>）。</p></li></ol>
      <p>翻译：罗季翁·弗拉索夫（借助人工智能工具）。底本：希腊文原文（<a href="https://bibleox.com/zh-Hans/grc/w/ΙγνΘ_Μαγ">本站的希腊文版本</a>，明显的脱漏据莱特福特本和霍姆斯本补足）。参考：俄文译本（《早期教父文选》，布鲁塞尔，1988年）、英文译本（Roberts–Donaldson）、法文译本（Genoude，1837年）。圣经链接指向本站的思高本。</p>
