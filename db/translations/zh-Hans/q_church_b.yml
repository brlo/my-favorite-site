  path: Qc9A_十字架
  title: 十字架
  copy_cover: true
  body: <h2>十字架在旧约中的预表</h2><ol><li><p>基督十字架的祭献的预表——亚伯拉罕与以撒：<a href="https://bibleox.com/ru/ru/w/прообраз-крестной-жертвы-Авраам-и-Исаак">详见</a></p></li><li><p>十字架——摩西：<a href="https://bibleox.com/ru/ru/w/крест-Моисей">详见</a></p></li><li><p>十字架——以色列的营阵：<a href="https://bibleox.com/ru/ru/w/еврейский-стан-крест">详见</a></p></li><li><p>十字架与洗礼——过海：<a href="https://bibleox.com/ru/ru/w/крест-и-крещение-переход-через-море">详见</a></p></li><li><p>十字架——雅各的祝福：<a href="https://bibleox.com/ru/ru/w/крест-Иаков">详见</a></p></li><li><p>十字架——预言异象中信者额上的 Tau 字母：<a href="https://bibleox.com/ru/ru/w/EMRx_Крест__буква_тау">详见</a></p></li></ol><h2>十字架——得胜与和好的工具</h2><blockquote><p>“你们从前在过犯和未受割礼的肉体中死了，上帝赦免了你们一切过犯，便叫你们与基督一同活过来； 又涂抹了在律例上所写攻击我们、有碍于我们的字据，把他撤去，<strong>钉在十字架上</strong>。 既将一切执政的、掌权的掳来，明显给众人看，就<strong>仗着十字架夸胜</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/2/#L13-15">西 2:13-15</a>)</p></blockquote><blockquote><p>“<strong>既在十字架上灭了冤仇</strong>，便藉这十字架<strong>使两下归为一体</strong>，与上帝和好了，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/2/#L16">弗 2:16</a>)</p></blockquote><blockquote><p>“既然<strong>借着他在十字架上所流的血成就了和平</strong>，便借着他叫万有，无论是地上的、天上的，都与自己和好了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/1/#L20">西 1:20</a>)</p></blockquote><h2>十字架——祭坛，至圣的圣物</h2><p>主耶稣基督把自己作为祭物献在十字架——这祭坛——上：</p><blockquote><p>“<strong>基督既然一次被献</strong>，担当了多人的罪，将来要向那等候他的人第二次显现，并与罪无关，乃是为拯救他们。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/9/#L28">希 9:28</a>)</p></blockquote><p>旧约中基督十字架祭献的预表——献以撒——证实了这一点。亚伯拉罕（父）把以撒（他的独子）献为祭：</p><blockquote><p>“上帝说：你带着<strong>你的儿子，就是你独生的儿子</strong>，你所爱的以撒，往摩利亚地去，在我所要指示你的山上，<strong>把他献为燔祭</strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/22/#L2">创 22:2</a>)</p></blockquote><blockquote><p>“上帝爱世人，甚至<strong>将他的独生子赐给</strong>他们，叫一切信他的，不至灭亡，反得永生。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/3/#L16">约 3:16</a>)</p></blockquote><p>以撒把祭献要在其上进行的物件背到山上：</p><blockquote><p>“亚伯拉罕<strong>把燔祭的柴放在他儿子以撒身上</strong>，自己手里拿着火与刀，于是二人同行。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/22/#L6">创 22:6</a>)</p></blockquote><blockquote><p>“于是彼拉多将耶稣交给他们去钉十字架。 他们就把耶稣带了去。<strong>耶稣背着自己的十字架出来</strong>，到了一个地方，名叫髑髅地（希伯来话叫各各他）。 他们就在那里钉他在十字架上，还有两个人和他一同钉着，一边一个，耶稣在中间。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/19/#L16-18">约 19:16-18</a>)</p></blockquote><h3>亚伯拉罕把以撒放在祭坛上</h3><blockquote><p>“我们的祖宗亚伯拉罕<strong>把他儿子以撒献在坛上</strong>，岂不是因行为称义吗？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/2/#L21">雅 2:21</a>)</p></blockquote><blockquote><p>“他既按着上帝的定旨、先见被交与人，你们就借着无法之人的手，<strong>把他钉在十字架上杀了</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/2/#L23">徒 2:23</a>)</p></blockquote><p>在十字架——这祭坛上——成就了人类的救恩：</p><blockquote><p>“<strong>既在十字架上灭了冤仇</strong>，便藉这十字架<strong>使两下归为一体</strong>，与上帝和好了，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/2/#L16">弗 2:16</a>)</p></blockquote><h3>祭坛——至圣的圣物</h3><blockquote><p>“<strong>坛就成为至圣，凡挨着坛的都成为圣</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L37">出 29:37</a>)</p></blockquote><h2>福音</h2><blockquote><p>“耶稣看着他，就爱他，对他说：「你还缺少一件，去变卖你所有的，分给穷人，就必有财宝在天上；<strong>你还要来跟从我</strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/10/#L21">可 10:21</a>) <em>(俄文原文有“背起十字架来跟从我”，和合本无)</em></p></blockquote><blockquote><p>“于是叫众人和门徒来，对他们说：「若有人要跟从我，就当舍己，<strong>背起他的十字架来跟从我</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/8/#L34">可 8:34</a>)</p></blockquote><blockquote><p>“<strong>不背着他的十字架跟从我的</strong>，也不配作我的门徒。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/10/#L38">太 10:38</a>)</p></blockquote><blockquote><p>“于是，耶稣对门徒说：「若有人要跟从我，就当舍己，<strong>背起他的十字架来跟从我</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/16/#L24">太 16:24</a>)</p></blockquote><blockquote><p>“耶稣又对众人说：「若有人要跟从我，就当舍己，<strong>天天背起他的十字架来跟从我</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/9/#L23">路 9:23</a>)</p></blockquote><blockquote><p>“<strong>凡不背着自己十字架跟从我的</strong>，也不能作我的门徒。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/14/#L27">路 14:27</a>)</p></blockquote><blockquote><p>“「你这拆毁圣殿，三日又建造起来的，可以救自己吧！你如果是上帝的儿子，<strong>就从十字架上下来吧</strong>！」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/27/#L40">太 27:40</a>)</p></blockquote><blockquote><p>“「他救了别人，不能救自己。他是以色列的王，<strong>现在可以从十字架上下来</strong>，我们就信他。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/27/#L42">太 27:42</a>)</p></blockquote><blockquote><p>“可以救自己，<strong>从十字架上下来吧</strong>！」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/15/#L30">可 15:30</a>)</p></blockquote><blockquote><p>“以色列的王基督，<strong>现在可以从十字架上下来</strong>，叫我们看见，就信了！」那和他同钉的人也是讥诮他。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/15/#L32">可 15:32</a>)</p></blockquote><h2>使徒</h2><blockquote><p>“仰望为我们信心创始成终的耶稣。他因那摆在前面的喜乐，就轻看羞辱，<strong>忍受了十字架</strong>的苦难，便坐在上帝宝座的右边。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/12/#L2">希 12:2</a>)</p></blockquote><blockquote><p>“但我断不以别的夸口，<strong>只夸我们主耶稣基督的十字架</strong>。因这十字架，就我而论，世界已经钉在十字架上；就世界而论，我已经钉在十字架上。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/6/#L14">加 6:14</a>)</p></blockquote><blockquote><p>“基督差遣我，原不是为施洗，乃是为传福音，并不用智慧的言语，<strong>免得基督的十字架落了空</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/1/#L17">林前 1:17</a>)</p></blockquote><blockquote><p>“<strong>因为十字架的道理，在那灭亡的人为愚拙</strong>；在我们得救的人却为上帝的大能。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/1/#L18">林前 1:18</a>)</p></blockquote><blockquote><p>“凡希图外貌体面的人，都勉强你们受割礼，无非是<strong>怕自己为基督的十字架受逼迫</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/6/#L12">加 6:12</a>)</p></blockquote><blockquote><p>“弟兄们，我若仍旧传割礼，为什么还受逼迫呢？若是这样，<strong>那十字架讨厌的地方就没有了</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/5/#L11">加 5:11</a>)</p></blockquote><blockquote><p>“<strong>既在十字架上灭了冤仇</strong>，便藉这十字架<strong>使两下归为一体</strong>，与上帝和好了，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/2/#L16">弗 2:16</a>)</p></blockquote><blockquote><p>“因为有许多人<strong>行事是基督十字架的仇敌</strong>。我屡次告诉你们，现在又流泪的告诉你们：” (<a href="https://bibleox.com/zh-Hans/cn-cuv/fil/3/#L18">腓 3:18</a>)</p></blockquote><blockquote><p>“既然<strong>借着他在十字架上所流的血成就了和平</strong>，便借着他叫万有，无论是地上的、天上的，都与自己和好了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/1/#L20">西 1:20</a>)</p></blockquote><blockquote><p>“又涂抹了在律例上所写攻击我们、有碍于我们的字据，把他撤去，<strong>钉在十字架上</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/2/#L14">西 2:14</a>)</p></blockquote>
