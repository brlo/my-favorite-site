  path: Qc3A_教会——看得见的合一
  title: 教会——看得见的合一
  copy_cover: true
  body: <h2>前言</h2><p>首先要指出的是：圣经里没有任何一个建立自己“教会”、自立为牧人的例子，也没有任何这样的依据。基督建立了一个看得见的教会，并表达了关于她合一的旨意。</p><h2>基督和使徒关于教会看得见之合一的旨意</h2><blockquote><p>“我不但为这些人<strong><mark>祈求</mark></strong>，也为那些因他们的话信我的人祈求， <strong><mark>使他们都合而为一</mark></strong>；正如你父在我里面，我在你里面，使他们也在我们里面，<strong><mark>叫世人可以信你差了我来</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/17/#L20-21">约 17:20-21</a>)</p></blockquote><blockquote><p>“弟兄们，我藉我们主耶稣基督的名，<strong><mark>劝你们</mark></strong><strong><mark>都说一样的话</mark></strong>。你们中间也<strong><mark>不可分党</mark></strong>，只要<strong><mark>一心一意</mark></strong>，<strong><mark>彼此相合</mark></strong>。 因为革来氏家里的人曾对我提起弟兄们来，说<strong>你们中间有纷争</strong>。 我的意思就是你们各人说：『我是属保罗的』，『我是属亚波罗的』，『我是属矶法的』，『我是属基督的』。 <strong>基督是分开的吗</strong>？保罗为你们钉了十字架吗？你们是奉保罗的名受了洗吗？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/1/#L10-13">林前 1:10-13</a>)</p></blockquote><blockquote><p>“有说：「我是属保罗的。」有说：「我是属亚波罗的。」<strong><mark>这岂不是你们和世人一样吗</mark></strong>？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/3/#L4">林前 3:4</a>)</p></blockquote><p>上帝安置身体（教会）的肢体，为使身体没有分裂，而是彼此相顾，同受苦，同快乐：</p><blockquote><p>“我们不拘是犹太人，是希利尼人，是为奴的，是自主的，<strong>都从一位圣灵受洗，成了一个身体</strong>，饮于一位圣灵。 <strong><mark>身子原不是一个肢体，乃是许多肢体</mark></strong>。 &lt;…&gt; <strong><mark>眼不能对手说</mark></strong>：「我用不着你。」头也不能对脚说：「我用不着你。」 不但如此，身上肢体，人以为软弱的，更是不可少的。 身上肢体，我们看为不体面的，越发给它加上体面；不俊美的，越发得着俊美。 我们俊美的肢体，自然用不着装饰；但<strong><mark>上帝配搭这身子</mark></strong>，把加倍的体面给那有缺欠的肢体， <strong><mark>免得身上分门别类</mark></strong>，<strong><mark>总要肢体彼此相顾</mark></strong>。 <strong><mark>若一个肢体受苦，所有的肢体就一同受苦</mark></strong>；若一个肢体得荣耀，所有的肢体就一同快乐。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/12/#L13-14,21-26">林前 12:13-14,21-26</a>)</p></blockquote><p>这些不同的肢体是什么？——就是教会里各种不同的事奉和恩赐：</p><blockquote><p>“<strong>就如身子是一个，却有许多肢体</strong>；而且肢体虽多，仍是一个身子。基督也是这样。 &lt;…&gt; <strong><mark>身子原不是一个肢体，乃是许多肢体</mark></strong>。 &lt;…&gt; <strong><mark>你们就是基督的身子</mark></strong>，并且各自作肢体。 <strong><mark>上帝在教会所设立的</mark></strong>：第一是<strong>使徒</strong>，第二是<strong>先知</strong>，第三是<strong>教师</strong>，其次是<strong>行异能的</strong>，再次是得恩赐<strong>医病的</strong>，帮助人的，治理事的，<strong>说方言的</strong>。 岂都是使徒吗？岂都是先知吗？岂都是教师吗？岂都是行异能的吗？ 岂都是得恩赐医病的吗？岂都是说方言的吗？岂都是<strong>繙方言的</strong>吗？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/12/#L12,14,27-30">林前 12:12,14,27-30</a>)</p></blockquote><p>这样，上帝安置这一切的事奉和恩赐，为使身体没有分裂；使徒在书信开头就防止了分裂（<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/1/#L10-13">林前 1:10-13</a>）。也就是说，上帝不但愿意合一（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/17/#L20-21">约 17:20-21</a>），而且亲自照顾这合一。看，使徒被上帝立为仆人，维护看得见的合一，禁止哥林多人制造看得见的分裂。</p><p>既然合一是基督的旨意，就要明白：得救的是遵行上帝旨意的人（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/7/#L21">太 7:21</a>）。</p><h2>敌基督的违背基督的旨意，明显走出教会的边界</h2><p>敌基督的从使徒的团体中出去：</p><blockquote><p>“小子们哪，如今是末时了。你们曾听见说，那敌基督的要来，<strong><mark>现在已经有好些敌基督的出来了</mark></strong>，从此我们就知道如今是末时了。 <strong><mark>他们从我们中间出去，却不是属我们的</mark></strong>；若是属我们的，就必仍旧与我们同在；他们出去显明都不是属我们的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/2/#L18-19">约壹 2:18-19</a>)</p></blockquote><p>他们服事的是<strong>不</strong>是基督：</p><blockquote><p>“弟兄们，那些<strong><mark>离间你们、叫你们跌倒</mark></strong>、背乎所学之道的人，我劝你们要留意躲避他们。 因为这样的人<strong><mark>不服事我们的主基督</mark></strong>，只服事自己的肚腹，用花言巧语诱惑那些老实人的心。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/16/#L17-18">罗 16:17-18</a>)</p></blockquote><h2>教会起初看得见的合一</h2><h3>外人——另立一旁</h3><p>教会在起初就有完全确定的看得见的边界：</p><blockquote><p>“<strong>其余的人</strong>没有一个敢贴近他们，百姓却尊重他们。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/5/#L13">徒 5:13</a>)</p></blockquote><h3>共同的财物</h3><p>教会当时是一个一体的团体：</p><blockquote><p>“那许多信的人都是<strong>一心一意</strong>的，没有一人说他的东西有一样是自己的，<strong>都是大家公用</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/4/#L32">徒 4:32</a>)</p></blockquote><h3>共同解决有争议的问题</h3><p>教会有共同的问题，并且一同解决，聚集在完全确定的、看得见的会议上：</p><blockquote><p>“<strong>使徒和长老，聚会商议这事</strong>。 &lt;…&gt; 那时，<strong>使徒和长老并全教会定意</strong>从他们中间拣选人，差他们和保罗、巴拿巴同往安提阿去。所拣选的就是称呼巴撒巴的犹大和西拉；这两个人在弟兄中是作首领的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/15/#L6,22">徒 15:6,22</a>)</p></blockquote><h3>共同的规矩</h3><p>教会有确定的、大家共同的规矩：</p><blockquote><p>“他们<strong>经过各城</strong>，<strong>把耶路撒冷使徒和长老所定的条规交给门徒遵守</strong>。 于是众教会信心越发坚固，人数天天加增。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/16/#L4-5">徒 16:4-5</a>)</p></blockquote><h3>禁止分门别类</h3><p>在教会里，任何分裂的企图都被制止：</p><blockquote><p>“弟兄们，我藉我们主耶稣基督的名，<strong><mark>劝你们</mark></strong><strong><mark>都说一样的话</mark></strong>。你们中间也<strong><mark>不可分党</mark></strong>，只要<strong><mark>一心一意</mark></strong>，<strong><mark>彼此相合</mark></strong>。 因为革来氏家里的人曾对我提起弟兄们来，说你们中间有纷争。 我的意思就是你们各人说：『我是属保罗的』，『我是属亚波罗的』，『我是属矶法的』，『我是属基督的』。 基督是分开的吗？保罗为你们钉了十字架吗？你们是奉保罗的名受了洗吗？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/1/#L10-13">林前 1:10-13</a>)</p></blockquote><h3>一个信仰和圣奥秘</h3><p>在教会里只有一个确定的、大家共同的信仰：</p><blockquote><p>“一主，<strong>一信</strong>，一洗，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/4/#L5">弗 4:5</a>)</p></blockquote><blockquote><p>“凡<strong>越过</strong><strong><mark>基督的教训</mark></strong><strong>不常守着的，就没有上帝</strong>；<strong>常守这教训的</strong>，就有父又有子。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2in/1/#L9">约贰 1:9</a>)</p></blockquote><p>如救主所说：这信仰是按使徒的话：</p><blockquote><p>“我不但为这些人祈求，也为那些<strong>因他们的话</strong>信我的人祈求，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/17/#L20">约 17:20</a>)</p></blockquote><p>教会知道，将来会出现想离开这唯一信仰的人。这些人不能被称为教会：</p><blockquote><p>“他们曾对你们说过：『末世必有好讥诮的人随从自己不敬虔的私欲而行。』 这就是那些<strong>引人结党</strong>、属乎血气、没有圣灵的人。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iud/1/#L18-19">犹 1:18-19</a>)</p></blockquote><h3>一个司祭的等次</h3><blockquote><p>“请教会的长老来。 他们来了，保罗就说：「你们知道，自从我到亚西亚的日子以来，在你们中间始终为人如何， &lt;…&gt; <strong><mark>圣灵立你们作全群的监督</mark></strong>，你们就当为自己谨慎，也为全群谨慎，<strong>牧养上帝的教会</strong>，就是他用自己血所买来的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/20/#L17-18,28">徒 20:17-18,28</a>)</p></blockquote><p>关于司祭职，详见<a href="https://bibleox.com/ru/ru/w/Таинство-Священства">司祭圣奥秘</a>。</p><p>---</p><p>这样，教会是一个完全确定的看得见的团体（机体），有唯一一个共同的使徒信仰，有大家共同的规矩，有使徒所立的、在一切事上合一的带领者；教会的肢体之间没有任何阻隔。</p><h2>教会的边界与圣餐礼</h2><p>旧约的教会不像新约的教会那样被称为基督的身体。新约的教会是一个奥秘的神人机体，是<a href="https://bibleox.com/ru/ru/w/Церковь">基督的身体</a>。所以，教会的边界就在身体的边界。人的身体的边界在哪里？血液流通的地方就是身体；不流通的地方就不是身体。人身体的部分没有血就没有生命。被切下来的手已经不是身体的一部分。很快，得不到血的供应，它就会腐烂。哪里有真实的领受圣体，哪里就有身体，也就是教会：</p><blockquote><p>“我们所祝福的杯，岂不是<strong>同领基督的血</strong>吗？我们所擘开的饼，岂不是<strong>同领基督的身体</strong>吗？ <strong>我们虽多，仍是一个饼、一个身体，因为我们都是分受这一个饼</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/10/#L16-17">林前 10:16-17</a>)</p></blockquote><blockquote><p>“<strong>你们就是基督的身子</strong>，并且各自作肢体。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/12/#L27">林前 12:27</a>)</p></blockquote><blockquote><p>“你们从前远离上帝的人，如今却在基督耶稣里，<strong><mark>靠着他的血，已经得亲近了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/2/#L13">弗 2:13</a>)</p></blockquote><p>所以，救恩只在教会里，因为基督是<a href="https://bibleox.com/ru/ru/w/Церковь">身体的救主，也就是教会的救主</a>：</p><blockquote><p>“因为丈夫是妻子的头，如同<strong>基督是教会的头</strong>，他又是<strong>教会全体的救主</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/5/#L23">弗 5:23</a>)</p></blockquote><p>关于圣餐礼，详见<a href="https://bibleox.com/ru/ru/w/Евхаристия">圣餐礼</a>。</p><p><strong>圣殉道者、安提阿主教伊格那提（一世纪）</strong>，《致士每拿人书》（[俄文](https://azbyka.ru/otechnik/Ignatij_Antiohijskij/poslanie-k-smirnjanam/)）：</p><p>“第八章。凡属于教会的事，一概不要不经主教而行。……<strong>只有主教所举行的圣餐，或他所准许的人所举行的，才当视为确实有效</strong>。”</p>
