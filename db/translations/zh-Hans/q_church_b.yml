- src: 4mHQbC7A_Церкви_изначально_дана_полнота_истины
  path: Qc5A_教会起初就领受了真理的充实
  title: 教会起初就领受了真理的充实
  copy_cover: true
  body: <h2>真信仰已经一次交付给教会</h2><blockquote><p>“亲爱的弟兄啊，我想尽心写信给你们，论我们同得救恩的时候，就不得不写信劝你们，要<strong>为从前</strong><strong><mark>一次</mark></strong><strong>交付圣徒的真道竭力的争辩</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iud/1/#L3">犹 1:3</a>)</p></blockquote><blockquote><p>“论到你们，<strong><mark>务要将那从起初所听见的常存在心里</mark></strong>。<strong><mark>若将从起初所听见的存在心里</mark></strong>，你们就必住在子里面，也必住在父里面。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/2/#L24">约壹 2:24</a>)</p></blockquote><p>所以教会被称为丰盛（充实）：</p><blockquote><p>“又将万有服在他的脚下，使他为<strong>教会</strong>作万有之首。 教会是他的身体，是那<strong><mark>充满万有者所充满的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/1/#L22-23">弗 1:22-23</a>)</p></blockquote><p>教会维护这真理：</p><blockquote><p>“永生上帝的教会，<strong><mark>真理的柱石和根基</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/3/#L15">提前 3:15</a>)</p></blockquote><h2>真信仰是基督上帝亲自、明明地赐下的</h2><p>这信仰是基督从父领受并传下来的：</p><blockquote><p>“因为<strong><mark>你所赐给我的道，我已经赐给他们</mark></strong>，他们也领受了；又确实知道我是从你出来的，并且信你差了我来。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/17/#L8">约 17:8</a>)</p></blockquote><p>应当常在的，正是基督所教导的信仰：</p><blockquote><p>“凡越过基督的教训不常守着的，就没有上帝；<strong>常守这教训的</strong>，就有父又有子。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2in/1/#L9">约贰 1:9</a>)</p></blockquote><h2>不可教导别的</h2><blockquote><p>“我往马其顿去的时候，曾劝你仍住在以弗所，好嘱咐那几个人<strong><mark>不可传异教</mark></strong>， 也不可听从荒渺无凭的话语和无穷的家谱。这等事只生辩论，并不发明上帝在信上所立的章程。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/1/#L3-4">提前 1:3-4</a>)</p></blockquote><blockquote><p>“<strong><mark>你在许多见证人面前听见我所教训的</mark></strong>，<strong><mark>也要交托那忠心能教导别人的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/2/#L2">提后 2:2</a>)</p></blockquote><blockquote><p>“我称赞你们，因你们凡事记念我，又<strong><mark>坚守我所传给你们的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/11/#L2">林前 11:2</a>)</p></blockquote><blockquote><p>“弟兄们，我如今把先前所传给你们的福音，告诉你们知道。这福音你们也领受了，又靠着站立得住； 并且你们若不是徒然相信，<strong><mark>能以持守我所传给你们的</mark></strong>，就必因这福音得救。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/15/#L1-2">林前 15:1-2</a>)</p></blockquote><blockquote><p>“弟兄们，我还有话说：我们靠着主耶稣求你们、劝你们，<strong><mark>你们既然受了我们的教训</mark></strong>，知道该怎样行，可以讨上帝的喜悦，就要照你们现在所行的，<strong><mark>更加勉励</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1sol/4/#L1">帖前 4:1</a>)</p></blockquote><blockquote><p>“所以弟兄们，你们要站立得稳，<strong><mark>凡所领受的教训，不拘是我们口传的，是信上写的，都要坚守</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2sol/2/#L15">帖后 2:15</a>)</p></blockquote><h2>会有人试图歪曲一次所赐的信仰</h2><blockquote><p>“坚守所教真实的道理，就能将纯正的教训劝化人，又能把争辩的人驳倒了。 因为<strong><mark>有许多人不服约束</mark></strong>，说虚空话欺哄人，那奉割礼的更是这样。 这些人的口总要堵住。他们因贪不义之财，将不该教导的教导人，败坏人的全家。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/tit/1/#L9-11">多 1:9-11</a>)</p></blockquote><blockquote><p>“我只怕你们的心或偏于邪，失去那向基督所存纯一清洁的心，就像蛇用诡诈诱惑了夏娃一样。 假如有人来<strong><mark>另传一个耶稣</mark></strong>，不是我们所传过的，或者你们另受一个灵，不是你们所受过的；或者<strong><mark>另得一个福音</mark></strong>，不是你们所得过的，你们容让他也就罢了。 &lt;…&gt; 那等人是假使徒，行事诡诈，装作基督使徒的模样。 这也不足为怪，因为连撒但也装作光明的天使。 所以，他的差役若装作仁义的差役，也不算希奇。他们的结局必然照着他们的行为。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/11/#L3-4,13-15">林后 11:3-4,13-15</a>)</p></blockquote><h2>要远离教导新信仰的人，不可接受基督所留下的信仰以外的教导</h2><blockquote><p>“<strong>若有人传异教</strong>，不服从我们主耶稣基督纯正的话与那合乎敬虔的道理， <strong>他是自高自大，一无所知</strong>，专好问难，争辩言词，从此就生出嫉妒、纷争、毁谤、妄疑， 并那坏了心术、失丧真理之人的争竞。他们以敬虔为得利的门路。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/6/#L3-5">提前 6:3-5</a>) <em>(俄文原文6:5末有“要远离这样的人”一句，和合本无)</em></p></blockquote><blockquote><p>“提摩太啊，你要<strong>保守所托付你的</strong>，<strong><mark>躲避世俗的虚谈</mark></strong>和那敌真道、似是而非的学问。 已经有人自称有这学问，就偏离了真道。愿恩惠常与你们同在。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/6/#L20-21">提前 6:20-21</a>)</p></blockquote><blockquote><p>“弟兄们，我们奉主耶稣基督的名吩咐你们：凡有弟兄不按规矩而行，不遵守从我们所受的教训，<strong><mark>就当远离他</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2sol/3/#L6">帖后 3:6</a>)</p></blockquote><blockquote><p>“弟兄们，那些离间你们、叫你们跌倒、背乎所学之道的人，我劝你们要<strong><mark>留意躲避他们</mark></strong>。 因为这样的人不服事我们的主基督，只服事自己的肚腹，用花言巧语诱惑那些老实人的心。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/16/#L17-18">罗 16:17-18</a>)</p></blockquote><blockquote><p>“若有人到你们那里，不是传这教训，<strong><mark>不要接他到家里</mark></strong>，也不要问他的安。 因为问他安的就在他的恶行上有分。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2in/1/#L10-11">约贰 1:10-11</a>)</p></blockquote><blockquote><p>“但无论是我们，是天上来的使者，若传福音给你们，与我们所传给你们的不同，<strong><mark>他就应当被咒诅</mark></strong>。 我们已经说了，现在又说：若有人传福音给你们，与你们所领受的不同，<strong><mark>他就应当被咒诅</mark></strong>！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/1/#L8-9">加 1:8-9</a>)</p></blockquote><p><strong>绝罚</strong>（希腊文 ἀνάθεμα）——逐出教会。</p><h2>责备对圣传的歪曲（异端）</h2><blockquote><p>“有些人你们要<strong>从火中抢出来、搭救他们</strong>；有些人你们要存惧怕的心怜悯他们；连那被情欲沾染的衣服也当厌恶。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iud/1/#L23">犹 1:23</a>) <em>(俄文原文此节有“要责备”一词，和合本无)</em></p></blockquote><blockquote><p>“那暗昧无益的事，不要与人同行，<strong>倒要责备</strong>行这事的人。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/5/#L11">弗 5:11</a>)</p></blockquote><blockquote><p>“坚守所教真实的道理，就能将纯正的教训劝化人，又能把争辩的人<strong><mark>驳倒</mark></strong>了。 因为有许多人不服约束，说虚空话欺哄人，那奉割礼的更是这样。 这些人的口总要<strong>堵住</strong>。他们因贪不义之财，将不该教导的教导人，败坏人的全家。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/tit/1/#L9-11">多 1:9-11</a>)</p></blockquote><blockquote><p>“<strong>至死要为真理奋斗</strong>，上主天主必要助你作战。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/4/#L33">德 4:33</a>)</p></blockquote><blockquote><p>“亲爱的弟兄啊，我想尽心写信给你们，论我们同得救恩的时候，就不得不写信劝你们，要<strong>为从前</strong><strong><mark>一次</mark></strong><strong>交付圣徒的真道竭力的争辩</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iud/1/#L3">犹 1:3</a>)</p></blockquote><h2>真理的圣灵要引导明白的</h2><p>在差遣圣灵之前、圣灵降在使徒身上之前，基督应许说：当圣灵被差到使徒那里时，他要帮助他们记起并明白基督对他们说过的一切：</p><blockquote><p>“但保惠师，就是父因我的名所要差来的圣灵，他要将一切的事指教你们，并且要<strong><mark>叫你们想起我对你们所说的一切话</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/14/#L26">约 14:26</a>)</p></blockquote><blockquote><p>“我还有好些事要告诉你们，<strong><mark>但你们现在担当不了</mark></strong>。 只等真理的圣灵来了，<strong><mark>他要引导你们明白</mark></strong><strong><mark>一切的真理</mark></strong>，因为他不是凭自己说的，乃是把他所听见的都说出来，并要把将来的事告诉你们。 他要荣耀我，因为<strong><mark>他要将受于我的告诉你们</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/16/#L12-14">约 16:12-14</a>)</p></blockquote>
