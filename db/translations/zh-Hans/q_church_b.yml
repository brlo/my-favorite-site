- src: церковь-новый-израиль
  path: Qc8A_教会——新的以色列
  title: 教会——新的以色列
  copy_cover: true
  body: <h2>基督是教会的根</h2><blockquote><p>“你们既然接受了<strong><mark>主基督耶稣</mark></strong>，就当遵他而行； <strong><mark>在他里面</mark></strong><strong><mark>生根建造</mark></strong>，信心坚固，正如你们所领的教训，感谢的心也更增长了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/2/#L6-7">西 2:6-7</a>)</p></blockquote><blockquote><p>“<strong><mark>我耶稣</mark></strong>差遣我的使者为众教会将这些事向你们证明。<strong><mark>我是大卫的根</mark></strong>，又是他的后裔。我是明亮的晨星。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/22/#L16">启 22:16</a>)</p></blockquote><h3>基督也是喂养枝子的葡萄树</h3><blockquote><p>“<strong><mark>我是真葡萄树</mark></strong>，我父是栽培的人。 凡属我不结果子的枝子，他就剪去；凡结果子的，他就修理干净，使枝子结果子更多。 现在你们因我讲给你们的道，已经干净了。 <strong>你们要常在我里面</strong>，我也常在你们里面。枝子若不常在葡萄树上，自己就不能结果子；你们若不常在我里面，也是这样。 <strong><mark>我是葡萄树，你们是枝子</mark></strong>，常在我里面的，我也常在他里面，这人就多结果子；因为离了我，你们就不能作什么。 <strong>人若不常在我里面，就像枝子丢在外面枯干</strong>，人拾起来，扔在火里烧了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/15/#L1-6">约 15:1-6</a>)</p></blockquote><h3>基督也是教会的头</h3><blockquote><p>“<strong><mark>他也是教会全体之首</mark></strong>，他是元始，是从死里首先复生的，使他可以在凡事上居首位。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/1/#L18">西 1:18</a>)</p></blockquote><blockquote><p>“又将万有服在他的脚下，使他<strong><mark>为教会作万有之首</mark></strong>。 <strong>教会是他的身体</strong>，是那充满万有者所充满的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/1/#L22-23">弗 1:22-23</a>)</p></blockquote><blockquote><p>“<strong><mark>不持定元首</mark></strong>。全身既然靠着他，筋节得以相助联络，就因上帝大得长进。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/2/#L19">西 2:19</a>)</p></blockquote><h2>以色列的一部分（枝子）从基督（根）上折断了</h2><p>以色列的一部分折断了，而外邦各族被接在根（基督）上。被折下的犹太人不被称为根上折下的部分，而被称为折下的枝子：</p><blockquote><p>“所献的新面若是圣洁，全团也就圣洁了；树根若是圣洁，树枝也就圣洁了。 若<strong><mark>有几根枝子被折下来</mark></strong>，<strong>你这野橄榄得接在其中</strong>，<strong><mark>一同得着橄榄根的肥汁</mark></strong>， 你就不可向旧枝子夸口；若是夸口，当知道不是你托着根，乃是根托着你。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/11/#L16-18">罗 11:16-18</a>)</p></blockquote><blockquote><p>“又有以赛亚放胆说：『<strong><mark>没有寻找我的，我叫他们遇见</mark></strong>；没有访问我的，我向他们显现。』 <strong><mark>至于以色列人</mark></strong>，他说：『<strong><mark>我整天伸手招呼那悖逆顶嘴的百姓</mark></strong>。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/10/#L20-21">罗 10:20-21</a>)</p></blockquote><blockquote><p>“我且说，上帝弃绝了他的百姓吗？<strong>断乎没有</strong>！<strong>因为我也是以色列人</strong>，亚伯拉罕的后裔，属便雅悯支派的。 &lt;…&gt; 上帝的回话是怎么说的呢？他说：『<strong>我为自己留下七千人，是未曾向巴力屈膝的</strong>。』 如今也是这样，照着拣选的恩典，<strong><mark>还有所留的余数</mark></strong>。 &lt;…&gt; 这是怎么样呢？以色列人所求的，他们没有得着，<strong><mark>惟有蒙拣选的人得着了，其余的就成了顽梗不化的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/11/#L1,4-5,7">罗 11:1,4-5,7</a>)</p></blockquote><h2>在折下的枝子（以色列的一部分）的位置上，新的枝子（其余的万民）接在根上</h2><blockquote><p>“但耶书仑渐渐肥胖、粗壮，光润，踢跳奔跑，<strong>便离弃造他的上帝</strong>，轻看救他的磐石。 敬拜别神，触动上帝的愤恨，行可憎恶的事，惹了他的怒气。 所祭祀的鬼魔，并非真神，乃是素不认识的神，是近来新兴的，是你列祖所不畏惧的。 <strong>你轻忽生你的磐石</strong>；忘记产你的上帝。 耶和华看见他的儿女惹动他，就厌恶他们； 说：「<strong><mark>我要向他们掩面</mark></strong>，看他们的结局如何；他们本是极乖僻的族类，心中无诚实的儿女。 他们以那不算为神的触动我的愤恨；以虚无的神惹了我的怒气。<strong><mark>我也要以那不成子民的</mark></strong>触动他们的愤恨；以愚昧的国民惹了他们的怒气。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/32/#L15-21">申 32:15-21</a>)</p></blockquote><blockquote><p>“耶和华说：「<strong>日子将到</strong>，我要与以色列家和犹大家<strong><mark>另立新约</mark></strong>。 <strong><mark>不像我拉着他们祖宗的手</mark></strong>，领他们出埃及地的时候，与他们所立的约。我虽作他们的丈夫，<strong><mark>他们却背了我的约</mark></strong>。」这是耶和华说的。 耶和华说：「那些日子以后，我与以色列家所立的约乃是这样：<strong>我要将我的律法放在他们里面，写在他们心上</strong>。<strong>我要作他们的上帝，他们要作我的子民</strong>。 他们各人不再教导自己的邻舍和自己的弟兄说：『你该认识耶和华。』因为他们从最小的到至大的，都必认识我。我要赦免他们的罪孽，不再记念他们的罪恶。」这是耶和华说的。 那使太阳白日发光，使星月有定例，黑夜发亮，又搅动大海，使海中波浪匉訇的－万军之耶和华是他的名。他如此说： 「这些定例若能在我面前废掉，以色列的后裔也就在我面前断绝，永远不再成国。」这是耶和华说的。 耶和华如此说：「若能量度上天，寻察下地的根基，我就因以色列后裔一切所行的弃绝他们。」这是耶和华说的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ier/31/#L31-37">耶 31:31-37</a>)</p></blockquote><blockquote><p>“所献的新面若是圣洁，全团也就圣洁了；树根若是圣洁，树枝也就圣洁了。 若有几根枝子被折下来，<strong><mark>你这野橄榄得接在其中</mark></strong>，<strong><mark>一同得着橄榄根的肥汁</mark></strong>， 你就不可向旧枝子夸口；若是夸口，当知道不是你托着根，乃是根托着你。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/11/#L16-18">罗 11:16-18</a>)</p></blockquote><blockquote><p>“「素来没有访问我的，现在求问我没有寻找我的，我叫他们遇见；<strong><mark>没有称为我名下的，我对他们说</mark></strong>：『<strong><mark>我在这里！我在这里！</mark></strong>』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/65/#L1">赛 65:1</a>)</p></blockquote><blockquote><p>“我必将他种在这地。<strong>素不蒙怜悯的，我必怜悯</strong>；<strong><mark>本非我民的</mark></strong>，我必对他说：『你是我的民。』他必说：『你是我的上帝。』」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/os/2/#L23">何 2:23</a>)</p></blockquote><blockquote><p>“这器皿就是我们被上帝所召的，<strong><mark>不但是从犹太人中，也是从外邦人中</mark></strong>。这有什么不可呢？ <strong>就像上帝在何西阿书上说</strong>：『<strong><mark>那本来不是我子民的</mark></strong>，我要称为『我的子民』；<strong><mark>本来不是蒙爱的</mark></strong>，我要称为『蒙爱的』。 从前在什么地方对他们说，『你们不是我的子民』，将来就在那里称他们为『<strong><mark>永生上帝的儿子</mark></strong>』。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/9/#L24-26">罗 9:24-26</a>)</p></blockquote><h2>在教会里，民族已不再有意义</h2><p>使徒在罗马书 11:16-18 消除了一种极端：对犹太人的轻视和自高。另一种极端则是在他们面前屈膝。中间的道路是：在教会里没有民族之分，在那里人人彼此都是弟兄；凡加入教会的人，无论民族、无论上帝安排他在哪里由谁出生，也都成为弟兄：</p><blockquote><p>“在此并不分<strong><mark>希利尼人、犹太人</mark></strong>、受割礼的、未受割礼的、<strong><mark>化外人</mark></strong>、<strong><mark>西古提人</mark></strong>、<strong>为奴的、自主的</strong>，惟有基督是包括一切，又住在各人之内。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/3/#L11">西 3:11</a>)</p></blockquote><h2>在教会里，犹太人和外邦人之间<strong>毫无</strong>分别</h2><blockquote><p>“辩论已经多了，彼得就起来说：「诸位弟兄，你们知道上帝早已在你们中间拣选了我，叫外邦人从我口中得听福音之道，而且相信。 知道人心的上帝也为他们作了见证，赐圣灵给他们，正如给我们一样； 又借着信洁净了他们的心，并<strong><mark>不分他们、我们</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/15/#L7-9">徒 15:7-9</a>)</p></blockquote><blockquote><p>“你们从前远离上帝的人，如今却在基督耶稣里，靠着他的血，已经得亲近了。 因他使我们和睦，<strong><mark>将两下合而为一</mark></strong>，拆毁了中间隔断的墙， <strong>而且以自己的身体废掉冤仇</strong>，就是那记在律法上的规条，<strong><mark>为要将两下借着自己造成一个新人</mark></strong>，如此便成就了和睦。 既在十字架上灭了冤仇，便藉这十字架<strong><mark>使两下归为一体</mark></strong>，与上帝和好了， &lt;…&gt; 因为我们两下借着他被一个圣灵所感，<strong><mark>得以进到父面前</mark></strong>。 &lt;…&gt; 并且被建造在使徒和先知的根基上，<strong>有基督耶稣自己为房角石</strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/2/#L13-16,18,20">弗 2:13-16,18,20</a>)</p></blockquote><h2>以色列民被拣选，是为了救主临到世界。这一目的已经达成。</h2><p><a href="https://bibleox.com/ru/ru/w/ветхий-завет#HH-Обещание-пришествия-Спасителя">旧约——救主来临的应许</a></p><h2>亚伯拉罕的子孙——就是信徒</h2><blockquote><p>“正如『亚伯拉罕信上帝，这就算为他的义』。 所以你们要知道，<strong><mark>那以信为本的人，就是亚伯拉罕的子孙</mark></strong>。 并且圣经既然预先看明，上帝要叫外邦人因信称义，就早已传福音给亚伯拉罕，说，『<strong>万国</strong>都必因你得福。』 <strong>可见那以信为本的人和有信心的亚伯拉罕一同得福</strong>。 <strong>凡以行律法为本的，都是被咒诅的</strong>，因为经上记着：『凡不常照律法书上所记一切之事去行的，就被咒诅。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/3/#L6-10">加 3:6-10</a>)</p></blockquote><h2>犹太人——是在里面（属灵上）是犹太人，而不是在外面</h2><blockquote><p>“因为<strong>外面作犹太人的，不是真犹太人</strong>；外面肉身的割礼，也不是真割礼。 <strong><mark>惟有里面作的，才是真犹太人</mark></strong>；真割礼也是心里的，在乎灵，不在乎仪文。这人的称赞不是从人来的，乃是从上帝来的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/2/#L28-29">罗 2:28-29</a>)</p></blockquote><blockquote><p>“<strong><mark>受割礼</mark></strong><strong><mark>不受割礼</mark></strong>都无关紧要，要紧的就是作新造的人。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/6/#L15">加 6:15</a>)</p></blockquote><h2>关于新约司祭职的预言：从<strong>一切</strong>民族中</h2><p>在旧约的教会里，司祭只从犹太民族中立，从利未支派、亚伦的家系中立。但在新约的教会里，司祭将从一切民族中立，而不只是从犹太人（亚伦的家系）中：</p><blockquote><p>“「我知道他们的行为和他们的意念。时候将到，<strong><mark>我必将万民万族</mark></strong>聚来，看见我的荣耀。 我要显神迹在他们中间，逃脱的我要差到列国去，就是到他施、普勒、拉弓的路德和土巴、雅完，并<strong>素来没有听见我名声</strong>、没有看见我荣耀辽远的海岛，他们必将我的荣耀传扬在列国中。 他们必将你们的弟兄从列国中送回，使他们或骑马，或坐车，坐轿，骑骡子，骑独峰驼，到我的圣山耶路撒冷，作为供物献给耶和华，好像以色列人用洁净的器皿盛供物奉到耶和华的殿中。」这是耶和华说的。 耶和华说：「<strong><mark>我也必从他们中间取人为祭司，为利未人</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/66/#L18-21">赛 66:18-21</a>)</p></blockquote>
