  path: QR14A_灵魂不朽
  title: 灵魂不朽
  copy_cover: true
  body: <h2>身体与灵魂</h2><h3>逼迫者不能杀死灵魂</h3><p>主耶稣基督说不要怕逼迫者，因为他们只能杀死身体，却不能杀死灵魂，不能伤害灵魂。否认灵魂死后存在的人声称，灵魂与身体一同死亡，如此则逼迫者杀死的不只是身体，也是灵魂——但这与基督的话相矛盾：</p><blockquote><p>“<strong>那杀身体</strong><strong><mark>不能杀灵魂的</mark></strong>，不要怕他们；惟有能把身体和灵魂都灭在地狱里的，正要怕他。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/10/#L28">太 10:28</a>)</p></blockquote><blockquote><p>“我的朋友，我对你们说：<strong><mark>那杀身体以后不能再作什么的，不要怕他们</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/12/#L4">路 12:4</a>)</p></blockquote><h3>已死的先知摩西的灵魂在大博尔山显现</h3><p>救主在大博尔山显圣容的时刻，使徒们看见了已经死去的先知摩西显现，正与基督谈论他即将面临的十字架苦难。也就是说，先知虽然死了（<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/34/#L7">申 34:7</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/nav/1/#L2">书 1:2</a>）（见<a href="#HH-上帝复活了先知摩西">下文注释</a>），却没有消失，也没有失去知觉：他正<strong>与基督交谈</strong>：</p><blockquote><p>“忽然，有<strong><mark>摩西</mark></strong>，以利亚向他们显现，<strong><mark>同耶稣说话</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/17/#L3">太 17:3</a>)</p></blockquote><blockquote><p>“正祷告的时候，他的面貌就改变了，衣服洁白放光。 <strong><mark>忽然有摩西、以利亚两个人同耶稣说话</mark></strong>； 他们在荣光里显现，<strong><mark>谈论耶稣去世的事</mark></strong>，就是他在耶路撒冷将要成的事。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/9/#L29-31">路 9:29-31</a>)</p></blockquote><h3>使徒论死后的生命</h3><p>使徒保罗说，当地上的帐幕（身体）拆毁时，我们有天上永存的房屋：</p><blockquote><p>“我们原知道，<strong><mark>我们这地上的帐棚若拆毁了</mark></strong>，<strong><mark>必得上帝所造，不是人手所造，在天上永存的房屋</mark></strong>。 &lt;…&gt; 我们在这帐棚里叹息劳苦，<strong><mark>并非愿意脱下这个，乃是愿意穿上那个</mark></strong>，好叫这必死的被生命吞灭了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/5/#L1,4">林后 5:1,4</a>)</p></blockquote><p><hr></p><p>在另一处——或许是最重要的一处——使徒写道，他情愿快些死去，以便明确地进入与上帝同在的生命，他称死亡为「益处」。如果使徒死后就消失或沉睡，那他什么也没有获得，只是失去（知觉）。那样的话，急忙去死、去进入无所作为的状态就没有任何意义了。更合理的做法是：活着、传道、建立教会、与上帝相通、帮助教会（<strong>尽可能长久地不撇下教会</strong>——这是灵魂不朽学说的反对者们一贯忽略的主要思想），住在地上的身体里。但使徒知道自己将进入天上与上帝同在的生命，所以情愿快些脱离身体中的地上生命：</p><blockquote><p>“因我活着就是基督，<strong><mark>我死了就有益处</mark></strong>。 但我在肉身活着，若成就我工夫的果子，我就不知道该挑选什么。 我正在两难之间，<strong><mark>情愿离世与基督同在，因为这是好得无比的</mark></strong>。 然而，我在肉身活着，为你们更是要紧的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/fil/1/#L21-24">腓 1:21-24</a>)</p></blockquote><p>*否认灵魂死后存在的人，通常忽略所提注释中的论据，而说：「使徒不会察觉睡梦中飞逝的时间，会立刻在复活中与基督一同醒来」。然而，如果使徒并不是立刻进入与基督同在的生命，而只是进入无知觉的无所作为，那么，当使徒紧接着明明写道住在肉身中更是要紧的时候，急忙<strong>撇下教会</strong>就没有任何意义了。</p><p><hr></p><p>使徒出离身体时，相信他会到主那里，因此再次表示宁愿离开身体。他指出，无论是住在身内还是离开身外，重要的是蒙上帝喜悦：</p><blockquote><p>“所以，我们时常坦然无惧，并且晓得<strong><mark>我们住在身内，便与主相离</mark></strong>。 &lt;…&gt; 我们坦然无惧，是<strong><mark>更愿意离开身体</mark></strong>与主同住。 所以，无论是住在身内，离开身外，我们立了志向，要得主的喜悦。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/5/#L6,8-9">林后 5:6,8-9</a>)</p></blockquote><p>使徒住在身体里，如同住在圣殿中（<a href="https://bibleox.com/ru/ru/w/человек-храм-Божий">人——上帝的殿</a>），但不久他必须离开身体：</p><blockquote><p>“我以为应当<strong><mark>趁我还在这帐棚的时候</mark></strong>提醒你们，激发你们。 因为知道<strong><mark>我脱离这帐棚的时候快到了</mark></strong>，正如我们主耶稣基督所指示我的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2pet/1/#L13-14">彼后 1:13-14</a>)</p></blockquote><p>使徒写道，他曾被提到天上——或是在身内，或是在身外：</p><blockquote><p>“我认得一个在基督里的人，他前十四年被提到第三层天上去。<strong><mark>或在身内，我不知道，或在身外，我也不知道</mark></strong>，只有上帝知道。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/12/#L2">林后 12:2</a>)</p></blockquote><p>使徒指出灵魂的永恒性：</p><blockquote><p>“所以，我们不丧胆。<strong><mark>外体虽然毁坏，内心却一天新似一天</mark></strong>。 &lt;…&gt; 原来我们不是顾念所见的，乃是顾念所不见的；因为所见的是暂时的，<strong><mark>所不见的是永远的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/4/#L16,18">林后 4:16,18</a>)</p></blockquote><h3>受审判的是活<strong>在身体里</strong>时所做的行为，而不是身体之外的行为</h3><p>上帝所要审判的，只是人在身体中活着时所做的事：</p><blockquote><p>“因为我们众人必要在基督台前显露出来，叫各人<strong><mark>按着本身所行的</mark></strong>，或善或恶受报。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/5/#L10">林后 5:10</a>)</p></blockquote><h3>旧约的记述</h3><p>认为人的死不仅是身体的毁灭、也是灵魂的毁灭，这种想法是不正确的：</p><blockquote><p>“<strong>恶人们胡思乱想自语说</strong>：“我们的生命又短促，又多愁；人的死期一到，又没有办法补救，也从不见有人从阴府回来。我们原是偶然而生，过后我们又好像未曾生存过；我们鼻中的气息只是一阵烟雾，思想亦不过是心动迸出的火花；<strong>火花一旦熄灭，身躯即变成灰土，魂魄即像轻风消散</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prs/2/#L1-3">智 2:1-3</a>)</p></blockquote><p>同时：</p><blockquote><p>“<strong>邪曲的思想，使人离开天主</strong>；愚人试探全能者，只有使自己蒙羞，” (<a href="https://bibleox.com/zh-Hans/cn-sb/prs/1/#L3">智 1:3</a>)</p></blockquote><blockquote><p>“<strong>义人的灵魂在天主手里</strong>，痛苦不能伤害他们。<strong>在愚人看来，他们算是死了</strong>，认为他们去世是受了惩罚，<strong>离我们而去，仿佛是归于泯灭</strong>；其实，<strong>他们是处于安宁中</strong>；” (<a href="https://bibleox.com/zh-Hans/cn-sb/prs/3/#L1-3">智 3:1-3</a>)</p></blockquote><h2>对否认死后生命的撒都该人的驳斥</h2><p>在所有犹太党派（法利赛人、撒都该人、艾赛尼人等）中，只有一派——撒都该人——相信人死后归于消失（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/23/#L8">徒 23:8</a>）。主严厉地驳斥他们，指责他们的谬误和不明白圣经：</p><blockquote><p>“耶稣回答说：「<strong><mark>你们错了，因为不明白圣经，也不晓得上帝的大能</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/22/#L29">太 22:29</a>)</p></blockquote><blockquote><p>“<strong><mark>上帝不是死人的上帝，乃是活人的上帝</mark></strong>。<strong><mark>你们是大错了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/12/#L27">可 12:27</a>)</p></blockquote><h2>耶稣基督的人性灵魂</h2><p>主耶稣基督死后，他的灵魂下到了阴间：</p><blockquote><p>“因为<strong><mark>你必不将我的灵魂撇在阴间</mark></strong>，也不叫你的圣者见朽坏。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/16/#L10">诗 16:10</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/act/2/#L27">徒 2:27</a>)</p></blockquote><blockquote><p>“就预先看明这事，讲论基督复活说：『<strong><mark>他的灵魂不撇在阴间</mark></strong>；他的肉身也不见朽坏。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/2/#L31">徒 2:31</a>)</p></blockquote><p>在阴间，基督向那些从世界洪水时代起就在那里的神魂（灵魂）宣讲：</p><blockquote><p>“因基督也曾一次为罪受苦，就是义的代替不义的，为要引我们到上帝面前。<strong><mark>按着肉体说，他被治死；按着灵性说，他复活了</mark></strong>。 <strong><mark>他藉这灵曾去传道给那些在监狱里的灵听</mark></strong>， 就是那从前在<strong><mark>挪亚预备方舟、上帝容忍等待的时候</mark></strong>，不信从的人。当时进入方舟，借着水得救的不多，只有八个人。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/3/#L18-20">彼前 3:18-20</a>)</p></blockquote><blockquote><p>“他们必在那将要审判活人死人的主面前交账。 为此，<strong><mark>就是死人也曾有福音传给他们</mark></strong>，要叫他们的肉体按着人受审判，他们的灵性却靠上帝活着。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/4/#L5-6">彼前 4:5-6</a>)</p></blockquote><blockquote><p>“所以经上说：『他升上高天的时候，掳掠了仇敌，将各样的恩赐赏给人。』 （<strong><mark>既说升上，岂不是先降在地下吗</mark></strong>？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/4/#L8-9">弗 4:8-9</a>)</p></blockquote><p>最终，基督掌管死人，也掌管活人：</p><blockquote><p>“<strong><mark>因此基督死了，又活了，为要作死人并活人的主</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/14/#L9">罗 14:9</a>)</p></blockquote><h2>义人死后在天上的生命</h2><p>为基督被杀的灵魂与他在天上同活，并且知道地上发生的事（他们的冤至今未伸）：</p><blockquote><p>“揭开第五印的时候，我看见在祭坛底下，<strong><mark>有为上帝的道并为作见证被杀之人的灵魂</mark></strong>， 大声喊着说：「<strong><mark>圣洁真实的主啊！你不审判住在地上的人，给我们伸流血的冤，要等到几时呢</mark></strong>？」 <strong><mark>于是有白衣赐给他们各人</mark></strong>，又有话对他们说：「还要安息片时，<strong><mark>等着一同作仆人的和他们的弟兄，也像他们被杀，满足了数目</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/6/#L9-11">启 6:9-11</a>)</p></blockquote><h2>为基督殉道的人住在天上</h2><blockquote><p>“弟兄胜过牠，是因羔羊的血和<strong><mark>自己所见证的道</mark></strong>。<strong><mark>他们虽至于死，也不爱惜性命</mark></strong>。 所以<strong><mark>诸天和住在其中的</mark></strong>，你们都快乐吧！只是地与海有祸了，因为魔鬼知道自己的时候不多，就气忿忿的下到你们那里去了。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/12/#L11-12">启 12:11-12</a>)</p></blockquote><p>义人住在天上，而我们这些住在地上的人，如今就已走近天上凯旋的教会——走近义人的神魂：</p><blockquote><p>“<strong><mark>你们乃是来到</mark></strong>锡安山，永生上帝的城邑，就是<strong><mark>天上的耶路撒冷</mark></strong>。那里有千万的天使， 有名录在天上<strong><mark>诸长子之会所共聚的总会</mark></strong>，有审判众人的上帝和<strong><mark>被成全之义人的灵魂</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/12/#L22-23">希 12:22-23</a>)</p></blockquote><p>常保童身的人无论基督往哪里去都跟随他：</p><blockquote><p>“<strong><mark>这些人未曾沾染妇女</mark></strong>，<strong><mark>他们原是童身</mark></strong>。<strong><mark>羔羊无论往那里去，他们都跟随他</mark></strong>。他们是从人间买来的，作初熟的果子归与上帝和羔羊。 在他们口中察不出谎言来，他们是没有瑕疵的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/14/#L4-5">启 14:4-5</a>)</p></blockquote><p>死人受审判，阴间交出在它里面的死人：</p><blockquote><p>“<strong><mark>我又看见死了的人</mark></strong>，无论大小，都站在宝座前。案卷展开了，并且另有一卷展开，就是生命册；<strong><mark>死了的人都凭着这些案卷所记载的，照他们所行的受审判</mark></strong>。 于是海交出其中的死人，<strong><mark>死亡和阴间也交出其中的死人</mark></strong>，他们都照各人所行的受审判。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/20/#L12-13">启 20:12-13</a>)</p></blockquote><h2>批评</h2><h3>上帝复活了先知摩西？</h3><p>东正教徒为灵魂死后有知觉的存在辩护，提出这样的论据：先知摩西虽然死了（<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/34/#L7">申 34:7</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/nav/1/#L2">书 1:2</a>），却显现并<strong>与基督交谈</strong>：</p><blockquote><p>“忽然，有<strong><mark>摩西</mark></strong>，以利亚向他们显现，<strong><mark>同耶稣说话</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/17/#L3">太 17:3</a>)</p></blockquote><p>反对东正教会的人（特别是基督复临安息日会信徒）回答说，这仿佛是因为上帝接升并复活了先知摩西。他们所依据的不是圣经，而是伪经《摩西升天记》（因为他们无法直接引用怀爱伦的话）。</p><p>我们（他们也同样）不认为伪经是有权威的文本。但问题在于，即便在这部伪经中——至少在保存下来的部分里——也没有关于先知摩西复活的话。相反，书中将这样的话归于摩西：他要「归到他列祖那里」（<a href="https://azbyka.ru/otechnik/Biblia2/apokrificheskie-apokalipsisy/15#sel=15:41,15:57;27:1,27:7">来源</a>）。</p><p>此外，先知的复活与圣经相矛盾，因为正是基督——死者中的初熟果子：</p><blockquote><p>“但基督已经从死里复活，<strong><mark>成为睡了之人初熟的果子</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/15/#L20">林前 15:20</a>)</p></blockquote><p>我们也知道，没有一个人（这话是对人说的）升过天，没有一个先知升过天：</p><blockquote><p>“<strong><mark>除了从天降下仍旧在天的人子，没有人升过天</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/3/#L13">约 3:13</a>)</p></blockquote><blockquote><p>“弟兄们，先祖大卫的事，我可以明明地对你们说，他死了，也葬埋了，并且他的坟墓直到今日还在我们这里。 &lt;…&gt; <strong><mark>大卫并没有升到天上</mark></strong>，但自己说：『主对我主说：你坐在我的右边，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/2/#L29,34">徒 2:29,34</a>)</p></blockquote><p>关于在基督十字架祭献和他的复活之前，所有的人死后都下到阴间的详情：</p><p><a href="https://bibleox.com/ru/ru/w/9VFT_До_жертвы_Христовой_ветхозаветные_праведники_сходили_в_ад">在基督祭献之前，旧约的义人们下到阴间</a></p><h3>灵魂不朽的学说就是相信魔鬼所说「不一定死」的话吗？</h3><p>灵魂学说的反对者（复临信徒）这样控告东正教徒：上帝说「你们必定死」，而魔鬼说「你们不一定死」，仿佛这就意味着，相信灵魂死后存活的信仰就是相信魔鬼的话：「你们不一定死」。相应地，相信灵魂在身体死后存活的人，被他们控告为相信魔鬼的谎言。</p><p>这控告听起来响亮，但这一想法本身与上下文有严重的矛盾和问题。上帝说的不仅是「你们必定死」，而是说：你们吃的日子必定死——即在吃那禁树果子的那一天：</p><blockquote><p>“耶和华上帝吩咐他说：「园中各样树上的果子，你可以随意吃， 只是分别善恶树上的果子，你不可吃，因为<strong><mark>你吃的日子必定死</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/2/#L16-17">创 2:16-17</a>)</p></blockquote><p>灵魂生命学说的反对者把「必定死」这句话理解为最简单直接的意思：身体的死亡、人一切生命活动的终止、人存在的终结（至少是有知觉的存在的终结）。</p><p>人在吃果子的那一天发生了这种被理解的死吗？——没有，亚当死得晚得多，活到九百三十岁（<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/5/#L5">创 5:5</a>）。这意味着什么？——意味着上帝所说的是另一种死。魔鬼所否认的也正是另一种死。</p><p>而如果不是这样，那就不得不承认：上帝说人在吃果子的那天必死，是撒了谎，而魔鬼反倒说了实话——「你们不一定死」——因为毕竟，那一天并没有发生粗浅意义（身体意义）上的死亡。但我们无论如何不能承认：上帝（道路、真理、生命——<a href="https://bibleox.com/zh-Hans/cn-cuv/in/14/#L6">约 14:6</a>）撒了谎，而魔鬼（说谎的、说谎之人的父——<a href="https://bibleox.com/zh-Hans/cn-cuv/in/8/#L44">约 8:44</a>）说了实话。然而，灵魂学说反对者们的解释恰恰把人引向这个结论。</p><p>为了走出这个死胡同，他们必定要把话语的一部分作比喻式的重新解释：</p><ul><li><p>死亡本身按字面理解，</p></li><li><p>而死亡的日子却不按字面理解。</p></li></ul><p>东正教会的解释没有这样的缺陷：</p><ul><li><p>死亡的日子按字面理解，</p></li><li><p>死亡本身也按字面理解——只是针对人的属灵状态而言。不过，在身体状态上确实也发生了变化：人至少看见了自己是赤身露体的。</p></li></ul><p>始祖确实在那天就死了，但这一死——不是消失，而是一种与上帝隔绝的状态，一切罪人都处在这种状态中。基督——上帝自己——也把没有上帝的生命状态称为死：</p><blockquote><p>“又有一个门徒对耶稣说：「主阿，容我先回去埋葬我的父亲。」 耶稣说：「<strong><mark>任凭死人埋葬他们的死人</mark></strong>，你跟从我吧！」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/8/#L21-22">太 8:21-22</a>)</p></blockquote><blockquote><p>“我实实在在的告诉你们，那听我话又信差我来者的，就有永生，不至于定罪，<strong><mark>是已经出死入生了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/5/#L24">约 5:24</a>)</p></blockquote><blockquote><p>“你要写信给撒狄教会的使者说：『那有上帝的七灵和七星的说：我知道你的行为，<strong><mark>按名你是活的，其实是死的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/3/#L1">启 3:1</a>)</p></blockquote><p>使徒们也这样说。他们曾活在死的状态中：</p><blockquote><p>“你们<strong><mark>死在过犯罪恶之中</mark></strong>，他叫你们活过来。 那时，你们在其中<strong><mark>行事为人</mark></strong>，随从今世的风俗，顺服空中掌权者的首领，就是现今在悖逆之子心中运行的邪灵。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/2/#L1-2">弗 2:1-2</a>)</p></blockquote><blockquote><p>“那独居无靠真为寡妇的，是仰赖上帝，昼夜不住的祈求祷告。 但那好宴乐的寡妇，<strong><mark>正活着的时候也是死的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/5/#L5-6">提前 5:5-6</a>)</p></blockquote><p>也就是说，死的状态在亚当和夏娃犯罪堕落之后立刻就来临了——这是一种内在的、没有上帝的生命状态。在这个意义上，魔鬼说「你们不一定死」时撒了谎。他们正如上帝所说的那样死了——就在那一天。</p><p>如此，这些控告并不严重——它们本身就带有矛盾，并且脱离圣经的上下文。</p>
