- src: молитва_стоя
  path: QM6A_站着祈祷
  title: 站着祈祷
  copy_cover: true
  body: <h2>上帝称旧约的圣殿为祈祷的殿</h2><blockquote><p>“我必领他们到我的圣山，使他们在祷告我的殿中喜乐。他们的燔祭和平安祭，在我坛上必蒙悦纳。因<strong><mark>我的殿必称为万民祷告的殿</mark></strong>！」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/56/#L7">赛 56:7</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/mf/21/#L13">太 21:13</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/mk/11/#L17">可 11:17</a>)</p></blockquote><p>圣殿的构造没有设座位。<a href="https://bibleox.com/ru/ru/w/иерусалимский-храм">圣殿的详细构造</a>。</p><h2>在圣殿里是站着祈祷的</h2><blockquote><p>“于是犹大人聚会，求耶和华帮助，犹大各城都有人出来寻求耶和华。 &lt;…&gt; <strong><mark>犹大众人和他们的婴孩、妻子、儿女，都站在耶和华面前</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/20/#L4,13">代下 20:4,13</a>)</p></blockquote><blockquote><p>“摩西又对可拉说：「利未的子孙哪，你们听我说！ 以色列的上帝从以色列会中将你们分别出来，使你们亲近他，办耶和华帐幕的事，<strong><mark>并站在会众面前替他们当差</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/16/#L8-9">民 16:8-9</a>)</p></blockquote><h2>事奉上帝的被造物被描绘为站立的</h2><blockquote><p>“<strong><mark>两个基路伯张开翅膀，共长二十肘，面向外殿而立</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/3/#L13">代下 3:13</a>)</p></blockquote><h2>命令使徒站起来祈祷</h2><blockquote><p>“有一位天使从天上显现，加添他的力量。 耶稣极其伤痛，祷告更加恳切，汗珠如大血点滴在地上。 祷告完了，就起来，到门徒那里，见他们因为忧愁都睡着了， 就对他们说：「你们为什么睡觉呢？<strong><mark>起来祷告，免得入了迷惑</mark></strong>！」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/22/#L43-46">路 22:43-46</a>)</p></blockquote><p>“起来”一词也可以理解为“从睡梦中醒来”。然而，这一处之所以重要，还在于它显明基督自己带着极大的劳苦和如血滴般的汗珠祈祷。</p>
