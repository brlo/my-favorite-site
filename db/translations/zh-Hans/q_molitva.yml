- src: действие-Бога-по-вере-родителей-и-друзей
  path: QM3A_上帝按亲友的信心和祈祷行事
  title: 上帝按亲友的信心和祈祷行事
  copy_cover: true
  body: <p>上帝恩典的运作并不总是按人个人的信心和个人的祈求。有不少情形，上帝是按着为亲人劳苦、为他祈求（祷告）之人的信心行事的。</p><h2>四个朋友与瘫痪者</h2><p>医治和赦罪是因瘫痪者朋友的信心而发生的——他们费了很大的力气才把他带到基督面前：</p><blockquote><p>“<strong><mark>耶稣见他们的信心</mark></strong>，就对瘫子说：「<strong><mark>小子，你的罪赦了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/2/#L5">可 2:5</a>)</p></blockquote><h2>百夫长与他的仆人</h2><p>相信并祈求的是百夫长，得医治的是百夫长的仆人：</p><blockquote><p>“百夫长回答说：「主啊，你到我舍下，我不敢当；只要你说一句话，我的仆人就必好了。 &lt;…&gt; 耶稣听见就希奇，对跟从的人说：「我实在告诉你们：<strong><mark>这么大的信心，就是在以色列中，我也没有遇见过</mark></strong>。 &lt;…&gt; 耶稣对百夫长说：「你回去吧！<strong><mark>照你的信心，给你成全了</mark></strong>。」那时，他的仆人就好了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/8/#L8,10,13">太 8:8,10,13</a>)</p></blockquote><h2>父亲与被鬼附的儿子</h2><p>相信并祈求的是父亲，从鬼附中得医治的是儿子：</p><blockquote><p>“众人中间有一个人回答说：「夫子，我带了我的儿子到你这里来，他被哑巴鬼附着。 无论在那里，鬼捉弄他，把他摔倒，他就口中流沫，咬牙切齿，身体枯干。我请过你的门徒把鬼赶出去，他们却是不能。」 耶稣说：「嗳，不信的世代啊！我在你们这里要到几时呢？我忍耐你们要到几时呢？把他带到我这里来吧。」 他们就带了他来。他一见耶稣，鬼便叫他重重的抽疯，倒在地上，翻来覆去，口中流沫。 耶稣问他父亲说：「他得这病有多少日子呢？」回答说：「从小的时候。 鬼屡次把他扔在火里、水里，要灭他。你若能作什么，求你怜悯我们，帮助我们！」 耶稣对他说：「你<strong><mark>若能信，在信的人，凡事都能</mark></strong>。」 孩子的父亲立时喊着说〔有古卷作『立时流泪的喊着说』〕：「我信，但我信不足，求主帮助！」 耶稣看见众人都跑上来，就斥责那污鬼说：「你这聋哑的鬼，我吩咐你从他里头出来，再不要进去！」 那鬼喊叫，使孩子大大的抽了一阵疯，就出来了。孩子好像死了一般，以致众人多半说：「他是死了。」 但耶稣拉着他的手，扶他起来，他就站起来了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/9/#L17-27">可 9:17-27</a>)</p></blockquote><h2>迦南妇人与被鬼附的女儿</h2><p>相信并祈求的是母亲，从鬼附中得医治的是迦南妇人（叙利腓尼基妇人——<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/7/#L26">可 7:26</a>）的女儿：</p><blockquote><p>“有一个迦南<strong><mark>妇人</mark></strong>从那地方出来，喊着说：「主啊，大卫的子孙，可怜我！我女儿被鬼附得甚苦。」 耶稣却一言不答。门徒进前来，求他说：「这妇人在我们后头喊叫，请打发他走吧！」 耶稣说：「我奉差遣，不过是到以色列家迷失的羊那里去。」 那妇人来拜他，说：「主啊，帮助我！」 他回答说：「不好拿儿女的饼丢给狗吃。」 妇人说：「主阿，不错！但是狗也吃牠主人桌子上掉下来的碎渣儿。」 耶稣说：「妇人，<strong><mark>你的信心是大的</mark></strong>．照你所要的，给你成全了吧！」从那时候，她女儿就好了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/15/#L22-28">太 15:22-28</a>)</p></blockquote><h2>睚鲁与十二岁的女儿</h2><p>相信并祈求的是父亲（睚鲁），复活的是被医治的女儿：</p><blockquote><p>“有一个管会堂的，名叫睚鲁，来<strong><mark>俯伏在耶稣脚前</mark></strong>，求耶稣到他家里去。 因他有一个独生女儿，约有十二岁，快要死了。耶稣去的时候，众人拥挤他。 &lt;…&gt; 还说话的时候，有人从管会堂的家里来，说：「<strong><mark>你的女儿死了</mark></strong>，不要劳动夫子。」 耶稣听见就对他说：「<strong><mark>不要怕，只要信</mark></strong>！你的女儿就必得救。」 耶稣到了他的家，除了彼得、约翰、雅各和女儿的父母，不许别人同他进去。 众人都为这女儿哀哭捶胸。耶稣说：「不要哭！她不是死了，是睡着了。」 他们晓得女儿已经死了，就嗤笑耶稣。 耶稣拉着她的手，呼叫说：「<strong><mark>女儿，起来吧</mark></strong>！」 她的灵魂便回来，她就立刻起来了。耶稣吩咐给他东西吃。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/8/#L41-42,49-55">路 8:41-42,49-55</a>)</p></blockquote><h2>大臣与他的儿子</h2><p>相信并祈求的是大臣，得医治的是他的儿子：</p><blockquote><p>“耶稣又到了加利利的迦拿，就是他从前变水为酒的地方。有一个大臣，他的儿子在迦百农患病。 他听见耶稣从犹太到了加利利，就来见他，求他下去医治他的儿子，因为他儿子快要死了。 耶稣就对他说：「<strong><mark>若不看见神迹奇事，你们总是不信</mark></strong>。」 那大臣说：「先生，求你趁着我的孩子还没有死，就下去。」 耶稣对他说：「回去吧！你的儿子活了。」那人信耶稣所说的话，就回去了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/4/#L46-50">约 4:46-50</a>)</p></blockquote><h2>结论</h2><p>这样，救主等候父母的信心，为要在他们的儿女身上显出上帝的作为。并且因着父母的祈求和信心，上帝的恩典在儿女身上运行。</p>
