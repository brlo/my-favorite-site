- src: молитвы-за-умерших
  path: QM2A_为亡者祈祷
  title: 为亡者祈祷
  copy_cover: true
  body: <h2>前言</h2><p>为亡者祈求某种怜悯，这是爱心之举，即被对上帝和对邻人的爱所引导之人的举动。我们不知道主对于某一个为亡者所发的祈求会怎样决定，然而我们有盼望的依据，也有促使我们关怀的爱。这依据是什么？依据——是上帝的启示，我们从其中得知：上帝是全能的，他掌握着死亡和阴间的「钥匙」；有些罪甚至在未来的世代也不会被赦免（由此可以明白，还有别的罪）；上帝曾呼召我们以各种不同的祈求来到他面前。我们也知道，罪人所受的刑罚不是<a href="https://bibleox.com/ru/ru/w/bib_Неодинаковая_мера_воздаяния:_мучения_и_блаженства">一样的尺度</a>，义人的福乐也不是一样的程度；所以即使一个人不能得救，我们也盼望他的命运得到减轻。在旧约里人们就关怀亡者（见<a href="https://bibleox.com/ru/ru/w/молитвы-за-умерших#HH-Ветхий-Завет-Забота-о-прощении-грехов-умерших">下文</a>），最早的基督徒也关怀他们（详见<a href="https://bibleox.com/ru/ru/w/91USaqiJ_молитвы_за_умерших">为亡者的祈祷</a>）。</p><p>促使这一切的，是那“永不止息”的爱（<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/13/#L8">林前 13:8</a>）。</p><h2>上帝是全能的</h2><blockquote><p>“「我是耶和华，是凡有血气者的上帝，<strong><mark>岂有我难成的事吗</mark></strong>？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ier/32/#L27">耶 32:27</a>)</p></blockquote><p>其他引文：<a href="https://bibleox.com/ru/ru/w/Бог-всемогущий">全能的上帝</a></p><h2>上帝应许：遵守诫命的人，凡凭信心所求的都必得着</h2><blockquote><p>“<strong><mark>并且我们一切所求的，就从他得着</mark></strong>，因为我们遵守他的命令，行他所喜悦的事。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/3/#L22">约壹 3:22</a>)</p></blockquote><blockquote><p>“<strong><mark>既然知道他听我们一切所求的</mark></strong>，就知道我们所求于他的，无不得着。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/5/#L15">约壹 5:15</a>)</p></blockquote><blockquote><p>“你们祷告，无论求什么，<strong><mark>只要信，就必得着</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/21/#L22">太 21:22</a>)</p></blockquote><blockquote><p>“我又告诉你们：若是你们中间有两个人在地上同心合意的求什么事，<strong><mark>我在天上的父必为他们成全</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/18/#L19">太 18:19</a>)</p></blockquote><blockquote><p>“不是你们拣选了我，是我拣选了你们；并且分派你们去结果子，叫你们的果子常存；<strong><mark>使你们奉我的名，无论向父求什么，他就赐给你们</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/15/#L16">约 15:16</a>)</p></blockquote><p>这些话是在为犯了罪的弟兄得救而祈祷的语境里说的——上帝因义人的祈祷拯救他们：</p><blockquote><p>“既然知道<strong><mark>他听我们一切所求的</mark></strong>，就知道我们所求于他的，无不得着。 人若看见弟兄犯了不至于死的罪，<strong><mark>就当为他祈求</mark></strong>，<strong><mark>上帝必将生命赐给他</mark></strong>；有至于死的罪，我不说当为这罪祈求。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/5/#L15-16">约壹 5:15-16</a>)</p></blockquote><h2>罪可以藉教会的祈祷得赦免</h2><p>这就是说，罪得到赦免不仅是在人自己悔改、自己求赦免的时候，也是在别人为人求赦免的时候：</p><blockquote><p>“你们中间有病了的呢，他就<strong><mark>该请教会的长老来</mark></strong>，他们可以奉主的名用油抹他，为他祷告。 出于信心的祈祷要救那病人，主必叫他起来；<strong><mark>他若犯了罪，也必蒙赦免</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/5/#L14-15">雅 5:14-15</a>)</p></blockquote><p>瘫痪者的朋友们费了很大的力气才把朋友带到基督面前。主因他们的信心赦免了瘫痪者的罪，并医治了他：</p><blockquote><p>“<strong><mark>耶稣见他们的信心</mark></strong>，就对瘫子说：「<strong><mark>小子，你的罪赦了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/2/#L5">可 2:5</a>)</p></blockquote><h2>罪甚至在死后也可以得到赦免</h2><p>从主耶稣基督的话可以得出：罪的赦免不仅在这一世，也在未来的世代是可能的。有这样的罪，它们现在和将来都不会被赦免：</p><blockquote><p>“所以我告诉你们：人一切的罪和亵渎的话，都可得赦免；惟独亵渎圣灵，总不得赦免。 凡说话干犯人子的，还可得赦免；<strong><mark>惟独说话干犯圣灵的，今世、来世总不得赦免</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/12/#L31-32">太 12:31-32</a>)</p></blockquote><h2>基督掌握着死亡和阴间的钥匙</h2><blockquote><p>“我一看见，就仆倒在他脚前，像死了一样。他用右手按着我说：「不要惧怕！我是首先的，我是末后的， 又是那存活的。我曾死过，现在又活了，直活到永永远远，<strong><mark>并且拿着死亡和阴间的钥匙</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/1/#L17-18">启 1:17-18</a>)</p></blockquote><h2>旧约：关怀亡者罪的赦免</h2><h3>为亡者斋戒</h3><p>以色列人为已故的王扫罗、他的儿子们和阵亡的以色列人斋戒：</p><blockquote><p>“<strong><mark>这样扫罗和他三个儿子，与拿他兵器的人，以及跟随他的人，都一同死亡</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1ts/31/#L6">撒上 31:6</a>)</p></blockquote><blockquote><p>“将他们骸骨葬在雅比的垂丝柳树下，<strong><mark>就禁食七日</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1ts/31/#L13">撒上 31:13</a>)</p></blockquote><blockquote><p>“<strong><mark>而且悲哀、哭号、禁食到晚上</mark></strong>，是因扫罗和他儿子约拿单，并耶和华的民以色列家的人，倒在刀下。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2ts/1/#L12">撒下 1:12</a>)</p></blockquote><h3>为亡者祈祷和献祭</h3><p>犹太人为阵亡的战士祈祷，求他们的罪得赦免。又送银子到耶路撒冷圣殿，为亡者献上赎罪祭，使他们从罪中得洁净：</p><blockquote><p>“事后，犹大率领兵马，到了阿杜蓝城；因为已到第七日，他们就在那里照例自洁，过了安息日。第二天，由于事不宜迟，犹大的部队便出去收殓阵亡的尸体，好把他们安葬在祖坟里，与亲族在一起。当时在每个死者的内衣下，发现都有雅木尼雅偶像的符箓，这原是法律禁止佩带的；众人便都明白这正是他们阵亡的原因。于是众人称赞秉公审判及揭示隐密的上主，同心哀祷，<strong>求使所犯过恶，得以完全赦免</strong>。随后，英勇的犹大劝勉民众避免犯罪，因为人都亲眼看见这些阵亡者因罪所受的罚。于是大众募集了二千银“达玛”，送到耶路撒冷作赎罪祭的献仪：<strong>他作的是一件很美妙高超的事，因为他想念着复活</strong>；如果他不希望那些死过的人还要复活，<strong>为亡者祈祷，便是一种多余而糊涂的事</strong>。何况，他还想到为那些善终的人保留下的超等报酬：这实在是一个圣善而虔诚的思想。<strong>为此，他为亡者献赎罪祭，是为叫他们获得罪赦</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-sb/2mak/12/#L38-45">加下 12:38-45</a>)</p></blockquote><h3>为亡者施舍</h3><p>犹太人为亡者的缘故行施舍：</p><blockquote><p>“你当全灵恭敬上主，尊敬司祭，并依照定例，给他所应得的一分：即首批成熟的出产，赎罪的祭品，平安牺牲的右腿，圣洁的祭物，和高尚的献仪。你要用少许祭品，洗净你无心的过犯。你应将平安牺牲的一切胳臂，圣洁的祭品，与贵重的献仪，都献给上主。应向穷人伸手施惠，好使你的祝福和怜悯，完备无缺。<strong>对一切活人，要施与恩惠；对于死者，不要禁止哀悼</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/7/#L37">德 7:37</a>)</p></blockquote><blockquote><p>“<strong>把你的酒和食物倒在义人的坟墓上</strong>，也不可施与恶人。” (<a href="https://bibleox.com/zh-Hans/cn-sb/tov/4/#L17">多 4:17</a>)</p></blockquote><p>为亡者的施舍不是从什一之物中拿的：</p><blockquote><p>“每逢三年，就是十分取一之年，你取完了一切土产的十分之一，要分给利未人和寄居的与孤儿寡妇，使他们在你城中可以吃得饱足。 你又要在耶和华你上帝面前说：『我已将圣物从我家里拿出来，给了利未人和寄居的与孤儿寡妇，是照你所吩咐我的一切命令。你的命令我都没有违背，也没有忘记。 我守丧的时候，没有吃这圣物；不洁净的时候，也没有拿出来；<strong><mark>又没有为死人送去</mark></strong>。我听从了耶和华我上帝的话，都照你所吩咐的行了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/26/#L12-14">申 26:12-14</a>)</p></blockquote><h2>在上帝那里，人人都是活着的</h2><p>以上引文表明犹太人的信仰和他们具体的实践。他们为亡者罪的赦免祈祷，为亡者斋戒，为亡者献祭，为亡者施舍，总的来说关怀他们的身后之事。只有撒都该人否认死后的存在——主责备他们的谬误和对圣经的无知：</p><blockquote><p>“耶稣回答说：「<strong><mark>你们错了，因为不明白圣经，也不晓得上帝的大能</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/22/#L29">太 22:29</a>)</p></blockquote><blockquote><p>“<strong><mark>上帝不是死人的上帝，乃是活人的上帝</mark></strong>。<strong><mark>你们是大错了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/12/#L27">可 12:27</a>)</p></blockquote><h2>盼望亡者得到各种帮助</h2><p>即使某个人已经不能从阴间得救，也仍然可以减轻他的痛苦，在现在或将来（在普遍的复活和审判之后）给予某种安慰，因为刑罚的尺度不是一样的：</p><blockquote><p>“仆人知道主人的意思，却不预备，又不顺他的意思行，<strong><mark>那仆人必多受责打</mark></strong>； 惟有那不知道的，作了当受责打的事，<strong><mark>必少受责打</mark></strong>。因为多给谁，就向谁多取；<strong><mark>多托谁，就向谁多要</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/12/#L47-48">路 12:47-48</a>)</p></blockquote><p>关于刑罚之差异的更多引文：<a href="https://bibleox.com/ru/ru/w/bib_Неодинаковая_мера_воздаяния:_мучения_и_блаженства">刑罚的尺度不是一样的</a></p>
