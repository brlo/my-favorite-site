- src: длинные-молитвы
  path: QM5A_祈祷可长可短
  title: 祈祷可长可短
  copy_cover: true
  body: <h2>祈祷可以是长的</h2><h3>常常祈祷的命令</h3><blockquote><p>“要常常喜乐， <strong><mark>不住的祷告</mark></strong>， <strong><mark>凡事谢恩</mark></strong>，因为这是上帝在基督耶稣里向你们所定的旨意。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1sol/5/#L16-18">帖前 5:16-18</a>)</p></blockquote><blockquote><p>“靠着圣灵，<strong><mark>随时多方祷告祈求</mark></strong>，并要在此儆醒不倦，为众圣徒祈求，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/6/#L18">弗 6:18</a>)</p></blockquote><h3>主耶稣基督的祈祷极其长久</h3><p>他整夜祈祷：</p><blockquote><p>“那时，耶稣出去，上山祷告，<strong><mark>整夜祷告上帝</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L12">路 6:12</a>)</p></blockquote><p>他从傍晚祈祷到几乎清晨。夜分为四更；第四更是夜的最后一段，几乎已是早晨。基督祈祷了几乎整夜：</p><blockquote><p>“散了众人以后，<strong><mark>他就独自上山去祷告</mark></strong>。<strong><mark>到了晚上，只有他一人在那里</mark></strong>。 &lt;…&gt; <strong><mark>夜里四更天</mark></strong>，耶稣在海面上走，往门徒那里去。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/14/#L23,25">太 14:23,25</a>)</p></blockquote><p>基督在自己的祈祷过一个小时之后来叫醒使徒们，这样重复了两次。可以推测，他祈祷了约三个小时：</p><blockquote><p>“他们来到一个地方，名叫客西马尼。耶稣对门徒说：「你们坐在这里，<strong><mark>等我祷告</mark></strong>。」 &lt;…&gt; 他就稍往前走，<strong><mark>俯伏在地，祷告说</mark></strong>：「倘若可行，便叫那时候过去。」 &lt;…&gt; 耶稣回来，见他们睡着了，就对彼得说：「西门，你睡觉吗？<strong><mark>不能儆醒片时吗</mark></strong>？ &lt;…&gt; <strong><mark>耶稣又去祷告</mark></strong>，说的话还是与先前一样。 又来见他们睡着了，因为他们的眼睛甚是困倦；他们也不知道怎么回答。 <strong><mark>第三次来</mark></strong>，对他们说：「现在你们仍然睡觉安歇吧！够了，时候到了。看哪，人子被卖在罪人手里了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/14/#L32,35,37,39-41">可 14:32,35,37,39-41</a>)</p></blockquote><h3>比喻</h3><p>在赐下祈祷的范本——“我们在天上的父”——之后，主随即讲了关于在祈祷中坚持和忍耐的比喻：</p><blockquote><p>“耶稣又说：「你们中间谁有一个朋友半夜到他那里去，说：『朋友！请借给我三个饼； 因为我有一个朋友行路，来到我这里，我没有什么给他摆上。』 那人在里面回答说：『不要搅扰我，门已经关闭，孩子们也同我在床上了，我不能起来给你。』 我告诉你们，虽不因他是朋友起来给他，<strong><mark>但因他情词迫切的直求，就必起来照他所需用的给他</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/11/#L5-8">路 11:5-8</a>)</p></blockquote><p>寡妇和法官的比喻：</p><blockquote><p>“耶稣设一个比喻，是<strong><mark>要人常常祷告，不可灰心</mark></strong>。 说：「某城里有一个官，不惧怕上帝，也不尊重世人。 那城里有个寡妇，常到他那里，说：『我有一个对头，求你给我伸冤。』 他多日不准。后来心里说：『我虽不惧怕上帝，也不尊重世人， 只因这寡妇烦扰我，我就给他伸冤吧．免得她常来缠磨我！』」 主说：「你们听这不义之官所说的话。 <strong><mark>上帝的选民昼夜呼吁他</mark></strong>，他纵然为他们忍了多时，岂不终久给他们伸冤吗？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/18/#L1-7">路 18:1-7</a>)</p></blockquote><h2>祈祷可以是短的</h2><p>在讲了关于恒常和坚持祈祷的比喻之后，主又讲了那个税吏的短祷蒙他喜悦的比喻；不过如福音史家所说明，这个比喻讲的是那些自以为义的人。最终，基督直接指出税吏蒙上帝喜悦之处：对自己和自己的义看得很低：</p><blockquote><p>“耶稣向那些<strong><mark>仗着自己是义人，藐视别人的</mark></strong>，设一个比喻， 说：「有两个人上殿里去祷告：一个是法利赛人，一个是税吏。 法利赛人站着，自言自语的祷告说：『上帝啊，我感谢你，我不像别人勒索、不义、奸淫，也不像这个税吏。 我一个礼拜禁食两次，凡我所得的都捐上十分之一。』 <strong><mark>那税吏远远的站着，连举目望天也不敢</mark></strong>，只捶着胸说：『<strong><mark>上帝啊，开恩可怜我这个罪人</mark></strong>！』 我告诉你们：这人回家去比那人倒算为义了。因为<strong><mark>凡自高的，必降为卑；自卑的，必升为高</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/18/#L9-14">路 18:9-14</a>)</p></blockquote><h2>对异议的回应</h2><h3>不可用许多重复话</h3><p>在马太福音里，“我们在天上的父”祈祷之前记着基督的话：祈祷中不必说多余的话：</p><blockquote><p>“你们祷告，不可像外邦人，<strong><mark>用许多重复话</mark></strong>，他们以为话多了必蒙垂听。 <strong><mark>你们不可效法他们</mark></strong>，因为你们没有祈求以先，你们所需用的，你们的父早已知道了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/6/#L7-8">太 6:7-8</a>)</p></blockquote><p>主耶稣基督自己常常整夜祈祷，有时也重复自己的话：</p><blockquote><p>“耶稣又去祷告，<strong><mark>说的话还是与先前一样</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/14/#L39">可 14:39</a>)</p></blockquote>
