  references: "<p>翻译：罗季翁·弗拉索夫（借助人工智能工具）。底本：俄文原文。参考：英文、日文翻译。圣经链接指向本站的和合本（上帝版）；次经书卷引文按思高译本，无中文经文处自俄文译出。</p>"
- src: молитва-не-своими-словами
  path: QM4A_按范本祈祷
  title: 按范本祈祷
  copy_cover: true
  body: <h2>按范本祈祷</h2><p>旧约里有一部伟大的、受上帝默感的祈祷书——诗篇。它由先知兼君王大卫写成。它曾在圣殿中使用，诗篇是人们在登上台阶时唱的。</p><p>当使徒们求主教他们祈祷时，他们所依据的是：先知施洗约翰已经教导过自己的门徒祈祷：</p><blockquote><p>“耶稣在一个地方祷告。祷告完了，有个门徒对他说：「<strong><mark>求主教导我们祷告</mark></strong>，<strong><mark>像约翰教导他的门徒</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/11/#L1">路 11:1</a>)</p></blockquote><p>之后基督赐下祈祷的范本——用他自己的话：</p><blockquote><p>“耶稣说：「<strong><mark>你们祷告的时候，要说</mark></strong>：我们在天上的父〔有古卷只作『父阿』〕：愿人都尊你的名为圣。愿你的国降临，愿你的旨意行在地上，如同行在天上〔有古卷没有『愿你的旨意云云』〕。 我们日用的饮食，天天赐给我们。 <strong><mark>赦免我们的罪</mark></strong>，因为我们也赦免凡亏欠我们的人。不叫我们遇见试探；救我们脱离兇恶〔有古卷无末句〕。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/11/#L2-4">路 11:2-4</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/mf/6/#L9-13">太 6:9-13</a>)</p></blockquote><p>就是说，给出祈祷文、按范本（规矩）祈祷——这是完全正常的，是圣经的实践。</p>
  meta_desc: 按范本祈祷
