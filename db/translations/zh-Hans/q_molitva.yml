  path: QM1A_祈祷
  title: 祈祷
  copy_cover: true
  body: <h2>关于祈祷的命令</h2><h3>祈求的祈祷</h3><blockquote><p>“<strong><mark>你们祈求，就给你们</mark></strong>；<strong><mark>寻找，就寻见</mark></strong>；<strong><mark>叩门，就给你们开门</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/7/#L7">太 7:7</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/lk/11/#L9">路 11:9</a>)</p></blockquote><h3>感恩的祈祷</h3><blockquote><p>“<strong><mark>不住的祷告</mark></strong>， <strong><mark>凡事谢恩</mark></strong>，<strong><mark>因为这是上帝在基督耶稣里向你们所定的旨意</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1sol/5/#L17-18">帖前 5:17-18</a>)</p></blockquote><blockquote><p>“应当一无挂虑，只要<strong><mark>凡事借着祷告、祈求和感谢</mark></strong>，将你们所要的告诉上帝。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/fil/4/#L6">腓 4:6</a>)</p></blockquote><blockquote><p>“不要醉酒，酒能使人放荡，乃要被圣灵充满。 当用诗章、颂词、灵歌彼此对说，口唱心和的赞美主。 凡事要奉我们主耶稣基督的名，<strong><mark>常常感谢父上帝</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/5/#L18-20">弗 5:18-20</a>)</p></blockquote><blockquote><p>“无论作什么，或说话，或行事，都要奉主耶稣的名，<strong><mark>借着他感谢父上帝</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/3/#L17">西 3:17</a>)</p></blockquote><h3>赞美上帝的祈祷（颂赞）</h3><blockquote><p>“<strong><mark>当称谢进入他的门</mark></strong>，当赞美进入他的院；<strong><mark>当感谢他，称颂他的名</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/100/#L4">诗 100:4</a>)</p></blockquote><blockquote><p>“（大卫在亚比米勒面前装疯，被他赶出去，就作这诗。）<strong><mark>我要时时称颂耶和华</mark></strong>；<strong><mark>赞美他的话必常在我口中</mark></strong>。 我的心必因耶和华夸耀；谦卑人听见，就要喜乐。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/34/#L1-2">诗 34:1-2</a>)</p></blockquote><blockquote><p>“我们应当靠着耶稣，<strong><mark>常常以颂赞为祭献给上帝</mark></strong>，<strong><mark>这就是那承认主名之人嘴唇的果子</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/13/#L15">希 13:15</a>)</p></blockquote><h2>恒常的祈祷与思念上帝</h2><blockquote><p>“靠着圣灵，<strong><mark>随时多方祷告祈求</mark></strong>，并要在此儆醒不倦，<strong><mark>为众圣徒祈求</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/6/#L18">弗 6:18</a>)</p></blockquote><blockquote><p>“<strong><mark>不住的祷告</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1sol/5/#L17">帖前 5:17</a>)</p></blockquote><blockquote><p>“耶稣设一个比喻，是<strong><mark>要人常常祷告，不可灰心</mark></strong>。 说：「某城里有一个官，不惧怕上帝，也不尊重世人。 那城里有个寡妇，常到他那里，说：『我有一个对头，求你给我伸冤。』 他多日不准。后来心里说：『我虽不惧怕上帝，也不尊重世人， 只因这寡妇烦扰我，我就给他伸冤吧．免得她常来缠磨我！』」 主说：「你们听这不义之官所说的话。 <strong><mark>上帝的选民昼夜呼吁他</mark></strong>，他纵然为他们忍了多时，岂不终久给他们伸冤吗？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/18/#L1-7">路 18:1-7</a>)</p></blockquote><h2>什么样的祈祷蒙垂听</h2><h3>信心</h3><blockquote><p>“你们中间若有缺少智慧的，应当求那厚赐与众人、也不斥责人的上帝，主就必赐给他。 <strong><mark>只要凭着信心求，一点不疑惑</mark></strong>；因为那疑惑的人，就像海中的波浪，被风吹动翻腾。 <strong><mark>这样的人不要想从主那里得什么</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/1/#L5-7">雅 1:5-7</a>)</p></blockquote><blockquote><p>“你们祷告，无论求什么，<strong><mark>只要信，就必得着</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/21/#L22">太 21:22</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/mk/11/#L24">可 11:24</a>)</p></blockquote><h3>公义（按上帝旨意生活，远离罪恶）</h3><blockquote><p>“恶人献祭，为耶和华所憎恶；<strong><mark>正直人祈祷，为他所喜悦</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/15/#L8">箴 15:8</a>)</p></blockquote><blockquote><p>“耶和华远离恶人，<strong><mark>却听义人的祷告</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/15/#L29">箴 15:29</a>)</p></blockquote><blockquote><p>“<strong><mark>你们若常在我里面</mark></strong>，<strong><mark>我的话也常在你们里面</mark></strong>，凡你们所愿意的，祈求就给你们成就。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/15/#L7">约 15:7</a>)</p></blockquote><blockquote><p>“主说：「因为这百姓亲近我，<strong><mark>用嘴唇尊敬我，心却远离我</mark></strong>；他们敬畏我，不过是领受人的吩咐。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/29/#L13">赛 29:13</a>)</p></blockquote><h3>谦卑痛悔的心</h3><blockquote><p>“上帝所要的祭，就是忧伤的灵；上帝阿！<strong><mark>忧伤痛悔的心，你必不轻看</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/51/#L17">诗 51:17</a>)</p></blockquote><blockquote><p>“<strong>耶和华啊！你为什么站在远处</strong>？在患难的时候，为什么隐藏？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/10/#L1">诗 10:1</a>)</p></blockquote><blockquote><p>“<strong>谦卑人的祈祷，穿云而上</strong>，不达到目的，决不甘休；不等至高者见了，为义人伸冤，执行正义，决不离开。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/35/#L21">德 35:21</a>)</p></blockquote><blockquote><p>“耶和华说：「这一切都是我手所造的，所以就都有了。但<strong><mark>我所看顾的，就是虚心痛悔、因我话而战兢的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/66/#L2">赛 66:2</a>)</p></blockquote><blockquote><p>“<strong><mark>或者他们在耶和华面前恳求</mark></strong>，各人回头，离开恶道，因为耶和华向这百姓所说要发的怒气和忿怒是大的。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ier/36/#L7">耶 36:7</a>)</p></blockquote><blockquote><p>“但愿我们能<strong>借着忏悔的心和谦虚的精神</strong>蒙你悦纳，就如献上公羊和公牛的全燔祭，又如献上了万只肥羊；” (<a href="https://bibleox.com/zh-Hans/cn-sb/dan/3/#L39">但 3:39</a>)</p></blockquote><blockquote><p>“耶稣向那些<strong><mark>仗着自己是义人，藐视别人的</mark></strong>，设一个比喻， 说：「有两个人上殿里去祷告：一个是法利赛人，一个是税吏。 <strong><mark>法利赛人站着，自言自语的祷告说</mark></strong>：『上帝啊，我感谢你，<strong><mark>我不像别人</mark></strong>勒索、不义、奸淫，也不像这个税吏。 我一个礼拜禁食两次，凡我所得的都捐上十分之一。』 <strong><mark>那税吏远远的站着，连举目望天也不敢</mark></strong>，只捶着胸说：『<strong><mark>上帝啊，开恩可怜我这个罪人</mark></strong>！』 我告诉你们：这人回家去比那人倒算为义了。因为<strong><mark>凡自高的，必降为卑；自卑的，必升为高</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/18/#L9-14">路 18:9-14</a>)</p></blockquote><p>参见：<a href="https://bibleox.com/ru/ru/w/смирение">谦卑</a></p><h3>饶恕一切所受的委屈</h3><blockquote><p>“你们站着祷告的时候，若想起有人得罪你们，<strong><mark>就当饶恕他</mark></strong>，好叫你们在天上的父也饶恕你们的过犯。 <strong><mark>你们若不饶恕人，你们在天上的父也不饶恕你们的过犯</mark></strong>〔有古卷无此节〕。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/11/#L25-26">可 11:25-26</a>)</p></blockquote><blockquote><p>“<strong><mark>你们饶恕人的过犯，你们的天父也必饶恕你们的过犯</mark></strong>；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/6/#L14">太 6:14</a>)</p></blockquote><h3>与邻人和睦</h3><blockquote><p>“所以，你在祭坛上献礼物的时候，若想起弟兄向你怀怨， 就把礼物留在坛前，<strong><mark>先去同弟兄和好</mark></strong>，<strong><mark>然后来献礼物</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L23-24">太 5:23-24</a>)</p></blockquote><blockquote><p>“你们作丈夫的也要按情理和妻子同住，因她比你软弱，与你一同承受生命之恩的，所以要敬重她。<strong><mark>这样，便叫你们的祷告没有阻碍</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/3/#L7">彼前 3:7</a>)</p></blockquote><h3>忍耐</h3><blockquote><p>“耶稣设一个比喻，是<strong><mark>要人常常祷告，不可灰心</mark></strong>。 说：「某城里有一个官，不惧怕上帝，也不尊重世人。 那城里有个寡妇，常到他那里，说：『我有一个对头，求你给我伸冤。』 他多日不准。后来心里说：『我虽不惧怕上帝，也不尊重世人， 只因这寡妇烦扰我，我就给他伸冤吧．免得她常来缠磨我！』」 主说：「你们听这不义之官所说的话。 <strong><mark>上帝的选民昼夜呼吁他</mark></strong>，他纵然为他们忍了多时，岂不终久给他们伸冤吗？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/18/#L1-7">路 18:1-7</a>)</p></blockquote><blockquote><p>“耶稣又说：「你们中间谁有一个朋友半夜到他那里去，说：『朋友！请借给我三个饼； 因为我有一个朋友行路，来到我这里，我没有什么给他摆上。』 那人在里面回答说：『不要搅扰我，门已经关闭，孩子们也同我在床上了，我不能起来给你。』 我告诉你们，虽不因他是朋友起来给他，<strong><mark>但因他情词迫切的直求，就必起来照他所需用的给他</mark></strong>。 我又告诉你们：<strong><mark>你们祈求，就给你们</mark></strong>；寻找，就寻见；叩门，就给你们开门。 因为，凡祈求的，就得着；寻找的，就寻见；叩门的，就给他开门。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/11/#L5-10">路 11:5-10</a>)</p></blockquote><h3>施舍（对有需要之人的实际帮助）</h3><blockquote><p>“<strong>祈祷与斋戒固然是善功</strong>，但秉义施舍却超过前二者；秉义而少有，胜于不义而多有；<strong>施舍救济，胜于储蓄黄金</strong>” (<a href="https://bibleox.com/zh-Hans/cn-sb/tov/12/#L8">多 12:8</a>)</p></blockquote><blockquote><p>“（大卫的诗，交与伶长。）<strong><mark>眷顾贫穷的有福了</mark></strong>；他遭难的日子，耶和华必搭救他。 <strong><mark>耶和华必保全他，使他存活</mark></strong>；他必在地上享福，求你不要把他交给仇敌，遂其所愿。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/41/#L1-2">诗 41:1-2</a>)</p></blockquote><blockquote><p>“<strong><mark>怜悯贫穷的，就是借给耶和华</mark></strong>，他的善行，耶和华必偿还。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/19/#L17">箴 19:17</a>)</p></blockquote><blockquote><p>“<strong><mark>你们举手祷告，我必遮眼不看</mark></strong>；就是你们多多的祈祷，我也不听。你们的手都满了杀人的血。 你们要洗濯、自洁，从我眼前除掉你们的恶行；要止住作恶， <strong><mark>学习行善，寻求公平，解救受欺压的，给孤儿伸冤，为寡妇辨屈</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/1/#L15-17">赛 1:15-17</a>)</p></blockquote><blockquote><p>“哥尼流定睛看他，惊怕说：「主啊，什么事呢？」天使说：「<strong><mark>你的祷告和你的赒济达到上帝面前已，蒙记念了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/10/#L4">徒 10:4</a>)</p></blockquote><h3>斋戒</h3><blockquote><p>“耶和华说：「虽然如此，<strong><mark>你们应当禁食，哭泣、悲哀，一心归向我</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iol/2/#L12">珥 2:12</a>)</p></blockquote><blockquote><p>“<strong><mark>我便禁食，披麻蒙灰，定意向主上帝祈祷恳求</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/dan/9/#L3">但 9:3</a>)</p></blockquote><blockquote><p>“<strong><mark>于是禁食祷告</mark></strong>，按手在他们头上，就打发他们去了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/13/#L3">徒 13:3</a>)</p></blockquote><blockquote><p>“<strong><mark>我因禁食，膝骨软弱</mark></strong>；我身上的肉也渐渐瘦了。 &lt;…&gt; 耶和华我的上帝阿，求你帮助我，照你的慈爱拯救我。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/109/#L24,26">诗 109:24,26</a>)</p></blockquote><h3>没有虚伪</h3><blockquote><p>“你们祷告的时候，<strong><mark>不可像那假冒为善的人</mark></strong>，爱站在会堂里和十字路口上祷告，<strong><mark>故意叫人看见</mark></strong>。我实在告诉你们，<strong><mark>他们已经得了他们的赏赐</mark></strong>。 你祷告的时候，要进你的内屋，关上门，<strong><mark>祷告你在暗中的父</mark></strong>，你父在暗中察看，必然报答你。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/6/#L5-6">太 6:5-6</a>)</p></blockquote><h3>没有空虚的多言</h3><p>上面已经说到，需要恒常的祈祷、在祈祷中的坚持和忍耐（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/18/#L1-7">路 18:1-7</a>）。但上帝不是被话语重复的频度安抚的。祈祷必须与上面列举的一切结合：信心、公义、蒙上帝喜悦的行为、远离罪恶、清洁的心、饶恕委屈、与邻人和睦等等。而外邦人<strong>不改变自己</strong>和自己的生活，指望喊叫到他们的神那里；那些神仿佛在睡觉，所以仿佛需要更大声、更频繁地喊叫（见<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/18/#L26-28">王上 18:26-28</a>）。</p><blockquote><p>“你们祷告，不可像外邦人，<strong><mark>用许多重复话</mark></strong>，他们以为话多了必蒙垂听。 <strong><mark>你们不可效法他们</mark></strong>，因为你们没有祈求以先，你们所需用的，你们的父早已知道了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/6/#L7-8">太 6:7-8</a>)</p></blockquote><p>主耶稣基督自己常常整夜祈祷，有时也重复自己的祈祷：</p><blockquote><p>“耶稣又去祷告，<strong><mark>说的话还是与先前一样</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/14/#L39">可 14:39</a>)</p></blockquote><h2>上帝按自己的旨意赐下</h2><blockquote><p>“你们求也得不着，<strong><mark>是因为你们妄求</mark></strong>，要浪费在你们的宴乐中。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/4/#L3">雅 4:3</a>)</p></blockquote><blockquote><p>“<strong><mark>我们若照他的旨意求什么，他就听我们</mark></strong>，这是我们向他所存坦然无惧的心。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/5/#L14">约壹 5:14</a>)</p></blockquote><blockquote><p>“<strong><mark>你们若常在我里面</mark></strong>，<strong><mark>我的话也常在你们里面</mark></strong>，凡你们所愿意的，祈求就给你们成就。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/15/#L7">约 15:7</a>)</p></blockquote><blockquote><p>“你们中间谁有儿子求饼，反给他石头呢？ 求鱼，反给他蛇呢？ 你们虽然不好，尚且知道拿好东西给儿女，<strong><mark>何况你们在天上的父，岂不更把好东西给求他的人吗</mark></strong>？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/7/#L9-11">太 7:9-11</a>)</p></blockquote><h2>私下的祈祷</h2><blockquote><p>“你祷告的时候，<strong><mark>要进你的内屋，关上门</mark></strong>，<strong><mark>祷告你在暗中的父</mark></strong>，你父在暗中察看，必然报答你。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/6/#L6">太 6:6</a>)</p></blockquote><h2>共同的祈祷</h2><blockquote><p>“我又告诉你们：<strong><mark>若是你们中间有两个人在地上同心合意的求什么事</mark></strong>，我在天上的父必为他们成全。 因为无论在那里，<strong><mark>有两三个人奉我的名聚会，那里就有我在他们中间</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/18/#L19-20">太 18:19-20</a>)</p></blockquote><h2>为他人的祈祷</h2><h3>为邻人和教会祈祷</h3><blockquote><p>“所以你们要彼此认罪，<strong><mark>互相代求</mark></strong>，使你们可以得医治。<strong><mark>义人祈祷所发的力量是大有功效的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/5/#L16">雅 5:16</a>)</p></blockquote><blockquote><p>“<strong><mark>也要为我们祷告</mark></strong>，求上帝给我们开传道的门，能以讲基督的奥祕（我为此被捆锁），” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/4/#L3">西 4:3</a>)</p></blockquote><blockquote><p>“<strong><mark>请弟兄们为我们祷告</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1sol/5/#L25">帖前 5:25</a>)</p></blockquote><blockquote><p>“弟兄们，我还有话说：<strong><mark>请你们为我们祷告</mark></strong>，好叫主的道理快快行开，得着荣耀，正如在你们中间一样；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2sol/3/#L1">帖后 3:1</a>)</p></blockquote><blockquote><p>“<strong><mark>请你们为我们祷告</mark></strong>，因我们自觉良心无亏，愿意凡事按正道而行。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/13/#L18">希 13:18</a>)</p></blockquote><blockquote><p>“即使我们软弱，你们刚强，我们也欢喜，并且<strong><mark>我们所求的，就是你们作完全人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/13/#L9">林后 13:9</a>)</p></blockquote><blockquote><p>“因此，<strong><mark>我们常为你们祷告</mark></strong>，愿我们的上帝看你们配得过所蒙的召，又用大能成就你们一切所羨慕的良善和一切因信心所作的工夫；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2sol/1/#L11">帖后 1:11</a>)</p></blockquote><blockquote><p>“<strong><mark>你们以祈祷帮助我们</mark></strong>，好叫许多人为我们谢恩，就是为我们因许多人所得的恩。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/1/#L11">林后 1:11</a>)</p></blockquote><h3>为委屈我们的人祈祷</h3><blockquote><p>“只是我告诉你们：<strong><mark>要爱你们的仇敌，为那逼迫你们的祷告</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L44">太 5:44</a>)</p></blockquote><blockquote><p>“<strong><mark>咒诅你们的，要为他祝福</mark></strong>！<strong><mark>凌辱你们的，要为他祷告</mark></strong>！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L28">路 6:28</a>)</p></blockquote><h3>为犯非致死之罪的人祈祷</h3><blockquote><p>“<strong><mark>人若看见弟兄犯了不至于死的罪，就当为他祈求</mark></strong>，上帝必将生命赐给他；<strong><mark>有至于死的罪，我不说当为这罪祈求</mark></strong>。 凡不义的事都是罪，也有不至于死的罪。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/5/#L16-17">约壹 5:16-17</a>)</p></blockquote><h3>教会的祈祷赦免人的罪</h3><blockquote><p>“你们中间有病了的呢，他就<strong><mark>该请教会的长老来</mark></strong>，他们可以奉主的名用油抹他，为他祷告。 出于信心的祈祷要救那病人，主必叫他起来；<strong><mark>他若犯了罪，也必蒙赦免</mark></strong>。 所以你们要彼此认罪，<strong><mark>互相代求，使你们可以得医治</mark></strong>。义人祈祷所发的力量是大有功效的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/5/#L14-16">雅 5:14-16</a>)</p></blockquote>
