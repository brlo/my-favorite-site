- src: поклоны
  path: QM7A_叩拜
  title: 叩拜
  copy_cover: true
  body: '<h2>向圣殿叩拜</h2><p>向<a href="https://bibleox.com/ru/ru/w/иерусалимский-храм">圣殿</a>叩拜——殿中布满基路伯的圣洁<a href="https://bibleox.com/ru/ru/w/иерусалимский-храм#HH-Изображения">像</a>：</p><blockquote><p>“至于我，我必凭你丰盛的慈爱，进入你的居所；我必存敬畏你的心，<strong><mark>向你的圣殿下拜</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/5/#L7">诗 5:7</a>)</p></blockquote><blockquote><p>“<strong><mark>我要向你的圣殿下拜</mark></strong>，为你的慈爱和诚实称赞你的名；因你使你的话显为大，过于你所应许的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/138/#L2">诗 138:2</a>)</p></blockquote><h2>向上帝的脚凳（圣殿）叩拜</h2><blockquote><p>“你们当尊崇耶和华我们的上帝，<strong><mark>在他脚凳前下拜</mark></strong>；他本为圣！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/99/#L5">诗 99:5</a>)</p></blockquote><blockquote><p>“<strong><mark>我们要进他的居所，在他脚凳前下拜</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/132/#L7">诗 132:7</a>)</p></blockquote><h2>向约柜叩拜</h2><p>先知约书亚在约柜前叩拜——柜的施恩座上有基路伯的像，柜内有圣物：</p><blockquote><p>“约书亚便撕裂衣服；他和以色列的长老把灰撒在头上，在耶和华的约柜前，<strong><mark>俯伏在地，直到晚上</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/nav/7/#L6">书 7:6</a>)</p></blockquote><h2>向以三人形像显现的上帝叩拜</h2><p>亚伯拉罕向以三个人形像显现的上帝叩拜：</p><blockquote><p>“耶和华在幔利橡树那里，<strong><mark>向亚伯拉罕显现出来</mark></strong>。那时正热，亚伯拉罕坐在帐棚门口， 举目观看，<strong><mark>见有三个人在对面站着</mark></strong>。他一见，就从帐棚门口跑去迎接他们，<strong><mark>俯伏在地</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/18/#L1-2">创 18:1-2</a>)</p></blockquote><p>上帝为什么以形像显现？——因为上帝在本性上是看不见的，从来没有人见过他（<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/6/#L16">提前 6:16</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/in/1/#L18">约 1:18</a>）。然而圣经说的是上帝显现（希伯来文 יְהוָ֔ה——雅威）。</p><h2>向物件叩拜</h2><p>杖：亚玛谢大卫 of Genesis 47:31 — see below:</p><p>向杖：经上记着“以色列在床头上敬拜”（<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/47/#L31">创 47:31</a>），而在七十士译本里是“在杖头上”（<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/11/#L21">希 11:21</a>）。</p><h2>向天使叩拜</h2><p>先要指出：天使是灵（<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/1/#L13-14">希 1:13-14</a>），而灵没有骨和肉（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/24/#L39">路 24:39</a>），也就是说，天使也是以人的形像向人显现的。所以，向天使叩拜，就是<strong>向看不见的灵（天使）的看得见之像叩拜</strong>：</p><blockquote><p>“他回答说：「不是的，我来是要作耶和华军队的元帅。」<strong><mark>约书亚就俯伏在地下拜</mark></strong>，说：「我主有什么话吩咐仆人？」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/nav/5/#L14">书 5:14</a>)</p></blockquote><blockquote><p>“那两个天使晚上到了所多玛。<strong><mark>罗得正坐在所多玛城门口</mark></strong>，看见他们，就起来迎接，<strong><mark>脸伏于地下拜</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/19/#L1">创 19:1</a>)</p></blockquote><blockquote><p>“见火焰从坛上往上升，耶和华的使者在坛上的火焰中也升上去了。<strong><mark>玛挪亚和他的妻看见，就俯伏于地</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/sud/13/#L20">士 13:20</a>)</p></blockquote><blockquote><p>“我却听见他说话的声音，一听见就<strong><mark>面伏在地沉睡</mark></strong>了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/dan/10/#L9">但 10:9</a>)</p></blockquote><blockquote><p>“他向我这样说，<strong><mark>我就脸面朝地，哑口无声</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/dan/10/#L15">但 10:15</a>)</p></blockquote><h2>向先知叩拜</h2><p>向以利沙：> 4ts 2:15 :: !先知门徒</p><blockquote><p>“住耶利哥的先知门徒从对面看见他，就说：「感动以利亚的灵感动以利沙了。」他们就来迎接他，<strong><mark>在他面前俯伏于地</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/4ts/2/#L15">王下 2:15</a>)</p></blockquote><p>向以利亚：> 3ts 18:7 :: !俄巴底认出他来，就俯伏在地</p><p>向但以理：> dan 2:46 :: !尼布甲尼撒王俯伏在地，向但以理下拜</p><p>向撒母耳：> 1ts 28:14 :: !扫罗知道是撒母耳，就屈身，脸伏于地下拜</p><p>向亚比该（原文如此：叩拜的是亚比该，向大卫）：> 1ts 25:23 :: !在大卫面前脸伏于地叩拜</p><h2>向民众叩拜</h2><blockquote><p>“<strong><mark>亚伯拉罕就在那地的人民面前下拜</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/23/#L12">创 23:12</a>)</p></blockquote><h2>向弟兄叩拜</h2><blockquote><p>“他自己在他们前头过去，<strong><mark>一连七次俯伏在地</mark></strong>，才就近他哥哥。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/33/#L3">创 33:3</a>)</p></blockquote><blockquote><p>“当时治理埃及地的是约瑟，粜粮给那地众民的就是他。<strong><mark>约瑟的哥哥们来了，脸伏于地，向他下拜</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/42/#L6">创 42:6</a>)</p></blockquote><h2>向岳父叩拜</h2><blockquote><p>“<strong><mark>摩西迎接他的岳父，向他下拜</mark></strong>，与他亲嘴，彼此问安，都进了帐棚。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/18/#L7">出 18:7</a>)</p></blockquote>'
