- src: Писание-не-под-диктовку
  path: Qz6B_圣经不是上帝的口述笔录
  title: 圣经不是上帝的口述笔录
  copy_cover: true
  body: <p>圣经的经文虽然是在上帝之灵的感动下写成的（即上帝所默示的），却不是上帝口述的笔录，书写者也不是上帝手中铅笔那样没有个性的工具。牧人出身的先知用朴素的语言写作，宫廷出身的先知则以饱学之士的笔法写作；两人都采用与自己生活方式相称的比喻。例如，论到使徒保罗，别的使徒写道，他的书信中有难以理解的地方：</p><blockquote><p>“他一切的信上也都是讲论这事。信中<strong>有些难明白的</strong>” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2pet/3/#L16">彼后 3:16</a>)</p></blockquote><p>而使徒保罗自己也说，他在言语上是粗俗的，在知识上却不是：</p><blockquote><p>“<strong>我的言语虽然粗俗</strong>，我的知识却不粗俗” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/11/#L6">林后 11:6</a>)</p></blockquote><p>也就是说，他尽力而写，但在知识上并无亏损。事实上，使徒保罗作为受过教育的法利赛人，确实运用了复杂的意义结构。更进一步，使徒们有时明确宣告，所写的是自己的意见：</p><blockquote><p>“论到童身的人，<strong>我没有主的命令</strong>，但我既蒙主怜恤能作忠心的人，就把<strong>自己的意见告诉</strong>你们。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/7/#L25">林前 7:25</a>)</p></blockquote><p>更准确地说，圣经乃是上帝与人的共同工作（协作，συνεργία）：</p><blockquote><p>“因为我们是<strong>与上帝同工的</strong>；你们是上帝所耕种的田地，所建造的房屋。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/3/#L9">林前 3:9</a>) <em>(συνεργοί，直译为「与上帝同工者」)</em></p></blockquote>
  meta_desc: 圣经是上帝默示写成的，却不是上帝口述的笔录
