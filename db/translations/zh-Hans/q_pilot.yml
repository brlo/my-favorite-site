  title: 得救的人少
  copy_cover: true
  body: <h2>得救的人少</h2><blockquote><p>“有一个人问他说：「主啊，<strong>得救的人少吗</strong>？」 耶稣对众人说：「你们要努力进窄门。我告诉你们：<strong>将来有许多人想要进去，却是不能</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/13/#L23-24">路 13:23-24</a>)</p></blockquote><blockquote><p>“你们要进窄门。因为<strong>引到灭亡，那门是宽的，路是大的</strong>，<strong>进去的人也多</strong>； <strong>引到永生，那门是窄的，路是小的</strong>，<strong>找着的人也少</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/7/#L13-14">太 7:13-14</a>)</p></blockquote><blockquote><p>“当那日，<strong>必有许多人</strong>对我说：『主阿，主阿，我们不是奉你的名传道，奉你的名赶鬼，奉你的名行许多异能吗？』 我就明明地告诉他们说：『<strong>我从来不认识你们，你们这些作恶的人，离开我去吧！</strong>』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/7/#L22-23">太 7:22-23</a>)</p></blockquote><blockquote><p>“你们这<strong>小群</strong>，不要惧怕，因为你们的父乐意把国赐给你们。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/12/#L32">路 12:32</a>)</p></blockquote><blockquote><p>“我的东西难道不可随我的意思用吗？因为我作好人，你就红了眼吗？』 这样，那在后的将要在前；在前的将要在后了〔有古卷在此有『因为被召的人多，<strong>选上的人少</strong>』〕” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/20/#L15-16">太 20:15-16</a>)</p></blockquote><blockquote><p>“于是王对使唤的人说：『捆起他的手脚来，把他丢在外边的黑暗里．在那里必要哀哭切齿了。』 因为被召的人多，<strong>选上的人少</strong>” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/22/#L13-14">太 22:13-14</a>)</p></blockquote><blockquote><p>“我告诉你们，<strong>先前所请的人没有一个得尝我的筵席</strong>” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/14/#L24">路 14:24</a>)</p></blockquote><h2>旧约中得救者寥寥的先例</h2><blockquote><p>“就是天使犯了罪，上帝也没有宽容，曾把他们丢在地狱，交在黑暗坑中，等候审判； <strong>上帝也没有宽容上古的世代</strong>，曾叫洪水临到那不敬虔的世代，却保护了传义道的<strong><mark>挪亚一家八口</mark></strong>； 又判定<strong>所多玛、蛾摩拉，将二城倾覆，焚烧成灰</strong>，作为后世不敬虔人的鉴戒； <strong>只搭救</strong>了那常为恶人淫行忧伤的<strong>义人罗得</strong>。 因为那义人住在他们中间，看见听见他们不法的事，他的义心就天天伤痛。 主知道搭救敬虔的人脱离试探，把不义的人留在刑罚之下，等候审判的日子。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2pet/2/#L4-9">彼后 2:4-9</a>)</p></blockquote><blockquote><p>“<strong>他们遭遇这些事都要作为鉴戒</strong>，并且<strong>写在经上，正是警戒我们这末世的人</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/10/#L11">林前 10:11</a>)</p></blockquote>
