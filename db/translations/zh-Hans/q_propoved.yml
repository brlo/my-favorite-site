  title: 工人少
  copy_cover: true
  body: <blockquote><p>“你们若遵行我的律例，谨守我的诫命， &lt;…&gt; 你们要追赶仇敌，他们必倒在你们刀下。 <strong><mark>你们五个人要追赶一百人，一百人要追赶一万人</mark></strong>，仇敌必倒在你们刀下。 我要眷顾你们，使你们生养众多，也要与你们坚定所立的约。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/26/#L3,7-9">利 26:3,7-9</a>)</p></blockquote><blockquote><p>“就对他们说：「<strong><mark>要收的庄稼多，作工的人少</mark></strong>。所以，<strong><mark>你们当求庄稼的主打发工人出去收他的庄稼</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/10/#L2">路 10:2</a>)</p></blockquote><blockquote><p>“于是对门徒说：「<strong><mark>要收的庄稼多，作工的人少</mark></strong>； 所以，<strong><mark>你们当求庄稼的主，打发工人出去收他的庄稼</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/9/#L37-38">太 9:37-38</a>)</p></blockquote>
