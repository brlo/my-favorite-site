  title: 羞于认自己是信徒
  copy_cover: true
  body: <h2>羞于称自己是属基督的</h2><blockquote><p>“凡在这淫乱罪恶的世代，<strong><mark>把我和我的道当作可耻的</mark></strong>，人子在他父的荣耀里，同圣天使降临的时候，<strong><mark>也要把那人当作可耻的</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/8/#L38">可 8:38</a>)</p></blockquote><blockquote><p>“<strong><mark>凡把我和我的道当作可耻的</mark></strong>，人子在自己的荣耀里，并天父与圣天使的荣耀里降临的时候，<strong><mark>也要把那人当作可耻的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/9/#L26">路 9:26</a>)</p></blockquote><blockquote><p>“<strong>你们的灵魂，要喜乐于天主的仁慈，你们决不会因赞美他而蒙羞受辱。</strong>” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/51/#L37">德 51:37</a>)</p></blockquote><blockquote><p>“<strong><mark>惟有胆怯的、不信的</mark></strong>、可憎的、杀人的、淫乱的、行邪术的、拜偶像的和一切说谎话的，他们的分就在烧着硫磺的火湖里，这是第二次的死。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/21/#L8">启 21:8</a>)</p></blockquote><h2>关于为基督受苦</h2><p><a href="https://bibleox.com/ru/ru/w/страдание-за-Христа">为基督受苦</a></p>
