  title: 使徒长久地教导团体
  copy_cover: true
  body: <p>使徒保罗教导亚西亚的长老们三年之久：</p><blockquote><p>“所以你们应当儆醒，记念我<strong><mark>三年之久昼夜不住的流泪，劝戒你们各人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/20/#L31">徒 20:31</a>)</p></blockquote><p>使徒保罗在以弗所教导基督徒两年零三个月：</p><blockquote><p>“保罗进会堂放胆讲道，<strong><mark>一连三个月</mark></strong>，辩论上帝国的事，劝化众人。 后来，有些人心里刚硬不信，在众人面前毁谤这道。保罗就离开他们，也叫门徒与他们分离，便在推喇奴的学房天天辩论。 <strong><mark>这样有两年之久</mark></strong>，叫一切住在亚西亚的，无论是犹太人，是希利尼人，都听见主的道。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/19/#L8-10">徒 19:8-10</a>)</p></blockquote>
