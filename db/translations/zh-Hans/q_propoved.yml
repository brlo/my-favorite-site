  path: Qp3A_教导
  title: 教导
  copy_cover: true
  body: <blockquote><p>“当用各样的智慧，把基督的道理丰丰富富的存在心里，用诗章、颂词，灵歌，<strong><mark>彼此教导，互相劝戒</mark></strong>，心被恩感，歌颂上帝。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/3/#L16">西 3:16</a>)</p></blockquote><blockquote><p>“所以，<strong><mark>你们该彼此劝慰，互相建立</mark></strong>，正如你们素常所行的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1sol/5/#L11">帖前 5:11</a>)</p></blockquote><blockquote><p>“总要趁着还有今日，<strong><mark>天天彼此相劝</mark></strong>，免得你们中间有人被罪迷惑，心里就刚硬了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/3/#L13">希 3:13</a>)</p></blockquote><blockquote><p>“<strong><mark>又要彼此相顾，激发爱心，勉励行善</mark></strong>。 你们不可停止聚会，好像那些停止惯了的人，<strong><mark>倒要彼此劝勉</mark></strong>。既知道那日子临近，就更当如此。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/10/#L24-25">希 10:24-25</a>)</p></blockquote><blockquote><p>“<strong><mark>然而主的仆人不可争竞</mark></strong>；只要温温和和的待众人，<strong><mark>善于教导</mark></strong>，存心忍耐， <strong><mark>用温柔劝戒那抵挡的人</mark></strong>，或者上帝给他们悔改的心，可以明白真道，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/2/#L24-25">提后 2:24-25</a>)</p></blockquote>
