  path: Qp2A_争论
  title: 争论
  copy_cover: true
  body: <h2>争论的性质</h2><h3>像羊羔一样</h3><blockquote><p>“你们去吧！<strong><mark>我差你们出去，如同羊羔进入狼群</mark></strong>。 &lt;…&gt; 无论进那一城，人若不接待你们，你们就到街上去， 说：『就是你们城里的尘土粘在我们的脚上，我们也当着你们擦去。虽然如此，你们该知道上帝的国临近了。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/10/#L3,10-11">路 10:3,10-11</a>)</p></blockquote><blockquote><p>“<strong><mark>我差你们去，如同羊进入狼群</mark></strong>，所以你们要<strong><mark>灵巧像蛇</mark></strong>，<strong><mark>驯良像鸽子</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/10/#L16">太 10:16</a>)</p></blockquote><h3>温柔与爱</h3><blockquote><p>“只要心里尊主基督为圣。有人问你们心中盼望的缘由，就要常作准备，<strong><mark>以温柔，敬畏的心回答各人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/3/#L15">彼前 3:15</a>)</p></blockquote><blockquote><p>“你要提醒众人，叫他们顺服作官的、掌权的，遵他的命，预备行各样的善事。 不要毁谤，不要争竞，<strong><mark>总要和平，向众人大显温柔</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/tit/3/#L1-2">多 3:1-2</a>)</p></blockquote><blockquote><p>“你要逃避少年的私欲，同那清心祷告主的人追求公义、信德、仁爱、和平。 惟有那愚拙无学问的辩论，总要弃绝，因为知道这等事是起争竞的。 然而主的仆人不可争竞；只要温温和和的待众人，善于教导，<strong><mark>存心忍耐</mark></strong>， <strong><mark>用温柔劝戒那抵挡的人</mark></strong>，或者上帝给他们悔改的心，可以明白真道，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/2/#L22-25">提后 2:22-25</a>)</p></blockquote><blockquote><p>“你们中间谁是有智慧、有见识的呢？<strong><mark>他就当在智慧的温柔上显出他的善行来</mark></strong>。 你们心里若怀着苦毒的嫉妒和纷争，<strong><mark>就不可自夸，也不可说谎话抵挡真道</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/3/#L13-14">雅 3:13-14</a>)</p></blockquote><blockquote><p>“我保罗，就是与你们见面的时候是谦卑的，不在你们那里的时候向你们是勇敢的，<strong><mark>如今亲自借着基督的温柔、和平劝你们</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/10/#L1">林后 10:1</a>)</p></blockquote><blockquote><p>“我为主被囚的劝你们：既然蒙召，<strong><mark>行事为人就当与蒙召的恩相称</mark></strong>。 <strong><mark>凡事谦虚、温柔、忍耐</mark></strong>，用爱心互相宽容，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/4/#L1-2">弗 4:1-2</a>)</p></blockquote><blockquote><p>“<strong><mark>但命令的总归就是爱</mark></strong>，这爱是从清洁的心和无亏的良心、无伪的信心生出来的。 <strong><mark>有人偏离这些，反去讲虚浮的话</mark></strong>， 想要作教法师，却不明白自己所讲说的、所论定的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/1/#L5-7">提前 1:5-7</a>)</p></blockquote><blockquote><p>“我若能说万人的方言，并天使的话语，<strong><mark>却没有爱，我就成了鸣的锣、响的钹一般</mark></strong>。 我若有先知讲道之能，也明白各样的奥祕、各样的知识，而且有全备的信，叫我能够移山，<strong><mark>却没有爱，我就算不得什么</mark></strong>。 我若将所有的赒济穷人，又舍己身叫人焚烧，<strong><mark>却没有爱，仍然与我无益</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/13/#L1-3">林前 13:1-3</a>)</p></blockquote><blockquote><p>“<strong><mark>惟独从上头来的智慧，先是清洁，后是和平，温良柔顺，满有怜悯，多结善果，没有偏见，没有假冒</mark></strong>。 并且使人和平的，是用和平所栽种的义果。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/3/#L17-18">雅 3:17-18</a>)</p></blockquote><h2>避免愚拙的争辩</h2><blockquote><p>“你要逃避少年的私欲，同那清心祷告主的人追求公义、信德、仁爱、和平。 惟有那愚拙无学问的辩论，<strong><mark>总要弃绝</mark></strong>，因为知道这等事是起争竞的。 然而<strong><mark>主的仆人不可争竞</mark></strong>；只要温温和和的待众人，善于教导，存心忍耐， <strong><mark>用温柔劝戒那抵挡的人</mark></strong>，或者上帝给他们悔改的心，可以明白真道，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/2/#L22-25">提后 2:22-25</a>)</p></blockquote><blockquote><p>“若有人传异教，不服从我们主耶稣基督纯正的话与那合乎敬虔的道理， 他是自高自大，一无所知，<strong><mark>专好问难，争辩言词</mark></strong>，<strong><mark>从此就生出嫉妒、纷争、毁谤、妄疑</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/6/#L3-4">提前 6:3-4</a>)</p></blockquote><blockquote><p>“你要使众人回想这些事，在主面前嘱咐他们：<strong><mark>不可为言语争辩</mark></strong>，这是没有益处的，<strong><mark>只能败坏听见的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/2/#L14">提后 2:14</a>)</p></blockquote><blockquote><p>“<strong><mark>要远避无知的辩论</mark></strong>和家谱的空谈以及纷争，并因律法而起的争竞，<strong><mark>因为这都是虚妄无益的</mark></strong>。 <strong><mark>分门结党的人</mark></strong>，警戒过一两次，<strong><mark>就要弃绝他</mark></strong>。 因为知道这等人已经背道，犯了罪，自己明知不是，还是去作。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/tit/3/#L9-11">多 3:9-11</a>)</p></blockquote>
