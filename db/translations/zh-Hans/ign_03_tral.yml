    title: 致特拉勒斯人书
    meta_desc: 安提阿的圣伊格那丢（提阿弗罗斯）写给特拉勒斯教会的书信。译自希腊文原文，附注释。
    menu: { parent: "书信", title: "致特拉勒斯人书", priority: 6 }
    body: |-
      <h2>0</h2><p>伊格那丢，又名提阿弗罗斯，致在亚细亚特拉勒斯的圣洁教会：这教会蒙耶稣基督之父上帝所爱，是蒙拣选、配得上帝的；借着我们的盼望耶稣基督的受难，又借着我们复活归于祂，在肉身和灵性上都得享平安。我照着使徒的方式，以满溢的问候向这教会问安[1]，并愿你们满得喜乐。</p>
      <h2>1</h2><p>1. 我知道你们在忍耐中有无瑕、坚定不移的心志，这不是出于一时的习惯，而是出于本性。这是你们的主教波利比乌向我说明的。他按着上帝和耶稣基督的旨意来到士每拿，与在基督耶稣里被捆绑的我一同大大欢喜，以致我在他身上看见了你们全体。</p><p>2. 于是我借着他接受了你们按着上帝而有的善意，就荣耀上帝，因为我发现你们正如我所知道的，是效法上帝的人[2]。</p>
      <h2>2</h2><p>1. 你们顺服主教如同顺服耶稣基督的时候，在我看来，你们就不是按着人生活，而是按着为我们死了的耶稣基督生活，使你们因信祂的死，得以逃避死亡。</p><p>2. 所以，正如你们现在所做的，你们必须撇开主教就什么都不做，又要顺服司祭团，如同顺服我们的盼望耶稣基督的使徒们；我们若在祂里面生活，就必在祂里面被找到。</p><p>3. 那些作耶稣基督奥秘之仆役的辅祭[3]，也应当在各方面使众人喜悦。因为他们不是饮食的仆役，而是上帝教会的仆人[4]。所以，他们必须像避火一样避免受人指责。</p>
      <h2>3</h2><p>1. 同样，众人都要尊重辅祭如同尊重耶稣基督，也要尊重主教如同尊重父的预像[5]，尊重司祭们如同尊重上帝的议会和使徒的团体。没有这些，就不能称为教会。</p><p>2. 我深信你们在这些事上正是如此。因为我已经在你们的主教身上领受了你们之爱的活榜样，并且他现在还和我在一起；他的举止本身就是一大教导，他的温柔就是力量。我想，连不信上帝的人也会尊重他。</p><p>3. 我因爱你们而有所保留，其实我可以为此写得更严厉些。我从来没有想过，自己一个被定罪的人，要像使徒那样吩咐你们。</p>
      <h2>4</h2><p>1. 我在上帝里明白许多事，但我自我节制，免得因夸口而灭亡。因为现在我更应当畏惧，不理会那些使我自高的人；那些对我（说称赞话）的人，其实是在鞭打我[6]。</p><p>2. 我固然渴望受苦，但不知道自己是否配得。这份热切许多人看不出来，却更猛烈地攻击我[7]。所以，我需要温柔；这世代之王正是借着温柔被消灭的。</p>
      <h2>5</h2><p>1. 难道我不能把天上的事写给你们吗？只是我怕你们还是婴孩，反而给你们带来伤害[8]。请你们原谅我，免得你们不能领受，就被噎住了。</p><p>2. 至于我自己，虽然被捆绑，能明白天上的事、天使的阶位和执政者的集团、看得见和看不见的事物[9]，却不能因此就已经是门徒了。我们还缺少许多，才能不缺少上帝。</p>
      <h2>6</h2><p>1. 所以我劝你们——不是我，而是耶稣基督的爱劝你们——只用基督徒的食物，远避异样的植物，就是异端。</p><p>2. 这些人为了取得信任，把耶稣基督掺杂在自己的教训里，好像把致命的毒药掺在蜜酒里给人；不知情的人欢欢喜喜地接过来，在邪恶的享乐中领受了死亡。</p>
      <h2>7</h2><p>1. 所以，你们要提防这样的人。你们若不自高自大，不与上帝耶稣基督、与主教、与使徒们的规定分离，就能做到这一点。</p><p>2. 在祭坛之内的人是洁净的，在祭坛之外的人是不洁净的[10]；就是说，撇开主教、司祭团和辅祭而行事的人，他的良心是不洁净的。</p>
      <h2>8</h2><p>1. 我写这些，不是因为知道你们中间有这样的事，而是因为你们是我所爱的，我预见到魔鬼的诡计，要预先保护你们。所以，你们要穿上温柔，在信——就是主的肉身——和爱——就是耶稣基督的血——中使自己更新。</p><p>2. 你们谁也不要对邻舍怀恨。不要给外邦人留下把柄，免得因几个愚昧的人，使在上帝里的众人遭到亵渎。因为“那使我的名在一些人中间徒然受亵渎的人有祸了”[11]。</p>
      <h2>9</h2><p>1. 所以，若有人撇开耶稣基督向你们讲论，你们就要塞耳不听。祂出于大卫的后裔，出于马利亚，真实地诞生，吃过也喝过，真实地在本丢彼拉多手下受了逼迫，在天上、地上和地下的众生眼前[12]真实地被钉十字架而死。</p><p>2. 祂也真实地从死人中复活了，是祂的父使祂复活的；祂的父也必照样在基督耶稣里使我们这些信祂的人复活[13]。离了祂，我们就没有真实的生命。</p>
      <h2>10</h2><p>然而，如果像某些无神的人——就是不信的人——所说的，祂受苦只是表面上的[14]——其实他们自己才只是表面上的——那么我为什么被捆绑？为什么还祈求与野兽搏斗？那我岂不是白白地死了吗？那我岂不是在为主作假见证了吗[15]？</p>
      <h2>11</h2><p>1. 所以，你们要逃避那些结出致死果子的坏枝子；人一尝它，立刻就死。因为这些人不是父所栽种的[16]。</p><p>2. 他们若是父所栽种的，就必显为十字架的枝子，他们的果子也必是不朽坏的。基督正是借着十字架，在祂的受难中召唤你们这些作祂肢体的人[17]。头不能没有肢体而单独诞生，因为上帝应许了合一，而这合一就是祂自己。</p>
      <h2>12</h2><p>1. 我从士每拿，连同与我在一起的上帝众教会，向你们问安。他们在各样事上，在肉身和灵性上都使我得到安慰。</p><p>2. 我为耶稣基督的缘故带着这些锁链，祈求得着上帝；这些锁链劝勉你们：要持守你们的同心，彼此代祷。你们各人，特别是司祭们，理当为了父、耶稣基督和使徒们的尊荣，使主教得到安慰。</p><p>3. 我愿你们在爱中听从我，免得我所写的成为不利于你们的见证。也请你们为我祷告；我在上帝的怜悯中需要你们的爱，好使我配得那为我所定的产业，不至成为被弃绝的人[18]。</p>
      <h2>13</h2><p>1. 士每拿人和以弗所人的爱向你们问安。请你们在祷告中记念叙利亚的教会；我是那教会中最小的，不配被称为其中的一员[19]。</p><p>2. 愿你们在耶稣基督里安好，顺服主教如同顺服诫命，也照样顺服司祭团。你们各人要以不分裂的心彼此相爱。</p><p>3. 我的灵为你们献上[20]，不但现在如此，我得着上帝的时候也是如此。因为我还在危险之中；但父在耶稣基督里是信实的，必成全我的和你们的祈求[21]。愿你们在祂里面被看为无可指摘。</p>
    references: |-
      <ol><li><p>ἐν τῷ πληρώματι ἐν ἀποστολικῷ χαρακτῆρι。意思是：照着使徒们在书信中问安的方式，向教会全体问安。也有人理解为“在使徒权柄的丰满中”。</p></li><li><p>古拉丁文译本和亚美尼亚文译本作“我发现你们是效法上帝的人，就荣耀（上帝）”，本译文随从这个读法。</p></li><li><p>辅祭被称为“耶稣基督奥秘的仆役”，一般认为指他们在圣体血圣事中的服务（参见<a href="https://bibleox.com/zh-Hans/cn-sb/1kor/4/#L1">格前 4:1</a>）。</p></li><li><p>与使徒行传第6章中“管理饭食”的职务相对照（参见<a href="https://bibleox.com/zh-Hans/cn-sb/act/6/#L2">宗 6:2</a>）。</p></li><li><p>τύπος，意为“预像、形象”。主教被看作代表父上帝的形象（参见<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4M_致马格尼西亚人书#HH-6">《致马格尼西亚人书》6:1</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4M_致马格尼西亚人书#HH-3">《致马格尼西亚人书》3:1</a>）。</p></li><li><p>一般认为是指那些对伊格那丢说“你将成为殉道者”来称赞他的人。称赞成为骄傲的诱惑，所以他说这是“鞭打”。</p></li><li><p>指殉道的热望。伊格那丢担心其中会掺杂骄傲和虚荣的念头。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/1kor/3/#L1-2">格前 3:1-2</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/kol/1/#L16">哥 1:16</a>。</p></li><li><p>“祭坛”是指信徒为领圣体血而聚集的教会（参见<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4E_致以弗所人书#HH-5">《致以弗所人书》5:2</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4F_致非拉铁非人书#HH-4">《致非拉铁非人书》第4章</a>）。</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-sb/is/52/#L5">依 52:5</a>（按七十士译本）。又见<a href="https://bibleox.com/zh-Hans/cn-sb/rim/2/#L24">罗 2:24</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/fil/2/#L10">斐 2:10</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/2kor/4/#L14">格后 4:14</a>。</p></li><li><p>τὸ δοκεῖν，意为“表面上、看起来如此”。这是指幻影论者（多克特派），他们主张基督并没有真正的肉身，受苦也只是表面的。伊格那丢在第9章用反复出现的“真实地”来回答他们。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/1kor/15/#L14-15">格前 15:14-15</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/mf/15/#L13">玛 15:13</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4F_致非拉铁非人书#HH-3">《致非拉铁非人书》3:1</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/1kor/12/#L27">格前 12:27</a>。</p></li><li><p>ἀδόκιμος，“被弃绝的人”（参见<a href="https://bibleox.com/zh-Hans/cn-sb/1kor/9/#L27">格前 9:27</a>）。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/1kor/15/#L8-9">格前 15:8-9</a>。</p></li><li><p>ἁγνίζεται ὑμῶν τὸ ἐμὸν πνεῦμα。与<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4E_致以弗所人书#HH-8">《致以弗所人书》8:1</a>相同的献身用语。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/1sol/5/#L24">得前 5:24</a>。</p></li></ol>
      <p>翻译：罗季翁·弗拉索夫（借助人工智能工具）。底本：希腊文原文（<a href="https://bibleox.com/zh-Hans/grc/w/ΙγνΘ_Τραλ">本站的希腊文版本</a>，明显的脱漏据莱特福特本和霍姆斯本补足）。参考：俄文译本（《早期教父文选》，布鲁塞尔，1988年）、英文译本（Roberts–Donaldson）、法文译本（Genoude，1837年）。圣经链接指向本站的思高本。</p>
