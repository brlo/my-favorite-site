    title: 致士每拿人书
    meta_desc: 安提阿的圣伊格那丢（提阿弗罗斯）写给士每拿教会的书信，讲述基督降生成人和圣体血的真实。译自希腊文原文，附注释。
    menu: { parent: "书信", title: "致士每拿人书", priority: 5 }
    body: |-
      <h2>0</h2><p>伊格那丢，又名提阿弗罗斯[1]，致在亚细亚士每拿的父上帝和蒙爱的耶稣基督的教会：这教会在各样恩赐中蒙了怜悯，充满了信与爱，不缺少任何恩赐，最配得上帝，承载着圣物。愿你们在无瑕的灵和上帝的道中满得喜乐。</p>
      <h2>1</h2><p>1. 我荣耀耶稣基督——这位使你们如此有智慧的上帝。因为我看出你们在不可动摇的信中得以成全，在肉身和灵性上好像被钉在主耶稣基督的十字架上，又因基督的血在爱中得以坚立。你们对我们的主满有确信：祂按肉身真是出于大卫的后裔[2]，按上帝的旨意和大能是上帝的儿子，真是由童贞女所生，受了约翰的洗，为要“尽诸般的义”[3]；</p><p>2. 祂在本丢彼拉多和分封王希律[4]手下，为我们在肉身中真实地被钉住——我们就是从这果实，就是从祂蒙上帝祝福的受难而生的——为要借着祂的复活，为祂在犹太人或外邦人中的圣徒和信徒，在祂教会的一个身体中[5]，竖立一面旗帜，直到永远[6]。</p>
      <h2>2</h2><p>祂为我们受了这一切苦，为要使我们得救。祂真实地受了苦，也真实地使自己复活了；并不像某些不信的人所说的，祂受苦只是表面上的[7]——其实他们自己才只是表面上的。他们怎样想，事情也必怎样临到他们：他们必成为没有身体、如同鬼魔一样的东西。</p>
      <h2>3</h2><p>1. 因为我知道并且相信，祂在复活以后仍在肉身之中。</p><p>2. 祂来到彼得和与他在一起的人那里时，对他们说：“你们摸我看看，我并不是没有身体的鬼魔。”[8]他们立刻摸了祂，就信了，与祂的肉身和灵紧密结合。因此他们也藐视死亡，并被看为超越死亡的人。</p><p>3. 复活以后，祂作为有肉身的，与他们同吃同喝[9]，虽然祂在灵里与父合而为一。</p>
      <h2>4</h2><p>1. 亲爱的，我劝勉你们这些事，是因为知道你们也是如此。但我要预先保护你们，提防那些人形的野兽。你们不但不可接待他们，如果可能，连见面也不要；只要为他们祷告，看他们是否会悔改。这虽然困难，但我们真实的生命耶稣基督有这样的权能。</p><p>2. 如果这些事是我们的主只在表面上做的，那么我被捆绑也只是表面上的了。我为什么把自己交给死亡、交给火、交给刀剑、交给野兽呢？不，靠近刀剑就是靠近上帝，在野兽中间就是在上帝中间；只要是奉耶稣基督的名就好。为了与祂一同受苦，我忍受一切，那成为完全之人的祂[10]使我刚强。</p>
      <h2>5</h2><p>1. 有些人出于无知而否认祂，其实倒是他们被祂否认了[11]；他们是死亡的辩护者，而不是真理的辩护者。先知的预言没有说服他们，摩西的律法没有说服他们，直到如今福音也没有说服他们，我们各人所受的苦也没有说服他们。</p><p>2. 他们对我们也是这样想的[12]。若有人称赞我，却亵渎我的主，不承认祂是承载肉身的，这对我有什么益处呢？说这话的人就是完全否认了祂，他自己才是承载尸体的[13]。</p><p>3. 他们的名字既是不信的，我认为不必写出来。在他们悔改、回到受难——这就是我们的复活——之前，愿我连想都不要想起他们。</p>
      <h2>6</h2><p>1. 谁也不要自欺：天上的事物、天使的荣耀、看得见和看不见的执政者[14]，如果不信基督的血，也要受审判。“能领受的，就领受吧。”[15]不要让地位使任何人自高自大，因为一切都在于信与爱，没有什么比这更重要的。</p><p>2. 你们要留意那些对临到我们的耶稣基督的恩典持异样见解的人，看他们是怎样与上帝的心意作对。他们不关心爱，不关心寡妇，不关心孤儿，不关心受压迫的人，不关心被捆绑或被释放的人，也不关心饥饿或口渴的人。</p>
      <h2>7</h2><p>1. 他们远离感恩祭（圣体血圣事）和祷告，因为他们不承认感恩祭是我们的救主耶稣基督的肉身——这肉身为我们的罪受了苦，父又因祂的慈爱使之复活了[16]。所以，那些反对上帝恩赐的人，在争辩中死去。他们若守爱筵[17]，对他们是有益的，好使他们也能复活。</p><p>2. 你们理当远避这样的人，无论私下或公开都不要谈论他们，却要留心先知，特别是福音；在福音中，受难向我们显明了，复活也成全了。要逃避分裂，因为分裂是邪恶的开端。</p>
      <h2>8</h2><p>1. 你们众人都要跟随主教，如同耶稣基督跟随父；要跟随司祭团，如同跟随使徒们；要尊重辅祭，如同尊重上帝的诫命。撇开主教，谁也不可做任何属于教会的事。唯有在主教之下、或由他所委托的人所举行的感恩祭，才被视为确实可靠的。</p><p>2. 主教在哪里出现，会众也应当在哪里，正如耶稣基督在哪里，大公教会[18]就在哪里。撇开主教，不可施洗，也不可举行爱筵[19]；凡他所认可的，也是上帝所喜悦的，好使你们所做的一切都稳妥可靠。</p>
      <h2>9</h2><p>1. 趁我们还有时间向上帝悔改，我们清醒过来是合理的。认识上帝和主教是美好的。尊敬主教的，必蒙上帝尊敬；瞒着主教做事的，就是在事奉魔鬼。</p><p>2. 所以，愿一切都在恩典中丰丰富富地临到你们，因为你们是配得的。你们在各样事上使我得到安慰；愿耶稣基督也使你们得到安慰。我不在的时候和在的时候，你们都爱我。上帝是你们的报偿；你们为祂忍受一切，就必得着祂。</p>
      <h2>10</h2><p>1. 斐罗和雷乌斯·阿加托普斯为上帝的道跟随我，你们接待他们如同接待上帝的仆役，做得很好。他们也为你们感谢主，因为你们用各样方法使他们得到安慰。你们所做的，没有一样会落空。</p><p>2. 我的灵和我的锁链是你们的替代生命[20]；你们没有轻视这锁链，也没有以它为耻[21]。完全的盼望耶稣基督，也必不以你们为耻。</p>
      <h2>11</h2><p>1. 你们的祷告已经达到叙利亚的安提阿教会；我从那里戴着最配得上帝的锁链而来，问候众人。我不配属于那里，因为我是他们中最小的；但我按着（上帝的）旨意蒙了这份恩宠，不是出于我的良心，而是出于上帝的恩典。我祈求这恩典完全赐给我，好使我借着你们的祷告得着上帝。</p><p>2. 所以，为使你们的工作在地上和天上都得以完全，你们的教会理当为上帝的荣耀选立[22]一位上帝的使节，到叙利亚去，与他们同乐，因为他们得享平安，恢复了原有的伟大，他们自己的团体（身体）也重建起来了。</p><p>3. 在我看来，派你们中间一人带着书信去，与他们一同颂赞上帝赐给他们的风平浪静，是配得上帝的事；借着你们的祷告，他们已经到达港口了。你们既是完全的人，也要思念完全的事[23]。因为你们若愿意行善，上帝总是乐意赐予。</p>
      <h2>12</h2><p>1. 在特罗亚的弟兄们的爱向你们问安；我正是从特罗亚，托布鲁斯带这封信给你们。他是你们和你们的弟兄以弗所人一同派来与我同行的，在各样事上使我得到安慰。但愿众人都效法他，因为他是事奉上帝的活榜样。愿恩典在各样事上报答他。</p><p>2. 我问候配得上帝的主教、配得上帝的司祭团、我的同作仆人的辅祭们，以及你们每一个人和全体；奉耶稣基督的名，在祂的肉身和血中，在祂肉身和灵性的受难与复活中，在上帝与你们的合一中问候你们。愿恩典、怜悯、平安、忍耐常与你们同在。</p>
      <h2>13</h2><p>1. 我问候我弟兄们的家人，连同他们的妻子和儿女，也问候那些被称为寡妇的童贞女[24]。愿你们在父的大能中安好。与我在一起的斐罗向你们问安。</p><p>2. 我问候陶伊娅一家；我祈求她在肉身和灵性的信与爱中坚立。我问候阿尔刻——我所爱慕的名字，问候无与伦比的达弗努斯，问候欧特克努斯，并一一问候所有的人。愿你们在上帝的恩典中安好。</p>
    references: |-
      <ol><li><p>伊格那丢从特罗亚托辅祭布鲁斯把这封信送到士每拿（<a href="#HH-12">12:1</a>）。他先称赞士每拿人坚信基督的降生成人和受难，然后驳斥否认基督的降生、受难和复活之真实性的幻影论者（第2–7章），劝勉他们顺服主教（第8–9章），最后致谢并问安（第10–13章）。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/rim/1/#L3-4">罗 1:3-4</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/mf/3/#L15">玛 3:15</a>。</p></li><li><p>加利利的分封王希律·安提帕（参见<a href="https://bibleox.com/zh-Hans/cn-sb/lk/3/#L1">路 3:1</a>、<a href="https://bibleox.com/zh-Hans/cn-sb/lk/23/#L7">路 23:7</a>）。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/ef/2/#L16">弗 2:16</a>。</p></li><li><p>σύσσημον，“旗帜”。参见<a href="https://bibleox.com/zh-Hans/cn-sb/is/49/#L22">依 49:22</a>。意思是：万民要聚集到被钉十字架又复活的基督这里来。</p></li><li><p>τὸ δοκεῖν，“表面上”。参见<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4T_致特拉勒斯人书#HH-10">《致特拉勒斯人书》第10章</a>的注释。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/lk/24/#L39">路 24:39</a>。伊格那丢所引用的这句话，与路加福音的措辞略有不同；有人认为出于口传，也有人认为出于次经文献（哲罗姆提到《拿撒勒人福音》，奥利金提到《彼得的教导》）。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/lk/24/#L42-43">路 24:42-43</a>、<a href="https://bibleox.com/zh-Hans/cn-sb/act/10/#L41">宗 10:41</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/ef/4/#L13">弗 4:13</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/mf/10/#L33">玛 10:33</a>。</p></li><li><p>意思是：他们认为我们的受苦（殉道）也只是表面上的。</p></li><li><p>σαρκοφόρος“承载肉身的”与 νεκροφόρος“承载尸体的”构成双关语。</p></li><li><p>指包括天使品级在内的天上的权能。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/mf/19/#L12">玛 19:12</a>。</p></li><li><p>幻影论者不承认感恩祭（圣体血）是受了苦、又被父复活的基督真实的肉身。若说感恩祭只是基督身体的“象征”，谁都可以承认；他们所拒绝的，正是它是真实的肉身（参见<a href="https://bibleox.com/zh-Hans/cn-sb/in/6/#L54">若 6:54</a>）。</p></li><li><p>ἀγαπᾶν。直译为“去爱”，但这里理解为“守爱筵”，即与感恩祭相连的爱筵（阿加佩）。上下文是在讲感恩祭；“使他们也能复活”这个目的，正呼应主所说吃祂的肉、喝祂的血的人，在末日必被复活的话（<a href="https://bibleox.com/zh-Hans/cn-sb/in/6/#L54">若 6:54</a>）。而且同一个词在<a href="#HH-8">8:2</a>中，明显是指没有主教许可就不可举行的爱筵——说没有主教的许可就不能“爱”，是讲不通的，所以那里显然是指爱筵。</p></li><li><p>ἡ καθολικὴ ἐκκλησία，“普世的、整体的教会”。在现存文献中，这是这个说法第一次出现。中文的尼西亚–君士坦丁堡信经中译作“至一、至圣、大公、使徒的教会”。</p></li><li><p>ἀγάπην ποιεῖν，“举行爱筵（阿加佩）”，即当时与擘饼（感恩祭）相连的教会共同的晚餐。</p></li><li><p>ἀντίψυχον。参见<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4E_致以弗所人书#HH-21">《致以弗所人书》21:1</a>的注释。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/2tim/1/#L16">弟后 1:16</a>。</p></li><li><p>θεοπρεσβευτής，“上帝的使节”。关于 χειροτονῆσαι（选立），参见<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4F_致非拉铁非人书#HH-10">《致非拉铁非人书》10:1</a>的注释。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/fil/3/#L15">斐 3:15</a>。</p></li><li><p>这表明被教会登记为寡妇、担任服务的妇女中，也有童贞女（参见<a href="https://bibleox.com/zh-Hans/cn-sb/1tim/5/#L3-10">弟前 5:3-10</a>）。</p></li></ol>
      <p>翻译：罗季翁·弗拉索夫（借助人工智能工具）。底本：希腊文原文（<a href="https://bibleox.com/zh-Hans/grc/w/ΙγνΘ_Σμ">本站的希腊文版本</a>，明显的脱漏据莱特福特本和霍姆斯本补足）。参考：俄文译本（《早期教父文选》，布鲁塞尔，1988年）、英文译本（Roberts–Donaldson）、法文译本（Genoude，1837年）。圣经链接指向本站的思高本。</p>
