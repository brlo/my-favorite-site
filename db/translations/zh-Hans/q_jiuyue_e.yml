  path: QO13A_摩西律法中的妇女
  title: 摩西律法中的妇女
  copy_cover: true
  body: <p>律法主要描述女性特有的生活情境，以及两性关系中的种种情境。其中可以分出如下几个领域：</p><ul><li><p>生育（<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/12/">利 12:</a>）</p></li><li><p>血漏（<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/15/#L19-30">利 15:19-30</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/18/#L19">利 18:19</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/20/#L18">利 20:18</a>）</p></li><li><p>赤露（<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/18/">利 18:</a>）</p></li><li><p>与男人的关系、择夫（<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/19/#L20">利 19:20</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/21/#L7-14">利 21:7-14</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/5/#L12-31">民 5:12-31</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/36/">民 36:</a>）</p></li><li><p>许愿（<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/27/#L3-8">利 27:3-8</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/6/">民 6:</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/30/#L4-17">民 30:4-17</a>）</p></li><li><p>犯罪堕落（<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/19/#L20">利 19:20</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/20/#L10-21">利 20:10-21</a>）</p></li></ul><p>下面按上述次序分别讨论这些领域。</p><h2>生育</h2><p>妇女生产之后，律法规定了洁净的日子，并且按所生婴儿的性别而不同。生男婴后，妇人要不洁七天，并有33天的洁净期，在此期间她不可摸任何圣物，也不可进圣所（<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/12/#L2-4">利 12:2-4</a>）。若是生女婴，这些日子相应地加倍（<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/12/#L5">利 12:5</a>）。</p><h2>血漏</h2><p>首先应当提到，律法说人身上有任何流出，就使他成为不洁的：</p><blockquote><p>“「你们晓谕以色列人说：『<strong><mark>人若身患漏症，他因这漏症就不洁净了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/15/#L2">利 15:2</a>)</p></blockquote><p>尽管如此，关于妇女，出于可以理解的原因，另有单独且相当详尽的记述。</p><p>大体上，妇人患血漏的日子就为不洁，此后还有7天的洁净期。若她一直患血漏，就一直不洁。不洁的妇人不能与丈夫同房；否则丈夫也将与妻子同样不洁，加在妻子身上的条例同样加在丈夫身上。患血漏的妇人所坐所触之物都成为不洁，凡接触这些的，必不洁到晚上。洁净的日子之后，要献上两只斑鸠或两只雏鸽为祭（<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/15/#L29-30">利 15:29-30</a>），此后妇人才算为洁净。</p><p>还有其他与妇女和血漏有关的律法规定，将在下面各节中论及。</p><h2>赤露</h2><blockquote><p>“<strong><mark>你们都不可露骨肉之亲的下体</mark></strong>，亲近他们。我是耶和华。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/18/#L6">利 18:6</a>)</p></blockquote><p>虽然这一章也提到男人（父亲）的赤露，但按情理，主要列举的是对各种亲属关系——不仅是骨肉之亲——的妇女露体的禁令：</p><blockquote><p>“<strong><mark>不可露你儿妇的下体</mark></strong>。<strong><mark>她是你儿子的妻，不可露她的下体</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/18/#L15">利 18:15</a>)</p></blockquote><p>回到前面提到的血漏律法，再看这条丈夫对妻子的禁令：</p><blockquote><p>“<strong><mark>女人行经不洁净的时候，不可露她的下体，与她亲近</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/18/#L19">利 18:19</a>)</p></blockquote><h2>与男人的关系、择夫</h2><p>若男人引诱已许配别人的婢女，他不像引诱自由人（即非婢女）那样要被处死（<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/22/#L25">申 22:25</a>），而只须献赎愆祭——公绵羊（<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/19/#L20-21">利 19:20-21</a>）。</p><p>夫妻同房之后到晚上都算不洁（<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/15/#L18">利 15:18</a>）。</p><p>只有童女可以作祭司的妻子（<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/21/#L13">利 21:13</a>），不可娶寡妇、被休的、被玷污的或妓女。</p><p>若妇女因没有男嗣而承受地业，她只能嫁给自己父亲支派中的人（<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/36/#L8">民 36:8</a>），免得产业从一个支派转到另一个支派。</p><p>甚至有一条规定，描述丈夫怀疑妻子犯奸淫时所应行的程序（<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/5/#L12-31">民 5:12-31</a>）。</p><h2>许愿（向上帝所许的愿）</h2><p>有人向上帝许特别的愿，其中一些被称为拿细耳人（不要混淆：耶稣基督被称为拿撒勒人，因为他来自拿撒勒）；他们许愿不喝任何葡萄制品，不剃头发，不挨近死尸。这样的愿可以为一段时期而许，也可以许终身。提到这一点，只是为了强调一个事实：拿细耳人既有男人，也有妇女。</p><p>律法允许赎回卖出的东西（<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/25/#L25">利 25:25</a>）；类似地，对经在圣所事奉而将自己献给上帝的人，也规定了赎价。这里可以注意：男人和女人的生命估价不同。例如，20至60岁的男子估为50舍客勒圣所银子，女子为30舍客勒（<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/27/#L3-4">利 27:3-4</a>）。这一差别，洛普欣解释为：每个情形中所估的是献身圣所者的不同劳动能力，因为圣所需要他作体力劳动：砍柴、打水等等。</p><blockquote><p>“人若向耶和华许愿或起誓，要约束自己，<strong><mark>就不可食言，必要按口中所出的一切话行</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/30/#L2">民 30:2</a>) <em>(俄文本编号为 Числ 30:3。)</em></p></blockquote><p>这样，谁许了愿，谁就必须还愿；但对妇女有附带条件。若妻子许了愿或起了誓，丈夫听见了，可以废掉她所许的愿，那愿就算没有了。父亲也可以照样废掉他女儿年幼时所许、他所听见的愿。</p><h2>犯罪堕落</h2><p>这里记述了一系列对罪施以严厉刑罚的法律，例如：</p><ul><li><p>奸淫（<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/20/#L10-12">利 20:10-12</a>），</p></li><li><p>兽淫（特别论到妇女：<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/20/#L16">利 20:16</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/18/#L23">利 18:23</a>），</p></li><li><p>男色（同性苟合）（<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/20/#L13">利 20:13</a>）等等。</p></li></ul><p>这类违背律法的罪行要处以死刑。</p>
