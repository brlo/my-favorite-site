  path: QW4A_敬礼圣人
  title: 敬礼圣人
  copy_cover: true
  body: <h2>前言</h2><p>圣义者和天使受敬礼，不是作为神，而是作为上帝的朋友。受敬礼的不是他们本身，而是因为他们分有上帝、因为他们里面存有上帝的恩典（见<a href="https://bibleox.com/ru/ru/w/человек-храм-Божий">人——上帝的殿</a>一文）。按圣经，受敬礼的不只是上帝；叩拜不只是向上帝行；上帝亲自呼召人寻求从上帝来的荣耀；上帝应许荣耀义人，并且荣耀了他们；教会追随上帝，荣耀上帝圣洁的朋友们。</p><p>上帝在圣徒生前、也藉着他们<strong>死后肉身</strong>（<a href="https://bibleox.com/zh-Hans/cn-cuv/4ts/13/#L21">王下 13:21</a>）、<strong>遗物</strong>（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/19/#L12">徒 19:12</a>）和<strong>像</strong>（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/5/#L15-16">徒 5:15-16</a>）赐下自己的恩典，所以这一切也都受敬礼。详见相应条目：</p><ul><li><p><a href="https://bibleox.com/ru/ru/w/мощи-или-останки-праведников">敬礼圣髑</a>；</p></li><li><p><a href="https://bibleox.com/ru/ru/w/иконы-иконопочитание-иконоборчество">敬礼圣像</a>。</p></li></ul><h2>可以受敬礼的不只是上帝</h2><h3>对上帝的敬意</h3><blockquote><p>“藐视我名的祭司啊，万军之耶和华对你们说：<strong><mark>儿子尊敬父亲，仆人敬畏主人</mark></strong>；<strong><mark>我既为父亲，尊敬我的在那里呢</mark></strong>？<strong><mark>我既为主人，敬畏我的在那里呢</mark></strong>？你们却说：『我们在何事上藐视你的名呢？』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mal/1/#L6">玛 1:6</a>)</p></blockquote><h3>对司祭</h3><blockquote><p>“<strong>你当全灵恭敬上主，尊敬司祭。</strong>” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/7/#L33">德 7:33</a>)</p></blockquote><h3>对虔诚的基督徒</h3><blockquote><p>“司提反和福徒拿都并亚该古到这里来，我很喜欢，因为你们待我有不及之处，他们补上了。 他们叫我和你们心里都快活。<strong><mark>这样的人，你们务要敬重</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/16/#L17-18">林前 16:17-18</a>)</p></blockquote><h3>对妻子</h3><blockquote><p>“你们作丈夫的也要按情理和妻子同住，因她比你软弱，与你一同承受生命之恩的，<strong><mark>所以要敬重她</mark></strong>。这样，便叫你们的祷告没有阻碍。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/3/#L7">彼前 3:7</a>)</p></blockquote><h3>对父亲和母亲</h3><blockquote><p>“<strong><mark>当孝敬父母</mark></strong>，使你的日子在耶和华你上帝所赐你的地上得以长久。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/20/#L12">出 20:12</a>)</p></blockquote><h3>对老人</h3><blockquote><p>“在白发的人面前，你要站起来；<strong><mark>也要尊敬老人</mark></strong>，又要敬畏你的上帝。我是耶和华。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/19/#L32">利 19:32</a>)</p></blockquote><h3>对寡妇</h3><blockquote><p>“<strong><mark>要尊敬那真为寡妇的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/5/#L3">提前 5:3</a>)</p></blockquote><h3>对国家掌权者</h3><blockquote><p>“务要尊敬众人，亲爱教中的弟兄，<strong><mark>敬畏上帝，尊敬君王</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/2/#L17">彼前 2:17</a>)</p></blockquote><blockquote><p>“<strong><mark>在上有权柄的，人人当顺服他</mark></strong>，因为没有权柄不是出于上帝的，凡掌权的都是上帝所命的。 &lt;…&gt; 凡人所当得的，就给他；当得粮的，给他纳粮；当得税的，给他上税；当惧怕的，惧怕他；<strong><mark>当恭敬的，恭敬他</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/13/#L1,7">罗 13:1,7</a>)</p></blockquote><h3>对一切人</h3><blockquote><p>“<strong><mark>务要尊敬众人</mark></strong>，亲爱教中的弟兄，敬畏上帝，尊敬君王。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/2/#L17">彼前 2:17</a>)</p></blockquote><blockquote><p>“爱弟兄，要彼此亲热；<strong><mark>恭敬人，要彼此推让</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/12/#L10">罗 12:10</a>)</p></blockquote><h2>向圣人叩拜</h2><p>十诫的第二诫（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/20/#L4-5">出 20:4-5</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/5/#L8-9">申 5:8-9</a>）禁止敬拜假神（偶像）。假神实际上不是神：他们的神性是虚构的，是幻想、谎言。</p><p>圣人是真实存在的，他们是上帝的朋友；向他们叩拜，不是把他们当神。向圣人叩拜，是表达对他们的敬意——作为上帝的朋友、作为上帝的仆人（天使）、作为上帝之母。这样的向天使、向人、向物件的叩拜在圣经中有，而且不是拜偶像，因为拜偶像——是敬拜<strong>假</strong>神，敬拜谎言。义人们经常向人如向人、向天使如向天使、向先知如向先知、向物件如向物件下拜。在一切情形中，他们都不是把他们当作神来拜。</p><h3>向以天使形像显现的上帝叩拜</h3><p>显现的是上帝，但那三位天使不是上帝的本相、不是他在创世之前所是的；就是说，这是上帝的<strong>像</strong>（希腊文 εἰκόνα——圣像），而亚伯拉罕拜的是上帝的圣像：</p><blockquote><p>“耶和华在幔利橡树那里，<strong><mark>向亚伯拉罕显现出来</mark></strong>。那时正热，亚伯拉罕坐在帐棚门口， 举目观看，<strong><mark>见有三个人在对面站着</mark></strong>。他一见，就从帐棚门口跑去迎接他们，<strong><mark>俯伏在地</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/18/#L1-2">创 18:1-2</a>)</p></blockquote><h3>向天使叩拜</h3><blockquote><p>“他回答说：「不是的，我来是要作耶和华军队的元帅。」<strong><mark>约书亚就俯伏在地下拜</mark></strong>，说：「我主有什么话吩咐仆人？」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/nav/5/#L14">书 5:14</a>)</p></blockquote><h3>向先知叩拜</h3><blockquote><p>“住耶利哥的先知门徒从对面看见他，就说：「感动以利亚的灵感动以利沙了。」他们就来迎接他，<strong><mark>在他面前俯伏于地</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/4ts/2/#L15">王下 2:15</a>)</p></blockquote><h3>向圣殿叩拜</h3><blockquote><p>“至于我，我必凭你丰盛的慈爱，进入你的居所；我必存敬畏你的心，<strong><mark>向你的圣殿下拜</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/5/#L7">诗 5:7</a>)</p></blockquote><h3>向上帝的脚凳（圣殿）叩拜</h3><blockquote><p>“你们当尊崇耶和华我们的上帝，<strong><mark>在他脚凳前下拜</mark></strong>；他本为圣！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/99/#L5">诗 99:5</a>)</p></blockquote><blockquote><p>“<strong><mark>我们要进他的居所，在他脚凳前下拜</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/132/#L7">诗 132:7</a>)</p></blockquote><h3>向约柜叩拜</h3><blockquote><p>“约书亚便撕裂衣服；他和以色列的长老把灰撒在头上，在耶和华的约柜前，<strong><mark>俯伏在地，直到晚上</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/nav/7/#L6">书 7:6</a>)</p></blockquote><h3>向杖叩拜</h3><p>经上记着“以色列在床头上敬拜”（<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/47/#L31">创 47:31</a>），而在七十士译本里是“在杖头上”（<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/11/#L21">希 11:21</a>）。</p><p>更多例子：<a href="https://bibleox.com/ru/ru/w/поклоны">叩拜</a></p><h3>为什么启示录里天使吩咐拜的不是自己，而是上帝</h3><p>在使徒约翰的异象中，上帝显然就在旁边；在这样的情形里，把敬意给天使、仿佛天使是这里最主要的，就奇怪了。所以天使吩咐拜上帝：</p><blockquote><p>“我就俯伏在他脚前要拜他。他说：「<strong><mark>千万不可</mark></strong>！我和你，并你那些为耶稣作见证的弟兄同是作仆人的；<strong><mark>你要敬拜上帝</mark></strong>。因为预言中的灵意乃是为耶稣作见证。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/19/#L10">启 19:10</a>)</p></blockquote><blockquote><p>“他对我说：「<strong><mark>千万不可</mark></strong>！我与你和你的弟兄众先知，并那些守这书上言语的人，同是作仆人的。<strong><mark>你要敬拜上帝</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/22/#L9">启 22:9</a>)</p></blockquote><p>另一次，天使接受了先知约书亚的叩拜：</p><blockquote><p>“他回答说：「不是的，我来是要作耶和华军队的元帅。」<strong><mark>约书亚就俯伏在地下拜</mark></strong>，说：「我主有什么话吩咐仆人？」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/nav/5/#L14">书 5:14</a>)</p></blockquote><h2>圣人将受尊敬</h2><blockquote><p>“在大户人家，不但有金器银器，也有木器瓦器；有作为贵重的，有作为卑贱的。 <strong><mark>人若自洁，脱离卑贱的事</mark></strong>，<strong><mark>就必作贵重的器皿</mark></strong>，成为圣洁，合乎主用，预备行各样的善事。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/2/#L20-21">提后 2:20-21</a>)</p></blockquote><blockquote><p>“<strong><mark>却将荣耀、尊贵、平安加给一切行善的人</mark></strong>，先是犹太人，后是希利尼人。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/2/#L10">罗 2:10</a>)</p></blockquote><h2>主应许荣耀义人</h2><blockquote><p>“因此，耶和华以色列的上帝说：『我曾说，你和你父家必永远行在我面前；现在我却说，决不容你们这样行。因为<strong><mark>尊重我的，我必重看他</mark></strong>；藐视我的，他必被轻视。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1ts/2/#L30">撒上 2:30</a>)</p></blockquote><blockquote><p>“若有人服事我，就当跟从我；我在那里，服事我的人也要在那里。<strong><mark>若有人服事我，我父必尊重他</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/12/#L26">约 12:26</a>)</p></blockquote><blockquote><p>“我不但为这些人祈求，也为那些因他们的话信我的人祈求， &lt;…&gt; <strong><mark>你所赐给我的荣耀，我已赐给他们</mark></strong>，使他们合而为一，像我们合而为一。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/17/#L20,22">约 17:20,22</a>)</p></blockquote><blockquote><p>“因为他预先所知道的人，就预先定下效法他儿子的模样，使他儿子在许多弟兄中作长子。 预先所定下的人又召他们来；所召来的人又称他们为义；<strong><mark>所称为义的人又叫他们得荣耀</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/8/#L29-30">罗 8:29-30</a>)</p></blockquote><p>荣耀的赐下，其中也藉着应允祈祷和作为：</p><blockquote><p>“<strong><mark>你们奉我的名无论求什么，我必成就</mark></strong>，<strong><mark>叫父因儿子得荣耀</mark></strong>。 你们若奉我的名求什么，我必成就。 你们若爱我，就必遵守我的命令。 我要求父，父就另外赐给你们一位保惠师，叫他永远与你们同在；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/14/#L13-16">约 14:13-16</a>)</p></blockquote><p>而且，最终得荣耀的仍是父——虽是在子里；就是说，子也得荣耀。</p><h2>寻求从上帝来的荣耀</h2><blockquote><p>“你们互相受荣耀，却<strong><mark>不求从独一之上帝来的荣耀</mark></strong>，怎能信我呢？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/5/#L44">约 5:44</a>)</p></blockquote><blockquote><p>“你竟任着你刚硬不悔改的心，为自己积蓄忿怒，以致上帝震怒，显他公义审判的日子来到。 他必照各人的行为报应各人。 凡<strong><mark>恒心行善</mark></strong>，<strong><mark>寻求荣耀、尊贵</mark></strong>和不能朽坏之福的，就以<strong><mark>永生</mark></strong>报应他们； 惟有结党不顺从真理，反顺从不义的，就以忿怒、恼恨报应他们。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/2/#L5-8">罗 2:5-8</a>)</p></blockquote><h2>圣徒的荣耀</h2><blockquote><p>“原来那为万物所属、为万物所本的，<strong><mark>要领许多的儿子进荣耀里去</mark></strong>，使救他们的元帅因受苦难得以完全，本是合宜的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/2/#L10">希 2:10</a>)</p></blockquote><blockquote><p>“我们众人既然敞着脸得以看见主的荣光，好像从镜子里返照，<strong><mark>就变成主的形状</mark></strong>，<strong><mark>荣上加荣</mark></strong>，如同从主的灵变成的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/3/#L18">林后 3:18</a>)</p></blockquote><blockquote><p>“将患难、困苦加给一切作恶的人，先是犹太人，后是希利尼人； <strong><mark>却将荣耀、尊贵、平安加给一切行善的人</mark></strong>，先是犹太人，后是希利尼人。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/2/#L9-10">罗 2:9-10</a>)</p></blockquote><blockquote><p>“<strong><mark>他将他百姓的角高举</mark></strong>，因此<strong><mark>他一切圣民以色列人</mark></strong>，就是与他相近的百姓，都赞美他。你们要赞美耶和华！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/148/#L14">诗 148:14</a>)</p></blockquote><h2>教会将荣耀义人</h2><blockquote><p>“<strong>现在让我们来赞扬那些著名的伟人</strong>，和我们历代的祖先：<strong>上主在他们身上，作出许多光耀的事</strong>，自太古就对他们，显示了自己的伟大。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/44/#L1-2">德 44:1-2</a>)</p></blockquote><blockquote><p>“<strong>他们的光荣，决不会泯灭</strong>；他们的遗体必被人安葬，名誉必留于永世；<strong>他们的名誉，必留于永世</strong>；万民要传述他们的智慧，<strong>全会众也要传扬他们的称赞</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/44/#L13-14">德 44:13-14</a>)</p></blockquote><h2>必须不忘前人的功绩和信仰，并效法他们</h2><blockquote><p>“<strong><mark>从前引导你们、传上帝之道给你们的人，你们要想念他们</mark></strong>，<strong><mark>效法他们的信心</mark></strong>，留心看他们为人的结局。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/13/#L7">希 13:7</a>)</p></blockquote><blockquote><p>“<strong><mark>所以，我求你们效法我</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/4/#L16">林前 4:16</a>)</p></blockquote><blockquote><p>“弟兄们，<strong><mark>你们要一同效法我</mark></strong>，<strong><mark>也当留意看那些照我们榜样行的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/fil/3/#L17">腓 3:17</a>)</p></blockquote><h2>渴望与圣徒同在</h2><blockquote><p>“我的心哪！你曾对耶和华说：「你是我的主；我的好处不在你以外。」 <strong><mark>论到世上的圣民，他们又美又善</mark></strong>，<strong><mark>是我最喜悦的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/16/#L2-3">诗 16:2-3</a>)</p></blockquote><h2>末日之兽将亵渎圣人</h2><h3>兽将亵渎住在天上的</h3><blockquote><p>“兽就开口向上帝说亵渎的话，亵渎上帝的名，<strong><mark>并他的帐幕，以及那些住在天上的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/13/#L6">启 13:6</a>)</p></blockquote><h3>在天上的，是义人的灵魂和天使</h3><blockquote><p>“你们乃是来到锡安山，<strong><mark>永生上帝的城邑</mark></strong>，<strong><mark>就是天上的耶路撒冷</mark></strong>。那里有<strong><mark>千万的天使</mark></strong>， 有名录在天上诸长子之会所共聚的总会，有审判众人的上帝和<strong><mark>被成全之义人的灵魂</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/12/#L22-23">希 12:22-23</a>)</p></blockquote><h2>对异议的回应</h2><h3>教会怎么知道谁是圣人？难道是人替上帝作决定吗？</h3><p>回答见「<a href="https://bibleox.com/ru/ru/w/молитвы-святым#HH-Как-Церковь-узнаёт-кто-является-святым-Не-решают-ли-люди-за-Бога">为圣人祈祷</a>」一节。</p><h3>“上帝不把自己的荣耀给别的”</h3><blockquote><p>“我是耶和华，这是我的名。<strong><mark>我必不将我的荣耀归给假神</mark></strong>，<strong><mark>也不将我的称赞归给雕刻的偶像</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/42/#L8">赛 42:8</a>)</p></blockquote><p>这里说的是偶像，即假神。关于上帝自己荣耀众人的许多引文，见上文。</p><h2>相关引文</h2><ol><li><p><a href="https://bibleox.com/ru/ru/w/мощи-или-останки-праведников">敬礼圣髑</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/иконы-иконопочитание-иконоборчество">敬礼圣像</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/молитвы-святым">为圣人祈祷</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/человек-храм-Божий">人——上帝的殿</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/состав-человека">人的构成</a></p></li></ol>
