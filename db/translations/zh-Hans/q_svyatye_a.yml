  path: QW2A_为基督受苦
  title: 为基督受苦
  copy_cover: true
  body: <h2>基督徒不但蒙召相信，也蒙召为基督受苦</h2><blockquote><p>“只要你们<strong><mark>行事为人与基督的福音相称</mark></strong>，叫我或来见你们，或不在你们那里，可以听见你们的景况，知道你们同有一个心志，站立得稳，<strong><mark>为所信的福音齐心努力</mark></strong>。 凡事不怕敌人的惊吓，<strong><mark>这是证明他们沉沦，你们得救</mark></strong>，都是出于上帝。 因为你们蒙恩，不但得以信服基督，<strong><mark>并要为他受苦</mark></strong>。 你们的争战，就与你们在我身上从前所看见，现在所听见的一样。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/fil/1/#L27-30">腓 1:27-30</a>)</p></blockquote><h2>关于为基督受逼迫的预言</h2><blockquote><p>“你们要记念我从前对你们所说的话：『仆人不能大于主人。』<strong><mark>他们若逼迫了我，也要逼迫你们</mark></strong>；若遵守了我的话，也要遵守你们的话。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/15/#L20">约 15:20</a>)</p></blockquote><blockquote><p>“<strong><mark>为义受逼迫的人有福了</mark></strong>，因为天国是他们的。 <strong><mark>人若因我辱骂你们，逼迫你们，捏造各样坏话毁谤你们</mark></strong>，你们就有福了。 应当欢喜快乐，因为<strong><mark>你们在天上的赏赐是大的</mark></strong>。在你们以前的先知，人也是这样逼迫他们。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L10-12">太 5:10-12</a>)</p></blockquote><blockquote><p>“<strong><mark>人为人子恨恶你们，拒绝你们，辱骂你们，弃掉你们的名</mark></strong>，以为是恶，<strong><mark>你们就有福了</mark></strong>。 当那日，你们要欢喜跳跃，因为<strong><mark>你们在天上的赏赐是大的</mark></strong>！他们的祖宗待先知也是这样。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L22-23">路 6:22-23</a>)</p></blockquote><h2>预言的应验</h2><p>使徒们为基督受苦而欢喜：</p><blockquote><p>“他们离开公会，<strong><mark>心里欢喜</mark></strong>，<strong><mark>因被算是配为这名受辱</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/5/#L41">徒 5:41</a>)</p></blockquote><blockquote><p>“<strong><mark>我们为基督的缘故算是愚拙的</mark></strong>，你们在基督里倒是聪明的；我们软弱，你们倒强壮；你们有荣耀，我们倒被藐视。 直到如今，我们还是<strong><mark>又饥、又渴、又赤身露体、又挨打</mark></strong>、又没有一定的住处， 并且劳苦，亲手作工。<strong><mark>被人咒骂，我们就祝福</mark></strong>；<strong><mark>被人逼迫，我们就忍受</mark></strong>； <strong><mark>被人毁谤，我们就善劝</mark></strong>。直到如今，人还把我们看作<strong><mark>世界上的污秽</mark></strong>，<strong><mark>万物中的渣滓</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/4/#L10-13">林前 4:10-13</a>)</p></blockquote><h2>呼召不要惧怕为基督受苦</h2><blockquote><p>“亲爱的弟兄啊，<strong><mark>有火炼的试验临到你们，不要以为奇怪</mark></strong>（似乎是遭遇非常的事）， 倒要欢喜。因为<strong><mark>你们是与基督一同受苦</mark></strong>，使你们在他荣耀显现的时候，也可以欢喜快乐。 <strong><mark>你们若为基督的名受辱骂，便是有福的</mark></strong>，因为上帝荣耀的灵常住在你们身上。 你们中间却不可有人因为杀人、偷窃、作恶、好管闲事而受苦； <strong><mark>若为作基督徒受苦，却不要羞耻</mark></strong>，<strong><mark>倒要因这名归荣耀给上帝</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/4/#L12-16">彼前 4:12-16</a>)</p></blockquote><blockquote><p>“你们若是热心行善，有谁害你们呢？ <strong><mark>你们就是为义受苦，也是有福的</mark></strong>。<strong><mark>不要怕人的威吓，也不要惊慌</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/3/#L13-14">彼前 3:13-14</a>)</p></blockquote><h2>忍受为基督受逼迫的赏赐之应许</h2><p>为基督受苦——是得救的凭据：</p><blockquote><p>“只要你们行事为人与基督的福音相称，叫我或来见你们，或不在你们那里，可以听见你们的景况，知道你们同有一个心志，站立得稳，为所信的福音齐心努力。 凡事不怕敌人的惊吓，<strong><mark>这是证明他们沉沦，你们得救</mark></strong>，都是出于上帝。 因为你们蒙恩，不但得以信服基督，<strong><mark>并要为他受苦</mark></strong>。 你们的争战，就与你们在我身上从前所看见，现在所听见的一样。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/fil/1/#L27-30">腓 1:27-30</a>)</p></blockquote><p>与基督一同受苦的，也必与他一同得荣耀：</p><blockquote><p>“既是儿女，便是后嗣，就是上帝的后嗣，和基督同作后嗣。<strong><mark>如果我们和他一同受苦，也必和他一同得荣耀</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/8/#L17">罗 8:17</a>)</p></blockquote><p>与基督一同死的，与他一同复活、一同作王。而离弃他的，他也要离弃：</p><blockquote><p>“你要记念耶稣基督乃是大卫的后裔，他从死里复活，正合乎我所传的福音。 <strong><mark>我为这福音受苦难，甚至被捆绑</mark></strong>，像犯人一样；然而，上帝的道却不被捆绑。 所以我为选民凡事忍耐，叫他们也可以得着那在基督耶稣里的救恩和永远的荣耀。 有可信的话说：「<strong><mark>我们若与基督同死，也必与他同活</mark></strong>； <strong><mark>我们若能忍耐，也必和他一同作王</mark></strong>；<strong><mark>我们若不认他，他也必不认我们</mark></strong>；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/2/#L8-12">提后 2:8-12</a>)</p></blockquote><p>在主里死的人是有福的：</p><blockquote><p>“我听见从天上有声音说：「你要写下：从今以后，<strong><mark>在主里面而死的人有福了</mark></strong>！」圣灵说：「是的，<strong><mark>他们息了自己的劳苦，作工的果效也随着他们</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/14/#L13">启 14:13</a>)</p></blockquote><p>为基督被杀的灵魂与他在天上同活：</p><blockquote><p>“揭开第五印的时候，我看见在祭坛底下，<strong><mark>有为上帝的道并为作见证被杀之人的灵魂</mark></strong>， 大声喊着说：「圣洁真实的主啊！<strong><mark>你不审判住在地上的人，给我们伸流血的冤，要等到几时呢</mark></strong>？」 <strong><mark>于是有白衣赐给他们各人</mark></strong>，又有话对他们说：「还要安息片时，等着一同作仆人的和他们的弟兄，也像他们被杀，<strong><mark>满足了数目</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/6/#L9-11">启 6:9-11</a>)</p></blockquote>
