  path: QW1A_圣洁
  title: 圣洁
  copy_cover: true
  body: <ol><li><p><strong>圣洁</strong>——将一物全然分别出来，归于一个目的。</p></li><li><p><strong>圣洁</strong>——献给上帝的生活方式。</p></li><li><p><strong>圣徒</strong>——不犯罪、按上帝旨意而生活的人。</p></li></ol><blockquote><p>“<strong><mark>他死是向罪死了，只有一次</mark></strong>；<strong><mark>他活是向上帝活着</mark></strong>。 这样，你们<strong><mark>向罪也当看自己是死的</mark></strong>；<strong><mark>向上帝在基督耶稣里，却当看自己是活的</mark></strong>。 所以，<strong><mark>不要容罪在你们必死的身上作王</mark></strong>，使你们顺从身子的私欲。 <strong><mark>也不要将你们的肢体献给罪作不义的器具</mark></strong>；倒要像从死里复活的人，<strong><mark>将自己献给上帝</mark></strong>，并将肢体作义的器具献给上帝。 &lt;…&gt; 你们既从罪里得了释放，就作了义的奴仆。 &lt;…&gt; 但现今你们既从罪里得了释放，作了上帝的奴仆，<strong><mark>就有成圣的果子</mark></strong>，<strong><mark>那结局就是永生</mark></strong>！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/6/#L10-13,18,22">罗 6:10-13,18,22</a>)</p></blockquote><blockquote><p>“凡从上帝生的，就不犯罪，因上帝的道存在他心里；<strong><mark>他也不能犯罪</mark></strong>，因为他是由上帝生的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/3/#L9">约壹 3:9</a>)</p></blockquote><blockquote><p>“<strong><mark>我们知道凡从上帝生的，必不犯罪</mark></strong>，从上帝生的，必保守自己，那恶者也就无法害他。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/5/#L18">约壹 5:18</a>)</p></blockquote><blockquote><p>“你们要追求与众人和睦，<strong><mark>并要追求圣洁</mark></strong>；<strong><mark>非圣洁没有人能见主</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/12/#L14">希 12:14</a>)</p></blockquote><blockquote><p>“那城内又不用日月光照，因有上帝的荣耀光照，又有羔羊为城的灯。 &lt;…&gt; 城门白昼总不关闭，在那里原没有黑夜。 &lt;…&gt; <strong><mark>凡不洁净的，并那行可憎与虚谎之事的，总不得进那城</mark></strong>；只有名字写在羔羊生命册上的才得进去。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/21/#L23,25,27">启 21:23,25,27</a>)</p></blockquote>
