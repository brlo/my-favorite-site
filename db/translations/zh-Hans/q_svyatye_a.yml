  path: QW3A_恩典
  title: 恩典
  copy_cover: true
  body: <h2>定义</h2><p><strong>恩典</strong>（古希腊文 χάρις，希伯来文 חֵ֣ן）——按主要意义，指为拯救人而运行在人身上的上帝的能力。</p><ol><li><p><strong>上帝的能力，上帝的作为</strong>（<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/15/#L10">林前 15:10</a>——我今日成了何等人，是蒙上帝的<strong>恩</strong>才成的；并且他的<strong>恩</strong>在我里面不是徒然的；我比众使徒格外劳苦——这不是我，乃是<strong>与我同在的上帝的恩</strong>）；</p></li><li><p><strong>恩惠、怜悯、馈赠、恩宠、爱</strong>（<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/18/#L3">创 18:3</a>——我若在你眼前蒙<strong>恩</strong>）；</p></li><li><p><strong>感谢上帝、讨上帝喜悦</strong>（<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/9/#L15">林后 9:15</a>——感谢上帝，因他有说不尽的恩赐）；</p></li><li><p><strong>恩宠、尊荣、荣耀</strong>（<a href="https://bibleox.com/zh-Hans/cn-cuv/iudf/8/#L23">友 8:23</a>——奴役不会成为我们的<strong>荣耀</strong>）。</p></li></ol><h2>恩典的召唤运作</h2><blockquote><p>“我希奇你们这么快离开<strong><mark>那借着基督之恩召你们的</mark></strong>，去从别的福音。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/1/#L6">加 1:6</a>)</p></blockquote><blockquote><p>“然而那把我从母腹里分别出来、<strong><mark>又施恩召我的上帝</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/1/#L15">加 1:15</a>)</p></blockquote><h2>恩典作为上帝的恩赐</h2><blockquote><p>“<strong><mark>愿主耶稣基督的恩</mark></strong>常与你们众人同在！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/16/#L23">林前 16:23</a>)</p></blockquote><blockquote><p>“<strong><mark>愿恩惠、平安从上帝我们的父和主耶稣基督归与你们</mark></strong>！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/1/#L2">林后 1:2</a>)</p></blockquote><blockquote><p>“<strong><mark>但圣灵降临在你们身上，你们就必得着能力</mark></strong>；并要在耶路撒冷、犹太全地和撒玛利亚，直到地极，作我的见证。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/1/#L8">徒 1:8</a>)</p></blockquote><blockquote><p>“<strong><mark>我感谢那给我力量的我们主基督耶稣</mark></strong>，因他以我有忠心，派我服事他。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/1/#L12">提前 1:12</a>)</p></blockquote><blockquote><p>“我作了这福音的执事，<strong><mark>是照上帝的恩赐，这恩赐是照他运行的大能赐给我的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/3/#L7">弗 3:7</a>)</p></blockquote><blockquote><p>“<strong><mark>我们各人蒙恩，都是照基督所量给各人的恩赐</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/4/#L7">弗 4:7</a>)</p></blockquote><blockquote><p>“他们也因<strong><mark>上帝极大的恩赐显在你们心里</mark></strong>，就切切的想念你们，为你们祈祷。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/9/#L14">林后 9:14</a>)</p></blockquote><blockquote><p>“<strong><mark>上帝能将各样的恩惠多多的加给你们</mark></strong>，使你们凡事常常充足，能多行各样善事。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/9/#L8">林后 9:8</a>)</p></blockquote><blockquote><p>“又恐怕我因所得的启示甚大，就过于自高，所以<strong><mark>有一根刺加在我肉体上</mark></strong>，就是撒但的差役要攻击我，免得我过于自高。 为这事，我三次求过主，叫这刺离开我。 他对我说：「<strong><mark>我的恩典够你用的</mark></strong>，<strong><mark>因为我的能力是在人的软弱上显得完全</mark></strong>。」所以，我更喜欢夸自己的软弱，<strong><mark>好叫基督的能力覆庇我</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/12/#L7-9">林后 12:7-9</a>)</p></blockquote><blockquote><p>“我们与上帝同工的也劝你们，<strong><mark>不可徒受他的恩典</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/6/#L1">林后 6:1</a>)</p></blockquote><blockquote><p>“然而我今日成了何等人，<strong><mark>是蒙上帝的恩才成的</mark></strong>；并且<strong><mark>他所赐我的恩不是徒然的</mark></strong>。我比众使徒格外劳苦，这原不是我，<strong><mark>乃是上帝的恩与我同在</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/15/#L10">林前 15:10</a>)</p></blockquote><blockquote><p>“彼得说：「你们各人要悔改，奉耶稣基督的名受洗，叫你们的罪得赦，<strong><mark>就必领受所赐的圣灵</mark></strong>；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/2/#L38">徒 2:38</a>)</p></blockquote><blockquote><p>“那在基督里坚固我们和你们，并且膏我们的就是上帝。 <strong><mark>他又用印印了我们，并赐圣灵在我们心里作凭据</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/1/#L21-22">林后 1:21-22</a>)</p></blockquote><blockquote><p>“<strong><mark>如果上帝的灵住在你们心里</mark></strong>，你们就不属肉体，乃属圣灵了。<strong><mark>人若没有基督的灵，就不是属基督的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/8/#L9">罗 8:9</a>)</p></blockquote><blockquote><p>“<strong><mark>岂不知你们是上帝的殿，上帝的灵住在你们里头吗</mark></strong>？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/3/#L16">林前 3:16</a>)</p></blockquote><blockquote><p>“你们所受的不是奴仆的心，仍旧害怕；<strong><mark>所受的乃是儿子的心</mark></strong>，<strong><mark>因此我们呼叫</mark></strong>：「阿爸，父！」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/8/#L15">罗 8:15</a>)</p></blockquote><blockquote><p>“你们既为儿子，<strong><mark>上帝就差他儿子的灵进入你们的心，呼叫</mark></strong>：「阿爸，父！」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/4/#L6">加 4:6</a>)</p></blockquote><blockquote><p>“<strong><mark>你们从主所受的恩膏常存在你们心里</mark></strong>，并不用人教训你们，<strong><mark>自有主的恩膏在凡事上教训你们</mark></strong>。这恩膏是真的，不是假的，你们要按这恩膏的教训住在主里面。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/2/#L27">约壹 2:27</a>)</p></blockquote><blockquote><p>“上帝的殿和偶像有什么相同呢？因为我们是永生上帝的殿，就如上帝曾说：『<strong><mark>我要在他们中间居住，在他们中间来往</mark></strong>；我要作他们的上帝，他们要作我的子民。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/6/#L16">林后 6:16</a>)</p></blockquote><blockquote><p>“耶稣回答说：「人若爱我，就必遵守我的道；<strong><mark>我父也必爱他，并且我们要到他那里去，与他同住</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/14/#L23">约 14:23</a>)</p></blockquote><blockquote><p>“你们不要被那诸般怪异的教训勾引了去。<strong><mark>因为人心靠恩得坚固才是好的</mark></strong>，并不是靠饮食；那在饮食上专心的，从来没有得着益处。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/13/#L9">希 13:9</a>)</p></blockquote><blockquote><p>“所以，我们既得了不能震动的国，<strong><mark>就当感恩</mark></strong>，照上帝所喜悦的，<strong><mark>用虔诚、敬畏的心事奉上帝</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/12/#L28">希 12:28</a>)</p></blockquote><blockquote><p>“有人带着小孩子来见耶稣，要耶稣摸他们，门徒便责备那些人。 耶稣看见就恼怒，对门徒说：「让小孩子到我这里来，不要禁止他们，因为在上帝国的，正是这样的人。 我实在告诉你们：凡要承受上帝国的，若不像小孩子，断不能进去。」 <strong><mark>于是抱着小孩子，给他们按手，为他们祝福</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/10/#L13-16">可 10:13-16</a>)</p></blockquote><blockquote><p>“耶稣领他们到伯大尼的对面，<strong><mark>就举手给他们祝福</mark></strong>。 <strong><mark>正祝福的时候</mark></strong>，他就离开他们，被带到天上去了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/24/#L50-51">路 24:50-51</a>)</p></blockquote><h2>恩典藉着人运作</h2><blockquote><p>“所以论到上帝的事，我在基督耶稣里有可夸的。 <strong><mark>除了基督藉我作的那些事，我什么都不敢提</mark></strong>，只提他藉我言语作为，<strong><mark>用神迹奇事的能力</mark></strong>，<strong><mark>并圣灵的能力</mark></strong>，使外邦人顺服。 甚至我从耶路撒冷直转到以利哩古，<strong><mark>到处传了基督的福音</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/15/#L17-19">罗 15:17-19</a>)</p></blockquote><blockquote><p>“为此我提醒你，使你将<strong><mark>上帝藉我按手所给你的恩赐</mark></strong>，再如火挑旺起来。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/1/#L6">提后 1:6</a>)</p></blockquote><p>领受恩典，为叫万民信服：</p><blockquote><p>“<strong><mark>我们从他受了恩惠并使徒的职分</mark></strong>，<strong><mark>在万国之中叫人为他的名信服真道</mark></strong>；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/1/#L5">罗 1:5</a>)</p></blockquote><blockquote><p>“污秽的言语，一句不可出口，<strong><mark>只要随事说造就人的好话，叫听见的人得益处</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/4/#L29">弗 4:29</a>)</p></blockquote><blockquote><p>“<strong><mark>你们的言语要常常带着和气</mark></strong>，好像用盐调和，就可知道该怎样回答各人。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/4/#L6">西 4:6</a>)</p></blockquote><h2>恩典赐给谦卑的人</h2><blockquote><p>“他讥诮那好讥诮的人，<strong><mark>赐恩给谦卑的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/3/#L34">箴 3:34</a>)</p></blockquote><blockquote><p>“但他赐更多的恩典，所以经上说，『<strong><mark>上帝阻挡骄傲的人，赐恩给谦卑的人</mark></strong>。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/4/#L6">雅 4:6</a>)</p></blockquote><blockquote><p>“你们年幼的也要顺服年长的。就是你们众人也都要以谦卑束腰，彼此顺服，『<strong><mark>因为上帝阻挡骄傲的人，赐恩给谦卑的人</mark></strong>。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/5/#L5">彼前 5:5</a>)</p></blockquote><h2>必须挑旺恩典</h2><blockquote><p>“为此我提醒你，<strong><mark>使你将上帝藉我按手所给你的恩赐，再如火挑旺起来</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/1/#L6">提后 1:6</a>)</p></blockquote>
