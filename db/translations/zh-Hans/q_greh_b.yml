  title: 骄傲
  copy_cover: true
  body: <h2>对骄傲的定罪</h2><blockquote><p>“你们年幼的也要顺服年长的。就是你们众人也都要以谦卑束腰，彼此顺服，『因为<strong><mark>上帝阻挡骄傲的人，赐恩给谦卑的人</mark></strong>。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/5/#L5">彼前 5:5</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/iak/4/#L6">雅 4:6</a>)</p></blockquote><blockquote><p>“<strong><mark>凡心里骄傲的，为耶和华所憎恶</mark></strong>，虽然连手，他必不免受罚。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/16/#L5">箴 16:5</a>)</p></blockquote><blockquote><p>“<strong><mark>敬畏耶和华，在乎恨恶邪恶</mark></strong>。<strong><mark>那骄傲、狂妄并恶道</mark></strong>，以及乖谬的口，都为我所恨恶。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/8/#L13">箴 8:13</a>)</p></blockquote><h2>骄傲的表现</h2><blockquote><p>“你们要小心，不可将善事行在人的面前，故意叫他们看见；若是这样，就不能得你们天父的赏赐了。 所以，你施舍的时候，<strong><mark>不可在你前面吹号，像那假冒为善的人</mark></strong>在会堂里和街道上所行的，<strong><mark>故意要得人的荣耀</mark></strong>。我实在告诉你们：他们已经得了他们的赏赐。 你施舍的时候，不要叫左手知道右手所作的； 要叫你施舍的事行在暗中，你父在暗中察看，必然报答你〔有古卷作『必在明处报答你』〕。 你们祷告的时候，不可像那假冒为善的人，爱站在会堂里和十字路口上祷告，<strong><mark>故意叫人看见</mark></strong>。我实在告诉你们，他们已经得了他们的赏赐。 你祷告的时候，要进你的内屋，关上门，祷告你在暗中的父，你父在暗中察看，必然报答你。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/6/#L1-6">太 6:1-6</a>)</p></blockquote><blockquote><p>“耶稣向那些<strong><mark>仗着自己是义人，藐视别人的</mark></strong>，设一个比喻， 说：「有两个人上殿里去祷告：一个是法利赛人，一个是税吏。 法利赛人站着，自言自语的祷告说：『上帝啊，我感谢你，<strong><mark>我不像别人</mark></strong>勒索、不义、奸淫，也不像这个税吏。 我一个礼拜禁食两次，凡我所得的都捐上十分之一。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/18/#L9-12">路 18:9-12</a>)</p></blockquote><blockquote><p>“你们不要论断人，就不被论断；你们不要定人的罪，就不被定罪；你们要饶恕人，就必蒙饶恕；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L37">路 6:37</a>)</p></blockquote><blockquote><p>“你们这瞎眼领路的，蠓虫你们就滤出来，骆驼你们倒吞下去。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/23/#L24">太 23:24</a>)</p></blockquote><h2>骄傲是魔鬼的罪</h2><blockquote><p>“「人子啊，你为推罗王作起哀歌说：『主耶和华如此说：你无所不备，智慧充足，全然美丽。 你曾在伊甸上帝的园中，佩戴各样宝石，就是红宝石、红璧玺、金钢石、水苍玉、红玛瑙、碧玉、蓝宝石、绿宝石、红玉和黄金，又有精美的鼓笛在你那里，都是在你受造之日预备齐全的。 <strong><mark>你是那受膏遮掩约柜的基路伯</mark></strong>，我将你安置在上帝的圣山上，你在发光如火的宝石中间往来。 你从受造之日所行的都完全，<strong><mark>后来在你中间又察出不义</mark></strong>。 因你贸易很多，<strong><mark>就被强暴的事充满，以致犯罪</mark></strong>，所以我因你亵渎圣地，就从上帝的山驱逐你。遮掩约柜的基路伯阿，我已将你从发光如火的宝石中除灭。 <strong><mark>你因美丽心中高傲</mark></strong>，<strong><mark>又因荣光败坏智慧</mark></strong>，我已将你摔倒在地，使你倒在君王面前，好叫他们目睹眼见。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iez/28/#L12-17">结 28:12-17</a>)</p></blockquote><blockquote><p>“明亮之星，早晨之子啊！你何竟从天坠落？你这攻败列国的，何竟被砍倒在地上？ <strong><mark>你心里曾说</mark></strong>：「<strong><mark>我要升到天上！我要高举我的宝座在上帝众星以上</mark></strong>；我要坐在聚会的山上，在北方的极处； <strong><mark>我要升到高云之上，我要与至上者同等</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/14/#L12-14">赛 14:12-14</a>)</p></blockquote>
