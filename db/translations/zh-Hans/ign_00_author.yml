    title: 安提阿的伊格那丢（提阿弗罗斯），一世纪
    title_sub: 殉道者（约35–107年），安提阿的主教
    meta_desc: 安提阿的圣伊格那丢（提阿弗罗斯，“承载上帝者”）的生平、七封书信，以及这些书信所显示的古代教会的信仰。
    # пункт-заготовка с калькой «伊格纳提·博戈诺谢茨» заполняется и переименовывается
    menu: { parent: "一世纪", title: "安提阿的伊格那丢，殉道者（约35-107年）", replace: "伊格纳提·博戈诺谢茨，圣殉道者（约35-107年）" }
    body: |-
      <p>阅读伊格那丢著作的希腊文原文，请点<a href="https://bibleox.com/zh-Hans/grc/w/Ιγνάτιος_Θεοφόρος_Αντιοχείας">这里</a>。在著作目录上方也可以切换到其他语言。</p><p><strong>纪念日</strong>：12月20日（新历1月2日）、1月29日（新历2月11日）</p><h2>生平</h2><p>关于伊格那丢的生平，我们所知不多。有传说认为，他就是基督抱在怀里祝福的那个小孩（<a href="https://bibleox.com/zh-Hans/cn-sb/mf/18/#L2-5">玛 18:2-5</a>），但大多数学者认为这是后来的传说。</p><p>有人根据他书信的文风，认为他是叙利亚人。可以确定的是，他是最早的非犹太出身——或至少不是在犹太教文化中长大——的基督教作者之一。根据该撒利亚的尤西比乌所著的《教会史》，他在图拉真皇帝在位时于安提阿被捕，被押往罗马处死。途中，他给所经过城市的教会团体（以弗所、马格尼西亚、特拉勒斯、非拉铁非、士每拿和罗马）写了七封书信，其中<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4P_致坡旅甲书">一封</a>是写给士每拿的主教坡旅甲的。到达罗马后，他于107年12月20日被投给狮子，殉道而死。</p><p>坡旅甲这样写到伊格那丢的来信：</p><blockquote><p>“你们和伊格那丢都<strong>写信给我</strong>，说若有人往叙利亚去，也要把你们的信带到那里”（<a href="https://bibleox.com/zh-Hans/en/w/Plk_Ph#HH-13">坡旅甲《致腓立比人书》第13章（英文）</a>）</p></blockquote><p>坡旅甲搜集伊格那丢的书信和关于他的一切消息，抄写并传播这些著作：</p><blockquote><p>“<strong>伊格那丢寄给我们的书信，以及我们手中其他的书信，我们已照你们的要求寄给你们了</strong>；它们附在这封信后面。你们可以从中得到很大的益处，因为其中有信心、忍耐，以及关乎我们主的一切造就。<strong>关于伊格那丢本人和与他同行的人，你们若得知什么确实的消息，请告诉我们</strong>”（<a href="https://bibleox.com/zh-Hans/en/w/Plk_Ph#HH-13">坡旅甲《致腓立比人书》第13章（英文）</a>）</p></blockquote><p>该撒利亚的尤西比乌（三至四世纪）也详细记述了伊格那丢，列举了他的七封书信，并“逐字”引用了其中一些：</p><blockquote><p>5. 他在坡旅甲所在的士每拿时，写了一封信给<strong>以弗所</strong>的教会，提到了那里的牧人阿尼西母；另一封写给米安得河畔的<strong>马格尼西亚</strong>的教会，信中提到了主教达马斯；还有一封写给<strong>特拉勒斯</strong>的教会，他说当时治理那里的是波利比乌。</p><p>6. 此外，他也写信给<strong>罗马</strong>的教会，恳求他们不要为他求情，免得夺去他所渴望的殉道的盼望。为证实上面所说的，值得引用这封信中简短的一段。他逐字这样写道：</p><p>〈引用书信的大部分〉</p><p>10. 他从上面提到的那座城，写信给以上这些教会。离开士每拿以后，他又从特罗亚写信给<strong>非拉铁非</strong>人，以及<strong>士每拿</strong>的教会，特别是给那教会的领袖<strong>坡旅甲</strong>。他深知坡旅甲是一位使徒式的人物，便作为一位真正的好牧人，把自己在安提阿的羊群托付给他，求他殷勤照顾。</p><p>11. 他在写给士每拿人的信中谈到基督，说了下面这段话——我不知道他是从哪里得来的：“因为我知道并且相信，祂在复活以后仍在肉身之中。祂来到彼得和与他在一起的人那里时，对他们说：‘你们摸我看看，我并不是没有身体的鬼魔。’他们立刻摸了祂，就信了”（《致士每拿人书》<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4S_致士每拿人书#HH-3">3:1-2</a>）。</p></blockquote><p>（<a href="https://bibleox.com/zh-Hans/en/w/eusebius-the-church-history-3#HH-Ignatius-and-His-Epistles">尤西比乌《教会史》第3卷第36章（英文）</a>）</p><p>尤西比乌还引用了里昂的爱任纽（二世纪）一部已失传的著作中的一段话；爱任纽在其中引用了伊格那丢致罗马人的书信：</p><blockquote><p>12. <strong>爱任纽</strong>也知道他的殉道，并<strong>提到他的书信</strong>，说：“正如我们中间一位因为为上帝作见证而被判喂野兽的人［在<strong>致罗马人书</strong>中］所说的：‘我是上帝的麦子，要被野兽的牙齿磨碎，好成为上帝的纯净的饼。’[1]”</p><p>13. 坡旅甲在他名下的致腓立比人书中，也提到了这些事。</p></blockquote><p>（<a href="https://bibleox.com/zh-Hans/en/w/eusebius-the-church-history-3#HH-Ignatius-and-His-Epistles">尤西比乌《教会史》第3卷第36章（英文）</a>）</p><p>斯特里敦的圣<a href="https://bibleox.com/zh-Hans/en/w/3v5Z_Jerome_of_Stridon_4th_c">哲罗姆</a>（约347–419年）也列举了伊格那丢的书信：</p><blockquote><p>伊格那丢是从使徒彼得算起安提阿教会的第三任主教。他被押往罗马，途中到达士每拿——那里的主教是约翰的门徒坡旅甲——便写了一封信给<strong>以弗所人</strong>，一封给<strong>马格尼西亚人</strong>，一封给<strong>特拉勒斯人</strong>，一封给<strong>罗马人</strong>；离开那里以后，他又写信给<strong>非拉铁非人</strong>和<strong>士每拿人</strong>，特别是写给<strong>坡旅甲</strong>，把安提阿的教会托付给他。</p></blockquote><p>（哲罗姆《名人列传》第16章，<a href="https://azbyka.ru/otechnik/Ieronim_Stridonskij/o_znamenityh/1_9#sel=63:1,63:52">俄文译本</a>）</p><h2>信仰</h2><h3>基督是上帝</h3><blockquote><p>“只有一位医生：<strong>既属肉身，又属灵；既是受生的，又是非受生的；是<mark>在人里面的上帝</mark>，是在死亡中的真生命；出于马利亚，也出于上帝；先是能受苦的，后是不能受苦的——就是<mark>我们的主耶稣基督</mark></strong>”（《致以弗所人书》<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4E_致以弗所人书#HH-7">7:2</a>）</p></blockquote><blockquote><p>“因为<strong><mark>我们的上帝耶稣基督</mark></strong>，按着上帝的安排（救恩计划），由马利亚怀孕，出于大卫的后裔，也出于圣灵”（《致以弗所人书》<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4E_致以弗所人书#HH-18">18:2</a>）</p></blockquote><blockquote><p>“从此，一切巫术都被解除，一切邪恶的捆绑都消失了；无知被除去，古老的王国被毁灭，因为<strong><mark>上帝以人的样式显现</mark></strong>，带来永生的更新”（《致以弗所人书》<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4E_致以弗所人书#HH-19">19:3</a>）</p></blockquote><blockquote><p>“凡看得见的，没有一样是美好的。<strong><mark>我们的上帝耶稣基督</mark></strong>既在父里面，就更加显明了”（《致罗马人书》<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4R_致罗马人书#HH-3">3:3</a>）</p></blockquote><blockquote><p>“我荣耀<strong><mark>耶稣基督——这位使你们如此有智慧的上帝</mark></strong>。因为我看出你们在不可动摇的信中得以成全，在肉身和灵性上好像被钉在主耶稣基督的十字架上，又因基督的血在爱中得以坚立。你们对我们的主满有确信：祂按肉身真是出于大卫的后裔”（《致士每拿人书》<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4S_致士每拿人书#HH-1">1:1</a>）</p></blockquote><blockquote><p>“我问候那将要配得前往叙利亚的人。愿恩典常与他同在，也与派他去的坡旅甲同在。我祈求你们在<strong><mark>我们的上帝耶稣基督</mark></strong>里常常安好”（《致坡旅甲书》<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4P_致坡旅甲书#HH-8">8:2-3</a>）</p></blockquote><h3>上帝由马利亚所生</h3><blockquote><p>“只有一位医生：<strong>既属肉身，又属灵；既是<mark>受生的</mark>，又是非受生的；是<mark>在人里面的上帝</mark>，是在死亡中的真生命；<mark>出于马利亚</mark>，也出于上帝；先是能受苦的，后是不能受苦的——就是<mark>我们的主耶稣基督</mark></strong>”（《致以弗所人书》<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4E_致以弗所人书#HH-7">7:2</a>）</p></blockquote><h3>感恩祭（圣体血）不是象征，而是耶稣基督真实的肉身和血</h3><p>伊格那丢指责异端者不信感恩祭是受了苦、又被父复活的耶稣基督的肉身。异端者不大可能不信感恩祭只是基督肉身的象征——不信一个象征，连想一想都是荒谬的。他们所不信的，正是感恩祭中有受了苦又复活了的基督的肉身本身，正如下文所说：</p><blockquote><p>“谁也不要自欺：天上的事物、天使的荣耀、看得见和看不见的执政者，<strong><mark>如果不信基督的血，也要受审判</mark></strong>。“能领受的，就领受吧。”〈……〉他们（异端者）远离感恩祭和祷告，因为他们不承认<strong><mark>感恩祭是我们的救主耶稣基督的肉身——这肉身为我们的罪受了苦，父又因祂的慈爱使之复活了</mark></strong>。所以，<strong>那些反对上帝恩赐的人，在争辩中死去</strong>”（《致士每拿人书》<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4S_致士每拿人书#HH-6">6:1</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4S_致士每拿人书#HH-7">7:1</a>）</p></blockquote><h3>基督徒不认为自己已经得救</h3><blockquote><p>“<strong><mark>开头已经安排得很好，</mark><u><mark>只要</mark></u><mark>我能得着恩典，毫无阻碍地领受我的产业</mark></strong>。但我怕你们的爱反而害了我。因为你们要做什么都很容易，但你们若怜惜我，<strong><mark>我要得着上帝就难了</mark></strong>。〈……〉<strong><mark>请你们为我祈求，使我能得着</mark></strong>。我写信给你们，不是按着肉体，而是按着上帝的心意。我若受苦，就是你们愿意我好；我若被拒绝，就是你们恨了我。〈……〉至于我，<strong>我耻于被称为他们中间的一员，因为我不配，我是他们中最小的，是未到产期而生的</strong>；但<strong><u><mark>我若</mark></u><mark>得着上帝，就是蒙了怜悯，得以成为一个人物</mark></strong>。我的灵和那些奉耶稣基督的名接待我、不把我当作过路人的众教会的爱，向你们问安”（《致罗马人书》<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4R_致罗马人书#HH-1">1:2</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4R_致罗马人书#HH-8">8:3</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4R_致罗马人书#HH-9">9:2-3</a>）</p></blockquote><h3>基督徒凭行为被认出</h3><blockquote><p>“宣认信仰的人不犯罪，拥有爱的人不恨人。“看果子就认出树来。”照样，<strong><mark>那些自称属基督的人，</mark><u><mark>必借着他们所行的显明出来</mark></u></strong>。因为现在要紧的不是宣认，而是在信的能力中坚持到底，被人找到。<strong><mark>沉默而（是基督徒），胜于说话而（不是基督徒）</mark></strong>。教导是好的，只要说话的人也去行”（《致以弗所人书》<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4E_致以弗所人书#HH-14">14:2</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4E_致以弗所人书#HH-15">15:1</a>）</p></blockquote><blockquote><p>“要以你们的洗礼为兵器，以信为头盔，以爱为长矛，以忍耐为全副军装。<strong><mark>要以你们的行为作存款，好领取你们应得的报偿</mark></strong>”（《致坡旅甲书》<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4P_致坡旅甲书#HH-6">6:2</a>）</p></blockquote><h3>为基督受苦是亲近上帝的标志</h3><blockquote><p>“我为什么把自己交给死亡、交给火、交给刀剑、交给野兽呢？不，<strong>靠近刀剑就是靠近上帝，在野兽中间就是在上帝中间；只要是奉耶稣基督的名就好</strong>。为了与祂一同受苦，我忍受一切，那成为完全之人的祂使我刚强”（《致士每拿人书》<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4S_致士每拿人书#HH-4">4:2</a>）</p></blockquote><h3>没有主教、司祭和辅祭，就没有教会</h3><p>就是说，两三个人只是聚在一起，并不就是教会：</p><blockquote><p>“同样，众人都要<strong><mark>尊重</mark><mark>辅祭</mark>如同尊重耶稣基督，也要尊重<mark>主教</mark>如同尊重父的预像，尊重<mark>司祭们</mark>如同尊重上帝的议会和使徒的团体。<mark>没有这些，就不能称为教会</mark>。</strong>我深信你们在这些事上正是如此。〈……〉所以我劝你们——不是我，而是耶稣基督的爱劝你们——只用基督徒的食物，远避异样的植物，就是异端。<strong>这些人为了取得信任，把耶稣基督掺杂在自己的教训里，好像把致命的毒药掺在蜜酒里给人；不知情的人欢欢喜喜地接过来，在邪恶的享乐中领受了死亡</strong>”（《致特拉勒斯人书》<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4T_致特拉勒斯人书#HH-3">3:1</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4T_致特拉勒斯人书#HH-6">6:1-2</a>）</p></blockquote><blockquote><p>“你们众人都要跟随<strong>主教</strong>，如同耶稣基督跟随父；要跟随<strong>司祭团</strong>，如同跟随使徒们；要尊重<strong>辅祭</strong>，如同尊重上帝的诫命。<strong>撇开主教，谁也不可做任何属于教会的事</strong>（参见<a href="https://bibleox.com/zh-Hans/en/w/councils-the-canons-of-the-holy-apostles">《圣使徒规条》第39条（英文）</a>）。唯有在主教之下、或由他所委托的人所举行的感恩祭，才被视为确实可靠的。<strong><u><mark>主教在哪里出现，会众也应当在哪里，正如耶稣基督在哪里，大公教会就在哪里</mark></u></strong>。撇开主教，不可施洗，也不可举行爱筵；凡他所认可的，也是上帝所喜悦的，好使你们所做的一切都稳妥可靠。〈……〉认识上帝和主教是美好的。尊敬主教的，必蒙上帝尊敬；<strong><mark>瞒着主教做事的，就是在事奉魔鬼</mark></strong>”（《致士每拿人书》<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4S_致士每拿人书#HH-8">8:1-2</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4S_致士每拿人书#HH-9">9:1</a>）</p></blockquote><blockquote><p>“<strong><mark>你们要留心主教，好使上帝也留心你们</mark></strong>。<strong>我为那些顺服主教、司祭和辅祭的人献上我的性命；愿我能与他们一同在上帝里有份</strong>。你们要彼此同劳，同争战，同奔跑，同受苦，同安息，同起来，如同上帝的管家、侍从和仆人。〈……〉我祈求你们在我们的上帝耶稣基督里常常安好；愿你们在祂里面，在上帝的合一和主教的看顾中持守不移。〈……〉若有人能为了尊荣主的肉身而持守贞洁，就让他毫不夸口地持守。<strong><mark>他若夸口，就灭亡了；他若想比主教更为人所知，就败坏了</mark></strong>”（《致坡旅甲书》<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4P_致坡旅甲书#HH-6">6:1</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4P_致坡旅甲书#HH-8">8:3</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4P_致坡旅甲书#HH-5">5:2</a>）</p></blockquote><h3>三品圣职（主教、司祭、辅祭）</h3><p>圣伊格那丢写道，叙利亚的教会没有了主教：司祭虽然很多，但叙利亚的主教只有伊格那丢一人，而他现在已经被捕，被押往罗马处死。很明显，司祭们自己不能设立主教；否则他们很快就会这样做，叙利亚也不会没有主教了：</p><blockquote><p>“请你们在祷告中记念<strong><mark>叙利亚的教会；如今那教会不再有我，而以上帝为牧人</mark>。唯有耶稣基督和你们的爱要作它的主教</strong>”（《致罗马人书》<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4R_致罗马人书#HH-9">9:1</a>）</p></blockquote><p>特别值得注意的是：主教总是用单数，而司祭和辅祭总是用复数（<a href="https://bibleox.com/ru/ru/w/трёхчинная-священническая-иерархия#HH-Тертуллиан-155-220">特土良也是如此（俄文）</a>）。也就是说，各地的教会只有一位首领，就是主教；在他之下有许多司祭（字面意思是“他的司祭们”）和辅祭：</p><blockquote><p>“我在耶稣基督的血中问候这教会；这血是永远长存的喜乐，特别是当人们与<strong><mark>主教，以及与他同在的司祭们和辅祭们</mark></strong>——就是按着耶稣基督的心意所立的人——合而为一的时候。主照着自己的旨意，借着祂的圣灵坚固了他们。〈……〉所以，你们要努力只领受一个感恩祭。因为我们主耶稣基督的肉身只有一个，使人与祂的血联合的杯也只有一个，祭坛只有一个；同样，<strong><mark>主教也只有一位，与司祭团和我的同作仆人的辅祭们在一起</mark></strong>。这样，你们无论做什么，都是按着上帝去做。〈……〉我在你们中间的时候曾经呼喊，大声说话，用上帝的声音说：“要留心<strong><mark>主教、司祭团和辅祭们</mark></strong>。”〈……〉你们若愿意，为上帝的名做这事并不是不可能的；正如那些最近的教会已经派了<strong><mark>主教</mark>，其他的教会也派了<mark>司祭和辅祭</mark></strong>一样”（<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4F_致非拉铁非人书#HH-0">《致非拉铁非人书》问候语</a>、《致非拉铁非人书》<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4F_致非拉铁非人书#HH-4">第4章</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4F_致非拉铁非人书#HH-7">7:1</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4F_致非拉铁非人书#HH-10">10:3</a>）</p></blockquote><p>其他地方也是一样：一位主教（被比作基督或父上帝），在他之下有许多司祭（被比作使徒）和辅祭：</p><blockquote><p>“同样，众人都要<strong><mark>尊重</mark><mark>辅祭</mark>如同尊重耶稣基督，也要尊重<mark>主教</mark>如同尊重父的预像，尊重<mark>司祭们</mark>如同尊重上帝的议会和使徒的团体。</strong>我深信你们在这些事上正是如此。没有这些，就不能称为教会。”（《致特拉勒斯人书》<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4T_致特拉勒斯人书#HH-3">3:1</a>）</p></blockquote><blockquote><p>“你们众人都要跟随<strong><mark>主教</mark></strong>（一位——注），如同耶稣基督跟随父；要跟随<strong><mark>司祭团</mark></strong>，如同跟随使徒们；要尊重<strong><mark>辅祭</mark></strong>，如同尊重上帝的诫命。<strong>撇开主教，谁也不可做任何属于教会的事</strong>。唯有在主教之下、或由他所委托的人所举行的感恩祭，才被视为确实可靠的。主教在哪里出现，会众也应当在哪里，正如耶稣基督在哪里，大公教会就在哪里。撇开主教，不可施洗，也不可举行爱筵；凡他所认可的，也是上帝所喜悦的，好使你们所做的一切都稳妥可靠。〈……〉认识上帝和主教是美好的。尊敬主教的，必蒙上帝尊敬；瞒着主教做事的，就是在事奉魔鬼”（《致士每拿人书》<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4S_致士每拿人书#HH-8">8:1-2</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4S_致士每拿人书#HH-9">9:1</a>）</p></blockquote><blockquote><p>“你们要留心主教，好使上帝也留心你们。<strong>我为那些顺服主教、司祭和辅祭的人献上我的性命；愿我能与他们一同在上帝里有份</strong>。你们要彼此同劳，同争战，同奔跑，同受苦，同安息，同起来，如同上帝的管家、侍从和仆人。〈……〉我祈求你们在我们的上帝耶稣基督里常常安好；愿你们在祂里面，在上帝的合一和<strong>主教</strong>的看顾中持守不移。〈……〉若有人能为了尊荣主的肉身而持守贞洁，就让他毫不夸口地持守。他若夸口，就灭亡了；他若想比主教更为人所知，就败坏了”（《致坡旅甲书》<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4P_致坡旅甲书#HH-6">6:1</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4P_致坡旅甲书#HH-8">8:3</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4P_致坡旅甲书#HH-5">5:2</a>）</p></blockquote><h3>十字架是基督和基督徒的工具</h3><blockquote><p>“因为你们是父殿中的石头，为父上帝的建筑预备好了，<strong>借着<mark>耶稣基督的起重机——就是十字架</mark>——<mark>被举到高处</mark></strong>，用圣灵作绳索；你们的信是把你们牵引向上的，爱则是引向上帝的道路”（《致以弗所人书》<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4E_致以弗所人书#HH-9">9:1</a>）</p></blockquote><h3>教会合一的宝贵</h3><blockquote><p>“<strong><mark>要关心合一，没有什么比合一更好</mark></strong>”（《致坡旅甲书》<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4P_致坡旅甲书#HH-1">1:2</a>）</p></blockquote><blockquote><p>““……<strong><mark>要爱合一</mark>；要逃避分裂</strong>；要效法耶稣基督，如同祂效法祂的父一样。”所以，我作为一个为合一而被造就的人，尽了我的本分。<strong>哪里有分裂和怒气，上帝就不住在那里</strong>。但凡悔改的人，<strong>主都<mark>赦免他们，只要他们悔改，回到上帝的合一</mark>和主教的议会中来</strong>”（《致非拉铁非人书》<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4F_致非拉铁非人书#HH-7">7:2</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4F_致非拉铁非人书#HH-8">8:1</a>）</p></blockquote><blockquote><p>“我既蒙赐一个最配得上帝的名，就<strong>在我所带的锁链中歌颂众教会，并祈求在众教会中，有耶稣基督</strong>——我们永远的生命——<strong>的<mark>肉身与灵的合一</mark></strong>，有无可比拟的<strong><mark>信与爱的合一</mark></strong>”（《致马格尼西亚人书》<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4M_致马格尼西亚人书#HH-1">1:2</a>）</p></blockquote><blockquote><p>“<strong><mark>在你们中间不可有任何能使你们分裂的事</mark>，而要与<mark>主教</mark>和那些居首位的人<mark>合而为一</mark></strong>，作为不朽坏的标记和教导”（《致马格尼西亚人书》<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4M_致马格尼西亚人书#HH-6">6:2</a>）</p></blockquote><blockquote><p>“要顺服主教，也要彼此顺服，如同耶稣基督顺服父，使徒们顺服基督和父，<strong>好使<mark>合一既是肉身的，也是属灵的</mark></strong>”（《致马格尼西亚人书》<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4M_致马格尼西亚人书#HH-13">13:2</a>）</p></blockquote><blockquote><p>“我并不是在你们中间发现了分裂，而是发现了一种滤净。<strong>凡属上帝、属耶稣基督的人，都与主教在一起。<mark>那些悔改、回到教会合一中来的人，也必属上帝</mark></strong>，好按着耶稣基督生活。我的弟兄们，不要自欺：<strong>跟从制造分裂之人的，必不能承受上帝的国</strong>”（《致非拉铁非人书》<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4F_致非拉铁非人书#HH-3">3:1-3</a>）</p></blockquote><blockquote><p>“<strong>不要设法使你们私下所做的事显得合理</strong>，而要聚集在一处：一个祷告，一个祈求，一个心思，在爱中、在无瑕的喜乐中有一个盼望”（《致马格尼西亚人书》<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4M_致马格尼西亚人书#HH-7">7:1</a>）</p></blockquote><h3>修道生活</h3><blockquote><p>“若有人能为了尊荣主的肉身而持守贞洁，就让他毫不夸口地持守”（《致坡旅甲书》<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4P_致坡旅甲书#HH-5">5:2</a>）</p></blockquote><h3>在异端和分裂中不能得救</h3><blockquote><p>“所以，<strong>真理之光的儿女啊，<mark>要逃避分裂和邪恶的教训</mark>；牧人在哪里，你们就要像羊一样跟到哪里</strong>。因为许多看似可信的豺狼，用邪恶的享乐掳掠那些向上帝奔跑的人；但在你们的合一中，他们无处容身。<strong>要远避那些坏的植物；耶稣基督不培育它们，<mark>因为它们不是父所栽种的</mark></strong>。我并不是在你们中间发现了分裂，而是发现了一种滤净。<strong><mark>凡属上帝、属耶稣基督的人，都与主教在一起</mark></strong>。那些悔改、回到教会合一中来的人，也必属上帝，好按着耶稣基督生活。我的弟兄们，不要自欺：<strong><mark>跟从制造分裂之人的，必不能承受上帝的国；照着异样的见解行事的，与（基督的）受难无份</mark></strong>。〈……〉<strong>哪里有分裂和怒气，上帝就不住在那里</strong>。但凡悔改的人，<strong>主都赦免他们，只要他们悔改，回到上帝的合一和主教的议会中来</strong>”（《致非拉铁非人书》<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4F_致非拉铁非人书#HH-2">第2章</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4F_致非拉铁非人书#HH-3">第3章</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4F_致非拉铁非人书#HH-8">8:1</a>）</p></blockquote><blockquote><p>“我的弟兄们，不要自欺：败坏家庭的人必不能承受上帝的国。如果那些在肉身上行这些事的人尚且死了，<strong><mark>何况那以邪恶的教训败坏上帝之信仰——耶稣基督为此被钉十字架——的人呢？这样的人既已污秽，必往那不灭的火里去；听从他的人也是如此</mark></strong>。主之所以在头上受香膏，是为了向教会吹送不朽坏的馨香。<strong>不要用这世代之王的教训的恶臭来抹自己，免得他把你们掳去，离开那摆在你们面前的生命</strong>”（《致以弗所人书》<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4E_致以弗所人书#HH-16">第16章</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4E_致以弗所人书#HH-17">17:1</a>）</p></blockquote><h3>远离异端者</h3><blockquote><p>“所以，<strong><mark>你们要逃避那些结出致死果子的坏枝子</mark></strong>；人一尝它，立刻就死。<strong><mark>因为这些人不是父所栽种的</mark></strong>。他们若是父所栽种的，就必显为十字架的枝子，他们的果子也必是不朽坏的”（《致特拉勒斯人书》<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4T_致特拉勒斯人书#HH-11">11:1-2</a>）</p></blockquote><h3>灵魂离开身体以后的生命</h3><blockquote><p>“<strong>从世界沉落到上帝那里是美好的，好使我在祂里面升起</strong>。〈……〉我若真被看为基督徒，也就可以被称为基督徒；<strong><mark>当我不再在世人眼前出现的时候</mark>，我才<mark>是</mark>忠信的</strong>。<strong><mark>凡看得见的，没有一样是美好的</mark></strong>。〈……〉现在我开始作门徒了。<strong><mark>愿看得见的和看不见的一切，都不要嫉妒我，使我能得着耶稣基督</mark></strong>。〈……〉不要把愿意属于上帝的人<strong>交给世界</strong>，也不要用物质迷惑他。<strong>让我领受纯净的光吧；<mark>到了那里，我才成为（真正的）人</mark></strong>。〈……〉我活着写信给你们，却渴慕死亡。我的爱欲已经被钉在十字架上，在我里面没有爱恋物质的火，只有活水<strong><mark>在我里面说话，从里面对我说：“到父那里去吧。”</mark></strong>”（《致罗马人书》<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4R_致罗马人书#HH-2">2:2</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4R_致罗马人书#HH-3">3:2-3</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4R_致罗马人书#HH-5">5:3</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4R_致罗马人书#HH-6">6:2</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4R_致罗马人书#HH-7">7:2</a>）</p></blockquote><h3>犹太律法的废除</h3><blockquote><p>“<strong><mark>因为我们若直到如今还照着犹太教生活，就是承认自己没有领受恩典</mark></strong>。那些最神圣的先知都是按着基督耶稣生活的，所以他们也受了逼迫。他们受祂恩典的感动，使不顺从的人确信：上帝只有一位，祂借着祂的儿子耶稣基督显明了自己。这儿子是从静默中发出的祂的道。〈……〉那些在旧的规矩中生活过的人，既进入了新的盼望，<strong><mark>不再守安息日，而按着主日生活</mark></strong>——在主日，我们的生命也借着祂和祂的死升起来了；<strong>有些人否认这死</strong>，但我们借着这奥秘领受了信，并且为此忍耐，好被看为我们唯一的老师耶稣基督的门徒。〈……〉所以，<strong>我们既作了祂的门徒，就要学习按照基督教生活</strong>。凡被别的名而不是被这名称呼的人，就不是属上帝的。所以，<strong><mark>要除去那已经陈旧变酸的坏酵，而变成新酵，就是耶稣基督</mark></strong>。要在祂里面用盐调和，免得你们中间有人败坏，因为你们必从气味上被识别出来。<strong><mark>口称耶稣基督，却照犹太教生活，是荒谬的</mark>。因为不是基督教信了犹太教，而是犹太教信了基督教</strong>；一切信上帝的语言的人都被聚集到基督教里来了”（《致马格尼西亚人书》<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4M_致马格尼西亚人书#HH-8">8:1-2</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4M_致马格尼西亚人书#HH-9">9:1</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4M_致马格尼西亚人书#HH-10">10:1-3</a>）</p></blockquote><blockquote><p>“<strong><mark>若有人向你们解说犹太教，不要听他</mark>。从受割礼的人那里听基督教，胜于从未受割礼的人那里听犹太教</strong>。但如果两人都不讲论耶稣基督，对我来说，他们就是墓碑和死人的坟墓，上面只写着人的名字”（《致非拉铁非人书》<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4F_致非拉铁非人书#HH-6">6:1</a>）</p></blockquote><h3>地狱中无穷的痛苦</h3><blockquote><p>“如果那些在肉身上行这些事的人尚且死了，何况那以邪恶的教训败坏上帝之信仰——耶稣基督为此被钉十字架——的人呢？这样的人既已污秽，<strong>必往那<mark>不灭的火</mark>里去</strong>；听从他的人也是如此”（《致以弗所人书》<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4E_致以弗所人书#HH-16">16:2</a>）</p></blockquote><h3>对“唯独圣经”建立信仰者的责备</h3><p>伊格那丢谈到一些人：他们争辩说，凡不能用旧约圣经证明的事就不信；而当人把经文指给他们看时，他们又继续争论经文的意思。伊格那丢回答说，经上虽然记着，但对他来说，“古老的档案”（最重要的）是耶稣基督和祂的信——这信是圣伊格那丢直接从使徒和他们的门徒那里领受的：</p><blockquote><p>“我相信耶稣基督的恩典，祂必解开你们的一切捆绑。我劝你们，<strong><mark>凡事不可结党，而要照着从基督所学的去做</mark></strong>。因为<strong><mark>我听见有些人说</mark>：“<mark>我若不在古老的档案中找到，就不信福音中所说的</mark>。”</strong><strong>我对他们说：“经上记着。”他们回答我说：“这正需要证明。”<mark>但对我来说，古老的档案就是耶稣基督</mark></strong>；不可侵犯的档案就是祂的十字架、祂的死、祂的复活，<strong><mark>以及借着祂而有的信</mark></strong>。我愿借着你们的祷告，在这些事上被称为义”（《致非拉铁非人书》<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4F_致非拉铁非人书#HH-8">8:1-2</a>）</p></blockquote><h2>关于文本的年代</h2><p>伊格那丢的书信流传下来的有几种版本：短版、中版和长版。中版最古老，也流传最广。三至四世纪时，该撒利亚的尤西比乌提到的就是这一书信集。</p><p>个别书信在更早的时候就被提到了。例如在二世纪，与伊格那丢同时代的士每拿的坡旅甲就写到伊格那丢的来信：</p><blockquote><p>“你们和伊格那丢都<strong>写信给我</strong>，说若有人往叙利亚去，也要把你们的信带到那里”（<a href="https://bibleox.com/zh-Hans/en/w/Plk_Ph#HH-13">坡旅甲《致腓立比人书》第13章（英文）</a>）</p></blockquote><p>坡旅甲搜集伊格那丢的书信和关于他的一切消息，抄写并传播这些著作：</p><blockquote><p>“<strong>伊格那丢寄给我们的书信，以及我们手中其他的书信，我们已照你们的要求寄给你们了</strong>；它们附在这封信后面。你们可以从中得到很大的益处，因为其中有信心、忍耐，以及关乎我们主的一切造就。<strong>关于伊格那丢本人和与他同行的人，你们若得知什么确实的消息，请告诉我们</strong>”（<a href="https://bibleox.com/zh-Hans/en/w/Plk_Ph#HH-13">坡旅甲《致腓立比人书》第13章（英文）</a>）</p></blockquote><p>现存最古老的希腊文抄本（五世纪）是上文坡旅甲提到过的致士每拿人书。致罗马人书的希腊文抄本保存下来的年代较晚，但有五世纪的叙利亚文和古亚美尼亚文译本。此外，致罗马人书、致士每拿人书、致坡旅甲书、致特拉勒斯人书和致非拉铁非人书还有四世纪的科普特文译本。</p><p>该撒利亚的尤西比乌（三至四世纪）引用了里昂的爱任纽（二世纪）一部已失传的著作，爱任纽在其中引用了伊格那丢致罗马人的书信：</p><blockquote><p>12. 爱任纽也知道他的殉道，并提到他的书信，说：“正如我们中间一位因为为上帝作见证而被判喂野兽的人所说的：‘<strong>我是上帝的麦子，要被野兽的牙齿磨碎，好成为上帝的纯净的饼</strong>。’”（《致罗马人书》<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4R_致罗马人书#HH-4">4:1</a>）</p></blockquote><p>（<a href="https://bibleox.com/zh-Hans/en/w/eusebius-the-church-history-3#HH-Ignatius-and-His-Epistles">尤西比乌《教会史》第3卷第36章（英文）</a>）</p><p>尤西比乌引用的是中版的文本。我们可以把尤西比乌的引文与今天流传的文本作比较。不同之处加了下划线（只是多了两个词，并不改变内容，都是列举酷刑的种类）：</p><table class="custom-table"><colgroup></colgroup><tbody><tr><td><p><strong>出自尤西比乌的《教会史》</strong></p><p>ἀπὸ Συρίας μέχρι Ῥώμης θηριομαχῶ διὰ γῆς καὶ θαλάσσης, νυκτὸς καὶ ἡμέρας, ἐνδεδεμένος δέκα λεοπάρδοις, ὅ ἐστιν στρατιωτικὸν τάγμα, οἳ καὶ εὐεργετούμενοι χείρονες γίνονται, ἐν δὲ τοῖς ἀδικήμασιν αὐτῶν μᾶλλον μαθητεύομαι· ἀλλ' οὐ παρὰ τοῦτο δεδικαίωμαι. ὀναίμην τῶν θηρίων τῶν ἐμοὶ ἑτοίμων, ἃ καὶ εὔχομαι σύντομά μοι εὑρεθῆναι· ἃ καὶ κολακεύσω συντόμως με καταφαγεῖν, οὐχ ὥσπερ τινῶν δειλαινόμενα οὐχ ἥψαντο, κἂν αὐτὰ δὲ ἄκοντα μὴ θέλῃ, ἐγὼ προσβιάσομαι. συγγνώμην μοι ἔχετε· τί μοι συμφέρει, ἐγὼ γινώσκω, νῦν ἄρχομαι μαθητὴς εἶναι. μηδέν με ζηλώσαι τῶν ὁρατῶν καὶ ἀοράτων, ἵνα Ἰησοῦ Χριστοῦ ἐπιτύχω· πῦρ καὶ σταυρὸς θηρίων τε συστάσεις, <strong><u>___</u></strong> σκορπισμοὶ ὀστέων, συγκοπαὶ μελῶν, ἀλεσμοὶ ὅλου τοῦ σώματος, κολάσεις τοῦ διαβόλου εἰς ἐμὲ ἐρχέσθωσαν, μόνον ἵνα Ἰησοῦ Χριστοῦ ἐπιτύχω</p><p><a href="https://bibleox.com/zh-Hans/grc/w/ΕΚΚΛΗΣΙΑΣΤΙΚΗΣ_ΙΣΤΟΡΙΑΣ-3#HH-36">希腊文原文</a></p></td><td><p><strong>出自伊格那丢的书信</strong></p><p>Ἀπὸ Συρίας μέχρι Ῥώμης θηριομαχῶ, διὰ γῆς καὶ θαλάσσης, νυκτὸς καὶ ἡμέρας, δεδεμένος δέκα λεοπάρδοις, ὅ ἐστιν στρατιωτικὸν τάγμα· οἳ καὶ εὐεργετούμενοι χείρους γίνονται. ἐν δὲ τοῖς ἀδικήμασιν αὐτῶν μᾶλλον μαθητεύομαι, ἀλλ' οὐ παρὰ τοῦτο δεδικαίωμαι. ὀναίμην τῶν θηρίων τῶν ἐμοὶ ἡτοιμασμένων καὶ εὔχομαι σύντομά μοι εὑρεθῆναι· ἃ καὶ κολακεύσω, συντόμως με καταφαγεῖν, οὐχ ὥσπερ τινῶν δειλαινόμενα οὐχ ἥψαντο. κἂν αὐτὰ δὲ ἄκοντα μὴ θελήσῃ, ἐγὼ προσβιάσομαι. συγγνώμην μοι ἔχετε· τί μοι συμφέρει, ἐγὼ γινώσκω, νῦν ἄρχομαι μαθητὴς εἶναι. μηθέν με ζηλώσαι τῶν ὁρατῶν καὶ ἀοράτων, ἵνα Ἰησοῦ Χριστοῦ ἐπιτύχω. πῦρ καὶ σταυρὸς θηρίων τε συστάσεις, <strong><u>ἀνατομαί, διαιρέσεις</u></strong>, σκορπισμοὶ ὀστέων, συγκοπὴ μελῶν, ἀλεσμοὶ ὅλου τοῦ σώματος, κακαὶ κολάσεις τοῦ διαβόλου ἐπ' ἐμὲ ἐρχέσθωσαν, μόνον ἵνα Ἰησοῦ Χριστοῦ ἐπιτύχω</p><p><a href="https://bibleox.com/zh-Hans/grc/w/ΙγνΘ_Ρωμ#HH-5">希腊文原文</a>（中文译文：《致罗马人书》<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4R_致罗马人书#HH-5">5:3</a>）</p></td></tr></tbody></table><p>短版的书信集也不一定是作为伪作出现的。古时有把著名作品缩写改编的习惯。例如在二世纪，殉道者游斯丁的门徒他提安把四部福音书合编成一部作品，就是《四福音合参》（Diatessaron）。这部作品广为人知，长期在教会中诵读，有时甚至取代了福音书，以致后来不得不加以排除，恢复诵读福音书本身。《四福音合参》并不是有意作伪，而只是作为一部辅助性的作品编写的，也正是以这种方式流传的。</p><p>《四福音合参》的存在，并不说明福音书是伪造的，也不能把福音书的成书年代推迟到二世纪；《四福音合参》本身也没有自称是一世纪的作品。它是二世纪的作品。</p><p>学者们对殉道者伊格那丢的著作有相当高的信任。详情请看<a href="https://azbyka.ru/otechnik/Ignatij_Antiohijskij/ignatij-antiokhijskij-episkop-muchenik-i-proiskhozhdenie-episkopata/5">这里（俄文）</a>。</p>
