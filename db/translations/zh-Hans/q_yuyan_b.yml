  path: QY2A_关于基督的预言
  title: 关于基督的预言
  copy_cover: true
  body: <h2>预言</h2><ol><li><p>到基督来临为止的天数（<a href="https://bibleox.com/zh-Hans/cn-cuv/dan/9/#L24-25">但 9:24-25</a>）；</p></li><li><p>基督将在<strong>第二座</strong>耶路撒冷圣殿来临（那殿如今已不存在，<a href="https://bibleox.com/zh-Hans/cn-cuv/ag/2/#L9">该 2:9</a>）；</p></li><li><p>基督来临之时，犹大支派已失去权柄（<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/49/#L10">创 49:10</a>）。大希律一世是以东人，即以扫的后裔，不是犹太人。他取代了马加伯所属的哈斯蒙尼犹太王朝。</p></li><li><p>基督将生在伯利恒（<a href="https://bibleox.com/zh-Hans/cn-cuv/mih/5/#L2">弥 5:2</a>）；</p></li><li><p>基督将是大卫的后裔（<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/89/#L4-6,29-31,37">诗 89:4-6,29-31,37</a>）；</p></li><li><p>基督将缔立新约（<a href="https://bibleox.com/zh-Hans/cn-cuv/is/42/#L6">赛 42:6</a>）。与上帝立的一切约都以血为凭，而这一次——是以耶稣基督自己的血；</p></li><li><p>基督将因三十块钱被出卖（<a href="https://bibleox.com/zh-Hans/cn-cuv/zah/11/#L12-13">亚 11:12-13</a>）；</p></li><li><p>基督将与强盗一同被处死（<a href="https://bibleox.com/zh-Hans/cn-cuv/dan/9/#L26">但 9:26</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/is/53/#L12">赛 53:12</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/zah/12/#L10">亚 12:10</a>）；</p></li><li><p>他的手和脚要被扎透（<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/22/#L16">诗 22:16</a>）；他要被扎透（用枪）（<a href="https://bibleox.com/zh-Hans/cn-cuv/zah/12/#L10">亚 12:10</a>）（对批评的回答见下文）；</p></li><li><p>路过的人将讥诮基督，说：他既倚靠上帝，上帝若喜悦他，现在可以救他（<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/22/#L7-8">诗 22:7-8</a>）</p></li><li><p>基督被处死之后，耶路撒冷和圣殿将被毁灭（<a href="https://bibleox.com/zh-Hans/cn-cuv/dan/9/#L26">但 9:26</a>）；</p></li><li><p>先知以赛亚论及基督救赎性苦难的整章：<a href="https://bibleox.com/zh-Hans/cn-cuv/is/53/">赛 53</a>:</p></li></ol><blockquote><p>“哪知他<strong><mark>为我们的过犯受害</mark></strong>，<strong><mark>为我们的罪孽压伤</mark></strong>。<strong><mark>因他受的刑罚，我们得平安</mark></strong>；<strong><mark>因他受的鞭伤，我们得医治</mark></strong>。 <strong><mark>我们都如羊走迷，各人偏行己路</mark></strong>。<strong><mark>耶和华使我们众人的罪孽都归在他身上</mark></strong>。 他被欺压，在受苦的时候却不开口。<strong><mark>他像羊羔被牵到宰杀之地</mark></strong>，又像羊在剪毛的人手下无声，他也是这样不开口。 因受欺压和审判，他被夺去，至于他同世的人，谁想他受鞭打、从活人之地被剪除，是因我百姓的罪过呢？ 他虽然未行强暴，口中也没有诡诈，人还使他与恶人同埋；谁知死的时候<strong><mark>与财主同葬</mark></strong>。 <strong><mark>耶和华却定意将他压伤</mark></strong>，使他受痛苦；<strong><mark>耶和华以他为赎罪祭</mark></strong>。<strong><mark>他必看见后裔</mark></strong>，并且延长年日，<strong><mark>耶和华所喜悦的事必在他手中亨通</mark></strong>。 <strong><mark>他必看见自己劳苦的功效，便心满意足</mark></strong>。<strong><mark>有许多人因认识我的义仆得称为义</mark></strong>，并且<strong><mark>他要担当他们的罪孽</mark></strong>。 所以，我要使他与位大的同分，与强盛的均分掳物。<strong><mark>因为他将命倾倒，以致于死</mark></strong>。<strong><mark>他也被列在罪犯之中</mark></strong>。<strong><mark>他却担当多人的罪，又为罪犯代求</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/53/#L5-12">赛 53:5-12</a>)</p></blockquote><h2>基督苦难的预像</h2><ol><li><p>上帝设立了受封为大祭司的礼仪：大祭司和众祭司把手按在公牛身上，然后在会幕门口宰杀它（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L10-11">出 29:10-11</a>）。同样，大祭司和祭司们密谋在夜里捉拿基督（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/26/#L45-47">太 26:45-47</a>），后来在耶路撒冷城门口处死了他（<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/13/#L12">希 13:12</a>）。</p></li><li><p>再者，就在同一处。用公牛的血抹在坛的四角上，把血都倒在坛脚那里（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L12">出 29:12</a>）。基督被献为祭的坛，就是十字架。基督的血抹在十字架上，因为基督的手和脚被钉子钉穿，后来又被枪扎透，血流到十字架（坛）的根基处。</p></li><li><p>受封礼仪结束之后，坛就成为大圣物：凡挨着坛的都成为圣（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L37">出 29:37</a>）。同样，十字架（坛）在基督徒中成为大圣物，用来祝圣水、物件、人。它作为器物用于祝圣水的过程，人们也用手画十字圣号在人和物件上。</p></li></ol><h2>关于基督苦难的预言</h2><ol><li><p>基督将自称上帝之子；</p></li><li><p>他的话语和行为将指摘他的反对者；</p></li><li><p>他将称上帝为自己的父；</p></li><li><p>基督的反对者将凌辱并折磨他；</p></li><li><p>他们将判他受可耻的死刑。</p></li></ol><blockquote><p>“我们要陷害义人，因为他太令我们讨厌，反对我们的作为，<strong>指责我们违犯法律</strong>，控诉我们品行不检，<strong>自夸认识天主</strong>，<strong>自称是上主的仆人</strong>；他竟<strong>充作我们思想的裁判员</strong>，我们一见他，就感觉讨厌；因为他的生活与众不同，他的行径与人两样。他竟将我们视作杂种，远避我们的行径，像远避不洁之物；声言义人有幸福的结局，且<strong>自夸有天主为父</strong>。我们且看他的话是否属实，看他究有什么结局。因为，<strong>如果义人是天主的儿子，天主定要帮助他，拯救他脱离敌人的手</strong>。<strong>来罢！我们用耻辱和酷刑试验他</strong>，查看他是否温良，考验他是否忍耐。<strong>我们判他受可耻的死刑</strong>，看他是否蒙受眷顾，如他所说的一样。他们这样思想真是荒谬，因为邪恶使他们丧失了理智，” (<a href="https://bibleox.com/zh-Hans/cn-sb/prs/2/#L12-21">智 2:12-21</a>)</p></blockquote><h2>批评</h2><h3>手和脚是被扎透了，还是被狮子撕扯？</h3><p>晚期的马所拉文本在<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/22/#L16">诗 22:16</a>中没有关于手和脚被扎透的话。那里用的词是「狮子」（כָּאֲרִי）。「撕扯」（动词）一词在文本中根本没有，而且狮子所作的事与手和脚有什么关系也不清楚。</p><p>然而，正确的还是「扎透了」。在库姆兰古卷4Q88[2]中确认了手和脚被扎透。</p><p>此外，还有另一处预言说到正是被扎透。它在这里被提及：</p><blockquote><p>“经上又有一句说：『<strong><mark>他们要仰望自己所扎的人</mark></strong>。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/19/#L37">约 19:37</a>)</p></blockquote><p>这里的出处：</p><blockquote><p>“我必将那施恩叫人恳求的灵，浇灌大卫家和耶路撒冷的居民．他们必仰望我，<strong><mark>就是他们所扎的</mark></strong>；必为我悲哀，如丧独生子，又为我愁苦，如丧长子。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/zah/12/#L10">亚 12:10</a>)</p></blockquote><blockquote><p>“וְשָׁפַכְתִּי עַל ־ בֵּית דָּוִיד וְעַל ׀ יוֹשֵׁב יְרוּשָׁלִַם רוּחַ חֵן וְתַחֲנוּנִים וְהִבִּיטוּ אֵלַי אֵת אֲשֶׁר ־ <strong>דָּקָרוּ</strong> וְסָפְדוּ עָלָיו כְּמִסְפֵּד עַל ־ הַיָּחִיד וְהָמֵר עָלָיו כְּהָמֵר עַֽל ־ הַבְּכֽוֹר ׃” (<a href="https://bibleox.com/zh-Hans/heb-osm/zah/12/#L10">撒迦利亚书 12:10（希伯来文）</a>)</p></blockquote><p>דָּקָ֑רוּ</p><p>דקר——扎透、刺穿；以及：被刺穿、被扎透。</p><p>库姆兰卷轴4Q80确认：是被扎透了。</p>
