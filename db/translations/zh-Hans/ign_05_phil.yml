    title: 致非拉铁非人书
    meta_desc: 安提阿的圣伊格那丢（提阿弗罗斯）写给非拉铁非教会的书信。译自希腊文原文，附注释。
    menu: { parent: "书信", title: "致非拉铁非人书", priority: 7 }
    body: |-
      <h2>0</h2><p>伊格那丢，又名提阿弗罗斯[1]，致在亚细亚非拉铁非的父上帝和主耶稣基督的教会：这教会蒙了怜悯，在上帝的同心中坚立，毫无疑惑地因我们主的受难欢喜，并因祂的复活在一切怜悯中充满确信。我在耶稣基督的血中问候这教会[2]；这血是永远长存的喜乐，特别是当人们与主教，以及与他同在的司祭们和辅祭们——就是按着耶稣基督的心意所立的人——合而为一的时候。主照着自己的旨意，借着祂的圣灵坚固了他们。</p>
      <h2>1</h2><p>1. 我知道你们的主教得着这属于全体的服务职分，不是出于自己，也不是借着人[3]，更不是为了虚荣，而是在父上帝和主耶稣基督的爱中得着的。他的宽和使我惊叹；他沉默时所能做的，比那些说空话的人还多。</p><p>2. 他与诫命和谐相合，如同竖琴与琴弦相合。因此，我的灵魂称他向上帝的心志为有福，因为我认识到这心志充满美德而完全，也认识到他在永生上帝的一切宽和中坚定不移、毫不动怒。</p>
      <h2>2</h2><p>1. 所以，真理之光的儿女啊，要逃避分裂和邪恶的教训；牧人在哪里，你们就要像羊一样跟到哪里。</p><p>2. 因为许多看似可信的豺狼[4]，用邪恶的享乐掳掠那些向上帝奔跑的人；但在你们的合一中，他们无处容身。</p>
      <h2>3</h2><p>1. 要远避那些坏的植物；耶稣基督不培育它们，因为它们不是父所栽种的[5]。我并不是在你们中间发现了分裂，而是发现了一种滤净[6]。</p><p>2. 凡属上帝、属耶稣基督的人，都与主教在一起。那些悔改、回到教会合一中来的人，也必属上帝，好按着耶稣基督生活。</p><p>3. 我的弟兄们，不要自欺：跟从制造分裂之人的，必不能承受上帝的国[7]；照着异样的见解行事的，与（基督的）受难无份[8]。</p>
      <h2>4</h2><p>所以，你们要努力只领受一个感恩祭（圣体血圣事）。因为我们主耶稣基督的肉身只有一个，使人与祂的血联合的杯也只有一个[9]，祭坛只有一个；同样，主教也只有一位，与司祭团和我的同作仆人的辅祭们在一起。这样，你们无论做什么，都是按着上帝去做。</p>
      <h2>5</h2><p>1. 我的弟兄们，我对你们满怀爱情，几乎倾尽了自己，并且满心欢喜地保护你们——其实不是我，而是耶稣基督。我在祂里面被捆绑，却更加惧怕，因为我还没有得以成全[10]。但你们的祷告必使我在上帝面前得以成全，好使我得着那凭怜悯分给我的产业。我投靠福音，如同投靠耶稣的肉身；投靠使徒们，如同投靠教会的司祭团[11]。</p><p>2. 我们也要爱先知们，因为他们也宣告了福音，仰望祂、等候祂[12]；他们因信祂而得救，在耶稣基督的合一中，是可爱可敬的圣者，蒙耶稣基督作见证，被列入我们共同盼望的福音之中。</p>
      <h2>6</h2><p>1. 若有人向你们解说犹太教，不要听他。从受割礼的人那里听基督教，胜于从未受割礼的人那里听犹太教。但如果两人都不讲论耶稣基督，对我来说，他们就是墓碑和死人的坟墓，上面只写着人的名字。</p><p>2. 所以，要逃避这世代之王的诡计和陷阱，免得你们被他的意念所困，在爱中软弱；你们众人都要以不分裂的心聚集在一起。</p><p>3. 我感谢我的上帝，因为我对你们问心无愧；没有人能暗中或公开地夸口，说我在小事或大事上给过谁重担[13]。我也祈求，我向他们说过话的所有人，都不至使我的话成为不利于他们的见证[14]。</p>
      <h2>7</h2><p>1. 即使有人想按着肉体欺骗我，那灵却不会被欺骗，因为祂出于上帝。祂知道自己从哪里来，往哪里去[15]，并且揭露隐秘的事[16]。我在你们中间的时候曾经呼喊，大声说话，用上帝的声音说：“要留心主教、司祭团和辅祭们。”</p><p>2. 有些人怀疑我说这话，是因为预先知道了某些人的分裂。但我为之被捆绑的那一位是我的见证：我不是从人的肉体得知的。是那灵在宣告说：“撇开主教，什么都不要做；要保守你们的肉身如同上帝的殿[17]；要爱合一；要逃避分裂；要效法耶稣基督，如同祂效法祂的父一样。”</p>
      <h2>8</h2><p>1. 所以，我作为一个为合一而被造就的人，尽了我的本分。哪里有分裂和怒气，上帝就不住在那里。但凡悔改的人，主都赦免他们，只要他们悔改，回到上帝的合一和主教的议会中来。我相信耶稣基督的恩典，祂必解开你们的一切捆绑。</p><p>2. 我劝你们，凡事不可结党[18]，而要照着从基督所学的去做。因为我听见有些人说：“我若不在古老的档案[19]中找到，就不信福音中所说的。”我对他们说：“经上记着。”他们回答我说：“这正需要证明。”[20]但对我来说，古老的档案就是耶稣基督；不可侵犯的档案就是祂的十字架、祂的死、祂的复活，以及借着祂而有的信[21]。我愿借着你们的祷告，在这些事上被称为义。</p>
      <h2>9</h2><p>1. 祭司们是好的，但那受托管理至圣所的大祭司更好[22]；唯有祂受托掌管上帝隐秘的事。祂是通往父的门[23]，亚伯拉罕、以撒、雅各、众先知、众使徒和教会都从这门进去。这一切都归向上帝的合一。</p><p>2. 然而，福音有一样特别的：就是救主——我们的主耶稣基督——的降临、祂的受难和复活。可爱的先知们曾预告祂，而福音则是不朽坏的完成。你们若在爱中相信，这一切都是好的。</p>
      <h2>10</h2><p>1. 有人告诉我，借着你们的祷告和你们在基督耶稣里的慈心，叙利亚的安提阿教会已经得享平安。所以，你们既是上帝的教会，理当选立[24]一位辅祭，作上帝的使节到那里去，与聚集在一处的他们同乐，荣耀上帝的名。</p><p>2. 那配得这样服务的人，在耶稣基督里是有福的；你们也必得荣耀。</p><p>3. 你们若愿意，为上帝的名做这事并不是不可能的；正如那些最近的教会已经派了主教，其他的教会也派了司祭和辅祭一样。</p>
      <h2>11</h2><p>1. 至于从基利家来的辅祭斐罗，他是有好名声的人，现在还和雷乌斯·阿加托普斯——一位蒙拣选的人——一起，在上帝的道上服事我；阿加托普斯舍弃了今生的生活，从叙利亚一路跟随我。他们也为你们作见证；我也为你们感谢上帝，因为你们接待了他们，如同主接待了你们。但愿那些轻慢他们的人，在耶稣基督的恩典中得蒙救赎。</p><p>2. 在特罗亚的弟兄们的爱向你们问安。我正是从特罗亚，托布鲁斯带这封信给你们；布鲁斯是以弗所人和士每拿人为表示敬意，派来与我同行的。主耶稣基督必尊重他们；他们在肉身、魂、灵[25]，在信、爱和同心中仰望祂。愿你们在我们共同的盼望基督耶稣里安好。</p>
    references: |-
      <ol><li><p>伊格那丢离开士每拿后到了特罗亚，从那里写信给他途中经过的吕底亚的非拉铁非（参见<a href="https://bibleox.com/zh-Hans/cn-sb/otkr/3/#L7">默 3:7</a>）教会（<a href="#HH-11">11:2</a>）。他劝勉他们顺服主教、逃避分裂（第1–4章），不要在福音中掺杂犹太教（第5–9章），并请他们派使者到已恢复平安的安提阿去（第10–11章）。</p></li><li><p>意思是：在基督里——祂用自己的血救赎了我们，并用爱的联系使我们合而为一。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/gal/1/#L1">迦 1:1</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/mf/7/#L15">玛 7:15</a>、<a href="https://bibleox.com/zh-Hans/cn-sb/in/10/#L12">若 10:12</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/mf/15/#L13">玛 15:13</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4T_致特拉勒斯人书#HH-11">《致特拉勒斯人书》11:1</a>。</p></li><li><p>ἀποδιϋλισμός，“滤净”。随从错误教训的人离开了，伊格那丢把这看作教会被滤除了异样的杂草。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/1kor/6/#L9-10">格前 6:9-10</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4E_致以弗所人书#HH-16">《致以弗所人书》16:1</a>。</p></li><li><p>因为基督借着自己的受难建立了教会，所以破坏教会合一的人就是违背祂的受难。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/1kor/10/#L16-17">格前 10:16-17</a>。</p></li><li><p>ἀναπάρτιστος，“还没有得以成全”。这是根据长版本以及古拉丁文和亚美尼亚文译本的读法。</p></li><li><p>意思是：投靠福音，好像基督亲自以肉身临在其中；投靠使徒们，好像他们现在仍活着作教会的司祭团。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/lk/24/#L25-27">路 24:25-27</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/2kor/11/#L9">格后 11:9</a>、<a href="https://bibleox.com/zh-Hans/cn-sb/2kor/12/#L13">格后 12:13</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4T_致特拉勒斯人书#HH-12">《致特拉勒斯人书》12:3</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/in/3/#L8">若 3:8</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/1kor/2/#L10">格前 2:10</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/1kor/3/#L16-17">格前 3:16-17</a>、<a href="https://bibleox.com/zh-Hans/cn-sb/1kor/6/#L19">6:19</a>。</p></li><li><p>κατ᾽ ἐριθείαν，“出于结党之心”。参见<a href="https://bibleox.com/zh-Hans/cn-sb/fil/2/#L3">斐 2:3</a>。</p></li><li><p>ἀρχεῖα，“档案、文书”，这里指旧约圣经。受犹太教影响的人要求用古老的预言来证明福音中关于基督降生和受难的真理。</p></li><li><p>πρόκειται，“这正是问题所在、这正需要证明”。</p></li><li><p>借着基督而有的信，即基督的教导。</p></li><li><p>祭司们指旧约的祭司，大祭司指基督（参见<a href="https://bibleox.com/zh-Hans/cn-sb/evr/4/#L14">希 4:14</a>、<a href="https://bibleox.com/zh-Hans/cn-sb/evr/9/#L7">希 9:7</a>）。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/in/10/#L7">若 10:7</a>、<a href="https://bibleox.com/zh-Hans/cn-sb/in/10/#L9">10:9</a>。</p></li><li><p>χειροτονῆσαι，原意为“举手（选举）”，这里指团体选出使者。后来这个词成为表示按立（覆手祝圣）的教会用语。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/1sol/5/#L23">得前 5:23</a>。</p></li></ol>
      <p>翻译：罗季翁·弗拉索夫（借助人工智能工具）。底本：希腊文原文（<a href="https://bibleox.com/zh-Hans/grc/w/ΙγνΘ_Φιλ">本站的希腊文版本</a>，明显的脱漏据莱特福特本和霍姆斯本补足）。参考：俄文译本（《早期教父文选》，布鲁塞尔，1988年）、英文译本（Roberts–Donaldson）、法文译本（Genoude，1837年）。圣经链接指向本站的思高本。</p>
