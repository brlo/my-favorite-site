  path: Qz8A_不是所有人都得救
  title: 不是所有人都得救
  copy_cover: true
  body: <h2>许多人都不会得救</h2><blockquote><p>“你们要努力进窄门。我告诉你们：将来有<strong><mark>许多人</mark></strong>想要进去，<strong>却是不能</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/13/#L24">路 13:24</a>)</p></blockquote><blockquote><p>“你们要进窄门。因为<strong>引到灭亡</strong>，<strong>那门是宽的</strong>，路是大的，<strong>进去的人也</strong><strong><mark>多</mark></strong>； <strong>引到永生</strong>，<strong>那门是窄的</strong>，路是小的，<strong>找着的人也少</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/7/#L13-14">太 7:13-14</a>)</p></blockquote><h2>不是每个信徒都能得救</h2><blockquote><p>“<strong>凡称呼我</strong>『主阿，主阿』的人，<strong><mark>不能都</mark></strong><strong>进天国</strong>；惟独遵行我天父旨意的人，才能进去。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/7/#L21">太 7:21</a>)</p></blockquote><blockquote><p>“当那日，必有<strong>许多</strong>人对我说：『主阿，主阿，我们不是奉你的名<strong>传道</strong>，奉你的名<strong>赶鬼</strong>，奉你的名<strong>行许多异能</strong>吗？』 我就明明地告诉他们说：『<strong><mark>我从来不认识你们，你们这些作恶的人，离开我去吧</mark></strong>！』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/7/#L22-23">太 7:22-23</a>)</p></blockquote><blockquote><p>“农夫在地里撒下许多种子，栽种许多植物，但所撒的并不都能保存到底，所栽的也并不都扎根；照样，那些播在今世的，<strong>并不都能得救</strong>” (<a href="https://bibleox.com/zh-Hans/ru/3ezd/8/#L41">厄四 8:41</a>, 俄文原文无中文经文，此处自译)</p></blockquote>
  meta_desc: "“那些播在今世的，并不都能得救”（厄四 8:41）"
