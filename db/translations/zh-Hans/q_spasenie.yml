  path: Qz7A_救恩
  title: 救恩
  copy_cover: true
  body: <h2>救恩是什么</h2><p><strong>救恩</strong>——与上帝同在的永生（<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/2/#L5-8">罗 2:5-8</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/19/#L17">太 19:17</a>），脱离死亡的救恩（<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/5/#L19-20">雅 5:19-20</a>），更新的、得着荣耀的生命（<a href="https://bibleox.com/zh-Hans/cn-cuv/fil/3/#L21">腓 3:21</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/2pet/1/#L3-4">彼后 1:3-4</a>）。</p><h3>与上帝同在的永生</h3><blockquote><p>“倘若你一只手或是一只脚叫你跌倒，就砍下来丢掉。你缺一只手或是一只脚<strong>进入永生</strong>，强如有两手两脚被丢在永火里。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/18/#L8">太 18:8</a>)</p></blockquote><blockquote><p>“耶稣对他说：「<strong>你为什么以善事问我呢</strong>？只有一位是善的〔有古卷作『你为什么称我是良善的？除了上帝以外，没有一个良善的』〕。<strong>你若要进入永生</strong>，就当遵守诫命。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/19/#L17">太 19:17</a>)</p></blockquote><h3>成神</h3><blockquote><p>“<strong><mark>上帝的神能已将一切关乎生命和虔敬的事赐给我们</mark></strong>，皆因我们认识那用自己荣耀和美德召我们的主。 因此，他已将<strong>又宝贵、又极大的应许</strong>赐给我们，叫我们既脱离世上从情欲来的败坏，<strong><mark>就得与上帝的性情有分</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2pet/1/#L3-4">彼后 1:3-4</a>)</p></blockquote><blockquote><p>“他要按着那能叫万有归服自己的大能，<strong>将我们这卑贱的身体改变形状，和他自己荣耀的身体相似</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/fil/3/#L21">腓 3:21</a>)</p></blockquote><p><a href="https://bibleox.com/zh-Hans/cn-cuv/in/17/#L21-23">约 17:21-23</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/3/#L2">约壹 3:2</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/82/#L6">诗 82:6</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/2/#L20">加 2:20</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/8/#L14,16">罗 8:14,16</a></p><h2>得救的条件</h2><h3>对基督的正确信仰</h3><blockquote><p>“拿撒勒人<strong>耶稣基督的名</strong>。 他是你们『匠人所弃的石头，已成了房角的头块石头。』 除他以外，<strong>别无拯救</strong>；因为在天下人间，<strong>没有赐下别的名，我们可以靠着得救</strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/4/#L10-12">徒 4:10-12</a>)</p></blockquote><blockquote><p>“<strong>人非有信，就不能得上帝的喜悦</strong>；因为到上帝面前来的人，必须信有上帝，且信他赏赐那寻求他的人。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/11/#L6">希 11:6</a>)</p></blockquote><blockquote><p>“凡<strong>越过</strong><strong><mark>基督的教训</mark></strong><strong>不常守着的，就没有上帝</strong>；<strong>常守这教训的</strong>，就有父又有子。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2in/1/#L9">约贰 1:9</a>)</p></blockquote><blockquote><p>“<strong>情欲的事都是显而易见的</strong>，就如奸淫、污秽、邪荡、 拜偶像、邪术、仇恨、争竞、忌恨、恼怒、结党、纷争、<strong><mark>异端</mark></strong>、 嫉妒〔有古卷在此有『凶杀』二字〕、醉酒、荒宴等类。我从前告诉你们，现在又告诉你们，<strong><mark>行这样事的人必不能承受上帝的国</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/5/#L19-21">加 5:19-21</a>)</p></blockquote><h3>信心的行为</h3><h4>遵守诫命</h4><blockquote><p>“你若要进入永生，就<strong><mark>当遵守诫命</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/19/#L17">太 19:17</a>)</p></blockquote><blockquote><p>“所以，凡<strong>听见我这话就去行</strong>的，好比一个聪明人，把房子盖在磐石上。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/7/#L24">太 7:24</a>)</p></blockquote><blockquote><p>“凡到我这里来，<strong>听见我的话就去行的</strong>，我要告诉你们他像什么人： 他像一个人盖房子，深深地挖地，把根基安在磐石上；到发大水的时候，水冲那房子，房子总不能摇动，因为根基立在磐石上〔有古卷作『因为盖造得好』〕。 <strong>惟有听见不去行的</strong>，就像一个人在土地上盖房子，没有根基；水一冲，<strong>随即倒塌了</strong>，并且那房子坏的很大。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L47-49">路 6:47-49</a>)</p></blockquote><blockquote><p>“只是你们要<strong><mark>行道</mark></strong>，不要单单听道，自己欺哄自己。 因为<strong>听道而不行道的，就像人对着镜子看自己本来的面目</strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/1/#L22-23">雅 1:22-23</a>)</p></blockquote><h4>必须生活在<a href="https://bibleox.com/ru/ru/w/Церковь">教会</a>里</h4><blockquote><p>“基督是教会的头，他又是<strong><mark>教会全体的救主</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/5/#L23">弗 5:23</a>)</p></blockquote><blockquote><p>“<strong><mark>基督的身体</mark></strong>，<strong><mark>就是为教会</mark></strong>，要在我肉身上补满基督患难的缺欠。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/1/#L24">西 1:24</a>)</p></blockquote><blockquote><p>“我们不拘是犹太人，是希利尼人，是为奴的，是自主的，<strong>都从一位圣灵受洗，成了一个身体</strong>，饮于一位圣灵。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/12/#L13">林前 12:13</a>)</p></blockquote><blockquote><p>“你们<strong>受洗归入基督的，都是披戴基督了</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/3/#L27">加 3:27</a>)</p></blockquote><blockquote><p>“主将<strong><mark>得救的人天天加给他们</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/2/#L47">徒 2:47</a>) <em>(和合本此处无“归给教会”的字样)</em></p></blockquote><h4>洗礼</h4><p>洗礼也称为“重生”：</p><blockquote><p>“人若不是<strong><mark>从水和圣灵生的</mark></strong>，就<strong>不能进上帝的国</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/3/#L5">约 3:5</a>)</p></blockquote><p>详见：<a href="https://bibleox.com/ru/ru/w/крещение">洗礼</a></p><h4>领受基督的体血</h4><blockquote><p>“<strong>你们若不吃人子的肉，不喝人子的血，就没有生命在你们里面</strong>； 吃我肉、喝我血的人就有永生，<strong>在末日我要叫他复活</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/6/#L53-54">约 6:53-54</a>)</p></blockquote><p>详见：<a href="https://bibleox.com/ru/ru/w/Евхаристия">圣餐礼</a></p><h2>不只信心，行为也是得救所必需的</h2><h3>没有行为的信心不能救人</h3><blockquote><p>“信奉我们荣耀的主耶稣基督，便不可按着外貌待人。 &lt;…&gt; 我的弟兄们，若有人说自己有信心，却<strong><mark>没有行为，有什么益处呢？这信心能救他吗</mark></strong>？ 若是弟兄或是姊妹，赤身露体，又缺了日用的饮食， 你们中间有人对他们说，『平平安安的去吧！愿你们穿得暖吃得饱』，却不给他们身体所需用的，这有什么益处呢？ 这样，<strong><mark>信心若没有行为就是死的</mark></strong>。 必有人说：『你有信心，我有行为；你将你没有行为的信心指给我看，我便借着我的行为，将我的信心指给你看。』 你信上帝只有一位，你信的不错；<strong>鬼魔也信</strong>，却是战惊。 虚浮的人哪，你愿意知道<strong><mark>没有行为的信心是死的</mark></strong>吗？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/2/#L1,14-20">雅 2:1,14-20</a>)</p></blockquote><h3>许多人行不法之事而灭亡，他们不只信了，甚至还奉基督的名行过异能</h3><blockquote><p>“当那日，必有<strong>许多</strong>人对我说：『主阿，主阿，我们不是奉你的名<strong>传道</strong>，奉你的名<strong>赶鬼</strong>，奉你的名<strong>行许多异能</strong>吗？』 我就明明地告诉他们说：『<strong><mark>我从来不认识你们，你们这些作恶的人，离开我去吧</mark></strong>！』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/7/#L22-23">太 7:22-23</a>)</p></blockquote><h3>审判按行为进行</h3><blockquote><p>“人子要在他父的荣耀里，同着众使者降临；那时候，他要<strong><mark>照各人的行为报应各人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/16/#L27">太 16:27</a>)</p></blockquote><blockquote><p>“因为<strong><mark>我们众人</mark></strong><strong>必要在基督台前显露出来</strong>，叫<strong><mark>各人</mark></strong>按着本身<strong><mark>所行的</mark></strong>，或善或恶受报。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/5/#L10">林后 5:10</a>)</p></blockquote><blockquote><p>“甘心事奉，好像服事主，不像服事人。 因为<strong>晓得</strong><strong>各人所行的善事</strong>，不论是为奴的、是自主的，都必<strong>按所行的</strong>，得主的赏赐。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/6/#L7-8">弗 6:7-8</a>)</p></blockquote><blockquote><p>“主啊，慈爱也是属乎你，因为你<strong><mark>照着各人所行的报应他</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/62/#L12">诗 62:12</a>)</p></blockquote><blockquote><p>“他<strong><mark>必照各人的行为报应各人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/2/#L6">罗 2:6</a>)</p></blockquote><blockquote><p>“我是那察看人肺腑心肠的，并要<strong><mark>照你们的行为报应你们各人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/2/#L23">启 2:23</a>)</p></blockquote><blockquote><p>“「看哪，我必快来！赏罚在我，要<strong><mark>照各人所行的报应他</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/22/#L12">启 22:12</a>)</p></blockquote><h3>因行为称义，而不是单因信心</h3><blockquote><p>“我们的祖宗亚伯拉罕把他儿子以撒献在坛上，<strong>岂不是因行为称义吗</strong>？ 可见信心是与他的行为并行，而且信心因着行为才得成全。 这就应验经上所说：『亚伯拉罕信上帝，这就算为他的义。』他又得称为上帝的朋友。 这样看来，<strong><mark>人称义是因着行为，不是单因着信</mark></strong>。 <strong>妓女喇合</strong>接待使者，又放他们从别的路上出去，<strong>不也是一样因行为称义吗</strong>？ 身体没有灵魂是死的，信心没有行为也是死的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/2/#L21-26">雅 2:21-26</a>)</p></blockquote><h3>恒心行善，得着永生</h3><blockquote><p>“你竟任着你刚硬不悔改的心，为自己积蓄忿怒，以致上帝震怒，显他公义审判的日子来到。 <strong>他必照各人的行为报应各人</strong>。 凡<strong><mark>恒心行善</mark></strong>，寻求荣耀、尊贵和<strong><mark>不能朽坏</mark></strong>之福的，就以<strong><mark>永生</mark></strong>报应他们； 惟有结党不顺从真理，反顺从不义的，就以忿怒、恼恨报应他们。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/2/#L5-8">罗 2:5-8</a>)</p></blockquote><h3>在善事上富足，得以持定永生</h3><blockquote><p>“又要嘱咐他们行善，<strong><mark>在好事上富足</mark></strong>，甘心施舍，乐意供给人， 为自己积成美好的根基，预备将来，<strong><mark>叫他们持定那真正的生命</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/6/#L18-19">提前 6:18-19</a>)</p></blockquote><h3>人受造是为了行善</h3><p>没有行为，就是违背上帝对自己的旨意。人若没有善行，就不能成就他被造的目的，不能成就他受造所要作的事：</p><blockquote><p>“我们原是他的工作，<strong>在基督耶稣里造成的</strong>，为要叫我们<strong><mark>行善</mark></strong>，就是上帝所预备叫我们行的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/2/#L10">弗 2:10</a>)</p></blockquote><h3>上帝的国是藉着跟随基督忍受苦难而承受的</h3><blockquote><p>“既是儿女，便是<strong><mark>后嗣</mark></strong>，就是上帝的后嗣，和基督同作后嗣。<strong><mark>如果</mark></strong>我们和他<strong><mark>一同受苦</mark></strong>，也必和他一同得荣耀。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/8/#L17">罗 8:17</a>)</p></blockquote><h3>使徒知道，传福音（行为）终必叫他得救</h3><blockquote><p>“因为我知道，这事借着你们的祈祷和耶稣基督之灵的帮助，<strong>终必叫我得救</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/fil/1/#L19">腓 1:19</a>)</p></blockquote><h3>基督徒的义必须胜过文士和法利赛人的义</h3><blockquote><p>“我告诉你们：<strong><mark>你们的义若不胜于文士和法利赛人的义</mark></strong>，<strong><mark>断不能进天国</mark></strong>。 &lt;…&gt; 只是我告诉你们：凡向弟兄动怒的，难免受审判〔有古卷在『凡』字下添『无缘无故的』五字』〕。凡骂弟兄是拉加的，难免公会的审断；凡骂弟兄是魔利的，难免地狱的火。 &lt;…&gt; 只是我告诉你们：凡看见妇女就动淫念的，这人心里已经与他犯奸淫了。 &lt;…&gt; 只是我告诉你们：什么誓都不可起。不可指着天起誓，因为天是上帝的座位； &lt;…&gt; 只是我告诉你们：不要与恶人作对。有人打你的右脸，连左脸也转过来由他打； &lt;…&gt; 只是我告诉你们：要爱你们的仇敌，为那逼迫你们的祷告。 &lt;…&gt; 所以你们要完全，像你们的天父完全一样。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L20,22,28,34,39,44,48">太 5:20,22,28,34,39,44,48</a>) <em>(俄文原文此处有编者注：“接下来马上是关于行为的教导”)</em></p></blockquote><p>而文士和法利赛人能说不能行：</p><blockquote><p>“<strong><mark>文士和法利赛人</mark></strong>坐在摩西的位上， 凡他们所吩咐你们的，你们都要谨守遵行；但不要效法他们的行为，因为他们<strong><mark>能说不能行</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/23/#L2-3">太 23:2-3</a>)</p></blockquote><p>*信心在有行为时才算为义。人不仅因信称义，也因行为称义（<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/2/#L21-24">雅 2:21-24</a>）。</p><h3>行义的才是义人</h3><blockquote><p>“小子们哪，不要被人诱惑。<strong><mark>行义的才是义人</mark></strong>，正如主是义的一样。 <strong>犯罪的是属魔鬼</strong>，因为魔鬼从起初就犯罪。上帝的儿子显现出来，为要除灭魔鬼的作为。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/3/#L7-8">约壹 3:7-8</a>)</p></blockquote><h3>义人仅仅得救</h3><p>义人——遵行上帝公义的人（<a href="https://bibleox.com/zh-Hans/cn-cuv/iez/33/#L13-16">结 33:13-16</a>）。罪人——违背上帝公义而行的人，即犯罪的人。就连义人也仅仅得救。照此推论，罪人就完全不能得救了：</p><blockquote><p>“『若是<strong><mark>义人仅仅得救</mark></strong>，那不虔敬和犯罪的人，将有何地可站呢？』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/4/#L18">彼前 4:18</a>)</p></blockquote><h3>可以口称认识上帝，行为却背弃他</h3><blockquote><p>“你们为什么称呼我『主啊，主啊』<strong><mark>却不遵我的话行呢</mark></strong>？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L46">路 6:46</a>)</p></blockquote><blockquote><p>“他们<strong>说是认识上帝</strong>，<strong><mark>行事却和他相背</mark></strong>；本是可憎恶的，是悖逆的，在各样善事上是可废弃的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/tit/1/#L16">多 1:16</a>)</p></blockquote><p>上帝所不喜悦的行为中，有异端（<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/5/#L20">加 5:20</a>），也有在信徒中间制造分裂（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/17/#L20-21">约 17:20-21</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/1/#L10">林前 1:10</a>）。</p><h3>使罪人从迷路上转回的行为，能遮盖许多的罪</h3><p>若真实的信徒使邻人离弃错谬，这行为就能遮盖许多的罪。如果救恩单凭信心成就，那么使邻人离弃错谬就只对邻人有益，对使人回转的人却毫无益处，也不会遮盖他的罪（既然你已因信得救，还有什么罪需要遮盖呢？）：</p><blockquote><p>“我的弟兄们，你们中间若有失迷真道的，有人使他回转； 这人该知道叫一个罪人从迷路上<strong><mark>转回</mark></strong>，便是<strong><mark>救一个灵魂不死</mark></strong>，并且<strong><mark>遮盖许多的罪</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/5/#L19-20">雅 5:19-20</a>)</p></blockquote><h3>劝勉信徒务要竭力进入上帝的安息</h3><p>就是说，若不竭力，信徒也可能进不去：</p><blockquote><p>“所以，我们<strong><mark>务必竭力进入那安息</mark></strong>，免得有人学那不信从的样子跌倒了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/4/#L11">希 4:11</a>)</p></blockquote><h3>品德与进入永远的国</h3><p>信徒若有这些品德，就不会没有成效。在这几样上不断长进，必得着进入国的宽阔之路；没有品德的，就是眼瞎：</p><blockquote><p>“正因这缘故，你们要分外的殷勤。<strong><mark>有了信心，又要加上德行</mark></strong>；有了德行，又要加上<strong>知识</strong>； 有了知识，又要加上<strong>节制</strong>；有了节制，又要加上<strong>忍耐</strong>；有了忍耐，又要加上<strong>虔敬</strong>； 有了虔敬，又要加上<strong>爱弟兄的心</strong>；有了爱弟兄的心，又要加上<strong>爱众人的心</strong>。 <strong><mark>你们若充充足足的有这几样，就必使你们在认识我们的主耶稣基督上，不至于闲懒不结果子了</mark></strong>。 <strong>人若没有这几样，就是眼瞎，只看见近处的，忘了他旧日的罪已经得了洁净</strong>。 所以弟兄们，<strong><mark>应当更加殷勤，使你们所蒙的恩召和拣选坚定不移</mark></strong>。你们若行这几样，就永不失脚。 <strong><mark>这样，必叫你们丰丰富富的得以进入我们主救主耶稣基督永远的国</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2pet/1/#L5-11">彼后 1:5-11</a>)</p></blockquote><p>---</p><p>这样，没有行为的信心不能救人，没有信心的行为同样不能救人。</p><h2>受洗后的信徒仍会犯罪，必须与里面的罪争战</h2><blockquote><p>“因为我们<strong>得知真道以后，若故意犯罪</strong>，<strong>赎罪的祭就再没有了</strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/10/#L26">希 10:26</a>)</p></blockquote><blockquote><p>“<strong>我们若说自己无罪，便是自欺</strong>，真理不在我们心里了； 我们若认自己的罪，上帝是信实的，是公义的，必要赦免我们的罪，洗净我们一切的不义；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/1/#L8-9">约壹 1:8-9</a>)</p></blockquote><blockquote><p>“我小子们哪，我将这些话写给你们，<strong><mark>是要叫你们不犯罪</mark></strong>。若有人犯罪，在父那里我们有一位中保，就是那义者耶稣基督。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/2/#L1">约壹 2:1</a>)</p></blockquote><blockquote><p>“<strong><mark>你们中间的争战、斗殴，是从那里来的呢</mark></strong>？不是从你们百体中战斗之私欲来的吗？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/4/#L1">雅 4:1</a>)</p></blockquote><blockquote><p>“你们中间有病了的呢，他就<strong>该请教会的长老来</strong>，他们可以奉主的名用油抹他，为他祷告。 <strong>出于信心的祈祷要救那病人</strong>，主必叫他起来；<strong>他若犯了罪，也必蒙赦免</strong>。 所以你们要彼此认罪，<strong>互相代求，使你们可以得医治</strong>。<strong>义人祈祷所发的力量是大有功效的</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/5/#L14-16">雅 5:14-16</a>)</p></blockquote><blockquote><p>“<strong><mark>你们要醒悟为善，不要犯罪</mark></strong>，因为<strong>有人不认识上帝</strong>。我说这话是要叫你们羞愧。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/15/#L33-34">林前 15:33-34</a>)</p></blockquote><blockquote><p>“并要以恩慈相待，存怜悯的心，<strong><mark>彼此饶恕</mark></strong>，正如上帝在基督里饶恕了你们一样。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/4/#L32">弗 4:32</a>)</p></blockquote><p>最后，主耶稣基督赐给门徒一篇祈祷，教导他们求赦免罪。这不是一生只念一次的祈祷。门徒求基督教导他们祷告，基督就赐给他们这个祷告的范本：</p><blockquote><p>“<strong><mark>你们祷告的时候，要说</mark></strong>：我们在天上的父〔有古卷只作『父阿』〕：愿人都尊你的名为圣。愿你的国降临，愿你的旨意行在地上，如同行在天上〔有古卷没有『愿你的旨意云云』〕。 我们日用的饮食，天天赐给我们。 <strong><mark>赦免我们的罪</mark></strong>，因为我们也赦免凡亏欠我们的人。不叫我们遇见试探；救我们脱离兇恶〔有古卷无末句〕。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/11/#L1-4">路 11:1-4</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/mf/6/#L7-13">太 6:7-13</a>)</p></blockquote><h2>救恩不是一次性的事件，而是终生的过程</h2><p>必须去作成救恩（希腊文 κατεργάζεσθε——行出来、作成、达成、获得、赢取）：</p><blockquote><p>“这样看来，我亲爱的弟兄，你们既是常顺服的，不但我在你们那里，就是我如今不在你们那里，更是顺服的，就当恐惧战兢，<strong>作成你们得救的工夫</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/fil/2/#L12">腓 2:12</a>)</p></blockquote><p>使徒如同在受生产之苦，直到基督在受洗的基督徒里面成形。也就是说，基督并不是自动地、在一瞬间就在他们里面成形的：</p><blockquote><p>“我小子啊，<strong>我为你们再受生产之苦，直等到基督成形在你们心里</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/4/#L19">加 4:19</a>)</p></blockquote><blockquote><p>“那美好的仗我已经打过了；<strong>当跑的路我已经跑尽了</strong>；所信的道我已经守住了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/4/#L7">提后 4:7</a>)</p></blockquote><p>救恩只是应许给人，而不是已经到手（是“必得救”，而不是“已得救”）：</p><blockquote><p>“并且你们要为我的名被众人恨恶，惟有<strong><mark>忍耐到底的</mark></strong>必然得救。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/10/#L22">太 10:22</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/mf/24/#L13">太 24:13</a>)</p></blockquote><blockquote><p>“你将要受的苦你不用怕。魔鬼要把你们中间几个人下在监里，叫你们被试炼，你们必受患难十日。你<strong><mark>务要至死忠心，我就赐给你</mark></strong>那生命的冠冕。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/2/#L10">启 2:10</a>)</p></blockquote><p>使徒虽然自知没有作过违背上帝的事，却不审判自己，也不以此自称为义，而是等候上帝的审判：</p><blockquote><p>“人应当以我们为基督的<strong>执事</strong>，为上帝奥祕事的<strong>管家</strong>。 <strong>所求于管家的，是要他有忠心</strong>。 我被你们论断，或被别人论断，我都以为极小的事．<strong><mark>连我自己也不论断自己</mark></strong>。 我虽不觉得自己有错，却也不能因此得以称义；<strong><mark>但判断我的乃是主</mark></strong>。 所以，<strong>时候未到，什么都不要论断</strong>，只等主来，他要照出暗中的隐情，显明人心的意念。那时，各人要从上帝那里得着称赞。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/4/#L1-5">林前 4:1-5</a>)</p></blockquote><h3>论达到基督徒的完全</h3><p>使徒和所有基督徒一样，为要得着不能坏的冠冕而奔跑、劳苦，担心自己被弃绝：</p><blockquote><p>“凡较力争胜的，诸事都有节制，他们不过是<strong>要得能坏的冠冕</strong>；我们却是<strong>要得不能坏的冠冕</strong>。 所以，<strong>我奔跑</strong>，不像无定向的；我斗拳，不像打空气的。 我是<strong>攻克己身，叫身服我</strong>，恐怕我传福音给别人，<strong><mark>自己反被弃绝了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/9/#L25-27">林前 9:25-27</a>)</p></blockquote><blockquote><p>“<strong>这不是说我已经得着了，已经完全了</strong>，<strong>我乃是竭力追求</strong>，或者可以得着基督耶稣所以得着我的。 弟兄们，<strong>我不是以为自己已经得着了</strong>，我只有一件事，就是忘记背后，努力面前的， <strong>向着标竿直跑</strong>，要得上帝在基督耶稣里从上面召我来得的奖赏。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/fil/3/#L12-14">腓 3:12-14</a>)</p></blockquote><h3>将要得救的人和灭亡的人</h3><p>正如将要得救的人还未得救，将要灭亡的人也还未灭亡。两者都在路上，都可能改变方向：将得救的还可能走向灭亡，将灭亡的还可能走向救恩：</p><blockquote><p>“因为我们在上帝面前，无论在<strong><mark>得救的人</mark></strong>身上，或<strong><mark>灭亡的人</mark></strong>身上，都有基督馨香之气。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/2/#L15">林后 2:15</a>)</p></blockquote><p>许多人想要进入天国，却进不去：</p><blockquote><p>“你们要努力进窄门。我告诉你们：将来有<strong><mark>许多人想要进去，却是不能</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/13/#L24">路 13:24</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/mf/7/#L14">太 7:14</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/mf/7/#L13">太 7:13</a>)</p></blockquote><p>不仅许多信徒，甚至连奉基督的名行异能的人，也进不了天国：</p><blockquote><p>“当那日，必有<strong>许多</strong>人对我说：『主阿，主阿，我们不是奉你的名<strong>传道</strong>，奉你的名<strong>赶鬼</strong>，奉你的名<strong>行许多异能</strong>吗？』 我就明明地告诉他们说：『<strong><mark>我从来不认识你们，你们这些作恶的人，离开我去吧</mark></strong>！』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/7/#L22-23">太 7:22-23</a>)</p></blockquote><h2>基督——普世的审判者</h2><h3>人人都要受审判</h3><blockquote><p>“因为<strong><mark>我们众人</mark></strong><strong>必要在基督台前显露出来</strong>，叫各人按着本身<strong>所行的</strong>，<strong>或善或恶</strong>受报。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/5/#L10">林后 5:10</a>)</p></blockquote><blockquote><p>“你这个人，为什么论断弟兄呢？又为什么轻看弟兄呢？因<strong><mark>我们都要站在上帝的台前</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/14/#L10">罗 14:10</a>)</p></blockquote><blockquote><p>“你们既然要<strong><mark>按使人自由的律法受审判</mark></strong>，就该照这律法说话行事。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/2/#L12">雅 2:12</a>)</p></blockquote><blockquote><p>“因为<strong><mark>人所作的事</mark></strong>，连一切隐藏的事，<strong>无论是善是恶</strong>，<strong>上帝都必审问</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ekl/12/#L14">传 12:14</a>)</p></blockquote><blockquote><p>“当<strong>人子</strong>在他荣耀里，同着众天使降临的时候，要<strong>坐在他荣耀的宝座上</strong>。 <strong><mark>万民</mark></strong>都要聚集在他面前。<strong><mark>他要把他们分别出来</mark></strong>，好像牧羊的分别<strong><mark>绵羊山羊</mark></strong>一般；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/25/#L31-32">太 25:31-32</a>)</p></blockquote><h3>审判要从教会起首</h3><blockquote><p>“因为时候到了，<strong><mark>审判要从上帝的家起首</mark></strong>。若是<strong><mark>先从我们起首</mark></strong>，那不信从上帝福音的人将有何等的结局呢？ 『若是<strong>义人仅仅得救</strong>，那不虔敬和犯罪的人，将有何地可站呢？』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/4/#L17-18">彼前 4:17-18</a>)</p></blockquote><blockquote><p>“我被你们论断，或被别人论断，我都以为极小的事．<strong><mark>连我自己也不论断自己</mark></strong>。 我虽不觉得自己有错，却也不能因此得以称义；<strong><mark>但判断我的乃是主</mark></strong>。 所以，<strong>时候未到，什么都不要论断</strong>，只等主来，他要照出暗中的隐情，显明人心的意念。那时，各人要从上帝那里得着称赞。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/4/#L3-5">林前 4:3-5</a>)</p></blockquote><h3>人人都多多地犯罪</h3><blockquote><p>“原来<strong>我们在许多事上都有过失</strong>；若有人在话语上没有过失，他就是完全人，也能勒住自己的全身。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/3/#L2">雅 3:2</a>)</p></blockquote><blockquote><p>“<strong>我们若说自己无罪，便是自欺</strong>，真理不在我们心里了； &lt;…&gt; 我们若说自己没有犯过罪，便是以上帝为说谎的，他的道也不在我们心里了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/1/#L8,10">约壹 1:8,10</a>)</p></blockquote><h3>许多人必要惊讶，因为没有得着救恩</h3><p>他们以为已经得救了：</p><blockquote><p>“当那日，必有<strong>许多</strong>人对我说：『主阿，主阿，我们不是奉你的名<strong>传道</strong>，奉你的名<strong>赶鬼</strong>，奉你的名<strong>行许多异能</strong>吗？』 我就明明地告诉他们说：『<strong><mark>我从来不认识你们，你们这些作恶的人，离开我去吧</mark></strong>！』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/7/#L22-23">太 7:22-23</a>)</p></blockquote><h2>对异议的回应</h2><h3>“信徒不受审判”</h3><blockquote><p>“我实实在在的告诉你们，那听我话又信差我来者的，就有永生，<strong>不至于定罪</strong>，是已经出死入生了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/5/#L24">约 5:24</a>)</p></blockquote><p>简要地说：这里所说的是，真实的信徒和遵行救主话语的人（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L47-49">路 6:47-49</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/2/#L17">约壹 2:17</a>）不会被判罪受刑罚；但谁是这些信徒和遵行的人，要由基督自己在审判时决定（<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/4/#L3-5">林前 4:3-5</a>），因为如上所示，普世的审判正是从教会开始（<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/4/#L17-18">彼前 4:17-18</a>），而人人都要受审判。</p><p>我们更详细地看这一点。</p><p>这节经文应当按照圣经全部的教导来理解。圣经里既说到得救必须遵行诫命（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L47-49">路 6:47-49</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/2/#L17">约壹 2:17</a>），也说到必须受洗（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/3/#L5">约 3:5</a>）、领受圣餐（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/6/#L53-54">约 6:53-54</a>），以及许多别的。不能只看一些经文，而对其他经文视而不见。</p><p>既然不能排除得救所需的其他条件，那么这里所说的是指那些藉洗礼进入教会、藉参与圣餐活在教会（基督的身体）里、遵行诫命、认识上帝的旨意并照着生活的信徒。如果这样行，就不会来到审判台前被判罪。但谁是这样行的人？唯有审判者基督知道。所以，首先所有人都要来到审判台前，这在其他经文里有直接的说明。</p><p>人人都要受审判：</p><blockquote><p>“因为<strong>我们众人必要在基督台前显露出来</strong>，叫各人按着本身<strong>所行的</strong>，<strong>或善或恶</strong>受报。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/5/#L10">林后 5:10</a>)</p></blockquote><p>这里所说的正是<strong>信徒</strong>：</p><blockquote><p>“你这个人，为什么<strong>论断弟兄</strong>呢？又为什么<strong>轻看弟兄</strong>呢？因<strong>我们都要站在上帝的台前</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/14/#L10">罗 14:10</a>)</p></blockquote><blockquote><p>“因为<strong>人所作的事</strong>，连一切隐藏的事，<strong>无论是善是恶</strong>，<strong>上帝都必审问</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ekl/12/#L14">传 12:14</a>)</p></blockquote><p>但仅仅说人人都要受审判还不够。而且，审判正是从教会开始，也就是从信徒开始：</p><blockquote><p>“因为时候到了，<strong><mark>审判要从上帝的家起首</mark></strong>。若是<strong><mark>先从我们起首</mark></strong>，那不信从上帝福音的人将有何等的结局呢？ 『若是义人仅仅得救，那不虔敬和犯罪的人，将有何地可站呢？』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/4/#L17-18">彼前 4:17-18</a>)</p></blockquote><p>总之，信徒并且遵行的人（至于是谁——由基督作为审判者决定）不会来到审判台前被判罪。</p><p>这些<strong>许多信徒</strong>显然以为自己已经得救、不必受审判，然而他们虽然信了，却要被定罪为作恶的人：</p><blockquote><p>“当那日，必有<strong>许多</strong>人对我说：『主阿，主阿，我们不是<strong>奉你的名传道</strong>，<strong>奉你的名赶鬼</strong>，<strong>奉你的名行许多异能</strong>吗？』 我就明明地告诉他们说：『<strong>我从来不认识你们，你们这些作恶的人，离开我去吧</strong>！』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/7/#L22-23">太 7:22-23</a>)</p></blockquote><p>总之，基督要审判所有人，在审判中把人彼此分开：</p><blockquote><p>“当人子在他荣耀里，同着众天使降临的时候，要坐在他荣耀的宝座上。 <strong><mark>万民</mark></strong>都要聚集在他面前。<strong><mark>他要把他们分别出来</mark></strong>，好像牧羊的分别<strong><mark>绵羊山羊</mark></strong>一般；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/25/#L31-32">太 25:31-32</a>)</p></blockquote><h3>“人称义不是因行律法”</h3><blockquote><p>“既知道<strong>人称义不是因行</strong><strong><mark>律法</mark></strong>，<strong>乃是因信耶稣基督</strong>，连我们也信了基督耶稣，使我们因信基督称义，<strong>不因行</strong><strong><mark>律法</mark></strong><strong>称义，因为凡有血气的，没有一人因行</strong><strong><mark>律法</mark></strong><strong>称义</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/2/#L16">加 2:16</a>)</p></blockquote><p>这里所说的是摩西律法的行为，人不能靠它称义。在加拉太书中这是全书的主题，起因是关于外邦人是否需要受割礼的争论。受割礼并不需要，因为我们得救不是靠摩西律法的行为，而是靠对基督的信心和这信心的行为（参见上文“不只信心，行为也是得救所必需的”一节）。</p><h3>“你们得救是本乎恩，也因着信”</h3><blockquote><p>“当我们死在过犯中的时候，便叫我们与基督一同活过来（<strong>你们得救是本乎恩</strong>）。 &lt;…&gt; <strong>你们得救是本乎恩，也因着信</strong>。这并不是出于自己，<strong>乃是上帝所赐的</strong>； <strong>也不是出于行为</strong>，免得有人自夸。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/2/#L5,8-9">弗 2:5,8-9</a>)</p></blockquote><p>这里所说的不是每个人个人的得救，而是得救的可能性临到世界（即这可能性得以开启）。</p><h4>1. 得救可能性的开启——是恩赐</h4><p>在基督以前，人没有得救的可能。基督以后，得救成为可能，得救的途径也被建立。人作了什么，使得救成为可能？什么也没有作，人类的罪反而越来越多。救恩之路的建立，是上帝赐给人的<strong>恩赐</strong>。这恩赐不是罪恶的人类挣来的：</p><blockquote><p>“<strong>因我们还软弱的时候，基督就按所定的日期为罪人死</strong>。 为义人死，是少有的，为仁人死，或者有敢作的； <strong><mark>惟有基督在我们还作罪人的时候为我们死，上帝的爱就在此向我们显明了</mark></strong>。 现在我们既靠着他的血称义，就更要借着他免去上帝的忿怒。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/5/#L6-9">罗 5:6-9</a>)</p></blockquote><h4>2. 救恩的途径——是恩赐</h4><p>同样，要走上得救之路并获得救恩的途径，对具体的人来说，需要的正是信心。他被引入教会，在洗礼中重生，在圣膏中领受圣灵的恩赐，在圣餐礼中与基督联合——这一切都是<strong>因信心而白白领受的恩赐</strong>。不要求人先挣得这个恩赐。</p><h4>3. 走过得救之路——一生之中，靠上帝的帮助（<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/15/#L10">林前 15:10</a>）以人的行为（<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/2/#L5-8">罗 2:5-8</a>）来成就（<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/2/#L10">启 2:10</a>）</h4><p>接下来说到在基督里受生的目的——就是善行：</p><blockquote><p>“我们原是他的工作，在基督耶稣里造成的，为要叫我们<strong><mark>行善</mark></strong>，就是上帝所预备叫我们行的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/2/#L10">弗 2:10</a>)</p></blockquote><p>若没有这些善行，如圣经其他地方所说，人就不能得救，因为没有行为的信心是死的（<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/2/#L20">雅 2:20</a>），人称义是因着行为，不是单因着信（<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/2/#L24">雅 2:24</a>），人人都要受审判（<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/5/#L10">林后 5:10</a>），而审判必按行为进行（<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/5/#L10">林后 5:10</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/6/#L7-8">弗 6:7-8</a>）。</p><p>因此，曾向人类开启的救恩，不仅要以信心、也要以行为去领受；而如上所示，这是一个过程，而且是艰难的过程，它的终点许多人达不到：</p><blockquote><p>“你们要努力进窄门。我告诉你们：将来有<strong><mark>许多人想要进去，却是不能</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/13/#L24">路 13:24</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/mf/7/#L14">太 7:14</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/mf/7/#L13">太 7:13</a>)</p></blockquote><h3>悔改的强盗只来得及相信，没有作过任何行为吗？</h3><p>悔改的强盗得救，是作为旧约以色列的一部分，与上帝立有旧约，凭着对救主的信心，并且来得及作了一些事。</p><p>为什么说在旧约里？因为经上记着，基督要用圣灵施洗（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/3/#L16">路 3:16</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/3/#L11">太 3:11</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/1/#L8">可 1:8</a>），而基督应许在升天之后才差遣圣灵来（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/16/#L7">约 16:7</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/in/14/#L16">约 14:16</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/in/14/#L26">约 14:26</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/in/7/#L38-39">约 7:38-39</a>），也就是在五旬节。经上没有写强盗被传讲悔改和受洗，也没有写圣灵降在强盗身上（不同于后来其他古代基督徒的情形）。这样，悔改的强盗还在旧约之内、教会建立之前得救，没有经过洗礼和圣餐礼这两个圣奥秘。</p><p>然而，强盗也作了一件事——谦卑地领受了所加给他的刑罚，承认这是自己应得的，结出了与悔改的心相称的果子（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/3/#L8">太 3:8</a>）。</p><blockquote><p>“<strong>我们是应该的，因我们所受的与我们所作的相称</strong>，但这个人没有作过一件不好的事。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/23/#L41">路 23:41</a>)</p></blockquote><p>谦卑地忍受苦难，不发怨言责怪上帝，不在别人身上寻找罪魁，也不定别人的罪——这是基督徒的行为（<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/3/#L11">箴 3:11</a>）。我们的始祖堕落之后，不是责备自己，而是责备别人，甚至多少责怪上帝：</p><blockquote><p>“<strong>你所赐给我、与我同居的女人，她把那树上的果子给我，我就吃了</strong>。」 耶和华上帝对女人说：「你做的是什么事呢？」女人说：「<strong>那蛇引诱我，我就吃了</strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/3/#L12-13">创 3:12-13</a>)</p></blockquote><p>而强盗责备的是自己，并且甘心领受刑罚。这是行为，而且极配得上基督徒的心志。</p><p>他虽是强盗，并没有被高举为伟人之一，也没有得着救主右边或左边所预备的座位（<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/10/#L40">可 10:40</a>）；但他是因信心得救的，并且还有他来得及作成的那件小行为。所以，强盗到底还是有行为，而不只有信心。</p><p>还要注意的是，并不是强盗自己宣称得救，而是基督对他作出审判。强盗的话里看不出任何对得救的确信；相反，他明白自己不会与上帝同享永生，所以只怀着对怜悯的谨慎盼望，求基督在他进入自己国的时候记念他（照强盗自己的想法，那时他不会在那个国里）。</p><h3>“凡求告主名的，就必得救”</h3><blockquote><p>“因为『<strong>凡求告主名的，就必得救</strong>。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/10/#L13">罗 10:13</a>)</p></blockquote><blockquote><p>“到那时候，<strong>凡求告主名的，就必得救</strong>。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/2/#L21">徒 2:21</a>)</p></blockquote><p>有人可能产生疑问：难道只要求告主，无论怎样求告、无论行什么，就都必得救？其实，这里的“凡”是说，能得救的不仅是犹太人，而是任何民族的人。</p><p>这些话使徒只是引用。最初是旧约中对犹太人所说的预言。使徒在此提醒这些话，并指出它们应验的时候已经到了。旧约中说这话的是先知约珥：</p><blockquote><p>“到那时候，<strong>凡求告耶和华名的就必得救</strong>；因为照耶和华所说的，在锡安山，耶路撒冷必有逃脱的人，在剩下的人中，必有耶和华所召的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iol/2/#L32">珥 2:32</a>)</p></blockquote><p>先知的话是对以色列民说的，以色列民坚信上帝只拯救以色列人。于是给以色列民一个预言：时候将到，得救的不再只是以色列人，而是任何求告上帝的民族。</p><p>总之，这话出自旧约——上帝只与以色列民立旧约；新约则是与教会立的，教会召聚了万民，因为在教会里民族已不再有意义（<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/3/#L11">西 3:11</a>）。这里说的正是这一点，从上下文可以直接看出：民族对得救没有意义：</p><blockquote><p>“经上说：『<strong>凡信他的人，必不至于羞愧</strong>。』 <strong><mark>犹太人和希利尼人并没有分别</mark></strong>；因为众人同有一位主，他也厚待一切求告他的人。 因为『<strong><mark>凡求告主名的，就必得救</mark></strong>。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/10/#L11-13">罗 10:11-13</a>)</p></blockquote><p>圣经其余的部分，并不因此失去必要性。</p><p>怎样得救？遵守诫命——主说：</p><blockquote><p>“你若要进入永生，就<strong>当遵守诫命</strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/19/#L17">太 19:17</a>)</p></blockquote><p>求告上帝的话把这废除了吗？当然没有。</p><p>经上说，不从水和圣灵生的，就不能见上帝的国，也不能进上帝的国。这同样没有废除：</p><blockquote><p>“耶稣回答说：「我实实在在的告诉你，人若不重生，就<strong>不能见上帝的国</strong>。」 &lt;…&gt; 耶稣说：「我实实在在的告诉你，人若不是从水和圣灵生的，就<strong>不能进上帝的国</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/3/#L3,5">约 3:3,5</a>)</p></blockquote><p>关于圣餐礼的话也没有废除。没有它，人就不能在自己里面有生命，也不能在末日复活（为与上帝同活）：</p><blockquote><p>“<strong>你们若不吃人子的肉，不喝人子的血，就没有生命在你们里面</strong>； 吃我肉、喝我血的人就有永生，<strong>在末日我要叫他复活</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/6/#L53-54">约 6:53-54</a>)</p></blockquote><p>尼哥拉一党人和许多异端也求告上帝，然而他们作为异端和分裂教会者，被判失去上帝的国：</p><blockquote><p>“<strong>情欲的事都是显而易见的</strong>，就如奸淫、污秽、邪荡、 拜偶像、邪术、仇恨、争竞、忌恨、恼怒、<strong><mark>结党、纷争</mark></strong>、<strong><mark>异端</mark></strong>、 嫉妒〔有古卷在此有『凶杀』二字〕、醉酒、荒宴等类。我从前告诉你们，现在又告诉你们，<strong><mark>行这样事的人必不能承受上帝的国</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/5/#L19-21">加 5:19-21</a>) <em>(*“结党、纷争”（διχοστασίαι）——分裂、分派。)</em></p></blockquote><p>总之，“凡”是指任何民族的人，而不只是犹太人。关于教会，使徒这样说：</p><blockquote><p>“但现在你们要弃绝这一切的事，以及恼恨、忿怒、恶毒、毁谤，并口中污秽的言语。 &lt;…&gt; 穿上了新人。这新人在知识上渐渐更新，正如造他主的形像。 在此并不分<strong><mark>希利尼人、犹太人</mark></strong>、受割礼的、未受割礼的、<strong><mark>化外人、西古提人</mark></strong>、为奴的、自主的，惟有基督是包括一切，又住在各人之内。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/3/#L8,10-11">西 3:8,10-11</a>)</p></blockquote><h3>“代赎的祭”</h3><p>有些主张救恩只凭信心（不凭行为）的人，讲到一种称为“代赎的祭”的救赎理论，其含义如下：正如以撒被献为祭时有羊羔代替，使以撒得以存活；同样，基督代替罪人被献为祭，使罪人得以存活。这样，既然上帝父把他的怒气倾倒在儿子身上，他就不再向信主的罪人发怒。于是信主的罪人与上帝同活就不再有拦阻。</p><p>代赎之祭的理论看来并不符合真理。它出自一个错误的前提：问题在于上帝（他向罪人发怒）。为了“纠正”上帝（这念头本身就何等僭妄），儿子必须死。而人自己完全不必悔改，因为上帝将向儿子发怒，于是（仿佛在上帝那边的）问题就解决了。这样的理论不能被当作真理，因为它违背常识。显然，问题不在于上帝。与上帝同在的永生之中，任何不洁净的都不能进入：</p><blockquote><p>“那城内又不用日月光照，因有上帝的荣耀光照，又有羔羊为城的灯。 &lt;…&gt; <strong>凡不洁净的，并那行可憎与虚谎之事的，总不得进那城</strong>；只有名字写在羔羊生命册上的才得进去。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/21/#L23,27">启 21:23,27</a>)</p></blockquote>
