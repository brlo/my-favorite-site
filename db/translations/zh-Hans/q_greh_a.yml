  path: QS1A_致死的罪
  title: 致死的罪
  copy_cover: true
  body: <p>圣经中所列的一些致死的罪：</p><blockquote><p>“装满了各样不义、邪恶、贪婪、恶毒，满心是嫉妒、凶杀、争竞、诡诈、毒恨， 又是谗毁的、背后说人的、怨恨上帝的、侮慢人的、狂傲的、自夸的、捏造恶事的、违背父母的、 无知的、背约的、无亲情的、不怜悯人的。 他们虽知道上帝判定<strong><mark>行这样事的人是当死的</mark></strong>，然而他们不但自己去行，还喜欢别人去行。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/1/#L29-32">罗 1:29-32</a>)</p></blockquote><blockquote><p>“情欲的事都是显而易见的，就如奸淫、污秽、邪荡、 拜偶像、邪术、仇恨、争竞、忌恨、恼怒、结党、纷争、异端、 嫉妒〔有古卷在此有『凶杀』二字〕、醉酒、荒宴等类。我从前告诉你们，现在又告诉你们，<strong><mark>行这样事的人必不能承受上帝的国</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/5/#L19-21">加 5:19-21</a>)</p></blockquote><blockquote><p>“你们岂不知<strong><mark>不义的人不能承受上帝的国</mark></strong>吗？不要自欺！无论是淫乱的、拜偶像的、奸淫的、作娈童的、亲男色的、” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/6/#L9">林前 6:9</a>)</p></blockquote><blockquote><p>“因为你们确实的知道，无论是淫乱的，是污秽的，是有贪心的，<strong><mark>在基督和上帝的国里都是无分的</mark></strong>。有贪心的，就与拜偶像的一样。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/5/#L5">弗 5:5</a>)</p></blockquote><blockquote><p>“惟有胆怯的、不信的、可憎的、杀人的、淫乱的、行邪术的、拜偶像的和一切说谎话的，<strong><mark>他们的分就在烧着硫磺的火湖里，这是第二次的死</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/21/#L8">启 21:8</a>)</p></blockquote><blockquote><p>“那些洗净自己衣服的有福了！可得权柄能到生命树那里，也能从门进城。 <strong><mark>城外有那些犬类、行邪术的、淫乱的、杀人的、拜偶像的，并一切喜好说谎言编造虚谎的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/22/#L14-15">启 22:14-15</a>)</p></blockquote><blockquote><p>“作假见证的，必不免受罚；<strong><mark>吐出谎言的，终不能逃脱</mark></strong>。 &lt;…&gt; 作假见证的，不免受罚；<strong><mark>吐出谎言的，也必灭亡</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/19/#L5,9">箴 19:5,9</a>)</p></blockquote><p>只要人还活着、还能进入基督的教会而悔改，一切罪都可以得到赦免。人将要受审判的，是他在身体中活着时所做的事：</p><blockquote><p>“因为我们众人必要在基督台前显露出来，叫各人<strong><mark>按着本身所行的</mark></strong>，或善或恶受报。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/5/#L10">林后 5:10</a>)</p></blockquote>
