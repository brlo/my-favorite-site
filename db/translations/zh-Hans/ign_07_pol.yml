    title: 致坡旅甲书
    meta_desc: 安提阿的圣伊格那丢（提阿弗罗斯）写给士每拿主教坡旅甲的书信。译自希腊文原文，附注释。
    menu: { parent: "书信", title: "致坡旅甲书", priority: 3 }
    body: |-
      <h2>0</h2><p>伊格那丢，又名提阿弗罗斯[1]，致士每拿人教会的主教坡旅甲——更确切地说，是被父上帝和主耶稣基督所看顾的主教：满心问候你。</p>
      <h2>1</h2><p>1. 我接纳了你在上帝里的心志，它好像建立在不可动摇的磐石上[2]；我大大荣耀上帝，因为我配得见到你无瑕的面容[3]。愿我在上帝里因你得喜乐。</p><p>2. 我凭着你所披戴的恩典劝你：要在你的奔跑上更加努力，并劝勉众人，使他们得救。要以肉身和灵性上的一切关怀，尽你的职分[4]。要关心合一，没有什么比合一更好。要担当众人，如同主担当你[5]；要在爱中容忍众人，正如你现在所做的。</p><p>3. 要专心不住地祷告[6]；要祈求比你现有的更多的悟性；要儆醒，拥有不眠的灵。要以上帝的心性同每一个人说话；要像完全的运动员那样，担当众人的疾病[7]。哪里劳苦多，哪里收获就大。</p>
      <h2>2</h2><p>1. 你若只爱好门徒，就算不得什么恩德[8]；倒要以温柔使那些较难对付的人顺服。不是每一种伤口都能用同一种膏药医治。发作的热病要用湿敷来平息。</p><p>2. 在一切事上要灵巧像蛇，总要驯良像鸽子[9]。你之所以既属肉身又属灵，是为了温和地对待那显现在你面前的事；至于看不见的事，要祈求它们向你显明[10]，好使你一无所缺，在各样恩赐上丰富有余。</p><p>3. 时势需要你，好像舵手需要风，遭遇风暴的人需要港口，为要得着上帝。要像上帝的运动员一样节制[11]；奖品是不朽坏和永生，这是你也深信的。我和你所爱的这些锁链，在一切事上都是你的替代生命。</p>
      <h2>3</h2><p>1. 那些看似可信、却传异样教训的人，不要让他们惊吓你。要站稳，像被锤打的铁砧。被击打而得胜，这是伟大运动员的本色。我们尤其应当为上帝的缘故忍受一切，好使祂也容忍我们。</p><p>2. 要比现在更加殷勤。要明辨时势。要等候那超越时间的、没有时间的、看不见的却为我们成为看得见的、不可触摸的、不能受苦的却为我们成为能受苦的、以各种方式为我们忍耐的那一位。</p>
      <h2>4</h2><p>1. 不可忽视寡妇[12]；在主之后，你要作她们的照顾者。没有你的同意，什么事都不可做；你也不可撇开上帝做任何事——其实你也没有这样做。要坚定。</p><p>2. 聚会要更加频繁；要按名字寻找每一个人。</p><p>3. 不可轻视奴仆和婢女；但他们自己也不可自高自大，倒要为上帝的荣耀更加尽心服事，好从上帝那里得到更好的自由[13]。他们不要渴望用公款得释放，免得被看为私欲的奴隶。</p>
      <h2>5</h2><p>1. 要逃避邪恶的伎俩[14]，倒要讲道论说这些事。要告诉我的姐妹们，要爱主，在肉身和灵性上满足于自己的丈夫。同样也要奉耶稣基督的名嘱咐我的弟兄们，要爱妻子，如同主爱教会[15]。</p><p>2. 若有人能为了尊荣主的肉身[16]而持守贞洁，就让他毫不夸口地持守。他若夸口，就灭亡了；他若想比主教更为人所知，就败坏了。男女结婚，理当得到主教的同意而结合[17]，好使婚姻是按着主，而不是按着情欲。一切都要为上帝的尊荣而行。</p>
      <h2>6</h2><p>1. 你们要留心主教[18]，好使上帝也留心你们。我为那些顺服主教、司祭和辅祭的人献上我的性命；愿我能与他们一同在上帝里有份。你们要彼此同劳，同争战，同奔跑，同受苦，同安息，同起来，如同上帝的管家[19]、侍从和仆人。</p><p>2. 要讨你们所服役的那一位喜悦，你们的粮饷也是从祂领取的[20]。你们中间不可有人成为逃兵[21]。要以你们的洗礼为兵器，以信为头盔，以爱为长矛，以忍耐为全副军装[22]。要以你们的行为作存款，好领取你们应得的报偿[23]。所以，你们要在温柔中彼此宽容，如同上帝宽容你们。愿我常因你们得喜乐。</p>
      <h2>7</h2><p>1. 有人告诉我，借着你们的祷告，叙利亚的安提阿教会已经得享平安；我也就在上帝里无所挂虑，更加欢喜了——只要我借着受苦得着上帝，好借着你们的祈求[24]被看为门徒。</p><p>2. 最蒙上帝祝福的坡旅甲啊，你理当召开一次最配得上帝的会议，选立[25]一位你们非常喜爱、又不辞劳苦的人，他可以被称为“上帝的奔走者”。要使他配得前往叙利亚，为上帝的荣耀颂扬你们不辞劳苦的爱。</p><p>3. 基督徒无权支配自己，而是把时间献给上帝。这是上帝的工作，当你们完成它的时候，也是你们的工作。因为我凭着恩典相信，你们已经预备好去行合乎上帝的善事。我知道你们对真理的热忱，所以用简短的信劝勉你们。</p>
      <h2>8</h2><p>1. 因为我照着（上帝）旨意的吩咐，要突然从特罗亚启航前往尼亚坡里[26]，所以不能写信给所有的教会。你既有上帝的心意，就请你写信给前面的那些教会，使他们也同样去做：能派人步行去的就派人去，其他的就托你所派的人带信去。这样，你们必因永恒的工作得荣耀，因为你是配得的。</p><p>2. 我按名字问候所有的人，也问候厄庇特洛普斯的妻子[27]，连同她全家和儿女。我问候我亲爱的阿塔路斯。我问候那将要配得前往叙利亚的人。愿恩典常与他同在，也与派他去的坡旅甲同在。</p><p>3. 我祈求你们在我们的上帝耶稣基督里常常安好；愿你们在祂里面，在上帝的合一和主教的看顾[28]中持守不移。我问候阿尔刻——我所爱慕的名字。愿你们在主里安好。</p>
    references: |-
      <ol><li><p>伊格那丢在从特罗亚启航前往尼亚坡里之前，写了这封信给士每拿的主教坡旅甲。这是一封关于主教职责的牧灵劝勉书信。第1–5章是对坡旅甲个人说的（用第二人称单数），从第6章起则是对全教会说的。坡旅甲后来在士每拿殉道（约155年）。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/mf/7/#L24-25">玛 7:24-25</a>。</p></li><li><p>指伊格那丢前往罗马途中在士每拿逗留时，与坡旅甲见面。</p></li><li><p>τόπος，“地方、地位”，这里指主教的职分。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/gal/6/#L2">迦 6:2</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/1sol/5/#L17">得前 5:17</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/mf/8/#L17">玛 8:17</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/lk/6/#L32">路 6:32</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/mf/10/#L16">玛 10:16</a>。</p></li><li><p>一般理解为：使你能看透人心中隐秘的倾向和心思。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/1kor/9/#L25">格前 9:25</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/1tim/5/#L3">弟前 5:3</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/1kor/7/#L21-22">格前 7:21-22</a>。</p></li><li><p>κακοτεχνίαι。有人理解为错误教训和异端的诡计，也有人理解为修辞上的巧技。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/ef/5/#L25">弗 5:25</a>。</p></li><li><p>意思是：为了尊荣主的肉身（即基督的身体教会，以及主使之成为祂肢体的我们的身体）。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/1kor/7/#L39">格前 7:39</a>（“只是要在主内的”）。</p></li><li><p>从这里开始，书信是对全教会（第二人称复数）说的。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/1kor/4/#L1-2">格前 4:1-2</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/2tim/2/#L3-4">弟后 2:3-4</a>。以下用罗马军队的生活作比喻。</p></li><li><p>δεσέρτωρ，借自拉丁文 desertor（逃兵），指丢下武器逃跑的士兵。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/ef/6/#L11-17">弗 6:11-17</a>。</p></li><li><p>δεπόσιτα 与 ἄκκεπτα，借自拉丁文 deposita（存款）和 accepta（支取）。罗马士兵把部分报酬和战利品存放在军旗之下，退伍时一次领取。</p></li><li><p>抄本和本站的希腊文本作 ἐν τῇ ἀναστάσει ὑμῶν“在你们的复活中”；但莱特福特等校勘者改读为 ἐν τῇ αἰτήσει ὑμῶν“借着你们的祈求（祷告）”，本译文随从这一读法。若按抄本，意思是“在（末日）你们复活的时候被看为门徒”。</p></li><li><p>χειροτονῆσαι。参见<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4F_致非拉铁非人书#HH-10">《致非拉铁非人书》10:1</a>的注释。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/act/16/#L11">宗 16:11</a>。保罗也曾从特罗亚渡海到尼亚坡里。</p></li><li><p>τὴν τοῦ Ἐπιτρόπου，“厄庇特洛普斯的妻子”。也有人不把厄庇特洛普斯看作人名，而理解为“（罗马）总管的妻子”。</p></li><li><p>ἐπισκοπή，“看顾、监督”。有些抄本作 ἐπισκόπῳ“（在）主教（之下）”。</p></li></ol>
      <p>翻译：罗季翁·弗拉索夫（借助人工智能工具）。底本：希腊文原文（<a href="https://bibleox.com/zh-Hans/grc/w/ΙγνΘ_Πολ">本站的希腊文版本</a>，明显的脱漏据莱特福特本和霍姆斯本补足）。参考：俄文译本（《早期教父文选》，布鲁塞尔，1988年）、英文译本（Roberts–Donaldson）、法文译本（Genoude，1837年）。圣经链接指向本站的思高本。</p>
