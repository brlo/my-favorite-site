      <p>翻译原则：本页译自本站的俄文页面。革利免著作的引文一律按本站中文译本（据希腊文原文译出），并按章节指向译本的相应段落；俄文引文中的章题（如「Глава 40…」）改为章节链接，俄文引文的行号链接（#L）同样改按章节。爱任纽的引文译自希腊文原文，并与俄文译本对照。俄文引文（据普列奥布拉任斯基译本摘录）与本站俄文译本有出入处，中文一律从本站译本。译名沿用本站中文译本的传统：革利免（和合本 腓 4:3）、爱任纽、特土良、哲罗姆、利奴（和合本 提后 4:21）、摩西、亚伦等取和合本形式；特勒斯福尔、安纳克利特按音译。革利免所引旧约经文按七十士译本的词语译出，与和合本有出入处在诸书信的注中说明；次经的引用指向本站思高本。引文的着重号（粗体、色标）沿用俄文页面的标示。</p><p>翻译：罗季翁·弗拉索夫（借助人工智能工具）。</p>
