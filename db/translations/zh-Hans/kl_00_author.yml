    body: |-
      <p>阅读罗马的革利免著作的希腊文原文，请点<a href="https://bibleox.com/zh-Hans/grc/w/Κλήμης_Ρώμης">这里</a>。在著作目录上方也可以切换到其他语言。</p><p><strong>纪念日</strong>：11月25日（新历12月8日）</p><h2>生平</h2><p>他生于主降生后的一世纪。在古代教会中，他被尊为最重要、最杰出的基督教圣人之一；他是使徒彼得与保罗的门徒。他可能正是使徒保罗在《腓立比书》中所提到的那位革利免（<a href="https://bibleox.com/zh-Hans/cn-cuv/fil/4/#L3">腓 4:3</a>）。</p><p>有些作者（特土良、斯特里顿的可敬哲罗姆、塞浦路斯的伊皮法纽）主张，革利免是由使徒彼得亲自祝圣为主教的。关于他的服事与殉道，没有任何可靠的记载流传下来。比如，在二世纪八九十年代，殉道司祭、里昂的爱任纽还断言说，罗马诸主教中领受殉道之死的，只有圣特勒斯福尔（127/8–137/8）一位。然而，从四世纪起，革利免成了大量传说故事的主角。从六世纪起，他在（克里米亚）克尔松殉道的故事广为人知，圣人的敬礼后来也因此传布到了罗斯。</p><p>时至今日，关于他的人格与服事，最鲜明而无可争议的见证之一，就是流传至今（以抄本流传）的致哥林多教会书信——因当地基督徒中间发生了骚乱，圣革利免便为此写了这封信。这封信除了显出作者的权威之外，也显出他的热忱、爱心与属灵的智慧。</p><p>二世纪时，殉道司祭、里昂的爱任纽这样写到这封书信：</p><blockquote><p>3. 蒙福的众使徒建立并建造了教会之后，就把主教的职分托付给利奴；这位利奴，保罗在书信中曾提到过。继他之后的是安纳克利特；在他之后，<strong>使徒之后第三位，革利免得了主教的职分——他见过蒙福的众使徒，并与他们交往过：使徒们的宣讲还在他耳中，他们的传统还呈在他眼前</strong>。而且他并非独自一人：那时还有许多人，也都受过使徒们的教导。<strong><mark>正当这位革利免在任之时</mark>，哥林多的弟兄中间发生了不小的分歧，<mark>罗马教会便写信给哥林多人，写了一封非常有益的书信</mark>，劝他们复和，坚固他们的信心，并传扬他们不久前才从使徒们领受的传统</strong>——这传统所宣讲的，是独一的全能上帝，天与地的创造者。</p></blockquote><p>（<a href="https://bibleox.com/zh-Hans/en/w/irenaeus-against-heresies-b3#HH-3">爱任纽《驳异端》第三卷，第3章（英文）</a>）</p><h2>信仰</h2><h3>得救不仅需要信心，也需要行为</h3><p>关于救恩，革利免有不同的话：既说到因行为称义，也说到因信心称义，还说到为要得救，人必须寻求并遵行上帝的旨意。</p><p>现在我们来试着把这些话调和起来。</p><p>首先，革利免说到因行为称义：</p><blockquote><p>让我们穿上同心合意，存心谦卑，节制自守，远离一切窃窃私语与毁谤，<strong><mark>以行为称义</mark></strong>，而不是以言语。</p></blockquote><p>这番话是针对假冒为善说的。为要得救，人必须<u>是</u>有德行的，而不只是谈论德行。革利免写这封信的缘由，是当时有人对使徒们所立的司祭们发动了彻底的叛乱。革利免指斥叛乱者的假冒为善。他呼吁大家与那些<u>用行动</u>保守和平的人联合，弃绝那些只口头谈论和平、却分裂教会的人：</p><blockquote><p>所以，我们不可偏离祂的旨意——这是理所当行的。<strong>与其得罪上帝，不如反对那些愚拙而无知、自高自大、<mark>夸耀自己言语之华丽</mark>的人</strong>。我们要敬畏主耶稣基督——祂的血为我们而流；<strong>要敬重我们的带领者，尊重司祭们</strong>，以敬畏上帝之道教导青年……</p><p>…</p><p><strong>所以，让我们与那些怀着敬虔保守和平的人联合，不与那些<mark>怀着假冒为善渴望和平</mark>的人联合</strong>。</p><p>…</p><p><strong>因为基督属于谦卑的人，而不属于向祂的羊群自高的人</strong>。</p></blockquote><p>所以，为要得救，我们需要真实的行为，而不只是言语。为要得救，人必须是良善的，而不是看起来良善。</p><hr><p>说了真实行为的必要之后，革利免又截断了另一个极端，说：我们得救，不是靠自己，也不是只靠自己的行为，而是靠信心。也就是说，行为本身并不能带来救恩。若不信基督，人无论有多少善行，也绝不能靠自己得救：</p><blockquote><p>我们既蒙祂的旨意呼召，在基督耶稣里蒙召，<strong><mark>便不是靠我们自己称义</mark></strong>，<strong>也不是靠我们的智慧、悟性、敬虔，或我们在心中圣洁里所成就的<mark>行为</mark></strong>，<strong><mark>而是借着信心</mark></strong>——全能的上帝从亘古以来，正是借着它称义了众人。</p></blockquote><hr><p>下面，革利免又回到救恩的主题，这次描述了整幅图景。为要得救，需要：1）信心；2）寻求上帝的旨意；3）遵行这旨意。</p><blockquote><p>所以，<strong><mark>让我们竭尽全力</mark></strong>，使自己得以列在恒忍的人之中，<strong><mark>得以有份于所应许的恩赐</mark></strong>。亲爱的诸位，<strong><mark>这将要怎样成就呢</mark></strong>？1）我们若坚定心志，忠诚地向着上帝；2）若寻求祂所喜悦、所接纳的事；3）<strong><mark>若遵行</mark></strong>祂圣善旨意所要求的事，并行走真理之路，撇弃一切的不义与邪恶、贪婪、纷争、恶毒与诡诈、窃窃私语与毁谤、不敬虔、骄傲与自大、虚浮的荣耀与不接待客旅的心。因为<strong><mark>行这些事的人是上帝所憎恶的</mark></strong>，不但行的人，连赞同这些事的人也是。</p></blockquote><p>若没有善行，我们就要被定罪：</p><blockquote><p>你们要看，亲爱的诸位，<strong><mark>免得祂这许多的恩惠反而成了我们众人的定罪</mark></strong>——<strong><mark>我们若不度配得上祂的生活</mark></strong>，<strong><mark>不同心合意地在祂面前行善事</mark></strong>、行祂所喜悦的事。（<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Kl4C1_致哥林多人前书#HH-21">《致哥林多人前书》21:1</a>）</p></blockquote><p>关于救恩的所有引文，按次排列如下：</p><blockquote><p>所以，既然一切都蒙祂看见、蒙祂听见，就让我们敬畏祂，<strong><mark>抛下对恶事的污秽私欲</mark></strong>，好叫我们靠着祂的怜悯，蒙遮蔽，免去将来的审判。</p><p>…</p><p>让我们穿上同心合意，存心谦卑，节制自守，远离一切窃窃私语与毁谤，<strong><mark>以行为称义</mark></strong>，而不是以言语。</p><p>…</p><p>我们既蒙祂的旨意呼召，在基督耶稣里蒙召，<strong><mark>便不是靠我们自己称义</mark></strong>，<strong>也不是靠我们的智慧、悟性、敬虔，或我们在心中圣洁里所成就的<mark>行为</mark></strong>，<strong><mark>而是借着信心</mark></strong>——全能的上帝从亘古以来，正是借着它称义了众人。</p><p>…</p><p><strong>那么，弟兄们，我们要做什么呢？</strong>要停止行善、撇下爱吗？绝不可——愿主不许这事在我们中间发生；相反，我们要怀着热切与渴慕，<strong>急速去完成一切善工</strong>。</p><p>…</p><p>我们也要明白：<strong>众义人都是用善行妆饰的</strong>，主自己也用善行妆饰自己而欢喜。既有这样的榜样，我们就要毫不懈怠地随从祂的旨意，并<strong>尽全身之力去行公义之事</strong>。</p><p>…</p><p><strong>忠心的工人坦然领取自己劳碌得来的饼</strong>；<strong>懒惰懈怠的人却不敢仰视那派给他工作的主人</strong>。所以，我们当热心行善，因为万物都是出于祂。祂预先向我们预言说：“看哪，主必来到，祂的赏赐在祂面前，<strong>要照各人的工作报应各人</strong>。”（<a href="https://bibleox.com/zh-Hans/cn-cuv/is/40/#L10">赛 40:10</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/is/62/#L11">赛 62:11</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/22/#L12">启 22:12</a>）</p><p>…</p><p>所以，<strong><mark>让我们竭尽全力</mark></strong>，使自己得以列在恒忍的人之中，<strong><mark>得以有份于所应许的恩赐</mark></strong>。亲爱的诸位，<strong><mark>这将要怎样成就呢</mark></strong>？1）我们若坚定心志，忠诚地向着上帝；2）若寻求祂所喜悦、所接纳的事；3）<strong><mark>若遵行</mark></strong>祂圣善旨意所要求的事，并行走真理之路，撇弃一切的不义与邪恶、贪婪、纷争、恶毒与诡诈、窃窃私语与毁谤、不敬虔、骄傲与自大、虚浮的荣耀与不接待客旅的心。因为<strong><mark>行这些事的人是上帝所憎恶的</mark></strong>，不但行的人，连赞同这些事的人也是。</p><p>…</p><p><strong><mark>这就是那条道路，亲爱的诸位——我们借它寻得我们的救恩</mark></strong>，就是耶稣基督，我们众祭献的大司祭，我们软弱的护卫者与帮助者。</p><p>…</p><p>那么，谁是祂的仇敌呢？就是恶人，就是抵挡祂旨意的人。</p></blockquote><p>（<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Kl4C1_致哥林多人前书">《致哥林多人前书》</a>）</p><h3>主教是使徒的继承者</h3><blockquote><p><em>我们的众使徒也借着我们的主耶稣基督知道，将要有关于主教名分的纷争。正因这缘故，他们既领受了完全的先见，<strong><mark>便立了上述的那些人，随后又定下规约</mark></strong>：<strong><mark>等他们安睡之后，别的经过考验的人便要接替他们的服事</mark></strong>。所以，我们认为，<strong><mark>废弃那些由使徒们亲自所立、或此后由其他可敬的人士</mark></strong>在全会众同意之下所立之人的职分，是不公义的</em></p></blockquote><p>（<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Kl4C1_致哥林多人前书#HH-44">《致哥林多人前书》44:1-3</a>）</p><h3>不是人人都作祭司</h3><blockquote><p><strong><mark>并非人人都是总督，并非人人都是千夫长、或百夫长、或五十夫长，如此等等，而是各人在自己的班次里</mark></strong>执行君王与带领者们所吩咐的。</p></blockquote><blockquote><p>所以，愿我们整个身体都在基督耶稣里得保全，<strong><mark>各人都顺服他的邻人，按他在恩赐里所立的位置</mark></strong>。</p></blockquote><p>（<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Kl4C1_致哥林多人前书#HH-37">《致哥林多人前书》37:3</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Kl4C1_致哥林多人前书#HH-38">《致哥林多人前书》38:1</a>）</p><h3>圣职的层级：三个品级（主教、司祭、辅祭）</h3><p>罗马的革利免提到了圣职的全部三个品级：主教、司祭与辅祭。不过，他在同一处列举的从未超过两个品级。但有一些地方，他讲到旧约时把它投射到新约上；在这些地方，他列举了教会的四个品级：大司祭、司祭、利未人和在俗之人。随后，革利免立刻呼吁信徒不可越出自己的服事位置。这使人可以认为，罗马的革利免知道圣职服事的三个品级。</p><blockquote><p>既深信这些事，又俯身钻研上帝圣知识的深处，我们就必须按次序行主吩咐在特定时节所行的一切事。<strong><mark>祂吩咐</mark>，献祭与<mark>礼仪</mark>不可随意举行，也不可紊乱无序，而要在<mark>特定的时节和时辰</mark>举行</strong>；至于<strong><mark>在何处、由何人来举行</mark></strong>，祂也以自己至高的旨意亲自指定了，使一切都圣洁地、蒙悦纳地进行，叫祂的旨意喜悦。</p><p>所以，在规定时节献祭的人是蒙悦纳的、是有福的；因为他们遵行主的诫命，没有偏离。<strong><mark>大司祭</mark>有分派给他的服事，<mark>司祭们</mark>有指定给他们的位置，<mark>利未人</mark>身上有他们的职守；<mark>在俗之人</mark>则受为百姓所定规条的约束。</strong></p><p>弟兄们，你们每一个人都要<strong>在自己的班次里蒙上帝喜悦</strong>：存着良善的良心，怀着庄重，<strong><mark>不越出为自己所定的服事规条</mark></strong>。</p><p>弟兄们，常常献的祭、或还愿的祭、或赎罪的祭与赎愆的祭，并不是随处都献上，而是只在耶路撒冷；就是在那里，也不是在每个地方都献，而是在圣殿前、在祭坛上，并且要先由大司祭和上述的服事者查验所献之物。</p><p><strong><mark>凡违背祂旨意行事的人，当受死刑</mark></strong>。</p><p>弟兄们，你们要看：我们蒙受的见识越大，<strong>所冒的危险就越大</strong>。</p><p><strong><mark>众使徒受差遣</mark>，<mark>从主耶稣基督</mark>向我们传福音</strong>；耶稣基督是从上帝差来的。</p><p><strong><mark>基督是从上帝来的，使徒们是从基督来的</mark></strong>；<strong>这两者都是按上帝的旨意井然有序地成就的</strong>。</p><p>所以，他们既领受了命令，又借我们的主耶稣基督的复活深信不疑，以上帝的话语在信心中得坚固，<strong>便怀着圣灵的丰盛，出去宣讲将要来临的上帝的国</strong>。</p><p><strong>他们各处各地、各城宣讲，<mark>把初信的头一批人</mark>，在灵里加以考验之后，<mark>立为主教和辅祭</mark>，为将来要信的人预备</strong>。</p><p><strong><mark>这并不是新的设立</mark></strong>；因为许久以前，圣经就写到主教与辅祭。<strong>圣经这样说</strong>：“我要立他们的主教在公义里，立他们的辅祭在信心上。”（<a href="https://bibleox.com/zh-Hans/cn-cuv/is/60/#L17">赛 60:17</a>）</p><p><strong><mark>若有在基督里由上帝托付这事的人立了上述的那些人</mark></strong>，这又何足为奇呢？可称颂的摩西——“在祂全家尽忠的仆人”（<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/3/#L2">希 3:2</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/3/#L5">希 3:5</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/12/#L7">民 12:7</a>）——把一切吩咐给他的都记在圣书上；其余的众先知也跟从他，用自己的见证坚固他所立定的律例。</p><p><strong>当<mark>关于祭司职分的纷争</mark>兴起，以色列众支派为这一荣耀的名分该归于哪一个支派而起了争议时</strong>，摩西吩咐十二个支派的首领把棍杖带来，各支派的名字写在上面；他拿了棍杖，捆起来，用各支派首领的戒指封印，放在见证帐幕里上帝的桌子上。他锁上帐幕，钥匙与棍杖一同封印，对他们说：“弟兄们，哪一支派的棍杖发芽，上帝就拣选了那支派，归祂作祭司、事奉祂。”次日清早，他召集了全以色列——六十万男子——向众支派首领展示印封，开了见证帐幕，取出棍杖：亚伦的棍杖不但发了芽，而且结了果子。<strong>亲爱的诸位，你们以为如何？<mark>摩西岂不预先知道这事将要发生吗？他当然是知道的</mark>，但他这样行，是为了以色列中不生骚乱</strong>，为了荣耀那“真实而独一的”上帝之名（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/17/#L3">约 17:3</a>）。愿荣耀归于祂，直到永永远远。阿们。</p><p>我们的众使徒也借着我们的主耶稣基督知道，将要有关于主教名分的纷争。正因这缘故，他们既领受了完全的先见，<strong><mark>便立了上述的那些人，随后又定下规约</mark></strong>：等他们安睡之后，别的经过考验的人便要接替他们的服事。所以，<strong><mark>我们认为，废弃那些由使徒们亲自所立、或此后由其他可敬的人士在全会众同意之下所立之人的职分</mark></strong>，是不公义的——他们曾无可指摘地服事基督的羊群，怀着谦卑，安静而温和，并且长久以来获得众人的称许</p></blockquote><p>（<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Kl4C1_致哥林多人前书#HH-40">《致哥林多人前书》40:1-5</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Kl4C1_致哥林多人前书#HH-41">《致哥林多人前书》41:1-4</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Kl4C1_致哥林多人前书#HH-42">《致哥林多人前书》42:1-5</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Kl4C1_致哥林多人前书#HH-43">《致哥林多人前书》43:1-6</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Kl4C1_致哥林多人前书#HH-44">《致哥林多人前书》44:1-6</a>）</p><p>在司祭们之上还有带领者（辅祭则在别处谈到）：</p><blockquote><p>所以，我们不可偏离祂的旨意——这是理所当行的。<strong>与其得罪上帝，不如反对那些愚拙而无知、自高自大、<mark>夸耀自己言语之华丽</mark>的人</strong>。我们要敬畏主耶稣基督——祂的血为我们而流；<strong>要敬重我们的带领者，尊重司祭们</strong>，以敬畏上帝之道教导青年……</p></blockquote><p>（<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Kl4C1_致哥林多人前书#HH-21">《致哥林多人前书》21:4-6</a>）</p><h3>圣职带有恩典</h3><p>关于这一点，说法并非那么直白，但仍是说得通的。革利免写信给哥林多人，为要平息针对司祭们的叛乱。他呼吁回到那些由使徒们所立、谦卑地服事基督羊群的人那里去。他一再强调谦卑，一次又一次呼吁与那些保守和平、拥有恩典的司祭们联合：</p><blockquote><p>所以，我们既是圣洁的部分，就要行一切属于圣洁的事：远避毁谤，远避污秽败坏的苟合、醉酒、喜新猎奇的私欲、卑劣的情欲、可憎的奸淫与可憎的骄傲。因为经上说：“<strong><mark>上帝抵挡骄傲的人，赐恩给谦卑的人</mark></strong>。”所以，让我们与那些从上帝领受恩典的人联合。让我们穿上同心合意，存心谦卑，节制自守，远离一切窃窃私语与毁谤，以行为称义，而不是以言语。（<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/3/#L34">箴 3:34</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/4/#L6">雅 4:6</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/5/#L5">彼前 5:5</a>）</p></blockquote><p>（<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Kl4C1_致哥林多人前书#HH-30">《致哥林多人前书》30:1-3</a>）</p><blockquote><p><strong>所以，让我们与那些怀着敬虔保守和平的人联合，不与那些<mark>怀着假冒为善渴望和平</mark>的人联合</strong>。</p><p>…</p><p><strong>因为基督属于谦卑的人，而不属于向祂的羊群自高的人</strong>。</p></blockquote><p>（<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Kl4C1_致哥林多人前书#HH-15">《致哥林多人前书》15:1</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Kl4C1_致哥林多人前书#HH-16">《致哥林多人前书》16:1</a>）</p><blockquote><p>我们的众使徒也借着我们的主耶稣基督知道，将要有关于主教名分的纷争。正因这缘故，他们既领受了完全的先见，<strong><mark>便立了上述的那些人，随后又定下规约</mark></strong>：等他们安睡之后，别的经过考验的人便要接替他们的服事。所以，<strong><mark>我们认为，废弃那些由使徒们亲自所立、或此后由其他可敬的人士在全会众同意之下所立之人的职分</mark></strong>，是不公义的——他们曾无可指摘地服事基督的羊群，怀着谦卑，安静而温和，并且长久以来获得众人的称许</p></blockquote><p>（<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Kl4C1_致哥林多人前书#HH-44">《致哥林多人前书》44:1-3</a>）</p><p>罗马的革利免的呼吁，与使徒保罗在《罗马书》中的话相呼应：</p><blockquote><p>“要彼此同心，不要志气高大，<strong><mark>倒要俯就卑微的人</mark></strong>。不要自以为聪明。”（<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/12/#L16">罗 12:16</a>）</p></blockquote><h3>保守教会可见的合一</h3><blockquote><p>所以，我们若因仇敌的某种陷害而跌倒犯了罪，就应当求饶恕。而那些作叛乱与分裂首领的人，也当顾念共同的盼望。因为怀着敬畏与爱心生活的人，<strong><mark>宁愿自己遭遇不幸，也不愿让邻人遭遇</mark></strong>；<strong><mark>宁愿判罚落在自己身上，也不愿落在那传给我们的美好圣善的同心合意上</mark></strong>。人宁可认自己的罪，也不要刚硬自己的心，正如那些背叛上帝的仆人摩西之人的心刚硬了一样：对他们的审判是明显的。因为他们“活着就下到了阴间”，“死亡要牧养他们”。（<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/16/">民 16</a>）</p><p>…</p><p>所以，你们中间谁是有刚毅的、谁是有仁慈的、谁是完全了爱的，让他这样说：“<strong><mark>若因我而起纷争、叛乱与分裂，我就退去，去你们愿意的地方</mark></strong>，并遵行众人所吩咐的一切；只要基督的羊群与所立的司祭们平安相安。”这样行的人，必在主里为自己赢得极大的荣耀，各处都必接纳他：因为“地和其中所充满的，都是主的”（<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/24/#L1">诗 24:1</a>）。凡度着可称许的神圣生活的人，从前这样行，将来也必这样行。</p></blockquote><p>（<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Kl4C1_致哥林多人前书#HH-51">《致哥林多人前书》51:1-4</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Kl4C1_致哥林多人前书#HH-54">《致哥林多人前书》54:1-4</a>）</p><h3>呼吁顺服圣职人员</h3><p>《致哥林多人书》写作的缘由，是一些人起来叛乱，反对使徒们所立的司祭们。革利免先称赞哥林多人昔日对圣职人员的顺服：</p><blockquote><p>你们凡事都不徇情面，并遵行上帝的律例而行，顺服你们的带领者，把当得的尊荣归给你们中间的司祭们！</p><p>…</p><p>你们众人存心谦卑，毫不自夸，宁愿顺服人，也不辖制人；宁愿施与，也不接受。</p><p>…</p><p>这样，深厚而丰润的平安便赐给了众人，行善的渴望也永不知足；</p><p>…</p><p>一切纷争、一切分裂都是你们所憎恶的。</p></blockquote><p>（<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Kl4C1_致哥林多人前书#HH-1">《致哥林多人前书》1:3</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Kl4C1_致哥林多人前书#HH-2">《致哥林多人前书》2:1-6</a>）</p><p>但随后他开始斥责叛乱，呼吁顺服使徒们所立的司祭们：</p><blockquote><p>于是，“无尊荣的起来攻击有尊荣的”，无名的攻击有名的，愚昧的攻击智慧的，年轻的攻击年长的。因此，公义与平安都远离了：各人离弃了对上帝的敬畏，在对祂的信心里变得昏昧，不照祂诫命的律例而行，不度配得基督的生活，<strong><mark>各人反而随从自己邪恶之心的私欲走去，接受了不义的、不敬虔的嫉恨</mark></strong>——死亡也正是借着它进入了世界。（<a href="https://bibleox.com/zh-Hans/cn-sb/prs/2/#L24">智 2:24</a>）</p><p>…</p><p>所以，我们不可偏离祂的旨意——这是理所当行的。<strong>与其得罪上帝，不如反对那些愚拙而无知、自高自大、<mark>夸耀自己言语之华丽</mark>的人</strong>。我们要敬畏主耶稣基督——祂的血为我们而流；<strong>要敬重我们的带领者，尊重司祭们</strong>，以敬畏上帝之道教导青年……</p><p>…</p><p>弟兄们，<strong><mark>顺服上帝，胜过跟随那些以自高与骚乱作可憎嫉恨之首领的人</mark></strong>，这才是公义而圣洁的事。因为，<strong><mark>若我们轻率地把自己交在那唆使我们陷入分裂与叛乱</mark></strong>、要使我们与美善隔绝之人的私欲手中，我们所受的就不是寻常的伤害，而是要陷于极大的危险。</p><p>…</p><p>所以，我们若因仇敌的某种陷害而跌倒犯了罪，就应当求饶恕。而那些作叛乱与分裂首领的人，也当顾念共同的盼望。因为怀着敬畏与爱心生活的人，<strong><mark>宁愿自己遭遇不幸，也不愿让邻人遭遇</mark></strong>；<strong><mark>宁愿判罚落在自己身上，也不愿落在那传给我们的美好圣善的同心合意上</mark></strong>。人宁可认自己的罪，也不要刚硬自己的心，正如那些背叛上帝的仆人摩西之人的心刚硬了一样：对他们的审判是明显的。因为他们“活着就下到了阴间”，“死亡要牧养他们”。（<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/16/">民 16</a>）</p><p>…</p><p>所以，你们中间谁是有刚毅的、谁是有仁慈的、谁是完全了爱的，让他这样说：“<strong><mark>若因我而起纷争、叛乱与分裂，我就退去，去你们愿意的地方</mark></strong>，并遵行众人所吩咐的一切；只要基督的羊群与所立的司祭们平安相安。”这样行的人，必在主里为自己赢得极大的荣耀，各处都必接纳他：因为“地和其中所充满的，都是主的”（<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/24/#L1">诗 24:1</a>）。凡度着可称许的神圣生活的人，从前这样行，将来也必这样行。</p></blockquote><p>（<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Kl4C1_致哥林多人前书#HH-3">《致哥林多人前书》3:3-4</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Kl4C1_致哥林多人前书#HH-14">《致哥林多人前书》14:1-2</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Kl4C1_致哥林多人前书#HH-21">《致哥林多人前书》21:4-6</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Kl4C1_致哥林多人前书#HH-51">《致哥林多人前书》51:1-4</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Kl4C1_致哥林多人前书#HH-54">《致哥林多人前书》54:1-4</a>）</p><h3>叛乱者假冒为善地谈论和平</h3><blockquote><p><strong>所以，让我们与那些怀着敬虔保守和平的人联合，不与那些<mark>怀着假冒为善渴望和平</mark>的人联合</strong>。</p><p>…</p><p><strong>因为基督属于谦卑的人，而不属于向祂的羊群自高的人</strong>。</p></blockquote><p>（<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Kl4C1_致哥林多人前书#HH-15">《致哥林多人前书》15:1</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Kl4C1_致哥林多人前书#HH-16">《致哥林多人前书》16:1</a>）</p><h3>基督徒有时也会犯罪</h3><p>基督徒有时也会犯罪，甚至彼此得罪：</p><blockquote><p>你们心怀圣善的意向，怀着美善的热忱与敬虔的信心，向全能的上帝伸手祈求，恳求祂施怜悯，因为你们有时无意中犯了罪。</p><p>…</p><p>你们真诚无伪，心里单纯，彼此不怀怨恨。</p><p>…</p><p>你们为邻人的过犯忧伤，把他们的欠缺看作自己的欠缺。</p><p>…</p><p>于是，“无尊荣的起来攻击有尊荣的”，无名的攻击有名的，愚昧的攻击智慧的，年轻的攻击年长的。因此，公义与平安都远离了：各人离弃了对上帝的敬畏，在对祂的信心里变得昏昧，不照祂诫命的律例而行，不度配得基督的生活，<strong><mark>各人反而随从自己邪恶之心的私欲走去，接受了不义的、不敬虔的嫉恨</mark></strong>——死亡也正是借着它进入了世界。（<a href="https://bibleox.com/zh-Hans/cn-sb/prs/2/#L24">智 2:24</a>）</p></blockquote><p>（<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Kl4C1_致哥林多人前书#HH-2">《致哥林多人前书》2:3-6</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Kl4C1_致哥林多人前书#HH-3">《致哥林多人前书》3:3-4</a>）</p><h3>关心会众能得救（尚未得救）</h3><blockquote><p>你们<strong><mark>昼夜竞逐奔程，为整个弟兄团体争战</mark></strong>，<strong><mark>要叫祂所拣选的人数</mark></strong>靠着怜悯与良心<strong><mark>得蒙拯救</mark></strong>。</p></blockquote><p>（<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Kl4C1_致哥林多人前书#HH-2">《致哥林多人前书》2:4</a>）</p><h3>圣徒与身体分离后仍然活着，并处在圣善的地方</h3><p>彼得和保罗进入了圣善的地方：</p><blockquote><p>彼得因不义的嫉恨，所受的不是一桩、也不是两桩苦，而是许多的苦难；他这样作了见证，<strong><mark>便去了那配得荣耀的地方</mark></strong>。保罗因嫉恨得了忍耐的奖赏：他七次受捆绑，被驱逐，被石头打。他在东方和西方作宣讲者，为自己的信得了高贵的名声：他教导全世界公义，走遍到西方的边界，并在掌权者面前以殉道为真理作了见证。这样，<strong><mark>他便离开了世界，进入了圣善的地方</mark></strong>，成了忍耐最大的榜样。</p><p>…</p><p><strong><mark>与这些圣善度日的人</mark></strong>一同聚拢的，<strong><mark>还有一大批蒙拣选的人</mark></strong>：他们因嫉恨受了许多凌辱与刑罚，在我们中间留下了最美的榜样。</p></blockquote><p>（<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Kl4C1_致哥林多人前书#HH-5">《致哥林多人前书》5:4-7</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Kl4C1_致哥林多人前书#HH-6">《致哥林多人前书》6:1</a>）</p><h3>他呼吁人顺服上帝的旨意（反对加尔文主义）</h3><blockquote><p>所以，让我们顺服祂那威严而荣耀的旨意，抛下虚妄的劳碌、纷争与引到死亡的嫉恨，恳求祂的怜悯与恩慈，俯伏并回转到祂的怜悯中。</p></blockquote><p>（<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Kl4C1_致哥林多人前书#HH-9">《致哥林多人前书》9:1</a>）</p>
