  path: QO15A_香、乳香、香炉
  title: 香（乳香、香料）
  copy_cover: true
  body: <h2>定义</h2><p><strong>香</strong>——燃烧的乳香（树脂）所发的烟。</p><p><strong>乳香</strong>（阿拉伯文 lādan——「芳香树脂」）——某些树木（起初是黎巴嫩雪松）的芳香树脂。燃烧的乳香发出悦人的香气。在举行圣礼和调制芬芳圣香时使用（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/30/#L34-36">出 30:34-36</a>）。</p><p><strong>焚香</strong>——乳香燃烧、香上升的过程。</p><p><strong>香炉</strong>——焚烧芬芳配料（加乳香）的器具（盘）。</p><h2>圣经引文</h2><h3>芬芳配料（加乳香）——大圣物</h3><blockquote><p>“耶和华吩咐摩西说：「你要取馨香的香料，就是拿他弗、施喜列、喜利比拿。<strong><mark>这馨香的香料和净乳香各样要一般大的分量</mark></strong>。 你要用这些加上盐，按作香之法，<strong><mark>作成清净圣洁的香</mark></strong>。 这香要取点捣得极细，<strong><mark>放在会幕内法柜前</mark></strong>，我要在那里与你相会。<strong><mark>你们要以这香为至圣</mark></strong>。 你们不可按这调和之法为自己作香；<strong><mark>要以这香为圣，归耶和华</mark></strong>。 凡作香和这香一样，为要闻香味的，<strong><mark>这人要从民中剪除</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/30/#L34-38">出 30:34-38</a>)</p></blockquote><h3>乳香（树脂）与油一同加在素祭上，然后祭物由祭司焚烧</h3><blockquote><p>“若有人献素祭为供物给耶和华，<strong><mark>要用细面浇上油，加上乳香</mark></strong>， 带到亚伦子孙作祭司的那里。祭司就要从细面中取出一把来，<strong><mark>并取些油和所有的乳香</mark></strong>，然后要把所取的这些作为纪念，<strong><mark>烧在坛上</mark></strong>，是献与耶和华为馨香的火祭。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/2/#L1-2">利 2:1-2</a>)</p></blockquote><h3>祭物也有不加乳香的</h3><blockquote><p>“这人就要将妻送到祭司那里，又为她带着大麦面伊法十分之一作供物，<strong><mark>不可浇上油，也不可加上乳香</mark></strong>，<strong><mark>因为这是疑恨的素祭</mark></strong>，是思念的素祭，使人思念罪孽。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/5/#L15">民 5:15</a>)</p></blockquote><h3>专只为香（乳香）而设的坛</h3><p>特别设立了烧香的坛，在其上不可焚烧任何别的东西。在其上焚香与祭献无关，自成一体。每天早晨和每天黄昏整理灯台时举行：</p><blockquote><p>“<strong><mark>你要用皂荚木作一座烧香的坛</mark></strong>。 &lt;…&gt; <strong><mark>要把坛放在法柜前的幔子外</mark></strong>，对着法柜上的施恩座，就是我要与你相会的地方。 <strong><mark>亚伦在坛上要烧馨香料作的香</mark></strong>；<strong><mark>每早晨他收拾灯的时候，要烧这香</mark></strong>。 <strong><mark>黄昏点灯的时候</mark></strong>，他要在耶和华面前烧这香，<strong><mark>作为世世代代常烧的香</mark></strong>。 在这坛上，<strong><mark>不可奉上异样的香</mark></strong>；不可献燔祭、素祭，<strong><mark>也不可浇上奠祭</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/30/#L1,6-9">出 30:1,6-9</a>)</p></blockquote><h3>香象征祈祷</h3><blockquote><p>“<strong><mark>愿我的祷告如香陈列在你面前</mark></strong>；愿我举手祈求，如献晚祭。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/141/#L2">诗 141:2</a>) <em>(俄文本编号为 Пс 140:2（圣咏编号相差一）。)</em></p></blockquote><blockquote><p>“他既拿了书卷，四活物和二十四位长老就俯伏在羔羊面前，<strong><mark>各拿着琴和盛满了香的金炉</mark></strong>；<strong><mark>这香就是众圣徒的祈祷</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/5/#L8">启 5:8</a>)</p></blockquote><h3>香是献给上帝的单独祭物</h3><p>香自成一体地被提及，与其他圣礼并列为列举（不是什么补充，不是只与其他事物搭配出现的）：</p><blockquote><p>“在以色列众支派中，<strong><mark>我不是拣选人作我的祭司，使他烧香</mark></strong>，在我坛上献祭，在我面前穿以弗得，又将以色列人所献的火祭都赐给你父家么？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1ts/2/#L28">撒上 2:28</a>)</p></blockquote><blockquote><p>“目前我们没有元首，没有先知，没有领袖，没有全燔祭，没有祭祀，没有供物，<strong>没有馨香祭</strong>，没有地方可以给你荐新，好蒙受你的仁爱。” (<a href="https://bibleox.com/zh-Hans/cn-sb/dan/3/#L38">但 3:38</a>)</p></blockquote><blockquote><p>“万军之耶和华说：「从日出之地到日落之处，我的名在外邦中必尊为大。<strong><mark>在各处，人必奉我的名烧香</mark></strong>，献洁净的供物。因为我的名在外邦中必尊为大。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mal/1/#L11">玛 1:11</a>)</p></blockquote><blockquote><p>“又制造了新的圣器，将灯台、<strong>香坛</strong>、供桌，搬进圣殿。<strong>在香坛上献香</strong>，又点着了灯台上的灯，在殿里放光。” (<a href="https://bibleox.com/zh-Hans/cn-sb/1mak/4/#L49-50">加上 4:49-50</a>)</p></blockquote><blockquote><p>“<strong>吩咐他</strong>为你的名建立城池，并在其中<strong>向你献香</strong>和祭物。” (<a href="https://bibleox.com/zh-Hans/ru/3ezd/3/#L24">厄四 3:24</a>, 俄文原文无中文经文，此处自译)</p></blockquote><blockquote><p>“约史雅的纪念，<strong>就如精制香料的人，用各种香味配成的香料</strong>，在众人口里，甜如蜂蜜，又如酒会中的音乐。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/49/#L1-2">德 49:1-2</a>)</p></blockquote><blockquote><p>“当他从帐幕后的至圣所出来，民众群集他身边时，<strong>他是多么有光彩</strong>；……<strong>他如烈火和香炉上的香料</strong>，” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/50/#L5,9">德 50:5,9</a>) <em>(俄文本为 Сир 50:5,9（论大祭司息孟）。)</em></p></blockquote><blockquote><p>“<strong><mark>愿我的祷告如香陈列在你面前</mark></strong>；愿我举手祈求，如献晚祭。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/141/#L2">诗 141:2</a>) <em>(俄文本编号为 Пс 140:2（圣咏编号相差一）。)</em></p></blockquote><blockquote><p>“他既强盛，就心高气傲，以致行事邪僻，干犯耶和华他的上帝，<strong><mark>进耶和华的殿，要在香坛上烧香</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/26/#L16">代下 26:16</a>)</p></blockquote><blockquote><p>“那从旷野上来、形状如烟柱、<strong><mark>以没药和乳香并商人各样香粉薰的是谁呢</mark></strong>？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pp/3/#L6">歌 3:6</a>)</p></blockquote><blockquote><p>“你没有将你的羊带来给我作燔祭，也没有用祭物尊敬我；我没有因供物使你服劳，<strong><mark>也没有因乳香使你厌烦</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/43/#L23">赛 43:23</a>)</p></blockquote><blockquote><p>“另有一位天使拿着金香炉，来站在祭坛旁边。<strong><mark>有许多香赐给他</mark></strong>，<strong><mark>要和众圣徒的祈祷一同献在宝座前的金坛上</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/8/#L3">启 8:3</a>)</p></blockquote><blockquote><p>“<strong><mark>那香的烟和众圣徒的祈祷，从天使的手中一同升到上帝面前</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/8/#L4">启 8:4</a>)</p></blockquote><h3>以香敬奉假神是对上帝的凌辱</h3><blockquote><p>“至于这民的一切恶，就是离弃我，<strong><mark>向别神烧香，跪拜自己手所造的</mark></strong>，我要发出我的判语攻击他们。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ier/1/#L16">耶 1:16</a>)</p></blockquote><blockquote><p>“这百姓时常当面惹我发怒：在园中献祭，<strong><mark>在坛上烧香</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/65/#L3">赛 65:3</a>)</p></blockquote><blockquote><p>“看哪，这都写在我面前，我必不静默，必施行报应，必将你们的罪孽和你们列祖的罪孽，<strong><mark>就是在山上烧香、在冈上亵渎我的罪孽</mark></strong>，一同报应在他们后人怀中。我先要把他们所行的量给他们。」这是耶和华说的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/65/#L6">赛 65:6</a>) <em>(俄文本编号为 Ис 65:7；和合本该句在 65:6。)</em></p></blockquote><p>以圣香敬假神者处以死刑：</p><blockquote><p>“<strong><mark>你们不可按这调和之法为自己作香</mark></strong>；要以这香为圣，归耶和华。 凡作香和这香一样，为要闻香味的，<strong><mark>这人要从民中剪除</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/30/#L37-38">出 30:37-38</a>)</p></blockquote>
