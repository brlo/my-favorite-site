  path: Qs8A_向耶稣基督的祈祷
  title: 向耶稣基督的祈祷
  copy_cover: true
  body: <h2>可以向耶稣基督祷告吗？</h2><p>当然可以。但这诫命我们不是从圣经，而是从圣传领受的。</p><h2>只凭圣经能否断言应当向耶稣基督祷告？</h2><p>圣经中没有向耶稣基督祷告的诫命。不过，<a href="https://bibleox.com/zh-Hans/gr-lxx-byz/in/14/#L14">约 14:14</a>有一些迹象（参见希腊文文本）。</p><p>耶稣基督曾向父祷告（<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/14/#L36">可 14:36</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/22/#L42">路 22:42</a>），赐下了「我们在天上的父」的祷告（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/6/#L9">太 6:9</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/11/#L2">路 11:2</a>），也就是说，他教导人向父祷告。</p><p>主张只靠圣经（当然是按他们对圣经的理解）建立信仰的人，不敢否认向耶稣基督的祷告。因此他们说：向耶稣基督祷告的实践既然存在，就是可以向他祷告。然而，他们常常连这种实践都难以指出，因为它十分罕见——当然，它是有的。例如：</p><blockquote><p>“他们正用石头打的时候，司提反<strong>呼吁</strong>主说：「<strong>求主耶稣</strong>接收我的灵魂！」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/7/#L59">徒 7:59</a>) <em>(希腊文 ἐπικαλούμενον（呼吁、祈求）)</em></p></blockquote><h2>反对意见</h2><h3>「奉我的名求」</h3><p>新教徒反对说，诫命就在这节经文里：</p><blockquote><p>“你们若<strong>奉我的名</strong>求什么，我必成就。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/14/#L14">约 14:14</a>)</p></blockquote><p>然而，只要引用上下文就能看到，主耶稣基督在这里教导的也是向父求：</p><blockquote><p>“你们奉我的名无论求什么，我必成就，<strong><mark>叫父因儿子得荣耀</mark></strong>。 你们若奉我的名求什么，我必成就。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/14/#L13-14">约 14:13-14</a>) <em>(和合本此处无「向父求」的字样)</em></p></blockquote>
