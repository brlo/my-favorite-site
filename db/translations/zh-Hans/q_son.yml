- src: Христос-искупитель
  path: Qs5A_基督——救赎者
  title: 基督——救赎者
  copy_cover: true
  body: <p>因亚当的过犯，全人类被定罪：</p><blockquote><p>“如此说来，<strong>因一次的过犯，众人都被定罪</strong>；照样，因一次的义行，众人也就被称义得生命了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/5/#L18">罗 5:18</a>)</p></blockquote><p>基督担当了人类的咒诅：</p><blockquote><p>“基督既为我们受了咒诅，就赎出我们脱离律法的咒诅，因为经上记着：『凡挂在木头上都是被咒诅的。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/3/#L13">加 3:13</a>)</p></blockquote><p>基督用自己的血救赎了人：</p><blockquote><p>“知道你们<strong>得赎</strong>、<strong>脱去你们祖宗所传流虚妄的行为</strong>，不是凭着能坏的金银等物， 乃是凭着<strong>基督的宝血</strong>，如同无瑕疵、无玷污的羔羊之血。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/1/#L18-19">彼前 1:18-19</a>)</p></blockquote><blockquote><p>“他们唱新歌，说：「你配拿书卷，配揭开七印。因为你曾被杀，<strong>用自己的血从各族、各方、各民、各国中买了人来</strong>，叫他们归于上帝，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/5/#L9">启 5:9</a>)</p></blockquote>
  meta_desc: "「你曾被杀，用自己的血从各族、各方、各民、各国中买了人来」"
