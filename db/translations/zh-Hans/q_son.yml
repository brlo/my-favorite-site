- src: Христос-на-небе
  path: Qs3A_基督在天上
  title: 基督在天上
  copy_cover: true
  body: <blockquote><p>“主耶稣和他们说完了话，后来<strong>被接到天上，坐在上帝的右边</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/16/#L19">可 16:19</a>)</p></blockquote><blockquote><p>“他是上帝荣耀所发的光辉，是上帝本体的真像，常用他权能的命令托住万有，他洗净了人的罪，就<strong>坐在高天至大者的右边</strong>．” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/1/#L3">希 1:3</a>)</p></blockquote><blockquote><p>“我们所讲的事，其中第一要紧的，就是我们有这样的大祭司，<strong>已经坐在天上至大者宝座的右边</strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/8/#L1">希 8:1</a>)</p></blockquote><blockquote><p>“但基督献了一次永远的赎罪祭，<strong>就在上帝的右边坐下了</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/10/#L12">希 10:12</a>)</p></blockquote><blockquote><p>“仰望为我们信心创始成终的耶稣。他因那摆在前面的喜乐，就轻看羞辱，忍受了十字架的苦难，<strong>便坐在上帝宝座的右边</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/12/#L2">希 12:2</a>)</p></blockquote><blockquote><p>“因为<strong>基督</strong>并不是进了人手所造的圣所（这不过是真圣所的影像），<strong>乃是进了天堂，如今为我们显在上帝面前</strong>；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/9/#L24">希 9:24</a>)</p></blockquote><blockquote><p>“但司提反被圣灵充满，定睛望天，看见上帝的荣耀，又看见<strong>耶稣站在上帝的右边</strong>， 就说：「<strong>我看见天开了，人子站在上帝的右边</strong>！」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/7/#L55-56">徒 7:55-56</a>)</p></blockquote>
  meta_desc: 圣经关于基督与父同在天上的引文
