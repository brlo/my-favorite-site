- src: Сын-безначальный-начинается
  path: Qs2A_无始的圣子降生了
  title: 无始的圣子降生了
  copy_cover: true
  body: <h2>上帝之子没有开始，但赐开始给一切有开始的</h2><blockquote><p>“太初有道，道与上帝同在，道就是上帝。 &lt;…&gt; 万物是借着他造的；<strong>凡被造的，没有一样不是借着他造的</strong>。 &lt;…&gt; 道成了肉身，住在我们中间，充充满满的有恩典有真理。我们也见过他的荣光，正是父独生子的荣光。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/1/#L1,3,14">约 1:1,3,14</a>)</p></blockquote><h2>麦基洗德的祭司职分——无生之始的上帝之子的预表</h2><blockquote><p>“他无父、无母、无族谱、<strong>无生之始、无命之终，乃是与上帝的儿子相似</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/7/#L3">希 7:3</a>)</p></blockquote><h2>无始者降生了</h2><p>无始的<a href="https://bibleox.com/ru/ru/w/Христос-Бог">上帝</a>降生了：他照预言（<a href="https://bibleox.com/zh-Hans/cn-cuv/is/7/#L14">赛 7:14</a>）由童女所生，成为人：</p><blockquote><p>“及至时候满足，上帝就<strong>差遣</strong>他的儿子，<strong>为女子所生</strong>，且生在律法以下，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/4/#L4">加 4:4</a>)</p></blockquote><blockquote><p>“他本有上帝的形像，不以自己与上帝同等为强夺的， 反倒虚己，<strong>取了奴仆的形像，成为人的样式</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/fil/2/#L6-7">腓 2:6-7</a>)</p></blockquote><blockquote><p>“太初有道，道与上帝同在，<strong>道就是上帝</strong>。 &lt;…&gt; 万物是借着他造的；凡被造的，没有一样不是借着他造的。 &lt;…&gt; <strong>道成了肉身</strong>，住在我们中间，充充满满的有恩典有真理。我们也见过他的荣光，正是父独生子的荣光。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/1/#L1,3,14">约 1:1,3,14</a>)</p></blockquote>
  meta_desc: 圣经关于无始的上帝之子由童贞女马利亚所生的引文
