- src: Христос-Единородный-Сын-Божий
  path: Qs1A_基督是上帝的独生子
  title: 基督是上帝的独生子
  copy_cover: true
  body: <h2>独生子——父的独子</h2><p>长子是最先出生的。也就是说，像上帝的儿子那样出生的，再没有别人：</p><blockquote><p>“<strong>道成了肉身</strong>，住在我们中间，充充满满的有恩典有真理。我们也见过他的荣光，正是<strong>父独生子的荣光</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/1/#L14">约 1:14</a>)</p></blockquote><blockquote><p>“从来没有人看见上帝，只有在父怀里的<strong>独生子</strong>将他表明出来。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/1/#L18">约 1:18</a>)</p></blockquote><blockquote><p>“<strong>上帝</strong>爱世人，<strong>甚至将他的独生子赐给</strong>他们，叫一切信他的，不至灭亡，反得永生。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/3/#L16">约 3:16</a>)</p></blockquote><blockquote><p>“信他的人，不被定罪；不信的人，罪已经定了，因为他不信<strong>上帝独生子的名</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/3/#L18">约 3:18</a>)</p></blockquote><blockquote><p>“及至时候满足，<strong>上帝就差遣他的儿子</strong>，为女子所生，且生在律法以下，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/4/#L4">加 4:4</a>)</p></blockquote><blockquote><p>“上帝差他<strong>独生子</strong>到世间来，使我们借着他得生，上帝爱我们的心在此就显明了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/4/#L9">约壹 4:9</a>)</p></blockquote><p>亚伯拉罕献独生子以撒——是上帝的独生子在十字架上被献为祭的预表：</p><blockquote><p>“亚伯拉罕因着信，被试验的时候，就把以撒献上；这便是那欢喜领受应许的，将自己<strong>独生的儿子</strong>献上。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/11/#L17">希 11:17</a>)</p></blockquote><h2>耶稣基督是长子（首生者）</h2><p>基督两次被称为长子：</p><blockquote><p>“因为他预先所知道的人，就预先定下效法他儿子的模样，使他儿子<strong>在许多弟兄中作长子</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/8/#L29">罗 8:29</a>)</p></blockquote><blockquote><p>“再者，上帝使<strong>长子</strong>到世上来的时候，就说：『上帝的使者都要拜他。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/1/#L6">希 1:6</a>)</p></blockquote><p>为什么基督是长子？因为他是首先从死里复活的：</p><blockquote><p>“他也是教会全体之首，他是元始，是<strong>从死里首先复生的</strong>，使他可以在凡事上居首位。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/1/#L18">西 1:18</a>)</p></blockquote><blockquote><p>“并那诚实作见证的、<strong>从死里首先复活</strong>、为世上君王元首的耶稣基督，有恩惠、平安归与你们！他爱我们，用自己的血使我们脱离罪恶，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/1/#L5">启 1:5</a>)</p></blockquote><blockquote><p>“就是基督必须受害，并且<strong>因从死里复活</strong>，要首先把光明的道传给百姓和外邦人。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/26/#L23">徒 26:23</a>)</p></blockquote><h2>顺带一说</h2><p>按伊斯兰教的教义，安拉不生育，也不被生育：「他不生育，也不被生育」（《古兰经》112:3）。</p>
