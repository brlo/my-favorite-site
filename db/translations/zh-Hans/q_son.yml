- src: Христос-Творец-мира
  path: Qs4A_基督——世界的创造者
  title: 基督——世界的创造者
  copy_cover: true
  body: <p>耶稣基督，上帝之子——世界的创造者：</p><blockquote><p>“<strong><mark>论到子</mark></strong>却说：『上帝啊，你的宝座是永永远远的，你的国权是正直的。 你喜爱公义，恨恶罪恶，所以上帝，就是你的上帝，用喜乐油膏你，胜过膏你的同伴。』 又说：『主啊，<strong><mark>你起初立了地的根基，天也是你手所造的</mark></strong>。 天地都要灭没，你却要长存；天地都要像衣服渐渐旧了， 你要将天地卷起来，像一件外衣，天地就都改变了。惟有你永不改变，你的年数没有穷尽。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/1/#L8-12">希 1:8-12</a>)</p></blockquote><blockquote><p>“他救了我们脱离黑暗的权势，把我们迁到他<strong><mark>爱子</mark></strong>的国里； 我们在爱子里得蒙救赎，罪过得以赦免。 爱子是那不能看见之上帝的像，是首生的，<strong>在一切被造的以先</strong>。 因为<strong><mark>万有都是靠他造的，无论是天上的、地上的、能看见的、不能看见的</mark></strong>、或是有位的、主治的、执政的、掌权的，<strong>一概都是借着他造的，又是为他造的</strong>。 他在万有之先，万有也靠他而立。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/1/#L13-17">西 1:13-17</a>)</p></blockquote><blockquote><p>“他在世界，<strong>世界也是借着他造的</strong>，世界却不认识他。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/1/#L10">约 1:10</a>)</p></blockquote><blockquote><p>“上帝既在古时借着众先知多次多方的晓谕列祖， 就在这末世，<strong>借着他儿子</strong>晓谕我们，又早已立他为承受万有的，也曾<strong>借着他创造诸世界</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/1/#L1-2">希 1:1-2</a>)</p></blockquote><blockquote><p>“我们因着信，就知道<strong>诸世界是藉上帝话造成的</strong>，这样，所看见的，并不是从显然之物造出来的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/11/#L3">希 11:3</a>)</p></blockquote>
  meta_desc: 耶稣基督就是创造世界和其中万物的那一位
