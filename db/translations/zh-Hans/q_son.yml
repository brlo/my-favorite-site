- src: Христос-безгрешен
  path: Qs7A_基督无罪
  title: 基督无罪
  copy_cover: true
  body: <blockquote><p>“上帝使那<strong>无罪的</strong>，替我们成为罪，好叫我们在他里面成为上帝的义。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/5/#L21">林后 5:21</a>)</p></blockquote><blockquote><p>“因我们的大祭司并非不能体恤我们的软弱，他也曾凡事受过试探，与我们一样；<strong>只是他没有犯罪</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/4/#L15">希 4:15</a>)</p></blockquote><blockquote><p>“像这样圣洁、<strong>无邪恶、无玷污、远离罪人</strong>、高过诸天的大祭司，原是与我们合宜的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/7/#L26">希 7:26</a>)</p></blockquote><blockquote><p>“何况基督借着永远的灵，将自己<strong>无瑕无疵</strong>献给上帝，他的血岂不更能洗净你们的心，除去你们的死行，使你们事奉那永生上帝吗？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/9/#L14">希 9:14</a>)</p></blockquote><blockquote><p>“你们知道主曾显现，是要除掉人的罪，<strong>在他并没有罪</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/3/#L5">约壹 3:5</a>)</p></blockquote><blockquote><p>“以后我不再和你们多说话，因为<strong>这世界的王</strong>将到，他<strong>在我里面是毫无所有</strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/14/#L30">约 14:30</a>)</p></blockquote><blockquote><p>“你们中间<strong>谁能指证我有罪呢</strong>？我既然将真理告诉你们，为什么不信我呢？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/8/#L46">约 8:46</a>)</p></blockquote><blockquote><p>“他虽然<strong>未行强暴，口中也没有诡诈</strong>，人还使他与恶人同埋；谁知死的时候与财主同葬。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/53/#L9">赛 53:9</a>)</p></blockquote>
