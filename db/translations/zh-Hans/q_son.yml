- src: отвержение-Христа-отвержение-Бога
  path: Qs6A_拒绝基督就是拒绝上帝
  title: 拒绝基督就是拒绝上帝
  copy_cover: true
  body: <blockquote><p>“又对门徒说：「听从你们的就是听从我；弃绝你们的就是弃绝我；<strong>弃绝我的就是弃绝那差我来的</strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/10/#L16">路 10:16</a>)</p></blockquote><blockquote><p>“<strong>恨我的，也恨我的父</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/15/#L23">约 15:23</a>)</p></blockquote><blockquote><p>“<strong>凡不认子的，就没有父</strong>；认子的，连父也有了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/2/#L23">约壹 2:23</a>)</p></blockquote><blockquote><p>“<strong>凡越过基督的教训不常守着的，就没有上帝</strong>；常守这教训的，就有父又有子。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2in/1/#L9">约贰 1:9</a>)</p></blockquote><blockquote><p>“信子的人有永生；<strong>不信子的人得不着永生</strong>，<strong>上帝的震怒常在他身上</strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/3/#L36">约 3:36</a>)</p></blockquote>
