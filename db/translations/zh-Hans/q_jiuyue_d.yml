  title: 酵
  copy_cover: true
  body: <h2>酵——影响一切的小东西</h2><p>新约圣经中酵的比喻，不是把它用作本身好或坏的东西，而是用来表明小小的一分可以影响其余的一切。放入面粉中的酵很少，但最终会使全团都发起来。</p><p>除了酵，主也常常用盐的比喻——盐同样影响其余的一切（防腐）：</p><blockquote><p>“<strong><mark>你们是世上的盐</mark></strong>。<strong><mark>盐若失了味</mark></strong>，怎能叫他再咸呢？以后无用，不过丢在外面，被人践踏了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L13">太 5:13</a>)</p></blockquote><blockquote><p>“<strong><mark>盐本是好的</mark></strong>，若失了味，可用什么叫他再咸呢？<strong><mark>你们里头应当有盐，彼此和睦</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/9/#L50">可 9:50</a>)</p></blockquote><p>同时，盐如同酵一样，也参与旧约的祭献：</p><blockquote><p>“<strong><mark>凡献为素祭的供物都要用盐调和</mark></strong>，在素祭上不可缺了你上帝立约的盐；<strong><mark>一切的供物都要配盐而献</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/2/#L13">利 2:13</a>)</p></blockquote><h2>酵的正面含义</h2><h3>酵——天国</h3><p>主耶稣基督把酵比作天国。又一次，小东西要影响一切：</p><blockquote><p>“他又对他们讲个比喻说：「<strong><mark>天国好像面酵</mark></strong>，有妇人拿来，藏在三斗面里，<strong><mark>直等全团都发起来</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/13/#L33">太 13:33</a>)</p></blockquote><blockquote><p>“又说：「<strong><mark>我拿什么来比上帝的国呢</mark></strong>？ <strong><mark>好比面酵</mark></strong>，有妇人拿来藏在三斗面里，<strong><mark>直等全团都发起来</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/13/#L20-21">路 13:20-21</a>)</p></blockquote><h2>酵的负面含义</h2><h3>酵——异端的教导</h3><p>主耶稣基督向使徒们指出法利赛人和撒都该人教导的危害。他用酵的比喻表明小东西可以影响一切：</p><blockquote><p>“耶稣对他们说：「<strong><mark>你们要谨慎，防备法利赛人和撒都该人的酵</mark></strong>。」 &lt;…&gt; 我对你们说：『要防备法利赛人和撒都该人的酵』，这话不是指着饼说的，你们怎么不明白呢？」 门徒这才晓得他说的，不是叫他们防备饼的酵，<strong><mark>乃是防备法利赛人和撒都该人的教训</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/16/#L6,11-12">太 16:6,11-12</a>)</p></blockquote><h3>酵——假冒为善</h3><p>另一次，基督在数千人面前再次用酵的比喻，指出法利赛人的特点——假冒为善的危害。又一次，假冒为善成了影响一切的小东西：</p><blockquote><p>“这时，有几万人聚集，甚至彼此践踏。耶稣开讲，先对门徒说：「<strong><mark>你们要防备法利赛人的酵，就是假冒为善</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/12/#L1">路 12:1</a>)</p></blockquote><h3>酵——团体中不悔改的淫乱之人</h3><p>使徒保罗用酵的比喻指摘哥林多团体中有不悔改的淫乱之人。淫乱之人是团体中的小部分，却可以影响整个团体：</p><blockquote><p>“<strong><mark>风闻在你们中间有淫乱的事</mark></strong>。这样的淫乱连外邦人中也没有，<strong><mark>就是有人收了他的继母</mark></strong>。 &lt;…&gt; 你们这自夸是不好的，<strong><mark>岂不知一点面酵能使全团发起来吗</mark></strong>？ 你们既是无酵的面，<strong><mark>应当把旧酵除净，好使你们成为新团</mark></strong>；因为我们逾越节的羔羊基督，已经被杀献祭了。 所以我们守这节不可用旧酵，<strong><mark>也不可用恶毒、邪恶的酵</mark></strong>，<strong><mark>只用诚实真正的无酵饼</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/5/#L1,6-8">林前 5:1,6-8</a>)</p></blockquote><p>使徒建议除净的不是酵本身，而是恶毒邪恶的酵：也就是把不悔改的淫乱之人赶出团体（<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/5/#L9,11">林前 5:9,11</a>）。这里使徒揭示的是旧约的含义，而不是在说饼：</p><blockquote><p>“你们既是无酵的面，<strong><mark>应当把旧酵除净，好使你们成为新团</mark></strong>；因为我们逾越节的羔羊基督，已经被杀献祭了。 所以我们守这节不可用旧酵，<strong><mark>也不可用恶毒、邪恶的酵</mark></strong>，<strong><mark>只用诚实真正的无酵饼</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/5/#L7-8">林前 5:7-8</a>)</p></blockquote><blockquote><p>“我对你们说：『要防备法利赛人和撒都该人的酵』，<strong><mark>这话不是指着饼说的</mark></strong>，你们怎么不明白呢？」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/16/#L11">太 16:11</a>)</p></blockquote><h3>酵——团体中引人走向犹太教的人</h3><p>使徒保罗用酵的比喻警告加拉太团体，他们中间有教导说为得救必须遵守摩西律法的人，这是危险的：</p><blockquote><p>“<strong><mark>你们这要靠律法称义的，是与基督隔绝，从恩典中坠落了</mark></strong>。 我们靠着圣灵，凭着信心，等候所盼望的义。 &lt;…&gt; <strong><mark>一点面酵能使全团都发起来</mark></strong>。 我在主里很信你们必不怀别样的心，<strong><mark>但搅扰你们的，无论是谁，必担当他的罪名</mark></strong>！ &lt;…&gt; <strong><mark>恨不得那搅乱你们的人，把自己割绝了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/5/#L4-5,9-10,12">加 5:4-5,9-10,12</a>)</p></blockquote>
