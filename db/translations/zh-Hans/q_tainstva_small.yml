  title: 婚配（婚姻）
  copy_cover: true
  body: <h2>定义</h2><p><strong>婚姻</strong>——教会七个圣奥秘之一，在其中求上帝祝福自愿的夫妻联合——它建立在夫妻彼此相爱之上，按基督和他的教会之属灵联合的样式。</p><h2>圣经引文</h2><p>在婚姻中举行上帝所行做的圣奥秘：</p><blockquote><p>“耶和华上帝说：「<strong><mark>那人独居不好</mark></strong>，我要为他造一个配偶帮助他。」 &lt;…&gt; <strong><mark>耶和华上帝就用那人身上所取的肋骨造成一个女人</mark></strong>，领她到那人跟前。 &lt;…&gt; 因此，<strong><mark>人要离开父母，与妻子连合，二人成为一体</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/2/#L18,22,24">创 2:18,22,24</a>)</p></blockquote><blockquote><p>“有法利赛人来问他说：「人休妻可以不可以？」意思要试探他。 耶稣回答说：「摩西吩咐你们的是什么？」 他们说：「摩西许人写了休书便可以休妻。」 耶稣说：「摩西因为你们的心硬，所以写这条例给你们。 但从起初创造的时候，上帝造人是造男造女。 因此，人要离开父母，与妻子连合，二人成为一体。 <strong><mark>既然如此，夫妻不再是两个人，乃是一体的了</mark></strong>。 所以<strong><mark>上帝配合的，人不可分开</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/10/#L2-9">可 10:2-9</a>)</p></blockquote><blockquote><p>“岂不知你们的身子是基督的肢体吗？我可以将基督的肢体作为娼妓的肢体吗？断乎不可！ 岂不知<strong><mark>与娼妓联合的，便是与她成为一体吗</mark></strong>？因为主说：『<strong><mark>二人要成为一体</mark></strong>。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/6/#L15-16">林前 6:15-16</a>)</p></blockquote><blockquote><p>“<strong><mark>丈夫也当照样爱妻子</mark></strong>，如同爱自己的身子，爱妻子便是爱自己了。 &lt;…&gt; 为这个缘故，人要离开父母，与妻子连合，二人成为一体。 <strong><mark>这是极大的奥祕</mark></strong>，<strong><mark>但我是指着基督和教会说的</mark></strong>。 然而你们各人都当爱妻子，如同爱自己一样；<strong><mark>妻子也当敬重他的丈夫</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/5/#L28,31-33">弗 5:28,31-33</a>)</p></blockquote><h2>一世纪教会婚姻祝福</h2><h3>圣伊格那提·怀上帝者（约37-107）</h3><p>“凡娶妻嫁人的，<strong>必须与主教的同意联合</strong>，好叫婚姻在主里面，而不是出于情欲”</p><p>（<a href="https://bibleox.com/ru/ru/w/ИгнАн_Пк">致波利卡普书</a> 第28节）</p>
