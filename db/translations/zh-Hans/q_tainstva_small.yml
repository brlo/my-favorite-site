  path: QT3A_告解（忏悔）
  title: 告解（忏悔）
  copy_cover: true
  body: <h2>旧约中的认罪</h2><p>在旧约的教会里，上帝亲自设立了在圣殿里、在司祭面前的告解，并藉司祭洁净罪：</p><blockquote><p>“他有了罪的时候，<strong><mark>就要承认所犯的罪</mark></strong>， 并要因所犯的罪，把他的赎愆祭牲，就是羊群中的母羊，或是一只羊羔，或是一只山羊，牵到耶和华面前为赎罪祭。至于他的罪，<strong><mark>祭司要为他赎了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/5/#L5-6">利 5:5-6</a>)</p></blockquote><blockquote><p>“遮掩自己罪过的，必不亨通；<strong><mark>承认离弃罪过的，必蒙怜恤</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/28/#L13">箴 28:13</a>)</p></blockquote><h2>新约中的认罪</h2><h3>司祭职有权赦罪</h3><p>上帝更换了司祭职（详见<a href="https://bibleox.com/ru/ru/w/Таинство-Священства">司祭圣奥秘</a>）：</p><blockquote><p>“<strong><mark>祭司的职任既已更改，律法也必须更改</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/7/#L12">希 7:12</a>)</p></blockquote><p>把赦罪之权赐给新的司祭职：</p><blockquote><p>“我要把天国的钥匙给你，凡你在地上所捆绑的，在天上也要捆绑；<strong><mark>凡你在地上所释放的，在天上也要释放</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/16/#L19">太 16:19</a>)</p></blockquote><blockquote><p>“我实在告诉你们：凡你们在地上所捆绑的，在天上也要捆绑；<strong><mark>凡你们在地上所释放的，在天上也要释放</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/18/#L18">太 18:18</a>)</p></blockquote><blockquote><p>“说了这话，就向他们吹一口气，说：「你们受圣灵。 <strong><mark>你们赦免谁的罪，谁的罪就赦免了</mark></strong>；<strong><mark>你们留下谁的罪，谁的罪就留下了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/20/#L22-23">约 20:22-23</a>)</p></blockquote><p>因司祭职的祈祷，罪得赦免：</p><blockquote><p>“你们中间有病了的呢，他就<strong><mark>该请教会的长老来</mark></strong>，他们可以奉主的名<strong><mark>用油抹他</mark></strong>，为他祷告。 出于信心的祈祷要救那病人，主必叫他起来；<strong><mark>他若犯了罪，也必蒙赦免</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/5/#L14-15">雅 5:14-15</a>)</p></blockquote><p>司祭职被立为教会的守护者：</p><blockquote><p>“保罗从米利都打发人往以弗所去，<strong><mark>请教会的长老来</mark></strong>。 他们来了，保罗就说：「你们知道，自从我到亚西亚的日子以来，在你们中间始终为人如何， &lt;…&gt; <strong><mark>圣灵立你们作全群的监督</mark></strong>，你们就当为自己谨慎，也为全群谨慎，<strong><mark>牧养上帝的教会</mark></strong>，就是他用自己血所买来的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/20/#L17-18,28">徒 20:17-18,28</a>)</p></blockquote><h3>告解在教会里得以保存</h3><p>在新旧约交界处，人们来到先知施洗约翰面前，也认自己的罪：</p><blockquote><p>“照这话，约翰来了，在旷野施洗，<strong><mark>传悔改的洗礼，使罪得赦</mark></strong>。 犹太全地和耶路撒冷的人都出去到约翰那里，<strong><mark>承认他们的罪</mark></strong>，在约但河里受他的洗。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/1/#L4-5">可 1:4-5</a>)</p></blockquote><p>告解在教会里得以保存：</p><blockquote><p>“那已经信的，多有人来<strong><mark>承认诉说自己所行的事</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/19/#L18">徒 19:18</a>)</p></blockquote><h3>信徒在得着真信仰之后，后来仍需要新的罪的赦免</h3><p>真信徒能使邻人从迷路上转回，并以此遮盖自己的许多罪：</p><blockquote><p>“我的弟兄们，你们中间若有失迷真道的，<strong><mark>有人使他回转</mark></strong>； 这人该知道<strong><mark>叫一个罪人从迷路上转回</mark></strong>，便是救一个灵魂不死，并且<strong><mark>遮盖许多的罪</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/5/#L19-20">雅 5:19-20</a>)</p></blockquote><blockquote><p>“你们中间有病了的呢，他就<strong><mark>该请教会的长老来</mark></strong>，他们可以奉主的名<strong><mark>用油抹他</mark></strong>，为他祷告。 出于信心的祈祷要救那病人，主必叫他起来；<strong><mark>他若犯了罪，也必蒙赦免</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/5/#L14-15">雅 5:14-15</a>)</p></blockquote><h2>主不拒绝悔改的人</h2><p>上帝总是预备接纳罪人的悔改，无论他犯了多重的罪</p><blockquote><p>“上帝所要的祭，就是忧伤的灵；上帝阿！<strong><mark>忧伤痛悔的心，你必不轻看</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/51/#L17">诗 51:17</a>)</p></blockquote><blockquote><p>“凡父所赐给我的人，必到我这里来；<strong><mark>到我这里来的，我总不丢弃他</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/6/#L37">约 6:37</a>)</p></blockquote>
