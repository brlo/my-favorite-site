  path: QT2A_病人傅油（终傅）
  title: 病人傅油（终傅）
  copy_cover: true
  body: <p><strong>病人傅油</strong>（终傅）——教会的圣奥秘，由司祭团（在极特殊情形下由一位司祭）在病人身上举行，在于藉祈祷和以圣油膏抹病人，呼求医治的、洁净的恩典，医治身体和心灵上的软弱。</p><p><strong>圣经引文：</strong></p><blockquote><p>“你们中间有病了的呢，他就<strong><mark>该请教会的长老来</mark></strong>，他们可以奉主的名<strong><mark>用油抹他</mark></strong>，为他祷告。 <strong><mark>出于信心的祈祷要救那病人</mark></strong>，主必叫他起来；<strong><mark>他若犯了罪，也必蒙赦免</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/5/#L14-15">雅 5:14-15</a>)</p></blockquote><blockquote><p>“门徒就出去传道，叫人悔改； 又赶出许多的鬼，<strong><mark>用油抹了许多病人，治好他们</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/6/#L12-13">可 6:12-13</a>)</p></blockquote><blockquote><p>“耶稣叫了十二个门徒来，<strong><mark>给他们权柄，能赶逐污鬼，并医治各样的病症</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/10/#L1">太 10:1</a>)</p></blockquote><blockquote><p>“<strong><mark>医治病人</mark></strong>，叫死人复活，叫长大痲疯的洁净，把鬼赶出去。<strong><mark>你们白白的得来，也要白白的舍去</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/10/#L8">太 10:8</a>)</p></blockquote>
