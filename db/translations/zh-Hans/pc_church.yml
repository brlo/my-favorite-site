  path: 正教会
  title: 正教会
  meta_desc: 什么是正教会：名称、结构、从五旬节至今的历史，以及大公会议。
  copy_cover: true
  body: <p><strong>正教会</strong>（希腊文 Ἡ Ὀρθόδοξη Ἐκκλησία，英文 Eastern Orthodox Church，日文 正教会）——从历史上和事实上说，正是主耶稣基督在约两千年前亲自聚集的那个教会。这个教会从未消失，一直不间断地存续到今天，正如基督所应许的（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/16/#L18">太 16:18</a>）。</p><ol><li><p>最简单的意义上，基督的教会是在地上生活的一切按正教方式信奉基督的人，以及已经迁往天上与基督同活之人的聚会；</p></li><li><p>更复杂却也更深刻、更确切地说，教会是一个神人的机体：他的头是基督，身体的肢体则是一切按正确方式信奉基督的人，由正教的<strong>信仰</strong>、<strong>圣奥秘</strong>和<strong>圣统制</strong>联合而成。</p></li></ol><h2>名称</h2><p>基督所建立的教会起初既不称为基督徒的，也不称为正教的。信友们稍后才被称为基督徒——同样在公元一世纪，在安提阿（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/11/#L26">徒 11:26</a>）。到二世纪，基督徒开始自称<a href="https://bibleox.com/ru/ru/w/%D0%BF%D0%BE%D1%87%D0%B5%D0%BC%D1%83-%D1%86%D0%B5%D1%80%D0%BA%D0%BE%D0%B2%D1%8C-%D0%BF%D1%80%D0%B0%D0%B2%D0%BE%D1%81%D0%BB%D0%B0%D0%B2%D0%BD%D0%B0%D1%8F" lang="ru">「正教的」</a>[1]，以区别于教会信仰与外来团体（诺斯底派等）的信仰。</p><h2>结构</h2><p>基督在耶路撒冷聚集了教会，在教会之上设立了使徒们，并差派他们去建立教会：宣讲福音、施洗。</p><p>使徒们在其他地方也聚集信友，同样把所教导的门徒留在信友之上作领袖（主教、司祭、辅祭）。在不同地方聚集的信友团体称为地方教会。大的信友团体由使徒们建立在安提阿、亚历山大里亚、罗马、科林托、得撒洛尼、斯米纳、厄弗所、劳狄刻亚以及许多其他城市。所有这些团体彼此关怀，具有看得见的合一，这合一表现为同一的信仰、圣奥秘和圣统制。</p><p>使徒们所立的主教们走得更远，继续在其余的地方聚集信友；他们教导、施洗，并像使徒们一样，为这些地方教会培养并设立领袖。</p><p>这样，教会逐渐成长，今天由以下地方教会组成。</p><h3>地方教会[3]</h3><ol><li><p><strong>阿尔巴尼亚正教会</strong>；</p></li><li><p><strong>亚历山大正教会</strong>；</p></li><li><p><strong>安提阿正教会</strong>；</p></li><li><p><strong>保加利亚正教会</strong>；</p></li><li><p><strong>格鲁吉亚正教会</strong>；</p></li><li><p><strong>耶路撒冷正教会</strong>；</p></li><li><p><strong>塞浦路斯正教会</strong>；</p></li><li><p><strong>君士坦丁堡正教会</strong>；</p></li><li><p><strong>马其顿正教会——奥赫里德总主教区</strong>；</p></li><li><p><strong>波兰正教会</strong>；</p></li><li><p><strong>美洲正教会</strong>；</p></li><li><p><strong>捷克和斯洛伐克正教会</strong>；</p></li><li><p><strong>俄罗斯正教会</strong>；</p></li><li><p><strong>罗马尼亚正教会</strong>；</p></li><li><p><strong>塞尔维亚正教会</strong>；</p></li><li><p><strong>希腊正教会</strong>。</p></li></ol><h3>自治教会</h3><ol><li><p><strong>中国自治正教会</strong>；</p></li><li><p><strong>芬兰自治正教会</strong>；</p></li><li><p><strong>日本自治正教会</strong>。</p></li></ol><h2>历史</h2><p>正教会建立于主降生后33年，即基督复活后的第五十天——所谓五旬节的那一天。那一天，圣灵降临到聚集在耶路撒冷一所房屋中的基督门徒（使徒们）身上。他们领受了向全世界宣讲福音所需的超性恩赐。不久，使徒们走向世界各地，建立教会团体，并在其中祝圣司祭（长老）。如此，正教会逐渐增长，到一世纪末已达罗马帝国全境的规模，并越出了帝国的疆界。</p><h2>一至四世纪——受迫害时期</h2><p>正教会处在犹太教成员严酷迫害的时期；随后，异教诸宗教的成员也加入迫害，还有当时尚属异教的罗马帝国的国家机器。</p><h2>四世纪——获得自由，神学</h2><p>公元313年，罗马帝国颁发了<a href="https://bibleox.com/ru/ru/w/%D0%9C%D0%B8%D0%BB%D0%B0%D0%BD%D1%81%D0%BA%D0%B8%D0%B9_%D1%8D%D0%B4%D0%B8%D0%BA%D1%82_%D0%BE_%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5_%D1%85%D1%80%D0%B8%D1%81%D1%82%D0%B8%D0%B0%D0%BD%D1%81%D0%BA%D0%BE%D0%B9_%D0%B2%D0%B5%D1%80%D1%8B_313%D0%B3" lang="ru">《米兰敕令》</a>，宣告对一切宗教——包括基督教——的宽容。迫害停止了。教会受迫害期间被夺去的建筑物归还给正教会。出现了众多著名的神学家，他们详细论述正教信仰，护卫并传扬它。</p><h2>四至八世纪——大公会议时期</h2><p>获得自由之后，正教会得以召集全体主教（资深司祭）的会议，以解决所出现的虚假教导方面的问题，保持教会和平与合一。这样的全教会主教会议获得了「大公会议」之名，是使徒们以会议方式解决尖锐问题的做法的延续（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/15/#L6-22">徒 15:6-22</a>），尽管在此之前也有过小型的地方会议。</p><p>一切大公会议，都是正教会对其一次所领受、并保存在她之内的信仰与真理遭受歪曲图谋的回应。例如，教会所领受的关于上帝的简明信仰是：上帝是唯一的；同时，父是上帝，子是上帝，圣灵是上帝；他们彼此相通；而其中只有一位（上帝之子）在时间中由童贞女马利亚诞生，为把人从罪和死亡中拯救出来，建立了自己的教会。教会以朴素之心接受并保存了这一信仰。但每当有人起来提出别的教导——时而否认圣子的神性尊严，时而否认圣灵的，时而把圣子与耶稣分开——教会就聚集起来，捍卫信仰与合一，指出其谬误。</p><p>教会在聚集并捍卫信仰时，不仅不得不指出错误的信仰，还不得不阐明正确的信仰，给出种种定义，作为抵御歪曲这一部分信仰之图谋的屏障。关于这一点，这一时代开端的圣主教如此写道：</p><p><strong>普瓦捷的希拉里，圣主教（约315-367）</strong></p><blockquote><p>“<strong><em>唯有</em>异端者的恶意迫使我们去做不被允许的事，攀登不可企及的高峰，谈论不可言传的对象，从事被禁止的探究。<mark>我们本应满足于以真诚的信仰去履行所受的训诲，即：敬拜父上帝，与他一同尊崇子上帝，并被圣灵充满。</mark>然而如今我们却不得不使用我们软弱的语言，去阐释那不可言传的奥秘。</strong><em>他人的谬误迫使我们亲自走上危险的路径，用人的语言去陈述那些本应以虔敬的信仰保存在我们灵魂深处的奥秘。</em>”</p></blockquote><p>（<a href="https://azbyka.ru/otechnik/Ilarij_Piktavijskij/o-troitse/" lang="ru">《论<u>至圣圣三</u>》2:2</a>）</p><p>在很大程度上，圣经本身（作为固定的圣经书目）之所以出现，就是教会为回应歪曲这一书目的图谋：</p><p><strong>德尔图良（约155-220）</strong></p><blockquote><p>“因为这<strong>异端（诺斯底主义——注）不承认圣经的某些（书卷）</strong>；即使承认某几卷，也不完整，而是按自己的意图加以增添和删减，加以歪曲”。</p></blockquote><p>（<a href="https://azbyka.ru/otechnik/Tertullian/o_prescript/" lang="ru">《驳斥异端的规诫》</a>）</p><p>大公会议的成果简述：</p><h3>第一次大公会议——第一次尼西亚会议，325年，318位主教</h3><ul><li><p><strong>谴责亚略</strong>。谴责亚略的异端；他教导说基督不是上帝，而是上帝所造的特殊受造物。</p></li><li><p><strong>信经</strong>。确立了信经的前七条。</p></li><li><p><strong>复活节庆祝的日期</strong>。在春分之后月圆之后的主日庆祝复活节。</p></li></ul><h3>第二次大公会议——第一次君士坦丁堡会议，381年，150位主教</h3><ul><li><p><strong>谴责马其顿尼。</strong>谴责马其顿尼的异端；他教导说圣灵不是上帝，而只是父与子的一种能力。</p></li><li><p><strong>信经完成</strong>。在信经中又增补了五条。</p></li></ul><h3>第三次大公会议——以弗所会议，431年，160位主教</h3><ul><li><p><strong>谴责聂斯托利</strong>。谴责聂斯托利的异端；他教导说基督是普通人，在他出生之后，上帝像进到圣殿里一样进入了他的身体。</p></li><li><p><strong>定义</strong>。基督是真上帝，也是真人。童贞女马利亚是上帝之母。</p></li><li><p><strong>禁止更改信经</strong>。</p></li></ul><h3>第四次大公会议——加采东会议，451年，520位主教</h3><ul><li><p><strong>谴责基督一性论</strong>。谴责欧提奇的异端；他教导说基督的人性完全被神性吞没，在他之内只剩下神性，没有人性。</p></li><li><p><strong>定义</strong>。在上帝之子的一位格中，结合了两个性体（神性的与人性的）：<strong>不混也不变，不分也不离</strong>。两个性体并未融合为一个；结合之后没有任何一个性体发生改变；结合不分不离，直到永远。</p></li></ul><h3>第五次大公会议——第二次君士坦丁堡会议，553年，165位主教</h3><ul><li><p><strong>谴责奥利金。</strong>谴责了奥利金及其关于地狱之刑有尽、最终万人皆得救的错误教导[2]。</p></li><li><p><strong>谴责著作</strong>：</p><ul><li><p>摩普绥提亚的狄奥多罗的著作（他本人也作为聂斯托利的老师受到谴责）；</p></li><li><p>埃德萨的伊巴的著作（被疑有聂斯托利主义倾向）；</p></li><li><p>库鲁斯的狄奥多勒的著作（因批评亚历山大里亚的圣济利禄的教导）。</p></li></ul></li></ul><h3>第六次大公会议——第三次君士坦丁堡会议，680年，170位主教</h3><ul><li><p><strong>谴责基督一志论</strong>。谴责了教导基督内只有一个意志（只有神性意志）的异端。</p></li><li><p><strong>定义</strong>。在基督内，作为上帝，有神性的意志；作为人，也有人性的意志。人的意志顺服于神的意志。</p></li></ul><h3>第七次大公会议——第二次尼西亚会议，787年，219位主教与131位修士</h3><ul><li><p><strong>谴责圣像破坏运动</strong>。谴责了把教会圣像当作偶像、既不允许描绘基督和圣人、也不允许敬礼这些像的异端。</p></li></ul><h2>十至十一世纪——罗马地方教会的背离</h2><p>在这一时期，罗马的正教主教们更改了信仰的教导，引入新花样，并要求其余所有教会承认它们。</p><p>罗马教会的主要谬误之一，是关于圣灵不仅由父发出、也由子发出的教导（和子句，filioque）。这既与基督在福音书中的直接话语相矛盾（<a href="https://bibleox.com/ru/ru/w/f18sRKqQ_%D0%92%D0%BE%D0%B7%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D1%8F_%D0%BF%D1%80%D0%BE%D1%82%D0%B8%D0%B2_%D1%84%D0%B8%D0%BB%D0%B8%D0%BE%D0%BA%D0%B2%D0%B5" lang="ru">详见</a>），也与圣教父们相悖。这一教导在罗马教会自己的历史中就曾受到她自己的谴责。但从这一点开始，罗马又更改了关于教会的教导，把罗马主教立为全世界整个教会的元首——这是从未有过的事。在此基础上，天主教又增添了关于童贞女马利亚无染原罪、关于炼狱、关于功绩宝库（以及由之而来的大赦）和罗马主教以教会训导权威（ex cathedra）所讲的一切不可错的教导。教会在一千年间从未知道、从未宣认过这一切。这一切都是新花样、歪曲、异端。</p><p>其余所有的正教会（耶路撒冷、安提阿、亚历山大、君士坦丁堡、格鲁吉亚教会）都拒绝了这个新花样。</p><p>安提阿教会曾试图通过对话劝说罗马教会放弃这些新花样（<a href="https://bibleox.com/ru/ru/w/VuAM_%D0%9A%D0%BE%D0%BD%D1%82%D0%B5%D0%BA%D1%81%D1%82_%D1%81%D0%BE%D0%B1%D1%8B%D1%82%D0%B8%D0%B9_1054_%D0%B3%D0%BE%D0%B4%D0%B0" lang="ru">详见</a>），但最终，在随后的几个世纪里，分裂彻底定型。其最终阶段是天主教第四次十字军东征对正教拜占庭帝国首都——君士坦丁堡——的进攻。这次进攻的性质也起了决定性作用。所有天主教的十字军东征都是由罗马主教倡议，为把耶路撒冷和圣地从穆斯林征服者手中解放出来。然而，第四次东征的组织者们，本已与正教的君士坦丁堡达成借道其领土的惯常协议，却突然把目标从耶路撒冷改向君士坦丁堡本身。他们背信弃义地进攻，攻陷城池，残杀居民，劫掠圣物，在城市的废墟上建立拉丁帝国——而根本不去耶路撒冷。</p><p>就这样，罗马教会最终从大公正教会中背离了出去。</p><p>正教会依居民语言的不同而有不同的称呼。说希腊话的居民称教会为正教的（希腊文 ορθοδόξω）或大公的（希腊文 καθολικός），但更常称正教的。说拉丁话的居民也称教会为正教的（拉丁文 ortodox）和大公的（拉丁文 catholic），但更常称大公的。希腊词“καθολικός”在希腊语中发音近于 katholikos（带有音素 [θ]）；但在借入拉丁语之后，转而发为 catholic（[k] 音）——由此出现了「天主教」的称呼。</p><p>在脱离正教教会大家庭之后，罗马教会越来越只以「大公的」（天主教）之名为人所知，最终接受了「罗马天主教教会」或简称「天主教教会」的名称。</p><h2>十一至二十一世纪</h2><p>正教会逐渐增长，出现了新的地方教会（塞尔维亚、波兰等[3]）。在论战中，教会主要面对的是抵御罗马天主教教会扩张的挑战，以及近几个世纪诞生于西方、在与罗马天主教（天主教）的对抗中形成的新教团体的挑战。</p><p>歪曲教会信仰的图谋从未停止。新教的产生主要是对教会教导的歪曲，而今天的新教团体中包含着过去各种各样的异端，以不同的次序加以组合。总的来说，过去几个世纪一切谬误——直至异教谬误——的回潮，是正教会今日所面对的挑战。</p>
  references: <p>翻译：罗季翁·弗拉索夫（借助人工智能工具）。</p><ol><li><p><a href="https://bibleox.com/ru/ru/w/%D0%BF%D0%BE%D1%87%D0%B5%D0%BC%D1%83-%D1%86%D0%B5%D1%80%D0%BA%D0%BE%D0%B2%D1%8C-%D0%BF%D1%80%D0%B0%D0%B2%D0%BE%D1%81%D0%BB%D0%B0%D0%B2%D0%BD%D0%B0%D1%8F" lang="ru">教会为何称为「正教的」（俄语）</a></p></li><li><p><a href="https://azbyka.ru/otechnik/Georgij_Maksimov/pjatyj-vselenskij-sobor-i-osuzhdenie-origenizma/" lang="ru">第五次大公会议与对奥利金主义的谴责（俄语）</a></p></li><li><p><a href="http://www.patriarchia.ru/db/organizations/30909/" lang="ru">地方教会与自治教会（俄语）</a></p></li></ol><h2>延伸阅读：</h2><ol><li><p>基督的教会何时开始称为「正教的」：<a href="https://bibleox.com/ru/ru/w/%D0%BF%D0%BE%D1%87%D0%B5%D0%BC%D1%83-%D1%86%D0%B5%D1%80%D0%BA%D0%BE%D0%B2%D1%8C-%D0%BF%D1%80%D0%B0%D0%B2%D0%BE%D1%81%D0%BB%D0%B0%D0%B2%D0%BD%D0%B0%D1%8F" lang="ru">（俄语）</a></p></li><li><p>会议简介：<a href="https://pravoslavie.ru/104647.html" lang="ru">pravoslavie.ru</a></p></li><li><p>地方教会与自治教会：<a href="http://www.patriarchia.ru/db/organizations/30909/" lang="ru">patriarchia.ru</a></p></li></ol>
