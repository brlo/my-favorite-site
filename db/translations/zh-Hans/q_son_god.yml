- src: Христос-Бог
  path: Qs15A_基督是上帝
  title: 基督是上帝
  copy_cover: true
  body: <h2>题词</h2><blockquote><p>“「我的民哪！你们当听我的话；以色列啊！我要劝戒你：<strong>我是上帝，是你的上帝</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/50/#L7">诗 50:7</a>)</p></blockquote><h2>使徒在众人面前称基督为上帝，基督认可了他的信仰（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/20/#L28-29">约 20:28-29</a>）</h2><p>这是最无可争辩的一段。这里具备一切必要的条件，使人确信使徒是把他当作真上帝来信的：在场没有一个使徒反驳他，连基督自己也认可了这信仰。这里的「θεὸς」（上帝）一词甚至带有冠词「ὁ」——这就排除了反对方的一切异议。这节经文让人看到，基督所被称为的，正是最高意义上的那同一位上帝：</p><blockquote><p>“多马说：「<strong>我的主！我的上帝！</strong>」 耶稣对他说：「<strong>你因看见了我才信</strong>，那没有看见就信的有福了。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/20/#L28-29">约 20:28-29</a>)</p></blockquote><blockquote><p>“Ὁ κύριός μου καὶ ὁ θεός μου. λέγει αὐτῷ ὁ Ἰησοῦς, Ὅτι ἑώρακάς με πεπίστευκας; μακάριοι οἱ μὴ ἰδόντες καὶ πιστεύσαντες” (<a href="https://bibleox.com/zh-Hans/gr-lxx-byz/in/20/#L28-29">约 20:28-29</a>, 译自希腊文)</p></blockquote><p>对此，基督神性教导的反对者只会用一句缺乏说服力的话来搪塞，说：「使徒不过是太激动，因惊讶而喊叫」。但这与经文相矛盾，因为经文直说，多马是对着基督本人说的：「<strong>对他说</strong>」，也就是说，「我的主！我的上帝！」这句话按文本正是对基督的称呼。</p><p>使徒这样称呼基督，没有一个人纠正他，而基督自己也认可了他的信仰，说：「你因看见了我才信」。显然，他所信的是基督的复活；但得了这信仰，他随即表明他所信的是什么：信基督是上帝。这里满足批评者的一切语法要求：话是使徒说的，是在基督与众使徒面前说的，无人反对，基督还加以认可。如果这都不能说服不信的人，那还有什么能说服他们呢？</p><h2>基督是在万有之上、永远可称颂的上帝（<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/9/#L3-5">罗 9:3-5</a>）</h2><p>使徒在最高意义上称基督为上帝：</p><blockquote><p>“为我弟兄、我骨肉之亲，就是自己被咒诅，与<strong>基督</strong>分离，我也愿意。 他们是以色列人，那儿子的名分、荣耀、诸约、律法、礼仪、应许，都是他们的。 列祖就是他们的祖宗，按肉体说，基督也是从他们出来的，他是<strong>在万有之上，永远可称颂的上帝</strong>。阿们！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/9/#L3-5">罗 9:3-5</a>)</p></blockquote><blockquote><p>“ὁ Χριστὸς τὸ κατὰ σάρκα· ὁ ὢν ἐπὶ πάντων θεὸς εὐλογητὸς εἰς τοὺς αἰῶνας, ἀμήν” (<a href="https://bibleox.com/zh-Hans/gr-lxx-byz/rim/9/#L5">罗 9:5</a>, 译自希腊文)</p></blockquote><p>基督神性教导的反对者会反驳说，这里「θεὸς」（上帝）一词缺少冠词，所以基督在这里似乎不是在最高意义上被称为上帝（仿佛这不是他自己的属性），或者说「上帝」一词根本不属于基督。</p><p>对此有不同见解。有理由认为，冠在这一切描述同一位人物的定语之前的共同指涉冠词已经足够：「ὁ ὢν ἐπὶ πάντων θεὸς」（在万有之上、永远可称颂的上帝）。何况「上帝」一词带冠词而属于基督的例子，我们一开始已经举过（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/20/#L28-29">约 20:28-29</a>）。如果这里缺少冠词，那么那里还缺少什么，才能叫人相信呢？</p><h2>基督是真上帝（<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/5/#L20">约壹 5:20</a>）</h2><blockquote><p>“我们也知道上帝的儿子已经来到，且将智慧赐给我们，使我们认识那位真实的，我们也在那位真实的里面，就是在他儿子<strong>耶稣基督里面。这是真神</strong>，也是永生。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/5/#L20">约壹 5:20</a>)</p></blockquote><blockquote><p>“καὶ ἐσμὲν ἐν τῷ ἀληθινῷ, ἐν τῷ υἱῷ αὐτοῦ Ἰησοῦ Χριστῷ. οὗτός ἐστιν ὁ ἀληθινὸς θεὸς καὶ ζωὴ αἰώνιος” (<a href="https://bibleox.com/zh-Hans/gr-lxx-byz/1in/5/#L20">约壹 5:20</a>, 译自希腊文)</p></blockquote><p>使徒约翰写「这是」（οὗτός ἐστιν）的时候，这个代词所指的是紧接在前面一句中的「耶稣基督」（Ἰησοῦ Χριστῷ）之名。这是最近的先行词。「θεὸς」前的冠词「ὁ」强调，这是刚刚所谈论之人的确定的属性，即耶稣基督的属性。语法上和逻辑上，这里说的是：「这位【耶稣基督】是真上帝，是永生。」</p><h2>上帝用自己的血买来了教会（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/20/#L28">徒 20:28</a>）</h2><p>这节经文指明基督的神性，因为这里被称为上帝的，正是用自己的血买来教会的那一位。神性没有血；血只有成了肉身的儿子才有。这里被称为上帝、用自己的血买来教会的，正是儿子：</p><blockquote><p>“圣灵立你们作全群的监督，你们就当为自己谨慎，也为全群谨慎，牧养<strong>上帝的教会</strong>，就是他<strong>用自己血所买来的</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/20/#L28">徒 20:28</a>)</p></blockquote><blockquote><p>“ποιμαίνειν τὴν ἐκκλησίαν τοῦ θεοῦ, ἣν περιεποιήσατο διὰ τοῦ αἵματος τοῦ ἰδίου” (<a href="https://bibleox.com/zh-Hans/gr-lxx-byz/act/20/#L28">徒 20:28</a>, 译自希腊文)</p></blockquote><h2>从前无人看见的上帝，在肉身显现，将自己表明出来（<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/3/#L15-16">提前 3:15-16</a>）</h2><p>「上帝在肉身显现」这句话是俄文公会译本如此译的，但希腊文原文这里没有「上帝」一词，代替它的是一个代词「那一位」。然而这个代词指的是上帝，因为紧接着前面说的是上帝：「在上帝的家中当怎样行；这家就是永生上帝的教会」。随后又清楚表明，在这里被称为上帝的正是耶稣基督：因为不是父，而是儿子——即耶稣基督——「在肉身显现」，从而「被天使看见」（父作为上帝仍然不能看见），儿子也在荣耀里被接升天：</p><blockquote><p>“倘若我耽延日久，你也可以知道<strong>在上帝的家中</strong>当怎样行；这家就是<strong>永生上帝的教会</strong>，真理的柱石和根基。 大哉，敬虔的奥祕！无人不以为然，就是<strong>上帝在肉身显现</strong>，被圣灵称义，<strong>被天使看见</strong>，被传于外邦，被世人信服，<strong>被接在荣耀里</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/3/#L15-16">提前 3:15-16</a>)</p></blockquote><blockquote><p>“Ὃς ἐφανερώθη ἐν σαρκί, ἐδικαιώθη ἐν πνεύματι, ὤφθη ἀγγέλοις, ἐκηρύχθη ἐν ἔθνεσιν, ἐπιστεύθη ἐν κόσμῳ, ἀνηλήμφθη ἐν δόξῃ” (<a href="https://bibleox.com/zh-Hans/gr-lxx-byz/1tim/3/#L16">提前 3:16</a>, 译自希腊文)</p></blockquote><h2>上帝与主耶稣基督（<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/4/#L1">提后 4:1</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/2pet/1/#L1">彼后 1:1</a>）</h2><p>在这节经文里，耶稣被称为上帝，又被称为基督（「基督」一词译自希腊文，意为「受膏者」，这是对世人所等候的救主的称号，<a href="https://bibleox.com/zh-Hans/cn-cuv/act/2/#L36">徒 2:36</a>）。俄文公会译本作：「在上帝和我们的主耶稣基督面前」，但希腊文写法略有不同，直译是：「在上帝和基督耶稣面前」（τοῦ θεοῦ καὶ Χριστοῦ Ἰησοῦ）。</p><p>有人会反驳说，这里说的是两位：上帝，以及耶稣基督。这种反驳不能成立，因为两个词共用一个冠词「τοῦ」（属格的指涉冠词），也就是说，两个词都指同一个被描述的人物——耶稣。此外，下文的「τοῦ μέλλοντος」（将要审判的）是单数，这进一步表明前文所说的是一个人物：</p><blockquote><p>“我在<strong>上帝面前，并在将来审判活人死人的基督耶稣面前</strong>，凭着他的显现和他的国度嘱咐你：” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/4/#L1">提后 4:1</a>)</p></blockquote><blockquote><p>“Διαμαρτύρομαι ἐνώπιον τοῦ θεοῦ καὶ Χριστοῦ Ἰησοῦ, τοῦ μέλλοντος κρίνειν ζῶντας καὶ νεκρούς” (<a href="https://bibleox.com/zh-Hans/gr-lxx-byz/2tim/4/#L1">提后 4:1</a>, 译自希腊文)</p></blockquote><p>下面是一个使用同一共同冠词的类似语法结构：</p><blockquote><p>“愿颂赞归与我们主耶稣基督的<strong>父上帝</strong>。他曾照自己的大怜悯，藉耶稣基督从死里复活，重生了我们，叫我们有活泼的盼望，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/1/#L3">彼前 1:3</a>)</p></blockquote><blockquote><p>“Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ” (<a href="https://bibleox.com/zh-Hans/gr-lxx-byz/1pet/1/#L3">彼前 1:3</a>, 译自希腊文)</p></blockquote><p>这里「上帝与父」两个词共用一个冠词「ὁ」（主格的指涉冠词），因此两个词描述的是同一位，而不是两位。</p><p>以下这处称基督为上帝的结构，也服从同一条规则：</p><blockquote><p>“作耶稣基督仆人和使徒的西门彼得，写信给那因我们的<strong>上帝和救主耶稣基督</strong>之义，与我们同得一样宝贵信心的人：” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2pet/1/#L1">彼后 1:1</a>)</p></blockquote><blockquote><p>“ἐν δικαιοσύνῃ τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ” (<a href="https://bibleox.com/zh-Hans/gr-lxx-byz/2pet/1/#L1">彼后 1:1</a>, 译自希腊文)</p></blockquote><h2>福音书作者路加称基督为上帝（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/8/#L39">路 8:39</a>）</h2><p>来看福音书作者路加所记的一节。引文的前半是耶稣基督的话，后半是叙述者——福音书作者路加——自己的话。基督吩咐痊愈的人去传讲上帝为他所作的事，而福音书作者路加记下，痊愈的人传扬的是耶稣为他所作的事。也就是说，在福音书作者路加的理解中，耶稣与上帝在这里是一回事：</p><blockquote><p>“说：「你回家去，传说<strong>上帝为你作了何等大的事</strong>。」他就去，满城里传扬<strong>耶稣为他作了何等大的事</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/8/#L39">路 8:39</a>)</p></blockquote><blockquote><p>“διηγοῦ ὅσα σοι ἐποίησεν ὁ θεός … κηρύσσων ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς” (<a href="https://bibleox.com/zh-Hans/gr-lxx-byz/lk/8/#L39">路 8:39</a>, 译自希腊文)</p></blockquote><p>如果基督神性的反对者反驳说，福音书作者只是描述了痊愈者的行为，说耶稣吩咐他传讲上帝所作的事，而痊愈者误解了，没有传讲上帝所作的事，反倒传讲耶稣所作的事——那么要明白：反对基督神性的人也认为福音书作者路加是否认基督神性的，仿佛路加也不认为基督是上帝。那样的话，福音书作者必定会以某种方式指出痊愈者的错误——他做的完全不是耶稣吩咐他做的事。这至少会表现为用「但是」「然而」之类的转折词：「耶稣说，要回去传讲上帝所作的事，<strong>但是</strong>他却去传扬耶稣所作的事」；更有可能的是，他会直说痊愈者误把耶稣当作上帝，所以传讲的不是上帝，而是耶稣。这不是小事，而是信仰的根基。</p><p>但福音书作者没有作任何对比。他使用的是同一结构的重复：「上帝为你作了……耶稣为他作了……」。这是福音书作者相信基督神性的有力明证。</p><h2>一切的丰盛都有形有体地居住在基督里面（<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/2/#L6,9">西 2:6,9</a>）</h2><p>这节经文显然可以有不同解释，但作为其余引文的补充，值得注意：</p><blockquote><p>“你们既然接受了主基督耶稣，就当遵他而行； &lt;…&gt; 因为上帝本性<strong>一切的丰盛，都有形有体</strong>的居住在基督里面，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/2/#L6,9">西 2:6,9</a>)</p></blockquote><blockquote><p>“ἐν αὐτῷ κατοικεῖ πᾶν τὸ πλήρωμα τῆς θεότητος σωματικῶς” (<a href="https://bibleox.com/zh-Hans/gr-lxx-byz/kol/2/#L9">西 2:9</a>, 译自希腊文)</p></blockquote><h2>使徒向人们传讲基督是上帝（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/17/#L3,23">徒 17:3,23</a>）</h2><blockquote><p>“讲解陈明基督必须受害，从死里复活；又说：「<strong><mark>我所传与你们的这位耶稣，就是基督</mark></strong>。」 &lt;…&gt; 我游行的时候，观看你们所敬拜的，遇见一座坛，上面写着『<strong>未识之神</strong>』；你们所不认识而敬拜的，<strong><mark>我现在告诉你们</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/17/#L3,23">徒 17:3,23</a>)</p></blockquote><h2>上帝道成肉身（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/1/#L1-18">约 1:1-18</a>）</h2><p>使徒约翰称道为上帝，随后指出道成了肉身。施洗约翰所指向的正是这道成了肉身的道，而他指的是耶稣基督：</p><blockquote><p>“太初有道，道与上帝同在，<strong>道就是上帝</strong>。 这道太初与上帝同在。 万物是借着他造的；凡被造的，没有一样不是借着他造的。 生命在他里头，这生命就是人的光。 光照在黑暗里，黑暗却不接受光。 有一个人是从上帝那里差来的，名叫约翰。 这人来，为要作见证；就是为光作见证，叫众人因他可以信。 他不是那光，乃是要为光作见证。 那光是真光，照亮一切生在世上的人。 他在世界，世界也是借着他造的，世界却不认识他。 他到自己的地方来，自己的人倒不接待他。 凡接待他的，就是信他名的人，他就赐他们权柄，作上帝的儿女。 这等人不是从血气生的，不是从情欲生的，也不是从人意生的，乃是从上帝生的。 <strong>道成了肉身</strong>，住在我们中间，充充满满的有恩典有真理。我们也见过他的荣光，正是父独生子的荣光。 约翰为他作见证，喊着说：「这就是我曾说：『那在我以后来的反成了在我以前的；因他本来在我以前。』」 从他丰满的恩典里，我们都领受了，而且恩上加恩。 律法本是借着摩西传的；恩典和真理都是由耶稣基督来的。 从来没有人看见上帝，只有在父怀里的独生子将他表明出来。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/1/#L1-18">约 1:1-18</a>)</p></blockquote><p>使徒在这里称基督不仅是父的儿子，而是独生子，意思是：再没有谁像基督那样是父的儿子。他不是长子（最先出生的），而是独生子（独一的儿子）。没有别的儿子。</p><p>基督神性教导的反对者会反驳说，在另外两处，基督也被称为长子：</p><blockquote><p>“因为他预先所知道的人，就预先定下效法他儿子的模样，使他儿子<strong>在许多弟兄中作长子</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/8/#L29">罗 8:29</a>)</p></blockquote><blockquote><p>“再者，上帝使<strong>长子</strong>到世上来的时候，就说：『上帝的使者都要拜他。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/1/#L6">希 1:6</a>)</p></blockquote><p>对此应当说：他被称为长子，是因为他首先从死里复活：他的复活不是复活之后又要死（先知们从前的复活是那样），而是以胜过死亡的改变形象的复活（<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/6/#L9">罗 6:9</a>），要活到永远，并在荣耀里升天，要作王直到永远——在他以前没有人这样复活过。他首先这样复活，也就是成为长子，或者说从死里的首生者：</p><blockquote><p>“他也是教会全体之首，他是元始，是<strong>从死里首先复生的</strong>，使他可以在凡事上居首位。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/1/#L18">西 1:18</a>)</p></blockquote><blockquote><p>“并那诚实作见证的、<strong>从死里首先复活</strong>、为世上君王元首的耶稣基督，有恩惠、平安归与你们！他爱我们，用自己的血使我们脱离罪恶，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/1/#L5">启 1:5</a>)</p></blockquote><blockquote><p>“就是基督必须受害，并且<strong>因从死里复活</strong>，要首先把光明的道传给百姓和外邦人。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/26/#L23">徒 26:23</a>)</p></blockquote><p>其余引文：<a href="https://bibleox.com/ru/ru/w/Христос-Единородный-Сын-Божий">基督是上帝的独生子</a></p><h2>诗篇论及上帝的话，是论及子说的（<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/1/#L8-12">希 1:8-12</a>）</h2><p>使徒保罗把先知的诗篇用在基督身上。他说，那些话是论及子说的：</p><ol><li><p>子是上帝。</p></li><li><p>子立了地的根基，造了天。</p></li><li><p>子——上帝——受了上帝的膏（希腊文 Χριστός 意为「受膏者」）。</p></li></ol><blockquote><p>“<strong><mark>论到子</mark></strong>却说：『<strong>上帝啊，你的宝座是永永远远的</strong>，你的国权是正直的。 你喜爱公义，恨恶罪恶，所以<strong>上帝，就是你的上帝，用喜乐油膏你</strong>，胜过膏你的同伴。』 又说：『主啊，<strong><mark>你起初立了地的根基，天也是你手所造的</mark></strong>。 天地都要灭没，你却要长存；天地都要像衣服渐渐旧了， 你要将天地卷起来，像一件外衣，天地就都改变了。惟有你永不改变，你的年数没有穷尽。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/1/#L8-12">希 1:8-12</a>)</p></blockquote><p>基督神性教导的反对者会反驳说，这里称上帝用的只是犹太人通用的词 Elohim，这个词既用于真上帝，也用于假神。他们将期待上帝被冠以四字圣名——四个希伯来字母 <strong>יְהוָֽה（YHWH，音「雅威」）</strong>。而使徒所引的诗篇（<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/102/#L25-27">诗 102:25-27</a>）恰好满足他们的要求。整篇诗——是向<strong>上帝（יְהוָֽה，YHWH）</strong>的祷告，他在 <a href="https://bibleox.com/zh-Hans/cn-cuv/ps/102/#L20">诗 102:20</a> 和 <a href="https://bibleox.com/zh-Hans/cn-cuv/ps/102/#L23">诗 102:23</a> 被称为 <strong>יְהוָֽה</strong>。诗篇的标题是：「困苦人的祷告，他消沉地在<strong>耶和华（יְהוָֽה，YHWH）</strong>面前倾吐苦情」。也就是说，整篇诗——包括使徒所引用的诗句——都是向上帝的祷告，而上帝在其中的称呼正如他们所期待的——耶和华。使徒却说，这是论子说的，也就是说，耶和华——就是子，耶稣基督。</p><h2>上帝是救主，耶稣基督也是救主（<a href="https://bibleox.com/zh-Hans/cn-cuv/tit/1/#L3-4">多 1:3-4</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/tit/2/#L13">多 2:13</a>）</h2><blockquote><p>“到了日期，借着传扬的工夫，把他的道显明了；这传扬的责任是按着<strong>上帝我们救主</strong>的命令交托了我。 现在写信给提多，就是照着我们共信之道作我真儿子的：愿恩惠、平安从父上帝和<strong>我们的救主基督耶稣</strong>归与你！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/tit/1/#L3-4">多 1:3-4</a>)</p></blockquote><blockquote><p>“等候所盼望的福，并等候<strong>至大的上帝和我们救主耶稣基督</strong>的荣耀显现。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/tit/2/#L13">多 2:13</a>)</p></blockquote><h2>耶稣就是旧约里的那同一位上帝（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/23/#L34">太 23:34</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/ier/7/#L21,25">耶 7:21,25</a>）</h2><p>当人向基督神性的反对者指出，使徒们直呼基督为上帝时，他们反驳说：「仅被称为上帝还不够」——瞧，先知摩西也曾被称为神：</p><blockquote><p>“耶和华对摩西说：「<strong>我使你在法老面前代替上帝</strong>，你的哥哥亚伦是替你说话的。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/7/#L1">出 7:1</a>)</p></blockquote><blockquote><p>“Ἰδοὺ δέδωκά σε θεὸν Φαραω, καὶ Ααρων ὁ ἀδελφός σου ἔσται σου προφήτης” (<a href="https://bibleox.com/zh-Hans/gr-lxx-byz/ish/7/#L1">出 7:1</a>, 译自希腊文)</p></blockquote><p>首先，这里没有满足批评者自己先前提出的要求：上帝一词要带冠词。这里没有冠词。而且从文本可以清楚看到，先知摩西得到的只是相对于法老的一种授予的职能。这里没有任何地方表明摩西按本性就是神，拥有神性作为自己固有的恒常属性。此外，批评者对我们的论证所要求的第二条，在这里也没有满足：希伯来文原文中用的也是通用的「אֱלֹהִ֖ים」（Elohim），而不是四字圣名 YHWH，也就是说，这里说的不是最高意义上的真上帝。</p><p>其次，可以完全确信：耶稣基督就是那位真上帝——创造者、耶和华、祖宗的上帝（亚伯拉罕、以撒、雅各的上帝）。例如，基督自己说他曾向以色列差遣先知，而旧约说，向以色列差遣众先知的是上帝耶和华。由此也直接可见：基督就是道成肉身的上帝耶和华。后面还有别的例子。</p><h3>只有上帝差遣先知，而差遣先知的是基督</h3><p>基督自己说，他就是那位向以色列差遣先知的：</p><blockquote><p>“所以<strong>我差遣先知</strong>和智慧人并文士到你们这里来，有的你们要杀害，要钉十字架；有的你们要在会堂里鞭打，从这城追逼到那城。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/23/#L34">太 23:34</a>)</p></blockquote><p>上帝亲自（不借中间人）向先知说话，并差遣他们：</p><blockquote><p>“万军之耶和华以色列的上帝如此说：你们将燔祭加在平安祭上，吃肉吧！ &lt;…&gt; 自从你们列祖出埃及地的那日，直到今日，<strong>我差遣我的仆人众先知到你们那里去</strong>，每日从早起来差遣他们。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ier/7/#L21,25">耶 7:21,25</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/ier/35/#L15">耶 35:15</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/ier/44/#L4">耶 44:4</a>)</p></blockquote><blockquote><p>“上帝说：「我必与你同在。你将百姓从埃及领出来之后，你们必在这山上事奉我，<strong>这就是我打发你去的证据</strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/3/#L12">出 3:12</a>)</p></blockquote><blockquote><p>“万军之耶和华说：「那日临近，势如烧着的火炉，凡狂傲的和行恶的必如碎秸，在那日必被烧尽，根本枝条一无存留。 &lt;…&gt; 看哪！耶和华大而可畏之日未到以前，<strong>我必差遣先知以利亚到你们那里去</strong>！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mal/4/#L1,5">玛 4:1,5</a>)</p></blockquote><blockquote><p>“<strong>耶和华就差遣先知</strong>到以色列人那里，对他们说：「耶和华以色列的上帝，如此说：『我曾领你们从埃及上来，出了为奴之家。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/sud/6/#L8">士 6:8</a>)</p></blockquote><blockquote><p>“因此，耶和华的怒气向亚玛谢发作，就<strong>差一个先知</strong>去见他说：「这些神不能救他的民脱离你的手，你为何寻求他呢？」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/25/#L15">代下 25:15</a>)</p></blockquote><blockquote><p>“撒母耳对扫罗说：「<strong>耶和华差遣我</strong>膏你为王，治理他的百姓以色列；所以你当听从耶和华的话。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1ts/15/#L1">撒上 15:1</a>)</p></blockquote><blockquote><p>“<strong>耶和华差遣拿单</strong>去见大卫。拿单到了大卫那里，对他说：「在一座城里有两个人：一个是富户，一个是穷人。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2ts/12/#L1">撒下 12:1</a>)</p></blockquote><blockquote><p>“大卫安慰他的妻拔示巴，与她同寝。她就生了儿子，给他起名叫所罗门。耶和华也喜爱他； 就<strong>藉先知拿单</strong>赐他一个名字叫耶底底亚，因为耶和华爱他。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2ts/12/#L24-25">撒下 12:24-25</a>)</p></blockquote><blockquote><p>“我差遣我的仆人众先知到你们那里去；你们却捉住他们，杀害他们，残害他们的身体。他们的血我必追讨，这是主说的。” (<a href="https://bibleox.com/zh-Hans/ru/3ezd/1/#L32">厄四 1:32</a>, 俄文原文无中文经文，此处自译)</p></blockquote><h2>以色列人在旷野试探的是基督（<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/10/#L9">林前 10:9</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/95/#L6-9">诗 95:6-9</a>）</h2><blockquote><p>“<strong>也不要试探主</strong>，像他们有人试探的，就被蛇所灭；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/10/#L9">林前 10:9</a>) <em>(和合本此处作「主」，希腊文 τὸν Χριστόν，即「基督」)</em></p></blockquote><p>在旷野，以色列人试探的正是上帝、创造者；这就是说，基督就是他们所试探的那同一位上帝：</p><blockquote><p>“来啊，我们要屈身敬拜，在<strong>造我们的耶和华</strong>面前跪下。 因为<strong>他是我们的上帝</strong>，我们是他草场的羊，是他手下的民。惟愿你们今天听他的话。 你们不可硬着心，像当日在米利巴，就是在旷野的玛撒。 那时，你们的祖宗<strong>试我探我</strong>，并且观看我的作为。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/95/#L6-9">诗 95:6-9</a>)</p></blockquote><h2>古代抄本</h2><ol><li><p>现今的 <strong><a href="https://bibleox.com/zh-Hans/cn-cuv/iud/1/#L5">犹 1:5</a></strong> 作：「我想提醒你们，你们虽然知道这事，主救了他的百姓出埃及地，其后就把不信的灭绝了。」但在保存犹大书信的最古老的蒲草抄本 [[https://en.wikipedia.org/wiki/Papyrus_72|p72]]（三世纪）中，这段文字是这样：「我想提醒你们，你们虽然万事都知道，<strong>上帝基督</strong>（Theos Christos）曾一次救了他的百姓出埃及地，其后就把不信的灭绝了。」</p></li><li><p>现今文本的 <strong><a href="https://bibleox.com/zh-Hans/cn-cuv/kol/2/#L2">西 2:2</a></strong> 结尾作：「得以知道上帝和基督的奥秘」。而在保存保罗书信的最古老蒲草抄本 [[https://en.wikipedia.org/wiki/Papyrus_46|p46]]（二世纪末）中，写的是：「得以知道<strong>上帝基督</strong>的奥秘」（tou Theou Hristou）。</p></li><li><p>在我们手头的文本中，<strong><a href="https://bibleox.com/zh-Hans/cn-cuv/2pet/1/#L2">彼后 1:2</a></strong> 作：「愿恩惠、平安因你们认识上帝和我们主耶稣多多地加给你们」。而该书信最古老的抄本作：「愿恩惠、平安因你们认识<strong>上帝耶稣</strong>（tou Theou Iesou），我们的主，多多地加给你们」。</p></li><li><p>现今的 <strong><a href="https://bibleox.com/zh-Hans/cn-cuv/in/1/#L18">约 1:18</a></strong> 作：「父怀里的独生子」。而在约翰福音最早的书册——蒲草抄本 [[https://en.wikipedia.org/wiki/Papyrus_75|p75]]（三世纪中叶）和 [[https://en.wikipedia.org/wiki/Papyrus_66|p66]]（二世纪末）中，读到的是：「父怀里的<strong>独一上帝</strong>」。圣里昂的伊里奈乌引用这处时，也是这样。</p></li></ol><h2>基督——两个世界的居住者：上帝与人</h2><p>没有能把一只手放在上帝身上、另一只手放在人身上的中保，因为这两个世界互不相触，没有任何东西、任何存在把它们连在一起：</p><blockquote><p>“<strong>我们中间没有听讼的人</strong>，可以向我们两造按手。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iov/9/#L33">伯 9:33</a>)</p></blockquote><p>而耶稣基督（非受造的上帝与受造的人）自己就联结了这两个世界：</p><blockquote><p>“因为只有一位上帝，<strong>在上帝和人中间，只有一位中保</strong>，乃是降世为人的基督耶稣。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/2/#L5">提前 2:5</a>)</p></blockquote><h2>旧约的平行经文</h2><h3>基督如同上帝：万王之王、万主之主</h3><p>先知称上帝为万主之主：</p><blockquote><p>“你们要称谢万神之神，因他的慈爱永远长存！ 你们要称谢<strong>万主之主</strong>，因他的慈爱永远长存！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/136/#L2-3">诗 136:2-3</a>)</p></blockquote><p>使徒称上帝为万王之王、万主之主：</p><blockquote><p>“到了日期，那可称颂、独有权能的<strong>万王之王、万主之主</strong>， 就是那独一不死，住在人不能靠近的光里，是人未曾看见，也是不能看见的，要将他显明出来。但愿尊贵和永远的权能都归给他。阿们！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/6/#L15-16">提前 6:15-16</a>)</p></blockquote><p>使徒称耶稣基督为万主之主、万王之王：</p><blockquote><p>“他们与羔羊争战，羔羊必胜过他们，因为羔羊是<strong>万主之主、万王之王</strong>。同着羔羊的，就是蒙召、被选、有忠心的，也必得胜。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/17/#L14">启 17:14</a>)</p></blockquote><blockquote><p>“在他衣服和大腿上有名写着说：『<strong>万王之王、万主之主</strong>。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/19/#L16">启 19:16</a>)</p></blockquote><h3>基督如同上帝：全能者</h3><p>上帝是全能者：</p><blockquote><p>“上帝所惩治的人是有福的！所以你不可轻看<strong>全能者</strong>的管教。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iov/5/#L17">伯 5:17</a>)</p></blockquote><p>基督是全能者：</p><blockquote><p>“主上帝说：「我是阿拉法，我是俄梅戛，是昔在、今在、以后永在的<strong>全能者</strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/1/#L8">启 1:8</a>)</p></blockquote><blockquote><p>“他是上帝荣耀所发的光辉，是上帝本体的真像，常用他权能的命令<strong>托住万有</strong>，他洗净了人的罪，就坐在高天至大者的右边．” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/1/#L3">希 1:3</a>)</p></blockquote><p>在同一卷书中，上帝也被称为全能者：</p><blockquote><p>“唱上帝仆人摩西的歌和羔羊的歌，说：「<strong>主上帝，全能者啊</strong>，你的作为大哉，奇哉！万世之王啊，你的道途义哉，诚哉！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/15/#L3">启 15:3</a>)</p></blockquote><h3>基督是「自有的」（希伯来文：耶和华）</h3><p>基督对自己的称呼，与旧约中上帝的称呼相同（耶和华、自有的）：</p><blockquote><p>“他们就问他说：「你是谁？」耶稣对他们说：「就是我<strong>从起初</strong>所告诉你们的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/8/#L25">约 8:25</a>)</p></blockquote><h3>上帝将与众圣徒一同降临，基督也是</h3><p>上帝（希伯来文 יהוה）将与众圣徒一同降临：</p><blockquote><p>“你们要从我山的谷中逃跑，因为山谷必延到亚萨。你们逃跑，必如犹大王乌西雅年间的人逃避大地震一样。<strong>耶和华我的上帝必降临，有一切圣者同来</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/zah/14/#L5">亚 14:5</a>)</p></blockquote><blockquote><p>“亚当的七世孙以诺曾预言这些人说：『看哪，<strong>主带着他的千万圣者降临</strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iud/1/#L14">犹 1:14</a>)</p></blockquote><p>基督将与众圣徒一同降临：</p><blockquote><p>“好使你们当<strong>我们主耶稣同他众圣徒来</strong>的时候，在我们父上帝面前心里坚固，成为圣洁，无可责备。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1sol/3/#L13">帖前 3:13</a>)</p></blockquote><blockquote><p>“当<strong>人子</strong>在他荣耀里，<strong>同着众天使</strong>降临的时候，要坐在他荣耀的宝座上。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/25/#L31">太 25:31</a>)</p></blockquote><h2>创造者与审判者——是上帝</h2><ol><li><p><a href="https://bibleox.com/ru/ru/w/Христос-Творец-мира">基督——创造者</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/Христос-судья">基督——审判者</a></p></li><li><p>创造者与审判者——是上帝</p></li></ol><blockquote><p>“他大声说：「<strong>应当敬畏上帝</strong>，将荣耀归给他，因他<strong>施行审判的时候已经到了</strong>！应当<strong>敬拜那创造天、地、海和众水泉源的</strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/14/#L7">启 14:7</a>)</p></blockquote><h2>对穆斯林有益的认识</h2><blockquote><p>“因<strong>有一婴孩为我们而生</strong>，有一子赐给我们，政权必担在他的肩头上。他名称为『奇妙策士』、『<strong>全能的上帝</strong>』、『<strong>永在的父</strong>』、『<strong>和平的君</strong>』！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/9/#L6">赛 9:6</a>)</p></blockquote><blockquote><p>“因为无论在那里，有两三个人奉我的名聚会，那里就<strong>有我在他们中间</strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/18/#L20">太 18:20</a>)</p></blockquote><h2>他的根源从亘古、从太初就有</h2><blockquote><p>“「伯利恒、以法他阿，你在犹大诸城中为小，将来必有一位从你那里出来，在以色列中为我作掌权的；<strong>他的根源从亘古、从太初就有</strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mih/5/#L2">弥 5:2</a>)</p></blockquote><blockquote><p>“你们的祖宗亚伯拉罕欢欢喜喜的仰望我的日子；既看见了，就快乐。」 犹太人说：「<strong>你还没有五十岁，岂见过亚伯拉罕呢</strong>？」 耶稣说：「我实实在在的告诉你们，<strong>还没有亚伯拉罕就有了我</strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/8/#L56-58">约 8:56-58</a>)</p></blockquote><blockquote><p>“耶稣对他们说：「<strong>我曾看见撒但从天上坠落</strong>，像闪电一样。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/10/#L18">路 10:18</a>)</p></blockquote><blockquote><p>“在船上的人都<strong>拜他</strong>，说：「<strong>你真是上帝的儿子了</strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/14/#L33">太 14:33</a>)</p></blockquote><blockquote><p>“耶稣见他们的信心，就对瘫子说：「小子，<strong>你的罪赦了</strong>。」 有几个文士坐在那里，心里议论，说： 「这个人为什么这样说呢？他说僭妄的话了！<strong>除了上帝以外，谁能赦罪呢</strong>？」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/2/#L5-7">可 2:5-7</a>)</p></blockquote><blockquote><p>“所以犹太人越发想要杀他，因他不但犯了安息日，并且<strong>称上帝为他的父，将自己和上帝当作平等</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/5/#L18">约 5:18</a>)</p></blockquote>
