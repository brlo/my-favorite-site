- src: Татуировки
  path: QS13A_纹身
  title: 纹身、穿环
  copy_cover: true
  body: <p>上帝禁止在身体上刺纹、划身：</p><blockquote><p>“你们是耶和华你们上帝的儿女。<strong><mark>不可为死人用刀划身</mark></strong>，也不可将额上剃光，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/14/#L1">申 14:1</a>)</p></blockquote><blockquote><p>“<strong><mark>头的周围不可剃</mark></strong>，胡须的周围也不可损坏。 不可为死人用刀划身、<strong><mark>也不可在身上刺花纹。我是耶和华</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/19/#L27-28">利 19:27-28</a>)</p></blockquote><blockquote><p>“所以弟兄们，我以上帝的慈悲劝你们，<strong><mark>将身体献上，当作活祭，是圣洁的，是上帝所喜悦的</mark></strong>．你们如此事奉，乃是理所当然的。 <strong><mark>不要效法这个世界</mark></strong>，只要心意更新而变化，叫你们察验何为上帝的善良、纯全、可喜悦的旨意。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/12/#L1-2">罗 12:1-2</a>)</p></blockquote><blockquote><p>“耶和华对摩西说：「<strong><mark>你告诉亚伦子孙作祭司的说</mark></strong>：『祭司不可为民中的死人沾染自己。 &lt;…&gt; 不可使头光秃，不可剃除胡须的周围，<strong><mark>也不可用刀划身</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/21/#L1,5">利 21:1,5</a>)</p></blockquote>
