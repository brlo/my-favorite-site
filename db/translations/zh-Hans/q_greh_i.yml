- src: yD3R_Воровство
  path: QS14A_偷窃
  title: 偷窃
  copy_cover: true
  body: <blockquote><p>“你们岂不知<strong><mark>不义的人不能承受上帝的国</mark></strong>吗？<strong><mark>不要自欺</mark></strong>！无论是淫乱的、拜偶像的、奸淫的、作娈童的、亲男色的、 <strong><mark>偷窃的</mark></strong>、贪婪的、醉酒的、辱骂的、勒索的，<strong><mark>都不能承受上帝的国</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/6/#L9-10">林前 6:9-10</a>)</p></blockquote><blockquote><p>“<strong><mark>从前偷窃的，不要再偷</mark></strong>；总要劳力，亲手作正经事，就可有余，分给那缺少的人。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/4/#L28">弗 4:28</a>)</p></blockquote><blockquote><p>“因为<strong><mark>我耶和华喜爱公平，恨恶抢夺和罪孽</mark></strong>。我要凭诚实施行报应，并要与我的百姓立永约。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/61/#L8">赛 61:8</a>)</p></blockquote><blockquote><p>“他对我说：「这是发出行在遍地上的咒诅。<strong><mark>凡偷窃的，必按卷上这面的话除灭</mark></strong>；凡起假誓的，必按卷上那面的话除灭。 万军之耶和华说：『我必使这书卷出去，<strong><mark>进入偷窃人的家</mark></strong>和指我名起假誓人的家，必常在他家里，连房屋带木石都毁灭了。』」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/zah/5/#L3-4">亚 5:3-4</a>)</p></blockquote><blockquote><p>“<strong><mark>你们偷盗、杀害、奸淫、起假誓</mark></strong>、向巴力烧香并随从素不认识的别神； <strong><mark>且来到这称为我名下的殿</mark></strong>，在我面前敬拜。又说：我们可以自由了！你们这样的举动是要行那些可憎的事吗？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ier/7/#L9-10">耶 7:9-10</a>)</p></blockquote><blockquote><p>“上帝吩咐这一切的话，说： &lt;…&gt; <strong><mark>不可偷盗</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/20/#L1,15">出 20:1,15</a>)</p></blockquote><blockquote><p>“耶和华对摩西说： &lt;…&gt; <strong><mark>你们不可偷盗。不可欺骗。也不可彼此说谎</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/19/#L1,11">利 19:1,11</a>)</p></blockquote><p><hr></p><blockquote><p>“再者，我对恶人说：『你必定死亡！』<strong><mark>他若转离他的罪</mark></strong>，行正直与合理的事： <strong><mark>还人的当头和所抢夺的，遵行生命的律例，不作罪孽，他必定存活</mark></strong>，不至死亡。 <strong><mark>他所犯的一切罪必不被记念</mark></strong>；他行了正直与合理的事，必定存活。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iez/33/#L14-16">结 33:14-16</a>)</p></blockquote><blockquote><p>“撒该站着对主说：「主啊，<strong><mark>我把所有的一半给穷人；我若讹诈了谁，就还他四倍</mark></strong>。」 耶稣说：「<strong><mark>今天救恩到了这家</mark></strong>，因为他也是亚伯拉罕的子孙。 人子来，为要寻找、拯救失丧的人。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/19/#L8-10">路 19:8-10</a>)</p></blockquote>
