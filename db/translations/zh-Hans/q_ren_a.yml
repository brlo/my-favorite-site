- src: человек-храм-Божий
  path: QR3A_人——上帝的殿
  title: 人——上帝的殿
  copy_cover: true
  body: <blockquote><p>“岂不知<strong><mark>你们的身子就是圣灵的殿</mark></strong>吗？这圣灵是从上帝而来，住在你们里头的；并且你们不是自己的人，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/6/#L19">林前 6:19</a>)</p></blockquote><blockquote><p>“若有人毁坏上帝的殿，上帝必要毁坏那人，因为上帝的殿是圣的，<strong><mark>这殿就是你们</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/3/#L17">林前 3:17</a>)</p></blockquote><blockquote><p>“岂不知<strong><mark>你们是上帝的殿</mark></strong>，上帝的灵住在你们里头吗？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/3/#L16">林前 3:16</a>)</p></blockquote><blockquote><p>“上帝的殿和偶像有什么相同呢？因为<strong><mark>我们是永生上帝的殿</mark></strong>，就如上帝曾说：『<strong><mark>我要在他们中间居住，在他们中间来往</mark></strong>；我要作他们的上帝，他们要作我的子民。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/6/#L16">林后 6:16</a>)</p></blockquote><blockquote><p>“犹太人便说：「这殿是四十六年才造成的，你三日内就再建立起来么？」 <strong><mark>但耶稣这话是以他的身体为殿</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/2/#L20-21">约 2:20-21</a>)</p></blockquote><blockquote><p>“但基督为儿子，治理上帝的家；我们若将可夸的盼望和胆量坚持到底，<strong><mark>便是他的家了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/3/#L6">希 3:6</a>)</p></blockquote><blockquote><p>“各房靠他联络得合式，渐渐成为主的圣殿。 <strong><mark>你们也靠他同被建造，成为上帝借着圣灵居住的所在</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/2/#L21-22">弗 2:21-22</a>)</p></blockquote>
