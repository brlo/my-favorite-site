- src: человек-образ-Бога
  path: QR2A_人——上帝的形像
  title: 人——上帝的形像
  copy_cover: true
  body: <h2>人受造原是要作上帝的形像和样式：</h2><blockquote><p>“上帝说：「我们要照着<strong><mark>我们的形像</mark></strong>，按着<strong><mark>我们的样式</mark></strong>造人。使他们管理海里的鱼、空中的鸟、地上的牲畜和全地，并地上所爬的一切昆虫。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/1/#L26">创 1:26</a>)</p></blockquote><p>然而，受造时只是按形像：</p><blockquote><p>“<strong><mark>上帝就照着自己的形像造人</mark></strong>，<strong><mark>乃是照着他的形像造男造女</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/1/#L27">创 1:27</a>)</p></blockquote><blockquote><p>“亚当的后代记在下面。当上帝造人的日子，是<strong><mark>照着自己的样式造的</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/5/#L1">创 5:1</a>)</p></blockquote><blockquote><p>“凡流人血的，他的血也必被人所流，<strong><mark>因为上帝造人，是照自己的形像造的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/9/#L6">创 9:6</a>)</p></blockquote><h3>人里面的上帝形像</h3><p>永远的存在：</p><blockquote><p>“其实天主造了人，原是不死不灭的，使他成为<strong>自己本性的肖像</strong>；” (<a href="https://bibleox.com/zh-Hans/cn-sb/prs/2/#L23">智 2:23</a>)</p></blockquote><h3>人里面的上帝样式</h3><p>人只是被召走向与上帝相似：</p><blockquote><p>“我心里柔和谦卑，你们当负我的轭，<strong><mark>学我的样式</mark></strong>，这样，你们心里就必<strong><mark>得享安息</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/11/#L29">太 11:29</a>)</p></blockquote><blockquote><p>“因为他预先所知道的人，就预先定下<strong><mark>效法他儿子的模样</mark></strong>，使他儿子在许多弟兄中作长子。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/8/#L29">罗 8:29</a>)</p></blockquote>
