  path: QR1A_人的构成
  title: 人的构成
  copy_cover: true
  body: <p>人性构成：</p><ol><li><p>血肉之体；</p></li><li><p>灵魂；</p></li><li><p>灵（灵魂的力量）。</p></li></ol><h2>肉体</h2><blockquote><p>“我在母胎中形成了肉躯，十月之久，在母血中凝结，由男精与合梦的欲乐而形成。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prs/7/#L1-2">智 7:1-2</a>)</p></blockquote><h2>灵魂与灵</h2><blockquote><p>“愿赐平安的上帝亲自使你们<strong><mark>全然成圣</mark></strong>。又愿你们的<strong><mark>灵</mark></strong>与<strong><mark>魂</mark></strong>与<strong><mark>身子</mark></strong>得蒙保守，在我主耶稣基督降临的时候，完全无可指摘。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1sol/5/#L23">帖前 5:23</a>)</p></blockquote><blockquote><p>“但知<strong><mark>身上疼痛</mark></strong>，<strong><mark>心中悲哀</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iov/14/#L22">伯 14:22</a>)</p></blockquote><blockquote><p>“上帝阿，你是我的上帝！我要切切的寻求你；在干旱疲乏无水之地，我渴想你，<strong><mark>我的心切慕你</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/63/#L1">诗 63:1</a>)</p></blockquote><blockquote><p>“我羨慕渴想耶和华的院宇，<strong><mark>我的心肠、我的肉体向永生上帝呼吁</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/84/#L2">诗 84:2</a>)</p></blockquote><blockquote><p>“仁慈的人<strong><mark>善待自己</mark></strong>；残忍的人<strong><mark>扰害己身</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/11/#L17">箴 11:17</a>)</p></blockquote><h2>人死的时候，灵魂与身体分离</h2><blockquote><p>“<strong><mark>那杀身体不能杀灵魂的</mark></strong>，不要怕他们；惟有<strong><mark>能把身体和灵魂都灭在地狱里的</mark></strong>，正要怕他。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/10/#L28">太 10:28</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/lk/12/#L4">路 12:4</a>)</p></blockquote><blockquote><p>“有一个少年人，名叫犹推古，坐在窗台上困倦沉睡。保罗讲了多时，少年人睡熟了，就<strong><mark>从三层楼上掉下去</mark></strong>；扶起他来，<strong><mark>已经死了</mark></strong>。 保罗下去，伏在他身上，抱着他说：「<strong><mark>你们不要发慌，他的灵魂还在身上</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/20/#L9-10">徒 20:9-10</a>)</p></blockquote><h2>人死后，肉体朽坏，但灵魂继续存在</h2><blockquote><p>“就预先看明这事，讲论基督复活说：『<strong><mark>他的灵魂不撇在阴间</mark></strong>；<strong><mark>他的肉身也不见朽坏</mark></strong>。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/2/#L31">徒 2:31</a>)</p></blockquote><p>关于<a href="https://bibleox.com/ru/ru/w/жизнь-души-после-смерти-тела">灵魂不朽</a>的引文。</p><h2>复活时，人自己原来的肉体将复原，灵魂回来，与自己的肉体重新结合</h2><blockquote><p>“我知道我的救赎主活着，末了必站立在地上。 <strong><mark>我这皮肉灭绝之后</mark></strong>，<strong><mark>我必在肉体之外得见上帝</mark></strong>。 我自己要见他，亲眼要看他，并不像外人。我的心肠在我里面消灭了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iov/19/#L25-27">伯 19:25-27</a>) <em>(和合本作「在肉体之外」；七十士译本（俄文译本所据）作「在肉体之内」，指复活时以自己的肉体得见上帝。)</em></p></blockquote>
