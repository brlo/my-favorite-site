  title: 堕胎
  copy_cover: true
  body: <h2>杀人是罪</h2><blockquote><p>“<strong><mark>不可杀人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/20/#L13">出 20:13</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/5/#L17">申 5:17</a>)</p></blockquote><blockquote><p>“他说：「什么诫命？」耶稣说：「就是『<strong><mark>不可杀人</mark></strong>，不可奸淫，不可偷盗，不可作假见证，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/19/#L18">太 19:18</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L21">太 5:21</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/mk/10/#L19">可 10:19</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/lk/18/#L20">路 18:20</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/rim/13/#L9">罗 13:9</a>)</p></blockquote><p>无论是尚在母腹中、还是已经出生的婴儿，都是人。杀人是罪。</p><p>在古老的基督教文献（《十二宗徒训言》）中直截了当地说到这一点：</p><blockquote><p>「<strong>不可堕杀胎中的婴儿</strong>，也不可在出生后杀死他。」</p></blockquote>（<a href="https://azbyka.ru/otechnik/pravila/didahe_rus/">《十二宗徒训言》</a>）<h2>婴儿也是人。无论在母腹内，还是在母腹外</h2><p>圣经把远早于预产期（怀孕三四个月）出生的人也称为婴孩：</p><blockquote><p>“甫满周岁的婴孩要用声音说话；怀孕的妇人要在三四个月时生下不足月的婴孩，他们要存活，并且健壮。” (<a href="https://bibleox.com/zh-Hans/ru/3ezd/6/#L21">厄四 6:21</a>, 俄文原文无中文经文，此处自译)</p></blockquote><p>赞美那些拒绝杀死刚出生婴儿的收生婆：</p><blockquote><p>“但是<strong><mark>收生婆敬畏上帝</mark></strong>，不照埃及王的吩咐行，<strong><mark>竟存留男孩的性命</mark></strong>。 &lt;…&gt; 上帝厚待收生婆。以色列人多起来，极其强盛。 收生婆因为敬畏上帝，上帝便叫她们成立家室。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/1/#L17,20-21">出 1:17,20-21</a>)</p></blockquote><p>先知施洗约翰在母腹中、在出生之前，就已被圣灵充满。也就是说，并不是什么「将来会成为人的东西」，而是先知约翰自己，还在母腹中时，就成了上帝之灵的殿：</p><blockquote><p>“他在主面前将要为大，淡酒浓酒都不喝，<strong><mark>从母腹里就被圣灵充满了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/1/#L15">路 1:15</a>)</p></blockquote><p>上帝在母腹中所造的，不是什么「后来才成为人」的东西，而是人本身；这个人后来只是从母腹中出来，也就是出生。上帝在人出生之前就使他成圣：</p><blockquote><p>“「<strong><mark>我未将你造在腹中</mark></strong>，我已晓得你；<strong><mark>你未出母胎，我已分别你为圣</mark></strong>；我已派你作列国的先知。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ier/1/#L5">耶 1:5</a>)</p></blockquote><p>忍受苦难的先知约伯也这样说。上帝在母腹中造的是我们，而不是什么「后来会成为人」的东西：</p><blockquote><p>“<strong><mark>造我在腹中的</mark></strong>，不也是造他吗？<strong><mark>将他与我抟在腹中的岂不是一位吗</mark></strong>？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iov/31/#L15">伯 31:15</a>)</p></blockquote><p>人在母腹中的发育过程被描述为上帝自己的创造行动。这被描述为：人已经存在，却像穿衣服一样穿上肉体，为要出来到世界上。约伯所说的不是某种后来才成为约伯的质料；他直接把这胚胎说成是他自己：难道不是你给我穿上肉体的吗？</p><blockquote><p>“你的手创造我，造就我的四肢百体；你还要毁灭我。 求你记念，制造我如抟泥一般；你还要使我归于尘土吗？ <strong><mark>你不是倒出我来好像奶，使我凝结如同奶饼吗？ 你以皮和肉为衣给我穿上，用骨与筋把我全体联络</mark></strong>。 你将生命和慈爱赐给我，你也眷顾保全我的心灵。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iov/10/#L8-12">伯 10:8-12</a>)</p></blockquote><p>先知大卫也描述说：</p><blockquote><p>“我的肺腑是你所造的。<strong><mark>我在母腹中，你已覆庇我</mark></strong>。 &lt;…&gt; <strong><mark>我在暗中受造，在地的深处被联络</mark></strong>，那时，我的形体并不向你隐藏。 <strong><mark>我未成形的体质，你的眼早已看见了</mark></strong>。你所定的日子，我尚未度一日，你都写在你的册上了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/139/#L13,15-16">诗 139:13,15-16</a>) <em>(俄文本编号为 Пс 138:13,15-16（圣咏编号相差一）。)</em></p></blockquote>
