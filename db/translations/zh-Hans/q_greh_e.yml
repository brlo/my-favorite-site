  title: 行邪术
  copy_cover: true
  body: <h2>罪</h2><p>「行邪术」一节还包括其余的一切：</p><ul><li><p>占卜（任何形式的），</p></li><li><p>招魂、通灵，</p></li><li><p>相信法术（任何法术，黑法术、白法术），</p></li><li><p>相信护身符的能力（包括红绳），</p></li><li><p>被咒语加持过的物件，</p></li><li><p>星座运势（占星术），</p></li><li><p>求问特异功能者，</p></li><li><p>巫师、</p></li><li><p>法师、</p></li><li><p>女巫、</p></li><li><p>占卜者、</p></li><li><p>行邪术的、</p></li><li><p>替人「解眼」、「解咒」、「解祖咒」的老太婆，</p></li><li><p>等等：</p></li></ul><blockquote><p>“你到了耶和华你上帝所赐之地，那些国民所行可憎恶的事你不可学着行。 你们中间不可有人使儿女经火，也不可有<strong><mark>占卜的、观兆的、用法术的、行邪术的</mark></strong>、 <strong><mark>用迷术的、交鬼的、行巫术的、过阴的</mark></strong>。 <strong><mark>凡行这些事的，都为耶和华所憎恶</mark></strong>；因那些国民行这可憎恶的事，所以耶和华你的上帝将他们从你面前赶出。 你要在耶和华你的上帝面前作完全人。 因你所要赶出的那些国民都<strong><mark>听信观兆的和占卜的</mark></strong>；至于你，耶和华你的上帝从来不许你这样行。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/18/#L9-14">申 18:9-14</a>)</p></blockquote><blockquote><p>“又使他们的儿女经火，<strong><mark>用占卜、行法术卖了自己</mark></strong>，行耶和华眼中看为恶的事，惹动他的怒气。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/4ts/17/#L17">王下 17:17</a>)</p></blockquote><blockquote><p>“<strong><mark>并在欣嫩子谷使他的儿女经火</mark></strong>；<strong><mark>又观兆、用法术、行邪术、立交鬼的和行巫术的</mark></strong>，<strong><mark>多行耶和华眼中看为恶的事</mark></strong>，惹动他的怒气； <strong><mark>又在上帝殿内立雕刻的偶像</mark></strong>。上帝曾对大卫和他儿子所罗门说：「我在以色列各支派中所选择的耶路撒冷和这殿，必立我的名直到永远。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/33/#L6-7">代下 33:6-7</a>)</p></blockquote><blockquote><p>“有人对你们说：「当求问那些<strong>交鬼的和行巫术的</strong>，就是声音绵蛮，言语微细的。」你们便回答说：「<strong>百姓不当求问自己的上帝吗？岂可为活人求问死人呢</strong>？」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/8/#L19">赛 8:19</a>)</p></blockquote><blockquote><p>“至于你们，<strong><mark>不可听从你们的先知和占卜的、圆梦的、观兆的以及行邪术的</mark></strong>。他们告诉你们说：你们不至服事巴比伦王。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ier/27/#L9">耶 27:9</a>)</p></blockquote><blockquote><p>“万军之耶和华以色列的上帝如此说：「<strong><mark>不要被你们中间的先知和占卜的诱惑</mark></strong>，<strong><mark>也不要听信自己所作的梦</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ier/29/#L8">耶 29:8</a>)</p></blockquote><blockquote><p>“说：『主耶和华如此说：这些妇女有祸了！<strong><mark>她们为众人的膀臂缝靠枕，给高矮之人作下垂的头巾</mark></strong>，为要猎取人的性命。难道你们要猎取我百姓的性命，为利己将人救活吗？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iez/13/#L18">结 13:18</a>)</p></blockquote><blockquote><p>“所以主耶和华如此说：看哪！<strong><mark>我与你们的靠枕反对</mark></strong>，就是你们用以猎取人、使人的性命如鸟飞的。我要将靠枕从你们的膀臂上扯去，释放你们猎取如鸟飞的人。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iez/13/#L20">结 13:20</a>)</p></blockquote><blockquote><p>“「从你出胎，造就你的救赎主耶和华如此说：我耶和华是创造万物的，是独自铺张诸天、铺开大地的。谁与我同在呢？ <strong><mark>使说假话的兆头失效，使占卜的癫狂，使智慧人退后，使他的知识变为愚拙</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/44/#L24-25">赛 44:24-25</a>)</p></blockquote><blockquote><p>“<strong><mark>又必除掉你手中的邪术，你那里也不再有占卜的</mark></strong>。 <strong><mark>我必从你中间除灭雕刻的偶像和柱像</mark></strong>，你就不再跪拜自己手所造的。 <strong><mark>我必从你中间拔出木偶</mark></strong>，又毁灭你的城邑。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mih/5/#L12-14">弥 5:12-14</a>)</p></blockquote><blockquote><p>“又不悔改他们那些凶杀、<strong><mark>邪术</mark></strong>、奸淫、偷窃的事。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/9/#L21">启 9:21</a>)</p></blockquote><blockquote><p>“得胜的必承受这些为业。我要作他的上帝，他要作我的儿子。 惟有胆怯的、不信的、可憎的、杀人的、淫乱的、<strong><mark>行邪术的</mark></strong>、<strong><mark>拜偶像的</mark></strong>和一切说谎话的，他们的分就在烧着硫磺的火湖里，这是第二次的死。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/21/#L7-8">启 21:7-8</a>)</p></blockquote><blockquote><p>“<strong><mark>城外有那些犬类、行邪术的、淫乱的、杀人的、拜偶像的，并一切喜好说谎言编造虚谎的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/22/#L15">启 22:15</a>)</p></blockquote><h2>巫师和法师在上帝面前算不得什么。不能救人脱离他的刑罚</h2><blockquote><p>“哪知，丧子、寡居这两件事在一日转眼之间必临到你，正在你<strong><mark>多行邪术、广施符咒</mark></strong>的时候，这两件事必全然临到你身上。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/47/#L9">赛 47:9</a>)</p></blockquote><blockquote><p>“「站起来吧！<strong><mark>用你从幼年劳神施行的符咒和你许多的邪术</mark></strong>，或者可得益处，或者可得强胜。 你筹划太多，以至疲倦。<strong><mark>让那些观天象的、看星宿的、在月朔说预言的，都站起来，救你脱离所要临到你的事</mark></strong>。 <strong><mark>他们要像碎秸被火焚烧</mark></strong>，不能救自己脱离火焰之力，这火并非可烤的炭火，也不是可以坐在其前的火。 你所劳神的事都要这样与你无益。从幼年与你贸易的，也都各奔各乡，<strong><mark>无人救你</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/47/#L12-15">赛 47:12-15</a>)</p></blockquote><h2>求问黑暗的权势——是对上帝不忠（奸淫）</h2><blockquote><p>“「<strong><mark>你们这些巫婆的儿子，奸夫和妓女的种子</mark></strong>，都要前来！ 你们向谁戏笑、向谁张口吐舌呢？<strong><mark>你们岂不是悖逆的儿女、虚谎的种类呢</mark></strong>？ 你们在橡树中间，在各青翠树下欲火攻心；在山谷间，在石穴下杀了儿女；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/57/#L3-5">赛 57:3-5</a>)</p></blockquote><blockquote><p>“都因那美貌的妓女多有淫行，<strong><mark>惯行邪术</mark></strong>，<strong><mark>藉淫行诱惑列国，用邪术诱惑多族</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/naum/3/#L4">鸿 3:4</a>)</p></blockquote><blockquote><p>“万军之耶和华说：「我必临近你们，施行审判。我必速速作见证，<strong><mark>警戒行邪术的、犯奸淫的</mark></strong>，起假誓的、亏负人之工价的、欺压寡妇孤儿的、屈枉寄居的和不敬畏我的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mal/3/#L5">玛 3:5</a>)</p></blockquote><h2>人归向基督教时，弃绝了行邪术</h2><blockquote><p>“那已经信的，多有人来承认诉说自己所行的事。 <strong><mark>平素行邪术的，也有许多人把书拿来，堆积在众人面前焚烧</mark></strong>。他们算计书价，便知道共合五万块钱。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/19/#L18-19">徒 19:18-19</a>)</p></blockquote>
