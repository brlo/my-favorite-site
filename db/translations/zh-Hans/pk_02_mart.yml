    body: |-
      <h2>0</h2><p>在士每拿寄居的上帝的教会，致在菲罗美利亚[1]寄居的上帝的教会，以及无论在哪里寄居的圣而大公之教会的各会众[2]：愿上帝我们的父和主耶稣基督的怜悯、平安与爱丰丰富富地加增。</p><h2>1</h2><p>1. 弟兄们，我们把殉道者们的事迹——特别是配受称颂的坡旅甲的事迹——写信告诉你们；他好像用自己的殉道给这场逼迫盖上了印记，使它止息了。因为先前发生的几乎每一件事，都是为了让主从天上向我们显明那合乎福音的殉道[3]。</p><p>2. 他等候被交出去，正如主等候一样，好叫我们也作祂的效法者——不只顾念自己的事，也顾念邻人的事。因为真实而坚固的爱，就是不仅愿意自己得救，也愿意众弟兄都得救。</p><h2>2</h2><p>1. 凡照上帝的旨意成就的殉道，都是有福的、勇敢的；我们既存敬畏上帝之心，就当把凌驾于一切之上的权柄归于上帝。</p><p>2. 谁能不惊叹殉道者们的勇敢、忍耐和对主的热爱呢？他们的身体被鞭子撕裂，连里面的血管和动脉都清晰可见，他们却忍受住了，以致周围观看的人都怜悯哀哭；他们中间更有人达到这样的勇毅，竟没有一个喊叫，也没有一个呻吟，向众人显明：在受刑的那一刻，基督最勇敢的殉道者的灵魂已经离开了肉体——或者不如说，是主站在他们身旁，与他们交谈[4]。</p><p>3. 他们专心仰望基督的恩典，就轻看属世的刑罚，在一小时之内为自己赎得了永恒的生命。残酷的折磨者所点的火，在他们觉得是凉的；因为他们眼前只看见那要逃避的、永恒不灭的火，又用心灵的眼睛仰望那些为忍耐者保存的美善——那是耳朵未曾听见、眼睛未曾看见、人心未曾想到的[5]，是主向他们指明的；他们已经不再是人，而是天使了[6]。</p><p>4. 同样，那些被判处给野兽吞噬的人，也忍受了可怕的刑罚：他们被摆在尖锐的贝壳上[7]，又受其他各式各样的折磨，为要叫暴君用持续的苦刑——如果可能——逼他们说出否认的话。魔鬼在他们身上设了许多诡计。</p><h2>3</h2><p>1. 但是，感谢上帝：他并没有胜过他们所有人。最勇敢的日耳曼尼库斯用自己里面的忍耐坚固了他们的软弱；他公开地与野兽搏斗。当总督[8]想劝他、说“可怜可怜你的年纪”的时候，他就主动把野兽引到自己身上，宁愿快些脱离他们那不义、不法的生活。</p><p>2. 于是全体群众都惊叹这敬爱上帝、虔诚敬拜的基督教族群[9]的勇敢，高声呼喊：“除灭那些无神论者！去搜查坡旅甲！”</p><h2>4</h2><p>1. 有一个名叫昆图斯的弗吕家人，新近从弗吕家来，一看见野兽就害怕了。原来他就是那个勉强自己、又勉强几个自愿者走上前去的人。总督多方劝他，说服他起了誓、献了祭。所以，弟兄们，我们不称赞那些自己把自己交出去的人，因为福音不是这样教导的[10]。</p><h2>5</h2><p>1. 那最可惊叹的坡旅甲，起初听见这话并不惊慌，本想留在城里；但大多数人劝他退出去，他就退到离城不远的一个小村庄，与少数几个人在一起，日夜所行的无非是祷告——为众人、也为普天下各处的教会祷告，这是他一贯的习惯。</p><p>2. 在他被捕前三天，他祷告时得了一个异象，看见自己的枕头被火烧着；他转过身来对同在的人说：“我必要活着被烧。”</p><h2>6</h2><p>1. 搜查他的人继续寻找，他又迁到另一个村庄；搜查的人立刻追到了那里。他们没有找到他，就抓了两个小仆人[11]，其中一个受了刑拷问，就供认出来。</p><p>2. 要瞒过他们原是不可能的，因为出卖他的正是他自己家里的人；那治安官[12]——一个得着了与希律同样名字[13]、名叫希律的人——急忙要把他押进竞技场，好叫他自己得以在基督里有份、成全自己当得的份，而那出卖他的人则要受犹大所受的刑罚。</p><h2>7</h2><p>1. 于是，追捕的差役和骑兵带着这孩子，在预备日[14]晚饭时分，带着通常的武器，像追赶强盗一样出动了。他们很晚才聚合在一起，找到他正躺在楼上一间小屋里；他本可以从那里再往别处去，却不愿意，说：“愿上帝的旨意成就。”</p><p>2. 他听见他们到了，就下楼来，同他们交谈；在场的人都惊叹他的年岁和沉稳，奇怪为什么要这样急切地去捉拿这样一位老人家。他随即吩咐就在那个时候摆上饮食给他们，随他们吃饱喝足；只求他们给他一个钟头的时间，让他自由地祷告。</p><p>3. 他们允许了；他站起来祷告，充满了上帝的恩典，足足祷告了两个钟头，不能停下来，以致听见的人都惊叹，许多人后悔竟来捉拿这样一位敬虔的老人。</p><h2>8</h2><p>1. 他末了记念一切曾与他相识的人——小的和大的，有名的和无名的，以及普天下的大公教会——祷告完毕；到了该上路的时候，他们把他扶上驴，带进城去；那天是大安息日[15]。</p><p>2. 治安官希律和他的父亲尼基塔迎面而来；他们把他从驴上换到自己的车里[16]，坐在旁边劝他说：“说一句‘凯撒是主’[17]、献个祭，再做这些事以外的事，又有什么害处呢？这样你就可以保全性命。”他起初不回答他们；他们再三劝，他才说：“我决不做你们劝我做的事。”</p><p>3. 他们既然劝不动他，就对他说了恶毒的话，又怒气冲冲地把他推下车去，以致他下坡时擦伤了小腿。他却毫不理会，好像并没有受伤，欢欢喜喜、急速地往竞技场走，那里喧声震天，以致谁的话都听不见。</p><h2>9</h2><p>1. 坡旅甲走进竞技场时，有声音从天上来：“坡旅甲，要刚强，要作大丈夫！”说话的人没有人看见，但一同在场的弟兄们都听见了那声音。他被押上来时，众人一听说“坡旅甲被捉住了”，又大大喧哗起来。</p><p>2. 他被押到总督面前，总督问他是不是坡旅甲。他承认之后，总督劝他否认，说：“顾念你的年岁吧”，又说了许多这类的话——这是他们惯常说的：“向凯撒的运气起誓，悔改吧，说：除灭那些无神论者！”坡旅甲却面色凝重，环视竞技场上一切不法的外邦群众，向他们挥手，叹息举目望天，说：“除灭那些无神论者！”</p><p>3. 总督再三催逼他，说：“起誓吧，我就释放你；咒诅基督。”坡旅甲回答：“我已经事奉祂八十六年，祂没有亏待过我分毫；我怎能毁谤我的王、那位拯救我的？”</p><h2>10</h2><p>1. 他又再催逼：“向凯撒的运气起誓！”坡旅甲回答：“你若白白地夸口，要我像你说的那样向凯撒的运气起誓，又假装不认识我是谁，我就明白地告诉你：我是基督徒。你若愿意学习基督信仰的道理，请另定一日，你来听。”</p><p>2. 总督说：“去说服百姓吧。”坡旅甲说：“你我之间的谈话，我还愿意应答；因为经上说，上帝所设立的执政掌权的，我们当按着本分恭敬——这恭敬于我们并无损害[18]。至于那些人，我不认为配得上向他们分诉。”</p><h2>11</h2><p>1. 总督说：“我有野兽，你不悔改，我就把你丢给它们。”坡旅甲说：“叫它们来吧。对我们来说，从善转到恶是不可能的；从恶转到善才是好的。”</p><p>2. 总督又对他说：“你不怕野兽，我就叫你被火烧掉，除非你悔改。”坡旅甲说：“你用火威胁我：那火烧一个钟头就熄了；你却不知道那为将来审判和永恒刑罚预备的火，要临到不敬虔的人。还犹豫什么？想做什么就做吧。”</p><h2>12</h2><p>1. 他说了这些和更多类似的话，就满有勇气和喜乐，脸上满溢着恩典；他不但没有因那些话而惊惶，反而叫总督惊惶失措，总督便打发自己的传令官到竞技场中央三度宣告：“坡旅甲已经自认是基督徒。”</p><p>2. 传令官一宣告，住在士每拿的外邦人和犹太人的全体群众，就以难止息的怒气、以极大的声音喊叫：“这就是亚细亚的教师[19]，基督徒之父，我们众神的毁灭者，他教导许多人不献祭、不敬拜。”他们这样喊着，就求亚细亚赛会的主持人[20]腓力放一头狮子来咬坡旅甲。腓力说这不行，因为斗兽的日子已经结束了。</p><p>3. 于是众人一致呼喊，要用火烧死坡旅甲。因为那在枕头上向他显现的异象必要应验：他祷告时看见自己的枕头被火烧着，就转身对同在的信徒们预言似地说：“我必要活着被烧。”</p><h2>13</h2><p>1. 这些事随即成就，比说出来还快：群众立刻从工场和浴室拿来木柴和柴草，犹太人照着他们的惯例格外热心地协助。</p><p>2. 当柴堆预备好的时候，坡旅甲脱去身上所有的衣服，解下腰带，又试着脱下便鞋——这是他自己以前从不做的；因为每位信徒总是争先恐后，想赶快摸一摸他的身体。由于他美善的品行，早在殉道之前，他就已备受尊崇[21]。</p><p>3. 他们立刻把烧火用的器械架在他身上。当他们要拿钉子钉他时，他说：“不要钉，就这样吧。那赐我力量忍受火的主，必使我不靠你们的钉子，也能在柴堆上安然不动。”</p><h2>14</h2><p>1. 于是他们没有钉他，只把他捆起来。他把双手反剪在背后，被捆着，好像一只从大群中选出来作祭牲的公羊，预备作上帝所悦纳的全燔祭。他举目望天说：“主啊，全能的上帝，祢所爱、所祝颂的圣仆耶稣基督的父，我们借着祂领受了关于祢的知识；众天使和众掌权者的上帝，一切受造之物和众义人之族——他们活在祢面前的——的上帝：</p><p>2. 我称颂祢，因为祢使我配得此时此刻，得以列在殉道者的数目中，在祢基督的杯里有份，得以在圣灵的不朽坏里，灵魂和身体复活进入永恒的生命。愿我今天在祢面前，在他们中间，作为肥美的、蒙悦纳的祭物被祢接纳，正如祢——那不能说谎、真实的上帝——早已预备、早已预告、早已成就的。</p><p>3. 为此，我为这一切称颂祢、祝颂祢、荣耀祢，借着永恒属天的大司祭耶稣基督——祢所爱的圣仆；愿荣耀借着祂归给祢，与祂并圣灵一同，从今时直到未来的世代。阿们[22]。”</p><h2>15</h2><p>1. 他说完“阿们”、祷告完毕，那些管火的人就点起火来。火焰猛然腾起，我们——那些蒙恩看见的人——看见了一个奇事[23]；我们也被保存下来，为要把所发生的事告诉其余的人。</p><p>2. 那火做出拱形的形状，像迎风鼓起的一片船帆，四面围着殉道者的身体；他在中间，不像烧着的肉，倒像烤着的饼[24]，或像在炉中炼着的金银。我们也闻到那样馨香的气味，好像乳香的烟，或别的珍贵香料。</p><h2>16</h2><p>1. 那些不法的终于看出，火不能烧毁他的身体，就吩咐行刑人上来，用短剑刺他。他这样做了，就有一只鸽子飞出来，又有那么多的血流出来，以致火被扑灭[25]；全体群众都惊讶，看见不信的人与蒙拣选的人之间有如此大的分别——那最可惊叹的殉道者坡旅甲就是蒙拣选者中的一位：在我们这时代，他是使徒的、又是先知的教师，是士每拿大公教会的主教。凡从他口中出来的每一句话，都已经成就，也必将成就。</p><h2>17</h2><p>1. 但那嫉妒者、毁谤者，那与义人之族为敌的恶者，看见了他殉道的伟大，看见了他从起初就无可指摘的品行，看见他戴上了不朽坏的冠冕、领受了无可辩驳的奖赏，就设法使我们连他的身体也不能拿去，虽然许多人愿意这样做、并愿意与他的圣洁肉身有份。</p><p>2. 他就唆使希律的父亲尼基塔——阿尔基的兄弟——去求官长，不要把尸体交出来，免得，如他所说，“我们离弃了那位被钉十字架的，反倒去敬拜这一位”。这些话是在犹太人的唆使和怂恿下说的，他们窥伺着我们，看我们要从火中取他的身体，却不明白：我们永远不能离弃基督——祂为拯救世上一切得救的人而受难，为罪人成了无瑕疵的祭[26]——也永远不能敬拜任何别人。</p><p>3. 因为我们敬拜祂，祂是上帝的儿子；至于殉道者，我们是作为主的门徒和效法者而恰当地爱他们，因他们对他们自己的君王和师傅的无比忠诚[27]。愿上帝使我们也能成为他们的同伴和同学！</p><h2>18</h2><p>1. 那百夫长看见犹太人的纷争，就把尸体摆在中间——照他们的惯例——烧化了。</p><p>2. 这样，我们后来收殓了他的遗骨，比贵重的宝石更珍贵、比精金更纯净[28]，安放在合宜的地方。</p><p>3. 在那里，主必赐恩，叫我们——凡能聚集的——在欢欣和喜乐中，庆祝他那殉道的日子，作为他出生（于永生）的纪念日[29]：既记念在我们以前争战的，又为将来的人预备操练和准备。</p><h2>19</h2><p>1. 这些就是配受称颂的坡旅甲的事迹。他与非拉铁非的信徒一同殉道，是士每拿的第十二位殉道者[30]，但人人都特别记念他，连外邦人也处处谈论他：他不仅是著名的教师，又是卓越的殉道者，他的殉道是照着基督的福音成就的，人人都愿意效法。</p><p>2. 他借着忍耐制服了那不义的统治者，就这样领受了不朽坏的冠冕，如今与众使徒和众义人一同欢欣，荣耀全能的上帝我们的父，称颂我们的主耶稣基督——我们灵魂的救主、我们身体的治理者、普天下大公教会的牧者。</p><h2>20</h2><p>1. 你们曾求我们更详细地告诉你们所发生的事；我们如今借着我们的弟兄马吉安[31]，简要地写信告诉了你们所发生的事。你们读了之后，要把它转寄给更远的弟兄们，好叫他们也荣耀主，祂从自己的仆人中施行拣选[32]。</p><p>2. 愿那能借着祂的恩典和恩赐，把我们众人领进祂属天的国度、借着祂独生的爱子耶稣基督的上帝，得着荣耀、尊贵、权柄、伟大，直到万世。请问候众圣徒。与我们同在的人问候你们，还有写信的埃瓦列斯特和他的全家[33]。</p><h2>21</h2><p>1. 配受称颂的坡旅甲于桑提科斯月第二日——即三月朔前第七日（2月23日）[34]、大安息日、第八时辰[35]殉道。他被希律捉拿，时值大司祭特拉勒斯的腓力任内、斯塔提乌斯·夸德拉图斯任总督[36]，而永世为王的是耶稣基督：愿荣耀、尊贵、伟大、永恒的宝座归于祂，从世代到世代。阿们。</p><h2>22</h2><p>1. 弟兄们，我们愿你们靠着那合乎福音的主耶稣基督之道刚强站立；愿荣耀借着祂归于上帝我们的父和圣灵，为拯救蒙拣选的众圣徒，正如配受称颂的坡旅甲所见证的；愿我们在耶稣基督的国里，蒙恩循着他的脚踪被寻见。</p><h3>［附录］</h3><p>2. 此信由该犹[37]誊抄——抄自爱任纽（坡旅甲的门徒）的著作；该犹曾与爱任纽同城而居。我苏格拉底在哥林多从该犹的抄本写下。愿恩典与众人同在[38]。</p><p>3. 我皮翁尼乌又从上面所说的抄本重新誊写，是照着配受称颂的坡旅甲向我显现的启示、寻访抄本而写的，如我在下文将要说明的；那时这些抄本已经几乎被岁月耗损殆尽。愿主耶稣基督也把我和祂的蒙拣选者一同聚集在祂属天的国度里；愿荣耀借着祂归于父和圣灵，直到万世万代。阿们。</p><h2>据莫斯科抄本的另一篇跋</h2><p>1. 此篇由该犹从爱任纽的著作誊抄；该犹曾与爱任纽同城而居；爱任纽是圣坡旅甲的门徒。</p><p>2. 这位爱任纽在主教坡旅甲殉道的时候正在罗马，教导了许多人。他写有许多极优美、极正统的著作传世，其中记念坡旅甲，说自己曾从他学习，又相当充分地驳斥了一切异端，并把自己在圣徒那里领受的教会和大公的规则传给了后人。</p><p>3. 他还说这样一件事：马吉安——马吉安派的人就从他得名——有一次遇见圣坡旅甲，说：“坡旅甲，认认我们吧。”坡旅甲回答马吉安说：“我认得，我认得，撒但的长子[39]。”</p><p>4. 在爱任纽的著作里还记载着：坡旅甲在士每拿殉道的那一天、那一时辰，爱任纽正在罗马城里，听见有声音像号筒一样说：“坡旅甲殉道了。”</p><p>5. 于是，如前所述，该犹从爱任纽的这些著作誊抄，而伊索克拉底在哥林多从该犹的抄本誊抄；我皮翁尼乌又照圣坡旅甲的启示寻访、从伊索克拉底的抄本写下，把那几乎被岁月耗损殆尽的文字收集起来。愿主耶稣基督也把我和祂的蒙拣选者一同聚集在祂属天的国度里；愿荣耀借着祂归于父和圣子并圣灵，直到万世万代。阿们。</p>
    references: |-
      <ol><li><p>菲罗美利亚（Philomelium）：弗吕家的城市，一面靠近吕高尼，另一面靠近彼西底的安提阿。参见斯特拉波《地理志》12.8.14；托勒密《地理志》5.2.25。</p></li><li><p>“大公的”（καθολική）在这里是这个词最初的意义——“普世的”；这个词的这种用法第一次见于伊格那丢书信（《致士每拿人书》8:2）。在第16章中，“士每拿大公教会”已带有第二种意义——与异端会众相对的正统教会。</p></li><li><p>希腊文 μαρτυρία，字面意思是“见证”；在这个时代，这个词已经获得了专门意义——“殉道”（参见启 17:6、徒 22:20）。中文“殉道”（以死见证）也恰好兼有两层意思。</p></li><li><p>“主站在他们身旁”——这是古代殉道记的经典主题：主在受刑时亲自与殉道者同在。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/2/#L9">林前 2:9</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/20/#L36">路 20:36</a>：“因为他们不能再死，和天使一样；既是复活的人，就为上帝的儿子。”</p></li><li><p>希腊文 κήρυξ：一种壳上生满尖刺的海螺；古代把它用作猎号（这个词的字面意思就是“传令官”），后来用作刑具。</p></li><li><p>总督（ἄνθυπατος，罗马行省总督）：此处即后文第21章提到的斯塔提乌斯·夸德拉图斯。</p></li><li><p>“族”（γένος）：这里指作为整体群体的基督徒，异教徒把基督教看成一个“族群/民族”。</p></li><li><p>古代教会严格看待这种自行寻死的热情，认为它违背福音（参见<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/10/#L23">太 10:23</a>：“有人在这城里逼迫你们，就逃到那城里去”）和基督自己的榜样。更可取的是等候被捕：坡旅甲自己就先躲避了搜捕（第5–6章），几代人之后的居普良（迦太基）和亚历山大的狄奥尼修斯也这样做。弗吕家后来正是孟他努主义的发源地；孟他努派主张在逼迫中不可躲避（特土良皈依孟他努主义后写道：“逼迫时不可逃走”）。</p></li><li><p>希腊文 παιδάρια，两个“小仆人”（家仆少年）。</p></li><li><p>治安官（εἰρήναρχος，字面意思“看管平安者”）：即警察局长，负责逮捕犯人、审讯并押送交官。</p></li><li><p>他的名字与福音书中的希律相同。希腊文 κεκληρωμένος，字面意思是“得着了（同一）名字，如同承受产业”。作者有意使读者想起福音（参见下文第8章“驴”的细节）。</p></li><li><p>预备日（παρασκευή）：星期五。殉道发生在复活节前的“大安息日”（第8、21章）。</p></li><li><p>大安息日：复活节前的星期六。</p></li><li><p>καροῦχα，拉丁文 carruca：一种舒适的带篷四轮车，供贵妇和高官乘坐。他先被扶上驴（参见<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/21/#L7">太 21:7</a>：耶稣进耶路撒冷时门徒牵驴），再被换上车——作者一路有意叙述与福音的平行。</p></li><li><p>希腊文 Κύριος Καῖσαρ，“凯撒是主”。基督徒的唯一告白是“耶稣是主”（参见林前 12:3；腓 2:11）。对基督徒来说，称皇帝为“主”就是把属于基督的尊号给了人。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/13/#L1-7">罗 13:1-7</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/2/#L13-14">彼前 2:13-14</a>。</p></li><li><p>“亚细亚的教师”：抄本有两种读法，一作“亚细亚”（本站随莫斯科抄本和尤西比乌），一作“不敬虔”（源自拉丁文）。</p></li><li><p>亚细亚赛会的主持人（ἀσιαρχής）：亚细亚行省诸城联合赛会的主持人，享有全省最高的宗教荣誉（第21章称他“大司祭”），并主管竞技赛会。</p></li><li><p>坡旅甲当时已是八十多岁的老主教；信徒争先恐后想触摸他，是因为他多年圣善的牧养早已使他深受敬爱——这也正呼应第9章总督许诺饶他不死、他却宁可殉道的记载。</p></li><li><p>关于“永恒的大司祭”：参见<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/4/#L14">希 4:14</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/7/#L24-28">希 7:24-28</a>。“圣仆”（παῖς）：参见<a href="https://bibleox.com/zh-Hans/cn-cuv/act/4/#L27,30">徒 4:27,30</a>（和合本作“圣仆耶稣”）。</p></li><li><p>有些抄本作“大的奇事”。</p></li><li><p>“像烤着的饼”：古代作者已有人在这幅图像里看见感恩祭（圣体血）的暗示（参见上文第14章“祭物”）。参见<a href="https://bibleox.com/zh-Hans/cn-cuv/in/6/#L51">约 6:51</a>。</p></li><li><p>“飞出一只鸽子”一句不见于尤西比乌的引文；多半是较古的增补（可能是“坡旅甲行传”的作者皮翁尼乌所加）。鸽子使读者想到圣灵（参见太 3:16）。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/1/#L18-19">彼前 1:18-19</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/is/53/#L5-7">赛 53:5-7</a>。</p></li><li><p>这是关于敬礼殉道者（而不是敬拜他们）的最早的明确表述：敬拜只归于基督；殉道者被爱、被尊荣，因为基督在他们身上得荣耀。参见<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Pk4M_坡旅甲殉道记#HH-18">《坡旅甲殉道记》第18章</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/116/#L15">诗 116:15</a>：“在耶和华眼中，看圣民之死极为宝贵。”</p></li><li><p>希腊文 γενέθλιος ἡμέρα：“诞日”。殉道者的忌日被称为他“生于（永生）之日”并加以庆祝——这是关于殉道者纪念日的最早的明确见证。</p></li><li><p>这句话的含义不完全清楚；大约是说：士每拿殉道的十二人中，许多来自非拉铁非。</p></li><li><p>马吉安（Marcion）：这封信的信使。不要把他与异端创立者马吉安混淆（后者见附录，附注39）。抄本有读作“马其安尼”“马可”的异文。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/act/13/#L2">徒 13:2</a>。</p></li><li><p>埃瓦列斯特（Evaristus）执笔写下了此信，马吉安送信。</p></li><li><p>月名随抄本有异文：三月的历名（М）、五月（其余抄本）、四月（《复活节编年史》）。通常推算为156年2月23日。</p></li><li><p>第八时辰：午后两点。莫斯科抄本作“第九时辰”，为要与基督死于第九时辰（参见太 27:46）平行。</p></li><li><p>斯塔提乌斯·夸德拉图斯（Statius Quadratus）：155/156年的亚细亚行省总督；据此并参照复活节日期，通常推定坡旅甲殉道于156年。</p></li><li><p>该犹：参见<a href="https://bibleox.com/zh-Hans/cn-cuv/3in/1/#L1">约叁 1:1</a>。此名在当时极为常见，此处是另一人。</p></li><li><p>从本段起是文书（誊抄者）的后记，讲述此记如何辗转传抄。皮翁尼乌（Pionius，三世纪士每拿的殉道者）据说曾按坡旅甲的显现寻回此记，并另写了《坡旅甲行传》。</p></li><li><p>坡旅甲对马吉安的这句回答也见于本记所引（参见<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Pk4F_致腓立比人书#HH-7">《致腓立比人书》第7章</a>：“……这人就是撒但的长子”）。据莫斯科抄本的跋，爱任纽也记载了此事。</p></li></ol>
      <p>翻译：罗季翁·弗拉索夫（借助人工智能工具）。底本：希腊文原文（<a href="https://bibleox.com/zh-Hans/grc/w/Μαρτύριο_του_Αγίου_Πολυκάρπου_Επισκόπου_Σμύρνης">本站的希腊文版本</a>，据 Kirsopp Lake 校勘本）。参考：俄文译本与学术注释（普列奥布拉任斯基大司祭的译本注释，据 azbyka.ru 编译，删去与俄文译法相关的条目；抄本符号 М 指莫斯科抄本）、英文译本（Roberts–Donaldson）。圣经链接指向本站的和合本（上帝版）。翻译原则：正文按希腊文原文的章–段划分编号，便于引用；书末“据莫斯科抄本的另一篇跋”为后世抄录者的附录，标题按俄文页译出；“除灭那些无神论者”（Αἶρε τοὺς ἀθέους）是群众口号，字面意思是“把无神者拉出去”——罗马人因基督徒不拜诸神而称他们“无神论者”；译名沿用伊格那丢书信中文译本与和合本（士每拿、弗吕家、该犹、希律等）。</p>
