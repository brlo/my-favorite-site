  path: QT6A_司祭圣奥秘
  title: 司祭圣奥秘
  copy_cover: true
  body: <h2>旧约中司祭职的上帝设立</h2><p>司祭——只是亚伦的后裔：</p><blockquote><p>“<strong><mark>给亚伦和他儿子束上腰带</mark></strong>，包上裹头巾，<strong><mark>他们就凭永远的定例得了祭司的职任</mark></strong>；又要将亚伦和他儿子分别为圣。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L9">出 29:9</a>)</p></blockquote><p>司祭职与圣衣、膏抹一同传递：</p><blockquote><p>“<strong><mark>亚伦的圣衣要留给他的子孙</mark></strong>，<strong><mark>可以穿着受膏，又穿着承接圣职</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L29">出 29:29</a>)</p></blockquote><p>外人若近前来行事奉的礼，必须治死。司祭职的职责就是看守这事：</p><blockquote><p>“<strong><mark>你要嘱咐亚伦和他儿子，谨守自己祭司的职任</mark></strong>。<strong><mark>近前来的外人必被治死</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/3/#L10">民 3:10</a>)</p></blockquote><p>详细：</p><blockquote><p>“<strong><mark>耶和华对亚伦说</mark></strong>：「<strong><mark>你和你的儿子，并你本族的人</mark></strong>，要一同担当干犯圣所的罪孽；你和你的儿子也要一同担当干犯祭司职任的罪孽。 <strong><mark>你要带你弟兄利未人</mark></strong>，就是你祖宗支派的人前来，<strong><mark>使他们与你联合，服事你</mark></strong>，只是<strong><mark>你和你的儿子要一同在法柜的帐幕前供职</mark></strong>。 他们要守所吩咐你的，并守全帐幕，<strong><mark>只是不可挨近圣所的器具和坛</mark></strong>，免得他们和你们都死亡。 &lt;…&gt; <strong><mark>你和你的儿子要为一切属坛，和幔子内的事，一同守祭司的职任</mark></strong>。你们要这样供职，<strong><mark>我将祭司的职任给你们当作赏赐事奉我</mark></strong>。<strong><mark>凡挨近的外人必被治死</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/18/#L1-3,7">民 18:1-3,7</a>)</p></blockquote><h2>新约中司祭职的更换</h2><p>主耶稣基督订立新约（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/22/#L20">路 22:20</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/8/#L8">希 8:8</a>），改变律法，更换司祭职（是更换，而不是废除）：</p><blockquote><p>“<strong><mark>祭司的职任既已更改，律法也必须更改</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/7/#L12">希 7:12</a>)</p></blockquote><p>救主把圣灵赐给使徒，按麦基洗德的等次设立司祭的等次；他自己成为大祭司：</p><blockquote><p>“这麦基洗德就是撒冷王，<strong><mark>又是至高上帝的祭司</mark></strong>，本是长远为祭司的。他当亚伯拉罕杀败诸王回来的时候，就迎接他，给他祝福。 亚伯拉罕也将自己所得来的，取十分之一给他。<strong><mark>他头一个名繙出来就是仁义王</mark></strong>，他又名撒冷王，<strong><mark>就是平安王的意思</mark></strong>。 他<strong><mark>无父、无母、无族谱、无生之始、无命之终</mark></strong>，<strong><mark>乃是与上帝的儿子相似</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/7/#L1-3">希 7:1-3</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/evr/6/#L20">希 6:20</a>)</p></blockquote><blockquote><p>“我们所讲的事，其中第一要紧的，就是<strong><mark>我们有这样的大祭司，已经坐在天上至大者宝座的右边</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/8/#L1">希 8:1</a>)</p></blockquote><h2>教会等次的形成</h2><p>在五旬节那天，圣灵被赐给使徒和整个教会聚会——赐给整个教会。但在这天之前，救主只向使徒们显现，并且只把圣灵赐给他们，把赦罪之权赐给他们如同司祭一样——就是说，设立等次：</p><blockquote><p>“耶稣又对他们说：「愿你们平安！<strong><mark>父怎样差遣了我，我也照样差遣你们</mark></strong>。」 说了这话，就向他们吹一口气，说：「<strong><mark>你们受圣灵</mark></strong>。 <strong><mark>你们赦免谁的罪，谁的罪就赦免了</mark></strong>；<strong><mark>你们留下谁的罪，谁的罪就留下了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/20/#L21-23">约 20:21-23</a>)</p></blockquote><p>同样，在旧约的教会里，洁净罪的事正是在司祭职上：</p><blockquote><p>“他有了罪的时候，<strong><mark>就要承认所犯的罪</mark></strong>， 并要因所犯的罪，把他的赎愆祭牲，就是羊群中的母羊，或是一只羊羔，或是一只山羊，牵到耶和华面前为赎罪祭。至于他的罪，<strong><mark>祭司要为他赎了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/5/#L5-6">利 5:5-6</a>)</p></blockquote><h2>新等次的权柄</h2><p>主把天国的钥匙、捆绑和释放的权柄赐给使徒：</p><blockquote><p>“我要把天国的钥匙给你，<strong><mark>凡你在地上所捆绑的，在天上也要捆绑</mark></strong>；<strong><mark>凡你在地上所释放的，在天上也要释放</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/16/#L19">太 16:19</a>)</p></blockquote><blockquote><p>“我实在告诉你们：<strong><mark>凡你们在地上所捆绑的，在天上也要捆绑</mark></strong>；<strong><mark>凡你们在地上所释放的，在天上也要释放</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/18/#L18">太 18:18</a>)</p></blockquote><p>司祭职由使徒们拣选并按立，但圣经宣告：立长老看守教会的正是圣灵：</p><blockquote><p>“保罗从米利都打发人往以弗所去，<strong><mark>请教会的长老来</mark></strong>。 他们来了，保罗就说：「你们知道，自从我到亚西亚的日子以来，在你们中间始终为人如何， &lt;…&gt; <strong><mark>圣灵立你们作全群的监督</mark></strong>，你们就当为自己谨慎，也为全群谨慎，<strong><mark>牧养上帝的教会</mark></strong>，就是他用自己血所买来的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/20/#L17-18,28">徒 20:17-18,28</a>)</p></blockquote><p>这一切——是旧约预言的应验，见下文。</p><h2>关于新约司祭职的预言</h2><p>在旧约的教会里，司祭只从犹太民族中立——利未支派、亚伦的家系。而在新约的教会里，司祭将从一切民族中立，而不只是从犹太人（亚伦的家系）中：</p><blockquote><p>“「我知道他们的行为和他们的意念。时候将到，<strong><mark>我必将万民万族</mark></strong>聚来，看见我的荣耀。 我要显神迹在他们中间，逃脱的我要差到列国去，就是到他施、普勒、拉弓的路德和土巴、雅完，<strong><mark>并素来没有听见我名声、没有看见我荣耀辽远的海岛</mark></strong>，他们必将我的荣耀传扬在列国中。 他们必将你们的弟兄从列国中送回，使他们或骑马，或坐车，坐轿，骑骡子，骑独峰驼，到我的圣山耶路撒冷，作为供物献给耶和华，好像以色列人用洁净的器皿盛供物奉到耶和华的殿中。」这是耶和华说的。 耶和华说：「<strong><mark>我也必从他们中间取人为祭司，为利未人</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/66/#L18-21">赛 66:18-21</a>)</p></blockquote><h2>使徒传承与按立的教训</h2><h3>主教的按立</h3><p>主教提摩太藉使徒的按手、并有先前已被按立的主教们的按手，领受了特别的恩赐：</p><blockquote><p>“为此我提醒你，<strong><mark>使你将上帝藉我按手所给你的恩赐</mark></strong>，再如火挑旺起来。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/1/#L6">提后 1:6</a>)</p></blockquote><blockquote><p>“<strong><mark>你不要轻忽所得的恩赐</mark></strong>，<strong><mark>就是从前借着预言、在众长老按手的时候赐给你的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/4/#L14">提前 4:14</a>)</p></blockquote><p>行邪术的西门看见，不是每个基督徒都能按手以赐下圣灵。字面上说：不是人人都有这权柄。他拿钱给使徒，要他们也给他这权柄（使徒们为此咒诅了他）：</p><blockquote><p>“<strong><mark>西门看见使徒按手，便有圣灵赐下</mark></strong>，就拿钱给使徒， 说：「<strong><mark>把这权柄也给我</mark></strong>，<strong><mark>叫我手按着谁，谁就可以受圣灵</mark></strong>。」 彼得说：「你的银子和你一同灭亡吧！因<strong><mark>你想上帝的恩赐是可以用钱买的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/8/#L18-20">徒 8:18-20</a>)</p></blockquote><h3>使徒保罗的按立</h3><blockquote><p>“他们事奉主，禁食的时候，圣灵说：「<strong><mark>要为我分派巴拿巴和扫罗</mark></strong>，去作我召他们所作的工。」 <strong><mark>于是禁食祷告，按手在他们头上</mark></strong>，就打发他们去了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/13/#L2-3">徒 13:2-3</a>)</p></blockquote><h3>辅祭的按立</h3><blockquote><p>“叫他们站在使徒面前。<strong><mark>使徒祷告了，就按手在他们头上</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/6/#L6">徒 6:6</a>)</p></blockquote><p>同样见：<a href="https://bibleox.com/zh-Hans/cn-cuv/act/21/#L8">徒 21:8</a></p><h3>关于按立的教训</h3><p>使徒关于按手的教训：</p><blockquote><p>“<strong><mark>各样洗礼、按手之礼</mark></strong>、死人复活，以及永远审判各等教训。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/6/#L2">希 6:2</a>)</p></blockquote><p>警告不要急于按立（立为司祭）：</p><blockquote><p>“<strong><mark>给人行按手的礼，不可急促</mark></strong>；<strong><mark>不要在别人的罪上有分</mark></strong>，要保守自己清洁。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/5/#L22">提前 5:22</a>)</p></blockquote><h3>主教与长老——区别</h3><p>主教（希腊文 ἐπίσκοπος——监督）和长老（希腊文 πρεσβύτερος——年长者、团体之首）这两个概念交叉使用，仿佛可以互换。然而，具体之人的职分和权柄看得清楚，无论他们如何被称呼。提多应当完成使徒的事业，在克里特设立长老：</p><blockquote><p>“我从前留你在革哩底，是要你将那没有办完的事都办整齐了，<strong><mark>又照我所吩咐你的，在各城设立长老</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/tit/1/#L5">多 1:5</a>)</p></blockquote><p>提摩太可以审判自己的长老、责备和警戒信徒：</p><blockquote><p>“<strong><mark>控告长老的呈子，非有两三个见证就不要收</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/5/#L19">提前 5:19</a>)</p></blockquote><blockquote><p>“<strong><mark>务要传道</mark></strong>！无论得时不得时，总要专心，并用百般的忍耐，各样的教训，<strong><mark>责备人，警戒人，劝勉人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/4/#L2">提后 4:2</a>)</p></blockquote><p>这样，提多和提摩太按今天的理解是主教，虽然被称为长老。</p><h3>人人都是司祭吗？</h3><h4>与旧约话语的平行</h4><p>使徒彼得重复旧约的话，称所有基督徒为君尊的祭司和圣洁的国民：</p><blockquote><p>“<strong><mark>惟有你们是被拣选的族类，是有君尊的祭司，是圣洁的国度</mark></strong>，是属上帝的子民，要叫你们宣扬那召你们出黑暗、入奇妙光明者的美德。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/2/#L9">彼前 2:9</a>)</p></blockquote><p>这些话在旧约里是对全以色列说的：</p><blockquote><p>“如今你们若实在听从我的话，遵守我的约，就要在万民中作属我的子民；因为全地都是我的。 <strong><mark>你们要归我作祭司的国度，为圣洁的国民</mark></strong>。』这些话你要告诉以色列人。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/19/#L5-6">出 19:5-6</a>)</p></blockquote><p>这样，上帝称旧约的以色列为祭司的国度和圣洁的国民。然而，在事奉圣礼的意义上，并不是所有犹太人都是司祭。按律法，只有亚伦的司祭职可以进帐幕，其余的人若进帐幕就须以自己的生命付出代价，即他们必须死（<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/3/#L10">民 3:10</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/3/#L38">民 3:38</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/18/#L7">民 18:7</a>）。</p><p>如果在旧约里要把这些话分开——祭司的国度（不是所有人）和圣洁的国民（所有人），那么对新约使徒的话也得同样承认：君尊的祭司（不是所有人）、圣洁的国度（所有人）（<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/2/#L9">彼前 2:9</a>）。这些话可以按字面理解，也可以按寓意理解，但无论如何，都得把这两句话联系在一起，在同一意义上理解它们。</p><h4>旧约中建立普遍祭司职的企图</h4><p>在旧约里，上帝设立的秩序是：只有亚伦的后裔可以作司祭：</p><blockquote><p>“<strong><mark>亚伦的圣衣要留给他的子孙</mark></strong>，可以穿着受膏，又穿着承接圣职。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L29">出 29:29</a>)</p></blockquote><p>甚至亚伦的家系也不是人人都能作司祭：</p><blockquote><p>“<strong><mark>祭司亚伦的后裔，凡有残疾的，都不可近前来将火祭献给耶和华</mark></strong>。他有残疾，不可近前来献上帝的食物。 &lt;…&gt; 但不可进到幔子前，也不可就近坛前，因为他有残疾，<strong><mark>免得亵渎我的圣所</mark></strong>。我是叫他成圣的耶和华。』」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/21/#L21,23">利 21:21,23</a>)</p></blockquote><p>反对这神圣秩序的，是<strong>可拉、大坍、亚比兰和安</strong>，他们要求先知摩西从全民族中立司祭，而不只是从亚伦的家系。他们引用的正是那句话（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/19/#L5-6">出 19:5-6</a>），说人人都圣洁：</p><blockquote><p>“聚集攻击摩西、亚伦，说：「你们擅自专权！<strong><mark>全会众个个既是圣洁，耶和华也在他们中间</mark></strong>，<strong><mark>你们为什么自高，超过耶和华的会众呢</mark></strong>？」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/16/#L3">民 16:3</a>)</p></blockquote><blockquote><p>“耶和华又使你和你一切弟兄利未的子孙一同亲近他，这岂为小事？<strong><mark>你们还要求祭司的职任吗</mark></strong>？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/16/#L10">民 16:10</a>)</p></blockquote><p>之后上帝的荣光显现，地开了口，吞灭了叛乱者：</p><blockquote><p>“<strong><mark>可拉招聚全会众到会幕门前</mark></strong>，要攻击摩西、亚伦；耶和华的荣光就向全会众显现。 耶和华晓谕摩西、亚伦说： 「<strong><mark>你们离开这会众，我好在转眼之间把他们灭绝</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/16/#L19-21">民 16:19-21</a>)</p></blockquote><p>上帝吩咐把叛乱者的香炉中的火倒出，用那些香炉包祭坛，作后世的记念：</p><blockquote><p>“「你吩咐祭司亚伦的儿子以利亚撒，从火中捡起那些香炉来，把火撒在别处，因为那些香炉是圣的。 <strong><mark>把那些犯罪自害己命之人的香炉，叫人锤成片子，用以包坛</mark></strong>，那些香炉本是他们在耶和华面前献过的，所以是圣的，<strong><mark>并且可以给以色列人作记号</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/16/#L37-38">民 16:37-38</a>)</p></blockquote><blockquote><p>“<strong><mark>他们遭遇这些事都要作为鉴戒</mark></strong>，并且写在经上，正是警戒我们这末世的人。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/10/#L11">林前 10:11</a>)</p></blockquote><p>使徒犹大也记念可拉灭亡的顽梗：</p><blockquote><p>“他们有祸了！因为走了该隐的道路，又为利往巴兰的错谬里直奔，<strong><mark>并在可拉的背叛中灭亡了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iud/1/#L11">犹 1:11</a>)</p></blockquote><p>还有预言说，在末后的日子这样的人要起来：</p><blockquote><p>“因为时候要到，人必厌烦纯正的道理，<strong><mark>耳朵发痒，就随从自己的情欲，增添好些师傅</mark></strong>；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/4/#L3">提后 4:3</a>)</p></blockquote><h4>关于新约中立司祭的预言</h4><p>还在旧约里就有预言：在新约里仍要立司祭和仆人，但从一切民族中立，而不只是从亚伦的家系：</p><blockquote><p>“「我知道他们的行为和他们的意念。时候将到，<strong><mark>我必将万民万族</mark></strong>聚来，看见我的荣耀。 我要显神迹在他们中间，逃脱的我要差到列国去，就是到他施、普勒、拉弓的路德和土巴、雅完，并素来没有听见我名声、没有看见我荣耀辽远的海岛，他们必将我的荣耀传扬在列国中。 他们必将你们的弟兄从列国中送回，使他们或骑马，或坐车，坐轿，骑骡子，骑独峰驼，到我的圣山耶路撒冷，作为供物献给耶和华，好像以色列人用洁净的器皿盛供物奉到耶和华的殿中。」这是耶和华说的。 耶和华说：「<strong><mark>我也必从他们中间取人为祭司，为利未人</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/66/#L18-21">赛 66:18-21</a>)</p></blockquote><p>新约里指明，没有人可以自己取得司祭职：</p><blockquote><p>“<strong><mark>凡从人间挑选的大祭司，是奉派替人办理属上帝的事</mark></strong>，为要献上礼物和赎罪祭。 他能体谅那愚蒙的和失迷的人，因为他自己也是被软弱所困。 故此，他理当为百姓和自己献祭赎罪。 <strong><mark>这大祭司的尊荣，没有人自取</mark></strong>，<strong><mark>惟要蒙上帝所召，像亚伦一样</mark></strong>。 <strong><mark>如此，基督也不是自取荣耀作大祭司</mark></strong>，乃是在乎向他说：『你是我的儿子，我今日生你』的那一位。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/5/#L1-5">希 5:1-5</a>)</p></blockquote><h4>信了并受了洗的行邪术的西门没有传递圣灵恩赐的恩赐</h4><p>行邪术的西门，如经所记，信了并受了洗：</p><blockquote><p>“<strong><mark>西门自己也信了，既受了洗</mark></strong>，就常与腓利在一处，看见他所行的神迹和大异能，就甚惊奇。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/8/#L13">徒 8:13</a>)</p></blockquote><p>但当他明白不是所有基督徒都能传递圣灵的恩赐时，就试图向使徒们买这恩赐。使徒们为此咒诅了他：</p><blockquote><p>“<strong><mark>西门看见使徒按手，便有圣灵赐下</mark></strong>，就拿钱给使徒， 说：「<strong><mark>把这权柄也给我</mark></strong>，<strong><mark>叫我手按着谁，谁就可以受圣灵</mark></strong>。」 <strong><mark>彼得说</mark></strong>：「你的银子和你一同灭亡吧！因<strong><mark>你想上帝的恩赐是可以用钱买的</mark></strong>。 <strong><mark>你在这道上无分无关</mark></strong>，因为在上帝面前，你的心不正。 <strong><mark>你当懊悔你这罪恶</mark></strong>，祈求主，或者你心里的意念可得赦免。 <strong><mark>我看出你正在苦胆之中</mark></strong>，被罪恶捆绑。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/8/#L18-23">徒 8:18-23</a>)</p></blockquote><p>由此可见，不是所有基督徒都是有职分和上帝恩赐的司祭，能传递圣灵。给撒玛利亚人施洗的六品执事腓利也没有这恩赐（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/21/#L8">徒 21:8</a>）。而有这恩赐的人，是藉使徒的按手（<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/1/#L6">提后 1:6</a>）和司祭职的按手（<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/4/#L14">提前 4:14</a>）领受的。</p><p>这样：</p><ul><li><p>不是所有人都受了教导并施洗的托付：“所以，<strong>你们要去，使万民作我的门徒，奉父，子、圣灵的名给他们施洗</strong>”（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/28/#L19">太 28:19</a>）</p></li><li><p>不是所有人都受了命令：“<strong>你们应当如此行，为的是记念我</strong>”（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/22/#L19">路 22:19</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/11/#L24">林前 11:24</a>）</p></li><li><p>不是所有人都得了捆绑和释放的权柄：“凡你们<strong>在地上所捆绑</strong>的，在天上也要捆绑；凡你们<strong>在地上所释放</strong>的，在天上也要释放”（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/18/#L18">太 18:18</a>）</p></li><li><p>不是所有人都得了赦罪和不赦罪的权柄：“<strong>你们赦免谁的罪</strong>，谁的罪就赦免了；<strong>你们留下谁的罪</strong>，谁的罪就留下了”（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/20/#L23">约 20:23</a>）</p></li><li><p>不是所有人都得了按手赐圣灵的权柄：“<strong>西门看见使徒按手，便有圣灵赐下</strong>”（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/8/#L18">徒 8:18</a>）</p></li><li><p>使徒吩咐请来的，正是长老，病人藉他们的祈祷和事奉（用油抹）可以得赦罪：“<strong>他就该请教会的长老来</strong>，他们可以<strong>奉主的名用油抹他</strong>，为他祷告。……<strong>他若犯了罪，也必蒙赦免</strong>”（<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/5/#L14-15">雅 5:14-15</a>）</p></li></ul><h2>君尊的祭司——如何理解？</h2><p>无论在旧约还是新约，每个信徒都被召在自己的殿——自己的身体——里作祭司。<a href="https://bibleox.com/ru/ru/w/человек-храм-Божий">人——上帝的殿</a>，而祭司就是在这殿里向上帝献祭的人。使徒彼得正是从这个思想开始，然后才讲到君尊的祭司：</p><blockquote><p>“你们来到主面前，也就像活石，<strong><mark>被建造成为灵宫</mark></strong>，<strong><mark>作圣洁的祭司</mark></strong>，借着耶稣基督<strong><mark>奉献上帝所悦纳的灵祭</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/2/#L5">彼前 2:5</a>)</p></blockquote><p>讲君尊的祭司时，使徒彼得在同一封书信里也讲到牧人和必须顺服他们：</p><blockquote><p>“<strong><mark>你们年幼的也要顺服年长的</mark></strong>。就是你们众人也都要以谦卑束腰，彼此顺服，『<strong><mark>因为上帝阻挡骄傲的人，赐恩给谦卑的人</mark></strong>。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/5/#L5">彼前 5:5</a>)</p></blockquote><p>还有一处关于基督徒为祭司的话：</p><blockquote><p>“并那诚实作见证的、从死里首先复活、为世上君王元首的耶稣基督，有恩惠、平安归与你们！他爱我们，用自己的血使我们脱离罪恶， <strong><mark>又使我们成为国民，作他父上帝的祭司</mark></strong>。但愿荣耀，权能归给他，直到永永远远。阿们！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/1/#L5-6">启 1:5-6</a>)</p></blockquote><blockquote><p>“他们唱新歌，说：「你配拿书卷，配揭开七印。因为你曾被杀，用自己的血从各族、各方、各民、各国中买了人来，叫他们归于上帝， <strong><mark>又叫他们成为国民，作祭司，归于上帝，在地上执掌王权</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/5/#L9-10">启 5:9-10</a>)</p></blockquote><blockquote><p>“在头一次复活有分的有福了、圣洁了！第二次的死在他们身上没有权柄。<strong><mark>他们必作上帝和基督的祭司</mark></strong>，并要与基督一同作王一千年。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/20/#L6">启 20:6</a>)</p></blockquote><p>基督徒怎样是王，也就怎样是祭司。如果他现在不掌管外在的人，也就不是外在之人的祭司。这样的解释对上下文是诚实的，也符合常识。</p><p>基督徒被召在自己的身体里为王——使自己的理智掌管身体的私欲；而洁净了这上帝的殿（自己的身体和心）之后，应当在那里献上蒙上帝悦纳的祭：纯洁的思想、言语、行为、祈祷和颂赞。</p><h2>尊敬司祭</h2><blockquote><p>“<strong><mark>那善于管理教会的长老，当以为配受加倍的敬奉</mark></strong>。那劳苦传道教导人的，更当如此。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/5/#L17">提前 5:17</a>)</p></blockquote><blockquote><p>“<strong>你当全心敬畏上主，并尊敬他的司祭。</strong>” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/7/#L31">德 7:31</a>)</p></blockquote><blockquote><p>“<strong>你当全灵恭敬上主，尊敬司祭。</strong>” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/7/#L33">德 7:33</a>)</p></blockquote><h2>必须顺服司祭职</h2><blockquote><p>“<strong><mark>你们要依从那些引导你们的，且要顺服</mark></strong>，<strong><mark>因他们为你们的灵魂时刻儆醒</mark></strong>，好像那将来交账的人。你们要使他们交的时候有快乐，不至忧愁；若忧愁就与你们无益了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/13/#L17">希 13:17</a>)</p></blockquote><blockquote><p>“<strong><mark>你们年幼的也要顺服年长的</mark></strong>。就是你们众人也都要以谦卑束腰，彼此顺服，『<strong><mark>因为上帝阻挡骄傲的人，赐恩给谦卑的人</mark></strong>。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/5/#L5">彼前 5:5</a>)</p></blockquote><p>在旧约里，不听从司祭审判官——是致死的罪：</p><blockquote><p>“<strong><mark>若有人擅敢不听从那侍立在耶和华你上帝面前的祭司</mark></strong>，或不听从审判官，<strong><mark>那人就必治死</mark></strong>。这样，便将那恶从以色列中除掉。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/17/#L12">申 17:12</a>)</p></blockquote><h2>对异议的回应</h2><h3>“藉按手赐下圣灵——这只是西门的误解？”</h3><p>正教徒在圣经里指出关于藉按手传递圣灵之特殊恩赐的引文。这些引文中有行邪术的（术士）西门的情形。</p><p>行邪术的西门看见，不是每个基督徒都能按手以赐下圣灵。字面上说：不是人人都有这权柄。他拿钱给使徒，要他们也给他这权柄（使徒们为此咒诅了他）：</p><blockquote><p>“<strong><mark>西门看见使徒按手，便有圣灵赐下</mark></strong>，就拿钱给使徒， 说：「<strong><mark>把这权柄也给我</mark></strong>，<strong><mark>叫我手按着谁，谁就可以受圣灵</mark></strong>。」 彼得说：「你的银子和你一同灭亡吧！因<strong><mark>你想上帝的恩赐是可以用钱买的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/8/#L18-20">徒 8:18-20</a>)</p></blockquote><p>批评者说，这只是行邪术的西门的错误理解：他毕竟是术士，所以一切都理解错了。</p><p>那使徒保罗也是术士吗？</p><blockquote><p>“为此我提醒你，<strong><mark>使你将上帝藉我按手所给你的恩赐</mark></strong>，再如火挑旺起来。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/1/#L6">提后 1:6</a>)</p></blockquote><blockquote><p>“<strong><mark>你不要轻忽所得的恩赐</mark></strong>，<strong><mark>就是从前借着预言、在众长老按手的时候赐给你的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/4/#L14">提前 4:14</a>)</p></blockquote><p>使徒直接说：上帝的恩赐是藉他的按手赐下的。</p><p>回到西门的情形。使徒行传中的这个故事是福音史家路加写的（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/1/#L3">路 1:3</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/act/1/#L1">徒 1:1</a>）。他写的不是西门仿佛对事件有什么错误的理解，而是西门只是<strong>看见</strong>了。他看见了什么？福音史家路加写道：“西门看见使徒按手，便有圣灵赐下”——这就是他所看见的。这不是西门在说，而是福音史家路加。接着从使徒彼得的话可以清楚：这确实如此——使徒能够传递这上帝的恩赐，而他责备西门的，正是他想<strong>用钱</strong>得到<strong>上帝的恩赐</strong>。</p><h3>“使徒保罗的按立不是经过人？”</h3><p>正教徒表明，使徒保罗的职分是教会按立的：</p><blockquote><p>“他们事奉主，禁食的时候，圣灵说：「<strong><mark>要为我分派巴拿巴和扫罗</mark></strong>，去作我召他们所作的工。」 <strong><mark>于是禁食祷告，按手在他们头上</mark></strong>，就打发他们去了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/13/#L2-3">徒 13:2-3</a>)</p></blockquote><p>批评者反驳说，使徒保罗不是被人按立的，并引用一节经文：</p><blockquote><p>“作使徒的保罗（<strong><mark>不是由于人，也不是借着人</mark></strong>，乃是借着耶稣基督，与叫他从死里复活的父上帝），” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/1/#L1">加 1:1</a>)</p></blockquote><p>但这指控没有根据，因为这里说的是拣选的方式，而不是上帝恩赐的传递。</p><p>在按手在扫罗身上之前，确实是圣灵自己拣选了他，并吩咐教会把扫罗分别出来，担任经上所说圣灵召他去的事奉。批评者引用这节经文是为了什么——不明白，因为并没有矛盾：扫罗不是由人、也不是通过人拣选的，而是圣灵自己拣选了他，吩咐教会把他分别出来担任事奉，之后教会给扫罗按手：</p><blockquote><p>“他们事奉主，禁食的时候，<strong><mark>圣灵说</mark></strong>：「<strong><mark>要为我分派巴拿巴和扫罗</mark></strong>，<strong><mark>去作我召他们所作的工</mark></strong>。」 <strong><mark>于是禁食祷告，按手在他们头上</mark></strong>，就打发他们去了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/13/#L2-3">徒 13:2-3</a>)</p></blockquote><p>这样，拣选是圣灵行的，而恩典的赐下不是不经教会，而是经由教会——经由她仆人们的按手。</p><p>批评者试图以此论证他们所建立的团体与最早的基督徒没有任何直接联系，论证他们自行选立牧师和教师。显然，自己没有从上帝来的权柄管理并教导教会的人，不能把这样的权柄给任何人。但他们要紧的是表明一种可能性：仿佛圣灵可以这样作——仿佛可以不经任何与他们之前已存在的教会的联系，立他们的牧师担任事奉。</p><p>然而，虽然圣灵愿意作什么就作什么，我们在圣经里看不到一例：上帝脱离基督所建立的合一的、看得见的教会而立人担任事奉并拯救人。</p><p>上帝拣选了扫罗；虽然他无疑可以亲自立他担任事奉，但没有不经自己的教会这样做。同样我们在最初外邦人受洗的事上也看到：埃提阿伯的太监（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/8/#L27">徒 8:27</a>）和百夫长哥尼流（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/10/#L1">徒 10:1</a>）。</p><ol><li><p>埃提阿伯的太监在读圣经，却不明白。<strong>上帝本可以</strong>亲自教导太监并赐下洗礼的救人恩典，<strong>但没有脱离教会这样做</strong>。上帝差教会到太监那里，教会教导他明白圣经，并在洗礼中赐下恩典。</p></li><li><p>百夫长哥尼流祈祷上帝、行善事。<strong>上帝本可以</strong>亲自把救人的恩典赐给哥尼流，<strong>但没有脱离教会这样做</strong>。他反而差天使到他那里，吩咐他去找教会（以使徒彼得为代表）。当使徒来到时，圣灵才降在哥尼流身上——虽然它同样可以早些、不经使徒而降临，但它没有这样做。</p></li><li><p>逼迫基督徒的扫罗（未来的使徒保罗）往大马士革去逼迫基督徒。基督以耀眼的光向他显现；扫罗问他该作什么。基督上帝<strong>本可以</strong>亲自把恩典赐给扫罗，<strong>但没有脱离教会这样做</strong>，而是吩咐他到大马士革去找教会（以使徒亚拿尼亚为代表）；只有在那里，使徒才藉着教会使他复原（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/9/#L17">徒 9:17</a>），赐下圣灵的恩典（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/9/#L17">徒 9:17</a>），并在洗礼中赐下洗净他罪的救人恩典（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/22/#L16">徒 22:16</a>）。</p></li></ol><p>同样，在一切情形中，包括按立扫罗担任特殊的使徒职分：上帝自己拣选扫罗，上帝本可以亲自把他的恩赐赐给他，但没有脱离自己的教会这样做。圣灵向教会说话，教会给扫罗按手（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/13/#L2-3">徒 13:2-3</a>）。</p><p>所以，那些与教会分离的团体宣称他们的牧师有脱离教会的特殊蒙召，在圣经里没有任何依据。圣经里根本没有这样的例子。</p><h3>“按手是从异教借来的？”</h3><p>那些自行建立教会的人，首先必须证明基督一次所建立的教会已经堕落。因为如果教会没有堕落，那他们的新团体就不需要，只要进入基督的教会即可。为证明教会的堕落，常用“贴标签”的手法——贴上尽可能可怕的标签。于是教会常被指控偏离上帝、因借用异教实践而堕入异教，被点名的有：</p><ul><li><p>圣殿的存在；</p></li><li><p>圣地；</p></li><li><p>圣物；</p></li><li><p>圣像；</p></li><li><p>特别的神圣之人（司祭）；</p></li><li><p>圣规程和圣奥秘（仿佛是影响上帝的药方），其中包括按手。</p></li></ul><p>这是极其荒唐的指控，因为这一切都是上帝亲自设立的，并且圣经里都有直接的经文。把异教拉到这里来，只是为了给教会贴标签。所有这些神圣的建筑、地方、物件、行动和人，在新旧约圣经里都有——详见<a href="https://bibleox.com/ru/ru/w/святыня">圣物</a>一文。</p><h4>旧约中的按手</h4><p>雅各以祈祷按手祝福了自己的孙子：</p><blockquote><p>“<strong><mark>以色列伸出右手来</mark></strong>，<strong><mark>按在以法莲的头上</mark></strong>，以法莲乃是次子；<strong><mark>又剪搭过左手来按在玛拿西的头上</mark></strong>，玛拿西原是长子。 <strong><mark>他就给约瑟祝福说</mark></strong>：「愿我祖亚伯拉罕和我父以撒所事奉的上帝，就是一生牧养我，直到今日的上帝， 救赎我脱离一切患难的那使者，<strong><mark>赐福与这两个童子</mark></strong>。愿他们归在我的名下和我祖亚伯拉罕、我父以撒的名下，又愿他们在世界中，生养众多。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/48/#L14-16">创 48:14-16</a>)</p></blockquote><p>上帝命令先知摩西以按手立约书亚担任事奉：</p><blockquote><p>“耶和华对摩西说：「<strong><mark>嫩的儿子约书亚是心中有圣灵的</mark></strong>，<strong><mark>你将他领来，按手在他头上</mark></strong>， &lt;…&gt; 于是，摩西照耶和华所吩咐的，将约书亚领来，使他站在祭司以利亚撒和全会众面前， <strong><mark>按手在他头上，嘱咐他</mark></strong>，是照耶和华藉摩西所说的话。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/27/#L18,22-23">民 27:18,22-23</a>)</p></blockquote><blockquote><p>“<strong><mark>嫩的儿子约书亚，因为摩西曾按手在他头上，就被智慧的灵充满</mark></strong>，以色列人便听从他，照着耶和华吩咐摩西的行了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/34/#L9">申 34:9</a>)</p></blockquote><p>上帝命令以按手立利未人在圣殿供职：</p><blockquote><p>“<strong><mark>将利未人奉到耶和华面前，以色列人要按手在他们头上</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/8/#L10">民 8:10</a>)</p></blockquote><h4>新约中的按手</h4><blockquote><p>“为此我提醒你，<strong><mark>使你将上帝藉我按手所给你的恩赐</mark></strong>，再如火挑旺起来。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/1/#L6">提后 1:6</a>)</p></blockquote><blockquote><p>“<strong><mark>你不要轻忽所得的恩赐</mark></strong>，就是从前借着预言、<strong><mark>在众长老按手的时候赐给你的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/4/#L14">提前 4:14</a>)</p></blockquote><blockquote><p>“<strong><mark>各样洗礼、按手之礼</mark></strong>、死人复活，以及永远审判各等教训。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/6/#L2">希 6:2</a>)</p></blockquote><p>研读圣经之后，那些指责教会仿佛在使徒之后从异教借来这些实践及其态度的说法，就令人惊讶了——使徒们自己写的正是上帝的恩赐<strong>藉着</strong>他们手的按手而赐下，并且把这作为教导的一部分。这一切（这方式本身）不是新发明，而是在使徒之前的同一环境里已存在了几个世纪的东西——设立它的不是异教徒，而是上帝自己。</p><h3>“新约里没有称祭司？”</h3><p>“祭司职”一词在新约的语境中出现。基督更换了祭司职，而不是废除它：</p><blockquote><p>“<strong><mark>祭司的职任既已更改</mark></strong>，律法也必须更改。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/7/#L12">希 7:12</a>)</p></blockquote><p>基督成为永远的大祭司，但司祭没有被废除。关于他们的拣选和设立，预言里有话：</p><blockquote><p>“「我知道他们的行为和他们的意念。时候将到，<strong><mark>我必将万民万族</mark></strong>聚来，看见我的荣耀。 我要显神迹在他们中间，逃脱的我要差到列国去，就是到他施、普勒、拉弓的路德和土巴、雅完，并素来没有听见我名声、没有看见我荣耀辽远的海岛，他们必将我的荣耀传扬在列国中。 他们必将你们的弟兄从列国中送回，使他们或骑马，或坐车，坐轿，骑骡子，骑独峰驼，到我的圣山耶路撒冷，作为供物献给耶和华，好像以色列人用洁净的器皿盛供物奉到耶和华的殿中。」这是耶和华说的。 耶和华说：「<strong><mark>我也必从他们中间取人为祭司，为利未人</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/66/#L18-21">赛 66:18-21</a>)</p></blockquote><p>此外，实际上正是使徒们是祭司——不是随便什么人。旧约里司祭有洁净人罪的职责（<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/5/#L5-6">利 5:5-6</a>）；同样在新约里，新的教会等次建立时，这权柄被赐给它——赦罪或不赦罪：</p><blockquote><p>“耶稣又对他们说：「愿你们平安！父怎样差遣了我，我也照样差遣你们。」 说了这话，就向他们吹一口气，说：「<strong><mark>你们受圣灵</mark></strong>。 <strong><mark>你们赦免谁的罪，谁的罪就赦免了</mark></strong>；<strong><mark>你们留下谁的罪，谁的罪就留下了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/20/#L21-23">约 20:21-23</a>)</p></blockquote><p>最早的基督徒证实：长老们也是祭司——见<a href="https://bibleox.com/ru/ru/w/gq8M_Новозаветные_пресвитеры__священники">引文</a>。</p>
