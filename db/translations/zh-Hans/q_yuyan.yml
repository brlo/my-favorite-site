  title: 基督的第二次降临
  copy_cover: true
  body: <h2>基督第二次降临之前的事件</h2><h3>敌基督在地上短暂的统治</h3><blockquote><p>“弟兄们，论到我们主耶稣基督降临和我们到他那里聚集， 我劝你们：无论有灵、有言语、有冒我名的书信，说主的日子现在到了，不要轻易动心，也不要惊慌。 人不拘用什么法子，你们总不要被他诱惑！因为<strong><mark>那日子以前，必有离道反教的事</mark></strong>，<strong><mark>并有那大罪人，就是沉沦之子，显露出来</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2sol/2/#L1-3">帖后 2:1-3</a>)</p></blockquote><p>详情见注释[2]。</p><h2>主耶稣基督第二次降临时的事件</h2><h3>天上要出现十字架</h3><blockquote><p>“<strong><mark>那时，人子的兆头要显在天上</mark></strong>，<strong><mark>地上的万族都要哀哭</mark></strong>。他们要看见人子有能力，有大荣耀，<strong><mark>驾着天上的云降临</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/24/#L30">太 24:30</a>)</p></blockquote><h3>基督要与所有圣洁的天使一同来临</h3><p>基督的第二次降临将带着父的荣耀，与所有圣洁的天使一同来临：</p><blockquote><p>“当人子在他荣耀里，<strong><mark>同着众天使降临的时候</mark></strong>，要坐在他荣耀的宝座上。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/25/#L31">太 25:31</a>)</p></blockquote><blockquote><p>“凡在这淫乱罪恶的世代，把我和我的道当作可耻的，人子在他父的荣耀里，<strong><mark>同圣天使降临的时候</mark></strong>，也要把那人当作可耻的。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/8/#L38">可 8:38</a>)</p></blockquote><blockquote><p>“人子要在他父的荣耀里，<strong><mark>同着众使者降临</mark></strong>；那时候，他要照各人的行为报应各人。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/16/#L27">太 16:27</a>)</p></blockquote><blockquote><p>“亚当的七世孙以诺曾预言这些人说：『看哪，<strong><mark>主带着他的千万圣者降临</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iud/1/#L14">犹 1:14</a>)</p></blockquote><blockquote><p>“好使你们<strong><mark>当我们主耶稣同他众圣徒来的时候</mark></strong>，在我们父上帝面前心里坚固，成为圣洁，无可责备。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1sol/3/#L13">帖前 3:13</a>)</p></blockquote><blockquote><p>“也必使你们这受患难的人与我们同得平安。那时，<strong><mark>主耶稣同他有能力的天使从天上在火焰中显现</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2sol/1/#L7">帖后 1:7</a>)</p></blockquote><blockquote><p>“你们要从我山的谷中逃跑，因为山谷必延到亚萨。你们逃跑，必如犹大王乌西雅年间的人逃避大地震一样。<strong><mark>耶和华我的上帝必降临，有一切圣者同来</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/zah/14/#L5">亚 14:5</a>)</p></blockquote><h3>他将施行死人的普遍复活</h3><p>所有曾经活过的人——义人和不义的人——的普遍复活：</p><blockquote><p>“并且靠着上帝，盼望死人，<strong><mark>无论善恶，都要复活</mark></strong>，就是他们自己也有这个盼望。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/24/#L15">徒 24:15</a>)</p></blockquote><p>复活将在改变后的不朽身体中发生，义人要发光如同太阳：</p><blockquote><p>“<strong><mark>那时，义人在他们父的国里，要发出光来，像太阳一样</mark></strong>。有耳可听的，就应当听！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/13/#L43">太 13:43</a>)</p></blockquote><p>在第二次降临之前死去的人，其灵魂停留在等候复活的居所。义人的灵魂与基督在天上一同喜乐（<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/12/#L22-23">希 12:22-23</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/6/#L9-11">启 6:9-11</a>），而罪人的灵魂则在另一处受苦（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/16/#L23">路 16:23</a>）。</p><p>那些到基督第二次降临的时刻还没有经历死亡的人，他们的身体也将像从死里复活之人的身体一样改变：</p><blockquote><p>“<strong><mark>死人复活也是这样：所种的是必朽坏的，复活的是不朽坏的</mark></strong>； &lt;…&gt; <strong><mark>所种的是血气的身体，复活的是灵性的身体</mark></strong>。若有血气的身体，也必有灵性的身体。 &lt;…&gt; 我如今把一件奥祕的事告诉你们：<strong><mark>我们不是都要睡觉，乃是都要改变</mark></strong>， <strong><mark>就在一霎时，眨眼之间，号筒末次吹响的时候</mark></strong>。因号筒要响，<strong><mark>死人要复活，成为不朽坏的，我们也要改变</mark></strong>。 <strong><mark>这必朽坏的总要变成不朽坏的</mark></strong>，这必死的总要变成不死的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/15/#L42,44,51-53">林前 15:42,44,51-53</a>)</p></blockquote><blockquote><p>“<strong><mark>论到睡了的人</mark></strong>，我们不愿意弟兄们不知道，恐怕你们忧伤，像那些没有指望的人一样。 我们若信耶稣死而复活了，<strong><mark>那已经在耶稣里睡了的人，上帝也必将他与耶稣一同带来</mark></strong>。 我们现在照主的话告诉你们一件事：<strong><mark>我们这活着还存留到主降临的人，断不能在那已经睡了的人之先</mark></strong>， 因为<strong><mark>主必亲自从天降临</mark></strong>，有呼叫的声音和天使长的声音，又有上帝的号吹响；<strong><mark>那在基督里死了的人必先复活</mark></strong>。 <strong><mark>以后我们这活着还存留的人必和他们一同被提到云里</mark></strong>，在空中与主相遇。<strong><mark>这样，我们就要和主永远同在</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1sol/4/#L13-17">帖前 4:13-17</a>)</p></blockquote><h3>基督将差遣天使聚集万民受审</h3><p>天使将聚集义人和不义的人：</p><blockquote><p>“<strong><mark>他要差遣天使，把他的选民</mark></strong>，从四方，从地极直到天边，都招聚了来。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/13/#L27">可 13:27</a>)</p></blockquote><blockquote><p>“<strong><mark>人子要差遣使者，把一切叫人跌倒的和作恶的，从他国里挑出来</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/13/#L41">太 13:41</a>)</p></blockquote><h3>基督将宣告判决</h3><blockquote><p>“<strong><mark>当人子在他荣耀里</mark></strong>，同着众天使降临的时候，<strong><mark>要坐在他荣耀的宝座上</mark></strong>。 万民都要聚集在他面前。他要把他们分别出来，<strong><mark>好像牧羊的分别绵羊山羊一般</mark></strong>； 把绵羊安置在右边，山羊在左边。 于是，王要向那右边的说：『<strong><mark>你们这蒙我父赐福的，可来承受那创世以来为你们所预备的国</mark></strong>。 因为我饿了，你们给我吃；渴了，你们给我喝；我作客旅，你们留我住； 我赤身露体，你们给我穿；我病了，你们看顾我；我在监里，你们来看我。』 义人就回答说：『主啊，我们什么时候见你饿了，给你吃，渴了，给你喝？ 什么时候见你作客旅，留你住，或是赤身露体，给你穿？ 又什么时候见你病了，或是在监里，来看你呢？』 王要回答说：『我实在告诉你们：这些事你们既作在我这弟兄中一个最小的身上，就是作在我身上了。』 王又要向那左边的说：『<strong><mark>你们这被咒诅的人，离开我</mark></strong>，进入那为魔鬼和他的使者所预备的永火里去！ 因为我饿了，你们不给我吃；渴了，你们不给我喝； 我作客旅，你们不留我住；我赤身露体，你们不给我穿；我病了，我在监里，你们不来看顾我。』 他们也要回答说：『主啊，我们什么时候见你饿了，或渴了，或作客旅，或赤身露体，或病了，或在监里，不伺候你呢？』 王要回答说：『我实在告诉你们：这些事你们既不作在我这弟兄中一个最小的身上，就是不作在我身上了。』 <strong><mark>这些人，要往永刑里去</mark></strong>；<strong><mark>那些义人，要往永生里去</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/25/#L31-46">太 25:31-46</a>)</p></blockquote><h3>得救的人将被接到与基督同在的永生里</h3><p>在此之前，他们只是以灵魂与基督同在，等候身体的复活。如今，义人将在得了改变的身体（复活之后）后被接到与基督同在的永生里：</p><blockquote><p>“因为主必亲自从天降临，有呼叫的声音和天使长的声音，又有上帝的号吹响；<strong><mark>那在基督里死了的人必先复活</mark></strong>。 <strong><mark>以后我们这活着还存留的人必和他们一同被提到云里，在空中与主相遇</mark></strong>。<strong><mark>这样，我们就要和主永远同在</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1sol/4/#L16-17">帖前 4:16-17</a>)</p></blockquote><h3>灭亡的人将被送去受永远的刑罚</h3><blockquote><p>“<strong><mark>这些人，要往永刑里去</mark></strong>；<strong><mark>那些义人，要往永生里去</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/25/#L46">太 25:46</a>)</p></blockquote><p>救恩与刑罚，如经上所记，都将是永远的。</p><h2>第二次降临的重要细节</h2><h3>降临——如同闪电</h3><p>基督的第二次降临将立刻被全世界的人知道，如同闪过的闪电：</p><blockquote><p>“人将要对你们说：『看哪，在那里！看哪，在这里！』<strong><mark>你们不要出去，也不要跟随他们</mark></strong>！ 因为<strong><mark>人子在他降临的日子</mark></strong>，<strong><mark>好像闪电从天这边一闪直照到天那边</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/17/#L23-24">路 17:23-24</a>)</p></blockquote><blockquote><p>“若有人对你们说，『看哪，基督在旷野里』，<strong><mark>你们不要出去</mark></strong>；或说，『看哪，基督在内屋中』，<strong><mark>你们不要信</mark></strong>。 <strong><mark>闪电从东边发出，直照到西边；人子降临，也要这样</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/24/#L26-27">太 24:26-27</a>)</p></blockquote><h3>基督将以他已有的成人身体来临</h3><p>基督不会再次由人所生，而是带着他已有的身体来临——那身体是他在公元一世纪由童贞女马利亚上帝之母所生时获得的：</p><blockquote><p>“说了这话，他们正看的时候，<strong><mark>他就被取上升，有一朵云彩把他接去</mark></strong>，便看不见他了。 当他往上去，他们定睛望天的时候，忽然有两个人身穿白衣，站在旁边，说： 「加利利人哪，你们为什么站着望天呢？<strong><mark>这离开你们被接升天的耶稣，你们见他怎样往天上去，他还要怎样来</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/1/#L9-11">徒 1:9-11</a>)</p></blockquote><h3>降临是为了审判</h3><p>主来不是为了教导，而是按他第一次来时所已经赐下的话语施行审判：</p><blockquote><p>“弃绝我不领受我话的人，有审判他的；<strong><mark>就是我所讲的道，在末日要审判他</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/12/#L48">约 12:48</a>)</p></blockquote><blockquote><p>“人子要在他父的荣耀里，同着众使者降临；那时候，<strong><mark>他要照各人的行为报应各人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/16/#L27">太 16:27</a>)</p></blockquote><blockquote><p>“<strong><mark>当人子在他荣耀里</mark></strong>，同着众天使降临的时候，<strong><mark>要坐在他荣耀的宝座上</mark></strong>。 万民都要聚集在他面前。他要把他们分别出来，<strong><mark>好像牧羊的分别绵羊山羊一般</mark></strong>； 把绵羊安置在右边，山羊在左边。 &lt;…&gt; <strong><mark>这些人，要往永刑里去</mark></strong>；<strong><mark>那些义人，要往永生里去</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/25/#L31-33,46">太 25:31-33,46</a>)</p></blockquote><blockquote><p>“<strong><mark>这正是上帝公义判断的明证</mark></strong>，叫你们可算配得上帝的国，你们就是为这国受苦。 上帝既是公义的，就必将患难报应那加患难给你们的人； 也必使你们这受患难的人与我们同得平安。<strong><mark>那时，主耶稣同他有能力的天使从天上在火焰中显现</mark></strong>， <strong><mark>要报应那不认识上帝和那不听从我主耶稣福音的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2sol/1/#L5-8">帖后 1:5-8</a>)</p></blockquote><h3>第二次降临与审判密不可分</h3><p>在基督第二次降临时，施行审判的对象是一切的人，而不只是罪人。主要赏赐一些人，刑罚另一些人：</p><blockquote><p>“<strong><mark>当人子在他荣耀里</mark></strong>，<strong><mark>同着众天使降临的时候</mark></strong>，<strong><mark>要坐在他荣耀的宝座上</mark></strong>。 <strong><mark>万民都要聚集在他面前</mark></strong>。他要把他们分别出来，<strong><mark>好像牧羊的分别绵羊山羊一般</mark></strong>； 把绵羊安置在右边，山羊在左边。 &lt;…&gt; <strong><mark>这些人，要往永刑里去</mark></strong>；<strong><mark>那些义人，要往永生里去</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/25/#L31-33,46">太 25:31-33,46</a>)</p></blockquote><blockquote><p>“<strong><mark>我又看见一个白色的大宝座与坐在上面的</mark></strong>，从他面前天地都逃避，再无可见之处了。 我又看见死了的人，无论大小，都站在宝座前。案卷展开了，并且另有一卷展开，就是生命册；<strong><mark>死了的人都凭着这些案卷所记载的，照他们所行的受审判</mark></strong>。 于是海交出其中的死人，<strong><mark>死亡和阴间也交出其中的死人</mark></strong>，他们都照各人所行的受审判。 死亡和阴间也被扔在火湖里，<strong><mark>这火湖就是第二次的死</mark></strong>。 若有人名字没记在生命册上，他就被扔在火湖里。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/20/#L11-15">启 20:11-15</a>)</p></blockquote><blockquote><p>“<strong><mark>人子要在他父的荣耀里</mark></strong>，<strong><mark>同着众使者降临</mark></strong>；那时候，<strong><mark>他要照各人的行为报应各人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/16/#L27">太 16:27</a>)</p></blockquote><blockquote><p>“<strong><mark>当人子在他荣耀里，同着众天使降临的时候</mark></strong>，<strong><mark>要坐在他荣耀的宝座上</mark></strong>。 <strong><mark>万民都要聚集在他面前</mark></strong>。他要把他们分别出来，<strong><mark>好像牧羊的分别绵羊山羊一般</mark></strong>； &lt;…&gt; 于是，王要向那右边的说：『<strong><mark>你们这蒙我父赐福的</mark></strong>，可来承受那创世以来为你们所预备的国。 &lt;…&gt; 王又要向那左边的说：『<strong><mark>你们这被咒诅的人</mark></strong>，离开我，进入那为魔鬼和他的使者所预备的永火里去！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/25/#L31-32,34,41">太 25:31-32,34,41</a>)</p></blockquote><blockquote><p>“<strong><mark>这正是上帝公义判断的明证</mark></strong>，叫你们可算配得上帝的国，你们就是为这国受苦。 上帝既是公义的，就必将患难报应那加患难给你们的人； 也必使你们这受患难的人与我们同得平安。<strong><mark>那时，主耶稣同他有能力的天使从天上在火焰中显现</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2sol/1/#L5-7">帖后 1:5-7</a>)</p></blockquote><blockquote><p>“他又对我说：「<strong><mark>不可封了这书上的预言，因为日期近了</mark></strong>。 <strong><mark>不义的，叫他仍旧不义</mark></strong>；污秽的，叫他仍旧污秽；为义的，叫他仍旧为义；圣洁的，叫他仍旧圣洁。」 「<strong><mark>看哪，我必快来</mark></strong>！赏罚在我，<strong><mark>要照各人所行的报应他</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/22/#L10-12">启 22:10-12</a>)</p></blockquote><h3>众人都要受审判</h3><blockquote><p>“<strong><mark>因为我们众人必要在基督台前显露出来</mark></strong>，叫各人<strong><mark>按着本身所行的</mark></strong>，<strong><mark>或善或恶受报</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/5/#L10">林后 5:10</a>)</p></blockquote><blockquote><p>“<strong><mark>因为人所作的事，连一切隐藏的事，无论是善是恶，上帝都必审问</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ekl/12/#L14">传 12:14</a>)</p></blockquote><blockquote><p>“<strong><mark>因为时候到了，审判要从上帝的家起首</mark></strong>。若是先从我们起首，那不信从上帝福音的人将有何等的结局呢？ 『<strong><mark>若是义人仅仅得救</mark></strong>，那不虔敬和犯罪的人，将有何地可站呢？』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/4/#L17-18">彼前 4:17-18</a>)</p></blockquote><blockquote><p>“你这个人，为什么论断弟兄呢？又为什么轻看弟兄呢？<strong><mark>因我们都要站在上帝的台前</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/14/#L10">罗 14:10</a>)</p></blockquote><blockquote><p>“你们既然要按使人自由的律法受审判，<strong><mark>就该照这律法说话行事</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/2/#L12">雅 2:12</a>)</p></blockquote><blockquote><p>“当人子在他荣耀里，同着众天使降临的时候，要坐在他荣耀的宝座上。 <strong><mark>万民都要聚集在他面前</mark></strong>。他要把他们分别出来，<strong><mark>好像牧羊的分别绵羊山羊一般</mark></strong>；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/25/#L31-32">太 25:31-32</a>)</p></blockquote><h3>审判从教会开始</h3><blockquote><p>“因为<strong><mark>时候到了，审判要从上帝的家起首</mark></strong>。<strong><mark>若是先从我们起首</mark></strong>，那不信从上帝福音的人将有何等的结局呢？ 『<strong><mark>若是义人仅仅得救</mark></strong>，那不虔敬和犯罪的人，将有何地可站呢？』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/4/#L17-18">彼前 4:17-18</a>)</p></blockquote><h3>圣徒要审判世界</h3><blockquote><p>“耶稣说：「我实在告诉你们：你们这跟从我的人，到复兴的时候，人子坐在他荣耀的宝座上，<strong><mark>你们也要坐在十二个宝座上，审判以色列十二个支派</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/19/#L28">太 19:28</a>)</p></blockquote><blockquote><p>“我将国赐给你们，正如我父赐给我一样， 叫你们在我国里，坐在我的席上吃喝，并且<strong><mark>坐在宝座上，审判以色列十二个支派</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/22/#L29-30">路 22:29-30</a>)</p></blockquote><blockquote><p>“<strong><mark>岂不知圣徒要审判世界吗</mark></strong>？若世界为你们所审，难道你们不配审判这最小的事吗？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/6/#L2">林前 6:2</a>)</p></blockquote><h3>许多人将惊讶地发现自己并未得救</h3><p>他们以为自己是得救的：</p><blockquote><p>“<strong><mark>当那日，必有许多人对我说</mark></strong>：『主阿，主阿，我们不是奉你的名传道，奉你的名赶鬼，<strong><mark>奉你的名行许多异能吗</mark></strong>？』 我就明明地告诉他们说：『<strong><mark>我从来不认识你们，你们这些作恶的人，离开我去吧</mark></strong>！』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/7/#L22-23">太 7:22-23</a>)</p></blockquote><h3>世界的更新</h3><blockquote><p>“<strong><mark>我又看见一个新天新地</mark></strong>。因为先前的天地已经过去了，海也不再有了。 我又看见圣城新耶路撒冷由上帝那里从天而降，预备好了，就如新妇妆饰整齐，等候丈夫。 我听见有大声音从宝座出来说：「看哪！上帝的帐幕在人间。他要与人同住，他们要作他的子民，上帝要亲自与他们同在，作他们的上帝。 上帝要擦去他们一切的眼泪，不再有死亡，也不再有悲哀、哭号、疼痛，因为以前的事都过去了。」 <strong><mark>坐宝座的说</mark></strong>：「<strong><mark>看哪！我将一切都更新了</mark></strong>。」又说：「你要写上，因这些话是可信的，是真实的。」 他又对我说：「都成了！<strong><mark>我是阿拉法，我是俄梅戛</mark></strong>；我是初，我是终。<strong><mark>我要将生命泉的水白白赐给那口渴的人喝</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/21/#L1-6">启 21:1-6</a>)</p></blockquote><h2>关于「一千年」的说法</h2><h3>一千年——是从基督第一次降临到第二次降临这一时期的象征性名称</h3><p>第一次降临已经发生过。上帝之子降生成人，并未停止他所是的（上帝），而又成为了人。他教导人，受难，复活，升天，建立了教会（唯一的：地上的和天上的），并差人去传道。那些回应基督传道、进入他的教会、达到救恩并与他在天上同活的人，经上说是与他一同掌王的，虽然他们的身体还死在土里，而<a href="https://bibleox.com/ru/ru/w/жизнь-души-после-смерти-тела">他们的灵魂与基督同在</a>。这样将持续到主耶稣基督的第二次降临；那时候除了上帝没有人知道（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/1/#L7">徒 1:7</a>）。从第一次降临到第二次降临的整个时期，被形象地称为一千年：</p><blockquote><p>“我又看见一位天使从天降下，手里拿着无底坑的钥匙和一条大鍊子。 <strong><mark>他捉住那龙，就是古蛇，又叫魔鬼，也叫撒但，把牠捆绑一千年</mark></strong>， 扔在无底坑里，将无底坑关闭，用印封上，使牠不得再迷惑列国。<strong><mark>等到那一千年完了</mark></strong>，以后必须暂时释放牠。 我又看见几个宝座，也有坐在上面的，并有审判的权柄赐给他们。我又看见那些因为给耶稣作见证，并为上帝之道被斩者的灵魂，和那没有拜过兽与兽像、也没有在额上和手上受过他印记之人的灵魂，他们都复活了，<strong><mark>与基督一同作王一千年</mark></strong>。 <strong><mark>这是头一次的复活</mark></strong>。<strong><mark>其余的死人还没有复活，直等那一千年完了</mark></strong>。 <strong><mark>在头一次复活有分的有福了、圣洁了</mark></strong>！<strong><mark>第二次的死在他们身上没有权柄</mark></strong>。他们必作上帝和基督的祭司，<strong><mark>并要与基督一同作王一千年</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/20/#L1-6">启 20:1-6</a>)</p></blockquote><h3>论千禧年主义（千禧年说）的异端</h3><p>千禧年主义（千禧年说）——是关于基督在地上掌王一千年（1000年）的学说。东正教基督徒不能接受它，因为：</p><ol><li><p>无法承认<strong>两次身体的复活</strong>（主只教导一次身体的复活）；</p></li><li><p>无法承认<strong>两个最后审判</strong>（主同样只教导一次审判）；</p></li><li><p>无法承认在最后审判之前，为在地上统治世界而有<strong>基督特殊的降临</strong>；</p></li><li><p>无法承认在这个世界里已经有<strong>某种特殊的基督千年王国</strong>，不同于天国。</p></li></ol><p>详情：<a href="https://bibleox.com/ru/ru/w/хилиазм">千禧年主义</a>。</p><h2>论两次死亡与两次复活</h2><p>在神学家约翰使徒的启示录一书中提到（<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/20/#L1-6">启 20:1-6</a>）两次死亡和两次复活。</p><p>第一次死——在地上肉身的死亡[1]。</p><p>第二次死——在普遍最后审判时来自上帝的永恒定罪与刑罚。</p><p>第一次复活——属灵的：归向上帝、信仰、悔改、洗礼、改正生活。</p><p>第二次复活——身体的，在主耶稣基督第二次降临时发生。</p><h3>第一次复活——经由传道和洗礼归向上帝</h3><p>主捆绑了撒但。异教的膜拜开始被基督教战胜并消失。人们获得了经由洗礼、圣餐礼和在教会中的生活而在属灵上复活、进入与上帝同在的永生的可能。这一进入永生的属灵复活，在经文中被称为头一次的复活：</p><blockquote><p>“<strong><mark>这是头一次的复活</mark></strong>。其余的死人还没有复活，直等那一千年完了。 <strong><mark>在头一次复活有分的有福了、圣洁了</mark></strong>！<strong><mark>第二次的死在他们身上没有权柄</mark></strong>。他们必作上帝和基督的祭司，并要与基督一同作王一千年。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/20/#L5-6">启 20:5-6</a>)</p></blockquote><p>归向上帝被称为从死亡进入生命：</p><blockquote><p>“<strong><mark>当我们死在过犯中的时候，便叫我们与基督一同活过来</mark></strong>（你们得救是本乎恩）。 他<strong><mark>又叫我们与基督耶稣一同复活，一同坐在天上</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/2/#L5-6">弗 2:5-6</a>)</p></blockquote><p>信的人已经出死入生：</p><blockquote><p>“我实实在在的告诉你们，<strong><mark>那听我话又信差我来者的，就有永生</mark></strong>，不至于定罪，<strong><mark>是已经出死入生了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/5/#L24">约 5:24</a>)</p></blockquote><p>而不信的人则被直接称为死人：</p><blockquote><p>“耶稣说：「<strong><mark>任凭死人埋葬他们的死人</mark></strong>，你只管去传扬上帝国的道。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/9/#L60">路 9:60</a>)</p></blockquote><h3>第二次复活——所有的人带着身体复活，为受普遍的审判</h3><p>第二次复活涉及所有的人。它指一切曾经活过的人为受普遍审判而复活。所有的灵魂都回到他们复原的身体中，好叫一切趋向上帝的（灵魂与身体）得赏赐，而一切犯罪的（灵魂与身体）受刑罚。</p><blockquote><p>“并且靠着上帝，盼望死人，<strong><mark>无论善恶，都要复活</mark></strong>，就是他们自己也有这个盼望。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/24/#L15">徒 24:15</a>)</p></blockquote><h3>关于「两次复活」的详情</h3><blockquote><p>“我又看见一位天使从天降下，手里拿着无底坑的钥匙和一条大鍊子。 <strong><mark>他捉住那龙，就是古蛇，又叫魔鬼，也叫撒但，把牠捆绑一千年</mark></strong>， 扔在无底坑里，将无底坑关闭，用印封上，使牠不得再迷惑列国。<strong><mark>等到那一千年完了</mark></strong>，以后必须暂时释放牠。 我又看见几个宝座，也有坐在上面的，并有审判的权柄赐给他们。我又看见那些因为给耶稣作见证，并为上帝之道被斩者的灵魂，和那没有拜过兽与兽像、也没有在额上和手上受过他印记之人的灵魂，他们都复活了，<strong><mark>与基督一同作王一千年</mark></strong>。 <strong><mark>这是头一次的复活</mark></strong>。<strong><mark>其余的死人还没有复活，直等那一千年完了</mark></strong>。 <strong><mark>在头一次复活有分的有福了、圣洁了</mark></strong>！<strong><mark>第二次的死在他们身上没有权柄</mark></strong>。他们必作上帝和基督的祭司，并要与基督一同作王一千年。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/20/#L1-6">启 20:1-6</a>)</p></blockquote><p>对这经文的注释：</p><blockquote><p>“<strong><mark>这是头一次的复活</mark></strong>。<strong><mark>其余的死人还没有复活，直等那一千年完了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/20/#L5">启 20:5</a>)</p></blockquote><p>上帝给所有人规定了时间，使他们可以在头一次复活的时期内复活，并且为此赐下了一切。然而，当死人应当复活的时候——即在整个一千年之内（在为这一目的所规定的、那一千年未完结之前）——有人复活了，有人却没有复活。关于「直到……完了」一词的详情：<a href="https://bibleox.com/ru/ru/w/Богородица#HH-И-не-знал-Ее-как-наконец-она-родила-Мф-125">详见</a>。</p><p>头一部分的人在活于身体中时复活了，也就是归向了基督：</p><blockquote><p>“<strong><mark>在头一次复活有分的有福了、圣洁了</mark></strong>！<strong><mark>第二次的死在他们身上没有权柄</mark></strong>。他们必作上帝和基督的祭司，并要与基督一同作王一千年。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/20/#L6">启 20:6</a>)</p></blockquote><p>在他们身上，<strong>第二次的死</strong>将没有权柄。</p><p>而所有的人带着身体复活、为受普遍的审判的复活是这样的：</p><blockquote><p>“于是海交出其中的死人，<strong><mark>死亡和阴间也交出其中的死人</mark></strong>，<strong><mark>他们都照各人所行的受审判</mark></strong>。 死亡和阴间也被扔在火湖里，<strong><mark>这火湖就是第二次的死</mark></strong>。 <strong><mark>若有人名字没记在生命册上，他就被扔在火湖里</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/20/#L13-15">启 20:13-15</a>)</p></blockquote><p>被扔进火湖——这就是<strong>第二次的死</strong>。名字记在生命册上的人，没有被扔进去。也就是说，正是那些在20:6中说到的人——在他们身上第二次的死没有权柄。</p>
