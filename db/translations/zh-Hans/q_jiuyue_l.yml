  title: 安息日与主日
  copy_cover: true
  body: '<h2>安息日</h2><h3>上帝祝圣了安息日</h3><p>创造世界之后，上帝祝圣了第七日（安息日），但没有设立诫命：</p><blockquote><p>“<strong><mark>上帝赐福给第七日，定为圣日</mark></strong>；<strong><mark>因为在这日上帝歇了他一切创造的工，就安息了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/2/#L3">创 2:3</a>)</p></blockquote><p>旁边有许多上帝赐下其他命令的地方：</p><blockquote><p>“上帝就赐福给他们，<strong><mark>又对他们说</mark></strong>：「要生养众多，遍满地面，治理这地；也要管理海里的鱼、空中的鸟和地上各样行动的活物。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/1/#L28">创 1:28</a>)</p></blockquote><blockquote><p>“<strong><mark>上帝说</mark></strong>：「看哪！我将遍地上一切结种子的菜蔬，和一切树上所结有核的果子，全赐给你们作食物。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/1/#L29">创 1:29</a>)</p></blockquote><blockquote><p>“<strong><mark>耶和华上帝吩咐他说</mark></strong>：「园中各样树上的果子，你可以随意吃， 只是分别善恶树上的果子，你不可吃，因为你吃的日子必定死。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/2/#L16-17">创 2:16-17</a>)</p></blockquote><p>然而，关于安息日没有赐下任何命令。创造诸日之后说到安息的是上帝，而不是人。上帝把人安置在伊甸园中是为了劳动：</p><blockquote><p>“野地还没有草木，田间的菜蔬还没有长起来，因为耶和华上帝还没有降雨在地上，<strong><mark>也没有人耕地</mark></strong>， &lt;…&gt; 耶和华上帝在东方的伊甸立了一个园子，<strong><mark>把所造的人安置在那里</mark></strong>。 &lt;…&gt; 耶和华上帝将那人安置在伊甸园，<strong><mark>使他修理看守</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/2/#L5,8,15">创 2:5,8,15</a>)</p></blockquote><p>在那永恒的神圣安息中——上帝如今所处其中（<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/2/#L3">创 2:3</a>）——人们将来才能进入。而且并非所有人，只有上帝亲自放进去的人：</p><blockquote><p>“<strong><mark>但我们已经相信的人得以进入那安息</mark></strong>，正如上帝所说：「我在怒中起誓说，『<strong><mark>他们断不可进入我的安息</mark></strong>！』」其实造物之工，从创世以来已经成全了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/4/#L3">希 4:3</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/ps/95/#L11">诗 95:11</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/evr/3/#L11">希 3:11</a>)</p></blockquote><h3>安息日停止劳作之诫命的出现</h3><p>安息日停止劳作的诫命，是上帝在先知摩西的时代、与以色列民立约的时候首次设立的：</p><blockquote><p>“<strong><mark>当记念安息日，守为圣日</mark></strong>。 <strong><mark>六日要劳碌作你一切的工</mark></strong>， <strong><mark>但第七日</mark></strong>是向耶和华你上帝当守的安息日。这一日你和你的儿女、仆婢、牲畜，并你城里寄居的客旅，<strong><mark>无论何工都不可作</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/20/#L8-10">出 20:8-10</a>) <em>(并见 <a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/5/#L12-15">申 5:12-15</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/19/#L3">利 19:3</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/19/#L30">利 19:30</a>。)</em></p></blockquote><h3>设立安息日诫命的原因</h3><p>诫命的原因就在诫命的话语之后说明了。这一原因：以色列民出埃及的出走。</p><blockquote><p>“但第七日是向耶和华你上帝当守的安息日。这一日，你和你的儿女、仆婢、牛、驴、牲畜，并在你城里寄居的客旅，无论何工都不可作，使你的仆婢可以和你一样安息。 <strong><mark>你也要记念你在埃及地作过奴仆</mark></strong>；耶和华你上帝用大能的手和伸出来的膀臂<strong><mark>将你从那里领出来</mark></strong>。<strong><mark>因此，耶和华你的上帝吩咐你守安息日</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/5/#L14-15">申 5:14-15</a>)</p></blockquote><p>赐给他们「安息日」，即赐给他们先前没有的东西：</p><blockquote><p>“这样，<strong><mark>我就使他们出埃及地</mark></strong>，领他们到旷野， <strong><mark>将我的律例赐给他们</mark></strong>，将我的典章指示他们；人若遵行，就必因此活着。 <strong><mark>又将我的安息日赐给他们</mark></strong>，好在我与他们中间为证据，使他们知道我耶和华是叫他们成为圣的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iez/20/#L10-12">结 20:10-12</a>)</p></blockquote><blockquote><p>“<strong><mark>耶和华我们的上帝在何烈山与我们立约</mark></strong>。 这约不是与我们列祖立的，<strong><mark>乃是与我们今日在这里存活之人立的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/5/#L2-3">申 5:2-3</a>)</p></blockquote><p>也有另一种解释，指出上帝对第七日的祝圣：</p><blockquote><p>“<strong><mark>因为六日之内，耶和华造天、地、海和其中的万物</mark></strong>，第七日便安息。<strong><mark>所以耶和华赐福与安息日，定为圣日</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/20/#L11">出 20:11</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/gen/2/#L3">创 2:3</a>)</p></blockquote><p>然而，这一解释虽指出了联系，但这里说明的是祝圣安息日的原因：「所以耶和华赐福」（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/20/#L11">出 20:11</a>），而不是诫命的原因。而在另一节经文中，则最明确地给出了诫命本身的原因：「你也要记念你在埃及地作过奴仆……将你从那里领出来……因此，耶和华你的上帝吩咐你守安息日」（<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/5/#L14-15">申 5:14-15</a>）。</p><p>这样，安息日的停止劳作是因以色列民脱离埃及奴役的出走而设立的，虽然也指出了它与神圣安息的联系。</p><h3>诫命之律已被废除</h3><p>律法是在基督来临之前、为一段时期而赐下的：</p><blockquote><p>“这样说来，律法是为什么有的呢？<strong><mark>原是为过犯添上的</mark></strong>，<strong><mark>等候那蒙应许的子孙来到</mark></strong>，并且是藉天使经中保之手设立的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/3/#L19">加 3:19</a>)</p></blockquote><p>诫命之律已被基督的教导废除：</p><blockquote><p>“因他使我们和睦，将两下合而为一，<strong><mark>拆毁了中间隔断的墙</mark></strong>， 而且<strong><mark>以自己的身体废掉冤仇</mark></strong>，<strong><mark>就是那记在律法上的规条</mark></strong>，为要将两下借着自己造成一个新人，如此便成就了和睦。 既在十字架上灭了冤仇，便藉这十字架使两下归为一体，与上帝和好了，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/2/#L14-16">弗 2:14-16</a>)</p></blockquote><p>基督徒已从律法中释放：</p><blockquote><p>“但我们既然在捆我们的律法上死了，<strong><mark>现今就脱离了律法</mark></strong>，叫我们服事主，<strong><mark>要按着心灵的新样，不按着仪文的旧样</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/7/#L6">罗 7:6</a>)</p></blockquote><p>摩西律法废除的详细解释：<a href="https://bibleox.com/ru/ru/w/Библия-Закон-Моисея-отмена">摩西律法的废除</a>。</p><h3>基督保护使徒免受干犯安息日的指控</h3><p>法利赛人指摘主和使徒们干犯安息日。基督称使徒们无罪：</p><blockquote><p>“法利赛人看见，就对耶稣说：「<strong><mark>看哪，你的门徒作安息日不可作的事了</mark></strong>！」 &lt;…&gt; 『我喜爱怜恤，不喜爱祭祀。』你们若明白这话的意思，<strong><mark>就不将无罪的当作有罪的了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/12/#L2,7">太 12:2,7</a>)</p></blockquote><h3>使徒禁止因不守安息日而论断基督徒</h3><blockquote><p>“<strong><mark>所以不拘在饮食上，或节期、月朔、安息日，都不可让人论断你们</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/2/#L16">西 2:16</a>)</p></blockquote><h2>主日</h2><h3>主显现的日子</h3><ol><li><p>主耶稣基督在七日的第一日——主日——复活了，并向没有多马的门徒们显现（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/20/#L19">约 20:19</a>）。</p></li><li><p>在主日，他向持香的妇女们显现（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/28/#L1,9">太 28:1,9</a>）、向抹大拉的马利亚显现（<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/16/#L9">可 16:9</a>）、向使徒彼得显现（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/24/#L34">路 24:34</a>）、向使徒革流巴和路加显现（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/24/#L13-32">路 24:13-32</a>）。</p></li><li><p>为多马的缘故，救主恰好过了一周再次显现，又是在主日（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/20/#L26">约 20:26</a>）。</p></li></ol><h3>聚会与举行圣餐礼的日子</h3><p>使徒们在特罗亚住了七天，而在七天之中，他们不是在安息日、而是在主日聚会举行事奉圣礼并擘饼：</p><blockquote><p>“过了除酵的日子，我们从腓立比开船，五天到了特罗亚，和他们相会，<strong><mark>在那里住了七天</mark></strong>。 七日的第一日，我们聚会擘饼的时候，保罗因为要次日起行，就与他们讲论，直讲到半夜。 我们聚会的那座楼上，有好些灯烛。 有一个少年人，名叫犹推古，坐在窗台上困倦沉睡。保罗讲了多时，少年人睡熟了，就从三层楼上掉下去；扶起他来，已经死了。 保罗下去，伏在他身上，抱着他说：「你们不要发慌，他的灵魂还在身上。」 保罗又上去，擘饼，吃了，谈论许久，直到天亮，这才走了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/20/#L6-11">徒 20:6-11</a>) <em>(在特罗亚住了整整七天。 :: !七日的第一日，我们聚会擘饼的时候 ~~ 有七天，但擘饼聚会正是在主日。 :: !我们聚会的那座楼上，有好些灯烛 ~~ 隆重的聚会。)</em></p></blockquote><p>使徒请求在主日（聚会之日）抽出钱来，帮助有缺乏的人：</p><blockquote><p>“<strong><mark>每逢七日的第一日，各人要照自己的进项抽出来留着</mark></strong>，免得我来的时候现凑。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/16/#L2">林前 16:2</a>)</p></blockquote><h2>批评</h2><p>某些脱离教会的团体（主要是基督复临安息日会教派），违背诫命（<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/2/#L16">西 2:16</a>），不但指摘教会不守安息日，还指摘教会更隆重地庆祝主日，说主日不应当庆祝。</p><p>在东正教会中，人在一生所有的日子都蒙召行善，而在特别的日子（安息日，尤其是主日），不但以个人的善行、更以<strong>共同的事业</strong>（源自希腊文 λειτουργία——事奉圣礼）来庆祝，也就是以共同的聚会举行事奉圣礼来庆祝主日。其余的日子也举行事奉圣礼，但在安息日、尤其是在主日举行特别的、更隆重的事奉圣礼。</p><p>对基督徒来说，最重要的事件是基督的复活——主耶稣基督从死人中复活。这一日被称为诸庆节之庆节、诸凯旋之凯旋，因为：</p><blockquote><p>“<strong><mark>若基督没有复活，我们所传的便是枉然</mark></strong>，你们所信的也是枉然！ &lt;…&gt; 基督若没有复活，<strong><mark>你们的信便是徒然，你们仍在罪里</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/15/#L14,17">林前 15:14,17</a>)</p></blockquote><p>如上所示，使徒们正是在主日举行事奉圣礼。这一日成了与复活之主相会的喜乐之日。最早的基督徒也是如此：<a href="https://bibleox.com/ru/ru/w/Евхаристия_в_воскресенье">主日的圣餐礼</a></p><p>还有人指摘君士坦丁皇帝（四世纪），说他似乎把休息日从安息日改到了主日（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/20/#L6-11">徒 20:6-11</a>）。然而，君士坦丁皇帝设立了每周第一个休息日——主日，没有对安息日作任何指示（<a href="https://bibleox.com/ru/ru/w/Воскресенье_выходной_Указ_императора_Константина">详见</a>）。在这一敕令之前，罗马帝国没有普遍的每周休息日。</p><p>这样，这种批评至少可以说是不成立的。</p>'
