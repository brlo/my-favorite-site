  title: 圣物
  copy_cover: true
  body: <h2>新约中的圣物</h2><h3>圣洁的圣殿</h3><p>耶路撒冷圣殿是真圣所的像：</p><blockquote><p>“因为<strong><mark>基督并不是进了人手所造的圣所（这不过是真圣所的影像）</mark></strong>，乃是进了天堂，如今为我们显在上帝面前；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/9/#L24">希 9:24</a>)</p></blockquote><blockquote><p>“犹太人的逾越节近了，耶稣就上耶路撒冷去。 <strong><mark>看见殿里有卖牛、羊、鸽子的</mark></strong>，并有兑换银钱的人坐在那里。 耶稣就拿绳子作成鞭子，<strong><mark>把牛羊都赶出殿去</mark></strong>；倒出兑换银钱之人的银钱，推翻他们的桌子。 又对卖鸽子的说：「把这些东西拿去！<strong><mark>不要将我父的殿当作买卖的地方</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/2/#L13-16">约 2:13-16</a>)</p></blockquote><blockquote><p>“<strong><mark>常在殿里称颂上帝</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/24/#L53">路 24:53</a>)</p></blockquote><blockquote><p>“<strong><mark>他们天天同心合意恒切的在殿里</mark></strong>，且在家中擘饼，存着欢喜、诚实的心用饭，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/2/#L46">徒 2:46</a>)</p></blockquote><p>使徒在圣殿里祈祷，基督在那里于异象中向他显现：</p><blockquote><p>“后来，我回到耶路撒冷，<strong><mark>在殿里祷告的时候</mark></strong>，<strong><mark>魂游象外</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/22/#L17">徒 22:17</a>)</p></blockquote><p>敌基督（大罪人）要坐在上帝的殿里（显然，要坐在上帝的殿里，那殿必须是：不是宙斯的殿、不是雷神的殿，而是上帝的殿）：</p><blockquote><p>“人不拘用什么法子，你们总不要被他诱惑！因为那日子以前，必有离道反教的事，<strong><mark>并有那大罪人</mark></strong>，就是沉沦之子，显露出来。 他是<strong><mark>抵挡主，高抬自己</mark></strong>，超过一切称为神的和一切受人敬拜的．<strong><mark>甚至坐在上帝的殿里自称是上帝</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2sol/2/#L3-4">帖后 2:3-4</a>)</p></blockquote><h3>圣地</h3><p>在圣地，听的人必须看见什么：</p><blockquote><p>“你们看见先知但以理所说的『<strong><mark>那行毁坏可憎的</mark></strong>』<strong><mark>站在圣地</mark></strong>（读这经的人须要会意）。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/24/#L15">太 24:15</a>)</p></blockquote><h3>圣物</h3><h4>圣殿和祭坛仍旧是圣的，并使人成圣</h4><blockquote><p>“你们这无知瞎眼的人哪！什么是大的？是金子呢，<strong><mark>还是叫金子成圣的殿呢</mark></strong>？ &lt;…&gt; 你们这瞎眼的人哪！什么是大的？是礼物呢，<strong><mark>还是叫礼物成圣的坛呢</mark></strong>？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/23/#L17,19">太 23:17,19</a>)</p></blockquote><h4>天使藉水赐下医治</h4><blockquote><p>“<strong><mark>因为有天使按时下池子搅动那水</mark></strong>，水动之后，<strong><mark>谁先下去，无论害什么病就痊瘉了</mark></strong>。』〕” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/5/#L4">约 5:4</a>)</p></blockquote><h4>使徒们以抹油医治人</h4><blockquote><p>“耶稣叫了十二个门徒来，差遣他们两个两个地出去，也赐给他们权柄，制伏污鬼， &lt;…&gt; 门徒就出去传道，叫人悔改； 又赶出许多的鬼，<strong><mark>用油抹了许多病人，治好他们</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/6/#L7,12-13">可 6:7,12-13</a>)</p></blockquote><blockquote><p>“你们中间有病了的呢，他就该请教会的长老来，他们可以奉主的名<strong><mark>用油抹他</mark></strong>，为他祷告。 出于信心的祈祷要救那病人，主必叫他起来；<strong><mark>他若犯了罪，也必蒙赦免</mark></strong>。 所以你们要彼此认罪，互相代求，使你们可以得医治。义人祈祷所发的力量是大有功效的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/5/#L14-16">雅 5:14-16</a>)</p></blockquote><h4>基督的血——是圣物</h4><blockquote><p>“人干犯摩西的律法，凭两三个见证人尚且不得怜恤而死； 何况人践踏上帝的儿子，<strong><mark>将那使他成圣之约的血当作平常</mark></strong>，<strong><mark>又亵慢施恩的圣灵</mark></strong>，你们想，他要受的刑罚该怎样加重呢？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/10/#L28-29">希 10:28-29</a>)</p></blockquote><h4>人因触摸使徒遗下的衣物而得医治</h4><blockquote><p>“<strong><mark>甚至有人从保罗身上拿手巾或围裙放在病人身上，病就退了，恶鬼也出去了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/19/#L12">徒 19:12</a>)</p></blockquote><h4>敌基督将高抬自己超过圣物</h4><p>显然，要高抬自己超过圣物，圣物必须存在：</p><blockquote><p>“人不拘用什么法子，你们总不要被他诱惑！因为那日子以前，必有离道反教的事，并有那大罪人，就是沉沦之子，显露出来。 他是<strong><mark>抵挡主，高抬自己</mark></strong>，<strong><mark>超过一切称为神的和一切受人敬拜的</mark></strong>．<strong><mark>甚至坐在上帝的殿里自称是上帝</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2sol/2/#L3-4">帖后 2:3-4</a>)</p></blockquote><h3>圣像</h3><h4>人们指望从使徒的影子得医治</h4><blockquote><p>“甚至有人将病人抬到街上，放在床上或褥子上，<strong><mark>指望彼得过来的时候，或者得他的影儿照在什么人身上</mark></strong>。 还有许多人带着病人和被污鬼缠磨的，从耶路撒冷四围的城邑来，<strong><mark>全都得了医治</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/5/#L15-16">徒 5:15-16</a>)</p></blockquote><h3>圣洁的人（司祭）</h3><h4>基督只向使徒们显现。基督只把权柄赐给他们</h4><blockquote><p>“耶稣又对他们说：「愿你们平安！父怎样差遣了我，我也照样差遣你们。」 说了这话，就向他们吹一口气，说：「<strong><mark>你们受圣灵</mark></strong>。 <strong><mark>你们赦免谁的罪，谁的罪就赦免了</mark></strong>；你们留下谁的罪，谁的罪就留下了。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/20/#L21-23">约 20:21-23</a>)</p></blockquote><blockquote><p>“我实在告诉你们：<strong><mark>凡你们在地上所捆绑的，在天上也要捆绑</mark></strong>；凡你们在地上所释放的，在天上也要释放。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/18/#L18">太 18:18</a>)</p></blockquote><h3>圣洁的规程和圣奥秘</h3><p>圣餐的祭（新约的）。主教只教导使徒们举行的方式：</p><blockquote><p>“他们吃的时候，耶稣<strong><mark>拿起饼来，祝福，就擘开递给门徒</mark></strong>，说：「你们拿着吃，这是我的身体。」 <strong><mark>又拿起杯来，祝谢了</mark></strong>，递给他们，说：「你们都喝这个， 因为这是我立约的血，为多人流出来，使罪得赦。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/26/#L26-28">太 26:26-28</a>)</p></blockquote><p>同样见：<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/14/#L22-24">可 14:22-24</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/22/#L19-20">路 22:19-20</a></p><p>然后又单独教导后来归依的使徒保罗同样的规程（礼规）：</p><blockquote><p>“又拿起饼来，祝谢了，就擘开，递给他们，说：「这是我的身体，为你们舍的，<strong><mark>你们也应当如此行，为的是记念我</mark></strong>。」 <strong><mark>饭后也照样拿起杯来</mark></strong>，说：「这杯是用我血所立的新约，是为你们流出来的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/22/#L19-20">路 22:19-20</a>)</p></blockquote><blockquote><p>“<strong><mark>我当日传给你们的，原是从主领受的</mark></strong>，就是主耶稣被卖的那一夜，拿起饼来， 祝谢了，就擘开，说，「这是我的身体，为你们舍的。<strong><mark>你们应当如此行，为的是记念我</mark></strong>。」 饭后，也照样拿起杯来，说：「<strong><mark>这杯是用我的血所立的新约</mark></strong>。你们每逢喝的时候，要如此行，为的是记念我。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/11/#L23-25">林前 11:23-25</a>)</p></blockquote><h4>按手与祈祷</h4><blockquote><p>“为此我提醒你，使你将<strong><mark>上帝藉我按手所给你的恩赐</mark></strong>，再如火挑旺起来。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/1/#L6">提后 1:6</a>)</p></blockquote><blockquote><p>“你不要轻忽所得的恩赐，就是从前借着预言、<strong><mark>在众长老按手的时候赐给你的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/4/#L14">提前 4:14</a>)</p></blockquote><blockquote><p>“他们事奉主，禁食的时候，圣灵说：「要为我分派巴拿巴和扫罗，去作我召他们所作的工。」 于是禁食祷告，<strong><mark>按手在他们头上</mark></strong>，就打发他们去了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/13/#L2-3">徒 13:2-3</a>)</p></blockquote><blockquote><p>“叫他们站在使徒面前。<strong><mark>使徒祷告了，就按手在他们头上</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/6/#L6">徒 6:6</a>)</p></blockquote><p>同样见：<a href="https://bibleox.com/zh-Hans/cn-cuv/act/21/#L8">徒 21:8</a></p><blockquote><p>“<strong><mark>各样洗礼、按手之礼</mark></strong>、死人复活，以及永远审判各等教训。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/6/#L2">希 6:2</a>)</p></blockquote><blockquote><p>“<strong><mark>西门看见使徒按手，便有圣灵赐下</mark></strong>，就拿钱给使徒， 说：「把这权柄也给我，叫我手按着谁，谁就可以受圣灵。」 彼得说：「你的银子和你一同灭亡吧！因<strong><mark>你想上帝的恩赐是可以用钱买的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/8/#L18-20">徒 8:18-20</a>)</p></blockquote><blockquote><p>“因为圣灵还没有降在他们一个人身上，他们只奉主耶稣的名受了洗。 <strong><mark>于是使徒按手在他们头上，他们就受了圣灵</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/8/#L16-17">徒 8:16-17</a>)</p></blockquote><h4>上帝赐下传递恩典的恩赐</h4><blockquote><p>“彼得说：「金银我都没有，只把我所有的给你，<strong><mark>我奉拿撒勒人耶稣基督的名，叫你起来行走</mark></strong>！」 于是拉着他的右手，扶他起来。<strong><mark>他的脚和踝子骨立刻健壮了</mark></strong>， 就跳起来，站着，又行走；同他们进了殿，走着，跳着，赞美上帝。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/3/#L6-8">徒 3:6-8</a>)</p></blockquote><h2>旧约中的圣物</h2><h3>圣洁的圣殿</h3><blockquote><p>“耶和华晓谕摩西说： 「<strong><mark>你告诉以色列人当为我送礼物来</mark></strong>，凡甘心乐意的，你们就可以收下归我。 &lt;…&gt; <strong><mark>又当为我造圣所</mark></strong>，使我可以住在他们中间。 制造帐幕和其中的一切器具，<strong><mark>都要照我所指示你的样式</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/25/#L1-2,8-9">出 25:1-2,8-9</a>)</p></blockquote><blockquote><p>“<strong><mark>他必为我的名建造殿宇</mark></strong>。他要作我的子，我要作他的父．他作以色列王，我必坚定他的国位，直到永远。』 我儿啊，现今愿耶和华与你同在，使你亨通，照他指着你说的话，建造耶和华你上帝的殿。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1par/22/#L9-10">代上 22:9-10</a>)</p></blockquote><blockquote><p>“至于我，我必凭你丰盛的慈爱，进入你的居所；我必存敬畏你的心，<strong><mark>向你的圣殿下拜</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/5/#L7">诗 5:7</a>)</p></blockquote><h3>圣地</h3><blockquote><p>“上帝说：「不要近前来，当把你脚上的鞋脱下来，因为<strong><mark>你所站之地是圣地</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/3/#L5">出 3:5</a>)</p></blockquote><blockquote><p>“耶和华军队的元帅对约书亚说：「<strong><mark>把你脚上的鞋脱下来，因为你所站的地方是圣的</mark></strong>。」约书亚就照着行了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/nav/5/#L15">书 5:15</a>)</p></blockquote><blockquote><p>“你要将承接圣职所献公羊的肉，<strong><mark>煮在圣处</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L31">出 29:31</a>)</p></blockquote><h3>圣物</h3><p>圣膏——是圣物。圣殿和一切以圣膏膏抹的殿内器皿——是圣物。在人中间，只有亚伦的后裔可以用它膏抹，使他们成为司祭：</p><blockquote><p>“「你要取上品的香料，就是流质的没药五百舍客勒，香肉桂一半，就是二百五十舍客勒，菖蒲二百五十舍客勒， 桂皮五百舍客勒，都按着圣所的平，又取橄榄油一欣， <strong><mark>按作香之法，调和作成圣膏油</mark></strong>。 <strong><mark>要用这膏油抹会幕和法柜</mark></strong>， 桌子与桌子的一切器具，灯台和灯台的器具，并香坛、 燔祭坛和坛的一切器具，洗濯盆和盆座。 <strong><mark>要使这些物成为圣，好成为至圣，凡挨着的都成为圣</mark></strong>。 <strong><mark>要膏亚伦和他的儿子</mark></strong>，使他们成为圣，可以给我供祭司的职分。 你要对以色列人说：『这油，我要世世代代以为圣膏油， 不可倒在别人的身上，也不可按这调和之法作与此相似的。<strong><mark>这膏油是圣的，你们也要以为圣</mark></strong>。 凡调和与此相似的，或将这膏膏在别人身上的，<strong><mark>这人要从民中剪除</mark></strong>。』」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/30/#L23-33">出 30:23-33</a>)</p></blockquote><p>祭坛——至圣的圣物：</p><blockquote><p>“用膏油把帐幕和其中所有的都抹上，使帐幕和一切器具成圣，就都成圣， 又要抹燔祭坛和一切器具，<strong><mark>使坛成圣，就都成为至圣</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/40/#L9-10">出 40:9-10</a>)</p></blockquote><blockquote><p>“要洁净坛七天，使坛成圣。<strong><mark>坛就成为至圣，凡挨着坛的都成为圣</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L37">出 29:37</a>)</p></blockquote><p>香的配方（在祭坛上焚烧的香料）——至圣的圣物：</p><blockquote><p>“耶和华吩咐摩西说：「你要取馨香的香料，就是拿他弗、施喜列、喜利比拿。这馨香的香料和净乳香各样要一般大的分量。 你要用这些加上盐，按作香之法，<strong><mark>作成清净圣洁的香</mark></strong>。 这香要取点捣得极细，放在会幕内法柜前，我要在那里与你相会。<strong><mark>你们要以这香为至圣</mark></strong>。 你们不可按这调和之法为自己作香；<strong><mark>要以这香为圣，归耶和华</mark></strong>。 凡作香和这香一样，为要闻香味的，<strong><mark>这人要从民中剪除</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/30/#L34-38">出 30:34-38</a>)</p></blockquote><h3>圣像</h3><blockquote><p>“你要用十幅幔子作帐幕。这些幔子要用撚的细麻和蓝色、紫色、朱红色线制造，<strong><mark>并用巧匠的手工绣上基路伯</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/26/#L1">出 26:1</a>)</p></blockquote><blockquote><p>“他们中间，凡心里有智慧作工的，用十幅幔子作帐幕。这幔子是比撒列用撚的细麻和蓝色、紫色、朱红色线制造的，<strong><mark>并用巧匠的手工绣上基路伯</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/36/#L8">出 36:8</a>)</p></blockquote><blockquote><p>“<strong><mark>用膏油把帐幕和其中所有的都抹上</mark></strong>，使帐幕和一切器具成圣，就都成圣，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/40/#L9">出 40:9</a>)</p></blockquote><h3>圣洁的人（司祭）</h3><p><a href="https://bibleox.com/ru/ru/w/Таинство-Священства">司祭</a>——只是亚伦的后裔：</p><blockquote><p>“给亚伦和他儿子束上腰带，包上裹头巾，<strong><mark>他们就凭永远的定例得了祭司的职任</mark></strong>；又要将亚伦和他儿子分别为圣。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L9">出 29:9</a>)</p></blockquote><p>司祭职与圣衣、膏抹一同传递：</p><blockquote><p>“<strong><mark>亚伦的圣衣要留给他的子孙</mark></strong>，可以穿着受膏，又穿着承接圣职。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L29">出 29:29</a>)</p></blockquote><p>外人若近前来行事奉的礼，必须治死。司祭职的职责就是看守这事：</p><blockquote><p>“你要嘱咐亚伦和他儿子，谨守自己祭司的职任。<strong><mark>近前来的外人必被治死</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/3/#L10">民 3:10</a>)</p></blockquote><h4>触摸先知以利沙的身体使人得医治</h4><blockquote><p>“有人正葬死人，忽然看见一群人，就把死人抛在以利沙的坟墓里，<strong><mark>一碰着以利沙的骸骨，死人就复活站起来了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/4ts/13/#L21">王下 13:21</a>)</p></blockquote><h3>圣洁的规程和圣奥秘</h3><p>旧约里规程非常多。可以从利未记认识它们。例如立大祭司的规程：<a href="https://bibleox.com/ru/ru/w/ветхозаветный-священник#HH-Обряд">详见</a></p><p>圣餐的祭（旧约的）：</p><p><a href="https://bibleox.com/ru/ru/w/Евхаристия#HH-Мирная-жертва-благодарения">详见</a></p><h4>按手与祈祷</h4><p>#### 雅各祝福孙子</p><p>雅各以祈祷按手祝福了自己的孙子：</p><blockquote><p>“<strong><mark>以色列伸出右手来</mark></strong>，<strong><mark>按在以法莲的头上</mark></strong>，以法莲乃是次子；<strong><mark>又剪搭过左手来按在玛拿西的头上</mark></strong>，玛拿西原是长子。 <strong><mark>他就给约瑟祝福说</mark></strong>：「愿我祖亚伯拉罕和我父以撒所事奉的上帝，就是一生牧养我，直到今日的上帝， 救赎我脱离一切患难的那使者，<strong><mark>赐福与这两个童子</mark></strong>。愿他们归在我的名下和我祖亚伯拉罕、我父以撒的名下，又愿他们在世界中，生养众多。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/48/#L14-16">创 48:14-16</a>)</p></blockquote><p>#### 摩西立约书亚担任事奉</p><p>上帝命令先知摩西以按手立约书亚担任事奉：</p><blockquote><p>“耶和华对摩西说：「嫩的儿子约书亚是心中有圣灵的，<strong><mark>你将他领来，按手在他头上</mark></strong>， &lt;…&gt; 于是，摩西照耶和华所吩咐的，将约书亚领来，使他站在祭司以利亚撒和全会众面前， <strong><mark>按手在他头上，嘱咐他</mark></strong>，是照耶和华藉摩西所说的话。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/27/#L18,22-23">民 27:18,22-23</a>)</p></blockquote><p>#### 立利未人担任事奉的方式</p><p>上帝命令以按手立利未人在圣殿供职：</p><blockquote><p>“将利未人奉到耶和华面前，<strong><mark>以色列人要按手在他们头上</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/8/#L10">民 8:10</a>)</p></blockquote><h2>对异议的回应</h2><h3>“上帝不住人手所造的殿”</h3><p>反对圣殿的教会批评者引用一节经文：</p><blockquote><p>“大卫在上帝面前蒙恩，祈求为雅各的上帝预备居所； 却是所罗门为上帝造成殿宇。 <strong><mark>其实，至高者并不住人手所造的</mark></strong>，就如先知所言： 『主说：天是我的座位，地是我的脚凳，<strong><mark>你们要为我造何等的殿宇</mark></strong>？那里是我安息的地方呢？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/7/#L46-49">徒 7:46-49</a>)</p></blockquote><p>然而这丝毫不能证明反对圣殿，因为当大卫想为上帝建造殿宇时，上帝早已命令先知摩西建造会幕、祝圣它、在其中设立司祭、遵守规程、拥有圣物（约柜）、并设立了违反上帝所立秩序的死刑。这节经文只是说明：上帝无处不在，而不只在圣殿里。同时，圣殿——是上帝自己的设立，而不是人的设立，更不是仿佛从异教借来的东西。</p><h2>补充</h2><h3>反对并高抬自己超过圣物——敌基督的标志之一</h3><blockquote><p>“人不拘用什么法子，你们总不要被他诱惑！因为那日子以前，必有离道反教的事，并有那大罪人，就是沉沦之子，显露出来。 他是<strong><mark>抵挡主，高抬自己</mark></strong>，<strong><mark>超过一切称为神的和一切受人敬拜的</mark></strong>．甚至坐在上帝的殿里自称是上帝。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2sol/2/#L3-4">帖后 2:3-4</a>)</p></blockquote><blockquote><p>“小子们哪，如今是末时了。你们曾听见说，那敌基督的要来，<strong><mark>现在已经有好些敌基督的出来了</mark></strong>，从此我们就知道如今是末时了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/2/#L18">约壹 2:18</a>)</p></blockquote><h3>兽将亵渎住在天上的</h3><blockquote><p>“兽就开口向上帝说亵渎的话，亵渎上帝的名，<strong><mark>并他的帐幕，以及那些住在天上的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/13/#L6">启 13:6</a>)</p></blockquote><h3>在天上的，是义人的灵魂和天使</h3><blockquote><p>“你们乃是来到锡安山，永生上帝的城邑，<strong><mark>就是天上的耶路撒冷</mark></strong>。那里有<strong><mark>千万的天使</mark></strong>， 有名录在天上诸长子之会所共聚的总会，有审判众人的上帝和<strong><mark>被成全之义人的灵魂</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/12/#L22-23">希 12:22-23</a>)</p></blockquote>
