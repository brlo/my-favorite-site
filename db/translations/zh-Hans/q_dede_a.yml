  title: 爱
  copy_cover: true
  body: <h2>爱上帝与爱近人——最大的诫命</h2><blockquote><p>“耶稣回答说：「第一要紧的就是说：『以色列啊，你要听！主我们上帝是独一的主。 <strong><mark>你要尽心、尽性、尽意、尽力爱主你的上帝</mark></strong>。』 其次就是说：『<strong><mark>要爱人如己</mark></strong>。』<strong><mark>再没有比这两条诫命更大的了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/12/#L29-31">可 12:29-31</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/6/#L5">申 6:5</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/lev/19/#L18">利 19:18</a>)</p></blockquote><blockquote><p>“有一个律法师起来试探耶稣，说：「夫子，<strong><mark>我该作什么才可以承受永生</mark></strong>？」 耶稣对他说：「律法上写的是什么？你念的是怎样呢？」 他回答说：「<strong><mark>你要尽心、尽性、尽力、尽意爱主你的上帝</mark></strong>；<strong><mark>又要爱邻舍如同自己</mark></strong>。」 耶稣说：「<strong><mark>你回答的是。你这样行，就必得永生</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/10/#L25-28">路 10:25-28</a>)</p></blockquote><h2>爱高过一切</h2><blockquote><p>“<strong><mark>我若</mark></strong>能说万人的方言，并天使的话语，<strong><mark>却没有爱</mark></strong>，我就成了鸣的锣、响的钹一般。 我若有先知讲道之能，也明白各样的奥祕、各样的知识，而且有全备的信，叫我能够移山，却没有爱，<strong><mark>我就算不得什么</mark></strong>。 我若将所有的赒济穷人，又舍己身叫人焚烧，却没有爱，仍然与我无益。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/13/#L1-3">林前 13:1-3</a>)</p></blockquote><blockquote><p>“爱情，众水不能息灭，大水也不能淹没，<strong><mark>若有人拿家中所有的财宝要换爱情，就全被藐视</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pp/8/#L7">歌 8:7</a>)</p></blockquote><h2>爱是永恒的</h2><blockquote><p>“<strong><mark>爱是永不止息</mark></strong>。先知讲道之能，终必归于无有；说方言之能，终必停止；知识也终必归于无有。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/13/#L8">林前 13:8</a>)</p></blockquote><blockquote><p>“求你将我放在心上如印记，带在你臂上如戳记；因为<strong><mark>爱情如死之坚强</mark></strong>，嫉恨如阴间之残忍。<strong><mark>所发的电光，是火焰的电光，是耶和华的烈焰</mark></strong>。 爱情，<strong><mark>众水不能息灭，大水也不能淹没</mark></strong>，<strong><mark>若有人拿家中所有的财宝要换爱情，就全被藐视</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pp/8/#L6-7">歌 8:6-7</a>)</p></blockquote><h2>爱可以是怎样的</h2><blockquote><p>“<strong><mark>爱是恒久忍耐</mark></strong>，<strong><mark>又有恩慈</mark></strong>；<strong><mark>爱是不嫉妒</mark></strong>，<strong><mark>爱是不自夸，不张狂</mark></strong>， <strong><mark>不作害羞的事</mark></strong>，<strong><mark>不求自己的益处</mark></strong>，<strong><mark>不轻易发怒</mark></strong>，<strong><mark>不计算人的恶</mark></strong>， <strong><mark>不喜欢不义，只喜欢真理</mark></strong>； <strong><mark>凡事包容，凡事相信，凡事盼望，凡事忍耐</mark></strong>；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/13/#L4-7">林前 13:4-7</a>)</p></blockquote><blockquote><p>“我儿，你不可轻看耶和华的管教，也不可厌烦他的责备。 <strong><mark>因为耶和华所爱的，他必责备</mark></strong>，正如父亲责备所喜爱的儿子。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/3/#L11-12">箴 3:11-12</a>)</p></blockquote><blockquote><p>“<strong><mark>因为主所爱的，他必管教</mark></strong>，又鞭打凡所收纳的儿子。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/12/#L6">希 12:6</a>)</p></blockquote><blockquote><p>“<strong><mark>凡我所疼爱的，我就责备管教他</mark></strong>，所以你要发热心，也要悔改。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/3/#L19">启 3:19</a>)</p></blockquote><blockquote><p>“<strong><mark>我们受审的时候，乃是被主惩治</mark></strong>，免得我们和世人一同定罪。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/11/#L32">林前 11:32</a>)</p></blockquote><blockquote><p>“<strong><mark>上帝所惩治的人是有福的</mark></strong>！所以你不可轻看全能者的管教。 因为<strong><mark>他打破，又缠裹</mark></strong>；他击伤，用手医治。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iov/5/#L17-18">伯 5:17-18</a>)</p></blockquote><blockquote><p>“求你将我放在心上如印记，带在你臂上如戳记；因为<strong><mark>爱情如死之坚强</mark></strong>，<strong><mark>嫉恨如阴间之残忍</mark></strong>。<strong><mark>所发的电光，是火焰的电光，是耶和华的烈焰</mark></strong>。 爱情，众水不能息灭，大水也不能淹没，若有人拿家中所有的财宝要换爱情，就全被藐视。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pp/8/#L6-7">歌 8:6-7</a>)</p></blockquote>
