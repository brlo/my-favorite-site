  title: 谦卑
  copy_cover: true
  body: <p><strong>谦卑</strong>（谦卑的心志）——与骄傲相反的德行。</p><ul><li><p>和平地接受上帝关于自己这个受造物的<strong>旨意</strong>；</p></li><li><p>在小事上也在大事上顺服上帝、他的设立和他的安排；</p></li><li><p>对自己不高看，信赖上帝并仰望他。</p></li></ul><h2>主是谦卑人的上帝</h2><blockquote><p>“你的力量，不在乎人多；你的威能，并不靠强力；但<strong>你却是谦卑者的天主</strong>，弱小者的扶助，无力者的保护，无靠者的依赖，失望者的救主。” (<a href="https://bibleox.com/zh-Hans/cn-sb/iudf/9/#L11">友 9:11</a>)</p></blockquote><h2>关于谦卑的诫命</h2><p>主耶稣基督召人向他学习谦卑：</p><blockquote><p>“<strong><mark>凡劳苦担重担的人，可以到我这里来</mark></strong>，我就使你们得安息。 <strong><mark>我心里柔和谦卑</mark></strong>，你们当负我的轭，<strong><mark>学我的样式</mark></strong>，这样，你们心里就必<strong><mark>得享安息</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/11/#L28-29">太 11:28-29</a>)</p></blockquote><blockquote><p>“<strong><mark>要彼此同心</mark></strong>，不要志气高大，<strong><mark>倒要俯就卑微的人</mark></strong>。不要自以为聪明。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/12/#L16">罗 12:16</a>)</p></blockquote><blockquote><p>“世人哪，耶和华已指示你何为善，他向你所要的是什么呢？<strong><mark>只要你行公义，好怜悯，存谦卑的心，与你的上帝同行</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mih/6/#L8">弥 6:8</a>)</p></blockquote><blockquote><p>“<strong><mark>所以你们要将心里的污秽除掉。不可再硬着颈项</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/10/#L16">申 10:16</a>) <em>(「硬着颈项」——指不在上帝面前低头、不肯谦卑的百姓。)</em></p></blockquote><h2>上帝之母因谦卑被上帝拣选</h2><blockquote><p>“<strong><mark>因为他顾念他使女的卑微</mark></strong>，从今以后，万代要称我有福。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/1/#L48">路 1:48</a>)</p></blockquote><h2>上帝赐恩给谦卑的人</h2><blockquote><p>“你们年幼的也要顺服年长的。就是你们众人也都要以谦卑束腰，彼此顺服，『因为<strong><mark>上帝阻挡骄傲的人，赐恩给谦卑的人</mark></strong>。』 <strong><mark>所以你们要自卑，服在上帝大能的手下，到了时候，他必叫你们升高</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/5/#L5-6">彼前 5:5-6</a>)</p></blockquote><blockquote><p>“但他赐更多的恩典，所以经上说，『<strong><mark>上帝阻挡骄傲的人，赐恩给谦卑的人</mark></strong>。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/4/#L6">雅 4:6</a>)</p></blockquote><blockquote><p>“他讥诮那好讥诮的人，<strong><mark>赐恩给谦卑的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/3/#L34">箴 3:34</a>)</p></blockquote><blockquote><p>“我儿，执行你的工作时，应当谦和；这样，你会比施惠的人更受人爱戴。<strong>你越伟大，在一切事上越当谦下</strong>；这样，你才能在上主面前，获得恩宠。<strong>只有上主的权能是伟大的，为谦逊人所尊崇。</strong>” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/3/#L19-21">德 3:19-21</a>) <em>(俄文本为 Сир 3:17-20。)</em></p></blockquote><blockquote><p>“骄傲来，羞耻也来；<strong><mark>谦逊人却有智慧</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/11/#L2">箴 11:2</a>)</p></blockquote><h2>上帝拯救谦卑的人</h2><blockquote><p>“<strong><mark>耶和华靠近伤心的人，拯救灵性痛悔的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/34/#L18">诗 34:18</a>)</p></blockquote><blockquote><p>“因为耶和华喜爱他的百姓，<strong><mark>他要用救恩当作谦卑人的妆饰</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/149/#L4">诗 149:4</a>)</p></blockquote><blockquote><p>“<strong><mark>敬畏耶和华心存谦卑，就得富有、尊荣、生命为赏赐</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/22/#L4">箴 22:4</a>)</p></blockquote><h2>上帝高举谦卑的人</h2><blockquote><p>“<strong><mark>耶和华扶持谦卑人，将恶人倾覆于地</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/147/#L6">诗 147:6</a>)</p></blockquote><blockquote><p>“因为耶和华喜爱他的百姓，<strong><mark>他要用救恩当作谦卑人的妆饰</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/149/#L4">诗 149:4</a>)</p></blockquote><blockquote><p>“敬畏耶和华，是智慧的训诲；<strong><mark>尊荣以前，必有谦卑</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/15/#L33">箴 15:33</a>)</p></blockquote><blockquote><p>“败坏之先，人心骄傲；<strong><mark>尊荣以前，必有谦卑</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/18/#L12">箴 18:12</a>)</p></blockquote><blockquote><p>“<strong><mark>敬畏耶和华心存谦卑，就得富有、尊荣、生命为赏赐</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/22/#L4">箴 22:4</a>)</p></blockquote><blockquote><p>“人的高傲，必使他卑下；<strong><mark>心里谦逊的，必得尊荣</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/29/#L23">箴 29:23</a>)</p></blockquote><h2>上帝垂听谦卑人的祈祷</h2><blockquote><p>“耶和华啊！<strong><mark>谦卑人的心愿你早已知道</mark></strong>；<strong><mark>你必预备他们的心，也必侧耳听他们的祈求</mark></strong>；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/10/#L17">诗 10:17</a>) <em>(俄文本编号为 Пс 9:37（圣咏编号相差一）。)</em></p></blockquote><blockquote><p>“<strong>谦卑人的祈祷，穿云而上</strong>，不达到目的，决不甘休；不等至高者见了，为义人伸冤，执行正义，决不离开。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/35/#L21">德 35:21</a>) <em>(俄文本为 Сир 35:17。)</em></p></blockquote><blockquote><p>“耶和华说：「这一切都是我手所造的，所以就都有了。<strong><mark>但我所看顾的，就是虚心</mark></strong><strong><mark>痛悔、因我话而战兢的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/66/#L2">赛 66:2</a>)</p></blockquote><blockquote><p>“<strong><mark>或者他们在耶和华面前恳求</mark></strong>，各人回头，离开恶道，因为耶和华向这百姓所说要发的怒气和忿怒是大的。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ier/36/#L7">耶 36:7</a>)</p></blockquote><blockquote><p>“但愿我们能借着忏悔的心和<strong>谦虚的精神</strong>蒙你悦纳，就如献上公羊和公牛的全燔祭，又如献上了万只肥羊；” (<a href="https://bibleox.com/zh-Hans/cn-sb/dan/3/#L39">但 3:39</a>)</p></blockquote><blockquote><p>“<strong><mark>上帝所要的祭，就是忧伤的灵</mark></strong>；上帝阿！<strong><mark>忧伤痛悔的心，你必不轻看</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/51/#L17">诗 51:17</a>)</p></blockquote><h2>上帝安慰谦卑的人</h2><blockquote><p>“<strong><mark>但那安慰丧气之人的上帝</mark></strong>，借着提多来安慰了我们。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/7/#L6">林后 7:6</a>)</p></blockquote><blockquote><p>“<strong><mark>耶和华虽高，仍看顾低微的人</mark></strong>；他却从远处看出骄傲的人。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/138/#L6">诗 138:6</a>)</p></blockquote><h2>上帝保存谦卑的人</h2><blockquote><p>“<strong><mark>世上遵守耶和华典章的谦卑人哪，你们都当寻求耶和华</mark></strong>；当寻求公义谦卑，<strong><mark>或者在耶和华发怒的日子可以隐藏起来</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/sof/2/#L3">番 2:3</a>)</p></blockquote><blockquote><p>“上主拔除傲慢民族的根苗，在他们的地方，却<strong>培植谦虚的人</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/10/#L18">德 10:18</a>)</p></blockquote><blockquote><p>“<strong><mark>我却要在你中间留下困苦贫寒的民，他们必投靠我耶和华的名</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/sof/3/#L12">番 3:12</a>)</p></blockquote><h2>上帝与谦卑人同住</h2><blockquote><p>“因为那至高至上、永远长存、名为圣者的如此说：「<strong><mark>我住在至高至圣的所在</mark></strong>，<strong><mark>也与心灵痛悔、谦卑的人同居</mark></strong>；<strong><mark>要使谦卑人的灵甦醒</mark></strong>，也使痛悔人的心苏醒。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/57/#L15">赛 57:15</a>)</p></blockquote><h2>谦卑的比喻</h2><h3>论婚宴上座位的挑选</h3><blockquote><p>“耶稣见所请的客拣择首位，就用比喻对他们说： 「你被人请去赴婚姻的筵席，<strong><mark>不要坐在首位上</mark></strong>，恐怕有比你尊贵的客被他请来； 那请你们的人前来对你说：『让座给这一位吧！』你就羞羞惭惭的退到末位上去了。 你被请的时候，<strong><mark>就去坐在末位上</mark></strong>，好叫那请你的人来对你说：『朋友，请上坐。』<strong><mark>那时，你在同席的人面前就有光彩了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/14/#L7-10">路 14:7-10</a>)</p></blockquote><h3>论税吏和法利赛人</h3><blockquote><p>“<strong><mark>那税吏远远的站着，连举目望天也不敢</mark></strong>，只捶着胸说：『<strong><mark>上帝啊，开恩可怜我这个罪人</mark></strong>！』 我告诉你们：这人回家去比那人倒算为义了。因为<strong><mark>凡自高的，必降为卑；自卑的，必升为高</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/18/#L13-14">路 18:13-14</a>)</p></blockquote><blockquote><p>“说：「有两个人上殿里去祷告：一个是法利赛人，一个是税吏。 法利赛人站着，自言自语的祷告说：『上帝啊，我感谢你，我不像别人勒索、不义、奸淫，也不像这个税吏。 我一个礼拜禁食两次，凡我所得的都捐上十分之一。』 <strong><mark>那税吏远远的站着，连举目望天也不敢</mark></strong>，只捶着胸说：『<strong><mark>上帝啊，开恩可怜我这个罪人</mark></strong>！』 我告诉你们：这人回家去比那人倒算为义了。因为<strong><mark>凡自高的，必降为卑；自卑的，必升为高</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/18/#L10-14">路 18:10-14</a>)</p></blockquote>
