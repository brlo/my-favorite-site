  path: QO2A_十字架——摩西
  title: 十字架——摩西
  copy_cover: true
  body: <h2>与亚玛力人的争战</h2><p>耶稣基督在十字架上救赎性祭献的预像，是旧约中的一件事：以色列民与亚玛力人的争战。先知摩西在山上祈祷，他举手时以色列人就得胜（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/17/#L11">出 17:11</a>）；他因疲乏垂手时，民众就开始败退。以色列民与亚玛力人争战时在山上的先知摩西。亚伦与户珥扶着他的手（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/17/#L11-12">出 17:11-12</a>）。争战持续了一整天，摩西不能一直举着手，所以亚伦与户珥帮助摩西，搬石头来放在他以下让他坐下，从两边扶着他的手：亚伦扶一只手，户珥扶另一只（可以说，如同钉子固定着基督的手）。摩西就以这样的姿势在山上（如同基督的十字架在山上）直到日落（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/17/#L12">出 17:12</a>）（如同基督一样）。情形如下：</p><ul><li><p>约书亚（以色列民的统帅）的军队［如同基督军队——教会的元首］</p></li><li><p>借着十字架战胜了亚玛力人［如同基督借十字架得了胜利（<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/2/#L16">弗 2:16</a>）］，</p></li><li><p>十字架由摩西在山上摆出［如同基督的十字架在各各他山上］，</p></li><li><p>摩西被人在这样的姿势中扶持着［如同基督在十字架上被固定着］</p></li><li><p>直到一天结束［如同基督一样］。</p></li></ul>
  meta_desc: 关于摩西在山上呈十字形状的预像意义的引文
