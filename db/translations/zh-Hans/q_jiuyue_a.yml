- src: еврейский-стан-крест
  path: QO3A_十字架——以色列人的营阵
  title: 十字架——以色列人的营阵
  copy_cover: true
  body: <p>上帝规定了以色列各支派营阵的排布。他们要这样安营，也要这样行进。以色列的营阵构成一个十字。</p><ul><li><p>营的中心是会幕：</p></li></ul><blockquote><p>“「以色列人要各归自己的纛下，在本族的旗号那里，<strong><mark>对着会幕的四围安营</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/2/#L2">民 2:2</a>)</p></blockquote><p>同时，营的中心是利未支派：</p><blockquote><p>“随后会幕要往前行，<strong><mark>有利未营在诸营中间</mark></strong>。<strong><mark>他们怎样安营，就怎样往前行</mark></strong>，各按本位，各归本纛。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/2/#L17">民 2:17</a>)</p></blockquote><ul><li><p>东边：犹大支派，然后以萨迦，然后西布伦：</p></li></ul><blockquote><p>“在东边向日出之地，照着军队安营的，<strong><mark>是犹大营的纛</mark></strong>；有亚米拿达的儿子拿顺作犹大人的首领。 &lt;…&gt; 挨着他安营的，<strong><mark>是以萨迦支派</mark></strong>；有苏押的儿子拿坦业作以萨迦人的首领。 &lt;…&gt; <strong><mark>又有西布伦支派</mark></strong>；希伦的儿子以利押作西布伦人的首领。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/2/#L3,5,7">民 2:3,5,7</a>)</p></blockquote><ul><li><p>南边：流便支派，然后西缅，然后迦得：</p></li></ul><blockquote><p>“在南边按着军队，<strong><mark>是流便营的纛</mark></strong>；有示丢珥的儿子以利蓿作流便人的首领。 &lt;…&gt; 挨着他安营的<strong><mark>是西缅支派</mark></strong>；苏利沙代的儿子示路蔑作西缅人的首领。 &lt;…&gt; <strong><mark>又有迦得支派</mark></strong>；丢珥的儿子以利雅萨作迦得人的首领。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/2/#L10,12,14">民 2:10,12,14</a>)</p></blockquote><ul><li><p>西边：以法莲支派（约瑟的），然后玛拿西（约瑟的），然后便雅悯：</p></li></ul><blockquote><p>“在西边按着军队，<strong><mark>是以法莲营的纛</mark></strong>；亚米忽的儿子以利沙玛作以法莲人的首领。 &lt;…&gt; 挨着他的<strong><mark>是玛拿西支派</mark></strong>；比大蓿的儿子迦玛列作玛拿西人的首领。 &lt;…&gt; <strong><mark>又有便雅悯支派</mark></strong>；基多尼的儿子亚比但作便雅悯人的首领。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/2/#L18,20,22">民 2:18,20,22</a>)</p></blockquote><ul><li><p>北边：但支派，然后亚设，然后拿弗他利：</p></li></ul><blockquote><p>“在北边按着军队<strong><mark>是但营的纛</mark></strong>；亚米沙代的儿子亚希以谢作但人的首领。 &lt;…&gt; 挨着他安营的<strong><mark>是亚设支派</mark></strong>；俄兰的儿子帕结作亚设人的首领。 &lt;…&gt; <strong><mark>又有拿弗他利支派</mark></strong>；以南的儿子亚希拉作拿弗他利人的首领。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/2/#L25,27,29">民 2:25,27,29</a>)</p></blockquote><p><strong>*注</strong>：这样的排布需要13个营（1+3+3+3+3），而雅各的儿子只有12个。这里列举了所有的支派，但约瑟的一个支派由他两个儿子的支派代替：玛拿西和以法莲。</p><h2>十字的每一边都按最靠近中心的支派之名计数</h2><p>先列举犹大营的数目：</p><blockquote><p>“在东边向日出之地，照着军队安营的，是犹大营的纛；有亚米拿达的儿子拿顺作犹大人的首领。 他军队被数的，<strong><mark>共有七万四千六百名</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/2/#L3-4">民 2:3-4</a>)</p></blockquote><p>然后列举犹大之后各支派的人数：</p><blockquote><p>“他军队被数的，<strong><mark>共有五万四千四百名</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/2/#L6">民 2:6</a>)</p></blockquote><blockquote><p>“他军队被数的，<strong><mark>共有五万七千四百名</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/2/#L8">民 2:8</a>)</p></blockquote><p>然后全部加在一起，以犹大（最靠近中心的支派）之营命名，其数目已包括所有三个营：</p><blockquote><p>“<strong><mark>凡属犹大营按着军队被数的，共有十八万六千四百名</mark></strong>；<strong><mark>要作第一队往前行</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/2/#L9">民 2:9</a>)</p></blockquote><p>其余各边也都这样重复。</p><h2>营以十字形安营，也同样以十字形行进</h2><blockquote><p>“随后会幕要往前行，有利未营在诸营中间。<strong><mark>他们怎样安营，就怎样往前行</mark></strong>，各按本位，各归本纛。 &lt;…&gt; 以色列人就这样行，各人照他们的家室、宗族归于本纛，<strong><mark>安营起行</mark></strong>，<strong><mark>都是照耶和华所吩咐摩西的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/2/#L17,34">民 2:17,34</a>)</p></blockquote>
  meta_desc: 关于以色列民营阵十字形排布的引文
