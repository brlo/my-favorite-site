- src: крест-и-крещение-переход-через-море
  path: QO4A_十字架与洗礼——过红海
  title: 十字架与洗礼——过红海
  copy_cover: true
  body: <p>以色列民从埃及的奴役中走过红海底——是洗礼的预像（<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/10/#L2">林前 10:2</a>），是脱离罪的奴役的出走。先知摩西命令红海的水回到原处（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/14/#L26-27">出 14:26-27</a>）。上帝指示先知摩西举杖把水分开（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/14/#L16,21">出 14:16,21</a>），而当民众走到对岸之后，摩西要用手命令水回到原处（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/14/#L26-27">出 14:26-27</a>）。按情理，这是横向的动作，与先前分开水流的纵向动作相对。这样就得到一个十字：</p><ul><li><p>「之前」分开的纵向动作「|」。</p></li><li><p>「之后」连接的横向动作「—」。</p></li></ul><p>这样就成了一个十字（「|」与「—」相加即「＋」）。以色列民借十字架脱离了奴役。正如我们借着基督的十字架脱离罪的奴役，受浸入洗礼之水中。</p>
  meta_desc: 关于过红海之预像意义的引文
