  path: QO1A_基督十字架祭献的预像——亚伯拉罕与以撒
  title: 基督十字架祭献的预像——亚伯拉罕与以撒
  copy_cover: true
  body: <p>旧约中基督十字架祭献的预像——以撒的被献。亚伯拉罕（父亲）献以撒（自己的独生子）为祭：</p><blockquote><p>“上帝说：<strong><mark>你带着你的儿子，就是你独生的儿子，你所爱的以撒</mark></strong>，往摩利亚地去，在我所要指示你的山上，<strong><mark>把他献为燔祭</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/22/#L2">创 22:2</a>)</p></blockquote><blockquote><p>“上帝爱世人，<strong><mark>甚至将他的独生子赐给</mark></strong>他们，叫一切信他的，不至灭亡，反得永生。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/3/#L16">约 3:16</a>)</p></blockquote><p>以撒背着将被献祭之物上山：</p><blockquote><p>“<strong><mark>亚伯拉罕把燔祭的柴放在他儿子以撒身上</mark></strong>，自己手里拿着火与刀，于是二人同行。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/22/#L6">创 22:6</a>)</p></blockquote><blockquote><p>“于是彼拉多将耶稣交给他们去钉十字架。 他们就把耶稣带了去。<strong><mark>耶稣背着自己的十字架出来</mark></strong>，到了一个地方，名叫髑髅地（希伯来话叫各各他）。 <strong><mark>他们就在那里钉他在十字架上</mark></strong>，还有两个人和他一同钉着，一边一个，耶稣在中间。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/19/#L16-18">约 19:16-18</a>)</p></blockquote><p>亚伯拉罕将以撒放在坛上：</p><blockquote><p>“<strong><mark>我们的祖宗亚伯拉罕把他儿子以撒献在坛上</mark></strong>，岂不是因行为称义吗？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/2/#L21">雅 2:21</a>)</p></blockquote><blockquote><p>“他既按着上帝的定旨、先见被交与人，<strong><mark>你们就借着无法之人的手，把他钉在十字架上杀了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/2/#L23">徒 2:23</a>)</p></blockquote><p>在十字架上——如同在坛上——人类的救恩得以成就：</p><blockquote><p>“<strong><mark>既在十字架上灭了冤仇，便藉这十字架使两下归为一体，与上帝和好了</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/2/#L16">弗 2:16</a>)</p></blockquote>
