- src: EMRx_Крест__буква_тау
  path: "QO6A_十字架——字母Tau「\U00010915」"
  title: "十字架——字母Tau「\U00010915」"
  copy_cover: true
  body: "<p><strong>在先知以西结的异象中，书记员要在一些人的额上画上记号</strong>「\U00010915」（腓尼基字母Tau）。</p><p>先知以西结见到关于犹太人可憎之事的异象，为此上帝差遣刑罚者前来，由书记员带领。书记员把记号画在那些人的额上——那些人对这些可憎之事同样憎恶，如同上帝一样。按上帝的指示，有这记号的人不会受刑罚触及。</p><blockquote><p>“耶和华对他说：「你去走遍耶路撒冷全城，<strong><mark>那些因城中所行可憎之事叹息哀哭的人，画记号在额上</mark></strong>。」 我耳中听见他对其余的人说：「要跟随他走遍全城，以行击杀。你们的眼不要顾惜，也不要可怜他们． 要将年老的、年少的，并处女、婴孩和妇女从圣所起全都杀尽，<strong><mark>只是凡有记号的人不要挨近他</mark></strong>。」于是，他们从殿前的长老杀起。” (<a href=\"https://bibleox.com/zh-Hans/cn-cuv/iez/9/#L4-6\">结 9:4-6</a>) <em>(俄文本引用处误作 Иез 1:4-6；经文实为 Иез 9:4-6。)</em></p></blockquote><p>在希伯来文中「画记号」写作「הִתְוִיתָ <strong>תָּו</strong>」[taw-vaw' tawv]。</p><p>直译可以译作「画上<strong>תָּו</strong>」（Tau字母），但先知以西结出生之时，犹太人还在使用腓尼基文字或源自腓尼基文字的古希伯来文字；按那种文字，Tau字母写作「\U00010915」。这样，按字面写的是：「<strong>画上</strong>\U00010915」。</p><p>古代基督徒也同样在自己额上画十字：<a href=\"https://bibleox.com/ru/ru/w/крестное-знамение\">十字圣号</a></p><p><hr></p><p>犹太人从基督降生前约十世纪到七世纪使用腓尼基字母（源自腓尼基字母的古希伯来字母）。也就是说，它使用到巴比伦之囚为止。犹太人在16年中分几个阶段被掳往巴比伦（<a href=\"https://ru.wikipedia.org/wiki/Вавилонский_плен\">公元前598—582年</a>）。</p><p>先知以西结生活的年代约为<a href=\"https://ru.wikipedia.org/wiki/Иезекииль\">公元前约622年——约公元前570年</a>（共52年）。</p><p><a href=\"https://azbyka.ru/days/sv-iezekiil\">25岁</a>时，他与自己的民族一同被掳。</p><p>也就是说，他出生并受教育时还在使用腓尼基文字。</p><p><a href=\"https://ru.wikipedia.org/wiki/Иезекииль\">30岁</a>时，他的先知事奉开始（<a href=\"https://bibleox.com/zh-Hans/cn-cuv/iez/1/#L1\">结 1:1</a>）。</p><p>此时以西结写他的先知书。</p><p>我们所关注的事件记载于第8-9章，发生在再过一年零两个月之后（<a href=\"https://bibleox.com/zh-Hans/cn-cuv/iez/8/#L1\">结 8:1</a>）。</p><p>无论如何，我们来到公元前七至六世纪之交、巴比伦之囚的最开始，此时犹太人的新文字才开始逐渐形成。字母并不是一下子改变的，这在被掳期间经历了很长时间。</p><p>最可能的是，先知还在使用犹太民族所能明白的腓尼基文字，相应地，把Tau写作「\U00010915」。如果这是正确的，那么书记员要在人的额上画上「\U00010915」这个符号，使他们免受刑罚——这也把我们引向主的十字架的救赎意义。</p>"
