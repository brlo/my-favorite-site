- src: крест-Иаков
  path: QO5A_十字架——雅各的祝福
  title: 十字架——雅各的祝福
  copy_cover: true
  body: <p>雅各给孙子的十字形祝福。约瑟领着自己的儿子们，把每一个正对着父亲相应的手，但雅各交叉了双手，把他们调换了位置：</p><blockquote><p>“随后约瑟又拉着他们两个，<strong><mark>以法莲在他的右手里，对着以色列的左手</mark></strong>；玛拿西在他的左手里，对着以色列的右手，领他们到以色列的跟前。 以色列伸出右手来，按在以法莲的头上，以法莲乃是次子；<strong><mark>又剪搭过左手来按在玛拿西的头上</mark></strong>，<strong><mark>玛拿西原是长子</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/48/#L13-14">创 48:13-14</a>)</p></blockquote>
  meta_desc: 关于雅各十字形祝福的预像意义的引文
  menu:
    parent: 旧约/预表
    title: 十字架——雅各的祝福
    priority: 5
