  title: 反对“唯独圣经”
  copy_cover: true
  body: <h2>前言</h2><p>“唯独圣经”是一种用来建立自己教会的伎俩。如同街头猜杯戏法的把戏，用简单而灵活的手法把听众绕晕，使他们觉察不到就在眼前进行的调包。他们传授的并不是“只按圣经”的教训，而是又一种对圣经的解释——摈弃一切不符合新教师个人信仰（他的意见）的东西。教师的个人信仰被传递给听众，成为又一个人的传统。但这传统不被称为传统——伎俩就在这里：听众产生一种错觉，仿佛他们只按圣经相信。以前的异端团体就是这样建立的：摈弃教会直接从使徒们与圣经一起领受的信仰，把教师们自己的意见高举于一切之上，而这些意见彼此各不相同。无论出现多少教派，它们的教师们按圣经可以解释出任何一种信仰。</p><p><strong>圣里昂的伊里奈乌斯，圣殉道者（约130-202）</strong></p><p>“……<strong>藉着歪曲的解释和不当的说明，他们试图不仅从福音书和使徒的话、而且从律法和先知书中，为自己拼凑出有利于己的证明</strong><…><strong>他们用极大的强暴和诡诈，把自己的虚构套在它们上面，从而俘虏并引离真理那些信心不坚固的人</strong><…>你看，亲爱的，<strong>他们如此迷惑自己的头脑的方式：强暴地对待圣经，试图用圣经证实自己的虚构</strong>。<…>现在让我们看看这些（异端教师们）意见的反复无常：<strong>他们两三个人对同一件事说的不是同一回事，而是彼此矛盾</strong>，无论在事情的本质上还是在名称上。<…><strong>他们每一个人都按自己的喜好教导。</strong>”</p><p>（[俄文](https://bibleox.com/ru/ru/w/Ириней_Лионский-Против_ересей/#HH-3)《驳异端》第1卷）</p><p>“这就是<strong>他们之间对同一处经文的分歧、对同样圣经的不同理解</strong>。”</p><p>（[俄文](https://bibleox.com/ru/ru/w/Ириней_Лионский-Против_ересей-4#HH-Глава-XXXV-Опровержение-тех-которые-одни-пророчества-производят-от-Всевышнего-Бога-другие--от-Демиурга)《驳异端》第4卷第35章第4节）</p><p><strong>圣耶罗姆·斯特里东斯基（约347-420）</strong></p><p>“既然我们已经说了很多，争论的冗长已使听众疲倦，我就把心里的话简短而坦白地对你说：<strong>应当坚定地持守那由使徒们建立、一直存留到今日的教会。你若在什么地方听说有人自以为是属基督的，却不从主耶稣基督、而从别人得了名——比如马吉安派、瓦伦廷派、孟他努派或坎皮特派——要知道那不是基督的教会，而是敌基督的会堂。他们出现得较晚这一点本身，就指明他们正是使徒所预言将来要有的那些人。让他们不要自欺，以为在自己的话里似乎找到了圣经的证实：因为魔鬼也说过些出于圣经的话；圣经的实质不在于诵读，而在于理解。否则，如果我们只随从</strong>字面<strong>，我们自己也能编出一个新的教条来</strong>，比如说：不应当接纳穿鞋并有两件里衣的人进教会。”</p><p>（[俄文](https://azbyka.ru/otechnik/Ieronim_Stridonskij/razgovor-protiv-lyutsiferian/)《驳路西弗派对话录》）</p><p><strong>勒林的圣文森特（卒于450年前）</strong></p><p>“我们还抨击了涅斯托利罪愆的高傲：他<strong>自夸只有他一人明白圣经，仿佛在他以前解释过上帝圣言的一切人都不知道它——他们拥有教师的恩赐，即所有的司祭、所有的宣信者和殉道者</strong>，其中一些人讲解上帝的律法，另一些人赞同讲解的人或相信他们；他最后<strong>断言整个教会如今在迷误、并且一直在迷误</strong>——在他看来，教会一直跟随、并将跟随无知而迷误的教师们。”</p><p>（[俄文](https://bibleox.com/ru/ru/w/IRu7_Памятные_записки_Перегрина/)《游记备忘录》）</p><p>其余类似的言论见：<a href="https://bibleox.com/ru/ru/w/WxNK_Против_Sola_Scriptura">反对唯独圣经的语录</a></p><h2>“唯独圣经”</h2><p><strong>“唯独圣经”</strong>（拉丁文 Sola Scriptura，俄文——Только Писание）——十六世纪改革家们（<a href="https://bibleox.com/ru/ru/w/3SlQ_Протестантизм">新教</a>运动的创始者）提出的建立教义的方法：按照这一方法，建立教义的最高权威只是圣经（按读者的主观理解）。</p><p>虽然理论上如此，但在新教徒和新新教徒中间，广泛地把“唯独圣经”理解为完全弃绝圣传。愿意在教父遗产领域论辩的新教徒并不多；而且最常见的是，在正教徒与新教徒的论辩中，只要提到圣教父的名字、更不必说他们的著作，就会遇到激烈的排斥和讥笑。“传统”一词在新教团体中被赋予负面的态度——把它与“古人的遗传”（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/15/#L2">太 15:2</a>）等同起来，同时完全无视使徒圣传的存在——而使徒们自己曾命令保守这传统（<a href="https://bibleox.com/zh-Hans/cn-cuv/2sol/2/#L15">帖后 2:15</a>）：这信仰是主和使徒们以种种方式栽种在教会里、并在教会中不断保存、由祖先传给后代的。</p><h2>为“唯独圣经”辩护的尝试</h2><p>“唯独圣经”的拥护者引用圣经的引文，摆出这样的姿态，仿佛其中说的是必须把圣经当作信仰的最高或唯一权威。然而实际上，所引的引文中没有一处说的是“唯独圣经”，即仿佛<strong>只有</strong>圣经（除它之外什么都没有）在教义中拥有某种独一的、最高的或唯一的角色。</p><p>为“唯独圣经”辩护所引用的引文有以下几类。</p><h3>1. 上帝的道——是真理</h3><p>上帝以任何方式所宣告的（口头的、书面的、异象中、经由使者：天使、先知或使徒）——都是真理：</p><blockquote><p>“求你用真理使他们成圣；<strong><mark>你的道就是真理</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/17/#L17">约 17:17</a>)</p></blockquote><p>对此我们不争辩。上帝的每一句话都是真理，而不只是写下的。口传的圣传也称为上帝的道：</p><blockquote><p>“为此，我们也不住的感谢上帝，因你们听见<strong><mark>我们所传上帝的道</mark></strong>，就领受了；不以为是人的道，<strong><mark>乃以为是上帝的道</mark></strong>。这道实在是上帝的，并且运行在你们信主的人心中。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1sol/2/#L13">帖前 2:13</a>)</p></blockquote><blockquote><p>“你们蒙了重生，不是由于能坏的种子，乃是由于不能坏的种子，是借着上帝活泼常存的道。 因为：『凡有血气的，尽都如草，他的美荣都像草上的花。草必枯干，花必凋谢； <strong><mark>惟有主的道是永存的</mark></strong>。』<strong><mark>所传给你们的福音就是这道</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/1/#L23-25">彼前 1:23-25</a>)</p></blockquote><p>对圣经都是上帝所默示的，我们也不争辩：</p><blockquote><p>“<strong><mark>圣经都是上帝所默示的</mark></strong>，于教训、督责、使人归正、教导人学义都是有益的，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/3/#L16">提后 3:16</a>)</p></blockquote><h3>2. 圣经对信徒是重要的</h3><p>圣经对信徒有很高的价值：</p><blockquote><p>“<strong><mark>圣经都是上帝所默示的</mark></strong>，<strong><mark>于教训</mark></strong>、督责、使人归正、教导人学义都是<strong><mark>有益</mark></strong>的，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/3/#L16">提后 3:16</a>)</p></blockquote><blockquote><p>“<strong><mark>你们查考圣经</mark></strong>，因你们以为内中有永生；给我作见证的就是这经；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/5/#L39">约 5:39</a>)</p></blockquote><p>对此我们同样不争辩。</p><p>---</p><p>这一切都是对的。正教会不与其中任何一点争辩，而是自己肯定这一切。</p><p>然而：</p><ul><li><p>这些引文并不表明真理<strong>只</strong>在圣经里，而圣传不是真理；关于圣传的同样的引文干脆被忽略（见<a href="https://bibleox.com/ru/ru/w/Против_Сола_Скриптуры#HH-Указание-хранить-Предание-и-учить-согласно-с-ним">下文</a>），因为“唯独圣经”的拥护者没有维护圣传之必要性的目标。</p></li><li><p>这些引文并不表明<strong>一切</strong>上帝的启示都写在了圣经里、因此仿佛圣传可以被抛弃。抛弃圣传——是违背圣经的行为（<a href="https://bibleox.com/zh-Hans/cn-cuv/2sol/2/#L15">帖后 2:15</a>）。</p></li></ul><p>所引的一切引文对于“唯独圣经”这一概念中的“唯独”一词完全没有说什么。它们只是指明上帝启示的必要性和它的真实性，无论这启示以什么形式被领受：书面的、口头的或以可见方式显示的。我们相信这一点，这里没有任何“唯独圣经”的成分。</p><h2>“唯独圣经”宣讲者的伎俩</h2><p>向听众表明圣经拥有很高的权威、听圣经就是听上帝之后，接下来在听众完全不觉察的情况下发生了调包：开始讲话、按自己的意思解释圣经的，不再是上帝和圣经，而是宣讲者。于是现在被要求当作上帝的话来接受的——是宣讲者的话，是几千个在解释圣经上彼此矛盾的团体之一的创立者的话。</p><p>当然，宣讲者在自己的话语中继续引用圣经，用一套引文支持自己的话；但这里明显的问题是：新教以这种方式生出了关于上帝、他的作为和拯救方式的成千种随便什么样的教训。更有甚者，从基督教存在之初，教会之外的团体就力求歪曲信仰、恰恰藉着歪曲圣经把人引到自己那里。连魔鬼也这样做过——正是用圣经试探基督：</p><blockquote><p>“魔鬼就带他进了圣城，叫他站在殿顶上， 对他说：「你若是上帝的儿子，<strong><mark>可以跳下去</mark></strong>，<strong><mark>因为经上记着说</mark></strong>：『<strong><mark>主要为你吩咐他的使者，用手托着你</mark></strong>，免得你的脚碰在石头上。』」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/4/#L5-6">太 4:5-6</a>)</p></blockquote><p>魔鬼同样藉着上帝的话语使最初的人堕落：</p><blockquote><p>“耶和华上帝所造的，惟有蛇比田野一切的活物更狡猾。蛇对女人说：「<strong><mark>上帝岂是真说不许你们吃园中所有树上的果子吗</mark></strong>？」 女人对蛇说：「园中树上的果子，我们可以吃， 惟有园当中那棵树上的果子，上帝曾说：『你们不可吃，也不可摸，免得你们死。』」 蛇对女人说：「<strong><mark>你们不一定死</mark></strong>， 因为上帝知道，你们吃的日子眼睛就明亮了，你们便如上帝能知道善恶。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/3/#L1-5">创 3:1-5</a>)</p></blockquote><p>这样，魔鬼和与教会为敌的团体的创立者们，正是使用圣经来诱惑人。这是怎么发生的？发生的原因在于：把圣经的权威赋予了它的私人的解释。</p><h2>“唯独圣经”的根本问题——主观主义</h2><p>这一建立信仰之方式的根本问题在于：<strong>不存在对圣经的客观理解</strong>。每个人都透过自己积累的经验、世界观、兴趣和偏好来接受它，也就是<strong>主观地</strong>接受。简单地说，问题在于：<strong>谁来决定什么符合圣经、什么不符合？</strong>“唯独圣经”不回答这个问题。恰恰是这一点使它成为只在理论上存在、无法在实践中实现的学说。这不是无根据的断言。</p><p>“唯独圣经”最早的使用者（改革家们）提出了以他们各自不同的、对圣经的理解为基础的不同教义。分歧涉及最重要的问题：</p><ul><li><p>得救；</p></li><li><p>人是否被预定得救，</p></li><li><p>人的罪性，</p></li><li><p>圣奥秘在信徒生活中的角色，</p></li><li><p>基督在圣餐中临在的真实性，</p></li><li><p>能否给婴儿施洗，</p></li><li><p>信徒生活中有没有圣像。</p></li></ul><p>不同的教义立刻产生了不同的团体。而这只是开始。随着时间推移，“唯独圣经”使用者中间的分歧和分裂迅速增多；开始于路德、加尔文和英国国教的三个方向，后来发展出成千上万个派别。</p><h2>团体领袖作为信仰的源头</h2><p>如果圣经是某种自足的信仰源头，那么任何主张“只按圣经”建立信仰的人，就都会有与“唯独圣经”其他使用者相同的信仰。然而他们所有人的信仰都不相同，就是说信仰的源头也不相同。这源头——是团体的建立者。他想出来、传给自己的追随者，而追随者们保存自己领袖的信仰。</p><h2>事实上在新教团体中占第一位的，不是圣经，而正是自己的传统</h2><p>在所有这样的团体中，占第一位的正是他们的传统，而圣经只是被当作辅助的工具使用——从中挑选有利于论证传统的引文。在这样的团体中所领受的信仰，实际上凌驾于圣经之上；圣经文本只被用来在听众周围制造肥皂泡——一种吸引人的错觉，仿佛这里只按圣经相信，而与此同时，藉着宣讲，被植入他意识中的恰恰是这个他落到其中的团体的传统。</p><h2>不敬虔的对立</h2><p>在“唯独圣经”拥护者所建立的团体中，广泛流传着这样的对立：教会抛弃了圣经、只按传统相信；而每个新教团体相反——抛弃了传统、只按圣经相信。</p><p>实际上：</p><ul><li><p>教会不是只按传统相信——她把圣经与传统平等地使用；</p></li><li><p>新教团体也不是只按圣经相信——他们只承认自己领袖的信仰为正确，并把它作为传统保存。</p></li></ul><p>这样，实践中根本不存在任何“唯独圣经”。它只存在于理论中。每个具体的人对这一概念的实现，必然带来又一种新信仰、又一种对圣经的新理解、又一个团体，以及随之而来的又一个传统。</p><p>证明这一点并不难。做一个实验就够了。如果一个人进入这样的团体之一，而这团体不向他传递自己的知识、只是把一本圣经放在他手里，那么只读这一本圣经，这个人百分之百不会得出这个团体的信仰。他只有在一种情况下才会得出他们的信仰——如果这团体把自己的信仰传给他。</p><p>正教会用圣经证实自己全部的教义。然而新教团体不同意教会性的圣经理解，提出以自己的理解和信仰来代替“唯独圣经”（默不作声）。</p><h2>“唯独圣经”与圣经直接冲突</h2><p>正教会反对“唯独圣经”的理由，不是针对“圣经”一词，而是针对“唯独”一词。而理由正是建立在圣经上的：</p><ol><li><p>“唯独圣经”在圣经里没有。圣经本身没有建立“只按圣经”的信仰、或只偏爱圣经的要求。因此新教徒只能引用关于圣经之重要性的引文（对关于圣传之重要性的引文避而不谈），因为圣经里关于“唯独圣经”的引文根本没有。</p></li><li><p>相反，圣经说要保守口传的圣传。多次要求保守圣传：不仅是使徒们书面的、还有口头的宣讲（<a href="https://bibleox.com/zh-Hans/cn-cuv/2sol/2/#L15">帖后 2:15</a>）。而且使徒们把口头宣讲放在第一位（<a href="https://bibleox.com/zh-Hans/cn-cuv/2sol/2/#L15">帖后 2:15</a>）。</p></li><li><p>圣经要求向教会的教师们学习。上帝在教会里设立了司祭们和教师们（<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/12/#L28">林前 12:28</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/4/#L11">弗 4:11</a>），教会的羊群（会众）被托付给他们管理并教导。“唯独圣经”的拥护者拒绝向教会学习。这些人不愿在教会里作学生，就宣布自己为教师（<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/4/#L3">提后 4:3</a>）。</p></li><li><p>圣经可能被错误地解释。圣经里有话：未经教会坚立的人强解圣经，自取沉沦（<a href="https://bibleox.com/zh-Hans/cn-cuv/2pet/3/#L15-16">彼后 3:15-16</a>）。“唯独圣经”的拥护者甚至不打算向教会学习。他们自己摈弃教师、只拿了教科书，随意解释圣经，这使他们成为众多分离的团体——有着不同的信仰和不同的对教科书（圣经）的理解。而圣经里说：不经教会的教导而自己解释圣经，导致歪曲圣经和灭亡（<a href="https://bibleox.com/zh-Hans/cn-cuv/2pet/3/#L15-16">彼后 3:15-16</a>）。</p></li></ol><p>这样，“唯独圣经”的拥护者在以下各点上行事违背圣经：</p><ol><li><p>教导圣经里没有的东西。圣经里没有关于“唯独圣经”的教训；</p></li><li><p>摈弃使徒们口传的圣传。他们说只有圣经具有首要意义，却与圣经里所记使徒的话背道而驰——使徒们要求保守圣传，把口头宣讲放在第一位，然后才是书面的（<a href="https://bibleox.com/zh-Hans/cn-cuv/2sol/2/#L15">帖后 2:15</a>）；</p></li><li><p>摈弃教会的教导职分和上帝所立的教会教师们，直接违背圣经（<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/12/#L28">林前 12:28</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/4/#L11">弗 4:11</a>）。</p></li><li><p>不经教会的坚立而解释圣经。每个新教团体都有自己的圣经理解；团体的每个聚会点、乃至聚会点中的每个人，都可以随己意理解圣经，因为“唯独圣经”催促人摈弃圣经（按读者的理解）之外任何其他教义来源的最高权威。如果一个人喜欢另一种对圣经的理解，那它就被认为是正确的——毕竟圣经比宣讲者的话更大，哪怕那宣讲者是新教的。</p></li></ol><h2>“唯独圣经”观念错误的最主要证明</h2><p>如果发明“唯独圣经”的目的是尽可能地分裂基督教世界，那么这一观念极其有效。但如果发明它的目的是寻找使徒的信仰，那么“唯独圣经”就成了错误的观念，它使人远离目标，并生出了众多的传统和分裂。</p><p>“唯独圣经”错误的最主要证明——就是“唯独圣经”的使用者们自己：以“只按圣经”为口号建立的、无数彼此矛盾的团体及其教义。没有任何别的观念像“唯独圣经”那样在信基督的人中制造了这么多分裂。而这是直接违背圣经作的（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/17/#L20-21">约 17:20-21</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/1/#L10">林前 1:10</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/2/#L18-19">约壹 2:18-19</a>）。</p><blockquote><p>“我不但为这些人祈求，也为那些因他们的话信我的人祈求， <strong><mark>使他们都合而为一</mark></strong>；正如你父在我里面，我在你里面，使他们也在我们里面，<strong><mark>叫世人可以信你差了我来</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/17/#L20-21">约 17:20-21</a>)</p></blockquote><blockquote><p>“弟兄们，我藉我们主耶稣基督的名，劝你们<strong><mark>都说一样的话</mark></strong>。你们中间也<strong><mark>不可分党</mark></strong>，只要<strong><mark>一心一意</mark></strong>，<strong><mark>彼此相合</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/1/#L10">林前 1:10</a>)</p></blockquote><blockquote><p>“小子们哪，如今是末时了。你们曾听见说，那敌基督的要来，<strong><mark>现在已经有好些敌基督的出来了</mark></strong>，从此我们就知道如今是末时了。 <strong><mark>他们从我们中间出去，却不是属我们的</mark></strong>；若是属我们的，就必仍旧与我们同在；他们出去显明都不是属我们的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/2/#L18-19">约壹 2:18-19</a>)</p></blockquote><p>---</p><p>十六世纪，改革家路德提出了“唯独圣经”的概念。后来每个改革家都开始建立信仰，如他们所宣称的，把最高权威赋予“只按圣经”（即对圣经的自己理解）。原本以为只按圣经建立信仰，应当使人们得出使徒的信仰。这样就宣称：正是这个方法、并且只有这个方法，使人得以达到使徒的信仰。但结果，所有改革家都与构想相违，得到了各不相同的信仰。</p><p>“唯独圣经”的进路最初产生了三个对圣经理解不同的方向：信义宗、加尔文宗和英国国教。后来，这一概念使地球上的任何人都可以建立自己的团体和自己的教义——只要拿起一本圣经。于是就出现了成千上万的所谓“宗派”，每个都有自己的信仰和自己的圣经理解。这一过程至今仍在继续。因信仰的差异，按人的习俗（<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/3/#L3">林前 3:3</a>），他们彼此分离，各有不同的信仰、不同的洗礼和不同的上帝观。这一切都与教会中应有的样子相违背：</p><blockquote><p>“<strong><mark>身体只有一个</mark></strong>，圣灵只有一个，正如你们蒙召，同有一个指望。 <strong><mark>一主，一信，一洗</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/4/#L4-5">弗 4:4-5</a>)</p></blockquote><p>有人可能就信仰上帝的不同提出异议，说大家都信耶稣。然而并非人人都有使徒们对基督作为上帝的信仰；有不少新教一位论者，否认对独一上帝——父、子、圣灵三位一体——的信仰。此外，许多团体对上帝、对他的旨意和讨他喜悦的方式有不同的观念。比如五旬节派/灵恩派认为，上帝喜悦他们无条理的喃喃、倒在地上，仿佛这一切都是圣灵——即上帝——的运作。而别的团体则拒绝五旬节派对上帝的这种观念，提出自己另外的观念。这样，他们对上帝有不同的观念，有时甚至有关于上帝的不同教训。</p><p>无数手拿圣经、彼此矛盾、宣称又建立了一种“只按圣经”之信仰的人，是反对“唯独圣经”的最鲜明论据。人们曾应许说，藉着“唯独圣经”会铺就通向唯一使徒信仰的道路，把信仰从“人的附加物”中解放出来；但实际上，这一进路生出了无数人的附加物，没有给基督教世界带来任何东西，只有无数的分裂——违背上帝关于信徒合一的旨意（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/17/#L20-21">约 17:20-21</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/1/#L10">林前 1:10</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/2/#L18-19">约壹 2:18-19</a>）。</p><h3>旧约中的平行</h3><p>类似的分裂在旧约中也发生过——在建造巴比伦城和塔的时候（<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/11/#L1-9">创 11:1-9</a>）。人们想靠自己的力量建一座城和一座通天的塔（<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/11/#L4">创 11:4</a>），但开始说不同的话（<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/11/#L7">创 11:7</a>），分裂并分散了（<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/11/#L8">创 11:8</a>）。如今也是这样。</p><p>上帝建立了教会，永远赐给她圣灵（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/14/#L16">约 14:16</a>），自己应许常与她同在（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/28/#L20">太 28:20</a>），口传了教训，立了司祭（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/20/#L17-18,28">徒 20:17-18,28</a>）和教师（<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/12/#L28">林前 12:28</a>）——他们口头教导，但也进行书信往来。</p><p>十五个多世纪之后，来了些人，从教会里只取了教会所保存的部分使徒的书信（并非全部），违背这些书信，摈弃了不可战胜的教会（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/16/#L18">太 16:18</a>）——上帝所立的根基；摈弃了从使徒领受、保存在教会里的信仰——使徒们的圣传（<a href="https://bibleox.com/zh-Hans/cn-cuv/2sol/2/#L15">帖后 2:15</a>等）；摈弃了上帝所立的司祭（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/20/#L17-18,28">徒 20:17-18,28</a>）和教师（<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/12/#L28">林前 12:28</a>）；决意按自己的聪明和力量（历史、考古、语言学等研究）独立地、与上帝所建立的教会分离地，建造自己的城。别的建造者也加入了他们。结果，他们开始说不同的话，分裂并分散，开始建造自己的、各有自己交流语言的居住地，而不愿住在那座“有根基的城——其设计者和建造者乃是上帝”（<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/11/#L10">希 11:10</a>）。</p><h2>“唯独”圣经导致“唯独”式思维</h2><p>新教的教训包含许多带“唯独”一词的论点，它常使拥护者陷入一种思维，可简称为“唯独”式思维。这使其中许多人只注意文本中自己喜欢的一些片段，在合适的地方想象出“唯独”一词，仿佛对自己说：“只有这些话我应当考虑”，并在这上面建立某种构造。当某文本的作者考察同一事物的不同方面——或依次、或在作品的不同地方描述它们——时，新教徒往往只选出一样，把它绝对化。</p><ul><li><p>例如，使徒们写道，得救既需要信心，也需要行为。“唯独”式思维使人只挑选关于信心的片段，并加上“唯独”一词。</p></li><li><p>使徒们既写圣经，也写圣传的必要。“唯独”式思维使人只挑选关于圣经之重要性的片段，并加上“唯独”一词。</p></li></ul><p>在研究古代作家的文本时，这种思维几乎处处显现。</p><ul><li><p>例如，作者们在解释圣餐时给出两种解释（字面的和象征的）；新教徒倾向于只看见象征性的解释，试图把这些作者说成自己“唯独”式教训的拥护者。</p></li></ul><p>按这一原则产生了许多异端。耶稣基督是人这一事实，难道意味着他<strong>只是</strong>人？不，他也是上帝。而如果他是上帝，这是否意味着他<strong>只是</strong>上帝？不，他也是人。如果基督是父的像，这是否意味着他<strong>只是</strong>像（仅是画像）？不，他还是真上帝、真人。多少人在这里跌倒，至今仍在跌倒。这里也是一样：象征性的解释不否定字面的，字面的也不否定象征的。</p><p>正教徒承认圣经和圣传、信心和行为的必要，承认圣餐的字面理解，也同时承认其象征的意义——没有任何东西妨碍这一点。许多新教徒到处坚持“唯独”一词，干脆无视同一位作者的其他话语。</p><h2>耶路撒冷会议与圣经</h2><p>教会不是按“只按圣经”的原则生活的最鲜明证据之一，是使徒们主持的第一次教会会议——耶路撒冷会议的事件。</p><p>在耶路撒冷会议上，没有圣经的指示，废除了摩西的律法、割礼、不洁食物的禁令、安息日的安息、接触死人的禁令、与外邦人交往的禁令等等。这一决定是教会聚集一起商议后作出的（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/15/#L22">徒 15:22</a>）。这作成时没有引用圣经，因为圣经的作者——圣灵——住在教会里；所以会议的决议不是用“因为经上记着”这句话确立，而是指着圣灵和教会的旨意：“因为圣灵和我们定意”（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/15/#L28-29">徒 15:28-29</a>）。</p><p>这样，废除摩西的律法，是圣灵和教会的决定。另一方面，反对他们的是从法利赛教门信了主的基督徒（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/15/#L5">徒 15:5</a>）。在后者一边有圣经中一些可理解的经文（<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/17/#L14">创 17:14</a>）。在使徒们一边的，恰恰是教会的权威：如经所记，他们与全教会一同商议（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/15/#L22">徒 15:22</a>），然后宣布了共同的决定。他们没有用圣经，而只是凭自己的话，向那些按圣经要求守律法的人指明了律法的废除。</p><p>圣经里说必须受割礼，不割礼的人要从民中剪除（<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/17/#L14">创 17:14</a>）。但使徒们并没有吩咐教导这个：</p><blockquote><p>“我们听说<strong><mark>有几个人从我们这里出去</mark></strong>，用言语搅扰你们，<strong><mark>惑乱你们的心</mark></strong>。〔有古卷在此有『你们必须受割礼，守摩西的律法。』〕<strong><mark>其实我们并没有吩咐他们</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/15/#L24">徒 15:24</a>)</p></blockquote><p>但这可是圣经里说的。根据什么不需要教导这个？根据哪部圣经决定不需要受割礼？哪部圣经允许吃猪肉？——这不是按圣经作的，而是按全教会的、证实真理的会议决定（<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/3/#L15">提前 3:15</a>）。</p><p>从那时起，耶路撒冷会议的决定成为教会的圣传：</p><blockquote><p>“他们经过各城，<strong><mark>把耶路撒冷使徒和长老所定的条规交给门徒遵守</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/16/#L4">徒 16:4</a>)</p></blockquote><p>---</p><p>耶路撒冷使徒会议的主席、使徒雅各，在自己的讲话中回忆先知阿摩司的话。这预言里没有受割礼的话：</p><blockquote><p>“到那日，<strong><mark>我必建立大卫倒塌的帐幕</mark></strong>，堵住其中的破口。把那破坏的建立起来，重新修造，像古时一样， <strong><mark>使以色列人得以东所余剩的和所有称为我名下的国</mark></strong>。」此乃行这事的耶和华说的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/am/9/#L11-12">摩 9:11-12</a>)</p></blockquote><p>如果以此为根据接受耶路撒冷会议所作的（某种对圣经的隐含引用和提及圣灵），那么按理也应当接受正教会的所有大公会议，而不只是耶路撒冷会议，因为圣灵被赐给教会，不是只在耶路撒冷会议时，而是永远：</p><blockquote><p>“我要求父，父就另外赐给你们一位保惠师，<strong><mark>叫他永远与你们同在</mark></strong>；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/14/#L16">约 14:16</a>)</p></blockquote><p>基督自己也应许常与教会同在：</p><blockquote><p>“凡我所吩咐你们的，都教训他们遵守，<strong><mark>我就常与你们同在，直到世界的末了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/28/#L20">太 28:20</a>)</p></blockquote><p>在所有会议上——包括捍卫圣像敬礼的第七次会议——都有来自圣经的远为更有分量的依据。圣灵仍然在教会里。按这样的论据，所有会议都应当被接受。</p><h2>教会的教导职分</h2><h3>羊群被托付给长老们——他们曾是它的守护者</h3><blockquote><p>“保罗从米利都打发人往以弗所去，<strong><mark>请教会的长老来</mark></strong>。 他们来了，保罗就说：「你们知道，自从我到亚西亚的日子以来，在你们中间始终为人如何， &lt;…&gt; <strong><mark>圣灵立你们作全群的监督</mark></strong>，你们就当为自己谨慎，也为全群谨慎，<strong><mark>牧养上帝的教会</mark></strong>，就是他用自己血所买来的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/20/#L17-18,28">徒 20:17-18,28</a>)</p></blockquote><h3>上帝在教会里立了教师；不是人人都是教师</h3><blockquote><p>“<strong><mark>他所赐的有使徒，有先知，有传福音的，有牧师和教师</mark></strong>。 <strong><mark>为要成全圣徒，各尽其职，建立基督的身体</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/4/#L11-12">弗 4:11-12</a>)</p></blockquote><blockquote><p>“<strong><mark>上帝在教会所设立的</mark></strong>：第一是使徒，第二是先知，第三是教师，其次是行异能的，再次是得恩赐医病的，帮助人的，治理事的，说方言的。 <strong><mark>岂都是使徒吗</mark></strong>？<strong><mark>岂都是先知吗</mark></strong>？<strong><mark>岂都是教师吗</mark></strong>？<strong><mark>岂都是行异能的吗</mark></strong>？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/12/#L28-29">林前 12:28-29</a>)</p></blockquote><h3>未经教会坚立的人强解圣经，自取沉沦</h3><blockquote><p>“并且要以我主长久忍耐为得救的因由，就如我们所亲爱的兄弟保罗，照着所赐给他的智慧写了信给你们。 他一切的信上也都是讲论这事。<strong><mark>信中有些难明白的</mark></strong>，<strong><mark>那无学问、不坚固的人强解</mark></strong>，如强解别的经书一样，<strong><mark>就自取沉沦</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2pet/3/#L15-16">彼后 3:15-16</a>)</p></blockquote><h2>圣经可以被错误地解释</h2><blockquote><p>“并且要以我主长久忍耐为得救的因由，就如我们所亲爱的兄弟保罗，照着所赐给他的智慧写了信给你们。 他一切的信上也都是讲论这事。<strong><mark>信中有些难明白的</mark></strong>，<strong><mark>那无学问、不坚固的人强解</mark></strong>，如强解别的经书一样，<strong><mark>就自取沉沦</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2pet/3/#L15-16">彼后 3:15-16</a>)</p></blockquote><p>详见：<a href="https://bibleox.com/ru/ru/w/толкование-писания">圣经的解释</a></p><p>“使圣徒们知道：发明异端的魔鬼，因自己恶毒的臭气，利用圣经的经文，把毒藏在它们的外衣之下，诱惑头脑简单的人。他就是这样诱惑了夏娃。就这样产生了别的异端。如今也这样说服亚流伪装起来、说些表面上反对异端的话，以便不知不觉地在人们头脑里播下自己的异端。<…>谁曾听说过这样的事？或者说，这些被收买、谄媚的异端辩护者，是从哪里、从谁那里听到这些的？谁在讲授教理时对他们说过类似的话？<…>如果他们自己承认是如今第一次听到这些，那就让他们不要否认：这异端与我们无干、不是从教父们借来的。不是从教父借来、而是如今才发明的，还能是什么——不就是有福的保罗所预言的吗：‘末世必有人离弃真道，听从那引诱人的邪灵和鬼魔的道理……这等人的良心如同被热铁烙惯了一般’（提前 4:1-2），以及‘离弃真理’的（多 1:14）？”</p><p>（[俄文](https://azbyka.ru/otechnik/Atanasij_Velikij/poslanie_na_arian)《致亚流派书信》第1篇第8节——亚他那修，大圣）</p><h2>什么是圣传？</h2><p>圣传——父上帝的启示，他藉自己的独生子传给使徒们，使徒们传给教会；教会把它作为信仰世世代代以言语（口头的和书面的）和行为传下去：</p><blockquote><p>“因为<strong><mark>你所赐给我的道，我已经赐给他们，他们也领受了</mark></strong>；又确实知道我是从你出来的，并且信你差了我来。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/17/#L8">约 17:8</a>)</p></blockquote><blockquote><p>“我称赞你们，因你们凡事记念我，<strong><mark>又坚守我所传给你们的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/11/#L2">林前 11:2</a>)</p></blockquote><h2>命令保守圣传并按它教导</h2><blockquote><p>“所以弟兄们，你们要站立得稳，<strong><mark>凡所领受的教训，不拘是我们口传的，是信上写的，都要坚守</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2sol/2/#L15">帖后 2:15</a>)</p></blockquote><blockquote><p>“我称赞你们，因你们凡事记念我，<strong><mark>又坚守我所传给你们的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/11/#L2">林前 11:2</a>)</p></blockquote><blockquote><p>“弟兄们，我如今把先前所传给你们的福音，告诉你们知道。这福音你们也领受了，又靠着站立得住； 并且你们若不是徒然相信，<strong><mark>能以持守我所传给你们的</mark></strong>，就必因这福音得救。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/15/#L1-2">林前 15:1-2</a>)</p></blockquote><blockquote><p>“<strong><mark>你在许多见证人面前听见我所教训的</mark></strong>，<strong><mark>也要交托那忠心能教导别人的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/2/#L2">提后 2:2</a>)</p></blockquote><blockquote><p>“弟兄们，我还有话说：我们靠着主耶稣求你们、劝你们，<strong><mark>你们既然受了我们的教训</mark></strong>，知道该怎样行，可以讨上帝的喜悦，就要照你们现在所行的，<strong><mark>更加勉励</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1sol/4/#L1">帖前 4:1</a>)</p></blockquote><blockquote><p>“亲爱的弟兄啊，我想尽心写信给你们，论我们同得救恩的时候，就不得不写信劝你们，要<strong><mark>为从前</mark></strong><strong><mark>一次</mark></strong><strong>交付圣徒的真道竭力的争辩</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iud/1/#L3">犹 1:3</a>)</p></blockquote><blockquote><p>“<strong><mark>坚守所教真实的道理</mark></strong>，就能将纯正的教训劝化人，又能把争辩的人驳倒了。 因为<strong><mark>有许多人不服约束</mark></strong>，说虚空话欺哄人，那奉割礼的更是这样。 这些人的口总要堵住。他们因贪不义之财，将不该教导的教导人，败坏人的全家。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/tit/1/#L9-11">多 1:9-11</a>)</p></blockquote><blockquote><p>“我只怕你们的心或偏于邪，失去那向基督所存纯一清洁的心，就像蛇用诡诈诱惑了夏娃一样。 假如有人来<strong><mark>另传一个耶稣</mark></strong>，不是我们所传过的，或者你们另受一个灵，不是你们所受过的；或者<strong><mark>另得一个福音</mark></strong>，不是你们所得过的，你们容让他也就罢了。 &lt;…&gt; 那等人是假使徒，行事诡诈，装作基督使徒的模样。 这也不足为怪，因为连撒但也装作光明的天使。 所以，他的差役若装作仁义的差役，也不算希奇。他们的结局必然照着他们的行为。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/11/#L3-4,13-15">林后 11:3-4,13-15</a>)</p></blockquote><blockquote><p>“我往马其顿去的时候，曾劝你仍住在以弗所，好嘱咐那几个人<strong><mark>不可传异教</mark></strong>， 也不可听从荒渺无凭的话语和无穷的家谱。这等事只生辩论，并不发明上帝在信上所立的章程。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/1/#L3-4">提前 1:3-4</a>)</p></blockquote><h2>圣传不只是文本，也是听见的言语</h2><blockquote><p>“为此，我们也不住的感谢上帝，因你们听见<strong><mark>我们所传上帝的道</mark></strong>，就领受了；不以为是人的道，乃以为是上帝的道。这道实在是上帝的，并且运行在你们信主的人心中。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1sol/2/#L13">帖前 2:13</a>)</p></blockquote><blockquote><p>“<strong><mark>你从我听的那纯正话语的规模</mark></strong>，要用在基督耶稣里的信心和爱心，常常守着。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/1/#L13">提后 1:13</a>)</p></blockquote><blockquote><p>“<strong><mark>你在许多见证人面前听见我所教训的</mark></strong>，<strong><mark>也要交托那忠心能教导别人的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/2/#L2">提后 2:2</a>)</p></blockquote><blockquote><p>“所以弟兄们，你们要站立得稳，<strong><mark>凡所领受的教训，不拘是我们口传的，是信上写的，都要坚守</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2sol/2/#L15">帖后 2:15</a>)</p></blockquote><blockquote><p>“论到你们，<strong><mark>务要将那从起初所听见的常存在心里</mark></strong>。<strong><mark>若将从起初所听见的存在心里</mark></strong>，你们就必住在子里面，也必住在父里面。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/2/#L24">约壹 2:24</a>)</p></blockquote><blockquote><p>“我称赞你们，因你们<strong><mark>凡事记念我</mark></strong>，又坚守我所传给你们的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/11/#L2">林前 11:2</a>)</p></blockquote><blockquote><p>“<strong><mark>所以要回想你是怎样领受、怎样听见的</mark></strong>，<strong><mark>又要遵守</mark></strong>，并要悔改。若不儆醒，我必临到你那里，如同贼一样；我几时临到，你也决不能知道。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/3/#L3">启 3:3</a>)</p></blockquote><h2>圣传的必要性</h2><h3>圣经并不是关于耶稣基督的全部信息的来源</h3><blockquote><p>“耶稣在门徒面前另外行了许多神迹，<strong><mark>没有记在这书上</mark></strong>。 但记这些事，要叫你们信耶稣是基督，是上帝的儿子，并且叫你们信了他，就可以因他的名得生命。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/20/#L30-31">约 20:30-31</a>)</p></blockquote><blockquote><p>“<strong><mark>耶稣所行的事还有许多</mark></strong>；若是一一的都写出来，我想，所写的书，就是世界也容不下了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/21/#L25">约 21:25</a>)</p></blockquote><h3>圣经里没有关于按手的教导</h3><p>任何一封书信里都没有关于如何施洗、如何按立辅祭、司祭、主教的教导：</p><blockquote><p>“所以，我们应当离开基督道理的开端，竭力进到完全的地步，不必再立根基，就如那懊悔死行、信靠上帝、 <strong><mark>各样洗礼、按手之礼</mark></strong>、死人复活，以及永远审判各等教训。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/6/#L1-2">希 6:1-2</a>)</p></blockquote><h3>使徒们更看重口头的相通</h3><blockquote><p>“我还有许多事要写给你们，<strong><mark>却不愿意用纸墨写出来</mark></strong>，但盼望到你们那里与你们当面谈论，使你们的喜乐满足。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2in/1/#L12">约贰 1:12</a>)</p></blockquote><blockquote><p>“我原有许多事要写给你；<strong><mark>却不愿意用笔墨写给你</mark></strong>， 但盼望快快的见你，我们就当面谈论。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/3in/1/#L13-14">约叁 1:13-14</a>)</p></blockquote><h3>要保守的既有口头的、也有书面的宣讲</h3><p>使徒保罗请求保守圣传（使徒的教导）——它们不只在书信里、也在言语中领受：</p><blockquote><p>“所以弟兄们，你们要站立得稳，<strong><mark>凡所领受的教训，不拘是我们口传的，是信上写的，都要坚守</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2sol/2/#L15">帖后 2:15</a>)</p></blockquote><blockquote><p>“<strong><mark>你在许多见证人面前听见我所教训的</mark></strong>，<strong><mark>也要交托那忠心能教导别人的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/2/#L2">提后 2:2</a>)</p></blockquote><h3>使徒口头宣讲的长久</h3><h4>三年</h4><p>使徒保罗教导亚西亚的长老们三年之久，昼夜不住：</p><blockquote><p>“所以你们应当儆醒，记念我<strong><mark>三年之久昼夜不住的流泪，劝戒你们各人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/20/#L31">徒 20:31</a>)</p></blockquote><h4>一年半</h4><p>在哥林多教导团体一年半：</p><blockquote><p>“这事以后，保罗离了雅典，来到哥林多。 &lt;…&gt; 保罗<strong><mark>在那里住了一年零六个月</mark></strong>，<strong><mark>将上帝的道教训他们</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/18/#L1,11">徒 18:1,11</a>)</p></blockquote><h4>两年零两个月</h4><p>在以弗所宣讲：先在会堂里三个月，然后与门徒在学房里两年：</p><blockquote><p>“保罗进会堂放胆讲道，<strong><mark>一连三个月</mark></strong>，辩论上帝国的事，劝化众人。 后来，有些人心里刚硬不信，在众人面前毁谤这道。保罗就离开他们，也叫门徒与他们分离，便在推喇奴的学房<strong><mark>天天辩论</mark></strong>。 <strong><mark>这样有两年之久</mark></strong>，叫一切住在亚西亚的，无论是犹太人，是希利尼人，都听见主的道。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/19/#L8-10">徒 19:8-10</a>)</p></blockquote><p>总计，仅使徒保罗一人就宣讲了不少于30年：从他33-34年归主，到64-67年去世。</p><h2>使徒们使用圣传</h2><p>使徒说出两个埃及术士的名字，圣经中没有记载：</p><blockquote><p>“<strong><mark>从前雅尼和佯庇怎样敌挡摩西</mark></strong>，这等人也怎样敌挡真道。他们的心地坏了，在真道上是可废弃的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/3/#L8">提后 3:8</a>)</p></blockquote><p>使徒犹大讲到圣经中没有记载的争辩：</p><blockquote><p>“<strong><mark>天使长米迦勒为摩西的尸首与魔鬼争辩的时候</mark></strong>，尚且不敢用毁谤的话罪责他，只说：『主责备你吧！』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iud/1/#L9">犹 1:9</a>)</p></blockquote><p>关于以诺的话，圣经中没有记载：</p><blockquote><p>“<strong><mark>亚当的七世孙以诺曾预言这些人说</mark></strong>：『<strong><mark>看哪，主带着他的千万圣者降临</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iud/1/#L14">犹 1:14</a>)</p></blockquote><p>使徒保罗讲到先知以赛亚藏在树洞里而被锯死的事：</p><blockquote><p>“被石头打死，<strong><mark>被锯锯死</mark></strong>，受试探，被刀杀，披着绵羊，山羊的皮各处奔跑，受穷乏、患难、苦害，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/11/#L37">希 11:37</a>)</p></blockquote><p>福音史家路加根据从目击者听来的话写下福音，即写下圣传：</p><blockquote><p>“提阿非罗大人哪，有好些人提笔作书，述说在我们中间所成就的事，是<strong><mark>照传道的人从起初亲眼看见又传给我们的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/1/#L1">路 1:1</a>) <em>(俄文原文引路加福音 1:2，和合本无第2节，其内容并入第1节)</em></p></blockquote><h3>传达福音书中没有的信息</h3><p>使徒保罗在对以弗所长老们的讲话中指出基督救主的一个教导，福音书中没有记载：</p><blockquote><p>“我凡事给你们作榜样，叫你们知道应当这样劳苦，扶助软弱的人，又当记念主耶稣的话，说：『<strong><mark>施比受更为有福</mark></strong>。』」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/20/#L35">徒 20:35</a>)</p></blockquote><p>又讲到复活基督向许多人显现，这也是福音书中没有记的：</p><blockquote><p>“后来<strong><mark>一时显给五百多弟兄看</mark></strong>，其中一大半到如今还在，却也有已经睡了的。 以后显给雅各看，再显给众使徒看，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/15/#L6-7">林前 15:6-7</a>)</p></blockquote><h2>圣传的重要性</h2><p>错误的教导不引人归向上帝：</p><blockquote><p>“凡<strong><mark>越过基督的教训不常守着的，就没有上帝</mark></strong>；<strong><mark>常守这教训的</mark></strong>，就有父又有子。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2in/1/#L9">约贰 1:9</a>)</p></blockquote><p>异端（错误的教导）不能承受上帝的国：</p><blockquote><p>“拜偶像、邪术、仇恨、争竞、忌恨、恼怒、结党、纷争、<strong><mark>异端</mark></strong>、 嫉妒〔有古卷在此有『凶杀』二字〕、醉酒、荒宴等类。我从前告诉你们，现在又告诉你们，<strong><mark>行这样事的人必不能承受上帝的国</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/5/#L20-21">加 5:20-21</a>)</p></blockquote><h2>要远离引入新教导的人</h2><blockquote><p>“<strong><mark>分门结党的人</mark></strong>，警戒过一两次，<strong><mark>就要弃绝他</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/tit/3/#L10">多 3:10</a>)</p></blockquote><blockquote><p>“<strong><mark>若有人传异教</mark></strong>，不服从我们主耶稣基督纯正的话与那合乎敬虔的道理， 他是自高自大，一无所知，<strong><mark>专好问难，争辩言词</mark></strong>，从此就生出嫉妒、纷争、毁谤、妄疑， 并那坏了心术、失丧真理之人的争竞。他们以敬虔为得利的门路。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/6/#L3-5">提前 6:3-5</a>) <em>(俄文原文6:5末有“要远离这样的人”一句，和合本无)</em></p></blockquote><blockquote><p>“提摩太啊，你要<strong><mark>保守所托付你的</mark></strong>，<strong><mark>躲避世俗的虚谈</mark></strong>和那敌真道、似是而非的学问。 已经有人自称有这学问，就偏离了真道。愿恩惠常与你们同在。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/6/#L20-21">提前 6:20-21</a>)</p></blockquote><blockquote><p>“弟兄们，我们奉主耶稣基督的名吩咐你们：凡有弟兄不按规矩而行，<strong><mark>不遵守从我们所受的教训</mark></strong>，<strong><mark>就当远离他</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2sol/3/#L6">帖后 3:6</a>)</p></blockquote><blockquote><p>“弟兄们，<strong><mark>那些离间你们、叫你们跌倒</mark></strong>、背乎所学之道的人，我劝你们要留意躲避他们。 因为这样的人不服事我们的主基督，只服事自己的肚腹，用花言巧语诱惑那些老实人的心。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/16/#L17-18">罗 16:17-18</a>)</p></blockquote><h2>必须敬礼圣人并跟随他们</h2><blockquote><p>“<strong><mark>从前引导你们、传上帝之道给你们的人，你们要想念他们</mark></strong>，<strong><mark>效法他们的信心</mark></strong>，留心看他们为人的结局。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/13/#L7">希 13:7</a>)</p></blockquote><blockquote><p>“<strong><mark>所以，我求你们效法我</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/4/#L16">林前 4:16</a>)</p></blockquote><blockquote><p>“弟兄们，<strong><mark>你们要一同效法我</mark></strong>，<strong><mark>也当留意看那些照我们榜样行的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/fil/3/#L17">腓 3:17</a>)</p></blockquote><p>关于敬礼圣人的详情：<a href="https://bibleox.com/ru/ru/w/почитание-святых-в-Библии">敬礼圣人</a></p><h2>对批评的回应</h2><h3>“当求问律法和训诲”（赛 8:20）</h3><p>为“唯独圣经”辩护的人引用旧约的这段引文：</p><blockquote><p>“有人对你们说：「<strong><mark>当求问那些交鬼的和行巫术的</mark></strong>，就是声音绵蛮，言语微细的。」你们便回答说：「百姓不当求问自己的上帝吗？岂可为活人求问死人呢？」 <strong><mark>人当以训诲和法度为标准</mark></strong>，他们所说的若不与此相符，必不得见晨光。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/8/#L19-20">赛 8:19-20</a>)</p></blockquote><ol><li><p>这里丝毫没有说圣经高于圣传。何况，在巫术与圣经之间当然要选择圣经。这几句话讲的是把摩西五经（妥拉）和预言（先知们的话）与巫士和灵媒的话相比较——民中根本不应当有这样的人（<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/18/#L9-14">申 18:9-14</a>）。先知以赛亚建议把妥拉和先知的话作为外在的工具，用以责备巫士，向民众指明巫士所说的与上帝所说的之间的区别。</p></li><li><p>再者，在旧约时代，圣经原则上不可能与圣传分离。没有圣传，不仅不可能正确理解它，甚至不可能正确诵读它，因为它只用辅音字母写成（详见<a href="https://bibleox.com/ru/ru/w/евангелисты-обращаются-к-Септуагинте">详见</a>）。不知道读音，同一个词可以读得不同。要正确诵读这些话，就必须处于诵读的传统中；而这一传统作为圣传由祖先传给后代。所以一切关于圣经的话都与圣传不可分。</p></li><li><p>应当提醒对手他们自己的论题——“唯独圣经”坚持“唯独”（Sola）一词，即只有圣经是最高权威。然而在所引的引文里，没有圣经权威的这种独一性，没有“唯独”一词（或类似的话）——而这正是“唯独圣经”拥护者想看见的。如果仅以没有直接提到圣传为理由就把“唯独”加在这里，那就应当一贯地承认：在另一些类似的引文里是在提议“只按圣传”建立信仰，因为那里没有提到圣经：</p></li></ol><blockquote><p>“<strong><mark>你从我听的那纯正话语的规模</mark></strong>，要用在基督耶稣里的信心和爱心，常常守着。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/1/#L13">提后 1:13</a>)</p></blockquote><blockquote><p>“<strong><mark>你在许多见证人面前听见我所教训的</mark></strong>，<strong><mark>也要交托那忠心能教导别人的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/2/#L2">提后 2:2</a>)</p></blockquote><p>遵行所听见的圣传，不仅使人能分辨正确与错误，还能——无穷得多——使人住在上帝里面：</p><blockquote><p>“论到你们，<strong><mark>务要将那从起初所听见的常存在心里</mark></strong>。<strong><mark>若将从起初所听见的存在心里，你们就必住在子里面，也必住在父里面</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/2/#L24">约壹 2:24</a>)</p></blockquote><p>甚至主耶稣基督自己也召呼人保守所听见的——当时几乎全部新约圣经都已写成：</p><blockquote><p>“<strong><mark>所以要回想你是怎样领受、怎样听见的</mark></strong>，<strong><mark>又要遵守</mark></strong>，并要悔改。若不儆醒，我必临到你那里，如同贼一样；我几时临到，你也决不能知道。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/3/#L3">启 3:3</a>)</p></blockquote><p>这是否意味着主和使徒们教导“唯独圣传”？要知道，写下了圣经的他们，在这里甚至没有提到圣经，而是要求遵行圣传。</p><p>只拿这些经文，教会的反对者也可以用完全相同的方式发明相反的极端——论题“唯独圣传”。但他们没有领受使徒的圣传——他们在使徒之后十五个多世纪才出现；因为没有维护圣传的目标，他们也不引出关于圣传的这类极端。而教会从使徒们领受了圣传和圣经两者，既不摈弃这一个，也不摈弃那一个，也不摈弃使徒们关于保守口传圣传的诫命，认为圣经和圣传同是真实的。</p><h3>“不可越过圣经所写的”（林前 4:6）</h3><blockquote><p>“弟兄们，我为你们的缘故，拿这些事转比自己和亚波罗，叫你们效法我们不可过于圣经所记，<strong><mark>免得你们自高自大</mark></strong>，<strong><mark>贵重这个，轻看那个</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/4/#L6">林前 4:6</a>)</p></blockquote><p>这里说的是某部写下的文本，人应当据此明白：不可彼此自高。这里说的是哪个文本？是同一封书信的前一章，其中讲授了关于对自己看法要低的功课。使徒提议从他们学习不彼此自高、不越过刚写下的内容去推想。</p><p>这封书信是因为哥林多团体中产生的分裂而写的。整个第2章使徒贬低自己和亚波罗的意义，高举基督，为要阻止哥林多教会分结成“属保罗的”和“属亚波罗的”（<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/3/#L4-7">林前 3:4-7</a>），阻止教会分成党派。分裂的人不同的不是教训（否则使徒就会说教训），而是彼此的态度。他们按教会教师的名字分派系。仿佛教会中的每个人都应当只与在同一教师门下学习的人相通，而摈弃其他教会教师的学生。为改正这种错误的思维，使徒贬低了那些结成派系的名字的意义——即贬低自己和亚波罗，高举基督。</p><p>稍下一点，在总结所说的话时，使徒用别的话讲同一件事，呼召人跟随的已不是写下的，而是他自己：</p><blockquote><p>“<strong><mark>所以，我求你们效法我</mark></strong>。 <strong><mark>因此我已打发提摩太到你们那里去</mark></strong>；他在主里面，是我所亲爱、有忠心的儿子。他必提醒你们，记念我在基督里怎样行事，在各处各教会中怎样教导人。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/4/#L16-17">林前 4:16-17</a>)</p></blockquote><p>这样，引文所说的是：基督徒不应当越过使徒所写下的榜样去推想自己，而应当听从对自己看法要低的呼召，不彼此自高、不分裂。</p><p>在这封书信里使徒夸奖哥林多人保守圣传：</p><blockquote><p>“我称赞你们，因你们凡事记念我，<strong><mark>又坚守我所传给你们的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/11/#L2">林前 11:2</a>)</p></blockquote><p>并说哥林多人若持守所传的，就得救：</p><blockquote><p>“弟兄们，我如今把先前所传给你们的福音，告诉你们知道。这福音你们也领受了，又靠着站立得住； 并且你们若不是徒然相信，<strong><mark>能以持守我所传给你们的</mark></strong>，就必因这福音得救。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/15/#L1-2">林前 15:1-2</a>)</p></blockquote><p>还有许多关于口传圣传的别的话，前文已提过。举出其中一部分：</p><blockquote><p>“<strong><mark>你从我听的那纯正话语的规模</mark></strong>，要用在基督耶稣里的信心和爱心，常常守着。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/1/#L13">提后 1:13</a>)</p></blockquote><blockquote><p>“<strong><mark>你在许多见证人面前听见我所教训的</mark></strong>，<strong><mark>也要交托那忠心能教导别人的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/2/#L2">提后 2:2</a>)</p></blockquote><blockquote><p>“论到你们，<strong><mark>务要将那从起初所听见的常存在心里</mark></strong>。<strong><mark>若将从起初所听见的存在心里</mark></strong>，你们就必住在子里面，也必住在父里面。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/2/#L24">约壹 2:24</a>)</p></blockquote><h3>“连使徒和天使若传别的，也不要听？”</h3><p>从“唯独圣经”的拥护者那里可以听到这样的论据：使徒把自己的书信放在他自己、甚至上帝的天使之上。他们引用这行经文：</p><blockquote><p>“但无论是我们，是天上来的使者，若传福音给你们，<strong><mark>与我们所传给你们的不同，他就应当被咒诅</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/1/#L8">加 1:8</a>)</p></blockquote><p>使徒这里说的不是自己，而是指那些仿佛以使徒们的名义寄给团体的假书信：</p><blockquote><p>“我劝你们：无论有灵、有言语、<strong><mark>有冒我名的书信</mark></strong>，<strong><mark>说主的日子现在到了</mark></strong>，<strong><mark>不要轻易动心</mark></strong>，<strong><mark>也不要惊慌</mark></strong>。 人不拘用什么法子，你们总不要被他诱惑！因为那日子以前，必有离道反教的事，<strong><mark>并有那大罪人</mark></strong>，就是沉沦之子，显露出来。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2sol/2/#L2-3">帖后 2:2-3</a>)</p></blockquote><p>他也教导不要听那些人的“启示”——他们虚假地宣称自己说天使的语言、仿佛由天使说预言。</p><p>怎么确定书信不是来自使徒、启示不是来自天使？其中传达的是另一种信仰——不是使徒们一次所传的。当然，使徒并不试图夺走上帝赐给使徒的权柄。前面的话，以及整封书信，都是针对起来教导人的教师们写的——他们把加拉太人诱向犹太教。</p><blockquote><p>“<strong><mark>无知的加拉太人哪</mark></strong>，耶稣基督钉十字架，已经活画在你们眼前，<strong><mark>谁又迷惑了你们呢</mark></strong>？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/3/#L1">加 3:1</a>)</p></blockquote><blockquote><p>“<strong><mark>我为你们害怕</mark></strong>，惟恐我在你们身上是枉费了工夫。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/4/#L11">加 4:11</a>)</p></blockquote><blockquote><p>“<strong><mark>你们向来跑得好</mark></strong>，<strong><mark>有谁拦阻你们</mark></strong>，叫你们不顺从真理呢？ &lt;…&gt; <strong><mark>恨不得那搅乱你们的人</mark></strong>，把自己割绝了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/5/#L7,12">加 5:7,12</a>)</p></blockquote><p>使徒的意图——是保护自己的羊群脱离假教师，而不是脱离他自己，更不是脱离上帝的天使。圣天使不可能把上帝的教会——他们所事奉的上帝的教会——从真道路上诱离。使徒只是清楚地表明：应当持守那一次由他所传的信仰；而谁不这样教导，哪怕他装作使徒、或装扮成上帝的天使，也不应当接受。</p><p>---</p><p>在这一引文里有三层意义：</p><ol><li><p>我（μετεσχημάτισα）把对自己和亚波罗的描绘成另一种样子，为了（ἵνα）；</p></li><li><p>你们从我们学习不越过刚写下的〔前一章〕去推想（ἵνα）；</p></li><li><p>不彼此自高。</p></li></ol><p>使徒在哪里把自己和亚波罗描绘成不高于其他弟兄的？前一章：</p><blockquote><p>“<strong><mark>有说：「我是属保罗的。」</mark></strong>有说：「我是属亚波罗的。」这岂不是你们和世人一样吗？ <strong><mark>亚波罗算什么</mark></strong>？保罗算什么？无非是执事，照主所赐给他们各人的，引导你们相信。 <strong><mark>我栽种了，亚波罗浇灌了</mark></strong>，<strong><mark>惟有上帝叫他生长</mark></strong>。 可见<strong><mark>栽种的算不得什么，浇灌的也算不得什么</mark></strong>，只在那叫他生长的上帝。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/3/#L4-7">林前 3:4-7</a>)</p></blockquote><p>使徒在另一封书信里也这样说，呼召人同心：</p><blockquote><p>“<strong><mark>要彼此同心</mark></strong>，<strong><mark>不要志气高大</mark></strong>，倒要俯就卑微的人。<strong><mark>不要自以为聪明</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/12/#L16">罗 12:16</a>)</p></blockquote><p>救主也教导这一点：</p><blockquote><p>“<strong><mark>凡自高的，必降为卑</mark></strong>；<strong><mark>自卑的，必升为高</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/23/#L12">太 23:12</a>)</p></blockquote><blockquote><p>“只是在你们中间，不是这样。你们中间，<strong><mark>谁愿为大，就必作你们的用人</mark></strong>；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/10/#L43">可 10:43</a>)</p></blockquote><p>这样，使徒只是呼召人谦卑与合一，引用先前所写的关于自己和亚波罗的话。</p><p>在这封书信里使徒夸奖哥林多人保守圣传：</p><blockquote><p>“我称赞你们，因你们凡事记念我，<strong><mark>又坚守我所传给你们的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/11/#L2">林前 11:2</a>)</p></blockquote><p>并说哥林多人若持守所传的，就得救：</p><blockquote><p>“弟兄们，我如今把先前所传给你们的福音，告诉你们知道。这福音你们也领受了，又靠着站立得住； 并且你们若不是徒然相信，<strong><mark>能以持守我所传给你们的</mark></strong>，就必因这福音得救。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/15/#L1-2">林前 15:1-2</a>)</p></blockquote><p>还有许多别的关于口传圣传的话，前文已提过。举出其中一部分：</p><blockquote><p>“<strong><mark>你从我听的那纯正话语的规模</mark></strong>，要用在基督耶稣里的信心和爱心，常常守着。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/1/#L13">提后 1:13</a>)</p></blockquote><blockquote><p>“<strong><mark>你在许多见证人面前听见我所教训的</mark></strong>，<strong><mark>也要交托那忠心能教导别人的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/2/#L2">提后 2:2</a>)</p></blockquote><blockquote><p>“论到你们，<strong><mark>务要将那从起初所听见的常存在心里</mark></strong>。<strong><mark>若将从起初所听见的存在心里</mark></strong>，你们就必住在子里面，也必住在父里面。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/2/#L24">约壹 2:24</a>)</p></blockquote><h2>结论</h2><p>为维护“唯独圣经”的论题使用这样的手法：既然没有关于“唯独圣经”的明确引文，就展示关于圣经之重要性的引文，而对关于圣传之重要性的引文忽略并缄默。这样，听众应当觉得仿佛只有圣经才有重要性。</p><p>新教徒常责备正教徒说：</p><p>——只要在圣经里指出哪里写着要敬礼圣像、向圣人祈祷等等。</p><p>我们指出，但对他们说：</p><p>——圣传也是重要的，这连圣经也证实。</p><p>于是他们说：</p><p>——不，只有圣经重要。</p><p>这时我们就请他们：</p><p>——那就请在圣经里指出：只有圣经重要，或圣经比圣传更重要。</p><p>他们无法指出这样的话，因为圣经里没有这样的字句。要求我们出示关于圣像、关于向圣人祈祷的话，他们却拿不出完全相同的一句话来证明一切都应当只在圣经里。他们不能符合自己向别人提出的要求，表现出双重标准。</p><p>这东西是他们自己发明的；他们自己要求我们把一切都指给他看，而自己却不能在圣经里指出自己的原则。</p><p>这样，“唯独圣经”的论题自相矛盾，并没有使发明它的人达到使徒的信仰；相反，它使人远离目标，而生出了众多的传统和分裂。</p>
