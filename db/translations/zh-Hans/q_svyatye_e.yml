  path: QW9A_圣像（敬礼圣像）
  title: 圣像（敬礼圣像）
  copy_cover: true
  body: <p>正教基督徒被指控拜偶像：圣像被称为偶像，敬礼圣像被称为拜偶像。本文按圣经考察圣像敬礼的问题，回应这些指控。</p><p>先给出简短的回答，然后较详细地考察批评，最后给出最详细的、逐句依据圣经的回答。</p><h2>敬礼圣像最简短的辩护</h2><p>在上帝道成肉身之前的时代，上帝为旧约的以色列设立律法时，没有显明自己的像，并禁止制造假神（偶像）的像、禁止敬拜它们（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/20/#L4-5">出 20:4-5</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/5/#L8-9">申 5:8-9</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/4/#L15-19">申 4:15-19</a>）；但他命令描绘自己的圣洁仆人（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/25/#L1">出 25:1</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/26/#L1">出 26:1</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/25/#L18-20">出 25:18-20</a>），而先知们在有像的圣物前叩拜（<a href="https://bibleox.com/zh-Hans/cn-cuv/nav/7/#L6">书 7:6</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/5/#L7">诗 5:7</a>）。正教徒对带有像的圣物的敬礼，与先知的做法完全一样。</p><p>此外，按上帝的构想，圣殿本身就是天的圣像（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/25/#L8-9,40">出 25:8-9,40</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/9/#L24">希 9:24</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/act/7/#L44">徒 7:44</a>）。上帝命令敬重圣殿（<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/19/#L30">利 19:30</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/26/#L2">利 26:2</a>）；圣殿受敬礼，人们在它面前叩拜（<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/5/#L7">诗 5:7</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/99/#L5">诗 99:5</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/132/#L7">诗 132:7</a>）。这正是正教的敬礼：敬礼像，就是敬礼原型。</p><p>任何人想用来为先知对带有像的圣物的敬礼辩护的理由，都适用于正教的敬礼（因为这是同一件事）；任何人想用来指责正教敬礼的定罪，也同样落在先知的敬礼上。</p><p>问题完全不在像及其敬礼。既然偶像是对上帝的任何虚假观念，那么问题在于：1）像本身、2）敬礼者赋予它的意义内容，与真理是什么关系。如果两者中哪怕一个在原则上虚假，那就是拜偶像——它把人从真理引开。这才是问题所在：偶像不引人归向上帝，对上帝的虚假观念不引人归向真上帝，因为谎言不引向真理，而使人离开真理。</p><p>在与反对圣像者的对话中简要检验这一论断：</p><p><strong>反圣像者</strong>：向物件叩拜——是拜偶像。</p><p><strong>正教徒</strong>：那么上帝的先知们在圣殿和有像的约柜前叩拜，就成了拜偶像的了？</p><p><strong>反对者</strong>：上帝只说了描绘，没有说敬礼或叩拜。</p><p><strong>正教徒</strong>：那么先知们作了不该作的、没有记载的、没有被命令的事，就是说陷入了拜偶像？</p><p><strong>反对者</strong>：先知叩拜的不是圣殿或约柜本身，而是把这敬礼归于上帝。</p><p><strong>正教徒</strong>：正是如此。正教徒叩拜的也不是木头和颜料，而是像中所描绘的位格——教导中正是这样说：藉着像敬礼原型，如同先知。没有任何差别。</p><p>如此等等。这条规则永远有效，因为先知的敬礼与正教的敬礼之间没有任何差别。现在更详细地考察这一问题。</p><h2>反圣像者说：“上帝的话明明说：不可作像，你们却作”</h2><p><strong>回答</strong>：这是摩西律法中只针对描绘上帝的旧约禁令，从上下文可见：</p><ul><li><p>前四条诫命正是<strong>关于上帝</strong>的（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/20/#L4-5">出 20:4-5</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/5/#L8-9">申 5:8-9</a>）；</p></li><li><p>设立禁令时，上帝指出它的缘由：在律法设立时上帝没有显明自己的<strong>像</strong>（<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/4/#L15-19">申 4:15-19</a>）：既然没有见过上帝，就不要描绘。</p></li></ul><p>这样，禁令针对的正是描绘上帝；而对自己的圣洁仆人，上帝不但没有禁止，反而命令描绘（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/25/#L1">出 25:1</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/26/#L1">出 26:1</a>），义人们向圣殿和带这些像的圣物叩拜（<a href="https://bibleox.com/zh-Hans/cn-cuv/nav/7/#L6">书 7:6</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/5/#L7">诗 5:7</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/99/#L5">诗 99:5</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/132/#L7">诗 132:7</a>）。</p><p>旧约的教会里有圣像，它们受敬礼。首先，<strong>旧约的圣殿本身就是圣像</strong>。作为地上的场所，它按上帝起初的构想应当成为天上所发生之事的描绘。上帝命令先知摩西建造圣殿，不是因为他需要殿（上帝不需要，<a href="https://bibleox.com/zh-Hans/cn-cuv/is/66/#L1">赛 66:1</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/49/#L13">诗 49:13</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/is/1/#L11">赛 1:11</a>），而是命令把殿造为天的圣像、造为向先知所显示的天上实体之像（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/25/#L8-9,40">出 25:8-9,40</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/9/#L24">希 9:24</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/act/7/#L44">徒 7:44</a>）。上帝命令敬礼这一圣像（<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/19/#L30">利 19:30</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/26/#L2">利 26:2</a>）。先知大卫向它叩拜（<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/5/#L7">诗 5:7</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/99/#L5">诗 99:5</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/132/#L7">诗 132:7</a>）。当不虔的王在圣殿里设立异教偶像时（<a href="https://bibleox.com/zh-Hans/cn-cuv/4ts/21/#L3-7">王下 21:3-7</a>）——即损坏了天上实体的像——上帝就弃绝了圣殿（<a href="https://bibleox.com/zh-Hans/cn-cuv/4ts/23/#L27">王下 23:27</a>）。</p><p>正因为圣殿是天的圣像，在新约里它经历了改变（内部构造、像），因为天上实体也改变了。在旧约里，天上实体中以属灵-可见方式存在的<strong>只有天使</strong>。而上帝完全不可见、非物质，人也还没有达到天上的生命（详见<a href="https://bibleox.com/ru/ru/w/9VFT_До_жертвы_Христовой_ветхозаветные_праведники_сходили_в_ад">详见</a>）。</p><p>在新约里——更准确地说，随着主耶稣基督的来临——发生了巨大的变化：</p><ol><li><p><strong>上帝按人性成为可见的</strong>（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/1/#L18">约 1:18</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/1/#L1-2">约壹 1:1-2</a>）；</p></li><li><p><strong>上帝有形地在天上登基</strong>（<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/1/#L20-21">弗 1:20-21</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/3/#L21">启 3:21</a>）；</p></li><li><p><strong>天上出现了人</strong>——他们获得了与主耶稣基督同活的可能（<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/6/#L9-11">启 6:9-11</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/14/#L1,3-5">启 14:1,3-5</a>）；</p></li><li><p><strong>上帝订立新约</strong>（<a href="https://bibleox.com/zh-Hans/cn-cuv/ier/31/#L31">耶 31:31</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/8/#L8">希 8:8</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/22/#L20">路 22:20</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/11/#L25">林前 11:25</a>）。<strong>旧约与摩西的律法一同终结</strong>（<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/7/#L6">罗 7:6</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/3/#L21-25">加 3:21-25</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/2/#L14-16">弗 2:14-16</a>）。描绘上帝的禁令失效，因为它曾是摩西律法的一部分，而摩西律法已随基督的来临被废除（详见<a href="https://bibleox.com/ru/ru/w/Библия-Закон-Моисея-отмена">详见</a>）。</p></li></ol><p>这样，旧约的圣殿是旧约天上实体的像，而这实体在新约里改变了。先前的已不存在。既然圣殿按上帝起初的构想就是天上实体的像，那么在这实体改变之后，描绘旧的就已没有意义。因此基督徒从最古老的年代起描绘新的天上实体，把在天空明显登基的耶稣基督（上帝）的像立在最前面，周围——描绘他圣洁的仆人们：如今已不只是天使，还有人。</p><p>标志性的事件是基督的祭献之后耶路撒冷圣殿的损坏：</p><blockquote><p>“忽然，<strong><mark>殿里的幔子从上到下裂为两半</mark></strong>，<strong><mark>地也震动，磐石也崩裂</mark></strong>， <strong><mark>坟墓也开了</mark></strong>，已睡圣徒的身体，多有起来的。 <strong><mark>到耶稣复活以后</mark></strong>，他们从坟墓里出来，<strong><mark>进了圣城，向许多人显现</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/27/#L51-53">太 27:51-53</a>)</p></blockquote><p>而在70年代，圣殿被罗马人完全毁灭，在随后的一切千百年里，把位置让给了新的天上实体之像——正教圣殿。</p><p>更多古圣像见：<a href="https://bibleox.com/ru/ru/w/древние-иконы">古圣像</a></p><p>过时的不只是旧约天上实体的像，还有旧约本身——摩西的律法是它不可分的部分，如今律法已失去意义。除描绘上帝的禁令外，还有许多规定在新约里已不再有效：</p><blockquote><p>“<strong><mark>那亵渎耶和华名的，必被治死</mark></strong>，全会众总要用石头打死他。不管是寄居的是本地人，<strong><mark>他亵渎耶和华名的时候，必被治死</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/24/#L16">利 24:16</a>)</p></blockquote><p>亵渎上帝的名——是违背<strong>第三诫</strong>的罪。按摩西律法的刑罚——死（<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/24/#L16">利 24:16</a>）。据我们所知，反对圣像的人并不教导为亵渎上帝而杀人。他们要求遵守旧约关于不可描绘上帝的禁令，引用带有“这是上帝的话”字样的引文；但关于处死亵渎者的诫命也是上帝的话，也写得同样明白，但他们并不这样行。为什么？因为摩西律法被废除了。</p><p><strong>第四诫</strong>设立安息日的安息——停止作工（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/20/#L8-10">出 20:8-10</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/5/#L12-15">申 5:12-15</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/19/#L3">利 19:3</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/19/#L30">利 19:30</a>）。按摩西律法的刑罚——死。这也是上帝的话，也写得同样明白；但反对圣像的人不教导为破坏安息日的安息而杀人，他们大多数连安息日的安息自己也不守。为什么？因为摩西律法被废除了。</p><p>这样，禁止描绘道成肉身的上帝意味着：</p><ol><li><p><strong>犹太化</strong>：继续按摩西律法生活（顺便说，什一奉献也是按同样的理由收取的，见<a href="https://bibleox.com/ru/ru/w/ozcY_О_десятине">什一奉献</a>）；</p></li><li><p><strong>间接否认上帝道成肉身</strong>：或者否认基督是上帝，或者否认他是可见的。</p></li></ol><p>现在我们把问题考察得更详细。</p><h2>摩西律法的第二诫</h2><p>反对圣像的人认为圣像违反了<a href="https://bibleox.com/ru/ru/w/10-заповедей">摩西律法</a>的第二诫：</p><ol><li><p>“<strong>不可为自己雕刻偶像；也不可作什么形像</strong>仿佛上天、下地，和地底下、水中的百物。<strong>不可跪拜那些像</strong>；也不可事奉它”（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/20/#L4-5">出 20:4-5</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/5/#L8-9">申 5:8-9</a>）；</p></li></ol><p>摩西的十诫分为两部分（两块法版）：</p><ul><li><p>四条关于爱上帝的诫命；</p></li><li><p>六条关于爱邻人的诫命。</p></li></ul><p>第二诫属于爱上帝的表现，它并不禁止一切的像和叩拜，而是禁止制造物件、把它们当作神来敬拜以代替独一的真上帝。换言之，<strong>这条诫命禁止敬拜假神</strong>。正因为如此，我们在圣经里既看到像、也看到不违反这条诫命的叩拜。详见下文。</p><h3>“不可作像”</h3><h4>上帝命令在他自己的圣殿里制作像</h4><p>虽然第二诫禁止作像，但赐下这条诫命的同一上帝，如今命令在他的殿（会幕）里制作像：在会幕的板壁上、在通入至圣所的幔子上描绘基路伯的像，并在约柜的施恩座上制作基路伯的金像：</p><blockquote><p>“<strong><mark>你要用十幅幔子作帐幕</mark></strong>。这些幔子要用撚的细麻和蓝色、紫色、朱红色线制造，<strong><mark>并用巧匠的手工绣上基路伯</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/26/#L1">出 26:1</a>)</p></blockquote><blockquote><p>“他们中间，凡心里有智慧作工的，用十幅幔子作帐幕。这幔子是比撒列用撚的细麻和蓝色、紫色、朱红色线制造的，<strong><mark>并用巧匠的手工绣上基路伯</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/36/#L8">出 36:8</a>)</p></blockquote><blockquote><p>“<strong><mark>要用金子锤出两个基路伯来</mark></strong>，<strong><mark>安在施恩座的两头</mark></strong>。 这头作一个基路伯，那头作一个基路伯。二基路伯要接连一块，在施恩座的两头。 二基路伯要高张翅膀，遮掩施恩座。基路伯要脸对脸，朝着施恩座。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/25/#L18-20">出 25:18-20</a>)</p></blockquote><p>在较晚的、所罗门建造的圣殿里，有更多的各种像和雕像：</p><blockquote><p>“又用蓝色、紫色、朱红色线和细麻<strong><mark>织幔子</mark></strong>，<strong><mark>在其上绣出基路伯来</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/3/#L14">代下 3:14</a>)</p></blockquote><blockquote><p>“<strong><mark>在至圣所按造像的法子造两个基路伯</mark></strong>，用金子包裹。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/3/#L10">代下 3:10</a>)</p></blockquote><blockquote><p>“<strong><mark>他用橄榄木作两个基路伯</mark></strong>，各高十肘，安在内殿。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L23">王上 6:23</a>)</p></blockquote><p>圣殿构造的详情：<a href="https://bibleox.com/ru/ru/w/иерусалимский-храм">耶路撒冷圣殿</a></p><p>为制作殿内的器皿，上帝把圣灵的恩赐赐给了工匠们：</p><blockquote><p>“耶和华晓谕摩西说： 看哪！犹大支派中户珥的孙子，乌利的儿子比撒列，<strong><mark>我已经提他的名召他</mark></strong>。 <strong><mark>我也以我的灵充满了他</mark></strong>，使他有智慧，有聪明，有知识，能作各样的工， <strong><mark>能想出巧工，用金、银、铜制造各物</mark></strong>， 又能刻宝石，可以镶嵌，能雕刻木头，能作各样的工。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/31/#L1-5">出 31:1-5</a>)</p></blockquote><h4>上帝命令制作蛇的像</h4><p>上帝还命令制作铜蛇，使望它的人奇妙地脱离蛇咬的死亡：</p><blockquote><p>“耶和华对摩西说：「<strong><mark>你制造一条火蛇</mark></strong>，挂在杆子上，<strong><mark>凡被咬的，一望这蛇，就必得活</mark></strong>。」 <strong><mark>摩西便制造一条铜蛇</mark></strong>，挂在杆子上，<strong><mark>凡被蛇咬的，一望这铜蛇，就活了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/21/#L8-9">民 21:8-9</a>)</p></blockquote><p>非常重要的是：这蛇是耶稣基督的像，应当指向他在十字架上将来的苦难：</p><blockquote><p>“<strong><mark>摩西在旷野怎样举蛇</mark></strong>，<strong><mark>人子也必照样被举起来</mark></strong>， <strong><mark>叫一切信他的都得永生</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/3/#L14-15">约 3:14-15</a>)</p></blockquote><p>这蛇后来被希西家王毁掉，因为以色列人开始把蛇本身当作神，给它起了自己虚假的名字（尼忽士但）——这名字与真上帝没有任何关系。他们离弃了真上帝，违反了第二诫：</p><blockquote><p>“他废去邱坛，毁坏柱像，砍下木偶，<strong><mark>打碎摩西所造的铜蛇</mark></strong>，因为到那时<strong><mark>以色列人仍向铜蛇烧香</mark></strong>。<strong><mark>希西家叫铜蛇为铜块</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/4ts/18/#L4">王下 18:4</a>)</p></blockquote><h3>“不可跪拜那些像”</h3><p>虽然禁止敬拜像（圣像），但义人们经常向人、向各种物件、向天使下拜；别人也向先知下拜。没有人因拜偶像而定他们的罪，因为这些叩拜不是向假神（偶像）行的。</p><h4>向以天使形像显现的上帝叩拜</h4><p>亚伯拉罕向以三个男人形像显现的上帝叩拜：</p><blockquote><p>“耶和华在幔利橡树那里，<strong><mark>向亚伯拉罕显现出来</mark></strong>。那时正热，亚伯拉罕坐在帐棚门口， 举目观看，<strong><mark>见有三个人在对面站着</mark></strong>。他一见，就从帐棚门口跑去迎接他们，<strong><mark>俯伏在地</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/18/#L1-2">创 18:1-2</a>)</p></blockquote><p>为什么上帝以像显现？——因为上帝在本性上不可见，从来没有人见过他（<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/6/#L16">提前 6:16</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/in/1/#L18">约 1:18</a>）。</p><h4>向天使叩拜</h4><p>先要指出：天使是灵（<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/1/#L13-14">希 1:13-14</a>），而灵没有骨和肉（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/24/#L39">路 24:39</a>）；就是说，天使也是以人的形像向人显现的。所以，向天使叩拜，就是向看不见的灵（天使）的看得见之像叩拜：</p><blockquote><p>“他回答说：「不是的，我来是要作耶和华军队的元帅。」<strong><mark>约书亚就俯伏在地下拜</mark></strong>，说：「我主有什么话吩咐仆人？」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/nav/5/#L14">书 5:14</a>)</p></blockquote><h4>向先知叩拜</h4><blockquote><p>“住耶利哥的先知门徒从对面看见他，就说：「感动以利亚的灵感动以利沙了。」他们就来迎接他，<strong><mark>在他面前俯伏于地</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/4ts/2/#L15">王下 2:15</a>)</p></blockquote><h4>向圣殿叩拜</h4><p>大卫向圣殿叩拜——这殿本身就是天的圣像（<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/19/#L30">利 19:30</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/26/#L2">利 26:2</a>），并且殿中布满圣天使的像（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/25/#L1">出 25:1</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/26/#L1">出 26:1</a>）：</p><blockquote><p>“至于我，我必凭你丰盛的慈爱，进入你的居所；我必存敬畏你的心，<strong><mark>向你的圣殿下拜</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/5/#L7">诗 5:7</a>)</p></blockquote><p>同时，上帝命令敬重圣殿（<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/19/#L30">利 19:30</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/26/#L2">利 26:2</a>）。</p><h4>向上帝的脚凳（圣殿）叩拜</h4><blockquote><p>“你们当尊崇耶和华我们的上帝，<strong><mark>在他脚凳前下拜</mark></strong>；他本为圣！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/99/#L5">诗 99:5</a>)</p></blockquote><blockquote><p>“<strong><mark>我们要进他的居所，在他脚凳前下拜</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/132/#L7">诗 132:7</a>)</p></blockquote><h4>向约柜叩拜</h4><blockquote><p>“约书亚便撕裂衣服；他和以色列的长老把灰撒在头上，在耶和华的约柜前，<strong><mark>俯伏在地，直到晚上</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/nav/7/#L6">书 7:6</a>)</p></blockquote><h4>向杖叩拜</h4><p>经上记着“以色列在床头上敬拜”（<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/47/#L31">创 47:31</a>），而在七十士译本里是“在杖头上”（<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/11/#L21">希 11:21</a>）。</p><p>更多例子：<a href="https://bibleox.com/ru/ru/w/поклоны">叩拜</a></p><h3>异教对偶像的信仰违反第二诫</h3><p>对偶像的异教信仰之所以违反第二诫，是因为它<strong>在任何情形下</strong>都要求叩拜<strong>虚假的</strong>、<strong>并不存在的神</strong>。摩洛、巴力、宙斯、朱庇特和佩伦并不存在——他们是虚假的神。</p><p>对偶像的异教信仰有三种，从最普遍的一种开始：</p><ol><li><p><strong>偶像——就是神本身</strong>。异教徒亲手制造的物件（偶像）本身就是神。</p></li><li><p><strong>偶像——虚假之神的形像</strong>，无论那神多么遥远，据说就应当长成这样。</p></li><li><p><strong>偶像——</strong>（被神化的）<strong>自然元素的虚构形像</strong>：海、风、雨、火、土。</p></li></ol><p>在所有三种情形中，受敬礼的都是<strong>虚假的</strong>、<strong>并不存在的神</strong>。这是对谎言的信仰。</p><p>我们在圣经中遇到的正是第一种。圣经中所描述的最普遍的异教信仰，是<strong>对物件本身（物质）的神化</strong>。异教徒可以用手边的材料为自己造一个神，或者把已有的物件神化：</p><blockquote><p>“<strong><mark>他砍伐香柏树</mark></strong>，又取柞树和橡树，在树林中选定了一棵。他栽种松树，得雨长养。 <strong><mark>这树，人可用以烧火</mark></strong>。他自己取些烤火，又烧着烤饼，<strong><mark>而且作神像跪拜</mark></strong>，<strong><mark>作雕刻的偶像向它叩拜</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/44/#L14-15">赛 44:14-15</a>)</p></blockquote><blockquote><p>“当时拉班剪羊毛去了。<strong><mark>拉结偷了她父亲家中的神像</mark></strong>。 &lt;…&gt; 现在你虽然想你父家，不得不去，<strong><mark>为什么又偷了我的神像呢</mark></strong>？」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/31/#L19,30">创 31:19,30</a>)</p></blockquote><blockquote><p>“再如：有个准备航海的人，行将在怒涛中航行之际，<strong>竟向一块比自己乘的船还易坏的木头呼求</strong>。……这种不虔敬的事，相沿日久，便成了习俗，以致守如法律；再加上君王的命令，<strong>彫像遂受崇拜</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prs/14/#L1,16">智 14:1,16</a>)</p></blockquote><blockquote><p>“君王对他说：「<strong>你不以为贝耳是生活的神吗？你不见贝耳每天吃喝那么多吗？</strong>」” (<a href="https://bibleox.com/zh-Hans/cn-sb/dan/14/#L6">但 14:6</a>) <em>(此段经文不在和合本中，引文按思高本。)</em></p></blockquote><blockquote><p>“祭祀对偶像有什么用处？<strong>既不能吃，又不能闻</strong>：” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/30/#L19">德 30:19</a>) <em>(俄文本为 Сир 30:19。)</em></p></blockquote><blockquote><p>“有一个银匠，名叫底米丢，<strong><mark>是制造亚底米神银龛的</mark></strong>，他使这样手艺人生意发达。 他聚集他们和同行的工人，说：「众位，你们知道我们是倚靠这生意发财。 <strong><mark>这保罗不但在以弗所</mark></strong>，也几乎在亚西亚全地，引诱迷惑许多人，说：『<strong><mark>人手所作的，不是神</mark></strong>。』这是你们所看见、所听见的。 这样，<strong><mark>不独我们这事业被人藐视</mark></strong>，就是大女神亚底米的庙也要被人轻忽，连亚西亚全地和普天下所敬拜的大女神之威荣也要销灭了。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/19/#L24-27">徒 19:24-27</a>)</p></blockquote><p>圣经中其他类似的地方：<a href="https://bibleox.com/ru/ru/w/языческая-вера-в-идола">异教徒对偶像的信仰</a></p><p>古代的哲学家作为有思想的人，在维护自己异教信仰时，已经意识到：经人手加工的材料不可能是神。他们也可能说出别的判断，说这不过是神的形像，或某个元素的虚构形像。但第二诫仍然被违反了。</p><p>虚假的异教之神，不仅因其名字或形像而是假的。关于神的谎言，也表现在神的数目、他们的能力、本质属性上，而最主要的——表现在上帝关于自己受造物的旨意中，这旨意启示在诫命里。</p><p>为清楚起见，逐项加以比较。</p><h4>异教的神</h4><ul><li><p>名字是虚假的（摩洛、巴力、宙斯、佩伦等等），</p></li><li><p>形像是虚假的（各种人形的像），</p></li><li><p>能力是虚假的（有限的，许多异教神各有不同的能力），</p></li><li><p>意志是虚假的（不是真上帝在诫命中所表达的旨意），</p></li><li><p>本质属性是虚假的（不是永恒，不是无所不在，不是全知，不是无限，不是不朽，不是圣洁），</p></li><li><p>他召人去的是另一个（虚假的）地方，走另一条（虚假的）路。</p></li></ul><h4>正教会所信的上帝</h4><ul><li><p>圣经中真上帝的名字（自有者、父、子、圣灵、耶稣基督以及<a href="https://bibleox.com/ru/ru/w/Бог-имена">其他</a>）；</p></li><li><p>上帝亲自借此向世界显现自己的那些形像（亚伯拉罕面前的三位天使——<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/18/#L1-2">创 18:1-2</a>，鸽子——<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/3/#L22">路 3:22</a>，以及最后，上帝之子真实所取的人的形像）；</p></li><li><p>描绘的是全能的宇宙创造者；</p></li><li><p>呼召人遵行神圣诫命的上帝（基督被描绘为手中拿着打开的书，其中写着他的诫命）；</p></li><li><p>描绘的是召人经由十字架之路与他同活的上帝（基督被描绘在十字架上，有十字形光环）。</p></li></ul><p>这样，异教徒把像本身当作神，或当作（虚假之）神的形像，而正教会描绘的是真上帝，并不把制品（圣像）本身当作神。</p><p>此外，正教会也描绘上帝的朋友们：童贞女马利亚上帝之母、天使、使徒、义人们。这不是谎言。他们都真实存在。同时，无论这些圣人和天使本身，还是他们的像，都不被视为神。</p><p>正教会中的一切圣像都与福音书和十字架一样作为圣物受敬礼。对它们的敬礼归向真上帝和他真实存在的朋友们。</p><h3>设立第二诫的缘由</h3><blockquote><p>“所以你们要分外谨慎，因为耶和华在何烈山从火中对你们说话的那日，<strong><mark>你们没有看见什么形像</mark></strong>。 <strong><mark>惟恐你们败坏自己，雕刻偶像</mark></strong>，仿佛什么男像、女像， 或地上走兽的像，或空中飞鸟的像， 或地上爬物的像，或地底下水中鱼的像。 <strong><mark>又恐怕你向天举目观看</mark></strong>，见耶和华你的上帝为天下万民所摆列的日、月、星，就是天上的万象，<strong><mark>自己便被勾引敬拜事奉它</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/4/#L15-19">申 4:15-19</a>)</p></blockquote><h2>随着基督的来临，发生了改变</h2><h3>1. 旧约与摩西的律法终结了</h3><blockquote><p>“<strong><mark>但我们既然在捆我们的律法上死了</mark></strong>，现今就脱离了律法，<strong><mark>叫我们服事主</mark></strong>，<strong><mark>要按着心灵的新样，不按着仪文的旧样</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/7/#L6">罗 7:6</a>)</p></blockquote><blockquote><p>“<strong><mark>这样，律法是与上帝的应许反对吗</mark></strong>？断乎不是！若曾传一个能叫人得生的律法，义就诚然本乎律法了。 但圣经把众人都圈在罪里，使所应许的福因信耶稣基督归给那信的人。 但这因信得救的理还未来以先，我们被看守在律法之下，直圈到那将来的真道显明出来。 这样，<strong><mark>律法是我们训蒙的师傅，引我们到基督那里</mark></strong>，使我们因信称义。 <strong><mark>但这因信得救的理既然来到，我们从此就不在师傅的手下了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/3/#L21-25">加 3:21-25</a>)</p></blockquote><blockquote><p>“因他使我们和睦，将两下合而为一，<strong><mark>拆毁了中间隔断的墙</mark></strong>， <strong><mark>而且以自己的身体废掉冤仇</mark></strong>，就是那记在律法上的规条，为要将两下借着自己造成一个新人，如此便成就了和睦。 既在十字架上灭了冤仇，<strong><mark>便藉这十字架使两下归为一体</mark></strong>，与上帝和好了，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/2/#L14-16">弗 2:14-16</a>)</p></blockquote><p>基督订立新约，以此终结旧约和摩西的律法（<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/7/#L6">罗 7:6</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/3/#L21-25">加 3:21-25</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/2/#L14-16">弗 2:14-16</a>）。描绘上帝的禁令曾是摩西律法的一部分，摩西律法已随基督的来临被废除（详见<a href="https://bibleox.com/ru/ru/w/Библия-Закон-Моисея-отмена">详见</a>）。上帝藉摩西所赐的诫命失去其字面的意义：我们不守安息日的安息（也不杀安息日作工的人），不献牲畜为祭，不受割礼，不过犹太的节日，不献什一奉献；摩西律法的许多别的命令我们也不遵守。旧约和摩西的律法作为整体被废除了，而新约的信徒被召作执事的，不是按仪文的旧样，而是按心灵的新样（<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/3/#L6">林后 3:6</a>）——即理解上帝各种设立的缘由，领会其意义，遵守诫命的实质。</p><p>第二诫的字面意义禁止描绘的只是上帝，而不是他的圣洁仆人（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/25/#L1">出 25:1</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/26/#L1">出 26:1</a>）。</p><p>第二诫的实质——不可敬拜假神。</p><p>相应地，正教会描绘圣人们，因为这从来没有被禁止，反而命令描绘他们（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/25/#L1">出 25:1</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/26/#L1">出 26:1</a>），而义人们在像前叩拜（<a href="https://bibleox.com/zh-Hans/cn-cuv/nav/7/#L6">书 7:6</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/5/#L7">诗 5:7</a>）。至于描绘上帝，则只在旧约里被摩西律法所禁止，因为那时没有人见过上帝。而既然摩西律法被废除，那么描绘上帝的禁令作为摩西律法的一部分也被废除了。</p><h3>2. 上帝成为可见的，取了人性（道成肉身）</h3><blockquote><p>“<strong><mark>从来没有人看见上帝</mark></strong>，<strong><mark>只有在父怀里的独生子将他表明出来</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/1/#L18">约 1:18</a>)</p></blockquote><blockquote><p>“论到从起初原有的生命之道，<strong><mark>就是我们所听见、所看见、亲眼看过、亲手摸过的</mark></strong>。 （这生命已经显现出来，我们也看见过，现在又作见证，将原与父同在，且显现与我们那永远的生命传给你们。）” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/1/#L1-2">约壹 1:1-2</a>)</p></blockquote><h3>3. 天上实体改变了</h3><p>圣殿作为地上的建筑物，按上帝的定意起初就是天上实体的像：上帝命令先知摩西建造圣殿，不是因为上帝需要圣殿——上帝不需要它（<a href="https://bibleox.com/zh-Hans/cn-cuv/is/66/#L1">赛 66:1</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/50/#L13">诗 50:13</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/is/1/#L11">赛 1:11</a>）。</p><p>然而，随着基督的来临，发生了改变：</p><ol><li><p><strong>基督——上帝——以看得见的方式在天上登基</strong>（<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/1/#L20-21">弗 1:20-21</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/3/#L21">启 3:21</a>）；</p></li><li><p><strong>天上出现了人</strong>（除基督本身之外），他们获准与基督在天上同活（<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/6/#L9-11">启 6:9-11</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/14/#L1,3-5">启 14:1,3-5</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/12/#L22-24">希 12:22-24</a>）。</p></li></ol><p>天上实体改变了。先前的已不存在。耶路撒冷的圣殿成了过去的天上实体之像，而不是现在的。因此基督徒从最古老的年代起描绘新的天上实体，把在天空明显登基的耶稣基督（上帝）的像立在最前面，周围——描绘他圣洁的仆人们，如今已不只是天使，还有人。</p><p>标志性的事件是基督的祭献之后耶路撒冷圣殿的损坏：</p><blockquote><p>“忽然，<strong><mark>殿里的幔子从上到下裂为两半</mark></strong>，地也震动，磐石也崩裂， 坟墓也开了，已睡圣徒的身体，多有起来的。 <strong><mark>到耶稣复活以后</mark></strong>，他们从坟墓里出来，<strong><mark>进了圣城，向许多人显现</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/27/#L51-53">太 27:51-53</a>)</p></blockquote><p>而在70年代，圣殿被罗马人完全毁灭，在随后的一切千百年里，把位置让给了新的天上实体之像——正教圣殿。</p><h2>上帝亲自制作自己的圣像</h2><p>从来没有人见过上帝：</p><blockquote><p>“<strong><mark>从来没有人看见上帝</mark></strong>，只有在父怀里的独生子将他表明出来。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/1/#L18">约 1:18</a>)</p></blockquote><p>但上帝多次以像（圣像）的样式显现：</p><h3>上帝以三位天使的样式向亚伯拉罕显现</h3><p>三位天使不是上帝的本相、不是他在创世之前所是的；就是说，这是上帝的像（希腊文 εἰκόνα——圣像），而亚伯拉罕拜的是上帝的圣像：</p><blockquote><p>“耶和华在幔利橡树那里，<strong><mark>向亚伯拉罕显现出来</mark></strong>。那时正热，亚伯拉罕坐在帐棚门口， 举目观看，<strong><mark>见有三个人在对面站着</mark></strong>。他一见，就从帐棚门口跑去迎接他们，<strong><mark>俯伏在地</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/18/#L1-2">创 18:1-2</a>)</p></blockquote><p>亚伯拉罕拜了三位天使样式的上帝之像之后，他事奉的是上帝，还是上帝的像？显然，是上帝。</p><h3>上帝明显与雅各较力</h3><blockquote><p>“<strong><mark>只剩下雅各一人</mark></strong>。有一个人来和他摔跤，直到黎明。 &lt;…&gt; 那人说：「你的名不要再叫雅各，要叫以色列，<strong><mark>因为你与上帝与人较力，都得了胜</mark></strong>。」 &lt;…&gt; 雅各便给那地方起名叫毘努伊勒，意思说：「<strong><mark>我面对面见了上帝，我的性命仍得保全</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/32/#L24,28,30">创 32:24,28,30</a>)</p></blockquote><h3>上帝经由像与先知摩西交谈</h3><blockquote><p>“耶和华说：「你们且听我的话：你们中间若有先知，<strong><mark>我耶和华必在异象中向他显现</mark></strong>，在梦中与他说话。 <strong><mark>我的仆人摩西不是这样</mark></strong>；他是在我全家尽忠的。 <strong><mark>我要与他面对面说话</mark></strong>，乃是明说，不用谜语，<strong><mark>并且他必见我的形像</mark></strong>。你们毁谤我的仆人摩西，为何不惧怕呢？」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/12/#L6-8">民 12:6-8</a>)</p></blockquote><h3>上帝以鸽子的样式降在耶稣基督身上</h3><blockquote><p>“<strong><mark>圣灵降临在他身上，形状仿佛鸽子</mark></strong>．<strong><mark>又有声音从天上来</mark></strong>，说：「你是我的爱子，我喜悦你。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/3/#L22">路 3:22</a>)</p></blockquote><p>同样见：<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/3/#L16">太 3:16</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/1/#L10">可 1:10</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/in/1/#L32">约 1:32</a></p><h3>人——是上帝的圣像</h3><blockquote><p>“<strong><mark>上帝就照着自己的形像造人</mark></strong>，<strong><mark>乃是照着他的形像造男造女</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/1/#L27">创 1:27</a>)</p></blockquote><blockquote><p>“亚当的后代记在下面。<strong><mark>当上帝造人的日子，是照着自己的样式造的</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/5/#L1">创 5:1</a>)</p></blockquote><blockquote><p>“凡流人血的，他的血也必被人所流，<strong><mark>因为上帝造人，是照自己的形像造的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/9/#L6">创 9:6</a>)</p></blockquote><blockquote><p>“其实天主造了人，原是不死不灭的，<strong>使他成为自己本性的肖像</strong>；” (<a href="https://bibleox.com/zh-Hans/cn-sb/prs/2/#L23">智 2:23</a>)</p></blockquote><h2>耶稣基督——父上帝的像（圣像）</h2><blockquote><p>“你们当以基督耶稣的心为心。 <strong><mark>他本有上帝的形像</mark></strong>，不以自己与上帝同等为强夺的，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/fil/2/#L5-6">腓 2:5-6</a>)</p></blockquote><blockquote><p>“他<strong><mark>是上帝荣耀所发的光辉，是上帝本体的真像</mark></strong>，常用他权能的命令托住万有，他洗净了人的罪，就坐在高天至大者的右边．” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/1/#L3">希 1:3</a>)</p></blockquote><blockquote><p>“此等不信之人，被这世界的神弄瞎了心眼，不叫基督荣耀福音的光照着他们。<strong><mark>基督本是上帝的像</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/4/#L4">林后 4:4</a>)</p></blockquote><blockquote><p>“又感谢父，叫我们能与众圣徒在光明中同得基业。 他救了我们脱离黑暗的权势，把我们迁到他爱子的国里； 我们在爱子里得蒙救赎，罪过得以赦免。 <strong><mark>爱子是那不能看见之上帝的像</mark></strong>，<strong><mark>是首生的，在一切被造的以先</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/1/#L12-15">西 1:12-15</a>)</p></blockquote><blockquote><p>“腓力对他说：「<strong><mark>求主将父显给我们看</mark></strong>，我们就知足了。」 耶稣对他说：「腓力，我与你们同在这样长久，你还不认识我么？<strong><mark>人看见了我，就是看见了父</mark></strong>。你怎么说『将父显给我们看』呢？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/14/#L8-9">约 14:8-9</a>)</p></blockquote><h3>不尊敬父之像的，就是不尊敬父</h3><blockquote><p>“叫人都尊敬子如同尊敬父一样。<strong><mark>不尊敬子的，就是不尊敬差子来的父</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/5/#L23">约 5:23</a>)</p></blockquote><h3>拒绝父之像的，就没有父</h3><blockquote><p>“<strong><mark>凡不认子的，就没有父</mark></strong>；<strong><mark>认子的，连父也有了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/2/#L23">约壹 2:23</a>)</p></blockquote><h3>恨父之像的，就是恨父</h3><blockquote><p>“<strong><mark>恨我的，也恨我的父</mark></strong>。 我若没有在他们中间行过别人未曾行的事，他们就没有罪；<strong><mark>但如今连我与我的父，他们也看见也恨恶了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/15/#L23-24">约 15:23-24</a>)</p></blockquote><h3>一切受造之物都当向父之像叩拜</h3><blockquote><p>“<strong><mark>叫一切在天上的、地上的和地底下的</mark></strong>，<strong><mark>因耶稣的名无不屈膝</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/fil/2/#L10">腓 2:10</a>)</p></blockquote><h2>上帝藉圣人的像施行医治</h2><p>上帝赐人医治，不但经由圣使徒遗下的衣物（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/19/#L12">徒 19:12</a>），甚至经由使徒的像（影子）：</p><blockquote><p>“甚至有人将病人抬到街上，放在床上或褥子上，<strong><mark>指望彼得过来的时候，或者得他的影儿照在什么人身上</mark></strong>。 还有许多人带着病人和被污鬼缠磨的，从耶路撒冷四围的城邑来，<strong><mark>全都得了医治</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/5/#L15-16">徒 5:15-16</a>)</p></blockquote><h2>上帝不回答拜偶像的人</h2><blockquote><p>“所以你要告诉他们：『主耶和华如此说：<strong><mark>以色列家的人中，凡将他的假神接到心里</mark></strong>，<strong><mark>把陷于罪的绊脚石放在面前</mark></strong>，又就了先知来的，<strong><mark>我耶和华在他所求的事上，必按他众多的假神回答他</mark></strong>， 好在以色列家的心事上捉住他们，因为<strong><mark>他们都借着假神与我生疏</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iez/14/#L4-5">结 14:4-5</a>)</p></blockquote><blockquote><p>“<strong><mark>你们奉上供物使你们儿子经火的时候</mark></strong>，<strong><mark>仍将一切偶像玷污自己</mark></strong>，直到今日吗？<strong><mark>以色列家啊，我岂被你们求问吗</mark></strong>？主耶和华说，我指着我的永生起誓，<strong><mark>我必不被你们求问</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iez/20/#L31">结 20:31</a>)</p></blockquote><p>然而，反对圣像的人通常承认，正教的敬礼圣像者可以与上帝有相通。但圣经里写着：上帝不回答拜偶像的人。</p><h2>圣像能救人吗</h2><p>正教徒被指责，说有人会使用“圣像拯救了”或“圣像医治了”的说法。施行拯救和医治的是上帝；虽然我们通常不用“圣像拯救了”这样的说法，但它们是允许的——如果所指的是：不是圣像的材料本身，而是上帝藉着这材料施行了医治和拯救。</p><h4>使徒救人</h4><blockquote><p>“<strong><mark>或者可以激动我骨肉之亲发愤</mark></strong>，<strong><mark>好救他们一些人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/11/#L14">罗 11:14</a>)</p></blockquote><blockquote><p>“向软弱的人，我就作软弱的人，为要得软弱的人；向什么样的人，我就作什么样的人。<strong><mark>无论如何总要救些人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/9/#L22">林前 9:22</a>)</p></blockquote><h4>妻子救人</h4><blockquote><p>“<strong><mark>你这作妻子的，怎么知道不能救你的丈夫呢</mark></strong>？<strong><mark>你这作丈夫的，怎么知道不能救你的妻子呢</mark></strong>？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/7/#L16">林前 7:16</a>)</p></blockquote><h4>使徒呼召拯救人</h4><blockquote><p>“有些人存疑心，你们要怜悯他们； <strong><mark>有些人你们要从火中抢出来</mark></strong>、<strong><mark>搭救他们</mark></strong>；有些人你们要存惧怕的心怜悯他们；连那被情欲沾染的衣服也当厌恶。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iud/1/#L22-23">犹 1:22-23</a>)</p></blockquote><blockquote><p>“你要谨慎自己和自己的教训，要在这些事上恒心。因为这样行，<strong><mark>又能救自己，又能救听你的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/4/#L16">提前 4:16</a>)</p></blockquote><h4>难道除了基督还有谁能救人吗？</h4><p>无论使徒还是夫妻，都不是主耶稣基督意义上的救主——他是唯一的救赎者，把人类从死亡和阴间中救出、赐复活和与上帝同在的永生。但如上所见，“我要救”这样的说法是使徒们所用的。我们正确地理解这些话的意义——人可以促进得救：“因为我们是与上帝同工的”（<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/3/#L9">林前 3:9</a>）。</p><p>圣像也是这样：拯救的不是圣像，而是上帝；上帝经由物件赐下恩典。在圣经里我们可以找到许多这样的例子，详见下文。</p><h2>关于“圣像——通向属灵世界的窗户”的说法</h2><p>圣像是一种通向属灵世界的窗户。这一说法没有任何神秘的意义，是形象化的表达。它只是说：观看圣像时，我们仿佛透过窗户看向看不见的属灵世界。</p><p>属灵的事物是不可见的，而圣像画家把不可见的以可见的方式、藉着象征描绘在圣像上。例如，上帝的恩典住在圣人里面，以他们头上的光环描绘；没有影子意味着住在上帝的光中（这光不是寻常的光，不投下影子）；意义包含在手上所示的姿势、衣着的颜色、衣服上的特别标记（上帝之母衣服上的三颗星）、周围的物件、建筑、空间之中。观看这一切，我们认识到关于看不见的属灵世界的某些事。正因为如此，有时才使用这样的说法：圣像仿佛是通向属灵世界的窗户（详见<a href="https://monastery.ru/propovedi/okno-v-dukhovnyy-mir/" lang="ru">俄语</a>）。</p><p>为什么这需要特别说明？因为经常不得不遇到：反对正教会的人为了编造自己的指控，干脆凭空捏造指控，灌输给自己的追随者，在他们心里培植对正教会的仇恨。例如，为把正教徒描绘成可憎的巫师，教会的反对者捏造说：正教徒仿佛经由圣像与上帝建立联系，如同经由某种能量门户，因此需要圣像来与上帝相交。这一切纯属虚构。</p><p>正教会召呼信徒随处祈祷，无论有没有圣像。圣像只是帮助教育和祈祷的辅助手段。祈祷时，圣像帮助集中思想：不涣散、不分心。圣像也是表达对像中所描绘之位格的敬意的手段。各种物件，包括圣像，可以成为上帝向人赐下自己恩典的途径——详见下一节。</p><h2>上帝经由物件和像的运作</h2><p>正教徒被指责说，他们不但期待直接从上帝来的帮助，也期待经由物件和像而来的帮助。但这信仰不违背圣经——圣经中上帝多次经由物件和像行事。</p><h3>圣髑</h3><p>藉遗骸（圣髑）的复活。这里我们既看不见任何人的信心，也看不见祈祷；除了死人偶然触到先知的骸骨，什么也没有：</p><blockquote><p>“有人正葬死人，忽然看见一群人，就把死人抛在以利沙的坟墓里，<strong><mark>一碰着以利沙的骸骨，死人就复活站起来了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/4ts/13/#L21">王下 13:21</a>)</p></blockquote><h3>衣物</h3><blockquote><p>“<strong><mark>甚至有人从保罗身上拿手巾或围裙放在病人身上，病就退了，恶鬼也出去了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/19/#L12">徒 19:12</a>)</p></blockquote><h3>像</h3><blockquote><p>“甚至有人将病人抬到街上，放在床上或褥子上，<strong><mark>指望彼得过来的时候，或者得他的影儿照在什么人身上</mark></strong>。 还有许多人带着病人和被污鬼缠磨的，从耶路撒冷四围的城邑来，<strong><mark>全都得了医治</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/5/#L15-16">徒 5:15-16</a>)</p></blockquote><h3>水</h3><blockquote><p>“<strong><mark>因为有天使按时下池子搅动那水</mark></strong>，水动之后，<strong><mark>谁先下去，无论害什么病就痊瘉了</mark></strong>。』〕” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/5/#L4">约 5:4</a>)</p></blockquote><h3>更多</h3><p><a href="https://bibleox.com/ru/ru/w/Исцеления">医治</a></p><h2>正教会关于敬礼圣像的教训</h2><h3>367位圣教父关于敬礼圣像的信经——第七次大公会议，尼西亚（787年）</h3><p>“我们完整地保守教会的一切传统，无论是书面的还是非书面的。其中一个传统命令制作圣像彩绘；因为它与福音宣讲的历史相合，证实上帝的道真实地、而非虚幻地成了肉身，并且对我们有益：因为彼此互相说明的事物，无疑也彼此互相证实。我们循着王道、追随我们圣教父的圣训和公教会的圣传行进——因为我们知道，圣灵住在她里面——以一切的谨慎和明察确定：可敬的圣像应被陈设（供敬礼），如同生命给予者的十字架之像一样，无论它们由颜色、或由（马赛克）小块、或由任何别的材料制成，只要是以合宜的方式制成；无论它们在上帝的圣堂里、在神圣的器皿和衣袍上、在墙壁和木板上，或在家里和路旁；无论这是我们的主上帝救主耶稣基督的像，或我们至洁的圣母、上帝之母的像，或可敬的天使及一切圣人和义人的像。——藉圣像他们越常被我们默观，观看这些像的人就越被激励记念原型，对他们获得更多的爱，并受到更多的激励向他们献上亲吻、敬意和叩拜；但这绝不是那按我们的信仰只归于上帝本性的真正事奉。他们被激励向圣像献香、为它们点灯，如同为主基督之像、为圣天使们那样，如同古时按虔诚的心意习惯所行的那样：因为向圣像所献的敬意归于它的原型；敬拜圣像的人，敬拜的是像中所描绘者的位格。这样的教导保存在我们的圣教父们那里，即在公教会的传统中，在其中福音代代相传。”</p><p>（[俄文](https://azbyka.ru/otechnik/7_Vselenskij_Sobor)第七次大公会议，决议7）</p><h3>君士坦丁堡牧首耶利米（1576年）</h3><p>“至于第二十一篇——也是论及敬礼圣人、并说纪念圣徒有益于坚固我们的信仰——的最后一章，如果我们想到他们如何藉信心领受了上帝的恩典和帮助，我们说：呼求主要地只与上帝一位相宜，并且首先和本然地归于他；而对圣人们所行的呼求，不是在本然的意义上，仿佛偶然地、按恩典而归于他们。因为听那些呼求他们的，不是彼得或保罗，而是他们所具有的恩典——照主的话：‘我就常与你们同在，直到世界的末了’（太 28:20）。</p><p>神圣的使徒保罗写信给罗马人，论呼求上帝说：‘人未曾信他，怎能求他呢？’（罗 10:14）——由此表明：只应当呼求我们所信的那独一者，即上帝。而我们把呼求本然地归于独一的上帝，由我们在神圣的奥迹中呼求‘我们在天上的父’等，可以看见。在另一处：‘万军之主啊，求你与我们同在；除你以外，我们没有别的患难中的帮助者。’又说：‘除你以外，我们没有认识别的上帝。’我们使一切圣徒作中保，而首先是主之母，与她一起的还有天使和圣人的团契；我们以圣殿、奉献、呼求、神圣的圣像相对地（而非事奉地）尊敬他们。因为我们知道，事奉只应首先献给独一的上帝，除他以外不应承认别人为上帝，不可敬拜‘别神’（诗 80:10）。我们宁可自己不愿成为圣人，也不愿因相对的敬礼而陷入把圣人们神化。断乎不可：因为不相对地敬拜圣像，是不虔的、与基督的教会和她的儿女相违的，因为对它们的尊敬归于原型，如瓦西里所说：我们承认一切圣徒都是我们的中保和代求者，并且说，不但在今世，且在未来的世代里都会有某种代求：因为天使和圣人们将为某些人恳求，而世界的主母也不少于他们；但绝不是为一切人，也绝不为人任何死在罪中的——断然不；因为上帝对这样的人完全关闭了自己的怜悯，为此他启示了以下的事：‘他们中间虽有挪亚、但以理、约伯，也不能因他们的义救自己的儿女’（结 14:14,18）。只有为那些——他们的恳求易于蒙垂听的——人，即以悔改先于自己生命之终、却还未能洗净罪之污秽的人，教会才向上帝恳求；并且只是在审判还在进行的时候。这景象结束后，当每个人被带到指定的刑罚之地，代求就不可能，也就没有代求了。这代求如今也在教会中宣告：我们向圣徒们呼求，也向我们的主母，向圣天使们呼求。向我们的主母——如此：‘至圣圣母上帝之母，为我们罪人祈祷’；向圣天使们如此：‘天上诸品圣天使总领天使们，为我们罪人祈祷’——同样向主的先驱施洗者先知、向光荣的使徒、先知、殉道者、修士、牧者们、普世的教师们和其余一切圣人。我们也求圣妇们的团契为我们罪人祈祷；我们求上帝，愿他按自己的恩典和十字架不可战胜、不可测度的神圣能力，怜悯我们这些事奉他、居于宣信和忏悔之中、求我们心灵之眼得蒙光照的人，好叫我们不至于在罪中睡着而死亡，叫仇敌不能在我们身上得逞。这样，藉我们所说的这一切人的代求，我们求上帝怜悯我们，把我们从恶者的网罗中救出。”</p><p>（[俄文](https://azbyka.ru/otechnik/Ieremij_II_Konstantinopolskij/Otvety_liuteranam)《答路德宗徒书，第一书》）</p><p>还有更详细的《答路德宗徒第二书》，其中详细考察了敬礼圣像：[第二书]。</p><p>还有简短的第三书：[第三书]。</p><h2>对批评的回应</h2><h3>“你们删去了上帝十诫中的一诫”</h3><p>你们守<strong>第四</strong>条关于安息日安息的诫命吗？安息日里你们什么工都不作吗？你们把安息日作工的弟兄姊妹杀了吗？你们为亵渎或拜偶像杀人吗？如果你们不作这些，那是为什么？难道你们没有删去上帝的诫命？为什么忽略了这一点：你们自己不守第四诫，却要求遵守第二诫？</p><p>摩西的律法被废除了。基督徒跟随基督。第二诫显然不禁止像及其敬礼，因为上帝命令在自己的殿里制作像，命令敬重圣殿，而先知们在带像的圣物前叩拜。诫命禁止的是描绘上帝，以及禁止拜偶像（敬礼并事奉假神）。</p><h3>“你们向圣像献香，如以色列人向尼忽士但献香”</h3><p>以色列人的错误不在于献香（献香是上帝自己设立的），而在于他们虚构了一个假神，称它为尼忽士但，并且不再事奉上帝，而是事奉他们所虚构的尼忽士但——显然是把物件本身当作神明，以色列人中一向如此（详见<a href="https://bibleox.com/ru/ru/w/языческая-вера-в-идола#HH-Язычники-израильтяне-считали-богом-само-изделие-а-также-стихии">详见</a>）。被虚构的不只是名字，还有讨尼忽士但喜悦的方式，随之而来的是它的虚构意志（诫命）。这就是拜偶像，即事奉假神。它使人离开上帝和按他旨意的生活，把人引向按尼忽士但（其作者）意志的生活。</p><p>正教徒描绘的是真上帝，称他的本名，遵守他的诫命，不把物件（圣像）当作神；他们叩拜和献香不是向圣像，而是向上帝。这不是拜偶像，因为这里连假神都没有，也没有对假神的事奉——不像尼忽士但的仆役们那样。</p><h3>“上帝说了描绘，但没有说敬礼”</h3><p>不是这样。在圣经里可以看到：上帝既命令制作像，也命令敬礼它们。圣经里有敬礼像的实践。</p><p>上帝命令敬礼圣殿——而圣殿按上帝自己的构想，就是天上实体的像（圣像）。先知大卫向带像的圣殿叩拜；先知约书亚向带像的约柜叩拜。这样，敬礼像是上帝命令的，先知们也敬礼了带像的圣物，在它们面前叩拜。毫无疑问，先知们把这敬礼归于上帝：就是说，敬礼像，就是敬礼原型。正教基督徒所作的正是同样的事。</p><h3>“以防万一，还是把圣像撤掉吧”</h3><p>听了我们的解释之后，反对敬礼圣像的人常会同意我们的圣像敬礼是允许的；但他们说，不是我们所有人都足够好地认识教会的教训，仍有人把圣像当偶像对待；所以——他们说——最好把圣像撤掉，以免绊倒。</p><p>我们不同意，因为圣像是需要的，而对它们的错误态度应当藉教育、藉解释正确的信仰来消除。</p><p>有些人错误地理解圣经；然而这并不迫使我们为了避免绊倒而拒绝圣经。这只会使我们必须进行教育、正确地解释圣经的话语。</p><h3>对历史和教父传统部分批评的回应</h3><p><a href="https://bibleox.com/ru/ru/w/иконы-почитают#HH-Критика">详见</a></p><h2>结论</h2><p>这样，我们认为，那些把敬礼圣像与敬拜假神（偶像）混为一谈的人是错误的；指控正教徒拜偶像，是对信徒的不公正的指控，是对正教信仰的歪曲观念。</p><p>圣像只是关于上帝、人、事件的正确的解释和提醒；它既不被当作上帝敬礼，也不被当作代替上帝的东西敬礼。我们对与上帝相关之物表现出基本的敬意：如同人们尊敬国旗，不是为那特别的布料，而是为尊敬国家本身；尊敬总统的画像，不是为纸张和颜料的质量，而是为总统本人；尊敬十字架和福音书，不是为名贵的木料和书的材料，而是因为上帝在十字架上为我们的得救被钉，而书里写着他救恩的话语。</p><p>圣像被召帮助人对上帝、他的母亲和他的朋友们表达敬意。圣像可以帮助人在祈祷中集中注意力，把思想引向上帝。</p><p>有时，完全不是出于我们的意愿，上帝亲自藉圣像和其他物件显明奇迹和医治；这自然使我们想到对这物件特别的敬意——但不是代替上帝，而是为了上帝：如同上帝有一次对先知摩西说到必须敬重圣地那样：</p><blockquote><p>“上帝说：「不要近前来，当把你脚上的鞋脱下来，因为<strong><mark>你所站之地是圣地</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/3/#L5">出 3:5</a>)</p></blockquote><p>先知大卫也对圣物心存敬畏，向圣物叩拜：</p><blockquote><p>“你们当尊崇耶和华我们的上帝，<strong><mark>在他脚凳前下拜</mark></strong>；他本为圣！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/99/#L5">诗 99:5</a>)</p></blockquote><p>而对那些没有这种敬畏的人，上帝赐下致死的刑罚：</p><blockquote><p>“反而<strong>自高自大，抵抗上天的大主，命人将他殿宇的器皿给你拿来</strong>，供你和你的大臣并你的妻妾用来饮酒，并且你赞美那些不能看，不能听，不能知的金、银、铜、铁、木、石制的神像，却不知尊崇那掌握你的气息，注定你一切命途的天主。<strong>当夜加色丁王贝耳沙匝即为人所杀。</strong>” (<a href="https://bibleox.com/zh-Hans/cn-sb/dan/5/#L23,30">但 5:23,30</a>)</p></blockquote><p>这样，简单地说：当敬礼的是假神或指向假神之物时，这就是拜偶像，即敬礼并叩拜假神（偶像）。对这样的人、物件和像的宗教性敬礼，正教会不教导，并且谴责。</p><p>对真上帝的敬礼引向对一切与他相关之物的敬礼。上帝被当作上帝敬礼，而他的朋友们和忠心的仆人们——被当作他的朋友和忠心仆人敬礼，而不是被当作上帝。王被尊敬为王，而他的近臣——被尊敬为近臣，而不是王。在这样的敬礼里没有假神。正教会教导的正是这样的信仰。</p><h2>相关引文</h2><ol><li><p><a href="https://bibleox.com/ru/ru/w/почитание-святых-в-Библии">敬礼圣人</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/почитание-мощей-святых">敬礼圣髑</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/Выбор_места_как_форма_почитания">地方的选择作为敬礼的形式</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/молитвы-святым">为圣人祈祷</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/человек-храм-Божий">人——上帝的殿</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/состав-человека">人的构成</a></p></li></ol>
