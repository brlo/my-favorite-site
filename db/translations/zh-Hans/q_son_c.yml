- src: Христос-не-архангел-Михаил
  path: Qs13A_基督不是天使长米迦勒
  title: 基督不是天使长米迦勒
  copy_cover: true
  body: <h2>前言</h2><p>首先要说明：“基督就是天使长米迦勒”的说法存在于“耶和华见证人”这一极端教派中。耶和华见证人为论证自己的教导，制造了自己歪曲甚多的圣经译本（专家对该派《新世界》译本的评述见 <a href="https://azbyka.ru/otechnik/sekty/rassuzhdaja-so-svideteljami-iegovy-pri-pomoshhi-pisanija/4_7">azbyka.ru</a>）。此外，基督复临安息日会也有人认为，旧约中以天使长米迦勒身份出现的那一位似乎就是上帝之子耶稣基督。</p><h2>“天使”一词的两个含义</h2><p>在圣经中，“天使”一词有两种理解：职能与本性。</p><p>天使的<strong>职能</strong>是奉差遣，因为这个词在古希腊文中字面上正是这个意思：ἄγγελος（天使罗思）——使者、报信者；希伯来文 מלאך——使者。</p><p>天使的<strong>本性</strong>是无形体的灵。天使是被上帝所造的灵体，没有身体（无形的），换言之就是灵。这些灵在被造之先于人类，被赋予了自由与理性。他们中有一部分不愿顺服上帝，从他堕落了，但仍然被称为天使（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/25/#L41">太 25:41</a>）。也就是说，本性独立于活动：无论是否奉差遣，都是天使。本性就是如此。因此，一个由人所生的、完全具体的人——先知施洗约翰——也被称为天使（<a href="https://bibleox.com/zh-Hans/cn-cuv/mal/3/#L1">玛 3:1</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/11/#L10">太 11:10</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/1/#L2">可 1:2</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/7/#L27">路 7:27</a>）。同样含义下，基督自己也被称为新约的使者（<a href="https://bibleox.com/zh-Hans/cn-cuv/mal/3/#L1">玛 3:1</a>）。这个说清楚了。现在来看引文。</p><h2>所有天使都是服役的灵，而基督坐在宝座上</h2><p>使徒保罗称上帝之子是远比天使更尊贵的存在（<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/1/#L4">希 1:4</a>），因为上帝从不以对待自己儿子的方式对天使说话（<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/1/#L5">希 1:5</a>），上帝的儿子要受所有天使的敬拜（<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/1/#L6">希 1:6</a>）；他指出上帝论到天使和论到上帝之子的话语各不相同：前者是服役的灵，后者是坐在宝座上的主宰（<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/1/#L7-8">希 1:7-8</a> 与 <a href="https://bibleox.com/zh-Hans/cn-cuv/evr/1/#L13">希 1:13</a>）；并指出一切受造之物的短暂，但创造了万有的上帝之子自己永不废去（<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/1/#L10-12">希 1:10-12</a>）。最后，圣经直说：所有天使无一例外都是服役的灵，但子是与父同坐在宝座上的：</p><blockquote><p>“所有的天使，上帝从来对那一个说：『你<strong>坐在我的右边</strong>，等我使你仇敌作你的脚凳？』 天使岂不都是<strong>服役的灵</strong>、奉差遣为那将要承受救恩的人效力吗？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/1/#L13-14">希 1:13-14</a>)</p></blockquote><p>儿子受服役，而子与父一同作王。</p><h2>上帝要受人敬拜，基督受一切受造物的敬拜</h2><p>上帝说，万膝必向他跪拜（<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/14/#L11">罗 14:11</a>）；而基督受一切受造物的敬拜——不只是人（<a href="https://bibleox.com/zh-Hans/cn-cuv/fil/2/#L10">腓 2:10</a>），包括天使（<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/1/#L6">希 1:6</a>）。</p><h2>世界交给了基督，不是交给天使</h2><blockquote><p>“我们所说将来的世界，<strong>上帝原没有交给天使管辖</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/2/#L5">希 2:5</a>)</p></blockquote><p>同时，世界交给了基督：</p><blockquote><p>“因为经上说：『<strong>上帝叫万物都服在他的脚下</strong>。』既说万物都服了他，明显那叫万物服他的，不在其内了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/15/#L27">林前 15:27</a>)</p></blockquote><blockquote><p>“<strong>又将万有服在他的脚下</strong>，使他为教会作万有之首。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/1/#L22">弗 1:22</a>)</p></blockquote><blockquote><p>“<strong>叫万物都服在他的脚下</strong>。』既叫万物都服他，就没有剩下一样不服他的。只是如今我们还不见万物都服他。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/2/#L8">希 2:8</a>)</p></blockquote><h2>全能者、万王之王、万主之主</h2><p>先知称<strong>上帝</strong>为万主之主（<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/136/#L2-3">诗 136:2-3</a>）。使徒称<strong>上帝</strong>为万主之主、万王之王（<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/6/#L15-16">提前 6:15-16</a>）。使徒称<strong>耶稣基督</strong>为万主之主、万王之王（<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/17/#L14">启 17:14</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/19/#L16">启 19:16</a>），为全能者（<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/1/#L8">启 1:8</a>）。万王之王之上没有别的王。万主之主之上没有别的主。全能者之上没有任何存在能托住全能者，因为他自己以自己的能力托住万有。天使长米迦勒是天使军团的君长。基督却是世上一切——包括天使和天使长米迦勒本身——的元首。</p><h2>上帝（耶和华）亲自差遣先知，而基督说，正是他差遣了他们</h2><p>应当指出：基督指明，他就是那位向以色列差遣了许多先知的（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/23/#L34">太 23:34</a>）。而圣经告诉我们，正是上帝亲自（而非借天使）向先知说话，并亲自把他们差往以色列（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/3/#L12">出 3:12</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/mal/4/#L1">玛 4:1</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/mal/4/#L5">玛 4:5</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/sud/6/#L8">士 6:8</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/25/#L15">代下 25:15</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/1ts/15/#L1">撒上 15:1</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/2ts/12/#L1">撒下 12:1</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/2ts/12/#L7">撒下 12:7</a>）。也就是说，基督就是耶和华上帝。在上帝与先知的交往中，没有中间人。</p><h2>上帝之子由父所生，他创造了天使</h2><p>基督是一切看得见与看不见之物的创造者，包括天使（<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/1/#L13-17">西 1:13-17</a>）。也就是说，他要成为天使，就得先造出他自己。</p><h2>“米迦勒”之名的词源</h2><p>米迦勒是希伯来名字，源自 מי כמו אלוהים（米·克莫·埃洛希姆，缩略为“米·卡·埃尔”），字面意思是“谁能像上帝”。也就是说——没有谁与上帝同等，没有谁能与他相比。但基督并不认为自己与上帝同等是强夺的（<a href="https://bibleox.com/zh-Hans/cn-cuv/fil/2/#L6">腓 2:6</a>）。</p><h2>旧约借天使赐下，新约由主亲自宣讲</h2><p>使徒保罗指出新约与旧约的区别：旧约借天使传的（<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/2/#L2">希 2:2</a>），而新约由主自己亲自宣讲（<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/2/#L3">希 2:3</a>）。也就是说，至少不是借天使。</p><h2>上帝成为人，向天使显现</h2><blockquote><p>“大哉，敬虔的奥祕！无人不以为然，就是<strong>上帝在肉身显现</strong>，被圣灵称义，<strong>被天使看见</strong>，被传于外邦，被世人信服，被接在荣耀里。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/3/#L16">提前 3:16</a>)</p></blockquote><p>从来没有人看见上帝（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/1/#L18">约 1:18</a>），他住在人不能靠近的光里，人不可能看见上帝（<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/6/#L16">提前 6:16</a>）；然而，上帝一旦真正成为人（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/1/#L14">约 1:14</a>），就在基督里成为人人可见的。人不能凭肉眼看见灵界（天使）的居民，但基督却说自己看见了从天坠落的撒但（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/10/#L18">路 10:18</a>）。</p><h2>结语</h2><p>基督不是天使长米迦勒，而是上帝。他多次被直接称为上帝。圣经对此直言不讳：<a href="https://bibleox.com/ru/ru/w/Христос-Бог">基督是上帝</a></p><blockquote><p>“「<strong>我的民哪！你们当听我的话</strong>；以色列啊！我要劝戒你：<strong>我是上帝，是你的上帝</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/50/#L7">诗 50:7</a>)</p></blockquote>
