  path: Qs12A_基督——人类唯一的救主
  title: 基督——人类唯一的救主
  copy_cover: true
  body: <p>本文不仅表明耶稣基督是救主，也表明他是怎样的救主——他是万人的救主。所有人都蒙召归向基督，但并非所有人都得救。</p><h2>异教的神不是神</h2><p>没有别的上帝：</p><blockquote><p>“论到吃祭偶像之物，我们知道偶像在世上算不得什么，也知道<strong>上帝只有一位，再没有别的上帝</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/8/#L4">林前 8:4</a>)</p></blockquote><p>外邦人从前所事奉的，并不是神：</p><blockquote><p>“但从前你们不认识上帝的时候，是给那些<strong>本来不是神的</strong>作奴仆。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/4/#L8">加 4:8</a>)</p></blockquote><p>假神：</p><blockquote><p>“「诸君，为什么作这事呢？我们也是人，性情和你们一样！我们传福音给你们，是叫你们离弃这些虚妄，<strong>归向那创造天、地、海和其中万物的永生上帝</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/14/#L15">徒 14:15</a>)</p></blockquote><p>万民在从前各行自己的道路，而不是上帝的道路：</p><blockquote><p>“他在从前的世代，<strong>任凭万国各行其道</strong>；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/14/#L16">徒 14:16</a>)</p></blockquote><p>更多类似引文：<a href="https://bibleox.com/ru/ru/w/Бог-один">上帝是唯一的上帝</a></p><h2>拒绝基督就是拒绝上帝</h2><blockquote><p>“又对门徒说：「听从你们的就是听从我；弃绝你们的就是弃绝我；<strong>弃绝我的就是弃绝那差我来的</strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/10/#L16">路 10:16</a>)</p></blockquote><blockquote><p>“<strong>恨我的，也恨我的父</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/15/#L23">约 15:23</a>)</p></blockquote><blockquote><p>“<strong>凡不认子的，就没有父</strong>；认子的，连父也有了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/2/#L23">约壹 2:23</a>)</p></blockquote><blockquote><p>“<strong>凡越过基督的教训不常守着的，就没有上帝</strong>；常守这教训的，就有父又有子。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2in/1/#L9">约贰 1:9</a>)</p></blockquote><blockquote><p>“信子的人有永生；<strong>不信子的人得不着永生</strong>，<strong>上帝的震怒常在他身上</strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/3/#L36">约 3:36</a>)</p></blockquote><h2>没有对基督的信心，就不能得救</h2><blockquote><p>“你们众人和以色列百姓都当知道，站在你们面前的这人得痊愈，是因你们所钉十字架、上帝叫他从死里复活的<strong>拿撒勒人耶稣基督的名</strong>。 他是你们『匠人所弃的石头，已成了房角的头块石头。』 <strong>除他以外，别无拯救</strong>；因为在天下人间，<strong>没有赐下别的名，我们可以靠着得救</strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/4/#L10-12">徒 4:10-12</a>)</p></blockquote><blockquote><p>“<strong>人非有信，就不能得上帝的喜悦</strong>；因为到上帝面前来的人，必须信有上帝，且信他赏赐那寻求他的人。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/11/#L6">希 11:6</a>)</p></blockquote><h2>异端和脱离教会使人失去救恩</h2><p>编造异端的人必不能承受上帝的国：</p><blockquote><p>“情欲的事都是显而易见的，就如奸淫、污秽、邪荡、 拜偶像、邪术、仇恨、争竞、忌恨、恼怒、结党、<strong><mark>纷争</mark></strong>、<strong><mark>异端</mark></strong>、 嫉妒〔有古卷在此有『凶杀』二字〕、醉酒、荒宴等类。我从前告诉你们，现在又告诉你们，<strong><mark>行这样事的人必不能承受上帝的国</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/5/#L19-21">加 5:19-21</a>) <em>(和合本以「纷争」译 διχοστασίαι（分裂）)</em></p></blockquote><p>在教会中制造分裂的人——不是事奉主基督：</p><blockquote><p>“弟兄们，那些<strong>离间你们、叫你们跌倒</strong>、背乎所学之道的人，我劝你们要留意躲避他们。 因为这样的人<strong>不服事我们的主基督</strong>，只服事自己的肚腹，用花言巧语诱惑那些老实人的心。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/16/#L17-18">罗 16:17-18</a>)</p></blockquote><p>那些引人结党、属乎血气、没有圣灵：</p><blockquote><p>“他们曾对你们说过：『末世必有好讥诮的人随从自己不敬虔的私欲而行。』 这就是那些<strong>引人结党</strong>、属乎血气、没有圣灵的人。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iud/1/#L18-19">犹 1:18-19</a>)</p></blockquote><p>教会是基督的身体，基督是身体的救主：</p><blockquote><p>“赞美上帝，得众民的喜爱。主将<strong>得救的人天天加给</strong>他们。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/2/#L47">徒 2:47</a>)</p></blockquote><blockquote><p>“现在我为你们受苦，倒觉欢乐，并且为<strong>基督的身体，就是为教会</strong>，要在我肉身上补满基督患难的缺欠。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/1/#L24">西 1:24</a>)</p></blockquote><blockquote><p>“因为丈夫是妻子的头，如同基督是教会的头，他又是<strong>教会全体的救主</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/5/#L23">弗 5:23</a>)</p></blockquote><h2>所有人都要受审判</h2><blockquote><p>“因为<strong><mark>我们众人</mark></strong>必要在基督台前显露出来，叫各人按着本身所行的，<strong><mark>或善或恶受报</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/5/#L10">林后 5:10</a>)</p></blockquote><blockquote><p>“因为人所作的事，<strong><mark>连一切隐藏的事</mark></strong>，无论是<strong>善是恶</strong>，上帝都必审问。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ekl/12/#L14">传 12:14</a>)</p></blockquote><h3>审判要从上帝的家起首</h3><blockquote><p>“因为时候到了，<strong><mark>审判要从上帝的家起首</mark></strong>。若是<strong><mark>先从我们起首</mark></strong>，那不信从上帝福音的人将有何等的结局呢？ 『若是<strong>义人仅仅得救</strong>，那不虔敬和犯罪的人，将有何地可站呢？』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/4/#L17-18">彼前 4:17-18</a>)</p></blockquote><h3>人人都犯了许多罪</h3><blockquote><p>“原来<strong>我们在许多事上都有过失</strong>；若有人在话语上没有过失，他就是完全人，也能勒住自己的全身。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/3/#L2">雅 3:2</a>)</p></blockquote><blockquote><p>“<strong>我们若说自己无罪，便是自欺</strong>，真理不在我们心里了； &lt;…&gt; 我们若说自己没有犯过罪，便是以上帝为说谎的，他的道也不在我们心里了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/1/#L8,10">约壹 1:8,10</a>)</p></blockquote><h3>许多人将惊讶地发现没有得救</h3><p>他们以为自己是得救的：</p><blockquote><p>“当那日，<strong>必有许多人</strong>对我说：『主阿，主阿，我们不是<strong>奉你的名传道</strong>，<strong>奉你的名赶鬼</strong>，奉你的名<strong>行许多异能</strong>吗？』 我就明明地告诉他们说：『<strong>我从来不认识你们，你们这些作恶的人，离开我去吧！</strong>』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/7/#L22-23">太 7:22-23</a>)</p></blockquote><h2>许多人不得救</h2><h3>得救的不是所有人</h3><blockquote><p>“耶稣对众人说：「你们要努力进窄门。我告诉你们：将来有<strong>许多人</strong>想要进去，<strong>却是不能</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/13/#L24">路 13:24</a>)</p></blockquote><blockquote><p>“你们要进窄门。因为<strong>引到灭亡，那门是宽的，路是大的</strong>，<strong>进去的人也多</strong>； <strong>引到永生，那门是窄的，路是小的</strong>，<strong>找着的人也少</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/7/#L13-14">太 7:13-14</a>)</p></blockquote><blockquote><p>“<strong>凡称呼我『主阿，主阿』的人，不能都进天国</strong>；惟独遵行我天父旨意的人，才能进去。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/7/#L21">太 7:21</a>)</p></blockquote><blockquote><p>“农夫在地里撒许多种子，栽许多植物，但并非一切所种的都能存留，也并非一切所栽的都生根；同样，在这世代所撒的，也<strong>不会都得救</strong>。” (<a href="https://bibleox.com/zh-Hans/ru/3ezd/8/#L41">厄四 8:41</a>, 俄文原文无中文经文，此处自译)</p></blockquote><h3>得救的人少</h3><blockquote><p>“有一个人问他说：「主啊，<strong>得救的人少吗</strong>？」 耶稣对众人说：「你们要努力进窄门。我告诉你们：<strong>将来有许多人想要进去，却是不能</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/13/#L23-24">路 13:23-24</a>)</p></blockquote><blockquote><p>“你们要进窄门。因为<strong>引到灭亡，那门是宽的，路是大的</strong>，<strong>进去的人也多</strong>； <strong>引到永生，那门是窄的，路是小的</strong>，<strong>找着的人也少</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/7/#L13-14">太 7:13-14</a>)</p></blockquote><blockquote><p>“当那日，<strong>必有许多人</strong>对我说：『主阿，主阿，我们不是奉你的名传道，奉你的名赶鬼，奉你的名行许多异能吗？』 我就明明地告诉他们说：『<strong>我从来不认识你们，你们这些作恶的人，离开我去吧！</strong>』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/7/#L22-23">太 7:22-23</a>)</p></blockquote><blockquote><p>“你们这<strong>小群</strong>，不要惧怕，因为你们的父乐意把国赐给你们。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/12/#L32">路 12:32</a>)</p></blockquote><blockquote><p>“不义的，叫他仍旧不义；污秽的，叫他仍旧污秽；为义的，叫他仍旧为义；<strong>圣洁的，叫他仍旧圣洁</strong>。」 「看哪，我必快来！赏罚在我，<strong>要照各人所行的报应他</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/22/#L11-12">启 22:11-12</a>)</p></blockquote>
