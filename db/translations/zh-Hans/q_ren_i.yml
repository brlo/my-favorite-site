  path: QR17A_地狱——无尽的刑罚
  title: 地狱——无尽的刑罚
  copy_cover: true
  body: <h2>定义</h2><p>地狱——是在荣耀的第二次降临和最后审判之后被定罪的罪人的居所。最后审判之后，这一命运已无法改变。被定罪者的痛苦与义人的真福将同样永远持续。</p><h2>地狱的刑罚没有终点</h2><blockquote><p>“<strong><mark>他受痛苦的烟往上冒，直到永永远远</mark></strong>。那些拜兽和兽像，受牠名之印记的，<strong><mark>昼夜不得安宁</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/14/#L11">启 14:11</a>)</p></blockquote><blockquote><p>“倘若你一只眼叫你跌倒，就去掉它！你只有一只眼进入上帝的国，强如有两只眼被丢在地狱里。 在那里，『<strong><mark>虫是不死的，火是不灭的</mark></strong>。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/9/#L47-48">可 9:47-48</a>)</p></blockquote><blockquote><p>“那迷惑他们的魔鬼被扔在硫磺的火湖里，就是兽和假先知所在的地方，<strong><mark>他们必昼夜受痛苦，直到永永远远</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/20/#L10">启 20:10</a>)</p></blockquote><blockquote><p>“睡在尘埃中的，必有多人复醒，其中有得永生的，<strong><mark>有受羞辱、永远被憎恶的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/dan/12/#L2">但 12:2</a>)</p></blockquote><blockquote><p>“<strong><mark>这些人，要往永刑里去</mark></strong>；那些义人，要往永生里去。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/25/#L46">太 25:46</a>)</p></blockquote><blockquote><p>“<strong><mark>凡亵渎圣灵的，却永不得赦免，乃要担当永远的罪</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/3/#L29">可 3:29</a>)</p></blockquote><blockquote><p>“要报应那不认识上帝和那不听从我主耶稣福音的人。 <strong><mark>他们要受刑罚，就是永远沉沦</mark></strong>，离开主的面和他权能的荣光。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2sol/1/#L8-9">帖后 1:8-9</a>)</p></blockquote><blockquote><p>“这些人是无水的井，是狂风催逼的雾气，<strong><mark>有墨黑的幽暗为他们存留</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2pet/2/#L17">彼后 2:17</a>)</p></blockquote><blockquote><p>“各样洗礼、按手之礼、死人复活，以及<strong><mark>永远审判</mark></strong>各等教训。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/6/#L2">希 6:2</a>)</p></blockquote><blockquote><p>“上帝既是公义的，就必将患难报应那加患难给你们的人； 也必使你们这受患难的人与我们同得平安。那时，主耶稣同他有能力的天使从天上在火焰中显现， 要报应那不认识上帝和那不听从我主耶稣福音的人。 <strong><mark>他们要受刑罚，就是永远沉沦</mark></strong>，离开主的面和他权能的荣光。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2sol/1/#L6-9">帖后 1:6-9</a>)</p></blockquote><h2>不知道上帝旨意的人也要受刑罚</h2><blockquote><p>“仆人知道主人的意思，却不预备，又不顺他的意思行，<strong><mark>那仆人必多受责打</mark></strong>； 惟有那不知道的，作了当受责打的事，<strong><mark>必少受责打</mark></strong>。因为多给谁，就向谁多取；多托谁，就向谁多要。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/12/#L47-48">路 12:47-48</a>)</p></blockquote><h2>批评</h2><h3>地狱无尽刑罚的教导会使人远离基督吗？</h3><p>这不是论据。罪人听到关于罪的刑罚的话，本来就是不舒服的。难道因此就该向他应许：犯罪会有真福？同样，对爱罪的人来说，这样的教导是不舒服的：</p><ul><li><p>论悔改，</p></li><li><p>论离弃罪，</p></li><li><p>论改正生活，</p></li><li><p>论基督是唯一的救主，别的路不通向救恩（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/4/#L12">徒 4:12</a>），</p></li><li><p>论爱仇敌、放弃报复、饶恕人的亏欠、善待恨我们的人（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L44">太 5:44</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L27">路 6:27</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L35">路 6:35</a>），</p></li><li><p>论放弃求财的意向（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/19/#L24">太 19:24</a>），</p></li><li><p>论一夫一妻（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/19/#L10">太 19:10</a>）。</p></li></ul><p>但这当然并不意味着要放弃这一切。而为什么不意味着呢？因为这是真理。如果人不听从这些话，那么关于刑罚的警告就真会应验——这些话并不是徒然的。我们警告他，是为了这些事不至于临到他身上。永远的刑罚也是如此：如果这是真实的教导，那为什么要修改真理、删除罪人不便听到的东西呢？</p><blockquote><p>“因为时候要到，人必厌烦纯正的道理，<strong><mark>耳朵发痒，就随从自己的情欲，增添好些师傅</mark></strong>；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/4/#L3">提后 4:3</a>)</p></blockquote><p>在教导中应当以真理为出发点，而不是以人们喜欢听什么为出发点：</p><blockquote><p>“亲爱的弟兄啊，我想尽心写信给你们，论我们同得救恩的时候，就不得不写信劝你们，<strong><mark>要为从前一次交付圣徒的真道竭力的争辩</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iud/1/#L3">犹 1:3</a>)</p></blockquote>
