  path: Qs9A_基督——祭品
  title: 基督——祭品
  copy_cover: true
  body: <h2>上帝之子在创世以前就已被定为祭品</h2><blockquote><p>“乃是凭着基督的宝血，如同无瑕疵、无玷污的羔羊之血。 基督<strong>在创世以前是预先被上帝知道</strong>的，却在这末世才为你们显现。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/1/#L19-20">彼前 1:19-20</a>)</p></blockquote><h2>亚伯拉罕的福分</h2><blockquote><p>“基督既为我们受了咒诅，就赎出我们脱离律法的咒诅，因为经上记着：『凡挂在木头上都是被咒诅的。』 这便<strong>叫亚伯拉罕的福，因基督耶稣可以临到外邦人</strong>，使我们因信得着所应许的圣灵。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/3/#L13-14">加 3:13-14</a>)</p></blockquote><h2>救赎</h2><blockquote><p>“知道你们<strong>得赎</strong>、<strong>脱去你们祖宗所传流虚妄的行为</strong>，不是凭着能坏的金银等物， 乃是凭着<strong>基督的宝血</strong>，如同无瑕疵、无玷污的羔羊之血。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/1/#L18-19">彼前 1:18-19</a>)</p></blockquote><blockquote><p>“<strong>基督既为我们受了咒诅</strong>，就赎出我们脱离律法的咒诅，因为经上记着：『凡挂在木头上都是被咒诅的。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/3/#L13">加 3:13</a>)</p></blockquote><blockquote><p>“像这样，<strong>基督既然一次被献，担当了多人的罪</strong>，将来要向那等候他的人第二次显现，并与罪无关，乃是为拯救他们。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/9/#L28">希 9:28</a>)</p></blockquote><h2>和好</h2><blockquote><p>“<strong>因他使我们和睦，将两下合而为一</strong>，拆毁了中间隔断的墙， 而且<strong>以自己的身体废掉冤仇</strong>，就是那记在律法上的规条，为要将两下借着自己造成一个新人，如此便成就了和睦。 既在十字架上灭了冤仇，便<strong>藉这十字架使两下归为一体，与上帝和好了</strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/2/#L14-16">弗 2:14-16</a>)</p></blockquote><blockquote><p>“因为我们作仇敌的时候，且<strong>借着上帝儿子的死得与上帝和好</strong>；既已和好，就更要因他的生得救了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/5/#L10">罗 5:10</a>)</p></blockquote><blockquote><p>“一切都是出于上帝，他<strong>借着基督使我们与他和好</strong>，又将劝人与他和好的职分赐给我们。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/5/#L18">林后 5:18</a>)</p></blockquote><blockquote><p>“这就是<strong>上帝在基督里叫世人与自己和好</strong>，不将他们的过犯归到他们身上，并且将这和好的道理托付了我们。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/5/#L19">林后 5:19</a>)</p></blockquote><blockquote><p>“既然<strong>借着他在十字架上所流的血成就了和平</strong>，便借着他叫万有，无论是地上的、天上的，都与自己和好了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/1/#L20">西 1:20</a>)</p></blockquote><blockquote><p>“但如今他<strong>借着基督的肉身受死，叫你们与自己和好，都成了圣洁</strong>，没有瑕疵，<strong>无可责备</strong>，把你们引到自己面前。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/1/#L22">西 1:22</a>)</p></blockquote><h2>与上帝联合</h2><blockquote><p>“因<strong>基督也曾一次为罪受苦</strong>，就是义的代替不义的，<strong>为要引我们到上帝面前</strong>。按着肉体说，他被治死；按着灵性说，他复活了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/3/#L18">彼前 3:18</a>)</p></blockquote><h2>圣体血（领受基督的体血）</h2><blockquote><p>“我们有一祭坛，上面的祭物是那些在帐幕中供职的人不可同吃的。 原来牲畜的血被大祭司带入圣所作赎罪祭，牲畜的身子被烧在营外。 所以<strong>耶稣要用自己的血叫百姓成圣，也就在城门外受苦</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/13/#L10-12">希 13:10-12</a>)</p></blockquote><blockquote><p>“他们吃的时候，耶稣拿起饼来，祝福，就擘开递给门徒，说：「你们拿着吃，这是我的身体。」 又拿起杯来，祝谢了，递给他们，说：「<strong>你们都喝这个， 因为这是我立约的血，为多人流出来，使罪得赦</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/26/#L26-28">太 26:26-28</a>)</p></blockquote><blockquote><p>“祝谢了，就擘开，说，「这是<strong>我的身体，为你们舍的</strong>。你们应当如此行，为的是记念我。」 饭后，也照样拿起杯来，说：「这杯是用我的血所立的新约。你们每逢喝的时候，要如此行，为的是记念我。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/11/#L24-25">林前 11:24-25</a>)</p></blockquote><h2>新约</h2><blockquote><p>“祝谢了，就擘开，说，「这是我的身体，为你们舍的。你们应当如此行，为的是记念我。」 饭后，也照样拿起杯来，说：「这杯<strong>是用我的血所立的新约</strong>。你们每逢喝的时候，要如此行，为的是记念我。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/11/#L24-25">林前 11:24-25</a>)</p></blockquote><h2>国度</h2><blockquote><p>“因此<strong>基督死了，又活了，为要作死人并活人的主</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/14/#L9">罗 14:9</a>)</p></blockquote><p>成全父的旨意、预言和应许</p><blockquote><p>“我说，基督是<strong>为上帝真理</strong>作了受割礼人的执事，<strong>要证实所应许列祖的话</strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/15/#L8">罗 15:8</a>)</p></blockquote><h2>榜样</h2><blockquote><p>“你们蒙召原是为此，因<strong>基督也为你们受过苦，给你们留下榜样</strong>，叫你们跟随他的脚踪行。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/2/#L21">彼前 2:21</a>)</p></blockquote><blockquote><p>“并且<strong>他替众人死，是叫那些活着的人不再为自己活，乃为替他们死而复活的主活</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/5/#L15">林后 5:15</a>)</p></blockquote><h2>来自穆斯林的问题</h2><h3>为什么需要祭品？怜悯的上帝难道不能白白赦免吗？</h3><p>基督徒所信的上帝称为爱：</p><blockquote><p>“没有爱心的，就不认识上帝，因为<strong>上帝就是爱</strong>。 &lt;…&gt; 上帝爱我们的心，我们也知道、也信。<strong>上帝就是爱！</strong>住在爱里面的，就是住在上帝里面，上帝也住在他里面。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/4/#L8,16">约壹 4:8,16</a>)</p></blockquote><p>上帝借着把自己献为祭、以拯救受造者，正是显明他对受造物的爱——因为他自己也说过：</p><blockquote><p>“<strong><mark>人为朋友舍命，人的爱心没有比这个大的</mark></strong>；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/15/#L13">约 15:13</a>)</p></blockquote><p>这样，他以祭品之爱吸引他所愿意拯救的人：</p><blockquote><p>“<strong>我若从地上被举起来，就要吸引万人来归我</strong>。」 耶稣这话原是<strong>指着自己将要怎样死说的</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/12/#L32-33">约 12:32-33</a>)</p></blockquote><p>但智慧的上帝始终以智慧安排救恩。除了爱之外，我们还可以说到神圣公义的满足：上帝不仅怜悯，而且公义。他善于把智慧、怜悯、公义和爱结合在一起。</p>
  meta_desc: 圣经关于基督之祭的引文
