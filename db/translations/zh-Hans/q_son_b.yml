- src: Христос-титулы
  path: Qs11A_基督的名号
  title: 基督的名号
  copy_cover: true
  body: <p>对穆斯林而言，重要的是：圣经把许多名号归于基督，而伊斯兰教只允许把这些名号归于上帝——创造者、圣者、万王之王、首先的、永不改变的、大能者：</p><ul><li><p>创造者（al-Khaliq，ٱلْخَـٰلِقُ）——<a href="https://bibleox.com/zh-Hans/cn-cuv/in/1/#L3,10">约 1:3,10</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/1/#L1-2">希 1:1-2</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/11/#L3">希 11:3</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/1/#L8-12">希 1:8-12</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/1/#L13-17">西 1:13-17</a></p></li><li><p>万王之王（Malik al-Mulk）——<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/17/#L14">启 17:14</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/19/#L16">启 19:16</a></p></li><li><p>统治万有者（al-Qahhar）——<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/17/#L14">启 17:14</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/19/#L16">启 19:16</a></p></li><li><p>圣者（al-Quddus）——<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/3/#L7">启 3:7</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/6/#L10">启 6:10</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/7/#L26">希 7:26</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/act/3/#L14">徒 3:14</a></p></li><li><p>温柔者（al-Halim）——<a href="https://bibleox.com/zh-Hans/cn-cuv/ier/11/#L19">耶 11:19</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/11/#L29">太 11:29</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/21/#L5">太 21:5</a></p></li><li><p>太初、首先的（al-Awwal）——<a href="https://bibleox.com/zh-Hans/cn-cuv/in/1/#L1-3">约 1:1-3</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/1/#L10">启 1:10</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/1/#L17">启 1:17</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/2/#L8">启 2:8</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/22/#L13">启 22:13</a></p></li><li><p>末后的（al-Akhir）——<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/1/#L10">启 1:10</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/1/#L17">启 1:17</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/2/#L8">启 2:8</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/22/#L13">启 22:13</a></p></li><li><p>永不改变的（as-Samad）——<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/13/#L8">希 13:8</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/1/#L10-12">希 1:10-12</a></p></li><li><p>永活的（al-Hayy）——<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/1/#L17">启 1:17</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/act/3/#L15">徒 3:15</a></p></li><li><p>救主（al-Muhaymin）——<a href="https://bibleox.com/zh-Hans/cn-cuv/in/4/#L42">约 4:42</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/1/#L47">路 1:47</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/2/#L11">路 2:11</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/act/5/#L31">徒 5:31</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/act/13/#L23">徒 13:23</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/5/#L23">弗 5:23</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/fil/3/#L20">腓 3:20</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/1/#L1">提前 1:1</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/1/#L10">提后 1:10</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/tit/1/#L4">多 1:4</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/tit/2/#L13">多 2:13</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/tit/3/#L6">多 3:6</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/2pet/1/#L1">彼后 1:1</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/2pet/1/#L11">彼后 1:11</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/2pet/2/#L20">彼后 2:20</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/2pet/3/#L18">彼后 3:18</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/4/#L14">约壹 4:14</a></p></li><li><p>光（an-Nur）——<a href="https://bibleox.com/zh-Hans/cn-cuv/in/1/#L9">约 1:9</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/in/12/#L46">约 12:46</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/in/12/#L35-36">约 12:35-36</a></p></li><li><p>后嗣（al-Warith）——<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/1/#L2">希 1:2</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/21/#L38">太 21:38</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/4/#L1">提后 4:1</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/2pet/1/#L11">彼后 1:11</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/8/#L17">罗 8:17</a></p></li><li><p>真理（al-Haqq）——<a href="https://bibleox.com/zh-Hans/cn-cuv/in/14/#L6">约 14:6</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/3/#L7">启 3:7</a></p></li><li><p>开启者（al-Fattah）——<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/3/#L7-8">启 3:7-8</a></p></li><li><p>使人复活的（al-Ba'ith）——<a href="https://bibleox.com/zh-Hans/cn-cuv/in/5/#L21">约 5:21</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/in/6/#L54">约 6:54</a></p></li><li><p>大能者（al-Jabbar）——<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/1/#L3">希 1:3</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/1/#L8">启 1:8</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/28/#L18">太 28:18</a></p></li></ul>
  meta_desc: 圣经把伊斯兰教只允许归于上帝的许多名号归于基督
  menu:
    parent: 上帝/圣子
    title: 基督的名号
    priority: 15
