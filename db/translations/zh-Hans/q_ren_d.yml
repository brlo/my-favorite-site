- src: Исцеления
  path: QR11A_医治
  title: 医治
  copy_cover: true
  body: <h2>借圣髑（遗骸）</h2><blockquote><p>“有人正葬死人，忽然看见一群人，就把死人抛在以利沙的坟墓里，一碰着<strong><mark>以利沙的骸骨</mark></strong>，死人就复活站起来了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/4ts/13/#L21">王下 13:21</a>)</p></blockquote><h2>借水</h2><blockquote><p>“因为有天使按时下池子<strong><mark>搅动那水</mark></strong>，水动之后，谁先下去，无论害什么病就痊瘉了” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/5/#L4">约 5:4</a>)</p></blockquote><h2>借衣物</h2><blockquote><p>“甚至有人从保罗身上拿<strong><mark>手巾或围裙</mark></strong>放在病人身上，病就退了，恶鬼也出去了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/19/#L12">徒 19:12</a>)</p></blockquote><h2>借使徒的影子</h2><blockquote><p>“甚至有人<strong><mark>将病人抬到街上</mark></strong>，放在床上或褥子上，<strong><mark>指望彼得过来的时候，或者得他的影儿照在什么人身上</mark></strong>。 还有许多人带着病人和被污鬼缠磨的，从耶路撒冷四围的城邑来，<strong><mark>全都得了医治</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/5/#L15-16">徒 5:15-16</a>)</p></blockquote><h2>直接，以上帝的话语</h2><blockquote><p>“我也自以为不配去见你，<strong><mark>只要你说一句话，我的仆人就必好了</mark></strong>。 &lt;…&gt; 那托来的人回到百夫长家里，看见仆人已经好了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/7/#L7,10">路 7:7,10</a>)</p></blockquote><h2>恩典借物件运行</h2><blockquote><p>“你举手向海伸<strong><mark>杖</mark></strong>，把水分开，以色列人要下海中走干地。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/14/#L16">出 14:16</a>)</p></blockquote>
