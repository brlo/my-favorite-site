- src: все-люди-грешны
  path: QR10A_世人皆有罪
  title: 世人皆有罪
  copy_cover: true
  body: <p><strong>原罪</strong>——</p><ol><li><p>亚当和夏娃的祖传之罪。</p></li><li><p>人性所受的损伤；这损伤如今使人趋向罪恶的思想、言语和行为（做坏事是乐于去做的，而行善却需要意志的努力）。这状态在出生时传给后代：传给所有的人，惟独主耶稣基督除外。</p></li></ol><h2>所有的人都从受孕之初就从始祖（亚当和夏娃）承受了罪性</h2><blockquote><p>“<strong><mark>谁能使洁净之物出于污秽之中呢</mark></strong>？<strong><mark>无论谁也不能</mark></strong>！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iov/14/#L4">伯 14:4</a>)</p></blockquote><blockquote><p>“这却怎么样呢？我们比他们强吗？决不是的！因我们已经证明：犹太人和希利尼人<strong><mark>都在罪恶之下</mark></strong>。 就如经上所记：『<strong><mark>没有义人，连一个也没有</mark></strong>！ 没有明白的，没有寻求上帝的； 都是偏离正路，一同变为无用。没有行善的，连一个也没有。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/3/#L9-12">罗 3:9-12</a>)</p></blockquote><blockquote><p>“因为<strong><mark>世人都犯了罪</mark></strong>，亏缺了上帝的荣耀；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/3/#L23">罗 3:23</a>)</p></blockquote><blockquote><p>“这就如<strong><mark>罪是从一人入了世界</mark></strong>，死又是从罪来的，于是<strong><mark>死就临到众人，因为众人都犯了罪</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/5/#L12">罗 5:12</a>)</p></blockquote><blockquote><p>“<strong><mark>因一人的悖逆，众人成为罪人</mark></strong>；照样，因一人的顺从，众人也成为义了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/5/#L19">罗 5:19</a>)</p></blockquote><blockquote><p>“我们原晓得律法是属乎灵的，<strong><mark>但我是属乎肉体的，是已经卖给罪了</mark></strong>。 &lt;…&gt; 因为按着我里面的意思，我是喜欢上帝的律； 但我觉得<strong><mark>肢体中另有个律和我心中的律交战</mark></strong>，把我掳去，<strong><mark>叫我附从那肢体中犯罪的律</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/7/#L14,22-23">罗 7:14,22-23</a>)</p></blockquote><blockquote><p>“我们从前也<strong>都</strong>在他们中间，放纵肉体的私欲，随着肉体和心中所喜好的去行，<strong><mark>本为可怒之子</mark></strong>，和别人一样。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/2/#L3">弗 2:3</a>)</p></blockquote><blockquote><p>“我是在罪孽里生的，<strong><mark>在我母亲怀胎的时候就有了罪</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/51/#L5">诗 51:5</a>)</p></blockquote><blockquote><p>“<strong><mark>人心比万物都诡诈</mark></strong>，坏到极处，谁能识透呢？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ier/17/#L9">耶 17:9</a>)</p></blockquote><h2>长大成人后，所有人都又获得了自己自身的罪性</h2><blockquote><p>“时常行善而<strong><mark>不犯罪</mark></strong>的<strong><mark>义人</mark></strong>，世上实在没有。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ekl/7/#L20">传 7:20</a>)</p></blockquote><blockquote><p>“受生的人中，没有一人未曾行不义；承认你的人中，也没有一人未曾犯罪。” (<a href="https://bibleox.com/zh-Hans/ru/3ezd/8/#L35">厄四 8:35</a>, 俄文原文无中文经文，此处自译)</p></blockquote><blockquote><p>“<strong><mark>我们若说自己无罪，便是自欺</mark></strong>，真理不在我们心里了；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/1/#L8">约壹 1:8</a>)</p></blockquote><blockquote><p>“你的民若得罪你（<strong><mark>世上没有不犯罪的人</mark></strong>），你向他们发怒，将他们交给仇敌掳到或远或近之地；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/6/#L36">代下 6:36</a>)</p></blockquote><blockquote><p>“断乎不能！不如说，上帝是真实的，<strong><mark>人都是虚谎的</mark></strong>。如经上所记：『你责备人的时候，显为公义；被人议论的时候，可以得胜。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/3/#L4">罗 3:4</a>)</p></blockquote><blockquote><p>“就如经上所记：『<strong><mark>没有义人，连一个也没有</mark></strong>！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/3/#L10">罗 3:10</a>)</p></blockquote><blockquote><p>“<strong><mark>但圣经把众人都圈在罪里</mark></strong>，使所应许的福因信耶稣基督归给那信的人。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/3/#L22">加 3:22</a>)</p></blockquote><h2>上帝呼召人悔改和归正</h2><blockquote><p>“世人蒙昧无知的时候，上帝并不监察，<strong><mark>如今却吩咐各处的人都要悔改</mark></strong>。 因为他已经定了日子，要借着他所设立的人按公义审判天下，并且叫他从死里复活，给万人作可信的凭据。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/17/#L30-31">徒 17:30-31</a>)</p></blockquote><blockquote><p>“彼得说：「<strong><mark>你们各人要悔改，奉耶稣基督的名受洗，叫你们的罪得赦</mark></strong>，就必领受所赐的圣灵；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/2/#L38">徒 2:38</a>)</p></blockquote><blockquote><p>“<strong><mark>信而受洗的，必然得救</mark></strong>；<strong><mark>不信的，必被定罪</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/16/#L16">可 16:16</a>)</p></blockquote><p>上帝呼召人经由他于2000年前所建立的<a href="https://bibleox.com/ru/ru/w/Церковь"><strong>东正教会</strong></a>而得救，人经由<a href="https://bibleox.com/ru/ru/w/крещение"><strong>洗礼</strong></a>进入教会。</p>
