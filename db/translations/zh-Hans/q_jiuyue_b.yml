  path: QO7A_酒
  title: 酒
  copy_cover: true
  body: <h2>主耶稣基督喝酒</h2><blockquote><p>“<strong><mark>人子来了，也吃也喝</mark></strong>，人又说他是<strong><mark>贪食好酒的人</mark></strong>，是税吏和罪人的朋友。但智慧之子，总以智慧为是〔有古卷作『但智慧在行为上就显为是』〕。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/11/#L19">太 11:19</a>)</p></blockquote><blockquote><p>“我实在告诉你们：<strong><mark>我不再喝这葡萄汁</mark></strong>，<strong><mark>直到我在上帝的国里喝新的那日子</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/14/#L25">可 14:25</a>)</p></blockquote><h2>主在加利利的迦拿婚宴上把水变成了酒</h2><blockquote><p>“<strong><mark>管筵席的尝了那水变的酒</mark></strong>，并不知道是那里来的，只有舀水的用人知道。管筵席的便叫新郎来，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/2/#L9">约 2:9</a>)</p></blockquote><h2>因阿尼西弗的病，建议他稍微喝点酒</h2><blockquote><p>“因你胃口不清，屡次患病，再不要照常喝水，<strong><mark>可以稍微用点酒</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/5/#L23">提前 5:23</a>)</p></blockquote><h2>说明</h2><p>饮食本身不是罪，罪是暴食、贪吃口腹。喝酒本身不是罪，罪是醉酒。</p>
