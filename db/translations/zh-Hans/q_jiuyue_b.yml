- src: главное-в-законе
  path: QO8A_律法中主要的事
  title: 律法中主要的事
  copy_cover: true
  body: <h2>主要的</h2><ul><li><p>公义</p></li><li><p>怜悯</p></li><li><p>信实</p></li></ul><h2>主耶稣基督的指示</h2><blockquote><p>“你们这假冒为善的文士和法利赛人有祸了！因为你们将薄荷、茴香、芹菜献上十分之一，<strong><mark>那律法上更重的事，就是公义、怜恤、信实，反倒不行了</mark></strong>。<strong><mark>这更重的是你们当行的，那也是不可不行的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/23/#L23">太 23:23</a>)</p></blockquote><blockquote><p>“「夫子，<strong><mark>律法上的诫命，那一条是最大的呢</mark></strong>？」 耶稣对他说：「<strong><mark>你要尽心、尽性、尽意，爱主你的上帝</mark></strong>。 <strong><mark>这是诫命中的第一，且是最大的</mark></strong>。 <strong><mark>其次也相倣，就是要爱人如己</mark></strong>。 <strong><mark>这两条诫命是律法和先知一切道理的总纲</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/22/#L36-40">太 22:36-40</a>)</p></blockquote><h2>使徒的指示</h2><blockquote><p>“<strong><mark>因为全律法都包在『爱人如己』这一句话之内了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/5/#L14">加 5:14</a>)</p></blockquote><h2>先知的指示</h2><blockquote><p>“世人哪，耶和华已指示你何为善，他向你所要的是什么呢？<strong><mark>只要你行公义，好怜悯，存谦卑的心，与你的上帝同行</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mih/6/#L8">弥 6:8</a>)</p></blockquote><blockquote><p>“<strong><mark>所以你当归向你的上帝，谨守仁爱、公平，常常等候你的上帝</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/os/12/#L6">何 12:6</a>)</p></blockquote><blockquote><p>“以色列人哪，你们当听耶和华的话。耶和华与这地的居民争辩，<strong><mark>因这地上无诚实，无良善，无人认识上帝</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/os/4/#L1">何 4:1</a>)</p></blockquote><blockquote><p>“<strong><mark>我喜爱良善，不喜爱祭祀</mark></strong>；<strong><mark>喜爱认识上帝，胜于燔祭</mark></strong>！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/os/6/#L6">何 6:6</a>)</p></blockquote><blockquote><p>“『万军之耶和华曾对你们的列祖如此说：『<strong><mark>要按至理判断，各人以慈爱怜悯弟兄</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/zah/7/#L9">亚 7:9</a>)</p></blockquote><blockquote><p>“<strong><mark>因为耶和华喜爱公平，不撇弃他的圣民</mark></strong>。他们永蒙保佑，但恶人的后裔必被剪除。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/37/#L28">诗 37:28</a>) <em>(俄文本编号为 Пс 36:28（圣咏编号相差一）。)</em></p></blockquote><blockquote><p>“<strong><mark>他喜爱仁义公平；遍地满了耶和华的慈爱</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/33/#L5">诗 33:5</a>) <em>(俄文本编号为 Пс 32:5（圣咏编号相差一）。)</em></p></blockquote><h2>其余</h2><blockquote><p>“<strong><mark>只要把里面的施舍给人</mark></strong>，凡物于你们就都洁净了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/11/#L41">路 11:41</a>)</p></blockquote><blockquote><p>“水可以消灭烈火，<strong>施舍可以补赎罪过</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/3/#L33">德 3:33</a>) <em>(俄文本为 Сир 3:30。)</em></p></blockquote>
