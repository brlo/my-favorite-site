- src: смертные-грехи-в-вз
  path: QO9A_旧约中的致死之罪
  title: 旧约中的致死之罪
  copy_cover: true
  body: <p>旧约中应当处以死刑的行为：</p><ul><li><p>提议事奉假神：<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/13/#L6-10">申 13:6-10</a></p></li><li><p>向假神献祭：<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/22/#L20">出 22:20</a></p></li><li><p>将儿女献给偶像：<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/20/#L2">利 20:2</a></p></li><li><p>亵渎：<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/24/#L16">利 24:16</a></p></li><li><p>行邪术：<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/20/#L27">利 20:27</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/22/#L18">出 22:18</a></p></li><li><p>假预言、使人离开上帝：<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/13/#L5">申 13:5</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/18/#L20">申 18:20</a></p></li><li><p>干犯安息日：<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/31/#L14-15">出 31:14-15</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/35/#L2">出 35:2</a></p></li><li><p>杀人：<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/21/#L12">出 21:12</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/24/#L17">利 24:17</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/24/#L21">利 24:21</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/35/#L16">民 35:16</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/35/#L17">民 35:17</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/35/#L18">民 35:18</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/35/#L21">民 35:21</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/35/#L31">民 35:31</a></p></li><li><p>咒骂父亲或母亲：<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/21/#L17">出 21:17</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/20/#L9">利 20:9</a></p></li><li><p>殴打父亲或母亲：<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/21/#L15">出 21:15</a></p></li><li><p>拐带人口或卖人为奴：<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/21/#L16">出 21:16</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/24/#L7">申 24:7</a></p></li><li><p>对杀了人的顶触牲畜疏于看管：<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/21/#L29">出 21:29</a></p></li><li><p>强奸：<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/22/#L25">申 22:25</a></p></li><li><p>婚外情（行淫的二人都要被治死）：<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/20/#L10">利 20:10</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/20/#L11">利 20:11</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/20/#L12">利 20:12</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/22/#L22">申 22:22</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/22/#L25">申 22:25</a></p></li><li><p>亲属之间的肉体关系：<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/20/#L11-21">利 20:11-21</a></p></li><li><p>祭司之女的淫乱——女儿要被火烧死：<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/21/#L9">利 21:9</a></p></li><li><p>男色（同性苟合）：<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/20/#L13">利 20:13</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/20/#L15">利 20:15</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/20/#L16">利 20:16</a></p></li><li><p>兽淫：<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/22/#L19">出 22:19</a></p></li><li><p>不听从祭司和审判官：<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/17/#L8-12">申 17:8-12</a></p></li><li><p>平民（非祭司）进入会幕：<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/3/#L10">民 3:10</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/3/#L38">民 3:38</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/18/#L7">民 18:7</a></p></li><li><p>外人擅自行祭司的事奉：<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/3/#L10">民 3:10</a></p></li><li><p>平民（非利未人）抬会幕：<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/1/#L51">民 1:51</a></p></li><li><p>上西奈山（越过界限）：<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/19/#L12">出 19:12</a></p></li></ul><p>此外：</p><ul><li><p>命令杀灭引诱以色列人事奉毗珥偶像的米甸人的儿女和妇女：<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/31/#L15-17">民 31:15-17</a></p></li><li><p>命令杀灭亚玛力人：男人、妇女、孩童、吃奶的婴儿：<a href="https://bibleox.com/zh-Hans/cn-cuv/1ts/15/#L3">撒上 15:3</a></p></li></ul>
