- src: 10-заповедей
  path: QO10A_十诫
  title: 十诫（十言）
  copy_cover: true
  body: <h2>上帝在石版上赐给先知摩西的十条诫命</h2><p>上帝的诫命并不限于这些，但正是这些诫命写在了石版上。</p><h3>1</h3><blockquote><p>“「<strong><mark>我是耶和华你的上帝</mark></strong>，曾将你从埃及地为奴之家领出来。 <strong><mark>除了我以外，你不可有别的神</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/20/#L2-3">出 20:2-3</a>) <em>(并见 <a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/5/#L6-7">申 5:6-7</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/19/#L2">利 19:2</a>。)</em></p></blockquote><h3>2</h3><blockquote><p>“<strong><mark>不可为自己雕刻偶像</mark></strong>；也不可作什么形像仿佛上天、下地，和地底下、水中的百物。 <strong><mark>不可跪拜那些像；也不可事奉它</mark></strong>，因为我耶和华你的上帝，是忌邪的上帝。恨我的，我必追讨他的罪，自父及子，直到三四代；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/20/#L4-5">出 20:4-5</a>) <em>(并见 <a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/5/#L8-9">申 5:8-9</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/19/#L4">利 19:4</a>。)</em></p></blockquote><h3>3</h3><blockquote><p>“<strong><mark>不可妄称耶和华你上帝的名</mark></strong>；因为妄称耶和华名的，耶和华必不以他为无罪。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/20/#L7">出 20:7</a>) <em>(并见 <a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/5/#L11">申 5:11</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/19/#L12">利 19:12</a>。)</em></p></blockquote><h3>4</h3><blockquote><p>“<strong><mark>当记念安息日，守为圣日</mark></strong>。 <strong><mark>六日要劳碌作你一切的工</mark></strong>， <strong><mark>但第七日是向耶和华你上帝当守的安息日</mark></strong>。这一日你和你的儿女、仆婢、牲畜，并你城里寄居的客旅，无论何工都不可作。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/20/#L8-10">出 20:8-10</a>) <em>(并见 <a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/5/#L12-15">申 5:12-15</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/19/#L3">利 19:3</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/19/#L30">利 19:30</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/ier/17/#L21">耶 17:21</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/neem/13/#L15-18">尼 13:15-18</a>。)</em></p></blockquote><h3>5</h3><blockquote><p>“<strong><mark>当孝敬父母，使你的日子在耶和华你上帝所赐你的地上得以长久</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/20/#L12">出 20:12</a>) <em>(并见 <a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/5/#L16">申 5:16</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/19/#L3">利 19:3</a>。)</em></p></blockquote><h3>6</h3><blockquote><p>“<strong><mark>不可杀人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/20/#L13">出 20:13</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/5/#L17">申 5:17</a>) <em>(并见 <a href="https://bibleox.com/zh-Hans/cn-cuv/lev/19/#L17-18">利 19:17-18</a>。)</em></p></blockquote><h3>7</h3><blockquote><p>“<strong><mark>不可奸淫</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/20/#L14">出 20:14</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/5/#L18">申 5:18</a>) <em>(并见 <a href="https://bibleox.com/zh-Hans/cn-cuv/lev/19/#L20">利 19:20</a>。)</em></p></blockquote><h3>8</h3><blockquote><p>“<strong><mark>不可偷盗</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/20/#L15">出 20:15</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/5/#L19">申 5:19</a>) <em>(并见 <a href="https://bibleox.com/zh-Hans/cn-cuv/lev/19/#L11">利 19:11</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/19/#L13">利 19:13</a>。)</em></p></blockquote><h3>9</h3><blockquote><p>“<strong><mark>不可作假见证陷害人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/20/#L16">出 20:16</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/5/#L20">申 5:20</a>) <em>(并见 <a href="https://bibleox.com/zh-Hans/cn-cuv/lev/19/#L11">利 19:11</a>。)</em></p></blockquote><h3>10</h3><blockquote><p>“<strong><mark>不可贪恋人的房屋</mark></strong>，<strong><mark>也不可贪恋人的妻子、仆婢、牛驴，并他一切所有的</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/20/#L17">出 20:17</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/5/#L21">申 5:21</a>) <em>(并见 <a href="https://bibleox.com/zh-Hans/cn-cuv/lev/19/#L17">利 19:17</a>。)</em></p></blockquote><h2>解释</h2><p><a href="https://bibleox.com/ru/ru/w/Z1BU_Изъяснение_десяти_заповедей">十条诫命的解释</a></p>
