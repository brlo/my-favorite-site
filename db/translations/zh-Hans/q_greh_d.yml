  title: 论断
  copy_cover: true
  body: <p>主耶稣基督禁止论断：</p><blockquote><p>“<strong><mark>你们不要论断人</mark></strong>，免得你们被论断。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/7/#L1">太 7:1</a>)</p></blockquote><blockquote><p>“<strong><mark>你们不要论断人，就不被论断</mark></strong>；<strong><mark>你们不要定人的罪，就不被定罪</mark></strong>；你们要饶恕人，就必蒙饶恕；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L37">路 6:37</a>)</p></blockquote><p>对那些自己满身更大的罪、却论断别人的人，他说：</p><blockquote><p>“你自己眼中有梁木，怎能对你弟兄说『容我去掉你眼中的刺』呢？ <strong><mark>你这假冒为善的人！先去掉自己眼中的梁木，然后才能看得清楚，去掉你弟兄眼中的刺</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/7/#L4-5">太 7:4-5</a>)</p></blockquote><p>同时，他教导要按公义的判断来判断：</p><blockquote><p>“不可按外貌断定是非，<strong><mark>总要按公平断定是非</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/7/#L24">约 7:24</a>)</p></blockquote><blockquote><p>“<strong><mark>不要作糊涂人，要明白主的旨意如何</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/5/#L17">弗 5:17</a>)</p></blockquote><blockquote><p>“<strong><mark>你们又为何不自己审量什么是合理的呢</mark></strong>？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/12/#L57">路 12:57</a>)</p></blockquote><p>使徒们说到审判的必要：</p><blockquote><p>“因为审判教外的人与我何干？<strong><mark>教内的人岂不是你们审判的吗</mark></strong>？ 至于外人，有上帝审判他们。<strong><mark>你们应当把那恶人从你们中间赶出去</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/5/#L12-13">林前 5:12-13</a>)</p></blockquote><blockquote><p>“你们中间有彼此相争的事，怎敢在不义的人面前求审，不在圣徒面前求审呢？ 岂不知圣徒要审判世界吗？若世界为你们所审，<strong><mark>难道你们不配审判这最小的事吗</mark></strong>？ &lt;…&gt; 我说这话是要叫你们羞耻。<strong><mark>难道你们中间没有一个智慧人能审断弟兄们的事吗</mark></strong>？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/6/#L1-2,5">林前 6:1-2,5</a>)</p></blockquote>
