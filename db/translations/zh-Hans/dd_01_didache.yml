    path: Dd4A_十二使徒遗训
    title: 十二使徒遗训
    title_sub: 主借着十二使徒传给万邦的教导（一世纪末至二世纪初）
    meta_desc: 《十二使徒遗训》（Διδαχὴ κυρίου διὰ τῶν δώδεκα ἀποστόλων）——现存最早的基督教教义手册之一：两条道路、洗礼、感恩祭的祷文、先知与教师的分辨、教会生活与末世的警醒。译自希腊文原文，附注释。
    menu: { parent: "训导", title: "十二使徒遗训", priority: 1, replace: "《十二使徒遗训》—— 十二使徒的教导" }
    copy_cover: true
    update: true
    body: |-
      <h2>1</h2><p>1. 有两条路：一条是生命之路，一条是死亡之路；这两条路之间，差别极大。</p><p>2. 生命之路是这样的：第一，要爱那位造了你的上帝；第二，要爱你的邻人如同自己[1]。凡你不愿意发生在自己身上的一切，也不要那样对待别人。</p><p>3. 关于这些话，教导是这样的：要祝福那些咒诅你们的人，为你们的仇敌祷告，为逼迫你们的人禁食[2]。因为若爱那些爱你们的人，有什么恩惠可言？外邦人不也是这样行的吗？你们却要爱那些恨你们的人，这样你们就没有仇敌了。</p><p>4. 要远离属肉体和属身体的私欲。有人打你的右脸，你把另一边也转给他，你就完全了。有人强逼你走一里路，你就同他走二里。有人拿你的外衣，你连里衣也给他。有人夺了你的东西，不要讨回来，因为你也无力讨回[3]。</p><p>5. 凡向你求的，都要给他，不可推辞；因为父愿意把祂自己的恩赐分给众人。按着诫命施予的人有福了，因为他是无可指责的。领受的人有祸了：人若因有需要而领受，就无可指责；若不需要却领受，就要交代为什么领受、领了作什么——他若落在拘押之中，自己所行的要受查问，直到偿还最后一个铜钱，才能出来[4]。</p><p>6. 关于这件事，也有话说：愿你的施舍在你的手掌中流汗，直到你知道该给谁[5]。</p><h2>2</h2><p>1. 训诲的第二条诫命是：</p><p>2. 不可杀人，不可奸淫，不可败坏孩童，不可行淫乱，不可偷盗，不可行邪术，不可施迷药，不可杀腹中的胎儿，也不可杀已出生的婴孩，不可贪恋属于邻人的一切[6]。</p><p>3. 不可起假誓，不可作假见证，不可恶言毁谤，不可存记仇怨。</p><p>4. 不可心怀两意，也不可一口两舌；因为两舌是死亡的网罗。</p><p>5. 你的话不可虚假，也不可空洞，却要被行为所充满。</p><p>6. 不可贪得无厌，不可抢夺，不可假冒为善，不可心怀恶意，不可骄傲自大。不可对邻人心怀诡诈的计谋。</p><p>7. 你不可恨任何人：有的人你要责备，有的人你要为他祷告，有的人你要爱他胜过爱自己的灵魂。</p><h2>3</h2><p>1. 我的孩子啊，要逃避一切的恶，以及一切与恶相似的事。</p><p>2. 不要作动怒的人，因为怒气引人走向凶杀；也不要作嫉妒的、好争吵的、暴躁的，因为这一切都生出凶杀。</p><p>3. 我的孩子啊，不要作贪恋的人，因为贪恋引人走向淫乱；也不可出言羞辱，不要眼目高傲，因为这一切都生出奸淫。</p><p>4. 我的孩子啊，不要作观鸟占兆的人，因为这是引人走向拜偶像；也不要作念咒的、占星的、行净化礼的，也不要愿意去看这些事，因为这一切都生出拜偶像[7]。</p><p>5. 我的孩子啊，不要作说谎的人，因为谎言引人走向偷盗；也不要贪财，不要贪图虚名，因为这一切都生出偷盗。</p><p>6. 我的孩子啊，不要作发怨言的人，因为怨言引人走向亵渎；也不要刚愎自用，不要心思邪恶，因为这一切都生出亵渎。</p><p>7. 却要存温柔的心，因为温柔的人必承受地土[8]。</p><p>8. 要恒久忍耐，又怜悯人，存纯良、安静、良善的心，并且常常敬畏你所听见的言语。</p><p>9. 不要抬高自己，也不要任凭自己的灵魂傲慢放肆；你的灵魂不可与高傲的人相连，却要与义人和谦卑的人相交。</p><p>10. 临到你身上的事，都要当作美善来接受，因为离开上帝，就没有一件事会发生。</p><h2>4</h2><p>1. 我的孩子啊，昼夜记念那向你讲说上帝之道的人；你要尊敬他如敬主，因为主的权柄在哪里被宣讲，主就在哪里[9]。</p><p>2. 每天都要寻求圣徒们的面，好叫你在他们的话中得安息。</p><p>3. 你不可愿意分裂，却要使争斗的人和好；要按公义判断，不可偏心责备人的过犯。</p><p>4. 你不可心怀两意，疑惑这事将来有还是没有。</p><p>5. 不要作伸手领受、缩手施予的人。</p><p>6. 你若亲手劳碌有得，就要施予，为你的罪作赎价[10]。</p><p>7. 施予时不可迟疑，施予中也不可发怨言；因为你要知道，谁是那位美善的赏赐偿还者。</p><p>8. 不可转脸不顾有需要的人，要与你的弟兄凡事有份，也不要说东西是你的：你们既然在不朽坏的事上有份，何况在必朽坏的事上呢？</p><p>9. 你不可把手从你的儿子或女儿身上挪开，却要从幼年起教导他们敬畏上帝。</p><p>10. 你在苦毒中，不可吩咐那盼望同一位上帝的奴仆或婢女，免得他们不再敬畏那在你们双方之上的上帝；因为祂来呼唤，不是看人的情面，而是圣灵预备了谁，就临到谁[11]。</p><p>11. 你们作奴仆的，要存羞耻和敬畏之心顺服你们的主人，如同顺服上帝的形像[12]。</p><p>12. 你要恨恶一切的假冒为善，以及一切不讨主喜悦的事。</p><p>13. 你绝不可丢弃主的诫命，却要守住所领受的，不加不减。</p><p>14. 你要在教会中认自己的过犯，不可带着邪恶的良心前来祷告。这就是生命之路[13]。</p><h2>5</h2><p>1. 死亡之路是这样的：首先，它是邪恶的，充满咒诅——凶杀、奸淫、贪恋、淫乱、偷盗、拜偶像、邪术、迷药、抢夺、假见证、假冒为善、心怀两意、诡诈、骄傲、恶意、刚愎、贪婪、污言、嫉妒、狂妄、高傲、虚夸。</p><p>2. 他们迫害行善的人，恨恶真理，喜爱谎言，不认识义人的报偿，不与美善相连，也不持守公义的判断，所警醒的不是善，而是恶；温柔和忍耐离他们远远而去，他们喜爱虚妄，追逐报偿，不怜悯穷人，不为受压迫的人劳苦，不认识造他们的主；他们是杀孩子的凶手，败坏上帝造物的人，转脸不顾有需要的人，压迫受苦的人，为富人的辩护人，对穷人的不法审判官，样样的罪都犯尽了的。孩子们啊，愿你们脱离这一切！</p><h2>6</h2><p>1. 你要留心，不要有人使你偏离这训诲之路，因为这样的人教训你，是撇开了上帝。</p><p>2. 你若能担得起主的整个轭，你就完全了；若担不起，就尽你所能的去行[14]。</p><p>3. 至于食物，你能担起的就担起；至于祭偶像之物，却要极其谨慎，因为这是事奉死去的神明[15]。</p><h2>7</h2><p>1. 至于洗礼，要这样施洗：先讲完上面这一切，然后奉父、子、圣灵的名，在活水里施洗[16]。</p><p>2. 你若没有活水，就在别的水里施洗；若不能在冷水中，就在温水中。</p><p>3. 两者若都没有，就奉父、子、圣灵的名，把水浇在头上三次。</p><p>4. 在受洗之前，施洗的、受洗的，以及别的能够的人都要预先禁食；受洗的人要预先禁食一两天。</p><h2>8</h2><p>1. 你们的禁食不可与假冒为善的人一同举行。他们在星期一和星期四禁食[17]，你们却要在星期三和星期五禁食。</p><p>2. 你们祷告也不要像假冒为善的人，却要照主在祂福音里所吩咐的这样祷告[18]：我们在天上的父，愿你的名被尊为圣；愿你的国降临；愿你的旨意行在地上，如同行在天上。我们日用的饮食，今日赐给我们；免我们的债，如同我们免了人的债；不叫我们遇见试探，救我们脱离那恶者。因为权柄和荣耀全是你的，直到万世。</p><p>3. 一日三次要这样祷告。</p><h2>9</h2><p>1. 至于感恩祭，要这样祝谢：</p><p>2. 先祝谢杯：我们感谢你，我们的父，为你圣仆大卫之圣葡萄树，你借着你的圣仆耶稣使它显明给我们。愿荣耀归于你，直到万世[19]。</p><p>3. 祝谢擘开的饼：我们感谢你，我们的父，为生命与知识，你借着你的圣仆耶稣使它们显明给我们。愿荣耀归于你，直到万世。</p><p>4. 正如这擘开的饼曾散落在山上，被聚集起来又成为一体，愿你的教会也从地极聚集起来，进入你的国度。因为荣耀和能力借着耶稣基督归于你，直到万世。</p><p>5. 除了奉主的名受洗的人，谁也不可吃你们的感恩祭、喝你们的杯；因为关于这件事主也说过：“不要把圣物给狗。”[20]</p><h2>10</h2><p>1. 你们吃饱之后，要这样祝谢：</p><p>2. 我们感谢你，圣洁的父，为你圣洁的名——你使它住在我们心中；也为知识、信与不朽坏，你借着你的圣仆耶稣使它们显明给我们。愿荣耀归于你，直到万世。</p><p>3. 主啊，全能者，你为自己的名创造了万有；你把饮食赐给世人享用，好叫他们感谢你；却借着你的圣仆，把属灵的粮食和属灵的饮品以及永恒的生命赏给了我们。</p><p>4. 我们首先感谢你，因为你是全能的。愿荣耀归于你，直到万世。</p><p>5. 主啊，求你记念你的教会，救她脱离一切的恶，在你的爱里使她成全，从四方之风聚集她——那已被分别为圣的——进入你为她预备的国度。因为能力和荣耀归于你，直到万世。</p><p>6. 愿恩典来临，愿这个世界过去。和散那归于大卫的上帝！凡圣洁的，让他来；不圣洁的，让他悔改。主必要来！阿们[21]。</p><p>7. 至于先知们，让他们随心所愿地献上感恩。</p><h2>11</h2><p>1. 所以，凡来把上面所说的这一切教导你们的人，要接待他；</p><p>2. 但这位教导的人若自己转向别样的教训，要拆毁前面所说的，你们就不要听他；他若为着增添公义和对主的知识而来，你们要接待他如接待主。</p><p>3. 至于使徒们和先知们，要照福音的规例这样行：</p><p>4. 凡来到你们中间的使徒，都要接待他如接待主；</p><p>5. 但他只可住一天；若有必要，再住第二天；若住三天，他就是假先知。</p><p>6. 使徒离开时，除了到宿处之前所需的饼，什么也不可领受；他若要银子，他就是假先知。</p><p>7. 凡在灵里说话的先知，你们都不可试探，也不可论断；因为一切的罪都可得赦免，惟独这个罪不得赦免[22]。</p><p>8. 但凡在灵里说话的不都是先知，唯有守着主的行事为人的才是。所以，从他们的行事为人，就能认出假先知和真先知来。</p><p>9. 凡在灵里指定摆设筵席的先知，他自己不可吃那筵席，否则他就是假先知[23]。</p><p>10. 凡教导真理的先知，若不实行自己所教导的，就是假先知。</p><p>11. 凡经过试验而真实可靠的先知，在世间的教会奥秘中行事，若不教导人学自己所行的，你们不可审判他，因为他的审判在上帝那里；因为古代的先知也曾这样行[24]。</p><p>12. 凡在灵里说“给我银子或别的东西”的，你们不要听他；他若是为其他有缺乏的人请求施予，就无人可以审判他。</p><h2>12</h2><p>1. 凡奉主的名来的，都要接待；然后你们试验了他，就会认出来，因为你们有分辨左右手的智慧。</p><p>2. 来的人若是过路的，就尽力帮助他；他在你们那里不可久留，确有必要时，也只可住两三天。</p><p>3. 他若愿意住在你们中间，而且有一门手艺，就让他做工，吃自己的饭。</p><p>4. 他若没有手艺，你们就按自己的智慧安排，好叫基督徒不至在你们中间过闲懒的生活。</p><p>5. 他若不愿意这样行，就是把基督当商品出卖的人。要提防这样的人[25]。</p><h2>13</h2><p>1. 凡愿意住在你们中间的真先知，配得他的饮食。</p><p>2. 真教师也是如此，他自己也配得他的饮食，如同工人一样[26]。</p><p>3. 所以，凡从酒榨、禾场、牛羊所得的初熟之物，你拿了之后，都要把初熟之物献给先知们，因为他们是你们的大司祭[27]。</p><p>4. 你们若没有先知，就献给穷人。</p><p>5. 你若预备了食物，就拿起初熟之物，照着诫命献上。</p><p>6. 你若开了酒坛或油坛，就拿起初熟之物，献给先知们；</p><p>7. 至于银子、衣服和一切产业，你拿了初熟之物，就照着你所看为好的，照着诫命献上。</p><h2>14</h2><p>1. 在主的日子，你们要聚集，擘饼，献上感恩，先认自己的过犯，好叫你们的祭物是纯洁的。</p><p>2. 凡与同伴争执的人，在和解之前不可来到你们中间，免得你们的祭物被玷污。</p><p>3. 因为这是主所吩咐的：“在一切地方、一切时候，向我献上纯洁的祭物。因为我是大君王，我的名在外邦中是可畏的。”[28]</p><h2>15</h2><p>1. 所以，要为你们自己按立配得上主的主教和辅祭——温柔、不贪财、真实、经过试验的男人；因为他们也是为你们服事，履行先知和教师的职事[29]。</p><p>2. 所以，你们不可轻看他们，因为他们与先知和教师一同，是你们中间受尊荣的人。</p><p>3. 你们要彼此劝诫，却不可在怒气中，而要在平安里，正如你们在福音里所领受的；对任何得罪了别人的人，谁都不要与他说话，你们也不要听他，直到他悔改。</p><p>4. 你们的祷告、施舍和一切善行，都要照你们在我们主的福音里所领受的去行。</p><h2>16</h2><p>1. 要为你们的生命警醒；你们的灯不可熄灭，你们的腰不可松懈，却要预备好，因为你们不知道我们主来的时辰[30]。</p><p>2. 要常常聚集，寻求那关乎你们灵魂的事；因为你们信仰的全部时间，若不在末后的时刻得以成全，就对你们没有益处。</p><p>3. 因为在末后的日子里，假先知和败坏人的必增多，羊要变成狼，爱要变成恨[31]。</p><p>4. 因为不法的事增多，人要彼此恨恶，彼此逼迫，彼此交出；那时迷惑世界的人要显现，如同上帝的儿子，行神迹奇事，地要被交在他手中，他要行自创世以来从未行过的无法之事[32]。</p><p>5. 那时，受造的人要进入试炼之火；许多人要跌倒而灭亡，那些在信心中坚持到底的，必蒙拯救，脱离那咒诅。</p><p>6. 那时，真理的记号要显现：首先是天上展开的记号，然后是号声的记号，第三是死人的复活[33]。</p><p>7. 但不是所有的人，而是如所记的：“主要降临，众圣者同来。”[34]</p><p>8. 那时，世界要看见主驾着天上的云降临[35]。</p>
    references: |-
      <ol><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/19/#L18">利 19:18</a>（“爱人如己”）、<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/22/#L37-40">太 22:37-40</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L44">太 5:44</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L28">路 6:28</a>。这一段（两重爱的诫命、金律的反向表述、爱仇敌）综合了登山宝训的传统。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L39-41">太 5:39-41</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L29">路 6:29</a>。“拿你的外衣，连里衣也给他”与<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L29">路 6:29</a>措辞一致；<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L40">太 5:40</a>语序相反（“要拿你的里衣，连外衣也由他拿去”）。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L42">太 5:42</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L30">路 6:30</a>。“偿还最后一个铜钱”：参见<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L26">太 5:26</a>。</p></li><li><p>这句箴言不见于圣经正典，出自《两条道路》的文本传统；<a href="https://bibleox.com/zh-Hans/zh-Hans/w/4zaL_瓦尔纳瓦书">《巴拿巴书》</a>（二世纪，本站有中文译本）的第19章中有几乎同一句话。</p></li><li><p>十诫的部分参见<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/5/#L17-21">申 5:17-21</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/20/#L13-17">出 20:13-17</a>。“不可败坏孩童”“不可施迷药”“不可杀腹中的胎儿”——训诲在十诫之外增补的禁令；“不可杀胎儿、不可杀婴孩”是对堕胎与杀婴最早的明确禁止之一。</p></li><li><p>观鸟占兆（οἰωνοσκόπος）、念咒（ἐπαοιδός）、占星（μαθηματικός）、行净化礼（περικαθαίρων）——当时异教世界流行的占卜与洁净仪式。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/37/#L11">诗 37:11</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L5">太 5:5</a>。</p></li><li><p>“主的权柄在哪里被宣讲，主就在哪里”——论及教会中宣讲上帝之道的先知与教师，他们如同代表主。</p></li><li><p>“为你的罪作赎价”：参见<a href="https://bibleox.com/zh-Hans/cn-sb/tov/12/#L9">多 12:9</a>（“施舍救人脱免死亡，且涤除一切罪恶”）、<a href="https://bibleox.com/zh-Hans/cn-sb/tov/4/#L10">多 4:10</a>。此句出自次经《多俾亚传》，和合本没有收录次经；又见<a href="https://bibleox.com/zh-Hans/cn-cuv/dan/4/#L27">但 4:27</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/6/#L9">弗 6:9</a>：“不要威吓他们，因为知道他们和你们同有一位主在天上，他并不偏待人。”</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/6/#L5">弗 6:5</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/2/#L18">彼前 2:18</a>。“如同顺服上帝的形像”——把主人的形像比作上帝的形像，是本训著名的措辞。</p></li><li><p>生命之路的教导到此结束（第1–4章）。</p></li><li><p>“主的轭”：参见<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/11/#L29-30">太 11:29-30</a>。学者通常认为“主的整个轭”指完全遵守律法的义；而“尽你所能的去行”则对应教会对外邦人的最低要求（参见<a href="https://bibleox.com/zh-Hans/cn-cuv/act/15/#L28-29">徒 15:28-29</a>）。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/act/15/#L29">徒 15:29</a>（耶路撒冷会议决议：“禁戒祭偶像的物”）、<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/10/#L19-28">林前 10:19-28</a>。</p></li><li><p>“奉父、子、圣灵的名”：参见<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/28/#L19">太 28:19</a>。“活水”——流动的泉水、河水，与死水相对。</p></li><li><p>“假冒为善的人”指犹太人：星期一和星期四是犹太教的常规禁食日。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/6/#L9-13">太 6:9-13</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/11/#L2-4">路 11:2-4</a>。即主祷文。各项祈求的字句与和合本略有出入（如“愿你的名被尊为圣”，和合本作“愿人都尊你的名为圣”），均按遗训自身的文本译出。末句颂荣（“因为权柄和荣耀全是你的”）在许多新约抄本中没有，和合本把它注在括号里（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/6/#L13">太 6:13</a>〔有古卷无……〕）；《十二使徒遗训》是这一颂荣最早的见证之一。</p></li><li><p>“圣仆”（παῖς）：训诲把大卫和耶稣都称为上帝的“圣仆”——参见<a href="https://bibleox.com/zh-Hans/cn-cuv/act/4/#L25">徒 4:25</a>（“你仆人我们祖宗大卫”）、<a href="https://bibleox.com/zh-Hans/cn-cuv/act/4/#L27">徒 4:27</a>（“你所膏的圣仆耶稣”）。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/7/#L6">太 7:6</a>。古代教会由此规定：感恩祭只向受洗者开放。</p></li><li><p>“和散那”：参见<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/21/#L9">太 21:9</a>。“主必要来”原文是亚兰语 Μαρὰν ἀθά（Maranatha，“我们的主，来吧”），参见<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/16/#L22">林前 16:22</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/12/#L31-32">太 12:31-32</a>（亵渎圣灵的罪总不得赦免）。试探在灵里说话的先知，就是试探上帝的灵。</p></li><li><p>这一条难以确解：真先知若“在灵里”指定摆设（圣餐）筵席，他自己不可吃，因为先知宣告的筵席属于教会，而不属于他个人的肚腹；吃它就是假先知的记号。</p></li><li><p>“在世间的教会奥秘中行事”——希腊文 μυστήριον κοσμικὸν ἐκκλησίας，文意难解；一般认为指真先知在世上（世界之中）行事，彰显教会（圣餐）的奥秘：他不教导人学自己所行，因为这是上帝在他身上直接成就的事。</p></li><li><p>希腊文 χριστέμπορος，字面意思“贩卖基督的人”——以基督之名牟利的人。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/10/#L10">太 10:10</a>（“工人得饮食是应当的”）、<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/10/#L7">路 10:7</a>。</p></li><li><p>先知们被称为“你们的大司祭”：教会向先知献上初熟之物，如同以色列向祭司献上。希腊文 ἀρχιερεῖς 即“大司祭”（此处指教会的先知，与第15章按立的主教并读）。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/mal/1/#L11">玛 1:11</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/mal/1/#L14">玛 1:14</a>。训诲把玛拉基书的预言（在外邦中随处献洁净的祭）直接应用在教会的感恩祭上。</p></li><li><p>“按立”（χειροτονία）——以按手拣选圣职：参见<a href="https://bibleox.com/zh-Hans/cn-cuv/act/6/#L6">徒 6:6</a>（辅祭）、<a href="https://bibleox.com/zh-Hans/cn-cuv/act/14/#L23">徒 14:23</a>（长老）。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/12/#L35">路 12:35</a>（“你们腰里要束上带，灯也要点着”）、<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/24/#L42">太 24:42</a>。俄文旧译此处作“腰不束带”，是误译：希腊文 μὴ ἐκλυέσθωσαν 意为“不可松懈（要束好）”。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/24/#L11-12">太 24:11-12</a>（“好些假先知起来……许多人的爱心才渐渐冷淡了”）。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/24/#L24">太 24:24</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/2sol/2/#L3-4">帖后 2:3-4</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/24/#L30-31">太 24:30-31</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/15/#L52">林前 15:52</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/zah/14/#L5">亚 14:5</a>（“耶和华我的上帝必降临，有一切圣者同来”）。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/26/#L64">太 26:64</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/1/#L7">启 1:7</a>。</p></li></ol>
      <p>翻译：罗季翁·弗拉索夫（借助人工智能工具）。底本：希腊文原文（<a href="https://bibleox.com/zh-Hans/grc/w/ΔΙΔΑΧΗ">本站的希腊文版本</a>，据 Kirsopp Lake 校勘本；现存唯一的完整抄本为耶路撒冷圣墓抄本 54 号（1056年），1873年由布里延诺夫发现、1883年刊布）。参考：俄文译本（《莫斯科牧首杂志》1975年第11期）、英文译本（Roberts–Donaldson）。圣经链接指向本站的和合本（上帝版），次经出处指向思高本。翻译原则：段落编号依希腊文原文的章–段划分，便于引用；作者引述圣经时按其自身文本的字句译出，与和合本措辞不同处在注中说明并附链接；术语沿用本站中文译本的传统（感恩祭、圣体血、主教、辅祭、大司祭、上帝）；俄文旧译第16章“腰不束带”为误译，此处按希腊文改正（见注）。</p>
