  path: QS11A_污言秽语
  title: 污言秽语（谩骂）
  copy_cover: true
  body: <h2>污言秽语（谩骂）是罪</h2><blockquote><p>“<strong><mark>污秽的言语，一句不可出口</mark></strong>，只要随事说造就人的好话，叫听见的人得益处。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/4/#L29">弗 4:29</a>)</p></blockquote><blockquote><p>“至于淫乱并一切污秽，或是贪婪，在你们中间连提都不可，方合圣徒的体统。 <strong><mark>淫词、妄语和戏笑的话都不相宜</mark></strong>，总要说感谢的话。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/5/#L3-4">弗 5:3-4</a>)</p></blockquote><blockquote><p>“但现在你们要弃绝这一切的事，以及恼恨、忿怒、恶毒、毁谤，并<strong><mark>口中污秽的言语</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/3/#L8">西 3:8</a>)</p></blockquote><blockquote><p>“<strong><mark>不以恶报恶、以辱骂还辱骂，倒要祝福</mark></strong>；因你们是为此蒙召，好叫你们承受福气。 因为经上说：『人若爱生命，愿享美福，<strong><mark>须要禁止舌头不出恶言</mark></strong>，嘴唇不说诡诈的话；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/3/#L9-10">彼前 3:9-10</a>)</p></blockquote><blockquote><p>“管住舌头的人必享平安；恨恶仓促的人必不至有罪。” (<a href="https://bibleox.com/zh-Hans/ru/prsir/19/#L6">德 19:6</a>, 俄文原文无中文经文，此处自译) <em>(俄文本为 Сир 19:6（思高本无此节）。)</em></p></blockquote><blockquote><p>“<strong><mark>惟独舌头没有人能制伏，是不止息的恶物，满了害死人的毒气</mark></strong>。 我们用舌头颂赞那为主、为父的，又用舌头咒诅那照着上帝形像被造的人。 <strong><mark>颂赞和咒诅从一个口里出来，我的弟兄们，这是不应当的</mark></strong>。 泉源从一个眼里能发出甜苦两样的水吗？ &lt;…&gt; <strong><mark>你们中间谁是有智慧、有见识的呢？他就当在智慧的温柔上显出他的善行来</mark></strong>。 你们心里若怀着苦毒的嫉妒和纷争，就不可自夸，也不可说谎话抵挡真道。 这样的智慧不是从上头来的，乃是属地的，属情欲的、属鬼魔的。 在何处有嫉妒纷争，就在何处有扰乱和各样的坏事。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/3/#L8-11,13-16">雅 3:8-11,13-16</a>)</p></blockquote><h2>骂人话的问题在哪里</h2><p>骂人话（攻击性词汇）的问题在于：说话的人想显得、并自以为是恶的、有攻击性的、危险的、厉害的。恶的词汇只是达到这一目的的方式之一。人们还会加上恶的情绪、眼神、手势、衣着、纹身、习惯和其他一切自我表达的方式。但让我们回到话语本身。</p><p>话语由声音构成。声音的组合本身没有任何意义：它既不坏也不好。比如说，我们造一个词「阿木萨达尔」。「阿木萨达尔」暂时没有任何意义，因此既不算坏也不算好。但当社会中给某个词赋予了含义，人就会根据场合、根据他在这种场合想成为什么样的人，来选择带有不同含义的词。当人想显得有礼貌、有教养时，他使用有礼貌的词汇，即那些带有令人愉快的含义、表明我们和平的心态、谦卑、殷勤或类似品质的词。然而，当人想显得厉害、危险、恶毒或有攻击性时，他就转而使用攻击性的词汇，即那些带有攻击性、粗俗和其他负面含义的词，这些词立刻会表明：这样的人没有任何教养，也没有使他克制恶行的情绪——他想让周围的人觉得他是个危险、恶毒、有攻击性、狂躁、不安分的人，而这里没有任何好的东西。</p><p>此外，当人习惯于这种恶的状态时，就会对它产生依赖，如同对吸烟、饮酒的依赖，也如同对任何罪的恶习的依赖。结果，他会采取种种行动使自己进入这种恶的状态、在内心培养它：甚至独处时也骂人，听恶的音乐，用阴郁的符号填充自己和周围的空间。也就是说，这一切都是向恶的状态的运动，是在自己心里培养恶意的状态、愤怒的情欲，而主耶稣基督却教导我们：</p><blockquote><p>“只是我告诉你们：<strong><mark>凡向弟兄动怒的</mark></strong>，难免受审判〔有古卷在『凡』字下添『无缘无故的』五字』〕。<strong><mark>凡骂弟兄是拉加的</mark></strong>，难免公会的审断；<strong><mark>凡骂弟兄是魔利的</mark></strong>，难免地狱的火。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L22">太 5:22</a>) <em>(「拉加」是侮辱人的称呼。)</em></p></blockquote><blockquote><p>“<strong><mark>温柔的人有福了，因为他们必承受地土</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L5">太 5:5</a>)</p></blockquote><p>使徒也说：</p><blockquote><p>“<strong><mark>一切苦毒、恼恨、忿怒，嚷闹、毁谤，并一切的恶毒，都当从你们中间除掉</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/4/#L31">弗 4:31</a>)</p></blockquote><p>先知也说：</p><blockquote><p>“<strong><mark>当止住怒气，离弃忿怒</mark></strong>；不要心怀不平，以致作恶。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/37/#L8">诗 37:8</a>)</p></blockquote><p>这里也应当说到愚蠢的玩笑：</p><blockquote><p>“淫词、妄语和<strong><mark>戏笑的话都不相宜，总要说感谢的话</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/5/#L4">弗 5:4</a>)</p></blockquote><blockquote><p>“你们饱足的人有祸了，因为你们将要饥饿！<strong><mark>你们喜笑的人有祸了，因为你们将要哀恸哭泣</mark></strong>！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L25">路 6:25</a>)</p></blockquote>
