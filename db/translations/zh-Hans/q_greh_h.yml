- src: Злословие
  path: QS12A_毁谤
  title: 毁谤（辱骂）
  copy_cover: true
  body: <h2>毁谤（辱骂）</h2><blockquote><p>“<strong><mark>你口任说恶言，你舌编造诡诈</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/50/#L19">诗 50:19</a>) <em>(俄文本编号为 Пс 49:19（圣咏编号相差一）。)</em></p></blockquote><blockquote><p>“他们的喉咙是敞开的坟墓；他们用舌头弄诡诈。嘴唇里有虺蛇的毒气。 <strong><mark>满口是咒骂苦毒</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/3/#L13-14">罗 3:13-14</a>)</p></blockquote><blockquote><p>“<strong><mark>不要毁谤</mark></strong>，不要争竞，总要和平，向众人大显温柔。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/tit/3/#L2">多 3:2</a>)</p></blockquote><blockquote><p>“<strong><mark>他被骂不还口</mark></strong>．受害不说威吓的话，只将自己交托那按公义审判人的主。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/2/#L23">彼前 2:23</a>)</p></blockquote><blockquote><p>“所以，<strong><mark>你们既除去一切的恶毒、诡诈并假善、嫉妒和一切毁谤的话</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/2/#L1">彼前 2:1</a>)</p></blockquote><blockquote><p>“但现在你们要弃绝这一切的事，以及恼恨、忿怒、<strong><mark>恶毒、毁谤</mark></strong>，并口中污秽的言语。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/3/#L8">西 3:8</a>)</p></blockquote><h3>辱骂上帝</h3><blockquote><p>“这以色列妇人的儿子亵渎了圣名，并且咒诅，就有人把他送到摩西那里。（他母亲名叫示罗密，是但支派底伯利的女儿。） &lt;…&gt; 你要晓谕以色列人说：『<strong><mark>凡咒诅上帝的，必担当他的罪</mark></strong>。 <strong><mark>那亵渎耶和华名的，必被治死</mark></strong>，全会众总要用石头打死他。不管是寄居的是本地人，他亵渎耶和华名的时候，必被治死。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/24/#L11,15-16">利 24:11,15-16</a>)</p></blockquote><h3>辱骂父母</h3><blockquote><p>“<strong><mark>咒骂父母的，必要把他治死</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/21/#L17">出 21:17</a>)</p></blockquote><blockquote><p>“『<strong><mark>轻慢父母的，必受咒诅</mark></strong>。』百姓都要说：『阿们！』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/27/#L16">申 27:16</a>)</p></blockquote><blockquote><p>“<strong><mark>咒骂父母的，他的灯必灭，变为漆黑的黑暗</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/20/#L20">箴 20:20</a>)</p></blockquote><h3>辱骂近人</h3><blockquote><p>“<strong><mark>弟兄们，你们不可彼此批评</mark></strong>。人若批评弟兄，论断弟兄，就是批评律法，论断律法。你若论断律法，就不是遵行律法，乃是判断人的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/4/#L11">雅 4:11</a>)</p></blockquote><h3>辱骂政权和官长</h3><blockquote><p>“<strong><mark>不可毁谤上帝，也不可毁谤你百姓的官长</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/22/#L28">出 22:28</a>)</p></blockquote><blockquote><p>“这些作梦的人也像他们污秽身体，<strong><mark>轻慢主治的，毁谤在尊位的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iud/1/#L8">犹 1:8</a>)</p></blockquote><blockquote><p>“那些随肉身纵污秽的情欲、轻慢主治之人的，更是如此。<strong><mark>他们胆大任性，毁谤在尊位的也不知惧怕</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2pet/2/#L10">彼后 2:10</a>)</p></blockquote>
