    title: 士每拿的坡旅甲，一至二世纪
    title_sub: 殉道者（约69–155年），士每拿的主教，使徒约翰的门徒
    meta_desc: 士每拿的圣坡旅甲（约69–155年）——使徒约翰的门徒、里昂的爱任纽的老师——的生平、《致腓立比人书》与《坡旅甲殉道记》，以及这些文献所见证的古代教会的信仰。
    menu: { parent: "一世纪", title: "士每拿的坡旅甲，主教，殉道者（约69–155年）", priority: 10, replace: "波利卡普，士每拿的圣殉道者（69-155年）" }
    copy_cover: true
