      <p>翻译原则：本页译自本站的俄文页面。坡旅甲著作的引文一律改从本站中文译本（据希腊文原文），爱任纽与尤西比乌的引文译自希腊文原文，并与俄文译本对照；引文链接由俄文页面的行号（#L）改按章节指向本站中文译本的相应章节。译名沿用伊格那丢书信中文译本的传统：坡旅甲、伊格那丢、爱任纽、尤西比乌、士每拿、弗吕家等取和合本形式；罗马主教阿尼塞图斯（Anicetus）按音译。俄文页面的斯拉夫语颂歌按意义译为中文。引文的着重号（粗体、色标）沿用俄文页面的标示。</p><p>翻译：罗季翁·弗拉索夫（借助人工智能工具）。</p>
