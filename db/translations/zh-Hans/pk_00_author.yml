    body: |-
      <p>阅读坡旅甲著作的希腊文原文，请点<a href="https://bibleox.com/zh-Hans/grc/w/Πολύκαρπος_Σμύρνης">这里</a>。在著作目录上方也可以切换到其他语言。</p><p><strong>纪念日</strong>：2月23日（新历3月8日）</p><p>他是使徒兼福音书作者约翰的门徒，“使徒时代的教父”之一；是属灵的导师，捍卫信仰纯正、抵御异端的卫士。他的门徒中有里昂的爱任纽（<a href="https://bibleox.com/zh-Hans/en/w/Irenaeus_of_Lyon">英文页面</a>），后来的殉道司祭。</p><h2>生平</h2><p>圣坡旅甲生于一世纪下半叶，是使徒约翰的门徒。他幼年失去双亲，由一位名叫卡利斯塔的基督徒妇女收养。她死后，他把全部家产分给穷人，开始过严格的生活。坡旅甲成为士每拿的主教后，对抗诺斯替主义，是小亚细亚最受尊敬的神学家。</p><p>有许多门徒跟随他，其中有里昂的爱任纽；爱任纽后来定居西方，把坡旅甲的神学传到高卢和意大利。爱任纽这样写到坡旅甲：</p><blockquote><p>坡旅甲不仅<strong>受教于使徒</strong>，与许多见过主的人交往，还被使徒设立为亚细亚士每拿教会的主教；我们在年少时也见过他——因为他在世长久，以极其荣耀、极其著名的殉道，在高龄中离世。他所<strong>教导的，始终是他从使徒所学的，也就是教会所传的</strong>，唯有这些才是真实的。亚细亚一切的教会，以及直到如今继承坡旅甲的人，都为这些事作见证——与华伦提努、马吉安和其余心怀恶意的人相比，他是远为可信、远为可靠之真理的见证人。他也曾在阿尼塞图斯任主教时来到罗马，使许多人从上述异端中回转，归向上帝的教会，宣讲他所从使徒领受的唯一真理，也就是教会所传的真理。</p></blockquote><p>（<a href="https://bibleox.com/zh-Hans/en/w/irenaeus-against-heresies-b3#HH-3">爱任纽《驳异端》第三卷，第3章（英文）</a>）</p><p>圣坡旅甲也收到过<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4A_安提阿的伊格那丢一世纪">伊格那丢</a>写给他的<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4P_致坡旅甲书">一封书信</a>。坡旅甲本人传世的著作只有<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Pk4F_致腓立比人书">《致腓立比人书》</a>。二世纪时，殉道者爱任纽这样写到这封书信：</p><blockquote><p>此外，坡旅甲还有一封写给腓立比人的书信，写得非常充实；凡愿意的人、凡关心自己得救的人，都能从这封信认识他的信仰的特质和真理的宣讲。同样，以弗所的教会——由保罗所建立，约翰一直住在他们中间，直到图拉真的时代——是使徒传统的真实见证人。</p></blockquote><p>（<a href="https://bibleox.com/zh-Hans/en/w/irenaeus-against-heresies-b3#HH-3">爱任纽《驳异端》第三卷，第3章（英文）</a>）</p><p>坡旅甲也参加过与罗马主教阿尼塞图斯关于复活节日期的争论：小亚细亚的教会按尼散月十四日守复活节，罗马教会则在其后的第一个主日守。争论没有得出一致结论，但这并没有妨碍两位主教以弟兄之情分别。他在八十六岁那年被捕，因拒绝背弃基督而被活活烧死。士每拿教会在<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Pk4M_坡旅甲殉道记">《坡旅甲殉道记》</a>中详细记述了他的殉道。</p><p>书中也记下了坡旅甲的话，说自己事奉基督已经八十六年：</p><blockquote><p>“总督再三催逼他，说：‘起誓吧，我就释放你；咒诅基督。’坡旅甲回答：‘<strong><mark>我已经事奉祂八十六年</mark></strong>，祂没有亏待过我分毫；我怎能毁谤我的王、那位拯救我的？’”（<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Pk4M_坡旅甲殉道记#HH-9">《坡旅甲殉道记》9:3</a>）</p></blockquote><p>该撒利亚的尤西比乌（约258–339年）写到坡旅甲，提到并引用他的《致腓立比人书》：</p><blockquote><p>那时，在亚细亚特别著名的，是<strong>坡旅甲——使徒们的门徒</strong>；见过主并事奉过主的那些人，把他设立为士每拿教会的主教。</p><p>&lt;…&gt;</p><p>13. 坡旅甲在<strong>《致腓立比人书》</strong>中也记念了这些人。我们把他自己的话引述如下：“所以，我劝你们众人顺服义的道，操练各样的忍耐——这是你们亲眼在配受称颂的伊格那丢、琐西谟、鲁孚身上，也在你们中间其他的人身上，更在保罗本人和其余的使徒身上看见过的；要确信：他们这一切人都不是徒然奔跑，乃是存着信与义奔跑，如今他们在主那里，已经得了他们当得的位置，正如他们曾与祂一同受苦一样。因为他们所爱的，不是这个现今的世代，而是那位为他们死、又为他们被上帝使祂复活的主。”<strong>接着他又写道：</strong></p><p>14. “你们和伊格那丢都写信给我，说如果有人往叙利亚去，也要把你们的信带去；我或者自己，或者派一个使者去，也会为你们这样行，只要我找到合适的机会。</p><p>15. 伊格那丢寄给我们的书信，以及我们手中其他的书信，我们已经照你们的吩咐寄给你们了；它们附在这封信的后面，你们可以从中得到极大的益处，因为其中有信仰、有忍耐，还有一切与我们主相称的造就。至于伊格那丢本人和与他同行的人，你们若得知更确实的消息，请告诉我们。”</p></blockquote><p>（<a href="https://bibleox.com/zh-Hans/en/w/eusebius-the-church-history-3#HH-Ignatius-and-His-Epistles">尤西比乌《教会史》第3卷第36章（英文）</a>）</p><h2>颂歌</h2><p>赞歌（特洛帕里翁），第四调式：</p><blockquote><p>你效法使徒的行仪，继承他们的宝座；受上帝感动的你，在德行中找到了升向异象之路。因此，你端正地宣讲真理之道，并为信仰流血受难。殉道司祭坡旅甲，求基督上帝拯救我们的灵魂。</p></blockquote><p>圣颂（孔塔基翁），第一调式：</p><blockquote><p>明慧的坡旅甲，你把言语的果子献给主，作为德行的祭献；因此你蒙上帝称许，作为主教得了荣耀。今天，我们因你的言语得蒙光照，歌颂你可称颂的纪念，荣耀主。</p></blockquote><h2>信仰</h2><h3>得救需要行为</h3><p>圣坡旅甲继使徒保罗之后（参见<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/2/#L8-9">弗 2:8-9</a>）对教会说，我们得救是本乎恩，不是出于行为；也就是说，救恩之门是借着主耶稣基督的十字架牺牲和祂的复活白白向人打开的，不是我们的行为赚来的。但人要走上这条白白开启的路——要努力去行。所以，凡不遵行上帝的旨意、不按诫命而行的人不能得救；他们不会进入生命的复活，而要被定罪受永恒的苦刑：</p><blockquote><p>“你们虽然没有见过祂，却信祂，就有说不出来、满有荣光的大喜乐——许多人渴望进入这喜乐——你们知道，你们<strong><mark>得救是本乎恩，并不是出于行为</mark></strong>，乃是出于上帝的旨意，借着耶稣基督。”（<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Pk4F_致腓立比人书#HH-1">《致腓立比人书》1:3</a>）</p></blockquote><blockquote><p>“使祂从死里复活的那一位，<strong><mark>也必使我们复活，只要我们遵行祂的旨意</mark></strong>，<strong><mark>行在祂的诫命中</mark></strong>，爱祂所爱的：远离一切的不义、贪心、贪财、毁谤、作假见证；不以恶报恶，不以辱骂还辱骂，不以拳还拳，不以咒骂还咒骂；又要记念主教导的话：‘你们不要论断人，免得你们被论断。你们要饶恕人，就必蒙饶恕；你们要怜悯人，就必蒙怜悯。你们用什么量器量给人，也必用什么量器量给你们。贫穷的人和为义受逼迫的人是有福的，因为上帝的国是他们的。’”（<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Pk4F_致腓立比人书#HH-2">《致腓立比人书》2:2-3</a>）</p></blockquote><blockquote><p>“所以，既然知道上帝是不可轻慢的，我们就应当行事为人配得祂的诫命和荣耀。同样，辅祭也当在祂面前，在义上无可指摘，作上帝和基督的仆人，而不是人的仆人：不毁谤人，不一口两舌，不贪财，凡事节制，仁慈，殷勤，<strong><mark>行在主的真理中</mark></strong>——祂自己成了众人的仆人。<strong><mark>我们若在今世讨祂喜悦，就必得着那将来的</mark></strong>，正如祂应许要使我们从死里复活；<strong><mark>如果我们行事为人配得祂，并且确实相信，就必与祂一同作王</mark></strong>。同样，年幼的也当在一切事上无可指摘，首先顾念圣洁，勒住自己脱离各样的恶。”（<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Pk4F_致腓立比人书#HH-5">《致腓立比人书》5:1-3</a>）</p></blockquote><h3>按照圣传解释圣经</h3><blockquote><p>“凡不认十字架的见证的，就是出于魔鬼的；凡<strong><mark>按自己的私欲歪曲主的言语</mark></strong>、又说没有复活也没有审判的，<strong><mark>这人就是撒但的长子</mark></strong>。所以，让我们抛弃众人的虚妄和虚假的教训，<strong><mark>回转到那从起初传给我们的道上</mark></strong>”（<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Pk4F_致腓立比人书#HH-7">《致腓立比人书》7:1-2</a>）</p></blockquote><h3>顺服圣职人员</h3><blockquote><p>“所以，必须远离这一切，<strong><mark>顺服司祭们和辅祭们，如同顺服上帝和基督</mark></strong>；童女们则当以无可指摘、纯洁的良心行事为人。”（<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Pk4F_致腓立比人书#HH-5">《致腓立比人书》5:3</a>）</p></blockquote><h3>已死的圣徒如今与基督一同活在天上</h3><blockquote><p>“他借着忍耐制服了那不义的统治者，就这样领受了不朽坏的冠冕，如今<strong><mark>与众使徒和众义人一同欢欣，荣耀全能的上帝我们的父</mark></strong>，称颂我们的主耶稣基督——我们灵魂的救主、我们身体的治理者、普天下大公教会的牧者。</p><p>&lt;…&gt;</p><p>弟兄们，我们愿你们靠着那合乎福音的主耶稣基督之道刚强站立；愿荣耀借着祂归于上帝我们的父和圣灵，为拯救蒙拣选的众圣徒，正如配受称颂的坡旅甲所见证的；<strong><mark>愿我们在耶稣基督的国里，蒙恩循着他的脚踪被寻见</mark></strong>。”（<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Pk4M_坡旅甲殉道记#HH-19">《殉道记》19:2</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Pk4M_坡旅甲殉道记#HH-22">22:1</a>）</p></blockquote><h3>基督将要来临，审判活人死人</h3><blockquote><p>“所以，要束上你们的腰，存着敬畏与真实事奉上帝，抛弃虚妄的空谈和众人的迷惑，信靠那位使我们的主耶稣基督从死里复活、又赐给祂荣耀和宝座、立祂在自己右边的：天上和地上的一切都服在祂之下，一切有气息的都事奉祂；<strong><mark>祂要来审判活人死人</mark></strong>，上帝必向不信从祂的人追讨祂的血。”（<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Pk4F_致腓立比人书#HH-2">《致腓立比人书》2:1</a>）</p></blockquote><h3>人人都要受审判</h3><blockquote><p>“我们既然求主饶恕我们，也应当饶恕别人；因为我们都在主和上帝的眼目面前，<strong><mark>人人都必须站在基督的审判台前，各人为自己向祂交代</mark></strong>。”（<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Pk4F_致腓立比人书#HH-6">《致腓立比人书》6:2</a>）</p></blockquote><h3>永恒的刑罚</h3><blockquote><p>“总督又对他说：“你不怕野兽，我就叫你被火烧掉，除非你悔改。”坡旅甲说：“你用火威胁我：那火烧一个钟头就熄了；你却不知道<strong><mark>那为将来审判和永恒刑罚预备的火</mark></strong>，要临到不敬虔的人。还犹豫什么？想做什么就做吧。””（<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Pk4M_坡旅甲殉道记#HH-11">《殉道记》11:2</a>）</p></blockquote><h3>远离引人走迷的人</h3><blockquote><p>“要热心于美善的事，远离绊脚石、假弟兄，以及那些假冒为善地带着主的名、<strong><mark>把虚空的人引入迷途</mark></strong>的人。”（<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Pk4F_致腓立比人书#HH-6">《致腓立比人书》6:3</a>）</p></blockquote><h3>禁食</h3><blockquote><p>“所以，让我们抛弃众人的虚妄和虚假的教训，回转到那从起初传给我们的道上；在祷告中警醒，<strong><mark>恒切禁食</mark></strong>，恳求那鉴察万有的上帝不叫我们遇见试探，正如主所说的：“心灵固然愿意，肉体却软弱了。””（<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Pk4F_致腓立比人书#HH-7">《致腓立比人书》7:2</a>）</p></blockquote><h3>为掌权者祷告</h3><blockquote><p>“要为众圣徒祷告。<strong><mark>也要为君王、掌权者和首领祷告</mark></strong>，甚至为逼迫你们、恨你们的人和十字架的仇敌祷告，好叫你们的果子在众人面前显明出来，叫你们在祂里面得以完全。”（<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Pk4F_致腓立比人书#HH-12">《致腓立比人书》12:3</a>）</p></blockquote><h3>信徒敬重坡旅甲</h3><blockquote><p>“当柴堆预备好的时候，坡旅甲脱去身上所有的衣服，解下腰带，又试着脱下便鞋——这是他自己以前从不做的；因为每位信徒总是争先恐后，<strong><mark>想赶快摸一摸他的身体</mark></strong>。由于他美善的品行，<strong><mark>早在殉道之前，他就已备受尊崇</mark></strong>。”（<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Pk4M_坡旅甲殉道记#HH-13">《殉道记》13:2</a>）</p></blockquote><h3>信徒敬礼坡旅甲的圣髑</h3><blockquote><p><em>“但那嫉妒者、毁谤者，那与义人之族为敌的恶者，看见了他殉道的伟大，看见了他从起初就无可指摘的品行，看见他戴上了不朽坏的冠冕、领受了无可辩驳的奖赏，就设法<strong><mark>使我们连他的身体也不能拿去</mark></strong>，虽然许多人愿意这样做、并愿意与他的圣洁肉身有份。他就唆使希律的父亲尼基塔——阿尔基的兄弟——去求官长，不要把尸体交出来，免得，如他所说，‘我们离弃了那位被钉十字架的，反倒去敬拜这一位’。这些话是在犹太人的唆使和怂恿下说的，他们窥伺着我们，看我们要从火中取他的身体，却不明白：<strong><mark>我们永远不能离弃基督</mark></strong>——祂为拯救世上一切得救的人而受难，为罪人成了无瑕疵的祭——<strong><mark>也永远不能敬拜任何别人</mark></strong>。<strong><mark>因为我们敬拜祂，祂是上帝的儿子</mark></strong>；至于殉道者，我们是作为主的门徒和效法者而恰当地爱他们，因他们对他们自己的君王和师傅的无比忠诚。愿上帝使我们也能成为他们的同伴和同学！那百夫长看见犹太人的纷争，就把尸体摆在中间——照他们的惯例——烧化了。这样，我们后来<strong><mark>收殓了他的遗骨，比贵重的宝石更珍贵、比精金更纯净</mark></strong>，安放在合宜的地方。在那里，主必赐恩，叫我们——凡能聚集的——在欢欣和喜乐中，<strong><mark>庆祝他那殉道的日子</mark></strong>，作为他出生（于永生）的纪念日：既记念在我们以前争战的，又为将来的人预备操练和准备。这些就是配受称颂的坡旅甲的事迹。他与非拉铁非的信徒一同殉道，<strong><mark>是士每拿的第十二位殉道者</mark></strong>，但人人都特别记念他，连外邦人也处处谈论他：他不仅是著名的教师，又是卓越的殉道者，他的殉道是照着基督的福音成就的，<strong><mark>人人都愿意效法</mark></strong>。”</em></p><p>（<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Pk4M_坡旅甲殉道记#HH-17">《殉道记》第17–19章</a>）</p></blockquote>
