      <ol><li><p>作者在此直接称基督为上帝（ὡς περὶ θεοῦ）与活人死人的审判者。</p></li><li><p>引自<a href="https://bibleox.com/zh-Hans/cn-cuv/is/54/#L1">赛 54:1</a>（七十士译本；参见<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/4/#L27">加 4:27</a>）。和合本：“你这不怀孕、不生养的要歌唱！你这未曾经过产难的要发声歌唱，扬声欢呼！”</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/9/#L13">太 9:13</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/2/#L17">可 2:17</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/5/#L32">路 5:32</a>：“我来本不是召义人，乃是召罪人。”</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/10/#L32">太 10:32</a>：“凡在人面前认我的，我在我天上的父面前也必认他。”</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/is/29/#L13">赛 29:13</a>（七十士译本）：“这百姓亲近我，用嘴唇尊敬我，心却远离我。”</p></li><li><p>综合<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/7/#L21">太 7:21</a> 与<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/2/#L13">罗 2:13</a> 的措辞（按作者记忆引述）。和合本太 7:21：“凡称呼我『主阿，主阿』的人，不能都进天国；惟独遵行我天父旨意的人，才能进去。”</p></li><li><p>这话在圣经中没有对应原文；后半句与<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/7/#L23">太 7:23</a> 相近：“你们这些作恶的人，离开我去吧。”</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/10/#L16">太 10:16</a>：“我差你们去，如同羊进入狼群。”</p></li><li><p>这段主与彼得的对话不见于正典福音书，出处不明（可能出自当时流传的主的语录）；第4段与<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/10/#L28">太 10:28</a> 相近：“惟有能把身体和灵魂都灭在地狱里的。”</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/6/#L24">太 6:24</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/16/#L13">路 16:13</a>：“一个人不能事奉两个主。”</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/16/#L26">太 16:26</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/8/#L36">可 8:36</a>：“人若赚得全世界，赔上自己的生命，有什么益处呢？”</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/iez/14/#L14">结 14:14</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/iez/14/#L20">20</a>（七十士译本）。和合本：“其中虽有挪亚、但以理、约伯这三人，他们只能因他们的义救自己的性命。”</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/is/66/#L24">赛 66:24</a>（七十士译本）：“他们的虫是不死的，他们的火是不灭的。”</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/16/#L10-11">路 16:10-11</a>：“在最小的事上忠心的，在许多事上也忠心。”（按作者记忆引述）</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/12/#L50">太 12:50</a>：“凡遵行我天父旨意的人，就是我的弟兄、姐妹和母亲了。”</p></li><li><p>这话在圣经中没有对应原文（《前书》第23章亦引用），出处不明。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/2/#L9">林前 2:9</a>：“上帝为爱他的人所预备的，是眼睛未曾看见，耳朵未曾听见，人心也未曾想到的。”（七十士译本 赛 64:4 相近）</p></li><li><p>这话在正典福音书中没有；出处不明（与当时流传的主的语录相近）。</p></li><li><p>自此处起至第20章为亚历山大抄本所缺：第12:5-6段另见于亚历山大的革利免的希腊文引文，第13章以下仅存于1873年发现的叙利亚文译本（耶路撒冷驻所抄本）。本译本按原书章节编入正文。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/is/52/#L5">赛 52:5</a> 与<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/2/#L24">罗 2:24</a>（七十士译本）：“上帝的名在外邦人中受了亵渎。”</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/21/#L13">太 21:13</a>：“你们倒使它成为贼窝了。”</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/1/#L27">创 1:27</a>（七十士译本）；“男的预表基督、女的预表教会”是作者自己的解释。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/is/65/#L24">赛 65:24</a>（七十士译本）：“他们尚未求告，我就应允；正说话的时候，我就垂听。”</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/4/#L8">彼前 4:8</a>：“最要紧的是彼此切实相爱，因为爱能遮掩许多的罪。”</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/is/66/#L18">赛 66:18</a>（“我必将万民万族聚来”）与<a href="https://bibleox.com/zh-Hans/cn-cuv/is/66/#L24">赛 66:24</a>（“他们的虫是不死的”）。</p></li></ol><p>翻译：罗季翁·弗拉索夫（借助人工智能工具）。底本：希腊文原文（<a href="https://bibleox.com/zh-Hans/grc/w/ΚλΡμ_Κορ2">本站的希腊文版本</a>，据 Bihlmeyer–Schneemelcher 校勘本）。第12:5-6段与第13–20章在亚历山大抄本中缺失：前者另见于希腊文引文，后者存于叙利亚文译本，此处按原书章节次序编入正文。参考：俄文译本（巴尔索夫译本）、英文译本（Roberts–Donaldson）。圣经链接指向本站的和合本（上帝版），次经出处指向思高本。翻译原则：作者引述圣经时按他自己所用文本的字句译出，与和合本措辞不同处在注中说明并附和合本链接；术语与译名沿用伊格那丢书信中文译本；段落编号依希腊文原文的章–段划分，便于按章节引用。</p>
