      <h2>关于后书</h2><p>《后书》很可能并非出自圣革利免之手；关于两封书信的底本情况，参见《致哥林多人前书》卷首的信息。该撒利亚的尤西比乌（《教会史》第3卷第38章）这样写到《后书》：“要知道，人们把另一封书信也归于革利免名下；但我们知道，它不像前书那样广为人知，古人也不知道它。”</p><p>自第12:5段起至第20章，亚历山大抄本没有收录：第12:5-6段另见于亚历山大的革利免的希腊文引文，第13章以下则只存于1873年发现的叙利亚文译本（耶路撒冷驻所抄本）。本译本把恢复的部分按原书的章节次序编入正文。</p><h2>1</h2><p>1. 弟兄们，关于耶稣基督，我们应当这样思想：像思想上帝一样，像思想活人死人的审判者一样；并且我们也不应当轻看我们的救恩。[1]</p><p>2. 因为当我们对祂存轻小之念的时候，我们盼望得着的也是微小的东西；听见的人若以为这是小事，犯的也就是小罪；而我们不知不觉地犯罪——忘记了：我们是蒙谁的呼召、被谁呼召、往什么地方去，以及耶稣基督为我们甘愿承受了多少苦难。</p><p>3. 那么，我们要拿什么报酬回报祂？什么果子才算配得上祂赐给我们的呢？我们在圣善的事上又欠祂多少呢？</p><p>4. 因为祂把光赐给了我们，如父亲一般称呼我们为儿子；祂救了我们这些正在灭亡的人。</p><p>5. 那么，我们要把什么赞美献给祂？以什么报答我们所领受的呢？</p><p>6. 我们原是心意昏昧的，敬拜石头与木头、金子、银子和铜——人手的作品；我们的整个生命无非就是死亡。然而，当我们笼罩在蒙蔽之中、眼里满是这层昏暗的雾气之时，借着祂自己的旨意，我们卸下了那罩在我们身上的雾霭，重见了光明。</p><p>7. 因为祂怜悯我们，动了慈心，救了我们——祂看见我们中间有极大的迷误与灭亡，看见我们毫无得救的盼望，除非那出于祂的盼望。8. 祂呼召了我们这些本来不存在的人，愿意我们从不存在中得以存在。</p><h2>2</h2><p>1. “不怀孕、不生养的，要欢乐；未曾经历产难的，要放声欢呼，因为荒凉的儿女比有丈夫的儿女更多。”这话所说的“不怀孕、不生养的，要欢乐”，是指着我们说的：因为我们的教会，在得着儿女之前，是荒凉的。[2]</p><p>2. 而祂所说的“未曾经历产难的，要放声欢呼”，意思是：我们要单纯地向上帝献上祷告，不可像那临产的妇人一样灰心，</p><p>3. 而祂所说的“荒凉的儿女比有丈夫的更多”，意思是：我们的民看来在上帝面前是荒凉的，如今我们信了，就比那些自以为有上帝的人更多。</p><p>4. 又有一处圣经说：“我来本不是召义人，乃是召罪人。”[3]</p><p>5. 这话的意思是：必须拯救那些正在灭亡的人。</p><p>6. 因为这才是伟大而奇妙的事：不是坚固那站立的，而是扶起那跌倒的。</p><p>7. 基督也是这样愿意拯救那正在灭亡的，并且救了许多人——祂来了，呼召了我们这些已经在灭亡之中的人。</p><h2>3</h2><p>1. 既然祂为我们行了这样的怜悯——首先，我们这些向死的神明献祭并敬拜它们的人，不再向它们献祭、不再敬拜它们，反而借着祂认识了真理之父——那么，这借祂而认识真理之父的知识是什么呢？对祂的知识又是什么呢？岂不就是不要否认那借以认识祂的那一位吗？</p><p>2. 祂自己也说：“凡在人面前认我的，我在我父面前也必认他。”[4]</p><p>3. 这就是我们的赏赐：若我们借着祂认信，就必借着祂得救。</p><p>4. 那么，我们怎样认祂呢？就是行祂所说的，不违背祂的诫命，不只以嘴唇尊敬祂，而是以全心、全意。</p><p>5. 祂也借以赛亚说：“这百姓用嘴唇尊敬我，心却远离我。”[5]</p><h2>4</h2><p>1. 所以，我们不只口里称祂为主：因为单是这样并不能救我们。</p><p>2. 因为祂说：“不是凡对我说‘主啊，主啊’的人都必得救，惟独行公义的人。”[6]</p><p>3. 所以，弟兄们，我们要在行为中认祂——彼此相爱，不犯奸淫，不彼此毁谤，不嫉妒，而要节制、怜悯、良善；我们还当彼此同受苦难，不贪爱钱财。在这些行为中我们认祂，而不是在相反的事中；</p><p>4. 我们也不应当怕人过于怕上帝。</p><p>5. 所以，当你们行这些事的时候，主说：“你们若与我同聚在我怀中，却不遵行我的诫命，我就把你们丢弃，对你们说：离开我去吧，我不知道你们是从哪里来的，你们这些行不法之事的人。”[7]</p><h2>5</h2><p>1. 所以，弟兄们，让我们行那呼召我们之主的旨意，将来离开这世界的寄居之所时，也不要害怕走出这个世界。</p><p>2. 因为主说：“你们要如同羊羔进入狼群之中。”[8]</p><p>3. 彼得回答说：“那么，如果狼撕碎羊羔呢？”</p><p>4. 耶稣对彼得说：“羊羔在死后不要怕狼；你们也不要怕那杀害你们、对你们毫无所能的人，却要怕那在你们死后有权柄把灵魂与身体都丢进地狱之火的那一位。”[9]</p><p>5. 弟兄们，你们也要知道：这肉身在今世的寄居是短少而暂时的，而基督的应许是伟大而奇妙的——就是那将来国度的安息与永生。</p><p>6. 那么，要行什么才配得着它们呢？岂不就是圣善而公义地度日，把这些属世的事当作身外之物，不贪恋它们吗？</p><p>7. 因为当我们贪恋要得着这些东西时，我们就从公义的路上跌落了。</p><h2>6</h2><p>1. 主说：“没有一个仆人能事奉两个主人。”当我们想要既事奉上帝、又事奉玛门时，这对我们是无益的。[10]</p><p>2. “人若赚得全世界，却赔上了自己的灵魂，有什么益处呢？”[11]</p><p>3. 这今世与那将来的世代，乃是两个仇敌。</p><p>4. 这一个说奸淫、败坏、贪财与欺骗；那一个却与这些告别。</p><p>5. 所以，我们不能作两者的朋友：必须与这一个告别，与那一个为伍。</p><p>6. 我们认为：憎恨这里的事更好——因为它们微小、短暂、必朽——而爱那里的事，就是那不朽的美善。</p><p>7. 因为行基督旨意的人，必寻得安息；否则，若我们不听从祂的诫命，就没有什么能救我们脱离永恒的刑罚。</p><p>8. 圣经也借以西结说：纵使挪亚、约伯与但以理兴起，他们的儿女也不能从被掳中得救。[12]</p><p>9. 既然连这样的义人也不能凭自己的义救自己的儿女，那么我们若不保守洗礼的洁净与无染，又能怀着什么确信进入上帝的国呢？或者，若我们不被寻见有圣善而公义的行为，谁会成为我们的安慰者呢？</p><h2>7</h2><p>1. 所以，弟兄们，让我们争赛，知道这场争赛是在手上：许多人投入那必朽的争赛，但不是人人得冠冕，惟有那些劳苦良多、赛得好的人。</p><p>2. 所以，让我们争赛，好叫我们人人得冠冕。</p><p>3. 让我们走上正直的路，那不朽的争赛，让我们多人得冠冕；若我们不能人人都得冠冕，至少让我们靠近冠冕。</p><p>4. 我们必须知道：凡在必朽的争赛中赛跑的，若被发现作弊，就被鞭打，逐出赛场的。</p><p>5. 你们以为如何？那在不朽争赛中作弊的，将要受什么呢？</p><p>6. 关于那不保守印记的，祂说：“他们的虫必不死，他们的火必不灭，他们必在一切血肉之人面前显为景象。”[13]</p><h2>8</h2><p>1. 所以，我们既然还在地上，就让我们悔改。</p><p>2. 因为我们是匠人手中的泥土：正如陶匠若造一件器皿，器皿在他手中变了形或破裂，他就把它重新塑造；但若他先把它扔进了火窑，他就不能再帮它了——我们也是这样：只要我们还在这个世界上，就当全心为我们在肉身中所行的恶事悔改，好叫我们被主拯救，趁着我们还有悔改的时节。</p><p>3. 因为当我们离开了世界之后，就不能再在那里认罪，也不能再悔改了。</p><p>4. 所以，弟兄们，我们行主的诫命、守主的命令，就必得永生。</p><p>5. 因为主在福音里说：“你们若没有守住最小的事，谁还把大事赐给你们呢？我告诉你们：那在最小的事上忠心的，在许多事上也忠心。”[14]</p><p>6. 这样，这话的意思就是：要保守肉身圣洁、印记无染，好叫我们得着永生。</p><h2>9</h2><p>1. 你们中间也不要有人说：这肉身不受审判，也不复起。</p><p>2. 你们要知道：你们是在什么里面得救的、在什么里面复醒的——岂不是在这肉身之中吗？</p><p>3. 所以，我们必须像看守上帝的殿一样看守肉身；</p><p>4. 因为你们是在肉身中被召的，也必在肉身中来到。</p><p>5. 若基督我们的主、救我们的那一位——祂起初是灵，成了肉身，并且这样呼召了我们——那么，我们也必在这肉身中得着赏赐。</p><p>6. 所以，让我们彼此相爱，好叫我们众人得以进入上帝的国。</p><p>7. 趁着我们有得医治的时节，让我们把自己交给那位医治人的上帝，把报酬献给祂。</p><p>8. 什么报酬呢？就是从真诚的心悔改。</p><p>9. 因为祂是万事的先知，也知道我们心中的事。</p><p>10. 所以，让我们把赞美献给祂——不只出于口，也出于心，好叫祂接纳我们作儿子。</p><p>11. 因为主也说过：“这些是我的弟兄，就是行我父旨意的人。”[15]</p><h2>10</h2><p>1. 所以，弟兄们，让我们行那呼召我们的父的旨意，好叫我们活着；让我们更加追求美德，撇弃罪恶，视之为我们众罪的先导，远离不敬虔，免得恶事追上我们。</p><p>2. 因为我们若急于行善，平安必追赶我们。</p><p>3. 因为这个缘故，找不到这样的人：他们怀着惧怕人的心，宁可选择这里的享乐，而不选择将来的应许。</p><p>4. 因为他们不知道：这里的享乐有怎样的苦痛，而将来的应许有怎样的欢愉。</p><p>5. 如果只有他们自己行这些事，还可容忍；如今他们却执迷不悟，向无辜的灵魂教导恶事——他们不知道，他们自己和听他们的人，都要受双重的审判。</p><h2>11</h2><p>1. 所以，让我们以清洁的心事奉上帝，我们就必成为义人；我们若不事奉，因为不信上帝的应许，就必成为可怜的人。</p><p>2. 因为预言的话也说：“心怀二意的人是可怜的：心中存疑的人，说：这些话我们的先祖时代早就听过，我们却日复一日地等候，这些事一样也没见过。”[16]</p><p>3. 愚昧人哪，你们要拿自己与树木比一比：拿葡萄树来——它先落叶，然后发芽，随后才有青果，然后才有成熟的葡萄。</p><p>4. 我的民也是如此：经历了动乱与患难，随后就必领受美善。</p><p>5. 所以，弟兄们，我们不要心怀二意，而要存着盼望恒忍，好叫我们也领受赏赐。</p><p>6. 因为那应许按各人的工作报应各人的，是信实的。</p><p>7. 所以，我们若在上帝面前行公义，就必进入祂的国，领受那些耳朵未曾听见、眼睛未曾看见、人心也未曾上到的应许。[17]</p><h2>12</h2><p>1. 所以，我们时时刻刻在爱与公义中等候上帝的国，因为我们不知道上帝显现的日子。</p><p>2. 因为当有人亲自问主：祂的国什么时候来到，祂说：“当两者成为一，外面的如同里面的，男的与女的——既不是男的、也不是女的。”[18]</p><p>3. “两者成为一”，是指：当我们彼此说真话，两个身体之中毫无假冒地有着同一个灵魂的时候；</p><p>4. “外面的如同里面的”，这话的意思是：祂说“里面的”是指灵魂，“外面的”是指身体；所以，正如你的身体显于外，你的灵魂也当借善行同样显明于外。</p><p>5. 而祂所说的“男的与女的，既不是男的、也不是女的”，意思是：弟兄看见姊妹，对她不要存任何属女性的念头；姊妹看见弟兄，对他也不要存任何属男性的念头。[19]</p><p>6. 祂说：你们若行这些事，我父的国就必来临。</p><h2>13</h2><p>1. 所以，弟兄们，如今让我们终于悔改，在美善的事上清醒过来；因为我们满心是极多的愚昧与邪恶。让我们把先前的一切罪涂抹掉，从灵魂里悔改，好得拯救；并且不要成为讨人喜欢的人，也不要只愿意讨自己的喜悦，还要因公义的缘故讨那些外人的喜悦，免得那名因我们受了亵渎。</p><p>2. 因为主说：“我的名在万国中时时受亵渎”；又说：“我的名因谁受亵渎，谁就有祸了。”祂的名在哪里受亵渎呢？就是在你们不行我所愿的事的时候。[20]</p><p>3. 因为万民听见我们口中上帝的言语，赞叹它美好而伟大；随后他们察看我们的行为，就转而亵渎，说这不过是个寓言、是个迷惑。</p><p>4. 又当论到“你们若爱那恨你们的人，还有什么恩典呢”：当他们听见这些，就惊叹美善的超凡；但当他们看见，我们不只不爱那恨我们的人，甚至连爱我们的人也不爱，他们就讥诮我们，那名也就受了亵渎。</p><h2>14</h2><p>1. 所以，弟兄们，我们行我们父上帝的旨意，就必属于那头一个教会——那属灵的、在日月受造之前就存在的教会；我们若不行主的旨意，就必归于那所写的：“我的家成了贼窝。”[21]所以，让我们甘愿属于生命的教会，好叫我们得救。</p><p>2. 我相信你们并不不知道：活的教会是基督的身体；因为圣经说：“上帝造了人：男的与女的。”男的预表基督，女的预表教会；圣经与众使徒还说，教会不是如今才有，而是从起初就有：因为她原是属灵的，正如我们的耶稣也是，但在末后的日子里显明出来，为要拯救我们。[22]</p><p>3. 那属灵的教会既在基督的肉身中显明出来，就向我们显明：这肉身若朽坏，就不得领受她；但在圣灵里必要得着她；因为这肉身是圣灵的对应体：人若毁了这对应之体，就必不能领受那本物。所以，弟兄们，这话的意思就是：要保守肉身，好叫我们领受圣灵。</p><p>4. 但若我们说肉身就是教会、灵就是基督，那么，侮辱肉身的，就是侮辱了教会。这样的人必不得领受那灵，就是基督。</p><p>5. 这肉身能够得着这样的生命与不朽——当圣灵与它相连之时——是人不能言说、不能陈述的：主为祂的选民所预备的是何等的事。</p><h2>15</h2><p>1. 我也认为，我论节制所给的劝告并非小事：人行了它，就必不后悔，并且要救自己，也救我这劝告他的人。因为把那走迷、正在灭亡的灵魂劝转过来得以拯救，赏赐并不小。</p><p>2. 因为这是我们所能报答造我们的上帝的报酬：若那说的与听的人，都怀着信心与爱心说与听。</p><p>3. 所以，让我们坚持我们所信的公义与圣善，好叫我们能放胆祈求那说话的上帝：“你正说话的时候，我就应允；看哪，我在这里。”[23]</p><p>4. 因为这句话是伟大应许的记号：主愿意把自己更快的给出那祈求的人。</p><p>5. 我们既领受这样大的恩慈，就不要互相嫉妒，反倒要共享这么多美善。这些话对行它的人有怎样的喜乐，对不听从的人也就有怎样的定罪。</p><h2>16</h2><p>1. 所以，弟兄们，既然得了这不算小的起头可以悔改，趁着还有可归回的时节，让我们回转向那呼召我们的上帝——祂还接纳我们的时候。</p><p>2. 因为若我们告别这些诱人的私欲，胜过我们的灵魂，不行它邪恶的私欲，我们就必得着耶稣的怜悯。</p><p>3. 你们也要知道：审判的日子已经在来到，如同烧着的火炉，诸天的某几部分将要溶解，全地将如铅在火中熔化；随后，人隐藏的与显露的工作都将显现出来。</p><p>4. 所以，施舍如同悔改，是美善的；禁食胜过祷告，施舍又胜过两者；“爱能遮掩许多的罪”，出自清洁良心的祷告救人脱离死亡。凡在这其中被寻见为完全的人是有福的：因为施舍成为罪的轻省。[24]</p><h2>17</h2><p>1. 所以，让我们全心悔改，免得我们中间有任何人灭亡。因为若我们有命令，连这事也要行：把人从偶像中拉出来并教导他；那么，更何况那已经认识上帝的灵魂，岂不该被拯救而不灭亡吗？</p><p>2. 所以，让我们彼此扶助，把那软弱的人提到美善的路上，好叫我们众人得救，并且彼此劝转、劝诫。</p><p>3. 也不要让我们只在被司祭们劝诫的时候，才显得有信心、留心听，而当我们回到家里之后，也要记念主的诫命，不被属世的私欲拉扯；反而要更频繁地亲近，努力在主的诫命上长进，好叫我们众人同心合意地聚在生命之中；</p><p>4. 因为主说：“我来要聚集万民、各族与各舌。”这话是指祂显现的日子：祂来的时候，要按各人的行为救赎我们。[25]</p><p>5. 那些不信的人要看见祂的荣耀与权能，看见这世界在耶稣里的国度而惊讶，说：“我们有祸了：因为你曾在这里，我们却不认识，也不信，也不听从那些向我们宣讲我们救恩的司祭们。”他们的虫必不死，他们的火必不灭，他们必在一切血肉之人面前显为景象。</p><p>6. 祂说那一天，是指审判的日子：那时他们要看见在我们中间行不敬虔、扭曲耶稣基督诫命的人。</p><p>7. 而那些行得好、忍受了刑罚、又憎恨灵魂肉欲之乐的义人，当他们看见那些迷失的人、那些以言语或行为否认耶稣的人被可怕的刑罚、不灭的火烧灼之时——他们要归荣耀给他们的上帝，说：那全心事奉上帝的人是有盼望的。</p><h2>18</h2><p>1. 所以，让我们属于那蒙上帝悦纳、事奉上帝的人，不属于那受审判的不敬虔之人。</p><p>2. 我自己虽然是个犯各样罪的人，还未逃脱试探，却仍在魔鬼的器具之中，也要急切追求公义，好叫我刚强起来，至少能靠近她，惧怕那将来的审判。</p><h2>19</h2><p>1. 所以，弟兄与姊妹们，我随从真上帝的真理，向你们诵读这劝诫，为要叫你们留心所写的，好救你们自己，也救那在你们中间诵读的人。因为我向你们所求的报酬，就是全心悔改，把救恩与生命给自己。行这事，我们就为每一个愿意敬虔努力、追求上帝恩慈的年轻人立下目标。</p><p>2. 而我们这些没有智慧的人，不要厌恶、不要愤慨：当有人劝诫我们、把我们从不义转回公义的时候。因为有时我们行恶，却因心中的二心与不信而不自知，我们的心思被虚妄的私欲所蒙蔽。</p><p>3. 所以，让我们行公义，好叫我们末了得救。凡听从这些命令的人是有福的：哪怕他们在这世上受苦不久，也必收割不朽复活的果子。</p><p>4. 所以，敬虔的人不要忧愁，哪怕他现今受苦：他升上去，与众先祖一同活过来，就必在那无苦的世代中欢欣。</p><h2>20</h2><p>1. 但也不要让这事扰乱你们的心思：我们看见不义的人富足，上帝的仆人却在艰难之中。</p><p>2. 所以，弟兄与姊妹们，让我们相信：我们是在永活的上帝面前经受考验、在今生操练，好叫我们在那将来得冠冕。</p><p>3. 没有一个义人快速得了果子，而是等候得着它。</p><p>4. 因为上帝若立即报答义人的赏赐，我们就立刻经商了，而不是敬拜上帝；我们看起来是义人，追求的却不是敬虔，而是利益。为此，神圣的审判损伤了那不义的灵，用锁链把它压重。</p><p>5. 愿荣耀归给那独一不可见的上帝、真理之父、那差救主与不朽之创始者到我们这里来的那一位——借着祂，祂也向我们显明了真理与天上的生命——直到世世无穷。阿们。</p>
