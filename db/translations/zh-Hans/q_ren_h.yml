  title: 地狱
  copy_cover: true
  body: <h2>定义</h2><p>地狱可以有几种理解。</p><ol><li><p>地狱——死者灵魂在普遍复活和最后审判之前的居所。</p></li><li><p>地狱——在荣耀的第二次降临、普遍复活和最后审判之后，被定罪的罪人复活后（即灵魂与身体一起）的居所。最后审判之后，这一命运已无法改变。被定罪者的痛苦与义人的真福将同样永远持续。</p></li></ol><h2>地狱、欣嫩谷、火湖、永火、外面的黑暗、监狱——受苦之处</h2><p>在圣经中，「地狱」最常指某种受苦之处。这地方可以用不同的词来称呼，但这并不改变其实质：它始终是受苦之处。在地狱里受苦的有：</p><blockquote><p>“<strong><mark>惟有本国的子民，竟被赶到外边黑暗里去</mark></strong>，在那里必要哀哭切齿了。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/8/#L12">太 8:12</a>)</p></blockquote><blockquote><p>“于是王对使唤的人说：『捆起他的手脚来，<strong><mark>把他丢在外边的黑暗里</mark></strong>．在那里必要哀哭切齿了。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/22/#L13">太 22:13</a>)</p></blockquote><blockquote><p>“<strong><mark>把这无用的仆人丢在外面黑暗里</mark></strong>，在那里必要哀哭切齿了。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/25/#L30">太 25:30</a>)</p></blockquote><p>是基督自己——作为审判者——决定谁往哪里去：</p><blockquote><p>“王又要向那左边的说：『<strong><mark>你们这被咒诅的人，离开我，进入那为魔鬼和他的使者所预备的永火里去</mark></strong>！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/25/#L41">太 25:41</a>)</p></blockquote><blockquote><p>“<strong><mark>你们要防备人</mark></strong>．因为他们要把你们交给公会，也要在会堂里鞭打你们； &lt;…&gt; 那杀身体不能杀灵魂的，不要怕他们；<strong><mark>惟有能把身体和灵魂都灭在地狱里的，正要怕他</mark></strong>。 &lt;…&gt; 凡在人面前不认我的，<strong><mark>我在我天上的父面前也必不认他</mark></strong>。 你们不要想，我来是叫地上太平；我来并不是叫地上太平，<strong><mark>乃是叫地上动刀兵</mark></strong>。 &lt;…&gt; <strong><mark>不背着他的十字架跟从我的，也不配作我的门徒</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/10/#L17,28,33-34,38">太 10:17,28,33-34,38</a>)</p></blockquote><p>人死后要进入新的居所。这一事件值得哀哭：</p><blockquote><p>“人怕高处，路上有惊慌；杏树开花，蚱蜢成为重担；人所愿的也都废掉。<strong><mark>因为人归他永远的家</mark></strong>，吊丧的在街上往来。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ekl/12/#L5">传 12:5</a>)</p></blockquote><p>人死后有审判等待着他：</p><blockquote><p>“按着定命，<strong><mark>人人都有一死，死后且有审判</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/9/#L27">希 9:27</a>)</p></blockquote><p>地狱中，其中的居民有知觉地存在。巴比伦王受到地狱一切居民的迎接：</p><blockquote><p>“你必题这诗歌论巴比伦王说：欺压人的何竟息灭？强暴的何竟止息？ &lt;…&gt; <strong><mark>你下到阴间，阴间就因你震动，来迎接你</mark></strong>。又因你惊动在世曾为首领的阴魂，并使那曾为列国君王的，都离位站起， 他们都要发言对你说：「<strong><mark>你也变为软弱像我们一样吗？你也成了我们的样子吗</mark></strong>？」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/14/#L4,9-10">赛 14:4,9-10</a>)</p></blockquote><p>主在身体死后下到阴间，向那些从世界洪水时代起就在那里的神魂宣讲：</p><blockquote><p>“因基督也曾一次为罪受苦，就是义的代替不义的，为要引我们到上帝面前。<strong><mark>按着肉体说，他被治死；按着灵性说，他复活了</mark></strong>。 <strong><mark>他藉这灵曾去传道给那些在监狱里的灵听</mark></strong>， 就是那从前在<strong><mark>挪亚预备方舟、上帝容忍等待的时候</mark></strong>，不信从的人。当时进入方舟，借着水得救的不多，只有八个人。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/3/#L18-20">彼前 3:18-20</a>)</p></blockquote><blockquote><p>“所以经上说：『他升上高天的时候，掳掠了仇敌，将各样的恩赐赏给人。』 （<strong><mark>既说升上，岂不是先降在地下吗</mark></strong>？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/4/#L8-9">弗 4:8-9</a>)</p></blockquote><p>基督的灵魂没有被撇在阴间。不是<strong>身体</strong>没有被撇在坟墓（土）里，而是<strong>灵魂</strong>没有被撇在阴间：</p><blockquote><p>“就预先看明这事，讲论基督复活说：『<strong><mark>他的灵魂不撇在阴间</mark></strong>；他的肉身也不见朽坏。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/2/#L31">徒 2:31</a>)</p></blockquote><p>死人被看见，死人受审判，阴间交出死人：</p><blockquote><p>“<strong><mark>我又看见死了的人</mark></strong>，无论大小，都站在宝座前。案卷展开了，并且另有一卷展开，就是生命册；<strong><mark>死了的人都凭着这些案卷所记载的，照他们所行的受审判</mark></strong>。 于是海交出其中的死人，<strong><mark>死亡和阴间也交出其中的死人</mark></strong>，他们都照各人所行的受审判。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/20/#L12-13">启 20:12-13</a>)</p></blockquote>
