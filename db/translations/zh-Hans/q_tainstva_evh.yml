  path: QT5A_圣餐礼（领受圣体）
  title: 圣餐礼（领受圣体）
  copy_cover: true
  body: <h2>圣餐圣奥秘的设立</h2><p>主上帝耶稣基督在锡安的楼房里设立圣餐圣奥秘，他只聚集了十二使徒在那里：</p><blockquote><p>“他们吃的时候，耶稣拿起饼来，祝福，就擘开递给门徒，说：「<strong><mark>你们拿着吃，这是我的身体</mark></strong>。」 又拿起杯来，祝谢了，递给他们，说：「你们都喝这个， <strong><mark>因为这是我立约的血，为多人流出来，使罪得赦</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/26/#L26-28">太 26:26-28</a>)</p></blockquote><p>同样见：<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/14/#L22-24">可 14:22-24</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/22/#L19-20">路 22:19-20</a></p><p>使徒保罗——他是在救主复活之后才成为使徒的——是复活的主耶稣基督亲自单独教导他举行圣餐的：</p><blockquote><p>“<strong><mark>我当日传给你们的，原是从主领受的</mark></strong>，就是主耶稣被卖的那一夜，拿起饼来， 祝谢了，就擘开，说，「<strong><mark>这是我的身体，为你们舍的</mark></strong>。你们应当如此行，为的是记念我。」 饭后，也照样拿起杯来，说：「<strong><mark>这杯是用我的血所立的新约</mark></strong>。你们每逢喝的时候，要如此行，为的是记念我。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/11/#L23-25">林前 11:23-25</a>)</p></blockquote><h2>藉圣餐联合于同一个身体</h2><blockquote><p>“耶稣说：「我实实在在的告诉你们，你们若不吃人子的肉，不喝人子的血，就没有生命在你们里面； 吃我肉、喝我血的人就有永生，在末日我要叫他复活。 我的肉真是可吃的，我的血真是可喝的。 <strong><mark>吃我肉、喝我血的人，常在我里面，我也常在他里面</mark></strong>。 永活的父怎样差我来，我又因父活着；照样，<strong><mark>吃我肉的人也要因我活着</mark></strong>。 这就是从天上降下来的粮。吃这粮的人，就永远活着，不像你们的祖宗吃过吗哪还是死了。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/6/#L53-58">约 6:53-58</a>)</p></blockquote><p>参与圣餐圣奥秘的人真实地（实际上）在基督的身体里与基督彼此联合：</p><blockquote><p>“我们所祝福的杯，岂不是<strong><mark>同领基督的血</mark></strong>吗？我们所擘开的饼，岂不是<strong><mark>同领基督的身体</mark></strong>吗？ <strong><mark>我们虽多，仍是一个饼、一个身体，因为我们都是分受这一个饼</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/10/#L16-17">林前 10:16-17</a>)</p></blockquote><blockquote><p>“<strong><mark>你们就是基督的身子</mark></strong>，并且各自作肢体。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/12/#L27">林前 12:27</a>)</p></blockquote><blockquote><p>“你们从前远离上帝的人，如今却在基督耶稣里，<strong><mark>靠着他的血，已经得亲近了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/2/#L13">弗 2:13</a>)</p></blockquote><blockquote><p>“<strong><mark>因我们是他身上的肢体</mark></strong>〔有古卷在此有『就是他的骨、他的肉』〕。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/5/#L30">弗 5:30</a>)</p></blockquote><p>详见：<a href="https://bibleox.com/ru/ru/w/Церковь#HH-Определение-Церковь--Тело-Христово">与基督联合，加入他的身体（教会）</a></p><h2>不参与圣餐就不能得救</h2><blockquote><p>“耶稣说：「我实实在在的告诉你们，<strong><mark>你们若不吃人子的肉，不喝人子的血，就没有生命在你们里面</mark></strong>； 吃我肉、喝我血的人就有永生，<strong><mark>在末日我要叫他复活</mark></strong>。 <strong><mark>我的肉真是可吃的，我的血真是可喝的</mark></strong>。 吃我肉、喝我血的人，常在我里面，我也常在他里面。 永活的父怎样差我来，我又因父活着；照样，吃我肉的人也要因我活着。 这就是从天上降下来的粮。吃这粮的人，就永远活着，<strong><mark>不像你们的祖宗吃过吗哪还是死了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/6/#L53-58">约 6:53-58</a>)</p></blockquote><p>藉圣餐人与基督联合，而基督是身体的救主：</p><blockquote><p>“基督是教会的头，他又是<strong><mark>教会全体的救主</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/5/#L23">弗 5:23</a>)</p></blockquote><h2>圣奥秘中是救主真实的体和血</h2><h3>饼——基督将为世人的生命而舍去的肉</h3><p>在圣餐中，信徒领受耶稣基督真实的（真正的）体和真实的血——他为世人的生命而舍弃它们，把自己作为祭物献在十字架上：</p><blockquote><p>“我就是生命的粮。 你们的祖宗在旷野吃过吗哪，还是死了。 这是从天上降下来的粮，叫人吃了就不死。 我是从天上降下来生命的粮，人若吃这粮就必永远活着；<strong><mark>我所要赐的粮就是我的肉，为世人之生命所赐的</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/6/#L48-51">约 6:48-51</a>)</p></blockquote><p>这里主直接宣告：这从天降下的粮就是他的肉——这肉他<strong>现在</strong>就有，并且<strong>将来</strong>要为世人的生命而舍去。这里只是应许。此刻他还没有舍这肉。教导他已经赐下，而在将来，他要交付于死刑的不是教导、不是象征、不是纪念，而是他真实的肉。正是他的肉才是那从天降下的粮——他在圣餐圣奥秘中以饼和酒的形式分给门徒吃。</p><h3>立约的血——至圣的圣物</h3><p>凡不把立约的血当作圣物的人，就要受极重的刑罚——他以此羞辱施恩的圣灵：</p><blockquote><p>“人干犯摩西的律法，凭两三个见证人尚且不得怜恤而死； <strong><mark>何况人践踏上帝的儿子</mark></strong>，<strong><mark>将那使他成圣之约的血当作平常，又亵慢施恩的圣灵</mark></strong>，你们想，他要受的刑罚该怎样加重呢？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/10/#L28-29">希 10:28-29</a>)</p></blockquote><blockquote><p>“<strong><mark>凡亵渎圣灵的，却永不得赦免</mark></strong>，<strong><mark>乃要担当永远的罪</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/3/#L29">可 3:29</a>)</p></blockquote><h3>人子的肉</h3><p>讲到圣餐时，基督特别强调他的人性：</p><blockquote><p>“耶稣说：「我实实在在的告诉你们，<strong><mark>你们若不吃人子的肉</mark></strong>，不喝人子的血，就没有生命在你们里面；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/6/#L53">约 6:53</a>)</p></blockquote><h3>不按理领受者的疾病与死亡</h3><p>领受之前必须省察。不按理领受的人有罪、生病、甚至死亡：</p><blockquote><p>“所以，无论何人不按理吃主的饼、喝主的杯，<strong><mark>就是干犯主的身、主的血了</mark></strong>。 人应当自己省察，然后吃这饼、喝这杯。 因为人吃喝，若不分辨是主的身体，<strong><mark>就是吃喝自己的罪了</mark></strong>。 <strong><mark>因此，在你们中间有好些软弱的与患病的，死的也不少</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/11/#L27-30">林前 11:27-30</a>)</p></blockquote><h2>领受圣奥秘必须预备</h2><blockquote><p>“<strong><mark>人应当自己省察，然后吃这饼、喝这杯</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/11/#L28">林前 11:28</a>)</p></blockquote><h2>在教会里，领圣体的圣奥秘将一直举行到耶稣基督再来</h2><blockquote><p>“你们每逢吃这饼，喝这杯，是表明主的死，<strong><mark>直等到他来</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/11/#L26">林前 11:26</a>)</p></blockquote><h2>圣餐的旧约预表</h2><h3>逾越节的羔羊</h3><p>无残疾的（一岁的、没有缺陷的）公羔羊应当真实地<strong>死</strong>，为人的罪；然后真实地被<strong>吃掉</strong>，全部吃完。基督是羔羊，字面地应验了这一预表的两部分：</p><ul><li><p>他真实地（不是象征地）为人的罪而死；</p></li><li><p>他真实地（不是象征地）被吃。</p></li></ul><blockquote><p>“你们吩咐以色列全会众说，本月初十日，<strong><mark>各人要按着父家取羊羔</mark></strong>，一家一只。 &lt;…&gt; <strong><mark>要无残疾、一岁的公羊羔</mark></strong>，你们或从绵羊里取，或从山羊里取，都可以。 要留到本月十四日，在黄昏的时候，<strong><mark>以色列全会众把羊羔宰了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/12/#L3,5-6">出 12:3,5-6</a>)</p></blockquote><blockquote><p>“于是，摩西召了以色列的众长老来，对他们说：「你们要按着家口取出羊羔，<strong><mark>把这逾越节的羊羔宰了</mark></strong>。 拿一把牛膝草，蘸盆里的血，<strong><mark>打在门楣上和左右的门框上</mark></strong>。你们谁也不可出自己的房门，直到早晨。 &lt;…&gt; 日后，你们到了耶和华按着所应许赐给你们的那地，<strong><mark>就要守这礼</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/12/#L21-22,25">出 12:21-22,25</a>)</p></blockquote><blockquote><p>“<strong><mark>哪知他为我们的过犯受害</mark></strong>，为我们的罪孽压伤。<strong><mark>因他受的刑罚，我们得平安</mark></strong>；因他受的鞭伤，我们得医治。 我们都如羊走迷，各人偏行己路。<strong><mark>耶和华使我们众人的罪孽都归在他身上</mark></strong>。 他被欺压，在受苦的时候却不开口。<strong><mark>他像羊羔被牵到宰杀之地</mark></strong>，又像羊在剪毛的人手下无声，他也是这样不开口。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/53/#L5-7">赛 53:5-7</a>)</p></blockquote><blockquote><p>“他所念的那段经，说：『<strong><mark>他像羊被牵到宰杀之地</mark></strong>，又像羊羔在剪毛的人手下无声，他也是这样不开口。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/8/#L32">徒 8:32</a>)</p></blockquote><blockquote><p>“<strong><mark>我却像柔顺的羊羔被牵到宰杀之地</mark></strong>。我并不知道他们设计谋害我说：「我们把树连果子都灭了吧！将他从活人之地剪除，使他的名不再被记念。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ier/11/#L19">耶 11:19</a>)</p></blockquote><blockquote><p>“次日，约翰看见耶稣来到他那里，就说：「<strong><mark>看哪！上帝的羔羊，除去世人罪孽的</mark></strong>。 &lt;…&gt; 他见耶稣行走，就说：「<strong><mark>看哪！这是上帝的羔羊</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/1/#L29,36">约 1:29,36</a>)</p></blockquote><blockquote><p>“知道你们得赎、脱去你们祖宗所传流虚妄的行为，不是凭着能坏的金银等物， <strong><mark>乃是凭着基督的宝血，如同无瑕疵、无玷污的羔羊之血</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/1/#L18-19">彼前 1:18-19</a>)</p></blockquote><blockquote><p>“大声说：「<strong><mark>曾被杀的羔羊</mark></strong>，是配得权柄、丰富、智慧、能力、尊贵、荣耀、颂赞的！」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/5/#L12">启 5:12</a>)</p></blockquote><blockquote><p>“<strong><mark>因为宝座中的羔羊必牧养他们</mark></strong>，领他们到生命水的泉源；上帝也必擦去他们一切的眼泪。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/7/#L17">启 7:17</a>)</p></blockquote><blockquote><p>“我又观看，<strong><mark>见羔羊站在锡安山</mark></strong>，同他又有十四万四千人，都有他的名和他父的名写在额上。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/14/#L1">启 14:1</a>)</p></blockquote><h3>吗哪</h3><p>旷野中的吗哪，它供养以色列民从埃及的奴役走向应许之地的路上的力量。吗哪在旷野里是真实地被吃的。它真实地保护人不至死亡、赐人生命（旷野里没有别的食物）：</p><blockquote><p>“耶和华对摩西说：「<strong><mark>我要将粮食从天降给你们</mark></strong>。百姓可以出去，<strong><mark>每天收每天的分</mark></strong>，我好试验他们遵不遵我的法度。 &lt;…&gt; 这食物，<strong><mark>以色列家叫吗哪</mark></strong>，样子像芫荽子，颜色是白的，滋味如同搀蜜的薄饼。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/16/#L4,31">出 16:4,31</a>)</p></blockquote><blockquote><p>“夜间露水降在营中，<strong><mark>吗哪也随着降下</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/11/#L9">民 11:9</a>)</p></blockquote><p>因为吗哪只是预像、是将来之事的影子，而不是实物本身，所以它没有赐下永恒的生命，只是延长地上的生命、使人免于饿死；最终那些犹太人还是死了，正如人都死一样。但基督说，吃他的必永远活着：</p><blockquote><p>“<strong><mark>我们的祖宗在旷野吃过吗哪</mark></strong>，如经上写着说：『他从天上赐下粮来给他们吃。』」 耶稣说：「我实实在在的告诉你们，那从天上来的粮不是摩西赐给你们的，<strong><mark>乃是我父将天上来的真粮赐给你们</mark></strong>。 因为，<strong><mark>上帝的粮就是那从天上降下来赐生命给世界的</mark></strong>。」 &lt;…&gt; 耶稣说：「<strong><mark>我就是生命的粮</mark></strong>。到我这里来的，必定不饿；信我的，永远不渴。 &lt;…&gt; 我就是生命的粮。 <strong><mark>你们的祖宗在旷野吃过吗哪，还是死了</mark></strong>。 这是从天上降下来的粮，<strong><mark>叫人吃了就不死</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/6/#L31-33,35,48-50">约 6:31-33,35,48-50</a>)</p></blockquote><blockquote><p>“<strong><mark>吃我肉、喝我血的人就有永生</mark></strong>，在末日我要叫他复活。 我的肉真是可吃的，我的血真是可喝的。 &lt;…&gt; 永活的父怎样差我来，我又因父活着；照样，<strong><mark>吃我肉的人也要因我活着</mark></strong>。 这就是从天上降下来的粮。吃这粮的人，就永远活着，<strong><mark>不像你们的祖宗吃过吗哪还是死了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/6/#L54-55,57-58">约 6:54-55,57-58</a>)</p></blockquote><p>再者，如果把犹太人从埃及的奴役到应许之地的整个路程看作基督徒从罪的奴役到天国的路程，那么吗哪在这里也字面地指向圣餐：</p><ul><li><p>真实的埃及奴役——真实的罪的奴役。</p></li><li><p>真实地走海床脱离奴役——真实的洗礼（<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/10/#L2">林前 10:2</a>）。</p></li><li><p>真实的四十年旷野漂泊——教会中真实的今生。</p></li><li><p>真实的吗哪和水——上帝所赐救主真实的体和血。</p></li><li><p>真实地应许给犹太人的土地——真实的国，只是如今不是地上的，而是天上的。</p></li></ul><h3>米利巴的甜水</h3><blockquote><p>“摩西领以色列人从红海往前行，到了书珥的旷野。在旷野走了三天，找不着水。 到了玛拉，不能喝那里的水，因为水苦，所以那地名叫玛拉。 百姓就向摩西发怨言，说：「我们喝什么呢？」 摩西呼求耶和华，<strong><mark>耶和华指示他一棵树</mark></strong>，他把树丢在水里，<strong><mark>水就变甜了</mark></strong>。耶和华在那里为他们定了律例、典章，在那里试验他们。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/15/#L22-25">出 15:22-25</a>)</p></blockquote><h3>用羔羊的血涂抹房屋的入口</h3><p>用血涂抹入口救人不死：</p><blockquote><p>“各家要取点血，<strong><mark>涂在吃羊羔的房屋左右的门框上和门楣上</mark></strong>。 &lt;…&gt; 拿一把牛膝草，蘸盆里的血，<strong><mark>打在门楣上和左右的门框上</mark></strong>。你们谁也不可出自己的房门，直到早晨。 因为耶和华要巡行击杀埃及人，他看见血在门楣上，和左右的门框上，<strong><mark>就必越过那门</mark></strong>，不容灭命的进你们的房屋，击杀你们。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/12/#L7,22-23">出 12:7,22-23</a>)</p></blockquote><h3>从祭坛上取下的、洁净罪的炭</h3><p>先知以赛亚的罪，因烧着的炭触到他的口而被洁净——炭是用火剪从祭坛上取下来的：</p><blockquote><p>“那时我说：「祸哉！我灭亡了！因为<strong><mark>我是嘴唇不洁的人</mark></strong>，又住在嘴唇不洁的民中；又因我眼见大君王万军之耶和华。」 有一撒拉弗飞到我跟前，<strong><mark>手里拿着红炭，是用火剪从坛上取下来的</mark></strong>， 将炭沾我的口说：「看哪，这炭沾了你的嘴，<strong><mark>你的罪孽便除掉，你的罪恶就赦免了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/6/#L5-7">赛 6:5-7</a>)</p></blockquote><h3>吃树上的果子</h3><p>人类真实地吃了树上的果子而远离上帝（<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/3/#L6">创 3:6</a>）；人类也照样藉吃十字架之树的果子归向上帝。人藉不顺服之树远离上帝，又藉十字架顺服之树归回（<a href="https://bibleox.com/zh-Hans/cn-cuv/fil/2/#L8">腓 2:8</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/16/#L24">太 16:24</a>）。那树上的果子夺去生命，而这树上的果子使人归回生命。人从哪扇门出去，就从哪扇门进来。那时主说：“不可吃”（<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/2/#L17">创 2:17</a>）——他们吃了。如今他说“拿着吃”（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/26/#L26">太 26:26</a>）——许多人犯着从前同样的错误，只是反过来——不吃。虽然那时和现在，遵守这诫命都不难：</p><blockquote><p>“惟有园当中那棵树上的果子，上帝曾说：『<strong><mark>你们不可吃，也不可摸，免得你们死</mark></strong>。』」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/3/#L3">创 3:3</a>)</p></blockquote><blockquote><p>“只是分别善恶树上的果子，<strong><mark>你不可吃，因为你吃的日子必定死</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/2/#L17">创 2:17</a>)</p></blockquote><blockquote><p>“他们吃的时候，耶稣拿起饼来，祝福，就擘开递给门徒，说：「<strong><mark>你们拿着吃，这是我的身体</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/26/#L26">太 26:26</a>)</p></blockquote><blockquote><p>“这就是从天上降下来的粮。<strong><mark>吃这粮的人，就永远活着</mark></strong>，不像你们的祖宗吃过吗哪还是死了。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/6/#L58">约 6:58</a>)</p></blockquote><h3>感恩的平安祭</h3><p>旧约里有两类平安祭：</p><ul><li><p><strong>赞美</strong>祭（תודה，todah）；</p></li><li><p><strong>感恩</strong>祭（或救恩祭）（שלמים shelamim 或 נדר neder）。</p></li></ul><p>平安祭包括献饼和牲祭。<strong>赞美</strong>的平安祭用无酵饼献上，而若另外还献<strong>感恩</strong>的平安祭，则用有酵饼献上：</p><blockquote><p>“<strong><mark>要用有酵的饼和为感谢献的平安祭</mark></strong>，与供物一同献上。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/7/#L13">利 7:13</a>)</p></blockquote><p>在新约里，向上帝献饼的圣奥秘称为<strong>“圣餐礼”（感恩祭，希腊文——感恩）</strong>，因为基督自己在分给门徒之前<strong>祝谢了</strong>上帝并祝福了饼（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/22/#L19">路 22:19</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/11/#L23-24">林前 11:23-24</a>）。</p><p>就是说，在正教会的圣餐礼中，今天字面地行的正是这些：</p><ul><li><p>取有酵的饼；</p></li><li><p>献上感恩；</p></li><li><p>只是不与它一同献上祭牲，因为祭物、羔羊、逾越节——是被钉死又复活的基督。</p></li></ul><p>要注意，无酵饼称为困苦饼（“ἄζυμα, ἄρτον κακώσεως”，<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/16/#L3">申 16:3</a>），而有酵饼的平安祭称为感恩祭或救恩祭（תֹּודַ֥ת——感恩，σωτηρίου——救恩，<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/7/#L13">利 7:13</a>）。</p><p>*注：* *祭牲的肉或者当天吃掉、不留到早晨（如逾越节），或者可以吃两天，但严格禁止留到第三天。若没有在第三天之前吃完，剩余的就要用火焚烧，否则祭物就被上帝拒绝，成为玷污和罪。这把我们引向救主的复活——第三天坟墓空了。就是说，在这里有酵饼属于新约——救主的复活。*</p><h2>物件本质的改变</h2><ul><li><p>杖变为蛇，又变回杖（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/4/#L3-4">出 4:3-4</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/7/#L9-10,15">出 7:9-10,15</a>）；</p></li><li><p>水变为血（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/7/#L17,19-21">出 7:17,19-21</a>）；</p></li><li><p>水变为酒（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/2/#L7-10">约 2:7-10</a>）。</p></li></ul><h2>对饼和酒的祝福</h2><p>那位非物质的上帝——他从前从无中创造了宇宙，安排了普世的洪水，使太阳停住，在任何地方奇妙地赐下不同的食物和水，分开江河和海洋，多次改变物件的本质（杖、水），他自己成为物质的（道成肉身），以自己的祝福使饼和鱼增多（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/14/#L15-21">太 14:15-21</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/15/#L32-38">太 15:32-38</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/6/#L35-44">可 6:35-44</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/8/#L1-9">可 8:1-9</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/9/#L12-17">路 9:12-17</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/in/6/#L5-13">约 6:5-13</a>），为生来瞎眼的造了眼睛，使腐烂的肉身复原——在与门徒的逾越节晚餐上，不只是分了饼和酒，而是祈祷之后<strong>祝福了它们</strong>，称它们为自己的体和血：</p><blockquote><p>“他们吃的时候，耶稣拿起饼来，<strong><mark>祝福，就擘开递给门徒</mark></strong>，说：「<strong><mark>你们拿着吃，这是我的身体</mark></strong>。」 <strong><mark>又拿起杯来，祝谢了</mark></strong>，递给他们，说：「你们都喝这个， 因为这是我立约的血，为多人流出来，使罪得赦。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/26/#L26-28">太 26:26-28</a>)</p></blockquote><p>不能把这祝福理解为无足轻重的空话。</p><h2>旧约中关于圣餐的预言</h2><blockquote><p>“<strong><mark>智慧建造房屋</mark></strong>，凿成七根柱子， <strong><mark>宰杀牲畜，调和旨酒，设摆筵席</mark></strong>。 打发使女出去，自己在城中至高处呼叫， 说：「谁是愚蒙人，可以转到这里来！」又对那无知的人说： 「<strong><mark>你们来，吃我的饼，喝我调和的酒</mark></strong>。 你们愚蒙人，要舍弃愚蒙，就得存活，并要走光明的道。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/9/#L1-6">箴 9:1-6</a>)</p></blockquote><blockquote><p>“「<strong><mark>你们一切干渴的都当就近水来</mark></strong>，没有银钱的也可以来。你们都来，<strong><mark>买了吃</mark></strong>，不用银钱，不用价值，也来买酒和奶。 你们为何花钱买那不足为食物的，用劳碌得来的买那不使人饱足的呢？你们要留意听我的话，就能吃那美物，得享肥甘，心中喜乐。 你们当就近我来，侧耳而听，就必得活。<strong><mark>我必与你们立永约</mark></strong>，就是应许大卫那可靠的恩典。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/55/#L1-3">赛 55:1-3</a>)</p></blockquote><blockquote><p>“<strong>智慧要称扬自己</strong>，因天主而受光荣，在她的民族中，要取得荣耀。 <…> <strong>凡渴望我的，请到我这里来，饱食我的果实。</strong> <…> <strong>凡食我的，还要饥饿；凡饮我的，还要饥渴。</strong>” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/24/#L1,26,29">德 24:1,26,29</a>)</p></blockquote><h2>对异议的回应</h2><h3>“基督把自己比作门，是比喻？”</h3><p>与民众交谈时，基督把自己比作羊圈的门：</p><blockquote><p>“所以耶稣又对他们说：「我实实在在的告诉你们，<strong><mark>我就是羊的门</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/10/#L7">约 10:7</a>)</p></blockquote><p>既然基督在这里比喻地称自己为门，那么是否意味着圣餐中关于体和血的话也应当比喻地理解？完全不是。在与门比较之前，救主讲了牧人从门进羊圈、而贼从别处爬进去的比喻。把自己比作门，救主只是结束这个比喻，向民众解释它。基督对民众总是用比喻讲话，而与门徒单独在一起时则解释一切：</p><blockquote><p>“门徒进前来，问耶稣说：「<strong><mark>对众人讲话为什么用比喻呢</mark></strong>？」 耶稣回答说：「<strong><mark>因为天国的奥祕，只叫你们知道，不叫他们知道</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/13/#L10-11">太 13:10-11</a>)</p></blockquote><blockquote><p>“<strong><mark>所以我用比喻对他们讲</mark></strong>，是因他们看也看不见，听也听不见，也不明白。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/13/#L13">太 13:13</a>)</p></blockquote><blockquote><p>“耶稣对他们说：「上帝国的奥祕，只叫你们知道，<strong><mark>若是对外人讲，凡事就用比喻</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/4/#L11">可 4:11</a>)</p></blockquote><blockquote><p>“耶稣用许多这样的比喻，照他们所能听的，对他们讲道。 <strong><mark>若不用比喻，就不对他们讲</mark></strong>，<strong><mark>没有人的时候，就把一切的道讲给门徒听</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/4/#L33-34">可 4:33-34</a>)</p></blockquote><p>在锡安的楼房里<strong>与门徒单独在一起</strong>讲圣餐时，基督没有附加任何比喻，更没有关于体和血的比喻——就是说，基督是按字面讲的，而不是比喻。与民众交谈时，基督在讲圣餐的话上也没有附加任何比喻。他从关于旧约吗哪的谈话出发。这不是比喻，而是现实。犹太人真实地吃了吗哪，为了真实地不死。为了向听众指明吗哪只是预像，主才说：他们虽然吃了吗哪，吗哪只救他们免于饥饿，最终他们还是死了（正如人人都死），而吃他的人必不死（因为这已经不是预像，而是预像所指之物——赐永恒生命的真正从天降下的粮）：</p><blockquote><p>“永活的父怎样差我来，我又因父活着；照样，<strong><mark>吃我肉的人也要因我活着</mark></strong>。 这就是从天上降下来的粮。吃这粮的人，就永远活着，<strong><mark>不像你们的祖宗吃过吗哪还是死了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/6/#L57-58">约 6:57-58</a>)</p></blockquote><h3>“我不再喝葡萄汁”</h3><p>有人反对在圣餐中对体和血作实在的理解，引用基督在最后晚餐上关于葡萄汁的话。</p><p>三位福音史家——马太、马可和路加——都讲到葡萄汁（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/26/#L29">太 26:29</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/14/#L25">可 14:25</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/22/#L18">路 22:18</a>）。路加福音史家与马可和马太不同，更详细地描述了晚餐，提到喝过的几杯：</p><h4>第一杯</h4><blockquote><p>“耶稣对他们说：「<strong><mark>我很愿意在受害以先和你们吃这逾越节的筵席</mark></strong>。 我告诉你们：我不再吃这筵席，直到成就在上帝的国里。」 <strong><mark>耶稣接过杯来，祝谢了</mark></strong>，说：「<strong><mark>你们拿这个，大家分着喝</mark></strong>。 我告诉你们，<strong><mark>从今以后，我不再喝这葡萄汁</mark></strong>，直等上帝的国来到。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/22/#L15-18">路 22:15-18</a>)</p></blockquote><p>基督吩咐把杯中的东西分给门徒。这杯被分了。到这里还没有圣餐，没有关于体和血的话；有的只是逾越节的晚餐。在这杯酒之后，基督立刻说了那句关于他不再喝葡萄汁的话：</p><blockquote><p>“我告诉你们，<strong><mark>从今以后，我不再喝这葡萄汁</mark></strong>，直等上帝的国来到。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/22/#L18">路 22:18</a>)</p></blockquote><p>而只有<strong>饭后</strong>（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/22/#L20">路 22:20</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/11/#L25">林前 11:25</a>）基督才举行圣餐：拿起饼，又拿起杯（这已是另一杯，因为第一杯已经喝了），递给门徒，只是现在才说到自己的体和血：</p><h4>第二杯</h4><blockquote><p>“又拿起饼来，祝谢了，就擘开，递给他们，说：「<strong><mark>这是我的身体，为你们舍的</mark></strong>，你们也应当如此行，为的是记念我。」 <strong><mark>饭后也照样拿起杯来</mark></strong>，说：「<strong><mark>这杯是用我血所立的新约</mark></strong>，是为你们流出来的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/22/#L19-20">路 22:19-20</a>)</p></blockquote><p>这样，在前一部分举行的只是犹太人传统的逾越节晚餐，按习俗必喝<strong>四杯酒</strong>（掺水的）并感谢上帝。圣经里没有喝这四杯酒的命令。这只是犹太人的习俗。犹太逾越节晚餐的习俗在犹太的米示拿中有详细描述：</p><p>“米示拿第一篇</p><p>（ א ）在逾越节前夕，从晚祭之前起，人不可吃到天黑。即使在以色列中最穷的人也不可以不侧身而食。并且<strong>不可少给他四杯酒</strong>，即使是从施济处领的。”</p><p>（[俄文](https://toldot.com/articles/articles_30013.html)《米示拿·应户约》第10篇）</p><p>第一次基督只是行了这习俗：拿起杯，祝谢，递给自己的门徒，一句关于这是他的血的话也没有说，只说叫他们彼此分着喝——他们显然也这样做了。杯喝了。第一次完全没提饼。饭后才说到饼，又再说到杯，并且只是这时才出现关于基督的体和血的话。所以关于葡萄汁的话属于第一杯——葡萄的酒；而关于基督的血的话属于第二杯——在其中奥秘地递给门徒的已经不是酒，而是基督真实的血，这正是我们所信的。</p><h3>“叫人活着的乃是灵，肉体是无益的”（不带来益处）</h3><p>教会圣餐教训的反对者宣称，基督只是象征性地讲到吃他的肉。他们引用下面的话：</p><blockquote><p>“叫人活着的乃是灵，<strong><mark>肉体是无益的</mark></strong>；我对你们所说的话就是灵，就是生命。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/6/#L63">约 6:63</a>)</p></blockquote><p>象征论的拥护者这样解释这些话：仿佛吃基督的肉不带来任何益处。</p><p>我们则表明，“肉体无益”的话说的是肉体式的思维——它不带来益处。这是说那些只按地上的方式思想的人，粗糙地、按世俗的方式：只用他们在自己生活中习惯见到的方式，不能把思想提升到属灵的奥秘。</p><p>在圣经里我们可以遇到许多别的地方，这样的话被用于只按地上方式思想的人：</p><blockquote><p>“耶稣对他说：「西门巴约拿，你是有福的！因为<strong><mark>这不是属血肉的指示你的</mark></strong>，乃是我在天上的父指示的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/16/#L17">太 16:17</a>)</p></blockquote><blockquote><p>“既然乐意将他儿子启示在我心里，叫我把他传在外邦人中，<strong><mark>我就没有与属血气的人商量</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/1/#L16">加 1:16</a>)</p></blockquote><blockquote><p>“<strong><mark>你们既靠圣灵入门，如今还靠肉身成全吗</mark></strong>？你们是这样的无知吗？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/3/#L3">加 3:3</a>)</p></blockquote><blockquote><p>“耶和华如此说：「<strong><mark>倚靠人血肉的膀臂</mark></strong>，心中离弃耶和华的，那人有祸了！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ier/17/#L5">耶 17:5</a>)</p></blockquote><p>这些人以为他们面前只是一个普通人、约瑟的儿子。一个普通人怎么能把自己的肉给他们吃？——只能像所有人那样：从自己身上撕下来给他们吃。这样的思维没有带给他们任何益处。他们大大地忧愁，说：“<strong>这话甚难，谁能听呢？</strong>”（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/6/#L60">约 6:60</a>），就离开了。</p><p>然而基督不是普通人，而是全能的上帝。他设立圣奥秘：在其中他赐生命的体和血以奥秘的方式、藉上帝的能力、以饼和酒的形式被分予。为此需要属灵地思想，为那理智并不总能明白的奥秘性举行留下位置，为基督话语的超越地上秩序的超性成就留下位置：</p><blockquote><p>“耶稣说：「我实实在在的告诉你们，<strong><mark>你们若不吃人子的肉，不喝人子的血，就没有生命在你们里面</mark></strong>；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/6/#L53">约 6:53</a>)</p></blockquote><h3>为什么要“吃上帝”？</h3><p>这样的问题多是穆斯林问的。新教徒也向教会提这个问题，只是形式稍有不同，实质相同。</p><p>对这个问题的回答可以很长，但这里只给出总的想法：领圣体使人进入与上帝基督最亲密的相通：不仅是属灵的，也是身体的——因为上帝造人不仅用灵魂，也用身体。</p><p>实际上，除了亚当和夏娃，每个人从出现在这个世界上的最初时刻起，就是以另一个人的身体——自己母亲的身体——为食的。如果他不是这样，就不能有生命，不能成长发育，必定灭亡——当胎儿（胚胎）不能着床时，事情正是如此。</p><p>婴儿出生时，他的身体是由母亲的身体构成的。母亲的身体交出自己，把生命给了婴儿，这样两者（母亲和婴儿）处于身体的相通之中。即使出生之后，婴儿还要长时间以母亲的身体为食，因为婴儿所喝的奶是在母亲的身体里由她的血造成的。所以，在这个意义上，奶——就是母亲的血。</p><p>两个过程（生育和圣餐）的设立都是上帝的。</p><p>认识了上帝所造的人性及其诞生和滋养的过程，在圣餐中承认类似的过程就不足为奇了——在圣餐中我们吃的已不是母亲的身体，而是基督上帝的身体；这样我们与上帝进入的不仅是属灵的，也是身体的相通——与基督完全的相通，灵与体：</p><blockquote><p>“<strong><mark>因我们是他身上的肢体</mark></strong>〔有古卷在此有『就是他的骨、他的肉』〕。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/5/#L30">弗 5:30</a>)</p></blockquote>
