  path: QR18A_基督复活前灵魂下阴间
  title: 在基督复活之前，所有人的灵魂都下到阴间
  copy_cover: true
  body: <h2>旧约的义人论他们死后下到阴间</h2><blockquote><p>“我的日子已经过了，我的谋算、我心所想望的已经断绝。 他们以黑夜为白昼说：『亮光近乎黑暗。』 <strong><mark>我若盼望阴间为我的房屋，若下榻在黑暗中</mark></strong>， 若对朽坏说：『你是我的父』；对虫说：『你是我的母亲姐妹』， 这样，<strong><mark>我的指望</mark></strong>在那里呢？我所指望的谁能看见呢？ 等到安息在尘土中，<strong><mark>这指望必下到阴间的门闩那里了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iov/17/#L11-16">伯 17:11-16</a>)</p></blockquote><blockquote><p>“他的儿女都起来安慰他，他却不肯受安慰，说：「<strong><mark>我必悲哀着下阴间到我儿子那里</mark></strong>。」约瑟的父亲就为他哀哭。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/37/#L35">创 37:35</a>)</p></blockquote><blockquote><p>“在日光之下所行的一切事上，有一件祸患，就是<strong><mark>众人所遭遇的都是一样</mark></strong>，并且世人的心充满了恶。活着的时候心里狂妄，<strong><mark>后来就归死人那里去了</mark></strong>。 <strong><mark>与一切活人相连的，那人还有指望，因为活着的狗比死了的狮子更强</mark></strong>。 活着的人知道必死，死了的人毫无所知，也不再得赏赐，他们的名无人记念。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ekl/9/#L3-5">传 9:3-5</a>)</p></blockquote><blockquote><p>“<strong><mark>谁能常活免死，救他的灵魂脱离阴间的权柄呢</mark></strong>？ <strong><mark>主啊，你从前凭你的信实向大卫立誓，要施行的慈爱在那里呢</mark></strong>？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/89/#L48-49">诗 89:48-49</a>)</p></blockquote><h2>基督复活后天上现实的改变</h2><p>要确信在基督之前，死去的义人灵魂并未达到与上帝在天上同活的生命，可以把基督之前的天上现实与基督复活之后的天上现实作一比较。</p><p>在基督之前，天上的现实曾被指示给先知摩西看——在山上，为要使先知按所看见的样式在地上建造圣殿（会幕、圣所）：</p><blockquote><p>“<strong><mark>又当为我造圣所</mark></strong>，使我可以住在他们中间。 制造帐幕和其中的一切器具，<strong><mark>都要照我所指示你的样式</mark></strong>。 &lt;…&gt; 要谨慎作这些物件，<strong><mark>都要照着在山上指示你的样式</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/25/#L8-9,40">出 25:8-9,40</a>)</p></blockquote><blockquote><p>“因为基督并不是进了<strong><mark>人手所造的圣所</mark></strong>（<strong><mark>这不过是真圣所的影像</mark></strong>），乃是进了天堂，如今为我们显在上帝面前；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/9/#L24">希 9:24</a>)</p></blockquote><p>观察旧约圣殿的<a href="https://bibleox.com/ru/ru/w/иерусалимский-храм">构造</a>和图像，我们看到：在基督的祭献之前，天上只有上帝（不可见地）临在和圣洁的天使（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L29">王上 6:29</a>）。</p><p>在基督复活和升天之后，按人性可见的上帝坐在于天上（<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/1/#L20-21">弗 1:20-21</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/3/#L21">启 3:21</a>），天使仍然临在于那里（<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/8/#L3">启 8:3</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/15/#L6">启 15:6</a>），同时义人的灵魂也出现了（<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/6/#L9-11">启 6:9-11</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/14/#L1,3-5">启 14:1,3-5</a>）。我们在神学家约翰的启示录中看到这一新的天上现实。</p><p>这样，在新的天上现实中，除了上帝和天使之外，还出现了义人的灵魂；在基督复活之前，那里并没有他们。</p><h3>旧约——圣殿中只有上帝和天使</h3><p>在基督的祭献之前，旧约中，上帝在山上把圣殿指示给先知摩西看，吩咐他在地上照所指示的样式制造一切（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/25/#L8-9,40">出 25:8-9,40</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/9/#L24">希 9:24</a>）。最终，摩西建造了圣殿：其中上帝完全不被描绘，而在上帝显现之处（约柜的施恩座）周围，安放着天使的像；同样，所有的墙壁和幔子上都有天使的图像。</p><h4>不可见的上帝</h4><p>在奉上帝之命建造的旧约圣殿中，没有上帝的像，因为上帝是不可见的。在最主要的地方只立着约柜（柜子），里面放着圣物；在柜盖上、两个革鲁宾之间，上帝显现并说话：</p><blockquote><p>“<strong><mark>我要在那里与你相会，又要从法柜施恩座上，二基路伯中间</mark></strong>，和你说我所要吩咐你传给以色列人的一切事。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/25/#L22">出 25:22</a>)</p></blockquote><h4>圣洁的天使</h4><p>圣殿到处充满了天使（革鲁宾）的图像：</p><blockquote><p>“<strong><mark>要用金子锤出两个基路伯来，安在施恩座的两头</mark></strong>。 这头作一个基路伯，那头作一个基路伯。二基路伯要接连一块，在施恩座的两头。 二基路伯要高张翅膀，遮掩施恩座。基路伯要脸对脸，朝着施恩座。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/25/#L18-20">出 25:18-20</a>)</p></blockquote><blockquote><p>“<strong><mark>他用橄榄木作两个基路伯，各高十肘，安在内殿</mark></strong>。 &lt;…&gt; <strong><mark>他将两个基路伯安在内殿里</mark></strong>。基路伯的翅膀是张开的，这基路伯的一个翅膀挨着这边的墙，那基路伯的一个翅膀挨着那边的墙，里边的两个翅膀，在殿中间彼此相接。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L23,27">王上 6:23,27</a>)</p></blockquote><blockquote><p>“又用蓝色、紫色、朱红色线和细麻织<strong><mark>幔子</mark></strong>，<strong><mark>在其上绣出基路伯来</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/3/#L14">代下 3:14</a>)</p></blockquote><blockquote><p>“……供饼的供桌、奠酒器、杯盘、金香炉、<strong>帐幔</strong>和冠冕，连圣殿正面的金饰……” (<a href="https://bibleox.com/zh-Hans/cn-sb/1mak/1/#L22">加上 1:22</a>)</p></blockquote><blockquote><p>“<strong><mark>内殿外殿周围的墙上，都刻着基路伯、棕树和初开的花</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L29">王上 6:29</a>)</p></blockquote><p>圣殿构造详见：<a href="https://bibleox.com/ru/ru/w/иерусалимский-храм">耶路撒冷圣殿</a>。</p><h3>新约——圣殿中有上帝、天使和义人的灵魂</h3><p>在上帝之子降生成人并战胜死亡之后，我们看到另一种天上现实。神学家约翰在启示录一书中描述了它。首先，上帝成为可见的，坐在宝座上。其次，在天上事奉他的不再只有天使，还有众多圣义者的灵魂。</p><h4>基督</h4><blockquote><p>“主耶稣和他们说完了话，后来被接到天上，<strong><mark>坐在上帝的右边</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/16/#L19">可 16:19</a>)</p></blockquote><blockquote><p>“就是照他在基督身上所运行的大能大力，使他从死里复活，<strong><mark>叫他在天上坐在自己的右边</mark></strong>， 远超过一切执政的、掌权的、有能的、主治的和一切有名的，不但是今世的，连来世的也都超过了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/1/#L20-21">弗 1:20-21</a>)</p></blockquote><blockquote><p>“得胜的，我要赐他<strong><mark>在我宝座上</mark></strong>与我同坐，就如我得了胜，<strong><mark>在我父的宝座上与他同坐</mark></strong>一般。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/3/#L21">启 3:21</a>)</p></blockquote><h4>圣洁的天使</h4><blockquote><p>“<strong><mark>另有一位天使</mark></strong>拿着金香炉，来站在祭坛旁边。有许多香赐给他，要和众圣徒的祈祷一同献在宝座前的金坛上。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/8/#L3">启 8:3</a>)</p></blockquote><blockquote><p>“<strong><mark>那掌管七灾的七位天使</mark></strong>从殿中出来，穿着洁白光明的细麻衣，胸间束着金带。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/15/#L6">启 15:6</a>)</p></blockquote><h4>圣义者的灵魂</h4><blockquote><p>“揭开第五印的时候，我看见在祭坛底下，<strong><mark>有为上帝的道并为作见证被杀之人的灵魂</mark></strong>， 大声喊着说：「圣洁真实的主啊！你不审判住在地上的人，给我们伸流血的冤，要等到几时呢？」 于是<strong><mark>有白衣赐给他们各人</mark></strong>，又有话对他们说：「还要安息片时，<strong><mark>等着一同作仆人的和他们的弟兄，也像他们被杀，满足了数目</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/6/#L9-11">启 6:9-11</a>)</p></blockquote><blockquote><p>“我又观看，见<strong><mark>羔羊</mark></strong>站在锡安山，同他又有<strong><mark>十四万四千人</mark></strong>，都有他的名和他父的名写在额上。 &lt;…&gt; 他们在宝座前，并在四活物和众长老前唱歌，仿佛是新歌；除了<strong><mark>从地上买来的</mark></strong>那十四万四千人以外，没有人能学这歌。 <strong><mark>这些人未曾沾染妇女</mark></strong>，他们原是童身。<strong><mark>羔羊无论往那里去，他们都跟随他</mark></strong>。他们是从人间买来的，作初熟的果子归与上帝和羔羊。 在他们口中察不出谎言来，他们是没有瑕疵的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/14/#L1,3-5">启 14:1,3-5</a>)</p></blockquote><h2>除了从天上降下的子之外，没有人升过天</h2><blockquote><p>“<strong><mark>除了从天降下仍旧在天的人子，没有人升过天</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/3/#L13">约 3:13</a>)</p></blockquote><blockquote><p>“<strong><mark>弟兄们，先祖大卫的事，我可以明明地对你们说，他死了，也葬埋了</mark></strong>，并且他的坟墓直到今日还在我们这里。 &lt;…&gt; <strong><mark>大卫并没有升到天上</mark></strong>，但自己说：『主对我主说：你坐在我的右边，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/2/#L29,34">徒 2:29,34</a>)</p></blockquote><h2>「你必不将我的灵魂撇在阴间」——不是指大卫</h2><p>大卫王在圣咏中说的预言（<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/16/#L10">诗 16:10</a>）——灵魂不被撇在阴间、肉身不见朽坏——不是指大卫，而是指基督。因此，大卫王的<strong>肉身</strong>见了朽坏，<strong>灵魂</strong>则被留在阴间，直到基督下到阴间。</p><blockquote><p>“<strong><mark>因你必不将我的灵魂撇在阴间</mark></strong>，也不叫你的圣者见朽坏。 &lt;…&gt; <strong><mark>弟兄们，先祖大卫的事，我可以明明地对你们说，他死了，也葬埋了</mark></strong>，并且他的坟墓直到今日还在我们这里。 &lt;…&gt; 就预先看明这事，<strong><mark>讲论基督复活说</mark></strong>：『<strong><mark>他的灵魂不撇在阴间；他的肉身也不见朽坏</mark></strong>。』 &lt;…&gt; <strong><mark>大卫并没有升到天上</mark></strong>，但自己说：『主对我主说：你坐在我的右边，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/2/#L27,29,31,34">徒 2:27,29,31,34</a>)</p></blockquote><h2>基督下到阴间，宣讲，亲自出来，并把义人从阴间领出</h2><p>在阴间，基督向那些从世界洪水时代起就在那里的神魂（灵魂）宣讲：</p><blockquote><p>“因基督也曾一次为罪受苦，就是义的代替不义的，为要引我们到上帝面前。<strong><mark>按着肉体说，他被治死；按着灵性说，他复活了</mark></strong>。 <strong><mark>他藉这灵曾去传道给那些在监狱里的灵听</mark></strong>， 就是那从前在挪亚预备方舟、上帝容忍等待的时候，不信从的人。当时进入方舟，借着水得救的不多，只有八个人。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/3/#L18-20">彼前 3:18-20</a>)</p></blockquote><blockquote><p>“他们必在那将要审判活人死人的主面前交账。 为此，<strong><mark>就是死人也曾有福音传给他们</mark></strong>，要叫他们的肉体按着人受审判，他们的灵性却靠上帝活着。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/4/#L5-6">彼前 4:5-6</a>)</p></blockquote><h2>义人曾被囚于阴间，但基督摧毁了这一囚禁</h2><blockquote><p>“所以经上说：『他升上高天的时候，<strong><mark>掳掠了仇敌</mark></strong>，将各样的恩赐赏给人。』 （<strong><mark>既说升上，岂不是先降在地下吗</mark></strong>？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/4/#L8-9">弗 4:8-9</a>)</p></blockquote><blockquote><p>“我一看见，就仆倒在他脚前，像死了一样。他用右手按着我说：「不要惧怕！我是首先的，我是末后的， 又是那存活的。我曾死过，现在又活了，直活到永永远远，并且<strong><mark>拿着死亡和阴间的钥匙</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/1/#L17-18">启 1:17-18</a>)</p></blockquote><h2>所有旧约的义人都没有得到所应许的；若没有新约的人，他们就不能达到完全</h2><p>他们期待并追求天上的事，但没有得到：</p><blockquote><p>“信就是<strong>所望之事的实底</strong>，是未见之事的确据。 古人在这信上得了美好的证据。 &lt;…&gt; 亚伯因着信，献祭与上帝，比该隐所献的更美，因此便得了称义的见证，就是上帝指他礼物作的见证。他虽然死了，却因这信，仍旧说话。 以诺因着信，被接去，不至于见死，人也找不着他，因为上帝已经把他接去了。只是他被接去以先，已经得了上帝喜悦他的明证。 &lt;…&gt; 挪亚因着信，既蒙上帝指示他未见的事，动了敬畏的心，预备了一只方舟，使他全家得救。因此就定了那世代的罪，自己也承受了那从信而来的义。 亚伯拉罕因着信，蒙召的时候，就遵命出去，往将来要得为业的地方去；出去的时候，还不知往那里去。 <strong><mark>他因着信，就在所应许之地作客，好像在异地居住帐棚</mark></strong>，与那同蒙一个应许的以撒、雅各一样。 <strong><mark>因为他等候那座有根基的城，就是上帝所经营、所建造的</mark></strong>。 因着信，连撒拉自己，虽然过了生育的岁数，还能怀孕，因他以为那应许他的是可信的。 &lt;…&gt; <strong><mark>这些人都是存着信心死的，并没有得着所应许的</mark></strong>，<strong><mark>却从远处望见，且欢喜迎接</mark></strong>，又承认自己在世上是客旅，是寄居的。 说这样话的人，是表明自己要找一个家乡。 他们若想念所离开的家乡，还有可以回去的机会。 <strong><mark>他们却羨慕一个更美的家乡，就是在天上的</mark></strong>。所以上帝被称为他们的上帝，并不以为耻，<strong><mark>因为他已经给他们预备了一座城</mark></strong>。 亚伯拉罕因着信，被试验的时候，就把以撒献上；这便是那欢喜领受应许的，将自己独生的儿子献上。 &lt;…&gt; 以撒因着信，就指着将来的事给雅各、以扫祝福。 雅各因着信，临死的时候，给约瑟的两个儿子各自祝福，扶着杖头敬拜上帝。 约瑟因着信，临终的时候，提到以色列族将来要出埃及，并为自己的骸骨留下遗命。 摩西生下来，他的父母见他是个俊美的孩子，就因着信，把他藏了三个月，并不怕王命。 &lt;…&gt; 我又何必再说呢？若要一一细说，基甸、巴拉、参孙、耶弗他、大卫，撒母耳和众先知的事，时候就不够了。 &lt;…&gt; <strong><mark>这些人都是因信得了美好的证据，却仍未得着所应许的</mark></strong>。 因为上帝给我们预备了更美的事，<strong><mark>叫他们若不与我们同得，就不能完全</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/11/#L1-2,4-5,7-11,13-17,20-23,32,39-40">希 11:1-2,4-5,7-11,13-17,20-23,32,39-40</a>)</p></blockquote><h2>基督的祭献使信教的义人脱离先前所犯的罪</h2><blockquote><p>“我们晓得律法上的话，都是对律法以下之人说的，好塞住各人的口，叫普世的人都伏在上帝审判之下。 所以<strong><mark>凡有血气的，没有一个因行律法能在上帝面前称义</mark></strong>，因为律法本是叫人知罪。 <strong><mark>但如今，上帝的义在律法以外已经显明出来</mark></strong>，有律法和先知为证： 就是上帝的义，<strong><mark>因信耶稣基督加给一切相信的人</mark></strong>，<strong><mark>并没有分别</mark></strong>。 <strong><mark>因为世人都犯了罪，亏缺了上帝的荣耀</mark></strong>； 如今却蒙上帝的恩典，<strong><mark>因基督耶稣的救赎</mark></strong>，<strong><mark>就白白的称义</mark></strong>。 <strong><mark>上帝设立耶稣作挽回祭</mark></strong>，是凭着耶稣的血，借着人的信，要显明上帝的义。因为他用忍耐的心，<strong><mark>宽容人先时所犯的罪</mark></strong>， <strong><mark>好在今时显明他的义</mark></strong>，使人知道他自己为义，也称信耶稣的人为义。 既是这样，那里能夸口呢？没有可夸的了！用何法没有的呢？是用立功之法吗？不是，乃用信主之法。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/3/#L19-27">罗 3:19-27</a>)</p></blockquote>
