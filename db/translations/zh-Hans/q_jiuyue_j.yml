  path: QO18A_旧约的祭司
  title: 旧约的祭司
  copy_cover: true
  body: <h2>得任祭司职</h2><h3>祭司——只有亚伦的后裔</h3><p>只有亚伦（先知摩西的弟兄）和他的后裔可以作祭司（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L1">出 28:1</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L4">出 28:4</a>）。</p><h3>大祭司职分的传承</h3><p>只有亚伦（先知摩西的弟兄）和他的后裔可以作祭司（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L1">出 28:1</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L4">出 28:4</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L9">出 29:9</a>）。大祭司的继任者要穿上圣衣，受膏七日（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L29-30">出 29:29-30</a>）。圣衣随职分一起传承（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L29">出 29:29</a>）。若外人擅自行祭司的事奉，要被治死（<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/3/#L10">民 3:10</a>）。</p><h3>对候选人的要求</h3><p>不可有身体的残疾（<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/21/#L17-21">利 21:17-21</a>）：</p><ul><li><p>瞎眼，</p></li><li><p>瘸腿，</p></li><li><p>塌鼻子，</p></li><li><p>肢体有余（折断或瘫痪的肢体），</p></li><li><p>驼背，</p></li><li><p>眼睛有毛病，</p></li><li><p>长癣的、长疥的，或损坏肾子的。</p></li></ul><h3>对祭司的要求</h3><ul><li><p>不可使头光秃，不可剃除胡须的周围（<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/21/#L1,5">利 21:1,5</a>）；</p></li><li><p>不可娶妓女或被污的女人为妻，也不可娶被休的妇人为妻（<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/21/#L7">利 21:7</a>）；大祭司只能娶处女为妻（<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/21/#L13-14">利 21:13-14</a>）；</p></li><li><p>不可挨近死尸（<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/21/#L1-4">利 21:1-4</a>）；大祭司甚至不可为死去的亲属沾染自己（<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/21/#L10-11">利 21:10-11</a>）；</p></li><li><p>大祭司要蓬头散发——头上倒了膏油、承接圣职、穿了圣衣（<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/21/#L10">利 21:10</a>）。</p></li></ul><h2>礼仪</h2><h3>简述</h3><p>经由献祭、洗身、膏油（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L41">出 28:41</a>）、弹牲畜之血、筵席而完成。受圣职需要圣衣（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L2-3">出 28:2-3</a>），圣衣随职分传承（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L29">出 29:29</a>）。</p><h3>旧约大祭司的受圣职</h3><h4>祭物</h4><p>受圣职要献无残疾的牲畜（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L1">出 29:1</a>）和细麦面作的无酵饼（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L2">出 29:2</a>）：</p><ul><li><p><strong>一只公牛犊</strong>；</p></li><li><p><strong>两只公绵羊</strong>；</p></li><li><p>调油的<strong>无酵饼</strong>；</p></li><li><p>细麦面作的<strong>无酵薄饼</strong>。</p></li></ul><p>大祭司和祭司们把手按在公牛头上，然后在会幕门口宰杀它（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L10-11">出 29:10-11</a>）（基督被杀的预像）。</p><p>用公牛的血抹在坛的四角上，把血都倒在坛脚那里（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L12">出 29:12</a>）（基督在十字架——坛——上苦难的预像）。公牛的脂油（盖脏的脂油、肝上的网子、腰子等）烧在坛上（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L13">出 29:13</a>）。公牛的皮、肉等用火烧在营外——这是赎罪祭（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L14">出 29:14</a>）。</p><p>同样，大祭司和祭司们把手按在一只公绵羊头上，宰杀它（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L16">出 29:16</a>），把血洒在坛的周围（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L15">出 29:15</a>）。把羊切成块子，洗净五脏，烧在坛上——这是献给耶和华的燔祭（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L17-18">出 29:17-18</a>）。</p><p>对最后一只公绵羊也是这样：大祭司和祭司们把手按在羊头上（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L19">出 29:19</a>），宰杀它（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L20">出 29:20</a>），把血抹在亚伦和他儿子的右耳垂上、右手的大拇指和右脚的大拇指上，并把血洒在坛的四围（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L20">出 29:20</a>）。</p><p>然后取坛上的血和膏油，弹在亚伦和他的衣服上，并他儿子和他儿子的衣服上，他们和他们的衣服就一同成圣（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L21">出 29:21</a>）。</p><p>再取这羊的脂油（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L22">出 29:22</a>）、筐子中的一个饼、一个调油的饼和一个薄饼（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L23">出 29:23</a>），放在亚伦和他儿子的手上（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L24">出 29:24</a>），然后从他们手中接过来，烧在坛上（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L25">出 29:25</a>）。公羊的胸也作为摇祭献上（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L26-28">出 29:26-28</a>）。</p><h4>洗身</h4><p>受圣职之前先用水洗身（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L4">出 29:4</a>）。</p><h4>穿上圣衣</h4><p>洗身之后，给他穿上圣衣（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L5-6">出 29:5-6</a>）。祭司们也穿上圣衣（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L8-9">出 29:8-9</a>）。</p><h4>把膏油倒在头上</h4><p>穿衣之后，把膏油倒在他头上膏他（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L7">出 29:7</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L41">出 28:41</a>）。</p><h4>筵席</h4><p>公羊的肉煮在圣处（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L31">出 29:31</a>），然后大祭司和祭司们要在会幕门口吃这羊的肉（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L32">出 29:32</a>）。外人不可参与这筵席（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L33">出 29:33</a>）。若肉或饼留到早晨，就要用火烧了（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L34">出 29:34</a>）。</p><h4>七天中重复</h4><p>整个献祭与成圣的礼仪重复七天（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L35">出 29:35</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/8/#L33-34">利 8:33-34</a>）。结果，坛就成为至圣：凡挨着坛的都成为圣（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L37">出 29:37</a>）（成为圣物的基督十字架的预像）。</p><h2>圣衣</h2><h3>用途</h3><p>为荣耀、为华美、为成圣（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L2-3">出 28:2-3</a>）；为传承大祭司的职分（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L29">出 29:29</a>）。</p><h3>全套</h3><p>大祭司圣衣的全套包括（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L4">出 28:4</a>）：</p><ul><li><p><strong>胸牌</strong>，</p></li><li><p><strong>以弗得</strong>（外衣），</p></li><li><p><strong>外袍</strong>（以弗得的外袍），</p></li><li><p><strong>杂色的内袍</strong>（贴身衣物），</p></li><li><p><strong>冠冕</strong>（头饰），</p></li><li><p><strong>腰带</strong>。</p></li></ul><h3>以弗得（无袖外衣）</h3><p>用金线和蓝色、紫色、朱红色线，并捻的细麻制成（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L5-6">出 28:5-6</a>）。</p><h4>肩带</h4><p>以弗得不是一整块，而是由前后两部分构成，因此在肩上以「肩带」相连（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L7">出 28:7</a>）。</p><p>为两条肩带制了两块宝石（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L12">出 28:12</a>）：金槽中的红玛瑙（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L10">出 28:10</a>）。在这些宝石上刻着以色列十二支派的名字（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L9">出 28:9</a>）：一块宝石上六个名字，另一块上六个名字，按出生的次序（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L10">出 28:10</a>）。宝石安在金槽中，并有金鍊子装饰（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L13-14">出 28:13-14</a>）。</p><p>以弗得的边上（大概在腰带附近）有两个环，用来固定胸牌（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L28">出 28:28</a>）。</p><h3>腰带</h3><p>腰带穿在以弗得外面，用与以弗得同样的材料制成：金线和蓝色、紫色、朱红色线，并捻的细麻（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L8">出 28:8</a>）。腰带用绣花的手工制成（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L39">出 28:39</a>）。</p><h3>胸牌（护胸）</h3><p>叠为两层的方形布片（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L16">出 28:16</a>）。尺寸：23×23厘米（一虎口见方）（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L16">出 28:16</a>）。虎口——大拇指与食指张开的距离，约23厘米。用与以弗得相同的材料制成（金线、细麻与线）（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L15">出 28:15</a>）。</p><p>在这块布片上镶着12块宝石。每行3块列举（共4行，<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L17">出 28:17</a>）：</p><ul><li><p>红宝石、红璧玺、红玉（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L17">出 28:17</a>）；</p></li><li><p>绿宝石、蓝宝石、金钢石（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L18">出 28:18</a>）；</p></li><li><p>紫玛瑙、白玛瑙、紫晶（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L19">出 28:19</a>）；</p></li><li><p>绿玛瑙、红玛瑙、碧玉（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L19">出 28:19</a>）。</p></li></ul><p>宝石上刻着以色列十二个支派的名字，每块一个名字（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L21">出 28:21</a>）。</p><p>胸牌固定在肩带上（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L23">出 28:23</a>）。为此，胸牌的上两角有两个金环（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L23">出 28:23</a>），环中穿过金鍊子（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L24">出 28:24</a>）——精金拧成如绳的鍊子（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L22">出 28:22</a>），鍊子的另一头接在以弗得前面肩带的槽上（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L22">出 28:22</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L25">出 28:25</a>）。</p><p>胸牌的下两角有4个金环：两个在以弗得里面的边上（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L26">出 28:26</a>），两个在以弗得前面肩带的下边（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L27">出 28:27</a>）。胸牌用蓝细带子系在这几个环上（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L28">出 28:28</a>）——系在以弗得的环子上（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L28">出 28:28</a>），使它不从以弗得上滑落，保持在腰带以上（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L28">出 28:28</a>）。</p><p>每次进圣所（圣殿）时都要戴上胸牌（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L29">出 28:29</a>）。</p><h4>乌陵和土明</h4><p>胸牌里面（因为它由叠为两层的布片构成），如同<a href="https://bibleox.com/ru/ru/w/ковчег_завета">约柜</a>一样，放着神秘的物件：<strong>乌陵和土明</strong>[1][2]，教会斯拉夫语译本作<strong>显现与真理</strong>（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L30">出 28:30</a>（教会斯拉夫语本））。大祭司要把它们带在胸前（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L30">出 28:30</a>）。</p><h3>外袍</h3><p>用全蓝的布料制成（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L31">出 28:31</a>）。袍上要为头留一领口（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L32">出 28:32</a>）。领口周围织出领边，免得破裂（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L32">出 28:32</a>）。</p><p>袍子周围底边上，用蓝色、紫色、朱红色线作石榴，在石榴中间要有金铃铛（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L33">出 28:33</a>）：一个金铃铛一个石榴，在袍子周围的底边上（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L34">出 28:34</a>）。</p><h3>冠冕（头饰）</h3><p>头饰用细麻布作成（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L39">出 28:39</a>）。</p><h4>金牌</h4><p>冠冕上系着精金作的牌，上面按刻图书之法刻着「归耶和华为圣」（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L36">出 28:36</a>）。牌用一条蓝细带子系在冠冕的前面（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L37">出 28:37</a>），并在额上（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L38">出 28:38</a>）。</p><h3>内袍</h3><p>内袍用杂色细麻线织成（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L39">出 28:39</a>）。遮掩下体，从腰达到大腿（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L42">出 28:42</a>）。</p><h2>平常的祭司</h2><p>平常祭司的衣服没有详细记述。衣服为他们而作，为荣耀，为华美（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L40">出 28:40</a>）。</p><p>祭司要有内袍（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L40">出 28:40</a>）、绣花的手工腰带（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L39-40">出 28:39-40</a>）、裹头巾（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L40">出 28:40</a>）。</p><p>这衣服要在进会幕或就近坛、在圣所供职时穿上（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/28/#L43">出 28:43</a>）。</p><h2>祭献</h2><p>每天在会幕门口（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L42">出 29:42</a>）要献<strong>两只一岁的羊羔</strong>（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L38">出 29:38</a>）：早晨献一只，黄昏的时候献那一只（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L39">出 29:39</a>）。</p><p>与羊羔同献的，有<strong>细面</strong>、<strong>油</strong>和<strong>酒</strong>（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L40">出 29:40</a>）。</p><p>献祭之地要因上帝的荣耀成为圣（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L43">出 29:43</a>）。</p>
