  path: Qg3A_上帝是善的根源
  title: 上帝是善的根源，不是恶的根源
  copy_cover: true
  body: <h2>上帝是善的根源，不是恶的根源</h2><blockquote><p>“人被试探，不可说：『我是被上帝试探』，因为<strong><mark>上帝不能被恶试探，他也不试探人</mark></strong>。 &lt;…&gt; 各样美善的恩赐和各样全备的赏赐都是从上头来的，从众光之父那里降下来的；在他并没有改变，也没有转动的影儿。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/1/#L13,17">雅 1:13,17</a>)</p></blockquote><blockquote><p>“<strong><mark>上帝就是光，在他毫无黑暗</mark></strong>！这是我们从主所听见、又报给你们的信息。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/1/#L5">约壹 1:5</a>)</p></blockquote><blockquote><p>“耶稣对他说：「你为什么以善事问我呢？只有一位是善的〔有古卷作『你为什么称我是良善的？<strong><mark>除了上帝以外，没有一个良善的</mark></strong>』〕。你若要进入永生，就当遵守诫命。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/19/#L17">太 19:17</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/mk/10/#L18">可 10:18</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/lk/18/#L19">路 18:19</a>)</p></blockquote><blockquote><p>“<strong><mark>耶和华善待万民</mark></strong>，他的慈悲覆庇他一切所造的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/145/#L9">诗 145:9</a>)</p></blockquote><h2>无罪的</h2><blockquote><p>“你们知道主曾显现，是要除掉人的罪，<strong><mark>在他并没有罪</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/3/#L5">约壹 3:5</a>)</p></blockquote><blockquote><p>“凡犯罪的，就是违背律法；违背律法，就是罪。 &lt;…&gt; <strong><mark>犯罪的是属魔鬼</mark></strong>，因为魔鬼从起初就犯罪。上帝的儿子显现出来，为要除灭魔鬼的作为。 <strong>凡从上帝生的，就不犯罪</strong>，因上帝的道存在他心里；他也不能犯罪，因为他是由上帝生的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/3/#L4,8-9">约壹 3:4,8-9</a>)</p></blockquote><h2>上帝是爱</h2><blockquote><p>“没有爱心的，就不认识上帝，因为<strong><mark>上帝就是爱</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/4/#L8">约壹 4:8</a>)</p></blockquote><blockquote><p>“上帝爱我们的心，我们也知道、也信。<strong><mark>上帝就是爱！</mark></strong><strong>住在爱里面的，就是住在上帝里面</strong>，上帝也住在他里面。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/4/#L16">约壹 4:16</a>)</p></blockquote><h2>上帝愿意万人得救</h2><blockquote><p>“我劝你第一要为万人恳求、祷告、代求、祝谢， &lt;…&gt; 这是好的，在上帝我们救主面前可蒙悦纳。 <strong><mark>他愿意万人得救</mark></strong>，明白真道。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/2/#L1,3-4">提前 2:1,3-4</a>)</p></blockquote><blockquote><p>“<strong><mark>主</mark></strong>所应许的尚未成就，有人以为他是耽延，其实不是耽延，乃是宽容你们，<strong><mark>不愿有一人沉沦，乃愿人人都悔改</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2pet/3/#L9">彼后 3:9</a>)</p></blockquote><blockquote><p>“你对他们说：『主耶和华说：我指着我的永生起誓，<strong><mark>我断不喜悦恶人死亡，惟喜悦恶人转离所行的道而活</mark></strong>。以色列家阿，你们转回，转回吧！离开恶道，何必死亡呢？』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iez/33/#L11">结 33:11</a>)</p></blockquote><blockquote><p>“主耶和华说，<strong><mark>恶人死亡，岂是我喜悦的吗？</mark></strong><strong>不是喜悦他回头离开所行的道存活吗？</strong>” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iez/18/#L23">结 18:23</a>)</p></blockquote><blockquote><p>“<strong><mark>上帝爱世人</mark></strong>，<strong>甚至将他的独生子赐给他们，叫一切信他的，不至灭亡，反得永生</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/3/#L16">约 3:16</a>)</p></blockquote><blockquote><p>“<strong>人子来</strong>，<strong><mark>为要寻找、拯救失丧的人</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/19/#L10">路 19:10</a>)</p></blockquote><p>不过，并非所有人都会得救：<a href="https://bibleox.com/ru/ru/w/спасутся-не-все">并非所有人都得救</a></p>
