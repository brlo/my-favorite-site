  title: 上帝向寻求他的人显现
  copy_cover: true
  body: <blockquote><p>“爱我的，我也爱他；<strong>恳切寻求我的，必寻得见</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/8/#L17">箴 8:17</a>)</p></blockquote><blockquote><p>“我儿所罗门哪，你当认识耶和华你父的上帝，诚心乐意地事奉他。因为他鉴察众人的心，知道一切心思意念。<strong>你若寻求他，他必使你寻见</strong>；你若离弃他，他必永远丢弃你！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1par/28/#L9">代上 28:9</a>)</p></blockquote><blockquote><p>“耶和华啊！认识你名的人要倚靠你，<strong>因你没有离弃寻求你的人</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/9/#L10">诗 9:10</a>)</p></blockquote><blockquote><p>“耶和华从天上垂看世人，要看<strong>有明白的没有，有寻求上帝的没有</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/14/#L2">诗 14:2</a>)</p></blockquote><blockquote><p>“<strong>我曾寻求耶和华，他就应允我</strong>；救我脱离了一切的恐惧。 <strong>凡仰望他的，便有光荣</strong>；他们的脸，必不蒙羞。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/34/#L4-5">诗 34:4-5</a>)</p></blockquote><blockquote><p>“少壮狮子还缺食忍饿，但<strong>寻求耶和华的，什么好处都不缺</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/34/#L10">诗 34:10</a>)</p></blockquote><blockquote><p>“「你们这追求公义、<strong>寻求耶和华的</strong>，当听我言！你们要追想被凿而出的磐石，被挖而出的巖穴。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/51/#L1">赛 51:1</a>)</p></blockquote><blockquote><p>“你们祈求，就给你们；<strong>寻找，就寻见</strong>；叩门，就给你们开门。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/7/#L7">太 7:7</a>)</p></blockquote><blockquote><p>“人非有信，就不能得上帝的喜悦；因为到上帝面前来的人，必须信有上帝，<strong>且信他赏赐那寻求他的人</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/11/#L6">希 11:6</a>)</p></blockquote><blockquote><p>“还是你藐视他丰富的恩慈、宽容、忍耐，不晓得他的恩慈是领你悔改呢？ 你竟任着你刚硬不悔改的心，为自己积蓄忿怒，以致上帝震怒，显他公义审判的日子来到。 他必<strong>照各人的行为报应各人</strong>。 凡<strong>恒心行善，寻求荣耀、尊贵和不能朽坏之福的，就以永生报应他们</strong>； 惟有<strong>结党不顺从真理</strong>，反顺从不义的，就以<strong>忿怒、恼恨</strong>报应他们。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/2/#L4-8">罗 2:4-8</a>)</p></blockquote><blockquote><p>“要以他的圣名夸耀，<strong>寻求耶和华的人，心中应当欢喜</strong>。 <strong>要寻求耶和华与他的能力</strong>，时常寻求他的面。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/105/#L3-4">诗 105:3-4</a>)</p></blockquote>
  meta_desc: "「你若寻求他，他必使你寻见」"
