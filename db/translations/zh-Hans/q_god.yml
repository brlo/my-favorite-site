- src: Бог-вечен
  path: Qg10A_永恒的上帝
  title: 永恒的上帝
  copy_cover: true
  body: <h2>永恒的上帝</h2><blockquote><p>“你岂不曾知道吗？你岂不曾听见吗？<strong>永在的上帝耶和华</strong>，创造地极的主，并不疲乏，也不困倦，他的智慧无法测度。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/40/#L28">赛 40:28</a>)</p></blockquote><blockquote><p>“亚伯拉罕在别是巴栽上一棵垂丝柳树，又在那里求告耶和华<strong>永生上帝</strong>的名。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/21/#L33">创 21:33</a>)</p></blockquote><blockquote><p>“你们当倚靠耶和华直到永远，因为<strong>耶和华是永久的磐石</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/26/#L4">赛 26:4</a>)</p></blockquote><blockquote><p>“因为那至高至上、<strong>永远长存</strong>、名为圣者的如此说：「我住在至高至圣的所在，也与心灵痛悔、谦卑的人同居；要使谦卑人的灵甦醒，也使痛悔人的心苏醒。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/57/#L15">赛 57:15</a>)</p></blockquote><blockquote><p>“惟耶和华<strong>坐着为王，直到永远</strong>；他已经为审判设摆他的宝座。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/9/#L7">诗 9:7</a>)</p></blockquote><blockquote><p>“你们多峰多岭的山哪，为何斜看上帝所愿居住的山？<strong>耶和华必住这山，直到永远</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/68/#L16">诗 68:16</a>)</p></blockquote><blockquote><p>“你起初立了地的根基，天也是你手所造的。 <strong>天地都要灭没，你却要长存</strong>；天地都要如外衣渐渐旧了，你要将天地如里衣更换，天地就都改变了。 <strong>惟有你永不改变，你的年数没有穷尽</strong>！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/102/#L25-27">诗 102:25-27</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/evr/1/#L10-12">希 1:10-12</a>)</p></blockquote><blockquote><p>“日头不再作你白昼的光，月亮也不再发光照耀你；<strong>耶和华却要作你永远的光</strong>，你上帝要为你的荣耀！ 你的日头不再下落，你的月亮也不退缩；因为耶和华必作你永远的光，你悲哀的日子也完毕了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/60/#L19-20">赛 60:19-20</a>)</p></blockquote><blockquote><p>“我听见那站在河水以上、穿细麻衣的，向天举起左右手，指着<strong>活到永远的主</strong>起誓说：「要到一载、二载、半载，打破圣民权力的时候，这一切事就都应验了。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/dan/12/#L7">但 12:7</a>)</p></blockquote><h2>上帝直到永远作王</h2><blockquote><p>“<strong>耶和华必作王，直到永永远远</strong>！」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/15/#L18">出 15:18</a>)</p></blockquote><blockquote><p>“惟耶和华是真上帝，是活上帝，是<strong>永远的王</strong>！他一发怒，大地震动；他一恼恨，列国都担当不起。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ier/10/#L10">耶 10:10</a>)</p></blockquote><blockquote><p>“我在夜间的异象中观看，见<strong>有一位像人子的</strong>，驾着天云而来，被领到亘古常在者面前； <strong>得了权柄、荣耀、国度</strong>，使各方、各国、各族的人都事奉他。<strong>他的权柄是永远的，不能废去，他的国必不败坏</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/dan/7/#L13-14">但 7:13-14</a>)</p></blockquote><blockquote><p>“上帝阿！<strong>你的宝座是永永远远的</strong>，你的国权是正直的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/45/#L6">诗 45:6</a>)</p></blockquote><blockquote><p>“他要<strong>作雅各家的王，直到永远</strong>；<strong>他的国也没有穷尽</strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/1/#L33">路 1:33</a>)</p></blockquote><blockquote><p>“这样，必叫你们丰丰富富的得以进入我们主救主耶稣基督<strong>永远的国</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2pet/1/#L11">彼后 1:11</a>)</p></blockquote><h2>上帝存在于时间之先，并贯穿全部时间（永恒的）</h2><blockquote><p>“上主并未允许圣者讲论他的一切奇事，全能的上主建立了这些奇事，为叫天地万物愈发显扬自己的光荣。&lt;…&gt; 他井然布置了自己智慧的伟业，<strong>他从永远直到永远常常存在</strong>；” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/42/#L17,21">德 42:17,21</a>)</p></blockquote><blockquote><p>“盼望那无谎言的上帝在<strong>万古之先</strong>所应许的永生，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/tit/1/#L2">多 1:2</a>)</p></blockquote>
  meta_desc: 上帝是永恒的：无始无终，直到永远作王
