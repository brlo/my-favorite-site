  body: <ul><li><p>首先的，末后的（<a href="https://bibleox.com/zh-Hans/cn-cuv/is/44/#L6">赛 44:6</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/is/48/#L12">赛 48:12</a>）</p></li><li><p>你们祖宗的上帝，亚伯拉罕的上帝，以撒的上帝，雅各的上帝（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/3/#L15">出 3:15</a>）</p></li><li><p>自有永有的（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/3/#L14">出 3:14</a>）</p></li><li><p>爱（<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/4/#L8">约壹 4:8</a>）</p></li><li><p>造他的主（<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/149/#L2">诗 149:2</a>）</p></li><li><p>父（<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/32/#L6">申 32:6</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/is/64/#L8">赛 64:8</a>）</p></li><li><p>救赎主（<a href="https://bibleox.com/zh-Hans/cn-cuv/is/43/#L14">赛 43:14</a>）</p></li><li><p>医治你的（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/15/#L26">出 15:26</a>）</p></li><li><p>圣洁的（<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/21/#L8">利 21:8</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/11/#L44-45">利 11:44-45</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/is/40/#L25">赛 40:25</a>）</p></li><li><p>叫你们成为圣的（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/31/#L13">出 31:13</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/20/#L8">利 20:8</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/21/#L15,23">利 21:15,23</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/22/#L9,16,32">利 22:9,16,32</a>）</p></li><li><p>自隐的上帝（<a href="https://bibleox.com/zh-Hans/cn-cuv/is/45/#L15">赛 45:15</a>）</p></li><li><p>公义、正直的（<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/32/#L4">申 32:4</a>）</p></li><li><p>诚实无伪的（<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/32/#L4">申 32:4</a>）</p></li><li><p>忌邪的（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/34/#L14">出 34:14</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/20/#L5">出 20:5</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/4/#L24">申 4:24</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/5/#L9">申 5:9</a>）</p></li><li><p>击打的（<a href="https://bibleox.com/zh-Hans/cn-cuv/iez/7/#L9">结 7:9</a>）</p></li><li><p>光（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/12/#L46">约 12:46</a>）</p></li><li><p>烈火（<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/4/#L24">申 4:24</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/12/#L29">希 12:29</a>）</p></li></ul><p>参见：<a href="https://bibleox.com/ru/ru/w/Христос-титулы">基督的名号</a></p><p>*本文尚待补充*</p>
