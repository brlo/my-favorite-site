- src: Бог-неизменен
  path: Qg7A_上帝永不改变
  title: 上帝永不改变
  copy_cover: true
  body: <p>在上帝没有改变：</p><blockquote><p>“因我耶和华是<strong>不改变</strong>的，所以你们雅各之子没有灭亡。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mal/3/#L6">玛 3:6</a>)</p></blockquote><blockquote><p>“各样美善的恩赐和各样全备的赏赐都是从上头来的，从众光之父那里降下来的；<strong>在他并没有改变，也没有转动的影儿</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/1/#L17">雅 1:17</a>)</p></blockquote><blockquote><p>“<strong>上帝非人</strong>，必不致说谎。<strong>也非人子，必不致后悔</strong>。他说话岂不照着行呢？他发言岂不要成就呢？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/23/#L19">民 23:19</a>)</p></blockquote><blockquote><p>“你起初立了地的根基，天也是你手所造的。 天地都要灭没，你却要长存；天地都要如外衣渐渐旧了，你要将天地如里衣更换，天地就都改变了。 <strong>惟有你永不改变，你的年数没有穷尽</strong>！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/102/#L25-27">诗 102:25-27</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/evr/1/#L10-12">希 1:10-12</a>)</p></blockquote><blockquote><p>“耶稣基督，<strong>昨日、今日、一直到永远是一样的</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/13/#L8">希 13:8</a>)</p></blockquote><p>上帝自创造世界以来没有改变：</p><blockquote><p>“上主并未允许圣者讲论他的一切奇事，全能的上主建立了这些奇事，为叫天地万物愈发显扬自己的光荣。&lt;…&gt; 他井然布置了自己智慧的伟业，他从永远直到永远常常存在；对他，<strong>什么也不能增加，什么也不能减少</strong>；他不需要任何人的计谋。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/42/#L17,21-22">德 42:17,21-22</a>)</p></blockquote><p>上帝不废弃自己的话：</p><blockquote><p>“盼望那<strong>无谎言的上帝</strong>在万古之先所应许的永生，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/tit/1/#L2">多 1:2</a>)</p></blockquote><blockquote><p>“我必不背弃我的约，<strong>也不改变我口中所出的</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/89/#L34">诗 89:34</a>)</p></blockquote>
