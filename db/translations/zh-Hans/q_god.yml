- src: Бог-безначальный
  path: Qg8A_无始的上帝
  title: 无始的上帝
  copy_cover: true
  body: <blockquote><p>“父老啊，我曾写信给你们，因为你们认识<strong>那从起初原有的</strong>。少年人哪，我曾写信给你们，因为你们刚强，上帝的道常存在你们心里，你们也胜了那恶者。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/2/#L14">约壹 2:14</a>)</p></blockquote><p>上帝是一切有开始之物的起始：</p><blockquote><p>“太初有道，道与上帝同在，道就是上帝。 &lt;…&gt; 万物是借着他造的；<strong>凡被造的，没有一样不是借着他造的</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/1/#L1,3">约 1:1,3</a>)</p></blockquote><p>祭司麦基洗德是上帝之子的预表——无生之始、无命之终（无始的）：</p><blockquote><p>“他无父、无母、无族谱、<strong>无生之始、无命之终，乃是与上帝的儿子相似</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/7/#L3">希 7:3</a>)</p></blockquote>
  meta_desc: 上帝是一切有开始之物的起始
