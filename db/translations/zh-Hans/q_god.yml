- src: Бог-везде
  path: Qg9A_无所不在的上帝
  title: 无所不在的上帝
  copy_cover: true
  body: <blockquote><p>“这样的知识奇妙，是我不能测的；至高，是我不能及的。 <strong>我往那里去躲避你的灵？我往那里逃躲避你的面？</strong> 我若<strong>升到天上，你在那里</strong>；我若<strong>在阴间下榻，你也在那里</strong>。 我若展开清晨的翅膀，飞到<strong>海极居住</strong>； 就是在那里，你的手必引导我，你的右手也必扶持我。 我若说：「黑暗必定遮蔽我，我周围的亮光必成为黑夜，」 <strong>黑暗也不能遮蔽我使你不见</strong>，黑夜却如白昼发亮。黑暗和光明，在你看都是一样。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/139/#L6-12">诗 139:6-12</a>)</p></blockquote><blockquote><p>“各人的功行，都在他面前，<strong>没有什么可瞒过他的眼目</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/39/#L24">德 39:24</a>)</p></blockquote>
  meta_desc: 上帝无处不在，没有边界
  menu:
