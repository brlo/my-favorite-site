  path: Qg11A_不朽的上帝
  title: 不朽的上帝
  copy_cover: true
  body: <blockquote><p>“我<strong>在叫万物生活的上帝面前</strong>，并在向本丢彼拉多作过那美好见证的基督耶稣面前嘱咐你： &lt;…&gt; 就是那<strong>独一不死</strong>，住在人不能靠近的光里，是人未曾看见，也是不能看见的，要将他显明出来。但愿尊贵和永远的权能都归给他。阿们！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/6/#L13,16">提前 6:13,16</a>)</p></blockquote>
