  path: Qg2A_上帝是三位
  title: 上帝是三位
  copy_cover: true
  body: <h2>上帝是一位，但他并非在自己里面是孤单的一位</h2><blockquote><p>“<strong>上帝说</strong>：「<strong><mark>我们要</mark></strong><strong>照着我们的形像，按着我们的样式</strong>造人。使他们管理海里的鱼、空中的鸟、地上的牲畜和全地，并地上所爬的一切昆虫。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/1/#L26">创 1:26</a>)</p></blockquote><blockquote><p>“<strong>耶和华上帝说</strong>：「那人已经<strong><mark>与我们相似</mark></strong>，能知道善恶。现在恐怕他伸手又摘生命树的果子吃，就永远活着。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/3/#L22">创 3:22</a>)</p></blockquote><h2>独一的上帝在位格上是三位：圣父、圣子和圣灵</h2><ul><li><p><a href="https://bibleox.com/ru/ru/w/Бог-один">上帝是唯一的上帝</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/Отец-Бог">圣父是上帝</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/Христос-Бог">上帝之子是上帝</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/СвятойДух-Бог">圣灵是上帝</a></p></li></ul><h2>上帝之子与父原为一</h2><blockquote><p>“<strong>我与父原为一</strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/10/#L30">约 10:30</a>)</p></blockquote><blockquote><p>“<strong>凡父所有的都是我的</strong>，所以我说，他要将受于我的告诉你们。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/16/#L15">约 16:15</a>)</p></blockquote><h2>圣灵从父出来</h2><blockquote><p>“但我要从父那里差保惠师来，就是<strong>从父出来真理的圣灵，他来了</strong>，就要为我作见证。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/15/#L26">约 15:26</a>)</p></blockquote><p><strong>本文尚待补充</strong></p>
