  title: 全能的上帝
  copy_cover: true
  body: <h2>全能的上帝</h2><blockquote><p>“亚伯兰年九十九岁的时候，耶和华向他显现，对他说：「<strong>我是全能的上帝</strong>，你当在我面前作完全人。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/17/#L1">创 17:1</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/gen/28/#L3">创 28:3</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/gen/35/#L11">创 35:11</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/gen/43/#L14">创 43:14</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/gen/48/#L3">创 48:3</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/gen/49/#L25">创 49:25</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/chis/24/#L4">民 24:4</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/chis/24/#L16">民 24:16</a>; <a href="https://bibleox.com/zh-Hans/cn-sb/prsir/46/#L8">德 46:8</a>; <a href="https://bibleox.com/zh-Hans/cn-sb/prsir/46/#L19">德 46:19</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/is/10/#L34">赛 10:34</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/is/13/#L6">赛 13:6</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/iez/1/#L24">结 1:24</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/iez/10/#L5">结 10:5</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/iol/1/#L15">珥 1:15</a>)</p></blockquote><blockquote><p>“我从前向亚伯拉罕、以撒、雅各显现为<strong>全能的上帝</strong>，至于我名耶和华，他们未曾知道。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/6/#L3">出 6:3</a>)</p></blockquote><blockquote><p>“「我知道<strong>你万事都能作</strong>，<strong>你的旨意不能拦阻</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iov/42/#L2">伯 42:2</a>)</p></blockquote><blockquote><p>“但是，你怜悯众生，因为你是<strong>无所不能的</strong>，你假装看不见人罪，是为叫罪人悔改。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prs/11/#L24">智 11:24</a>)</p></blockquote><blockquote><p>“住在至高者隐密处的，必住在<strong>全能者</strong>的荫下。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/91/#L1">诗 91:1</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/ps/68/#L14">诗 68:14</a>)</p></blockquote><blockquote><p>“为此，如果有人不相信你具有<strong>绝对的权威</strong>，你就将你的权力显示出来；如果他们知道而仍胆大妄为，你就予以惩罚。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prs/12/#L17;">智 12:17;</a>)</p></blockquote><blockquote><p>“以及<strong>全能上帝</strong>的气息，他创造万物，鉴察大地隐秘中的一切隐秘。” (<a href="https://bibleox.com/zh-Hans/ru/3ezd/16/#L63">厄四 16:63</a>, 俄文原文无中文经文，此处自译)</p></blockquote><blockquote><p>“主耶和华啊，你曾用大能和伸出来的膀臂创造天地，<strong>在你没有难成的事</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ier/32/#L17">耶 32:17</a>)</p></blockquote><blockquote><p>“「我是耶和华，是凡有血气者的上帝，<strong>岂有我难成的事吗？</strong>” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ier/32/#L27">耶 32:27</a>)</p></blockquote><blockquote><p>“耶稣说：「<strong>在人所不能的事，在上帝却能</strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/18/#L27">路 18:27</a>)</p></blockquote><blockquote><p>“耶稣看着他们，说：「在人是不能，在上帝却不然，因为<strong>上帝凡事都能</strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/10/#L27">可 10:27</a>)</p></blockquote><h2>上帝怎样思想，就必怎样成就</h2><blockquote><p>“万军之耶和华起誓说：「<strong>我怎样思想，必照样成就；我怎样定意，必照样成立</strong>， &lt;…&gt; 这是向全地所定的旨意，这是向万国所伸出的手。 <strong>万军之耶和华既然定意，谁能废弃呢？他的手已经伸出，谁能转回呢？</strong>” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/14/#L24,26-27">赛 14:24,26-27</a>)</p></blockquote>
  meta_desc: 对上帝来说没有难成的事——圣经引文
