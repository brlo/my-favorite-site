- src: Бог-не-похож-на-человека-внешне
  path: Qg14A_上帝不像人的外貌
  title: 上帝不像人的外貌
  copy_cover: true
  body: <p>虽然上帝照着自己的形像造了人：</p><blockquote><p>“<strong>上帝就照着自己的形像造人</strong>，乃是照着他的形像造男造女。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/1/#L27">创 1:27</a>)</p></blockquote><p>但这并不是说，上帝在外形上像人。这并不是说，上帝有手、有脚、有眼睛、有耳朵等等：</p><blockquote><p>“<strong>你的眼岂是肉眼？你查看岂像人查看吗？</strong> 你的日子岂像人的日子？你的年岁岂像人的年岁？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iov/10/#L4-5">伯 10:4-5</a>)</p></blockquote><blockquote><p>“耶和华说：「<strong>我的意念非同你们的意念，我的道路非同你们的道路</strong>。 天怎样高过地，照样，<strong>我的道路高过你们的道路，我的意念高过你们的意念</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/55/#L8-9">赛 55:8-9</a>)</p></blockquote><blockquote><p>“<strong>上帝非人</strong>，必不致说谎。也非人子，必不致后悔。他说话岂不照着行呢？他发言岂不要成就呢？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/23/#L19">民 23:19</a>)</p></blockquote><p>人<a href="https://bibleox.com/ru/ru/w/состав-человека">由灵、魂和身体组成</a>。但上帝不是由肉体组成的。上帝是个灵：</p><blockquote><p>“<strong>上帝是个灵</strong>，所以拜他的，必须用心灵和诚实拜他。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/4/#L24">约 4:24</a>)</p></blockquote><p>上帝根本不是由物质组成的，因为在世界和物质被造之先，他已经存在：</p><blockquote><p>“太初有道，道与上帝同在，道就是上帝。 &lt;…&gt; 万物是借着他造的；<strong>凡被造的，没有一样不是借着他造的</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/1/#L1,3">约 1:1,3</a>)</p></blockquote><p><hr></p><p><p><em>*这里说的是上帝的本质。是的，上帝成了人（不是像人的人，而是真的人），从此我们也可以把他当作人来讲论。然而，成为人的上帝并没有终止他先前所是的——上帝。这里说的正是上帝的本质。</em></p></p>
  meta_desc: 上帝在外形上不像人——圣经引文
