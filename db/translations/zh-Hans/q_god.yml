- src: Бог-нелицеприятный
  path: Qg13A_上帝不偏待人
  title: 上帝不偏待人
  copy_cover: true
  body: <blockquote><p>“<strong>他待王子不徇情面</strong>，<strong>也不看重富足的过于贫穷的</strong>，<strong>因为都是他手所造</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iov/34/#L19">伯 34:19</a>)</p></blockquote><blockquote><p>“现在你们应当敬畏耶和华，谨慎办事，因为耶和华我们的上帝没有不义，<strong>不偏待人</strong>，也不受贿赂。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/19/#L7">代下 19:7</a>)</p></blockquote><blockquote><p>“你不要依靠不义的祭品，因为上主是审判者，<strong>决不看情面</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/35/#L15">德 35:15</a>)</p></blockquote><blockquote><p>“他们来了，就对他说：「夫子，我们知道你是诚实的，<strong>什么人你都不徇情面</strong>，因为你<strong>不看人的外貌</strong>，乃是诚诚实实传上帝的道。纳税给该撒可以不可以？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/12/#L14">可 12:14</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/lk/20/#L21">路 20:21</a>)</p></blockquote><blockquote><p>“因为上帝<strong>不偏待人</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/2/#L11">罗 2:11</a>)</p></blockquote><blockquote><p>“你们作主人的待仆人也是一理，不要威吓他们，因为知道他们和你们同有一位主在天上，<strong>他并不偏待人</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/6/#L9">弗 6:9</a>)</p></blockquote><blockquote><p>“那行不义的，必受不义的报应；主<strong>并不偏待人</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/3/#L25">西 3:25</a>)</p></blockquote><blockquote><p>“你们既称<strong>那不偏待人、按各人行为审判人的主</strong>为父，就当存敬畏的心，度你们在世寄居的日子，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/1/#L17">彼前 1:17</a>)</p></blockquote>
  meta_desc: 上帝不看人的财富和地位，对所有人一视同仁
