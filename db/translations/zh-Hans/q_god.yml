- src: Бог_невидим
  path: Qg12A_不能看见的上帝
  title: 不能看见的上帝
  copy_cover: true
  body: <h2>上帝不能看见</h2><blockquote><p>“自从造天地以来，上帝的永能和神性是明明可知的，<strong>虽是眼不能见</strong>，但借着所造之物就可以晓得，叫人无可推诿。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/1/#L20">罗 1:20</a>)</p></blockquote><blockquote><p>“此等不信之人，被这世界的神弄瞎了心眼，不叫基督荣耀福音的光照着他们。<strong>基督本是上帝的像</strong>。 &lt;…&gt; 我们这至暂至轻的苦楚，要为我们成就极重无比、永远的荣耀。 原来我们不是顾念所见的，乃是顾念所不见的；因为所见的是暂时的，<strong>所不见的是永远的</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/4/#L4,17-18">林后 4:4,17-18</a>)</p></blockquote><blockquote><p>“爱子是<strong>那不能看见之上帝的像</strong>，是首生的，在一切被造的以先。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/1/#L15">西 1:15</a>)</p></blockquote><blockquote><p>“但愿尊贵、荣耀归与那不能朽坏、<strong>不能看见</strong>、永世的君王、<strong>独一的上帝</strong>，直到永永远远。阿们！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/1/#L17">提前 1:17</a>)</p></blockquote><blockquote><p>“就是那独一不死，住在人不能靠近的光里，是<strong>人未曾看见，也是不能看见的</strong>，要将他显明出来。但愿尊贵和永远的权能都归给他。阿们！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/6/#L16">提前 6:16</a>)</p></blockquote><blockquote><p>“我们因着信，就知道诸世界是藉上帝话造成的，这样，<strong>所看见的，并不是从显然之物造出来的</strong>。 &lt;…&gt; 人非有信，就不能得上帝的喜悦；因为到上帝面前来的人，必须信有上帝，且信他<strong>赏赐那寻求他的人</strong>。 &lt;…&gt; 他因着信，就离开埃及，不怕王怒；因为他恒心忍耐，<strong>如同看见那不能看见的主</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/11/#L3,6,27">希 11:3,6,27</a>)</p></blockquote><blockquote><p>“<strong>从来没有人见过上帝</strong>，我们若彼此相爱，上帝就住在我们里面，爱他的心在我们里面得以完全了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/4/#L12">约壹 4:12</a>)</p></blockquote><h2>基督道成肉身之后，上帝在人性中成为可见的</h2><blockquote><p>“<strong>从来没有人看见上帝</strong>，只有在父怀里的独生子将他表明出来。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/1/#L18">约 1:18</a>)</p></blockquote><p>详见：<a href="https://bibleox.com/ru/ru/w/Сын-безначальный-начинается">无始的圣子降生了</a></p>
  meta_desc: 上帝不能看见，但借着他所造的万物可以知道
