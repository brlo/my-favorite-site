  path: Qg4A_上帝创造万物
  title: 上帝创造万物
  copy_cover: true
  body: <h2>上帝创造万物</h2><blockquote><p>“太初有道，道与上帝同在，道就是上帝。 &lt;…&gt; 万物是借着他造的；<strong>凡被造的，没有一样不是借着他造的</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/1/#L1,3">约 1:1,3</a>)</p></blockquote><blockquote><p>“<strong>起初上帝创造天地</strong>。 地是空虚混沌，渊面黑暗；上帝的灵运行在水面上。 上帝说：「要有<strong>光</strong>。」就有了光。 上帝看光是好的，就把光暗分开了。 上帝称光为昼，称暗为夜。有晚上，有早晨，这是头一日。 上帝说：「诸水之间要有<strong>空气</strong>，将水分为上下。」 上帝就造出空气，将空气以下的水、空气以上的水分开了。事就这样成了。 上帝称空气为天。有晚上，有早晨，是第二日。 上帝说：「天下的水要聚在一处，使<strong>旱地</strong>露出来。」事就这样成了。 上帝称旱地为地，称水的聚处为海。上帝看着是好的。 上帝说：「地要发生<strong>青草</strong>和结种子的菜蔬，并结果子的树木，各从其类，果子都包着核。」事就这样成了。 于是地发生了青草和结种子的菜蔬，各从其类；并结果子的树木，各从其类，果子都包着核。上帝看着是好的。 有晚上，有早晨，是第三日。 上帝说：「天上要有<strong>光体</strong>，可以分昼夜，作记号，定节令、日子、年岁， 并要发光在天空，普照在地上。」事就这样成了。 于是上帝造了两个大光，大的管昼，小的管夜，又造众星， 就把这些光摆列在天空，普照在地上， 管理昼夜，分别明暗。上帝看着是好的。 有晚上，有早晨，是第四日。 上帝说：「水要多多滋生<strong>有生命的物</strong>，要有<strong>雀鸟</strong>飞在地面以上，天空之中。」 上帝就造出大鱼和水中所滋生各样有生命的动物，各从其类；又造出各样飞鸟，各从其类。上帝看着是好的。 上帝就赐福给这一切，说：「滋生繁多，充满海中的水；雀鸟也要多生在地上。」 有晚上，有早晨，是第五日。 上帝说：「地要生出活物来，各从其类；<strong>牲畜</strong>、<strong>昆虫</strong>、野兽，各从其类。」事就这样成了。 于是上帝造出野兽，各从其类；牲畜，各从其类；地上一切昆虫，各从其类。上帝看着是好的。 上帝说：「我们要照着我们的形像，按着我们的样式<strong>造人</strong>。使他们管理海里的鱼、空中的鸟、地上的牲畜和全地，并地上所爬的一切昆虫。」 上帝就照着自己的形像造人，乃是照着他的形像<strong>造男造女</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/1/#L1-27">创 1:1-27</a>)</p></blockquote><blockquote><p>“雅各的分不像这些，因他是<strong>造作万有的主</strong>。以色列也是他产业的支派－万军之耶和华是他的名。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ier/10/#L16">耶 10:16</a>)</p></blockquote><blockquote><p>“<strong>创造宇宙和其中万物的上帝</strong>，既是天地的主，就不住人手所造的殿，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/17/#L24">徒 17:24</a>)</p></blockquote><blockquote><p>“永生的天主，一举而<strong>创造了万物</strong>，惟有上主堪称是正义的，永远是常胜的君王。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/18/#L1">德 18:1</a>)</p></blockquote><blockquote><p>“<strong>上主造成了万物</strong>，并赐给虔敬人智慧。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/43/#L37">德 43:37</a>)</p></blockquote><blockquote><p>“「从你出胎，造就你的救赎主耶和华如此说：我耶和华是<strong>创造万物的</strong>，是独自铺张诸天、铺开大地的。谁与我同在呢？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/44/#L24">赛 44:24</a>)</p></blockquote><blockquote><p>“「我们的主，我们的上帝，你是配得荣耀、尊贵、权柄的！因为你<strong>创造了万物</strong>，并且万物是<strong>因你的旨意被创造</strong>而有的。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/4/#L11">启 4:11</a>)</p></blockquote><blockquote><p>“我儿，我恳求你仰视天，俯视地，观察天地间形形色色的万物！你该知道，<strong>这一切都是天主从无中造成</strong>的，人类也是如此造成的。” (<a href="https://bibleox.com/zh-Hans/cn-sb/2mak/7/#L28">加下 7:28</a>)</p></blockquote><blockquote><p>“以及全能上帝的气息，他<strong>创造万物</strong>，鉴察大地隐秘中的一切隐秘。” (<a href="https://bibleox.com/zh-Hans/ru/3ezd/16/#L63">厄四 16:63</a>, 俄文原文无中文经文，此处自译)</p></blockquote><blockquote><p>“<strong>诸天藉耶和华的命而造</strong>；<strong>万象</strong>藉他口中的气而成。 他<strong>聚集海水如垒</strong>，收藏深洋在库房。 &lt;…&gt; 因为他说有，就有；命立，就立。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/33/#L6-7,9">诗 33:6-7,9</a>)</p></blockquote><blockquote><p>“你，惟独你是耶和华！你<strong>造了天和天上的天，并天上的万象</strong>，<strong>地和地上的万物，海和海中所有的</strong>，这一切都是你所保存的；天军也都敬拜你。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/neem/9/#L6">尼 9:6</a>)</p></blockquote><blockquote><p>“他们听见了，就同心合意的高声向上帝说：「主啊，你是<strong>造天、地、海和其中万物的</strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/4/#L24">徒 4:24</a>)</p></blockquote><blockquote><p>“「诸君，为什么作这事呢？我们也是人，性情和你们一样！我们传福音给你们，是叫你们离弃这些虚妄，归向那<strong>创造天、地、海和其中万物的</strong>永生上帝。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/14/#L15">徒 14:15</a>)</p></blockquote><blockquote><p>“因为六日之内，<strong>耶和华造天、地、海和其中的万物</strong>，第七日便安息。所以耶和华赐福与安息日，定为圣日。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/20/#L11">出 20:11</a>)</p></blockquote><blockquote><p>“万有的主宰<strong>决不顾情面</strong>，也不畏惧权势，因为<strong>无论大小，都是他造的</strong>；他对一切，都一律加以照顾；” (<a href="https://bibleox.com/zh-Hans/cn-sb/prs/6/#L8">智 6:8</a>)</p></blockquote><blockquote><p>“<strong>能听的耳，能看的眼</strong>，都是耶和华所造的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/20/#L12">箴 20:12</a>)</p></blockquote><blockquote><p>“<strong>地的深处</strong>在他手中．<strong>山的高峰</strong>也属他。 <strong>海洋</strong>属他，是他造的；<strong>旱地</strong>也是他手造成的。 来啊，我们要屈身敬拜，在<strong>造我们的耶和华</strong>面前跪下。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/95/#L4-6">诗 95:4-6</a>)</p></blockquote><blockquote><p>“我<strong>造地</strong>，又<strong>造人在地上</strong>；我亲手<strong>铺张诸天</strong>，<strong>天上万象也是我所命定的</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/45/#L12">赛 45:12</a>)</p></blockquote><blockquote><p>“耶和华用能力<strong>创造大地</strong>，用智慧<strong>建立世界</strong>，用聪明<strong>铺张穹苍</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ier/10/#L12">耶 10:12</a>)</p></blockquote><blockquote><p>“我用大能和伸出来的膀臂，<strong>创造大地</strong>和地上的<strong>人民、牲畜</strong>，我看给谁相宜，就把地给谁。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ier/27/#L5">耶 27:5</a>)</p></blockquote><blockquote><p>“主耶和华啊，你曾用大能和伸出来的膀臂<strong>创造天地</strong>，在你没有难成的事。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ier/32/#L17">耶 32:17</a>)</p></blockquote><blockquote><p>“凡不认识天主的人，都是真正的愚人，因为，他们未能从看得见的美物，去发现那自有者；注意了工程，却不认识工程师；反而认<strong>火</strong>、<strong>风</strong>、流动的<strong>空气</strong>、运转的<strong>星辰</strong>、洪流的<strong>巨涛</strong>、天上的<strong>光体</strong>，为统治世界的神。如果有人因这些东西的美丽而着迷，奉之为神；那么，他们就应知道：这些美物的主宰更是美丽，因为，全是美丽的唯一根源<strong>所创造</strong>的。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prs/13/#L1-3">智 13:1-3</a>)</p></blockquote><h2>上帝<a href="https://bibleox.com/ru/ru/w/Бог-неизменен">永不改变</a>。他自创造世界以来也没有改变</h2><blockquote><p>“上主并未允许圣者讲论他的一切奇事，全能的上主建立了这些奇事，为叫天地万物愈发显扬自己的光荣。&lt;…&gt; 他井然布置了自己智慧的伟业，他从永远直到永远常常存在；对他，<strong>什么也不能增加，什么也不能减少</strong>；他不需要任何人的计谋。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/42/#L17,21-22">德 42:17,21-22</a>)</p></blockquote>
  meta_desc: 上帝创造万物——圣经关于上帝是创造者的引文
