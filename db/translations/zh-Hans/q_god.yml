  path: 上帝是唯一的上帝
  title: 上帝是唯一的上帝，没有别的神
  copy_cover: true
  body: <h2>上帝是唯一的上帝，没有别的神</h2><blockquote><p>“耶和华以色列的君，以色列的救赎主，万军之耶和华如此说：我是首先的，我是末后的，<strong>除我以外再没有真神</strong>！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/44/#L6">赛 44:6</a>)</p></blockquote><blockquote><p>“我是耶和华，<strong>在我以外并没有别神；除了我以外再没有上帝</strong>。你虽不认识我，我必给你束腰。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/45/#L5">赛 45:5</a>)</p></blockquote><blockquote><p>“你们如今要知道：<strong>我，惟有我是上帝。在我以外并无别神</strong>。我使人死，我使人活；我损伤，我也医治；并无人能从我手中救出来。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/32/#L39">申 32:39</a>)</p></blockquote><blockquote><p>“从日出之地到日落之处，使人都知道<strong>除了我以外，没有别神。我是耶和华</strong>！在我以外并没有别神。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/45/#L6">赛 45:6</a>)</p></blockquote><blockquote><p>“耶和华如此说，「埃及劳碌得来的和古实的货物必归你，身量高大的西巴人必投降你，也要属你。他们必带着锁鍊过来随从你，又向你下拜，祈求你说：『上帝真在你们中间，<strong>此外再没有别神！再没有别的上帝</strong>！』」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/45/#L14">赛 45:14</a>)</p></blockquote><blockquote><p>“创造诸天的耶和华，制造成全大地的上帝，他创造坚定大地，并非使地荒凉，是要给人居住．他如此说：「<strong>我是耶和华，再没有别神</strong>！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/45/#L18">赛 45:18</a>)</p></blockquote><blockquote><p>“你们要述说陈明你们的理，让他们彼此商议。谁从古时指明？谁从上古述说？不是我耶和华吗？<strong>除了我以外，再没有上帝！我是公义的上帝，又是救主，除了我以外，再没有别神</strong>！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/45/#L21">赛 45:21</a>)</p></blockquote><blockquote><p>“地极的人都当仰望我，就必得救。因为<strong>我是上帝，再没有别神</strong>！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/45/#L22">赛 45:22</a>)</p></blockquote><blockquote><p>“你们要追念上古的事，因为<strong>我是上帝，并无别神；我是上帝，再没有能比我的</strong>！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/46/#L9">赛 46:9</a>)</p></blockquote><blockquote><p>“君王遂大声呼喊说：“上主，达尼尔的天主！你是伟大的，<strong>除你以外没有别的神</strong>。”” (<a href="https://bibleox.com/zh-Hans/cn-sb/dan/14/#L41">但 14:41</a>)</p></blockquote><blockquote><p>“那文士对耶稣说：「夫子说，上帝是一位，实在不错！<strong>除了他以外，再没有别的上帝</strong>；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/12/#L32">可 12:32</a>)</p></blockquote><blockquote><p>“论到吃祭偶像之物，我们知道偶像在世上算不得什么，也知道<strong>上帝只有一位，再没有别的上帝</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/8/#L4">林前 8:4</a>)</p></blockquote><h2>别的神不是神，而是鬼魔</h2><blockquote><p>“<strong>所祭祀的鬼魔</strong>，并非真神，乃是<strong>素不认识的神</strong>，<strong>是近来新兴的</strong>，是你列祖所不畏惧的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/32/#L17">申 32:17</a>)</p></blockquote><blockquote><p>“把自己的儿女<strong>祭祀鬼魔</strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/106/#L37">诗 106:37</a>)</p></blockquote><blockquote><p>“实在，你们触怒了你们的造主，因为你们<strong>给恶魔而不给天主献祭</strong>” (<a href="https://bibleox.com/zh-Hans/cn-sb/var/4/#L7">巴 4:7</a>)</p></blockquote><blockquote><p>“我乃是说：<strong>外邦人所献的祭是祭鬼，不是祭上帝</strong>，我不愿意你们与鬼相交。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/10/#L20">林前 10:20</a>)</p></blockquote><blockquote><p>“人岂可为自己制造神呢？<strong>其实这不是神</strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ier/16/#L20">耶 16:20</a>)</p></blockquote><blockquote><p>“「我怎能赦免你呢？你的儿女离弃我，又指着<strong>那不是神的</strong>起誓。我使他们饱足，他们就行奸淫，成群的聚集在娼妓家里。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ier/5/#L7">耶 5:7</a>)</p></blockquote><blockquote><p>“但从前你们不认识上帝的时候，是给那些<strong>本来不是神的</strong>作奴仆。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/4/#L8">加 4:8</a>)</p></blockquote><blockquote><p>“<strong>外邦的神都属虚无</strong>，惟独耶和华创造诸天。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/96/#L5">诗 96:5</a>)</p></blockquote><blockquote><p>“「诸君，为什么作这事呢？我们也是人，性情和你们一样！我们传福音给你们，是叫你们<strong>离弃这些虚妄，归向那创造天、地、海和其中万物的永生上帝</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/14/#L15">徒 14:15</a>)</p></blockquote><h3>它们不能救人</h3><blockquote><p>“你们从列国逃脱的人，要一同聚集前来。<strong>那些抬着雕刻木偶，祷告不能救人之神的，毫无知识</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/45/#L20">赛 45:20</a>)</p></blockquote>
