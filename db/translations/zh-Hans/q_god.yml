  path: Qg6A_全知的上帝
  title: 全知的上帝
  copy_cover: true
  body: <h2>全知的上帝</h2><p>上帝是全知的（无所不知的、洞察一切的）：</p><blockquote><p>“并且被造的没有一样在他面前不显然的；原来万物在那与我们有关系的主眼前，<strong>都是赤露敞开的</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/4/#L13">希 4:13</a>)</p></blockquote><blockquote><p>“我们的心若责备我们，<strong>上帝</strong>比我们的心大，<strong>一切事没有不知道的</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/3/#L20">约壹 3:20</a>)</p></blockquote><blockquote><p>“耶和华啊，<strong>你是知道的</strong>，求你记念我，眷顾我，向逼迫我的人为我报仇，不要向他们忍怒取我的命，要知道我为你的缘故受了凌辱。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ier/15/#L15">耶 15:15</a>)</p></blockquote><blockquote><p>“第三次对他说：「约翰的儿子西门，你爱我么？」彼得因为耶稣第三次对他说：『你爱我么？』，就忧愁，对耶稣说：「主啊！<strong>你是无所不知的</strong>，你知道我爱你。」耶稣说：「你餵养我的羊。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/21/#L17">约 21:17</a>)</p></blockquote><blockquote><p>“「<strong>你知道万事</strong>；你知道我这样做，不是出于恶意，也不是出于骄傲，也不是出于虚荣……<strong>你明察万事</strong>，知道我恨恶不义者的荣耀，憎恶未受割礼者和一切外邦人的床榻。」” (<a href="https://bibleox.com/zh-Hans/ru/esf/4/#L17">斯 4:17</a>, 俄文原文无中文经文，此处自译)</p></blockquote><blockquote><p>“众人都是从土来的，因为，亚当就是用土造成的。<strong>上主以自己的绝大智慧，使众人各有分别</strong>，使他们的道路各有不同。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/33/#L10-11">德 33:10-11</a>)</p></blockquote><blockquote><p>“以及全能上帝的气息，他创造万物，<strong>鉴察大地隐秘中的一切隐秘</strong>。” (<a href="https://bibleox.com/zh-Hans/ru/3ezd/16/#L63">厄四 16:63</a>, 俄文原文无中文经文，此处自译)</p></blockquote><blockquote><p>“各人的功行，都在他面前，<strong>没有什么可瞒过他的眼目</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/39/#L24">德 39:24</a>)</p></blockquote><blockquote><p>“实在，<strong>上主的神充满了世界，包罗万象，通晓一切语言</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prs/1/#L7">智 1:7</a>)</p></blockquote><h2>上帝知道未来</h2><blockquote><p>“<strong>全能者既定期罚恶</strong>，为何不使认识他的人看见那日子呢？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iov/24/#L1">伯 24:1</a>)</p></blockquote><blockquote><p>“上主并未允许圣者讲论他的一切奇事，全能的上主建立了这些奇事，为叫天地万物愈发显扬自己的光荣。他穷究深渊和人心，看透众人的诡计。因为，<strong>至高者通达各种学问，明察时代的征兆，陈述过去和未来的世事，揭露隐秘的事迹</strong>；” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/42/#L17-19">德 42:17-19</a>)</p></blockquote><h2>上帝知道人的心思、情感和愿望</h2><blockquote><p>“<strong>耶和华见</strong>人在地上罪恶很大，<strong>终日所思想的尽都是恶</strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/6/#L5">创 6:5</a>)</p></blockquote><blockquote><p>“主啊！<strong>我的心愿都在你面前</strong>；我的叹息不向你隐瞒。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/38/#L9">诗 38:9</a>)</p></blockquote><blockquote><p>“上帝岂不鉴察这事么？因为<strong>他晓得人心里的隐祕</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/44/#L21">诗 44:21</a>)</p></blockquote><blockquote><p>“我儿所罗门哪，你当认识耶和华你父的上帝，诚心乐意地事奉他。因为<strong>他鉴察众人的心，知道一切心思意念</strong>。你若寻求他，他必使你寻见；你若离弃他，他必永远丢弃你！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1par/28/#L9">代上 28:9</a>)</p></blockquote><blockquote><p>“求你从天上你的居所垂听赦免。你是知道人心的，要照各人所行的待他们（<strong>惟有你知道世人的心</strong>），” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/6/#L30">代下 6:30</a>)</p></blockquote><blockquote><p>“主<strong>知道世人的一切行为、图谋、意念和心思</strong>。” (<a href="https://bibleox.com/zh-Hans/ru/3ezd/16/#L55">厄四 16:55</a>, 俄文原文无中文经文，此处自译)</p></blockquote><blockquote><p>“上主并未允许圣者讲论他的一切奇事，全能的上主建立了这些奇事，为叫天地万物愈发显扬自己的光荣。<strong>任何思想不能逃过他，连一句话也不能隐瞒他</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/42/#L17,20">德 42:17,20</a>)</p></blockquote><blockquote><p>“<strong>耶稣知道他们的心意</strong>，就说：「你们为什么<strong>心里怀着恶念</strong>呢？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/9/#L4">太 9:4</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/lk/5/#L22">路 5:22</a>)</p></blockquote><blockquote><p>“<strong>耶稣知道他们的意念</strong>，就对他们说：「凡一国自相纷争，就成为荒场；一城一家自相纷争，必站立不住。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/12/#L25">太 12:25</a>)</p></blockquote><blockquote><p>“<strong>耶稣却知道他们的意念</strong>，就对那枯干一只手的人说：「起来！站在当中。」那人就起来，站着。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L8">路 6:8</a>)</p></blockquote><blockquote><p>“<strong>耶稣看出他们心中的议论</strong>，就领一个小孩子来，叫他站在自己旁边，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/9/#L47">路 9:47</a>)</p></blockquote><blockquote><p>“<strong>他晓得他们的意念</strong>，便对他们说：「凡一国自相纷争，就成为荒场；凡一家自相纷争，就必败落。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/11/#L17">路 11:17</a>)</p></blockquote><blockquote><p>“众人就祷告说：「主啊，<strong>你知道万人的心</strong>。求你从这两个人中，指明你所拣选的是谁，叫他得这使徒的位分。这位分犹大已经丢弃，往自己的地方去了。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/1/#L24">徒 1:24</a>)</p></blockquote><blockquote><p>“<strong>知道人心的上帝</strong>也为他们作了见证，赐圣灵给他们，正如给我们一样；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/15/#L8">徒 15:8</a>)</p></blockquote><h2>上帝知道人的一切罪</h2><blockquote><p>“上帝啊，我的愚昧，你原知道；<strong>我的罪愆不能隐瞒</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/69/#L5">诗 69:5</a>)</p></blockquote>
  meta_desc: 上帝知道万事：过去和未来、人的心思意念和罪
