  path: Qx4A_平静的心灵
  title: 平静的心灵
  copy_cover: true
  body: <h2>论上帝的安息</h2><blockquote><p>“上帝赐福给第七日，定为圣日；因为在这日上帝<strong><mark>歇了他一切创造的工，就安息了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/2/#L3">创 2:3</a>)</p></blockquote><blockquote><p>“耶稣就对他们说：「<strong><mark>我父作事直到如今，我也作事</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/5/#L17">约 5:17</a>)</p></blockquote><blockquote><p>“但我们已经相信的人<strong><mark>得以进入那安息</mark></strong>，正如上帝所说：「我在怒中起誓说，『<strong><mark>他们断不可进入我的安息</mark></strong>！』」其实造物之工，从创世以来已经成全了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/4/#L3">希 4:3</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/ps/95/#L11">诗 95:11</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/evr/3/#L11">希 3:11</a>)</p></blockquote><h2>上帝的平安</h2><blockquote><p>“<strong><mark>我留下平安给你们</mark></strong>，<strong><mark>我将我的平安赐给你们</mark></strong>；<strong><mark>我所赐的，不像世人所赐的</mark></strong>。你们心里不要忧愁，也不要胆怯。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/14/#L27">约 14:27</a>)</p></blockquote><blockquote><p>“我心里柔和谦卑，<strong><mark>你们当负我的轭，学我的样式</mark></strong>，这样，<strong><mark>你们心里就必得享安息</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/11/#L29">太 11:29</a>)</p></blockquote><blockquote><p>“<strong><mark>上帝所赐出人意外的平安</mark></strong>，必在基督耶稣里，保守你们的心怀意念。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/fil/4/#L7">腓 4:7</a>)</p></blockquote><blockquote><p>“因为那进入安息的，<strong><mark>乃是歇了自己的工</mark></strong>，正如上帝歇了他的工一样。 所以，<strong><mark>我们务必竭力进入那安息</mark></strong>，免得有人学那不信从的样子跌倒了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/4/#L10-11">希 4:10-11</a>)</p></blockquote><blockquote><p>“耶和华必为你们争战，<strong><mark>你们只管静默，不要作声</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/14/#L14">出 14:14</a>)</p></blockquote><blockquote><p>“耶和华说：「我必亲自和你同去，<strong><mark>使你得安息</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/33/#L14">出 33:14</a>)</p></blockquote><blockquote><p>“我必为我民以色列选定一个地方，栽培他们，<strong><mark>使他们住自己的地方，不再迁移</mark></strong>。兇恶之子也不像从前扰害他们，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1par/17/#L9">代上 17:9</a>)</p></blockquote><blockquote><p>“所以我在怒中起誓说：「<strong><mark>他们断不可进入我的安息</mark></strong>！」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/95/#L11">诗 95:11</a>)</p></blockquote>
