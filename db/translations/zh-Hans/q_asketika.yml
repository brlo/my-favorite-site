- src: монашество
  path: Qx3A_隐修
  title: 隐修
  copy_cover: true
  body: <h2>圣经论隐修生活</h2><h3>选择上帝所喜悦之事的太监</h3><p>上帝特别举出那些不结婚、特别关心遵守上帝诫命的人。他们仿佛被高举在其余的“儿女”之上：</p><blockquote><p>“因为耶和华如此说：「那些谨守我的安息日，拣选我所喜悦的事，<strong><mark>持守我约的太监</mark></strong>， <strong><mark>我必使他们在我殿中，在我墙内有记念、有名号，比有儿女的更美</mark></strong>。我必赐他们永远的名，不能剪除。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/56/#L4-5">赛 56:4-5</a>)</p></blockquote><blockquote><p>“<strong>不生育的男人，手若不作非法的行为，心不思念相反上主的恶事，是有福的；天主见他忠贞，必赐给他特赏，在上主的圣殿中，赐给他更称心的一份。</strong>” (<a href="https://bibleox.com/zh-Hans/cn-sb/prs/3/#L14">智 3:14</a>)</p></blockquote><h3>高于遵守诫命的成全之路</h3><p>寻求救恩之道的富少年从救主得到确认：为此必须遵守诫命。然而，因为少年问起更多的事，主就向他指出更高的：不仅要得救，还要成为完全的。为此主呼召少年变卖自己的一切所有，来跟从他：</p><blockquote><p>“耶稣说：「<strong><mark>你若愿意作完全人</mark></strong>，<strong><mark>可去变卖你所有的，分给穷人</mark></strong>，就必有财宝在天上；<strong><mark>你还要来跟从我</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/19/#L21">太 19:21</a>)</p></blockquote><h3>为天国的缘故自阉的人</h3><p>隐修士舍弃一切地上的财富和依恋，一生专心寻求上帝并事奉他。隐修士——为天国的缘故自阉、甘受剥夺的人：</p><blockquote><p>“门徒对耶稣说：「人和妻子既是这样，<strong><mark>倒不如不娶</mark></strong>。」 耶稣说：「<strong><mark>这话不是人都能领受的，惟独赐给谁，谁才能领受</mark></strong>。 因为有生来是阉人，也有被人阉的，并<strong><mark>有为天国的缘故自阉的</mark></strong>。<strong><mark>这话谁能领受，就可以领受</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/19/#L10-12">太 19:10-12</a>)</p></blockquote><p>这些关于阉人的话，是基督在使徒们听到他禁止休妻之后说的。使徒们以为那样倒不如不娶。主没有与这个结论争辩，只指出：不是人人都能选择这条路。谁能，谁就选择。就是说，这是苦修者的特殊道路。</p><h3>使徒的劝告</h3><p>使徒明确地重复关于独身的思想：</p><blockquote><p>“论到你们信上所提的事，我说<strong><mark>男不近女倒好</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/7/#L1">林前 7:1</a>)</p></blockquote><p>使徒保罗没有妻子，他劝告独身者和寡妇（正是劝告）不要寻求新的丈夫，像他自己一样：</p><blockquote><p>“我对着没有嫁娶的和寡妇说，<strong><mark>若他们常像我就好</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/7/#L8">林前 7:8</a>)</p></blockquote><p>使徒解释这样劝告的原因：</p><blockquote><p>“你若娶妻，并不是犯罪；处女若出嫁，也不是犯罪。然而这等人肉身必受苦难，我却愿意你们免这苦难。 弟兄们，我对你们说，时候减少了。从此以后，那有妻子的，要像没有妻子； 哀哭的，要像不哀哭；快乐的，要像不快乐；置买的，要像无有所得； 用世物的，要像不用世物；因为这世界的样子将要过去了。 <strong><mark>我愿你们无所挂虑</mark></strong>。<strong><mark>没有娶妻的，是为主的事挂虑，想怎样叫主喜悦</mark></strong>； <strong><mark>娶了妻的，是为世上的事挂虑，想怎样叫妻子喜悦</mark></strong>。 妇人和处女也有分别。<strong><mark>没有出嫁的，是为主的事挂虑，要身体、灵魂都圣洁</mark></strong>；<strong><mark>已经出嫁的，是为世上的事挂虑，想怎样叫丈夫喜悦</mark></strong>。 我说这话是为你们的益处，不是要牢笼你们，乃是要叫你们行合宜的事，得以殷勤服事主，没有分心的事。 若有人以为自己待他的女儿不合宜，女儿也过了年岁，事又当行，他就可随意办理，不算有罪，叫二人成亲就是了。 倘若人心里坚定，没有不得已的事，并且由得自己作主，心里又决定了留下女儿不出嫁，如此行也好。 这样看来，叫自己的女儿出嫁是好．不叫他出嫁更是好。 丈夫活着的时候，妻子是被约束的；丈夫若死了，妻子就可以自由，随意再嫁，只是要嫁这在主里面的人。 然而按我的意见，<strong><mark>若常守节更有福气</mark></strong>。我也想自己是被上帝的灵感动了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/7/#L28-40">林前 7:28-40</a>)</p></blockquote><p>在自己的一生中度贞洁生活的基督徒，在天上无论羔羊往哪里去都跟随他：</p><blockquote><p>“我又观看，见<strong>羔羊</strong>站在锡安山，同他又有<strong>十四万四千人</strong>，都有他的名和他父的名写在额上。 我听见从天上有声音，像众水的声音和大雷的声音，并且我所听见的好像弹琴的所弹的琴声。 他们在宝座前，并在四活物和众长老前唱歌，<strong>仿佛是新歌</strong>；<strong><mark>除了从地上买来的那十四万四千人以外，没有人能学这歌</mark></strong>。 <strong><mark>这些人未曾沾染妇女，他们原是童身</mark></strong>。<strong><mark>羔羊无论往那里去，他们都跟随他</mark></strong>。他们是从人间买来的，作初熟的果子归与上帝和羔羊。 在他们口中察不出谎言来，他们是没有瑕疵的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/14/#L1-5">启 14:1-5</a>)</p></blockquote><h3>最早的基督徒团体是一个共修的隐修院</h3><blockquote><p>“<strong><mark>信的人都在一处，凡物公用</mark></strong>； <strong><mark>并且卖了田产、家业，照各人所需用的分给各人</mark></strong>。 他们<strong><mark>天天</mark></strong><strong><mark>同心合意恒切的在殿里</mark></strong>，且在家中擘饼，存着欢喜、诚实的心用饭，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/2/#L44-46">徒 2:44-46</a>)</p></blockquote><blockquote><p>“那许多信的人都是一心一意的，<strong><mark>没有一人说他的东西有一样是自己的</mark></strong>，<strong><mark>都是大家公用</mark></strong>。 &lt;…&gt; 内中也没有一个缺乏的，因为人人将田产房屋都卖了，把所卖的价银拿来，放在使徒脚前， <strong><mark>照各人所需用的，分给各人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/4/#L32,34-35">徒 4:32,34-35</a>)</p></blockquote><blockquote><p>“<strong><mark>其余的人没有一个敢贴近他们</mark></strong>，百姓却尊重他们。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/5/#L13">徒 5:13</a>)</p></blockquote><h2>隐修生活的榜样</h2><h3>主耶稣基督</h3><ul><li><p>没有结婚；</p></li><li><p>没有自己的房子（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/8/#L20">太 8:20</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/9/#L58">路 9:58</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/19/#L21">太 19:21</a>）；</p></li><li><p>没有个人的钱袋（<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/12/#L15">可 12:15</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/17/#L24-27">太 17:24-27</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/19/#L21">太 19:21</a>）；</p></li><li><p>常常独自整夜祈祷（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L12">路 6:12</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/6/#L6">太 6:6</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/14/#L23,25">太 14:23,25</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/14/#L32,35,37,39-41">可 14:32,35,37,39-41</a>）；</p></li><li><p>有门徒（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L13">路 6:13</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/10/#L1">路 10:1</a>）；</p></li><li><p>教导祈祷，给门徒祈祷的范本（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/6/#L9">太 6:9</a>）；</p></li><li><p>安慰、责备、教导、训诲来到他面前的人（<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/6/#L31">可 6:31</a>）。</p></li></ul><h3>童贞女马利亚——上帝之母</h3><ul><li><p>立了独身的愿，形式上处于婚姻中，没有夫妻关系（“我不认识丈夫”——详见<a href="https://bibleox.com/ru/ru/w/Богородица#HH-Богородица-была-и-остаётся-девой">上帝之母</a>）；</p></li><li><p>没有财产，自幼被送到圣殿抚养，后许配给约瑟，后被主交托给使徒约翰（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/19/#L27">约 19:27</a>）。</p></li></ul><h3>先知施洗约翰</h3><ul><li><p>没有结婚；</p></li><li><p>住在旷野，没有自己的房子（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/1/#L80">路 1:80</a>）；</p></li><li><p>穿粗陋的自制衣服（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/3/#L4">太 3:4</a>）；</p></li><li><p>吃在旷野找到的极简单的食物（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/3/#L4">太 3:4</a>）；</p></li><li><p>自制的衣服和找到的食物表明他没有钱；</p></li><li><p>教导祈祷，给出祈祷的范本（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/11/#L1">路 11:1</a>）；</p></li><li><p>有门徒（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/11/#L2">太 11:2</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/in/1/#L35">约 1:35</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/in/3/#L25">约 3:25</a>）；</p></li><li><p>安慰、责备、教导、训诲来到他面前的人（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/3/#L18">路 3:18</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/3/#L10-20">路 3:10-20</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/6/#L31">可 6:31</a>）。</p></li></ul><h3>先知以利亚</h3><ul><li><p>没有结婚；</p></li><li><p>常常生活在荒野、旷野和洞穴里（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/17/#L3-7">王上 17:3-7</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/19/#L9">王上 19:9</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/19/#L4">王上 19:4</a>）；</p></li><li><p>穿动物毛织的简朴衣服，束皮带（<a href="https://bibleox.com/zh-Hans/cn-cuv/4ts/1/#L8">王下 1:8</a>）；</p></li><li><p>吃乌鸦叼来的简朴食物（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/17/#L6">王上 17:6</a>）；</p></li><li><p>有门徒（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/19/#L19-21">王上 19:19-21</a>）；</p></li><li><p>奉上帝的命令责备人的不虔（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/18/#L17-40">王上 18:17-40</a>）。</p></li></ul><h3>先知但以理</h3><ul><li><p>没有结婚；</p></li><li><p>吃简朴的食物，拒绝王的膳食（<a href="https://bibleox.com/zh-Hans/cn-cuv/dan/1/#L12">但 1:12</a>）；</p></li><li><p>常常祈祷（<a href="https://bibleox.com/zh-Hans/cn-cuv/dan/6/#L10">但 6:10</a>）；</p></li><li><p>责备不虔（<a href="https://bibleox.com/zh-Hans/cn-cuv/dan/5/#L17-28">但 5:17-28</a>）。</p></li></ul><h3>先知耶利米</h3><ul><li><p>奉上帝的命令没有结婚（<a href="https://bibleox.com/zh-Hans/cn-cuv/ier/16/#L2">耶 16:2</a>）；</p></li><li><p>独居，常被囚禁或流放（<a href="https://bibleox.com/zh-Hans/cn-cuv/ier/37/#L15-16">耶 37:15-16</a>）；</p></li><li><p>教导并责备万民（<a href="https://bibleox.com/zh-Hans/cn-cuv/ier/1/#L9-10">耶 1:9-10</a>）。</p></li></ul>
