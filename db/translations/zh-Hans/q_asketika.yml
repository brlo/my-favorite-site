  title: 试探
  copy_cover: true
  body: <h2>信徒应当预备面对试探</h2><blockquote><p>“我儿，<strong>你前去服事上主时</strong>，应固守正义与敬畏，并应<strong>预备你的心承受试探</strong>。使你的心居正不偏，坚忍不拔；应侧耳听取明智的言语；在灾难中，不要慌张。应静心等待天主的照顾，与天主保持联系，总不要离弃他，好使你至死充满幸福。<strong>凡降到你身上的，你都要接受</strong>；在痛苦中，你要忍受；在各种困苦中，你要多多忍耐；<strong>因为金银应在火里锻炼，天主所喜悦的人，也应在谦卑的火炉中锻炼</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/2/#L1-5">德 2:1-5</a>)</p></blockquote><h2>试探（考验）是有益的</h2><blockquote><p>“<strong><mark>必有许多人使自己清净洁白，且被熬炼</mark></strong>，但恶人仍必行恶，一切恶人都不明白，惟独智慧人能明白。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/dan/12/#L10">但 12:10</a>)</p></blockquote><blockquote><p>“我儿，你前去服事上主时，应固守正义与敬畏，并应<strong>预备你的心承受试探</strong>。使你的心居正不偏，坚忍不拔；应侧耳听取明智的言语；在灾难中，不要慌张。应静心等待天主的照顾，与天主保持联系，总不要离弃他，<strong>好使你至死充满幸福</strong>。<strong>凡降到你身上的，你都要接受</strong>；在痛苦中，你要忍受；在各种困苦中，你要多多忍耐；因为金银应在火里锻炼，天主所喜悦的人，也应在谦卑的火炉中锻炼。” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/2/#L1-5">德 2:1-5</a>)</p></blockquote><blockquote><p>“我的弟兄们，<strong><mark>你们落在百般试炼中，都要以为大喜乐</mark></strong>； 因为知道<strong><mark>你们的信心经过试验，就生忍耐</mark></strong>。 <strong><mark>但忍耐也当成功，使你们成全完备，毫无缺欠</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/1/#L2-4">雅 1:2-4</a>)</p></blockquote><blockquote><p>“<strong><mark>忍受试探的人是有福的</mark></strong>，因为他经过试验以后，必得生命的冠冕，这是主应许给那些爱他之人的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/1/#L12">雅 1:12</a>)</p></blockquote><blockquote><p>“因此，<strong><mark>你们是大有喜乐，但如今在百般的试炼中暂时忧愁</mark></strong>， <strong><mark>叫你们的信心既被试验，就比那被火试验仍然能坏的金子更显宝贵</mark></strong>，可以在耶稣基督显现的时候，得着称赞、荣耀、尊贵。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/1/#L6-7">彼前 1:6-7</a>)</p></blockquote><blockquote><p>“亲爱的弟兄啊，<strong><mark>有火炼的试验临到你们，不要以为奇怪</mark></strong>（似乎是遭遇非常的事）， <strong><mark>倒要欢喜</mark></strong>。因为你们是与基督一同受苦，使你们在他荣耀显现的时候，也可以欢喜快乐。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/4/#L12-13">彼前 4:12-13</a>)</p></blockquote><h2>上帝不容许试探超过人的力量，并赐扶助</h2><blockquote><p>“你们所遇见的试探，无非是人所能受的。上帝是信实的，<strong><mark>必不叫你们受试探过于所能受的</mark></strong>。在受试探的时候，<strong><mark>总要给你们开一条出路，叫你们能忍受得住</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/10/#L13">林前 10:13</a>)</p></blockquote><blockquote><p>“<strong><mark>主知道搭救敬虔的人脱离试探</mark></strong>，把不义的人留在刑罚之下，等候审判的日子。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2pet/2/#L9">彼后 2:9</a>)</p></blockquote><h2>如何胜过试探</h2><p>必须有属灵的儆醒和祈祷：</p><blockquote><p>“<strong><mark>总要儆醒祷告，免得入了迷惑</mark></strong>。你们心灵固然愿意，肉体却软弱了。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/26/#L41">太 26:41</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/mk/14/#L38">可 14:38</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/lk/22/#L40">路 22:40</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/lk/22/#L46">路 22:46</a>)</p></blockquote><h2>在试探中跌倒</h2><blockquote><p>“<strong><mark>但那些想要发财的人，就陷在迷惑、落在网罗和许多无知有害的私欲里</mark></strong>，叫人沉在败坏和灭亡中。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/6/#L9">提前 6:9</a>)</p></blockquote>
