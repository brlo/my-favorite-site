  title: 斋戒
  copy_cover: true
  body: <p>论禁欲主义的一般原则：</p><blockquote><p>“<strong>凡较力争胜的</strong>，诸事都有节制，他们不过是<strong>要得能坏的冠冕</strong>；我们却是<strong>要得不能坏的冠冕</strong>。 所以，<strong>我奔跑</strong>，不像无定向的；我斗拳，不像打空气的。 我是<strong>攻克己身，叫身服我</strong>，恐怕我传福音给别人，<strong><mark>自己反被弃绝了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/9/#L25-27">林前 9:25-27</a>)</p></blockquote><p>上帝呼召人在斋戒中归向他：</p><blockquote><p>“<strong>耶和华说：「虽然如此，你们应当禁食，哭泣、悲哀，一心归向我。」</strong>” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iol/2/#L12">珥 2:12</a>)</p></blockquote><p>主耶稣基督以斋戒开始宣讲：</p><blockquote><p>“<strong><mark>他禁食四十昼夜</mark></strong>，后来就饿了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/4/#L2">太 4:2</a>)</p></blockquote><p>主教导如何正确斋戒：</p><blockquote><p>“<strong><mark>你们禁食的时候</mark></strong>，不可像那假冒为善的人，脸上带着愁容，因为他们把脸弄得难看，故意叫人看出他们是禁食。我实在告诉你们：<strong><mark>他们已经得了他们的赏赐</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/6/#L16">太 6:16</a>)</p></blockquote><blockquote><p>“<strong><mark>你禁食的时候</mark></strong>，要梳头洗脸，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/6/#L17">太 6:17</a>)</p></blockquote><p>施洗约翰的门徒斋戒：</p><blockquote><p>“那时，约翰的门徒来见耶稣，说：「<strong><mark>我们和法利赛人常常禁食</mark></strong>，你的门徒倒不禁食，这是为什么呢？」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/9/#L14">太 9:14</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/mk/2/#L18">可 2:18</a>)</p></blockquote><p>基督的门徒在基督受难之后将要斋戒：</p><blockquote><p>“耶稣对他们说：「新郎和陪伴之人同在的时候，陪伴之人岂能哀恸呢？但日子将到，新郎要离开他们，<strong><mark>那时候他们就要禁食</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/9/#L15">太 9:15</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/mk/2/#L20">可 2:20</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/lk/5/#L35">路 5:35</a>)</p></blockquote><p>有一些鬼，若不禁食就不能从人身上赶出去：</p><blockquote><p>“至于这一类的鬼，<strong><mark>若不祷告禁食</mark></strong>，他就不出来。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/17/#L21">太 17:21</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/mk/9/#L29">可 9:29</a>)</p></blockquote><p>寡妇在上帝的圣殿里以斋戒和祈祷昼夜事奉上帝：</p><blockquote><p>“现在已经八十四岁，并不离开圣殿，<strong><mark>禁食祈求，昼夜事奉上帝</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/2/#L37">路 2:37</a>)</p></blockquote><p>斋戒期间有天使差到百夫长那里：</p><blockquote><p>“哥尼流说：「<strong><mark>前四天这个时候，我在家中守着申初的祷告</mark></strong>，忽然有一个人穿着光明的衣裳，站在我面前，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/10/#L30">徒 10:30</a>) <em>(俄文原文此处有「禁食」一词，和合本无。)</em></p></blockquote><p>圣灵在斋戒中与最早的基督徒相交：</p><blockquote><p>“<strong><mark>他们事奉主，禁食的时候</mark></strong>，圣灵说：「<strong><mark>要为我分派巴拿巴和扫罗</mark></strong>，去作我召他们所作的工。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/13/#L2">徒 13:2</a>)</p></blockquote><p>最早的基督徒在一切要事上以斋戒补充祈祷：</p><blockquote><p>“二人在各教会中选立了长老，<strong><mark>又禁食祷告</mark></strong>，就把他们交托所信的主。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/14/#L23">徒 14:23</a>)</p></blockquote><p>为了斋戒，夫妻可以暂时分房：</p><blockquote><p>“夫妻不可彼此亏负，除非两相情愿，<strong><mark>暂时分房，为要专心祷告方可</mark></strong>；以后仍要同房，免得撒但趁着你们情不自禁引诱你们。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/7/#L5">林前 7:5</a>) <em>(俄文原文作「为禁食和祷告」，和合本无「禁食」一词。)</em></p></blockquote><p>使徒们在斋戒中显明自己是上帝的仆人：</p><blockquote><p>“反倒在各样的事上表明自己是上帝的用人，就如在许多的忍耐、患难、穷乏、困苦、 鞭打、监禁、扰乱、勤劳、<strong><mark>儆醒、不食</mark></strong>、 廉洁、知识、恒忍、恩慈、圣灵的感化、无伪的爱心、” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/6/#L4-6">林后 6:4-6</a>)</p></blockquote><p>使徒在责备自己不得已的自夸（<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/11/#L21">林后 11:21</a>）时，夸耀自己的斋戒：</p><blockquote><p>“受劳碌、受困苦。多次不得睡，又饥又渴；<strong><mark>多次不得食</mark></strong>，受寒冷，赤身露体。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/11/#L27">林后 11:27</a>)</p></blockquote><p>使徒允许主教提摩太因身体软弱而放松斋戒：</p><blockquote><p>“<strong><mark>因你胃口不清，屡次患病</mark></strong>，再不要照常喝水，可以稍微用点酒。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/5/#L23">提前 5:23</a>)</p></blockquote><p>善功=祈祷+斋戒+施舍+公义：</p><blockquote><p>“<strong>祈祷与斋戒固然是善功</strong>，但秉义施舍却超过前二者；<strong>秉义而少有，胜于不义而多有；施舍救济，胜于储蓄黄金</strong>” (<a href="https://bibleox.com/zh-Hans/cn-sb/tov/12/#L8">多 12:8</a>)</p></blockquote><p>君王兼先知大卫在患难中以斋戒在上帝面前谦卑己心：</p><blockquote><p>“至于我，当他们有病的时候，我便穿麻衣，<strong><mark>禁食刻苦己心</mark></strong>，我所求的都归到自己的怀中；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/35/#L13">诗 35:13</a>)</p></blockquote>
