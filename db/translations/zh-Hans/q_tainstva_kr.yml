  path: QT7A_洗礼
  title: 洗礼
  copy_cover: true
  body: <h2>洗礼圣奥秘的实质</h2><p><strong>洗礼</strong>（“重生”、“属灵的诞生”）——在教会中举行的圣奥秘，人在其中：</p><ol><li><p>洗净罪（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/2/#L38">徒 2:38</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/6/#L11">林前 6:11</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/act/22/#L16">徒 22:16</a>）；</p></li><li><p>属灵地重生（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/3/#L3,5-6">约 3:3,5-6</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/15/#L44">林前 15:44</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/15/#L47-50">林前 15:47-50</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/15/#L53">林前 15:53</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/3/#L27">加 3:27</a>）；</p></li><li><p>领受救人的恩典（<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/6/#L1">林后 6:1</a>）；</p></li><li><p>加入教会（<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/12/#L13">林前 12:13</a>）。</p></li></ol><h3>赦罪</h3><blockquote><p>“现在你为什么耽延呢？<strong><mark>起来，求告他的名受洗，洗去你的罪</mark></strong>。』」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/22/#L16">徒 22:16</a>)</p></blockquote><blockquote><p>“你们中间也有人从前是这样；但如今你们奉主耶稣基督的名，并借着我们上帝的灵，<strong><mark>已经洗净、成圣、称义了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/6/#L11">林前 6:11</a>)</p></blockquote><blockquote><p>“彼得说：「你们各人要悔改，奉耶稣基督的名受洗，<strong><mark>叫你们的罪得赦</mark></strong>，就必领受所赐的圣灵；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/2/#L38">徒 2:38</a>)</p></blockquote><h3>从水和圣灵而生</h3><blockquote><p>“耶稣回答说：「我实实在在的告诉你，<strong><mark>人若不重生</mark></strong>，就不能见上帝的国。」 &lt;…&gt; 耶稣说：「我实实在在的告诉你，人若不是<strong><mark>从水和圣灵生的</mark></strong>，就不能进上帝的国。 <strong><mark>从肉身生的就是肉身</mark></strong>；<strong><mark>从灵生的就是灵</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/3/#L3,5-6">约 3:3,5-6</a>)</p></blockquote><p>其余引文见下文“<a href="https://bibleox.com/ru/ru/w/крещение#HH-Крещение-младенцев">婴儿洗礼</a>”。</p><h3>加入基督的身体</h3><blockquote><p>“我们不拘是犹太人，是希利尼人，是为奴的，是自主的，<strong><mark>都从一位圣灵受洗，成了一个身体</mark></strong>，饮于一位圣灵。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/12/#L13">林前 12:13</a>)</p></blockquote><h3>得进上帝的国的可能</h3><blockquote><p>“耶稣说：「我实实在在的告诉你，人若不是从水和圣灵生的，<strong><mark>就不能进上帝的国</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/3/#L5">约 3:5</a>)</p></blockquote><h3>得救的可能</h3><blockquote><p>“<strong><mark>这水所表明的洗礼，现在借着耶稣基督复活，也拯救你们</mark></strong>；这洗礼本不在乎除掉肉体的污秽，只求在上帝面前有无亏的良心。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/3/#L21">彼前 3:21</a>)</p></blockquote><blockquote><p>“他便救了我们，并不是因我们自己所行的义，乃是照他的怜悯，<strong><mark>借着重生的洗和圣灵的更新</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/tit/3/#L5">多 3:5</a>)</p></blockquote><h2>洗礼圣奥秘的设立</h2><blockquote><p>“耶稣进前来，对他们说：「<strong><mark>天上地下所有的权柄都赐给我了</mark></strong>。 所以，<strong><mark>你们要去，使万民作我的门徒，奉父，子、圣灵的名给他们施洗</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/28/#L18-19">太 28:18-19</a>)</p></blockquote><h2>洗礼圣奥秘的材料——水</h2><p>用水施洗，在水里施洗：</p><blockquote><p>“二人正往前走，<strong><mark>到了有水的地方</mark></strong>，太监说：「看哪，这里有水，<strong><mark>我受洗有什么妨碍呢</mark></strong>？」 〔有古卷在此有腓利说：「你若是一心相信，就可以。」他回答说：「我信耶稣基督是上帝的儿子。」〕 于是吩咐车站住，<strong><mark>腓利和太监二人同下水里去</mark></strong>，<strong><mark>腓利就给他施洗</mark></strong>。 <strong><mark>从水里上来</mark></strong>，主的灵把腓利提了去。太监也不再见他了，就欢欢喜喜的走路。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/8/#L36-39">徒 8:36-39</a>)</p></blockquote><blockquote><p>“于是彼得说：「这些人既受了圣灵，与我们一样，<strong><mark>谁能禁止用水给他们施洗呢</mark></strong>？」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/10/#L47">徒 10:47</a>)</p></blockquote><h2>旧约中关于洗礼的预言</h2><blockquote><p>“<strong><mark>我必用清水洒在你们身上</mark></strong>，你们就洁净了。我要洁净你们，使你们脱离一切的污秽，弃掉一切的偶像。 <strong><mark>我也要赐给你们一个新心，将新灵放在你们里面</mark></strong>。又从你们的肉体中除掉石心，赐给你们肉心。 我必将我的灵放在你们里面，使你们顺从我的律例，谨守遵行我的典章。 你们必住在我所赐给你们列祖之地。你们要作我的子民，我要作你们的上帝。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iez/36/#L25-28">结 36:25-28</a>)</p></blockquote><blockquote><p>“必再怜悯我们，<strong><mark>将我们的罪孽踏在脚下，又将我们的一切罪投于深海</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mih/7/#L19">弥 7:19</a>)</p></blockquote><blockquote><p>“那日，必给大卫家和耶路撒冷的居民<strong><mark>开一个泉源，洗除罪恶与污秽</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/zah/13/#L1">亚 13:1</a>)</p></blockquote><h2>洗礼的条件</h2><h3>信心</h3><p>需要有对上帝——父、子、圣灵——的信心（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/28/#L19">太 28:19</a>）：</p><blockquote><p>“二人正往前走，到了有水的地方，太监说：「看哪，这里有水，<strong><mark>我受洗有什么妨碍呢</mark></strong>？」 〔有古卷在此有腓利说：「<strong><mark>你若是一心相信，就可以</mark></strong>。」他回答说：「<strong><mark>我信耶稣基督是上帝的儿子</mark></strong>。」〕 于是吩咐车站住，腓利和太监二人同下水里去，<strong><mark>腓利就给他施洗</mark></strong>。 从水里上来，主的灵把腓利提了去。太监也不再见他了，就欢欢喜喜的走路。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/8/#L36-39">徒 8:36-39</a>)</p></blockquote><h3>悔改</h3><p>需要为罪悔改：</p><blockquote><p>“彼得说：「<strong><mark>你们各人要悔改</mark></strong>，奉耶稣基督的名受洗，叫你们的罪得赦，就必领受所赐的圣灵；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/2/#L38">徒 2:38</a>)</p></blockquote><h2>婴儿洗礼</h2><h3>人人都必须属灵地重生</h3><p>一切人都需要属灵的重生，为与上帝同享永恒的生命：</p><blockquote><p>“<strong><mark>有天上的形体，也有地上的形体</mark></strong>。但天上形体的荣光是一样，地上形体的荣光又是一样。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/15/#L40">林前 15:40</a>)</p></blockquote><blockquote><p>“<strong><mark>所种的是血气的身体，复活的是灵性的身体</mark></strong>。若有血气的身体，也必有灵性的身体。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/15/#L44">林前 15:44</a>)</p></blockquote><blockquote><p>“<strong><mark>从肉身生的就是肉身</mark></strong>；<strong><mark>从灵生的就是灵</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/3/#L6">约 3:6</a>)</p></blockquote><p>亚当朽坏身体的继承者不能进上帝的国：</p><blockquote><p>“<strong><mark>头一个人是出于地</mark></strong>，乃属土；第二个人是出于天。 那属土的怎样，凡属土的也就怎样；属天的怎样，凡属天的也就怎样。 我们既有属土的形状，将来也必有属天的形状。 弟兄们，我告诉你们说，<strong><mark>血肉之体不能承受上帝的国</mark></strong>，<strong><mark>必朽坏的不能承受不朽坏的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/15/#L47-50">林前 15:47-50</a>)</p></blockquote><p>因此，凡从亚当承受必朽性的人都要死；而在洗礼中与基督联合的人都要复活。</p><blockquote><p>“<strong><mark>在亚当里众人都死了</mark></strong>；<strong><mark>照样，在基督里众人也都要复活</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/15/#L22">林前 15:22</a>)</p></blockquote><blockquote><p>“岂不知<strong><mark>我们这受洗归入基督耶稣的人，是受洗归入他的死</mark></strong>吗？ &lt;…&gt; 我们若在他死的形状上与他联合，<strong><mark>也要在他复活的形状上与他联合</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/6/#L3,5">罗 6:3,5</a>)</p></blockquote><p>一切必死的都须穿上不朽坏的：</p><blockquote><p>“<strong><mark>这必朽坏的总要变成不朽坏的，这必死的总要变成不死的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/15/#L53">林前 15:53</a>)</p></blockquote><p>就是说，在洗礼中穿上基督：</p><blockquote><p>“你们<strong><mark>受洗归入基督的，都是披戴基督了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/3/#L27">加 3:27</a>)</p></blockquote><h3>人人都必须洗去原罪</h3><p>还有，一切人都从始祖继承了罪性。就是说，<a href="https://bibleox.com/ru/ru/w/все-люди-грешны">婴儿也有</a>：</p><blockquote><p>“<strong><mark>谁能使洁净之物出于污秽之中呢</mark></strong>？无论谁也不能！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iov/14/#L4">伯 14:4</a>)</p></blockquote><blockquote><p>“<strong><mark>我是在罪孽里生的</mark></strong>，在我母亲怀胎的时候就有了罪。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/51/#L5">诗 51:5</a>)</p></blockquote><blockquote><p>“这就如<strong><mark>罪是从一人入了世界</mark></strong>，死又是从罪来的，于是<strong><mark>死就临到众人</mark></strong>，因为众人都犯了罪。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/5/#L12">罗 5:12</a>)</p></blockquote><blockquote><p>“<strong><mark>因一人的悖逆，众人成为罪人</mark></strong>；照样，<strong><mark>因一人的顺从，众人也成为义了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/5/#L19">罗 5:19</a>)</p></blockquote><blockquote><p>“故此，<strong><mark>我所愿意的善，我反不作</mark></strong>；我所不愿意的恶，我倒去作。 若我去作所不愿意作的，就不是我作的，<strong><mark>乃是住在我里头的罪作的</mark></strong>。 我觉得有个律，就是我愿意为善的时候，便有恶与我同在。 因为按着我里面的意思，我是喜欢上帝的律； <strong><mark>但我觉得肢体中另有个律和我心中的律交战</mark></strong>，把我掳去，叫我附从那肢体中犯罪的律。 我真是苦啊！<strong><mark>谁能救我脱离这取死的身体呢</mark></strong>？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/7/#L19-24">罗 7:19-24</a>)</p></blockquote><blockquote><p>“我们原晓得律法是属乎灵的，<strong><mark>但我是属乎肉体的，是已经卖给罪了</mark></strong>。 &lt;…&gt; 因为按着我里面的意思，我是喜欢上帝的律； 但我觉得肢体中另有个律和我心中的律交战，<strong><mark>把我掳去，叫我附从那肢体中犯罪的律</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/7/#L14,22-23">罗 7:14,22-23</a>)</p></blockquote><blockquote><p>“我们从前也都在他们中间，放纵肉体的私欲，随着肉体和心中所喜好的去行，<strong><mark>本为可怒之子</mark></strong>，和别人一样。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/2/#L3">弗 2:3</a>)</p></blockquote><h3>使徒给整个家庭（全家）施洗</h3><blockquote><p>“<strong><mark>我也给司提反家施过洗</mark></strong>，此外给别人施洗没有，我却记不清。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/1/#L16">林前 1:16</a>)</p></blockquote><blockquote><p>“<strong><mark>她和她一家既领了洗</mark></strong>，便求我们说：「你们若以为我是真信主的，请到我家里来住。」于是强留我们。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/16/#L15">徒 16:15</a>)</p></blockquote><blockquote><p>“又领他们出来，说：「二位先生，我当怎样行才可以得救？」 他们说：「<strong><mark>当信主耶稣，你和你一家都必得救</mark></strong>。」 他们就把主的道讲给他和他全家的人听。 当夜，就在那时候，禁卒把他们带去，洗他们的伤；<strong><mark>他和属乎他的人立时都受了洗</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/16/#L30-33">徒 16:30-33</a>)</p></blockquote><p>使徒呼召一切人受洗，说应许不但属于他们（成人），也属于他们的儿女：</p><blockquote><p>“彼得说：「<strong><mark>你们各人要悔改</mark></strong>，奉耶稣基督的名受洗，叫你们的罪得赦，就必领受所赐的圣灵； 因为<strong><mark>这应许是给你们和你们的儿女</mark></strong>，并一切在远方的人，就是主我们上帝所召来的。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/2/#L38-39">徒 2:38-39</a>)</p></blockquote><p>这里字面地说的正是婴儿。必须深入上下文，弄清这里所说的<strong>应许</strong>（应许之事）是什么。这一章讲的是五旬节那天圣灵降在教会聚会上。解释这事件时，使徒彼得指着藉先知约珥所赐的应许：</p><blockquote><p>“<strong><mark>他们就都被圣灵充满</mark></strong>，按着圣灵所赐的口才说起别国的话来。 &lt;…&gt; <strong><mark>彼得和十一个使徒站起</mark></strong>，高声说：「犹太人和一切住在耶路撒冷的人哪，这件事你们当知道，也当侧耳听我的话。 你们想这些人是醉了？其实不是醉了，因为时候刚到巳初。 <strong><mark>这正是先知约珥所说的</mark></strong>： 『上帝说：在末后的日子，<strong><mark>我要将我的灵浇灌凡有血气的</mark></strong>。你们的儿女要说预言；你们的少年人要见异象；老年人要作异梦。 &lt;…&gt; <strong><mark>众人听见这话，觉得扎心</mark></strong>，就对彼得和其余的使徒说：「弟兄们，我们当怎样行？」 彼得说：「<strong><mark>你们各人要悔改</mark></strong>，奉耶稣基督的名受洗，叫你们的罪得赦，就必领受所赐的圣灵； 因为<strong><mark>这应许是给你们和你们的儿女</mark></strong>，并一切在远方的人，就是主我们上帝所召来的。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/2/#L4,14-17,37-39">徒 2:4,14-17,37-39</a>)</p></blockquote><p>这样，使徒彼得引用的是先知约珥。我们就到先知约珥自己那里看这一应许：</p><blockquote><p>“<strong><mark>你们要在锡安吹角</mark></strong>，在我圣山吹出大声。国中的居民都要发颤；因为耶和华的日子将到，已经临近。 &lt;…&gt; 你们要在锡安吹角，<strong><mark>分定禁食的日子，宣告严肃会</mark></strong>。 <strong><mark>聚集众民</mark></strong>，使会众自洁；招聚老者，<strong><mark>聚集孩童和吃奶的</mark></strong>；使新郎出离洞房，新妇出离内室。 事奉耶和华的祭司，要在廊子和祭坛中间哭泣说：「耶和华啊，求你顾惜你的百姓，不要使你的产业受羞辱，列邦管辖他们。为何容列国的人说：『他们的上帝在那里呢。』」 <strong><mark>耶和华就为自己的地发热心</mark></strong>，怜恤他的百姓。 &lt;…&gt; 以后，<strong><mark>我要将我的灵浇灌凡有血气的</mark></strong>。你们的儿女要说预言，你们的老年人要作异梦，少年人要见异象。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iol/2/#L1,15-18,28">珥 2:1,15-18,28</a>)</p></blockquote><p>这就是那应许。全民族——从老人到吃奶的婴孩——都被召参加这严肃的聚会。上帝应许把圣灵浇灌在聚集的全民族身上，如经所记：浇灌凡有血气的。这样，当使徒说应许不但属于听的人、也属于他们的儿女和一切远方的人时，按上下文，他所说的儿女，字面地指的就是婴孩。</p><h3>上帝的恩典按他人的信心运作</h3><p>婴儿受洗的时刻，可以有代父母信心的运作。圣经里有许多情形：上帝的恩典因别人的信心而在一些人身上运作。</p><h4>救主因父母的信心医治儿女</h4><p>上帝按父母的信心在儿女身上行事：</p><ul><li><p>要求的是父亲的信心，而从鬼附中得医治的是儿子（<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/9/#L17-24">可 9:17-24</a>）；</p></li><li><p>要求的是父亲的信心，复活的是睚鲁被医治的女儿（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/8/#L41-42,49-55">路 8:41-42,49-55</a>）；</p></li><li><p>相信的是母亲，从鬼附中得医治的是迦南妇人的女儿（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/15/#L22-28">太 15:22-28</a>）；</p></li><li><p>相信的是父亲，得医治的是大臣的儿子（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/4/#L46-50">约 4:46-50</a>）。</p></li></ul><h4>因亲人信心而医治（恩典运作）的情形</h4><ul><li><p>相信的是百夫长，得医治的是他的仆人（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/8/#L10,13">太 8:10,13</a>）</p></li><li><p>相信的是朋友们，得医治的是瘫痪的同伴（<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/2/#L5">可 2:5</a>）。这里重要的是：因别人的信心，这人的<strong>罪也得了赦免</strong>。</p></li></ul><p>详见<a href="https://bibleox.com/ru/ru/w/действие-Бога-по-вере-родителей-и-друзей">上帝按父母和朋友的信心行事</a></p><h3>把未来的儿子献给上帝的许愿</h3><p>父母献给上帝的，不只是已出生的婴儿（在第八天），甚至还有只是向上帝求来的。先知撒母耳就是这样出生的：</p><blockquote><p>“许愿说：「万军之耶和华啊，你若垂顾婢女的苦情，眷念不忘婢女，赐我一个儿子，<strong><mark>我必使他终身归与耶和华</mark></strong>，不用剃头刀剃他的头。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1ts/1/#L11">撒上 1:11</a>)</p></blockquote><h2>洗礼的旧约预表</h2><h3>割礼</h3><p>旧约的割礼是新约洗礼的预表：</p><blockquote><p>“<strong><mark>你们在他里面，也受了不是人手所行的割礼</mark></strong>，乃是基督使你们脱去肉体情欲的割礼。 <strong><mark>你们既受洗与他一同埋葬</mark></strong>，也就在此与他一同复活，都因信那叫他从死里复活上帝的功用。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/2/#L11-12">西 2:11-12</a>)</p></blockquote><p>旧约割礼的设立——它是进入与上帝所立之约的入口，婴孩从八天起进入：</p><blockquote><p>“你们所有的男子都要受割礼，这就是我与你，并你的后裔所立的约，是你们所当遵守的。 你们都要受割礼，<strong><mark>这是我与你们立约的证据</mark></strong>。 你们世世代代的男子，无论是家里生的，是在你后裔之外用银子从外人买的，<strong><mark>生下来第八日，都要受割礼</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/17/#L10-12">创 17:10-12</a>)</p></blockquote><h3>走海床脱离奴役</h3><p>犹太人走红海海床脱离埃及的奴役，是新约洗礼的预表。全民族脱离奴役，全民族——包括婴儿——都在云里、海里受洗归了摩西：</p><blockquote><p>“弟兄们，我不愿意你们不晓得，<strong><mark>我们的祖宗从前都在云下，都从海中经过</mark></strong>， <strong><mark>都在云里、海里受洗归了摩西</mark></strong>， 并且<strong><mark>都吃了一样的灵食</mark></strong>． 也都喝了一样的灵水；<strong><mark>所喝的，是出于随着他们的灵磐石</mark></strong>，那磐石就是基督。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/10/#L1-4">林前 10:1-4</a>)</p></blockquote><p>这些预像有直接的意义：</p><blockquote><p>“<strong><mark>他们遭遇这些事都要作为鉴戒</mark></strong>，并且写在经上，正是警戒我们这末世的人。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/10/#L11">林前 10:11</a>)</p></blockquote><h2>血的洗礼</h2><p>血的洗礼——为基督殉道的死。这里指的不是圣战或神风式的行为。殉道者想活下去，不威胁任何人的生命；只是因为他对基督的信仰，人夺去他的生命。这样的人不经水的洗礼，不但达到得救，还在天上与基督同享特别的荣耀。</p><h3>基督把将临的苦难和死称为洗礼</h3><blockquote><p>“耶稣回答说：「你们不知道所求的是什么。<strong><mark>我将要喝的杯，你们能喝吗</mark></strong>？」他们说：「我们能。」 耶稣说：「<strong><mark>我所喝的杯，你们必要喝</mark></strong>；只是坐在我的左右，不是我可以赐的，乃是我父为谁预备的，就赐给谁。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/20/#L22-23">太 20:22-23</a>)</p></blockquote><h3>为基督被杀的人在天堂得着白衣</h3><blockquote><p>“揭开第五印的时候，我看见在祭坛底下，<strong><mark>有为上帝的道并为作见证被杀之人的灵魂</mark></strong>， 大声喊着说：「圣洁真实的主啊！你不审判住在地上的人，给我们伸流血的冤，要等到几时呢？」 <strong><mark>于是有白衣赐给他们各人</mark></strong>，又有话对他们说：「还要安息片时，等着一同作仆人的和他们的弟兄，也像他们被杀，满足了数目。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/6/#L9-11">启 6:9-11</a>)</p></blockquote><p>*在希腊文里，殉道者称为 μάρτῠρος（见证人）。殉道者以自己的行为见证对基督和复活的坚定信仰，这常常成为别人接受基督信仰的契机。*</p><h3>基督论殉道者和逼迫</h3><blockquote><p>“<strong><mark>凡在人面前认我的</mark></strong>，我在我天上的父面前也必认他； <strong><mark>凡在人面前不认我的</mark></strong>，我在我天上的父面前也必不认他。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/10/#L32-33">太 10:32-33</a>)</p></blockquote><blockquote><p>“我又告诉你们，<strong><mark>凡在人面前认我的</mark></strong>，人子在上帝的使者面前也必认他；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/12/#L8">路 12:8</a>)</p></blockquote><blockquote><p>“<strong><mark>为义受逼迫的人有福了</mark></strong>，因为天国是他们的。 <strong><mark>人若因我辱骂你们，逼迫你们，捏造各样坏话毁谤你们</mark></strong>，你们就有福了。 应当欢喜快乐，因为<strong><mark>你们在天上的赏赐是大的</mark></strong>。在你们以前的先知，人也是这样逼迫他们。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L10-12">太 5:10-12</a>)</p></blockquote><h2>受洗之后信徒仍会犯罪，必须与里面的罪争战</h2><blockquote><p>“因为我们得知真道以后，<strong><mark>若故意犯罪</mark></strong>，<strong><mark>赎罪的祭就再没有了</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/10/#L26">希 10:26</a>)</p></blockquote><blockquote><p>“<strong><mark>我们若说自己无罪，便是自欺</mark></strong>，真理不在我们心里了； 我们若认自己的罪，上帝是信实的，是公义的，必要赦免我们的罪，洗净我们一切的不义；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/1/#L8-9">约壹 1:8-9</a>)</p></blockquote><blockquote><p>“我小子们哪，我将这些话写给你们，<strong><mark>是要叫你们不犯罪</mark></strong>。若有人犯罪，在父那里我们有一位中保，就是那义者耶稣基督。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/2/#L1">约壹 2:1</a>)</p></blockquote><blockquote><p>“<strong><mark>你们中间的争战、斗殴，是从那里来的呢</mark></strong>？不是从你们百体中战斗之私欲来的吗？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/4/#L1">雅 4:1</a>)</p></blockquote><blockquote><p>“你们中间有病了的呢，他就<strong><mark>该请教会的长老来</mark></strong>，他们可以奉主的名用油抹他，为他祷告。 <strong><mark>出于信心的祈祷要救那病人</mark></strong>，主必叫他起来；<strong><mark>他若犯了罪，也必蒙赦免</mark></strong>。 所以你们要彼此认罪，<strong><mark>互相代求，使你们可以得医治</mark></strong>。义人祈祷所发的力量是大有功效的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/5/#L14-16">雅 5:14-16</a>)</p></blockquote><blockquote><p>“<strong><mark>你们要醒悟为善，不要犯罪</mark></strong>，因为<strong><mark>有人不认识上帝</mark></strong>。我说这话是要叫你们羞愧。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/15/#L33-34">林前 15:33-34</a>)</p></blockquote><blockquote><p>“并要以恩慈相待，存怜悯的心，<strong><mark>彼此饶恕</mark></strong>，正如上帝在基督里饶恕了你们一样。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/4/#L32">弗 4:32</a>)</p></blockquote><p>最后，主耶稣基督赐给门徒一篇祈祷，在其中教导求赦免罪。这不是一生只念一次的祈祷。门徒求基督教导他们祈祷，基督就赐给他们这个范本：</p><blockquote><p>“耶稣在一个地方祷告。祷告完了，有个门徒对他说：「求主教导我们祷告，像约翰教导他的门徒。」 耶稣说：「<strong><mark>你们祷告的时候，要说</mark></strong>：我们在天上的父〔有古卷只作『父阿』〕：愿人都尊你的名为圣。愿你的国降临，愿你的旨意行在地上，如同行在天上〔有古卷没有『愿你的旨意云云』〕。 我们日用的饮食，天天赐给我们。 <strong><mark>赦免我们的罪</mark></strong>，因为我们也赦免凡亏欠我们的人。不叫我们遇见试探；救我们脱离兇恶〔有古卷无末句〕。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/11/#L1-4">路 11:1-4</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/mf/6/#L7-13">太 6:7-13</a>)</p></blockquote><h2>对异议的回应</h2><h3>在关于从水和圣灵而生的话里（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/3/#L5">约 3:5</a>），水是指圣灵吗？</h3><p>新教徒把救主关于得救必须从水和圣灵而生的话作寓意解释，说水指的是圣灵。他们把接下去的两节联系起来：</p><blockquote><p>“耶稣说：「我实实在在的告诉你，人若不是<strong><mark>从水和圣灵生的</mark></strong>，就不能进上帝的国。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/3/#L5">约 3:5</a>)</p></blockquote><blockquote><p>“信我的人，就如经上所说，<strong><mark>从他腹中要流出活水的江河来</mark></strong>。」 <strong><mark>耶稣这话是指着信他之人要受圣灵说的</mark></strong>；那时还没有赐下圣灵来，因为耶稣尚未得着荣耀。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/7/#L38-39">约 7:38-39</a>)</p></blockquote><p>但如果把水理解为圣灵，那就成了同义反复（同一事物多余的重复）。那样基督说的就是：要从圣灵和圣灵生。如果在这段话里直接说圣灵是合适的，那为什么还要用寓意呢？而且即使按寓意，也得说“从水的圣灵”或“从水<strong>或</strong>圣灵”（这才等值），而按经文，却是要从圣灵<strong>和</strong>别的什么生——也就是从水。</p><p>此外，我们很好知道——包括从圣经——使徒们是真实地在水里施行重生的。就是说，洗礼中的水从来都是真实的，而“从腹中流出江河”（字面地）却从来没有人流过。</p><p>所以，既然使徒们是在水里施洗、洗礼是由圣灵成就的，我们就把救主关于从水和圣灵而生的话理解为使徒们所行的那样：从水和圣灵——这一理解客观地系于使徒在水里施洗的实践。古代的教会从不把洗礼与水分开、理解为纯然头脑中的东西，而是理解为奉父、子、圣灵之名在祝圣的水中三次浸没。</p><h3>“受洗必须悔改，可婴儿不能悔改，所以也不能受洗？”</h3><p>一些与教会分离的团体指责教会允许婴儿受洗。他们引用使徒劝勉听的人先悔改、后受洗的经文：</p><blockquote><p>“彼得说：「<strong><mark>你们各人要悔改</mark></strong>，奉耶稣基督的名受洗，叫你们的罪得赦，就必领受所赐的圣灵； 因为<strong><mark>这应许是给你们和你们的儿女</mark></strong>，并一切在远方的人，就是主我们上帝所召来的。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/2/#L38-39">徒 2:38-39</a>)</p></blockquote><p>悔改的要求是对成人的；婴儿没有个人的罪，因此难以把悔改的要求加在他们身上。就是说，婴儿需要受洗，但因为他们没有个人的罪，也就不必为他们所没有的东西悔改。</p><p>总的来说，这指责听起来很奇怪。由它得出的是：婴儿为了穿上基督（受洗——<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/3/#L27">加 3:27</a>），必须先犯罪；而他们还没有犯罪，就不能悔改，那么也就永远不能受洗。这成了某种荒谬：为获得与基督联合的可能，必须先得罪基督。当然，这是大错。受洗是人人需要的，悔改只是犯了罪的人需要的。</p><p>先知约翰的悔改的洗礼虽然不同于基督里的洗礼（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/19/#L4">徒 19:4</a>），但可以检验这些推理是否正确。先知约翰施悔改的洗，但当基督来到他那里时，他没有悔改就立刻下到水里。基督没有罪，因此他没有悔改就受了悔改的洗。婴儿也是这样。基督不需要先获得罪，才能获得受悔改之洗的可能。婴儿也是这样。受洗是人人被召的，悔改的只是有可悔之事的人。</p><h3>“受洗需要信心，可婴儿不能宣认信仰，所以也不能受洗？”</h3><p>与教会分离的团体还引用另一节经文，其中主说要信而受洗：</p><blockquote><p>“<strong><mark>信而受洗的，必然得救</mark></strong>；<strong><mark>不信的，必被定罪</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/16/#L16">可 16:16</a>)</p></blockquote><p>这样，得救的必要条件之一是获得<strong>信心</strong>、领受<strong>洗礼</strong>。不履行这些条件，人不能得救。然而，难以把信心的要求加在婴儿身上；所以他们按代父母的信心受洗——对此也有圣经的依据（详见<a href="https://bibleox.com/ru/ru/w/крещение#HH-Действие-благодати-Божьей-по-вере-других-людей">上帝的恩典按他人的信心运作</a>）。</p><p>还要特别注意接下去的话：不信的必被定罪。那么是不是说婴儿也要被定罪，因为他们不能信呢？</p><blockquote><p>“信而受洗的，必然得救；<strong><mark>不信的，必被定罪</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/16/#L16">可 16:16</a>)</p></blockquote><p>问题在于：这一节里信心的要求只对成人。而洗礼本身，如救主在别处所说（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/3/#L3,5-6">约 3:3,5-6</a>），是人人需要的，包括婴儿。婴儿将带着洗礼中所穿的基督（<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/3/#L27">加 3:27</a>）长大——按代父母的信心（详见<a href="https://bibleox.com/ru/ru/w/крещение#HH-Действие-благодати-Божьей-по-вере-других-людей">上帝的恩典按他人的信心运作</a>）。随着婴儿能力的增长，代父母使他在信心里坚固。如果不幸发生，婴儿因悲惨的情形死去，那么，作为受过洗的，他达到天国、与基督同享永生。</p><p>至于救主话语的次序（信而受洗），也有相反的次序：</p><blockquote><p>“照这话，约翰来了，在旷野施洗，<strong><mark>传悔改的洗礼</mark></strong>，使罪得赦。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/1/#L4">可 1:4</a>)</p></blockquote><p>那么就请他们也承认这里是先施行悔改的洗、然后才有宣讲。</p><h3>“可是基督只在三十岁受洗？”</h3><p>先知施洗约翰的洗礼不是基督里的洗礼。已经受过约翰之洗的人，使徒保罗重新给他们施基督的洗：</p><blockquote><p>“问他们说：「你们信的时候，受了圣灵没有？」他们回答说：「没有，也未曾听见有圣灵赐下来。」 保罗说：「这样，<strong><mark>你们受的是什么洗呢</mark></strong>？」他们说：「<strong><mark>是约翰的洗</mark></strong>。」 保罗说：「<strong><mark>约翰所行的是悔改的洗</mark></strong>，告诉百姓当信那在他以后要来的，就是耶稣。」 <strong><mark>他们听见这话，就奉主耶稣的名受洗</mark></strong>。 <strong><mark>保罗按手在他们头上，圣灵便降在他们身上</mark></strong>，他们就说方言，又说预言。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/19/#L2-6">徒 19:2-6</a>)</p></blockquote><p>此外，从那些在这事上不效法基督的人——不在三十岁受洗、虽然不在婴儿期、但也不等到三十岁而是在八到十二岁给自己的孩子施洗——听到这样的指责，是很奇怪的。如果教会的指控者认为受洗的年龄应当效法基督（他受约翰的洗），那么要领洗，他看来也得等到三十岁。然而这不对，因为先知约翰悔改的洗不是基督里的洗（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/19/#L2-6">徒 19:2-6</a>）。基督等候三十岁不是为了受洗，而是为了出来任职事奉（<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/4/#L3">民 4:3</a>）、出来宣讲、显明自己的荣耀。他的宣讲以先知约翰的见证开始——约翰指着来到他那里受洗的耶稣，指明他就是基督。约翰是先知。他什么时候指明救主来临之预言的应验？什么时候指着救主？当救主预备好出来任职的时候——三十岁（<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/4/#L3">民 4:3</a>）。</p><h3>“可是那悔改的强盗没来得及受洗，却得救了？”</h3><p>那是在主还没有设立洗礼圣奥秘的时候。信了并悔改的强盗，不经水的洗礼得了救——如同旧约的义人在新约教会建立之前的得救；这教会要在基督被钉之后52天（2+40+10）才出现。</p><p><strong>洗礼——从水和圣灵而生</strong></p><blockquote><p>“耶稣说：「我实实在在的告诉你，<strong><mark>人若不是从水和圣灵生的</mark></strong>，<strong><mark>就不能进上帝的国</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/3/#L5">约 3:5</a>)</p></blockquote><p><strong>基督将用圣灵施洗</strong></p><blockquote><p>“约翰说：「我是用水给你们施洗，但有一位能力比我更大的要来，我就是给他解鞋带也不配。<strong><mark>他要用圣灵与火给你们施洗</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/3/#L16">路 3:16</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/mf/3/#L11">太 3:11</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/mk/1/#L8">可 1:8</a>)</p></blockquote><p><strong>基督不去，圣灵不来</strong></p><blockquote><p>“然而我将真情告诉你们：我去是与你们有益的。<strong><mark>我若不去，保惠师就不到你们这里来</mark></strong>；我若去，就差他来。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/16/#L7">约 16:7</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/in/14/#L16">约 14:16</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/in/14/#L26">约 14:26</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/in/7/#L38-39">约 7:38-39</a>)</p></blockquote><blockquote><p>“但我要<strong><mark>从父那里差保惠师来</mark></strong>，就是从父出来真理的圣灵，他来了，<strong><mark>就要为我作见证</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/15/#L26">约 15:26</a>)</p></blockquote><blockquote><p>“我要将我父所应许的降在你们身上，<strong><mark>你们要在城里等候，直到你们领受从上头来的能力</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/24/#L49">路 24:49</a>)</p></blockquote><p><strong>基督复活之后还未升到父那里去</strong></p><blockquote><p>“耶稣说：「不要摸我，因<strong><mark>我还没有升上去见我的父</mark></strong>。你往我弟兄那里去，告诉他们说，我要升上去见我的父，也是你们的父；见我的上帝，也是你们的上帝。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/20/#L17">约 20:17</a>)</p></blockquote><p><strong>所应许的圣灵的洗礼，在基督复活50天后首次成就</strong></p><blockquote><p>“提阿非罗啊，我已经作了前书，论到耶稣开头一切所行所教训的， 直到他借着圣灵吩咐所拣选的使徒，以后被接上升的日子为止。 他受害之后，用许多的凭据将自己活活的显给使徒看，<strong><mark>四十天之久向他们显现</mark></strong>，讲说上帝国的事。 耶稣和他们聚集的时候，嘱咐他们说：「不要离开耶路撒冷，要等候父所应许的，就是你们听见我说过的。 <strong><mark>约翰是用水施洗</mark></strong>，但不多几日，<strong><mark>你们要受圣灵的洗</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/1/#L1-5">徒 1:1-5</a>)</p></blockquote><blockquote><p>“提阿非罗啊，我已经作了前书，论到耶稣开头一切所行所教训的， 直到他借着圣灵吩咐所拣选的使徒，以后被接上升的日子为止。 他受害之后，用许多的凭据将自己活活的显给使徒看，<strong><mark>四十天之久向他们显现</mark></strong>，讲说上帝国的事。 耶稣和他们聚集的时候，嘱咐他们说：「不要离开耶路撒冷，要等候父所应许的，就是你们听见我说过的。 <strong><mark>约翰是用水施洗</mark></strong>，但不多几日，<strong><mark>你们要受圣灵的洗</mark></strong>。」 &lt;…&gt; <strong><mark>但圣灵降临在你们身上，你们就必得着能力</mark></strong>；并要在耶路撒冷、犹太全地和撒玛利亚，直到地极，作我的见证。」 说了这话，他们正看的时候，他就被取上升，<strong><mark>有一朵云彩把他接去</mark></strong>，便看不见他了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/1/#L1-5,8-9">徒 1:1-5,8-9</a>)</p></blockquote><blockquote><p>“<strong><mark>五旬节到了</mark></strong>，门徒都聚集在一处。 &lt;…&gt; <strong><mark>又有舌头如火焰显现出来，分开落在他们各人头上</mark></strong>。 <strong><mark>他们就都被圣灵充满</mark></strong>，按着圣灵所赐的口才说起别国的话来。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/2/#L1,3-4">徒 2:1,3-4</a>)</p></blockquote><p>不过，在基督复活的当天也讲到差遣圣灵，但没有讲到洗礼。这是司祭等次的设立，同时赐下赦罪和不赦罪的权柄：</p><blockquote><p>“七日的第一日清早，天还黑的时候，抹大拉的马利亚来到坟墓那里，看见石头从坟墓挪开了， &lt;…&gt; 那日（就是七日的第一日）晚上，门徒所在的地方，因怕犹太人，门都关了。<strong><mark>耶稣来站在当中</mark></strong>，对他们说：「愿你们平安！」 &lt;…&gt; 说了这话，<strong><mark>就向他们吹一口气，说</mark></strong>：「你们受圣灵。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/20/#L1,19,22">约 20:1,19,22</a>)</p></blockquote><h3>“不要禁止小孩子到基督这里来”</h3><p>与教会分离的团体指责教会：教会关于不經洗礼不能得救的教训（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/3/#L3,5-6">约 3:3,5-6</a>）仿佛妨碍婴儿得救。教会仿佛不让婴儿到基督那里去。他们引用下面这节经文：</p><blockquote><p>“<strong><mark>有人抱着自己的婴孩来见耶稣</mark></strong>，要他摸他们；门徒看见就责备那些人。 耶稣却叫他们来，说：「<strong><mark>让小孩子到我这里来，不要禁止他们</mark></strong>，因为在上帝国的正是这样的人。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/18/#L15-16">路 18:15-16</a>)</p></blockquote><p>实际上，这节经文所责备的，恰恰是婴儿洗礼的反对者。</p><p>圣经的这一情形里字面地发生了什么？</p><ol><li><p><strong>母亲们把婴孩带到基督那里</strong>，求主祝福他们；</p></li><li><p><strong>门徒拦在路上</strong>，禁止他们把婴孩带到基督那里；</p></li><li><p><strong>主为母亲们开了路</strong>，指示门徒不要拦阻把婴孩带到他那里，并祝福了婴孩（<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/10/#L16">可 10:16</a>）。</p></li></ol><p>教会的反对者在做什么？</p><ol><li><p>母亲们愿意让婴孩从出生就归向基督（这是我们亲自从脱离教派的母亲们那里知道的）；</p></li><li><p>教会的反对者拦在母亲们的路上，字面地禁止她们给孩子施洗——圣经称洗礼为穿上基督（<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/3/#L27">加 3:27</a>）。</p></li></ol><p>教会在做什么？</p><ol><li><p>召母亲们带着自己的婴孩到基督那里；</p></li><li><p>当母亲们把婴孩带来时，教会藉洗礼、圣餐礼和圣物使婴孩归向基督，赐给他们祝福。</p></li></ol><p>教会的反对者把一切颠倒了。教会召母亲们和婴孩到基督那里，他们说这是与基督联合的障碍；而他们禁止母亲们给孩子施洗，倒说是“不阻碍”孩子到基督那里去。</p><p>教会的教训丝毫不妨碍基督拯救婴孩——如果婴孩不经洗礼就能得救的话。而教派禁止给婴儿施洗，倒是非常妨碍婴孩的得救——考虑到基督说过，不经洗礼没有人能进上帝的国（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/3/#L3,5-6">约 3:3,5-6</a>）。</p><h3>“罪的赦免发生在获得信心的时候，而不是浸在水里？”</h3><p>许多新教徒称水的洗礼只是见证（某种记号），而人的重生和罪的赦免——他们认为——发生得更早：只要人信了、为自己的罪向上帝认罪就发生了。然而，我们在圣经里看到：正是在水的洗礼中人重生、罪被洗净，正是它对人是救人的。</p><p>扫罗（未来的使徒保罗）被基督弄瞎了眼，并且立刻<strong>信了</strong>他；但这没有使他的罪得赦。扫罗被打发到大马士革去，为要藉领受水的洗礼洗去他的罪：</p><blockquote><p>“我回答说：『<strong><mark>主啊，你是谁</mark></strong>？』他说：『我就是你所逼迫的拿撒勒人耶稣。』 &lt;…&gt; 我说：『<strong><mark>主啊，我当作什么</mark></strong>？』主说：『起来！进大马色去，在那里，要将所派你作的一切事告诉你。』 我因那光的荣耀不能看见，同行的人就拉着我手进了大马色。 那里有一个人，名叫亚拿尼亚，按着律法是虔诚人，为一切住在那里的犹太人所称赞。 他来见我，站在旁边对我说：『<strong><mark>兄弟扫罗，你可以看见</mark></strong>。』我当时往上一看，就看见了他。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/22/#L8,10-13">徒 22:8,10-13</a>)</p></blockquote><p>信了的扫罗需要藉洗礼洗去罪：</p><blockquote><p>“现在你为什么耽延呢？<strong><mark>起来，求告他的名受洗，洗去你的罪</mark></strong>。』」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/22/#L16">徒 22:16</a>)</p></blockquote><p>另一处直接说，洗礼救人（而不是见证）：</p><blockquote><p>“<strong><mark>这水所表明的洗礼，现在借着耶稣基督复活，也拯救你们</mark></strong>；这洗礼本不在乎除掉肉体的污秽，只求在上帝面前有无亏的良心。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/3/#L21">彼前 3:21</a>)</p></blockquote><blockquote><p>“他便救了我们，并不是因我们自己所行的义，乃是照他的怜悯，<strong><mark>借着重生的洗和圣灵的更新</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/tit/3/#L5">多 3:5</a>)</p></blockquote><h3>“人是因传讲基督的道而属灵地重生？”</h3><p>否认上帝在圣奥秘中运作的新教徒，也否认人在洗礼的水中属灵地重生。否认这一点，他们教导人说，“从水和圣灵”的生（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/3/#L3,5">约 3:3,5</a>）仿佛只在宣讲的时刻发生，其余的一切——隆重的象征性活动。为论证这一观念，他们引用这些经文：</p><blockquote><p>“<strong><mark>他按自己的旨意，用真道生了我们</mark></strong>，叫我们在他所造的万物中，好像初熟的果子。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/1/#L18">雅 1:18</a>)</p></blockquote><blockquote><p>“<strong><mark>你们蒙了重生</mark></strong>，不是由于能坏的种子，<strong><mark>乃是由于不能坏的种子，是借着上帝活泼常存的道</mark></strong>。 因为：『凡有血气的，尽都如草，他的美荣都像草上的花。草必枯干，花必凋谢； 惟有主的道是永存的。』<strong><mark>所传给你们的福音就是这道</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/1/#L23-25">彼前 1:23-25</a>)</p></blockquote><p>教会宣讲福音有上帝的协助，他在听道人的灵魂上动工。这宣讲可以在人里面产生转变，呼召他悔改、指引他生命的道路。上帝的道是唤醒人脱离罪的沉睡、在人里面激起悔改、生发信心的手段。然而，这宣讲还没有洁净人的罪，还不是在重生的水洗中（<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/5/#L25-26">弗 5:25-26</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/tit/3/#L5">多 3:5</a>）从水和圣灵而生（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/3/#L3,5">约 3:3,5</a>）。</p><p>在别处清楚地说：为使罪得赦，必须领受在水中举行的洗礼圣奥秘：</p><blockquote><p>“现在你为什么耽延呢？<strong><mark>起来，求告他的名受洗，洗去你的罪</mark></strong>。』」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/22/#L16">徒 22:16</a>)</p></blockquote><p>没有信心和悔改的人不被允许受洗。所以首先他必须听上帝的道，然后由听道而来的信心（<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/10/#L17">罗 10:17</a>），然后才是从水和圣灵而生、罪的洗净、以及在洗礼和圣膏中受圣灵的印记。</p><p>使徒先宣讲上帝的道；当听众<strong>觉得扎心</strong>时，他就呼召他们受洗使罪得赦：</p><blockquote><p>“<strong><mark>众人听见这话，觉得扎心</mark></strong>，就对彼得和其余的使徒说：「弟兄们，<strong><mark>我们当怎样行</mark></strong>？」 彼得说：「<strong><mark>你们各人要悔改</mark></strong>，<strong><mark>奉耶稣基督的名受洗</mark></strong>，<strong><mark>叫你们的罪得赦</mark></strong>，就必领受所赐的圣灵；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/2/#L37-38">徒 2:37-38</a>)</p></blockquote><h3>“洗礼不在乎除掉肉体的污秽，只求……”</h3><blockquote><p>“<strong><mark>这水所表明的洗礼</mark></strong>，现在借着耶稣基督复活，也拯救你们；这洗礼本不在乎除掉肉体的污秽，<strong><mark>只求在上帝面前有无亏的良心</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/3/#L21">彼前 3:21</a>)</p></blockquote><p>这一处在俄文里译得不正确。差别是根本性的：在“许诺”里没有任何圣奥秘，不从上帝领受什么；相反，是人向他许诺。而当人向上帝祈求时，从上帝那边期待的是行动（圣奥秘）：藉着罪的赦免（从上帝那边）获得无亏的、清洁的良心（<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/9/#L14">希 9:14</a>），不被先前的罪所累。而如果浸入水里时如新教徒所想的那样什么也不举行，那还向上帝求什么呢——如果他在这里什么也不赐。</p><p>使徒彼得的书信是用希腊文写的。圣兄弟基里尔和梅福季——通晓斯拉夫语的希腊人——把 ἐπερώτημα 译作“祈求”（вопрошание），而不是“许诺”：向上帝祈求无亏的良心。</p><p>同样，古代基督徒之一——希腊人、教会的主教神学家格列高利（四世纪）——写道，这里说的是上帝的作为：按祈求赐给人无亏的良心（[俄文](https://azbyka.ru/otechnik/Grigorij_Bogoslov/slova-izd-2007-g/40)《讲道集》第40篇·论圣洗礼）。</p><p>而且，总的来说，在新约文本中这个词一次也没有被译作“许诺”，总是译作“祈求、问”。</p><ul><li><p>ἐπερωτῆσαι——问（太 22:46）</p></li><li><p>ἐπερωτῶσιν——问（可 7:5）</p></li><li><p>ἐπερωτῆσαι——问（可 9:32）</p></li><li><p>Ἐπερωτήσω——我要问（可 11:29）</p></li><li><p>ἐπερωτῆσαι——问（可 12:34）</p></li><li><p>ἐπερωτῶντα——问的（路 2:46）</p></li><li><p>Ἐπερωτῶ——我要问（路 6:9）</p></li><li><p>Ἐπερωτηθεὶς——被问（路 17:20）</p></li><li><p>ἐπερωτᾶν——问（路 20:40）</p></li><li><p>ἐπερωτήσατε——你们问（约 9:23）</p></li><li><p>ἐπερωτήσας——问了（徒 23:34）</p></li><li><p>ἐπερωτῶσιν——问过的（罗 10:20）</p></li><li><p>ἐπερωτάτωσαν——问（林前 14:35）</p></li><li><p>ἐπερώτημα——祈求（教会斯拉夫语译法）（彼前 3:21）</p></li></ul><p>就是说，不是人给上帝什么——如果那是“许诺”的话。人只是祈求，而赐下的是上帝（直接写着：“<strong>洗净你们的心</strong>”，<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/9/#L14">希 9:14</a>）。</p><p>使徒指明：洗礼洗去的不是身体上的污秽（不在乎除掉肉体的污秽），而是内在地洗净罪。就是说，这是圣奥秘——重要的、肉眼看不见的、不能完全领会和说明的事。</p><p>这一切都在圣灵对水的运作中发生；所以主耶稣基督说，人从水和圣灵而生，而不只是从圣灵：</p><blockquote><p>“耶稣回答说：「我实实在在的告诉你，<strong><mark>人若不重生</mark></strong>，就不能见上帝的国。」 &lt;…&gt; 耶稣说：「我实实在在的告诉你，人若不是<strong><mark>从水和圣灵生的</mark></strong>，就不能进上帝的国。 <strong><mark>从肉身生的就是肉身</mark></strong>；<strong><mark>从灵生的就是灵</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/3/#L3,5-6">约 3:3,5-6</a>)</p></blockquote><p>况且，使徒最终说的话是：洗礼——<strong>拯救</strong>：</p><blockquote><p>“<strong><mark>这水所表明的洗礼，现在借着耶稣基督复活，也拯救你们</mark></strong>；这洗礼本不在乎除掉肉体的污秽，只求在上帝面前有无亏的良心。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/3/#L21">彼前 3:21</a>)</p></blockquote><p>而新教徒（浸信会）根本不同意这一点。在他们的教导里，洗礼只是隆重的许诺，是形式，不救人。而使徒说，洗礼正是<strong>拯救</strong>的。</p><p>他们认为，在获得信心和悔改的时刻罪就得赦免了；而使徒保罗虽然信了，后来却被吩咐受洗以洗去罪：</p><blockquote><p>“现在你为什么耽延呢？<strong><mark>起来，求告他的名受洗，洗去你的罪</mark></strong>。』」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/22/#L16">徒 22:16</a>)</p></blockquote><p>这里也如此说：</p><blockquote><p>“彼得说：「<strong><mark>你们各人要悔改，奉耶稣基督的名受洗，叫你们的罪得赦</mark></strong>，就必领受所赐的圣灵；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/2/#L38">徒 2:38</a>)</p></blockquote><h3>“洗净罪的不是洗礼，而是上帝的道？”</h3><blockquote><p>“你们作丈夫的，要爱你们的妻子，正如基督爱教会，为教会舍己。 <strong><mark>要用水借着道把教会洗净</mark></strong>，成为圣洁，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/5/#L25-26">弗 5:25-26</a>)</p></blockquote><p>基督为教会舍了自己，为要使她成为圣洁。怎样洁净？——“用水借着道”，即圣洗礼：在三次浸入水中时，念诵奉父、子、圣灵之名的话（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/28/#L19">太 28:19</a>）。这里说的正是这话。而且无论哪一样（水）、哪一样（关于父、子和圣灵的话）都不能排除。作别的解释，就是断章取义。这里说的是在<strong>水的洗</strong>中念诵的道。</p><h3>关于百夫长哥尼流：圣灵不经洗礼赐下吗？</h3><p>灵恩派教派的拥护者为他们关于自己仿佛只凭祈祷就领受圣灵的教训辩护。他们引用圣灵唯一一次在洗礼之前降临的情形：</p><blockquote><p>“彼得还说这话的时候，<strong><mark>圣灵降在一切听道的人身上</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/10/#L44">徒 10:44</a>)</p></blockquote><p>这里讲的是百夫长哥尼流，他是外邦人。当时不清楚：能不能给他们施洗，能不能接纳外邦人进入教会。</p><p>所以上帝赐下特别的启示，表明外邦人可以进入教会。</p><ol><li><p>上帝差到外邦人哥尼流那里的不是圣灵，而是天使，叫他去找教会、请使徒来听，好得救。</p></li><li><p>使徒彼得三次看见同一个异象：不洁的食物降到他面前，有声音吩咐他宰了吃；因为这声音解释说：“上帝所洁净的，你不可当作俗物”（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/10/#L15">徒 10:15</a>）</p></li><li><p>当使徒来到并开始宣讲时，圣灵降在听道的外邦人身上。</p></li></ol><p>之后，犹太血统的基督徒对所发生的事惊讶。怎么这样——圣灵降在外邦人身上？</p><blockquote><p>“那些奉割礼和彼得同来的信徒，<strong><mark>见圣灵的恩赐也浇在外邦人身上，就都希奇</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/10/#L45">徒 10:45</a>)</p></blockquote><p>然后一切以外邦人受洗结束——如今他们无疑可以受洗了，因为上帝亲自指明了这一点：</p><blockquote><p>“于是彼得说：「这些人既受了圣灵，与我们一样，<strong><mark>谁能禁止用水给他们施洗呢</mark></strong>？」 <strong><mark>就吩咐奉耶稣基督的名给他们施洗</mark></strong>。他们又请彼得住了几天。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/10/#L47-48">徒 10:47-48</a>)</p></blockquote><p>这样，这是圣灵在洗礼之前降临的唯一一例。不是代替洗礼，而是在它之前——因为洗礼还是举行了。而这一特殊的圣灵降临有一个例外性的缘由——上帝以圣灵表明：可以接纳外邦人进入教会。</p><p>圣灵降临在人身上本身，是与洗礼分开的圣奥秘（详见<a href="https://bibleox.com/ru/ru/w/миропомазание">圣膏</a>）。</p><h3>“太监不经使徒就领受了圣灵？”</h3><p>这个问题属于圣膏的主题（见<a href="https://bibleox.com/ru/ru/w/миропомазание#HH-Если-сообщать-дары-Святого-Духа-могут-только-апостолы-то-почему-Святой-Дух-сходит-на-эфиопского-евнуха-после-крещения-от-диакона-Филиппа">圣膏</a>）。在腓利与太监的情形中（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/8/#L39">徒 8:39</a>）有一个非常重要的细节。</p><p>绝大多数释经者——包括最古老的，包括圣金口约翰——引用这段经文时都没有关于圣灵降临的话（αγιον επεπεϲεν επι τον ευνουχον αγγελοϲ δε）。经上只是说：</p><p>主<s>灵降在太监身上，而天使</s>把腓利提了去。</p><p>西奈抄本没有这些话（四世纪）：</p><p>“καὶ ἐκέλευσεν στῆναι τὸ ἅρμα,</p><p>καὶ κατέβησαν ἀμφότεροι εἰς τὸ ὕδωρ,</p><p>ὁ τε Φίλιππος καὶ ὁ εὐνοῦχος,</p><p>καὶ ἐβάπτισεν αὐτόν.</p><p>ὅτε δὲ ἀνέβησαν ἐκ τοῦ ὕδατος,</p><p><strong>πνεῦμα Κυρίου ἥρπασε τὸν Φίλιππον</strong>,</p><p>καὶ οὐκ εἶδεν αὐτὸν οὐκέτι ὁ εὐνοῦχος·</p><p>ἐπορεύετο γὰρ τὴν ὁδὸν αὐτοῦ χαίρων.</p><p>Φίλιππος δὲ εὑρέθη εἰς Ἄζωτον,</p><p>καὶ διερχόμενος εὐηγγελίζετο τὰς πόλεις πάσας,</p><p>ἕως τοῦ ἐλθεῖν αὐτὸν εἰς Καισάριαν.”（使徒行传 8:39-40）</p><p>梵蒂冈抄本没有这些话（四世纪）：</p><p>“και εκελευϲε ϲτηναι το αρμα και κατεβηϲαν αμφοτεροι ειϲ το υδωρ ο τε φιλιπποϲ και ο ευνουχοϲ και εβαπτιϲεν αυτον</p><p>οτε δε ανεβηϲαν εκ του υδατοϲ <strong>πνευμα κ̅υ̅ ηρπαϲεν το̅ φιλιππον</strong> και ουκ ειδε̅ αυτον ουκετι ο ευνουχοϲ επορευετο γαρ αυτου την οδον χαιρων”</p><p>圣金口约翰也是这样引用的（没有圣灵降临的话）：</p><p>“Ὅτε δὲ ἀνέβησαν ἀπὸ τοῦ ὕδατος, <strong>Πνεῦμα Κυρίου ἥρπασε τὸν Φίλιππον</strong>, καὶ οὐκ εἶδεν αὐτὸν οὐκ ἔτι ὁ εὐνοῦχος.”</p><p>（[俄文](https://bibleox.com/el/grc/w/dNiR_Ὁμιλίαι_εἰς_τὰς_Πράξεις_τῶν_Ἀποστόλων#HH-ΟΜΙΛΙΑ-ΙΘ΄)《使徒行传讲道集》第9篇）</p><p>主教米哈伊尔（卢济恩）的注释：</p><p>“‘圣灵降在太监身上，主的使者却把腓利提了去’：这一处只有少数古代希腊抄本和译本（教会斯拉夫语和俄语译本依从它们）以及少数古代释经者如此读；在大部分抄本和译本以及释经者中（其中如圣金口约翰和提奥菲拉克特）读作：主的灵把腓利提了去。这究竟是一些抄本中的增添，还是另一些抄本中的省略——难以断定；但前一种更可信，此处可以解释为：圣史缄默不言太监领受圣灵的事。”</p><p>（[俄文](https://azbyka.ru/biblia/in/?Act.8:39&r)来源）</p><h2>若干补充</h2><h3>婴儿能够信</h3><p>完全有理由认为，婴儿也能够信、并被圣灵充满，虽然他们还不能回答问题、以宣认自己的信仰。</p><p>先知大卫从婴孩时期就仰赖上帝：</p><blockquote><p>“但你是叫我出母腹的；<strong><mark>我在母怀里，你就使我有倚靠的心</mark></strong>。 我自出母胎就被交在你手里；<strong><mark>从我母亲生我，你就是我的上帝</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/22/#L9-10">诗 22:9-10</a>)</p></blockquote><p>先知约翰在出生之前就感到与救主相遇，并为之欢喜：</p><blockquote><p>“那时候马利亚起身，急忙往山地里去，来到犹大的一座城。 进了撒迦利亚的家，问以利沙伯安。 以利沙伯一听马利亚问安，<strong><mark>所怀的胎就在腹里跳动</mark></strong>。<strong><mark>以利沙伯且被圣灵充满</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/1/#L39-41">路 1:39-41</a>)</p></blockquote><p>基督把一个孩子放在自己面前，讲到那些<strong>信他的</strong>“小子”：</p><blockquote><p>“<strong><mark>耶稣便叫一个小孩子来</mark></strong>，使他站在他们当中， 说：「我实在告诉你们：<strong><mark>你们若不回转，变成小孩子的样式</mark></strong>，断不得进天国。 所以，凡自己谦卑像这小孩子的，他在天国里就是最大的。 凡为我的名接待一个像这小孩子的，就是接待我。 <strong><mark>凡使这信我的一个小子跌倒的</mark></strong>，倒不如把大磨石拴在这人的颈项上，沉在深海里。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/18/#L2-6">太 18:2-6</a>)</p></blockquote><p>孩子们在基督进入耶路撒冷时赞美他：</p><blockquote><p>“祭司长和文士看见耶稣所行的奇事，又见<strong><mark>小孩子在殿里喊着说</mark></strong>：「和散那归于大卫的子孙！」就甚恼怒， 对他说：「这些人所说的，你听见了吗？」耶稣说：「是的。经上说：『<strong><mark>你从婴孩和吃奶的口中完全了赞美的话</mark></strong>。』你们没有念过吗？」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/21/#L15-16">太 21:15-16</a>)</p></blockquote><h3>没有说谁可以不经洗礼而得救</h3><p>圣经里没有说谁可以不经洗礼而得救的话。倒是说了：不经洗礼没有人能进上帝的国（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/3/#L3,5-6">约 3:3,5-6</a>）。</p>
