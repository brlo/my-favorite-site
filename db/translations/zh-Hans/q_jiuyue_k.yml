  path: QO19A_旧约的缔立
  title: 旧约的缔立
  copy_cover: true
  body: <h2>与亚伯拉罕的约</h2><h3>应许</h3><blockquote><p>“耶和华对亚伯兰说：「你要离开本地、本族、父家，往我所要指示你的地去。 <strong><mark>我必叫你成为大国</mark></strong>。<strong><mark>我必赐福给你</mark></strong>，<strong><mark>叫你的名为大</mark></strong>，<strong><mark>你也要叫别人得福</mark></strong>。 <strong><mark>为你祝福的，我必赐福与他</mark></strong>；<strong><mark>那咒诅你的，我必咒诅他</mark></strong>。<strong><mark>地上的万族都要因你得福</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/12/#L1-3">创 12:1-3</a>)</p></blockquote><h3>约</h3><blockquote><p>“「我与你立约，<strong><mark>你要作多国的父</mark></strong>。 从此以后，你的名不再叫亚伯兰，<strong><mark>要叫亚伯拉罕</mark></strong>，因为我已立你作多国的父。 我必使你的后裔极其繁多，<strong><mark>国度从你而立，君王从你而出</mark></strong>。 <strong><mark>我要与你并你世世代代的后裔坚立我的约，作永远的约</mark></strong>，<strong><mark>是要作你和你后裔的上帝</mark></strong>。 我要将你现在寄居的地，就是迦南全地，<strong><mark>赐给你和你的后裔，永远为业</mark></strong>。<strong><mark>我也必作他们的上帝</mark></strong>。」 上帝又对亚伯拉罕说：「你和你的后裔必世世代代遵守我的约。 <strong><mark>你们所有的男子都要受割礼</mark></strong>，<strong><mark>这就是我与你，并你的后裔所立的约</mark></strong>，是你们所当遵守的。 你们都要受割礼，这是我与你们立约的证据。 你们世世代代的男子，无论是家里生的，是在你后裔之外用银子从外人买的，<strong><mark>生下来第八日，都要受割礼</mark></strong>。 你家里生的和你用银子买的，都必须受割礼。这样，我的约就立在你们肉体上，作永远的约。 但不受割礼的男子，必从民中剪除，因他背了我的约。」 上帝又对亚伯拉罕说：「你的妻子撒莱，不可再叫撒莱，她的名要叫撒拉。 我必赐福给她，也要使你从她得一个儿子。我要赐福给她，她也要作多国之母；必有百姓的君王从她而出。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/17/#L4-16">创 17:4-16</a>)</p></blockquote><h3>西奈之约</h3><blockquote><p>“所以你要对以色列人说：『我是耶和华。我要用伸出来的膀臂，重重地刑罚埃及人，救赎你们脱离他们的重担，不作他们的苦工。 <strong><mark>我要以你们为我的百姓</mark></strong>，<strong><mark>我也要作你们的上帝</mark></strong>。你们要知道我是耶和华你们的上帝，是救你们脱离埃及人之重担的。 我起誓应许给亚伯拉罕、以撒、雅各的那地，我要把你们领进去，<strong><mark>将那地赐给你们为业</mark></strong>。我是耶和华。』」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/6/#L6-8">出 6:6-8</a>)</p></blockquote><h2>关于救主来临的应许</h2><h3>对最早的人</h3><blockquote><p>“耶和华上帝对蛇说：「你既作了这事，就必受咒诅，比一切的牲畜野兽更甚！你必用肚子行走，终身吃土。 <strong><mark>我又要叫你和女人彼此为仇</mark></strong>；你的后裔和女人的后裔也彼此为仇。<strong><mark>女人的后裔要伤你的头；你要伤他的脚跟</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/3/#L14-15">创 3:14-15</a>)</p></blockquote><h3>对亚伯拉罕</h3><blockquote><p>“「耶和华说：『你既行了这事，不留下你的儿子，就是你独生的儿子，我便指着自己起誓说： <strong><mark>论福，我必赐大福给你</mark></strong>；<strong><mark>论子孙，我必叫你的子孙多起来</mark></strong>，如同天上的星，海边的沙。你子孙必得着仇敌的城门。 <strong><mark>并且地上万国，都必因你的后裔得福</mark></strong>，因为你听从了我的话。』」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/22/#L16-18">创 22:16-18</a>)</p></blockquote><h3>对以撒</h3><blockquote><p>“耶和华向以撒显现说：「你不要下埃及去，要住在我所指示你的地。 你寄居在这地，<strong><mark>我必与你同在，赐福给你</mark></strong>，<strong><mark>因为我要将这些地都赐给你和你的后裔</mark></strong>。我必坚定我向你父亚伯拉罕所起的誓。 <strong><mark>我要加增你的后裔，像天上的星那样多</mark></strong>；又要将这些地都赐给你的后裔，并且<strong><mark>地上万国必因你的后裔得福</mark></strong>； 都因亚伯拉罕听从我的话、遵守我的吩咐和我的命令、律例、法度。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/26/#L2-5">创 26:2-5</a>)</p></blockquote><h3>对雅各</h3><blockquote><p>“耶和华站在梯子以上说：「我是耶和华，你祖亚伯拉罕的上帝，也是以撒的上帝；<strong><mark>我要将你现在所躺卧之地，赐给你和你的后裔</mark></strong>。 <strong><mark>你的后裔必像地上的尘沙那样多</mark></strong>，必向东西南北开展，<strong><mark>地上万族必因你和你的后裔得福</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/28/#L13-14">创 28:13-14</a>)</p></blockquote><h2>与以色列民的约</h2><blockquote><p>“『我向埃及人所行的事，你们都看见了，且看见我如鹰将你们背在翅膀上，带来归我。 <strong><mark>如今你们若实在听从我的话，遵守我的约，就要在万民中作属我的子民</mark></strong>；因为全地都是我的。 &lt;…&gt; 百姓都同声回答说：「<strong><mark>凡耶和华所说的，我们都要遵行</mark></strong>。」摩西就将百姓的话回复耶和华。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/19/#L4-5,8">出 19:4-5,8</a>)</p></blockquote><blockquote><p>“<strong><mark>你若实在听从他的话，照着我一切所说的去行</mark></strong>，我就向你的仇敌作仇敌，向你的敌人作敌人。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/23/#L22">出 23:22</a>)</p></blockquote><blockquote><p>“又将约书念给百姓听，他们说：「耶和华所吩咐的，<strong><mark>我们都必遵行</mark></strong>。」 摩西将血洒在百姓身上，说：「<strong><mark>你看！这是立约的血</mark></strong>，是耶和华按这一切话与你们立约的凭据。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/24/#L7-8">出 24:7-8</a>)</p></blockquote><h2>以色列背离上帝</h2><blockquote><p>“耶和华吩咐摩西说：「下去吧！因为你的百姓，就是你从埃及地领出来的，<strong><mark>已经败坏了</mark></strong>。 <strong><mark>他们快快偏离了我所吩咐的道</mark></strong>，为自己铸了一只牛犊，向牠下拜献祭说：『以色列啊，这就是领你出埃及地的神。』」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/32/#L7-8">出 32:7-8</a>)</p></blockquote><blockquote><p>“「<strong><mark>因为我的百姓作了两件恶事</mark></strong>，就是离弃我这活水的泉源，为自己凿出池子，是破裂不能存水的池子。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ier/2/#L13">耶 2:13</a>)</p></blockquote><blockquote><p>“我的民求问木偶，以为木杖能指示他们，因为他们的淫心使他们失迷，<strong><mark>他们就行淫离弃上帝，不守约束</mark></strong>。 <strong><mark>在各山顶，各高冈的橡树、杨树、栗树之下献祭烧香</mark></strong>，因为树影美好。所以，你们的女儿淫乱，你们的新妇行淫。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/os/4/#L12-13">何 4:12-13</a>)</p></blockquote><blockquote><p>“牛认识主人，驴认识主人的槽；<strong><mark>以色列却不认识，我的民却不留意</mark></strong>。 嗐！<strong><mark>犯罪的国民，担着罪孽的百姓</mark></strong>；行恶的种类，败坏的儿女！<strong><mark>他们离弃耶和华，藐视以色列的圣者</mark></strong>，与他生疏，往后退步。 你们为什么屡次悖逆，还要受责打么。你们已经满头疼痛，全心发昏。 <strong><mark>从脚掌到头顶，没有一处完全的</mark></strong>，尽是伤口、青肿与新打的伤痕．都没有收口，没有缠裹，也没有用膏滋润。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/1/#L3-6">赛 1:3-6</a>)</p></blockquote><blockquote><p>“耶和华啊，你的眼目，不是看顾诚实吗？你击打他们，他们却不伤恸；你毁灭他们，<strong><mark>他们仍不受惩治</mark></strong>。他们使脸刚硬过于磐石，<strong><mark>不肯回头</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ier/5/#L3">耶 5:3</a>)</p></blockquote><blockquote><p>“「我倾覆你们中间的城邑，如同我从前倾覆所多玛、蛾摩拉一样，使你们好像从火中抽出来的一根柴，<strong><mark>你们仍不归向我</mark></strong>。」这是耶和华说的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/am/4/#L11">摩 4:11</a>)</p></blockquote><h3>上帝预先警告：他将因何把以色列从应许之地赶出</h3><h4>警告</h4><p>犹太民族曾受到警告：他们得到上帝所应许的地，不是因为他们的义。先前的民族因罪恶满盈而从上帝的地土上被赶出。以色列被上帝领进这地时则受到警告：若他们也照样犯罪，上帝也必将他们从自己的地上赶出：</p><blockquote><p>“耶和华你上帝领你进入要得为业之地，<strong><mark>从你面前赶出许多国民</mark></strong>，就是赫人，革迦撒人、亚摩利人、迦南人、比利洗人、希未人、耶布斯人，<strong><mark>共七国的民，都比你强大</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/7/#L1">申 7:1</a>)</p></blockquote><blockquote><p>“耶和华你的上帝将这些国民从你面前撵出以后，<strong><mark>你心里不可说：『耶和华将我领进来得这地，是因我的义。』</mark></strong>其实，耶和华将他们从你面前赶出去，是因他们的恶。 你进去得他们的地，<strong><mark>并不是因你的义，也不是因你心里正直</mark></strong>，<strong><mark>乃是因这些国民的恶</mark></strong>，耶和华你的上帝将他们从你面前赶出去；又因耶和华要坚定他向你列祖亚伯拉罕、以撒、雅各起誓所应许的话。 你当知道，耶和华你上帝将这美地赐你为业，并不是因你的义，<strong><mark>你本是硬着颈项的百姓</mark></strong>。 <strong><mark>你当记念不忘，你在旷野怎样惹耶和华你上帝发怒</mark></strong>。自从你出了埃及地的那日，直到你们来到这地方，你们时常悖逆耶和华。 你们在何烈山又惹耶和华发怒；他恼怒你们，<strong><mark>要灭绝你们</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/9/#L4-8">申 9:4-8</a>)</p></blockquote><blockquote><p>“你们从前住的埃及地，<strong><mark>那里人的行为，你们不可效法</mark></strong>，我要领你们到的迦南地，那里人的行为，也不可效法，也不可照他们的恶俗行。 &lt;…&gt; <strong><mark>在这一切的事上，你们都不可玷污自己</mark></strong>，因为我在你们面前所逐出的列邦，在这一切的事上玷污了自己。 连地也玷污了，所以我追讨那地的罪孽，那地也吐出它的居民。 <strong><mark>故此你们要守我的律例、典章</mark></strong>。这一切可憎恶的事，无论是本地人，是寄居在你们中间的外人，都不可行。 （在你们以先居住那地的人，行了这一切可憎恶的事，地就玷污了）， <strong><mark>免得你们玷污那地的时候，地就把你们吐出</mark></strong>，像吐出在你们以先的国民一样。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/18/#L3,24-28">利 18:3,24-28</a>)</p></blockquote><blockquote><p>“你若不听从耶和华你上帝的话，不谨守遵行他的一切诫命律例，就是我今日所吩咐你的，<strong><mark>这以下的咒诅都必追随你</mark></strong>，临到你身上： &lt;…&gt; 这书上所写律法的一切话，是叫你敬畏耶和华你上帝可荣可畏的名。<strong><mark>你若不谨守遵行</mark></strong>，耶和华就必将奇灾，就是至大至长的灾，至重至久的病，加在你和你后裔的身上。 &lt;…&gt; 先前耶和华怎样喜悦善待你们，使你们众多，<strong><mark>也要照样喜悦毁灭你们，使你们灭亡</mark></strong>；并且<strong><mark>你们从所要进去得的地上必被拔除</mark></strong>。 <strong><mark>耶和华必使你们分散在万民中</mark></strong>，从地这边到地那边，你必在那里事奉你和你列祖素不认识木头、石头的神。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/28/#L15,58,63-64">申 28:15,58,63-64</a>)</p></blockquote><h4>以色列民所作的，甚至比先前因罪被赶出的那些民族更坏，因此也被赶出</h4><blockquote><p>“他们却不听从。玛拿西引诱他们行恶，<strong><mark>比耶和华在以色列人面前所灭的列国更甚</mark></strong>。 耶和华藉他仆人众先知说： 「因犹大王玛拿西行这些可憎的恶事，<strong><mark>比先前亚摩利人所行的更甚</mark></strong>，使犹大人拜他的偶像，陷在罪里。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/4ts/21/#L9-11">王下 21:9-11</a>)</p></blockquote><blockquote><p>“<strong><mark>你行这一切恶事之后</mark></strong>，（主耶和华说，你有祸了！有祸了！） &lt;…&gt; 你行淫与别的妇女相反，因为不是人从你行淫；你既赠送人，人并不赠送你，所以你与别的妇女相反。 <strong><mark>你这妓女啊，要听耶和华的话</mark></strong>。 &lt;…&gt; 你正是你母亲的女儿，厌弃丈夫和儿女；你正是你姐妹的姐妹，厌弃丈夫和儿女。<strong><mark>你母亲是赫人，你父亲是亚摩利人</mark></strong>。 <strong><mark>你的姐姐是撒玛利亚</mark></strong>，她和她的众女住在你左边；<strong><mark>你的妹妹是所多玛</mark></strong>，她和她的众女住在你右边。 你没有效法他们的行为，也没有照他们可憎的事去作，你以那为小事，<strong><mark>你一切所行的倒比他们更坏</mark></strong>。 主耶和华说，我指着我的永生起誓，<strong><mark>你妹妹所多玛与他的众女，尚未行你和你众女所行的事</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iez/16/#L23,34-35,45-48">结 16:23,34-35,45-48</a>)</p></blockquote><p>在耶稣基督被钉十字架之前，犹太民族所受的最大刑罚是约70年的期限——巴比伦之囚。而在弃绝并杀死基督之后，犹太民族被从自己的地土上赶出约2000年，圣殿至今没有归还。</p><h2>旧约的终结</h2><p><a href="https://bibleox.com/ru/ru/w/Ветхий-Завет-конец">旧约的终结</a></p>
