  path: QO21A_摩西律法的废除
  title: 摩西律法的废除
  copy_cover: true
  body: '<h2>摩西律法废除的详细解释</h2><p>关于摩西律法的废除，见圣教父引文前的序言：<a href="https://bibleox.com/ru/ru/w/Отмена_Закона_Моисея">论摩西律法的废除</a>。</p><h2>摩西律法已被废除</h2><blockquote><p>“但我们既然在捆我们的律法上死了，<strong><mark>现今就脱离了律法</mark></strong>，叫我们服事主，<strong><mark>要按着心灵的新样，不按着仪文的旧样</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/7/#L6">罗 7:6</a>)</p></blockquote><h3>不再在师傅（律法）的手下</h3><blockquote><p>“这样，律法是与上帝的应许反对吗？<strong><mark>断乎不是</mark></strong>！若曾传一个能叫人得生的律法，义就诚然本乎律法了。 但圣经把众人都圈在罪里，使所应许的福因信耶稣基督归给那信的人。 <strong><mark>但这因信得救的理还未来以先，我们被看守在律法之下</mark></strong>，直圈到那将来的真道显明出来。 这样，<strong><mark>律法是我们训蒙的师傅</mark></strong>，引我们到基督那里，使我们因信称义。 但这因信得救的理既然来到，<strong><mark>我们从此就不在师傅的手下了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/3/#L21-25">加 3:21-25</a>)</p></blockquote><blockquote><p>“我说那承受产业的，虽然是全业的主人，但为孩童的时候，却与奴仆毫无分别， <strong><mark>乃在师傅和管家的手下，直等他父亲预定的时候来到</mark></strong>。 &lt;…&gt; 现在你们既然认识上帝，更可说是被上帝所认识的，怎么还要归回那懦弱无用的小学，<strong><mark>情愿再给他作奴仆呢</mark></strong>？ <strong><mark>你们谨守日子、月分、节期、年分</mark></strong>， 我为你们害怕，惟恐我在你们身上是枉费了工夫。 &lt;…&gt; 你们这愿意在律法以下的人，请告诉我，你们岂没有听见律法吗？ &lt;…&gt; 当时，那按着血气生的，逼迫了那按着圣灵生的，现在也是这样。 然而经上是怎么说的呢？是说：『把使女和他儿子赶出去．因为使女的儿子不可与自主妇人的儿子一同承受产业。』 弟兄们，这样看来，我们不是使女的儿女，乃是自主妇人的儿女了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/4/#L1-2,9-11,21,29-31">加 4:1-2,9-11,21,29-31</a>) <em>(这里说的正是安息日，按圣提奥凡的话。 :: !你们这愿意在律法以下的人 :: !那按着血气生的，逼迫了那按着圣灵生的，现在也是这样 ~~ 这里以血气所生的与律法相比较。 :: !把使女和他儿子赶出去 :: !我们不是使女的儿女，乃是自主妇人的儿女了)</em></p></blockquote><h2>关于废除律法的公会议定</h2><p>第一次使徒公会议决定：基督徒没有必要遵守犹太律法的规条：</p><blockquote><p>“惟有几个信徒是法利赛教门的人，起来说：「<strong><mark>必须给外邦人行割礼</mark></strong>，<strong><mark>吩咐他们遵守摩西的律法</mark></strong>。」 <strong><mark>使徒和长老，聚会商议这事</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/15/#L5-6">徒 15:5-6</a>)</p></blockquote><blockquote><p>“我们听说有几个人从我们这里出去，<strong><mark>用言语搅扰你们</mark></strong>，<strong><mark>惑乱你们的心</mark></strong>。〔有古卷在此有『你们必须受割礼，守摩西的律法。』〕<strong><mark>其实我们并没有吩咐他们</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/15/#L24">徒 15:24</a>)</p></blockquote><blockquote><p>“<strong><mark>因为圣灵和我们定意不将别的重担放在你们身上</mark></strong>，<strong><mark>惟有几件事是不可少</mark></strong>的， 就是禁戒祭偶像的物和血，并勒死的牲畜和奸淫。这几件你们若能自己禁戒不犯就好了。愿你们平安！」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/15/#L28-29">徒 15:28-29</a>)</p></blockquote><blockquote><p>“至于信主的外邦人，我们已经写信拟定，<strong><mark>叫他们谨忌那祭偶像之物和血，并勒死的牲畜与奸淫</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/21/#L25">徒 21:25</a>)</p></blockquote><blockquote><p>“他们经过各城，<strong><mark>把耶路撒冷使徒和长老所定的条规交给门徒遵守</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/16/#L4">徒 16:4</a>)</p></blockquote><h2>使徒们和最早的基督徒不按摩西律法生活</h2><h3>对律法以外的人，作律法以外的人（即不遵守它）</h3><blockquote><p>“向犹太人，我就作犹太人，为要得犹太人；向律法以下的人，我虽不在律法以下，还是作律法以下的人，为要得律法以下的人； <strong><mark>向没有律法的人，我就作没有律法的人</mark></strong>，为要得没有律法的人。<strong><mark>其实我在上帝面前，不是没有律法</mark></strong>；<strong><mark>在基督面前，正在律法之下</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/9/#L20-21">林前 9:20-21</a>)</p></blockquote><h3>执事司提反被指控教导律法的改变</h3><blockquote><p>“设下假见证说：「<strong><mark>这个人说话不住的蹧践圣所和律法</mark></strong>， 我们曾听见他说，这拿撒勒人耶稣要毁坏此地，<strong><mark>也要改变摩西所交给我们的规条</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/6/#L13-14">徒 6:13-14</a>)</p></blockquote><h3>使徒保罗被指控教导人不按律法敬拜上帝</h3><blockquote><p>“说：「<strong><mark>这个人，劝人不按着律法敬拜上帝</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/18/#L13">徒 18:13</a>)</p></blockquote><blockquote><p>“他们听见，就归荣耀与上帝，对保罗说：「兄台，你看犹太人中信主的有多少万，并且<strong><mark>都为律法热心</mark></strong>。 他们听见人说，<strong><mark>你教训一切在外邦的犹太人离弃摩西</mark></strong>，对他们说，<strong><mark>不要给孩子行割礼</mark></strong>，<strong><mark>也不要遵行条规</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/21/#L20-21">徒 21:20-21</a>)</p></blockquote><p>如果使徒保罗在传犹太教，那犹太人为什么还要逼迫他呢？他们逼迫他，是因为他离弃了律法：</p><blockquote><p>“基督释放了我们，叫我们得以自由，<strong><mark>所以要站立得稳，不要再被奴仆的轭挟制</mark></strong>。 &lt;…&gt; 弟兄们，<strong><mark>我若仍旧传割礼，为什么还受逼迫呢</mark></strong>？若是这样，那十字架讨厌的地方就没有了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/5/#L1,11">加 5:1,11</a>)</p></blockquote><p>一些基督徒在犹太人面前假装守律法，为的是不受逼迫：</p><blockquote><p>“<strong><mark>凡希图外貌体面的人，都勉强你们受割礼，无非是怕自己为基督的十字架受逼迫</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/6/#L12">加 6:12</a>)</p></blockquote><h3>基督徒不受割礼</h3><blockquote><p>“有人已受割礼蒙召呢，就不要废割礼；<strong><mark>有人未受割礼蒙召呢，就不要受割礼</mark></strong>。 <strong><mark>受割礼算不得什么，不受割礼也算不得什么</mark></strong>，只要守上帝的诫命就是了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/7/#L18-19">林前 7:18-19</a>)</p></blockquote><blockquote><p>“原来在基督耶稣里，<strong><mark>受割礼不受割礼全无功效</mark></strong>；惟独使人生发仁爱的信心才有功效。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/5/#L6">加 5:6</a>)</p></blockquote><blockquote><p>“<strong><mark>受割礼不受割礼都无关紧要</mark></strong>，要紧的就是作新造的人。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/6/#L15">加 6:15</a>)</p></blockquote><blockquote><p>“在此并不分希利尼人、犹太人、<strong><mark>受割礼的、未受割礼的</mark></strong>、化外人、西古提人、为奴的、自主的，惟有基督是包括一切，又住在各人之内。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/3/#L11">西 3:11</a>)</p></blockquote><h3>不献牲畜为祭</h3><blockquote><p>“以上说：『<strong><mark>祭物和礼物，燔祭和赎罪祭，是你不愿意的</mark></strong>，也是你不喜欢的』（这都是按着律法献的）。 后又说：『我来了为要照你的旨意行』。<strong><mark>可见他是除去在先的，为要立定在后的</mark></strong>。 &lt;…&gt; 『主说，那些日子以后，我与他们所立的约乃是这样：<strong><mark>我要将我的律法写在他们心上</mark></strong>，又要放在他们的里面。』 以后就说：『<strong><mark>我不再记念他们的罪愆和他们的过犯</mark></strong>。』 <strong><mark>这些罪过既已赦免，就不用再为罪献祭了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/10/#L8-9,16-18">希 10:8-9,16-18</a>)</p></blockquote><h3>不守安息日</h3><blockquote><p>“<strong><mark>所以不拘在饮食上，或节期、月朔、安息日，都不可让人论断你们</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/2/#L16">西 2:16</a>)</p></blockquote><blockquote><p>“那时，<strong><mark>耶稣在安息日从麦地经过</mark></strong>。<strong><mark>他的门徒饿了，就掐起麦穗来吃</mark></strong>。 法利赛人看见，就对耶稣说：「看哪，你的门徒作安息日不可作的事了！」 &lt;…&gt; 『我喜爱怜恤，不喜爱祭祀。』你们若明白这话的意思，<strong><mark>就不将无罪的当作有罪的了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/12/#L1-2,7">太 12:1-2,7</a>)</p></blockquote><h3>与外邦人来往，自己成为外邦人</h3><blockquote><p>“彼得和他说着话进去，见有好些人在那里聚集， 就对他们说：「你们知道，<strong><mark>犹太人和别国的人亲近来往，本是不合例的</mark></strong>，<strong><mark>但上帝已经指示我，无论什么人都不可看作俗而不洁净的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/10/#L27-28">徒 10:27-28</a>)</p></blockquote><h3>接触死人</h3><p>主耶稣基督接触了睚鲁死去的女儿：</p><blockquote><p>“<strong><mark>就拉着孩子的手，对她说</mark></strong>：「大利大，古米！」繙出来就是说：「闺女，我吩咐你起来！」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/5/#L41">可 5:41</a>)</p></blockquote><p>按律法，基督死在十字架上之后，不能像接触已死之人那样接触他。只有上帝之母作为亲属可以这样作（<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/21/#L1-4">利 21:1-4</a>）。然而，我们不但不定神学家约翰、尼哥底母、亚利马太人约瑟的罪，反而称赞他们毫无畏惧、服事我们的救主。</p><blockquote><p>“<strong><mark>约瑟取了身体，用干净细麻布裹好</mark></strong>， <strong><mark>安放在自己的新坟墓里</mark></strong>，就是他凿在磐石里的。他又把大石头滚到墓门口，就去了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/27/#L59-60">太 27:59-60</a>)</p></blockquote><blockquote><p>“<strong><mark>约翰的门徒听见了，就来把他的尸首领去，葬在坟墓里</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/6/#L29">可 6:29</a>)</p></blockquote><blockquote><p>“既从百夫长得知实情，<strong><mark>就把耶稣的尸首赐给约瑟</mark></strong>。 约瑟买了细麻布，把耶稣取下来，用细麻布裹好，<strong><mark>安放在磐石中凿出来的坟墓里</mark></strong>，又滚过一块石头来挡住墓门。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/15/#L45-46">可 15:45-46</a>)</p></blockquote><blockquote><p>“既成就了经上指着他所记的一切话，<strong><mark>就把他从木头上取下来，放在坟墓里</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/13/#L29">徒 13:29</a>)</p></blockquote><h3>主释放了被控奸淫的妇人</h3><p>律法命令用石头打死犯奸淫的（<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/20/#L10">利 20:10</a>），但主没有定那妇人的罪，而是释放了她：</p><blockquote><p>“她说：「主啊，没有。」耶稣说：「<strong><mark>我也不定你的罪，去吧！从此不要再犯罪了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/8/#L11">约 8:11</a>)</p></blockquote><h3>主命令喝他的血</h3><p>上帝禁止喝血（<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/9/#L4">创 9:4</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/3/#L17">利 3:17</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/7/#L26">利 7:26</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/17/#L14">利 17:14</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/12/#L16">申 12:16</a>），但在最后的晚餐上，把杯递给门徒说：你们都喝这个，这是我的血：</p><blockquote><p>“他们吃的时候，耶稣拿起饼来，祝福，就擘开递给门徒，说：「<strong><mark>你们拿着吃，这是我的身体</mark></strong>。」 又拿起杯来，祝谢了，递给他们，说：「<strong><mark>你们都喝这个</mark></strong>， <strong><mark>因为这是我立约的血，为多人流出来，使罪得赦</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/26/#L26-28">太 26:26-28</a>)</p></blockquote><h3>主成了出自犹大支派的大祭司</h3><p>律法命令祭司只能出自利未支派、亚伦的家族：</p><blockquote><p>“给亚伦和他儿子束上腰带，包上裹头巾，<strong><mark>他们就凭永远的定例得了祭司的职任</mark></strong>；又要将亚伦和他儿子分别为圣。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L9">出 29:9</a>)</p></blockquote><blockquote><p>“<strong><mark>亚伦的圣衣要留给他的子孙</mark></strong>，可以穿着受膏，<strong><mark>又穿着承接圣职</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/29/#L29">出 29:29</a>)</p></blockquote><p>但主成了大祭司，生在犹大支派：</p><blockquote><p>“<strong><mark>我们的主分明是从犹大出来的</mark></strong>，<strong><mark>但这支派，摩西并没有提到祭司</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/7/#L14">希 7:14</a>)</p></blockquote><h3>真正的逾越节祭牲不是在圣殿里献的</h3><p>逾越节的祭牲只能在耶路撒冷圣殿里献：</p><blockquote><p>“<strong><mark>在耶和华你上帝所赐的各城中，你不可献逾越节的祭</mark></strong>； <strong><mark>只当在耶和华你上帝所选择要立为他名的居所</mark></strong>，晚上日落的时候，乃是你出埃及的时候，献逾越节的祭。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/16/#L5-6">申 16:5-6</a>)</p></blockquote><blockquote><p>“<strong><mark>所以耶稣要用自己的血叫百姓成圣，也就在城门外受苦</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/13/#L12">希 13:12</a>)</p></blockquote><h2>十诫也是摩西律法吗？</h2><h3>上帝藉摩西所赐的律法——利未记中的一切诫命</h3><p>利未记中列举了上帝的众多诫命，包括<a href="https://bibleox.com/ru/ru/w/10-заповедей">石版上的诫命</a>，称它们为<strong>上帝藉摩西所立的律例</strong>：</p><blockquote><p>“<strong><mark>这些律例、典章和法度，是耶和华与以色列人在西乃山借着摩西立的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/26/#L46">利 26:46</a>)</p></blockquote><h3>上帝称他的一切诫命为律法</h3><p>例如，收集吗哪的命令就是上帝的律法：</p><blockquote><p>“耶和华对摩西说：「我要将粮食从天降给你们。百姓可以出去，每天收每天的分，<strong><mark>我好试验他们遵不遵我的法度</mark></strong>。 &lt;…&gt; 耶和华对摩西说：「<strong><mark>你们不肯守我的诫命和律法要到几时呢</mark></strong>？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/16/#L4,28">出 16:4,28</a>)</p></blockquote><p>出埃及记第16、24、31、34、35章；申命记第4、6、10章。</p><h3>新的律法已不再写在石版上，而是写在心里</h3><p>写在石版上的，被称为「律法」：</p><blockquote><p>“耶和华说：「那些日子以后，我与以色列家所立的约乃是这样：<strong><mark>我要将我的律法放在他们里面，写在他们心上</mark></strong>。我要作他们的上帝，他们要作我的子民。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ier/31/#L33">耶 31:33</a>)</p></blockquote><blockquote><p>“你们明显是基督的信，借着我们修成的。不是用墨写的，乃是用永生上帝的灵写的；<strong><mark>不是写在石版上，乃是写在心版上</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/3/#L3">林后 3:3</a>)</p></blockquote><h3>基督讲论诫命，并不特别突出十诫</h3><blockquote><p>“你们听见有吩咐古人的话，说：『<strong><mark>不可杀人</mark></strong>』，又说，『凡杀人的，难免受审判。』 &lt;…&gt; 你们听见有话说：『<strong><mark>不可奸淫</mark></strong>。』 &lt;…&gt; 你们又听见有吩咐古人的话，说：『<strong><mark>不可背誓</mark></strong>，所起的誓，总要向主谨守。 &lt;…&gt; 你们听见有话说：『<strong><mark>以眼还眼，以牙还牙</mark></strong>。』 &lt;…&gt; 你们听见有话说：『<strong><mark>当爱你的邻舍</mark></strong>，恨你的仇敌。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L21,27,33,38,43">太 5:21,27,33,38,43</a>) <em>(出 21:24；利 19:18。)</em></p></blockquote><h3>使徒们把十诫直接称为律法</h3><p>使徒雅各说，违犯「不可杀人」诫命的人，就是犯律法的：</p><blockquote><p>“因为凡遵守全律法的，<strong><mark>只在一条上跌倒，他就是犯了众条</mark></strong>。 原来那说『不可奸淫』的，也说『不可杀人』。<strong><mark>你就是不奸淫，却杀人，仍是成了犯律法的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/2/#L10-11">雅 2:10-11</a>)</p></blockquote><h2>律法不能拯救</h2><h3>律法——将来美事的影儿、罪的提醒</h3><blockquote><p>“<strong><mark>律法既是将来美事的影儿，不是本物的真像</mark></strong>，总不能借着每年常献一样的祭物，叫那近前来的人得以完全。 若不然，献祭的事岂不早已止住了吗？因为礼拜的人，良心既被洁净，就不再觉得有罪了。 <strong><mark>但这些祭物是叫人每年想起罪来</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/10/#L1-3">希 10:1-3</a>)</p></blockquote><h3>律法不能拯救：无论律法的知识还是行为</h3><blockquote><p>“这样，律法是与上帝的应许反对吗？断乎不是！<strong><mark>若曾传一个能叫人得生的律法，义就诚然本乎律法了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/3/#L21">加 3:21</a>)</p></blockquote><h3>遵行律法的字句不能拯救</h3><blockquote><p>“我告诉你们：<strong><mark>你们的义若不胜于文士和法利赛人的义，断不能进天国</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L20">太 5:20</a>)</p></blockquote><blockquote><p>“我若能说万人的方言，并天使的话语，<strong><mark>却没有爱</mark></strong>，<strong><mark>我就成了鸣的锣、响的钹一般</mark></strong>。 我若有先知讲道之能，也明白各样的奥祕、各样的知识，而且有全备的信，叫我能够移山，却没有爱，<strong><mark>我就算不得什么</mark></strong>。 我若将所有的赒济穷人，又舍己身叫人焚烧，却没有爱，<strong><mark>仍然与我无益</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/13/#L1-3">林前 13:1-3</a>)</p></blockquote><h3>违犯律法导致定罪</h3><blockquote><p>“凡没有律法犯了罪的，也必不按律法灭亡；<strong><mark>凡在律法以下犯了罪的，也必按律法受审判</mark></strong>。 （原来，在上帝面前不是听律法的为义，<strong><mark>乃是行律法的称义</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/2/#L12-13">罗 2:12-13</a>)</p></blockquote><h3>谁不遵行全律法——谁就被咒诅</h3><blockquote><p>“凡以行律法为本的，都是被咒诅的，因为经上记着：『<strong><mark>凡不常照律法书上所记一切之事去行的，就被咒诅</mark></strong>。』 没有一个人靠着律法在上帝面前称义，这是明显的．因为经上说，『<strong><mark>义人必因信得生</mark></strong>。』 律法原不本乎信，只说：『<strong><mark>行这些事的，就必因此活着</mark></strong>。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/3/#L10-12">加 3:10-12</a>)</p></blockquote><h3>律法没有使任何人达到完全</h3><blockquote><p>“<strong><mark>先前的条例因软弱无益，所以废掉了</mark></strong>， （<strong><mark>律法原来一无所成</mark></strong>）就<strong><mark>引进了更美的指望</mark></strong>，靠这指望，我们便可以进到上帝面前。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/7/#L18-19">希 7:18-19</a>)</p></blockquote><h2>那么摩西律法为什么是必要的？</h2><h3>律法使人知道罪</h3><blockquote><p>“所以凡有血气的，没有一个因行律法能在上帝面前称义，<strong><mark>因为律法本是叫人知罪</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/3/#L20">罗 3:20</a>)</p></blockquote><blockquote><p>“<strong><mark>律法本是外添的，叫过犯显多</mark></strong>；<strong><mark>只是罪在那里显多，恩典就更显多了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/5/#L20">罗 5:20</a>)</p></blockquote><h3>律法约束罪人（为罪人而有）</h3><blockquote><p>“因为<strong><mark>律法不是为义人设立的</mark></strong>，<strong><mark>乃是为不法和不服的</mark></strong>，不虔诚和犯罪的，不圣洁和恋世俗的，弑父母和杀人的，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/1/#L9">提前 1:9</a>)</p></blockquote><h3>律法使人看见救主的必要（对救主的期待）</h3><blockquote><p>“因为按着我里面的意思，<strong><mark>我是喜欢上帝的律</mark></strong>； 但我觉得肢体中另有个律和我心中的律交战，把我掳去，叫我附从那肢体中犯罪的律。 <strong><mark>我真是苦啊！谁能救我脱离这取死的身体呢</mark></strong>？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/7/#L22-24">罗 7:22-24</a>)</p></blockquote><h2>律法不是永恒的</h2><h3>律法——直到它被成全</h3><blockquote><p>“我实在告诉你们：<strong><mark>就是到天地都废去了</mark></strong>，<strong><mark>律法的一点一画也不能废去，都要成全</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L18">太 5:18</a>)</p></blockquote><h3>基督成全了律法，从而废除了它</h3><blockquote><p>“<strong><mark>莫想我来要废掉律法和先知</mark></strong>；<strong><mark>我来不是要废掉，乃是要成全</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L17">太 5:17</a>)</p></blockquote><h2>基督终结了律法的时代</h2><h3>关于有一位像摩西的先知来临的预言</h3><p>设立摩西律法时，立刻就说到将来要来一位像摩西的先知，即<strong>立法者</strong>，人应当听他。这是指着基督说的：</p><blockquote><p>“<strong><mark>耶和华你的上帝要从你们弟兄中间给你兴起一位先知像我</mark></strong>，<strong><mark>你们要听从他</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/18/#L15">申 18:15</a>)</p></blockquote><blockquote><p>“摩西曾说：『<strong><mark>主上帝要从你们弟兄中间给你们兴起一位先知像我</mark></strong>，<strong><mark>凡他向你们所说的，你们都要听从</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/3/#L22">徒 3:22</a>)</p></blockquote><blockquote><p>“那曾对以色列人说『<strong><mark>上帝要从你们弟兄中间给你们兴起一位先知像我</mark></strong>』的，就是这位摩西。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/7/#L37">徒 7:37</a>)</p></blockquote><p>而上帝亲自以同样的话确认了这一点：</p><blockquote><p>“有一朵云彩来遮盖他们，也有声音从云彩里出来，说：「<strong><mark>这是我的爱子，你们要听他</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/9/#L7">可 9:7</a>) <em>(并见 <a href="https://bibleox.com/zh-Hans/cn-cuv/mf/17/#L5">太 17:5</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/9/#L35">路 9:35</a>。)</em></p></blockquote><h3>基督称律法为「你们的」</h3><blockquote><p>“<strong><mark>你们的律法上也记着说</mark></strong>：『两个人的见证是真的。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/8/#L17">约 8:17</a>)</p></blockquote><blockquote><p>“耶稣说：「<strong><mark>你们的律法上岂不是写着</mark></strong>『我曾说你们是神』么？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/10/#L34">约 10:34</a>)</p></blockquote><h3>律法——直到施洗约翰</h3><blockquote><p>“从施洗约翰的时候到如今，天国是努力进入的，努力的人就得着了。 <strong><mark>因为众先知和律法说预言，到约翰为止</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/11/#L12-13">太 11:12-13</a>)</p></blockquote><h3>律法赐下，为一段时期，直到来临之时</h3><blockquote><p>“这样说来，律法是为什么有的呢？<strong><mark>原是为过犯添上的</mark></strong>，<strong><mark>等候那蒙应许的子孙来到</mark></strong>，并且是藉天使经中保之手设立的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/3/#L19">加 3:19</a>)</p></blockquote><h3>诫命之律已被教导废除</h3><blockquote><p>“因他使我们和睦，将两下合而为一，<strong><mark>拆毁了中间隔断的墙</mark></strong>， 而且<strong><mark>以自己的身体废掉冤仇</mark></strong>，<strong><mark>就是那记在律法上的规条</mark></strong>，为要将两下借着自己造成一个新人，如此便成就了和睦。 既在十字架上灭了冤仇，便藉这十字架使两下归为一体，与上帝和好了，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/2/#L14-16">弗 2:14-16</a>)</p></blockquote><h3>关于律法的争论已属徒然</h3><blockquote><p>“要远避无知的辩论和家谱的空谈以及纷争，<strong><mark>并因律法而起的争竞，因为这都是虚妄无益的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/tit/3/#L9">多 3:9</a>)</p></blockquote><h3>奴仆的轭——就是摩西律法</h3><blockquote><p>“基督释放了我们，叫我们得以自由，所以要站立得稳，<strong><mark>不要再被奴仆的轭挟制</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/5/#L1">加 5:1</a>)</p></blockquote><h3>基督的轭——另一种，是容易的</h3><blockquote><p>“凡劳苦担重担的人，可以到我这里来，我就使你们得安息。 我心里柔和谦卑，<strong><mark>你们当负我的轭，学我的样式</mark></strong>，这样，你们心里就必得享安息。 <strong><mark>因为我的轭是容易的，我的担子是轻省的</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/11/#L28-30">太 11:28-30</a>)</p></blockquote><h3>新的律法——基督的律法——就是爱</h3><blockquote><p>“爱是不加害与人的，<strong><mark>所以爱就完全了律法</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/13/#L10">罗 13:10</a>)</p></blockquote><blockquote><p>“<strong><mark>因为全律法都包在『爱人如己』这一句话之内了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/5/#L14">加 5:14</a>)</p></blockquote><h3>在关于律法的长篇论述之后——信心与爱心</h3><blockquote><p>“并且我们一切所求的，就从他得着，因为我们遵守他的命令，行他所喜悦的事。 <strong><mark>上帝的命令就是叫我们信他儿子耶稣基督的名</mark></strong>，<strong><mark>且照他所赐给我们的命令彼此相爱</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/3/#L22-23">约壹 3:22-23</a>)</p></blockquote><blockquote><p>“你们各人的重担要互相担当，<strong><mark>如此，就完全了基督的律法</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/6/#L2">加 6:2</a>)</p></blockquote><blockquote><p>“我再指着凡受割礼的人确实的说，<strong><mark>他是欠着行全律法的债</mark></strong>。 <strong><mark>你们这要靠律法称义的，是与基督隔绝，从恩典中坠落了</mark></strong>。 <strong><mark>我们靠着圣灵，凭着信心，等候所盼望的义</mark></strong>。 原来在基督耶稣里，受割礼不受割礼全无功效；<strong><mark>惟独使人生发仁爱的信心才有功效</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/5/#L3-6">加 5:3-6</a>)</p></blockquote><blockquote><p>“基督释放了我们，叫我们得以自由，所以要站立得稳，不要再被奴仆的轭挟制。 &lt;…&gt; 弟兄们，我若仍旧传割礼，为什么还受逼迫呢？若是这样，那十字架讨厌的地方就没有了。 &lt;…&gt; 弟兄们，<strong><mark>你们蒙召是要得自由</mark></strong>，只是不可将你们的自由当作放纵情欲的机会，<strong><mark>总要用爱心互相服事</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/5/#L1,11,13">加 5:1,11,13</a>)</p></blockquote><h3>导致死亡的，是信心的缺乏，而不是违犯摩西律法</h3><blockquote><p>“<strong><mark>人有了上帝的儿子就有生命</mark></strong>；<strong><mark>没有上帝的儿子就没有生命</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/5/#L12">约壹 5:12</a>)</p></blockquote><h3>救恩来到，与律法的行为无关</h3><blockquote><p>“<strong><mark>但如今，上帝的义在律法以外已经显明出来</mark></strong>，有律法和先知为证： <strong><mark>就是上帝的义，因信耶稣基督加给一切相信的人</mark></strong>，并没有分别。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/3/#L21-22">罗 3:21-22</a>)</p></blockquote><blockquote><p>“<strong><mark>如今，那些在基督耶稣里的就不定罪了</mark></strong>。 <strong><mark>因为赐生命圣灵的律在基督耶稣里释放了我</mark></strong>，<strong><mark>使我脱离罪和死的律了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/8/#L1-2">罗 8:1-2</a>)</p></blockquote><h3>按律法而活——按血气而活</h3><blockquote><p>“我只要问你们这一件：<strong><mark>你们受了圣灵，是因行律法呢</mark></strong>？是因听信福音呢？ <strong><mark>你们既靠圣灵入门，如今还靠肉身成全吗</mark></strong>？你们是这样的无知吗？ &lt;…&gt; 但这因信得救的理还未来以先，<strong><mark>我们被看守在律法之下</mark></strong>，直圈到那将来的真道显明出来。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/3/#L2-3,23">加 3:2-3,23</a>)</p></blockquote><h3>按圣灵而活——高于按律法而活</h3><blockquote><p>“我说：<strong><mark>你们当顺着圣灵而行</mark></strong>，就不放纵肉体的情欲了。 &lt;…&gt; <strong><mark>但你们若被圣灵引导，就不在律法以下</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/5/#L16,18">加 5:16,18</a>)</p></blockquote><blockquote><p>“<strong><mark>圣灵所结的果子</mark></strong>，就是仁爱、喜乐、和平、忍耐、恩慈、良善、信实、 温柔、节制。<strong><mark>这样的事，没有律法禁止</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/5/#L22-23">加 5:22-23</a>)</p></blockquote>'
