  path: QW8A_为圣人祈祷
  title: 为圣人祈祷
  copy_cover: true
  body: <h2>正教会的理解</h2><p>正教会教导：主耶稣基督是唯一的中保。是怎样的中保？是那舍自己作万人<strong>赎价</strong>的中保（<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/2/#L5">提前 2:5</a>）。其余的圣人不是救赎者。同祷者却有许多：</p><blockquote><p>“他曾救我们脱离那极大的死亡，<strong><mark>现在仍要救我们</mark></strong>，<strong><mark>并且我们指望他将来还要救我们</mark></strong>。 <strong><mark>你们以祈祷帮助我们</mark></strong>，好叫许多人为我们谢恩，<strong><mark>就是为我们因许多人所得的恩</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/1/#L10-11">林后 1:10-11</a>)</p></blockquote><p>他们是圣洁的义人、上帝的朋友：上帝之母、天使、先知、使徒、殉道者和其余的圣人。如同使徒在这里被人请求代祷，在天上也有人求他代祷。以为每个人都应当只为自己的利益向上帝祈祷的想法，与圣经格格不入。相反，圣经中多次召呼全教会彼此代祷（<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/5/#L16">雅 5:16</a>）。所有的人——甚至最伟大的义人和上帝的特选者——不放弃向上帝的祈祷，也请求信徒们为他们祈祷，自己不住地为信徒祈祷，并吩咐将来也要守这规矩。这也称为彼此代求。</p><p>我们从教会知道、并以圣经证实：义人在与身体分离之后进入与上帝同在的生活，并继续向他献上自己的祈祷。因此，如同这些义人活着、身体还在地上时我们曾求他们的祈祷，同样在他们与身体分离、进入天上与基督明显的同在后，我们也求他们的祈祷（<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/12/#L22-23">希 12:22-23</a>）；因为他们不是进入更坏的境地，而是更好的境地（<a href="https://bibleox.com/zh-Hans/cn-cuv/fil/1/#L23">腓 1:23</a>）。我们相信爱永不止息（<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/13/#L8">林前 13:8</a>），因此整个教会——地上争战的和天上得胜的——是一个合一的、完整的、相通的教会，共同地彼此祈祷，并被爱催促关怀自己所有的肢体。我们也信、并从教会知道、且在圣经中表明：我们的护守天使与上帝有相通（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/18/#L10">太 18:10</a>），被差遣事奉那将要承受救恩的人（<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/1/#L14">希 1:14</a>）；而圣洁的义人住在上帝圣光之中，也知道地上发生的事，并为教会向上帝献上祈祷（<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/6/#L9-11">启 6:9-11</a>）；永恒的爱催促众人在基督的一个身体里彼此相通、彼此关怀：在天上，也在地上。</p><h2>天使的祈祷</h2><h3>人有护守天使</h3><blockquote><p>“你们要小心，不可轻看这小子里的一个。我告诉你们：<strong><mark>他们的使者在天上，常见我天父的面</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/18/#L10">太 18:10</a>)</p></blockquote><h3>天使被差遣关怀得救的人</h3><blockquote><p>“所有的天使，上帝从来对那一个说：『你坐在我的右边，等我使你仇敌作你的脚凳？』 <strong><mark>天使岂不都是服役的灵</mark></strong>、<strong><mark>奉差遣为那将要承受救恩的人效力吗</mark></strong>？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/1/#L13-14">希 1:13-14</a>)</p></blockquote><h3>天使在天上为人悔改而欢喜</h3><blockquote><p>“我告诉你们：<strong><mark>一个罪人悔改，在天上也要这样为他欢喜</mark></strong>，较比为九十九个不用悔改的义人欢喜更大。 &lt;…&gt; 我告诉你们：一个罪人悔改，<strong><mark>在上帝的使者面前也是这样为他欢喜</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/15/#L7,10">路 15:7,10</a>)</p></blockquote><h3>天使在上帝面前为人代求</h3><p>天使为犹大各城的居民求恩惠：</p><blockquote><p>“于是，耶和华的使者说：「<strong><mark>万军之耶和华啊，你恼恨耶路撒冷和犹大的城邑已经七十年，你不施怜悯要到几时呢</mark></strong>？」 <strong><mark>耶和华就用美善的安慰话回答那与我说话的天使</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/zah/1/#L12-13">亚 1:12-13</a>)</p></blockquote><h3>与天使的交往</h3><blockquote><p>“天明了，<strong><mark>天使催逼罗得说</mark></strong>：「起来！带着你的妻子和你在这里的两个女儿出去，免得你因这城里的罪恶同被剿灭。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/19/#L15">创 19:15</a>)</p></blockquote><blockquote><p>“<strong><mark>耶和华的使者到了俄弗拉</mark></strong>，坐在亚比以谢族人约阿施的橡树下。约阿施的儿子基甸正在酒醡那里打麦子，为要防备米甸人。 <strong><mark>耶和华的使者向基甸显现</mark></strong>，对他说：「<strong><mark>大能的勇士啊！耶和华与你同在</mark></strong>。」 <strong><mark>基甸说</mark></strong>：「主啊！耶和华若与我们同在，我们何至遭遇这一切事呢？我们的列祖不是向我们说『耶和华领我们从埃及上来』么？他那样奇妙的作为在那里呢？现在他却丢弃我们，将我们交在米甸人手里。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/sud/6/#L11-13">士 6:11-13</a>)</p></blockquote><blockquote><p>“那时有一个琐拉人，是属但族的，名叫玛挪亚；<strong><mark>他的妻不怀孕，不生育</mark></strong>。 <strong><mark>耶和华的使者向那妇人显现，对她说</mark></strong>：「向来你不怀孕，不生育，<strong><mark>如今你必怀孕生一个儿子</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/sud/13/#L2-3">士 13:2-3</a>)</p></blockquote><blockquote><p>“<strong><mark>有一位天使从天上显现，加添他的力量</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/22/#L43">路 22:43</a>)</p></blockquote><blockquote><p>“当犹太王希律的时候，亚比雅班里有一个祭司，名叫撒迦利亚。他妻子是亚伦的后人，名叫以利沙伯。 &lt;…&gt; <strong><mark>有主的使者站在香坛的右边向他显现</mark></strong>。 &lt;…&gt; <strong><mark>天使对他说</mark></strong>：「撒迦利亚，不要害怕，<strong><mark>因为你的祈祷已经被听见了</mark></strong>。你的妻子以利沙伯要给你生一个儿子，你要给他起名叫约翰。 &lt;…&gt; <strong><mark>撒迦利亚对天使说</mark></strong>：「我凭着什么可知道这事呢？我已经老了，我的妻子也年纪老迈了。」 <strong><mark>天使回答说</mark></strong>：「<strong><mark>我是站在上帝面前的加百列</mark></strong>，奉差而来对你说话，将这好信息报给你。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/1/#L5,11,13,18-19">路 1:5,11,13,18-19</a>)</p></blockquote><blockquote><p>“到了第六个月，<strong><mark>天使加百列奉上帝的差遣</mark></strong>往加利利的一座城去，这城名叫拿撒勒， <strong><mark>到一个童女那里</mark></strong>，是已经许配大卫家的一个人，名叫约瑟，童女的名字叫马利亚。 <strong><mark>天使进去，对她说</mark></strong>：「<strong><mark>蒙大恩的女子</mark></strong>，我问你安，主和你同在了！」 &lt;…&gt; <strong><mark>天使对他说</mark></strong>：「马利亚，不要怕！你在上帝面前已经蒙恩了。 你要怀孕生子，可以给他起名叫耶稣。 &lt;…&gt; <strong><mark>马利亚对天使说</mark></strong>：「我没有出嫁，怎么有这事呢？」 <strong><mark>天使回答说</mark></strong>：「圣灵要临到你身上，至高者的能力要荫庇你，因此所要生的圣者必称为上帝的儿子。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/1/#L26-28,30-31,34-35">路 1:26-28,30-31,34-35</a>)</p></blockquote><blockquote><p>“在夜间有异象现与保罗：<strong><mark>有一个马其顿人站着求他说</mark></strong>：「<strong><mark>请你过到马其顿来帮助我们</mark></strong>！」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/16/#L9">徒 16:9</a>)</p></blockquote><blockquote><p>“<strong><mark>忽然有主的一个使者站在旁边</mark></strong>，屋里有光照耀。<strong><mark>天使拍彼得的肋旁，拍醒了他</mark></strong>，说：「快快起来！」那铁鍊就从他手上脱落下来。 <strong><mark>天使对他说</mark></strong>：「束上带子，穿上鞋！」他就那样作。天使又说：「披上外衣，跟着我来。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/12/#L7-8">徒 12:7-8</a>)</p></blockquote><blockquote><p>“耶稣基督的启示，就是上帝赐给他，叫他将必要快成的事指示他的众仆人。<strong><mark>他就差遣使者晓谕他的仆人约翰</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/1/#L1">启 1:1</a>)</p></blockquote><h2>亡者的祈祷</h2><p>先知巴录求上帝垂听安息之义人的祈祷：</p><blockquote><p>“全能的上主，以色列的天主！忧伤的灵魂和苦恼的心灵正在向你呼号：上主！求你俯听垂怜，因为你是仁慈的天主；求你垂怜，因我们得罪了你。你永居王位，而我们却要永远丧亡。全能的上主，以色列的天主！<strong>求你俯听垂死的以色列人，和犯罪得罪了你的人的子孙的祈祷</strong>：他们没有听从你，他们天主的声音，因此灾祸便缠绕我们。” (<a href="https://bibleox.com/zh-Hans/cn-sb/var/3/#L1-4">巴 3:1-4</a>)</p></blockquote><p>安息的拉结——族长雅各的妻子——为自己儿女在巴比伦为奴之地的死亡和苦难忧伤。而主回答她，安慰她，并应许释放他们——这事也成就了：</p><blockquote><p>“耶和华如此说：「在拉玛听见号咷痛哭的声音，<strong><mark>是拉结哭他儿女，不肯受安慰</mark></strong>，因为他们都不在了。」 耶和华如此说：「<strong><mark>你禁止声音不要哀哭</mark></strong>，禁止眼目不要流泪，因你所作之工必有赏赐，他们必从敌国归回。」这是耶和华说的。 耶和华说：「<strong><mark>你末后必有指望</mark></strong>，你的儿女必回到自己的境界。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ier/31/#L15-17">耶 31:15-17</a>)</p></blockquote><p>这段引文可以按寓意理解，也可以按字面理解。</p><h2>义人的祈祷</h2><h3>上帝更喜悦义人的祈祷</h3><blockquote><p>“恶人献祭，为耶和华所憎恶；<strong><mark>正直人祈祷，为他所喜悦</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/15/#L8">箴 15:8</a>)</p></blockquote><blockquote><p>“耶和华远离恶人，<strong><mark>却听义人的祷告</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/15/#L29">箴 15:29</a>)</p></blockquote><blockquote><p>“所以你们要彼此认罪，互相代求，使你们可以得医治。<strong><mark>义人祈祷所发的力量是大有功效的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/5/#L16">雅 5:16</a>)</p></blockquote><h3>上帝要求为赦罪必须有义人祈祷</h3><h4>约伯</h4><blockquote><p>“现在你们要取七只公牛，七只公羊，到我仆人约伯那里去，为自己献上燔祭，<strong><mark>我的仆人约伯就为你们祈祷</mark></strong>。<strong><mark>我因悦纳他，就不按你们的愚妄办你们</mark></strong>。你们议论我，不如我的仆人约伯说的是。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iov/42/#L8">伯 42:8</a>)</p></blockquote><blockquote><p>“上帝在梦中对他说：「我知道你作这事是心中正直，我也拦阻了你，免得你得罪我，所以我不容你沾着她。 现在你把这人的妻子归还他，<strong><mark>因为他是先知</mark></strong>，<strong><mark>他要为你祷告，使你存活</mark></strong>。你若不归还他，你当知道，你和你所有的人都必要死。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/20/#L6-7">创 20:6-7</a>)</p></blockquote><h4>先知摩西</h4><p>先知摩西是上帝与整个民族之间的中保：</p><blockquote><p>“现在你要听我的话，我为你出个主意，愿上帝与你同在。<strong><mark>你要替百姓到上帝面前</mark></strong>，<strong><mark>将案件奏告上帝</mark></strong>；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/18/#L19">出 18:19</a>)</p></blockquote><p>因摩西所求，上帝赦免了民的罪：</p><blockquote><p>“<strong><mark>求你照你的大慈爱赦免这百姓的罪孽</mark></strong>，好像你从埃及到如今常赦免他们一样。」 耶和华说：「<strong><mark>我照着你的话赦免了他们</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/14/#L19-20">民 14:19-20</a>)</p></blockquote><p>另一次，上帝指出：即使按摩西的话他也不赦免：</p><blockquote><p>“耶和华对我说：「<strong><mark>虽有摩西和撒母耳站在我面前</mark></strong>代求，<strong><mark>我的心也不顾惜这百姓</mark></strong>。你将他们从我眼前赶出，叫他们去吧！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ier/15/#L1">耶 15:1</a>)</p></blockquote><p>他求上帝改变决定：</p><blockquote><p>“<strong><mark>你且由着我</mark></strong>，我要向他们发烈怒，将他们灭绝，使你的后裔成为大国。」 <strong><mark>摩西便恳求耶和华他的上帝，说</mark></strong>：「耶和华啊，你为什么向你的百姓发烈怒呢？这百姓是你用大力和大能的手从埃及地领出来的。 为什么使埃及人议论说『他领他们出去，是要降祸与他们，把他们杀在山中，将他们从地上除灭』？<strong><mark>求你转意，不发你的烈怒</mark></strong>；<strong><mark>后悔，不降祸与你的百姓</mark></strong>。 求你记念你的仆人亚伯拉罕、以撒、以色列，你曾指着自己起誓说：『我必使你们的后裔像天上的星那样多，并且我所应许的这全地，必给你们的后裔，他们要永远承受为业。』」 <strong><mark>于是耶和华后悔，不把所说的祸降与他的百姓</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/32/#L10-14">出 32:10-14</a>)</p></blockquote><p>之后又去为百姓代求：</p><blockquote><p>“到了第二天，摩西对百姓说：「<strong><mark>你们犯了大罪</mark></strong>，<strong><mark>我如今要上耶和华那里去</mark></strong>，<strong><mark>或者可以为你们赎罪</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/32/#L30">出 32:30</a>)</p></blockquote><p>上帝又改变了决定：</p><blockquote><p>“<strong><mark>耶和华与摩西面对面说话</mark></strong>，好像人与朋友说话一般。摩西转到营里去，惟有他的帮手一个少年人嫩的儿子约书亚，不离开会幕。 <strong><mark>摩西对耶和华说</mark></strong>：「你吩咐我说：『将这百姓领上去』，却没有叫我知道你要打发谁与我同去。只说：『我按你的名认识你，你在我眼前也蒙了恩。』 &lt;…&gt; 摩西说：「<strong><mark>你若不亲自和我同去</mark></strong>，<strong><mark>就不要把我们从这里领上去</mark></strong>。 &lt;…&gt; 耶和华对摩西说：「<strong><mark>你这所求的我也要行</mark></strong>，<strong><mark>因为你在我眼前蒙了恩</mark></strong>，<strong><mark>并且我按你的名认识你</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/33/#L11-12,15,17">出 33:11-12,15,17</a>)</p></blockquote><h4>神人</h4><blockquote><p>“王对神人说：「<strong><mark>请你为我祷告</mark></strong>，<strong><mark>求耶和华你上帝的恩典</mark></strong>，使我的手复原。」<strong><mark>于是神人祈祷耶和华</mark></strong>，王的手就复了原，仍如寻常一样。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/13/#L6">王上 13:6</a>)</p></blockquote><h2>司祭职为他人祈祷</h2><p>因司祭们为另一个人的祈祷（这里有代求），罪可以得赦：</p><blockquote><p>“你们中间有病了的呢，他就<strong><mark>该请教会的长老来</mark></strong>，他们可以奉主的名用油抹他，<strong><mark>为他祷告</mark></strong>。 出于信心的祈祷要救那病人，主必叫他起来；<strong><mark>他若犯了罪，也必蒙赦免</mark></strong>。 所以你们要彼此认罪，互相代求，使你们可以得医治。<strong><mark>义人祈祷所发的力量是大有功效的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/5/#L14-16">雅 5:14-16</a>)</p></blockquote><h2>教会肢体彼此祈祷</h2><p>向上帝的个人祈祷足够吗？</p><h3>使徒们需要为他们做的祈祷</h3><blockquote><p>“<strong><mark>也要为我们祷告</mark></strong>，求上帝给我们开传道的门，能以讲基督的奥祕（我为此被捆锁），” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/4/#L3">西 4:3</a>)</p></blockquote><blockquote><p>“<strong><mark>请弟兄们为我们祷告</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1sol/5/#L25">帖前 5:25</a>)</p></blockquote><blockquote><p>“弟兄们，我还有话说：<strong><mark>请你们为我们祷告</mark></strong>，好叫主的道理快快行开，得着荣耀，正如在你们中间一样；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2sol/3/#L1">帖后 3:1</a>)</p></blockquote><blockquote><p>“<strong><mark>请你们为我们祷告</mark></strong>，因我们自觉良心无亏，愿意凡事按正道而行。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/13/#L18">希 13:18</a>)</p></blockquote><blockquote><p>“弟兄们，我借着我们主耶稣基督，又借着圣灵的爱，<strong><mark>劝你们与我一同竭力</mark></strong>，<strong><mark>为我祈求上帝</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/15/#L30">罗 15:30</a>)</p></blockquote><blockquote><p>“他曾救我们脱离那极大的死亡，现在仍要救我们，并且我们指望他将来还要救我们。 <strong><mark>你们以祈祷帮助我们</mark></strong>，好叫许多人为我们谢恩，<strong><mark>就是为我们因许多人所得的恩</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/1/#L10-11">林后 1:10-11</a>)</p></blockquote><blockquote><p>“因为我知道，这事<strong><mark>借着你们的祈祷</mark></strong>和耶稣基督之灵的帮助，<strong><mark>终必叫我得救</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/fil/1/#L19">腓 1:19</a>)</p></blockquote><blockquote><p>“此外，你还要给我预备住处，<strong><mark>因为我盼望借着你们的祷告</mark></strong>，必蒙恩到你们那里去。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/fm/1/#L22">门 1:22</a>)</p></blockquote><h3>使徒们不住地为基督徒祈祷</h3><blockquote><p>“<strong><mark>就为你们不住的感谢上帝</mark></strong>，<strong><mark>祷告的时候，常提到你们</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/1/#L16">弗 1:16</a>)</p></blockquote><blockquote><p>“<strong><mark>每逢为你们众人祈求的时候，常是欢欢喜喜的祈求</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/fil/1/#L4">腓 1:4</a>)</p></blockquote><blockquote><p>“<strong><mark>我们为你们众人常常感谢上帝</mark></strong>，<strong><mark>祷告的时候提到你们</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1sol/1/#L2">帖前 1:2</a>)</p></blockquote><blockquote><p>“有你们那里的人，作基督耶稣仆人的以巴弗问你们安。<strong><mark>他在祷告之间，常为你们竭力的祈求</mark></strong>，愿你们在上帝一切的旨意上得以完全，信心充足，能站立得稳。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/4/#L12">西 4:12</a>)</p></blockquote><blockquote><p>“我感谢上帝，就是我接续祖先用清洁的良心所事奉的上帝。<strong><mark>祈祷的时候，不住的想念你</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/1/#L3">提后 1:3</a>)</p></blockquote><blockquote><p>“<strong><mark>我祷告的时候提到你常为你感谢我的上帝</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/fm/1/#L4">门 1:4</a>)</p></blockquote><h3>使徒们呼召基督徒彼此祈祷</h3><blockquote><p>“所以你们要彼此认罪，<strong><mark>互相代求</mark></strong>，使你们可以得医治。义人祈祷所发的力量是大有功效的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/5/#L16">雅 5:16</a>)</p></blockquote><blockquote><p>“靠着圣灵，<strong><mark>随时多方祷告祈求</mark></strong>，<strong><mark>并要在此儆醒不倦</mark></strong>，<strong><mark>为众圣徒祈求</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/6/#L18">弗 6:18</a>)</p></blockquote><blockquote><p>“我劝你<strong><mark>第一要为万人恳求</mark></strong>、祷告、代求、祝谢，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/2/#L1">提前 2:1</a>)</p></blockquote><h2>整个教会是基督的同一个合一的身体——相通、彼此关怀</h2><h3>教会是基督的身体</h3><blockquote><p>“<strong><mark>你们就是基督的身子</mark></strong>，并且各自作肢体。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/12/#L27">林前 12:27</a>)</p></blockquote><blockquote><p>“岂不知<strong><mark>你们的身子是基督的肢体</mark></strong>吗？我可以将基督的肢体作为娼妓的肢体吗？断乎不可！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/6/#L15">林前 6:15</a>)</p></blockquote><h3>教会的肢体分有上帝</h3><blockquote><p>“上帝的神能已将一切关乎生命和虔敬的事赐给我们，皆因我们认识那用自己荣耀和美德召我们的主。 因此，他已将又宝贵、又极大的应许赐给我们，叫我们既脱离世上从情欲来的败坏，<strong><mark>就得与上帝的性情有分</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2pet/1/#L3-4">彼后 1:3-4</a>)</p></blockquote><h3>身体的所有肢体彼此关怀</h3><blockquote><p>“免得身上分门别类，<strong><mark>总要肢体彼此相顾</mark></strong>。 <strong><mark>若一个肢体受苦，所有的肢体就一同受苦</mark></strong>；<strong><mark>若一个肢体得荣耀，所有的肢体就一同快乐</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/12/#L25-26">林前 12:25-26</a>)</p></blockquote><h3>使徒们常为教会祈祷</h3><blockquote><p>“因此，我们自从听见的日子，也就为你们<strong><mark>不住的祷告祈求</mark></strong>，<strong><mark>愿你们在一切属灵的智慧悟性上，满心知道上帝的旨意</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/1/#L9">西 1:9</a>)</p></blockquote><h2>地上教会与天上教会的合一</h2><h3>我们已经来到天上的教会</h3><p>就在现在，而不是在将来复活之后：</p><blockquote><p>“<strong><mark>你们乃是来到锡安山</mark></strong>，永生上帝的城邑，<strong><mark>就是天上的耶路撒冷</mark></strong>。那里有<strong><mark>千万的天使</mark></strong>， 有名录在天上诸长子之会所共聚的总会，有审判众人的上帝和<strong><mark>被成全之义人的灵魂</mark></strong>， <strong><mark>并新约的中保耶稣</mark></strong>，<strong><mark>以及所洒的血</mark></strong>。这血所说的比亚伯的血所说的更美。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/12/#L22-24">希 12:22-24</a>)</p></blockquote><h3>没有分裂；众肢体彼此关怀、彼此感同身受</h3><blockquote><p>“但如今肢体是多的，<strong><mark>身子却是一个</mark></strong>。 &lt;…&gt; 我们俊美的肢体，自然用不着装饰；<strong><mark>但上帝配搭这身子</mark></strong>，把加倍的体面给那有缺欠的肢体， 免得身上分门别类，<strong><mark>总要肢体彼此相顾</mark></strong>。 <strong><mark>若一个肢体受苦</mark></strong>，所有的肢体就一同受苦；<strong><mark>若一个肢体得荣耀</mark></strong>，所有的肢体就一同快乐。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/12/#L20,24-26">林前 12:20,24-26</a>)</p></blockquote><blockquote><p>“我告诉你们：<strong><mark>一个罪人悔改，在天上也要这样为他欢喜</mark></strong>，较比为九十九个不用悔改的义人欢喜更大。 &lt;…&gt; 我告诉你们：一个罪人悔改，<strong><mark>在上帝的使者面前也是这样为他欢喜</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/15/#L7,10">路 15:7,10</a>)</p></blockquote><h3>天上的与地上的在基督里联合</h3><blockquote><p>“愿颂赞归与我们主耶稣基督的父上帝！他在基督里曾赐给我们天上各样属灵的福气。 &lt;…&gt; 都是照他自己所预定的美意，叫我们知道他旨意的奥祕， 要照所安排的，在日期满足的时候，<strong><mark>使天上地上一切所有的，都在基督里面同归于一</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/1/#L3,9-10">弗 1:3,9-10</a>)</p></blockquote><blockquote><p>“因此，我在父面前屈膝， （<strong><mark>天上地上的各家</mark></strong>，都是从他得名。）” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/3/#L14-15">弗 3:14-15</a>)</p></blockquote><blockquote><p>“他也是教会全体之首，他是元始，是从死里首先复生的，使他可以在凡事上居首位。 因为父喜欢叫一切的丰盛在他里面居住。 既然借着他在十字架上所流的血成就了和平，便借着他叫万有，<strong><mark>无论是地上的、天上的</mark></strong>，都与自己和好了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/1/#L18-20">西 1:18-20</a>)</p></blockquote><blockquote><p>“因此基督死了，又活了，<strong><mark>为要作死人并活人的主</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/14/#L9">罗 14:9</a>)</p></blockquote><p>参见：<a href="https://bibleox.com/ru/ru/w/Церковь#HH-Единство-земной-и-небесной-Церкви-единое-Тело-Христа">教会——天上地下教会的合一，基督的一个身体</a></p><h2>圣徒在天上向上帝祈祷</h2><h3>圣徒的祈祷蒙上帝喜悦</h3><blockquote><p>“他既拿了书卷，四活物和二十四位长老就俯伏在羔羊面前，各拿着琴和<strong><mark>盛满了香的金炉</mark></strong>；<strong><mark>这香就是众圣徒的祈祷</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/5/#L8">启 5:8</a>)</p></blockquote><blockquote><p>“另有一位天使拿着金香炉，来站在祭坛旁边。有许多香赐给他，<strong><mark>要和众圣徒的祈祷一同献在宝座前的金坛上</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/8/#L3">启 8:3</a>)</p></blockquote><blockquote><p>“此后，我听见<strong><mark>好像群众在天上大声说</mark></strong>：「哈利路亚！<strong><mark>救恩、荣耀、权能都属乎我们的上帝</mark></strong>！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/19/#L1">启 19:1</a>)</p></blockquote><p>他们知道地上发生的事：</p><blockquote><p>“揭开第五印的时候，我看见在祭坛底下，<strong><mark>有为上帝的道并为作见证被杀之人的灵魂</mark></strong>， 大声喊着说：「<strong><mark>圣洁真实的主啊</mark></strong>！<strong><mark>你不审判住在地上的人，给我们伸流血的冤，要等到几时呢</mark></strong>？」 <strong><mark>于是有白衣赐给他们各人</mark></strong>，又有话对他们说：「还要安息片时，等着一同作仆人的和他们的弟兄，也像他们被杀，<strong><mark>满足了数目</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/6/#L9-11">启 6:9-11</a>)</p></blockquote><h3>圣徒进入的是更好的境地，而不是更坏的</h3><blockquote><p>“我正在两难之间，<strong><mark>情愿离世与基督同在</mark></strong>，<strong><mark>因为这是好得无比的</mark></strong>。 <strong><mark>然而，我在肉身活着，为你们更是要紧的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/fil/1/#L23-24">腓 1:23-24</a>)</p></blockquote><h3>圣徒在与身体分离之后仍保持相通的能力</h3><p>在救主于他泊山显圣容的时刻，使徒们看见已死的先知摩西显现，与基督谈论他将要受的十字架苦难。就是说，先知虽然死了（<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/34/#L7">申 34:7</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/nav/1/#L2">书 1:2</a>），却没有消失，也没有失去意识：他与基督<strong>相交</strong>：</p><blockquote><p>“忽然，<strong><mark>有摩西，以利亚向他们显现</mark></strong>，<strong><mark>同耶稣说话</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/17/#L3">太 17:3</a>)</p></blockquote><blockquote><p>“正祷告的时候，他的面貌就改变了，衣服洁白放光。 <strong><mark>忽然有摩西、以利亚两个人同耶稣说话</mark></strong>； <strong><mark>他们在荣光里显现，谈论耶稣去世的事</mark></strong>，就是他在耶路撒冷将要成的事。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/9/#L29-31">路 9:29-31</a>)</p></blockquote><h3>爱永远催促人关怀别人</h3><blockquote><p>“<strong><mark>爱是永不止息</mark></strong>。先知讲道之能，终必归于无有；说方言之能，终必停止；知识也终必归于无有。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/13/#L8">林前 13:8</a>)</p></blockquote><h2>对异议的回应</h2><h3>一位中保</h3><h4>简答</h4><p>正教徒因向圣人祈祷而受指责，说只有基督才是唯一的中保。回答是：基督是唯一的、救赎了世人的中保，如同一节经文接着说的：</p><blockquote><p>“因为只有一位上帝，在上帝和人中间，<strong><mark>只有一位中保</mark></strong>，<strong><mark>乃是降世为人的基督耶稣</mark></strong>。 <strong><mark>他舍自己作万人的赎价</mark></strong>，到了时候，这事必证明出来。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/2/#L5-6">提前 2:5-6</a>)</p></blockquote><p>圣徒们不是救赎者，而是同祷者（<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/5/#L16">雅 5:16</a>）。一切在于意义。我们的反对者（通常是新教徒）彼此为对方的所需祈祷。如果他们彼此是中保，那圣人也是我们的中保。如果他们彼此是同祷者，那圣人也是我们的同祷者：因为我们只是求他们为我们祈祷、加入我们向上帝的祈祷。我们不把他们当作神，也不把他们当作神来祈祷——同样，新教徒请人代祷时，也不把自己的伙伴当作神。</p><p>可以有代祷的中保吗？——从圣经显然可见：可以。例如，因教会司祭的祈祷，另一个人的罪可以得赦。</p><blockquote><p>“你们中间有病了的呢，他就<strong><mark>该请教会的长老来</mark></strong>，他们可以奉主的名用油抹他，<strong><mark>为他祷告</mark></strong>。 出于信心的祈祷要救那病人，主必叫他起来；<strong><mark>他若犯了罪，也必蒙赦免</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/5/#L14-15">雅 5:14-15</a>)</p></blockquote><p>无可争议的代求。这样，反对向圣人祈祷的人对基督作为唯一中保之言（<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/2/#L5-6">提前 2:5-6</a>）的理解是不正确的。所引的经文并不反对祈祷中的代求者。</p><h4>更详细地论“中保”一词</h4><p>还有翻译上的特点。“中保”一词译自希腊文 μεσίτης。它可以译作“和平的缔造者”——促成双方和好的人。也就是说，换言之，基督是上帝与人之间唯一的<strong>和好者</strong>（缔造和平者）。使徒们在别处说得更明白：</p><blockquote><p>“一切都是出于上帝，<strong><mark>他借着基督使我们与他和好</mark></strong>，<strong><mark>又将劝人与他和好的职分赐给我们</mark></strong>。 <strong><mark>这就是上帝在基督里叫世人与自己和好</mark></strong>，不将他们的过犯归到他们身上，<strong><mark>并且将这和好的道理托付了我们</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/5/#L18-19">林后 5:18-19</a>)</p></blockquote><blockquote><p>“我小子们哪，我将这些话写给你们，是要叫你们不犯罪。<strong><mark>若有人犯罪</mark></strong>，<strong><mark>在父那里我们有一位中保</mark></strong>，<strong><mark>就是那义者耶稣基督</mark></strong>。 <strong><mark>他为我们的罪作了挽回祭</mark></strong>，不是单为我们的罪，也是为普天下人的罪。 &lt;…&gt; <strong><mark>小子们哪，我写信给你们，因为你们的罪借着主名得了赦免</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/2/#L1-2,12">约壹 2:1-2,12</a>)</p></blockquote><p>把“中保”译作<strong>和好者</strong>或缔造和平者，也与句子的结尾相合，如前所指：“他舍自己作万人的赎价”（<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/2/#L5-6">提前 2:5-6</a>）。这样一位缔造和平者，藉把自己作为祭物献上，赎了人类在上帝面前的罪。所以这节经文不是反对向圣人祈祷，而是讲到基督作为人类与上帝的<strong>和好者</strong>。基督也是人与人之间的<strong>和好者</strong>（<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/2/#L14">弗 2:14</a>）。</p><h3>关于“拯救我们”的说法</h3><p>正教徒因允许在向圣人的祈祷中用“拯救我们”的话而受指责。这里又是在于意义。拯救是基督一次成就的。在这一意义上再没有别的救主。但许多人可以促进具体个人的得救。这样的说法在圣经中也常见：</p><h4>使徒救人</h4><blockquote><p>“<strong><mark>或者可以激动我骨肉之亲发愤</mark></strong>，<strong><mark>好救他们一些人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/11/#L14">罗 11:14</a>)</p></blockquote><blockquote><p>“向软弱的人，我就作软弱的人，为要得软弱的人；向什么样的人，我就作什么样的人。<strong><mark>无论如何总要救些人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/9/#L22">林前 9:22</a>)</p></blockquote><h4>妻子救人</h4><blockquote><p>“<strong><mark>你这作妻子的，怎么知道不能救你的丈夫呢</mark></strong>？<strong><mark>你这作丈夫的，怎么知道不能救你的妻子呢</mark></strong>？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/7/#L16">林前 7:16</a>)</p></blockquote><h4>使徒呼召拯救别人</h4><blockquote><p>“有些人存疑心，你们要怜悯他们； <strong><mark>有些人你们要从火中抢出来</mark></strong>、<strong><mark>搭救他们</mark></strong>；有些人你们要存惧怕的心怜悯他们；连那被情欲沾染的衣服也当厌恶。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iud/1/#L22-23">犹 1:22-23</a>)</p></blockquote><blockquote><p>“你要谨慎自己和自己的教训，要在这些事上恒心。因为这样行，<strong><mark>又能救自己，又能救听你的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/4/#L16">提前 4:16</a>)</p></blockquote><h3>难道除了基督还有谁能救人吗？</h3><p>无论使徒还是夫妻，都不是主耶稣基督意义上的救主——他是唯一的救赎者，把人类从死亡和阴间中救出、赐复活和与上帝同在的永生。但如上所见，“我要救”这样的说法是使徒们所用的。我们正确地理解这些话的意义——人可以促进得救：</p><blockquote><p>“<strong><mark>因为我们是与上帝同工的</mark></strong>；你们是上帝所耕种的田地，所建造的房屋。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/3/#L9">林前 3:9</a>)</p></blockquote><h3>关于“怜悯我们”的说法</h3><p>这里情形与“拯救”相同（见上）。这样的说法不只向圣徒，也向普通人发出。怜悯，就是施以恩惠。例如，义人约伯对自己的朋友们说：</p><blockquote><p>“<strong><mark>我朋友啊，可怜我！可怜我</mark></strong>！因为上帝的手攻击我。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iov/19/#L21">伯 19:21</a>)</p></blockquote><h3>圣徒怎么能听见来自全世界的祈祷？</h3><p>反对向圣人祈祷的人说：“上帝是无所不在、全能的；而圣人如果不具备这些属性，那他们怎么能听见地球上不同地方众多人的祈祷？”</p><h4>圣徒们说预言、行奇迹，不是靠自己的力量，而是靠上帝的力量</h4><p>圣徒们不是离开上帝单独被考察的。就是在地上身体活着的时候，上帝的能力也住在他们里面；更何况在迁往天上、与基督同活之后，他们更不会失去这一点。先知亚迦布虽不是无所不知的，却宣告了将临到天下的大饥荒（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/11/#L28">徒 11:28</a>）。使徒彼得不是全能的，却复活了多加（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/9/#L40">徒 9:40</a>）。他们作这些不是靠自己的力量，而是靠上帝的力量。</p><p>圣徒们如使徒所言，进入的不是更坏的，而是好得无比的境地（<a href="https://bibleox.com/zh-Hans/cn-cuv/fil/1/#L23-24">腓 1:23-24</a>）：不是失去，而是获得（<a href="https://bibleox.com/zh-Hans/cn-cuv/fil/1/#L21">腓 1:21</a>）。他们与上帝联合，在他的光和恩典中。他们的存在不能与我们的相比。他们知道地上发生的事（<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/6/#L10">启 6:10</a>）。甚至还在身体里的时候，使徒们就写道，他们灵里与基督徒同在：</p><h4>使徒不在身体里，而在灵里知道基督徒团体的情况</h4><blockquote><p>“<strong><mark>我身子虽与你们相离，心却与你们同在</mark></strong>，见你们循规蹈矩，信基督的心也坚固，我就欢喜了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/2/#L5">西 2:5</a>)</p></blockquote><blockquote><p>“<strong><mark>我身子虽不在你们那里，心却在你们那里</mark></strong>，好像我亲自与你们同在，已经判断了行这事的人。 <strong><mark>就是你们聚会的时候，我的心也同在</mark></strong>。奉我们主耶稣的名，并用我们主耶稣的权能， 要把这样的人交给撒但，败坏他的肉体，<strong><mark>使他的灵魂在主耶稣的日子可以得救</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/5/#L3-5">林前 5:3-5</a>)</p></blockquote><blockquote><p>“<strong><mark>若有人爱上帝，这人乃是上帝所知道的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/8/#L3">林前 8:3</a>)</p></blockquote><h4>得救的人有护守天使</h4><p>如经所记，天使被差遣事奉得救的人：</p><blockquote><p>“<strong><mark>天使岂不都是服役的灵</mark></strong>、<strong><mark>奉差遣为那将要承受救恩的人效力吗</mark></strong>？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/1/#L14">希 1:14</a>)</p></blockquote><p>同时，天使常常见上帝的面（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/18/#L10">太 18:10</a>）。甚至他们就可以转达我们的祈祷。我们不只向圣人们祈祷，也向圣天使祈祷：求他们为我们代祷，为他们的劳苦和关怀感谢他们。</p><p>反对地上教会与天上教会相通的人，甚至不允许感谢被差来事奉我们的护守天使——而这天使并不需要无所不在、无所不能才能听见我们。</p><p>这样，教会相信：圣徒们因住在上帝的光和恩典中而能听见我们的祈祷。与上帝的合一赐给他们这样的可能。是上帝自己赐给他们这样的可能。所以，用最简单的话说：圣徒们能听见祈祷，不是由于自己的能力，而是由于上帝和他的能力。</p><h3>教会怎么知道谁是圣人？难道是人替上帝作决定吗？</h3><p>人不是替上帝作决定。上帝按自己的应许（<a href="https://bibleox.com/ru/ru/w/почитание-святых-в-Библии#HH-Святые-будут-в-чести">引文</a>），自己荣耀自己的圣人，显明奇迹，垂听他们的祈祷。教会只是为此作见证，并把民间对圣人的敬礼理出秩序，免得混乱——正如使徒所吩咐的：</p><blockquote><p>“<strong><mark>凡事都要规规矩矩的按着次序行</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/14/#L40">林前 14:40</a>)</p></blockquote><p>*规矩——即次序</p><blockquote><p>“因我们听说，在你们中间<strong><mark>有人不按规矩而行，什么工都不作</mark></strong>，反倒专管闲事。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2sol/3/#L11">帖后 3:11</a>)</p></blockquote><p>教会关于义人之圣洁的见证和敬礼秩序的设立（封圣），通常远在义人去世之后，那时对这一问题的研究，不但可以依据义人地上的生活，还可以依据上帝在义人迁往天上、与上帝同活之后所显明的事。</p><p>从教会的肢体们收集关于奇迹、医治——在义人坟墓旁发生的——以及义人祈祷之助的见证。仔细考察他生活和信仰的纯洁。之后教会共同地研究所收集的信息，可以批准把义人作为圣人敬礼，并为此撰写教会文本和圣像，设立纪念日。这某种意义上是把教会民间已经在发生的敬礼理出秩序，确认这敬礼的正确性，把敬礼纳入事奉圣礼。</p><p>不过，许多义人的圣洁无需作见证，因为这由圣经和教会的圣传可知。著名的圣人无疑包括童贞女马利亚上帝之母（上帝为她成就了大事，<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/1/#L49">路 1:49</a>）、圣祖、先知、使徒、他们所立的主教、司祭和辅祭（例如首位殉道的六品执事司提反，<a href="https://bibleox.com/zh-Hans/cn-cuv/act/7/#L55-60">徒 7:55-60</a>）、众多的殉道者。此外，教会不只向圣人们祈祷，也向圣天使祈祷：总领天使米迦勒、加百列，以及<a href="https://bibleox.com/ru/ru/w/ангел-хранитель">护守天使</a>等。为天使的圣洁作见证是多余的，因为这是人所共知的上帝的仆人。</p><h2>重要的说明</h2><p>在为向圣人祈祷辩护之前，必须坚定地领会一个关键点：反对者没有对禁止向圣人祈祷作出正面的解释。反对者言论的基础只有一句话：“圣经里没有说”。这是他们解释的否定部分，他们会坚持它。而正面的部分——即对这一禁止的明确理解——他们没有。</p><p>基督复临安息日会的人部分地可以提出解释，因为他们不相信人死后灵魂的生活。不过，安息日会的人也无法解释为什么不能向天使祈祷——因为天使的存在他们目前并不否认。按圣经，天使被派给得救的人，关怀人的得救（<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/1/#L14">希 1:14</a>）；为什么对他们什么都不可以说？他们无法解释。</p><p>至于其余的（新）新教徒，他们大多数相信人在与身体分离后灵魂的生活，所以他们完全无法解释：为什么不能与天上的教会相通——而我们现在已经来到她面前（<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/12/#L22-23">希 12:22-23</a>）；为什么不能与圣祖们、使徒们、殉道者们、天使们交谈。当然，他们会试图说些什么，但那总是不能令人信服。例如会说，圣徒们进入了上帝的安息，所以仿佛不再挂念地上的事了。但那样就得出上帝也不挂念地上的事，因为他也在同一个安息里。他们其余的辩解也同样荒谬。</p><p>向圣人祈祷的必要性是从圣经隐含地（逐步地）推论出来的，就是说，这一必要性没有直接指明，而是被蕴含的。这是正常的，因为圣经里不是一切都说得直白。关于上帝是三位一体这一最主要的教训，就是从圣经隐含地推论出来的。我们的反对者自己也从圣经隐含地推论许多东西。例如，任何地方都没有说不能给婴儿施洗，然而他们不合理地断言不能给婴儿施洗，并且不因圣经里没有说而困扰。他们试图从圣经的别的论断隐含地推出这一禁止。所以极重要的是把他们引到这个领域，请他们对禁止向圣人祈祷给出一个有意义的理解。</p><p>还有，亲爱的朋友，也要记住：反对向圣人祈祷的人，所反对的根本不是代求性的祈祷（因为很容易证明：他们彼此祈祷时自己就是彼此的代求者，无论他们怎样争辩）。他们最反对的，是<strong>地上教会与天上教会的相通</strong>——反对与圣洁的灵——圣天使和圣人们、上帝的朋友们——的任何相通。仿佛地上的教会对天上的教会生了气，不愿意与她交谈；仿佛基督身体的一部分不愿与同一身体的另一部分相通。他们连一句话都不允许，甚至不允许向护守天使为他的关怀感谢一句。因为一旦承认与属灵世界中的圣人们哪怕最小的相通可能，很快留给他们的，就只剩下一步一步地承认与地上教会和天上教会的相通相关的一切了。所以，作为问题之一，值得考察与天使相通的可能——圣经中这一点展现得非常广泛。</p>
