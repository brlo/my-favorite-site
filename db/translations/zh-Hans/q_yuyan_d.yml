  title: 假基督
  copy_cover: true
  body: <h2>前言</h2><p>主耶稣基督两千多年前，按古代先知的<a href="https://bibleox.com/ru/ru/w/пророчества-о-Христе">话语</a>，由至洁的童贞女马利亚所生（不经男子）。他在少年时（十二岁）就已具有大智慧，令耶路撒冷圣殿中的教师们惊奇。到三十岁之前，耶稣基督顺服于约瑟，作寻常的劳动；三十岁时出来传道。关于这一时期的详情：<a href="https://bibleox.com/ru/ru/w/Христос-жизнь-в-Палестине">基督——在巴勒斯坦的生活</a>。</p><p>之后，主耶稣基督传道，教导了门徒（使徒们），被出卖，在十字架上受难，第三天复活，四十天之久向自己的跟随者显现，教导他们天国的事，然后升天，坐在上帝的右边，并应许要第二次再来——正如他升天那样——为要审判全宇宙。再过十天（从复活算起的第五十天），他建立了自己的教会，并永远地把圣灵赐给了教会。</p><h2>关于假基督</h2><h3>欺骗者</h3><p>主耶稣基督亲自警告说，将有人冒充他来临，许多人会相信这些欺骗者：</p><blockquote><p>“耶稣在橄榄山上坐着，门徒暗暗地来说：「请告诉我们，什么时候有这些事？你降临和世界的末了，有什么预兆呢？」 耶稣回答说：「<strong><mark>你们要谨慎，免得有人迷惑你们</mark></strong>。 <strong><mark>因为将来有好些人冒我的名来，说：『我是基督』，并且要迷惑许多人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/24/#L3-5">太 24:3-5</a>)</p></blockquote><h2>关于基督的降临</h2><h3>降临——如同闪电</h3><p>然而，基督的第二次降临将立刻被全世界的人知道，如同闪过的闪电：</p><blockquote><p>“人将要对你们说：『看哪，在那里！看哪，在这里！』<strong><mark>你们不要出去，也不要跟随他们</mark></strong>！ 因为<strong><mark>人子在他降临的日子</mark></strong>，<strong><mark>好像闪电从天这边一闪直照到天那边</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/17/#L23-24">路 17:23-24</a>)</p></blockquote><blockquote><p>“若有人对你们说，『看哪，基督在旷野里』，<strong><mark>你们不要出去</mark></strong>；或说，『看哪，基督在内屋中』，<strong><mark>你们不要信</mark></strong>。 <strong><mark>闪电从东边发出，直照到西边；人子降临，也要这样</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/24/#L26-27">太 24:26-27</a>)</p></blockquote><h3>与所有天使一同降临</h3><p>基督的第二次降临将带着父的荣耀，与所有圣洁的天使一同来临：</p><blockquote><p>“你们要从我山的谷中逃跑，因为山谷必延到亚萨。你们逃跑，必如犹大王乌西雅年间的人逃避大地震一样。<strong><mark>耶和华我的上帝必降临，有一切圣者同来</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/zah/14/#L5">亚 14:5</a>)</p></blockquote><blockquote><p>“<strong><mark>当人子在他荣耀里</mark></strong>，<strong><mark>同着众天使降临的时候</mark></strong>，要坐在他荣耀的宝座上。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/25/#L31">太 25:31</a>)</p></blockquote><blockquote><p>“凡在这淫乱罪恶的世代，把我和我的道当作可耻的，人子在他父的荣耀里，<strong><mark>同圣天使降临的时候</mark></strong>，也要把那人当作可耻的。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/8/#L38">可 8:38</a>)</p></blockquote><blockquote><p>“人子要在他父的荣耀里，<strong><mark>同着众使者降临</mark></strong>；那时候，他要照各人的行为报应各人。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/16/#L27">太 16:27</a>)</p></blockquote><blockquote><p>“亚当的七世孙以诺曾预言这些人说：『看哪，<strong><mark>主带着他的千万圣者降临</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iud/1/#L14">犹 1:14</a>)</p></blockquote><blockquote><p>“好使你们<strong><mark>当我们主耶稣同他众圣徒来的时候</mark></strong>，在我们父上帝面前心里坚固，成为圣洁，无可责备。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1sol/3/#L13">帖前 3:13</a>)</p></blockquote><blockquote><p>“也必使你们这受患难的人与我们同得平安。那时，<strong><mark>主耶稣同他有能力的天使从天上在火焰中显现</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2sol/1/#L7">帖后 1:7</a>)</p></blockquote><h3>以已有的成人身体降临</h3><p>基督不会再次由人所生，而是带着他已有的身体来临——那身体是他在公元一世纪由童贞女马利亚上帝之母所生时获得的。</p><blockquote><p>“说了这话，他们正看的时候，<strong><mark>他就被取上升，有一朵云彩把他接去</mark></strong>，便看不见他了。 当他往上去，他们定睛望天的时候，忽然有两个人身穿白衣，站在旁边，说： 「加利利人哪，你们为什么站着望天呢？<strong><mark>这离开你们被接升天的耶稣，你们见他怎样往天上去，他还要怎样来</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/1/#L9-11">徒 1:9-11</a>)</p></blockquote><h3>降临是为了审判</h3><p>主来不是为了教导，而是按他第一次来时所已经赐下的话语施行审判：</p><blockquote><p>“弃绝我不领受我话的人，有审判他的；<strong><mark>就是我所讲的道，在末日要审判他</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/12/#L48">约 12:48</a>)</p></blockquote><blockquote><p>“人子要在他父的荣耀里，同着众使者降临；那时候，<strong><mark>他要照各人的行为报应各人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/16/#L27">太 16:27</a>)</p></blockquote><blockquote><p>“<strong><mark>当人子在他荣耀里</mark></strong>，同着众天使降临的时候，<strong><mark>要坐在他荣耀的宝座上</mark></strong>。 <strong><mark>万民都要聚集在他面前</mark></strong>。他要把他们分别出来，<strong><mark>好像牧羊的分别绵羊山羊一般</mark></strong>； 把绵羊安置在右边，山羊在左边。 &lt;…&gt; <strong><mark>这些人，要往永刑里去</mark></strong>；<strong><mark>那些义人，要往永生里去</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/25/#L31-33,46">太 25:31-33,46</a>)</p></blockquote><blockquote><p>“<strong><mark>这正是上帝公义判断的明证</mark></strong>，叫你们可算配得上帝的国，你们就是为这国受苦。 上帝既是公义的，就必将患难报应那加患难给你们的人； 也必使你们这受患难的人与我们同得平安。<strong><mark>那时，主耶稣同他有能力的天使从天上在火焰中显现</mark></strong>， <strong><mark>要报应那不认识上帝和那不听从我主耶稣福音的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2sol/1/#L5-8">帖后 1:5-8</a>)</p></blockquote>
