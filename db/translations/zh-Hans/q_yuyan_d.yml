  path: QY4A_关于异端产生的预言
  title: 关于异端产生的预言
  copy_cover: true
  body: <h2>基督教中将出现许多异端</h2><blockquote><p>“<strong><mark>将来有好些人冒我的名来</mark></strong>，说『我是基督』，<strong><mark>并且要迷惑许多人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/13/#L6">可 13:6</a>)</p></blockquote><blockquote><p>“<strong><mark>且有好些假先知起来，迷惑多人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/24/#L11">太 24:11</a>)</p></blockquote><blockquote><p>“亲爱的弟兄啊，一切的灵，你们不可都信，总要试验那些灵是出于上帝的不是，因为<strong><mark>世上有许多假先知已经出来了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/4/#L1">约壹 4:1</a>)</p></blockquote><h2>异端将非常广泛地传播</h2><blockquote><p>“<strong><mark>他们的话如同毒疮，越烂越大</mark></strong>；其中有许米乃和腓理徒， <strong><mark>他们偏离了真道，说复活的事已过</mark></strong>，就败坏好些人的信心。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/2/#L17-18">提后 2:17-18</a>)</p></blockquote><blockquote><p>“从前在百姓中有假先知起来，<strong><mark>将来在你们中间也必有假师傅，私自引进陷害人的异端</mark></strong>，连买他们的主他们也不承认，自取速速地灭亡。 <strong><mark>将有许多人随从他们邪淫的行为</mark></strong>，便叫真道因他们的缘故被毁谤。 <strong><mark>他们因有贪心，要用捏造的言语在你们身上取利</mark></strong>。他们的刑罚，自古以来并不迟延；他们的灭亡，也必速速来到。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2pet/2/#L1-3">彼后 2:1-3</a>)</p></blockquote><h2>异端的社群将脱离教会及其信仰的合一</h2><blockquote><p>“小子们哪，如今是末时了。你们曾听见说，那敌基督的要来，<strong><mark>现在已经有好些敌基督的出来了</mark></strong>，从此我们就知道如今是末时了。 <strong><mark>他们从我们中间出去，却不是属我们的</mark></strong>；若是属我们的，就必仍旧与我们同在；他们出去显明都不是属我们的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/2/#L18-19">约壹 2:18-19</a>)</p></blockquote><blockquote><p>“他们曾对你们说过：『<strong><mark>末世必有好讥诮的人</mark></strong>随从自己不敬虔的私欲而行。』 <strong><mark>这就是那些引人结党、属乎血气、没有圣灵的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iud/1/#L18-19">犹 1:18-19</a>)</p></blockquote><h2>假师傅的任务——把信徒从教会中掳走并带他们随己而行</h2><blockquote><p>“我知道我去之后，<strong><mark>必有兇暴的豺狼进入你们中间</mark></strong>，不爱惜羊群。 <strong><mark>就是你们中间，也必有人起来，说悖谬的话，要引诱门徒跟从他们</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/20/#L29-30">徒 20:29-30</a>)</p></blockquote><h2>假师傅的手法</h2><h3>1. 动听的学说</h3><p>假师傅们将要编出动听的学说，正是因为他们的听众将寻求悦耳的学说，忍受不了纯正的教导：</p><blockquote><p>“因为时候要到，<strong><mark>人必厌烦纯正的道理</mark></strong>，<strong><mark>耳朵发痒，就随从自己的情欲，增添好些师傅</mark></strong>；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/4/#L3">提后 4:3</a>)</p></blockquote><blockquote><p>“圣灵明说：在后来的时候，<strong><mark>必有人离弃真道，听从那引诱人的邪灵和鬼魔的道理</mark></strong>。 这是因为说谎之人的假冒，这等人的良心如同被热铁烙惯了一般。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/4/#L1-2">提前 4:1-2</a>)</p></blockquote><h3>2. 虚假的敬虔</h3><blockquote><p>“你该知道，<strong><mark>末世必有危险的日子来到</mark></strong>。 因为那时人要专顾自己、贪爱钱财、自夸、狂傲、谤讟、违背父母、忘恩负义、心不圣洁、 &lt;…&gt; <strong><mark>有敬虔的外貌，却背了敬虔的实意</mark></strong>，这等人你要躲开。 &lt;…&gt; 常常学习，终久不能明白真道。 从前雅尼和佯庇怎样敌挡摩西，<strong><mark>这等人也怎样敌挡真道</mark></strong>。他们的心地坏了，在真道上是可废弃的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/3/#L1-2,5,7-8">提后 3:1-2,5,7-8</a>)</p></blockquote><blockquote><p>“<strong><mark>你们要防备假先知。他们到你们这里来，外面披着羊皮，里面却是残暴的狼</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/7/#L15">太 7:15</a>)</p></blockquote><h3>3. 展示性的奇迹</h3><p>使徒们和古代基督徒被赐予丰富的行异能之力，不是为了作秀，而是为了益处：</p><blockquote><p>“<strong><mark>圣灵显在各人身上，是叫人得益处</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/12/#L7">林前 12:7</a>)</p></blockquote><p>一小群渔夫需要很大的帮助，才能作为见证人，在短短一生中把传道传遍全世界。使徒们曾警告说，这些恩赐将要止息：</p><blockquote><p>“爱是永不止息。<strong><mark>先知讲道之能，终必归于无有；说方言之能，终必停止</mark></strong>；知识也终必归于无有。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/13/#L8">林前 13:8</a>)</p></blockquote><p>基督自己也斥责寻求奇迹：</p><blockquote><p>“耶稣回答说：「<strong><mark>一个邪恶、淫乱的世代求看神迹</mark></strong>，除了先知约拿的神迹以外，再没有神迹给他们看。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/12/#L39">太 12:39</a>)</p></blockquote><p>在末后的时代，假先知将恰恰以奇迹引诱人：</p><blockquote><p>“<strong><mark>因为假基督、假先知将要起来，显大神迹、大奇事</mark></strong>。倘若能行，连选民也就迷惑了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/24/#L24">太 24:24</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/mk/13/#L22">可 13:22</a>)</p></blockquote><p>结果，在审判时，许多信徒将确信自己得救正是因为他们奉基督的名行异能、说预言、赶鬼。但他们受了欺骗，被教导行不法之事，基督不认识他们，把他们从自己面前赶走：</p><blockquote><p>“<strong><mark>当那日，必有许多人对我说</mark></strong>：『主阿，主阿，我们不是奉你的名传道，奉你的名赶鬼，<strong><mark>奉你的名行许多异能吗</mark></strong>？』 我就明明地告诉他们说：『<strong><mark>我从来不认识你们，你们这些作恶的人，离开我去吧</mark></strong>！』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/7/#L22-23">太 7:22-23</a>)</p></blockquote><h2>如何认出假先知</h2><p>他的预言不成就：</p><blockquote><p>“先知托耶和华的名说话，<strong><mark>所说的若不成就，也无效验</mark></strong>，这就是耶和华所未曾吩咐的，是那先知擅自说的，你不要怕他。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/18/#L22">申 18:22</a>)</p></blockquote><p>如果先知或作梦的向你显个神迹、奇迹，或他的梦应验了，但他召你去事奉别的神，那就不当听他的话：</p><blockquote><p>“你们中间若有先知或是作梦的起来，<strong><mark>向你显个神迹奇事</mark></strong>， 对你说：『<strong><mark>我们去随从你素来所不认识的别神</mark></strong>，事奉他吧！』<strong><mark>他所显的神迹奇事，虽有应验</mark></strong>， <strong><mark>你也不可听那先知或是那作梦之人的话</mark></strong>。因为这是耶和华你们的上帝试验你们，要知道你们是尽心、尽性爱耶和华你们的上帝不是。 <strong><mark>你们要顺从耶和华你们的上帝</mark></strong>，敬畏他，谨守他的诫命，听从他的话，事奉他，专靠他。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/13/#L1-4">申 13:1-4</a>)</p></blockquote>
