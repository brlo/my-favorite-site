  title: 分裂（分门别类）
  copy_cover: true
  body: <h2>基督和使徒对教会有形合一的旨意</h2><blockquote><p>“<strong><mark>我不但为这些人祈求</mark></strong>，也为那些因他们的话信我的人祈求， <strong><mark>使他们都合而为一</mark></strong>；正如你父在我里面，我在你里面，使他们也在我们里面，<strong><mark>叫世人可以信你差了我来</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/17/#L20-21">约 17:20-21</a>)</p></blockquote><blockquote><p>“弟兄们，我藉我们主耶稣基督的名，<strong><mark>劝你们都说一样的话</mark></strong>。<strong><mark>你们中间也不可分党</mark></strong>，<strong><mark>只要一心一意</mark></strong>，彼此相合。 因为革来氏家里的人曾对我提起弟兄们来，说你们中间有纷争。 我的意思就是你们各人说：『我是属保罗的』，『我是属亚波罗的』，『我是属矶法的』，『我是属基督的』。 <strong><mark>基督是分开的吗</mark></strong>？保罗为你们钉了十字架吗？你们是奉保罗的名受了洗吗？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/1/#L10-13">林前 1:10-13</a>)</p></blockquote><blockquote><p>“有说：「我是属保罗的。」有说：「我是属亚波罗的。」<strong><mark>这岂不是你们和世人一样吗</mark></strong>？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/3/#L4">林前 3:4</a>)</p></blockquote><p>上帝安排身体（教会）的肢体，使没有分裂，众人却彼此相顾，一同受苦，一同快乐：</p><blockquote><p>“我们不拘是犹太人，是希利尼人，是为奴的，是自主的，<strong><mark>都从一位圣灵受洗，成了一个身体</mark></strong>，饮于一位圣灵。 <strong><mark>身子原不是一个肢体，乃是许多肢体</mark></strong>。 &lt;…&gt; <strong><mark>眼不能对手说</mark></strong>：「我用不着你。」头也不能对脚说：「我用不着你。」 不但如此，身上肢体，人以为软弱的，更是不可少的。 身上肢体，我们看为不体面的，越发给它加上体面；不俊美的，越发得着俊美。 我们俊美的肢体，自然用不着装饰；<strong><mark>但上帝配搭这身子</mark></strong>，把加倍的体面给那有缺欠的肢体， <strong><mark>免得身上分门别类，总要肢体彼此相顾</mark></strong>。 <strong><mark>若一个肢体受苦，所有的肢体就一同受苦</mark></strong>；若一个肢体得荣耀，所有的肢体就一同快乐。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/12/#L13-14,21-26">林前 12:13-14,21-26</a>)</p></blockquote><p>这些不同的肢体是什么？——是教会中不同的职分和恩赐：</p><blockquote><p>“<strong><mark>就如身子是一个，却有许多肢体</mark></strong>；而且肢体虽多，仍是一个身子。基督也是这样。 &lt;…&gt; <strong><mark>身子原不是一个肢体，乃是许多肢体</mark></strong>。 &lt;…&gt; <strong><mark>你们就是基督的身子</mark></strong>，并且各自作肢体。 <strong><mark>上帝在教会所设立的：第一是使徒，第二是先知，第三是教师</mark></strong>，其次是行异能的，再次是得恩赐医病的，帮助人的，治理事的，说方言的。 <strong><mark>岂都是使徒吗</mark></strong>？岂都是先知吗？岂都是教师吗？岂都是行异能的吗？ 岂都是得恩赐医病的吗？岂都是说方言的吗？岂都是繙方言的吗？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/12/#L12,14,27-30">林前 12:12,14,27-30</a>)</p></blockquote><p>这样，上帝安排这一切职分和恩赐，为使身体中没有分裂；使徒在书信开头就防止了这种分裂（<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/1/#L10-13">林前 1:10-13</a>）。也就是说，上帝不但愿意合一（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/17/#L20-21">约 17:20-21</a>），而且眷顾此事。看，使徒被上帝立为仆人，眷顾有形的合一，禁止哥林多人制造有形的分裂。</p><h2>教会中的分裂——堵住人进入上帝之国之路的罪</h2><blockquote><p>“情欲的事都是显而易见的，就如奸淫、污秽、邪荡、 拜偶像、邪术、仇恨、争竞、忌恨、恼怒、<strong><mark>结党</mark></strong>、纷争、异端、 嫉妒〔有古卷在此有『凶杀』二字〕、醉酒、荒宴等类。我从前告诉你们，现在又告诉你们，<strong><mark>行这样事的人必不能承受上帝的国</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/5/#L19-21">加 5:19-21</a>) <em>(「结党」（διχοστασίαι）——分裂、分为两部分。)</em></p></blockquote><blockquote><p>“弟兄们，<strong><mark>那些离间你们、叫你们跌倒、背乎所学之道的人</mark></strong>，我劝你们要留意躲避他们。 <strong><mark>因为这样的人不服事我们的主基督</mark></strong>，只服事自己的肚腹，用花言巧语诱惑那些老实人的心。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/16/#L17-18">罗 16:17-18</a>)</p></blockquote><h2>关于分裂的预言</h2><blockquote><p>“他们曾对你们说过：『<strong><mark>末世必有好讥诮的人</mark></strong>随从自己不敬虔的私欲而行。』 <strong><mark>这就是那些引人结党、属乎血气、没有圣灵的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iud/1/#L18-19">犹 1:18-19</a>)</p></blockquote><blockquote><p>“小子们哪，如今是末时了。你们曾听见说，那敌基督的要来，<strong><mark>现在已经有好些敌基督的出来了</mark></strong>，从此我们就知道如今是末时了。 <strong><mark>他们从我们中间出去，却不是属我们的</mark></strong>；若是属我们的，就必仍旧与我们同在；他们出去显明都不是属我们的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/2/#L18-19">约壹 2:18-19</a>)</p></blockquote><h2>分裂的例子</h2><blockquote><p>“我曾略略的写信给教会，<strong><mark>但那在教会中好为首的丢特腓不接待我们</mark></strong>。 所以我若去，必要提说他所行的事，就是<strong><mark>他用恶言妄论我们</mark></strong>。还不以此为足，他自己不接待弟兄，有人愿意接待，他也禁止，<strong><mark>并且将接待弟兄的人赶出教会</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/3in/1/#L9-10">约叁 1:9-10</a>)</p></blockquote><h2>使徒们阻止分裂的企图</h2><blockquote><p>“因为革来氏家里的人曾对我提起弟兄们来，<strong><mark>说你们中间有纷争</mark></strong>。 <strong><mark>我的意思就是你们各人说</mark></strong>：『我是属保罗的』，『我是属亚波罗的』，『我是属矶法的』，『我是属基督的』。 <strong><mark>基督是分开的吗</mark></strong>？保罗为你们钉了十字架吗？你们是奉保罗的名受了洗吗？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/1/#L11-13">林前 1:11-13</a>)</p></blockquote><blockquote><p>“弟兄们，我藉我们主耶稣基督的名，<strong><mark>劝你们都说一样的话</mark></strong>。<strong><mark>你们中间也不可分党</mark></strong>，只要一心一意，彼此相合。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/1/#L10">林前 1:10</a>)</p></blockquote><blockquote><p>“<strong><mark>免得身上分门别类，总要肢体彼此相顾</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/12/#L25">林前 12:25</a>)</p></blockquote>
