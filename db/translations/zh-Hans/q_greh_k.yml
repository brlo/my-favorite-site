- src: грех-гомосексуализм
  path: QS17A_同性恋
  title: 同性恋（男色）
  copy_cover: true
  body: <p>同性恋是罪，在上帝面前是可憎的：</p><blockquote><p>“<strong><mark>不可与男人苟合，像与女人一样，这本是可憎恶的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/18/#L22">利 18:22</a>)</p></blockquote><blockquote><p>“<strong><mark>人若与男人苟合，像与女人一样，他们二人行了可憎的事，总要把他们治死</mark></strong>，罪要归到他们身上。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/20/#L13">利 20:13</a>)</p></blockquote><p>同性恋是可羞耻的情欲，要承受报应：</p><blockquote><p>“因此，<strong><mark>上帝任凭他们放纵可羞耻的情欲</mark></strong>。<strong><mark>他们的女人把顺性的用处变为逆性的用处</mark></strong>； 男人也是如此，弃了女人顺性的用处，<strong><mark>欲火攻心，彼此贪恋，男和男行可羞耻的事，就在自己身上受这妄为当得的报应</mark></strong>。 他们既然故意不认识上帝，上帝就任凭他们存邪僻的心，<strong><mark>行那些不合理的事</mark></strong>； &lt;…&gt; <strong><mark>他们虽知道上帝判定行这样事的人是当死的，然而他们不但自己去行，还喜欢别人去行</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/1/#L26-28,32">罗 1:26-28,32</a>)</p></blockquote><p>同性恋是致死的罪：</p><blockquote><p>“你们岂不知<strong><mark>不义的人不能承受上帝的国</mark></strong>吗？<strong><mark>不要自欺</mark></strong>！无论是淫乱的、拜偶像的、奸淫的、作娈童的、<strong><mark>亲男色的</mark></strong>、 偷窃的、贪婪的、醉酒的、辱骂的、勒索的，<strong><mark>都不能承受上帝的国</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/6/#L9-10">林前 6:9-10</a>)</p></blockquote><p>同性恋是违背诫命的不法行为，与来自上帝的纯正教导相悖：</p><blockquote><p>“因为律法不是为义人设立的，<strong><mark>乃是为不法和不服的</mark></strong>，不虔诚和犯罪的，不圣洁和恋世俗的，弑父母和杀人的， <strong><mark>行淫和亲男色的</mark></strong>，抢人口和说谎话的，并起假誓的，<strong><mark>或是为别样敌正道的事设立的</mark></strong>。 这是照着可称颂之上帝交托我荣耀福音说的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/1/#L9-11">提前 1:9-11</a>)</p></blockquote><p>所多玛和蛾摩拉因同性恋之罪被毁灭：</p><blockquote><p>“他们还没有躺下，<strong><mark>所多玛城里各处的人，连老带少，都来围住那房子</mark></strong>， 呼叫罗得说：「今日晚上到你这里来的人在那里呢？<strong><mark>把他们带出来，任我们所为</mark></strong>。」 罗得出来，把门关上，到众人那里， 说：「众弟兄，<strong><mark>请你们不要作这恶事</mark></strong>。 &lt;…&gt; 只是那二人伸出手来，将罗得拉进屋去，把门关上。 并且使门外的人，无论老少，眼都昏迷；他们摸来摸去，总寻不着房门。 二人对罗得说：「你这里还有什么人吗？无论是女婿，是儿女和这城中一切属你的人，你都要将他们从这地方带出去。 <strong><mark>我们要毁灭这地方，因为城内罪恶的声音，在耶和华面前甚大</mark></strong>，耶和华差我们来，要毁灭这地方。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/19/#L4-7,10-13">创 19:4-7,10-13</a>)</p></blockquote><blockquote><p>“<strong><mark>又如所多玛、蛾摩拉，和周围城邑的人，也照他们一味的行淫，随从逆性的情欲，就受永火的刑罚，作为鉴戒</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iud/1/#L7">犹 1:7</a>)</p></blockquote><p>各民族因同性恋之罪被从上帝应许给犹太人的土地上赶出：</p><blockquote><p>“我今天所吩咐你的，你要谨守，<strong><mark>我要从你面前撵出亚摩利人、迦南人、赫人、比利洗人、希未人、耶布斯人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/34/#L11">出 34:11</a>)</p></blockquote><blockquote><p>“<strong><mark>不可与男人苟合，像与女人一样，这本是可憎恶的</mark></strong>。 &lt;…&gt; 在这一切的事上，你们都不可玷污自己，<strong><mark>因为我在你们面前所逐出的列邦，在这一切的事上玷污了自己</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/18/#L22,24">利 18:22,24</a>)</p></blockquote><blockquote><p>“<strong><mark>人若与男人苟合，像与女人一样，他们二人行了可憎的事</mark></strong>，总要把他们治死，罪要归到他们身上。 &lt;…&gt; <strong><mark>我在你们面前所逐出的国民，你们不可随从他们的风俗，因为他们行了这一切的事，所以我厌恶他们</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/20/#L13,23">利 20:13,23</a>)</p></blockquote>
