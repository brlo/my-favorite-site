  path: QS18A_异装
  title: 异装
  copy_cover: true
  body: <p><strong>异装</strong>（拉丁文 *trans*——「越过、跨越」，*vestitus*——「穿着的」）——人强迫性地渴望穿传统上与异性相关联的服装。</p><blockquote><p>“<strong><mark>妇女不可穿戴男子所穿戴的；男子也不可穿妇女的衣服</mark></strong>，因为这样行都是耶和华你上帝所憎恶的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/22/#L5">申 22:5</a>)</p></blockquote>
