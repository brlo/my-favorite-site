- src: родовые-грехи
  path: QS19A_祖先的罪
  title: 祖先的罪（没有这样的罪）
  copy_cover: true
  body: <p>祖先的罪并不存在。这个概念是捏造出来的，通常是所谓「民间疗法师」、特异功能者和巫师使用的概念。教会有原罪的概念，但那是另一个概念（见<a href="https://bibleox.com/ru/ru/w/7XucD5kC_Всехбщая_первородного_греха">引文</a>）。使人完全脱离原罪的，只有教会的圣洗礼，而不是巫师和特异功能者——他们在主耶稣基督道成肉身之前就有，却没有行出基督所行的事。</p><p>上帝向每个人追讨的是他自己的罪。然而，父母的义的生活或败坏的生活，其后果都会落在儿女身上。这好比：如果父母毁坏自己的健康（酗酒、吸毒），也就损害了自己孩子的健康，尽管孩子对父母毁坏健康并无过错。在上帝面前，孩子不为父母的酗酒承担责任。</p><p>这一思想可以从以下的圣经话语中详细明白：</p><blockquote><p>“「<strong><mark>你们在以色列地怎么用这俗语说</mark></strong>『父亲吃了酸葡萄，儿子的牙酸倒了』呢？ 主耶和华说，我指着我的永生起誓，你们在以色列中，必不再有用这俗语的因由。 看哪！世人都是属我的：为父的怎样属我，为子的也照样属我。<strong><mark>犯罪的他必死亡</mark></strong>。 <strong><mark>人若是公义，且行正直与合理的事</mark></strong>： 未曾在山上吃过祭偶像之物，未曾仰望以色列家的偶像；未曾玷污邻舍的妻，未曾在妇人的经期内亲近她； 未曾亏负人，乃将欠债之人的当头还给他；未曾抢夺人的物件，却将食物给饥饿的人吃，将衣服给赤身的人穿； 未曾向借钱的弟兄取利，也未曾向借粮的弟兄多要；缩手不作罪孽，在两人之间，按至理判断； <strong><mark>遵行我的律例，谨守我的典章，按诚实行事，这人是公义的，必定存活</mark></strong>。这是主耶和华说的。 <strong><mark>他若生一个儿子作强盗，是流人血的</mark></strong>，不行以上所说之善，反行其中之恶：『乃在山上吃过祭偶像之物，并玷污邻舍的妻； &lt;…&gt; 亏负困苦和穷乏的人；抢夺人的物；未曾将当头还给人；仰望偶像，并行可憎的事； 向借钱的弟兄取利，向借粮的弟兄多要。这人岂能存活呢？他必不能存活，<strong><mark>他行这一切可憎的事，必要死亡，他的罪</mark></strong>必归到他身上。』 <strong><mark>他若生一个儿子，见父亲所犯的一切罪，便惧怕</mark></strong>〔有古卷作『思量』〕，不照样去做： 『未曾在山上吃过祭偶像之物，未曾仰望以色列家的偶像，未曾玷污邻舍的妻， 未曾亏负人，未曾取人的当头，未曾抢夺人的物件，却将食物给饥饿的人吃，将衣服给赤身的人穿； 缩手不害贫穷人，未曾向借钱的弟兄取利，也未曾向借粮的弟兄多要，他顺从我的典章，遵行我的律例，<strong><mark>就不因父亲的罪孽死亡，定要存活</mark></strong>。 至于他父亲，因为欺人太甚，抢夺弟兄，在本国的民中行不善，<strong><mark>他必因自己的罪孽死亡</mark></strong>。』 你们还说：『儿子为何不担当父亲的罪孽呢？』儿子行正直与合理的事，谨守遵行我的一切律例，他必定存活。 惟有犯罪的，他必死亡。<strong><mark>儿子必不担当父亲的罪孽，父亲也不担当儿子的罪孽</mark></strong>。义人的善果必归自己，恶人的恶报也必归自己。 恶人若回头离开所作的一切罪恶，谨守我一切的律例，行正直与合理的事，<strong><mark>他必定存活，不至死亡</mark></strong>。 <strong><mark>他所犯的一切罪过都不被记念，因所行的义，他必存活</mark></strong>。 主耶和华说，恶人死亡，岂是我喜悦的吗？不是喜悦他回头离开所行的道存活吗？ 义人若转离义行而作罪孽，照着恶人所行一切可憎的事而行，他岂能存活吗？<strong><mark>他所行的一切义都不被记念，他必因所犯的罪、所行的恶死亡</mark></strong>。 你们还说：『主的道不公平！』以色列家啊，你们当听，我的道岂不公平吗？你们的道岂不是不公平吗？ 义人若转离义行而作罪孽死亡，他是因所作的罪孽死亡。 再者，恶人若回头离开所行的恶，行正直与合理的事，他必将性命救活了。 因为他思量，回头离开所犯的一切罪过，必定存活，不至死亡。 以色列家还说：『主的道不公平！』以色列家啊，我的道岂不公平吗？你们的道岂不是不公平吗？ 所以主耶和华说，以色列家阿，<strong><mark>我必按你们各人所行的审判你们。你们当回头离开所犯的一切罪过</mark></strong>。这样，罪孽必不使你们败亡。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iez/18/#L2-10,12-30">结 18:2-10,12-30</a>)</p></blockquote><p>但人们常常产生这样的想法：父母的罪责似乎还是会传给儿女。这想法是在读到以下圣经经文后产生的：</p><blockquote><p>“不可跪拜那些像；也不可事奉它，因为我耶和华你的上帝，是忌邪的上帝。<strong><mark>恨我的，我必追讨他的罪，自父及子，直到三四代</mark></strong>； 爱我、守我诫命的，我必向他们发慈爱，直到千代。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/20/#L5-6">出 20:5-6</a>)</p></blockquote><p>这里所说的是那些一代又一代持续恨上帝的人：「直到三四代——恨我的」。这样的人要因他们对上帝的恨受罚。为什么？虽然主容忍了他父亲、祖父、曾祖父的仇恨，但这仇恨既然延续到第三四代，容忍就到了尽头，刑罚就临到他们。</p><p>叙利亚的圣埃弗雷姆：</p><blockquote><p>第5-6节、13-14节、16-17节、22-26节。上帝在西奈山上赐下诫命，说：我是耶和华，必追讨恨我之人的罪，自父及子，直到三四代。<strong>上帝按自己的宽容容忍一个恶人，也容忍他的儿子和孙子；但他们若不悔改，就把刑罚加在第四代的头上，只要他在自己的恶行上与先祖相似。</strong></p></blockquote><p>（<a href="https://azbyka.ru/otechnik/Efrem_Sirin/tolkovanie-na-knigu-iskhod/20">《出埃及记》第20章注释</a>）</p>
