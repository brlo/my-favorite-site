  title: 约柜
  copy_cover: true
  body: <h2>约柜（见证柜）</h2><p>在<a href="https://bibleox.com/ru/ru/w/иерусалимский-храм#HH-Святая-Святых">至圣所</a>——<a href="https://bibleox.com/ru/ru/w/иерусалимский-храм">耶路撒冷圣殿</a>——的中央，在革鲁宾的翅膀底下，立着约柜（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L19">王上 6:19</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/8/#L6">王上 8:6</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/5/#L7">代下 5:7</a>），连同抬柜的杠（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/8/#L7">王上 8:7</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/5/#L9">代下 5:9</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/25/#L15">出 25:15</a>）。</p><h3>柜身</h3><p>尺寸为2.5×1.5肘，高1.5肘（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/25/#L10">出 25:10</a>）。用皂荚木制成（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/25/#L10">出 25:10</a>）。里外包上精金，上有金牙边（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/25/#L11">出 25:11</a>）。</p><h3>金环</h3><p>柜的下角各安一个抬柜用的金环（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/25/#L14">出 25:14</a>），共4个环（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/25/#L12">出 25:12</a>）。</p><h3>杠</h3><p>环中插入两根皂荚木杠（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/25/#L13">出 25:13</a>）。杠用金包裹（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/25/#L13">出 25:13</a>）。杠要常在柜的环内，不可抽出来（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/25/#L15">出 25:15</a>）。</p><h3>施恩座（盖）</h3><p>尺寸为2.5×1.5肘（与柜相同），用精金制成（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/25/#L17">出 25:17</a>）。</p><h3>革鲁宾</h3><p>在柜的施恩座上有两个金革鲁宾像（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/25/#L18">出 25:18</a>）。一个革鲁宾在施恩座的一头，另一个在另一头（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/25/#L19">出 25:19</a>），脸对着脸，朝着施恩座（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/25/#L20">出 25:20</a>）。他们的翅膀高张，遮掩施恩座（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/25/#L20">出 25:20</a>）。</p><h3>内容</h3><p>约柜里放着两块约版——先知摩西所放的（<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/8/#L9">王上 8:9</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/5/#L10">代下 5:10</a>）、一满俄梅珥吗哪（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/16/#L32-34">出 16:32-34</a>）和亚伦发芽开花的杏杖（<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/17/#L8-11">民 17:8-11</a>）。</p><h2>上帝在柜上说话</h2><p>上帝明确地在柜的施恩座上、两个革鲁宾之间显现并说话（<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/25/#L22">出 25:22</a>）：</p><blockquote><p>“<strong><mark>我要在那里与你相会，又要从法柜施恩座上，二基路伯中间</mark></strong>，和你说我所要吩咐你传给以色列人的一切事。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/25/#L22">出 25:22</a>)</p></blockquote>
