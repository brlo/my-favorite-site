  title: 护守天使
  copy_cover: true
  body: <h2>天使——无形体的神灵</h2><blockquote><p>“<strong><mark>所有的天使</mark></strong>，上帝从来对那一个说：『你坐在我的右边，等我使你仇敌作你的脚凳？』 <strong><mark>天使岂不都是服役的灵</mark></strong>、奉差遣为那将要承受救恩的人效力吗？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/1/#L13-14">希 1:13-14</a>)</p></blockquote><blockquote><p>“你们看我的手，我的脚，就知道实在是我了。摸我看看！<strong><mark>魂无骨无肉</mark></strong>，你们看，我是有的。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/24/#L39">路 24:39</a>)</p></blockquote><h2>天使被差遣服事得救的人</h2><blockquote><p>“<strong><mark>所有的天使</mark></strong>，上帝从来对那一个说：『你坐在我的右边，等我使你仇敌作你的脚凳？』 <strong><mark>天使岂不都是服役的灵、奉差遣为那将要承受救恩的人效力吗</mark></strong>？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/1/#L13-14">希 1:13-14</a>)</p></blockquote><h2>敬畏上帝之人的天使</h2><blockquote><p>“<strong><mark>耶和华的使者，在敬畏他的人四围安营搭救他们</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/34/#L7">诗 34:7</a>) <em>(俄文本编号为 Пс 33:7（圣咏编号相差一）。)</em></p></blockquote><blockquote><p>“<strong><mark>住在至高者隐密处的</mark></strong>，必住在全能者的荫下。 我要论到耶和华说：「<strong><mark>他是我的避难所，是我的山寨，是我的上帝，是我所倚靠的</mark></strong>。」 &lt;…&gt; 耶和华是我的避难所；你已将至高者当你的居所， <strong><mark>祸患必不临到你</mark></strong>，灾害也不挨近你的帐棚。 <strong><mark>因他要为你吩咐他的使者，在你行的一切道路上保护你</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/91/#L1-2,9-11">诗 91:1-2,9-11</a>) <em>(俄文本编号为 Пс 90:1-3,9-11（圣咏编号相差一）。)</em></p></blockquote><h2>信徒的天使</h2><blockquote><p>“你们要小心，不可轻看这小子里的一个。我告诉你们：<strong><mark>他们的使者在天上</mark></strong>，常见我天父的面。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/18/#L10">太 18:10</a>)</p></blockquote><h2>天使在来世接义人的灵魂</h2><blockquote><p>“<strong><mark>后来那讨饭的死了，被天使带去放在亚伯拉罕的怀里</mark></strong>。财主也死了，并且埋葬了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/16/#L22">路 16:22</a>)</p></blockquote><h2>旧约的义人和基督徒对天使的信仰</h2><blockquote><p>“<strong><mark>一千天使中，若有一个作传话的与上帝同在，指示人所当行的事</mark></strong>， 上帝就给他开恩说：『<strong><mark>救赎他免得下坑</mark></strong>，我已经得了赎价。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iov/33/#L23-24">伯 33:23-24</a>)</p></blockquote><blockquote><p>“听得是彼得的声音，就欢喜的顾不得开门，跑进去告诉众人说：「彼得站在门外！」 他们说：「你是疯了！」使女极力的说：「真是他！」他们说：「<strong><mark>必是他的天使</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/12/#L14-15">徒 12:14-15</a>)</p></blockquote><h2>主耶稣基督——作为人——的众天使</h2><h3>护守天使坚固作为人的耶稣基督</h3><blockquote><p>“<strong><mark>有一位天使从天上显现，加添他的力量</mark></strong>。 耶稣极其伤痛，祷告更加恳切，汗珠如大血点滴在地上。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/22/#L43-44">路 22:43-44</a>)</p></blockquote><h3>两个天使为主基督作见证</h3><h4>两个天使一同</h4><blockquote><p>“马利亚却站在坟墓外面哭，哭的时候，低头往坟墓里看， <strong><mark>就见两个天使，穿着白衣，在安放耶稣身体的地方坐着，一个在头，一个在脚</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/20/#L11-12">约 20:11-12</a>)</p></blockquote><blockquote><p>“她们就进去，只是不见主耶稣的身体。 正在猜疑之间，<strong><mark>忽然有两个人站在旁边，衣服放光</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/24/#L3-4">路 24:3-4</a>)</p></blockquote><blockquote><p>“当他往上去，他们定睛望天的时候，<strong><mark>忽然有两个人身穿白衣</mark></strong>，站在旁边，说：” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/1/#L10">徒 1:10</a>)</p></blockquote><h4>一个天使在坟墓外面</h4><blockquote><p>“忽然，地大震动，<strong><mark>因为有主的使者从天上下来，把石头滚开，坐在上面</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/28/#L2">太 28:2</a>)</p></blockquote><h4>一个天使在坟墓里面</h4><blockquote><p>“她们进了坟墓，<strong><mark>看见一个少年人坐在右边，穿着白袍</mark></strong>，就甚惊恐。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/16/#L5">可 16:5</a>)</p></blockquote><h2>天使解救使徒</h2><blockquote><p>“<strong><mark>忽然有主的一个使者站在旁边，屋里有光照耀</mark></strong>。天使拍彼得的肋旁，拍醒了他，说：「<strong><mark>快快起来</mark></strong>！」<strong><mark>那铁鍊就从他手上脱落下来</mark></strong>。 天使对他说：「束上带子，穿上鞋！」他就那样作。天使又说：「披上外衣，跟着我来。」 彼得就出来跟着他，<strong><mark>不知道天使所作是真的</mark></strong>，只当见了异象。 过了第一层、第二层监牢，就来到临街的铁门，那门自己开了。他们出来，走过一条街，<strong><mark>天使便离开他去了</mark></strong>。 彼得醒悟过来，说：「<strong><mark>我现在真知道主差遣他的使者，救我脱离希律的手</mark></strong>和犹太百姓一切所盼望的。」 想了一想，就往那称呼马可的约翰他母亲马利亚家去，在那里有好些人聚集祷告。 彼得敲外门，有一个使女名叫罗大出来探听， 听得是彼得的声音，就欢喜的顾不得开门，跑进去告诉众人说：「彼得站在门外！」 他们说：「你是疯了！」使女极力的说：「真是他！」他们说：「<strong><mark>必是他的天使</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/12/#L7-15">徒 12:7-15</a>)</p></blockquote>
