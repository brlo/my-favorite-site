- src: отношение-Церкви-к-государству
  path: Qc12A_教会与国家（掌权者）的关系
  title: 教会与国家（掌权者）的关系
  copy_cover: true
  body: <h2>为掌权者祈祷</h2><blockquote><p>“我劝你第一要为万人恳求、<strong><mark>祷告</mark></strong>、代求、祝谢， <strong><mark>为君王和一切在位的</mark></strong>，也该如此，使我们可以敬虔、端正，平安无事的度日。 这是好的，在上帝我们救主面前可蒙悦纳。 他愿意万人得救，明白真道。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/2/#L1-4">提前 2:1-4</a>)</p></blockquote><h2>顺服国家的掌权者</h2><blockquote><p>“你要提醒众人，叫他们<strong><mark>顺服作官的、掌权的</mark></strong>，遵他的命，预备行各样的善事。 不要毁谤，不要争竞，总要和平，<strong>向众人大显温柔</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/tit/3/#L1-2">多 3:1-2</a>)</p></blockquote><blockquote><p>“你们<strong><mark>为主的缘故</mark></strong>，要<strong><mark>顺服人的一切制度</mark></strong>，或是<strong><mark>在上的</mark></strong><strong><mark>君王</mark></strong>， 或是君王所派罚恶赏善的<strong><mark>臣宰</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/2/#L13-14">彼前 2:13-14</a>)</p></blockquote><blockquote><p>“务要尊敬众人，亲爱教中的弟兄，敬畏上帝，<strong><mark>尊敬君王</mark></strong>。 你们作仆人的，<strong>凡事要存敬畏的心顺服主人</strong>；<strong>不但顺服那善良温和的，就是那乖僻的也要顺服</strong>。 倘若人为叫良心对得住上帝，就忍受冤屈的苦楚，<strong>这是可喜爱的</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/2/#L17-19">彼前 2:17-19</a>)</p></blockquote><blockquote><p>“保罗说：「弟兄们，我不晓得他是大祭司。经上记着说：『<strong><mark>不可毁谤你百姓的官长</mark></strong>。』」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/23/#L5">徒 23:5</a>)</p></blockquote><blockquote><p>“又如所多玛、蛾摩拉，和周围城邑的人，也照他们一味的行淫，随从逆性的情欲，就受永火的刑罚，作为鉴戒。 这些作梦的人也像他们污秽身体，<strong><mark>轻慢主治的，毁谤在尊位的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iud/1/#L7-8">犹 1:7-8</a>)</p></blockquote><p>没有权柄不是出于上帝的，现有的权柄是上帝所立的——<strong>使徒这样说时，正身处异教崇拜盛行的罗马帝国</strong>：</p><blockquote><p>“<strong>在上有权柄的，人人当顺服他</strong>，<strong>因为没有权柄不是出于上帝的</strong>，<strong><mark>凡掌权的都是上帝所命的</mark></strong>。 所以抗拒掌权的，就是抗拒上帝的命；抗拒的必自取刑罚。 作官的原不是叫行善的惧怕，乃是叫作恶的惧怕。你愿意不惧怕掌权的吗？你只要行善，就可得他的称赞． 因为他是<strong>上帝的用人</strong>，是与你有益的。你若作恶，却当惧怕，因为他不是空空的佩剑。他是上帝的用人，是伸冤的，刑罚那作恶的。 <strong>所以你们必须顺服</strong>，不但是因为刑罚，也是因为良心。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/13/#L1-5">罗 13:1-5</a>)</p></blockquote><p>基督指出，彼拉的权柄是从上头来的：</p><blockquote><p>“耶稣回答说：「<strong><mark>若不是从上头赐给你的，你就毫无权柄办我</mark></strong>，所以把我交给你的那人，罪更重了。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/19/#L11">约 19:11</a>)</p></blockquote><h2>顺服国家掌权者的界限</h2><blockquote><p>“彼得、约翰说：「<strong><mark>听从你们，不听从上帝，这在上帝面前合理不合理</mark></strong>，你们自己酌量吧！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/4/#L19">徒 4:19</a>)</p></blockquote><blockquote><p>“彼得和众使徒回答说：「<strong><mark>顺从上帝，不顺从人，是应当的</mark></strong>！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/5/#L29">徒 5:29</a>)</p></blockquote><h2>纳税</h2><blockquote><p>“你们<strong>纳粮</strong>也为这个缘故，因他们是上帝的差役，常常特管这事。 <strong>凡人所当得的，就给他</strong>；当得粮的，给他纳粮；当得税的，给他上税；当惧怕的，惧怕他；当恭敬的，恭敬他。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/13/#L6-7">罗 13:6-7</a>)</p></blockquote><h2>旧约</h2><blockquote><p>“<strong>我儿，你要敬畏耶和华与君王</strong>，不要与反覆无常的人结交，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/24/#L21">箴 24:21</a>)</p></blockquote><h3>上帝“雇用”外邦的王来施行惩罚</h3><blockquote><p>“<strong>耶和华必使亚述王</strong>攻击你的日子临到你和你的百姓并你的父家。自从以法莲离开犹大以来，未曾有这样的日子。 &lt;…&gt; 那时，<strong><mark>主必用大河外赁的剃头刀</mark></strong>，就是亚述王，剃去头发和脚上的毛，并要剃净胡须。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/is/7/#L17,20">赛 7:17,20</a>)</p></blockquote><h3>上帝命令犹太民族顺服巴比伦王尼布甲尼撒</h3><blockquote><p>“现在我将这些地都交给<strong><mark>我仆人巴比伦王尼布甲尼撒</mark></strong>的手，我也将田野的走兽给他使用。 列国都必服事他和他的儿孙，直到他本国遭报的日期来到。那时，多国和大君王要使他作他们的奴仆。 无论哪一邦哪一国，不肯服事这巴比伦王尼布甲尼撒，也不把颈项放在巴比伦王的轭下，<strong>我必用刀剑、饥荒、瘟疫刑罚那邦</strong>，直到我<strong><mark>藉巴比伦王的手将他们毁灭</mark></strong>。这是耶和华说的。 至于你们，不可听从你们的先知和占卜的、圆梦的、观兆的以及行邪术的。他们告诉你们说：你们不至服事巴比伦王。 他们向你们说假预言，要叫你们迁移，远离本地，以致我将你们赶出去，使你们灭亡。 但哪一邦肯把颈项放在巴比伦王的轭下服事他，<strong>我必使那邦仍在本地存留</strong>，得以耕种居住。这是耶和华说的。』」 我就照这一切的话，对犹大王西底家说：「<strong><mark>要把你们的颈项放在巴比伦王的轭下，服事他和他的百姓，便得存活</mark></strong>。 你和你的百姓为何要因刀剑、饥荒、瘟疫死亡，正如耶和华论到不服事巴比伦王的那国说的话呢？ 不可听那些先知对你们所说的话。他们说『你们不至服事巴比伦王』，其实他们向你们说假预言。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ier/27/#L6-14">耶 27:6-14</a>)</p></blockquote><p>而巴比伦王尼布甲尼撒当然是拜偶像的（<a href="https://bibleox.com/zh-Hans/cn-cuv/dan/3/#L1-6">但 3:1-6</a>）。顺服他，意味着承认他在外在的、世界的事物——土地、财富等等——之上的世俗权柄。当尼布甲尼撒开始强迫犹太人拜偶像时，被拒绝的恰恰是他这个违背上帝的命令：</p><blockquote><p>“尼布甲尼撒问他们说：「沙得拉、米煞、亚伯尼歌，<strong>你们不事奉我的神，也不敬拜我所立的金像</strong>，是故意的吗？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/dan/3/#L14">但 3:14</a>)</p></blockquote><p>他们承认他是王，但拒绝服从：</p><blockquote><p>“沙得拉、米煞、亚伯尼歌对王说：「<strong>尼布甲尼撒啊</strong>，这件事我们不必回答你。 即便如此，我们所事奉的上帝，能将我们从烈火的窑中救出来。<strong><mark>王</mark></strong>啊，他也必救我们脱离你的手； 即或不然，<strong><mark>王</mark></strong>啊，你当知道<strong><mark>我们决不事奉你的神，也不敬拜你所立的金像</mark></strong>！」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/dan/3/#L16-18">但 3:16-18</a>)</p></blockquote><p>为此他们被扔进窑里：</p><blockquote><p>“这三人穿着裤子、内袍、外衣和别的衣服，被捆起来扔在烈火的窑中。 因为王命紧急，窑又甚热，那抬沙得拉、米煞、亚伯尼歌的人都被火焰烧死。 沙得拉、米煞、亚伯尼歌这三个人都<strong>被捆着落在烈火的窑中</strong>。 那时，尼布甲尼撒王惊奇，急忙起来，对谋士说：「我捆起来扔在火里的不是三个人吗？」他们回答王说：「王啊，是。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/dan/3/#L21-24">但 3:21-24</a>) <em>(俄文原文3:24（七十士译本）有“他们在火中游行，歌颂上帝、称颂上主”一句，和合本无)</em></p></blockquote><p>而上帝的天使保守他们毫发无损：</p><blockquote><p>“<strong>但是上主的天使降到窑中，来到阿匝黎雅及他同伴身旁，把窑中的火焰推出，使窑中仿佛吹起清凉的微风，火焰不但不能接近他们，且也不能给他们招来什么痛苦或烦恼。</strong>” (<a href="https://bibleox.com/zh-Hans/cn-sb/dan/3/#L49-50">但 3:49-50</a>)</p></blockquote><p>这三个少年人不听的，只是君王那条事奉别神的命令：</p><blockquote><p>“那时拿步高王十分惊慌，急忙站起，问他的臣仆说：“我们不是把他们三个人全捆起来抛入烈火窑中了吗？”仆人回答君王说：“大王，实在是！” <…> 于是拿步高说道：“沙得辣客、默沙客和阿贝得乃哥的上主，是可赞美的！他打发了自己的天使来，救护那些信赖自己的仆人，他们<strong>敢违背王命</strong>，宁愿捐躯，<strong>除自己的上主以外，不愿事奉叩拜其他任何神祇</strong>。” <…> 为此我今颁发诏书：无论那一个民族，那一邦国，那一个异语人民，凡对沙得辣客、默沙客和阿贝得乃哥的上主敢出言不恭的，必被万剐凌迟，他们的住宅必成为废墟，因为没有其他的神能像他这样施行拯救。” (<a href="https://bibleox.com/zh-Hans/cn-sb/dan/3/#L91,95-96">但 3:91,95-96</a>)</p></blockquote><h3>上帝拯救人脱离外邦的王</h3><blockquote><p>“所以耶和华论亚述王如此说：『他必不得来到这城，也不在这里射箭，不得拿盾牌到城前，也不筑垒攻城。 他从那条路来，必从那条路回去，必不得来到这城。』这是耶和华说的。 因我为自己的缘故，又为我仆人大卫的缘故，<strong>必保护拯救这城</strong>。」 当夜，<strong>耶和华的使者出去，在亚述营中杀了十八万五千人</strong>。清早有人起来一看，都是死尸了。 亚述王西拿基立就拔营回去，住在尼尼微。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/4ts/19/#L32-36">王下 19:32-36</a>)</p></blockquote><h3>刑罚和拯救取决于人民的虔敬</h3><blockquote><p>“说，「你们各人当回头，离开恶道和所作的恶，便可居住耶和华古时所赐给你们和你们列祖之地，直到永远。 <strong><mark>不可随从别神事奉敬拜</mark></strong>，<strong><mark>以你们手所作的惹我发怒</mark></strong>，这样，我就不加害与你们。 <strong><mark>然而，你们没有听从我</mark></strong>，竟以手所作的惹我发怒，陷害自己。」这是耶和华说的。 所以万军之耶和华如此说：「<strong><mark>因为你们没有听从我的话</mark></strong>， 我必召北方的众族和我仆人巴比伦王尼布甲尼撒来攻击这地，和这地的居民，并四围一切的国民。<strong>我要将他们尽行灭绝</strong>，以致他们令人惊骇、嗤笑，并且永久荒凉。」这是耶和华说的。 「我又要使欢喜和快乐的声音，新郎和新妇的声音，推磨的声音和灯的亮光，从他们中间止息。 这全地必然荒凉，令人惊骇，<strong>这些国民要服事巴比伦王七十年</strong>。 <strong>七十年满了以后，我必刑罚巴比伦王和那国民</strong>，并迦勒底人之地，因他们的罪孽使那地永远荒凉。」这是耶和华说的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ier/25/#L5-12">耶 25:5-12</a>)</p></blockquote><blockquote><p>“<strong>将你心所愿的赐给你</strong>，成就你的一切筹算。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/20/#L4">诗 20:4</a>)</p></blockquote>
