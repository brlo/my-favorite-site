  references: "<p>翻译：罗季翁·弗拉索夫（借助人工智能工具）。底本：俄文原文。参考：英文、日文翻译。圣经链接指向本站的和合本（上帝版）；次经书卷引文按思高译本，无中文经文处自俄文译出。</p>"
- src: отцами_и_учителями_не_называться
  path: Qc13A_不可称呼人为师、为父
  title: 不可称呼人为师、为父
  copy_cover: true
  body: <h2>基督命令不要称呼人为师、为父</h2><blockquote><p>“说：「文士和法利赛人坐在摩西的位上， &lt;…&gt; 他们一切所作的事都是要叫人看见，所以将佩戴的经文做宽了，衣裳的繸子做长了； <strong>喜爱筵席上的首座，会堂里的高位</strong>； 又喜爱人在街市上问他安，<strong>称呼他拉比</strong>。 <strong><mark>但你们不要受拉比的称呼</mark></strong>，因为只有一位是你们的夫子，你们都是弟兄； <strong><mark>也不要称呼地上的人为父</mark></strong>．因为只有一位是你们的父，就是在天上的父；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/23/#L2,5-9">太 23:2,5-9</a>)</p></blockquote><p>这话不能按字面理解，正如关于截去肢体的话（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L29-30">太 5:29-30</a>），以及基督说他来不是叫地上太平、乃是叫地上动刀兵的话（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/10/#L34-35">太 10:34-35</a>）不能按字面理解一样。这里教导的是谦卑：使信徒不去追求被人称呼“拉比、拉比”（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/23/#L7">太 23:7</a>），得到这些称呼之后也不骄傲自高，而要明白：至高的权柄、真正的父和师傅——是上帝。</p><p>重要的是从上下文出发正确理解这话的意思，否则就会得出连孩子也不能称呼自己的父亲为父的结论，尽管上帝在诫命里正是这样称呼他们的（<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/5/#L16">申 5:16</a>）。同样，也不能说任何教师都不可以称为教师，尽管教会里毫无疑问有教师。从圣经我们看到，使徒们并没有回避这些称呼。</p><h2>教师</h2><h3>基督称法利赛人尼哥底母为以色列人的先生</h3><blockquote><p>“耶稣回答说：「<strong><mark>你是以色列人的先生</mark></strong>，还不明白这事么？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/3/#L10">约 3:10</a>)</p></blockquote><h3>使徒说自己被立为教师</h3><blockquote><p>“<strong><mark>我为这福音奉派作传道的，作使徒，作师傅</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/1/#L11">提后 1:11</a>)</p></blockquote><blockquote><p>“他舍自己作万人的赎价，到了时候，这事必证明出来。 <strong><mark>我</mark></strong>为此奉派作传道的，作使徒，<strong><mark>作外邦人的师傅</mark></strong>，教导他们相信，学习真道。我说的是真话，并不是谎言。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/2/#L6-7">提前 2:6-7</a>)</p></blockquote><h3>上帝在教会里立了教师</h3><blockquote><p>“<strong><mark>上帝在教会</mark></strong>所设立的：第一是使徒，第二是先知，第三是<strong><mark>教师</mark></strong>，其次是行异能的，再次是得恩赐医病的，帮助人的，治理事的，说方言的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/12/#L28">林前 12:28</a>)</p></blockquote><blockquote><p>“<strong><mark>他</mark></strong><strong><mark>所赐的有</mark></strong>使徒，有先知，有传福音的，有牧师和<strong><mark>教师</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/4/#L11">弗 4:11</a>)</p></blockquote><blockquote><p>“或作执事，就当专一执事；<strong><mark>或作教导的，就当专一教导</mark></strong>；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/12/#L7">罗 12:7</a>)</p></blockquote><blockquote><p>“看你们学习的工夫，<strong><mark>本该作师傅</mark></strong>，谁知还得有人将上帝圣言小学的开端另教导你们，并且成了那必须吃奶、不能吃干粮的人。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/5/#L12">希 5:12</a>)</p></blockquote><h3>对教师之责任的警告</h3><blockquote><p>“我的弟兄们，<strong><mark>不要多人作师傅，因为晓得我们要受更重的判断</mark></strong>。 原来我们在许多事上都有过失；若有人在话语上没有过失，他就是完全人，也能勒住自己的全身。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/3/#L1-2">雅 3:1-2</a>)</p></blockquote><h2>父</h2><h3>基督应许有父</h3><blockquote><p>“耶稣说：「我实在告诉你们：<strong>人为我和福音撇下房屋，或是弟兄、姊妹、父母、儿女、田地</strong>， <strong>没有不在今世得百倍的</strong>，就是房屋、弟兄、姊妹、母亲、儿女、田地，并且要受逼迫；在来世必得永生。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/10/#L29-30">可 10:29-30</a>) <em>(和合本百倍的赏赐清单中无「父亲」一词。)</em></p></blockquote><h3>使徒称自己为父，称信徒为儿女</h3><blockquote><p>“我写这话，不是叫你们羞愧，乃是警戒你们，好像<strong><mark>我所亲爱的儿女</mark></strong>一样。 你们学基督的，师傅虽有一万，<strong><mark>为父的却是不多</mark></strong>，<strong><mark>因我在基督耶稣里用福音生了你们</mark></strong>。 &lt;…&gt; 因此我已打发提摩太到你们那里去；他在主里面，是<strong><mark>我所亲爱</mark></strong>、<strong><mark>有忠心的儿子</mark></strong>。他必提醒你们，记念我在基督里怎样行事，在各处各教会中怎样教导人。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/4/#L14-15,17">林前 4:14-15,17</a>)</p></blockquote><blockquote><p>“<strong><mark>我小子啊</mark></strong>，<strong>我为你们再受生产之苦</strong>，直等到基督成形在你们心里。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/4/#L19">加 4:19</a>)</p></blockquote><blockquote><p>“<strong><mark>我小子们哪</mark></strong>，我将这些话写给你们，是要叫你们不犯罪。若有人犯罪，在父那里我们有一位中保，就是那义者耶稣基督。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/2/#L1">约壹 2:1</a>)</p></blockquote><blockquote><p>“<strong><mark>小子们哪</mark></strong>，我们相爱，不要只在言语和舌头上，总要在行为和诚实上。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/3/#L18">约壹 3:18</a>)</p></blockquote><blockquote><p>“我听见<strong><mark>我的儿女们</mark></strong>按真理而行，我的喜乐就没有比这个大的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/3in/1/#L4">约叁 1:4</a>)</p></blockquote><blockquote><p>“就是为我<strong>在捆锁中所生的</strong><strong><mark>儿子</mark></strong>阿尼西母求你。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/fm/1/#L10">门 1:10</a>)</p></blockquote><h3>亚伯拉罕——信徒的父</h3><blockquote><p>“所以人得为后嗣是本乎信．因此就属乎恩，叫应许定然归给一切后裔，不但归给那属乎律法的，也归给那效法亚伯拉罕之信的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/4/#L16">罗 4:16</a>) <em>(俄文原文此节有“亚伯拉罕——我们众人的父”，和合本无)</em></p></blockquote><blockquote><p>“所以你们要知道，<strong>那以信为本的人，就是亚伯拉罕的子孙</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/3/#L7">加 3:7</a>)</p></blockquote><blockquote><p>“亚伯兰年九十九岁的时候，耶和华向他显现，对他说：「我是全能的上帝，你当在我面前作完全人。 &lt;…&gt; 「我与你立约，<strong><mark>你要作多国的父</mark></strong>。 从此以后，你的名不再叫亚伯兰，要叫亚伯拉罕，因为<strong>我已立你作多国的父</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/17/#L1,4-5">创 17:1,4-5</a>)</p></blockquote><blockquote><p>“并且他受了割礼的记号，作他未受割礼的时候因信称义的印证，<strong><mark>叫他作一切未受割礼而信之人的父</mark></strong>，使他们也算为义； 又作受割礼之人的父，就是那些不但受割礼，并且<strong>按我们的祖宗亚伯拉罕</strong>，未受割礼而信之踪迹去行的人。 &lt;…&gt; 亚伯拉罕所信的，是那叫死人复活、使无变为有的上帝，他在主面前作我们世人的父。如经上所记：『<strong><mark>我已经立你作多国的父</mark></strong>。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/4/#L11-12,17">罗 4:11-12,17</a>)</p></blockquote><h3>上帝赐下关于父亲的诫命</h3><blockquote><p>“<strong><mark>当孝敬父母</mark></strong>，使你的日子在耶和华你上帝所赐你的地上得以长久。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/20/#L12">出 20:12</a>)</p></blockquote><blockquote><p>“<strong><mark>当照耶和华你上帝所吩咐的孝敬父母</mark></strong>，<strong>使你得福</strong>。并使你的日子，在耶和华你上帝所赐你的地上得以长久。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/5/#L16">申 5:16</a>)</p></blockquote><blockquote><p>“诫命你是晓得的：不可杀人，不可奸淫，不可偷盗，不可作假见证，不可亏负人，<strong><mark>当孝敬父母</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/10/#L19">可 10:19</a>)</p></blockquote><blockquote><p>“<strong><mark>要孝敬父母</mark></strong>，使你得福，在世长寿。这是第一条带应许的诫命。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/6/#L2">弗 6:2</a>)</p></blockquote><h3>使徒称呼父老们</h3><blockquote><p>“<strong><mark>你们作父亲的</mark></strong>，不要惹儿女的气，只要照着主的教训和警戒养育他们。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/6/#L4">弗 6:4</a>)</p></blockquote><blockquote><p>“<strong><mark>你们作父亲的</mark></strong>，不要惹儿女的气，恐怕他们失了志气。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/3/#L21">西 3:21</a>)</p></blockquote><blockquote><p>“<strong><mark>父老啊，我写信给你们</mark></strong>，因为你们认识那从起初原有的。少年人哪，我写信给你们，因为你们胜了那恶者。小子们哪，我曾写信给你们，因为你们认识父。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/2/#L13">约壹 2:13</a>)</p></blockquote><h2>上帝甚至允许人在正确的意义上被称为神（不是按本性，而是按恩典）</h2><blockquote><p>“我曾说：『<strong>你们是神</strong>，都是至高者的儿子。』 然而你们要死，与世人一样；要仆倒，像王子中的一位。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/82/#L6-7">诗 82:6-7</a>)</p></blockquote><blockquote><p>“耶稣说：「你们的律法上岂不是写着『我曾说<strong>你们是神</strong>』么？ 经上的话是不能废的；若那些承受上帝道的人，尚且称为神，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/10/#L34-35">约 10:34-35</a>)</p></blockquote><p>然而，基督命令称自己为无用的仆人（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/17/#L10">路 17:10</a>）。</p><h2>相似的主题</h2><p>关于反驳称基督徒为上帝之奴仆的说法：<a href="https://bibleox.com/ru/ru/w/христианин-раб-Бога">基督徒——上帝的仆人</a></p>
