  title: 恩典借着不配的人做工
  copy_cover: true
  body: <h2>大祭司该亚法</h2><p>上帝藉着一个想要杀基督的人说出预言——不是因为别的，只是因为他在那一年是大祭司：</p><blockquote><p>“内中有一个人，名叫<strong><mark>该亚法</mark></strong>，本年作大祭司，对他们说：「你们不知道什么！ <strong>独不想一个人替百姓死，免得通国灭亡，就是你们的益处</strong>。」 <strong><mark>他这话不是出于自己</mark></strong>，是因他本年作大祭司，所以预言耶稣将要替这一国死。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/11/#L49-51">约 11:49-51</a>)</p></blockquote><h2>加略人犹大</h2><blockquote><p>“<strong>耶稣叫了十二个门徒来</strong>，<strong><mark>给他们权柄，能赶逐污鬼，并医治各样的病症</mark></strong>。 这十二使徒的名：头一个叫西门，又称彼得，还有他兄弟安得烈，西庇太的儿子雅各和雅各的兄弟约翰， 腓力和巴多罗买，多马和税吏马太，亚勒腓的儿子雅各，和达太， 奋锐党的西门，还有卖耶稣的<strong><mark>加略人犹大</mark></strong>。 耶稣差这十二个人去，吩咐他们说：「外邦人的路，你们不要走；撒玛利亚人的城，你们不要进； &lt;…&gt; <strong>医治病人，叫死人复活，叫长大痲疯的洁净，把鬼赶出去</strong>。你们白白的得来，也要白白的舍去。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/10/#L1-5,8">太 10:1-5,8</a>)</p></blockquote><blockquote><p>“有一个门徒，就是<strong><mark>那将要卖耶稣的加略人犹大</mark></strong>， &lt;…&gt; 他说这话，并不是挂念穷人，乃因<strong><mark>他是个贼</mark></strong>，又带着钱囊，常取其中所存的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/12/#L4,6">约 12:4,6</a>)</p></blockquote><h2>上帝的信实高于人的不忠</h2><blockquote><p>“即便有不信的，这有何妨呢？<strong>难道他们的不信，就废掉上帝的信吗</strong>？ <strong>断乎不能</strong>！不如说，上帝是真实的，人都是虚谎的。如经上所记：『你责备人的时候，显为公义；被人议论的时候，可以得胜。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/3/#L3-4">罗 3:3-4</a>)</p></blockquote><h2>司祭的责任</h2><blockquote><p>“惟有那不知道的，作了当受责打的事，必少受责打。因为多给谁，就向谁多取；<strong>多托谁，就向谁多要</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/12/#L48">路 12:48</a>)</p></blockquote>
