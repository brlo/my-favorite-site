  body: <h2>主耶稣基督在登山宝训中赐下的九条真福</h2><ol><li><p>“<strong>虚心的人</strong>有福了，因为天国是他们的。”（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L3">太 5:3</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L20">路 6:20</a>）</p></li><li><p>“<strong>哀恸的人</strong>有福了，因为他们必得安慰。”（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L4">太 5:4</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L21">路 6:21</a>）</p></li><li><p>“<strong>温柔的人</strong>有福了，因为他们必承受地土。”（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L5">太 5:5</a>）</p></li><li><p>“<strong>饥渴慕义的人</strong>有福了，因为他们必得饱足。”（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L6">太 5:6</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L21">路 6:21</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L25">路 6:25</a>）</p></li><li><p>“<strong>怜恤人的人</strong>有福了，因为他们必蒙怜恤。”（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L7">太 5:7</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L24">路 6:24</a>）</p></li><li><p>“<strong>清心的人</strong>有福了，因为他们必得见上帝。”（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L8">太 5:8</a>）</p></li><li><p>“<strong>使人和睦的人</strong>有福了，因为他们必称为上帝的儿子。”（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L9">太 5:9</a>）</p></li><li><p>“<strong>为义受逼迫的人</strong>有福了，因为天国是他们的。”（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L10">太 5:10</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L22">路 6:22</a>）</p></li><li><p>“<strong>人若因我辱骂你们，逼迫你们，捏造各样坏话毁谤你们</strong>，你们就有福了。应当欢喜快乐，因为你们在天上的赏赐是大的。在你们以前的先知，人也是这样逼迫他们。”（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L11-12">太 5:11-12</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L22-23">路 6:22-23</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L26">路 6:26</a>）</p></li></ol><h2>附带的诫命</h2><ol><li><p>“<strong>你们的仇敌，要爱他</strong>”（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L27">路 6:27</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L44">太 5:44</a>）</p></li><li><p>“<strong>恨你们的，要待他好</strong>！”（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L27">路 6:27</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L44">太 5:44</a>）</p></li><li><p>“<strong>咒诅你们的，要为他祝福</strong>！”（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L28">路 6:28</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L44">太 5:44</a>）</p></li><li><p>“<strong>凌辱你们的，要为他祷告</strong>！”（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L28">路 6:28</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L44">太 5:44</a>）</p></li><li><p>“<strong>有人打你这边的脸，连那边的脸也由他打</strong>。”（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L29">路 6:29</a>）</p></li><li><p>“<strong>有人夺你的外衣，连里衣也由他拿去</strong>。”（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L29">路 6:29</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L40">太 5:40</a>）</p></li><li><p>“<strong>凡求你的，就给他</strong>。”（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L30">路 6:30</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L38">路 6:38</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L42">太 5:42</a>）</p></li><li><p>“<strong>有人夺你的东西去，不用再要回来</strong>。”（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L30">路 6:30</a>）</p></li><li><p>“<strong>你们愿意人怎样待你们，你们也要怎样待人</strong>。”（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L31">路 6:31</a>）</p></li><li><p>“<strong>你们要慈悲，像你们的父慈悲一样</strong>。”（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L36">路 6:36</a>）</p></li><li><p>“<strong>你们不要论断人，就不被论断</strong>”（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L37">路 6:37</a>）</p></li><li><p>“<strong>你们不要定人的罪，就不被定罪</strong>”（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L37">路 6:37</a>）</p></li><li><p>“<strong>你们要饶恕人，就必蒙饶恕</strong>”（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L37">路 6:37</a>）</p></li><li><p>“<strong>你们要给人，就必有给你们的</strong>，并且用十足的升斗，连摇带按，上尖下流地倒在你们怀里；因为你们用什么量器量给人，也必用什么量器量给你们。”（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L38">路 6:38</a>）</p></li><li><p>“为什么看见你弟兄眼中有刺，却不想自己眼中有梁木呢？你不见自己眼中有梁木，怎能对你弟兄说‘容我去掉你眼中的刺’呢？你这假冒为善的人！<strong>先去掉自己眼中的梁木</strong>，然后才能看得清楚，去掉你弟兄眼中的刺。”（<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L41-42">路 6:41-42</a>）</p></li><li><p>“你们听见有吩咐古人的话，说：『不可杀人』，又说，『凡杀人的，难免受审判。』只是我告诉你们：<strong>凡向弟兄动怒的，难免受审判</strong>〔有古卷在『凡』字下添『无缘无故的』五字〕。凡骂弟兄是拉加的，难免公会的审断；凡骂弟兄是魔利的，难免地狱的火。”（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L21-22">太 5:21-22</a>）</p></li><li><p>“所以，你在祭坛上献礼物的时候，若想起弟兄向你怀怨，就把礼物留在坛前，<strong>先去同弟兄和好</strong>，然后来献礼物。<strong>就赶紧与他和息</strong>，恐怕他把你送给审判官，审判官交付衙役，你就下在监里了。我实在告诉你：若有一文钱没有还清，你断不能从那里出来。”（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L23-26">太 5:23-26</a>）</p></li><li><p>“你们听见有话说：『不可奸淫。』只是我告诉你们：<strong>凡看见妇女就动淫念的，这人心里已经与他犯奸淫了</strong>。”（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L27-28">太 5:27-28</a>）</p></li><li><p>“又有话说：『人若休妻，就当给他休书。』只是我告诉你们：<strong>凡休妻的，若不是为淫乱的缘故，就是叫他作淫妇了</strong>；<strong>人若娶这被休的妇人，也是犯奸淫了</strong>。”（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L31-32">太 5:31-32</a>）</p></li><li><p>“你们又听见有吩咐古人的话，说：『不可背誓，所起的誓，总要向主谨守。』只是我告诉你们：<strong>什么誓都不可起</strong>。不可指着天起誓，因为天是上帝的座位；不可指着地起誓，因为地是他的脚凳；也不可指着耶路撒冷起誓，因为耶路撒冷是大君的京城；又不可指着你的头起誓，因为你不能使一根头发变黑变白了。你们的话，是，就说是；不是，就说不是；若再多说，就是出于那恶者。”（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L33-37">太 5:33-37</a>）</p></li><li><p>“你们听见有话说：『以眼还眼，以牙还牙。』只是我告诉你们：<strong>不要与恶人作对</strong>。有人打你的右脸，连左脸也转过来由他打；有人想要告你，要拿你的里衣，连外衣也由他拿去；有人强逼你走一里路，你就同他走二里；有求你的，就给他；有向你借贷的，不可推辞。”（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L38-42">太 5:38-42</a>）</p></li><li><p>“<strong>所以你们要完全，像你们的天父完全一样</strong>。”（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L48">太 5:48</a>）</p></li></ol>
