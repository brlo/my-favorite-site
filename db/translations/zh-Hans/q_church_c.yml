  path: Qc16A_对主教、司祭、辅祭候任者的要求
  title: 对主教、司祭、辅祭候任者的要求
  copy_cover: true
  body: <h2>对比总表</h2><table><tbody><tr><td><strong>提多</strong>（克里特岛，多 1:5）<br>(<a href="https://bibleox.com/zh-Hans/cn-cuv/tit/1/#L5-9">多 1:5-9</a>)</td><td><strong>提摩太</strong>（以弗所城，提前 1:3）<br>(<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/3/#L1-13">提前 3:1-13</a>)</td></tr><tr><td>无可指责</td><td>无可指责；作为上帝的管家，必须无可指责</td></tr><tr><td>只作一个妇人的丈夫</td><td>只作一个妇人的丈夫</td></tr><tr><td>有节制</td><td>自持</td></tr><tr><td>自守</td><td>自守</td></tr><tr><td>端正</td><td>圣洁</td></tr><tr><td>公平</td><td>公义</td></tr><tr><td>乐意接待远人</td><td>乐意接待远人</td></tr><tr><td>善于教导</td><td>坚守所教真实的道理，能将纯正的教训劝化人，又能把争辩的人驳倒</td></tr><tr><td>不因酒滋事</td><td>不因酒滋事</td></tr><tr><td>不打人</td><td>不打人</td></tr><tr><td>不争竞</td><td>不任性</td></tr><tr><td>不贪财，而</td><td>不贪无义之财</td></tr><tr><td>只要温和</td><td>不暴躁</td></tr><tr><td>使人和睦</td><td></td></tr><tr><td>不贪不义之财</td><td></td></tr><tr><td>好好管理自己的家</td><td></td></tr><tr><td>使儿女凡事端庄、顺服；人若不知道管理自己的家，焉能照管上帝的教会呢？</td><td>儿女也是信主的，没有人告他们是放荡不服约束的</td></tr><tr><td>初入教的不可作监督，恐怕他自高自大，就落在魔鬼所受的刑罚里。</td><td></td></tr><tr><td>监督也必须在教外有好名声，恐怕被人毁谤，落在魔鬼的网罗里。</td><td>好善</td></tr></tbody></table><h2>引文</h2><blockquote><p>“『人若想要得<strong><mark>监督</mark></strong>的职分，就是羨慕善工。』这话是可信的。 作监督的，必须无可指责，只作一个妇人的丈夫，有节制，自守，端正，乐意接待远人，善于教导；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/3/#L1-2">提前 3:1-2</a>)</p></blockquote><p>“作监督的，必须”：</p><ul><li><p>无可指责，</p></li><li><p>只作一个妇人的丈夫，</p></li><li><p>有节制，</p></li><li><p>自守，</p></li><li><p>端正，</p></li><li><p>乐意接待远人，</p></li><li><p>善于教导；</p></li><li><p>不因酒滋事，不打人，只要温和，不争竞、不贪财；</p></li><li><p>好好管理自己的家，使儿女凡事端庄、顺服。人若不知道管理自己的家，焉能照管上帝的教会呢？</p></li><li><p>初入教的不可作监督，恐怕他自高自大，就落在魔鬼所受的刑罚里。</p></li><li><p>监督也必须在教外有好名声，恐怕被人毁谤，落在魔鬼的网罗里。（<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/3/#L2-7">提前 3:2-7</a>）</p></li></ul><blockquote><p>“<strong><mark>作执事的也是如此</mark></strong>：必须端庄，不一口两舌，不好喝酒，不贪不义之财； 要存清洁的良心，固守真道的奥祕。 这等人也要先受试验，若没有可责之处，然后叫他们作执事。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/3/#L8-10">提前 3:8-10</a>)</p></blockquote><blockquote><p>“<strong><mark>女执事也是如此</mark></strong>：必须端庄，不说谗言，有节制，凡事忠心。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/3/#L11">提前 3:11</a>)</p></blockquote><blockquote><p>“<strong><mark>执事只要作一个妇人的丈夫</mark></strong>，好好管理儿女和自己的家。 因为善作执事的，自己就得到美好的地步，并且在基督耶稣里的真道上大有胆量。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/3/#L12-13">提前 3:12-13</a>)</p></blockquote><blockquote><p>“我从前留你在革哩底，是要你将那没有办完的事都办整齐了，又照我所吩咐你的，<strong><mark>在各城设立长老</mark></strong>。 若有无可指责的人，只作一个妇人的丈夫，儿女也是信主的，没有人告他们是放荡不服约束的，就可以设立。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/tit/1/#L5-6">多 1:5-6</a>)</p></blockquote><ul><li><p>儿女也是信主的，没有人告他们是放荡不服约束的。</p></li></ul><blockquote><p>“<strong><mark>监督既是上帝的管家</mark></strong>，必须无可指责，不任性、不暴躁、不因酒滋事、不打人、不贪无义之财； 乐意接待远人，好善、庄重、公平、圣洁、自持； <strong><mark>坚守所教真实的道理</mark></strong>，就能将纯正的教训劝化人，又能把争辩的人驳倒了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/tit/1/#L7-9">多 1:7-9</a>)</p></blockquote>
