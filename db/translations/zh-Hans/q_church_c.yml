  title: 再婚
  copy_cover: true
  body: <h2>基督徒的理想</h2><p>基督徒的理想——一生只有一个婚姻。</p><h2>对平信徒的宽免</h2><p>如果妻子或丈夫死了，虽然新的婚姻不受鼓励（因为基督徒相信来生和死人普遍的复活），但作为宽免的措施是允许的——使徒说过这一点，为的是不叫人陷入某种致死的重罪而彻底灭亡：</p><blockquote><p>“我对着没有嫁娶的和<strong>寡妇</strong>说，若他们常像我就好。 倘若自己禁止不住，就可以嫁娶。<strong><mark>与其欲火攻心，倒不如嫁娶为妙</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/7/#L8-9">林前 7:8-9</a>)</p></blockquote><blockquote><p>“所以<strong>我愿意年轻的寡妇嫁人</strong>，生养儿女，治理家务，不给敌人辱骂的把柄，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/5/#L14">提前 5:14</a>)</p></blockquote><p>同样，救主在论到不可离婚时，也为了淫乱（变心）的情形开了例外：</p><blockquote><p>“又有话说：『人若休妻，就当给他休书。』 只是我告诉你们：凡休妻的，<strong>若不是为淫乱的缘故</strong>，就是叫他作淫妇了；人若娶这被休的妇人，也是犯奸淫了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L31-32">太 5:31-32</a>)</p></blockquote><p>这样，如果配偶死了或变了心，新的婚姻是可能的。但仍然不是无限制的，而只是作为宽免的措施，总共只可以有两次。</p><p>循着类似的推理，教会又为此加上了一些别的原因，例如配偶有生命危险等等（[俄文](https://azbyka.ru/otechnik/dokumenty/osnovy-sotsialnoj-kontseptsii-russkoj-pravoslavnoj-tserkvi/#0_10_3)）。</p><h2>司祭应当从只结过一次婚的男士中拣选</h2><p>值得讲一讲这一点，为要看到：守住一个婚姻，确实被认为更是配得的生活方式：</p><blockquote><p>“<strong>作监督的，必须无可指责，只作一个妇人的丈夫</strong>，有节制，自守，端正，乐意接待远人，善于教导；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/3/#L2">提前 3:2</a>)</p></blockquote><blockquote><p>“<strong>执事只要作一个妇人的丈夫</strong>，好好管理儿女和自己的家。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/3/#L12">提前 3:12</a>)</p></blockquote><blockquote><p>“我从前留你在革哩底，是要你将那没有办完的事都办整齐了，又照我所吩咐你的，<strong>在各城设立长老</strong>。 <strong>若有无可指责的人，只作一个妇人的丈夫</strong>，儿女也是信主的，没有人告他们是放荡不服约束的，就可以设立。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/tit/1/#L5-6">多 1:5-6</a>)</p></blockquote>
