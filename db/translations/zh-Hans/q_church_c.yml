- src: анания-и-сапфира
  path: Qc14A_亚拿尼亚与撒非喇
  title: 亚拿尼亚与撒非喇
  copy_cover: true
  body: <p>在教会生活的初期，主特别严格地看顾教会中生活的纯洁。比如，因为企图向教会说谎，一对夫妻（亚拿尼亚与撒非喇）因使徒的一句话当场倒毙：</p><blockquote><p>“有一个人，名叫<strong>亚拿尼亚</strong>，同他的妻子<strong>撒非喇</strong>卖了田产， <strong><mark>把价银私自留下几分</mark></strong>，他的妻子也知道，其余的几分拿来放在使徒脚前。 彼得说：「亚拿尼亚，<strong><mark>为什么撒但充满了你的心，叫你欺哄圣灵，把田地的价银私自留下几分呢</mark></strong>？ 田地还没有卖，不是你自己的吗？既卖了，价银不是你作主吗？你怎么心里起这意念呢？<strong><mark>你不是欺哄人，是欺哄上帝了</mark></strong>！」 <strong><mark>亚拿尼亚听见这话，就仆倒，断了气</mark></strong>。听见的人都甚惧怕。 有些少年人起来，把他包裹，抬出去埋葬了。 约过了三小时，他的妻子进来，还不知道这事。 彼得对她说：「你告诉我，你们卖田地的价银就是这些吗？」她说：「就是这些。」 彼得说：「你们为甚么同心试探主的灵呢？埋葬你丈夫之人的脚已到门口，他们也要把你抬出去。」 <strong><mark>妇人立刻仆倒在彼得脚前，断了气</mark></strong>。<strong><mark>那些少年人进来，见他已经死了，就抬出去，埋在她丈夫旁边</mark></strong>。 全教会和听见这事的人都甚惧怕。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/5/#L1-11">徒 5:1-11</a>)</p></blockquote><p>旧约的教会也是这样。在这个教会生活的初期，有人因干犯安息日的安息而被处死：</p><blockquote><p>“以色列人在旷野的时候，<strong><mark>遇见一个人在安息日捡柴</mark></strong>。 遇见他捡柴的人。就把他带到摩西、亚伦并全会众那里， 将他收在监内，因为当怎样办他，还没有指明。 耶和华吩咐摩西说：「<strong><mark>总要把那人治死</mark></strong>，全会众要在营外用石头把他打死。」 于是全会众将他带到营外，用石头打死他，是照耶和华所吩咐摩西的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/15/#L32-36">民 15:32-36</a>)</p></blockquote><p>后来犹太人虽然屡次干犯安息日（<a href="https://bibleox.com/zh-Hans/cn-cuv/neem/13/#L15-16,18">尼 13:15-16,18</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/iez/20/#L13,16,21,24">结 20:13,16,21,24</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/iez/22/#L8">结 22:8</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/iez/23/#L38">结 23:38</a>），连祭司也一样（<a href="https://bibleox.com/zh-Hans/cn-cuv/iez/22/#L26">结 22:26</a>），但代替立即处死的，却是制止干犯安息日的尝试：</p><blockquote><p>“在安息日的前一日，耶路撒冷城门有黑影的时候，<strong>我就吩咐人将门关锁，不过安息日不准开放</strong>。我又派我几个仆人管理城门，<strong><mark>免得有人在安息日担什么担子进城</mark></strong>。 于是商人和贩卖各样货物的，一两次住宿在耶路撒冷城外。 我就警戒他们说：「你们为何在城外住宿呢？若再这样，我必下手拿办你们。」从此以后，他们在安息日不再来了。 <strong>我吩咐利未人洁净自己，来守城门，使安息日为圣</strong>。我的上帝啊，求你因这事记念我，照你的大慈爱怜恤我。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/neem/13/#L19-22">尼 13:19-22</a>)</p></blockquote><blockquote><p>“耶和华对我如此说：「<strong><mark>你去站在平民的门口</mark></strong>，就是犹大君王出入的门，又站在耶路撒冷的各门口， 对他们说：『你们这犹大君王和犹大众人，并耶路撒冷的一切居民，凡从这些门进入的，<strong>都当听耶和华的话</strong>。 耶和华如此说：<strong><mark>你们要谨慎，不要在安息日担什么担子进入耶路撒冷的各门</mark></strong>； <strong><mark>也不要在安息日从家中担出担子去</mark></strong>。无论何工都不可作，只要以安息日为圣日，正如我所吩咐你们列祖的。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ier/17/#L19-22">耶 17:19-22</a>)</p></blockquote>
  meta_desc: 关于对亚拿尼亚与撒非喇之刑罚的理解的圣经引文
