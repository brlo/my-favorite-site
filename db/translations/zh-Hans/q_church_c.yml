  title: 圣殿——天上实体的象征
  copy_cover: true
  body: <h2>看不见者的看得见之像</h2><h3>宇宙</h3><p>上帝创造世界，为要叫人由看得见的认识看不见的：人通过观看看得见的受造物，认识那看不见的造物主：</p><blockquote><p>“<strong>上帝的事情，人所能知道的，原显明在人心里</strong>，因为<strong>上帝已经给他们显明</strong>。 自从造天地以来，上帝的永能和神性是明明可知的，虽是<strong>眼不能见</strong>，但<strong>借着所造之物就可以晓得</strong>，叫人无可推诿。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/1/#L19-20">罗 1:19-20</a>)</p></blockquote><h3>圣殿</h3><p>看得见的地上的圣殿，是看不见的天上实体的像。先知得到命令：要照在山上所指示的样式建造圣殿：</p><blockquote><p>“又当为我<strong>造圣所</strong>，使我可以住在他们中间。 制造帐幕和其中的一切器具，<strong>都要照我所指示你的样式</strong>。 &lt;…&gt; 要谨慎作这些物件，都<strong>要照着在山上指示你的样式</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/25/#L8-9,40">出 25:8-9,40</a>)</p></blockquote><p>使徒指出，圣殿是按真圣所的像建造的：</p><blockquote><p>“因为基督并不是进了<strong><mark>人手所造的圣所（这不过是真圣所的影像）</mark></strong>，乃是进了天堂，如今为我们显在上帝面前；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/9/#L24">希 9:24</a>)</p></blockquote><blockquote><p>“我们的祖宗在旷野有<strong>法柜的帐幕</strong>，是上帝吩咐摩西叫他<strong>照所看见的样式</strong>作的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/7/#L44">徒 7:44</a>)</p></blockquote><h2>旧约——圣殿里只有上帝和天使</h2><h3>看不见的上帝</h3><p>在按上帝命令建造的旧约圣殿里，最首要的地方只立着约柜（柜子），柜里放着圣物；在柜的施恩座上、二基路伯中间，上帝显现并说话：</p><blockquote><p>“我要在那里与你相会，又要<strong><mark>从法柜施恩座上，二基路伯中间</mark></strong>，和你说我所要吩咐你传给以色列人的一切事。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/25/#L22">出 25:22</a>)</p></blockquote><h3>圣洁的天使</h3><p>圣殿里到处布满天使（基路伯）的像</p><h4>约柜施恩座上的基路伯</h4><blockquote><p>“要<strong>用金子锤出两个基路伯</strong>来，<strong>安在施恩座的两头</strong>。 这头作一个基路伯，那头作一个基路伯。二基路伯要接连一块，在施恩座的两头。 二基路伯要高张翅膀，遮掩施恩座。基路伯要脸对脸，朝着施恩座。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/25/#L18-20">出 25:18-20</a>)</p></blockquote><h4>约柜左右的基路伯</h4><blockquote><p>“他<strong>用橄榄木作两个基路伯</strong>，各高十肘，安在内殿。 &lt;…&gt; 他将两个基路伯<strong>安在内殿里</strong>。基路伯的翅膀是张开的，这基路伯的一个翅膀挨着这边的墙，那基路伯的一个翅膀挨着那边的墙，里边的两个翅膀，在殿中间彼此相接。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L23,27">王上 6:23,27</a>)</p></blockquote><h4>幔子上的基路伯</h4><blockquote><p>“又用蓝色、紫色、朱红色线和细麻<strong>织幔子</strong>，在其上<strong>绣出基路伯来</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2par/3/#L14">代下 3:14</a>; <a href="https://bibleox.com/zh-Hans/cn-sb/1mak/1/#L22">加上 1:22</a>)</p></blockquote><h4>圣殿墙上的基路伯</h4><blockquote><p>“内殿外殿周围的墙上，<strong>都刻着基路伯</strong>、棕树和初开的花。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/3ts/6/#L29">王上 6:29</a>)</p></blockquote><p>关于圣殿构造的详情：<a href="https://bibleox.com/ru/ru/w/иерусалимский-храм">耶路撒冷圣殿</a></p><h2>新约——圣殿里有上帝、天使和义人的灵魂</h2><h3>天上的实体改变了</h3><p>上帝成了肉身，成为看得见的，受苦，复活，升天，并<strong>以看得见的</strong>方式登基（<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/16/#L19">可 16:19</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/1/#L20-21">弗 1:20-21</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/3/#L21">启 3:21</a>）。</p><h3>基督上帝</h3><blockquote><p>“主耶稣和他们说完了话，后来被接到天上，<strong><mark>坐在上帝的右边</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/16/#L19">可 16:19</a>)</p></blockquote><blockquote><p>“就是照他在基督身上所运行的大能大力，使他从死里复活，<strong><mark>叫他在天上坐在自己的右边</mark></strong>， 远超过一切执政的、掌权的、有能的、主治的和一切有名的，不但是今世的，连来世的也都超过了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/1/#L20-21">弗 1:20-21</a>)</p></blockquote><blockquote><p>“得胜的，我要赐他<strong>在我宝座上</strong>与我同坐，就如我得了胜，<strong><mark>在我父的宝座上与他同坐</mark></strong>一般。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/3/#L21">启 3:21</a>)</p></blockquote><h3>圣洁的天使</h3><blockquote><p>“另有一位<strong>天使</strong>拿着金香炉，来站在祭坛旁边。有许多香赐给他，要和众圣徒的祈祷一同献在宝座前的金坛上。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/8/#L3">启 8:3</a>)</p></blockquote><blockquote><p>“那掌管七灾的<strong>七位天使</strong>从殿中出来，穿着洁白光明的细麻衣，胸间束着金带。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/15/#L6">启 15:6</a>)</p></blockquote><h3>圣洁义人的灵魂</h3><blockquote><p>“揭开第五印的时候，我看见<strong>在祭坛底下，有为上帝的道并为作见证被杀之人的灵魂</strong>， 大声喊着说：「圣洁真实的主啊！你不审判住在地上的人，给我们伸流血的冤，要等到几时呢？」 于是有<strong>白衣</strong>赐给他们各人，又有话对他们说：「还要安息片时，等着一同作仆人的和他们的弟兄，<strong>也像他们被杀，满足了数目</strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/6/#L9-11">启 6:9-11</a>)</p></blockquote><blockquote><p>“我又观看，见<strong>羔羊</strong>站在锡安山，同他又有<strong>十四万四千人</strong>，都有他的名和他父的名写在额上。 &lt;…&gt; 他们在宝座前，并在四活物和众长老前唱歌，仿佛是新歌；除了<strong>从地上买来的</strong>那十四万四千人以外，没有人能学这歌。 这些人<strong>未曾沾染妇女</strong>，他们原是童身。<strong>羔羊无论往那里去，他们都跟随他</strong>。他们是从人间买来的，作初熟的果子归与上帝和羔羊。 在他们口中察不出谎言来，他们是没有瑕疵的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/14/#L1,3-5">启 14:1,3-5</a>)</p></blockquote><h3>唱诗</h3><blockquote><p>“忽然，有一大队天兵同那天使赞美上帝说： 「在至高之处荣耀归与上帝！在地上平安归与他所喜悦的人〔有古卷作『喜悦归与人』〕！」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/2/#L13-14">路 2:13-14</a>)</p></blockquote><blockquote><p>“我又观看，见<strong>羔羊</strong>站在锡安山，同他又有<strong>十四万四千人</strong>，都有他的名和他父的名写在额上。 &lt;…&gt; 他们在宝座前，并在四活物和众长老前唱歌，<strong>仿佛是新歌</strong>；除了从地上买来的那十四万四千人以外，没有人能学这歌。 这些人未曾沾染妇女，他们原是童身。羔羊无论往那里去，他们都跟随他。他们是从人间买来的，作初熟的果子归与上帝和羔羊。 在他们口中察不出谎言来，他们是没有瑕疵的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/14/#L1,3-5">启 14:1,3-5</a>)</p></blockquote><h3>量度天上圣殿的命令</h3><blockquote><p>“起来，将<strong><mark>上帝的殿</mark></strong>和祭坛，并在殿中礼拜的人都量一量。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/11/#L1">启 11:1</a>)</p></blockquote><h3>宝座</h3><blockquote><p>“那二十四位长老就俯伏在<strong>坐宝座的面前</strong>，敬拜那活到永永远远的，又把他们的冠冕放在宝座前，说：” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/4/#L10">启 4:10</a>)</p></blockquote><blockquote><p>“在上帝面前，坐在自己位上的二十四位长老，就面伏于地敬拜上帝，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/11/#L16">启 11:16</a>)</p></blockquote><h3>祭坛</h3><blockquote><p>“另有一位天使拿着金香炉，来站在<strong>祭坛旁边</strong>。有许多香赐给他，要和众圣徒的祈祷一同献在<strong>宝座前</strong>的<strong>金坛</strong>上。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/8/#L3">启 8:3</a>)</p></blockquote><blockquote><p>“天使拿着香炉，盛满了<strong>坛上的火</strong>，倒在地上，随有雷轰、大声、闪电、地震。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/8/#L5">启 8:5</a>)</p></blockquote><blockquote><p>“第六位天使吹号，我就听见有声音从上帝面前<strong>金坛</strong>的四角出来，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/9/#L13">启 9:13</a>)</p></blockquote><h3>七灯</h3><blockquote><p>“有闪电、声音、雷轰从宝座中发出。又有<strong>七盏火灯</strong>在<strong>宝座前</strong>点着，这七灯就是上帝的七灵。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/4/#L5">启 4:5</a>)</p></blockquote><h3>上香</h3><blockquote><p>“另有一位天使拿着<strong>金香炉</strong>，来站在祭坛旁边。<strong>有许多香</strong>赐给他，要和众圣徒的祈祷一同献在宝座前的金坛上。 &lt;…&gt; <strong>天使拿着香炉</strong>，盛满了坛上的火，倒在地上，随有雷轰、大声、闪电、地震。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/8/#L3,5">启 8:3,5</a>)</p></blockquote><h3>里昂的爱任纽（二世纪）论圣殿是天上的实体的象征</h3><p>圣殿按天上实体之像的建造，由圣里昂的爱任纽（二世纪）所证实。爱任纽引用神学家约翰的启示录，说地上的事物作天上事物的像是合宜的——这些天上的事物也是由同一位上帝所造：</p><p>“所以，正如他[上帝]在这些事[祭物]上并无所缺，却愿意我们为自己而行这些事，免得我们不结果子；同样，圣言也把关于祭物的诫命赐给了（犹太）民族，虽然他并不需要它们，为要叫他们学习事奉上帝；基于同样的原因，他愿意<strong>我们也常常、按时地把礼物带到祭坛前</strong>。</p><p>这样，<strong>在天上有祭坛</strong>，因为我们的祈祷和献礼是朝那里去的；也有<strong>圣殿</strong>，正如约翰在启示录里所说：‘天上上帝的殿开了’（启 11:19），还有帐幕：‘看哪，上帝的帐幕在人中间，他要与人同住’（启 21:3）。祭物、献礼和一切祭品，（犹太）民族是按预像领受的，正如摩西在山上所受的指示——是来自同一位上帝，他的名如今在教会里、在万民中被称颂。但是，<strong>在我们周围所安排的地上的事物，作天上事物的像是合宜的</strong>——这些天上的事物也是由同一位上帝所造。<strong>否则，他就无法把属灵事物的相似之物拉近到我们的悟性面前</strong>。”</p><p>（[俄文](https://azbyka.ru/otechnik/Irinej_Lionskij/protiv-eresej/4)《驳异端》卷四，第18-19章）</p><h2>上帝命令敬重圣殿</h2><p>圣殿——<a href="https://bibleox.com/ru/ru/w/храм-образ-небесной-реальности">天上实体的像</a>。上帝命令敬重这像：</p><blockquote><p>“你们要守我的安息日，<strong>敬我的圣所</strong>。我是耶和华。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/19/#L30">利 19:30</a>)</p></blockquote><blockquote><p>“你们要守我的安息日，<strong>敬我的圣所</strong>。我是耶和华。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/26/#L2">利 26:2</a>)</p></blockquote><p>新约的圣殿，是按神学家约翰的启示录里的像建造的。</p>
