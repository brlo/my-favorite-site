- src: Церковь-возвышение-над-миром
  path: Qc7A_教会——超越世界
  title: 教会——超越世界
  copy_cover: true
  body: <blockquote><p>“<strong><mark>不要爱世界和世界上的事</mark></strong>。人若爱世界，爱父的心就不在他里面了。 因为凡世界上的事，就像<strong><mark>肉体的情欲，眼目的情欲，并今生的骄傲</mark></strong>，都不是从父来的，乃是从世界来的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/2/#L15-16">约壹 2:15-16</a>)</p></blockquote><blockquote><p>“你们既作顺命的儿女，就<strong><mark>不要效法从前蒙昧无知的时候那放纵私欲的样子</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/1/#L14">彼前 1:14</a>)</p></blockquote><p>必须追求上帝的样式，而不是这个时代的样式：</p><blockquote><p>“<strong><mark>不要效法这个世界</mark></strong>，只要心意更新而变化，叫你们<strong><mark>察验何为上帝的善良、纯全、可喜悦的旨意</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/12/#L2">罗 12:2</a>)</p></blockquote>
  meta_desc: 教会在传福音的同时，必须保持与世界分别为圣
