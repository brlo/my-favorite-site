- src: церковь-епископы-равны
  path: Qc6A_教会——主教们是平等的
  title: 教会——主教们是平等的
  copy_cover: true
  body: <p>使徒和主教们彼此平等。使徒们常常争论谁为大。基督指示他们不要寻求彼此辖管的权柄：</p><blockquote><p>“<strong>门徒中间起了议论，谁将为大</strong>。 &lt;…&gt; 对他们说：「凡为我名接待这小孩子的，就是接待我；凡接待我的，就是接待那差我来的。<strong><mark>你们中间最小的，他便为大</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/9/#L46,48">路 9:46,48</a>)</p></blockquote><blockquote><p>“<strong>门徒起了争论</strong>，他们中间那一个可算为大。 耶稣说：「外邦人有君王为主治理他们，那掌权管他们的称为恩主。 <strong><mark>但你们不可这样</mark></strong>。<strong><mark>你们里头为大的，倒要像年幼的</mark></strong>；<strong><mark>为首领的，倒要像服事人的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/22/#L24-26">路 22:24-26</a>)</p></blockquote><blockquote><p>“门徒不作声，因为他们<strong><mark>在路上彼此争论谁为大</mark></strong>。 耶稣坐下，叫十二个门徒来，说：「<strong><mark>若有人愿意作首先的，他必作众人末后的，作众人的用人</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/9/#L34-35">可 9:34-35</a>)</p></blockquote><p>当使徒雅各和约翰求基督在他的国里坐在他左右的时候，其余的使徒就恼怒他们。基督指示他们所有的人，不要寻求彼此辖管的权柄：</p><blockquote><p>“耶稣叫了他们来，说：「你们知道外邦人有君王为主治理他们，有大臣操权管束他们。 <strong><mark>只是在你们中间不可这样</mark></strong>。你们中间谁愿为大，就必作你们的用人； 谁愿为首，就必作你们的仆人。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/20/#L25-27">太 20:25-27</a>)</p></blockquote><p>这里也是一样（<a href="https://bibleox.com/zh-Hans/cn-cuv/mk/10/#L41-44">可 10:41-44</a>）。与所有其他正教会分离的罗马教会，引用使徒彼得的特殊权柄：</p><blockquote><p>“我要把天国的钥匙给你，<strong><mark>凡你在地上所捆绑的，在天上也要捆绑</mark></strong>；凡你在地上所释放的，在天上也要释放。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/16/#L19">太 16:19</a>)</p></blockquote><p>但这权柄赐给了所有使徒：</p><blockquote><p>“我实在告诉你们：<strong><mark>凡你们在地上所捆绑的，在天上也要捆绑</mark></strong>；凡你们在地上所释放的，在天上也要释放。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/18/#L18">太 18:18</a>)</p></blockquote><blockquote><p>“就向他们吹一口气，说：「你们受圣灵。 <strong><mark>你们赦免谁的罪，谁的罪就赦免了</mark></strong>；你们留下谁的罪，谁的罪就留下了。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/20/#L22-23">约 20:22-23</a>)</p></blockquote><p>值得注意的是，主恰恰是给使徒彼得洗脚（随后也给其余的人洗），以身作则，警戒他们不要贪恋权柄：</p><blockquote><p>“<strong>我是你们的主，你们的夫子，尚且洗你们的脚</strong>，你们也当彼此洗脚。 <strong><mark>我给你们作了榜样，叫你们照着我向你们所作的去做</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/13/#L14-15">约 13:14-15</a>)</p></blockquote><p>后来，使徒保罗当众责备使徒彼得（<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/2/#L11">加 2:11</a>）；在耶路撒冷第一次使徒会议上主持的是使徒雅各（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/15/#L13,19">徒 15:13,19</a>）；而使徒彼得设立主教，不仅是在罗马，也在例如安提阿。</p><p>使徒们的门徒写道，主教们是使徒的继任者。凡属于使徒的，也属于主教。使徒门徒和古代基督徒论此的引文：<a href="https://bibleox.com/ru/ru/w/qeuY_Епископы__преемники_апостолов">主教——使徒的继任者</a></p>
  meta_desc: 关于主教们彼此平等的圣经引文
