  path: Qc1A_教会
  title: 教会
  copy_cover: true
  body: <h2>定义：教会——基督的身体</h2><blockquote><p>“又将万有服在他的脚下，使他<strong>为教会作万有之首</strong>。 <strong><mark>教会是他的身体</mark></strong>，是那充满万有者所充满的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/1/#L22-23">弗 1:22-23</a>)</p></blockquote><blockquote><p>“<strong><mark>你们就是基督的身子</mark></strong>，并且各自作肢体。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/12/#L27">林前 12:27</a>)</p></blockquote><blockquote><p>“<strong>岂不知你们的身子是基督的肢体吗</strong>？我可以将基督的肢体作为娼妓的肢体吗？断乎不可！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/6/#L15">林前 6:15</a>)</p></blockquote><blockquote><p>“正如我们一个身子上有好些肢体，肢体也不都是一样的用处。 <strong>我们这许多人，在基督里</strong><strong><mark>成为一身</mark></strong>，互相联络作肢体，也是如此。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/12/#L4-5">罗 12:4-5</a>)</p></blockquote><blockquote><p>“现在我为你们受苦，倒觉欢乐，并且为<strong><mark>基督的身体</mark></strong>，<strong><mark>就是为教会</mark></strong>，要在我肉身上补满<strong>基督患难的缺欠</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/1/#L24">西 1:24</a>)</p></blockquote><blockquote><p>“从来没有人恨恶自己的身子，总是保养顾惜，正像<strong>基督待教会</strong>一样， <strong><mark>因我们是他身上的肢体</mark></strong>〔有古卷在此有『就是他的骨、他的肉』〕。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/5/#L29-30">弗 5:29-30</a>)</p></blockquote><blockquote><p>“又要叫基督的平安在你们心里作主，<strong>你们也为此蒙召</strong>，<strong><mark>归为一体</mark></strong>．且要存感谢的心。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/3/#L15">西 3:15</a>)</p></blockquote><h2>加入身体（教会）</h2><h3>洗礼</h3><blockquote><p>“我们不拘是犹太人，是希利尼人，是为奴的，是自主的，<strong>都从一位圣灵</strong><strong><mark>受洗，成了一个身体</mark></strong>，饮于一位圣灵。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/12/#L13">林前 12:13</a>)</p></blockquote><h3>领受圣体</h3><blockquote><p>“我们所祝福的杯，岂不是同领基督的血吗？我们所擘开的<strong>饼</strong>，岂不是<strong><mark>同领基督的身体</mark></strong>吗？ <strong>我们虽多，仍是一个饼、一个身体，因为我们都是分受这一个饼</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/10/#L16-17">林前 10:16-17</a>)</p></blockquote><h2>基督——身体（教会）的救主</h2><blockquote><p>“因为丈夫是妻子的头，如同<strong>基督是教会的头</strong>，他又是<strong><mark>教会全体的救主</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/5/#L23">弗 5:23</a>)</p></blockquote><blockquote><p>“<strong><mark>你们要常在我里面</mark></strong>，我也常在你们里面。<strong>枝子若不常在葡萄树上，自己就不能结果子</strong>；<strong>你们若不常在我里面，也是这样</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/15/#L4">约 15:4</a>)</p></blockquote><h3>基督把得救的人带进教会</h3><blockquote><p>“赞美上帝，得众民的喜爱。<strong><mark>主</mark></strong>将<strong><mark>得救的人天天加给他们</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/2/#L47">徒 2:47</a>) <em>(和合本此处无“归给教会”的字样)</em></p></blockquote><p>好撒玛利亚人的比喻中，那怜悯人的撒玛利亚人是基督救人的预像。他为伤者包裹伤口，把他带到客店（教会），并把照应他痊愈（得救）的事托付给客店：</p><blockquote><p>“有一个人从耶路撒冷下耶利哥去，落在强盗手中。他们剥去他的衣裳，把他打个半死，就丢下他走了。 &lt;…&gt; 惟有一个<strong><mark>撒玛利亚人</mark></strong>行路来到那里，看见他就动了慈心， <strong><mark>上前用油和酒倒在他的伤处，包裹好了</mark></strong>，<strong>扶他骑上自己的牲口，带到店里去照应他</strong>。 第二天拿出二钱银子来，交给店主，说：『你且<strong>照应他</strong>．此外所费用的，我回来必还你。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/10/#L30,33-35">路 10:30,33-35</a>)</p></blockquote><h2>教会的构成</h2><h3>身体的头——基督</h3><blockquote><p>“<strong>他也是教会全体之首</strong>，他是元始，是从死里首先复生的，使他可以在凡事上居首位。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/1/#L18">西 1:18</a>)</p></blockquote><blockquote><p>“又将万有服在他的脚下，使他<strong>为教会作万有之首</strong>。 <strong>教会是他的身体</strong>，是那充满万有者所充满的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/1/#L22-23">弗 1:22-23</a>)</p></blockquote><blockquote><p>“<strong>不持定元首</strong>。全身既然靠着他，筋节得以相助联络，就因上帝大得长进。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/2/#L19">西 2:19</a>)</p></blockquote><h3>身体里没有别的头，只有基督</h3><p>使徒和主教们彼此平等。使徒们常常争论谁为大。基督指示他们不要寻求彼此辖管的权柄（详见<a href="https://bibleox.com/ru/ru/w/церковь-епископы-равны">教会——主教们是平等的</a>）：</p><blockquote><p>“<strong>门徒起了争论</strong>，他们中间那一个可算为大。 耶稣说：「外邦人有君王为主治理他们，那掌权管他们的称为恩主。 <strong><mark>但你们不可这样</mark></strong>。<strong><mark>你们里头为大的，倒要像年幼的</mark></strong>；<strong><mark>为首领的，倒要像服事人的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/22/#L24-26">路 22:24-26</a>)</p></blockquote><h3>身体的肢体各不相同</h3><blockquote><p>“上帝在教会所设立的：第一是<strong>使徒</strong>，第二是<strong>先知</strong>，第三是<strong>教师</strong>，其次是<strong>行异能的</strong>，再次是得恩赐<strong>医病的</strong>，帮助人的，治理事的，<strong>说方言的</strong>。 岂都是使徒吗？岂都是先知吗？岂都是教师吗？岂都是行异能的吗？ 岂都是得恩赐医病的吗？岂都是说方言的吗？岂都是<strong>繙方言的</strong>吗？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/12/#L28-30">林前 12:28-30</a>)</p></blockquote><blockquote><p>“<strong><mark>身子原不是一个肢体，乃是许多肢体</mark></strong>。 设若脚说：「我不是手，所以不属乎身子。」它不能因此就不属乎身子。 设若耳说：「我不是眼，所以不属乎身子。」它也不能因此就不属乎身子。 若全身是眼，从哪里听声呢？若全身是耳，从哪里闻味呢？ 但如今上帝随自己的意思把肢体俱各安排在身上了。 若都是一个肢体，身子在那里呢？ <strong>但如今肢体是多的，身子却是一个</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/12/#L14-20">林前 12:14-20</a>)</p></blockquote><h2>地上教会与天上教会的合一（基督的一个身体）</h2><h3>天上的与地上的在基督里联合</h3><blockquote><p>“愿颂赞归与我们主耶稣基督的父上帝！他在基督里曾赐给我们天上各样属灵的福气。 &lt;…&gt; 都是照他自己所预定的美意，叫我们知道他旨意的奥祕， 要照所安排的，在日期满足的时候，<strong><mark>使天上地上一切所有的，都在基督里面同归于一</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/1/#L3,9-10">弗 1:3,9-10</a>)</p></blockquote><blockquote><p>“因此，我在父面前屈膝， （<strong><mark>天上地上的各家</mark></strong>，都是<strong>从他得名</strong>。）” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/3/#L14-15">弗 3:14-15</a>)</p></blockquote><blockquote><p>“他也是教会全体之首，他是元始，是从死里首先复生的，使他可以在凡事上居首位。 因为父喜欢叫<strong>一切的丰盛在他里面居住</strong>。 既然借着他在十字架上所流的血成就了和平，便借着他叫万有，<strong><mark>无论是地上的、天上的</mark></strong>，都与自己和好了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/1/#L18-20">西 1:18-20</a>)</p></blockquote><blockquote><p>“因此<strong><mark>基督</mark></strong>死了，又活了，<strong><mark>为要作死人并活人的主</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/14/#L9">罗 14:9</a>)</p></blockquote><h3>所有肢体彼此联络、彼此相顾</h3><p>整个身体以种种联络互相结合：</p><blockquote><p>“惟用爱心说诚实话，凡事长进，连于元首基督。 <strong>全身都靠他联络得合式，百节各按各职，照着各体的功用彼此相助</strong>，便叫身体渐渐增长，在爱中建立自己。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/4/#L15-16">弗 4:15-16</a>)</p></blockquote><blockquote><p>“不持定元首。<strong><mark>全身既然靠着他，筋节得以相助联络</mark></strong>，就因上帝大得长进。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/2/#L18-19">西 2:18-19</a>)</p></blockquote><p>它的所有肢体彼此认识、彼此相顾：</p><blockquote><p>“但如今上帝随自己的意思把<strong>肢体俱各安排在身上</strong>了。 若都是一个肢体，身子在那里呢？ 但如今<strong>肢体是多的，身子却是一个</strong>。 眼不能对手说：「我用不着你。」头也不能对脚说：「我用不着你。」 不但如此，身上肢体，人以为软弱的，更是不可少的。 身上肢体，我们看为不体面的，越发给它加上体面；不俊美的，越发得着俊美。 我们俊美的肢体，自然用不着装饰；但上帝配搭这身子，把加倍的体面给那有缺欠的肢体， <strong><mark>免得身上分门别类</mark></strong>，<strong><mark>总要肢体彼此相顾</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/12/#L18-25">林前 12:18-25</a>)</p></blockquote><h3>在地上，教会是争战的</h3><blockquote><p>“<strong><mark>务要谨守、儆醒</mark></strong>，因为<strong><mark>你们的仇敌魔鬼，如同吼叫的狮子，遍地游行，寻找可吞吃的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/5/#L8">彼前 5:8</a>)</p></blockquote><blockquote><p>“要穿戴上帝所赐的全副军装，<strong>就能抵挡魔鬼的诡计</strong>。 因我们并不是与属血气的争战，乃是与那些执政的、掌权的、管辖这幽暗世界的，以及<strong><mark>天空属灵气的恶魔</mark></strong>争战。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/6/#L11-12">弗 6:11-12</a>)</p></blockquote><blockquote><p>“<strong><mark>我们在这里本没有常存的城</mark></strong>，乃是寻求那将来的城。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/13/#L14">希 13:14</a>)</p></blockquote><h3>在天上，教会是得胜的</h3><blockquote><p>“你们乃是来到锡安山，永生上帝的城邑，就是<strong>天上的耶路撒冷</strong>。那里有千万的天使， 有名录在天上<strong><mark>诸长子之会所共聚的总会</mark></strong>，有审判众人的上帝和<strong>被成全之义人的灵魂</strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/12/#L22-23">希 12:22-23</a>)</p></blockquote><h2>教会是看得见的</h2><p>她不能向人隐藏</p><blockquote><p>“你们是世上的光。<strong><mark>城造在山上，是不能隐藏的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L14">太 5:14</a>)</p></blockquote><p>上帝安置身体（教会）的肢体，为使身体没有分裂，而是彼此相顾，同受苦，同快乐：</p><blockquote><p>“我们不拘是犹太人，是希利尼人，是为奴的，是自主的，<strong>都从一位圣灵受洗，成了一个身体</strong>，饮于一位圣灵。 <strong><mark>身子原不是一个肢体，乃是许多肢体</mark></strong>。 &lt;…&gt; <strong><mark>眼不能对手说</mark></strong>：「我用不着你。」头也不能对脚说：「我用不着你。」 不但如此，身上肢体，人以为软弱的，更是不可少的。 身上肢体，我们看为不体面的，越发给它加上体面；不俊美的，越发得着俊美。 我们俊美的肢体，自然用不着装饰；但<strong><mark>上帝配搭这身子</mark></strong>，把加倍的体面给那有缺欠的肢体， <strong><mark>免得身上分门别类</mark></strong>，<strong><mark>总要肢体彼此相顾</mark></strong>。 <strong><mark>若一个肢体受苦，所有的肢体就一同受苦</mark></strong>；若一个肢体得荣耀，所有的肢体就一同快乐。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/12/#L13-14,21-26">林前 12:13-14,21-26</a>)</p></blockquote><p>整个身体以种种联络互相结合：</p><blockquote><p>“惟用爱心说诚实话，凡事长进，连于元首基督。 <strong>全身都靠他联络得合式，百节各按各职，照着各体的功用彼此相助</strong>，便叫身体渐渐增长，在爱中建立自己。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/4/#L15-16">弗 4:15-16</a>)</p></blockquote><blockquote><p>“不持定元首。<strong><mark>全身既然靠着他，筋节得以相助联络</mark></strong>，就因上帝大得长进。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/2/#L18-19">西 2:18-19</a>)</p></blockquote><p>可以向教会请求审判：</p><blockquote><p>“倘若你的弟兄得罪你，你就去趁着只有他和你在一处的时候，指出他的错来。他若听你，你便得了你的弟兄； &lt;…&gt; 若是不听他们，就<strong><mark>告诉教会</mark></strong>；<strong><mark>若是不听教会，就看他像外邦人和税吏一样</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/18/#L15,17">太 18:15,17</a>)</p></blockquote><p>关于教会的边界，详见<a href="https://bibleox.com/ru/ru/w/Церковь-видимое-единство">教会——看得见的合一</a>。</p><h2>教会是不可战胜的</h2><h3>教会不能被战胜</h3><blockquote><p>“我要把我的教会建造在这磐石上，<strong>阴间的权柄</strong><strong><mark>不能胜过他</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/16/#L18">太 16:18</a>)</p></blockquote><h3>上帝始终与教会同在</h3><blockquote><p>“我要求父，父就另外赐给你们一位保惠师，叫他<strong><mark>永远与你们同在</mark></strong>；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/14/#L16">约 14:16</a>)</p></blockquote><blockquote><p>“凡我所吩咐你们的，都教训他们遵守，<strong><mark>我就常与你们同在</mark></strong>，<strong><mark>直到世界的末了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/28/#L20">太 28:20</a>)</p></blockquote><h3>教会永远荣耀上帝</h3><blockquote><p>“但愿他<strong><mark>在教会中</mark></strong>，并在基督耶稣里，得着荣耀，<strong><mark>直到世世代代</mark></strong>，<strong><mark>永永远远</mark></strong>。阿们。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/3/#L21">弗 3:21</a>)</p></blockquote><h3>真理永远在教会里</h3><blockquote><p>“作长老的，写信给蒙拣选的太太和她的儿女，就是我诚心所爱的；不但我爱，也是一切知道真理之人所爱的。 爱你们是为<strong><mark>真理的缘故</mark></strong>，<strong><mark>这真理存在我们里面，也必永远与我们同在</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2in/1/#L1-2">约贰 1:1-2</a>)</p></blockquote><h2>教会的旗帜——十字架</h2><p>在旧约里，以色列人在前往应许之地的路上，行军的队形是十字形：详见<a href="https://bibleox.com/ru/ru/w/еврейский-стан-крест">以色列的营阵——十字形</a>。古代的以色列是基督教会的预像——<a href="https://bibleox.com/ru/ru/w/церковь-новый-израиль">新的以色列</a>。这样，十字架就成了教会主要的旗帜、得胜的象征、和好的象征、祭坛（即伟大的圣物）：详见<a href="https://bibleox.com/ru/ru/w/крест#HH-Крест--орудие-победы-и-примирения">关于十字架的详情</a>。</p><p>古代基督徒画十字圣号的做法：<a href="https://bibleox.com/ru/ru/w/крестное-знамение">十字圣号</a></p><h2>教会建立之日——基督复活后的第50天</h2><ol><li><p>人藉洗礼进入教会（<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/12/#L13">林前 12:13</a>）。</p></li><li><p>洗礼是用水和圣灵施行的（<a href="https://bibleox.com/zh-Hans/cn-cuv/in/3/#L3,5-6">约 3:3,5-6</a>）。</p></li><li><p>圣灵的洗礼首次施行于基督复活后的第50天（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/1/#L1-5,8-9">徒 1:1-5,8-9</a>）。</p></li></ol><h3>人藉洗礼进入教会</h3><blockquote><p>“我们不拘是犹太人，是希利尼人，是为奴的，是自主的，<strong>都从一位圣灵</strong><strong><mark>受洗，成了一个身体</mark></strong>，饮于一位圣灵。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/12/#L13">林前 12:13</a>)</p></blockquote><blockquote><p>“你们<strong>受洗归入基督的，都是披戴基督了</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/3/#L27">加 3:27</a>)</p></blockquote><h3>洗礼——从水和圣灵而生</h3><blockquote><p>“人若不是<strong><mark>从水和圣灵生的</mark></strong>，就<strong>不能进上帝的国</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/3/#L5">约 3:5</a>)</p></blockquote><h3>基督将用圣灵施洗</h3><blockquote><p>“约翰说：「我是用水给你们施洗，但<strong>有一位能力比我更大的要来</strong>，我就是给他解鞋带也不配。<strong><mark>他要用圣灵与火给你们施洗</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/3/#L16">路 3:16</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/mf/3/#L11">太 3:11</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/mk/1/#L8">可 1:8</a>)</p></blockquote><h3>基督不去，圣灵不来</h3><blockquote><p>“然而我将真情告诉你们：我去是与你们有益的。<strong>我若不去，保惠师就不到你们这里来</strong>；我若去，就差他来。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/16/#L7">约 16:7</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/in/14/#L16">约 14:16</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/in/14/#L26">约 14:26</a>)</p></blockquote><blockquote><p>“但我要<strong><mark>从父那里差保惠师来</mark></strong>，就是从父出来真理的圣灵，他来了，就要为我作见证。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/15/#L26">约 15:26</a>)</p></blockquote><blockquote><p>“我要将我父所应许的降在你们身上，<strong><mark>你们要在城里等候，直到你们领受从上头来的能力</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/24/#L49">路 24:49</a>)</p></blockquote><h3>基督复活之后还未升到父那里去</h3><blockquote><p>“耶稣说：「不要摸我，因<strong><mark>我还没有升上去见我的父</mark></strong>。你往我弟兄那里去，告诉他们说，我要升上去见我的父，也是你们的父；见我的上帝，也是你们的上帝。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/20/#L17">约 20:17</a>)</p></blockquote><h3>基督所应许的，在复活后的第50天成就</h3><p>所应许的圣灵的洗礼，在基督复活50天后首次成就：</p><blockquote><p>“提阿非罗啊，我已经作了前书，论到耶稣开头一切所行所教训的， 直到他借着圣灵吩咐所拣选的使徒，以后被接上升的日子为止。 他受害之后，用许多的凭据将自己活活的显给使徒看，<strong><mark>四十天之久向他们显现</mark></strong>，讲说上帝国的事。 <strong>耶稣和他们聚集的时候，嘱咐他们说</strong>：「<strong><mark>不要离开耶路撒冷，要等候父所应许的</mark></strong>，就是你们听见我说过的。 <strong><mark>约翰是用水施洗</mark></strong>，但不多几日，<strong><mark>你们要受圣灵的洗</mark></strong>。」 &lt;…&gt; <strong>但圣灵降临在你们身上，你们就必得着能力</strong>；并要在耶路撒冷、犹太全地和撒玛利亚，直到地极，作我的见证。」 说了这话，他们正看的时候，他就被取上升，<strong>有一朵云彩把他接去</strong>，便看不见他了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/1/#L1-5,8-9">徒 1:1-5,8-9</a>)</p></blockquote><blockquote><p>“<strong><mark>五旬节到了</mark></strong>，门徒都聚集在一处。 &lt;…&gt; <strong><mark>又有舌头如火焰显现出来，分开落在他们各人头上</mark></strong>。 <strong><mark>他们就都被圣灵充满</mark></strong>，按着圣灵所赐的口才说起别国的话来。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/2/#L1,3-4">徒 2:1,3-4</a>)</p></blockquote><h3>不过，在基督复活的当天也讲到差遣圣灵，只是没有讲到洗礼</h3><p>这里使徒们领受了教会的权柄，建立了司祭的等次：</p><blockquote><p>“<strong>七日的第一日</strong>清早，天还黑的时候，抹大拉的马利亚来到坟墓那里，看见石头从坟墓挪开了， &lt;…&gt; 那日（就是七日的第一日）晚上，门徒所在的地方，因怕犹太人，门都关了。<strong><mark>耶稣来站在当中</mark></strong>，对他们说：「愿你们平安！」 &lt;…&gt; 说了这话，<strong><mark>就向他们吹一口气，说</mark></strong>：「<strong><mark>你们受圣灵</mark></strong>。 你们赦免谁的罪，谁的罪就赦免了；你们留下谁的罪，谁的罪就留下了。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/20/#L1,19,22-23">约 20:1,19,22-23</a>)</p></blockquote><h2>对异议的回应</h2><h3>“历史教会堕落了”</h3><p>那些与教会分离的社团的创立者们，把自己运动的生存模式建立在这样一个论断上：历史上基督的教会背弃了上帝而堕落，所以才需要他们那个分离的社团。可是，如果不证明教会已经堕落，那他们的分离社团就没有必要，人应该加入历史上基督的教会。</p><p>为了证明教会堕落的观念，常引用类似下面关于豺狼的经文：</p><blockquote><p>“<strong><mark>我知道我去之后</mark></strong>，<strong><mark>必有兇暴的豺狼进入你们中间，不爱惜羊群</mark></strong>。 就是你们中间，<strong><mark>也必有人起来，说悖谬的话</mark></strong>，<strong><mark>要引诱门徒跟从他们</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/20/#L29-30">徒 20:29-30</a>)</p></blockquote><p>然而必须承认，这些经文只是预言会出现假教师，想把人从教会里引到自己那边去，而<strong>不是</strong>预言教会堕落。</p><p>在此之上，使徒劝勉长老们谨慎看顾自己和羊群：</p><blockquote><p>“<strong>保罗从米利都打发人往以弗所去</strong>，<strong><mark>请教会的长老来</mark></strong>。 &lt;…&gt; <strong><mark>圣灵立你们作全群的监督</mark></strong>，<strong><mark>你们就当为自己谨慎，也为全群谨慎</mark></strong>，<strong><mark>牧养上帝的教会</mark></strong>，就是他用自己血所买来的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/20/#L17,28">徒 20:17,28</a>)</p></blockquote><p>使徒为什么劝勉牧养羊群？他随即给出回答：因为将出现假教师，他们要像豺狼一样想把教会的羊群掳去（<a href="https://bibleox.com/zh-Hans/cn-cuv/act/20/#L29-30">徒 20:29-30</a>）。但圣灵所立的长老们不应容许这事发生。</p><p>长老们能护住教会的羊群吗？能。因为圣经没有教会堕落的预言，倒有教会不可战胜的预言：</p><blockquote><p>“我要把<strong>我的教会</strong>建造在这磐石上，<strong>阴间的权柄</strong><strong><mark>不能胜过他</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/16/#L18">太 16:18</a>)</p></blockquote><blockquote><p>“但愿他<strong><mark>在教会中</mark></strong>，并在基督耶稣里，得着荣耀，<strong>直到世世代代</strong>，<strong><mark>永永远远</mark></strong>。阿们。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/3/#L21">弗 3:21</a>)</p></blockquote><blockquote><p>“凡我所吩咐你们的，都教训他们遵守，<strong><mark>我就常与你们同在</mark></strong>，<strong><mark>直到世界的末了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/28/#L20">太 28:20</a>)</p></blockquote><blockquote><p>“我要求父，父就另外赐给你们一位保惠师，叫他<strong><mark>永远与你们同在</mark></strong>；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/14/#L16">约 14:16</a>)</p></blockquote><h3>“教会就是两三个人奉主名聚集祈祷”</h3><p>基督已经建立了自己的教会之后，后来那些基督教社团的创立者首先要做的，是向人解释他们这个与基督的教会分离的新社团的出现。这样的社团由普通人不久前发起，与古代基督徒没有直接的历史联系，因此总要证明自己以某种方式属于2000年前基督所建立的教会。为此常引用圣经中关于共同祈祷之重要性的经文。他们提出：既然基督在两三个祈祷的人中间，那这些祈祷的人自己就已经是教会了：</p><blockquote><p>“我又告诉你们：若是你们中间有两个人在地上同心合意的求什么事，我在天上的父必为他们成全。 因为无论在那里，<strong><mark>有两三个人奉我的名聚会，那里就有我在他们中间</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/18/#L19-20">太 18:19-20</a>)</p></blockquote><p>然而这些经文字面上说的只是共同祈祷的能力，而不是教会。这里没有教会一词。而在几节之前，却有教会的话：</p><blockquote><p>“<strong>倘若你的弟兄得罪你</strong>，<strong><mark>你就去趁着只有他和你在一处的时候</mark></strong>，指出他的错来。他若听你，你便得了你的弟兄； 他若不听，你就<strong><mark>另外带一两个人同去</mark></strong>，要凭两三个人的口作见证，句句都可定准。 若是不听他们，就<strong><mark>告诉教会</mark></strong>；<strong><mark>若是不听教会</mark></strong>，就看他像外邦人和税吏一样。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/18/#L15-17">太 18:15-17</a>)</p></blockquote><p>这里聚集的人是：</p><ul><li><p>我；</p></li><li><p>得罪的弟兄；</p></li><li><p>另外一位或两位见证人。</p></li></ul><p>一共是1+1+2=4。或者至少3人。</p><p>这聚在一起的三个人仍不是教会，可以看出来：因为他们要寻求审判，不是找他们自己，而是找教会。这样，教会不是两三个为祈祷而聚集的人，而是某种持续存在的、看得见的实体，可以向它寻求审判，可以听见它的回答，并且遵行或不遵行。不听教会回答的人，在教会的肢体面前就成为“像外邦人和税吏一样”。</p><p>那么谁能审判呢？使徒和他们的继任者主教（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/18/#L18">太 18:18</a>）。例如主教提摩太：</p><blockquote><p>“<strong><mark>控告长老的呈子，非有两三个见证就不要收</mark></strong>。 犯罪的人，当在众人面前责备他，叫其余的人也可以惧怕。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1tim/5/#L19-20">提前 5:19-20</a>)</p></blockquote><p>所以，说两三个祈祷的人就是教会的解释是不成立的——他们没有审判别人的权柄。那个与教会分离的社团的创立者自己，不听教会，就在教会面前成为“像外邦人和税吏一样”（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/18/#L17">太 18:17</a>）。他在自己的社团里要审判谁呢？他自己从来没有领受过的权柄，他怎么能给出呢？答案显而易见。</p>
  meta_desc: 教会是基督的身体：定义、加入、构成、合一、可见、不可战胜
