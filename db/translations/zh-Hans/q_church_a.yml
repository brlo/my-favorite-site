- src: церковь-вечность
  path: Qc4A_教会——永存不断
  title: 教会——永存不断
  copy_cover: true
  body: <h2>上帝始终与教会同在</h2><p>圣灵被赐给教会，是直到永远：</p><blockquote><p>“我要求父，父就另外赐给你们一位保惠师，叫他<strong><mark>永远与你们同在</mark></strong>；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/14/#L16">约 14:16</a>)</p></blockquote><p>主耶稣基督应许常与教会同在：</p><blockquote><p>“凡我所吩咐你们的，都教训他们遵守，<strong><mark>我就常与你们同在</mark></strong>，<strong><mark>直到世界的末了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/28/#L20">太 28:20</a>)</p></blockquote><h2>教会必不会被打败</h2><p>主预言教会不可战胜：</p><blockquote><p>“我要把我的教会建造在这磐石上，<strong>阴间的权柄不能胜过他</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/16/#L18">太 16:18</a>)</p></blockquote><h2>真理永远在教会里</h2><p>真理将与教会同在，直到永远：</p><blockquote><p>“作长老的，写信给蒙拣选的太太和她的儿女，就是我诚心所爱的；不但我爱，也是一切知道真理之人所爱的。 爱你们是为<strong>真理的缘故</strong>，<strong><mark>这真理存在我们里面，也必永远与我们同在</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2in/1/#L1-2">约贰 1:1-2</a>)</p></blockquote><h2>教会永远荣耀上帝</h2><p>在教会里，万代都要荣耀上帝：</p><blockquote><p>“但愿他<strong><mark>在教会中</mark></strong>，并在基督耶稣里，得着荣耀，<strong><mark>直到世世代代</mark></strong>，<strong><mark>永永远远</mark></strong>。阿们。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/3/#L21">弗 3:21</a>)</p></blockquote><h2>直到基督再来，教会都将举行圣餐礼</h2><blockquote><p>“你们每逢吃这<strong>饼</strong>，喝这<strong>杯</strong>，是表明主的死，<strong><mark>直等到他来</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/11/#L26">林前 11:26</a>)</p></blockquote>
  meta_desc: 关于教会之不可战胜（永存）的圣经引文
