    parent: 教会
    title: 教会——主教们是平等的
    priority: 7
  references: "<p>翻译：罗季翁·弗拉索夫（借助人工智能工具）。底本：俄文原文。参考：英文、日文翻译。圣经链接指向本站的和合本（上帝版）；次经书卷引文按思高译本，无中文经文处自俄文译出。</p>"
- src: X7l9DcTY_Спасение_возможно_только_в_Церкви
  path: Qc2A_救恩只在教会
  title: 救恩只在教会
  copy_cover: true
  body: <h2>祈祷、预言和神迹不是得救的标志</h2><blockquote><p>“<strong>凡称呼我</strong>『主阿，主阿』的人，<strong><mark>不能都进天国</mark></strong>；惟独遵行我天父旨意的人，才能进去。 当那日，必有许多人对我说：『主阿，主阿，我们不是奉你的名<strong><mark>传道</mark></strong>，奉你的名<strong><mark>赶鬼</mark></strong>，奉你的名<strong><mark>行许多异能</mark></strong>吗？』 我就明明地告诉他们说：『<strong><mark>我从来不认识你们</mark></strong>，你们这些作恶的人，离开我去吧！』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/7/#L21-23">太 7:21-23</a>)</p></blockquote><blockquote><p>“耶稣说：「你们要谨慎，<strong><mark>不要受迷惑</mark></strong>．因为将来<strong><mark>有好些人冒我的名来</mark></strong>，说：『我是基督』，又说：『<strong><mark>时候近了</mark></strong>』，<strong><mark>你们不要跟从他们</mark></strong>！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/21/#L8">路 21:8</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/mf/24/#L5">太 24:5</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/mk/13/#L6">可 13:6</a>)</p></blockquote><h2>得救必须在基督的身体（<a href="https://bibleox.com/ru/ru/w/Церковь">教会</a>）里</h2><p>教会是基督的身体：</p><blockquote><p>“<strong><mark>基督的身体</mark></strong>，<strong><mark>就是为教会</mark></strong>，要在我肉身上补满基督患难的缺欠。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/1/#L24">西 1:24</a>)</p></blockquote><p>基督是身体的救主，也就是教会的救主：</p><blockquote><p>“基督是教会的头，他又是<strong><mark>教会全体的救主</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/5/#L23">弗 5:23</a>)</p></blockquote><p>得救的门是基督：</p><blockquote><p>“<strong><mark>我就是门，凡从我进来的，必然得救</mark></strong>，并且出入得草吃。 盗贼来，无非要偷窃、杀害、毁坏；我来了，是要叫羊得生命，并且得的更丰盛。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/10/#L9-10">约 10:9-10</a>)</p></blockquote><p>主将得救的人加给教会：</p><blockquote><p>“赞美上帝，得众民的喜爱。<strong><mark>主</mark></strong>将<strong><mark>得救的人天天加给他们</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/2/#L47">徒 2:47</a>) <em>(和合本此处无“归给教会”的字样)</em></p></blockquote><p>谁不在身体里，就不能结果子，要被剪除，扔在火里：</p><blockquote><p>“<strong><mark>你们要常在我里面</mark></strong>，我也常在你们里面。<strong><mark>枝子若不常在葡萄树上，自己就不能结果子</mark></strong>；你们若不常在我里面，也是这样。 我是葡萄树，你们是枝子，常在我里面的，我也常在他里面，这人就多结果子；<strong>因为离了我，你们就不能作什么</strong>。 <strong><mark>人若不常在我里面，就像枝子丢在外面枯干</mark></strong>，人拾起来，<strong>扔在火里烧了</strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/15/#L4-6">约 15:4-6</a>)</p></blockquote><blockquote><p>“他是你们『匠人所弃的石头，已成了房角的头块石头。』 除他以外，<strong><mark>别无拯救</mark></strong>；因为在天下人间，没有赐下别的名，我们可以靠着得救。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/4/#L11-12">徒 4:11-12</a>)</p></blockquote><p>谁不与基督相合，就是敌他的：</p><blockquote><p>“<strong><mark>不与我相合的，就是敌我的</mark></strong>；不同我收聚的，就是分散的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/11/#L23">路 11:23</a>)</p></blockquote><h2>加入基督的身体（教会）</h2><h3>洗礼</h3><blockquote><p>“我们不拘是犹太人，是希利尼人，是为奴的，是自主的，<strong>都从一位圣灵</strong><strong><mark>受洗，成了一个身体</mark></strong>，饮于一位圣灵。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/12/#L13">林前 12:13</a>)</p></blockquote><h3>领受圣体</h3><blockquote><p>“我们所祝福的杯，岂不是同领基督的血吗？我们所擘开的<strong>饼</strong>，岂不是<strong>同领基督的身体</strong>吗？ <strong>我们虽多，仍是一个饼</strong>、<strong><mark>一个身体</mark></strong>，因为我们都是<strong><mark>分受这一个饼</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/10/#L16-17">林前 10:16-17</a>)</p></blockquote><h2>方舟——旧约救恩的预表</h2><blockquote><p>“耶和华说：「<strong><mark>我要将所造的人和走兽，并昆虫，以及空中的飞鸟，都从地上除灭</mark></strong>，因为我造他们后悔了。」 &lt;…&gt; 世界在上帝面前败坏，地上满了强暴。 上帝观看世界，见是败坏了；凡有血气的人，在地上都败坏了行为。 上帝就对挪亚说：「凡有血气的人，他的尽头已经来到我面前，因为地上满了他们的强暴，<strong><mark>我要把他们，和地一并毁灭</mark></strong>。 <strong><mark>你要用歌斐木造一只方舟</mark></strong>，分一间一间地造，里外抹上松香。 &lt;…&gt; 看哪，<strong><mark>我要使洪水泛滥在地上，毁灭天下</mark></strong>；<strong><mark>凡地上有血肉、有气息的活物，无一不死</mark></strong>。 我却要与你立约；<strong>你同你的妻，与儿子、儿妇，都要进入方舟</strong>。 凡有血肉的活物，每样两个，一公一母，你要带进方舟，好在你那里保全生命。 飞鸟各从其类，牲畜各从其类，地上的昆虫各从其类，每样两个，要到你那里，好保全生命。 你要拿各样食物积蓄起来，好作你和牠们的食物。」 挪亚就这样行。凡上帝所吩咐的，他都照样行了。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/6/#L7,11-14,17-22">创 6:7,11-14,17-22</a>)</p></blockquote><blockquote><p>“<strong>凡在地上有血肉的动物</strong>，就是飞鸟、牲畜、走兽和爬在地上的昆虫，以及所有的人都死了。 <strong>凡在旱地上，鼻孔有气息的生灵都死了</strong>； <strong>凡地上各类的活物</strong>，连人带牲畜、昆虫，以及空中的飞鸟，都从地上除灭了，<strong><mark>只留下挪亚和那些与他同在方舟里的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/7/#L21-23">创 7:21-23</a>)</p></blockquote><blockquote><p>“就是那从前在挪亚预备方舟、上帝容忍等待的时候，不信从的人。当时<strong><mark>进入方舟，借着水得救的不多，只有八个人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/3/#L20">彼前 3:20</a>)</p></blockquote><h3>旧约的预像，写下来是为了教导我们</h3><blockquote><p>“<strong><mark>他们遭遇这些事都要作为鉴戒，并且写在经上</mark></strong>，正是警戒我们这末世的人。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/10/#L11">林前 10:11</a>)</p></blockquote><h2>对异议的回应</h2><h3>“你们这样说是因为骄傲：‘只有我们得救，别人不得救’”</h3><p>上帝曾藉先知摩西建立了旧约的教会，并在其中设立了上帝所喜悦的规矩。后来，旁边兴起了撒玛利亚民族，它由许多被迁移来的民族组成：这些人根据先知摩西的五卷书（妥拉），不接受当时的作者们（先知们）的书卷，自己建立了一个有自己规矩的、独立的宗教团体，按自己的方式信上帝，并等候基督。基督回答撒玛利亚妇人说：</p><blockquote><p>“<strong><mark>你们所拜的，你们不知道</mark></strong>；我们所拜的，我们知道，因为<strong><mark>救恩是从犹太人出来的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/4/#L22">约 4:22</a>)</p></blockquote><p>基督这样说，是因为骄傲，还是因为：在擅自建立的团体里、在按书本擅自想出来的信仰里，人确实不能得救？</p><p>当使徒说，顺着情欲行事的人——其中有异端和分裂教会之事——不能承受上帝的国，他这样说是因为骄傲，还是因为：带着这样的罪，人确实不能承受上帝的国？</p><blockquote><p>“<strong>情欲的事都是显而易见的</strong>，就如奸淫、污秽、邪荡、 拜偶像、邪术、仇恨、争竞、忌恨、恼怒、<strong><mark>结党</mark></strong>、<strong><mark>纷争</mark></strong>、<strong><mark>异端</mark></strong>、 嫉妒〔有古卷在此有『凶杀』二字〕、醉酒、荒宴等类。我从前告诉你们，现在又告诉你们，<strong><mark>行这样事的人必不能承受上帝的国</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/5/#L19-21">加 5:19-21</a>) <em>(*“纷争”（διχοστασίαι）——分裂、分派；“结党”（ἐριθεῖαι）——结派营私。)</em></p></blockquote><p>新教徒在这里看到骄傲，是因为他们凭空虚构了“只要认基督为个人的救主就已经得救”的教义，即现在立刻得救、单凭信心得救。正教徒不持守这种教义，因此对得救有着完全不同的理解（详见<a href="https://bibleox.com/ru/ru/w/спасение#HH-Условия-спасения">得救的条件</a>）。</p><p>来到<a href="https://bibleox.com/ru/ru/w/Православная-Церковь">正教会</a>，我们还不是得救了，而是正在得救。来到教会的人不是都能得救，只有那些利用救恩的途径、勤恳地对付自己、根除罪的私欲、培养福音品德的人才能得救。身在正教会，只是得救的条件之一。凡寻求救恩的人都需要救恩的途径：病人需要药物，在大海中央溺水的人需要船。同样，凡被罪的私欲所缠累的人，要渡过今世的海，不在罪的深渊里沉没，并与上帝同活，就需要<strong>救恩的途径：正确的信仰和有恩典的圣奥秘</strong>。这些救恩的途径，上帝把它们放在他救恩的方舟——<a href="https://bibleox.com/ru/ru/w/Православная-Церковь">正教会</a>——里面；而这方舟是主耶稣基督上帝亲自在2000年前来建立的。</p><p>近来由普通人擅自建立的团体，直接违背上帝关于信徒合一的旨意，不但没有救恩的途径，反而以其分离的存在本身，把人带进严重的罪的状态——异端和分裂教会这些致死的罪（<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/5/#L19-21">加 5:19-21</a>）。</p><p>建立自己的“教会”、分裂信徒，直接违背基督和使徒关于信徒合一的旨意——这一切正是骄傲的表现：</p><blockquote><p>“我不但为这些人<strong><mark>祈求</mark></strong>，也为那些因他们的话信我的人祈求， <strong><mark>使他们都合而为一</mark></strong>；正如你父在我里面，我在你里面，<strong><mark>使他们也在我们里面</mark></strong>，<strong><mark>叫世人可以信你差了我来</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/17/#L20-21">约 17:20-21</a>)</p></blockquote><blockquote><p>“弟兄们，我藉我们主耶稣基督的名，<strong><mark>劝你们</mark></strong><strong><mark>都说一样的话</mark></strong>。你们中间也<strong><mark>不可分党</mark></strong>，只要<strong><mark>一心一意</mark></strong>，<strong><mark>彼此相合</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/1/#L10">林前 1:10</a>)</p></blockquote><p>与基督为敌、建立自己的“教会”，当然不能得救。使徒说，顺着情欲行事、陷入异端和分裂的人，不能承受天国：</p><blockquote><p>“<strong>情欲的事都是显而易见的</strong>，就如奸淫、污秽、邪荡、 拜偶像、邪术、仇恨、争竞、忌恨、恼怒、<strong><mark>结党</mark></strong>、<strong><mark>纷争</mark></strong>、<strong><mark>异端</mark></strong>、 嫉妒〔有古卷在此有『凶杀』二字〕、醉酒、荒宴等类。我从前告诉你们，现在又告诉你们，<strong><mark>行这样事的人必不能承受上帝的国</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/gal/5/#L19-21">加 5:19-21</a>) <em>(*“纷争”（διχοστασίαι）——分裂、分派；“结党”（ἐριθεῖαι）——结派营私。)</em></p></blockquote><p>使徒直说，制造分裂的人不是服事主耶稣基督：</p><blockquote><p>“弟兄们，那些<strong><mark>离间你们、叫你们跌倒</mark></strong>、背乎所学之道的人，我劝你们要留意躲避他们。 因为这样的人<strong><mark>不服事我们的主基督</mark></strong>，只服事自己的肚腹，用花言巧语诱惑那些老实人的心。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/16/#L17-18">罗 16:17-18</a>)</p></blockquote><p>跟随与基督为敌的人走，怎么能得救呢？</p><p>此外，异端和分裂教会并不是仅有的罪，还有许多别的<a href="https://bibleox.com/ru/ru/w/смертный-грех">致死的罪</a>。警告酒鬼说，他处在酗酒这个致死的罪里，按圣经所说不能承受上帝的国（<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/6/#L9">林前 6:9</a>），这是骄傲的行为吗？或者对杀人犯、贼、行邪术的、淫乱的人说同样的话，也是骄傲吗？如果这不是骄傲，而且我们应当警告这些致死的罪（<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/5/#L11">弗 5:11</a>），那么老实说，也应当警告异端者和分裂教会者，因为异端和分裂与酗酒、杀人等等在同一条致死之罪的名单上——处在其中的人不能承受上帝的国。</p><p>那人怎样脱离这种罪的状态呢？离开那个由普通人近来建立的团体，放弃那个由同一个人近来想出来的信仰。然后进入主耶稣基督所建立的<a href="https://bibleox.com/ru/ru/w/Православная-Церковь">正教会</a>，领受正教的信仰——基督把这信仰教导了使徒们，使徒们把它放进正教会里，圣灵把它永远保存在基督的教会里，因为圣灵被永远地差给了教会：</p><blockquote><p>“我要求父，父就另外赐给你们一位保惠师，叫他<strong><mark>永远与你们同在</mark></strong>；” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/14/#L16">约 14:16</a>)</p></blockquote><blockquote><p>“凡我所吩咐你们的，都教训他们遵守，<strong><mark>我就常与你们同在</mark></strong>，<strong><mark>直到世界的末了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/28/#L20">太 28:20</a>)</p></blockquote>
