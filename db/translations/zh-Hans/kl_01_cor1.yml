      <h2>关于两封书信</h2><p>《前书》写作于公元96–97年；《后书》则被认为写于二世纪中叶（它是否出于圣革利免之手，存有争议）。两封书信最初发现于五世纪的亚历山大抄本（Codex Alexandrinus），均有残缺：《前书》缺失第57章的结尾以及第58–63章，《后书》则中断于第12章。</p><p>缺失的部分后来在君士坦丁堡的耶路撒冷驻所所藏的一部小写体抄本（Codex Hierosol. 54）中被发现，该抄本定年为公元1056年。本译本把恢复的部分并入正文的相应位置（见第57:7段及第58–63章的注）。</p><h2>0</h2><p>在罗马寄居的上帝的教会，写信给在哥林多寄居的上帝的教会：那借着我们的主耶稣基督，按上帝的旨意蒙召、成圣的人。愿全能的上帝借着耶稣基督赐给你们的恩惠与平安，得着丰盛。[1]</p><h2>1</h2><p>1. 亲爱的诸位，因临到我们的骤然灾祸与接踵而来的苦难，关于你们中间所争问的事，我们觉得回复已经迟延了：那场可憎而不虔的骚乱，对上帝的选民是外来的、陌生的——不过寥寥几个鲁莽专横的人，竟把它煽动到如此狂乱的地步，以致你们那尊贵、著名、为万人所爱的名受到了极大的亵渎。</p><p>2. 因为，凡曾到过你们那里的人，谁不称赞你们那至善而稳固的信心？谁不惊叹你们在基督里那明达而温良的敬虔？谁不宣扬你们好客品格的出众？谁不称颂你们那完全而稳妥的认识？</p><p>3. 你们凡事都不徇情面，并遵行上帝的律例而行，顺服你们的带领者，把当得的尊荣归给你们中间的司祭们；你们又教导青年节制而庄重地思想；又嘱咐妇女在无瑕、庄重、纯洁的良心里完成一切事，以合宜的爱敬重自己的丈夫；又教导她们遵行顺服的规范，端庄地治理家务，凡事极其精明。[2]</p><h2>2</h2><p>1. 你们众人存心谦卑，毫不自夸，宁愿顺服人，也不辖制人；宁愿施与，也不接受。你们以基督的供应为足，细心留意祂的话语，把祂的言语珍藏于腹中；祂的受苦也常在你们眼前。</p><p>2. 这样，深厚而丰润的平安便赐给了众人，行善的渴望也永不知足；圣灵的恩泽满溢，浇灌在众人身上；</p><p>3. 你们心怀圣善的意向，怀着美善的热忱与敬虔的信心，向全能的上帝伸手祈求，恳求祂施怜悯，因为你们有时无意中犯了罪。</p><p>4. 你们昼夜竞逐奔程，为整个弟兄团体争战，要叫祂所拣选的人数靠着怜悯与良心得蒙拯救。</p><p>5. 你们真诚无伪，心里单纯，彼此不怀怨恨。</p><p>6. 一切纷争、一切分裂都是你们所憎恶的。你们为邻人的过犯忧伤，把他们的欠缺看作自己的欠缺。</p><p>7. 你们在一切善行上毫不厌悔，“随时准备行各样的善事”。[3]</p><p>8. 你们以那至善、可敬畏的品行妆饰自己，一切都在敬畏祂之中完成；主的诫命与典章都刻在你们的心版上。</p><h2>3</h2><p>1. 一切荣华与宽广都赐给了你们；所记的话也应验了：“他吃了又喝，长得宽广肥壮，被爱的那一位竟悖逆了。”[4]</p><p>2. 由此，嫉恨与嫉妒、纷争与叛乱、逼迫与动乱、战争与掳掠便兴起来了。</p><p>3. 于是，“无尊荣的起来攻击有尊荣的”，无名的攻击有名的，愚昧的攻击智慧的，年轻的攻击年长的。[5]</p><p>4. 因此，公义与平安都远离了：各人离弃了对上帝的敬畏，在对祂的信心里变得昏昧，不照祂诫命的律例而行，不度配得基督的生活，各人反而随从自己邪恶之心的私欲走去，接受了不义的、不敬虔的嫉恨——死亡也正是借着它进入了世界。[6]</p><h2>4</h2><p>1. 因为经上这样记着：“后来，该隐把地里的出产作为祭物献给上帝；亚伯也献上他自己羊群中头生的和它们的脂油。</p><p>2. 上帝眷顾亚伯和他的礼物，却不顾该隐和他的祭物。</p><p>3. 该隐就大大忧愁，面容变了色。</p><p>4. 上帝对该隐说：‘你为什么这样忧愁？你的面容为什么变了色？你若献得正当，却没有正当划分，岂不是犯了罪吗？’[7]</p><p>5. 你要安静：他必转向你，你也必管辖他。”</p><p>6. 该隐对他兄弟亚伯说：“我们到田间去吧。”他们正在田间，该隐起来攻击他的兄弟亚伯，把他杀了。”</p><p>7. 弟兄们，你们要看：嫉恨与嫉妒竟成就了弑兄之罪。</p><p>8. 因嫉恨，我们的先祖雅各逃避他哥哥以扫的面。</p><p>9. 嫉恨使约瑟受迫害直到死地，又使他落入奴役。</p><p>10. 嫉恨迫使摩西逃离埃及王法老的面——他听见同族的人说：“谁立你作我们的首领和审判官呢？你要像昨天杀那埃及人一样杀我吗？”</p><p>11. 因嫉恨，亚伦与米利暗被逐到营外。</p><p>12. 嫉恨把大坍与亚比兰活活下到阴间——因为他们背叛了上帝的仆人摩西。</p><p>13. 因嫉恨，大卫不但受外邦人的嫉妒，也受以色列王扫罗的逼迫。</p><h2>5</h2><p>1. 为要叫我们撇下古时的榜样，就让我们到那些与我们相近的竞技者那里去；让我们取我们这世代中那些刚勇的榜样。</p><p>2. 因嫉恨与嫉妒，那最伟大、最公义的柱石受了逼迫，争战直到死地。</p><p>3. 让我们把那良善的众使徒放在我们眼前。</p><p>4. 彼得因不义的嫉恨，所受的不是一桩、也不是两桩苦，而是许多的苦难；他这样作了见证，便去了那配得荣耀的地方。[8]</p><p>5. 保罗因嫉恨得了忍耐的奖赏：</p><p>6. 他七次受捆绑，被驱逐，被石头打。他在东方和西方作宣讲者，为自己的信得了高贵的名声：他教导全世界公义，走遍到西方的边界，[9]</p><p>7. 并在掌权者面前以殉道为真理作了见证。这样，他便离开了世界，进入了圣善的地方，成了忍耐最大的榜样。[10]</p><h2>6</h2><p>1. 与这些圣善度日的人一同聚拢的，还有一大批蒙拣选的人：他们因嫉恨受了许多凌辱与刑罚，在我们中间留下了最美的榜样。</p><p>2. 因嫉恨受逼迫的妇女们——达奈得斯与狄尔刻斯——受了可怕而不虔的凌辱，就跑完了信心那稳固的路程；身体软弱的女子，也得了刚勇的赏赐。[11]</p><p>3. 嫉恨使夫妻彼此隔绝，也改变了我们先祖亚当所说的话：“这如今是我骨中的骨，肉中的肉。”</p><p>4. 嫉恨与纷争使大城倾覆，把大国连根拔起。</p><h2>7</h2><p>1. 亲爱的诸位，我们写这些话，不只是劝诫你们，也是提醒我们自己：我们同在一场竞技之中，同样的争赛也摆在我们的面前。</p><p>2. 所以，让我们撇下虚浮而空洞的挂虑，来到我们传统那光荣而庄重的规范那里，</p><p>3. 看一看：什么是良善的，什么是可喜悦的，什么是蒙那造我们之主悦纳的。</p><p>4. 让我们定睛看基督的血，知道它在父眼中是何等宝贵：它为我们的救恩而流，把悔改的恩典带给了全世界。</p><p>5. 让我们遍查历世历代，看主如何世世代代给愿意归向祂的人留下悔改之地。</p><p>6. 挪亚宣讲悔改，听从的人就得救了。[12]</p><p>7. 约拿向尼尼微人宣告毁灭；他们为自己的罪悔改，恳求上帝，就得了祂的赦免——虽是上帝的外人，却得了救恩。</p><h2>8</h2><p>1. 上帝恩典的服事者们，因着圣灵，也曾宣讲悔改；</p><p>2. 而万物的主自己也带着起誓宣讲悔改：“因为我活着，主说——我不愿恶人死去，而愿他悔改。”[13]</p><p>3. 随后又加上良善的旨意：“以色列家啊，你们要悔改，离开你们的不义。对我民的儿子们说：你们的罪纵然从地直达到天，纵然红过朱砂、黑过麻布，你们若全心回转向我，说：父啊——我就垂听你们，如同听圣洁的民。”[14]</p><p>4. 又在别处这样说：“要洗濯自己，成为洁净；从我眼前除掉你们灵魂中的邪恶；停止你们的恶行，学习行善；寻求公义，援救受欺压的人，为孤儿伸冤，为寡妇辨屈。来吧，让我们彼此对质，主说：你们的罪纵然像朱红，我必使它们白如雪；纵然像丹红，我必使它们白如羊毛。你们若愿意听从我，就必吃地上的美物；若不愿意，也不肯听从，刀剑必吞灭你们——因为主的口说了这话。”[15]</p><p>5. 所以，祂既愿意一切蒙爱的人有份于悔改，就以祂那全能的旨意立定了这事。</p><h2>9</h2><p>1. 所以，让我们顺服祂那威严而荣耀的旨意，抛下虚妄的劳碌、纷争与引到死亡的嫉恨，恳求祂的怜悯与恩慈，俯伏并回转到祂的怜悯中。</p><p>2. 让我们定睛看那完全事奉于祂那威严荣耀的人。</p><p>3. 让我们看以诺：他在顺服中被显为义，就被接去，人找不到他的死。[16]</p><p>4. 挪亚在事奉中被显为信实，向世界宣讲重生；主借着他也救了那些同入方舟、和睦同处的活物。</p><h2>10</h2><p>1. 亚伯拉罕被称为上帝的朋友，因他顺服上帝的话而在信中被显为忠心。[17]</p><p>2. 他因顺服，离开了自己的地、自己的亲族和父家，好叫他能撇下小地、软弱的亲族与微小的家室，承受上帝的应许。因为祂对他说：</p><p>3. “你离开你的地、你的亲族和你父的家，往我所要指示你的地去。我必使你成为大国，赐福给你，使你的名为大，你也必蒙福。我必赐福那祝福你的人，咒诅那轻看你的人；地上的万族都必因你蒙福。”[18]</p><p>4. 他又在与罗得分开时对他说：“你从如今所在之地举目向北、向南、向东、向海观看；你所看见的一切地，我必赐给你和你的后裔，直到永远。</p><p>5. 我必使你的后裔如同地上的尘沙：若有人能数清地上的尘沙，你的后裔也必被数清。”[19]</p><p>6. 又说：“上帝领亚伯拉罕出来，对他说：你向天观看，数算众星，看你能否数得清——你的后裔也必如此。亚伯兰信上帝，这就算为他的义。”[20]</p><p>7. 因信心与好客，他在老年得了儿子；又因顺服，把儿子带到上帝所指示的诸山之一，献为祭。</p><h2>11</h2><p>1. 罗得因好客与敬虔，从所多玛得了拯救——那整个地区都因火与硫磺受了审判；主表明了这一事：凡仰望祂的人，祂不离弃；心怀二意的人，祂却放在刑罚与凌辱之中。</p><p>2. 因为那与罗得同出、意见与他不同、不与他同心合一的妻子，被立为记号：她成了盐柱，直到今天，使众人知道：三心二意、对上帝的大能存疑的人，必成为历世历代的审判与警戒。[21]</p><h2>12</h2><p>1. 喇合——那妓女——因信心与好客得了拯救。</p><p>2. 嫩的儿子约书亚差遣探子到耶利哥去时，那地的王得知他们来窥探那地，就派人捉拿他们，好捉住之后治死。</p><p>3. 那好客的喇合接待了他们，把他们藏在阁楼上，藏在亚麻秆之下。</p><p>4. 王差来的人到了，说：“我们之地的探子进到你这里了；把他们交出来，王如此吩咐。”她回答：“你们要找的那些人确曾进到我这里，但他们立刻走了，正在路上。”她指给他们相反的方向。</p><p>5. 她对那些人说：“我确实知道，主上帝必把这地交在你们手中；你们的惧怕已经落在居住这地的人身上。所以，你们得着这地的时候，请也救我和我父家的人。”</p><p>6. 他们对她说：“必照你向我们所说的成就。所以，你们知道我们来到时，要把你所有的人都聚在你屋檐之下，他们就必得救：凡在屋外找到的，都必灭亡。”</p><p>7. 他们又给她一个记号：叫她把一根红绳挂在她家屋外；他们显明了一件事：借着主之血，救赎必临到一切信靠上帝、仰望上帝的人。[22]</p><p>8. 你们要看，亲爱的诸位：在这妇人身上，不只有信心，也有预言。[23]</p><h2>13</h2><p>1. 所以，弟兄们，让我们存心谦卑，放下一切自大、狂妄、愚昧与怒气，去行所记的话；因为圣灵说：“智慧人不要因他的智慧夸口，大力的人不要因他的大力夸口，富足的人不要因他的财富夸口；夸口的，当在主里夸口，就是寻求祂，行公义与公平。”[24]</p><p>2. 特别要记念主耶稣所说话语，祂教导温良与恒忍；祂这样说：“怜悯人的，必蒙怜悯；饶恕人的，必蒙饶恕；你们怎样待人，人也必怎样待你们；你们怎样给人，也必怎样给你们；你们怎样论断人，也必怎样被论断；你们怎样恩待人，也必怎样蒙恩待；你们用什么量器量给人，也必照样量给你们。”[25]</p><p>3. 让我们在这诫命与这些训诲上坚固自己，好叫我们行走，听命于祂那圣善的言语，存心谦卑；因为圣善的话说：</p><p>4. “我要看顾谁呢？岂不看那温良、安静、因我的话而战兢的人吗？”[26]</p><h2>14</h2><p>1. 弟兄们，顺服上帝，胜过跟随那些以自高与骚乱作可憎嫉恨之首领的人，这才是公义而圣洁的事。</p><p>2. 因为，若我们轻率地把自己交在那唆使我们陷入分裂与叛乱、要使我们与美善隔绝之人的私欲手中，我们所受的就不是寻常的伤害，而是要陷于极大的危险。</p><p>3. 让我们以那造我们之主的仁慈与温良善待自己。</p><p>4. 因为经上记着：“温良的人必为地上的居民，无邪的人必留在地上；行不法的人必从地上被剪除。”[27]</p><p>5. 又说：“我看见不敬虔的人被高举、上升，如利巴嫩的香柏树；我又经过，看哪，他已经不在；我寻找他的地方，竟找不着。你要保守无邪，观看正直，因为和平的人有好的结局。”[28]</p><h2>15</h2><p>1. 所以，让我们与那些怀着敬虔保守和平的人联合，不与那些怀着假冒为善渴望和平的人联合。</p><p>2. 经上说：“这百姓用嘴唇尊敬我，心却远离我。”[29]</p><p>3. 又说：“他们用口称颂，心里却咒诅。”[30]</p><p>4. 又说：“他们爱他，是用口爱他，用舌头向他撒谎，他们的心却不与他端正，也不守祂的约。”[31]</p><p>5. 所以，“愿那说话攻击义人、行不法的虚假嘴唇成为哑巴。”[32]</p><p>6. 又说：“主必剪除一切虚假的嘴唇、说大话的舌头，就是那些说：我们用舌头得胜，我们的嘴唇是我们的——谁能作我们的主呢？</p><p>7. 因困苦人的叹息与贫穷人的哀号，我如今必起来，主说：我必把他安置在拯救里；我必在他里面放胆发言。”[33]</p><h2>16</h2><p>1. 因为基督属于谦卑的人，而不属于向祂的羊群自高的人。</p><p>2. 上帝威严的权杖——主耶稣基督——并没有带着自大与骄傲的夸耀而来，虽然祂本可以；而是存心谦卑，正如圣灵论到祂所说的话；祂说：</p><p>3. “主啊，谁信我们所传的呢？主的膀臂向谁显露呢？我们在祂面前如同孩童宣告，如同根在干渴之地；祂没有形体，也没有荣耀；我们看见祂，祂也没有形体，没有美：祂的形像是卑微的，比人的形像更加枯槁；祂是带伤、受苦之人，知道如何承受软弱：祂的面容被转开，被轻视，也不被算数。[34]</p><p>4. 他担当我们的罪，为我们受苦；我们却以为他在痛苦、刑罚与患难之中。</p><p>5. 他却为我们的罪受伤，为我们的不法而软弱；我们得平安所受的刑罚落在他身上，因他的鞭伤我们得了医治。</p><p>6. 我们都如羊走迷，人各自走迷了自己的路。</p><p>7. 主把他交在我们的罪之上；他因受患难而不开口。他被牵到宰杀之地，如同羊羔在剪毛人面前无声，他也不开口。在卑微之中，他的审判被夺去。</p><p>8. 谁能述说他的世代呢？因为他的生命从地上被夺去。</p><p>9. 他从我民的不法中来到死地。</p><p>10. 我必把恶人与他的坟墓相换，把富人与他的死相换；因为他没有行不法，口中也没有诡诈。主也愿意洁净他脱离鞭伤。</p><p>11. 你们若为罪献上，你们的灵魂必见长久年日的种子。</p><p>12. 主又愿意救他脱离灵魂的痛苦，把光显给他，以悟性塑成形；把那好好事奉多人的义人称为义；他们的罪他必担当。</p><p>13. 所以，他必承受许多，与强者分掳物——因他的灵魂被交于死地，被列在不法之人的行列；</p><p>14. 他担当了多人的罪，又为他们的罪被交。”</p><p>15. 他自己又说：“我却是虫，不是人，是人的羞辱，民的藐视。[35]</p><p>16. 凡看见我的都讥诮我；他们以嘴唇说话，摇头说：他倚靠主，主就救他吧——既然喜悦他，就救他吧。”</p><p>17. 亲爱的诸位，你们要看：我们所领受的榜样是什么——若主这样谦卑自己，那么我们这些借着祂、经过祂恩典之轭而来的人，该做什么呢？</p><h2>17</h2><p>1. 让我们也效法那些披着山羊皮与羊皮行走、宣讲基督之来的人；我们说以利亚与以利沙，还有以西结——众先知，以及那些得了称许的人。</p><p>2. 亚伯拉罕被大大称许，被称为上帝的朋友；他定睛上帝的荣耀，谦卑地说：“我是尘土与灰烬。”[36]</p><p>3. 论到约伯，经上也这样记着：“约伯是公义、无可指摘、真实、敬畏上帝、远离一切恶事的人。”[37]</p><p>4. 但他自己控告自己说：“没有一个人从污秽中洁净，哪怕他只活一天。”[38]</p><p>5. 摩西被称为“在祂全家中尽忠的”，上帝借着他的服事，以鞭笞与凌辱审判了埃及；但他虽大得荣耀，也不自大，反而在荆棘丛中蒙上帝晓谕时说：“我是谁，竟差我去呢？我本是声弱舌迟之人。”[39]</p><p>6. 又说：“我不过是锅边的一缕蒸汽。”[40]</p><h2>18</h2><p>1. 对于得了称许的大卫，我们说什么呢？上帝对他说：“我寻得一个合我心意的人——耶西的儿子大卫；我以永恒的怜悯膏了他。”[41]</p><p>2. 但他自己也对上帝说：“上帝啊，求你按你丰盛的怜悯怜悯我，按你极大的怜悯涂抹我的不法。[42]</p><p>3. 多多洗除我的不法，洁净我的罪；因为我知道我的不法，我的罪常在我面前。</p><p>4. 我独独得罪了你，在你眼前行了这恶，使你在你的话语上显为公义，在你受审判时得胜。</p><p>5. 看哪，我是在不法中被抓住的，我母亲在罪中怀了我。</p><p>6. 看哪，你喜爱真理；你把智慧中隐密与隐藏的事显明给我。</p><p>7. 你必以牛膝草洒我，我就洁净；你必洗我，我就白过雪。</p><p>8. 你必使我听见欢喜与快乐的声音；压低的骨头必欢欣踊跃。</p><p>9. 求你转脸，不看我的罪，涂抹我一切的不法。</p><p>10. 上帝啊，求你为我造清洁的心，在我里面重新立正直的灵。</p><p>11. 求你不从我面前丢弃我，不从我这里收回你的圣灵。</p><p>12. 求你把你的救恩之欢喜归还我，用君王之灵坚固我。</p><p>13. 我要教导不法之人你的道路，不敬虔的人必回转向你。</p><p>14. 上帝啊，我的救恩之上帝，求你救我脱离血；</p><p>15. 我的舌头必欢颂你的公义。主啊，求你开我的口，我的嘴唇必宣告你的赞美。</p><p>16. 你若愿意祭物，我就必献上；燔祭你不喜悦。</p><p>17. 上帝的祭是忧伤的灵；忧伤压低的心，上帝必不轻看。”</p><h2>19</h2><p>1. 既有这许多、这样得了称许的人，那谦卑与顺服的德行，不但使我们，也使在我们之前的世代成为更好——就是那些以敬畏与真理领受祂言语的人。</p><p>2. 我们既已承受这许多伟大而荣耀的事，就让我们回到那从起初传给我们的和平之标，定睛看那位父与全世界的创造者，与祂那威严超胜的和平恩赐相连。</p><p>3. 让我们用心思想祂，用灵魂的眼目观看祂那恒忍的旨意，领悟祂对祂一切受造之物何等无怒。</p><h2>20</h2><p>1. 诸天在祂的治理之下运转，在和平中顺服于祂。</p><p>2. 日与夜走完祂所指定的轨道，彼此毫不妨碍。</p><p>3. 日、月与星辰的行列，按祂的吩咐，在合一之中，毫不偏离地滚动着它们所领受的轨道。</p><p>4. 怀孕的地按祂的旨意，在各自的时节，为人、为兽、为地上一切活物生出丰盛的食物，毫不分争，也不改变祂所审定定规的任何事。</p><p>5. 深渊那不可测度的判定与阴间那不可言说的疆界，也以同样的命令维系着。</p><p>6. 那无边海洋的盆地，按祂的创造聚在诸聚集之中，不越过加于它的界限，而是照祂所吩咐的而行。</p><p>7. 因为祂说：“你只到这里，你的波浪必在你里面碎裂。”[43]</p><p>8. 对人不可测度的海洋与它之后的诸世界，也按主的同一秩序流动。</p><p>9. 春、夏、秋、冬四季，在和平中彼此更替。</p><p>10. 风的居所按各自的时节毫不偏差地执行它们的服事；常流的泉源，为享乐与健康而造，毫不匮乏地向人供应生命的乳；连最小的活物也在合一与和平中成群相聚。</p><p>11. 这一切，那万物的伟大创造者与主都吩咐在和平与合一中存在——祂恩待万有，尤其恩待我们这些借着我们的主耶稣基督投奔祂怜悯的人；</p><p>12. 愿荣耀与威严归于祂，直到世世无穷。阿们。</p><h2>21</h2><p>1. 你们要看，亲爱的诸位，免得祂这许多的恩惠反而成了我们众人的定罪——我们若不度配得上祂的生活，不同心合意地在祂面前行善事、行祂所喜悦的事。</p><p>2. 因为经上说：“主的灵是鉴察腹中密室的灯。”[44]</p><p>3. 让我们思想：祂何等临近，我们的一切意念、我们一切的筹算，没有一样能向祂隐藏。</p><p>4. 所以，我们不可偏离祂的旨意——这是理所当行的。</p><p>5. 与其得罪上帝，不如反对那些愚拙而无知、自高自大、夸耀自己言语之华丽的人。</p><p>6. 我们要敬畏主耶稣基督——祂的血为我们而流；要敬重我们的带领者，尊重司祭们，以敬畏上帝之道教导青年，</p><p>7. 又当引导我们的妇女归于美善：愿她们显出那配受称赞的贞洁品格，表明她们温柔无邪的心愿，借着沉默显出她们温良的舌头；愿她们的爱心不偏待人，而以圣洁平等地给予一切敬畏上帝的人。</p><p>8. 愿我们的儿女承受在基督里的教导：愿他们明白，谦卑在上帝面前有何等能力，纯洁的爱在上帝面前有何等大能，对祂的敬畏是何等美好而伟大——祂拯救一切以清洁心思圣善度日的人。</p><p>9. 因为祂是意念与筹算的探查者；祂的气息在我们里面，祂什么时候愿意，就什么时候把它收回。</p><h2>22</h2><p>1. 这一切，在基督里的信心都加以证实；因为祂自己借着圣灵这样呼唤我们：“来，孩子们，听我：我要把敬畏主的道教导你们。</p><p>2. 有什么样的人想要生命，爱慕看见好日子呢？</p><p>3. 你要保守你的舌头远离恶事，你的嘴唇远离诡诈的话。</p><p>4. 你要远离恶事，去行善事。</p><p>5. 你要寻求和平，追逐它。</p><p>6. 主的眼睛看顾义人，祂的耳朵垂听他们的祈求；主的面向行恶事的人变脸，要把他们的记念从地上剪除。</p><p>7. 义人呼求，主垂听了；祂救他脱离他一切的苦难。”[45]</p><p>8. “罪人多有鞭笞；寄望于主的人，怜悯必环绕他。”[46]</p><h2>23</h2><p>1. 那在一切事上施怜悯、行善的父，对敬畏祂的人怀有慈肠；祂以温良与恩慈，把祂的恩典报答给那些以单纯之心亲近祂的人。</p><p>2. 所以，我们不要心怀二意，也不要在祂那超胜荣耀的恩赐面前让灵魂生疑。</p><p>3. 愿这经上的话远离我们：“心怀二意的人是可怜的；心中存疑的人说：这些话我们的先祖时代也听过，看哪，我们已经老了，这些事却没有一件临到我们。[47]</p><p>4. 愚昧人哪，你们要拿自己与树木比一比：拿葡萄树来——它先落叶，然后发芽，然后生叶，然后开花，其后才有未熟的青果，然后才有成熟的葡萄。”你们要看：在极短的时节，树木的果子就完全成熟了。</p><p>5. 祂的旨意也真的必速速、忽然成就，圣经也一同作证：“祂必速来，并不迟延”；又说：“主必忽然进入祂的殿；就是你们所等候的那圣者。”[48]</p><h2>24</h2><p>1. 亲爱的诸位，让我们思想：主如何持续不断地向我们显明将来的复活必要发生——祂使主耶稣基督从死里复活，立祂作复活的初熟之果。[49]</p><p>2. 亲爱的诸位，让我们看按时发生的复活。</p><p>3. 日与夜向我们显明复活：夜沉睡，日起来；日离去，夜来临。</p><p>4. 让我们看庄稼：种子怎样、以何种方式生发？</p><p>5. 播种的人出去，把各样的种子撒在地里；它们落到干而裸的地里就朽坏；随后，从这朽坏中，主护理的威严使它们兴起，从一粒增多，结出果子。[50]</p><h2>25</h2><p>1. 让我们看东方之地——就是在亚拉伯一带——所发生的那奇异之兆。</p><p>2. 有一种鸟，名叫凤凰，是独一无二的，活五百年；当它临近消亡之时，就为自己用乳香、没药与其余香料筑一个窝；时候满了，它就进去，死去。</p><p>3. 当它的肉体朽坏时，就生出一条虫来，这虫从那死去之兽的湿气中得养育，长出翅膀；随后它一长成刚勇，就举起那放着先前之鸟骨头的窝，带着它们，从亚拉伯之地一直飞到埃及，到那称为希利俄波利（太阳城）的地方。</p><p>4. 并且在白昼、当众人都看见之时，它飞落到日坛之上，把骨头放在那里，随后就启程回去。</p><p>5. 于是祭司们查验年日的记录，发现它来到之时，正是第五百年圆满之时。[51]</p><h2>26</h2><p>1. 既然祂借着一只鸟也向我们显明祂应许的伟大，那么，那造万物的创造主使那些怀着美善信心、以信的胆量圣善事奉祂的人复活，我们岂不更当认为这是伟大而奇妙的事吗？</p><p>2. 祂在一处说：“你也必使我兴起，我也必称颂你”；又说：“我躺卧睡了，又醒了，因为你与我同在。”[52]</p><p>3. 约伯也说：“你也必使我这受尽这一切的肉身兴起。”[53]</p><h2>27</h2><p>1. 所以，让我们的灵魂在这盼望上系于那在应许中信实、在审判中公义的那一位。</p><p>2. 那吩咐人不许说谎的那一位，自己必远更加不说谎；因为在上帝那里，没有一样是不可能的，除了说谎以外。</p><p>3. 所以，愿祂的信实在我们心中复燃，让我们思想：万有都临近祂。</p><p>4. 祂以祂威严的话语立定了万有，也能以话语使它们倾覆。</p><p>5. “谁敢对祂说：你作了什么呢？谁站立得住，抵挡祂大力之权能呢？”祂什么时候愿意、以祂愿意的方式，就必行一切事；祂所定规的，没有一样不成就。[54]</p><p>6. 万有都在祂眼前，没有一样能向祂的旨意隐藏，</p><p>7. 因为“诸天述说上帝的荣耀，穹苍传扬祂手的作为；日与日发出言语，夜与夜传递知识；没有言语，没有声音，它们的声音却无人听不见”。[55]</p><h2>28</h2><p>1. 所以，既然一切都蒙祂看见、蒙祂听见，就让我们敬畏祂，抛下对恶事的污秽私欲，好叫我们靠着祂的怜悯，蒙遮蔽，免去将来的审判。</p><p>2. 我们中间谁能逃避祂那大能的手呢？有什么世界会接待那离弃祂的人呢？经上说：</p><p>3. “我往哪里去躲避你的面呢？我若升到天上，你在那里；我若往地的尽头去，你的右手也在那里；我若铺设到深渊，你的灵也在那里。”[56]</p><p>4. 那么，谁能去哪里、逃到哪里，远离那位容纳万有的呢？</p><h2>29</h2><p>1. 所以，让我们以灵魂的圣洁亲近祂，向祂举起纯洁无染的手，爱那温良仁慈的父——祂把我们立为自己之拣选的部分。</p><p>2. 因为经上这样记着：“至高者分列列国之时，把亚当的子孙分散开来，就照上帝众天使的数目立了列国的疆界；主的部份成了祂的民雅各，以色列作了祂产业的分。”[57]</p><p>3. 又在别处说：“看哪，主从列国之中取一个民归于自己，正如人取他自己麦场上的初熟之果；从那民中必有至圣的出来。”[58]</p><h2>30</h2><p>1. 所以，我们既是圣洁的部分，就要行一切属于圣洁的事：远避毁谤，远避污秽败坏的苟合、醉酒、喜新猎奇的私欲、卑劣的情欲、可憎的奸淫与可憎的骄傲。</p><p>2. 因为经上说：“上帝抵挡骄傲的人，赐恩给谦卑的人。”[59]</p><p>3. 所以，让我们与那些从上帝领受恩典的人联合。让我们穿上同心合意，存心谦卑，节制自守，远离一切窃窃私语与毁谤，以行为称义，而不是以言语。</p><p>4. “说话多的人，必得应答；难道能言善道的人就以为自己是义人吗？[60]</p><p>5. 妇人所生的，蒙福而寿短。你不要在言语上繁多。”</p><p>6. 我们的称赞当在上帝里，而不要出于我们自己：上帝憎恶自夸的人。</p><p>7. 我们善行的见证当由别人给出，正如给我们的众义祖一样。</p><p>8. 放肆与专横与大胆，归于被上帝咒诅的人；温良、谦卑与柔和，归于被上帝祝福的人。</p><h2>31</h2><p>1. 所以，让我们与祂的祝福相连，看一看：祝福的道路是什么。让我们翻查从起初发生的事。</p><p>2. 我们的先祖亚伯拉罕因何蒙福？岂不是因他在信中行了公义与真理吗？</p><p>3. 以撒怀着确信，预知将要临到的事，甘心就近献祭之事。</p><p>4. 雅各因谦卑离开了自己的地，为着兄弟的缘故，去到拉班那里服事；以色列的十二支派权杖便赐给了他。</p><h2>32</h2><p>1. 任何人若诚实地逐一审视这些事，就必认识祂所赐恩赐的伟大。</p><p>2. 从祂而有所有在上帝祭坛前事奉的司祭们与利未人；从祂而有按肉身来的主耶稣；从祂而有犹大支派的君王、首领与带领者；祂的其余权杖都在不小的荣耀之中——正如上帝曾应许说：“你的后裔必如天上的众星。”[61]</p><p>3. 所以，他们都被荣耀、被高举，不是因他们自己，不是因他们的行为，也不是因他们所成就的义行，而是因祂的旨意。</p><p>4. 我们既蒙祂的旨意呼召，在基督耶稣里蒙召，便不是靠我们自己称义，也不是靠我们的智慧、悟性、敬虔，或我们在心中圣洁里所成就的行为，而是借着信心——全能的上帝从亘古以来，正是借着它称义了众人。愿荣耀归于祂，直到世世无穷。阿们。</p><h2>33</h2><p>1. 那么，弟兄们，我们要做什么呢？要停止行善、撇下爱吗？绝不可——愿主不许这事在我们中间发生；相反，我们要怀着热切与渴慕，急速去完成一切善工。</p><p>2. 因为那造物之主与万物之主，正为祂的工作欢喜。</p><p>3. 祂以那至大的权能立定了诸天，以不可测度的智慧布置了它们；祂把地与环围它的水分开，把它安在祂自己旨意那稳固的根基上；又按祂自己的秩序，吩咐在地上的活物往来行走；祂预先造好海与海中的活物，以祂自己的能力把它们关闭在里面。</p><p>4. 在一切之上，那最卓越而至大的人，祂以神圣无瑕的双手，照自己的形像塑造了他的样式。</p><p>5. 因为上帝这样说：“我们要照着我们的形像、按着我们的样式造人。上帝就造了人：祂造了他们，男的与女的。”[62]</p><p>6. 这一切完成之后，祂称赞它们、祝福它们，说：“要生养众多。”</p><p>7. 我们也要明白：众义人都是用善行妆饰的，主自己也用善行妆饰自己而欢喜。</p><p>8. 既有这样的榜样，我们就要毫不懈怠地随从祂的旨意，并尽全身之力去行公义之事。</p><h2>34</h2><p>1. 忠心的工人坦然领取自己劳碌得来的饼；懒惰懈怠的人却不敢仰视那派给他工作的主人。</p><p>2. 所以，我们当热心行善，因为万物都是出于祂。</p><p>3. 祂预先向我们预言说：“看哪，主必来到，祂的赏赐在祂面前，要照各人的工作报应各人。”[63]</p><p>4. 所以，祂劝我们这些信祂的人，要全心仰望祂，在一切善工上不作懒惰懈怠的人。</p><p>5. 我们的夸耀与胆量当在于祂；让我们顺服祂的旨意；让我们思想祂众天使的全体，看他们如何站在祂面前，按祂的旨意事奉。</p><p>6. 因为圣经说：“万万侍立在祂面前，千千事奉于祂，并且呼喊：圣哉、圣哉、圣哉，万军之主；一切受造之物都充满祂的荣耀。”[64]</p><p>7. 所以，我们也要同心合意、心思一致地聚在一起，向祂恳切呼求，如同出于同一之口，好叫我们有份于祂那伟大而荣耀的应许。</p><p>8. 因为祂说：“眼睛未曾看见，耳朵未曾听见，人心也未曾上到：这一切是祂为那恒忍等候祂的人所预备的。”[65]</p><h2>35</h2><p>1. 上帝的恩赐是何等蒙福、何等奇妙，亲爱的诸位！</p><p>2. 不朽坏中的生命，公义中的光明，坦率中的真理，确信中的信心，圣洁中的节制；这一切都曾俯就我们的心思。</p><p>3. 那么，为那些恒忍之人预备的，究竟是什么呢？那造物之主与诸世代之父，那至圣者自己，知道它们的数目与它们的美丽。</p><p>4. 所以，让我们竭尽全力，使自己得以列在恒忍的人之中，得以有份于所应许的恩赐。</p><p>5. 亲爱的诸位，这将要怎样成就呢？1）我们若坚定心志，忠诚地向着上帝；2）若寻求祂所喜悦、所接纳的事；3）若遵行祂圣善旨意所要求的事，并行走真理之路，撇弃一切的不义与邪恶、贪婪、纷争、恶毒与诡诈、窃窃私语与毁谤、不敬虔、骄傲与自大、虚浮的荣耀与不接待客旅的心。</p><p>6. 因为行这些事的人是上帝所憎恶的，不但行的人，连赞同这些事的人也是。</p><p>7. 因为圣经说：“罪人啊，上帝对你说：你为什么讲述我的律例，把我的约放在你口中？[66]</p><p>8. 你却恨恶管教，把我的话抛在背后。你若看见贼，就与他同行，又与奸淫的人有分。你的口满出恶事，你的舌头缠绕诡诈。你坐着毁谤你的兄弟，安插你母亲的儿子的绊脚石。</p><p>9. 这些事你都作了，我却默然不言；你这不法之人以为我与你一样。</p><p>10. 我必指摘你，把这些事陈在你眼前。</p><p>11. 你们当明白这些事，那忘记上帝的人，免得祂如狮子把你撕碎，无人能救。</p><p>12. 以赞美为祭的必荣耀我；在那里是道路，我必把上帝的救恩指给他。”</p><h2>36</h2><p>1. 这就是那条道路，亲爱的诸位——我们借它寻得我们的救恩，就是耶稣基督，我们众祭献的大司祭，我们软弱的护卫者与帮助者。</p><p>2. 借着祂，我们仰望诸天的高处；借着祂，我们得见祂那无瑕而超越的景象；借着祂，我们心中的眼睛得开；借着祂，我们那愚昧、黑暗的心思，向着光发出新芽；借着祂，万物之主愿意叫我们尝那不朽知识的滋味——祂是祂威严的光辉，比众天使更大，正如祂所承受的名比他们更超越。[67]</p><p>3. 因为经上这样记着：“祂使祂的使者为灵，祂的仆役为火焰。”[68]</p><p>4. 论到祂的儿子，主又这样说：“你是我的儿子，我今日生了你；你求我，我就把列国赐给你作产业，把地的尽头赐给你作你所得的。”[69]</p><p>5. 又对祂说：“你坐在我的右边，等我使你的仇敌作你的脚凳。”</p><p>6. 那么，谁是祂的仇敌呢？就是恶人，就是抵挡祂旨意的人。</p><h2>37</h2><p>1. 所以，弟兄们，让我们在祂那无瑕的命令中，以一切的热忱服役。</p><p>2. 让我们思想那些在我们的带领者之下服役的人：他们何等整齐、何等柔顺、何等顺服地执行所分派的事。</p><p>3. 并非人人都是总督，并非人人都是千夫长、或百夫长、或五十夫长，如此等等，而是各人在自己的班次里执行君王与带领者们所吩咐的。</p><p>4. 伟大者离了微小者不能存在，微小者离了伟大者也不能存在；在万有之中有某种调和，在其中有大用。</p><p>5. 让我们看我们的身体：头离了脚什么也不是，脚离了头也是如此；我们身上最小的肢体，对整个身体也是必要而有益的；但一切一同呼吸，顺服于同一的顺服之下，好叫整个身体得蒙拯救。</p><h2>38</h2><p>1. 所以，愿我们整个身体都在基督耶稣里得保全，各人都顺服他的邻人，按他在恩赐里所立的位置。</p><p>2. 刚强的人当顾念软弱的人，软弱的人当敬重刚强的人；富足的人当向穷人施予，穷人当感谢上帝——因为祂赐给他一个人，借着他补足他的缺乏；智慧的人当在善行中、而不在言语中显出他的智慧；谦卑的人不当自己作证，而当让别人为自己作证；肉体洁净的人不可自夸，要知道那赐他节制的是另一位。</p><p>3. 所以，弟兄们，让我们思想：我们是出于怎样的材质而造成的，我们是谁、怎样进入了这个世界，那塑造我们、创造我们的那一位，把我们从怎样的坟墓与黑暗带入了祂的世界——祂在我们出生之前，就预备了祂的恩惠。</p><p>4. 我们既从祂得着这一切，就当在一切事上感谢祂；愿荣耀归于祂，直到世世无穷。阿们。</p><h2>39</h2><p>1. 愚拙而不悟、愚昧而没有教养的人讥诮我们、藐视我们，愿意在他们自己的心思中抬高自己。</p><p>2. 因为，一个必死的人能做什么呢？或土生之人的能力是什么呢？</p><p>3. 因为经上记着：“在我的眼前没有形像，我只听见气息与声音，</p><p>4. 为什么呢？难道必死的人在主面前能洁净吗？或人能从祂的工作中无可指摘吗，若他不信祂的仆人，却对祂的天使起了弯曲的念头？</p><p>5. 连天在祂面前也不洁净；何况那些住在泥土屋子里的人呢——我们自己也是出于同样的泥土。祂像蛀虫一样击打他们；从早晨到晚上，他们就不在了；因为他们不能帮助自己，就灭亡了。</p><p>6. 祂向他们吹一口气，他们就死了——因为他们没有智慧。</p><p>7. 你呼求吧，若有人肯听你；或看你若看见众天使中的哪一位圣者：怒气杀死愚昧人，嫉恨杀戮迷误的人。</p><p>8. 我看见愚昧人扎根，但他们的居所立刻被腐蚀。</p><p>9. 愿他们的儿子远离救恩；愿他们在较小的门前被折断，无人起来搭救。那为他们所预备的，义人必吃；他们自己必陷在邪恶之中，无可救药。”[70]</p><h2>40</h2><p>1. 既深信这些事，又俯身钻研上帝圣知识的深处，我们就必须按次序行主吩咐在特定时节所行的一切事。</p><p>2. 祂吩咐，献祭与礼仪不可随意举行，也不可紊乱无序，而要在特定的时节和时辰举行；</p><p>3. 至于在何处、由何人来举行，祂也以自己至高的旨意亲自指定了，使一切都圣洁地、蒙悦纳地进行，叫祂的旨意喜悦。</p><p>4. 所以，在规定时节献祭的人是蒙悦纳的、是有福的；因为他们遵行主的诫命，没有偏离。</p><p>5. 大司祭有分派给他的服事，司祭们有指定给他们的位置，利未人身上有他们的职守；在俗之人则受为百姓所定规条的约束。</p><h2>41</h2><p>1. 弟兄们，你们每一个人都要在自己的班次里蒙上帝喜悦：存着良善的良心，怀着庄重，不越出为自己所定的服事规条。</p><p>2. 弟兄们，常常献的祭、或还愿的祭、或赎罪的祭与赎愆的祭，并不是随处都献上，而是只在耶路撒冷；就是在那里，也不是在每个地方都献，而是在圣殿前、在祭坛上，并且要先由大司祭和上述的服事者查验所献之物。</p><p>3. 凡违背祂旨意行事的人，当受死刑。</p><p>4. 弟兄们，你们要看：我们蒙受的见识越大，所冒的危险就越大。</p><h2>42</h2><p>1. 众使徒受差遣，从主耶稣基督向我们传福音；耶稣基督是从上帝差来的。</p><p>2. 基督是从上帝来的，使徒们是从基督来的；这两者都是按上帝的旨意井然有序地成就的。</p><p>3. 所以，他们既领受了命令，又借我们的主耶稣基督的复活深信不疑，以上帝的话语在信心中得坚固，便怀着圣灵的丰盛，出去宣讲将要来临的上帝的国。</p><p>4. 他们各处各地、各城宣讲，便把初信的头一批人，在灵里加以考验之后，立为主教和辅祭，为将来要信的人预备。</p><p>5. 这并不是新的设立；因为许久以前，圣经就写到主教与辅祭。圣经这样说：“我要立他们的主教在公义里，立他们的辅祭在信心上。”[71]</p><h2>43</h2><p>1. 若有在基督里由上帝托付这事的人立了上述的那些人，这又何足为奇呢？可称颂的摩西——“在祂全家尽忠的仆人”——把一切吩咐给他的都记在圣书上；其余的众先知也跟从他，用自己的见证坚固他所立定的律例。[72]</p><p>2. 当关于祭司职分的纷争兴起，以色列众支派为这一荣耀的名分该归于哪一个支派而起了争议时，摩西吩咐十二个支派的首领把棍杖带来，各支派的名字写在上面；他拿了棍杖，捆起来，用各支派首领的戒指封印，放在见证帐幕里上帝的桌子上。</p><p>3. 他锁上帐幕，钥匙与棍杖一同封印，</p><p>4. 对他们说：“弟兄们，哪一支派的棍杖发芽，上帝就拣选了那支派，归祂作祭司、事奉祂。”</p><p>5. 次日清早，他召集了全以色列——六十万男子——向众支派首领展示印封，开了见证帐幕，取出棍杖：亚伦的棍杖不但发了芽，而且结了果子。</p><p>6. 亲爱的诸位，你们以为如何？摩西岂不预先知道这事将要发生吗？他当然是知道的，但他这样行，是为了以色列中不生骚乱，为了荣耀那“真实而独一的”上帝之名。愿荣耀归于祂，直到永永远远。阿们。[73]</p><h2>44</h2><p>1. 我们的众使徒也借着我们的主耶稣基督知道，将要有关于主教名分的纷争。</p><p>2. 正因这缘故，他们既领受了完全的先见，便立了上述的那些人，随后又定下规约：等他们安睡之后，别的经过考验的人便要接替他们的服事。</p><p>3. 所以，我们认为，废弃那些由使徒们亲自所立、或此后由其他可敬的人士在全会众同意之下所立之人的职分，是不公义的——他们曾无可指摘地服事基督的羊群，怀着谦卑，安静而温和，并且长久以来获得众人的称许。</p><p>4. 如果我们要废弃那些无可指摘、圣洁地献上礼物之人的主教职分，这在我们就不是小罪。</p><p>5. 可称颂的是那些在我们之前行完路程的司祭们：他们在生命结满果子、圆满成就之后离世；他们并不惧怕有人会把他们从既立的位置上挪去。</p><p>6. 因为我们看到，你们把一些度着美善生活的人，从他们无可指摘地蒙受尊荣的职分上挪去了。</p><h2>45</h2><p>1. 弟兄们，你们是热心的，为那些关乎救恩的事热衷。</p><p>2. 你们俯身研读圣善的圣经——那真实的、借着圣灵写下的经卷。</p><p>3. 你们知道，在其中没有写下不义的、歪曲的事。你们必找不到：义人曾被圣善的人弃绝。</p><p>4. 义人受了逼迫，但是被不法的；被囚禁了，但是被不虔的；被石头打，是被违法的；被杀了，是被那些心怀污秽不义嫉恨的人。</p><p>5. 他们受这些苦，却荣耀地忍受了。</p><p>6. 弟兄们，我们说什么呢？但以理岂不是被那些敬畏上帝的人扔在狮子坑里吗？</p><p>7. 或哈拿尼雅、亚撒利雅与米沙利岂不是被那些崇奉至高者威严荣耀之敬礼的人扔进火窑吗？绝不可让这样的事发生。那么，行这些事的是谁呢？是那些可憎、充满一切恶毒的人——他们的怒气发狂到这样的地步，竟把那以圣洁无瑕的心志事奉上帝的人投入凌辱之中，不知道：至高者是那以无瑕之名敬拜祂、怀着清洁良心之人的护助者与卫护者；愿荣耀归于祂，直到世世无穷。阿们。</p><p>8. 而那些怀着确信恒忍的人，承受了荣耀与尊贵；他们被高举，被上帝写进祂的记念之中，直到世世无穷。阿们。</p><h2>46</h2><p>1. 所以，弟兄们，我们也当与这样的榜样相连。</p><p>2. 因为经上记着：“你要亲近圣洁的人，因为凡亲近他们的必被圣化。”[74]</p><p>3. 又在别处说：“与无邪的人同在，你就必无邪；与拣选的人同在，你就必被拣选；与弯曲的人同在，你也必弯曲。”[75]</p><p>4. 所以，让我们与无邪而公义的人相连；这些人，就是上帝的选民。</p><p>5. 为什么你们中间有纷争、怒气、分裂、分党与战争呢？</p><p>6. 岂不是我们只有一位上帝、一位基督、一位浇灌在我们身上的恩典之灵、一个在基督里的呼召吗？</p><p>7. 为什么我们撕裂并分开基督的肢体，向自己的身体发起叛乱，落到这样的狂乱之中，以致忘记我们是彼此的肢体呢？要记念我们的主耶稣的话语；</p><p>8. 因为祂说：“那人有祸了；他不生下来倒好，胜过绊倒我拣选之人中的一个。把磨石拴在他的颈项上、沉在海里，倒比绊倒我拣选之人中的一个更好。”</p><p>9. 你们的分裂使许多人转离了道路，使许多人灰心，使许多人存疑，使我们众人忧伤——而你们的叛乱仍持续不散。</p><h2>47</h2><p>1. 你们要拿起那配受称颂的使徒保罗的书信。</p><p>2. 他在福音的开头，首先给你们写的是什么？</p><p>3. 他真实地、在灵里给你们写信，论到他自己、矶法与亚波罗——因为那时你们也生了偏袒之心。</p><p>4. 但那偏袒给你们带来了较小的罪：你们所偏袒的，是得了称许的众使徒，和在使徒们那里经过考验的人。</p><p>5. 如今你们要思想：是谁使你们转离了道路，又削减了你们那著名弟兄之爱的高贵。</p><p>6. 亲爱的诸位，听到这样的话——为着一两个人，那最稳固、最古老的哥林多教会竟向司祭们发起叛乱——是可羞耻的，极其可羞耻的，也不配在基督里的历程。</p><p>7. 这风声不但传到了我们这里，也传到那些与我们心怀两意的人那里，以致因你们的愚昧，主的名受了亵谤，而你们自己也为自己制造了危险。</p><h2>48</h2><p>1. 所以，让我们快快拔除这事，俯伏在那主宰面前，含泪恳求祂：愿祂施怜悯，与我们复和，把我们恢复到我们弟兄之爱那圣洁、无瑕的历程之中。</p><p>2. 因为这是通往生命的门——公义之门，正如经上所记：“你们要为我打开公义的门；我要从其中进入，称谢主。</p><p>3. 这是主的门；义人要从其中进入。”[76]</p><p>4. 虽然有诸多的门敞开着，但那在公义中的门，就是在基督里的这一扇：凡从其中进入、并以圣洁与公义端直自己的道路、毫无搅扰地完成一切的人，都是有福的。</p><p>5. 愿他是信实的，愿他有能力讲说知识，愿他在分辨言语上是智慧的，愿他在行为上是纯洁的；</p><p>6. 他越以为自己更大，就越应当存心谦卑，并寻求那对众人共同的益处，而不是他自己的。</p><h2>49</h2><p>1. 凡在基督里有爱的，就当行基督的诫命。</p><p>2. 谁能述说上帝之爱的维系呢？</p><p>3. 谁能配得讲说祂那美丽的伟大呢？</p><p>4. 爱把人提到的高处，是不可言说的。</p><p>5. 爱使我们与上帝相连；“爱能遮掩许多的罪”，爱凡事包容，凡事忍耐：在爱里没有粗俗，没有高傲；爱不分裂，爱不叛乱，爱在合一中行一切事；上帝的一切选民都在爱里得了完全；没有爱，就没有一件事在上帝眼中是可喜悦的。[77]</p><p>6. 主在爱中接纳了我们；因着祂对我们的爱，我们的主耶稣基督在上帝的旨意中，把祂的血为我们倾倒，把祂的肉身为我们的肉身，把祂的灵魂为我们的灵魂。</p><h2>50</h2><p>1. 你们要看，亲爱的诸位：爱是何等伟大而奇妙，它的完全没有讲说可言。</p><p>2. 谁能在爱中配得被寻见，除非上帝使他配得？所以，我们恳求、祈求祂的怜悯，好叫我们在爱中被寻见，毫无人的偏袒，无可指摘。</p><p>3. 从亚当直到今日的历世历代都过去了；但那在爱中得了完全的人，按上帝的恩典，有敬虔之人的席位——他们必在基督国度的显现中显明出来。</p><p>4. 因为经上记着：“你们要进入内室，片刻片刻，等到我的怒气与忿怒过去；我也必记念美善之日，把你们从你们的坟中兴起。”[78]</p><p>5. 亲爱的诸位，我们是有福的——若我们同心合意、在爱中行上帝的诫命，好叫我们的罪因爱而得赦免。</p><p>6. 因为经上记着：“不法得赦、罪被遮盖的人，是有福的；主不算为有罪、口中也没有诡诈的人，是有福的。”[79]</p><p>7. 这福分归于那些借着我们的主耶稣基督蒙上帝拣选的人；愿荣耀归于祂，直到世世无穷。阿们。</p><h2>51</h2><p>1. 所以，我们若因仇敌的某种陷害而跌倒犯了罪，就应当求饶恕。而那些作叛乱与分裂首领的人，也当顾念共同的盼望。</p><p>2. 因为怀着敬畏与爱心生活的人，宁愿自己遭遇不幸，也不愿让邻人遭遇；宁愿判罚落在自己身上，也不愿落在那传给我们的美好圣善的同心合意上。</p><p>3. 人宁可认自己的罪，也不要刚硬自己的心，正如那些背叛上帝的仆人摩西之人的心刚硬了一样：对他们的审判是明显的。</p><p>4. 因为他们“活着就下到了阴间”，“死亡要牧养他们”。[80]</p><p>5. 法老与他的军队、埃及的众首领、他们的战车与骑士，不是因别的缘故沉入红海而灭亡，而是因为上帝的仆人摩西在埃及行了神迹奇事之后，他们的心思仍刚硬而不悟。</p><h2>52</h2><p>1. 弟兄们，那主宰是无需万物的：祂不需要什么，只需要人向祂认信。</p><p>2. 因为蒙拣选的大卫说：“我要称谢主，这就喜悦祂，胜过献上带着角的幼公牛与蹄子；愿谦卑的人看见，并且欢喜。”[81]</p><p>3. 又说：“你要以赞美为祭献给上帝，向至高者还你的愿；并在患难之日呼求我——我必搭救你，你也必荣耀我。”[82]</p><p>4. “献给上帝的祭，是忧伤的灵。”</p><h2>53</h2><p>1. 亲爱的诸位，因为你们知道圣善的圣经，并且知道得好，也俯身于上帝的言语；所以我们写这些，是为提醒。</p><p>2. 摩西上了山，禁食谦卑四十日四十夜；上帝对他说：“你快快从这里下去，因为你的民——就是你从埃及地领出来的——已经行了不法；他们快快偏离了所吩咐他们的道路，为自己造了铸像。”</p><p>3. 主又对他说：“我曾对你说过一次、又说二次：我看了这民，看哪，他们是硬颈的；容我把他们灭绝，把他们的名从天下涂抹；我要使你成为大国，比这民更奇妙。”[83]</p><p>4. 摩西说：“主啊，断然不可：求你赦免这民的罪；否则，也把我从生命册上涂抹。”</p><p>5. 何等大的爱！何等无以超越的完全！一个仆人向主放胆直言，为众人求赦免；否则，他也配得与他们一同被涂抹。</p><h2>54</h2><p>1. 所以，你们中间谁是有刚毅的、谁是有仁慈的、谁是完全了爱的，让他这样说：</p><p>2. “若因我而起纷争、叛乱与分裂，我就退去，去你们愿意的地方，并遵行众人所吩咐的一切；只要基督的羊群与所立的司祭们平安相安。”</p><p>3. 这样行的人，必在主里为自己赢得极大的荣耀，各处都必接纳他：因为“地和其中所充满的，都是主的”。[84]</p><p>4. 凡度着可称许的神圣生活的人，从前这样行，将来也必这样行。</p><h2>55</h2><p>1. 为要我们也带来外邦人的榜样：当某种瘟疫般的时节兴起，许多君王与首领因受了神谕，就把自己交于死地，好叫他们借自己的血救他们的国民；许多人离开了他们的城，免得叛乱加增。</p><p>2. 我们知道，我们中间有许多人把自己交于捆绑，好叫他们救赎别人；许多人把自己卖为奴仆，拿所得的价钱，喂养别人。</p><p>3. 许多妇女因上帝的恩典得力，成就了许多刚勇之事。</p><p>4. 那配受称颂的友弟德，当城被围困时，求众司祭准她出到外邦人的营中去。[85]</p><p>5. 于是她把自己交于危险，因着她对困在围城中的祖国与人民的爱而出去；主就把荷罗孚尼交在一名女子的手中。</p><p>6. 不逊于此，那因信而完全的以斯帖，也把自己投入危险，为要救以色列的十二支派脱离将要临到的灭亡：她借着禁食与谦卑，恳求那遍察一切的主——诸世代的上帝；祂看见她灵魂的卑微，就拯救了她为之冒险的人民。</p><h2>56</h2><p>1. 所以，我们也当为那些陷在任何过犯中的人恳求，好叫温良与谦卑赐给他们，使他们顺服——不是顺服我们，而是顺服上帝的旨意：这样，他们那向着上帝与众圣徒、怀着怜悯的记念，就必结满果子、完全无缺。</p><p>2. 亲爱的诸位，让我们拿起管教——没有人应当为此愤慨。我们彼此所行的劝诫，是美好的、极有益处的：因为它使我们与上帝的旨意相连。</p><p>3. 圣善的话这样说：“主责打我，却不把我交于死地。”</p><p>4. “因为主所爱的，祂必管教；祂鞭打凡所收纳的儿子。”</p><p>5. “祂说：义人必以怜悯管教我，并且指摘我；罪人的油不可膏我的头。”[86]</p><p>6. 又说：“蒙主指摘的人是有福的；全能者的责备，不要拒绝：因为祂使人受苦，又重新扶起；</p><p>7. 祂击打，祂的手又医治。</p><p>8. 六次患难之中祂必搭救你，第七次恶事必不触及你。</p><p>9. 在饥荒中祂必救你脱离死亡，在战争中必救你脱离铁的手。</p><p>10. 祂必把你藏起来，脱离舌头的鞭笞，你必不惧怕临到的灾祸。</p><p>11. 你必笑看不义不法之人，也必不惧怕野兽；</p><p>12. 因为野地的兽必与你和平。</p><p>13. 随后你必知道：你的家必太平，你帐棚的居所必不犯错。</p><p>14. 你也必知道：你的后裔必众多，你的儿女如同田间的百草。</p><p>15. 你必如合时的麦子进入坟墓，如禾场上按时收聚的禾捆。”[87]</p><p>16. 你们要看，亲爱的诸位：被主管教的人有怎样的护佑——祂既是良善的父，就以祂圣善的管教管教我们，为要叫我们蒙怜悯。</p><h2>57</h2><p>1. 所以，你们这些使叛乱之始发起的人，要顺服司祭们，接受悔改的教导，屈下你们心中的膝。</p><p>2. 你们要学习顺服，除掉你们舌头那傲慢专横的自大；因为你们若在基督的羊群中被寻见为微小而可敬的，就好过因自恃高超而从祂的盼望中被弃。</p><p>3. 那至善的智慧这样说：“看哪，我要向你们说出我气息的言语；我要教导你们我的话语。[88]</p><p>4. 因为你们呼求时，你们不肯听从；我伸出言语时，你们不留心，反而使我的筹算成为无用，也不听我的指摘；所以我必在你们的灭亡中讥笑，当灾难临到你们、惊惶忽然如暴风来到、倾覆如狂风临到你们，或当患难与围困临到你们时，我必欢欣。</p><p>5. 因为到那时，你们呼求我，我却不垂听你们；恶人寻找我，却找不着：因为你们憎恨智慧，不拣选敬畏主，也不愿意留意我的筹算，反倒讥诮我的指摘。</p><p>6. 所以，你们必吃你们自己道路的果子，也必饱尝你们自己不敬虔的恶果。</p><p>7. “因为你们使孩童受冤屈，就必被杀；不敬虔的人必因被查验而灭亡；那听从我的，必怀着信赖的盼望安营，也必安稳，毫无惧怕地脱离一切的恶事。”[89]</p><h2>58</h2><p>1. 所以，让我们听从祂那至圣而荣耀的名，避开那借着智慧向不顺服之人预先说出的威胁，好叫我们怀着信赖，“在祂那至圣威严之名上安营”。</p><p>2. 你们要接受我们的劝告，你们就必不后悔。因为上帝活着，主耶稣基督活着，圣灵也活着，蒙拣选之人的信心与盼望也活着：那以谦卑、恒久温和，毫无后悔地遵行上帝所赐的律例与诫命而行的人——这人必被编入、被算在借着耶稣基督得救的人数之内；借着祂，愿荣耀归于祂，直到世世无穷。阿们。</p><h2>59</h2><p>1. 若有人不听从祂借着我们所说出的话，让他们知道：他们必把自己捆在不小的跌倒与危险之中。</p><p>2. 但我们自己要脱离这罪，恳切祈祷、恳求，求那造万物的创造主，借着祂那蒙爱的仆人耶稣基督、我们的主，在全世界上保守祂所数点的选民之数，完整无损——借着祂，祂从黑暗召我们进入光明，从蒙昧进入祂名之荣耀的认识，</p><p>3. 好叫我们的心眼得开，认识你——那在至高之处独一的至高者，安息于诸圣中的圣者；那压制骄傲者狂妄、摧毁列国筹算的；那使谦卑者升高、使高傲者降卑的；那使人富足、使人贫穷的；那使人死、使人活的；那独一之灵的恩主与一切血肉之人的上帝；那垂顾深渊的，那观看人作为的，那处于危险之人的帮助者，那绝望之人的救主，那一切属灵之物的创造者与守望者；那使列国在地上加增，又从万人中拣选那爱你的、借着蒙爱的仆人耶稣基督的人——借着祂，你教导我们，使我们成圣，使我们得尊荣。</p><p>4. 主啊，我们求你作我们的帮助者与救护者：救我们脱离患难中的我们；扶起跌倒的；向有需要的人显现；医治软弱的；使你民中走迷的回转；喂饱饥饿的；救赎我们的被囚者；扶起患病的；安慰灰心的；愿万民都知道你是独一的上帝，耶稣基督是你的仆人，“我们是你的民、你草场的羊”。[90]</p><h2>60</h2><p>1. 因为你以运行的大能显明了世界永恒的建立；主啊，你创造了大地——你在诸世代中信实，在审判中公义，在权能与威严中奇妙，在创造中智慧，在安置所造之物中明达，在所见之事中良善，在信赖你的人中恩慈；怜悯而慈悲的：求你赦免我们的不法、我们的不义、我们的过犯与错失。</p><p>2. 求你不要把你仆人与使女的每一罪都记在账上，而要以你真理的洁净洁净我们，端直我们的脚步，怀着圣洁的心行走，行那在你和我们诸掌权者眼中良善可喜悦的事。</p><p>3. 主啊，是的，愿你的面容以和平光照我们，向我们显为美善：好叫我们靠你大能的手蒙遮蔽，靠你高高的膀臂脱离一切的罪；并求你救我们脱离那无故恨我们的人。</p><p>4. 求你把合一与平安赐给我们，也赐给地上一切居住的人，正如你赐给我们那些在信与真理中圣善呼求你的先祖一样；愿我们顺服于你的全能至善之名，也顺服在地上的我们的诸君王与带领者。</p><h2>61</h2><p>1. 主啊，你以你那威严不可言说的权能赐给他们治国的权柄，好叫我们认识：那由你赐给他们的荣耀与尊贵，我们当顺服他们，毫不违背你的旨意。主啊，求你赐给他们健康、平安、合一与稳固，好叫他们无误地治理你托给他们的治权。</p><p>2. 主啊，天上的主宰，诸世代之王，你把荣耀、尊贵与地上之事的权柄赐给人的儿子们；主啊，求你端直他们的旨意，归于在你眼中良善可喜悦之事，好叫他们以和平与温良、怀着敬虔治理你所赐给他们的权柄，就蒙你的恩待。</p><p>3. 愿荣耀归于你——那独一能行这些事、并比这些更美之善事的那一位，借着我们的灵魂的大司祭与护卫者耶稣基督；借着祂，愿荣耀与威严归于你，如今并世世代代，直到世世无穷。阿们。</p><h2>62</h2><p>1. 弟兄们，关于那关乎我们敬礼的事，以及那对愿意圣善而公义地生活之人的良善生活最有益的事，我们已经充分写信给你们。</p><p>2. 因为关于信心、悔改、真实的爱、节制、明达与恒忍，我们已经处处抚扪过，提醒你们：当以公义、真理与恒忍，圣善地取悦那全能的上帝；以单纯的心、不怀怨恨，在爱与和平中，怀着恒久温和同心合意——正如我们上述的众先祖，怀着谦卑，在关乎父、上帝、创造者与一切人的事上，得了祂的喜悦。</p><p>3. 我们提醒这些事，就格外甘心，因为我们清楚知道，我们是写给忠心、极其可敬、俯身于上帝教导之言语的人。</p><h2>63</h2><p>1. 所以，能够亲近这样的、如此多的榜样，并俯下颈项、充满那顺服之位，是合宜的——好叫我们止息于那虚妄的叛乱，毫无瑕玷地抵达那在真理中摆在我们面前的目标。</p><p>2. 你们若顺服所借着圣灵写给你们的话，在为和平与合一所作的、写在这封信里的恳求中，剪除你们那不合宜的嫉恨之怒，就必使我们得着欢喜与快乐。</p><p>3. 我们也差遣了信实而明达的人——他们自幼年到皓首，都在我们中间无可指摘地度日——他们要在你们与我们之间作见证。</p><p>4. 我们行这事，是要叫你们知道：我们一切的挂虑都为着叫你们尽快和平而立，并且如今仍然如此。</p><h2>64</h2><p>1. 此外，愿那遍察一切的上帝、诸灵之主与一切血肉之主，那位拣选了主耶稣基督、又借着祂拣选我们归于祂自己独特之民的，把信心、敬畏、和平、恒忍与恒久的忍耐、节制、贞洁与明达，赐给每一个被呼召归于祂那威严圣名之人的灵魂，叫我们在祂名前蒙悦纳——借着我们的诸祭献之大司祭与护卫者耶稣基督；借着祂，愿荣耀、威严、权能与尊贵归于祂，如今并直到世世无穷。阿们。</p><h2>65</h2><p>1. 你们也要把我们所差遣的克劳狄·埃斐布与瓦勒里·比托，连同弗尔图纳图斯，在和平中、怀着喜乐，尽快送回我们这里，好叫他们快快把那为我们所切慕恳求的和平与合一报信给我们，叫我们也能更快因你们的稳固而欢喜。</p><p>2. 愿我们的主耶稣基督的恩惠与你们同在，也与凡借着祂蒙上帝呼召、处于各处的人同在；借着祂，愿荣耀、尊贵、权能与威严、永恒的宝座，从亘古直到世世无穷，归于祂。阿们。</p>
    references: |-
      <ol><li><p>“寄居”（παροικοῦσα）：原文指“客旅、侨居者”。古代基督徒以此表达自己是世上寄居者的意识；本站<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Pk4F_致腓立比人书">《致腓立比人书》</a>第1章同样用此语称呼教会。</p></li><li><p>“司祭们”（πρεσβυτέρους）：哥林多的骚乱关乎教会职分，这里指教会中按立的长老（司祭），不是泛指年长者。</p></li><li><p>“随时准备行各样的善事”：参见<a href="https://bibleox.com/zh-Hans/cn-cuv/tit/3/#L1">多 3:1</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/2tim/2/#L21">提后 2:21</a>。</p></li><li><p>出自<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/32/#L15">申 32:15</a>（七十士译本的措辞）。和合本：“但耶书仑渐渐肥胖、粗壮、光润，踢跳奔跑，便离弃造他的上帝。”</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/is/3/#L5">赛 3:5</a>（七十士译本）。和合本：“少年人必侮慢老年人，卑贱人必侮慢尊贵人。”</p></li><li><p>“死亡借着它进入了世界”：引自<a href="https://bibleox.com/zh-Hans/cn-sb/prs/2/#L24">智 2:24</a>——次经，和合本没有收录；当时教会普遍以七十士译本为圣经，次经在其中。参见<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/5/#L12">罗 5:12</a>。</p></li><li><p>七十士译本的 创 4:7 措辞与此不同；和合本：“你若行得好，岂不蒙悦纳？你若行得不好，罪就伏在门前。它必恋慕你，你却要制伏它。”（<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/4/#L7">创 4:7</a>）</p></li><li><p>彼得的殉道新约没有记载（参见<a href="https://bibleox.com/zh-Hans/cn-cuv/in/21/#L18-19">约 21:18-19</a> 的预言）；传统认为他在尼禄在位时于罗马殉道，被倒钉十字架。</p></li><li><p>保罗七次受捆绑，《使徒行传》没有记载；作者大概以同时代见证人的身份说这话。参见<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/11/#L23-27">林后 11:23-27</a> 所列的苦难。</p></li><li><p>“西方的边界”：指意大利、特别是罗马——从东方看，罗马是西部的尽头。</p></li><li><p>达奈得斯（Danaids）：阿尔戈斯王达瑙斯的女儿们，奉父命在婚夜杀死丈夫；狄尔刻斯（Dirce）：底比斯的王后，被拴在牛后拖死。作者以这两个人物形容殉道妇女所受的酷刑。</p></li><li><p>创世记没有明记挪亚宣讲悔改（参见<a href="https://bibleox.com/zh-Hans/cn-cuv/2pet/2/#L5">彼后 2:5</a> “传义道的挪亚”）；这是当时教会的传统说法。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/iez/33/#L11">结 33:11</a>（七十士译本，参见结 18:23）。和合本：“我断不喜悦恶人死亡，惟喜悦恶人转离所行的道而活。”</p></li><li><p>这段话在圣经里没有对应原文，是综合七十士译本的措辞（参见<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/103/#L11">诗 103:11</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/is/1/#L18">赛 1:18</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/ier/3/#L19">耶 3:19</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/ier/3/#L22">22</a>）。</p></li><li><p>引自<a href="https://bibleox.com/zh-Hans/cn-cuv/is/1/#L16-20">赛 1:16-20</a>（七十士译本的措辞，与和合本出入较大）。和合本：“你们要洗濯、自洁，从我眼前除掉你们的恶行，要止住作恶，学习行善，寻求公平，解救受欺压的，给孤儿伸冤，为寡妇辨屈。”</p></li><li><p>七十士译本 创 5:24：“人找不到他，因为上帝把他接去”。参见<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/11/#L5">来 11:5</a>：“他被接去，不至于见死。”</p></li><li><p>“上帝的朋友”：参见<a href="https://bibleox.com/zh-Hans/cn-cuv/is/41/#L8">赛 41:8</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/2/#L23">雅 2:23</a>；第17:2段“我是尘土与灰烬”出自<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/18/#L27">创 18:27</a>。</p></li><li><p>引自<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/12/#L1-3">创 12:1-3</a>（七十士译本，和合本措辞相近）。</p></li><li><p>引自<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/13/#L14-17">创 13:14-17</a>（七十士译本）。和合本：“你举目向东西南北观看。”</p></li><li><p>引自<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/15/#L5-6">创 15:5-6</a>。参见<a href="https://bibleox.com/zh-Hans/cn-cuv/rim/4/#L3">罗 4:3</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/17/#L32">路 17:32</a>：“你们要回想罗得的妻子。”</p></li><li><p>叙事根据<a href="https://bibleox.com/zh-Hans/cn-cuv/nav/2/#L1-21">书 2</a>（七十士译本）；把红绳解释为预表主之血，是早期教会的传统解法。</p></li><li><p>“预言”指第5段喇合的话——她预先说出上帝必把这地交给以色列人。</p></li><li><p>引自<a href="https://bibleox.com/zh-Hans/cn-cuv/ier/9/#L23-24">耶 9:23-24</a>（七十士译本）。和合本：“夸口的却因他有聪明，认识我是耶和华，又知道我喜悦在世上施行慈爱、公平和公义，以此夸口。”</p></li><li><p>主的话综合自<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L7">太 5:7</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/7/#L1-2">太 7:1-2</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L36-38">路 6:36-38</a>；按作者的记忆引述，措辞与和合本略有出入。</p></li><li><p>引自<a href="https://bibleox.com/zh-Hans/cn-cuv/is/66/#L2">赛 66:2</a>（七十士译本）。和合本：“但我所看顾的，就是虚心痛悔、因我话而战兢的人。”</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/2/#L21-22">箴 2:21-22</a>（七十士译本）。和合本：“正直人必在世上居住，完全人必在地上存留；惟有恶人必然剪除。”</p></li><li><p>引自<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/37/#L35-37">诗 37:35-37</a>（七十士诗篇第36篇）。和合本：“你要细察那完全人，观看那正直人，因为和平人有好结局。”</p></li><li><p>引自<a href="https://bibleox.com/zh-Hans/cn-cuv/is/29/#L13">赛 29:13</a>（七十士译本）。和合本：“因为这百姓亲近我，用嘴唇尊敬我，心却远离我。”</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/62/#L4">诗 62:4</a>：“他们喜爱谎话，口虽祝福，心却咒诅。”</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/78/#L36-37">诗 78:36-37</a>（七十士诗篇第77篇）。和合本：“他们却用口谄媚他，用舌向他说谎。因他们的心向他不正，在他的约上也不忠心。”</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/31/#L18">诗 31:18</a>（七十士诗篇第30篇）。和合本：“那撒谎的人逞骄傲轻慢，出狂妄的话攻击义人，愿他的嘴哑而无言。”</p></li><li><p>引自<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/12/#L3-5">诗 12:3-5</a>（七十士诗篇第11篇）。和合本12:5：“因为困苦人的冤屈和贫穷人的叹息，我现在要起来，把他安置在他所切慕的稳妥之地。”</p></li><li><p>以赛亚书第53章（七十士译本的措辞，从“主啊，谁信我们所传的呢”起）。和合本：“我们所传的有谁信呢？耶和华的膀臂向谁显露呢？”（<a href="https://bibleox.com/zh-Hans/cn-cuv/is/53/#L1">赛 53:1</a>）</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/22/#L6-7">诗 22:6-7</a>（七十士诗篇第21篇）。和合本：“但我是虫，不是人，被众人羞辱，被百姓藐视。”</p></li><li><p>“上帝的朋友”：参见<a href="https://bibleox.com/zh-Hans/cn-cuv/is/41/#L8">赛 41:8</a>；引语见<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/18/#L27">创 18:27</a>。</p></li><li><p>引自<a href="https://bibleox.com/zh-Hans/cn-cuv/iov/1/#L1">伯 1:1</a>（七十士译本）。和合本：“那人完全正直，敬畏上帝，远离恶事。”</p></li><li><p>七十士译本 伯 14:4-5 的措辞；和合本：“谁能使洁净之物出于污秽之中呢？无论谁也不能！”（<a href="https://bibleox.com/zh-Hans/cn-cuv/iov/14/#L4">伯 14:4</a>）</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/3/#L11">出 3:11</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/4/#L10">出 4:10</a>。七十士译本出 4:10 作“声弱舌迟”（ἰσχνόφωνος καὶ βραδύγλωσσος）；和合本：“我本是拙口笨舌的。”</p></li><li><p>此语不在圣经之中，出处不明。</p></li><li><p>综合<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/89/#L20">诗 89:20</a>（七十士诗篇第88篇：“我寻得我的仆人大卫，用我的圣膏膏他”）与<a href="https://bibleox.com/zh-Hans/cn-cuv/1ts/13/#L14">撒上 13:14</a>（合祂心意的人）。</p></li><li><p>诗篇第51篇（七十士诗篇第50篇）几乎全篇引用；和合本的措辞处处不同（如<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/51/#L2">诗 51:2</a>：“求你将我的罪孽洗除净尽，并洁除我的罪”）。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/iov/38/#L11">伯 38:11</a>（七十士译本）。和合本：“你只可到这里，不可越过；你狂傲的浪要到此止住。”</p></li><li><p>引自<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/20/#L27">箴 20:27</a>（七十士译本作“主的灵”）。和合本作“人的灵”：“人的灵是耶和华的灯，鉴察人的心腹。”</p></li><li><p>引自诗篇第34篇（七十士诗篇第33篇，<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/34/#L11-17">诗 34:11-17</a>）。和合本措辞略有不同（如诗 34:14：“要离恶行善，寻求和睦，一心追赶”）。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/13/#L21">箴 13:21</a>（七十士译本）。和合本：“祸患追赶罪人；义人必得善报。”</p></li><li><p>这段话在圣经中没有对应原文，出处不明。</p></li><li><p>“祂必速来，并不迟延”：参见<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/10/#L37">来 10:37</a>；“主必忽然进入祂的殿”：参见<a href="https://bibleox.com/zh-Hans/cn-cuv/mal/3/#L1">玛 3:1</a>（七十士译本措辞）。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/15/#L20">林前 15:20</a>：基督已从死里复活，成为睡了之人初熟的果子。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/15/#L36-38">林前 15:36-38</a>。</p></li><li><p>凤凰的传说见于古代东方与希腊文学；作者以当时众所周知的传说作复活的例证。</p></li><li><p>综合<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/3/#L5-6">诗 3:5-6</a>（七十士译本）。和合本：“我躺下睡觉，我醒着，耶和华都保佑我。”</p></li><li><p>引自<a href="https://bibleox.com/zh-Hans/cn-cuv/iov/19/#L26">伯 19:26</a>（七十士译本的措辞）。和合本：“我这皮肉灭绝之后，我必在肉体之外得见上帝。”</p></li><li><p>引自<a href="https://bibleox.com/zh-Hans/cn-cuv/iov/9/#L12">伯 9:12</a>（七十士译本）。和合本：“他夺取，谁能阻挡？谁敢问他：‘你作什么？’”</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/19/#L1">诗 19:1</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/139/#L8-10">诗 139:8-10</a>（七十士诗篇第138篇）。</p></li><li><p>引自<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/32/#L8-9">申 32:8-9</a>（七十士译本作“照上帝众天使的数目”）。和合本作“照以色列人的数目”。</p></li><li><p>这段话在旧约中没有对应原文，或综合了七十士译本数处的措辞。</p></li><li><p>出自<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/3/#L34">箴 3:34</a>（七十士译本）。和合本箴 3:34：“他讥诮那好讥诮的人，赐恩给谦卑的人”；但<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/4/#L6">雅 4:6</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/5/#L5">彼前 5:5</a> 引述同一经文时作“上帝阻挡骄傲的人，赐恩给谦卑的人”，与此处作者的措辞一致。</p></li><li><p>这两句话在圣经中没有对应原文，出处不明。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/15/#L5">创 15:5</a>。</p></li><li><p>引自<a href="https://bibleox.com/zh-Hans/cn-cuv/gen/1/#L26-27">创 1:26-27</a>（七十士译本，和合本措辞相近）。</p></li><li><p>综合<a href="https://bibleox.com/zh-Hans/cn-cuv/is/40/#L10">赛 40:10</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/is/62/#L11">赛 62:11</a> 与<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/22/#L12">启 22:12</a>（七十士译本措辞）。</p></li><li><p>末句“一切受造之物都充满祂的荣耀”出自七十士译本的三圣童颂歌（<a href="https://bibleox.com/zh-Hans/cn-sb/dan/3/#L52-90">但 3:52-90</a>，思高本编号；和合本但以理书没有此段）。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/2/#L9">林前 2:9</a>：“上帝为爱他的人所预备的，是眼睛未曾看见，耳朵未曾听见，人心也未曾想到的。”</p></li><li><p>引自诗篇第50篇（七十士诗篇第49篇，<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/50/#L16-23">诗 50:16-23</a>）。和合本措辞不同处较多，如诗 50:16：“上帝对恶人说：你怎敢传说我的律例？”</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/1/#L3">来 1:3</a>：“他是上帝荣耀所发的光辉。”</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/104/#L4">诗 104:4</a>。</p></li><li><p>引自<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/2/#L7-8">诗 2:7-8</a>；第5段“你坐在我的右边……”引自<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/110/#L1">诗 110:1</a>。</p></li><li><p>引自约伯记（七十士译本：第4章16节与第15章15-16节的措辞，并按当时流传的较长希腊文约伯记补充；和合本对应处见<a href="https://bibleox.com/zh-Hans/cn-cuv/iov/15/#L15">伯 15:15</a>：“在他眼前天也不洁净”）。</p></li><li><p>引自<a href="https://bibleox.com/zh-Hans/cn-cuv/is/60/#L17">赛 60:17</a>（七十士译本作“主教…辅祭”）。和合本：“以和平为你的官长，以公义为你的监督。”</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/12/#L7">民 12:7</a>（“我的仆人摩西……他是在我全家尽忠的”）；参见<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/3/#L2">来 3:2</a>、<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/3/#L5">5</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/in/17/#L3">约 17:3</a>：“认识你独一的真上帝，并且认识你所差来的耶稣基督，这就是永生。”</p></li><li><p>此话在圣经中没有对应原文，出处不明（或出自当时流传的教诲文字）。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/18/#L26-27">诗 18:26-27</a>（七十士诗篇第17篇）。和合本：“清洁的人，你以清洁待他；乖僻的人，你以弯曲待他。”</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/118/#L19-20">诗 118:19-20</a>（七十士诗篇第117篇）。和合本：“给我敞开义门，我要进去称谢耶和华！这是耶和华的门，义人要进去。”</p></li><li><p>“爱能遮掩许多的罪”：参见<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/4/#L8">彼前 4:8</a>；“凡事包容，凡事忍耐”：参见<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/13/#L4-7">林前 13:4-7</a>。</p></li><li><p>综合<a href="https://bibleox.com/zh-Hans/cn-cuv/is/26/#L20">赛 26:20</a>（“我的百姓啊，你们要来进入内室……隐藏片时，等到忿怒过去”）与<a href="https://bibleox.com/zh-Hans/cn-cuv/iez/37/#L12">结 37:12</a>（“我必开你们的坟墓，使你们从坟墓中出来”）的七十士译本措辞。</p></li><li><p>引自<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/32/#L1-2">诗 32:1-2</a>（七十士诗篇第31篇）。和合本：“得赦免其过、遮盖其罪的，这人是有福的。”</p></li><li><p>引自<a href="https://bibleox.com/zh-Hans/cn-cuv/chis/16/#L33">民 16:33</a>（“他们活活地坠落阴间”）与<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/49/#L14">诗 49:14</a>（“死亡必作他们的牧者”）——七十士译本的措辞（七十士诗篇第48篇）。</p></li><li><p>引自<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/69/#L30-32">诗 69:30-32</a>（七十士诗篇第68篇）。和合本：“我要以诗歌赞美上帝的名，以感谢称他为大。这便叫耶和华喜悦，胜似献牛……谦卑的人看见了就喜乐。”</p></li><li><p>引自<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/50/#L14-15">诗 50:14-15</a>（七十士诗篇第49篇）。</p></li><li><p>综合<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/32/#L7-14">出 32:7-14</a> 与<a href="https://bibleox.com/zh-Hans/cn-cuv/iov/33/#L14">伯 33:14</a>（“上帝说一次、两次”）的七十士译本措辞。和合本出 32:10：“你且由着我……使你的后裔成为大国。”</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/24/#L1">诗 24:1</a>（七十士诗篇第23篇，编号与和合本相差一）。和合本：“地和其中所充满的，世界和住在其间的，都属耶和华。”</p></li><li><p>友弟德的事迹载于次经《友弟德传》（思高本收录，和合本没有收录次经）；参见<a href="https://bibleox.com/zh-Hans/cn-sb/iudf/8/">友弟德传</a>第8–13章（思高本）。</p></li><li><p>第3段出处不明；第4段参见<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/3/#L12">箴 3:12</a> 与<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/12/#L6">来 12:6</a>；第5段参见<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/141/#L5">诗 141:5</a>（七十士诗篇第140篇）。</p></li><li><p>引自<a href="https://bibleox.com/zh-Hans/cn-cuv/iov/5/#L17-26">伯 5:17-26</a>（七十士译本的措辞，较和合本为长）。</p></li><li><p>引自<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/1/#L23-31">箴 1:23-31</a>（七十士译本；“智慧”以第一人称说话），至第57:7段。</p></li><li><p>自第57:7段起至第63章，亚历山大抄本中缺失，据1056年的耶路撒冷驻所抄本（Codex Hierosol. 54）补足；本译本按原书的章节次序编入正文。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/79/#L13">诗 79:13</a>（七十士诗篇第78篇）。和合本：“这样，你的民，你草场的羊，要称谢你，直到永远。”</p></li></ol><p>翻译：罗季翁·弗拉索夫（借助人工智能工具）。底本：希腊文原文（<a href="https://bibleox.com/zh-Hans/grc/w/ΚλΡμ_Κορ1">本站的希腊文版本</a>）。参考：俄文译本（普列奥布拉任斯基译本；第57:7段与第58–63章据普里谢尔科夫的译本）与英文译本（Roberts–Donaldson）。第57:7段与第58–63章在亚历山大抄本中缺失，据1056年的耶路撒冷驻所抄本补足，此处按原书章节次序编入正文。圣经链接指向本站的和合本（上帝版），次经出处指向思高本。翻译原则：作者引述圣经时按他自己所用文本的字句译出（大体上即七十士译本），与和合本措辞不同处在注中说明并附和合本链接；术语与译名沿用伊格那丢书信中文译本（司祭、辅祭、大司祭、上帝等）；段落编号依希腊文原文的章–段划分，便于按章节引用。</p>
