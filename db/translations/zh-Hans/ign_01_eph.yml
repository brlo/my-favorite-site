    title: 致以弗所人书
    meta_desc: 安提阿的圣伊格那丢（提阿弗罗斯）写给以弗所教会的书信。译自希腊文原文，附注释。
    menu: { parent: "书信", title: "致以弗所人书", priority: 1 }
    body: |-
      <h2>0</h2><p>伊格那丢[1]，又名提阿弗罗斯[2]，致亚细亚以弗所配称有福的教会：这教会在父上帝丰盛的伟大中蒙福，在万世以前[3]就被预定，要永远进入长存不变的荣耀；又在真实的受难中，按着父和我们的上帝耶稣基督的旨意，被联合、被拣选。愿你们在耶稣基督里，在无瑕的喜乐中，满得喜乐。</p>
      <h2>1</h2><p>1. 我在上帝里接纳了你们那蒙大爱的名。这名是你们凭着正直的本性，因着对我们的救主基督耶稣的信与爱而获得的。你们既是效法上帝的人，又因上帝的血[4]而重新燃起热忱，就完美地完成了与你们这一家人相称的工作。</p><p>2. 你们听说我为了共同的名和盼望[5]，从叙利亚被捆绑而来，盼望借着你们的祷告得以在罗马与野兽搏斗，好借此能够成为门徒[6]，就急忙来看我。</p><p>3. 于是我奉上帝的名，在阿尼西母身上接待了你们众人。他有难以言喻的爱，是你们在肉身中的主教[7]。我祈求你们按着耶稣基督爱他，并且你们众人都与他相似。那恩赐你们、使配得的你们有这样一位主教的，是应当称颂的。</p>
      <h2>2</h2><p>1. 至于我的同作仆人的[8]布鲁斯——他是你们按着上帝所立的辅祭，在一切事上蒙福——我祈愿他留在这里，使你们和主教得荣耀。还有克罗库斯，他配得上帝，也配得你们；我把他当作你们之爱的活榜样[9]来接待，他在各样事上使我得到安慰。愿耶稣基督的父也使他得安慰，连同阿尼西母、布鲁斯、优普罗和弗朗托；借着他们，我在爱中见到了你们众人。</p><p>2. 如果我配得，愿我常因你们得喜乐[10]。所以，你们理当用各样方法荣耀那荣耀了你们的耶稣基督，好使你们在同一的顺服中得以成全，顺服主教和司祭团[11]，在一切事上成为圣洁[12]。</p>
      <h2>3</h2><p>1. 我不是作为一个了不起的人来吩咐你们。我虽然为这名被捆绑，在耶稣基督里却还没有得以成全。我现在才开始作门徒，我对你们说话，是把你们当作我的同学[13]。其实倒是我应该由你们以信心、劝诫、忍耐和宽容来抹油，使我预备好[14]。</p><p>2. 然而，既然爱不容我对你们缄默，我就先来劝勉你们，要与上帝的心意[15]同步而行。因为耶稣基督——我们不可分离的生命——就是父的心意；照样，那些被立在地极各处的主教，也都在耶稣基督的心意之中。</p>
      <h2>4</h2><p>1. 所以，你们理当与主教的心意同步而行，你们也正是这样做。你们那名副其实、配得上帝的司祭团与主教和谐相合，如同琴弦合于竖琴。因此，在你们的同心与和谐的爱中，耶稣基督被歌颂。</p><p>2. 你们每个人也要组成一个合唱团，好在同心中和谐一致，同领上帝的音调[16]，合而为一，借着耶稣基督同声向父歌唱，使父垂听你们，并借着你们所行的善事认出你们是祂儿子的肢体。所以，你们处在无瑕的合一中是有益的，好使你们也常常有份于上帝。</p>
      <h2>5</h2><p>1. 我在短短的时间里，就与你们的主教有了这样亲密的交往——不是属人的，而是属灵的；那么，你们与他这样紧密相连，如同教会与耶稣基督、如同耶稣基督与父相连，使万事在合一中和谐，我更要称你们为有福了。</p><p>2. 谁也不要自欺：人若不在祭坛之内[17]，就缺少了上帝的饼[18]。如果一两个人的祷告尚且有这样大的力量[19]，何况主教和全教会的祷告呢？</p><p>3. 所以，那不来聚会的人已经骄傲了，并且把自己隔离了。因为经上记着：“上帝抵挡骄傲的人。”[20]所以，我们要努力不抵挡主教，好使我们顺服上帝。</p>
      <h2>6</h2><p>1. 人越看见主教沉默[21]，就越要敬畏他。因为家主派来管理自己家务的人，我们都应当像接待派他来的那位一样接待他[22]。所以很明显，我们应当看主教如同看主自己一样。</p><p>2. 阿尼西母本人也大大称赞你们在上帝里的良好秩序：你们都按着真理生活，在你们中间没有任何异端居住；除了那在真理中讲论耶稣基督的人以外，你们不听从任何人。</p>
      <h2>7</h2><p>1. 有些人惯于用恶毒的诡诈带着（基督的）名到处走，却行一些与上帝不相称的事。你们应当像躲避野兽一样躲避他们，因为他们是疯狗，暗中咬人。你们必须提防他们，因为他们难以医治。</p><p>2. 只有一位医生：既属肉身，又属灵；既是受生的，又是非受生的[23]；是在人里面的上帝[24]，是在死亡中的真生命；出于马利亚，也出于上帝；先是能受苦的，后是不能受苦的——就是我们的主耶稣基督。</p>
      <h2>8</h2><p>1. 所以，不要让任何人欺骗你们；其实你们也没有受骗，因为你们完全属于上帝。既然在你们中间没有扎根任何能折磨你们的纷争，你们就确实是按着上帝生活。我是你们的赎罪之物[25]；为你们以弗所人——这世代闻名的教会——我献上自己。</p><p>2. 属肉体的人不能行属灵的事，属灵的人也不能行属肉体的事，正如信不能行不信的事，不信也不能行信的事。然而，你们甚至在肉身中所做的事也是属灵的，因为你们在耶稣基督里行一切事。</p>
      <h2>9</h2><p>1. 我知道有些人从那里[26]经过，带着坏的教训；但你们不容他们在你们中间撒种，塞住耳朵，不接受他们所撒的。因为你们是父殿中的石头[27]，为父上帝的建筑预备好了，借着耶稣基督的起重机——就是十字架——被举到高处，用圣灵作绳索；你们的信是把你们牵引向上的，爱则是引向上帝的道路。</p><p>2. 所以，你们众人都是同行的旅伴，是承载上帝的、承载圣殿的、承载基督的、承载圣物的人[28]，在各方面都以耶稣基督的诫命为装饰。我也因你们欢喜，配得借这封信与你们交谈、与你们同乐，因为你们在人的生活中，除了上帝以外什么也不爱。</p>
      <h2>10</h2><p>1. 你们也要为其他的人[29]不住地祷告，因为他们还有悔改的希望，可以得着上帝。所以，至少要让他们从你们的行为中受教。</p><p>2. 对他们的愤怒，你们要温柔；对他们的夸口，你们要谦卑；对他们的亵渎，你们要祷告；对他们的谬误，你们要在信上坚定；对他们的粗野，你们要温和；不要急于以牙还牙。</p><p>3. 让我们以宽厚表明自己是他们的弟兄；让我们努力效法主——看谁受更多的冤屈，谁被夺去更多，谁更多地被弃绝[30]——好使魔鬼的稗子[31]不在你们中间出现，而你们在一切圣洁和节制中，在肉身和灵性上都住在耶稣基督里。</p>
      <h2>11</h2><p>1. 这是末后的时候了。所以，我们要怀着羞愧，敬畏上帝的忍耐，免得它成为我们的审判。或者我们惧怕将来的忿怒，或者我们爱慕现在的恩典——二者择一，只要在基督耶稣里被找到，进入真实的生命。</p><p>2. 离了祂，什么都与你们不相称。我在祂里面带着这些锁链——这属灵的珍珠[32]；愿我借着你们的祷告，戴着它们复活。愿我常常有份于你们的祷告，好使我在以弗所基督徒的产业中被找到；他们借着耶稣基督的大能，常与使徒们同心。</p>
      <h2>12</h2><p>1. 我知道我是谁，也知道我写信给谁。我是被定罪的，你们是蒙怜悯的；我在危险中，你们是坚立的。</p><p>2. 你们是那些为上帝被杀之人所经过的通道[33]；你们与保罗同领奥秘——他是成圣的、有见证的、配称有福的。愿我得着上帝的时候，在他的脚踪中被找到；他在每一封书信里[34]，都在基督耶稣里记念你们。</p>
      <h2>13</h2><p>1. 所以，你们要努力更频繁地聚集，向上帝举行感恩祭（圣体血圣事）[35]，并献上荣耀。因为你们若常常聚在一起，撒但的势力就被摧毁，他带来的毁灭在你们信的同心合意中被解除。</p><p>2. 没有比平安更好的了；在平安中，天上和地上的一切争战都被止息。</p>
      <h2>14</h2><p>1. 如果你们对耶稣基督有完全的信与爱，这些事就没有一件是你们不知道的。信与爱是生命的开始和终结：开始是信，终结是爱。二者合而为一，就是上帝[36]；其余一切美善的事都随之而来。</p><p>2. 宣认信仰的人不犯罪，拥有爱的人不恨人。“看果子就认出树来。”[37]照样，那些自称属基督的人，必借着他们所行的显明出来。因为现在要紧的不是宣认，而是在信的能力中坚持到底，被人找到。</p>
      <h2>15</h2><p>1. 沉默而（是基督徒），胜于说话而（不是基督徒）。教导是好的，只要说话的人也去行。所以，只有一位教师，祂“一发言，万有造成”[38]；连祂在沉默中所做的事，也都配得父。</p><p>2. 真正得着耶稣之道的人，也能听见祂的沉默，好使他成为完全的人：借着所说的去行，借着所沉默的被人认识。</p><p>3. 没有什么能瞒过主，连我们隐秘的事也都近在祂面前。所以，我们行一切事都要像祂住在我们里面一样，好使我们成为祂的殿[39]，而祂在我们里面作我们的上帝——事实正是如此，并且必将显现在我们面前。因此，我们理当爱祂。</p>
      <h2>16</h2><p>1. 我的弟兄们，不要自欺：败坏家庭的人[40]必不能承受上帝的国。</p><p>2. 如果那些在肉身上行这些事的人尚且死了，何况那以邪恶的教训败坏上帝之信仰——耶稣基督为此被钉十字架——的人呢？这样的人既已污秽，必往那不灭的火里去；听从他的人也是如此。</p>
      <h2>17</h2><p>1. 主之所以在头上受香膏[41]，是为了向教会吹送不朽坏的馨香。不要用这世代之王[42]的教训的恶臭来抹自己，免得他把你们掳去，离开那摆在你们面前的生命。</p><p>2. 我们既领受了上帝的知识——就是耶稣基督——为什么不都成为明智的人呢？我们为什么愚昧地灭亡，不认识主真实赐下的恩赐呢？</p>
      <h2>18</h2><p>1. 我的灵是为十字架的赎罪之物；十字架对不信的人是绊脚石，对我们却是救恩和永生[43]。“智者在哪里？辩士在哪里？”[44]那些所谓聪明人的夸耀又在哪里呢？</p><p>2. 因为我们的上帝耶稣基督，按着上帝的安排（救恩计划），由马利亚怀孕，出于大卫的后裔[45]，也出于圣灵。祂诞生了，也受了洗，为要借着祂的受难洁净水[46]。</p>
      <h2>19</h2><p>1. 马利亚的童贞和她的生产，以及主的死亡，都向这世代之王隐藏了：这是三个要大声宣扬的奥秘[47]，却是在上帝的静默中成就的。</p><p>2. 那么，它们是怎样向各世代显明的呢？有一颗星在天上照耀[48]，光辉胜过众星，它的光无法言喻，它的新奇令人惊讶；其余的星辰连同日月，都围绕这颗星成为合唱团，而它的光却胜过一切。于是众星惊慌：这与它们不同的新事物从何而来？</p><p>3. 从此，一切巫术都被解除，一切邪恶的捆绑都消失了；无知被除去，古老的王国被毁灭，因为上帝以人的样式显现，带来永生的更新；那在上帝那里已经完备的事，开始实现了。从此万物都被震动，因为消灭死亡的事正在筹划之中。</p>
      <h2>20</h2><p>1. 如果耶稣基督借着你们的祷告使我配得，又是祂的旨意，我将在要写给你们的第二卷小书[49]里，进一步向你们阐明我已开始讲述的、关于新人耶稣基督的安排：就是对祂的信和对祂的爱，祂的受难和复活。</p><p>2. 特别是如果主向我启示：你们众人，个个都在恩典中，奉祂的名，在同一的信里，在耶稣基督里聚集——祂按肉身是大卫的后裔，是人子，也是上帝的儿子——以不分心的意念顺服主教和司祭团，擘开同一个饼。这饼是不死之药[50]，是使人不死、而在耶稣基督里永远活着的解药。</p>
      <h2>21</h2><p>1. 我为你们，也为你们为上帝的荣耀派到士每拿的人，献上我的性命[51]；我正是从士每拿写信给你们，感谢主，爱坡旅甲如同爱你们一样。请你们记念我，如同耶稣基督记念你们一样。</p><p>2. 请你们为叙利亚的教会祷告；我从那里被捆绑押往罗马。我是那里信徒中最小的一个，却配得为上帝的荣耀被找到。愿你们在父上帝和我们共同的盼望耶稣基督里安好。</p>
    references: |-
      <ol><li><p>伊格那丢在押解途中到达士每拿时，以弗所教会派了主教阿尼西母、辅祭布鲁斯以及克罗库斯、优普罗、弗朗托去探望他（<a href="#HH-1">第1章</a>、<a href="#HH-2">第2章</a>、<a href="#HH-21">第21章</a>）。伊格那丢在这封信中感谢他们的爱，劝勉他们同心顺服主教和司祭团（第3–6章），远避错误的教训（第7–10章），并讲述基督降生成人和受难的奥秘。这封信写于士每拿（<a href="#HH-21">21:1</a>）。</p></li><li><p>希腊文 Θεοφόρος，意为“承载上帝者”。伊格那丢自己把同一个词用在所有基督徒身上（<a href="#HH-9">9:2</a>）。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/ef/1/#L4-5">弗 1:4-5</a>、<a href="https://bibleox.com/zh-Hans/cn-sb/ef/1/#L11">弗 1:11</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/act/20/#L28">宗 20:28</a>。伊格那丢称基督为“我们的上帝”（问候语、<a href="#HH-18">18:2</a>），并称祂的血为“上帝的血”。</p></li><li><p>就是为了基督的名（基督徒之名）。</p></li><li><p>伊格那丢认为，人借着殉道才成为真正的门徒（<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4R_致罗马人书#HH-4">《致罗马人书》4:2</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4R_致罗马人书#HH-5">《致罗马人书》5:3</a>）。有些抄本和古译本（俄文和英文译本也随从它们）在这里加上“那为我们舍己、当作供物和祭物献给上帝者的”（<a href="https://bibleox.com/zh-Hans/cn-sb/ef/5/#L2">弗 5:2</a>），但希腊文本中没有这句话。</p></li><li><p>“在肉身中”（ἐν σαρκί）在本站的希腊文本中脱漏了，但标准校勘本（莱特福特、霍姆斯）中有这几个字。意思是有形可见的主教，与无形的主教基督相对（<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4M_致马格尼西亚人书#HH-3">《致马格尼西亚人书》3:1-2</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4R_致罗马人书#HH-9">《致罗马人书》9:1</a>）。</p></li><li><p>σύνδουλος。伊格那丢这样称呼辅祭（<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4M_致马格尼西亚人书#HH-2">《致马格尼西亚人书》第2章</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4F_致非拉铁非人书#HH-4">《致非拉铁非人书》第4章</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4S_致士每拿人书#HH-12">《致士每拿人书》12:2</a>）。</p></li><li><p>ἐξεμπλάριον，借自拉丁文 exemplarium，意为“体现你们之爱的人”。</p></li><li><p>ὀναίμην，意为“愿我从你们得益、因你们喜乐”。这是用主教阿尼西母（Ὀνήσιμος，“有益的”）的名字作的双关语；保罗在腓利门书中也用了同样的双关语（<a href="https://bibleox.com/zh-Hans/cn-sb/fm/1/#L20">费 1:20</a>）。</p></li><li><p>πρεσβυτέριον，指在主教之下的司祭（πρεσβύτεροι，原意为“长老”）团体。在伊格那丢的书信中，主教、司祭、辅祭三个品级清楚地显明出来。</p></li><li><p>有些译本（俄文、英文译本）在这里加上“同心合意，彼此团结，众人说一样的话”（<a href="https://bibleox.com/zh-Hans/cn-sb/1kor/1/#L10">格前 1:10</a>），但希腊文本中没有这句话。</p></li><li><p>συνδιδασκαλῖται，意为“一同学习的人”；也有译本理解为“一同教导的人”。</p></li><li><p>ὑπαλειφθῆναι，好像运动员在比赛前被抹油一样，指被预备好。</p></li><li><p>γνώμη，意为“心意、意向、安排”。</p></li><li><p>χρῶμα，音乐用语，意为“音调、音色”。这是比喻众人领受上帝的音调，合而为一地歌唱。</p></li><li><p>意思是：在主教之下围绕同一个祭坛聚集的教会团契之中（<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4M_致马格尼西亚人书#HH-7">《致马格尼西亚人书》7:2</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4T_致特拉勒斯人书#HH-7">《致特拉勒斯人书》7:2</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4F_致非拉铁非人书#HH-4">《致非拉铁非人书》第4章</a>）。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/in/6/#L33">若 6:33</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/mf/18/#L19-20">玛 18:19-20</a>。</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-sb/pr/3/#L34">箴 3:34</a>（按七十士译本；思高本译自希伯来文，措辞不同）。又见<a href="https://bibleox.com/zh-Hans/cn-sb/iak/4/#L6">雅 4:6</a>、<a href="https://bibleox.com/zh-Hans/cn-sb/1pet/5/#L5">伯前 5:5</a>。</p></li><li><p>指不坚持自己权柄的温和的主教。伊格那丢把沉默看作美德（<a href="#HH-15">15:1-2</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4F_致非拉铁非人书#HH-1">《致非拉铁非人书》1:1</a>）。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/mf/21/#L33-37">玛 21:33-37</a>、<a href="https://bibleox.com/zh-Hans/cn-sb/in/13/#L20">若 13:20</a>、<a href="https://bibleox.com/zh-Hans/cn-sb/mf/10/#L40">玛 10:40</a>。</p></li><li><p>γεννητὸς καὶ ἀγέννητος，意思是：作为人，祂由马利亚所生；作为上帝，祂没有开始。后来的神学用语说圣子是由父“受生”的，因此亚他那修（《论会议》47）把这句话解释为 γενητὸς καὶ ἀγένητος“（作为人）被造的，又（作为上帝）非受造的”，并为这是正统的说法辩护。</p></li><li><p>在古代引文（亚他那修、狄奥多勒）和部分抄本中作“成为肉身的上帝”（ἐν σαρκὶ γενόμενος θεός）。</p></li><li><p>περίψημα，原意为“擦下来的垃圾”（<a href="https://bibleox.com/zh-Hans/cn-sb/1kor/4/#L13">格前 4:13</a>“人间的废物”）。当时也用作“我为你们献上自己”的献身套语。<a href="#HH-18">18:1</a>中也出现这个词。</p></li><li><p>这里没有说明这些假教师是从哪里来的。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/ef/2/#L20-22">弗 2:20-22</a>、<a href="https://bibleox.com/zh-Hans/cn-sb/1pet/2/#L5">伯前 2:5</a>。十字架被比作把石头举到高处的起重机，圣灵则是它的绳索。</p></li><li><p>这里借用异教节日游行中抬着神像和神龛行走的人的形象，说基督徒在自己里面承载着上帝、圣殿和基督（<a href="https://bibleox.com/zh-Hans/cn-sb/1kor/3/#L16">格前 3:16</a>）。这与伊格那丢自己的称号“提阿弗罗斯”是同一个词。</p></li><li><p>指不信的人和迷途的人。</p></li><li><p>意思是：在忍受冤屈上竞相效法主（<a href="https://bibleox.com/zh-Hans/cn-sb/1kor/6/#L7">格前 6:7</a>）。也有人把这句理解为是在说主：“有谁比祂受过更多的冤屈呢？”</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/mf/13/#L25">玛 13:25</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4T_致特拉勒斯人书#HH-6">《致特拉勒斯人书》6:1</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4F_致非拉铁非人书#HH-3">《致非拉铁非人书》3:1</a>。</p></li><li><p>把锁链比作作装饰的珍珠。</p></li><li><p>那些为上帝被杀的人都经过以弗所。保罗也曾在那里向以弗所的长老告别，然后前往耶路撒冷（<a href="https://bibleox.com/zh-Hans/cn-sb/act/20/#L17-38">宗 20:17-38</a>）；现在伊格那丢也走在这条路上。</p></li><li><p>保罗在许多书信中提到以弗所（<a href="https://bibleox.com/zh-Hans/cn-sb/1kor/15/#L32">格前 15:32</a>、<a href="https://bibleox.com/zh-Hans/cn-sb/1kor/16/#L8">16:8</a>、<a href="https://bibleox.com/zh-Hans/cn-sb/1tim/1/#L3">弟前 1:3</a>、<a href="https://bibleox.com/zh-Hans/cn-sb/2tim/1/#L18">弟后 1:18</a>、<a href="https://bibleox.com/zh-Hans/cn-sb/2tim/4/#L12">4:12</a>），还有专门写给以弗所人的书信。</p></li><li><p>εὐχαριστία，原意为“感恩”。这里指教会聚集举行的圣体血圣事（感恩祭）（<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4F_致非拉铁非人书#HH-4">《致非拉铁非人书》第4章</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4S_致士每拿人书#HH-7">《致士每拿人书》7:1</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4S_致士每拿人书#HH-8">《致士每拿人书》8:1</a>）。</p></li><li><p>意思是：信与爱结合在一起的地方，就有上帝同在（<a href="https://bibleox.com/zh-Hans/cn-sb/1in/4/#L16">若一 4:16</a>）。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/mf/12/#L33">玛 12:33</a>。</p></li><li><p><a href="https://bibleox.com/zh-Hans/cn-sb/ps/33/#L9">咏 33:9</a>（七十士译本为32:9）。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/1kor/3/#L16">格前 3:16</a>、<a href="https://bibleox.com/zh-Hans/cn-sb/1kor/6/#L19">6:19</a>。</p></li><li><p>οἰκοφθόροι，指行奸淫的人（<a href="https://bibleox.com/zh-Hans/cn-sb/1kor/6/#L9-10">格前 6:9-10</a>）。伊格那丢把这话用在败坏上帝之家（教会）的假教师身上。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/mf/26/#L7">玛 26:7</a>、<a href="https://bibleox.com/zh-Hans/cn-sb/mk/14/#L3">谷 14:3</a>。</p></li><li><p>指魔鬼（<a href="https://bibleox.com/zh-Hans/cn-sb/in/12/#L31">若 12:31</a>、<a href="https://bibleox.com/zh-Hans/cn-sb/1kor/2/#L6-8">格前 2:6-8</a>）。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/1kor/1/#L18">格前 1:18</a>、<a href="https://bibleox.com/zh-Hans/cn-sb/1kor/1/#L23">1:23</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/1kor/1/#L20">格前 1:20</a>。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/rim/1/#L3">罗 1:3</a>、<a href="https://bibleox.com/zh-Hans/cn-sb/2tim/2/#L8">弟后 2:8</a>。</p></li><li><p>基督借着自己的受洗和受难祝圣了水，使之成为我们受洗的水。</p></li><li><p>τρία μυστήρια κραυγῆς，直译为“呼喊的三个奥秘”，意思是：在上帝的静默中，即在祂永恒的计划中成就，后来向全世界大声宣扬的奥秘。魔鬼并非不知道基督的死，而是不知道这是上帝的计划（<a href="https://bibleox.com/zh-Hans/cn-sb/1kor/2/#L7-8">格前 2:7-8</a>）。</p></li><li><p>参见<a href="https://bibleox.com/zh-Hans/cn-sb/mf/2/#L2">玛 2:2</a>、<a href="https://bibleox.com/zh-Hans/cn-sb/mf/2/#L9-10">2:9-10</a>。</p></li><li><p>一般认为伊格那丢还没有写这卷书就殉道了。</p></li><li><p>φάρμακον ἀθανασίας，指圣体的饼（<a href="https://bibleox.com/zh-Hans/cn-sb/in/6/#L50-51">若 6:50-51</a>、<a href="https://bibleox.com/zh-Hans/cn-sb/in/6/#L54">6:54</a>、<a href="https://bibleox.com/zh-Hans/cn-sb/in/6/#L58">6:58</a>）。</p></li><li><p>ἀντίψυχον，意为“替代的生命”，即为你们献上自己的性命（<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4S_致士每拿人书#HH-10">《致士每拿人书》10:2</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4P_致坡旅甲书#HH-2">《致坡旅甲书》2:3</a>、<a href="https://bibleox.com/zh-Hans/zh-Hans/w/Ig4P_致坡旅甲书#HH-6">《致坡旅甲书》6:1</a>）。</p></li></ol>
      <p>翻译：罗季翁·弗拉索夫（借助人工智能工具）。底本：希腊文原文（<a href="https://bibleox.com/zh-Hans/grc/w/ΙγνΘ_Εφ">本站的希腊文版本</a>，明显的脱漏据莱特福特本和霍姆斯本补足）。参考：俄文译本（《早期教父文选》，布鲁塞尔，1988年）、英文译本（Roberts–Donaldson）、法文译本（Genoude，1837年）。圣经链接指向本站的思高本。</p>
