  title: 启示录的七个教会
  copy_cover: true
  body: "<h2>启示录中各教会的评价</h2><p>可以见到教会反对者的一种尝试：引用神学家约翰启示录第2-3章的内容（<a href=\"https://bibleox.com/zh-Hans/cn-cuv/otkr/2/#L1\">启 2:1</a>），论证教会已离弃真信仰。在其中，主耶稣基督向七个教会说话，指出他们的长处与缺点。其实，仔细看经文，恰恰相反：教会持守着基督的信仰；即使个别教会受到指摘，也是因他们的<strong>行为</strong>。</p><h3>1. 以弗所教会</h3><p>✅ 因行为受称赞（远离淫乱、指摘假使徒、恨恶尼哥拉一党人的行为、忍耐、为主劳苦）。</p><blockquote><p>“<strong><mark>我知道你的行为、劳碌、忍耐</mark></strong>，也知道你不能容忍恶人，<strong><mark>你也曾试验那自称为使徒却不是使徒的</mark></strong>，看出他们是假的来。 <strong><mark>你也能忍耐，曾为我的名劳苦，并不乏倦</mark></strong>。 &lt;…&gt; 然而你还有一件可取的事，就是<strong><mark>你恨恶尼哥拉一党人的行为</mark></strong>，这也是我所恨恶的。” (<a href=\"https://bibleox.com/zh-Hans/cn-cuv/otkr/2/#L2-3,6\">启 2:2-3,6</a>)</p></blockquote><p>❌ 受指摘，因为他离弃了起初的爱心；并蒙召回到它，行「起初所行的<strong>事</strong>」。</p><blockquote><p>“然而，有一件事我要责备你，就是<strong><mark>你把起初的爱心离弃了</mark></strong>。 所以应当回想你是从那里坠落的，<strong><mark>并要悔改，行起初所行的事</mark></strong>。你若不悔改，我就临到你那里，把你的灯台从原处挪去。” (<a href=\"https://bibleox.com/zh-Hans/cn-cuv/otkr/2/#L4-5\">启 2:4-5</a>)</p></blockquote><h3>2. 士每拿教会</h3><p>✅ 因行为受称赞（忍耐患难、贫穷和毁谤）。蒙召不要惧怕将要受的逼迫。应许了生命的冠冕。完全未受指摘。</p><blockquote><p>“<strong><mark>我知道你的患难、你的贫穷</mark></strong>，（你却是富足的！）也知道那自称是犹太人所说的毁谤话；其实他们不是犹太人，乃是撒但一会的人。 <strong><mark>你将要受的苦你不用怕</mark></strong>。魔鬼要把你们中间几个人下在监里，叫你们被试炼，你们必受患难十日。<strong><mark>你务要至死忠心，我就赐给你那生命的冠冕</mark></strong>。” (<a href=\"https://bibleox.com/zh-Hans/cn-cuv/otkr/2/#L9-10\">启 2:9-10</a>)</p></blockquote><h3>3. 别迦摩教会</h3><p>✅ 因行为受称赞（在逼迫的威胁下没有弃绝基督的信仰）。</p><blockquote><p>“我知道你的居所，就是有撒但座位之处。当我忠心的见证人安提帕在你们中间，撒但所住的地方，被杀之时，<strong><mark>你还坚守我的名，没有弃绝我的道</mark></strong>。” (<a href=\"https://bibleox.com/zh-Hans/cn-cuv/otkr/2/#L13\">启 2:13</a>)</p></blockquote><p>❌ 受指摘，因为他<strong>没有赶出</strong>吃祭偶像之物、行奸淫之事的尼哥拉一党人。同时，别迦摩教会并没有弃绝基督的信仰：「没有弃绝我的<strong>道</strong>」。</p><blockquote><p>“然而，有几件事我要责备你，因为在你那里，<strong><mark>有人服从了巴兰的教训</mark></strong>；这巴兰曾教导巴勒将绊脚石放在以色列人面前，<strong><mark>叫他们吃祭偶像之物，行奸淫的事</mark></strong>。 <strong><mark>你那里也有人照样服从了尼哥拉一党人的教训</mark></strong>。” (<a href=\"https://bibleox.com/zh-Hans/cn-cuv/otkr/2/#L14-15\">启 2:14-15</a>)</p></blockquote><h3>4. 推雅推喇教会</h3><p>✅ 因<strong>信心</strong>和行为（爱心、勤勉、忍耐）受称赞。</p><blockquote><p>“<strong><mark>我知道你的行为、爱心、信心、勤劳、忍耐</mark></strong>，又知道你末后所行的善事比起初所行的更多。” (<a href=\"https://bibleox.com/zh-Hans/cn-cuv/otkr/2/#L19\">启 2:19</a>)</p></blockquote><p>❌ 受指摘，因为他也没有赶出「耶洗别」，容让她引诱信徒行奸淫、吃祭偶像之物（如同别迦摩的尼哥拉一党人）。受刑罚的只有那些与耶洗别行淫的人。其余的人则受称赞：「但你们已经有的，总要持守，直等到我来」。</p><blockquote><p>“然而，有一件事我要责备你，<strong><mark>就是你容让那自称是先知的妇人耶洗别教导我的仆人，引诱他们行奸淫，吃祭偶像之物</mark></strong>。 我曾给她悔改的机会，她却不肯悔改她的淫行。 看哪，我要叫她病卧在床。<strong><mark>那些与她行淫的人，若不悔改所行的，我也要叫他们同受大患难</mark></strong>。 我又要杀死他的党类，叫众教会知道，我是那察看人肺腑心肠的，并要照你们的行为报应你们各人。 至于你们推雅推喇其余的人，就是一切不从那教训，不晓得他们素常所说撒但深奥之理的人，我告诉你们，我不将别的担子放在你们身上。 <strong><mark>但你们已经有的，总要持守，直等到我来</mark></strong>。” (<a href=\"https://bibleox.com/zh-Hans/cn-cuv/otkr/2/#L20-25\">启 2:20-25</a>)</p></blockquote><h3>5. 撒狄教会</h3><p>✅ 只有几个没有玷污自己衣服的人受称赞。</p><blockquote><p>“<strong><mark>然而在撒狄你还有几名是未曾污秽自己衣服的</mark></strong>；他们要穿白衣与我同行，因为他们是配得过的。” (<a href=\"https://bibleox.com/zh-Hans/cn-cuv/otkr/3/#L4\">启 3:4</a>)</p></blockquote><p>❌ 因其余的人，他被比作死人，因为行为不完全：「因我见你的<strong>行为</strong>在我上帝面前没有一样是完全的」。受指摘，因为他不儆醒。</p><blockquote><p>“你要写信给撒狄教会的使者说：『那有上帝的七灵和七星的说：我知道你的行为，<strong><mark>按名你是活的，其实是死的</mark></strong>。 <strong><mark>你要儆醒</mark></strong>，坚固那剩下将要衰微的，<strong><mark>因我见你的行为在我上帝面前没有一样是完全的</mark></strong>。” (<a href=\"https://bibleox.com/zh-Hans/cn-cuv/otkr/3/#L1-2\">启 3:1-2</a>)</p></blockquote><h3>6. 非拉铁非教会</h3><p>✅ 因行为受称赞（虽然力量略小，但没有弃绝基督），因持守基督忍耐的道。蒙召：「你要持守你所有的」。完全未受指摘。</p><blockquote><p>“<strong><mark>我知道你的行为，你略有一点力量</mark></strong>，也曾遵守我的道，<strong><mark>没有弃绝我的名</mark></strong>。看哪，我在你面前给你一个敞开的门，是无人能关的。 &lt;…&gt; <strong><mark>你既遵守我忍耐的道</mark></strong>，我必在普天下人受试炼的时候，保守你免去你的试炼。 <strong><mark>我必快来，你要持守你所有的</mark></strong>，免得人夺去你的冠冕。” (<a href=\"https://bibleox.com/zh-Hans/cn-cuv/otkr/3/#L8,10-11\">启 3:8,10-11</a>)</p></blockquote><h3>7. 老底嘉教会</h3><p>不受称赞。</p><p>❌ 因行为受指摘：「我知道你的<strong>行为</strong>，你也不冷也不热」。蒙召向基督买金子、衣服和眼药，并要发热心、悔改：「所以你要发热心，也要悔改」。</p><blockquote><p>“<strong><mark>我知道你的行为，你也不冷也不热</mark></strong>；我巴不得你或冷或热。 你既如温水，也不冷也不热，<strong><mark>所以我必从我口中把你吐出去</mark></strong>。 你说：我是富足，已经发了财，一样都不缺，却不知道你是那困苦、可怜、贫穷、瞎眼、赤身的。 <strong><mark>我劝你向我买火炼的金子</mark></strong>，叫你富足；<strong><mark>又买白衣穿上</mark></strong>，叫你赤身的羞耻不露出来；<strong><mark>又买眼药擦你的眼睛</mark></strong>，使你能看见。 凡我所疼爱的，我就责备管教他，<strong><mark>所以你要发热心，也要悔改</mark></strong>。” (<a href=\"https://bibleox.com/zh-Hans/cn-cuv/otkr/3/#L15-19\">启 3:15-19</a>)</p></blockquote><h2>总结</h2><p>这样：</p><ul><li><p>\U0001F7E2 士每拿教会（2）和非拉铁非教会（6）完全未受指摘。</p></li><li><p>\U0001F7E1 别迦摩教会（3）和推雅推喇教会（4）持守了信仰，但受指摘没有赶出引诱人的（尼哥拉一党人和耶洗别）。受刑罚的正是那些属于虚假教导的人。而教会本身则受称赞：「没有弃绝我的<strong>道</strong>」（别迦摩）、「但你们已经有的，总要持守，直等到我来」（推雅推喇）。</p></li><li><p>\U0001F7E0 以弗所教会（1）因敬虔和保守信仰受称赞，因离弃起初的爱心受指摘，蒙召行起初所行的<strong>事</strong>。</p></li><li><p>\U0001F7E0 撒狄教会（5）因几个保守了衣服的人受称赞，因<strong>行为</strong>的不完全受指摘。</p></li><li><p>\U0001F534 老底嘉教会（7）完全不受称赞，因<strong>行为</strong>上的不冷不热受指摘，蒙召悔改。</p></li><li><p>因为信仰，没有人受指摘，但几乎所有的都因信仰受称赞（1, 2, 3, 4, 6）。</p></li><li><p>有些教会因一件事上的欠缺受指摘，但因持守信仰受称赞（3, 4）。</p></li><li><p>另一些教会在行为上有更严重的欠缺，但在其中信仰仍然保守着（1, 5）。</p></li><li><p>最后一个教会因对<strong>行为</strong>的冷淡（不冷不热）受指摘（7）。</p></li></ul><p>或许有人以为「行为」也包括信仰。然而，那些明确持守了信仰的教会，却因行为上的欠缺受指摘（3, 4）——这几乎不给这种解释留下余地。这样，启示录中的教会受指摘不是因为信仰（作为教导），而是因为行为上的不完全。而有些教会完全未受指摘。</p>"
