  path: QR19A_刑罚与真福尺度不同
  title: 赏报的尺度不一样：刑罚与真福
  copy_cover: true
  body: <h2>阴间刑罚的不同</h2><h3>知道而违背的人，比不知道而违背的人受更重的刑罚</h3><blockquote><p>“仆人知道主人的意思，却不预备，又不顺他的意思行，<strong><mark>那仆人必多受责打</mark></strong>； 惟有那不知道的，作了当受责打的事，<strong><mark>必少受责打</mark></strong>。因为多给谁，就向谁多取；<strong><mark>多托谁，就向谁多要</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/12/#L47-48">路 12:47-48</a>)</p></blockquote><h3>假善的人要受更重的定罪</h3><blockquote><p>“<strong><mark>你们这假冒为善的文士和法利赛人有祸了</mark></strong>！因为你们侵吞寡妇的家产，假意作很长的祷告，所以要受更重的刑罚” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/23/#L14">太 23:14</a>)</p></blockquote><blockquote><p>“「你们要防备文士。他们好穿长衣游行，喜爱人在街市上问他们安，又喜爱会堂里的高位，筵席上的首座； <strong><mark>他们侵吞寡妇的家产，假意作很长的祷告。这些人要受更重的刑罚</mark></strong>！」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/20/#L46-47">路 20:46-47</a>)</p></blockquote><h3>犯罪的师傅要受更重的定罪</h3><blockquote><p>“我的弟兄们，<strong><mark>不要多人作师傅，因为晓得我们要受更重的判断</mark></strong>。 原来我们在许多事上都有过失；若有人在话语上没有过失，他就是完全人，也能勒住自己的全身。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/3/#L1-2">雅 3:1-2</a>)</p></blockquote><h3>在基督之前犯罪的城市，与基督行过明显异能却被拒绝的城市相比，在审判的日子还要容易受些</h3><blockquote><p>“但我告诉你们，<strong><mark>当审判的日子，推罗、西顿所受的比你们还容易受呢</mark></strong>！ 迦百农啊，你已经升到天上将来必坠落阴间，因为在你那里所行的异能，若行在所多玛，他还可以存到今日。 但我告诉你们：<strong><mark>当审判的日子，所多玛所受的，比你还容易受呢</mark></strong>！」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/11/#L22-24">太 11:22-24</a>)</p></blockquote><blockquote><p>“凡不接待你们、不听你们话的人，你们离开那家或是那城的时候，就把脚上的尘土跺下去。 我实在告诉你们：当审判的日子，<strong><mark>所多玛和蛾摩拉所受的，比那城还容易受呢</mark></strong>！” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/10/#L14-15">太 10:14-15</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/mk/6/#L11">可 6:11</a>)</p></blockquote><blockquote><p>“哥拉汛哪，你有祸了！伯赛大啊，你有祸了！因为在你们中间所行的异能若行在推罗、西顿，他们早已披麻蒙灰，坐在地上悔改了。 <strong><mark>当审判的日子，推罗、西顿所受的，比你们还容易受呢</mark></strong>！ 迦百农啊！你已经升到天上，将来必推下阴间。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/10/#L13-15">路 10:13-15</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/mf/11/#L20-22">太 11:20-22</a>)</p></blockquote><h3>藉他们而来诱惑的人有祸了</h3><blockquote><p>“耶稣又对门徒说：「绊倒人的事是免不了的，<strong><mark>但那绊倒人的有祸了</mark></strong>。 <strong><mark>就是把磨石拴在这人的颈项上，丢在海里，还强如他把这小子里的一个绊倒了</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/17/#L1-2">路 17:1-2</a>)</p></blockquote><h3>使信徒跌倒的人有祸了</h3><blockquote><p>“凡为我的名接待一个像这小孩子的，就是接待我。 <strong><mark>凡使这信我的一个小子跌倒的，倒不如把大磨石拴在这人的颈项上，沉在深海里</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/18/#L5-6">太 18:5-6</a>)</p></blockquote><h3>出卖基督的人有祸了；那人不生在世上倒好</h3><blockquote><p>“人子必要去世，正如经上指着他所写的，<strong><mark>但卖人子的人有祸了，那人不生在世上倒好</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/26/#L24">太 26:24</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/mk/14/#L21">可 14:21</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/lk/22/#L22">路 22:22</a>)</p></blockquote><h2>天国里真福的不同</h2><h3>赏报按善行的多少</h3><blockquote><p>“甘心事奉，好像服事主，不像服事人。 <strong><mark>因为晓得各人所行的善事</mark></strong>，不论是为奴的、是自主的，<strong><mark>都必按所行的，得主的赏赐</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/6/#L7-8">弗 6:7-8</a>)</p></blockquote><blockquote><p>“我栽种了，亚波罗浇灌了，惟有上帝叫他生长。 可见栽种的算不得什么，浇灌的也算不得什么，只在那叫他生长的上帝。 栽种的和浇灌的，都是一样。<strong><mark>但将来各人要照自己的工夫得自己的赏赐</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1kor/3/#L6-8">林前 3:6-8</a>)</p></blockquote><blockquote><p>“『<strong><mark>少种的少收，多种的多收</mark></strong>』，这话是真的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2kor/9/#L6">林后 9:6</a>)</p></blockquote><blockquote><p>“人子要在他父的荣耀里，同着众使者降临；那时候，<strong><mark>他要照各人的行为报应各人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/16/#L27">太 16:27</a>; <a href="https://bibleox.com/zh-Hans/cn-cuv/rim/2/#L5-6">罗 2:5-6</a>)</p></blockquote><blockquote><p>“你们要给人，就必有给你们的，并且<strong><mark>用十足的升斗</mark></strong>，连摇带按，上尖下流地倒在你们怀里；<strong><mark>因为你们用什么量器量给人，也必用什么量器量给你们</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/6/#L38">路 6:38</a>)</p></blockquote><h3>使徒追求更大的</h3><blockquote><p>“<strong><mark>这不是说我已经得着了</mark></strong>，已经完全了，<strong><mark>我乃是竭力追求</mark></strong>，或者可以得着基督耶稣所以得着我的。 弟兄们，<strong><mark>我不是以为自己已经得着了</mark></strong>，我只有一件事，就是忘记背后，努力面前的， <strong><mark>向着标竿直跑，要得上帝在基督耶稣里从上面召我来得的奖赏</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/fil/3/#L12-14">腓 3:12-14</a>)</p></blockquote><h3>谁遵行诫命又教训人遵行——要称为大</h3><blockquote><p>“所以，无论何人废掉这诫命中最小的一条，又教训人这样作，他在天国要称为最小的；<strong><mark>但无论何人遵行这诫命，又教训人遵行，他在天国要称为大的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/5/#L19">太 5:19</a>)</p></blockquote><h3>天国里有许多住处</h3><blockquote><p>“<strong><mark>在我父的家里，有许多住处</mark></strong>；若是没有，我就早已告诉你们了。我去原是为你们预备地方去。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/14/#L2">约 14:2</a>)</p></blockquote><h3>先知的赏赐和义人的赏赐</h3><blockquote><p>“人接待你们，就是接待我；接待我，就是接待那差我来的。 人因为先知的名接待先知，<strong><mark>必得先知所得的赏赐</mark></strong>；人因为义人的名接待义人，<strong><mark>必得义人所得的赏赐</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/10/#L40-41">太 10:40-41</a>)</p></blockquote><h3>仆人们得的赏赐不同</h3><blockquote><p>“他既得国回来，就吩咐叫那领银子的仆人来，要知道他们作生意赚了多少。 头一个上来，说：『主啊，你的一锭银子已经赚了十锭。』 主人说：『好！良善的仆人，你既在最小的事上有忠心，<strong><mark>可以有权柄管十座城</mark></strong>。』 第二个来，说：『主啊，你的一锭银子已经赚了五锭。』 主人说：『<strong><mark>你也可以管五座城</mark></strong>。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/19/#L15-19">路 19:15-19</a>)</p></blockquote><blockquote><p>“天国又好比一个人要往外国去，就叫了仆人来，<strong><mark>把他的家业交给他们</mark></strong>， <strong><mark>按着各人的才干，给他们银子，一个给了五千，一个给了二千，一个给了一千</mark></strong>，就往外国去了。 &lt;…&gt; <strong><mark>那领五千银子的又带着那另外的五千来</mark></strong>，说：『主啊，你交给我五千银子。请看，我又赚了五千。』 主人说：『好！你这又良善又忠心的仆人，你在不多的事上有忠心，我要把许多事派你管理；可以进来享受你主人的快乐。』 那领二千的也来，说：『主啊，你交给我二千银子，请看，我又赚了二千。』 主人说：『好！你这又良善又忠心的仆人，你在不多的事上有忠心，我要把许多事派你管理；可以进来享受你主人的快乐。』 那领一千的也来，说：『主啊，我知道你是忍心的人，没有种的地方要收割，没有散的地方要聚敛， 我就害怕，去把你的一千银子埋藏在地里。请看，你的原银子在这里。』 主人回答说：『你这又恶又懒的仆人！你既知道我没有种的地方要收割，没有散的地方要聚敛， 就当把我的银子放给兑换银钱的人，到我来的时候，可以连本带利收回。 <strong><mark>夺过他这一千来，给那有一万的</mark></strong>！ 因为凡有的，还要加给他，叫他有余；没有的，连他所有的也要夺过来。 把这无用的仆人丢在外面黑暗里，在那里必要哀哭切齿了。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/25/#L14-15,20-30">太 25:14-15,20-30</a>)</p></blockquote><p>*葡萄园雇工的比喻（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/20/#L1-16">太 20:1-16</a>）中，所有人得的报酬一样；这比喻是在法利赛人面前讲的（<a href="https://bibleox.com/zh-Hans/cn-cuv/mf/19/#L3">太 19:3</a>），讲它是为了叫人不至于彼此自高：来得早、劳苦更多的，不要自高于来得晚、劳苦较少的人——因为在较短的晚来的时间里，也可以获得必要的东西，所以不应灰心。</p><h3>童身者与基督有特别的亲近</h3><blockquote><p>“<strong><mark>这些人未曾沾染妇女，他们原是童身</mark></strong>。<strong><mark>羔羊无论往那里去，他们都跟随他</mark></strong>。他们是从人间买来的，作初熟的果子归与上帝和羔羊。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/otkr/14/#L4">启 14:4</a>)</p></blockquote>
