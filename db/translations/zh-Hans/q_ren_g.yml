  title: 私审判（灵魂死后的试炼）
  copy_cover: true
  body: <h2>私审判简介</h2><p><a href="https://azbyka.ru/mytarstva">私审判</a>是东正教会的一项教导：在人死后，堕落的天使企图夺取人的灵魂。这样，灵魂要经受可怕的试炼；在试炼中，上帝的天使尽力保护义人的灵魂，把他们带到上帝面前。这一教导以象征性、形象性的方式表达为若干「关卡」，灵魂在每一关上都要就某些情欲受审问。在这里，天使是施行上帝公义的工具。</p><h2>在邪恶的日子抵挡天空属灵气的恶魔，胜过一切</h2><p>魔鬼是空中掌权者的首领：</p><blockquote><p>“你们死在过犯罪恶之中，他叫你们活过来。 那时，你们在其中行事为人，随从今世的风俗，<strong><mark>顺服空中掌权者的首领</mark></strong>，就是现今在悖逆之子心中运行的邪灵。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/2/#L1-2">弗 2:1-2</a>)</p></blockquote><p>需要有所准备，以便在邪恶的日子（死亡之日）胜过一切：</p><blockquote><p>“<strong><mark>要穿戴上帝所赐的全副军装，就能抵挡魔鬼的诡计</mark></strong>。 因我们并不是与属血气的争战，乃是与那些执政的、掌权的、管辖这幽暗世界的，以及<strong><mark>天空属灵气的恶魔</mark></strong>争战。 所以，要拿起上帝所赐的全副军装，<strong><mark>好在磨难的日子抵挡</mark></strong>仇敌，<strong><mark>并且成就了一切，还能站立得住</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/6/#L11-13">弗 6:11-13</a>)</p></blockquote><h2>若无上帝的许可，魔鬼不能触及义人；他寻求获得许可来辖制他们</h2><p>魔鬼寻求如何控告或诬告人，以便辖制他：</p><blockquote><p>“撒但回答耶和华说：「人以皮代皮，情愿舍去一切所有的，保全性命。 你且伸手伤他的骨头，和他的肉，他必当面弃掉你。」 耶和华对撒但说：「<strong><mark>他在你手中，只要存留他的性命</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iov/2/#L4-6">伯 2:4-6</a>)</p></blockquote><blockquote><p>“天使长米迦勒<strong><mark>为摩西的尸首与魔鬼争辩的时候</mark></strong>，尚且不敢用毁谤的话罪责他，只说：『主责备你吧！』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iud/1/#L9">犹 1:9</a>)</p></blockquote><h2>魔鬼时刻寻找可吞吃的人</h2><blockquote><p>“务要谨守、儆醒，因为<strong><mark>你们的仇敌魔鬼，如同吼叫的狮子，遍地游行，寻找可吞吃的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1pet/5/#L8">彼前 5:8</a>)</p></blockquote><h2>天使被差遣服事那将承受救恩的人</h2><blockquote><p>“所有的天使，上帝从来对那一个说：『你坐在我的右边，等我使你仇敌作你的脚凳？』 <strong><mark>天使岂不都是服役的灵、奉差遣为那将要承受救恩的人效力吗</mark></strong>？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/evr/1/#L13-14">希 1:13-14</a>)</p></blockquote><h2>天使在死后「接去」义人的灵魂</h2><p>灵魂在与身体分离之后是会移动的。灵魂必须走完通往它将来居所的路程。</p><p>天使照管了义人拉撒路的灵魂，但对财主却没有这样的记载：</p><blockquote><p>“有一个财主，穿着紫色袍和细麻布衣服，天天奢华宴乐。 又有一个讨饭的，名叫拉撒路，浑身生疮，被人放在财主门口， 要得财主桌子上掉下来的零碎充饥，并且狗来餂他的疮。 <strong><mark>后来那讨饭的死了，被天使带去放在亚伯拉罕的怀里</mark></strong>。<strong>财主也死了，并且埋葬了</strong>。 <strong><mark>他在阴间受痛苦</mark></strong>，举目远远的望见亚伯拉罕，又望见拉撒路在他怀里， 就喊着说：『我祖亚伯拉罕哪，可怜我吧！打发拉撒路来，用指头尖蘸点水，凉凉我的舌头，因为我在这火焰里，极其痛苦。』 亚伯拉罕说：『儿啊，<strong><mark>你该回想你生前享过福，拉撒路也受过苦；如今他在这里得安慰，你倒受痛苦</mark></strong>。 不但这样，并且在你我之间，有深渊限定，以致人要从这边过到你们那边是不能的；要从那边过到我们这边也是不能的。』” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/16/#L19-26">路 16:19-26</a>)</p></blockquote><p>罪人的灵魂会在不知不觉中被取去：</p><blockquote><p>“然后要对我的灵魂说：灵魂哪，你有许多财物积存，可作多年的费用，只管安安逸逸的吃喝快乐吧！』 上帝却对他说：『<strong><mark>无知的人哪，今夜必要你的灵魂</mark></strong>，你所预备的要归谁呢？』 <strong><mark>凡为自己积财，在上帝面前却不富足的，也是这样</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lk/12/#L19-21">路 12:19-21</a>)</p></blockquote><h2>在死亡的时辰魔鬼来到基督面前，但他无物可指责基督</h2><p>在受难的前一天，基督说到魔鬼的临近；魔鬼在基督里面毫无所有，不能以罪指责他：</p><blockquote><p>“以后我不再和你们多说话，因为<strong><mark>这世界的王将到，他在我里面是毫无所有</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/in/14/#L30">约 14:30</a>)</p></blockquote><p>但对其他的人就不是这样：</p><blockquote><p>“<strong><mark>犯罪的是属魔鬼</mark></strong>，因为魔鬼从起初就犯罪。上帝的儿子显现出来，为要除灭魔鬼的作为。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1in/3/#L8">约壹 3:8</a>)</p></blockquote><h2>基督是借着云彩、经由空中升天的</h2><blockquote><p>“说了这话，他们正看的时候，<strong><mark>他就被取上升，有一朵云彩把他接去</mark></strong>，便看不见他了。 <strong><mark>当他往上去</mark></strong>，他们定睛望天的时候，忽然有两个人身穿白衣，站在旁边，说：” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/1/#L9-10">徒 1:9-10</a>)</p></blockquote><h2>基督也将同样再来</h2><blockquote><p>“我们却是天上的国民，<strong><mark>并且等候救主</mark></strong>，就是主耶稣基督从天上降临。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/fil/3/#L20">腓 3:20</a>)</p></blockquote><blockquote><p>“「加利利人哪，你们为什么站着望天呢？这离开你们被接升天的耶稣，<strong><mark>你们见他怎样往天上去，他还要怎样来</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/act/1/#L11">徒 1:11</a>)</p></blockquote>
