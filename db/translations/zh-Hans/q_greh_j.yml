  path: QS15A_贿赂
  title: 贿赂（罪）
  copy_cover: true
  body: <blockquote><p>“<strong><mark>不可受贿赂</mark></strong>，因为贿赂能叫明眼人变瞎了，又能颠倒义人的话。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ish/23/#L8">出 23:8</a>)</p></blockquote><blockquote><p>“不可屈枉正直，不可看人的外貌，<strong><mark>也不可受贿赂，因为贿赂能叫智慧人的眼变瞎了</mark></strong>，又能颠倒义人的话。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/vtor/16/#L19">申 16:19</a>)</p></blockquote><blockquote><p>“勒索使智慧人变为愚妄，<strong><mark>贿赂能败坏人的慧心</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ekl/7/#L7">传 7:7</a>)</p></blockquote><blockquote><p>“<strong><mark>恶人暗中受贿赂，为要颠倒判断</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/17/#L23">箴 17:23</a>)</p></blockquote><blockquote><p>“王藉公平，使国坚定．<strong><mark>索要贿赂，使国倾败</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/29/#L4">箴 29:4</a>)</p></blockquote><blockquote><p>“撒母耳年纪老迈，就立他儿子作以色列的士师。 &lt;…&gt; 他儿子不行他的道，<strong><mark>贪图财利，收受贿赂，屈枉正直</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/1ts/8/#L1,3">撒上 8:1,3</a>)</p></blockquote><blockquote><p>“原来不敬虔之辈必无生育；<strong><mark>受贿赂之人的帐棚必被火烧</mark></strong>。 他们所怀的是毒害，所生的是罪孽，心里所预备的是诡诈。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iov/15/#L34-35">伯 15:34-35</a>)</p></blockquote><blockquote><p>“<strong><mark>不要把我的灵魂和罪人一同除掉</mark></strong>，不要把我的性命和流人血的一同除掉， <strong><mark>他们的手中有奸恶，右手满有贿赂</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/26/#L9-10">诗 26:9-10</a>) <em>(俄文本编号为 Пс 25:9-10（圣咏编号相差一）。)</em></p></blockquote><blockquote><p>“<strong><mark>他们因有贪心，要用捏造的言语在你们身上取利</mark></strong>。他们的刑罚，自古以来并不迟延；他们的灭亡，也必速速来到。 &lt;…&gt; 行的不义，就得了不义的工价。这些人喜爱白昼宴乐，他们已被玷污，又有瑕疵，正与你们一同坐席，就以自己的诡诈为快乐。 他们满眼是淫色，止不住犯罪，引诱那心不坚固的人，<strong><mark>心中习惯了贪婪</mark></strong>，正是被咒诅的种类。 他们离弃正路，就走差了，<strong><mark>随从比珥之子巴兰的路</mark></strong>。<strong><mark>巴兰就是那贪爱不义之工价的先知</mark></strong>，” (<a href="https://bibleox.com/zh-Hans/cn-cuv/2pet/2/#L3,13-15">彼后 2:3,13-15</a>)</p></blockquote>
