- src: человекоугодие
  path: QS16A_讨人喜欢（偏心待人）
  title: 讨人喜欢（偏心待人）
  copy_cover: true
  body: <blockquote><p>“我的弟兄们，你们信奉我们荣耀的主耶稣基督，<strong><mark>便不可按着外貌待人</mark></strong>。 若有一个人带着金戒指，穿着华美衣服，进你们的会堂去，又有一个穷人，穿着肮脏衣服也进去； <strong><mark>你们就重看那穿华美衣服的人</mark></strong>，说：『请坐在这好位上』，又对那穷人说：『你站在那里』，或『坐在我脚凳下边』， <strong><mark>这岂不是你们偏心待人，用恶意断定人吗</mark></strong>？ &lt;…&gt; 经上记着说，『要爱人如己。』你们若全守这至尊的律法，才是好的； <strong><mark>但你们若按外貌待人，便是犯罪</mark></strong>，被律法定为犯法的。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iak/2/#L1-4,8-9">雅 2:1-4,8-9</a>)</p></blockquote><blockquote><p>“你们作仆人的，要凡事听从你们肉身的主人，<strong><mark>不要只在眼前事奉，像是讨人喜欢的</mark></strong>，总要存心诚实敬畏主。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/kol/3/#L22">西 3:22</a>)</p></blockquote><blockquote><p>“你们作仆人的，要惧怕战兢，用诚实的心听从你们肉身的主人，好像听从基督一般。 <strong><mark>不要只在眼前事奉，像是讨人喜欢的</mark></strong>，<strong><mark>要像基督的仆人，从心里遵行上帝的旨意</mark></strong>， <strong><mark>甘心事奉，好像服事主，不像服事人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ef/6/#L5-7">弗 6:5-7</a>)</p></blockquote><blockquote><p>“<strong>上帝打散讨好人的骨头</strong>：他们必蒙羞，因为上帝弃绝了他们。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/52/#L5">诗 52:5</a>) <em>(俄文本引用教会斯拉夫语（Пс 52:5）。)</em></p></blockquote><blockquote><p>“说：「<strong><mark>你们审判不秉公义，徇恶人的情面，要到几时呢</mark></strong>？” (<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/82/#L2">诗 82:2</a>) <em>(俄文本编号为 Пс 81:2（圣咏编号相差一）。)</em></p></blockquote><blockquote><p>“你们施行审判，不可行不义；<strong><mark>不可偏护穷人，也不可重看有势力的人</mark></strong>。只要按着公义审判你的邻舍。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/lev/19/#L15">利 19:15</a>)</p></blockquote><blockquote><p>“以下也是智慧人的箴言：<strong><mark>审判时看人情面是不好的</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/24/#L23">箴 24:23</a>)</p></blockquote><blockquote><p>“<strong><mark>看人的情面，乃为不好</mark></strong>；人因一块饼枉法，也为不好。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/pr/28/#L21">箴 28:21</a>)</p></blockquote><blockquote><p>“<strong>必披上正义，当作胸甲：戴上了正直的判断，当作钢盔</strong>，” (<a href="https://bibleox.com/zh-Hans/cn-sb/prs/5/#L19">智 5:19</a>) <em>(俄文本为 Прем 5:18。)</em></p></blockquote><blockquote><p>“……你若真有羞恶之心，就必能受到众人的爱戴。对于下列的事，你不应该羞愧：<strong>不该因顾情面而犯罪过</strong>；对于至高者的法律和盟约；对于不虔敬者所下的判断；……” (<a href="https://bibleox.com/zh-Hans/cn-sb/prsir/42/#L1-2">德 42:1-2</a>)</p></blockquote><blockquote><p>“「所以我使你们被众人藐视，看为下贱，<strong><mark>因你们不守我的道，竟在律法上瞻徇情面</mark></strong>。」” (<a href="https://bibleox.com/zh-Hans/cn-cuv/mal/2/#L9">玛 2:9</a>)</p></blockquote><blockquote><p>“这些人是私下议论、常发怨言的，随从自己的情欲而行，口中说夸大的话，<strong><mark>为得便宜谄媚人</mark></strong>。” (<a href="https://bibleox.com/zh-Hans/cn-cuv/iud/1/#L16">犹 1:16</a>)</p></blockquote>
