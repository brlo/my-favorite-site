verses:
  1: "バビロンについての、アモツの子[こ]、イザヤが見[み]た幻[まぼろし]。"
  2: "平[たい]らな山[やま]の上[うえ]にしるしを上[あ]げよ。彼[かれ]らに向[む]かって声[こえ]を高[たか]くせよ。恐[おそ]れるな。手[て]で招[まね]け。門[もん]を開[ひら]け、支配者[しはいしゃ]たちよ。"
  3: "「わたしが命[めい]じ、わたしが彼[かれ]らを導[みちび]く。彼らは聖[せい]とされた者[もの]である。わたしが彼らを導く。巨人[きょじん]たちが、わたしの怒[いか]りを満[み]たすために、喜[よろこ]びながら、また侮[あなど]りながら来[く]る。」"
  4: "山々[やまやま]に多[おお]くの民[たみ]の声[こえ]がある。多[おお]くの民[たみ]の声[こえ]のようだ。王[おう]たちの声、集[あつ]まった民[たみ]の声。万軍[ばんぐん]の主[しゅ]が、武具[ぶぐ]を取[と]る民[たみ]に命[めい]じられた。"
  5: "遠[とお]い地[ち]から、天[てん]の基[もと]の果[は]てから、主[しゅ]とその武具[ぶぐ]を取[と]る者[もの]たちが来[く]る。全[ぜん]世界[せかい]を滅[ほろ]ぼすためである。"
  6: "泣[な]き叫[さけ]べ。主[しゅ]の日[ひ]が近[ちか]いからだ。神[かみ]からの破滅[はめつ]が来[く]る。"
  7: "それゆえ、すべての手[て]は力[ちから]を失[うしな]い、すべての人間[にんげん]の魂[たましい]は恐[おそ]れおののく。"
  8: "使者[ししゃ]たちはうろたえ、産[さん]みの苦[くる]しみが、子[こ]を産[う]む女[おんな]のように彼[かれ]らを襲[おそ]う。彼らは互[たが]いに苦[くる]しみ、恐[おそ]れに打[う]たれ、その顔[かお]は炎[ほのお]のように変[か]わる。"
  9: "見[み]よ、主[しゅ]の日[ひ]が来[く]る。癒[いや]すことのできない憤[いきどお]りと怒[いか]りの日が、全[ぜん]世界[せかい]を荒[あ]れ果[は]てたものとし、罪人[つみびと]たちをそこから滅[ほろ]ぼすために来[く]る。"
  10: "天[てん]の星[ほし]も、オリオンも、天[てん]の飾[かざ]りすべても、その光[ひかり]を放[はな]たない。太陽[たいよう]は昇[のぼ]る時[とき]に暗[くら]くなり、月[つき]はその光[ひかり]を放[はな]たない。"
  11: "「わたしは全[ぜん]世界[せかい]に災[わざわ]いを命[めい]じ、悪[あく]しき者[もの]たちにはその罪[つみ]を報[むく]いる。わたしは不法[ふほう]な者[もの]の高[たか]ぶりを滅[ほろ]ぼし、傲慢[ごうまん]な者[もの]の高ぶりを低[ひく]くする。」"
  12: "残[のこ]された者[もの]は、火[ひ]を通[とお]していない金[きん]よりも尊[とうと]く、人[ひと]はスフィルの石[いし]よりも尊[とうと]くなる。"
  13: "天[てん]は怒[いか]り、地[ち]はその基[もと]から揺[ゆ]れ動[うご]く。万軍[ばんぐん]の主[しゅ]の憤[いきどお]りの激[はげ]しさのゆえ、その怒[いか]りが臨[のぞ]む日[ひ]には。"
  14: "残[のこ]された者[もの]は、逃[に]げる鹿[しか]のように、迷[まよ]い出[で]た羊[ひつじ]のようになる。集[あつ]める者[もの]はだれもいない。人[ひと]はそれぞれ自分[じぶん]の民[たみ]のもとへ帰[かえ]り、自分[じぶん]の国[くに]へ逃[に]げる。"
  15: "捕[と]らえられた者[もの]は打[う]たれ、集[あつ]められた者[もの]たちは剣[つるぎ]で倒[たお]れる。"
  16: "彼[かれ]らの子[こ]どもは彼らの目の前[まえ]で打[う]ち砕[くだ]かれ、その家[いえ]は奪[うば]われ、その妻[つま]たちは取[と]られる。"
  17: "「見[み]よ、わたしはあなたがたに対してメディア人[じん]を起[お]こす。彼らは銀[ぎん]を物[もの]とも思わず、金[きん]を必要[ひつよう]ともしない。」"
  18: "若者[わかもの]の矢[や]を砕[くだ]き、あなたがたの子[こ]どもをあわれまない。その目[め]は子[こ]どもを惜[お]しまない。"
  19: "バビロンは、カルデア人[じん]の王[おう]が栄光[えいこう]ある都[みやこ]と呼[よ]ぶ都であるが、神[かみ]がソドムとゴモラを覆[くつがえ]したように覆[くつがえ]される。"
  20: "そこには永遠[えいえん]にだれも住[す]まない。多[おお]くの代[よ]を経[へ]ても、だれもそこに入[はい]らず、アラビア人[じん]もそこを通[とお]らず、羊飼[ひつじか]いもそこに休[やす]まない。"
  21: "そこには野獣[やじゅう]が伏[ふ]し、家々[いえいえ]は物音[ものおと]で満[み]ち、セイレーンがそこに住[す]みつき、悪霊[あくりょう]がそこで踊[おど]る。"
  22: "オノケンタウロスがそこに住[す]み、ハリネズミがその家[いえ]に巣[す]を作[つく]る。時[とき]は速[はや]く来[く]る。遅[おく]れることはない。"

notes:
  1: "Ὅρασις ἣν εἶδεν Ησαιας υἱὸς Αμως κατὰ Βαβυλῶνος — «видение, которое видел Исаия, сын Амоса, о Вавилоне»: ὅρασις — 幻 (видение); κατά с род. — «против, о». Надписание, не речь; кавычек нет."
  2: "Ἐπ᾽ ὄρους πεδινοῦ — «на горе равнинной», т. е. открытой, не скрытой (平らな山). ἄρατε σημεῖον — «поднимите знак» (σημεῖον — しるし; в контексте знамя). ὑψώσατε τὴν φωνήν — «возвысьте голос»; μὴ φοβεῖσθε — «не бойтесь». παρακαλεῖτε τῇ χειρί — «поощряйте рукой», т. е. машите (手で招け). Ἀνοίξατε, οἱ ἄρχοντες — «отворите, князья»: дополнение не названо; ru «в ворота властелинов» — по МТ, поэтому в тексте 門を開け, а не добавленное из МТ уточнение."
  3: "ἐγὼ συντάσσω — «Я повелеваю, строю»; ἡγιασμένοι εἰσίν — «они освящены», т. е. отделены для войны. γίγαντες — «исполины» (слав.), 巨人; πληρῶσαι τὸν θυμόν μου — «исполнить ярость Мою»; χαίροντες ἅμα καὶ ὑβρίζοντες — «радуясь вместе и надмеваясь, ругаясь». LXX повторяет «καὶ ἐγὼ ἄγω αὐτούς» дважды, слав. — один раз; повтор сохранён."
  4: "φωνὴ ἐθνῶν πολλῶν ἐπὶ τῶν ὀρέων — «голос народов многих на горах»; ὁμοία ἐθνῶν πολλῶν — «подобен [голосу] народов многих» (φωνή не повторено, сравнение сохранено). φωνὴ βασιλέων καὶ ἐθνῶν συνηγμένων — «голос царей и народов собравшихся». κύριος σαβαωθ — 万軍の主; ἐντέταλται — perfect «заповедал»; ἔθνει ὁπλομάχῳ — «народу оружеборному, воинственному» (武具を取る民)."
  5: "ἔρχεσθαι — инфинитив при ἐντέταλται (13:4): «повелел прийти». ἐκ γῆς πόρρωθεν — «из земли издалека»; ἀπ᾽ ἄκρου θεμελίου τοῦ οὐρανοῦ — «от края основания неба». κύριος καὶ οἱ ὁπλομάχοι αὐτοῦ — «Господь и оруженосцы Его»; τοῦ καταφθεῖραι τὴν οἰκουμένην ὅλην — «чтобы погубить всю вселенную»."
  6: "ὀλολύζετε — «рыдайте, вопите»; ἐγγὺς ἡ ἡμέρα κυρίου — «близок день Господень»; συντριβή — «сокрушение»; παρὰ τοῦ θεοῦ ἥξει — «от Бога придёт»."
  7: "ἐκλυθήσεται — «расслабнет, ослабеет» (ἐκλύω); δειλιάσει — «оробеет, устрашится» (δειλιάω); πᾶσα ψυχὴ ἀνθρώπου — «всякая душа человеческая» (魂)."
  8: "ταραχθήσονται — «смутятся»; οἱ πρέσβεις — «послы, старцы» (使者). ὠδῖνες — «родовые муки» (産みの苦しみ); ὡς γυναικὸς τικτούσης — «как у рождающей женщины». συμφοράσουσιν ἕτερος πρὸς τὸν ἕτερον — «будут терзаться друг с другом» (слав. «поскорбят друг ко другу»); ἐκστήσονται — «ужаснутся, выйдут из себя»; τὸ πρόσωπον ὡς φλόξ — «лицо как пламя»."
  9: "ἀνίατος — «неисцельный» (癒やすことのできない); ἡμέρα ... θυμοῦ καὶ ὀργῆς — «день ярости и гнева»; θεῖναι τὴν οἰκουμένην ὅλην ἔρημον — «положить всю вселенную пустой»; ἀπολέσαι ἐξ αὐτῆς — «погубить из неё». Слав. «(всю)» в скобках — редакционная помета, не внесена."
  10: "οἱ ἀστέρες τοῦ οὐρανοῦ καὶ ὁ Ὠρίων καὶ πᾶς ὁ κόσμος τοῦ οὐρανοῦ — «звёзды неба, и Орион (オリオン), и всё украшение неба», т. е. светила; τὸ φῶς οὐ δώσουσιν — «света не дадут». σκοτισθήσεται τοῦ ἡλίου ἀνατέλλοντος — «помрачится восходящее солнце» (родительный при глаголе); ἡ σελήνη οὐ δώσει τὸ φῶς αὐτῆς — «луна не даст света своего»."
  11: "ἐντελοῦμαι τῇ οἰκουμένῃ κακά — «повелю вселенной бедствия», т. е. наведу зло; τοῖς ἀσεβέσιν τὰς ἁμαρτίας αὐτῶν — «нечестивым грехи их», т. е. воздам за них. ὕβριν ἀνόμων — «надменность беззаконных» (слав. «укоризну»); ὕβριν ὑπερηφάνων ταπεινώσω — «надменность гордых смирю». Слова Господа, поэтому 『…』 нет — это первый уровень 「…」."
  12: "οἱ καταλελειμμένοι — «оставленные»; ἔντιμοι — «драгоценные, почтенные»; χρυσίον ἄπυρον — «золото нежжёное», не прошедшее огонь (火を通していない金); λίθος ὁ ἐκ Σουφιρ — «камень из Суфира» (Офир; слав. «суфира»)."
  13: "ὁ οὐρανὸς θυμωθήσεται — «небо разъярится»; ἡ γῆ σεισθήσεται ἐκ τῶν θεμελίων αὐτῆς — «земля потрясётся от оснований своих»; διὰ θυμὸν ὀργῆς κυρίου σαβαωθ — «из-за ярости гнева Господа Саваофа»; τῇ ἡμέρᾳ ᾗ ἂν ἐπέλθῃ ὁ θυμὸς αὐτοῦ — «в день, когда придёт гнев Его»."
  14: "δορκάδιον φεῦγον — «бегущая серна, косуля» (鹿); πρόβατον πλανώμενον — «овца заблудшая»; ὁ συνάγων — «собирающий». ὥστε ἄνθρωπον ... ἀποστραφῆναι — «так что человек обратится»; εἰς τὴν χώραν αὐτοῦ διῶξαι — «в страну свою побежит» (διώκω здесь «бежать», как в слав. «побегнет»)."
  15: "ὃς ἂν ἁλῷ — «кто будет схвачен» (ἁλίσκομαι); ἡττηθήσεται — «будет поражён, побеждён»; οἵτινες συνηγμένοι εἰσίν — «кто собран»; μαχαίρᾳ πεσοῦνται — «падут от меча»."
  16: "τὰ τέκνα αὐτῶν ἐνώπιον αὐτῶν ῥάξουσιν — «детей их пред ними разобьют» (ῥήγνυμι); προνομεύσουσιν — «разграбят» (слав. «пленят»); τὰς γυναῖκας αὐτῶν ἕξουσιν — «жён их возьмут»."
  17: "ἐπεγείρω ὑμῖν τοὺς Μήδους — «возбуждаю на вас мидян» (ὑμῖν — датив противодействия; メディア人). οἳ οὐ λογίζονται ἀργύριον — «которые не считают серебра», не дорожат им (銀を物とも思わず); οὐδὲ χρυσίου χρείαν ἔχουσιν — «и золота не имеют нужды»."
  18: "τοξεύματα νεανίσκων συντρίψουσιν — «стрелы юношей сокрушат» (слав. «стреляния юношеская»); τὰ τέκνα ὑμῶν οὐ μὴ ἐλεήσωσιν — «детей ваших не помилуют»; οὐδὲ ἐπὶ τοῖς τέκνοις οὐ φείσονται οἱ ὀφθαλμοὶ αὐτῶν — «и над детьми не пощадят глаза их». Слав. «чад твоих» (ед. ч.) вместо «ваших» — мелкое расхождение."
  19: "ἣ καλεῖται ἔνδοξος ὑπὸ βασιλέως Χαλδαίων — «которая называется славной от царя халдеев», т. е. царём халдейским (カルデア人の王が…と呼ぶ都). ὃν τρόπον κατέστρεψεν ὁ θεός — «как ниспроверг Бог»; Σοδομα καὶ Γομορρα — ソドム、ゴモラ."
  20: "οὐ κατοικηθήσεται εἰς τὸν αἰῶνα χρόνον — «не будет населён в вечное время»; οὐδὲ μὴ εἰσέλθωσιν ... διὰ πολλῶν γενεῶν — «и не войдут через многие роды»; Ἄραβες — アラビア人; ποιμένες οὐ μὴ ἀναπαύσωνται — «пастухи не успокоятся» (羊飼いも休まない)."
  21: "θηρία — «звери» (野獣); ἐμπλησθήσονται αἱ οἰκίαι ἤχου — «наполнятся домы шума, воя» (物音); σειρῆνες — «сирены» (セイレーン, как в Иов 30:29); δαιμόνια ἐκεῖ ὀρχήσονται — «бесы там будут плясать» (悪霊が踊る)."
  22: "ὀνοκένταυροι — «ослоногие», мифические существа (слав. «онокентавры») — オノケンタウロス; νοσσοποιήσουσιν — «сведут гнёзда»; ἐχῖνοι — «ежи» (ハリネズミ). ταχὺ ἔρχεται καὶ οὐ χρονιεῖ — «скоро придёт и не замедлит» (遅れることはない); слав. эту фразу переносит в начало 14:1 («Скоро идет и не умедлит»), поэтому слав. 13:22 короче на эту фразу."
