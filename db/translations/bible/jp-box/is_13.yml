# jp-box, Исаия, глава 13. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для гл. 13–14 есть фрагментом, но в выгрузку
# не входил и не использовался; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 13: 1 надписание; 2–5 сбор войск; 6–13 день Господень; 14–16 бегство и гибель;
# 17–22 мидяне и запустение Вавилона. Слова Господа от первого лица — 「…」 в 13:3,
# 13:11 и 13:17 (вводных формул в LXX нет; в 13:2 — пророческое повеление без кавычек).
# Остальное — пророческое описание без кавычек. Красного и синего нет.
# Нумерация по gr: 22 стиха; число стихов совпадает с csl-ru и ru, но слав. 13:22 короче:
# его последнюю фразу «ταχὺ ἔρχεται καὶ οὐ χρονιεῖ» слав. переносит в начало 14:1
# («Скоро идет и не умедлит»), поэтому слав. 14:1 начинается с неё.
# 〔…〕 нет. Слав. «(всю)» в 13:9 — редакционная помета в скобках, не внесена.
# Сносок ⟨…⟩ нет: 幻, しるし, 巨人, 魂, 産みの苦しみ, セイレーン, 悪霊 уже в корпусе.
# Имена — транслитерация греческого (LXX): バビロン, カルデア人, メディア人, オリオン,
# スフィル, アラビア人, ソドム, ゴモラ. Новые слова: オノケンタウロス, ハリネズミ.

