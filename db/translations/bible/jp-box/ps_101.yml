# jp-box, Псалтирь, псалом 101. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0.
# Псалом 101: молитва страждущего — вопль и изнеможение (1–12), упование
# на помилование Сиона (13–18), спасение узников и хвала (19–23),
# слова псалмопевца о краткости дней и о вечности Бога (24–28).
# Красного и синего нет: слова о вечности Бога — пророчество, а не евангельская
# речь Христа (ср. Евр 1:10–12, где они приложены к Сыну).
# Кавычки: слова, приведённые в ст. 23, — 「…」 (первый уровень).
# 〔…〕 нет: всё переведено по gr-lxx-byz, добавлений Церкви не вносилось.
# セラ (διάψαλμα) в этой главе нет.
# Сносок ⟨…⟩ нет: ペリカン, ふくろう, 廃墟, 足台 понятны; 嗣業, 契約 уже в корпусе.
