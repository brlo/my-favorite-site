verses:
  0: "貧[まず]しい者[もの]の祈[いの]り。彼[かれ]が気[き]力[りょく]を失[うしな]い、主[しゅ]の前[まえ]にその願[ねが]いを注[そそ]ぎ出[だ]すときのもの。"
  1: "主[しゅ]よ、わたしの祈[いの]りを聞[き]いてください。わたしの叫[さけ]びがあなたに届[とど]きますように。"
  2: "わたしからあなたの顔[かお]を背[そむ]けないでください。わたしが苦[くる]しむ日[ひ]には、わたしに耳[みみ]を傾[かたむ]けてください。わたしがあなたを呼[よ]ぶ日[ひ]には、速[すみ]やかにわたしを聞[き]いてください。"
  3: "わたしの日[ひ]々[び]は煙[けむり]のように消[き]え、わたしの骨[ほね]は薪[まき]のように焼[や]け焦[こ]げた。"
  4: "わたしの心[こころ]は打[う]たれて草[くさ]のように枯[か]れ、わたしはパンを食[た]べることを忘[わす]れた。"
  5: "わたしの嘆[なげ]きの声[こえ]によって、わたしの骨[ほね]は肉[にく]に張[は]り付[つ]いた。"
  6: "わたしは荒野[あらの]のペリカンのようになり、廃[はい]虚[きょ]にいるふくろうのようになった。"
  7: "わたしは目[め]を覚[さ]まし、屋根[やね]の上[うえ]にひとり残[のこ]った小鳥[ことり]のようになった。"
  8: "わたしの敵[てき]は一日中[いちにちじゅう]、わたしをそしり続[つづ]け、わたしをほめる者[もの]たちもわたしに逆[さか]らって誓[ちか]った。"
  9: "わたしは灰[はい]をパンのように食[た]べ、わたしの飲[の]み物[もの]に涙[なみだ]を混[ま]ぜた。"
  10: "それは、あなたの怒[いか]りと憤[いきどお]りのゆえである。あなたはわたしを持[も]ち上[あ]げてから、打[う]ち落[お]とされた。"
  11: "わたしの日[ひ]々[び]は影[かげ]のように傾[かたむ]き、わたしは草[くさ]のように枯[か]れた。"
  12: "しかし、主[しゅ]よ、あなたはとこしえに変[か]わらずにおられ、あなたの記念[きねん]は代[よ]から代[よ]へと続[つづ]く。"
  13: "あなたは立[た]ち上[あ]がってシオンをあわれまれる。シオンをあわれむ時[とき]が来[き]たからである。定[さだ]められた時[とき]が来[き]た。"
  14: "あなたの僕[しもべ]たちはその石[いし]を愛[あい]し、その塵[ちり]をあわれむからである。"
  15: "諸国[しょこく]の民[たみ]は主[しゅ]の名[な]を恐[おそ]れ、地[ち]の王[おう]たちはみな、あなたの栄光[えいこう]を恐[おそ]れる。"
  16: "主[しゅ]がシオンを建[た]て直[なお]されるからである。主[しゅ]はその栄光[えいこう]のうちに現[あらわ]れる。"
  17: "主[しゅ]はへりくだる者[もの]たちの祈[いの]りに目[め]を留[と]め、その願[ねが]いを軽[かろ]んじられなかった。"
  18: "これが次[つぎ]の世代[せだい]のために書[しる]されますように。造[つく]られる民[たみ]は主[しゅ]をほめたたえる。"
  19: "主[しゅ]はその聖[せい]なる高[たか]みから身[み]を乗[の]り出[だ]し、天[てん]から地[ち]に目[め]を注[そそ]がれた。"
  20: "それは、つながれた者[もの]たちの嘆[なげ]きを聞[き]き、死[し]に定[さだ]められた者[もの]たちを解[と]き放[はな]つためであった。"
  21: "それは、主[しゅ]の名[な]をシオンで、その賛美[さんび]をエルサレムで告[つ]げ知[し]らせるためであり、"
  22: "もろもろの民[たみ]と王国[おうこく]とがそろって集[あつ]まり、主[しゅ]に仕[つか]えるときのことである。"
  23: "主[しゅ]はその力[ちから]の道[みち]のうちで彼[かれ]に答[こた]えられた。「わたしの日[ひ]の少[すく]なさを、わたしに告[つ]げ知[し]らせよ」と。"
  24: "わたしの日[ひ]の半[なか]ばで、わたしを引[ひ]き上[あ]げないでください。あなたの年[とし]は代[よ]々[よ]に及[およ]ぶのです。"
  25: "主[しゅ]よ、あなたは初[はじ]めに地[ち]の基[もと]を据[す]え、天[てん]もあなたの手[て]のわざである。"
  26: "それらは滅[ほろ]びるが、あなたはいつまでも残[のこ]られる。すべては衣[ころも]のように古[ふる]び、あなたは外套[がいとう]のようにそれらを取[と]り替[か]えられ、それらは変[か]わる。"
  27: "しかし、あなたは同[おな]じ方[かた]であり、あなたの年[とし]は尽[き]ることがない。"
  28: "あなたの僕[しもべ]たちの子[こ]らは住[す]み続[つづ]け、その子孫[しそん]はとこしえに堅[かた]く立[た]つ。"

notes:
  0: "Προσευχὴ τῷ πτωχῷ, ὅταν ἀκηδιάσῃ καὶ ἐναντίον κυρίου ἐκχέῃ τὴν δέησιν αὐτοῦ — 貧しい者の祈り。彼が気力を失い、主の前にその願いを注ぎ出すときのもの (πτωχός — «нищий, бедный»; ἀκηδιάω — «унывать, падать духом»; ἐκχέω — «изливать»). Надписание — стих 0, скобками не маркируется."
  1: "Εἰσάκουσον, κύριε, τῆς προσευχῆς μου — 主よ、わたしの祈りを聞いてください (εἰσακούω — «услышать»). ἡ κραυγή μου πρὸς σὲ ἐλθάτω — わたしの叫びがあなたに届きますように (κραυγή — «крик, вопль»; ἐλθάτω — повелительное 3 л.)."
  2: "μὴ ἀποστρέψῃς τὸ πρόσωπόν σου ἀπ᾿ ἐμοῦ — わたしからあなたの顔を背けないでください (ἀποστρέφω — «отвращать»). ἐν ᾗ ἂν ἡμέρᾳ θλίβωμαι — わたしが苦しむ日には (θλίβω — «теснить, притеснять»). κλῖνον τὸ οὖς σου πρός με — わたしに耳を傾けてください (κλίνω — «наклонять»). ταχὺ εἰσάκουσόν μου — 速やかにわたしを聞いてください."
  3: "ἐξέλιπον ὡσεὶ καπνὸς αἱ ἡμέραι μου — わたしの日々は煙のように消え (ἐκλείπω — «исчезать»). τὰ ὀστᾶ μου ὡσεὶ φρύγιον συνεφρύγησαν — わたしの骨は薪のように焼け焦げた (φρύγιον — «хворост, сушняк для топки»; συμφρύγω — «сожигать»; слав. «яко сушило сосхошася»)."
  4: "ἐπλήγη ὡσεὶ χόρτος καὶ ἐξηράνθη ἡ καρδία μου — わたしの心は打たれて草のように枯れ (πλήσσω — «поражать»; ξηραίνω — «сушить»). ὅτι ἐπελαθόμην τοῦ φαγεῖν τὸν ἄρτον μου — わたしはパンを食べることを忘れた (ἐπιλανθάνομαι — «забывать»); телесное измождение от скорби."
  5: "ἀπὸ φωνῆς τοῦ στεναγμοῦ μου — わたしの嘆きの声によって (στεναγμός — «стенание»). ἐκολλήθη τὸ ὀστοῦν μου τῇ σαρκί μου — わたしの骨は肉に張り付いた (κολλάω — «прилепляться»); образ крайнего истощания."
  6: "ὡμοιώθην πελεκᾶνι ἐρημικῷ — わたしは荒野のペリカンのようになり (πελεκάν — «пеликан»; ἐρημικός — «пустынный»). ἐγενήθην ὡσεὶ νυκτικόραξ ἐν οἰκοπέδῳ — 廃虚にいるふくろうのようになった (νυκτικόραξ — «ночной ворон, филин»; οἰκόπεδον — «развалины»); образ одинокого плача."
  7: "ἠγρύπνησα — わたしは目を覚まし (ἀγρυπνέω — «бодрствовать»). ὡσεὶ στρουθίον μονάζον ἐπὶ δώματι — 屋根の上にひとり残った小鳥のようになった (στρουθίον — «воробей, пташка»; μονάζω — «быть одиноким»; δῶμα — «кровля»)."
  8: "ὅλην τὴν ἡμέραν ὠνείδιζόν με οἱ ἐχθροί μου — わたしの敵は日中、わたしをそしり続け (ὀνειδίζω — «поносить»; imperfect). οἱ ἐπαινοῦντές με κατ᾿ ἐμοῦ ὤμνυον — わたしをほめる者たちもわたしに逆らって誓った (ὄμνυμι — «клясться»); клялись против него, т. е. проклинали."
  9: "σποδὸν ὡσεὶ ἄρτον ἔφαγον — わたしは灰をパンのように食べ (σποδός — «пепел»). τὸ πόμα μου μετὰ κλαυθμοῦ ἐκίρνων — わたしの飲み物に涙を混ぜた (πόμα — «питьё»; κιρνάω — «смешивать»; imperfect)."
  10: "ἀπὸ προσώπου τῆς ὀργῆς σου καὶ τοῦ θυμοῦ σου — それは、あなたの怒りと憤りのゆえである (θυμός — «ярость»). ὅτι ἐπάρας κατέρραξάς με — あなたはわたしを持ち上げてから、打ち落とされた (ἐπαίρω — «поднимать»; καταρράσσω — «низвергать»); образ: возвысил и низринул."
  11: "αἱ ἡμέραι μου ὡσεὶ σκιὰ ἐκλίθησαν — わたしの日々は影のように傾き (κλίνω — «склонять»; σκιά — «тень»). ἐγὼ ὡσεὶ χόρτος ἐξηράνθην — わたしは草のように枯れた; повтор «как трава» из ст. 4 сохранён."
  12: "σὺ δέ, κύριε, εἰς τὸν αἰῶνα μένεις — しかし、主よ、あなたはとこしえに変わらずにおられ (μένω — «пребывать»). τὸ μνημόσυνόν σου εἰς γενεὰν καὶ γενεάν — あなたの記念は代から代へと続く (μνημόσυνον — «память, поминовение»)."
  13: "σὺ ἀναστὰς οἰκτιρήσεις τὴν Σιων — あなたは立ち上がってシオンをあわれまれる (ἀνίστημι — «вставать»; οἰκτίρω — «миловать»). ὅτι καιρὸς τοῦ οἰκτιρῆσαι αὐτήν — シオンをあわれむ時が来たからである. ὅτι ἥκει καιρός — 定められた時が来た; повтор «время» сохранён."
  14: "ὅτι εὐδόκησαν οἱ δοῦλοί σου τοὺς λίθους αὐτῆς — あなたの僕たちはその石を愛し (εὐδοκέω — «благоволить, возлюбить»; слав. «яко благоволиша раби Твои камение его»). τὸν χοῦν αὐτῆς οἰκτιρήσουσιν — その塵をあわれむ (χοῦς — «прах, пыль»); любовь к развалинам как знак надежды на восстановление."
  15: "φοβηθήσονται τὰ ἔθνη τὸ ὄνομα κυρίου — 諸国の民は主の名を恐れ (φοβέομαι — «бояться, благоговеть»). πάντες οἱ βασιλεῖς τῆς γῆς τὴν δόξαν σου — 地の王たちはみな、あなたの栄光を恐れる."
  16: "ὅτι οἰκοδομήσει κύριος τὴν Σιων — 主がシオンを建て直されるからである (οἰκοδομέω — «строить»). ὀφθήσεται ἐν τῇ δόξῃ αὐτοῦ — 主はその栄光のうちに現れる (ὁράω в страд. — «явиться»)."
  17: "ἐπέβλεψεν ἐπὶ τὴν προσευχὴν τῶν ταπεινῶν — 主はへりくだる者たちの祈りに目を留め (ἐπιβλέπω — «призреть»; ταπεινός — «смиренный, угнетённый»). οὐκ ἐξουδένωσεν τὴν δέησιν αὐτῶν — その願いを軽んじられなかった (ἐξουδενόω — «уничижать»; δέησις — «прошение»)."
  18: "γραφήτω αὕτη εἰς γενεὰν ἑτέραν — これが次の世代のために書かれますように (γράφω — повелительное 3 л. страд.). λαὸς ὁ κτιζόμενος αἰνέσει τὸν κύριον — 造られる民は主をほめたたえる (κτίζω — «созидать»; ὁ κτιζόμενος — «имеющий быть созданным», т. е. будущий народ)."
  19: "ἐξέκυψεν ἐξ ὕψους ἁγίου αὐτοῦ — 主はその聖なる高みから身を乗り出し (ἐκκύπτω — «высовываться, приникать»). κύριος ἐξ οὐρανοῦ ἐπὶ τὴν γῆν ἐπέβλεψεν — 天から地に目を注がれた."
  20: "τοῦ ἀκοῦσαι τὸν στεναγμὸν τῶν πεπεδημένων — つながれた者たちの嘆きを聞くため (πεδέω — «связывать, заковывать»). τοῦ λῦσαι τοὺς υἱοὺς τῶν τεθανατωμένων — 死に定められた者たちを解き放つため (λύω — «разрешать»; θανατόω — «умерщвлять»; «сыны смерти» — приговорённые к смерти)."
  21: "τοῦ ἀναγγεῖλαι ἐν Σιων τὸ ὄνομα κυρίου — 主の名をシオンで告げ知らせるため (ἀναγγέλλω — «возвещать»). τὴν αἴνεσιν αὐτοῦ ἐν Ιερουσαλημ — その賛美をエルサレムで."
  22: "ἐν τῷ συναχθῆναι λαοὺς ἐπὶ τὸ αὐτό — もろもろの民がそろって集まるとき (συνάγω — «собирать»). βασιλείας τοῦ δουλεύειν τῷ κυρίῳ — 王国が主に仕えるために; дательный цели."
  23: "ἀπεκρίθη αὐτῷ ἐν ὁδῷ ἰσχύος αὐτοῦ — 主はその力の道のうちで彼に答えられた; место тёмное: в евр. и в рус. (ru 101:23 «Изнурил Он на пути силы мои») здесь иное чтение, но в gr-lxx-byz и в слав. («Отвеща ему на пути крепости его») стоит именно это, поэтому переведено буквально, без сглаживания. Τὴν ὀλιγότητα τῶν ἡμερῶν μου ἀνάγγειλόν μοι — わたしの日の少なさを、わたしに告げ知らせよ (ὀλιγότης — «малость, краткость»); слова псалмопевца — 「」."
  24: "μὴ ἀναγάγῃς με ἐν ἡμίσει ἡμερῶν μου — わたしの日の半ばで、わたしを引き上げないでください (ἀνάγω — «возводить»; ἥμισυ — «половина»). ἐν γενεᾷ γενεῶν τὰ ἔτη σου — あなたの年は代々に及ぶ (γενεὰ γενεῶν — «род родов»); переход к вечности Бога."
  25: "κατ᾿ ἀρχάς, κύριε, τὴν γῆν ἐθεμελίωσας — 主よ、あなたは初めに地の基を据え (θεμελιόω — «основывать»). ἔργα τῶν χειρῶν σού εἰσιν οἱ οὐρανοί — 天もあなたの手のわざである; ср. Евр 1:10–12, где стих отнесён к Сыну."
  26: "αὐτοὶ ἀπολοῦνται, σὺ δὲ διαμενεῖς — それらは滅びるが、あなたはいつまでも残られる (ἀπόλλυμι — «погибать»; διαμένω — «пребывать»). πάντες ὡς ἱμάτιον παλαιωθήσονται — すべては衣のように古び (παλαιόω — «стариться»). ὡσεὶ περιβόλαιον ἀλλάξεις αὐτούς — 外套のようにそれらを取り替えられる (περιβόλαιον — «покрывало, верхняя одежда»; ἀλλάσσω — «переменять»); καὶ ἀλλαγήσονται — それらは変わる."
  27: "σὺ δὲ ὁ αὐτός εἶ — しかし、あなたは同じ方であり (ὁ αὐτός — «Тот же», ср. Евр 13:8). τὰ ἔτη σου οὐκ ἐκλείψουσιν — あなたの年は尽きることがない (ἐκλείπω — «оскудевать»)."
  28: "οἱ υἱοὶ τῶν δούλων σου κατασκηνώσουσιν — あなたの僕たちの子らは住み続け (κατασκηνόω — «обитать»). τὸ σπέρμα αὐτῶν εἰς τὸν αἰῶνα κατευθυνθήσεται — その子孫はとこしえに堅く立つ (κατευθύνω — «направлять прямо, утверждать»)."
