verses:
  1: "主[しゅ]はモーセに言[い]われた。"
  2: "「アロンとその子[こ]ら、その衣[ころも]、注[そそ]ぎの油[あぶら]、贖罪祭[しょくざいさい]の子牛[こうし]、二頭[にとう]の雄羊[おすひつじ]、種[たね]なしパンの籠[かご]を取[と]り、"
  3: "また、イスラエルの全会衆[ぜんかいしゅう]を証[あかし]の幕屋[まくや]の入口[いりぐち]に集[あつ]めなさい。」"
  4: "モーセは主[しゅ]が自分[じぶん]に命[めい]じられたとおりに行[おこな]い、会衆[かいしゅう]を証[あかし]の幕屋[まくや]の入口[いりぐち]に集[あつ]めた。"
  5: "モーセは会衆[かいしゅう]に言[い]った。「これは主[しゅ]が行[おこな]うよう命[めい]じられたことである。」"
  6: "モーセはアロンとその子[こ]らを連[つ]れて来[き]て、彼[かれ]らを水[みず]で洗[あら]った。"
  7: "彼[かれ]はアロンに長[なが]い衣[ころも]を着[き]せ、帯[おび]を締[し]め、上[うわ]の衣を着せ、エフォドを掛[か]け、エフォドの帯で締めて、彼にしっかりと結[むす]びつけた。"
  8: "そして、胸当[むねあ]てを彼[かれ]の上[うえ]に置[お]き、胸当ての上に、ウリムとトンミムを置[お]いた。"
  9: "彼[かれ]は頭[あたま]に頭の布[ぬの]を載[の]せ、その布の前[まえ]に、聖[せい]なるものとして聖別[せいべつ]された金[きん]の板[いた]を置[お]いた。主[しゅ]がモーセに命[めい]じられたとおりである。"
  10: "モーセは注[そそ]ぎの油[あぶら]を取[と]り、"
  11: "その油[あぶら]を祭壇[さいだん]に七回[ななかい]振[ふ]りかけ、祭壇とそのすべての器具[きぐ]、洗[あら]い盤[ばん]とその台[だい]に油を塗[ぬ]って、それらを聖別[せいべつ]した。また、幕屋[まくや]とその中[なか]のすべてに油を塗って、幕屋を聖別した。"
  12: "モーセは注[そそ]ぎの油[あぶら]をアロンの頭[あたま]に注ぎ、彼[かれ]に油を塗[ぬ]って、彼を聖別[せいべつ]した。"
  13: "モーセはアロンの子[こ]らを連[つ]れて来[き]て、彼[かれ]らに長[なが]い衣[ころも]を着[き]せ、帯[おび]を締[し]めさせ、頭[あたま]の布[ぬの]を載[の]せた。主[しゅ]がモーセに命[めい]じられたとおりである。"
  14: "モーセは贖罪祭[しょくざいさい]の子牛[こうし]を連[つ]れて来[き]た。アロンとその子[こ]らは、その贖罪祭の子牛の頭[あたま]に手[て]を置[お]いた。"
  15: "彼[かれ]はそれを屠[ほふ]り、モーセはその血[ち]を取[と]って、指[ゆび]で祭壇[さいだん]の角[つの]の周[まわ]りに塗[ぬ]り、祭壇を清[きよ]めた。そして、残[のこ]りの血を祭壇の基[もとい]に注[そそ]ぎ、その上[うえ]で贖[あがな]いをするために、それを聖別[せいべつ]した。"
  16: "モーセは内臓[ないぞう]の上[うえ]の脂肪[しぼう]すべて、肝臓[かんぞう]の小葉[しょうよう]、二[ふた]つの腎臓[じんぞう]とその上の脂肪を取[と]り、祭壇[さいだん]の上で焼[や]いた。"
  17: "子牛[こうし]と、その皮[かわ]、肉[にく]、汚物[おぶつ]は、宿営[しゅくえい]の外[そと]で火[ひ]で焼[や]いた。主[しゅ]がモーセに命[めい]じられたとおりである。"
  18: "モーセは燔祭[はんさい]の雄羊[おすひつじ]を連[つ]れて来[き]た。アロンとその子[こ]らは、その雄羊の頭[あたま]に手[て]を置[お]いた。"
  19: "彼[かれ]はそれを屠[ほふ]り、モーセはその血[ち]を祭壇[さいだん]の周[まわ]りに注[そそ]ぎかけた。"
  20: "彼[かれ]はその雄羊[おすひつじ]を部[ぶ]分[ぶん]ごとに切[き]り分[わ]け、モーセはその頭[あたま]、部分[ぶぶん]、脂肪[しぼう]を焼[や]いた。"
  21: "内臓[ないぞう]と足[あし]は水[みず]で洗[あら]い、モーセはその雄羊[おすひつじ]全体[ぜんたい]を祭壇[さいだん]の上[うえ]で焼[や]いた。それは燔祭[はんさい]、すなわち主[しゅ]に芳[かんば]しい香[かおり]となる焼き尽[つ]くす捧[ささ]げ物[もの]である。主がモーセに命[めい]じられたとおりである。"
  22: "モーセは二頭目[にとうめ]の雄羊[おすひつじ]、すなわち任職[にんしょく]の雄羊を連[つ]れて来[き]た。アロンとその子[こ]らは、その雄羊の頭[あたま]に手[て]を置[お]いた。"
  23: "彼[かれ]はそれを屠[ほふ]り、モーセはその血[ち]を取[と]って、アロンの右[みぎ]の耳[みみ]たぶ、右の手[て]の親指[おやゆび]、右の足[あし]の親指に塗[ぬ]った。"
  24: "モーセはアロンの子[こ]らを連[つ]れて来[き]て、その血[ち]を彼[かれ]らの右[みぎ]の耳[みみ]たぶ、右の手[て]の親指[おやゆび]、右の足[あし]の親指に塗[ぬ]り、残[のこ]りの血を祭壇[さいだん]の周[まわ]りに注[そそ]ぎかけた。"
  25: "彼[かれ]は脂肪[しぼう]と尾[お]の脂肪、内臓[ないぞう]の上[うえ]の脂肪、肝臓[かんぞう]の小葉[しょうよう]、二[ふた]つの腎臓[じんぞう]とその上の脂肪、右[みぎ]の肩[かた]を取[と]った。"
  26: "また、主[しゅ]の前[まえ]にある任職[にんしょく]の籠[かご]から、種[たね]なしのパン一[ひと]つ、油[あぶら]を混[ま]ぜたパン一つ、薄焼[うすや]きのパン一つを取[と]り、それらを脂肪[しぼう]と右[みぎ]の肩[かた]の上[うえ]に置[お]いた。"
  27: "そして、それらすべてをアロンの手[て]とその子[こ]らの手に置[お]き、主[しゅ]の前[まえ]に献[ささ]げ物[もの]として差[さ]し上[あ]げた。"
  28: "モーセはそれらを彼[かれ]らの手[て]から取[と]り、祭壇[さいだん]の上[うえ]で、任職[にんしょく]の燔祭[はんさい]の上に焼[や]いた。それは芳[かんば]しい香[かおり]となり、主[しゅ]への焼き尽[つ]くす捧[ささ]げ物[もの]である。"
  29: "モーセは任職[にんしょく]の雄羊[おすひつじ]の胸[むね]を取[と]り、それを主[しゅ]の前[まえ]に差[さ]し上[あ]げの献[ささ]げ物[もの]として差し出[だ]した。それがモーセの分[ぶん]となった。主がモーセに命[めい]じられたとおりである。"
  30: "モーセは注[そそ]ぎの油[あぶら]と祭壇[さいだん]の上[うえ]の血[ち]を取[と]り、アロンとその衣[ころも]、その子[こ]らとその衣に振[ふ]りかけて、アロンとその衣、その子らとその衣を聖別[せいべつ]した。"
  31: "モーセはアロンとその子[こ]らに言[い]った。「肉[にく]を証[あかし]の幕屋[まくや]の庭[にわ]の聖[せい]なる場所[ばしょ]で煮[に]、そこで、任職[にんしょく]の籠[かご]にあるパンとともにそれを食[た]べなさい。わたしはこう命[めい]じられている。『アロンとその子らがそれを食べる。』"
  32: "残[のこ]った肉[にく]とパンは火[ひ]で焼[や]き尽[つ]くしなさい。"
  33: "あなたがたは七日[なぬか]の間[あいだ]、証[あかし]の幕屋[まくや]の入口[いりぐち]から出[で]てはならない。あなたがたの任職[にんしょく]の日々[ひび]が満[み]ちるまでである。七日の間、あなたがたの手[て]は任職されるからである。"
  34: "今日[きょう]行[おこな]ったとおりに、主[しゅ]はあなたがたのために贖[あがな]いをするために、そうするよう命[めい]じられたのである。"
  35: "あなたがたは七日[なぬか]の間[あいだ]、昼[ひる]も夜[よる]も証[あかし]の幕屋[まくや]の入口[いりぐち]にとどまり、主[しゅ]の守[まも]りを守らなければならない。そうすれば、あなたがたは死[し]なない。わたしはそのように、主である神[かみ]から命[めい]じられたのである。」"
  36: "アロンとその子[こ]らは、主[しゅ]がモーセに命[めい]じられたすべての言葉[ことば]を行[おこな]った。"

notes:
  1: "Новое речение."
  2: "στολαί — «одежды»; ἔλαιον τῆς χρίσεως — «елей помазания»; μόσχος περὶ ἁμαρτίας — «телец жертвы за грех»; κανοῦν — «корзина»."
  3: "ἐκκλησίασον — «собери» (ἐκκλησιάζω); συναγωγή — «общество, собрание»; θύρα — «вход»."
  4: "ὃν τρόπον — «как»; συνέταξεν — «повелел»; ἐξεκκλησίασεν — «собрал»."
  5: "ῥῆμα — «слово, дело»; ἐνετείλατο ποιῆσαι — «повелел сделать»."
  6: "προσήνεγκεν — «привёл»; ἔλουσεν ὕδατι — «омыл водою»."
  7: "χιτών — хитон; ζώνη — пояс; ὑποδύτης — верхняя риза (me'il), слав. «исподняя риза»; ἐπωμίς — ефод; συνέζωσεν … συνέσφιγξεν — «опоясал … стянул»."
  8: "λογεῖον — наперсник; δήλωσις καὶ ἀλήθεια — букв. «явление и истина», LXX-передача урима и туммима, поэтому ウリムとトンミム, как в Исх 28:30 (там же сноска); ἐπ᾿ αὐτὴν — «на неё» (на ефод)."
  9: "μίτρα — кидар, головная повязка; πέταλον χρυσοῦν — золотая дощечка; καθηγιασμένον — «освящённое»."
  10: "Греч. стих — начало фразы: «И взял Моисей елея помазания», продолжение в 8:11; в ru 8:10 объединяет оба стиха."
  11: "ἑπτάκις — «семь раз»; ἔχρισεν — «помазал»; λουτήρ — «умывальница»; βάσις — «подножие»."
  12: "ἐπέχεεν — «возлил»; ἔχρισεν — «помазал»; ἡγίασεν — «освятил»."
  13: "χιτῶνες, ζῶναι, κιδάρεις — хитоны, пояса, кидары."
  14: "μόσχος ὁ περὶ τῆς ἁμαρτίας — «телец жертвы за грех»; ἐπέθηκεν τὰς χεῖρας — «возложили руки»."
  15: "ἔσφαξεν — «заколол»; κέρατα — «рога»; τῷ δακτύλῳ — «перстом»; ἐκαθάρισεν — «очистил»; τοῦ ἐξιλάσασθαι ἐπ᾿ αὐτοῦ — «чтобы совершать на нём умилостивление»."
  16: "στέαρ τὸ ἐπὶ τῶν ἐνδοσθίων — «тук на внутренностях»; λοβὸς τοῦ ἥπατος — «лопасть печени»; ἀμφοτέρους τοὺς νεφρούς — «обе почки»."
  17: "βύρσα — «кожа»; κόπρον — «испражнения, содержимое кишечника»; ἔξω τῆς παρεμβολῆς — «вне стана»."
  18: "κριὸς εἰς ὁλοκαύτωμα — «овен для всесожжения»."
  19: "προσέχεεν — «возлил»; κύκλῳ — «вокруг»."
  20: "ἐκρεανόμησεν κατὰ μέλη — «рассек на части» (κρεανομέω); στέαρ — «тук»."
  21: "κοιλία — «внутренности»; ἔπλυνεν — «омыл»; ὀσμὴ εὐωδίας — «благоухание»; κάρπωμα — «сожигаемое»."
  22: "κριὸς τελειώσεως — «овен посвящения» (任職); δεύτερος — «второй»."
  23: "λοβὸς τοῦ ὠτός — «мочка уха»; ἄκρον τῆς χειρός — букв. «конец руки», т. е. большой палец; ср. 8:24."
  24: "ἄκρα τῶν χειρῶν … τῶν ποδῶν — «концы рук … ног» (большие пальцы); προσέχεεν — «возлил»."
  25: "ὀσφύς — «курдюк»; στέαρ τὸ ἐπὶ τῆς κοιλίας — «тук на чреве»; βραχίων δεξιός — «правое плечо»."
  26: "κανοῦν τῆς τελειώσεως — «корзина посвящения»; ἄρτος ἄζυμος — «пресный хлеб»; ἄρτος ἐξ ἐλαίου — «хлеб с елеем»; λάγανον — «лепёшка»."
  27: "ἐπέθηκεν ἐπὶ τὰς χεῖρας — «возложил на руки»; ἀνήνεγκεν ἀφαίρεμα — «вознёс как возношение»."
  28: "ἀπὸ τῶν χειρῶν αὐτῶν — «с рук их»; ἐπὶ τὸ ὁλοκαύτωμα τῆς τελειώσεως — «поверх всесожжения посвящения»; ὀσμὴ εὐωδίας — «благоухание»."
  29: "στηθύνιον — «грудь»; ἀφεῖλεν … ἐπίθεμα — «отделил как возложение»; ἐν μερίδι — «в долю»."
  30: "προσέρρανεν — «окропил»; στολαί — «одежды»; ἡγίασεν — «освятил»."
  31: "ἑψήσατε — «сварите»; αὐλή — «двор»; κανοῦν τῆς τελειώσεως — «корзина посвящения»; συντέτακταί μοι λέγων — «заповедано мне, говоря»; внутри — слова Бога в 『…』."
  32: "καταλειφθέν — «оставшееся»; κατακαυθήσεται — «будет сожжено»."
  33: "ἀπὸ τῆς θύρας … οὐκ ἐξελεύσεσθε — «от входа … не выйдете»; ἡμέρα τελειώσεως — «день посвящения»; τελειώσει τὰς χεῖρας — «совершит руки», т. е. посвятит."
  34: "καθάπερ ἐποίησεν — «как сделал»; ἐξιλάσασθαι περὶ ὑμῶν — «умилостивить за вас»."
  35: "καθήσεσθε — «останетесь»; ἡμέραν καὶ νύκτα — «день и ночь»; φυλάγματα κυρίου — «стражи Господни»; ἐνετείλατό μοι κύριος ὁ θεός — «заповедал мне Господь Бог»."
  36: "πάντας τοὺς λόγους — «все слова»; συνέταξεν — «повелел»."
