# jp-box, Левит, глава 8. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в Левите отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Фуригана — при первом появлении слова в стихе.
# Глава 8: посвящение Аарона и его сыновей — омовение и облачение (1–13),
# жертва за грех (14–17), всесожжение (18–21), овен посвящения (22–30),
# семидневное пребывание у входа скинии (31–36).
# Речь Бога — 「…」 (2–3); речь Моисея — 「…」 (5, 31–35); внутри речи Моисея
# слова Бога — 『…』 (31). Красного нет.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (проверено по базе).
# Сносок ⟨…⟩ нет: 燔祭, 祭司, 幕屋, 祭壇 уже пояснены; エフォド и 任職
# объяснены в notes.
# LXX/масоретские отличия: 8:7 ὑποδύτης — верхняя риза (me'il), не «исподняя»;
# 8:8 δήλωσις καὶ ἀλήθεια — LXX-передача урима и туммима; 8:10–11 деление стихов
# иное, чем в ru (в gr 8:10 — начало фразы, продолжение в 8:11); 8:23/24
# ἄκρον χειρός/ποδός — букв. «конец руки/ноги», т. е. большой палец.
# jp-ni не использовался.

