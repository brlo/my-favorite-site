verses:
  1: "この後[のち]、わたしは天[てん]で、多[おお]くの群[ぐん]衆[しゅう]の大[おお]きな声[こえ]のような響[ひび]きを聞[き]いた。彼[かれ]らは言[い]う。「アレルヤ⟨「主[しゅ]を賛[ほ]めたたえよ」の意[い]。⟩。救[すく]いと栄光[えいこう]と〔誉[ほま]れ〕と力[ちから]は、わたしたちの神[かみ]に帰[き]する。」"
  2: "その裁[さば]きは真実[しんじつ]で、正[ただ]しいからである。神[かみ]は、その淫行[いんこう]によって地[ち]を腐[くさ]らせた大淫婦[だいいんぷ]を裁[さば]き、ご自身[じしん]の僕[しもべ]たちの血[ち]の報[むく]いを、彼女[かのじょ]の手[て]から求[もと]められたからである。"
  3: "そして、彼[かれ]らは再[ふたた]び言[い]った。「アレルヤ。彼女[かのじょ]の煙[けむり]は、世々[よよ]限[かぎ]りなく上[のぼ]り続[つづ]ける。」"
  4: "二十四人[にじゅうよにん]の長老[ちょうろう]たちと四[よっ]つの生[い]き物[もの]はひれ伏[ふ]し、御座[みくら]に着[つ]いておられる神[かみ]を礼拝[れいはい]して言[い]った。「アーメン。アレルヤ。」"
  5: "また、御座[みくら]から声[こえ]が出[で]て言[い]った。「神[かみ]の僕[しもべ]たちよ、神[かみ]を恐[おそ]れる者[もの]たちよ、小[ちい]さな者[もの]も大[おお]きな者[もの]も、すべて、わたしたちの神[かみ]をほめたたえよ。」"
  6: "また、わたしは、多[おお]くの群[ぐん]衆[しゅう]の声[こえ]のようなもの、多[おお]くの水[みず]の声[こえ]のようなもの、強[つよ]い雷[かみなり]の声[こえ]のようなものを聞[き]いた。彼[かれ]らは言[い]った。「アレルヤ。主[しゅ]であられる神[かみ]、全能者[ぜんのうしゃ]が王[おう]となられたからである。"
  7: "わたしたちは喜[よろこ]び、小躍[こおど]りしよう。栄光[えいこう]をこの方[かた]に帰[き]そう。小羊[こひつじ]の婚礼[こんれい]が来[き]て、花嫁[はなよめ]は自分[じぶん]を整[ととの]えたからである。"
  8: "花嫁[はなよめ]には、輝[かがや]く清[きよ]い亜麻布[あまぬの]を着[き]ることが許[ゆる]された。この亜麻布[あまぬの]は、聖徒[せいと]たちの義[ぎ]の行[おこな]いである。」"
  9: "そして、わたしに言[い]った。「書[か]きなさい。小羊[こひつじ]の婚礼[こんれい]の宴会[えんかい]に招[まね]かれた者[もの]たちは幸[さいわ]いである。」また、わたしに言[い]った。「これらの言葉[ことば]は、神[かみ]の真実[しんじつ]の言葉[ことば]である。」"
  10: "わたしはその方[かた]の足[あし]もとにひれ伏[ふ]して礼拝[れいはい]しようとした。すると、わたしに言[い]った。「やめなさい。わたしは、あなたと、イエスの証[あかし]を保[たも]つあなたの兄弟[きょうだい]たちと同[おな]じ僕[しもべ]である。神[かみ]を礼拝[れいはい]しなさい。」イエスの証[あかし]とは、預言[よげん]の霊[れい]である。"
  11: "また、わたしは開[ひら]かれた天[てん]を見[み]た。すると、白[しろ]い馬[うま]がいた。これに乗[の]っておられる方[かた]は、忠実[ちゅうじつ]で真実[しんじつ]な方[かた]と呼ばれ、義[ぎ]によって裁[さば]き、戦[たたか]われる。"
  12: "その目[め]は炎[ほのお]のようであり、頭[あたま]には多[おお]くの王冠[おうかん]がある。また、書[か]かれた名[な]を持[も]っておられるが、それを知[し]っている者[もの]は、この方[かた]のほかにはいない。"
  13: "また、血[ち]に染[そ]めた衣[ころも]をまとっておられる。その名[な]は神[かみ]の言葉[ことば]と呼ばれる。"
  14: "天[てん]の軍[ぐん]が、白[しろ]く清[きよ]い亜麻布[あまぬの]を着[き]、白[しろ]い馬[うま]に乗[の]って、この方[かた]に従[したが]っていた。"
  15: "その口[くち]からは鋭[するど]い剣[つるぎ]が出[で]ている。これによって諸国[しょこく]を打[う]つためである。この方[かた]は鉄[てつ]の杖[つえ]で彼[かれ]らを牧[ぼく]される。また、全能者[ぜんのうしゃ]である神[かみ]の激[はげ]しい怒[いか]りのぶどう酒[しゅ]の搾[しぼ]り場[ば]を、自[みずか]ら踏[ふ]まれる。"
  16: "また、その衣[ころも]にも、ももにも、名[な]が書[か]かれている。「王[おう]の王[おう]、主[しゅ]の主[しゅ]」である。"
  17: "また、わたしは、太陽[たいよう]の中[なか]に立[た]つ一人[ひとり]の天使[てんし]を見[み]た。彼[かれ]は大[おお]きな声[こえ]で、中天[ちゅうてん]を飛[と]ぶすべての鳥[とり]たちに叫[さけ]んだ。「来[き]て、神[かみ]の大[おお]きな宴会[えんかい]に集[あつ]まれ。"
  18: "王[おう]たちの肉[にく]、千人隊長[せんにんたいちょう]の肉[にく]、強[つよ]い者[もの]たちの肉[にく]、馬[うま]とそれに乗[の]る者[もの]たちの肉[にく]、すべての自由[じゆう]な者[もの]と奴隷[どれい]の肉[にく]、小[ちい]さな者[もの]と大[おお]きな者[もの]の肉[にく]を、食[た]べるためである。」"
  19: "また、わたしは、獣[けもの]と、地[ち]の王[おう]たちと、その軍[ぐん]たちが、馬[うま]に乗[の]っておられる方[かた]とその軍[ぐん]に戦[たたか]いを仕[しか]けようとして集[あつ]まっているのを見[み]た。"
  20: "すると、獣[けもの]は捕[と]らえられ、獣[けもの]の前[まえ]でしるしを行[おこな]い、それによって獣[けもの]の刻印[こくいん]を受[う]けた者[もの]たちと、獣[けもの]の像[ぞう]を礼拝[れいはい]する者[もの]たちを惑[まど]わした偽[いつわ]りの預言者[よげんしゃ]も、ともに捕[と]らえられた。この二人[ふたり]は、生[い]きたまま、硫黄[いおう]の火[ひ]で燃[も]える池[いけ]に投[な]げ込[こ]まれた。"
  21: "残[のこ]りの者[もの]たちは、馬[うま]に乗[の]っておられる方[かた]の口[くち]から出[で]る剣[つるぎ]によって殺[ころ]された。そして、すべての鳥[とり]たちは、彼[かれ]らの肉[にく]で腹[はら]を満[み]たした。"

notes:
  1: "Μετὰ ταῦτα — この後. ὡς φωνὴν μεγάλην ὄχλου πολλοῦ — 多くの群衆の大きな声のような; ὡς сохранено (не «голос», а «как бы голос»). Ἁλληλουϊά — アレルヤ, сноска при первом месте в корпусе. ἡ σωτηρία καὶ ἡ δόξα καὶ ἡ δύναμις τοῦ θεοῦ ἡμῶν — 救いと栄光と力は、わたしたちの神に帰する; в базе три члена и genetivus. Церковный текст (Елизаветинская «спасение и слава и честь и сила», jp-joc 救贖と光榮と尊貴と權能) прибавляет τιμή — 〔誉れ〕 (проверено: τιμη в 19:1 НЕТ)."
  2: "ὅτι — からである (основание славословия). ἀληθιναὶ καὶ δίκαιαι αἱ κρίσεις αὐτοῦ — その裁きは真実で正しい. ἔκρινεν τὴν πόρνην τὴν μεγάλην — 大淫婦を裁き (термин выровнен с 17:1: 大淫婦[だいいんぷ]). ἔφθειρεν τὴν γῆν ἐν τῇ πορνείᾳ αὐτῆς — 淫行によって地を腐らせた. ἐξεδίκησεν τὸ αἷμα…ἐκ χειρὸς αὐτῆς — 血の報いを彼女の手から求められた (ἐκδικέω — «взыскивать кровь», ср. jp-joc 血を其の手より索めたり)."
  3: "δεύτερον εἴρηκαν — 再び言った (perfect с результативным значением). ὁ καπνὸς αὐτῆς ἀναβαίνει — 煙は上り続ける (настоящее время, не «поднялся»). εἰς τοὺς αἰῶνας τῶν αἰώνων — 世々限りなく."
  4: "οἱ πρεσβύτεροι οἱ εἴκοσι τέσσαρες — 二十四人の長老. τὰ τέσσαρα ζῷα — 四つの生き物; ζῷον — «живое существо», 獣 оставлено за θηρίον. ἔπεσαν — ひれ伏し. Ἀμήν, Ἁλληλουϊά — アーメン、アレルヤ, порядок сохранён."
  5: "φωνὴ ἀπὸ τοῦ θρόνου — 御座から出る声 (в базе ἐκ τοῦ θρόνου, не «с неба», как у jp-joc). αἰνεῖτε τῷ θεῷ ἡμῶν — わたしたちの神をほめたたえよ. [καὶ] в базе есть. οἱ μικροὶ καὶ οἱ μεγάλοι — 小さな者も大きな者も."
  6: "ὡς φωνὴν ὄχλου πολλοῦ…ὑδάτων πολλῶν…βροντῶν ἰσχυρῶν — три сравнения, ὡς сохранено трижды. ἐβασίλευσεν κύριος ὁ θεὸς [ἡμῶν] ὁ παντοκράτωρ — 主であられる神、全能者が王となられた; παντοκράτωρ — 全能者[ぜんのうしゃ], как в 2 Кор 6:18; [ἡμῶν] в базе есть, без 〔〕."
  7: "χαίρωμεν καὶ ἀγαλλιῶμεν — 喜び、小躍りしよう (hortativus сохранён). δῶμεν τὴν δόξαν αὐτῷ — 栄光をこの方に帰そう. ὁ γάμος τοῦ ἀρνίου — 小羊の婚礼; ἀρνίον — 小羊[こひつじ], как в 1 Кор 5:7 и Ин 21:15. ἡ γυνὴ αὐτοῦ ἡτοίμασεν ἑαυτήν — 花嫁は自分を整えた (ἡ γυνή — «жена»; передано 花嫁, как в 21:2, 9)."
  8: "ἐδόθη αὐτῇ ἵνα περιβάληται — 着ることが許された. βύσσινον λαμπρὸν καθαρόν — 輝く清い亜麻布. τὰ δικαιώματα τῶν ἁγίων — 聖徒たちの義の行い (δικαίωμα — «праведное дело»)."
  9: "Γράψον — 書きなさい. Μακάριοι οἱ εἰς τὸ δεῖπνον τοῦ γάμου κεκλημένοι — 婚礼の宴会に招かれた者たちは幸い. οὗτοι οἱ λόγοι ἀληθινοὶ τοῦ θεοῦ εἰσιν — これらの言葉は神の真実の言葉. Говорящий не назван (в базе нет ἄγγελος), поэтому подлежащее не добавлено."
  10: "ἔπεσα…προσκυνῆσαι — ひれ伏して礼拝しようとした. Ὅρα μή — やめなさい. σύνδουλός σού εἰμι — あなたと同じ僕である. τῶν ἐχόντων τὴν μαρτυρίαν Ἰησοῦ — イエスの証を保つ者たち. ἡ μαρτυρία Ἰησοῦ ἐστιν τὸ πνεῦμα τῆς προφητείας — イエスの証とは預言の霊である; πνεῦμα без ἅγιον, поэтому 霊[れい], не 聖霊."
  11: "ἠνεῳγμένον — 開かれた. ἵππος λευκός — 白い馬. πιστὸς [καλούμενος] καὶ ἀληθινός — 忠実で真実な方と呼ばれ; [καλούμενος] в базе есть, без 〔〕. ἐν δικαιοσύνῃ κρίνει καὶ πολεμεῖ — 義によって裁き、戦われる (настоящее время сохранено)."
  12: "οἱ ὀφθαλμοὶ αὐτοῦ [ὡς] φλὸξ πυρός — 目は炎のよう; [ὡς] в базе есть. διαδήματα πολλά — 多くの王冠 (διάδημα — царский венец). ὄνομα γεγραμμένον ὃ οὐδεὶς οἶδεν εἰ μὴ αὐτός — 書かれた名…この方のほかには知っている者はいない."
  13: "περιβεβλημένος ἱμάτιον βεβαμμένον αἵματι — 血に染めた衣をまとっておられる. κέκληται τὸ ὄνομα αὐτοῦ ὁ λόγος τοῦ θεοῦ — その名は神の言葉と呼ばれる."
  14: "τὰ στρατεύματα [τὰ] ἐν τῷ οὐρανῷ — 天の軍; [τὰ] в базе есть. ἐφ' ἵπποις λευκοῖς — 白い馬に乗って. ἐνδεδυμένοι βύσσινον λευκὸν καθαρόν — 白く清い亜麻布を着."
  15: "ῥομφαία ὀξεῖα — 鋭い剣. πατάξῃ τὰ ἔθνη — 諸国を打つ. ποιμανεῖ ἐν ῥάβδῳ σιδηρᾷ — 鉄の杖で牧される (Пс 2:9). πατεῖ τὴν ληνὸν τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς — 怒りの激しいぶどう酒の搾り場を踏まれる (θυμός и ὀργή — «ярость» и «гнев»; δύο слова сведены в 激しい怒り, без сглаживания смысла)."
  16: "ἐπὶ τὸ ἱμάτιον καὶ ἐπὶ τὸν μηρόν — 衣にももにも. Βασιλεὺς βασιλέων καὶ κύριος κυρίων — 王の王、主の主; это надпись на одежде, а не речь, поэтому не красное."
  17: "ἕνα ἄγγελον ἑστῶτα ἐν τῷ ἡλίῳ — 太陽の中に立つ一人の天使. [ἐν] φωνῇ μεγάλῃ — [ἐν] в базе есть. μεσουράνημα — 中天. Δεῦτε συνάχθητε — 来て…集まれ. τὸ δεῖπνον τὸ μέγα τοῦ θεοῦ — 神の大きな宴会."
  18: "σάρκας βασιλέων…χιλιάρχων…ἰσχυρῶν — 王たち…千人隊長…強い者たちの肉 (χιλίαρχος — 千人隊長, как в Деян). ἐλευθέρων τε καὶ δούλων — 自由な者と奴隷. μικρῶν καὶ μεγάλων — 小さな者と大きな者. Порядок членов сохранён."
  19: "συνηγμένα ποιῆσαι τὸν πόλεμον — 戦いを仕掛けようとして集まっている. μετὰ τοῦ καθημένου ἐπὶ τοῦ ἵππου — 馬に乗っておられる方と. τὸ θηρίον — 獣[けもの]."
  20: "ἐπιάσθη — 捕らえられた. ὁ ψευδοπρόφητης ὁ ποιήσας τὰ σημεῖα ἐνώπιον αὐτοῦ — 獣の前でしるしを行った偽りの預言者. χάραγμα — 刻印. ζῶντες ἐβλήθησαν οἱ δύο — 二人は生きながら投げ込まれた. λίμνη τοῦ πυρὸς τῆς καιομένης ἐν θείῳ — 硫黄の火で燃える池."
  21: "οἱ λοιποί — 残りの者たち. ἐν τῇ ῥομφαίᾳ…τῇ ἐξελθούσῃ ἐκ τοῦ στόματος αὐτοῦ — 口から出る剣によって. ἐχορτάσθησαν ἐκ τῶν σαρκῶν αὐτῶν — 肉で腹を満たした."
