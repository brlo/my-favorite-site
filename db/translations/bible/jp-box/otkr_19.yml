# jp-box, Откровение, глава 19. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 19: славословие на небе (1–8), вечеря брака Агнца и ангел (9–10),
# всадник на белом коне и поражение зверя (11–21).
# Красного <j> нет: Христос в главе не говорит. 19:1–8 — славословия (в 「」, не красные),
# 19:9–10 — ангел, 19:11–21 — описание. <mo> нет.
# 〔…〕: 19:1 — церковное τιμή («честь», Елизаветинская, jp-joc 尊貴): проверено,
# в gr-lxx-byz его нет. Прочее ([ἡμῶν] 19:6, [καλούμενος] 19:11, [ὡς] 19:12,
# [τὰ] 19:14, [ἐν] 19:17) в базе есть — без скобок.
# Сноска ⟨…⟩ одна: 19:1 アレルヤ — первое место в корпусе, слово неочевидно нехристианину.

