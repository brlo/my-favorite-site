verses:
  1: "サンバラト、トビヤ、アラビア人[じん]ゲシェム、および私[わたし]たちの残[のこ]りの敵[てき]たちは、私[わたし]が城壁[じょうへき]を建[た]てたこと、彼[かれ]らのうちに破[やぶ]れ口[くち]が一[ひと]つも残[のこ]っていないことを聞[き]いた。ただし、その時[とき]まで私[わたし]は門[もん]に扉[とびら]を建[た]てていなかった。"
  2: "サンバラトとゲシェムは、私[わたし]のもとへ使者[ししゃ]を遣[つか]わして言[い]った。「オノの平野[へいや]の村[むら]で、私[わたし]たちと会[あ]おう。」しかし、彼[かれ]らは私[わたし]に害[がい]を加[くわ]えようと企[たくら]んでいた。"
  3: "私[わたし]は彼[かれ]らに使者[ししゃ]たちを遣[つか]わして言[い]った。「私[わたし]は大[おお]きな仕事[しごと]をしているので、降[お]りて行[い]けない。仕事[しごと]がやんでしまうといけないからである。それを終[お]えたら、あなたがたのところへ降[お]りて行[い]こう。」"
  4: "彼[かれ]らはこの同[おな]じ言葉[ことば]を、四度[よんど]まで私[わたし]に送[おく]ってきた。私[わたし]もそのつど、同[おな]じように答[こた]えた。"
  5: "サンバラトは五度目[ごどめ]に、自分[じぶん]の僕[しもべ]を私[わたし]のもとへ遣[つか]わした。その手[て]には開[ひら]かれた手紙[てがみ]があった。"
  6: "その中[なか]にはこう書[か]かれていた。「諸国[しょこく]の間[あいだ]で、あなたとユダの人[ひと]々[びと]が背[そむ]こうとしていると聞[き]こえた。だからあなたは城壁[じょうへき]を建[た]てているのだ。そしてあなたは、彼[かれ]らの王[おう]になろうとしている。"
  7: "また、あなたは自分[じぶん]のために預言者[よげんしゃ]たちを立[た]て、エルサレムでユダの王[おう]として座[すわ]ると宣[の]べさせている。今[いま]、これらの言葉[ことば]は王[おう]に告[つ]げられるだろう。だから今[いま]、来[き]て、共[とも]に相談[そうだん]しよう。」"
  8: "私[わたし]は彼[かれ]に遣[つか]わして言[い]った。「あなたが言[い]うようなことは起[お]こっていない。あなたが自分[じぶん]の心[こころ]でそれを捏[で]ち上[あ]げているのだ。」"
  9: "彼[かれ]らはみな、私[わたし]たちを恐[おそ]れさせて言[い]った。「彼[かれ]らの手[て]はこの仕事[しごと]から落[お]ち、それは成[な]し遂[と]げられない。」しかし今[いま]、私[わたし]は自分[じぶん]の手[て]を強[つよ]くした。"
  10: "私[わたし]はデラヤの子[こ]、メヘタベルの子[こ]シェマヤの家[いえ]へ行[い]った。彼[かれ]は閉[と]じこもっていた。彼[かれ]は言[い]った。「神[かみ]の家[いえ]の内[うち]に入[はい]って会[あ]おう。神殿[しんでん]の扉[とびら]を閉[と]ざそう。彼[かれ]らは夜[よる]、あなたを殺[ころ]しに来[く]るからである。」"
  11: "私[わたし]は言[い]った。「私[わたし]のような者[もの]が逃[に]げるだろうか。私[わたし]のような者[もの]が神殿[しんでん]に入[はい]って生[い]き延[の]びるだろうか。私[わたし]は入[はい]らない。」"
  12: "私[わたし]は悟[さと]った。見[み]よ、神[かみ]が彼[かれ]を遣[つか]わしたのではない。その預言[よげん]は私[わたし]に反[はん]する言葉[ことば]であった。トビヤとサンバラトが彼[かれ]を雇[やと]ったのである。"
  13: "彼[かれ]らは、私[わたし]が恐[おそ]れてそうし、罪[つみ]を犯[おか]して、彼[かれ]らにとって悪[わる]い名[な]の者[もの]となり、彼[かれ]らが私[わたし]を嘲[あざけ]るために、私[わたし]に群[む]れを向[む]けたのである。"
  14: "私[わたし]の神[かみ]よ、トビヤとサンバラトを、彼[かれ]らのこれらの行[おこな]いに従[したが]って覚[おぼ]えてください。また、預言者[よげんしゃ]ノアデヤと、私[わたし]を恐[おそ]れさせる残[のこ]りの預言者[よげんしゃ]たちを覚[おぼ]えてください。"
  15: "城壁[じょうへき]はエルルの月[つき]の二十五日[にじゅうごにち]に、五十[ごじゅう]二日[ふつか]で完成[かんせい]した。"
  16: "私[わたし]たちの敵[てき]たちがみなこれを聞[き]くと、私[わたし]たちの周[まわ]りのすべての国々[くにぐに]は恐[おそ]れた。彼[かれ]らの目[め]に非常[ひじょう]な恐[おそ]れが臨[のぞ]んだ。そして、この仕事[しごと]が私[わたし]たちの神[かみ]によって完成[かんせい]されたことを知[し]った。"
  17: "その日[ひ]々[び]、ユダの貴人[きじん]たちはトビヤに多[おお]くの手紙[てがみ]を送[おく]り、トビヤからの手紙[てがみ]も彼[かれ]らのもとに来[き]ていた。"
  18: "多[おお]くの者[もの]たちが彼[かれ]と誓[ちか]いを結[むす]んでいたからである。彼[かれ]はアラハの子[こ]シェカニヤの婿[むこ]であり、その子[こ]ヨハナンはバラキヤの子[こ]メシュラムの娘[むすめ]を妻[つま]に迎[むか]えていた。"
  19: "また、彼[かれ]の良[よ]い行[おこな]いについても、彼[かれ]らは私[わたし]の前[まえ]で語[かた]り、私[わたし]の言葉[ことば]を彼[かれ]に伝[つた]えていた。トビヤは私[わたし]を恐[おそ]れさせるために手紙[てがみ]を送[おく]ってきた。"

notes:
  1: "ᾠκοδόμησα τὸ τεῖχος — «я построил стену». οὐ κατελείφθη ἐν αὐτοῖς πνοή — букв. «не осталось в них дыхания», т. е. ни одного пролома; слав. «не остася в них скважня». ἕως τοῦ καιροῦ ἐκείνου θύρας οὐκ ἐπέστησα — «до того времени я не поставил дверей [в воротах]» (ἐφίστημι); 扉."
  2: "Δεῦρο καὶ συναχθῶμεν ἐπὶ τὸ αὐτό — «приди, и сойдёмся вместе». ἐν ταῖς κώμαις ἐν πεδίῳ Ωνω — «в селениях на равнине Оно» (Ωνω; евр. אונו), オノ. λογιζόμενοι ποιῆσαί μοι πονηρίαν — «замышляя сделать мне зло» (λογίζομαι)."
  3: "Ἔργον μέγα ἐγὼ ποιῶ — «я делаю великое дело». μήποτε καταπαύσῃ τὸ ἔργον — «как бы не остановилось дело». ὡς ἂν τελειώσω αὐτό — «когда окончу его» (τελειόω). В LXX ответ дан в форме, близкой к прямой речи, но без «говоря»."
  4: "ὡς τὸ ῥῆμα τοῦτο — «по слову сему», т. е. с тем же приглашением. ἀπέστειλα αὐτοῖς κατὰ ταῦτα — «я отвечал им соответственно»; слав. и ру уточняют «четырежды» (слав. «четырижды»), в греч. числа нет."
  5: "τὸν παῖδα αὐτοῦ — «слугу своего». ἐπιστολὴν ἀνεῳγμένην — «открытое письмо» (ἀνοίγω): открытое, чтобы любой мог прочесть, — род давления."
  6: "Ἐν ἔθνεσιν ἠκούσθη — «слышно у народов». λογίζεσθε ἀποστατῆσαι — «вы замышляете отпасть» (ἀποστατέω), 背く. σὺ γίνῃ αὐτοῖς εἰς βασιλέα — «ты становишься у них царём». Содержание письма — 「…」 до ст. 7."
  7: "προφήτας ἔστησας σεαυτῷ — «ты поставил себе пророков». ἵνα καθίσῃς ἐν Ιερουσαλημ εἰς βασιλέα ἐν Ιουδα — «чтобы ты сел в Иерусалиме царём над Иудой». ἀπαγγελήσονται τῷ βασιλεῖ — «будет донесено царю». δεῦρο βουλευσώμεθα ἐπὶ τὸ αὐτό — «приди, посоветуемся вместе»."
  8: "Οὐκ ἐγενήθη ὡς οἱ λόγοι οὗτοι — «не было [ничего] такого, как слова эти». ἀπὸ καρδίας σου σὺ ψεύδῃ αὐτούς — «от сердца твоего ты выдумываешь их» (ψεύδομαι — лгать); 捏ち上げる."
  9: "φοβερίζουσιν ἡμᾶς — «они устрашают нас» (φοβερίζω). Ἐκλυθήσονται αἱ χεῖρες αὐτῶν — «опустятся руки их» (ἐκλύω — ослаблять). ἐκραταίωσα τὰς χεῖράς μου — «я укрепил руки свои» (κραταιόω); слав. «укрепих руки моя»."
  10: "Σεμει υἱοῦ Δαλαια υἱοῦ Μεηταβηλ — Шемаия, сын Делаии, сына Мегетавела. καὶ αὐτὸς συνεχόμενος — «и он был в затворе/задержан» (συνέχω; слав. «той заключен», ру «он заперся»); 閉じこもっていた. εἰς οἶκον τοῦ θεοῦ ἐν μέσῳ αὐτοῦ — «в дом Божий, внутрь его», т. е. в самое святилище, куда мирянину нельзя; 神殿の真ん中."
  11: "Τίς ἐστιν ὁ ἀνήρ, ὃς εἰσελεύσεται εἰς τὸν οἶκον καὶ ζήσεται — «кто тот человек, который войдёт в дом и останется жив?»; слав. добавляет «кто, как я, убежит?» («яков аз, и убежит?»), поэтому в тексте два вопроса. Неемия отказывается и бежать, и искать убежища в храме."
  12: "ἐπέγνων — «я узнал, понял» (ἐπιγινώσκω). ἡ προφητεία λόγος κατ᾿ ἐμοῦ — «пророчество — слово против меня». ἐμισθώσαντο — «наняли» (μισθόω); 雇った."
  13: "ἐπ᾿ ἐμὲ ὄχλον — «на меня толпу» (ὄχλος); слав. «наяста на мя народ». ὅπως φοβηθῶ καὶ ποιήσω οὕτως καὶ ἁμάρτω — «чтобы я испугался, сделал так и согрешил». εἰς ὄνομα πονηρόν — «в худое имя», т. е. на дурную славу; 悪い名の者. ὅπως ὀνειδίσωσίν με — «чтобы поносили меня»."
  14: "μνήσθητι, ὁ θεός, τῷ Τωβια καὶ τῷ Σαναβαλλατ — «помяни, Боже, Товию и Санаваллата» (дат. лица). ὡς τὰ ποιήματα αὐτοῦ ταῦτα — «по делам его сим» (ποίημα). Νωαδια τῷ προφήτῃ — Ноадия «пророк» (в ру — «пророчица»); род в греч. мужской, поэтому 預言者. τοῖς καταλοίποις τῶν προφητῶν — «прочим пророкам». Стих — молитва-памятка, как 5:19."
  15: "ἐτελέσθη τὸ τεῖχος — «стена была завершена» (τελέω). πέμπτῃ καὶ εἰκάδι τοῦ Ελουλ — «в двадцать пятый [день] Елула» (месяц элул, август–сентябрь), エルルの月の二十五日. εἰς πεντήκοντα καὶ δύο ἡμέρας — «за пятьдесят два дня»."
  16: "ἐπέπεσεν φόβος σφόδρα ἐν ὀφθαλμοῖς αὐτῶν — «пал страх великий в очах их» (ἐπιπίπτω). παρὰ τοῦ θεοῦ ἡμῶν ἐγενήθη τελειωθῆναι τὸ ἔργον — «от Бога нашего было совершить дело это» (παρά + род. — «от»); слав. «от Господа Бога нашего совершено бысть дело сие»."
  17: "ἀπὸ πολλῶν ἐντίμων Ιουδα — «от многих знатных Иудеев». ἐπιστολαὶ ἐπορεύοντο πρὸς Τωβιαν — «письма шли к Товии»; καὶ αἱ Τωβια ἤρχοντο πρὸς αὐτούς — «и Товиины приходили к ним», т. е. переписка в обе стороны; 貴人たち."
  18: "ἔνορκοι ἦσαν αὐτῷ — «были в клятвенном союзе с ним» (ἔνορκος). γαμβρὸς ἦν τοῦ Σεχενια υἱοῦ Ηραε — «он был зятем Шехании, сына Араха» (слав. «сехении сына ираева»), 婿. Ιωαναν υἱὸς αὐτοῦ — Иоханан, сын его [Товии]; ἔλαβεν τὴν θυγατέρα Μεσουλαμ… εἰς γυναῖκα — «взял дочь Мешуллама в жёны»."
  19: "τοὺς λόγους αὐτοῦ ἦσαν λέγοντες πρός με — «слова его говорили мне», т. е. расхваливали его при мне. λόγους μου ἦσαν ἐκφέροντες αὐτῷ — «слова мои передавали ему» (ἐκφέρω — выносить, доносить). ἐπιστολὰς ἀπέστειλεν Τωβιας φοβερίσαι με — «Товия посылал письма, чтобы устрашить меня»."
