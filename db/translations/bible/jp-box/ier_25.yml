# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
#
# Глава 25 СОСТАВНАЯ — порядок LXX, номера по gr; карта gr → слав./ru:
#   gr 25:1–13  = слав./ru 25:1–13   слово ко всей Иуде и семьдесят лет;
#   gr 25:14    = слав. 49:34а       надписание об Еламе («Слово Господне… на елам»);
#   gr 25:15–19 = слав. 49:35–39     оракул об Еламе (в слав. стоит в конце книги,
#                                    между Дамаском и Моавом, и не в 25-й главе);
#   gr 25:20    = слав. 49:34б       датировка «в начале царства Седекии».
# ВАЖНО: в брифе сказано, что ст. 20 — это слав. 26:1; это неточно. Слав. 26:1
# («В начале царства иоакима…») говорит о Иоакиме и соответствует gr 33:1 (речь
# в храме), к Еламу отношения не имеет. Содержание ст. 20 — датировка Елама, в слав.
# она стоит во второй половине 49:34. Стих влит как ст. 20, отдельный стих не добавлен.
#
# Структура главы: 1–2 надписание и введение; 3–7 речь: двадцать три года проповеди,
# посланные пророки, призыв обратиться; 8–13 суд: север и Вавилон, семьдесят лет,
# запустение Вавилона; 14–19 Елам: лук сокрушён, четыре ветра, престол Господень
# в Еламе, возвращение плена; 20 датировка Елама. Нумерация по gr: 20 стихов.
# Голоса: 1–2 авторское повествование; 3–7 「…» (в 5–6 вложено 『…』 — прежняя
# проповедь пророков); 8–13 「…» слово Господа; 14 надписание без кавычек;
# 15–19 「…»; 20 повествование без кавычек.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX) по корпусу:
# ヨヤキム, ヨシヤ, アモス, ゼデキヤ, ネブカドネツァル, カルデア人, エラム, ユダ,
# エルサレム, バビロン.
