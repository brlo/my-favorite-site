verses:
  1: "そこで、もしキリストにあって慰[なぐさ]めがあり、愛[あい]の励[はげ]ましがあり、{聖霊[せいれい]|聖神[せいしん]}の交[まじ]わりがあり、慈[いつく]しみとあわれみがあるなら、"
  2: "わたしの喜[よろこ]びを満[み]たしてほしい。同[おな]じ思[おも]いを抱[いだ]き、同[おな]じ愛[あい]を持[も]ち、心[こころ]を一[ひと]つにし、同[おな]じことを思[おも]ってほしい。"
  3: "何事[なにごと]も、利己的[りこてき]な野心[やしん]から、あるいは虚栄[きょえい]からして行[おこな]わず、むしろへりくだって、互[たが]いに相手[あいて]を自分[じぶん]より優[すぐ]れた者[もの]と考え、"
  4: "それぞれ、自分[じぶん]のことだけでなく、ほかの人[ひと]のことにも目[め]を向[む]けなさい。"
  5: "あなたがたは、キリスト・イエスにある思[おも]いを、自分[じぶん]たちの間[あいだ]でも抱[いだ]きなさい。"
  6: "この方[かた]は、神[かみ]の形[かたち]でありながら、神[かみ]と等[ひと]しい者[もの]であることを、奪[うば]い取[と]るべきものとはお思[おも]いにならず、"
  7: "かえって、ご自分[じぶん]を空[むな]しくされ、僕[しもべ]の形[かたち]をお取[と]りになって、人[ひと]と同[おな]じようになられ、姿[すがた]としては人[ひと]と見[み]える者[もの]となられた。"
  8: "ご自分[じぶん]を低[ひく]くされ、死[し]に至[いた]るまで、しかも十字架[じゅうじか]の死[し]に至[いた]るまで従順[じゅうじゅん]になられた。"
  9: "それゆえ、神[かみ]はこの方[かた]をすべての上[うえ]に高[たか]く上げ、すべての名[な]にまさる名[な]をお与[あた]えになった。"
  10: "それは、「イエスの名[な]によって、天上[てんじょう]のもの、地上[ちじょう]のもの、地[ち]の下[した]のもののすべての膝[ひざ]がかがみ、"
  11: "すべての舌[した]が『イエス・キリストは主[しゅ]である』と告白[こくはく]して、父[ちち]なる神[かみ]に栄光[えいこう]を帰[き]す」ためである。"
  12: "だから、わたしの愛[あい]する者[もの]たちよ。あなたがたがいつも従[したが]ってきたように、わたしが一緒[いっしょ]にいるときだけでなく、今[いま]、わたしが離[はな]れているときには、なおさら、恐[おそ]れとおののきをもって、自分[じぶん]たちの救[すく]いを全[まっと]うしなさい。"
  13: "というのは、あなたがたのうちに働[はたら]いて、御心[みこころ]のままに、願[ねが]うことと行[おこな]うことを起[お]こしてくださるのは神[かみ]だからである。"
  14: "すべてのことを、つぶやきや疑[うたが]いなしに行[おこな]いなさい。"
  15: "そうすれば、あなたがたは、曲[まが]った、ねじれた時代[じだい]のただ中[なか]で、咎[とが]のない、純真[じゅんしん]な、傷[きず]のない神[かみ]の子[こ]となる。あなたがたは、その中[なか]で、世[よ]にあって星[ほし]のように輝[かがや]いている。"
  16: "命[いのち]の言葉[ことば]をしっかり保[たも]ち、キリストの日[ひ]に、わたしが走[はし]ったことも、労[ろう]したことも無駄[むだ]ではなかったと誇[ほこ]れるようにするためである。"
  17: "しかし、たとえわたしが、あなたがたの信仰[しんこう]の供[そな]えと奉[ほう]仕[し]の上[うえ]に、注[そそ]ぎの酒[さけ]として注[そそ]がれても、わたしは喜[よろこ]び、あなたがたすべてとともに喜[よろこ]ぶ。"
  18: "同[おな]じように、あなたがたも喜[よろこ]び、わたしとともに喜[よろこ]びなさい。"
  19: "わたしは主[しゅ]イエスにあって、すぐにテモテをあなたがたのもとへ遣[つか]わしたいと望[のぞ]んでいる。それは、わたしもあなたがたのことを知[し]って、心[こころ]を慰[なぐさ]められるようにするためである。"
  20: "というのは、わたしには、あなたがたのことを真実[しんじつ]に気[き]にかけてくれる、同[おな]じ心[こころ]の者[もの]がほかにいないからである。"
  21: "というのは、みな自分[じぶん]のことを求[もと]めて、キリスト・イエスのことを求[もと]めていないからである。"
  22: "しかし、あなたがたは彼[かれ]の真価[しんか]を知[し]っている。彼[かれ]が、子[こ]が父[ちち]に仕[つか]えるように、わたしとともに福音[ふくいん]のために仕[つか]えたことを。"
  23: "そこで、わたしの身[み]に何[なに]が起[お]こるかを見届[みとど]けたら、すぐに彼[かれ]を遣[つか]わしたいと望[のぞ]んでいる。"
  24: "わたしは主[しゅ]にあって、自分[じぶん]も間[ま]もなく行[い]くと確信[かくしん]している。"
  25: "しかし、わたしは、兄弟[きょうだい]エパフロディト、わたしの同労[どうろう]者[しゃ]、戦友[せんゆう]、あなたがたの使者[ししゃ]であり、わたしの必要[ひつよう]に仕[つか]えた者[もの]を、あなたがたのもとへ遣[つか]わすことが必要[ひつよう]だと考えた。"
  26: "彼[かれ]は、あなたがたすべてを慕[した]い、また、あなたがたが自分[じぶん]の病気[びょうき]のことを聞[き]いたと知[し]って、心[こころ]を痛[いた]めていたからである。"
  27: "というのは、彼[かれ]は死[し]に近[ちか]いほどに病[や]んだからである。しかし、神[かみ]は彼[かれ]をあわれみ、彼[かれ]だけでなく、わたしをもあわれんでくださった。わたしが悲[かな]しみに悲[かな]しみを重[かさ]ねないようにするためであった。"
  28: "そこで、わたしはますます急[いそ]いで彼[かれ]を遣[つか]わした。あなたがたが再[ふたた]び彼[かれ]を見[み]て喜[よろこ]び、わたしの悲[かな]しみも少[すこ]しでも軽[かる]くなるためである。"
  29: "だから、あなたがたは、主[しゅ]にあって、大[おお]いなる喜[よろこ]びをもって彼[かれ]を受[う]け入[い]れ、このような人[ひと]たちを敬[うやま]いなさい。"
  30: "というのは、彼[かれ]はキリストの働[はたら]きのために、死[し]に近[ちか]づき、自分[じぶん]の命[いのち]を惜[お]しまなかったからである。あなたがたがわたしに果[は]たすべき奉[ほう]仕[し]の不足[ふそく]を補[おぎな]うためであった。"

notes:
  1: "εἴ τις οὖν — そこで、もし. παράκλησις — 慰め. παραμύθιον ἀγάπης — 愛の励まし. κοινωνία πνεύματος — {聖霊|聖神}の交わり (греч. πνεῦμα без ἅγιον). σπλάγχνα καὶ οἰκτιρμοί — 慈しみとあわれみ."
  2: "πληρώσατέ μου τὴν χαράν — 喜びを満たしてほしい. τὸ αὐτὸ φρονῆτε — 同じ思いを抱き. σύμψυχοι — 心を一つにし. τὸ ἓν φρονοῦντες — 同じことを思って."
  3: "μηδὲν κατ᾽ ἐριθείαν μηδὲ κατὰ κενοδοξίαν — 利己的な野心から、あるいは虚栄から. ταπεινοφροσύνη — へりくだり. ἡγούμενοι ὑπερέχοντας ἑαυτῶν — 相手を自分より優れた者と考える."
  4: "μὴ τὰ ἑαυτῶν ἕκαστος σκοποῦντες — 自分のことだけでなく. ἕτεροι — ほかの人."
  5: "τοῦτο φρονεῖτε ἐν ὑμῖν — 自分たちの間でも抱きなさい. ὃ καὶ ἐν Χριστῷ Ἰησοῦ — キリスト・イエスにある思い."
  6: "ἐν μορφῇ θεοῦ ὑπάρχων — 神の形でありながら. ἁρπαγμός — «похищение, то, что хватают»; 奪い取るべきもの (crux, не сглажен). ἴσα θεῷ — 神と等しい者."
  7: "ἀλλὰ ἑαυτὸν ἐκένωσεν — かえって、ご自分を空しくし. μορφὴν δούλου λαβών — 僕の形を取って. ἐν ὁμοιώματι ἀνθρώπων — 人と同じようになり. σχήματι — 姿としては."
  8: "ἐταπείνωσεν ἑαυτόν — ご自分を低くして. ὑπήκοος μέχρι θανάτου — 死に至るまで従順. θανάτου δὲ σταυροῦ — しかも十字架の死に至るまで."
  9: "διὸ καί — それゆえ. ὑπερύψωσεν — すべての上に高く上げ. ὄνομα τὸ ὑπὲρ πᾶν ὄνομα — すべての名にまさる名."
  10: "Ис 45:23. ἵνα — それは…ためである. γόνυ κάμψῃ — 膝がかがみ. ἐπουρανίων, ἐπιγείων, καταχθονίων — 天上のもの、地上のもの、地の下のもの. Цитата открывается 「 и продолжается в 2:11."
  11: "πᾶσα γλῶσσα ἐξομολογήσεται — すべての舌が…告白して. κύριος Ἰησοῦς Χριστός — 『イエス・キリストは主である』 (вложенная речь). εἰς δόξαν θεοῦ πατρός — 父なる神に栄光を帰す; цитата закрывается 」."
  12: "Ὥστε — だから. ἀγαπητοί μου — わたしの愛する者たち. μετὰ φόβου καὶ τρόμου — 恐れとおののきをもって. κατεργάζεσθε — 全うしなさい."
  13: "θεὸς γάρ ἐστιν ὁ ἐνεργῶν — というのは、…のは神だからである. τὸ θέλειν καὶ τὸ ἐνεργεῖν — 願うことと行うこと. ὑπὲρ τῆς εὐδοκίας — 御心のままに."
  14: "γογγυσμοί — つぶやき. διαλογισμοί — 疑い."
  15: "ἄμεμπτοι, ἀκέραιοι, ἄμωμα — 咎のない、純真な、傷のない. γενεὰ σκολιά — 曲がった時代. φωστῆρες — 星のように輝く者."
  16: "λόγον ζωῆς ἐπέχοντες — 命の言葉をしっかり保ち. καύχημα — 誇り. εἰς κενὸν ἔδραμον — 無駄に走った. ἐκοπίασα — 労した."
  17: "σπένδομαι — 注ぎの酒として注がれる. θυσία καὶ λειτουργία τῆς πίστεως — 信仰の供えと奉仕. χαίρω καὶ συγχαίρω — 喜び、ともに喜ぶ."
  18: "τὸ αὐτὸ — 同じように. χαίρετε καὶ συγχαίρετέ μοι — 喜び、わたしとともに喜びなさい."
  19: "ἐλπίζω ἐν κυρίῳ Ἰησοῦ — 主イエスにあって望んでいる. ταχέως — すぐに. εὐψυχῶ — 心を慰められる."
  20: "ἰσόψυχον — 同じ心の者. γνησίως — 真実に. μεριμνήσει — 気にかけてくれる."
  21: "οἱ πάντες — みな. τὰ ἑαυτῶν ζητοῦσιν — 自分のことを求めて. τὰ Ἰησοῦ Χριστοῦ — キリスト・イエスのこと."
  22: "δοκιμή — 真価. ὡς πατρὶ τέκνον — 子が父に仕えるように. ἐδούλευσεν — 仕えた."
  23: "τοῦτον μὲν οὖν — そこで. ἀφίδω — 見届けたら. ἐξαυτῆς — すぐに."
  24: "πέποιθα ἐν κυρίῳ — 主にあって確信している. αὐτός — 自分も."
  25: "Ἐπαφρόδιτον — エパフロディト. συνεργός, συστρατιώτης — 同労者、戦友. ἀπόστολος здесь — 使者 (не «апостол»). λειτουργός — 仕えた者."
  26: "ἐπιποθῶν ἦν — 慕っていた. ἀδημονῶν — 心を痛めていた. ἠσθένησεν — 病気になった."
  27: "παραπλήσιον θανάτῳ — 死に近いほど. ἠλέησεν — あわれみ. λύπην ἐπὶ λύπην — 悲しみに悲しみを重ねる."
  28: "σπουδαιοτέρως — ますます急いで. ἀλυπότερος — 悲しみを和らげる."
  29: "προσδέχεσθε — 受け入れ. ἐντίμους ἔχετε — 敬いなさい."
  30: "ἔργον Χριστοῦ — キリストの働き. παραβολευσάμενος τῇ ψυχῇ — 命を惜しまなかった. ὑστέρημα τῆς λειτουργίας — 奉仕の不足を補う."
