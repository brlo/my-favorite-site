# jp-box, Послание к Филиппийцам, глава 2. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 2: призыв к единомыслию и смиренномудрию (1–4), гимн Христу (5–11),
# «со страхом и трепетом совершайте спасение» (12–18), Тимофей и Епафродит (19–30).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет, <j>/<mo> не ставятся.
# 〔…〕 в главе нет: все слова в базе gr-lxx-byz есть.
# 2:6 ἁρπαγμός — crux, передан «奪い取るべきもの» без сглаживания; 2:7 ἐκένωσεν — «空しくし».
# 2:10–11 — адаптированная цитата Ис 45:23: внешние 「…」 открываются в 2:10 и закрываются
# в 2:11, внутри 『…』 — исповедание «イエス・キリストは主である».
# Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

