# jp-box, Псалтирь, псалом 48. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный 常体, без 文語.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0.
# Псалом 48: призыв к мудрости (1–4), загадка о богатстве и смерти (5–9),
# нищий и богатый равно умирают (10–12), притча о пути безумных (13–14),
# Бог выкупит душу (15), не бойся богатого (16–19), припев о человеке в чести (20).
# Красного и синего нет. Кавычек нет: прямой речи в псалме нет.
# 〔…〕 нет: все слова в gr-lxx-byz есть (проверено tmp/bracket_check.rb).
# セラ (διάψαλμα, в конце ст. 13 и 15) не передаётся — по решению пользователя, как у jp-joc.
# Сносок ⟨…⟩ нет: 陰府, 贖い, 琴 уже в корпусе.
# jp-ni не использовался.

