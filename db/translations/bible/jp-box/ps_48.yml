verses:
  0: "指揮者[しきしゃ]に。コラの子[こ]らの詩[うた]。"
  1: "すべての民[たみ]よ、これを聞[き]け。地[ち]に住[す]むすべての者[もの]よ、耳[みみ]を傾[かたむ]けよ。"
  2: "地[ち]に生[う]まれた者[もの]も人[ひと]の子[こ]らも、富[とみ]ある者[もの]も貧[まず]しい者[もの]も、ともに。"
  3: "わたしの口[くち]は知恵[ちえ]を語[かた]り、わたしの心[こころ]の思[おも]いは悟[さと]りを語[かた]る。"
  4: "わたしは耳[みみ]を傾[かたむ]けてたとえを聞[き]き、琴[こと]に合わせて謎[なぞ]を解[と]き明[あ]かす。"
  5: "悪[わる]い日[ひ]に、わたしはなぜ恐[おそ]れるのか。わたしのかかとを狙[ねら]う者[もの]の不法[ふほう]が、わたしを取[と]り囲[かこ]むというのに。"
  6: "自分[じぶん]の力[ちから]に寄[よ]り頼[たの]み、財[ざい]の多[おお]さを誇[ほこ]る者[もの]たちよ。"
  7: "だれも、兄弟[きょうだい]を贖[あがな]うことはできない。人[ひと]は神[かみ]に自分[じぶん]の贖[あがない]の代[しろ]を払[はら]えない。"
  8: "自分[じぶん]の魂[たましい]を贖[あがな]う代価[だいか]は、あまりに高[たか]い。"
  9: "とこしえに苦労[くろう]しても終[お]わりまで生[い]き、腐[くち]はてるのを見[み]ずにすむ、ということはない。知恵[ちえ]ある者[もの]が死[し]ぬのを、人[ひと]は見[み]るのだ。"
  10: "愚[おろ]かな者[もの]も知[し]恵[え]のない者[もの]もともに滅[ほろ]び、その富[とみ]を他人[たにん]に残[のこ]す。"
  11: "彼[かれ]らの墓[はか]はとこしえに彼[かれ]らの家[いえ]となり、住[す]まいは代々[だいだい]に及[およ]ぶ。彼[かれ]らは自分[じぶん]の名[な]をその土地[とち]に呼[よ]びつけた。"
  12: "栄誉[えいよ]のうちにある人[ひと]も、悟[さと]ることがない。その人[ひと]は知[し]恵[え]のない獣[けもの]に等[ひと]しくされ、獣[けもの]のようになる。"
  13: "これが彼[かれ]らの道[みち]であり、彼[かれ]らにはつまずきとなる。それでも後[のち]になって、人[ひと]々[びと]は彼[かれ]らの言葉[ことば]を良[よ]しとする。"
  14: "彼[かれ]らは陰府[よみ]に置[お]かれた羊[ひつじ]のようになり、死[し]が彼[かれ]らを牧[ぼく]する。朝[あさ]になると正[ただ]しい者[もの]たちが彼[かれ]らを治[おさ]め、彼[かれ]らの力[ちから]は陰府[よみ]で朽[く]ちて、その栄[さか]えは消[き]え去[さ]る。"
  15: "しかし、神[かみ]は、わたしを迎[むか]えられるとき、わたしの魂[たましい]を陰府[よみ]の手[て]から贖[あがな]い出[だ]してくださる。"
  16: "人[ひと]が富[とみ]を得[え]、その家[いえ]の栄[さか]えが増[ま]しても、恐[おそ]れるな。"
  17: "その人[ひと]は死[し]ぬとき、何[なに]一つ持[も]って行[ゆ]けない。その栄[さか]えも、彼[かれ]とともに下[お]りて行[ゆ]かない。"
  18: "その人[ひと]は生[い]きている間[あいだ]、自分[じぶん]の魂[たましい]を幸[しあわ]せなものとし、あなたがその人[ひと]を良[よ]くしてくださるときには、あなたをほめたたえる。"
  19: "その人[ひと]は自分[じぶん]の父[ちち]たちの代[よ]へと行[ゆ]き、とこしえに光[ひかり]を見[み]ることはない。"
  20: "栄誉[えいよ]のうちにある人[ひと]も、悟[さと]ることがない。その人[ひと]は知[し]恵[え]のない獣[けもの]に等[ひと]しくされ、獣[けもの]のようになる。"

notes:
  0: "Εἰς τὸ τέλος· τοῖς υἱοῖς Κορε ψαλμός — 指揮者に。コラの子らの詩. Надписание — стих 0, скобками не маркируется; нумерация LXX, как в русской базе."
  1: "Ἀκούσατε ταῦτα, πάντα τὰ ἔθνη — すべての民よ、これを聞け (ἀκούω — «слушать»). ἐνωτίσασθε, πάντες οἱ κατοικοῦντες τὴν οἰκουμένην — 地に住むすべての者よ、耳を傾けよ (ἐνωτίζομαι — «внимать», букв. «влагать в уши»; οἰκουμένη — «вселенная»)."
  2: "οἵ τε γηγενεῖς καὶ οἱ υἱοὶ τῶν ἀνθρώπων — 地に生まれた者も人の子らも (γηγενής — «земнородный», т. е. простой, низкий родом). ἐπὶ τὸ αὐτό, πλούσιος καὶ πένης — 富ある者も貧しい者も、ともに (ἐπὶ τὸ αὐτό — «вместе»)."
  3: "τὸ στόμα μου λαλήσει σοφίαν — わたしの口は知恵を語り (σοφία — 知恵). ἡ μελέτη τῆς καρδίας μου σύνεσιν — わたしの心の思いは悟りを語る (μελέτη — «размышление»; σύνεσις — «разумение»)."
  4: "κλινῶ εἰς παραβολὴν τὸ οὖς μου — わたしは耳を傾けてたとえを聞き (παραβολή — «притча, сравнение»). ἀνοίξω ἐν ψαλτηρίῳ τὸ πρόβλημά μου — 琴に合わせて謎を解き明かす (ψαλτήριον — «псалтирь», струнный инструмент, отсюда 琴; πρόβλημα — «загадка»)."
  5: "ἵνα τί φοβοῦμαι ἐν ἡμέρᾳ πονηρᾷ — 悪い日に、わたしはなぜ恐れるのか (ἡμέρα πονηρά — «день злой», день бедствия). ἡ ἀνομία τῆς πτέρνης μου κυκλώσει με — わたしのかかとを狙う者の不法が、わたしを取り囲む (ἀνομία τῆς πτέρνης — «неправда пяты моей», т. е. коварство преследователей; πτέρνα — かかと)."
  6: "οἱ πεποιθότες ἐπὶ τῇ δυνάμει αὐτῶν — 自分の力に寄り頼み (πείθω в perfect — «положиться»). ἐπὶ τῷ πλήθει τοῦ πλούτου αὐτῶν καυχώμενοι — 財の多さを誇る者たちよ (καυχάομαι — «хвалиться»). Стих продолжается в ст. 7 — связь сохранена и по-японски."
  7: "ἀδελφὸς οὐ λυτροῦται — だれも、兄弟を贖うことはできない (λυτρόω — 贖う). λυτρώσεται ἄνθρωπος; — 人にできるのか (вопрос, передан утверждением невозможности). οὐ δώσει τῷ θεῷ ἐξίλασμα αὐτοῦ — 人は神に自分の贖いの代を払えない (ἐξίλασμα — «выкуп, умилостивление»)."
  8: "καὶ τὴν τιμὴν τῆς λυτρώσεως τῆς ψυχῆς αὐτοῦ — 自分の魂を贖う代価は (τιμή — «цена»; λύτρωσις — 贖い). Предложение в греч. оборвано и продолжается в ст. 9; по-японски закончено あまりに高い, чтобы не оставлять читателя с обрывом, — смысл сохранён."
  9: "καὶ ἐκόπασεν εἰς τὸν αἰῶνα καὶ ζήσεται εἰς τέλος — とこしえに労しても終わりまで生き (κοπιάω — «трудиться, изнемогать»). ὅτι οὐκ ὄψεται καταφθοράν — 腐はてるのを見ずにすむ、ということはない (καταφθορά — «истление, гибель»; отрицание отнесено ко всему обороту). ὅταν ἴδῃ σοφοὺς ἀποθνῄσκοντας — 知恵ある者が死ぬのを、人は見る (ὅταν + конъюнктив)."
  10: "ἐπὶ τὸ αὐτὸ ἄφρων καὶ ἄνους ἀπολοῦνται — 愚かな者も知恵のない者もともに滅び (ἄφρων — «безумный»; ἄνους — «неразумный»; оба слова сохранены). καταλείψουσιν ἀλλοτρίοις τὸν πλοῦτον αὐτῶν — その富を他人に残す (ἀλλότριος — «чужой»)."
  11: "οἱ τάφοι αὐτῶν οἰκίαι αὐτῶν εἰς τὸν αἰῶνα — 彼らの墓はとこしえに彼らの家となり (τάφος — 墓). σκηνώματα αὐτῶν εἰς γενεὰν καὶ γενεάν — 住まいは代々に及ぶ. ἐπεκαλέσαντο τὰ ὀνόματα αὐτῶν ἐπὶ τῶν γαιῶν αὐτῶν — 彼らは自分の名をその土地に呼びつけた (ἐπικαλέομαι — «называть по имени», т. е. называли земли своими именами)."
  12: "ἄνθρωπος ἐν τιμῇ ὢν οὐ συνῆκεν — 栄誉のうちにある人も、悟ることがない (ἐν τιμῇ — «в чести»; συνίημι — «разуметь»). παρασυνεβλήθη τοῖς κτήνεσιν τοῖς ἀνοήτοις — 知恵のない獣に等しくされ (παρασυμβάλλομαι — «уподобляться»; κτῆνος — «скот»). ὡμοιώθη αὐτοῖς — 獣のようになる. Стих повторён в ст. 20 — повтор сохранён дословно, как в греч."
  13: "αὕτη ἡ ὁδὸς αὐτῶν σκάνδαλον αὐτοῖς — これが彼らの道であり、彼らにはつまずきとなる (σκάνδαλον — «преткновение, соблазн»). μετὰ ταῦτα ἐν τῷ στόματι αὐτῶν εὐδοκήσουσιν — それでも後になって、人々は彼らの言葉を良しとする (εὐδοκέω ἐν τῷ στόματι — «одобрять устами»; ср. jp-joc «後の人は尙其の意を是とす»). διάψαλμα не передаётся."
  14: "ὡς πρόβατα ἐν ᾅδῃ ἔθεντο — 彼らは陰府に置かれた羊のようになり (ᾅδης — 陰府, как везде в корпусе). θάνατος ποιμαίνει αὐτούς — 死が彼らを牧する (образ смерти-пастыря, противоположный Пс 22:1). κατακυριεύσουσιν αὐτῶν οἱ εὐθεῖς τὸ πρωί — 朝になると正しい者たちが彼らを治め (κατακυριεύω — «господствовать»; τὸ πρωί — «утром», образ рассвета суда). ἡ βοήθεια αὐτῶν παλαιωθήσεται ἐν τῷ ᾅδῃ ἐκ τῆς δόξης αὐτῶν — 彼らの力は陰府で朽ちて、その栄えは消え去る (παλαιόω — «ветшать»; βοήθεια — «помощь, сила»; ἐκ τῆς δόξης — «от славы их», т. е. лишившись её)."
  15: "πλὴν ὁ θεὸς λυτρώσεται τὴν ψυχήν μου ἐκ χειρὸς ᾅδου — しかし、神はわたしの魂を陰府の手から贖い出してくださる (λύτρωσις/λυτρόω — 贖い; χεὶρ ᾅδου — «рука ада»). ὅταν λαμβάνῃ με — 神がわたしを迎えられるとき (λαμβάνω — «брать, принимать»; ср. «егда приимет мя»). διάψαλμα не передаётся."
  16: "μὴ φοβοῦ, ὅταν πλουτήσῃ ἄνθρωπος — 人が富を得ても、恐れるな (πλουτέω — «богатеть»). ὅταν πληθυνθῇ ἡ δόξα τοῦ οἴκου αὐτοῦ — その家の栄えが増しても (πληθύνω — «умножать»)."
  17: "οὐκ ἐν τῷ ἀποθνῄσκειν αὐτὸν λήμψεται τὰ πάντα — その人は死ぬとき、何一つ持って行けない (τὰ πάντα — «всё»). οὐδὲ συγκαταβήσεται αὐτῷ ἡ δόξα αὐτοῦ — その栄えも、彼とともに下りて行かない (συγκαταβαίνω — «сходить вместе»)."
  18: "ἡ ψυχὴ αὐτοῦ ἐν τῇ ζωῇ αὐτοῦ εὐλογηθήσεται — その人は生きている間、自分の魂を幸せなものとし (εὐλογέω — «благословлять», здесь в смысле «считать благополучным»). ἐξομολογήσεταί σοι, ὅταν ἀγαθύνῃς αὐτῷ — あなたがその人を良くしてくださるときには、あなたをほめたたえる (ἀγαθύνω — «благотворить»; ἐξομολογέομαι — «славить»)."
  19: "εἰσελεύσεται ἕως γενεᾶς πατέρων αὐτοῦ — その人は自分の父たちの代へと行き (γενεὰ πατέρων — «род отцов», т. е. к умершим предкам). ἕως αἰῶνος οὐκ ὄψεται φῶς — とこしえに光を見ることはない (образ шеола как места без света)."
  20: "Повтор ст. 12 — в греч. стих совпадает дословно, припев сохранён (см. notes к ст. 12)."
