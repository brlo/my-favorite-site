# jp-box, Послание к Колоссянам, глава 3. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 3: горнее и земное (1–4), совлечение ветхого человека (5–11),
# облечение в нового (12–17), домостройство (18–25, продолжение в 4:1).
# Красного и синего нет: прямой речи Христа в послании нет, <j>/<mo> не ставятся.
# 〔…〕 в главе нет: [ἐπὶ τοὺς υἱοὺς τῆς ἀπειθείας] (3:6) и [τὰ] (3:11) стоят в базе
# в квадратных скобках, слова есть, поэтому не оборачиваются.
# Домостройство не сглажено: 従いなさい・愛しなさい・畏れて — как в тексте.
# Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

tr_code: jp-box
book: kol
chapter: 3
draft: true

verses:
  1: "だから、あなたがたがキリストとともに復活[ふっかつ]したのなら、上[うえ]にあるものを求[もと]めなさい。そこでは、キリストが神[かみ]の右[みぎ]に座[すわ]しておられる。"
  2: "上[うえ]にあるものを思[おも]い、地[ち]にあるものを思[おも]ってはならない。"
  3: "というのは、あなたがたは死[し]んだのであり、あなたがたの命[いのち]はキリストとともに、神[かみ]のうちに隠[かく]されているからである。"
  4: "あなたがたの命[いのち]であるキリストが現[あらわ]れるとき、あなたがたもキリストとともに、栄光[えいこう]のうちに現[あらわ]れるのである。"
  5: "だから、地[ち]にあるあなたがたの肢体[したい]、すなわち、淫行[いんこう]、不潔[ふけつ]、情欲[じょうよく]、悪[あ]しき欲[よく]、貪欲[どんよく]を殺[ころ]してしまいなさい。貪欲[どんよく]は偶像[ぐうぞう]崇拝[すうはい]である。"
  6: "これらのゆえに、神[かみ]の怒[いか]りが不従順[ふじゅうじゅん]の子[こ]たちに臨[のぞ]むのである。"
  7: "あなたがたもかつては、それらのうちに生[い]きていたとき、その中[なか]を歩[あゆ]んでいたのである。"
  8: "しかし今[いま]は、あなたがたも、怒[いか]り、憤[いきどお]り、悪意[あくい]、ののしり、あなたがたの口[くち]から出[で]る卑[いや]しい言葉[ことば]、これらすべてを捨[す]てなさい。"
  9: "互[たが]いに偽[いつわ]りを言[い]ってはならない。あなたがたは古[ふる]い人[ひと]とその行[おこな]いとを脱[ぬ]ぎ捨[す]て、"
  10: "知識[ちしき]において、自分[じぶん]を造[つく]った方[かた]の像[かたち]に新[あたら]しくされる新[あたら]しい人[ひと]を着[き]たのである。"
  11: "そこには、ギリシア人[じん]もユダヤ人[じん]もなく、割礼[かつれい]も無割礼[むかつれい]もなく、未開[みかい]の人[ひと]もスキタイ人[じん]も、奴隷[どれい]も自由[じゆう]な者[もの]もない。キリストがすべてであり、すべてのうちにおられるのである。"
  12: "だから、神[かみ]に選[えら]ばれた者[もの]、聖[せい]なる者[もの]、愛[あい]されている者[もの]として、あわれみの心[こころ]、親切[しんせつ]、謙遜[けんそん]、柔和[にゅうわ]、寛容[かんよう]を身[み]に着[き]なさい。"
  13: "互[たが]いに耐[た]え忍[しの]び、だれかがほかの人に対[たい]して責[せ]めごとがあっても、互[たが]いに赦[ゆる]し合[あ]いなさい。主[しゅ]があなたがたを赦[ゆる]してくださったように、あなたがたもそうしなさい。"
  14: "これらすべての上[うえ]に愛[あい]を着[き]なさい。愛[あい]は完全[かんぜん]の結[むす]びである。"
  15: "キリストの平和[へいわ]が、あなたがたの心[こころ]を支配[しはい]するようにしなさい。あなたがたは一[ひと]つの体[からだ]として、その平和[へいわ]に召[め]されたのである。また、感謝[かんしゃ]する者[もの]となりなさい。"
  16: "キリストの言葉[ことば]が、あなたがたのうちに豊[ゆたか]に宿[やど]るようにしなさい。あらゆる知恵[ちえ]をもって、詩篇[しへん]と賛歌[さんか]と霊[れい]の歌[うた]とによって互[たが]いに教[おし]え、諭[さと]し、恵[めぐ]みをもって、あなたがたの心[こころ]で神[かみ]に歌[うた]いなさい。"
  17: "あなたがたが行[おこな]うすべてのこと、言葉[ことば]でも行[おこな]いでも、すべてを主[しゅ]イエスの名[な]によって行[おこな]い、この方[かた]によって神[かみ]である父[ちち]に感謝[かんしゃ]しなさい。"
  18: "妻[つま]たちよ、主[しゅ]にあってふさわしいように、自分[じぶん]の夫[おっと]に従[したが]いなさい。"
  19: "夫[おっと]たちよ、妻[つま]を愛[あい]し、妻[つま]に対[たい]して心[こころ]を苛立[いらだ]たせてはならない。"
  20: "子[こ]たちよ、すべてのことにおいて父[ちち]母[はは]に従[したが]いなさい。これが主[しゅ]に喜[よろこ]ばれることだからである。"
  21: "父[ちち]たちよ、自分[じぶん]の子[こ]どもを怒[いか]らせてはならない。気[き]を落[お]とさせないためである。"
  22: "奴隷[どれい]たちよ、すべてのことにおいて、肉[にく]に属[ぞく]する自分[じぶん]の主人[しゅじん]たちに従[したが]いなさい。人[ひと]の目[め]にだけ見えるように仕[つか]える者[もの]、人[ひと]に喜[よろこ]ばれようとする者[もの]としてではなく、心[こころ]の誠実[せいじつ]さをもって、主[しゅ]を畏[おそ]れてそうしなさい。"
  23: "何[なに]をするにも、人[ひと]にではなく主[しゅ]にすることとして、心[こころ]を込[こ]めて働[はたら]きなさい。"
  24: "あなたがたが主[しゅ]から、嗣業[しぎょう]の報[むく]いを受[う]けることを知[し]っているからである。あなたがたは主[しゅ]キリストに仕[つか]えているのである。"
  25: "不正[ふせい]を働[はたら]く者[もの]は、自分[じぶん]が働[はたら]いた不正[ふせい]の報[むく]いを受[う]ける。神[かみ]には偏[かたよ]りがないのである。"

notes:
  1: "Εἰ οὖν συνηγέρθητε τῷ Χριστῷ — だから…復活したのなら. τὰ ἄνω ζητεῖτε — 上にあるものを求めなさい. οὗ ὁ Χριστός ἐστιν ἐν δεξιᾷ τοῦ θεοῦ καθήμενος — そこにキリストが神の右に座しておられる (οὗ — «где»)."
  2: "τὰ ἄνω φρονεῖτε, μὴ τὰ ἐπὶ τῆς γῆς — 上にあるものを思い、地にあるものを思ってはならない (φρονέω — мыслить, быть обращённым к)."
  3: "ἀπεθάνετε γάρ — というのは…死んだのである. κέκρυπται — 隠されている (perfect). σὺν τῷ Χριστῷ ἐν τῷ θεῷ — キリストとともに、神のうちに."
  4: "ὅταν ὁ Χριστὸς φανερωθῇ, ἡ ζωὴ ὑμῶν — あなたがたの命であるキリストが現れるとき. φανερωθήσεσθε ἐν δόξῃ — 栄光のうちに現れる."
  5: "Νεκρώσατε — 殺してしまいなさい. τὰ μέλη τὰ ἐπὶ τῆς γῆς — 地にある肢体. πορνεία, ἀκαθαρσία, πάθος, ἐπιθυμία κακή, πλεονεξία — 淫行・不潔・情欲・悪しき欲・貪欲 (ср. Гал 5:19; Рим 13:13). ἥτις ἐστὶν εἰδωλολατρία — 偶像崇拝; связь не сглажена."
  6: "δι᾽ ἅ — これらのゆえに. ἡ ὀργὴ τοῦ θεοῦ — 神の怒り. [ἐπὶ τοὺς υἱοὺς τῆς ἀπειθείας] — в базе в квадратных скобках, слова есть, 〔〕 не ставятся. υἱοὶ τῆς ἀπειθείας — 不従順の子たち."
  7: "ἐν οἷς καὶ ὑμεῖς περιεπατήσατέ ποτε — あなたがたもかつてはその中を歩んでいた. ὅτε ἐζῆτε ἐν τούτοις — それらのうちに生きていたとき."
  8: "νυνὶ δὲ ἀπόθεσθε — しかし今は…捨てなさい (перечисление идёт после глагола; в японском — перед ним). ὀργή, θυμός, κακία, βλασφημία, αἰσχρολογία — 怒り・憤り・悪意・ののしり・卑しい言葉."
  9: "μὴ ψεύδεσθε εἰς ἀλλήλους — 互いに偽りを言ってはならない. ἀπεκδυσάμενοι τὸν παλαιὸν ἄνθρωπον σὺν ταῖς πράξεσιν αὐτοῦ — 古い人とその行いとを脱ぎ捨て."
  10: "τὸν νέον τὸν ἀνακαινούμενον εἰς ἐπίγνωσιν — 知識において新しくされる新しい人. κατ᾽ εἰκόνα τοῦ κτίσαντος αὐτόν — 自分を造った方の像に."
  11: "Ἕλλην καὶ Ἰουδαῖος — ギリシア人もユダヤ人も. περιτομή, ἀκροβυστία — 割礼・無割礼. βάρβαρος, Σκύθης — 未開の人・スキタイ人 (варвар и скиф, предел «дикости»). [τὰ] — в базе в квадратных скобках. τὰ πάντα καὶ ἐν πᾶσιν Χριστός — キリストがすべてであり、すべてのうちにおられる."
  12: "ἐκλεκτοὶ τοῦ θεοῦ, ἅγιοι καὶ ἠγαπημένοι — 神に選ばれた者、聖なる者、愛されている者. σπλάγχνα οἰκτιρμοῦ — あわれみの心. χρηστότης, ταπεινοφροσύνη, πραΰτης, μακροθυμία — 親切・謙遜・柔和・寛容."
  13: "ἀνεχόμενοι ἀλλήλων — 互いに耐え忍び. χαριζόμενοι ἑαυτοῖς — 互いに赦し合い. ἐάν τις πρός τινα ἔχῃ μομφήν — だれかがほかの人に対して責めごとがあっても. καθὼς καὶ ὁ κύριος ἐχαρίσατο ὑμῖν — 主があなたがたを赦してくださったように (в базе ὁ κύριος; некоторые списки читают ὁ Χριστός)."
  14: "ἐπὶ πᾶσιν δὲ τούτοις — これらすべての上に. σύνδεσμος τῆς τελειότητος — 完全の結び."
  15: "ἡ εἰρήνη τοῦ Χριστοῦ — キリストの平和 (в базе τοῦ Χριστοῦ; jp-joc читает «Божий» — оставлено по базе). βραβευέτω — 支配するようにしなさい (букв. «пусть вершит суд», «решает»). εἰς ἣν καὶ ἐκλήθητε ἐν ἑνὶ σώματι — 一つの体として、その平和に召された. εὐχάριστοι γίνεσθε — 感謝する者となりなさい."
  16: "ὁ λόγος τοῦ Χριστοῦ ἐνοικείτω ἐν ὑμῖν πλουσίως — キリストの言葉が豊かに宿るように. ψαλμοί, ὕμνοι, ᾠδαὶ πνευματικαί — 詩篇・賛歌・霊の歌 (ср. Еф 5:19). ἐν χάριτι ᾄδοντες… τῷ θεῷ — 恵みをもって…神に歌う (в базе τῷ θεῷ; jp-joc читает «Господу»)."
  17: "πᾶν ὅ τι ἐὰν ποιῆτε — 行うすべてのこと. ἐν ὀνόματι κυρίου Ἰησοῦ — 主イエスの名によって. εὐχαριστοῦντες τῷ θεῷ πατρὶ δι᾽ αὐτοῦ — この方によって神である父に感謝し."
  18: "Αἱ γυναῖκες, ὑποτάσσεσθε — 妻たちよ、従いなさい. ὡς ἀνῆκεν ἐν κυρίῳ — 主にあってふさわしいように; требование оставлено без смягчения (ср. Еф 5:22)."
  19: "Οἱ ἄνδρες, ἀγαπᾶτε τὰς γυναῖκας — 夫たちよ、妻を愛しなさい. μὴ πικραίνεσθε πρὸς αὐτάς — 妻に対して心を苛立たせてはならない."
  20: "Τὰ τέκνα, ὑπακούετε τοῖς γονεῦσιν κατὰ πάντα — 子たちよ、すべてのことにおいて父母に従いなさい. τοῦτο γὰρ εὐάρεστόν ἐστιν ἐν κυρίῳ — これが主に喜ばれることだからである (γάρ передано)."
  21: "Οἱ πατέρες, μὴ ἐρεθίζετε — 父たちよ、怒らせてはならない. ἵνα μὴ ἀθυμῶσιν — 気を落とさせないためである."
  22: "Οἱ δοῦλοι, ὑπακούετε κατὰ πάντα τοῖς κατὰ σάρκα κυρίοις — 奴隷たちよ、肉に属する主人たちに従いなさい. ἐν ὀφθαλμοδουλίᾳ — 人の目にだけ見えるように仕えること. ἀνθρωπάρεσκοι — 人に喜ばれようとする者. ἐν ἁπλότητι καρδίας — 心の誠実さをもって. φοβούμενοι τὸν κύριον — 主を畏れて."
  23: "ὃ ἐὰν ποιῆτε, ἐκ ψυχῆς ἐργάζεσθε — 何をするにも心を込めて働きなさい. ὡς τῷ κυρίῳ καὶ οὐκ ἀνθρώποις — 人にではなく主にすることとして."
  24: "ἀπὸ κυρίου ἀπολήμψεσθε τὴν ἀνταπόδοσιν τῆς κληρονομίας — 主から嗣業の報いを受ける. τῷ κυρίῳ Χριστῷ δουλεύετε — あなたがたは主キリストに仕えている."
  25: "ὁ γὰρ ἀδικῶν κομίσεται ὃ ἠδίκησεν — 不正を働く者は、自分が働いた不正の報いを受ける. οὐκ ἔστιν προσωπολημψία — 神には偏りがない (букв. «лицеприятия нет»)."
