verses:
  1: "主[しゅ]を恐[おそ]れる者[もの]には災[わざわ]いが降[ふ]りかからない。試[ため]しのうちにあっても、主はふたたび彼を救[すく]い出[だ]される。"
  2: "知恵[ちえ]ある人[ひと]は律法[りっぽう]を憎[にく]まない。律法に対して見[み]せかけだけの者[もの]は、嵐[あらし]の中[なか]の舟[ふね]のようである。"
  3: "分[わ]きまえのある人[ひと]は律法[りっぽう]に信[しん]を置[お]き、律法は彼にとって、ウリムの答[こた]えのように確[たし]かなものとなる。"
  4: "言葉[ことば]を整[ととの]えてから語[かた]れ。そうすれば聞[き]き入[い]れられる。教[おし]えを結[むす]び合[あ]わせてから答[こた]えよ。"
  5: "愚[おろ]かな者[もの]の内[うち]は車輪[しゃりん]のようであり、その思[おも]いは回[まわ]り続[つづ]ける車軸[しゃじく]のようである。"
  6: "交尾[こうび]のための馬[うま]は、嘲[あざけ]る友[とも]のようなものだ。どんな乗[の]り手[て]の下[した]でもいななく。"
  7: "なぜ、ある日[ひ]はほかの日[ひ]にまさるのか。年[とし]のどの日[ひ]の光[ひかり]も、太陽[たいよう]から来[く]るのに。"
  8: "それらは主[しゅ]の知[ち]恵[え]によって分[わ]けられ、主は季節[きせつ]と祭[まつ]りを変[か]えられた。"
  9: "主[しゅ]はそのうちのあるものを高[たか]く挙[あ]げて聖[せい]とし、あるものをただの日[ひ]の数[かず]に加[くわ]えられた。"
  10: "人[ひと]はすべて土[つち]の塵[ちり]から出[で]た。アダムもまた地[ち]から造[つく]られた。"
  11: "主[しゅ]は豊[ゆた]かな知識[ちしき]によって彼らを分[わ]け、その道[みち]を変[か]えられた。"
  12: "そのうちのある者[もの]を祝福[しゅくふく]して高[たか]く挙[あ]げ、ある者を聖[せい]としてご自分[じぶん]に近[ちか]づけられた。またある者を呪[のろ]って低[ひく]くし、その立[た]ち場[ば]から引[ひ]き離[はな]された。"
  13: "粘土[ねんど]が陶工[とうこう]の手[て]のうちにあり、その道[みち]はすべて彼の望[のぞ]みのままであるように、人[ひと]もまた、自分[じぶん]を造[つく]った方[かた]の手のうちにあり、その裁[さば]きに従[したが]って報[むく]いを受[う]ける。"
  14: "悪[あく]に対[たい]して善[ぜん]、死[し]に対して命[いのち]、そのように、敬虔[けいけん]な者[もの]に対して罪[つみ]ある者[もの]がいる。"
  15: "また、いと高[たか]き者[もの]のすべてのわざに目[め]を向[む]けよ。それらは二[ふた]つずつ、一[ひと]つが一[ひと]つに対[たい]して置[お]かれている。"
  16: "このわたしもまた、最後[さいご]の者[もの]として目[め]を覚[さ]ましていた。ぶどうの収穫[しゅうかく]の後[あと]を拾[ひろ]い集[あつ]める者[もの]のように。"
  17: "主[しゅ]の祝福[しゅくふく]によってわたしはそこに達[たっ]し、ぶどうを摘[つ]む者[もの]のように搾[しぼ]り槽[そう]を満[み]たした。"
  18: "わたしが自分[じぶん]一人[ひとり]のために労[ろう]したのではなく、教[おし]えを求[もと]めるすべての者[もの]のために労したことを、悟[さと]れ。"
  19: "民[たみ]の大[おお]いなる者[もの]たちよ、集[あつ]まりの司[つかさ]たちよ、わたしの言葉[ことば]を聞[き]き、耳[みみ]を傾[かたむ]けよ。"
  20: "子[こ]にも妻[つま]にも、兄弟[きょうだい]にも友[とも]にも、生[い]きている間[あいだ]、自分[じぶん]の上[うえ]に権[けん]を委[ゆだ]ねてはならない。また、後[あと]で悔[く]やんでそれを乞[こ]うことのないように、自分[じぶん]の財[ざい]を他人[たにん]に与[あた]えてはならない。"
  21: "まだ生[い]きていて、あなたのうちに息[いき]があるうちは、どんな肉[にく]によっても自分[じぶん]を代[か]えてはならない。"
  22: "子[こ]どもがあなたに願[ねが]い求[もと]めるほうが、あなたが息子[むすこ]たちの手[て]を仰[あお]ぐよりはよい。"
  23: "すべてのわざにおいて進[すす]み出[で]る者[もの]であれ。自分の名誉[めいよ]に傷[きず]をつけてはならない。"
  24: "あなたの命[いのち]の日々[ひび]が終[お]わる日[ひ]、死[し]の時[とき]に、嗣業[しぎょう]を分[わ]け与[あた]えよ。"
  25: "飼[か]い葉[ば]と鞭[むち]と荷[に]はろばのもの、パンと教[きょう]えと仕事[しごと]は奴隷[どれい]のものである。"
  26: "奴隷[どれい]を働[はたら]かせよ。そうすればあなたは安[やす]らぎを得[え]る。その手[て]を緩[ゆる]めれば、彼は自由[じゆう]を求[もと]めるようになる。"
  27: "くびきと革紐[かわひも]は首[くび]を曲[ま]げさせ、悪[わる]い奴隷[どれい]には枷[かせ]と苦[くる]しみがふさわしい。"
  28: "彼を仕事[しごと]に就[つ]かせ、怠[なま]けさせてはならない。怠惰[たいだ]は多[おお]くの悪[あく]を教[おし]えたからである。"
  29: "ふさわしい仕事[しごと]に就[つ]かせよ。もし言[い]うことを聞[き]かなければ、その足枷[あしかせ]を重[おも]くせよ。"
  30: "どんな肉[にく]に対[たい]しても度[ど]を越[こ]してはならない。裁[さば]きなしに何[なに]も行[おこな]ってはならない。"
  31: "奴隷[どれい]がいるなら、彼を自分[じぶん]のように扱[あつか]え。あなたは彼を血[ち]をもって手[て]に入[い]れたのだから。"
  32: "奴隷[どれい]がいるなら、兄弟[きょうだい]のように接[せっ]するがよい。あなたは彼を、自分[じぶん]の魂[たましい]のように必要[ひつよう]とするのだから。"
  33: "もしあなたが彼を虐[しいた]げ、彼が立[た]ち去[さ]って逃[に]げてしまったら、どの道[みち]で彼を探[さが]すというのか。"

notes:
  1: "Τῷ φοβουμένῳ κύριον οὐκ ἀπαντήσει κακόν — «боящемуся Господа не встретится зло» (ἀπαντάω — встречать, постигать). ἀλλ᾿ ἐν πειρασμῷ καὶ πάλιν ἐξελεῖται — «но и в искушении снова избавит» (πειρασμός — испытание; ἐξαιρέω — изымать, спасать); слав. «аще и в напасть впадет, паки измет его»."
  2: "ἀνὴρ σοφὸς οὐ μισήσει νόμον — «муж мудрый не возненавидит закона». ὁ ὑποκρινόμενος ἐν αὐτῷ — «лицемерящий (притворный) в нём» (ὑποκρίνομαι). ὡς ἐν καταιγίδι πλοῖον — «как в буре корабль» (καταιγίς — буря, шквал); слав. «сумняйжеся» — сомневающийся, иное понимание."
  3: "ἄνθρωπος συνετὸς ἐμπιστεύσει νόμῳ — «человек разумный доверится закону» (ἐμπιστεύω). ὁ νόμος αὐτῷ πιστὸς ὡς ἐρώτημα δήλων — «закон ему верен, как вопрошение урима» (δῆλοι — «светы», LXX-передача урима; ἐρώτημα — ответ на вопрос); отсюда ウリムの答え. Слав. относит эту часть к началу ст. 4 («яко вопрошение праведных»), по gr — конец ст. 3."
  4: "ἑτοίμασον λόγον καὶ οὕτως ἀκουσθῇ — «приготовь слово, и так будешь услышан» (ἀκούω в страдательном залоге). σύνδησον παιδείαν — «свяжи (собери воедино) наставление» (συνδέω); слав. «сочетай наказание». ἀποκρίθητι — «ответь»."
  5: "τροχὸς ἁμάξης σπλάγχνα μωροῦ — «колесо телеги — внутренности глупого» (τροχός — колесо; ἅμαξα — телега; σπλάγχνα — внутренности, нутро); слав. «коло колесничное утроба буяго». ἄξων στρεφόμενος — «вращающаяся ось» (ἄξων); διαλογισμός — помышление."
  6: "ἵππος εἰς ὀχείαν — «конь для случки» (ὀχεία — покрытие, случка); слав. «конь на яждении» — иное понимание. φίλος μωκός — «друг насмешливый, издевающийся» (μωκός — насмешник); слав. «лицемерен». ὑποκάτω παντὸς ἐπικαθημένου χρεμετίζει — «под всяким сидящим (на нём) ржёт» (χρεμετίζω — ржать)."
  7: "Διὰ τί ἡμέρα ἡμέρας ὑπερέχει — «почему день день превосходит» (ὑπερέχω — быть выше). πᾶν φῶς ἡμέρας ἐνιαυτοῦ ἀφ᾽ ἡλίου — «всякий свет дня года — от солнца»; слав. «всяк свет дне лета от солнца»."
  8: "ἐν γνώσει κυρίου διεχωρίσθησαν — «по ведению (премудрости) Господа они разделены» (διαχωρίζω — отделять); слав. «разумом Господним разлучистася». ἠλλοίωσεν καιροὺς καὶ ἑορτάς — «Он изменил (установил различие) времена и праздники» (ἀλλοιόω — изменять)."
  9: "ἀπ᾽ αὐτῶν ἀνύψωσεν καὶ ἡγίασεν — «из них возвысил и освятил» (ἀνυψόω — возвышать; ἁγιάζω — освящать). ἐξ αὐτῶν ἔθηκεν εἰς ἀριθμὸν ἡμερῶν — «из них положил в число дней», т. е. в ряд обычных дней. Слав. «положи в число дний»."
  10: "καὶ ἄνθρωποι πάντες ἀπὸ ἐδάφους — «и все люди от праха (почвы)» (ἔδαφος — основание, прах; слав. «от персти»). ἐκ γῆς ἐκτίσθη Αδαμ — «из земли создан Адам» (κτίζω — создавать); игра слов: adam — «земля»."
  11: "ἐν πλήθει ἐπιστήμης — «в полноте знания» (πλῆθος — множество, полнота; ἐπιστήμη — знание); слав. «множеством ведения». διεχώρισεν αὐτοὺς καὶ ἠλλοίωσεν τὰς ὁδοὺς αὐτῶν — «разделил их и изменил пути их»."
  12: "ἐξ αὐτῶν εὐλόγησεν καὶ ἀνύψωσεν — «из них благословил и возвысил». πρὸς αὐτὸν ἤγγισεν — «к Себе приблизил» (ἐγγίζω). κατηράσατο καὶ ἐταπείνωσεν — «проклял и унизил» (καταράομαι; ταπεινόω). ἀνέστρεψεν αὐτοὺς ἀπὸ στάσεως αὐτῶν — «совратил их с их стояния (положения)» (ἀναστρέφω — опрокидывать; στάσις — стояние, место); слав. «от стояния их»."
  13: "ὡς πηλὸς κεραμέως ἐν χειρὶ αὐτοῦ — «как глина горшечника в руке его» (πηλός — глина, грязь; κεραμεύς — горшечник); слав. «брение скудельника». πᾶσαι αἱ ὁδοὶ αὐτοῦ κατὰ τὴν εὐδοκίαν αὐτοῦ — «все пути его по благоволению (воле) его». ἀποδοῦναι αὐτοῖς κατὰ τὴν κρίσιν αὐτοῦ — «воздать им по суду Его»."
  14: "ἀπέναντι τοῦ κακοῦ τὸ ἀγαθόν — «против зла — добро» (ἀπέναντι — напротив, против). ἀπέναντι τοῦ θανάτου ἡ ζωή — «против смерти — жизнь». ἀπέναντι εὐσεβοῦς ἁμαρτωλός — «против благочестивого — грешник» (εὐσεβής). Слав. включает сюда и конец ст. 15 «И сице воззри…», по gr это отдельный стих 15."
  15: "ἔμβλεψον εἰς πάντα τὰ ἔργα τοῦ ὑψίστου — «воззри на все дела Всевышнего» (ἐμβλέπω). δύο δύο, ἓν κατέναντι τοῦ ἑνός — «по два, одно против другого» (κατέναντι — напротив); слав. относит к ст. 14."
  16: "Κἀγὼ ἔσχατος ἠγρύπνησα — «и я, последний, бодрствовал (трудился без сна)» (аорист от ἀγρυπνέω — бодрствовать). ὡς καλαμώμενος ὀπίσω τρυγητῶν — «как подбирающий (остатки) за сборщиками винограда» (καλαμάομαι — собирать остатки; τρυγητής — сборщик); слав. «наследих якоже от начатка, якоже собираяй вслед оымателей виноградных» — иное чтение."
  17: "ἐν εὐλογίᾳ κυρίου ἔφθασα — «по благословению Господа достиг (успел)» (φθάνω — достигать, приходить первым); слав. «во благословение Господне достигох». ὡς τρυγῶν ἐπλήρωσα ληνόν — «как собирающий виноград, наполнил точило» (ληνός — давильня, точило (搾り槽); τρυγάω — собирать виноград)."
  18: "κατανοήσατε — «уразумейте, вникните» (κατανοέω). οὐκ ἐμοὶ μόνῳ ἐκοπίασα — «не для меня одного я потрудился» (κοπιάω). πᾶσιν τοῖς ζητοῦσιν παιδείαν — «всем, ищущим наставления» (παιδεία — наставление, воспитание); слав. «всем ищущым наказания»."
  19: "ἀκούσατέ μου, μεγιστᾶνες λαοῦ — «послушайте меня, вельможи народа» (μεγιστάνες — знатные). οἱ ἡγούμενοι ἐκκλησίας — «начальствующие собрания» (ἐκκλησία — собрание); слав. «властелие собора». ἐνωτίσασθε — «внемлите» (ἐνωτίζομαι — принимать в уши)."
  20: "Υἱῷ καὶ γυναικί, ἀδελφῷ καὶ φίλῳ μὴ δῷς ἐξουσίαν ἐπὶ σὲ ἐν ζωῇ σου — «сыну, жене, брату и другу не давай власти над собой при жизни твоей» (ἐξουσία — власть, право). μὴ δῷς ἑτέρῳ τὰ χρήματά σου — «не давай другому имения (денег) твоего» (χρήματα). ἵνα μὴ μεταμεληθεὶς δέῃ περὶ αὐτῶν — «чтобы, раскаявшись, не умолять (просить) о них» (μεταμέλομαι; δέομαι); слав. делит стих на 19–20."
  21: "ἕως ἔτι ζῇς καὶ πνοὴ ἐν σοί — «пока ещё живёшь и дыхание в тебе» (πνοή — дыхание). μὴ ἀλλάξῃς σεαυτὸν ἐν πάσῃ σαρκί — «не замени себя в какой-либо плоти» (ἀλλάσσω — менять); слав. «не измени себе всяцей плоти»; смысл: не передавай другому власть над собой и своим имением."
  22: "κρεῖσσον γάρ ἐστιν — «ибо лучше» (κρείσσων — лучший). τὰ τέκνα δεηθῆναί σου — «детям просить тебя» (δέομαι). ἢ σὲ ἐμβλέπειν εἰς χεῖρας υἱῶν σου — «чем тебе смотреть в руки сыновей твоих», т. е. зависеть от их подаяния (ἐμβλέπω)."
  23: "ἐν πᾶσι τοῖς ἔργοις σου γίνου ὑπεράγων — «во всех делах твоих будь превосходящим (выдающимся)» (ὑπεράγω — выступать вперёд); слав. «буди преспевая». μὴ δῷς μῶμον ἐν τῇ δόξῃ σου — «не дай порока (пятна) в славе твоей» (μῶμος — порок, пятно; δόξα — слава, честь)."
  24: "ἐν ἡμέρᾳ συντελείας ἡμερῶν ζωῆς σου — «в день завершения дней жизни твоей» (συντέλεια — окончание). ἐν καιρῷ τελευτῆς — «в час кончины» (τελευτή). διάδος κληρονομίαν — «раздай (распредели) наследие» (διαδίδωμι); слав. «раздели наследие твое»."
  25: "Χορτάσματα καὶ ῥάβδος καὶ φορτία ὄνῳ — «корм, и палка, и ноши — ослу» (χόρτασμα — корм; ῥάβδος — жезл, палка; φορτίον — ноша); слав. «пища и жезлие и бремя ослу». ἄρτος καὶ παιδεία καὶ ἔργον οἰκέτῃ — «хлеб, наставление и работа — рабу» (οἰκέτης — домашний раб)."
  26: "ἔργασαι ἐν παιδί — «займи раба (работой)» (ἐργάζομαι; παῖς — раб, слуга). εὑρήσεις ἀνάπαυσιν — «найдёшь покой». ἄνες χεῖρας αὐτῷ — «ослабь ему руки» (ἀνίημι); слав. «ослаби руку ему». ζητήσει ἐλευθερίαν — «будет искать свободы»; слав. «искати начнет свободы»."
  27: "ζυγὸς καὶ ἱμὰς τράχηλον κάμψουσιν — «ярмо и ремень шею согнут» (ζυγός — ярмо; ἱμάς — ремень; κάμπτω — сгибать); слав. «иго и ремень выю прекланяют». οἰκέτῃ κακούργῳ στρέβλαι καὶ βάσανοι — «рабу злому — колодки и мучения» (στρέβλη — орудие пытки, колодка; βάσανος — мучение); слав. «узы и раны»."
  28: "ἔμβαλε αὐτὸν εἰς ἐργασίαν — «ввергни его в работу» (ἐμβάλλω; ἐργασία — дело, занятие). ἵνα μὴ ἀργῇ — «чтобы не был празден» (ἀργέω). πολλὴν γὰρ κακίαν ἐδίδαξεν ἡ ἀργία — «ибо многому злу научила праздность» (ἀργία — безделье; κακία — злоба)."
  29: "εἰς ἔργα κατάστησον — «на дела поставь» (καθίστημι). καθὼς πρέπει αὐτῷ — «как подобает ему» (πρέπει). κἂν μὴ πειθαρχῇ — «если же не слушается» (πειθαρχέω). βάρυνον τὰς πέδας αὐτοῦ — «отяготи оковы его» (βαρύνω — делать тяжёлым; πέδη — оковы, колодка); слав. «всади его во оковы»."
  30: "μὴ περισσεύσῃς ἐπὶ πάσῃ σαρκί — «не переусердствуй (не излишествуй) над всякой плотью» (περισσεύω — превышать); слав. «не буди излишен над всякою плотию». ἄνευ κρίσεως μὴ ποιήσῃς μηδέν — «без суда (рассуждения) ничего не делай» (κρίσις — суд, рассуждение)."
  31: "Εἰ ἔστιν σοι οἰκέτης, ἔστω ὡς σύ — «если есть у тебя раб, да будет как ты». ἐν αἵματι ἐκτήσω αὐτόν — «кровью приобрёл ты его» (κτάομαι — приобретать); т. е. ценой жизни и труда, он тот же человек."
  32: "ἄγε αὐτὸν ὡς ἀδελφόν — «обращайся с ним (веди его) как с братом» (ἄγω — вести). ὡς ἡ ψυχή σου ἐπιδεήσεις αὐτῷ — «как души твоей будешь нуждаться в нём» (ἐπιδεέω — иметь нужду); слав. «яко души твоея востребуеши его»."
  33: "ἐὰν κακώσῃς αὐτὸν — «если озлобишь (станешь притеснять) его» (κακόω — обижать, озлоблять). ἀπάρας ἀποδρᾷ — «уйдя, убежит» (ἀπαίρω — уходить; ἀποδιδράσκω — убегать). ἐν ποίᾳ ὁδῷ ζητήσεις αὐτόν; — «на какой дороге будешь искать его?» Слав. прибавляет «(не веси)» — «не знаешь», этого нет в LXX."
