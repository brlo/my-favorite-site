# дни и времена от Господа (7–9), все люди из земли и различие путей (10–13),
# противоположности в делах Всевышнего (14–15); труд самого писателя (16–18),
# обращение к вельможам (19); распоряжение имением при жизни (20–24),
# раб и его воспитание (25–33). Прямой речи нет; основной текст — поучение,
