verses:
  1: "主[しゅ]はモーセに言[い]われた。"
  2: "「イスラエルの子[こ]らに語[かた]って言[い]いなさい。男[おとこ]でも女[おんな]でも、主[しゅ]にナジル人[じん]として身[み]を清[きよ]める誓願[せいがん]を大[おお]きく誓[ちか]うなら、"
  3: "彼[かれ]はぶどう酒[しゅ]と強[つよ]い酒[さけ]から離[はな]れ、ぶどう酒の酢[す]も強い酒の酢も飲[の]んではならず、ぶどうから作[つく]ったものは何[なに]も飲んではならず、生[なま]のぶどうも干[ほ]しぶどうも食[た]べてはならない。"
  4: "誓願[せいがん]の日々[ひび]の間[あいだ]、ぶどうの木[き]からできるものは何[なに]も、ぶどうの実[み]の種[たね]から皮[かわ]に至[いた]るまで食[た]べてはならない。"
  5: "聖別[せいべつ]の誓願[せいがん]の日々[ひび]の間[あいだ]、剃刀[かみそり]は彼[かれ]の頭[あたま]に上[のぼ]ってはならない。主[しゅ]に誓[ちか]った日々[ひび]が満[み]ちるまで、彼[かれ]は頭[あたま]の髪[かみ]を伸[の]ばす者[もの]として聖[せい]である。"
  6: "主[しゅ]への誓願[せいがん]の日々[ひび]の間[あいだ]、彼[かれ]は死[し]んだ者[もの]のところへ行[い]ってはならない。"
  7: "父[ちち]、母[はは]、兄[あに]、妹[いもうと]が死[し]んでも、彼[かれ]は彼[かれ]らのゆえに身[み]を汚[けが]してはならない。神[かみ]への誓願[せいがん]が彼[かれ]の頭[あたま]にあるからである。"
  8: "誓願[せいがん]の日々[ひび]の間[あいだ]、彼[かれ]は主[しゅ]に聖[せい]である。"
  9: "もしだれかが彼[かれ]のそばで不意[ふい]に死[し]ぬなら、彼[かれ]は自分[じぶん]の誓願[せいがん]の頭[あたま]を汚[けが]すことになる。清[きよ]められる日[ひ]に彼[かれ]は頭を剃[そ]らねばならない。七日目[なぬかめ]に剃りなさい。"
  10: "八日目[ようかめ]に、彼[かれ]は二羽[にわ]の山鳩[やまばと]、または二羽の家鳩[いえばと]の雛[ひな]を、証[あかし]の幕屋[まくや]の入口[いりぐち]で祭司[さいし]のところへ持[も]って来[き]なさい。"
  11: "祭司[さいし]は一羽[いちわ]を贖罪祭[しょくざいさい]、もう一羽を燔祭[はんさい]として献[ささ]げ、彼[かれ]が死[し]んだ者[もの]のゆえに犯[おか]した罪[つみ]のために、彼の贖[あがな]いをしなさい。その日[ひ]、彼[かれ]の頭[あたま]を聖[せい]なるものとしなさい。"
  12: "彼[かれ]は主[しゅ]に誓願[せいがん]の日々[ひび]を聖別[せいべつ]し、愆祭[けんさい]のために一歳[いっさい]の子羊[こひつじ]を連[つ]れて来[き]なさい。先[さき]の日々[ひび]は数[かぞ]えられない。彼[かれ]の誓願の頭[あたま]が汚[けが]れたからである。"
  13: "これが誓願[せいがん]を立てた者[もの]の法[ほう]である。彼[かれ]が誓願の日々[ひび]を満[み]たす日[ひ]に、彼[かれ]自身[じしん]が証[あかし]の幕屋[まくや]の入口[いりぐち]に持[も]って来[き]なさい。"
  14: "彼[かれ]は自分[じぶん]の捧[ささ]げ物[もの]を主[しゅ]に献[ささ]げなさい。燔祭[はんさい]のために傷[きず]のない一歳[いっさい]の雄[おす]の子羊[こひつじ]一匹[いっぴき]、贖罪祭[しょくざいさい]のために傷のない一歳の雌[めす]の子羊一匹、酬恩祭[しゅうおんさい]のために傷のない雄羊[おひつじ]一頭[いっとう]、"
  15: "また、種[たね]なしパンの籠[かご]、すなわち油[あぶら]を混[ま]ぜた小麦粉[こむぎこ]のパンと、油を塗[ぬ]った種なしの薄焼[うすや]きパン、およびその素祭[そさい]と注[そそ]ぎの捧[ささ]げ物[もの]。"
  16: "祭司[さいし]はそれらを主[しゅ]の前[まえ]に持[も]って来[き]て、彼[かれ]の贖罪祭[しょくざいさい]と燔祭[はんさい]を献[ささ]げなさい。"
  17: "また、雄羊[おひつじ]を、種[たね]なしパンの籠[かご]とともに主[しゅ]への酬恩祭[しゅうおんさい]の犠牲[ぎせい]として献[ささ]げ、祭司[さいし]はその素祭[そさい]と注[そそ]ぎの捧[ささ]げ物[もの]を献げなさい。"
  18: "誓願[せいがん]を立てた者[もの]は、証[あかし]の幕屋[まくや]の入口[いりぐち]で自分[じぶん]の誓願の頭[あたま]を剃[そ]り、その頭の髪[かみ]を取[と]って、酬恩祭[しゅうおんさい]の下[した]にある火[ひ]の上[うえ]に置[お]きなさい。"
  19: "祭司[さいし]は雄羊[おひつじ]の煮[に]た肩[かた]と、籠[かご]から種[たね]なしのパン一[ひと]つと、種なしの薄焼[うすや]きパン一[ひと]つを取[と]り、誓願[せいがん]を立てた者[もの]が頭[あたま]を剃った後[のち]に、それを彼[かれ]の手[て]に置[お]きなさい。"
  20: "祭司[さいし]はそれらを主[しゅ]の前[まえ]に揺[ゆ]り動[うご]かす捧[ささ]げ物[もの]として献[ささ]げなさい。それは祭司に属[ぞく]する聖[せい]なるものであり、揺り動かす胸[むね]と差[さ]し出[だ]す肩[かた]のほかである。その後[のち]、誓願[せいがん]を立てた者[もの]はぶどう酒[しゅ]を飲[の]むことができる。"
  21: "これが誓願[せいがん]を立てた者[もの]の法[ほう]である。彼[かれ]が主[しゅ]への誓願について自分[じぶん]の捧[ささ]げ物[もの]を主に献[ささ]げるときは、誓願の力[ちから]に応[おう]じて自分[じぶん]の手[て]が得[え]るもののほか、彼[かれ]が誓[ちか]ったとおりに、聖別[せいべつ]の法[ほう]に従[したが]って行[おこな]わなければならない。」"
  22: "主[しゅ]はモーセに言[い]われた。"
  23: "「アロンとその子[こ]らに語[かた]って言[い]いなさい。あなたがたはイスラエルの子[こ]らをこう祝福[しゅくふく]しなさい。彼[かれ]らにこう言[い]いなさい。"
  24: "『主[しゅ]があなたを祝福[しゅくふく]し、あなたを守[まも]ってくださるように。"
  25: "主[しゅ]が御顔[みかお]をあなたの上[うえ]に照[て]らし、あなたをあわれんでくださるように。"
  26: "主[しゅ]が御顔をあなたに向[む]け、あなたに平和[へいわ]を与[あた]えてくださるように。』"
  27: "あなたがたはわたしの名[な]をイスラエルの子[こ]らの上[うえ]に置[お]き、わたしが彼[かれ]らを祝福[しゅくふく]する。」"

notes:
  1: "Καὶ ἐλάλησεν κύριος πρὸς Μωυσῆν λέγων — обычная формула введения речи; λέγων отдельно не передаётся."
  2: "Ἀνὴρ ἢ γυνή — «мужчина или женщина», т.е. всякий. μεγάλως εὔξηται εὐχὴν — «велико обетует обет» (μεγάλως — наречие «велико, крепко»). ἀφαγνίσασθαι ἁγνείαν κυρίῳ — «очиститься чистотою Господу» (ἀφαγνίζω — «очищать», ἁγνεία — «чистота»); слав. «еже очиститися чистотою Господу». В LXX здесь нет слова ναζιραῖος, но речь о назорейском обете — отсюда ナジル人 со сноской."
  3: "ἀπὸ οἴνου καὶ σικερα ἁγνισθήσεται — «от вина и сикера очистится», т.е. воздержится от них. σίκερα — крепкий напиток, сикер (в Лев 10:9 — 強い酒). ὄξος ἐξ οἴνου — «уксус из вина». ὅσα κατεργάζεται ἐκ σταφυλῆς — «что ни делается из винограда». σταφυλὴ πρόσφατος — «свежая гроздь»; σταφίς — «сушёная ягода, изюм»."
  4: "στέμφυλον — «выжимки, ягоды» (слав. «кость»); γίγαρτον — «виноградная косточка» (слав. «скорлупа»), отсюда «от ядра до кожи». ἀπὸ πάντων ὅσα γίνεται ἐξ ἀμπέλου — «от всего, что бывает от лозы»."
  5: "ξυρόν — «бритва»; ξυρὸν οὐκ ἐπελεύσεται ἐπὶ τὴν κεφαλήν — «бритва не пройдёт по голове его». τρέφων κόμην τρίχα κεφαλῆς — «питающий волосы головы», т.е. отращивающий их (слав. «растяй власы главы своея»). ἅγιος ἔσται — «свят будет»."
  6: "ἐπὶ πάσῃ ψυχῇ τετελευτηκυίᾳ — «к каждой умершей душе», т.е. к умершему телу; οὐκ εἰσελεύσεται — «не войдёт, не подойдёт». Слав. «ко всякой душе скончавшейся да не внидет»."
  7: "ἐπὶ πατρὶ καὶ ἐπὶ μητρὶ καὶ ἐπ᾽ ἀδελφῷ καὶ ἐπ᾽ ἀδελφῇ — «при отце, матери, брате и сестре» (ἐπί + дат.). εὐχὴ θεοῦ αὐτοῦ ἐπ᾽ αὐτῷ ἐπὶ κεφαλῆς αὐτοῦ — «обет Бога его на нём, на голове его»; слав. «яко обет Бога его на главе его»."
  8: "πάσας τὰς ἡμέρας τῆς εὐχῆς αὐτοῦ ἅγιος ἔσται κυρὶῳ — «во все дни обета его свят будет Господу»."
  9: "ἐξάπινα — «внезапно»; παραχρῆμα — «тотчас». μιανθήσεται ἡ κεφαλὴ εὐχῆς αὐτοῦ — «осквернится голова обета его». ᾗ ἂν ἡμέρᾳ καθαρισθῇ — «в какой день очистится»; τῇ ἡμέρᾳ τῇ ἑβδόμῃ — «в седьмой день»."
  10: "τρυγών — «горлица»; νεοσσὸς περιστερῶν — «птенец голубей» (слав. «птенца голубина»). ἐπὶ τὰς θύρας τῆς σκηνῆς τοῦ μαρτυρίου — «к дверям скинии свидетельства», т.е. ко входу 証の幕屋."
  11: "μίαν περὶ ἁμαρτίας καὶ μίαν εἰς ὁλοκαύτωμα — «одну за грех и одну во всесожжение». ἐξιλάσεται περὶ ὧν ἥμαρτεν περὶ τῆς ψυχῆς — «умилостивит за то, в чём согрешил о душе». ἁγιάσει τὴν κεφαλὴν αὐτοῦ — «освятит голову его». В csl в конце стиха прибавлено «в той день, воньже освятися Господу, во дни обета своего»; в греч. это начало ст. 12 (ᾗ ἡγιάσθη κυρίῳ τὰς ἡμέρας τῆς εὐχῆς), поэтому отнесено туда."
  12: "ᾗ ἡγιάσθη κυρίῳ τὰς ἡμέρας τῆς εὐχῆς — «в который он освящён Господу — дни обета» (связка перенесена из ст. 11 по делению gr-lxx-byz). ἀμνὸν ἐνιαύσιον εἰς πλημμέλειαν — «агнца однолетнего в жертву повинности» (愆祭). ἄλογοι ἔσονται — «не в счёт будут» (ἄλογος — «несчитаемый»); слав. «да не будут в число»."
  13: "οὗτος ὁ νόμος τοῦ εὐξαμένου — «вот закон обетовавшегося». προσοίσει αὐτός — «принесёт сам» (αὐτός подчёркивает личное участие); παρὰ τὰς θύρας — «к дверям»."
  14: "ἀμνὸς ἐνιαύσιος ἄμωμος — «агнец однолетний непорочный»; ἀμνάς — «агница» (в жертву за грех); κριός — «овен». εἰς σωτήριον — «во спасение», т.е. в мирную жертву (слав. «во спасение»); в японском — 酬恩祭."
  15: "κανοῦν — «корзина» (слав. «кош»). ἄρτοι ἀναπεποιημένοι ἐν ἐλαίῳ — «хлебы, замешанные с елеем»; λάγανα ἄζυμα κεχρισμένα ἐν ἐλαίῳ — «пресные лепёшки, помазанные елеем». θυσία αὐτῶν καὶ σπονδὴ αὐτῶν — «их хлебное приношение и их возлияние»."
  16: "ποιήσει τὸ περὶ ἁμαρτίας αὐτοῦ καὶ τὸ ὁλοκαύτωμα αὐτοῦ — «совершит жертву за грех его и всесожжение его»."
  17: "θυσίαν σωτηρίου κυρίῳ ἐπὶ τῷ κανῷ τῶν ἀζύμων — «жертву спасения Господу при корзине опресноков»; σπονδή — «возлияние»."
  18: "ξυρήσεται … τὴν κεφαλὴν τῆς εὐχῆς αὐτοῦ — «острижёт голову обета своего». ἐπιθήσει τὰς τρίχας ἐπὶ τὸ πῦρ, ὅ ἐστιν ὑπὸ τὴν θυσίαν τοῦ σωτηρίου — «положит волосы на огонь, который под жертвою спасения»."
  19: "βραχίων ἑφθός — «варёное плечо» (ἕψω — «варить»). ἄρτος ἄζυμος — «пресный хлеб»; λάγανον ἄζυμον — «пресная лепёшка». ἐπιθήσει ἐπὶ τὰς χεῖρας — «возложит на руки»."
  20: "ἐπίθεμα — «возложение» (приношение потрясания). ἅγιον ἔσται τῷ ἱερεῖ ἐπὶ τοῦ στηθυνίου τοῦ ἐπιθέματος καὶ ἐπὶ τοῦ βραχίονος τοῦ ἀφαιρέματος — «свято будет священнику сверх груди возложения и сверх плеча возношения» (στηθύνιον — 胸, ἀφαίρεμα — 献げ物). πίεται … οἶνον — «будет пить вино»."
  21: "χωρὶς ὧν ἂν εὕρῃ ἡ χεὶρ αὐτοῦ — «кроме того, что найдёт рука его», т.е. сверх обязательного, по достатку. κατὰ δύναμιν τῆς εὐχῆς — «по силе обета». νόμος ἁγνείας — «закон чистоты»."
  22: "Новое введение речи; ср. ст. 1."
  23: "Λάλησον Ααρων — «скажи Аарону» (датив без πρόσ). Οὕτως εὐλογήσετε — «так благословите». λέγοντες αὐτοῖς — «говоря им»; 24–26 — слова благословения, которые произносят священники, поэтому 『…』. В gr-lxx-byz в квадратных скобках после λέγοντες αὐτοῖς стоит καὶ ἐπιθήσουσιν τὸ ὄνομά μου … καὶ ἐγὼ κύριος εὐλογήσω αὐτούς; в csl/ru это отдельный ст. 27, поэтому здесь стих кончается на λέγοντες αὐτοῖς, а формула вынесена в ст. 27."
  24: "Εὐλογήσαι σε κύριος καὶ φυλάξαι σε — оптативы: «да благословит тебя Господь и да сохранит тебя»; слав. «да благословит тя Господь и сохранит тя»."
  25: "ἐπιφάναι κύριος τὸ πρόσωπον αὐτοῦ ἐπὶ σέ — «да воссияет Господь лицом Своим над тобою» (ἐπιφαίνω — «светить на»); ἐλεήσαι — «да помилует» (оптатив ἐλεάω)."
  26: "ἐπάραι κύριος τὸ πρόσωπον αὐτοῦ ἐπὶ σέ — «да поднимет Господь лицо Своё над тобою» (ἐπαίρω — «поднимать»; слав. «да воздвигнет»); δῴη σοι εἰρήνην — «да даст тебе мир»."
  27: "καὶ ἐπιθήσουσιν τὸ ὄνομά μου ἐπὶ τοὺς υἱοὺς Ισραηλ, καὶ ἐγὼ κύριος εὐλογήσω αὐτούς — «и положат имя Моё на сынов Израилевых, и Я, Господь, благословлю их». В gr-lxx-byz эта формула стоит в конце ст. 23 в квадратных скобках; у csl/ru — отдельный ст. 27, поэтому по делению csl она вынесена после благословения 24–26. 「…」 речи Бога остаётся открытым с 23-го стиха."
