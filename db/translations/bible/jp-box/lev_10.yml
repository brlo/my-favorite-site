verses:
  1: "アロンの子[こ]であるナダブとアビウは、それぞれ自分[じぶん]の香炉[こうろ]を取[と]り、その中[なか]に火[ひ]を入[い]れ、その上[うえ]に香[こう]を載[の]せて、主[しゅ]の前[まえ]に異[こと]なる火[ひ]を献[ささ]げた。主[しゅ]が彼[かれ]らに命[めい]じたことではない。"
  2: "すると、主[しゅ]の前[まえ]から火[ひ]が燃[も]え出[で]て彼[かれ]らを焼[や]き尽[つ]くし、彼[かれ]らは主[しゅ]の前[まえ]で死[し]んだ。"
  3: "モーセはアロンに言[い]った。「主[しゅ]が語[かた]られたのは、このことである。『わたしに近[ちか]づく者[もの]のうちで、わたしは聖[せい]なる者[もの]とされ、全会衆[ぜんかいしゅう]の前[まえ]で栄光[えいこう]を受[う]ける。』」アロンは深[ふか]く心[こころ]を痛[いた]めた。"
  4: "モーセはアロンの父[ちち]の兄弟[きょうだい]であるウジエルの子[こ]ら、ミシャエルとエリツァファンを呼[よ]んで言[い]った。「近[ちか]づいて、あなたがたの兄弟[きょうだい]たちを聖所[せいしょ]の前[まえ]から宿営[しゅくえい]の外[そと]へ運[はこ]び出[だ]しなさい。」"
  5: "彼[かれ]らは近[ちか]づいて、モーセが言[い]ったとおりに、死[し]んだ者[もの]たちを衣[ころも]のまま宿営[しゅくえい]の外[そと]へ運[はこ]び出[だ]した。"
  6: "モーセはアロンと、残[のこ]された子[こ]らであるエレアザルとイタマルに言[い]った。「あなたがたは頭[あたま]をむき出[だ]しにしてはならない。衣[ころも]を裂[さ]いてはならない。死[し]ぬことがないため、また全会衆[ぜんかいしゅう]の上[うえ]に怒[いか]りが下[くだ]ることがないためである。あなたがたの兄弟[きょうだい]たち、イスラエルの全家[ぜんか]は、主[しゅ]が焼[や]き尽[つ]くした者[もの]たちのために泣[な]くがよい。"
  7: "また、死[し]ぬことがないように、証[あかし]の幕屋[まくや]の戸口[とぐち]から出[で]てはならない。主[しゅ]からの注[そそ]ぎの油[あぶら]があなたがたの上[うえ]にあるからである。」彼[かれ]らはモーセの言葉[ことば]どおりに行[おこな]った。"
  8: "主[しゅ]はアロンに言[い]われた。"
  9: "「あなたも、あなたとともにいるあなたの子[こ]らも、証[あかし]の幕屋[まくや]に入[はい]るとき、また祭壇[さいだん]に近[ちか]づくときには、ぶどう酒[しゅ]と強[つよ]い酒[さけ]を飲[の]んではならない。死[し]ぬことがないためである。これはあなたがたの世代[せだい]にわたる永遠[えいえん]の定[さだ]めであり、"
  10: "聖[せい]なるものと俗[ぞく]なるもの、汚[けが]れたものと清[きよ]いものとを区別[くべつ]し、"
  11: "主[しゅ]がモーセの手[て]を通[とお]してイスラエルの子[こ]らに語[かた]ったすべての定[さだ]めを、彼[かれ]らに教[おし]えるためである。」"
  12: "モーセはアロンと、残[のこ]された子[こ]らであるエレアザルとイタマルに言[い]った。「主[しゅ]の捧[ささ]げ物[もの]のうちから残[のこ]った素祭[そさい]を取[と]り、祭壇[さいだん]のそばで種[たね]なしパンとして食[た]べなさい。それは最[もっと]も聖[せい]なるものである。"
  13: "それを聖[せい]なる場所[ばしょ]で食[た]べなさい。それは主[しゅ]の捧[ささ]げ物[もの]のうちから、あなたとあなたの子[こ]らへの定[さだ]めだからである。そのように、わたしに命[めい]じられている。"
  14: "また、揺[ゆ]すって献[ささ]げる胸[むね]と、持[も]ち上[あ]げて献[ささ]げる肩[かた]を、聖[せい]なる場所[ばしょ]であなたも、あなたとともにいるあなたの子[こ]らも、あなたの家[いえ]の者[もの]も食[た]べなさい。それはイスラエルの子[こ]らの酬恩祭[しゅうおんさい]の犠牲[ぎせい]から、あなたとあなたの子[こ]らへの定[さだ]めとして与[あた]えられたものだからである。"
  15: "彼[かれ]らは、脂肪[しぼう]の捧[ささ]げ物[もの]とともに、持[も]ち上[あ]げて献[ささ]げる肩[かた]と揺[ゆ]すって献[ささ]げる胸[むね]を、主[しゅ]の前[まえ]に献[ささ]げ物[もの]として取[と]り分[わ]けるために持[も]って来[き]る。それはあなたと、あなたとともにいるあなたの子[こ]らと娘[むすめ]たちへの永遠[えいえん]の定[さだ]めとなる。主[しゅ]がモーセに命[めい]じたとおりである。」"
  16: "モーセは贖罪祭[しょくざいさい]の雄山羊[おすやぎ]を求[もと]めて探[さが]したが、それはすでに焼[や]かれていた。そこでモーセは、残[のこ]されたアロンの子[こ]らであるエレアザルとイタマルに向[む]かって怒[いか]り、言[い]った。"
  17: "「なぜ、あなたがたは贖罪祭[しょくざいさい]を聖[せい]なる場所[ばしょ]で食[た]べなかったのか。それは最[もっと]も聖[せい]なるものであり、あなたがたに与[あた]えられたのは、会衆[かいしゅう]の罪[つみ]を取[と]り除[のぞ]き、彼[かれ]らのために主[しゅ]の前[まえ]で贖[あがな]いをするためであった。"
  18: "見[み]よ、その血[ち]は聖所[せいしょ]の内[うち]に持[も]ち込[こ]まれなかった。あなたがたは、わたしが命[めい]じたとおりに、聖[せい]なる場所[ばしょ]の内[うち]で、主[しゅ]の前[まえ]でそれを食[た]べるべきだった。」"
  19: "アロンはモーセに言[い]った。「今日[きょう]、彼[かれ]らは自分[じぶん]たちの贖罪祭[しょくざいさい]と燔祭[はんさい]を主[しゅ]の前[まえ]に献[ささ]げた。そして、このようなことがわたしに起[お]こった。もし今日[きょう]、わたしが贖罪祭[しょくざいさい]を食[た]べるなら、主[しゅ]に喜[よろこ]ばれるだろうか。」"
  20: "モーセはこれを聞[き]き、それでよいと思[おも]った。"

notes:
  1: "πυρεῖον — кадильница, жаровня (香炉). θυμίαμα — фимиам, курение (香). πῦρ ἀλλότριον — чуждый, посторонний огонь (異なる火). ὃ οὐ προσέταξεν κύριος αὐτοῖς — которого не заповедал им Господь."
  2: "ἐξῆλθεν πῦρ παρὰ κυρίου — вышел огонь от Господа. κατέφαγεν — пожрал. ἀπέθανον ἔναντι κυρίου — умерли пред Господом."
  3: "τοῦτό ἐστιν ὃ εἶπεν κύριος — вот что сказал Господь. Ἐν τοῖς ἐγγίζουσίν μοι ἁγιασθήσομαι — «в приближающихся ко Мне освящусь» (ἁγιάζω, буд. pass.); 聖なる者とされ. δοξασθήσομαι — прославлюсь. κατενύχθη — был пронзён в сердце, глубоко опечалился (κατανύσσομαι; слав. «умилися»; Син. «молчал» — с евр.)."
  4: "Μισαδαι — Мисаил (Мишаэль); Ελισαφαν — Елисафан (Елицафан); Οζιηλ — Озиил (Узиил). υἱοὺς τοῦ ἀδελφοῦ τοῦ πατρὸς Ααρων — сыновья брата отца Аарона, т. е. двоюродные братья. ἐκ προσώπου τῶν ἁγίων — от лица святыни (聖所)."
  5: "ἦραν ἐν τοῖς χιτῶσιν αὐτῶν — вынесли в своих хитонах (χιτών — нижняя одежда; слав. «ризы»). ὃν τρόπον — как."
  6: "ἀποκιδαρώσετε — обнажите голову (ἀποκιδαρόω, снятие головного убора); 頭をむき出しに. ἱμάτια διαρρήξετε — раздерёте одежды (знак скорби). θυμός — гнев. ἐμπυρισμός — сожжение; ὃν ἐνεπυρίσθησαν ὑπὸ κυρίου — которым они сожжены Господом (слав. «запаления, имже запалишася»)."
  7: "θύρα τῆς σκηνῆς — дверь скинии. ἔλαιον τῆς χρίσεως — елей помазания (注ぎの油). τὸ παρὰ κυρίου — от Господа. ῥῆμα Μωυσῆ — слово Моисея."
  8: "ἐλάλησεν κύριος τῷ Ααρων λέγων — сказал Господь Аарону, говоря (обращение к одному Аарону, но заповедь касается и сынов)."
  9: "οἶνος — вино. σίκερα — крепкий напиток, сикер (не обязательно виноградный; 強い酒). ἡνίκα ἂν εἰσπορεύησθε — когда входите. προσπορευομένων ὑμῶν — когда приступаете. νόμιμον αἰώνιον — вечный устав (в базе в квадратных скобках)."
  10: "διαστεῖλαι — различать (διαστέλλω). ἅγια — святое; βέβηλα — мирское, профанное (俗なる). ἀκάθαρτα / καθαρά — нечистое / чистое."
  11: "συμβιβάσεις — научишь, наставишь (συμβιβάζω). νόμιμα — уставы. διὰ χειρὸς Μωυσῆ — через руку Моисея (слав. «рукою моисеовою»)."
  12: "θυσίαν τὴν καταλειφθεῖσαν ἀπὸ τῶν καρπωμάτων — оставшуюся жертву из приношений (здесь хлебное приношение; 素祭). ἄζυμα — пресное (種なしパン). παρὰ τὸ θυσιαστήριον — у жертвенника. ἅγια ἁγίων — святое святых (最も聖なるもの)."
  13: "νόμιμον γάρ σοί ἐστιν — ибо это устав для тебя. ἀπὸ τῶν καρπωμάτων κυρίου — из приношений Господних. οὕτω γὰρ ἐντέταλταί μοι — ибо так заповедано мне (слав./Син. добавляют «Господь» — в греч. нет)."
  14: "στηθύνιον τοῦ ἀφορίσματος — грудь «отделения», т. е. потрясания (揺すって献げる胸). βραχίων τοῦ ἀφαιρέματος — плечо «отнятия», возношения (持ち上げて献げる肩). ὁ οἶκός σου — дом твой (Син. добавляет «и дочери твои» — в греч. 10:14 нет; дочери названы в 10:15)."
  15: "ἐπὶ τῶν καρπωμάτων τῶν στεάτων — с приношениями туков, вместе с жиром. ἀφόρισμα ἀφορῖσαι — «отделить отделением» (figura etymologica; слав. «участие еже приносити»). ἔσται σοὶ… νόμιμον αἰώνιον — будет тебе… вечным уставом."
  16: "ζητῶν ἐξεζήτησεν — искал, разыскивая (усилительный оборот). ἐνεπεπύριστο — был сожжён (плюсквамперфект ἐμπυρίζω). ἐθυμώθη — разгневался."
  17: "ἐφάγετε — вы ели. ἅγια ἁγίων — святое святых. ἀφέλητε τὴν ἁμαρτίαν — снять грех (ἀφαιρέω). ἐξιλάσησθε — умилостивить (ἐξιλάσκομαι)."
  18: "εἰσήχθη τοῦ αἵματος αὐτοῦ εἰς τὸ ἅγιον — кровь его не внесена во святое. κατὰ πρόσωπον ἔσω — «пред лицом внутрь» (тёмное выражение LXX; слав. «пред лицем внутрь»; Син. «внутри святилища»)."
  19: "Εἰ σήμερον — «вот, сегодня» или «если сегодня» (Εἰ, вероятно, передаёт евр. הֵן «вот»; Син. «вот»). προσαγειόχασιν — perfect 3 pl. от προσάγω: «принесли» (редкая форма). συμβέβηκέν μοι ταῦτα — это случилось со мною. φάγομαι — буду есть (буд. от ἐσθίω). μὴ ἀρεστὸν ἔσται κυρίῳ — «не будет ли угодно Господу?» (вопрос с μή ожидает отрицательного ответа)."
  20: "ἤκουσεν — услышал. ἤρεσεν αὐτῷ — было угодно ему, он одобрил (ἀρέσκω)."
