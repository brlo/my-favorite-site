# jp-box, Левит, глава 10. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в главе отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 10: Надав и Авиуд и чуждый огонь (1–2); слово Моисея к Аарону (3);
# вынос тел (4–5); запрет траура и выхода из скинии (6–7);
# закон о вине и различении святого (8–11); доля священников от жертв (12–15);
# гнев Моисея из-за козла за грех и ответ Аарона (16–20).
# Красного и синего нет. Речь Бога — 「…」 (9–11); речь Моисея — 「…」 (3, 4, 6–7,
# 12–15, 17–18); слово Господа внутри речи Моисея — 『…』 (3); речь Аарона — 「…」 (19).
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (проверено по базе).
# Сносок ⟨…⟩ нет: 燔祭, 贖罪祭, 素祭, 酬恩祭 уже пояснены в Лев 1–5.
