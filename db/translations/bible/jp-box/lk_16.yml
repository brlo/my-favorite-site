verses:
  1: "イエスは弟子[でし]たちにも言[い]われた。「<j>ある金持[かねも]ちのところに、一人[ひとり]の管理人[かんりにん]がいた。ところが、その管理人[かんりにん]が主人[しゅじん]の財産[ざいさん]を散[ち]らしていると、主人[しゅじん]に訴[うった]えられた。</j>"
  2: "<j>主人[しゅじん]は管理人[かんりにん]を呼[よ]んで言[い]った。『わたしがあなたについて聞[き]いていることは、いったいどういうことか。管理[かんり]の報告[ほうこく]を出[だ]しなさい。あなたはもう管理[かんり]を続[つづ]けることはできない。』</j>"
  3: "<j>管理人[かんりにん]は心[こころ]の中[なか]で言[い]った。『どうしようか。主人[しゅじん]がわたしから管理[かんり]の職[しょく]を取[と]り上[あ]げる。土[つち]を掘[ほ]る力[ちから]はないし、物乞[ものご]いをするのは恥[は]ずかしい。</j>"
  4: "<j>そうだ、こうしよう。管理[かんり]の職[しょく]を解[と]かれたとき、人々[ひとびと]がわたしを自分[じぶん]の家[いえ]に迎[むか]え入[い]れてくれるように。』</j>"
  5: "<j>そこで、主人[しゅじん]の借[か]り主[ぬし]たちを一人[ひとり]ずつ呼[よ]んで、最初[さいしょ]の者[もの]に言[い]った。『あなたはわたしの主人[しゅじん]にいくら借[か]りがあるのか。』</j>"
  6: "<j>その人[ひと]は言[い]った。『油[あぶら]百[ひゃく]バテ⟨液[えき]を量[はか]る単位[たんい]。約[やく]二十二[にじゅうに]リットル。⟩です。』そこで管理人[かんりにん]は言[い]った。『あなたの証書[しょうしょ]を取[と]って、すぐに座[すわ]って五十[ごじゅう]と書[か]きなさい。』</j>"
  7: "<j>次[つぎ]に、ほかの者[もの]に言[い]った。『あなたはいくら借[か]りがあるのか。』その人[ひと]は言[い]った。『小麦[こむぎ]百[ひゃく]コルス⟨穀物[こくもつ]を量[はか]る単位[たんい]。約[やく]二百二十[にひゃくにじゅう]リットル。⟩です。』管理人[かんりにん]は言[い]った。『あなたの証書[しょうしょ]を取[と]って、八十[はちじゅう]と書[か]きなさい。』</j>"
  8: "<j>主人[しゅじん]は、この不正[ふせい]な管理人[かんりにん]が賢[かしこ]くふるまったのをほめた。この世[よ]の子[こ]らは、自分[じぶん]たちの世代[せだい]のことでは、光[ひかり]の子[こ]らよりも賢[かしこ]いのである。</j>"
  9: "<j>わたしもあなたがたに言[い]う。不正[ふせい]の富[とみ]をもって自分[じぶん]のために友[とも]を作[つく]りなさい。そうすれば、あなたがたが乏[とぼ]しくなったとき、彼[かれ]らがあなたがたを永遠[えいえん]の住[す]まいに迎[むか]え入[い]れてくれる。</j>"
  10: "<j>最[もっと]も小[ちい]さいことにも忠実[ちゅうじつ]な者[もの]は、多[おお]くのことにも忠実[ちゅうじつ]であり、最[もっと]も小[ちい]さいことにも不正[ふせい]な者[もの]は、多[おお]くのことにも不正[ふせい]である。</j>"
  11: "<j>もしあなたがたが、不正[ふせい]な富[とみ]に忠実[ちゅうじつ]でなかったら、だれがあなたがたに真[しん]の富[とみ]を委[ゆだ]ねるだろうか。</j>"
  12: "<j>また、他人[たにん]のものに忠実[ちゅうじつ]でなかったら、だれがあなたがたに、あなたがた自身[じしん]のものを与[あた]えるだろうか。</j>"
  13: "<j>だれも二人[ふたり]の主人[しゅじん]に仕[つか]えることはできない。一方[いっぽう]を憎[にく]んで他方[たほう]を愛[あい]するか、一方[いっぽう]を重[おも]んじて他方[たほう]を軽[かろ]んじるか、そのどちらかである。あなたがたは神[かみ]と富[とみ]とに仕[つか]えることはできない。</j>」"
  14: "ファリサイ派[は]の人[ひと]たちは金銭[きんせん]を好[この]んでいたので、これらをすべて聞[き]いて、イエスをあざ笑[わら]った。"
  15: "イエスは彼[かれ]らに言[い]われた。「<j>あなたがたは人々[ひとびと]の前[まえ]で自分[じぶん]を正[ただ]しいとする者[もの]たちである。しかし、神[かみ]はあなたがたの心[こころ]をご存[ぞん]じである。人[ひと]の間[あいだ]で高[たか]くされているものは、神[かみ]の前[まえ]では忌[い]むべきものなのである。</j>"
  16: "<j>律法[りっぽう]と預言者[よげんしゃ]たちはヨハネの時[とき]までである。その時[とき]から、神[かみ]の国[くに]は福音[ふくいん]として告[つ]げ知[し]らされ、だれもが力[ちから]ずくでそこに入[はい]ろうとしている。</j>"
  17: "<j>天[てん]と地[ち]が過[す]ぎ去[さ]るほうが、律法[りっぽう]の一画[いっかく]が消[き]えるよりも、まだたやすい。</j>"
  18: "<j>自分[じぶん]の妻[つま]を離[はな]して別[べつ]の女[おんな]を娶[めと]る者[もの]はだれでも姦淫[かんいん]する。また、夫[おっと]から離[はな]された女[おんな]を娶[めと]る者[もの]も姦淫[かんいん]する。</j>」"
  19: "「<j>ある金持[かねも]ちがいた。紫[むらさき]の衣[ころも]と上等[じょうとう]な亜麻布[あまぬの]をまとって、毎日[まいにち]、華[はな]やかに楽[たの]しんでいた。</j>"
  20: "<j>また、ラザロという名[な]の貧[まず]しい者[もの]が、全身[ぜんしん]にできもののできたまま、その人[ひと]の門[もん]の前[まえ]に置[お]かれていた。</j>"
  21: "<j>彼[かれ]は金持[かねも]ちの食卓[しょくたく]から落[お]ちるもので腹[はら]を満[み]たそうとしていた。犬[いぬ]たちまで来[き]て、そのできものをなめていた。</j>"
  22: "<j>さて、この貧[まず]しい者[もの]は死[し]に、天使[てんし]たちによってアブラハムの懐[ふところ]へ運[はこ]ばれた。金持[かねも]ちも死[し]んで葬[ほうむ]られた。</j>"
  23: "<j>そして、よみで苦[くる]しみながら目[め]を上[あ]げると、遠[とお]くにアブラハムと、その懐[ふところ]にいるラザロが見[み]えた。</j>"
  24: "<j>そこで彼[かれ]は叫[さけ]んで言[い]った。『父[ちち]アブラハムよ、わたしをあわれんでください。ラザロを遣[つか]わして、その指[ゆび]の先[さき]を水[みず]に浸[ひた]し、わたしの舌[した]を冷[ひ]やさせてください。この炎[ほのお]の中[なか]で苦[くる]しんでいるのです。』</j>"
  25: "<j>アブラハムは言[い]った。『子[こ]よ、あなたは生[い]きている間[あいだ]に善[よ]いものを受[う]け、ラザロは悪[わる]いものを受[う]けたことを思[おも]い出[だ]しなさい。今[いま]、彼[かれ]はここで慰[なぐさ]められ、あなたは苦[くる]しんでいる。</j>"
  26: "<j>そのうえ、わたしたちとあなたがたとの間[あいだ]には大[おお]きな淵[ふち]が定[さだ]められていて、ここからあなたがたのところへ渡[わた]ろうとする者[もの]もできず、そこからわたしたちのところへ渡[わた]って来[く]ることもできない。』</j>"
  27: "<j>そこで、彼[かれ]は言[い]った。『それなら、父[ちち]よ、お願[ねが]いです。ラザロをわたしの父[ちち]の家[いえ]に遣[つか]わしてください。</j>"
  28: "<j>わたしには五人[ごにん]の兄弟[きょうだい]がいるのです。彼[かれ]らがこの苦[くる]しみの場所[ばしょ]へ来[こ]ないように、ラザロに証[あかし]をさせてください。』</j>"
  29: "<j>アブラハムは言[い]った。『彼[かれ]らにはモーセと預言者[よげんしゃ]たちがいる。その人[ひと]たちの言[い]うことを聞[き]くがよい。』</j>"
  30: "<j>彼[かれ]は言[い]った。『いいえ、父[ちち]アブラハムよ。もし死者[ししゃ]の中[なか]からだれかが彼[かれ]らのところへ行[い]けば、彼[かれ]らは悔[く]い改[あらた]めるでしょう。』</j>"
  31: "<j>アブラハムは彼[かれ]に言[い]った。『もし彼[かれ]らがモーセと預言者[よげんしゃ]たちの言[い]うことを聞[き]かないなら、死者[ししゃ]の中[なか]からだれかが復活[ふっかつ]しても、彼[かれ]らは信[しん]じないであろう。』</j>」"

notes:
  1: "οἰκονόμος — 管理人. διεβλήθη — «был обвинён»; 訴えられた. διασκορπίζων — 散らしている."
  2: "ἀπόδος τὸν λόγον — «сдай отчёт»; 管理の報告を出しなさい. οἰκονομεῖν — 管理する."
  3: "σκάπτειν οὐκ ἰσχύω — 土を掘る力はない. ἐπαιτεῖν αἰσχύνομαι — 物乞いをするのは恥ずかしい."
  4: "μετασταθῶ — «буду отставлен»; 職を解かれた. δέξωνταί με — 迎え入れてくれる."
  5: "χρεοφειλέται — 借り主. ἕνα ἕκαστον — 一人ずつ."
  6: "βάτος (acc. pl. βάτους) — мера жидкости (bath), не μετρητής (ср. Ин 2:6); передал バテ, сноска. γράμματα — 証書. πεντήκοντα — 五十."
  7: "κόρος (acc. pl. κόρους) — мера сыпучих; コルス, сноска. ὀγδοήκοντα — 八十."
  8: "ἐπῄνεσεν — ほめた. οἱ υἱοὶ τοῦ αἰῶνος τούτου — この世の子ら. εἰς τὴν γενεὰν τὴν ἑαυτῶν — 自分たちの世代のことでは."
  9: "μαμωνᾶς τῆς ἀδικίας — 不正の富. В критическом ἐκλίπῃ («когда оно иссякнет»), в TR/Елизаветинской/jp-joc ἐκλίπητε («когда вы оскудеете») — あなたがたが乏しくなったとき, без 〔〕 (замена). αἰώνιοι σκηναί — 永遠の住まい."
  10: "ἐλαχίστῳ — 最も小さいこと. ἄδικος — 不正."
  11: "τὸ ἀληθινόν — 真の富."
  12: "τὸ ἀλλότριον — 他人のもの; τὸ ὑμέτερον — あなたがたに属するもの."
  13: "οἰκέτης — 僕. ἀνθέξεται — «держится»; 重んじる. καταφρονήσει — 軽んじる."
  14: "φιλάργυροι — 金銭を好む. ἐξεμυκτήριζον — あざ笑った."
  15: "δικαιοῦντες ἑαυτούς — 自分を正しいとする. βδέλυγμα — 忌むべきもの."
  16: "μέχρι Ἰωάννου — ヨハネの時まで. βιάζεται — «врывается силою»; 力ずくで入ろうとしている."
  17: "κεραία — 一画. εὐκοπώτερον — まだたやすい."
  18: "ἀπολύων… γαμῶν — 離して娶る; μοιχεύει — 姦淫する."
  19: "πορφύρα καὶ βύσσος — 紫の衣と上等な麻布. λαμπρῶς — 華やかに."
  20: "πυλών — 門. εἱλκωμένος — «покрытый язвами»; できもののできた."
  21: "τὰ πίπτοντα ἀπὸ τῆς τραπέζης — 食卓から落ちるもの. ἐπέλειχον — なめていた."
  22: "κόλπος Ἀβραάμ — アブラハムの懐. ἐτάφη — 葬られた."
  23: "ᾅδης — よみ (не 地獄: γέεννα). βάσανοι — 苦しみ."
  24: "Πάτερ Ἀβραάμ — 父アブラハムよ. βάψῃ τὸ ἄκρον τοῦ δακτύλου — 指の先を浸し. καταψύξῃ — 冷やさせてください. ὀδυνῶμαι — 苦しんでいる."
  25: "ἀπέλαβες τὰ ἀγαθά — «получил доброе»; 善いものを受けた. παρακαλεῖται — 慰められている."
  26: "χάσμα μέγα — 大きな淵. ἐστήρικται — 定められている. διαπερῶσιν — 渡って来る."
  27: "ἐρωτῶ σε — お願いです."
  28: "διαμαρτύρηται — «засвидетельствует»; 証をさせてください. τόπος βασάνου — 苦しみの場所."
  29: "Μωϋσέα καὶ τοὺς προφήτας — モーセと預言者たち. ἀκουσάτωσαν — 聞くがよい."
  30: "μετανοήσουσιν — 悔い改めるでしょう."
  31: "πεισθήσονται — «убедятся»; 信じる."
