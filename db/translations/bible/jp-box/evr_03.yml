# jp-box, Послание к Евреям, глава 3. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 3: Христос — Апостол и Первосвященник исповедания, верный, как Моисей,
# но выше Моисея (1–6); Пс 95:7–11 (7–11), предостережение от неверия (12–19).
# Красного нет: слова Святого Духа в 3:7–11 — цитата Писания, 「…」 без <j>.
# 〔…〕: 3:6 — церковное μέχρι τέλους βεβαίαν (в базе нет, проверено запросом
# к gr-lxx-byz; есть у Елизаветинской «до конца», jp-joc 終に至るまで).
# Цитата 3:7–11 — один блок 「…」, внутри него нет вложенных кавычек.
# 3:7 τὸ πνεῦμα τὸ ἅγιον — пара {聖霊|聖神}. Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

tr_code: jp-box
book: evr
chapter: 3
draft: true

verses:
  1: "それゆえ、聖[せい]なる兄弟[きょうだい]たち、天[てん]の召[め]しにあずかる者[もの]たちよ、わたしたちが告白[こくはく]する使徒[しと]であり大祭司[だいさいし]であるイエスを、心[こころ]に深[ふか]く思[おも]いなさい。"
  2: "この方[かた]は、モーセが神[かみ]の家[いえ]の全体[ぜんたい]において忠実[ちゅうじつ]であったように、ご自身[じしん]を立[た]てられた方[かた]に対して忠実[ちゅうじつ]であった。"
  3: "というのは、家[いえ]を建[た]てる者[もの]が家[いえ]よりも大[おお]きな誉[ほま]れを受[う]けるように、この方[かた]は、モーセよりも大[おお]きな栄光[えいこう]を受[う]けるにふさわしい者[もの]とされたのである。"
  4: "というのは、どの家[いえ]にも、それを建[た]てる者[もの]がいる。しかし、すべてのものを建[た]てられた方[かた]は神[かみ]である。"
  5: "モーセは、神[かみ]の家[いえ]の全体[ぜんたい]において、のちに語[かた]られることの証[あかし]として、僕[しもべ]として忠実[ちゅうじつ]であったが、"
  6: "キリストは、神[かみ]の家[いえ]の上[うえ]に立[た]つ子[こ]としておられる。わたしたちが、その家[いえ]なのである。ただし、わたしたちが、大胆[だいたん]さと希望[きぼう]の誇[ほこ]りとを〔終[おわ]わりまで固[かた]く〕保[たも]つならば、そうなのである。"
  7: "それゆえ、{聖霊[せいれい]|聖神[せいしん]}が言[い]われるとおりである。「今日[きょう]、もしあなたがたが、この方[かた]の声[こえ]を聞[き]くなら、"
  8: "あの反逆[はんぎゃく]のとき、荒[あ]れ野[の]で試[こころ]みのあった日[ひ]のように、あなたがたの心[こころ]を頑[かたくな]にしてはならない。"
  9: "そこは、あなたがたの先祖[せんぞ]たちが、わたしを試[こころ]み、わたしをためした所[ところ]であり、彼[かれ]らはわたしの業[わざ]を見[み]た。"
  10: "それゆえ、四[よん]十[じゅう]年[ねん]の間[あいだ]、わたしはこの世代[せだい]に憤[いきどお]り、こう言[い]った。彼[かれ]らはいつも心[こころ]で迷[まよ]っている。彼[かれ]らはわたしの道[みち]を知[し]らなかった。"
  11: "わたしが怒[いか]りをもって誓[ちか]ったとおり、彼[かれ]らは、わたしの安息[あんそく]に入[はい]ることはない」と。"
  12: "兄弟[きょうだい]たちよ、気[き]をつけなさい。あなたがたの中[なか]に、生[い]ける神[かみ]から離[はな]れ去[さ]る不信仰[ふしんこう]の悪[あ]しき心[こころ]が、だれにも起[お]こらないように。"
  13: "かえって、「今日[きょう]」と呼[よ]ばれている間[あいだ]は、日[ひ]ごとに互[たが]いに勧[すす]め合[あ]いなさい。あなたがたの中[なか]のだれも、罪[つみ]の欺[あざむ]きによって心[こころ]を頑[かたくな]にしないように。"
  14: "というのは、わたしたちは、初[はじ]めの確信[かくしん]を終[おわ]わりまで固[かた]く保[たも]つならば、キリストにあずかる者[もの]となるからである。"
  15: "こう言[い]われているとおりである。「今日[きょう]、もしあなたがたが、この方[かた]の声[こえ]を聞[き]くなら、あの反逆[はんぎゃく]のときのように、あなたがたの心[こころ]を頑[かたくな]にしてはならない」と。"
  16: "というのは、聞[き]いて反逆[はんぎゃく]した者[もの]たちとは、だれだったのか。モーセに導[みちび]かれてエジプトから出[で]た者[もの]たちが、みなそうだったのではないか。"
  17: "また、神[かみ]は四[よん]十[じゅう]年[ねん]の間[あいだ]、だれに憤[いきどお]られたのか。罪[つみ]を犯[おか]して、その屍[しかばね]が荒[あ]れ野[の]に倒[たお]れた者[もの]たちではなかったか。"
  18: "また、ご自身[じしん]の安息[あんそく]に入[はい]らせないと、だれに誓[ちか]われたのか。不従順[ふじゅう]な者[もの]たちではなかったか。"
  19: "そして、わたしたちは、彼[かれ]らが不信仰[ふしんこう]のゆえに入[はい]ることができなかったのを見[み]ている。"

notes:
  1: "ὅθεν — それゆえ. ἀδελφοὶ ἅγιοι — 聖なる兄弟たち. κλήσεως ἐπουρανίου μέτοχοι — 天の召しにあずかる者たち. κατανοήσατε — 心に深く思いなさい (вглядитесь). ἀπόστολος — 使徒 (единственный раз о Христе в Евр). ὁμολογία — 告白."
  2: "πιστὸν ὄντα τῷ ποιήσαντι αὐτόν — ご自身を立てられた方に対して忠実. ὡς καὶ Μωϋσῆς — モーセが…ように. ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ — 神の家の全体において (οἶκος — дом/род; ср. 3:5–6)."
  3: "πλείονος δόξης… ἠξίωται — 大きな栄光を受けるにふさわしい者とされた. καθ' ὅσον — それに応じて. ὁ κατασκευάσας — 建てる者."
  4: "πᾶς οἶκος κατασκευάζεται ὑπό τινος — どの家にも建てる者がいる. ὁ πάντα κατασκευάσας θεός — すべてのものを建てられた方は神."
  5: "θεράπων — 僕 (слуга, не υἱός). εἰς μαρτύριον τῶν λαληθησομένων — のちに語られることの証として (fut. pass. причастие)."
  6: "Χριστὸς ὡς υἱὸς ἐπὶ τὸν οἶκον αὐτοῦ — キリストは神の家の上に立つ子としておられる. οὗ οἶκός ἐσμεν ἡμεῖς — わたしたちがその家なのである. παρρησία — 大胆さ; καύχημα τῆς ἐλπίδος — 希望の誇り. В базе нет μέχρι τέλους βεβαίαν; церковный текст имеет (Елизаветинская «до конца», jp-joc 終に至るまで) — 〔終わりまで固く〕."
  7: "Начало цитаты Пс 95:7–11 (в LXX 94:7–11). τὸ πνεῦμα τὸ ἅγιον — {聖霊|聖神}. σήμερον — 今日; ἐὰν… ἀκούσητε — もし…聞くなら."
  8: "παραπικρασμός — 反逆 (Мерива, Исх 17:7); ἡμέρα τοῦ πειρασμοῦ — 試みのあった日. σκληρύνητε — 頑なにしてはならない. Порядок греческого сохранён: сравнение перед повелением."
  9: "οὗ — そこは. ἐπείρασαν… ἐν δοκιμασίᾳ — わたしを試み、ためした (Числ 14:22). εἶδον τὰ ἔργα μου — わたしの業を見た."
  10: "τεσσαράκοντα ἔτη в базе начинает 3:10 (в jp-joc отнесено к 3:9); διό — それゆえ в начале стиха. προσώχθισα — 憤った. ἀεὶ πλανῶνται τῇ καρδίᾳ — いつも心で迷っている. οὐκ ἔγνωσαν τὰς ὁδούς μου — わたしの道を知らなかった."
  11: "ὡς ὤμοσα ἐν τῇ ὀργῇ μου — 怒りをもって誓った. εἰ εἰσελεύσονται… — 入ることはない (семитская клятва-опущение). κατάπαυσις — 安息 (ключевой термин главы 3–4)."
  12: "βλέπετε — 気をつけなさい. καρδία πονηρὰ ἀπιστίας — 不信仰の悪しき心. ἐν τῷ ἀποστῆναι ἀπὸ θεοῦ ζῶντος — 生ける神から離れ去る."
  13: "παρακαλεῖτε ἑαυτούς — 互いに勧め合いなさい. ἄχρις οὗ τὸ Σήμερον καλεῖται — 「今日」と呼ばれている間. ἀπάτη τῆς ἁμαρτίας — 罪の欺き."
  14: "μέτοχοι τοῦ Χριστοῦ — キリストにあずかる者. ἀρχὴ τῆς ὑποστάσεως — 初めの確信 (ὑπόστασις здесь «уверенность»). μέχρι τέλους βεβαίαν — 終わりまで固く (в базе есть; ср. 3:6, где это чтение церковное)."
  15: "Повтор Пс 95:7–8 (ср. 3:7–8); ἐν τῷ λέγεσθαι — こう言われているとおり."
  16: "τίνες… παρεπίκραναν — 聞いて反逆した者たちとはだれか. ἀλλ' οὐ πάντες οἱ ἐξελθόντες ἐξ Αἰγύπτου — エジプトから出た者たちすべてではなかったか (риторический вопрос)."
  17: "τίσιν προσώχθισεν τεσσαράκοντα ἔτη — 四十年の間だれに憤られたのか. ὧν τὰ κῶλα ἔπεσεν ἐν τῇ ἐρήμῳ — その屍が荒れ野に倒れた (Числ 14:29)."
  18: "τίσιν ὤμοσεν… — だれに誓われたのか. εἰ μὴ τοῖς ἀπειθήσασιν — 不従順な者たちではなかったか."
  19: "βλέπομεν — 見ている. δι' ἀπιστίαν — 不信仰のゆえに."
