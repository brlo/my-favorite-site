  7: "Φαρισαῖοι/Σαδδουκαῖοι — первые упоминания в книге, отсюда сноски; в Мк 2:16 сноска была у ファリサイ派."
  10: "У jp-ni «木の根元に置かれている»; ἀξίνη — «топор», оставлено."
  12: "πτύον — «лопата/веяло»; по-японски 箕, как у jp-joc. У jp-ni «箕» тоже."
