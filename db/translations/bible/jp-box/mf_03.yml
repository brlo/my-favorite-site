verses:
  1: "そのころ、ユダヤの荒[あ]れ野[の]に洗礼者[せんれいしゃ]ヨハネが姿[すがた]を現[あらわ]し、こう宣[の]べ伝[つた]えていた。"
  2: "言[い]った。「悔[く]い改[あらた]めよ。天[てん]の国[くに]は近[ちか]づいた。」"
  3: "この人[ひと]について、預言者[よげんしゃ]イザヤはこう語[かた]った。「荒[あ]れ野[の]に叫[さけ]ぶ者[もの]の声[こえ]がある。『主[しゅ]の道[みち]を整[ととの]えよ、その小道[こみち]をまっすぐにせよ。』」"
  4: "ヨハネはらくだの毛[け]で作[つく]った上着[うわぎ]を身[み]にまとい、腰[こし]には革[かわ]の帯[おび]を結[むす]び、いなごと野蜜[のみつ]を常[つね]の食[しょく]としていた。"
  5: "そこで、エルサレムとユダヤ全土[ぜんど]、ヨルダン川[がわ]の周辺[しゅうへん]一帯[いったい]から、人々[ひとびと]が彼[かれ]のもとへ出[で]て来[き]て、"
  6: "そして、ヨルダン川[がわ]で彼[かれ]から洗礼[せんれい]⟨ギリシア語[ご]のバプティスマは「浸[ひた]す」「沈[しず]める」の意[い]。⟩を受[う]け、そのとき自分[じぶん]の罪[つみ]を言[い]い表[あらわ]していた。"
  7: "ヨハネは、ファリサイ派[は]⟨ユダヤ教[きょう]の一派[いっぱ]。律法[りっぽう]を厳格[げんかく]に守[まも]る。⟩やサドカイ派[は]⟨祭司[さいし]たちを中心[ちゅうしん]とする一派[いっぱ]。⟩の人々[ひとびと]が大勢[おおぜい]、洗礼[せんれい]を受[う]けに来[き]るのを見[み]て、彼[かれ]らに言[い]った。「蝮[まむし]の子[こ]らよ、迫[せま]り来[く]る怒[いか]りを逃[のが]れることを、だれがあなたがたに教[おし]えたのか。"
  8: "ならば、悔[く]い改[あらた]めにふさわしい実[み]を結[むす]びなさい。"
  9: "『わたしたちの父[ちち]はアブラハムだ』と心[こころ]の中[なか]で思[おも]うな。あなたがたに言[い]っておくが、神[かみ]はこの石[いし]ころからでも、アブラハムの子[こ]たちを造[つく]り出[だ]すことができる。"
  10: "斧[おの]はもう木[き]の根[ね]もとに置[お]かれている。だから、良[よ]い実[み]をつけない木[き]は残[のこ]らず切[き]り倒[たお]され、火[ひ]の中[なか]へ放[ほう]り込[こ]まれる。"
  11: "わたしは、悔[く]い改[あらた]めに導[みちび]くために、あなたがたに水[みず]で洗礼[せんれい]を授[さず]けている。しかし、わたしの後[あと]から来[く]る方[かた]は、わたしよりも強[つよ]い方[かた]である。わたしは、その方[かた]の履物[はきもの]を運[はこ]ぶ値打[ねう]ちもない。その方[かた]は、{聖霊[せいれい]|聖神[せいしん]}と火[ひ]で、あなたがたに洗礼[せんれい]をお授[さず]けになる。"
  12: "その方[かた]は手[て]に箕[み]を持[も]ち、脱穀場[だっこくじょう]を隅々[すみずみ]まできれいにし、麦[むぎ]を集[あつ]めて倉[くら]に納[おさ]め、もみ殻[がら]は消[き]えることのない火[ひ]で焼[や]き払[はら]われる。」"
  13: "イエスは、洗礼[せんれい]を受[う]けるために、ガリラヤからヨルダン川[がわ]のヨハネのもとへ来[こ]られた。"
  14: "しかし、ヨハネはそれを引[ひ]き止[と]めて言[い]った。「わたしこそ、あなたから洗礼[せんれい]を受[う]けるべきなのに、あなたがわたしのところへ来[こ]られるのですか。」"
  15: "イエスはお答[こた]えになった。「<j>今[いま]は、そうさせておきなさい。このようにして、すべての義[ぎ]を満[み]たすのが、わたしたちにふさわしいことなのだから。</j>」そこで、ヨハネは引[ひ]き止[と]めるのをやめた。"
  16: "イエスは洗礼[せんれい]を受[う]けると、すぐに水[みず]から上[あ]がられた。すると、天[てん]が開[ひら]き、イエスは神[かみ]の霊[れい]が鳩[はと]のように降[くだ]って来[き]て、ご自分[じぶん]の上[うえ]に臨[のぞ]むのをご覧[らん]になった。"
  17: "すると、天[てん]から声[こえ]がして言[い]った。「これはわたしの愛[あい]する子[こ]。わたしの心[こころ]にかなう者[もの]。」"

notes:
