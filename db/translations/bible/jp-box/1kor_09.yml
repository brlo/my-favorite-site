# jp-box, Первое послание к Коринфянам, глава 9. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 9: свобода Павла и его права (1–14), отказ от прав (15–18),
# «для всех сделался всем» (19–23), подвиг и усмирение тела (24–27).
# Красного и синего нет: 9:14 — косвенная речь о заповеди Господа, не цитата; <j>/<mo> не ставятся.
# 〔…〕 в главе нет: 9:20–21 проверены по базе — все церковные оговорки (μὴ ὢν αὐτὸς ὑπὸ νόμον,
# μὴ ὢν ἄνομος θεοῦ ἀλλ᾽ ἔννομος Χριστοῦ) в gr-lxx-byz есть.
# Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

tr_code: jp-box
book: 1kor
chapter: 9
draft: true

verses:
  1: "わたしは自由[じゆう]ではないのか。わたしは使徒[しと]ではないのか。わたしはわたしたちの主[しゅ]イエスを見[み]たのではないのか。あなたがたは、主[しゅ]にあってわたしの働[はたら]きではないのか。"
  2: "たとえほかの人々[ひとびと]にとってわたしが使徒[しと]でなくても、少[すく]なくともあなたがたにとっては使徒[しと]である。あなたがたこそ、主[しゅ]にあってわたしの使徒[しと]職[しょく]の証印[しょういん]だからである。"
  3: "わたしを尋問[じんもん]する者[もの]たちに対するわたしの弁明[べんめい]は、これである。"
  4: "わたしたちには食[た]べたり飲[の]んだりする権利[けんり]がないのか。"
  5: "わたしたちには、ほかの使徒[しと]たちや主[しゅ]の兄弟[きょうだい]たちやケファのように、信[しん]仰[こう]の姉妹[しまい]である妻[つま]を伴[ともな]って歩[ある]く権利[けんり]がないのか。"
  6: "それとも、わたしとバルナバだけが、働[はたら]かずにいる権利[けんり]を持[も]たないのか。"
  7: "だれが、自分[じぶん]の費用[ひよう]で兵[へい]として仕[つか]えるだろうか。だれが、ぶどう畑[ばたけ]を植[う]えて、その実[み]を食[た]べないだろうか。だれが、羊[ひつじ]の群[む]れを飼[か]って、その群[む]れの乳[ちち]を飲[の]まないだろうか。"
  8: "わたしはこれらのことを、人間[にんげん]の考[かんが]えに従[したが]って言[い]っているのか。律法[りっぽう]もまた、これらのことを言[い]っているのではないか。"
  9: "モーセの律法[りっぽう]に「脱穀[だっこく]する牛[うし]に口籠[くつこ]をはめてはならない」と書[か]かれている。神[かみ]は牛[うし]のことを気[き]にかけておられるのか。"
  10: "それとも、まったくわたしたちのために言[い]っているのか。そうだ、わたしたちのために書[か]かれたのである。耕[たがや]す者[もの]は望[のぞ]みをもって耕[たがや]すべきであり、脱穀[だっこく]する者[もの]も、その実[み]にあずかる望[のぞ]みをもって脱穀[だっこく]すべきである、と。"
  11: "わたしたちがあなたがたに霊[れい]のものを蒔[ま]いたのなら、あなたがたから肉[にく]のものを刈[か]り取[と]るのは、大[おお]きなことだろうか。"
  12: "ほかの者[もの]たちがあなたがたに対するこの権利[けんり]にあずかっているのなら、わたしたちはなおさらではないか。しかし、わたしたちはこの権利[けんり]を用[もち]いなかった。むしろ、キリストの福音[ふくいん]に何[なん]の妨[さまた]げも与[あた]えないために、すべてを耐[た]え忍[しの]んでいるのである。"
  13: "あなたがたは、聖[せい]なる務[つと]めに携[たずさ]わる者[もの]たちが神殿[しんでん]から食[た]べ、祭壇[さいだん]に仕[つか]える者[もの]たちが祭壇[さいだん]の分[ぶん]を共[とも]に受[う]けていることを知[し]らないのか。"
  14: "同じように、主[しゅ]も、福音[ふくいん]を宣[の]べ伝[つた]える者[もの]たちが福音[ふくいん]によって生[い]きるようにと定[さだ]められた。"
  15: "しかし、わたしはこれらのことをどれ一つ用[もち]いていない。わたしがこれを書[か]いたのは、わたしの場合[ばあい]にそのようになるためではない。わたしにとっては、むしろ死[し]ぬほうがよい——わたしの誇[ほこ]りを、だれにも空[むな]しくさせはしない。"
  16: "なぜなら、わたしが福音[ふくいん]を宣[の]べ伝[つた]えても、それはわたしの誇[ほこ]りにはならないからである。必要[ひつよう]がわたしに迫[せま]っているのである。福音[ふくいん]を宣[の]べ伝[つた]えないなら、わたしは災[わざわ]いである。"
  17: "もしわたしが自[みずか]ら進[すす]んでこれを行[おこな]うなら、報[むく]いがある。しかし、不本意[ふほんい]であっても、わたしは務[つと]めを託[たく]されているのである。"
  18: "では、わたしの報[むく]いとは何[なに]か。福音[ふくいん]を宣[の]べ伝[つた]えるとき、福音[ふくいん]を無償[むしょう]で語[かた]り、福音[ふくいん]におけるわたしの権利[けんり]を濫用[らんよう]しないことである。"
  19: "わたしはすべての者[もの]から自由[じゆう]でありながら、多[おお]くの者[もの]を得[え]るために、自分[じぶん]をすべての者[もの]の奴隷[どれい]としたのである。"
  20: "ユダヤ人[じん]にはユダヤ人[じん]のようになった。ユダヤ人[じん]を得[え]るためである。律法[りっぽう]の下[した]にある者[もの]には、自分[じぶん]は律法[りっぽう]の下[した]にないのに、律法[りっぽう]の下[した]にある者[もの]のようになった。律法[りっぽう]の下[した]にある者[もの]を得[え]るためである。"
  21: "律法[りっぽう]を持[も]たない者[もの]には、律法[りっぽう]を持[も]たない者[もの]のようになった。神[かみ]に対して律法[りっぽう]を持[も]たない者[もの]ではなく、キリストの律法[りっぽう]の下[した]にある者[もの]でありながら。律法[りっぽう]を持[も]たない者[もの]を得[え]るためである。"
  22: "弱[よわ]い者[もの]には弱[よわ]い者[もの]となった。弱[よわ]い者[もの]を得[え]るためである。わたしはすべての者[もの]に対してすべてのものとなった。何[なん]とかしてある人々[ひとびと]を救[すく]うためである。"
  23: "わたしは福音[ふくいん]のためにすべてのことを行[おこな]っている。福音[ふくいん]に共[とも]にあずかる者[もの]となるためである。"
  24: "あなたがたは、競技場[きょうぎじょう]を走[はし]る者[もの]は皆[みな]走[はし]るが、賞[しょう]を受[う]けるのはただ一人[ひとり]であることを知[し]らないのか。あなたがたは、勝[か]ち取[と]るために走[はし]りなさい。"
  25: "競技[きょうぎ]に加[くわ]わる者[もの]は、すべてのことについて自制[じせい]する。彼[かれ]らは朽[く]ちる冠[かんむり]を受[う]けるためにそうする。しかし、わたしたちは朽[く]ちない冠[かんむり]のためにそうするのである。"
  26: "だから、わたしはこうして走[はし]る。行[ゆ]き先[さき]の定[さだ]まらない者[もの]のようにではなく。わたしはこうして拳[こぶし]を振[ふ]るう。空[くう]気[き]を打[う]つ者[もの]のようにではなく。"
  27: "むしろ、わたしは自分[じぶん]の体[からだ]を打[う]ち叩[たた]いて奴隷[どれい]にする。ほかの者[もの]たちに宣[の]べ伝[つた]えておきながら、自分[じぶん]が失格[しっかく]者[もの]にならないためである。"

notes:
  1: "ἐλεύθερος — 自由 (ключевое слово главы: 9:1, 19). ἑώρακα — perfect: «я видел и вижу»; 見た. ἔργον — 働き (дело, а не «произведение»)."
  2: "σφραγίς — «печать», удостоверение подлинности; 証印. ἀλλά γε — «но уж по крайней мере»; 少なくとも."
  3: "ἀπολογία — 弁明 (судебный термин). ἀνακρίνω — «допрашивать, разбирать»; 尋問する (не 裁く; δοκιμάζω в 11:28 и κρίνω переданы иначе)."
  5: "ἀδελφὴν γυναῖκα περιάγειν — «водить сестру как жену», то есть жену-христианку; 信仰の姉妹である妻 (пояснение «信仰の» добавлено для ясности, ср. jp-joc 姉妹なる妻). Κηφᾶς — ケファ."
  6: "ἢ μόνος ἐγὼ καὶ Βαρναβᾶς — «или только я и Варнава»; わたしとバルナバだけが. μὴ ἐργάζεσθαι — «не работать», то есть жить на содержание общины."
  7: "στρατεύομαι ἰδίοις ὀψωνίοις — «нести военную службу на своё жалованье»; 自分の費用で兵として仕える. Три риторических вопроса — тремя вопросами."
  8: "κατὰ ἄνθρωπον — «по-человечески»; 人間の考えに従って. ἢ καί — «или и»; もまた…のではないか."
  9: "Цитата Втор 25:4. κημώσεις — «заградишь [рот]»; 口籠をはめる. μὴ τῶν βοῶν μέλει τῷ θεῷ — «разве о волах печётся Бог?»; вопрос сохранён."
  10: "ἢ δι᾽ ἡμᾶς πάντως λέγει — «или ради нас непременно говорит?»; まったくわたしたちのために. ὀφείλει ἐπ᾽ ἐλπίδι… ἀροτριᾶν — 望みをもって耕すべき. ὁ ἀλοῶν — 脱穀する者 (ἀλοάω — молотить)."
  11: "τὰ πνευματικά / τὰ σαρκικά — 霊のもの / 肉のもの. μέγα εἰ — риторическое «разве великое [дело], если…»; 大きなことだろうか."
  12: "στέγομεν — «терпим, сносим»; 耐え忍んでいる. ἐγκοπή — «препятствие, затор»; 妨げ. ἀλλά… ἀλλά — しかし…むしろ."
  13: "οἱ τὰ ἱερὰ ἐργαζόμενοι — «совершающие священное»; 聖なる務めに携わる者. συμμερίζονται — «получают долю вместе»; 分を共に受ける. В критическом тексте [τὰ] в квадратных скобках, в базе есть — без 〔…〕."
  14: "διέταξεν — «повелел, установил»; 定められた. Косвенная речь, а не цитата слов Господа: красного нет."
  15: "καύχημα — 誇り (ключевое слово 9:15–18). Тире передаёт обрыв греческой фразы (ἤ — τὸ καύχημά μου οὐδεὶς κενώσει). κενώσει — 空しくする."
  16: "ἀνάγκη ἐπίκειται — «необходимость лежит на мне»; 必要が迫っている. οὐαί — 災い."
  17: "ἑκών / ἄκων — «добровольно / невольно»; 自ら進んで / 不本意. οἰκονομία — «домостроительство, вверенное служение»; 務め."
  18: "ἀδάπανον — «без издержек»; 無償で. καταχρήσασθαι — «злоупотребить»; 濫用する."
  19: "ἐκ πάντων — «от всех», то есть ни от кого не зависимый; すべての者から自由. ἐδούλωσα — «поработил»; 奴隷とした. Не сглаживать."
  20: "В византийском тексте есть μὴ ὢν αὐτὸς ὑπὸ νόμον («сам не будучи под законом»); в критическом издании этой оговорки нет, но в базе сайта она есть, поэтому 〔…〕 не ставится. У jp-joc оговорка опущена."
  21: "ἄνομος θεοῦ — «не беззаконник перед Богом»; 神に対して律法を持たない者ではない. ἔννομος Χριστοῦ — «в законе Христовом»; キリストの律法の下にある者. Обе оговорки в базе есть — без 〔…〕."
  22: "τοῖς πᾶσιν γέγονα πάντα — すべての者に対してすべてのものとなった (не сглаживать). πάντως τινάς — «непременно некоторых»; 何とかしてある人々を."
  23: "συγκοινωνός — «соучастник»; 共にあずかる者 (не «получатель»). Павел — соучастник Евангелия."
  24: "στάδιον — 競技場 (беговая дорожка). βραβεῖον — награда победителю; 賞. καταλάβητε — «достигли, захватили»; 勝ち取る."
  25: "ἐγκρατεύεται — 自制する. φθαρτὸν στέφανον — 朽ちる冠 (венок из сельдерея или сосны). ἄφθαρτον — 朽ちない冠. οὖν — そうするのである."
  26: "ἀδήλως — «нецеленаправленно, без ясной цели»; 行き先の定まらない. ἀέρα δέρων — «бьющий воздух»; 空気を打つ者. πυκτεύω — кулачный бой; 拳を振るう."
  27: "ὑπωπιάζω — «бью в лицо, под глаз», то есть укрощаю ударами; 打ち叩く. δουλαγωγῶ — «веду как раба»; 奴隷にする. ἀδόκιμος — «не выдержавший испытания, отвергнутый»; 失格者. Не сглаживать."
