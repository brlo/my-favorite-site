verses:
  1: "また、わたしは、海[うみ]から一頭[いっとう]の獣[けもの]が上[のぼ]ってくるのを見[み]た。その獣[けもの]には十[じゅう]の角[つの]と七[なな]つの頭[あたま]があり、その角[つの]には十[じゅう]の王冠[おうかん]、頭[あたま]には冒涜[ぼうとく]の名[な]があった。"
  2: "わたしが見[み]た獣[けもの]はヒョウのようで、その足[あし]は熊[くま]のよう、口[くち]はライオンの口[くち]のようであった。龍[りゅう]は獣[けもの]に自分[じぶん]の力[ちから]と座[ざ]と大[おお]きな権威[けんい]を与[あた]えた。"
  3: "その頭[あたま]の一[ひと]つは、死[し]ぬほどの傷[きず]を受[う]けたかのようであった。しかし、その死[し]の傷[きず]は癒[い]やされ、全地[ぜんち]は驚[おどろ]いて獣[けもの]に従[したが]った。"
  4: "人[ひと]々[びと]は、獣[けもの]に権威[けんい]を与[あた]えた龍[りゅう]を拝[はい]み、また獣[けもの]を拝[はい]んで言[い]った。「だれがこの獣[けもの]に似[に]ているだろうか。だれがこの獣[けもの]と戦[たたか]えるだろうか。」"
  5: "獣[けもの]には、大[おお]きなことを語[かた]り、冒涜[ぼうとく]を語[かた]る口[くち]が与[あた]えられた。また、四十二[よんじゅうに]か月[げつ]の間[あいだ]、事[こと]を行[おこな]う権威[けんい]が与[あた]えられた。"
  6: "そこで、獣[けもの]は口[くち]を開[ひら]いて神[かみ]を冒涜[ぼうとく]し、神[かみ]の名[な]と、神[かみ]の幕屋[まくや]、すなわち天[てん]に住[す]む者[もの]たちを冒涜[ぼうとく]した。"
  7: "また、獣[けもの]には、聖[せい]なる者[もの]たちと戦[たたか]って勝[か]つことが許[ゆる]され、あらゆる部族[ぶぞく]、民[たみ]、言語[げんご]、国民[こくみん]の上[うえ]に権威[けんい]が与[あた]えられた。"
  8: "地[ち]に住[す]む者[もの]たちのうち、世[よ]の始[はじ]まりから屠[ほふ]られた小羊[こひつじ]の命[いのち]の書[しょ]に名[な]が記[しる]されていない者[もの]は、みな獣[けもの]を拝[はい]む。"
  9: "耳[みみ]のある者[もの]は聞[き]くがよい。"
  10: "捕[と]らえられるべき者[もの]は捕[と]らえられ、剣[つるぎ]で殺[ころ]されるべき者[もの]は剣[つるぎ]で殺[ころ]される。ここに、聖[せい]なる者[もの]たちの忍耐[にんたい]と信仰[しんこう]がある。"
  11: "また、わたしは、地[ち]から別[べつ]の獣[けもの]が上[のぼ]ってくるのを見[み]た。その獣[けもの]には小羊[こひつじ]に似[に]た二本[にほん]の角[つの]があり、龍[りゅう]のように語[かた]った。"
  12: "この獣[けもの]は、先[さき]の獣[けもの]のすべての権威[けんい]をその獣[けもの]の前[まえ]で行[おこな]い、地[ち]と地[ち]に住[す]む者[もの]たちに、死[し]の傷[きず]が癒[い]やされた先[さき]の獣[けもの]を拝[はい]ませる。"
  13: "また、大[おお]きなしるしを行[おこな]い、人[ひと]々[びと]の前[まえ]で天[てん]から地[ち]に火[ひ]を降[ふ]らせた。"
  14: "そして、獣[けもの]の前[まえ]で行[おこな]うことを許[ゆる]されたしるしによって、地[ち]に住[す]む者[もの]たちを惑[まど]わし、剣[つるぎ]の傷[きず]を受[う]けてなお生[い]き返[かえ]った獣[けもの]の像[ぞう]を造[つく]るように、地[ち]に住[す]む者[もの]たちに命[めい]じた。"
  15: "また、獣[けもの]の像[ぞう]に霊[れい]を与[あた]えて、獣[けもの]の像[ぞう]が語[かた]り、獣[けもの]の像[ぞう]を拝[はい]まない者[もの]をすべて殺[ころ]すことが、許[ゆる]された。"
  16: "また、小[ちい]さい者[もの]も大[おお]きい者[もの]も、富[と]む者[もの]も貧[まず]しい者[もの]も、自由[じゆう]な者[もの]も奴隷[どれい]も、すべての者[もの]に、右[みぎ]の手[て]か額[ひたい]に刻印[こくいん]を受[う]けさせた。"
  17: "それは、刻印[こくいん]を持[も]つ者[もの]、すなわち、獣[けもの]の名[な]か、その名[な]の数[かず]を刻印[こくいん]に持[も]つ者[もの]でなければ、だれも買[か]うことも売[う]ることもできないようにするためであった。"
  18: "ここに知恵[ちえ]がある。悟[さと]りのある者[もの]は、獣[けもの]の数[かず]を数[かぞ]えるがよい。それは人[ひと]の数[かず]である。その数[かず]は六百六十六[ろっぴゃくろくじゅうろく]である。"

notes:
  1: "θηρίον ἀναβαῖνον ἐκ τῆς θαλάσσης — 海から上ってくる獣. κέρατα δέκα καὶ κεφαλαὶ ἑπτά — 十の角と七つの頭. διαδήματα — 王冠. ὄνομα βλασφημίας — 冒涜の名 (в базе ед. ч.; вариант ὀνόματα не взят)."
  2: "παρδάλει — ヒョウ; ἄρκου — 熊; λέοντος — ライオン. ὁ δράκων ἔδωκεν … δύναμιν … θρόνον … ἐξουσίαν — 力と座と権威."
  3: "ὡς ἐσφαγμένην εἰς θάνατον — 死ぬほどの傷を受けたかのよう. ἡ πληγὴ τοῦ θανάτου — 死の傷; ἐθεραπεύθη — 癒やされた. ἐθαυμάσθη — 驚いた."
  4: "προσεκύνησαν τῷ δράκοντι — 龍を拝み. Τίς ὅμοιος τῷ θηρίῳ; — だれがこの獣に似ているのか. πολεμῆσαι — 戦う. Слова людей — 「」, не красные."
  5: "στόμα λαλοῦν μεγάλα καὶ βλασφημίας — 大きなことと冒涜を語る口. ἐξουσία ποιῆσαι — 行う権威. μῆνας τεσσαράκοντα δύο — 四十二か月."
  6: "εἰς βλασφημίας πρὸς τὸν θεόν — 神に対する冒涜. τὸ ὄνομα … τὴν σκηνὴν … τοὺς ἐν τῷ οὐρανῷ σκηνοῦντας — 名、幕屋、天に住む者たち."
  7: "ποιῆσαι πόλεμον μετὰ τῶν ἁγίων — 聖なる者たちと戦う. νικῆσαι — 勝つ. ἐπὶ πᾶσαν φυλὴν καὶ λαὸν καὶ γλῶσσαν καὶ ἔθνος — あらゆる部族、民、言語、国民の上に."
  8: "οἱ κατοικοῦντες ἐπὶ τῆς γῆς — 地に住む者たち. βιβλίον τῆς ζωῆς — 命の書. τοῦ ἀρνίου τοῦ ἐσφαγμένου — 屠られた小羊. ἀπὸ καταβολῆς κόσμου — 世の始まりから (относится к «заклан»)."
  9: "Εἴ τις ἔχει οὖς ἀκουσάτω — 耳のある者は聞くがよい."
  10: "εἴ τις εἰς αἰχμαλωσίαν — 捕らえられるべき者は. ἐν μαχαίρῃ ἀποκτανθῆναι — 剣で殺される. Ὧδε … ἡ ὑπομονὴ καὶ ἡ πίστις τῶν ἁγίων — ここに聖なる者たちの忍耐と信仰."
  11: "ἄλλο θηρίον … ἐκ τῆς γῆς — 地から出る別の獣. κέρατα δύο ὅμοια ἀρνίῳ — 小羊に似た二本の角. ἐλάλει ὡς δράκων — 龍のように語った."
  12: "τὴν ἐξουσίαν τοῦ πρώτου θηρίου — 先の獣の権威. ποιεῖ … ἵνα προσκυνήσωσιν — 拝ませる. οὗ ἐθεραπεύθη ἡ πληγή — 死の傷が癒やされた."
  13: "σημεῖα μεγάλα — 大きなしるし. πῦρ … ἐκ τοῦ οὐρανοῦ καταβαίνειν — 天から火を降らせる."
  14: "πλανᾷ — 惑わす. εἰκόνα τῷ θηρίῳ — 獣の像. ὃς ἔχει τὴν πληγὴν τῆς μαχαίρης καὶ ἔζησεν — 剣の傷を受けてなお生き返った."
  15: "δοῦναι πνεῦμα τῇ εἰκόνι — 像に霊を与える (πνεῦμα без ἅγιον — 霊, не 聖霊). λαλήσῃ — 語る. ὅσοι ἐὰν μὴ προσκυνήσωσιν … ἀποκτανθῶσιν — 拝まない者をすべて殺す."
  16: "τοὺς μικροὺς καὶ τοὺς μεγάλους — 小さい者も大きい者も. χάραγμα — 刻印. ἐπὶ τῆς χειρὸς … ἢ ἐπὶ τὸ μέτωπον — 右の手か額に."
  17: "ἀγορᾶσαι ἢ πωλῆσαι — 買うこと、売ること. τὸ ὄνομα τοῦ θηρίου ἢ τὸν ἀριθμὸν τοῦ ὀνόματος — 獣の名か、その名の数."
  18: "Ὧδε ἡ σοφία — ここに知恵. ὁ ἔχων νοῦν — 悟りのある者. ψηφισάτω — 数えるがよい. ἀριθμὸς ἀνθρώπου — 人の数. ἑξακόσιοι ἑξήκοντα ἕξ — 六百六十六."
