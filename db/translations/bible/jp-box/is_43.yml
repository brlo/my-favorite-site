# jp-box, Исаия, глава 43. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для гл. 43 есть фрагментами (40–43), но выгрузки
# по этой главе не делалось, в работе он не использовался; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 43: 1–7 «не бойся, ибо Я искупил тебя» — воды и огонь, Египет как выкуп,
# собирание сынов и дочерей; 8–13 прения: слепой и глухой народ, вы — свидетели Мои,
# «прежде Меня не было Бога»; 14–15 ради вас послан в Вавилон; 16–21 «вот, Я делаю
# новое» — путь в пустыне, звери прославляют; 22–28 обвинение: не Мне служил ты,
# Я изглаживаю беззакония, отцы согрешили.
# Речи: слова Господа — 「…」 (1–13; 14–15; 18–21; 22–28); внутри 6 — слова, сказанные
# северу и югу, — 『…』. 16–17 — описание Господа при вводной формуле («так говорит
# Господь, дающий путь в море»), вне кавычек, как в 42:5. Вводные формулы (1; 14; 16)
# — вне кавычек.
# Нумерация по gr: 28 стихов; у csl и ru тоже 28. Внутри главы слав. делит иначе:
# в 43:8 гр. «καὶ ἐξήγαγον» (аорист, «и Я вывел») слав. держит так же («И изведох»),
# а ru даёт императив «Выведи» (по МТ) — держим греческий и слав. (notes 8).
# Паритет: слав. добавления внесены без 〔…〕 — 43:9 «и да услышат»; 43:25 «мене ради»
# (ради Меня). 43:5 «от восток… от запад» и 43:6 «северу… югу» — по LXX. 43:14 «Халдеи
# в кораблях свяжутся» — по LXX и слав. (в ru иное, по МТ).
# 〔…〕 нет; сносок ⟨…⟩ нет: 燔祭, 香, 灯心, 荒野, 獣, 証人 уже в корпусе или пояснены
# в notes (ソエネ, セイレーン).
# Имена — транслитерация греческого (LXX): ヤコブ, イスラエル, エジプト, エチオピア,
# ソエネ, バビロン, カルデア人, シオン.

