verses:
  1: "今[いま]、あなたを造[つく]った主[しゅ]である神[かみ]、あなたを形[かたち]づくった方[かた]は、ヤコブよ、イスラエルよ、こう言[い]われる。「恐[おそ]れるな。わたしはあなたを贖[あがな]ったからである。わたしはあなたの名[な]を呼[よ]んだ。あなたはわたしのものだ。"
  2: "あなたが水[みず]の中[なか]を渡[わた]るとき、わたしはあなたとともにいる。川[かわ]はあなたを覆[おお]わない。あなたが火[ひ]の中を歩[あゆ]んでも、焼[や]かれることはなく、炎[ほのお]はあなたを焦[こ]がさない。"
  3: "わたしは主[しゅ]、あなたの神[かみ]、イスラエルの聖[せい]なる方[かた]、あなたの救[すく]い主[ぬし]である。わたしはあなたの身代[みがわ]わりにエジプトを、あなたの身代わりにエチオピアとソエネを与[あた]えた。"
  4: "わたしの目[め]にあなたが尊[とうと]くなってから、あなたは重[おも]んじられ、わたしはあなたを愛[あい]した。だから、わたしはあなたの代[か]わりに多[おお]くの人[ひと]を、あなたの頭[あたま]の代わりに支配者[しはいしゃ]たちを与える。"
  5: "恐[おそ]れるな。わたしはあなたとともにいる。わたしは東[ひがし]からあなたの種[たね]を連[つ]れて来[き]て、西[にし]からあなたを集[あつ]める。"
  6: "わたしは北[きた]に『渡[わた]せ』と言[い]い、南[みなみ]に『妨[さまた]げるな』と言[い]う。わたしの息子[むすこ]たちを遠[とお]い地[ち]から、わたしの娘[むすめ]たちを地の果[は]てから連[つ]れて来[こ]い。"
  7: "わたしの名[な]によって呼[よ]ばれる者[もの]たちを、みな。わたしはわたしの栄光[えいこう]のうちに彼を整[ととの]え、形[かたち]づくり、造[つく]った。"
  8: "わたしは目[め]の見[み]えない民[たみ]を導[みちび]き出[だ]した。彼らには目があるのに、目は見えず、耳[みみ]があっても聞[き]こえない。"
  9: "諸国[しょこく]の民[たみ]はみな、ともに集[あつ]められた。彼らの中[なか]から支配者[しはいしゃ]たちも集められる。だれがこれを告[つ]げるのか。初[はじ]めからのことを、だれがあなたがたに告げるのか。彼らにその証人[しょうにん]たちを連[つ]れて来[こ]させ、正[ただ]しいと認[みと]めさせ、真実[しんじつ]を語[かた]らせ、聞[き]かせよ。"
  10: "あなたがたはわたしの証人[しょうにん]であり、わたしも証人である、と主[しゅ]である神[かみ]は言[い]われる。わたしが選[えら]んだしもべも。あなたがたが知[し]り、わたしを信[しん]じ、わたしがいることを悟[さと]るためである。わたしの前[まえ]にほかの神[かみ]はなく、わたしの後[あと]にもない。"
  11: "わたしが神[かみ]である。わたしのほかに救[すく]う者[もの]はいない。"
  12: "わたしは告[つ]げ、救[すく]い、責[せ]めた。あなたがたの間[あいだ]にほかの者[もの]はいなかった。あなたがたはわたしの証人[しょうにん]、わたしも証人である、と主[しゅ]である神[かみ]は言[い]われる。"
  13: "わたしは初[はじ]めから変[か]わらない。わたしの手[て]から取[と]り出[だ]す者[もの]はいない。わたしが行[おこな]えば、だれがそれを覆[くつがえ]すのか。」"
  14: "あなたがたを贖[あがな]う主[しゅ]である神[かみ]、イスラエルの聖[せい]なる方[かた]はこう言[い]われる。「あなたがたのために、わたしはバビロンに遣[つか]わす者[もの]を送[おく]り、逃[に]げる者[もの]をすべて起[お]こす。カルデア人[じん]は舟[ふね]の中[なか]で縛[しば]られる。"
  15: "わたしは主[しゅ]である神[かみ]、あなたがたの聖[せい]なる方[かた]、イスラエルをあなたがたの王[おう]として示[しめ]した者[もの]である。」"
  16: "海[うみ]の中[なか]に道[みち]を、強[つよ]い水[みず]の中に小径[こみち]を与[あた]える主[しゅ]はこう言[い]われる。"
  17: "戦車[せんしゃ]と馬[うま]と強[つよ]い軍勢[ぐんぜい]を導[みちび]き出[だ]した方[かた]である。彼らは眠[ねむ]り、起[お]き上[あ]がらない。彼らは消[き]え、消えた灯心[とうしん]のようになった。"
  18: "「初[はじ]めのことを思[おも]い起[おこ]すな。昔[むかし]のことを考[かんが]えるな。"
  19: "見[み]よ、わたしは新[あたら]しいことを行[おこな]う。今[いま]、それが芽生[めば]える。あなたがたはそれを知[し]る。わたしは荒野[こうや]に道[みち]を、水[みず]のない所[ところ]に川[かわ]を造[つく]る。"
  20: "野[の]の獣[けもの]たち、セイレーンとダチョウの子[こ]らも、わたしをほめたたえる。わたしが荒野[こうや]に水[みず]を、水のない所に川[かわ]を与[あた]え、わたしが選[えら]んだ民[たみ]に飲[の]ませるからである。"
  21: "わたしが得[え]た民[たみ]、わたしの誉[ほま]れを告[つ]げるために。」"
  22: "「しかし、わたしは今[いま]、あなたを呼[よ]んだのではない、ヤコブよ。わたしがあなたに労[ろう]させたのではない、イスラエルよ。"
  23: "あなたの燔祭[はんさい]の羊[ひつじ]は、わたしのものではなかった。あなたの犠牲[ぎせい]によって、あなたはわたしを崇[あが]めたのではなかった。わたしは穀物[こくもつ]の供[そな]えによって、あなたに仕[つか]えさせたのではなく、香[こう]によって、あなたを疲[つか]れさせることもなかった。"
  24: "あなたは銀[ぎん]で香[こう]を買[か]って、わたしにささげることをしなかった。わたしはあなたの犠牲[ぎせい]の脂肪[しぼう]を求[もと]めもしなかった。しかし、あなたは自分の罪[つみ]と不正[ふせい]とともに、わたしの前[まえ]に立[た]った。"
  25: "わたしは、わたしこそ、わたし自身[じしん]のためにあなたの不法[ふほう]をぬぐい去[さ]り、あなたの罪[つみ]を覚[おぼ]えない者[もの]である。"
  26: "あなたは思[おも]い起[おこ]せ。そして、ともに裁[さば]こう。あなたの不法[ふほう]をまず語[かた]れ。そうすれば、あなたは正[ただ]しいと認[みと]められる。"
  27: "あなたがたの父[ちち]たちがまず、彼らの支配者[しはいしゃ]たちが、わたしに対して不法[ふほう]を犯[おか]した。"
  28: "支配者[しはいしゃ]たちはわたしの聖[せい]なるものを汚[けが]した。だから、わたしはヤコブとイスラエルを滅[ほろ]ぼし、そしりとなすために渡[わた]した。」"

notes:
  1: "οὕτως λέγει κύριος ὁ θεὸς ὁ ποιήσας σε, Ιακωβ, ὁ πλάσας σε, Ισραηλ — «тако глаголет Господь Бог сотворивый тя, Иакове, и создавый тя, Израилю»: обращения стоят в самой формуле, речь начинается с «не бойся» (форма である…言われる). πλάσσω — «лепить, ваять» (создать; 形づくる). ἐλυτρωσάμην σε — «избавих тя» (λυτρόω — выкупать, искупать; 贖う). ἐκάλεσά σε τὸ ὄνομά σου — «прозвах тя именем твоим»; ἐμὸς εἶ σύ — «мой еси ты»."
  2: "διαβαίνῃς δι᾽ ὕδατος — «преходиши сквозе воду»; ποταμοὶ οὐ συγκλύσουσίν σε — «реки не покрыют тебе» (συγκλύζω — заливать, покрывать водой); διὰ πυρός — «сквозе огнь»; φλὸξ οὐ κατακαύσει σε — «пламень не опалит тебе» (κατακαίω — сжигать). Три обещания сохранены без сглаживания."
  3: "ὁ ἅγιος Ισραηλ ὁ σῴζων σε — «святый израилев, спасаяй тя»; ἐποίησά σου ἄλλαγμα Αἴγυπτον — «сотворих премену твою Египет»: ἄλλαγμα — «выкуп, обмен» (身代わり). Αἰθιοπίαν καὶ Σοήνην — «Ефиопию и Сонину»: Σοήνη — Сиена (Асуан), ソエネ; в ru «Савею» — по МТ, не внесено."
  4: "ἀφ᾽ οὗ ἔντιμος ἐγένου ἐναντίον μου — «отнелиже честен был еси предо мною» (ἔντιμος — драгоценный, почётный); ἐδοξάσθης — «прославился еси»; ἠγάπησά σε — «Аз тя возлюбих». δώσω ἀνθρώπους πολλοὺς ὑπὲρ σοῦ — «дам человеки за тебе» (ὑπέρ — «вместо, за»); ἄρχοντας ὑπὲρ τῆς κεφαλῆς σου — «князи за главу твою»."
  5: "μὴ φοβοῦ, ὅτι μετὰ σοῦ εἰμι — «не бойся, яко с тобою есмь»; ἀπὸ ἀνατολῶν ἄξω τὸ σπέρμα σου — «от восток приведу семя твое»; ἀπὸ δυσμῶν συνάξω σε — «от запад соберу тя» (δυσμή — закат, запад)."
  6: "ἐρῶ τῷ βορρᾷ Ἄγε — «реку северу: приведи» (ἄγε — императив «веди, давай»); τῷ λιβί Μὴ κώλυε — «ливу: не возбраняй» (λίψ — юго-запад, юг; κωλύω — препятствовать). Слова, сказанные северу и югу, — в 『…』. ἄγε τοὺς υἱούς μου ἀπὸ γῆς πόρρωθεν — «приведи сыны моя от земли дальния»; θυγατέρας ἀπ᾽ ἄκρων τῆς γῆς — «дщери моя от краев земных»."
  7: "πάντας ὅσοι ἐπικέκληνται τῷ ὀνόματί μου — «всех, елицы нарицаются именем моим» (ἐπικαλέομαι — называться); ἐν γὰρ τῇ δόξῃ μου κατεσκεύασα αὐτὸν καὶ ἔπλασα καὶ ἐποίησα αὐτόν — «во славе бо моей устроих его и создах и сотворих и»: при множественном подлежащем в гр. стоит единственное число (сбой числа в оригинале), в японском сохранён переход на 彼. Три глагола (κατασκευάζω, πλάσσω, ποιέω) не сглажены."
  8: "ἐξήγαγον λαὸν τυφλόν — «изведох люди слепы»: аорист 1-го лица, «Я вывел» (так в гр. и слав.); в ru «Выведи народ слепой» — императив по МТ, не внесён. καὶ ὀφθαλμοί εἰσιν ὡσαύτως τυφλοί — «и очи суть такожде слепи»; κωφοὶ τὰ ὦτα ἔχοντες — «глуси ушы имущии»: народ слеп, хотя имеет глаза."
  9: "πάντα τὰ ἔθνη συνήχθησαν ἅμα — «вси языцы собрашася вкупе»; συναχθήσονται ἄρχοντες ἐξ αὐτῶν — «соберутся князи от них»; τίς ἀναγγελεῖ ταῦτα — «кто возвестит сия»; ἀγαγέτωσαν τοὺς μάρτυρας αὐτῶν — «да приведут свидетели своя»; δικαιωθήτωσαν — «да оправдятся». Слав. добавляет «и да услышат» — в LXX нет, по паритету внесено (聞かせよ)."
  10: "γένεσθέ μοι μάρτυρες, κἀγὼ μάρτυς, λέγει κύριος ὁ θεός — «будите ми свидетелие, и Аз свидетель, глаголет Господь Бог»: формула внутри речи, поэтому と…言われる. καὶ ὁ παῖς, ὃν ἐξελεξάμην — «и отрок мой, егоже избрах»: свидетелями названы и народ, и Раб. ἵνα γνῶτε καὶ πιστεύσητε καὶ συνῆτε — «да увесте и веруете и уразумеете»; ἔμπροσθέν μου οὐκ ἐγένετο ἄλλος θεός — «прежде мене не бысть ин Бог»; μετ᾽ ἐμὲ οὐκ ἔσται — «по мне не будет»."
  11: "ἐγὼ ὁ θεός, καὶ οὐκ ἔστιν πάρεξ ἐμοῦ σῴζων — «Аз Бог, и несть разве мене спасаяй» (πάρεξ — «кроме»). Стих предельно краткий, поэтому и в японском две короткие клаузы."
  12: "ἀνήγγειλα καὶ ἔσωσα — «Аз возвестих и спасох»; ὠνείδισα — «укорих» (ὀνειδίζω — укорять, обличать); οὐκ ἦν ἐν ὑμῖν ἀλλότριος — «не бе в вас чуждий», т. е. не было среди вас чужого [бога]; ὑμεῖς ἐμοὶ μάρτυρες — «вы мне свидетелие». Слова «говорит Господь Бог» — вне кавычек, внутри речи."
  13: "ἔτι ἀπ᾽ ἀρχῆς — «еще от начала», т. е. «от начала Я тот же» (в ru «от начала дней Я Тот же» — по МТ); καὶ οὐκ ἔστιν ὁ ἐκ τῶν χειρῶν μου ἐξαιρούμενος — «несть изимаяй от руку моею» (ἐξαιρέω — вырывать, избавлять); ποιήσω, καὶ τίς ἀποστρέψει αὐτό — «сотворю, и кто отвратит е». Здесь закрывается речь 43:1–13."
  14: "ὁ λυτρούμενος ὑμᾶς ὁ ἅγιος Ισραηλ — «избавляяй вас, святый израилев»; ἕνεκεν ὑμῶν ἀποστελῶ εἰς Βαβυλῶνα — «вас ради послю в Вавилон»; ἐπεγερῶ πάντας φεύγοντας — «воздвигну вся бежащыя»; Χαλδαῖοι ἐν πλοίοις δεθήσονται — «халдее в кораблех свяжутся»: по LXX и слав.; в ru «сокрушил все запоры и Халдеев, величавшихся кораблями» — по МТ, не внесено."
  15: "ἐγὼ κύριος ὁ θεὸς ὁ ἅγιος ὑμῶν — «Аз Господь Бог святый ваш»; ὁ καταδείξας Ισραηλ βασιλέα ὑμῶν — «показавый Израиля царя вашего», т. е. Тот, кто дал Израилю царя (καταδείκνυμι — показывать, являть)."
  16: "οὕτως λέγει κύριος ὁ διδοὺς ὁδὸν ἐν θαλάσσῃ — «сице глаголет Господь, даяй путь по морю»; ἐν ὕδατι ἰσχυρῷ τρίβον — «по воде сильне стезю». Формула с причастными оборотами (16–17) — вне кавычек, речь открывается с 43:18."
  17: "ὁ ἐξαγαγὼν ἅρματα καὶ ἵππον καὶ ὄχλον ἰσχυρόν — «изводяй колесницы и кони и народ силен»; ἐκοιμήθησαν καὶ οὐκ ἀναστήσονται — «успоша и не востанут»; ἐσβέσθησαν ὡς λίνον ἐσβεσμένον — «угасоша аки лен угашен» (λίνον — лён, фитиль; 灯心, как в 42:3)."
  18: "Μὴ μνημονεύετε τὰ πρῶτα — «не поминайте первых»; τὰ ἀρχαῖα μὴ συλλογίζεσθε — «ветхих не помышляйте» (συλλογίζομαι — размышлять, взвешивать)."
  19: "ἰδοὺ ποιῶ καινά — «се, Аз творю новая»; ἃ νῦν ἀνατελεῖ — «яже ныне возсияют» (ἀνατέλλω — восходить, произрастать; 芽生える); καὶ γνώσεσθε αὐτά — «и увесте я». ἐν τῇ ἐρήμῳ ὁδόν — «в пустыни путь»; ἐν τῇ ἀνύδρῳ ποταμούς — «в безводней реки» (ἄνυδρος — безводный)."
  20: "εὐλογήσει με τὰ θηρία τοῦ ἀγροῦ — «возблагословят мя зверие селнии»; σειρῆνες — «сирини»: σειρήν — сирена; в LXX так передано евр. слово о пустынных зверях (в ru «шакалы» — по МТ), поэтому в тексте транслитерация セイレーン; θυγατέρες στρουθῶν — «дщери струфовы», т. е. страусята (στρουθός — страус; в ru «страусы»). ποτίσαι τὸ γένος μου τὸ ἐκλεκτόν — «напоити род мой избранный»."
  21: "λαόν μου, ὃν περιεποιησάμην — «люди моя, яже снабдех» (περιποιέομαι — приобретать, сохранять; 得る); τὰς ἀρετάς μου διηγεῖσθαι — «добродетели моя поведати»: ἀρετή здесь «хвала, слава» (誉れ), как в 42:8, 42:12."
  22: "οὐ νῦν ἐκάλεσά σε, Ιακωβ — «не ныне призвах тебе, Иакове»; οὐδὲ κοπιᾶσαί σε ἐποίησα — «ниже трудитися сотворих тя» (κοπιάω — трудиться до усталости). Гр. буквально: «не Я призвал тебя… не Я заставил тебя трудиться»; в ru по МТ «А ты, Иаков, не взывал ко Мне; ты, Израиль, не трудился для Меня» — иное чтение, не внесено."
  23: "οὐκ ἐμοὶ πρόβατα τῆς ὁλοκαρπώσεώς σου — «не принесл еси мне овец твоих всесожжения твоего», букв. «не Мне [были] овцы всесожжения твоего»; οὐδὲ ἐν ταῖς θυσίαις σου ἐδόξασάς με — «ни в жертвах твоих прославил мя еси»; οὐδὲ ἔγκοπον ἐποίησά σε ἐν λιβάνῳ — «ниже утруждена сотворих тя в ливане»: λίβανος — ладан (香), не гора Ливан; ἔγκοπος — утруждённый."
  24: "οὐδὲ ἐκτήσω μοι ἀργυρίου θυμίαμα — «не купил еси мне на сребро фимиама» (κτάομαι — приобретать; θυμίαμα — фимиам, 香); τὸ στέαρ τῶν θυσιῶν σου ἐπεθύμησα — «тука треб твоих возжелах» (στέαρ — тук, жир; 脂肪). ἐν ταῖς ἁμαρτίαις σου… προέστην σου — «во гресех твоих стал еси предо мною»: гр. προέστην допускает и «Я предстал пред тобою», слав. читает «ты стал»; в ru по МТ «ты грехами твоими затруднял Меня» — не внесено."
  25: "ἐγώ εἰμι ἐγώ εἰμι ὁ ἐξαλείφων τὰς ἀνομίας σου — «Аз есмь, Аз есмь заглаждаяй беззакония твоя» (ἐξαλείφω — стирать, изглаживать; ぬぐい去る); καὶ οὐ μὴ μνησθήσομαι — «и не помяну». Слав. добавляет «мене ради» (ради Меня) — в LXX нет (по МТ «ради Себя Самого»), по паритету внесено (わたし自身のために)."
  26: "σὺ δὲ μνήσθητι καὶ κριθῶμεν — «ты же помяни, и да судимся» (κρίνω в страд. «судиться»); λέγε σὺ τὰς ἀνομίας σου πρῶτος — «глаголи ты беззакония твоя прежде»; ἵνα δικαιωθῇς — «да оправдишися», т. е. чтобы оказаться правым в тяжбе."
  27: "οἱ πατέρες ὑμῶν πρῶτοι — «отцы ваши первии»; οἱ ἄρχοντες αὐτῶν ἠνόμησαν εἰς ἐμέ — «князи ваши беззаконноваша на мя»: в гр. «их» (αὐτῶν), в слав. «ваши»; в тексте 彼らの. ἀνομέω — «беззаконновать»."
  28: "ἐμίαναν οἱ ἄρχοντες τὰ ἅγιά μου — «оскверниша князи святая моя» (μιαίνω — осквернять); ἔδωκα ἀπολέσαι Ιακωβ καὶ Ισραηλ εἰς ὀνειδισμόν — «дах погубити Иакова и Израиля во укоризну» (ὀνειδισμός — поношение, そしり). Здесь закрывается речь 43:22–28."
