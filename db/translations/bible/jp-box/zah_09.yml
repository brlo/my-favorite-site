# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной (совпадает с gr: 17 стихов).
# Язык — современный 常体; 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1–8 слово Господа на землю Хадрах (Седорах), Дамаск, Емаф, Тир, Сидон,
# Аскалон, Газа, Екрон, Азот; суд над Финикией и Филистией, «кровь из уст», остаток
# Богу; 9–10 «ликуй, дщерь Сиона», Царь кроткий на осле, мир народам, владычество
# от моря до моря; 11–13 кровь завета, узники из рва, «воздам вдвойне», Иуда — лук,
# Ефрем — стрела, сыны Сиона против сынов Греции; 14–17 явление Господа, труба,
# защита, спасение как овец, «святые камни», хлеб и вино.
# Голоса: 1–5 пророческое описание (без кавычек); 6–8 слово Господа в 「…»;
# 9–13 слово Господа в 「…» (9–10 Царь и мир, 11–13 узники и лук); 14–17 описание.
# Термины: 嗣業[しぎょう] — κληρονομία; 契約[けいやく] — διαθήκη; 柔和[にゅうわ] —
