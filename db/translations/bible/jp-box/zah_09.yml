tr_code: jp-box
book: zah
chapter: 9
draft: true

verses:
  1: "主[しゅ]の言葉[ことば]の重[おも]み。セドラクの地[ち]とダマスコに、その犠牲[ぎせい]がある。主[しゅ]は人[ひと]々[びと]と、イスラエルのすべての部族[ぶぞく]に目[め]を注[そそ]がれるからである。"
  2: "また、その境[さかい]にあるエマト、ツロとシドンにも。彼らはきわめて知恵[ちえ]深[ぶか]くなったからである。"
  3: "ツロは自分[じぶん]のために砦[とりで]を築[きず]き、銀[ぎん]を塵[ちり]のように、金[きん]を通[とお]り道[みち]の泥[どろ]のように蓄[たくわ]えた。"
  4: "見[み]よ、主[しゅ]はこれを嗣業[しぎょう]として取[と]り、その力[ちから]を海[うみ]に打[う]ち込[こ]み、これは火[ひ]で焼[や]き尽[つ]くされる。"
  5: "アスカロンはこれを見[み]て恐[おそ]れ、ガザも大[おお]いに苦[くる]しみ、エクロンも、その望[のぞ]みが辱[はずかし]められたゆえに苦[くる]しむ。ガザからは王[おう]が滅[ほろ]び、アスカロンにはだれも住[す]まなくなる。"
  6: "「アゾトには他[た]の民[たみ]が住[す]む。わたしはペリシテ人[じん]の誇[ほこ]りを滅[ほろ]ぼす。"
  7: "わたしは彼らの口[くち]から血[ち]を、その歯[は]の間[あいだ]から忌[いま]わしいものを取[と]り除[のぞ]く。彼もまたわたしたちの神[かみ]のものとなり、ユダでは千人[せんにん]の長[ちょう]のようになり、エクロンはエブス人[じん]のようになる。"
  8: "わたしはわたしの家[いえ]に、行[い]き来[き]する者[もの]を防[ふせ]ぐ砦[とりで]を置[お]く。もはや圧[あっ]迫[ぱく]する者[もの]が彼らに臨[のぞ]むことはない。わたしが今[いま]、わが目[め]で見[み]ているからである。」"
  9: "「シオンの娘[むすめ]よ、大[おお]いに喜[よろこ]べ。エルサレムの娘[むすめ]よ、叫[さけ]べ。見[み]よ、あなたの王[おう]があなたのもとに来[く]る。正[ただ]しく、救[すく]いをもたらす者[もの]、柔和[にゅうわ]な者[もの]、雌[め]ろばと、その若[わか]い子[こ]ろばに乗[の]って。」"
  10: "「わたしはエフライムから戦車[せんしゃ]を、エルサレムから馬[うま]を滅[ほろ]ぼし、戦[いくさ]の弓[ゆみ]を断[た]つ。また、諸国民[しょこくみん]から多[おお]くの者[もの]が来[き]て、平和[へいわ]がある。その支配[しはい]は海[うみ]から海[うみ]まで、川[かわ]から地[ち]の果[は]てまで及[およ]ぶ。」"
  11: "「あなたについては、あなたの契約[けいやく]の血[ち]によって、わたしはあなたの囚[とら]われ人[びと]を、水[みず]のない穴[あな]から放[はな]つ。"
  12: "集[つど]いの囚[とら]われ人[びと]よ、砦[とりで]に座[すわ]れ。今日[きょう]、わたしは告[つ]げる。あなたの寄留[きりゅう]の一日[いちにち]の代[かわ]りに、わたしはあなたに二倍[にばい]を返[かえ]す、と。"
  13: "わたしはユダをわたしのために弓[ゆみ]として引[ひ]き、エフライムを矢[や]として満[み]たす。シオンよ、わたしはあなたの子[こ]らをギリシア人[じん]の子[こ]らに向[む]かって立[た]たせ、あなたを戦士[せんし]の剣[つるぎ]とする。」"
  14: "主[しゅ]は彼らの上[うえ]に現[あらわ]れ、その矢[や]は稲妻[いなずま]のように飛[と]び出[で]る。主[しゅ]なる神[かみ]は角笛[つのぶえ]を吹[ふ]き鳴[な]らし、その威[い]嚇[かく]の響[ひび]きのうちに進[すす]まれる。"
  15: "万軍[ばんぐん]の主[しゅ]は彼らを守[まも]られる。彼らは敵[てき]を食[く]らい尽[つ]くし、投[な]げ石[いし]で敵[てき]を埋[うず]め尽[つ]くす。彼らはその血[ち]をぶどう酒[しゅ]のように飲[の]み、鉢[はち]のように、祭壇[さいだん]を満[み]たす。"
  16: "その日[ひ]、彼らの神[かみ]である主[しゅ]は彼らを羊[ひつじ]のように救[すく]われる。聖[せい]なる石[いし]がその地[ち]の上[うえ]を転[ころ]がるからである。"
  17: "なんと大[おお]きいことか、その恵[めぐ]みは。なんと美[うつく]しいことか、その輝[かがや]きは。若者[わかもの]には穀物[こくもつ]、乙女[おとめ]たちには香[かお]り高[たか]いぶどう酒[しゅ]を与[あた]える。"

notes:
  1: "Λῆμμα λόγου κυρίου — «пророческое слово Господа» (重み — «бремя»); ἐν γῇ Σεδραχ καὶ Δαμασκοῦ θυσία αὐτοῦ — тёмное: «в земле Седорах и Дамаска жертва Его» (слав. так же); θυσία — «жертва». ἐφορᾷ ἀνθρώπους — «призирает на людей»."
  2: "Εμαθ ἐν τοῖς ὁρίοις αὐτῆς — «Емаф в пределах её»; ἐφρόνησαν σφόδρα — «умудрились весьма»."
  3: "ᾠκοδόμησεν ὀχυρώματα — «построил твердыни»; ὡς χοῦν — «как прах (пыль)»; ὡς πηλὸν ὁδῶν — «как грязь дорог»."
  4: "κληρονομήσει αὐτήν — «возьмёт её в наследие» (слав. «наследит я»; в ru «сделает бедным» — МТ, не внесено); πατάξει εἰς θάλασσαν δύναμιν — «поразит в море силу»."
  5: "ὄψεται Ἀσκαλών — «увидит Аскалон»; ὀδυνηθήσεται σφόδρα — «восскорбит весьма»; ᾐσχύνθη ἐπὶ τῷ παραπτώματι — «посрамилась о падении (надежде)»."
  6: "ἀλλογενεῖς ἐν Ἀζώτῳ — «иноплеменники в Азоте»; ὕβριν ἀλλοφύλων — «высокомерие иноплеменников (филистимлян)»."
  7: "ἐξαρῶ τὸ αἷμα… ἐκ στόματος — «изъял кровь из уст»; βδελύγματα — «мерзости»; χιλίαρχος — «тысяченачальник»; Ιεβουσαῖος — «иевусей»."
  8: "ἀνάστημα τοῦ μὴ διαπορεύεσθαι — «воздвижение (защита), чтобы не проходили»; ἐξελαύνων — «изгоняющий, теснящий»; ἑώρακα ἐν τοῖς ὀφθαλμοῖς μου — «увидел очами Моими»."
  9: "Χαῖρε σφόδρα — «радуйся весьма»; κήρυσσε — «проповедуй, взывай»; πραὺς — «кроткий» (柔和); ὑποζύγιον καὶ πῶλον νέον — «вьючное животное и молодого осла» (雌ろばと子ろば)."
  10: "ἐξολεθρεύσει ἅρματα ἐξ Εφραιμ — «истребит колесницы у Ефрема»; τόξον πολεμικόν — «лук воинский»; κατάρξει ὑδάτων — «будет владычествовать над водами»; διεκβολὰς γῆς — «исходы (концы) земли»."
  11: "ἐν αἵματι διαθήκης — «кровью завета»; δεσμίους — «узников»; λάκκος οὐκ ἔχων ὕδωρ — «ров без воды»."
  12: "καθήσεσθε ἐν ὀχυρώματι — «сядете в твердыне» (слав.; в ru «возвращайтесь» — МТ); δέσμιοι τῆς συναγωγῆς — «узники собрания»; ἀντὶ μιᾶς ἡμέρας παροικεσίας — «за один день странствования»; διπλᾶ — «вдвойне»."
  13: "ἐνέτεινά σε… τόξον — «натянул тебя, как лук»; ἐπεγερῶ τὰ τέκνα σου — «воздвигну детей твоих»; ἐπὶ τὰ τέκνα τῶν Ἑλλήνων — «на детей Греции (эллинов)» (слав.; в ru «Иония» — МТ, не внесено); ῥομφαία μαχητοῦ — «меч воина»."
  14: "ἔσται ἐπ' αὐτοὺς — «явится над ними»; ὡς ἀστραπὴ βολίς — «как молния стрела»; ἐν σάλῳ ἀπειλῆς — «в шуме угрозы» (слав.; в ru «в бурях полуденных» — МТ)."
  15: "ὑπερασπιεῖ — «защитит»; καταχώσουσιν ἐν λίθοις σφενδόνης — «засыплют камнями пращи»; ἐκπίονται αὐτοὺς ὡς οἶνον — «выпьют их как вино» (слав. добавляет «кровь их»); φιάλας — «чаши»."
  16: "σώσει… ὡς πρόβατα — «спасёт… как овец»; λίθοι ἅγιοι κυλίονται — «святые камни катятся» (слав.; в ru «подобно камням в венце, воссияют» — МТ, не внесено)."
  17: "εἴ τι ἀγαθὸν αὐτοῦ — «что благо Его»; σῖτος νεανίσκοις — «хлеб (пшеница) юношам»; οἶνος εὐωδιάζων εἰς παρθένους — «вино благоухающее девам»."
