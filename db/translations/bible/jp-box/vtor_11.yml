verses:
  1: "「あなたはあなたの神[かみ]である主[しゅ]を愛[あい]し、その守[まも]るべきことと、その定[さだ]めと、その裁[さば]きをすべて、日々[ひび]守[まも]りなさい。"
  2: "今日[きょう]、あなたがたは知[し]りなさい。あなたがたの子[こ]らではない。彼[かれ]らはあなたがたの神[かみ]である主[しゅ]の訓練[くんれん]も、その大[おお]いなること、強[つよ]い手[て]、高[たか]く掲[かか]げられた腕[うで]も知[し]らず、見[み]てもいない。"
  3: "すなわち、主[しゅ]がエジプトのただ中[なか]で、ファラオ、エジプトの王[おう]とその全[ぜん]土[ど]に行[おこな]われた主[しゅ]のしるしと奇跡[きせき]、"
  4: "また、あなたがたの後[うし]ろから追[お]いかけてきたエジプトの軍勢[ぐんぜい]、その戦車[せんしゃ]と馬[うま]に主[しゅ]がなさったこと、すなわち、彼[かれ]らが追[お]ってくるとき、主[しゅ]が紅海[こうかい]の水[みず]で彼[かれ]らを覆[おお]い、今日[きょう]に至[いた]るまで滅[ほろ]ぼし尽[つ]くされたこと、"
  5: "また、あなたがたがこの場所[ばしょ]に来[く]るまで、主[しゅ]が荒[あ]れ野[の]であなたがたになさったこと、"
  6: "また、ルベンの子[こ]エリアブの子[こ]らであるダタンとアビロンに主[しゅ]がなさったこと、すなわち、地[ち]がその口[くち]を開[ひら]いて、イスラエル全体[ぜんたい]のただ中[なか]で、彼[かれ]らとその家[いえ]、その天幕[てんまく]、彼[かれ]らとともにあったすべての財産[ざいさん]を飲[の]み込[こ]んだこと、"
  7: "あなたがたの目[め]が、主[しゅ]があなたがたになさったすべての大[おお]きな業[わざ]を見[み]たからである。"
  8: "あなたがたは、わたしが今日[きょう]あなたがたに命[めい]じるすべての戒[いまし]めを守[まも]りなさい。そうすれば、あなたがたは生[い]き、多[おお]くの人[ひと]となり、あなたがたが渡[わた]って行[ゆ]き、嗣業[しぎょう]として受[う]け継[つ]ぐ地[ち]に入[はい]って、それを嗣業[しぎょう]として受[う]け継[つ]ぐであろう。"
  9: "また、主[しゅ]があなたがたの父[ちち]たちとその後の裔[すえ]に与[あた]えると誓[ちか]われた地[ち]、乳[ちち]と蜜[みつ]の流[なが]れる地[ち]で、あなたがたは長[なが]く生[い]きるであろう。"
  10: "あなたがたが入[はい]って行[ゆ]き、嗣業[しぎょう]として受[う]け継[つ]ぐ地[ち]は、あなたがたが出[で]てきたエジプトの地[ち]のようではない。あそこでは、種[たね]をまいても、野菜[やさい]の園[その]のように、足[あし]で水[みず]を引[ひ]いて灌漑[かんがい]した。"
  11: "しかし、あなたがたが渡[わた]って行[ゆ]き、嗣業[しぎょう]として受[う]け継[つ]ぐ地[ち]は、山[やま]と平野[へいや]のある地[ち]であり、天[てん]の雨[あめ]の水[みず]を飲[の]む。"
  12: "それは、あなたの神[かみ]である主[しゅ]が顧[かえり]みを向[む]ける地[ち]である。あなたの神[かみ]である主[しゅ]の目[め]は、年[とし]の初[はじ]めから年[とし]の終[お]わりまで、絶[た]えずそこに注[そそ]がれている。"
  13: "もし、わたしが今日[きょう]あなたがたに命[めい]じるすべての戒[いまし]めをよく聞[き]き、あなたがたの神[かみ]である主[しゅ]を愛[あい]し、心[こころ]を尽[つ]くし、魂[たましい]を尽[つ]くして主[しゅ]に仕[つか]えるなら、"
  14: "主[しゅ]はあなたがたの地[ち]に、時[とき]にかなった初[はつ]めの雨[あめ]と後[のち]の雨[あめ]を与[あた]え、あなたはあなたの穀物[こくもつ]、ぶどう酒[しゅ]、油[あぶら]を取[と]り入[い]れるであろう。"
  15: "また、あなたの野[の]の家畜[かちく]に草[くさ]を与[あた]えられる。あなたは食[た]べて満[み]ち足[た]りるであろう。"
  16: "あなたがたは自分[じぶん]に気[き]をつけなさい。心[こころ]が高[たか]ぶって、あなたがたが背[そむ]き、ほかの神々[かみがみ]に仕[つか]え、それらにひれ伏[ふ]すことのないように。"
  17: "そうなれば、主[しゅ]の怒[いか]りがあなたがたに対して燃[も]え、主[しゅ]が天[てん]を閉[と]ざされ、雨[あめ]が降[ふ]らず、地[ち]がその実[み]を結[むす]ばなくなり、あなたがたは、主[しゅ]があなたがたに与[あた]えられた良[よ]い地[ち]から速[すみ]やかに滅[ほろ]びるであろう。"
  18: "あなたがたはこれらの言葉[ことば]を心[こころ]と魂[たましい]に置[お]きなさい。また、それを手[て]のしるしとして結[むす]びつけなさい。それはあなたがたの目[め]の前[まえ]にあって揺[ゆ]るがないものとなる。"
  19: "また、あなたがたはそれを子[こ]どもたちに教[おし]えて語[かた]らせ、家[いえ]に座[すわ]っているときも、道[みち]を歩[ある]いているときも、寝[ね]るときも、起[お]きるときも、それを語[かた]りなさい。"
  20: "また、それをあなたがたの家[いえ]の門柱[もんちゅう]と門[もん]に書[か]きなさい。"
  21: "そうすれば、あなたがたの日[ひ]と、あなたがたの子[こ]らの日[ひ]は、主[しゅ]があなたがたの父[ちち]たちに与[あた]えると誓[ちか]われた地[ち]で、天[てん]が地[ち]の上[うえ]にある日[ひ]のように、長[なが]く続[つづ]くであろう。"
  22: "もし、わたしが今日[きょう]あなたがたに命[めい]じるすべての戒[いまし]めを守[まも]って行[おこな]い、あなたがたの神[かみ]である主[しゅ]を愛[あい]し、そのすべての道[みち]を歩[あゆ]み、主[しゅ]に寄[よ]り添[そ]うなら、"
  23: "主[しゅ]はこれらの民[たみ]をすべて、あなたがたの前[まえ]から追[お]い出[だ]し、あなたがたはあなたがたよりも大[おお]きく強[つよ]いもろもろの民[たみ]を嗣業[しぎょう]として受[う]け継[つ]ぐであろう。"
  24: "あなたがたの足[あし]の裏[うら]が踏[ふ]むすべての場所[ばしょ]は、あなたがたのものとなる。あなたがたの国境[こっきょう]は、荒[あ]れ野[の]から、アンティレバノンから、大[おお]きな川[かわ]、すなわちユーフラテス川[がわ]から、西[にし]の海[うみ]までとなる。"
  25: "あなたがたの前[まえ]に立[た]ち向[む]かえる者[もの]はない。あなたがたの神[かみ]である主[しゅ]は、あなたがたが踏[ふ]み入[い]るすべての地[ち]の面[おもて]に、あなたがたへの恐[おそ]れと怯[おび]えを置[お]かれる。主[しゅ]があなたがたに語[かた]られたとおりである。"
  26: "見[み]よ、今日[きょう]、わたしはあなたがたの前[まえ]に祝福[しゅくふく]と呪[のろ]いを並[なら]べ置[お]く。"
  27: "祝福[しゅくふく]は、あなたがたが、わたしが今日[きょう]あなたがたに命[めい]じるあなたがたの神[かみ]である主[しゅ]の戒[いまし]めに聞[き]き従[したが]う場合にあり、"
  28: "呪[のろ]いは、あなたがたがあなたがたの神[かみ]である主[しゅ]の戒[いまし]めに聞[き]き従[したが]わず、わたしが今日[きょう]あなたがたに命[めい]じる道[みち]から外[はず]れ、あなたがたが知[し]らないほかの神々[かみがみ]に従[したが]って行[ゆ]く場合にある。"
  29: "主[しゅ]があなたを、あなたが渡[わた]って行[ゆ]き、嗣業[しぎょう]として受[う]け継[つ]ぐ地[ち]に導[みちび]き入[い]れられるとき、あなたは祝福[しゅくふく]をゲリジム山[やま]の上[うえ]に、呪[のろ]いをエバル山[やま]の上[うえ]に置[お]かなければならない。"
  30: "それは、ヨルダン川[がわ]の向[む]こう側[がわ]、日[ひ]の沈[しず]む西[にし]への道[みち]の後[うし]ろ、カナン人[じん]の地[ち]、西[にし]に住[す]む者[もの]たちの間[あいだ]、ゴルゴルに近[ちか]い高[たか]い樫[かし]の木[き]のそばにあるではないか。"
  31: "あなたがたはヨルダン川[がわ]を渡[わた]って、あなたがたの神[かみ]である主[しゅ]が日々[ひび]あなたがたに嗣業[しぎょう]として与[あた]えられる地[ち]に入[はい]り、それを嗣業[しぎょう]として受[う]け継[つ]いで、そこに住[す]むであろう。"
  32: "あなたがたは、わたしが今日[きょう]あなたがたの前[まえ]に置[お]くすべての定[さだ]めと裁[さば]きを守[まも]って行[おこな]いなさい。」"

notes:
  1: "ἀγαπήσεις — возлюбишь. φυλάξῃ τὰ φυλάγματα — будешь хранить хранимое (φύλαγμα — «то, что должно соблюдать»). δικαιώματα, κρίσεις — постановления и суды. πάσας τὰς ἡμέρας — во все дни."
  2: "γνώσεσθε — познайте. οὐχὶ τὰ παιδία ὑμῶν — не дети ваши (анаколуф: далее перечисление того, что видели отцы). ὅσοι οὐκ οἴδασιν οὐδὲ εἴδοσαν — которые не знают и не видели. παιδεία κυρίου — наставление, воспитание Господне."
  3: "τὰ σημεῖα καὶ τὰ τέρατα — знамения и чудеса. ἐν μέσῳ Αἰγύπτου — среди Египта. Φαραω βασιλεῖ — фараону царю (датив). πάσῃ τῇ γῇ αὐτοῦ — всей земле его."
  4: "τὴν δύναμιν τῶν Αἰγυπτίων — силу египтян. ἅρματα καὶ ἵππον — колесницы и конницу. ἐπέκλυσεν τὸ ὕδωρ — покрыла вода. θαλάσσης τῆς ἐρυθρᾶς — моря Чермного. καταδιωκόντων αὐτῶν — когда они гнались. ἀπώλεσεν — погубил."
  5: "ὅσα ἐποίησεν ὑμῖν ἐν τῇ ἐρήμῳ — что сделал вам в пустыне."
  6: "Δαθαν καὶ Αβιρων υἱοῖς Ελιαβ υἱοῦ Ρουβην — Дафану и Авирону, сынам Елиава, сына Рувимова. ἀνοίξασα τὸ στόμα — открыв уста. κατέπιεν — поглотила. ὑπόστασιν — имущество, состояние."
  7: "οἱ ὀφθαλμοὶ ὑμῶν ἑώρακαν — глаза ваши видели. τὰ ἔργα κυρίου τὰ μεγάλα — великие дела Господни."
  8: "φυλάξεσθε — соблюдайте. ἵνα ζῆτε καὶ πολυπλασιασθῆτε — чтобы жить и умножиться. διαβαίνετε τὸν Ιορδάνην — переходите Иордан. κληρονομῆσαι αὐτήν — наследовать её."
  9: "μακροημερεύσητε — долго проживёте (μακροημερεύω). γῆν ῥέουσαν γάλα καὶ μέλι — землю, текущую молоком и мёдом."
  10: "οὐχ ὥσπερ ἡ γῆ Αἰγύπτου — не как земля Египетская. ὅθεν ἐκπεπόρευσθε — откуда вышли. σπείρωσιν τὸν σπόρον — сеют семя. ποτίζωσιν τοῖς ποσίν — поливают ногами (водочерпалка). ὡσεὶ κῆπον λαχανείας — как огород овощей."
  11: "γῆ ὀρεινὴ καὶ πεδινή — земля гористая и равнинная (πεδινός — «равнинный»). ἐκ τοῦ ὑετοῦ τοῦ οὐρανοῦ πίεται ὕδωρ — от дождя небесного пьёт воду."
  12: "ἐπισκοπεῖται αὐτήν — посещает, печётся о ней (ἐπισκοπέω). διὰ παντός — непрестанно. ἀπ᾽ ἀρχῆς τοῦ ἐνιαυτοῦ καὶ ἕως συντελείας — от начала года и до конца года."
  13: "Ἐὰν δὲ ἀκοῇ εἰσακούσητε — если слухом послушаете (усиление). ἀγαπᾶν… λατρεύειν — любить… служить (инфинитивы при εἰσακούσητε). ἐξ ὅλης τῆς καρδίας… ψυχῆς — от всего сердца и всей души."
  14: "τὸν ὑετὸν… πρώιμον καὶ ὄψιμον — дождь ранний и поздний. καθ᾽ ὥραν — в своё время. εἰσοίσεις — внесёшь, соберёшь. σῖτον, οἶνον, ἔλαιον — хлеб, вино, елей."
  15: "χορτάσματα — корм, трава. κτήνεσίν σου — скоту твоему. φαγὼν καὶ ἐμπλησθεὶς — поел и насытился (в gr конец стиха; слав. переносит в начало 16)."
  16: "πρόσεχε σεαυτῷ — внимай себе. μὴ πλατυνθῇ ἡ καρδία σου — как бы не расширилось сердце твоё (πλατύνω — «расширять», о гордости). παραβῆτε — преступите. προσκυνήσητε — поклонитесь."
  17: "θυμωθεὶς ὀργῇ — воспламенившись гневом. συσχῇ τὸν οὐρανόν — заключит небо (συνέχω). οὐκ ἔσται ὑετός — не будет дождя. τὸν καρπὸν αὐτῆς — плод её. ἐν τάχει — быстро."
  18: "ἐμβαλεῖτε εἰς τὴν καρδίαν — положите в сердце. ἀφάψετε εἰς σημεῖον ἐπὶ τῆς χειρός — привяжете в знак на руку (ἅπτω — «прикреплять»). ἀσάλευτον — непоколебимое. πρὸ ὀφθαλμῶν — пред глазами."
  19: "διδάξετε… λαλεῖν — научите говорить. καθημένους ἐν οἴκῳ — сидя в доме. πορευομένους ἐν ὁδῷ — идя в пути. κοιταζομένους καὶ διανισταμένους — ложась и вставая."
  20: "φλιάς — косяки, дверные столбы. πύλας — ворота."
  21: "πολυημερεύσητε — много дней проживёте. αἱ ἡμέραι τῶν υἱῶν ὑμῶν — дни сынов ваших. καθὼς αἱ ἡμέραι τοῦ οὐρανοῦ ἐπὶ τῆς γῆς — как дни неба над землёй."
  22: "ἀκοῇ ἀκούσητε — слухом услышите. ποιεῖν — исполнять. ἀγαπᾶν κύριον τὸν θεὸν ἡμῶν — любить Господа Бога нашего (в базе ἡμῶν, слав. «вашего»). προσκολλᾶσθαι αὐτῷ — прилепляться к Нему."
  23: "ἐκβαλεῖ κύριος — изгонит Господь. κληρονομήσετε ἔθνη — наследуете народы. ἰσχυρότερα μᾶλλον ἢ ὑμεῖς — сильнее вас."
  24: "οὗ ἐὰν πατήσῃ τὸ ἴχνος τοῦ ποδός — куда ступит след ноги. Ἀντιλιβάνου — Антиливана (слав. «антиливана»; Синодальный «Ливана»). ποταμοῦ Εὐφράτου — реки Евфрата. θάλασσα ἡ ἐπὶ δυσμῶν — море на западе."
  25: "οὐκ ἀντιστήσεται οὐδείς — никто не противостанет. τὸν τρόμον ὑμῶν καὶ τὸν φόβον ὑμῶν — трепет ваш и страх ваш (страх перед вами). ἐπιθήσει — возложит. ὃν τρόπον — как."
  26: "δίδωμι ἐνώπιον ὑμῶν — даю пред вами. εὐλογίαν καὶ κατάραν — благословение и проклятие."
  27: "τὴν εὐλογίαν, ἐὰν ἀκούσητε — благословение, если послушаете (винительный продолжает 26). ἃς ἐγὼ ἐντέλλομαι — которые я заповедую."
  28: "τὰς κατάρας — проклятия (мн. ч.). ἐὰν μὴ ἀκούσητε — если не послушаете. πλανηθῆτε ἀπὸ τῆς ὁδοῦ — совратитесь с пути. πορευθέντες λατρεύειν — пойдя служить. οὓς οὐκ οἴδατε — которых не знаете."
  29: "εἰσαγάγῃ σε — введёт тебя. διαβαίνεις ἐκεῖ κληρονομῆσαι — переходишь, чтобы наследовать. ὄρος Γαριζιν — гора Гаризим (ゲリジム山). ὄρος Γαιβαλ — гора Гевал (エバル山)."
  30: "πέραν τοῦ Ιορδάνου — за Иорданом. ὀπίσω ὁδὸν δυσμῶν ἡλίου — позади пути к западу солнца. τὸ κατοικοῦν ἐπὶ δυσμῶν — живущее на западе. ἐχόμενον τοῦ Γολγολ — близ Голгола. δρυὸς τῆς ὑψηλῆς — высокого дуба. В базе стих в квадратных скобках, текст на месте."
  31: "ὑμεῖς γὰρ διαβαίνετε — ибо вы переходите. δίδωσιν ὑμῖν ἐν κλήρῳ πάσας τὰς ἡμέρας — даёт вам в удел во все дни. κατοικήσετε ἐν αὐτῇ — будете жить в ней."
  32: "φυλάξεσθε τοῦ ποιεῖν — храните, чтобы исполнять. προστάγματα καὶ κρίσεις — постановления и суды. ἃς ἐγὼ δίδωμι ἐνώπιον ὑμῶν — которые я даю пред вами."
