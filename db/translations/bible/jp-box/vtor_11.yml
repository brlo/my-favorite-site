# jp-box, Второзаконие, глава 11. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — csl-ru; ru — только для понимания.
# jp-joc в этой главе отсутствует.
# Глава 11: любовь и послушание (1), уроки Египта и пустыни (2–7),
# земля дождя и благословение (8–17), слова на руке и на дверях (18–21),
# условие обладания землёй (22–25), благословение и проклятие на горах (26–32).
# Речь Моисея — 「…」 (1–32); вложенных прямых речей нет, поэтому 『…』 не нужны.
# 〔…〕 нет: все стихи есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 燔祭, 祭壇, 安息日, 嗣業, 割礼 уже в корпусе; 門柱, 初めの雨 понятны.
# LXX-особенности: 11:2–7 — один длинный период с анаколуфом («не дети ваши…»),
# деление на стихи сохранено; 11:10 «поливали ногами» (водочерпалка); 11:14
# δώσει — 3-е л. ед. ч. («даст»), а не «дам»; 11:15 в gr заканчивается «ел и насытился»,
# а слав. переносит это в начало 16; 11:22 ἡμῶν — «Бога нашего» (слав. «вашего»);
# 11:30 в базе текст в квадратных скобках, но он есть — 〔…〕 не ставятся.
# Речь Моисея в файле открыта 「 в начале главы и закрыта 」 в конце: она продолжается
# и в следующей главе, поэтому кавычки балансируются внутри файла.
# jp-ni не использовался.

