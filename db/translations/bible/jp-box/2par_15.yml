# jp-box, 2-я Паралипоменон, глава 15. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc для книги нет,
# jp-ni (под авторским правом) не использовался.
# Язык — современный 常体 (в речи тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 15: пророчество Азарии (1–7), реформа Асы и завет (8–15),
# низложение Маахи, внесение святынь, мир до 35-го года (16–19).
# Речь Азарии — 「…」: открывается в 2, закрывается в 7. Красного нет.
# Нумерация по gr-lxx-byz: 19 стихов, совпадает с csl и ru; сдвига нет.
# Паритет: слав. чтения входят в основной текст без 〔…〕, вариант LXX — в notes
# (15:1 «дух Божий», 15:4 «в печали» и «взыщут», 15:6 «Господь», 15:8 «Азария»
# и «Иеровоам», 15:14 «в восклицании», 15:18 «святая своя»).
# 〔…〕 нет: текст всех стихов есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 神殿, 祭壇, 律法, 祭司, レビ人, 寄留者, 高い所, ラッパ уже
# в корпусе.
# jp-ni не использовался.

tr_code: jp-box
