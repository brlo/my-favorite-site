chapter: 15
draft: true

verses:
  1: "オデドの子[こ]アザリヤの上[うえ]に、神[かみ]の霊[れい]が臨[のぞ]んだ。"
  2: "彼[かれ]はアサと、ユダとベニヤミンのすべての者[もの]に会[あ]いに出[で]て、言[い]った。「アサと、ユダとベニヤミンのすべての者よ、わたしの言[ことば]を聞[き]きなさい。あなたがたが主[しゅ]とともにいるなら、主はあなたがたとともにいてくださる。あなたがたが主を求[もと]めるなら、主はあなたがたに見[み]いだされる。しかし、あなたがたが主を捨[す]てるなら、主もあなたがたを捨てられる。"
  3: "イスラエルには長[なが]い日[ひ]々[び]が、まことの神[かみ]もなく、教[おし]える祭司[さいし]もなく、律法[りっぽう]もないままに続[つづ]く。"
  4: "しかし、彼らが苦[くる]しみの中[なか]でイスラエルの神である主に立[た]ち返[かえ]り、主を求めるなら、主は彼らに見[み]いだされる。"
  5: "そのころには、外[そと]へ出[で]て行[ゆ]く者[もの]にも、内[うち]に入[はい]って来[く]る者にも平和[へいわ]はない。主[しゅ]への恐[おそ]れが、すべての国[くに]々[ぐに]に住[す]む者[もの]の上[うえ]に下[くだ]るからである。"
  6: "民[たみ]は民に、町[まち]は町に戦[たたか]いを仕掛[しか]ける。主[しゅ]が彼らを、あらゆる苦[くる]しみの中[なか]でかき乱[みだ]されるからである。"
  7: "あなたがたは強[つよ]くあれ。手[て]を弱[よわ]らせてはならない。あなたがたの働[はたら]きには報[むく]いがあるからである。」"
  8: "アサはこれらの言葉[ことば]と、預言者[よげんしゃ]アザリヤの預言[よげん]を聞[き]くと、力[ちから]を得[え]て、ユダとベニヤミンの全[ぜん]土[ど]、およびヤロブアムがエフライムの山地[さんち]で保[たも]っていた町々[まちまち]から、偶像[ぐうぞう]をすべて取[と]り除[のぞ]き、主の神殿[しんでん]の前[まえ]にある主の祭壇[さいだん]を聖別[せいべつ]した。"
  9: "彼はユダとベニヤミン、およびエフライム、マナセ、シメオンから彼のもとに寄留[きりゅう]している者[もの]たちを集[あつ]めた。彼が主とともにいるのを見[み]て、イスラエルから多[おお]くの者[もの]が彼に加[くわ]わったからである。"
  10: "彼らはアサの治世[ちせい]の第十五年[だいじゅうごねん]の三[みっ]月[つき]に、エルサレムに集[あつ]まった。"
  11: "そしてその日[ひ]、彼らは持[も]ち帰[かえ]った分捕[ぶんど]り物[もの]のうちから、主に牛[うし]七百頭[ななひゃくとう]と羊[ひつじ]七千匹[ななせんびき]を犠牲[ぎせい]としてささげた。"
  12: "そして、父祖[ふそ]の神である主を心[こころ]を尽[つ]くし、魂[たましい]を尽くして求める契約[けいやく]に入[はい]った。"
  13: "また、イスラエルの神[かみ]である主を求めない者[もの]はだれでも、若[わか]い者から年寄[としよ]りまで、男[おとこ]から女[おんな]まで、死[し]ななければならない、と定[さだ]めた。"
  14: "彼らは大[おお]きな声[こえ]と、ラッパと角笛[つのぶえ]をもって、叫[さけ]びながら主に誓[ちか]った。"
  15: "ユダはみな、この誓[ちかい]を喜[よろこ]んだ。彼らが魂[たましい]を尽くして誓い、すべての思[おも]いを尽くして主を求めたので、主は彼らに見[み]いだされ、周[まわ]りから彼らに安[やす]らぎを与[あた]えられた。"
  16: "彼は自分の母[はは]マアハを退[しりぞ]けて、アスタルテに仕[つか]えないようにし、その偶像[ぐうぞう]を砕[くだ]いて、ケドロンの谷川[たにがわ]で焼[や]いた。"
  17: "ただ、高[たか]い所[ところ]は取[と]り除[のぞ]かれず、なおイスラエルに残[のこ]っていた。しかし、アサの心[こころ]はそのすべての日[ひ]々[び]に全[まった]きものであった。"
  18: "彼は父[ちち]ダビデが聖別[せいべつ]したものと、自分[じぶん]が聖別したものを、銀[ぎん]と金[きん]、および器[うつわ]とともに神[かみ]の家[いえ]に運[はこ]び入[い]れた。"
  19: "アサの治世の第三十五年[だいさんじゅうごねん]まで、彼には戦[たたか]いがなかった。"

notes:
  1: "Αζαριας υἱὸς Ωδηδ — Азария, сын Одеда (Ωδηδ — オデド, как в 1 Пар 8:15; слав. «адад»); ἐγένετο ἐπ᾽ αὐτὸν πνεῦμα κυρίου — был на нём Дух Господень; слав. «дух Божий» (神の霊) — в тексте csl, вариант гр. отмечен здесь."
  2: "ἐξῆλθεν εἰς ἀπάντησιν Ασα — вышел навстречу Асе; καὶ παντὶ Ιουδα καὶ Βενιαμιν — и всему Иуде и Вениамину; κύριος μεθ᾽ ὑμῶν ἐν τῷ εἶναι ὑμᾶς μετ᾽ αὐτοῦ — Господь с вами, когда вы с Ним; ἐὰν ἐκζητήσητε αὐτόν, εὑρεθήσεται ὑμῖν — если взыщете Его, найдётся вам; ἐὰν ἐγκαταλίπητε αὐτόν, ἐγκαταλείψει ὑμᾶς — если оставите Его, оставит вас. Здесь открывается речь Азарии, закрывается в 15:7."
  3: "ἡμέραι πολλαὶ τῷ Ισραηλ — много дней Израилю; ἐν οὐ θεῷ ἀληθινῷ — без Бога истинного; οὐχ ἱερέως ὑποδεικνύοντος — без священника наставляющего (ὑποδείκνυμι); ἐν οὐ νόμῳ — без закона. Слав. вставляет «(будут)» в скобках — редакционная вставка, не внесена."
  4: "καὶ ἐπιστρέψει ἐπὶ κύριον θεὸν Ισραηλ, καὶ εὑρεθήσεται αὐτοῖς — и обратится к Господу Богу Израиля, и будет найден им. В гр. кратко; слав. добавляет «в печали» и «взыщут его» (как и МТ) — внесено (苦しみの中で…求めるなら)."
  5: "οὐκ ἔστιν εἰρήνη τῷ ἐκπορευομένῳ καὶ τῷ εἰσπορευομένῳ — нет мира выходящему и входящему; ὅτι ἔκστασις κυρίου ἐπὶ πάντας τοὺς κατοικοῦντας τὰς χώρας — ибо исступление (ужас) Господне на всех живущих в странах (χώρα)."
  6: "πολεμήσει ἔθνος πρὸς ἔθνος καὶ πόλις πρὸς πόλιν — будет воевать народ с народом и город с городом; ὅτι ὁ θεὸς ἐξέστησεν αὐτοὺς ἐν πάσῃ θλίψει — ибо Бог привёл их в смятение (ἐξίστημι) во всякой скорби; слав. «Господь смутит их» (主) — в тексте csl, вариант гр. отмечен здесь."
  7: "ἰσχύσατε — укрепитесь; μὴ ἐκλυέσθωσαν αἱ χεῖρες ὑμῶν — да не ослабеют руки ваши (ἐκλύομαι); ὅτι ἔστιν μισθὸς τῇ ἐργασίᾳ ὑμῶν — ибо есть награда труду вашему (μισθός, ἐργασία). Здесь речь Азарии закрывается."
  8: "τὴν προφητείαν Αδαδ τοῦ προφήτου — пророчество Адада пророка (Αδαδ — вероятно, искажение Ωδηδ); слав. «пророчество азарии пророка» (アザリヤ) — в тексте csl. τὰ βδελύγματα — мерзости (слав. «идолы»); ἀπὸ πάσης τῆς γῆς Ιουδα καὶ Βενιαμιν — из всей земли Иуды и Вениамина; ἀπὸ τῶν πόλεων, ὧν κατέσχεν ἐν ὄρει Εφραιμ — из городов, которые он захватил на горе Ефремовой; слав. добавляет «иеровоам» — внесено (ヤロブアム). ἐνεκαίνισεν τὸ θυσιαστήριον κυρίου — обновил жертвенник Господень; слав. «освяти» — в тексте csl (聖別した); ὃ ἦν ἔμπροσθεν τοῦ ναοῦ κυρίου — который был пред храмом Господним."
  9: "ἐξεκκλησίασεν — созвал собрание (ἐκκλησιάζω); τοὺς προσηλύτους τοὺς παροικοῦντας μετ᾽ αὐτοῦ — пришельцев, живущих с ним (προσήλυτος — 寄留者); ἀπὸ Εφραιμ καὶ ἀπὸ Μανασση καὶ ἀπὸ Συμεων — от Ефрема, Манассии и Симеона; ὅτι προσετέθησαν πρὸς αὐτὸν πολλοὶ τοῦ Ισραηλ — ибо присоединились к нему многие из Израиля; ἐν τῷ ἰδεῖν αὐτοὺς ὅτι κύριος ὁ θεὸς αὐτοῦ μετ᾽ αὐτοῦ — увидев, что Господь Бог его с ним. Слав. вставляет «(всего)» в скобках — не внесено."
  10: "συνήχθησαν εἰς Ιερουσαλημ — собрались в Иерусалим; ἐν τῷ μηνὶ τῷ τρίτῳ — в третий месяц; ἐν τῷ πεντεκαιδεκάτῳ ἔτει τῆς βασιλείας Ασα — в пятнадцатый год царства Асы. Числа те же у csl и ru."
  11: "ἔθυσεν τῷ κυρίῳ — принёс жертву Господу (θύω); ἀπὸ τῶν σκύλων, ὧν ἤνεγκαν — из добычи, которую принесли; μόσχους ἑπτακοσίους — тельцов семьсот; πρόβατα ἑπτακισχίλια — овец семь тысяч. Слав. «пожроша» — множественное число (彼らは…ささげた)."
  12: "διῆλθεν ἐν διαθήκῃ — прошёл в завете, т. е. вступил в завет (слав. «поидоша в завете»); ζητῆσαι κύριον ἐξ ὅλης τῆς καρδίας καὶ ἐξ ὅλης τῆς ψυχῆς — взыскать Господа от всего сердца и от всей души."
  13: "πᾶς, ὃς ἐὰν μὴ ἐκζητήσῃ κύριον — всякий, кто не взыщет Господа; ἀποθανεῖται — умрёт; ἀπὸ νεωτέρου ἕως πρεσβυτέρου — от младшего до старшего; ἀπὸ ἀνδρὸς ἕως γυναικός — от мужа до жены. Слав. вставляет в скобках «(рече)» — редакционная вставка, не внесена."
  14: "ὤμοσαν ἐν τῷ κυρίῳ — поклялись Господу; ἐν φωνῇ μεγάλῃ — голосом великим; ἐν σάλπιγξιν καὶ ἐν κερατίναις — трубами и рогами (κερατίνη — рог); слав. добавляет «в восклицании» — внесено (叫びながら)."
  15: "ηὐφράνθησαν — возрадовались (εὐφραίνω); ἐξ ὅλης τῆς ψυχῆς ὤμοσαν — всею душою клялись; ἐν πάσῃ θελήσει ἐζήτησαν αὐτόν — всею волею взыскали Его; εὑρέθη αὐτοῖς — был найден ими; κατέπαυσεν αὐτοῖς κύριος κυκλόθεν — успокоил их Господь окрест."
  16: "μετέστησεν — отставил, сместил (μεθίστημι); τοῦ μὴ εἶναι τῇ Ἀστάρτῃ λειτουργοῦσαν — чтобы не служила Астарте (λειτουργέω); κατέκοψεν τὸ εἴδωλον — разрубил идола; κατέκαυσεν ἐν χειμάρρῳ Κεδρων — сжёг в потоке Кедрон (χειμάρρους). Ср. 3 Цар 15:13, где мать названа Ана (アナ)."
  17: "πλὴν τὰ ὑψηλὰ οὐκ ἀπέστησαν — однако высоты не отставлены; ἔτι ὑπῆρχεν ἐν τῷ Ισραηλ — ещё были в Израиле; ἀλλ᾽ ἢ καρδία Ασα ἐγένετο πλήρης — но сердце Асы было полно (слав. «совершенно»); πάσας τὰς ἡμέρας αὐτοῦ — все дни его."
  18: "τὰ ἅγια Δαυιδ τοῦ πατρὸς αὐτοῦ — святыни Давида, отца его; τὰ ἅγια οἴκου κυρίου τοῦ θεοῦ — святыни дома Господа Бога (гр.); слав. «святая своя в дом Божий» — свои святыни (ср. 3 Цар 15:15, где «свои столпы»); в тексте csl. ἀργύριον καὶ χρυσίον καὶ σκεύη — серебро, золото и сосуды."
  19: "καὶ πόλεμος οὐκ ἦν μετ᾽ αὐτοῦ — и войны не было у него; ἕως τοῦ πέμπτου καὶ τριακοστοῦ ἔτους — до тридцать пятого года; τῆς βασιλείας Ασα — царства Асы. Ср. 16:1, где война отнесена к 38-му году."
