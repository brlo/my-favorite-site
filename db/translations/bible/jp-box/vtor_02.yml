verses:
  1: "「そして、わたしたちは向[む]きを変[か]えて、紅海[こうかい]への道[みち]による荒野[こうや]へ旅立[たびだ]った。主[しゅ]がわたしに語[かた]られたとおりである。わたしたちはセイルの山[やま]の周[まわ]りを長[なが]い間[あいだ]巡[めぐ]った。"
  2: "主[しゅ]はわたしに言[い]われた。"
  3: "『あなたがたがこの山[やま]を巡[めぐ]るのは十分[じゅうぶん]である。北[きた]へ向[む]きを変[か]えなさい。"
  4: "民[たみ]に命[めい]じて言[い]いなさい。あなたがたは、セイルに住[す]むあなたがたの兄弟[きょうだい]、エサウの子[こ]らの領界[りょうかい]を通[とお]る。彼[かれ]らはあなたがたを恐[おそ]れ、非常[ひじょう]に警戒[けいかい]するであろう。"
  5: "彼[かれ]らと戦[たたか]いを交[まじ]えてはならない。わたしは彼[かれ]らの地[ち]から、足[あし]の裏[うら]ほどもあなたがたに与[あた]えない。わたしはセイルの山[やま]をエサウの子[こ]らに、割[わ]り当[あ]ての地[ち]として与[あた]えたからである。"
  6: "食[た]べ物[もの]は彼[かれ]らから銀[ぎん]で買[か]って食[た]べ、水[みず]も彼[かれ]らから銀で買って飲[の]みなさい。"
  7: "あなたの神[かみ]である主[しゅ]は、あなたの手[て]のわざすべてにおいてあなたを祝福[しゅくふく]されたからである。あなたがこの大[おお]きく恐[おそ]ろしい荒野[こうや]をどれほど歩[あゆ]んだかを知[し]りなさい。見[み]よ、四十年[よんじゅうねん]の間[あいだ]、あなたの神[かみ]である主[しゅ]はあなたと共[とも]にあり、あなたは何[なに]一[ひと]つ不自由[ふじゆう]しなかった。』"
  8: "わたしたちは、セイルに住[す]む兄弟[きょうだい]であるエサウの子[こ]らのそばを、エラトとガシオン・ガベルから続[つづ]くアラバの道[みち]づたいに通[とお]り過[す]ぎ、向[む]きを変[か]えてモアブの荒野[こうや]の道[みち]を行[い]った。"
  9: "主[しゅ]はわたしに言[い]われた。『モアブ人[じん]に敵意[てきい]を抱[いだ]いてはならない。彼[かれ]らと戦[たたか]いを交[まじ]えてはならない。わたしは彼[かれ]らの地[ち]から何[なに]もあなたがたに割[わ]り当[あ]ての地[ち]として与[あた]えない。わたしはセイルをロトの子[こ]らに嗣業[しぎょう]として受[う]け継[つ]がせるために与[あた]えたからである。』"
  10: "そこには以前[いぜん]、エミム人[じん]が住[す]んでいた。大[おお]きく、多[おお]く、力[ちから]強[づよ]い民[たみ]で、アナク人[じん]のようであった。"
  11: "彼[かれ]らもまた、アナク人[じん]と同[おな]じくレファイム人[じん]と見[み]なされる。モアブ人[じん]は彼[かれ]らをエミム人[じん]と呼[よ]ぶ。"
  12: "また、セイルには以前[いぜん]、ホル人[じん]が住[す]んでいたが、エサウの子[こ]らは彼[かれ]らを滅[ほろ]ぼし、彼[かれ]らの前[まえ]から根[ね]絶[だ]やし、彼[かれ]らの代[か]わりに住[す]んだ。主[しゅ]が彼[かれ]らに与[あた]えられた嗣業[しぎょう]の地[ち]で、イスラエルが行[おこな]ったのと同[おな]じである。"
  13: "『立[た]ちなさい。旅立[たびだ]って、ザレデの川[かわ]を渡[わた]りなさい。』そして、わたしたちはザレデの川を渡[わた]った。"
  14: "カデシュ・バルネアを出[で]てからザレデの川[かわ]を渡[わた]るまでの日々[ひび]は、三十八年[さんじゅうはちねん]であった。それは、戦[いくさ]に出[で]る者[もの]のすべての世代[せだい]が、宿営[しゅくえい]の中[なか]から死[し]に絶[た]えるまでであった。主[しゅ]が彼[かれ]らに誓[ちか]われたとおりである。"
  15: "主[しゅ]の手[て]は彼[かれ]らに下[くだ]り、彼[かれ]らが絶[た]え果[は]てるまで、宿営[しゅくえい]の中から彼[かれ]らを滅[ほろ]ぼし尽[つ]くされた。"
  16: "そして、民[たみ]の中[なか]から戦[いくさ]に出[で]る者[もの]がすべて死[し]に絶[た]えたとき、"
  17: "主[しゅ]はわたしに語[かた]って言[い]われた。"
  18: "『今日[きょう]、あなたはモアブの領界[りょうかい]、すなわちセイルを通[とお]る。"
  19: "そして、アンモン人[じん]の子[こ]らに近[ちか]づく。彼[かれ]らに敵意[てきい]を抱[いだ]いてはならない。彼[かれ]らと戦[たたか]いに及[およ]んではならない。わたしはアンモン人[じん]の子[こ]らの地[ち]から、何[なに]もあなたに割[わ]り当[あ]ての地[ち]として与[あた]えない。わたしはそれをロトの子[こ]らに嗣業[しぎょう]として与[あた]えたからである。』"
  20: "これもまたレファイム人[じん]の地[ち]と見[み]なされる。以前[いぜん]、レファイム人[じん]がそこに住[す]んでいたからである。アンモン人[じん]は彼[かれ]らをゾムゾミム人[じん]と呼[よ]ぶ。"
  21: "大[おお]きく、多[おお]く、あなたがたより強[つよ]い民[たみ]で、アナク人[じん]のようであった。主[しゅ]は彼[かれ]らを彼[かれ]らの前[まえ]から滅[ほろ]ぼされたので、彼[かれ]らはそれを嗣業[しぎょう]として受[う]け継[つ]ぎ、彼[かれ]らの代[か]わりに住[す]んだ。今日[きょう]に至[いた]るまで。"
  22: "セイルに住[す]むエサウの子[こ]らに対してなされたと同[おな]じである。主[しゅ]は彼[かれ]らの前[まえ]からホル人[じん]を根[ね]絶[だ]やし、彼[かれ]らはそれを嗣業[しぎょう]として受[う]け継[つ]いで代[か]わりに住[す]み、今日[きょう]に至[いた]るまでそこにいる。"
  23: "また、ガザに至[いた]るまでアシロトに住[す]んでいたエウ人[じん]、すなわちカパドキアから出[で]て来[き]たカパドキア人[じん]も、彼[かれ]らを滅[ほろ]ぼして代[か]わりに住[す]んだ。"
  24: "『立[た]ちなさい。旅立[たびだ]って、アルノン川[がわ]を渡[わた]りなさい。見[み]よ、わたしはアモリ人[じん]であるエセボンの王[おう]シホンとその地[ち]を、あなたの手[て]に渡[わた]した。彼[かれ]の地[ち]を嗣業[しぎょう]として受[う]け継[つ]ぎ始[はじ]めなさい。彼[かれ]と戦[たたか]いを始[はじ]めなさい。"
  25: "この日[ひ]、わたしは天[てん]の下[した]のすべての民[たみ]の顔[かお]の上[うえ]に、あなたへの恐[おそ]れと恐怖[きょうふ]を及[およ]ぼし始[はじ]める。彼[かれ]らはあなたの名[な]を聞[き]いて震[ふる]え、あなたのゆえに産[さん]みの苦[くる]しみを覚[おぼ]えるであろう。』"
  26: "わたしはケデモトの荒野[こうや]から、エセボンの王[おう]シホンに使者[ししゃ]たちを平和[へいわ]の言葉[ことば]をもって遣[つか]わし、言[い]った。"
  27: "あなたの地[ち]をわたしに通[とお]らせなさい。わたしは道[みち]を行[い]き、右[みぎ]にも左[ひだり]にもそれない。"
  28: "食[た]べ物[もの]は銀[ぎん]でわたしに売[う]り、わたしは食[た]べる。水[みず]も銀でわたしに売り、わたしは飲[の]む。ただ、わたしの足[あし]で通[とお]らせてもらいたい。"
  29: "セイルに住[す]むエサウの子[こ]らと、アロエルに住[す]むモアブ人[じん]が、わたしにしてくれたように。ヨルダン川[がわ]を渡[わた]り、わたしたちの神[かみ]である主[しゅ]がわたしたちに与[あた]えられる地[ち]に入[はい]るまで。"
  30: "しかし、エセボンの王[おう]シホンは、わたしたちを自分のところを通[とお]らせることを望[のぞ]まなかった。あなたの神[かみ]である主[しゅ]が彼[かれ]の霊[れい]をかたくなにし、彼[かれ]の心[こころ]を強[つよ]くされたからである。それは、彼[かれ]をあなたの手[て]に渡[わた]すためであり、今日[きょう]のとおりになった。"
  31: "主[しゅ]はわたしに言[い]われた。『見[み]よ、わたしはシホンとその地[ち]をあなたの前[まえ]に渡[わた]し始[はじ]めた。彼[かれ]の地[ち]を嗣業[しぎょう]として受[う]け継[つ]ぎ始[はじ]めなさい。』"
  32: "シホンは、彼[かれ]とその民[たみ]すべてとともに、ヤッサでわたしたちに戦[たたか]いを仕[しか]けて出[で]て来[き]た。"
  33: "わたしたちの神[かみ]である主[しゅ]は彼[かれ]をわたしたちの前[まえ]に渡[わた]されたので、わたしたちは彼[かれ]とその子[こ]ら、その民[たみ]すべてを打[う]ち殺[ころ]した。"
  34: "その時[とき]、わたしたちは彼[かれ]のすべての町[まち]を取[と]り、すべての町[まち]を続[つづ]けて聖絶[せいぜつ]した。女[おんな]たちも子[こ]どもたちもである。わたしたちは一人[ひとり]も生[い]き残[のこ]る者[もの]を残[のこ]さなかった。"
  35: "ただ、家畜[かちく]と、取[と]った町々[まちまち]の分捕[ぶんど]り物[もの]だけは、わたしたちのものとして奪[うば]い取[と]った。"
  36: "アルノン川[がわ]の岸[きし]にあるアロエルから、谷[たに]にある町[まち]まで、ギレアデの山[やま]に至[いた]るまで、わたしたちを逃[のが]れることのできる町[まち]は一[ひと]つもなかった。わたしたちの神[かみ]である主[しゅ]は、すべてをわたしたちの手[て]に渡[わた]された。"
  37: "ただ、アンモン人[じん]の子[こ]らの地[ち]、ヤボク川[がわ]に沿[そ]うすべての地[ち]、および山地[さんち]の町々[まちまち]には近[ちか]づかなかった。わたしたちの神[かみ]である主[しゅ]が命[めい]じられたとおりである。」"

notes:
  1: "ἐπιστραφέντες ἀπήραμεν — «обратившись, отправились» (ἀπαίρω — «сниматься со стоянки»). ὁδὸν θάλασσαν ἐρυθράν — «дорогою к морю Чермному» (двойной винитив, как в LXX). ὃν τρόπον ἐλάλησεν κύριος πρός με — «как говорил Господь мне». ἐκυκλώσαμεν τὸ ὄρος τὸ Σηιρ — «обходили гору Сеир» (κυκλόω). ἡμέρας πολλάς — «дни многие»."
  2: "καὶ εἶπεν κύριος πρός με — без λέγων: содержание речи начинается только в ст. 3, поэтому стих кончается вводной фразой. В слав. добавлено «глаголя»."
  3: "Ἱκανούσθω ὑμῖν κυκλοῦν τὸ ὄρος τοῦτο — «довольно вам обходить гору сию» (ἱκανόω + инфинитив). ἐπιστράφητε οὖν ἐπὶ βορρᾶν — «обратитесь к северу»."
  4: "τῷ λαῷ ἔντειλαι λέγων — «народу заповедуй, говоря» (ἐντέλλομαι, императив). Ὑμεῖς παραπορεύεσθε — «вы проходите» (παραπορεύομαι; ὑμεῖς — эмфатическое). διὰ τῶν ὁρίων τῶν ἀδελφῶν ὑμῶν υἱῶν Ησαυ — «через пределы братьев ваших, сынов Исава». οἳ κατοικοῦσιν ἐν Σηιρ — «живущих на Сеире». φοβηθήσονται … καὶ εὐλαβηθήσονται ὑμᾶς σφόδρα — «убоятся и весьма устрашатся вас» (εὐλαβέομαι — «остерегаться, робеть»)."
  5: "μὴ συνάψητε πρὸς αὐτοὺς πόλεμον — «не начинайте с ними войны» (συνάπτω πόλεμον — «сцепляться в войне»). οὐ γὰρ μὴ δῶ — усиленное отрицание «не дам». οὐδὲ βῆμα ποδός — «ни шага ноги» (βῆμα — «шаг»). ἐν κλήρῳ δέδωκα — «дал в удел» (κλῆρος — «жребий, удел»)."
  6: "βρώματα ἀργυρίου ἀγοράσατε — «пищи за серебро купите» (ἀγοράζω). ὕδωρ μέτρῳ λήμψεσθε — «воду мерою возьмёте» (μέτρον — «мера»; слав. «в меру возмите от них на цене»)."
  7: "εὐλόγησέν σε ἐν παντὶ ἔργῳ τῶν χειρῶν σου — «благословил тебя во всяком деле рук твоих». διάγνωθι — «уразумей» (διαγινώσκω, императив аориста). οὐκ ἐπεδεήθης ῥήματος — букв. «не имел недостатка в слове» (ἐπιδέομαι с родительным), т. е. ни в чём не нуждался; слав. «не востребовал еси словесе», передано 不自由しなかった. Конец слов Бога."
  8: "παρήλθομεν τοὺς ἀδελφοὺς ἡμῶν — «прошли мимо братьев наших». παρὰ τὴν ὁδὸν τὴν Αραβα — «по дороге Аравы». ἀπὸ Αιλων καὶ ἀπὸ Γασιωνγαβερ — «от Елафа и от Ецион-Гавера»; греческие формы переданы как エラト и ガシオン・ガベル, у Синодального «Елаф и Ецион-Гавер». ἐπιστρέψαντες — «повернув». ὁδὸν ἔρημον Μωαβ — «дорогою пустыни Моава»."
  9: "Μὴ ἐχθραίνετε — «не враждуйте» (ἐχθραίνω с дативом). μὴ συνάψητε πρὸς αὐτοὺς πόλεμον — ср. ст. 5. ἐν κλήρῳ — «в удел». τοῖς γὰρ υἱοῖς Λωτ δέδωκα τὴν Σηιρ κληρονομεῖν — «ибо сынам Лота дал Сеир в наследие»; в csl-ru «ароир», у Синодального «Ар» (масоретское чтение), в gr-lxx-byz стоит Σηιρ, поэтому セイル."
  10: "Стих в квадратных скобках в gr-lxx-byz (вставная глосса; ср. ст. 20–23). οἱ Ομμιν — Емимы. ἐνεκάθηντο ἐπ᾿ αὐτῆς — «сидели на ней» (ἐγκαθέζομαι). ἰσχύοντες ὥσπερ οἱ Ενακιμ — «сильные, как Енакимы» (ἀнаким — アナク人)."
  11: "Ραφαιν λογισθήσονται — «Рефаимами сочтены будут» (λογίζομαι). καὶ οὗτοι — «и эти». ἐπονομάζουσιν — «прозывают» (ἐπονομάζω). Оба народа названы рефаимами, но у моавитян своё имя — Емимы."
  12: "ὁ Χορραῖος — Хоррей (ホル人). ἀπώλεσαν … καὶ ἐξέτριψαν — «погубили и истребили» (ἐκτρίβω). κατῳκίσθησαν ἀντ αὐτῶν — «поселились вместо них» (ἀντί с родительным). ὃν τρόπον ἐποίησεν Ισραηλ τὴν γῆν τῆς κληρονομίας αὐτοῦ — «как сделал Израиль с землёю удела своего». Конец вставки в скобках."
  13: "ἀνάστητε καὶ ἀπάρατε — «встаньте и отправьтесь». παραπορεύεσθε τὴν φάραγγα Ζαρετ — «пройдите долину (поток) Заред» (φάραγξ — «ущелье, поток»). Вторая половина стиха — уже рассказ: παρήλθομεν, поэтому 『…』 закрыты в середине стиха."
  14: "αἱ ἡμέραι, ἃς παρεπορεύθημεν — «дни, в которые прошли». ἕως οὗ διέπεσεν πᾶσα γενεὰ ἀνδρῶν πολεμιστῶν — «пока не пал весь род мужей воинских» (διαπίπτω — «выпадать, гибнуть»). ἀποθνῄσκοντες ἐκ τῆς παρεμβολῆς — «умирая из стана» (παρεμβολή — «стан, ополчение»). καθότι ὤμοσεν αὐτοῖς ὁ θεός — «как клялся им Бог»."
  15: "ἡ χεὶρ τοῦ θεοῦ ἦν ἐπ᾿ αὐτοῖς — «рука Божия была на них». ἐξαναλῶσαι — «истребить» (ἐξαναλίσκω, редкий глагол). ἕως οὗ διέπεσαν — «пока не пали»."
  16: "ἐγενήθη ἐπεὶ διέπεσαν — «было, когда пали» (ἐπεί — «после того как»). ἐκ μέσου τοῦ λαοῦ — «из среды народа». Стих обрывается, как в LXX: главное предложение — в ст. 17."
  17: "ἐλάλησεν κύριος πρός με λέγων — новое введение речи; λέγων относится к ст. 18."
  18: "Σὺ παραπορεύσῃ σήμερον τὰ ὅρια Μωαβ τὴν Σηιρ — «ты проходишь ныне пределы Моава, Сеир»; в gr-lxx-byz стоит Σηιρ (у Синодального «Ара», в csl «ароир»). Σήμερον — «ныне»."
  19: "προσάξετε ἐγγὺς υἱῶν Αμμαν — «приблизьтесь к сынам Аммона» (προσάγω). οὐ γὰρ μὴ δῶ ἀπὸ τῆς γῆς … σοὶ ἐν κλήρῳ — «не дам тебе в удел» (σοί — ед. ч., как в LXX). ὅτι τοῖς υἱοῖς Λωτ δέδωκα αὐτὴν ἐν κλήρῳ — «ибо сынам Лота дал её в удел». Конец слов Бога."
  20: "Стих в квадратных скобках в gr-lxx-byz (глосса). γῆ Ραφαιν λογισθήσεται — «земля Рефаимов сочтётся». τὸ πρότερον — «прежде». Ζομζομμιν — Замзумимы (LXX; у Синодального «Замзумимы», слав. «зоммины»)."
  21: "ἔθνος μέγα καὶ πολὺ καὶ δυνατώτερον ὑμῶν — «народ великий, мног, сильнее вас». ἀπώλεσεν αὐτοὺς κύριος πρὸ προσώπου αὐτῶν — «погубил их Господь пред лицом их». κατεκληρονόμησαν καὶ κατῳκίσθησαν ἀντ αὐτῶν — «получили удел и поселились вместо них». ἕως τῆς ἡμέρας ταύτης — «до сего дня»."
  22: "ὥσπερ ἐποίησαν τοῖς υἱοῖς Ησαυ — «как сделали сынам Исава». ἐξέτριψαν τὸν Χορραῖον ἀπὸ προσώπου αὐτῶν — «истребили Хоррея от лица их». κατεκληρονόμησαν — «получили удел». В csl-ru конец стиха совпадает, у Синодального стих продолжается словами о Евеях (иной счёт)."
  23: "οἱ Ευαῖοι — Евеи. ἐν ασηρωθ — «в Асирофе» (передано アシロト). ἕως Γάζης — «до Газы». οἱ Καππάδοκες οἱ ἐξελθόντες ἐκ Καππαδοκίας — «каппадокийцы, вышедшие из Каппадокии»; у Синодального «Кафторимы, исшедшие из Кафтора» (масоретское чтение), в LXX — Каппадокия. Конец вставки в скобках."
  24: "παρέλθατε τὴν φάραγγα Αρνων — «перейдите поток Арнон». ἰδοὺ παραδέδωκα εἰς τὰς χεῖράς σου — «вот, Я предал в руки твои» (перфект). ἐνάρχου κληρονομεῖν — «начинай наследовать» (ἐνάρχομαι + инфинитив). σύνναπτε πρὸς αὐτὸν πόλεμον — «начинай с ним войну» (συνάπτω)."
  25: "ἐνάρχου δοῦναι τὸν τρόμον σου καὶ τὸν φόβον σου — «начинаю давать трепет твой и страх твой» (τρόμος, φόβος). ἐπὶ πρόσωπον πάντων τῶν ἐθνῶν τῶν ὑποκάτω τοῦ οὐρανοῦ — «на лицо всех народов под небом». ταραχθήσονται — «смутятся» (ταράσσω). ὠδῖνας ἕξουσιν — «почувствуют муки рождения» (ὠδίν)."
  26: "ἀπέστειλα πρέσβεις — «послал послов» (πρέσβυς). ἐκ τῆς ἐρήμου Κεδαμωθ — «из пустыни Кедемоф». λόγοις εἰρηνικοῖς λέγων — «со словами мирными, говоря»; λέγων вводит послание ст. 27–29, которое Моисей приводит в своей речи (оставлено в первом уровне)."
  27: "Παρελεύσομαι διὰ τῆς γῆς σου — «пройду через землю твою». ἐν τῇ ὁδῷ παρελεύσομαι — «дорогою пройду» (повтор, как в LXX). οὐχὶ ἐκκλινῶ δεξιὰ οὐδὲ ἀριστερά — «не сверну ни направо, ни налево» (ἐκκλίνω)."
  28: "βρώματα ἀργυρίου ἀποδώσῃ μοι — «пищу за серебро отдашь (продашь) мне» (ἀποδίδωμι). πλὴν ὅτι παρελεύσομαι τοῖς ποσίν — «только что пройду ногами моими» (слав. «точию ногама моима да прейду»)."
  29: "καθὼς ἐποίησάν μοι οἱ υἱοὶ Ησαυ … καὶ οἱ Μωαβῖται οἱ κατοικοῦντες ἐν Αροηρ — «как сделали мне сыны Исава … и моавитяне, живущие в Ароере». ἕως παρέλθω τὸν Ιορδάνην — «доколе не перейду Иордан». Конец послания."
  30: "οὐκ ἠθέλησεν … παρελθεῖν ἡμᾶς δι᾿ αὐτοῦ — «не захотел, чтобы мы прошли через него». ἐσκλήρυνεν — «ожесточил» (σκληρύνω). κατίσχυσεν τὴν καρδίαν αὐτοῦ — «укрепил (сделал упорным) сердце его». ἵνα παραδοθῇ εἰς τὰς χεῖράς σου — «чтобы он был предан в руки твои». ὡς ἐν τῇ ἡμέρᾳ ταύτῃ — «как в день сей»."
  31: "Ἰδοὺ ἦργμαι παραδοῦναι — «вот, Я начал предавать» (перфект от ἄρχομαι). ἔναρξαι κληρονομῆσαι τὴν γῆν αὐτοῦ — «начни наследовать землю его»."
  32: "ἐξῆλθεν … εἰς συνάντησιν ἡμῖν — «вышел навстречу нам». εἰς πόλεμον Ιασσα — «на войну в Яссу» (Яаца; ヤッサ, как в Числ 21:23)."
  33: "παρέδωκεν αὐτὸν κύριος … πρὸ προσώπου ἡμῶν — «предал его Господь пред лицом нашим». ἐπατάξαμεν αὐτὸν καὶ τοὺς υἱοὺς αὐτοῦ — «поразили его и сынов его»."
  34: "ἐκρατήσαμεν πασῶν τῶν πόλεων αὐτοῦ — «овладели всеми городами его» (κρατέω с родительным). ἐξωλεθρεύσαμεν — «истребили, предали заклятию» (ἐξολεθρεύω; в корпусе 聖絶, сноска не нужна). ἑξῆς — «подряд, каждый». οὐ κατελίπομεν ζωγρείαν — «не оставили никого живым» (ζωγρεία — «добыча живой»)."
  35: "τὰ κτῆνη ἐπρονομεύσαμεν — «скот захватили» (προνομεύω — «брать добычу»). τὰ σκῦλα τῶν πόλεων ἐλάβομεν — «добычу городов взяли» (σκῦλον)."
  36: "ἐξ Αροηρ, ἥ ἐστιν παρὰ τὸ χεῖλος χειμάρρου Αρνων — «от Ароера, что у берега потока Арнона» (χεῖλος — «губа, берег»; χείμαρρος — «зимний поток»). οὐκ ἐγενήθη πόλις, ἥτις διέφυγεν ἡμᾶς — «не было города, который убежал бы от нас» (διαφεύγω). τὰς πάσας παρέδωκεν — «все предал»."
  37: "πάντα τὰ συγκυροῦντα χειμάρρου Ιαβοκ — «всё, прилежащее к потоку Иавок» (συγκυρέω — «сходиться, прилегать»). τὰς πόλεις τὰς ἐν τῇ ὀρεινῇ — «города в нагорной стране». καθότι ἐνετείλατο ἡμῖν κύριος — «как заповедал нам Господь». Конец главы; речь Моисея продолжается в гл. 3."
