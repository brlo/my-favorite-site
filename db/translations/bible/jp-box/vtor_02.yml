# jp-box, Второзаконие, глава 2. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в этой главе нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 2: путь вокруг Сеира и поток Заред (1–15), повеления о Моаве и Аммоне
# (16–23), переход Арнона и Сигон (24–31), поражение Сигона и Заиорданье (32–37).
# Нумерация совпадает с csl-ru и ru: 37 стихов.
# Кавычки: речь Моисея — 「…」 (начинается заново, как в гл. 1: речь продолжается);
# слова Бога внутри неё — 『…』 (3–7, 9, 13, 18–19, 24–25, 31). Слова Моисея,
# которые он приводит в послании Сигону (26–29), оставлены в первом уровне.
# Красного нет.
# В gr-lxx-byz 2:10–12 и 2:20–23 стоят в квадратных скобках (вставные глоссы) —
# переведены как речь Моисея, без добавления скобок в японском.
# 〔…〕 нет: все слова есть в gr-lxx-byz. Отличия церковного чтения не внесены:
# 2:9 и 2:18 в gr-lxx-byz стоит Σηιρ, а в csl-ru «ароир» и Синодальный «Ар»;
# 2:23 в LXX Καππάδοκες из Καππαδοκίας, у Синодального «Кафторимы из Кафтора» —
# см. notes. Проверено bracket_check.rb.
# Сносок ⟨…⟩ нет: レファイム, アナク人, ホル人, エミム人 — имена, понятные по
# контексту; 聖絶 уже пояснено в Лев 27.
# Имена: エセボン, シホン, エドライン, エラト, ガシオン・ガベル, アロエル,
# ヤッサ (как в Числ 21), ザレデ. jp-ni не использовался.

