# jp-box, 2-я Паралипоменон, глава 11. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); второй свидетель — церковнославянский
# (csl-ru); ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет,
# jp-ni не источник (только проверка tmp/sim_jp.rb).
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 11: война против Израиля запрещена через Самею (1–4), укрепление городов (5–12),
# переселение священников и левитов (13–17), жёны и дети Ровоама (18–23).
# Вся глава, кроме 11:1–4 (параллель 3 Цар 12:21–24), — собственный материал
# Паралипоменон; в 11:18–23 — трудные имена, переданы с греческого, csl-варианты в notes.
# Речи — 「…」: слово Господне, переданное Самеей (3), и слова Господа внутри него 『…』 (4).
# Паритет: csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes.
# Нумерация — по gr-lxx-byz, 23 стиха; совпадает с csl.
# 〔…〕 нет. Сносок ⟨…⟩ нет: 天幕, 盾, 槍, 祭司, レビ人 уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: 2par
chapter: 11
draft: true

verses:
  1: "レハブアムはエルサレムに入[はい]り、ユダとベニヤミンの家[いえ]を集[あつ]めた。すなわち、戦[たたか]いを行[おこな]う若者[わかもの]十八万[じゅうはちまん]である。彼はイスラエルとヤロブアムに対して戦い、王国[おうこく]をレハブアムに取[と]り戻[もど]そうとした。"
  2: "主[しゅ]の言葉[ことば]が、神[かみ]の人[ひと]サメヤに臨[のぞ]んで言[い]った。"
  3: "「ソロモンの子[こ]、ユダの王[おう]レハブアムに、またユダとベニヤミンにいる全[ぜん]イスラエルに言[い]いなさい。"
  4: "『主[しゅ]はこう言[い]われる。あなたがたは上[のぼ]ってはならない。あなたがたの兄弟[きょうだい]であるイスラエルの子[こ]らと戦[たたか]ってはならない。おのおの自分[じぶん]の家[いえ]へ帰[かえ]りなさい。このことはわたしから出[で]たからである。』」そして彼[かれ]らは主の言葉を聞[き]いて、ヤロブアムに対して行[い]くことをやめた。"
  5: "レハブアムはエルサレムに住[す]み、ユダの地[ち]に城壁[じょうへき]のある町[まち]々[まち]を建[た]てた。"
  6: "すなわち、ベツレヘム、エタム、テコエ、"
  7: "ベト・ツル、ソコホ、オドラム、"
  8: "ガテ、マレシャ、ジフ、"
  9: "アドライム、ラキシュ、アゼカ、"
  10: "ツォルア、アヤロン、ヘブロン。これらはユダとベニヤミンにある要害[ようがい]の町[まち]である。"
  11: "彼はそれらを城壁[じょうへき]で固[かた]め、その中に長[おさ]たちを置[お]き、食物[しょくもつ]の蓄[たくわ]えと、油[あぶら]とぶどう酒[しゅ]を備[そな]えた。"
  12: "また、町[まち]ごとに盾[たて]と槍[やり]を備[そな]え、それらを非常[ひじょう]に強[つよ]くした。ユダとベニヤミンは彼[かれ]のもとにあった。"
  13: "イスラエル全土[ぜんど]にいた祭司[さいし]たちとレビ人[びと]たちは、すべての境[さかい]から彼[かれ]のもとに集[あつ]まった。"
  14: "レビ人たちは自分[じぶん]の所有地[しょゆうち]の天幕[てんまく]を捨[す]てて、ユダとエルサレムへ行[い]った。ヤロブアムとその子[こ]らが彼らを追[お]い出[だ]し、主[しゅ]に仕[つか]えることをやめさせたからである。"
  15: "そして彼は、高[たか]い所[ところ]の祭司[さいし]、また偶像[ぐうぞう]と虚[むな]しいものと、自分が造[つく]った子牛[こうし]たちに仕[つか]える祭司たちを立[た]てた。"
  16: "彼は、イスラエルの神[かみ]、主[しゅ]を求[もと]めるために心[こころ]を向[む]けた者[もの]たちを、イスラエルのすべての部族[ぶぞく]から追[お]い出[だ]した。彼らは父[ちち]たちの神、主に犠牲[ぎせい]をささげるためにエルサレムへ来[き]た。"
  17: "彼らはユダの王国[おうこく]を強[つよ]くし、ソロモンの子[こ]レハブアムを三年[さんねん]の間[あいだ]支[ささ]えた。彼がダビデとソロモンの道[みち]をその三年の間歩[あゆ]んだからである。"
  18: "レハブアムは自分[じぶん]に妻[つま]を迎[むか]えた。すなわち、ダビデの子[こ]イェリモトの娘[むすめ]モラト、およびエッサイの子エリアブの娘アビハイルである。"
  19: "彼女[かのじょ]は彼[かれ]に子[こ]らを産[う]んだ。すなわち、イアウス、サマリヤ、ロオラムである。"
  20: "その後[のち]、彼はアブサロムの娘[むすめ]マアハを迎[むか]え、彼女は彼にアビヤ、イェティ、ジザ、エモトを産んだ。"
  21: "レハブアムはアブサロムの娘[むすめ]マアハを、自分の妻[つま]たちと側女[そばめ]たちすべてよりも愛[あい]した。彼には十八人[じゅうはちにん]の妻と六十人[ろくじゅうにん]の側女がいて、二十八人[にじゅうはちにん]の子[こ]らと六十人の娘たちをもうけたからである。"
  22: "レハブアムはマアハの子[こ]アビヤを長[おさ]とし、彼の兄弟[きょうだい]たちの上[うえ]に立[た]てた。彼を王[おう]にしようと考えていたからである。"
  23: "彼はすべての兄弟[きょうだい]たちよりも増[ま]し加[くわ]えられ、ユダとベニヤミンのすべての地[ち]、およびすべての要害[ようがい]の町[まち]々[まち]で、彼らに食物[しょくもつ]を豊[ゆた]かに与[あた]え、多[おお]くの妻[つま]を求[もと]めた。"

notes:
  1: "ἐξεκκλησίασεν — созвал (ἐκκλησιάζω); τὸν Ιουδαν καὶ Βενιαμιν — Иуду и Вениамина; в csl «созва (весь) дом иудин и вениаминь» — «(весь)» редакторское уточнение в скобках, не переводится; ἑκατὸν ὀγδοήκοντα χιλιάδας — 180 000 (в 3 Цар 12:21 в LXX 120 000; в ru 180 000 — масоретское чтение); νεανίσκοι ποιοῦντες πόλεμον — юноши, творящие войну; ἐπιστρέψαι τὴν βασιλείαν τῷ Ροβοαμ — возвратить царство Ровоаму. В csl добавлено «и иеровоама» — и Иеровоама (в LXX нет), внесено."
  2: "ἐγένετο λόγος κυρίου πρὸς Σαμαιαν — было слово Господне к Самее (Σαμαιας; サメヤ, как в 3 Цар 12:22); ἄνθρωπος τοῦ θεοῦ — человек Божий (神の人); λέγων — говоря (речь в ст. 3–4)."
  3: "Εἰπὸν πρὸς Ροβοαμ τὸν τοῦ Σαλωμων — скажи Ровоаму, сыну Соломона; в csl добавлено «царю иудину» и «всему Израилю, иже есть во Иуде и Вениамине», у гр. — «всему Иуде и Вениамину»; внесено по csl; λέγων — говоря."
  4: "Τάδε λέγει κύριος — так говорит Господь; Οὐκ ἀναβήσεσθε — не взойдёте; ἀποστρέφετε ἕκαστος εἰς τὸν οἶκον αὐτοῦ — возвратитесь каждый в дом свой; ὅτι παρ᾿ ἐμοῦ ἐγένετο τὸ ῥῆμα τοῦτο — ибо от Меня было слово это; ἐπήκουσαν τοῦ λόγου κυρίου — послушались слова Господня; ἀπεστράφησαν τοῦ μὴ πορευθῆναι ἐπὶ Ιεροβοαμ — возвратились, чтобы не идти на Иеровоама."
  5: "κατῴκησεν — поселился; ᾠκοδόμησεν πόλεις τειχήρεις — построил города, обнесённые стенами (τειχήρης, τεῖχος); ἐν τῇ Ιουδαίᾳ — в Иудее."
  6: "Βαιθλεεμ — Вифлеем (ベツレヘム); Αιταμ — Ефам (エタム; слав. «етам»); Θεκωε — Фекоя (テコエ; слав. «фекуе»). Слав. «сострои же вифлеем и етам, и фекуе»."
  7: "Βαιθσουρα — Вефсур (ベト・ツル; евр. Бет-Цур, слав. «вефсур»); Σοκχωθ — Сокхоф (ソコホ, форма корпуса); Οδολλαμ — Одоллам (オドラム, форма корпуса)."
  8: "Γεθ — Геф (ガテ); Μαρισαν — Мариса (マレシャ, форма корпуса; евр. Мареша, слав. «марисан»); Ζιφ — Зиф (ジフ)."
  9: "Αδωραιμ — Адораим (アドライム; слав. «адурем»); Λαχις — Лахис (ラキシュ); Αζηκα — Азека (アゼカ; слав. «азику»)."
  10: "Σαραα — Сараа, т. е. Цора (ツォルア: в LXX Σαραα, евр. Цора, слав. «салаю»); Αιαλων — Аиалон (アヤロン); Χεβρων — Хеврон (ヘブロン); ἥ ἐστιν τοῦ Ιουδα καὶ Βενιαμιν — которая принадлежит Иуде и Вениамину; πόλεις τειχήρεις — города укреплённые."
  11: "ὠχύρωσεν — укрепил (ὀχυρόω); ἡγουμένοι — начальники (長); παραθέσεις βρωμάτων — запасы пищи (παράθεσις); ἔλαιον καὶ οἶνον — елей и вино. В csl «житохранилища» — житницы."
  12: "κατὰ πόλιν καὶ κατὰ πόλιν — в каждый город (букв. «по городу и по городу»); θυρεοί — большие щиты; δόρατα — копья; κατίσχυσεν — укрепил, сделал сильным; ἦσαν αὐτῷ Ιουδα καὶ Βενιαμιν — были за него Иуда и Вениамин. В конце стиха в базе стоит знак «—» (разделитель модуля), не переводится."
  13: "οἱ ἱερεῖς καὶ οἱ Λευῖται — священники и левиты; οἳ ἦσαν ἐν παντὶ Ισραηλ — которые были во всём Израиле; συνήχθησαν πρὸς αὐτόν — собрались к нему; ἐκ πάντων τῶν ὁρίων — из всех пределов."
  14: "ἐγκατέλιπον τὰ σκηνώματα τῆς κατασχέσεως αὐτῶν — оставили шатры владения своего (σκήνωμα, κατάσχεσις); ἐπορεύθησαν πρὸς Ιουδαν — пошли к Иуде; ἐξέβαλεν αὐτοὺς — изгнал их (ἐκβάλλω); οἱ υἱοὶ αὐτοῦ — сыновья его; τοῦ μὴ λειτουργεῖν κυρίῳ — чтобы не служить Господу (λειτουργέω)."
  15: "κατέστησεν ἑαυτῷ ἱερεῖς — поставил себе жрецов (καθίστημι); τῶν ὑψηλῶν — высот (高き所); τοῖς εἰδώλοις — идолам (εἴδωλον); τοῖς ματαίοις — суетным (μάταιος, 虚しいもの); τοῖς μόσχοις — тельцам (μόσχος, 子牛); ἃ ἐποίησεν Ιεροβοαμ — которых сделал Иеровоам. В ru «к козлам» — по МТ."
  16: "ἐξέβαλεν αὐτοὺς ἀπὸ φυλῶν Ισραηλ — изгнал их из колен Израилевых; οἳ ἔδωκαν καρδίαν αὐτῶν τοῦ ζητῆσαι κύριον — которые отдали сердце своё, чтобы искать Господа; ἦλθον εἰς Ιερουσαλημ θῦσαι — пришли в Иерусалим принести жертву (θύω); κυρίῳ θεῷ τῶν πατρῶν αὐτῶν — Господу Богу отцов их. Тёмное место: в ru «а за ними и из всех колен… приходили» — иное понимание (по МТ); в csl «и изгна их от всех колен»."
  17: "κατίσχυσαν τὴν βασιλείαν Ιουδα — укрепили царство Иуды; κατίσχυσαν Ροβοαμ — поддержали Ровоама (κατισχύω); εἰς ἔτη τρία — на три года; ἐπορεύθη ἐν ταῖς ὁδοῖς Δαυιδ καὶ Σαλωμων — ходил путями Давида и Соломона; в csl добавлено «отца своего» — отца его."
  18: "ἔλαβεν ἑαυτῷ γυναῖκα — взял себе жену; Μολλαθ θυγάτηρ Ιεριμουθ υἱοῦ Δαυιδ — Махалаф, дочь Иеромофа, сына Давидова (モラト — по греч. Μολλαθ; слав. «моолафа», ru «Махалафа»); Αβαιαν θυγάτηρ Ελιαβ τοῦ Ιεσσαι — Авихаиль, дочь Елиава, сына Иессеева (アビハイル; в csl «авигея», в ru «Авихаиль»)."
  19: "ἔτεκεν αὐτῷ υἱούς — родила ему сыновей; Ιαους — Иеус (イアウス, по греч.; слав. «иеус»); Σαμαριαν — Шемария (サマリヤ, по греч.; слав. «самориа»); Ροολλαμ — Загам (ロオラム, по греч.; слав. «заам», ru «Загам»). Имена переданы с греческого, csl-варианты отмечены."
  20: "μετὰ ταῦτα — после этого; Μααχα θυγάτηρ Αβεσσαλωμ — Мааха, дочь Авессалома (アブサロム — форма корпуса); Αβια — Авия (アビヤ); Ιεθθι — Аттай (イェティ, по греч.; слав. «иеффиа», ru «Аттай»); Ζιζα — Зиза (ジザ); Εμμωθ — Шеломиф (エモト, по греч.; слав. «салимофа», ru «Шеломиф»)."
  21: "ἠγάπησεν ὑπὲρ πάσας — возлюбил более всех; παλλακαί — наложницы (側女); γυναῖκας δέκα ὀκτὼ — 18 жён; παλλακὰς τριάκοντα — в LXX 30 наложниц, в csl «шестьдесят» (60) — в тексте csl, греч. число здесь; ἐγέννησεν υἱοὺς εἴκοσι ὀκτὼ καὶ θυγατέρας ἑξήκοντα — родил 28 сыновей и 60 дочерей (в ru то же)."
  22: "κατέστησεν εἰς ἄρχοντα — поставил начальником; εἰς ἡγούμενον ἐν τοῖς ἀδελφοῖς αὐτοῦ — вождём среди братьев его; ὅτι βασιλεῦσαι διενοεῖτο αὐτόν — ибо думал воцарить его (διανοέομαι); в csl «князем над всею братиею его»."
  23: "ηὐξήθη — возрос, умножился (αὐξάνω); παρὰ πάντας τοὺς υἱοὺς αὐτοῦ — в LXX «более всех сыновей его», в csl «паче всех братий своих» — в тексте csl; ἐν πᾶσιν τοῖς ὁρίοις Ιουδα καὶ Βενιαμιν — во всех пределах Иуды и Вениамина; ἔδωκεν αὐταῖς τροφάς — дал им пищу (αὐταῖς — ж. р., вероятно «городам»); ᾐτήσατο πλῆθος γυναικῶν — испросил множество жён. В ru и МТ «действовал благоразумно… разослал сыновей… приискал много жён» — иное чтение."
