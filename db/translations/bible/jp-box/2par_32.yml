verses:
  1: "これらの行[おこな]いと、この真実[しんじつ]の後[あと]に、アッシリアの王[おう]センナケリブが来[き]て、ユダに攻[せ]め入[はい]り、堅固[けんご]な町々[まちまち]に陣[じん]を敷[し]いて、それを自分[じぶん]のものにしようと考えた。"
  2: "ヒゼキヤは、センナケリブが来[き]て、エルサレムと戦[たたか]おうとしているのを見[み]た。"
  3: "そして、自分[じぶん]の長老[ちょうろう]たちや勇士[ゆうし]たちと図[はか]って、町[まち]の外[そと]にある泉[いずみ]の水[みず]をふさごうと決[き]め、彼[かれ]らは彼[かれ]を助[たす]けた。"
  4: "彼[かれ]は多[おお]くの民[たみ]を集[あつ]め、泉[いずみ]の水[みず]と町[まち]の中[なか]を流[なが]れる川[かわ]をふさいで言[い]った。「アッシリアの王[おう]が来[き]て、豊[ゆた]かな水[みず]を見[み]つけて強[つよ]くなってはならない。」"
  5: "彼[かれ]は勇気[ゆうき]を出[だ]して、崩[くず]れた城壁[じょうへき]をことごとく築[きず]き直[なお]し、塔[とう]を建[た]て、外[そと]に別[べつ]の城壁[じょうへき]を巡[めぐ]らし、ダビデの町[まち]のミロを補強[ほきょう]し、多[おお]くの武器[ぶき]と盾[たて]を造[つく]った。"
  6: "彼[かれ]は民[たみ]の上[うえ]に戦[たたか]いの長[かしら]たちを置[お]き、町[まち]の門[もん]の広場[ひろば]に彼[かれ]らを集[あつ]め、彼[かれ]らの心[こころ]に語[かた]って言[い]った。"
  7: "「強[つよ]くあれ、雄々[おお]しくあれ。アッシリアの王[おう]の顔[かお]を恐[おそ]れてはならない。彼[かれ]とともにいるすべての群[む]れを恐[おそ]れてはならない。私たちとともにいる者[もの]のほうが、彼[かれ]とともにいる者[もの]よりも多[おお]いからである。"
  8: "彼[かれ]とともにいるのは肉[にく]の腕[うで]だが、私たちとともにいるのは、私たちの神[かみ]である主[しゅ]であり、私たちを救[すく]い、私たちの戦[たたか]いを戦[たたか]ってくださる。」民[たみ]はユダの王[おう]ヒゼキヤの言葉[ことば]によって力[ちから]づけられた。"
  9: "この後[あと]、アッシリアの王[おう]センナケリブは、自分[じぶん]はラキシュにあり、全軍[ぜんぐん]とともにそこにいたまま、しもべたちをエルサレムへ遣[つか]わし、ユダの王[おう]ヒゼキヤと、エルサレムにいるすべてのユダに告[つ]げさせた。"
  10: "「アッシリアの王[おう]センナケリブはこう言[い]う。あなたがたは何[なに]に頼[たよ]って、エルサレムで包囲[ほうい]されたまま座[すわ]っているのか。"
  11: "ヒゼキヤは、『私たちの神[かみ]である主[しゅ]が、アッシリアの王[おう]の手[て]から私たちを救[すく]ってくださる』と言[い]って、あなたがたを死[し]と飢[う]えと渇[かわ]きに渡[わた]そうと、あなたがたを欺[あざむ]いているのではないか。"
  12: "このヒゼキヤこそ、神[かみ]の祭壇[さいだん]と高[たか]い所[ところ]を取[と]り除[のぞ]き、ユダとエルサレムに『この祭壇[さいだん]の前[まえ]で礼拝[れいはい]し、その上[うえ]で香[こう]をたけ』と言[い]った者[もの]ではないか。"
  13: "あなたがたは、私[わたし]と私[わたし]の父[ちち]たちがすべての地[ち]の民[たみ]に行[おこな]ったことを知[し]らないのか。諸国[しょこく]の神々[かみがみ]は、自分[じぶん]の民[たみ]を私[わたし]の手[て]から救[すく]うことができたのか。"
  14: "私[わたし]の父[ちち]たちが滅[ほろ]ぼしたこれらの国々[くにぐに]のすべての神々[かみがみ]のうち、だれが自分[じぶん]の民[たみ]を私[わたし]の手[て]から救[すく]うことができたか。あなたがたの神[かみ]がどうしてあなたがたを私[わたし]の手[て]から救[すく]うことができるのか。"
  15: "今[いま]、ヒゼキヤにあなたがたを欺[あざむ]かせてはならない。このようにして頼[たよ]らせてはならない。彼[かれ]を信[しん]じてはならない。どんな国[くに]のどんな王国[おうこく]の神[かみ]も、その民[たみ]を私[わたし]の手[て]と私[わたし]の父[ちち]たちの手[て]から救[すく]うことはできなかったのだから、あなたがたの神[かみ]もあなたがたを私[わたし]の手[て]から救[すく]うことはできない。」"
  16: "彼[かれ]のしもべたちは、さらに主[しゅ]なる神[かみ]と、そのしもべヒゼキヤに対して語[かた]った。"
  17: "またセンナケリブは、イスラエルの神[かみ]である主[しゅ]をそしって、こう言[い]う手紙[てがみ]を書[か]いた。「諸国[しょこく]の民[たみ]の神々[かみがみ]が自分[じぶん]の民[たみ]を私[わたし]の手[て]から救[すく]い出[だ]さなかったように、ヒゼキヤの神[かみ]も自分[じぶん]の民[たみ]を私[わたし]の手[て]から救[すく]い出[だ]さない。」"
  18: "そして、エルサレムの民[たみ]、城壁[じょうへき]の上[うえ]にいる者[もの]たちに向[む]かってユダの言葉[ことば]で大[おお]きな声[こえ]をあげて叫[さけ]び、彼[かれ]らを恐[おそ]れさせ、おののかせて、町[まち]を取[と]ろうとした。"
  19: "彼[かれ]らは、エルサレムの神[かみ]について、地上[ちじょう]の民[たみ]の神々[かみがみ]と同[おな]じように、人[ひと]の手[て]のわざにすぎないものとして語[かた]った。"
  20: "ヒゼキヤ王[おう]と、アモスの子[こ]である預言者[よげんしゃ]イザヤは、このことについて祈[いの]り、天[てん]に向[む]かって叫[さけ]んだ。"
  21: "主[しゅ]は使[つか]いを遣[つか]わし、アッシリアの王[おう]の陣営[じんえい]で、すべての勇士[ゆうし]、長[かしら]、将軍[しょうぐん]を滅[ほろ]ぼされた。王[おう]は恥[は]じて自分[じぶん]の地[ち]へ帰[かえ]った。そして自分[じぶん]の神[かみ]の家[いえ]に入[はい]ると、その腹[はら]から出[で]た者[もの]たちが剣[つるぎ]で彼[かれ]を倒[たお]した。"
  22: "こうして主[しゅ]は、ヒゼキヤとエルサレムの住民[じゅうみん]を、アッシリアの王[おう]センナケリブの手[て]から、またすべての者[もの]の手[て]から救[すく]い、周[まわ]りに安息[あんそく]を与[あた]えられた。"
  23: "多[おお]くの者[もの]が、主[しゅ]にささげ物[もの]を、またユダの王[おう]ヒゼキヤに贈[おく]り物[もの]をエルサレムに持[も]って来[き]た。そして彼[かれ]はその後[あと]、すべての国[くに]の目[め]に高[たか]く上[あ]げられた。"
  24: "そのころ、ヒゼキヤは死[し]に至[いた]るまで病[やまい]にかかった。彼[かれ]は主[しゅ]に祈[いの]り、主[しゅ]は彼[かれ]を聞[き]き入[い]れて、しるしを与[あた]えられた。"
  25: "しかし、ヒゼキヤは自分[じぶん]に与[あた]えられた報[むく]いに対[たい]して報[むく]いることをせず、その心[こころ]は高[たか]ぶった。それゆえ、怒[いか]りが彼[かれ]とユダとエルサレムに臨[のぞ]んだ。"
  26: "しかし、ヒゼキヤは自分[じぶん]の心[こころ]の高[たか]ぶりを低[ひく]くし、エルサレムの住民[じゅうみん]も同[おな]じようにしたので、主[しゅ]の怒[いか]りはヒゼキヤの日[ひ]々[び]のうちに彼[かれ]らに臨[のぞ]まなかった。"
  27: "ヒゼキヤには豊[ゆた]かな富[とみ]と栄光[えいこう]があり、銀[ぎん]と金[きん]、宝石[ほうせき]、香料[こうりょう]のための宝庫[ほうこ]、武具[ぶぐ]の庫[くら]、あらゆる望[のぞ]ましい器[うつわ]を自分[じぶん]のために造[つく]った。"
  28: "また、穀物[こくもつ]、油[あぶら]、ぶどう酒[しゅ]の産物[さんぶつ]のための町々[まちまち]、あらゆる家畜[かちく]のための飼葉桶[かいばおけ]、群[む]れのための囲[かこ]いを造[つく]った。"
  29: "また、彼[かれ]は自分[じぶん]のために町々[まちまち]を建[た]て、羊[ひつじ]と牛[うし]の家畜[かちく]を多[おお]く持[も]った。神[かみ]が彼[かれ]に非常[ひじょう]に多[おお]くの財産[ざいさん]を与[あた]えられたからである。"
  30: "ヒゼキヤはギホンの上[うえ]の水[みず]の出口[でぐち]をふさぎ、それをダビデの町[まち]の南[みなみ]へまっすぐに下[くだ]らせた。ヒゼキヤはそのすべてのわざにおいて栄[さか]えた。"
  31: "しかし、バビロンの長[かしら]たちからの使者[ししゃ]たちが、この地[ち]に起[お]こったしるしを尋[たず]ねるために彼[かれ]のもとへ遣[つか]わされたとき、神[かみ]は彼[かれ]をそのままにして、彼[かれ]の心[こころ]にあることを知[し]るために彼[かれ]を試[こころ]みられた。"
  32: "ヒゼキヤの残[のこ]りの言葉[ことば]とその慈[いつく]しみは、見[み]よ、預言者[よげんしゃ]イザヤ、アモスの子[こ]の預言[よげん]の書[しょ]と、ユダとイスラエルの王[おう]たちの書[しょ]に記[しる]されている。"
  33: "ヒゼキヤは先祖[せんぞ]たちとともに眠[ねむ]り、ダビデの子[こ]らの墓[はか]のある高台[たかだい]に葬[ほうむ]られた。その死[し]にあたって、ユダのすべての者[もの]とエルサレムの住民[じゅうみん]が彼[かれ]に栄光[えいこう]と誉[ほま]れをささげた。そしてその子[こ]マナセが彼[かれ]に代[か]わって王[おう]となった。"

notes:
  1: "μετὰ τοὺς λόγους τούτους καὶ τὴν ἀλήθειαν ταύτην — после этих дел (λόγοι — и «слова», и «дела») и этой верности; παρενέβαλεν ἐπὶ τὰς πόλεις τὰς τειχήρεις — расположил стан против укреплённых городов; εἶπεν προκαταλαβέσθαι αὐτός — сказал в сердце овладеть ими (προκαταλαμβάνω — занять прежде)."
  2: "ἥκει — пришёл (ἥκω); τὸ πρόσωπον αὐτοῦ τοῦ πολεμῆσαι — «лицо его» (намерение) воевать."
  3: "ἐβουλεύσατο μετὰ τῶν πρεσβυτέρων — совещался со старейшинами; ἐμφράξαι τὰ ὕδατα τῶν πηγῶν — заградить воды источников (ἐμφράσσω); συνεπίσχυσαν αὐτῷ — поддержали его (συνεπισχύω)."
  4: "τὸν ποταμὸν τὸν διορίζοντα διὰ τῆς πόλεως — реку, протекающую через город (διορίζω — разделять, проходить); μὴ ἔλθῃ … εὕρῃ ὕδωρ πολὺ καὶ κατισχύσῃ — чтобы не пришёл царь, не нашёл много воды и не усилился."
  5: "κατίσχυσεν — укрепился; τὸ τεῖχος τὸ κατεσκαμμένον — стена разрушенная (κατασκάπτω); προτείχισμα ἄλλο — другая передовая стена; τὸ ἀνάλημμα πόλεως Δαυιδ — «подъём» города Давида, ср. 1 Пар 11:8 (Милло, ミロ); ὅπλα πολλά — много оружия."
  6: "ἄρχοντας τοῦ πολέμου — военачальников; εἰς τὴν πλατεῖαν τῆς πύλης τῆς φάραγγος — на площадь ворот долины (πλατεῖα — улица, площадь); ἐλάλησεν ἐπὶ καρδίαν αὐτῶν — говорил к сердцу их."
  7: "Ἰσχύσατε καὶ ἀνδρίζεσθε — укрепитесь и мужайтесь (ἀνδρίζομαι); μὴ πτοηθῆτε — не устрашитесь (πτοέω); ἀπὸ προσώπου — от лица; μεθ᾽ ἡμῶν πλείονες ἢ μετ᾽ αὐτοῦ — с нами больше, чем с ним."
  8: "βραχίονες σάρκινοι — мышцы плотские (βραχίων — рука, мышца); τοῦ σῴζειν καὶ τοῦ πολεμεῖν — чтобы спасать и воевать; κατεθάρσησεν — ободрился (καταθαρσέω)."
  9: "τοὺς παῖδας αὐτοῦ — слуг, отроков своих; ἐπὶ Λαχις — при Лахиса; πᾶσα ἡ στρατιά — всё войско."
  10: "Ἐπὶ τίνι … πεποίθατε — на что вы понадеялись (πείθω, перфект); κάθησθε ἐν τῇ περιοχῇ — сидите в осаде (περιοχή — обложение, укрепление)."
  11: "ἀπατᾷ ὑμᾶς — обманывает вас (ἀπατάω); τοῦ παραδοῦναι — чтобы предать; εἰς λιμὸν καὶ εἰς δίψαν — в голод и жажду."
  12: "περιεῖλεν — убрал (περιαιρέω); κατέναντι τοῦ θυσιαστηρίου — пред жертвенником (κατέναντι); θυμιάσετε — воскурите (θυμιάζω)."
  13: "γνώσεσθε — узнаете; πᾶσι τοῖς λαοῖς τῶν χωρῶν — всем народам стран; μὴ δυνάμενοι ἠδύναντο — «могши, могли ли» (усилительный оборот)."
  14: "ἐξωλέθρευσαν — истребили (ἐξολεθρεύω); ὅτι δυνήσεται — «что сможет» (в вопросе-восклицании); ὁ θεὸς ὑμῶν — Бог ваш."
  15: "μὴ ἀπατάτω — пусть не обманывает; μὴ πεποιθέναι ὑμᾶς ποιείτω — пусть не заставляет вас уповать; οὐ μὴ δύντηται — усиленное отрицание; ἐκ χειρὸς πατέρων μου — из руки отцов моих."
  16: "ἔτι — ещё; ἐπὶ κύριον θεὸν — против Господа Бога (ἐπί с вин. — «против»); παῖδα αὐτοῦ — раба Его. Слав. «ина (многа) глаголаша» — слово «многа» стоит в скобках как редакторское, в текст не внесено."
  17: "βιβλίον ἔγραψεν ὀνειδίζειν — книгу написал поносить (ὀνειδίζω); ἐξείλαντο — избавили (ἐξαιρέω); οὕτως οὐ μὴ ἐξέληται — так и не избавит."
  18: "ἐβόησεν φωνῇ μεγάλῃ Ιουδαιστί — воззвал громким голосом по-иудейски; τοῦ φοβῆσαι καὶ κατασπᾶσαι — чтобы устрашить и смутить (κατασπάω); ὅπως προκαταλάβωνται — чтобы овладеть."
  19: "ἐλάλησεν ἐπὶ θεὸν Ιερουσαλημ — говорил против Бога Иерусалима; ὡς καὶ ἐπὶ θεοὺς λαῶν — как и против богов народов; ἔργα χειρῶν ἀνθρώπων — дела рук человеческих. В гр. глагол в ед. ч., в ru — мн. ч."
  20: "προσηύξατο … καὶ ἐβόησαν εἰς τὸν οὐρανόν — помолился … и воззвали к небу (ед. и мн. ч. — шов текста)."
  21: "ἐξέτριψεν — истребил (ἐκτρίβω); πᾶν δυνατὸν πολεμιστήν — всякого сильного воина; στρατηγός — военачальник; μετὰ αἰσχύνης προσώπου — со стыдом лица; ἐκ κοιλίας αὐτοῦ — из чрева его; ῥομφαία — меч."
  22: "ἔσωσεν — спас; ἐκ χειρὸς πάντων — из руки всех; κατέπαυσεν αὐτοὺς κυκλόθεν — успокоил их отовсюду (καταπαύω)."
  23: "δῶρα … δόματα — дары … даяния; ὑπερήρθη κατ᾽ ὀφθαλμοὺς — возвысился в глазах (ὑπεραίρω); μετὰ ταῦτα — после этого."
  24: "ἠρρώστησεν ἕως θανάτου — заболел до смерти (ἀρρωστέω); σημεῖον ἔδωκεν — дал знамение."
  25: "ἀνταπόδομα — воздаяние; ἀνταπέδωκεν — воздал; ὑψώθη ἡ καρδία αὐτοῦ — возвысилось сердце его; ἐγένετο ἐπ᾽ αὐτὸν ὀργή — был на него гнев."
  26: "ἐταπεινώθη ἀπὸ τοῦ ὕψους τῆς καρδίας — смирился от высоты сердца (ταπεινόω); οὐκ ἐπῆλθεν ἐπ᾽ αὐτούς — не пришёл на них."
  27: "πλοῦτος καὶ δόξα πολλὴ σφόδρα — богатство и слава весьма великие; θησαυροί — сокровищницы; λίθος τίμιος — камень драгоценный; ἀρώματα — ароматы; ὁπλοθῆκαι — оружейные склады (ὁπλοθήκη); σκεύη ἐπιθυμητά — сосуды вожделенные."
  28: "γενήματα σίτου καὶ ἐλαίου καὶ οἴνου — произведения пшеницы, елея и вина; φάτνη — ясли (飼葉桶); μάνδρα — загон, двор (囲い)."
  29: "ἀποσκευή — имущество, состояние; εἰς πλῆθος — во множестве; πολλὴν σφόδρα — весьма многое."
  30: "ἔξοδος τοῦ ὕδατος Γιων τὸ ἄνω — выход верхней воды Геона (Γιων, ср. 3 Цар 1:33); κατηύθυνεν … κάτω πρὸς λίβα — направил вниз к югу (λίψ — юг; ru «к западной стороне» — по МТ); εὐοδώθη — был успешен."
  31: "τοῖς πρεσβευταῖς τῶν ἀρχόντων ἀπὸ Βαβυλῶνος — с послами начальников из Вавилона (πρεσβευτής); πυθέσθαι τὸ τέρας — спросить о чуде (τέρας); ἐγκατέλιπεν αὐτὸν κύριος — оставил его Господь; τοῦ πειράσαι — чтобы испытать."
  32: "τὰ κατάλοιπα τῶν λόγων — остаток слов; τὸ ἔλεος — милость; ἐν τῇ προφητείᾳ Ησαιου — в пророчестве Исаии; ἐπὶ βιβλίου βασιλέων — в книге царей."
  33: "ἐκοιμήθη — почил; ἐν ἀναβάσει τάφων υἱῶν Δαυιδ — на возвышении гробниц сынов Давида (ἀνάβασις — восхождение, возвышение; передано 高台); δόξαν καὶ τιμήν — славу и честь; ἐβασίλευσεν Μανασσης ἀντ αὐτοῦ — воцарился Манассия вместо него."
