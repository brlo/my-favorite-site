verses:
  1: "荒野[こうや]の幻[まぼろし]。嵐[あらし]が荒野を吹[ふ]き過[す]ぎるように、それは荒野から、地[ち]から来[く]る。恐[おそ]ろしい。"
  2: "幻[まぼろし]は厳[きび]しく、わたしに告[つ]げられた。捨[す]てる者[もの]は捨て、不法[ふほう]を行[おこな]う者[もの]は不法を行う。エラム人[じん]がわたしに向[む]かい、ペルシア人[じん]の使者[ししゃ]たちがわたしのところへ来[く]る。今[いま]、わたしは嘆[なげ]き、自分[じぶん]を慰[なぐさ]める。"
  3: "それゆえ、わたしの腰[こし]は力[ちから]なくなり、産[う]む女[おんな]のように苦[くる]しみがわたしを捕[と]らえた。わたしは聞[き]かないことで不正[ふせい]を行[おこな]い、見[み]ないことに急[いそ]いだ。"
  4: "わたしの心[こころ]は迷[まよ]い、不法[ふほう]がわたしを沈[しず]め、わたしの魂[たましい]は恐[おそ]れの中[なか]に立[た]っている。"
  5: "食卓[しょくたく]を整[ととの]えよ。飲[の]め、食[く]え。立[た]ち上[あ]がれ、君[きみ]たちよ、盾[たて]を整えよ。"
  6: "主[しゅ]はわたしにこう言[い]われた。「行[い]って、自分のために見張[みは]りを立[た]て、見[み]たことを告[つ]げよ。」"
  7: "そして、わたしは二騎[にき]の騎兵[きへい]を見[み]た。ろばに乗[の]る者[もの]と、らくだに乗る者[もの]である。よく聞[き]け。"
  8: "ウリヤを主[しゅ]の見張[みは]り所[じょ]に呼[よ]べ。そして彼[かれ]は言[い]った。「わたしは昼[ひる]もずっと立[た]ち、夜[よる]もずっと陣営[じんえい]のそばに立っていた。」"
  9: "見[み]よ、二頭立[にとうだ]ての車[くるま]に乗[の]る者が来[く]る。そして彼は答[こた]えて言った。「バビロンは倒[たお]れた、倒れた。そのすべての像[ぞう]と、手[て]で造[つく]ったものは地[ち]に砕[くだ]かれた。」"
  10: "残[のこ]された者[もの]、苦[くる]しむ者よ、聞[き]け。わたしが万軍[ばんぐん]の主[しゅ]から聞[き]いたことを聞け。イスラエルの神[かみ]がわたしたちに告[つ]げた。"
  11: "イドマヤの幻[まぼろし]。セイルから、わたしに呼[よ]びかける。「胸壁[きょうへき]を見張[みは]れ。」"
  12: "「わたしは朝[あさ]も夜[よる]も見張[みは]る。もし尋[たず]ねるなら、尋ねよ。わたしのところに住[す]め。」"
  13: "夕暮[ゆうぐ]れ、森[もり]の中[なか]で、デダンの道[みち]で夜[よる]を過[す]ごす。"
  14: "渇[かわ]く者[もの]に会[あ]わせて水[みず]を運[はこ]べ。テマンの地[ち]に住[す]む者[もの]よ、パンを携[たずさ]えて、逃[に]げる者に会え。"
  15: "逃[に]げる者が多[おお]く、迷[まよ]う者が多く、剣[つるぎ]が多く、張[は]られた弓[ゆみ]が多く、戦[いくさ]で倒[たお]れた者が多いからである。"
  16: "主[しゅ]はわたしにこう言[い]われた。「もう一年[いちねん]、雇[やと]い人[びと]の年[とし]のようにして、ケダルの子[こ]らの栄光[えいこう]は尽[つ]きる。"
  17: "強[つよ]いケダルの子らの弓[ゆみ]の残[のこ]りは少[すく]なくなる。」主[しゅ]が、イスラエルの神[かみ]が語[かた]られたからである。"

notes:
  1: "Τὸ ὅραμα τῆς ἐρήμου — «видение пустыни»: надписание, которого нет в слав. (слав. 21:1 сразу начинает «Якоже буря…»). Ὡς καταιγὶς δι᾽ ἐρήμου διέλθοι — «как буря, проходящая через пустыню» (καταιγίς — шквал, буря); ἐξ ἐρήμου ἐρχομένη ἐκ γῆς — «из пустыни приходящая, из земли». φοβερόν — ср. род «страшное»; по gr это конец 21:1, слав. относит «страшно» к 21:2 («страшно видение»). ru/МТ понимают «из земли страшной», но в греч. при γῆ было бы φοβερᾶς; передано отдельным «恐ろしい»."
  2: "τὸ ὅραμα καὶ σκληρὸν ἀνηγγέλη μοι — «видение и жестокое возвещено мне» (σκληρός — жёсткий, тяжкий); слав. «страшно видение и жестоко поведася мне». ὁ ἀθετῶν ἀθετεῖ, ὁ ἀνομῶν ἀνομεῖ — этимологическая фигура: «отвергающий отвергает, беззаконствующий беззаконствует» (ἀθετέω — отвергать, преступать; ἀνομέω — поступать беззаконно); передано «捨てる者は捨て、不法を行う者は不法を行う». ἐπ᾽ ἐμοὶ οἱ Αιλαμῖται — «на меня еламитяне»; слав. «на мя еламите». ru/МТ дают здесь повелительное «восходи, Елам, осаждай, Мид», чего в LXX нет. νῦν στενάξω καὶ παρακαλέσω ἐμαυτόν — «ныне воздохну и утешу себя» (παρακαλέω — утешать, ободрять)."
  3: "ἐνεπλήσθη ἡ ὀσφύς μου ἐκλύσεως — «наполнились чресла мои расслаблением» (ὀσφύς — чресла, поясница; ἔκλυσις — расслабление, изнеможение); слав. «наполнишася чресла моя разслабления». ὠδῖνες ἔλαβόν με ὡς τὴν τίκτουσαν — «муки схватили меня, как рождающую». ἠδίκησα τὸ μὴ ἀκοῦσαι — букв. «я поступил неправо, [чтобы] не слышать»; слав. «неправдовах еже не слышати»; оборот тёмный, передан буквально. ἐσπούδασα τὸ μὴ βλέπειν — «поспешил, чтобы не видеть»."
  4: "ἡ καρδία μου πλανᾶται — «сердце моё блуждает» (πλανάω — вводить в заблуждение, блуждать); слав. «сердце мое заблуждает». ἡ ἀνομία με βαπτίζει — «беззаконие погружает меня» (βαπτίζω — погружать, крестить); слав. «беззаконие погружает мя». ἡ ψυχή μου ἐφέστηκεν εἰς φόβον — «душа моя стоит в страхе» (ἐφίστημι — стоять над, предстоять). ru/МТ говорят о «вожделенной ночи», обратившейся в ужас, — этого в LXX нет."
  5: "ἑτοίμασον τὴν τράπεζαν — «приготовь стол» (ед. ч., затем мн.); πίετε, φάγετε — «пейте, ешьте»; слав. «уготовите трапезу, ядите, пийте» (порядок «пить — есть» по gr). ἀναστάντες, οἱ ἄρχοντες, ἑτοιμάσατε θυρεούς — «встав, князья, приготовьте щиты»: θυρεός — большой, ростовой щит (слав. «щиты»). Резкая смена пира и войны сохранена."
  6: "ὅτι οὕτως εἶπεν κύριος πρός με — вводная формула вне кавычек. Βαδίσας σεαυτῷ στῆσον σκοπόν — «пойдя, поставь себе стража» (σκοπός — страж, наблюдатель; слав. «стража»); καὶ ὃ ἂν ἴδῃς ἀνάγγειλον — «и что увидишь, возвести». Слова Господа даны в 「…」 (21:6)."
  7: "ἀναβάτας ἱππεῖς δύο — «всадников, всадников двух» (ἀναβάτης — всадник, едущий верхом); ἀναβάτην ὄνου καὶ ἀναβάτην καμήλου — «всадника на осле и всадника на верблюде» (слав. «на осляти» и «на велблюде»). ἀκρόασαι ἀκρόασιν πολλήν — «внимай вниманием многим», т. е. слушай очень внимательно; слав. «послушай слушанием многим». Императив обращён к пророку/стражу, поэтому вне кавычек."
  8: "κάλεσον Ουριαν εἰς τὴν σκοπιὰν κυρίου — «позови Урию на стражу Господню» (σκοπιά — наблюдательный пункт, стража); слав. «призови урию на стражбу Господню». Имя Ουριας (Урия) стоит в LXX и слав.; ru/МТ читают здесь «как лев» (אריה), поэтому у Синодального «закричал, как лев». Ἔστην διὰ παντὸς ἡμέρας — «стоял весь день»; ἐπὶ τῆς παρεμβολῆς ἔστην ὅλην τὴν νύκτα — «при ополчении стоял всю ночь» (παρεμβολή — стан, лагерь)."
  9: "ἀναβάτης συνωρίδος — «всадник пары», т. е. едущий в двухконной упряжке (συνωρίς — парная упряжка); слав. «всадник двоконный». Πέπτωκεν Βαβυλών — «пал Вавилон»; слав. удваивает «паде, паде вавилон» (под влиянием МТ; ср. Откр 14:8; 18:2 «Πέσεν, πέσεν Βαβυλών»), поэтому в тексте «倒れた、倒れた». τὰ ἀγάλματα αὐτῆς — «изваяния, кумиры её» (ἄγαλμα); τὰ χειροποίητα αὐτῆς — «рукотворённое её»; συνετρίβησαν εἰς τὴν γῆν — «разбиты на землю»."
  10: "οἱ καταλελειμμένοι καὶ οἱ ὀδυνώμενοι — «оставленные и болящие» (ὀδυνάω — мучить, причинять боль); слав. «оставшиися и болезнующии». ru/МТ обращаются к «измолоченному» и «сыну гумна», чего в LXX нет. ἀκούσατε ἃ ἤκουσα παρὰ κυρίου σαβαωθ — «услышьте, что я слышал от Господа Саваофа»; ὁ θεὸς τοῦ Ισραηλ ἀνήγγειλεν ἡμῖν — «Бог Израилев возвестил нам»."
  11: "Τὸ ὅραμα τῆς Ιδουμαίας — «видение Идумеи» (Ιδουμαία — Идумея, Едом); слав. надписания не имеет, ru/МТ называют «Дума» (דומה). Πρὸς ἐμὲ καλεῖ παρὰ τοῦ Σηιρ — «ко мне взывает от Сеира» (Σηιρ — Сеир); слав. «ко мне зови от сиира» читает καλεῖ как императив. Φυλάσσετε ἐπάλξεις — «стерегите зубцы/груди стен» (ἔπαλξις — зубец стены, бруствер); слав. «стрегите забрала». Знаменитого вопроса «сторож, сколько ночи?» в LXX нет — он из МТ и стоит у ru."
  12: "φυλάσσω τὸ πρωῒ καὶ τὴν νύκτα — «стерегу утро и ночь» (πρωί — утро); слав. «стрегу заутра и нощию». ἐὰν ζητῇς, ζήτει — «если ищешь, ищи»; καὶ παρ᾽ ἐμοὶ οἴκει — «и у меня живи, оставайся» (οἰκέω — жить, обитать); слав. «и у мене обитай». ru/МТ добавляют «приближается утро, но ещё ночь» — этого в LXX нет. Смена говорящего (кричащий из Сеира — страж) в греч. не обозначена; ответ стража в 「…」."
  13: "ἐν τῷ δρυμῷ ἑσπέρας κοιμηθήσῃ — «в лесу вечером заночуешь» (δρυμός — дубрава, лес; κοιμάω — ложиться спать); ἐν τῇ ὁδῷ Δαιδαν — «на пути Дедана» (Δαιδαν — Дедан). Слав. добавляет «или» («или на пути деданове»), чего в LXX нет. Надписания «Пророчество об Аравии» в LXX нет — оно из МТ и стоит у ru."
  14: "εἰς συνάντησιν διψῶντι ὕδωρ φέρετε — «навстречу жаждущему воду несите» (συνάντησις — встреча); οἱ ἐνοικοῦντες ἐν χώρᾳ Θαιμαν — «живущие в земле Феман» (Θαιμαν — Феман, не Фема); ἄρτοις συναντᾶτε τοῖς φεύγουσιν — «хлебами встречайте бегущих» (ἄρτοι — хлебы). Слав. 21:14 присоединяет к себе «бежащыя» и «множества ради убиенных», которые по gr относятся к 21:15; деление держим по gr."
  15: "διὰ τὸ πλῆθος повторено пять раз: «из-за множества бегущих, и множества блуждающих, и множества меча, и множества натянутых стрел, и множества павших на войне»; слав. передаёт «множества ради…», причём «бегущих» у него оказалось в 21:14. μάχαιρα — меч; τοξεύματα διατεταμένα — натянутые луки/стрелы (τοξεύω — стрелять из лука); ἐν τῷ πολέμῳ — на войне."
  16: "ὅτι οὕτως εἶπέν μοι κύριος — вводная формула вне кавычек. Ἔτι ἐνιαυτὸς ὡς ἐνιαυτὸς μισθωτοῦ — «ещё год, как год наёмника» (μισθωτός — наёмный работник): точный, отсчитанный срок; слав. «еще лето (едино), якоже лето наемника». ἐκλείψει ἡ δόξα τῶν υἱῶν Κηδαρ — «исчезнет слава сынов Кедара» (Κηδαρ — Кедар). Слова Господа открываются здесь и закрываются в 21:17 перед «ибо Господь сказал»."
  17: "τὸ κατάλοιπον τῶν τοξευμάτων τῶν ἰσχυρῶν υἱῶν Κηδαρ — «остаток стрел/луков сильных сынов Кедара»; ἔσται ὀλίγον — «будет мал». διότι κύριος ἐλάλησεν ὁ θεὸς Ισραηλ — «ибо сказал Господь, Бог Израилев»: заключительная формула вне кавычек; слав. «яко Господь Бог израилев глагола»."
