# jp-box, Исаия, глава 21. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для глав 21–24 отсутствует; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 21: 1–2 видение пустыни, «грабитель грабит», Елам и Персия; 3–4 ужас пророка;
# 5 пир и приготовление щитов; 6–9 страж и падение Вавилона; 10 слово к остатку;
# 11–12 видение Идумеи, ночной страж у Сеира; 13–17 Дедан и Кедар, бегущие от меча.
# Речь Господа — 21:6 и 21:16–17 (в 「…」); слова стража — 21:8 и 21:9; зов из Сеира
# и ответ стража — 21:11–12.
# Нумерация по gr: 17 стихов; деление совпадает с csl-ru и ru.
# Слав. в 21:1 опускает надписание «Видение пустыни»; слав. 21:2 относит к себе
# «страшно» (φοβερόν), которое по gr стоит в конце 21:1. Слав. 21:9 удваивает «паде».
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).

