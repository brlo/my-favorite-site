# jp-box, Псалтирь, псалом 116. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация — славяно-синодальная (csl-ru): в слав. надписание отдельным стихом
# не стоит, поэтому наш стих 0 (надписание) влит в начало стиха 1; дальше номера 1..2.
# Псалом 116: краткий призыв к хвале — все народы (1), милость и истина Господня (2).
# Красного и синего нет. Кавычек нет: весь псалом — призыв к хвале, обращённый
# к народам, а не переданная чужая речь.
# 〔…〕 нет: все слова в gr-lxx-byz есть.
# セラ (διάψαλμα) в этой главе нет.
# Сносок ⟨…⟩ нет. jp-ni не использовался.

tr_code: jp-box
book: ps
chapter: 116
draft: true

verses:
  1: "アレルヤ。国[くに]々[ぐに]の民[たみ]よ、主[しゅ]を賛美[さんび]せよ。もろもろの民[たみ]よ、主[しゅ]をほめたたえよ。"
  2: "主[しゅ]のあわれみはわたしたちの上[うえ]に強[つよ]く、主[しゅ]の真実[しんじつ]はとこしえに保[たも]たれるからである。"

notes:
  1: "Αλληλουια — アレルヤ (Откр 19:1). В ру-базе надписание стоит стихом 0 (в csl-ru отдельного стиха нет, влито в ст. 1). Αἰνεῖτε τὸν κύριον, πάντα τὰ ἔθνη — 国々の民よ、主を賛美せよ (ἔθνη — народы, языки). ἐπαινέσατε αὐτόν, πάντες οἱ λαοί — もろもろの民よ、主をほめたたえよ (λαοί); два синонима ἔθνη/λαοί переданы 国々の民/もろもろの民, повтор призыва сохранён. Стих цитируется в Рим 15:11."
  2: "ὅτι ἐκραταιώθη τὸ ἔλεος αὐτοῦ ἐφ᾽ ἡμᾶς — 主のあわれみはわたしたちの上に強く (κραταιόω — «укрепляться, делаться сильным»). καὶ ἡ ἀλήθεια τοῦ κυρίου μένει εἰς τὸν αἰῶνα — 主の真実はとこしえに保たれる (ἀλήθεια — 真実[しんじつ], как в Пс 113:9; μένω — «пребывать»). В ру-базе в конце стиха ещё «Аллилуия», в gr-lxx-byz его нет — не добавлено."
