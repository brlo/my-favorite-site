verses:
  1: "「下[くだ]って、地[ち]に座[すわ]れ。バビロンの処女[おとめ]の娘[むすめ]よ。暗[やみ]の中[なか]に入[はい]れ、カルデア人[じん]の娘よ。もはやあなたは、柔[やわ]らかで贅沢[ぜいたく]な者[もの]と呼[よ]ばれることはない。"
  2: "石臼[いしうす]を取[と]って粉[こな]を挽[ひ]け。覆[おお]いを脱[ぬ]ぎ、白髪[しらが]を現[あらわ]にし、脛[すね]をあらわにして川[かわ]を渡[わた]れ。"
  3: "あなたの恥[はじ]はあらわにされ、あなたの辱[はずかし]めは見[み]られる。わたしはあなたから正[ただ]しいものを取[と]り、もはや人[ひと]びとに引[ひ]き渡[わた]さない。」"
  4: "あなたを贖[あがな]う方[かた]、その名[な]を万軍[ばんぐん]の主[しゅ]、イスラエルの聖[せい]なる方[かた]という方[かた]が言[い]われた。"
  5: "「打[う]ちひしがれて座[すわ]れ。暗[やみ]の中[なか]に入[はい]れ、カルデア人[じん]の娘[むすめ]よ。もはやあなたは王国[おうこく]の力[ちから]と呼[よ]ばれることはない。"
  6: "わたしはわたしの民[たみ]に怒[いか]った。あなたはわたしの受[う]け継[つ]ぎを汚[けが]した。わたしが彼[かれ]らをあなたの手[て]に渡[わた]したのに、あなたは彼らにあわれみをかけてやらなかった。年老[としお]いた者[もの]には、極[きわ]めて重[おも]い軛[くびき]を負[お]わせた。"
  7: "あなたは言[い]った。『わたしは永遠[えいえん]に君臨[くんりん]する』と。あなたはこれらのことを心[こころ]に思[おも]いめぐらさず、終[お]わりの日[ひ]のことを考[かんが]えもしなかった。"
  8: "しかし今[いま]、これを聞[き]け。贅沢[ぜいたく]に生[い]き、安[あん]心[しん]して座[すわ]り、心[こころ]のうちに『わたしはわたし、わたしのほかにだれもいない。わたしは寡婦[かふ]として座[すわ]ることも、子[こ]を失[うしな]うこともない』と言[い]う者[もの]よ。"
  9: "しかし、この二[ふた]つのことが、一[いち]日[にち]のうちに、にわかにあなたに臨[のぞ]む。寡婦[かふ]となることと子[こ]を失[うしな]うこととが、にわかにあなたに臨む。あなたの呪術[じゅじゅつ]と、きわめて強[つよ]い呪術師[じゅじゅつし]たちの力[ちから]があっても、それを防[ふせ]ぐことはできない。"
  10: "あなたは自分[じぶん]の悪[わる]さに望[のぞ]みを置[お]いていた。あなたは『わたしはわたし、わたしのほかにだれもいない』と言[い]ったからである。知[し]れ。これらのことをわきまえることも、あなたの淫[いん]行[こう]も、あなたにとって恥[はじ]となる。あなたは心[こころ]のうちに『わたしはわたし、わたしのほかにだれもいない』と言った。"
  11: "滅[ほろ]びがあなたに臨[のぞ]む。だが、あなたは知[し]らない。穴[あな]が現[あらわ]れ、あなたはそこに落[お]ちる。苦[くる]しみがあなたに臨む。だが、あなたは清[きよ]くなれない。滅[ほろ]びがにわかにあなたに臨む。だが、あなたは知らない。"
  12: "立[た]って、あなたの呪術[じゅじゅつ]と、若[わか]いときから学[まな]んできた多[おお]くのまじないを用[もち]いてみよ。もしかすると、役[やく]に立[た]つことができるかもしれない。"
  13: "あなたは多[おお]くの計[はか]りごとで疲[つか]れ果[は]てた。天[てん]の星[ほし]を読[よ]む者[もの]たち、星を見[み]る者たちを立[た]たせ、彼らにあなたを救[すく]わせてみよ。これからあなたに起[お]こることを告[つ]げさせてみよ。"
  14: "見[み]よ、彼[かれ]らはみな、火[ひ]の上[うえ]の枯[か]れ枝[えだ]のように焼[や]かれ、自分[じぶん]の魂[たましい]を炎[ほのお]から救[すく]い出[だ]すことはできない。あなたには火の炭[すみ]がある。その上[うえ]に座[すわ]るがよい。"
  15: "これがあなたの助[たす]けとなる者[もの]たちである。あなたは若[わか]いときから、移[うつ]り変[か]わりの中で労[ろう]してきた。人[ひと]はそれぞれ自分[じぶん]ひとりで迷[まよ]い出[で]た。あなたに救[すく]いはない。」"

notes:
  1: "Κατάβηθι κάθισον ἐπὶ τὴν γῆν — «сойди, сядь на землю» (слав. «сниди, сяди на земли»; в ru/МТ «на прах» — по МТ); παρθένος θυγάτηρ Βαβυλῶνος — «дева, дочь Вавилона»: город как женщина (処女の娘), ср. 23:12. εἴσελθε εἰς τὸ σκότος — «войди во тьму» (плен и унижение); ὅτι οὐκέτι προστεθήσῃ κληθῆναι ἁπαλὴ καὶ τρυφερά — «ибо больше не приложишься называться нежной и роскошной» (προστίθημι — прибавлять; слав. «не приложиши ксему прозыватися мягка и юна»)."
  2: "λαβὲ μύλον, ἄλεσον ἄλευρον — «возьми жернов, мели муку» (μύλος — 石臼; работа рабыни); ἀποκάλυψαι τὸ κατακάλυμμά σου — «открой покрывало твоё» (κατακάλυμμα); ἀνακάλυψαι τὰς πολιάς — «открой седины» (πολιά — седина; слав. «открый седины»); ἀνάσυραι τὰς κνήμας — «подбери голени» (κνήμη; ἀνασύρω — подбирать одежду; слав. «возсучи голени»); διάβηθι ποταμούς — «перейди реки»."
  3: "ἀνακαλυφθήσεται ἡ αἰσχύνη σου — «откроется срам твой» (αἰσχύνη); φανήσονται οἱ ὀνειδισμοί σου — «явятся поношения твои» (ὀνειδισμός). τὸ δίκαιον ἐκ σοῦ λήμψομαι — «возьму от тебя праведное» (слав. «праведное от тебе возму»): суд над ней; οὐκέτι μὴ παραδῶ ἀνθρώποις — «больше не предам людям» (παραδίδωμι). В ru/МТ «Совершу мщение и не пощажу никого» — иное чтение, не внесено. Здесь закрывается первая речь 「…」."
  4: "εἶπεν ὁ ῥυσάμενός σε κύριος σαβαωθ ὄνομα αὐτῷ ἅγιος Ισραηλ — «сказал избавивший тебя Господь Саваоф, имя Ему — Святой Израилев»: доксологическая вставка (ср. 43:14; 48:17), в слав. та же. εἶπεν вводит речь 47:5, поэтому сама формула — вне кавычек."
  5: "Κάθισον κατανενυγμένη — «сядь сокрушённая, поражённая» (κατανύσσομαι — быть пронзённым, сокрушённым; слав. «сяди умилена»); εἴσελθε εἰς τὸ σκότος — «войди во тьму» (повтор из 47:1); οὐκέτι μὴ κληθῇς ἰσχὺς βασιλείας — «больше не назовёшься крепостью царства» (слав. «крепость царства»)."
  6: "παρωξύνθην ἐπὶ τῷ λαῷ μου — «Я разгневался на народ Мой» (παροξύνω); ἐμίανας τὴν κληρονομίαν μου — «ты осквернила наследие Моё» (μιαίνω; 2 л. ед. ч.; в ru «уничижил», по МТ — держим LXX и слав.). ἐγὼ ἔδωκα εἰς τὴν χεῖρά σου — «Я дал [их] в руку твою»; σὺ δὲ οὐκ ἔδωκας αὐτοῖς ἔλεος — «а ты не дала им милости»; τοῦ πρεσβυτέρου ἐβάρυνας τὸν ζυγὸν σφόδρα — «старцу отягчила ярмо весьма» (βαρύνω; 軛)."
  7: "καὶ εἶπας· Εἰς τὸν αἰῶνα ἔσομαι ἄρχουσα — «и ты сказала: в век буду владычицей» (ἄρχουσα, причастие ж. р.; в тексте 君臨する); οὐκ ἐνόησας ταῦτα ἐν τῇ καρδίᾳ σου — «не уразумела этого в сердце твоём»; οὐδὲ ἐμνήσθης τὰ ἔσχατα — «и не вспомнила последнего». Слова Вавилона — 『…』."
  8: "ἡ τρυφερὰ ἡ καθημένη πεποιθυῖα — «роскошная, сидящая в уверенности» (τρυφερός; πεποίθα, perfect); ἡ λέγουσα ἐν τῇ καρδίᾳ αὐτῆς — «говорящая в сердце своём». Ἐγώ εἰμι, καὶ οὐκ ἔστιν ἑτέρα — «Я есмь, и нет иной» (слав. «аз есмь, и несть иныя»); οὐ καθιῶ χήρα — «не сяду вдовою» (χήρα — 寡婦); οὐδὲ γνώσομαι ὀρφανείαν — «и не познаю сиротства», т. е. не потеряю детей (ὀρφανεία)."
  9: "ἥξει ἐξαίφνης ἐπὶ σὲ τὰ δύο ταῦτα ἐν μιᾷ ἡμέρᾳ — «придут на тебя эти две вещи в один день внезапно»; χηρεία καὶ ἀτεκνία — «вдовство и бездетность» (χηρεία). ἥξει ἐξαίφνης ἐπὶ σὲ ἐν τῇ φαρμακείᾳ σου — «придёт внезапно на тебя при твоём волшебстве» (φαρμακεία — 呪術; датив обстоятельства, по смыслу «несмотря на», так и передано); ἐν τῇ ἰσχύι τῶν ἐπαοιδῶν σου σφόδρα — «и при великой силе заклинателей твоих» (ἐπαοιδός — 呪術師; слав. «в крепости волхвов твоих зело»)."
  10: "τῇ ἐλπίδι τῆς πονηρίας σου — «надеждою на злобу твою» (датив, продолжает 47:9; слав. начинает с него 47:10, как и gr). σὺ γὰρ εἶπας· Ἐγώ εἰμι, καὶ οὐκ ἔστιν ἑτέρα — «ибо ты сказала: Я есмь, и нет иной»: в LXX фраза стоит дважды (в начале и в конце стиха), повтор сохранён. γνῶθι ὅτι ἡ σύνεσις τούτων — «знай, что разумение этого» (σύνεσις; слав. «смышление сих»); ἡ πορνεία σου — «блуд твой» (идолослужение, 淫行); ἔσται σοι αἰσχύνη — «будет тебе срамом». В ru/МТ «Мудрость твоя и знание твоё сбили тебя» — иное чтение."
  11: "καὶ ἥξει ἐπὶ σὲ ἀπώλεια, καὶ οὐ μὴ γνῷς — «и придёт на тебя погибель, и не узнаешь»: троекратная анафора ἥξει ἐπὶ σὲ … οὐ μὴ γνῷς сохранена. βόθυνος — «яма, пропасть» (слав. «пропасть»); ἐμπεσῇ εἰς αὐτόν — «упадёшь в неё»; ταλαιπωρία — «бедствие, страдание» (слав. «печаль»); οὐ μὴ δυνήσῃ καθαρὰ γενέσθαι — «не сможешь стать чистой» (слав. «не возможеши чиста быти»)."
  12: "στῆθι νῦν ἐν ταῖς ἐπαοιδαῖς σου — «стань же с заклинаниями твоими» (ἐπαοιδή); τῇ πολλῇ φαρμακείᾳ σου — «с великим волшебством твоим»; ἃ ἐμάνθανες ἐκ νεότητός σου — «которому ты училась от юности твоей»; εἰ δυνήσῃ ὠφεληθῆναι — «если сможешь получить пользу» (ὠφελέομαι — получить помощь), т. е. «может быть, поможет»."
  13: "κεκοπίακας ἐν ταῖς βουλαῖς σου — «ты утомилась в советах твоих» (κοπιάω; слав. «утрудилася еси в советех твоих»); στήτωσαν καὶ σωσάτωσάν σε οἱ ἀστρολόγοι τοῦ οὐρανοῦ — «пусть встанут и спасут тебя звездочёты небесные» (ἀστρολόγος); οἱ ὁρῶντες τοὺς ἀστέρας — «смотрящие на звёзды»; ἀναγγειλάτωσάν σοι τί μέλλει ἐπὶ σὲ ἔρχεσθαι — «пусть возвестят тебе, что имеет прийти на тебя». В ru/МТ добавлены «предвещатели по новолуниям» — по МТ, не внесено."
  14: "ἰδοὺ πάντες ὡς φρύγανα ἐπὶ πυρὶ κατακαήσονται — «вот, все, как хворост на огне, сгорят» (φρύγανον — сушняк, хворост; 枯れ枝; слав. «яко хврастие»); οὐ μὴ ἐξέλωνται τὴν ψυχὴν αὐτῶν ἐκ φλογός — «не избавят души своей от пламени»; ὅτι ἔχεις ἄνθρακας πυρός, κάθισαι ἐπ᾿ αὐτούς — «ибо у тебя есть угли огня, сядь на них» (иронично: сядешь на угли). В ru/МТ иное («не осталось угля, чтобы погреться») — по МТ."
  15: "οὗτοι ἔσονταί σοι βοήθεια — «эти будут тебе помощью»; ἐκοπίασας ἐν τῇ μεταβολῇ σου ἐκ νεότητος — «ты трудилась в перемене твоей от юности» (μεταβολή — перемена; слав. «в преложении»; в ru/МТ «вела торговлю» — по МТ); ἄνθρωπος καθ᾿ ἑαυτὸν ἐπλανήθη — «человек сам по себе заблудился» (καθ᾿ ἑαυτόν — каждый у себя, врозь); σοὶ δὲ οὐκ ἔσται σωτηρία — «тебе же не будет спасения». Глава кончается без формулы; здесь закрывается речь 「…」."
