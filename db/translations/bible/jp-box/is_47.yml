# jp-box, Исаия, глава 47. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный, с МТ) — только для понимания,
# не источник. jp-joc в гл. 47 отсутствует; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 47: 1–3 «сойди, сядь на землю, дочь Вавилона» — унижение гордого города;
# 4 вставная доксологическая формула; 5–7 «сядь в темноте, дочь Халдеев», гнев Господа
# на Свой народ и её жестокость; 8–11 «я, и нет иной» — внезапное вдовство и бездетность
# при всех чародействах; 12–15 бесполезность волхвов и звездочётов.
# Речи: вся глава — слово Господа к Вавилону в 「…」 (1–3 и 5–15). 47:4 — формула
# вне кавычек: εἶπεν вводит речь 47:5. Собственные слова Вавилона — 『…』
# (47:7, 47:8, 47:10, дважды).
# Нумерация по gr: 15 стихов; у csl и ru тоже 15, деление внутри главы совпадает
# (слав. 47:9 кончается так же, «в надеянии злобы твоея» открывает 47:10, как и gr).
# Паритет: 47:3 — LXX «τὸ δίκαιον ἐκ σοῦ λήμψομαι», в ru/МТ «Совершу мщение»;
# 47:6 — LXX и слав. «ты осквернила наследие Моё» (2 л.), в ru «уничижил… и предал»
# (по МТ); 47:14 — LXX «у тебя есть угли огня, сядь на них», в ru/МТ иначе;
# 47:15 — LXX «в перемене твоей», в ru/МТ «вела торговлю». Держим LXX и слав.
# 〔…〕 нет. Сносок ⟨…⟩ нет: 処女, 石臼, 寡婦, 呪術, 星, 炭, 軛, 栄光 уже в корпусе.
# Имена — транслитерация греческого (LXX): バビロン, カルデア人.

