verses:
  1: "イスラエルの子[こ]らの会衆[かいしゅう]はすべて、エリムを発[た]って、エリムとシナイとの間[あいだ]にあるシンの荒[あ]れ野[の]へ来[き]た。それは、彼[かれ]らがエジプトの地[ち]を出[で]てから、第二[だい]の月[つき]の十五[じゅうご]日[にち]のことであった。"
  2: "イスラエルの子[こ]らの会衆[かいしゅう]はすべて、モーセとアロンに対[たい]してつぶやいた。"
  3: "イスラエルの子[こ]らは彼[かれ]らに言[い]った。「わたしたちは、エジプトの地[ち]で、主[しゅ]に打[う]たれて死[し]んでいたらよかったのに。あのとき、わたしたちは肉[にく]の鍋[なべ]のそばに座[すわ]って、パンを満腹[まんぷく]するまで食[た]べていた。ところが、あなたがたは、この全会衆[ぜんかいしゅう]を飢[う]えで殺[ころ]すために、わたしたちをこの荒[あ]れ野[の]へ連[つ]れ出[だ]したのである。」"
  4: "主[しゅ]はモーセに言[い]われた。「見[み]よ、わたしはあなたがたに天[てん]からパンを降[ふ]らせる。民[たみ]は出[で]て行[い]って、その日[ひ]の分[ぶん]を日[ひ]ごとに集[あつ]めよ。彼[かれ]らがわたしの律法[りっぽう]に従[したが]って歩[ある]むかどうかを、わたしは試[こころ]みるためである。"
  5: "第六[だいろく]の日[ひ]には、彼[かれ]らは持[も]ち帰[かえ]るものを整[ととの]える。それは、日[ひ]ごとに集[あつ]める分[ぶん]の二倍[にばい]になる。」"
  6: "モーセとアロンは、イスラエルの子[こ]らの全会衆[ぜんかいしゅう]に言[い]った。「夕[ゆう]べには、あなたがたは、主[しゅ]があなたがたをエジプトの地[ち]から導[みちび]き出[だ]されたことを知[し]る。"
  7: "また朝[あさ]には、主[しゅ]の栄光[えいこう]を見[み]る。主[しゅ]が、あなたがたが神[かみ]に対[たい]してつぶやくのを聞[き]かれたからである。わたしたちは何者[なにもの]だろうか。あなたがたがわたしたちに向[む]かってつぶやくとは。」"
  8: "モーセは言[い]った。「主[しゅ]が夕[ゆう]べにあなたがたに肉[にく]を食[た]べさせ、朝[あさ]にはパンを満腹[まんぷく]まで与[あた]えられるのは、主[しゅ]が、あなたがたがわたしたちに向[む]かってつぶやくそのつぶやきを、聞[き]かれたからである。わたしたちは何者[なにもの]だろうか。あなたがたのつぶやきは、わたしたちに対[たい]するものではなく、神[かみ]に対[たい]するものだからである。」"
  9: "モーセはアロンに言[い]った。「イスラエルの子[こ]らの全会衆[ぜんかいしゅう]に言[い]いなさい。『神[かみ]の前[まえ]に近[ちか]づきなさい。神はあなたがたのつぶやきを聞[き]かれたからである。』」"
  10: "アロンがイスラエルの子[こ]らの全会衆[ぜんかいしゅう]に語[かた]っているとき、彼[かれ]らは荒[あ]れ野[の]の方[ほう]へ向[む]き直[なお]った。すると、見[み]よ、主[しゅ]の栄光[えいこう]が雲[くも]の中[なか]に現[あらわ]れた。"
  11: "主[しゅ]はモーセに語[かた]って言[い]われた。"
  12: "「わたしはイスラエルの子[こ]らのつぶやきを聞[き]いた。彼[かれ]らに言[い]え。『夕[ゆう]べには肉[にく]を食[た]べ、朝[あさ]にはパンで満[み]たされる。そして、あなたがたは、わたしが主[しゅ]、あなたがたの神[かみ]であることを知[し]る。』」"
  13: "夕[ゆう]べになると、うずらが上[のぼ]って来[き]て宿営[しゅくえい]を覆[おお]い、朝[あさ]には、宿営[しゅくえい]の周[まわ]りに露[つゆ]が降[お]りてとどまっていた。"
  14: "そして、見[み]よ、荒[あ]れ野[の]の面[おもて]には、コリアンダーの種[たね]のように細[こま]かく、地[ち]の上の霜[しも]のように白[しろ]いものがあらわれた。"
  15: "イスラエルの子[こ]らはそれを見[み]て、互[たがい]に言[い]った。「これは何[なん]だ。」彼[かれ]らはそれが何[なに]であるかを知[し]らなかったからである。モーセは彼[かれ]らに言[い]った。「これは、主[しゅ]があなたがたに食[た]べるために与[あた]えられたパンである。"
  16: "主[しゅ]が命[めい]じられたことはこうである。『あなたがたはそれぞれ、食[た]べる分[ぶん]だけを集[あつ]めよ。一[ひと]人[り]につき一[いち]ゴモル⟨穀物[こくもつ]を量[はか]る単位[たんい]。約[やく]二百二十[にひゃくにじゅう]リットル。⟩、あなたがたの天幕[てんまく]にいる人[ひと]の数[かず]に従[したが]って、それぞれ自分[じぶん]の天幕[てんまく]の人[ひと]々[びと]とともに集[あつ]めよ。』」"
  17: "イスラエルの子[こ]らはそのとおりに行[おこな]い、集[あつ]めた。ある者[もの]は多[おお]く、ある者[もの]は少[すく]なく集[あつ]めた。"
  18: "そして、ゴモルで量[はか]ると、多[おお]く集[あつ]めた者[もの]にも余[あま]りがなく、少[すく]なく集[あつ]めた者[もの]にも足[た]りないことがなかった。それぞれ、自分[じぶん]の食[た]べる分[ぶん]を集[あつ]めたのである。"
  19: "モーセは彼[かれ]らに言[い]った。「だれも、それを朝[あさ]まで残[のこ]してはならない。」"
  20: "しかし、彼[かれ]らはモーセに聞[き]き従[したが]わず、ある者[もの]たちは朝[あさ]までそれを残[のこ]した。すると、それに虫[むし]が湧[わ]き、悪[にく]いにおいがした。モーセは彼[かれ]らに腹[はら]を立[た]てた。"
  21: "彼[かれ]らは朝[あさ]ごとに、それぞれ食[た]べる分[ぶん]を集[あつ]めた。日[ひ]が熱[あつ]くなると、それは溶[と]けた。"
  22: "第六[だいろく]の日[ひ]には、彼[かれ]らは必要[ひつよう]な分[ぶん]を二倍[にばい]、すなわち一[ひと]人[り]に二[ふた]つのゴモルを集[あつ]めた。会衆[かいしゅう]の長[おさ]たちはすべて来[き]て、それをモーセに告[つ]げた。"
  23: "モーセは彼[かれ]らに言[い]った。「主[しゅ]が語[かた]られたことはこうである。『明日[あす]は安息日[あんそくび]⟨ユダヤの週[しゅう]の第七[だいしち]の日[ひ]。仕事[しごと]を休[やす]み、神[かみ]を礼拝[れいはい]する日[ひ]。⟩、主[しゅ]に聖[せい]なる休[やす]みの日[ひ]である。焼[や]くべきものは焼[や]き、煮[に]るべきものは煮[に]よ。余[あま]るものはすべて、朝[あさ]まで蓄[たくわ]えておけ。』」"
  24: "彼[かれ]らはモーセが命[めい]じたとおりに、それを朝[あさ]まで残[のこ]したが、悪[にく]いにおいもせず、虫[むし]もわかなかった。"
  25: "モーセは言[い]った。「今日[きょう]、それを食[た]べなさい。今日[きょう]は、主[しゅ]の安息日[あんそくび]だからである。野[の]では、今日[きょう]、それを見[み]つけることはない。"
  26: "六日[むいか]の間[あいだ]はそれを集[あつ]めなさい。しかし、第七[だいしち]の日[ひ]は安息日[あんそくび]であるから、その日[ひ]には何[なに]もない。」"
  27: "第七[だいしち]の日[ひ]になると、民[たみ]の中[なか]からある者[もの]たちが出[で]て行[い]って集[あつ]めようとしたが、何[なに]も見[み]つからなかった。"
  28: "主[しゅ]はモーセに言[い]われた。「いつまで、あなたがたはわたしの戒[いまし]めとわたしの律法[りっぽう]に聞[き]き従[したが]おうとしないのか。"
  29: "見[み]よ、主[しゅ]があなたがたにこの日[ひ]を、すなわち安息日[あんそくび]を与[あた]えられた。それゆえ、主[しゅ]は第六[だいろく]の日[ひ]に、あなたがたに二日分[ふつかぶん]のパンを与[あた]えられる。それぞれ自分[じぶん]の家[いえ]に座[すわ]っていなさい。第七[だいしち]の日[ひ]には、だれも自分[じぶん]の場所[ばしょ]から出[で]てはならない。」"
  30: "民[たみ]は第七[だいしち]の日[ひ]に休[やす]んだ。"
  31: "イスラエルの子[こ]らは、その名[な]をマナ⟨「これは何[なん]だ」という意[い]の名[な]。荒[あ]れ野[の]で神[かみ]が与[あた]えた食物[しょくもつ]。⟩と名[な]づけた。それはコリアンダーの種[たね]のように白[しろ]く、その味[あじ]は蜂蜜[はちみつ]で練[ね]った菓子[かし]のようであった。"
  32: "モーセは言[い]った。「主[しゅ]が命[めい]じられたことはこうである。『一[いち]ゴモル分[ぶん]のマナを、あなたがたの代々[よよ]のために蓄[たくわ]えておけ。それは、わたしがあなたがたをエジプトの地[ち]から導[みちび]き出[だ]したとき、荒[あ]れ野[の]で、あなたがたに食[た]べさせたパンを、彼[かれ]らが見[み]るためである。』」"
  33: "モーセはアロンに言[い]った。「一[ひと]つの金[きん]の壺[つぼ]を取[と]り、その中[なか]に一[いち]ゴモル分[ぶん]のマナを満[み]たし、それを神[かみ]の前[まえ]に置[お]いて、あなたがたの代々[よよ]のために蓄[たくわ]えておきなさい。」"
  34: "主[しゅ]がモーセに命[めい]じられたとおりに、アロンはそれを、証[あかし]の箱[はこ]の前[まえ]に、蓄[たくわ]えておくために置[お]いた。"
  35: "イスラエルの子[こ]らは、人[ひと]の住[す]む地[ち]に来[く]るまで、四十年[よんじゅうねん]の間[あいだ]マナを食[た]べた。彼[かれ]らはフェニキアの地方[ちほう]に来[く]るまで、マナを食[た]べた。"
  36: "一[いち]ゴモルは、三[みっ]つの量[りょう]の十分[じゅうぶん]の一[いち]であった。"

notes:
  1: "Ἀπῆραν ἐξ Αιλιμ — エリムを発って (Αιλιμ — Елим, стан после Мерры). συναγωγὴ υἱῶν Ισραηλ — 会衆, букв. «собрание» (в НЗ то же слово — «синагога»; здесь — стан). ἔρημος Σιν — シンの荒れ野: Син, не Синай (ср. «между Елимом и Синаем»). πεντεκαιδεκάτῃ ἡμέρᾳ τῷ μηνὶ τῷ δευτέρῳ — 第二の月の十五日: второй месяц по выходе из Египта, дата по LXX. ἐξεληλυθότων αὐτῶν — род. самостоятельный («по выходе их»)."
  2: "διεγόγγυζεν — つぶやいた (γογγύζω, ропот Израиля в пустыне). ἐπὶ Μωυσῆν καὶ Ααρων — на Моисея и Аарона (ἐπί + вин.). У LXX здесь нет «в пустыне» — это добавление масоретского текста (есть в Синодальном)."
  3: "Ὄφελον ἀπεθάνομεν — если бы мы умерли (ὄφελον — «о, если бы»). πληγέντες ὑπὸ κυρίου — поражённые Господом (πλήσσω — ударять). ἐπὶ τῶν λεβήτων τῶν κρεῶν — у котлов мясных (λέβης — котёл). ἄρτους εἰς πλησμονήν — хлеб досыта. ἐξηγάγετε — вы вывели (2 л. мн.). ἀποκτεῖναι … ἐν λιμῷ — умертвить голодом."
  4: "ὕω ὑμῖν ἄρτους ἐκ τοῦ οὐρανοῦ — одождю вам хлебы с неба (ὕω — идти дождю; ἄρτους мн., ср. «хлебы»). τὸ τῆς ἡμέρας εἰς ἡμέραν — дневное на каждый день. πειράσω — испытаю (πειράζω). τῷ νόμῳ μου — по закону Моему (νόμος — 律法)."
  5: "ἑτοιμάσουσιν ὃ ἂν εἰσενέγκωσιν — приготовят, что принесут. διπλοῦν — вдвое. τὸ καθ᾿ ἡμέραν εἰς ἡμέραν — дневное на каждый день."
  6: "Ἑσπέρας γνώσεσθε — вечером узнаете. ἐξήγαγεν — вывел (аорист). Говорят оба, Моисей и Аарон («и сказали»), поэтому モーセとアロンは…言った."
  7: "πρωῒ ὄψεσθε τὴν δόξαν κυρίου — утром увидите славу Господню. ἐν τῷ εἰσακοῦσαι — «когда услышал» (ἐν + инф. с арт.). ἐπὶ τῷ θεῷ — на Бога (дат.; слав. «на Бога»). διαγογγύζετε καθ᾿ ἡμῶν — ропщете на нас."
  8: "Греческий стих начинается родительным самостоятельным (Ἐν τῷ διδόναι κύριον…), без главного глагола; по-японски передано причинной связью, без добавления «узнаете» (его нет в LXX, оно из масоретского текста). οὐ γὰρ καθ᾿ ἡμῶν … ἀλλ᾿ ἢ κατὰ τοῦ θεοῦ — не на нас, но на Бога."
  9: "Εἰπὸν πάσῃ συναγωγῇ — скажи всему обществу (императив аориста от εἶπον). Προσέλθατε ἐναντίον τοῦ θεοῦ — предстаньте пред Богом. εἰσακήκοεν — услышал (perfect с результатом)."
  10: "ἡνίκα δὲ ἐλάλει — когда говорил (имперфект). ἐπεστράφησαν εἰς τὴν ἔρημον — обратились к пустыне. ὤφθη ἐν νεφέλῃ — явилась в облаке (страд. от ὁράω)."
  11: "καὶ ἐλάλησεν κύριος πρὸς Μωυσῆν λέγων — вводная формула, речь продолжается в ст. 12."
  12: "Εἰσακήκοα — Я услышал (perfect). τὸ πρὸς ἑσπέραν — к вечеру. πλησθήσεσθε ἄρτων — насытитесь хлебами (род. содержания). ἐγὼ κύριος ὁ θεὸς ὑμῶν — わたしが主、あなたがたの神."
  13: "ὀρτυγομήτρα — перепелы (букв. «перепелиная мать»). ἐκάλυψεν τὴν παρεμβολήν — покрыла стан (παρεμβολή — 宿営). καταπαυομένης τῆς δρόσου — когда роса сошла/лежала (καταπαύω — успокаиваться); «роса поднялась» — масоретское чтение, у LXX его нет."
  14: "λεπτὸν ὡσεὶ κόριον — мелкое, как кориандр (κόριον — кориандр). λευκὸν ὡσεὶ πάγος — белое, как иней (πάγος). ἐπὶ πρόσωπον τῆς ἐρήμου — на поверхности пустыни."
  15: "Τί ἐστιν τοῦτο — «что это?» (отсюда, по евр., имя מָן; греческий этимологию не передаёт, поэтому имя объяснено сноской). ἕτερος τῷ ἑτέρῳ — друг другу. Οὗτος ὁ ἄρτος, ὃν ἔδωκεν κύριος — это хлеб, который дал Господь."
  16: "γομορ — гомор (мера; евр. עֹמֶר, «омер»). εἰς τοὺς καθήκοντας — «на потребное» (τὸ καθῆκον — должное, нужное). κατὰ ἀριθμὸν ψυχῶν — по числу душ. σὺν τοῖς συσκηνίοις — с живущими в одном шатре (συσκήνιον)."
  17: "ὁ τὸ πολὺ καὶ ὁ τὸ ἔλαττον — тот, кто много, и тот, кто меньше (артикль с наречием)."
  18: "μετρήσαντες τῷ γομορ — измерив гомором. οὐκ ἐπλεόνασεν … οὐκ ἠλαττόνησεν — не было лишнего / недостатка. παρ᾿ ἑαυτῷ — у себя."
  19: "Μηδεὶς καταλιπέτω — никто да не оставит (императив 3 л.). εἰς τὸ πρωί — до утра."
  20: "οὐκ εἰσήκουσαν Μωυσῆ — не послушали Моисея (вин. при ἀκούω, как в LXX). ἐξέζεσεν σκώληκας — закипело червями (ἐκζέω). ἐπώζεσεν — воссмердело (ὄζω — пахнуть). ἐπικράνθη — огорчился, разгневался (πικραίνω)."
  21: "πρωῒ πρωί — рано-рано (удвоение). τὸ καθῆκον αὐτῷ — нужное ему. διεθέρμαινεν ὁ ἥλιος — солнце согревало (διαθερμαίνω). ἐτήκετο — таяло (τήκω)."
  22: "τὰ δέοντα διπλᾶ — нужное вдвое (τὰ δέοντα — потребное). δύο γομορ τῷ ἑνί — по два гомора на каждого. οἱ ἄρχοντες τῆς συναγωγῆς — начальники общества."
  23: "σάββατα ἀνάπαυσις ἁγία τῷ κυρίῳ — суббота, покой святой Господу (σάββατα — мн. евр. форма; ἀνάπαυσις — покой). αὔριον — завтра. πέσσετε … ἕψετε — пеките … варите. εἰς ἀποθήκην — в хранилище."
  24: "κατελίποσαν … καθάπερ συνέταξεν — оставили, как повелел. οὐκ ἐπώζεσεν, οὐδὲ σκώληξ ἐγένετο — не воссмердело, и червь не появился."
  25: "Φάγετε σήμερον — ешьте сегодня. οὐχ εὑρεθήσεται ἐν τῷ πεδίῳ — не найдётся на поле (πεδίον — открытое поле)."
  26: "ἓξ ἡμέρας συλλέξετε — шесть дней собирайте (буд. в значении повеления). ὅτι οὐκ ἔσται ἐν αὐτῇ — ибо не будет в ней (в этот день)."
  27: "ἐξήλθοσάν τινες … συλλέξαι — вышли некоторые собирать (инф. цели). οὐχ εὗρον — не нашли."
  28: "Ἕως τίνος — доколе. εἰσακούειν τὰς ἐντολάς — слушать заповеди (ἐντολή — 戒め)."
  29: "ἴδετε — смотрите. τὴν ἡμέραν ταύτην τὰ σάββατα — «этот день — субботу» (приложение). ἄρτους δύο ἡμερῶν — хлеб на два дня. εἰς τοὺς οἴκους ὑμῶν — по домам."
  30: "ἐσαββάτισεν — покоился в субботу (редкий глагол от σάββατον)."
  31: "ἐπωνόμασαν τὸ ὄνομα αὐτοῦ μαν — нарекли имя ему «ман» (евр. מָן; возможно, от «что?»). ὡς σπέρμα κορίου λευκόν — как семя кориандра, белое. ἐγκρὶς ἐν μέλιτι — лепёшка в меду (ἐγκρίς — оладья)."
  32: "Πλήσατε τὸ γομορ τοῦ μαν — наполните гомор манны. εἰς ἀποθήκην εἰς τὰς γενεὰς ὑμῶν — в хранение в роды ваши. ἵνα ἴδωσιν — чтобы увидели (они, будущие поколения). ὡς ἐξήγαγεν ὑμᾶς κύριος — как вывел вас Господь; в масоретском тексте и Синодальном — «которым Я питал вас» (иное чтение, в скобки не берём)."
  33: "στάμνον χρυσοῦν — золотой сосуд (στάμνος — кувшин, стамна). ἔμβαλε — положи. ἀποθήσεις — поставишь. ἐναντίον τοῦ θεοῦ — пред Богом."
  34: "ἐναντίον τοῦ μαρτυρίου — пред свидением (μαρτύριον — свидетельство, т. е. ковчег откровения; по ходу повествования скиния ещё не устроена — анахронизм самого текста, ср. Евр 9:4). ἀπέθετο Ααρων — положил Аарон."
  35: "ἔτη τεσσαράκοντα — сорок лет. εἰς γῆν οἰκουμένην — в землю обитаемую (οἰκουμένη). εἰς μέρος τῆς Φοινίκης — в часть Финикии (LXX; в масоретском — «к пределам Ханаана», так в Синодальном)."
  36: "τὸ δέκατον τῶν τριῶν μέτρων — десятая часть трёх мер (LXX; в масоретском — «десятая часть ефы», так в Синодальном). γομορ — гомор."
