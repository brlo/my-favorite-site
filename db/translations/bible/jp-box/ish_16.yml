# jp-box, Исход, глава 16. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — csl-ru и jp-joc (1901, PD;
# в гл. 16 у jp-joc есть только ст. 1). Русский Синодальный — только для понимания.
# Язык — современный 常体, порядок членов и деление на клаузы — по греческому.
# Глава 16: ропот в пустыне Син (1–3), обещание хлеба с неба (4–5), слава Господня
# в облаке (6–12), перепелы и манна (13–21), суббота и двойная мера (22–30),
# манна, сосуд пред Богом и гомор (31–36).
# Красного и синего нет: речь Бога — в 「…」, «<j>» не ставится.
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено по базе).
# Сноски ⟨…⟩: ゴモル (16:16, мера объёма — у нехристианина такого слова нет),
# 安息日 (16:23, здесь суббота впервые установлена как день покоя),
# マナ (16:31, имя хлеба и его смысл). 十戒 в этой главе нет.
# jp-ni не использовался.

