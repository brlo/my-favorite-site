  43: "あなたが自分の幼[おさな]かった日[ひ]々[び]を思[おも]い出[だ]さず、これらすべてのことでわたしを悲[かな]しませたゆえに、見[み]よ、わたしはあなたの道[みち]をあなたの頭[あたま]に返[かえ]す、と主[しゅ]なる神[かみ]は言[い]われる。あなたはすべての自分の不法[ふほう]の上[うえ]に、さらに不敬[ふけい]を重[かさ]ねたのである。"
  44: "見[み]よ、あなたについてことわざで言[い]うことは、すべてこれである。『母[はは]に似[に]て娘[むすめ]あり』と。"
  45: "あなたは自分の母[はは]の娘[むすめ]である。母[はは]は自分の夫[おっと]と子[こ]どもを捨[す]てた。あなたは自分の夫[おっと]と子[こ]どもを捨[す]てた姉妹[しまい]たちの妹[いもうと]である。あなたがたの母[はは]はヘト人[じん]、あなたがたの父[ちち]はアモリ人[じん]である。"
  46: "あなたの姉[あね]はサマリアで、その娘[むすめ]たちとともにあなたの左[ひだり]に住[す]んでいる。あなたの妹[いもうと]はソドムで、その娘[むすめ]たちとともにあなたの右[みぎ]に住[す]んでいる。"
  47: "あなたは彼女[かのじょ]たちの道[みち]を歩[あゆ]まず、彼女[かのじょ]たちの不法[ふほう]のように行[おこな]いもしなかった。それはわずかなことだった。あなたは彼女[かのじょ]たちよりも、自分のすべての道[みち]でさらに悪[わる]かった。"
  48: "わたしは生[い]きている、と主[しゅ]なる神[かみ]は言[い]われる。あなたの妹[いもうと]ソドムとその娘[むすめ]たちは、あなたとあなたの娘[むすめ]たちがしたようにはしなかった。"
