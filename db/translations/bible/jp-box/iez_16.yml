  37: "それゆえ、見[み]よ、わたしはあなたに敵[てき]して、あなたが交[まじ]わったすべての恋人[こいびと]たち、あなたが愛[あい]したすべての者[もの]、あなたが憎[にく]んだすべての者[もの]を集[あつ]める。わたしは彼らを四方[しほう]からあなたに向[む]けて集め、彼らの前[まえ]にあなたの悪[わる]さをあらわにし、彼らはあなたの恥[はじ]をことごとく見[み]る。"
