  50: "彼らは高[たか]ぶり、わたしの前[まえ]に忌[い]まわしいことを行[おこな]った。わたしは彼らを、見[み]たとおりに除[のぞ]き去[さ]った。"
  51: "サマリアはあなたの罪[つみ]の半[なか]ばも犯[おか]さなかった。あなたは彼女[かのじょ]たちよりも多[おお]くの不法[ふほう]を重[かさ]ね、自分のすべての不法[ふほう]によって、あなたの姉妹[しまい]たちを正[ただ]しい者[もの]とした。"
  52: "あなたも自分[じぶん]の苦[くる]しみを負[お]え。あなたは自分の罪[つみ]によって姉妹[しまい]たちを滅[ほろ]ぼした。あなたは彼女[かのじょ]たちよりも甚[はなは]だしく不法[ふほう]を行[おこな]ったので、彼女[かのじょ]たちはあなたよりも正[ただ]しい。あなたは恥[は]じて、自分の辱[はずかし]めを受[う]けよ。あなたが自分の姉妹[しまい]たちを正[ただ]しいとしたからである。"
  53: "わたしは彼らの帰還[きかん]を、ソドムとその娘[むすめ]たちの帰還[きかん]を、サマリアとその娘[むすめ]たちの帰還[きかん]を、そしてあなたの帰還[きかん]を、彼らの間[あいだ]で実現[じつげん]する。"
  54: "それは、あなたが自分[じぶん]の苦[くる]しみを負[お]い、わたしを怒[いか]らせて行[おこな]ったすべてのことのゆえに、すべての者[もの]から辱[はずかし]められるためである。"
  55: "あなたの妹[いもうと]ソドムとその娘[むすめ]たちは、初[はじ]めの状態[じょうたい]に戻[もど]る。サマリアとその娘[むすめ]たちも、初[はじ]めの状態[じょうたい]に戻[もど]る。あなたとあなたの娘[むすめ]たちも、初[はじ]めの状態[じょうたい]に戻[もど]る。"
  56: "あなたの高[こう]慢[まん]の日[ひ]々[び]に、あなたの妹[いもうと]ソドムはあなたの口[くち]にのぼる話[はなし]ではなかったか。"
  57: "それは、あなたの悪[わる]さが現[あらわ]れされる前[まえ]のことであった。今[いま]、あなたはシリアの娘[むすめ]たちと、その周[まわ]りすべての者[もの]の辱[はずかし]めとされ、四方[しほう]であなたを囲[かこ]む異[い]邦[ほう]の娘[むすめ]たちの辱[はずかし]めとされているではないか。"
  58: "あなたの不敬[ふけい]とあなたの不法[ふほう]を、あなた自身[じしん]が負[お]う、と主[しゅ]は言[い]われる。"
  59: "主[しゅ]なる神[かみ]はこう言[い]われる。わたしはあなたに、あなたがしたとおりに行[おこな]う。あなたはわたしの契約[けいやく]を破[やぶ]ることを蔑[さげす]んだからである。"
  60: "しかし、わたしはあなたとの、あなたの幼[おさな]かった日[ひ]々[び]の契約[けいやく]を思[おも]い出[だ]し、あなたと永遠[えいえん]の契約[けいやく]を立[た]てる。"
  61: "あなたは自分の道[みち]を思[おも]い出[だ]して恥[は]じる。あなたが自分[じぶん]の姉[あね]と妹[いもうと]を受[う]け入[い]れるとき、わたしは彼女[かのじょ]たちをあなたに、あなたを建[た]て上[あ]げるために与[あた]える。ただし、あなたの契約[けいやく]によるのではない。"
  62: "わたしはあなたとの契約[けいやく]を立[た]て直[なお]す。そしてあなたは、わたしが主[しゅ]であることを知[し]る。"
  63: "それは、あなたが思[おも]い出[だ]して恥[は]じ、あなたの辱[はずかし]めのゆえに、もはや口[くち]を開[ひら]くことがなくなるためである。わたしがあなたに、あなたが行[おこな]ったすべてのことについて、あわれみを示[しめ]すとき、と主[しゅ]なる神[かみ]は言[い]われる。」"

notes:
  1: "Καὶ ἐγένετο λόγος κυρίου πρός με λέγων — «и было слово Господне ко мне, говоря»: обычная формула начала речи (в тексте 主の言葉が…臨んで言われた)."
  2: "διαμάρτυραι τῇ Ιερουσαλημ τὰς ἀνομίας αὐτῆς — «засвидетельствуй Иерусалиму беззакония его» (διαμαρτύρομαι — свидетельствовать, обличать; 不法). ru (МТ) «выскажи мерзости его» — иное слово, в текст не внесено."
  3: "ἡ ῥίζα σου καὶ ἡ γένεσίς σου ἐκ γῆς Χανααν — «корень твой и рождение твоё из земли Ханаан»; ὁ πατήρ σου Αμορραῖος, καὶ ἡ μήτηρ σου Χετταία — «отец твой Аморрей, мать твоя Хеттеянка» (アモリ人, ヘト人). csl обращается «дщери Иерусалимстей» — к городу как к дочери; в LXX датив «Иерусалиму»."
  4: "οὐκ ἔδησαν τοὺς μαστούς σου — «не связали грудей твоих» (в ru/МТ «пупа твоего не отрезали» — масоретское чтение, не внесено); οὐδὲ ἁλὶ ἡλίσθης — «и солью не осолена» (ἁλίζω — солить); σπαργάνοις οὐκ ἐσπαργανώθης — «пеленами не повита» (σπάργανον — пелена). csl добавляет «на спасение» (для сохранения жизни) — нет в LXX, внесено."
  5: "οὐδὲ ἐφείσατο ὁ ὀφθαλμός μου ἐπὶ σοί — «и не пощадил глаз мой тебя» (φείδομαι — щадить); ἀπερρίφης ἐπὶ πρόσωπον τοῦ πεδίου — «брошена на лицо поля»; τῇ σκολιότητι τῆς ψυχῆς σου — «по кривизне (извращённости) души твоей» (σκολιότης; в ru/МТ «по презрению к жизни твоей»)."
  6: "διῆλθον ἐπὶ σὲ καὶ εἶδόν σε πεφυρμένην ἐν τῷ αἵματί σου — «прошёл Я над тобою и увидел тебя, смешанную в крови твоей» (φύρω — месить, марать); Ἐκ τοῦ αἵματός σου ζωή — тёмное место LXX, букв. «из крови твоей — жизнь»; csl повторяет: «от крове твоея жива буди… во крови твоей живот твой». Слова Господа к ней — 『…』."
  7: "πληθύνου — «умножайся» (продолжение речи, ср. Быт 1:28); καθὼς ἡ ἀνατολὴ τοῦ ἀγροῦ δέδωκά σε — «как произрастание поля Я дал тебя» (ἀνατολή — всход, растение); εἰσῆλθες εἰς πόλεις πόλεων — «вошла в города городов» (усиление: в большие города); οἱ μαστοί σου ἀνωρθώθησαν — «груди твои поднялись»; ἡ θρίξ σου ἀνέτειλεν — «волос твой вырос»."
  8: "καιρὸς καταλυόντων — тёмное место: «время водворяющихся (?)»; csl «время витающих», в ru/МТ «время любви»; в тексте 宿る者の時. διεπέτασα τὰς πτέρυγάς μου ἐπὶ σέ — «простёр крылья Мои над тобою» (πτέρυξ — крыло, край одежды; знак брака, ср. Руфь 3:9); ἐκάλυψα τὴν ἀσχημοσύνην σου — «покрыл наготу твою» (ἀσχημοσύνη — срам); εἰσῆλθον ἐν διαθήκῃ μετὰ σοῦ — «вошёл в завет с тобою»."
  9: "ἔλουσά σε ἐν ὕδατι — «омыл тебя водою» (λούω); ἀπέπλυνα τὸ αἷμά σου ἀπὸ σοῦ — «отмыл кровь твою от тебя» (ἀποπλύνω); ἔχρισά σε ἐν ἐλαίῳ — «помазал тебя елеем» (χρίω, 油)."
  10: "ποικίλα — «узо́рчатое, разноцветное» (ποικίλος); ὑπέδησά σε ὑάκινθον — «обул тебя в яхинф (синее/гиацинтовое)» (ὑάκινθος); βύσσῳ — «виссоном» (βύσσος — тонкий лён, 亜麻布); τρίχαπτον — дорогая ткань (в ru «шелковое покрывало»), передано 絹の覆い."
  11: "κόσμῳ — «украшением» (κόσμος — украшение); ψέλια περὶ τὰς χεῖράς σου — «запястья на руки твои» (ψέλιον); κάθεμα περὶ τὸν τράχηλόν σου — «гривну (ожерелье) на шею твою» (κάθεμα)."
  12: "ἐνώτιον περὶ τὸν μυκτῆρά σου — «серьгу (кольцо) на ноздрю твою» (ἐνώτιον); τροχίσκους ἐπὶ τὰ ὦτά σου — «кольца на уши твои» (τροχίσκος — кружок, серьга); στέφανον καυχήσεως — «венец хвалы (славы)» (καύχησις), 栄えの冠."
  13: "σεμίδαλιν καὶ ἔλαιον καὶ μέλι ἔφαγες — «муку лучшую, елей и мёд ела ты» (σεμίδαλις — тонкая пшеничная мука, 小麦粉); ἐγένου καλὴ σφόδρα — «стала прекрасна весьма». csl добавляет «и управилася еси на царство» (нет в LXX) — внесено (王国にふさわしい者となった)."
  14: "ἐξῆλθέν σου ὄνομα ἐν τοῖς ἔθνεσιν — «вышло имя твоё к народам» (о славе); συντετελεσμένον ἦν ἐν εὐπρεπείᾳ — «совершенно было в благолепии» (συντελέω — доводить до конца; εὐπρέπεια — благолепие); ᾗ ἔταξα ἐπὶ σέ — «которое Я возложил на тебя» (τάσσω)."
  15: "ἐπεποίθεις ἐν τῷ κάλλει σου — «ты понадеялась на красоту твою» (πείθω в перфекте — доверять); ἐπόρνευσας ἐπὶ τῷ ὀνόματί σου — «блудила на имя твоё» (πορνεύω, 淫行); ἐξέχεας τὴν πορνείαν σου ἐπὶ πᾶν πάροδον — «излила блуд твой на всякого проходящего»; ὃ οὐκ ἔσται — «чего не будет (не должно быть)»."
  16: "εἴδωλα ῥαπτά — «кумиры сшитые» (ῥάπτω — шить): в ru/МТ «разноцветные высоты» (במות), но держим LXX и csl; ἐξεπόρνευσας ἐπ᾽ αὐτά — «блудила на них»; οὐ μὴ εἰσέλθῃς, οὐδὲ μὴ γένηται — тёмное: «не войдёшь и не будет» (csl «не внидеши, и не будет»), передано как «такого не бывает и не будет»."
  17: "σκεύη τῆς καυχήσεώς σου — «сосуды хвалы (славы) твоей» (σκεῦος — сосуд, утварь); εἰκόνας ἀρσενικάς — «образы мужские» (εἰκών — изображение; ἀρσενικός — мужской); ἐξεπόρνευσας ἐν αὐταῖς — «блудила с ними»."
  18: "τὸν ἱματισμὸν τὸν ποικίλον — «одежду разноцветную» (ἱματισμός); ἔθηκας πρὸ προσώπου αὐτῶν — «положила пред лицем их» (τίθημι — класть): елей и фимиам, назначенные Богу, отданы идолам."
  19: "τοὺς ἄρτους μου… σεμίδαλιν καὶ ἔλαιον καὶ μέλι — «хлебы Мои… муку, елей и мёд»; εἰς ὀσμὴν εὐωδίας — «в запах благоухания» (ὀσμή, εὐωδία); καὶ ἐγένετο, λέγει κύριος — «и было, говорит Господь» (csl «И бысть по сих»), формула завершения."
  20: "ἔθυσας αὐτὰ αὐτοῖς εἰς ἀνάλωσιν — «заклала их им в снедь» (θύω — закалать; ἀνάλωσις — истребление, снедение); ὡς μικρὰ ἐξεπόρνευσας — «как мало ты блудила» (csl «Еда мало соблудила еси?»), т. е. «разве это было малое блужение?»."
  21: "ἔσφαξας τὰ τέκνα σου — «заклала детей твоих» (σφάζω); ἔδωκας αὐτὰ ἐν τῷ ἀποτροπιάζεσθαί σε ἐν αὐτοῖς — «отдала их, когда совершала отвращение (умилостивление) через них»: редкий глагол ἀποτροπιάζομαι (отвращать беду); csl «внегда принесла еси их на жертву им»."
  22: "τοῦτο παρὰ πᾶσαν τὴν πορνείαν σου — «это сверх всего блуда твоего»; οὐκ ἐμνήσθης τὰς ἡμέρας τῆς νηπιότητός σου — «не вспомнила дней младенчества твоего» (νηπιότης); πεφυρμένη ἐν τῷ αἵματί σου ἔζησας — «смешанная в крови твоей жила ты». csl добавляет «и гнусностей твоих» — нет в LXX, внесено."
  23: "καὶ ἐγένετο μετὰ πάσας τὰς κακίας σου — «и было после всех злодейств твоих»; λέγει κύριος. csl добавляет «горе, горе тебе» (нет в LXX) — внесено (災いだ、災いだ). Стих продолжается в 24."
  24: "οἴκημα πορνικόν — «дом блудничный» (οἴκημα — помещение, 淫行の家); ἔκθεμα ἐν πάσῃ πλατείᾳ — «выставление (место выставления) на всякой площади» (ἔκθεμα, от ἐκτίθημι — выставлять), передано 自分をさらす所."
  25: "ἐπ᾽ ἀρχῆς πάσης ὁδοῦ — «при начале всякого пути» (ἀρχή — начало); ἐλυμήνω τὸ κάλλος σου — «растлила (изуродовала) красоту твою» (λυμαίνω); διήγαγες τὰ σκέλη σου παντὶ παρόδῳ — «разложила голени твои всякому проходящему» (διάγω — разводить); ἐπλήθυνας τὴν πορνείαν σου."
  26: "τοὺς υἱοὺς Αἰγύπτου τοὺς ὁμοροῦντάς σοι — «сынов Египта, соседей твоих» (ὁμορέω — граничить); τοὺς μεγαλοσάρκους — «дебелоплотных» (μεγαλόσαρκος: μέγας + σάρξ), 肉の大きな; τοῦ παροργίσαι με — «чтобы прогневать Меня» (παροργίζω)."
  27: "ἐξαρῶ τὰ νόμιμά σου — «отниму уставы (законы) твои» (ἐξαίρω — убирать; νόμιμος); εἰς ψυχὰς μισούντων σε — «в души (руки) ненавидящих тебя»; θυγατέρας ἀλλοφύλων — «дочерей иноплеменников» (Philistines); τὰς ἐκκλινούσας σε ἐκ τῆς ὁδοῦ σου — «совращающих тебя с пути твоего» (ἐκκλίνω — отклонять). ru/МТ «уменьшил назначенное тебе» — иное чтение, не внесено."
  28: "ἐπὶ τὰς θυγατέρας Ασσουρ — «с дочерями Ассура» (csl «с сынми ассировыми»); οὐδ᾽ οὕτως ἐνεπλήσθης — «и так не насытилась» (ἐμπίπλημι); повтор «καὶ ἐξεπόρνευσας καὶ οὐκ ἐνεπίπλω» — снова «блудила и не насытилась» (LXX дублирует, сохранено)."
  29: "ἐπλήθυνας τὰς διαθήκας σου πρὸς γῆν Χαλδαίων — «умножила заветы (связи) твои с землёю Халдеев»; οὐδὲ ἐν τούτοις ἐνεπλήσθης — «и в этом не насытилась». csl добавляет «хананейстей» (нет в LXX) — внесено (カナンの地)."
  30: "τί διαθῶ τὴν θυγατέρα σου — «что сделать с дочерью твоей»; csl «что сотворю сердцу твоему» (иное чтение, держим csl); ἔργα γυναικὸς πόρνης — «дела жены-блудницы»; csl добавляет «продерзыя» (дерзкой) — нет в LXX; ἐξεπόρνευσας τρισσῶς — «блудила трижды» (τρισσῶς), 三たび."
  31: "ἐν ταῖς θυγατράσιν σου — «у дочерей твоих» (LXX; csl отнёс это к ст. 30: «во дщерех твоих»); τὴν βάσιν σου — «основание (место) твоё» (βάσις); ὡς πόρνη συνάγουσα μισθώματα — «как блудница, собирающая плату» (μίσθωμα); csl с отрицанием: «и не была яко блудница…» — держим csl, он согласуется со ст. 33."
  32: "ἡ γυνὴ ἡ μοιχωμένη — «жена прелюбодейная» (μοιχάομαι, 姦淫); παρὰ τοῦ ἀνδρὸς αὐτῆς λαμβάνουσα μισθώματα — «от мужа своего берущая плату»: неверная жена берёт у мужа, тогда как блудница — у любовников."
  33: "πᾶσι τοῖς ἐκπορνεύσασιν αὐτὴν προσεδίδου μισθώματα — «всем блудившим с нею давала плату» (προσδίδωμι — придавать, давать сверх); ἐφόρτιζες αὐτοὺς τοῦ ἔρχεσθαι — «обременяла их, чтобы приходили» (φορτίζω — нагружать)."
  34: "διεστραμμένον παρὰ τὰς γυναῖκας — «извращённое (обратное) в сравнении с жёнами» (διαστρέφω — извращать), ゆがみ; σοὶ μισθώματα οὐκ ἐδόθη — «тебе платы не дано было»; καὶ ἐγένετο ἐν σοὶ διεστραμμένα — «и было в тебе извращённое»."
  35: "διὰ τοῦτο, πόρνη, ἄκουε λόγον κυρίου — «посему, блудница, слушай слово Господне»: начало суда; внутри непрерывной речи 「…»."
  36: "ἐξέχεας τὸν χαλκόν σου — «излила медь твою» (χαλκός — медь, в ru/МТ «деньги»); ἀποκαλυφθήσεται ἡ αἰσχύνη σου — «откроется срам твой» (ἀποκαλύπτω); ἐν πάντα τὰ ἐνθυμήματα τῶν ἀνομιῶν σου — «во всех помыслах (вожделениях) беззаконий твоих» (ἐνθύμημα); ἐν τοῖς αἵμασιν τῶν τέκνων σου — «в крови детей твоих»."
  37: "συνάγω πάντας τοὺς ἐραστάς σου — «собираю всех любовников твоих» (ἐραστής — любовник, 恋人); ἐν οἷς ἐπεμίγης — «с которыми ты смешалась» (μίγνυμι); οὓς ἠγάπησας… οἷς ἐμίσεις — «которых любила… которых ненавидела»; ἀποκαλύψω τὰς κακίας σου πρὸς αὐτούς — «открою злобы твои перед ними»."
  38: "ἐκδικήσω σε ἐκδικήσει μοιχαλίδος — «отмщу тебе отмщением прелюбодейцы» (ἐκδικέω, cognatus accusativus); ἐκχεούσης αἷμα — «проливающей кровь»; θήσω σε ἐν αἵματι θυμοῦ καὶ ζήλου — «положу тебя в крови ярости и ревности» (θυμός, ζῆλος — 妬み)."
  39: "κατασκάψουσιν τὸ πορνεῖόν σου — «раскопают (разрушат) блудилище твое» (κατασκάπτω); καθελοῦσιν τὴν βάσιν σου — «низвергнут основание твоё» (καθαιρέω); ἐκδύσουσίν σε τὸν ἱματισμόν σου — «снимут с тебя одежду твою»; σκεύη τῆς καυχήσεως — «сосуды славы твоей»."
  40: "ἄξουσιν ἐπὶ σὲ ὄχλους — «приведут на тебя толпы» (ὄχλος); λιθοβολήσουσίν σε ἐν λίθοις — «побьют тебя камнями» (λιθοβολέω, 石で撃つ); κατασφάξουσίν σε ἐν τοῖς ξίφεσιν — «заколют тебя мечами» (κατασφάζω)."
  41: "ἐμπρήσουσιν τοὺς οἴκους σου πυρί — «сожгут домы твои огнём» (ἐμπρήθω/ἐμπίμπρημι); ποιήσουσιν ἐν σοὶ ἐκδικήσεις ἐνώπιον γυναικῶν πολλῶν — «совершат над тобою отмщения пред многими жёнами»; ἀποστρέψω σε ἐκ τῆς πορνείας σου — «отвращу тебя от блуда твоего»."
  42: "ἐπαφήσω τὸν θυμόν μου ἐπὶ σέ — «наложу (отпущу) гнев Мой на тебя» (ἐπαφίημι); ἐξαρθήσεται ὁ ζῆλός μου ἐκ σοῦ — «отнимется ревность Моя от тебя» (ἐξαίρω); ἀναπαύσομαι καὶ οὐ μὴ μεριμνήσω οὐκέτι — «успокоюсь и уже не буду заботиться» (μεριμνάω)."
  43: "ἀνθ᾽ ὧν οὐκ ἐμνήσθης — «за то, что не вспомнила»; ἐλύπεις με ἐν πᾶσι τούτοις — «огорчала Меня всем этим» (λυπέω); τὰς ὁδούς σου εἰς κεφαλήν σου δέδωκα — «пути твои на голову твою отдал» (образ возмездия); οὕτως ἐποίησας τὴν ἀσέβειαν — «так ты сделала нечестие»."
  44: "ταῦτά ἐστιν πάντα, ὅσα εἶπαν κατὰ σοῦ ἐν παραβολῇ — «вот всё, что сказали о тебе в притче» (παραβολή — притча, поговорка); Καθὼς ἡ μήτηρ, καὶ ἡ θυγάτηρ — «какова мать, такова и дочь»: поговорка в 『…』."
  45: "θυγάτηρ τῆς μητρός σου — «дочь матери твоей»; ἡ ἀπωσαμένη τὸν ἄνδρα αὐτῆς καὶ τὰ τέκνα αὐτῆς — «отринувшая мужа своего и детей своих» (ἀπωθέω — отталкивать); ἀδελφὴ τῶν ἀδελφῶν σου — «сестра сестёр твоих»; ἡ μήτηρ ὑμῶν Χετταία — «мать ваша Хеттеянка»."
  46: "ἡ ἀδελφὴ ὑμῶν ἡ πρεσβυτέρα Σαμάρεια — «сестра ваша старшая Самария»; ἡ κατοικοῦσα ἐξ εὐωνύμων σου — «живущая слева от тебя» (εὐώνυμος — левый); ἡ νεωτέρα σου… ἐκ δεξιῶν σου Σοδομα — «младшая твоя… справа от тебя Содом» (δεξιός — правый)."
  47: "οὐδ᾽ ὧς ἐν ταῖς ὁδοῖς αὐτῶν ἐπορεύθης — «и так не по путям их ходила ты»; παρὰ μικρὸν καὶ ὑπέρκεισαι αὐτὰς — «почти (мало) — и превосходишь их» (ὑπέρκειμαι — быть выше); ἐν πάσαις ταῖς ὁδοῖς σου — «на всех путях твоих»."
  48: "ζῶ ἐγώ, λέγει κύριος — клятвенная формула «живу Я» (в тексте わたしは生きている); εἰ πεποίηκεν Σοδομα… — «если сделала Содом…»: опущенное проклятие, по смыслу «не сделала» (ср. 33:11)."
  49: "τὸ ἀνόμημα Σοδομων — «беззаконие Содома» (ἀνόμημα); ὑπερηφανία — «гордость» (高慢); ἐν πλησμονῇ ἄρτων καὶ ἐν εὐθηνίᾳ οἴνου — «в насыщении хлебом и в изобилии вина» (πλησμονή, εὐθηνία); ἐσπατάλων — «роскошествовали» (σπαταλάω); χεῖρα πτωχοῦ καὶ πένητος οὐκ ἀντελαμβάνοντο — «руки бедного и нищего не поддерживали» (ἀντιλαμβάνομαι)."
  50: "ἐμεγαλαύχουν — «величались» (μεγαλαυχέω); ἐποίησαν ἀνομήματα ἐνώπιόν μου — «делали беззакония пред лицем Моим»; ἐξῆρα αὐτὰς καθὼς εἶδον — «исторг (отверг) их, как увидел»: тёмное место, передано буквально."
  51: "κατὰ τὰς ἡμίσεις τῶν ἁμαρτιῶν σου οὐχ ἥμαρτεν — «и в половину грехов твоих не согрешила» (ἡμίσεις — половины); ἐπλήθυνας τὰς ἀνομίας σου ὑπὲρ αὐτάς — «умножила беззакония твои сверх них»; ἐδικαίωσας τὰς ἀδελφάς σου — «оправдала (сделала праведнее) сестёр твоих» (δικαιόω)."
  52: "κόμισαι βάσανόν σου — «прими мучение (казнь) твоё» (κομίζω — получать; βάσανος — мучение); ἐν ᾗ ἔφθειρας τὰς ἀδελφάς σου — «в чём растлила (погубила) сестёр твоих» (φθείρω); αἰσχύνθητι καὶ λαβὲ τὴν ἀτιμίαν σου — «устыдись и прими бесчестие твоё» (ἀτιμία)."
  53: "ἀποστρέψω τὰς ἀποστροφὰς αὐτῶν — «возвращу возвращения их» (ἀποστροφή — возвращение, восстановление; в ru «возвращу плен их»); ἐν μέσῳ αὐτῶν — «среди них», т. е. вместе с ними."
  54: "ὅπως κομίσῃ τὴν βάσανόν σου — «чтобы ты понесла мучение твоё»; ἀτιμωθῇς ἐκ πάντων — «была обесчещена всеми» (ἀτιμόω); ἐν τῷ σε παροργίσαι με — «тем, что ты прогневала Меня» (παροργίζω)."
  55: "ἀποκατασταθήσονται καθὼς ἦσαν ἀπ᾽ ἀρχῆς — «восстановятся, как были в начале» (ἀποκαθίστημι); καὶ σὺ καὶ αἱ θυγατέρες σου ἀποκατασταθήσεσθε — «и ты и дочери твои восстановитесь»."
  56: "καὶ εἰ μὴ ἦν Σοδομα ἡ ἀδελφή σου εἰς ἀκοὴν ἐν τῷ στόματί σου — «и не была ли Содома, сестра твоя, притчей в устах твоих» (ἀκοή — слух, молва): εἰ μή вводит вопрос, который закрывается в 57 (в LXX там вопросительный знак). В ru/МТ 56–57 — одно утверждение с «доколе»."
  57: "πρὸ τοῦ ἀποκαλυφθῆναι τὰς κακίας σου — «прежде нежели открылись злобы твои»; ὄνειδος εἶ θυγατέρων Συρίας — «ты поношение дочерей Сирии» (ὄνειδος — поношение); θυγατέρων ἀλλοφύλων τῶν περιεχουσῶν σε κύκλῳ — «дочерей иноплеменников, окружающих тебя кругом» (περιέχω)."
  58: "τὰς ἀσεβείας σου καὶ τὰς ἀνομίας σου, σὺ κεκόμισαι αὐτάς — «нечестия твои и беззакония твои ты понесла» (κομίζω — нести, получать; ср. 52)."
  59: "ποιήσω ἐν σοὶ καθὼς ἐποίησας — «поступлю с тобою, как ты поступила»; ὡς ἠτίμωσας ταῦτα τοῦ παραβῆναι τὴν διαθήκην μου — «как ты обесчестила это, чтобы преступить завет Мой» (ἀτιμάζω, παραβαίνω)."
  60: "μνησθήσομαι ἐγὼ τῆς διαθήκης μου… ἐν ἡμέραις νηπιότητός σου — «вспомню Я завет Мой… во дни младенчества твоего»; ἀναστήσω σοι διαθήκην αἰώνιον — «восставлю тебе завет вечный» (ἀνίστημι, 永遠の契約)."
  61: "καὶ μνησθήσῃ τὴν ὁδόν σου καὶ ἐξατιμωθήσῃ — «вспомнишь путь твой и обесчещена будешь» (ἐξατιμόω); ἀναλαβεῖν σε τὰς ἀδελφάς σου — «принять тебе сестёр твоих» (ἀναλαμβάνω); δώσω αὐτάς σοι εἰς οἰκοδομὴν — «дам их тебе в созидание» (οἰκοδομή; в ru/МТ «в дочерей»); οὐκ ἐκ διαθήκης σου — «не от завета твоего»."
  62: "ἀναστήσω ἐγὼ τὴν διαθήκην μου μετὰ σοῦ — «восставлю Я завет Мой с тобою» (ἀνίστημι — восстанавливать); ἐπιγνώσῃ ὅτι ἐγὼ κύριος — «узнаешь, что Я Господь» (ἐπιγινώσκω — формула богопознания)."
  63: "ὅπως μνησθῇς καὶ αἰσχυνθῇς — «чтобы ты вспомнила и устыдилась» (αἰσχύνομαι); μὴ ᾖ σοι ἔτι ἀνοῖξαι τὸ στόμα σου — «не будет тебе более открыть уста твои»; ἀπὸ προσώπου τῆς ἀτιμίας σου — «от лица бесчестия твоего»; ἐν τῷ ἐξιλάσκεσθαί μέ σοι — «когда Я умилостивлюсь (прощу) тебе» (ἐξιλάσκομαι). Здесь речь Господа закрывается."
