  10: "わたしはあなたに色[いろ]とりどりの衣[ころも]を着[き]せ、青[あお]い履[くつ]を履[は]かせ、亜麻布[あさぬの]を帯[おび]とし、絹[きぬ]の覆[おお]いをあなたにまとわせた。"
  11: "わたしは飾[かざ]りであなたを飾[かざ]り、あなたの腕[うで]に腕輪[うでわ]を、あなたの首[くび]に首飾[くびかざ]りを着[つ]けた。"
  12: "あなたの鼻[はな]に鼻輪[はなわ]を、あなたの耳[みみ]に耳輪[みみわ]を、あなたの頭[あたま]に栄[さか]えの冠[かんむり]を置[お]いた。"
  13: "あなたは金[きん]と銀[ぎん]で飾られ、あなたの衣[ころも]は亜麻布[あさぬの]と絹[きぬ]と色[いろ]とりどりの織[お]り物[もの]であった。あなたは小麦粉[こむぎこ]と油[あぶら]と蜜[みつ]を食[た]べ、きわめて美[うつく]しくなり、王国[おうこく]にふさわしい者[もの]となった。"
