# Содержание: 1–2 слово Господне пророку; 3–5 Иерусалим — найдёныш, брошенный в поле;
# 6–14 Господь взращивает, омывает, облекает, вступает в завет и даёт красоту;
# 15–34 неверная жена: блуд с Египтом, Ассуром, Халдеей, блудилища, детоубийство;
# 35–43 суд: любовники собираются, казнь, гнев утихает; 44–52 «какова мать, такова и
# дочь»: Содом и Самария праведнее Иерусалима; 53–63 возвращение плена, вечный завет,
# стыд и прощение.
# Речь: 16:1–2 — вне кавычек; 16:3–63 — одна непрерывная речь Господа в 「…»
# (открывается в 3 после «主なる神はこう言われる», закрывается в 63). Внутри:
# 16:6 — слова Господа к ней в 『…』; 16:44 — народная поговорка в 『…』.
# Формулы «と主は言われる» внутри речи — в кавычках, как в образцах.
# Паритет: 16:4 csl добавляет «на спасение» (нет в LXX); 16:13 csl добавляет
# «и управилася еси на царство» (нет в LXX); 16:22 csl добавляет «и гнусностей твоих»;
# 16:23 csl добавляет «горе, горе тебе»; 16:27 LXX «отниму уставы твои», ru/МТ
# «уменьшил назначенное»; 16:29 csl добавляет «хананейстей»; 16:30 LXX «что сделаю
# с дочерью твоей», csl «что сотворю сердцу твоему»; 16:31 LXX «стала как блудница,
# собирающая плату», csl с отрицанием («не была») — держим csl; 16:36 LXX «медь
# (χαλκός)», ru/МТ «деньги»; 16:56–57 в LXX вопрос, закрывающийся в 57 (εἰ μή);
