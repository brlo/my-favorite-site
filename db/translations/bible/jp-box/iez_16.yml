  23: "あなたのすべての悪[わる]さの後[のち]に、災[わざわ]いだ、災[わざわ]いだ、あなたに、と主[しゅ]なる神[かみ]は言[い]われる。"
  24: "あなたは自分[じぶん]のために淫行[いんこう]の家[いえ]を建[た]て、すべての広場[ひろば]に自分[じぶん]をさらす所[ところ]を設[もう]けた。"
  25: "あなたはすべての道[みち]の始[はじ]めに自分の淫行[いんこう]の家[いえ]を建[た]て、自分の美[うつく]しさを汚[けが]し、すべて通[とお]り過[す]ぎる者[もの]に自分の足[あし]を広[ひろ]げて、淫行[いんこう]を増[ふ]やした。"
  26: "あなたは隣[となり]の息子[むすこ]たち、肉[にく]の大[おお]きなエジプト人[じん]たちと淫行[いんこう]を犯[おか]し、淫行[いんこう]を重[かさ]ねてわたしを怒[いか]らせた。"
  27: "見[み]よ、わたしはあなたの上[うえ]に手[て]を伸[の]べ、あなたの定[さだ]めを取[と]り去[さ]り、あなたを憎[にく]む者[もの]たちの魂[たましい]に、すなわちあなたの道[みち]から、あなたが不敬[ふけい]を行[おこな]ったその道[みち]から、あなたをそらせる異[い]邦[ほう]の娘[むすめ]たちに、あなたを渡[わた]した。"
  28: "あなたはアッスルの息子[むすこ]たちと淫行[いんこう]を犯[おか]したが、それでも満[み]たされず、なお淫行[いんこう]を重[かさ]ねたが、満[み]たされなかった。"
