  16: "あなたは自分の衣[ころも]から取[と]って、自分[じぶん]のために縫[ぬ]い合[あ]わせた像[ぞう]を作[つく]り、その上[うえ]で淫行[いんこう]を犯[おか]した。そのようなことは起[お]こらず、また起[お]こることもない。"
  17: "あなたはわたしがあなたに与[あた]えたわが金[きん]と銀[ぎん]から、自分の誇[ほこ]りの器[うつわ]を取[と]って、自分[じぶん]のために男[おとこ]の像[かた]を造[つく]り、それらによって淫行[いんこう]を犯[おか]した。"
  18: "あなたは自分の色[いろ]とりどりの衣[ころも]を取[と]って、それらに着[き]せ、わたしの油[あぶら]とわたしの香[こう]をそれらの前[まえ]に置[お]いた。"
  19: "わたしがあなたに与[あた]えたわがパン、すなわちあなたを養[やしな]った小麦粉[こむぎこ]と油[あぶら]と蜜[みつ]を、あなたはそれらの前[まえ]に馨[かぐわ]しい香[かおり]として置[お]いた。そうして、そのようになった、と主[しゅ]なる神[かみ]は言[い]われる。"
