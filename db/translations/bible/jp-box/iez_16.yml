  5: "だれもあなたをあわれまず、これらのうちの一[ひと]つでも、あなたのためにしてやろうとはしなかった。あなたは野[の]の面[おもて]に投[な]げ捨[す]てられた。あなたの魂[たましい]が曲[まが]っていたので、生[う]まれた日[ひ]にそうされたのである。"
