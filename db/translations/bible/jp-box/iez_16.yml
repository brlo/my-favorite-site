  31: "あなたの娘[むすめ]たちの間[あいだ]で、あなたはすべての道[みち]の始[はじ]めに自分の淫行[いんこう]の家[いえ]を建[た]て、すべての広場[ひろば]に自分の基[もと]を設[もう]けた。あなたは報酬[ほうしゅう]を取[と]る淫[いん]婦[ぷ]のようではなかった。"
  32: "姦淫[かんいん]を働[はたら]く女[おんな]は、あなたに似[に]ている。夫[おっと]から報酬[ほうしゅう]を受[う]け取[と]る者[もの]である。"
