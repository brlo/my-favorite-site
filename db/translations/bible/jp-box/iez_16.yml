  7: "増[ふ]えよ。野[の]の芽生[めば]えのように、わたしはあなたを置[お]いた。あなたは増[ふ]え、大[おお]きくなり、町々[まちまち]のうちに入[はい]るほどになった。あなたの乳房[ちぶさ]は高[たか]く立[た]ち、あなたの髪[かみ]は伸[の]びた。しかし、あなたは裸[はだか]で、恥[はじ]をさらしていた。"
