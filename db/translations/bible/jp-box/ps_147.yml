verses:
  0: "アレルヤ。ハガイとゼカリヤの詩[うた]。"
  1: "エルサレムよ、主[しゅ]をほめたたえよ。シオンよ、あなたの神[かみ]をほめたたえよ。"
  2: "主[しゅ]はあなたの門[もん]のかんぬきを堅[かた]くし、あなたの中[なか]にいるあなたの子[こ]らを祝福[しゅくふく]されたからである。"
  3: "主[しゅ]はあなたの国[くに]の境[さかい]に平和[へいわ]を置[お]き、最[もっと]も良[よ]い小麦[こむぎ]であなたを満[み]たされる。"
  4: "主[しゅ]はその言葉[ことば]を地[ち]に送[おく]られ、その言葉[ことば]は速[はや]く走[はし]る。"
  5: "主[しゅ]は雪[ゆき]を羊毛[ようもう]のように降[ふ]らせ、霜[しも]を灰[はい]のようにまき散[ち]らされる。"
  6: "主[しゅ]はその氷[こおり]をパンのかけらのように投[な]げつけられる。その寒[さむ]さの前[まえ]に、だれが立[た]っていられようか。"
  7: "主[しゅ]がその言葉[ことば]を送[おく]られると、それらは解[と]ける。主[しゅ]がその風[かぜ]を吹[ふ]かせられると、水[みず]が流[なが]れる。"
  8: "主[しゅ]はその言葉[ことば]をヤコブに、その掟[おきて]と裁[さば]きとをイスラエルに告[つ]げ知[し]らされる。"
  9: "主[しゅ]はどの民[たみ]にもこのようにはなさらなかった。その裁[さば]きを彼[かれ]らに知[し]らせなかった。"

notes:
  0: "Αλληλουια· Αγγαιου καὶ Ζαχαριου — アレルヤ。ハガイとゼカリヤの詩. Надписание — стих 0."
  1: "Ἐπαίνει, Ιερουσαλημ, τὸν κύριον — エルサレムよ、主をほめたたえよ (ἐπαινέω — «хвалить»). αἴνει τὸν θεόν σου, Σιων — シオンよ、あなたの神をほめたたえよ (смена глагола ἐπαινέω/αἰνέω сохранена)."
  2: "ἐνίσχυσεν τοὺς μοχλοὺς τῶν πυλῶν σου — あなたの門のかんぬきを堅くし (ἐνισχύω — «укреплять»; μοχλός — «засов»). εὐλόγησεν τοὺς υἱούς σου ἐν σοί — あなたの中にいるあなたの子らを祝福された."
  3: "ὁ τιθεὶς τὰ ὅριά σου εἰρήνην — あなたの国の境に平和を置き (ὅριον — «предел»; τίθημι — «полагать»). στέαρ πυροῦ ἐμπιπλῶν σε — 最も良い小麦であなたを満たされる (στέαρ — «тук, лучшее»; πυρός — «пшеница»)."
  4: "ὁ ἀποστέλλων τὸ λόγιον αὐτοῦ τῇ γῇ — その言葉を地に送られ (λόγιον — «изречение»). ἕως τάχους δραμεῖται ὁ λόγος αὐτοῦ — その言葉は速く走る (τρέχω — «бежать»)."
  5: "τοῦ διδόντος χιόνα ὡσεὶ ἔριον — 雪を羊毛のように降らせ (χιών — «снег»; ἔριον — «шерсть»). ὁμίχλην ὡσεὶ σποδὸν πάσσοντος — 霜を灰のようにまき散らされる (ὁμίχλη — «мгла, иней»; σποδός — «пепел»; πάσσω — «сыпать»)."
  6: "βάλλοντος κρύσταλλον αὐτοῦ ὡσεὶ ψωμούς — その氷をパンのかけらのように投げつけ (κρύσταλλος — «лёд, хрусталь»; ψωμός — «кусок»). κατὰ πρόσωπον ψύχους αὐτοῦ τίς ὑποστήσεται — その寒さの前に、だれが立っていられようか (ψῦχος — «холод»; ὑφίστημι — «выдерживать»)."
  7: "ἀποστελεῖ τὸν λόγον αὐτοῦ καὶ τήξει αὐτά — 主がその言葉を送られると、それらは解ける (τήκω — «плавить»). πνεύσει τὸ πνεῦμα αὐτοῦ, καὶ ῥυήσεται ὕδατα — 主がその風を吹かせられると、水が流れる (πνεῦμα здесь — «ветер», поэтому 風, а не 霊; ῥέω — «течь»)."
  8: "ἀπαγγέλλων τὸν λόγον αὐτοῦ τῷ Ιακωβ — その言葉をヤコブに告げ知らせ (ἀπαγγέλλω — «возвещать»). δικαιώματα καὶ κρίματα αὐτοῦ τῷ Ισραηλ — その掟と裁きとをイスラエルに (δικαίωμα — «устав»; κρίμα — «суд»)."
  9: "οὐκ ἐποίησεν οὕτως παντὶ ἔθνει — どの民にもこのようにはなさらなかった (ἔθνος — «народ»). τὰ κρίματα αὐτοῦ οὐκ ἐδήλωσεν αὐτοῖς — その裁きを彼らに知らせなかった (δηλόω — «являть»)."
