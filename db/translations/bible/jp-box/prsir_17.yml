# jp-box, Сирах, глава 17. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для книги нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 17: 1–4 творение человека, образ Божий, власть над тварью; 5 семь даров
# (в модуле «.»); 6–10 разум, язык, очи, уши, сердце; 11–14 закон жизни и завет;
# 15–21 всеведение Божие и долготерпение; 22–24 милостыня, суд и покаяние;
# 25–32 призыв обратиться, хвала в аду, немощь человека.
# Прямая речь: 17:14 — слова Бога в 「…」 (вводка «и сказал им»); больше нет.
# Красного и синего нет.
# Нумерация по gr: 32 стиха. Слав. 17 — 31 стих: csl 17:5 = gr 17:6 (стиха о семи
# дарах слав. не знает), csl 17:14–15 делят gr 17:17, csl 17:16 = gr 19, csl 17:17 =
# gr 20, csl 17:18 = gr 22, csl 17:21–22 делят gr 25, csl 17:25–26 — gr 28,
# csl 17:28–29 — gr 30. Держимся gr.
# Дефекты модуля (`.`): 17:5, 17:9, 17:16, 17:18, 17:21. 17:5 переведён по полному
# церковному греч. тексту (GOARCH, в скобках; Комплютензиана); 17:9 — по делению
# церковного текста (в модуле обе клаузы слиты в ст. 10); 17:16, 18, 21 в LXX-модуле
# и слав. отсутствуют, переведены по полному греч. тексту (Комплютензиана, KJV
# Apocrypha), где они стоят на тех же номерах. 〔…〕 не ставим.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).

