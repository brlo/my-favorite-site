verses:
  1: "主[しゅ]は地[ち]から人[ひと]を造[つく]り、またその人を地に帰[かえ]らされた。"
  2: "主[しゅ]は彼[かれ]らに日々[ひび]の数[かず]と時[とき]を与[あた]え、地[ち]の上[うえ]にあるものの支配[しはい]を彼らに与えられた。"
  3: "主[しゅ]はご自身[じしん]のように彼[かれ]らに力[ちから]を着[き]せ、ご自分[じぶん]の像[かたち]に従[したが]って彼らを造[つく]られた。"
  4: "主[しゅ]はすべての肉[にく]の上[うえ]にご自分[じぶん]への恐[おそ]れを置[お]き、獣[けもの]と鳥[とり]を支配[しはい]させられた。"
  5: "彼[かれ]らは主[しゅ]の五[いつ]つの働[はたら]きを用[もち]いることを受[う]け、六[むっ]つ目[め]には悟[さと]りを、七[なな]つ目[め]には主の働きを解[と]き明[あ]かす言[ことば]を、分[わ]け与[あた]えられた。"
  6: "主[しゅ]は彼[かれ]らに思[おも]いめぐらすための考[かんが]えと舌[した]と目[め]、耳[みみ]と心[こころ]を与[あた]えられた。"
  7: "主[しゅ]は彼[かれ]らを悟[さと]りの知識[ちしき]で満[み]たし、善[ぜん]と悪[あく]を彼らに示[しめ]された。"
  8: "主[しゅ]はご自分[じぶん]の目[め]を彼[かれ]らの心[こころ]の上[うえ]に置[お]き、ご自分のわざの偉大[いだい]さを彼らに示[しめ]ようとされた。"
  9: "彼[かれ]らは主[しゅ]の聖[せい]なる名[な]をほめたたえる。"
  10: "それは、主[しゅ]のわざの偉大[いだい]さを語[かた]り告[つ]げるためである。"
  11: "主[しゅ]は彼[かれ]らに知識[ちしき]を加[くわ]え、命[いのち]の律法[りっぽう]を彼らに嗣業[しぎょう]として与[あた]えられた。"
  12: "主[しゅ]は彼[かれ]らと永遠[えいえん]の契約[けいやく]を立[た]て、ご自分[じぶん]の裁[さば]きを彼らに示[しめ]された。"
  13: "彼[かれ]らの目[め]は主[しゅ]の栄光[えいこう]の偉大[いだい]さを見[み]、彼らの耳[みみ]は主の声[こえ]の栄光を聞[き]いた。"
  14: "主[しゅ]は彼[かれ]らに言[い]われた。「すべていかなる不正[ふせい]からも身[み]を守[まも]れ」。そして、それぞれの者[もの]に隣人[りんじん]について戒[いまし]めを与[あた]えられた。"
  15: "彼[かれ]らの道[みち]はいつも主[しゅ]の前[まえ]にあり、主の目[め]から隠[かく]れることはない。"
  16: "人[ひと]は若[わか]い時[とき]から悪[あく]に傾[かたむ]き、石[いし]の心[こころ]を肉[にく]の心に変[か]える力[ちから]もなかった。"
  17: "主[しゅ]はそれぞれの民[たみ]に指導者[しどうしゃ]を立[た]てられた。イスラエルは主の嗣業[しぎょう]である。"
  18: "主[しゅ]は初[はつ]子[ご]としてイスラエルを戒[いまし]めをもって養[やしな]い、愛[あい]の光[ひかり]を与[あた]えて見捨[みす]てられない。"
  19: "彼[かれ]らのわざはすべて太陽[たいよう]のように主[しゅ]の前[まえ]にあり、主の目[め]はいつも彼らの道[みち]に注[そそ]がれている。"
  20: "彼[かれ]らの不正[ふせい]は主[しゅ]から隠[かく]れず、そのすべての罪[つみ]は主の前[まえ]にある。"
  21: "しかし主[しゅ]はあわれみ深[ぶか]く、ご自分[じぶん]の造[つく]ったものを知[し]っておられ、彼[かれ]らを捨[す]てず、見放[みはな]さず、惜[お]しまれた。"
  22: "人[ひと]の施[ほどこ]しは主[しゅ]のもとで印[いん]のようであり、人[ひと]の恵[めぐ]みを主は瞳[ひとみ]のように守[まも]られる。"
  23: "その後[のち]、主[しゅ]は立[た]ち上[あ]がって彼[かれ]らに報[むく]い、その報いを彼らの頭[あたま]に返[かえ]される。"
  24: "しかし主[しゅ]は悔[く]い改[あらた]める者[もの]に帰[かえ]る道[みち]を与[あた]え、忍耐[にんたい]を失[うしな]いかけた者たちを励[はげ]まされた。"
  25: "主[しゅ]に立[た]ち帰[かえ]り、罪[つみ]を捨[す]てよ。主の前[まえ]に祈[いの]り、つまずきを少[すく]なくせよ。"
  26: "いと高[たか]い方[かた]に帰[かえ]り、不正[ふせい]から離[はな]れよ。忌[い]むべきものを激[はげ]しく憎[にく]め。"
  27: "よみの国[くに]で、だれが生[い]ける者[もの]たち、感謝[かんしゃ]をささげる者たちの代[か]わりに、いと高[たか]い方をほめたたえるだろうか。"
  28: "死[し]んだ者[もの]からは、存在[そんざい]しない者からのように、感謝[かんしゃ]は消[き]え失[う]せる。生[い]きていて健[すこ]やかな者が主[しゅ]をほめたたえる。"
  29: "主[しゅ]のあわれみは何[なん]と大[おお]きいことか。主に立[た]ち帰[かえ]る者[もの]への宥[ゆる]しも、何と大きいことか。"
  30: "人[ひと]のうちにすべてがあることはできない。人[ひと]の子[こ]は不死[ふし]ではないからである。"
  31: "太陽[たいよう]よりも明[あか]るいものがあるだろうか。それさえも消[き]え去[さ]る。肉[にく]と血[ち]は悪[あく]を思[おも]いめぐらす。"
  32: "主[しゅ]はご自身[じぶん]で天[てん]の高[たか]みの力[ちから]を見[み]ておられる。人[ひと]はすべて地[ち]と灰[はい]にすぎない。"

notes:
  1: "Κύριος ἔκτισεν ἐκ γῆς ἄνθρωπον — «Господь создал из земли человека» (κτίζω — созидать); πάλιν ἀπέστρεψεν αὐτὸν εἰς αὐτήν — «и опять возвратил его в неё». Ср. Быт 2:7; 3:19; слав. «паки возврати его в ню»."
  2: "ἡμέρας ἀριθμοῦ — «число дней» (ἀριθμός — число); καιρὸν ἔδωκεν αὐτοῖς — «и время дал им»; ἐξουσίαν τῶν ἐπ᾿ αὐτῆς — «власть над сущими на ней». Слав. «Дни числа и время даде им»."
  3: "καθ᾿ ἑαυτὸν ἐνέδυσεν αὐτοὺς ἰσχύν — «как Он Сам, облёк их силою» (ἐνδύω — одевать); κατ᾿ εἰκόνα αὐτοῦ ἐποίησεν αὐτούς — «по образу Своему сотворил их» (εἰκών — образ). Слав. «Якоже они сами»; LXX читает «как Он Сам», слав. чтение в notes."
  4: "ἔθηκεν τὸν φόβον αὐτοῦ ἐπὶ πάσης σαρκός — «положил страх Свой на всякую плоть»; κατακυριεύειν θηρίων καὶ πετεινῶν — «господствовать над зверями и птицами» (κατακυριεύω — властвовать). Ср. Быт 1:26,28; 9:2."
  5: "В gr-lxx-byz на месте стиха стоит «.» (дефект модуля). ἔλαβον χρῆσιν τῶν πέντε τοῦ Κυρίου ἐνεργημάτων — «получили употребление пяти действий Господних» (χρῆσις — пользование; ἐνέργημα — действие); ἕκτον δὲ νοῦν αὐτοῖς ἐδωρήσατο — «шестым же даровал им ум» (νοῦς); ἕβδομον λόγον ἑρμηνέα τῶν ἐνεργημάτων αὐτοῦ — «седьмым — слово, истолкователя действий Его» (ἑρμηνεύς — толкователь). Чтение по полному церковному греч. тексту (GOARCH, в скобках); в слав. стиха нет: csl 17:5 = гр 17:6."
  6: "διαβούλιον καὶ γλῶσσαν καὶ ὀφθαλμούς, ὦτα καὶ καρδίαν — «совет (разумение), и язык, и очи, уши и сердце» (διαβούλιον — размышление, помысел); ἔδωκεν διανοεῖσθαι αὐτοῖς — «дал им разуметь». Слав. 17:5. Стих продолжает мысль ст. 5 (пять чувств и ум)."
  7: "ἐπιστήμην συνέσεως ἐνέπλησεν αὐτούς — «знанием разумения исполнил их» (σύνεσις — понимание); ἀγαθὰ καὶ κακὰ ὑπέδειξεν αὐτοῖς — «доброе и злое показал им» (ὑποδείκνυμι — показывать). Слав. 17:6."
  8: "ἔθηκεν τὸν ὀφθαλμὸν αὐτοῦ ἐπὶ τὰς καρδίας αὐτῶν — «положил око Своё на сердца их»; δεῖξαι αὐτοῖς τὸ μεγαλεῖον τῶν ἔργων αὐτοῦ — «чтобы показать им величие дел Его» (μεγαλεῖον — величие). Слав. 17:7."
  9: "В gr-lxx-byz на месте стиха стоит «.». καὶ ὄνομα ἁγιασμοῦ αἰνέσουσιν — «и имя святыни Его восхвалят» (ἁγιασμός — освящение, святыня). В модуле эта клауза слита со ст. 10 («καὶ ὄνομα… ἵνα διηγῶνται…»); по церковному тексту (GOARCH) разделяем, чтобы не дублировать: ст. 10 — только вторая клауза. Слав. 17:8 вбирает обе."
  10: "ἵνα διηγῶνται τὰ μεγαλεῖα τῶν ἔργων αὐτοῦ — «чтобы возвещали величия дел Его» (διηγέομαι — рассказывать). В модуле стих содержит и первую клаузу (см. notes 9); здесь — только вторая, по делению церковного текста. Слав. 17:8."
  11: "προσέθηκεν αὐτοῖς ἐπιστήμην — «приложил им знание» (προστίθημι — прибавлять); νόμον ζωῆς ἐκληροδότησεν αὐτοῖς — «закон жизни дал им в наследие» (κληροδοτέω — наделять наследством). Слав. 17:9."
  12: "διαθήκην αἰῶνος ἔστησεν μετ᾿ αὐτῶν — «завет вечный поставил с ними» (διαθήκη αἰῶνος); τὰ κρίματα αὐτοῦ ὑπέδειξεν αὐτοῖς — «суды Свои показал им» (κρίμα — суд, определение). Слав. 17:10."
  13: "μεγαλεῖον δόξης εἶδον οἱ ὀφθαλμοὶ αὐτῶν — «величие славы увидели глаза их»; δόξαν φωνῆς αὐτοῦ ἤκουσεν τὸ οὖς αὐτῶν — «славу голоса Его услышало ухо их». Слав. 17:11, где «гласа их» (возможно, «его» — разночтение); держимся LXX."
  14: "καὶ εἶπεν αὐτοῖς· Προσέχετε ἀπὸ παντὸς ἀδίκου — «и сказал им: внимайте от всякой неправды» (προσέχω — внимать, беречься). ἐνετείλατο αὐτοῖς ἑκάστῳ περὶ τοῦ πλησίον — «заповедал каждому о ближнем». Слова Бога — 「…」; слав. 17:12."
  15: "αἱ ὁδοὶ αὐτῶν ἐναντίον αὐτοῦ διὰ παντός — «пути их пред Ним всегда»; οὐ κρυβήσονται ἀπὸ τῶν ὀφθαλμῶν αὐτοῦ — «не скроются от очей Его» (κρύπτω — скрывать). Слав. 17:13."
  16: "В gr-lxx-byz на месте стиха стоит «.» (дефект модуля). В полном греч. тексте (GII/Комплютензиана; KJV Apocrypha: «Every man from his youth is given to evil; neither could they make to themselves fleshy hearts for stony») стих говорит, что человек от юности склонен к злому и не смог сделать сердце плотяным вместо каменного (ср. νεότης — юность, λίθινος — каменный, σάρκινος — плотяной). В Rahlfs, модуле и слав. стиха нет (слав. 17:16 = гр 17:19)."
  17: "ἑκάστῳ ἔθνει κατέστησεν ἡγούμενον — «каждому народу поставил вождя» (ἡγούμενος — вождь, правитель); μερὶς κυρίου Ισραηλ ἐστίν — «часть Господня — Израиль» (μερίς — удел). Слав. 17:14–15 делит стих надвое; держимся gr."
  18: "В gr-lxx-byz на месте стиха стоит «.» (дефект модуля). Полный греч. текст (Комплютензиана; KJV: «Whom, being his firstborn, he nourisheth with discipline, and giving him the light of his love doth not forsake him») говорит, что Господь как первородного (πρωτότοκος) воспитывает Свой удел наставлением (παιδεία) и, давая свет любви Своей, не оставляет его. В Rahlfs, модуле и слав. стиха нет."
  19: "ἅπαντα τὰ ἔργα αὐτῶν ὡς ὁ ἥλιος ἐναντίον αὐτοῦ — «все дела их, как солнце, пред Ним»; οἱ ὀφθαλμοὶ αὐτοῦ ἐνδελεχεῖς ἐπὶ τὰς ὁδοὺς αὐτῶν — «очи Его непрестанно на путях их» (ἐνδελεχής — постоянный). Слав. 17:16."
  20: "οὐκ ἐκρύβησαν αἱ ἀδικίαι αὐτῶν ἀπ᾿ αὐτοῦ — «не скрылись неправды их от Него»; πᾶσαι αἱ ἁμαρτίαι αὐτῶν ἔναντι κυρίου — «все грехи их пред Господом». Слав. 17:17."
  21: "В gr-lxx-byz на месте стиха стоит «.» (дефект модуля). Полный греч. текст (Комплютензиана; KJV: «But the Lord being gracious and knowing his workmanship, neither left nor forsook them, but spared them») говорит, что Господь, будучи благ и зная Своё создание, не оставил и не презрел их, но пощадил (ἐφείσατο). В Rahlfs, модуле и слав. стиха нет (слав. 17:18 = гр 17:22)."
  22: "ἐλεημοσύνη ἀνδρὸς ὡς σφραγὶς μετ᾿ αὐτοῦ — «милостыня человека, как печать, при нём» (σφραγίς — печать); χάριν ἀνθρώπου ὡς κόρην συντηρήσει — «благодать человека, как зеницу, сохранит» (κόρη — зрачок, зеница). Слав. 17:18."
  23: "μετὰ ταῦτα ἐξαναστήσεται — «после этого восстанет» (ἐξανίστημι); ἀνταποδώσει αὐτοῖς — «воздаст им» (ἀνταποδίδωμι — воздавать); εἰς κεφαλὴν αὐτῶν ἀποδώσει — «на голову им воздаст». Слав. 17:19."
  24: "πλὴν μετανοοῦσιν ἔδωκεν ἐπάνοδον — «но кающимся дал возвращение» (μετάνοια — покаяние; ἐπάνοδος — возврат); παρεκάλεσεν ἐκλείποντας ὑπομονήν — «ободрил оскудевающих в терпении» (ἐκλείπω — оставлять). Слав. 17:20."
  25: "Ἐπίστρεφε ἐπὶ κύριον — «обращайся к Господу» (ἐπιστρέφω — обращать); ἀπόλειπε ἁμαρτίας — «оставь грехи»; δεήθητι κατὰ πρόσωπον — «помолись пред лицом»; σμίκρυνον πρόσκομμα — «умали преткновение» (πρόσκομμα — преткновение, соблазн). Слав. 17:21–22 делит стих надвое."
  26: "ἐπάναγε ἐπὶ ὕψιστον — «возвратись к Всевышнему» (ἐπανάγω); ἀπόστρεφε ἀπὸ ἀδικίας — «отвратись от неправды»; σφόδρα μίσησον βδέλυγμα — «весьма возненавидь мерзость» (βδέλυγμα — мерзость). Слав. 17:23."
  27: "ὑψίστῳ τίς αἰνέσει ἐν ᾅδου — «Всевышнего кто восхвалит в аде» (ᾅδης — ад, преисподняя); ἀντὶ ζώντων καὶ διδόντων ἀνθομολόγησιν — «вместо живых и дающих благодарение» (ἀνθομολόγησις — благодарение). Слав. 17:24."
  28: "ἀπὸ νεκροῦ ὡς μηδὲ ὄντος ἀπόλλυται ἐξομολόγησις — «от мёртвого, как от несуществующего, погибает исповедание» (ἐξομολόγησις — исповедание, благодарение); ζῶν καὶ ὑγιὴς αἰνέσει τὸν κύριον — «живой и здоровый восхвалит Господа». Слав. 17:25–26."
  29: "ὡς μεγάλη ἡ ἐλεημοσύνη τοῦ κυρίου — «как велика милостыня (милосердие) Господа»; ἐξιλασμὸς τοῖς ἐπιστρέφουσιν ἐπ᾿ αὐτόν — «умилостивление обращающимся к Нему» (ἐξιλασμός). Слав. 17:27."
  30: "οὐ γὰρ δύναται πάντα εἶναι ἐν ἀνθρώποις — «ибо не может всё быть в людях»; ὅτι οὐκ ἀθάνατος υἱὸς ἀνθρώπου — «потому что не бессмертен сын человеческий» (ἀθάνατος). Слав. 17:28–29 делит стих надвое."
  31: "τί φωτεινότερον ἡλίου — «что светлее солнца» (φωτεινός — светлый); καὶ τοῦτο ἐκλείπει — «и оно исчезает» (ἐκλείπω); πονηρὸν ἐνθυμηθήσεται σὰρξ καὶ αἷμα — «злое помыслит плоть и кровь». Слав. 17:30."
  32: "δύναμιν ὕψους οὐρανοῦ αὐτὸς ἐπισκέπτεται — «силу высоты неба Сам надзирает» (ἐπισκέπτομαι — посещать, надзирать); ἄνθρωποι πάντες γῆ καὶ σποδός — «люди все — земля и пепел» (σποδός — пепел). Слав. 17:31."
