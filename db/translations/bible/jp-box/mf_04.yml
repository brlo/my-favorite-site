verses:
  1: "その後[のち]、イエスは霊[れい]によって荒[あ]れ野[の]へ導[みちび]き出[だ]され、悪魔[あくま]の試[こころ]みを受[う]けられた。"
  2: "四十日[しじゅうにち]四十夜[しじゅうや]、断食[だんじつ]して後[のち]、空腹[くうふく]を覚[おぼ]えられた。"
  3: "すると、試[こころ]みる者[もの]が近[ちか]づいて来[き]て言[い]った。「神[かみ]の子[こ]なら、これらの石[いし]がパンになるように命[めい]じてみなさい。」"
  4: "イエスはお答[こた]えになった。「<j>『人[ひと]はパンだけでは生[い]きられない。神[かみ]の口[くち]から出[で]る言葉[ことば]の一つひとつによって生[い]きるのだ』と書[か]いてある。</j>」"
  5: "続[つづ]いて悪魔[あくま]はイエスを聖[せい]なる都[みやこ]へ連[つ]れ去[さ]り、神殿[しんでん]の屋根[やね]の突端[とったん]に立[た]たせた。"
  6: "言[い]った。「神[かみ]の子[こ]なら、下[した]へ飛[と]び降[お]りてみなさい。『神[かみ]はあなたのために天使[てんし]たちに命[めい]じて、あなたの足[あし]が石[いし]に打[ぶ]ち当[あ]たらないように、天使[てんし]たちが手[て]であなたを支[ささ]える』と書[か]いてある。」"
  7: "イエスは言[い]われた。「<j>『あなたの神[かみ]である主[しゅ]を試[こころ]みてはならない』とも書[か]いてある。</j>」"
  8: "また悪魔[あくま]は、とても高[たか]い山[やま]の上[うえ]へイエスを伴[ともな]って行[い]き、世界[せかい]のすべての国[くに]とその栄[は]えを見[み]せて、"
  9: "言[い]った。「ひれ伏[ふ]してわたしを拝[おが]むなら、これらすべてをあなたに与[あた]えよう。」"
  10: "イエスは言[い]われた。「<j>サタン、わたしの前[まえ]から去[さ]れ。『主[しゅ]なるあなたの神[かみ]を拝[おが]み、その方[かた]にのみ仕[つか]えよ』と書[か]いてある。</j>」"
  11: "すると悪魔[あくま]はイエスを離[はな]れて去[さ]り、見[み]ると、天使[てんし]たちが近[ちか]くへ来[き]て、イエスに仕[つか]えた。"
  12: "ヨハネが捕[と]らえられたことを耳[みみ]にすると、イエスはガリラヤへ退[しりぞ]かれた。"
  13: "そしてナザレを去[さ]り、ゼブルンとナフタリの地[ち]にある湖[みずうみ]べりの町[まち]カファルナウムへ移[うつ]って、そこにお住[す]まいになった。"
  14: "こうして、預言者[よげんしゃ]イザヤによって語[かた]られた言葉[ことば]が成就[じょうじゅ]した。"
  15: "「ゼブルンの地[ち]、ナフタリの地[ち]、海[うみ]への道[みち]、ヨルダン川[がわ]の向[む]こう側[がわ]、異邦人[いほうじん]のガリラヤ、"
  16: "暗[くら]やみに住[す]む民[たみ]は大[おお]きな光[ひかり]を見[み]、死[し]の陰[かげ]の地[ち]に住[す]む者[もの]たちに光[ひかり]が輝[かがや]いた。」"
  17: "そのときから、イエスは宣[の]べ伝[つた]え始[はじ]めて、言[い]われた。「<j>悔[く]い改[あらた]めよ。天[てん]の国[くに]は近[ちか]づいた。</j>」"
  18: "イエスがガリラヤ湖[みずうみ]の岸[きし]を歩[ある]いておられると、二人[ふたり]の兄弟[きょうだい]、ペトロと呼[よ]ばれるシモンと、その兄弟[きょうだい]アンデレが、湖[みずうみ]に網[あみ]を打[う]っているのが目[め]にとまった。彼[かれ]らは漁師[りょうし]であった。"
  19: "イエスは彼[かれ]らに言[い]われた。「<j>わたしについて来[き]なさい。あなたがたを、人[ひと]をとる漁師[りょうし]にしよう。</j>」"
  20: "二人[ふたり]はすぐさま網[あみ]を手放[てばな]して、イエスの後[あと]について行[い]った。"
  21: "そこを立[た]ち去[さ]って少[すこ]し進[すす]むと、ほかに二人[ふたり]の兄弟[きょうだい]、ゼベダイの子[こ]ヤコブとその弟[おとうと]ヨハネが、父[ちち]ゼベダイとともに舟[ふね]の中[なか]で網[あみ]の手入[てい]れをしているのが目[め]に入[はい]った。イエスは彼[かれ]らを呼[よ]ばれた。"
  22: "二人[ふたり]もまた、すぐに舟[ふね]と父[ちち]をあとに残[のこ]して、イエスの後[あと]を追[お]った。"
  23: "イエスはガリラヤの全土[ぜんど]を巡[めぐ]り歩[ある]き、会堂[かいどう]で教[おし]え、御国[みくに]の福音[ふくいん]を告[つ]げ知[し]らせ、民[たみ]のあらゆる病[やまい]と患[わずら]いを癒[いや]された。"
  24: "イエスのうわさはシリア全土[ぜんど]に広[ひろ]まった。人々[ひとびと]は、さまざまな病気[びょうき]や激[はげ]しい苦[くる]しみに悩[なや]む者[もの]、悪霊[あくりょう]に取[と]りつかれた者[もの]、てんかんの者[もの]、麻痺[まひ]した者[もの]など、すべての病人[びょうにん]をイエスのもとへ連[つ]れて来[き]たので、イエスは彼[かれ]らを癒[いや]された。"
  25: "ガリラヤ、デカポリス、エルサレム、ユダヤ、そしてヨルダン川[がわ]の向[む]こう岸[ぎし]から、大勢[おおぜい]の群衆[ぐんしゅう]がイエスの後[あと]について来[き]た。"

