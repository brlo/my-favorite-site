# лисы и факелы, пожар в полях (4–5), расправа филистимлян над женой (6),
# ответ Самсона и поражение «по бедру» (7–8), стан в Лехи (9–10), три тысячи иудеев
# у скалы Етам (11–13), разрыв верёвок и ослиная челюсть (14–16), источник в Лехи (17–19),
# двадцать лет суда (20).
