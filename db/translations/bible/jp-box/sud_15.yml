verses:
  1: "しばらくして、麦[むぎ]の刈[か]り入[い]れのころ、サムソンは山羊[やぎ]の子[こ]を携[たずさ]えて妻[つま]を訪[おとず]れ、言[い]った。「妻[つま]のところへ、寝室[しんしつ]に入[はい]ろう。」しかし、彼女[かのじょ]の父[ちち]は彼[かれ]が彼女[かのじょ]のところへ入[はい]るのを許[ゆる]さなかった。"
  2: "彼女[かのじょ]の父[ちち]は言[い]った。「あなたが彼女[かのじょ]を憎[にく]み嫌[きら]ったと思[おも]って、わたしは彼女[かのじょ]をあなたの友[とも]の一人[ひとり]に与[あた]えたのだ。彼女[かのじょ]の妹[いもうと]は彼女[かのじょ]より美[うつく]しくはないか。彼女[かのじょ]の代[か]わりに、あの娘[むすめ]をあなたのものとしなさい。」"
  3: "サムソンは彼[かれ]に言[い]った。「今度[こんど]は、わたしがペリシテ人[じん]に悪[わる]を行[おこな]っても、わたしには罪[つみ]がない。」"
  4: "サムソンは行[ゆ]って三百匹[さんびゃくひき]の狐[きつね]を捕[つか]まえ、たいまつを取[と]って、尾[お]を尾[お]につなぎ、二[ふた]つの尾[お]の間[あいだ]に一本[いっぽん]のたいまつを結[むす]びつけた。"
  5: "そして、たいまつに火[ひ]を点[つ]けて、ペリシテ人[じん]の刈[か]り入[い]れの畑[はたけ]へ放[はな]ち、麦[むぎ]の束[たば]からまだ立[た]っている麦[むぎ]まで、ぶどう畑[ばたけ]もオリーブの木[き]も焼[や]き払[はら]った。"
  6: "ペリシテ人[じん]は言[い]った。「だれがこれをしたのか。」そして言[い]った。「ティムナ人[じん]の婿[むこ]のサムソンだ。彼[かれ]がその妻[つま]を取[と]って、友[とも]の一人[ひとり]に与[あた]えたからだ。」そこでペリシテ人[じん]は上[のぼ]って行[ゆ]き、彼女[かのじょ]の父[ちち]の家[いえ]と、彼女[かのじょ]と、その父[ちち]とを火[ひ]で焼[や]いた。"
  7: "サムソンは彼[かれ]らに言[い]った。「あなたがたがそうするなら、わたしは承知[しょうち]しない。あなたがたの一人[ひとり]一人[ひとり]から、わたしは報復[ほうふく]をする。」"
  8: "彼[かれ]は彼[かれ]らを、ももに大[おお]きな打撃[だげき]を与[あた]えて打[う]ち倒[たお]した。それから下[くだ]って行[ゆ]き、エタムの洞窟[どうくつ]のそばの谷川[たにがわ]のほとりに住[す]んだ。"
  9: "ペリシテ人[じん]は上[のぼ]って来[き]て、ユダに陣[じん]を張[は]り、レヒに散[ち]らばった。"
  10: "ユダの人[ひと]たちは言[い]った。「なぜあなたがたはわたしたちのところへ上[のぼ]って来[き]たのか。」ペリシテ人[じん]は言[い]った。「サムソンを縛[しば]り、彼[かれ]がわたしたちにしたとおりに、彼[かれ]にするためだ。」"
  11: "ユダから三千人[さんぜんにん]がエタムの岩[いわ]の裂[さ]け目[め]へ下[くだ]って行[ゆ]き、サムソンに言[い]った。「ペリシテ人[じん]がわたしたちを支配[しはい]しているのを知[し]らないのか。なぜあなたはわたしたちにこんなことをしたのか。」サムソンは彼[かれ]らに言[い]った。「彼[かれ]らがわたしにしたとおりに、わたしも彼[かれ]らにしたのだ。」"
  12: "彼[かれ]らは彼[かれ]に言[い]った。「あなたを縛[しば]ってペリシテ人[じん]の手[て]に渡[わた]すために下[くだ]って来[き]た。」サムソンは彼[かれ]らに言[い]った。「あなたがた自身[じしん]がわたしを殺[ころ]さないと、わたしに誓[ちか]ってくれ。そして、わたしを彼[かれ]らに渡[わた]してくれ。あなたがたがわたしと向[む]き合[あ]うことのないように。」"
  13: "彼[かれ]らは彼[かれ]に誓[ちか]って言[い]った。「いいえ。わたしたちはあなたを縛[しば]って彼[かれ]らの手[て]に渡[わた]すだけだ。決[けっ]して殺[ころ]しはしない。」そして彼[かれ]を新[あたら]しい二本[にほん]の縄[なわ]で縛[しば]り、岩[いわ]から引[ひ]き上[あ]げた。"
  14: "彼[かれ]がレヒまで来[き]たとき、ペリシテ人[じん]は叫[さけ]び声[ごえ]をあげ、彼[かれ]に迎[むか]え撃[う]ちに走[はし]って来[き]た。すると、主[しゅ]の霊[れい]が彼[かれ]の上[うえ]に下[くだ]り、彼[かれ]の腕[うで]にあった縄[なわ]は、火[ひ]に触[ふ]れた麻[あさ]くずのようになって、束縛[そくばく]は彼[かれ]の腕[うで]から解[と]けた。"
  15: "彼[かれ]は道[みち]に捨[す]てられた驢馬[ろば]の顎骨[がっこつ]を見[み]つけ、手[て]を伸[の]ばしてそれを取[と]り、それで千人[せんにん]の者[もの]を打[う]ち殺[ころ]した。"
  16: "サムソンは言[い]った。「驢馬[ろば]の顎骨[がっこつ]で、わたしは彼[かれ]らを拭[ぬぐ]い去[さ]った。驢馬[ろば]の顎骨[がっこつ]で、わたしは千人[せんにん]の者[もの]を打[う]った。」"
  17: "彼[かれ]が語[かた]り終[お]えると、顎骨[がっこつ]を手[て]から投[な]げ捨[す]て、その場所[ばしょ]を「顎骨[がっこつ]の打[う]ち倒[たお]し」と呼[よ]んだ。"
  18: "彼[かれ]はひどく渇[かわ]き、主[しゅ]に呼[よ]ばわって言[い]った。「あなたはこの大[おお]きな救[すく]いを、あなたのしもべの手[て]のうちに与[あた]えられました。しかし今[いま]、わたしは渇[かわ]きのために死[し]に、割礼[かつれい]を受[う]けていない者[もの]たちの手[て]に落[お]ちてしまいます。」"
  19: "神[かみ]は顎骨[がっこつ]の裂[さ]け目[め]を開[ひら]き、そこから水[みず]が流[なが]れ出[で]た。彼[かれ]はそれを飲[の]んで、息[いき]が戻[もど]り、生[い]き返[かえ]った。それゆえ、その名[な]は今日[こんにち]まで「呼[よ]び求[もと]める者[もの]の泉[いずみ]」と呼[よ]ばれている。"
  20: "彼[かれ]はペリシテ人[じん]の時代[じだい]に二十年[にじゅうねん]の間[あいだ]、イスラエルを裁[さば]いた。"

notes:
  1: "μεθ᾿ ἡμέρας ἐν ἡμέραις θερισμοῦ πυρῶν — «через несколько дней, во дни жатвы пшеницы». ἐπεσκέψατο — «посетил» (ἐπισκέπτομαι). εἰς τὸν κοιτῶνα — «в спальню» (κοιτών). οὐκ ἀφῆκεν — «не позволил» (ἀφίημι)."
  2: "Εἴπας εἶπα — «сказав, сказал я», т.е. «я решил» (усиленный оборот). μισῶν ἐμίσησας — «возненавидел». τῷ συνεταίρῳ σου — «товарищу твоему». κρείσσων — «лучше» (слав. «добрейши»), т.е. красивее. ἔστω σοι ἀντὶ αὐτῆς — «да будет тебе вместо неё»."
  3: "Ἀθῷός εἰμι τὸ ἅπαξ — «неповинен я на этот раз» (ἀθῷος — невинный; τὸ ἅπαξ — «однажды, на сей раз»; слав. «чист есмь ныне»). ποιῶ μεθ᾿ ὑμῶν κακά — «делаю с вами зло»: обращено к филистимлянам, хотя отвечает тестю."
  4: "συνέλαβεν τριακοσίας ἀλώπεκας — «поймал триста лисиц» (συλλαμβάνω). λαμπάδας — たいまつ (λαμπάς). κέρκον πρὸς κέρκον — «хвост к хвосту» (κέρκος — хвост). ἀνὰ μέσον τῶν δύο κέρκων — «между двумя хвостами»."
  5: "ἐξῆψεν πῦρ — «зажёг огонь» (ἐξάπτω). εἰς τὰ δράγματα — «в снопы, в жатву» (δράγμα — сноп). τοὺς στάχυας — «колосья». τὰ προτεθερισμένα — «уже сжатое». ἀπὸ στοιβῆς καὶ ἕως ἑστῶτος — «от копны и до стоящего нежатого» (στοιβή — куча, скирда; ἑστώς — причастие ἵστημι); слав. «от гумен и даже до класов простых». ἀμπελῶνος καὶ ἐλαίας — «виноградника и маслины»."
  6: "γαμβρὸς τοῦ Θαμναθαίου — «зять Фимнафянина» (γαμβρός — зять; ティムナ人). ἐνεπύρισαν τὴν οἰκίαν ... καὶ αὐτὴν καὶ τὸν πατέρα αὐτῆς — «сожгли дом её, и её, и отца её» (LXX перечисляет всех троих; слав. «сожгоша ю и дом отца ея»)."
  7: "οὐκ εὐδοκήσω — «не буду доволен, не успокоюсь» (εὐδοκέω). ἐξ ἑνὸς καὶ ἑκάστου ὑμῶν — «от каждого из вас». Слав. добавляет «и посем почию» — этого нет в греч. (масоретское «тогда успокоюсь»), в текст не внесено."
  8: "ἐπὶ μηρὸν πληγὴν μεγάλην — «по бедру поражение великое» (μηρός — бедро; слав. «голени до бедр» — иное членение). χειμάρρῳ — «потоку» (пересыхающая река; 谷川). σπηλαίῳ Ηταμ — «пещере Етам» (洞窟)."
  9: "παρενεβόλοσαν ἐπὶ τὸν Ιουδαν — «расположились станом против Иуды» (παρεμβάλλω). ἐξερρίφησαν ἐν Λεχι — «рассыпались в Лехи» (ἐκρίπτω — выбрасывать, рассыпать); Лехи (לְחִי, «челюсть») — место победы."
  10: "πᾶς ἀνὴρ Ιουδα — «всякий муж Иудин» (слав. «всяк муж иудин»). Δῆσαι τὸν Σαμψων — «связать Самсона» (δέω); инфинитив цели при ответе."
  11: "ὀπὴν τῆς πέτρας — «отверстие, расщелина скалы» (ὀπή). ἄρχουσιν ἡμῶν — «господствуют над нами» (ἄρχω с род.). Καθὼς ἐποίησαν ἡμῖν — «как они поступили с нами» (в греч. ἡμῖν — «нам»)."
  12: "Ὀμόσατέ μοι μὴ ἀποκτεῖναί με — «поклянитесь мне не убивать меня». καὶ παράδοτέ με αὐτοῖς — «и передайте меня им». μήποτε ἀπαντήσητε ὑμεῖς ἐν ἐμοί — «чтобы вам не встретиться со мной», т.е. не пострадать от меня (тёмный оборот, слав. его опускает); передано буквально."
  13: "ὤμοσαν ... λέγοντες — «поклялись, говоря». δεσμῷ δήσομέν σε — «связав свяжем тебя» (усиление). θανάτῳ δὲ οὐ θανατώσομέν σε — «смертью же не умертвим тебя». καλωδίοις καινοῖς — «верёвками новыми» (καλώδιον). ἀνήγαγον ἐκ τῆς πέτρας — «вывели из скалы» (ἀνάγω)."
  14: "ἕως Σιαγόνος — «до Челюсти»: LXX переводит название Лехи (σιαγών — «челюсть»), поэтому в тексте レヒ, а слово объяснено здесь. ἠλάλαξαν — «подняли крик» (ἀλαλάζω). κατηύθυνεν ... πνεῦμα κυρίου — см. 14:6. στιππύον — «пакля, костра» (слав. «изгребие»). ἡνίκα ἂν ὀσφρανθῇ πυρός — «когда она понюхает огня», т.е. обгорит. διελύθησαν — «разрешились» (διαλύω)."
  15: "σιαγόνα ὄνου ἐρριμμένην — «ослиную челюсть брошенную» (ῥίπτω); «свежая» у Синодального — масоретское чтение, в LXX этого слова нет. ἐξέτεινεν τὴν χεῖρα — «протянул руку». ἐπάταξεν ... χιλίους ἄνδρας — «поразил тысячу мужей»."
  16: "Изречение стоит в 「…」 как прямая речь первого уровня. Ἐν σιαγόνι ὄνου ἐξαλείφων ἐξήλειψα — «челюстью осла, стирая, стёр» (ἐξαλείφω — стирать, истреблять; игра слов с σιαγών). У Синодального «толпу, две толпы» — передача еврейской игры слов (חֲמוֹר «осёл» и «груда»), в LXX её нет."
  17: "συνετέλεσεν λαλῶν — «закончил говорить». ἔρριψεν — «бросил». Ἀναίρεσις σιαγόνος — «избиение челюсти» (ἀναίρεσις — уничтожение); LXX переводит название Рамаф-Лехи, поэтому в тексте «顎骨の打ち倒し»."
  18: "ἐδίψησεν σφόδρα — «возжаждал сильно». Σὺ ἔδωκας ἐν χειρὶ τοῦ δούλου σου τὴν σωτηρίαν — «Ты дал в руку раба Твоего спасение» (σωτηρία — 救い). ἀπεριτμήτων — «необрезанных»."
  19: "τὸ τραῦμα τῆς σιαγόνος — «рану, язву челюсти» (τραῦμα). ἐπέστρεψεν τὸ πνεῦμα αὐτοῦ ἐν αὐτῷ — «возвратился дух, дыхание его в нём» (πνεῦμα здесь — дыхание, поэтому 息); слав. «возвратися дух его, и оживе». Πηγὴ ἐπίκλητος σιαγόνος — «источник призывающего, что в челюсти» (ἐπίκλητος — «призванный, названный»); у Синодального «Источник взывающего»."
  20: "ἐν ἡμέραις ἀλλοφύλων — «во дни филистимлян», т.е. пока они владели Израилем (ср. 14:4). εἴκοσι ἔτη — двадцать лет."
