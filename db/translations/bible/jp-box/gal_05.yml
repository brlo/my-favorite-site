# jp-box, Послание к Галатам, глава 5. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 5: свобода и обрезание (1–12), свобода и любовь (13–15),
# дела плоти и плод духа (16–26).
# Красного (<j>) и синего (<mo>) нет: прямой речи Христа и Богородицы в главе нет.
# 〔…〕 два: 5:19 — церковное μοιχεία (в базе только πορνεία);
# 5:21 — церковное φόνοι (в базе только φθόνοι, μέθαι, κῶμοι).
# 5:7 [τῇ] и 5:24 [Ἰησοῦ] стоят в базе в квадратных скобках — слова есть, не оборачиваются;
# 5:24 переведено по церковному тексту (слав., jp-joc без Ἰησοῦ) — キリストのみ.
# πνεῦμα в главе без ἅγιον — 霊 (как Рим 8), не 聖霊.
# Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

tr_code: jp-box
book: gal
chapter: 5
draft: true

verses:
  1: "だから、キリストがわたしたちを解放[かいほう]された、その自由[じゆう]に堅[かた]く立[た]ちなさい。そして、再[ふたた]び奴隷[どれい]の軛[くびき]に捕[と]らわれてはならない。"
  2: "見[み]よ、このわたしパウロがあなたがたに言[い]う。もし割礼[かつれい]を受[う]けるなら、キリストはあなたがたの何[なに]の益[えき]にもならない。"
  3: "わたしはもう一度[いちど]、割礼[かつれい]を受[う]けるすべての人[ひと]に証[あかし]する。その人[ひと]は律法[りっぽう]の全[すべ]てを行[おこな]う義務[ぎむ]を負[お]うのである。"
  4: "律法[りっぽう]によって義[ぎ]とされようとしているあなたがたは、キリストから断[た]ち切[き]られ、恵[めぐ]みから落[お]ちてしまったのである。"
  5: "というのは、わたしたちは霊[れい]によって、信仰[しんこう]から、義[ぎ]の望[のぞ]みを待[ま]ち望[のぞ]んでいるからである。"
  6: "というのは、キリスト・イエスにあっては、割礼[かつれい]も無割礼[むかつれい]も何[なに]の力[ちから]もない。力[ちから]があるのは、愛[あい]によって働[はたら]く信仰[しんこう]である。"
  7: "あなたがたは良[よ]く走[はし]っていた。だれがあなたがたを妨[さまた]げて、真理[しんり]に従[したが]わないようにしたのか。"
  8: "その勧[すす]めは、あなたがたを召[め]された方[かた]からのものではない。"
  9: "少[すこ]しのパン種[ぱんだね]が、生地[きじ]の全[ぜん]体[たい]を膨[ふく]らませる。"
  10: "わたしは、主[しゅ]にあってあなたがたについて、あなたがたがほかの考[かんが]えを持[も]つことはないと確信[かくしん]している。しかし、あなたがたを惑[まど]わしている者[もの]は、それがだれであれ、その裁[さば]きを負[お]うであろう。"
  11: "しかし、兄弟[きょうだい]たちよ、もしわたしが今[いま]もなお割礼[かつれい]を宣[の]べ伝[つた]えているなら、なぜ今[いま]もなお迫害[はくがい]されているのか。それなら、十字架[じゅうじか]のつまずきは無[む]効[こう]になったはずである。"
  12: "あなたがたをかき乱[みだ]している者[もの]たちは、自分[じぶん]たちを去勢[きょせい]してしまえばよいのに。"
  13: "というのは、兄弟[きょうだい]たちよ、あなたがたは自由[じゆう]のために召[め]されたからである。ただ、その自由[じゆう]を肉[にく]への口実[こうじつ]にしてはならない。かえって、愛[あい]をもって互[たが]いに仕[つか]え合[あ]いなさい。"
  14: "というのは、律法[りっぽう]の全[すべ]ては、「あなたの隣人[りんじん]を自分[じぶん]のように愛[あい]せよ」という一[ひと]つの言葉[ことば]において満[み]たされているからである。"
  15: "しかし、もしあなたがたが互[たが]いに噛[か]み合[あ]い、食[く]い合[あ]っているなら、互[たが]いに食[く]い尽[つ]くされないように気[き]をつけなさい。"
  16: "しかし、わたしは言[い]う。霊[れい]によって歩[あゆ]みなさい。そうすれば、肉[にく]の欲[よく]を決[けっ]して満[み]たすことはないであろう。"
  17: "というのは、肉[にく]は霊[れい]に逆[さか]らって欲[ほっ]し、霊[れい]は肉[にく]に逆[さか]らって欲[ほっ]するからである。この二[ふた]つは互[たが]いに敵[てき]対[たい]しているので、あなたがたは、したいと思[おも]うことを行[おこな]えないのである。"
  18: "しかし、もし霊[れい]に導[みちび]かれているなら、あなたがたは律法[りっぽう]の下[もと]にはない。"
  19: "肉[にく]の行[おこな]いは明[あき]らかである。すなわち、〔姦淫[かんいん]〕、淫行[いんこう]、不潔[ふけつ]、好色[こうしょく]、"
  20: "偶像[ぐうぞう]崇拝[すうはい]、魔術[まじゅつ]、敵意[てきい]、争[あらそ]い、妬[ねた]み、怒[いか]り、党派[とうは]心[しん]、分裂[ぶんれつ]、異端[いたん]、"
  21: "嫉[しっ]妬[と]、〔殺人[さつじん]〕、泥酔[でいすい]、酒宴[しゅえん]、そのほか同[おな]じようなものである。これらのことを行[おこな]う者[もの]は神[かみ]の国[くに]を相続[そうぞく]しない、とわたしは前[まえ]にも言[い]ったし、今[いま]もあらかじめ告[つ]げておく。"
  22: "しかし、霊[れい]の実[み]は、愛[あい]、喜[よろこ]び、平和[へいわ]、寛容[かんよう]、親切[しんせつ]、善良[ぜんりょう]、信仰[しんこう]、"
  23: "柔和[じゅうわ]、自制[じせい]である。このようなものに反[はん]する律法[りっぽう]はない。"
  24: "キリストに属[ぞく]する者[もの]たちは、肉[にく]をその情[じょう]念[ねん]や欲[よく]とともに十字架[じゅうじか]につけたのである。"
  25: "もし霊[れい]によって生[い]きているなら、霊[れい]によって歩[あゆ]もうではないか。"
  26: "虚栄[きょえい]を求[もと]める者[もの]とならず、互[たが]いに挑[いど]み合[あ]わず、互[たが]いに妬[ねた]み合[あ]わないようにしよう。"

notes:
  1: "τῇ ἐλευθερίᾳ — «в свободе, которую даровал Христос» (слав., Синодальный, jp-joc); 解放された、その自由に. στῆκετε — 堅く立ちなさい; ζυγὸς δουλείας — 奴隷の軛."
  2: "Ἴδε — 見よ; ὠφελήσει — 益になる; οὐδὲν ὠφελήσει — 何の益にもならない."
  3: "ὀφειλέτης — «должник»; 義務を負う. ὅλον τὸν νόμον ποιῆσαι — 律法のすべてを行う."
  4: "κατηργήθητε ἀπὸ Χριστοῦ — «отсечены, упразднены для Христа»; 断ち切られ. τῆς χάριτος ἐξεπέσατε — 恵みから落ちた."
  5: "ἀπεκδεχόμεθα — «ожидаем с нетерпением»; 待ち望んでいる. ἐλπὶς δικαιοσύνης — 義の望み; πνεύματι ἐκ πίστεως — 霊によって、信仰から."
  6: "ἰσχύει — 力を持つ; πίστις δι' ἀγάπης ἐνεργουμένη — 愛によって働く信仰; ἀλλά передано противопоставлением 力があるのは."
  7: "ἐνέκοψεν — «воспрепятствовал»; 妨げて. [τῇ] в базе в квадратных скобках — слово есть, не оборачивается."
  8: "πεισμονή — «убеждение»; 勧め; τοῦ καλοῦντος ὑμᾶς — 召された方."
  9: "μικρὰ ζύμη… ζυμοῖ — поговорка; パン種, 生地. Пояснений нет, как в греческом."
  10: "πέποιθα εἰς ὑμᾶς ἐν κυρίῳ — 主にあって…確信している; βαστάσει τὸ κρίμα — 裁きを負う; ὅστις ἐὰν ᾖ — それがだれであれ."
  11: "σκάνδαλον τοῦ σταυροῦ — 十字架のつまずき; ἄρα κατήργηται — 無効になったはず. Оба вопроса сохранены."
  12: "ὄφελον καὶ ἀποκόψονται — резкая ирония: «пусть бы они оскопились»; 去勢. Не сглажено (ср. Синодальный «удалены были»)."
  13: "ἐπ' ἐλευθερίᾳ — «к свободе»; ἀφορμή — 口実; δουλεύετε ἀλλήλοις — 仕え合いなさい; ἀλλά — かえって."
  14: "Лев 19:18, 「…」. ἐν ἑνὶ λόγῳ πεπλήρωται — 一つの言葉において満たされている."
  15: "δάκνετε καὶ κατεσθίετε — 噛み合い、食い合う; ἀναλωθῆτε — 食い尽くされる; βλέπετε μή — 気をつけなさい."
  16: "πνεύματι περιπατεῖτε — 霊によって歩む; οὐ μὴ τελέσητε — усиленное отрицание, 決して…ない."
  17: "ἐπιθυμεῖ κατὰ τοῦ πνεύματος — 霊に逆らって欲する; ἀντίκειται — 敵対する; ἵνα μὴ… ποιῆτε — 行えない."
  18: "ἄγεσθε — 導かれている; οὐκ ἐστὲ ὑπὸ νόμον — 律法の下にはない."
  19: "В базе только πορνεία; церковный текст (слав. «прелюбодеяние, блуд», jp-joc「姦淫、邪淫」) читает μοιχεία — 〔姦淫〕. Проверено: μοιχεία в стихе — 0. πορνεία — 淫行, ἀκαθαρσία — 不潔, ἀσέλγεια — 好色 (ср. Рим 13:13)."
  20: "φαρμακεία — 魔術; ἐριθεῖαι — 党派心; διχοστασίαι — 分裂; αἱρέσεις — 異端. Слав. добавляет «соблазны», jp-joc его не читает — не переводим."
  21: "В базе φθόνοι, μέθαι, κῶμοι; церковный текст (слав. «зависти, убийства», jp-joc「怨恨、兇殺」) читает φόνοι — 〔殺人〕. Проверено: φόνος в стихе — 0. κῶμοι — 酒宴, μέθαι — 泥酔 (ср. Рим 13:13)."
  22: "καρπὸς τοῦ πνεύματος — 霊の実; в тексте нет ἅγιον, поэтому 霊, как в Рим 8 (не 聖霊). Список не сокращён: 愛, 喜び, 平和, 寛容, 親切, 善良, 信仰."
  23: "πραΰτης — 柔和 (ср. 2 Кор 10:1); ἐγκράτεια — 自制; κατὰ τῶν τοιούτων οὐκ ἔστιν νόμος — このようなものに反する律法はない."
  24: "В базе [Ἰησοῦ] в квадратных скобках; слав. и jp-joc читают только Χριστοῦ — キリストに属する者. ἐσταύρωσαν — 十字架につけた; παθήματα — 情念, ἐπιθυμίαι — 欲."
  25: "στοιχῶμεν — «будем держаться того же строя»; 歩もうではないか; εἰ ζῶμεν — 生きているなら."
  26: "κενόδοξοι — 虚栄を求める者; προκαλούμενοι — 挑み合う; φθονοῦντες — 妬み合う. Три запрета сохранены."
