# jp-box, 1-е Послание к Солунянам, глава 1. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 1: надписание и приветствие (1), благодарение и память (2–5),
# фессалоникийцы стали образцом для Македонии и Ахаии (6–8),
# их обращение от идолов и ожидание Сына с небес (9–10).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет, <j>/<mo> не ставятся.
# 〔…〕 в главе нет: [τοῦ] (1:4), [ἐν] (1:5), [τῶν] (1:10) стоят в базе в квадратных скобках,
# слова в базе есть, поэтому не оборачиваются (проверено запросом к gr-lxx-byz).
# Сносок ⟨…⟩ в главе нет: 福音, 患難, 偶像 уже встречались в корпусе. jp-ni не использовался.

tr_code: jp-box
book: 1sol
chapter: 1
draft: true

verses:
  1: "パウロ、シルワノ、テモテから、父[ちち]である神[かみ]と主[しゅ]イエス・キリストのうちにあるテサロニケの教会[きょうかい]へ。恵[めぐ]みと平和[へいわ]が、あなたがたにありますように。"
  2: "わたしたちは、あなたがたすべてのために、いつも神[かみ]に感謝[かんしゃ]している。わたしたちの祈[いの]りのうちに、あなたがたを思[おも]いつつ、"
  3: "あなたがたの信仰[しんこう]の働[はたら]き、愛[あい]の労苦[ろうく]、わたしたちの主[しゅ]イエス・キリストに対[たい]する希望[きぼう]の忍耐[にんたい]を、わたしたちの神[かみ]と父[ちち]の御前[みまえ]で、絶[た]えず覚[おぼ]えているのである。"
  4: "神[かみ]に愛[あい]された兄弟[きょうだい]たちよ。わたしたちは、あなたがたが選[えら]ばれた者[もの]であることを知[し]っているからである。"
  5: "というのは、わたしたちの福音[ふくいん]があなたがたのところで言葉[ことば]だけにとどまらず、力[ちから]と{聖霊[せいれい]|聖神[せいしん]}と大[おお]きな確信[かくしん]をもって伝[つた]えられたからである。あなたがたも、わたしたちがあなたがたの間[あいだ]で、あなたがたのためにどんな者[もの]であったかを知[し]っているとおりである。"
  6: "そして、あなたがたは、多[おお]くの患難[かんなん]のうちで、{聖霊[せいれい]|聖神[せいしん]}の喜[よろこ]びをもって御言葉[みことば]を受[う]け入[い]れ、わたしたちに倣[なら]い、また主[しゅ]にも倣[なら]う者[もの]となった。"
  7: "そのため、あなたがたは、マケドニアとアカイアで信[しん]じているすべての人[ひと]々[びと]の模範[もはん]となった。"
  8: "というのは、主[しゅ]の御言葉[みことば]があなたがたから響[ひび]き渡[わた]ったのは、マケドニアとアカイアにおいてだけではなく、神[かみ]に対[たい]するあなたがたの信仰[しんこう]がいたるところへ伝[つた]わったからである。そのため、わたしたちは何[なに]も言[い]う必要[ひつよう]がないほどである。"
  9: "なぜなら、彼[かれ]ら自身[じしん]が、わたしたちがあなたがたのところでどんな入[はい]り方[かた]をしたか、また、あなたがたが偶像[ぐうぞう]から神[かみ]へと向[む]きを変[か]えて、生[い]けるまことの神[かみ]に仕[つか]えるようになったかを、告[つ]げ知[し]らせているからである。"
  10: "すなわち、天[てん]から来[こ]られる御子[みこ]、神[かみ]が死者[ししゃ]の中[なか]から復活[ふっかつ]させたイエスを待[ま]ち望[のぞ]むようになったことである。この方[かた]は、来[きた]るべき怒[いか]りからわたしたちを救[すく]い出[だ]してくださる。"

notes:
  1: "Παῦλος καὶ Σιλουανὸς καὶ Τιμόθεος — パウロ、シルワノ、テモテ (Σιλουανός — シルワノ, как в Деян 15:22, а не シルアン у jp-joc). τῇ ἐκκλησίᾳ Θεσσαλονικέων — テサロニケの教会. ἐν θεῷ πατρὶ καὶ κυρίῳ Ἰησοῦ Χριστῷ — 父である神と主イエス・キリストのうちにある. χάρις ὑμῖν καὶ εἰρήνη — 恵みと平和; в базе формула без «от Бога», не добавлено."
  2: "εὐχαριστοῦμεν τῷ θεῷ πάντοτε — いつも神に感謝している. μνείαν ποιούμενοι ἐπὶ τῶν προσευχῶν ἡμῶν — 祈りのうちに…思い起こし. ἀδιαλείπτως стоит в базе в конце 2-го стиха, но по смыслу относится к μνημονεύοντες (ст. 3): поэтому 絶えず перенесено в ст. 3."
  3: "μνημονεύοντες — 覚えている. τὸ ἔργον τῆς πίστεως — 信仰の働き; ὁ κόπος τῆς ἀγάπης — 愛の労苦; ἡ ὑπομονὴ τῆς ἐλπίδος — 希望の忍耐 (род. источник/предмет). ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν — わたしたちの神と父の御前で."
  4: "εἰδότες — деепричастие, продолжает ст. 3. ἠγαπημένοι ὑπὸ [τοῦ] θεοῦ — 神に愛された; [τοῦ] в базе есть, 〔…〕 не ставятся. ἐκλογή — 選び; 選ばれたこと."
  5: "τὸ εὐαγγέλιον ἡμῶν — わたしたちの福音. οὐκ ἐν λόγῳ μόνον — 言葉だけにとどまらず. ἐν δυνάμει καὶ ἐν πνεύματι ἁγίῳ καὶ [ἐν] πληροφορίᾳ πολλῇ — 力と聖霊と大きな確信; [ἐν] в базе есть. οἷοι ἐγενήθημεν — どんな者であったか."
  6: "μιμηταὶ ἡμῶν…καὶ τοῦ κυρίου — わたしたちに倣い、また主にも倣う. δεξάμενοι τὸν λόγον ἐν θλίψει πολλῇ — 多くの患難のうちで御言葉を受け入れ. μετὰ χαρᾶς πνεύματος ἁγίου — 聖霊の喜びをもって."
  7: "τύπος — 模範; πᾶσιν τοῖς πιστεύουσιν — 信じているすべての人々. Μακεδονία, Ἀχαΐα — マケドニア、アカイア."
  8: "ἐξήχηται — perfect, 響き渡った. ὁ λόγος τοῦ κυρίου — 主の御言葉. ἡ πίστις ὑμῶν ἡ πρὸς τὸν θεόν — 神に対する信仰. ὥστε μὴ χρείαν ἔχειν ἡμᾶς λαλεῖν τι — 何も言う必要がないほど."
  9: "ἀπαγγέλλουσιν — 告げ知らせている. ὁποίαν εἴσοδον ἔσχομεν — どんな入り方をしたか. ἐπεστρέψατε πρὸς τὸν θεὸν ἀπὸ τῶν εἰδώλων — 偶像から神へと向きを変えて. δουλεύειν θεῷ ζῶντι καὶ ἀληθινῷ — 生けるまことの神に仕える."
  10: "ἀναμένειν τὸν υἱὸν αὐτοῦ ἐκ τῶν οὐρανῶν — 天から来られる御子を待ち望む. ὃν ἤγειρεν ἐκ [τῶν] νεκρῶν — 神が死者の中から復活させた; [τῶν] в базе есть. ῥυόμενον — 救い出す; τῆς ὀργῆς τῆς ἐρχομένης — 来るべき怒り, не смягчено."
