verses:
  1: "サウルは自分[じぶん]の息子[むすこ]ヨナタンと、自分[じぶん]の家来[けらい]すべてに、ダビデを殺[ころ]すよう語[かた]った。しかし、サウルの息子[むすこ]ヨナタンはダビデをひどく愛[あい]していた。"
  2: "ヨナタンはダビデに告[つ]げて言[い]った。「父[ちち]サウルはあなたを殺[ころ]そうとしている。だから、明日[あす]の朝[あさ]は気[き]をつけ、身[み]を隠[かく]して、隠[かく]れ場[ば]にとどまっていなさい。"
  3: "わたしは出[で]て、あなたがそこにいる畑[はたけ]で父[ちち]のそばに立[た]ち、あなたのことを父[ちち]に語[かた]ろう。そして、何[なに]があるかを見[み]て、あなたに告[つ]げる。」"
  4: "ヨナタンはダビデについて良[よ]いことを父[ちち]サウルに語[かた]り、彼[かれ]に言[い]った。「王[おう]はしもべダビデに対[たい]して罪[つみ]を犯[おか]してはならない。彼[かれ]はあなたに対[たい]して罪[つみ]を犯[おか]しておらず、そのわざはひどく良[よ]いからである。"
  5: "彼[かれ]は自分[じぶん]の魂[たましい]を自分[じぶん]の手[て]に置[お]いて、そのペリシテ人[じん]を打[う]ち、主[しゅ]は大[おお]きな救[すく]いを成[な]し遂[と]げられた。イスラエルはみなそれを見[み]て喜[よろこ]んだ。なぜ、無実[むじつ]の血[ち]に対[たい]して罪[つみ]を犯[おか]し、いたずらにダビデを殺[ころ]そうとするのか。」"
  6: "サウルはヨナタンの声[こえ]を聞[き]き入[い]れ、誓[ちか]って言[い]った。「主[しゅ]は生[い]きておられる。彼[かれ]は死[し]ぬことはない。」"
  7: "ヨナタンはダビデを呼[よ]び、これらの言葉[ことば]をすべて彼[かれ]に告[つ]げた。そしてヨナタンはダビデをサウルのところへ連[つ]れて行[い]き、彼[かれ]は以前[いぜん]と同[おな]じようにサウルの前[まえ]にいた。"
  8: "ふたたび戦[いくさ]が起[お]こった。ダビデは力[ちから]を強[つよ]め、ペリシテ人[じん]と戦[たたか]って、彼[かれ]らにひどく大[おお]きな打撃[だげき]を与[あた]えた。彼[かれ]らはダビデの前[まえ]から逃[に]げた。"
  9: "神[かみ]からの悪[わる]い霊[れい]がサウルに臨[のぞ]んだ。彼[かれ]は家[いえ]の中[なか]で寝[ね]ており、その手[て]には槍[やり]があった。ダビデは手[て]で竪琴[たてごと]を奏[かな]でていた。"
  10: "サウルは槍[やり]でダビデを突[つ]こうとした。ダビデはサウルの前[まえ]から身[み]をかわし、槍[やり]は壁[かべ]に突[つ]き刺[さ]さった。ダビデは退[しりぞ]いて逃[に]げ延[の]びた。"
  11: "その夜[よる]、サウルは使者[ししゃ]たちをダビデの家[いえ]へ遣[つか]わし、朝[あさ]に彼[かれ]を殺[ころ]すために見張[みは]らせた。ダビデの妻[つま]ミカルは彼[かれ]に告[つ]げて言[い]った。「今夜[こんや]、あなたが自分[じぶん]の魂[たましい]を救[すく]わなければ、明日[あす]あなたは殺[ころ]される。」"
  12: "ミカルはダビデを窓[まど]から下[お]ろし、彼[かれ]は去[さ]って逃[に]げ、救[すく]われた。"
  13: "ミカルは家[いえ]の神[がみ]々[がみ]を取[と]って寝床[ねどこ]の上[うえ]に置[お]き、山羊[やぎ]の肝[きも]をその枕[まくら]もとに置[お]いて、上[うえ]を衣[ころも]で覆[おお]った。"
  14: "サウルはダビデを捕[つか]まえに使者[ししゃ]たちを遣[つか]わした。すると彼[かれ]らは、彼[かれ]が病[やまい]にかかっていると言[い]った。"
  15: "サウルはまたダビデのもとへ遣[つか]わして言[い]った。「彼[かれ]を寝床[ねどこ]ごとわたしのところへ運[はこ]んで来[こ]い。殺[ころ]すためである。」"
  16: "使者[ししゃ]たちが来[き]て見[み]ると、寝床[ねどこ]の上[うえ]には家[いえ]の神[がみ]々[がみ]があり、その枕[まくら]もとに山羊[やぎ]の肝[きも]があった。"
  17: "サウルはミカルに言[い]った。「なぜおまえはこうもわたしを欺[あざむ]き、わたしの敵[てき]を逃[に]がして救[すく]わせたのか。」ミカルはサウルに言[い]った。「彼[かれ]がわたしに『わたしを逃[に]がせ。さもなければ、おまえを殺[ころ]す』と言[い]ったのである。」"
  18: "ダビデは逃[に]げて救[すく]われ、サムエルのところ、アルマタイムへ行[い]った。そして、サウルが自分[じぶん]にしたすべてのことを彼[かれ]に告[つ]げた。ダビデとサムエルは行[い]って、ラマのナヨトに住[す]んだ。"
  19: "サウルに告[つ]げる者[もの]があって言[い]った。「見[み]よ、ダビデはラマのナヨトにいる。」"
  20: "サウルはダビデを捕[つか]まえに使者[ししゃ]たちを遣[つか]わした。彼[かれ]らは預言者[よげんしゃ]たちの集[つど]いを見[み]た。サムエルはその上[うえ]に立[た]って彼[かれ]らを率[ひき]いていた。すると、神[かみ]の霊[れい]がサウルの使者[ししゃ]たちに臨[のぞ]み、彼[かれ]らも預言[よげん]した。"
  21: "それがサウルに告[つ]げられると、彼[かれ]はほかの使者[ししゃ]たちを遣[つか]わした。しかし彼[かれ]らも預言[よげん]した。サウルはさらに三度目[さんどめ]の使者[ししゃ]たちを遣[つか]わしたが、彼[かれ]らも預言[よげん]した。"
  22: "サウルは激[はげ]しく怒[いか]って、自分[じぶん]もアルマタイムへ行[い]った。そして、セフィにある脱穀場[だっこくじょう]の井戸[いど]まで来[き]て尋[たず]ね、言[い]った。「サムエルとダビデはどこにいるのか。」彼[かれ]らは言[い]った。「見[み]よ、ラマのナヨトにいる。」"
  23: "彼[かれ]はそこからラマのナヨトへ行[い]った。すると、神[かみ]の霊[れい]が彼[かれ]にも臨[のぞ]み、彼[かれ]はラマのナヨトに着[つ]くまで、預言[よげん]しながら歩[ある]いて行[い]った。"
  24: "彼[かれ]も自分[じぶん]の衣[ころも]を脱[ぬ]ぎ、彼[かれ]らの前[まえ]で預言[よげん]した。そして、その日[ひ]一日[いちにち]、また夜[よる]一晩中[ひとばんじゅう]、裸[はだか]のまま倒[たお]れていた。それゆえ、人[ひと]々[びと]は言[い]った。「サウルもまた預言者[よげんしゃ]の中[なか]にいるのか。」"

notes:
  1: "ἐλάλησεν ... τοῦ θανατῶσαι τὸν Δαυιδ — говорил, чтобы умертвить Давида (θανατόω). ᾑρεῖτο τὸν Δαυιδ σφόδρα — сильно любил, избирал Давида (αἱρέομαι; слав. «любяше зело»)."
  2: "ζητεῖ θανατῶσαί σε — ищет умертвить тебя. φύλαξαι οὖν αὔριον πρωί — берегись же завтра утром (φυλάσσω). κρύβηθι καὶ κάθισον κρυβῇ — скройся и сиди в тайне (κρυβῇ — тайно)."
  3: "ἐχόμενος τοῦ πατρός μου — держась подле отца моего. ὄψομαι ὅ τι ἐὰν ᾖ — увижу, что будет. ἀπαγγελῶ σοι — возвещу тебе."
  4: "Μὴ ἁμαρτησάτω ὁ βασιλεύς — да не согрешит царь. οὐχ ἡμάρτηκεν εἰς σέ — не согрешил против тебя. τὰ ποιήματα αὐτοῦ ἀγαθὰ σφόδρα — дела его весьма хороши."
  5: "ἔθετο τὴν ψυχὴν αὐτοῦ ἐν τῇ χειρὶ αὐτοῦ — положил душу свою в руку свою, то есть подверг её опасности. ἐποίησεν κύριος σωτηρίαν μεγάλην — сотворил Господь великое спасение. εἰς αἷμα ἀθῷον — на кровь невинную (ἀθῷος). δωρεάν — напрасно, даром."
  6: "ἤκουσεν τῆς φωνῆς Ιωναθαν — послушал голоса Ионафана. ὤμοσεν λέγων Ζῇ κύριος, εἰ ἀποθανεῖται — поклялся: «жив Господь, он не умрёт» (формула клятвы с εἰ)."
  7: "ἐκάλεσεν ... ἀπήγγειλεν — позвал и пересказал. ἦν ἐνώπιον αὐτοῦ ὡσεὶ ἐχθὲς καὶ τρίτην ἡμέραν — был пред ним, как вчера и третьего дня, то есть как прежде."
  8: "προσέθετο ὁ πόλεμος γενέσθαι πρὸς Σαουλ — война снова возникла «к Саулу», против Саула (выражение тёмное; слав. «на саула», ru просто «опять»). κατίσχυσεν — укрепился, одолел (κατισχύω). πληγὴν μεγάλην σφόδρα — поражение весьма великое."
  9: "ἐγένετο πνεῦμα θεοῦ πονηρόν — нашёл злой дух от Бога. καθεύδων — спящий (слав. «седяше» — сидел, иное чтение). ἔψαλλεν ἐν ταῖς χερσὶν αὐτοῦ — играл руками своими (ψάλλω). δόρυ ἐν τῇ χειρὶ αὐτοῦ — копьё в руке его."
  10: "ἐζήτει ... πατάξαι τὸ δόρυ εἰς Δαυιδ — искал поразить копьём Давида. ἀπέστη — отступил, отскочил (ἀφίστημι). εἰς τὸν τοῖχον — в стену. ἀνεχώρησεν καὶ διεσώθη — удалился и спасся. Слав. добавляет «в нощь ту» (ср. ru «в ту ночь») — в gr нет."
  11: "ἀγγέλους — посланных, слуг (使者). φυλάξαι αὐτὸν τοῦ θανατῶσαι αὐτὸν πρωί — стеречь его, чтобы умертвить утром. Ἐὰν μὴ σὺ σώσῃς τὴν ψυχήν σου — если ты не спасёшь души своей. αὔριον θανατωθήσῃ — завтра будешь умерщвлён."
  12: "κατάγει ... διὰ τῆς θυρίδος — спускает через окно, оконце (θυρίς). ἀπῆλθεν καὶ ἔφυγεν καὶ σῴζεται — ушёл, убежал и спасается (историческое настоящее)."
  13: "κενοτάφια — «кенотафы» (пустые гробницы); так LXX передаёт терафимов (תרפים, ср. Суд 17:5, где в корпусе テラフィム и 家の神々); в тексте 家の神々. ἧπαρ τῶν αἰγῶν — козья печень (ἧπαρ, αἶξ). πρὸς κεφαλῆς αὐτοῦ — в изголовье его. ἐκάλυψεν ... ἱματίῳ — покрыла одеждой."
  14: "ἀπέστειλεν ἀγγέλους λαβεῖν τὸν Δαυιδ — послал слуг взять Давида. λέγουσιν ἐνοχλεῖσθαι αὐτόν — говорят, что он болен, недомогает (ἐνοχλέω)."
  15: "Ἀγάγετε αὐτὸν ἐπὶ τῆς κλίνης πρός με — принесите его на постели ко мне. τοῦ θανατῶσαι αὐτόν — чтобы умертвить его."
  16: "ἰδοὺ τὰ κενοτάφια ἐπὶ τῆς κλίνης — вот кенотафы на постели; в тексте 家の神々 (см. 13). ἧπαρ τῶν αἰγῶν πρὸς κεφαλῆς αὐτοῦ — козья печень в изголовье его."
  17: "παρελογίσω με — обманула меня (παραλογίζομαι). ἐξαπέστειλας τὸν ἐχθρόν μου καὶ διεσώθη — отпустила врага моего, и он спасся. Ἐξαπόστειλόν με· εἰ δὲ μή, θανατώσω σε — отпусти меня, а если нет, убью тебя (вложенная речь 『…』)."
  18: "Αρμαθαιμ — Армафем (アルマタイム, как в 1 Цар 28:3; ru «Рама»). Ναυαθ ἐν Ραμα — Наваф в Раме (ラマのナヨト). ἀπαγγέλλει αὐτῷ πάντα ὅσα ἐποίησεν αὐτῷ Σαουλ — рассказывает всё, что сделал ему Саул."
  19: "ἀπηγγέλη τῷ Σαουλ λέγοντες — донесли Саулу, говоря (безличное, ср. 2 Цар 3:23). Ἰδοὺ Δαυιδ ἐν Ναυαθ ἐν Ραμα — вот Давид в Навафе в Раме."
  20: "ἐκκλησίαν τῶν προφητῶν — собрание пророков (ἐκκλησία, 集い). εἱστήκει καθεστηκὼς ἐπ᾿ αὐτῶν — стоял поставленный над ними (καθίστημι). ἐγενήθη ... πνεῦμα θεοῦ — сошёл Дух Божий. προφητεύουσιν — пророчествуют (историческое настоящее)."
  21: "ἀπέστειλεν ἀγγέλους ἑτέρους — послал других посланных. ἐπροφήτευσαν καὶ αὐτοί — и они пророчествовали. προσέθετο ... ἀποστεῖλαι τρίτους — прибавил послать третьих."
  22: "ἐθυμώθη ὀργῇ — воспылал гневом (θυμόω). φρέατος τοῦ ἅλω τοῦ ἐν τῷ Σεφι — колодец гумна, что в Сефи (ἅλως — гумно, 脱穀場; Σεφι — Сефи). ἠρώτησεν καὶ εἶπεν Ποῦ ...; — спросил и сказал: где...?"
  23: "ἐπορεύθη ἐκεῖθεν εἰς Ναυαθ ἐν Ραμα — пошёл оттуда в Наваф в Раме. ἐγενήθη καὶ ἐπ᾿ αὐτῷ πνεῦμα θεοῦ — и на него сошёл Дух Божий. ἐπορεύετο προφητεύων — шёл, пророчествуя."
  24: "ἐξεδύσατο τὰ ἱμάτια αὐτοῦ — снял одежды свои. ἔπεσεν γυμνὸς ὅλην τὴν ἡμέραν καὶ ὅλην τὴν νύκτα — лежал нагой весь тот день и всю ночь. διὰ τοῦτο ἔλεγον Εἰ καὶ Σαουλ ἐν προφήταις; — поэтому говорили: «неужели и Саул среди пророков?» (ср. 10:11)."
