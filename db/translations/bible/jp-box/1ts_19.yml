# jp-box, 1-я Царств, глава 19. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в 1 Царств нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 19: замысел Саула (1), Ионафан предупреждает Давида (2–3), его речь
# к отцу (4–5), клятва Саула (6–7), новое покушение (8–10), Мелхола спасает
# Давида (11–17), Давид у Самуила в Раме и пророчество Саула (18–24).
# Речь — 「…」: Ионафан (2–3, 4–5), Саул (6, 11, 15, 17), Мелхола (11, 17),
# слуги (14), народ (22, 24). Вложенная речь — 『…』: слова Мелхолы от лица
# Давида (17).
# Красного нет: <j>/<mo> не ставятся.
# Нумерация по gr: 24 стиха, совпадает с csl-ru; у csl только в 19:7 в конце
# стоит знак «—» (деление издания), на текст не влияет. На месте стихов «.» в gr
# нет, весь текст главы в базе есть — 〔…〕 нет.
# Слав. добавления в 19:10 («в нощь ту») в текст не внесены, отмечено в notes.
# Сносок ⟨…⟩ нет: 預言者, 霊媒, 竪琴 уже пояснены в корпусе; 家の神々 понятны
# по контексту (терафимы объяснены в Суд 17:5).
# jp-ni не использовался.

