# jp-box, Песнь Песней, глава 6. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 6: 12 стихов по gr. Вопрос дочерей, куда ушёл возлюбленный (1), ответ женщины
# (2–3), речь возлюбленного о её красоте (4–10), женщина в ореховом саду (11–12).
# Поэзия: параллелизмы и дословные повторы (θάμβος ὡς τεταγμέναι в 4 и 10) не сглажены.
# Голоса: 1 — дочери Иерусалима; 2–3 — женщина; 4–10 — возлюбленный (одна цитата
# на все стихи); 11–12 — женщина. Женщина — без кавычек, прочие — 「…」.
# Нумерация по gr: у csl сдвиг на стих. Наш 6:1 = csl 5:17; наши 6:2–10 = csl 6:1–9;
# наш 6:11 = csl 6:10 и начало csl 6:11; наш 6:12 — вторая половина csl 6:11;
# csl 6:12 («Обратися, обратися, суламитино») — это уже gr 7:1a, глава 7.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz. Сносок ⟨…⟩ нет.
# Имена — транслитерация греческого (LXX).

tr_code: jp-box
book: pp
chapter: 6
draft: true

verses:
  1: "「あなたの愛[あい]する者[もの]はどこへ行[い]ったのか、女[おんな]たちのうちで美[うつく]しい者[もの]よ。あなたの愛する者はどこへ向[む]かったのか。わたしたちもあなたとともに彼を探[さが]そう。」"
  2: "わが愛[あい]する者[もの]は自分[じぶん]の園[その]へ、香料[こうりょう]の鉢[はち]のある所[ところ]へ下[くだ]って行[い]った。いくつもの園[その]で羊[ひつじ]を飼[か]い、ゆりを摘[つ]み集[あつ]めるために。"
  3: "わたしはわが愛[あい]する者[もの]のもの、わが愛する者はわたしのもの。彼はゆりの間[あいだ]で羊を飼[か]っている。"
  4: "「あなたは美[うつく]しい、わが伴[とも]なる者[もの]よ、喜[よろこ]びのように。あなたはエルサレムのように麗[うるわ]しく、整[ととの]えられた軍勢[ぐんぜい]のように恐[おそ]ろしい。"
  5: "わたしからあなたの目[め]をそらせ。あなたの目がわたしを飛[と]び立[た]たせるから。あなたの髪[かみ]はギレアデから上[のぼ]って来[き]た山羊[やぎ]の群[む]れのようだ。"
  6: "あなたの歯[は]は毛[け]を刈[か]られた羊[ひつじ]の群れのようで、洗[あら]い場[ば]から上って来た。そのすべては双[ふたご]を産[う]み、その中に子[こ]のない者[もの]はない。"
  7: "あなたの唇[くちびる]は緋[ひ]の糸[いと]のようで、あなたの話[はな]しぶりは麗[うるわ]しい。あなたの頬[ほお]は、あなたの沈黙[ちんもく]の外[そと]にあるざくろの皮[かわ]のようだ。"
  8: "王妃[おうひ]は六十人[ろくじゅうにん]、側女[そばめ]は八十人[はちじゅうにん]、若[わか]い女[おんな]たちは数[かぞ]えきれない。"
  9: "わが鳩[はと]、わが完全[かんぜん]な者[もの]はただ一人。その母[はは]にとってただ一人、彼女を産[う]んだ者[もの]にとって選[えら]ばれた者[もの]。娘[むすめ]たちは彼女を見[み]て幸[さいわ]いなる者と呼[よ]び、王妃[おうひ]たちと側女[そばめ]たちも彼女を褒[ほ]め称[たた]える。"
  10: "この者[もの]はだれか。暁[あかつき]のように現[あらわ]れ出[で]、月[つき]のように美[うつく]しく、太陽[たいよう]のように選[えら]ばれ、整[ととの]えられた軍勢[ぐんぜい]のように恐[おそ]ろしい。」"
  11: "わたしはくるみの園[その]へ下[くだ]って行[い]った。谷川[たにがわ]の実[みの]りを見[み]るために。ぶどうの木[き]が花[はな]咲[さ]いたか、ざくろが花開[はなひら]いたかを見るために。そこでわたしはあなたにわたしの乳房[ちぶさ]を与[あた]えよう。"
  12: "わたしの魂[たましい]は知[し]らなかった。彼[かれ]はわたしをアミナダブの戦車[せんしゃ]に置[お]いた。"

notes:
  1: "Говорят дочери Иерусалима; вся реплика — 「…」. Нумерация: у csl этот стих стоит как 5:17, у ru — 6:1. ἀπῆλθεν — «ушёл» (ἀπέρχομαι); ἀπέβλεψεν — «обратился, повернул взгляд» (ἀποβλέπω): два разных глагола, различие сохранено (у csl 5:17 «отиде» / «уклонися»). ἡ καλὴ ἐν γυναιξίν — «прекрасная между жёнами», то же обращение, что в 5:9. ζητήσομεν — будущее «поищем»; μετὰ σοῦ — «с тобою»."
  2: "Говорит женщина. κατέβη εἰς κῆπον αὐτοῦ — «сошёл в сад свой» (καταβαίνω). εἰς φιάλας τοῦ ἀρώματος — «в чаши благовония» (слав. «в места аромат»); ποιμαίνειν ἐν κήποις — «пасти в садах» (κήποις — множественное); συλλέγειν κρίνα — «собирать лилии» (συλλέγω). У csl это 6:1."
  3: "Говорит женщина. ἐγὼ τῷ ἀδελφιδῷ μου — эллипсис: «я — возлюбленному моему» (слав. «Аз брату моему»); καὶ ἀδελφιδός μου ἐμοί — «и возлюбленный мой — мне». ὁ ποιμαίνων ἐν τοῖς κρίνοις — «пасущий между лилиями». У csl это 6:2."
  4: "Говорит возлюбленный; его речь продолжается до ст. 10 и составляет одну цитату 「…」. καλὴ εἶ, ἡ πλησίον μου — «прекрасна ты, ближняя моя» (わが伴なる者). ὡς εὐδοκία — «как благоволение»: LXX передаёт евр. имя города Тирца (תִּרְצָה) словом εὐδοκία; слав. «яко благоволение», Синодальный «как Фирца». Оставлено по LXX и слав., без подстановки топонима. ὡραία ὡς Ιερουσαλημ — «прекрасна, как Иерусалим»; θάμβος ὡς τεταγμέναι — «ужас, как [полки] выстроенные» (θάμβος — изумление, страх; τεταγμέναι — причастие перфекта от τάσσω; слав. «ужас яко вчиненны»). У csl это 6:3."
  5: "Говорит возлюбленный. ἀπόστρεψον ὀφθαλμούς σου ἀπεναντίον μου — «отврати глаза твои от меня» (ἀποστρέφω; ἀπεναντίον — напротив, против). ἀνεπτέρωσάν με — «они дали мне крылья, восхитили меня» (ἀναπτερόω; слав. «воскрилиша мя»). τρίχωμα — «волосы» (собирательное). ὡς ἀγέλαι τῶν αἰγῶν — «как стада коз»; αἳ ἀνεφάνησαν ἀπὸ τοῦ Γαλααδ — «которые показались от Галаада» (ἀναφαίνω). У csl это 6:4."
  6: "Говорит возлюбленный. ὀδόντες σου ὡς ἀγέλαι τῶν κεκαρμένων — «зубы твои, как стада остриженных [овец]» (κείρω — стричь). αἳ ἀνέβησαν ἀπὸ τοῦ λουτροῦ — «которые поднялись от купальни» (λουτρόν — купальня, водоём для омовения). αἱ πᾶσαι διδυμεύουσαι — «все рождающие двойни» (διδυμεύω); ἀτεκνοῦσα οὐκ ἔστιν ἐν αὐταῖς — «бесплодной нет между ними» (ἀτεκνόω). У csl это 6:5."
  7: "Говорит возлюбленный. ὡς σπαρτίον τὸ κόκκινον — «как шнур алый» (σπαρτίον — верёвочка; слав. «вервь червлена»). ἡ λαλιά σου ὡραία — «речь твоя прекрасна» (λαλιά — речь, говор). ὡς λέπυρον τῆς ῥόας — «как кожица граната» (λέπυρον — скорлупа, кожура); μῆλόν σου — буквально «яблоко твоё», т. е. ланита, щека (слав. «ланиты твоя»): метонимия отмечена здесь, в тексте 頬. ἐκτὸς τῆς σιωπήσεώς σου — «вне молчания твоего» (σιώπησις): тёмное место, слав. «кроме замолчания твоего», оставлено буквально. У csl это 6:6."
  8: "Говорит возлюбленный. ἑξήκοντα… ὀγδοήκοντα — числа переданы кандзи. βασίλισσαι — 王妃; παλλακαί — 側女 (слав. «наложницы»); νεάνιδες — 若い女たち (слав. «юноты»); ὧν οὐκ ἔστιν ἀριθμός — «которым нет числа». У csl это 6:7."
  9: "Говорит возлюбленный. μία ἐστὶν περιστερά μου, τελεία μου — «одна есть голубица моя, совершенная моя»: μία подчёркнуто (ただ一人). μία ἐστὶν τῇ μητρὶ αὐτῆς — «одна у матери своей» (датив отношения); ἐκλεκτή ἐστιν τῇ τεκούσῃ αὐτῆς — «избранная у родившей её». εἴδοσαν… καὶ μακαριοῦσιν — аорист и будущее рядом (семитский оборот); будущее сохранено в 呼び…褒め称える. У csl это 6:8."
  10: "Говорит возлюбленный; это конец его речи — закрывающая кавычка. ἐκκύπτουσα — «выглядывающая, показывающаяся» (ἐκκύπτω; слав. «проницающая»); ὡσεὶ ὄρθρος — «как заря, рассвет» (ὄρθρος). καλὴ ὡς σελήνη — «прекрасна, как луна»; ἐκλεκτὴ ὡς ὁ ἥλιος — «избранна, как солнце»; θάμβος ὡς τεταγμέναι — тот же оборот, что в 6:4, повторён дословно. У csl это 6:9; csl 6:12 («Обратися, обратися, суламитино») относится уже к gr 7:1a."
  11: "Говорит женщина. εἰς κῆπον καρύας — «в сад ореховый» (κάρυον — орех; слав. «вертоград орехов»). χείμαρρος — «поток, долина потока»; ἐν γενήμασιν τοῦ χειμάρρου — «среди произрастаний потока». ἰδεῖν εἰ ἤνθησεν ἡ ἄμπελος — «посмотреть, расцвела ли лоза» (ἀνθέω); ἐξήνθησαν αἱ ῥόαι — «расцвели гранаты»: после εἰ-оборота греческий переходит в изъявительное наклонение (анаколуф), сохранён. Слав. читает здесь «возрастоша шипки» (розы, шиповник) — расходится и с LXX, и с контекстом (гранаты в 4:13; 6:7; 8:2), поэтому оставлено по LXX; слав. чтение отмечено здесь. ἐκεῖ δώσω τοὺς μαστούς μου σοί — «там дам груди мои тебе» (μαστός — грудь): образ передан буквально. У csl первая половина стиха — 6:10 («В вертоград орехов…»), а слова «Тамо дам сосца моя тебе» открывают csl 6:11."
  12: "Говорит женщина. οὐκ ἔγνω ἡ ψυχή μου — «не знала душа моя»: тёмное место (слав. «не разуме душа моя»), оставлено без сглаживания. ἔθετό με ἅρματα Αμιναδαβ — «поставил меня [в] колесницы Аминадава»: ἅρματα — множественное число, при τίθημι без предлога; слав. «положи мя на колеснице аминадавли», Синодальный передаёт иначе, с масоретского («к колесницам знатных народа моего»). Подлежащее — возлюбленный или Бог — в греческом не названо; в тексте 彼, вариант отмечен. У csl эти слова — вторая половина 6:11; csl 6:12 («Обратися, обратися, суламитино») — уже gr 7:1a."
