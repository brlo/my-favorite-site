verses:
  1: "王[おう]の心[こころ]は、神[かみ]の手[て]のうちにある水[みず]の流[なが]れのようなものである。神[かみ]が望[のぞ]むところへ、神[かみ]はそれを向[む]けられる。"
  2: "人[ひと]はだれでも、自分[じぶん]には正[ただ]しく見[み]える。しかし、心[こころ]を導[みちび]かれるのは主[しゅ]である。"
  3: "正[ただ]しいことを行[おこな]い、真理[しんり]を行[おこな]うことは、いけにえの血[ち]よりも、神[かみ]に喜[よろこ]ばれる。"
  4: "傲慢[ごうまん]のうちに高[たか]ぶる者[もの]は心[こころ]が大胆[だいたん]であり、不敬[ふけい]な者[もの]の灯[ともしび]は罪[つみ]である。"
  5: "勤[つと]め励[はげ]む者[もの]の考[かんが]えは豊[ゆた]かさに至[いた]り、怠[おこた]る者[もの]はすべて乏[とぼ]しさに陥[おちい]る。"
  6: "偽[いつわ]りの舌[した]で財宝[ざいほう]を築[きず]く者[もの]は、空[むな]しいものを追[お]い求[もと]めて、死[し]の罠[わな]に陥[おちい]る。"
  7: "不敬[ふけい]な者[もの]には滅[ほろ]びが宿[やど]る。彼[かれ]らは正[ただ]しいことを行[おこな]おうとしないからである。"
  8: "曲[ま]がった者[もの]には、神[かみ]は曲[ま]がった道[みち]を送[おく]られる。神[かみ]のわざは清[きよ]く、まっすぐであるからである。"
  9: "屋根[やね]のない隅[すみ]に住[す]むほうが、不正[ふせい]とともに白[しろ]く塗[ぬ]った家[いえ]に、また共同[きょうどう]の家[いえ]に住[す]むよりよい。"
  10: "不敬[ふけい]な者[もの]の魂[たましい]は、人[ひと]のうちのだれからもあわれみを受[う]けない。"
  11: "放縦[ほうじゅう]な者[もの]が罰[ばつ]を受[う]けると、傷[きず]のない者[もの]はますます賢[かしこ]くなる。しかし、知恵[ちえ]ある者[もの]が悟[さと]るとき、知識[ちしき]を受[う]け入[い]れる。"
  12: "正[ただ]しい者[もの]は不敬[ふけい]な者[もの]の心[こころ]を見抜[みぬ]き、不敬[ふけい]な者[もの]を悪[あく]のうちに蔑[さげす]む。"
  13: "弱[よわ]い者[もの]の声[こえ]を聞[き]かないように耳[みみ]をふさぐ者[もの]は、自分[じぶん]も呼[よ]び求[もと]めるが、答[こた]える者[もの]はない。"
  14: "隠[かく]して与[あた]える贈[おく]り物[もの]は怒[いか]りをくつがえし、贈[おく]り物[もの]を惜[お]しむ者[もの]は強[つよ]い憤[いきどお]りを起[おこ]こす。"
  15: "正[ただ]しい者[もの]の喜[よろこ]びは裁[さば]きを行[おこな]うことである。しかし、敬虔[けいけん]な者[もの]は悪[あく]をなす者[もの]たちのもとでは汚[けが]れた者[もの]である。"
  16: "正[ただ]しさの道[みち]から迷[まよ]い出[で]る者[もの]は、巨人[きょじん]たちの集[あつ]まりで憩[いこ]うことになる。"
  17: "乏[とぼ]しい者[もの]は喜[よろこ]びを愛[あい]する。ぶどう酒[しゅ]と油[あぶら]を愛[あい]する者[もの]は、富[とみ]に至[いた]らない。"
  18: "しかし、不[ふ]法[ほう]な者[もの]は正[ただ]しい者[もの]のための身代[みがわ]りとなる。"
  19: "荒[あ]れた地[ち]に住[す]むほうが、争[あらそ]い好[ず]きで口[くち]やかましく、怒[いか]りっぽい女[おんな]と住[す]むよりよい。"
  20: "思慮[しりょ]ある者[もの]の口[くち]には、望[のぞ]ましい宝[たから]が憩[いこ]う。しかし、愚[おろ]かな者[もの]たちはそれを飲[の]み込[こ]んでしまう。"
  21: "正[ただ]しさとあわれみの道[みち]は、命[いのち]と栄光[えいこう]を見[み]いだす。"
  22: "知恵[ちえ]ある者[もの]は堅[かた]い都[みやこ]に上[のぼ]り、不敬[ふけい]な者[もの]が頼[たよ]りとしていた砦[とりで]を打[う]ち壊[こわ]す。"
  23: "自分[じぶん]の口[くち]と舌[した]を守[まも]る者[もの]は、苦[くる]しみから自分[じぶん]の魂[たましい]を守[まも]る。"
  24: "大胆[だいたん]で、自分勝手[じぶんかって]で、高[たか]ぶる者[もの]は、人[ひと]を滅[ほろ]ぼす者[もの]と呼[よ]ばれる。そして、恨[うら]みを抱[いだ]く者[もの]は不[ふ]法[ほう]な者[もの]である。"
  25: "怠[なま]ける者[もの]は自分[じぶん]の欲[よく]によって殺[ころ]される。彼[かれ]の手[て]は何[なに]かをしようとしないからである。"
  26: "不敬[ふけい]な者[もの]は日[ひ]の全[すべ]てにわたって悪[わる]い欲[よく]を望[のぞ]む。しかし、正[ただ]しい者[もの]は惜[お]しみなくあわれみ、恵[めぐ]みを与[あた]える。"
  27: "不敬[ふけい]な者[もの]のいけにえは主[しゅ]に忌[い]むべきもの。彼[かれ]らは不[ふ]法[ほう]にそれをささげるからである。"
  28: "偽[いつわ]りの証人[しょうにん]は滅[ほろ]びる。しかし、聞[き]き従[したが]う人[ひと]は、守[まも]られて語[かた]る。"
  29: "不敬[ふけい]な者[もの]は恥[はじ]しらずに顔[かお]を向[む]けて立[た]つ。しかし、まっすぐな者[もの]は自分[じぶん]で自分[じぶん]の道[みち]をわきまえる。"
  30: "不敬[ふけい]な者[もの]に立[た]ち向[む]かう知恵[ちえ]も、勇気[ゆうき]も、計画[けいかく]もない。"
  31: "馬[うま]は戦[いくさ]の日[ひ]のために備[そな]えられる。しかし、助[たす]けは主[しゅ]から来[く]る。"

notes:
  1: "ὥσπερ ὁρμὴ ὕδατος — «как стремление воды» (ὁρμή — «порыв, течение»); слав. «устремление воды». οὗ ἐὰν θέλων νεύσῃ, ἐκεῖ ἔκλινεν αὐτήν — «куда бы Он, желая, ни склонил, туда Он склонил её» (νεύω — «кивать, склонять»; κλίνω — «наклонять»); подлежащее — Бог, поэтому 神はそれを向けられる."
  2: "πᾶς ἀνὴρ φαίνεται ἑαυτῷ δίκαιος — «всякий человек кажется себе праведным» (φαίνομαι — «казаться»). κατευθύνει δὲ καρδίας κύριος — «но Господь направляет сердца» (κατευθύνω — «выпрямлять»); слав. «управляет же сердца Господь». Синодальный (МТ): «Господь взвешивает сердца» — иное чтение, не внесено."
  3: "ποιεῖν δίκαια καὶ ἀληθεύειν — «творить правду и истинствовать» (ἀληθεύω — «говорить и делать истину»). ἀρεστὰ παρὰ θεῷ μᾶλλον ἢ θυσιῶν αἷμα — «угодное у Бога более, чем кровь жертв»; слав. «паче, нежели жертв кровь»."
  4: "μεγαλόφρων ἐφ᾽ ὕβρει θρασυκάρδιος — «великодушный в надменности дерзосердый»: три черты гордого (μεγαλόφρων — «высокомерный»; ὕβρις — «надменность»; θρασυκάρδιος — «дерзкий сердцем»). λαμπτὴρ δὲ ἀσεβῶν ἁμαρτία — «светильник же нечестивых — грех»; слав. «светило нечестивых греси». Синодальный (МТ) объединяет иначе; передано по гр."
  5: "В gr-lxx-byz на месте стиха «.» — дефект модуля; переведено по csl-ru: «Помышления тщаливаго во изобилии, и всяк нерадивый в лишении». тщаливый — «прилежный, старательный»; нерадивый — «беспечный». jp-joc подтверждает церковное чтение (勤労する者の図る所は豊盛なるを致し…); Синодальный (МТ) говорит о «торопливом» — иное чтение, не внесено. 〔…〕 не ставятся: это пробел модуля."
  6: "ὁ ἐνεργῶν θησαυρίσματα γλώσσῃ ψευδεῖ — «делающий сокровища языком лживым» (θησαύρισμα — «сокровище, накопление»; γλῶσσα ψευδής — «язык лживый»). μάταια διώκει ἐπὶ παγίδας θανάτου — «суетное гонит к сетям смерти»; слав. «суетная гонит в сети смертныя»."
  7: "ὄλεθρος ἀσεβέσιν ἐπιξενωθήσεται — «погибель нечестивым приселится» (ἐπιξενόομαι — «приходить гостем, поселяться»). οὐ γὰρ βούλονται πράσσειν τὰ δίκαια — «ибо не хотят делать правды»."
  8: "πρὸς τοὺς σκολιοὺς σκολιὰς ὁδοὺς ἀποστέλλει ὁ θεός — «к строптивым кривые пути посылает Бог» (σκολιός — «кривой, лукавый»). ἁγνὰ γὰρ καὶ ὀρθὰ τὰ ἔργα αὐτοῦ — «чисты и прямы дела Его»; слав. «чиста бо и права дела его»."
  9: "κρεῖσσον οἰκεῖν ἐπὶ γωνίας ὑπαίθρου — «лучше жить в углу под открытым небом» (γωνία — «угол»; ὕπαιθρος — «под открытым небом»). ἢ ἐν κεκονιαμένοις μετὰ ἀδικίας καὶ ἐν οἴκῳ κοινῷ — «чем в выбеленных покоях с неправдой и в доме общем» (κονιάω — «белить»; οἶκος κοινός — «общий дом»). Синодальный (МТ) говорит о сварливой жене в пространном доме — иное чтение, не внесено."
  10: "ψυχὴ ἀσεβοῦς οὐκ ἐλεηθήσεται ὑπ᾽ οὐδενὸς τῶν ἀνθρώπων — «душа нечестивого не будет помилована никем из людей»; слав. «не помилуется ни от единаго от человеков». Синодальный (МТ) иначе: «душа нечестивого желает зла»."
  11: "ζημιουμένου ἀκολάστου πανουργότερος γίνεται ὁ ἄκακος — «когда наказывается распутный, незлобивый делается смышлёнее» (ζημιόω — «наказывать, наносить ущерб»; ἀκόλαστος — «распутный»; πανουργότερος — сравн. от πανοῦργος, «хитрый, смышлёный»; ἄκακος — «незлобивый»). συνίων δὲ σοφὸς δέξεται γνῶσιν — «разумеющий же мудрый примет знание»."
  12: "συνίει δίκαιος καρδίας ἀσεβῶν — «разумеет праведный сердца нечестивых» (συνίημι — «понимать, вникать»). καὶ φαυλίζει ἀσεβεῖς ἐν κακοῖς — «и уничижает нечестивых во зле» (φαυλίζω — «считать ничтожным»; слав. «уничтожает»)."
  13: "ὃς φράσσει τὰ ὦτα τοῦ μὴ ἐπακοῦσαι ἀσθενοῦς — «кто затыкает уши, чтобы не слушать немощного» (φράσσω — «запирать, затыкать»; ἐπακούω — «слушать»). καὶ αὐτὸς ἐπικαλέσεται, καὶ οὐκ ἔσται ὁ εἰσακούων — «и сам воззовёт, и не будет слушающего»."
  14: "δόσις λάθριος ἀνατρέπει ὀργάς — «дар тайный ниспровергает гнев» (λάθριος — «тайный»; ἀνατρέπω — «опрокидывать»). δώρων δὲ ὁ φειδόμενος θυμὸν ἐγείρει ἰσχυρόν — «а щадящий дары возбуждает ярость сильную» (φείδομαι — «щадить, жалеть»; θυμός — «ярость»)."
  15: "εὐφροσύνη δικαίων ποιεῖν κρίμα — «веселие праведных — творить суд» (κρίμα — «суд, приговор»); слав. «Веселие праведных творити суд». ὅσιος δὲ ἀκάθαρτος παρὰ κακούργοις — «а преподобный нечист у злодеев» (ὅσιος — «святой, благочестивый»; ἀκάθαρτος — «нечистый»): вторая половина тёмная, передана буквально. Синодальный (МТ): «страх для делающих зло»."
  16: "ἀνὴρ πλανώμενος ἐξ ὁδοῦ δικαιοσύνης — «человек, блуждающий с пути правды» (πλανάω — «блуждать, заблуждаться»). ἐν συναγωγῇ γιγάντων ἀναπαύσεται — «в собрании исполинов почиет» (συναγωγή — «собрание»; γίγας — «исполин»); 巨人 — буквально."
  17: "ἀνὴρ ἐνδεὴς ἀγαπᾷ εὐφροσύνην — «муж нуждающийся любит веселие» (ἐνδεής — «лишённый, бедный»); слав. «Муж скуден любит веселие». φιλῶν οἶνον καὶ ἔλαιον εἰς πλοῦτον — «любящий вино и елей — не к богатству»; слав. «не обогатится» — отрицание взято из смысла оборота εἰς πλοῦτον."
  18: "περικάθαρμα δὲ δικαίου ἄνομος — «отребие же праведнику — беззаконник» (περικάθαρμα — «отбросы, выкуп за очищение»; слав. «отребие»; ἄνομος — «беззаконник»). Синодальный: «выкупом будет за праведного нечестивый»."
  19: "κρεῖσσον οἰκεῖν ἐν γῇ ἐρήμῳ — «лучше жить в земле пустынной» (ἔρημος — «пустынный»). ἢ μετὰ γυναικὸς μαχίμου καὶ γλωσσώδους καὶ ὀργίλου — «чем с женой сварливой, языкастой и гневливой» (μάχιμος — «воинственный, сварливый»; γλωσσώδης — «болтливый, языкастый»; ὀργίλος — «гневливый»)."
  20: "θησαυρὸς ἐπιθυμητὸς ἀναπαύσεται ἐπὶ στόματος σοφοῦ — «сокровище вожделенное почиет на устах мудрого» (ἐπιθυμητός — «вожделенный»; στόμα — «уста»). ἄφρονες δὲ ἄνδρες καταπίονται αὐτόν — «безумные же мужи проглатывают его»; слав. «пожирают е»."
  21: "ὁδὸς δικαιοσύνης καὶ ἐλεημοσύνης εὑρήσει ζωὴν καὶ δόξαν — «путь правды и милости найдёт жизнь и славу»: подлежащее — ὁδός, поэтому 道は…見いだす; слав. «обрящет живот и славу»."
  22: "πόλεις ὀχυρὰς ἐπέβη σοφός — «в города укреплённые вошёл мудрый» (ὀχυρός — «крепкий»; ἐπιβαίνω — «вступать»). καθεῖλεν τὸ ὀχύρωμα, ἐφ᾽ ᾧ ἐπεποίθεισαν οἱ ἀσεβεῖς — «низверг укрепление, на которое надеялись нечестивые» (καθαιρέω — «разрушать»; ὀχύρωμα — 砦)."
  23: "ὃς φυλάσσει τὸ στόμα αὐτοῦ καὶ τὴν γλῶσσαν — «кто хранит уста свои и язык» (φυλάσσω — «охранять»). διατηρεῖ ἐκ θλίψεως τὴν ψυχὴν αὐτοῦ — «соблюдает от скорби душу свою» (διατηρέω — «сберегать»; θλῖψις — «скорбь, теснота»)."
  24: "θρασὺς καὶ αὐθάδης καὶ ἀλαζὼν λοιμὸς καλεῖται — «дерзкий и своевольный и надменный называется губителем» (θρασύς — «дерзкий»; αὐθάδης — «самоуверенный»; ἀλαζών — «хвастливый»; λοιμός — «гибель, губитель»). ὃς δὲ μνησικακεῖ, παράνομος — «а кто злопамятствует — беззаконник» (μνησικακέω — «помнить зло»)."
  25: "ἐπιθυμίαι ὀκνηρὸν ἀποκτείνουσιν — «похоти убивают ленивого» (ἐπιθυμία — «желание, похоть»; ὀκνηρός — «ленивый»). οὐ γὰρ προαιροῦνται αἱ χεῖρες αὐτοῦ ποιεῖν τι — «ибо не избирают руки его делать что-либо» (προαιρέομαι — «предпочитать, решаться»)."
  26: "ἀσεβὴς ἐπιθυμεῖ ὅλην τὴν ἡμέραν ἐπιθυμίας κακάς — «нечестивый желает весь день желаний злых»: винительный объекта при ἐπιθυμέω, повтор корня сохранён (欲を望む). ὁ δὲ δίκαιος ἐλεᾷ καὶ οἰκτίρει ἀφειδῶς — «праведный же милует и щедрит нещадно» (οἰκτίρω — «жалеть»; ἀφειδῶς — «не жалея»)."
  27: "θυσίαι ἀσεβῶν βδέλυγμα κυρίῳ — «жертвы нечестивых — мерзость Господу». καὶ γὰρ παρανόμως προσφέρουσιν αὐτάς — «ибо беззаконно приносят их» (παρανόμως — «беззаконно»; προσφέρω — «приносить»)."
  28: "μάρτυς ψευδὴς ἀπολεῖται — «свидетель ложный погибнет» (μάρτυς — «свидетель»). ἀνὴρ δὲ ὑπήκοος φυλασσόμενος λαλήσει — «а муж послушный, хранимый, будет говорить» (ὑπήκοος — «послушный, внимающий»; φυλάσσω — «охранять»); смысл тёмный, передано буквально."
  29: "ἀσεβὴς ἀνὴρ ἀναιδῶς ὑφίσταται προσώπῳ — «нечестивый муж бесстыдно стоит лицом» (ἀναιδῶς — «бесстыдно»; ὑφίσταμαι — «подставлять себя, стоять»; πρόσωπον — «лицо»). ὁ δὲ εὐθὴς αὐτὸς συνίει τὰς ὁδοὺς αὐτοῦ — «правый же сам разумеет пути свои»."
  30: "οὐκ ἔστιν σοφία, οὐκ ἔστιν ἀνδρεία, οὐκ ἔστιν βουλὴ πρὸς τὸν ἀσεβῆ — «нет мудрости, нет мужества, нет совета против нечестивого» (ἀνδρεία — «мужество»; βουλή — «совет»). Троекратное οὐκ закреплено троекратным も…ない. Слав. «у нечестиваго» — иное понимание πρός; Синодальный: «вопреки Господу»."
  31: "ἵππος ἑτοιμάζεται εἰς ἡμέραν πολέμου — «конь готовится на день войны». παρὰ δὲ κυρίου ἡ βοήθεια — «но от Господа помощь» (βοήθεια — «помощь»)."
