# jp-box, Притчи, глава 21. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный, с МТ) — только для
# понимания, не источник. jp-joc есть (выборка: 21:3–21, 23–31) и использован как
# контроль церковного чтения, архаизмы не копировались. jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 21: сердце царя в руке Божией (1), суд Божий (2), жертва (3), гордость (4),
# прилежание (5), лживый язык (6), погибель нечестивых (7), пути Божии (8),
# сварливая жена (9), душа нечестивого (10), наказание и знание (11–12),
# глухой к бедному (13), тайный дар (14), суд (15), исполины (16), вино и елей (17),
# выкуп (18), пустыня (19), сокровище (20), путь правды (21), город крепкий (22),
# уста и язык (23), надменный (24), лень (25–26), жертвы (27), лжесвидетель (28),
# бесстыдство (29), нет мудрости против нечестивого (30), конь и помощь Господня (31).
# Речи нет: всё — авторские изречения.
# Нумерация по gr: 31 стих. Деление совпадает с csl-ru.
# ВНИМАНИЕ (дефект модуля): 21:5 в gr-lxx-byz стоит как «.», переведён по csl-ru;
# jp-joc подтверждает церковное чтение. 〔…〕 нет; сносок ⟨…⟩ нет.
# Имена — транслитерация греческого (LXX).

