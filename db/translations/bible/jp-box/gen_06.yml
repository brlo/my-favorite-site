# jp-box, Бытие, глава 6. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru),
# русский Синодальный (ru) и jp-joc (1901, public domain).
# Язык — современный 常体, без 文語; порядок членов и деление на клаузы — по греческому.
# Глава 6: сыны Божии и исполины (1–4), решение о потопе (5–8), Ной и род человеческий
# (9–13), повеление о ковчеге (14–22).
# Красного и синего нет; речь Бога — 「…」.
# 〔…〕: 6:13 — «Господь» есть в церковном чтении (csl, jp-joc), но отсутствует
# в gr-lxx-byz (там ὁ θεός); проверено bracket_check.rb (κυριοσ — НЕТ).
# LXX отличается от масоретского текста в 6:6 (ἐνεθυμήθη — «помыслил», а не «раскаялся»)
# и 6:7 (ἐθυμώθην — «разгневался»); перевод с греческого, отличия в notes.
# Сносок ⟨…⟩ нет. jp-ni не использовался.

tr_code: jp-box
book: gen
chapter: 6
draft: true

verses:
  1: "人[ひと]々[びと]が地[ち]の上[うえ]に増[ふ]え始[はじ]め、娘[むすめ]たちが生[う]まれるようになったとき、"
  2: "神[かみ]の子[こ]らは人[ひと]の娘[むすめ]たちが美[うつく]しいのを見[み]て、自分[じぶん]たちが選[えら]んだ者[もの]をすべて妻[つま]にした。"
  3: "主[しゅ]なる神[かみ]は言[い]われた。「わたしの霊[れい]は、この人[ひと]々[びと]のうちに永遠[えいえん]に留[とど]まらない。彼[かれ]らは肉[にく]だからである。彼[かれ]らの日々[ひび]は百二十年[ねん]となる。」"
  4: "その日[ひ]々[び]にも、その後[のち]にも、地[ち]に巨人[きょじん]がいた。神[かみ]の子[こ]らが人[ひと]の娘[むすめ]たちのところに入[はい]り、彼[かれ]らに子[こ]を生[う]ませたときのことである。彼[かれ]らは昔[むかし]の名[な]高[だか]い人[ひと]々[びと]、巨人[きょじん]であった。"
  5: "主[しゅ]なる神[かみ]は、人[ひと]の悪[あく]が地[ち]に増[ふ]え、すべての人[ひと]がその心[こころ]に、日[ひ]々[び]ひたすら悪[あく]を図[はか]っているのを見[み]られた。"
  6: "神[かみ]は、地[ち]に人[ひと]を造[つく]ったことを思[おも]い巡[めぐ]らし、心[こころ]に考[かんが]えられた。"
  7: "神[かみ]は言[い]われた。「わたしが造[つく]った人[ひと]を、地[ち]の面[おもて]から拭[ぬぐ]い去[さ]ろう。人[ひと]から家畜[かちく]まで、地[ち]を這[は]うものから天[てん]の鳥[とり]まで。わたしが彼[かれ]らを造[つく]ったことを怒[いか]っているからである。」"
  8: "しかし、ノアは主[しゅ]なる神[かみ]の前[まえ]に{恵[めぐ]み|恩寵[おんちょう]}を得[え]た。"
  9: "これがノアの系図[けいず]である。ノアは正[ただ]しい人[ひと]で、その世代[せだい]の人[ひと]々[びと]の中[なか]で完全[かんぜん]であった。ノアは神[かみ]に喜[よろこ]ばれた。"
  10: "ノアは三人[さんにん]の息子[むすこ]、セム、ハム、ヤフェトを生[う]んだ。"
  11: "地[ち]は神[かみ]の前[まえ]で腐[くさ]り、地[ち]は不法[ふほう]で満[み]ちた。"
  12: "神[かみ]は地[ち]をご覧[らん]になった。見[み]よ、地[ち]は腐[くさ]っていた。すべての肉[にく]が地[ち]の上[うえ]でその道[みち]を腐[くさ]らせていたからである。"
  13: "〔主[しゅ]なる〕神[かみ]はノアに言[い]われた。「すべての人[ひと]の時[とき]が、わたしの前[まえ]に来[き]た。地[ち]が彼[かれ]らのために不法[ふほう]で満[み]ちたからである。見[み]よ、わたしは彼[かれ]らと地[ち]を滅[ほろ]ぼす。"
  14: "あなたは自分[じぶん]のために、四角[しかく]に切[き]った木[き]で箱舟[はこぶね]を造[つく]れ。箱舟[はこぶね]に部屋[へや]を造[つく]り、内[うち]も外[そと]もアスファルトで塗[ぬ]れ。"
  15: "こうして箱舟[はこぶね]を造[つく]れ。箱舟[はこぶね]の長[なが]さは三百[さんびゃく]キュビト、幅[はば]は五十[ごじゅう]キュビト、高[たか]さは三十[さんじゅう]キュビトである。"
  16: "箱舟[はこぶね]の上[うえ]に屋根[やね]を造[つく]り、上[うえ]を一[いっ]キュビトに仕上[しあ]げよ。箱舟[はこぶね]の戸口[とぐち]は横[よこ]に造[つく]れ。下[した]の階[かい]、二階[にかい]、三階[さんかい]を造[つく]れ。"
  17: "見[み]よ、わたしは洪水[こうずい]の水[みず]を地[ち]に来[きた]らせ、天[てん]の下[した]で命[いのち]の息[いき]を持つすべての肉[にく]を滅[ほろ]ぼす。地[ち]にあるものはすべて死[し]ぬ。"
  18: "しかし、わたしはあなたと契約[けいやく]を立[た]てる。あなたは箱舟[はこぶね]に入[はい]る。あなたと、あなたの息子[むすこ]たち、あなたの妻[つま]、あなたの息子[むすこ]たちの妻[つま]たちが、あなたとともに。"
  19: "すべての家畜[かちく]、すべての這[は]うもの、すべての獣[けもの]、すべての肉[にく]から、二[ふた]つずつ箱舟[はこぶね]に連[つ]れ入[い]れ、あなたとともに生[い]き延[の]びるようにせよ。それらは雄[おす]と雌[めす]である。"
  20: "すべての鳥[とり]のうちの飛[と]ぶ鳥[とり]をその種類[しゅるい]に従[したが]って、すべての家畜[かちく]をその種類[しゅるい]に従[したが]って、地[ち]を這[は]って進[すす]むすべてのものをその種類[しゅるい]に従[したが]って、二[ふた]つずつ、すべてからあなたのところに来[き]て、あなたとともに生[い]き延[の]びる。"
  21: "あなたは、食[た]べるためのすべての食物[しょくもつ]を自分[じぶん]に取[と]り、自分[じぶん]のもとに集[あつ]めよ。それはあなたと彼[かれ]らの食物[しょくもつ]となる。」"
  22: "ノアは、主[しゅ]なる神[かみ]が命[めい]じられたすべてのことを行[おこな]った。そのとおりに行[おこな]った。"

notes:
  1: "ἡνίκα ἤρξαντο… — …し始めたとき (ἡνίκα). πολλοὶ γίνεσθαι — 増える (букв. «становиться многими»). θυγατέρες ἐγενήθησαν αὐτοῖς — 娘たちが生まれた. Стих 1 — придаточное, продолжение в ст. 2, поэтому кончается на 「…とき、」."
  2: "οἱ υἱοὶ τοῦ θεοῦ — 神の子ら (в LXX так же; слав. «сынове Божии»). καλαί εἰσιν — 美しい. ἔλαβον ἑαυτοῖς γυναῖκας ἀπὸ πασῶν, ὧν ἐξελέξαντο — 選んだ者をすべて妻にした."
  3: "Οὐ μὴ καταμείνῃ τὸ πνεῦμά μου ἐν τοῖς ἀνθρώποις τούτοις — わたしの霊はこの人々のうちに永遠に留まらない (καταμένω — «пребывать»). διὰ τὸ εἶναι αὐτοὺς σάρκας — 彼らは肉だから. ἑκατὸν εἴκοσι ἔτη — 百二十年."
  4: "γίγαντες — 巨人 (LXX; слав. «исполини»). ἐν ταῖς ἡμέραις ἐκείναις καὶ μετ᾽ ἐκεῖνο — その日々にも、その後にも. ὡς ἂν εἰσεπορεύοντο — 入るたびに (ὡς ἄν с имперфектом). οἱ ἀπ᾽ αἰῶνος, οἱ ἄνθρωποι οἱ ὀνομαστοί — 昔からの、名の知れた人々 (ὀνομαστός — «знаменитый»)."
  5: "ἐπληθύνθησαν αἱ κακίαι — 悪が増えた (κακία). πᾶς τις διανοεῖται… ἐπιμελῶς — すべての人がひたすら図る (διανοέομαι). ἐπὶ τὰ πονηρὰ πάσας τὰς ἡμέρας — 日々悪に傾く."
  6: "ἐνεθυμήθη ὁ θεός — 神は思い巡らし (ἐνθυμέομαι; слав. «помысли»; Син. «раскаялся» — с евр.). διενοήθη — 考えられた (διανοέομαι; слав. «размысли»)."
  7: "Ἀπαλείψω — 拭い去ろう (ἀπαλείφω, «стирать»). ἀπὸ ἀνθρώπου ἕως κτήνους — 人から家畜まで. ἐθυμώθην — 怒っている (θυμόω; Син. «раскаялся» — с евр.)."
  8: "εὗρεν χάριν ἐναντίον κυρίου τοῦ θεοῦ — 主なる神の前に恵みを得た (χάρις — «благодать, милость»)."
  9: "γενέσεις Νωε — ノアの系図 (γένεσις). δίκαιος, τέλειος — 正しい、完全 (τέλειος — «совершенный»). ἐν τῇ γενεᾷ αὐτοῦ — その世代で. τῷ θεῷ εὐηρέστησεν — 神に喜ばれた (εὐαρεστέω; Син. «ходил пред Богом» — с евр.)."
  10: "τρεῖς υἱούς — 三人の息子."
  11: "ἐφθάρη ἡ γῆ — 地は腐った (φθείρω, «растлевать»). ἐπλήσθη ἀδικίας — 不法で満ちた (ἀδικία)."
  12: "κατεφθαρμένη — 腐っていた. κατέφθειρεν πᾶσα σὰρξ τὴν ὁδὸν αὐτοῦ — すべての肉がその道を腐らせた (букв.)."
  13: "Καιρὸς παντὸς ἀνθρώπου ἥκει ἐναντίον μου — すべての人の時がわたしの前に来た (καιρός — «время, срок»). καταφθείρω — 滅ぼす. κύριος в LXX нет — 〔主なる〕."
  14: "κιβωτὸν ἐκ ξύλων τετραγώνων — 四角に切った木で箱舟を (τετράγωνος — «четырёхугольный»; слав. «древ четвероуголных», jp-joc 松の木 — иное). νοσσιάς — 部屋 (букв. «гнёзда»). ἀσφαλτώσεις — アスファルトで塗る (ἄσφαλτος — «смола, битум»)."
  15: "πήχεων — キュビト (локоть; мера объяснена в Мф 6:27, сноску не повторяю). τριακοσίων… πεντήκοντα… τριάκοντα — 300, 50, 30."
  16: "ἐπισυνάγων ποιήσεις — 屋根を造り (ἐπισυνάγω, «собирать»; слав. «собирая сводом» — тёмное место). εἰς πῆχυν συντελέσεις ἄνωθεν — 上を一キュビトに仕上げよ. ἐκ πλαγίων — 横に. κατάγαια, διώροφα καὶ τριώροφα — 下の階、二階、三階."
  17: "ἐπάγω τὸν κατακλυσμόν — 洪水を来たらせる (κατακλυσμός — «потоп»). πνεῦμα ζωῆς — 命の息. τελευτήσει — 死ぬ (τελευτάω)."
  18: "στήσω τὴν διαθήκην μου πρὸς σέ — あなたと契約を立てる (διαθήκη — «завет»). εἰσελεύσῃ — 入る."
  19: "δύο δύο — 二つずつ. εἰσάξεις — 連れ入れる. ἵνα τρέφῃς — 生き延びさせるため (τρέφω — «кормить, содержать»). ἄρσεν καὶ θῆλυ — 雄と雌."
  20: "κατὰ γένος — その種類に従って (γένος — «род»). τῶν ἑρπετῶν τῶν ἑρπόντων — 地を這って進むすべてのもの (в LXX повтор: «пресмыкающихся, ползающих»; по-японски повтор снят). τρέφεσθαι — 生き延びる."
  21: "βρωμάτων — 食物. συνάξεις πρὸς σεαυτόν — 自分のもとに集めよ. ἔσται σοὶ καὶ ἐκείνοις φαγεῖν — あなたと彼らの食物となる."
  22: "πάντα, ὅσα ἐνετείλατο — 命じられたすべて. οὕτως ἐποίησεν — そのとおりに行った."
