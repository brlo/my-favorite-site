verses:
  1: "サタンがイスラエルに立[た]ち向[む]かい、ダビデをそそのかしてイスラエルを数[かぞ]えさせた。"
  2: "王[おう]ダビデはヨアブと軍[ぐん]の長[ちょう]たちに言[い]った。「行[い]って、ベエル・シェバからダンまでイスラエルを数[かぞ]えよ。そして、その数[かず]をわたしのところへ持[も]って来[こ]い。わたしは民[たみ]の数を知[し]ろう。」"
  3: "ヨアブは言[い]った。「主[しゅ]がご自身[じしん]の民[たみ]を、今[いま]の百倍[ひゃくばい]に増[ふ]やしてくださるように。わが主[あるじ]である王[おう]の目[め]が、それをご覧[らん]になるように。彼[かれ]らは皆[みな]、わが主のしもべではないか。なぜ、わが主はこのことを求[もと]めておられるのか。イスラエルに罪[つみ]が帰[き]すことにならないためである。」"
  4: "しかし、王[おう]の言葉[ことば]はヨアブに打[う]ち勝[か]った。ヨアブは出[で]て行[い]き、イスラエルの全[ぜん]境[きょう]を巡[めぐ]って、エルサレムに来[き]た。"
  5: "ヨアブは数[かぞ]えた民[たみ]の数[かず]をダビデに渡[わた]した。イスラエルには剣[けん]を取[と]る男[おとこ]が百十万[ひゃくじゅうまん]人[にん]、ユダには剣を取る男が四十七万[よんじゅうななまん]人[にん]いた。"
  6: "レビ人[びと]とベニヤミン人[じん]は、その中[なか]では数[かぞ]えなかった。ヨアブが王[おう]の言葉[ことば]に憤[いきどお]ったからである。"
  7: "この事[こと]は神[かみ]の前[まえ]に悪[わる]いこととして現[あらわ]れ、神はイスラエルを打[う]たれた。"
  8: "ダビデは神[かみ]に言[い]った。「わたしはこの事[こと]を行[おこな]って、ひどく罪[つみ]を犯[おか]した。今[いま]、どうか、しもべの悪[わる]を過[す]ぎ越[こ]させてほしい。わたしはひどく愚[おろ]かになってしまったからである。」"
  9: "主[しゅ]はダビデの先見者[せんけんしゃ]ガドに語[かた]って言[い]われた。"
  10: "「行[い]って、ダビデに言[い]え。主[しゅ]はこう言[い]われる。わたしはお前[まえ]に三[みっ]つのことを課[か]す。その中[なか]から一[ひと]つを選[えら]べ。わたしはそれを、お前のために行[おこな]う。」"
  11: "ガドはダビデのところに来[き]て、彼[かれ]に言[い]った。「主[しゅ]はこう言[い]われる。選[えら]べ。"
  12: "三年[さんねん]の飢饉[ききん]か、敵[てき]の前[まえ]から三か月[げつ]逃[に]げて、敵の剣[けん]に滅[ほろ]ぼされるのか、それとも三[みっ]日[か]の間[あいだ]、主[しゅ]の剣[けん]と死[し]が地[ち]に臨[のぞ]み、主の使[つか]いがイスラエルの全[ぜん]嗣業[しぎょう]のうちで滅[ほろ]ぼすのか。さあ、わたしを遣[つか]わした方[かた]に何[なに]と答[こた]えるべきかを、よく見[み]て定[さだ]めよ。」"
  13: "ダビデはガドに言[い]った。「わたしには、この三[みっ]つがどれも非常[ひじょう]に苦[くる]しい。主[しゅ]の手[て]に落[お]ちよう。主の憐[あわ]れみは非常[ひじょう]に大[おお]きいから。人[ひと]の手[て]には落ちたくない。」"
  14: "主[しゅ]はイスラエルに死[し]を与[あた]え、イスラエルのうちから七万[しちまん]人[にん]の男[おとこ]が倒[たお]れた。"
  15: "神[かみ]はエルサレムを滅[ほろ]ぼすために使[つか]いを遣[つか]わされた。使いが滅ぼし始[はじ]めたとき、主[しゅ]は見[み]て、その災[わざわ]いを悔[く]やみ、滅ぼしている使いに言[い]われた。「もう十分[じゅうぶん]だ。手[て]を下[お]ろせ。」主の使[つか]いはエブス人[じん]オルナの脱穀場[だっこくじょう]に立[た]っていた。"
  16: "ダビデは目[め]を上[あ]げて、地[ち]と天[てん]の間[あいだ]に立[た]つ主[しゅ]の使[つか]いを見[み]た。その手[て]には抜[ぬ]かれた剣[けん]があり、エルサレムに差[さ]し伸[の]べられていた。ダビデと、粗布[あらぬの]をまとった長老[ちょうろう]たちは、顔[かお]を地[ち]につけて伏[ふ]した。"
  17: "ダビデは神[かみ]に言[い]った。「民[たみ]を数[かぞ]えよと命[めい]じたのは、このわたしではないか。罪[つみ]を犯[おか]したのはこのわたしであり、悪[わる]いことをしたのもこのわたしである。この羊[ひつじ]たちは何[なに]をしたというのか。主[しゅ]なるわたしの神[かみ]よ、どうか、あなたの手[て]がわたしと、わたしの父[ちち]の家[いえ]の上[うえ]に下[くだ]り、あなたの民[たみ]の上[うえ]に滅[ほろ]びをもたらすことがないように。」"
  18: "主[しゅ]の使[つか]いはガドに、ダビデに告[つ]げるようにと言[い]われた。ダビデが上[のぼ]って、エブス人[じん]オルナの脱穀場[だっこくじょう]で主[しゅ]なる神[かみ]のために祭壇[さいだん]を築[きず]くためである。"
  19: "ダビデは、ガドが主[しゅ]の名[な]によって語[かた]った言葉[ことば]のとおりに上[のぼ]った。"
  20: "オルナは振[ふ]り向[む]いて王[おう]を見[み]た。彼[かれ]のもとにいた四人[よにん]の息子[むすこ]たちは身[み]を隠[かく]していた。オルナは小麦[こむぎ]を脱穀[だっこく]していた。"
  21: "ダビデがオルナのところへ来[き]た。オルナはダビデを見[み]て脱穀場[だっこくじょう]から出[で]て来[き]、顔[かお]を地[ち]につけてダビデを拝[おが]んだ。"
  22: "ダビデはオルナに言[い]った。「あなたの脱穀場[だっこくじょう]の場所[ばしょ]をわたしに与[あた]えてほしい。その上[うえ]に主[しゅ]のために祭壇[さいだん]を築[きず]くために。ふさわしい銀[ぎん]で、それをわたしに売[う]ってほしい。そうすれば、民[たみ]から災[わざわ]いが止[と]む。」"
  23: "オルナはダビデに言[い]った。「わが主[あるじ]である王[おう]は、ご自分[じぶん]の目[め]に良[よ]いと思[おも]われることをなさってください。見[み]よ、わたしは燔祭[はんさい]のための雄[おす]の子牛[こうし]、薪[たきぎ]のための鋤[すき]と車[くるま]、供[そな]え物[もの]のための小麦[こむぎ]を差[さ]し上[あ]げた。すべてを差し上げた。」"
  24: "王[おう]ダビデはオルナに言[い]った。「いや。わたしはふさわしい銀[ぎん]で買[か]い取[と]る。あなたのものとなっているものを主[しゅ]に取[と]り、ただで燔祭[はんさい]を主に捧[ささ]げるようなことは、決[けっ]してしない。」"
  25: "ダビデはその場所[ばしょ]の代[だい]として、オルナに重[おも]さで六百[ろっぴゃく]シケルの金[きん]を与[あた]えた。"
  26: "ダビデはそこに主[しゅ]のための祭壇[さいだん]を築[きず]き、燔祭[はんさい]と酬恩祭[しゅうおんさい]を捧[ささ]げた。彼が主[しゅ]に叫[さけ]び求[もと]めると、主は天[てん]からの火[ひ]で彼に答[こた]え、燔祭の祭壇の上[うえ]で燔祭を焼[や]き尽[つ]くされた。"
  27: "主[しゅ]は使[つか]いに言[い]われた。使[つか]いは剣[けん]を鞘[さや]に収[おさ]めた。"
  28: "そのとき、ダビデは、主[しゅ]がエブス人[じん]オルナの脱穀場[だっこくじょう]で自分[じぶん]に答[こた]えられたのを見[み]て、そこで犠牲[ぎせい]を捧[ささ]げた。"
  29: "主[しゅ]の幕屋[まくや]、すなわちモーセが荒野[こうや]で造[つく]ったものと、燔祭[はんさい]の祭壇[さいだん]は、そのとき、ガバオンの高[たか]い所[ところ]、バマにあった。"
  30: "ダビデはその前[まえ]に出[で]て行[い]って神[かみ]を求[もと]めることができなかった。主[しゅ]の使[つか]いの剣[けん]のゆえに恐[おそ]れたからである。"

notes:
  1: "διάβολος — диавол; здесь сатана (サタン). ἔστη — встал, восстал (ἵστημι). ἐπέσεισεν — возбудил, подстрекнул (ἐπισείω). ἀριθμῆσαι — исчислить, сделать перепись. В параллели 2 Цар 24:1 возбуждает Господь; расхождение не сглажено."
  2: "ἄρχοντας τῆς δυνάμεως — начальников войска (軍[ぐん]の長[ちょう]). ἀπὸ Βηρσαβεε καὶ ἕως Δαν — от Вирсавии до Дана; в 2 Цар 24:2 обратный порядок. ἐνέγκατε — принесите. γνώσομαι — узнаю, буду знать."
  3: "Προσθείη κύριος — да приложит Господь (оптатив προστίθημι). ὡς αὐτοὶ ἑκατονταπλασίως — «как они, стократно» (ἑκατονταπλασίως). οἱ ὀφθαλμοὶ … βλέποντες — глаза господина моего царя видящие. πάντες τῷ κυρίῳ μου παῖδες — все рабы господину моему. ἵνα τί ζητεῖ — зачем ищет. εἰς ἁμαρτίαν τῷ Ισραηλ — в грех Израилю."
  4: "ἐκραταιώθη — возобладало, усилилось (κραταιόω); csl «преможе». διῆλθεν ἐν παντὶ ὁρίῳ — прошёл по всей области (ὅριον)."
  5: "ἀριθμὸς τῆς ἐπισκέψεως — число переписи (ἐπισκοπή). ἐσπασμένων μάχαιραν — обнажающих меч (σπάω). У Иуды в LXX 480 000 (ὀγδοήκοντα), в csl «четыре ста и седмьдесят» — 470 000; по паритету в тексте 四十七万[よんじゅうななまん]. В 2 Цар 24:9 у Иуды — 500 000."
  6: "οὐκ ἠρίθμησεν ἐν μέσῳ αὐτῶν — не исчислил среди них. κατίσχυσεν λόγος τοῦ βασιλέως τὸν Ιωαβ — «слово царя одолело Иоава»; csl «вознегодова о словеси цареве иоав» — Иоав вознегодовал; по паритету в тексте 憤[いきどお]った."
  7: "πονηρὸν ἐφάνη ἐναντίον τοῦ θεοῦ — показалось злым пред Богом (φαίνω). πρᾶγμα — дело. ἐπάταξεν — поразил."
  8: "Ἡμάρτηκα σφόδρα — согрешил весьма (perfect). περίελε — отними (περιαιρέω). κακίαν — злую вину (κακία). ἐματαιώθην — обезумел, стал пустым (ματαιόω); csl «обезумихся»."
  9: "ὁρῶντα Δαυιδ — прозорливца Давидова (ὁράω); csl «пророку». В тексте 先見者[せんけんしゃ] по LXX, ср. 2 Цар 24:11. λέγων — «говоря»; речь продолжается в ст. 10."
  10: "Τρία αἴρω ἐγὼ ἐπὶ σέ — «три Я поднимаю на тебя» (αἴρω — поднимать, наводить); csl «трие аз наведу на тя». ἔκλεξαι σεαυτῷ ἓν — избери себе одно. ποιήσω σοι — сделаю тебе."
  11: "Ἔκλεξαι σεαυτῷ — избери себе; в LXX ст. 11 повторяет начало ст. 10 (двойное чтение), отсюда краткость. Речь Господа продолжается в ст. 12."
  12: "τρία ἔτη λιμοῦ — три года голода (в 2 Цар 24:13 — семь по МТ, не вносим). τρεῖς μῆνας φεύγειν — три месяца бежать. μάχαιραν ἐχθρῶν σου τοῦ ἐξολεθρεῦσαι — меч врагов твоих, чтобы истребить; в csl «оружие враг твоих постигнет тя» — «меч врагов постигнет тебя». ῥομφαίαν κυρίου καὶ θάνατον ἐν τῇ γῇ — меч Господень и смерть в земле. ἄγγελος κυρίου ἐξολεθρεύων — ангел Господень истребляющий (в 2 Цар 24:13 этого нет). ἰδὲ τί ἀποκριθῶ — смотри, что отвечать. В csl в скобках «(еже хощеши,)» — вставка, не переведена."
  13: "Στενά μοι καὶ τὰ τρία σφόδρα — «тесны мне и все три весьма» (στενός); csl «тесна ми суть три сия». ἐμπεσοῦμαι εἰς χεῖρας κυρίου — впаду в руки Господни. οἰκτιρμοὶ — щедроты, милости (οἰκτιρμός)."
  14: "θάνατον — смерть, мор. ἔπεσον — пали. ἑβδομήκοντα χιλιάδες ἀνδρῶν — семьдесят тысяч мужей."
  15: "ἐξολεθρεῦσαι — истребить (ἐξολεθρεύω). μετεμελήθη ἐπὶ τῇ κακίᾳ — раскаялся о бедствии (μεταμέλομαι). Ἱκανούσθω σοι — довольно тебе (ἱκανόω). ἄνες τὴν χεῖρά σου — отпусти, опусти руку (ἀνίημι). ἅλων — гумно (脱穀場[だっこくじょう])."
  16: "ἐπῆρεν τοὺς ὀφθαλμούς — поднял глаза. ἀνὰ μέσον τῆς γῆς καὶ τοῦ οὐρανοῦ — между землёй и небом. ἐσπασμένη — обнажённый. ἐκτεταμένη — простёртый. σάκκοι — вретища (粗布[あらぬの]). πρεσβύτεροι — старейшины (長老[ちょうろう]). В csl в скобках «(израилевы)» — вставка, не переведена."
  17: "Οὐκ ἐγὼ εἶπα — не я ли сказал. ἐγώ εἰμι ὁ ἁμαρτών — я есмь согрешивший. κακοποιῶν ἐκακοποίησα — «делая зло, зло сотворил» (усиление). τὰ πρόβατα — овцы. εἰς ἀπώλειαν — на погибель. В csl «Господи Боже мой» — добавлено «мой», нет в LXX, по паритету в тексте わたしの神[かみ]."
  18: "ἵνα ἀναβῇ — чтобы взошёл. στῆσαι θυσιαστήριον — поставить жертвенник (ἵστημι); csl «созиждет олтарь». В csl добавлено «Богу» — нет в LXX, по паритету в тексте 主[しゅ]なる神[かみ]."
  19: "κατὰ τὸν λόγον Γαδ — по слову Гада. ὃν ἐλάλησεν ἐν ὀνόματι κυρίου — которое он сказал именем Господним."
  20: "μεθαχαβιν — тёмное слово; csl «крыющиися» — скрывающиеся, передано 身[み]を隠[かく]していた. ἀλοῶν πυρούς — молотил пшеницу (ἀλοάω). В csl в скобках «(в то время)» — вставка, не переведена. В ru по МТ «увидел Ангела»; LXX и csl — «увидел царя»."
  21: "ἐξῆλθεν ἐκ τῆς ἅλω — вышел с гумна. προσεκύνησεν … ἐπὶ τὴν γῆν — поклонился до земли. В csl добавлено «узре давида» — нет в LXX, по паритету в тексте (ダビデを見[み]て)."
  22: "Δός μοι τὸν τόπον — дай мне место. ἐν ἀργυρίῳ ἀξίῳ — за серебро достойное, по настоящей цене (ἄξιος). παύσεται ἡ πληγή — прекратится поражение (πληγή)."
  23: "Λαβὲ σεαυτῷ — возьми себе. ποιησάτω … τὸ ἀγαθὸν ἐναντίον αὐτοῦ — пусть сделает угодное в очах его. μόσχους — тельцов. ἄροτρον — плуг (鋤[すき]); ἁμάξας — телеги (車[くるま]); εἰς ξύλα — на дрова. σῖτον — пшеницу. δέδωκα — perfect: «дал». В csl в скобках «(добровольно)» — вставка, не переведена."
  24: "ἀγοράζων ἀγοράζω — «покупкой куплю» (усиление). ἃ ἐστίν σοι — что твоё. δωρεάν — даром, туне."
  25: "σίκλους χρυσίου ὁλκῆς ἑξακοσίους — 600 сиклей золота весом (ὁλκή). В 2 Цар 24:25 — 50 сиклей серебра; здесь, по LXX и csl, — 600 золота."
  26: "σωτηρίου — жертва спасения, мирная (酬恩祭[しゅうおんさい]). ἐβόησεν — воззвал (βοάω). ἐπήκουσεν ἐν πυρί — услышал в огне. κατανάλωσεν — пожрал, истребил (καταναλίσκω)."
  27: "κατέθηκεν — опустил, вложил (κατατίθημι). κολεός — ножны (鞘[さや])."
  28: "ἐθυσίασεν — принёс жертву (θυσιάζω); csl «пожре ту жертвы»."
  29: "σκηνή — скиния (幕屋[まくや]). Βαμα — «высота» (バマ); csl «в вышнем, еже в гаваоне». Γαβαων — Гаваон (ガバオン). Здесь скиния и жертвенник всесожжения ещё в Гаваоне, а не на гумне Орны."
  30: "ἠδύνατο τοῦ πορευθῆναι — не мог пойти. ἔμπροσθεν αὐτοῦ — пред ним (перед жертвенником). ζητῆσαι τὸν θεόν — взыскать Бога. κατέσπευσεν — устрашился (редкое слово; csl «устрашен бысть»), значение гадательное."
