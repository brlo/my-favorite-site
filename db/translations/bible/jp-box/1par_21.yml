# jp-box, 1-я Паралипоменон, глава 21. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); церковнославянский (csl-ru) — второй
# свидетель церковного текста (новый паритет, docs/japanese-bible.md):
# слав. чтения входят в основной текст без 〔…〕, вариант LXX — в notes.
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет;
# jp-ni (под авторским правом) не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 21: перепись (1–6), гнев Божий и выбор казни (7–13), мор (14–17),
# жертвенник на гумне Орны (18–30; параллель 2 Цар 24).
# Особенности паритета: 1 — возбуждает сатана (в 2 Цар 24:1 — Господь);
# 5 — у Иуды 470 000 по csl (в LXX 480 000); 6 — csl «вознегодовал» вместо
# «одолело»; 12 — полный текст LXX с ангелом; 23 — «все даю» без скобочной
# вставки «добровольно». Речь — 「…」, слова Бога и людей.
# Нумерация по gr: 30 стихов, совпадает с csl/ru.
# 〔…〕 нет. Сносок ⟨…⟩ нет: 祭壇, 燔祭, 酬恩祭, 脱穀場, 先見者, 疫病 уже в корпусе.

