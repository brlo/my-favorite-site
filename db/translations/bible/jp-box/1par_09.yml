# jp-box, 1-я Паралипоменон, глава 9. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет,
# jp-ni (943 стиха, под авторским правом) источником не был.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 9: итог родословий и переселение в Вавилон (1); первые жители
# Иерусалима — миряне (2–9), священники (10–13), левиты (14–16), привратники
# (17–27), хранители утвари и певцы (28–34); повторное родословие Саула
# от Гаваона (35–44), параллельное 8:29–38.
# Речи нет; красного нет: <j>/<mo> не ставятся.
# 〔…〕 нет: в gr-lxx-byz на месте каждого стиха есть текст.
# Сносок ⟨…⟩ нет: 神殿, 祭司, レビ人, 幕屋, 安息日 уже в корпусе.
# Имена — транслитерация греческого (LXX) в катакане; где та же цепь дана
# в 8-й главе иначе, форма объяснена в notes.
# jp-ni не использовался.

tr_code: jp-box
book: 1par
chapter: 9
draft: true

verses:
  1: "こうしてイスラエルはすべて、その数[かず]が数[かぞ]えられた。見[み]よ、彼[かれ]らはイスラエルとユダの王[おう]たちの書[しょ]に、その罪[つみ]のゆえにバビロンへ移[うつ]された者[もの]たちとともに記[しる]されている。"
  2: "彼[かれ]らの所領[しょりょう]のうち、イスラエルの町[まち]々[まち]に以前[いぜん]から住[す]んでいた者[もの]たちは、イスラエル人[じん]、祭司[さいし]、レビ人[びと]、および奉仕[ほうし]に任[まか]された者[もの]たちである。"
  3: "エルサレムには、ユダの子[こ]ら、ベニヤミンの子[こ]ら、エフライムの子[こ]ら、マナセの子[こ]らのうちから住[す]む者[もの]があった。"
  4: "ゴティはアミウドの子[こ]、アムリの子[こ]、ファレスの子[こ]らに連[つら]なるユダの子[こ]である。"
  5: "シロニの者[もの]たちのうちからは、長男[ちょうなん]アサイアとその子[こ]ら。"
  6: "ザラの子[こ]らのうちからは、イエイルとその兄弟[きょうだい]たち、六百九十人[ろっぴゃくきゅうじゅうにん]。"
  7: "またベニヤミンの子[こ]らのうちからは、サロ、すなわちモソラムの子、オドウィアの子、サナアの子[こ]。"
  8: "またイブナア、イラアムの子[こ]。これらは、マキルの子[こ]オジの子[こ]らである。またマッサレム、サファティアの子[こ]、ラグエルの子[こ]、バナイアの子[こ]。"
  9: "また彼[かれ]らの兄弟[きょうだい]たちは、その世代[せだい]に従[したが]えば九百五十六人[きゅうひゃくごじゅうろくにん]であり、みな、その氏族[しぞく]の家[いえ]々[いえ]による氏族[しぞく]の長[かしら]である男[おとこ]たちである。"
  10: "祭司[さいし]のうちからは、イオダイ、イオアリム、イアキン。"
  11: "またアザリア、すなわちヘルキアの子[こ]、モソラムの子[こ]、サドクの子[こ]、マライオトの子[こ]、アキトブの子[こ]、神[かみ]の家[いえ]の指導[しどう]者[しゃ]。"
  12: "またアダイア、イラアムの子[こ]、パスクルの子[こ]、マルキアの子[こ]。またマアサイ、アディエルの子[こ]、イエディの子[こ]、モソラムの子[こ]、マセルモトの子[こ]、エメルの子[こ]。"
  13: "また彼[かれ]らの兄弟[きょうだい]たちは、氏族[しぞく]の家[いえ]の長[かしら]で、千七百六十人[せんななひゃくろくじゅうにん]。神[かみ]の家[いえ]の奉仕[ほうし]の務[つと]めに力[ちから]ある者[もの]たちである。"
  14: "レビ人[びと]のうちからは、サマイア、アソブの子[こ]、エズリカムの子[こ]、アサビアの子[こ]、メラリの子[こ]らから。"
  15: "またバクバカル、アレス、ガラル、およびマンタニア、ミカの子[こ]、ゼクリの子[こ]、アサフの子[こ]。"
  16: "またアブディア、サマイアの子[こ]、ガラルの子[こ]、エドトンの子[こ]。またバラキア、オッサの子[こ]、エルカナの子[こ]、すなわちネトファの村[むら]々[むら]に住[す]む者[もの]である。"
  17: "門衛[もんえい]はサロム、アクブ、タルマン、アイマン、およびその兄弟[きょうだい]たちである。サロムが長[かしら]であった。"
  18: "そして今[いま]に至[いた]るまで、王[おう]の門[もん]の東[ひがし]側[がわ]にある。これらはレビの子[こ]らの陣営[じんえい]の門[もん]である。"
  19: "サロムはコレの子[こ]、アビアサフの子[こ]、コラの子[こ]である。彼[かれ]の兄弟[きょうだい]たちは、その父[ちち]の家[いえ]に属[ぞく]するコラ人[びと]で、奉仕[ほうし]の務[つと]めにあって幕屋[まくや]の見張[みは]りを守[まも]っていた。彼[かれ]らの父[ちち]たちもまた、主[しゅ]の陣営[じんえい]にあって入口[いりぐち]を守[まも]っていた。"
  20: "フィネエス、エレアザルの子[こ]が、以前[いぜん]は彼[かれ]らの上[うえ]の長[かしら]であった。彼[かれ]らも彼とともにいた。"
  21: "ザカリア、メサラミの子[こ]は、証[あかし]の幕屋[まくや]の戸口[とぐち]の門衛[もんえい]であった。"
  22: "門[もん]に置[お]かれた選[えら]ばれた者[もの]たちは、全部[ぜんぶ]で二百十二人[にひゃくじゅうににん]である。彼[かれ]らはその村[むら]々[むら]に従[したが]って名簿[めいぼ]に記[しる]された。ダビデと先見者[せんけんしゃ]サムエルが、彼[かれ]らの忠実[ちゅうじつ]さのゆえに彼らを任[にん]じたのである。"
  23: "彼[かれ]らとその子[こ]らは、主[しゅ]の家[いえ]、すなわち幕屋[まくや]の家[いえ]の門[もん]を守[まも]るために置[お]かれた。"
  24: "門[もん]は四方[しほう]の風[かぜ]に向[む]かって、すなわち東[ひがし]、西[にし]、北[きた]、南[みなみ]にあった。"
  25: "彼[かれ]らの兄弟[きょうだい]たちは、その村[むら]々[むら]にあって、七[なな]日[にち]ごとに、時[とき]が来[く]るたびに彼らとともに務[つと]めに入[はい]った。"
  26: "というのは、門[もん]の四人[よにん]の力[ちから]ある者[もの]たちが忠実[ちゅうじつ]であったからである。レビ人[びと]たちは神[かみ]の家[いえ]の小[こ]部屋[べや]と倉[くら]を管理[かんり]していた。"
  27: "彼[かれ]らは神[かみ]の家[いえ]の周[まわ]りに宿営[しゅくえい]していた。見張[みは]りは彼らに任[まか]されており、朝[あさ]ごとに神殿[しんでん]の扉[とびら]を開[あ]ける鍵[かぎ]も、彼らが預[あず]かっていた。"
  28: "彼[かれ]らのうちのある者[もの]たちは奉仕[ほうし]の器[うつわ]を預[あず]かり、数[かず]を数[かぞ]えて持[も]ち入[い]れ、数[かず]を数[かぞ]えて持[も]ち出[だ]した。"
  29: "また彼[かれ]らのうちのある者[もの]たちは、器[うつわ]とすべての聖[せい]なる器[うつわ]、および小麦粉[こむぎこ]、ぶどう酒[しゅ]、油[あぶら]、乳香[にゅうこう]、香料[こうりょう]の管理[かんり]を任[まか]された。"
  30: "祭司[さいし]の子[こ]らのうちには、香油[こうゆ]を造[つく]り、香料[こうりょう]を調[ととの]える者[もの]たちがいた。"
  31: "またレビ人[びと]のうちのマッタティア、すなわちコラ人[びと]サロムの長男[ちょうなん]には、大[だい]祭司[さいし]のための、平[ひら]鍋[なべ]で焼[や]く供[そな]え物[もの]の務[つと]めが、その忠実[ちゅうじつ]さによって任[まか]されていた。"
  32: "またその兄弟[きょうだい]たちのうちのカアテ人[びと]バナイアには、安息日[あんそくび]ごとに備[そな]える、供[そな]えのパンの務[つと]めが任[まか]されていた。"
  33: "またこれらは歌[うた]い手[て]であり、レビ人[びと]の氏族[しぞく]の長[かしら]たちで、その務[つと]めの組[くみ]に分[わ]けられていた。彼[かれ]らは昼[ひる]も夜[よる]もその務[つと]めに当[あ]たっていたからである。"
  34: "これらはレビ人[びと]の氏族[しぞく]の長[かしら]たちであり、その世代[せだい]に従[したが]って長[かしら]となった者[もの]たちである。彼[かれ]らはエルサレムに住[す]んだ。"
  35: "ガバオンには、ガバオンの父[ちち]イエイルが住[す]んだ。妻[つま]の名[な]はモオカであった。"
  36: "彼[かれ]の長男[ちょうなん]はアバドン、そしてシル、キス、バアル、ネル、ナダブ、"
  37: "またゲドルとその兄弟[きょうだい]、ザカリア、マケロト。"
  38: "マケロトはサマアを生[う]んだ。彼[かれ]らは、兄弟[きょうだい]たちとともにエルサレムで、兄弟たちの間[あいだ]に住[す]んだ。"
  39: "ネルはキスを生[う]み、キスはサウルを生[う]み、サウルはヨナタン、メルキシュア、アミナダブ、イスバアルを生[う]んだ。"
  40: "ヨナタンの子[こ]はマリバアルであり、マリバアルはミカを生[う]んだ。"
  41: "ミカの子[こ]らはファイトン、マラク、タラクである。"
  42: "アカズはイアダを生[う]み、イアダはガレメト、ガズモト、ザムブリを生[う]み、ザムブリはマサを生[う]んだ。"
  43: "マサはバアナを生[う]んだ。その子[こ]はラファイア、その子はエレアサ、その子はエセルである。"
  44: "エセルには六人[ろくにん]の子[こ]があった。その名[な]は次[つぎ]のとおりである。長男[ちょうなん]エスドリカム、イスマエル、サリア、アブディア、アナン。これらはエセルの子[こ]らである。"

notes:
  1: "συλλοχισμός (συλλογισμός) — исчисление, перепись; слав. «сочтен есть». καταγεγραμμένοι ἐν βιβλίῳ τῶν βασιλέων — записанные в книге царей (не сохранившийся источник). ἀποικισθέντες εἰς Βαβυλῶνα — переселенные в Вавилон. ἐν ταῖς ἀνομίαις αὐτῶν — «в беззакониях их», т.е. за беззакония; слав. «имиже беззаконноваша». Гр. связывает запись в книге с переселенцами одной конструкцией μετά."
  2: "κατασχέσεις — владения, уделы. οἱ δεδομένοι — «отданные» (на служение при храме), т.е. нефинеи (נְתִינִים); слав. «вданнии (на служение)», Синод. «нефинеи». В корпусе термина нет, поэтому передано описательно и пояснено здесь."
  3: "ἀπὸ τῶν υἱῶν Ιουδα … Βενιαμιν … Εφραιμ καὶ Μανασση — перечисление колен, из которых были жители Иерусалима (ср. Неем 11). Состав жителей тот же, что в ст. 2, но здесь названы четыре колена."
  4: "Γωθι — ゴティ (слав. «Уфий», Синод. «Уфай»). Гр. буквально: «сын Аммиуда, сына Амри, сына сынов Фарес, сына Иуды»; слав. дополняет цепь Амвраимом и Ванией, Синод. — Омри, Имрией и Ванией (по евр.). В гр. цепь короче, переводим её."
  5: "ἐκ τῶν Σηλωνι — «из Шилони» (жители Шилона, слав. «от Силона»; Синод. «из сыновей Шилона»). Ασαια — アサイア (слав. «асаиа», Синод. «Асаия»). πρωτότοκος αὐτοῦ — первенец его."
  6: "Ζαρα — ザラ (евр. Зерах; слав. «зары»). Ιιηλ — イエイル. ἑξακόσιοι καὶ ἐνενήκοντα — 690. Счёт братьев — характерная черта списка."
  7: "Σαλω — サロ (слав. «сахом», Синод. «Саллу»). Μοσολλαμ — モソラム (евр. Мешуллам; слав. «васоллам»). Ωδουια — オドウィア (евр. Годавия). Σαναα — サナア (евр. Гассенуя)."
  8: "Ιβαναα — イブナア (Синод. «Ивния»). Ιρααμ — イラアム (Иерохам; слав. «иеровоамов»). οὗτοι υἱοὶ Οζι υἱοῦ Μαχιρ — «эти сыновья Озии, сына Махира»; слав. вставляет «елав», Синод. «Эла». Μασσαλημ — マッサレム (Мешуллам)."
  9: "κατὰ γενέσεις αὐτῶν — по родам их. ἐννακκόσιοι πεντήκοντα ἕξ — 956. ἄνδρες ἄρχοντες πατριῶν κατ᾿ οἴκους πατριῶν — мужи, главы отечеств по домам отечеств своих: тавтологичная формула, передана как «главы родов по домам родов»."
  10: "Ιωδαε — イオダイ (евр. Иедаия). Ιωαριμ — イオアリム (Иоиарив). Ιαχιν — イアキン; слав. читает «иоаким» — расхождение LXX-традиций, Синод. «Иахин»."
  11: "Χελκια — ヘルキア (Хелкия). Σαδωκ — サドク, как в корпусе. Μαραιωθ — マライオト (Мераиоф). Αχιτωβ — アキトブ (Ахитув). ἡγούμενος οἴκου τοῦ θεοῦ — «начальствующий в доме Божием»: 神の家の指導者, слав. «началник дому Божия»."
  12: "Αδαια — アダイア; Πασχωρ — パスクル (Пашхур), Μαλχια — マルキア (Малхия). Μαασαια — マアサイ (Маасай); Αδιηλ — アディエル, Ιεδιου — イエディ (Иахзер), Μασελμωθ — マセルモト (Мешиллемиф), Εμμηρ — エメル (Иммер)."
  13: "χίλιοι ἑπτακόσιοι ἑξήκοντα — 1760. ἰσχυροὶ δυνάμει — сильные силой, крепкие. εἰς ἐργασίαν λειτουργίας — «на дело служения», т.е. для работ при доме Божием; слав. «к деланию служения»."
  14: "Σαμαια — サマイア (как 2 Цар 23:11). Ασωβ — アソブ (Хашув), Εσρικαμ — エズリカム (Азрикам), Ασαβια — アサビア (Хашавия). ἐκ τῶν υἱῶν Μεραρι — из сыновей Мерари, третьего левитского рода."
  15: "Βακβακαρ — バクバカル (Вакбакар), Αρης — アレス (Хереш), Γαλαλ — ガラル. Μανθανιας — マンタニア (Матфания), Μιχα — ミカ, Ζεχρι — ゼクリ (Зихрий), Ασαφ — アサフ, родоначальник певцов."
  16: "Αβδια — アブディア (Овадия), Σαμια — サマイア, Γαλαλ — ガラル, Ιδιθων — エドトン (как в корпусе для Идифуна; гр. Ιδιθων). Βαραχια — バラキア (Берехия), Οσσα — オッサ (Аса), Ηλκανα — エルカナ (Елкана). κῶμαι Νετωφατι — селения Нетофафские, ネトファ."
  17: "πυλωροί — привратники, 門衛. Σαλωμ — サロム (Шаллум), Ακουβ — アクブ (Аккуб), Ταλμαν — タルマン (Талмон), Αιμαν — アイマン (Ахиман). ὁ ἄρχων — начальствующий, старший из них."
  18: "ἕως ταύτης — «до сего», доныне. ἐν τῇ πύλῃ τοῦ βασιλέως κατ᾿ ἀνατολάς — у царских ворот, к востоку. αἱ πύλαι τῶν παρεμβολῶν — врата станов (слав. «врата на ополчения»), т.е. входы в стан левитов."
  19: "Κωρη — コレ, Αβιασαφ — アビアサフ, Κορε — コラ (Корей); οἱ Κορῖται — コラ人. ἐπὶ τῶν ἔργων τῆς λειτουργίας — при делах служения. φυλάσσοντες τὰς φυλακὰς τῆς σκηνῆς — охраняя стражи скинии, т.е. неся караул у скинии. πατέρες αὐτῶν — отцы их, старшее поколение."
  20: "Φινεες — フィネエス (Финеес), сын Елеазара (Числ 25:7). ἡγούμενος ἦν ἐπ᾿ αὐτῶν ἔμπροσθεν — «был начальником над ними прежде». καὶ οὗτοι μετ᾿ αὐτοῦ — «и эти с ним»; Синод. по евр. читает «Господь был с ним». Держимся гр."
  21: "Ζαχαριας — ザカリア, Μασαλαμι — メサラミ (Мешелемия). σκηνὴ τοῦ μαρτυρίου — скиния свидетельства, 証の幕屋 (как Лев 1:1). πυλωρὸς τῆς θύρας — привратник двери."
  22: "ἐκλεκτοὶ ταῖς πύλαις — избранные к вратам. διακόσιοι καὶ δέκα δύο — 212. ἐν ταῖς αὐλαῖς αὐτῶν — «в селах своих» (αὐλή — двор, селение); слав. «в селех своих». ὁ καταλοχισμός — распределение по чередам, список. ὁ βλέπων — прозорливец, 先見者 (титул Самуила). τῇ πίστει αὐτῶν — по верности их."
  23: "ἐπὶ τῶν πυλῶν — у ворот. ἐν οἴκῳ κυρίου, ἐν οἴκῳ τῆς σκηνῆς — дом Господень, дом скинии: два уточняющих определения одного места. τοῦ φυλάσσειν — чтобы охранять (инфинитив цели)."
  24: "κατὰ τοὺς τέσσαρας ἀνέμους — по четырём ветрам, т.е. на четыре стороны. θάλασσαν — «море», обычное обозначение запада; слав. «к западу». Порядок сторон: восток, запад, север, юг."
  25: "κατὰ ἑπτὰ ἡμέρας — «по семи дней», т.е. недельными чередами. ἀπὸ καιροῦ εἰς καιρόν — от времени до времени, поочерёдно. μετὰ τούτων — вместе с этими (постоянными привратниками)."
  26: "ἐν πίστει — в верности, надёжно. τέσσαρες δυνατοὶ τῶν πυλῶν — четыре сильных привратника, т.е. старшие. παστοφόρια — кельи, жилые помещения при храме (слав. «хранилищи»). θησαυροί — сокровищницы, 倉."
  27: "περικύκλῳ — вокруг. παρεμβαλοῦσιν — будут располагаться станом (παρεμβάλλω), т.е. ночевать; слав. «живяху». ἐπ᾿ αὐτοὺς φυλακή — на них лежит стража. ἐπὶ τῶν κλειδῶν — при ключах. τὸ πρωῒ πρωῒ — «рано утром, рано утром», каждое утро. ἱερόν — святилище, 神殿."
  28: "σκεύη τῆς λειτουργίας — сосуды служения. ἐν ἀριθμῷ — по счёту (вносили и выносили), т.е. с пересчётом. Двойной оборот εἰσοίσουσιν / ἐξοίσουσιν — вносить и выносить."
  29: "καθεσταμένοι — поставленные (καθίστημι). σκεύη ἅγια — священные сосуды. σεμίδαλις — лучшая пшеничная мука, 小麦粉. ἔλαιον — елей, оливковое масло. λιβανωτός — ладан, 乳香. ἀρώματα — благовония, 香料."
  30: "μυρεψοί — составители мазей, мировары (μυρεψός). μύρον — миро, 香油. εἰς τὰ ἀρώματα — для благовоний, т.е. для составления смесей. Слав. «мироварцы, миро соделоваху из аромат»."
  31: "Ματταθιας — マッタティア (Маттафия). ὁ πρωτότοκος τῷ Σαλωμ τῷ Κορῖτῃ — первенец Шаллума Кореянина; в издании это пояснение в квадратных скобках, в базе оно есть. τήγανον — сковорода, 平鍋. θυσία τοῦ τηγάνου — жертва на сковороде (хлебное приношение, Лев 2:5). τοῦ μεγάλου ἱερέως — великого иерея, т.е. первосвященника."
  32: "Βαναιας ὁ Κααθίτης — バナイア, каафитянин (потомок Каафа). ἄρτοι τῆς προθέσεως — хлебы предложения, 供えのパン. τοῦ ἑτοιμάσαι σάββατον κατὰ σάββατον — «чтобы готовить субботу за субботой», т.е. каждую неделю."
  33: "ψαλτῳδοί — певцы, 歌い手. ἄρχοντες τῶν πατριῶν τῶν Λευιτῶν — главы отечеств левитских. διατεταγμέναι ἐφημερίαι — распределённые чреды (ἐφημερία — очередь служения). ἡμέρα καὶ νύξ — день и ночь, т.е. постоянно. Слав. добавляет «в храминах» — по контексту."
  34: "Замыкающая формула раздела, дословно повторяющая 8:28 (там о вениамитянах, здесь о левитах). κατὰ γενέσεις αὐτῶν — по родам их. С этого стиха начинается повтор родословия Саула, параллельный 8:29–38."
  35: "πατὴρ Γαβαων Ιιηλ — «отец Гаваона Иеил»: в 8:29 имя не названо, здесь оно есть. Μοωχα — モオカ; в 8:29 Μααχα (マアカ) — иная LXX-форма того же имени. Гр. добавляет имя, слав. «иеиль»."
  36: "Αβαδων — アバドン, Σιρ — シル (в 8:30 Σουρ, スル), Κις — キス, Βααλ — バアル, Νηρ — ネル, Ναδαβ — ナダブ. Список тот же, что 8:30, с мелкими различиями написания."
  37: "Γεδουρ — ゲドル, ἀδελφὸς — «брат» без имени и без αὐτοῦ (в 8:31 ἀδελφὸς αὐτοῦ). Ζαχαρια — ザカリア (в 8:31 Ζαχουρ, ザクル), Μακελλωθ — マケロト (в 8:31 Μακαλωθ, マカロト)."
  38: "Σαμαα — サマア (Шимей). ἐν μέσῳ τῶν ἀδελφῶν αὐτῶν — «среди братьев своих»; в 8:32 κατέναντι («напротив»). Расхождение LXX-традиций, отмечено."
  39: "Та же цепь, что 8:33. Ισβααλ — イスバアル (в 8:33 Ασαβαλ, アサバアル; евр. Эшбаал), Μελχισουε — メルキシュア, Αμιναδαβ — アミナダブ."
  40: "Μαριβααλ — マリバアル (в 8:34 Μεριβααλ, メリバアル). Μιχα — ミカ (в 8:34 Μιχια, ミキア). Разные LXX-формы одних имён, держимся чтения главы."
  41: "Φαιθων — ファイトン (в 8:35 Φιθων, ピトン), Μαλαχ — マラク, Θαραχ — タラク. В гр. три имени; Ахаз (Αχαζ) стоит в начале ст. 42, поэтому слав. и Синод. дают в ст. 41 четыре имени (по евр.). Держимся гр."
  42: "Αχαζ — アカズ; Ιαδα — イアダ (в 8:36 Ιωιαδα, イオイアダ). Γαλεμεθ — ガレメト (в 8:36 Γαλεμαθ, ガレマト), Γαζμωθ — ガズモト (в 8:36 Ασμωθ, アスモト), Ζαμβρι — ザムブリ, Μασα — マサ (в 8:36 Μαισα, マイサ)."
  43: "Βαανα — バアナ, Ραφαια — ラファイア, Ελεασα — エレアサ (в 8:37 Ελασα, エラサ), Εσηλ — エセル. Формула «сын его» трижды, как в 8:37."
  44: "ἓξ υἱοί — шесть сыновей, в гр. перечислено пять (Εσδρικαμ, Ισμαηλ, Σαρια, Αβδια, Αναν); слав. добавляет «и аса», Синод. «Бохру» — шестое имя по евр. Держимся гр. Εσδρικαμ — エスドリカム (в 8:38 Εζρικαμ, エズリカム)."
