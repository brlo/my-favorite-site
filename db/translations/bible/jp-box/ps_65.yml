# jp-box, Псалтирь, псалом 65. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0.
# Псалом 65: призыв к всей земле славить Бога (1–4), дела Божии в исходе (5–7),
# благословение народов (8–9), испытание огнём и водой (10–12),
# обеты и всесожжения (13–15), свидетельство обращённого (16–20).
# Красного и синего нет: прямая речь Христа и Богородицы в псалме не звучит.
# Кавычки: слова, которые велено сказать Богу, в ст. 3 — 「…」 (первый уровень).
# 〔…〕 нет: все слова в gr-lxx-byz есть.
# セラ (διάψαλμα, в конце ст. 4, 7 и 15) не передаётся — по решению пользователя, как у jp-joc.
# Сносок ⟨…⟩ нет: 賛美, 誓い, いけにえ, あわれみ уже в корпусе. jp-ni не использовался.

