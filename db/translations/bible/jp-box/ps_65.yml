verses:
  0: "指揮者[しきしゃ]に。復活[ふっかつ]の詩[うた]の歌[うた]。"
  1: "全[ぜん]地[ち]よ、神[かみ]に向[む]かって喜[よろこ]びの叫[さけ]びを上[あ]げよ。"
  2: "その名[な]に歌[うた]え。その賛美[さんび]に栄光[えいこう]を帰[き]せよ。"
  3: "「神[かみ]よ、あなたの業[わざ]はなんと畏[おそ]ろしいことか」と、神[かみ]に言[い]え。あなたの力[ちから]の多[おお]さのゆえに、あなたの敵[てき]はあなたに偽[いつわ]りを言[い]う。"
  4: "全[ぜん]地[ち]があなたに伏[ふ]し、あなたに歌[うた]うように。あなたの名[な]に歌[うた]うように。"
  5: "来[き]て、神[かみ]の業[わざ]を見[み]よ。神[かみ]は、人[ひと]の子[こ]らをはるかに越[こ]えて、その計[はかりごと]において畏[おそ]るべき方[かた]である。"
  6: "神[かみ]は海[うみ]を乾[かわ]いた地[ち]に変[か]えられる。人[ひと]は足[あし]で川[かわ]を渡[わた]る。わたしたちはそこで神[かみ]にあって喜[よろこ]ぶ。"
  7: "神[かみ]はその力[ちから]をもって永遠[えいえん]に治[しはい]される。その目[め]は諸[しょ]国[こく]の民[たみ]を眺[なが]めておられる。逆[さか]らう者[もの]は、みずから高[たか]ぶるな。"
  8: "諸[しょ]国[こく]の民[たみ]よ、わたしたちの神[かみ]をほめたたえよ。その賛美[さんび]の声[こえ]を聞[き]け。"
  9: "神[かみ]はわたしの魂[たましい]を生[い]かし、わたしの足[あし]がよろめくのをお許[ゆる]しにならなかった。"
  10: "神[かみ]よ、あなたはわたしたちを試[こころ]み、銀[ぎん]を試[こころ]みるように、わたしたちを火[ひ]で練[ね]った。"
  11: "あなたはわたしたちを網[あみ]にかけ、わたしたちの背[せ]に苦[くる]しみを負[お]わせた。"
  12: "人[ひと]をわたしたちの頭[あたま]の上[うえ]に乗[の]せられた。わたしたちは火[ひ]と水[みず]の中[なか]を通[とお]った。そしてあなたはわたしたちを憩[いこ]いの場[ば]へ連[つ]れ出[だ]された。"
  13: "わたしは焼[や]き尽[つ]くすいけにえを携[たずさ]えてあなたの家[いえ]に入[はい]り、あなたへの誓[ちか]いを果[は]たす。"
  14: "それは、わたしが苦[くる]しみの中[なか]で唇[くちびる]をもって言[い]い、口[くち]をもって語[かた]った誓[ちか]いである。"
  15: "わたしは脂[あぶら]ののった焼[や]き尽[つ]くすいけにえを、香[こう]と雄[お]羊[ひつじ]とともにあなたに献[ささ]げ、牛[うし]を雄[お]山羊[やぎ]とともに献[ささ]げる。"
  16: "神[かみ]を畏[おそ]れる者[もの]よ、すべて来[き]て聞[き]け。わたしは、神[かみ]がわたしの魂[たましい]になさったことを告[つ]げよう。"
  17: "わたしは口[くち]をもって神[かみ]に呼[よ]びかけ、舌[した]をもって神[かみ]を高[たか]くほめたたえた。"
  18: "もしわたしの心[こころ]に不正[ふせい]を見[み]ていたなら、主[しゅ]はわたしの声[こえ]をお聞[き]きにならなかったであろう。"
  19: "それゆえ、神[かみ]はわたしの声[こえ]を聞[き]き、わたしの願[ねが]いの声[こえ]に耳[みみ]を傾[かたむ]けられた。"
  20: "ほむべきかな、神[かみ]は。神[かみ]はわたしの祈[いの]りを退[しりぞ]けず、そのあわれみをわたしから遠[とお]ざけられなかった。"

notes:
  0: "Εἰς τὸ τέλος — «в конец», т. е. начальнику хора (指揮者, как в Пс 4–20). ᾠδὴ ψαλμοῦ ἀναστάσεως — «песнь псалма воскресения» (ᾠδή — 歌, ψαλμός — 詩; ᾀναστάσεως — 復活). В слав. «В конец, песнь псалма воскресения»; в ru-базе «Начальнику хора. Песнь.» — часть надписания опущена. Надписание — стих 0; скобками не маркируется."
  1: "Ἀλαλάξατε τῷ θεῷ, πᾶσα ἡ γῆ — 全地よ、神に向かって喜びの叫びを上げよ (ἀλαλάζω — «кричать, ликовать», боевой клич; 叫び сохраняет силу, не сглажено в «пойте»)."
  2: "ψάλατε δὴ τῷ ὀνόματι αὐτοῦ — その名に歌え (δή — усилительная частица, «же»). δότε δόξαν αἰνέσει αὐτοῦ — その賛美に栄光を帰せよ (букв. «дайте славу хвале Его»; слав. «дадите славу хвале Его»; ru-база «воздайте славу, хвалу Ему» — дословность церковного текста сохранена)."
  3: "εἴπατε τῷ θεῷ — 神に言え; слова, которые велено сказать Богу, — в 「」. Ὡς φοβερὰ τὰ ἔργα σου — あなたの業はなんと畏ろしいことか (φοβερός — «страшный, внушающий благоговейный страх»). ἐν τῷ πλήθει τῆς δυνάμεώς σου ψεύσονταί σε οἱ ἐχθροί σου — あなたの力の多さのゆえに、あなたの敵はあなたに偽りを言う (ψεύδομαι — «лгать»; слав. «солжут Тебе»; ru-база «покорятся» — оттенок лжи сохранён, «偽りを言う», без добавления «покорности»)."
  4: "πᾶσα ἡ γῆ προσκυνησάτωσάν σοι — 全地があなたに伏すように (προσκυνέω — «падать ниц, поклоняться»). ψαλάτωσάν σοι… ψαλάτωσαν τῷ ὀνόματί σου — あなたに歌うように…あなたの名に歌うように; троекратный повтор сохранён. διάψαλμα (セラ) в конце стиха не передаётся."
  5: "δεῦτε καὶ ἴδετε τὰ ἔργα τοῦ θεοῦ — 来て、神の業を見よ. φοβερὸς ἐν βουλαῖς ὑπὲρ τοὺς υἱοὺς τῶν ἀνθρώπων — 人の子らをはるかに越えて、その計らいにおいて畏るべき方 (βουλή — «совет, замысел»; слав. «страшен в советах паче сынов человеческих»)."
  6: "ὁ μεταστρέφων τὴν θάλασσαν εἰς ξηράν — 海を乾いた地に変えられる方 (μεταστρέφω — «превращать»; слав. «обращаяй море в сушу»). ἐν ποταμῷ διελεύσονται ποδί — 人は足で川を渡る (дат. «ногою»; ποδί — «стопой»). ἐκεῖ εὐφρανθησόμεθα ἐπ᾽ αὐτῷ — わたしたちはそこで神にあって喜ぶ (ἐπ᾽ αὐτῷ — «о Нём, ради Него»; 1-е л. мн. ч. сохранено)."
  7: "τῷ δεσπόζοντι ἐν τῇ δυναστείᾳ αὐτοῦ τοῦ αἰῶνος — その力をもって永遠に治められる方に (δεσπόζω — «владычествовать»; τοῦ αἰῶνος — «века», т. е. вовек). οἱ ὀφθαλμοὶ αὐτοῦ ἐπὶ τὰ ἔθνη ἐπιβλέπουσιν — その目は諸国の民を眺めておられる (ἐπιβλέπω — «призирать»). οἱ παραπικραίνοντες μὴ ὑψούσθωσαν ἐν ἑαυτοῖς — 逆らう者はみずから高ぶるな (παραπικραίνω — «горько досаждать, противиться»; запрет в 3-м лице). διάψαλμα не передаётся."
  8: "εὐλογεῖτε, ἔθνη, τὸν θεὸν ἡμῶν — 諸国の民よ、わたしたちの神をほめたたえよ (εὐλογέω — здесь «благословлять, хвалить»). ἀκουτίσασθε τὴν φωνὴν τῆς αἰνέσεως αὐτοῦ — その賛美の声を聞け (ἀκουτίζω — редк. «давать услышать»; слав. «услышите глас хвалы Его»)."
  9: "τοῦ θεμένου τὴν ψυχήν μου εἰς ζωήν — わたしの魂を生かし (τίθημι εἰς ζωήν — «положить в жизнь», т. е. сохранить живой; слав. «положившаго душу мою в живот»). μὴ δόντος εἰς σάλον τοὺς πόδας μου — わたしの足がよろめくのをお許しにならなかった (σάλος — «колебание, зыбь»; слав. «не давшаго во смятение ног моих»)."
  10: "ἐδοκίμασας ἡμᾶς — あなたはわたしたちを試み (δοκιμάζω — «испытывать, проверять»). ἐπύρωσας ἡμᾶς, ὡς πυροῦται τὸ ἀργύριον — 銀を試みるように、火で練った (πυρόω — «прокаливать, очищать огнём»; ἀργύριον — 銀)."
  11: "εἰσήγαγες ἡμᾶς εἰς τὴν παγίδα — わたしたちを網にかけ (παγίς — «петля, сеть»). ἔθου θλίψεις ἐπὶ τὸν νῶτον ἡμῶν — 背に苦しみを負わせた (νῶτος — «спина, хребет»; θλῖψις — 苦しみ, как по всему корпусу)."
  12: "ἐπεβίβασας ἀνθρώπους ἐπὶ τὰς κεφαλὰς ἡμῶν — 人をわたしたちの頭の上に乗せられた (ἐπιβιβάζω — «сажать сверху»; слав. «возвел еси человеки на главы наша» — образ сохранён). διήλθομεν διὰ πυρὸς καὶ ὕδατος — 火と水の中を通った. ἐξήγαγες ἡμᾶς εἰς ἀναψυχήν — 憩いの場へ連れ出された (ἀναψυχή — «освежение, покой»; слав. «извел еси ны в покой»; не «на свободу», как в ru-базе)."
  13: "εἰσελεύσομαι εἰς τὸν οἶκόν σου ἐν ὁλοκαυτώμασιν — 焼き尽くすいけにえを携えてあなたの家に入る (ὁλοκαύτωμα — всесожжение; 常用漢字, поэтому не 燔祭). ἀποδώσω σοι τὰς εὐχάς μου — あなたへの誓いを果たす (εὐχή — «обет, молитва»; слав. «воздам Тебе молитвы моя»; ru-база «обеты»)."
  14: "ἃς διέστειλεν τὰ χείλη μου — 唇が言い (διαστέλλω — «раздельно произносить, изрекать»; слав. «изрекосте устне мои»). ἐλάλησεν τὸ στόμα μου ἐν τῇ θλίψει μου — 苦しみの中で口が語った; пара «уста — уста/язык» сохранена как 唇 — 口."
  15: "ὁλοκαυτώματα μεμυαλωμένα — 脂ののった焼き尽くすいけにえ (μυαλόω — «наполнять мозгом», т. е. откормленные; слав. «тучна»). μετὰ θυμιάματος καὶ κριῶν — 香と雄羊とともに (θυμίαμα — «фимиам»; κριός — «баран»). ποιήσω σοι βόας μετὰ χιμάρων — 牛を雄山羊とともに献げる (βοῦς — «вол»; χίμαρος — «козёл»). διάψαλμα в конце стиха не передаётся."
  16: "δεῦτε ἀκούσατε καὶ διηγήσομαι — 来て聞け、わたしは告げよう. πάντες οἱ φοβούμενοι τὸν θεόν — 神を畏れる者よ、すべて… (πάντες отнесено к すべて при глаголе). ὅσα ἐποίησεν τῇ ψυχῇ μου — 神がわたしの魂にしたこと (дат. «душе моей»; слав. «елика сотвори души моей»)."
  17: "πρὸς αὐτὸν τῷ στόματί μου ἐκέκραξα — 口をもって神に呼びかけ (κράζω — «взывать»). ὕψωσα ὑπὸ τὴν γλῶσσάν μου — 舌をもって高くほめたたえた (букв. «вознёс под язык мой»; слав. «вознесох под язык мой»; ru-база «превознес Его языком моим» — взято церковное понимание, без буквализма «под язык»)."
  18: "Ἀδικίαν εἰ ἐθεώρουν ἐν καρδίᾳ μου — もし心に不正を見ていたなら (θεωρέω — «смотреть, усматривать»; εἰ с имперфектом — нереальное условие; ἀδικία — 不正). μὴ εἰσακουσάτω κύριος — 主はわたしの声をお聞きにならなかったであろう (букв. «да не услышит», слав. «да не услышит мя Господь»; по-японски — контрфактическое, иначе псалом противоречил бы ст. 19)."
  19: "διὰ τοῦτο εἰσήκουσέν μου ὁ θεός — それゆえ、神はわたしの声を聞き (εἰσακούω — «услышать»). προσέσχεν τῇ φωνῇ τῆς δεήσεώς μου — 願いの声に耳を傾けられた (προσέχω — «внимать»; δέησις — «прошение»)."
  20: "εὐλογητὸς ὁ θεός — ほむべきかな、神は (формула благословения, ср. 67:36). ὃς οὐκ ἀπέστησεν τὴν προσευχήν μου — わたしの祈りを退けず (ἀφίστημι — «отставлять, удалять»; слав. «не отстави»). καὶ τὸ ἔλεος αὐτοῦ ἀπ᾽ ἐμοῦ — そのあわれみをわたしから遠ざけられなかった (ἔλεος — あわれみ, как по корпусу)."
