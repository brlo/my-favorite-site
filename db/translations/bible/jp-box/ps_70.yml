verses:
  1: "ダビデの詩[うた]。ヨナダブの子[こ]らと、最初[さいしょ]に捕囚[ほしゅう]にされた者[もの]たちのもの。神[かみ]よ、わたしはあなたに寄[よ]り頼[たの]んだ。永遠[えいえん]に恥[は]をかきませんように。"
  2: "あなたの義[ぎ]によってわたしを救[すく]い出[だ]し、わたしを引[ひ]き出[だ]してください。あなたの耳[みみ]をわたしに傾[かたむ]け、わたしを救[すく]ってください。"
  3: "わたしのために、守[まも]ってくださる神[かみ]、わたしを救[すく]う強[つよ]い所[ところ]となってください。あなたはわたしの岩[いわ]、わたしの逃[に]げ場[ば]である。"
  4: "わたしの神[かみ]よ、罪[つみ]人[びと]の手[て]から、不法[ふほう]をなす者[もの]と不正[ふせい]をなす者[もの]の手[て]から、わたしを救[すく]い出[だ]してください。"
  5: "主[しゅ]よ、あなたはわたしの忍耐[にんたい]である。主[しゅ]はわたしの若[わか]い日[ひ]からの希望[きぼう]である。"
  6: "わたしは生[う]まれる前[まえ]からあなたに支[ささ]えられ、母[はは]の胎[たい]から出[で]たときから、あなたはわたしを覆[おお]う方[かた]であった。わたしの賛美[さんび]はいつもあなたにある。"
  7: "わたしは多[おお]くの者[もの]にとって、驚[おどろ]くべきしるしのようになった。しかし、あなたはわたしの強[つよ]い助[たす]けである。"
  8: "わたしの口[くち]が賛美[さんび]に満[み]ちますように。わたしがあなたの栄光[えいこう]を、日[ひ]の暮[く]れまであなたの威[い]厳[げん]を歌[うた]うために。"
  9: "老[お]いの時[とき]にわたしを捨[す]てないでください。わたしの力[ちから]が尽[つ]きるとき、わたしを見放[みはな]さないでください。"
  10: "わたしの敵[てき]はわたしについて語[かた]り、わたしの魂[たましい]をねらう者[もの]たちはともに計[はか]った。"
  11: "「神[かみ]は彼[かれ]を見捨[みす]てた。追[お]いかけて捕[つか]まえよ。救[すく]い出[だ]す者[もの]はいないのだから」と。"
  12: "神[かみ]よ、わたしから遠[とお]ざからないでください。わたしの神[かみ]よ、わたしを助[たす]けるために心[こころ]を向[む]けてください。"
  13: "わたしの魂[たましい]をそしる者[もの]たちが恥[は]じ、消[き]えますように。わたしに災[わざわ]いを求[もと]める者[もの]たちが恥[は]じと辱[はずかし]めを着[き]ますように。"
  14: "しかし、わたしはいつもあなたに寄[よ]り頼[たの]み、あなたのすべての賛美[さんび]に賛美[さんび]を重[かさ]ねる。"
  15: "わたしの口[くち]はあなたの義[ぎ]を告[つ]げ、日[ひ]の暮[く]れまであなたの救[すく]いを告[つ]げる。その数[かず]をわたしは知[し]らないからである。"
  16: "わたしは主[しゅ]の力[ちから]のうちに歩[あゆ]み入[はい]り、主[しゅ]よ、あなたの義[ぎ]だけを思[おも]い起[おこ]す。"
  17: "神[かみ]よ、あなたは若[わか]い時[とき]からわたしを教[おし]え、わたしは今[いま]に至[いた]るまであなたの奇[き]跡[せき]を告[つ]げる。"
  18: "神[かみ]よ、老[お]いと白髪[しらが]の時[とき]までわたしを捨[す]てないでください。わたしがあなたの腕[うで]を、来[きた]るべきすべての世代[せだい]に告[つ]げ終[お]えるまで。"
  19: "あなたの力[ちから]と義[ぎ]を、神[かみ]よ、あなたがなさった大[おお]きな業[わざ]は、高[たか]い所[ところ]まで及[およ]んでいる。神[かみ]よ、だれがあなたに似[に]ているだろうか。"
  20: "あなたはわたしに多[おお]くの、また重[おも]い苦[くる]しみを見[み]せ、また立[た]ち返[かえ]ってわたしを生[い]かし、地[ち]の深[ふか]みから再[ふたた]びわたしを引[ひ]き上[あ]げてくださった。"
  21: "あなたはわたしの上[うえ]にあなたの大[おお]きさを増[ま]し、立[た]ち返[かえ]ってわたしを慰[なぐさ]め、地[ち]の深[ふか]みから再[ふたた]びわたしを引[ひ]き上[あ]げてくださった。"
  22: "わたしは詩[うた]の器[うつわ]をもって、あなたの真実[しんじつ]をほめたたえる。神[かみ]よ、イスラエルの聖[せい]なる方[かた]よ、わたしは琴[こと]をもってあなたに歌[うた]う。"
  23: "わたしがあなたに歌[うた]うとき、わたしの唇[くちびる]は喜[よろこ]び、あなたが贖[あがな]われたわたしの魂[たましい]も喜[よろこ]ぶ。"
  24: "わたしの舌[した]も、日[ひ]の暮[く]れまであなたの義[ぎ]を思[おも]い巡[めぐ]らす。わたしに災[わざわ]いを求[もと]める者[もの]たちが恥[は]じ、辱[はずかし]めを受[う]けるときに。"

notes:
  1: "Надписание (прежний ст. 0, влит в этот стих): Τῷ Δαυιδ· υἱῶν Ιωναδαβ καὶ τῶν πρώτων αἰχμαλωτισθέντων — «Давиду, сынов Ионадава и первых пленённых». В ru-базе и у jp-joc надписания нет (в евр. псалом не надписан); по правилу надписание берётся из gr-lxx-byz. Ιωναδαβ — ヨナダブ; αἰχμαλωτίζω — «брать в плен»; 捕囚 — «пленные, плен». Стих: Ὁ θεός, ἐπὶ σοὶ ἤλπισα — 神よ、わたしはあなたに寄り頼んだ (ἐλπίζω ἐπί — «надеяться на»; perfect, «положился»). μὴ καταισχυνθείην εἰς τὸν αἰῶνα — 永遠に恥をかきませんように (καταισχύνω — «посрамлять»; εἰς τὸν αἰῶνα — «в век»)."
  2: "ἐν τῇ δικαιοσύνῃ σου ῥῦσαί με καὶ ἐξελοῦ με — あなたの義によって救い出し、引き出してください (ῥύομαι, ἐξαιρέω — два глагола избавления, оба переданы). κλῖνον πρός με τὸ οὖς σου — あなたの耳をわたしに傾け (κλίνω — «наклонять»; слав. «приклони ко мне ухо Твое»)."
  3: "γενοῦ μοι εἰς θεὸν ὑπερασπιστήν — わたしのために、守る神…となってください (ὑπερασπίζω — «защищать»). εἰς τόπον ὀχυρὸν τοῦ σῶσαί με — わたしを救う強い所 (ὀχυρός — «крепкий, укреплённый»; τόπος — 所). στερέωμά μου καὶ καταφυγή μου εἶ σύ — あなたはわたしの岩、わたしの逃げ場 (στερέωμα — «твердыня»; καταφυγή — «прибежище»; 岩 — по церковному образу)."
  4: "ῥῦσαί με ἐκ χειρὸς ἁμαρτωλοῦ — 罪人の手から救い出してください (χείρ — «рука», как образ власти). ἐκ χειρὸς παρανομοῦντος καὶ ἀδικοῦντος — 不法をなす者と不正をなす者の手から (παρανομέω — «преступать закон»; ἀδικέω — «обижать»)."
  5: "σὺ εἶ ἡ ὑπομονή μου — あなたはわたしの忍耐 (ὑπομονή — «терпение, ожидание»; слав. «Ты еси терпение мое»). κύριος ἡ ἐλπίς μου ἐκ νεότητός μου — 主はわたしの若い日からの希望 (νεότης — «юность»; двойное κύριος сохранено: 主よ…主は)."
  6: "ἐπὶ σὲ ἐπεστηρίχθην ἀπὸ γαστρός — 生まれる前からあなたに支えられ (ἐπιστηρίζω — «утверждать»; γαστήρ — «чрево»). ἐκ κοιλίας μητρός μου σύ μου εἶ σκεπαστής — 母の胎から、あなたはわたしを覆う方 (σκεπαστής — «покровитель»; слав. «покровитель»). ἐν σοὶ ἡ ὕμνησίς μου διὰ παντός — わたしの賛美はいつもあなたにある (ὕμνησις — «воспевание»; слав. «о Тебе пение мое выну»)."
  7: "ὡσεὶ τέρας ἐγενήθην τοῖς πολλοῖς — 多くの者にとって、驚くべきしるしのようになった (τέρας — «чудо, знамение»; слав. «яко чудо бых многим»; ru-база «как бы дивом»). σὺ βοηθὸς κραταιός — あなたはわたしの強い助け (κραταιός — «мощный»)."
  8: "πληρωθήτω τὸ στόμα μου αἰνέσεως — わたしの口が賛美に満ちますように (αἴνεσις — «хваление»). ὅπως ὑμνήσω τὴν δόξαν σου — あなたの栄光を歌うために (ὑμνέω — «воспевать»). ὅλην τὴν ἡμέραν τὴν μεγαλοπρέπειάν σου — 日の暮れまで、あなたの威厳を (ὅλην τὴν ἡμέραν — «весь день»; μεγαλοπρέπεια — «великолепие»)."
  9: "μὴ ἀπορρίψῃς με εἰς καιρὸν γήρως — 老いの時に捨てないでください (ἀπορρίπτω — «отвергать»; γῆρας — «старость»). ἐν τῷ ἐκλείπειν τὴν ἰσχύν μου μὴ ἐγκαταλίπῃς με — 力が尽きるとき、見放さないでください (ἐκλείπω — «оскудевать»; ἰσχύς — «сила»; ἐγκαταλείπω — «оставлять»)."
  10: "εἶπαν οἱ ἐχθροί μου ἐμοί — わたしの敵はわたしについて語り (дат. «мне»; λέγω — «говорить»). οἱ φυλάσσοντες τὴν ψυχήν μου — わたしの魂をねらう者たち (φυλάσσω — «стеречь, подстерегать»). ἐβουλεύσαντο ἐπὶ τὸ αὐτό — ともに計った (βουλεύομαι — «совещаться»; ἐπὶ τὸ αὐτό — «вместе»)."
  11: "λέγοντες Ὁ θεὸς ἐγκατέλιπεν αὐτόν — 「神は彼を見捨てた」と言う (ἐγκαταλείπω — «оставлять»). καταδιώξατε καὶ καταλάβετε αὐτόν — 追いかけて捕まえよ (καταδιώκω — «преследовать»; καταλαμβάνω — «захватывать»). οὐκ ἔστιν ὁ ῥυόμενος — 救い出す者はいない (ῥύομαι — «избавлять»). Слова врагов — 「」."
  12: "μὴ μακρύνῃς ἀπ᾽ ἐμοῦ — わたしから遠ざからないでください (μακρύνω — «удалять»). ὁ θεός μου, εἰς τὴν βοήθειάν μου πρόσχες — わたしの神よ、わたしを助けるために心を向けてください (προσέχω — «внимать»; слав. «в помощь мою вонми»)."
  13: "αἰσχυνθήτωσαν καὶ ἐκλιπέτωσαν οἱ ἐνδιαβάλλοντες τὴν ψυχήν μου — わたしの魂をそしる者たちが恥じ、消えますように (ἐνδιαβάλλω — «клеветать, подстрекать»; ἐκλείπω — «исчезать»). περιβαλέσθωσαν αἰσχύνην καὶ ἐντροπήν — 恥じと辱めを着ますように (περιβάλλω — «облекать»). οἱ ζητοῦντες τὰ κακά μοι — わたしに災いを求める者たち."
  14: "ἐγὼ δὲ διὰ παντὸς ἐλπιῶ — しかし、わたしはいつも寄り頼む (διά παντός — «непрестанно»). προσθήσω ἐπὶ πᾶσαν τὴν αἴνεσίν σου — あなたのすべての賛美に賛美を重ねる (προστίθημι — «прибавлять»; слав. «приложу на всяку хвалу Твою»)."
  15: "τὸ στόμα μου ἐξαγγελεῖ τὴν δικαιοσύνην σου — わたしの口はあなたの義を告げる (ἐξαγγέλλω — «возвещать»). ὅλην τὴν ἡμέραν τὴν σωτηρίαν σου — 日の暮れまで、あなたの救いを. ὅτι οὐκ ἔγνων γραμματείας — その数をわたしは知らないから (γραμματεία — «письмена, счёт»; слав. «не познах книжная», т. е. не могу исчислить; ru-база «не знаю им числа»)."
  16: "εἰσελεύσομαι ἐν δυναστείᾳ κυρίου — 主の力のうちに歩み入る (δυναστεία — «держава, сила»). μνησθήσομαι τῆς δικαιοσύνης σου μόνου — あなたの義だけを思い起こす (μόνος — «единственный»; слав. «правду Твою едину»)."
  17: "ἐδίδαξάς με ἐκ νεότητός μου — 若い時からわたしを教え (διδάσκω — «учить»; слав. «научил мя еси»). μέχρι νῦν ἀπαγγελῶ τὰ θαυμάσιά σου — 今に至るまであなたの奇跡を告げる (θαυμάσιος — «дивный»; ἀπαγγέλλω — «возвещать»)."
  18: "ἕως γήρους καὶ πρεσβείου — 老いと白髪の時まで (πρεσβεῖον — «старчество, седина»; слав. «до старости и престарения»). ἕως ἂν ἀπαγγείλω τὸν βραχίονά σου πάσῃ τῇ γενεᾷ τῇ ἐρχομένῃ — 来るべきすべての世代にあなたの腕を告げ終えるまで (βραχίων — «мышца, рука»; γενεά — «род»). Часть стиха по делению слав. — в ст. 19."
  19: "Перенесено из ст. 18 (по делению слав.): τὴν δυναστείαν σου καὶ τὴν δικαιοσύνην σου — あなたの力と義. ἕως ὑψίστων ἃ ἐποίησας μεγαλεῖα — あなたがなさった大きな業は高き所まで及ぶ (ὕψιστος — «высочайший»; μεγαλεῖον — «великое»; слав. «до превыспренних»). τίς ὅμοιός σοι — だれがあなたに似ているだろうか (ὅμοιος — «подобный»; ср. Исх 15:11)."
  20: "ὅσας ἔδειξάς μοι θλίψεις πολλὰς καὶ κακάς — 多くの、また重い苦しみを見せ (κακός — «злой, тяжкий»; слав. «напасти многи и злы»). ἐπιστρέψας ἐζωοποίησάς με — 立ち返ってわたしを生かし (ζωοποιέω — «оживотворять»). ἐκ τῶν ἀβύσσων τῆς γῆς πάλιν ἀνήγαγές με — 地の深みから再び引き上げてくださった (ἄβυσσος — «бездна»)."
  21: "ἐπλεόνασας τὴν μεγαλοσύνην σου — あなたの大きさを増し (πλεονάζω — «умножать»; μεγαλοσύνη — «величие»). ἐπιστρέψας παρεκάλεσάς με — 立ち返って慰めてくださった (παρακαλέω — «утешать»). Вторая половина стиха в базе стоит в квадратных скобках (повтор из ст. 20), слова в базе есть — 〔…〕 не ставятся; повтор сохранён, как в слав. и у jp-joc."
  22: "ἐξομολογήσομαί σοι ἐν σκεύει ψαλμοῦ τὴν ἀλήθειάν σου — 詩の器をもって、あなたの真実をほめたたえる (σκεῦος ψαλμοῦ — «орудие псалма», т. е. струнный инструмент; слав. «в сосудех псаломских»). ψαλῶ σοι ἐν κιθάρᾳ, ὁ ἅγιος τοῦ Ισραηλ — 琴をもってあなたに歌う、イスラエルの聖なる方よ (κιθάρα — 琴[こと], как по корпусу)."
  23: "ἀγαλλιάσονται τὰ χείλη μου, ὅταν ψάλω σοι — あなたに歌うとき、わたしの唇は喜び (ἀγαλλιάομαι — «ликовать»; χεῖλος — «губа»). ἡ ψυχή μου, ἣν ἐλυτρώσω — あなたが贖われたわたしの魂も (λυτρόω — «искупать»)."
  24: "ἔτι δὲ καὶ ἡ γλῶσσά μου ὅλην τὴν ἡμέραν μελετήσει τὴν δικαιοσύνην σου — わたしの舌も、日の暮れまであなたの義を思い巡らす (μελετάω — «размышлять, повторять шёпотом»; слав. «поучится правде Твоей»). ὅταν αἰσχυνθῶσιν καὶ ἐντραπῶσιν οἱ ζητοῦντες τὰ κακά μοι — わたしに災いを求める者たちが恥じ、辱めを受けるときに."
