draft: true

verses:
  1: "子[こ]どもたちよ、父[ちち]であるわたしの言[い]うことを聞[き]き、そう行[おこな]え。あなたがたが救[すく]われるためである。"
  2: "主[しゅ]は子[こ]どもたちに対して父[ちち]を栄光[えいこう]ある者[もの]とし、母[はは]の裁[さば]きを息子[むすこ]たちの上[うえ]に堅[かた]くされたからである。"
  3: "父[ちち]を敬[うやま]う者[もの]は罪[つみ]を償[つぐな]う。"
  4: "母[はは]に栄光[えいこう]を与[あた]える者[もの]は、宝[たから]を蓄[たくわ]える者[もの]のようである。"
  5: "父[ちち]を敬[うやま]う者[もの]は子[こ]どもたちによって喜[よろこ]ばされ、祈[いの]りの日[ひ]には聞[き]き入[い]れられる。"
  6: "父[ちち]を敬[うやま]う者[もの]は長[なが]生[い]きし、主[しゅ]に聞[き]き従[したが]う者[もの]は母[はは]を安[やす]らかにする。"
  7: "主[しゅ]を恐[おそ]れる者[もの]は父[ちち]を敬[うやま]い、自分[じぶん]を生[う]んだ者[もの]たちに、主人[しゅじん]たちに対するように仕[つか]える。"
  8: "行[おこな]いと言葉[ことば]で父[ちち]と母[はは]を敬[うやま]え。そうすれば、彼らから祝福[しゅくふく]があなたに臨[のぞ]む。"
  9: "父[ちち]の祝福[しゅくふく]は子[こ]どもたちの家[いえ]を堅[かた]くし、母[はは]の呪[のろ]いは礎[いしずえ]まで根[ね]こそぎにするからである。"
  10: "父[ちち]の辱[はずかし]めの中[なか]で自分[じぶん]を誇[ほこ]るな。父の辱めはあなたの栄光[えいこう]ではないからである。"
  11: "人[ひと]の栄光[えいこう]は父[ちち]への敬[うやま]いから生[う]まれ、母[はは]の不名誉[ふめいよ]は子[こ]どもたちの辱[はずかし]めとなるからである。"
  12: "子[こ]よ、父[ちち]の老[お]いを支[ささ]え、その生[い]きている間[あいだ]、父を悲[かな]しませるな。"
  13: "たとえ父[ちち]の悟[さと]りが衰[おとろ]えても、父を大[おお]らかに受[う]け入[い]れ、あなたの力[ちから]のすべてをもって父を辱[はずかし]めてはならない。"
  14: "父[ちち]への施[ほどこ]しは忘[わす]れられない。罪[つみ]の代[か]わりに、それがあなたのために建[た]て上[あ]げられるからである。"
  15: "あなたの苦[くる]しみの日[ひ]に、それはあなたのために覚[おぼ]えられる。あなたの罪[つみ]は、熱[ねつ]で氷[こおり]が解[と]けるように消[き]え去[さ]る。"
  16: "父[ちち]を捨[す]てる者[もの]は神[かみ]を冒涜[ぼうとく]する者[もの]のようであり、母[はは]を怒[いか]らせる者[もの]は主[しゅ]に呪[のろ]われる。"
  17: "子[こ]よ、柔和[にゅうわ]さをもってあなたの業[わざ]を営[いとな]め。そうすれば、受[う]け入[い]れられる人[ひと]に愛[あい]される。"
  18: "あなたが大[おお]きければ大きいほど、ますます自分[じぶん]を低[ひく]くせよ。そうすれば、主[しゅ]の前[まえ]に恵[めぐ]みを見[み]いだす。"
  19: "高[たか]い身分[みぶん]にあり、栄光[えいこう]ある者[もの]は多[おお]い。しかし、秘密[ひみつ]は柔和[にゅうわ]な者[もの]たちに明[あき]らかにされる。"
  20: "主[しゅ]の力[ちから]は大[おお]きく、主は低[ひく]くされた者[もの]たちによってほめたたえられるからである。"
  21: "自分[じぶん]より高[たか]いことを求[もと]めるな。自分より強[つよ]いことを探[さぐ]り求めるな。"
  22: "あなたに命[めい]じられたことを思[おも]いめぐらせ。あなたに隠[かく]されたことは必要[ひつよう]ではないからである。"
  23: "あなたの業[わざ]の余[あま]り多[おお]きことに、むやみに手を出[だ]すな。人[ひと]の悟[さと]りを超[こ]えた多[おお]くのことが、あなたには示[しめ]されているからである。"
  24: "多[おお]くの者[もの]を自分[じぶん]の思[おも]い込[こ]みが迷[まよ]わせ、悪[わる]い疑[うたが]いがその思[おも]いを滅[ほろ]ぼしたからである。"
  25: "災[わざわ]いを愛[あい]する者[もの]は、それに陥[おちい]る。"
  26: "頑[かた]な心[こころ]は終[つい]に苦[くる]しみを受[う]け、危険[きけん]を愛する者[もの]は、その中[なか]で滅[ほろ]びる。"
  27: "頑[かた]な心[こころ]は苦[くる]しみによって重[おも]くなり、罪人[つみびと]は罪[つみ]の上[うえ]に罪を重[かさ]ねる。"
  28: "高[たか]ぶる者[もの]の受[う]ける災[わざわ]いには癒[いや]しがない。悪[わる]い植物[しょくぶつ]がその者[もの]のうちに根[ね]を張[は]っているからである。"
  29: "悟[さと]りのある者[もの]の心[こころ]はたとえ話[ばなし]を思[おも]いめぐらし、聞[き]く者[もの]の耳[みみ]は知恵[ちえ]ある者[もの]の願[ねが]いである。"
  30: "燃[も]え上[あ]がる火[ひ]は水[みず]が消[け]す。施[ほどこ]しもまた罪[つみ]を償[つぐな]う。"
  31: "恩[おん]に報[むく]いる者[もの]は後[のち]のことを心[こころ]に留[と]め、倒[たお]れる時[とき]に支[ささ]えを見[み]いだす。"

notes:
  1: "Ἐμοῦ τοῦ πατρὸς ἀκούσατε — «послушайте меня, отца» (род. при ἀκούω; слав. «мене отца послушайте»); τέκνα — «чада»; οὕτως ποιήσατε — «так творите»; ἵνα σωθῆτε — «чтобы спастись». Слово отца — предмет поучения, его авторитет обоснован в 3:2."
  2: "ἐδόξασεν πατέρα ἐπὶ τέκνοις — «прославил отца над детьми» (ἐπί с дат. — «над»); κρίσιν μητρὸς ἐστερέωσεν ἐφ᾽ υἱοῖς — «суд матери утвердил над сыновьями» (κρίσις — суд, право; στερεόω — утверждать, укреплять), передано 裁き."
  3: "ὁ τιμῶν — «почитающий» (τιμάω); ἐξιλάσκεται ἁμαρτίας — «умилостивляет, искупает грехи» (ἐξιλάσκομαι), слав. «очистит грехи»; передано 償う. Стих продолжается в 3:4."
  4: "ὡς ὁ ἀποθησαυρίζων — «как сокровищехранитель» (ἀποθησαυρίζω — складывать в сокровищницу); ὁ δοξάζων μητέρα αὐτοῦ — «прославляющий мать свою». Сравнение без сказуемого — эллипсис греческого сохранён."
  5: "εὐφρανθήσεται ὑπὸ τέκνων — «возвеселится детьми» (ὑπό с род. — действующая причина); слав. «о чадех» — «о детях», иное управление; ἐν ἡμέρᾳ προσευχῆς αὐτοῦ — «в день молитвы его»; εἰσακουσθήσεται — «будет услышан»."
  6: "μακροημερεύσει — «долгоденствовать будет» (μακροημερεύω); ὁ εἰσακούων κυρίου — «слушающий Господа» (род. при εἰσακούω, как в слав. «послушаяй Господа»); ἀναπαύσει μητέρα αὐτοῦ — «успокоит мать свою»."
  7: "καὶ ὡς δεσπόταις δουλεύσει ἐν τοῖς γεννήσασιν αὐτόν — «и как владыкам послужит родившим его» (δεσπότης — владыка, хозяин). Слав. перед этим добавляет «Бояйся Господа почтит отца и» — в LXX нет; внесено в основной текст без скобок."
  8: "ἐν ἔργῳ καὶ λόγῳ τίμα τὸν πατέρα σου — «делом и словом почитай отца твоего»; ἵνα ἐπέλθῃ σοι εὐλογία παρ᾽ αὐτοῦ — «чтобы пришло на тебя благословение от него». Слав. добавляет «и матерь» и «от них» (в LXX «от него»); внесено без скобок."
  9: "στηρίζει οἴκους τέκνων — «утверждает домы детей» (στηρίζω); κατάρα μητρὸς ἐκριζοῖ θεμέλια — «клятва матери искореняет основания» (ἐκριζόω — вырывать с корнем; θεμέλια — основания), передано 礎."
  10: "μὴ δοξάζου ἐν ἀτιμίᾳ πατρός σου — «не прославляйся в бесчестии отца твоего» (ἀτιμία — бесчестие); οὐ γάρ ἐστίν σοι δόξα πατρὸς ἀτιμία — «ибо не слава тебе бесчестие отца»."
  11: "ἡ δόξα ἀνθρώπου ἐκ τιμῆς πατρός — «слава человека от чести отца»; ὄνειδος τέκνοις μήτηρ ἐν ἀδοξίᾳ — «поношение детям мать в бесславии» (ὄνειδος — поношение; ἀδοξία — бесславие)."
  12: "ἀντιλαβοῦ ἐν γήρᾳ πατρός σου — «поддержи в старости отца твоего» (ἀντιλαμβάνομαι; γῆρας — старость); μὴ λυπήσῃς αὐτόν — «не огорчи его»; ἐν τῇ ζωῇ αὐτοῦ — «в жизни его»."
  13: "κἂν ἀπολείπῃ συνέσει — «если и оскудеет разумом» (σύνεσις — разумение; ἀπολείπω — недоставать); συγγνώμην ἔχε — «имей снисхождение» (συγγνώμη — прощение, снисхождение); ἐν πάσῃ ἰσχύι σου — «всей крепостью твоею»."
  14: "ἐλεημοσύνη πατρός — «милостыня отцу» (ἐλεημοσύνη — милостыня, милосердие), передано 施し; οὐκ ἐπιλησθήσεται — «не будет забыта» (ἐπιλανθάνομαι); ἀντὶ ἁμαρτιῶν προσανοικοδομηθήσεταί σοι — «вместо грехов пристроится тебе» (προσανοικοδομέω — пристраивать, созидать сверх)."
  15: "ἐν ἡμέρᾳ θλίψεώς σου ἀναμνησθήσεταί σου — «в день скорби твоей вспомнит о тебе»; ὡς εὐδία ἐπὶ παγετῷ — «как ясная погода при морозе» (εὐδία, παγετός). Слав. «якоже лед от зноя» — «как лёд от зноя», иное чтение, взято по паритету; ἀναλυθήσονται — «разрешатся, растают» (ἀναλύω)."
  16: "ὡς βλάσφημος — «как хулитель, богохульник» (βλάσφημος); ὁ ἐγκαταλιπὼν πατέρα — «оставивший отца»; κεκατηραμένος ὑπὸ κυρίου — «проклятый Господом» (καταράομαι); ὁ παροργίζων μητέρα — «раздражающий мать» (παροργίζω)."
  17: "ἐν πραΰτητι — «в кротости» (πραΰτης), передано 柔和; διέξαγε — «проводи, веди» (διάγω); ὑπὸ ἀνθρώπου δεκτοῦ — «приятным, угодным человеком» (δεκτός), передано 受け入れられる人."
  18: "ὅσῳ μέγας εἶ, τοσούτῳ ταπείνου σεαυτόν — «насколько велик ты, настолько смиряй себя» (ταπεινόω); ἔναντι κυρίου εὑρήσεις χάριν — «пред Господом обретёшь благодать» (χάρις — 恵み, в кальке 恩寵)."
  19: "В gr-lxx-byz на месте стиха стоит «.» — дефект модуля. Переведено по csl-ru (единственный свидетель): «Мнози суть высоцы и славни: но кротким открываются тайны» — «многие высоки и славны, но кротким открываются тайны» (в издании: πολλοὶ ὑψηλοὶ καὶ ἔνδοξοι, καὶ τοῖς πραέσιν ἀποκαλύπτεται μυστήριον; в модуле этих слов нет). 〔…〕 не ставится: это правило для дефектов модуля, а не церковное добавление."
  20: "μεγάλη ἡ δυναστεία τοῦ κυρίου — «велико могущество Господа» (δυναστεία — сила, власть); ὑπὸ τῶν ταπεινῶν δοξάζεται — «смиренными прославляется» (ταπεινοί — смиренные, низкие)."
  21: "χαλεπώτερά σου μὴ ζήτει — «не ищи более трудного, чем ты» (χαλεπός — тяжкий, трудный); слав. «вышших себе» — «высшего, чем ты», иное чтение, взято по паритету (передано 高いこと); ἰσχυρότερά σου μὴ ἐξέταζε — «не испытывай более сильного» (ἐξετάζω — допытываться). ru «чрез меру трудное» следует LXX."
  22: "ἃ προσετάγη σοι, ταῦτα διανοοῦ — «что заповедано тебе, о том размышляй» (διανοέομαι); οὐ γάρ ἐστίν σοι χρεία τῶν κρυπτῶν — «ибо нет тебе нужды в сокрытом» (χρεία — нужда; κρυπτά — сокрытое)."
  23: "ἐν τοῖς περισσοῖς τῶν ἔργων σου μὴ περιεργάζου — «в излишествах дел твоих не любопытствуй» (περιεργάζομαι — вмешиваться, любопытствовать); πλείονα ... ὑπεδείχθη σοι — «большее показано тебе» (ὑποδείκνυμι), т. е. свыше человеческого разумения."
  24: "πολλοὺς ἐπλάνησεν ἡ ὑπόλημψις αὐτῶν — «многих ввело в заблуждение их предположение» (ὑπόλημψις, πλανάω); ὑπόνοια πονηρὰ ὠλίσθησεν διανοίας αὐτῶν — «злое подозрение заставило поскользнуться их мысли» (ὑπόνοια, ὀλισθάνω — скользить, оступаться); слав. «погуби» — «погубило», иное, взято по паритету (передано 滅ぼした)."
  25: "В gr-lxx-byz на месте стиха стоит «.» — дефект модуля. Переведено по csl-ru: «И любяй бедство впадет в не» — «любящий бедствие впадёт в него» (бедство — бедствие, опасность). 〔…〕 не ставится. Слав. 3:25 вместе с 3:26 покрывает gr 3:26, где деление иное; см. notes 26."
  26: "καρδία σκληρὰ κακωθήσεται ἐπ᾽ ἐσχάτων — «жёсткое сердце повредится в последних» (κακόω — повреждать, озлоблять); ὁ ἀγαπῶν κίνδυνον ἐν αὐτῷ ἀπολεῖται — «любящий опасность в ней погибнет» (κίνδυνος — опасность). В csl вторая половина стоит уже в 3:25 («любяй бедство впадет в не»), поэтому в переводе по гр она повторена; наложение отмечено."
  27: "καρδία σκληρὰ βαρυνθήσεται πόνοις — «жёсткое сердце отяготится болезнями» (βαρύνω — отягощать; πόνος — труд, боль), слав. «болезньми»; ὁ ἁμαρτωλὸς προσθήσει ἁμαρτίαν ἐφ᾽ ἁμαρτίαις — «грешник приложит грех к грехам»."
  28: "ἐπαγωγῇ ὑπερηφάνου οὐκ ἔστιν ἴασις — «при наведении гордого нет исцеления» (ἐπαγωγή, ἴασις; ὑπερήφανος — гордый); φυτὸν πονηρίας ἐρρίζωκεν ἐν αὐτῷ — «растение злобы укоренилось в нём» (φυτόν — растение; ῥιζόω — укоренять); слав. «сад бо лукавствия»."
  29: "καρδία συνετοῦ διανοηθήσεται παραβολήν — «сердце разумного уразумеет притчу» (συνετός — разумный; παραβολή — притча); οὖς ἀκροατοῦ ἐπιθυμία σοφοῦ — «ухо слушателя — желание мудрого» (ἀκροατής — слушатель; ἐπιθυμία — желание), т. е. мудрый желает внимающего слушателя."
  30: "πῦρ φλογιζόμενον ἀποσβέσει ὕδωρ — «пламенеющий огонь угасит вода» (φλογίζω, ἀποσβέννυμι); ἐλεημοσύνη ἐξιλάσεται ἁμαρτίας — «милостыня умилостивит грехи» (ἐξιλάσκομαι), передано 償う. Параллель с 3:3 и 3:14."
  31: "ὁ ἀνταποδιδοὺς χάριτας — «воздающий благодеяния (благодарность)» (χάρις); μέμνηται εἰς τὰ μετὰ ταῦτα — «помнит о том, что после сего» (μέμνημαι), т. е. о будущем; ἐν καιρῷ πτώσεως αὐτοῦ εὑρήσει στήριγμα — «во время падения своего найдёт утверждение» (στήριγμα — опора, утверждение)."
