# jp-box, Сирах, глава 3. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для книги нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 3: почитание отца и матери (1–16); кротость и смирение (17–20); не испытывать
# сокрытого (21–24); жёсткое сердце и гордость (25–28); разум и милостыня (29–31).
# Прямой речи нет; всё — авторское поучение, без кавычек. Красного и синего нет.
# Нумерация по gr: 31 стих, столько же у csl и ru. Дефекты модуля: 3:19 и 3:25 стоят
# как «.»; переведены по csl-ru (единственный свидетель) без 〔…〕, отмечено в notes.
# В 3:25–26 слав. делит иначе: csl 3:25 («любяй бедство впадет в не») + csl 3:26
# («сердце жестоко озлобится на последок») вместе покрывают gr 3:26; наш 3:25 взят
# по csl 3:25, наш 3:26 — по gr целиком, наложение отмечено.
# Слав. добавления внесены в основной текст без скобок: 3:7 «боящийся Господа почтит
# отца», 3:8 «и мать», «от них» — в LXX их нет (см. notes).
# 〔…〕 нет. Сносок ⟨…⟩ нет: 柔和, 施し, 律法, 裁き уже в корпусе.
# Имён и топонимов в главе нет.

