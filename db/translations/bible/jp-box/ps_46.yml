# jp-box, Псалтирь, псалом 46. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный 常体, без 文語.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0.
# Псалом 46: призыв к рукоплесканию (1–2), покорение народов (3–4),
# восшествие Бога с трубным гласом (5–6), пойте разумно (7), Бог — Царь земли (8–9).
# Красного и синего нет. Кавычек нет: прямой речи в псалме нет.
# 〔…〕 нет: все слова в gr-lxx-byz есть (проверено tmp/bracket_check.rb).
# セラ (διάψαλμα, в конце ст. 4) не передаётся — по решению пользователя, как у jp-joc.
# Сносок ⟨…⟩ нет: ラッパ, 王座, アブラハム уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: ps
chapter: 46
draft: true

verses:
  0: "指揮者[しきしゃ]に。コラの子[こ]らの詩[うた]。"
  1: "すべての民[たみ]よ、手[て]を打[う]て。喜[よろこ]びの声[こえ]を上[あ]げて神[かみ]に叫[さけ]べ。"
  2: "いと高[たか]き主[しゅ]は畏[おそ]るべき方[かた]、全[ぜん]地[ち]を治[おさ]める大[だい]いなる王[おう]である。"
  3: "主[しゅ]はもろもろの民[たみ]をわたしたちに従[したが]わせ、諸国[しょこく]の民[たみ]をわたしたちの足[あし]もとに置[お]かれた。"
  4: "主[しゅ]はわたしたちのために、ご自分[じぶん]の受[う]け継[つ]ぎ、すなわち主[しゅ]が愛[あい]されたヤコブの美[うつく]しさを選[えら]ばれた。"
  5: "神[かみ]は叫[さけ]び声[ごえ]とともに上[のぼ]り、主[しゅ]はラッパの音[ね]とともに上[のぼ]られた。"
  6: "わたしたちの神[かみ]に歌[うた]え、歌[うた]え。わたしたちの王[おう]に歌[うた]え、歌[うた]え。"
  7: "神[かみ]は全[ぜん]地[ち]の王[おう]である。悟[さと]りをもって歌[うた]え。"
  8: "神[かみ]は諸国[しょこく]の民[たみ]の上[うえ]に王[おう]として治[おさ]め、神[かみ]はその聖[せい]なる王座[おうざ]に座[すわ]られる。"
  9: "もろもろの民[たみ]の支配者[しはいしゃ]たちは、アブラハムの神[かみ]のもとに集[つど]った。地[ち]の力[ちから]ある者[もの]たちは神[かみ]に属[ぞく]する。神[かみ]ははるかに高[たか]く上[あ]げられた。"

notes:
  0: "Εἰς τὸ τέλος· ὑπὲρ τῶν υἱῶν Κορε ψαλμός — 指揮者に。コラの子らの詩 (ψαλμός — 詩). Надписание — стих 0, скобками не маркируется; нумерация LXX, как в русской базе."
  1: "Πάντα τὰ ἔθνη, κροτήσατε χεῖρας — すべての民よ、手を打て (κροτέω — «ударять, рукоплескать»). ἀλαλάξατε τῷ θεῷ ἐν φωνῇ ἀγαλλιάσεως — 喜びの声を上げて神に叫べ (ἀλαλάζω — «издавать боевой клич, ликовать»; φωνὴ ἀγαλλιάσεως — «голос радости»)."
  2: "ὅτι κύριος ὕψιστος φοβερός — いと高き主は畏るべき方 (ὕψιστος — いと高き; φοβερός — «страшный, внушающий благоговение»). βασιλεὺς μέγας ἐπὶ πᾶσαν τὴν γῆν — 全地を治める大いなる王 (βασιλεὺς μέγας — «великий царь»)."
  3: "ὑπέταξεν λαοὺς ἡμῖν — 主はもろもろの民をわたしたちに従わせ (ὑποτάσσω — «покорять»). ἔθνη ὑπὸ τοὺς πόδας ἡμῶν — 諸国の民をわたしたちの足もとに置かれた (образ победного подножия)."
  4: "ἐξελέξατο ἡμῖν τὴν κληρονομίαν αὐτοῦ — 主はわたしたちのために、ご自分の受け継ぎを…選ばれた (ἐκλέγομαι — «избирать»; κληρονομία — 受け継ぎ, как в Пс 2:8). τὴν καλλονὴν Ιακωβ, ἣν ἠγάπησεν — すなわち主が愛されたヤコブの美しさ (καλλονή — «красота, краса»). διάψαλμα не передаётся."
  5: "ἀνέβη ὁ θεὸς ἐν ἀλαλαγμῷ — 神は叫び声とともに上り (ἀναβαίνω — «восходить»; образ восшествия на престол). κύριος ἐν φωνῇ σάλπιγγος — 主はラッパの音とともに上られた (σάλπιγξ — ラッパ, как по всему корпусу)."
  6: "ψάλατε τῷ θεῷ ἡμῶν, ψάλατε, ψάλατε τῷ βασιλεῖ ἡμῶν, ψάλατε — わたしたちの神に歌え、歌え。わたしたちの王に歌え、歌え (четыре ψάλατε сохранены; повтор — не заикание, а припев)."
  7: "ὅτι βασιλεὺς πάσης τῆς γῆς ὁ θεός — 神は全地の王である. ψάλατε συνετῶς — 悟りをもって歌え (συνετῶς — «разумно, с пониманием»; ср. «разумно» в Синодальном)."
  8: "ἐβασίλευσεν ὁ θεὸς ἐπὶ τὰ ἔθνη — 神は諸国の民の上に王として治め (βασιλεύω — «царствовать»). ὁ θεὸς κάθηται ἐπὶ θρόνου ἁγίου αὐτοῦ — 神はその聖なる王座に座られる (θρόνος ἅγιος — 聖なる王座)."
  9: "ἄρχοντες λαῶν συνήχθησαν μετὰ τοῦ θεοῦ Αβρααμ — もろもろの民の支配者たちは、アブラハムの神のもとに集った (συνάγω — «собирать»; μετὰ τοῦ θεοῦ — «к Богу», поэтому のもとに). τοῦ θεοῦ οἱ κραταιοὶ τῆς γῆς — 地の力ある者たちは神に属する (κραταιοί — «сильные»). σφόδρα ἐπήρθησαν — 神ははるかに高く上げられた (в греч. мн. ч. «они превознесены»; подлежащее двусмысленно — «сильные» или Бог; по jp-joc и по смыслу отнесено к Богу, отмечено в notes)."
