# jp-box, Исход, глава 39. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — csl-ru (jp-joc в гл. 39 нет).
# Русский Синодальный — только для понимания. Язык — современный 常体.
# Нумерация LXX: эта глава соответствует евр. 38:21–31 и 39:32–43 — счёт золота,
# серебра и меди, затем принесение всего сделанного Моисею и благословение.
# Глава 39: золото (1), серебро и выкуп по полсиклю (2–5), медь (6–9),
# исполнение по слову Господню (10), остатки на сосуды и одежды (11–12),
# принесение скинии и утвари (13–21), благословение Моисея (22–23).
# Красного и синего нет: речь Бога — в 「…」, «<j>» не ставится.
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено по базе).
# ВАЖНО: в 39:6 gr-lxx-byz даёт «χίλιοι πεντακόσιοι» (1500 сиклей меди), а csl-ru —
# 2400 сикелей (масоретское чтение). Переводим по гр.; расхождение — в notes.
# Сносок ⟨…⟩ нет: タラント и シケル — меры, названные в тексте; 祭司, 幕屋 — из гл. 25–30.

