verses:
  1: "聖[せい]なるもののためのすべての仕事[しごと]に用[もち]いられた金[きん]は、献[ささ]げ物[もの]の金[きん]で、聖[せい]なるシケルで二十九[にじゅうきゅう]タラント、七百二十[ななひゃくにじゅう]シケルであった。"
  2: "集会[しゅうかい]の数[かぞ]えられた男[おとこ]たちからささげられた銀[ぎん]は、百[ひゃく]タラント、千七百七十五[せんななひゃくななじゅうご]シケルであった。"
  3: "一[ひと]人[り]につき一[いち]ドラクマ、聖[せい]なるシケルで半[はん]シケルである。二十[にじゅう]歳[さい]以上[いじょう]で数[かぞ]えに加[くわ]わった者[もの]は、六十万[ろくじゅうまん]三千五百五十[さんぜんごひゃくごじゅう]人[にん]であった。"
  4: "銀[ぎん]百[ひゃく]タラントは、幕屋[まくや]の百[ひゃく]の柱[はしら]の頭[かしら]と垂[た]れ幕[まく]の柱[はしら]の頭[かしら]を鋳[い]るために用[もち]いられ、百[ひゃく]タラントで百[ひゃく]の柱[はしら]の頭[かしら]、すなわち柱[はしら]の頭[かしら]一[ひと]つにつき一[いち]タラントであった。"
  5: "千七百七十五[せんななひゃくななじゅうご]シケルは、柱[はしら]の鉤[かぎ]を造[つく]るために用[もち]い、柱[はしら]の頭[かしら]に金[きん]をかぶせ、これを飾[かざ]った。"
  6: "献[ささ]げ物[もの]の青銅[せいどう]は、七十[ななじゅう]タラントと千五百[せんごひゃく]シケルであった。"
  7: "この青銅[せいどう]から、証[あかし]の幕屋[まくや]の入口[いりぐち]の台座[だいざ]を造[つく]り、"
  8: "庭[にわ]の周[まわ]りの台座[だいざ]、庭[にわ]の門[もん]の台座[だいざ]、幕屋[まくや]の杭[くい]、庭[にわ]の周[まわ]りの杭[くい]、"
  9: "祭壇[さいだん]の青銅[せいどう]の火床[どこ]、祭壇[さいだん]のすべての器[うつわ]、証[あかし]の幕屋[まくや]のすべての道具[どうぐ]を造[つく]った。"
  10: "イスラエルの子[こ]らは、主[しゅ]がモーセに命[めい]じたとおりに行[おこな]い、そのとおりにした。"
  11: "献[ささ]げ物[もの]の金[きん]の残[のこ]りからは、主[しゅ]の前[まえ]で務[つと]めをするための器[うつわ]を造[つく]った。"
  12: "また、残[のこ]った青[あお]、紫[むらさき]、緋[ひ]で、アロンが聖所[せいしょ]で務[つと]めをするための務[つと]めの衣服[いふく]を造[つく]った。"
  13: "彼[かれ]らは衣服[いふく]をモーセのもとへ持[も]って来[き]た。すなわち幕屋[まくや]とその器[うつわ]、その台座[だいざ]、その担[にな]い棒[ぼう]、その柱[はしら]、"
  14: "契約[けいやく]の箱[はこ]とその担[にな]い棒[ぼう]、"
  15: "祭壇[さいだん]とそのすべての器[うつわ]、"
  16: "聖[せい]なる油[あぶら]と香[こう]の調[ととの]え物[もの]、純[じゅん]な燭台[しょくだい]、"
  17: "その灯[ともしび]、すなわちともす灯[ともしび]と、光[ひかり]のための油[あぶら]、"
  18: "供[そな]えのパンのための机[つくえ]とそのすべての器[うつわ]、供[そな]えのパン[ぱん]、"
  19: "聖[せい]なる衣服[いふく]、すなわちアロンのもの、およびその子[こ]らが祭司[さいし]の務[つと]めに着[き]る衣服[いふく]、"
  20: "庭[にわ]の幕[まく]と柱[はしら]、幕屋[まくや]の入口[いりぐち]の垂[た]れ幕[まく]、庭[にわ]の門[もん]の垂[た]れ幕[まく]、"
  21: "幕屋[まくや]のすべての器[うつわ]とそのすべての道具[どうぐ]、赤[あか]く染[そ]めた雄羊[おひつじ]の皮[かわ]、青[あお]い皮[かわ]の覆[おお]い、そのほかの覆[おお]い、杭[くい]、および証[あかし]の幕屋[まくや]の仕事[しごと]のためのすべての道具[どうぐ]、"
  22: "主[しゅ]がモーセに命[めい]じたすべてを、イスラエルの子[こ]らはそのとおりに行[おこな]い、すべての備[そな]えを整[ととの]えた。"
  23: "モーセはすべての仕事[しごと]を見[み]た。すると、彼[かれ]らは主[しゅ]がモーセに命[めい]じたとおりに行[おこな]っていた。そのとおりに行[おこな]っていたので、モーセは彼[かれ]らを祝福[しゅくふく]した。"

notes:
  1: "Πᾶν τὸ χρυσίον… κατὰ πᾶσαν τὴν ἐργασίαν τῶν ἁγίων — всё золото на всякую работу святыни. χρυσίου τοῦ τῆς ἀπαρχῆς — 献げ物の金 (золото приношения). κατὰ τὸν σίκλον τὸν ἅγιον — 聖なるシケルで (по священному сиклю; σίκλος — シケル). Двадцать девять талантов и 720 сиклей."
  2: "ἀργυρίου ἀφαίρεμα — 銀の献げ物 (серебро приношения). παρὰ τῶν ἐπεσκεμμένων ἀνδρῶν τῆς συναγωγῆς — от исчисленных мужей собрания. Сто талантов и 1775 сиклей."
  3: "δραχμὴ μία τῇ κεφαλῇ — 一人につき一ドラクマ (по одной драхме с головы). τὸ ἥμισυ τοῦ σίκλου — 半シケル. ἀπὸ εἰκοσαετοῦς καὶ ἐπάνω — от двадцати лет и выше. ἑξήκοντα μυριάδας — 六十万 (букв. «шестьдесят мириад»); всего 603 550."
  4: "εἰς τὴν χώνευσιν τῶν ἑκατὸν κεφαλίδων — 百の柱の頭を鋳るために. κεφαλίς — 柱の頭 (капитель). τάλαντον τῇ κεφαλίδι — 柱の頭一つにつき一タラント."
  5: "τοὺς χιλίους ἑπτακοσίους ἑβδομήκοντα πέντε σίκλους — 1775 сиклей. εἰς τὰς ἀγκύλας τοῖς στύλοις — 柱の鉤に. κατεχρύσωσεν — 金をかぶせた."
  6: "ὁ χαλκὸς τοῦ ἀφαιρέματος — 献げ物の青銅. ἑβδομήκοντα τάλαντα καὶ χίλιοι πεντακόσιοι σίγλοι — 七十タラントと千五百シケル. В csl-ru здесь 2400 сиклей — масоретское чтение (Числ 7:85?), в LXX 1500."
  7: "τὰς βάσεις τῆς θύρας τῆς σκηνῆς τοῦ μαρτυρίου — 証の幕屋の入口の台座 (подножия у входа)."
  8: "τὰς βάσεις τῆς αὐλῆς κύκλῳ — 庭の周りの台座. πάσσαλοι — 杭."
  9: "τὸ παράθεμα τὸ χαλκοῦν — 青銅の火床 (решётка жертвенника; ср. 27:4). ἐργαλεῖα — 道具 (орудия)."
  10: "καθὰ συνέταξεν κύριος τῷ Μωυσῇ — 主がモーセに命じたとおり. οὕτως ἐποίησαν — так и сделали (формула послушания)."
  11: "τὸ λοιπὸν χρυσίον τοῦ ἀφαιρέματος — 献げ物の金の残り. σκεύη εἰς τὸ λειτουργεῖν — 務めをするための器."
  12: "τὴν καταλειφθεῖσαν ὑάκινθον καὶ πορφύραν καὶ τὸ κόκκινον — 残った青、紫、緋. στολὰς λειτουργικάς — 務めの衣服 (служебные одежды). ἐν τῷ ἁγίῳ — 聖所で."
  13: "ἤνεγκαν — принесли. βάσεις — 台座, μοχλοί — 担い棒, στῦλοι — 柱. Далее перечень утвари до 21."
  14: "κιβωτὸν τῆς διαθήκης — 契約の箱 (единственное место в главе с διαθήκη; ср. 38:1)."
  15: "θυσιαστήριον — 祭壇 (здесь, видимо, жертвенник курения; ср. 40:5)."
  16: "ἔλαιον τῆς χρίσεως — 聖なる油. θυμίαμα τῆς συνθέσεως — 香の調え物. λυχνία ἡ καθαρά — 純な燭台."
  17: "λύχνους τῆς καύσεως — ともす灯 (лампады для горения). ἔλαιον τοῦ φωτός — 光のための油."
  18: "τράπεζα τῆς προθέσεως — 供えのパンのための机 (стол предложения). ἄρτοι οἱ προκείμενοι — 供えのパン."
  19: "στολαὶ τοῦ ἁγίου — 聖なる衣服. εἰς τὴν ἱερατείαν — 祭司の務めに (для священства)."
  20: "ἱστία τῆς αὐλῆς — 庭の幕. καταπέτασμα — 垂れ幕. πύλη — 門."
  21: "διφθέραι δέρματα κριῶν ἠρυθροδανωμένα — 赤く染めた雄羊の皮. καλύμματα δέρματα ὑακίνθινα — 青い皮の覆い. ἐπικαλύμματα — 覆い. παράσσαλοι — 杭."
  22: "πᾶσαν τὴν ἀποσκευήν — すべての備え (всё снаряжение, устроение)."
  23: "καὶ ἦσαν πεποιηκότες — и они сделали (плюсквамперфект: к тому времени уже сделали). ὃν τρόπον συνέταξεν — каким образом заповедал. εὐλόγησεν αὐτούς — 彼らを祝福した."
