# jp-box, Евангелие от Марка, глава 15. Переписано по новому конвейеру.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# jp-ni не использовался.
#
# Глава Распятия: суд у Пилата (1–15), поругание (16–20), путь на Голгофу (21–22),
# распятие и смерть (23–37), знамения (38–39), жёны и погребение (40–47).
# Слова Христа — в <j>…</j> (2, 34); слова Пилата, первосвященников, толпы,
# разбойников, сотника — вне тегов. 15:28 — стих, которого нет в критическом
# тексте, целиком в 〔…〕.

