verses:
  1: "夜[よ]が明[あ]けるとすぐ、祭司長[さいしちょう]たちは長老[ちょうろう]たち、律法学者[りっぽうがくしゃ]たち、また最高法院[さいこうほういん]の全員[ぜんいん]と協議[きょうぎ]し、イエスを縛[しば]って連[つ]れ出[だ]し、ピラトに引[ひ]き渡[わた]した。"
  2: "ピラトはイエスに問[と]いただした。「お前[まえ]はユダヤ人[じん]の王[おう]なのか。」イエスはお答[こた]えになった。「<j>あなたが言[い]っているとおりだ。</j>」"
  3: "祭司長[さいしちょう]たちは、あれこれとイエスを訴[うった]えた。"
  4: "ピラトは再[ふたた]びイエスに問[と]いて言[い]った。「何[なに]も答[こた]えないのか。見[み]よ、どれほど多[おお]くのことをお前[まえ]に訴[うった]えていることか。」"
  5: "しかし、イエスはもう何[なに]もお答[こた]えにならなかった。ピラトはそれを不思議[ふしぎ]に思[おも]った。"
  6: "祭[まつ]りごとに、ピラトは群衆[ぐんしゅう]が求[もと]める囚人[しゅうじん]を一人[ひとり]だけ釈放[しゃくほう]していた。"
  7: "そのころ、バラバという名[な]の者[もの]が、暴動[ぼうどう]のとき人[ひと]を殺[ころ]した者[もの]たちとともに縛[しば]られ、牢[ろう]につながれていた。"
  8: "群衆[ぐんしゅう]は押[お]しかけて来[き]て、いつもどおりにしてくれるようピラトに求[もと]め始[はじ]めた。"
  9: "ピラトは答[こた]えて言[い]った。「お前[まえ]たちは、ユダヤ人[じん]の王[おう]を釈放[しゃくほう]してほしいのか。」"
  10: "祭司長[さいしちょう]たちがイエスを引[ひ]き渡[わた]したのはねたみのせいだと、ピラトは見抜[みぬ]いていたのである。"
  11: "しかし、祭司長[さいしちょう]たちは群衆[ぐんしゅう]を煽[あお]って、むしろバラバの方[ほう]を釈放[しゃくほう]させるように仕向[しむ]けた。"
  12: "ピラトは再[ふたた]び答[こた]えて言[い]った。「では、お前[まえ]たちがユダヤ人[じん]の王[おう]と呼[よ]ぶあの男[おとこ]を、どうしてほしいのか。」"
  13: "彼[かれ]らはまた叫[さけ]んだ。「十字架[じゅうじか]につけよ。」"
  14: "ピラトは言[い]った。「彼[かれ]がどんな悪[わる]いことをしたというのか。」しかし、彼[かれ]らはますます激[はげ]しく叫[さけ]んだ。「十字架[じゅうじか]につけよ。」"
  15: "ピラトは群衆[ぐんしゅう]の願[ねが]いをかなえようとして、バラバを釈放[しゃくほう]し、イエスを鞭打[むちう]ってから、十字架[じゅうじか]につけるために引[ひ]き渡[わた]した。"
  16: "兵士[へいし]たちはイエスを総督官邸[そうとくかんてい]の内庭[うちにわ]へ連[つ]れて行[い]き、部隊[ぶたい]の全員[ぜんいん]を集[あつ]めた。"
  17: "そして、イエスに紫[むらさき]の衣[ころも]を着[き]せ、茨[いばら]で編[あ]んだ冠[かんむり]をかぶらせた。"
  18: "兵士[へいし]たちはイエスに敬礼[けいれい]して言[い]った。「ユダヤ人[じん]の王[おう]、万歳[ばんざい]。」"
  19: "また、葦[あし]の棒[ぼう]でその頭[あたま]を打[う]ち、唾[つば]をかけ、ひざまずいてイエスを拝[おが]んだ。"
  20: "さんざん嘲[あざけ]り終[お]えると、兵士[へいし]たちは紫[むらさき]の衣[ころも]を脱[ぬ]がせて元[もと]の服[ふく]を着[き]せ、十字架[じゅうじか]につけるためにイエスを連[つ]れ出[だ]した。"
  21: "彼[かれ]らは、畑[はたけ]から帰[かえ]って来[く]る途中[とちゅう]のクレネ人[じん]シモン、すなわちアレクサンドロとルフォの父[ちち]に、イエスの十字架[じゅうじか]を無理[むり]に負[お]わせた。"
  22: "彼[かれ]らはイエスをゴルゴタ⟨アラム語[ご]で「されこうべ」の意[い]。⟩、すなわち「されこうべの場所[ばしょ]」と呼[よ]ばれる所[ところ]へ連[つ]れて行[い]った。"
  23: "そして、没薬[もつやく]を混[ま]ぜたぶどう酒[さけ]をイエスに飲[の]ませようとしたが、イエスはお受[う]けにならなかった。"
  24: "彼[かれ]らはイエスを十字架[じゅうじか]につけ、その衣[ころも]を分[わ]けた。だれが何[なに]を手[て]に入[い]れるか、くじを引[ひ]いて決[き]めたのである。"
  25: "イエスを十字架[じゅうじか]につけたのは、第三時[だいさんじ]のころであった。"
  26: "罪状[ざいじょう]の書[か]きには、「ユダヤ人[じん]の王[おう]」とあった。"
  27: "彼[かれ]らはまた、二人[ふたり]の強盗[ごうとう]を、一人[ひとり]はイエスの右[みぎ]、一人[ひとり]は左[ひだり]に、イエスと一緒[いっしょ]に十字架[じゅうじか]につけた。"
  28: "〔こうして、『彼[かれ]は罪人[ざいにん]の仲間[なかま]に数[かぞ]えられた』と書[か]いてある聖書[せいしょ]の言葉[ことば]が成就[じょうじゅ]した。〕"
  29: "通りかかった者[もの]たちは頭[あたま]を振[ふ]りながら、イエスをののしって言[い]った。「おお、神殿[しんでん]を壊[こわ]して三日[みっか]で建[た]てる者[もの]よ、"
  30: "自分[じぶん]を救[すく]って、十字架[じゅうじか]から降[お]りて来[こ]い。」"
  31: "同じように、祭司長[さいしちょう]たちも律法学者[りっぽうがくしゃ]たちとともに嘲[あざけ]りながら、互[たが]いに言[い]った。「他人[たにん]は救[すく]ったが、自分[じぶん]は救[すく]えない。"
  32: "キリスト、イスラエルの王[おう]よ、今[いま]すぐ十字架[じゅうじか]から降[お]りて来[こ]い。わたしたちが見[み]て信[しん]じるためだ。」イエスと一緒[いっしょ]に十字架[じゅうじか]につけられた者[もの]たちも、イエスをののしった。"
  33: "第六時[だいろくじ]になると、地[ち]は全土[ぜんど]にわたって暗[くら]くなり、第九時[だいきゅうじ]までそのままであった。"
  34: "第九時[だいきゅうじ]になると、イエスは大声[おおごえ]を上[あ]げて、「<j>エロイ、エロイ、レマ、サバクタニ。</j>」と叫[さけ]ばれた。これは、「わが神[かみ]、わが神[かみ]、なぜわたしをお見捨[みす]てになったのか」という意味[いみ]である。"
  35: "そばに立[た]っていた者[もの]たちのうち、何人[なんにん]かはそれを聞[き]いて言[い]った。「見[み]よ、エリヤを呼[よ]んでいる。」"
  36: "すると、一人[ひとり]が走[はし]って行[い]き、海綿[かいめん]に酸[す]いぶどう酒[さけ]を含[ふく]ませて葦[あし]の棒[ぼう]につけ、イエスに飲[の]ませようとして言[い]った。「そのままにしておけ。エリヤが来[き]て、この人[ひと]を下[お]ろすかどうか見[み]よう。」"
  37: "イエスは大声[おおごえ]を張[は]り上[あ]げて息[いき]を引[ひ]き取[と]られた。"
  38: "そのとき、神殿[しんでん]の幕[まく]が上[うえ]から下[した]まで真[ま]っ二[ぷた]つに引[ひ]き裂[さ]かれた。"
  39: "イエスの正面[しょうめん]に立[た]っていた百人隊長[ひゃくにんたいちょう]は、イエスがこのように息[いき]を引[ひ]き取[と]られたのを見[み]て言[い]った。「本当[ほんとう]に、この人[ひと]は神[かみ]の子[こ]であった。」"
  40: "遠[とお]くから見[み]ていた婦人[ふじん]たちもいた。その中[なか]には、マグダラのマリア、小[しょう]ヤコブとヨセの母[はは]マリア、そしてサロメがいた。"
  41: "この婦人[ふじん]たちは、イエスがガリラヤにおられたときにも従[したが]って仕[つか]えていた者[もの]たちであり、ほかにも、イエスと一緒[いっしょ]にエルサレムへ上[のぼ]って来[き]た多[おお]くの婦人[ふじん]たちがいた。"
  42: "すでに夕方[ゆうがた]になっていた。その日[ひ]は準備[じゅんび]の日[ひ]、すなわち安息日[あんそくび]の前日[ぜんじつ]であった。"
  43: "そこへ、アリマタヤのヨセフが来[き]た。最高法院[さいこうほういん]の議員[ぎいん]で、人々[ひとびと]から尊敬[そんけい]され、神[かみ]の国[くに]を待[ま]ち望[のぞ]んでいた者[もの]である。彼[かれ]は勇気[ゆうき]を出[だ]してピラトのもとへ入[はい]り、イエスの遺体[いたい]を求[もと]めた。"
  44: "ピラトは、イエスがもう死[し]んだのかと驚[おどろ]き、百人隊長[ひゃくにんたいちょう]を呼[よ]んで、死[し]んでから久[ひさ]しいのかと尋[たず]ねた。"
  45: "百人隊長[ひゃくにんたいちょう]からそのことを確[たし]かめると、ピラトは遺体[いたい]をヨセフに渡[わた]した。"
  46: "ヨセフは亜麻布[あまぬの]を買[か]い、イエスを降[お]ろしてその布[ぬの]に包[つつ]み、岩[いわ]を掘[ほ]って造[つく]った墓[はか]の中[なか]に納[おさ]め、墓[はか]の入[い]り口[ぐち]に大[おお]きな石[いし]を転[ころ]がしてふさいだ。"
  47: "マグダラのマリアとヨセの母[はは]マリアは、イエスがどこに納[おさ]められたかを見[み]ていた。"

notes:
  1: "συμβούλιον ποιήσαντες — «устроив совещание»; у Марка, в отличие от Мф 27:1, названы и γραμματεῖς, и ὅλον τὸ συνέδριον (最高法院). δήσαντες — «связав»."
  2: "Σὺ λέγεις — «ты говоришь»; あなたが言っているとおりだ, как в Мф 27:11 (там です). Слова Христа красные; вопрос Пилата — нет. βασιλεὺς τῶν Ἰουδαίων — ユダヤ人の王, не «Израиля»."
  5: "οὐκέτι οὐδὲν ἀπεκρίθη — «уже ничего не отвечал»; ὥστε θαυμάζειν — «так что (Пилат) удивлялся»; 不思議に思った."
  6: "κατὰ ἑορτήν — «на праздник» (Пасхи); ἀπέλυεν — имперфект, «имел обыкновение отпускать»; παρῃτοῦντο — «просили»."
  7: "στασιασταί — «мятежники, участники восстания»; 暴動のとき人を殺した者たち. δεδεμένος — «связанный»; 縛られ、牢につながれていた."
  10: "διὰ φθόνον — «из зависти»; ねたみのせいだと…見ていた — причина названа евангелистом, а не Пилатом; строй изменён, чтобы не совпадать с jp-ni."
  11: "ἀνέσεισαν — «возбудили, подстрекнули»; 煽って. μᾶλλον — «скорее»; むしろ."
  15: "τὸ ἱκανὸν ποιῆσαι — «удовлетворить (толпу)»; 願いをかなえようとして. φραγελλώσας — «бичевав»; 鞭打ってから."
  16: "πραιτώριον — 総督官邸 (как в Мф 27:27); σπεῖρα — 部隊, когорта."
  17: "πορφύρα — «порфира», багряница; 紫の衣. У Матфея 27:28 иначе — χλαμὺς κοκκίνη, 緋色の外套; различие сохранено. ἀκάνθινος στέφανος — 茨の冠."
  18: "Χαῖρε — приветствие «радуйся», здесь издевательское; 万歳, как в Мф 27:29. Слова воинов — не красные."
  21: "ἀγγαρεύουσιν — «принудили» (повинность); 無理に負わせた. τὸν πατέρα Ἀλεξάνδρου καὶ Ῥούφου — アレクサンドロとルフォの父; у Матфея 27:32 имён нет."
  22: "Γολγοθᾶ — арамейское название; Марк сам переводит его (Κρανίου Τόπος), поэтому пояснение и в тексте, и в сноске (сноска — о языке)."
  23: "σμύρνα — «смирна»; 没薬. У Матфея 27:34 иное вещество — χολή, 胆汁; различие сохранено. οὐκ ἔλαβεν — «не взял»; お受けにならなかった."
  24: "διαμερίζονται — «делят»; βάλλοντες κλῆρον — «бросая жребий»; くじを引いて決めた. В византийском тексте здесь нет цитаты Пс 21:19 — не добавляю."
  25: "ὥρα τρίτη — третий час (ок. 9 утра); 第三時, как у jp-joc. У Матфея 27:45 счёт иной (十二時…三時), поэтому в Марке оставлен церковный счёт часов."
  27: "λῃσταί — «разбойники»; 強盗."
  28: "В критическом издании стиха нет; Церковь читает (Ис 53:12) — весь стих в 〔…〕, цитата внутри в 『』."
  29: "ἐβλασφήμουν — «хулили, поносили»; ののしって. κινοῦντες τὰς κεφαλάς — «кивая головами» (Пс 21:8); 頭を振りながら. Речь проходящих начинается здесь и продолжается в 15:30."
  30: "σῶσον σεαυτόν — «спаси себя»; 自分を救って. καταβάς — «сойдя»; 降りて来い."
  31: "ἐμπαίζοντες πρὸς ἀλλήλους — «издеваясь между собой»; 互いに. В византийском тексте только ἀρχιερεῖς и γραμματεῖς (без πρεσβύτεροι). Речь продолжается в 15:32."
  32: "ὁ Χριστὸς ὁ βασιλεὺς Ἰσραήλ — «Христос, Царь Израилев»; キリスト, не メシア (калька ハリストス). ἵνα ἴδωμεν καὶ πιστεύσωμεν — «чтобы увидели и уверовали»; 見て信じるためだ. οἱ συνεσταυρωμένοι — «распятые с Ним»; 一緒に十字架につけられた者たち."
  33: "ὥρα ἕκτη… ἐνάτη — шестой и девятый час (полдень и ок. 15 часов); 第六時…第九時, церковный счёт сохранён. ἐφ᾽ ὅλην τὴν γῆν — «по всей земле»; 全土にわたって."
  34: "Пс 21:2; арамейская форма Марка: Ελωι ελωι λεμα σαβαχθανι — エロイ、エロイ、レマ、サバクタニ (у Матфея 27:46 — エリ、エリ…, еврейская форма). Слова Христа красные; перевод — вне <j>."
  35: "Ἠλίαν φωνεῖ — «Илию зовёт»; созвучие с エロイ, непонятое стоявшими; エリヤを呼んでいる."
  36: "ἄφετε ἴδωμεν — «оставьте, посмотрим»; そのままにしておけ…見よう. εἰ ἔρχεται… καθελεῖν — «придёт ли снять Его»; 下ろすかどうか. У Матфея 27:49 иначе (やめろ)."
  37: "ἀφεὶς φωνὴν μεγάλην ἐξέπνευσεν — «издав громкий крик, испустил дух»; 大声を張り上げて息を引き取られた."
  38: "καταπέτασμα — завеса храма; 幕. εἰς δύο — «надвое»; 真っ二つに. ἀπ᾽ ἄνωθεν ἕως κάτω — 上から下まで."
  39: "κεντυρίων — 百人隊長 (у jp-joc архаичное 百夫長). υἱὸς θεοῦ ἦν — без артикля; 神の子であった, без сглаживания в определённое «Сын Божий». ἐξ ἐναντίας αὐτοῦ — «напротив Него»; 正面に立っていた."
  40: "ἡ Ἰακώβου τοῦ μικροῦ… μήτηρ — «мать Иакова меньшего»; 小ヤコブの母. У Матфея 27:56 — «мать Иакова и Иосии». Σαλώμη — サロメ (только у Марка)."
  41: "διηκόνουν — «служили»; 仕えていた. συναναβᾶσαι — «взошедшие вместе»; 一緒に上って来た."
  42: "παρασκευή — «приготовление (к субботе)», т. е. пятница; προσάββατον — «предсубботний день»; 準備の日、安息日の前日, без разъяснения в тексте."
  43: "εὐσχήμων βουλευτής — «уважаемый член совета»; 最高法院の議員で、人々から尊敬され. προσδεχόμενος τὴν βασιλείαν τοῦ θεοῦ — 神の国を待ち望んでいた. τολμήσας — «осмелившись»; 勇気を出して. ᾐτήσατο τὸ σῶμα — 遺体を求めた."
  44: "ἐθαύμασεν εἰ ἤδη τέθνηκεν — «удивился, не умер ли уже»; πάλαι ἀπέθανεν — «давно ли умер»; 死んで久しいのか."
  45: "ἐδωρήσατο — «подарил, отдал даром»; 渡した. πτῶμα — «тело, труп»; 遺体."
  46: "σινδών — «плащаница, полотно»; 亜麻布. λελατομημένον ἐκ πέτρας — «высеченный в скале»; 岩を掘って造った. προσεκύλισεν λίθον — «привалил камень»; 大きな石を転がしてふさいだ."
  47: "ἡ Μαρία ἡ Ἰωσῆτος — «Мария Иосиева (мать Иосии)»; ヨセの母マリア."
