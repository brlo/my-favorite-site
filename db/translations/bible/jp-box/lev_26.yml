chapter: 26
draft: true

verses:
  1: "「あなたがたは自分[じぶん]のために、手[て]で造[つく]ったものも、彫[ほ]り物[もの]も造ってはならない。石柱[せきちゅう]を立[た]ててはならない。あなたがたの地[ち]に石[いし]の像[ぞう]を置[お]いて、それを拝[おが]んではならない。わたしは主[しゅ]、あなたがたの神[かみ]である。"
  2: "わたしの安息日[あんそくび]を守[まも]りなさい。わたしの聖[せい]なるものに恐[おそ]れを抱[いだ]きなさい。わたしは主[しゅ]である。"
  3: "もし、あなたがたがわたしの定[さだ]めに従[したが]って歩[あゆ]み、わたしの戒[いまし]めを守[まも]って行[おこな]うなら、"
  4: "わたしはあなたがたに、その時[とき]に雨[あめ]を与[あた]え、地[ち]はその産物[さんぶつ]を出[だ]し、野[の]の木々[きぎ]はその実[み]を返[かえ]す。"
  5: "あなたがたの脱穀[だっこく]はぶどうの収穫[しゅうかく]に及[およ]び、ぶどうの収穫は種[たね]まきに及ぶ。あなたがたは満[み]ち足[た]りるまでパンを食[た]べ、あなたがたの地[ち]に安[あん]全[ぜん]に住[す]む。"
  6: "わたしはあなたがたの地[ち]に平和[へいわ]を与[あた]え、あなたがたは眠[ねむ]り、あなたがたを恐[おそ]れさせる者[もの]はいなくなる。わたしは悪[わる]い獣[けもの]をあなたがたの地から滅[ほろ]ぼし、戦[いくさ]はあなたがたの地を通[とお]り過[す]ぎない。"
  7: "あなたがたは敵[てき]を追[お]い払[はら]い、彼[かれ]らはあなたがたの前[まえ]で殺[ころ]されて倒[たお]れる。"
  8: "あなたがたの五人[ごにん]は百人[ひゃくにん]を追[お]い、あなたがたの百人は一万[いちまん]を追う。あなたがたの敵[てき]は剣[つるぎ]によってあなたがたの前[まえ]に倒[たお]れる。"
  9: "わたしはあなたがたに目[め]を留[と]め、あなたがたを育[やしな]い、増[ふ]やす。わたしはあなたがたとわたしの契約[けいやく]を立[た]てる。"
  10: "あなたがたは古[ふる]いものを食[た]べ、古いもののまた古いものを食べ、新[あたら]しいもののために古いものを捨[す]てる。"
  11: "わたしはあなたがたの中[なか]にわたしの契約[けいやく]を置[お]く。わたしの魂[たましい]はあなたがたを忌[い]み嫌[きら]わない。"
  12: "わたしはあなたがたの間[あいだ]を歩[あゆ]み、あなたがたの神[かみ]となり、あなたがたはわたしの民[たみ]となる。"
  13: "わたしは主[しゅ]、あなたがたの神[かみ]、あなたがたが奴隷[どれい]であったとき、あなたがたをエジプトの地[ち]から導[みちび]き出[だ]した者[もの]である。わたしはあなたがたのくびきの縄[なわ]を砕[くだ]き、あなたがたを堂々[どうどう]と導き出した。"
  14: "しかし、もしあなたがたがわたしに聞[き]き従[したが]わず、これらのわたしの定[さだ]めを行[おこな]わないなら、"
  15: "すなわち、あなたがたがそれらに従[したが]わず、わたしの裁[さば]きにあなたがたの魂[たましい]が嫌悪[けんお]を抱[いだ]き、わたしの戒[いまし]めをすべて行[おこな]わず、ついにはわたしの契約[けいやく]を破[やぶ]るに至[いた]るなら、"
  16: "わたしもまた、あなたがたにこうする。わたしはあなたがたの上[うえ]に、困窮[こんきゅう]と、皮膚[ひふ]の病[やまい]と、黄疸[おうだん]と、あなたがたの目[め]を損[そこ]ない、あなたがたの魂[たましい]を溶[と]かすものを臨[のぞ]ませる。あなたがたは種[たね]をむなしく蒔[ま]き、あなたがたの敵対者[てきたいしゃ]がそれを食[た]べる。"
  17: "わたしはあなたがたに顔[かお]を向[む]ける。あなたがたは敵[てき]の前[まえ]に倒[たお]れ、あなたがたを憎[にく]む者[もの]があなたがたを追[お]う。あなたがたは、だれも追わないのに逃[に]げる。"
  18: "もし、ここに至[いた]ってもなお、あなたがたがわたしに聞[き]き従[したが]わないなら、わたしはあなたがたの罪[つみ]のゆえに、さらに七倍[ななばい]にあなたがたを懲[こ]らしめる。"
  19: "わたしはあなたがたの傲慢[ごうまん]の勢[いきお]いを砕[くだ]き、あなたがたの天[てん]を鉄[てつ]のように、あなたがたの地[ち]を銅[どう]のようにする。"
  20: "あなたがたの力[ちから]はむなしく尽[つ]き、あなたがたの地[ち]はその種[たね]を与[あた]えず、あなたがたの野[の]の木[き]はその実[み]を与えない。"
  21: "もし、その後[あと]も、あなたがたがわたしに逆[さから]って歩[あゆ]み、わたしに聞[き]こうとしないなら、わたしはあなたがたの罪[つみ]に応[おう]じて、あなたがたに七[なな]つの災[わざわ]いを加[くわ]える。"
  22: "わたしはあなたがたに野[の]の獣[けもの]を送[おく]る。それはあなたがたを食[た]べ、あなたがたの家畜[かちく]を滅[ほろ]ぼし、あなたがたを少[すく]なくする。あなたがたの道[みち]は荒[あ]れ果[は]てる。"
  23: "もし、これらのことであなたがたが懲[こ]らしめられず、わたしに逆[さから]って歩[あゆ]むなら、"
  24: "わたしもまた、あなたがたに逆[さか]らう怒[いか]りをもって歩[あゆ]み、あなたがたの罪[つみ]のゆえに七倍[ななばい]にあなたがたを打[う]つ。"
  25: "わたしはあなたがたに、契約[けいやく]のための復讐[ふくしゅう]を行[おこな]う剣[つるぎ]を臨[のぞ]ませる。あなたがたが町々[まちまち]に逃[に]げ込[こ]んでも、わたしはあなたがたに死[し]を送[おく]り、あなたがたは敵[てき]の手[て]に渡[わた]される。"
  26: "わたしがパンの不足[ふそく]であなたがたを苦[くる]しめるとき、十人[じゅうにん]の女[おんな]が一[ひと]つの炉[かまど]であなたがたのパンを焼[や]き、あなたがたのパンを重[おも]さで量[はか]って返[かえ]す。あなたがたは食[た]べても、満[み]ち足[た]りない。"
  27: "もし、それでもなお、あなたがたがわたしに聞[き]き従[したが]わず、わたしに逆[さから]って歩[あゆ]むなら、"
  28: "わたし自身[じしん]もまた、あなたがたに逆[さか]らう怒[いか]りをもって歩[あゆ]み、あなたがたの罪[つみ]に応[おう]じて七倍[ななばい]にあなたがたを懲[こ]らしめる。"
  29: "あなたがたは自分[じぶん]の息子[むすこ]たちの肉[にく]を食[た]べ、娘[むすめ]たちの肉を食べる。"
  30: "わたしはあなたがたの石柱[せきちゅう]を荒[あ]らし、あなたがたの木[き]で造[つく]った手作[てづく]りのものを滅[ほろ]ぼし、あなたがたの屍[しかばね]を、あなたがたの偶像[ぐうぞう]の屍の上[うえ]に置[お]く。わたしの魂[たましい]はあなたがたを忌[い]み嫌[きら]う。"
  31: "わたしはあなたがたの町々[まちまち]を廃[はい]墟[きょ]とし、あなたがたの聖所[せいしょ]を荒[あ]れ果[は]てさせ、あなたがたの犠牲[ぎせい]の香[かおり]を嗅[か]がない。"
  32: "わたしはあなたがたの地[ち]を荒[あ]れ果[は]てさせる。そこに住[す]むあなたがたの敵[てき]は、それを見[み]て驚[おどろ]く。"
  33: "わたしはあなたがたを諸国民[しょこくみん]の間[あいだ]に散[ち]らし、あなたがたの上[うえ]に進[すす]む剣[つるぎ]があなたがたを滅[ほろ]ぼす。あなたがたの地[ち]は荒[あ]れ、あなたがたの町々[まちまち]は廃墟[はいきょ]となる。"
  34: "そのとき、地[ち]はその安息年[あんそくねん]を、またそれが荒[あ]れ果[は]てるすべての日[ひ]を喜[よろこ]んで受[う]け入[い]れる。あなたがたは敵[てき]の地にいる。そのとき、地は安息[あんそく]し、その安息年を喜んで受け入れる。"
  35: "荒[あ]れ果[は]てるすべての日[ひ]の間[あいだ]、それは、あなたがたがそこに住[す]んでいたとき、あなたがたの安息年[あんそくねん]の間に休[やす]まなかった分[ぶん]を休む。"
  36: "あなたがたのうちで残[のこ]された者[もの]には、敵[てき]の地[ち]で、その心[こころ]に臆病[おくびょう]を送[おく]る。風[かぜ]に飛[と]ぶ葉[は]の音[おと]が彼[かれ]らを追[お]い、彼らは戦[いくさ]から逃[に]げる者のように逃げ、だれも追わないのに倒[たお]れる。"
  37: "あたかも戦[いくさ]の中[なか]で、だれも迫[せま]って来[こ]ないかのように、兄弟[きょうだい]は兄弟を蔑[さげす]む。あなたがたは敵[てき]に立[た]ち向[む]かうことができない。"
  38: "あなたがたは諸国民[しょこくみん]の間[あいだ]で滅[ほろ]び、あなたがたの敵[てき]の地[ち]があなたがたを食[た]べ尽[つ]くす。"
  39: "あなたがたのうちで残[のこ]された者[もの]は、あなたがたの罪[つみ]のゆえに衰[おとろ]え、敵[てき]の地[ち]で溶[と]け尽[つ]きる。"
  40: "彼[かれ]らは自分[じぶん]の罪[つみ]と父[ちち]たちの罪、すなわち、わたしに背[そむ]き、わたしを蔑[さげす]み、わたしに逆[さから]って歩[あゆ]んだことを告白[こくはく]する。"
  41: "わたしもまた、彼[かれ]らに逆[さか]らう怒[いか]りをもって歩[あゆ]み、彼らを敵[てき]の地[ち]で滅[ほろ]ぼす。そのとき、彼らの無割礼[むかつれい]の心[こころ]は恥[は]じ、そのとき、彼らは自分[じぶん]の罪[つみ]の罰[ばつ]を受[う]け入[い]れる。"
  42: "わたしはヤコブとの契約[けいやく]を思[おも]い起[お]こし、イサクとの契約を、アブラハムとの契約を思い起こす。わたしはまた、あの地[ち]を思い起こす。"
  43: "その地[ち]は彼[かれ]らに捨[す]てられる。そのとき、彼らのゆえに荒[あ]れ果[は]てるその間[あいだ]に、地はその安息年[あんそくねん]を受[う]け入[い]れる。彼らもまた、自分[じぶん]の不法[ふほう]を受け入れる。すなわち、わたしの裁[さば]きを蔑[さげす]み、わたしの定[さだ]めに魂[たましい]で嫌悪[けんお]を抱[いだ]いたからである。"
  44: "しかし、彼[かれ]らが敵[てき]の地[ち]にいても、わたしは彼らを蔑[さげす]まず、彼らを忌[い]み嫌[きら]わない。彼らを滅[ほろ]ぼして、彼らとのわたしの契約[けいやく]を破[やぶ]るに至[いた]ることはない。わたしは主[しゅ]、彼らの神[かみ]である。"
  45: "わたしは彼[かれ]らのために、先[さき]の契約[けいやく]を思[おも]い起[お]こす。それは、わたしが彼らをエジプトの地[ち]から、奴隷[どれい]の家[いえ]から、諸国民[しょこくみん]の目[め]の前[まえ]で導[みちび]き出[だ]し、彼らの神[かみ]となったときのことである。わたしは主[しゅ]である。」"
  46: "これらは、主[しゅ]がシナイの山[やま]で、ご自身[じしん]とイスラエルの子[こ]らとの間[あいだ]に、モーセの手[て]によって与[あた]えられた裁[さば]きと定[さだ]めと律法[りっぽう]である。"

notes:
  1: "χειροποίητα — «сделанное руками» (рукотворное), γλυπτά — «изваяния». στήλη — столп, стела (石柱); λίθος σκοπός — букв. «камень-страж/указатель» (слав. «камень во знамение»; Синодальный «камни с изображениями»), поставленный для поклонения. В csl-ru в скобках добавлено «(образов)» — в греческом этого слова нет, поэтому не переводим и в 〔…〕 не берём (проверка: 26:1 в базе полный). ἐγώ εἰμι κύριος ὁ θεὸς ὑμῶν — わたしは主、あなたがたの神である."
  2: "τὰ σάββατά μου φυλάξεσθε — 安息日を守る (φυλάσσω, ср. 19:3,30). ἀπὸ τῶν ἁγίων μου φοβηθήσεσθε — букв. «святынь Моих убоитесь»: φοβέομαι с ἀπό — благоговеть перед святыней; Синодальный сужает до «святилище», у LXX множественное число. ἐγώ εἰμι κύριος — здесь без «Бог ваш»."
  3: "Ἐάν + сослагательное — формула условия «もし…なら», держится единообразно в 26:3, 14, 18, 21, 23, 27. προστάγματα — 定め (повеления), ἐντολαί — 戒め (ср. 26:46). πορεύησθε — «ходите» (образ жизни); ποιήσητε — «исполните»."
  4: "ὑετὸς ἐν καιρῷ αὐτοῦ — дождь в своё время. γενήματα — 産物 (произведения земли). ξύλα τῶν πεδίων — деревья полей; ἀποδώσει — «отдаст» (воздаст), ср. 26:20, где то же дерево «не даст» плода."
  5: "ἀλοητός — молотьба, жатва хлеба; τρύγητος — сбор винограда; σπόρος — посев. καταλήμψεται — «достигнет, застанет»: урожаи идут непрерывно друг за другом. εἰς πλησμονήν — досыта. μετὰ ἀσφαλείας — в безопасности. В csl-ru в конце стиха добавлено «и рать не пройдет сквозе землю вашу» — по греческому это начало ст. 6 (проверено: в 26:5 πόλεμος НЕТ, в 26:6 ЕСТЬ), деление стихов у слав. иное; переведено по греческому."
  6: "πόλεμος οὐ διελεύσεται — «война не пройдёт» (у слав. стоит в конце ст. 5 и повторено в ст. 7; по греческому — здесь, в начале). ὁ ἐκφοβῶν — устрашающий (ἐκφοβέω). θηρία πονηρά — злые звери (ср. 26:22 «дикие звери земли»)."
  7: "διώξεσθε — будете гнать. πεσοῦνται … φόνῳ — «падут … убиением» (φόνος — убийство, резня; слав. «убиением»); в ст. 8 то же сказано «мечом» (μαχαίρᾳ)."
  8: "πέντε … ἑκατόν — пятеро сто; ἑκατὸν … μυριάδας — сто тьмы (μυριάς — десять тысяч, «мириада»; слав. «тмы»). Переведено 一万, чтобы число было понятно."
  9: "ἐπιβλέψω ἐφ᾽ ὑμᾶς — «призрю на вас» (ἐπιβλέπω). αὐξανῶ καὶ πληθυνῶ — возращу и умножу. στήσω τὴν διαθήκην — «поставлю завет». В csl-ru добавлено «и благословлю вас» — в греческом этого глагола нет, не переводим."
  10: "παλαιὰ καὶ παλαιὰ παλαιῶν — «старое и старое старого», т. е. очень старое; повтор сохранён. ἐκ προσώπου νέων ἐξοίσετε — букв. «от лица новых вынесете», т. е. выбросите старое ради нового (слав. «от лица новых изнесете»)."
  11: "θήσω τὴν διαθήκην μου ἐν ὑμῖν — «положу завет Мой в вас»; слав. «поставлю завет мой в вас». jp-joc и масоретский текст читают здесь «жилище/скинию» (我が居所), у LXX и слав. — «завет» (проверено: σκην- в 26:11 НЕТ); переведено по греческому."
  12: "ἐμπεριπατήσω ἐν ὑμῖν — «буду ходить среди вас» (ἐμπεριπατέω, ср. 2 Кор 6:16). Формула завета: ἔσομαι ὑμῶν θεός, ὑμεῖς ἔσεσθέ μου λαός."
  13: "ὁ ἐξαγαγὼν ὑμᾶς … ὄντων ὑμῶν δούλων — «выведший вас, когда вы были рабами» (genitivus absolutus); Синодальный передаёт целевым оборотом («чтоб вы не были там рабами») — это истолкование, не текст. δεσμὸν τοῦ ζυγοῦ — узы ярма. μετὰ παρρησίας — «с дерзновением», открыто; Синодальный «с поднятою головою» — образ масоретского текста."
  14: "Ἐὰν δὲ μὴ ὑπακούσητέ μου — «если не послушаете Меня» (ὑπακούω — слушаться). μηδὲ ποιήσητε — «и не исполните». Речь идёт о тех же προστάγματα, что в ст. 3."
  15: "ἀλλὰ ἀπειθήσητε αὐτοῖς — «но не покоритесь им» (ἀπειθέω). προσοχθίσῃ ἡ ψυχὴ ὑμῶν — «вознегодует душа ваша» (προσοχθίζω — гнушаться, досадовать). ὥστε … ὥστε — «так что… так что»: следствие доведено до разорения завета (διασκεδάσαι — рассеять, разрушить)."
  16: "ἀπορία — нужда, безвыходность (Синодальный «ужас»). ψώρα — чесотка, парша; ἴκτερος — желтуха. σφακελίζοντας τοὺς ὀφθαλμούς — «гноящиеся, воспалённые глаза» (σφακελίζω); передано «目を損ない». ἐκτήκουσαν — истаивающую (τήκω — плавить). σπερεῖτε διὰ κενῆς — «посеете впустую». ὑπεναντίοι — противники, супостаты."
  17: "ἐπιστήσω τὸ πρόσωπόν μου ἐφ᾽ ὑμᾶς — «обращу лицо Моё на вас», т. е. против (идиома гнева, ср. 20:3); буквальный оборот сохранён. οὐθενὸς διώκοντος — «когда никто не гонит» (родительный абсолютный)."
  18: "ἕως τούτου — «до этого (места)», т. е. и после всего этого. προσθήσω τοῦ παιδεῦσαι — «приложу наказать» (παιδεύω — вразумлять наказанием). ἑπτάκις ἐπὶ ταῖς ἁμαρτίαις — «семь раз за грехи»; в csl-ru добавлено «язвами» — в греческом этого стиха нет (πληγαί появятся в ст. 21, проверено: 26:18 πληγ- НЕТ)."
  19: "ὕβρις τῆς ὑπερηφανίας — «дерзость гордыни» (ὕβρις — наглость, буйство); Синодальный «гордое упорство». οὐρανὸν σιδηροῦν, γῆν χαλκῆν — железное небо, медная земля (οὐρανός здесь — небо над полями, не жилище Бога)."
  20: "εἰς κενὸν ἡ ἰσχὺς ὑμῶν — «в пустое сила ваша» (ἰσχύς — крепость). οὐ δώσει … τὸν σπόρον αὐτῆς — не даст земля семени своего (σπόρος здесь — урожай, семя). ξύλον τοῦ ἀγροῦ — дерево поля."
  21: "πορεύησθε πλάγιοι — «будете ходить криво, вкось», т. е. наперекор (πλάγιος; слав. «страною», Синодальный «против Меня»); в переводе 逆らって歩む — единообразно в 21, 23, 24, 27, 28, 40, 41. πληγὰς ἑπτά — семь язв. κατὰ τὰς ἁμαρτίας — по грехам."
  22: "θηρία τὰ ἄγρια τῆς γῆς — дикие звери земли. ὀλιγοστοὺς ποιήσει ὑμᾶς — «сделает вас немногочисленными»; Синодальный добавляет «лишат вас детей» — в греческом нет. ἐρημωθήσονται αἱ ὁδοὶ ὑμῶν — опустеют дороги ваши."
  23: "παιδευθῆτε — «будете вразумлены» (страдательный от παιδεύω, ср. ст. 18). ἀλλὰ πορεύησθε πρός με πλάγιοι — «но пойдёте ко Мне строптиво» (πρός με — «ко Мне», как в слав.)."
  24: "πορεύσομαι κἀγὼ μεθ᾽ ὑμῶν θυμῷ πλαγίῳ — «пойду и Я с вами в ярости прекословящей» (θυμός — ярость; πλάγιος — наперекор; слав. «в ярости страною»). πατάξω — поражу (πατάσσω). ἑπτάκις ἀντὶ τῶν ἁμαρτιῶν — семикратно вместо грехов, т. е. в возмездие за них (ἀντί)."
  25: "μάχαιραν ἐκδικοῦσαν δίκην διαθήκης — «меч, взыскующий суда завета» (ἐκδικέω — взыскивать, мстить; δίκη — суд, расправа; слав. «мечь мстяй месть завета»). καταφεύξεσθε εἰς τὰς πόλεις — «укроетесь в городах»; Синодальный делает из этого условие («если укроетесь») — в греческом будущее изъявительное. ἐξαποστελῶ θάνατον — пошлю смерть (Синодальный «язву»)."
  26: "ἐν τῷ θλῖψαι ὑμᾶς σιτοδείᾳ ἄρτων — «когда стесню вас недостатком хлебов» (θλίβω — теснить; σιτοδεία — хлебный голод). У Синодального в начале стиха «хлеб, подкрепляющий человека, истреблю у вас» — масоретское чтение, в LXX его нет. κλιβάνῳ ἑνί — в одной печи. ἐν σταθμῷ — по весу. οὐ μὴ ἐμπλησθῆτε — «не насытитесь» (усиленное отрицание)."
  27: "ἐπὶ τούτοις — «при этом, после этого». ὑπακούσητέ μου … πορεύησθε πρός με πλάγιοι — та же формула, что в ст. 21."
  28: "αὐτὸς πορεύσομαι — «Я сам пойду» (эмфатическое αὐτός). παιδεύσω ὑμᾶς ἐγὼ ἑπτάκις — «накажу вас Я семикратно»; повтор ἐγώ — эмфаза, сохранена わたし自身."
  29: "τὰς σάρκας τῶν υἱῶν … καὶ τὰς σάρκας τῶν θυγατέρων — плоть сыновей и плоть дочерей; повтор φάγεσθε в греческом сохранён (ужас голода, ср. Втор 28:53; Иер 19:9). Смягчать нельзя."
  30: "ἐρημώσω τὰς στήλας — «опустошу столпы» (στήλη; слав. «капища»). ξύλινα χειροποίητα — деревянные рукотворения. κῶλα — трупы, мёртвые тела (κῶλον); εἰδώλων — идолов. προσοχθιεῖ ἡ ψυχή μου ὑμῖν — возгнушается вами душа Моя."
  31: "θήσω τὰς πόλεις ἐρήμους — сделаю города пустыми. ἐξερημώσω τὰ ἅγια — опустошу святыни (ἅγια, мн. ч.). οὐ μὴ ὀσφρανθῶ τῆς ὀσμῆς — «не обоняю запаха» (ὀσφραίνομαι); Синодальный добавляет «приятного» — в греческом нет, поэтому без «芳しい香»."
  32: "ἐξερημώσω ἐγὼ τὴν γῆν — «опустошу Я землю» (ἐγώ при глаголе — эмфаза). θαυμάσονται ἐπ᾽ αὐτῇ — «изумятся о ней» (θαυμάζω). οἱ ἐνοικοῦντες ἐν αὐτῇ — живущие в ней, т. е. враги, которые её займут."
  33: "διασπερῶ εἰς τὰ ἔθνη — рассею по народам. ἐξαναλώσει ὑμᾶς ἐπιπορευομένη ἡ μάχαιρα — «истребит вас наступающий меч» (ἐπιπορεύομαι — идти следом); Синодальный «обнажу вслед вас меч» — масоретский образ."
  34: "εὐδοκήσει ἡ γῆ τὰ σάββατα αὐτῆς — «земля благоволит, с удовольствием принимает субботы свои» (εὐδοκέω; слав. «возблаговолит»). τὰ σάββατα здесь — субботние годы земли (ср. 25:2–7), поэтому 安息年. σαββατιεῖ — «будет субботствовать» (σαββατίζω). τότε … τότε — повтор, как в греческом."
  35: "ἃ οὐκ ἐσαββάτισεν ἐν τοῖς σαββάτοις ὑμῶν — «чего не субботствовала в субботы ваши» (относительное ἅ, ср. р., мн. ч. — «то, что»; слав. «яже не празднова»). ἡνίκα κατῳκεῖτε αὐτήν — «когда вы жили на ней»."
  36: "δειλίαν εἰς τὴν καρδίαν — робость в сердце (δειλία). φωνὴ φύλλου φερομένου — голос, шум носимого ветром листа (φέρομαι — нестись). ὡς φεύγοντες ἀπὸ πολέμου — как бегущие от войны."
  37: "ὑπερόψεται ὁ ἀδελφὸς τὸν ἀδελφόν — «презрит брат брата» (ὑπεροράω — презирать, не замечать); Синодальный «споткнутся друг на друга» — иное чтение, у LXX ὑπεροράω. οὐθενὸς κατατρέχοντος — «когда никто не нападает» (κατατρέχω — бежать за, нападать). ἀντιστῆναι — противостать."
  38: "ἀπολεῖσθε ἐν τοῖς ἔθνεσιν — погибнете среди народов. κατέδεται ὑμᾶς ἡ γῆ — «съест вас земля» (пожирание землёй — образ могилы; слав. «потребит вас земля»)."
  39: "καταφθαρήσονται — истлеют (καταφθείρω). τακήσονται — истают, растворятся (τήκω). В csl-ru добавлено «и за грехи отец своих» — в греческом этого стиха нет (отцы появятся в ст. 40; проверено: 26:39 πατερ- НЕТ); по-японски не добавлено."
  40: "ἐξαγορεύσουσιν — «выскажут, исповедают» (ἐξαγορεύω; слав. «исповедят»). παρέβησαν — преступили; ὑπερεῖδόν με — презрели Меня (ὑπεροράω). ἐπορεύθησαν ἐναντίον μου πλάγιοι — «ходили предо Мною строптиво»."
  41: "ἐπορεύθην … ἐν θυμῷ πλαγίῳ — «Я ходил в ярости прекословящей» (аорист; слав. так же). ἀπολῶ — «погублю» (будущее, как в LXX и слав.; Синодальный переводит прошедшим). ἐντραπήσεται ἡ καρδία ἡ ἀπερίτμητος — «устыдится сердце необрезанное». εὐδοκήσουσιν τὰς ἁμαρτίας αὐτῶν — «примут грехи свои», т. е. признают и понесут их; Синодальный «потерпят за беззакония»."
  42: "μνησθήσομαι — трижды (завет Иакова, Исаака, Авраама, затем земля); порядок обратный хронологии — как в греческом. У LXX нет «завет Мой» (слав. и Синодальный добавляют «Мой»)."
  43: "ἐγκαταλειφθήσεται ὑπ᾽ αὐτῶν — будет оставлена ими. προσδέξεται … τὰ σάββατα — «примет субботы свои» (προσδέχομαι; ср. εὐδοκέω в ст. 34). προσδέξονται τὰς αὐτῶν ἀνομίας — «примут беззакония свои». ἀνθ᾽ ὧν — «за то, что» (ἀντί с родительным)."
  44: "οὐδ᾽ ὧς — «и так, и при этом» (οὐδὲ ὧς). ὑπερεῖδον … προσώχθισα — «не презрел … не возгнушался» (аористы в значении пророческого прошедшего; настоящее в переводе). ὥστε ἐξαναλῶσαι … τοῦ διασκεδάσαι — «так чтобы истребить … разорить»."
  45: "μνησθήσομαι αὐτῶν τῆς διαθήκης τῆς προτέρας — «вспомню им завет прежний». ἐξ οἴκου δουλείας — из дома рабства. ἔναντι τῶν ἐθνῶν — пред глазами народов. τοῦ εἶναι αὐτῶν θεός — «чтобы быть их Богом» (инфинитив цели)."
  46: "κρίματα — 裁き (судьбы), προστάγματα — 定め (повеления), νόμος — 律法; слав. «судбы… повеления… закон» (проверено: κριμα- в 26:46 ЕСТЬ). ἀνὰ μέσον αὐτοῦ καὶ … τῶν υἱῶν Ισραηλ — «между Собою и между сынами Израилевыми». ἐν χειρὶ Μωυσῆ — «рукою Моисея» (у LXX без «Мой»)."
