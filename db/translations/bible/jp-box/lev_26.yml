# jp-box, Левит, глава 26. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в Левите отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 26: запрет идолов и заповедь о субботе (1–2), благословения за послушание
# (3–13), нарастающие проклятия за непослушание — «семь раз» (14–39),
# исповедание грехов и восстановление завета (40–45), заключительная формула (46).
# Речь Бога продолжается из гл. 25 (вводной формулы «И сказал Господь» нет),
# поэтому ст. 1 открывается 「…」, а ст. 46 — уже повествование; кавычки закрыты в ст. 45.
# Красного и синего нет. 〔…〕 нет: все стихи и слова есть в gr-lxx-byz
# (проверено bracket_check.rb: 26:5 πόλεμος, 26:18 πληγαί, 26:39 πατέρες — отсутствуют,
# это славянские добавки, они не переведены, см. notes 5, 18, 39).
# Сносок ⟨…⟩ нет: 安息日, 祭壇, 祭司 уже в корпусе; 石柱, 安息年, 聖所 понятны по контексту.
# Расхождения LXX с масоретским/Синодальным отмечены в notes (11, 22, 26, 36, 37).
# Формулы условий единообразны: もし…なら (3, 14, 18, 21, 23, 27); πλάγιοι — 逆らって歩む
# (21, 23, 24, 27, 28, 40, 41); ἑπτάκις — 七倍に (18, 24, 28).
# jp-ni не использовался.

tr_code: jp-box
