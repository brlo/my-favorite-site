verses:
  1: "復讐[ふくしゅう]する者[もの]は主[しゅ]から復讐を受[う]け、その罪[つみ]はそのまま残[のこ]される。"
  2: "隣人[りんじん]の罪[つみ]を赦[ゆる]せ。そうすれば、あなたが祈[いの]るとき、あなたの罪は解[と]かれる。"
  3: "人[ひと]は人に対して怒[いか]りを抱[かか]えながら、主[しゅ]に癒[いや]しを求[もと]めるのか。"
  4: "自分[じぶん]に似[に]た人[ひと]に憐[あわ]れみをかけないのに、自分の罪[つみ]について祈[いの]るのか。"
  5: "自[みずか]ら肉[にく]でありながら怒[いか]りを抱き続ける者[もの]の罪[つみ]を、だれが贖[あがな]うのか。"
  6: "終[お]わりのこと、すなわち滅[ほろ]びと死[し]を思[おも]い起[おこ]し、敵意[てきい]を抱[かか]くのをやめて、戒[いまし]めにとどまれ。"
  7: "戒[いまし]めを思[おも]い起[おこ]して隣人[りんじん]に怒[いか]るな。いと高[たか]き方[かた]の契約[けいやく]を思い、無知[むち]を見逃[みのが]せ。"
  8: "争[あらそ]いから遠[とお]ざかれ。そうすれば罪[つみ]は少[すく]なくなる。怒[いか]りっぽい人[ひと]は争いを燃[も]え上[あ]がらせるからである。"
  9: "罪[つみ]深[ぶか]い人[ひと]は友[とも]を乱[みだ]し、平和[へいわ]に暮[く]らす者[もの]たちの間[あいだ]に中傷[ちゅうしょう]を投[な]げ込[こ]む。"
  10: "火[ひ]の薪[たきぎ]の多[おお]さに応[おう]じて燃[も]え上[あ]がり、争[あらそ]いの激[はげ]しさに応じて燃え上がる。人[ひと]の力[ちから]に応じてその怒[いか]りはあり、富[とみ]に応じてその憤[いきどお]りを高[たか]める。"
  11: "急[いそ]がされる争[あらそ]いは火[ひ]を点[とも]し、急がされる戦[いくさ]は血[ち]を流[なが]す。"
  12: "火花[ひばな]を吹[ふ]けば燃[も]え上[あ]がり、その上[うえ]に唾[つば]を吐[は]けば消[き]える。そのどちらもあなたの口[くち]から出[で]てくる。"
  13: "ささやき語[かた]る者[もの]と二[に]枚[まい]舌[じた]の者を呪[のろ]え。彼らは平和[へいわ]に暮[く]らす多[おお]くの人[ひと]を滅[ほろ]ぼしたからである。"
  14: "三[さん]枚[まい]舌[じた]は多[おお]くの人[ひと]を揺[ゆ]り動[うご]かし、彼らを民[たみ]から民へと離[はな]れさせ、堅[かた]固[こ]な町々[まちまち]を倒[たお]し、大[おお]きな人たちの家[いえ]を滅[ほろ]ぼした。"
  15: "三枚舌は勇[いさ]ましい女[おんな]たちを追[お]い出[だ]し、その労苦[ろうく]の実[み]を奪[うば]った。"
  16: "これに耳[みみ]を傾[かたむ]ける者[もの]は安[やす]らぎを得[え]ることはなく、静[しず]けのうちに住[す]みつくこともない。"
  17: "鞭[むち]の打[う]撃[げき]は傷跡[きずあと]を残[のこ]すが、舌[した]の打撃は骨[ほね]を砕[くだ]く。"
  18: "多[おお]くの人[ひと]は剣[つるぎ]の刃[は]に倒[たお]れたが、舌[した]によって倒れた者[もの]ほどではない。"
  19: "その舌[した]から守[まも]られた者[もの]、すなわちその怒[いか]りのうちを通[とお]らず、その軛[くびき]を引[ひ]かず、その縄目[なわめ]に縛[しば]られなかった者こそ幸[さいわ]いである。"
  20: "その軛[くびき]は鉄[てつ]の軛であり、その縄目[なわめ]は青銅[せいどう]の縄目である。"
  21: "その死[し]は悪[わる]い死であり、そのよみのほうがまだましである。"
  22: "それは敬虔[けいけん]な者[もの]たちを捕[と]らえることはなく、彼らはその炎[ほのお]で焼[や]かれることもない。"
  23: "主[しゅ]を捨[す]てる者[もの]たちはそれに陥[おちい]り、それは彼らのうちで燃[も]えて消[き]えることはない。獅子[しし]のように彼らに向かって放[はな]たれ、豹[ひょう]のように彼らを害[そこな]う。"
  24: "見[み]よ、あなたの財産[ざいさん]を茨[いばら]で囲[かこ]い、あなたの銀[ぎん]と金[きん]を結[むす]び合[あ]わせよ。"
  25: "あなたの言葉[ことば]に秤[はかり]と重[おも]さを設[もう]け、あなたの口[くち]に戸[と]と閂[かんぬき]を設けよ。"
  26: "気[き]をつけよ。それによって足[あし]を滑[すべ]らせ、待[ま]ち伏[ぶ]せる者[もの]の前[まえ]に倒[たお]れないように。"

notes:
  1: "ὁ ἐκδικῶν παρὰ κυρίου εὑρήσει ἐκδίκησιν — 復讐する者は主から復讐を受ける (ἐκδικέω — мстить; παρὰ κυρίου — от Господа; слав. «отмщаяй от Господа обрящет отмщение»). τὰς ἁμαρτίας αὐτοῦ διατηρῶν διατηρήσει — その罪はそのまま残される (διατηρέω — сохранять; букв. «соблюдая соблюдёт», т. е. грехи не будут прощены)."
  2: "ἄφες ἀδίκημα τῷ πλησίον σου — 隣人の罪を赦せ (ἀδίκημα — обида, несправедливость; ἀφίημι — отпускать). τότε δεηθέντος σου αἱ ἁμαρτίαι σου λυθήσονται — あなたが祈るとき、あなたの罪は解かれる (δέομαι — молиться; λύω — разрешать, отпускать)."
  3: "ἄνθρωπος ἀνθρώπῳ συντηρεῖ ὀργήν — 人は人に対して怒りを抱えながら (συντηρέω — хранить, держать). παρὰ κυρίου ζητεῖ ἴασιν; — 主に癒しを求めるのか (ἴασις — исцеление; риторический вопрос, слав. с двоеточием)."
  4: "ἐπ᾽ ἄνθρωπον ὅμοιον αὐτῷ οὐκ ἔχει ἔλεος — 自分に似た人に憐れみをかけないのに (ὅμοιος — подобный; ἔλεος — милость). περὶ τῶν ἁμαρτιῶν αὐτοῦ δεῖται; — 自分の罪について祈るのか (δέομαι — просить, молиться)."
  5: "αὐτὸς σὰρξ ὢν διατηρεῖ μῆνιν — 自ら肉でありながら怒りを抱き続ける (σάρξ — плоть; μῆνις — гнев, злоба). τίς ἐξιλάσεται τὰς ἁμαρτίας αὐτοῦ; — だれがその罪を贖うのか (ἐξιλάσκομαι — умилостивлять, искупать)."
  6: "μνήσθητι τὰ ἔσχατα καὶ παῦσαι ἐχθραίνων — 終わりのことを思い起こし、敵意を抱くのをやめよ (ἔσχατα — последнее; παύω — прекращать; ἐχθραίνω — враждовать). καταφθορὰν καὶ θάνατον — 滅びと死 (καταφθορά — истление, гибель). ἔμμενε ἐντολαῖς — 戒めにとどまれ (ἐμμένω — пребывать)."
  7: "μνήσθητι ἐντολῶν καὶ μὴ μηνίσῃς τῷ πλησίον — 戒めを思い起こして隣人に怒るな (μηνίω — гневаться). διαθήκην ὑψίστου καὶ πάριδε ἄγνοιαν — いと高き方の契約を思い、無知を見逃せ (διαθήκη — завет; παροράω — пренебрегать, прощать; ἄγνοια — неведение)."
  8: "Ἀπόσχου ἀπὸ μάχης, καὶ ἐλαττώσεις ἁμαρτίας — 争いから遠ざかれ、そうすれば罪は少なくなる (ἀπέχω — держаться вдали; ἐλαττόω — уменьшать). ἄνθρωπος θυμώδης ἐκκαύσει μάχην — 怒りっぽい人は争いを燃え上がらせる (θυμώδης — вспыльчивый; ἐκκαίω — зажигать)."
  9: "ἀνὴρ ἁμαρτωλὸς τάραξει φίλους — 罪深い人は友を乱す (ταράσσω — смущать, волновать). ἀνὰ μέσον εἰρηνευόντων ἐμβαλεῖ διαβολήν — 平和に暮らす者たちの間に中傷を投げ込む (εἰρηνεύω — жить в мире; διαβολή — клевета)."
  10: "κατὰ τὴν ὕλην τοῦ πυρὸς οὕτως ἐκκαυθήσεται — 火の薪の多さに応じて燃え上がる (ὕλη — вещество, дрова; ἐκκαίω — воспламеняться). κατὰ τὴν στερέωσιν τῆς μάχης — 争いの激しさに応じて (στερέωσις — крепость, сила). κατὰ τὴν ἰσχὺν τοῦ ἀνθρώπου ὁ θυμὸς αὐτοῦ ἔσται — 人の力に応じてその怒りはある. κατὰ τὸν πλοῦτον ἀνυψώσει ὀργὴν αὐτοῦ — 富に応じてその憤りを高める (ἀνυψόω — возвышать)."
  11: "ἔρις κατασπευδομένη ἐκκαίει πῦρ — 急がされる争いは火を点す (ἔρις — спор, распря; κατασπεύδω — торопить, разжигать). μάχη κατασπεύδουσα ἐκχέει αἷμα — 急がされる戦は血を流す (ἐκχέω — проливать)."
  12: "ἐὰν φυσήσῃς εἰς σπινθῆρα, ἐκκαήσεται — 火花を吹けば燃え上がる (φυσάω — дуть; σπινθήρ — искра). ἐὰν πτύσῃς ἐπ᾽ αὐτόν, σβεσθήσεται — その上に唾を吐けば消える (πτύω — плевать; σβέννυμι — гасить). ἀμφότερα ἐκ τοῦ στόματός σου ἐκπορεύεται — そのどちらもあなたの口から出てくる (ἐκπορεύομαι — исходить)."
  13: "Ψίθυρον καὶ δίγλωσσον καταράσασθε — ささやき語る者と二枚舌の者を呪え (ψίθυρος — наушник, шептун; δίγλωσσος — двуязычный; καταράομαι — проклинать). πολλοὺς εἰρηνεύοντας ἀπώλεσεν — 平和に暮らす多くの人を滅ぼした (ἀπόλλυμι — губить)."
  14: "γλῶσσα τρίτη — 三枚舌 (букв. «третий язык»; слав. «язык трегубый»). πολλοὺς ἐσάλευσεν καὶ διέστησεν αὐτοὺς ἀπὸ ἔθνους εἰς ἔθνος — 多くの人を揺り動かし、民から民へと離れさせた (σαλεύω — колебать; διΐστημι — разделять). πόλεις ὀχυρὰς καθεῖλεν — 堅固な町々を倒した (καθαιρέω — разрушать). οἰκίας μεγιστάνων κατέστρεψεν — 大きな人たちの家を滅ぼした (μεγιστάν — вельможа)."
  15: "γλῶσσα τρίτη γυναῖκας ἀνδρείας ἐξέβαλεν — 三枚舌は勇ましい女たちを追い出した (ἐκβάλλω — изгонять). ἐστέρεσεν αὐτὰς τῶν πόνων αὐτῶν — その労苦の実を奪った (στερέω — лишать; πόνος — труд)."
  16: "ὁ προσέχων αὐτῇ οὐ μὴ εὕρῃ ἀνάπαυσιν — これに耳を傾ける者は安らぎを得ない (προσέχω — внимать; ἀνάπαυσις — покой). οὐδὲ κατασκηνώσει μεθ᾽ ἡσυχίας — 静けさのうちに住みつくこともない (κατασκηνόω — селиться; ἡσυχία — тишина)."
  17: "πληγὴ μάστιγος ποιεῖ μώλωπα — 鞭の打撃は傷跡を残す (πληγή — удар, рана; μώλωψ — рубец; слав. «язва бичная струпы творит»). πληγὴ δὲ γλώσσης συγκλάσει ὀστᾶ — 舌の打撃は骨を砕く (συγκλάω — сокрушать; ὀστέον — кость)."
  18: "πολλοὶ ἔπεσαν ἐν στόματι μαχαίρας — 多くの人は剣の刃に倒れた (στόμα μαχαίρας — остриё меча). οὐχ ὡς οἱ πεπτωκότες διὰ γλῶσσαν — 舌によって倒れた者ほどではない (διά + вин. — из-за)."
  19: "μακάριος ὁ σκεπασθεὶς ἀπ᾽ αὐτῆς — その舌から守られた者は幸い (σκεπάζω — покрывать, защищать). ὃς οὐ διῆλθεν ἐν τῷ θυμῷ αὐτῆς — その怒りのうちを通らず (διέρχομαι — проходить). ὃς οὐχ εἵλκυσεν τὸν ζυγὸν αὐτῆς — その軛を引かず (ἕλκω — тянуть; ζυγός — ярмо). ἐν τοῖς δεσμοῖς αὐτῆς οὐκ ἐδέθη — その縄目に縛られなかった (δεσμός — узы; δέω — вязать)."
  20: "ὁ γὰρ ζυγὸς αὐτῆς ζυγὸς σιδηροῦς — その軛は鉄の軛 (σιδηροῦς — железный). οἱ δεσμοὶ αὐτῆς δεσμοὶ χάλκειοι — その縄目は青銅の縄目 (χάλκειος — медный, бронзовый; слав. «медяны»)."
  21: "θάνατος πονηρὸς ὁ θάνατος αὐτῆς — その死は悪い死 (πονηρός — злой). λυσιτελὴς μᾶλλον ὁ ᾅδης αὐτῆς — そのよみのほうがまだまし (λυσιτελής — полезный, выгодный; ᾅδης — преисподняя; слав. «паче его лучше есть ад»)."
  22: "οὐ μὴ κρατήσῃ εὐσεβῶν — 敬虔な者たちを捕らえることはない (κρατέω — одолевать, держать; εὐσεβής — благочестивый). ἐν τῇ φλογὶ αὐτῆς οὐ καήσονται — その炎で焼かれることもない (φλόξ — пламя; καίω — жечь)."
  23: "οἱ καταλείποντες κύριον ἐμπεσοῦνται εἰς αὐτήν — 主を捨てる者たちはそれに陥る (καταλείπω — оставлять; ἐμπίπτω — впадать). ἐν αὐτοῖς ἐκκαήσεται καὶ οὐ μὴ σβεσθῇ — 彼らのうちで燃えて消えることはない. ἐπαποσταλήσεται αὐτοῖς ὡς λέων — 獅子のように彼らに向かって放たれる (ἐπαποστέλλω — посылать на). ὡς πάρδαλις λυμανεῖται αὐτούς — 豹のように彼らを害する (πάρδαλις — барс, леопард; λυμαίνομαι — губить)."
  24: "ἰδὲ περίφραξον τὸ κτῆμά σου ἀκάνθαις — 見よ、財産を茨で囲え (περιφράσσω — огораживать; κτῆμα — имущество; ἄκανθα — терние). τὸ ἀργύριόν σου καὶ τὸ χρυσίον κατάδησον — 銀と金を結び合わせよ (καταδέω — связывать; слав. «свяжи»)."
  25: "τοῖς λόγοις σου ποίησον ζυγὸν καὶ σταθμόν — 言葉に秤と重さを設けよ (ζυγός — весы, ярмо; σταθμός — вес, мера). τῷ στόματί σου ποίησον θύραν καὶ μοχλόν — 口に戸と閂を設けよ (θύρα — дверь; μοχλός — засов, запор)."
  26: "πρόσεχε μήπως ὀλίσθῃς ἐν αὐτῇ — 気をつけよ、それによって足を滑らせないように (ὀλισθάνω — скользить, оступаться). μὴ πέσῃς κατέναντι ἐνεδρεύοντος — 待ち伏せる者の前に倒れないように (ἐνεδρεύω — подстерегать)."
