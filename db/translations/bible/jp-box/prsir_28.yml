# jp-box, Сирах, глава 28. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc в книге нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 28: мщение и прощение (1–5), память о конце (6–7), ссора и гнев (8–12),
# злой язык (13–18), блаженство укрывшегося (19–23), хранение имущества и слов
# (24–26). Прямой речи нет: всё — авторское поучение; красного и синего нет.
# Нумерация по gr: 26 стихов (строки 27–30 в gr-lxx-byz пусты). Слав. 28:1–30:
# деление дробит греч. (8 = гр 7b; 10–12 = гр 9–10; 16+17 = гр 14; 27+28 = гр 24;
# 30 = гр 26 и т. д.); лишние слав. стихи влиты по содержанию, стихов не добавлено.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).

