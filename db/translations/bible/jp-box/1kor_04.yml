# jp-box, Первое послание к Коринфянам, глава 4. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 4: домостроители тайн Божиих и суд Господень (1–5);
# ирония над коринфским самодовольством и апостольское уничижение (6–13);
# отеческое увещание, Тимофей, и вопрос о жезле (14–21).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет, <j>/<mo> не ставятся.
# 〔…〕 в главе нет: все стихи в базе gr-lxx-byz есть, [Ἰησοῦ] в 4:17 стоит в базе.
# Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

tr_code: jp-box
book: 1kor
chapter: 4
draft: true

verses:
  1: "人[ひと]は、わたしたちをキリストの奉仕者[ほうししゃ]、神[かみ]の奥義[おうぎ]の管理[かんり]人[にん]と見[み]なすべきである。"
  2: "その上[うえ]で管理[かんり]人[にん]に求[もと]められるのは、忠実[ちゅうじつ]な者[もの]として見[み]いだされることである。"
  3: "わたしは、あなたがたから裁[さば]かれること、また人[ひと]の法廷[ほうてい]で裁[さば]かれることを、きわめて小[ちい]さなことと思[おも]っている。わたし自身[じしん]、自分[じぶん]を裁[さば]くこともしない。"
  4: "なぜなら、わたしは自分[じぶん]に何[なに]の責[せ]めも覚[おぼ]えない。しかし、それによって義[ぎ]と認[みと]められたのではない。わたしを裁[さば]くのは主[しゅ]である。"
  5: "それゆえ、主[しゅ]が来[こ]られるまで、時[とき]が満[み]ちる前[まえ]に、何[なに]も裁[さば]いてはならない。主[しゅ]は暗[くら]やみに隠[かく]れた事[こと]を照[て]らし、心[こころ]の計[はかり]ごとを明[あき]らかにされる。そのとき、それぞれ神[かみ]から褒[ほ]めを受[う]けるであろう。"
  6: "兄弟[きょうだい]たちよ、わたしはあなたがたのために、これらのことを自分[じぶん]とアポロに当[あ]てはめて言[い]った。それは、あなたがたがわたしたちによって「書[か]かれていること以上[いじょう]のことをしない」ことを学[まな]び、一人[ひとり]をかばって、ほかの者[もの]に対[たい]して高[たか]ぶらないようになるためである。"
  7: "なぜなら、だれがあなたを他[ほか]の者[もの]と区別[くべつ]するのか。あなたが持[も]っているもので、受[う]け取[と]らなかったものがあるだろうか。もし受[う]け取[と]ったのなら、なぜ、受[う]け取[と]らなかった者[もの]のように誇[ほこ]るのか。"
  8: "あなたがたはもう満[み]ち足[た]りている。もう富[と]んでいる。わたしたちを抜[ぬ]きで王[おう]となっている。いや、願[ねが]わくは、あなたがたが王[おう]となっていたなら、わたしたちもあなたがたとともに王[おう]となれたのだが。"
  9: "なぜなら、わたしは思[おも]う。神[かみ]はわたしたち使徒[しと]たちを、死[し]に定[さだ]められた者[もの]たちのように、末[すえ]の者[もの]として示[しめ]された、と。わたしたちは世界[せかい]にも、天使[てんし]たちにも、人[ひと]々[びと]にも、見[み]ものにされたからである。"
  10: "わたしたちはキリストのために愚[おろ]かであり、あなたがたはキリストにあって賢[かしこ]い。わたしたちは弱[よわ]く、あなたがたは強[つよ]い。あなたがたは栄光[えいこう]を受[う]け、わたしたちは辱[はずかし]めを受[う]けている。"
  11: "今[いま]この時[とき]に至[いた]るまで、わたしたちは飢[う]え、渇[かわ]き、裸[はだか]で、打[う]たれ、住[す]む所[ところ]もなく、"
  12: "自分[じぶん]の手[て]で働[はたら]いて労[ろう]している。ののしられても祝福[しゅくふく]し、迫害[はくがい]されても耐[た]え忍[しの]び、"
  13: "中傷[ちゅうしょう]されても慰[なぐさ]めの言葉[ことば]を語[かた]っている。わたしたちはこの世[よ]の屑[くず]、すべてのものに拭[ふ]き捨[す]てられる塵[ちり]のように、今[いま]に至[いた]るまでなってしまった。"
  14: "わたしがこれらのことを書[か]くのは、あなたがたを恥[は]ずかしめるためではなく、わたしの愛[あい]する子[こ]たちとして諭[さと]すためである。"
  15: "なぜなら、あなたがたにキリストにあって一万[いちまん]の養育係[よういくがかり]があっても、父[ちち]は多[おお]くないからである。キリスト・イエスにあって、福音[ふくいん]によってあなたがたを生[う]んだのは、このわたしである。"
  16: "だから、わたしに倣[なら]う者[もの]となってほしいと、あなたがたに求[もと]める。"
  17: "このために、わたしはテモテをあなたがたのもとへ遣[つか]わした。彼[かれ]は、主[しゅ]にあってわたしの愛[あい]する、忠実[ちゅうじつ]な子[こ]である。彼[かれ]は、わたしがどこでも、すべての教会[きょうかい]で教[おし]えているとおりに、キリスト・イエスにあるわたしの道[みち]をあなたがたに思[おも]い起[おこ]こさせてくれるであろう。"
  18: "あなたがたのもとへわたしが行[い]かないのをよいことにして、ある者[もの]たちは高[たか]ぶっている。"
  19: "しかし、主[しゅ]がお望[のぞ]みになれば、わたしは間[ま]もなくあなたがたのもとへ行[い]き、高[たか]ぶっている者[もの]たちの言葉[ことば]ではなく、その力[ちから]を知[し]ろう。"
  20: "なぜなら、神[かみ]の国[くに]は言葉[ことば]にあるのではなく、力[ちから]にあるからである。"
  21: "あなたがたはどうしてほしいのか。わたしが杖[つえ]をもってあなたがたのところへ行[い]くことか。それとも、愛[あい]と柔和[じゅうわ]の霊[れい]とをもって行[い]くことか。"

notes:
  1: "ὑπηρέτης — 奉仕者; οἰκονόμος — 管理人; μυστήρια θεοῦ — 神の奥義. λογιζέσθω — 見なすべきである."
  2: "πιστός — 忠実; εὑρεθῇ — 見いだされる."
  3: "ἀνακρίνω — «разбирать, судить»; 裁く. ἀνθρωπίνη ἡμέρα — «человеческий день», то есть человеческий суд; 人の法廷."
  4: "σύνοιδα — 責めを覚える; δεδικαίωμαι — 義と認められた; ὁ δὲ ἀνακρίνων με κύριός ἐστιν — わたしを裁くのは主である."
  5: "πρὸ καιροῦ — 時の満ちる前に; φωτίσει — 照らし; βουλαὶ τῶν καρδιῶν — 心の計らい."
  6: "μετεσχημάτισα — «приложил к себе»; 当てはめて言った. τὸ Μὴ ὑπὲρ ἃ γέγραπται — «не сверх написанного»; 書かれていること以上のことをしない (максима в кавычках). φυσιοῦσθε — 高ぶる."
  7: "διακρίνει — 区別する; καυχᾶσαι — 誇る. Три риторических вопроса сохранены."
  8: "κεκορεσμένοι — 満ち足りている; ἐπλουτήσατε — 富んでいる; ἐβασιλεύσατε — 王となった; ὄφελόν γε — 願わくは (ироническое пожелание, ср. jp-joc 嗚呼願はくは). Ирония не сглажена."
  9: "ἐσχάτους — 末の者; ἐπιθανατίους — 死に定められた者; θέατρον — 見もの."
  10: "Ирония Павла сохранена: μωροί / φρόνιμοι, ἀσθενεῖς / ἰσχυροί, ἔνδοξοι / ἄτιμοι — 愚か / 賢い, 弱い / 強い, 栄光を受ける / 辱めを受ける."
  11: "ἀστατοῦμεν — «не имеем постоянного места»; 住む所もなく."
  12: "κοπιῶμεν — 労する; λοιδορούμενοι εὐλογοῦμεν — ののしられても祝福し."
  13: "περικαθάρματα, περίψημα — «отбросы, сор»; 屑, 塵. ἕως ἄρτι — 今に至るまで."
  15: "μυρίους παιδαγωγούς — «десять тысяч наставников»; 一万の養育係 (μύριοι — десять тысяч). ἐγέννησα — 生んだ."
  16: "μιμηταί μου γίνεσθε — わたしに倣う者となれ. У jp-joc здесь добавлено「我のハリストスに於けるが如くせよ」— это слова 11:1, в греч. 4:16 их нет; не добавлены."
  17: "ἀναμνήσει — 思い起こさせる; τὰς ὁδούς μου τὰς ἐν Χριστῷ Ἰησοῦ — キリスト・イエスにあるわたしの道. В базе [Ἰησοῦ] стоит в квадратных скобках — слово есть, 〔〕 не ставятся."
  19: "γνώσομαι — 知ろう; τὴν δύναμιν — その力."
  21: "ῥάβδος — 杖; πραΰτης — 柔和. Двойной вопрос сохранён."
