# jp-box, 2-я Паралипоменон, глава 8. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); второй свидетель церковного текста —
# церковнославянский (csl-ru), по паритету (docs/japanese-bible.md); ru
# (Синодальный) — только для понимания, не источник. jp-joc в книге нет;
# jp-ni (под авторским правом) не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 8: двадцать лет и города Хирама (1–2), постройки в Емафе и по всей
# земле (3–6), оставшиеся хананеи в подать (7–10), дочь фараона (11),
# богослужебный устав и окончание работ (12–16), флот в Офир (17–18).
# Параллель — 3 Цар 9:10–28, но порядок и нумерация иные; в 8:2 обратное
# направление, чем в 3 Цар 9:11–13: здесь Хирам дал города Соломону.
# Царицы Савской в этой главе нет — она в 2 Пар 9.
# Речь: Соломон — 「…」 (11). Красного нет. 〔…〕 нет.
# Сносок ⟨…⟩ нет: 神殿, 祭壇, 燔祭, 契約の箱, レビ人, 安息日 уже в корпусе.

tr_code: jp-box
