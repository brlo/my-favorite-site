chapter: 8
draft: true

verses:
  1: "ソロモンが主[しゅ]の神殿[しんでん]と自分[じぶん]の家[いえ]を建[た]てた二十[にじゅう]年[ねん]が過[す]ぎたとき、"
  2: "ソロモンは、ヒラムが自分[じぶん]に与[あた]えた町[まち]々[まち]を建[た]て直[なお]し、そこにイスラエルの子[こ]らを住[す]まわせた。"
  3: "ソロモンはハマト・ツォバへ行[い]き、それを攻[せ]め取[と]った。"
  4: "彼[かれ]は荒野[こうや]にタデモルを建[た]て、またハマトで建[た]てたすべての堅固[けんご]な町[まち]々[まち]を建[た]てた。"
  5: "上[かみ]のベト・ホロンと下[しも]のベト・ホロンを建[た]てた。これらは城壁[じょうへき]、門[もん]、かんぬきを備[そな]えた堅固[けんご]な町[まち]である。"
  6: "また、バアラトと、ソロモンに属[ぞく]したすべての堅固[けんご]な町[まち]、すべての戦車[せんしゃ]の町[まち]、騎兵[きへい]の町[まち]、およびソロモンがエルサレムとレバノンとその王国[おうこく]の全[ぜん]地[ち]に建[た]てることを望[のぞ]んだすべてのものを建[た]てた。"
  7: "イスラエルに属[ぞく]さない者[もの]たち、すなわちヘト人[びと]、アモリ人[じん]、ペリジ人[じん]、ヒビ人[じん]、エブス人[じん]のうち、残[のこ]された民[たみ]はすべて、"
  8: "彼[かれ]らの後[あと]にこの地[ち]に残[のこ]り、イスラエルの子[こ]らが滅[ほろ]ぼし尽[つ]くさなかったその子[こ]たちのうちから出[で]た者[もの]たちを、ソロモンは今日[きょう]に至[いた]るまで彼[かれ]らに貢[みつ]ぎを納[おさ]めさせた。"
  9: "しかしソロモンは、イスラエルの子[こ]らのうち誰[だれ]も自分[じぶん]の王国[おうこく]の奴隷[どれい]にはしなかった。彼[かれ]らは戦士[せんし]であり、長[おさ]たち、力[ちから]ある者[もの]たち、戦車[せんしゃ]の長[おさ]たち、騎兵[きへい]たちであったからである。"
  10: "これらはソロモン王[おう]の監督[かんとく]たちの長[おさ]で、民[たみ]の仕事[しごと]を指揮[しき]する者[もの]は二百五十人[にひゃくごじゅうにん]であった。"
  11: "ソロモンはファラオの娘[むすめ]をダビデの町[まち]から、彼女[かのじょ]のために建[た]てた家[いえ]へ移[うつ]した。彼[かれ]は言[い]った。「わたしの妻[つま]は、イスラエルの王[おう]ダビデの町[まち]には住[す]まない。主[しゅ]の契約[けいやく]の箱[はこ]が入[はい]ったそこは聖[せい]なる場所[ばしょ]だからである。」"
  12: "そこでソロモンは、神殿[しんでん]の前[まえ]に建[た]てた祭壇[さいだん]の上[うえ]で、主[しゅ]に燔祭[はんさい]をささげた。"
  13: "また、モーセの戒[いまし]めに従[したが]って、日[ひ]ごとの定[さだ]めに応[おう]じて、安息日[あんそくび]と新月[しんげつ]と祭[まつ]りに、年[とし]に三度[さんど]、すなわち種[たね]なしパンの祭[まつ]り、七週[しちしゅう]の祭[まつ]り、仮庵[かりいお]の祭[まつ]りに、燔祭[はんさい]をささげた。"
  14: "ソロモンはダビデの定[さだ]めに従[したが]って、祭司[さいし]たちの組[くみ]分[わ]けをその務[つと]めに応[おう]じて定[さだ]め、レビ人[びと]をそれぞれの務[つと]めの場所[ばしょ]に置[お]いて、日[ひ]ごとの定[さだ]めに従[したが]って祭司[さいし]たちの前[まえ]でほめたたえ、仕[つか]えさせ、門衛[もんえい]をその組[くみ]分[わ]けに従[したが]って門[もん]ごとに配置[はいち]した。それは、神[かみ]の人[ひと]ダビデの命令[めいれい]がそのようであったからである。"
  15: "彼[かれ]らは、祭司[さいし]とレビ人[びと]についての王[おう]の命令[めいれい]を、どの事[こと]においても、また宝物[たからもの]のことにおいても、違[ちが]えなかった。"
  16: "こうして、すべての仕事[しごと]は、基礎[きそ]が据[す]えられた日[ひ]から、ソロモンが主[しゅ]の神殿[しんでん]を完成[かんせい]させるまで、整[ととの]えられた。"
  17: "そのときソロモンはガシオン・ガベルへ、またエドムの地[ち]の海辺[うみべ]にあるエラトへ行[い]った。"
  18: "ヒラムは自分[じぶん]のしもべたちの手[て]によって船[ふね]と、海[うみ]を知[し]る者[もの]たちを送[おく]り、彼[かれ]らはソロモンのしもべたちとともにオフィルへ行[い]って、そこから金[きん]四百五十[よんひゃくごじゅう]タラントを取[と]って、ソロモン王[おう]のもとへ来[き]た。"

notes:
  1: "μετὰ εἴκοσι ἔτη — через двадцать лет; ἐν οἷς — в которые; τὸν οἶκον κυρίου καὶ τὸν οἶκον ἑαυτοῦ — дом Господень и дом свой. Ср. 3 Цар 9:10. Слав. 8:1."
  2: "τὰς πόλεις, ἃς ἔδωκεν Χιραμ τῷ Σαλωμων — города, которые Хирам дал Соломону (в 3 Цар 9:11–13 наоборот: Соломон дал города Хираму — отмечено); ᾠκοδόμησεν αὐτάς — обстроил их; κατῴκισεν — поселил (κατοικίζω). Слав. 8:2."
  3: "Αιμαθ Σωβα — Емаф-Сува, Хамат-Цоба (слав. «емаф-сува»; ср. 3 Цар 8:65); κατίσχυσεν αὐτήν — овладел ею (κατισχύω). Слав. 8:3."
  4: "Θεδμορ ἐν τῇ ἐρήμῳ — Фадмор в пустыне (タデモル, ср. 3 Цар 9:18); πόλεις ὀχυράς — города укреплённые; ἐν Ημαθ — в Емафе. Слав. 8:4."
  5: "Βαιθωρων τὴν ἄνω καὶ τὴν Βαιθωρων τὴν κάτω — Вефорон верхний и Вефорон нижний; τείχη, πύλαι καὶ μοχλοί — стены, ворота и засовы (μοχλός). Слав. 8:5."
  6: "Βααλαθ — Ваалаф (バアラト); πόλεις τῶν ἁρμάτων — города колесниц; πόλεις τῶν ἱππέων — города всадников; ὅσα ἐπεθύμησεν κατὰ τὴν ἐπιθυμίαν — что пожелал по желанию; ἐν τῷ Λιβάνῳ — на Ливане. Ср. 3 Цар 9:19. Слав. 8:6."
  7: "Χετταῖος, Αμορραῖος, Φερεζαῖος, Ευαῖος, Ιεβουσαῖος — хеттеи, аморреи, ферезеи, евеи, иевусеи (в 3 Цар 9:20 добавлены хананеи и гергесеи); οἳ οὔκ εἰσιν ἐκ τοῦ Ισραηλ — которые не из Израиля. Слав. 8:7."
  8: "ἐκ τῶν υἱῶν αὐτῶν τῶν καταλειφθέντων — из сынов их, оставшихся; οὓς οὐκ ἐξωλέθρευσαν — которых не истребили (ἐξολοθρεύω); ἀνήγαγεν αὐτοὺς εἰς φόρον — обложил их данью (φόρος, 貢ぎ); ἕως τῆς ἡμέρας ταύτης — до сего дня. Ср. 3 Цар 9:21. Слав. 8:8."
  9: "οὐκ ἔδωκεν ... εἰς παῖδας — не отдал в рабы; ἄνδρες πολεμισταί — мужи воинственные (戦士); ἄρχοντες ἁρμάτων καὶ ἱππέων — начальники колесниц и всадников. Ср. 3 Цар 9:22. Слав. 8:9."
  10: "ἄρχοντες τῶν προστατῶν — начальники надзирателей (προστάτης — начальствующий); πεντήκοντα καὶ διακόσιοι — двести пятьдесят; ἐργοδιωκτοῦντες — приставники над работами (ἐργοδιώκτης). В 3 Цар 9:23 — 550; здесь 250 — отметить. Слав. 8:10."
  11: "τὴν θυγατέρα Φαραω ἀνήγαγεν — дочь фараона перевёл (ἀνάγω); εἰς τὸν οἶκον, ὃν ᾠκοδόμησεν αὐτῇ — в дом, который построил ей; ἅγιός ἐστιν οὗ εἰσῆλθεν ἐκεῖ κιβωτὸς κυρίου — свят он, куда вошёл ковчег Господень. Ср. 3 Цар 9:24 (там же — Милло). Слав. 8:11."
  12: "ἀνήνεγκεν ὁλοκαυτώματα — вознёс всесожжения; ἐπὶ τὸ θυσιαστήριον, ὃ ᾠκοδόμησεν ἀπέναντι τοῦ ναοῦ — на жертвеннике, который построил пред храмом. Слав. 8:12."
  13: "κατὰ τὸν λόγον ἡμέρας ἐν ἡμέρᾳ — по слову дня в день, то есть по уставу каждого дня; κατὰ τὰς ἐντολὰς Μωυσῆ — по заповедям Моисея; ἐν τοῖς σαββάτοις καὶ ἐν τοῖς μησὶν καὶ ἐν ταῖς ἑορταῖς — в субботы, новомесячия и праздники; τρεῖς καιροὺς τοῦ ἐνιαυτοῦ — три времени года; ἑορτὴ τῶν ἀζύμων, τῶν ἑβδομάδων, τῶν σκηνῶν — опресноков, седмиц, кущей (種なしパン, 七週, 仮庵). Слав. 8:13."
  14: "κατὰ τὴν κρίσιν Δαυιδ — по уставу Давида (κρίσις — порядок, устав); διαιρέσεις τῶν ἱερέων — разделения, чреды священников; κατὰ τὰς λειτουργίας — по служениям; ἐπὶ τὰς φυλακὰς αὐτῶν — на стражи их; τοῦ αἰνεῖν καὶ λειτουργεῖν — чтобы хвалить и служить; πυλωροί — привратники (門衛); εἰς πύλην καὶ πύλην — к вратам и вратам; ἐντολαὶ Δαυιδ ἀνθρώπου τοῦ θεοῦ — заповеди Давида, человека Божия. Слав. 8:14."
  15: "οὐ παρῆλθον — не преступили (παρέρχομαι); εἰς πάντα λόγον — во всяком слове; εἰς τοὺς θησαυρούς — в отношении сокровищ (θησαυρός, 宝物). Слав. 8:15."
  16: "ἡτοιμάσθη πᾶσα ἡ ἐργασία — была приготовлена вся работа; ἀφ᾿ ἧς ἡμέρας ἐθεμελιώθη — с того дня, как было положено основание (θεμελιόω); ἕως οὗ ἐτελείωσεν — до того, как окончил. Слав. 8:16."
  17: "ᾤχετο — пошёл (οἴχομαι); Γασιωνγαβερ — Гасион-Гавер (ガシオン・ガベル, ср. 3 Цар 9:26); τὴν Αιλαθ τὴν παραθαλάσσιαν — Елаф приморский (エラト); ἐν γῇ Ιδουμαίᾳ — в земле Идумейской (エドム). Слав. 8:17."
  18: "ἀπέστειλεν Χιραμ ἐν χειρὶ παίδων αὐτοῦ πλοῖα — послал Хирам рукою слуг своих корабли; παῖδας εἰδότας θάλασσαν — людей, знающих море; εἰς Σωφιρα — в Софиру (オフィル, как в 3 Цар 9:28); τετρακόσια καὶ πεντήκοντα τάλαντα χρυσίου — 450 талантов золота (в 3 Цар 9:28 — 420 по csl / 120 по LXX; здесь gr и csl совпадают — 450). Слав. 8:18."
