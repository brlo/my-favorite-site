# jp-box, Первое соборное послание Петра, глава 3. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 3: жёны и мужья (1–7), общий призыв к единомыслию и благословению (8–12),
# страдание за правду и готовность дать ответ (13–17), Христос пострадал
# и проповедовал духам в темнице, Ноев ковчег и крещение (18–22).
# Красного и синего нет: 3:19 — проповедь духов, а не прямая речь Христа,
# поэтому <j> не ставится. Слова Писания 3:10–12 — в 「」, атрибуция в notes.
# 〔…〕 в главе нет: 3:1 [αἱ] и 3:18 [ὑπὲρ ὑμῶν] стоят в базе, слова есть;
# 3:19 πορευθεὶς в базе ЕСТЬ (проверено запросом к gr-lxx-byz) — скобки не нужны.
# Сносок ⟨…⟩ нет: 洗礼, 良心, 監督 уже встречались в корпусе. jp-ni не использовался.

