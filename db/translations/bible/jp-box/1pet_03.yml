verses:
  1: "同[おな]じように、妻[つま]たちよ、自分[じぶん]の夫[おっと]に従[したが]いなさい。そうすれば、夫[おっと]たちのうちに御言葉[みことば]に従[したが]わない者[もの]があっても、妻[つま]の行[おこな]いによって、言葉[ことば]によらずして得[え]られるであろう。"
  2: "それは、あなたがたが慎[つつし]み深[ぶか]く清[きよ]い行[おこな]いをしているのを、彼[かれ]らが見[み]るからである。"
  3: "あなたがたの飾[かざ]りは、髪[かみ]を編[あ]むこと、金[きん]の飾[かざ]りを身[み]につけること、衣[ころも]をまとうことなどの、外[そと]かざりであってはならない。"
  4: "むしろ、朽[く]ちない、柔和[にゅうわ]で静[しず]かな霊[れい]による、心[こころ]の内[うち]に隠[かく]れた人[ひと]を飾[かざ]りとしなさい。それは、神[かみ]の前[まえ]に高価[こうか]なものである。"
  5: "かつて、神[かみ]に希望[きぼう]を置[お]いていた聖[せい]なる女[おんな]たちも、このように、自分[じぶん]の夫[おっと]に従[したが]いつつ、自分[じぶん]自身[じしん]を飾[かざ]っていたのである。"
  6: "たとえばサラは、アブラハムに従[したが]い、彼[かれ]を主[しゅ]と呼[よ]んでいた。あなたがたは、善[ぜん]を行[おこな]い、何[なに]の脅[おど]しにも恐[おそ]れなければ、サラの子[こ]どもたちとなるのである。"
  7: "同[おな]じように、夫[おっと]たちよ、知[ち]識[しき]に基[もと]づいて妻[つま]とともに暮[く]らしなさい。妻[つま]を弱[よわ]い器[うつわ]として敬[うやま]い、いのちの恵[めぐ]みをともに受[う]け継[つ]ぐ者[もの]として重[おも]んじなさい。あなたがたの祈[いの]りが妨[さまた]げられないためである。"
  8: "最後[さいご]に、あなたがたは皆[みな]、心[こころ]を同[おな]じくし、同情[どうじょう]し、兄弟[きょうだい]を愛[あい]し、あわれみ深[ぶか]く、謙遜[けんそん]でありなさい。"
  9: "悪[あく]をもって悪[あく]に報[むく]い、ののしりをもってののしりに報[むく]いてはならない。それとは逆[ぎゃく]に、祝福[しゅくふく]しなさい。あなたがたが祝福[しゅくふく]を受[う]け継[つ]ぐために、そのように召[め]されたのである。"
  10: "というのは、「いのちを愛[あい]し、良[よ]い日[ひ]々[び]を見[み]たいと願[ねが]う者[もの]は、その舌[した]を悪[あく]から、その唇[くちびる]を偽[いつわ]りを語[かた]ることから遠[とお]ざけなさい。」と書[か]かれているからである。"
  11: "「悪[あく]から遠[とお]ざかって善[ぜん]を行[おこな]い、平和[へいわ]を求[もと]めてそれを追[お]い求[もと]めよ。」"
  12: "「主[しゅ]の目[め]は正[ただ]しい者[もの]たちの上[うえ]にあり、その耳[みみ]は彼[かれ]らの祈[いの]りに傾[かたむ]く。しかし、主[しゅ]の顔[かお]は悪[あく]を行[おこな]う者[もの]たちに敵対[てきたい]する。」"
  13: "あなたがたが善[ぜん]に熱心[ねっしん]になるなら、だれがあなたがたを害[がい]することができようか。"
  14: "しかし、義[ぎ]のために苦[くる]しみを受[う]けるとしても、あなたがたは幸[さいわ]いである。彼[かれ]らが恐[おそ]れるものを恐[おそ]れてはならない。また、動揺[どうよう]してはならない。"
  15: "あなたがたの心[こころ]のうちで、キリストを主[しゅ]として聖[せい]としなさい。あなたがたのうちにある希望[きぼう]について、あなたがたに説明[せつめい]を求[もと]めるすべての人[ひと]に、いつでも答[こた]えられるように備[そな]えていなさい。"
  16: "ただし、柔和[にゅうわ]と恐[おそ]れとをもって、善[よ]い良心[りょうしん]を保[たも]ちなさい。そうすれば、あなたがたのキリストにある善[よ]い行[おこな]いを中傷[ちゅうしょう]する者[もの]たちは、あなたがたを悪[わる]く言[い]うそのことで恥[は]じを受[う]けることになる。"
  17: "たとえ神[かみ]の御心[みこころ]がそう望[のぞ]まれる場合でも、善[ぜん]を行[おこな]いながら苦[くる]しみを受[う]けるほうが、悪[あく]を行[おこな]うよりもましである。"
  18: "キリストも、あなたがたのために、罪[つみ]のために一度[いちど]死[し]なれた。正[ただ]しい方[かた]であるキリストが不正[ふせい]な者[もの]たちのために死[し]なれ、あなたがたを神[かみ]に導[みちび]き入[い]れるためであった。肉[にく]においては殺[ころ]され、霊[れい]においてはいのちを与[あた]えられて、"
  19: "その霊[れい]によって、獄[ひとや]にいる霊[れい]たちのところへ行[い]き、宣[の]べ伝[つた]えられた。"
  20: "かつて、ノアの日[ひ]に、箱舟[はこぶね]が造[つく]られている間[あいだ]、神[かみ]が忍耐[にんたい]をもって待[ま]っておられたとき、従[したが]わなかった霊[れい]たちである。その箱舟[はこぶね]に入[はい]って、わずかな者[もの]、すなわち八[やっ]人[にん]だけが水[みず]を通[とお]って救[すく]われた。"
  21: "この水[みず]は、今[いま]あなたがたをも救[すく]う洗礼[せんれい]の型[かた]である。洗礼[せんれい]は、肉[にく]の汚[けが]れを洗[あら]い落[お]とすことではなく、神[かみ]に善[よ]い良心[りょうしん]を求[もと]めることである。それは、イエス・キリストの復活[ふっかつ]によるのであり、"
  22: "キリストは天[てん]に上[のぼ]って、神[かみ]の右[みぎ]におられる。天使[てんし]たちも、権威[けんい]も、力[ちから]も、キリストに服[ふく]させられたのである。"

notes:
  1: "Ὁμοίως αἱ γυναῖκες — 同じように、妻たちよ ([αἱ] в базе есть). ὑποτασσόμεναι — 従いなさい (причастие как императив, ср. 2:18; 3:7). ἄνευ λόγου — 言葉によらずして. κερδηθήσονται — 得られる (будущее: приобретены)."
  2: "ἐποπτεύσαντες — 見る (ср. 2:12). τὴν ἐν φόβῳ ἁγνὴν ἀναστροφὴν — 慎み深く清い行い; ἐν φόβῳ — «в страхе», передано 慎み深く. Стих продолжает 3:1: «видя ваше чистое поведение»."
  3: "ἔξωθεν ἐμπλοκὴ τριχῶν, περίθεσις χρυσίων, ἔνδυσις ἱματίων — 髪を編むこと、金の飾り、衣をまとうこと; три внешних украшения сохранены. κόσμος — 飾り."
  4: "ὁ κρυπτὸς τῆς καρδίας ἄνθρωπος — 心の内に隠れた人. ἐν τῷ ἀφθάρτῳ τοῦ πραέως καὶ ἡσυχίου πνεύματος — 朽ちない、柔和で静かな霊によって; πραΰς — кроткий; ἡσύχιος — тихий. πολυτελές — 高価な (ср. 1 Тим 2:9)."
  5: "αἱ ἅγιαι γυναῖκες αἱ ἐλπίζουσαι εἰς θεόν — 神に希望を置いていた聖なる女たち. ἐκόσμουν ἑαυτάς — 自分自身を飾っていた (имперфект: обычай). ὑποτασσόμεναι — 従いつつ."
  6: "Σάρρα — サラ (совр. форма имени). ὑπήκουσεν — 従い. κύριον αὐτὸν καλοῦσα — 彼を主と呼んで (Быт 18:12). ἧς ἐγενήθητε τέκνα — サラの子どもたちとなる. πτόησις — 脅し, устрашение (hapax)."
  7: "συνοικοῦντες κατὰ γνῶσιν — 知識に基づいてともに暮らし (κατὰ γνῶσιν — «разумно, с пониманием»). ἀσθενέστερον σκεῦος — 弱い器. ἀπονέμοντες τιμήν — 敬い. συγκληρονόμοις χάριτος ζωῆς — いのちの恵みをともに受け継ぐ者. εἰς τὸ μὴ ἐγκόπτεσθαι τὰς προσευχάς — 祈りが妨げられないため."
  8: "Τὸ δὲ τέλος — 最後に. ὁμόφρονες, συμπαθεῖς, φιλάδελφοι, εὔσπλαγχνοι, ταπεινόφρονες — 心を同じくし、同情し、兄弟を愛し、あわれみ深く、謙遜 (пять прилагательных сохранены)."
  9: "μὴ ἀποδιδόντες — 報いてはならない. λοιδορία — ののしり. τοὐναντίον — それとは逆に. εὐλογοῦντες — 祝福しなさい. εἰς τοῦτο ἐκλήθητε ἵνα εὐλογίαν κληρονομήσητε — 祝福を受け継ぐために召された."
  10: "Цитата Пс 34:13–17 (LXX 33:13–17). ὁ θέλων ζωὴν ἀγαπᾶν — いのちを愛し. ἰδεῖν ἡμέρας ἀγαθάς — 良い日々を見たいと願う. παυσάτω τὴν γλῶσσαν ἀπὸ κακοῦ — 舌を悪から遠ざけなさい. χείλη τοῦ μὴ λαλῆσαι δόλον — 唇を偽りを語ることから."
  11: "ἐκκλινάτω ἀπὸ κακοῦ — 悪から遠ざかって. ποιησάτω ἀγαθόν — 善を行い. ζητησάτω εἰρήνην καὶ διωξάτω αὐτήν — 平和を求めてそれを追い求めよ. Продолжение той же цитаты."
  12: "ὀφθαλμοὶ κυρίου ἐπὶ δικαίους — 主の目は正しい者たちの上に. ὦτα αὐτοῦ εἰς δέησιν αὐτῶν — その耳は彼らの祈りに. πρόσωπον δὲ κυρίου ἐπὶ ποιοῦντας κακά — 主の顔は悪を行う者たちに敵対する; LXX добавляет «истребить их с земли», в базе этого нет — не добавлено. Конец цитаты."
  13: "τίς ὁ κακώσων ὑμᾶς — だれがあなたがたを害することができようか. ζηλωταὶ τοῦ ἀγαθοῦ — 善に熱心な者."
  14: "εἰ καὶ πάσχοιτε διὰ δικαιοσύνην — 義のために苦しみを受けるとしても (оптатив). μακάριοι — 幸いである. τὸν δὲ φόβον αὐτῶν μὴ φοβηθῆτε — 彼らが恐れるものを恐れてはならない (Ис 8:12; отсылка, не цитата по списку). μηδὲ ταραχθῆτε — 動揺してはならない."
  15: "κύριον δὲ τὸν Χριστὸν ἁγιάσατε — キリストを主として聖としなさい. ἕτοιμοι ἀεὶ πρὸς ἀπολογίαν — いつでも答える用意をして. λόγον αἰτοῦντι περὶ τῆς ἐν ὑμῖν ἐλπίδος — あなたがたのうちにある希望について説明を求める者."
  16: "μετὰ πραΰτητος καὶ φόβου — 柔和と恐れとをもって. συνείδησιν ἀγαθήν — 善い良心. ἐν ᾧ καταλαλεῖσθε — あなたがたを中傷するそのことで. οἱ ἐπηρεάζοντες — 中傷する者たち. καταισχυνθῶσιν — 恥じを受ける."
  17: "κρεῖττον — ましである. ἀγαθοποιοῦντας … πάσχειν ἢ κακοποιοῦντας — 善を行っていながら苦しむほうが、悪を行うよりも. εἰ θέλοι τὸ θέλημα τοῦ θεοῦ — たとえ神の御心がそう望まれる場合でも (условное наклонение)."
  18: "ὅτι καὶ Χριστὸς ἅπαξ περὶ ἁμαρτιῶν ἀπέθανεν — キリストも罪のために一度死なれた. [ὑπὲρ ὑμῶν] в базе есть — あなたがたのために, без 〔〕. δίκαιος ὑπὲρ ἀδίκων — 正しい方であるキリストが不正な者たちのために. ἵνα ὑμᾶς προσαγάγῃ τῷ θεῷ — あなたがたを神に導き入れるためであった. θανατωθεὶς σαρκὶ ζῳοποιηθεὶς πνεύματι — 肉においては殺され、霊においてはいのちを与えられ."
  19: "ἐν ᾧ — その霊によって (ἐν ᾧ относится к πνεύματι 3:18). τοῖς ἐν φυλακῇ πνεύμασιν — 獄にいる霊たち. πορευθεὶς ἐκήρυξεν — 行き、宣べ伝えられた; πορευθείς в базе ЕСТЬ (проверено), поэтому 〔〕 нет. Это не прямая речь Христа — <j> не ставится."
  20: "ἀπειθήσασίν ποτε — かつて従わなかった霊たち. ὅτε ἀπεξεδέχετο ἡ τοῦ θεοῦ μακροθυμία — 神が忍耐をもって待っておられたとき. ἐν ἡμέραις Νῶε — ノアの日に. κατασκευαζομένης κιβωτοῦ — 箱舟が造られている間. ὀκτὼ ψυχαί — 八つの魂 (восемь человек, ср. Быт 7:13). διεσώθησαν δι᾽ ὕδατος — 水を通って救われた."
  21: "ἀντίτυπον — 型 (прообраз). βάπτισμα — 洗礼. οὐ σαρκὸς ἀπόθεσις ῥύπου — 肉の汚れを洗い落とすことではなく. συνειδήσεως ἀγαθῆς ἐπερώτημα εἰς θεόν — 神に善い良心を求めること; ἐπερώτημα — «вопрошание, прошение, обещание» (hapax), передано по jp-joc 求むる事; значение спорно (ср. Синодальный «обещание»). δι᾽ ἀναστάσεως Ἰησοῦ Χριστοῦ — イエス・キリストの復活による."
  22: "ὅς ἐστιν ἐν δεξιᾷ τοῦ θεοῦ — 神の右におられる ([τοῦ] в базе есть). πορευθεὶς εἰς οὐρανόν — 天に上って. ὑποταγέντων αὐτῷ ἀγγέλων καὶ ἐξουσιῶν καὶ δυνάμεων — 天使たちも、権威も、力も、キリストに服させられた (три чина сохранены)."
