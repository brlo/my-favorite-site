verses:
  0: "ダビデの詩[うた]。教[おし]えの歌[うた]。"
  1: "幸[さいわ]いなのは、不法[ふほう]を赦[ゆる]され、罪[つみ]をおおわれた者[もの]である。"
  2: "幸[さいわ]いなのは、主[しゅ]が罪[つみ]を数[かぞ]えない人[ひと]、その口[くち]に偽[いつわ]りのない人[ひと]である。"
  3: "わたしが黙[だま]っていたとき、わたしの骨[ほね]は古[ふる]びた。一日中[いちにちじゅう]叫[さけ]び続[つづ]けたからである。"
  4: "昼[ひる]も夜[よる]も、あなたの手[て]はわたしの上[うえ]に重[おも]くのしかかった。茨[いばら]が刺[さ]さったとき、わたしは苦[くる]しみに沈[しず]んだ。"
  5: "わたしは自分の罪[つみ]を知[し]らせ、自分の不法[ふほう]を隠[かく]さなかった。「主[しゅ]に、わたしの不法[ふほう]を告白[こくはく]しよう」と、わたしは言[い]った。すると、あなたはわたしの罪[つみ]の不敬[ふけい]を赦[ゆる]された。"
  6: "それゆえ、聖[せい]なる者[もの]はすべて、ふさわしい時[とき]にあなたに祈[いの]る。大水[おおみず]が溢[あふ]れても、それはその人[ひと]に及[およ]ばない。"
  7: "あなたは、わたしを囲[かこ]む苦[くる]しみからの逃[に]げ場[ば]である。わたしの喜[よろこ]びよ、わたしを囲[かこ]む者[もの]らからわたしを贖[あがな]い出[だ]してください。"
  8: "「わたしはあなたに悟[さと]りを与[あた]え、あなたが行[ゆ]くべきこの道[みち]を教[おし]えよう。わたしはあなたに目[め]を注[そそ]ぐ。」"
  9: "「あなたがたは、悟[さと]りのない馬[うま]やラバのようになってはならない。くつわと口輪[くちわ]とでその口[くち]を締[し]めなければ、あなたに近[ちか]づかない。」"
  10: "悪[わる]い者[もの]には多[おお]くの災[わざわ]いがある。しかし、主[しゅ]に望[のぞ]みを置[お]く者[もの]は、あわれみに囲[かこ]まれる。"
  11: "正[ただ]しい者[もの]たちよ、主[しゅ]にあって喜[よろこ]び、楽[たの]しめ。心[こころ]のまっすぐな者[もの]よ、すべて誇[ほこ]れ。"

notes:
  0: "Τῷ Δαυιδ· συνέσεως — ダビデの詩。教えの歌 (σύνεσις — «разумение, наставление»; Синодальный «Учение», jp-joc 敎訓). Надписание — стих 0."
  1: "Μακάριοι ὧν ἀφέθησαν αἱ ἀνομίαι — 幸いなのは、不法を赦され…た者である (ἀφίημι — «отпускать»; ἀνομία — «беззаконие»; оборот 幸いなのは…である — как Пс 1:1). ὧν ἐπεκαλύφθησαν αἱ ἁμαρτίαι — 罪をおおわれた (ἐπικαλύπτω — «покрывать»); два причастия без глагола сохранены."
  2: "μακάριος ἀνήρ, οὗ οὐ μὴ λογίσηται κύριος ἁμαρτίαν — 幸いなのは、主が罪を数えない人 (λογίζομαι — «вменять, считать»). οὐδὲ ἔστιν ἐν τῷ στόματι αὐτοῦ δόλος — その口に偽りのない人 (δόλος — «лукавство»)."
  3: "ὅτι ἐσίγησα, ἐπαλαιώθη τὰ ὀστᾶ μου — わたしが黙っていたとき、わたしの骨は古びた (σιγάω — «молчать»; παλαιόω — «старить»). ἀπὸ τοῦ κράζειν με ὅλην τὴν ἡμέραν — 一日中叫び続けたからである (κράζω — «вопить»)."
  4: "ὅτι ἡμέρας καὶ νυκτὸς ἐβαρύνθη ἐπ᾿ ἐμὲ ἡ χείρ σου — 昼も夜も、あなたの手はわたしの上に重くのしかかった (βαρύνω — «отягощать»). ἐστράφην εἰς ταλαιπωρίαν — わたしは苦しみに沈んだ (ταλαιπωρία — «страдание»). ἐν τῷ ἐμπαγῆναι ἄκανθαν — 茨が刺さったとき (πήγνυμι — «вонзать»; ἄκανθα — «терн»); слав. «внегда вонзетися тернию». διάψαλμα в конце стиха не передаётся."
  5: "τὴν ἁμαρτίαν μου ἐγνώρισα — わたしは自分の罪を知らせ (γνωρίζω — «давать знать»). τὴν ἀνομίαν μου οὐκ ἐκάλυψα — 自分の不法を隠さなかった. εἶπα Ἐξαγορεύσω κατ᾿ ἐμοῦ τὴν ἀνομίαν μου τῷ κυρίῳ — 「主に、わたしの不法を告白しよう」と言った (ἐξαγορεύω — «открыто объявлять»); слова псалмопевца — 「」. σὺ ἀφῆκας τὴν ἀσέβειαν τῆς ἁμαρτίας μου — あなたはわたしの罪の不敬を赦された (ἀσέβεια — «нечестие»)."
  6: "ὑπὲρ ταύτης προσεύξεται πᾶς ὅσιος πρὸς σὲ ἐν καιρῷ εὐθέτῳ — それゆえ、聖なる者はすべて、ふさわしい時にあなたに祈る (εὔθετος — «удобный, благопотребный»). πλὴν ἐν κατακλυσμῷ ὑδάτων πολλῶν πρὸς αὐτὸν οὐκ ἐγγιοῦσιν — 大水が溢れても、それはその人に及ばない (κατακλυσμός — «потоп»; ἐγγίζω — «приближаться»)."
  7: "σύ μου εἶ καταφυγὴ ἀπὸ θλίψεως τῆς περιεχούσης με — あなたは、わたしを囲む苦しみからの逃げ場 (καταφυγή — «прибежище»; περιέχω — «объемлить»). τὸ ἀγαλλίαμά μου — わたしの喜びよ (звательный падеж; слав. «радосте моя»). λύτρωσαί με ἀπὸ τῶν κυκλωσάντων με — わたしを囲む者らからわたしを贖い出してください (κυκλόω — «окружать»)."
  8: "συνετιῶ σε καὶ συμβιβῶ σε ἐν ὁδῷ ταύτῃ, ᾗ πορεύσῃ — わたしはあなたに悟りを与え、あなたが行くべきこの道を教えよう (συνετίζω — «вразумлять»; συμβιβάζω — «наставлять»). ἐπιστηριῶ ἐπὶ σὲ τοὺς ὀφθαλμούς μου — わたしはあなたに目を注ぐ (ἐπιστηρίζω — «утверждать»). Это слова Господа, как и ст. 9 (в jp-joc отмечены знаком ○), поэтому 「」 первого уровня."
  9: "μὴ γίνεσθε ὡς ἵππος καὶ ἡμίονος — 悟りのない馬やラバのようになってはならない (ἡμίονος — «меск, лошак»). οἷς οὐκ ἔστιν σύνεσις — 悟りのない (σύνεσις — «разумение»). ἐν χαλινῷ καὶ κημῷ τὰς σιαγόνας αὐτῶν ἄγξαι — くつわと口輪とでその口を締めなければ (χαλινός — «узда»; κημός — «удила, намордник»; редкие кандзи 轡 и 銜 в 常用漢字 не входят, потому каной). τῶν μὴ ἐγγιζόντων πρὸς σέ — あなたに近づかない; слав. «не приближающихся к тебе», Синодальный по евр. «чтобы они покорялись тебе»; оставлено греческое и славянское чтение."
  10: "πολλαὶ αἱ μάστιγες τοῦ ἁμαρτωλοῦ — 悪い者には多くの災いがある (μάστιξ — «бич, казнь»). τὸν δὲ ἐλπίζοντα ἐπὶ κύριον ἔλεος κυκλώσει — 主に望みを置く者は、あわれみに囲まれる (κυκλόω — «окружать»)."
  11: "εὐφράνθητε ἐπὶ κύριον καὶ ἀγαλλιᾶσθε, δίκαιοι — 正しい者たちよ、主にあって喜び、楽しめ. καυχᾶσθε, πάντες οἱ εὐθεῖς τῇ καρδίᾳ — 心のまっすぐな者よ、すべて誇れ (καυχάομαι — «хвалиться, торжествовать»)."
