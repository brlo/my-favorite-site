verses:
  1: "イエスはこれらのことを言[い]ってから、弟子[でし]たちと一緒[いっしょ]にケドロン⟨エルサレムの東[ひがし]を流[なが]れる谷川[たにがわ]。⟩の谷川[たにがわ]の向[む]こう側[がわ]へ出[で]て行[い]かれた。そこには園[その]があり、イエスと弟子たちはその中に入[はい]られた。"
  2: "イエスを裏切[うらぎ]るユダも、その場所[ばしょ]を知[し]っていた。イエスが弟子たちと一緒[いっしょ]に、しばしばそこに集[あつ]まっておられたからである。"
  3: "そこでユダは、部隊[ぶたい]と、祭司長[さいしちょう]たちとファリサイ派[は]から遣[つか]わされた下役[したやく]たちを連[つ]れて、灯[ともしび]とたいまつと武器[ぶき]を持[も]って、そこへ来[き]た。"
  4: "イエスは、ご自分[じぶん]に降[ふ]りかかるすべてのことを知[し]っておられ、進[すす]み出[で]て彼[かれ]らに言[い]われた。「<j>だれを捜[さが]しているのか。</j>」"
  5: "彼[かれ]らは答[こた]えた。「ナザレのイエスだ。」イエスは言[い]われた。「<j>このわたしである。</j>」イエスを裏切[うらぎ]るユダも、彼らと一緒[いっしょ]に立[た]っていた。"
  6: "イエスが「このわたしである」と言[い]われると、彼[かれ]らは後[うし]ろへ退[しりぞ]き、地[ち]に倒[たお]れた。"
  7: "イエスはまた彼[かれ]らに尋[たず]ねられた。「<j>だれを捜[さが]しているのか。</j>」彼らは言[い]った。「ナザレのイエスだ。」"
  8: "イエスは答えられた。「<j>このわたしである、とあなたがたに言[い]った。だから、わたしを捜[さが]しているのなら、この者[もの]たちを去[さ]らせなさい。</j>」"
  9: "それは、「あなたがわたしに与[あた]えられた者[もの]のうち、わたしは一人[ひとり]も失[うしな]わなかった」とイエスが言[い]われた言葉[ことば]が成就[じょうじゅ]するためであった。"
  10: "シモン・ペトロは剣[けん]を持[も]っていて、それを抜[ぬ]き、大祭司[だいさいし]の僕[しもべ]を打[う]ち、その右[みぎ]の耳[みみ]を切[き]り落[お]とした。僕の名[な]はマルハスといった。"
  11: "イエスはペトロに言[い]われた。「<j>剣[けん]を鞘[さや]に納[おさ]めなさい。父[ちち]がわたしに与[あた]えられた杯[さかずき]を、わたしが飲[の]まないはずがあろうか。</j>」"
  12: "そこで、部隊[ぶたい]と千人隊長[せんにんちょう]とユダヤ人[じん]の下役[したやく]たちは、イエスを捕[と]らえて縛[しば]り、"
  13: "まずアンナスのもとへ連[つ]れて行[い]った。アンナスは、その年[とし]の大祭司[だいさいし]であったカヤパのしゅうとであったからである。"
  14: "カヤパは、民[たみ]のためにひとりの人[ひと]が死[し]ぬことが益[えき]になると、ユダヤ人[じん]たちに勧[すす]めた者[もの]である。"
  15: "シモン・ペトロと、もう一人[ひとり]の弟子[でし]がイエスについて行[い]った。その弟子は大祭司[だいさいし]の知[し]り合[あ]いで、イエスと一緒[いっしょ]に大祭司の屋敷[やしき]の中庭[なかにわ]に入[はい]った。"
  16: "しかし、ペトロは門[もん]の外[そと]に立[た]っていた。大祭司[だいさいし]の知り合いであるその弟子[でし]が出[で]て来[き]て、門を守[まも]る女[おんな]に話[はな]し、ペトロを中[なか]へ入[い]れた。"
  17: "そこで、門を守[まも]る女中[じょちゅう]がペトロに言[い]った。「あなたも、この人[ひと]の弟子[でし]の一人[ひとり]ではないのか。」ペトロは言った。「そうではない。」"
  18: "僕[しもべ]たちと下役[したやく]たちは、寒[さむ]かったので炭火[すみび]を起[お]こして、立[た]って暖[あたた]まっていた。ペトロも彼[かれ]らと一緒[いっしょ]に立って暖まっていた。"
  19: "大祭司[だいさいし]はイエスに、弟子[でし]たちのことと、その教[おし]えについて尋[たず]ねた。"
  20: "イエスは答えられた。「<j>わたしは世[よ]に向[む]かって公然[こうぜん]と話[はな]してきた。わたしはいつも、ユダヤ人[じん]がみな集[あつ]まる会堂[かいどう]や神殿[しんでん]で教[おし]えてきた。隠[かく]れて話したことは何[なに]もない。</j>"
  21: "<j>なぜわたしに尋[たず]ねるのか。わたしが何[なに]を話[はな]したか、聞[き]いた者[もの]たちに尋ねなさい。見[み]よ、この者[もの]たちは、わたしが言[い]ったことを知[し]っている。</j>」"
  22: "イエスがこう言[い]われると、そばに立[た]っていた下役[したやく]の一人[ひとり]が、イエスの頬[ほお]を平手[ひらて]で打[う]って言った。「大祭司[だいさいし]に対して、そのように答[こた]えるのか。」"
  23: "イエスは答えられた。「<j>わたしが悪[わる]いことを言[い]ったのなら、その悪いことについて証言[しょうげん]しなさい。正[ただ]しいことを言ったのなら、なぜわたしを打[う]つのか。</j>」"
  24: "そこで、アンナスはイエスを縛[しば]ったまま、大祭司[だいさいし]カヤパのところへ送[おく]った。"
  25: "シモン・ペトロは立[た]って暖[あたた]まっていた。そこで人々[ひとびと]が彼[かれ]に言[い]った。「あなたも、あの人[ひと]の弟子[でし]の一人[ひとり]ではないのか。」ペトロは否[いな]んで言った。「そうではない。」"
  26: "大祭司[だいさいし]の僕[しもべ]の一人[ひとり]で、ペトロが耳[みみ]を切[き]り落[お]とした者[もの]の親戚[しんせき]が言[い]った。「わたしは、あなたが彼[かれ]と一緒[いっしょ]に園[その]にいるのを見[み]たではないか。」"
  27: "ペトロはまた否[いな]んだ。すると、すぐに鶏[にわとり]が鳴[な]いた。"
  28: "そこで、人々[ひとびと]はイエスをカヤパのところから総督官邸[そうとくかんてい]へ連[つ]れて行[い]った。時[とき]はまだ早[はや]かった。彼[かれ]らは総督官邸の中に入[はい]らなかった。身[み]を汚[けが]さず、過越祭[すぎこしまつり]の食事[しょくじ]を食[た]べられるようにするためであった。"
  29: "そこでピラトは外[そと]へ出[で]て彼[かれ]らのところへ来[き]て言[い]った。「この人[ひと]に対して、どんな罪状[ざいじょう]を申[もう]し立[た]てるのか。」"
  30: "彼[かれ]らは答[こた]えた。「この者[もの]が悪[あく]を行[おこな]う者でなければ、わたしたちはこの者をあなたに引[ひ]き渡[わた]しはしなかった。」"
  31: "ピラトは彼[かれ]らに言[い]った。「あなたがたがこの者[もの]を引[ひ]き取[と]って、自分[じぶん]たちの律法[りっぽう]に従[したが]って裁[さば]くがよい。」ユダヤ人[じん]たちは言った。「わたしたちには、だれも死刑[しけい]に処[しょ]することが許[ゆる]されていないのです。」"
  32: "それは、イエスが、ご自分[じぶん]がどのような死[し]を遂[と]げることになるかを示[しめ]して言[い]われた言葉[ことば]が成就[じょうじゅ]するためであった。"
  33: "そこでピラトは再[ふたた]び総督官邸[そうとくかんてい]に入[はい]り、イエスを呼[よ]んで言[い]った。「あなたはユダヤ人[じん]の王[おう]なのか。」"
  34: "イエスは答えられた。「<j>あなたは自分[じぶん]でそう言[い]っているのか、それとも、ほかの者[もの]がわたしについてあなたに言ったのか。</j>」"
  35: "ピラトは答[こた]えた。「わたしがユダヤ人[じん]だとでも言[い]うのか。あなたの民[たみ]と祭司長[さいしちょう]たちが、あなたをわたしに引[ひ]き渡[わた]したのだ。あなたは何[なに]をしたのか。」"
  36: "イエスは答えられた。「<j>わたしの国[くに]はこの世[よ]のものではない。わたしの国がこの世のものであったなら、わたしの下役[したやく]たちが戦[たたか]って、わたしがユダヤ人[じん]たちに引[ひ]き渡[わた]されないようにしたであろう。しかし、今[いま]、わたしの国はここから出[で]たものではない。</j>」"
  37: "ピラトはイエスに言[い]った。「それなら、あなたは王[おう]なのか。」イエスは答えられた。「<j>あなたが、わたしが王であると言っている。わたしは真理[しんり]のために生[う]まれ、真理のために世[よ]に来[き]た。真理に属[ぞく]する者[もの]は、だれでもわたしの声[こえ]を聞[き]く。</j>」"
  38: "ピラトは言[い]った。「真理[しんり]とは何[なに]か。」そう言ってから、また外[そと]へ出[で]てユダヤ人[じん]たちのところへ行[い]き、言った。「わたしはこの者[もの]に何[なん]の罪[つみ]も見[み]いださない。」"
  39: "だが、あなたがたには、過越祭[すぎこしまつり]に一人[ひとり]を釈放[しゃくほう]する慣習[かんしゅう]がある。それなら、ユダヤ人[じん]の王[おう]を釈放してほしいのか。"
  40: "彼[かれ]らはまた叫[さけ]んで言[い]った。「この者[もの]ではなく、バラバだ。」バラバは強盗[ごうとう]であった。"

notes:
  1: "χείμαρρος τοῦ Κεδρών — «поток Кедронский»; 谷川 (пересыхающий зимний поток). Сноска на ケドロン — первое упоминание в корпусе."
  3: "σπεῖρα — 部隊 (когорта, как в Мф 27:27; Мк 15:16). ὑπηρέται — 下役, как в Мк 14:54."
  5: "ἐγώ εἰμι без сказуемого — このわたしである. Та же формула в 18:6 и 18:8; в 18:6 не сглажено: они отступают и падают."
  6: "ἀπῆλθον εἰς τὰ ὀπίσω καὶ ἔπεσαν χαμαί — «отступили назад и упали на землю»; 後ろへ退き、地に倒れた. Слова Христа в пересказе рассказчика — не красным (ср. Лк 22:61)."
  8: "ἐγώ εἰμι — снова このわたしである, без замены на «это Я»."
  10: "Μάλχος — マルハス (совр. форма; у jp-joc マルホ)."
  11: "τὸ ποτήριον ὃ δέδωκέν μοι ὁ πατήρ — 父がわたしに与えられた杯; вопрос οὐ μὴ πίω αὐτό сохранён как вопрос."
  13: "πενθερός — しゅうと. カヤパ — современная форма; в lk_03 и mf_26 корпуса стоит カヤパ (расхождение вынесено на ревью)."
  15: "ἄλλος μαθητής — «другой ученик»; もう一人の弟子 (не Богородица, синего <mo> нет)."
  24: "ἀπέστειλεν… δεδεμένον — «послал его связанного»; 縛ったまま送った."
  28: "πραιτώριον — 総督官邸 (как в Мф 27:27; Мк 15:16). ἵνα μὴ μιανθῶσιν — 身を汚さず."
  31: "Ἡμῖν οὐκ ἔξεστιν ἀποκτεῖναι οὐδένα — «нам не позволено предавать смерти никого»; 死刑に処することを許されていない, без смягчения."
  36: "βασιλεία — 国 (как 神の国 в корпусе), не 王国. ἐκ τοῦ κόσμου τούτου — この世のもの."
  37: "γεγέννημαι… ἐλήλυθα — 生まれ…来た; εἰς τοῦτο — 真理のために."
  38: "Τί ἐστιν ἀλήθεια; — 真理とは何か. Вопрос Пилата оставлен без ответа и без разъяснения."
  39: "συνήθεια — 慣習; ἀπολύσω — 釈放する. В критическом тексте порядок «ваш обычай, чтобы я отпустил вам одного» сохранён."
