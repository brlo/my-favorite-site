# jp-box, Псалтирь, псалом 3. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0.
# Псалом 3: утренняя молитва гонимого — вопль (1–2), упование на Бога (3–4),
# мирный сон и бесстрашие (5–6), просьба о спасении (7–8).
# Красного и синего нет. Кавычки: слова врагов в 2 — 「…」 (первый уровень).
# 〔…〕 нет: все слова в gr-lxx-byz есть.
# セラ (διάψαλμα, в конце ст. 2 и 4) не передаётся — по решению пользователя, как у jp-joc.
# Сносок ⟨…⟩ нет: 盾, 聖山, 頬 уже в корпусе или понятны.
# jp-ni не использовался.

