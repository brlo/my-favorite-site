verses:
  0: "ダビデの詩[うた]。その子[こ]アブサロムから逃[に]げたときのもの。"
  1: "主[しゅ]よ、わたしを苦[くる]しめる者[もの]はなんと多[おお]いことか。わたしに立[た]ち向[む]かう者[もの]は多[おお]い。"
  2: "多[おお]くの者[もの]がわたしの魂[たましい]について、「神[かみ]の救[すく]いなど、この人[ひと]にはない」と言[い]う。"
  3: "しかし、主[しゅ]よ、あなたはわたしを囲[かこ]む盾[たて]、わたしの栄光[えいこう]、わたしの頭[あたま]を高[たか]く上[あ]げてくださる方[かた]である。"
  4: "わたしが声[こえ]を上[あ]げて主[しゅ]に呼[よ]ぶと、主[しゅ]はその聖[せい]なる山[やま]からわたしに答[こた]えてくださる。"
  5: "わたしは身[み]を横[よこ]たえて眠[ねむ]り、また目[め]を覚[さ]ます。主[しゅ]がわたしを支[ささ]えてくださるからである。"
  6: "わたしを取[と]り囲[かこ]む幾万[いくまん]の民[たみ]を、わたしは恐[おそ]れない。"
  7: "主[しゅ]よ、立[た]ち上[あ]がってください。わたしの神[かみ]よ、わたしを救[すく]ってください。あなたは、わたしに敵対[てきたい]するすべての者[もの]の頬[ほお]を打[う]ち、悪[わる]い者[もの]の歯[は]を折[お]られたからである。"
  8: "救[すく]いは主[しゅ]のものであり、あなたの祝福[しゅくふく]はあなたの民[たみ]の上[うえ]にある。"

notes:
  0: "Ψαλμὸς τῷ Δαυιδ, ὁπότε ἀπεδίδρασκεν ἀπὸ προσώπου Αβεσσαλωμ τοῦ υἱοῦ αὐτοῦ — ダビデの詩、その子アブサロムから逃げたときのもの (ἀποδιδράσκω — «убегать»; Авессалом — アブサロム, современная форма). Надписание — стих 0."
  1: "Κύριε, τί ἐπληθύνθησαν οἱ θλίβοντές με — 主よ、わたしを苦しめる者はなんと多いことか (πληθύνω — «умножиться»; θλίβω — «теснить, притеснять»). πολλοὶ ἐπανίστανται ἐπ᾽ ἐμέ — わたしに立ち向かう者は多い (ἐπανίστημι — «восставать»)."
  2: "πολλοὶ λέγουσιν τῇ ψυχῇ μου — 多くの者がわたしの魂について言う (ψυχή — 魂; датив «душе моей» передан について). Οὐκ ἔστιν σωτηρία αὐτῷ ἐν τῷ θεῷ αὐτοῦ — 神の救いなど、この人にはない (σωτηρία — 救い). Слова врагов — 「」. διάψαλμα в конце стиха не передаётся."
  3: "σὺ δέ, κύριε, ἀντιλήμπτωρ μου εἶ — しかし主よ、あなたは…方である (ἀντιλήμπτωρ — «защитник, заступник»). δόξα μου — わたしの栄光. ὑψῶν τὴν κεφαλήν μου — わたしの頭を高く上げてくださる方 (ὑψόω — «возвышать»). 盾[たて] добавлено как образ ἀντιλήμπτωρ по церковной традиции (Синодальный «заступник», jp-joc 衞る盾)."
  4: "φωνῇ μου πρὸς κύριον ἐκέκραξα — わたしが声を上げて主に呼ぶと (κράζω — «взывать»). ἐπήκουσέν μου ἐξ ὄρους ἁγίου αὐτοῦ — その聖なる山からわたしに答えてくださる (ἐπακούω — «услышать, ответить»)."
  5: "ἐγὼ ἐκοιμήθην καὶ ὕπνωσα — わたしは身を横たえて眠り (два глагола, «лёг и уснул»). ἐξηγέρθην ὅτι κύριος ἀντιλήμψεταί μου — また目を覚ます、主がわたしを支えてくださるから (ἀντιλαμβάνω — «поддерживать»)."
  6: "οὐ φοβηθήσομαι ἀπὸ μυριάδων λαοῦ — 幾万の民を恐れない (μυριάς — «десятки тысяч, тьмы»). τῶν κύκλῳ συνεπιτιθεμένων μοι — わたしを取り囲む (κύκλῳ — «вокруг»; συνεπιτίθεμαι — «совместно нападать»)."
  7: "ἀνάστα, κύριε, σῶσόν με — 主よ、立ち上がってください、わたしを救ってください. ὅτι σὺ ἐπάταξας πάντας τοὺς ἐχθραίνοντάς μοι ματαίως — あなたは、わたしに敵対するすべての者の頬を打ち (ἐχθραίνω — «враждовать»; ματαίως — «напрасно»). ὀδόντας ἁμαρτωλῶν συνέτριψας — 悪い者の歯を折られた (συντρίβω — «сокрушить»)."
  8: "τοῦ κυρίου ἡ σωτηρία — 救いは主のものであり. καὶ ἐπὶ τὸν λαόν σου ἡ εὐλογία σου — あなたの祝福はあなたの民の上にある. Формула сохранена без добавлений."
