# jp-box, 1-е Послание к Солунянам, глава 2. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 2: приход не был напрасным (1–2), проповедь не из обмана и не ради славы (3–6),
# нежность кормилицы и ночной труд (7–9), свидетельство совести (10–12),
# благодарение за принятое слово (13), страдания от своих (14–16),
# разлука и желание увидеться (17–18), радость и венец — они (19–20).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет, <j>/<mo> не ставятся.
# 〔…〕 в главе нет: в gr-lxx-byz нет ни одного слова в квадратных скобках (проверено по базе).
# Цитат Писания нет. Сносок ⟨…⟩ нет: 乳母 и 使徒 — обычные слова, 患難 уже в корпусе.
# Образы 2:7 (кормилица) и 2:11 (отец) сохранены. jp-ni не использовался.

tr_code: jp-box
book: 1sol
chapter: 2
draft: true

verses:
  1: "というのは、兄弟[きょうだい]たちよ、あなたがた自身[じしん]が知[し]っているとおり、わたしたちがあなたがたを訪[おとず]れたことは、むだではなかった。"
  2: "かえって、あなたがたが知[し]っているとおり、わたしたちはフィリピで前[まえ]に苦[くる]しみを受[う]け、辱[はずかし]められて、わたしたちの神[かみ]によって勇気[ゆうき]を得[え]、大[おお]きな苦闘[くとう]のうちに、あなたがたに神[かみ]の福音[ふくいん]を語[かた]ったのである。"
  3: "というのは、わたしたちの勧[すす]めは、迷[まよ]いからも、汚[けが]れからも、偽[いつわ]りからも出[で]たものではないからである。"
  4: "かえって、わたしたちは、神[かみ]に認[みと]められて福音[ふくいん]を託[たく]された者[もの]として語[かた]っている。人[ひと]に喜[よろこ]ばれようとするのではなく、わたしたちの心[こころ]を試[ため]される神[かみ]に喜[よろこ]ばれようとしているのである。"
  5: "というのは、あなたがたが知[し]っているとおり、わたしたちはかつてお世辞[せじ]の言葉[ことば]を口[くち]にしたこともなく、貪[むさぼ]りを口実[こうじつ]にしたこともないからである。神[かみ]が証人[しょうにん]である。"
  6: "また、あなたがたからであれ、ほかの者[もの]たちからであれ、人[ひと]からの栄誉[えいよ]を求[もと]めたことはない。"
  7: "わたしたちは、キリストの使徒[しと]として、重[おも]荷[に]を負[お]わせることもできた。しかし、あなたがたの間[あいだ]で、乳母[うば]が自分[じぶん]の子[こ]どもを抱[だ]いて温[あたた]めるように、優[やさ]しい者[もの]となった。"
  8: "こうして、わたしたちはあなたがたを慕[した]いながら、あなたがたに神[かみ]の福音[ふくいん]だけでなく、わたしたち自身[じしん]の命[いのち]さえも与[あた]えたいと願[ねが]った。なぜなら、あなたがたはわたしたちの愛[あい]する者[もの]となったからである。"
  9: "というのは、兄弟[きょうだい]たちよ、あなたがたは、わたしたちの労苦[ろうく]と骨折[ほねお]りを覚[おぼ]えているからである。わたしたちは、あなたがたのうちだれにも負担[ふたん]をかけまいとして、夜[よる]も昼[ひる]も働[はたら]きながら、あなたがたに神[かみ]の福音[ふくいん]を宣[の]べ伝[つた]えたのである。"
  10: "あなたがたも神[かみ]も証人[しょうにん]である。わたしたちが、信[しん]じているあなたがたに対[たい]して、どれほど聖[きよ]く、正[ただ]しく、責[せ]められるところなく振[ふ]る舞[ま]ったか。"
  11: "あなたがたが知[し]っているとおり、わたしたちは、父[ちち]が自分[じぶん]の子[こ]どもに対[たい]するように、あなたがた一人[ひとり]一人[ひとり]に、"
  12: "勧[すす]め、慰[なぐさ]め、証[あかし]しながら、あなたがたを、ご自分[じぶん]の国[くに]と栄光[えいこう]へと召[め]しておられる神[かみ]にふさわしく歩[あゆ]むよう促[うなが]したのである。"
  13: "また、わたしたちもこのために、絶[た]えず神[かみ]に感謝[かんしゃ]している。あなたがたが、わたしたちから聞[き]いた神[かみ]の御言葉[みことば]を受[う]け取[と]ったとき、それを人[ひと]の言葉[ことば]としてではなく、まさしく神[かみ]の御言葉[みことば]として受[う]け入[い]れたからである。この御言葉[みことば]は、信[しん]じているあなたがたのうちに働[はたら]いている。"
  14: "というのは、兄弟[きょうだい]たちよ、あなたがたは、ユダヤにあって、キリスト・イエスにある神[かみ]の諸[しょ]教会[きょうかい]に倣[なら]う者[もの]となったからである。あなたがたもまた、彼[かれ]らがユダヤ人[じん]たちから受[う]けたのと同[おな]じ苦[くる]しみを、自分[じぶん]たちの同族[どうぞく]から受[う]けたのである。"
  15: "彼[かれ]らは、主[しゅ]イエスと預言者[よげんしゃ]たちを殺[ころ]し、わたしたちを追[お]い出[だ]し、神[かみ]を喜[よろこ]ばせず、すべての人[ひと]に逆[さか]らっている。"
  16: "彼[かれ]らは、異邦人[いほうじん]が救[すく]われるためにわたしたちが語[かた]るのを妨[さまた]げている。こうして、彼らはいつも自分[じぶん]の罪[つみ]の量[りょう]を満[み]たしている。しかし、怒[いか]りはついに彼[かれ]らの上[うえ]に臨[のぞ]んだのである。"
  17: "しかし、兄弟[きょうだい]たちよ、わたしたちは、ほんの一時[いっとき]の間[あいだ]、あなたがたから顔[かお]を隔[へだ]てた。心[こころ]を隔てたのではない。それでも、わたしたちは、あなたがたの顔[かお]を見[み]たいと、非常[ひじょう]に強[つよ]く願[ねが]い、いっそう努[つと]めたのである。"
  18: "なぜなら、わたしたちは、あなたがたのところへ行[い]こうと願[ねが]ったからである。このわたしパウロは、一度[いちど]ならず二度[にど]も願った。しかし、サタンがわたしたちを妨[さまた]げたのである。"
  19: "というのは、わたしたちの希望[きぼう]とは何[なん]か、喜[よろこ]びとは何か、誇[ほこ]りの冠[かんむり]とは何か。わたしたちの主[しゅ]イエスの御前[みまえ]、その来臨[らいりん]のときに、あなたがたではないか。"
  20: "なぜなら、あなたがたこそ、わたしたちの栄光[えいこう]であり、喜[よろこ]びだからである。"

notes:
  1: "εἴσοδος — 訪問. οὐ κενὴ γέγονεν — むだではなかった. γάρ передан というのは."
  2: "προπαθόντες καὶ ὑβρισθέντες — 先に苦しみを受け、辱められ. Φίλιπποι — フィリピ. ἐπαρρησιασάμεθα ἐν τῷ θεῷ — 神によって勇気を得. ἐν πολλῷ ἀγῶνι — 大きな苦闘."
  3: "παράκλησις — 勧め. οὐκ ἐκ πλάνης οὐδὲ ἐξ ἀκαθαρσίας οὐδὲ ἐν δόλῳ — 迷いからも、汚れからも、偽りからも出たものではない."
  4: "δεδοκιμάσμεθα — 認められて. πιστευθῆναι τὸ εὐαγγέλιον — 福音を託される. οὐχ ὡς ἀνθρώποις ἀρέσκοντες — 人に喜ばれようとするのではなく. τῷ δοκιμάζοντι τὰς καρδίας — 心を試される神."
  5: "ἐν λόγῳ κολακείας — お世辞の言葉. ἐν προφάσει πλεονεξίας — 貪りを口実に. θεὸς μάρτυς — 神が証人である."
  6: "ἐξ ἀνθρώπων δόξαν — 人からの栄誉. Порядок «от вас… от других» переставлен для естественности, оба члена сохранены."
  7: "δυνάμενοι ἐν βάρει εἶναι — 重荷を負わせることもできた (букв. «быть в тяжести»; jp-joc понимает как 威嚴). ἤπιοι — 優しい; в критическом тексте νήπιοι («младенцы»), в базе ἤπιοι, поэтому переведено по базе. τροφός — 乳母; образ сохранён."
  8: "ὁμειρόμενοι — 慕いながら. εὐδοκοῦμεν μεταδοῦναι…τὰς ἑαυτῶν ψυχάς — 命さえも与えたいと願った. ἀγαπητοὶ ἡμῖν ἐγενήθητε — わたしたちの愛する者となった."
  9: "κόπος καὶ μόχθος — 労苦と骨折り. νυκτὸς καὶ ἡμέρας ἐργαζόμενοι — 夜も昼も働きながら. πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν — だれにも負担をかけまいとして. ἐκηρύξαμεν — 宣べ伝えた."
  10: "ὑμεῖς μάρτυρες καὶ ὁ θεός — あなたがたも神も証人. ὁσίως καὶ δικαίως καὶ ἀμέμπτως — 聖く、正しく、責められるところなく."
  11: "καθάπερ οἴδατε — あなたがたが知っているとおり. ὡς πατὴρ τέκνα ἑαυτοῦ — 父が自分の子にするように; образ отца сохранён. Стих продолжается в 12-м, как и в греч."
  12: "παρακαλοῦντες…παραμυθούμενοι…μαρτυρόμενοι — 勧め、慰め、証ししながら. ἀξίως τοῦ θεοῦ — 神にふさわしく. τοῦ καλοῦντος ὑμᾶς εἰς τὴν ἑαυτοῦ βασιλείαν καὶ δόξαν — ご自分の国と栄光へと召しておられる."
  13: "διὰ τοῦτο — このために. παραλαβόντες λόγον ἀκοῆς — 聞いた神の御言葉を受け取ったとき. οὐ λόγον ἀνθρώπων ἀλλὰ…λόγον θεοῦ — 人の言葉としてではなく、まさしく神の御言葉として. ὃς καὶ ἐνεργεῖται ἐν ὑμῖν — この御言葉は…うちに働いている."
  14: "μιμηταὶ τῶν ἐκκλησιῶν τοῦ θεοῦ τῶν ἐν τῇ Ἰουδαίᾳ — ユダヤにある神の諸教会に倣う者. ἐν Χριστῷ Ἰησοῦ — キリスト・イエスにある. συμφυλετῶν — 同族."
  15: "ἀποκτεινάντων — 殺し. ἐκδιωξάντων — 追い出し. θεῷ μὴ ἀρεσκόντων — 神を喜ばせず. πᾶσιν ἀνθρώποις ἐναντίων — すべての人に逆らっている."
  16: "κωλυόντων — 妨げている. εἰς τὸ ἀναπληρῶσαι…τὰς ἁμαρτίας πάντοτε — いつも自分の罪を満たしている. ἔφθασεν…ἡ ὀργὴ εἰς τέλος — 怒りはついに…臨んだ (εἰς τέλος — «до конца», передано ついに). τὰς ἁμαρτίας — 罪の量 (букв. «грехи»; 量 добавлено для ясности, как у jp-joc「罪の量」)."
  17: "ἀπορφανισθέντες — 孤どもになった. πρὸς καιρὸν ὥρας — ほんの一時の間. προσώπῳ οὐ καρδίᾳ — 顔を隔てた。心を隔てたのではない. περισσοτέρως ἐσπουδάσαμεν — いっそう努めた. ἐν πολλῇ ἐπιθυμίᾳ — 非常に強く願い."
  18: "διότι — なぜなら. ἐγὼ μὲν Παῦλος — このわたしパウロ. ἅπαξ καὶ δίς — 一度ならず二度も. ἐνέκοψεν…ὁ Σατανᾶς — サタンが妨げた."
  19: "τίς…ἡμῶν ἐλπὶς ἢ χαρὰ ἢ στέφανος καυχήσεως — 希望とは何か、喜びとは何か、誇りの冠とは何か; риторические вопросы сохранены. ἢ οὐχὶ καὶ ὑμεῖς — あなたがたではないか. ἐν τῇ αὐτοῦ παρουσίᾳ — その来臨のときに. В базе при Ἰησοῦ нет Χριστοῦ, не добавлено."
  20: "δόξα καὶ χαρά — 栄光と喜び; γάρ передан なぜなら…からである."
