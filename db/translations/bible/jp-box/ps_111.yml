# jp-box, Псалтирь, псалом 111. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация — славяно-синодальная (csl-ru): в слав. надписание отдельным стихом
# не стоит, поэтому наш стих 0 (надписание) влит в начало стиха 1; дальше номера 1..10.
# Разбивка — славяно-синодальная (csl-ru): число стихов то же, но границы иные:
# слав. 5 = гр. 5 + «в век не подвижится» (гр. 6a), 6 = гр. 6b, 7 = гр. 7a,
# 8 = гр. 7b + гр. 8 (наш 7+8); см. notes 5–8.
# Псалом 111: блаженство боящегося Господа (1), его потомство и дом (2–3),
# свет и милость (4–5), твердость и бесстрашие (6–8), щедрость и возвышение (9),
# досада грешника (10). Акростих еврейского текста не воспроизводится.
# Красного и синего нет. Кавычек нет: прямой речи в псалме нет.
# 〔…〕 нет: все слова в gr-lxx-byz есть.
# セラ (διάψαλμα) в этой главе нет.
# Сносок ⟨…⟩ нет: アレルヤ уже пояснено в Откр 19:1, прочее понятно.
# jp-ni не использовался.

tr_code: jp-box
book: ps
chapter: 111
draft: true

verses:
  1: "アレルヤ。幸[さいわ]いなのは、主[しゅ]を畏[おそ]れ、その戒[いまし]めを深[ふか]く愛[あい]する人[ひと]である。"
  2: "その子孫[しそん]は地[ち]にあって力[ちから]ある者[もの]となり、正[ただ]しい者[もの]たちの世代[せだい]は祝福[しゅくふく]される。"
  3: "富[とみ]と宝[たから]はその家[いえ]にあり、その義[ぎ]は世々[よよ]限[かぎ]りなく保[たも]たれる。"
  4: "光[ひかり]は暗[やみ]のうちに、正[ただ]しい者[もの]たちのために昇[のぼ]る。その人[ひと]はあわれみ深[ぶか]く、恵[めぐ]み深[ぶか]く、正[ただ]しい。"
  5: "善[よ]い人[ひと]はあわれみ深[ぶか]く、貸[か]し与[あた]え、その言葉[ことば]を裁[さば]きのときにも確[たし]かなものとする。その人[ひと]はとこしえに揺[ゆ]るがない。"
  6: "正[ただ]しい者[もの]は永遠[えいえん]の記念[きねん]として残[のこ]る。"
  7: "悪[わる]い知[し]らせを聞[き]いても恐[おそ]れない。"
  8: "その心[こころ]は主[しゅ]に寄[よ]り頼[たの]む用意[ようい]ができている。その心[こころ]は固[かた]く据[す]えられ、敵[てき]を見[み]る時[とき]にも恐[おそ]れない。"
  9: "その人[ひと]は散[ち]らし与[あた]え、貧[まず]しい者[もの]たちに施[ほどこ]した。その義[ぎ]は世々[よよ]限[かぎ]りなく保[たも]たれ、その角[つの]は栄光[えいこう]のうちに高[たか]く上[あ]げられる。"
  10: "罪[つみ]人[びと]はこれを見[み]て怒[いか]り、歯[は]を噛[か]み鳴[な]らして溶[と]け去[さ]る。罪[つみ]人[びと]たちの望[のぞ]みは滅[ほろ]びる。"

notes:
  1: "Αλληλουια — «хвалите Господа»; アレルヤ, как по всему корпусу (Откр 19:1, там же сноска при первом упоминании). В ру-базе надписание «Аллилуия» стоит стихом 0, поэтому и здесь стих 0 (в csl-ru отдельного стиха нет, влито в ст. 1). Μακάριος ἀνὴρ ὁ φοβούμενος τὸν κύριον — 幸いなのは、主を畏れ…人である (μακάριος — «блажен», как в Пс 1:1). ἐν ταῖς ἐντολαῖς αὐτοῦ θελήσει σφόδρα — その戒めを深く愛する (θέλημα/θέλω здесь «желать, любить»; ср. jp-joc 極めて愛する, Синодальный «крепко любящий»). 戒[いまし]め — ἐντολή, как в Пс 77."
  2: "δυνατὸν ἐν τῇ γῇ ἔσται τὸ σπέρμα αὐτοῦ — その子孫は地にあって力ある者となる (σπέρμα — «семя, потомство»). γενεὰ εὐθείων εὐλογηθήσεται — 正しい者たちの世代は祝福される (εὐθύς — «прямой, правый»; γενεά — не «род» в смысле клана, а поколение правых)."
  3: "δόξα καὶ πλοῦτος ἐν τῷ οἴκῳ αὐτοῦ — 富と宝はその家にあり (δόξα здесь в смысле внешнего блеска, «богатство и слава»; 宝 передаёт πλοῦτος, 富 — δόξα в этом контексте; ср. jp-joc 富と財). ἡ δικαιοσύνη αὐτοῦ μένει εἰς τὸν αἰῶνα τοῦ αἰῶνος — その義は世々限りなく保たれる (μένω — «пребывать»)."
  4: "ἐξανέτειλεν ἐν σκότει φῶς τοῖς εὐθέσιν — 光は闇のうちに、正しい者たちのために昇る (ἐξανατέλλω — «восходить, просиять»). ἐλεήμων καὶ οἰκτίρμων καὶ δίκαιος — あわれみ深く、恵み深く、正しい; подлежащее — праведник (так у jp-joc 彼は…義なる者なり и в Синодальном «благ он»), а не Бог: в евр. текст это описание человека."
  5: "χρηστὸς ἀνὴρ ὁ οἰκτίρμων καὶ κιχρῶν — 善い人はあわれみ、貸し与え (κιχράω — «давать взаймы»). οἰκονομήσει τοὺς λόγους αὐτοῦ ἐν κρίσει — その言葉を裁きのときにも確かなものとする (οἰκονομέω — «управлять, устраивать»; смысл: распорядится своими делами с разумом, так что на суде слово его будет твёрдо; ср. jp-joc 其言の確なるを顯さん, Синодальный «даст твердость словам своим на суде»). εἰς τὸν αἰῶνα οὐ σαλευθήσεται — とこしえに揺るがない (σαλεύω — «колебать»)."
  6: "εἰς μνημόσυνον αἰώνιον ἔσται δίκαιος — 正しい者は永遠の記念として残る (μνημόσυνον — «память, remembrance»). Слав. ст. 6 — вторая половина гр. ст. 6."
  7: "ἀπὸ ἀκοῆς πονηρᾶς οὐ φοβηθήσεται — 悪い知らせを聞いても恐れない (ἀκοή — «слух, весть»). Слав. ст. 7 — первая половина гр. ст. 7."
  8: "ἑτοίμη ἡ καρδία αὐτοῦ ἐλπίζειν ἐπὶ κύριον — その心は主に寄り頼む用意ができている (ἕτοιμος — «готовый»; ἐλπίζω — «уповать»). ἐστήρικται ἡ καρδία αὐτοῦ, οὐ μὴ φοβηθῇ — その心は固く据えられ、恐れない (στηρίζω — «утверждать»; οὐ μή — усиленное отрицание). ἕως οὗ ἐπίδῃ ἐπὶ τοὺς ἐχθροὺς αὐτοῦ — «доколе не увидит [чего-то] на врагах своих»; передано 敵を見る時にも恐れない, как jp-joc 彼其敵を見ん時懼れざらん: дополнение при ἐπίδῃ в греч. не названо, и вставлять «погибель» было бы добавлением. Слав. ст. 8 = гр. 7b + гр. 8."
  9: "ἐσκόρπισεν, ἔδωκεν τοῖς πένησιν — 散らし与え、貧しい者たちに施した (σκορπίζω — «расточать»; образ сеятеля, ср. 2 Кор 9:9). ἡ δικαιοσύνη αὐτοῦ μένει εἰς τὸν αἰῶνα τοῦ αἰῶνος — その義は世々限りなく保たれる, повтор 3-го стиха сохранён. τὸ κέρας αὐτοῦ ὑψωθήσεται ἐν δόξῃ — その角は栄光のうちに高く上げられる (κέρας — «рог» как знак силы и достоинства, не сглажено)."
  10: "ἁμαρτωλὸς ὄψεται καὶ ὀργισθήσεται — 罪人はこれを見て怒り (ὀργίζομαι — «гневаться, досадовать»). τοὺς ὀδόντας αὐτοῦ βρύξει — 歯を噛み鳴らし (βρύχω — «скрежетать»). καὶ τακήσεται — 溶け去る (τήκω — «таять, изнемогать»). ἐπιθυμία ἁμαρτωλῶν ἀπολεῖται — 罪人たちの望みは滅びる; ед. ч. ὄψεται/ὀργισθήσεται и мн. ч. в конце сохранены."
