# jp-box, Числа, глава 34. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в этой главе нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 34: повеление о земле Ханаан (1–2), южная (3–5), западная (6),
# северная (7–9) и восточная (10–12) границы, речь Моисея о разделе (13–15),
# начальники уделов по племенам (16–29).
# Речь Бога — 「…」 (2–12, 17–29); речь Моисея — 「…」 (13–15). Красного нет.
# 〔…〕: 34:5 〔大きな〕 — в csl «и будет исход море (великое)», в gr-lxx-byz
# слова μεγάλη в этом стихе нет (bracket_check «34:5:μεγαλη» — НЕТ), как и в
# 21:8 со слав. пояснением в скобках. Больше 〔…〕 нет.
# Сносок ⟨…⟩ нет: 嗣業, 境, 部族, くじ, 長 уже в корпусе или понятны по контексту.
# Отличия LXX от масоретского/Синодального (по базе): 34:4 Σεννα (ru «через Син»),
# ἔπαυλις Αραδ — «селение Арад» (ru «Гацар-Аддар»); 34:5 в греч. только ἡ θάλασσα,
# без «великое»; 34:6 в греч. нет «к западу» (ru добавляет); 34:7–8 в gr-lxx-byz
# стоит παρὰ τὸ ὄρος τὸ ὄρος / ἀπὸ τοῦ ὄρους τὸ ὄρος — «ὄρος» повторено (вероятно,
# вместо Ὄρ, гора Ор; слав. «при горе гору» / «от горы гору»), поэтому переведено
# буквально, без внесения масоретского «гора Ор»; 34:8 Σαραδα (слав. «садад»,
# ru «Цедад»); 34:9 Δεφρων, Ασερναιν (ru «Цифрон», «Гацар-Енан»); 34:10 Σεπφαμα
# (ru «Шефам»); 34:11 Σεπφαμ Αρβηλα — два имени (слав. слитно «сепфамар-вила»,
# ru «к Рибле»), Βηλα (слав. «вилы»); 34:19–28 имена начальников даны по LXX
# (в ru иные формы). 34:20 у Саламиила здесь отчество Εμιουδ, в 1:6 — Σουρισαδαι.
