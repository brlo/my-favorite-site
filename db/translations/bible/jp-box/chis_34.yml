verses:
  1: "主[しゅ]はモーセに語[かた]って言[い]われた。"
  2: "「イスラエルの子[こ]らに命[めい]じて言[い]いなさい。あなたがたはカナンの地[ち]に入[はい]る。これがあなたがたの嗣業[しぎょう]となる地、すなわちその境[さかい]を伴[ともな]ったカナンの地である。"
  3: "あなたがたの南[みなみ]の側[がわ]は、シンの荒野[こうや]からエドムに接[せっ]する所[ところ]までである。南の境[さかい]は、塩[しお]の海[うみ]の東[ひがし]の端[はし]から始[はじ]まる。"
  4: "境[さかい]は南[みなみ]からアクラビムの上[のぼ]り口[ぐち]へと巡[めぐ]り、センナを通[とお]り、その端[はし]はカデス・バルネの南に至[いた]る。そしてアラドの村[むら]に出[で]て、アセモナを通る。"
  5: "境[さかい]はアセモナからエジプトの川[かわ]へと巡[めぐ]り、その端[はし]は〔大[おお]きな〕海[うみ]である。"
  6: "海[うみ]の境[さかい]があなたがたのものとなる。大[おお]きな海が境を定[さだ]める。これがあなたがたの海の境である。"
  7: "これがあなたがたの北[きた]の境となる。大[おお]きな海[うみ]から、あなたがたのために、山[やま]のそばで測[はか]りなさい。"
  8: "その山[やま]から、エマトに入[はい]る者[もの]たちのために測[はか]りなさい。その端[はし]はサラダの境[さかい]となる。"
  9: "境[さかい]はデフロンに出[で]て、その端[はし]はアセルナインとなる。これがあなたがたの北[きた]からの境である。"
  10: "あなたがたは東[ひがし]の境[さかい]を、アセルナインからセプファムまで、自分[じぶん]たちのために測[はか]りなさい。"
  11: "境[さかい]はセプファムから、東の側[がわ]のアルベラへ下[くだ]り、泉[いずみ]に至[いた]る。境はさらにベラへ下り、東からケネラの海[うみ]の岸辺[きしべ]に達[たっ]する。"
  12: "境[さかい]はヨルダン川[がわ]へ下[くだ]り、その端[はし]は塩[しお]の海[うみ]である。これが、四方[しほう]の境を伴[ともな]ったあなたがたの地[ち]である。」"
  13: "モーセはイスラエルの子[こ]らに命[めい]じて言[い]った。「これが、あなたがたがくじによって嗣業[しぎょう]として受[う]け継[つ]ぐ地[ち]である。主[しゅ]がモーセに命じて、これを九[ここの]つの部族[ぶぞく]とマナセの部族の半分[はんぶん]に与[あた]えさせられたとおりである。"
  14: "ルベンの子[こ]らの部族[ぶぞく]とガドの子らの部族が、その父[ちち]の家[いえ]ごとに、またマナセの部族の半分も、自分[じぶん]たちのくじを受[う]け取[と]ったからである。"
  15: "二[ふた]つの部族[ぶぞく]と部族の半分が、ヨルダン川[がわ]の向[む]こう側[がわ]、エリコに面[めん]した所[ところ]の南[みなみ]から東[ひがし]へ向[む]かって、自分たちのくじを受[う]け取った。」"
  16: "主[しゅ]はモーセに語[かた]って言[い]われた。"
  17: "「あなたがたのために地[ち]を嗣業[しぎょう]として分[わ]け与[あた]える者[もの]たちの名[な]は次[つぎ]のとおりである。祭司[さいし]エレアザルと、ヌンの子[こ]ヨシュア。"
  18: "また、あなたがたは部族[ぶぞく]ごとに一[ひと]人[り]の長[かしら]を取り、あなたがたのために地を嗣業として分けさせなさい。"
  19: "その人[ひと]たちの名[な]は次[つぎ]のとおりである。ユダの部族[ぶぞく]からは、イェフォンネの子[こ]カレブ。"
  20: "シメオンの部族[ぶぞく]からは、エミウドの子[こ]サラミエル。"
  21: "ベニヤミンの部族[ぶぞく]からは、ハスロンの子[こ]エルダド。"
  22: "ダンの部族[ぶぞく]からは、長[かしら]であるエグリの子[こ]バクキル。"
  23: "ヨセフの子[こ]らのうち、マナセの子らの部族[ぶぞく]からは、長であるウフィの子アニエル。"
  24: "エフライムの子らの部族[ぶぞく]からは、長であるサバタの子[こ]カムエル。"
  25: "ゼブルンの部族[ぶぞく]からは、長であるファルナクの子[こ]エリサファン。"
  26: "イッサカルの子らの部族[ぶぞく]からは、長であるオザの子[こ]ファルティエル。"
  27: "アシェルの子らの部族[ぶぞく]からは、長であるセレミの子[こ]アヒオル。"
  28: "ナフタリの部族[ぶぞく]からは、長であるベナミウドの子[こ]ファダイエル。"
  29: "これらは、主[しゅ]がカナンの地[ち]でイスラエルの子[こ]らに嗣業[しぎょう]を分[わ]け与[あた]えるよう命[めい]じられた者[もの]たちである。」"

notes:
  1: "Формула ἐλάλησεν κύριος πρὸς Μωυσῆν λέγων; речь — с 2-го стиха."
  2: "Ἔντειλαι — повелительное «заповедай, дай повеление» (ἐντέλλομαι). εἰσπορεύεσθε — «вы входите» (praesens). κληρονομία — 嗣業. σὺν τοῖς ὁρίοις αὐτῆς — «с пределами её» (ὅριον)."
  3: "κλῖτος — «склон, сторона» (κλῖτος; слав. «страна»). ἀπὸ ἐρήμου Σιν ἕως ἐχόμενον Εδωμ — «от пустыни Син до прилежащего Едому» (ἐχόμενος + род.). θάλασσα ἁλυκή — Соленое (Мёртвое) море (ἁλυκός). ἀπὸ ἀνατολῶν — «с востока», т. е. от восточного конца моря."
  4: "ἀνάβασις Ακραβιν — «восход (подъём) Акравим» (ἀνάβασις). παρελεύσεται Σεννα — «пройдёт Сенну» (Σεννα; слав. «еннак»; ru «через Син»). ἡ διέξοδος αὐτοῦ — «выход его», т. е. конец границы. Καδης τοῦ Βαρνη — Кадес-Варни. ἔπαυλις — «селение, усадьба» (ἔπαυλις; слав. «село»; ru «Гацар-Аддар»)."
  5: "χειμάρρους Αἰγύπτου — «поток Египетский» (χειμάρρους — сезонный поток, вади; エジプトの川). ἡ θάλασσα — море (Средиземное). В csl добавлено «(великое)» — в gr-lxx-byz слова μεγάλη здесь нет (bracket_check: НЕТ), отсюда 〔大きな〕."
  6: "ἡ θάλασσα ἡ μεγάλη ὁριεῖ — «великое море будет границей» (ὁρίζω). Здесь греч. не называет запада (θάλασσα без «πρὸς δυσμάς»); ru добавляет «к западу»."
  7: "πρὸς βορρᾶν — «к северу». παρὰ τὸ ὄρος τὸ ὄρος — букв. «у горы гору»: ὄρος повторено (вероятно, вместо Ὄρ, гора Ор; слав. «при горе гору», ru «к горе Ор»). Оставлено буквально, без внесения масоретского чтения."
  8: "εἰσπορευομένων εἰς Εμαθ — род. самостоятельный: «входящих в Емаф» (Емаф — на севере). ἀπὸ τοῦ ὄρους τὸ ὄρος — снова повтор ὄρος (см. ст. 7). Σαραδα — Сарада (слав. «садад», ru «Цедад»)."
  9: "Δεφρωνα — винительный «к Дефрону» (Δεφρων). Ασερναιν — Асернаин (ru «Гацар-Енан»). ὅρια ἀπὸ βορρᾶ — «пределы от севера»."
  10: "καταμετρήσετε ὑμῖν αὐτοῖς — «отмерьте себе» (καταμετρέω). ἀπὸ Ασερναιν Σεπφαμα — «от Асернаина до Сеффама» (Σεπφαμα — винительный)."
  11: "ἀπὸ Σεπφαμ Αρβηλα — «от Сеффама к Арвеле» (два имени; слав. слитно «сепфамар-вила»; ru «к Рибле»). ἐπὶ πηγάς — «к источникам». Βηλα — Бела (слав. «вилы»). ἐπὶ νώτου θαλάσσης Χεναρα — «на склон (спину) моря Хенереф» (νῶτον — «спина»; ケネラの海); ἀπὸ ἀνατολῶν — «с востока»."
  12: "ἐπὶ τὸν Ιορδάνην — к Иордану. θάλασσα ἡ ἁλυκή — Соленое море (ср. ст. 3). κύκλῳ — «вокруг», т. е. со всех сторон."
  13: "ἐνετείλατο Μωϋσῆς … λέγων — Моисей заповедал, говоря; речь 13–15. μετὰ κλήρου — «с жребием», по жребию. ἐννέα φυλαῖς — девяти племенам; τῷ ἡμίσει φυλῆς Μανασση — половине племени Манассии. ὃν τρόπον συνέταξεν κύριος τῷ Μωυσῇ — «как повелел Господь Моисею»."
  14: "ἔλαβεν … ἀπέλαβον — «взяло … получили» (λαμβάνω, ἀπολαμβάνω). κατ᾿ οἴκους πατριῶν — по домам отцов (父の家)."
  15: "δύο φυλαὶ καὶ ἥμισυ φυλῆς — два племени и половина племени. πέραν τοῦ Ιορδάνου — за Иорданом. ἀπὸ νότου κατ᾿ ἀνατολάς — «от юга на восток» (слав. «от полудня на востоки»)."
  16: "Формула ἐλάλησεν κύριος πρὸς Μωυσῆν λέγων; речь — с 17-го стиха."
  17: "οἳ κληρονομήσουσιν ὑμῖν τὴν γῆν — «которые разделят вам землю в удел» (κληρονομέω здесь в значении раздела). Ελεαζαρ … Ἰησοῦς ὁ τοῦ Ναυη — Елеазар и Иисус, сын Навин (ヌンの子ヨシュア)."
  18: "ἄρχοντα ἕνα ἐκ φυλῆς — по одному начальнику от племени (部族の長). κατακληρονομῆσαι — «разделить в удел»."
  19: "τῆς φυλῆς Ιουδα — «из племени Иуды» (род. при перечислении). Χαλεβ υἱὸς Ιεφοννη — Халев, сын Иефоннии (イェフォンネの子カレブ, ср. 13:6; 32:12)."
  20: "Σαλαμιηλ υἱὸς Εμιουδ — Саламиил, сын Емиуда; в 1:6 у того же имени отчество Σουρισαδαι, здесь Εμιουδ (в ru «Самуил, сын Аммиуда» — иное имя)."
  21: "Ελδαδ υἱὸς Χασλων — Елдад, сын Хаслона (ru «Елидад, сын Кислона»)."
  22: "ἄρχων Βακχιρ υἱὸς Εγλι — начальник Бакхир, сын Егли (ru «Буккий, сын Иоглии»). Слово ἄρχων при имени стоит в ст. 22–28."
  23: "τῶν υἱῶν Ιωσηφ φυλῆς υἱῶν Μανασση — «из сынов Иосифа, из племени сынов Манассии». Ανιηλ υἱὸς Ουφι — Аниил, сын Уфи (ru «Ханниил, сын Ефода»)."
  24: "Καμουηλ υἱὸς Σαβαθα — Камуил, сын Савафы (ru «Кемуил, сын Шифтана»)."
  25: "Ελισαφαν υἱὸς Φαρναχ — Елисафан, сын Фарнаха (ru «Елицафан, сын Фарнака»)."
  26: "Φαλτιηλ υἱὸς Οζα — Фалтиил, сын Озы (ru «Фалтиил, сын Аззана»)."
  27: "Αχιωρ υἱὸς Σελεμι — Ахиор, сын Селеми (ru «Ахиуд, сын Шеломия»)."
  28: "Φαδαηλ υἱὸς Βεναμιουδ — Фадаил, сын Венамиуда (ru «Педаил, сын Аммиуда»)."
  29: "οὗτοι οἷς ἐνετείλατο κύριος καταμερίσαι — «те, кому повелел Господь разделить» (καταμερίζω). ἐν γῇ Χανααν — в земле Ханаан."
