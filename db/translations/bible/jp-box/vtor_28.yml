  55: "彼は、自分[じぶん]が食[た]べる自分の子[こ]どもの肉[にく]を、だれ一人[ひとり]にも分[わ]け与[あた]えない。あなたの敵[てき]があなたのすべての町々[まちまち]であなたを苦しめる、その閉じ込められた苦しみと圧迫のうちに、彼には何[なに]ひとつ残らないからである。"
