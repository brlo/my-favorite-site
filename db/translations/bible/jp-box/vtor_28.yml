verses:
  1: "「あなたがたがヨルダン川[がわ]を渡[わた]って、あなたがたの神[かみ]である主[しゅ]が与[あた]える地[ち]に入[はい]るとき、もしあなたがたがあなたがたの神である主の声[こえ]によく聞[き]き従[したが]い、今日[きょう]、わたしがあなたに命[めい]じる主のすべての戒[いまし]めを守[まも]り行[おこな]うなら、あなたの神である主はあなたを地のすべての国民[こくみん]の上[うえ]に立[た]たせる。"
  2: "もしあなたがあなたの神[かみ]である主[しゅ]の声[こえ]によく聞[き]き従[したが]うなら、これらの祝福[しゅくふく]はすべてあなたの上[うえ]に来[き]て、あなたを見出[みいだ]す。"
  3: "あなたは町[まち]で祝福[しゅくふく]され、野[の]で祝福される。"
  4: "あなたの胎[たい]の実[み]とあなたの地[ち]の産物[さんぶつ]、あなたの牛[うし]の群[む]れとあなたの羊[ひつじ]の群れは祝福[しゅくふく]される。"
  5: "あなたの倉[くら]とあなたの蓄[たくわ]えは祝福[しゅくふく]される。"
  6: "あなたは入[はい]るときも祝福[しゅくふく]され、出[で]るときも祝福される。"
  7: "あなたの神[かみ]である主[しゅ]は、あなたに逆[さか]らう敵[てき]を、あなたの前[まえ]で打[う]ち砕[くだ]かれた者[もの]たちとして、あなたに渡[わた]される。彼[かれ]らは一[ひと]つの道[みち]からあなたに向[む]かって出[で]て来[き]るが、七[なな]つの道に分[わ]かれてあなたの前から逃[に]げる。"
  8: "主[しゅ]は、あなたの倉[くら]に、またあなたが手[て]をかけるすべてのものに、あなたの神[かみ]である主があなたに与[あた]える地[ち]の上[うえ]で、あなたの上に祝福[しゅくふく]を送[おく]られる。"
  9: "あなたの神[かみ]である主[しゅ]は、あなたをご自身[じしん]の聖[せい]なる民[たみ]として立[た]たせる。主があなたの父[ちち]たちに誓[ちか]われたとおりである。もしあなたがあなたの神である主の声[こえ]に聞[き]き従[したが]い、その道[みち]を歩[あゆ]むなら、"
  10: "地[ち]のすべての国民[こくみん]は、主[しゅ]の名[な]があなたの上[うえ]に呼[よ]ばれているのを見[み]て、あなたを恐[おそ]れる。"
  11: "あなたの神[かみ]である主[しゅ]は、主があなたの父[ちち]たちに誓[ちか]ってあなたに与[あた]えると約束[やくそく]された地[ち]の上[うえ]で、あなたの胎[たい]の実[み]、あなたの地の産物[さんぶつ]、あなたの家畜[かちく]の産[う]み出[だ]すものを増[ふ]やし、あなたを良[よ]いもので満[み]たす。"
  12: "主[しゅ]はあなたのために、その良[よ]い宝[たから]の蔵[くら]、すなわち天[てん]を開[ひら]き、あなたの地[ち]に時[とき]に応[おう]じて雨[あめ]を降[ふ]らせ、あなたの手[て]のすべての業[わざ]を祝福[しゅくふく]される。あなたは多[おお]くの国民[こくみん]に貸[か]し与[あた]えるが、あなた自身[じしん]は借[か]りない。あなたは多くの国民を治[おさ]めるが、彼[かれ]らはあなたを治めない。"
  13: "あなたの神[かみ]である主[しゅ]はあなたを頭[あたま]とし、尾[お]とはされない。あなたは必[かなら]ず上[うえ]にあって、下[した]にはない。もしあなたが、今日[きょう]、わたしがあなたに命[めい]じるあなたの神である主の戒[いまし]めに聞[き]き従[したが]い、それを守[まも]って行[おこな]うなら。"
  14: "あなたは、今日[きょう]、わたしがあなたに命[めい]じるすべての言葉[ことば]から離[はな]れ、右[みぎ]にも左[ひだり]にもそれて、ほかの神々[かみがみ]に従[したが]い、それらに仕[つか]えてはならない。"
  15: "もしあなたがあなたの神[かみ]である主[しゅ]の声[こえ]に聞[き]き従[したが]わず、今日[きょう]、わたしがあなたに命[めい]じる主のすべての戒[いまし]めを守[まも]り行[おこな]わないなら、これらの呪[のろ]いはすべてあなたの上[うえ]に来[き]て、あなたを捕[と]らえる。"
  16: "あなたは町[まち]で呪[のろ]われ、野[の]で呪われる。"
  17: "あなたの倉[くら]とあなたの蓄[たくわ]えは呪[のろ]われる。"
  18: "あなたの胎[たい]の実[み]とあなたの地[ち]の産物[さんぶつ]、あなたの牛[うし]の群[む]れとあなたの羊[ひつじ]の群れは呪[のろ]われる。"
  19: "あなたは出[で]るときも呪[のろ]われ、入[はい]るときも呪われる。"
  20: "主[しゅ]はあなたに欠乏[けつぼう]と飢[う]えと滅[ほろ]びを送[おく]り、あなたが手[て]をかけるすべてのもの、あなたが行[おこな]うすべてのものの上[うえ]に臨[のぞ]ませる。あなたの悪[わる]い企[たくら]みのゆえに、またあなたがわたしを捨[す]てたために、主はついにあなたを根[ね]こそぎ滅ぼし、たちまちあなたを滅ぼされる。"
  21: "主[しゅ]は、あなたが嗣業[しぎょう]として受[う]け継[つ]ぐために入[はい]って行[ゆ]く地[ち]から、あなたを根こそぎ滅[ほろ]ぼし尽[つ]くされるまで、あなたに死[し]を結[むす]びつけておられる。"
  22: "主[しゅ]はあなたを、困窮[こんきゅう]、熱病[ねつびょう]、悪寒[おかん]、炎症[えんしょう]、殺戮[さつりく]、風[かぜ]による枯[か]れ、蒼白[そうはく]で打[う]たれる。それらはあなたを追[お]い、ついにあなたを滅[ほろ]ぼし尽くす。"
  23: "あなたの頭[あたま]の上[うえ]の天[てん]はあなたにとって銅[どう]となり、あなたの下[した]の地[ち]は鉄[てつ]となる。"
  24: "主[しゅ]はあなたの地[ち]の雨[あめ]を塵[ちり]とされる。天[てん]からの土埃[つちぼこり]があなたの上[うえ]に降[ふ]り、ついにあなたを打[う]ち砕[くだ]き、滅[ほろ]ぼし尽くす。"
  25: "主[しゅ]はあなたを敵[てき]の前[まえ]で打[う]ち殺[ころ]される者[もの]とされる。あなたは一[ひと]つの道[みち]から彼[かれ]らに向かって出[で]て行[ゆ]くが、七[なな]つの道に分かれて彼らの前から逃[に]げ、地[ち]のすべての王国[おうこく]に散[ち]らされる。"
  26: "あなたがたの死者[ししゃ]は天[てん]の鳥[とり]と地[ち]の獣[けもの]の食[た]べ物[もの]となり、それを追[お]い払[はら]う者[もの]はいなくなる。"
  27: "主[しゅ]はあなたの臀部[でんぶ]にエジプトのうみの出[で]る腫[は]れ物[もの]を生[しょう]じさせ、またひどい皮膚[ひふ]の病[やまい]とかゆみであなたを打[う]ち、あなたは癒[いや]されることができない。"
  28: "主[しゅ]はあなたを精神[せいしん]の麻痺[まひ]、盲目[もうもく]、心[こころ]の錯乱[さくらん]で打たれる。"
  29: "あなたは真昼[まひる]に、盲人[もうじん]が暗[くら]やみの中[なか]で手探[てさぐ]りするように手探りし、あなたの道[みち]は栄[さか]えない。あなたはいつも虐[しいた]げられ、奪[うば]われ、あなたを助[たす]ける者[もの]はいない。"
  30: "あなたは妻[つま]を迎[むか]えるが、ほかの男[おとこ]が彼女[かのじょ]を自分[じぶん]のものにする。あなたは家[いえ]を建[た]てるが、そこに住[す]まない。あなたはぶどう畑[ばたけ]を植[う]えるが、その実[み]を取[と]り入[い]れない。"
  31: "あなたの子牛[こうし]はあなたの目の前[まえ]で屠[ほふ]られるが、あなたはそれを食[た]べない。あなたの驢馬[ろば]はあなたから奪[うば]われ、返[かえ]されない。あなたの羊[ひつじ]は敵[てき]に与[あた]えられ、あなたを助ける者はいない。"
  32: "あなたの息子[むすこ]たちと娘[むすめ]たちはほかの国民[こくみん]に与[あた]えられ、あなたの目[め]はそれを眺[なが]めて衰[おとろ]え、あなたの手[て]には力[ちから]がない。"
  33: "あなたの地[ち]の産物[さんぶつ]とあなたのすべての労苦[ろうく]を、あなたが知[し]らない国民[こくみん]が食[た]べ尽[つ]くす。あなたはいつも虐げられ、踏[ふ]みにじられる。"
  34: "あなたは自分の目[め]が見[み]る光景[こうけい]のゆえに、気[き]が狂[くる]う。"
  35: "主[しゅ]はあなたを、膝[ひざ]と脛[すね]に悪性[あくせい]の腫[は]れ物[もの]で打[う]ち、あなたは足[あし]の裏[うら]から頭[あたま]の頂[いただき]まで癒[いや]されることができない。"
  36: "主[しゅ]はあなたと、あなたが自分[じぶん]の上[うえ]に立[た]てる支配者[しはいしゃ]たちを、あなたもあなたの父[ちち]たちも知[し]らない国民[こくみん]のもとへ連[つ]れて行[ゆ]き、あなたはそこで、木[き]や石[いし]であるほかの神々[かみがみ]に仕[つか]える。"
