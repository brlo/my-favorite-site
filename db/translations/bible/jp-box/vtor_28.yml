  57: "また、彼女[かのじょ]の股[もも]から出[で]た後産[あとざん]と、彼女が産[う]む子[こ]を、彼女は、あなたの敵[てき]があなたのすべての町々[まちまち]であなたを苦しめる、その閉じ込められた苦しみと圧迫のうちに、すべてのものの欠乏[けつぼう]のゆえに、ひそかに食[た]べる。"
