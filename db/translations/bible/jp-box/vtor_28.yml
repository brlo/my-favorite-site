  49: "主[しゅ]は、あなたがその声[こえ]を聞[き]いても分[わ]からない国民[こくみん]を、遠[とお]くから、地[ち]の果[は]てから、鷲[わし]のように舞[ま]い下[お]りる勢[いきお]いで、あなたの上[うえ]に連[つ]れて来[く]る。"
  50: "その国民[こくみん]は顔[かお]を恥[は]じ知[し]らず、老人[ろうじん]の顔を敬[うやま]わず、若者[わかもの]をあわれまない。"
  51: "それはあなたの家畜[かちく]の産[う]み出[だ]すものとあなたの地[ち]の産物[さんぶつ]を食[た]べ尽[つ]くし、あなたに穀物[こくもつ]もぶどう酒[さけ]も油[あぶら]も、あなたの牛[うし]の群[む]れも羊[ひつじ]の群れも何[なに]ひとつ残[のこ]さない。ついにあなたを滅[ほろ]ぼし尽くす。"
  52: "主[しゅ]はあなたをすべての町々[まちまち]で打[う]ち砕[くだ]き、あなたが頼[たよ]りとしていた高[たか]く堅固[けんご]な城壁[じょうへき]を、あなたの全[すべ]ての地[ち]で打ち倒[たお]す。そして、あなたの神[かみ]である主があなたに与[あた]えたすべての町々であなたを苦[くる]しめる。"
