  38: "あなたは畑[はたけ]に多[おお]くの種[たね]を運[はこ]び出[だ]すが、持[も]ち帰[かえ]るのはわずかである。いなごがそれを食[た]べ尽[つ]くすからである。"
  39: "あなたはぶどう畑[ばたけ]を植[う]えて耕[たがや]すが、そのぶどう酒[さけ]を飲[の]まず、それによって喜[よろこ]ぶこともない。虫[むし]がそれを食[た]べ尽くすからである。"
  40: "あなたの全[すべ]ての地境[じざかい]にオリーブの木[き]があるが、あなたは油[あぶら]を塗[ぬ]らない。あなたのオリーブが実[み]を落[お]とすからである。"
  41: "あなたは息子[むすこ]や娘[むすめ]を生[う]むが、彼[かれ]らはあなたのものにならない。捕囚[ほしゅう]となって行[ゆ]ってしまうからである。"
  42: "あなたのすべての木[き]とあなたの地[ち]の産物[さんぶつ]を、さび病が食[く]い尽[つ]くす。"
  43: "あなたのうちにいる寄留者[きりゅうしゃ]は、あなたの上[うえ]へますます上[のぼ]り、あなたはますます下[くだ]る。"
  44: "その者[もの]はあなたに貸[か]し、あなたはその者に貸さない。その者は頭[あたま]となり、あなたは尾[お]となる。"
  45: "これらの呪[のろ]いはすべてあなたの上[うえ]に来[き]て、あなたを追[お]い、捕[と]らえる。あなたがあなたの神[かみ]である主[しゅ]の声[こえ]に聞[き]き従[したが]わず、主があなたに命[めい]じられた戒[いまし]めと定[さだ]めを守[まも]らなかったので、それらはついにあなたを根こそぎにし、滅ぼし尽くす。"
