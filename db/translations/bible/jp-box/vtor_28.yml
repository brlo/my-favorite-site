  62: "あなたがたはわずかな数[かず]しか残[のこ]らない。かつては天[てん]の星[ほし]のように多[おお]かったのに。あなたがたの神[かみ]である主[しゅ]の声[こえ]に聞[き]き従[したが]わなかったからである。"
  63: "主[しゅ]があなたがたを良[よ]く扱[あつか]い、あなたがたを増[ふ]やして喜[よろこ]ばれたように、主はあなたがたを根こそぎにし、滅ぼして喜ばれる。あなたがたは、嗣業[しぎょう]として受[う]け継[つ]ぐために入[はい]って行[ゆ]く地[ち]から引[ひ]き抜[ぬ]かれる。"
  64: "あなたの神[かみ]である主[しゅ]はあなたを、地[ち]の果[は]てから地の果てまで、すべての国民[こくみん]の間[あいだ]に散[ち]らす。あなたはそこで、あなたもあなたの父[ちち]たちも知[し]らなかった、木[き]や石[いし]であるほかの神々[かみがみ]に仕[つか]える。"
  65: "しかし、それらの国民の間[あいだ]でも、主はあなたを休[やす]ませない。あなたの足[あし]の跡[あと]が立[た]ち止[ど]まる所[ところ]もない。主はそこで、あなたに気[き]を落[お]とした心[こころ]、衰[おとろ]えて見[み]えなくなる目[め]、溶[と]け尽[つ]きる魂[たましい]を与[あた]える。"
  66: "あなたの命[いのち]は、あなたの目[め]の前[まえ]にぶら下[さ]がったままになる。あなたは昼[ひる]も夜[よる]も恐[おそ]れ、自分の命を信[しん]じられない。"
  67: "朝[あさ]には『どうか夕[ゆう]べになればよいのに』と言[い]い、夕べには『どうか朝になればよいのに』と言う。あなたの心[こころ]の恐[おそ]れ、あなたが恐れることのゆえに、またあなたの目が見[み]る光景[こうけい]のゆえに。"
  68: "主[しゅ]はあなたを船[ふね]に乗[の]せ、かつてわたしが『あなたは二度[にど]とそれを見[み]ることはない』と言[い]ったその道[みち]を通[とお]って、エジプトへ連[つ]れ戻[もど]す。あなたがたはそこで、敵[てき]に男[おとこ]奴隷[どれい]や女[おんな]奴隷として売[う]られるが、買[か]う者[もの]はいない。」"

notes:
  1: "ἀκοῇ εἰσακούσητε — «слухом услышите», усиленное «послушаете» (слав. «слухом послушаете»); ὑπεράνω — выше; смена числа: обращение во мн. ч., а «заповедую тебе» — в ед. ч. (как в LXX)."
  2: "ἥξουσιν — придут; εὑρήσουσίν σε — найдут тебя (слав. «обрящут тя»); ἀκοῇ ἀκούσῃς — усиленное «услышишь»."
  3: "εὐλογημένος σὺ ἐν πόλει — благословен ты в городе; ἀγρός — поле, село (слав. «на селе»); парная формула с 28:16."
  4: "ἔκγονα κοιλίας — порождения чрева, дети (слав. «исчадия чрева»); γενήματα γῆς — произведения земли; βουκόλια βοῶν — стада волов; ποίμνια προβάτων — стада овец; четверная формула, как в 28:18 и 28:51."
  5: "ἀποθῆκαι — житницы, хранилища; ἐγκαταλείμματα — остатки, оставленное (слав. «останцы»); ср. 28:17."
  6: "εἰσπορεύεσθαι/ἐκπορεύεσθαι — входить/выходить; формула обнимает всякий путь; ср. 28:19 (обратный порядок)."
  7: "παραδῷ — предаст (оптатив в значении будущего); συντετριμμένους — сокрушённых (συντρίβω); ἀνθεστηκότας — восставших (ἀνθίστημι); ὁδῷ μιᾷ … ἐν ἑπτὰ ὁδοῖς — одним путём… семью путями (полное поражение)."
  8: "ἀποστεῖλαι — пошлёт (оптатив); ταμιεῖα — хранилища, сокровищницы; ἐπιβάλῃς τὴν χεῖρα — возложишь руку, т.е. предпримешь."
  9: "ἀναστήσαι — поставит (ἀνίστημι); ἑαυτῷ λαὸν ἅγιον — Себе народом святым; ὤμοσεν — клялся; πορευθῇς ἐν ταῖς ὁδοῖς — пойдёшь путями."
  10: "ἐπικέκληταί σοι — наречено на тебе (ἐπικαλέω), т.е. ты носишь имя Господа; φοβηθήσονταί σε — убоятся тебя."
  11: "πληθυνεῖ εἰς ἀγαθά — умножит во благое; ἔκγονα κτηνῶν — приплод скота; ἐπὶ τῆς γῆς — на земле."
  12: "θησαυρὸν τὸν ἀγαθόν, τὸν οὐρανόν — сокровищницу благую, небо (приложение); ὑετὸς ἐπὶ καιροῦ — дождь в своё время; δανιεῖς — будешь давать взаймы (δανείζω); ἄρξεις — будешь начальствовать (ἄρχω с род.)."
  13: "καταστήσαι — поставит; εἰς κεφαλὴν καὶ μὴ εἰς οὐράν — в голову, а не в хвост; ἐπάνω/ὑποκάτω — сверху/снизу; τότε — тогда (усиление)."
  14: "παραβήσῃ ἀπό — уклонишься, преступишь; δεξιὰ οὐδὲ ἀριστερά — ни направо, ни налево; ὀπίσω θεῶν — вслед богов."
  15: "κατάραι — проклятия; καταλήμψονταί σε — постигнут, охватят (λαμβάνω); условие сформулировано отрицательно, как 28:1."
  16: "ἐπικατάρατος — проклят (усиленная форма от κατάρατος); парная формула с 28:3."
  17: "ἀποθῆκαι — житницы, хранилища; ἐγκαταλείμματα — остатки (слав. «останцы»); ср. 28:5."
  18: "Та же формула, что в 28:4, но с проклятием вместо благословения; порядок членов сохранён."
  19: "ἐκπορεύεσθαι/εἰσπορεύεσθαι — обратный порядок по сравнению с 28:6 (у LXX: выход, затем вход)."
  20: "ἐξαποστεῖλαι — пошлёт; ἔνδεια — скудость, нужда; ἐκλιμία — голод; ἀνάλωσις — истребление; ἐπιτηδεύματα — начинания, дела; ἐγκατέλιπές με — оставил Меня (Бог говорит о Себе)."
  21: "προσκολλήσαι — прилепит, прикрепит; θάνατος — смерть (Синодальный «моровая язва»); ἐξαναλώσῃ — истребит; κληρονομῆσαι — наследовать."
  22: "ἀπορία — безвыходность, нужда (в Лев 26:16 — 困窮); πυρετός — горячка; ῥῖγος — озноб; ἐρεθισμός — раздражение, воспаление; φόνος — убийство, резня; ἀνεμοφθορία — повреждение ветром, палящий ветер (слав. «ветром тлетворным»); ὤχρα — бледность, желтушность."
  23: "χαλκοῦς — медный, бронзовый; σιδηρᾶ — железная; образ засухи и бесплодия (ср. Лев 26:19)."
  24: "κονιορτός — пыль, прах; χοῦς — пыль, земля; ἐκτρίψῃ — сотрёт (ἐκτρίβω)."
  25: "ἐπικοπή — поражение, избиение (слав. «на изсечение»); διασπορά — рассеяние; ср. 28:7 — там благословение, здесь проклятие."
  26: "κατάβρωμα — пища, снедь; ἀποσοβῶν — отгоняющий (ἀποσοβέω); «ваши» при обращении в ед. ч. — как в LXX."
  27: "ἕλκος Αἰγύπτιον — египетская язва (ср. Исх 9:9, うみの出る腫れ物); ἕδραι — седалища, ягодицы; ψώρα ἀγρία — дикая короста (в Лев 26:16 — 皮膚の病); κνήφη — зуд; ὥστε μὴ δύνασθαι ἰαθῆναι — так что нельзя исцелиться."
  28: "παραπληξία — поражение, безумие (слав. «неистовство»); ἀορασία — слепота; ἔκστασις διανοίας — исступление ума."
  29: "ψηλαφῶν — ощупывающий (ψηλαφάω); μεσημβρία — полдень; εὐοδώσει — даст успех (εὐοδόω); διαρπαζόμενος — расхищаемый (διαρπάζω)."
  30: "ἕξει αὐτήν — будет иметь её (слав. «возимеет ю»); τρυγήσεις — соберёшь виноград (τρυγάω); триада тщетного труда."
  31: "μόσχος — телёнок; ἐσφαγμένος — закланный (σφάζω); ἡρπασμένος — похищенный (ἁρπάζω); ἀποδοθήσεταί σοι — будет возвращён тебе; «нет помогающего» — формула 28:29, 31."
  32: "δεδομέναι — отданы (перф. пасс.); σφακελίζοντες — гноящиеся, воспалённые (σφακελίζω; ср. Лев 26:16 目を損なう); ἰσχύσει — будет иметь силу."
  33: "ἐκφόρια — произведения, плоды (ἐκφόριον); πόνοι — труды; τεθραυσμένος — сокрушённый (θραύω)."
  34: "παράπληκτος — поражённый, обезумевший; ὁράματα — зрелища, видения."
  35: "ἕλκος πονηρόν — злая язва; γόνατα — колени; κνῆμαι — голени; ἴχνος ποδός — след ноги, подошва; κορυφή — темя."
  36: "ἀπαγάγοι — отведёт (ἀπάγω); ἄρχοντες — начальники, правители (Синодальный «царь» — масоретское чтение); καταστήσῃς ἐπὶ σεαυτόν — поставишь над собой; ξύλοις καὶ λίθοις — дереву и камню."
  37: "αἴνιγμα — загадка, притча (слав. «гадание»); παραβολή — притча, посмешище; διήγημα — рассказ, повествование; тройка передаёт крайнее унижение (ср. 3 Цар 9:7)."
  38: "ἐξοίσεις — вынесешь; εἰσοίσεις — внесёшь, соберёшь; πεδίον — поле; ἀκρίς — саранча (いなご)."
  39: "κατεργᾷ — возделаешь (κατεργάζομαι); σκώληξ — червь; αὐτά — «их» (плоды), ср. слав. «пояст я червь»."
  40: "ἐλαῖαι — маслины, оливковые деревья; χρίσῃ — помажешься (χρίω); ἐκρυήσεται — вытечет, опадет (ἐκρέω); слав. «истечет маслина твоя»."
  41: "γεννήσεις — родишь; οὐκ ἔσονταί σοι — не будут твоими; αἰχμαλωσία — плен."
  42: "ξύλινα — деревянное, деревья; ἐρυσίβη — ржа, головня (болезнь растений; слав. «ржа»); ἐξαναλώσει — истребит."
  43: "ἀναβήσεται ἐπὶ σέ — поднимется над тобой; ἄνω ἄνω / κάτω κάτω — удвоение, «выше и выше, ниже и ниже» (передано ますます)."
  44: "δανιεῖ — даст взаймы; κεφαλή/οὐρά — голова/хвост (ср. 28:13)."
  45: "καταδιώξονταί — будут гнать (καταδιώκω); καταλήμψονταί — постигнут; ἐξολεθρεύσῃ — истребит; ἀπολέσῃ — погубит; φυλάξαι — чтобы хранить (инфинитив цели)."
  46: "σημεῖα καὶ τέρατα — знамения и чудеса; ἕως τοῦ αἰῶνος — до века, навсегда; ἐν σοί — на тебе."
  47: "ἀνθ᾽ ὧν — за то, что (ἀντί); ἐν εὐφροσύνῃ — с веселием; ἀγαθῇ καρδίᾳ — добрым сердцем; διὰ τὸ πλῆθος πάντων — при обилии всего."
  48: "λατρεύσεις — будешь служить; ἐπαποστελεῖ — пошлёт на (ἐπαποστέλλω); λιμός — голод; δίψος — жажда; γυμνότης — нагота; ἔκλειψις — недостаток, оскудение; κλοιός — ошейник, железное ярмо (слав. «ярем железен»)."
  49: "ἐπάξει — наведёт; μακρόθεν — издалека; ἀπ᾽ ἐσχάτου τῆς γῆς — от края земли; ὅρμημα ἀετοῦ — стремительный натиск орла (слав. «устремление орле»); οὐκ ἀκούσῃ τῆς φωνῆς — не поймёшь языка."
  50: "ἀναιδὲς προσώπῳ — бесстыдный лицом, наглый (слав. «безстуден лицем»); θαυμάσει πρόσωπον — почтит лицо (θαυμάζω); ἐλεήσει — помилует."
  51: "κατέδεται — съест; ἔκγονα κτηνῶν — приплод скота; σῖτος — хлеб, зерно; οἶνος — вино; ἔλαιον — елей; καταλιπεῖν — оставить."
  52: "ἐκτρίψῃ — сотрёт, сокрушит; καθαιρεθῶσιν — будут низвергнуты (καθαιρέω); ὀχυρά — крепкие, укреплённые; πέποιθας ἐπ᾽ αὐτοῖς — надеешься на них; θλίψει — будет теснить (θλίβω)."
  53: "στενοχωρία — теснота, стеснение; θλῖψις — скорбь, угнетение; κρέα — мясо, плоть; не смягчать (ср. Лев 26:29)."
  54: "ἁπαλός — изнеженный, нежный; τρυφερός — роскошный, избалованный; βασκανεῖ τῷ ὀφθαλμῷ — будет смотреть дурным, завистливым глазом (βασκαίνω); κόλπος — лоно, недра; καταλελειμμένα τέκνα — оставшиеся дети."
  55: "ὥστε δοῦναι — так что дать (не даст); ἑνὶ αὐτῶν — ни одному из них; σάρκες — плоть; μηθέν — ничего."
  56: "πεῖραν ἔλαβεν — получила опыт, испытала; βαίνειν ἐπὶ τῆς γῆς — ступать по земле; τρυφερότης — роскошь, изнеженность; ἁπαλότης — мягкость."
  57: "χόριον — послед, плацента (слав. «блоне»); μηροί — бёдра; κρυφῇ — тайно; ἔνδεια πάντων — недостаток всего."
  58: "ῥήματα — слова, изречения; βιβλίον — книга; ἔντιμον — честное, драгоценное; θαυμαστόν — дивное, страшное; ΚΥΡΙΟΝ ΤΟΝ ΘΕΟΝ ΣΟΥ — в LXX тетраграмма передана заглавными."
  59: "παραδοξάσει — сделает необычайным, дивным (παραδοξάζω); πληγαί — язвы, удары; πισταί — верные, непреложные, стойкие."
  60: "ὀδύνη — боль, страдание, болезнь (слав. «болезнь»); διευλαβοῦ — боялся, остерегался (διευλαβέομαι); κολληθήσονται — прилепятся."
  61: "μαλακία — слабость, болезнь (слав. «разслабление»); πληγή — язва; ἐπάξει — наведёт; ἐξολεθρεύσῃ — истребит."
  62: "καταλειφθήσεσθε — останетесь (καταλείπω); ἐν ἀριθμῷ βραχεῖ — в числе малом; ἀνθ᾽ ὧν ὅτι — «за то, что» (плеоназм); ὡσεὶ τὰ ἄστρα — как звёзды (ср. Быт 15:5)."
  63: "ὃν τρόπον … οὕτως — как… так; εὐφράνθη — радовался; ἐξολεθρεῦσαι — истребить; ἐξαρθήσεσθε — будете изъяты, удалены (ἐξαίρω); «радоваться, истребляя» не смягчено."
  64: "διασπερεῖ — рассеет; ἀπ᾽ ἄκρου … ἕως ἄκρου — от края до края; ἠπίστω — знал (ἐπίσταμαι, поэтическая форма)."
  65: "ἀναπαύσει — успокоит; στάσις τῷ ἴχνει — «стояние следу ноги», т.е. места, где встать (слав. «стояния стопе ноги»); ἀθυμοῦσαν — унылое, упавшее духом; ἐκλείποντας ὀφθαλμούς — исчезающие, изнемогающие глаза; τηκομένην ψυχήν — истаивающую душу."
  66: "κρεμαμένη — висящая (κρεμάννυμι); ἀπέναντι τῶν ὀφθαλμῶν — пред глазами; οὐ πιστεύσεις τῇ ζωῇ — не будешь уверен в жизни (слав. «не будеши веры яти житию твоему»)."
  67: "Πῶς ἂν γένοιτο — «как бы стало», т.е. «о, если бы»; τὸ πρωΐ/τὸ ἑσπέρας — утром/вечером; ὁράματα — зрелища; причина поставлена в конце, как в LXX."
  68: "ἐν πλοίοις — на кораблях; ᾗ εἶπα — о котором Я сказал; Οὐ προσθήσεσθε ἔτι ἰδεῖν — «не приложите более видеть», больше не увидите; πραθήσεσθε — будете проданы (πιπράσκω); παῖδες/παιδίσκαι — рабы/рабыни; οὐκ ἔσται ὁ κτώμενος — не будет покупающего."
