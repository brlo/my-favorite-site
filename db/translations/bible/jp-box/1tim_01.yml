# jp-box, 1-е Послание к Тимофею, глава 1. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 1: надписание и приветствие (1–2); поручение остаться в Ефесе и запрет
# иных учений, басен и родословий (3–4); цель заповеди — любовь от чистого сердца
# (5); отпадение в пустословие и в законничество (6–7); назначение закона (8–11);
# благодарение за помилование бывшего гонителя (12–17); завещание Тимофею (18–20).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет,
# <j>/<mo> не ставятся. Слова Павла о предании сатане (1:20) — не речь Христа.
# 〔…〕 одно — 1:17 〔知恵ある〕: церковное μόνῳ σοφῷ θεῷ (Елизаветинская «единому
# премудрому Богу»; jp-joc 獨一睿智の神). В gr-lxx-byz 1:17 стоит μόνῳ θεῷ, слова
# σοφῷ нет — проверено запросом к базе, поэтому 〔…〕. В 1:1–16, 18–20 слова все есть.
# Сносок ⟨…⟩ нет: 系図, 作り話, 冒涜 — обычные слова; 奥義, 良心, 使徒, 福音 уже
# встречались в корпусе и пояснены при первом упоминании.
# jp-ni не использовался.

tr_code: jp-box
