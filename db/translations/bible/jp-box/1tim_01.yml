chapter: 1
draft: true

verses:
  1: "パウロ、わたしたちの救[すく]い主[ぬし]である神[かみ]と、わたしたちの希望[きぼう]であるキリスト・イエスとの命令[めいれい]によって、キリスト・イエスの使徒[しと]となった者[もの]である。"
  2: "信仰[しんこう]において、わたしの真[しん]の子[こ]であるテモテへ。{恵[めぐ]み|恩寵[おんちょう]}とあわれみと平和[へいわ]が、父[ちち]である神[かみ]と、わたしたちの主[しゅ]キリスト・イエスから、あなたにありますように。"
  3: "わたしがマケドニアへ向[む]かうとき、あなたにエフェソに留[とど]まるよう頼[たの]んだのは、ある人[ひと]たちに、異[こと]なる教[おし]えを説[と]いてはならないと命[めい]じるためであった。"
  4: "また、作り話[はなし]や果[は]てしのない系図[けいず]に心[こころ]を向[む]けさせないためである。それらは、信仰[しんこう]による神[かみ]の経綸[けいりん]よりも、むしろ論争[ろんそう]を生[しょう]じさせるものである。"
  5: "この命[めい]じの目的[もくてき]は、清[きよ]い心[こころ]と、善[よ]い良心[りょうしん]と、偽[いつわ]りのない信仰[しんこう]とから出[で]る愛[あい]である。"
  6: "ある人[ひと]たちは、これらから外[はず]れて、むなしい論[ろん]にそれてしまった。"
  7: "彼[かれ]らは律法[りっぽう]の教師[きょうし]となろうと望[のぞ]みながら、自分[じぶん]が何[なに]を言[い]っているのか、何[なに]を断言[だんげん]しているのかも理解[りかい]していない。"
  8: "わたしたちは、律法[りっぽう]が善[よ]いものであることを知[し]っている。ただし、人[ひと]がそれを正[ただ]しく用[もち]いるならば、である。"
  9: "すなわち、律法[りっぽう]は義人[ぎじん]のために置[お]かれたのではなく、不法[ふほう]な者[もの]、不従順[ふじゅうじゅん]な者[もの]、不敬虔[ふけいけん]な者[もの]、罪人[ざいにん]、汚[けが]れた者[もの]、俗悪[ぞくあく]な者[もの]、父[ちち]を殺[ころ]す者[もの]、母[はは]を殺[ころ]す者[もの]、人[ひと]を殺[ころ]す者[もの]、"
  10: "みだらなことをする者[もの]、男色[だんしょく]の者[もの]、人[ひと]をさらう者[もの]、偽[いつわ]りを言[い]う者[もの]、偽[いつわ]りを誓[ちか]う者[もの]、そのほか、健全[けんぜん]な教[おし]えに反[はん]するすべてのもののために置[お]かれたのである。"
  11: "これは、祝福[しゅくふく]に満[み]ちた神[かみ]の栄光[えいこう]の福音[ふくいん]にかなうものである。その福音[ふくいん]は、わたしに託[たく]された。"
  12: "わたしに力[ちから]を与[あた]えてくださった、わたしたちの主[しゅ]キリスト・イエスに感謝[かんしゃ]する。主[しゅ]はわたしを忠実[ちゅうじつ]な者[もの]と見[み]なして、この務[つと]めに置[お]いてくださったからである。"
  13: "わたしは以前[いぜん]は、冒涜[ぼうとく]する者[もの]、迫害[はくがい]する者[もの]、侮[あなど]る者[もの]であった。しかし、無知[むち]のうちに、不信仰[ふしんこう]のうちに行[おこな]ったことだったので、あわれみを受[う]けた。"
  14: "しかし、わたしたちの主[しゅ]の{恵[めぐ]み|恩寵[おんちょう]}は、キリスト・イエスにある信仰[しんこう]と愛[あい]とともに、はるかに満[み]ちあふれた。"
  15: "この言葉[ことば]は真実[しんじつ]であり、まったく受[う]け入[い]れるに値[あたい]する。キリスト・イエスが罪人[ざいにん]を救[すく]うために世[よ]に来[こ]られた、ということである。その罪人[ざいにん]のうちで、わたしは第一[だいいち]の者[もの]である。"
  16: "しかし、わたしがあわれみを受[う]けたのは、キリスト・イエスが、わたしという第一[だいいち]の者[もの]のうちに、限[かぎ]りない寛容[かんよう]をお示[しめ]しになるためであった。それは、これから先[さき]、永遠[えいえん]の命[いのち]を得[え]るためにこの方[かた]を信[しん]じる者[もの]たちの模範[もはん]となるためである。"
  17: "永遠[えいえん]の王[おう]、朽[く]ちることのない方[かた]、見[み]えない方[かた]、唯一[ゆいいつ]の〔知恵[ちえ]ある〕神[かみ]に、誉[ほま]れと栄光[えいこう]が、世々[よよ]に限[かぎ]りなくありますように。アーメン。"
  18: "わが子[こ]テモテよ、あなたについて先[さき]に語[かた]られた預言[よげん]に従[したが]って、この命[めい]じをあなたに託[たく]す。それは、あなたがそれらの預言[よげん]によって、善[よ]い戦[たたか]いを戦[たたか]うためである。"
  19: "信仰[しんこう]と善[よ]い良心[りょうしん]とを保[たも]ちなさい。ある人[ひと]たちは、これを退[しりぞ]けて、信仰[しんこう]の面[めん]では難破[なんぱ]してしまった。"
  20: "その中[なか]に、ヒメナイとアレクサンドロがいる。わたしは彼[かれ]らをサタンに引[ひ]き渡[わた]した。神[かみ]を冒涜[ぼうとく]することのないように、戒[いまし]めを受[う]けさせるためである。"

notes:
  1: "Παῦλος ἀπόστολος Χριστοῦ Ἰησοῦ — パウロ、キリスト・イエスの使徒. κατ᾿ ἐπιταγὴν θεοῦ σωτῆρος ἡμῶν — わたしたちの救い主である神の命令によって (ἐπιταγή — «повеление», ср. 1 Кор 7:6; Тит 1:3). Χριστοῦ Ἰησοῦ τῆς ἐλπίδος ἡμῶν — わたしたちの希望であるキリスト・イエス (род. приложения, «надежда наша»). σωτήρ — 救い主[ぬし], как в Деян 5:31. Порядок греч. сохранён: сначала Бог, затем Христос; キリスト・イエス повторено дважды, как в базе."
  2: "Τιμοθέῳ γνησίῳ τέκνῳ ἐν πίστει — 信仰において、わたしの真の子であるテモテへ (γνήσιος — «родной, законный», ср. Тит 1:4). χάρις, ἔλεος, εἰρήνη — 恵みとあわれみと平和: в отличие от других посланий, здесь у Павла стоит ἔλεος (ср. 2 Ин 3). ἀπὸ θεοῦ πατρὸς καὶ Χριστοῦ Ἰησοῦ τοῦ κυρίου ἡμῶν — 父である神と、わたしたちの主キリスト・イエスから; τοῦ κυρίου ἡμῶν относится к Христу, порядок базового текста сохранён."
  3: "καθὼς παρεκάλεσά σε — 頼んだのは…ためであった (καθώς вводит не сравнение, а напоминание о прежнем поручении). πορευόμενος εἰς Μακεδονίαν — マケドニアへ向かうとき. ἵνα παραγγείλῃς τισὶν μὴ ἑτεροδιδασκαλεῖν — 異なる教えを説いてはならないと命じる (ἑτεροδιδασκαλέω — hapax в НЗ, ср. 6:3; ἕτερος — «иной», не «лживый»)."
  4: "μηδὲ προσέχειν — また…心を向けさせない: продолжение ἵνα-придаточного из ст. 3, поэтому стих начат с また. μύθοις — 作り話 (ср. 4:7; Тит 1:14). γενεαλογίαις ἀπεράντοις — 果てしのない系図 (ἀπέραντος — «не имеющий предела»). ἐκζητήσεις παρέχουσιν — 論争を生じさせる. οἰκονομίαν θεοῦ τὴν ἐν πίστει — 信仰による神の経綸; οἰκονομία — 経綸[けいりん], сноска дана при первом месте в корпусе (Еф 1:10), здесь без сноски."
  5: "τὸ τέλος τῆς παραγγελίας — この命じの目的 (τέλος — «цель», не «конец»). ἀγάπη ἐκ καθαρᾶς καρδίας καὶ συνειδήσεως ἀγαθῆς καὶ πίστεως ἀνυποκρίτου — 清い心と善い良心と偽りのない信仰とから出る愛: ἐκ один на три источника. συνείδησις — 良心[りょうしん], ἀνυπόκριτος — 偽りのない (ср. Рим 12:9)."
  6: "ὧν τινες ἀστοχήσαντες — ある人たちは、これらから外れて (ἀστοχέω — «промахнуться», ср. 6:21; 2 Тим 2:18). ἐξετράπησαν εἰς ματαιολογίαν — むなしい論にそれて (ματαιολογία — «пустословие», ср. Тит 1:10)."
  7: "θέλοντες εἶναι νομοδιδάσκαλοι — 律法の教師となろうと望みながら (νομοδιδάσκαλος, ср. Лк 5:17; Деян 5:34). μὴ νοοῦντες — 理解していない. μήτε ἃ λέγουσιν μήτε περὶ τίνων διαβεβαιοῦνται — 何を言っているのか、何を断言しているのか (διαβεβαιόομαι — «настойчиво утверждать», ср. Тит 3:8)."
  8: "Οἴδαμεν δὲ ὅτι καλὸς ὁ νόμος — 律法が善いものであることを知っている. ἐάν τις αὐτῷ νομίμως χρῆται — ただ、人がそれを正しく用いるならば、である (νομίμως — «законно», ср. 2 Тим 2:5; придаточное без главного, отсюда である в конце, ср. 2:15)."
  9: "εἰδὼς τοῦτο — причастие, продолжает ст. 8, поэтому すなわち. δικαίῳ νόμος οὐ κεῖται — 律法は義人のために置かれたのでなく (κεῖται — «положен»). ἀνόμοις καὶ ἀνυποτάκτοις — 不法な者、不従順な者. ἀσεβέσι καὶ ἁμαρτωλοῖς — 不敬虔な者、罪人. ἀνοσίοις καὶ βεβήλοις — 汚れた者、俗悪な者 (ἀνόσιος — «нечестивый», βέβηλος — «профанный, мирской»; два разных слова не сведены в одно). πατρολῴαις καὶ μητρολῴαις — 父を殺す者、母を殺す者 (в греч. два отдельных слова). ἀνδροφόνοις — 人を殺す者. Стих обрывается на 、: перечень продолжается в ст. 10."
  10: "πόρνοις — みだらなことをする者. ἀρσενοκοίταις — 男色の者 (редкое слово, в НЗ только у Павла; не сглажено). ἀνδραποδισταῖς — 人をさらう者 (похититель людей, ср. Исх 21:16). ψεύσταις, ἐπιόρκοις — 偽りを言う者、偽りを誓う者. τῇ ὑγιαινούσῃ διδασκαλίᾳ — 健全な教え (ὑγιαίνω — «быть здоровым»; терминология пастырских посланий: 1:10; 6:3; 2 Тим 1:13; Тит 1:9)."
  11: "κατὰ τὸ εὐαγγέλιον τῆς δόξης — 栄光の福音にかなうものである (κατά — «сообразно»). τοῦ μακαρίου θεοῦ — 祝福に満ちた神: μακάριος о Боге (ср. 6:15), по-японски «блаженный» звучит архаично, поэтому 祝福に満ちた; у jp-joc 洪福なる. ὃ ἐπιστεύθην ἐγώ — その福音は、わたしに託された (πιστεύομαι — «быть вверенным»); подлежащее 福音 добавлено, чтобы не тянуть один период."
  12: "Χάριν ἔχω — 感謝する. τῷ ἐνδυναμώσαντί με — わたしに力を与えてくださった. ὅτι πιστόν με ἡγήσατο — 忠実な者と見なして. θέμενος εἰς διακονίαν — この務めに置いて (διακονία здесь — служение вообще, не сан 執事). 主 во втором предложении добавлено как подлежащее, чтобы не тянуть один период."
  13: "τὸ πρότερον ὄντα βλάσφημον καὶ διώκτην καὶ ὑβριστήν — 以前は、冒涜する者、迫害する者、侮る者 (три обвинения, ср. Деян 8:3; 9:1). ἠλεήθην — あわれみを受けた. ὅτι ἀγνοῶν ἐποίησα ἐν ἀπιστίᾳ — 無知のうちに、不信仰のうちに行ったことだったので (ἀγνοῶν — «не зная»; это причина помилования, а не оправдание)."
  14: "ὑπερεπλεόνασεν — はるかに満ちあふれた (ὑπερπερισσεύω, ср. Рим 5:20). ἡ χάρις τοῦ κυρίου ἡμῶν — わたしたちの主の恵み. μετὰ πίστεως καὶ ἀγάπης τῆς ἐν Χριστῷ Ἰησοῦ — キリスト・イエスにある信仰と愛とともに (τῆς ἐν Χριστῷ Ἰησοῦ относится и к вере, и к любви — не уточнено)."
  15: "πιστὸς ὁ λόγος καὶ πάσης ἀποδοχῆς ἄξιος — この言葉は真実であり、まったく受け入れるに値する: единая формула пастырских посланий (1:15; 3:1; 4:9; 2 Тим 2:11; Тит 3:8). ὅτι Χριστὸς Ἰησοῦς ἦλθεν εἰς τὸν κόσμον ἁμαρτωλοὺς σῶσαι — キリスト・イエスが罪人を救うために世に来られた. ὧν πρῶτός εἰμι ἐγώ — その罪人のうちで、わたしは第一の者である (πρῶτος — «первый», не «первейший»)."
  16: "διὰ τοῦτο ἠλεήθην — あわれみを受けたのは…ためであった. ἵνα ἐν ἐμοὶ πρώτῳ ἐνδείξηται — わたしという第一の者のうちに…お示しになる (ἐνδείκνυμι — «явить»; 第一の者 сохранено и здесь). τὴν ἅπασαν μακροθυμίαν — 限りない寛容 (ἅπασαν — «всю, полную»). πρὸς ὑποτύπωσιν τῶν μελλόντων πιστεύειν ἐπ᾿ αὐτῷ εἰς ζωὴν αἰώνιον — これから先、永遠の命を得るためにこの方を信じる者たちの模範となるため (ὑποτύπωσις — «образец», ср. 2 Тим 1:13)."
  17: "τῷ δὲ βασιλεῖ τῶν αἰώνων — 永遠の王に. ἀφθάρτῳ, ἀοράτῳ — 朽ちることのない方、見えない方 (два прилагательных сохранены раздельно, не сведены в одно). μόνῳ θεῷ — 唯一の…神. 〔知恵ある〕: церковное чтение μόνῳ σοφῷ θεῷ (Елизаветинская «единому премудрому Богу»; слав. «единому премудрому»; jp-joc 獨一睿智の神). В gr-lxx-byz 1:17 стоит μόνῳ θεῷ, σοφῷ нет — проверено запросом к базе, поэтому слово в 〔…〕. εἰς τοὺς αἰῶνας τῶν αἰώνων — 世々に限りなく (как в Еф 3:21). ἀμήν — アーメン: в базе есть, оставлено."
  18: "Ταύτην τὴν παραγγελίαν παρατίθεμαί σοι — この命じをあなたに託す (παρατίθημι — «вверять», ср. 2 Тим 2:2). τέκνον Τιμόθεε — わが子テモテよ (звательный падеж). κατὰ τὰς προαγούσας ἐπὶ σὲ προφητείας — あなたについて先に語られた預言に従って (προάγω — «идти впереди»; ἐπί — «о тебе»). ἵνα στρατεύῃ ἐν αὐταῖς τὴν καλὴν στρατείαν — 善い戦いを戦う (στρατεία — «воинская служба»; ср. 6:12; 2 Тим 4:7, где ἀγών; ἐν αὐταῖς — «ими, по ним»)."
  19: "ἔχων πίστιν καὶ ἀγαθὴν συνείδησιν — 信仰と善い良心とを保ちなさい: причастие при στρατεύῃ, по-японски передано повелением (как в Синодальном «имея»), подлежащее — Тимофей. ἥν τινες ἀπωσάμενοι — ある人たちは、これを退けて (ἀπωθέομαι — «оттолкнуть»). περὶ τὴν πίστιν ἐναυάγησαν — 信仰の面では難破してしまった (ναυαγέω — hapax, ср. 2 Кор 11:25)."
  20: "Ὑμέναιος καὶ Ἀλέξανδρος — ヒメナイとアレクサンドロ (ср. 2 Тим 2:17; 4:14; Деян 19:33). παρέδωκα τῷ Σατανᾷ — サタンに引き渡した (формула отлучения, ср. 1 Кор 5:5). ἵνα παιδευθῶσιν μὴ βλασφημεῖν — 神を冒涜することのないように、戒めを受けさせるため (παιδεύω — «воспитывать, вразумлять наказанием»; βλασφημέω — 冒涜する, как в Деяниях). Слова Павла, не Христа — красного нет."
