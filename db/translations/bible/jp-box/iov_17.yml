# jp-box, Иов, глава 17. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге Иов есть только для глав 1–2; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 17: продолжение речи Иова (начата в 16:2), новой формулы в начале нет.
# Поэтому глава открывается кавычкой 「 в ст. 1 и закрывается в конце ст. 16; в notes
# отмечено «продолжение речи». Дальше — новая формула Вилдада в 18:1.
# Поэзия: тёмные места сохранены (17:3 рукопожатие-поручительство, 17:5 «удел злобы»,
# 17:11 «шум» и «составы сердца», 17:12 «свет близ лица тьмы», 17:16 «сойдём в прах»).
# Нумерация по gr: 16 стихов. Слав. 17:2 вбирает начало гр. 17:3 («украдоша же ми
# имение чуждии»), держимся деления gr.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
# Голоса: 1–16 — Иов (продолжение речи из гл. 16; заканчивается в ст. 16).

