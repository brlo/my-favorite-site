verses:
  1: "「わたしは霊[れい]に運[はこ]ばれて滅[ほろ]びる。わたしは埋葬[まいそう]を求[もと]めるが、得[え]られない。"
  2: "わたしは疲[つか]れ果てて願[ねが]っている。わたしはどうしたらよいのか。"
  3: "他人[たにん]がわたしの財産[ざいさん]を盗[ぬす]んだ。この者[もの]はだれか。わたしの手と結[むす]ばれるように。"
  4: "あなたは彼[かれ]らの心[こころ]を悟[さと]りから隠[かく]した。それゆえ、あなたは彼らを高[たか]く挙げることはない。"
  5: "彼[かれ]は悪[あく]を自分[じぶん]の分[ぶん]として告げ知[し]らせる。わたしの目は子[こ]どもたちのゆえに衰[おとろ]えた。"
  6: "あなたはわたしを諸国民[しょこくみん]の間[あいだ]の噂[うわさ]とし、わたしは彼らの笑[わら]い者[もの]となった。"
  7: "怒[いか]りのゆえに、わたしの目は暗[くら]くなった。わたしはすべての者[もの]からひどく攻[せ]め囲[かこ]まれた。"
  8: "このことで、真[しん]実[じつ]な者[もの]たちは驚[おどろ]きに捕[と]らわれた。正[ただ]しい者[もの]は不法[ふほう]な者[もの]に立ち向[む]かう。"
  9: "忠実[ちゅうじつ]な者[もの]は自分[じぶん]の道[みち]を保[たも]ち、手[て]の清[きよ]い者[もの]は勇気[ゆうき]を増す。"
  10: "しかし、あなたがたはみな、さあ、なおも迫[せま]って来るがよい。わたしはあなたがたのうちに真実[しんじつ]を見[み]いだせないのだから。"
  11: "わたしの日々[ひび]は騒[さわ]ぎのうちに過ぎ去り、わたしの心[こころ]の関節[かんせつ]は裂けた。"
  12: "彼[かれ]らは夜[よる]を昼[ひる]に変えた。光[ひかり]は闇[やみ]の顔[かお]の近[ちか]くにある。"
  13: "たとえわたしが待ち望[のぞ]んでも、よみがわたしの家[いえ]である。わたしの床[とこ]は暗[くら]やみの中[なか]に敷かれている。"
  14: "死[し]をわたしは父[ちち]と呼び、腐[くさ]りを母[はは]、姉妹[しまい]と呼んだ。"
  15: "それなら、わたしの望[のぞ]みはどこにあるのか。わたしの善[ぜん]いものを見る者[もの]が、だれかあるのか。"
  16: "それらはわたしとともに、よみに下[くだ]るのか。わたしたちは共[とも]に塵[ちり]へ下るのか。」"

notes:
  1: "Иов: продолжение речи из 16:2, новой формулы нет — глава открывается цитатой. ὀλέκομαι πνεύματι φερόμενος — «гибну, носи́мый духом» (ὀλέκω — «губить»; φέρω — «нести»); πνεῦμα здесь может значить «дыхание, ветер, дух». δέομαι ταφῆς καὶ οὐ τυγχάνω — «прошу погребения и не получаю» (τυγχάνω с род.). Слав. «тлею духом носимь…»."
  2: "Иов: λίσσομαι κάμνων — «умоляю, изнемогая» (λίσσομαι — «умолять»; κάμνω — «уставать, болеть»); καὶ τί ποιήσας — «и что сделав» (что мне сделать). Слав. 17:2 вбирает и начало ст. 3 («украдоша же ми имение чуждии»); по делению gr это в ст. 3."
  3: "Иов: ἔκλεψαν δέ μου τὰ ὑπάρχοντα ἀλλότριοι — «чужие украли имущество моё» (ὑπάρχοντα — «имущество»); τίς ἐστιν οὗτος; τῇ χειρί μου συνδεθήτω — «кто это? да будет связан с рукою моею»: рукопожатие как поручительство (ср. Син. «поручись»); тёмное место сохранено буквально."
  4: "Иов: ὅτι καρδίαν αὐτῶν ἔκρυψας ἀπὸ φρονήσεως — «ибо сердце их Ты скрыл от разумения» (φρόνησις); διὰ τοῦτο οὐ μὴ ὑψώσῃς αὐτούς — «потому не возвысишь их». Обращение к Богу передано あなた."
  5: "Иов: τῇ μερίδι ἀναγγελεῖ κακίας — «в удел возвестит злобу» (μερίς — «часть, удел»; κακία — «злоба»); ὀφθαλμοὶ δέ μου ἐφ᾽ υἱοῖς ἐτάκησαν — «очи мои на сыновьях истаяли» (τήκω — «плавить, таять»). Тёмное; Син. передаёт иначе («кто обрекает друзей… у детей того глаза истают»)."
  6: "Иов: ἔθου με θρύλημα ἐν ἔθνεσιν — «Ты сделал меня притчей (молвой) в народах» (θρύλημα — «россказни, притча»); γέλως δὲ αὐτοῖς ἀπέβην — «я стал для них смехом» (ἀποβαίνω). Слав. «в притчу во языцех…»."
  7: "Иов: πεπώρωνται ἀπὸ ὀργῆς οἱ ὀφθαλμοί μου — «ибо ослепли (омрачились) от гнева очи мои» (πωρόω — «каменеть, слепнуть»); πεπολιόρκημαι μεγάλως ὑπὸ πάντων — «я сильно осаждён всеми» (πολιορκέω — «осаждать»). Слав. «повоеван бых вельми от всех»."
  8: "Иов: θαῦμα ἔσχεν ἀληθινοὺς ἐπὶ τούτῳ — «изумление объяло истинных при этом» (θαῦμα; ἀληθινός — «истинный, праведный»); δίκαιος ἐπὶ παρανόμῳ ἐπανασταίη — «да восстанет праведник на беззаконного» (ἐπανίστημι); оптатив передан настоящим."
  9: "Иов: σχοίη πιστὸς τὴν ἑαυτοῦ ὁδόν — «да держится верный своего пути» (ἔχω, оптатив); καθαρὸς χεῖρας ἀναλάβοι θάρσος — «чистый руками да примет дерзновение» (ἀναλαμβάνω; θάρσος — «смелость»). Слав. «да содержит же верный путь свой…»."
  10: "Иов: οὐ μὴν ἀλλὰ πάντες ἐρείδετε — «но все вы налегайте (настаивайте)» (ἐρείδω — «упирать, налегать»); δεῦτε δή — «идите же»; οὐ γὰρ εὑρίσκω ἐν ὑμῖν ἀληθές — «ибо не нахожу в вас истины»."
  11: "Иов: αἱ ἡμέραι μου παρῆλθον ἐν βρόμῳ — «дни мои прошли в шуме (грохоте)» (βρόμος — «грохот»; слав. «в течении» — иное понимание); ἐρράγη τὰ ἄρθρα τῆς καρδίας μου — «расселись составы (связки) сердца моего» (ἄρθρον — «член, сустав»). Тёмный образ сохранён."
  12: "Иов: νύκτα εἰς ἡμέραν ἔθηκαν — «ночь в день обратили»; φῶς ἐγγὺς ἀπὸ προσώπου σκότους — «свет близок от лица тьмы»: тёмное, буквально «свет близок [к] лицу тьмы»; передано без сглаживания. Слав. «свет близ от лица тмы»."
  13: "Иов: ἐὰν ὑπομείνω — «если я буду ждать (терпеть)» (ὑπομένω); ᾅδης μου ὁ οἶκος — «ад — дом мой» (ᾅδης — よみ); ἐν γνόφῳ ἔστρωταί μου ἡ στρωμνή — «во мраке постлана мне постель» (γνόφος; στρώννυμι)."
  14: "Иов: θάνατον ἐπεκαλεσάμην πατέρα μου εἶναι — «смерть я призвал быть отцом моим»; μητέρα καὶ ἀδελφὴν σαπρίαν — «матерью и сестрой — гниль» (σαπρία — «гниль, гной»; слав. «гной»)."
  15: "Иов: ποῦ οὖν μου ἔτι ἐστὶν ἡ ἐλπίς — «где же ещё надежда моя»; ἦ τὰ ἀγαθά μου ὄψομαι — «разве увижу блага мои» (ἀγαθά — «благое»)."
  16: "Иов: ἦ μετ᾿ ἐμοῦ εἰς ᾅδην καταβήσονται — «разве сойдут со мною в ад»; ἢ ὁμοθυμαδὸν ἐπὶ χώματος καταβησόμεθα — «или вместе сойдём в прах» (χῶμα — «насыпь, земля»; слав. «в персть»). Здесь речь Иова заканчивается."
