# jp-box, Числа, глава 5. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в этой главе нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 5: удаление нечистых из стана (1–4), исповедание и возврат неправды (5–10),
# жена, заподозренная в измене, и горькая вода (11–31).
# Речь Бога — 「…」 (2–3, 6–10, 12–31); слова священника и ответ женщины внутри
# речи Бога — 『…』 (19–22). Красного нет.
# 〔主〕 в ст. 6: в csl «презирая презрит Господа», в gr-lxx-byz слова κυρίου нет
# (проверено по базе: 5:6 «κυριου» — НЕТ). Больше 〔…〕 нет.
# «Горькая вода» в традиции; в греч. только ὕδωρ τοῦ ἐλεγμοῦ («вода обличения»),
# поэтому в тексте 糾明[きゅうめい]の水, а привычное «горькая» — в notes:
# πικρόν нет (5:18 «πικρ» — НЕТ); образ из евр. и рус. традиции.
# Сносок ⟨…⟩ нет: 重い皮膚病 (Лев 13), 流出 (Лев 15), 祭司, 宿営, 幕屋 уже в корпусе.
# Стихов 31 — как в gr-lxx-byz (совпадает с csl/ru).
# jp-ni не использовался.

