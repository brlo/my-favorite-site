chapter: 5
draft: true

verses:
  1: "主[しゅ]はモーセに言[い]われた。"
  2: "「イスラエルの子[こ]らに命[めい]じて、重[おも]い皮膚病[ひふびょう]の者[もの]、流出[りゅうしゅつ]のある者、死[し]んだ者によって汚[けが]れた者をすべて、宿営[しゅくえい]の外[そと]へ追[お]い出[だ]させなさい。"
  3: "男[おとこ]から女[おんな]に至[いた]るまで、宿営[しゅくえい]の外[そと]へ追[お]い出[だ]しなさい。彼[かれ]らが、わたしの住[す]んでいる彼[かれ]らの宿営を汚[けが]してはならないからである。」"
  4: "イスラエルの子[こ]らはそのとおりに行[おこな]い、彼[かれ]らを宿営[しゅくえい]の外[そと]へ追[お]い出[だ]した。主[しゅ]がモーセに語[かた]られたとおりに、イスラエルの子[こ]らはそのとおりに行[おこな]った。"
  5: "主[しゅ]はモーセに言[い]われた。"
  6: "「イスラエルの子[こ]らに語[かた]って言[い]いなさい。男[おとこ]でも女[おんな]でも、人[ひと]に対[たい]する罪[つみ]のうちの一[ひと]つを犯[おか]し、〔主[しゅ]〕に背[そむ]いて罪を犯[おか]し、その魂[たましい]が罪を負[お]うなら、"
  7: "犯[おか]した罪[つみ]を告白[こくはく]し、その罪責[ざいせき]を全[まった]く償[つぐな]って、それに五分[ごぶ]の一[いち]を加[くわ]え、罪を犯した相手[あいて]に返[かえ]しなさい。"
  8: "もしその人[ひと]に、罪責[ざいせき]を返[かえ]すべき近親[きんしん]がないなら、主[しゅ]に返[かえ]されるべきその罪責は祭司[さいし]のものとなる。ただし、彼[かれ]のために贖[あがな]いをする雄羊[おひつじ]は別[べつ]である。"
  9: "イスラエルの子[こ]らの間[あいだ]で聖別[せいべつ]されるもののうち、彼[かれ]らが主[しゅ]に献[ささ]げる初穂[はつほ]はみな、祭司[さいし]に帰[き]する。"
  10: "おのおのが聖別[せいべつ]したものは、その人[ひと]のものとなる。人[ひと]が祭司[さいし]に与[あた]えるものは、祭司のものとなる。」"
  11: "主[しゅ]はモーセに言[い]われた。"
  12: "「イスラエルの子[こ]らに語[かた]って言[い]いなさい。ある男[おとこ]の妻[つま]が夫[おっと]に背[そむ]き、夫を侮[あなど]って、"
  13: "男[おとこ]が彼女[かのじょ]と寝[ね]て精[せい]を注[そそ]ぎ、それが夫[おっと]の目[め]から隠[かく]れ、彼女[かのじょ]が身[み]を汚[けが]していながら、証人[しょうにん]が彼女[かのじょ]になく、捕[つか]まえられもしないなら、"
  14: "夫[おっと]に妬[ねた]みの霊[れい]が降[ふ]りかかり、妻[つま]を妬[ねた]んで、彼女[かのじょ]が身[み]を汚[けが]している場合[ばあい]、また夫[おっと]に妬みの霊[れい]が降りかかり、妻[つま]を妬んで、彼女[かのじょ]が身を汚していない場合[ばあい]である。"
  15: "その人[ひと]は妻[つま]を祭司[さいし]のところへ連[つ]れて行[い]き、彼女[かのじょ]のために捧[ささ]げ物[もの]を献[ささ]げなさい。大麦[おおむぎ]の粉[こな]の十分[じゅうぶん]の一[いち]エファである。その上[うえ]に油[あぶら]を注[そそ]いではならず、その上に乳香[にゅうこう]を置[お]いてもならない。これは妬[ねた]みの犠牲[ぎせい]、罪[つみ]を思[おも]い起[おこ]させる記念[きねん]の犠牲であるからである。"
  16: "祭司[さいし]は彼女[かのじょ]を連[つ]れて来[き]て、主[しゅ]の前[まえ]に立[た]たせなさい。"
  17: "祭司[さいし]は土[つち]の器[うつわ]に生[い]ける清[きよ]い水[みず]を取[と]り、証[あかし]の幕屋[まくや]の床[ゆか]にある土[つち]を取[と]って、その水[みず]に入[い]れなさい。"
  18: "祭司[さいし]は女[おんな]を主[しゅ]の前[まえ]に立[た]たせ、女の頭[あたま]を露[あらわ]にし、その手[て]に記念[きねん]の犠牲[ぎせい]、すなわち妬[ねた]みの犠牲を渡[わた]しなさい。祭司[さいし]の手[て]には、呪[のろ]いを伴[ともな]う糾明[きゅうめい]の水[みず]がある。"
  19: "祭司[さいし]は女[おんな]に誓[ちか]わせて言[い]いなさい。『もし男[おとこ]があなたと寝[ね]ておらず、あなたが夫[おっと]のもとで背[そむ]いて身[み]を汚[けが]すことがなかったなら、この呪[のろ]いの糾明[きゅうめい]の水[みず]から免[まぬが]れなさい。"
  20: "しかし、もしあなたが夫[おっと]のもとにありながら背[そむ]き、身[み]を汚[けが]していて、あなたの夫のほかの者[もの]があなたと寝[ね]たなら、』"
  21: "祭司[さいし]は女[おんな]にこの呪[のろ]いの誓[ちか]いを誓[ちか]わせ、女に言[い]いなさい。『主[しゅ]があなたを、あなたの民[たみ]の間[あいだ]で呪[のろ]いと誓[ちか]いの的[まと]となさり、主[しゅ]があなたの腿[もも]を衰[おとろ]えさせ、腹[はら]を膨[ふく]らませるように。"
  22: "この呪[のろ]いの水[みず]があなたの腹[はら]に入[はい]って腹を膨[ふく]らませ、腿[もも]を衰[おとろ]えさせるように。』女[おんな]は『そのとおりになりますように。そのとおりになりますように』と言[い]う。"
  23: "祭司[さいし]はこれらの呪[のろ]いを巻物[まきもの]に書[か]き、その呪いの水[みず]に洗[あら]い流[なが]しなさい。"
  24: "祭司[さいし]は女[おんな]に、この呪[のろ]いの糾明[きゅうめい]の水[みず]を飲[の]ませなさい。呪いの水[みず]が彼女[かのじょ]の腹[はら]に入[はい]るのである。"
  25: "祭司[さいし]は女[おんな]の手[て]から妬[ねた]みの犠牲[ぎせい]を取[と]り、その犠牲を主[しゅ]の前[まえ]にささげ、祭壇[さいだん]のところへ持[も]って行[い]きなさい。"
  26: "祭司[さいし]はその犠牲[ぎせい]から記念[きねん]の分[ぶん]を一[ひと]掴[つか]み取[と]って祭壇[さいだん]の上[うえ]で焼[や]き、その後[のち]に女[おんな]にその水[みず]を飲[の]ませなさい。"
  27: "もし彼女[かのじょ]が身[み]を汚[けが]していて、夫[おっと]に背[そむ]いていたなら、呪[のろ]いの水[みず]が彼女[かのじょ]の腹[はら]に入[はい]って腹[はら]を膨[ふく]らませ、腿[もも]を衰[おとろ]えさせ、その女[おんな]は自分[じぶん]の民[たみ]の間[あいだ]で呪[のろ]いとなる。"
  28: "もし女[おんな]が身[み]を汚[けが]しておらず、清[きよ]ければ、彼女[かのじょ]は害[がい]を受[う]けず、子[こ]を宿[やど]すであろう。"
  29: "これは妬[ねた]みの法[ほう]である。女[おんな]が夫[おっと]のもとにありながら背[そむ]き、身[み]を汚[けが]した場合[ばあい]、"
  30: "また、ある人[ひと]に妬[ねた]みの霊[れい]が降[ふ]りかかり、妻[つま]を妬[ねた]んだ場合[ばあい]、祭司[さいし]はその女[おんな]を主[しゅ]の前[まえ]に立[た]たせ、この法[ほう]のすべてを彼女[かのじょ]に行[おこな]いなさい。"
  31: "その男[おとこ]は罪[つみ]を免[まぬが]れ、その女[おんな]は自分[じぶん]の罪[つみ]を負[お]う。」"

notes:
  1: "Καὶ ἐλάλησεν κύριος πρὸς Μωυσῆν λέγων — обычная формула введения речи; λέγων по-японски отдельно не передаётся. У csl «рече Господь к Моисею»."
  2: "Πρόσταξον — повели накл. от προστάσσω, «прикажи» (не «скажи»). ἐξαποστειλάτωσαν — 3 л. мн. ч. повелительного, «пусть вышлют». λεπρός — «поражённый проказой» (重い皮膚病, как в Лев 13). γονορρυής — «имеющий истечение семени» (γόνος + ῥέω; в Лев 15:32 — 流出のある者). ἀκάθαρτος ἐπὶ ψυχῇ — букв. «нечистый по душе», т.е. осквернённый мёртвым (ср. 6:6 ἐπὶ ψυχῇ τετελευτηκυίᾳ); слав. «нечистаго душею», Синодальный уточняет «осквернившихся от мертвого»."
  3: "ἀπὸ ἀρσενικοῦ ἕως θηλυκοῦ — «от мужского пола до женского», т.е. и мужчин, и женщин. οὐ μὴ μιανοῦσιν — усиленное отрицание с будущим: «не осквернят непременно». καταγίνομαι — «обитать, пребывать» (слав. «пребываю»). Предлог ἐν οἷς относится к станам: «в которых Я обитаю среди них»."
  4: "καθὰ ἐλάλησεν κύριος τῷ Μωυσῇ, οὕτως ἐποίησαν — двойное «так сделали» в конце стиха сохранено (повтор, как в LXX и слав.)."
  5: "Новое введение речи; ср. ст. 1."
  6: "Ἀνὴρ ἢ γυνή — «мужчина или женщина», т.е. всякий человек. ἀπὸ τῶν ἁμαρτιῶν τῶν ἀνθρωπίνων — «из грехов человеческих», т.е. проступок против человека. παριδὼν παρίδῃ — букв. «презрев презрит» (παροράω — «проглядеть, презреть»); в csl добавлено «Господа», в gr-lxx-byz слова κυρίου нет, поэтому в тексте 〔主〕. πλημμελέω — «провиниться, совершить преступление»."
  7: "ἐξαγορεύσει — «объявит, исповедует» (ἐξαγορεύω). τὸ κεφάλαιον — «главное», т.е. полная сумма долга (слав. «истое»). τὸ ἐπίπεμπτον — «пятая часть» (20 %). τίνι ἐπλημμέλησεν αὐτῷ — «тому, кому он провинился»."
  8: "ὁ ἀγχιστεύων — «ближайший родственник, имеющий право выкупа» (слав. «ужик»). τὸ πλημμέλημα τὸ ἀποδιδόμενον κυρίῳ τῷ ἱερεῖ ἔσται — «возвращаемая неправда будет Господу, священнику»; в греч. соединены оба адресата. κριὸς τοῦ ἱλασμοῦ — «овен умилостивления» (слав. «овен очищения»), т.е. сверх него."
  9: "ἀπαρχή — «начаток, первина» (初穂); κατὰ πάντα τὰ ἁγιαζόμενα — «по всему освящаемому». τῷ κυρίῳ τῷ ἱερεῖ — «Господу, священнику»: греч. текст соединяет два датива, отсюда «принадлежит священнику»."
  10: "τὰ ἡγιασμένα αὐτοῦ — «освящённое им» остаётся у него; ἀνὴρ ὃς ἐὰν δῷ τῷ ἱερεῖ, αὐτῷ ἔσται — «что человек даст священнику, тому (священнику) будет». Двусмысленность αὐτῷ сохранена."
  11: "Новое введение речи; ср. ст. 1 и 5."
  12: "Ἀνδρὸς ἀνδρὸς — дистрибутивный повтор: «у кого бы то ни было из мужей». παραβῇ — «преступит» (παραβαίνω), о нарушении верности. παρῇδῃ αὐτὸν ὑπεριδοῦσα — «презрев, презрит его» (ὑπεροράω — «смотреть мимо, пренебрегать»)."
  13: "κοίτην σπέρματος — «ложем семени» (эвфемизм LXX, без грубости). λάθῃ ἐξ ὀφθαλμῶν — «утаится от глаз». κρύψῃ — «скроется». μεμιαμμένη — прич. перфекта от μιαίνω, «осквернена». συνειλημμένη — «уличена, поймана» (συλλαμβάνω), слав. «ята»."
  14: "πνεῦμα ζηλώσεως — «дух ревности/ревнования»; ζηλόω — «ревновать». Дважды повторённое условие («осквернена» / «не осквернена») сохранено, как в LXX и слав."
  15: "ἄξει — «приведёт» (ἄγω). τὸ δέκατον τοῦ οιφι — «десятая часть ефы» (οιφι — евр. אֵיפָה, ефа; в греч. стоит несклоняемая форма). ἄλευρον κρίθινον — «ячменная мука» (大麦の粉). ἐπιχεεῖ / ἐπιθήσει — будущее в значении запрета: «да не возольёт… да не положит». θυσία ζηλοτυπίας — «жертва ревнования»; θυσία μνημοσύνου ἀναμιμνήσκουσα ἁμαρτίαν — «жертва воспоминания, напоминающая грех»."
  16: "προσάξει — «приведёт, приблизит» (προσάγω); στήσει — «поставит» (ἵστημι)."
  17: "ὕδωρ καθαρὸν ζῶν — «чистая живая (проточная) вода»; ἀγγεῖον ὀστράκινον — «глиняный сосуд». τῆς γῆς τῆς οὔσης ἐπὶ τοῦ ἐδάφους — «земля, которая на полу» (ἔδαφος — пол, помост). ἐμβαλεῖ — «всыплет, бросит во»."
  18: "ἀποκαλύψει τὴν κεφαλήν — «откроет голову», т.е. снимет покрывало (в тексте «сделает голову открытой», без добавления слова «покрывало»). θυσία τοῦ μνημοσύνου — см. ст. 15. ὕδωρ τοῦ ἐλεγμοῦ τοῦ ἐπικαταρωμένου — «вода обличения проклятия» (ἐλεγμός — «изобличение»; ἐπικατάρατος — «проклятый»). Слово «горькая» (苦い) в греч. отсутствует — это устойчивое обозначение из евр. и рус. традиции, закреплённое брифом."
  19: "ὁρκιεῖ — «заклянёт, приведёт к клятве» (ὁρκίζω). ἀθῴα ἴσθι — «будь невинна, невредима» (ἀθῷος). ὑπὸ τὸν ἄνδρα τὸν σεαυτῆς — «под мужем твоим», т.е. в браке."
  20: "παραβέβηκας ὑπ᾽ ἀνδρὸς οὖσα — «ты преступила, будучи под мужем» (замужем). ἔδωκέν τις τὴν κοίτην αὐτοῦ ἐν σοί — букв. «дал кто ложе своё в тебе»; πλὴν τοῦ ἀνδρός σου — «кроме мужа твоего». Условие обрывается на середине: продолжение (проклятие) — в ст. 21, как и в LXX."
  21: "ἐν τοῖς ὅρκοις τῆς ἀρᾶς ταύτης — «клятвами проклятия сего». Δῴη — оптатив от δίδωμι: «да даст». ἐν ἀρᾷ καὶ ἐνόρκιον — «в проклятие и в заклятие» (ἐνόρκιος — «подклятвенный»). μηρὸς διαπεπτωκώς — «опалое бедро» (διαπίπτω — «опадать»); κοιλία πεπρησμένη — «воспалённый, раздутый живот» (πρήθω — «раздувать»)."
  22: "πρῆσαι γαστέρα — «раздуть живот»; διαπεσεῖν μηρόν — «опасть бедру». Γένοιτο, γένοιτο — «да будет, да будет» (оптатив γίνομαι); слав. «буди, буди», Синодальный «аминь, аминь»."
  23: "γράψει … εἰς βιβλίον — «напишет в книгу/свиток» (βιβλίον); ἐξαλείψει εἰς τὸ ὕδωρ — «сотрёт, смоет в воду» (ἐξαλείφω)."
  24: "ποτιεῖ — «напоит» (ποτίζω). εἰσελεύσεται εἰς αὐτήν — «войдёт в неё»; Синодальный прибавляет «ко вреду её», в греч. этого нет."
  25: "λήμψεται ἐκ χειρός — «возьмёт из руки». ἐπιθήσει τὴν θυσίαν ἔναντι κυρίου — «возложит (поставит) жертву пред Господом»; προσοίσει πρὸς τὸ θυσιαστήριον — «принесёт к жертвеннику». Это не обряд потрясания, поэтому «ささげ…持って行き», без «揺り動かす»."
  26: "δράξεται … τὸ μνημόσυνον — «возьмёт горстью часть памяти» (δράσσομαι — «хватать»). ἀνοίσει ἐπὶ τὸ θυσιαστήριον — «вознесёт на жертвенник» (сожжёт)."
  27: "λήθῃ λάθῃ τὸν ἄνδρα αὐτῆς — «утаила утаит от мужа своего» (λανθάνω). πρησθήσεται τὴν κοιλίαν — «раздуется в животе» (вин. отношения). εἰς ἀρὰν ἐν τῷ λαῷ αὐτῆς — «в проклятие в народе её»."
  28: "καθαρὰ ᾖ — «чиста будет». ἀθῴα ἔσται — «невредима будет». ἐκσπερματιεῖ σπέρμα — «даст семя, оплодотворится» (ἐκσπερματίζω, редкий глагол); Синодальный «будет оплодотворяема семенем»."
  29: "οὗτος ὁ νόμος τῆς ζηλοτυπίας — «вот закон ревнования». ᾧ ἐὰν παραβῇ ἡ γυνὴ ὑπ᾽ ἀνδρὸς οὖσα — «если преступит жена, будучи под мужем»."
  30: "ᾧ ἐὰν ἐπέλθῃ … πνεῦμα ζηλώσεως — «на кого найдёт дух ревности». ποιήσει αὐτῇ … πάντα τὸν νόμον τοῦτον — «сделает с нею весь этот закон»."
  31: "ἀθῷος ἔσται ὁ ἄνθρωπος ἀπὸ ἁμαρτίας — «чист будет человек от греха» (ἀθῷος — «невинный, свободный от вины»). λήμψεται τὴν ἁμαρτίαν αὐτῆς — «примет грех свой», т.е. понесёт последствия."
