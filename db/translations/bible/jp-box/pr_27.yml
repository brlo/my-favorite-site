# jp-box, Притчи, глава 27. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для гл. 27 нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 27: не хвались завтрашним (1); хвала другого (2); гнев глупца (3–4);
# открытое обличение (5–6); сытая душа (7); птица вне гнезда (8); благовония и печаль (9);
# друг и брат (10); будь мудр (11); благоразумный и безумный (12); порука (13);
# ранняя хвала (14); сварливая жена (15–16); железо и друг (17); смоковница и господин (18);
# лица и сердца (19); ненасытные глаза (20); испытание похвалой (21); глупость не отделить
# (22); забота о стаде (23–27).
# Прямой речи нет.
# Нумерация по gr: 27 стихов, деление совпадает с csl. В ст. 20 и 21 gr содержат
# подстихи 20a и 21a — они есть и в csl, переведены в тех же стихах.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).

