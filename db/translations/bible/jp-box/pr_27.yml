verses:
  1: "明日[あした]のことを誇[ほこ]るな。明日[あした]が何[なに]を生[う]むか、あなたは知[し]らないからである。"
  2: "あなたの近[ちか]くの者[もの]があなたをほめたたえよ。あなたの口[くち]ではなく、他人[たにん]が、あなたの唇[くちびる]ではなく。"
  3: "石[いし]は重[おも]く、砂[すな]も運[はこ]びにくい。しかし、愚[おろ]かな者[もの]の怒[いか]りは、そのどちらよりも重[おも]い。"
  4: "情[なさ]け知[し]らずの激怒[げきど]と鋭[するど]い怒[いか]りがある。しかし、妬[ねた]みの前[まえ]には誰[だれ]も立[た]ち向[む]かえない。"
  5: "隠[かく]された愛[あい]よりも、明[あき]らかにされた責[せ]めのほうが良[よ]い。"
  6: "友[とも]の傷[きず]は、敵[てき]の自[じ]発的[はつてき]な口[くち]づけよりも信頼[しんらい]できる。"
  7: "満[み]ち足[た]りた魂[たましい]は蜂[はち]の巣[す]をもてあそび、飢[う]えた魂[たましい]には苦[にが]いものさえ甘[あま]く思[おも]える。"
  8: "鳥[とり]が自分[じぶん]の巣[す]から飛[と]び去[さ]るように、人[ひと]も自分[じぶん]の場所[ばしょ]から離[はな]れると奴隷[どれい]になる。"
  9: "香油[こうゆ]とぶどう酒[しゅ]と香[こう]によって心[こころ]は喜[よろこ]ぶ。しかし、不幸[ふこう]によって魂[たましい]は引[ひ]き裂[さ]かれる。"
  10: "あなたの友[とも]、あなたの父[ちち]の友[とも]を見捨[みす]てるな。不幸[ふこう]な日に、あなたの兄弟[きょうだい]の家[いえ]へ入[はい]るな。遠[とお]くに住[す]む兄弟よりも、近[ちか]くにいる友[とも]のほうが良[よ]い。"
  11: "わが子[こ]よ、賢[かしこ]くなれ。わたしの心[こころ]が喜[よろこ]ぶために。あなたから恥[はじ]となる言葉[ことば]を遠[とお]ざけよ。"
  12: "賢[かしこ]い者[もの]は災[わざわ]いが来[く]るのを見[み]て身[み]を隠[かく]す。しかし、愚[おろ]かな者[もの]たちは進[すす]んで行[ゆ]き、罰[ばつ]を受[う]ける。"
  13: "彼[かれ]の上着[うわぎ]を取[と]り上[あ]げよ。彼[かれ]は通[とお]り過[す]ぎたからである。他人[たにん]の物[もの]を損[そこ]なう者[もの]は、すべて嘲笑[ちょうしょう]する者[もの]である。"
  14: "朝早[あさはや]く大[おお]きな声[こえ]で友[とも]を祝福[しゅくふく]する者[もの]は、呪[のろ]う者[もの]と少[すこ]しも変[か]わらないと見[み]なされる。"
  15: "冬[ふゆ]の日[ひ]に激[はげ]しく降[ふ]る雨[あめ]だれは、人[ひと]をその家[いえ]から追[お]い出[だ]す。同[おな]じように、口[くち]うるさい女[おんな]も、人[ひと]を家[いえ]から追[お]い出[だ]す。"
  16: "北風[きたかぜ]は激[はげ]しい風[かぜ]であるが、名[な]では心地[ここち]よいものと呼[よ]ばれている。"
  17: "鉄[てつ]は鉄[てつ]を鋭[するど]くする。人[ひと]も友[とも]の顔[かお]を鋭くする。"
  18: "いちじくの木[き]を植[う]える者[もの]はその実[み]を食[た]べ、自分[じぶん]の主人[しゅじん]を守[まも]る者[もの]は尊[とうと]ばれる。"
  19: "顔[かお]と顔[かお]が似[に]ていないように、人[ひと]の心[こころ]も互[たが]いに似ていない。"
  20: "よみと滅[ほろ]びは満[み]ちることがない。同[おな]じように、人[ひと]の目[め]も飽[あ]きることがない。主[しゅ]にとって忌[い]まわしいのは、目[め]を据[す]える者[もの]であり、無[む]教養[きょうよう]な者[もの]は舌[した]を制[せい]することができない。"
  21: "銀[ぎん]には試[ため]しの器[うつわ]、金[きん]には炉[ろ]がある。人[ひと]は、自分[じぶん]をほめる者[もの]たちの口[くち]によって試[ため]される。不法[ふほう]な者[もの]の心[こころ]は悪[あく]を求[もと]め、正[まっ]すぐな心[こころ]は知識[ちしき]を求める。"
  22: "たとえ愚[おろ]かな者[もの]を集会[しゅうかい]のただ中[なか]で辱[はずかし]めて打[う]っても、その愚[おろ]かさを取[と]り除[のぞ]くことはできない。"
  23: "あなたの群[む]れの魂[たましい]をよく知[し]り、あなたの群[む]れに心[こころ]を留[と]めよ。"
  24: "人[ひと]には力[ちから]と強[つよ]さが永遠[えいえん]にあるのではない。また、それを代々[よよ]に伝[つた]えるのでもない。"
  25: "畑[はたけ]の青[あお]いものに心[こころ]を配[くば]れ。そうすれば、草[くさ]を刈[か]り取[と]り、山[やま]の草[くさ]を集[あつ]めることができる。"
  26: "羊[ひつじ]を衣[ころも]とすることができるように。畑[はたけ]を大事[だいじ]にせよ。そうすれば、子羊[こひつじ]があなたのものとなる。"
  27: "わが子[こ]よ、あなたはわたしから、あなたのいのちのため、またあなたのしもべたちのいのちのためになる力[ちから]ある言葉[ことば]を受[う]け取[と]っている。"

notes:
  1: "μὴ καυχῶ τὰ εἰς αὔριον — «не хвались тем, что [будет] завтра» (καυχάομαι — «хвалиться»); τί τέξεται ἡ ἐπιοῦσα — «что родит наступающий [день]» (τίκτω — «рождать»; ἐπιοῦσα — «наступающая»); слав. «не веси бо, что родит день находяй»."
  2: "ἐγκωμιαζέτω σε ὁ πέλας — «пусть хвалит тебя ближний» (ἐγκωμιάζω — «восхвалять»; πέλας — «близкий»); καὶ μὴ τὸ σὸν στόμα, ἀλλότριος καὶ μὴ τὰ σὰ χείλη — «и не твои уста, чужой, и не твои губы»."
  3: "βαρὺ λίθος καὶ δυσβάστακτον ἄμμος — «тяжёл камень и неудобоносим песок» (δυσβάστακτος — «трудноносимый»; ἄμμος — «песок»); ὀργὴ δὲ ἄφρονος βαρυτέρα ἀμφοτέρων — «гнев же глупого тяжелее обоих»."
  4: "ἀνελεήμων θυμὸς καὶ ὀξεῖα ὀργή — «безжалостна ярость и остр гнев» (ἀνελεήμων — «не имеющий милости»; θυμός — «ярость»); ἀλλ᾽ οὐδένα ὑφίσταται ζῆλος — «но никто не выстоит против ревности (зависти)» (ζῆλος — «ревность, рвение»); слав. «но ничтоже постоит ревности»."
  5: "κρείσσους ἔλεγχοι ἀποκεκαλυμμένοι κρυπτομένης φιλίας — «лучше обличения открытые скрываемой дружбы» (ἔλεγχος — «обличение»; ἀποκαλύπτω — «открывать»); слав. «лучше обличения откровенна тайныя любве»."
  6: "ἀξιοπιστότερά ἐστιν τραύματα φίλου — «более достойны веры раны друга» (ἀξιόπιστος — «заслуживающий доверия»; τραῦμα — «рана»); ἢ ἑκούσια φιλήματα ἐχθροῦ — «чем добровольные поцелуи врага» (ἑκούσιος — «добровольный»). Синодальный «искренни укоризны от любящего» (по масоретскому тексту)."
  7: "ψυχὴ ἐν πλησμονῇ οὖσα κηρίοις ἐμπαίζει — «душа, в сытости сущая, над сотами насмехается» (ἐμπαίζω — «издеваться, пренебрегать»); ψυχῇ δὲ ἐνδεεῖ καὶ τὰ πικρὰ γλυκέα φαίνεται — «душе же нуждающейся и горькое сладким кажется» (ἐνδεής — «нуждающийся»)."
  8: "ὥσπερ ὅταν ὄρνεον καταπετασθῇ ἐκ τῆς ἰδίας νοσσιᾶς — «как когда птица улетит из своего гнезда» (καταπέτομαι — «улетать»; νοσσιά — «гнездо»); ἄνθρωπος δουλοῦται, ὅταν ἀποξενωθῇ ἐκ τῶν ἰδίων τόπων — «человек порабощается, когда отчуждается от своих мест» (ἀποξενόω — «отчуждать»). Синодальный «человек, покинувший место свое»."
  9: "μύροις καὶ οἴνοις καὶ θυμιάμασιν τέρπεται καρδία — «мирром, вином и фимиамом услаждается сердце» (μύρον — «благовоние, миро»; θυμίαμα — «фимиам»); καταρρήγνυται δὲ ὑπὸ συμπτωμάτων ψυχή — «разрывается же от несчастий душа» (σύμπτωμα — «падение, беда»; καταρρήγνυμι — «разрывать»). Синодальный иной (по масоретскому тексту: «друг сердечным советом»)."
  10: "φίλον σὸν ἢ φίλον πατρῷον μὴ ἐγκαταλίπῃς — «друга твоего или друга отца твоего не оставляй» (πατρῷος — «отцовский»); εἰς δὲ τὸν οἶκον τοῦ ἀδελφοῦ σου μὴ εἰσέλθῃς ἀτυχῶν — «в дом же брата твоего не входи в несчастье» (ἀτυχέω — «терпеть неудачу»); κρείσσων φίλος ἐγγὺς ἢ ἀδελφὸς μακρὰν οἰκῶν — «лучше друг близкий, чем брат далеко живущий»."
  11: "σοφὸς γίνου, υἱέ — «будь мудр, сын»; ἵνα εὐφραίνηταί μου ἡ καρδία — «чтобы радовалось сердце моё»: в gr — μου (моё), слав. читает «сердце твое»; ἀπόστρεψον ἀπὸ σοῦ ἐπονειδίστους λόγους — «отврати от себя слова поносные» (ἐπονείδιστος — «постыдный»)."
  12: "πανοῦργος κακῶν ἐπερχομένων ἀπεκρύβη — «хитрый (благоразумный) при наступающих бедах скрылся» (πανοῦργος — «ловкий, умный»; ἀποκρύπτομαι — «скрываться»); ἄφρονες δὲ ἐπελθόντες ζημίαν τείσουσιν — «глупые же, наступив, потерпят ущерб» (ζημία — «убыток, наказание»)."
  13: "ἀφελοῦ τὸ ἱμάτιον αὐτοῦ, παρῆλθεν γάρ — «возьми (отними) одежду его, ибо он прошёл»: тёмное место; слав. «отими ризу его, прейде бо досадитель» (досадитель отнесено к следующей части). ὑβριστὴς ὅστις τὰ ἀλλότρια λυμαίνεται — «наглец (обидчик) всякий, кто чужое губит» (ὑβριστής — «наглый, обидчик»). Синодальный иной (по масоретскому тексту: поручительство за чужого)."
  14: "ὃς ἂν εὐλογῇ φίλον τὸ πρωῒ μεγάλῃ τῇ φωνῇ — «кто благословляет друга рано утром громким голосом» (πρωί — «рано утром»); καταρωμένου οὐδὲν διαφέρειν δόξει — «покажется ничем не отличающимся от проклинающего» (καταράομαι — «проклинать»; διαφέρω — «отличаться»)."
  15: "σταγόνες ἐκβάλλουσιν ἄνθρωπον ἐν ἡμέρᾳ χειμερινῇ ἐκ τοῦ οἴκου αὐτοῦ — «капли изгоняют человека в день зимний из дома его» (σταγών — «капля»; χειμερινός — «зимний»); ὡσαύτως καὶ γυνὴ λοίδορος ἐκ τοῦ ἰδίου οἴκου — «так же и жена сварливая из своего дома». Синодальный иной (по масоретскому тексту)."
  16: "βορέας σκληρὸς ἄνεμος — «север [ветер] жестокий ветер» (σκληρός — «жёсткий, жестокий»); ὀνόματι δὲ ἐπιδείξιος καλεῖται — тёмное: «по имени же приятным называется»; слав. «север жесток ветр, именем же приятен нарицается». Синодальный продолжает здесь речь о сварливой жене (по масоретскому тексту); держимся греческого."
  17: "σίδηρος σίδηρον ὀξύνει — «железо железо острит» (ὀξύνω — «заострять»); ἀνὴρ δὲ παροξύνει πρόσωπον ἑταίρου — «муж же изощряет лицо друга» (παροξύνω — «побуждать, обострять»), т. е. общение с другом оттачивает человека."
  18: "ὃς φυτεύει συκῆν, φάγεται τοὺς καρποὺς αὐτῆς — «кто сажает смоковницу, съест плоды её» (συκῆ — «смоковница»); ὃς δὲ φυλάσσει τὸν ἑαυτοῦ κύριον, τιμηθήσεται — «кто же хранит (стережёт) своего господина, почтён будет». Синодальный иной (по масоретскому тексту: «кто стережет смоковницу»)."
  19: "ὥσπερ οὐχ ὅμοια πρόσωπα προσώποις — «как несходны лица с лицами»; οὕτως οὐδὲ αἱ καρδίαι τῶν ἀνθρώπων — «так и сердца людей». Синодальный иной («как в воде лицо — к лицу», по масоретскому тексту)."
  20: "ᾅδης καὶ ἀπώλεια οὐκ ἐμπίμπλανται — «ад и погибель не наполняются» (ᾅδης — よみ); ὡσαύτως καὶ οἱ ὀφθαλμοὶ τῶν ἀνθρώπων ἄπληστοι — «так же и глаза людей ненасытны» (ἄπληστος — «ненасытный»). Подстих 20a: βδέλυγμα κυρίῳ στηρίζων ὀφθαλμόν — «мерзость Господу утверждающий (упорно держащий) око»; οἱ ἀπαίδευτοι ἀκρατεῖς γλώσσῃ — «необученные невоздержны языком»; в gr и csl он в том же стихе, отдельного стиха нет."
  21: "δοκίμιον ἀργύρῳ καὶ χρυσῷ πύρωσις — «испытание серебру и золоту — плавка (огонь)» (δοκίμιον — «проба, испытание»; πύρωσις — «плавление»); ἀνὴρ δὲ δοκιμάζεται διὰ στόματος ἐγκωμιαζόντων αὐτόν — «муж же испытывается устами хвалящих его». Подстих 21a: καρδία ἀνόμου ἐκζητεῖ κακά, καρδία δὲ εὐθὺς ἐκζητεῖ γνῶσιν — «сердце беззаконного ищет зла, сердце же правое ищет знания» (εὐθύς — «прямой»); в том же стихе, как в gr и csl."
  22: "ἐὰν μαστιγοῖς ἄφρονα ἐν μέσῳ συνεδρίου ἀτιμάζων — «если будешь бичевать глупого посреди собрания, бесчестя его» (μαστιγόω — «бичевать»; ἀτιμάζω — «бесчестить»); οὐ μὴ περιέλῃς τὴν ἀφροσύνην αὐτοῦ — «не удалишь (не снимешь) глупости его», усиленное οὐ μή (περιαιρέω — «снимать, удалять»). Синодальный иной (по масоретскому тексту: «толки глупого в ступе»)."
  23: "γνωστῶς ἐπιγνώσῃ ψυχὰς ποιμνίου σου — «с знанием (хорошо) узнаешь души стада твоего» (γνωστῶς — «познавательно, ясно»; ποίμνιον — «стадо»); ἐπιστήσεις καρδίαν σου σαῖς ἀγέλαις — «обратишь сердце твоё к стадам твоим» (ἀγέλη — «стадо»)."
  24: "οὐ τὸν αἰῶνα ἀνδρὶ κράτος καὶ ἰσχύς — «не на век (не навсегда) мужу держава и сила» (κράτος — «власть, сила»); οὐδὲ παραδίδωσιν ἐκ γενεᾶς εἰς γενεάν — «и не передаёт из рода в род» (παραδίδωμι — «передавать»). Синодальный иной («богатство не навек», по масоретскому тексту)."
  25: "ἐπιμελοῦ τῶν ἐν τῷ πεδίῳ χλωρῶν — «заботься о зелёном (травах) на поле» (χλωρός — «зелёный, свежий»); κερεῖς πόαν — «срежешь (скосишь) траву» (κείρω — «стричь, срезать»; πόα — «трава»); σύναγε χόρτον ὀρεινόν — «собирай сено горное»."
  26: "ἵνα ἔχῃς πρόβατα εἰς ἱματισμόν — «чтобы имел овец на одеяние»; τίμα πεδίον, ἵνα ὦσίν σοι ἄρνες — «чти (возделывай) поле, чтобы были тебе агнцы» (ἀρήν — «агнец»). Синодальный иной (по масоретскому тексту)."
  27: "υἱέ, παρ᾽ ἐμοῦ ἔχεις ῥήσεις ἰσχυράς — «сын, от меня имеешь изречения крепкие» (ῥῆσις — «изречение»; ἰσχυρός — «сильный»); εἰς τὴν ζωήν σου καὶ εἰς τὴν ζωὴν σῶν θεραπόντων — «в жизнь твою и в жизнь слуг твоих» (θεράπων — «слуга»). Синодальный иной (по масоретскому тексту: козье молоко)."
