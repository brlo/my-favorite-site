verses:
  0: "合唱[がっしょう]の長[ちょう]に歌[うた]わせる。ダビデの詩[うた]。"
  1: "貧[まず]しい者[もの]と乏[とぼ]しい者[もの]に心[こころ]を配[くば]る人[ひと]は幸[さいわ]いである。災[わざわ]いの日[ひ]に、主[しゅ]はその人[ひと]を救[すく]い出[だ]される。"
  2: "主[しゅ]がその人[ひと]を守[まも]り、生[い]かし、この地[ち]で幸[さいわ]いな者[もの]とされるように。その人[ひと]を敵[てき]の手[て]に渡[わた]されないように。"
  3: "主[しゅ]がその人[ひと]を、病[やまい]の床[とこ]で助[たす]けてくださるように。あなたはその人[ひと]の病[やまい]のとき、その床[とこ]を全[まった]く変[か]えられた。"
  4: "わたしは言[い]った。「主[しゅ]よ、わたしをあわれんでください。わたしの魂[たましい]を癒[いや]してください。わたしはあなたに罪[つみ]を犯[おか]したからである」と。"
  5: "わたしの敵[てき]はわたしについて悪[わる]いことを言[い]う。「いつ、あの男[おとこ]は死[し]んで、その名[な]が消[き]えるのか」と。"
  6: "その者[もの]がわたしを見[み]ようと入[はい]って来[き]ても、むなしいことを語[かた]るだけである。その心[こころ]は不[ふ]法[ほう]を蓄[たくわ]え、外[そと]に出[で]てはそれを話[はな]す。"
  7: "わたしの敵[てき]はみな、そろってわたしにささやき、わたしを害[がい]そうと企[くわだ]てる。"
  8: "彼[かれ]らはわたしに対して不[ふ]法[ほう]な言葉[ことば]を投[な]げかけ、「もう寝[ね]た者[もの]は、二度[にど]と起[お]き上[あ]がらないではないか」と言[い]う。"
  9: "わたしと親[した]しく、わたしが頼[たよ]りとしていた者[もの]、わたしのパンを食[た]べた者[もの]までも、わたしに向[む]かってかかとを上[あ]げた。"
  10: "しかし、主[しゅ]よ、わたしをあわれみ、わたしを起[お]こし、わたしが彼[かれ]らに報[むく]い返[かえ]すことができるようにしてください。"
  11: "わたしはこれによって、あなたがわたしを喜[よろこ]んでおられることを知[し]った。わたしの敵[てき]がわたしの上[うえ]に喜[よろこ]びを上[あ]げないからである。"
  12: "あなたはわたしの無[む]垢[く]のゆえに、わたしを支[ささ]え、あなたの前[まえ]に、いつまでも立[た]たせてくださる。"
  13: "イスラエルの神[かみ]であられる主[しゅ]は、ほめたたえられる。永遠[えいえん]から永遠[えいえん]まで。アーメン、アーメン。"

notes:
  0: "Εἰς τὸ τέλος· ψαλμὸς τῷ Δαυιδ — 合唱の長に歌わせる、ダビデの詩. Надписание — стих 0, скобками не маркируется."
  1: "Μακάριος ὁ συνίων ἐπὶ πτωχὸν καὶ πένητα — блажен разумеваяй на нища и убога (συνίω «понимать, вникать»; ἐπί «по отношению к»); 心を配る. ἐν ἡμέρᾳ πονηρᾷ ῥύσεται αὐτὸν ὁ κύριος — в день лют избавит его Господь."
  2: "διαφυλάξαι αὐτὸν καὶ ζήσαι αὐτὸν — да сохранит его и живит его (оптативы). μακαρίσαι αὐτὸν ἐν τῇ γῇ — да ублажит его на земли. μὴ παραδῴη αὐτὸν εἰς χεῖρας ἐχθροῦ αὐτοῦ — да не предаст его в руки врагов его."
  3: "βοηθήσαι αὐτῷ ἐπὶ κλίνης ὀδύνης αὐτοῦ — да поможет ему на одре болезни его (κλίνη «ложе»; ὀδύνη «боль»). ὅλην τὴν κοίτην αὐτοῦ ἔστρεψας ἐν τῇ ἀρρωστίᾳ αὐτοῦ — всю постель его обратил еси в болезни его (στρέφω «поворачивать, менять»); 全く変えられた — буквально, не «постелил»."
  4: "ἐγὼ εἶπα Κύριε, ἐλέησόν με — аз рех: Господи, помилуй мя. ἴασαι τὴν ψυχήν μου — исцели душу мою. ὅτι ἥμαρτόν σοι — яко согреших Ти. Прямая речь — 「」."
  5: "οἱ ἐχθροί μου εἶπαν κακὰ μοι — врази мои реша злая мне. Πότε ἀποθανεῖται, καὶ ἀπολεῖται τὸ ὄνομα αὐτοῦ; — когда умрет, и погибнет имя его? Слова врагов — 「」."
  6: "καὶ εἰ εἰσεπορεύετο τοῦ ἰδεῖν — и вхождаше видети (εἰ с индикативом — условно-итеративное). μάτην ἐλάλει — всуе глаголаше. ἡ καρδία αὐτοῦ συνήγαγεν ἀνομίαν ἑαυτῷ — сердце его собра беззаконие себе. ἐξεπορεύετο ἔξω καὶ ἐλάλει — исхождаше вон и глаголаше."
  7: "ἐπὶ τὸ αὐτὸ κατ᾽ ἐμοῦ ἐψιθύριζον — на мя вкупе шептаху (ψιθυρίζω «шептать»). κατ᾽ ἐμοῦ ἐλογίζοντο κακά μοι — на мя помышляху злая мне."
  8: "λόγον παράνομον κατέθεντο κατ᾽ ἐμοῦ — слово законопреступное возложиша на мя (κατατίθημι «класть, слагать»; 投げかける — по-японски естественнее). Μὴ ὁ κοιμώμενος οὐχὶ προσθήσει τοῦ ἀναστῆναι; — еда спяй не приложит востати? Риторический вопрос-издёвка: «разве спящий встанет?»; 二度と起き上がらないではないか передаёт издёвку."
  9: "ὁ ἄνθρωπος τῆς εἰρήνης μου — человек мира моего, т. е. близкий друг. ἐφ᾽ ὃν ἤλπισα — на негоже уповах. ὁ ἐσθίων ἄρτους μου — ядый хлебы моя (мн. ч.). ἐμεγάλυνεν ἐπ᾽ ἐμὲ πτερνισμόν — возвеличи на мя запинание, т. е. поднял на меня пяту (πτερνισμός «пятка, подножка»); ср. Ин 13:18."
  10: "σὺ δέ, κύριε, ἐλέησόν με — Ты же, Господи, помилуй мя. ἀνάστησόν με — возстави мя. καὶ ἀνταποδώσω αὐτοῖς — и воздам им; в гр. простое будущее, по-японски — просьба о возможности воздать, смысл не изменён."
  11: "ἐν τούτῳ ἔγνων ὅτι τεθέληκάς με — о сем познах, яко восхотел мя еси (θέλω «хотеть, благоволить»). οὐ μὴ ἐπιχαρῇ ὁ ἐχθρός μου ἐπ᾽ ἐμέ — не возрадуется враг мой о мне."
  12: "ἐμοῦ δὲ διὰ τὴν ἀκακίαν ἀντελάβου — мене же за незлобие приял еси (ἀκακία «незлобие»); 無垢. ἐβεβαίωσάς με ἐνώπιόν σου εἰς τὸν αἰῶνα — утвердил мя еси пред Тобою в век (βεβαιόω «утверждать»)."
  13: "Εὐλογητὸς κύριος ὁ θεὸς Ισραηλ — благословен Господь Бог Израилев. ἀπὸ τοῦ αἰῶνος καὶ εἰς τὸν αἰῶνα — от века и до века. γένοιτο γένοιτο — буди, буди; по-японски церковное アーメン、アーメン (ср. jp-joc 「アミン」「アミン」)."
