# jp-box, Послание к Римлянам, глава 8. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 8: жизнь в Духе (1–17), ожидание творения и надежда (18–25),
# ходатайство Духа (26–27), предвечный замысел (28–30), любовь Божия (31–39).
# Красного (<j>) и синего (<mo>) нет: прямой речи Христа и Богородицы в главе нет.
# 〔…〕: 8:1 — «μὴ κατὰ σάρκα περιπατοῦσιν ἀλλὰ κατὰ πνεῦμα» в базе gr-lxx-byz нет
# (стих кончается на Ἰησοῦ), а в церковном тексте и у jp-joc есть; обёрнуто.
# Сноска ⟨…⟩ одна — 8:15 子としての身分 (первое место в корпусе).
# Период 8:18–39 не дробится: 8:38 обрывается на перечислении, 8:39 его заключает.
# jp-ni не использовался.

tr_code: jp-box
book: rim
chapter: 8
draft: true

verses:
  1: "それゆえ、今[いま]、キリスト・イエスにある者[もの]たち、〔肉[にく]に従[したが]って歩[あゆ]まず、霊[れい]に従[したが]って歩[あゆ]む者[もの]たち〕には、もはや何[なん]の断罪[だんざい]もない。"
  2: "というのは、命[いのち]の霊[れい]の律法[りっぽう]が、キリスト・イエスにあって、わたしを罪[つみ]と死[し]の律法[りっぽう]から解放[かいほう]したからである。"
  3: "というのは、律法[りっぽう]が肉[にく]によって弱[よわ]められていた、その無[む]力[りょく]については——神[かみ]はご自身[じしん]の子[こ]を、罪[つみ]の肉[にく]の形[かたち]において、罪[つみ]のために遣[つか]わし、肉[にく]のうちで罪[つみ]を断罪[だんざい]されたのである。"
  4: "それは、律法[りっぽう]の義[ぎ]の要[よう]求[きゅう]が、肉[にく]に従[したが]わず、霊[れい]に従[したが]って歩[あゆ]むわたしたちのうちに満[み]たされるためである。"
  5: "肉[にく]に従[したが]う者[もの]たちは肉[にく]のことを思[おも]い、霊[れい]に従[したが]う者[もの]たちは霊[れい]のことを思[おも]う。"
  6: "肉[にく]の思[おも]いは死[し]であり、霊[れい]の思[おも]いは命[いのち]と平和[へいわ]である。"
  7: "なぜなら、肉[にく]の思[おも]いは神[かみ]に対して敵[てき]意[い]であり、神[かみ]の律法[りっぽう]に従[したが]わないからである。実際[じっさい]、従[したが]うことはできないのである。"
  8: "肉[にく]にある者[もの]たちは、神[かみ]に喜[よろこ]ばれることができない。"
  9: "しかし、もし神[かみ]の霊[れい]があなたがたのうちに住[す]んでいるのなら、あなたがたは肉[にく]にあるのではなく、霊[れい]にある者[もの]である。キリストの霊[れい]を持[も]たない者[もの]は、キリストのものではない。"
  10: "もしキリストがあなたがたのうちにいるのなら、体[からだ]は罪[つみ]のために死[し]んでいるが、霊[れい]は義[ぎ]のために命[いのち]である。"
  11: "もし、イエスを死者[ししゃ]の中[なか]から復活[ふっかつ]させた方[かた]の霊[れい]があなたがたのうちに住[す]んでいるのなら、キリストを死者[ししゃ]の中[なか]から復活[ふっかつ]させた方[かた]は、あなたがたのうちに住[す]むご自身[じしん]の霊[れい]によって、あなたがたの死[し]すべき体[からだ]をも生[い]かしてくださるであろう。"
  12: "それゆえ、兄弟[きょうだい]たちよ、わたしたちは肉[にく]に対して負[お]い目[め]がある者[もの]ではない。肉[にく]に従[したが]って生[い]きるためではないのである。"
  13: "もし肉[にく]に従[したが]って生[い]きるなら、あなたがたは死[し]ぬであろう。しかし、もし霊[れい]によって体[からだ]の行[おこな]いを殺[ころ]すなら、あなたがたは生[い]きるであろう。"
  14: "神[かみ]の霊[れい]に導[みちび]かれる者[もの]は、みな神[かみ]の子[こ]である。"
  15: "あなたがたは、再[ふたた]び恐[おそ]れに陥[おちい]る奴隷[どれい]の霊[れい]を受[う]けたのではない。子[こ]としての身分[みぶん]⟨神[かみ]の子[こ]とされる身分[みぶん]。養子[ようし]として神[かみ]の子[こ]に迎[むか]え入[い]れられることをいう。⟩の霊[れい]を受[う]けたのである。その霊[れい]によって、わたしたちは「アバ、父[ちち]よ」と叫[さけ]ぶのである。"
  16: "霊[れい]ご自身[じしん]が、わたしたちの霊[れい]とともに、わたしたちが神[かみ]の子[こ]であることを証[あかし]してくださる。"
  17: "もし子[こ]であるなら、相続[そうぞく]人[にん]でもある。すなわち、神[かみ]の相続[そうぞく]人[にん]であり、キリストとともに相続[そうぞく]する者[もの]である。キリストとともに苦[くる]しみを受[う]けるなら、ともに栄化[えいか]されるためである。"
  18: "わたしは思[おも]う。今[いま]の時[とき]の苦[くる]しみは、わたしたちに現[あらわ]されるべき栄光[えいこう]に比[くら]べるに足[た]りない。"
  19: "被造物[ひぞうぶつ]は、神[かみ]の子[こ]たちが現[あらわ]されるのを、切[せつ]に待[ま]ち望[のぞ]んでいる。"
  20: "被造物[ひぞうぶつ]は空[むな]しいものに服[ふく]させられた。自[みずか]ら望[のぞ]んだのではなく、服[ふく]させた方[かた]によるのであり、そこには希望[きぼう]が残[のこ]されている。"
  21: "すなわち、被造物[ひぞうぶつ]自身[じしん]もまた、滅[ほろ]びの奴隷[どれい]から解放[かいほう]されて、神[かみ]の子[こ]たちの栄光[えいこう]の自[じ]由[ゆう]に入[はい]るのである。"
  22: "わたしたちは知[し]っている。被造物[ひぞうぶつ]はすべて、今[いま]に至[いた]るまで、ともに呻[うめ]き、ともに産[さん]みの苦[くる]しみを続[つづ]けている。"
  23: "それだけではない。霊[れい]の初[はつ]穂[ほ]を持[も]つわたしたち自身[じしん]も、子[こ]としての身分[みぶん]を、すなわち体[からだ]の贖[あがな]いを待[ま]ち望[のぞ]みながら、心[こころ]の内[うち]で呻[うめ]いているのである。"
  24: "わたしたちは希望[きぼう]によって救[すく]われたのである。しかし、見[み]える希望[きぼう]は希望[きぼう]ではない。見[み]ているものを、だれがなお望[のぞ]もうか。"
  25: "もし、見[み]えないものを望[のぞ]んでいるのなら、わたしたちは耐[た]え忍[しの]んで待[ま]ち望[のぞ]むのである。"
  26: "同[おな]じように、霊[れい]もまた、わたしたちの弱[よわ]さを助[たす]けてくださる。わたしたちは、何[なに]を祈[いの]るべきかを知[し]らない。しかし、霊[れい]ご自身[じしん]が、言[い]い表[あらわ]せない呻[うめ]きをもって、とりなしてくださるのである。"
  27: "心[こころ]を探[さぐ]る方[かた]は、霊[れい]の思[おも]いを知[し]っておられる。霊[れい]が神[かみ]に従[したが]って、聖[せい]なる者[もの]たちのためにとりなしているからである。"
  28: "わたしたちは知[し]っている。神[かみ]を愛[あい]する者[もの]たち、すなわち、ご計画[けいかく]によって召[め]された者[もの]たちには、すべてのことがともに働[はたら]いて善[ぜん]に至[いた]る、ということを。"
  29: "というのは、神[かみ]は、あらかじめ知[し]っておられた者[もの]たちを、ご自身[じしん]の子[こ]の姿[すがた]に似[に]た者[もの]となるように、あらかじめ予定[よてい]されたからである。それは、子[こ]が多[おお]くの兄弟[きょうだい]のうちの長子[ちょうし]となるためである。"
  30: "そして、予定[よてい]した者[もの]たちを召[め]し、召[め]した者[もの]たちを義[ぎ]とし、義[ぎ]とした者[もの]たちを栄化[えいか]されたのである。"
  31: "それでは、これらのことに対して、何と言[い]おうか。神[かみ]がわたしたちの味方[みかた]であるなら、だれがわたしたちに敵[てき]しうるだろうか。"
  32: "ご自身[じしん]の子[こ]さえ惜[お]しむことなく、わたしたちすべてのために渡[わた]された方[かた]が、どうして、その子[こ]とともにすべてのものをわたしたちに与[あた]えてくださらないことがあろうか。"
  33: "だれが、神[かみ]の選[えら]ばれた者[もの]たちを訴[うった]えるのか。義[ぎ]とするのは神[かみ]である。"
  34: "だれが、断罪[だんざい]するのか。死[し]なれた方[かた]、いや、むしろ復活[ふっかつ]された方[かた]、神[かみ]の右[みぎ]に着[つ]いておられる方[かた]、わたしたちのためにとりなしておられる方[かた]、キリスト・イエスである。"
  35: "だれが、わたしたちをキリストの愛[あい]から引[ひ]き離[はな]すだろうか。苦難[くなん]か、行[い]き詰[づ]まりか、迫害[はくがい]か、飢[う]えか、裸[はだか]か、危険[きけん]か、剣[つるぎ]か。"
  36: "「あなたのために、わたしたちは一日中[いちにちじゅう]殺[ころ]され、屠[ほふ]られる羊[ひつじ]のように見[み]なされた」と書[か]いてあるとおりである。"
  37: "しかし、わたしたちを愛[あい]してくださった方[かた]によって、わたしたちはこれらすべてのことに勝[か]って余[あま]りある者[もの]である。"
  38: "わたしは確[かく]信[しん]している。死[し]も、命[いのち]も、天[てん]使[し]も、支[し]配[はい]の力[ちから]も、今[いま]あるものも、来[きた]るべきものも、力[ちから]あるものも、"
  39: "高[たか]さも、深[ふか]さも、そのほかのどんな被造物[ひぞうぶつ]も、わたしたちの主[しゅ]イエス・キリストにある神[かみ]の愛[あい]から、わたしたちを引[ひ]き離[はな]すことはできないのである。"

notes:
  1: "Ключевое место по скобкам. В gr-lxx-byz: Οὐδὲν ἄρα νῦν κατάκριμα τοῖς ἐν Χριστῷ Ἰησοῦ — и всё. Слова μὴ κατὰ σάρκα περιπατοῦσιν ἀλλὰ κατὰ πνεῦμα читает византийский текст (и Елизаветинская, и jp-joc 「肉に從はず、乃ち神に從ひて行ふ者には」) — они в 〔…〕. Соседний 8:4 с теми же словами в базе есть, там скобок нет. κατάκριμα — 断罪 («осуждение»), ср. 8:34 κατακρίνω."
  2: "ἠλευθέρωσέν με — «меня» (не «нас»), как в базе и у jp-joc: わたしを."
  3: "Анаколуф подлинника сохранён: τὸ ἀδύνατον τοῦ νόμου… висит без сказуемого, ответ начинается с ὁ θεός — その無力については——神は…; выравнивать в «закон был бессилен, поэтому Бог» нельзя. ἐν ὁμοιώματι σαρκὸς ἁμαρτίας — 罪の肉の形において; περὶ ἁμαρτίας — 罪のために."
  4: "τὸ δικαίωμα τοῦ νόμου — 律法の義の要求. Слова μὴ κατὰ σάρκα περιπατοῦσιν здесь в базе есть — не обёрнуты."
  5: "φρονοῦσιν — 思う (не «помышлять» книжно)."
  6: "φρόνημα — 思い; в 8:6–7 одно и то же слово, как в греческом."
  7: "ἔχθρα εἰς θεόν — 神に対して敵意. οὐδὲ γὰρ δύναται — 実際、従うことはできない."
  8: "ἀρέσαι — 喜ばれる."
  9: "εἴπερ — «если действительно»; условие сохранено и стоит перед главной частью, чтобы не превращать его в утверждение (からである). πνεῦμα θεοῦ / πνεῦμα Χριστοῦ — 神の霊 / キリストの霊 (не «Святой Дух»: в тексте нет ἅγιον)."
  10: "τὸ μὲν σῶμα νεκρόν… τὸ δὲ πνεῦμα ζωή — 体は…死んでいるが、霊は…命; единственное число сохранено."
  11: "В базе [τὸν] Χριστόν — есть, не обёрнуто. ἐνοικοῦντος αὐτοῦ πνεύματος — ご自身の霊."
  12: "ὀφειλέται — 負い目がある者. οὐ τῇ σαρκὶ τοῦ κατὰ σάρκα ζῆν — 肉に従って生きるためではない."
  13: "θανατοῦτε — 殺す; ζήσεσθε — 生きる."
  14: "ἄγονται — 導かれる; υἱοὶ θεοῦ — 神の子."
  15: "υἱοθεσία — 子としての身分 (единственный случай сноски в главе; первое место в корпусе). πνεῦμα δουλείας πάλιν εἰς φόβον — 再び恐れに陥る奴隷の霊. Αββα ὁ πατήρ — 「アバ、父よ」, арамейское обращение оставлено как в тексте."
  16: "συμμαρτυρεῖ — 証ししてくださる; τέκνα θεοῦ — 神の子."
  17: "κληρονόμοι… συγκληρονόμοι — 相続人…ともに相続する者. συνδοξασθῶμεν — ともに栄化される (δοξάζω — 栄化, как в 8:30)."
  18: "Λογίζομαι — わたしは思う; ἄξια — 比べるに足りない."
  19: "ἀποκαραδοκία — «напряжённое ожидание»; 切に待ち望んでいる. κτίσις — 被造物."
  20: "ματαιότης — 空しいもの; ὑπετάγη — 服させられた; ἐφ' ἑλπίδι — 希望が残されている (оборот подхватывается в 8:21 через ὅτι)."
  21: "φθορά — 滅び; ἐλευθερία τῆς δόξης — 栄光の自由."
  22: "συστενάζει καὶ συνωδίνει — ともに呻き、ともに産みの苦しみを続けている."
  23: "ἀπαρχή — 初穂 (持つ, без добавления «дар»); ἀπολύτρωσις τοῦ σώματος — 体の贖い; υἱοθεσία — 子としての身分 (повтор без сноски)."
  24: "τῇ γὰρ ἐλπίδι ἐσώθημεν — 希望によって救われた. βλεπομένη — 見える."
  25: "δι' ὑπομονῆς ἀπεκδεχόμεθα — 耐え忍んで待ち望む."
  26: "συναντιλαμβάνεται — 助けてくださる; καθὸ δεῖ — 祈るべきか; ὑπερεντυγχάνει στεναγμοῖς ἀλαλήτοις — 言い表せない呻きをもってとりなす. «Не знаем, о чём молиться» оставлено от первого лица мн. ч."
  27: "ἐραυνῶν τὰς καρδίας — 心を探る方; κατὰ θεόν — 神に従って; ἐντυγχάνει — とりなす."
  28: "πάντα συνεργεῖ εἰς ἀγαθόν — в базе подлежащее πάντα, не ὁ θεός: すべてのことがともに働いて善に至る. κατὰ πρόθεσιν — ご計画によって."
  29: "προέγνω — あらかじめ知っておられた; προώρισεν — あらかじめ予定された. συμμόρφους τῆς εἰκόνος τοῦ υἱοῦ — 子の姿に似た者 (εἰκών — образ; «似た者» держит образ, не растворяя его в «сынами»). πρωτότοκος — 長子."
  30: "Цепь аористов: 予定した—召し—義とし—栄化された; последний глагол тоже в прошедшем, как в греческом."
  31: "εἰ ὁ θεὸς ὑπὲρ ἡμῶν — 神がわたしたちの味方であるなら; τίς καθ' ἡμῶν — だれが…敵しうるだろうか."
  32: "οὐκ ἐφείσατο — 惜しむことなく; παρέδωκεν — 渡された; χαρήσεται — 与えてくださらないことがあろうか."
  33: "ἐγκαλέσει — 訴える; ἐκλεκτῶν — 選ばれた者たち; θεὸς ὁ δικαιῶν — 義とするのは神である."
  34: "Анаколуф ответа сохранён: придаточные-приложения идут без сказуемого, в конце キリスト・イエスである (так же у jp-joc). В базе [Ἰησοῦς] — есть, не обёрнуто. ἐντυγχάνει ὑπὲρ ἡμῶν — わたしたちのためにとりなしておられる."
  35: "ἀγάπη τοῦ Χριστοῦ — キリストの愛 (у jp-joc 神の愛, но в базе τοῦ Χριστοῦ). Семь членов перечисления сохранены, без смягчения."
  36: "Цитата Пс 43:23 (LXX). ὅλην τὴν ἡμέραν — 一日中. ἐλογίσθημεν ὡς πρόβατα σφαγῆς — 屠られる羊のように見なされた."
  37: "ὑπερνικῶμεν — 勝って余りある者 (у jp-joc 勝ちて餘あり); не сглажено в «побеждаем»."
  38: "Перечисление оборвано на союзе, как в греческом (стих кончается без сказуемого) — отсюда 、 в конце; сказуемое в 8:39. ἀρχαί — 支配の力 (не «начальства» буквально)."
  39: "ὕψωμα… βάθος — 高さ…深さ; κτίσις ἑτέρα — そのほかのどんな被造物; χωρίσαι — 引き離す. Замыкает период 8:18–39."
