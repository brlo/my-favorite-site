verses:
  1: "また、わたしは、天[てん]から降[くだ]って来[く]る天使[てんし]を見[み]た。彼[かれ]は、底知[そこし]れぬ穴[あな]の鍵[かぎ]と大[おお]きな鎖[くさり]を、手[て]に持[も]っていた。"
  2: "彼[かれ]は、竜[りゅう]、すなわち昔[むかし]の蛇[へび]、悪魔[あくま]でありサタンである者[もの]を捕[つか]まえ、これを千年[せんねん]の間[あいだ]縛[しば]った。"
  3: "そして、彼[かれ]を底知[そこし]れぬ穴[あな]に投[な]げ込[こ]み、これを閉[と]じ、その上[うえ]に封印[ふういん]して、千年[せんねん]が終[お]わるまで、もはや諸国[しょこく]を惑[まど]わさないようにした。その後[そののち]、彼[かれ]はしばらくの間[あいだ]、解[と]き放[はな]たれなければならない。"
  4: "また、わたしはいくつもの御座[みくら]を見[み]た。それらに座[すわ]った者[もの]たちには、裁[さば]きの権[けん]が与[あた]えられた。また、わたしは、イエスの証[あかし]と神[かみ]の言葉[ことば]のゆえに首[くび]を切[き]られた者[もの]たち、および、獣[けもの]もその像[ぞう]も礼拝[れいはい]せず、額[ひたい]にも手[て]にも刻印[こくいん]を受[う]けなかった者[もの]たちの魂[たましい]を見[み]た。彼[かれ]らは生[い]き返[かえ]り、キリストとともに千年[せんねん]の間[あいだ]王[おう]として治[し]める。"
  5: "残[のこ]りの死者[ししゃ]たちは、千年[せんねん]が終[お]わるまで生[い]き返[かえ]らなかった。これが第一[だいいち]の復活[ふっかつ]である。"
  6: "第一[だいいち]の復活[ふっかつ]にあずかる者[もの]は幸[さいわ]いであり、聖[せい]である。この者[もの]たちの上[うえ]に、第二[だいに]の死[し]は何[なん]の権[けん]も持[も]たない。彼[かれ]らは神[かみ]とキリストの祭司[さいし]となり、キリストとともに千年[せんねん]の間[あいだ]王[おう]として治[し]めるのである。"
  7: "千年[せんねん]が終[お]わると、サタンはその監獄[かんごく]から解[と]き放[はな]たれる。"
  8: "そして、地[ち]の四[よ]つの隅[すみ]にある諸国[しょこく]、すなわちゴグとマゴグを惑[まど]わして、彼[かれ]らを戦[たたか]いに集[あつ]めに出[で]て行[い]く。その数[かず]は海[うみ]の砂[すな]のようである。"
  9: "彼[かれ]らは地[ち]の広[ひろ]い所[ところ]に上[のぼ]って来[き]て、聖徒[せいと]たちの陣営[じんえい]と愛[あい]された都[みやこ]を取[と]り囲[かこ]んだ。すると、〔神[かみ]から〕天[てん]から火[ひ]が降[ふ]りて、彼[かれ]らを焼[や]き尽[つ]くした。"
  10: "彼[かれ]らを惑[まど]わした悪魔[あくま]は、獣[けもの]と偽[いつわ]りの預言者[よげんしゃ]のいる、火[ひ]と硫黄[いおう]の池[いけ]に投[な]げ込[こ]まれた。彼[かれ]らは昼[ひる]も夜[よる]も、世々[よよ]限[かぎ]りなく苦[くる]しみ続[つづ]けるのである。"
  11: "また、わたしは大[おお]きな白[しろ]い御座[みくら]と、それに着[つ]いておられる方[かた]を見[み]た。この方[かた]の御顔[みかお]から、地[ち]も天[てん]も逃[に]げ去[さ]り、その跡[あと]さえ見[み]つからなくなった。"
  12: "また、わたしは死者[ししゃ]たちが、大[おお]きな者[もの]も小[ちい]さな者[もの]も、御座[みくら]の前[まえ]に立[た]っているのを見[み]た。そして、いくつもの書[しょ]が開[ひら]かれた。また、別[べつ]の書[しょ]、すなわち命[いのち]の書[しょ]が開[ひら]かれた。死者[ししゃ]たちは、これらの書[しょ]に書[か]かれていることに基[もと]づいて、それぞれの行[おこな]いに従[したが]って裁[さば]かれた。"
  13: "海[うみ]はその中[なか]の死者[ししゃ]たちを返[かえ]し、死[し]も陰府[よみ]もその中[なか]の死者[ししゃ]たちを返[かえ]した。そして、彼[かれ]らは一人[ひとり]ひとり、それぞれの行[おこな]いに従[したが]って裁[さば]かれた。"
  14: "また、死[し]も陰府[よみ]も火[ひ]の池[いけ]に投[な]げ込[こ]まれた。この火[ひ]の池[いけ]こそ、第二[だいに]の死[し]である。"
  15: "命[いのち]の書[しょ]に記[しる]されているのが見[み]つからなかった者[もの]は、だれでも火[ひ]の池[いけ]に投[な]げ込[こ]まれた。"

notes:
  1: "κλεῖν τῆς ἀβύσσου — 底知れぬ穴の鍵 (ἄβυσσος; 淵 — не 常用漢字, поэтому 穴). ἅλυσιν μεγάλην — 大きな鎖. ἐπὶ τὴν χεῖρα αὐτοῦ — 手に (ἐπί + acc.; передано 手に持っていた)."
  2: "ὁ δράκων, ὁ ὄφις ὁ ἀρχαῖος — 竜、すなわち昔の蛇 (ἀρχαῖος — «древний»). ὅς ἐστιν Διάβολος καὶ ὁ Σατανᾶς — 悪魔またサタンと呼ばれる者. ἔδησεν αὐτὸν χίλια ἔτη — 千年の間縛った."
  3: "ἔβαλεν εἰς τὴν ἄβυσσον — 底知れぬ穴に投げ込み. ἐσφράγισεν ἐπάνω αὐτοῦ — その上に封印して. ἄχρι τελεσθῇ τὰ χίλια ἔτη — 千年が終わるまで. δεῖ λυθῆναι αὐτὸν μικρὸν χρόνον — しばらくの間、解き放たれなければならない (δεῖ — «должно»)."
  4: "θρόνους, καὶ ἐκάθισαν ἐπ' αὐτούς — いくつもの御座…それらに座った者たち (мн. ч. сохранено). κρῖμα ἐδόθη αὐτοῖς — 裁きの権が与えられた. τὰς ψυχὰς τῶν πεπελεκισμένων — 首を切られた者たちの魂 (πελεκίζω — «обезглавливать»). διὰ τὴν μαρτυρίαν Ἰησοῦ καὶ διὰ τὸν λόγον τοῦ θεοῦ — イエスの証と神の言葉のゆえに. τὸ χάραγμα ἐπὶ τὸ μέτωπον καὶ ἐπὶ τὴν χεῖρα — 額にも手にも刻印. ἔζησαν καὶ ἐβασίλευσαν μετὰ τοῦ Χριστοῦ χίλια ἔτη — 生き返り、キリストとともに千年の間王として治める (βασιλεύω — 王として治める, ср. 2 Тим 2:12). Учение о тысячелетнем царстве (千年王国) пояснено здесь, отдельной сноски нет."
  5: "οἱ λοιποὶ τῶν νεκρῶν οὐκ ἔζησαν ἄχρι τελεσθῇ τὰ χίλια ἔτη — 残りの死者たちは…生き返らなかった. Стих целиком есть в gr-lxx-byz (в критических изданиях первая половина спорна) — проверено, 〔…〕 не ставятся. αὕτη ἡ ἀνάστασις ἡ πρώτη — これが第一の復活."
  6: "μακάριος καὶ ἅγιος ὁ ἔχων μέρος ἐν τῇ ἀναστάσει τῇ πρώτῃ — 第一の復活にあずかる者は幸いであり、聖である. ὁ δεύτερος θάνατος οὐκ ἔχει ἐξουσίαν — 第二の死は何の権も持たない. ἱερεῖς τοῦ θεοῦ καὶ τοῦ Χριστοῦ — 神とキリストの祭司. βασιλεύσουσιν μετ' αὐτοῦ [τὰ] χίλια ἔτη — キリストとともに千年の間王として治める; [τὰ] в базе есть, без 〔〕."
  7: "ὅταν τελεσθῇ τὰ χίλια ἔτη — 千年が終わると. λυθήσεται ὁ Σατανᾶς ἐκ τῆς φυλακῆς αὐτοῦ — サタンはその監獄から解き放たれる (φυλακή — 監獄)."
  8: "τὰ ἔθνη τὰ ἐν ταῖς τέσσαρσιν γωνίαις τῆς γῆς — 地の四つの隅にある諸国. τὸν Γὼγ καὶ Μαγώγ — ゴグとマゴグ (сноски нет: имена названы прямо). συναγαγεῖν αὐτοὺς εἰς τὸν πόλεμον — 戦いに集める. ὡς ἡ ἄμμος τῆς θαλάσσης — 海の砂のよう."
  9: "ἐπὶ τὸ πλάτος τῆς γῆς — 地の広い所に. παρεμβολὴν τῶν ἁγίων — 聖徒たちの陣営. τὴν πόλιν τὴν ἠγαπημένην — 愛された都. В базе κατέβη πῦρ ἐκ τοῦ οὐρανοῦ, без ἀπὸ τοῦ θεοῦ (проверено: НЕТ); церковный текст (Елизаветинская «с небесе от Бога», jp-joc 神より天より) прибавляет — 〔神から〕."
  10: "ὁ διάβολος ὁ πλανῶν αὐτούς — 彼らを惑わした悪魔. λίμνη τοῦ πυρὸς καὶ θείου — 火と硫黄の池. ὅπου καὶ τὸ θηρίον καὶ ὁ ψευδοπροφήτης — 獣と偽りの預言者のいる. βασανισθήσονται ἡμέρας καὶ νυκτός — 昼も夜も苦しみ続ける. εἰς τοὺς αἰῶνας τῶν αἰώνων — 世々限りなく."
  11: "θρόνον μέγαν λευκόν — 大きな白い御座 (白い御座 — образ последнего суда; пояснение здесь, сноски нет). οὗ ἀπὸ τοῦ προσώπου ἔφυγεν ἡ γῆ καὶ ὁ οὐρανός — この方の御顔から地も天も逃げ去り. τόπος οὐχ εὑρέθη αὐτοῖς — その跡さえ見つからなかった."
  12: "τοὺς νεκρούς, τοὺς μεγάλους καὶ τοὺς μικρούς — 死者たち、大きな者も小さな者も. βιβλία ἠνοίχθησαν — いくつもの書が開かれた. ἄλλο βιβλίον…ὅ ἐστιν τῆς ζωῆς — 別の書、すなわち命の書. ἐκ τῶν γεγραμμένων ἐν τοῖς βιβλίοις κατὰ τὰ ἔργα αὐτῶν — 書に書かれていることに基づいて、それぞれの行いに従って."
  13: "ἡ θάλασσα…ὁ θάνατος καὶ ὁ ᾅδης ἔδωκαν τοὺς νεκρούς — 海…死も陰府も死者を返した. ᾅδης — 陰府[よみ], как везде в корпусе (地獄 оставлено за γέεννα). ἕκαστος κατὰ τὰ ἔργα αὐτῶν — 一人ひとり、それぞれの行いに従って."
  14: "ὁ θάνατος καὶ ὁ ᾅδης ἐβλήθησαν εἰς τὴν λίμνην τοῦ πυρός — 死も陰府も火の池に投げ込まれた. οὗτος ὁ θάνατος ὁ δεύτερός ἐστιν, ἡ λίμνη τοῦ πυρός — この火の池こそ、第二の死である (вторая половина в базе есть, у jp-joc опущена — не опускаю)."
  15: "εἴ τις οὐχ εὑρέθη ἐν τῇ βίβλῳ τῆς ζωῆς γεγραμμένος — 命の書に記されているのが見つからなかった者. ἐβλήθη εἰς τὴν λίμνην τοῦ πυρός — 火の池に投げ込まれた."
