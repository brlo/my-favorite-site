# jp-box, Откровение, глава 20. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 20: тысячелетнее царство (1–6), освобождение сатаны и последняя битва (7–10),
# суд у белого престола (11–15).
# Красного <j> нет: прямой речи Христа в главе нет; 20:1–15 — видение. <mo> нет.
# 〔…〕: 20:9 — церковное ἀπὸ τοῦ θεοῦ («от Бога», jp-joc 神より): проверено, в базе НЕТ.
# 20:5 в gr-lxx-byz стоит целиком (в критических изданиях первая половина спорна) —
# скобок нет. [τὰ] в 20:6 в базе есть. Прочее — без скобок.
# Сносок ⟨…⟩ нет: 千年王国 и 白い御座 пояснены в notes, 命の書 уже в корпусе (Флп 4:3).

