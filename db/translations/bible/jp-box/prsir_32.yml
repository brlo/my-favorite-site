verses:
  1: "人[ひと]から司会[しかい]に据[す]えられたのなら、高[たか]ぶってはならない。彼らの間[あいだ]で、彼らの一人[ひとり]のようであれ。彼らのために心[こころ]を配[くば]り、そうしてから席[せき]に着[つ]け。"
  2: "あなたの務[つと]めをすべて果[は]たしてから席[せき]に着[つ]け。彼らによって喜[よろこ]びを得[え]、立派[りっぱ]に整[ととの]えたゆえに冠[かんむり]を受[う]けるためである。"
  3: "年長[ねんちょう]の者[もの]よ、語[かた]れ。それはあなたにふさわしい。正確[せいかく]な知識[ちしき]をもって語り、音楽[おんがく]を妨[さまた]げてはならない。"
  4: "人[ひと]が耳[みみ]を傾[かたむ]けている所[ところ]で、言葉[ことば]を溢[あふ]れさせてはならない。時[とき]でないのに知[し]ったかぶってはならない。"
  5: "金[きん]の飾[かざ]りに据[す]えられたルビーの印[いん]のように、ぶどう酒の宴[うたげ]では音楽[おんがく]の調[しら]べが美[うつく]しく響[ひび]く。"
  6: "金[きん]の細工[ざいく]に嵌[は]められたエメラルドの印[いん]のように、甘[あま]いぶどう酒のもとでの歌[うた]も美しい。"
  7: "若[わか]い者[もの]よ、必要[ひつよう]があるなら語[かた]れ。ただし、問[と]われたとき、せいぜい二度[にど]までにせよ。"
  8: "言葉[ことば]を要約[ようやく]せよ。少[すく]ない言葉のうちに多[おお]くを込[こ]めよ。知[し]っている者[もの]のように、しかも同時[どうじ]に黙[だま]っている者のようにあれ。"
  9: "大[おお]きな者[もの]たちの間[あいだ]で、対等[たいとう]に並[なら]ぼうとしてならない。ほかの者[もの]が語[かた]っているとき、多[おお]くをしゃべってはならない。"
  10: "雷[かみなり]の前[まえ]に稲妻[いなずま]が走[はし]るように、恥[は]じらう者[もの]の前[まえ]には恵[めぐ]みが先[さき]だって進[すす]む。"
  11: "時[とき]が来[き]たら立[た]ち、後[あと]に残[のこ]ってはならない。家[いえ]へ急[いそ]ぎ、怠[なま]けてはならない。"
  12: "そこでは遊[あそ]び、自分[じぶん]の思[おも]いを遂[と]げるがよい。ただ、高[たか]ぶった言葉[ことば]で罪[つみ]を犯[おか]してはならない。"
  13: "そのうえで、あなたを造[つく]り、その善[ぜん]によってあなたを酔[よ]わせる方[かた]を祝福[しゅくふく]せよ。"
  14: "主[しゅ]を恐[おそ]れる者[もの]は教[おし]えを受[う]け入[い]れ、朝[あさ]早[はや]く求[もと]める者[もの]は恵[めぐ]みを見[み]いだす。"
  15: "律法[りっぽう]を求める者[もの]はそれに満[み]たされ、見[み]せかけだけの者[もの]はそれにつまずく。"
  16: "主[しゅ]を恐れる者[もの]たちは裁[さば]きを見いだし、正[ただ]しい定[さだ]めを光[ひかり]のように灯[とも]す。"
  17: "罪[つみ]ある人[ひと]は責[せ]めを避[さ]け、自分[じぶん]の望[のぞ]みにかなう言[い]い訳[わけ]を見[み]つける。"
  18: "思慮[しりょ]ある人[ひと]は思[おも]いを軽[かろ]んじない。よそ者[もの]と高慢[こうまん]な者[もの]は恐[おそ]れにひるまず、助言[じょげん]なしに事[こと]をなした後[あと]でも平然[へいぜん]としている。"
  19: "助言[じょげん]なしに何[なに]もしてはならない。してしまった後[あと]で悔[く]やんではならない。"
  20: "つまずきの道[みち]を歩[あゆ]んではならない。石[いし]の多[おお]い所[ところ]でつまずいてはならない。"
  21: "つまずきのない道[みち]だからといって、安心[あんしん]してはならない。"
  22: "自分[じぶん]の子[こ]どもたちからも身[み]を守[まも]れ。"
  23: "どんなわざにおいても、自分[じぶん]の魂[たましい]に信[しん]を置[お]け。それこそが戒[いまし]めを守[まも]ることだからである。"
  24: "律法[りっぽう]を信[しん]じる者[もの]は戒[いまし]めに心[こころ]を留[と]め、主[しゅ]に信頼[しんらい]を置[お]く者[もの]は損[そん]をしない。"

notes:
  1: "Ἡγούμενόν σε κατέστησαν; — «начальником (распорядителем) тебя поставили?»; ἡγούμενος — стоящий впереди, старший на пиру; слав. «старейшину ли тя поставиша». μὴ ἐπαίρου — «не превозносись» (ἐπαίρω — поднимать, надмевать). φρόντισον αὐτῶν — «позаботься о них»; καὶ οὕτω κάθισον — «и так садись», т. е. после того, как всё устроил."
  2: "πᾶσαν τὴν χρείαν σου ποιήσας — «исполнив всякую нужду (дело) твою». ἀνάπεσε — «возляг, займи место» (ἀναπίπτω). ἵνα εὐφρανθῇς δι᾽ αὐτούς — «чтобы возрадоваться через них». εὐκοσμίας χάριν λάβῃς στέφανον — «ради благопристойности получишь венец» (εὐκοσμία — порядок, благолепие); слав. дробит на 2–3."
  3: "Λάλησον, πρεσβύτερε, πρέπει γάρ σοι — «говори, старший, ибо тебе прилично» (πρέπει — подобает); слав. «глаголи, старейшино, подобает бо ти». ἐν ἀκριβεῖ ἐπιστήμῃ — «с точным знанием» (ἀκριβής — точный). μὴ ἐμποδίσῃς μουσικά — «не препятствуй музыке» (ἐμποδίζω); слав. «не возбрани мусикии»."
  4: "ὅπου ἀκρόαμα — «где [есть] слушание», т. е. где слушают (ἀκρόαμα — то, что слушают, внимание). μὴ ἐκχέῃς λαλιάν — «не изливай речи» (ἐκχέω — выливать; λαλιά — болтовня, речь). ἀκαίρως μὴ σοφίζου — «не мудрствуй не вовремя» (σοφίζομαι — умничать)."
  5: "σφραγὶς ἄνθρακος ἐπὶ κόσμῳ χρυσῷ — «печать карбункула (рубина) на золотом украшении» (ἄνθραξ — карбункул; κόσμος — убранство); слав. «печать анфракса». σύγκριμα μουσικῶν ἐν συμποσίῳ οἴνου — «слаженность музыкантов на пиру вина» (σύγκριμα — сочетание, согласие); слав. «сладкогласие мусикиев»."
  6: "ἐν κατασκευάσματι χρυσῷ — «в золотом изделии (оправе)» (κατασκεύασμα). σφραγὶς σμαράγδου — «печать изумруда» (σμάραγδος); слав. «печать смарагдова». μέλος μουσικῶν ἐφ᾽ ἡδεῖ οἴνῳ — «песнь музыкантов при сладком вине» (μέλος — напев; ἡδύς — сладкий)."
  7: "Λάλησον, νεανίσκε — «говори, юноша». εἰ χρεία σου — «если есть нужда тебе». μόλις δὶς ἐὰν ἐπερωτηθῇς — «едва (лишь) дважды, если будешь спрошен» (μόλις — едва, с трудом)."
  8: "κεφαλαίωσον λόγον — «сведи слово к главному» (κεφαλαιόω — резюмировать, от κεφαλή — глава). ἐν ὀλίγοις πολλά — «в немногом многое». γίνου ὡς γινώσκων καὶ ἅμα σιωπῶν — «будь как знающий и вместе молчащий»."
  9: "ἐν μέσῳ μεγιστάνων — «среди вельмож» (μεγιστάνες — знатные, вельможи). μὴ ἐξισάζου — «не равняйся, не ставь себя наравне» (ἐξισάζω). ἑτέρου λέγοντος μὴ πολλὰ ἀδολέσχει — «когда другой говорит, не многословь» (ἀδολεσχέω — пустословить)."
  10: "πρὸ βροντῆς κατασπεύδει ἀστραπή — «перед громом спешит молния» (βροντή — гром; κατασπεύδω — спешить). πρὸ αἰσχυντηροῦ προελεύσεται χάρις — «перед стыдливым идёт благодать (благоволение)» (αἰσχυντηρός — совестливый, стыдливый; χάρις — благодать)."
  11: "ἐν ὥρᾳ ἐξεγείρου — «в [нужный] час поднимайся» (ἐξεγείρω — пробуждать). μὴ οὐράγει — «не тянись в хвосте, не будь последним» (οὐρά — хвост, οὐραγέω — идти позади). ἀπότρεχε εἰς οἶκον — «беги домой». μὴ ῥᾳθύμει — «не ленись, не медли» (ῥᾳθυμέω)."
  12: "ἐκεῖ παῖζε — «там играй, забавляйся» (παίζω). ποίει τὰ ἐνθυμήματά σου — «исполняй свои помыслы (желания)» (ἐνθύμημα). μὴ ἁμάρτῃς λόγῳ ὑπερηφάνῳ — «не согреши словом надменным». Слав. ст. 14."
  13: "ἐπὶ τούτοις — «за это, сверх этого». εὐλόγησον τὸν ποιήσαντά σε — «благослови Сотворившего тебя». μεθύσκοντά σε ἀπὸ τῶν ἀγαθῶν αὐτοῦ — «напаивающего тебя от благ Его» (μεθύσκω — поить допьяна, обильно насыщать); слав. «упоевающаго тя от благ своих»."
  14: "Ὁ φοβούμενος κύριον ἐκδέξεται παιδείαν — «боящийся Господа примет наставление» (ἐκδέχομαι — принимать, воспринимать). οἱ ὀρθρίζοντες εὑρήσουσιν εὐδοκίαν — «встающие на заре (рано ищущие) найдут благоволение» (ὀρθρίζω; εὐδοκία — благоволение)."
  15: "ὁ ζητῶν νόμον ἐμπλησθήσεται αὐτοῦ — «ищущий закон насытится им» (ἐμπίπλημι). ὁ ὑποκρινόμενος σκανδαλισθήσεται ἐν αὐτῷ — «лицемерящий (притворяющийся) соблазнится в нём» (ὑποκρίνομαι; σκανδαλίζω — соблазнять, ставить подножку)."
  16: "οἱ φοβούμενοι κύριον εὑρήσουσιν κρίμα — «боящиеся Господа найдут суд (приговор)» (κρίμα). δικαιώματα ὡς φῶς ἐξάψουσιν — «правды (уставы), как свет, возжгут» (δικαίωμα — оправдание, устав; ἐξάπτω — зажигать)."
  17: "ἄνθρωπος ἁμαρτωλὸς ἐκκλινεῖ ἐλεγμόν — «человек грешный уклонится от обличения» (ἐκκλίνω — уклоняться; ἐλεγμός). κατὰ τὸ θέλημα αὐτοῦ εὑρήσει σύγκριμα — «по воле своей найдёт оправдание (подысканное основание)»; слав. «обретает извинение»."
  18: "Ἀνὴρ βουλῆς — «муж совета», т. е. рассудительный (βουλή — совет). οὐ μὴ παρίδῃ διανόημα — «не пренебрежёт мыслью (намерением)» (παροράω — просмотреть, презреть). ἀλλότριος καὶ ὑπερήφανος οὐ καταπτήξει φόβον — «чужой и надменный не убоится страха» (καταπτήσσω — съёживаться от страха). Слав. и ru прибавляют «и по сотворении своем без совета» — нет в LXX, внесено в текст без 〔…〕."
  19: "ἄνευ βουλῆς μηθὲν ποιήσῃς — «без совета (обдумывания) ничего не делай». ἐν τῷ ποιῆσαί σε μὴ μεταμελοῦ — «сделав, не раскаивайся» (μεταμέλομαι)."
  20: "ἐν ὁδῷ ἀντιπτώματος μὴ πορεύου — «по пути преткновения (падения) не ходи» (ἀντίπτωμα). μὴ προσκόψῃς ἐν λιθώδεσιν — «не споткнись о каменистых местах» (προσκόπτω; λιθώδης — каменистый); слав. «о камение»."
  21: "μὴ πιστεύσῃς ἐν ὁδῷ ἀπροσκόπῳ — «не полагайся [на себя] на пути беспрепятственном» (πιστεύω — доверять; ἀπρόσκοπος — ровный, без преткновений); слав. «не веруй пути, в немже не претыкаешися»."
  22: "καὶ ἀπὸ τῶν τέκνων σου φύλαξαι — «и от детей твоих хранись (остерегайся)» (φυλάσσομαι ἀπό — беречься от). Слав. соединяет 21–22 в один стих (23), по gr это два стиха."
  23: "ἐν παντὶ ἔργῳ πίστευε τῇ ψυχῇ σου — «во всяком деле верь душе своей», т. е. действуй по совести. τοῦτό ἐστιν τήρησις ἐντολῶν — «это есть соблюдение заповедей» (τήρησις — хранение, соблюдение); слав. «соблюдение заповедий»."
  24: "ὁ πιστεύων νόμῳ προσέχει ἐντολαῖς — «верующий закону внимает заповедям» (προσέχω — обращать внимание). ὁ πεποιθὼς κυρίῳ οὐκ ἐλαττωθήσεται — «надеющийся на Господа не будет умалён» (πείθω в перфекте — полагаться; ἐλαττόω — уменьшать, терпеть урон); слав. «не умалится»."
