# jp-box, Сирах, глава 32. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для книги нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 32: поведение распорядителя пира (1–2), речь старшего (3), умеренность
# в разговоре (4–6), речь юноши (7–8), место среди вельмож (9), приметы (10),
# уход с пира (11–12), благодарение Творцу (13); страх Господень и закон
# (14–16), грешник и человек совета (17–19), осмотрительность в пути (20–22),
# доверие своей душе (23–24). Прямой речи нет; основной текст — поучение,
# без внешних кавычек; красного и синего нет.
# Нумерация по gr: 24 стиха. Слав. 25 (+1): дробит gr 2 (слав. 2–3) и gr 3
# (слав. 4–5), а gr 21–22 сливает в слав. 23; слав. части влиты в стихи gr,
# стихи не добавлялись и не дробились.
# Слав. 18 (и ru) прибавляет в конце «и по сотворении своем без совета» — этого
# нет в gr-lxx-byz; по паритету внесено в основной текст ст. 18 без 〔…〕.
# 〔…〕 нет: все стихи есть в gr-lxx-byz. Сносок ⟨…⟩ нет.
# Имена — транслитерация греческого (LXX).

