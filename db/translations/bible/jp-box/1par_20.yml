# jp-box, 1-я Паралипоменон, глава 20. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); церковнославянский (csl-ru) — второй
# свидетель церковного текста (новый паритет, docs/japanese-bible.md):
# слав. чтения входят в основной текст без 〔…〕, вариант LXX — в notes.
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет;
# jp-ni (под авторским правом) не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 20: взятие Раввы (1–3; параллель 2 Цар 11:1; 12:26–31); четыре победы
# над великанами, Газер и Геф (4–8; параллель 2 Цар 21:18–22).
# Речи нет.
# Нумерация по gr: 8 стихов, совпадает с csl/ru.
# 〔…〕 нет. Сносок ⟨…⟩ нет: 祭壇, 燔祭, 冠, 分捕り物, 巨人 уже в корпусе.
# Имена 4–8 сверены с 2ts_21.yml; расхождения LXX отмечены в notes.

tr_code: jp-box
book: 1par
chapter: 20
draft: true

verses:
  1: "次[つぎ]の年[とし]になって、王[おう]たちが戦[いくさ]に出[で]るころ、ヨアブは軍[ぐん]のすべての力[ちから]を集[あつ]めてアンモン人[じん]の地[ち]を荒[あ]らし、ラバへ来[き]てこれを包囲[ほうい]した。ダビデはエルサレムにとどまっていた。ヨアブはラバを打[う]ち、これを破壊[はかい]した。"
  2: "ダビデは彼[かれ]らの王[おう]モルコムの冠[かんむり]を、その頭[あたま]から取[と]った。その重[おも]さは金[きん]一[いち]タラントで、その中[なか]に貴[とうと]い石[いし]があった。それはダビデの頭に置[お]かれた。彼は町[まち]から分捕[ぶんど]り物[もの]を非常[ひじょう]に多[おお]く持[も]ち出[だ]した。"
  3: "彼[かれ]はその中[なか]にいた民[たみ]を連[つ]れ出[だ]し、のこぎりと鉄[てつ]の斧[おの]、また切[き]り裂[さ]く道具[どうぐ]の下[した]に置[お]いた。ダビデはアンモン人[じん]のすべての町々[まちまち]にも同[おな]じようにした。ダビデと民は皆[みな]、エルサレムに帰[かえ]った。"
  4: "その後[あと]、ペリシテ人[じん]との間[あいだ]にガゼルで再[ふたた]び戦[いくさ]があった。そのとき、ウサ人[じん]ソボハイが巨人[きょじん]の子[こ]らの一人[ひとり]サフを打[う]ち、彼[かれ]を屈服[くっぷく]させた。"
  5: "またペリシテ人[じん]との間[あいだ]に戦[いくさ]があった。そのとき、ヤイルの子[こ]エレアナンが、ガテ人[じん]ゴリアトの兄弟[きょうだい]レエミを打[う]った。レエミの槍[やり]の柄[え]は、布[ぬの]を織[お]る者[もの]の巻[ま]き棒[ぼう]のようであった。"
  6: "またゲテで戦[いくさ]があった。そこに非常[ひじょう]に大[おお]きな男[おとこ]がいて、その手[て]の指[ゆび]は六本[ろっぽん]ずつ、合[あ]わせて二十四本[にじゅうよんほん]あった。この者[もの]もまた巨人[きょじん]の子孫[しそん]であった。"
  7: "彼[かれ]がイスラエルをののしったので、ダビデの兄弟[きょうだい]サマアの子[こ]ヨナタンが彼を打[う]った。"
  8: "これらはゲテでラファに生[う]まれた者[もの]たちである。皆[みな]で四人[よにん]の巨人[きょじん]であり、ダビデの手[て]とそのしもべたちの手によって倒[たお]れた。"

notes:
  1: "ἐν τῷ ἐπιόντι ἔτει — «в наступающем году» (ἐπιών); 次[つぎ]の年[とし]. ἐξόδῳ τῶν βασιλέων — «выход царей» (на войну). ἤγαγεν — вывел (ἄγω); в csl «собра» — по паритету 集[あつ]めて. ἔφθειραν — опустошили (φθείρω). περιεκάθισεν — осадил, обложил (περικαθίζω). ἐκάθητο — сидел, оставался (κάθημαι). κατέσκαψεν — разрушил до основания (κατασκάπτω). В csl в скобках «(ко брани)» — вставка, не переведена. Параллель 2 Цар 11:1."
  2: "τὸν στέφανον Μολχολ — венец Молхола (Μολχολ); csl «молхома» → モルコム, как в 2ts_12:30. σταθμὸς … τάλαντον χρυσίου — весом талант золота (σταθμός). λίθος τίμιος — драгоценный камень. ἦν ἐπὶ τὴν κεφαλήν — был на голову (возложен). σκῦλα — добыча (σκῦλον); csl «плены … взя» — «взял добычу», в тексте 持[も]ち出[だ]した по LXX ἐξήνεγκεν."
  3: "διέπρισεν — распилил (πρίζω); σκεπάρνοις — топорами, кирками (σκέπαρνον). В csl добавлено «и разсецающими» (рассекающими) — нет в LXX, по паритету в тексте. В csl «всем градом» — по всем городам; в LXX «всем сынам Аммона» (τοῖς πᾶσιν υἱοῖς Αμμων) — отмечено. Параллель 2 Цар 12:31, но без кирпичного горна, который есть только там."
  4: "Γαζερ — Газер (ガゼル). ἀλλόφυλοι — иноплеменники, здесь филистимляне (ペリシテ人). Σοβοχαι ὁ Ουσαθι — Совохай Усафитянин (ウサ人[じん]ソボハイ); он же фушатянин (フシャ人, ср. 1par 11:29; 27:11); в параллели 2 Цар 21:18 — Σεβοχα ὁ Αστατωθι (セボハ, астаротянин), иное чтение LXX. Σαφου — Саф (サフ); в 2 Цар 21:18 — Σεφ. ἀπὸ τῶν υἱῶν τῶν γιγάντων — из сынов исполинов (γίγαντες), т. е. рефаимов. ἐταπείνωσεν — смирил, покорил (ταπεινόω)."
  5: "Ελλαναν υἱὸς Ιαιρ — Елханан, сын Иаира (エレアナン, как в 2ts_21:19; здесь иное отчество, в 2 Цар — υἱὸς Αριωργιμ). Λεεμι — Лахми (レエミ); csl «лаомиа». Γολιαθ τοῦ Γεθθαίου — Голиаф Гефянин (ガテ人[じん]ゴリアト). ξύλον δόρατος — древо копья. ἀντίον ὑφαινόντων — навой ткачей (ἀντίον)."
  6: "ἀνὴρ ὑπερμεγέθης — муж огромного роста (ὑπερμεγέθης). δάκτυλοι ἓξ καὶ ἕξ — по шести пальцев. ἀπόγονος γιγάντων — потомок исполинов; в csl «от колена исполинов» — «из рода исполинов», передано 子孫[しそん]."
  7: "ὠνείδισεν — поносил, укорял (ὀνειδίζω). Ιωναθαν υἱὸς Σαμαα ἀδελφοῦ Δαυιδ — Ионафан, сын Саммы (Σαμαα → サマア, как в 1par 2:13), брата Давидова; в 2 Цар 21:21 — υἱὸς Σεμει (シメイ). csl «саммаа»."
  8: "οὗτοι ἐγένοντο Ραφα ἐν Γεθ — «сии родились от Рафы в Гефе» (Ραφα — Рафа, род рефаимов; ラファ). πάντες … τέσσαρες γίγαντες — все четверо исполины. ἔπεσον ἐν χειρὶ Δαυιδ — пали от руки Давида. παίδων — слуг (しもべ)."
