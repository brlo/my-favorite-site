# jp-box, Первое послание к Коринфянам, глава 15. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в notes.
# Глава 15: воскресение Христа и древнее предание (1–11), аргумент о воскресении
# мёртвых без сглаживания (12–19), Христос — начаток (20–28), 29 — «крещение за мёртвых»
# как есть, 30–34, вопрос о теле (35–50), тайна изменения (51–57), заключение (58).
# Красного и синего нет: 15:3–5 — древнее предание, но это слова Павла, не Христа.
# 〔…〕: 15:47 — церковное ὁ κύριος (в базе ὁ δεύτερος ἄνθρωπος ἐξ οὐρανοῦ без него).
# Цитаты: 15:27 (Пс 8:7), 15:32 (Ис 22:13), 15:45 (Быт 2:7), 15:54 (Ис 25:8),
# 15:55 (Ос 13:14) — 「…」; слова Бога внутри рассуждения 15:27 — 『…』.
# Сносок ⟨…⟩ нет. jp-ni не использовался.

