verses:
  1: "兄弟[きょうだい]たちよ、わたしはあなたがたに、わたしが宣[の]べ伝[つた]えた福音[ふくいん]を知[し]らせたい。それは、あなたがたが受[う]け入[い]れ、またその中[なか]に立[た]っている福音[ふくいん]である。"
  2: "この福音[ふくいん]によって、あなたがたは救[すく]われている。ただし、わたしがどんな言葉[ことば]で宣[の]べ伝[つた]えたかを、あなたがたがしっかりと保[たも]っているならである。そうでなければ、あなたがたはむだに信[しん]じたことになる。"
  3: "なぜなら、わたしがまずあなたがたに伝[つた]えたのは、わたし自身[じしん]も受[う]け取[と]ったことだからである。すなわち、キリストは聖書[せいしょ]に書[か]かれているとおりに、わたしたちの罪[つみ]のために死[し]なれた、ということである。"
  4: "また、葬[ほうむ]られ、聖書[せいしょ]に書[か]かれているとおりに、三日目[みっかめ]に復活[ふっかつ]されたということである。"
  5: "そして、ケファに現[あらわ]れ、次[つぎ]に十二人[じゅうににん]に現[あらわ]れた。"
  6: "その後[そののち]、五百人[ごひゃくにん]余[あま]りの兄弟[きょうだい]たちに一度[いちど]に現[あらわ]れた。そのうちの多[おお]くは今[いま]に至[いた]るまで残[のこ]っているが、眠[ねむ]りについた者[もの]もいる。"
  7: "その後[そののち]、ヤコブに現[あらわ]れ、次[つぎ]にすべての使徒[しと]たちに現[あらわ]れた。"
  8: "そして最後[さいご]に、月[つき]足[た]らずに生[う]まれた者[もの]のようなわたしにも現[あらわ]れた。"
  9: "なぜなら、わたしは使徒[しと]たちのうちで最[もっと]も小[ちい]さな者[もの]であり、使徒[しと]と呼[よ]ばれる資格[しかく]さえない。神[かみ]の教会[きょうかい]を迫害[はくがい]したからである。"
  10: "しかし、わたしが今[いま]あるのは、神[かみ]の恵[めぐ]みによるのである。わたしに向[む]けられたその恵[めぐ]みは、むだにはならなかった。むしろ、わたしは彼[かれ]らすべての人[ひと]よりも多[おお]く労[ろう]した。しかし、それはわたしではなく、わたしとともにいる神[かみ]の恵[めぐ]みである。"
  11: "そこで、わたしであれ、彼[かれ]らであれ、わたしたちはこのように宣[の]べ伝[つた]え、あなたがたもこのように信[しん]じたのである。"
  12: "さて、キリストが死者[ししゃ]の中[なか]から復活[ふっかつ]されたと宣[の]べ伝[つた]えられているのに、あなたがたの中[なか]の一部[いちぶ]の者[もの]が、死者[ししゃ]の復活[ふっかつ]はないと言[い]うのは、どういうことか。"
  13: "もし死者[ししゃ]の復活[ふっかつ]がないのなら、キリストも復活[ふっかつ]されていない。"
  14: "もしキリストが復活[ふっかつ]されていないのなら、わたしたちの宣教[せんきょう]は空[むな]しく、あなたがたの信仰[しんこう]も空[むな]しい。"
  15: "そのうえ、わたしたちは神[かみ]について偽[いつわ]りの証[しょう]をする者[もの]であることが分[わ]かる。神[かみ]はキリストを復活[ふっかつ]させたと、神[かみ]に逆[さか]らって証[しょう]したことになるからである。もっとも、死者[ししゃ]が復活[ふっかつ]しないのであれば、神[かみ]はキリストを復活[ふっかつ]させてはいないのだが。"
  16: "なぜなら、もし死者[ししゃ]が復活[ふっかつ]しないのなら、キリストも復活[ふっかつ]されていないからである。"
  17: "もしキリストが復活[ふっかつ]されていないのなら、あなたがたの信仰[しんこう]はむだであり、あなたがたはまだ自分[じぶん]の罪[つみ]の中[なか]にいる。"
  18: "そうすると、キリストにあって眠[ねむ]りについた者[もの]たちも、滅[ほろ]びてしまったことになる。"
  19: "もしわたしたちが、この生[いのち]においてだけキリストに希望[きぼう]を置[お]いているのなら、わたしたちはすべての人[ひと]のうちで最[もっと]も哀[あわ]れな者[もの]である。"
  20: "しかし今[いま]、キリストは死者[ししゃ]の中[なか]から復活[ふっかつ]され、眠[ねむ]りについた者[もの]たちの初穂[はつほ]となられた。"
  21: "なぜなら、死[し]が人[ひと]によって来[き]たように、死者[ししゃ]の復活[ふっかつ]も人[ひと]によって来[き]たからである。"
  22: "なぜなら、アダムにあってすべての人[ひと]が死[し]ぬように、キリストにあってもすべての人[ひと]が生[い]かされるからである。"
  23: "しかし、それぞれが自分[じぶん]の順[じゅん]に従[したが]う。まず初穂[はつほ]はキリスト、次[つぎ]に、キリストの来臨[らいりん]のとき、キリストに属[ぞく]する者[もの]たちである。"
  24: "次[つぎ]に、終[お]わりが来[く]る。キリストが国[くに]を父[ちち]である神[かみ]に渡[わた]されるとき、すなわち、すべての支配[しはい]と権威[けんい]と力[ちから]を滅[ほろ]ぼされるときである。"
  25: "なぜなら、キリストは、すべての敵[てき]をご自分[じぶん]の足[あし]の下[した]に置[お]くまで、王[おう]として治[おさ]めなければならないからである。"
  26: "最後[さいご]に滅[ほろ]ぼされる敵[てき]は、死[し]である。"
  27: "「神[かみ]は万物[ばんぶつ]をキリストの足[あし]の下[した]に置[お]かれた」と書[か]かれているからである。しかし、神[かみ]が『万物[ばんぶつ]は服[ふく]させられた』と言[い]われるとき、万物[ばんぶつ]をキリストに服[ふく]させた方[かた]が、その中[なか]に含[ふく]まれていないことは明[あき]らかである。"
  28: "万物[ばんぶつ]がキリストに服[ふく]させられたとき、子[こ]自身[じしん]も、万物[ばんぶつ]をキリストに服[ふく]させた方[かた]に服[ふく]する。それは、神[かみ]がすべてのもののうちに、すべてのものとなられるためである。"
  29: "そうでなければ、死者[ししゃ]のために洗礼[せんれい]を受[う]ける者[もの]たち⟨もしキリストが復活[ふっか]されず、死者[ししゃ]のままだとしたら、洗礼[せんれい]は何[なん]の意味[いみ]も持[も]たない。つまり、死者[ししゃ]のままのキリストに結[むす]ばれ、死者[ししゃ]のために洗礼[せんれい]を受[う]けるのはなぜか、ということ。⟩は、何[なに]をするのか。もし死者[ししゃ]が全[まった]く復活[ふっかつ]しないのなら、なぜ彼[かれ]らは死者[ししゃ]のために洗礼[せんれい]を受[う]けるのか。"
  30: "また、なぜわたしたちも、時[とき]ごとに危険[きけん]を冒[おか]しているのか。"
  31: "わたしは毎日[まいにち]死[し]んでいる。兄弟[きょうだい]たちよ、わたしたちの主[しゅ]キリスト・イエスにあってあなたがたに抱[いだ]いている誇[ほこ]りにかけて言[い]う。"
  32: "人間的[にんげんてき]に言[い]えば、わたしがエフェソで獣[けもの]と戦[たたか]ったのなら、わたしに何[なに]の益[えき]があったのか。もし死者[ししゃ]が復活[ふっかつ]しないのなら、「食[く]おう、飲[の]もう、明日[あす]は死[し]ぬのだから」ということになる。"
  33: "自分[じぶん]を欺[あざむ]いてはならない。「悪[わる]い交[まじ]わりは、善[よ]い習慣[しゅうかん]を損[そこ]なう」のである。"
  34: "正[ただ]しく目[め]を覚[さ]まして、罪[つみ]を犯[おか]してはならない。神[かみ]を知[し]らない者[もの]が、あなたがたの中[なか]にいるからである。わたしはあなたがたを恥[は]じさせるために言[い]っている。"
  35: "しかし、だれかが、「死者[ししゃ]はどのように復活[ふっかつ]するのか。どのような体[からだ]で来[く]るのか」と言[い]うだろう。"
  36: "愚[おろ]かな者[もの]よ。あなたが蒔[ま]くものは、死[し]ななければ生[い]かされない。"
  37: "また、あなたが蒔[ま]くとき、やがて成[な]る体[からだ]を蒔[ま]くのではなく、裸[はだか]の種[たね]、たとえば麦[むぎ]か、ほかの何[なに]かの穀物[こくもつ]を蒔[ま]くのである。"
  38: "しかし、神[かみ]はご自分[じぶん]の望[のぞ]みのままに、それに体[からだ]をお与[あた]えになる。種[たね]ごとに、それぞれに固有[こゆう]の体[からだ]をお与[あた]えになるのである。"
  39: "すべての肉[にく]が同[おな]じ肉[にく]ではない。しかし、人[ひと]の肉[にく]もあれば、獣[けもの]の肉[にく]もあり、鳥[とり]の肉[にく]もあり、魚[さかな]の肉[にく]もある。"
  40: "また、天[てん]の体[からだ]もあれば、地[ち]の体[からだ]もある。しかし、天[てん]の体[からだ]の栄光[えいこう]と、地[ち]の体[からだ]の栄光[えいこう]とは異[こと]なる。"
  41: "太陽[たいよう]の栄光[えいこう]もあれば、月[つき]の栄光[えいこう]もあり、星[ほし]の栄光[えいこう]もある。また、星[ほし]と星[ほし]とでも栄光[えいこう]が異[こと]なる。"
  42: "死者[ししゃ]の復活[ふっかつ]も同[おな]じである。朽[く]ちるものとして蒔[ま]かれ、朽[く]ちないものとして起[お]こされる。"
  43: "辱[はずかし]めのうちに蒔[ま]かれ、栄光[えいこう]のうちに起[お]こされる。弱[よわ]さのうちに蒔[ま]かれ、力[ちから]のうちに起[お]こされる。"
  44: "自然[しぜん]の体[からだ]として蒔[ま]かれ、霊[れい]の体[からだ]として起[お]こされる。自然[しぜん]の体[からだ]があるのなら、霊[れい]の体[からだ]もある。"
  45: "「最初[さいしょ]の人[ひと]アダムは、生[い]ける者[もの]となった」と書[か]かれている。最後[さいご]のアダムは、生[い]かす霊[れい]となった。"
  46: "しかし、まず霊[れい]のものが来[く]るのではなく、まず自然[しぜん]のものが来[く]て、その次[つぎ]に霊[れい]のものが来[く]るのである。"
  47: "最初[さいしょ]の人[ひと]は地[ち]から出[で]て土[つち]に属[ぞく]し、第二[だいに]の人[ひと]は天[てん]から出[で]た〔主[しゅ]〕である。"
  48: "土[つち]に属[ぞく]する者[もの]がそうであるように、土[つち]に属[ぞく]する者[もの]たちもそうである。天[てん]に属[ぞく]する者[もの]がそうであるように、天[てん]に属[ぞく]する者[もの]たちもそうである。"
  49: "わたしたちが土[つち]に属[ぞく]する者[もの]の姿[すがた]を着[き]てきたように、天[てん]に属[ぞく]する者[もの]の姿[すがた]も着[き]るのである。"
  50: "兄弟[きょうだい]たちよ、わたしはこう言[い]う。血肉[けつにく]は神[かみ]の国[くに]を受[う]け継[つ]ぐことができず、朽[く]ちるものが朽[く]ちないものを受[う]け継[つ]ぐこともない。"
  51: "見[み]よ、わたしはあなたがたに奥義[おうぎ]を告[つ]げる。わたしたちは皆[みな]が眠[ねむ]りにつくわけではない。しかし、皆[みな]が変[か]えられるのである。"
  52: "それは、たちまちに、またたきの間[あいだ]に、最後[さいご]のラッパとともに起こる。ラッパが鳴[な]り響[ひび]くからである。死者[ししゃ]は朽[く]ちない者[もの]として復活[ふっかつ]し、わたしたちは変[か]えられるのである。"
  53: "この朽[く]ちるものが朽[く]ちないものを着[き]、この死[し]ぬべきものが不死[ふし]を着[き]なければならないからである。"
  54: "この朽[く]ちるものが朽[く]ちないものを着[き]、この死[し]ぬべきものが不死[ふし]を着[き]るとき、そのとき、書[か]かれている言葉[ことば]が成就[じょうじゅ]する。「死[し]は勝利[しょうり]に呑[の]み込[こ]まれた。」"
  55: "「死[し]よ、おまえの勝利[しょうり]はどこにあるのか。死[し]よ、おまえのとげはどこにあるのか。」"
  56: "死[し]のとげは罪[つみ]であり、罪[つみ]の力[ちから]は律法[りっぽう]である。"
  57: "しかし、神[かみ]に感謝[かんしゃ]する。神[かみ]は、わたしたちの主[しゅ]イエス・キリストによって、わたしたちに勝利[しょうり]を与[あた]えてくださる。"
  58: "それゆえ、わたしの愛[あい]する兄弟[きょうだい]たちよ、しっかりと立[た]ち、揺[ゆ]るがないで、いつも主[しゅ]の業[わざ]に励[はげ]みなさい。あなたがたの労苦[ろうく]が主[しゅ]にあってむだでないことを、あなたがたは知[し]っているからである。"

notes:
  1: "γνωρίζω — 知らせる. παρελάβετε — 受け入れた; ἑστήκατε — 立っている."
  2: "τίνι λόγῳ — «каким словом»; どんな言葉で. εἰκῇ — むだに."
  3: "παρέδωκα … ὃ καὶ παρέλαβον — «предал… что и принял»; древнее предание, но слова Павла, не красные. κατὰ τὰς γραφάς — 聖書に書かれているとおりに."
  4: "ἐγήγερται — 復活された; τῇ ἡμέρᾳ τῇ τρίτῃ — 三日目に."
  5: "Κηφᾷ — ケファ (Пётр); τοῖς δώδεκα — 十二人."
  6: "ἐπάνω πεντακοσίοις — «более пятисот»; 五百人余り. ἐκοιμήθησαν — 眠りについた."
  8: "ἔκτρωμα — «недоношенный, выкидыш»; 月足らずに生まれた者."
  9: "ἐλάχιστος — 最も小さな者; ἱκανός — 資格がある; ἐδίωξα — 迫害した."
  10: "χάριτι θεοῦ — 神の恵みによって; κενή — むだ; ἐκοπίασα — 労した."
  11: "εἴτε … εἴτε — であれ…であれ."
  12: "ἀνάστασις νεκρῶν — 死者の復活."
  14: "κενόν — 空しい; κήρυγμα — 宣教."
  15: "ψευδομάρτυρες — 偽りの証をする者; εἴπερ ἄρα — «если действительно»."
  17: "ματαία — むだ; ἔτι … ἐν ταῖς ἁμαρτίαις — まだ罪の中にいる."
  18: "ἄρα — そうすると."
  19: "ἠλπικότες — 希望を置いている; ἐλεεινότεροι — 最も哀れな."
  20: "ἀπαρχή — 初穂; κεκοιμημένων — 眠りについた者たち."
  21: "ἐπειδὴ γάρ — なぜなら…からである."
  22: "ζῳοποιηθήσονται — 生かされる."
  23: "τάγμα — 順; παρουσία — 来臨."
  24: "εἶτα τὸ τέλος — 次に終わり. καταργήσῃ — 滅ぼす; παραδιδῷ — 渡す. Два ὅταν; порядок греч. сохранён, второе передано через すなわち (как 即ち у jp-joc)."
  25: "δεῖ — なければならない; θῇ — 置く."
  26: "καταργεῖται — 滅ぼされる."
  27: "Цитата Пс 8:7 — 「…」; слова Бога внутри рассуждения — 『万物は服させられた』. ἐκτὸς τοῦ ὑποτάξαντος — «кроме Покорившего»; 服させた方が含まれていない."
  28: "[τὰ] в базе в квадратных скобках — 〔…〕 не ставится. ἵνα ᾖ ὁ θεὸς τὰ πάντα ἐν πᾶσιν — 神がすべてのもののうちに、すべてのものとなる."
  29: "βαπτιζόμενοι ὑπὲρ τῶν νεκρῶν — «крещаемые за мёртвых»; 死者のために洗礼を受ける者. О чём именно речь (замена умерших, молитва за них, крещение на гробах) — спорно; перевод буквальный, без сглаживания, как в jp-joc「死者のために洗を受くる者」. Проверено по базе: ὑπὲρ τῶν νεκρῶν в стихе есть."
  30: "κινδυνεύομεν — 危険を冒す."
  31: "νή — клятвенная частица; にかけて. [ἀδελφοί] в квадратных скобках — без 〔〕. καύχησις — 誇り."
  32: "κατὰ ἄνθρωπον — «по-человечески»; 人間的に言えば. ἐθηριομάχησα — «сражался с зверями»; 獣と戦った. Цитата Ис 22:13 — 「…」."
  33: "Строка из комедии Менандра (Θαΐς), вошедшая в пословицу; цитата — 「…」. ἤθη χρηστά — 良い習慣."
  34: "ἐκνήψατε — «отрезвитесь»; 目を覚ます. πρὸς ἐντροπὴν ὑμῖν λαλῶ — 恥じさせるために言う."
  35: "ποίῳ σώματι — どのような体で."
  36: "ἄφρων — 愚かな者; ζῳοποιεῖται — 生かされる."
  37: "γυμνὸν κόκκον — 裸の種; εἰ τύχοι — たとえば."
  38: "ἴδιον σῶμα — «своё собственное тело»; それぞれに固有の体."
  42: "σπείρεται … ἐγείρεται — 蒔かれる…起こされる; φθορά / ἀφθαρσία — 朽ちる / 朽ちない."
  43: "ἀτιμία — 辱め; δόξα — 栄光; ἀσθένεια / δύναμις — 弱さ / 力."
  44: "ψυχικόν / πνευματικόν — 自然の / 霊の."
  45: "Цитата Быт 2:7 — 「…」. ἔσχατος Ἀδάμ — 最後のアダム; πνεῦμα ζῳοποιοῦν — 生かす霊."
  46: "οὐ πρῶτον τὸ πνευματικόν — まず霊のものではない."
  47: "В критической базе ὁ δεύτερος ἄνθρωπος ἐξ οὐρανοῦ без ὁ κύριος; церковный текст (Елизаветинская «Господь с небесе», jp-joc「第二の人は天よりして主なり」) читает ὁ κύριος — 〔主〕. Проверено по базе: κύριος в стихе — 0."
  48: "χοϊκός / ἐπουράνιος — 土に属する / 天に属する."
  49: "ἐφορέσαμεν … φορέσομεν — 着てきた…着る."
  50: "σὰρξ καὶ αἷμα — 血肉; κληρονομῆσαι — 受け継ぐ."
  51: "πάντες οὐ κοιμηθησόμεθα — «не все уснём» (отрицание при πάντες), а не «все не уснём»; 皆が眠りにつくわけではない. ἀλλαγησόμεθα — 変えられる."
  52: "ἐν ἀτόμῳ, ἐν ῥιπῇ ὀφθαλμοῦ — たちまちに、またたきの間に. ἐσχάτη σάλπιγξ — 最後のラッパ. σαλπίσει γάρ — ラッパが鳴り響くからである."
  53: "δεῖ γάρ — なぜなら…なければならないからである. ἀθανασία — 不死."
  54: "Цитата Ис 25:8 — 「…」. εἰς νῖκος — 勝利に."
  55: "Цитата Ос 13:14 — 「…」. В базе θάνατε дважды; jp-joc во второй половине читает 地獄 (ᾅδης) и меняет порядок; следуем базе: сначала νῖκος, потом κέντρον."
  56: "κέντρον — とげ; δύναμις — 力."
  57: "νῖκος — 勝利; διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ — 主イエス・キリストによって."
  58: "ἑδραῖοι, ἀμετακίνητοι — しっかりと立ち、揺るがない; κόπος — 労苦; κενός — むだ."
