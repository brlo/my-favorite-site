verses:
  1: "ヤコブは、父[ちち]が寄留[きりゅう]した地[ち]、カナンの地[ち]に住[す]んでいた。"
  2: "これがヤコブの系図[けいず]である。ヨセフは十七歳[じゅうななさい]で、まだ幼[おさな]く、父[ちち]の妻[つま]であるビルハの子[こ]らやジルパの子[こ]らとともに、兄[あに]たちと羊[ひつじ]を飼[か]っていた。ヨセフは、彼[かれ]らの悪[わる]いうわさを父[ちち]イスラエルに伝[つた]えた。"
  3: "ヤコブは、ヨセフが自分[じぶん]の老[お]いの子[こ]であったので、すべての息子[むすこ]たち以上[いじょう]にヨセフを愛[あい]した。そして、彼[かれ]に色[いろ]とりどりの衣[ころも]を作[つく]った。"
  4: "兄[あに]たちは、父[ちち]がすべての息子[むすこ]たちのうちで彼[かれ]を愛[あい]しているのを見[み]て、彼[かれ]を憎[にく]み、彼[かれ]に平和[へいわ]な言葉[ことば]をひと言[ひとこと]も語[かた]ることができなかった。"
  5: "ヨセフは夢[ゆめ]を見[み]て、それを兄[あに]たちに告[つ]げた。"
  6: "彼[かれ]は言[い]った。「わたしが見[み]たこの夢[ゆめ]を聞[き]いてくれ。"
  7: "わたしたちが野[の]の真[ま]ん中[なか]で束[たば]を結[むす]んでいると、わたしの束[たば]が立[た]ち上[あ]がってまっすぐに立[た]った。すると、あなたがたの束[たば]が回[まわ]り寄[よ]って、わたしの束[たば]にひれ伏[ふ]した。」"
  8: "兄[あに]たちは彼[かれ]に言[い]った。「おまえは王[おう]としてわたしたちを治[おさ]めるのか。主人[しゅじん]としてわたしたちを支配[しはい]するのか。」そして、彼[かれ]の夢[ゆめ]のゆえに、また彼[かれ]の言葉[ことば]のゆえに、ますます彼[かれ]を憎[にく]んだ。"
  9: "彼[かれ]はまた別[べつ]の夢[ゆめ]を見[み]て、それを父[ちち]と兄[あに]たちに語[かた]り、言[い]った。「見[み]よ、わたしはまた別[べつ]の夢[ゆめ]を見[み]た。太陽[たいよう]と月[つき]と十一[じゅういち]の星[ほし]が、わたしにひれ伏[ふ]しているようだった。」"
  10: "父[ちち]は彼[かれ]を叱[しか]って言[い]った。「おまえが見[み]たこの夢[ゆめ]は何[なん]なのか。わたしも、あなたの母[はは]も、あなたの兄[あに]たちも、来[き]て、地[ち]にひれ伏[ふ]してあなたを拝[おが]むというのか。」"
  11: "兄[あに]たちは彼[かれ]をねたんだが、父[ちち]はこの言葉[ことば]を心[こころ]に留[と]めた。"
  12: "兄[あに]たちは、父[ちち]の羊[ひつじ]を飼[か]いに行[い]くため、シケムへ行[い]った。"
  13: "イスラエルはヨセフに言[い]った。「兄[あに]たちはシケムで羊[ひつじ]を飼[か]っていないか。さあ、あなたを彼[かれ]らのところへ遣[つか]わそう。」彼[かれ]は言[い]った。「わたしはここにいる。」"
  14: "イスラエルは彼[かれ]に言[い]った。「行[い]って、兄[あに]たちと羊[ひつじ]が無事[ぶじ]かどうか見[み]て、わたしに知[し]らせてくれ。」こうして彼[かれ]をヘブロンの谷[たに]から遣[つか]わした。ヨセフはシケムへ来[き]た。"
  15: "ある人[ひと]が、野[の]をさまよっている彼[かれ]を見[み]つけた。その人[ひと]は彼[かれ]に尋[たず]ねて言[い]った。「何[なに]を探[さが]しているのか。」"
  16: "彼[かれ]は言[い]った。「兄[あに]たちを探[さが]している。どこで羊[ひつじ]を飼[か]っているか、教[おし]えてくれ。」"
  17: "その人[ひと]は言[い]った。「彼[かれ]らはここを立[た]った。『ドタンへ行[い]こう』と言[い]っているのを聞[き]いたからだ。」ヨセフは兄[あに]たちの後[あと]を追[お]って行[い]き、ドタンで彼[かれ]らを見[み]つけた。"
  18: "彼[かれ]らは遠[とお]くから彼[かれ]を見[み]つけ、彼[かれ]が近[ちか]づく前[まえ]に、彼[かれ]を殺[ころ]そうと企[たくら]んだ。"
  19: "彼[かれ]らはそれぞれ、兄弟[きょうだい]に言[い]った。「見[み]よ、あの夢見[ゆめみ]る者[もの]が来[く]る。"
  20: "さあ、今[いま]、彼[かれ]を殺[ころ]して、穴[あな]の一[ひと]つに投[な]げ込[こ]もう。そして『悪[わる]い獣[けもの]が彼[かれ]を食[く]い尽[つ]くした』と言[い]おう。彼[かれ]の夢[ゆめ]がどうなるか、見[み]てやろう。」"
  21: "ルベンはこれを聞[き]いて、彼[かれ]を彼[かれ]らの手[て]から救[すく]い出[だ]し、言[い]った。「彼[かれ]を殺[ころ]してはならない。」"
  22: "ルベンは彼[かれ]らに言[い]った。「血[ち]を流[なが]してはならない。彼[かれ]をこの荒[あ]れ野[の]の穴[あな]に投[な]げ込[こ]め。手[て]をかけてはならない。」そう言[い]ったのは、彼[かれ]を彼[かれ]らの手[て]から救[すく]い出[だ]して、父[ちち]のもとへ返[かえ]すためであった。"
  23: "ヨセフが兄[あに]たちのところへ来[き]たとき、彼[かれ]らはヨセフの着[き]ている色[いろ]とりどりの衣[ころも]を脱[ぬ]がせた。"
  24: "そして彼[かれ]を取[と]って穴[あな]に投[な]げ込[こ]んだ。その穴[あな]は空[から]で、水[みず]がなかった。"
  25: "彼[かれ]らはパンを食[た]べるために座[すわ]った。目[め]を上[あ]げて見[み]ると、見[み]よ、ガラアドからイシュマエル人[じん]の隊商[たいしょう]が来[き]ていた。らくだは乳香[にゅうこう]、樹脂[じゅし]、没薬[もつやく]を積[つ]んでいた。彼[かれ]らはそれをエジプトへ運[はこ]び下[お]ろすところであった。"
  26: "ユダは兄弟[きょうだい]たちに言[い]った。「わたしたちの兄弟[きょうだい]を殺[ころ]して、その血[ち]を隠[かく]して、何[なん]の得[とく]になるのか。"
  27: "さあ、このイシュマエル人[じん]たちに彼[かれ]を売[う]ろう。わたしたちの手[て]を彼[かれ]にかけてはならない。彼[かれ]はわたしたちの兄弟[きょうだい]、わたしたちの肉[にく]だからだ。」兄弟[きょうだい]たちはこれを聞[き]き入[い]れた。"
  28: "マディア人[じん]の商人[しょうにん]たちが通[とお]りかかった。彼[かれ]らはヨセフを引[ひ]き上[あ]げて穴[あな]から出[だ]し、ヨセフをイシュマエル人[じん]たちに金貨[きんか]二十枚[にじゅうまい]で売[う]った。そしてヨセフをエジプトへ連[つ]れて行[い]った。"
  29: "ルベンは穴[あな]のところへ戻[もど]って来[き]たが、穴[あな]の中[なか]にヨセフがいないのを見[み]て、自分[じぶん]の衣[ころも]を裂[さ]いた。"
  30: "彼[かれ]は兄弟[きょうだい]たちのところへ戻[もど]って言[い]った。「あの子[こ]がいない。このわたしは、これからどこへ行[い]けばよいのか。」"
  31: "彼[かれ]らはヨセフの衣[ころも]を取[と]り、雄[お]やぎを殺[ころ]して、その血[ち]で衣[ころも]を汚[よご]した。"
  32: "彼[かれ]らは色[いろ]とりどりの衣[ころも]を送[おく]り、父[ちち]のもとへ持[も]って行[い]って言[い]った。「これをわたしたちは見[み]つけた。あなたの息子[むすこ]の衣[ころも]かどうか、よく見[み]てください。」"
  33: "彼[かれ]はそれを見[み]分[わ]けて言[い]った。「これはわたしの息子[むすこ]の衣[ころも]だ。悪[わる]い獣[けもの]が彼[かれ]を食[く]い尽[つ]くした。獣[けもの]がヨセフをさらって行[い]ったのだ。」"
  34: "ヤコブは自分[じぶん]の衣[ころも]を裂[さ]き、腰[こし]に粗布[あらぬの]をまとって、長[なが]い日々[ひび]、息子[むすこ]を嘆[なげ]き悲[かな]しんだ。"
  35: "息子[むすこ]たちも娘[むすめ]たちもみな集[あつ]まって、彼[かれ]を慰[なぐさ]めようとして来[き]たが、彼[かれ]は慰[なぐさ]められることを拒[こば]み、言[い]った。「わたしは嘆[なげ]きながら、息子[むすこ]のもとへ、陰府[いんぷ]へ下[くだ]って行[い]く。」こうして父[ちち]は彼[かれ]を泣[な]き悲[かな]しんだ。"
  36: "マディア人[じん]たちはヨセフをエジプトで、ファラオの廷臣[ていしん]で料理長[りょうりちょう]であるポティファルに売[う]った。"

notes:
  1: "Κατῴκει — 住んでいた (κατοικέω). οὗ παρῴκησεν ὁ πατὴρ αὐτοῦ — 父が寄留した (παροικέω — «жить пришельцем»; речь об Исааке, но в LXX имя не названо)."
  2: "αὗται αἱ γενέσεις Ιακωβ — これがヤコブの系図 (γένεσις — «происхождение»). δέκα ἑπτὰ ἐτῶν — 十七歳. ποιμαίνων — 飼っていた (ποιμαίνω — «пасти»). ὢν νέος — まだ幼く (νέος — «юный»). μετὰ τῶν υἱῶν Βαλλας καὶ Ζελφας — ビルハの子らやジルパの子らとともに (Балла и Зелфа — служанки-рабыни, ср. 30; Βαλλα — ビルハ, Ζελφα — ジルパ). κατήνεγκεν… ψόγον πονηρόν — 悪いうわさを伝えた (καταφέρω — «приносить»; ψόγος — «порицание, худая молва»). πρὸς Ισραηλ τὸν πατέρα αὐτῶν — 父イスラエルに (Израиль — имя Иакова). В csl «нанесоша на иосифа злу клевету» — понято наоборот; держимся греческого: Иосиф приносит отцу худую молву о братьях."
  3: "ἠγάπα παρὰ πάντας — すべての…以上に愛した (παρά + acc. — «более чем»). υἱὸς γήρους — 老いの子 (γῆρας — «старость»; поздний сын). χιτῶνα ποικίλον — 色とりどりの衣 (χιτών — «хитон, нижняя одежда»; ποικίλος — «пёстрый, разноцветный»). Это знаменитая «разноцветная одежда», а не верхняя накидка."
  4: "φιλεῖ — 愛している (φιλέω — «любить, быть привязанным»; ср. ἠγάπα в ст. 3 — два разных глагола, оба переданы «愛する»). ἐμίσησαν — 憎み. οὐκ ἐδύναντο λαλεῖν… οὐδὲν εἰρηνικόν — 平和な言葉をひと言も語ることができなかった (εἰρηνικός — «мирный»)."
  5: "Ἐνυπνιασθεὶς… ἐνύπνιον — 夢を見て (ἐνυπνιάζομαι — «видеть сон»; ἐνύπνιον — «сон»). ἀπήγγειλεν — 告げた. В ru добавлено «и они возненавидели его еще более» — этого нет в LXX (масоретское чтение), не переводим."
  6: "Ἀκούσατε τοῦ ἐνυπνίου τούτου — この夢を聞いてくれ (ἀκούω + gen. — «выслушать»)."
  7: "ᾤμην — わたしが…思った (οἴομαι — «думать, видеть во сне»). δεσμεύειν δράγματα — 束を結んで (δεσμεύω — «связывать»; δράγμα — «сноп»). ἀνέστη… καὶ ὠρθώθη — 立ち上がってまっすぐに立った (ὀρθόω — «выпрямлять»). περιστραφέντα — 回り寄って (περιστρέφω — «поворачивать»). προσεκύνησαν — ひれ伏した."
  8: "Μὴ βασιλεύων βασιλεύσεις… ἢ κυριεύων κυριεύσεις — 王として…治めるのか、主人として…支配するのか (повтор корня в греч. — усилительная конструкция; два разных глагола сохранены). προσέθεντο ἔτι μισεῖν — ますます憎んだ (προστίθημι — «прибавлять»). ἕνεκεν τῶν ἐνυπνίων… καὶ τῶν ῥημάτων — 夢のゆえに、また言葉のゆえに."
  9: "ἐνύπνιον ἕτερον — また別の夢. διηγήσατο — 語り (διηγέομαι — «рассказывать»). ὥσπερ — 〜のように. ἕνδεκα ἀστέρες — 十一の星."
  10: "ἐπετίμησεν — 叱って (ἐπιτιμάω — «запрещать, укорять»). ἆρά γε — 〜というのか (усиленный вопрос). ἐλθόντες ἐλευσόμεθα — 来て…ひれ伏すのか (повтор глагола в греч.). ἐπὶ τὴν γῆν — 地に伏して."
  11: "ἐζήλωσαν — 妬んだ (ζηλόω — «ревновать, завидовать»). διετήρησεν τὸ ῥῆμα — この言葉を心に留めた (διατηρέω — «соблюдать, сохранять»)."
  12: "βόσκειν τὰ πρόβατα — 羊を飼いに (βόσκω — «пасти»). εἰς Συχεμ — シケムへ."
  13: "Οὐχ οἱ ἀδελφοί σου ποιμαίνουσιν…; — 兄たちは…飼っていないか (вопрос с ожиданием «да»). δεῦρο ἀποστείλω σε — さあ、あなたを遣わそう. Ἰδοὺ ἐγώ — わたしはここにいる (формула готовности, букв. «вот я»)."
  14: "Πορευθεὶς ἰδέ — 行って見て (ὁράω — «видеть»). εἰ ὑγιαίνουσιν — 無事かどうか (ὑγιαίνω — «быть здоровым»). ἀνάγγειλόν μοι — わたしに知らせてくれ. ἐκ τῆς κοιλάδος τῆς Χεβρων — ヘブロンの谷から (κοιλάς — «долина»)."
  15: "πλανώμενον ἐν τῷ πεδίῳ — 野をさまよっている (πλανάω — «блуждать»). ἠρώτησεν — 尋ねて (ἐρωτάω). Τί ζητεῖς; — 何を探しているのか."
  16: "Τοὺς ἀδελφούς μου ζητῶ — 兄たちを探している. ποῦ βόσκουσιν — どこで羊を飼っているか."
  17: "Ἀπήρκασιν — 彼らは立ち去った (ἀπέρχομαι, perfect). Πορευθῶμεν εἰς Δωθαιμ — 『ドタンへ行こう』 (Δωθαΐμ — Дофан; слова братьев переданы вложенной цитатой 『…』). κατόπισθεν — 後を追って."
  18: "προεῖδον — 遠くから見つけ (προοράω — «видеть заранее, издали»). ἐπονηρεύοντο — 殺そうと企んだ (πονηρεύομαι — «замышлять злое»)."
  19: "ὁ ἐνυπνιαστής — あの夢見る者 (ἐνυπνιαστής — «сновидец», насмешливо; ср. 37:19 в евр. «בעל החלמות»). ἕκαστος πρὸς τὸν ἀδελφὸν αὐτοῦ — それぞれ兄弟に."
  20: "ἕνα τῶν λάκκων — 穴の一つに (λάκκος — «яма, ров, цистерна»). Θηρίον πονηρὸν κατέφαγεν αὐτόν — 『悪い獣が彼を食い尽くした』 (вложенная цитата — то, что братья скажут отцу). ὀψόμεθα, τί ἔσται — どうなるか見てやろう."
  21: "ἐξείλατο αὐτὸν ἐκ τῶν χειρῶν αὐτῶν — 彼を彼らの手から救い出し (ἐξαιρέω — «избавлять»). Οὐ πατάξομεν αὐτὸν εἰς ψυχήν — 彼を殺してはならない (букв. «не поразим его в душу», т. е. не покусимся на жизнь)."
  22: "Μὴ ἐκχέητε αἷμα — 血を流してはならない (ἐκχέω — «проливать»). ἐμβάλετε — 投げ込め. χεῖρα… μὴ ἐπενέγκητε — 手をかけてはならない (ἐπιφέρω — «налагать»). ὅπως ἐξέληται… καὶ ἀποδῷ — 救い出して返すため (ἀποδίδωμι — «возвращать»). В csl добавлено «(тщашеся бо)» — пояснение переводчика, в LXX нет."
  23: "ἐξέδυσαν — 脱がせた (ἐκδύω — «снимать одежду»). τὸν χιτῶνα τὸν ποικίλον τὸν περὶ αὐτὸν — 着ている色とりどりの衣 (περί — «на, вокруг»)."
  24: "ἔρριψαν εἰς τὸν λάκκον — 穴に投げ込んだ. κενός, ὕδωρ οὐκ εἶχεν — 空で、水がなかった (уточнение, важное для дальнейшего)."
  25: "Ἐκάθισαν φαγεῖν ἄρτον — パンを食べるために座った (ἄρτος — «хлеб»). ἀναβλέψαντες τοῖς ὀφθαλμοῖς — 目を上げて (букв. «подняв глаза»). ὁδοιπόροι Ισμαηλῖται — イシュマエル人の隊商 (ὁδοιπόρος — «путник»; 隊商 — караван). ἐκ Γαλααδ — ガラアドから. κάμηλοι — らくだ. θυμιάματα — 乳香 (θυμίαμα — «фимиам, ладан»). ῥητίνη — 樹脂 (смола, бальзам). στακτή — 没薬 (στακτή — «стакти», жидкая мирра). καταγαγεῖν εἰς Αἴγυπτον — エジプトへ運び下ろす (κατάγω — «сводить, привозить»)."
  26: "Τί χρήσιμον — 何の得になるのか (χρήσιμος — «полезный»). κρύψωμεν τὸ αἷμα — その血を隠して (т. е. скрыв убийство)."
  27: "ἀποδώμεθα — 売ろう (ἀποδίδωμι — «продавать»). αἱ χεῖρες ἡμῶν μὴ ἔστωσαν ἐπ᾽ αὐτόν — わたしたちの手を彼にかけてはならない. σὰρξ ἡμῶν — わたしたちの肉 (т. е. родной). ἤκουσαν — 聞き入れた."
  28: "παρεπορεύοντο οἱ ἄνθρωποι οἱ Μαδιηναῖοι οἱ ἔμποροι — マディア人の商人たちが通りかかった (Μαδιηναῖοι — мадианитяне; ἔμπορος — «купец»). ἐξείλκυσαν καὶ ἀνεβίβασαν — 引き上げて…出し (ἐξέλκω, ἀναβιβάζω). ἀπέδοντο… εἴκοσι χρυσῶν — 金貨二十枚で売った (χρυσοῦς — «золотая монета»; в ru «сребренников» — по масоретскому «кесит»). κατήγαγον εἰς Αἴγυπτον — エジプトへ連れて行った. Измаильтяне и мадианитяне чередуются в главе (25, 27, 28, 36) — это особенность текста, не сглаживаем."
  29: "ἀνέστρεψεν ἐπὶ τὸν λάκκον — 穴のところへ戻って来た (ἀναστρέφω — «возвращаться»). οὐχ ὁρᾷ — いないのを見て (историческое настоящее). διέρρηξεν τὰ ἱμάτια — 衣を裂いた (διαρρήγνυμι — «раздирать»; знак скорби)."
  30: "Τὸ παιδάριον οὐκ ἔστιν — あの子がいない (παιδάριον — «мальчик, отрок»). ποῦ πορεύομαι ἔτι; — これからどこへ行けばよいのか (букв. «куда мне идти ещё?»)."
  31: "ἔσφαξαν ἔριφον αἰγῶν — 雄やぎを屠って (σφάζω — «закалывать»; ἔριφος — «козлёнок»). ἐμόλυναν — 汚した (μολύνω — «пачкать, осквернять»)."
  32: "ἀπέστειλαν… καὶ εἰσήνεγκαν — 送り、持って来させて. ἐπίγνωθι — よく見てください (ἐπιγινώσκω — «узнавать»). εἰ… ἐστιν ἢ οὔ — 〜かどうか."
  33: "ἐπέγνω — 見分けて (ἐπιγινώσκω). θηρίον πονηρόν… θηρίον ἥρπασεν — 悪い獣が…獣がさらって行った (повтор сохранён; ἁρπάζω — «похищать»)."
  34: "διέρρηξεν τὰ ἱμάτια — 衣を裂き (знак скорби). ἐπέθετο σάκκον ἐπὶ τὴν ὀσφύν — 腰に粗布をまとって (σάκκος — «вретище», дерюга; ὀσφύς — «чресла»). ἐπένθει — 嘆き悲しんだ (πενθέω — «плакать, скорбеть»). ἡμέρας πολλάς — 長い日々."
  35: "συνήχθησαν — 集まって (συνάγω). παρακαλέσαι — 慰めようとして (παρακαλέω — «утешать»). οὐκ ἤθελεν παρακαλεῖσθαι — 慰められることを拒み. Καταβήσομαι… πενθῶν εἰς ᾅδου — 嘆きながら…陰府へ下って行く (ᾅδης — «преисподняя, шеол»; 陰府 — церковное слово для места умерших). ἔκλαυσεν αὐτὸν ὁ πατὴρ αὐτοῦ — 父は彼を泣き悲しんだ (в LXX «отец его» — Иаков)."
  36: "οἱ Μαδιηναῖοι — マディア人たち. τῷ Πετεφρη τῷ σπάδοντι Φαραω, ἀρχιμαγείρῳ — ファラオの廷臣で料理長であるポティファルに (Πετεφρής — Потифар; σπάδων — «евнух, придворный»; ἀρχιμάγειρος — букв. «начальник поваров»; в евр. «начальник телохранителей»)."
