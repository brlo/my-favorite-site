verses:
  1: "主[しゅ]は預言者[よげんしゃ]ナタンをダビデのもとへ遣[つか]わした。彼[かれ]はダビデのところへ入[はい]って言[い]った。「ある町[まち]に二人[ふたり]の男[おとこ]がいた。一人[ひとり]は富[と]みある者[もの]、もう一人は貧[まず]しい者であった。"
  2: "その富[と]みある者[もの]には、羊[ひつじ]の群[む]れと牛[うし]の群れが非常[ひじょう]に多[おお]くあった。"
  3: "しかし貧[まず]しい者[もの]には、一匹[いっぴき]の小[ちい]さな雌[め]の子羊[こひつじ]のほかは何[なに]もなかった。彼[かれ]はそれを買[か]い求[もと]め、育[やしな]って大[おお]きくし、自分[じぶん]と自分の子[こ]らとともに育[そだ]った。それは彼のパンを食[た]べ、彼の杯[さかずき]から飲[の]み、彼の懐[ふところ]で寝[ね]て、彼にとって娘[むすめ]のようであった。"
  4: "その富[と]みある者[もの]のところへ旅[たび]の人[ひと]が来[き]た。彼[かれ]は自分[じぶん]の群[む]れや牛[うし]の群れから取[と]って、来た旅人[たびびと]のために料理[りょうり]しようとはせず、貧[まず]しい者の雌[め]の子羊[こひつじ]を取って、自分のところへ来た人のために料理した。」"
  5: "ダビデはその男[おとこ]に激[はげ]しく怒[いか]り、ナタンに言[い]った。「主[しゅ]は生[い]きておられる。このことをした男は死[し]に値[あたい]する。"
  6: "また、その雌[め]の子羊[こひつじ]のために七倍[ななばい]の償[つぐな]いをすべきである。このことをしたからであり、それを惜[お]しまなかったからである。」"
  7: "ナタンはダビデに言[い]った。「あなたがその人[ひと]だ。イスラエルの神[かみ]、主[しゅ]はこう言われる。『わたしこそ、あなたに油[あぶら]を注[そそ]いでイスラエルの王[おう]とし、わたしこそ、あなたをサウルの手[て]から救[すく]い出[だ]した者[もの]である。"
  8: "わたしはあなたの主[あるじ]の家[いえ]と、あなたの主の妻[つま]たちをあなたの懐[ふところ]に与[あた]え、イスラエルとユダの家を与えた。もしそれが少[すく]ないなら、わたしはさらにこのようなものをあなたに加[くわ]えよう。"
  9: "なぜあなたは主[しゅ]の言葉[ことば]を蔑[さげす]み、その目[め]に悪[わる]いことをしたのか。あなたはヘテ人[じん]ウリヤを剣[つるぎ]で打[う]ち、その妻[つま]を自分[じぶん]の妻として取[と]り、彼[かれ]をアンモン人[じん]の剣で殺[ころ]した。"
  10: "今[いま]から後[のち]、剣[つるぎ]はいつまでもあなたの家[いえ]から離[はな]れない。あなたがわたしを蔑[さげす]み、ヘテ人[じん]ウリヤの妻[つま]を取[と]って自分[じぶん]の妻としたからである。"
  11: "主[しゅ]はこう言[い]われる。見[み]よ、わたしはあなたの家[いえ]からあなたに災[わざわ]いを起[お]こす。わたしはあなたの妻[つま]たちをあなたの目[め]の前[まえ]で取[と]り、あなたの隣人[りんじん]に与[あた]える。彼[かれ]はこの太陽[たいよう]の前であなたの妻たちと寝[ね]る。"
  12: "あなたは隠[かく]れてそれをしたが、わたしはこのことを全[ぜん]イスラエルの前[まえ]、この太陽[たいよう]の前で行[おこな]う。』」"
  13: "ダビデはナタンに言[い]った。「わたしは主[しゅ]に罪[つみ]を犯[おか]しました。」ナタンはダビデに言った。「主もまた、あなたの罪を取[と]り除[のぞ]かれました。あなたは死[し]にません。"
  14: "ただ、あなたはこの言葉[ことば]によって主[しゅ]の敵[てき]たちを激[はげ]しく怒[おこ]らせたので、あなたに生[う]まれた子[こ]は必[かなら]ず死[し]にます。」"
  15: "ナタンは自分[じぶん]の家[いえ]へ帰[かえ]った。主[しゅ]は、ウリヤの妻[つま]がダビデに産[う]んだ子[こ]を打[う]たれ、子は病[やまい]にかかった。"
  16: "ダビデはその子[こ]のために神[かみ]に願[ねが]い、断食[だんじき]をし、家[いえ]に入[はい]って、粗布[あらぬの]を着[き]て地[ち]の上[うえ]で夜[よる]を過[す]ごした。"
  17: "その家[いえ]の長老[ちょうろう]たちは、彼[かれ]を地[ち]から起[お]こそうとして彼のもとへ来[き]たが、彼は応[おう]じようとせず、彼らとともにパンを食[た]べなかった。"
  18: "七日目[なぬかめ]になって、その子[こ]は死[し]んだ。ダビデのしもべたちは、子が死んだことを彼[かれ]に告[つ]げるのを恐[おそ]れた。彼らは言[い]ったからである。「見[み]よ、子がまだ生[い]きていたとき、わたしたちが彼に語[かた]りかけても、わたしたちの声[こえ]を聞[き]かなかった。どうして、『子が死んだ』と彼に言えようか。彼は悪[わる]いことをするかもしれない。」"
  19: "ダビデは、しもべたちがひそひそ話[ばな]しをしているのに気[き]づき、子[こ]が死[し]んだことを悟[さと]った。ダビデはしもべたちに言[い]った。「子は死んだのか。」彼[かれ]らは言った。「死にました。」"
  20: "ダビデは地[ち]から起[お]き、身[み]を洗[あら]い、油[あぶら]を塗[ぬ]り、衣[ころも]を着替[きが]えて、神[かみ]の家[いえ]に入[はい]って礼拝[れいはい]した。それから自分[じぶん]の家に入り、パンを食[た]べることを求[もと]めると、彼[かれ]の前[まえ]にパンが置[お]かれ、彼は食べた。"
  21: "しもべたちは彼[かれ]に言[い]った。「あなたがしたこのことは何[なん]ですか。子[こ]がまだ生[い]きていたときは断食[だんじき]して泣[な]き、夜[よる]も眠[ねむ]らずにいたのに、子が死[し]ぬと、起[お]きてパンを食[た]べたのですか。」"
  22: "彼[かれ]は言[い]った。「子[こ]がまだ生[い]きている間[あいだ]、わたしは断食[だんじき]して泣[な]いた。『だれが知[し]っているだろう。主[しゅ]がわたしを憐[あわ]れみ、子が生きるかもしれない』と思[おも]ったからだ。"
  23: "しかし今[いま]、子[こ]は死[し]んだ。なぜわたしは断食[だんじき]するのか。わたしはもう、それを引[ひ]き返[かえ]すことができるだろうか。わたしは子のところへ行[い]くが、子はわたしのところへは帰[かえ]って来[こ]ない。」"
  24: "ダビデは自分[じぶん]の妻[つま]バテシバを慰[なぐさ]め、彼女[かのじょ]のところへ入[はい]って彼女と寝[ね]た。彼女は身[み]ごもって男[おとこ]の子[こ]を産[う]み、その名[な]をソロモンと呼[よ]んだ。主[しゅ]は彼を愛[あい]された。"
  25: "主[しゅ]は預言者[よげんしゃ]ナタンの手[て]によって人[ひと]を遣[つか]わし、主のゆえにその名[な]をイデディと呼[よ]ばせた。"
  26: "ヨアブはアンモン人[じん]のラバと戦[たたか]い、王[おう]の都[みやこ]を攻[せ]め取[と]った。"
  27: "ヨアブは使者[ししゃ]たちをダビデのもとへ遣[つか]わして言[い]った。「わたしはラバと戦[たたか]い、水[みず]の町[まち]を取[と]りました。"
  28: "今[いま]、残[のこ]りの民[たみ]を集[あつ]めて、この町[まち]に陣[じん]を敷[し]き、それを取[と]ってください。わたしがこの町を取って、わたしの名[な]がその上[うえ]に呼[よ]ばれることのないように。」"
  29: "ダビデは民[たみ]をすべて集[あつ]めてラバへ行[い]き、そこを攻[せ]めて取[と]った。"
  30: "彼[かれ]は彼らの王[おう]モルコムの冠[かんむり]をその頭[あたま]から取[と]った。その重[おも]さは金[きん]一タラントと貴[とうと]い石[いし]であった。それはダビデの頭に置[お]かれた。彼は町[まち]からの分捕[ぶんど]り物[もの]を非常[ひじょう]に多[おお]く持[も]ち出[だ]した。"
  31: "彼[かれ]はその中[なか]にいた民[たみ]を連[つ]れ出[だ]し、のこぎりや、鉄[てつ]の脱穀機[だっこくき]、鉄の斧[おの]の下[した]に置[お]き、れんが焼[や]き窯[がま]の中を通[とお]らせた。彼はアンモン人[じん]のすべての町々[まちまち]にも同[おな]じようにした。それからダビデと民は皆[みな]、エルサレムへ帰[かえ]った。"

notes:
  1: "ἀπέστειλεν κύριος τὸν Ναθαν τὸν προφήτην — послал Господь Нафана пророка. В csl в скобках добавлено «отвещай ми, царю, ныне суд сей» — редакционное дополнение, в LXX нет, в текст не внесено. Δύο ἦσαν ἄνδρες ἐν πόλει μιᾷ — два мужа были в одном городе. πλούσιος / πένης — богатый / бедный."
  2: "ποίμνια καὶ βουκόλια — стада мелкого и крупного скота (ποιμνίον, βουκόλιον). σφόδρα — весьма."
  3: "ἀμνὰς μία μικρά — одна маленькая овечка (ἀμνάς). ἐκτήσατο — приобрёл (κτάομαι). περιεποιήσατο — сберёг, выходил (περιποιέω). ἐξέθρεψεν — вскормил (ἐκτρέφω). ἡδρύνθη — выросла (ἁδρύνω). ἐπὶ τὸ αὐτό — вместе. ἐν τῷ κόλπῳ αὐτοῦ ἐκάθευδεν — спала на лоне его. ὡς θυγάτηρ — как дочь."
  4: "πάροδος — прохожий, странник; ὁδοιπόρος — путник. ἐφείσατο λαβεῖν — пощадил (не захотел) взять (φείδομαι). τοῦ ποιῆσαι τῷ ξένῳ — чтобы приготовить для гостя (ξένος). ἔλαβεν τὴν ἀμνάδα τοῦ πένητος — взял овечку бедного."
  5: "ἐθυμώθη ὀργῇ σφόδρα — воспламенился гневом весьма (θυμόω + ὀργή). Ζῇ κύριος — «жив Господь» (клятва). υἱὸς θανάτου — «сын смерти», т. е. достоин смерти."
  6: "ἀποτείσει ἑπταπλασίονα — заплатит семикратно (ἀποτίνω; ἑπταπλασίων). В ru «вчетверо» — по МТ; LXX и csl читают «семикратно». ἀνθ᾿ ὧν ὅτι — за то, что. ἐφείσατο — пощадил."
  7: "Σὺ εἶ ὁ ἀνήρ — «ты тот человек». Ἐγώ εἰμι ἔχρισά σε — «Я есмь помазавший тебя» (ἐγώ εἰμι усилительное). ἐρρυσάμην — избавил (ῥύομαι)."
  8: "τὸν οἶκον τοῦ κυρίου σου — дом господина твоего (Саула). τὰς γυναῖκας … ἐν τῷ κόλπῳ σου — жён его на лоно твоё. εἰ μικρόν ἐστιν, προσθήσω σοι κατὰ ταῦτα — если мало, прибавлю тебе по сему."
  9: "ἐφαύλισας — презрел (φαυλίζω). ἐν ὀφθαλμοῖς αὐτοῦ — в очах Его. ἐν ῥομφαίᾳ — мечом (ῥομφαία — большой меч). ἀπέκτεινας — убил (ἀποκτείνω)."
  10: "οὐκ ἀποστήσεται ῥομφαία … ἕως αἰῶνος — не отступит меч до века. ἐξουδένωσάς με — уничижил Меня (ἐξουδενόω). τοῦ εἶναί σοι εἰς γυναῖκα — чтобы была тебе женою."
  11: "ἐξεγείρω ἐπὶ σὲ κακά — воздвигну на тебя злое. κατ᾿ ὀφθαλμούς σου — пред глазами твоими. ἐναντίον τοῦ ἡλίου τούτου — пред этим солнцем."
  12: "κρυβῇ — тайно. ἐναντίον παντὸς Ισραηλ — пред всем Израилем. ἀπέναντι τούτου τοῦ ἡλίου — против этого солнца. В csl опечатка «глаголгол»."
  13: "Ἡμάρτηκα τῷ κυρίῳ — согрешил я пред Господом. παρεβίβασεν τὸ ἁμάρτημά σου — «переложил (снял) грех твой» (παραβιβάζω). οὐ μὴ ἀποθάνῃς — не умрёшь (усиленное отрицание)."
  14: "παροξύνων παρώξυνας — «раздражая раздражил» (παροξύνω, усилительное сочетание). τοὺς ἐχθροὺς κυρίου — врагов Господних. θανάτῳ ἀποθανεῖται — «смертью умрёт». В ru «подал повод врагам хулить» — иное понимание."
  15: "ἔθραυσεν κύριος τὸ παιδίον — сокрушил Господь ребёнка (θραύω). ἠρρώστησεν — заболел (ἀρρωστέω). παιδίον — дитя, ребёнок."
  16: "ἐζήτησεν τὸν θεόν — взыскал Бога (ζητέω). ἐνήστευσεν νηστείαν — «постился постом», усилительное сочетание (νηστεύω + νηστεία). ηὐλίσθη ἐν σάκκῳ ἐπὶ τῆς γῆς — провёл ночь во вретище на земле (αὐλίζομαι; σάκκος — 粗布, вретище)."
  17: "οἱ πρεσβύτεροι τοῦ οἴκου αὐτοῦ — старейшины дома его. τοῦ ἐγεῖραι αὐτὸν ἀπὸ τῆς γῆς — чтобы поднять его с земли. οὐ συνέφαγεν αὐτοῖς ἄρτον — не ел с ними хлеба."
  18: "τῇ ἡμέρᾳ τῇ ἑβδόμῃ — в седьмой день. ἐφοβήθησαν … ἀναγγεῖλαι — побоялись возвестить. εἰσήκουσεν τῆς φωνῆς — послушал голоса. ποιήσει κακά — сделает худое."
  19: "ψιθυρίζουσιν — шепчут (ψιθυρίζω). ἐνόησεν — уразумел (νοέω). Εἰ τέθνηκεν …; — «умер ли?» (εἰ в прямом вопросе)."
  20: "ἐλούσατο — омылся. ἠλείψατο — помазался (ἀλείφω). ἤλλαξεν τὰ ἱμάτια — переменил одежды. εἰς τὸν οἶκον τοῦ θεοῦ — в дом Божий. προσεκύνησεν — поклонился. ᾔτησεν ἄρτον φαγεῖν — попросил хлеба поесть."
  21: "ἕνεκα τοῦ παιδαρίου — ради ребёнка. ἐνήστευες καὶ ἔκλαιες καὶ ἠγρύπνεις — постился, плакал и бодрствовал (ἀγρυπνέω). ἡνίκα — когда. ἀνέστης καὶ ἔφαγες — встал и ел."
  22: "Τίς οἶδεν εἰ ἐλεήσει με κύριος — кто знает, помилует ли меня Господь (ἐλεάω). ζήσεται τὸ παιδάριον — будет живо дитя."
  23: "μὴ δυνήσομαι ἐπιστρέψαι αὐτὸ ἔτι — разве смогу возвратить его ещё. ἐγὼ πορεύσομαι πρὸς αὐτόν — я пойду к нему. αὐτὸς οὐκ ἀναστρέψει πρός με — он не возвратится ко мне."
  24: "παρεκάλεσεν — утешил (παρακαλέω). συνέλαβεν — зачала (συλλαμβάνω). ἐκάλεσεν τὸ ὄνομα αὐτοῦ Σαλωμων — нарёк (нарекла) имя ему Соломон; подлежащее в греч. не выражено (в ru «нарекла», в МТ — Давид), поэтому в переводе без подлежащего. ἠγάπησεν — возлюбил."
  25: "ἐν χειρὶ Ναθαν τοῦ προφήτου — рукою Нафана пророка; подлежащее — Господь (по контексту ст. 24). Ιδεδι — Иедиди(а), «возлюбленный Господом»; ἕνεκεν κυρίου — ради Господа (слав. «словом Господним»)."
  26: "ἐπολέμησεν ἐν Ραββαθ — воевал в Равве. κατέλαβεν τὴν πόλιν τῆς βασιλείας — овладел городом царства, т. е. царской столицей."
  27: "τὴν πόλιν τῶν ὑδάτων — «город вод», т. е. нижний город у источника."
  28: "συνάγαγε τὸ κατάλοιπον — собери остаток. παρέμβαλε ἐπὶ τὴν πόλιν — обложи (стань станом против) город. προκαταλαβοῦ — предвари, захвати прежде. ἵνα μὴ … κληθῇ τὸ ὄνομά μου ἐπ᾿ αὐτήν — чтобы не наречено было имя моё на нём."
  29: "συνήγαγεν … πάντα τὸν λαόν — собрал весь народ. ἐπολέμησεν ἐν αὐτῇ — воевал против неё. κατελάβετο — овладел."
  30: "τὸν στέφανον Μελχολ τοῦ βασιλέως αὐτῶν — венец Мелхола, царя их; в csl «молхома» (Молхом, Милком — бог аммонитян), принято csl. σταθμὸς αὐτοῦ τάλαντον χρυσίου — вес его талант золота; λίθου τιμίου — камня драгоценного. σκῦλα — добыча, трофеи."
  31: "ἐξήγαγεν — вывел. ἔθηκεν ἐν τῷ πρίονι — положил под пилу (πρίων); ἐν τοῖς τριβόλοις τοῖς σιδηροῖς — под железные молотильные доски (τρίβολος); διήγαγεν διὰ τοῦ πλινθείου — провёл через кирпичное производство (πλινθεῖον). В csl добавлено «секиры железны» (топоры) — в LXX нет, внесено в текст по паритету. ἐπέστρεψεν … εἰς Ιερουσαλημ — возвратился в Иерусалим."
