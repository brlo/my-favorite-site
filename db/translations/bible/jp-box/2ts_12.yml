# jp-box, 2-я Царств, глава 12. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); второй свидетель — церковнославянский
# (csl-ru); ru (Синодальный) — только для понимания, не источник. jp-joc и jp-ni в книге нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 12: притча Нафана (1–4), гнев Давида (5–6), «ты — тот человек» и обличение (7–12),
# покаяние и прощение (13), смерть ребёнка (14–23), Соломон (24–25), взятие Раввы (26–31).
# Речи — 「…」: Нафан (1–4, 7–12, 13), Давид (5–6, 13, 22–23), слуги (21),
# Иоав через посланных (27), Давид посланному (25). Слова Бога — 『…』 (7–12), вложенные
# слова Давида в притче не цитируются. Красного нет: прямая речь Христа во плоти не здесь.
