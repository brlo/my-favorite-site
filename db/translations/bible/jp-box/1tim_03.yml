# jp-box, 1-е Послание к Тимофею, глава 3. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 3: «верно слово» о епископстве (1), требования к епископу (2–7), требования
# к диаконам и к женщинам при них (8–13), цель послания и дом Божий (14–15),
# ключевой стих — «великая тайна благочестия» (16), церковное чтение.
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет,
# <j>/<mo> не ставятся.
# 〔…〕 одно — 3:3 〔不正な利を求めず〕: церковное μὴ αἰσχροκερδῆ (Елизаветинская
# «не мшелоимцу»; слав. «не мшелоимцу»; jp-joc 汚利を圖らず). В gr-lxx-byz 3:3
# этого слова нет — проверено запросом к базе; в 3:8 то же αἰσχροκερδεῖς в базе
# есть, поэтому там без скобок. В 3:5 весь стих в критическом издании стоит
# в квадратных скобках, но в базе он есть — 〔…〕 не ставятся.
# 3:16 — ключевой стих: в базе Ὃς ἐφανερώθη, церковное чтение θεὸς ἐφανερώθη
# (Елизаветинская «Бог явися во плоти»; jp-joc 神は肉體に顯れ). По базе проверено:
# θεός в 3:16 НЕТ, ἐφανερώθη ЕСТЬ. Подлежащее передано относительным ὃς —
# その方は; 神は не добавлено, иначе понадобились бы 〔…〕; 〔…〕 в стихе нет. 霊[れい] —
# πνεῦμα без ἅγιον, поэтому не 聖霊 и не пара {聖霊|聖神}.
# Сносок ⟨…⟩ нет: 監督, 執事, 奥義, 敬虔, 良心 уже встречались в корпусе
# (Деян 20:28; Флп 1:1; Еф 1:9) и пояснены при первом упоминании.
# jp-ni не использовался.

tr_code: jp-box
book: 1tim
chapter: 3
draft: true

verses:
  1: "この言葉[ことば]は真実[しんじつ]である。もし人[ひと]が監督[かんとく]の職[しょく]を望[のぞ]むなら、それは善[よ]い働[はたら]きを望[のぞ]んでいるのである。"
  2: "だから、監督[かんとく]は、非難[ひなん]されるところのない者[もの]、ひとりの妻[つま]の夫[おっと]、節制[せっせい]する者[もの]、慎[つつ]み深[ぶか]い者[もの]、端正[たんせい]な者[もの]、旅[たび]の人[ひと]を迎[むか]え入[い]れる者[もの]、教[おし]える力[ちから]のある者[もの]でなければならない。"
  3: "ぶどう酒[さけ]にふけらず、人[ひと]を打[う]たず、〔不正[ふせい]な利[り]を求[もと]めず〕、寛容[かんよう]で、争[あらそ]いを好[この]まず、金銭[きんせん]を愛[あい]さない者[もの]でなければならない。"
  4: "自分[じぶん]の家[いえ]をよく治[おさ]め、すべての品位[ひんい]をもって子[こ]どもを従順[じゅうじゅん]に服[ふく]させる者[もの]でなければならない。"
  5: "もし人[ひと]が自分[じぶん]の家[いえ]を治[おさ]めることを知[し]らないなら、どうして神[かみ]の教会[きょうかい]を世話[せわ]することができようか。"
  6: "新[あら]たに信仰[しんこう]に入[はい]った者[もの]であってはならない。高慢[こうまん]になって、悪魔[あくま]の裁[さば]きに陥[おちい]らないためである。"
  7: "また、外[そと]の人[ひと]たちからも善[よ]い証[あかし]を受[う]けている者[もの]でなければならない。非難[ひなん]され、悪魔[あくま]の罠[わな]に陥[おちい]らないためである。"
  8: "同[おな]じように、執事[しつじ]たちも品位[ひんい]のある者[もの]、二枚舌[にまいじた]でない者[もの]、多[おお]くのぶどう酒[さけ]にふけらない者[もの]、不正[ふせい]な利[り]を求[もと]めない者[もの]でなければならない。"
  9: "信仰[しんこう]の奥義[おうぎ]を、清[きよ]い良心[りょうしん]のうちに保[たも]つ者[もの]でなければならない。"
  10: "また、この人[ひと]たちもまず試[ため]され、非[ひ]の責[せ]めのない者[もの]と認[みと]められたなら、執事[しつじ]の務[つと]めに就[つ]くように。"
  11: "女[おんな]たちも同[おな]じように、品位[ひんい]のある者[もの]、中傷[ちゅうしょう]する者[もの]でなく、節制[せっせい]する者[もの]、すべてのことにおいて忠実[ちゅうじつ]な者[もの]でなければならない。"
  12: "執事[しつじ]は、ひとりの妻[つま]の夫[おっと]であり、子[こ]どもと自分[じぶん]の家[いえ]とをよく治[おさ]める者[もの]でなければならない。"
  13: "よく務[つと]めを果[は]たした者[もの]は、自分[じぶん]のために善[よ]い地歩[ちほ]と、キリスト・イエスにある信仰[しんこう]における大[おお]きな大胆[だいたん]さとを得[え]るのである。"
  14: "わたしは、あなたのもとへ間[ま]もなく行[い]くことを望[のぞ]みつつ、これらのことをあなたに書[か]いている。"
  15: "もし遅[おく]れるなら、あなたが、神[かみ]の家[いえ]のうちで、どのように過[す]ごすべきかを知[し]るためである。神[かみ]の家[いえ]とは、生[い]ける神[かみ]の教会[きょうかい]、真理[しんり]の柱[はしら]と土台[どだい]である。"
  16: "確[たし]かに、敬虔[けいけん]の奥義[おうぎ]は大[おお]きい。その方[かた]は、肉[にく]において現[あらわ]れ、霊[れい]において義[ぎ]とされ、天使[てんし]たちに現[あらわ]れ、諸国[しょこく]に宣[の]べ伝[つた]えられ、世[よ]で信[しん]じられ、栄光[えいこう]のうちに上[あ]げられた。"

notes:
  1: "Πιστὸς ὁ λόγος — この言葉は真実である: та же формула, что 1:15 (1:15; 3:1; 4:9; 2 Тим 2:11; Тит 3:8). εἴ τις ἐπισκοπῆς ὀρέγεται — もし人が監督の職を望むなら (ἐπισκοπή — «надзор, епископство»; ὀρέγομαι — «стремиться», ср. 6:10). καλοῦ ἔργου ἐπιθυμεῖ — 善い働きを望んでいる (ἔργον — «дело», а не сан; не сглажено в «хочет быть епископом»)."
  2: "δεῖ οὖν τὸν ἐπίσκοπον — だから、監督は…でなければならない (ἐπίσκοπος — 監督[かんとく], как в Деян 20:28; Флп 1:1). ἀνεπίλημπτον — 非難されるところのない者 (ἀνεπίλημπτος — «неуязвимый для обвинения», ср. 5:7; 6:14). μιᾶς γυναικὸς ἄνδρα — ひとりの妻の夫. νηφάλιον, σώφρονα, κόσμιον — 節制する者、慎み深い者、端正な者 (три разных слова не сведены; σώφρων — «целомудренный, рассудительный»). φιλόξενον — 旅の人を迎え入れる者 (φιλοξενία, ср. Рим 12:13). διδακτικόν — 教える力のある者 (διδακτικός, ср. 2 Тим 2:24)."
  3: "μὴ πάροινον — ぶどう酒にふけらず (πάροινος — «пристрастный к вину»). μὴ πλήκτην — 人を打たず (πλήκτης — «драчун»). ἀλλὰ ἐπιεικῆ — 寛容で (ἐπιεικής — «уступчивый, кроткий», ср. Флп 4:5). ἄμαχον — 争いを好まず (ἄμαχος — hapax). ἀφιλάργυρον — 金銭を愛さない者 (φιλάργυρος, ср. 6:10; Евр 13:5). 〔不正な利を求めず〕: церковное чтение μὴ αἰσχροκερδῆ (Елизаветинская «не мшелоимцу»; jp-joc 汚利を圖らず). В gr-lxx-byz 3:3 этого слова нет — проверено, поэтому 〔…〕; в 3:8 то же αἰσχροκερδεῖς в базе есть — там без скобок."
  4: "τοῦ ἰδίου οἴκου καλῶς προϊστάμενον — 自分の家をよく治め (προΐσταμαι — «стоять во главе», ср. 5:17; Рим 12:8). τέκνα ἔχοντα ἐν ὑποταγῇ — 子どもを従順に服させる (ἔχοντα — «имея», не «держа»). μετὰ πάσης σεμνότητος — すべての品位をもって (σεμνότης, как в 2:2; σεμνός — в 3:8,11)."
  5: "εἰ δέ τις τοῦ ἰδίου οἴκου προστῆναι οὐκ οἶδεν — もし人が自分の家を治めることを知らないなら. πῶς ἐκκλησίας θεοῦ ἐπιμελήσεται — どうして神の教会を世話することができようか (ἐπιμελέομαι — «заботиться»; риторический вопрос). Весь стих в критическом издании в квадратных скобках, но в базе он есть — 〔…〕 не ставятся."
  6: "μὴ νεόφυτον — 新たに信仰に入った者であってはならない (νεόφυτος — «новонасаждённый», hapax в НЗ; ср. 1 Кор 3:6). ἵνα μὴ τυφωθεὶς — 高慢になって (τυφόω — «ослепляться, надмеваться», ср. 6:4; 2 Тим 3:4). εἰς κρίμα ἐμπέσῃ τοῦ διαβόλου — 悪魔の裁きに陥らないため (род. падеж двусмыслен: «осуждение, которому подвергся дьявол» или «судилище дьявола»; по-японски 悪魔の裁き двусмысленность сохраняет, не уточнено)."
  7: "δεῖ δὲ καὶ μαρτυρίαν καλὴν ἔχειν ἀπὸ τῶν ἔξωθεν — また、外の人たちからも善い証を受けている者でなければならない (οἱ ἔξωθεν — «внешние», ср. 1 Кор 5:12; Кол 4:5; μαρτυρία — 証[あかし]). ἵνα μὴ εἰς ὀνειδισμὸν ἐμπέσῃ — 非難され (ὀνειδισμός — «порицание»). παγίδα τοῦ διαβόλου — 悪魔の罠 (παγίς — 罠[わな], ср. 6:9; 2 Тим 2:26)."
  8: "Διακόνους ὡσαύτως — 同じように、執事たちも (διάκονος — 執事[しつじ], как в Флп 1:1). σεμνούς — 品位のある者. μὴ διλόγους — 二枚舌でない者 (δίλογος — hapax, «говорящий по-разному»). μὴ οἴνῳ πολλῷ προσέχοντας — 多くのぶどう酒にふけらない者 (ср. 3:3; Тит 2:3). μὴ αἰσχροκερδεῖς — 不正な利を求めない者: в базе есть, поэтому без 〔…〕 (ср. ст. 3)."
  9: "ἔχοντας τὸ μυστήριον τῆς πίστεως ἐν καθαρᾷ συνειδήσει — 信仰の奥義を、清い良心のうちに保つ者 (μυστήριον — 奥義[おうぎ], ср. Еф 1:9; 3:3; συνείδησις — 良心[りょうしん], как в 1:5,19)."
  10: "καὶ οὗτοι δὲ δοκιμαζέσθωσαν πρῶτον — この人たちもまず試され (δοκιμάζω — «испытывать», ср. 1 Пет 1:7). εἶτα διακονείτωσαν — 執事の務めに就くように. ἀνέγκλητοι ὄντες — 非の責めのない者と認められたなら (ἀνέγκλητος, ср. Кол 1:22; Тит 1:6)."
  11: "γυναῖκας ὡσαύτως — 女たちも同じように: γυναῖκας может значить и «жёны диаконов», и «диакониссы»; в японском оставлено 女たち, без уточнения. σεμνάς — 品位のある者. μὴ διαβόλους — 中傷する者でなく (διάβολος здесь — «клеветник», не 悪魔). νηφαλίους — 節制する者 (как в 3:2). πιστὰς ἐν πᾶσιν — すべてのことにおいて忠実な者."
  12: "διάκονοι ἔστωσαν μιᾶς γυναικὸς ἄνδρες — 執事は、ひとりの妻の夫であり. τέκνων καλῶς προϊστάμενοι καὶ τῶν ἰδίων οἴκων — 子どもと自分の家とをよく治める者 (как ст. 4; порядок греч. сохранён)."
  13: "οἱ γὰρ καλῶς διακονήσαντες — よく務めを果たした者は. βαθμὸν ἑαυτοῖς καλὸν περιποιοῦνται — 自分のために善い地歩を得る (βαθμός — «ступень, положение»; περιποιέομαι — «приобретать», ср. Деян 20:28). πολλὴν παρρησίαν ἐν πίστει τῇ ἐν Χριστῷ Ἰησοῦ — キリスト・イエスにある信仰における大きな大胆さ (παρρησία — 大胆さ, как в корпусе)."
  14: "Ταῦτά σοι γράφω — これらのことをあなたに書いている. ἐλπίζων ἐλθεῖν πρὸς σὲ τάχιον — あなたのもとへ間もなく行くことを望みつつ (τάχιον — сравн. степень, «скорее»)."
  15: "ἐὰν δὲ βραδύνω — もし遅れるなら (βραδύνω — «медлить», ср. 2 Пет 3:9). ἵνα εἰδῇς πῶς δεῖ ἐν οἴκῳ θεοῦ ἀναστρέφεσθαι — どのように過ごすべきかを知るため (ἀναστρέφομαι — «вести себя, обращаться»; ср. 2 Кор 1:12, Еф 4:22 ἀναστροφή). ἥτις ἐστὶν ἐκκλησία θεοῦ ζῶντος — 生ける神の教会 (ἥτις — «которая есть»). στῦλος καὶ ἑδραίωμα τῆς ἀληθείας — 真理の柱と土台 (στῦλος — 柱[はしら]; ἑδραίωμα — hapax, «утверждение, опора», ср. 1 Кор 15:58 ἑδραῖος)."
  16: "ὁμολογουμένως — 確かに (наречие: «по общему признанию»). τὸ τῆς εὐσεβείας μυστήριον — 敬虔の奥義 (εὐσέβεια — 敬虔[けいけん]; μυστήριον — 奥義[おうぎ]). Ὃς ἐφανερώθη ἐν σαρκί — 肉において現れ: в базе относительное ὃς (критическое чтение), церковное — θεός («Бог явился во плоти»; Елизаветинская «Бог явися во плоти»; jp-joc 神は肉體に顯れ). Проверено по базе: θεός в 3:16 НЕТ, ἐφανερώθη ЕСТЬ. Подлежащее передано относительным ὃς — その方[かた]は; 神は не добавлено, иначе понадобились бы 〔…〕 (в базе θεός нет). ἐδικαιώθη ἐν πνεύματι — 霊において義とされ (πνεῦμα без ἅγιον, поэтому 霊[れい], не 聖霊). ὤφθη ἀγγέλοις — 天使たちに現れ. ἐκηρύχθη ἐν ἔθνεσιν — 諸国に宣べ伝えられ (ἔθνη — 諸国[しょこく]; κηρύσσω — 宣べ伝える). ἐπιστεύθη ἐν κόσμῳ — 世で信じられ. ἀνελήμφθη ἐν δόξῃ — 栄光のうちに上げられた (ἀναλαμβάνω — «вознести», ср. Деян 1:2,11,22; Мк 16:19)."
