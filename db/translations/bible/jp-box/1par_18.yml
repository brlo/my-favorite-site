# jp-box, 1-я Паралипоменон, глава 18. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); по паритету csl-ru — второй свидетель церковного
# текста: его чтения и добавления входят в основной текст без 〔…〕, отличия LXX — в notes.
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет,
# jp-ni (943 стиха, под авторским правом) источником не был.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 18: победы Давида — филистимляне (1), Моав (2), Адраазар и Сирия (3–8),
# Фой и посвящение добычи (9–11), Авесса и Едом (12–13), чиновники Давида (14–17).
# Параллель — 2 Цар 8; отличия (нет эпизода с Сусакимом, нет измерения моавитян,
# Авесса вместо Давида, «долина Соляная» вместо Гаймеле) оговорены в notes.
# Прямой речи нет, всё повествование. Красного нет.
# 〔…〕 нет. csl-добавление внесено: 18:11 «вся сосуды златыя и сребряныя и медяныя»
# (в LXX они стоят в конце 18:10; в csl отнесены к 11) — принято csl.
# Сносок ⟨…⟩ нет: ペリシテ人, シリア人, エドム人, モアブ人, アンモン人, 戦車, 騎兵,
# 青銅, 祭司, 門衛 уже в корпусе.
# Отличия LXX/csl: 18:8 греч. μεταβηχας, слав. «Метавеф» (в 2 Цар 8:8 Μασβακ);
# 18:10 слав. «Адурам» (в 2 Цар 8:10 Ιεδδουραν); 18:12 долина Соляная (в 2 Цар 8:13
# Γαιμελε); 18:16 Σουσα (в 2 Цар 8:17 Ασα); 18:17 διάδοχοι (в 2 Цар 8:18 αὐλάρχαι).
# jp-ni не использовался.

tr_code: jp-box
book: 1par
chapter: 18
draft: true

verses:
  1: "その後[のち]、ダビデはペリシテ人[じん]を撃[う]って従[したが]え、ペリシテ人の手[て]からゲトとその村々[むらむら]を取[と]った。"
  2: "ダビデはモアブを撃[う]ち、モアブはダビデのしもべとなって貢[みつ]ぎ物[もの]を納[おさ]めた。"
  3: "ダビデは、ユーフラテス川[がわ]に手[て]を及[およ]ぼそうとして出[で]て行[い]くスバの王[おう]アドラアザルを、ハマトで撃[う]った。"
  4: "ダビデは彼[かれ]から戦車[せんしゃ]一千[いっせん]、騎兵[きへい]七千[ななせん]、歩兵[ほへい]二万[にまん]を取[と]り、戦車をすべて壊[こわ]して、そのうち百[ひゃく]だけを残[のこ]した。"
  5: "ダマスコのシリア人[じん]が、スバの王アドラアザルを助[たす]けに来[き]た。ダビデはシリア人の二万二千人[にまんにせんにん]を撃った。"
  6: "ダビデはダマスコ方面[ほうめん]のシリアに守備隊[しゅびたい]を置[お]き、シリア人はダビデのしもべとなって貢ぎ物を納めた。主[しゅ]はダビデが行[い]くすべての所[ところ]で彼[かれ]を救[すく]われた。"
  7: "ダビデは、アドラアザルのしもべたちが身[み]に着[つ]けていた金[きん]の腕輪[うでわ]を取[と]って、エルサレムに持[も]って来[き]た。"
  8: "ダビデはまた、メタベハから、またアドラアザルの選[えら]ばれた町々[まちまち]から、非常[ひじょう]に多[おお]くの青銅[せいどう]を取った。ソロモンはそれで青銅の海[うみ]、柱[はしら]、青銅の器[うつわ]を作[つく]った。"
  9: "ハマトの王[おう]トアは、ダビデがスバの王アドラアザルのすべての軍勢[ぐんぜい]を撃ったことを聞[き]いた。"
  10: "トアは息子[むすこ]イドゥラムをダビデ王[おう]のもとへ遣[つか]わし、彼[かれ]の安否[あんぴ]を問[と]わせ、アドラアザルと戦[たたか]って彼を撃ったことを祝[いわ]わせた。アドラアザルはトアと敵対[てきたい]していたからである。"
  11: "ダビデ王[おう]は、これらの金[きん]、銀[ぎん]、青銅[せいどう]のすべての器を、すべての民[たみ]から、すなわちエドム、モアブ、アンモン人[じん]、ペリシテ人[じん]、アマレクから取った銀や金とともに、主[しゅ]に聖別[せいべつ]した。"
  12: "サルヤの子[こ]アベシャは、塩[しお]の谷[たに]でエドム人[じん]一万八千人[いちまんはっせんにん]を撃[う]った。"
  13: "ダビデはその谷[たに]に守備隊[しゅびたい]を置[お]き、エドム人[じん]はすべてダビデのしもべとなった。主[しゅ]はダビデが行[い]くすべての所で彼を救われた。"
  14: "ダビデはイスラエルをすべて治[おさ]め、民[たみ]すべてに裁[さば]きと正義[せいぎ]を行[おこな]った。"
  15: "サルヤの子[こ]ヨアブは軍勢[ぐんぜい]の長[ちょう]、アヒルドの子[こ]ヨシャファトは記録係[きろくがかり]であった。"
  16: "アヒトブの子[こ]サドクとアビアタルの子[こ]アヒメレクは祭司[さいし]、スサは書記[しょき]であった。"
  17: "ヨヤダの子[こ]ベナヤはケレテ人[じん]とペレテ人[じん]の上[うえ]にいた。ダビデの子[こ]たちは、王[おう]に次[つ]ぐ者[もの]たちであった。"

notes:
  1: "μετὰ ταῦτα — после сего. ἐπάταξεν τοὺς ἀλλοφύλους — поразил иноплеменников (ペリシテ人). ἐτροπώσατο — обратил в бегство. ἔλαβεν τὴν Γεθ καὶ τὰς κώμας αὐτῆς — взял Геф и селения его (ゲト, 村々). ἐκ χειρὸς ἀλλοφύλων — из руки иноплеменников."
  2: "ἐπάταξεν τὴν Μωαβ — поразил Моав. ἦσαν … παῖδες τῷ Δαυιδ φέροντες δῶρα — стали рабами Давиду, приносящими дары (貢ぎ物). В 2 Цар 8:2 добавлено измерение верёвками — в 1 Пар опущено."
  3: "Αδρααζαρ βασιλέα Σουβα Ημαθ — Адраазар, царь Сувский, [в] Имафе (ハマト; Ημαθ — местный падеж). πορευομένου αὐτοῦ ἐπιστῆσαι χεῖρα αὐτοῦ ἐπὶ ποταμὸν Εὐφράτην — когда он шёл поставить руку свою на реку Евфрат, т. е. утвердить власть (ユーフラテス川). В 2 Цар 8:3 добавлено «сын Раава» — здесь нет."
  4: "προκατελάβετο — захватил (προκαταλαμβάνω). χίλια ἅρματα — тысяча колесниц (戦車). ἑπτὰ χιλιάδας ἵππων — семь тысяч коней (в 2 Цар 8:4 ἱππέων — всадников). εἴκοσι χιλιάδας ἀνδρῶν πεζῶν — двадцать тысяч пеших (歩兵). παρέλυσεν — разрушил, парализовал. ὑπελίπετο … ἑκατὸν ἅρματα — оставил из них сто колесниц."
  5: "Σύρος ἐκ Δαμασκοῦ — Сирия Дамасская (ダマスコのシリア人). βοηθῆσαι — помочь. ἐπάταξεν ἐν τῷ Σύρῳ — поразил у Сирийца (собирательно). εἴκοσι καὶ δύο χιλιάδας — двадцать две тысячи."
  6: "ἔθετο φρουράν — поставил стражу, гарнизон (守備隊). ἐν Συρίᾳ τῇ κατὰ Δαμασκόν — в Сирии, что при Дамаске (方面). εἰς παῖδας φέροντας δῶρα — в рабов, приносящих дары. ἔσῳζεν — спасал, сохранял."
  7: "κλοιοὺς τοὺς χρυσοῦς — золотые обручи, гривны (χλιδών; 腕輪). οἳ ἦσαν ἐπὶ τοὺς παῖδας Αδρααζαρ — которые были на отроках Адраазара. ἤνεγκεν … εἰς Ιερουσαλημ — принёс в Иерусалим. В 2 Цар 8:7 добавлен рассказ о Сусакиме — здесь его нет."
  8: "ἐκ τῆς μεταβηχας — из Метабехи (тёмное место; в csl «Метавеф», в 2 Цар 8:8 Μασβακ / Метевак, в ru «Тивхава»); передано メタベハ. ἐκ τῶν ἐκλεκτῶν πόλεων — из избранных городов. χαλκὸν πολὺν σφόδρα — меди весьма много (青銅). θάλασσαν τὴν χαλκῆν — медное море (青銅の海). στύλους — столпы. σκεύη τὰ χαλκᾶ — медные сосуды; в 2 Цар 8:8 λουτῆρας — умывальницы."
  9: "Θωα βασιλεὺς Ημαθ — Фой, царь Имафа (トア; в csl «Фоа», в 2 Цар 8:9 Θοου — トイ). πᾶσαν τὴν δύναμιν — всё войско."
  10: "Ιδουραμ υἱὸν αὐτοῦ — Идурам, сын его (イドゥラム; в csl «Адурам», в ru «Иорам», в 2 Цар 8:10 Ιεδδουραν — イェドゥラン). ἐρωτῆσαι τὰ εἰς εἰρήνην — спросить о мире, приветствовать (安否を問う). εὐλογῆσαι — благословить, здесь поздравить. ἀνὴρ πολέμιος — человек воинственный, противник. Конец стиха в LXX: καὶ πάντα τὰ σκεύη ἀργυρᾶ καὶ χρυσᾶ — и все сосуды серебряные и золотые; в csl они отнесены к 11 — принято csl."
  11: "ἡγίασεν — освятил, посвятил (聖別). μετὰ τοῦ ἀργυρίου καὶ τοῦ χρυσίου — вместе с серебром и золотом. ἐκ πάντων τῶν ἐθνῶν — от всех народов. ἐξ Ιδουμαίας — из Идумеи (エドム), Μωαβ — Моава, υἱῶν Αμμων — сынов Аммона, ἀλλοφύλων — иноплеменников, Αμαληκ — Амалика. csl в начале добавляет «вся сосуды златыя и сребряныя и медяныя» — внесено 金、銀、青銅のすべての器."
  12: "Αβεσσα υἱὸς Σαρουια — Авесса, сын Саруи (アベシャ). ἐπάταξεν τὴν Ιδουμαίαν — поразил Идумею. ἐν κοιλάδι τῶν ἁλῶν — в долине соли (塩の谷). ὀκτὼ καὶ δέκα χιλιάδας — восемнадцать тысяч. В 2 Цар 8:13 это приписано Давиду и названо Γαιμελε — здесь Авесса и «долина Соляная»."
  13: "ἔθετο … φρουράς — поставил гарнизоны (φρουρά). ἐν τῇ κοιλάδι — в долине. ἦσαν πάντες οἱ Ιδουμαῖοι παῖδες Δαυιδ — все идумеи стали рабами Давиду. ἔσῳζεν κύριος — спасал Господь."
  14: "ἐβασίλευσεν … ἐπὶ πάντα Ισραηλ — воцарился над всем Израилем. ποιῶν κρίμα καὶ δικαιοσύνην — творя суд и правду (正義). τῷ παντὶ λαῷ αὐτοῦ — всему народу своему."
  15: "Ιωαβ υἱὸς Σαρουια ἐπὶ τῆς στρατιᾶς — Иоав, сын Саруи, над войском. Ιωσαφατ υἱὸς Αχιλουδ — Иосафат, сын Ахилуда (アヒルド; в 2 Цар 8:16 Αχια — Ахия). ὑπομνηματογράφος — дееписатель, летописец (記録係)."
  16: "Σαδωκ υἱὸς Αχιτωβ — Садок, сын Ахитова (アヒトブ). Αχιμελεχ υἱὸς Αβιαθαρ — Ахимелех, сын Авиафара (アビアタル). ἱερεῖς — священники. Σουσα γραμματεύς — Суса, книжник (スサ, 書記; в 2 Цар 8:17 Ασα — Аса)."
  17: "Βαναιας υἱὸς Ιωδαε — Ванея, сын Иодая (ヨヤダ). ἐπὶ τοῦ χερεθθι καὶ τοῦ φελεθθι — над Херефеями и Фелефеями, т. е. керетеями и пелетеями (ケレテ人とペレテ人). υἱοὶ Δαυιδ οἱ πρῶτοι διάδοχοι τοῦ βασιλέως — сыны Давида, первые преемники царя (διάδοχος — преемник); слав. «первии преемницы царевы»; в 2 Цар 8:18 αὐλάρχαι — начальники двора."
