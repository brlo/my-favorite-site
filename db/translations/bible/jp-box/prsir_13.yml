verses:
  1: "瀝青[れきせい]に触[ふ]れる者[もの]は汚[よご]れる。高[たか]ぶる者と交[まじ]わる者は、その者に似[に]た者となる。"
  2: "自分[じぶん]に重[おも]すぎる荷[に]を負[お]うな。自分より強[つよ]く、自分より富[とみ]む者[もの]と交[まじ]わるな。"
  3: "壺[つぼ]が大釜[おおがま]と何[なん]の交わりを持[も]とうか。これは打[う]ち当[あ]たり、これは砕[くだ]かれる。"
  4: "富[とみ]む者[もの]が不当[ふとう]なことをすれば、その者はまた威嚇[いかく]する。貧[まず]しい者が不当なことをされれば、その者はまた請[こ]い求[もと]める。"
  5: "あなたが役[やく]に立[た]てば、その者[もの]はあなたを用[もち]いる。あなたが乏[とぼ]しくなれば、あなたを捨[す]てる。"
  6: "あなたが持[も]っていれば、その者[もの]はあなたとともに暮[く]らし、あなたを空[から]にし、自分[じぶん]は苦[くる]しまない。"
  7: "その者[もの]はあなたを必要[ひつよう]とし、あなたを惑[まど]わし、あなたに笑[わら]いかけ、あなたに望[のぞ]みを与[あた]える。あなたに良[よ]いことを語[かた]り、"
  8: "「何[なに]が必要か」と言[い]う。その者[もの]は自分[じぶん]の食物[しょくもつ]であなたを辱[はずかし]め、あなたを二度[にど]も三度[さんど]も空[から]にするまでそうし、ついにはあなたを嘲[あざけ]る。"
  9: "その後[あと]、あなたを見[み]て捨[す]て、あなたに向[む]かって頭[あたま]を振[ふ]る。"
  10: "気[き]をつけよ。惑[まど]わされてはならない。"
  11: "自分[じぶん]の愚[おろ]かさのうちに卑[ひ]しめられてはならない。"
  12: "有力者[ゆうりょくしゃ]があなたを招[まね]いたなら、退[しりぞ]いて行[い]け。そうすれば、その者[もの]はなおいっそうあなたを招く。"
  13: "押[お]し入[い]るな。追[お]い払[はら]われないためである。また遠[とお]く離[はな]れるな。忘[わす]れられないためである。"
  14: "その者[もの]と対等[たいとう]に語[かた]ることを望[のぞ]むな。その者の多[おお]くの言葉[ことば]を信[しん]じるな。多くのおしゃべりによってあなたを試[ため]み、笑[わら]いながらあなたを調[しら]べるからである。"
  15: "言葉[ことば]を守[まも]らない者[もの]は憐[あわ]れみがなく、苦[くる]しめと束縛[そくばく]とを惜[お]しむことがない。"
  16: "よく守[まも]り、大[おお]いに気[き]をつけよ。あなたは自分[じぶん]の倒[たお]れとともに歩[あゆ]んでいるからである。"
  17: "これらのことを眠[ねむ]りのうちに聞[き]け。目[め]を覚[さ]ましていよ。"
  18: "一生[いっしょう]の間[あいだ]、主[しゅ]を愛[あい]し、自分[じぶん]の救[すく]いのために主を呼[よ]び求[もと]めよ。"
  19: "すべての生[い]き物[もの]は自分[じぶん]に似[に]たものを愛[あい]し、すべての人[ひと]は自分の隣人[りんじん]を愛する。"
  20: "すべての肉[にく]はその種類[しゅるい]に従[したが]って集[あつ]まり、人[ひと]は自分[じぶん]に似[に]た者[もの]に結[むす]びつく。"
  21: "狼[おおかみ]は小羊[こひつじ]と何[なん]の交[まじ]わりを持[も]とうか。罪人[つみびと]も敬虔[けいけん]な者[もの]とそのようである。"
  22: "ハイエナは犬[いぬ]と何[なん]の平和[へいわ]を持[も]とうか。富[とみ]む者[もの]も貧[まず]しい者とそのようである。"
  23: "荒野[こうや]の野[の]ろばは獅子[しし]の獲物[えもの]である。貧[まず]しい者[もの]も富[とみ]む者の牧場[ぼくじょう]である。"
  24: "へりくだりは高[たか]ぶる者[もの]にとって忌[い]むべきもの、貧[まず]しい者は富[とみ]む者にとって忌むべきものである。"
  25: "富[とみ]む者[もの]は揺[ゆ]らぐとき、友人[ゆうじん]たちによって支[ささ]えられるが、へりくだる者は倒[たお]れるとき、友人たちから押[お]し退[の]けられる。"
  26: "富[とみ]む者[もの]がつまずけば、多[おお]くの助[たす]け手[て]がある。その者が言[い]うべきでないことを語[かた]っても、人々[ひとびと]はそれを正[ただ]しいとした。"
  27: "へりくだる者がつまずけば、人々[ひとびと]はさらにその者を責[せ]める。その者が悟[さと]りを語っても、場所[ばしょ]は与[あた]えられない。"
  28: "富[とみ]む者[もの]が語[かた]ると、すべての者は黙[だま]り、その言葉[ことば]を雲[くも]にまで高[たか]く上[あ]げた。"
  29: "貧[まず]しい者が語ると、人々[ひとびと]は「この者はだれか」と言[い]う。その者がつまずけば、人々[ひとびと]はさらにその者を倒[たお]す。"
  30: "罪[つみ]のない富[とみ]は善[よ]い。不敬虔[ふけいけん]な者[もの]の口[くち]にある貧[まず]しさは悪[わる]い。"
  31: "人[ひと]の心[こころ]は、善[ぜん]にも悪[あく]にも、その顔[かお]を変[か]える。"
  32: "善[よ]いことのうちにある心[こころ]の跡[あと]は明[あか]るい顔[かお]であり、たとえ話[ばなし]を見[み]いだすことは労苦[ろうく]を伴[ともな]う思[おも]いである。"

notes:
  1: "Ὁ ἁπτόμενος πίσσης μολυνθήσεται — «касающийся смолы очернится» (ἅπτομαι — касаться; πίσσα — смола, вар; μολύνω — пачкать, осквернять; слав. «очернится»). ὁ κοινωνῶν ὑπερηφάνῳ ὁμοιωθήσεται αὐτῷ — «общающийся с гордым уподобится ему» (κοινωνέω — иметь общение)."
  2: "βάρος ὑπὲρ σὲ μὴ ἄρῃς — «не поднимай тяжести свыше себя» (βάρος — тяжесть; αἴρω — поднимать); ἰσχυροτέρῳ σου καὶ πλουσιωτέρῳ μὴ κοινώνει — «с сильнейшим и богатейшим тебя не общайся». τί κοινωνήσει χύτρα πρὸς λέβητα — «что общего у горшка с котлом» (χύτρα — горшок; λέβης — котёл); αὕτη προσκρούσει, καὶ αὕτη συντριβήσεται — «этот ударится, и этот разобьётся» (συντρίβω — сокрушать). Слав. делит стих на 2–3."
  3: "Продолжение ст. 2 (тот же стих по-гречески)."
  4: "πλούσιος ἠδίκησεν — «богатый обидел» (ἀδικέω); προσενεβριμήσατο — «пригрозил, вознегодовал» (ἐμβριμάομαι — грозно говорить); πτωχὸς ἠδίκηται — «бедный обижен»; προσδεηθήσεται — «будет просить, нуждаться» (προσδέομαι). Слав. «богатый обиду сотвори, и сам приразгневася»."
  5: "ἐὰν χρησιμεύσῃς — «если будешь полезен» (χρησιμεύω); ἐργᾶται ἐν σοί — «он работает в тебе, использует тебя» (ἐργάζομαι); ἐὰν ὑστερήσῃς — «если обеднеешь» (ὑστερέω); καταλείψει σε — «оставит тебя»."
  6: "ἐὰν ἔχῃς, συμβιώσεταί σοι — «если имеешь, он будет жить с тобой» (συμβιόω); ἀποκενώσει σε — «истощит, опустошит тебя» (ἀποκενόω); αὐτὸς οὐ πονέσει — «сам же не поболит, не пострадает» (πονέω)."
  7: "χρείαν ἔσχηκέν σου — «он имел нужду в тебе» (χρεία); ἀποπλανήσει σε — «введёт тебя в заблуждение» (ἀποπλανάω); προσγελάσεταί σοι — «улыбнётся тебе» (προσγελάω); δώσει σοι ἐλπίδα — «даст тебе надежду»; ἐρεῖ Τίς ἡ χρεία σου — «скажет: какая у тебя нужда». Вопрос богатого — 「…」."
  8: "Продолжение ст. 7 (тот же стих по-гречески). αἰσχυνεῖ σε ἐν τοῖς βρώμασιν αὐτοῦ — «пристыдит тебя своими яствами» (αἰσχύνω — стыдить; βρῶμα — пища); ἀποκενώσῃ σε δὶς ἢ τρίς — «истощит тебя дважды или трижды»; καταμωκήσεταί σου — «насмеётся над тобой» (καταμωκάομαι); τὴν κεφαλὴν αὐτοῦ κινήσει ἐπὶ σοί — «покивает головой над тобой» (κινέω). Слав. 13:7–9 распределяет этот текст иначе."
  9: "Продолжение ст. 8 (тот же стих по-гречески)."
  10: "πρόσεχε μὴ ἀποπλανηθῇς — «внимай, чтобы не быть обманутым» (ἀποπλανάω); μὴ ταπεινωθῇς ἐν ἀφροσύνῃ σου — «не унизься в своей неразумности» (ἀφροσύνη — глупость, неразумие). Слав. читает «да не смиришися во веселии твоем» (во веселии — «в радости»): это расходится и с LXX, и с контекстом, поэтому в тексте LXX, слав. чтение отмечено здесь. Слав. делит стих на 13:10–11."
  11: "Продолжение ст. 10 (тот же стих по-гречески)."
  12: "Προσκαλεσαμένου σε δυνάστου — «когда позовёт тебя властитель» (προσκαλέομαι); ὑποχωρῶν γίνου — «отступай, уходи» (ὑποχωρέω); τόσῳ μᾶλλόν σε προσκαλέσεται — «тем более он позовёт тебя». Не навязывайся — этим скорее позовут."
  13: "μὴ ἔμπιπτε — «не врывайся» (ἐμπίπτω); μὴ ἀπωσθῇς — «чтобы не быть отринутым» (ἀπωθέω); μὴ μακρὰν ἀφίστω — «не отставай далеко» (ἀφίστημι); ἵνα μὴ ἐπιλησθῇς — «чтобы не быть забытым» (ἐπιλανθάνομαι)."
  14: "μὴ ἔπεχε ἰσηγορεῖσθαι μετ᾽ αὐτοῦ — «не стремись говорить с ним как равный» (ἐπέχω — держаться, стремиться; ἰσηγορέομαι — говорить на равных); ἐκ πολλῆς γὰρ λαλιᾶς πειράσει σε — «ибо многим разговором он искусит тебя» (λαλιά — болтовня; πειράζω); ὡς προσγελῶν ἐξετάσει σε — «как бы улыбаясь, испытает тебя» (ἐξετάζω)."
  15: "ἀνελεήμων ὁ μὴ συντηρῶν λόγους — «немилостив не соблюдающий слов» (ἀνελεήμων — немилосердный; συντηρέω — соблюдать); οὐ μὴ φείσηται περὶ κακώσεως καὶ δεσμῶν — «не пощадит относительно озлобления и уз» (φείδομαι — щадить; κάκωσις — притеснение; δεσμός — узы). Слав. добавляет в скобках «ослабити» — в LXX этого слова нет; в текст не внесено."
  16: "συντήρησον καὶ πρόσεχε σφοδρῶς — «соблюди и внимай сильно» (σφοδρῶς — весьма); ὅτι μετὰ τῆς πτώσεώς σου περιπατεῖς — «ибо ты ходишь с падением твоим», т. е. падение всегда близко (слав. «яко с падением твоим ходиши»)."
  17: "В gr-lxx-byz на месте стиха стоит «.» (текст в модуле утрачен). По критическому изданию стих читается: ἀκούων αὐτὰ ἐν ὕπνῳ σου γρηγόρησον· πάσῃ ζωῇ σου ἀγάπα τὸν κύριον καὶ ἐπικαλοῦ αὐτὸν εἰς σωτηρίαν σου — «услышав это, в сне твоём бодрствуй; всею жизнью твоею люби Господа и призывай Его во спасение твоё». Это и передают csl 13:17–18, переведённые здесь без 〔…〕. Слав. нумерация далее сдвинута на два (csl 13:19 = гр. 15)."
  18: "Продолжение ст. 17 (тот же стих по-гречески)."
  19: "Πᾶν ζῷον ἀγαπᾷ τὸ ὅμοιον αὐτῷ — «всякое животное любит подобное себе» (ζῷον — живое существо); πᾶς ἄνθρωπος τὸν πλησίον αὐτοῦ — «всякий человек ближнего своего» (πλησίον)."
  20: "πᾶσα σὰρξ κατὰ γένος συνάγεται — «всякая плоть по роду собирается» (σάρξ — плоть; γένος — род); τῷ ὁμοίῳ αὐτοῦ προσκολληθήσεται ἀνήρ — «к подобному себе прилепится муж» (προσκολλάομαι — прилепляться)."
  21: "τί κοινωνήσει λύκος ἀμνῷ — «что общего у волка с ягнёнком» (ἀμνός — ягнёнок); οὕτως ἁμαρτωλὸς πρὸς εὐσεβῆ — «так и грешник с благочестивым». Слав. делит стих на 13:21–22."
  22: "τίς εἰρήνη ὑαίνῃ πρὸς κύνα — «какой мир у гиены с собакой» (ὕαινα — гиена; κύων — собака); τίς εἰρήνη πλουσίῳ πρὸς πένητα — «какой мир у богатого с бедным» (πένης — бедняк). Два риторических вопроса сохранены."
  23: "κυνήγια λεόντων ὄναγροι ἐν ἐρήμῳ — «добыча львов — дикие ослы в пустыне» (κυνήγιον — добыча, охота; ὄναγρος — дикий осёл; ἔρημος — пустыня); οὕτως νομαὶ πλουσίων πτωχοί — «так пажити богатых — бедные» (νομή — пастбище)."
  24: "βδέλυγμα ὑπερηφάνῳ ταπεινότης — «мерзость для гордого — смирение» (βδέλυγμα — мерзость; ταπεινότης — смирение, низость); οὕτως βδέλυγμα πλουσίῳ πτωχός — «так мерзость для богатого — бедный»."
  25: "πλούσιος σαλευόμενος στηρίζεται ὑπὸ φίλων — «богатый, колеблясь, поддерживается друзьями» (σαλεύω — колебать; στηρίζω — утверждать); ταπεινὸς δὲ πεσὼν προσαπωθεῖται ὑπὸ φίλων — «а смиренный, упав, отталкивается друзьями» (προσαπωθέω — отталкивать)."
  26: "πλουσίου σφαλέντος πολλοὶ ἀντιλήμπτορες — «у богатого, споткнувшегося, много заступников» (σφάλλω — заставлять споткнуться; ἀντιλήμπτωρ — помощник); ἐλάλησεν ἀπόρρητα, καὶ ἐδικαίωσαν αὐτόν — «сказал недолжное, и оправдали его» (ἀπόρρητος — запретный, несказанный; δικαιόω — оправдывать); ταπεινὸς ἔσφαλεν, καὶ προσεπετίμησαν αὐτῷ — «смиренный споткнулся, и ещё укорили его» (προσεπιτιμάω); ἐφθέγξατο σύνεσιν, καὶ οὐκ ἐδόθη αὐτῷ τόπος — «изрёк разумение, и не дано ему места» (φθέγγομαι — изрекать; τόπος — место). Слав. делит стих на 13:26–27."
  27: "Продолжение ст. 26 (тот же стих по-гречески)."
  28: "πλούσιος ἐλάλησεν, καὶ πάντες ἐσίγησαν — «богатый сказал, и все замолчали» (σιγάω — молчать); τὸν λόγον αὐτοῦ ἀνύψωσαν ἕως τῶν νεφελῶν — «слово его вознесли до облаков» (ἀνυψόω; νεφέλη — облако); πτωχὸς ἐλάλησεν καὶ εἶπαν Τίς οὗτος — «бедный сказал, и говорят: кто это»; κἂν προσκόψῃ, προσανατρέψουσιν αὐτόν — «если и споткнётся, низвергнут его» (προσκόπτω — спотыкаться; προσανατρέπω). Слав. делит стих на 13:28–29; слова толпы — 「…」."
  29: "Продолжение ст. 28 (тот же стих по-гречески)."
  30: "ἀγαθὸς ὁ πλοῦτος, ᾧ μή ἐστιν ἁμαρτία — «благое богатство, в котором нет греха»; πονηρὰ ἡ πτωχεία ἐν στόματι ἀσεβοῦς — «зла бедность в устах нечестивого» (πτωχεία — бедность; ἀσεβής — нечестивый)."
  31: "Καρδία ἀνθρώπου ἀλλοιοῖ τὸ πρόσωπον αὐτοῦ — «сердце человека изменяет лицо его» (ἀλλοιόω — изменять; πρόσωπον — лицо); ἐάν τε εἰς ἀγαθὰ ἐάν τε εἰς κακά — «и к добру, и к злу»."
  32: "ἴχνος καρδίας ἐν ἀγαθοῖς πρόσωπον ἱλαρόν — «след сердца в благах — лицо светлое» (ἴχνος — след; ἱλαρός — светлый, радостный); εὕρεσις παραβολῶν διαλογισμοὶ μετὰ κόπων — «изобретение притчей — размышления с трудами» (εὕρεσις — нахождение; παραβολή — притча; διαλογισμός — размышление; κόπος — труд)."
