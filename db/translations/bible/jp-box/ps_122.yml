# jp-box, Псалтирь, псалом 122. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация — славяно-синодальная (csl-ru): в слав. надписание отдельным стихом
# не стоит, поэтому наш стих 0 (надписание) влит в начало стиха 1; дальше номера 1..4.
# Псалом 122: взор рабов на руку господ (1–2), мольба о помиловании (3),
# пресыщение презрением (4).
# Красного и синего нет. Кавычек нет: в псалме нет прямой речи.
# 〔…〕 нет: перевод сделан по gr-lxx-byz, добавлений Церкви не вносилось.
# セラ (διάψαλμα) в этой главе нет.
# Сносок ⟨…⟩ нет: 僕, あわれみ, そしり уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: ps
chapter: 122
draft: true

verses:
  1: "登[とう]上[じょう]の歌[うた]。天[てん]に住[す]まわれる方[かた]よ、わたしはあなたに目[め]を上[あ]げる。"
  2: "見[み]よ、僕[しもべ]たちがその主人[しゅじん]の手[て]を、はしためがその女主人[おんなしゅじん]の手[て]を見[み]るように、わたしたちの目[め]は、わたしたちの神[かみ]である主[しゅ]を仰[あお]ぎ、主[しゅ]がわたしたちをあわれんでくださるのを待[ま]つ。"
  3: "主[しゅ]よ、わたしたちをあわれんでください。あわれんでください。わたしたちは蔑[さげす]みに飽[あ]き足[た]りているからである。"
  4: "わたしたちの魂[たましい]は、栄[さか]える者[もの]のそしりと、高[たか]ぶる者[もの]の蔑[さげす]みに、あまりにも飽[あ]き足[た]りている。"

notes:
  1: "Ὠιδὴ τῶν ἀναβαθμῶν — 登[とう]上[じょう]の歌. Надписание совпадает в gr-lxx-byz и в ru-базе, стих 0 (в csl-ru отдельного стиха нет, влито в ст. 1); скобками не маркируется. Πρὸς σὲ ἦρα τοὺς ὀφθαλμούς μου — わたしはあなたに目を上げる (αἴρω — «поднимать»; πρός + acc. — «к»). τὸν κατοικοῦντα ἐν τῷ οὐρανῷ — 天に住まわれる方よ (κατοικέω — «обитать»; причастие в звательном значении передано 方よ)."
  2: "ἰδοὺ ὡς ὀφθαλμοὶ δούλων εἰς χεῖρας τῶν κυρίων αὐτῶν — 見よ、僕たちがその主人の手を…見るように (δοῦλος — 僕; χείρ — «рука» как рука подающего/наказывающего). ὡς ὀφθαλμοὶ παιδίσκης εἰς χεῖρας τῆς κυρίας αὐτῆς — はしためがその女主人の手を… (παιδίσκη — «служанка, рабыня», передано はしため, как в церковной традиции; κυρία — «госпожа»). οὕτως οἱ ὀφθαλμοὶ ἡμῶν πρὸς κύριον τὸν θεὸν ἡμῶν — わたしたちの目は、わたしたちの神である主を仰ぎ. ἕως οὗ οἰκτιρήσαι ἡμᾶς — 主がわたしたちをあわれんでくださるのを待つ (οἰκτίρω — «миловать»; ἕως οὗ + opt. — «доколе не»)."
  3: "ἐλέησον ἡμᾶς, κύριε, ἐλέησον ἡμᾶς — 主よ、わたしたちをあわれんでください。あわれんでください (двойной императив сохранён повтором, как в греч. и в литургии). ὅτι ἐπὶ πολὺ ἐπλήσθημεν ἐξουδενώσεως — わたしたちは蔑みに飽き足りているからである (ἐξουδένωσις — «уничижение, презрение»; πίμπλημι — «наполняться»; ἐπὶ πολύ — «весьма»)."
  4: "ἐπὶ πλεῖον ἐπλήσθη ἡ ψυχὴ ἡμῶν — わたしたちの魂は…あまりにも飽き足りている (ἐπὶ πλεῖον — «более, сверх меры»; повтор πίμπλημι из ст. 3 сохранён). τὸ ὄνειδος τοῖς εὐθηνοῦσιν — 栄える者のそしり (ὄνειδος — «поношение»; οἱ εὐθηνοῦντες — «благоденствующие», отсюда 栄える者). καὶ ἡ ἐξουδένωσις τοῖς ὑπερηφάνοις — 高ぶる者の蔑み (ὑπερήφανος — «гордый, надменный»). Порядок членов греч. сохранён: сначала поношение от богатых, затем презрение гордых."
