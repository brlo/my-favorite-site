verses:
  1: "ナオミには、夫[おっと]の知[し]り合[あ]いの男[おとこ]がいた。エリメレクの一族[いちぞく]の者[もの]で、力[ちから]ある人[ひと]であり、名[な]はボアズといった。"
  2: "モアブの女[おんな]ルツはナオミに言[い]った。「どうか、野[の]へ行[い]かせてほしい。だれかの目[め]にかなえば、その人[ひと]の後[あと]について穂[ほ]を集[あつ]める。」ナオミは言った。「行[い]きなさい、娘[むすめ]よ。」"
  3: "彼女[かのじょ]は行[い]って、刈[か]る者[もの]たちの後[あと]について野[の]で落[お]ち穂[ぼ]を拾[ひろ]った。そして、ふとしたことから、エリメレクの一族[いちぞく]であるボアズの野[の]の区画[くかく]に足[あし]を入[い]れた。"
  4: "ちょうどそのとき、ボアズがベツレヘムから来[き]て、刈[か]る者[もの]たちに言[い]った。「主[しゅ]があなたがたとともにいてくださるように。」彼らは彼[かれ]に言った。「主[しゅ]があなたを祝福[しゅくふく]してくださるように。」"
  5: "ボアズは、刈[か]る者[もの]たちを監督[かんとく]している僕[しもべ]に言[い]った。「この娘[むすめ]はだれのものか。」"
  6: "刈[か]る者[もの]たちを監督[かんとく]している僕[しもべ]が答[こた]えて言[い]った。「あれはモアブの女[おんな]で、ナオミとともにモアブの野[の]から帰[かえ]って来[き]た者[もの]だ。」"
  7: "そして言[い]った。「彼女[かのじょ]は『束[たば]と束の間[あいだ]で、刈[か]る者[もの]たちの後[あと]について集[あつ]めさせてほしい』と言った。朝[あさ]早[はや]くから夕方[ゆうがた]まで来[き]て立[た]っており、野[の]で少[し]しも休[やす]んでいない。」"
  8: "ボアズはルツに言[い]った。「娘[むすめ]よ、聞[き]きなさい。ほかの者[もの]の野[の]へ行[い]って落[お]ち穂[ぼ]を拾[ひろ]ってはならない。ここから離[はな]れてはならない。ここで、わたしの女中[じょちゅう]たちと一緒[いっしょ]にいなさい。"
  9: "あなたの目[め]は、彼らが刈[か]っている野[の]に注[そそ]ぎ、彼らの後[あと]について行[い]きなさい。見[み]なさい、わたしは僕[しもべ]たちに、あなたに触[ふ]れてはならないと命[めい]じておいた。のどが渇[かわ]いたら、器[うつわ]のところへ行[い]って、僕たちが汲[く]む水[みず]を飲[の]みなさい。」"
  10: "彼女[かのじょ]はひれ伏[ふ]して地[ち]に礼[れい]をし、言[い]った。「どうして、わたしがあなたの目[め]にかなったのだろうか。わたしは外国人[がいこくじん]なのに、あなたはわたしに目を留[と]めてくださるのか。」"
  11: "ボアズは答[こた]えて彼女[かのじょ]に言[い]った。「夫[おっと]が死[し]んだ後[あと]、あなたがしゅうとめにしたことは、すべてわたしに伝[つた]えられている。また、あなたが父[ちち]と母[はは]と生[う]まれ故郷[こきょう]を捨[す]てて、昨日[きのう]も一昨日[おととい]も知[し]らなかった民[たみ]のもとへ来[き]たことも。"
  12: "主[しゅ]があなたの行[おこな]いを報[むく]いてくださるように。あなたの報[むく]いが、イスラエルの神[かみ]である主[しゅ]から十分[じゅうぶん]に与[あた]えられるように。あなたはその翼[つばさ]の下[した]に逃[に]げ込[こ]もうと、主のもとへ来[き]たのだから。」"
  13: "彼女[かのじょ]は言[い]った。「ご主人[しゅじん]さま、わたしがあなたの目[め]にかなうように。あなたはわたしを慰[なぐさ]め、婢[はしため]の心[こころ]に語[かた]りかけてくださった。わたしは、あなたの女中[じょちゅう]たちの一人[ひとり]のような者[もの]だ。」"
  14: "ボアズは彼女[かのじょ]に言[い]った。「もう食[た]べる時[とき]だ。ここへ来[き]て、パンを食[た]べ、あなたのパン切[き]れを酢[す]に浸[ひた]しなさい。」ルツは刈[か]る者[もの]たちのそばに座[すわ]った。ボアズは彼女に炒[い]り麦[むぎ]を手渡[てわた]した。彼女は食[た]べて満[み]ち足[た]り、まだ残[のこ]した。"
  15: "彼女[かのじょ]が立[た]って落[お]ち穂[ぼ]を拾[ひろ]い始[はじ]めると、ボアズは僕[しもべ]たちに命[めい]じて言[い]った。「束[たば]と束の間[あいだ]でも拾わせなさい。恥[はじ]をかかせてはならない。"
  16: "また、束[たば]を担[かつ]いで行[い]くときには、その中[なか]から彼女[かのじょ]のために抜[ぬ]き取[と]って置[お]き、拾[ひろ]わせなさい。とがめてはならない。」"
  17: "彼女[かのじょ]は夕方[ゆうがた]まで野[の]で拾[ひろ]い、拾った穂[ほ]を打[う]って脱穀[だっこく]し、大麦[おおむぎ]はおよそ一[いち]エファになった。"
  18: "彼女[かのじょ]はそれを持[も]って町[まち]へ入[はい]った。しゅうとめは彼女が拾[ひろ]ったものを見[み]た。ルツは、自分[じぶん]が食[た]べて残[のこ]したものも取[と]り出[だ]して、しゅうとめに与[あた]えた。"
  19: "しゅうとめは彼女[かのじょ]に言[い]った。「今日[きょう]はどこで拾[ひろ]ったのか。どこで働[はたら]いたのか。あなたを認[みと]めた人[ひと]が祝福[しゅくふく]されるように。」ルツは、どこで働いたかをしゅうとめに告[つ]げ、言[い]った。「今日、わたしが一緒[いっしょ]に働いた男[おとこ]の名[な]はボアズだ。」"
  20: "ナオミは嫁[よめ]に言[い]った。「主[しゅ]が彼を祝福[しゅくふく]してくださるように。主は、生[い]きている者[もの]たちにも死[し]んだ者たちにも、その恵[めぐ]みを絶[た]やされなかった。」そしてナオミは彼女[かのじょ]に言った。「あの男[おとこ]はわたしたちに近[ちか]い。わたしたちの親族[しんぞく]の買[か]い戻[もど]し人[びと]の一人[ひとり]だ。」"
  21: "ルツはしゅうとめに言[い]った。「その人[ひと]はわたしに、『わたしの若[わか]い者[もの]たちと一緒[いっしょ]にいなさい。わたしの刈[か]り入[い]れが全部[ぜんぶ]終[お]わるまで』とも言った。」"
  22: "ナオミは嫁[よめ]のルツに言[い]った。「娘[むすめ]よ、あなたが彼の女中[じょちゅう]たちと一緒[いっしょ]に行[い]くのはよいことだ。そうすれば、ほかの野[の]でだれかに危害[きがい]を加[くわ]えられることもない。」"
  23: "ルツは、大麦[おおむぎ]と小麦[こむぎ]の刈[か]り入[い]れが終[お]わるまで、ボアズの女中[じょちゅう]たちと一緒[いっしょ]に落[お]ち穂[ぼ]を拾[ひろ]った。そして、しゅうとめとともに住[す]んだ。"

notes:
  1: "γνώριμος τῷ ἀνδρὶ αὐτῆς — «известный её мужу», т. е. знакомый (не ἀγχιστεύς, ср. 2:20). δυνατὸς ἰσχύι — «крепкий силой», т. е. человек влиятельный и состоятельный. ἐκ τῆς συγγενείας Αβιμελεχ — из рода Елимелеха (в LXX Αβιμελεχ, см. 1:2)."
  2: "συνάξω ἐν τοῖς στάχυσιν — «соберу среди колосьев» (συνάγω — собирать; ср. συλλέγω в 2:3). κατόπισθεν οὗ ἐὰν εὕρω χάριν — позади того, у кого найду благоволение."
  3: "περιέπεσεν περιπτώματι — «попала по случаю» (περιπίπτω; περιπτῶμα — случайность). μερὶς τοῦ ἀγροῦ — участок поля."
  4: "ἰδού — «вот». Κύριος μεθ᾿ ὑμῶν и Εὐλογήσαι σε κύριος — приветствие жнецам и их ответ: «Господь с вами» — «да благословит тебя Господь»."
  5: "παιδάριον — слуга, отрок (僕). ἐφεστὼς ἐπὶ τοὺς θερίζοντας — поставленный над жнецами, т. е. надзиратель."
  6: "ἡ παῖς ἡ Μωαβῖτις — «служанка моавитянка» (παῖς — девушка, служанка). ἀποστραφεῖσα μετὰ Νωεμιν — пришедшая с Ноеминью (ἀποστρέφω)."
  7: "δράγματα — снопы. ἀπὸ πρωίθεν καὶ ἕως ἑσπέρας — с раннего утра и до вечера. οὐ κατέπαυσεν … μικρόν — не отдыхала нимало. Слова Руфи переданы вложенной речью 『…』."
  8: "Οὐκ ἤκουσας, θύγατερ; — «ты слышала, дочь?», т. е. послушай. κολλήθητι — прилепись, держись (κολλάω). κοράσια — девушки, служанки (女中)."
  9: "οἱ ὀφθαλμοί σου εἰς τὸν ἀγρόν — глаза твои на поле. ἐνετειλάμην — заповедал (ἐντέλλομαι). ἅψασθαι — прикоснуться, т. е. обидеть. σκεύη — сосуды; ὑδρεύω — черпать воду."
  10: "ἔπεσεν ἐπὶ πρόσωπον … προσεκύνησεν ἐπὶ τὴν γῆν — пала на лицо и поклонилась до земли. τοῦ ἐπιγνῶναί με — чтобы узнать (признать) меня. ξένη — чужеземка."
  11: "Ἀπαγγελίᾳ ἀπηγγέλη μοι — «возвещением возвещено мне» (усилительная конструкция). ἐχθὲς καὶ τρίτης — «вчера и третьего дня», т. е. совсем недавно. γῆ γενέσεώς σου — земля рождения твоего (生まれ故郷)."
  12: "ἀποτείσαι — да воздаст (ἀποτίνω). ἐργασία — дело, труд. μισθὸς πλήρης — полная награда. ὑπὸ τὰς πτέρυγας αὐτοῦ — под крылами Его (образ защиты); ср. 3:9."
  13: "Εὕροιμι χάριν ἐν ὀφθαλμοῖς σου — «да найду милость в глазах твоих» (optative). ἐλάλησας ἐπὶ καρδίαν — «сказал к сердцу», т. е. утешил. παιδίσκαι — служанки; ἔσομαι ὡς μία — «буду как одна из них»."
  14: "ὥρα τοῦ φαγεῖν — время есть. ὄξος — уксус (кислое вино). ψωμός — кусок. ἐβούνισεν ἄλφιτον — «наложил ей крупы» (βουνίζω), т. е. подал поджаренное зерно."
  15: "ἀνὰ μέσον τῶν δραγμάτων — между снопами. μὴ καταισχύνητε — не посрамите, не обижайте (καταισχύνω)."
  16: "βαστάζοντες βαστάξατε — «поднимая, поднимите», т. е. при ношении снопов оставляйте ей. παραβάλλοντες παραβαλεῖτε — подкладывайте. ἐπιτιμήσετε — запретите, побраните (ἐπιτιμάω)."
  17: "ἐρράβδισεν — «обила палкой», т. е. вымолотила (ῥαβδίζω). οιφι — ефа, мера сыпучего (エファ), около 22 л."
  18: "ἐξενέγκασα — вынув (ἐκφέρω). ἃ κατέλιπεν ἐξ ὧν ἐνεπλήσθη — что оставила от того, чем насытилась."
  19: "εἴη ὁ ἐπιγνούς σε εὐλογημένος — «да будет благословен узнавший тебя» (optative). ἀπήγγειλεν — рассказала. ποῦ ἐποίησας — «где работала»."
  20: "οὐκ ἐγκατέλιπεν τὸ ἔλεος αὐτοῦ — не оставил милости Своей (ἐγκαταλείπω). ἀγχιστεύω — выкупать, быть выкупающим; ἀγχιστεύς — 親族の買い戻し人 (гоэль)."
  21: "προσκολλήθητι — держись, прилепись (προσκολλάω). ἀμητός — жатва. В греческом παιδαρίων (слуги; ср. 2:8 κοράσια), в csl и ru — «служанки»; держимся греческого."
  22: "ἀγαθόν — хорошо. οὐκ ἀπαντήσονταί σοι — «не встретятся тебе», т. е. не обидят."
  23: "συλλέγειν — подбирать колосья. θερισμὸς κριθῶν καὶ πυρῶν — жатва ячменя и пшеницы (ср. 1:22). ἐκάθισεν μετὰ τῆς πενθερᾶς — осталась жить со свекровью."
