# jp-box, Иезекииль, глава 21. Черновик для приёмки.
#
# Нумерация — по славяно-синодальной. В gr-lxx-byz глава начинается на пять стихов
# раньше: gr 21:1–5 (слово о юге и лесе Негев) в слав. стоят как 20:45–49 и
# переведены в главе 20. Поэтому здесь ст. 1–32 = gr 21:6–37, а слав. 21:1–32
# совпадает с нашими стихами номер в номер: csl N = gr N+5.
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
# Содержание: 1–5 меч Господень извлечён из ножен на Иерусалим и на всякую плоть;
# 6–7 стенание пророка и ужас при вести; 8–17 меч наострён и удвоен, «меч, меч»,
# рукоплескание Господа; 18–27 две дороги меча царя Вавилонского, гадание на
# распутье, жребий на Иерусалим, снятие кидара и венца, «неправду, неправду,
# неправду» до Приходящего; 28–32 меч на сынов Аммона.
# Речи: 1 — вводная формула вне кавычек; 2–7 — слово Господа в 「…」 (в 7 вопрос
# народа — 『…』); 8 — формула; 9–17 — 「…」; 18 — формула; 19–32 — одна непрерывная
# речь Господа в 「…」 (с 28 обращена к Аммону, новой формулы нет).
# Паритет: 21:3–4 в LXX и csl «неправедного и беззаконного», в ru/МТ «праведного и
# нечестивого» — держим LXX/csl; 21:4 слав. «от юга» при греч. ἀπηλιώτου «от востока»
# — в тексте слав.; 21:10 LXX/csl «закалай, уничижай, отвергни всякое дерево», ru/МТ
# иное; 21:26 слав. «сними кидар и отложи венец» (греч. можно понять «возложи»);
# 21:27 LXX/csl «неправду...», ru/МТ «низложу...»; 21:30 слав. добавляет «в ножны
# твоя» — нет в LXX, внесено без скобок.
# Имена: エルサレム, イスラエル, ユダ, ユダヤ, バビロン, アンモン人, ラバ;
# アンモン人[じん]のラバ — как в 2 Цар 11–12 (Ραββαθ υἱῶν Αμμων).

