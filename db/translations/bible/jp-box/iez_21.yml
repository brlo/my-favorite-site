verses:
  1: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]われた。"
  2: "「それゆえ、人[ひと]の子[こ]よ、預言[よげん]せよ。あなたの顔[かお]をエルサレムに向[む]け、その聖[せい]なるもの[もの]を仰[あお]ぎ見[み]、イスラエルの地[ち]について預言[よげん]せよ。"
  3: "イスラエルの地[ち]に言[い]え。主[しゅ]なる神[かみ]はこう言[い]われる。見[み]よ、わたしはあなたに敵対[てきだい]する。わたしはわたしの剣[つるぎ]を鞘[さや]から抜[ぬ]き、あなたから不義[ふぎ]の者[もの]と不法[ふほう]の者[もの]を絶[た]つ。"
  4: "わたしはあなたから不義[ふぎ]の者[もの]と不法[ふほう]の者[もの]を絶[た]つので、わたしの剣[つるぎ]は鞘[さや]から出[で]て、南[みなみ]から北[きた]まで、すべての肉[にく]に向[む]かう。"
  5: "すべての肉[にく]は、わたしが主[しゅ]であり、わたしの剣[つるぎ]を鞘[さや]から抜[ぬ]いたことを知[し]る。それはもはや戻[もど]らない。"
  6: "人[ひと]の子[こ]よ、あなたは腰[こし]を砕[くだ]いて呻[うめ]き、苦[くる]しみのうちで、彼[かれ]らの目[め]の前[まえ]で呻[うめ]け。"
  7: "彼[かれ]らがあなたに『なぜ、あなたは呻[うめ]くのか』と言[い]うとき、あなたは言[い]え。『知[し]らせが来[く]るからである』と。すべての心[こころ]は砕[くだ]け、すべての手[て]は力[ちから]を失[うしな]い、すべての肉[にく]とすべての霊[れい]は衰[おとろ]え、すべての腿[もも]は湿[しめ]りによって汚[けが]れる。見[み]よ、それは来[く]る。そしてそのようになる、と主[しゅ]なる神[かみ]は言[い]われる。」"
  8: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]われた。"
  9: "「人[ひと]の子[こ]よ、預言[よげん]して言[い]え。主[しゅ]はこう言[い]われる。言[い]え。剣[つるぎ]よ、剣よ、研[と]ぎ澄[す]まされ、激[はげ]しく怒[いか]れ。"
  10: "屠[ほふ]りを重[かさ]ね、光[ひか]るために研[と]がれ、打[う]ち砕[くだ]くために備[そな]えられた。斬[き]れ、蔑[さげす]め、すべての木[き]を退[しりぞ]けよ。"
  11: "それを、その手[て]に握[にぎ]るために備[そな]えられたものとして与[あた]えた。剣[つるぎ]は研[と]がれ、殺[ころ]す者[もの]の手[て]に渡[わた]すために備[そな]えられている。"
  12: "叫[さけ]び、嘆[なげ]け、人[ひと]の子[こ]よ。それはわたしの民[たみ]のただ中[なか]にあり、イスラエルのすべての指導者[しどうしゃ]のただ中にある。彼[かれ]らは剣[つるぎ]のそばに寄留[きりゅう]する。それはわたしの民のただ中にある。それゆえ、あなたの手[て]を打[う]ち鳴[な]らせ。"
  13: "それはすでに正[ただ]しいと認[みと]められたからである。もしまた、部族[ぶぞく]が退[しりぞ]けられても、どうなるのか。それはない、と主[しゅ]なる神[かみ]は言[い]われる。"
  14: "人[ひと]の子[こ]よ、預言[よげん]せよ。手[て]を手[て]に打[う]ち鳴[な]らせ。剣[つるぎ]を倍[ばい]にせよ。第三[だいさん]の剣[つるぎ]は傷[きず]ついた者[もの]の剣、傷[きず]ついた者[もの]の大[おお]いなる剣であり、彼[かれ]らを驚[おどろ]かせる。"
  15: "心[こころ]を砕[くだ]き、彼[かれ]らのすべての門[もん]のところで弱[よわ]る者[もの]を多[おお]くするために。彼らは剣[つるぎ]の屠[ほふ]りに渡[わた]される。屠[ほふ]りによく、光[ひか]りによく整[ととの]えられている。"
  16: "右[みぎ]へも左[ひだり]へ進[すす]め。研[と]ぎ澄[す]ませ。あなたの顔[かお]が向[む]かうところへ行[ゆ]け。"
  17: "わたしもまた、手[て]を手[て]に打[う]ち鳴[な]らし、わたしの怒[いか]りを鎮[しず]める。わたしは主[しゅ]、語[かた]った。」"
  18: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]われた。"
  19: "「人[ひと]の子[こ]よ、あなたのために、バビロンの王[おう]の剣[つるぎ]が入[はい]る二[ふた]つの道[みち]を設[もう]けよ。二つは一[ひと]つの国[くに]から出[で]る。都[みやこ]の道[みち]の始[はじ]めに、手[て]を置[お]け。"
  20: "道[みち]の始[はじ]めに、剣[つるぎ]がアンモン人[じん]のラバへ、またユダヤと、そのただ中[なか]のエルサレムへ行[ゆ]くように設[もう]けよ。"
  21: "バビロンの王[おう]は二[ふた]つの道[みち]の分[わ]かれ目[め]、古[ふる]い道[みち]の始[はじ]めに立[た]って、占[うらな]いをする。矢[や]を振[ふ]り、彫[ほ]り像[ぞう]に問[と]い、右[みぎ]の肝[きも]を調[しら]べる。"
  22: "彼[かれ]の右[みぎ]の手[て]には、エルサレムへの占[うらな]いが出[で]た。柵[さく]を巡[めぐ]らし、叫[さけ]びのうちに口[くち]を開[ひら]き、鬨[とき]の声[こえ]を上[あ]げ、その門[もん]の前[まえ]に柵[さく]を置[お]き、土[つち]を盛[も]り、攻城[こうじょう]櫓[やぐら]を建[た]てるために。"
  23: "彼[かれ]は彼[かれ]らの前[まえ]で、まるで占[うらな]いをするかのようであり、彼は彼[かれ]の不義[ふぎ]を思[おも]い出[だ]させる者[もの]である。"
  24: "それゆえ、主[しゅ]なる神[かみ]はこう言[い]われる。あなたがたは自分の不義[ふぎ]を思[おも]い起[おこ]させ、その不敬[ふけい]をあらわにし、その罪[つみ]をすべての不敬[ふけい]とすべてのわざのうちに現[あらわ]した。あなたがたがそれを思[おも]い起[おこ]させたので、あなたがたはこれによって捕[と]らえられる。"
  25: "汚[けが]れた者[もの]、不法[ふほう]な者[もの]、イスラエルの指導者[しどうしゃ]よ。あなたの日[ひ]が来[き]た。不法[ふほう]の時[とき]の終[お]わりが。"
  26: "主[しゅ]はこう言[い]われる。頭[あたま]の巻[ま]き布[ぬの]を取[と]り、冠[かんむり]を外[はず]せ。これはもはや、そのようにはならない。あなたは高[たか]い者[もの]を低[ひく]くし、低[ひく]い者[もの]を高[たか]くした。"
  27: "不義[ふぎ]、不義、不義。わたしはそれを置[お]く。これもまた、そのようにはならない。しかるべき者[もの]が来[く]るまで。わたしはそれを彼[かれ]に与[あた]える。」"
  28: "「人[ひと]の子[こ]よ、預言[よげん]して言[い]え。主[しゅ]なる神[かみ]はアンモン人[じん]の子[こ]らについて、その嘲[あざけ]りについてこう言[い]われる。言[い]え。剣[つるぎ]よ、剣よ。屠[ほふ]りのために抜[ぬ]かれ、滅[ほろ]ぼしを全[まっと]うするために抜[ぬ]かれ、光[ひか]るために立[た]ち上[あ]がれ。"
  29: "あなたの空[むな]しい幻[まぼろし]と、あなたの偽[いつわ]りの占[うらな]いのゆえに、あなたは不法[ふほう]の者[もの]たちの傷[きず]ついた首[くび]の上[うえ]に置[お]かれる。彼[かれ]らの日[ひ]が来[き]た。不法[ふほう]の時[とき]の終[お]わりが。"
  30: "鞘[さや]に戻[もど]れ。あなたが生[う]まれたこの場所[ばしょ]にとどまってはならない。あなた自身[じしん]の地[ち]で、わたしはあなたを裁[さば]く。"
  31: "わたしはあなたの上[うえ]に怒[いか]りを注[そそ]ぎ、怒[いか]りの火[ひ]をあなたに吹[ふ]きかけ、破滅[はめつ]を造[つく]り出[だ]す野蛮[やばん]な者[もの]たちの手[て]にあなたを渡[わた]す。"
  32: "あなたは火[ひ]の食[く]い物[もの]となる。あなたの血[ち]はあなたの地[ち]のただ中[なか]にある。あなたの記憶[きおく]は決[けっ]してない。わたしは主[しゅ]、語[かた]ったからである。」"

notes:
  1: "Καὶ ἐγένετο λόγος κυρίου πρός με λέγων — вводная формула. По карте 20/21 это gr 21:6: gr 21:1–5 (слово о юге и лесе Негев) в слав. стоят как 20:45–49. Дальше наш N = gr N+5 = csl N."
  2: "Διὰ τοῦτο προφήτευσον — «посему пророчествуй»; слав. «сего ради прорцы». στήρισον τὸ πρόσωπόν σου ἐπὶ Ιερουσαλημ — «утверди лице твоё на Иерусалим» (顔を向け), ср. 25:2. ἐπὶ τὰ ἅγια αὐτῶν — «на святыни их» (聖なるもの)."
  3: "ἐκσπάσω τὸ ἐγχειρίδιόν μου ἐκ τοῦ κολεοῦ αὐτοῦ — «извлеку меч Мой из ножен его» (ἐγχειρίδιον — меч; κολεός — ножны). ἐξολεθρεύσω ἐκ σοῦ ἄδικον καὶ ἄνομον — «истреблю у тебя неправедного и беззаконного»: так LXX и слав.; ru (МТ) читает «праведного и нечестивого» — вариант в notes, в текст не внесён."
  4: "ἀνθ᾿ ὧν — «за то, что». ἐπὶ πᾶσαν σάρκα ἀπὸ ἀπηλιώτου ἕως βορρᾶ — «на всякую плоть от востока до севера»: ἀπηλιώτης — восток, но слав. читает «от юга даже до севера», в тексте слав."
  5: "καὶ ἐπιγνώσεται πᾶσα σάρξ — «и узнает всякая плоть»; οὐκ ἀποστρέψει οὐκέτι — «не возвратится более»: меч не будет убран обратно в ножны."
  6: "καταστέναξον ἐν συντριβῇ ὀσφύος σου — «возстени в сокрушении чресл твоих» (ὀσφύς — чресла, поясница, 腰): знак скорби, ср. 24:17. ἐν ὀδύναις στενάξεις κατ᾿ ὀφθαλμοὺς αὐτῶν — «в болезнях будешь стенать пред глазами их»."
  7: "Ἕνεκα τίνος σὺ στενάζεις; — «из-за чего ты стенаешь?»: вопрос народа, поэтому 『…』. Ἐπὶ τῇ ἀγγελία, διότι ἔρχεται — «о вести, ибо идёт». θραυσθήσεται πᾶσα καρδία — «сокрушится всякое сердце»; πᾶσαι χεῖρες παραλυθήσονται — «все руки расслабятся»; ἐκψύξει πᾶσα σὰρξ καὶ πᾶν πνεῦμα — «изнеможет всякая плоть и всякий дух»; πάντες μηροὶ μολυνθήσονται ὑγρασίᾳ — «все бёдра осквернятся влагой» (образ ужаса, не сглажен). λέγει κύριος κύριος — внутри речи."
  8: "Вторая вводная формула (gr 21:13); после неё начинается новый блок слова Господа. Номер совпадает со слав. 21:8."
  9: "Εἰπὸν Ῥομφαία ῥομφαία, ὀξύνου καὶ θυμώθητι — «скажи: меч, меч, изострись и разъярись»: двойное обращение и императивы к мечу сохранены."
  10: "σφάξῃς σφάγια — «заклать заклания» (внутренний объект, ср. 8:2). ἑτοίμη εἰς παράλυσιν σφάζε — тёмное: «готова для расслабления, закалай»; слав. «готов на разсыпание». ἐξουδένει ἀπωθοῦ πᾶν ξύλον — «уничижай, отвергни всякое дерево»; слав. «сецы, изничтожай, отрини всякое древо». ru (МТ) даёт иное («жезл сына Моего презирает всякое дерево») — в текст не внесено."
  11: "ἔδωκεν αὐτὴν ἑτοίμην τοῦ κρατεῖν χεῖρα αὐτοῦ — «дал её готовой, чтобы держать руку его»; ἐξηκονήθη — «наострён» (ἀκονάω); εἰς χεῖρα ἀποκεντοῦντος — «в руку поражающего (убивающего)»."
  12: "ἀνάκραγε καὶ ὀλόλυξον — «возопи и возрыдай» (ὀλολύζω — вопить). αὐτὴ ἐγένετο ἐν τῷ λαῷ μου — «она (меч) была в народе Моём»; παροικήσουσιν ἐπὶ ῥομφαίᾳ — «будут пришельцами при мече», слав. «обитающии близ под мечь быша». κρότησον ἐπὶ τὴν χεῖρά σου — «ударь рукой твоей» (по бедру, знак скорби, ср. 6:11)."
  13: "δεδικαίωται — «оправдано/признано годным» (перфект от δικαιόω); ru «испытан». καὶ τί, εἰ καὶ φυλὴ ἀπώσθη; οὐκ ἔσται — «и что, если и колено отвергнуто? не будет»: тёмное место, слав. «аще и племя отринется? Не будет»."
  14: "διπλασίασον ῥομφαίαν — «удвой меч»; ἡ τρίτη ῥομφαία τραυματιῶν — «третий меч — раненых»; ἐκστήσει αὐτούς — «ужаснёт их» (ἐξίστημι)."
  15: "ὅπως θραυσθῇ ἡ καρδία — «чтобы сокрушилось сердце»; πληθυνθῶσιν οἱ ἀσθενοῦντες ἐπὶ πᾶσαν πύλην αὐτῶν — «умножились немощные у всех ворот их»; παραδίδονται εἰς σφάγια ῥομφαίας — «предаются на заклание меча»; εὖ γέγονεν εἰς σφαγήν... εἰς στίλβωσιν — «хорошо стало для заклания... для блистания»."
  16: "διαπορεύου ὀξύνου ἐκ δεξιῶν καὶ ἐξ εὐωνύμων — «проходи, изостряйся справа и слева»; οὗ ἂν τὸ πρόσωπόν σου ἐξεγείρηται — «куда бы ни поднялось лицо твоё». Обращение к мечу."
  17: "καὶ ἐγὼ δὲ κροτήσω χεῖρά μου πρὸς χεῖρά μου — «и Я ударю руку Мою о руку Мою»: ответ на жест пророка; ἐναφήσω τὸν θυμόν μου — «наложу (утолю) гнев Мой» (ἐναφίημι). ἐγὼ κύριος λελάληκα — формула в конце."
  18: "Третья вводная формула (gr 21:23). После неё — слово о двух дорогах меча и о царе Вавилонском, до конца главы; новой формулы в 28 нет."
  19: "διάταξον σεαυτῷ δύο ὁδούς — «представь (начертай) себе две дороги»; ἐκ χώρας μιᾶς ἐξελεύσονται αἱ δύο — «из одной страны выйдут обе»; χεὶρ ἐν ἀρχῇ ὁδοῦ πόλεως — «рука (указатель) при начале дороги города»; ἐπ᾿ ἀρχῆς — греч. строка обрывается на полуслове, продолжение в ст. 20 (слав. «руку уготовают... от начала пути учиниши»)."
  20: "ὁδοῦ διατάξεις τοῦ εἰσελθεῖν ῥομφαίαν ἐπὶ Ραββαθ υἱῶν Αμμων — «при начале дороги поставь, чтобы меч вошёл в Равву сынов Аммона» (ラバ, ср. 2 Цар 11:1); ἐπὶ τὴν Ιουδαίαν καὶ ἐπὶ Ιερουσαλημ ἐν μέσῳ αὐτῆς — «на Иудею и на Иерусалим в середине её»."
  21: "ἐπὶ τὴν ἀρχαίαν ὁδόν — «на древнюю (старую) дорогу»; τοῦ μαντεύσασθαι μαντείαν — «чтобы погадать гадание»; τοῦ ἀναβρᾶσαι ῥάβδον — тёмное: «встряхнуть жезл (стрелу)» (ἀναβράσσω — вскипятить, встряхнуть), слав. «якоже вскипети жезлу»; ἐπερωτῆσαι ἐν τοῖς γλυπτοῖς — «спросить у идолов»; ἡπατοσκοπήσασθαι ἐκ δεξιῶν αὐτοῦ — «погадать по правой стороне печени» (ἡπατοσκοπέομαι)."
  22: "ἐγένετο τὸ μαντεῖον ἐπὶ Ιερουσαλημ — «гадание вышло на Иерусалим»; βαλεῖν χάρακα — «поставить частокол (осадный вал)»; διανοῖξαι στόμα ἐν βοῇ — «открыть уста в крике»; ὑψῶσαι φωνὴν μετὰ κραυγῆς — «возвысить голос с воплем»; βαλεῖν χῶμα — «насыпать вал»; οἰκοδομῆσαι βελοστάσεις — «построить осадные башни» (βελοστάσις)."
  23: "καὶ αὐτὸς αὐτοῖς ὡς μαντευόμενος μαντείαν ἐνώπιον αὐτῶν — «и он им как бы гадает гадание пред ними»; ἀναμιμνῄσκων ἀδικίας αὐτοῦ μνησθῆναι — «напоминая, чтобы вспомнили беззаконие его». Тёмное место: слав. добавляет «уседмеряя седмерицы» (неясно), ru (МТ) понимает иначе — в текст не внесено."
  24: "ἀνεμνήσατε τὰς ἀδικίας ὑμῶν — «вы напомнили беззакония ваши»; ἐν τῷ ἀποκαλυφθῆναι τὰς ἀσεβείας ὑμῶν — «когда открылись нечестия ваши»; ἐν τούτοις ἁλώσεσθε — «в этом будете взяты» (ἁλίσκομαι)."
  25: "βέβηλε ἄνομε ἀφηγούμενε τοῦ Ισραηλ — «нечестивый, беззаконный вождь Израиля» (βέβηλος — осквернённый, 汚れた); οὗ ἥκει ἡ ἡμέρα, ἐν καιρῷ ἀδικίας πέρας — «которого день пришёл, во время беззакония — конец»."
  26: "Ἀφείλου τὴν κίδαριν καὶ ἐπέθου τὸν στέφανον — «снял кидар и возложил венец»; возможно и понимание как императивов «сними... возложи». Взято слав. «сними кидар и отложи венец», вариант LXX в notes. κίδαρις — головной убор (巻き布), στέφανος — венец. ἐταπείνωσας τὸ ὑψηλὸν καὶ τὸ ταπεινὸν ὕψωσας — «ты смирил высокое и возвысил низкое»."
  27: "ἀδικίαν ἀδικίαν θήσομαι αὐτήν — «неправду, неправду положу её»: так LXX и слав.; ru/МТ читает «низложу, низложу, низложу». ἕως οὗ ἔλθῃ ᾧ καθῆκει — «доколе не придёт Тот, Кому подобает»; παραδώσω αὐτῷ — «и предам Ему»."
  28: "πρὸς τοὺς υἱοὺς Αμμων καὶ πρὸς τὸν ὀνειδισμὸν αὐτῶν — «о сынах Аммона и о поношении их»; ἐσπασμένη εἰς σφάγια — «обнажённый для заклания»; ἐσπασμένη εἰς συντέλειαν — «обнажённый для совершения (истребления)»; ἐγείρου ὅπως στίλβῃς — «поднимись, чтобы блистать». Новой вводной формулы нет: речь Господа продолжается."
  29: "ἐν τῇ ὁράσει σου τῇ ματαίᾳ — «в пустом видении твоём»; μαντεύεσθαί σε ψευδῆ — «что ты ложно гадаешь»; παραδοῦναί σε ἐπὶ τραχήλους τραυματιῶν ἀνόμων — «предать тебя на шеи раненых беззаконников»; ὧν ἥκει ἡ ἡμέρα ἐν καιρῷ ἀδικίας πέρας — «которых день пришёл, во время беззакония — конец»."
  30: "ἀπόστρεφε, μὴ καταλύσῃς ἐν τῷ τόπῳ τούτῳ, ᾧ γεγέννησαι — «возвратись, не останавливайся на месте этом, где ты рождён» (καταλύω — располагаться, останавливаться). Слав. добавляет «в ножны твоя» — нет в LXX, внесено без скобок. ἐν τῇ γῇ τῇ ἰδίᾳ σου κρινῶ σε — «в земле твоей собственной буду судить тебя»."
  31: "ἐκχεῶ ἐπὶ σὲ ὀργήν μου — «изолью на тебя гнев Мой»; ἐμφυσήσω ἐπὶ σὲ — «дохну на тебя»; ἄνδρες βάρβαροι τεκταίνοντες διαφθοράν — «мужи варвары, устраивающие погибель» (τεκταίνομαι — замышлять, делать)."
  32: "ἐν πυρὶ ἔσῃ κατάβρωμα — «в огне будешь снедью»; τὸ αἷμά σου ἔσται ἐν μέσῳ τῆς γῆς σου — «кровь твоя будет среди земли твоей»; οὐ μὴ γένηταί σου μνεία — «не будет о тебе памяти»; διότι ἐγὼ κύριος λελάληκα — «ибо Я, Господь, сказал». Конец главы, ср. 25:17."
