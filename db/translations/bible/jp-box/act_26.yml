verses:
  1: "アグリッパはパウロに言[い]った。「あなたは自分[じぶん]のために弁明[べんめい]することが許[ゆる]されている。」そこで、パウロは手[て]を伸[の]べて弁明[べんめい]し始[はじ]めた。"
  2: "「アグリッパ王[おう]よ、ユダヤ人[じん]たちがわたしを訴[うった]えているすべてのことについて、今日[きょう]、あなたの前[まえ]で弁明[べんめい]できることを、わたしは幸[さいわ]いに思[おも]う。"
  3: "とりわけ、あなたはユダヤ人[じん]のすべての慣習[かんしゅう]と論争[ろんそう]に通[つう]じておられるからである。それゆえ、どうか寛[ひろ]い心[こころ]で、わたしの話[はなし]を聞[き]いていただきたい。"
  4: "わたしの幼[おさな]い時[とき]からの生活[せいかつ]が、初[はじ]めから自分[じぶん]の民[たみ]の間[あいだ]で、またエルサレムでどのようなものであったかは、ユダヤ人[じん]ならだれでも知[し]っている。"
  5: "彼[かれ]らは、わたしを初[はじ]めから知[し]っていて、証言[しょうげん]しようと思[おも]えばできるのだが、わたしはわたしたちの宗教[しゅうきょう]のうちで最[もっ]とも厳格[げんかく]な派[は]に従[したが]って、ファリサイ派[は]として生[い]きてきたのである。"
  6: "そして今[いま]も、わたしが裁[さば]かれているのは、神[かみ]がわたしたちの先祖[せんぞ]に与[あた]えられた約束[やくそく]の希望[きぼう]のためである。"
  7: "わたしたちの十二部族[じゅうにぶぞく]は、昼[ひる]も夜[よる]も熱心[ねっしん]に神[かみ]に仕[つか]えながら、この約束[やくそく]が成就[じょうじゅ]することを望[のぞ]んでいる。アグリッパ王[おう]よ、その希望[きぼう]のために、わたしはユダヤ人[じん]たちに訴[うった]えられているのである。"
  8: "神[かみ]が死者[ししゃ]を復活[ふっかつ]させることを、あなたがたはなぜ信[しん]じがたいと考[かんが]えるのか。"
  9: "わたし自身[じしん]もかつて、ナザレのイエスの名[な]に反[はん]して、多[おお]くのことを行[おこな]うべきだと思[おも]っていた。"
  10: "そして、エルサレムでそれを実行[じっこう]した。祭司長[さいしちょう]たちから権限[けんげん]を受[う]けて、わたしは多[おお]くの聖徒[せいと]たちを牢[ろう]に閉[と]じ込[こ]め、彼[かれ]らが殺[ころ]されるときには、それに賛成[さんせい]の票[ひょう]を投[とう]じた。"
  11: "また、すべての会堂[かいどう]でたびたび彼[かれ]らを罰[ばっ]し、冒涜[ぼうとく]するよう強要[きょうよう]した。彼[かれ]らに対[たい]する怒[いか]りが激[はげ]しくなると、遠[とお]くの町々[まちまち]にまで追[お]いかけて行[い]った。"
  12: "そのような中[なか]、わたしは祭司長[さいしちょう]たちから権限[けんげん]と委任[いにん]を受[う]けて、ダマスコへ向[む]かっていた。"
  13: "王[おう]よ、その道[みち]の真昼[まひる]に、太陽[たいよう]の輝[かがや]きよりも明[あか]るく、わたしと一緒[いっしょ]に歩[ある]いていた者[もの]たちの周[まわ]りを照[て]らす光[ひかり]を、わたしは天[てん]から見[み]た。"
  14: "わたしたちは皆[みな]、地[ち]に倒[たお]れた。そのとき、わたしは、ヘブライ語[ご]でわたしに語[かた]りかける声[こえ]を聞[き]いた。『<j>サウロ、サウロ、なぜわたしを迫害[はくがい]するのか。とげの付[つ]いた棒[ぼう]に逆[さか]らって蹴[け]るのは、あなたにとって苦[くる]しいことだ。</j>』"
  15: "わたしは『主[しゅ]よ、あなたはどなたですか』と言[い]った。すると、主[しゅ]が言[い]われた。『<j>わたしは、あなたが迫害[はくがい]しているイエスである。</j>"
  16: "<j>しかし、起[お]き上[あ]がって、自分[じぶん]の足[あし]で立[た]ちなさい。わたしがあなたに現[あらわ]れたのは、あなたを仕[つか]える者[もの]とし、あなたがわたしを見[み]たこと、また、これからわたしがあなたに示[しめ]すことの証人[しょうにん]とするためである。</j>"
  17: "<j>わたしは、民[たみ]と異邦人[いほうじん]からあなたを救[すく]い出[だ]す。今[いま]、あなたを彼[かれ]らのもとへ遣[つか]わす。</j>"
  18: "<j>それは、彼[かれ]らの目[め]を開[ひら]き、暗[くら]やみから光[ひかり]へ、サタンの支配[しはい]から神[かみ]のもとへと向[む]きを変[か]えさせ、わたしを信[しん]じる信仰[しんこう]によって罪[つみ]の赦[ゆる]しを受[う]け、聖[せい]なる者[もの]とされた人々[ひとびと]の間[あいだ]で嗣業[しぎょう]を受[う]けさせるためである。</j>』"
  19: "そこで、アグリッパ王[おう]よ、わたしは天[てん]からの幻[まぼろし]に逆[さか]らわなかった。"
  20: "まずダマスコの人々[ひとびと]に、次[つ]いでエルサレムの人々[ひとびと]に、さらにユダヤの全[ぜん]地方[ちほう]と異邦人[いほうじん]に、悔[く]い改[あらた]めて神[かみ]に立[た]ち返[かえ]り、悔[く]い改[あらた]めにふさわしい行[おこな]いをするように告[つ]げ知[し]らせてきた。"
  21: "こういうわけで、ユダヤ人[じん]たちはわたしを神殿[しんでん]で捕[と]らえ、殺[ころ]そうとした。"
  22: "しかし、わたしは神[かみ]の助[たす]けを受[う]けて、今日[きょう]に至[いた]るまで立[た]ち続[つづ]け、小[ちい]さな者[もの]にも大[おお]きな者[もの]にも証[あかし]してきた。預言者[よげんしゃ]たちとモーセが語[かた]った、これから起[お]こることのほかには、何[なに]も語[かた]っていない。"
  23: "すなわち、キリストが苦[くる]しみを受[う]け、死者[ししゃ]の復活[ふっかつ]の初[はじ]めとして、民[たみ]にも異邦人[いほうじん]にも光[ひかり]を告[つ]げ知[し]らせる、ということである。」"
  24: "パウロがこう弁明[べんめい]していると、フェストが大[おお]きな声[こえ]で言[い]った。「パウロ、あなたは狂[くる]っている。多[おお]くの学問[がくもん]があなたを狂[くる]わせている。」"
  25: "パウロは言[い]った。「フェスト閣下[かっか]、わたしは狂[くる]ってはいない。真実[しんじつ]と正気[しょうき]の言葉[ことば]を語[かた]っているのである。"
  26: "王[おう]はこれらのことをよく知[し]っておられる。だから、わたしは王[おう]の前[まえ]で大胆[だいたん]に語[かた]っているのである。これらのことが王[おう]に隠[かく]れているとは、わたしは思[おも]わない。このことは片隅[かたすみ]で起[お]こったことではないからである。"
  27: "アグリッパ王[おう]よ、あなたは預言者[よげんしゃ]たちを信[しん]じておられるか。信[しん]じておられることを、わたしは知[し]っている。」"
  28: "アグリッパはパウロに言[い]った。「わずかの間[あいだ]に、わたしをキリスト者[しゃ]にしようというのか。」"
  29: "パウロは言[い]った。「少[すこ]しであれ多[おお]くであれ、あなただけでなく、今日[きょう]わたしの話[はなし]を聞[き]いているすべての人[ひと]が、この鎖[くさり]のほかは、わたしと同[おな]じ者[もの]となることを、わたしは神[かみ]に願[ねが]っている。」"
  30: "そこで、王[おう]と総督[そうとく]とベルニケ、また彼[かれ]らとともに座[すわ]っていた者[もの]たちは立[た]ち上[あ]がった。"
  31: "そして、その場[ば]を離[はな]れてから互[たが]いに話[はな]し合[あ]い、「この人[ひと]は、死[し]にも束縛[そくばく]にも値[あたい]することを何[なに]もしていない」と言[い]った。"
  32: "アグリッパはフェストに言[い]った。「この人[ひと]は、カエサルに上訴[じょうそ]さえしなければ、釈放[しゃくほう]されることができたのだが。」〔そこで総督[そうとく]は、彼[かれ]をカエサルのもとへ送[おく]ることに決[き]めた。〕"

notes:
  2: "ἥγημαι ἐμαυτὸν μακάριον — «почитаю себя счастливым»; 幸いに思う."
  5: "αἵρεσις — «толк, направление»; 派. θρησκεία — «богопочитание, религия»; 宗教."
  7: "τὸ δωδεκάφυλον — «двенадцать колен»; 十二部族. ἐν ἐκτενείᾳ — «с усердием»; 熱心に."
  10: "κατήνεγκα ψῆφον — «подал голос (за смерть)»; 賛成の票を投じた."
  11: "τιμωρῶν — «карая, мучая»; 罰し. βλασφημεῖν — «хулить»; 冒涜する."
  13: "ὑπὲρ τὴν λαμπρότητα τοῦ ἡλίου — «ярче солнечного света»; 太陽の輝きよりも明るく."
  14: "σκληρόν σοι πρὸς κέντρα λακτίζειν — «трудно тебе идти против рожна»: κέντρα — острия на пастушьем биче, в который упирается лягающийся вол; とげの付いた棒. Слова Господа — красным (14–18)."
  15: "Ἐγώ εἰμι — «Я есмь»; わたしは…である. Вопрос Павла «主よ、あなたはどなたですか» — его собственная речь, не красная."
  16: "προχειρίσασθαι — «поставить, назначить»; 立てる. ὑπηρέτης — «служитель»; 仕え手."
  18: "κληρονομία/κλῆρος — «наследие, удел»; 嗣業. ἡγιασμένοι — «освящённые»; 聖なる者とされた人々."
  20: "μετανοεῖν καὶ ἐπιστρέφειν ἐπὶ τὸν θεόν — «покаяться и обратиться к Богу»; 悔い改めて神に立ち返る."
  22: "ἐπικουρία — «помощь, поддержка»; 助け."
  23: "εἰ παθητὸς ὁ Χριστός — «что Христос должен пострадать»; キリストが苦しみを受ける. πρῶτος ἐξ ἀναστάσεως νεκρῶν — «первый из воскресения мёртвых»; 死者の復活の初め."
  24: "Μαίνῃ — «безумствуешь»; 狂っている. τὰ πολλὰ γράμματα — «большая учёность»; 多くの学問."
  25: "κράτιστε — почётное обращение к сановнику; 閣下, как в Лк 1:3. σωφροσύνη — «здравомыслие»; 正気."
  28: "Ἐν ὀλίγῳ — букв. «в малом (времени/труде)»; двусмысленность сохранена: わずかの間に («почти убедил»)."
  29: "καὶ ἐν ὀλίγῳ καὶ ἐν μεγάλῳ — «и в малом и в великом»; 少しであれ多くであれ. παρεκτὸς τῶν δεσμῶν τούτων — «кроме этих уз»; この鎖のほかは."
  32: "В критическом тексте стих кончается на Ἀπολελύσθαι ἐδύνατο… Καίσαρα; церковный текст (Елизаветинская, jp-joc) добавляет «и тако суди игемон послати его к кесарю» — 〔…〕."
