# jp-box, Деяния святых апостолов, глава 26. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий (gr-lxx-byz) — свидетель; расхождения — в 〔…〕 и notes.
# jp-ni не использовался.
#
# Глава 26: речь Павла перед Агриппой (1–29), «почти убедил» (28), оправдание
# Феста и Агриппы (30–32).
# Красное — только голос Господа в рассказе о Дамаске (14–18); вопрос Павла
# «主よ、あなたはどなたですか» (15) — не красный, как и вся остальная его речь.
# Речь Павла идёт от 2-го стиха до 29-го: 「…」 открывается в 2 и закрывается в 29;
# внутри неё цитаты — 『…』.
# 26:32 — 〔…〕: в критическом тексте нет заключительной фразы о решении игемона.

