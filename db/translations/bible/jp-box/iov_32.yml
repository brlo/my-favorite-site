verses:
  1: "こうして、彼[かれ]の三人[さんにん]の友[とも]は、もはやヨブに答[こた]えることをやめて黙[だま]った。ヨブが自分[じぶん]たちの前[まえ]で正[ただ]しい者[もの]と見[み]えていたからである。"
  2: "そこで、ラムの一族[いちぞく]の者[もの]、アウシティスの地[ち]のブズ人[じん]バラキエルの子[こ]エリフは怒[いか]りを発[はっ]した。彼はヨブに対して激[はげ]しく怒った。ヨブが自分[じぶん]を主[しゅ]の前[まえ]で正[ただ]しい者[もの]としたからである。"
  3: "また彼は三人[さんにん]の友[とも]にも激しく怒った。彼らがヨブに反論[はんろん]することができず、ヨブを不敬[ふけい]な者[もの]としたからである。"
  4: "エリフはヨブに答[こた]えるのを控[ひか]えていた。彼[かれ]らが自分[じぶん]より年[とし]を重[かさ]ねていたからである。"
  5: "エリフは、三人[さんにん]の男[おとこ]たちの口[くち]に答[こた]えがないのを見[み]て、その怒[いか]りが燃[も]え上[あ]がった。"
  6: "バラキエルの子[こ]エリフ、ブズ人[じん]は答[こた]えて言[い]った。「わたしは歳[とし]の若[わか]い者[もの]であり、あなたがたは年[とし]を重[かさ]ねた者[もの]である。それゆえ、わたしの知識[ちしき]をあなたがたに告[つ]げるのを恐[おそ]れて、黙[だま]っていた。"
  7: "わたしは、『語[かた]るのは時[とき]であり、多[おお]くの年[とし]を経[へ]た者[もの]が知恵[ちえ]を知[し]っている』と言[い]っていた。"
  8: "しかし、人[ひと]の内[うち]には霊[れい]があり、全能者[ぜんのうしゃ]の息[いき]が教[おし]えるのである。"
  9: "長[なが]く生[い]きた者[もの]が知恵[ちえ]ある者[もの]ではなく、年[とし]寄[よ]りが裁[さば]きを知[し]っているのでもない。"
  10: "それゆえ、わたしは言[い]った。『わたしに聞[き]け。わたしは自分[じぶん]の知[し]っていることをあなたがたに告[つ]げる。』"
  11: "わたしの言葉[ことば]に耳[みみ]を傾[かたむ]けよ。あなたがたが聞[き]いている間[あいだ]に、わたしは語[かた]ろう。あなたがたが言葉を吟味[ぎんみ]し終[お]えるまで。"
  12: "わたしはあなたがたにまで目[め]を向[む]けて悟[さと]った。しかし見[み]よ、あなたがたのうちには、ヨブを責[せ]め、その言葉[ことば]に答[こた]える者[もの]は一人[ひとり]もいなかった。"
  13: "あなたがたが、『わたしたちは知恵[ちえ]を見[み]つけた。主[しゅ]に寄[よ]り添[そ]って』と言[い]わないために。"
  14: "しかし、あなたがたは一人[ひとり]の人間[にんげん]に、そのような言葉[ことば]を語[かた]ることを許[ゆる]したのだ。"
  15: "彼[かれ]らは恐[おそ]れをなして、もはや答[こた]えず、彼らから言葉[ことば]は古[ふる]びた。"
  16: "わたしは待[ま]った。彼[かれ]らが語[かた]らなかったからである。彼らが立[た]ち止[ど]まったまま、答[こた]えなかったからである。わたしも一部[いちぶ]を答[こた]えよう。」"
  17: "エリフは答[こた]えて言[い]った。"
  18: "「わたしは再[ふたた]び語[かた]る。わたしは言葉[ことば]に満[み]ちているからである。わたしの腹[はら]の霊[れい]がわたしを苦[くる]しめるからである。"
  19: "わたしの腹[はら]は、縛[しば]られた新[あたら]しい酒[さけ]の皮袋[かわぶくろ]が煮[に]え立[た]つようであり、鍛冶屋[かじや]のふいごが破[やぶ]れたようである。"
  20: "わたしは語[かた]ろう。そうして唇[くちびる]を開[ひら]いて、休[やす]むために。"
  21: "わたしは人[ひと]を恥[は]じない。また、人間[にんげん]を敬[うやま]って遠慮[えんりょ]もしない。"
  22: "わたしは人[ひと]の顔色[かおいろ]をうかがって媚[こび]ることを知[し]らないからである。そうでなければ、虫[むし]がわたしを食[く]い尽[つ]くすだろう。」"

notes:
  1: "Повествование. Ἡσύχασαν δὲ καὶ οἱ τρεῖς φίλοι αὐτοῦ — 彼の三人の友は黙った (ἡσυχάζω — «умолкать»). ἔτι ἀντειπεῖν Ιωβ — もはやヨブに答えることをやめて (ἀντιλέγω — «возражать»). ἦν γὰρ Ιωβ δίκαιος ἐναντίον αὐτῶν — ヨブが自分たちの前で正しい者と見えていたから (ἐναντίον — «в глазах»). В слав. в начале стиха добавлено «И умолча иов словесы» — это конец гр. 31:40, уже переведённый там; не дублируется."
  2: "Повествование. ὠργίσθη δὲ Ελιους ὁ τοῦ Βαραχιηλ ὁ Βουζίτης — ブズ人バラキエルの子エリフは怒りを発した (ὀργίζομαι — «гневаться»; Βουζίτης — ブズ人). ἐκ τῆς συγγενείας Ραμ τῆς Αυσίτιδος χώρας — ラムの一族の者、アウシティスの地の (συγγένεια — «родство, племя»; Αὐσῖτις — земля Уц). διότι ἀπέφηνεν ἑαυτὸν δίκαιον ἐναντίον κυρίου — ヨブが自分を主の前で正しい者としたから (ἀποφαίνω — «объявлять»)."
  3: "Повествование. καὶ κατὰ τῶν τριῶν δὲ φίλων ὠργίσθη σφόδρα — 三人の友にも激しく怒った. οὐκ ἠδυνήθησαν ἀποκριθῆναι ἀντίθετα Ιωβ — ヨブに反論することができず (ἀντίθετα — «противное, возражение»). ἔθεντο αὐτὸν εἶναι ἀσεβῆ — ヨブを不敬な者とした (τίθημι — «полагать»; ἀσεβής — 不敬な者)."
  4: "Повествование. Ελιους δὲ ὑπέμεινεν δοῦναι ἀπόκρισιν Ιωβ — エリフはヨブに答えるのを控えていた (ὑπομένω — «ждать, выдерживать»). ὅτι πρεσβύτεροι αὐτοῦ εἰσιν ἡμέραις — 彼らが自分より年を重ねていたから (πρεσβύτερος — «старший»; ἡμέραις — «по дням»). В слав. добавлено в скобках «друзие его» — пояснение, в LXX нет."
  5: "Повествование. καὶ εἶδεν Ελιους ὅτι οὐκ ἔστιν ἀπόκρισις ἐν στόματι τῶν τριῶν ἀνδρῶν — 三人の男たちの口に答えがないのを見て (ἀπόκρισις — «ответ»). ἐθυμώθη ὀργὴ αὐτοῦ — その怒りが燃え上がった (θυμόω — «воспламенять гнев»)."
  6: "Елиуй. ὑπολαβὼν δὲ Ελιους … εἶπεν — エリフは答えて言った: формула вне кавычек, речь открывается здесь и продолжается в гл. 33. Νεώτερος μέν εἰμι τῷ χρόνῳ — わたしは歳の若い者であり (νεώτερος — «моложе»). ὑμεῖς δέ ἐστε πρεσβύτεροι — あなたがたは年を重ねた者 (πρεσβύτερος). διὸ ἡσύχασα φοβηθεὶς τοῦ ὑμῖν ἀναγγεῖλαι τὴν ἐμαυτοῦ ἐπιστήμην — それゆえ、わたしの知識を告げるのを恐れて黙っていた (ἐπιστήμη — «знание»; ἀναγγέλλω — «возвещать»)."
  7: "Елиуй. εἶπα δὲ ὅτι Ὁ χρόνος ἐστὶν ὁ λαλῶν — わたしは『語るのは時である』と言っていた: своя прежняя мысль, поэтому 『…』. ἐν πολλοῖς δὲ ἔτεσιν οἴδασιν σοφίαν — 多くの年を経た者が知恵を知っている (ἔτος — «год»)."
  8: "Елиуй. ἀλλὰ πνεῦμά ἐστιν ἐν βροτοῖς — しかし人の内には霊がある (βροτός — «смертный»). πνοὴ δὲ παντοκράτορός ἐστιν ἡ διδάσκουσα — 全能者の息が教える (πνοή — «дыхание»; παντοκράτωρ — 全能者)."
  9: "Елиуй. οὐχ οἱ πολυχρόνιοί εἰσιν σοφοί — 長く生きた者が知恵ある者ではなく (πολυχρόνιος — «многолетний»). οὐδ᾿ οἱ γέροντες οἴδασιν κρίμα — 年寄りが裁きを知っているのでもない (κρίμα — «суд, правда»)."
  10: "Елиуй. διὸ εἶπα Ἀκούσατέ μου — それゆえ、わたしは『わたしに聞け』と言った: своя речь, 『…』. ἀναγγελῶ ὑμῖν ἃ οἶδα — 自分の知っていることを告げる (ἀναγγέλλω). В слав. в конце добавлено «внушите глаголы моя» — это начало гр. 32:11, по делению gr не дублируется."
  11: "Елиуй. ἐνωτίζεσθέ μου τὰ ῥήματα — わたしの言葉に耳を傾けよ (ἐνωτίζομαι — «внимать»). ἐρῶ γὰρ ὑμῶν ἀκουόντων — あなたがたが聞いている間に語ろう. ἄχρι οὗ ἐτάσητε λόγους — あなたがたが言葉を吟味し終えるまで (ἐτάζω — «испытывать»). В слав. добавлено «и даже вас уразумею» — это начало гр. 32:12."
  12: "Елиуй. καὶ μέχρι ὑμῶν συνήσω — あなたがたにまで目を向けて悟った (συνίημι — «понимать»). ἰδοὺ οὐκ ἦν τῷ Ιωβ ἐλέγχων — 見よ、ヨブを責める者はいなかった (ἐλέγχω — «обличать»). ἀνταποκρινόμενος ῥήματα αὐτοῦ ἐξ ὑμῶν — あなたがたのうちから、その言葉に答える者 (ἀνταποκρίνομαι — «отвечать»)."
  13: "Елиуй. ἵνα μὴ εἴπητε Εὕρομεν σοφίαν — あなたがたが『わたしたちは知恵を見つけた』と言わないために (εὑρίσκω — «находить»). κυρίῳ προσθέμενοι — 主に寄り添って (προστίθημι — «прилагать, присоединять»; тёмное место; слав. «Господеви приложившеся»; у Синодального иначе, по масоретскому тексту)."
  14: "Елиуй. ἀνθρώπῳ δὲ ἐπετρέψατε λαλῆσαι τοιαῦτα ῥήματα — あなたがたは一人の人間に、そのような言葉を語ることを許した (ἐπιτρέπω — «позволять»)."
  15: "Елиуй. ἐπτοήθησαν, οὐκ ἀπεκρίθησαν ἔτι — 彼らは恐れをなして、もはや答えず (πτοέω — «устрашать»). ἐπαλαίωσαν ἐξ αὐτῶν λόγους — 彼らから言葉は古びた (παλαιόω — «делать старым»; слав. «обетшаша от них словеса»: слова иссякли)."
  16: "Елиуй. ὑπέμεινα, οὐ γὰρ ἐλάλησαν — わたしは待った、彼らが語らなかったから (ὑπομένω). ὅτι ἔστησαν, οὐκ ἀπεκρίθησαν — 彼らが立ち止まったまま、答えなかったから. В слав. добавлено «яко да отвещаю и аз часть» — «чтобы и мне ответить часть»; в LXX нет, переведено в конце стиха."
  17: "Повествование. Ὑπολαβὼν δὲ Ελιους λέγει — エリフは答えて言った: вводная формула, вне кавычек; речь после неё открывается заново (ср. 32:6)."
  18: "Елиуй. Πάλιν λαλήσω — わたしは再び語る (πάλιν — «снова»). πλήρης γάρ εἰμι ῥημάτων — わたしは言葉に満ちているから (πλήρης — «полный»). ὀλέκει γάρ με τὸ πνεῦμα τῆς γαστρός — わたしの腹の霊がわたしを苦しめる (ὀλέκω — «губить»; γαστήρ — «живот, чрево»)."
  19: "Елиуй. ἡ δὲ γαστήρ μου ὥσπερ ἀσκὸς γλεύκους ζέων δεδεμένος — わたしの腹は、縛られた新しい酒の皮袋が煮え立つよう (ἀσκός — «мех»; γλεῦκος — «сусло, молодое вино»; ζέω — «кипеть»). ὥσπερ φυσητὴρ χαλκέως ἐρρηγώς — 鍛冶屋のふいごが破れたよう (φυσητήρ — «раздувальный мех»; χαλκεύς — «кузнец»; ῥήγνυμι — «разрывать»)."
  20: "Елиуй. λαλήσω, ἵνα ἀναπαύσωμαι — わたしは語ろう、そうして休むために (ἀναπαύω — «успокаивать»). ἀνοίξας τὰ χείλη — 唇を開いて (χεῖλος — «губа»)."
  21: "Елиуй. ἄνθρωπον γὰρ οὐ μὴ αἰσχυνθῶ — わたしは人を恥じない (αἰσχύνομαι — «стыдиться»). ἀλλὰ μὴν οὐδὲ βροτὸν οὐ μὴ ἐντραπῶ — また、人間を敬って遠慮もしない (ἐντρέπομαι — «стыдиться, уважать»; βροτός — «смертный»)."
  22: "Елиуй. οὐ γὰρ ἐπίσταμαι θαυμάσαι πρόσωπον — わたしは人の顔色をうかがって媚びることを知らない (θαυμάζω πρόσωπον — «лицеприятствовать»; ἐπίσταμαι — «уметь»). εἰ δὲ μή, καὶ ἐμὲ σῆτες ἔδονται — そうでなければ、虫がわたしを食い尽くすだろう (σής — «моль»; ἐσθίω — «есть»). Речь закрывается здесь; продолжение — в гл. 33."
