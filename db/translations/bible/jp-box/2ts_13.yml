# jp-box, 2-я Царств, глава 13. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет,
# jp-ni (под авторским правом) не использовался.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 13: Амнон и Тамара (1–14), изгнание Тамары (15–19), её запустение (20),
# гнев Давида (21–22), стрижка овец у Авессалома и убийство Амнона (23–29),
# ложный слух и плач (30–36), бегство Авессалома в Гессур (37–39).
# Переводить точно, без эвфемизмов и без грубости: ταπεινόω — 辱しめる,
# κοιμάομαι μετά — 寝る, вопрос «был с тобою» в ст. 20 передан прямо.
# Речь — 「…」: Ионадав (4–5, 32–33), Амнон (4, 6, 9–11, 15), Фамарь (12–13, 16),
# Авессалом (20, 24, 26, 28), Давид (7, 25–26), вестник (30), стража (34).
# Вложенная речь — 『…』 (5 — слова к отцу, 28 — приказ убить,
# 33 — слова, которых не надо держать в сердце).
# Красного нет.
# Гл. 13 — по новому паритету: csl и LXX совпадают по объёму, слав. вставок,
# которых нет в LXX, здесь нет; ru местами короче (13:21, 27, 34, 37, 39) —
# отмечено в notes. 〔…〕 не ставим.
# Сносок ⟨…⟩ нет: 処女, 側女, 長子, シケル уже в корпусе.
# jp-ni не использовался.

