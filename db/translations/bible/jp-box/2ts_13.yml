verses:
  1: "その後[あと]、ダビデの子[こ]アブサロムには、非常[ひじょう]に美[うつく]しい妹[いもうと]があった。名[な]はタマルといい、ダビデの子アムノンが彼女[かのじょ]を愛[あい]した。"
  2: "アムノンは妹[いもうと]タマルのことで悩[なや]み、病[や]むほどであった。彼女は処女[しょじょ]であったから、彼女に何[なに]かをするのは、アムノンの目[め]には大[おお]きすぎることのように思[おも]えた。"
  3: "アムノンには友[とも]があった。名[な]はヨナダブといい、ダビデの兄[あに]サマアの子[こ]であった。ヨナダブは非常[ひじょう]に賢[かしこ]い人[ひと]であった。"
  4: "彼はアムノンに言[い]った。「なぜ、あなたは朝[あさ]ごとに弱[よわ]っているのか、王[おう]の子[こ]よ。わたしに話[はな]してくれないのか。」アムノンは言った。「わたしは、兄弟[きょうだい]アブサロムの妹[いもうと]タマルを愛[あい]している。」"
  5: "ヨナダブは言った。「あなたは寝床[ねどこ]に横[よこ]になって、病気[びょうき]のふりをしなさい。父[ちち]があなたを見[み]に来[き]たら、こう言いなさい。『妹のタマルに来てもらって、わたしに食[た]べ物[もの]を食[た]べさせてください。わたしの目の前[まえ]で料理[りょうり]をして、わたしがそれを見て、彼女[かのじょ]の手[て]から食べられるようにしてください』と。」"
  6: "アムノンは横[よこ]になって、病気のふりをした。王[おう]が彼を見に来[き]たので、アムノンは王に言[い]った。「妹[いもうと]タマルにここへ来てもらって、わたしの目の前で焼[や]きパンを二[ふた]つ焼[や]いてください。彼女[かのじょ]の手[て]から食[た]べたいのです。」"
  7: "ダビデはタマルのところへ人[ひと]を遣[つか]わして言った。「あなたの兄[あに]アムノンの家[いえ]へ行[い]って、彼のために食事[しょくじ]を作[つく]りなさい。」"
  8: "タマルは兄[あに]アムノンの家へ行[い]った。アムノンは横[よこ]になっていた。彼女[かのじょ]は生地[きじ]を取[と]って練[ね]り、彼の目[め]の前[まえ]で焼きパンを作って、そのパンを焼[や]いた。"
  9: "彼女は焼[や]き皿[ざら]を取って、その中身[なかみ]を彼の前[まえ]に置[お]いた。しかし、彼は食[た]べようとしなかった。アムノンは言[い]った。「すべての男[おとこ]をわたしの前から出[だ]しなさい。」そこで、すべての男が彼の前から出て行[い]った。"
  10: "アムノンはタマルに言[い]った。「その食[た]べ物[もの]を奥[おく]の部屋[へや]へ持[も]って来[き]なさい。わたしはあなたの手[て]から食べる。」タマルは自分[じぶん]が作[つく]った焼きパンを持って、兄[あに]アムノンの寝室[しんしつ]へ入[はい]って行った。"
  11: "彼女[かのじょ]が彼のそばに持って行って食[た]べさせようとすると、彼は彼女を捕[つか]まえて言[い]った。「さあ、わたしと寝[ね]なさい、妹[いもうと]よ。」"
  12: "彼女は言った。「いいえ、兄[あに]よ、わたしを辱[はずかし]めないでください。イスラエルではこのようなことはされないのですから。この愚[おろ]かなことをしないでください。"
  13: "そして、わたしは自分[じぶん]の恥[はじ]をどこへ持って行けばよいのだろう。あなたはイスラエルの愚[おろ]かな者[もの]の一人[ひとり]のようになってしまう。今[いま]、どうか王[おう]に話[はな]してください。王はわたしをあなたから離[はな]さないはずだ。」"
  14: "しかし、アムノンは彼女[かのじょ]の声[こえ]を聞[き]こうとしなかった。彼は彼女を力[ちから]ずく押[お]さえつけ、辱[はずかし]め、彼女と寝[ね]た。"
  15: "アムノンは彼女を激[はげ]しく憎[にく]んだ。彼女を憎むその憎しみは、彼女を愛[あい]したその愛よりも大[おお]きかった。アムノンは彼女に言[い]った。「立[た]って、行[い]け。」"
  16: "タマルは言った。「いいえ、兄[あに]よ。わたしを追[お]い出[だ]すというその後[あと]の悪[わる]さは、あなたがわたしにした初[はじ]めの悪よりも大[おお]きいのです。」しかし、アムノンは彼女の声[こえ]を聞こうとしなかった。"
  17: "アムノンは、自分の家[いえ]を預[あず]かっている若者[わかもの]を呼[よ]んで言った。「この女[おんな]をわたしのところから外[そと]へ追い出し、彼女の後[あと]ろの戸[と]を閉[し]めなさい。」"
  18: "彼女は色[いろ]とりどりの長[なが]い衣[ころも]を着[き]ていた。王[おう]の娘[むすめ]たちは、処女[しょじょ]のうちは、このような上着[うわぎ]を着ていたからである。アムノンの召使[めしつかい]は彼女を外[そと]へ連[つ]れ出[だ]して、後ろの戸を閉[し]めた。"
  19: "タマルは灰[はい]を取って頭[あたま]に載[の]せ、身[み]に着ていた色とりどりの衣を裂[さ]き、両手[りょうて]を頭に置[お]いて、泣[な]き叫[さけ]びながら行[い]った。"
  20: "兄[あに]のアブサロムは彼女に言った。「あなたの兄アムノンがあなたと寝[ね]たのか。今[いま]は、妹[いもうと]よ、黙[だま]っていなさい。彼はあなたの兄なのだから。このことを心[こころ]に掛[か]けて語[かた]ってはならない。」タマルは、兄アブサロムの家[いえ]で、やもめのようにして住[す]んだ。"
  21: "ダビデ王[おう]はこれらのすべての言葉[ことば]を聞[き]いて、激[はげ]しく怒[いか]った。しかし、アムノンの心[こころ]を悲[かな]しませなかった。彼を愛[あい]していたからである。彼が自分の長子[ちょうし]であったからだ。"
  22: "アブサロムはアムノンに、悪[わる]いことも善[よ]いことも一切[いっさい]語[かた]らなかった。アブサロムはアムノンを憎[にく]んでいたからである。アムノンが自分の妹[いもうと]タマルを辱[はずかし]めた、そのことのゆえに。"
  23: "二年[にねん]の月日[つきひ]が過[す]ぎたころ、アブサロムのために羊[ひつじ]の毛[け]を刈[か]る者[もの]たちが、エフライムに近[ちか]いベラソルにいた。アブサロムは王のすべての子[こ]らを呼[よ]んだ。"
  24: "アブサロムは王のところへ来[き]て言った。「ご覧[らん]ください。今[いま]、あなたの僕[しもべ]のところで羊の毛を刈っている。どうか、王とその家来[けらい]たちも、僕のところへお越[こ]しください。」"
  25: "王はアブサロムに言った。「いいや、息子[むすこ]よ、わたしたちが皆[みな]行[い]くことはない。あなたに負担[ふたん]をかけないためだ。」アブサロムは王を強[し]いて誘[さそ]ったが、王は行こうとせず、彼を祝福[しゅくふく]した。"
  26: "アブサロムは言った。「そうでなければ、どうか、わたしの兄[あに]アムノンを、わたしたちと一緒[いっしょ]に行[い]かせてください。」王は彼に言った。「なぜ、彼があなたと一緒に行かなければならないのか。」"
  27: "アブサロムが王を強いて言わせたので、王はアムノンと王のすべての子[こ]らを彼と一緒に行かせた。アブサロムは王の宴会[えんかい]のような酒宴[しゅえん]を設[もう]けた。"
  28: "アブサロムは自分の若者[わかもの]たちに命[めい]じて言った。「アムノンの心[こころ]がぶどう酒[しゅ]で和[やわ]らいだのを見[み]て、わたしがあなたがたに『アムノンを打[う]ち殺[ころ]せ』と言ったなら、恐[おそ]れてはならない。わたしがあなたがたに命じているのではないか。雄々[おお]しくあれ、力[ちから]ある者[もの]の子[こ]となれ。」"
  29: "アブサロムの若者たちは、アブサロムが命じたとおりにアムノンにした。王の子[こ]らは皆立[た]ち上[あ]がり、それぞれ自分[じぶん]のラバに乗[の]って逃[に]げた。"
  30: "彼らがまだ道[みち]にいるうちに、ダビデのもとへ知[し]らせが届[とど]いた。「アブサロムが王の子[こ]らをすべて打[う]ち殺[ころ]し、そのうちの一人[ひとり]も残[のこ]らなかった」と言うのであった。"
  31: "王は立[た]ち上[あ]がり、自分の衣[ころも]を裂[さ]き、地[ち]に伏[ふ]した。王のそばに立[た]っている家来[けらい]たちも皆、自分の衣を裂いた。"
  32: "ダビデの兄[あに]サマアの子[こ]ヨナダブが答[こた]えて言った。「ご主人[しゅじん]である王よ、若者[わかもの]たち、王の子らをすべて殺[ころ]したなどと、お考[かんが]えにならないでください。死[し]んだのはアムノン一人[ひとり]だけだ。アムノンが自分の妹[いもうと]タマルを辱[はずかし]めた日[ひ]から、アブサロムの口[くち]からそのことが離[はな]れなかったのです。」"
  33: "今[いま]、ご主人である王よ、『王の子らは皆死[し]んだ』という言葉を心[こころ]に置[お]かないでください。死んだのはアムノン一人だけなのです。"
  34: "アブサロムは逃[に]げた。見張[みは]りの若者[わかもの]は目[め]を上[あ]げて見[み]ると、なんと、多[おお]くの民[たみ]が山[やま]の側[がわ]から下[くだ]り道[みち]を、彼の後[あと]ろを進[すす]んで来[く]るではないか。見張りは来て王に告[つ]げて言った。「わたしは人々[ひとびと]がホロナイムの道から、山の一方[いっぽう]から来[く]るのを見[み]た。」"
  35: "ヨナダブは王に言った。「ご覧[らん]ください。王の子[こ]らが来[き]た。あなたの僕[しもべ]が言ったとおりになった。」"
  36: "彼が語り終[お]えると、見よ、王の子[こ]らが来て、声[こえ]を上[あ]げて泣[な]いた。王も家来[けらい]たちも皆、非常[ひじょう]に大[おお]きな声で泣いた。"
  37: "アブサロムは逃げて、エミウドの子[こ]トルマイ、ゲシュルの王[おう]のもとへ、マハドの地[ち]へ行[い]った。ダビデ王は自分の息子[むすこ]のために、毎日[まいにち]悲[かな]しんだ。"
  38: "アブサロムは逃げてゲシュルへ行[い]き、そこに三年[さんねん]いた。"
  39: "王[おう]の心[こころ]は、アブサロムの後[あと]を追[お]って出[で]て行[い]くことをやめた。アムノンが死[し]んだことで、慰[なぐさ]められたからである。"

notes:
  1: "ἀδελφὴ καλὴ τῷ εἴδει σφόδρα — сестра, прекрасная видом весьма (τῷ εἴδει — «по виду»). ἠγάπησεν — полюбил. Фамарь — дочь Давида и сестра Авессалома (ср. 3:3), поэтому 妹."
  2: "ἐθλίβετο ὥστε ἀρρωστεῖν — «теснился (скорбел) так, что болеть», т. е. изводился до болезни. ὑπέρογκον ἐν ὀφθαλμοῖς — «непомерным в глазах»; слав. «не удобно бе пред очима». ὅτι παρθένος ἦν — она была девицей."
  3: "ἑταῖρος — друг, товарищ. ἀνὴρ σοφὸς σφόδρα — муж весьма мудрый; здесь σοφός скорее «хитрый, изворотливый» (слав. «мудр», ru «хитрый»), в тексте 賢い."
  4: "τὸ πρωῒ πρωί — «утро за утром» (слав. «утро утро»). ἀσθενής — слабый, больной. οὐκ ἀπαγγελεῖς μοι; — «не расскажешь ли мне?» Ионадав — сын Самаа, брата Давидова."
  5: "Κοιμήθητι … μαλακίσθητι — «ложись и расслабься (притворись больным)». ψωμισάτω με — «пусть накормит меня» (ψωμίζω). βρῶμα — еда, кушанье. κατ᾽ ὀφθαλμούς μου — «на глазах моих»."
  6: "κολλυρίς — лепёшка, печенье (слав. «пряжма»); отсюда 焼きパン. ἠρρώστησεν — заболел; по контексту — притворился больным."
  7: "εἰς τὸν οἶκον — «в дом»; при «послал» имя Тамары стоит в греч., поэтому タマルのところへ. ποίησον αὐτῷ βρῶμα — приготовь ему кушанье."
  8: "σταῖς — тесто, мука (слав. «тесто»). ἐκολλύρισεν — испекла лепёшки. καὶ αὐτὸς κοιμώμενος — «а он лежал» (оборот без глагола)."
  9: "τήγανον — сковорода, противень (焼き皿). κατεκένωσεν ἐνώπιον αὐτοῦ — «выложила перед ним». Ἐξαγάγετε πάντα ἄνδρα — «выведите всякого мужа»."
  10: "ταμίειον — внутренняя комната, кладовая; κοιτῶν — спальня (в слав. оба раза «внутренняя храмина»)."
  11: "ἐπελάβετο αὐτῆς — схватил её (ἐπιλαμβάνομαι). Δεῦρο κοιμήθητι μετ᾽ ἐμοῦ — «иди, ложись со мною»; передано прямо, без смягчения."
  12: "μὴ ταπεινώσῃς με — «не унизь меня» (ταπεινόω); передано 辱しめる, как в Суд 19–20. οὐ ποιηθήσεται οὕτως ἐν Ισραηλ — «так не делается в Израиле» (слав. «не сотворится тако во израили»). ἀφροσύνη — безумие, глупость."
  13: "ποῦ ἀποίσω τὸ ὄνειδός μου; — «куда унесу я позор мой?» εἷς τῶν ἀφρόνων — один из безумных. οὐ μὴ κωλύσῃ με ἀπὸ σοῦ — «не удержит (не откажет) меня от тебя»; слав. «да не отлучит мене от тебе», ru «не откажет отдать меня тебе»."
  14: "ἐκραταίωσεν ὑπὲρ αὐτὴν — «пересилил её» (κραταιόω). ἐταπείνωσεν — унизил, обесчестил. ἐκοιμήθη μετ᾽ αὐτῆς — «спал с нею»; слав. «преспа с нею». Переведено прямо, без эвфемизма и без грубости."
  15: "μῖσος μέγα σφόδρα — ненависть великая весьма; повтор μισεῖν усилен. Ἀνάστηθι καὶ πορεύου — «встань и иди»."
  16: "ἡ κακία ἡ ἐσχάτη ὑπὲρ τὴν πρώτην — «зло последнее больше первого»; слав. «злоба болши есть последняя паче первыя». ἐξαποστεῖλαι — отослать, прогнать."
  17: "τὸ παιδάριον … τὸν προεστηκότα τοῦ οἴκου — «отрок, стоящий во главе дома», т. е. управляющий. ἀπόκλεισον τὴν θύραν ὀπίσω αὐτῆς — «запри дверь за нею»."
  18: "χιτὼν καρπωτός — пёстрая (разноцветная) рубаха, парадная одежда царских дочерей-девиц (слав. «риза испещрена»). λειτουργός — служитель."
  19: "σποδός — пепел (слав. «пепел»). διέρρηξεν — разодрала. ἐπέθηκεν τὰς χεῖρας ἐπὶ τὴν κεφαλήν — жест скорби. ἐπορεύθη πορευομένη καὶ κράζουσα — «шла, идя и вопия» (усилительный оборот)."
  20: "Μὴ Αμνων … ἐγένετο μετὰ σοῦ; — «не Амнон ли … был с тобою?»; евр. оборот о плотском сношении, поэтому прямо 寝た. κώφευσον — «замолчи» (κωφεύω). χηρεύουσα — «вдовствуя»; слав. «вдовствующи», ru «в одиночестве»."
  21: "ἐθυμώθη σφόδρα — разгневался весьма. οὐκ ἐλύπησεν τὸ πνεῦμα Αμνων — «не опечалил духа Амнона», т. е. не огорчил его; слав. «не опечали духа». ὅτι πρωτότοκος — ибо первенец. В ru вторая половина стиха опущена, у LXX и csl она есть."
  22: "ἀπὸ πονηροῦ ἕως ἀγαθοῦ — «от зла до добра», т. е. ничего. ἐπὶ λόγου οὗ ἐταπείνωσεν — «из-за того, что обесчестил»."
  23: "εἰς διετηρίδα ἡμερῶν — «через двухлетие дней», т. е. спустя два года. κείροντες — стригущие овец (κεῖρω; стрижка овец — праздник). Βελασωρ — вероятно Баал-Гацор (слав. «веласор», ru «Ваал-Гацор»)."
  24: "κείρουσιν τῷ δούλῳ σου — безличное «стригут у раба твоего». πορευθήτω … ὁ βασιλεύς — «пусть пойдёт царь»."
  25: "Μὴ δή — «нет уж». οὐ μὴ καταβαρυνθῶμεν ἐπὶ σέ — «не отяготим тебя» (καταβαρύνω). ἐβιάσατο — настойчиво упрашивал (βιάζομαι)."
  26: "Καὶ εἰ μή — «а если нет», т. е. «в таком случае». Ἵνα τί πορευθῇ μετὰ σοῦ; — «зачем ему идти с тобою?»"
  27: "καὶ ἐποίησεν Αβεσσαλωμ πότον κατὰ τὸν πότον τοῦ βασιλέως — «и сделал Авессалом пир по [образцу] пира царя»; в ru этой фразы нет, у LXX и csl есть."
  28: "ἀγαθυνθῇ ἡ καρδία — «развеселится сердце» (ἀγαθύνω). Πατάξατε — «поразите». ἀνδρίζεσθε — «мужайтесь». γίνεσθε εἰς υἱοὺς δυνάμεως — «будьте сынами силы» (слав. «будите в сыны силы»)."
  29: "ἡμίονος — мул, лошак; в тексте ラバ. ἐπεκάθισαν ἀνὴρ ἐπὶ τὴν ἡμίονον — «сел каждый на мула своего»."
  30: "ἡ ἀκοὴ ἦλθεν — «слух дошёл». οὐ κατελείφθη … οὐδὲ εἷς — «не остался ни один»."
  31: "διέρρηξεν τὰ ἱμάτια — разодрал одежды (знак скорби). ἐκοιμήθη ἐπὶ τὴν γῆν — «лёг на землю»."
  32: "μονώτατος — «единственный». ἐπὶ στόματος Αβεσσαλωμ ἦν κείμενος — «лежало на устах Авессалома», т. е. он постоянно говорил об этом; слав. «из уст авессалому не исхождаше»."
  33: "μὴ θέσθω … ἐπὶ τὴν καρδίαν — «пусть не полагает на сердце» (слав. «да не полагает… словесе на сердцы»). ἀλλ᾽ ἢ — «кроме как»."
  34: "σκοπός — страж, дозорный (слав. «страж»). ἐκ πλευρᾶς τοῦ ὄρους ἐν τῇ καταβάσει — «с боку горы при спуске». ὁδὸς Ωρωνην — «дорога Ороны (Хоронаим)». В ru стих короче: у LXX и csl есть вторая половина с донесением стража."
  35: "πάρεισιν — «присутствуют, идут». κατὰ τὸν λόγον τοῦ δούλου σου — «по слову раба твоего»."
  36: "ἐπῆραν τὴν φωνὴν αὐτῶν — «подняли голос свой». ἔκλαυσαν κλαυθμὸν μέγαν — «плакали плачем великим» (внутренний объект)."
  37: "Θολμαι υἱὸς Εμιουδ — Фалмай, сын Емиуда (слав. «фолму сыну емиуда»); в тексте トルマイ. εἰς γῆν Μαχαδ — «в землю Махад»; в ru этого нет. ἐπένθησεν … πάσας τὰς ἡμέρας — «плакал… все дни»."
  38: "ἀπέδρα — убежал (ἀποδιδράσκω). ἔτη τρία — три года."
  39: "ἐκόπασεν τὸ πνεῦμα τοῦ βασιλέως τοῦ ἐξελθεῖν ὀπίσω — «утих дух царя (перестал порываться) выйти за Авессаломом»; слав. «остави царь… изыти вслед», ru «не стал преследовать». παρεκλήθη ἐπὶ Αμνων — «утешился об Амноне»."
