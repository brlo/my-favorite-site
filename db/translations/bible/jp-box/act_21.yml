# jp-box, Деяния апостолов, глава 21. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 21: путь в Иерусалим (1–14), пояс Агава (10–11), прибытие (15–17),
# у Иакова и совет пресвитеров (18–26), мятеж в храме и вмешательство
# тысяченачальника (27–40).
# Красного в главе нет: Христос здесь не говорит; речи Агава, Павла, пресвитеров,
# иудеев и тысяченачальника — не красным.
# 〔…〕 в главе нет: расхождений с базой не нашлось.
# Сноски: нет; 誓願 уже подписано в 18:18.
# jp-ni не использовался.

