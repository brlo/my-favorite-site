verses:
  1: "わたしたちは彼[かれ]らと別[わか]れて船出[ふなで]し、まっすぐにコスへ向[む]かって航[わた]り、翌日[よくじつ]にはロドス、そこからパタラへ行[い]った。"
  2: "フェニキアへ渡[わた]る船[ふね]が見[み]つかったので、それに乗[の]り込[こ]んで出航[しゅっこう]した。"
  3: "キプロスを望[のぞ]み見[み]て、それを左[ひだり]に残[のこ]し、シリアへ向[む]かって航[わた]った。そしてティルスに着[つ]いた。船[ふね]はそこで荷[に]を下[お]ろすことになっていたからである。"
  4: "弟子[でし]たちを探[さが]し出[だ]して、そこに七[なのか]日[か]滞在[たいざい]した。彼[かれ]らは霊[れい]によって、パウロにエルサレムへ上[のぼ]らないようにと言[い]っていた。"
  5: "滞在[たいざい]の日[ひ]が満[み]ちると、わたしたちは出発[しゅっぱつ]した。彼[かれ]らは皆[みな]、妻[つま]や子[こ]どもとともに、町[まち]の外[そと]までわたしたちを見送[みおく]ってくれた。そして、浜辺[はまべ]でひざまずいて祈[いの]り、"
  6: "互[たが]いに別[わか]れを告[つ]げた。わたしたちは舟[ふね]に乗[の]り込み、彼[かれ]らは家[いえ]へ帰[かえ]って行[い]った。"
  7: "わたしたちはティルスから航海[こうかい]を終[お]えて、プトレマイスに着[つ]いた。そこで兄弟[きょうだい]たちに挨拶[あいさつ]して、彼[かれ]らのもとに一[いち]日[にち]滞在[たいざい]した。"
  8: "翌日[よくじつ]そこを出[で]てカイサリアに来[き]た。そして、七人[しちにん]の一人[ひとり]である伝道者[でんどうしゃ]ピリポの家[いえ]に入[はい]り、彼[かれ]のもとに滞在[たいざい]した。"
  9: "彼[かれ]には四人[よにん]の娘[むすめ]がいて、いずれも処女[しょじょ]で、預言[よげん]していた。"
  10: "わたしたちが幾日[いくにち]も滞在[たいざい]していると、アガボという名[な]の預言者[よげんしゃ]がユダヤから下[くだ]って来[き]た。"
  11: "彼[かれ]はわたしたちのところへ来[き]て、パウロの帯[おび]を取[と]り、自分[じぶん]の足[あし]と手[て]を縛[しば]り、こう言[い]った。「{聖霊[せいれい]|聖神[せいしん]}がこう言[い]う。『この帯[おび]の持[も]ち主[ぬし]を、ユダヤ人[じん]たちはエルサレムでこのように縛[しば]り、異邦人[いほうじん]の手[て]に引[ひ]き渡[わた]す。』」"
  12: "これを聞[き]いて、わたしたちもその土地[とち]の人々[ひとびと]も、パウロにエルサレムへ上[のぼ]らないようにと頼[たの]んだ。"
  13: "パウロは答[こた]えた。「あなたがたは、なぜ泣[な]いてわたしの心[こころ]を砕[くだ]くのか。わたしは主[しゅ]イエスの御名[みな]のために、エルサレムで縛[しば]られるだけでなく、死[し]ぬことさえ覚悟[かくご]している。」"
  14: "彼[かれ]が聞[き]き入[い]れないので、わたしたちは静[しず]まって、「主[しゅ]の御心[みこころ]がなりますように」と言[い]った。"
  15: "この日[ひ]の後[のち]、わたしたちは旅支度[たびじたく]をして、エルサレムへ上[のぼ]った。"
  16: "カイサリアの弟子[でし]たちも数人[すうにん]、わたしたちと一緒[いっしょ]に来[き]て、わたしたちをムナソンという人[ひと]のところへ案内[あんない]した。彼[かれ]はキプロス人[じん]で、昔[むかし]からの弟子[でし]であり、わたしたちはその家[いえ]に泊[と]まることになっていた。"
  17: "わたしたちがエルサレムに着[つ]くと、兄弟[きょうだい]たちは喜[よろこ]んでわたしたちを迎[むか]えた。"
  18: "翌日[よくじつ]、パウロはわたしたちと一緒[いっしょ]にヤコブのもとへ行[い]った。長老[ちょうろう]たちも皆[みな]集[あつ]まっていた。"
  19: "パウロは彼[かれ]らに挨拶[あいさつ]してから、神[かみ]が自分[じぶん]の務[つと]めによって異邦人[いほうじん]の間[あいだ]に行[おこな]ったことを、一[ひと]つ一[ひと]つ詳[くわ]しく語[かた]った。"
  20: "彼[かれ]らはこれを聞[き]いて、神[かみ]をほめたたえた。そしてパウロに言[い]った。「兄弟[きょうだい]よ、あなたも見[み]ているとおり、ユダヤ人[じん]の中[なか]には信[しん]じた者[もの]が幾万[いくまん]もいて、皆[みな]、律法[りっぽう]に熱心[ねっしん]な者[もの]たちである。"
  21: "ところが、あなたは異邦[いほう]にいるすべてのユダヤ人[じん]に、モーセに背[そむ]くことを教[おし]え、子[こ]どもに割礼[かつれい]を施[ほどこ]さず、慣習[かんしゅう]にも従[したが]わないように言[い]っている、と彼[かれ]らは伝[つた]え聞[き]いている。"
  22: "では、どうしたらよいのか。あなたが来[き]たことは必[かなら]ず彼[かれ]らの耳[みみ]に入[はい]る。"
  23: "だから、わたしたちが言[い]うとおりにしなさい。わたしたちのところに、誓願[せいがん]を果[は]たそうとしている者[もの]が四人[よにん]いる。"
  24: "この人[ひと]たちを連[つ]れて行[い]き、彼[かれ]らとともに身[み]を清[きよ]め、彼[かれ]らの費[つい]えを負担[ふたん]して、頭[あたま]を剃[そ]らせてやりなさい。そうすれば、あなたについて伝[つた]え聞[き]いていることは何[なに]も根拠[こんきょ]がなく、あなた自身[じしん]も律法[りっぽう]を守[まも]って歩[あゆ]んでいることが、皆[みな]に分[わ]かる。"
  25: "ただ、信[しん]じた異邦人[いほうじん]たちについては、わたしたちはすでに書[か]き送[おく]って、偶像[ぐうぞう]に供[そな]えた物[もの]と、血[ち]と、絞[し]め殺[ころ]した物[もの]と、淫行[いんこう]を避[さ]けるようにと決[き]めた。」"
  26: "そこでパウロはこの人[ひと]たちを連[つ]れて行[い]き、翌日[よくじつ]、彼[かれ]らとともに身[み]を清[きよ]めて神殿[しんでん]に入[はい]り、清[きよ]めの期間[きかん]が満[み]ちる日[ひ]と、彼[かれ]ら一人[ひとり]一人[ひとり]のために献[ささ]げ物[もの]が捧[ささ]げられる時[とき]を告[つ]げた。"
  27: "七[なのか]日[か]の期間[きかん]が終[お]わろうとしていたとき、アジア州[しゅう]から来[き]ていたユダヤ人[じん]たちが、パウロが神殿[しんでん]にいるのを見[み]て、群衆[ぐんしゅう]全体[ぜんたい]を騒[さわ]がせ、彼[かれ]に手[て]をかけた。"
  28: "そして叫[さけ]んだ。「イスラエルの人々[ひとびと]よ、助[たす]けてくれ。この男[おとこ]こそ、至[いた]るところで、民[たみ]と律法[りっぽう]とこの場所[ばしょ]に逆[さか]らうことを皆[みな]に教[おし]えている者[もの]だ。そのうえ、ギリシャ人[じん]を神殿[しんでん]に引[ひ]き入[い]れて、この聖[せい]なる場所[ばしょ]を汚[けが]したのだ。」"
  29: "彼[かれ]らは、エフェソ人[じん]トロフィモがパウロと一緒[いっしょ]に町[まち]にいるのを前[まえ]に見[み]ていたので、パウロが彼[かれ]を神殿[しんでん]に引[ひ]き入[い]れたのだと思[おも]ったのである。"
  30: "町中[まちじゅう]が揺[ゆ]れ動[うご]き、民[たみ]が駆[か]け集[あつ]まった。人々[ひとびと]はパウロを捕[つか]まえ、神殿[しんでん]の外[そと]へ引[ひ]きずり出[だ]した。すると、たちまち門[もん]が閉[と]ざされた。"
  31: "彼[かれ]らがパウロを殺[ころ]そうとしていると、エルサレムの町[まち]全体[ぜんたい]が騒[さわ]ぎに包[つつ]まれているとの知[し]らせが、部隊[ぶたい]の千人隊長[せんにんたいちょう]に届[とど]いた。"
  32: "千人隊長[せんにんたいちょう]はすぐに兵士[へいし]たちと百人隊長[ひゃくにんたいちょう]たちを連[つ]れて、駆[か]け下[お]りて行[い]った。人々[ひとびと]は千人隊長[せんにんたいちょう]と兵士[へいし]たちを見[み]て、パウロを打[う]つのをやめた。"
  33: "そこで千人隊長[せんにんたいちょう]が近[ちか]づいてパウロを捕[つか]まえ、二[ふた]つの鎖[くさり]で縛[しば]るように命[めい]じた。そして、彼[かれ]が何者[なにもの]で、何[なに]をしたのかを尋[たず]ねた。"
  34: "群衆[ぐんしゅう]の中[なか]では、ある者[もの]はこれと、ある者[もの]はあれと叫[さけ]んでいた。千人隊長[せんにんたいちょう]は騒[さわ]ぎのため真相[しんそう]を知[し]ることができず、パウロを兵営[へいえい]へ連[つ]れて行[い]くように命[めい]じた。"
  35: "パウロが階段[かいだん]に差[さ]しかかったとき、群衆[ぐんしゅう]の押[お]し迫[せま]る力[ちから]のため、兵士[へいし]たちに担[かつ]がれて行[い]くことになった。"
  36: "多[おお]くの民[たみ]が後[あと]に従[したが]って、「殺[ころ]せ」と叫[さけ]んでいたからである。"
  37: "パウロは兵営[へいえい]に引[ひ]き入[い]れられようとしていたとき、千人隊長[せんにんたいちょう]に言[い]った。「何[なに]かあなたに話[はな]してもよいですか。」千人隊長[せんにんたいちょう]は言[い]った。「あなたはギリシャ語[ご]が分[わ]かるのか。"
  38: "では、あなたは、この前[まえ]、叛乱[はんらん]を起[お]こし、四千人[よんせんにん]の暗殺者[あんさつしゃ]を荒野[こうや]へ連[つ]れ出[だ]した、あのエジプト人[じん]ではないのか。」"
  39: "パウロは言[い]った。「わたしはユダヤ人[じん]で、キリキアのタルソの出身[しゅっしん]です。名[な]も知[し]られた町[まち]の市民[しみん]です。どうか、民[たみ]に話[はな]すことをお許[ゆる]しください。」"
  40: "千人隊長[せんにんたいちょう]が許[ゆる]すと、パウロは階段[かいだん]に立[た]ち、民[たみ]に向[む]かって手[て]を振[ふ]った。大[おお]きな静[しず]けが訪[おとず]れると、彼[かれ]はヘブライ語[ご]で語[かた]りかけて言[い]った。"

notes:
  1: "εὐθυδρομήσαντες — «держа прямо курс»; まっすぐに航った. Кос, Родос, Патара — コス, ロドス, パタラ."
  3: "ἀναφάναντες τὴν Κύπρον — «показался Кипр»; キプロスを望み見て. εὐώνυμον — «левый»; 左. ἀποφορτιζόμενον τὸν γόμον — «разгружал груз»; 荷を下ろす."
  4: "διὰ τοῦ πνεύματος — «по внушению Духа»; 霊によって. Речь не Христа: не красная."
  5: "προπεμπόντων — «провожали»; 見送る. θέντες τὰ γόνατα ἐπὶ τὸν αἰγιαλόν — 浜辺でひざまずいて."
  6: "ἀπησπασάμεθα ἀλλήλους — «простились друг с другом»; 互いに別れを告げた."
  7: "Πτολεμαΐς — プトレマイス. ἀσπασάμενοι τοὺς ἀδελφούς — 兄弟たちに挨拶して."
  8: "Φίλιππος ὁ εὐαγγελιστής — один из семи диаконов (ср. 6:5); 七人の一人, 伝道者. ὁ εὐαγγελιστής передано 伝道者, чтобы не путать с 福音."
  9: "παρθένοι — девы; 処女. Дочери пророчествовали — 預言する娘たち."
  11: "ζώνη — пояс; пророческое действие Агава. Речь Святого Духа передана вложенной цитатой 『…』, не красная. τὸ πνεῦμα τὸ ἅγιον — 聖霊 (пара с 聖神)."
  13: "ἑτοίμως ἔχω — «готов»; 覚悟している. Речь Павла — не красная."
  14: "ἡσυχάσαμεν — «успокоились, замолчали»; 静まって. τὸ θέλημα τοῦ κυρίου — 主の御心."
  15: "ἐπισκευασάμενοι — «снарядившись»; 旅支度をして."
  16: "Μνάσων — кипрянин, ἀρχαῖος μαθητής, «из первых (давних) учеников»; 昔からの弟子. ξενισθῶμεν — 泊まる."
  20: "μυριάδες — «десятки тысяч»; 幾万. ζηλωταὶ τοῦ νόμου — 律法に熱心な者."
  21: "κατηχήθησαν — «им внушено, они наслышаны»; 伝え聞いている. ἀποστασία ἀπὸ Μωϋσέως — モーセに背く."
  23: "εὐχή — обет; вероятно, назорейский (не стричь волос, не пить вина, не касаться мёртвого); 誓願, слово уже с пояснением в 18:18. Четыре человека — 四人."
  24: "ἁγνίσθητι — «очистись»; ξυρήσονται — «обрить голову»; 頭を剃る. δαπάνησον ἐπ' αὐτοῖς — «оплати их расходы»; 費えを負担する."
  25: "Постановление апостольского собора (ср. 15:20,29): идоложертвенное, кровь, удавленина, блуд; 偶像に供えた物, 血, 絞め殺した物, 淫行."
  27: "οἱ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι — приехавшие из провинции Асия иудеи; アジア州から来ていたユダヤ人."
  28: "ἱερόσυλοι — «святотатцы»; 神殿の物を盗んだ者. βλασφημοῦντας τὴν θεόν — 女神を冒涜する."
  31: "χιλίαρχος — «тысяченачальник», командир когорты (σπεῖρα); 千人隊長, 部隊."
  33: "ἁλύσεσι δυσί — «двумя цепями»; 二つの鎖."
  35: "ἀναβαθμοί — ступени; 階段. βαστάζεσθαι — «нести на руках»; 担がれて."
  36: "Αἶρε αὐτόν — «убери его», крик толпы; 殺せ. Не красная речь."
  38: "σικάριοι — «сикарии», от sica (кинжал): убийцы, носившие кинжал под плащом; 暗殺者. ὁ Αἰγύπτιος — エジプト人."
  39: "Ταρσεὺς τῆς Κιλικίας — キリキアのタルソの出身. οὐκ ἀσήμου πόλεως — «немалоизвестного города»; 名も知られた町."
  40: "Ἑβραῒς διάλεκτος — еврейский (арамейский) язык; ヘブライ語. κατασείσας τῇ χειρί — 手を振って."
