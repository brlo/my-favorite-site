# jp-box, Неемия, глава 12. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); церковнославянский (csl-ru) — второй
# свидетель церковного текста (новый паритет, docs/japanese-bible.md):
# слав. чтения входят в основной текст без 〔…〕, вариант LXX — в notes.
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет;
# jp-ni (под авторским правом) не использовался.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление
# на клаузы — по греческому.
# Глава 12: священники и левиты, пришедшие с Зоровавелем (1–7); левиты
# и чреды (8–9); родословие первосвященников (10–11); главы священников
# при Иоакиме (12–21); запись левитов и священников (22–26); освящение
# стены и шествие двух хоров (27–43); обеспечение служителей (44–47).
# Прямой речи нет; повествование в 31–43 — от первого лица. Красного нет.
# Нумерация по gr: 47 стихов, совпадает с csl/ru.
# Особенность базы: в gr-lxx-byz ст. 4–6 и 9 пусты («.»), ряд стихов
# (2–3, 8, 25, 28–30, 36, 39, 47) полнее в csl; недостающее взято из csl
# по паритету и отмечено в notes.
# 〔…〕 нет.
# Сносок ⟨…⟩ нет: 神殿, 祭司, レビ人, 歌い手, 門衛, 琴, 竪琴, 安息日 уже в корпусе.
# jp-ni не использовался.

