verses:
  1: "ゼルバベル、すなわちサラテルの子[こ]とイエシュアとともに上[のぼ]って来[き]た祭司[さいし]たちとレビ人[びと]は次[つぎ]のとおりである。セラヤ、エレミヤ、エズラ、"
  2: "アマリヤ、マルク、ハトシュ、"
  3: "シェカニヤ、レフム、メレモト、"
  4: "アダイヤ、ギネトン、アビヤ、"
  5: "ミヤミン、マアデヤ、ビルガ、"
  6: "シェマヤ、ヨアリブ、エダヤ、"
  7: "サル、アモク、ヘルキヤ、エダヤ。これらはイエシュアの時代[じだい]の祭司[さいし]たちの長[かしら]たちとその兄弟[きょうだい]たちである。"
  8: "レビ人[びと]は、イエシュア、バヌイ、カドミエル、シェレブヤ、ユダ、マタニヤであり、彼[かれ]とその兄弟[きょうだい]たちは務[つと]めの先頭[せんとう]に立[た]った。"
  9: "またバクブキヤとウンニ、すなわち彼[かれ]らの兄弟[きょうだい]たちは、彼[かれ]らと向[む]かい合[あ]って、日[ひ]ごとの組[くみ]で務[つと]めた。"
  10: "イエシュアはヨアキムを生[う]み、ヨアキムはエリアシブを生[う]み、エリアシブはヨイアダを生[う]んだ。"
  11: "ヨイアダはヨナタンを生[う]み、ヨナタンはヤドアを生[う]んだ。"
  12: "ヨアキムの時代[じだい]には、その兄弟[きょうだい]たちである祭司[さいし]たちと氏族[しぞく]の長[かしら]たちがいた。セラヤの家[いえ]からはメラヤ、エレミヤの家[いえ]からはハナニヤ、"
  13: "エズラの家[いえ]からはメシュラム、アマリヤの家[いえ]からはヨハナン、"
  14: "マルクの家[いえ]からはヨナタン、シェカニヤの家[いえ]からはヨセフ、"
  15: "ハリムの家[いえ]からはアドナ、メラヨトの家[いえ]からはヘルカイ、"
  16: "アダイの家[いえ]からはゼカリヤ、ギネトンの家[いえ]からはメシュラム、"
  17: "アビヤの家[いえ]からはゼクリ、ミヤミンの家[いえ]からはマアダイ、またピルタイ、"
  18: "ビルガの家[いえ]からはシャムア、シェマヤの家[いえ]からはヨナタン、"
  19: "ヨアリブの家[いえ]からはマテナイ、エダヤの家[いえ]からはウジ、"
  20: "サライの家[いえ]からはカライ、アモクの家[いえ]からはエベル、"
  21: "ヘルキヤの家[いえ]からはハシャビヤ、エダヤの家[いえ]からはナタナエル。"
  22: "エリアシブ、ヨイアダ、ヨハナン、ヤドアの時代[じだい]のレビ人[びと]たち、すなわち氏族[しぞく]の長[かしら]たちは記録[きろく]され、祭司[さいし]たちもペルシアの王[おう]ダリウスの治世[ちせい]に記録[きろく]された。"
  23: "レビの子[こ]ら、氏族[しぞく]の長[かしら]たちは、エリアシブの子[こ]ヨハナンの時代[じだい]まで、日誌[にっし]の書[しょ]に記録[きろく]された。"
  24: "レビ人[びと]の長[かしら]たちは、ハシャビヤ、シェレブヤ、イエシュア、およびカドミエルの子[こ]らとその兄弟[きょうだい]たちであり、彼[かれ]らと向[む]かい合[あ]って、神[かみ]の人[ひと]ダビデの命令[めいれい]に従[したが]い、組[くみ]ごとに代[か]わって賛美[さんび]し、ほめたたえた。"
  25: "マタニヤ、バクブキヤ、アブデヤ、メシュラム、タルモン、アクブは、門[もん]を守[まも]る門衛[もんえい]たちであり、私[わたし]が門衛[もんえい]たちを集[あつ]めたときの者[もの]たちである。"
  26: "彼[かれ]らは、イエシュアの子[こ]、ヨセデクの子[こ]であるヨアキムの時代[じだい]と、ネヘミヤおよび祭司[さいし]で律法学者[りっぽうがくしゃ]であるエズラの時代[じだい]の者[もの]たちである。"
  27: "エルサレムの城壁[じょうへき]の奉献[ほうけん]のとき、人[ひと]々[びと]はレビ人[びと]をその住[す]む所[ところ]から呼[よ]び集[あつ]め、彼[かれ]らをエルサレムに連[つ]れて来[き]て、感謝[かんしゃ]と歌[うた]をもって、シンバル、琴[こと]、竪琴[たてごと]を鳴[な]らして、奉献[ほうけん]と喜[よろこ]びを行[おこな]おうとした。"
  28: "また歌[うた]い手[て]たちの子[こ]らが、周辺[しゅうへん]の地方[ちほう]から、またネトファの村[むら]々[むら]からエルサレムに集[あつ]まった。"
  29: "また畑[はたけ]から、すなわちベト・ギルガルから、ゲバとアズマベトの地方[ちほう]から集[あつ]まった。歌[うた]い手[て]たちはエルサレムの周[まわ]りに自分[じぶん]たちの村[むら]々[むら]を建[た]てていたからである。"
  30: "祭司[さいし]たちとレビ人[びと]たちは身[み]を清[きよ]め、民[たみ]、門[もん]、城壁[じょうへき]を清[きよ]めた。"
  31: "私[わたし]はユダの首長[しゅちょう]たちを城壁[じょうへき]の上[うえ]に上[のぼ]らせ、賛美[さんび]のための二[ふた]つの大[おお]きな合唱隊[がっしょうたい]を置[お]いた。一[ひと]つは城壁[じょうへき]の上[うえ]を右[みぎ]側[がわ]から糞[ふん]の門[もん]へ向[む]かって進[すす]んだ。"
  32: "彼[かれ]らの後[あと]を、ホシャヤとユダの首長[しゅちょう]たちの半数[はんすう]が進[すす]んだ。"
  33: "またアザリヤ、エズラ、メシュラム、"
  34: "ユダ、ベニヤミン、シェマヤ、エレミヤ、"
  35: "また祭司[さいし]の子[こ]らのうちから、ラッパを携[たずさ]えた者[もの]たちがいた。ゼカリヤ、すなわちヨナタンの子[こ]、シェマヤの子[こ]、マタニヤの子[こ]、ミカヤの子[こ]、ザクルの子[こ]、アサフの子[こ]。"
  36: "また彼[かれ]の兄弟[きょうだい]たち、すなわちシェマヤ、ウジエル、ギラライ、マアイ、ナタナエル、ユダ、ハナニは、神[かみ]の人[ひと]ダビデの歌[うた]をもって賛美[さんび]するために進[すす]んだ。律法学者[りっぽうがくしゃ]エズラが彼[かれ]らの前[まえ]にいた。"
  37: "彼[かれ]らは泉[いずみ]の門[もん]のところで、自分[じぶん]たちの向[む]かいにあるダビデの町[まち]の階段[かいだん]を、城壁[じょうへき]の上[うえ]り道[みち]に沿[そ]って、ダビデの家[いえ]の上[うえ]を通[とお]って、東[ひがし]の水[みず]の門[もん]まで上[のぼ]った。"
  38: "第二[だいに]の賛美[さんび]の組[くみ]は、彼[かれ]らと向[む]かい合[あ]って進[すす]んだ。私[わたし]はその後[あと]を、民[たみ]の半数[はんすう]とともに城壁[じょうへき]の上[うえ]を、炉[ろ]の塔[とう]の上[うえ]から広[ひろ]い城壁[じょうへき]まで進[すす]んだ。"
  39: "またエフライムの門[もん]の上[うえ]、イシャナの門[もん]、魚[さかな]の門[もん]、ハナンエルの塔[とう]、エマフの塔[とう]を過[す]ぎ、羊[ひつじ]の門[もん]に至[いた]るまで進[すす]み、牢[ろう]の門[もん]のところで止[と]まった。"
  40: "二[ふた]つの賛美[さんび]の組[くみ]は神[かみ]の家[いえ]に立[た]った。私[わたし]と、私[わたし]とともにいた長官[ちょうかん]たちの半数[はんすう]もそこに立[た]った。"
  41: "祭司[さいし]たち、すなわちエルヤキム、マアセヤ、ベニヤミン、ミカヤ、エリオエナイ、ゼカリヤ、ハナニヤがラッパを吹[ふ]いた。"
  42: "またマアセヤ、シェマヤ、エレアザル、ウジ、ヨハナン、マルキヤ、エラム、エゼルがいた。歌[うた]い手[て]たちの声[こえ]は聞[き]こえ、彼[かれ]らは数[かぞ]えられた。"
  43: "その日[ひ]、彼[かれ]らは大[おお]きな犠牲[ぎせい]を捧[ささ]げて大[おお]いに喜[よろこ]んだ。神[かみ]が彼[かれ]らを大[おお]いに喜[よろこ]ばせたからである。彼[かれ]らの妻[つま]たちも子[こ]どもたちも喜[よろこ]び、エルサレムの喜[よろこ]びの声[こえ]は遠[とお]くまで聞[き]こえた。"
  44: "その日[ひ]、人[ひと]々[びと]は宝物[たからもの]の倉[くら]の上[うえ]に男[おとこ]たちを置[お]き、初穂[はつほ]、十分[じゅうぶん]の一[いち]、および町[まち]々[まち]の長[かしら]たちが集[あつ]める分[ぶん]を管理[かんり]させ、それを祭司[さいし]たちとレビ人[びと]たちに与[あた]えさせた。ユダには、立[た]って務[つと]める祭司[さいし]たちとレビ人[びと]たちのゆえの喜[よろこ]びがあったからである。"
  45: "彼[かれ]らは自分[じぶん]たちの神[かみ]の見張[みは]りと清[きよ]めの見張[みは]りを守[まも]り、歌[うた]い手[て]たちと門衛[もんえい]たちの務[つと]めも、ダビデとその子[こ]ソロモンの命令[めいれい]に従[したが]って守[まも]った。"
  46: "ダビデの時代[じだい]から、アサフは最初[さいしょ]から歌[うた]い手[て]たちの長[かしら]であり、神[かみ]に賛美[さんび]とほめたたえをささげたからである。"
  47: "また全[すべ]てのイスラエルは、ゼルバベルとネヘミヤの時代[じだい]に、歌[うた]い手[て]たちと門衛[もんえい]たちに日[ひ]ごとの分[ぶん]を与[あた]え、レビ人[びと]に聖[せい]なる分[ぶん]をささげ、レビ人[びと]たちはアロンの子[こ]らにささげた。"

notes:
  1: "οἱ ἀναβαίνοντες — восшедшие, пришедшие (ἀναβαίνω). Ζοροβαβελ υἱὸς Σαλαθιηλ — Зоровавель, сын Салафиила. Ἰησοῦ — Иисус (первосвященник), в тексте イエシュア. Σαραια — Сераия; Ιερμια — Иеремия; Εσδρα — Ездра."
  2: "Αμαρια — Амария; Μαλουχ — Маллух. Слав. добавляет Аттуй (Хаттуш) — в LXX нет, внесено по паритету."
  3: "Σεχενια — Шехания. Слав. добавляет Реум (Рехум) и Маримоф (Меремоф) — в LXX нет, внесено."
  4: "В gr-lxx-byz стих пуст («.»). По слав.: Адаия (Иддо), Генафон (Гиннефой), Авия. Синод. «Иддо, Гиннефой, Авия»."
  5: "В gr-lxx-byz стих пуст («.»). По слав.: Миамин, Маадиа (Маадия), Велга (Вилга)."
  6: "В gr-lxx-byz стих пуст («.»). По слав.: Семиа (Шемаия), Иоиарив, Идиа (Иедаия)."
  7: "Σαλου — Саллу; Αμουκ — Амок; Χελκια — Хелкия; Ωδουια — Иедаия. Слав. «сии началницы священников и братия их во дни иисуса»."
  8: "Левиты: Иисус, Вануй, Кадмиил, Саравия, Иуда, Махания. ἐπὶ τῶν χειρῶν — «при руках», т. е. под началом; слав. «при руках той». В слав. вместо Иуды и Махании — Иодай и Матфания; держимся слав."
  9: "В gr-lxx-byz стих пуст («.»). По слав.: Вакбукия и Анай (Унний), братья их, напротив них, в дневные чреды."
  10: "ἐγέννησεν — родил (родословие). Ελιασιβ — Елиашив; Ιωδαε — Иоиада."
  11: "Ιωναθαν — Ионафан; Ιαδου — Иаддуй (слав. «адуа»)."
  12: "ἐν ἡμέραις Ιωακιμ — во дни Иоакима. ἀδελφοὶ αὐτοῦ οἱ ἱερεῖς — братья его, священники. τῷ Σαραια Μαραια — у Сераии Мераия (слав. «амариа» — иное чтение)."
  13: "τῷ Εσδρα Μεσουλαμ — у Ездры Мешуллам; τῷ Αμαρια Ιωαναν — у Амарии Иоханан."
  14: "τῷ Μαλουχ Ιωναθαν — у Маллуха Ионафан; τῷ Σεχενια Ιωσηφ — у Шехании Иосиф."
  15: "τῷ Αρεμ Αδνας — у Харима Адна; τῷ Μαριωθ Ελκαι — у Мераиофа Хелкай."
  16: "τῷ Αδδαι Ζαχαριας — у Адды Захария; τῷ Γαναθων Μοσολλαμ — у Гиннефона Мешуллам."
  17: "Текст испорчен: в LXX «Авии Зехрий, Вениамину во времена Фелетия», в слав. «Авии Зехрий, Миамину Маадай, Фелетию». По слав. читаем: Авия — Зихрий, Миямин — Маадай, далее Пилтай (Фелетий); дом его в обоих свидетельствах не назван."
  18: "τῷ Βαλγα Σαμουε — у Вилги Шаммуй; τῷ Σεμεια Ιωναθαν — у Шемаии Ионафан."
  19: "τῷ Ιωιαριβ Μαθθαναι — у Иоиарива Мафнай; τῷ Ιδια Οζι — у Иедаии Уззий."
  20: "τῷ Σαλλαι Καλλαι — у Саллая Каллай; τῷ Αμουκ Αβεδ — у Амока Евер."
  21: "τῷ Ελκια Ασαβιας — у Хелкии Хашавия; τῷ Ιεδειου Ναθαναηλ — у Иедаии Нафанаил."
  22: "γεγραμμένοι ἄρχοντες πατριῶν — записанные главы отечеств. Слав. добавляет «и Иоа» перед Иохананом — в LXX нет. βασιλεία Δαρείου τοῦ Πέρσου — царствование Дария Персидского."
  23: "βιβλίον λόγων τῶν ἡμερῶν — книга словес дней, т. е. летопись. ἕως ἡμερῶν Ιωαναν — до дней Иоханана."
  24: "κατεναντίον αὐτῶν — напротив них. εἰς ὑμνεῖν καὶ αἰνεῖν — чтобы воспевать и хвалить. ἐν ἐντολῇ Δαυιδ ἀνθρώπου τοῦ θεοῦ — по заповеди Давида, человека Божия. ἐφημερία πρὸς ἐφημερίαν — чреда к чреде."
  25: "В LXX только «при собрании моём привратников»; слав. добавляет имена: Матфания, Вакбукия, Авдия, Мешуллам, Телмон, Акув. Внесено по паритету. ἐπὶ τῶν φυλακῶν — на страже."
  26: "ἐν ἡμέραις Ιωακιμ υἱοῦ Ἰησοῦ υἱοῦ Ιωσεδεκ — во дни Иоакима, сына Иисуса, сына Иоседека. καὶ ἐν ἡμέραις Νεεμια — и во дни Неемии; слав. без титула, Синод. «областеначальника»."
  27: "ἐγκαίνια — обновление, освящение. θωδαθα — «тода», благодарение (слав. «во хвалении»). κυμβαλίζοντες — играя на кимвалах; ψαλτήρια, κινύραι — псалтири и кифары, 琴 и 竪琴."
  28: "οἱ υἱοὶ τῶν ᾀδόντων — сыновья певцов. ἀπὸ τῆς περιχώρου κυκλόθεν — из окрестности вокруг. Слав. добавляет «от сел Нетофафских» — в LXX нет, внесено."
  29: "ἀπὸ ἀγρῶν — с полей. Слав. добавляет «от дому (Галгал) и от стран (Гева и Азмавет)» — в LXX нет, внесено. ἐπαύλεις — селения; слав. «окрест Иерусалима», в LXX «в Иерусалиме»."
  30: "ἐκαθαρίσθησαν — очистились. Слав. добавляет «и врата» (ворота) — в LXX нет, внесено."
  31: "ἀνήνεγκα — возвёл (ἀναφέρω). δύο περὶ αἰνέσεως μεγάλους — двух больших [хоров] для хвалы; слав. «два клироса велика». κοπρίας — навозные ворота, 糞の門."
  32: "ὀπίσω αὐτῶν — за ними. Ωσαια — Гошаия (слав. «осаиа»). ἥμισυ ἀρχόντων — половина начальствующих."
  33: "Αζαριας — Азария; Εσδρας — Ездра; Μεσουλαμ — Мешуллам."
  34: "Ιουδα καὶ Βενιαμιν — Иуда и Вениамин; Σαμαια — Шемаия; Ιερμια — Иеремия."
  35: "ἐν σάλπιγξιν — с трубами. Ζαχαριας — Захария; цепь: Ионафан, Шемаия, Матфания, Михей, Закхур, Асаф."
  36: "Σαμαια — Шемаия; Οζιηλ — Озииил. Слав. добавляет Гелол, Маиа, Нафанаил, Иуда, Ананий — в LXX нет, внесено. Ездра книжник — в LXX в конце ст. 36, в слав. в ст. 37; следуем LXX."
  37: "πύλη τοῦ αιν — ворота Аин (тёмное слово; слав. «врата источника»). κλίμακες πόλεως Δαυιδ — ступени города Давида. ἀνάβασις τοῦ τείχους — восход стены. πύλη τοῦ ὕδατος — Водяные ворота."
  38: "περὶ αἰνέσεως ἡ δευτέρα — вторая [чреда] хвалы. πύργος τῶν θεννουριμ — башня печей (слав. «столп фануримля»). τεῖχος πλατύ — широкая стена."
  39: "πύλη Εφραιμ — ворота Ефрема. πύλη τῆς ισανα — ворота Ишана, т. е. Старые (слав. «врата старая»). ἰχθυηρά — Рыбные ворота. πύργος Ανανεηλ — башня Ананиила. Слав. добавляет «столп Емаф» (башня Меа) — в LXX нет, внесено. πύλη τῆς προβατικῆς — Овечьи ворота. πύλη τῆς φυλακῆς — ворота стражи (темницы)."
  40: "αἱ δύο τῆς αἰνέσεως — два [хора] хвалы. στρατηγοί — начальствующие, военачальники. Слав. в начале ст. 40 повторяет «стали у ворот стражи» (в LXX это в конце ст. 39) — не дублируем."
  41: "Ελιακιμ — Елиаким; Μαασιας — Маасея; Μιχαιας — Михей; Ελιωηναι — Елиоенай; Ανανιας — Анания. ἐν σάλπιγξιν — с трубами."
  42: "Μαασιας — Маасея; Σεμειας — Шемаия; Ελεαζαρ — Елеазар; Οζι — Уззий; Μελχιας — Малхия; Αιλαμ — Елам; Εζουρ — Езер. ἠκούσθησαν οἱ ᾄδοντες — услышаны были поющие. ἐπεσκέπησαν — были посещены или сочтены; слав. «и иезриа, и соглядани, и восхвалиша» — тёмное место, передано нейтрально."
  43: "θυσιάσματα μεγάλα — великие жертвы. ηὐφράνθησαν — возрадовались. ἀπὸ μακρόθεν — издалека."
  44: "γαζοφυλάκια — сокровищницы, кладовые. ἀπαρχαί — начатки; δεκάται — десятины. μερίδας — части. ἐπὶ τοὺς ἱερεῖς — на священников, т. е. ради них."
  45: "φυλακὰς θεοῦ — стражи Бога; φυλακὰς τοῦ καθαρισμοῦ — стражи очищения. ὡς ἐντολαὶ Δαυιδ — по установлениям Давида."
  46: "ἀπ᾽ ἀρχῆς — изначала. πρῶτος τῶν ᾀδόντων — первый из певцов. ὕμνον καὶ αἴνεσιν — песнь и хвалу."
  47: "διδόντες μερίδας — давая части. λόγον ἡμέρας ἐν ἡμέρᾳ αὐτοῦ — «слово дня в день его», т. е. дневное содержание. ἁγιάζοντες — посвящая, отделяя святыни. Слав. добавляет «и во дни Неемии» — в LXX нет, внесено."
