chapter: 8
draft: true

verses:
  1: "「彼らのふところに、地[ち]のように、鷲[わし]のように、主[しゅ]の家[いえ]に来[く]る。彼らはわたしの契約[けいやく]を破[やぶ]り、わたしの律法[りっぽう]に逆[さから]って不敬[ふけい]を行[おこな]ったからである。"
  2: "彼らはわたしに向[む]かって叫[さけ]ぶ。『神[かみ]よ、わたしたちはあなたを知[し]っています』と。"
  3: "イスラエルは良[よ]いものから背[そむ]き、敵[てき]を追[お]い求[もと]めた。"
  4: "彼らは自分[じぶん]たちのために王[おう]を立[た]てたが、それはわたしによるのでない。君[きみ]を立[た]てたが、わたしはそれを知[し]らない。彼らは自分[じぶん]の銀[ぎん]と金[きん]で自分[じぶん]のために偶像[ぐうぞう]を造[つく]り、滅[ほろ]び去[さ]られることになった。"
  5: "サマリアよ、あなたの子牛[こうし]を打[う]ち砕[くだ]け。わたしの怒[いか]りは彼らに対して燃[も]え上[あ]がった。いつまで彼らは清[きよ]められることができないのか。"
  6: "イスラエルの中[なか]で、それを職人[しょくにん]が造[つく]ったのであって、神[かみ]ではない。サマリアの子牛[こうし]は人[ひと]を惑[まど]わすものとなる。"
  7: "彼らは風[かぜ]に傷[いた]んだものを蒔[ま]き、自分[じぶん]の滅[ほろ]びを刈[か]り取[と]る。穂[ほ]には粉[こな]にする力[ちから]がない。たとえ粉[こな]にしても、ほかの者[もの]たちがそれを食[く]い尽[つ]くす。"
  8: "イスラエルは呑[の]み込[こ]まれた。今[いま]、彼らは諸国民[しょこくみん]の中[なか]で役[やく]に立[た]たない器[うつわ]のようになった。"
  9: "彼らはアッシリアへ上[のぼ]って行[い]った。エフライムはひとりでに芽[め]を出[だ]し、贈[おく]り物[もの]を愛[あい]した。"
  10: "それゆえ、彼らは諸国民[しょこくみん]の間[あいだ]に渡[わた]される。今[いま]、わたしは彼らを受[う]け入[い]れる。彼らはしばらくの間[あいだ]、王[おう]や君[きみ]に油[あぶら]を注[そそ]むことをやめる。"
  11: "エフライムは祭壇[さいだん]を多[おお]くしたが、その祭壇[さいだん]は彼にとって罪[つみ]となった。愛[あい]する祭壇[さいだん]が罪[つみ]となったのである。"
  12: "わたしは彼のために多[おお]くのことを、その定[さだ]めを書[か]き記[しる]す。しかし、それらはほかの者[もの]のものとみなされた。愛[あい]する祭壇[さいだん]もそうである。"
  13: "たとえ彼らがいけにえをささげ、肉[にく]を食[た]べても、主[しゅ]はそれを受[う]け入[い]れない。今[いま]、主[しゅ]は彼らの不法[ふほう]を思[おも]い起[おこ]し、その罪[つみ]を罰[ばっ]される。彼らはエジプトへ帰[かえ]り、アッシリアの中[なか]で汚[けが]れたものを食[た]べる。"
  14: "イスラエルは自分[じぶん]を造[つく]った方[かた]を忘[わす]れ、聖所[せいしょ]を建[た]てた。ユダは防[ぼう]備[び]の堅[かた]い都[みやこ]を多[おお]くした。しかし、わたしは火[ひ]をその都[みやこ]に送[おく]り、その基[もとい]を焼[や]き尽[つ]くす」。"

notes:
  1: "Εἰς κόλπον αὐτῶν ὡς γῆ — «в недро их, как земля» (тёмное место: слав. «в недре их, яко земля непроходима»); ὡς ἀετὸς ἐπ᾿ οἶκον κυρίου — «как орёл над домом Господним» (ἀετός — орёл, 鷲); ἀνθ᾿ ὧν παρέβησαν τὴν διαθήκην μου — «за то, что преступили завет Мой»; κατὰ τοῦ νόμου μου ἠσέβησαν — «против закона Моего нечествовали» (ἀσεβέω)."
  2: "ἐμὲ κεκράξονται — «ко Мне воззовут»; Ὁ θεός, ἐγνώκαμέν σε — «Боже, мы познали Тебя» (слав. «Боже, познахом тя»); слова народа — 『…』."
  3: "ὅτι Ισραηλ ἀπεστρέψατο ἀγαθά — «ибо Израиль отвратился от благого» (ἀποστρέφω); ἐχθρὸν κατεδίωξαν — «врага погнали (устремились за врагом)» (καταδιώκω; слав. «врага прогнаша»)."
  4: "ἑαυτοῖς ἐβασίλευσαν καὶ οὐ δι᾿ ἐμοῦ — «сами себе воцарили, и не через Меня» (βασιλεύω — царствовать); ἦρξαν καὶ οὐκ ἐγνώρισάν μοι — «начальствовали, и не дали Мне знать»; ἐποίησαν ἑαυτοῖς εἴδωλα — «сделали себе идолов»; ὅπως ἐξολεθρευθῶσιν — «чтобы истреблёнными быть» (ἐξολεθρεύω)."
  5: "ἀπότριψαι τὸν μόσχον σου, Σαμάρεια — «отринь (сокруши) тельца твоего, Самария» (ἀποτρίβω — стирать, отбрасывать; слав. «сокруши телца твоего»); παρωξύνθη ὁ θυμός μου ἐπ᾿ αὐτούς — «раздражился гнев Мой на них» (παροξύνω); ἕως τίνος οὐ μὴ δύνωνται καθαρισθῆναι — «доколе не смогут очиститься» (καθαρίζω)."
  6: "ἐν τῷ Ισραηλ — «в Израиле»: в LXX эта часть принадлежит предыдущей фразе (разрыв стиха); καὶ αὐτὸ τέκτων ἐποίησεν — «и его ремесленник сделал» (τέκτων — плотник, мастер); οὐ θεός ἐστιν — «не бог он»; πλανῶν ἦν ὁ μόσχος σου — «вводящим в заблуждение был телец твой» (πλανάω)."
  7: "ἀνεμόφθορα ἔσπειραν — «сеяли повреждённое ветром» (ἀνεμόφθορος — иссушенный ветром; слав. «ветром истлено всеяша»; в ru/МТ «сеяли ветер»); ἡ καταστροφὴ αὐτῶν ἐκδέξεται αὐτά — «погибель их примет их» (καταστροφή — разрушение; ἐκδέχομαι — ожидать, принимать); δράγμα οὐκ ἔχον ἰσχὺν τοῦ ποιῆσαι ἄλευρον — «сноп, не имеющий силы сделать муку» (δράγμα — сноп, горсть; ἄλευρον — мука); ἀλλότριοι καταφάγονται αὐτό — «чужие съедят его»."
  8: "κατεπόθη Ισραηλ — «поглощён Израиль» (καταπίνω); ἐγένετο ἐν τοῖς ἔθνεσιν ὡς σκεῦος ἄχρηστον — «стал среди народов как сосуд негодный» (σκεῦος — сосуд; ἄχρηστος — негодный)."
  9: "αὐτοὶ ἀνέβησαν εἰς Ἀσσυρίους — «они пошли к Ассирийцам»; ἀνέθαλεν καθ᾿ ἑαυτὸν Εφραιμ — «расцвёл (пророс) сам по себе Ефрем» (ἀναθάλλω — зеленеть, 芽を出す; слав. «процвете о себе ефрем»); δῶρα ἠγάπησαν — «дары возлюбили»."
  10: "παραδοθήσονται ἐν τοῖς ἔθνεσιν — «преданы будут народам»; νῦν εἰσδέξομαι αὐτούς — «ныне приму их» (εἰσδέχομαι); κοπάσουσιν μικρὸν τοῦ χρίειν βασιλέα καὶ ἄρχοντας — «успокоятся (перестанут) на малое время помазывать царя и князей» (κόπτω — утомляться, прекращать; χρίω — помазывать)."
  11: "ἐπλήθυνεν Εφραιμ θυσιαστήρια — «умножил Ефрем жертвенники»; εἰς ἁμαρτίας ἐγένοντο αὐτῷ — «в грехи стали ему»; θυσιαστήρια ἠγαπημένα — «жертвенники возлюбленные»."
  12: "καταγράψω αὐτῷ πλῆθος καὶ τὰ νόμιμα αὐτοῦ — «впишу ему множество, и законоположения его» (καταγράφω — записывать; слав. «впишу ему множество, и законная его»); εἰς ἀλλότρια ἐλογίσθησαν — «в чужие вменились»; θυσιαστήρια τὰ ἠγαπημένα — «жертвенники возлюбленные» (в LXX фраза повисает в конце стиха; передано отдельным предложением)."
  13: "ἐὰν θύσωσιν θυσίαν καὶ φάγωσιν κρέα — «если принесут жертву и съедят мясо»; κύριος οὐ προσδέξεται αὐτά — «Господь не примет их» (προσδέχομαι); μνησθήσεται τὰς ἀδικίας αὐτῶν — «вспомнит беззакония их»; ἐκδικήσει τὰς ἁμαρτίας αὐτῶν — «взыщет грехи их»; εἰς Αἴγυπτον ἀπέστρεψαν — «в Египет обратились»; ἐν Ἀσσυρίοις ἀκάθαρτα φάγονται — «в Ассирии нечистое съедят»."
  14: "ἐπελάθετο Ισραηλ τοῦ ποιήσαντος αὐτόν — «забыл Израиль Сотворившего его» (ποιέω — творить); ᾠκοδόμησαν τεμένη — «построили святилища» (τέμενος — священный участок, капище); Ιουδας ἐπλήθυνεν πόλεις τετειχισμένας — «Иуда умножил города укреплённые» (τειχίζω — обносить стеной); ἐξαποστελῶ πῦρ εἰς τὰς πόλεις αὐτοῦ — «пошлю огонь в города его»; καταφάγεται τὰ θεμέλια αὐτῶν — «съест основания их» (θεμέλιος — основание, 基)."
