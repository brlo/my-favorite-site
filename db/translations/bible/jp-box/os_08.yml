# jp-box, Осия, глава 8. Черновик для приёмки.
#
# Нумерация — по славяно-синодальной (решение автора): главы 1–2 и 11–12
# переразбиты относительно гр. модуля (слав. 1:10–11 = прежние 2:1–2;
# слав. 11:12 = прежний 12:1). Текст — с Септуагинты, слав. контроль.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# --- прежние заметки (нумерация по гр.) ---
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по gr-lxx-byz (= jp-ni); в этой главе совпадает со славяно-синодальной.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: 1 орёл над домом Господним, завет нарушен, закон преступлен; 2 «Боже,
# познали Тебя»; 3 Израиль отверг доброе; 4 цари и князья без Бога, серебро и золото
# на идолов; 5–6 телец Самарии, работа ремесленника, не бог; 7 сеяли повреждённое
# ветром, пожнут погибель; 8 поглощён, негодный сосуд; 9–10 пошли к Ассирии, дары,
# «помазать царя и князей»; 11–12 жертвенники во грех, «впишу ему множество»;
# 13 жертвы не приняты, взыщет беззакония, в Египет; 14 забыл Создателя, огонь в города.
# Голоса: 1–14 — одно слово Господа в 「…」 (в 2 слова народа — 『…』; закрывается в 14).
# 8:1: LXX «Εἰς κόλπον αὐτῶν ὡς γῆ, ὡς ἀετὸς ἐπ᾿ οἶκον κυρίου» — тёмное место
# («в недро их, как земля, как орёл на дом Господень»; слав. «в недре их, яко земля
# непроходима»; в ru/МТ «трубу к устам твоим»). Передано буквально по LXX/csl.
# 8:5–6: LXX разрывает фразу между стихами («…очиститься ἐν τῷ Ισραηλ;»), поэтому
# 6-й стих начинается с «イスラエルの中で».
# 8:7: «ἀνεμόφθορα ἔσπειραν» — «сеяли повреждённое ветром» (слав. «ветром истлено
# всеяша»); знаменитое ru/МТ «сеяли ветер — пожнут бурю» — иное чтение, в тексте LXX.
#
