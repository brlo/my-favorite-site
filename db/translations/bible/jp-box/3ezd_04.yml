verses:
  1: "そこで、わたしに遣[つか]わされ、その名[な]をウリエルという天使[てんし]が、わたしに答[こた]えて言[い]った。"
  2: "「あなたの心[こころ]はこの世[よ]にあって迷[まよ]い出[で]た。あなたはいと高[たか]き方[かた]の道[みち]を極[きわ]めようとしているからである。」わたしは答[こた]えた。"
  3: "「そのとおりです、ご主人[しゅじん]さま。」彼はわたしにこう言[い]った。「わたしはあなたに三[みっ]つの道[みち]を示[しめ]し、三[みっ]つのたとえをあなたの前[まえ]に置[お]くために遣[つか]わされた。"
  4: "あなたがそのうちの一[ひと]つをわたしに示[しめ]すなら、わたしもあなたに、あなたが見[み]たいと願[ねが]う道[みち]を示[しめ]し、悪[あ]しき心[こころ]がどこから来[く]るかを教[おし]えよう。」"
  5: "わたしは言[い]った。「お話[はな]しください、ご主人[しゅじん]さま。」彼はわたしに言[い]った。「行[い]って、火[ひ]の重[おも]さをわたしに量[はか]ってみよ。あるいは風[かぜ]の息[いき]を測[はか]り、過[す]ぎ去[さ]った日[ひ]を引[ひ]き返[かえ]せ。」"
  6: "わたしは答[こた]えて言[い]った。「人[ひと]のうち、誰[だれ]があなたの尋[たず]ねることを行[おこな]えるでしょうか。」"
  7: "彼はわたしに言[い]った。「もしわたしがあなたに、『海[うみ]の心[こころ]のうちに幾[いく]つの住[す]まいがあり、深淵[しんえん]の初[はじ]めに幾[いく]つの泉[いずみ]があり、天[てん]の大空[おおぞら]の上[うえ]に幾[いく]つの水脈[すいみゃく]があり、楽園[らくえん]の境[さかい]はどこにあるか』と尋[たず]ねたなら、"
  8: "あなたはわたしに、『わたしは深淵[しんえん]に下[お]りたことがなく、よみにもまだ行[い]ったことがなく、天[てん]にものぼったことがない』と答[こた]えたであろう。"
  9: "しかし今[いま]、わたしはそれについて尋[たず]ねたのではなく、火[ひ]と風[かぜ]と、あなたが過[す]ごしてきた日[ひ]について尋[たず]ねたのだ。あなたはこれらのものなしにはありえない。それなのにあなたは、これらについて何[なに]ひとつ答[こた]えなかった。」"
  10: "彼はわたしに言[い]った。「あなたは、あなたのものであり、あなたとともに育[そだ]ったものさえ知[し]ることができない。"
  11: "まして、あなたの器[うつわ]がどうしていと高[たか]き方[かた]の道[みち]を入[い]れられるだろうか。すでに外[そと]なる世[よ]が腐[くさ]っているのに、わたしの目[め]の前[まえ]に明[あき]らかな腐[くさ]りを見分[みわ]けることなど、できるだろうか。」"
  12: "わたしは彼に言[い]った。「わたしたちは、まだ生[い]きながらにして不敬[ふけい]のうちに生[い]き、耐[た]え忍[しの]びながら、なぜなのかも知[し]らずにいるよりは、むしろ生[う]まれなかったほうがよかったのです。」"
  13: "彼はわたしに答[こた]えて言[い]った。「わたしは行[い]って、野[の]の木[き]の森[もり]へ行[い]き、そこで木々[きぎ]が相談[そうだん]した。"
  14: "こう言[い]ってである。『さあ、行[い]って海[うみ]に戦[いくさ]を仕掛[しか]けよう。そうすれば海[うみ]はわたしたちに道[みち]を譲[ゆず]り、わたしたちはそこに別[べつ]の森[もり]を造[つく]ることができる。』"
  15: "同[おな]じように海[うみ]の波[なみ]も相談[そうだん]して言[い]った。『行[い]って野[の]の森[もり]に戦[いくさ]を仕掛[しか]けよう。そうしてこれを征服[せいふく]して、そこに自分[じぶん]たちの別[べつ]の場所[ばしょ]を得[え]よう。』"
  16: "しかし森[もり]の企[たくら]みは空[むな]しく終[お]わった。火[ひ]が来[き]て森[もり]を焼[や]き尽[つ]くしたからである。"
  17: "海[うみ]の波[なみ]の企[たくら]みも同[おな]じであった。砂[すな]が立[た]ちふさがって波[なみ]をせき止[と]めたからである。"
  18: "あなたが彼らの裁[さば]き手[て]であったなら、どちらを正[ただ]しいとし、どちらを罪[つみ]ある者[もの]としただろうか。」"
  19: "わたしは答[こた]えて言[い]った。「まことに、彼らは空[むな]しい相談[そうだん]に身[み]を委[ゆだ]ねました。地[ち]は森[もり]に与[あた]えられ、海[うみ]にはその波[なみ]を負[お]う場所[ばしょ]が与[あた]えられているからです。」"
  20: "彼はわたしに言[い]った。「あなたは正[ただ]しく裁[さば]いた。なぜ、あなた自身[じしん]をそのように裁[さば]かないのか。"
  21: "地[ち]が森[もり]に、海[うみ]がその波[なみ]に与[あた]えられているように、地[ち]に住[す]む者[もの]たちは地[ち]のものだけを悟[さと]ることができ、天[てん]にある者[もの]たちは天[てん]の高[たか]みにあるものを悟[さと]ることができる。」"
  22: "わたしは答[こた]えて言[い]った。「主[しゅ]よ、わたしに悟[さと]る心[こころ]が与[あた]えられるよう、お願[ねが]いします。"
  23: "わたしはあなたの高[たか]みにあることについて尋[たず]ねたいのではなく、いつもわたしたちのうちにあることについて尋[たず]ねたいのです。なぜイスラエルは異邦人[いほうじん]の嘲[あざけ]りに渡[わた]されたのか。なぜあなたが愛[あい]されたあなたの民[たみ]が、不敬[ふけい]な民[たみ]に渡[わた]されたのか。なぜわたしたちの父祖[ふそ]の律法[りっぽう]は滅[ほろ]びに落[お]とされ、書[か]かれた定[さだ]めはどこにもないのか。"
  24: "わたしたちは蝗[いなご]のようにこの世[よ]を通[とお]り過[す]ぎ、大[おお]きな恐[おそ]れと戦[おのの]きのうちに生[い]きており、あなたの憐[あわ]れみを受[う]け継[つ]ぐにふさわしくありません。"
  25: "しかし、わたしたちが呼[よ]び求めているその名[な]に、あなたは何[なに]をなさるのか。これがわたしが尋[たず]ねたことです。」"
  26: "彼はわたしに答[こた]えて言[い]った。「あなたがさらに調[しら]べるほど、さらに驚[おどろ]くことになる。この世[よ]は過[す]ぎ去[さ]ることを急[いそ]いでいるからである。"
  27: "この世[よ]は、やがて来[く]る時[とき]に正[ただ]しい者[もの]たちに約束[やくそく]されたものを担[にな]うことができない。"
  28: "この世[よ]は不義[ふぎ]と弱[よわ]さに満[み]ちているからである。あなたが尋[たず]ねたことについて、わたしはあなたに告[つ]げよう。悪[あく]はすでに蒔[ま]かれているが、まだその滅[ほろ]びの時[とき]は来[き]ていない。"
  29: "だから、蒔[ま]かれたものが取[と]り除[の]けられず、悪[あく]が蒔[ま]かれた場所[ばしょ]が明[あ]け渡[わた]されないなら、善[ぜん]が蒔[ま]かれた場所[ばしょ]は来[こ]ない。"
  30: "悪[あく]の種[たね]の芽[め]は初[はじ]めからアダムの心[こころ]に蒔[ま]かれ、今[いま]に至[いた]るまでどれほど多[おお]くの悪[あく]を生[う]み、脱穀[だっこく]の時[とき]が来[く]るまで生[う]み続[つづ]けることか。"
  31: "悪[あく]の種[たね]の芽[め]がどれほどの不敬[ふけい]の実[み]を生[う]んだかを、あなた自身[じしん]のうちで考[かんが]えよ。"
  32: "数[かず]えきれない穂[ほ]が刈[か]り取[と]られるとき、どれほど大[おお]きな脱穀[だっこく]が始[はじ]まることか。」"
  33: "わたしは答[こた]えて言[い]った。「それはどのように、いつ起[お]こるのですか。なぜわたしたちの年[とし]は短[みじか]く、悪[あ]しきものなのですか。」"
  34: "彼はわたしに答[こた]えて言[い]った。「いと高[たか]き方[かた]よりも高[たか]く上[のぼ]ろうと急[いそ]ぐな。あなたはむなしく、その方[かた]よりも高[たか]くあろうと努[つと]めている。あなたの迷[まよ]いは多[おお]いからである。"
  35: "正[ただ]しい者[もの]たちの魂[たましい]は、自分[じぶん]たちの囲[かこ]いのうちで、これについて尋[たず]ねなかったか。こう言[い]ってである。『いつまでわたしたちはこのように望[のぞ]み続[つづ]けるのか。わたしたちの報[むく]いの刈[か]り入[い]れの実[み]はいつ来[く]るのか。』」"
  36: "これに答[こた]えて、大天使[だいてんし]エレミエルが言[い]った。「あなたがたのうちの種[たね]の数[かず]が満[み]ちるときである。いと高[たか]き方[かた]は秤[はかり]でこの世[よ]を量[はか]られたからである。"
  37: "また、測[はか]りをもって時[とき]を量[はか]り、数[かず]をもって時[とき]を数[かぞ]えられた。あらかじめ言[い]われた測[はか]りが満[み]ちるまで、動[うご]かすことも急[いそ]がすこともない。」"
  38: "わたしは答[こた]えて言[い]った。「ああ、主[しゅ]なる主[あるじ]よ。しかしわたしたちは皆[みな]、不敬[ふけい]に満[み]ちています。"
  39: "わたしたちのゆえに、地[ち]に住[す]む者[もの]たちの罪[つみ]のために、正[ただ]しい者[もの]たちの倉[くら]が満[み]たされないのでしょうか。」"
  40: "彼はわたしに答[こた]えて言[い]った。「行[い]って、身[み]ごもっている女[おんな]に尋[たず]ねよ。九[ここの]つの月[つき]が満[み]ちたなら、なおその胎[たい]を子[こ]どもにとどめておけるか、と。」"
  41: "わたしは答[こた]えた。「いいえ、できません、主[しゅ]よ。」彼は答[こた]えて言[い]った。「よみにある魂[たましい]の住[す]まいは、胎[たい]に似[に]ている。"
  42: "産[う]む者[もの]が産[う]みの苦[くる]しみを逃[のが]れようと、早[はや]く産[う]もうとするように、彼らもまた、自分[じぶん]たちに委[ゆだ]ねられたものを早[はや]く手[て]放[ばな]そうと努[つと]めている。」"
  43: "「初[はじ]めから、あなたが見[み]たいと願[ねが]うこれらのことについて、わたしは告[つ]げ、明[あき]らかにしよう。」"
  44: "わたしは答[こた]えて言[い]った。「もしわたしがあなたの前[まえ]に恵[めぐ]みを見[み]いだし、もし可能[かのう]であり、わたしがふさわしいのなら、"
  45: "過[す]ぎ去[さ]った時[とき]は、これから来[く]る時[とき]よりも多[おお]いのでしょうか。それとも、過[す]ぎ去[さ]ったものは、来[く]るべきものよりも多[おお]いのでしょうか。わたしに示[しめ]してください。"
  46: "わたしは過[す]ぎ去[さ]ったことを知[し]っていますが、過[す]ぎ去[さ]ろうとしていることは知[し]りません。」"
  47: "彼は言[い]った。「わたしの右[みぎ]に立[た]て。わたしはあなたにこのたとえの解[かい]き明[あか]かしを示[しめ]そう。」"
  48: "わたしは立[た]った。そして見[み]た。見[み]よ、燃[も]える炉[かまど]がわたしの前[まえ]を通[とお]り過[す]ぎた。炎[ほのお]が過[す]ぎ去[さ]ったとき、見[み]よ、煙[けむり]が立[た]ちのぼった。"
  49: "その後[のち]、水[みず]を満[み]たした雲[くも]がわたしの前[まえ]を通[とお]り過[す]ぎ、そこから激[はげ]しい雨[あめ]が勢[いきお]いよく降[ふ]り注[そそ]いだ。雨[あめ]の勢[いきお]いが過[す]ぎ去[さ]ると、しずくが多[おお]く残[のこ]った。"
  50: "彼はわたしに言[い]った。「あなた自身[じしん]に心[こころ]を留[と]めよ。雨[あめ]がしずくよりも多[おお]く、火[ひ]が煙[けむり]よりも多[おお]いように、過[す]ぎ去[さ]った測[はか]りははるかに大[おお]きかった。しかし残[のこ]ったのは、しずくであり煙[けむり]であった。」"
  51: "わたしは願[ねが]って言[い]った。「あなたは、わたしがそれらの日[ひ]まで生[い]きると思[おも]われますか。それとも、それらの日[ひ]に何[なに]が起[こ]るのでしょうか。」"
  52: "彼はわたしに答[こた]えて言[い]った。「あなたが尋[たず]ねているしるしについては、わたしはあなたに一部[いちぶ]は語[かた]ることができる。しかしあなたの命[いのち]については、わたしはあなたに告[つ]げるために遣[つか]わされたのではない。わたしはそれを知[し]らないのだ。」"
notes:
  1: "слав. «Тогда отвеща ко мне ангел, иже послан бе ко мне, емуже имя уриил» — «послан бе» — плюсквамперфект «был послан»; «емуже имя» — которому имя. Уриил — ウリエル; в книге он ангел-толкователь, впервые назван здесь."
  2: "слав. «во ужасе изступи сердце твое в веце сем, понеже хощеши постигнути пути вышняго» — «изступи» — вышло из себя, выступило (изступити); «в веце сем» — в этом веке; ru «сердце твое слишком далеко зашло в этом веке». Смысл: ты забегаешь мыслью за пределы этого века."
  3: "слав. «три пути послан есмь показати тебе и три подобия предложити пред тобою» — «подобия» — подобия, образы (ср. 4:47 «толкование притчи»); «предложити» — предложить, поставить. Обращение к ангелу «господи мой» передано ご主人[しゅじん]さま (как в 2:44), чтобы не смешивать с 主[しゅ]."
  4: "слав. «от нихже егда ми едино изявиши, и аз ти покажу путь, егоже желаеши видети, и научу тя, откуду есть сердце лукаво» — «от нихже» — из них; «едино» — одно; «откуду» — откуда. Здесь поставлен главный вопрос книги: откуда злое сердце."
  5: "слав. «иди и извеси ми огня тягость, или измери дыхание ветра, или возврати вспять день, иже мимоиде» — «извеси» — взвесь (извесити); «тягость» — тяжесть; «дыхание ветра» — дуновение ветра; «возврати вспять» — верни назад. Три неисполнимых задачи."
  6: "слав. «кто от человек может сотворити, о нихже мя вопрошаеши?» — «о нихже» — о чём; «от человек» — из людей."
  7: "слав. «коль много жилищ есть в сердцы морстем, или коль много источников в начале бездны, или коль много жил есть над твердию небесною, или кии суть пределы райстии» — «жилища» — обиталища; «жилы» — жилы, водные протоки; «твердь небесная» — небесная твердь (大空[おおぞら]); «пределы райстии» — пределы рая."
  8: "слав. «негли отвещал бы ми еси: в бездну не снидох, ни во ад еще, ниже на небеса когда взыдох» — «негли» — может быть; «снидох» — сошёл; «взыдох» — взошёл; «ниже» — и не. Это предполагаемый ответ Ездры, поэтому 『…』."
  9: "слав. «ныне же о сем не вопросих тя, точию о огни и о ветре и о дни, в оньже еси пребывал, и без сих вещей быти не можеши» — «точию» — только; «в оньже» — в который; «без сих вещей» — без этих вещей. В ru «и о том, без чего ты быть не можешь»."
  10: "слав. «ты сих, яже твоя суть и с тобою возрастоша, познати не можеши» — «яже твоя суть» — которые твои; «возрастоша» — возросли (с тобою, то есть с юности). В ru «что твое и с тобою от юности»."
  11: "слав. «и како сосуд твой возможет вместити пути вышняго, и уже миру отвне растленну сущу, уразумети расление явное пред лицем моим?» — «сосуд» — сосуд (об уме человека); «отвне» — извне; «расление» — растление, тление. В ru «в этом уже заметно растленном веке»."
  12: "слав. «лучше нам дабы есмы не были, нежели еще живущим жити в нечестиих и претерпевати и не ведати, коея ради вещи» — «дабы есмы не были» — чтобы нам не быть (сослагательное); «коея ради вещи» — ради чего, почему. В ru «лучше было бы нам вовсе не быть»."
  13: "слав. «шед идох в дубраву древес польных, идеже древа совет сотвориша» — «дубрава» — дубрава, лес; «древес польных» — полевых деревьев; «совет сотвориша» — держали совет. Начало притчи о лесе и море."
  14: "слав. «приидите и идем и двигнем брань на море, да уступит нам, и да сотворим себе иныя дубравы» — «двигнем брань» — поднимем войну; «да уступит» — чтобы уступило; «иныя дубравы» — другие дубравы. Слова деревьев — 『…』."
  15: "слав. «такожде и волны морския совет сотвориша глаголющя: пойдем и двигнем брань на лесы польныя, да победивша их восприимем себе тамо иное место» — «лесы» — леса; «победивша» — победив (двойственное число); «иное место» — иное место. Слова волн — 『…』."
  16: "слав. «и бысть умышление дубравы праздно, понеже прииде огнь и пожже ю» — «умышление» — замысел; «праздно» — тщетно, пусто; «пожже» — сжёг (пожещи); «ю» — её."
  17: "слав. «такожде и умышление волн морских, понеже ста песок и удержа их» — «ста» — стал; «удержа» — удержал, остановил. В ru «стал песок, и воспрепятствовал им»."
  18: "слав. «и егда бы еси был судия их, коего бы еси от сих оправдал, или коего винна сотворил?» — «егда бы» — если бы; «винна сотворил» — сделал виновным. В ru «кого бы ты стал оправдывать или кого обвинять?»"
  19: "слав. «воистинну в совет суетен вдашася, понеже земля дана есть лесом, и морю место, еже носити волны своя» — «суетен» — суетный, пустой; «вдашася» — предались; «дана есть лесом» — дана лесам (дат. мн.)."
  20: "слав. «право разсудил еси: чесо же ради себе не судиши?» — «право» — правильно; «чесо же ради» — почему же. Поворот притчи: тем же судом суди себя самого."
  21: "слав. «понеже якоже земля дубравам дана есть и море волнам своим (дано есть): тако иже обитают на земли, токмо вещи наземныя разумети могут, а сущии на небесех, яже на высоте небес» — скобки «(дано есть)» редакционные, в текст не переносились; «наземныя» — земные; «сущии на небесех» — сущие на небесах. В ru «а обитающие на небесах могут разуметь, что на высоте небес»."
  22: "слав. «молютися, господи, да мне дастся ум разумения» — «молютися» = молю Тя ся (молюсь Тебе); «ум разумения» — разумеющий ум, разумение. Здесь начинается молитва Ездры, идущая до ст. 25."
  23: "слав. «не бо хотех вопросити о вышних твоих, но о сих, яже всегда в нас бывают» — «вышних твоих» — о высшем Твоём; «яже всегда в нас бывают» — что всегда бывает у нас. Далее трижды «чесо ради» — почему."
  24: "слав. «и преидохом о века аки прузи и живем в велицем страсе и ужасе, и недостойни есмы милости твоея наследити» — «преидохом о века» — проходим этот век (предлог «о» — «в течение»); «прузи» — саранча; «наследити» — наследовать, получить."
  25: "слав. «но что сотворит имени своему, еже мы нарицаем? сия суть, егоже аз вопросих» — «еже мы нарицаем» — которое мы призываем; «сия суть» — это то. В ru «что сделает Он с именем Своим, которое наречено на нас?»"
  26: "слав. «колико более испытати будеши, толико более и удивишися, понеже скоро спешит век преити» — «колико… толико» — чем… тем; «спешит» — спешит; «преити» — пройти, миновать."
  27: "слав. «и не может носити, яже в будущая времена праведным обещанна суть» — «носити» — нести, вмещать; «в будущая времена» — в будущие времена. В ru добавлено «потому что век сей исполнен неправдою и немощами» — эта оговорка в слав. стоит в следующем стихе."
  28: "слав. «понеже неправды исполнь век сей и немощей: а о нихже вопрошаеши, возвещу тебе: насеяно бо есть зло, и не у прииде погубление его» — «исполнь» — полон; «не у прииде» — ещё не пришло; «погубление» — уничтожение, искоренение."
  29: "слав. «аще убо не превратится, еже насеяно есть, и не уступит место, идеже насеяно лукавство, не приидет, идеже насеяно есть благо» — «превратится» — будет превращено, исторгнуто; «не уступит место» — не уступит места, не будет упразднено. Образ поля: пока сорняк не вырван, доброе не взойдёт."
  30: "слав. «понеже злак семене злаго всеян есть в сердце адамово из начала, и коль много зла роди и доныне и раждает, дондеже приидет млачение» — «злак» — злак, росток; «млачение» — молотьба (млатити — молотить); «дондеже» — доколе."
  31: "слав. «разсуди же в себе злак злаго семене, колик плод нечестия породи?» — «в себе» — в себе; «колик» — сколький. В ru «сколько зерно злого семени народило плодов нечестия»."
  32: "слав. «егда пожати будут класи, имже несть числа, коль велию молотьбу начнут творити?» — «класи» — колосья; «молотьбу» — молотьбу; «имже несть числа» — которым нет числа. Здесь слово Уриила заканчивается."
  33: "слав. «како и когда сия (будут)? и чесо ради кратка и зла лета наша?» — скобки «(будут)» редакционные, в текст не переносились; «кратка и зла» — кратки и злы, то есть несчастны. В ru «почему наши лета малы и несчастны?»"
  34: "слав. «не спеши ты выше вышняго, ты бо тщишися всуе быти выше его, ибо изступление твое много» — «тщишися» — стараешься, усиливаешься; «всуе» — напрасно; «изступление» — выступление за пределы, уклонение (в ru «слишком далеко заходишь»)."
  35: "слав. «еда не вопрошаша души праведных о сих в затворех своих, глаголюще: доколе тако надеющеся будем? и когда приидет плод жатвы мзды нашея?» — «в затворех своих» — в своих затворах, вместилищах (место упокоения душ); «мзды нашея» — воздаяния нашего. Слова душ — 『…』."
  36: "слав. «и отвеща на сия иеремиил архангел и рече: егда исполнится число семен в вас, понеже на мериле извесил век» — «иеремиил архангел» — архангел Иеремиил; в слав. это иное имя, чем Уриил (ангел-толкователь этой книги), поэтому оставлено エレミエル и не отождествлено с Уриилом. «Семен в вас» — семян в вас (число избранных)."
  37: "слав. «и мерою измерил времена и числом сочте часы, и не восколеба, ни возбуди, дондеже исполнится предреченная мера» — «восколеба» — поколеблет, сдвинет; «возбуди» — ускорит, подвигнет; «предреченная мера» — предсказанная мера. В ru «не подвинет и не ускорит»."
  38: "слав. «И отвещах и рех: о, владыко Господи! но и мы вси исполнени есмы нечестия» — «владыко Господи» — звательный падеж; «исполнени есмы» — исполнены (мы). В ru «а мы все преисполнены нечестием»."
  39: "слав. «и еда ли нас ради не наполнятся праведных житницы, за грехи обитающих на земли?» — «житницы» — житницы, амбары; «за грехи» — из-за грехов. Вопрос Ездры: не из-за нас ли не наполняются житницы праведных."
  40: "слав. «иди и вопроси имущую во чреве, еда исполнивши девять месяцей своих, еще возмогут ложесна ея в себе удержати плод?» — «имущую во чреве» — имеющую во чреве, беременную; «ложесна» — утроба; «девять месяцей» — девять месяцев. В ru «по исполнении девятимесячного срока»."
  41: "слав. «И аз отвещах: воистинну не могут, господи. Он же отвеща: во аде обители душ подобныя суть ложеснам» — «аде» — аде, преисподней (передано よみ); «обители» — жилища. Ответ Ездры («не могут») — в 「…», затем снова речь ангела."
  42: "слав. «понеже якоже родящая хощет вскоре родити, да избежит нужды рождения, тако и сия тщатся издати оная, яже вдана им суть» — «нужда рождения» — мука, необходимость рождения; «издати» — издать, отдать; «вдана» — вверена. Души спешат отдать вверенное им."
  43: "слав. «из начала возвещу и изявлю тебе о сих, ихже желаеши видети» — «из начала» — от начала; «изявлю» — явлю, объясню. В ru «Сначала будет показано тебе то, что ты желаешь видеть» — иное построение."
  44: "слав. «аще обретох благодать пред тобою, и аще возможно есть, и аще достоин есмь» — «обретох» — обрёл (аорист); «достоин есмь» — достоин. В ru «и если я способен к тому»."
  45: "слав. «покажи ми, еда ли множайшее есть время прешедшее, нежели имущее приити? или множайшая преидоша, неже будущая суть?» — «множайшее» — большее; «имущее приити» — имеющее прийти; «прешедшее» — прошедшее. Вопрос повторён дважды с перестановкой — так и в слав.; в ru порядок иной."
  46: "слав. «вем бо, еже прейде, а того не вем, еже прейти имать» — «вем» — знаю; «имать» — имеет, должно. В ru «Что прошло, я это знаю, а что придет, не ведаю»."
  47: "слав. «стани одесную мене, и изявлю тебе толкование притчи» — «одесную» — по правую руку; «толкование притчи» — значение притчи (о лесе и море)."
  48: "слав. «И стах и видех, и се, пещь горящая пройде предо мною: и бысть егда прейде пламень, видех, и се, превзыде дым» — «пещь» — печь; «превзыде» — поднялся выше, восторжествовал. Образ: пламя прошло — остался дым."
  49: "слав. «По сих пройде предо мною облак исполнен воды, из негоже испустися дождь велий со устремлением: и егда пройде стремление дождя, преумножишася в нем капли» — «устремление» — стремительность, напор; «преумножишася» — умножились. Образ: ливень прошёл — остались капли."
  50: "слав. «внимай себе: якоже растет дождь паче неже капли, и огнь, неже дым, тако превзыде прешедшая мера: преумножишася же капли и дым» — «внимай себе» — внимай себе, вдумайся; «паче неже» — более нежели; «превзыде» — превзошла. Прошедшее превысило остаток, как дождь — капли, огонь — дым."
  51: "слав. «мниши ли, яко жити имам даже до дний оных? или что будет во днех онех?» — «мниши ли» — думаешь ли; «имам» — буду (имати с инф.); «дний оных» — тех дней."
  52: "слав. «о знамениих, о нихже мя вопрошаеши, от части могу ти глаголати, о животе же твоем несмь послан поведати тебе, но не свем» — «от части» — отчасти; «о животе твоем» — о жизни твоей; «несмь послан» — не послан; «не свем» — не знаю (свем — знаю). В ru «я не послан говорить с тобою, да и не знаю»."
