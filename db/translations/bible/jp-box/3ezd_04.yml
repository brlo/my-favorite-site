# jp-box, 3-я Ездры, глава 4. Черновик для приёмки.
#
# База: церковнославянский текст (csl-ru) — в Септуагинте (gr-lxx-byz) книги нет;
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет;
# jp-ni не использовался. Нумерация — славянская.
# Язык — современный 常体; порядок членов и клаузы — по славянскому.
# 〔…〕 нет (слав. — церковное чтение); сносок ⟨…⟩ нет.
#
# Содержание главы 4: продолжение диалога с Уриилом. 1–11 Уриил обличает Ездру:
# «сердце твоё слишком далеко зашло», три пути и три подобия, огонь, ветер и день;
# 12–21 притча о лесе и море, которые воевали друг с другом, и о суде;
# 22–25 молитва Ездры о разумении: почему Израиль предан, закон уничтожен;
# 26–32 «посеяно зло, но не пришло искоренение», зерно в сердце Адама, жатва;
# 33–37 вопрос о временах и ответ: «когда исполнится число семян», мера, весы;
# 38–43 «мы исполнены нечестия», беременная женщина и ложесна; 44–46 вопрос
# о большем — прошедшем или будущем; 47–50 видение печи и облака; 51–52 вопрос
# о своей жизни и ответ: о знамениях — отчасти, о жизни — не послан.
# Голоса: 1, 48–49 — повествование без кавычек; речь Уриила — 「…」 (2, 3–11,
# 13–21, 26–32, 34–37, 40, 41–42, 43, 47, 50, 52); ответы Ездры — 「…」 (3, 5, 6,
# 12, 19, 22–25, 33, 38–39, 41, 44–46, 51). Вложенная речь: предполагаемый ответ
# Ездры в 8, слова деревьев в 14 и волн в 15, слова душ в 35 — 『…』.
# Слав. 4:36 называет говорящим «иеремиил архангел» (не Уриил) — имя сохранено
# как エレミエル, см. notes.
#
