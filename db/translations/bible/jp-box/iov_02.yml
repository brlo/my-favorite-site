# jp-box, Иов, глава 2. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc (1901) есть для 2:1–10: использован как контроль церковного
# чтения и имён, архаизмы не копировались. jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 2: второй совет ангелов и диалог Господа с сатаной (1–6), поражение Иова
# проказой и сидение на гноище (7–8), речь жены и ответ Иова (9–10), приход трёх
# друзей и семь дней молчания (11–13).
# Голоса: повествование; Господь — 「…」 (2, 3, 6); сатана — 「…」 (2, 4–5);
# жена — 「…」 (9), внутри её речи слова Иова — 『…』; Иов — 「…」 (10).
# Вводные формулы — вне кавычек.
# Нумерация по gr: 13 стихов; деление совпадает с csl-ru и ru (2:9 в LXX — подстихи 9a–e,
# в один стих не дробим).
# csl-добавление 2:10 «и не даде безумия Богу» внесено в основной текст без скобок;
# в notes отмечено «нет в LXX».
# 〔…〕 нет: все 13 стихов есть в gr-lxx-byz. Сносок ⟨…⟩ нет: 悪魔, 主, 神, 腫れ物,
# 陶器 уже в корпусе или очевидны.

tr_code: jp-box
book: iov
chapter: 2
draft: true

verses:
  1: "また、ある日[ひ]、神[かみ]の使[つかい]たちが主[しゅ]の前[まえ]に立[た]つために来[き]た。悪魔[あくま]も彼[かれ]らの中[なか]に来[き]て、主[しゅ]の前[まえ]に立[た]った。"
  2: "主[しゅ]は悪魔[あくま]に言[い]った。「どこから来[き]たのか。」悪魔[あくま]は主[しゅ]の前[まえ]で答[こた]えて言[い]った。「天[てん]の下[した]を過[す]ぎ、全[ぜん]地[ち]を巡[めぐ]って来[き]た。」"
  3: "主[しゅ]は悪魔[あくま]に言[い]った。「あなたはわたしの僕[しもべ]ヨブに心[こころ]を留[と]めたか。彼[かれ]に似[に]た者[もの]は地[ち]の上[うえ]にいない。悪意[あくい]がなく、真実[しんじつ]で、非[ひ]のない者[もの]で、神[かみ]を畏[おそ]れ、すべていかなる悪[あく]からも遠[とお]ざかる者[もの]である。彼[かれ]はなおも悪意[あくい]のなさを保[たも]っている。あなたは『彼[かれ]の持[も]ち物[もの]をむだに滅[ほろ]ぼせ』と言[い]ったのだ。」"
  4: "悪魔[あくま]は答[こた]えて主[しゅ]に言[い]った。「皮[かわ]は皮[かわ]に代[か]わる。人[ひと]は自分[じぶん]の命[いのち]のためには、持[も]つすべてのものを差[さ]し出[だ]す。"
  5: "しかし、あなたの手[て]を伸[の]べて、彼[かれ]の骨[ほね]と肉[にく]に触[ふ]れてみよ。きっと彼[かれ]はあなたの顔[かお]に向[む]かってあなたを呪[のろ]うだろう。」"
  6: "主[しゅ]は悪魔[あくま]に言[い]った。「見[み]よ、彼[かれ]をあなたの手[て]に渡[わた]す。ただ、その命[いのち]を守[まも]れ。」"
  7: "悪魔[あくま]は主[しゅ]の前[まえ]から出[で]て行[い]き、ヨブを足[あし]の裏[うら]から頭[あたま]の頂[いただき]まで、ひどい腫[は]れ物[もの]で打[う]った。"
  8: "ヨブは陶器[とうき]の破片[はへん]を取[と]って、自分[じぶん]の膿[うみ]をかき落[お]とし、町[まち]の外[そと]の糞[ふん]の山[やま]に座[すわ]っていた。"
  9: "長[なが]い時[とき]が過[す]ぎた後[のち]、妻[つま]は彼[かれ]に言[い]った。「いつまで、『見[み]よ、わたしはまだしばらくの間[あいだ]、わたしの救[すく]いの望[のぞ]みを待[ま]ち望[のぞ]んでいる』と言[い]って堪[こた]えているのか。見[み]よ、あなたの記憶[きおく]は地[ち]から消[き]え去[さ]った。息子[むすこ]たちも娘[むすめ]たちも、わたしの胎[たい]の産[う]みの苦[くる]しみも労[ろう]苦[ろう]も、すべて消[き]え去[さ]ったのだ。わたしはそれらを、苦[くる]しみながらむだに労[ろう]したのだ。あなた自身[じしん]は虫[むし]のうごめく腐[くさ]ったところに座[すわ]り、夜[よる]を露[つゆ]の下[した]で明[あ]かしている。わたしはさすらう者[もの]、人[ひと]に仕[つか]える者[もの]となって、所[ところ]から所[ところ]へ、家[いえ]から家[いえ]へと巡[めぐ]り歩[ある]き、日[ひ]がいつ沈[しず]むかと待[ま]っている。わたしの労苦[ろうく]と、今[いま]わたしを取[と]り囲[かこ]む痛[いた]みから憩[いこ]うために。ただ、主[しゅ]に向[む]かって何[なに]かひと言[こと]言[い]って、死[し]んでしまいなさい。」"
  10: "ヨブは彼女[かのじょ]を見[み]つめて言[い]った。「あなたは愚[おろ]かな女[おんな]の一人[ひとり]が言[い]うように言[い]った。わたしたちは神[かみ]の手[て]から良[よ]いものを受[う]け入[い]れたのだから、悪[わる]いものも受[う]け入[い]れないだろうか。」このすべてのことにおいて、ヨブは唇[くちびる]で神[かみ]の前[まえ]に罪[つみ]を犯[おか]さず、神[かみ]に愚[おろ]かなことを言[い]わなかった。"
  11: "ヨブの三人[さんにん]の友[とも]は、彼[かれ]に降[ふ]りかかったすべての災[わざわ]いを聞[き]いて、それぞれ自分[じぶん]の国[くに]から彼[かれ]のもとへ来[き]た。テマン人[じん]の王[おう]エリファズ、シュヒ人[じん]の君[きみ]ビルダド、ミナ人[じん]の王[おう]ゾファルである。彼[かれ]らは心[こころ]を一[ひと]つにして、彼[かれ]を慰[なぐさ]め、見舞[みま]うために来[き]た。"
  12: "彼[かれ]らは遠[とお]くから彼[かれ]を見[み]たが、見[み]分[わ]けられなかった。彼[かれ]らは声[こえ]を上[あ]げて大[おお]いに泣[な]き、それぞれ自分[じぶん]の衣[ころも]を裂[さ]き、頭[あたま]の上[うえ]に土[つち]をまき散[ち]らした。"
  13: "彼[かれ]らは七日[なぬか]七夜[ななよ]、彼[かれ]のそばに座[すわ]った。しかし、だれも彼[かれ]にひと言[こと]も言[い]わなかった。彼[かれ]の打[う]ち傷[きず]がひどく、非常[ひじょう]に大[おお]きいのを見[み]ていたからである。"

notes:
  1: "Повествование. Ἐγένετο δὲ ὡς ἡ ἡμέρα αὕτη — «был день сей», обычная формула начала сцены. οἱ ἄγγελοι τοῦ θεοῦ — «ангелы Божии». ὁ διάβολος ἦλθεν ἐν μέσῳ αὐτῶν — «диавол пришёл посреди них» (в 1:6 — μετ᾽ αὐτῶν)."
  2: "Господь — 「…」; сатана — 「…」. Πόθεν σὺ ἔρχῃ; — «откуда ты идёшь?» (наст. время, в отличие от 1:7). Διαπορευθεὶς τὴν ὑπ᾽ οὐρανὸν καὶ ἐμπεριπατήσας τὴν σύμπασαν πάρειμι — «пройдя поднебесную и обойдя всю землю, я здесь» (σύμπασα — вся)."
  3: "Господь — 「…」. ἄκακος — «незлобивый» (в 1:8 ἄμεμπτος); ἔτι δὲ ἔχεται ἀκακίας — «ещё держится незлобия». σὺ δὲ εἶπας τὰ ὑπάρχοντα αὐτοῦ διὰ κενῆς ἀπολέσαι — «а ты сказал: погубить имение его напрасно»; в евр. и ru иначе: «ты возбуждал Меня против него, чтобы погубить его безвинно». Слова сатаны переданы как цитата его прежних слов — 『…』."
  4: "Сатана — 「…」, речь продолжается в 5. Δέρμα ὑπὲρ δέρματος — «кожа за кожу»: пословица, смысл «жизнь за жизнь», «одно вместо другого». ὅσα ὑπάρχει ἀνθρώπῳ, ὑπὲρ τῆς ψυχῆς αὐτοῦ ἐκτείσει — «всё, что есть у человека, отдаст за душу свою» (ἐκτίνω — выплачивать, отдавать)."
  5: "Сатана, продолжение речи. ἅψαι τῶν ὀστῶν αὐτοῦ καὶ τῶν σαρκῶν αὐτοῦ — «коснись костей его и плоти его». εἰ μὴν εἰς πρόσωπόν σε εὐλογήσει — та же клятвенная формула и тот же эвфемизм, что в 1:11 (букв. «благословит», смысл «проклянёт»)."
  6: "Господь — 「…」. Ἰδοὺ παραδίδωμί σοι αὐτόν — «вот, предаю тебе его». μόνον τὴν ψυχὴν αὐτοῦ διαφύλαξον — «только душу, жизнь его сохрани» (διαφυλάσσω — оберегать); в евр. и ru «только душу его сбереги»."
  7: "Повествование. ἕλκει πονηρῷ — «злой язвой, гноем» (ἕλκος — рана, язва); ἀπὸ ποδῶν ἕως κεφαλῆς — «от ног до головы». csl: «гноем лютым»."
  8: "Повествование. ὄστρακον — «черепок» (глиняный осколок); ἵνα τὸν ἰχῶρα ξύῃ — «чтобы соскребать гной» (ἰχώρ — сукровица, гной; ξύω — скоблить). ἐπὶ τῆς κοπρίας — «на гноище, навозной куче» (κοπρία); ἔξω τῆς πόλεως — «вне города». В тексте 糞の山; ru «в пепел» — иное."
  9: "Жена — 「…」, одна цитата на весь стих (в LXX подстихи 9a–e). Μέχρι τίνος καρτερήσεις λέγων — «доколе будешь терпеть, говоря»; внутри её речи — слова Иова, 『…』: Ἰδοὺ ἀναμένω χρόνον ἔτι μικρόν… — «вот, подожду ещё немного, ожидая надежды спасения моего». ἠφάνισταί σου τὸ μνημόσυνον ἀπὸ τῆς γῆς — «исчезла память твоя с земли». ἐν σαπρίᾳ σκωλήκων κάθησαι διανυκτερεύων αἴθριος — «сидишь в гнили червей, проводя ночь под открытым небом». πλανῆτις καὶ λάτρις — «скиталица и служанка». ἀλλὰ εἰπόν τι ῥῆμα εἰς κύριον καὶ τελεύτα — «но скажи некое слово к Господу и умри»; в евр. и ru «похули Бога и умри» — иное чтение, в тексте LXX и csl."
  10: "Иов — 「…」; затем повествование. Ὥσπερ μία τῶν ἀφρόνων γυναικῶν ἐλάλησας — «как одна из безумных женщин ты сказала». εἰ τὰ ἀγαθὰ ἐδεξάμεθα ἐκ χειρὸς κυρίου, τὰ κακὰ οὐχ ὑποίσομεν; — «если благое приняли из руки Господней, злого не потерпим?» (ὑποφέρω — выносить). οὐδὲν ἥμαρτεν Ιωβ τοῖς χείλεσιν ἐναντίον τοῦ θεοῦ — «ни в чём не согрешил Иов устами пред Богом». csl добавляет «и не даде безумия Богу» — внесено без скобок."
  11: "Повествование. οἱ τρεῖς φίλοι — «три друга». Ελιφας ὁ Θαιμανων βασιλεύς — «Елифаз, царь феманитян»; Βαλδαδ ὁ Σαυχαίων τύραννος — «Вилдад, властитель савхеян» (τύραννος — правитель); Σωφαρ ὁ Μιναίων βασιλεύς — «Софар, царь минеев». В тексте テマン人, シュヒ人, ミナ人 по таблице имён; титулы 王, 君 сохранены. ὁμοθυμαδὸν — «единодушно». παρακαλέσαι καὶ ἐπισκέψασθαι — «утешить и посетить»."
  12: "Повествование. πόρρωθεν οὐκ ἐπέγνωσαν — «издалека не узнали». βοήσαντες φωνῇ μεγάλῃ ἔκλαυσαν — «возопив громким голосом, заплакали». ῥήξαντες ἕκαστος τὴν ἑαυτοῦ στολήν — «разодрав каждый одежду свою». καταπασάμενοι γῆν — «посыпав себя землёю» (в тексте — на голову)."
  13: "Повествование. παρεκάθισαν αὐτῷ ἑπτὰ ἡμέρας καὶ ἑπτὰ νύκτας — «сидели при нём семь дней и семь ночей». οὐδεὶς αὐτῶν ἐλάλησεν — «никто из них не говорил». ἑώρων γὰρ τὴν πληγὴν δεινὴν οὖσαν — «ибо видели, что язва страшна»; μεγάλην σφόδρα — «весьма велика»."
