verses:
  1: "「島[しま]々[じま]よ、わたしの声[こえ]を聞[き]け。もろもろの民[たみ]よ、耳[みみ]を傾[かたむ]けよ。長[なが]い時[とき]を経[へ]て、それは成[な]る、と主[しゅ]は言[い]われる。主[しゅ]は母[はは]の胎[たい]から、わたしの名[な]を呼[よ]ばれた。"
  2: "主はわたしの口[くち]を鋭[するど]い剣[つるぎ]のようにし、その手[て]の陰[かげ]にわたしを隠[かく]した。わたしを選[えら]ばれた矢[や]のようにし、その矢筒[やづつ]の中[なか]にわたしを隠した。"
  3: "わたしに言[い]われた。『あなたはわたしのしもべ、イスラエルである。あなたによってわたしは栄光[えいこう]を受[う]ける』と。"
  4: "わたしは言[い]った。『わたしはむなしく労[ろう]し、むだに、何[なに]にもならないために力[ちから]を使[つか]い果[は]てた』と。しかし、わたしの裁[さば]きは主[しゅ]のもとにあり、わたしの労苦[ろうく]はわたしの神[かみ]の前[まえ]にある。"
  5: "今[いま]、わたしを胎[たい]からご自身[じしん]のしもべとして造[つく]り、ヤコブを、イスラエルをご自身のもとへ集[あつ]めようとされる主[しゅ]は、こう言[い]われる。――わたしは主[しゅ]の前[みまえ]に集[あつ]められ、栄光[えいこう]を受[う]ける。わたしの神[かみ]はわたしの力[ちから]となる。――"
  6: "そして、わたしに言[い]われた。『あなたがわたしのしもべと呼ばれて、ヤコブの諸部族[しょぶぞく]を起[お]こし、イスラエルの散[ち]らされた者[もの]たちを帰[かえ]らせることは、あなたにとって大[おお]きなことである。見[み]よ、わたしはあなたを民[たみ]の契約[けいやく]、諸国民[しょこくみん]の光[ひかり]とし、地[ち]の果[は]てに至[いた]るまで、あなたを救[すく]いとする』と。」"
  7: "あなたを贖[あがな]う方[かた]、イスラエルの神[かみ]である主[しゅ]はこう言[い]われる。「自分[じぶん]の魂[たましい]を蔑[さげす]み、諸国民[しょこくみん]に忌[い]み嫌[きら]われ、支配者[しはいしゃ]たちのしもべとされている者[もの]を、聖[せい]なる者として迎[むか]えよ。王[おう]たちは彼を見[み]て立[た]ち上[あ]がり、支配者たちはひざまずいて彼を拝[おが]む。主[しゅ]のゆえである。イスラエルの聖[せい]なる方[かた]は真実[しんじつ]であり、わたしはあなたを選[えら]んだからである。」"
  8: "主[しゅ]はこう言[い]われる。「受[う]け入[い]れられる時[とき]に、わたしはあなたの声[こえ]を聞[き]き、救[すく]いの日[ひ]にあなたを助[たす]けた。わたしはあなたを造[つく]り、諸国民[しょこくみん]の永遠[えいえん]の契約[けいやく]としてあなたを与[あた]え、地[ち]を興[おこ]し、荒[あ]れた地を受け継[つ]がせる。"
  9: "縛[しば]られた者[もの]たちに『出[で]よ』、暗[やみ]の中[なか]にいる者たちに『現[あらわ]れよ』と言[い]う。彼[かれ]らはすべての道[みち]で草[くさ]を食[は]み、すべての小道[こみち]に彼らの牧[まき]草[ぐさ]がある。"
  10: "彼[かれ]らは飢[う]えることも渇[かわ]くこともなく、熱風[ねっぷう]も太陽[たいよう]も彼らを打[う]たない。彼らをあわれむ方[かた]が彼らを慰[なぐさ]め、水[みず]の泉[いずみ]へと導[みちび]かれるからである。"
  11: "わたしはすべての山[やま]を道[みち]とし、すべての小道を彼らの牧[まき]草[ぐさ]とする。"
  12: "見[み]よ、彼[かれ]らは遠[とお]くから来[く]る。ある者[もの]は北[きた]から、ある者は海[うみ]から、またある者たちはペルシア人[じん]の地[ち]から来る。」"
  13: "天[てん]よ、喜[よろこ]べ。地[ち]よ、喜び躍[おど]れ。山々[やまやま]は喜[よろこ]びを、丘[おか]は義[ぎ]をほとばしらせよ。神[かみ]がその民[たみ]をあわれみ、その民のへりくだる者[もの]たちを慰[なぐさ]めたからである。"
  14: "しかし、シオンは言[い]った。「主[しゅ]はわたしを見捨[みす]て、神[かみ]はわたしを忘[わす]れた。」"
  15: "「女[おんな]が自分[じぶん]の乳児[にゅうじ]を、自分[じぶん]の胎[たい]の産[う]みの子[こ]らをあわれむことなく忘[わす]れることがあろうか。たとえ女が忘れても、わたしはあなたを忘れない、と主[しゅ]は言[い]われる。"
  16: "見[み]よ、わたしはあなたの城壁[じょうへき]をわたしの手[て]のひらに描[えが]いた。あなたはいつもわたしの前[まえ]にある。"
  17: "あなたを壊[こわ]した者[もの]たちによって、あなたは速[すみ]やかに建[た]て直[なお]される。あなたを荒[あ]らした者たちは、あなたから出[で]て行[い]く。"
  18: "目[め]を上[あ]げて周[まわ]りを見[み]よ。彼[かれ]らはみな集[あつ]まって、あなたのところへ来[き]た。わたしは生[い]きている、と主[しゅ]は言[い]われる。あなたは彼らをすべて衣[ころも]のように着[き]、花嫁[はなよめ]が飾[かざ]りをつけるように、彼らを身[み]につける。"
  19: "あなたの荒[あ]れ果[は]てた所[ところ]、壊[こわ]された所、崩[くず]れた所は、今[いま]、住[す]む者[もの]が多[おお]すぎて狭[せま]くなり、あなたを飲[の]み込[こ]んだ者[もの]たちは遠[とお]くへ去[さ]る。"
  20: "あなたが失[うしな]った子[こ]らが、あなたの耳[みみ]もとで言[い]う。『この場[ば]所[しょ]はわたしに狭[せま]い。住[す]むための場所[ばしょ]を造[つく]ってほしい』と。"
  21: "あなたは心[こころ]のうちで言[い]う。『だれがわたしにこれらの者[もの]を産[う]んだのか。わたしは子[こ]もなく寡婦[かふ]であったのに、だれがこれらの者を育[そだ]ててくれたのか。わたしはひとり残[のこ]されたのに、これらの者はどこにいたのか』と。」"
  22: "主[しゅ]はこう言[い]われる。「見[み]よ、わたしは諸国民[しょこくみん]に向[む]かって手[て]を上[あ]げ、島々[しまじま]に向かってわたしのしるしを上[あ]げる。彼らはあなたの子[こ]らを胸[むね]に抱[だ]いて連[つ]れて来[き]、あなたの娘[むすめ]たちを肩[かた]に載[の]せて来る。"
  23: "王[おう]たちはあなたの養育者[よういくしゃ]となり、女王[じょおう]たちはあなたの乳母[うば]となる。彼らは顔[かお]を地[ち]につけてあなたを拝[おが]み、あなたの足[あし]の塵[ちり]をなめる。あなたは、わたしが主[しゅ]であることを知[し]り、わたしを待[ま]ち望[のぞ]む者[もの]たちは恥[は]じない。」"
  24: "巨人[きょじん]から獲物[えもの]を奪[うば]い取[と]れる者[もの]があろうか。不正[ふせい]に捕[と]らえた者[もの]が、救[すく]い出[だ]されることがあろうか。"
  25: "主[しゅ]はこう言[い]われる。「たとえ巨人[きょじん]が捕[と]らえた者[もの]があっても、それは奪[うば]い返[かえ]され、強[つよ]い者[もの]から奪った獲物も救[すく]い出[だ]される。わたしがあなたのために争[あらそ]い、あなたの子[こ]らを救い出すからである。"
  26: "わたしは、あなたを苦[くる]しめた者[もの]たちにその肉[にく]を食[く]わせ、自分[じぶん]の血[ち]を新しい酒[さけ]のように飲[の]ませて酔[よ]わせる。すべての肉は、わたしが主[しゅ]、あなたを贖[あがな]う者[もの]、ヤコブの力[ちから]を支[ささ]える者[もの]であることを知[し]る。」"

notes:
  1: "Ἀκούσατέ μου, νῆσοι — «послушайте Меня, острова» (νῆσος — 島); προσέχετε, ἔθνη — «внимайте, народы». διὰ χρόνου πολλοῦ στήσεται — «через много времени состоится» (слав. «временем многим стояти будет»): тёмное место, понято как «исполнится через долгое время»; λέγει κύριος стоит внутри речи и оставлен в строке. ἐκ κοιλίας μητρός μου ἐκάλεσεν τὸ ὄνομά μου — «от чрева матери Моей назвал имя Моё». С 49:1 по 49:6 — вторая песнь Раба в 「…」."
  2: "ἔθηκεν τὸ στόμα μου ὡσεὶ μάχαιραν ὀξεῖαν — «положил уста Мои как меч острый» (μάχαιρα, ὀξύς); ὑπὸ τὴν σκέπην τῆς χειρὸς αὐτοῦ ἔκρυψέν με — «под кров руки Своей скрыл Меня» (σκεπή — кров, сень); ὡς βέλος ἐκλεκτὸν — «как стрелу избранную» (βέλος); ἐν τῇ φαρέτρᾳ αὐτοῦ ἐσκέπασέν με — «в колчане Своём укрыл Меня» (φαρέτρα — 矢筒)."
  3: "καὶ εἶπέν μοι· Δοῦλός μου εἶ σύ, Ισραηλ — «и сказал Мне: ты раб Мой, Израиль»: Раб назван именем Израиля (слав. звательная форма «израилю»); καὶ ἐν σοὶ δοξασθήσομαι — «и в тебе прославлюсь» (δοξάζω). Слова Господа внутри песни — 『…』."
  4: "καὶ ἐγὼ εἶπα· Κενῶς ἐκοπίασα — «и я сказал: тщетно трудился» (κενῶς — впустую; κοπιάω); εἰς μάταιον καὶ εἰς οὐδὲν ἔδωκα τὴν ἰσχύν μου — «в пустое и в ничто отдал силу Мою» (μάταιος); ἡ κρίσις μου παρὰ κυρίῳ — «суд Мой у Господа» (κρίσις, 裁き); ὁ πόνος μου ἐναντίον τοῦ θεοῦ μου — «труд Мой пред Богом Моим» (πόνος — 労苦). Слова Раба — 『…』."
  5: "καὶ νῦν οὕτως λέγει κύριος ὁ πλάσας με ἐκ κοιλίας δοῦλον ἑαυτῷ — «и ныне так говорит Господь, создавший Меня от чрева в раба Себе» (πλάσσω — лепить, создавать); τοῦ συναγαγεῖν τὸν Ιακωβ καὶ Ισραηλ πρὸς αὐτόν — «чтобы собрать Иакова и Израиля к Нему». Далее в греч. тире и вставка συναχθήσομαι καὶ δοξασθήσομαι ἐναντίον κυρίου, καὶ ὁ θεός μου ἔσται μου ἰσχύς — «соберусь и прославлюсь пред Господом, и Бог Мой будет Мне силой» (слав. «соберуся и прославлюся пред Господем…»): по греч. это вставка внутри фразы, речь в ней принадлежит Рабу, поэтому в тексте ――, а помета не копируется. По смыслу — уверенность Раба посреди слова Господа, которое продолжится в 49:6."
  6: "καὶ εἶπέν μοι· Μέγα σοί ἐστιν τοῦ κληθῆναί σε παῖδά μου — «и сказал Мне: великое для тебя — назваться рабом Моим» (παῖς — しもべ, Раб Господень); τοῦ στῆσαι τὰς φυλὰς Ιακωβ — «восставить племена Иакова» (φυλή — 部族); τὴν διασπορὰν τοῦ Ισραηλ ἐπιστρέψαι — «рассеяние Израиля обратить» (διασπορά — 散らされた者). ἰδοὺ τέθεικά σε εἰς διαθήκην γένους — «вот, Я поставил Тебя в завет рода» (ср. 42:6); εἰς φῶς ἐθνῶν — «в свет народов»; εἰς σωτηρίαν ἕως ἐσχάτου τῆς γῆς — «во спасение до концов земли». Ключевое место о Рабе (ср. Лк 2:32; Деян 13:47)."
  7: "οὕτως λέγει κύριος ὁ ῥυσάμενός σε ὁ θεὸς Ισραηλ — «так говорит Господь, избавивший тебя, Бог Израилев». Ἁγιάσατε τὸν φαυλίζοντα τὴν ψυχὴν αὐτοῦ — «освятите [признайте святым] уничижающего душу свою» (ἁγιάζω; φαυλίζω — считать ничтожным); τὸν βδελυσσόμενον ὑπὸ τῶν ἐθνῶν — «гнушаемого народами» (βδελύσσομαι); τῶν δούλων τῶν ἀρχόντων — «рабов властелинов». βασιλεῖς ὄψονται αὐτὸν καὶ ἀναστήσονται — «цари увидят его и встанут»; ὅτι πιστός ἐστιν ὁ ἅγιος Ισραηλ — «ибо верен Святой Израилев»; ἐξελεξάμην σε — «Я избрал Тебя»."
  8: "Καιρῷ δεκτῷ ἐπήκουσά σου — «во время благоприятное Я услышал Тебя» (δεκτός; ср. 2 Кор 6:2); ἐν ἡμέρᾳ σωτηρίας ἐβοήθησά σοι — «в день спасения помог Тебе». ἔδωκά σε εἰς διαθήκην ἐθνῶν — «дал Тебя в завет народов»; слав. добавляет «сотворих тя» и «завет вечный» («и сотворих тя и дах тя в завет вечный языков») — внесено по паритету. τοῦ καταστῆσαι τὴν γῆν — «чтобы поставить землю», т. е. восстановить; κληρονομῆσαι κληρονομίαν ἐρήμου — «наследовать наследие пустыни» (ἔρημος — 荒れた地)."
  9: "λέγοντα τοῖς ἐν δεσμοῖς· Ἐξέλθατε — «говорящего тем, кто в узах: выйдите» (δεσμός — узы; причастие согласовано с «Тебя» из 49:8); τοῖς ἐν τῷ σκότει ἀνακαλυφθῆναι — «тем, кто во тьме: откройтесь» (ἀνακαλύπτω). ἐν πάσαις ταῖς ὁδοῖς αὐτῶν βοσκηθήσονται — «на всех путях их упасутся» (βόσκω); ἐν πάσαις ταῖς τρίβοις ἡ νομὴ αὐτῶν — «на всех тропах пажить их» (τρίβος — тропа; νομή — пастбище, 牧草)."
  10: "οὐ πεινάσουσιν οὐδὲ διψήσουσιν — «не взалчут и не возжаждут»; οὐδὲ πατάξει αὐτοὺς καύσων οὐδὲ ὁ ἥλιος — «и не поразит их зной и солнце» (καύσων — знойный ветер, 熱風); ὁ ἐλεῶν αὐτοὺς παρακαλέσει — «милующий их утешит» (ἐλεάω, παρακαλέω); διὰ πηγῶν ὑδάτων ἄξει αὐτούς — «через источники вод проведёт их» (πηγή — 泉)."
  11: "καὶ θήσω πᾶν ὄρος εἰς ὁδὸν — «и положу всякую гору в путь»; πᾶσαν τρίβον εἰς βόσκημα αὐτοῖς — «и всякую тропу в пастбище им» (βόσκημα). Слав. «в паству им» — тот же образ."
  12: "ἰδοὺ οὗτοι πόρρωθεν ἔρχονται — «вот, эти издалека идут»; οὗτοι ἀπὸ βορρᾶ καὶ οὗτοι ἀπὸ θαλάσσης — «эти от севера и эти от моря»; ἄλλοι δὲ ἐκ γῆς Περσῶν — «а иные из земли Персов» (в ru/МТ «из земли Синим» — по МТ, не внесено)."
  13: "εὐφραίνεσθε, οὐρανοί — «веселитесь, небеса»; ἀγαλλιάσθω ἡ γῆ — «да возликует земля» (ἀγαλλιάομαι); ῥηξάτωσαν τὰ ὄρη εὐφροσύνην — «да изрыгнут горы веселие» (ῥήγνυμι — разрывать, извергать; ほとばしらせる); οἱ βουνοὶ δικαιοσύνην — «и холмы правду». ὅτι ἠλέησεν ὁ θεὸς τὸν λαὸν αὐτοῦ — «ибо помиловал Бог народ Свой»; τοὺς ταπεινοὺς τοῦ λαοῦ αὐτοῦ παρεκάλεσεν — «смиренных народа Своего утешил» (ταπεινός — へりくだる者). Доксология вне кавычек."
  14: "Εἶπεν δὲ Σιων· Ἐγκατέλιπέν με κύριος — «сказал же Сион: оставил меня Господь» (ἐγκαταλείπω); καὶ ὁ κύριος ἐπελάθετό μου — «и Господь забыл меня». В слав. «и Бог забы мя» (ὁ θεός) — так и переведено (神), это чтение слав.; в LXX κύριος. jp-joc в этом стихе тоже даёт 神 (сверка церковного чтения). Слова Сиона — 「…」."
  15: "μὴ ἐπιλήσεται γυνὴ τοῦ παιδίου αὐτῆς — «разве забудет женщина дитя своё» (ἐπιλανθάνομαι); τοῦ μὴ ἐλεῆσαι τὰ ἔκγονα τῆς κοιλίας αὐτῆς — «чтобы не помиловать порождений чрева её» (ἐλεάω; ἔκγονα); εἰ δὲ καὶ ἐπιλάθοιτο ταῦτα γυνή — «но если бы и забыла это женщина»; ἀλλ᾿ ἐγὼ οὐκ ἐπιλήσομαί σου, εἶπεν κύριος — «но Я не забуду тебя, сказал Господь»: формула в конце стиха, оставлена внутри речи. Здесь начинается ответ Господа на ропот Сиона (до 49:21)."
  16: "ἐπὶ τῶν χειρῶν μου ἐζωγράφησά σου τὰ τείχη — «на руках Моих начертал стены твои» (ζωγραφέω — писать, рисовать; 手のひら); ἐνώπιόν μου εἶ διὰ παντός — «предо Мною ты всегда»."
  17: "καὶ ταχὺ οἰκοδομηθήσῃ — «и скоро будешь построена» (οἰκοδομέω, страд.); ὑφ᾿ ὧν καθῃρέθης — «теми, кем ты была разрушена» (καθαιρέω; слав. «от нихже разорился еси»); в ru/МТ «сыновья твои поспешат к тебе» — иное чтение, не внесено. οἱ ἐρημώσαντές σε ἐκ σοῦ ἐξελεύσονται — «опустошившие тебя из тебя выйдут»."
  18: "ἆρον κύκλῳ τοὺς ὀφθαλμούς σου — «подними окрест глаза твои»; ἰδοὺ συνήχθησαν καὶ ἤλθοσαν πρὸς σέ — «вот, собрались и пришли к тебе»; ζῶ ἐγώ, λέγει κύριος — «живу Я, говорит Господь» (клятвенная формула, оставлена строкой внутри речи). πάντας αὐτοὺς ἐνδύσῃ — «всех их ты наденешь» (ἐνδύω); περιθήσῃ αὐτοὺς ὡς κόσμον νύμφης — «возложишь их, как украшение невесты» (περιτίθημι; κόσμος — убранство; νύμφη — 花嫁)."
  19: "ὅτι τὰ ἔρημά σου καὶ τὰ διεφθαρμένα καὶ τὰ πεπτωκότα — «ибо пустыни твои, и разрушенное, и падшее» (διαφθείρω, πίπτω); νῦν στενοχωρήσει ἀπὸ τῶν κατοικούντων — «ныне станет тесно от жителей» (στενοχωρέω — быть тесным); μακρυνθήσονται ἀπὸ σοῦ οἱ καταπίνοντές σε — «удалятся от тебя поглощающие тебя» (καταπίνω — 飲み込む)."
  20: "ἐροῦσιν γὰρ εἰς τὰ ὦτά σου οἱ υἱοί σου — «ибо скажут в уши твои сыновья твои»; οὓς ἀπώλεκας — «которых ты погубила» (ἀπόλλυμι; слав. «ихже был погубил еси»). Στενός μοι ὁ τόπος — «тесно мне место»; ποίησόν μοι τόπον ἵνα κατοικήσω — «сделай мне место, чтобы мне поселиться». Слова детей — 『…』 внутри речи Господа."
  21: "καὶ ἐρεῖς ἐν τῇ καρδίᾳ σου — «и скажешь в сердце твоём» (слова Сиона — 『…』); Τίς ἐγέννησέν μοι τούτους — «кто родил мне этих». ἐγὼ δὲ ἄτεκνος καὶ χήρα — «я же бездетна и вдова» (ἄτεκνος; χήρα — 寡婦); τούτους δὲ τίς ἐξέθρεψέν μοι — «а этих кто вскормил мне» (ἐκτρέφω — 育てる); ἐγὼ δὲ κατελείφθην μόνη — «я же осталась одна» (καταλείπω, страд.); οὗτοι δέ μοι ποῦ ἦσαν — «а эти где были у меня»."
  22: "οὕτως λέγει κύριος· Ἰδοὺ αἴρω εἰς τὰ ἔθνη τὴν χεῖρά μου — «вот, Я поднимаю на народы руку Мою»; εἰς τὰς νήσους ἀρῶ σύσσημόν μου — «на острова подниму знамение Моё» (σύσσημον — знак, знамя); ἄξουσιν τοὺς υἱούς σου ἐν κόλπῳ — «принесут сыновей твоих в лоне» (κόλπος — 胸); τὰς θυγατέρας σου ἐπ᾿ ὤμων ἀροῦσιν — «дочерей твоих на плечах понесут». Слав. удваивает «Господь Господь» («тако глаголет Господь Господь»), в LXX один κύριος — держим LXX."
  23: "καὶ ἔσονται βασιλεῖς τιθηνοί σου — «и будут цари кормильцами твоими» (τιθηνός — кормилец, воспитатель, 養育者); αἱ ἄρχουσαι τροφοί σου — «и владычицы кормилицами твоими» (τροφός — кормилица, 乳母). ἐπὶ πρόσωπον τῆς γῆς προσκυνήσουσίν σοι — «лицом до земли поклонятся тебе»; τὸν χοῦν τῶν ποδῶν σου λείξουσιν — «прах ног твоих оближут» (λείχω — лизать); γνώσῃ ὅτι ἐγὼ κύριος — «узнаешь, что Я Господь». καὶ οὐκ αἰσχυνθήσῃ — «и не постыдишься» (2 л. ед. ч., LXX); слав. «и не посрамятся терпящии мя» (уповающие на Меня) — чтение слав., внесено по паритету."
  24: "μὴ λήμψεταί τις παρὰ γίγαντος σκῦλα — «разве возьмёт кто у исполина добычу» (γίγας — 巨人; σκῦλα — добыча); ἐὰν αἰχμαλωτεύσῃ τις ἀδίκως, σωθήσεται — «если кто неправедно пленит, спасётся ли» (αἰχμαλωτεύω — брать в плен; слав. «аще кто пленит неправедне, спасетлися»). Вопрос без формулы, поэтому без кавычек; ответ — в 49:25."
  25: "Ἐάν τις αἰχμαλωτεύσῃ γίγαντα, λήμψεται σκῦλα — «если кто пленит исполина, возьмёт добычу» (ответ на вопрос 49:24); λαμβάνων δὲ παρὰ ἰσχύοντος σωθήσεται — «и берущий у сильного спасётся». ἐγὼ δὲ τὴν κρίσιν σου κρινῶ — «Я же суд твой рассужу» (κρίνω; слав. «аз же прю твою разсужду»); τοὺς υἱούς σου ῥύσομαι — «сыновей твоих избавлю» (ῥύομαι)."
  26: "καὶ φάγονται οἱ θλίψαντές σε τὰς σάρκας αὐτῶν — «и съедят притеснившие тебя плоть свою» (θλίβω — теснить, притеснять; σάρξ); πίονται ὡς οἶνον νέον τὸ αἷμα αὐτῶν — «выпьют, как вино новое, кровь свою»; μεθυσθήσονται — «упиются» (μεθύσκομαι). καὶ αἰσθανθήσεται πᾶσα σάρξ — «и почувствует всякая плоть» (αἰσθάνομαι); ὁ ῥυσάμενός σε — «избавивший тебя»; ἀντιλαμβανόμενος ἰσχύος Ιακωβ — «поддерживающий крепость Иакова» (в ru/МТ «Сильный Иаковлев» — по МТ). Глава кончается без формулы; речь закрывается здесь."
