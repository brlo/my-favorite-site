# jp-box, Исаия, глава 49. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный, с МТ) — только для понимания,
# не источник. jp-joc для гл. 49 есть фрагментами (49:1–15, без ст. 5) и использован
# только для сверки церковного чтения (49:14); jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 49: 1–6 вторая песнь Раба («острова, слушайте Меня»; «Я сделаю Тебя светом
# народов»); 7 слово Господа о презренном Рабе — цари встанут; 8–12 завет народа,
# узники, путь среди гор, идущие отовсюду; 13 ликующая доксология; 14 ропот Сиона;
# 15–21 «разве может женщина забыть дитя своё», стены на дланях, теснота города,
# «кто мне родил их?»; 22–23 народы принесут сыновей и дочерей, цари — кормильцы;
# 24–26 «может ли быть отнята добыча у сильного» — Господь судится за Сион.
# Речи: 49:1–6 песнь Раба в 「…」 (слова Господа внутри — 『…』: 49:3, 49:4, 49:6;
# в 49:5 вставка, отмеченная в греч. тире, — ――); 49:7 и 49:8–12 — речи Господа
# с формулами вне кавычек; 49:13 доксология без кавычек; 49:14 слова Сиона в 「…」;
# 49:15–21 ответ Господа в 「…」 (слова детей и Сиона внутри — 『…』); 49:22–23 речь
# Господа; 49:24 вопрос без кавычек; 49:25–26 речь Господа.
# Нумерация по gr: 26 стихов; у csl и ru тоже 26, деление внутри главы совпадает.
# Паритет: 49:8 — слав. добавляет «сотворих тя» и «завет вечный» (в LXX короче) —
# внесено по паритету; 49:14 — в LXX «Господь забыл», в слав. и jp-joc «Бог забыл»
# (взято слав.); 49:22 — слав. удваивает «Господь Господь», в LXX один κύριος;
# 49:23 — LXX «и не постыдишься», слав. «и не посрамятся терпящии мя» (взято слав.);
# 49:17 и 49:26 — чтения ru/МТ («сыновья твои», «Сильный Иаковлев») не внесены.
# 〔…〕 нет. Сносок ⟨…⟩ нет: 島々, 剣, 矢筒, 契約, 光, 泉, 城壁, 花嫁, 巨人, 獲物,
# 乳母, 魂, 裁き уже в корпусе.
# Имена — транслитерация греческого (LXX): ヤコブ, イスラエル, シオン, ペルシア人.

