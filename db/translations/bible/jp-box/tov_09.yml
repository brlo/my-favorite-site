verses:
  1: "トビアはラファエルを呼[よ]んで言[い]った。"
  2: "「アザルヤ、兄弟[きょうだい]よ、しもべ一人[ひとり]とらくだ二頭[にとう]を連[つ]れて、メディアのラゲスへ行[い]き、ガバエルに会[あ]って、わたしの銀[ぎん]を受[う]け取[と]り、彼自身[じしん]も婚礼[こんれい]に連れて来[き]てくれ。"
  3: "ラグエルが、わたしが出[で]て行[い]かないようにと誓[ちか]ったからである。"
  4: "また、わたしの父[ちち]は日[ひ]を数[かぞ]えていて、わたしが長[なが]く遅[おく]れるなら、ひどく悲[かな]しむであろう。」"
  5: "ラファエルは行[い]ってガバエルのもとに泊[と]まり、彼に証書[しょうしょ]を渡[わた]した。ガバエルは封印[ふういん]された袋[ふくろ]を持[も]ち出[だ]して、彼に渡した。"
  6: "二人[ふたり]は朝早[あさはや]く共[とも]に起[お]きて、婚礼[こんれい]の席[せき]へ来[き]た。そしてトビアは妻[つま]を祝福[しゅくふく]した。"

notes:
  1: "ἐκάλεσεν Τωβιας τὸν Ραφαηλ — позвал Товия Рафаила. Стих обрывается на «и сказал ему»; речь продолжается в 9:2. Слав. «рече ему»."
  2: "λαβὲ μετὰ σεαυτοῦ παῖδα — возьми с собою слугу (παῖς — отрок, слуга). δύο καμήλους — двух верблюдов (κάμηλος, らくだ). ἐν Ῥάγοις τῆς Μηδίας — в Рагах Мидийских (Ῥάγοι, ラゲス; Μηδία, メディア). παρὰ Γαβαηλ — к Гаваилу (Γαβαηλ, ガバエル). κόμισαί μοι τὸ ἀργύριον — принеси мне серебро (κομίζω). αὐτὸν ἄγε εἰς τὸν γάμον — его самого приведи на брак (γάμος, 婚礼)."
  3: "διότι ὀμώμοκεν Ραγουηλ — ибо поклялся Рагуил (ὄμνυμι, перфект со значением настоящего). μὴ ἐξελθεῖν με — что мне не выходить."
  4: "ὁ πατήρ μου ἀριθμεῖ τὰς ἡμέρας — отец мой считает дни (ἀριθμέω). ἐὰν χρονίσω μέγα — если замедлю надолго (χρονίζω). ὀδυνηθήσεται λίαν — будет очень скорбеть (ὀδυνάομαι — мучиться, скорбеть)."
  5: "ηὐλίσθη παρὰ Γαβαήλῳ — остановился, переночевал у Гаваила (αὐλίζομαι). τὸ χειρόγραφον — рукописание, расписку (χειρόγραφον). προήνεγκεν τὰ θυλάκια ἐν ταῖς σφραγῖσιν — вынес мешочки с печатями (θυλάκιον — мешочек; σφραγίς — печать). Слав. «мешцы с печатьми»."
  6: "ὤρθρευσαν κοινῶς — встали рано вместе (ὀρθρεύω — вставать на заре; κοινῶς — сообща). ἤλθοσαν εἰς τὸν γάμον — пришли на брак, на пир. εὐλόγησεν Τωβιας τὴν γυναῖκα αὐτοῦ — благословил Товия жену свою. Слав. «обутреневаста купно» — двойственное число."
