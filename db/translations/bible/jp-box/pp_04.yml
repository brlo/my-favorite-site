# jp-box, Песнь Песней, глава 4. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для книги нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 4: возлюбленный описывает невесту (1–7), зовёт с Ливана (8),
# «сердце наше ты увлекла» (9), мёд и молоко, запах одежд (10–11),
# сад запертый, источник запечатанный и перечень ароматов (12–15);
# женщина отвечает: север и юг, «пусть придёт возлюбленный мой в сад свой» (16).
# Голоса: 1–15 — возлюбленный, одной цитатой 「…」; 16 — женщина, без кавычек.
# Вложенной речи в главе нет, поэтому 『…』 не употребляются.
# Нумерация по gr: 16 стихов, как и в csl; разница только в делении 4:16/5:1 —
# у csl 4:16 кончается на «и да потекут ароматы мои» (gr 4:16a), а gr 4:16b
# («да снидет брат мой в виноградник свой…») у csl открывает 5:1. Здесь переведён
# весь греческий 4:16, вторая половина не потеряна и в 5:1 не переносится.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет (по брифу главы): новые термины ナルド, サフラン, 菖蒲, シナモン, アロエ,
# ヘンナ — кандидаты в словарь, но здесь не подписаны.

tr_code: jp-box
book: pp
chapter: 4
draft: true

verses:
  1: "「見[み]よ、あなたは美[うつく]しい、わが伴[とも]なる者[もの]よ。見よ、あなたは美しい。あなたの目[め]は鳩[はと]。あなたの沈黙[ちんもく]のほかは。あなたの髪[かみ]は、ギレアデから現[あらわ]れた山羊[やぎ]の群[む]れのようだ。"
  2: "あなたの歯[は]は、洗[あら]い場[ば]から上[のぼ]って来[く]る、毛[け]を刈[か]られた羊[ひつじ]の群[む]れのようだ。どれも双子[ふたご]を産[う]み、子[こ]のない者[もの]はその中[なか]にない。"
  3: "あなたの唇[くちびる]は緋[ひ]の糸[いと]のようで、あなたの語[かた]りは美[うつく]しい。あなたの頬[ほお]は、ざくろの皮[かわ]のようだ、あなたの沈黙[ちんもく]のほかは。"
  4: "あなたの首[くび]はダビデの塔[とう]のようだ、タルピオトのために建[た]てられた。千[せん]の盾[たて]がそこに掛[か]けられ、勇士[ゆうし]たちの矢[や]がすべて掛かっている。"
  5: "あなたの二[ふた]つの乳房[ちぶさ]は、ゆりの間[あいだ]で草[くさ]を食[は]む、かもしかの双子[ふたご]の子鹿[こじか]二頭[にとう]のようだ。"
  6: "日[ひ]が息[いき]を吹[ふ]き、影[かげ]が移[うつ]るまで、わたしは自分[じぶん]のために没薬[もつやく]の山[やま]、レバノンの丘[おか]へ行[い]こう。"
  7: "あなたはすべて美[うつく]しく、わが伴[とも]なる者[もの]よ、あなたのうちに傷[きず]はない。"
  8: "レバノンから来[こ]い、わが花嫁[はなよめ]よ。レバノンから来い。信仰[しんこう]の始[はじ]めから、サニルとヘルモンの頂[いただき]から、獅子[しし]の檻[おり]から、豹[ひょう]の山[やま]から、来[き]て通[とお]り過[す]ぎよ。"
  9: "わが姉妹[しまい]、わが花嫁[はなよめ]よ、あなたはわたしたちの心[こころ]を奪[うば]った。あなたの目[め]の一[ひと]つで、あなたの首[くび]の一つの首飾[くびかざ]りで、わたしたちの心を奪った。"
  10: "何[なん]と美[うつく]しくなったことか、わが姉妹[しまい]、わが花嫁[はなよめ]よ、あなたの乳房[ちぶさ]は。何と美しくなったことか、あなたの乳房は、ぶどう酒[しゅ]にもまして。あなたの衣[ころも]の香[かおり]は、すべてもろもろの香料[こうりょう]にまさる。"
  11: "わが花嫁[はなよめ]よ、あなたの唇[くちびる]は蜜[みつ]の巣[す]から滴[したた]る。あなたの舌[した]の下[した]には蜜[みつ]と乳[ちち]。あなたの衣[ころも]の香[かおり]はレバノンの香[かおり]のようだ。"
  12: "わが姉妹[しまい]、わが花嫁[はなよめ]は閉[と]ざされた園[その]。閉ざされた園、封[ふう]じられた泉[いずみ]。"
  13: "あなたの若枝[わかえだ]はざくろの楽園[らくえん]、すぐれた果実[かじつ]を結[むす]び、ヘンナとナルド、"
  14: "ナルドとサフラン、菖蒲[しょうぶ]とシナモン、レバノンのすべてもろもろの木[き]とともに。没薬[もつやく]とアロエ、すべてもろもろの最[さい]上[じょう]の香油[こうゆ]とともに。"
  15: "もろもろの園[その]の泉[いずみ]、生[い]ける水[みず]の井戸[いど]、レバノンから勢[いきお]いよく流[なが]れ出[で]る水。」"
  16: "北風[きたかぜ]よ、目[め]を覚[さ]ませ。南風[みなみかぜ]よ、来[こ]い。わが園[その]に吹[ふ]き、わが香料[こうりょう]を流[なが]れさせよ。わが愛[あい]する者[もの]が自分[じぶん]の園[その]に下[くだ]り、そのすぐれた果実[かじつ]を食[た]べるように。"

notes:
  1: "Говорит возлюбленный, поэтому 「…」 до ст. 15. Ἰδοὺ εἶ καλή, ἡ πλησίον μου — «вот ты прекрасна, ближняя моя» (ἡ πλησίον — «ближняя», по глоссарию わが伴なる者); повтор ἰδού сохранён. ὀφθαλμοί σου περιστεραί — «глаза твои — голуби». ἐκτὸς τῆς σιωπήσεώς σου — букв. «кроме молчания твоего»: LXX так передаёт евр. «из-за покрывала твоего» (צמתך), слав. «кроме замолчания твоего»; оставлено буквально, без сглаживания. τρίχωμα — волосы; ἀγέλαι τῶν αἰγῶν — стада коз; ἀπεκαλύφθησαν ἀπὸ τοῦ Γαλααδ — «открылись от Галаада» (слав. «яже открышася от галаада»)."
  2: "Возлюбленный. ὀδόντες σου ὡς ἀγέλαι τῶν κεκαρμένων — «зубы твои как стада остриженных [овец]» (κείρω — стричь). ἀνέβησαν ἀπὸ τοῦ λουτροῦ — «вышли из купели» (λουτρόν — омовение, водоём). διδυμεύουσαι — «двоеплодные», приносящие близнецов (δίδυμοι); ἀτεκνοῦσα οὐκ ἔστιν ἐν αὐταῖς — «бесплодной нет между ними» (слав. «неродящия несть в них»)."
  3: "Возлюбленный. σπαρτίον τὸ κόκκινον — «нить червлёная» (σπαρτίον — шнур, тесьма; κόκκινον — багряное). λαλιά — речь, говор (слав. «беседа»). λέπυρον τῆς ῥόας — «кожура граната»; μῆλόν σου — букв. «яблоко твоё», но по-гречески μῆλα — ланиты, и слав. читает «ланиты твоя», поэтому 頬. ἐκτὸς τῆς σιωπήσεώς σου — как в ст. 1."
  4: "Возлюбленный. πύργος Δαυιδ — башня Давидова. ὁ ᾠκοδομημένος εἰς θαλπιωθ — «построенная в Фалпиоф»: слав. транслитерирует («создан в фалпиофе»), евр. значит «для оружий» (так ru), поэтому оставлена транслитерация タルピオト. θυρεοί — большие щиты; βολίδες — метательные копья, дротики, но слав. читает «стрелы», поэтому 矢."
  5: "Возлюбленный. νεβροὶ δίδυμοι δορκάδος — «два близнеца серны» (νεβρός — оленёнок, δορκάς — косуля, かもしか). οἱ νεμόμενοι ἐν κρίνοις — «пасущиеся между лилиями» (νέμω — пасти)."
  6: "Возлюбленный (в части толкований стих относят к женщине; по карте голосов — его речь, отмечено в шапке). ἕως οὗ διαπνεύσῃ ἡ ἡμέρα — «доколе не дохнёт день» (διαπνέω — веять, дышать; слав. «дондеже дхнет день»); κινηθῶσιν αἱ σκιαί — «двинутся тени»; формула та же, что в 2:17, и передана теми же словами. πορεύσομαι ἐμαυτῷ — «пойду себе» (датив интереса, евр. оборот), сохранено 自分のために. ὄρος τῆς σμύρνης — гора мирры; βουνός — холм."
  7: "Возлюбленный. ὅλη καλὴ εἶ — «вся прекрасна ты». μῶμος — порок, пятно, недостаток (слав. «порока несть в тебе»); οὐκ ἔστιν ἐν σοί — «нет в тебе»."
  8: "Возлюбленный. δεῦρο ἀπὸ Λιβάνου, νύμφη — «приди с Ливана, невеста» (νύμφη — 花嫁); δεῦρο повторено дважды, повтор сохранён. ἀπὸ ἀρχῆς πίστεως — букв. «от начала веры»: LXX так передаёт топоним Амана (אמונה, «верность»), слав. «из начала веры», ru «с вершины Аманы»; по паритету оставлено буквально. κεφαλὴ Σανιρ καὶ Ερμων — глава (вершина) Санира и Ермона. μάνδραι λεόντων — ограды, логовища львов; ὄρη παρδάλεων — горы барсов."
  9: "Возлюбленный. ἐκαρδίωσας ἡμᾶς — «сердце наше ты увлекла» (καρδιόω — пленять сердце): в LXX и csl («сердце наше привлекла еси») множественное число, оно сохранено — わたしたちの心; в ru единственное («сердце моё»). ἑνὶ ἀπὸ ὀφθαλμῶν σου — «одним из глаз твоих». ἔνθεμα τραχήλων — ожерелье, монисто (слав. «монисто выи твоея»)."
  10: "Возлюбленный. τί ἐκαλλιώθησαν — «как прекрасны стали» (καλλιόω); восклицание τί передано 何と…ことか, повтор сохранён. ἀπὸ οἴνου — «паче вина» (ἀπό в сравнительном значении), слав. «паче вина». ὀσμὴ ἱματίων σου — «запах одежд твоих»; ἄρωμα — 香料."
  11: "Возлюбленный. κηρίον — соты (слав. «сот»); ἀποστάζουσιν — «каплют» (ἀποστάζω). μέλι καὶ γάλα ὑπὸ τὴν γλῶσσάν σου — «мёд и молоко под языком твоим», в греч. без сказуемого, поэтому и по-японски назывное предложение. ὀσμὴ Λιβάνου — запах Ливана, т. е. ладана."
  12: "Возлюбленный. κῆπος κεκλεισμένος — «сад заключённый» (κλείω — запирать); повтор в греч. сохранён дословно. πηγὴ ἐσφραγισμένη — «источник запечатлённый» (σφραγίζω — запечатывать, ср. σφραγίς — 封印). ἀδελφή μου νύμφη — «сестра моя, невеста» (わが姉妹、わが花嫁)."
  13: "Возлюбленный. ἀποστολαί — «отростки, побеги» (слав. «леторасли»), отсюда 若枝. παράδεισος ῥοῶν — «рай гранатовый»; ῥοά — ざくろ. ἀκρόδρυα — древесные плоды, лучшие плоды (слав. «плод яблочный», ru «превосходные плоды»). κύπρος — хенна (ヘンナ по глоссарию); νάρδος — нард."
  14: "Возлюбленный. κρόκος — шафран; κάλαμος — благовонный тростник (菖蒲 по глоссарию); κιννάμωμον — корица; ἀλωθ — алоэ (греч. передаёт евр. אהלות, ароматическая смола, а не растение). ξύλα τοῦ Λιβάνου — «деревья Ливана», т. е. благовонные породы. πρῶτα μύρα — «первые, лучшие мази» (слав. «первыми мирами»)."
  15: "Возлюбленный; здесь его речь кончается (」). πηγὴ κήπων — «источник садов» (мн. ч.). φρέαρ ὕδατος ζῶντος — «колодезь воды живой». ῥοιζῶν — «шумно текущий, стремительный» (ῥοίζος — свист, шум), отсюда 勢いよく流れ出る."
  16: "Женщина, без кавычек. Вторая половина стиха — gr 4:16b: у csl она открывает 5:1 («Да снидет брат мой в виноградник свой…»), а csl 4:16 кончается на «и да потекут ароматы мои» (gr 4:16a); по брифу переведён весь греческий стих, поэтому в 4:16 обе половины, в 5:1 их повторять не нужно. Ἐξεγέρθητι, βορρᾶ — «воспрянь, север» (βορρᾶς — север и северный ветер; слав. «севере»), ἔρχου, νότε — «приди, юг» (νότος). διάπνευσον κῆπόν μου — «повей на сад мой»; ῥευσάτωσαν ἀρώματά μου — «да потекут ароматы мои». καταβήτω… καὶ φαγέτω — 3-е л. повелительного: «пусть сойдёт и ест», отсюда 下り…食べるように."
