# jp-box, 1-я Паралипоменон, глава 10. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет,
# jp-ni (943 стиха, под авторским правом) источником не был.
# Язык — современный 常体 (в диалоге тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 10: поражение при Гелвуе и смерть Саула (1–6); филистимляне занимают
# города, тела в капище (7–10); жители Галаада забирают тела и постятся (11–13);
# итог: царство переходит к Давиду (14). Параллель — 1 Цар 31.
# Речь — 「…」 (4, слова Саула). Красного нет.
# 〔…〕 нет: в gr-lxx-byz на месте каждого стиха есть текст.
# Сносок ⟨…⟩ нет: ペリシテ人, ギルボア山, 剣, 断食, 神殿 уже в корпусе.
# Где 1 Пар расходится с 1 Цар, держимся греческого текста 1 Пар., расхождение
# отмечено в notes; общие стихи (1, 4–5) переведены как в 1ts_31.
# jp-ni не использовался.

tr_code: jp-box
book: 1par
chapter: 10
draft: true

verses:
  1: "ペリシテ人[じん]はイスラエルと戦[たたか]った。イスラエルの男[おとこ]たちはペリシテ人[じん]の前[まえ]から逃[に]げ、ギルボア山[やま]で傷[きず]ついて倒[たお]れた。"
  2: "ペリシテ人[じん]はサウルとその息子[むすこ]たちの後[あと]を追[お]い、サウルの子[こ]ヨナタン、アミナダブ、メルキシュアを打[う]ち殺[ころ]した。"
  3: "戦[たたか]いはサウルにますます激[はげ]しくなり、弓[ゆみ]を射[い]る者[もの]たちが彼[かれ]を見[み]つけて、彼[かれ]は弓[ゆみ]のゆえに苦[くる]しんだ。"
  4: "サウルは武具[ぶぐ]を担[かつ]ぐ者[もの]に言[い]った。「おまえの剣[つるぎ]を抜[ぬ]いて、それでわたしを刺[さ]し殺[ころ]せ。この無[む]割礼[かつれい]の者[もの]たちが来[き]て、わたしを刺[さ]し、わたしを辱[はずか]しめてはならない。」しかし武具[ぶぐ]を担[かつ]ぐ者[もの]は、ひどく恐[おそ]れて、そうしようとしなかった。そこでサウルは剣[つるぎ]を取[と]って、その上[うえ]に倒[たお]れた。"
  5: "武具[ぶぐ]を担[かつ]ぐ者[もの]は、サウルが死[し]んだのを見[み]て、自分[じぶん]も剣[つるぎ]の上[うえ]に倒[たお]れて、彼[かれ]とともに死[し]んだ。"
  6: "こうしてサウルとその三人[さんにん]の息子[むすこ]たちは、その日[ひ]に死[し]んだ。彼[かれ]の家[いえ]のすべての者[もの]も、ともに死[し]んだ。"
  7: "谷[たに]にいるイスラエルの男[おとこ]たちはみな、イスラエルが逃[に]げたこと、サウルとその息子[むすこ]たちが死[し]んだことを見[み]て、自分[じぶん]たちの町[まち]を捨[す]てて逃[に]げた。ペリシテ人[じん]は来[き]て、それらの町[まち]に住[す]んだ。"
  8: "翌日[よくじつ]、ペリシテ人[じん]は倒[たお]れた者[もの]たちをはぎ取[と]ろうとして来[き]、サウルとその息子[むすこ]たちがギルボアの山[やま]に倒[たお]れているのを見[み]つけた。"
  9: "彼[かれ]らはサウルをはぎ取[と]り、その頭[あたま]と武具[ぶぐ]を取[と]って、ペリシテの地[ち]の周[まわ]り中[じゅう]に送[おく]り、自分[じぶん]たちの偶像[ぐうぞう]と民[たみ]に知[し]らせた。"
  10: "彼[かれ]らはその武具[ぶぐ]を自分[じぶん]たちの神[かみ]の神殿[しんでん]に置[お]き、その頭[あたま]をダゴンの神殿[しんでん]に据[す]えた。"
  11: "ギレアデに住[す]む者[もの]たちはみな、ペリシテ人[じん]がサウルとイスラエルにしたことをすべて聞[き]いた。"
  12: "ギレアデから力[ちから]ある者[もの]たちがみな立[た]ち上[あ]がり、サウルの体[からだ]とその息子[むすこ]たちの体[からだ]を取[と]ってヤビシュへ運[はこ]び、ヤビシュの樫[かし]の木[き]の下[した]にその骨[ほね]を葬[ほうむ]り、七日間[なのかかん]断食[だんじき]した。"
  13: "サウルは、自分[じぶん]の罪[つみ]のゆえに死[し]んだ。彼[かれ]は主[しゅ]に罪[つみ]を犯[おか]し、主[しゅ]の言葉[ことば]を守[まも]らなかったからである。サウルは霊媒[れいばい]に問[と]うて尋[たず]ねたので、預言者[よげんしゃ]サムエルが彼[かれ]に答[こた]えた。"
  14: "彼[かれ]は主[しゅ]に求[もと]めなかった。それゆえ主[しゅ]は彼[かれ]を殺[ころ]し、その王国[おうこく]をエッサイの子[こ]ダビデに移[うつ]された。"

notes:
  1: "ἀλλόφυλοι — иноплеменники, т.е. филистимляне (ペリシテ人, как в 1 Цар). ἐπολέμησαν πρὸς Ισραηλ — воевали с Израилем. ἔπεσον τραυματίαι — пали поражённые (τραυματίας). ὄρος Γελβουε — ギルボア山. Стих дословно совпадает с 1 Цар 31:1, перевод держим тот же."
  2: "κατεδίωξαν ὀπίσω — погнались вслед (καταδιώκω). ἐπάταξαν — поразили (πατάσσω). Ιωναθαν, Αμιναδαβ, Μελχισουε — ヨナタン、アミナダブ、メルキシュア; в 1 Цар 31:2 LXX читает Μελχισα (там メルキサ), здесь полная форма, как в 8:33 и 1 Цар 14:49."
  3: "ἐβαρύνθη ὁ πόλεμος ἐπὶ Σαουλ — «война отяжелела над Саулом». οἱ τοξόται ἐν τοῖς τόξοις καὶ πόνοις — стрелки с луками и трудами (тёмное место; ἐν πόνοις, возможно, «в изнеможении»). ἐπόνεσεν ἀπὸ τῶν τόξων — изнемог от луков (πονέω). В 1 Цар 31:3 иной текст: копейщики и лучники, рана в подреберье."
  4: "Σπάσαι τὴν ῥομφαίαν σου — обнажи меч твой (σπάω). ἐκκέντησόν με — проколи меня (ἐκκεντέω; в 1 Цар 31:4 ἀποκέντησον). οἱ ἀπερίτμητοι — необрезанные. ἐμπαίξωσίν μοι — поиздеваются надо мной. ἐπέπεσεν ἐπ᾿ αὐτήν — упал на него, на меч. Перевод согласован с 1 Цар 31:4."
  5: "ὁ αἴρων τὰ σκεύη αὐτοῦ — носящий оружие его, оруженосец (武具を担ぐ者). ἐπὶ τὴν ῥομφαίαν αὐτοῦ — на меч свой. Стих дословно совпадает с 1 Цар 31:5."
  6: "ἐν τῇ ἡμέρᾳ ἐκείνῃ — в тот день. πᾶς ὁ οἶκος αὐτοῦ ἐπὶ τὸ αὐτό — весь дом его вместе. В 1 Цар 31:6 стоит «и все люди его»; здесь «весь дом его» — чтение LXX 1 Пар., поэтому перевод иной."
  7: "ὁ ἐν τῷ αὐλῶνι — те, кто в долине (αὐλών); в 1 Цар 31:7 — «за долиной и за Иорданом». κατέλιπον τὰς πόλεις αὐτῶν — оставили города свои. κατῴκησαν ἐν αὐταῖς — поселились в них."
  8: "τῇ ἐχομένῃ — на следующий день. σκυλεύειν τοὺς τραυματίας — обирать поражённых (σκυλεύω). πεπτωκότας ἐν τῷ ὄρει Γελβουε — павших на горе Гелвуе."
  9: "ἐξέδυσαν αὐτὸν — совлекли его. ἔλαβον τὴν κεφαλὴν αὐτοῦ — взяли голову его; в слав. 1 Цар 31:9 добавлено «и отсекли главу», в гр. 1 Пар. просто «взяли». κύκλῳ — вокруг, по всей земле. εὐαγγελίσασθαι — возвестить. εἰδώλοις — идолам их."
  10: "οἶκος θεοῦ αὐτῶν — капище бога их (слав. «капищи бога своего»). οἶκος Δαγων — дом Дагона (ダゴン). В 1 Цар 31:10 — храм Астарты и стена Беф-Сана: иная передача того же события."
  11: "Γαλααδ — Галаад, область; слав. уточняет «во Иависе Галаадстем», Синод. «Иавис Галаадский». ἅπαντα ἃ ἐποίησαν — всё, что сделали. τῷ Σαουλ καὶ τῷ Ισραηλ — Саулу и Израилю (слав. добавляет «и сыном его»)."
  12: "πᾶς ἀνὴρ δυνατός — все мужи силы. ἤνεγκαν αὐτὰ εἰς Ιαβις — принесли их в Иавис. ἔθαψαν τὰ ὀστᾶ — похоронили кости. ὑπὸ τὴν δρῦν — под дуб (δρῦς; в 1 Цар 31:13 ἄρουρα — «поле»). ἐνήστευσαν ἑπτὰ ἡμέρας — постились семь дней."
  13: "ἐν ταῖς ἀνομίαις αὐτοῦ — в беззакониях его; ἠνόμησεν τῷ κυρίῳ — беззаконновал Господу, т.е. согрешил против Него. κατὰ τὸν λόγον κυρίου — по слову Господню. οὐκ ἐφύλαξεν — не сохранил (без дополнения). ἐγγαστρίμυθος — чревовещательница, 霊媒 (1 Цар 28). ἀπεκρίνατο αὐτῷ Σαμουηλ ὁ προφήτης — отвечал ему Самуил пророк: клауза есть в слав., в евр. отсутствует."
  14: "οὐκ ἐζήτησεν κύριον — не взыскал Господа. ἀπέκτεινεν αὐτὸν — умертвил его. ἐπέστρεψεν τὴν βασιλείαν — передал, обратил царство (ἐπιστρέφω). τῷ Δαυιδ υἱῷ Ιεσσαι — Давиду, сыну Иессея: イエッサイ."
