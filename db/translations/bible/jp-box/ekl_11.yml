tr_code: jp-box
book: ekl
chapter: 11
draft: true

verses:
  1: "あなたのパンを水[みず]の面[おもて]に送[おく]り出[だ]せ。多[おお]くの日[ひ]が過[す]ぎた後[のち]、あなたはそれを見[み]いだすからである。"
  2: "七[なな]人[にん]にも、八[や]人[にん]にも分[わ]け与[あた]えよ。地[ち]の上[うえ]に何[なに]が悪[わる]いこととして起[おこ]るか、あなたは知[し]らないからである。"
  3: "雲[くも]が雨[あめ]で満[み]ちれば、地[ち]に雨[あめ]を注[そそ]ぐ。木[き]が南[みなみ]に倒[たお]れても、北[きた]に倒[たお]れても、その木[き]が倒[たお]れた所[ところ]に、それはある。"
  4: "風[かぜ]を見張[みは]る者[もの]は種[たね]を蒔[ま]かず、雲[くも]を見[み]る者[もの]は刈[か]り入[い]れない。"
  5: "風[かぜ]の道[みち]を知[し]る者[もの]はない。妊[にん]婦[ぷ]の腹[はら]のなかで骨[ほね]がどう形[かたち]づくられるかも分[わ]からない。そのように、すべてをなさる神[かみ]の業[わざ]を、あなたは知[し]ることができない。"
  6: "朝[あさ]にはあなたの種[たね]を蒔[ま]き、夕[ゆう]べには手[て]を休[やす]めるな。どちらが実[みの]るか、これか、あれか、それとも両方[りょうほう]ともに良[よ]いか、あなたは知[し]らないからである。"
  7: "光[ひかり]は甘[あま]く、太陽[たいよう]を見[み]ることは目[め]に良[よ]い。"
  8: "人[ひと]がどれほど多[おお]くの年[とし]を生[い]きても、そのすべての年[とし]に喜[よろこ]び、暗[くら]い日[ひ]を思[おも]い起[おこ]す。その日[ひ]は多[おお]いからである。来[く]るものはすべて空[むな]しい。"
  9: "若[わか]い者[もの]よ、若[わか]い日[ひ]に喜[よろこ]べ。若[わか]い日[ひ]には、あなたの心[こころ]があなたを喜[よろこ]ばせるままにせよ。心[こころ]の赴[おもむ]く道[みち]を歩[あゆ]み、目[め]の見[み]るままに歩[あゆ]め。ただ、これらすべてのことについて、神[かみ]があなたを裁[さば]きへ連[つ]れて行[い]かれることを知[し]れ。"
  10: "あなたの心[こころ]から怒[いか]りを遠[とお]ざけ、あなたの肉[にく]から悪[わる]を取[と]り去[さ]れ。若[わか]さも無知[むち]も空[むな]しいからである。"

notes:
  1: "Ἀπόστειλον τὸν ἄρτον σου ἐπὶ πρόσωπον τοῦ ὕδατος — あなたのパンを水の面に送り出せ (букв. «пошли хлеб твой на лицо воды»; ἀποστέλλω — «посылать»; πρόσωπον ὕδατος — «поверхность воды»). Образ не сглаживаем до «по водам». ὅτι ἐν πλήθει τῶν ἡμερῶν εὑρήσεις αὐτόν — 多くの日が過ぎた後、あなたはそれを見いだす (πλῆθος ἡμερῶν — «множество дней»)."
  2: "δὸς μερίδα τοῖς ἑπτὰ καί γε τοῖς ὀκτώ — 七人にも八人にも分け与えよ (μερίς — «доля, часть»; семь и восемь — формула неопределённого множества, «многим»). ὅτι οὐ γινώσκεις τί ἔσται πονηρὸν ἐπὶ τὴν γῆν — 地の上に何が悪いこととして起こるか、あなたは知らない (πονηρόν — «злое»; у Синодального «беда» — сглажено)."
  3: "ἐὰν πληρωθῶσιν τὰ νέφη ὑετοῦ — 雲が雨で満ちれば (ὑετός — «дождь»). ἐπὶ τὴν γῆν ἐκχέουσιν — 地に雨を注ぐ. ἐὰν πέσῃ ξύλον ἐν τῷ νότῳ καὶ ἐὰν ἐν τῷ βορρᾷ — 木が南に倒れても北に倒れても (νότος — «юг», βορρᾶς — «север»). τόπῳ, οὗ πεσεῖται τὸ ξύλον, ἐκεῖ ἔσται — その木が倒れた所に、それはある."
  4: "τηρῶν ἄνεμον οὐ σπερεῖ — 風を見張る者は種を蒔かず (τηρέω — «стеречь, выжидать»; ἄνεμος — «ветер»). βλέπων ἐν ταῖς νεφέλαις οὐ θερίσει — 雲を見る者は刈り入れない (θερίζω — «жать»)."
  5: "ἐν οἷς οὐκ ἔστιν γινώσκων τίς ἡ ὁδὸς τοῦ πνεύματος — 風の道を知る者はいない (πνεῦμα здесь «ветер», поэтому 風; ср. 11:4 ἄνεμος). ὡς ὀστᾶ ἐν γαστρὶ τῆς κυοφορούσης — 妊婦の腹のなかで骨がどう形づくられるか (κυοφορέω — «быть беременной»; в греч. нет глагола при «кости», он добавлен по-японски). οὕτως οὐ γνώσῃ τὰ ποιήματα τοῦ θεοῦ, ὅσα ποιήσει σὺν τὰ πάντα — すべてをなさる神の業を、あなたは知ることができない (ποίημα — «дело»; σὺν τὰ πάντα — «всё вместе»)."
  6: "ἐν πρωίᾳ σπεῖρον τὸ σπέρμα σου — 朝にはあなたの種を蒔き. εἰς ἑσπέραν μὴ ἀφέτω ἡ χείρ σου — 夕べには手を休めるな (ἀφίημι — «опускать, оставлять»). ποῖον στοιχήσει — どちらが実るか (στοιχέω — «идти следом, удаваться»). ἢ τοῦτο ἢ τοῦτο — これか、あれか. ἐὰν τὰ δύο ἐπὶ τὸ αὐτὸ ἀγαθά — 両方ともに良い."
  7: "γλυκὺ τὸ φῶς — 光は甘く (γλυκύς — «сладкий»). ἀγαθὸν τοῖς ὀφθαλμοῖς τοῦ βλέπειν σὺν τὸν ἥλιον — 太陽を見ることは目に良い (ἀγαθόν — «благо, хорошо»; ср. «приятно» у Синодального)."
  8: "ἐὰν ἔτη πολλὰ ζήσεται ὁ ἄνθρωπος — 人がどれほど多くの年を生きても. ἐν πᾶσιν αὐτοῖς εὐφρανθήσεται — そのすべての年に喜び (εὐφραίνω — «веселиться»; будущее в греч. передано японским настоящим). μνησθῆναι τὰς ἡμέρας τοῦ σκότους — 暗い日を思い起こす. πᾶν τὸ ἐρχόμενον ματαιότης — 来るものはすべて空しい."
  9: "Εὐφραίνου, νεανίσκε, ἐν νεότητί σου — 若い者よ、若い日に喜べ (νεανίσκος — «юноша»). ἀγαθυνάτω σε ἡ καρδία σου — あなたの心があなたを喜ばせるままにせよ (ἀγαθύνω — «делать добрым, благодетельствовать»; слав. «да ублажит тя»). περιπάτει ἐν ὁδοῖς καρδίας σου καὶ ἐν ὁράσει ὀφθαλμῶν σου — 心の赴く道を歩み、目の見るままに歩め. Слав. добавляет «непорочен» и «и не в видении»: в греч. базе этого нет, 〔…〕 не ставим — перевод по греческому. ἐπὶ πᾶσι τούτοις ἄξει σε ὁ θεὸς ἐν κρίσει — これらすべてのことについて、神があなたを裁きへ連れて行かれる."
  10: "ἀπόστησον θυμὸν ἀπὸ καρδίας σου — 心から怒りを遠ざけ (θυμός — «ярость»; «печаль» Синодального — с масоретского). παράγαγε πονηρίαν ἀπὸ σαρκός σου — 肉から悪を取り去れ (παράγω — «уводить прочь»; σάρξ — «плоть»). ἡ νεότης καὶ ἡ ἄνοια ματαιότης — 若さも無知も空しい (ἄνοια — «неразумие, безумие»)."
