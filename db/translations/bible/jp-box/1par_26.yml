# jp-box, 1-я Паралипоменон, глава 26. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в 1 Пар нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 26: привратники — Кореяне (1–12), жребии врат (13–19), сокровищницы
# (20–28), надзиратели и судьи за Иорданом (29–32).
# Паритет LXX/csl: csl-чтения внесены в основной текст без 〔…〕 (26:1, 3, 6, 11).
# В 26:18 слав. механически повторяет ст. 16–17 (конфляция); переведено краткое
# чтение LXX, повтор оставлен в notes (см. отчёт по партии).
# Сносок ⟨…⟩ нет: 門衛, 宝物, くじ, 氏族, 半部族 уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: 1par
chapter: 26
draft: true

verses:
  1: "門[もん]の組[くみ]分[わ]けは次[つぎ]のとおりである。コラの子[こ]ら、すなわちメシェレミヤ、コレの子[こ]、アサフの子らから出[で]た者[もの]である。"
  2: "メシェレミヤの子[こ]らは、長子[ちょうし]ゼカリヤ、第二[だいに]はエディエル、第三[だいさん]はゼバデヤ、第四[だいし]はエトニエル、"
  3: "第五[だいご]はエラム、第六[だいろく]はヨナナン、第七[だいしち]はエリオエナイ、第八[だいはち]はオベデ・エドム。"
  4: "オベデ・エドムの子[こ]らは、長子[ちょうし]サマヤ、第二[だいに]はヨザバド、第三[だいさん]はヨアハ、第四[だいし]はサハル、第五[だいご]はナタナエル、"
  5: "第六[だいろく]はアミエル、第七[だいしち]はイサカル、第八[だいはち]はポラティ。神[かみ]が彼[かれ]を祝福[しゅくふく]されたからである。"
  6: "その子[こ]サマヤには、長子[ちょうし]の子[こ]らが生[う]まれ、彼[かれ]らはその父[ちち]の家[いえ]で長[かしら]となった。彼[かれ]らは力[ちから]ある者[もの]たちであったからである。"
  7: "サマヤの子[こ]らは、オフニ、ラファエル、オベド、エルザバド、アヒヤ。力[ちから]ある子[こ]らで、エリウ、サブキヤ、イスバコム。"
  8: "これらはみな、オベデ・エドムの子[こ]らのうちの者[もの]で、彼[かれ]らも、その兄弟[きょうだい]たちも、その子[こ]らも、務[つと]めにおいて力[ちから]を尽[つ]くして働[はたら]く者[もの]たちである。オベデ・エドムに属[ぞく]する者[もの]は全部[ぜんぶ]で六十二人[ろくじゅうににん]であった。"
  9: "メシェレミヤには、子[こ]らと兄弟[きょうだい]たちが十八人[じゅうはちにん]いて、力[ちから]ある者[もの]たちであった。"
  10: "メラリの子[こ]らのうち、ホサには、初[はじ]めの務[つと]めを守[まも]る子[こ]らがいた。彼[かれ]は長子[ちょうし]ではなかったが、父[ちち]が彼を長[かしら]としたのである。"
  11: "第二[だいに]の組[くみ]では、ヘルキヤが二番目[ばんめ]、タベリヤが三番目、ゼカリヤが四番目である。これらはみな、ホサの子[こ]らと兄弟[きょうだい]たちで、十三人[じゅうさんにん]であった。"
  12: "これらは門[もん]の組[くみ]分[わ]けであり、力[ちから]ある者[もの]たちの長[かしら]としての組[くみ]で、その兄弟[きょうだい]たちと同[おな]じく主[しゅ]の家[いえ]で務[つと]めるためであった。"
  13: "彼[かれ]らは、小[ちい]さい者[もの]も大[おお]きい者[もの]も、その父[ちち]の家[いえ]ごとに、それぞれの門[もん]のためにくじを投[な]げた。"
  14: "東[ひがし]のくじはサラミヤに、またゼカリヤに当[あ]たった。ヨアスの子[こ]らはメルキヤにくじを投[な]げ、くじは北[きた]に出[で]た。"
  15: "オベデ・エドムには南[みなみ]、エセフィンの家[いえ]の前[まえ]。"
  16: "第二[だいに]はホサに、西[にし]の、上[のぼ]り道[みち]のそばの門[もん]、すなわち、見張[みは]りと見張りが向[む]かい合[あ]う所[ところ]。"
  17: "東[ひがし]には一日[いちにち]に六人[ろくにん]、北[きた]には一日に四人[よにん]、南[みなみ]には一日に四人、エセフィンには二人[ふたり]。"
  18: "また西[にし]には四人[よにん]、小道[こみち]には二人[ふたり]が、交代[こうたい]して務[つと]めた。"
  19: "これが、コラの子[こ]らとメラリの子らの門衛[もんえい]の組[くみ]分[わ]けである。"
  20: "レビ人[びと]、すなわち彼[かれ]らの兄弟[きょうだい]たちは、主[しゅ]の家[いえ]の宝物[たからもの]と、聖別[せいべつ]されたものの宝物[たからもの]を司[つかさど]った。"
  21: "レアダンの子[こ]ら、すなわちゲルションの子[こ]らのうち、レアダンに属[ぞく]する父[ちち]の家[いえ]の長[かしら]は、イエヒエルである。"
  22: "イエヒエルの子[こ]ら、ゼトムとヨエル、およびその兄弟[きょうだい]たちは、主[しゅ]の家[いえ]の宝物[たからもの]を司[つかさど]った。"
  23: "アムラム、イサアル、ヘブロン、オジエルについては次[つぎ]のとおりである。"
  24: "シュバエル、すなわちモーセの子[こ]ゲルサムの子[こ]は、宝物[たからもの]の監督[かんとく]であった。"
  25: "その兄弟[きょうだい]エリエゼルの子[こ]はレハブヤ、その子はヨシャヤ、その子はヨラム、その子はゼクリ、その子はサロモトである。"
  26: "このサロモトとその兄弟[きょうだい]たちは、聖[せい]なる宝物[たからもの]のすべてを司[つかさど]った。これらは、王[おう]ダビデと父[ちち]の家[いえ]の長[かしら]たち、千人[せんにん]の長[かしら]、百人[ひゃくにん]の長[かしら]、軍[ぐん]の長[かしら]たちが聖別[せいべつ]したものである。"
  27: "彼[かれ]らは戦[たたか]いと分捕[ぶんど]り物[もの]から取[と]ったものを聖別[せいべつ]し、神[かみ]の家[いえ]の建[けん]設[せつ]が遅[おく]れないようにした。"
  28: "また、預言者[よげんしゃ]サムエル、キスの子[こ]サウル、ネルの子アブネル、サルヤの子ヨアブが聖別[せいべつ]したすべての聖[せい]なるものも、サロモトとその兄弟[きょうだい]たちの手[て]にゆだねられた。"
  29: "イサアルには、ケナニヤとその子[こ]らがいて、イスラエルに対する外[そと]の務[つと]め、すなわち書[か]き記[しる]すことと裁[さば]くことを担[にな]った。"
  30: "ヘブロンには、アシャブヤとその兄弟[きょうだい]たち、千七百人[せんななひゃくにん]の力[ちから]ある者[もの]たちがいた。彼[かれ]らはヨルダン川[がわ]の向[む]こう側[がわ]、西[にし]の方[ほう]でイスラエルの数[かぞ]えを司[つかさど]り、主[しゅ]のすべての務[つと]めと王[おう]の仕事[しごと]に当[あ]たった。"
  31: "ヘブロンの者[もの]では、その世代[せだい]ごと、氏族[しぞく]ごとに、エリヤがヘブロン人[びと]の長[かしら]であった。ダビデの治世[ちせい]の第四十年[だいよんじゅうねん]に彼[かれ]らは数[かぞ]えられ、その中[なか]から、ギレアデのヤゼルで力[ちから]ある者[もの]たちが見[み]いだされた。"
  32: "その兄弟[きょうだい]たちは、力[ちから]ある者[もの]たちで、二千七百人[にせんななひゃくにん]の父[ちち]の家[いえ]の長[かしら]であった。王[おう]ダビデは彼[かれ]らを、ルベンとガド、およびマナセの半部族[はんぶぞく]の上[うえ]に置[お]き、主[しゅ]のすべての命令[めいれい]と王[おう]の言葉[ことば]を行[おこな]わせた。"

notes:
  1: "διαιρέσεις τῶν πυλῶν — разделения врат (門の組分け); Κορειμ — Кореяне (コラの子ら, ср. 9:19); Μοσολλαμια — Мешелемия (слав. «моселлемиа»); υἱὸς Κωρη — сын Коре (Корей); Αβιασαφ — Авиасаф (LXX), но слав. «от сынов асафовых» (с евр.) — это чтение в тексте, LXX-вариант отмечен."
  2: "πρωτότοκος — первенец; Ιδιηλ — Иедиил (слав. «иадиил»); Ζαβαδιας — Зевадия (слав. «завадиа»); Ιεθνουηλ — Иефниил (слав. «иафанаил»)."
  3: "В LXX только три имени (пятый–седьмой); слав. и Синодальный (с евр.) добавляют восьмого — Овед-Едома (オベデ・エドム, ср. 26:4); csl-чтение в тексте, LXX-вариант отмечен. Ωλαμ — Елам (слав. «олам»); Ιωαναν — Иоанан (слав. «ионафан»); Ελιωηναι — Елиегоэнай (слав. «елионай»)."
  4: "Ιωζαβαδ — Иозавад (слав. «иозаваф»); Ιωαα — Иоаха (слав. «иоаф»); Σωχαρ — Сахар (слав. «сахар»); Ναθαναηλ — Нафанаил (слав. «рофануил»); ср. 2 Цар 6:10–12."
  5: "Φολλαθι — Фоллафи (слав. «фелафий», у Синодального Пеульфай); ὅτι εὐλόγησεν αὐτὸν ὁ θεός — ибо благословил его Бог."
  6: "LXX прибавляет имя Ρωσαι («первенца Рошая»), которого нет в слав.; по правилу паритета в тексте csl-чтение, LXX-вариант отмечен. ἐτέχθησαν — родились; εἰς τὸν οἶκον τὸν πατρικόν — в дом отца (для управления домом); δυνατοί — сильные."
  7: "Γοθνι — Гофни (слав. «офни»); Ραφαηλ — Рафаил; Ωβηδ — Овид; Ελζαβαδ — Елзавад; Αχιου — Ахиу (слав. «ахиа»); υἱοὶ δυνατοί — сыны сильные; три последних имени (Елиу, Савхия, Исваком) в LXX без связи — вероятно, братья Шемаии."
  8: "ποιοῦντες δυνατῶς ἐν τῇ ἐργασίᾳ — делающие крепко в деле (слав. «труждающеся крепко в делании»); οἱ πάντες — все вместе; ἑξήκοντα δύο — 62."
  9: "δέκα καὶ ὀκτώ — восемнадцать; δυνατοί — сильные; ср. 26:8."
  10: "φυλάσσοντες τὴν ἀρχήν — хранящие начало (первенство, главенство); ὅτι οὐκ ἦν πρωτότοκος — ибо не был первенцем; ἐποίησεν αὐτὸν ἄρχοντα — поставил его начальником; слав. прибавляет «разделения втораго» (второй чреды; ср. 26:16, где жребий Осы — «второе»), по делению LXX эта фраза переведена в начале ст. 11."
  11: "τῆς διαιρέσεως τῆς δευτέρας — второй чреды (по LXX открывает стих; слав. переносит это в конец ст. 10); Ταβλαι ὁ τρίτος, Ζαχαριας ὁ τέταρτος — Тавлай третий, Захария четвёртый; имени второго сына в LXX нет, слав. и Синодальный (с евр.) добавляют Хелкию (ヘルキヤ) — это чтение в тексте; πάντες … τρισκαίδεκα — всех тринадцать."
  12: "διαιρέσεις τῶν πυλῶν — разделения врат; ἄρχοντες τῶν δυνατῶν — начальники сильных; ἐφημερίαι — чреды (組); λειτουργεῖν ἐν οἴκῳ κυρίου — служить в доме Господнем."
  13: "κατὰ τὸν μικρὸν καὶ κατὰ τὸν μέγαν — малый наравне с большим; κατ᾿ οἴκους πατριῶν — по домам отцов; εἰς πυλῶνα καὶ πυλῶνα — на каждые ворота (букв. «в ворота и ворота»)."
  14: "τῶν πρὸς ἀνατολάς — тех, что к востоку; Σαλαμια — Саламия (слав. «селемиа»; евр. Шелемия); καὶ Ζαχαρια — и Захарии (у Синодального «сыну его, умному советнику» — чтение МТ); υἱοὶ Ιωας τῷ Μελχια — сыны Иоаса Мелхии (тёмное место; слав. «сынове соазовы мелхии»); ἔβαλον κλήρους — бросили жребии; βορρᾶ — север."
  15: "νότον — юг; κατέναντι οἴκου εσεφιν — против дома Есефин (слав. «прямо дому есефима»; у Синодального «при кладовых»); εσεφιν — неясное слово, вероятно «кладовые» (ср. 26:17)."
  16: "εἰς δεύτερον — во второе (вторая чреда); τῷ Ωσα πρὸς δυσμαῖς — Осе к западу; μετὰ τὴν πύλην παστοφορίου τῆς ἀναβάσεως — за воротами пастофория восхождения (παστοφόριον — боковая комната, притвор; слав. «по вратех притвора восхождения»); φυλακὴ κατέναντι φυλακῆς — стража против стражи (двойной караул)."
  17: "ἓξ τὴν ἡμέραν — шесть на день; βορρᾶ/νότον — север/юг; εἰς τὸ εσεφιν δύο — к Есефину два (ср. 26:15)."
  18: "εἰς διαδεχομένους — для сменяющих друг друга (смена); τρίβος — стезя, тропа (слав. «стезя»); LXX краток: «и к западу четыре, и на стезю два сменяющихся». Слав. здесь механически повторяет ст. 16–17 («осе к западу… по шести на день… и к дому совета два»); повтор не переведён, в тексте краткое чтение LXX (ср. Синодальный)."
  19: "πυλωροί — привратники (門衛); διαιρέσεις — разделения; подытоживающая формула, ср. 26:1."
  20: "οἱ Λευῖται ἀδελφοὶ αὐτῶν — левиты, братья их (остальные левиты, братья привратников); ἐπὶ τῶν θησαυρῶν — над сокровищами (заведовали); θησαυροὶ τῶν καθηγιασμένων — сокровищницы посвящённого (καθαγιάζω — освящать; слав. «сокровища святынь»)."
  21: "Λαδαν — Ладан (слав. «ладан»; евр. Лаедан); Γηρσων — Герсон (в корпусе ゲルション); Ιιηλ — Иеил (Иехиил, イエヒエル); ἄρχοντες πατριῶν — главы отцов; LXX и слав. тёмны, у Синодального: «от Лаедана, главы семейств от Лаедана Герсонского: Иехиел»."
  22: "Ζεθομ — Зефам (слав. «земеф»); Ιωηλ — Иоиль; οἱ ἀδελφοί — братья (с ними); ἐπὶ τῶν θησαυρῶν — над сокровищами."
  23: "τῷ Αμβραμ καὶ Ισσααρ Χεβρων καὶ Οζιηλ — Амраму и Иссаару, Хеврону и Озиилу (дательный без сказуемого — заголовок к ст. 24–25); формы корпуса: アムラム, イサアル, ヘブロン, オジエル."
  24: "Σουβαηλ — Шуваил (слав. «суваил»); ὁ τοῦ Γηρσαμ τοῦ Μωυσῆ — сын Гирсама (ゲルサム, как в Исх 2:22), сына Моисеева; ἡγούμενος ἐπὶ τῶν θησαυρῶν — начальствующий над сокровищами (слав. «настоятель над сокровищи»)."
  25: "Генеалогическая цепь (в слав. без «сын», но ср. ст. 26); Ρααβια — Рехавия (слав. «равиа»); Ιωσαιας — Иосаия; Ιωραμ — Иорам; Ζεχρι — Захрий; Σαλωμωθ — Саломоф (サロモト)."
  26: "αὐτός — сей (тот же); θησαυροὶ τῶν ἁγίων — сокровищницы святынь; οὓς ἡγίασεν — которые освятил; χιλίαρχοι καὶ ἑκατόνταρχοι — тысячники и сотники; ἀρχηγοὶ τῆς δυνάμεως — вожди войска."
  27: "ἐκ τῶν πολέμων — из войн (слав. «из градов» — неточность); λάφυρα — добыча, трофеи (分捕り物); τοῦ μὴ καθυστερῆσαι — чтобы не замедлить (καθυστερέω); οἰκοδομή — строение, постройка."
  28: "ἐπὶ πάντων τῶν ἁγίων — над всеми святынями; Σαμουηλ τοῦ προφήτου — Самуила пророка; Αβεννηρ τοῦ Νηρ — Авенира, сына Нира; Ιωαβ τοῦ Σαρουια — Иоава, сына Саруи; διὰ χειρὸς Σαλωμωθ — чрез руку Саломофа (под его началом)."
  29: "Τῷ Ισσαρι — Иссару (Ицгару); Χωνενια — Хонания (слав. «хонениа»); ἐργασία ἡ ἔξω — внешнее дело (слав. «делание внешнее»); ἐπὶ τὸν Ισραηλ — над Израилем; γραμματεύειν — быть писцом (書記), διακρίνειν — разбирать, судить."
  30: "υἱοὶ δυνατοί — сыны сильные (люди мужественные); χίλιοι καὶ ἑπτακόσιοι — 1700; ἐπὶ τῆς ἐπισκέψεως — над исчислением (надзор); πέραν τοῦ Ιορδάνου πρὸς δυσμαῖς — за Иорданом к западу; λειτουργία κυρίου — служение Господне; ἐργασία τοῦ βασιλέως — работа царя."
  31: "Ιουδιας — Иерия (слав. «уриа»; евр. Иерия, ср. 24:23); ὁ ἄρχων τῶν Χεβρωνι — начальник Хевронитов; κατὰ γενέσεις — по родам (по рождениям); ἐν τῷ τεσσαρακοστῷ ἔτει τῆς βασιλείας αὐτοῦ — в сороковой год царствования его (Давида); Ιαζηρ τῆς Γαλααδίτιδος — Иазер Галаадский (ギレアデのヤゼル); ἀνὴρ δυνατός — люди сильные."
  32: "υἱοὶ δυνατοί — сыны сильные; δισχίλιοι ἑπτακόσιοι — 2700; ἄρχοντες πατριῶν — главы отцов; ἐπὶ τοῦ Ρουβηνι καὶ Γαδδι καὶ ἡμίσους φυλῆς Μανασση — над Рувимом, Гаддом и половиной колена Манассии; εἰς πᾶν πρόσταγμα κυρίου καὶ λόγον βασιλέως — на всякое повеление Господне и слово царя."
