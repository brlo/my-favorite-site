verses:
  0: "アサフの教[おし]え。"
  1: "神[かみ]よ、なぜあなたはとこしえにわたしたちを退[しりぞ]けられたのか。あなたの怒[いか]りは、あなたの牧場[ぼくじょう]の羊[ひつじ]の上[うえ]に燃[も]えている。"
  2: "あなたが昔[むかし]から獲[え]られたあなたの集[つど]い、あなたが贖[あがな]ってご自分[じぶん]の嗣業[しぎょう]の杖[つえ]とされたもの、あなたがそこに住[す]まわれたこのシオンの山[やま]を、思[おも]い起[おこ]してください。"
  3: "あなたの手[て]を、彼[かれ]らの傲慢[ごうまん]の上[うえ]に、また敵[てき]があなたの聖所[せいしょ]で行[おこな]ったすべての悪[わる]の上[うえ]に、とこしえに上[あ]げてください。"
  4: "あなたを憎[にく]む者[もの]たちは、あなたの祭[まつ]りのただ中[なか]で誇[ほこ]り合[あ]い、自分[じぶん]たちのしるしをしるしとして掲[かか]げた。そして、彼[かれ]らは何[なに]も悟[さと]らなかった。"
  5: "それは、上[うえ]の入口[いりぐち]へと進[すす]むかのようであった。"
  6: "彼[かれ]らは森[もり]の木[き]を切[き]るように斧[おの]でその扉[とびら]を切[き]り倒[たお]し、手斧[ておの]と石工[せっこう]の道具[どうぐ]とで、一[いっ]斉[せい]にそれを打[う]ち壊[こわ]した。"
  7: "彼[かれ]らはあなたの聖所[せいしょ]を火[ひ]で焼[や]き、あなたの名[な]の幕屋[まくや]を地[ち]にまで汚[けが]した。"
  8: "彼[かれ]らは心[こころ]のうちで、一族[いちぞく]こぞって言[い]った。「さあ、神[かみ]の祭[まつ]りをすべて地[ち]から焼[や]き払[はら]おう」と。"
  9: "わたしたちは自分[じぶん]たちのしるしを見[み]ない。もはや預言者[よげんしゃ]はいない。そして、もはやわたしたちを知[し]る者[もの]もいない。"
  10: "いつまで、神[かみ]よ、敵[てき]があなたをそしり、逆[さか]らう者[もの]があなたの名[な]をとこしえに侮[あなど]るのだろうか。"
  11: "なぜあなたは御手[みて]を、あなたの右[みぎ]の手[て]を引[ひ]っ込[こ]めて、胸[むね]のただ中[なか]からとこしえに離[はな]しておられるのか。"
  12: "しかし、神[かみ]は昔[むかし]からわたしたちの王[おう]、地[ち]のただ中[なか]で救[すく]いを成[な]し遂[と]げられた方[かた]である。"
  13: "あなたはご自分[じぶん]の力[ちから]で海[うみ]を固[かた]くし、水[みず]の上[うえ]で竜[りゅう]たちの頭[あたま]を砕[くだ]かれた。"
  14: "あなたは竜[りゅう]の頭[あたま]を打[う]ち砕[くだ]き、それをエチオピアの人[ひと]々[びと]に食物[しょくもつ]として与[あた]えられた。"
  15: "あなたは泉[いずみ]と流[なが]れを裂[さ]き、あなたはエタムの川[かわ]を干[ひ]からされた。"
  16: "昼[ひる]はあなたのもの、夜[よる]もあなたのものである。あなたは光[ひかり]と太陽[たいよう]を整[ととの]えられた。"
  17: "あなたは地[ち]のすべての境[さかい]を定[さだ]め、夏[なつ]と春[はる]とを造[つく]られた。"
  18: "思[おも]い起[おこ]してください。敵[てき]は主[しゅ]をそしり、愚[おろ]かな民[たみ]はあなたの名[な]を侮[あなど]っている。"
  19: "あなたに告白[こくはく]する魂[たましい]を獣[けもの]に渡[わた]さないでください。あなたの貧[まず]しい者[もの]たちの魂[たましい]を、とこしえに忘[わす]れないでください。"
  20: "あなたの契約[けいやく]に目[め]を向[む]けてください。地[ち]の暗[くら]いところは、不法[ふほう]の家[いえ]で満[み]ちているからである。"
  21: "虐[しいた]げられた者[もの]が恥[はじ]を負[お]って退[しりぞ]かないようにしてください。貧[まず]しい者[もの]と乏[とぼ]しい者[もの]があなたの名[な]を賛美[さんび]するように。"
  22: "立[た]ち上[あ]がってください、神[かみ]よ。あなたの裁[さば]きを裁[さば]いてください。愚[おろ]かな者[もの]が一日中[いちにちじゅう]あなたをそしることを、思[おも]い起[おこ]してください。"
  23: "あなたに願[ねが]い求[もと]める者[もの]たちの声[こえ]を忘[わす]れないでください。あなたを憎[にく]む者[もの]たちの傲慢[ごうまん]は、いつもあなたに向[む]かって上[のぼ]ってくる。"

notes:
  0: "Συνέσεως τῷ Ασαφ — «Учение Асафа» (σύνεσις — «разумение»); 教え. Надписание — стих 0."
  1: "Ἵνα τί ἀπώσω εἰς τέλος — почему отринул до конца (ἀπωθέω — «отталкивать»); объект подразумевается, добавлено わたしたちを по церковному чтению. ὠργίσθη ὁ θυμός σου ἐπὶ πρόβατα νομῆς σου — あなたの怒りは…牧場の羊に燃える (νομή — «пастбище»)."
  2: "μνήσθητι τῆς συναγωγῆς σου, ἧς ἐκτήσω ἀπ᾽ ἀρχῆς — あなたが昔から獲られた集い (συναγωγή — «собрание, сонм»). ἐλυτρώσω ῥάβδον κληρονομίας σου — 贖って嗣業の杖とされた (ῥάβδος — «жезл»). ὄρος Σιων τοῦτο, ὃ κατεσκήνωσας ἐν αὐτῷ — そこに住まわれたこのシオンの山."
  3: "ἔπαρον τὰς χεῖράς σου ἐπὶ τὰς ὑπερηφανίας αὐτῶν εἰς τέλος — 手を彼らの傲慢の上に、とこしえに上げよ. ὅσα ἐπονηρεύσατο ὁ ἐχθρὸς ἐν τοῖς ἁγίοις σου — всё, что враг злодейски сделал в святынях Твоих; 聖所. Синтаксис греч. тёмный, сохранена двойная конструкция."
  4: "ἐνεκαυχήσαντο οἱ μισοῦντές σε ἐν μέσῳ τῆς ἑορτῆς σου — あなたを憎む者たちは祭りのただ中で誇り合い (ἐγκαυχάομαι — «хвалиться»). ἔθεντο τὰ σημεῖα αὐτῶν σημεῖα — 自分たちのしるしをしるしとして掲げた. καὶ οὐκ ἔγνωσαν — и не познали."
  5: "ὡς εἰς τὴν εἴσοδον ὑπεράνω — «как бы в входе вверху»; стих в LXX испорчен (в евр. «как поднимающий топор вверх»). Переведено буквально, без добавлений."
  6: "ὡς ἐν δρυμῷ ξύλων ἀξίναις ἐξέκοψαν τὰς θύρας αὐτῆς — 森の木を切るように斧でその扉を切り倒した (δρυμός — «дубрава»). ἐν πελέκει καὶ λαξευτηρίῳ κατέρραξαν αὐτήν — 手斧と石工の道具で打ち壊した (πέλεκυς — «топор»; λαξευτήριον — «тесло»)."
  7: "ἐνεπύρισαν ἐν πυρὶ τὸ ἁγιαστήριόν σου — 聖所を火で焼き. εἰς τὴν γῆν ἐβεβήλωσαν τὸ σκήνωμα τοῦ ὀνόματός σου — 名の幕屋を地にまで汚した (βεβηλόω — «осквернять»)."
  8: "εἶπαν ἐν τῇ καρδίᾳ αὐτῶν ἡ συγγένεια αὐτῶν ἐπὶ τὸ αὐτό — тёмное место: «родство их вместе»; понято как «все родом, вместе сказали». δεῦτε καὶ κατακαύσωμεν πάσας τὰς ἑορτὰς τοῦ θεοῦ ἀπὸ τῆς γῆς — 神の祭りをすべて地から焼き払おう. Слова врагов — 「」."
  9: "τὰ σημεῖα ἡμῶν οὐκ εἴδομεν — 自分たちのしるしを見ない. οὐκ ἔστιν ἔτι προφήτης — もはや預言者はいない. καὶ ἡμᾶς οὐ γνώσεται ἔτι — «и нас не познает уже»; подлежащее не названо (Бог), передано безличным 知る者もいない."
  10: "ἕως πότε ὀνειδιεῖ ὁ ἐχθρός — いつまで敵がそしるのか. παροξυνεῖ ὁ ὑπεναντίος τὸ ὄνομά σου εἰς τέλος — 逆らう者が名をとこしえに侮る (παροξύνω — «раздражать»)."
  11: "ἀποστρέφεις τὴν χεῖρά σου καὶ τὴν δεξιάν σου ἐκ μέσου τοῦ κόλπου σου — 御手と右手を胸のただ中から離す (κόλπος — «лоно, недро»)."
  12: "ὁ δὲ θεὸς βασιλεὺς ἡμῶν πρὸ αἰῶνος — 神は昔からわたしたちの王. εἰργάσατο σωτηρίαν ἐν μέσῳ τῆς γῆς — 地のただ中で救いを成し遂げられた."
  13: "σὺ ἐκραταίωσας ἐν τῇ δυνάμει σου τὴν θάλασσαν — 力で海を固くした (κραταιόω — «укреплять»). συνέτριψας τὰς κεφαλὰς τῶν δρακόντων ἐπὶ τοῦ ὕδατος — 水の上で竜たちの頭を砕いた (δράκων — «дракон»)."
  14: "συνέθλασας τὰς κεφαλὰς τοῦ δράκοντος — 竜の頭を打ち砕き. ἔδωκας αὐτὸν βρῶμα λαοῖς τοῖς Αἰθίοψιν — エチオピアの人々に食物として与えた (Αἰθίοψ — «эфиоп»). Евр. «народу пустыни»; следуем LXX."
  15: "διέρρηξας πηγὰς καὶ χειμάρρους — 泉と流れを裂き. ἐξήρανας ποταμοὺς Ηθαμ — エタムの川を干からせた (Ηθαμ — вероятно, поток Ефам; в Синодальном имя опущено)."
  16: "σή ἐστιν ἡ ἡμέρα, καὶ σή ἐστιν ἡ νύξ — 昼はあなたのもの、夜もあなたのもの. κατηρτίσω φαῦσιν καὶ ἥλιον — 光と太陽を整えた (φαῦσις — «свет, светило»)."
  17: "ἐποίησας πάντα τὰ ὅρια τῆς γῆς — 地のすべての境を定めた. θέρος καὶ ἔαρ, σὺ ἔπλασας αὐτά — 夏と春を造った (ἔαρ — «весна», не «зима»)."
  18: "μνήσθητι ταύτης — これを思い起こせ. ἐχθρὸς ὠνείδισεν τὸν κύριον — 敵は主をそしり. λαὸς ἄφρων παρώξυνεν τὸ ὄνομά σου — 愚かな民が名を侮る."
  19: "μὴ παραδῷς τοῖς θηρίοις ψυχὴν ἐξομολογουμένην σοι — 告白する魂を獣に渡すな (θηρίον — «зверь»). τῶν ψυχῶν τῶν πενήτων σου μὴ ἐπιλάθῃ εἰς τέλος — 貧しい者たちの魂をとこしえに忘れるな."
  20: "ἐπίβλεψον εἰς τὴν διαθήκην σου — 契約に目を向けよ. ἐπληρώθησαν οἱ ἐσκοτισμένοι τῆς γῆς οἴκων ἀνομιῶν — 地の暗いところは不法の家で満ちている (σκοτίζω — «помрачать»)."
  21: "μὴ ἀποστραφήτω τεταπεινωμένος κατῃσχυμμμένος — 虐げられた者が恥を負って退かないように. πτωχὸς καὶ πένης αἰνέσουσιν τὸ ὄνομά σου — 貧しい者と乏しい者が名を賛美する."
  22: "ἀνάστα, ὁ θεός, δίκασον τὴν δίκην σου — 立ち上がり、あなたの裁きを裁け (δικάζω — «судить»). μνήσθητι τῶν ὀνειδισμῶν σου τῶν ὑπὸ ἄφρονος ὅλην τὴν ἡμέραν — 愚かな者が一日中そしることを思い起こせ."
  23: "μὴ ἐπιλάθῃ τῆς φωνῆς τῶν ἱκετῶν σου — 願い求める者たちの声を忘れるな (ἱκέτης — «умоляющий»). ἡ ὑπερηφανία τῶν μισούντων σε ἀνέβη διὰ παντὸς πρὸς σέ — 憎む者たちの傲慢はいつもあなたに向かって上る."
