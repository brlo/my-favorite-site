# jp-box, Послание к Римлянам, глава 12. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный 常体, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 12: тела в жертву живую (1–2), смиренномудрие и дары (3–8),
# любовь и правила жизни (9–21).
# Красного и синего в главе нет; <j>/<mo> не ставятся. Цитаты Писания — в 『』.
# jp-ni не использовался.

tr_code: jp-box
book: rim
chapter: 12
draft: true

verses:
  1: "そこで、兄弟[きょうだい]たち、わたしは神[かみ]の憐[あわ]れみによって、あなたがたに勧[すす]める。あなたがたの体[からだ]を、生[い]ける、聖[せい]なる、神[かみ]に喜[よろこ]ばれるいけにえとしてささげなさい。それが、あなたがたの理性的[りせいてき]な礼拝[れいはい]である。"
  2: "この世[よ]に同[おな]じ形[かたち]を取[と]らされてはならない。むしろ、心[こころ]を新[あら]たにすることによって変[か]えられなさい。そうすれば、あなたがたは、神[かみ]の御心[みこころ]が何[なに]であるか、すなわち、善[よ]く、神[かみ]に喜[よろこ]ばれ、完全[かんぜん]なものであるかを、わきまえるようになる。"
  3: "というのは、わたしに与[あた]えられた恵[めぐ]みによって、あなたがたのうちの一人[ひとり]一人[ひとり]に言[い]う。思[おも]うべき以上[いじょう]に自分[じぶん]を思[おも]ってはならない。むしろ、神[かみ]が一人[ひとり]一人[ひとり]に分[わ]け与[あた]えられた信仰[しんこう]の量[りょう]に応[おう]じて、慎[つつし]み深[ぶか]く思[おも]いなさい。"
  4: "というのは、一[ひと]つの体[からだ]に多[おお]くの肢体[したい]があり、その肢体[したい]がすべて同[おな]じ働[はたら]きをするのではないように、"
  5: "わたしたちも、多[おお]くの者[もの]でありながら、キリストにあって一[ひと]つの体[からだ]であり、一人[ひとり]一人[ひとり]が互[たが]いの肢体[したい]なのである。"
  6: "わたしたちは、与[あた]えられた恵[めぐ]みに応[おう]じて、異[こと]なる賜物[たまもの]を持[も]っている。預言[よげん]の賜物[たまもの]があれば、信仰[しんこう]の程度[ていど]に応[おう]じて預言[よげん]しなさい。"
  7: "奉仕[ほうし]の賜物[たまもの]があれば、その奉仕[ほうし]に励[はげ]み、教[おし]える者[もの]は教[おし]えなさい。"
  8: "勧[すす]める者[もの]は勧[すす]め、分[わ]け与[あた]える者[もの]は惜[お]しみなく分[わ]け与[あた]え、司[つかさど]る者[もの]は熱心[ねっしん]に司[つかさど]り、憐[あわ]む者[もの]は喜[よろこ]んで憐[あわ]れみなさい。"
  9: "愛[あい]は偽[いつわ]りであってはならない。悪[あく]を憎[にく]み、善[ぜん]に親[した]しみなさい。"
  10: "兄弟[きょうだい]愛[あい]をもって互[たが]いに愛[あい]し、敬[うやま]いにおいて互[たが]いに先[さき]んじなさい。"
  11: "熱心[ねっしん]に努[つと]め、怠[おこた]ることなく、霊[れい]に燃[も]え、主[しゅ]に仕[つか]えなさい。"
  12: "望[のぞ]みをもって喜[よろこ]び、苦難[くなん]に耐[た]え、祈[いの]りに励[はげ]みなさい。"
  13: "聖徒[せいと]たちの必要[ひつよう]に与[あずか]り、もてなしに努[つと]めなさい。"
  14: "〔あなたがたを〕迫害[はくがい]する者[もの]たちを祝福[しゅくふく]しなさい。祝福[しゅくふく]して、呪[のろ]ってはならない。"
  15: "喜[よろこ]ぶ者[もの]とともに喜[よろこ]び、泣[な]く者[もの]とともに泣[な]きなさい。"
  16: "互[たが]いに同[おな]じ思[おも]いを抱[いだ]き、高[たか]いことを思[おも]わず、低[ひく]い者[もの]たちに伴[とも]いなさい。自分[じぶん]を賢[かしこ]い者[もの]と思[おも]ってはならない。"
  17: "だれにも悪[あく]をもって悪[あく]に報[むく]いず、すべての人[ひと]の前[まえ]に善[よ]いことを心[こころ]にかけなさい。"
  18: "できるなら、あなたがたの側[がわ]では、すべての人[ひと]と平和[へいわ]に暮[く]らしなさい。"
  19: "愛[あい]する者[もの]たちよ、自分[じぶん]で復讐[ふくしゅう]してはならない。むしろ、怒[いか]りに場[ば]を与[あた]えなさい。「復讐[ふくしゅう]はわたしのものであり、わたしが報[むく]いる」と主[しゅ]は言[い]われるからである。"
  20: "むしろ、「もしあなたの敵[てき]が飢[う]えているなら、その者[もの]に食[た]べさせ、渇[かわ]いているなら、飲[の]ませなさい。そうすることによって、あなたはその者[もの]の頭[あたま]に燃[も]える炭[すみ]を積[つ]むことになる」のである。"
  21: "悪[あく]に負[ま]けてはならない。むしろ、善[ぜん]をもって悪[あく]に勝[か]ちなさい。"

notes:
  1: "παραστῆσαι — «представить»; ささげる. θυσίαν ζῶσαν — «жертву живую»; 生けるいけにえ. λογικὴ λατρεία — «разумное (словесное) служение»; 理性的な礼拝 (ср. jp-joc「靈智なる役」). οἰκτιρμοί — 憐[あわ]れみ."
  2: "συσχηματίζεσθαι / μεταμορφοῦσθαι — «сообразоваться / преображаться»; 同じ形を取る / 変えられる. ἀνακαίνωσις τοῦ νοός — «обновление ума»; 心を新たにすること. δοκιμάζειν — わきまえる."
  3: "σωφρονεῖν — «быть трезвым, целомудренным»; 慎み深く思う. μέτρον πίστεως — «мера веры»; 信仰の量. Трижды φρονεῖν — 思う, повторено."
  4: "πρᾶξις — «действие, дело»; 働き. Сравнение с телом — одно предложение с 12:5."
  5: "τὸ δὲ καθ᾿ εἷς ἀλλήλων μέλη — «а порознь один другого члены»; 一人一人が互いの肢体."
  6: "χαρίσματα — «дарования»; 賜物. ἀναλογία τῆς πίστεως — «соразмерность веры»; 信仰の程度. Ряд даров с εἴτε сохранён; императивы — なさい, как в книге."
  7: "εἴτε διακονίαν ἐν τῇ διακονίᾳ — 奉仕の賜物があれば、その奉仕に. В греч. ряд без глаголов; по-японски глаголы подразумеваются, как у jp-joc「役事に居れ、敎へよ」."
  8: "ἁπλότης — «простота, щедрость»; 惜しみなく. προϊστάμενος — «предстоятельствующий»; 司る者. ἱλαρότης — «радушие»; 喜んで."
  9: "ἀνυπόκριτος — «нелицемерная»; 偽りであってはならない. ἀποστυγοῦντες / κολλώμενοι — 憎み / 親しみ."
  10: "φιλαδελφία / φιλόστοργος — «братолюбие / нежно любящий»; 兄弟愛 / 深く愛する. προηγούμενοι — «предваряющие»; 先んじる."
  11: "σπουδή — «усердие»; 熱心. ζέοντες — «кипящие»; 燃えて. τῷ κυρίῳ δουλεύοντες — 主に仕える."
  12: "θλῖψις — «скорбь»; 苦難. προσκαρτεροῦντες — «постоянствующие»; 励む."
  13: "κοινωνοῦντες — «участвующие»; あずかる. φιλοξενία — «страннолюбие»; もてなし."
  14: "В базе εὐλογεῖτε τοὺς διώκοντας без ὑμᾶς; церковный текст (Синодальный «гонителей ваших», jp-joc「爾等を窘逐する者」) читает ὑμᾶς — 〔あなたがたを〕. Проверено по базе: ὑμᾶς в ст. 14 — 0 вхождений. Двойное εὐλογεῖτε сохранено."
  15: "χαίρειν μετὰ χαιρόντων, κλαίειν μετὰ κλαιόντων — инфинитивы как повеление; 喜び…泣きなさい."
  16: "τὸ αὐτὸ φρονεῖν — 同じ思いを抱く. τοῖς ταπεινοῖς συναπαγόμενοι — «смиренным последуя, с ними сходясь»; 低い者たちに伴う. μὴ γίνεσθε φρόνιμοι παρ᾿ ἑαυτοῖς — 自分を賢い者と思ってはならない."
  17: "ἀποδιδόντες — 報いる. προνοούμενοι καλά — «промышляя доброе»; 善いことを心にかける."
  18: "τὸ ἐξ ὑμῶν — «что от вас»; あなたがたの側では. εἰρηνεύοντες — 平和に暮らす."
  19: "δότε τόπον τῇ ὀργῇ — «дайте место гневу»; 怒りに場を与えなさい: чей гнев (Божий или свой) не уточняется, двусмысленность сохранена (в базе без τοῦ θεοῦ). Втор 32:35."
  20: "Притч 25:21–22. ἄνθρακας πυρὸς σωρεύσεις — 燃える炭を積む. ἐχθρός — 敵."
  21: "μὴ νικῶ ὑπὸ τοῦ κακοῦ — «не будь побеждён злом»; 悪に負けてはならない. νίκα ἐν τῷ ἀγαθῷ τὸ κακόν — 善をもって悪に勝ちなさい."
