# jp-box, Деяния апостолов, глава 2. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 2: Пятидесятница (1–13), речь Петра (14–36), призыв и первая община (37–47).
# Красного (<j>) в главе нет: Христос здесь не говорит. Речь Петра, слова толпы
# и цитаты из Писания — не красные. Синего (<mo>) нет.
# 〔…〕: 2:30 — церковное «по плоти воздвигнуть Христа»; 2:41 — ἀσμένως «охотно»;
# 2:43 — «в Иерусалиме»; 2:47 — «к Церкви». Всё сверено с Синодальным и jp-joc,
# в базе этих слов нет. Места базы в квадратных скобках (2:20, 2:33) не обёрнуты.
# jp-ni не использовался.

tr_code: jp-box
