verses:
  1: "五旬節[ごじゅんせつ]⟨過越祭[すぎこしまつり]から五十日目[ごじゅうにちめ]に行[おこな]われるユダヤの祭[まつ]り。麦[むぎ]の収穫[しゅうかく]を神[かみ]に感謝[かんしゃ]する。⟩の日[ひ]が満[み]ちるころ、彼[かれ]らは皆[みな]、心[こころ]を一[ひと]つにして一[ひと]つの所[ところ]に集[あつ]まっていた。"
  2: "すると、突然[とつぜん]、天[てん]から激[はげ]しい風[かぜ]が吹[ふ]き過[す]ぎるような音[おと]がして、彼[かれ]らが座[すわ]っていた家[いえ]の全[ぜん]体[たい]を満[み]たした。"
  3: "そして、火[ひ]のように分[わ]かれた舌[した]が彼[かれ]らに現[あらわ]れ、一人[ひとり]一人[ひとり]の上[うえ]に留[とど]まった。"
  4: "彼[かれ]らは皆[みな]、{聖霊[せいれい]|聖神[せいしん]}に満[み]たされ、霊[れい]が語[かた]らせるとおりに、ほかの言[こと]葉[ば]で話[はな]し始[はじ]めた。"
  5: "そのとき、エルサレムには、天[てん]下[か]のあらゆる国[くに]から来[き]た敬虔[けいけん]なユダヤ人[じん]たちが住[す]んでいた。"
  6: "この音[おと]がしたので、多[おお]くの人[ひと]が集[あつ]まって来[き]て、戸惑[とまど]った。彼[かれ]らがそれぞれ自分[じぶん]の国[くに]の言[こと]葉[ば]で話[はな]しているのを聞[き]いたからである。"
  7: "彼[かれ]らは驚[おどろ]き、不思議[ふしぎ]に思[おも]って言[い]った。「見[み]なさい。話[はな]しているこの人[ひと]たちは、みなガリラヤ人[じん]ではないか。"
  8: "それなのに、わたしたちは一人[ひとり]一人[ひとり]、自分[じぶん]の生[う]まれた国[くに]の言[こと]葉[ば]を聞[き]いている。どうしてだろうか。"
  9: "わたしたちは、パルティア人[じん]、メディア人[じん]、エラム人[じん]、またメソポタミア、ユダヤ、カパドキア、ポント、アジアに住[す]む者[もの]、"
  10: "フリギア、パンフィリア、エジプト、またキレネに近[ちか]いリビアの地[ち]方[ほう]に住[す]む者[もの]、ローマから来[き]て滞在[たいざい]している者[もの]、"
  11: "ユダヤ人[じん]も、ユダヤ教[きょう]に改宗[かいしゅう]した者[もの]も、クレタ人[じん]、アラビア人[じん]も、彼[かれ]らがわたしたちの言[こと]葉[ば]で、神[かみ]の大[おお]いなる御業[みわざ]を語[かた]るのを聞[き]いているのだ。」"
  12: "彼[かれ]らは皆[みな]、驚[おどろ]き、戸惑[とまど]いながら、互[たが]いに言[い]った。「いったい、これはどういうことなのか。」"
  13: "しかし、ほかの者[もの]たちはあざ笑[わら]って、「あの者[もの]たちは甘[あま]いぶどう酒[しゅ]に酔[よ]っているのだ」と言[い]った。"
  14: "そこで、ペトロは十一人[じゅういちにん]とともに立[た]ち、声[こえ]を張[は]り上[あ]げて彼[かれ]らに告[つ]げた。「ユダヤの人[ひと]たち、またエルサレムに住[す]むすべての者[もの]たちよ、このことを知[し]りなさい。わたしの言[こと]葉[ば]に耳[みみ]を傾[かたむ]けなさい。"
  15: "あなたがたが思[おも]っているように、この人[ひと]たちは酔[よ]っているのではない。今[いま]は、日[ひ]の第三時[だいさんじ]である。"
  16: "かえって、これは預言者[よげんしゃ]ヨエルによって語[かた]られたことである。"
  17: "『終[お]わりの日[ひ]々[び]に、神[かみ]は言[い]われる。わたしはわたしの霊[れい]を、すべての肉[にく]なる者[もの]の上[うえ]に注[そそ]ぐ。あなたがたの子[こ]らも娘[むすめ]たちも預言[よげん]し、若[わか]い者[もの]たちは幻[まぼろし]を見[み]、年[とし]を取[と]った者[もの]たちは夢[ゆめ]を見[み]る。"
  18: "その日[ひ]には、わたしは僕[しもべ]たちにも、はしためたちにも、わたしの霊[れい]を注[そそ]ぐ。彼[かれ]らも預言[よげん]する。"
  19: "また、わたしは上[うえ]の天[てん]に奇跡[きせき]を、下[しも]の地[ち]にしるしを現[あらわ]す。すなわち、血[ち]と火[ひ]と煙[けむり]の立[た]つことである。"
  20: "主[しゅ]の大[おお]いなる輝[かがや]かしい日[ひ]が来[く]る前[まえ]に、太陽[たいよう]は暗[くら]やみに、月[つき]は血[ち]に変[か]わる。"
  21: "そして、主[しゅ]の名[な]を呼[よ]ぶ者[もの]は、すべて救[すく]われるであろう。』"
  22: "イスラエルの人[ひと]たちよ、この言[こと]葉[ば]を聞[き]きなさい。ナザレのイエスは、神[かみ]があなたがたの中[なか]で、イエスを通[とお]して行[おこな]われた力[ちから]ある業[わざ]と奇跡[きせき]としるしによって、神[かみ]からあなたがたに証[あかし]された方[かた]である。あなたがた自身[じしん]も知[し]っているとおりである。"
  23: "この方[かた]を、あなたがたは、神[かみ]の定[さだ]められた計画[けいかく]と予知[よち]によって引[ひ]き渡[わた]された者[もの]として受[う]け取[と]り、不法[ふほう]の者[もの]たちの手[て]によって十字架[じゅうじか]につけ、殺[ころ]したのである。"
  24: "しかし、神[かみ]は死[し]の苦[くる]しみを解[と]いて、この方[かた]を復活[ふっかつ]させた。死[し]がこの方[かた]を捕[とら]えておくことはできなかったからである。"
  25: "ダビデはこの方[かた]について言[い]っている。『わたしはいつも、主[しゅ]をわたしの前[まえ]に見[み]ていた。主[しゅ]がわたしの右[みぎ]におられるので、わたしは揺[ゆ]るがない。"
  26: "それゆえ、わたしの心[こころ]は喜[よろこ]び、わたしの舌[した]は喜[よろこ]び躍[おど]った。わたしの肉[にく]もまた、希望[きぼう]のうちに宿[やど]るであろう。"
  27: "あなたはわたしの魂[たましい]を陰府[よみ]に捨[す]て置[お]かれず、あなたの聖[せい]なる者[もの]が朽[く]ちるのを見[み]させられないからである。"
  28: "あなたはわたしに命[いのち]の道[みち]を示[しめ]し、あなたの御顔[みかお]の前[まえ]で、わたしを喜[よろこ]びで満[み]たしてくださる。』"
  29: "兄弟[きょうだい]たちよ、わたしは族長[ぞくちょう]ダビデについて、はばかることなくあなたがたに言[い]うことができる。すなわち、彼[かれ]は死[し]んで葬[ほうむ]られ、その墓[はか]は今日[きょう]に至[いた]るまで、わたしたちの間[あいだ]にある。"
  30: "彼[かれ]は預言者[よげんしゃ]であり、神[かみ]が彼[かれ]に誓[ちか]って、その腰[こし]の実[み]から〔肉[にく]に従[したが]ってキリストを起[お]こし、〕その王座[おうざ]に着[つ]かせると約束[やくそく]されたことを知[し]っていたので、"
  31: "先[さき]を見[み]て、キリストの復活[ふっかつ]について語[かた]った。すなわち、キリストは陰府[よみ]に捨[す]て置[お]かれず、その肉[にく]が朽[く]ちることもなかったのである。"
  32: "このイエスを、神[かみ]は復活[ふっかつ]させた。わたしたちは皆[みな]、その証人[しょうにん]である。"
  33: "そこで、イエスは神[かみ]の右[みぎ]の手[て]によって高[たか]く上[あ]げられ、父[ちち]から{聖霊[せいれい]|聖神[せいしん]}の約束[やくそく]を受[う]けて、あなたがたが今[いま]見[み]、また聞[き]いているものを注[そそ]ぎ出[だ]されたのである。"
  34: "ダビデは天[てん]に上[あ]がったのではない。彼[かれ]自身[じしん]がこう言[い]っている。『主[しゅ]はわたしの主[しゅ]に言[い]われた。「わたしの右[みぎ]に座[すわ]れ。"
  35: "わたしがあなたの敵[てき]を、あなたの足台[あしだい]とするまで」と。』"
  36: "だから、イスラエルの全[ぜん]家[か]は、確[たし]かに知[し]らなければならない。あなたがたが十字架[じゅうじか]につけたこのイエスを、神[かみ]は主[しゅ]ともキリストともされた、と。」"
  37: "彼[かれ]らはこれを聞[き]いて心[こころ]を刺[さ]され、ペトロやほかの使徒[しと]たちに言[い]った。「兄弟[きょうだい]たちよ、わたしたちはどうしたらよいのでしょうか。」"
  38: "ペトロは彼[かれ]らに言[い]った。「悔[く]い改[あらた]めなさい。そして、あなたがたは一人[ひとり]一人[ひとり]、罪[つみ]の赦[ゆる]しを受[う]けるために、イエス・キリストの名[な]によって洗礼[せんれい]を受けなさい。そうすれば、{聖霊[せいれい]|聖神[せいしん]}の賜[たまもの]を受[う]けるであろう。"
  39: "この約束[やくそく]は、あなたがたと、あなたがたの子[こ]どもたち、また遠[とお]くにいるすべての者[もの]、すなわち、わたしたちの主[しゅ]である神[かみ]がお呼[よ]びになる者[もの]たちに与[あた]えられているからである。」"
  40: "また、ペトロはほかにも多[おお]くの言[こと]葉[ば]で証[あかし]し、彼[かれ]らに勧[すす]めて言[い]った。「この曲[ま]がった世代[せだい]から救[すく]われなさい。」"
  41: "そこで、ペトロの言[こと]葉[ば]を〔喜[よろこ]んで〕受[う]け入[い]れた者[もの]たちは洗礼[せんれい]を受[う]けた。その日[ひ]、加[くわ]えられた者[もの]はおよそ三千人[さんぜんにん]であった。"
  42: "彼[かれ]らは、使徒[しと]たちの教[おし]えと交[まじ]わり、パンを裂[さ]くことと祈[いの]りとに、ひたすら励[はげ]んでいた。"
  43: "すべての人[ひと]に恐[おそ]れが生[しょう]じ、多[おお]くの奇跡[きせき]としるしが、使徒[しと]たちによって〔エルサレムで〕行[おこな]われた。"
  44: "信[しん]じた者[もの]たちは皆[みな]、一[ひと]つに集[あつ]まり、すべての物[もの]を共[とも]に持[も]っていた。"
  45: "そして、財産[ざいさん]や所有[しょゆう]の物[もの]を売[う]り、それぞれの必要[ひつよう]に応[おう]じて、すべての人[ひと]に分[わ]け与[あた]えた。"
  46: "また、日[ひ]ごとに心[こころ]を一[ひと]つにして神殿[しんでん]に集[つど]い、家[いえ]ごとにパンを裂[さ]いて、喜[よろこ]びと素直[すなお]な心[こころ]で食事[しょくじ]をし、"
  47: "神[かみ]をほめたたえ、民[たみ]全体[ぜんたい]から好[この]ましく思[おも]われていた。主[しゅ]は、救[すく]われる者[もの]たちを日[ひ]ごとに〔教会[きょうかい]に〕加[くわ]えておられた。"

notes:
  1: "Пятидесятница — сноска при первом упоминании в корпусе. ὁμοῦ ἐπὶ τὸ αὐτό — «вместе в одно место»; 心を一つにして一つの所に."
  2: "πνοῆς βιαίας — «сильного дыхания, ветра»; 激しい風. ἐπλήρωσεν ὅλον τὸν οἶκον — 家の全体を満たした."
  3: "διαμεριζόμεναι γλῶσσαι ὡσεὶ πυρός — «разделяющиеся языки, как бы огненные»; 火のように分かれた舌."
  4: "τὸ πνεῦμα ἐδίδου ἀποφθέγγεσθαι — «Дух давал провещевать»; 霊が語らせるとおりに (у jp-joc «神», это его ошибка чтения)."
  5: "εὐλαβεῖς — 敬虔な. ἀπὸ παντὸς ἔθνους τῶν ὑπὸ τὸν οὐρανόν — 天下のあらゆる国から."
  6: "συνεχύθη — «пришли в смятение»; 戸惑った. τῇ ἰδίᾳ διαλέκτῳ — 自分の国の言葉."
  7: "Речь толпы — не красная. Γαλιλαῖοι — ガリラヤ人."
  8: "Вопрос 2:7 продолжается; どうしてだろうか."
  9: "Перечень народов по греч.; 9–11 — одно предложение, сказуемое в 11."
  11: "προσήλυτοι — «пришельцы, обращённые»; ユダヤ教に改宗した者. μεγαλεῖα τοῦ θεοῦ — 神の大いなる御業."
  12: "διηπόρουν — «недоумевали»; 戸惑いながら."
  13: "γλεῦκος — «сладкое молодое вино»; 甘いぶどう酒."
  14: "ἀπεφθέγξατο — «возгласил»; 告げた. Речь Петра — не красная."
  15: "ὥρα τρίτη — третий час дня, около девяти утра; 日の第三時."
  16: "Иоиль 2:28–32 по LXX."
  17: "ἐκχεῶ ἀπὸ τοῦ πνεύματός μου — «излию от Духа Моего»; 霊を…注ぐ (в греч. πνεῦμά μου, не πνεῦμα ἅγιον, поэтому без кальки 聖霊)."
  18: "δούλους … δούλας — 僕／はしため."
  19: "τέρατα … σημεῖα — 奇跡…しるし, как в 2:22 и 2:43. ἀτμὶς καπνοῦ — 煙の立つこと."
  20: "[καὶ ἐπιφανῆ] в базе есть (в квадратных скобках) — 〔…〕 не ставится; 輝かしい."
  21: "ἐπικαλέσηται τὸ ὄνομα κυρίου — 主の名を呼ぶ."
  22: "ἀποδεδειγμένος — «засвидетельствованный»; 証された. Длинный период греч. разрезан по стихам, сказуемое — в 2:23."
  23: "ἔκδοτον — «преданного»; 引き渡された者として受け取り. ἀνείλατε — 殺した."
  24: "ὠδῖνας τοῦ θανάτου — «боли (узы) смерти»; 死の苦しみ (у jp-joc 縲)."
  25: "Пс 15:8–11 по LXX."
  26: "ἠγαλλιάσατο — 喜び躍った. κατασκηνώσει ἐπ᾿ ἐλπίδι — 希望のうちに宿る."
  27: "ᾅδης — 陰府, как везде в корпусе (地獄 оставлено за γέεννα)."
  29: "πατριάρχης — 族長. μετὰ παρρησίας — はばかることなく."
  30: "В базе нет τὸ κατὰ σάρκα ἀναστήσειν τὸν Χριστόν; церковный текст (Синодальный «воздвигнуть Христа во плоти», jp-joc「肉体に依りて、ハリストスを興して」) читает с ними — 〔…〕. αὐτοῦ — престол Давида."
  31: "προϊδών — 先を見て."
  33: "τῇ δεξιᾷ τοῦ θεοῦ ὑψωθείς — 神の右の手によって高く上げられ."
  34: "Пс 109:1. Вложенная речь: 『…「…」と』."
  35: "ὑποπόδιον — 足台."
  36: "ἀσφαλῶς — 確かに. Слово «Иисус» в конце периода — このイエス."
  37: "κατενύγησαν τὴν καρδίαν — «умилились сердцем»; 心を刺され."
  38: "ἐπὶ τῷ ὀνόματι Ἰησοῦ Χριστοῦ — イエス・キリストの名によって. δωρεά — 賜物."
  39: "εἰς μακράν — 遠くにいる者."
  40: "γενεὰ σκολιά — 曲がった世代."
  41: "ἀσμένως — чтение Церкви (Синодальный «охотно», jp-joc「喜びて」); в базе нет — 〔喜んで〕."
  42: "κοινωνία — 交わり; κλάσις τοῦ ἄρτου — パンを裂くこと."
  43: "ἐν Ἰερουσαλήμ — чтение Церкви (Синодальный «в Иерусалиме», jp-joc「イエルサリムに」); в базе нет — 〔エルサレムで〕."
  44: "εἶχον ἅπαντα κοινά — すべての物を共に持っていた."
  45: "κτήματα καὶ ὑπάρξεις — 財産や所有の物. καθότι ἄν τις χρείαν εἶχεν — それぞれの必要に応じて."
  46: "ἀφελότης καρδίας — «простота сердца»; 素直な心."
  47: "τῇ ἐκκλησίᾳ — чтение Церкви (Синодальный «к Церкви», jp-joc「教会に」); в базе ἐπὶ τὸ αὐτό — 〔教会に〕."
