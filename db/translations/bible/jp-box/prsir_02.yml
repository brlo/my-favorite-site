# jp-box, Сирах, глава 2. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для книги нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 2: как принимать испытания (1–6); надежда боящихся Господа (7–11);
# горе малодушным и потерявшим терпение (12–14); свойства боящихся Господа (15–17);
# их исповедание (18).
# Прямая речь — только 2:18, слова боящихся Господа, в 「…」; вводка к ней стоит
# в конце 2:17 по слав. («глаголюще»), в LXX её нет. Прочее — авторский текст.
# Нумерация по gr: 18 стихов; деление совпадает с csl-ru и ru, сдвигов нет.
# Слав. добавления внесены в основной текст без скобок: 2:1 «Богу» (Господеви Богу),
# 2:17 «говоря» — в LXX их нет (отмечено в notes).
# 〔…〕 нет: все 18 стихов есть в gr-lxx-byz. Сносок ⟨…⟩ нет: 試練, 報い, 律法,
# あわれみ уже в корпусе. Имён и топонимов в главе нет.

tr_code: jp-box
book: prsir
chapter: 2
draft: true

verses:
  1: "子[こ]よ、主[しゅ]なる神[かみ]に仕[つか]えるために近[ちか]づくなら、試練[しれん]のために魂[たましい]を備[そな]えよ。"
  2: "心[こころ]をまっすぐにし、耐[た]え忍[しの]べ。災[わざわ]いが臨[のぞ]む時[とき]に、あわててはならない。"
  3: "主[しゅ]に寄[よ]り添[そ]い、離[はな]れてはならない。そうすれば、終[お]わりにあなたは豊[ゆた]かにされる。"
  4: "あなたの上[うえ]に降[ふ]りかかることは何[なに]であれ受[う]け入[い]れ、あなたが辱[はずかし]められる移[うつ]り変[か]わりの中[なか]でも、長[なが]く耐[た]え忍[しの]べ。"
  5: "火[ひ]の中[なか]で金[きん]が試[ため]され、受[う]け入[い]れられる人[ひと]も辱[はずかし]めの炉[ろ]で試されるからである。"
  6: "主[しゅ]を信[しん]じよ。そうすれば、主はあなたを助[たす]けてくださる。あなたの道[みち]をまっすぐにし、主に望[のぞ]みを置[お]け。"
  7: "主[しゅ]を恐[おそ]れる者[もの]たちよ、そのあわれみを待[ま]ち望[のぞ]め。心[こころ]をそらしてはならない。倒[たお]れることがないためである。"
  8: "主[しゅ]を恐[おそ]れる者[もの]たちよ、主を信[しん]じよ。そうすれば、あなたがたの報[むく]いが失[うしな]われることはない。"
  9: "主[しゅ]を恐[おそ]れる者[もの]たちよ、良[よ]いものと、永遠[えいえん]の喜[よろこ]びと、あわれみとに望[のぞ]みを置[お]け。"
  10: "目[め]を昔[むかし]の代[よ]々に向[む]けて見[み]よ。主[しゅ]を信[しん]じて辱[はずかし]められた者[もの]がいるか。主を恐[おそ]れて捨[す]てられた者がいるか。主を呼[よ]び求[もと]めたとき、主がその者[もの]を顧[かえり]みられなかったことがあるか。"
  11: "主[しゅ]は情[なさ]け深[ぶか]く、あわれみ深[ぶか]い方[かた]であり、罪[つみ]を赦[ゆる]し、苦[くる]しみの時[とき]に救[すく]ってくださるからである。"
  12: "臆[おく]した心[こころ]、力[ちから]の失[う]せた手、二[ふた]つの道[みち]に踏[ふ]み入[い]る罪人[つみびと]は、災[わざわ]いである。"
  13: "気[き]の弱[よわ]った心[こころ]は災[わざわ]いである。それが信[しん]じないからである。それゆえ、それは覆[おお]われることがない。"
  14: "耐[た]え忍[しの]ぶことを失[うしな]ったあなたがたは災[わざわ]いである。主[しゅ]が訪[おとず]れられる時[とき]、あなたがたは何[なに]をするのか。"
  15: "主[しゅ]を恐[おそ]れる者[もの]たちは主の言葉[ことば]を疑[うたが]わず、主を愛[あい]する者[もの]たちは主の道[みち]を守[まも]る。"
  16: "主[しゅ]を恐[おそ]れる者[もの]たちは主の御心[みこころ]を求[もと]め、主を愛する者[もの]たちは律法[りっぽう]に満[み]たされる。"
  17: "主[しゅ]を恐[おそ]れる者[もの]たちは自分[じぶん]の心[こころ]を備[そな]え、主の前[まえ]で自分の魂[たましい]を低[ひく]くして、こう言[い]う。"
  18: "「わたしたちは人[ひと]の手にではなく、主[しゅ]の御手[みて]に落[お]ちよう。主[しゅ]の偉大[いだい]さが大[おお]きいのと同[おな]じように、そのあわれみも大[おお]きいからである。」"

notes:
  1: "Τέκνον — «чадо, сын» (обращение учителя); εἰ προσέρχῃ δουλεύειν κυρίῳ — «если приступаешь служить Господу»; ἑτοίμασον τὴν ψυχήν σου εἰς πειρασμόν — «приготовь душу твою к испытанию» (πειρασμός — испытание, искушение; передано 試練). Слав. «Господеви Богу» добавляет «Богу», чего в LXX нет; внесено в основной текст без скобок."
  2: "εὔθυνον τὴν καρδίαν σου — «выпрями сердце твоё» (εὐθύνω — выправлять, направлять); καρτέρησον — «терпи, держись» (καρτερέω); μὴ σπεύσῃς — «не поспеши» (σπεύδω — спешить), слав. «не скор буди»; ἐν καιρῷ ἐπαγωγῆς — «во время наведения», т. е. бедствия (ἐπαγωγή); ru «посещения» передаёт иначе."
  3: "κολλήθητι αὐτῷ — «прилепись к Нему» (κολλάω); ἵνα αὐξηθῇς ἐπ᾽ ἐσχάτων σου — «чтобы ты возрос в последних твоих», т. е. в конце (αὐξάνω — расти, умножаться); слав. «да возрастеши на последок твой». Передано 豊かにされる."
  4: "πᾶν, ὃ ἐὰν ἐπαχθῇ σοι, δέξαι — «всё, что ни будет наложено на тебя, прими» (ἐπάγω — наводить, налагать); ἐν ἀλλάγμασιν ταπεινώσεώς σου — «в переменах уничижения твоего» (ἄλλαγμα — перемена, оборот); μακροθύμησον — «долготерпи» (μακροθυμέω)."
  5: "ἐν πυρὶ δοκιμάζεται χρυσός — «в огне испытывается золото» (δοκιμάζω — испытывать, пробовать); ἄνθρωποι δεκτοί — «люди принятые, угодные» (δεκτός), т. е. прошедшие испытание; καμίνῳ ταπεινώσεως — «в горниле уничижения» (κάμινος — печь, горнило). Во второй половине греч. сказуемое опущено (эллипсис), в переводе добавлено 試される для параллелизма."
  6: "πίστευσον αὐτῷ — «поверь Ему»; ἀντιλήμψεταί σου — «возьмёт тебя, поможет» (ἀντιλαμβάνομαι), слав. «заступит тя» — защитит; εὔθυνον τὰς ὁδούς σου — «выпрями пути твои»; ἔλπισον ἐπ᾽ αὐτόν — «уповай на Него»."
  7: "οἱ φοβούμενοι τὸν κύριον — «боящиеся Господа», формула передана 主を恐れる者たち; ἀναμείνατε τὸ ἔλεος αὐτοῦ — «дождитесь милости Его» (ἀναμένω); μὴ ἐκκλίνητε — «не уклонитесь» (ἐκκλίνω — отклоняться); ἵνα μὴ πέσητε — «чтобы не пасть»."
  8: "πιστεύσατε αὐτῷ — «верьте Ему»; οὐ μὴ πταίσῃ ὁ μισθὸς ὑμῶν — «не потерпит крушения награда ваша» (πταίω — спотыкаться, падать); слав. «не имать отпасти мзда ваша» («не отпадёт»), передано 失われることはない."
  9: "ἐλπίσατε εἰς ἀγαθά — «уповайте на блага»; εὐφροσύνη αἰῶνος — «веселие века», т. е. вечная радость (αἰών); ἔλεος — милость. Три дополнения при одном сказуемом сохранены."
  10: "ἐμβλέψατε εἰς ἀρχαίας γενεάς — «воззрите на древние роды» (ἐμβλέπω); τίς ἐνεπίστευσεν κυρίῳ καὶ κατῃσχύνθη — «кто поверил Господу и был постыжен»; ἐνέμεινεν τῷ φόβῳ αὐτοῦ — «пребыл в страхе Его»; ἐπεκαλέσατο — «призвал» (ἐπικαλέομαι); ὑπερεῖδεν — «презрел, обошёл вниманием» (ὑπεροράω), передано 顧みられなかった. Три риторических вопроса сохранены."
  11: "οἰκτίρμων καὶ ἐλεήμων — «щедр и милостив» (οἰκτίρμων, ἐλεήμων); ἀφίησιν ἁμαρτίας — «оставляет грехи» (ἀφίημι); σῴζει ἐν καιρῷ θλίψεως — «спасает во время скорби» (θλῖψις)."
  12: "οὐαί — «горе» (передано 災い); καρδίαις δειλαῖς — «сердцам робким» (δειλός — робкий, малодушный); χερσὶν παρειμέναις — «рукам ослабленным, опущенным» (παρίημι — ослаблять); ἐπιβαίνοντι ἐπὶ δύο τρίβους — «ступающему на две тропы» (τρίβος — тропа). Образ двоедушия сохранён."
  13: "καρδίᾳ παρειμένῃ — «сердцу ослабленному»; ὅτι οὐ πιστεύει — «ибо не верует»; οὐ σκεπασθήσεται — «не будет покрыто» (σκεπάζω — покрывать, защищать). Слав. «покровено не будет»."
  14: "τοῖς ἀπολωλεκόσιν τὴν ὑπομονήν — «погубившим терпение» (ὑπομονή — терпение, стойкость); ἐπισκέπτηται — «посещает, взыскивает» (ἐπισκέπτομαι). Риторический вопрос сохранён."
  15: "οὐκ ἀπειθήσουσιν ῥημάτων αὐτοῦ — «не ослушаются слов Его» (ἀπειθέω); слав. «не сумневаются о глаголех его» — «не сомневаются», иное чтение, взято по паритету (передано 疑わず), вариант LXX отмечен здесь; συντηρήσουσιν τὰς ὁδοὺς αὐτοῦ — «сохранят пути Его»."
  16: "ζητήσουσιν εὐδοκίαν αὐτοῦ — «взыщут благоволения Его» (εὐδοκία); ἐμπλησθήσονται τοῦ νόμου — «исполнятся закона» (ἐμπίπλημι — наполнять), т. е. будут насыщены законом."
  17: "ἑτοιμάσουσιν καρδίας αὐτῶν — «приготовят сердца свои»; ταπεινώσουσιν τὰς ψυχὰς αὐτῶν — «смирят души свои» (ταπεινόω); слав. добавляет «(глаголюще:)» — «говоря», в LXX вводки нет; внесено в текст как вводка к прямой речи 18."
  18: "ἐμπεσούμεθα εἰς χεῖρας κυρίου — «впадём в руки Господа» (ἐμπίπτω), слав. «да впадем в руце Господни»; ὡς ἡ μεγαλωσύνη αὐτοῦ, οὕτως καὶ τὸ ἔλεος αὐτοῦ — «как величие Его, так и милость Его» (μεγαλωσύνη). Речь боящихся Господа, начатая в 17, — в 「…」."
