verses:
  1: "モアブは、アハブが死[し]んだ後[あと]、イスラエルから離反[りはん]した。"
  2: "アハズヤは、サマリアにある自分[じぶん]の屋上[おくじょう]の部屋[へや]の格子窓[こうしまど]から落[お]ちて、病気[びょうき]になった。そこで使者[ししゃ]たちを送[おく]って、彼らに言[い]った。「行[い]って、エクロンの神[かみ]、はえのバアルに問[と]うて、この病気[びょうき]から生[い]き延[の]びるかどうかを。」彼らはそれを問[と]うために出[で]かけた。"
  3: "主[しゅ]の使[つか]いがティシュベ人[じん]エリヤに語[かた]って言[い]われた。「立[た]って、サマリアの王[おう]アハズヤの使者[ししゃ]たちに会[あ]いに行[い]き、彼らに言[い]いなさい。『イスラエルに神[かみ]がおられないからといって、あなたがたはエクロンの神[かみ]、はえのバアルに問[と]おうとしているのか。』」"
  4: "「それゆえ、主[しゅ]はこう言[い]われる。『あなたが上[のぼ]って横[よこ]たわった寝床[ねどこ]から、あなたは下[お]りることはない。そこであなたは必[かなら]ず死[し]ぬ。』」そしてエリヤは行[い]って、彼らに言[い]った。"
  5: "使者[ししゃ]たちは彼のところへ戻[もど]った。彼は彼らに言[い]った。「どうして戻[もど]って来[き]たのか。」"
  6: "彼らは彼に言[い]った。「一人[ひとり]の人[ひと]がわたしたちに会[あ]いに上[のぼ]って来[き]て、わたしたちに言[い]った。『行[い]って、あなたがたを遣[つか]わした王[おう]のもとへ戻[もど]り、彼に言[い]いなさい。主[しゅ]はこう言[い]われる。「イスラエルに神[かみ]がおられないからといって、あなたはエクロンの神[かみ]、はえのバアルに問[と]おうとしているのか。それゆえ、あなたが上[のぼ]って横[よこ]たわった寝床[ねどこ]から、あなたは下[お]りることはない。そこであなたは必[かなら]ず死[し]ぬ。」』」"
  7: "王[おう]は彼らに言[い]った。「あなたがたに会[あ]いに上[のぼ]って来[き]て、これらの言葉[ことば]を語[かた]ったその人[ひと]は、どんな様子[ようす]だったか。」"
  8: "彼らは言[い]った。「毛深[けぶか]い人[ひと]で、皮[かわ]の帯[おび]を腰[こし]に締[し]めていた。」そこで彼は言[い]った。「それはティシュベ人[じん]エリヤだ。」"
  9: "王[おう]は五十人[ごじゅうにん]の長[かしら]を、その五十人[ごじゅうにん]とともにエリヤのもとへ送[おく]った。彼は上[のぼ]ってエリヤのところへ来[き]た。見[み]ると、エリヤは山[やま]の頂[いただき]に座[すわ]っていた。五十人[ごじゅうにん]の長[かしら]は彼に言[い]った。「神[かみ]の人[ひと]よ、王[おう]があなたを呼[よ]んでおられる。下[お]りて来[き]なさい。」"
  10: "エリヤは五十人[ごじゅうにん]の長[かしら]に答[こた]えて言[い]った。「もしわたしが神[かみ]の人[ひと]なら、天[てん]から火[ひ]が降[ふ]って、あなたとあなたの五十人[ごじゅうにん]を焼[や]き尽[つ]くすように。」すると、天[てん]から火[ひ]が降[ふ]って、彼とその五十人[ごじゅうにん]を焼[や]き尽[つ]くした。"
  11: "王[おう]はまた、ほかの五十人[ごじゅうにん]の長[かしら]を、その五十人[ごじゅうにん]とともに送[おく]った。彼は上[のぼ]って行[い]って、エリヤに言[い]った。「神[かみ]の人[ひと]よ、王[おう]はこう言[い]っておられる。『急[いそ]いで下[お]りて来[き]なさい。』」"
  12: "エリヤは彼に答[こた]えて言[い]った。「もしわたしが神[かみ]の人[ひと]なら、天[てん]から火[ひ]が降[ふ]って、あなたとあなたの五十人[ごじゅうにん]を焼[や]き尽[つ]くすように。」すると、天[てん]から火[ひ]が降[ふ]って、彼とその五十人[ごじゅうにん]を焼[や]き尽[つ]くした。"
  13: "王[おう]はまた、三人目[さんにんめ]の五十人[ごじゅうにん]の長[かしら]を、その五十人[ごじゅうにん]とともに送[おく]った。この三人目[さんにんめ]の五十人[ごじゅうにん]の長[かしら]は来[き]て、エリヤの前[まえ]にひざまずき、彼に願[ねが]って言[い]った。「神[かみ]の人[ひと]よ、どうか、わたしの命[いのち]と、この五十人[ごじゅうにん]のしもべたちの命[いのち]が、あなたの目[め]に尊[とうと]く思[おも]われるように。」"
  14: "「見[み]なさい。天[てん]から火[ひ]が降[ふ]って、初[はじ]めの二人[ふたり]の五十人[ごじゅうにん]の長[かしら]たちと、その五十人[ごじゅうにん]たちを焼[や]き尽[つ]くした。どうか今[いま]、しもべたちの命[いのち]があなたの目[め]に尊[とうと]く思[おも]われるように。」"
  15: "主[しゅ]の使[つか]いはエリヤに言[い]った。「彼と一緒[いっしょ]に下[お]りて行[い]きなさい。彼らの顔[かお]を恐[おそ]れてはならない。」エリヤは立[た]って、彼とともに王[おう]のもとへ下[くだ]った。"
  16: "彼に言[い]った。「主[しゅ]はこう言[い]われる。『あなたが使者[ししゃ]たちを送[おく]って、エクロンの神[かみ]、はえのバアルに問[と]わせたのは、イスラエルに神[かみ]がおられず、その言葉[ことば]を問[と]うこともできないかのようであったからだ。それゆえ、あなたが上[のぼ]って横[よこ]たわった寝床[ねどこ]から、あなたは下[お]りることはない。そこであなたは必[かなら]ず死[し]ぬ。』」"
  17: "こうして彼は、エリヤが語[かた]った主[しゅ]の言葉[ことば]のとおりに死[し]んだ。彼には子[こ]がなかったので、その兄弟[きょうだい]ヨラムが彼に代[か]わって王[おう]となった。これはユダの王[おう]ヨシャファトの子[こ]ヨラムの第二年[だいにねん]のことであった。"
  18: "アハズヤの残[のこ]りの事[こと]ども、彼が行[おこな]ったすべてのことは、イスラエルの王[おう]たちの日誌[にっし]の書[しょ]に記[しる]されているではないか。"

notes:
  1: "ἠθέτησεν — «отложился, изменил» (ἀθετέω); ἐν Ισραηλ — «от Израиля» (ἐν в смысле «против»). Слав. «отступи... по умертвии Ахаавли». Стих-заглавие, в 3:5 повторён в иной форме."
  2: "ἔπεσεν διὰ τοῦ δικτυωτοῦ — «упал через решётку» (δικτυωτόν — сетчатое окно, 格子窓); ὑπερῷον — 屋上の部屋 (слав. «горница»). ἠρρώστησεν — «заболел». Βααλ μυῖαν θεὸν Ακκαρων — «Ваал-муха, бог Аккарона»: LXX переводит евр. זְבוּב «муха», отсюда はえのバアル; слав. «ваала сквернаго» — иное чтение, ru «Веельзевул» — по МТ. ἐπιζητῆσαι — «вопросить, разузнать» (ἐπιζητέω). εἰ ζήσομαι ἐκ τῆς ἀρρωστίας — «выздоровею ли от болезни». ἐπορεύθησαν ἐπερωτῆσαι δι᾿ αὐτοῦ — «пошли вопросить через него» (слав. «вопрошати его ради»), т. е. через это божество."
  3: "ἄγγελος κυρίου — ангел Господень. Ἀναστὰς δεῦρο — «встав, иди» (ἀνίστημι). Ηλιου τὸν Θεσβίτην — Илия Фесвитянин (ティシュベ人; ср. 3Цар 17:1; 20:17). εἰς συνάντησιν τῶν ἀγγέλων Οχοζιου βασιλέως Σαμαρείας — «навстречу послам Охозии, царя Самарии». Εἰ παρὰ τὸ μὴ εἶναι θεὸν ἐν Ισραηλ — «если из-за того, что нет Бога в Израиле»; риторический вопрос, слав. «или несть Бога во израили, яко грядете»."
  4: "καὶ οὐχ οὕτως — «и не так»: тёмное чтение, вероятно порча; слав. «и сего ради» (по МТ לָכֵן «потому») — принято в тексте (それゆえ), вариант LXX отмечен. Ἡ κλίνη, ἐφ᾿ ἧς ἀνέβης ἐκεῖ — «постель, на которую ты взошёл туда» (слав. «одр, наньже возшел еси ту»). οὐ καταβήσῃ ἀπ᾿ αὐτῆς — «не сойдёшь с неё». ὅτι ἐκεῖ θανάτῳ ἀποθανῇ — «ибо там смертью умрёшь» (плеоназм). ἐπορεύθη Ηλιου καὶ εἶπεν πρὸς αὐτούς — «пошёл Илия и сказал им»: исполнение повеления ст. 3, поэтому последняя клауза — уже повествование, а не речь (в гр порядок тот же: сначала слова, потом «пошёл и сказал»)."
  5: "ἐπεστράφησαν οἱ ἄγγελοι — «возвратились послы» (ἐπιστρέφω). Τί ὅτι ἐπεστρέψατε — «что [это], что вы возвратились?», т. е. «почему вернулись?» (слав. «что яко возвратистеся»)."
  6: "Ἀνὴρ ἀνέβη εἰς συνάντησιν ἡμῶν — «человек вышел (взошёл) навстречу нам». ὁ βασιλεὺς ὁ ἀποστείλας ὑμᾶς — «царь, пославший вас». В словах Господа здесь 2-е л. ед. ч. (σὺ πορεύῃ — «ты идёшь»), в ст. 3 — мн. ч. (πορεύεσθε); слав. так же. οὐχ οὕτως — см. ст. 4, принято слав. «сего ради». θανάτῳ ἀποθανῇ — «смертью умрёшь»."
  7: "Τίς ἡ κρίσις τοῦ ἀνδρός — букв. «каков суд (вид) мужа»: κρίσις здесь «вид, облик» (слав. «каков взором»), не «суд». В гр нет «ὁ βασιλεύς»; слав. добавляет «царь» («И рече к ним царь») — внесено по смыслу (王は)."
  8: "Ἀνὴρ δασύς — «человек волосатый, косматый» (δασύς; слав. «космат»). ζώνη δερματίνη — кожаный пояс (слав. «поясом усменным»). ὀσφύς — чресла (腰). В гр нет подлежащего при εἶπεν; слав. «И рече царь» — внесено (そこで彼は). Οὗτός ἐστιν — «это он»."
  9: "ἡγούμενον πεντηκόνταρχον — «начальствующего пятидесятника» (плеоназм: ἡγούμενος и πεντηκόνταρχος; слав. «старейшину пятьдесятника»), передано 五十人の長. ἀνέβη καὶ ἦλθεν — «взошёл и пришёл». ἐπὶ τῆς κορυφῆς τοῦ ὄρους — «на вершине горы». Ἄνθρωπε τοῦ θεοῦ — «человек Божий» (обращение к пророку). ὁ βασιλεὺς ἐκάλεσέν σε — «царь позвал тебя»."
  10: "ἀπεκρίθη … καὶ εἶπεν — «ответил и сказал». Καὶ εἰ ἄνθρωπος τοῦ θεοῦ ἐγώ — «и если я человек Божий» (καί плеонастическое при условии). καταφάγεταί σε — «пожрёт тебя» (κατεσθίω). κατέβη πῦρ ἐκ τοῦ οὐρανοῦ — «сошёл огонь с неба»."
  11: "προσέθετο … ἀποστεῖλαι — «приложил (ещё) послать» (προστίθημι). ἄλλον πεντηκόνταρχον — другого пятидесятника (в гр нет ἡγούμενον, как в ст. 9). Ταχέως κατάβηθι — «быстро сойди» (слав. «потщався сниди»)."
  12: "ἀπεκρίθη … καὶ ἐλάλησεν … καὶ εἶπεν — три глагола речи (слав. так же). κατέβη πῦρ ἐκ τοῦ οὐρανοῦ — в гр без «Божий»; ru добавляет «огонь Божий» (по МТ) — не внесено."
  13: "προσέθετο ὁ βασιλεὺς ἔτι ἀποστεῖλαι — «приложил царь ещё послать». ἔκαμψεν ἐπὶ τὰ γόνατα αὐτοῦ — «преклонил колени свои». ἐδεήθη αὐτοῦ — «умолял его» (δέομαι). ἐντιμωθήτω δή — «да будет почтена» (ἐντιμόω), в смысле «пощажена» (слав. «пощади»); передано 尊く思われるように. ἡ ψυχή — здесь «жизнь» (命)."
  14: "ἰδού — «вот» (слав. «се»). τοὺς δύο πεντηκοντάρχους τοὺς πρώτους — «двух пятидесятников первых». ἐντιμωθήτω — как в ст. 13. τῶν δούλων σου — «рабов твоих»; ru добавляет «моя» (по МТ), в гр нет."
  15: "ἄγγελος κυρίου — ангел Господень. μὴ φοβηθῇς ἀπὸ προσώπου αὐτῶν — «не бойся от лица их»: αὐτῶν — мн. ч. (слав. «от лица их»), ru «его» (ед. ч.). ἀνέστη — «встал». κατέβη μετ᾿ αὐτοῦ πρὸς τὸν βασιλέα — «сошёл с ним к царю»."
  16: "Τί ὅτι — «что [это], что…», риторическое «зачем». ἀπέστειλας ἀγγέλους ζητῆσαι — «послал послов вопросить». Слав. добавляет «аки бы не был Бог во Израиле, еже вопросити от него словесе» (по МТ) — внесено. οὐχ οὕτως — см. ст. 4; принято слав. «сего ради» (それゆえ). θανάτῳ ἀποθανῇ — «смертью умрёшь»."
  17: "ἀπέθανεν κατὰ τὸ ῥῆμα κυρίου, ὃ ἐλάλησεν Ηλιου — «умер по слову Господню, которое изрёк Илия». Слав. добавляет «И царствова Иорам брат его, понеже не име сына Охозиа, в лето второе Иорама сына Иосафата царя Иудина» — внесено. В гр параллельное сообщение стоит в «18a» (Иорам, сын Ахава, — восемнадцатый год Иосафата, двенадцать лет); то же — в слав. 3:1. Две хронологии расходятся (2-й год Иорама Иудейского и 18-й год Иосафата); в 1-й главе держимся слав. 1:17."
  18: "τὰ λοιπὰ τῶν λόγων — «прочее слов». οὐκ ἰδοὺ ταῦτα γεγραμμένα — «не вот ли это записано» (слав. «не се ли, сия писана»). ἐπὶ βιβλίου λόγων τῶν ἡμερῶν — «в книге слов дней», т. е. летопись (日誌の書). После ст. 18 в гр-модуле стоят «18a» и стихи 19–21 — LXX-дублет слав. 3:1–3; в слав. 1-й главе их нет, поэтому отдельными стихами они не переведены (содержание уже стоит в 3:1–3). 18a: Καὶ Ιωραμ υἱὸς Αχααβ βασιλεύει ἐπὶ Ισραηλ ἐν Σαμαρείᾳ ἔτη δέκα δύο ἐν ἔτει ὀκτωκαιδεκάτῳ Ιωσαφατ — «Иорам, сын Ахава, царствует над Израилем в Самарии двенадцать лет, в восемнадцатый год Иосафата» (= слав. 3:1). 19: πλὴν οὐχ ὡς οἱ ἀδελφοὶ αὐτοῦ οὐδὲ ὡς ἡ μήτηρ αὐτοῦ — «но не как братья его и не как мать его» (в слав. 3:2 — «не якоже отец его»); ἐποίησεν τὸ πονηρὸν ἐνώπιον κυρίου — «делал злое пред Господом». 20: ἀπέστησεν τὰς στήλας τοῦ Βααλ, ἃς ἐποίησεν ὁ πατὴρ αὐτοῦ, καὶ συνέτριψεν αὐτά … ἐκολλήθη, οὐκ ἀπέστη ἀπ᾿ αὐτῶν — «убрал столпы Ваала, которые сделал отец его, и разбил их; но к грехам дома Иеровоама прилепился и не отступил от них» (слав. 3:2–3). 21: ἐθυμώθη ὀργῇ κύριος εἰς τὸν οἶκον Αχααβ — «и воспылал гневом Господь на дом Ахава»: это чтение есть только в LXX (ни в слав., ни в МТ), поэтому в текст не внесено."
