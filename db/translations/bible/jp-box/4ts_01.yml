# jp-box, 4-я Царств, глава 1. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc для книги нет;
# jp-ni не использовался.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 1: отложение Моава (1), падение Охозии и посольство к Ваал-мухе (2),
# Ангел посылает Илию навстречу послам (3–4), возвращение послов и ответ царю
# (5–8), первый и второй пятидесятники и огонь с неба (9–12), третий
# пятидесятник и милость (13–15), приговор царю (16), смерть Охозии и воцарение
# Иорама (17), летописная формула (18).
# Нумерация главы — по славяно-синодальной (решение автора): 18 стихов, как в
# csl-ru и ru. Наш 1:1–18 = csl 1:1–18 (стих 17 включает слав. «И царствова
# Иорам брат Охозиин…»). В гр-модуле после ст. 18 стоит дополнительный стих
# «18a» и стихи 19–21 — это LXX-дублет слав. 3:1–3 (Иорам: «не как братья его»,
# столпы Ваала, грехи Иеровоама, гнев на дом Ахава). В csl 1-й главы их нет,
# поэтому отдельными стихами они не переводятся: содержание уже стоит в 3:1–3
# (см. notes 18).
# Паритет: слав. чтения внесены в текст без скобок — 17 (воцарение Иорама),
# 16 («аки бы не был Бог во Израиле»), 4/6/16 («сего ради» вместо тёмного
# «οὐχ οὕτως»); вариант LXX — в notes. Скобочные пояснения csl («(с тобою)»
# в 10, «(мужей)» в 12) — редакторские, не переведены.
# Речь — 「…」 первого уровня, вложенная — 『…』, третий уровень (слова Господа
# в устах человека, пересказываемого послами) — снова 「…» (как 3Цар 22:21–22).
# Красного и синего нет. 〔…〕 нет. Через границу глав кавычки не переходят:
# 1:16 закрывает речь, 2:1 — повествование.
# Сносок ⟨…⟩ нет: 神, 主, 預言者, 寝床, 日誌 уже в корпусе.


