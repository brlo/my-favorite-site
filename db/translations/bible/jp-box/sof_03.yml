# jp-box, Софония, глава 3. Черновик для приёмки.
#
# Нумерация — по славяно-синодальной: наш 3:1–20 = gr 3:1–20 и csl 3:1–20, стих в стих.
# В книге 53 стиха (1: 18, 2: 15, 3: 20).
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1–2 «о славный и избавленный город, голубица» — не слушал, не
# принимал наставления; 3–4 князья-львы, судьи-волки, пророки-ветроносцы,
# священники оскверняют святое; 5 Господь праведен посреди; 6–7 «Я низложил
# гордых», «только убойтесь Меня»; 8–13 «ждите Меня»: суд над народами, чистые
# уста, остаток Израиля; 14–17 «ликуй, дщерь Сиона», Господь посреди, «Он
# возвеселится о тебе»; 18–20 «соберу сокрушённых», «спасу угнетённую».
# Голоса: 1–6 — речь пророка о городе; 7 — пророк передаёт слово Господа в 「…»
# («Я сказал»), затем повествование; 8–13 — слово Господа в 「…»; 14–17 — речь
# пророка (в 16 слова Господа в 「…»); 18–20 — слово Господа в 「…».
# 3:1: LXX/слав. читают положительно («славный и избавленный, голубица»);
# в ru/МТ «горе городу нечистому и осквернённому» — иное чтение (МТ), не внесено.
# 3:5: тёмное место «и не укрыся, и не весть неправды во истязании, ниже в распри
# обиды» передано буквально (取り立てにも争いにも不正は知られない).
# 3:7: ἐπιφυλλίς — «виноградный сбор (поздние грозди)»; слав. «листвие» — «лист»,
# в тексте по слав. (葉).
# 3:18: тёмное место («горе, кто принял на неё поношение») передано буквально.
#
