verses:
  1: "ああ、輝[かがや]く者[もの]、贖[あがな]われた者[もの]、鳩[はと]のような都[みやこ]よ。"
  2: "それは声[こえ]を聞[き]かず、懲[こら]しめを受[う]け入[い]れず、主[しゅ]に頼[たよ]らず、その神[かみ]に近[ちか]づかなかった。"
  3: "その中[なか]の君[きみ]たちはほえる獅子[しし]のようであり、その裁[さば]き手[て]たちはアラビアの狼[おおかみ]のようで、朝[あさ]までに何[なに]も残[のこ]さない。"
  4: "その預言[よげん]者[しゃ]たちは風[かぜ]に運[はこ]ばれる者[もの]、侮[あなど]る男[おとこ]たちである。その祭司[さいし]たちは聖[せい]なるもの[もの]を汚[けが]し、律法[りっぽう]をないがしろにする。"
  5: "しかし、その中[なか]の主[しゅ]は正[ただ]しく、不正[ふせい]を行[おこな]われない。朝[あさ]ごとにその裁[さば]きを光[ひかり]のうちに示[しめ]され、それは隠[かく]れない。主[しゅ]は取[と]り立[た]てのうちにも、争[あらそ]いのうちにも不正[ふせい]を知[し]られない。"
  6: "わたしは高[たか]ぶる者[もの]たちを滅[ほろ]ぼしのうちに倒[たお]し、その隅[すみ]は消[き]え失[う]せた。わたしはその道[みち]を全[まった]く荒[あ]らし、だれも通[とお]らなくなった。その都[みやこ]々[みやこ]は滅[ほろ]び、人[ひと]はおらず、住[す]む者[もの]もいない。"
  7: "わたしは言[い]った。「ただ、わたしを恐[おそ]れ、懲[こら]しめを受[う]け入[い]れよ。わたしが彼女[かのじょ]に報[むく]いたすべてのことのゆえに、あなたがたはわたしの目[め]から滅[ほろ]ぼされることはない。朝[あさ]早[はや]く備[そな]えよ。彼らの葉[は]はすべて朽[く]ち果[は]てた」。しかし、彼らはますます身[み]を滅[ほろ]ぼすことを急[いそ]いだ。"
  8: "それゆえ、主[しゅ]は言[い]われる。「わたしを待[ま]て。わたしが立[た]ち上[あ]がる日[ひ]まで、証[あかし]のために。わたしの裁[さば]きは国[くに]々[ぐに]の集[あつ]まりのためであり、王[おう]たちを受[う]け入[い]れ、彼らの上[うえ]にわたしの怒[いか]りをすべて注[そそ]ぐためである。わたしの激[はげ]しい怒[いか]りの火[ひ]によって、全[ぜん]地[ち]は焼[や]き尽[つ]くされるからである。"
  9: "そのとき、わたしは国[くに]々[ぐに]の民[たみ]の唇[くちびる]を清[きよ]いものに変[か]え、彼らがすべて主[しゅ]の名[な]を呼[よ]び、一[ひと]つの軛[くびき]の下[した]で主[しゅ]に仕[つか]えるようにする。"
  10: "エチオピアの川[かわ]の果[は]てから、わたしに願[ねが]う者[もの]たちが来[き]て、わたしの散[ち]らされた者[もの]たちのうちで、わたしに犠牲[ぎせい]をささげる。"
  11: "その日[ひ]、あなたは自分[じぶん]のすべてのわざについて恥[は]じることはない。あなたがわたしに対して不法[ふほう]を行[おこな]ったすべてのわざについて。そのとき、わたしはあなたの誇[ほこ]り高[たか]ぶる者[もの]たちをあなたのうちから除[のぞ]き、あなたはもはやわたしの聖[せい]なる山[やま]で誇[ほこ]ることはない。"
  12: "わたしはあなたのうちに、柔和[にゅうわ]でへりくだる民[たみ]を残[のこ]す。彼らは主[しゅ]の名[な]を畏[おそ]れる。"
  13: "イスラエルの残[のこ]りの者[もの]たちは不正[ふせい]を行[おこな]わず、むなしいことを語[かた]らず、その口[くち]に欺[あざむ]きの舌[した]は見[み]つからない。彼らは食[た]べて伏[ふ]し、彼らを脅[おど]かす者[もの]はいない」。"
  14: "シオンの娘[むすめ]よ、大[おお]いに喜[よろこ]べ。エルサレムの娘[むすめ]よ、告[つ]げ知[し]らせよ。エルサレムの娘[むすめ]よ、心[こころ]から楽[たの]しみ、喜[よろこ]べ。"
  15: "主[しゅ]はあなたの不正[ふせい]を取[と]り除[のぞ]き、あなたを敵[てき]の手[て]から贖[あがな]われた。イスラエルの王[おう]である主[しゅ]はあなたのうちにおり、あなたはもはや災[わざわ]いを見[み]ない。"
  16: "そのとき、主[しゅ]はエルサレムに言[い]われる。「勇[いさ]め、シオンよ。あなたの手[て]が弱[よわ]ってはならない」。"
  17: "主[しゅ]なるあなたの神[かみ]はあなたのうちにおられ、強[つよ]い方[かた]としてあなたを救[すく]われる。主[しゅ]はあなたの上[うえ]に喜[よろこ]びを臨[のぞ]ませ、その愛[あい]によってあなたを新[あら]たにし、祭[まつ]りの日[ひ]のように、喜[よろこ]びのうちにあなたの上[うえ]で楽[たの]しまれる。"
  18: "「わたしは打[う]ち砕[くだ]かれた者[もの]たちを集[あつ]める。ああ、だれが彼女[かのじょ]への辱[はずかし]めを受[う]け入[い]れたのか。"
  19: "見[み]よ、わたしはあなたのために、あなたのうちでわざを行[おこな]う、と主[しゅ]は言[い]われる。そのとき、わたしは虐[しいた]げられた者[もの]を救[すく]い、追[お]い払[はら]われた者[もの]を受[う]け入[い]れ、彼らを誉[ほま]れと名[な]のある者[もの]とし、全[ぜん]地[ち]のうちに置[お]く。"
  20: "そのとき、わたしがあなたがたをよく扱[あつか]うとき、あなたがたは恥[は]じる。わたしがあなたがたを受[う]け入[い]れるとき、あなたがたをすべての民[たみ]のうちで誉[ほま]れと名[な]のある者[もの]とする。わたしがあなたがたの捕囚[ほしゅう]をあなたがたの前[まえ]で返[かえ]すとき、と主[しゅ]は言[い]われる」。"

notes:
  1: "Ὦ ἡ ἐπιφανὴς καὶ ἀπολελυτρωμένη — «о славная (явленная) и избавленная» (ἐπιφανής — видный, 輝く; ἀπολυτρόω — выкупать, 贖われる); ἡ πόλις ἡ περιστερά — «город, голубица» (περιστερά — голубь, 鳩). LXX и слав. читают здесь положительно; в ru/МТ «горе городу нечистому и осквернённому» — иное чтение (МТ), в текст не внесено."
  2: "οὐκ εἰσήκουσεν φωνῆς — «не услышал голоса»; οὐκ ἐδέξατο παιδείαν — «не принял наказания (наставления)» (παιδεία — наставление, 懲らしめ); ἐπὶ τῷ κυρίῳ οὐκ ἐπεποίθει — «на Господа не уповал» (πείθω — полагаться, 頼る); πρὸς τὸν θεὸν αὐτῆς οὐκ ἤγγισεν — «к Богу своему не приблизился» (ἐγγίζω — приближаться, 近づく)."
  3: "οἱ ἄρχοντες αὐτῆς ὡς λέοντες ὠρυόμενοι — «князья её как львы рыкающие» (ὠρύομαι — рычать, ほえる); οἱ κριταὶ αὐτῆς ὡς λύκοι τῆς Ἀραβίας — «судьи её как волки Аравии»; οὐχ ὑπελίποντο εἰς τὸ πρωί — «не оставляли до утра» (ὑπολείπω — оставлять, 残す)."
  4: "οἱ προφῆται αὐτῆς πνευματοφόροι — «пророки её ветроносцы» (πνευματοφόρος — носимый духом/ветром; слав. «ветроносцы», 風に運ばれる者); ἄνδρες καταφρονηταί — «мужи презрители» (侮る男); οἱ ἱερεῖς αὐτῆς βεβηλοῦσιν τὰ ἅγια — «священники её оскверняют святое» (βεβηλόω — осквернять, 汚す); ἀσεβοῦσιν νόμον — «нечествуют в законе» (律法をないがしろにする)."
  5: "ὁ κύριος δίκαιος ἐν μέσῳ αὐτῆς — «Господь праведен посреди неё»; οὐ μὴ ποιήσῃ ἄδικον — «не сотворит неправды»; πρωῒ πρωῒ δώσει κρίμα αὐτοῦ εἰς φῶς — «утро за утром даст суд Свой в свет»; οὐκ ἀπεκρύβη — «не укрылся»; οὐκ ἔγνω ἀδικίαν ἐν ἀπαιτήσει καὶ οὐκ εἰς νεῖκος ἀδικίαν — «не познал неправды во взыскании и не в распрю — обиды»: тёмное место, передано буквально (取り立てにも争いにも不正は知られない); смысл — суд Божий без неправды."
  6: "ἐν διαφθορᾷ κατέσπασα ὑπερηφάνους — «в погибели низложил гордых» (διαφθορά — погибель, 滅び; κατασπάω — низвергать, 倒す); ἠφανίσθησαν γωνίαι αὐτῶν — «исчезли углы их» (γωνία — угол, 隅); ἐξερημώσω τὰς ὁδοὺς αὐτῶν — «опустошил пути их»; ἐξέλιπον αἱ πόλεις αὐτῶν — «исчезли города их»; παρὰ τὸ μηδένα ὑπάρχειν μηδὲ κατοικεῖν — «так что никого нет и не живёт»."
  7: "εἶπα Πλὴν φοβεῖσθέ με — «сказал: только убойтесь Меня» (πλήν — только, ただ); δέξασθε παιδείαν — «приимите наказание»; οὐ μὴ ἐξολεθρευθῆτε ἐξ ὀφθαλμῶν αὐτῆς — «не будете истреблены от очей её» (слав. «от очию его» — букв. «от очей его»; в тексте «わたしの目から», говорит Господь); πάντα ὅσα ἐξεδίκησα ἐπ᾿ αὐτήν — «всё, что Я отмстил на ней»; ἑτοιμάζου ὄρθρισον — «готовься с рассветом» (ὄρθριος — ранний, 朝早く); διέφθαρται πᾶσα ἡ ἐπιφυλλίς αὐτῶν — «погиб весь виноградный сбор их» (ἐπιφυλλίς — поздние грозди, сбор; слав. «листвие» — «лист», в тексте по слав., 葉). Здесь пророк передаёт слово Господа в 「…」."
  8: "ὑπόμεινόν με — «потерпи Меня» (ὑπομένω — ждать, 待つ); εἰς ἡμέραν ἀναστάσεώς μου εἰς μαρτύριον — «в день восстания Моего в свидетельство» (ἀνάστασις — восстание, 立ち上がる); τὸ κρίμα μου εἰς συναγωγὰς ἐθνῶν — «суд Мой — в собрания народов» (συναγωγή — собрание, 集まり); τοῦ εἰσδέξασθαι βασιλεῖς — «принять царей»; ἐκχέαι ἐπ᾿ αὐτοὺς πᾶσαν ὀργὴν θυμοῦ μου — «излить на них всю ярость гнева Моего»; ἐν πυρὶ ζήλους μου καταναλωθήσεται πᾶσα ἡ γῆ — «огнём ревности Моей пожрана будет вся земля»."
  9: "ὅτι τότε μεταστρέψω ἐπὶ λαοὺς γλῶσσαν εἰς γενεὰν αὐτῆς — «тогда обращу к народам язык в род его» (μεταστρέφω — обращать, 変える; γλῶσσα — язык, 唇; γενεά — род; тёмное место); τοῦ ἐπικαλεῖσθαι πάντας τὸ ὄνομα κυρίου — «чтобы все призывали имя Господне»; δουλεύειν αὐτῷ ὑπὸ ζυγὸν ἕνα — «служить Ему под одним ярмом» (ζυγός — ярмо, 軛)."
  10: "ἐκ περάτων ποταμῶν Αἰθιοπίας — «от концов рек Ефиопии» (πέρας — конец, 果て); οἴσουσιν θυσίας μοι — «принесут жертвы Мне». Слав. добавляет «прииму молящыя мя, в разсеянных моих» — нет в LXX, внесено (わたしに願う者たち…散らされた者たちのうちで)."
  11: "ἐν τῇ ἡμέρᾳ ἐκείνῃ οὐ μὴ καταισχυνθῇς — «в тот день не постыдишься» (καταισχύνω — посрамлять, 恥じる); ἐκ πάντων τῶν ἐπιτηδευμάτων σου — «от всех начинаний твоих» (ἐπιτήδευμα — занятие, わざ); ὧν ἠσέβησας εἰς ἐμέ — «которыми нечествовал против Меня»; περιελῶ ἀπὸ σοῦ τὰ φαυλίσματα τῆς ὕβρεώς σου — «отниму от тебя презрительное надмение твоё» (φαύλισμα — презрительное дело, 誇り高ぶる者); μεγαλαυχῆσαι ἐπὶ τὸ ὄρος τὸ ἅγιόν μου — «величаться на святой горе Моей» (μεγαλαυχέω — величаться, 誇る)."
  12: "ὑπολείψομαι ἐν σοὶ λαὸν πραὺν καὶ ταπεινόν — «оставлю в тебе народ кроткий и смиренный» (πραΰς — кроткий, 柔和); εὐλαβηθήσονται ἀπὸ τοῦ ὀνόματος κυρίου — «будут благоговеть пред именем Господним» (畏れる)."
  13: "οἱ κατάλοιποι τοῦ Ισραηλ — «остатки Израиля» (残りの者); οὐ ποιήσουσιν ἀδικίαν — «не сотворят неправды»; οὐ λαλήσουσιν μάταια — «не возглаголют суетного» (μάταιος — суетный, むなしい); οὐ μὴ εὑρεθῇ ἐν τῷ στόματι αὐτῶν γλῶσσα δολία — «не найдётся в устах их язык льстивый» (δόλιος — коварный, 欺き); νεμήσονται καὶ κοιτασθήσονται — «будут пастись и лежать» (κοιτάζομαι — лежать, 伏す); οὐκ ἔσται ὁ ἐκφοβῶν αὐτούς — «не будет устрашающего их». Здесь слово Господа закрывается."
  14: "Χαῖρε σφόδρα, θύγατερ Σιων — «радуйся сильно, дщерь Сиона» (χαίρω — радоваться, 喜ぶ); κήρυσσε — «проповедуй» (κηρύσσω — возвещать, 告げ知らせる); εὐφραίνου καὶ κατατέρπου ἐξ ὅλης τῆς καρδίας σου — «веселись и услаждайся от всего сердца твоего» (κατατρυφάω — услаждаться, 楽しむ); θύγατερ Ιερουσαλημ — «дщерь Иерусалима» (в LXX и слав. дважды, поэтому エルサレムの娘 よ 二度)."
  15: "περιεῖλεν κύριος τὰ ἀδικήματά σου — «отнял Господь неправды твои» (ἀδίκημα — неправда, 不正); λελύτρωταί σε ἐκ χειρὸς ἐχθρῶν σου — «избавил тебя от руки врагов твоих» (λυτρόω — выкупать, 贖う); βασιλεὺς Ισραηλ κύριος ἐν μέσῳ σου — «Царь Израилев Господь посреди тебя»; οὐκ ὄψῃ κακὰ οὐκέτι — «не увидишь зла более»."
  16: "ἐν τῷ καιρῷ ἐκείνῳ ἐρεῖ κύριος τῇ Ιερουσαλημ — «в то время скажет Господь Иерусалиму»; Θάρσει, Σιων — «дерзай, Сион» (θαρσέω — дерзать, 勇む); μὴ παρείσθωσαν αἱ χεῖρές σου — «да не ослабеют руки твои» (παρίημι — ослаблять, 弱る)."
  17: "κύριος ὁ θεός σου ἐν σοί — «Господь Бог твой в тебе»; δυνατὸς σώσει σε — «сильный спасёт тебя»; ἐπάξει ἐπὶ σὲ εὐφροσύνην — «наведёт на тебя веселие» (ἐπάγω — наводить, 臨ませる); καινιεῖ σε ἐν τῇ ἀγαπήσει αὐτοῦ — «обновит тебя в любви Своей» (καινίζω — обновлять, 新たにする); εὐφρανθήσεται ἐπὶ σὲ ἐν τέρψει — «возвеселится о тебе в наслаждении» (τέρψις — наслаждение, 喜び); ὡς ἐν ἡμέρᾳ ἑορτῆς — «как в день праздника»."
  18: "συνάξω τοὺς συντετριμμένους — «соберу сокрушённых» (συντρίβω — сокрушать, 打ち砕く); οὐαί, τίς ἔλαβεν ἐπ᾿ αὐτὴν ὀνειδισμόν — «горе, кто принял на неё поношение» (ὀνειδισμός — поношение, 辱め): тёмное место, передано буквально."
  19: "ἰδοὺ ἐγὼ ποιῶ ἐν σοὶ ἕνεκεν σοῦ — «вот, Я делаю в тебе ради тебя»; ἐν τῷ καιρῷ ἐκείνῳ — «в то время»; σώσω τὴν ἐκπεπιεσμένην — «спасу угнетённую» (ἐκπιέζω — сдавливать, 虐げられた者); τὴν ἀπωσμένην — «отринутую» (ἀπωθέω — отталкивать, 追い払われた者); εἰσδέξομαι — «прииму»; θήσομαι αὐτοὺς εἰς καύχημα — «положу их в похвалу» (καύχημα — похвала, 誉れ); ὀνομαστοὺς ἐν πάσῃ τῇ γῇ — «именитыми по всей земле» (ὀνομαστός — именитый, 名のある)."
  20: "καταισχυνθήσονται ἐν τῷ καιρῷ ἐκείνῳ — «постыдятся в то время»; ὅταν καλῶς ὑμῖν ποιήσω — «когда хорошо вам сделаю»; ὅταν εἰσδέξωμαι ὑμᾶς — «когда прииму вас»; δώσω ὑμᾶς ὀνομαστοὺς καὶ εἰς καύχημα ἐν πᾶσιν τοῖς λαοῖς τῆς γῆς — «дам вас именитыми и в похвалу у всех народов земли»; ἐν τῷ ἐπιστρέφειν με τὴν αἰχμαλωσίαν ὑμῶν ἐνώπιον ὑμῶν — «когда возвращу плен ваш пред вами»; λέγει κύριος — «говорит Господь». Здесь слово Господа закрывается."
