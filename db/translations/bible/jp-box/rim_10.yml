verses:
  1: "兄弟[きょうだい]たち、わたしの心[こころ]の願[ねが]いと、〔イスラエルの〕ために神[かみ]にささげる祈[いの]りとは、彼[かれ]らの救[すく]いに向[む]けられている。"
  2: "というのは、わたしは、彼[かれ]らが神[かみ]に対[たい]する熱心[ねっしん]を持[も]っていることを証[あかし]する。しかし、それは知識[ちしき]に基[もと]づくものではない。"
  3: "というのは、彼[かれ]らは神[かみ]の義[ぎ]を知[し]らず、自分[じぶん]の義[ぎ]を立[た]てようと求[もと]めて、神[かみ]の義[ぎ]に服[ふく]さなかったからである。"
  4: "キリストは律法[りっぽう]の終[おわ]わりであり、信[しん]じる者[もの]すべてにとって義[ぎ]となるからである。"
  5: "というのは、モーセは、律法[りっぽう]による義[ぎ]について、「これを行[おこな]う人[ひと]は、それによって生[い]きる」と書[か]いている。"
  6: "しかし、信仰[しんこう]による義[ぎ]はこう言[い]う。「あなたの心[こころ]に『だれが天[てん]に上[のぼ]るのか』と言[い]ってはならない。」これはすなわち、キリストを下[くだ]らせることである。"
  7: "「だれが淵[ふち]に下[くだ]るのか。」これはすなわち、キリストを死者[ししゃ]の中[なか]から上[のぼ]らせることである。"
  8: "しかし、何[なに]と言[い]っているのか。「言葉[ことば]はあなたの近[ちか]くにある。あなたの口[くち]に、あなたの心[こころ]にある。」すなわち、わたしたちが宣[の]べ伝[つた]える信仰[しんこう]の言葉[ことば]のことである。"
  9: "というのは、もしあなたが口[くち]で「イエスは主[しゅ]である」と告白[こくはく]し、神[かみ]がこの方[かた]を死者[ししゃ]の中[なか]から起[お]こされたことを心[こころ]で信[しん]じるなら、あなたは救[すく]われるからである。"
  10: "人[ひと]は心[こころ]で信[しん]じて義[ぎ]とされ、口[くち]で告白[こくはく]して救[すく]われるからである。"
  11: "聖書[せいしょ]に「彼[かれ]に信[しん]じる者[もの]は、だれも辱[はずかし]めを受[う]けない」と言[い]われているからである。"
  12: "ユダヤ人[じん]とギリシア人[じん]との間[あいだ]に区別[くべつ]はないからである。同[おな]じ主[しゅ]がすべての者[もの]の主[しゅ]として、呼[よ]び求[もと]める者[もの]すべてに富[とみ]を注[そそ]いでおられる。"
  13: "「主[しゅ]の名[な]を呼[よ]び求[もと]める者[もの]は、だれでも救[すく]われる」からである。"
  14: "それでは、まだ信[しん]じていない方[かた]を、どうして呼[よ]び求[もと]めることができようか。まだ聞[き]いたことのない方[かた]を、どうして信[しん]じることができようか。宣[の]べ伝[つた]える者[もの]がなければ、どうして聞[き]くことができようか。"
  15: "また、遣[つか]わされなければ、どうして宣[の]べ伝[つた]えることができようか。「〔平和[へいわ]を告[つ]げる者[もの]、〕善[よ]い知[し]らせを告[つ]げる者[もの]の足[あし]は、なんと美[うつく]しいことか」と書[か]いてあるとおりである。"
  16: "しかし、すべての者[もの]が福音[ふくいん]に従[したが]ったのではない。イザヤが「主[しゅ]よ、だれがわたしたちから聞[き]いたことを信[しん]じたでしょうか」と言[い]っているからである。"
  17: "それゆえ、信仰[しんこう]は聞[き]くことによって生[う]まれ、聞[き]くことは神[かみ]の言葉[ことば]によって生[う]まれるのである。"
  18: "しかし、わたしは言[い]う。彼[かれ]らは聞[き]かなかったのか。いや、むしろ、「その声[こえ]は全地[ぜんち]に出[で]て行[い]き、その言葉[ことば]は世界[せかい]の果[は]てにまで及[およ]んだ」のである。"
  19: "しかし、わたしは言[い]う。イスラエルは知[し]らなかったのか。まずモーセが言[い]う。「わたしは、国民[こくみん]でない者[もの]によってあなたがたを妬[ねた]ませ、愚[おろ]かな国民[こくみん]によってあなたがたを怒[いか]らせる。」"
  20: "イザヤは大胆[だいたん]に言[い]う。「わたしは、わたしを求[もと]めなかった者[もの]たちの間[あいだ]に見[み]いだされ、わたしを問[と]わなかった者[もの]たちに現[あらわ]れた。」"
  21: "しかし、イスラエルについて言[い]う。「わたしは、従[したが]わず、逆[さか]らう民[たみ]に向[む]かって、終日[しゅうじつ]、手[て]を広[ひろ]げていた。」"

notes:
  1: "В базе ὑπὲρ αὐτῶν («за них»); церковный текст (Синодальный «об Израиле», jp-joc「イズライリの為に」) читает ὑπὲρ τοῦ Ἰσραήλ — 〔イスラエルの〕. Проверено по базе: Ἰσραήλ в ст. 1 — 0 вхождений. εὐδοκία — «благоволение, желание»; 願い. εἰς σωτηρίαν — 救いに向けられている."
  2: "ζῆλον θεοῦ — «ревность по Боге»; 神に対する熱心. οὐ κατ᾿ ἐπίγνωσιν — «не по (полному) знанию»; 知識に基づくものではない."
  3: "ἀγνοοῦντες — «не зная»; τὴν ἰδίαν ζητοῦντες στῆσαι — «свою (правду) стараясь поставить»; 自分の義を立てようと求めて. Сохранено трёхкратное 義."
  4: "τέλος νόμου — «конец закона»; 律法の終わり. εἰς δικαιοσύνην παντὶ τῷ πιστεύοντι — «к праведности всякому верующему»; すべてにとって義となる."
  5: "Лев 18:5."
  6: "Втор 30:12. Речь самой «правды от веры» — олицетворение сохранено. τοῦτ᾿ ἔστιν — пояснение Павла, поэтому вне 「」."
  7: "Втор 30:13. ἄβυσσος — «бездна»; 淵."
  8: "Втор 30:14. ῥῆμα — «слово, дело»; 言葉. τοῦτ᾿ ἔστιν τὸ ῥῆμα τῆς πίστεως — 信仰の言葉のことである."
  9: "κύριον Ἰησοῦν — «Иисуса Господом»; イエスは主である, исповедание сохранено прямой речью в 「」."
  11: "Ис 28:16. πᾶς ὁ πιστεύων — だれも…ない (по смыслу πᾶς с отрицанием)."
  12: "Ἕλλην — «эллин», то есть грек; ギリシア人. πλουτῶν εἰς πάντας — «богатый для всех»; 富を注いでおられる."
  13: "Иоиль 2:32."
  14: "Трижды πῶς — троекратный вопрос сохранён; οὖν — それでは."
  15: "Ис 52:7. В базе только οἱ πόδες τῶν εὐαγγελιζομένων ἀγαθά; церковный текст (Елизаветинская «благовествующих мир, благовествующих благая», jp-joc「平安を福音し、善事を福音する者の足」) добавляет εἰρήνην — 〔平和を告げる者、〕. Проверено по базе: εἰρήνην в ст. 15 — 0 вхождений."
  16: "Ис 53:1. ἀκοή — «слух, весть»; わたしたちから聞いたこと."
  17: "В базе ῥήματος Χριστοῦ; церковный текст (Синодальный «слова Божия», jp-joc「神の言」) читает θεοῦ — 神の言葉, без 〔〕: замена, а не добавка (ср. Деян 6:8). Проверено: θεοῦ в ст. 17 — 0, Χριστοῦ — 1."
  18: "Пс 18:5 (19:5). φθόγγος — «голос, звук»; 声."
  19: "Втор 32:21. ἐπ᾿ οὐκ ἔθνει — «не народом»; 国民でない者によって."
  20: "Ис 65:1. ἀποτολμᾷ — «дерзает»; 大胆に. [ἐν] в базе в квадратных скобках — слово есть, 〔…〕 не ставится."
  21: "Ис 65:2. ἀπειθοῦντα καὶ ἀντιλέγοντα — «непокорный и прекословящий»; 従わず、逆らう. ἐξεπέτασα τὰς χεῖράς μου — 手を広げていた."
