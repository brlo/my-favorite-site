# jp-box, Послание к Римлянам, глава 10. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный 常体, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 10: молитва об Израиле (1–4), праведность от веры и слово веры (5–13),
# проповедь и слышание (14–17), Израиль не извинится неведением (18–21).
# Красного и синего в главе нет; <j>/<mo> не ставятся. Речь «правды веры» — в 「」, вложенная в неё цитата Писания — в 『』 (так по всему корпусу: первый уровень — 「」, вложенный — 『』).
