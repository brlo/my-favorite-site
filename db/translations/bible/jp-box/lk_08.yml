verses:
  1: "その後[のち]、イエスは町[まち]や村[むら]を巡[めぐ]って、神[かみ]の国[くに]を宣[の]べ伝[つた]え、福音[ふくいん]を告[つ]げ知[し]らせておられた。十二人[じゅうににん]も一緒[いっしょ]であった。"
  2: "また、悪[わる]い霊[れい]や病[やまい]から癒[いや]された女[おんな]たちも一緒[いっしょ]であった。マグダラのマリアといい、七[なな]つの悪霊[あくりょう]が彼女[かのじょ]から出[で]て行[い]った者[もの]、"
  3: "ヘロデの家令[かれい]クザの妻[つま]ヨハンナ、スサンナ、そのほか多[おお]くの女[おんな]たちである。彼女[かのじょ]らは自分[じぶん]の持[も]ち物[もの]で一行[いっこう]に仕[つか]えていた。"
  4: "大勢[おおぜい]の群衆[ぐんしゅう]が集[あつ]まり、町々[まちまち]から次々[つぎつぎ]に人[ひと]がイエスのもとへ来[き]ていたので、イエスはたとえで語[かた]られた。"
  5: "「<j>種[たね]を蒔[ま]く者[もの]が、自分[じぶん]の種[たね]を蒔[ま]きに出[で]た。蒔[ま]いていると、ある種[たね]は道端[みちばた]に落[お]ち、踏[ふ]みつけられ、空[そら]の鳥[とり]に食[た]べられてしまった。</j>"
  6: "<j>ほかの種[たね]は岩[いわ]の上[うえ]に落[お]ち、芽[め]を出[だ]したが、水分[すいぶん]がなかったので枯[か]れてしまった。</j>"
  7: "<j>ほかの種[たね]は茨[いばら]の中[なか]に落[お]ち、茨[いばら]が一緒[いっしょ]に伸[の]びて、それをふさいでしまった。</j>"
  8: "<j>ほかの種[たね]は良[よ]い地[ち]に落[お]ち、芽[め]を出[だ]して百倍[ひゃくばい]の実[み]を結[むす]んだ。</j>」こう言[い]って、イエスは叫[さけ]ばれた。「<j>耳[みみ]のある者[もの]は、聞[き]きなさい。</j>」"
  9: "弟子[でし]たちは、このたとえはどういう意味[いみ]かとイエスに尋[たず]ねた。"
  10: "イエスは言[い]われた。「<j>あなたがたには神[かみ]の国[くに]の秘密[ひみつ]を知[し]ることが与[あた]えられているが、ほかの者[もの]たちにはたとえで語[かた]る。彼[かれ]らが見[み]ても見[み]えず、聞[き]いても悟[さと]らないためである。</j>」"
  11: "「<j>このたとえの意味[いみ]は次[つぎ]のとおりである。種[たね]は神[かみ]の言葉[ことば]である。</j>"
  12: "<j>道端[みちばた]とは、言葉[ことば]を聞[き]いた人[ひと]のことである。そのあとで悪魔[あくま]が来[き]て、彼[かれ]らが信[しん]じて救[すく]われることのないように、心[こころ]から言葉[ことば]を奪[うば]い取[と]る。</j>"
  13: "<j>岩[いわ]の上[うえ]に落[お]ちた者[もの]とは、聞[き]いたときは喜[よろこ]んで言葉[ことば]を受[う]け入[い]れるが、根[ね]がなく、しばらくの間[あいだ]だけ信[しん]じて、試[こころ]みの時[とき]には離[はな]れて行[い]く人[ひと]のことである。</j>"
  14: "<j>茨[いばら]の中[なか]に落[お]ちた者[もの]とは、聞[き]いても、日々[ひび]を送[おく]るうちに、生活[せいかつ]の心配[しんぱい]や富[とみ]、享楽[きょうらく]に押[お]しつぶされて、実[み]を結[むす]び熟[じゅく]すまでに至[いた]らない人[ひと]のことである。</j>"
  15: "<j>良[よ]い地[ち]に落[お]ちた者[もの]とは、言葉[ことば]を聞[き]いて、正[ただ]しく良[よ]い心[こころ]に保[たも]ち、忍耐[にんたい]して実[み]を結[むす]ぶ人[ひと]のことである。〔耳[みみ]のある者[もの]は、聞[き]きなさい。〕</j>」"
  16: "「<j>ともし火[び]をともした者[もの]は、器[うつわ]で覆[おお]ったり、寝床[ねどこ]の下[した]に置[お]いたりしない。燭台[しょくだい]の上[うえ]に置[お]いて、入[はい]って来[く]る者[もの]たちがその光[ひかり]を見[み]るようにする。</j>"
  17: "<j>隠[かく]れているもので、明[あき]らかにならないものはなく、秘[ひ]められているもので、知[し]られずに表[おもて]に出[で]ることのないものはない。</j>"
  18: "<j>だから、どう聞[き]くかによく気[き]をつけなさい。持[も]っている者[もの]には与[あた]えられ、持[も]っていない者[もの]は、持[も]っていると思[おも]っているものまで取[と]り上[あ]げられる。</j>」"
  19: "イエスの母[はは]と兄弟[きょうだい]たちがイエスのもとへ来[き]たが、群衆[ぐんしゅう]のためにそばへ寄[よ]ることができなかった。"
  20: "「あなたの母[はは]と兄弟[きょうだい]たちが外[そと]に立[た]って、あなたに会[あ]いたがっています」と、だれかがイエスに知[し]らせた。"
  21: "イエスは答[こた]えて言[い]われた。「<j>わたしの母[はは]、わたしの兄弟[きょうだい]とは、神[かみ]の言葉[ことば]を聞[き]いて行[おこな]う者[もの]たちのことである。</j>」"
  22: "ある日[ひ]、イエスは弟子[でし]たちと一緒[いっしょ]に舟[ふね]に乗[の]り、「<j>湖[みずうみ]の向[む]こう岸[ぎし]へ渡[わた]ろう</j>」と言[い]われた。そこで一同[いちどう]は舟[ふね]を出[だ]した。"
  23: "舟[ふね]が進[すす]むうちに、イエスは眠[ねむ]ってしまわれた。すると、激[はげ]しい突風[とっぷう]が湖[みずうみ]に吹[ふ]き下[お]ろし、舟[ふね]は水[みず]をかぶって、危[あや]うくなった。"
  24: "弟子[でし]たちは近[ちか]づいてイエスを起[お]こし、「先生[せんせい]、先生[せんせい]、わたしたちは死[し]にます」と言[い]った。イエスは起[お]き上[あ]がり、風[かぜ]と荒[あ]れる水[みず]とをお叱[しか]りになった。すると、それらは静[しず]まり、凪[なぎ]になった。"
  25: "イエスは彼[かれ]らに言[い]われた。「<j>あなたがたの信仰[しんこう]はどこにあるのか。</j>」彼[かれ]らは恐[おそ]れ、驚[おどろ]いて互[たが]いに言[い]った。「いったいこの方[かた]は誰[だれ]なのだろう。風[かぜ]にも水[みず]にも命[めい]じると、それらが従[したが]うとは。」"
  26: "そして、ガリラヤの向[む]こう側[がわ]にあるゲラサ人[びと]の地方[ちほう]に着[つ]いた。"
  27: "イエスが陸[りく]に上[あ]がられると、その町[まち]の人[ひと]で悪霊[あくりょう]に憑[つ]かれた男[おとこ]がイエスを迎[むか]えた。この男[おとこ]は長[なが]い間[あいだ]服[ふく]を着[き]ず、家[いえ]に住[す]まず、墓場[はかば]に住[す]んでいた。"
  28: "この人[ひと]はイエスを見[み]ると、叫[さけ]び声[ごえ]を上[あ]げてひれ伏[ふ]し、大[おお]きな声[こえ]で言[い]った。「いと高[たか]い神[かみ]の子[こ]イエス、わたしとあなたと何[なん]の関[かか]わりがあるのか。お願[ねが]いです。わたしを苦[くる]しめないでください。」"
  29: "イエスは汚[けが]れた霊[れい]に、この人[ひと]から出[で]て行[い]けとお命[めい]じになったのである。霊[れい]は長[なが]い間[あいだ]この人[ひと]を捕[とら]えていた。人々[ひとびと]は鎖[くさり]や足枷[あしかせ]で縛[しば]って見張[みは]っていたが、彼[かれ]はそれを断[た]ち切[き]っては、悪霊[あくりょう]に荒[こう]野[や]へ追[お]いやられていた。"
  30: "イエスが「<j>名[な]は何[なん]というのか</j>」とお尋[たず]ねになると、その人[ひと]は「レギオン」と答[こた]えた。多[おお]くの悪霊[あくりょう]が入[はい]っていたからである。"
  31: "悪霊[あくりょう]たちは、底[そこ]なき淵[ふち]へ行[い]くことをお命[めい]じにならないようにと願[ねが]った。"
  32: "そこには、山[やま]で大[おお]きな豚[ぶた]の群[む]れが飼[か]われていた。悪霊[あくりょう]たちは、その豚[ぶた]の中[なか]に入[はい]ることをお許[ゆる]しくださいと願[ねが]った。イエスはお許[ゆる]しになった。"
  33: "悪霊[あくりょう]たちがその人[ひと]から出[で]て豚[ぶた]の中[なか]に入[はい]ると、豚[ぶた]の群[む]れは崖[がけ]から湖[みずうみ]へなだれ落[お]ち、おぼれ死[し]んだ。"
  34: "飼[か]っていた者[もの]たちは、起[おこ]ったことを見[み]て逃[に]げ出[だ]し、町[まち]や村里[そんり]に知[し]らせた。"
  35: "人々[ひとびと]は何[なに]が起[お]こったのかを見[み]ようと出[で]て来[き]て、イエスのところへ来[き]た。そして、悪霊[あくりょう]が抜[ぬ]けた人[ひと]が、服[ふく]を着[き]、正気[しょうき]に返[かえ]ってイエスの足[あし]もとに座[すわ]っているのを見[み]て、恐[おそ]れた。"
  36: "目撃[もくげき]した者[もの]たちは、悪霊[あくりょう]に憑[つ]かれていた人[ひと]がどうして癒[いや]されたかを彼[かれ]らに話[はな]して聞[き]かせた。"
  37: "ゲラサ人[びと]の地方[ちほう]の住民[じゅうみん]は皆[みな]、大[おお]きな恐[おそ]れに包[つつ]まれて、自分[じぶん]たちのところから離[はな]れてくださいとイエスに願[ねが]った。イエスは舟[ふね]に乗[の]って帰[かえ]られた。"
  38: "悪霊[あくりょう]が抜[ぬ]けた人[ひと]は、一緒[いっしょ]に行[い]かせてほしいと願[ねが]った。しかし、イエスはお許[ゆる]しにならず、こう言[い]われた。"
  39: "「<j>家[いえ]へ帰[かえ]って、神[かみ]があなたにどれほど大[おお]きなことをしてくださったかを話[はな]しなさい。</j>」そこで、その人[ひと]は町中[まちじゅう]に、イエスが自分[じぶん]にどれほど大[おお]きなことをしてくださったかを宣[の]べ伝[つた]えて歩[ある]いた。"
  40: "イエスが帰[かえ]られると、群衆[ぐんしゅう]はイエスを迎[むか]えた。皆[みな]、イエスを待[ま]っていたからである。"
  41: "すると、ヤイロという名[な]の人[ひと]が来[き]た。この人[ひと]は会堂長[かいどうちょう]であった。イエスの足[あし]もとにひれ伏[ふ]して、家[いえ]に来[き]てほしいと願[ねが]った。"
  42: "彼[かれ]にはひとり娘[むすめ]がいて、十二歳[じゅうにさい]ほどで、死[し]にかかっていたからである。イエスが行[い]かれると、群衆[ぐんしゅう]が押[お]し迫[せま]った。"
  43: "そこに、十二年間[じゅうにねんかん]も血[ち]の止[と]まらない女[おんな]がいた。彼女[かのじょ]は医者[いしゃ]にすべての財産[ざいさん]を使[つか]い果[は]てたが、だれにも癒[いや]してもらえなかった。"
  44: "女[おんな]は後[うし]ろから近[ちか]づいて、イエスの衣[ころも]の裾[すそ]に触[さわ]った。すると、血[ち]の流[なが]れがすぐに止[と]まった。"
  45: "イエスは「<j>わたしに触[さわ]ったのは誰[だれ]か</j>」と言[い]われた。皆[みな]が知[し]らないと言[い]う中[なか]で、ペトロ〔と、一緒[いっしょ]にいた者[もの]たち〕が言[い]った。「先生[せんせい]、群衆[ぐんしゅう]があなたを取[と]り囲[かこ]んで押[お]し迫[せま]っています。」"
  46: "しかしイエスは言[い]われた。「<j>だれかがわたしに触[さわ]った。わたしから力[ちから]が出[で]て行[い]ったのを覚[おぼ]えたからである。</j>」"
  47: "女[おんな]は自分[じぶん]が隠[かく]れおおせないと知[し]り、震[ふる]えながら来[き]てイエスの足[あし]もとにひれ伏[ふ]し、触[さわ]ったわけと、すぐに癒[いや]されたことを、民[たみ]の前[まえ]で残[のこ]らず話[はな]した。"
  48: "イエスは女[おんな]に言[い]われた。「<j>娘[むすめ]よ、〔勇気[ゆうき]を出[だ]しなさい。〕あなたの信仰[しんこう]があなたを癒[いや]した。安心[あんしん]して行[い]きなさい。</j>」"
  49: "イエスがまだ話[はな]しておられると、会堂長[かいどうちょう]の家[いえ]から人[ひと]が来[き]て言[い]った。「お嬢[じょう]さんは亡[な]くなりました。もう先生[せんせい]を煩[わずら]わせることはありません。」"
  50: "イエスはこれを聞[き]いて、会堂長[かいどうちょう]に答[こた]えられた。「<j>恐[おそ]れることはない。ただ信[しん]じなさい。そうすれば、この子[こ]は救[すく]われる。</j>」"
  51: "家[いえ]に着[つ]くと、ペトロ、ヨハネ、ヤコブ、そして子[こ]どもの父[ちち]と母[はは]のほかは、だれも一緒[いっしょ]に入[はい]ることをお許[ゆる]しにならなかった。"
  52: "人々[ひとびと]は皆[みな]、彼女[かのじょ]のために泣[な]き、嘆[なげ]いていた。イエスは言[い]われた。「<j>泣[な]くことはない。この子[こ]は死[し]んだのではなく、眠[ねむ]っているのだ。</j>」"
  53: "人々[ひとびと]は、子[こ]どもが死[し]んだと知[し]っていたので、イエスをあざ笑[わら]った。"
  54: "しかしイエスは〔皆[みな]を外[そと]へ出[だ]して、〕その手[て]を取[と]って、呼[よ]びかけられた。「<j>娘[むすめ]よ、起[お]きなさい。</j>」"
  55: "すると、その子[こ]の霊[れい]が戻[もど]り、すぐに起[お]き上[あ]がった。イエスは、何[なに]か食[た]べさせてやるようにお命[めい]じになった。"
  56: "その両親[りょうしん]は驚[おどろ]き呆[あき]れた。イエスは、起[おこ]ったことをだれにも話[はな]さないようにと彼[かれ]らにお命[めい]じになった。"

notes:
  1: "καθεξῆς — «после сего»; その後. διώδευεν κατὰ πόλιν καὶ κώμην — 町や村を巡って."
  3: "ἐπιτρόπου Ἡρῴδου — управляющий Ирода; 家令. Служение из имения — 自分の持ち物で."
  8: "ἑκατονταπλασίονα — «во сто крат»; 百倍 (как в Мк 4:8). Формула «耳のある者は、聞きなさい» — как в Мк 4:9."
  10: "τὰ μυστήρια — 秘密 (не 機密, чтобы не путать с таинством). ἵνα βλέποντες μὴ βλέπωσιν — целевое придаточное сохранено: 見ても見えず…ためである."
  13: "πρὸς καιρὸν πιστεύουσιν — «веруют до времени»; しばらくの間だけ信じて. ἐν καιρῷ πειρασμοῦ — 試みの時."
  14: "πορευόμενοι — «идя [своим путём]»; 日々を送るうちに, без сглаживания. συμπνίγονται — 押しつぶされる; τελεσφοροῦσιν — «приносят зрелый плод»; 実を結び熟すまでに至らない."
  15: "В критической базе стих оканчивается на καρποφοροῦσιν ἐν ὑπομονῇ; Церковь (TR, у jp-joc в скобках) повторяет здесь формулу «耳のある者は、聞きなさい» — 〔…〕. καλῇ καὶ ἀγαθῇ — 正しく良い心: оба эпитета сохранены."
  16: "σκεύει — 器. κλίνη — 寝床 (как в Мк 4:21, где 寝床/寝台 разведены с κράβαττος)."
  18: "βλέπετε πῶς ἀκούετε — «смотрите, как слушаете»; どう聞くかによく気をつけなさい."
  22: "Διέλθωμεν εἰς τὸ πέραν — 向こう岸へ渡ろう: слова Христа, красным."
  24: "ἐπιστάτα ἐπιστάτα — двойное обращение сохранено: 先生、先生. ἐπετίμησεν τῷ ἀνέμῳ καὶ τῷ κλύδωνι τοῦ ὕδατος — 風と荒れる水とをお叱りになった."
  26: "Γεργεσηνῶν — ゲラサ人: у jp-joc ガダラ, в Елизаветинской «Гадаринская»; это разночтение имени места (Γερασηνῶν/Γαδαρηνῶν/Γεργεσηνῶν), как в Мк 5:1, поэтому без 〔〕."
  29: "συνηρπάκει — «схватывал, увлекал»; 捕らえていた. δεσμά — 鎖や足枷, ἠλαύνετο εἰς τὰς ἐρήμους — 荒野へ追いやられていた."
  30: "Λεγιών — сноска дана при первом упоминании в корпусе (Мк 5:9), здесь не повторяю."
  37: "περιχώρου — 地方. Слова жителей — не красным; ἀπελθεῖν ἀπ᾽ αὐτῶν — 自分たちのところから離れてください."
  39: "διηγοῦ ὅσα σοι ἐποίησεν ὁ θεός — 神があなたに…してくださったか; дальше евангелист говорит «Иисус» — расхождение сохранено, не сглажено."
  43: "В критической базе ἰατροῖς προσαναλώσασα ὅλον τὸν βίον стоит в квадратных скобках; в церковном тексте читается, поэтому без 〔〕 — это колебание критиков, а не добавка Церкви."
  45: "Церковь (TR, jp-joc「ペトル及び彼と偕に在りし者」) добавляет καὶ οἱ σὺν αὐτῷ — 〔と、一緒にいた者たち〕. Слова Петра — не красным."
  48: "Церковь (TR, jp-joc「心を安んぜよ」) добавляет θάρσει — 〔勇気を出しなさい。〕. σέσωκέν σε — 癒した (перфект)."
  50: "μόνον πίστευσον — ただ信じなさい; καὶ σωθήσεται — そうすれば、この子は救われる. Слова Христа — красным."
  54: "Церковь (TR, jp-joc「彼衆を外に出して」) добавляет ἐκβαλὼν ἔξω πάντας — 〔皆を外へ出して、〕 (ср. Мк 5:40)."
  55: "ἐπέστρεψεν τὸ πνεῦμα αὐτῆς — «возвратился дух её»; 霊が戻り, не «дыхание»."
