# jp-box, Притчи, глава 30. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для гл. 30 нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 30: надписание без имени (1); неразумие мужа (2–3); кто восходил на небо (4);
# слова Божии (5–6); две просьбы (7–9); раб и господин (10); род злой (11–14);
# ненасытимое (15–16); око, насмехающееся над отцом (17); три непостижимых (18–19);
# путь прелюбодейки (20); три и четыре (21–23); четыре малых (24–28);
# три и четыре шествующих (29–31); обличение заносчивости (32–33).
# В LXX масоретского надписания с именем Агура нет: вместо него пророческая формула
# τάδε λέγει ὁ ἀνήρ, поэтому имя в текст не внесено. Весь раздел — слова этого мужа,
# т. е. учительный текст книги, и внешними кавычками не обводится (как наставления
# глав 1–9). Внутри изречений чужая речь — в 「…」: 9 (слова самого человека), 15 и 16
# («довольно»), 20 (слова прелюбодейки).
# Нумерация по gr: 33 стиха, деление совпадает с csl, кроме ст. 22–23: у csl ст. 22
# вбирает и начало gr 23 («и раба аще изженет свою госпожу»); держимся греческого.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).

