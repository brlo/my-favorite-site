verses:
  1: "この人[ひと]は、神[かみ]を信[しん]じる者[もの]たちにこう言[い]う。そして、わたしは語[かた]るのをやめる。"
  2: "わたしはすべての人[ひと]のうちで最[もっと]も愚[おろ]かであり、人[ひと]の分別[ふんべつ]はわたしのうちにない。"
  3: "神[かみ]がわたしに知恵[ちえ]を教[おし]え、わたしは聖[せい]なる者[もの]たちの知識[ちしき]を知[し]った。"
  4: "だれが天[てん]に上[のぼ]って下[くだ]ったのか。だれが風[かぜ]を懐[ふところ]に集[あつ]めたのか。だれが水[みず]を衣[ころも]に包[つつ]んだのか。だれが地[ち]の果[は]てのすべてを握[にぎ]ったのか。その名[な]は何[なに]か、その子[こ]らの名は何か。あなたが知[し]るためである。"
  5: "神[かみ]の言葉[ことば]はすべて火[ひ]で試[ため]されたものであり、神はご自分[じぶん]を畏[おそ]れる者[もの]たちの盾[たて]となられる。"
  6: "その言葉[ことば]に付[つ]け加[くわ]えるな。神があなたを責[せ]め、あなたが偽[いつわ]り者[もの]とされることのないように。"
  7: "二[ふた]つのことをわたしはあなたに求[もと]める。わたしが死[し]ぬ前[まえ]に、それを取[と]り上[あ]げないでほしい。"
  8: "むなしい言葉[ことば]と偽[いつわ]りをわたしから遠[とお]ざけてほしい。富[とみ]も貧[まず]しさもわたしに与[あた]えず、ただ必要[ひつよう]なものと足[た]りるものをわたしに定[さだ]めてほしい。"
  9: "飽[あ]き足[た]りて偽[いつわ]り者[もの]となり、「だれがわたしを見[み]るのか」と言[い]わないためであり、また貧[まず]しくなって盗[ぬす]み、神[かみ]の名[な]をみだりに唱[とな]えないためである。"
  10: "しもべをその主人[しゅじん]の手[て]に渡[わた]すな。彼[かれ]があなたを呪[のろ]い、あなたが滅[ほろ]びることのないように。"
  11: "父[ちち]を呪[のろ]い、母[はは]を祝福[しゅくふく]しない悪[わる]い子孫[しそん]がある。"
  12: "悪[わる]い子孫[しそん]は自分[じぶん]を正[ただ]しいと裁[さば]くが、その出[で]て行[ゆ]くところを洗[あら]い清[きよ]めていない。"
  13: "悪[わる]い子孫[しそん]は高[たか]い目[め]を持[も]ち、そのまぶたを上[あ]げている。"
  14: "悪[わる]い子孫[しそん]は歯[は]を剣[つるぎ]とし、臼歯[きゅうし]を刃[やいば]として、地[ち]から貧[まず]しい者[もの]を、人[ひと]の間[あいだ]から乏[とぼ]しい者[もの]を食[く]い尽[つ]くす。"
  15: "蛭[ひる]には三[みっ]つの娘[むすめ]があり、愛[あい]をもって愛されていた。この三[みっ]つは蛭を満[み]たさず、四番目[よんばんめ]の者[もの]も「十分[じゅうぶん]だ」と言[い]って満足[まんぞく]しなかった。"
  16: "よみ、女[おんな]への欲情[よくじょう]、タルタロス、水[みず]で満[み]たされることのない地[ち]、そして「十分[じゅうぶん]だ」と言[い]うことのない水[みず]と火[ひ]。"
  17: "父[ちち]を嘲笑[ちょうしょう]し、母[はは]の老[お]いを侮[あなど]る目[め]を、谷[たに]の鴉[からす]がつつき出[だ]し、鷲[わし]のひなが食[く]い尽[つ]くすように。"
  18: "三[みっ]つのことはわたしには悟[さと]りがたく、四[よっ]つのことはわたしには分[わ]からない。"
  19: "空[そら]を飛[と]ぶ鷲[わし]の足跡[あしあと]、岩[いわ]の上の蛇[へび]の道[みち]、海[うみ]を渡[わた]る船[ふね]の航跡[こうせき]、若[わか]い男[おとこ]の道[みち]。"
  20: "淫婦[いんぷ]の道[みち]もそのようなものである。彼女[かのじょ]は事[こと]を行[おこな]ってから身[み]を洗[あら]い、「何[なに]も悪[わる]いことはしていない」と言[い]う。"
  21: "三[みっ]つのことで地[ち]は揺[ゆ]れ、四[よっ]つのことに耐[た]えられない。"
  22: "しもべが王[おう]となること、愚[おろ]かな者[もの]が食[た]べ物[もの]に満[み]ち足[た]りること、"
  23: "女中[じょちゅう]が自分[じぶん]の女主人[おんなしゅじん]を追[お]い出[だ]すこと、憎[にく]まれる女[おんな]が良[よ]い夫[おっと]を得[え]ること。"
  24: "地[ち]の上[うえ]に小[ちい]さなものが四[よっ]つあるが、それらは賢[かしこ]い者[もの]たちよりも賢い。"
  25: "蟻[あり]は力[ちから]がないが、夏[なつ]のうちに食[た]べ物[もの]を備[そな]える。"
  26: "岩狸[いわだぬき]は強[つよ]い民[たみ]ではないが、自分[じぶん]の家[いえ]を岩の上[うえ]に造[つく]る。"
  27: "蝗[いなご]には王[おう]がいないが、一[ひと]つの号令[ごうれい]によって整然[せいぜん]と隊[たい]を組[く]んで進[すす]む。"
  28: "やもりは手[て]で支[ささ]えられ、捕[つか]まえやすくもあるが、王[おう]の館[やかた]に住[す]む。"
  29: "三[みっ]つのものは立派[りっぱ]に歩[あゆ]み、四[よっ]つのものは堂々[どうどう]と進[すす]む。"
  30: "獣[けもの]のうちで最[もっと]も強[つよ]い獅子[しし]の子[こ]は、どの獣にも向[む]きを変[か]えず、獣を恐[おそ]れない。"
  31: "雄鶏[おんどり]は雌鳥[めんどり]たちの間[あいだ]を雄々[おお]しく歩[あゆ]み、雄山羊[おやぎ]は群[む]れを導[みちび]き、王[おう]は民[たみ]の間[あいだ]で語[かた]る。"
  32: "もしあなたが身[み]を喜[よろこ]びに任[まか]せ、争[あらそ]いとともに手[て]を伸[の]べるなら、あなたは辱[はずかし]められる。"
  33: "乳[ちち]を搾[しぼ]ればバターができる。鼻[はな]を押[お]せば血[ち]が出[で]る。言葉[ことば]を引[ひ]き出[だ]せば、争[あらそ]いと闘[たたか]いが生[う]まれる。"

notes:
  1: "τάδε λέγει ὁ ἀνήρ — «так говорит муж» (ὁ ἀνήρ — «муж, человек»); τοῖς πιστεύουσιν θεῷ — «верующим Богу» (πιστεύω — «верить»); καὶ παύομαι — «и я перестаю (умолкаю)». В LXX имени Агура нет: масоретское надписание («Слова Агура, сына Иакеева…») заменено пророческой формулой, поэтому имя в текст не внесено. Формула обрывочная, «и я перестаю» оставлено буквально."
  2: "ἀφρονέστατος γάρ εἰμι πάντων ἀνθρώπων — «ибо я самый неразумный из всех людей» (ἄφρων — «глупый, неразумный»); φρόνησις ἀνθρώπων οὐκ ἔστιν ἐν ἐμοί — «и разума человеческого нет во мне» (φρόνησις — «разумение, рассудительность»)."
  3: "θεὸς δεδίδειχέν με σοφίαν — «Бог научил меня премудрости» (διδάσκω — «учить»); γνῶσιν ἁγίων ἔγνωκα — «и знание святых я познал» (γνῶσις — «знание»). В LXX это положительное чтение; в масоретском тексте и Синодальном — отрицание («не научился я мудрости»), оно не внесено."
  4: "τίς ἀνέβη εἰς τὸν οὐρανὸν καὶ κατέβη — «кто взошёл на небо и сошёл»; τίς συνήγαγεν ἀνέμους ἐν κόλπῳ — «кто собрал ветры в недро» (κόλπος — «лоно, пригоршня»); τίς συνέστρεψεν ὕδωρ ἐν ἱματίῳ — «кто связал воду в одежду» (συστρέφω — «связывать, сжимать»); τίς ἐκράτησεν πάντων τῶν ἄκρων τῆς γῆς — «кто удержал все края земли» (ἄκρον — «край, предел»); ἵνα γνῷς — «чтобы ты знал»."
  5: "πάντες λόγοι θεοῦ πεπυρωμένοι — «все слова Божии расплавлены (испытаны огнём)» (πυρόω — «жечь, очищать огнём»; слав. «разжена»); ὑπερασπίζει αὐτὸς τῶν εὐλαβουμένων αὐτόν — «защищает Сам благоговеющих перед Ним» (ὑπερασπίζω — «прикрывать щитом»; εὐλαβέομαι — «благоговеть»)."
  6: "μὴ προσθῇς τοῖς λόγοις αὐτοῦ — «не приложи к словам Его» (προστίθημι — «прибавлять»); ἵνα μὴ ἐλέγξῃ σε καὶ ψευδὴς γένῃ — «чтобы не обличил тебя и не стал ты лжецом» (ἐλέγχω — «обличать»; ψευδής — «лживый»)."
  7: "δύο αἰτοῦμαι παρὰ σοῦ — «двух прошу у Тебя» (αἰτέω — «просить»); μὴ ἀφέλῃς μου χάριν πρὸ τοῦ ἀποθανεῖν με — «не отними от меня благодати прежде, чем умереть мне» (ἀφαιρέω — «отнимать»; χάρις — «благодать, милость»). Это молитва внутри собрания изречений; кавычек нет, как в Псалтири."
  8: "μάταιον λόγον καὶ ψευδῆ μακρὰν μου ποίησον — «слово суетное и ложное удали от меня» (μάταιος — «тщетный, суетный»); πλοῦτον δὲ καὶ πενίαν μή μοι δῷς — «богатства же и бедности не дай мне»; σύνταξον δέ μοι τὰ δέοντα καὶ τὰ αὐτάρκη — «определи же мне нужное и довольное» (συντάσσω — «назначать»; αὐτάρκης — «достаточный, самодовольный»)."
  9: "ἵνα μὴ πλησθεὶς ψευδὴς γένωμαι — «чтобы, насытившись, я не стал лжецом»; εἴπω Τίς με ὁρᾷ — «и не сказал: кто меня видит?»: слова самого человека, 「…」; ἢ πενηθεὶς κλέψω — «или, обеднев, не украл» (πενθέω здесь в форме πενηθείς — «обеднев»); ὀμόσω τὸ ὄνομα τοῦ θεοῦ — «и не поклялся именем Бога» (ὄμνυμι — «клясться»)."
  10: "μὴ παραδῷς οἰκέτην εἰς χεῖρας δεσπότου — «не предай раба в руки господина» (παραδίδωμι — «передавать»); μήποτε καταράσηταί σε καὶ ἀφανισθῇς — «как бы не проклял тебя и не исчез ты» (καταράομαι — «проклинать»; ἀφανίζω — «истреблять»). Синодальный «не злословь раба пред господином» (по масоретскому тексту)."
  11: "ἔκγονον κακὸν πατέρα καταρᾶται — «злой отпрыск отца проклинает» (ἔκγονον — «отродье, потомок»); τὴν δὲ μητέρα οὐκ εὐλογεῖ — «а мать не благословляет». Стихи 11–14 в LXX начинаются одинаково — «злой отпрыск»; повтор сохранён."
  12: "ἔκγονον κακὸν δίκαιον ἑαυτὸν κρίνει — «злой отпрыск судит себя праведным»; τὴν δὲ ἔξοδον αὐτοῦ οὐκ ἀπένιψεν — «исхода же своего не омыл» (ἔξοδος — «выход, исход»; ἀπονίπτω — «омывать»)."
  13: "ἔκγονον κακὸν ὑψηλοὺς ὀφθαλμοὺς ἔχει — «злой отпрыск имеет высокие (надменные) глаза»; τοῖς βλεφάροις αὐτοῦ ἐπαίρεται — «и веками своими превозносится» (βλέφαρον — «веко»; ἐπαίρομαι — «подниматься, гордиться»)."
  14: "ἔκγονον κακὸν μαχαίρας τοὺς ὀδόντας ἔχει — «злой отпрыск имеет зубы — мечи»; τὰς μύλας τομίδας — «коренные зубы — режущие» (μύλη — «коренной зуб»; τομίς — «резец, острый»); ὥστε ἀναλίσκειν τοὺς ταπεινοὺς ἀπὸ τῆς γῆς — «чтобы истреблять смиренных с земли» (ἀναλίσκω — «истреблять, пожирать»)."
  15: "Τῇ βδέλλῃ τρεῖς θυγατέρες ἦσαν — «у пиявки были три дочери» (βδέλλα — «пиявка»); ἀγαπήσει ἀγαπώμεναι — «любовью возлюбленные»; αἱ τρεῖς αὗται οὐκ ἐνεπίμπλασαν αὐτήν — «и эти три не насытили её» (ἐμπίπλημι — «насыщать»); ἡ τετάρτη οὐκ ἠρκέσθη εἰπεῖν Ἱκανόν — «и четвёртая не удовольствовалась сказать: довольно» (ἀρκέω — «довольствоваться»; ἱκανόν — «достаточно»). Слово «довольно» — чужая речь, 「…」. В масоретском тексте две дочери («давай, давай»), в LXX — три; держимся греческого."
  16: "ᾅδης καὶ ἔρως γυναικὸς καὶ τάρταρος — «ад, и похоть жены, и тартар» (ᾅδης — よみ; τάρταρος — タルタロス, как в Иове); γῆ οὐκ ἐμπιπλαμένη ὕδατος — «земля, не насыщаемая водой»; ὕδωρ καὶ πῦρ οὐ μὴ εἴπωσιν Ἀρκεῖ — «вода и огонь не скажут: довольно». Синодальный иной (по масоретскому тексту: «утроба бесплодная»)."
  17: "ὀφθαλμὸν καταγελῶντα πατρὸς καὶ ἀτιμάζοντα γῆρας μητρός — «око, насмехающееся над отцом и бесчестящее старость матери» (καταγελάω — «насмехаться»; γῆρας — «старость»); ἐκκόψαισαν αὐτὸν κόρακες ἐκ τῶν φαράγγων — «да выклюют его вороны из ущелий» (ἐκκόπτω — «выклёвывать»; φάραγξ — «ущелье»); καταφάγοισαν αὐτὸν νεοσσοὶ ἀετῶν — «да съедят его птенцы орлов» (νεοσσός — «птенец»). Оптатив греческого передан пожеланием."
  18: "τρία ἐστὶν ἀδύνατά μοι νοῆσαι — «три есть невозможных для меня уразуметь» (ἀδύνατος — «невозможный»); τὸ τέταρτον οὐκ ἐπιγινώσκω — «четвёртого не познаю» (ἐπιγινώσκω — «узнавать»)."
  19: "ἴχνη ἀετοῦ πετομένου — «следы орла летящего» (ἴχνος — «след»); ὁδοὺς ὄφεως ἐπὶ πέτρας — «пути змея на камне»; τρίβους νηὸς ποντοπορούσης — «стези корабля, плавающего по морю» (τρίβος — «тропа»; ποντοπορέω — «плавать по морю»); ὁδοὺς ἀνδρὸς ἐν νεότητι — «пути мужа в юности». Синодальный «пути мужчины к девице» (по масоретскому тексту)."
  20: "τοιαύτη ὁδὸς γυναικὸς μοιχαλίδος — «таков путь жены прелюбодейной» (μοιχαλίς — «прелюбодейка»); ὅταν πράξῃ, ἀπονιψαμένη οὐδέν φησιν πεπραχέναι ἄτοπον — «когда сделает, омывшись, говорит, что ничего непристойного не сделала» (ἀπονίπτομαι — «омываться»; ἄτοπος — «неуместный, дурной»). Её слова — 「…」."
  21: "διὰ τριῶν σείεται ἡ γῆ — «от трёх трясётся земля» (σείω — «трясти»); τὸ τέταρτον οὐ δύναται φέρειν — «четвёртого не может снести» (φέρω — «нести, терпеть»). Перечисление продолжается в ст. 22–23."
  22: "ἐὰν οἰκέτης βασιλεύσῃ — «если раб воцарится» (βασιλεύω — «царствовать»); ἄφρων πλησθῇ σιτίων — «глупый насытится пищей» (σιτίον — «пища, хлеб»). Перечисление продолжается в ст. 23; у csl ст. 22 вбирает и начало gr 23 («и раба аще изженет свою госпожу»), здесь деление по gr."
  23: "οἰκέτις ἐὰν ἐκβάλῃ τὴν ἑαυτῆς κυρίαν — «если служанка изгонит свою госпожу» (οἰκέτις — «служанка»; ἐκβάλλω — «выгонять»); μισητὴ γυνὴ ἐὰν τύχῃ ἀνδρὸς ἀγαθοῦ — «если ненавистная (презренная) жена получит мужа доброго» (μισητός — «ненавистный»; τυγχάνω — «получать»)."
  24: "τέσσαρα ἐστὶν ἐλάχιστα ἐπὶ τῆς γῆς — «четыре есть малейших на земле» (ἐλάχιστος — «наименьший»); ταῦτα ἐστιν σοφώτερα τῶν σοφῶν — «они мудрее мудрых»."
  25: "οἱ μύρμηκες, οἷς μὴ ἔστιν ἰσχύς — «муравьи, у которых нет силы» (μύρμηξ — «муравей»; ἰσχύς — «сила»); ἑτοιμάζονται θέρους τὴν τροφήν — «готовят летом пищу» (θέρος — «лето»; τροφή — «пища»); слав. «в жатву»."
  26: "οἱ χοιρογρύλλιοι, ἔθνος οὐκ ἰσχυρόν — «горные мыши (даманы), народ не сильный» (χοιρογρύλλιος — «даман, горная мышь»); οἳ ἐποιήσαντο ἐν πέτραις τοὺς ἑαυτῶν οἴκους — «которые сделали в скалах дома свои»."
  27: "ἀβασίλευτόν ἐστιν ἡ ἀκρίς — «без царя саранча» (ἀβασίλευτος — «бесцарный»; ἀκρίς — «саранча»); ἐκστρατεύει ἀφ᾽ ἑνὸς κελεύσματος εὐτάκτως — «выступает от одного повеления благочинно» (ἐκστρατεύω — «выступать в поход»; κέλευσμα — «повеление»; εὐτάκτως — «стройно»)."
  28: "καλαβώτης χερσὶν ἐρειδόμενος — «ящерица (геккон), руками опирающийся» (καλαβώτης — «ящерица, геккон»; ἐρείδω — «опирать»); εὐάλωτος ὢν — «будучи легко уловим» (εὐάλωτος — «легко ловимый»); κατοικεῖ ἐν ὀχυρώμασιν βασιλέως — «живёт в укреплениях царя» (ὀχύρωμα — «крепость»). Синодальный «паук» (по масоретскому тексту)."
  29: "τρία ἐστίν, ἃ εὐόδως πορεύεται — «три, которые благополучно ходят» (εὐόδως — «благополучно, успешно»); τὸ τέταρτον, ὃ καλῶς διαβαίνει — «четвёртое, которое хорошо проходит» (διαβαίνω — «проходить»)."
  30: "σκύμνος λέοντος ἰσχυρότερος κτηνῶν — «львёнок, сильнейший из зверей» (σκύμνος — «детёныш»; κτῆνος — «скот, зверь»); ὃς οὐκ ἀποστρέφεται οὐδὲ καταπτήσσει κτῆνος — «который не отворачивается и не страшится никакого зверя» (καταπτήσσω — «страшиться»)."
  31: "ἀλέκτωρ ἐμπεριπατῶν θηλείαις εὔψυχος — «петух, расхаживающий среди кур, бодрый» (ἀλέκτωρ — «петух»; θήλεια — «самка»; εὔψυχος — «мужественный, бодрый»); τράγος ἡγούμενος αἰπολίου — «козёл, ведущий стадо» (τράγος — «козёл»; αἰπόλιον — «козье стадо»); βασιλεὺς δημηγορῶν ἐν ἔθνει — «царь, держащий речь к народу» (δημηγορέω — «говорить к народу»). Синодальный «конь» (по масоретскому тексту)."
  32: "ἐὰν πρῄ σεαυτὸν εἰς εὐφροσύνην — «если предашь себя веселию» (προΐημι — «отпускать, предавать»; εὐφροσύνη — «веселие»); ἐκτείνῃς τὴν χεῖρά σου μετὰ μάχης — «и прострёшь руку твою на ссору»; ἀτιμασθήσῃ — «будешь обесчещен» (ἀτιμάζω — «бесчестить»). Синодальный иной (по масоретскому тексту: «положи руку на уста»)."
  33: "ἄμελγε γάλα, καὶ ἔσται βούτυρον — «дои молоко, и будет масло» (ἀμέλγω — «доить»; βούτυρον — «масло»); ἐὰν ἐκπιέζῃς μυκτῆρας, ἐξελεύσεται αἷμα — «если сожмёшь ноздри, выйдет кровь» (ἐκπιέζω — «выжимать»; μυκτήρ — «ноздря»); ἐὰν ἐξέλκῃς λόγους, ἐξελεύσονται κρίσεις καὶ μάχαι — «если извлечёшь слова, выйдут тяжбы и ссоры» (ἐξέλκω — «вытаскивать»; κρίσις — «тяжба, суд»)."
