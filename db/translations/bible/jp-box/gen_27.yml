verses:
  1: "イサクは年老[としお]いて、目[め]がかすみ、見[み]えなくなった。彼は長男[ちょうなん]エサウを呼[よ]んで言[い]った。「わたしの子[こ]よ。」エサウは答[こた]えた。「ここにいます。」"
  2: "イサクは言った。「見[み]よ、わたしは年老[としお]いた。いつ死[し]ぬかも分[わ]からない。"
  3: "今[いま]、あなたの道具[どうぐ]、矢筒[やづつ]と弓[ゆみ]を取[と]り、野[の]へ出[で]て、わたしのために狩[か]りをし、"
  4: "わたしの好[この]む食[しょく]べ物[もの]を作[つく]って持[も]って来[き]なさい。わたしはそれを食[た]べ、死[し]ぬ前[まえ]に、わたし自身[じしん]があなたを祝福[しゅくふく]しよう。」"
  5: "リベカは、イサクがその子[こ]エサウに語[かた]るのを聞[き]いていた。エサウは父[ちち]のために狩[か]りをしようと野[の]へ出[で]かけた。"
  6: "リベカは、自分[じぶん]の弟[おとうと]の子[こ]ヤコブに言った。「見[み]なさい。わたしは、あなたの父[ちち]があなたの兄[あに]エサウにこう言[い]うのを聞[き]いた。"
  7: "『わたしのために狩[か]りをして、食[しょく]べ物[もの]を作[つく]りなさい。わたしは食[た]べて、死[し]ぬ前[まえ]に、主[しゅ]の前[まえ]でおまえを祝福[しゅくふく]しよう』と。"
  8: "今[いま]、わたしの子[こ]よ、わたしが命[めい]じることを聞[き]きなさい。"
  9: "羊[ひつじ]の群[む]れに行[い]き、そこから良[よ]い若[わか]い子[こ]やぎを二匹[にひき]取[と]ってわたしに持[も]って来[き]なさい。わたしがあなたの父[ちち]のために、父の好[この]む食[しょく]べ物[もの]を作ろう。"
  10: "あなたはそれを父[ちち]のところへ持[も]って行[い]き、父に食[た]べさせなさい。父が死[し]ぬ前[まえ]に、あなたを祝福[しゅくふく]するためである。」"
  11: "ヤコブは母[はは]リベカに言った。「兄[あに]のエサウは毛深[けぶか]い人[ひと]だが、わたしは毛[け]のない人[ひと]だ。"
  12: "父[ちち]がわたしに手[て]を触[ふ]れたら、どうなるだろう。わたしは父の目[め]には、父を軽[かろ]んじる者[もの]と映[うつ]り、祝福[しゅくふく]ではなく呪[のろ]いを自分[じぶん]に招[まね]いてしまう。」"
  13: "母[はは]は彼に言った。「子[こ]よ、その呪[のろ]いはわたしが受[う]けよう。ただ、わたしの声[こえ]に聞[き]き従[したが]って、行[い]って持[も]って来[き]なさい。」"
  14: "彼は行[い]って取[と]って来[き]、母[はは]のところへ持[も]って来[き]た。母は、父[ちち]が好[この]んだとおりに食[しょく]べ物[もの]を作[つく]った。"
  15: "リベカは、家[いえ]にあった、長男[ちょうなん]エサウの晴[は]れ着[ぎ]を取[と]って、弟[おとうと]の子[こ]ヤコブに着[き]せ、"
  16: "子[こ]やぎの毛皮[けがわ]を彼の腕[うで]と、首[くび]の毛[け]のない所[ところ]に巻[ま]きつけ、"
  17: "自分[じぶん]が作[つく]った食[しょく]べ物[もの]とパンを、その子[こ]ヤコブの手[て]に渡[わた]した。"
  18: "ヤコブは父[ちち]のところへ入[はい]って行[い]き、言った。「父[ちち]よ。」父は言った。「ここにいる。おまえは誰[だれ]か、わたしの子[こ]よ。」"
  19: "ヤコブは父[ちち]に言った。「わたしはあなたの長子[ちょうし]エサウです。あなたがわたしに言[い]ったとおりにしました。どうか起[お]きて座[すわ]り、わたしの狩[か]りの獲[え]物[もの]を食[た]べてください。あなた自身[じしん]がわたしを祝福[しゅくふく]するために。」"
  20: "イサクはその子[こ]に言った。「どうして、こんなに早[はや]く見[み]つけたのか、わたしの子[こ]よ。」彼は言った。「あなたの神[かみ]である主[しゅ]が、わたしの目の前[まえ]に備[そな]えてくださったのです。」"
  21: "イサクはヤコブに言った。「わたしのそばに来[き]なさい。おまえに手[て]を触[ふ]れてみよう、わたしの子[こ]よ。おまえがわたしの子[こ]エサウかどうか。」"
  22: "ヤコブは父[ちち]イサクのそばに寄[よ]った。イサクは彼に手[て]を触[ふ]れて言った。「声[こえ]はヤコブの声[こえ]だが、手[て]はエサウの手[て]だ。」"
  23: "イサクは彼を見分[みわ]けなかった。彼の手[て]が兄[あに]エサウの手のように毛深[けぶか]かったからである。そして彼を祝福[しゅくふく]した。"
  24: "イサクは言った。「おまえはわたしの子[こ]エサウか。」彼は言った。「わたしです。」"
  25: "イサクは言った。「わたしのところへ持[も]って来[き]なさい。おまえの狩[か]りの獲[え]物[もの]を食[た]べよう、わたしの子[こ]よ。わたし自身[じしん]がおまえを祝福[しゅくふく]するために。」ヤコブがそばに差[さ]し出[だ]すと、イサクは食[た]べた。ぶどう酒[しゅ]を運[はこ]ぶと、イサクは飲[の]んだ。"
  26: "父[ちち]イサクは彼に言った。「そばに来[き]て、わたしに口[くち]づけしなさい、わたしの子[こ]よ。」"
  27: "彼が近[ちか]づいて口[くち]づけすると、イサクはその衣[ころも]の匂[にお]いを嗅[か]いだ。そして彼を祝福[しゅくふく]して言った。「見[み]よ、わたしの子[こ]の匂[にお]いは、主[しゅ]が祝福された豊[ゆた]かな野[の]の匂[にお]いのようだ。"
  28: "どうか神[かみ]が、天[てん]の露[つゆ]と地[ち]の肥[こ]え、また多[おお]くの麦[むぎ]とぶどう酒[しゅ]をあなたに与[あた]えてくださいますように。"
  29: "もろもろの民[たみ]があなたに仕[つか]え、もろもろの君[きみ]たちがあなたにひれ伏[ふ]しますように。あなたは兄[あに]の主人[しゅじん]となれ、あなたの父[ちち]の子[こ]らがあなたにひれ伏すように。あなたを呪[のろ]う者[もの]は呪われ、あなたを祝福[しゅくふく]する者は祝福されるように。」"
  30: "イサクがその子[こ]ヤコブを祝福[しゅくふく]し終[お]えると、ヤコブが父[ちち]イサクの前[まえ]から出[で]て行[い]ったすぐそのとき、兄[あに]のエサウが狩[か]りから帰[かえ]って来[き]た。"
  31: "エサウもまた食[しょく]べ物[もの]を作[つく]って父[ちち]のところへ持[も]って来[き]、父に言った。「父[ちち]よ、起[お]きて、あなたの子[こ]の狩[か]りの獲[え]物[もの]を食[た]べてください。あなた自身[じしん]がわたしを祝福[しゅくふく]するために。」"
  32: "父[ちち]イサクは彼に言った。「おまえは誰[だれ]か。」彼は言った。「わたしはあなたの子[こ]、長子[ちょうし]エサウです。」"
  33: "イサクは非常[ひじょう]に激[はげ]しく驚[おどろ]いて言った。「それでは、狩[か]りをして獲[え]物[もの]をわたしに持[も]って来[き]たのは誰[だれ]か。おまえが来[く]る前[まえ]に、わたしはそのすべてを食[た]べて彼を祝福[しゅくふく]してしまった。彼は祝福されたままだ。」"
  34: "エサウは父[ちち]イサクのこの言葉[ことば]を聞[き]くと、非常[ひじょう]に大[おお]きな、苦[にが]い声[こえ]を上[あ]げて言った。「父[ちち]よ、どうかわたしも祝福[しゅくふく]してください。」"
  35: "イサクは言った。「おまえの弟[おとうと]が欺[あざむ]きによって来[き]て、おまえの祝福[しゅくふく]を奪[うば]って行[い]った。」"
  36: "エサウは言った。「彼の名[な]がヤコブと呼ばれたのは正[ただ]しい。彼はもう二度[にど]、わたしの足[あし]を掴[つか]んだからだ。わたしの長子[ちょうし]の権利[けんり]を取[と]り、今[いま]またわたしの祝福[しゅくふく]を取[と]った。」そしてエサウは父[ちち]に言った。「父[ちち]よ、あなたはわたしに祝福[しゅくふく]を残[のこ]してはくださいませんでしたか。」"
  37: "イサクは答[こた]えてエサウに言った。「わたしは彼をあなたの主人[しゅじん]とし、彼の兄弟[きょうだい]をすべて彼のしもべとした。また麦[むぎ]とぶどう酒[しゅ]で彼を支[ささ]えた。おまえには、何[なに]をしてやれるというのか、わたしの子[こ]よ。」"
  38: "エサウは父[ちち]に言った。「父[ちち]よ、あなたの祝福[しゅくふく]はただ一[ひと]つだけなのですか。父[ちち]よ、どうかわたしも祝福してください。」イサクが沈黙[ちんもく]すると、エサウは声[こえ]を上[あ]げて泣[な]いた。"
  39: "父[ちち]イサクは答[こた]えて彼に言った。「見[み]よ、あなたの住[す]む所[ところ]は、地[ち]の肥[こ]えから、また上[うえ]なる天[てん]の露[つゆ]から来[く]る。"
  40: "あなたは剣[つるぎ]によって生[い]き、あなたの弟[おとうと]に仕[つか]える。しかし、あなたが打[う]ち倒[たお]すときが来[き]て、あなたは彼の軛[くびき]を自分[じぶん]の首[くび]から解[と]き放[はな]つ。」"
  41: "エサウは、父[ちち]がヤコブを祝福[しゅくふく]したその祝福のゆえに、ヤコブを恨[うら]んだ。エサウは心[こころ]の中[なか]で言った。「父[ちち]の喪[も]の日[ひ]が近[ちか]づいたら、弟[おとうと]ヤコブを殺[ころ]してやろう。」"
  42: "長男[ちょうなん]エサウのこの言葉[ことば]がリベカに告[つ]げられた。彼女[かのじょ]は人[ひと]を遣[つか]わして弟[おとうと]の子[こ]ヤコブを呼[よ]び、言った。「見[み]なさい。あなたの兄[あに]エサウは、あなたを殺[ころ]そうと脅[おど]している。"
  43: "今[いま]、わたしの子[こ]よ、わたしの声[こえ]に聞[き]き従[したが]い、立[た]って、わたしの兄弟[きょうだい]ラバンのいるメソポタミアのハランへ逃[に]げなさい。"
  44: "しばらく彼のもとに住[す]みなさい。兄[あに]の怒[いか]りが"
  45: "あなたから離[はな]れ、あなたが彼にしたことを彼が忘[わす]れるまで。そのとき、わたしは人を遣[つか]わして、あなたをそこから連[つ]れ戻[もど]します。一日[いちにち]のうちに、わたしがあなたがた二人[ふたり]を失[うしな]うことなど、あってはなりません。」"
  46: "リベカはイサクに言った。「わたしはヘトの子[こ]らの娘[むすめ]たちのことで、自分[じぶん]の生[い]きるのが嫌[いや]になりました。ヤコブがこの地[ち]の娘たちから妻[つま]を迎[むか]えるのなら、わたしは何[なん]のために生[い]きるのでしょう。」"

notes:
  1: "ἠμβλύνθησαν οἱ ὀφθαλμοὶ αὐτοῦ τοῦ ὁρᾶν — 目がかすみ、見えなくなった (ἀμβλύνομαι — «притупляться»; τοῦ ὁρᾶν — инфинитив цели/следствия). τὸν υἱὸν τὸν πρεσβύτερον — 長男. Υἱέ μου… Ἰδοὺ ἐγώ — 「わたしの子よ」「ここにいます」 (ответ на зов)."
  2: "γεγήρακα — perfect: состарился и остаюсь старым. οὐ γινώσκω τὴν ἡμέραν τῆς τελευτῆς μου — いつ死ぬかも分からない (τελευτή — «кончина»)."
  3: "τὸ σκεῦός σου, τήν τε φαρέτραν καὶ τὸ τόξον — 道具、矢筒と弓 (φαρέτρα — «колчан»). θήρευσόν μοι θήραν — わたしのために狩りをし (figura etymologica: «улови мне лов»)."
  4: "ποίησόν μοι ἐδέσματα, ὡς φιλῶ ἐγώ — わたしの好む食べ物を作って (ἔδεσμα — «кушанье»). ὅπως εὐλογήσῃ σε ἡ ψυχή μου — わたし自身があなたを祝福するために (ψυχή — евр. идиома «я сам»; букв. «душа моя», слав. так же)."
  5: "ἤκουσεν λαλοῦντος Ισαακ — イサクが…語るのを聞いていた (родительный при ἀκούω). θηρεῦσαι θήραν τῷ πατρὶ αὐτοῦ — 父のために狩りをしようと."
  6: "τὸν υἱὸν αὐτῆς τὸν ἐλάσσω — 弟の子 (ἐλάσσων — «меньший»). Ἰδὲ ἐγώ — 見なさい (ἴδε — императив от ὁράω). λέγοντος — こう言うのを (причастие наст. вр.)."
  7: "Ἔνεγκόν μοι θήραν — 狩りをして持って来なさい (ἔνεγκον — императив аориста). ἐναντίον κυρίου — 主の前で. Слова Исаака внутри речи Ревекки — 『…』. πρὸ τοῦ ἀποθανεῖν με — 死ぬ前に."
  8: "καθὰ ἐγὼ σοι ἐντέλλομαι — わたしが命じるとおりに (ἐντέλλομαι — «заповедовать»)."
  9: "δύο ἐρίφους ἁπαλοὺς καὶ καλούς — 良い若い子やぎ二匹 (ἔριφος — «козлёнок»; ἁπαλός — «нежный, молодой»). ὡς φιλεῖ — 父の好むとおり (φιλέω — «любить», здесь о еде)."
  10: "εἰσοίσεις τῷ πατρί σου — 父のところへ持って行き (εἰσφέρω). ὅπως εὐλογήσῃ σε ὁ πατήρ σου — 父があなたを祝福するために."
  11: "ἀνὴρ δασύς — 毛深い人 (δασύς — «косматый»). ἀνὴρ λεῖος — 毛のない人 (λεῖος — «гладкий»)."
  12: "μήποτε ψηλαφήσῃ με ὁ πατήρ μου — 父がわたしに手を触れたら (ψηλαφάω — «ощупывать»; μήποτε — опасение). ὡς καταφρονῶν — 父を嘲る者として (καταφρονέω — «презирать»; слав. «яко презираяй», jp-joc «欺く者»). ἐπάξω ἐπ᾽ ἐμαυτὸν κατάραν — 呪いを自分に招く (ἐπάγω — «наводить»)."
  13: "Ἐπ᾽ ἐμὲ ἡ κατάρα σου, τέκνον — その呪いはわたしが受けよう (букв. «на мне проклятие твоё»). μόνον ὑπάκουσον τῆς φωνῆς μου — ただ、わたしの声に聞き従って."
  14: "καθὰ ἐφίλει ὁ πατὴρ αὐτοῦ — 父が好んだとおりに (имперфект)."
  15: "τὴν στολὴν Ησαυ… τὴν καλὴν — エサウの晴れ着 (στολή — «одежда, наряд»; слав. «одежду… добрую»). ἣ ἦν παρ᾽ αὐτῇ ἐν τῷ οἴκῳ — 家にあった (παρ᾽ αὐτῇ — «у неё»)."
  16: "τὰ δέρματα τῶν ἐρίφων — 子やぎの毛皮 (δέρμα — 毛皮[けがわ]). ἐπὶ τοὺς βραχίονας… καὶ ἐπὶ τὰ γυμνὰ τοῦ τραχήλου — 腕と首の毛のない所に (γυμνά — «нагое»)."
  17: "τοὺς ἄρτους, οὓς ἐποίησεν — 自分が作ったパン."
  18: "εἰσήνεγκεν τῷ πατρὶ αὐτοῦ — 父のところへ入って行き. Πάτερ — 父よ (звательный). τίς εἶ σύ, τέκνον; — おまえは誰か、わたしの子よ (τέκνον — «дитя»)."
  19: "Ἐγὼ Ησαυ ὁ πρωτότοκός σου — わたしはあなたの長子エサウです (прямая ложь Иакова, не смягчается). καθὰ ἐλάλησάς μοι — あなたが言ったとおりに. ἀναστὰς κάθισον — 起きて座り. ὅπως εὐλογήσῃ με ἡ ψυχή σου — あなた自身がわたしを祝福するために (ψυχή, как в ст. 4)."
  20: "Ὃ ταχὺ εὗρες — こんなに早く見つけたのか (ταχύ — «быстро»). Ὃ παρέδωκεν κύριος ὁ θεός σου ἐναντίον μου — あなたの神である主がわたしの目の前に備えてくださった (παραδίδωμι — «передавать»; Син. «послал мне навстречу»)."
  21: "Ἔγγισόν μοι — そばに来なさい. ψηλαφήσω σε… εἰ σὺ εἶ ὁ υἱός μου Ησαυ ἢ οὔ — おまえが…エサウかどうか、手を触れてみよう."
  22: "Ἡ μὲν φωνὴ φωνὴ Ιακωβ, αἱ δὲ χεῖρες χεῖρες Ησαυ — 声はヤコブの声だが、手はエサウの手だ (μέν… δέ — противопоставление)."
  23: "οὐκ ἐπέγνω αὐτόν — 見分けなかった (ἐπιγινώσκω). ἦσαν γὰρ αἱ χεῖρες αὐτοῦ… δασεῖαι — 手が毛深かったから. ηὐλόγησεν αὐτόν — 祝福した (начало благословения, продолжение в ст. 27–29)."
  24: "Σὺ εἶ ὁ υἱός μου Ησαυ; — おまえは…エサウか. Ἐγώ — わたしです."
  25: "Προσάγαγέ μοι — わたしのところへ持って来なさい (προσάγω). ἵνα εὐλογήσῃ σε ἡ ψυχή μου — わたし自身がおまえを祝福するために (ψυχή; ср. ст. 4, 19). εἰσήνεγκεν αὐτῷ οἶνον — ぶどう酒を差し出すと (οἶνος — «вино»)."
  26: "Ἔγγισόν μοι καὶ φίλησόν με — そばに来て、口づけしなさい (φιλέω — «целовать»)."
  27: "ὠσφράνθη τὴν ὀσμὴν τῶν ἱματίων — 衣の匂いを嗅いだ (ὀσφραίνομαι — «обонять»; ὀσμή — 匂[にお]い). ὀσμὴ ἀγροῦ πλήρους — 豊かな野の匂い (πλήρης — «полный»). ὃν ηὐλόγησεν κύριος — 主が祝福された (относительное к ἀγρός)."
  28: "δῴη σοι ὁ θεός — どうか神が…与えてくださいますように (оптатив). ἀπὸ τῆς δρόσου τοῦ οὐρανοῦ — 天の露から (δρόσος — «роса»). ἀπὸ τῆς πιότητος τῆς γῆς — 地の肥えから (πιότης — «тук, жирность»). πλῆθος σίτου καὶ οἴνου — 多くの麦とぶどう酒 (σῖτος — «пшеница, хлеб»)."
  29: "δουλευσάτωσάν σοι ἔθνη — もろもろの民が仕えますように (императив 3 л.). γίνου κύριος τοῦ ἀδελφοῦ σου — 兄の主人となれ. ὁ καταρώμενός σε ἐπικατάρατος — あなたを呪う者は呪われ (ἐπικατάρατος — усиленное «проклят»). ὁ εὐλογῶν σε εὐλογημένος — 祝福する者は祝福される (формула, ср. 12:3)."
  30: "μετὰ τὸ παύσασθαι Ισαακ εὐλογοῦντα — イサクが祝福し終えると (παύομαι + причастие). ὡς ἐξῆλθεν Ιακωβ ἀπὸ προσώπου — ヤコブが…前から出て行ったすぐそのとき (ὡς — «как только»). ἦλθεν ἀπὸ τῆς θήρας — 狩りから帰って来た."
  31: "Ἀναστήτω ὁ πατήρ μου — 父よ、起きて (императив 3 л. в обращении). ὅπως εὐλογήσῃ με ἡ ψυχή σου — あなた自身がわたしを祝福するために (ψυχή)."
  32: "Τίς εἶ σύ; — おまえは誰か. Ἐγώ εἰμι ὁ υἱός σου ὁ πρωτότοκος Ησαυ — わたしはあなたの子、長子エサウです (ἐγώ εἰμι — «это я»)."
  33: "ἐξέστη… ἔκστασιν μεγάλην σφόδρα — 非常に激しく驚いた (figura etymologica: «изумился изумлением»). ὁ θηρεύσας μοι θήραν — 狩りをして獲物を持って来た者. ἔφαγον ἀπὸ πάντων — そのすべてを食べて (аорист 1 л. ед. ч.). εὐλογημένος ἔστω — 祝福されたままだ (благословение не отменяется)."
  34: "ἀνεβόησεν φωνὴν μεγάλην καὶ πικρὰν σφόδρα — 非常に大きな、苦い声を上げて (πικρός — «горький»). Εὐλόγησον δὴ κἀμέ — どうかわたしも祝福してください (κἀμέ = καὶ ἐμέ)."
  35: "Ἐλθὼν… μετὰ δόλου — 欺きによって来て (δόλος — «коварство, обман»). ἔλαβεν τὴν εὐλογίαν σου — おまえの祝福を奪って行った."
  36: "Δικαίως ἐκλήθη τὸ ὄνομα αὐτοῦ Ιακωβ — 彼の名がヤコブと呼ばれたのは正しい (δικαίως — «справедливо»). ἐπτέρνικεν γάρ με ἤδη δεύτερον τοῦτο — もう二度、わたしの足を掴んだ (πτερνίζω — «запнуть, обмануть»; игра слов с именем Иаков — «пята»). Οὐχ ὑπελίπω μοι εὐλογίαν; — 祝福を残してはくださいませんでしたか (ὑπολείπω — «оставлять»)."
  37: "Εἰ κύριον αὐτὸν ἐποίησά σου — わたしは彼をあなたの主人とした (εἰ — здесь «вот, если»; слав. «аще»). πάντας τοὺς ἀδελφοὺς αὐτοῦ… οἰκέτας — 彼の兄弟をすべてしもべと (οἰκέτης — «домочадец, раб»). σίτῳ καὶ οἴνῳ ἐστήρισα αὐτόν — 麦とぶどう酒で支えた (στηρίζω — «утверждать»). σοὶ δὲ τί ποιήσω; — おまえには何をしてやれるのか."
  38: "Μὴ εὐλογία μία σοί ἐστιν, πάτερ; — 祝福はただ一つだけなのですか. κατανυχθέντος δὲ Ισαακ — イサクが沈黙すると (κατανύσσομαι — «цепенеть, умолкать»; слав. «умилившуся», jp-joc «默したれば»). ἀνεβόησεν φωνὴν… καὶ ἔκλαυσεν — 声を上げて泣いた."
  39: "ἀπὸ τῆς πιότητος τῆς γῆς ἔσται ἡ κατοίκησίς σου — あなたの住む所は地の肥えから… (ἀπό — «от»: LXX оставляет двусмысленность евр. «от/вдали от»; слав. и Син. «от тука земли»). ἀπὸ τῆς δρόσου τοῦ οὐρανοῦ ἄνωθεν — 上なる天の露から (ἄνωθεν — «свыше»)."
  40: "ἐπὶ τῇ μαχαίρῃ σου ζήσῃ — 剣によって生きる (ἐπί + дат.). τῷ ἀδελφῷ σου δουλεύσεις — 弟に仕える. ἡνίκα ἐὰν καθέλῃς — あなたが打ち倒すとき (καθαιρέω — «низвергать»). ἐκλύσεις τὸν ζυγὸν αὐτοῦ — 彼の軛を解き放つ (ἐκλύω — «ослаблять, снимать»; ζυγός — 軛[くびき])."
  41: "ἐνεκότει Ησαυ τῷ Ιακωβ — エサウはヤコブを恨んだ (ἐγκοτέω — «злобствовать»). Ἐγγισάτωσαν αἱ ἡμέραι τοῦ πένθους τοῦ πατρός μου — 父の喪の日が近づいたら (πένθος — «плач, траур»). ἵνα ἀποκτείνω — 殺してやろう (ἵνα с сослагательным — намерение)."
  42: "ἀπηγγέλη… τὰ ῥήματα — この言葉が…告げられた. πέμψασα ἐκάλεσεν — 人を遣わして呼び (πέμπω — «посылать»). ἀπειλεῖ σοι τοῦ ἀποκτεῖναί σε — 殺そうと脅している (ἀπειλέω + инфинитив)."
  43: "ἀπόδραθι εἰς τὴν Μεσοποταμίαν — メソポタミアへ逃げなさい (ἀποδιδράσκω — «убегать»). εἰς Χαρραν — ハランへ."
  44: "οἴκησον μετ᾽ αὐτοῦ ἡμέρας τινάς — しばらく彼のもとに住みなさい. ἕως τοῦ ἀποστρέψαι τὸν θυμὸν — 怒りが収まるまで (θυμός — «ярость»; фраза обрывается и продолжается в ст. 45 — граница стихов сохранена)."
  45: "καὶ τὴν ὀργὴν τοῦ ἀδελφοῦ σου ἀπὸ σοῦ — あなたの兄の憤りがあなたから離れ (ὀργή — «гнев»; в LXX — продолжение фразы ст. 44; слав. переносит эту часть в ст. 44). ἐπιλάθηται ἃ πεποίηκας αὐτῷ — あなたが彼にしたことを忘れる. μεταπέμψομαί σε — あなたを連れ戻します (μεταπέμπω — «вызывать к себе»). μήποτε ἀτεκνωθῶ ἀπὸ τῶν δύο ὑμῶν ἐν ἡμέρᾳ μιᾷ — 一日のうちに二人を失いたくない (ἀτεκνόω — «лишиться детей»)."
  46: "Προσώχθικα τῇ ζωῇ μου — 自分の生きるのが嫌になった (προσοχθίζω — «гнушаться, тяготиться»; слав. «стужих си»). διὰ τὰς θυγατέρας τῶν υἱῶν Χετ — ヘトの子らの娘たちのことで (LXX: «дочерей сынов Хета»). εἰ λήμψεται Ιακωβ γυναῖκα… ἵνα τί μοι ζῆν; — ヤコブが…妻を迎えるのなら、何のために生きるのか."
