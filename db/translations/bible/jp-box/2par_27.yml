verses:
  1: "ヨタムは二十五歳[にじゅうごさい]で王[おう]となり、エルサレムで十六年[じゅうろくねん]治[おさ]めた。母[はは]の名[な]はエルシャといい、ツァドクの娘[むすめ]であった。"
  2: "彼[かれ]は父[ちち]ウジヤが行[おこな]ったすべてのとおりに、主[しゅ]の前[まえ]に正[ただ]しいことを行った。ただ、彼は主の神殿[しんでん]には入[はい]らなかった。民[たみ]はなおも罪[つみ]を犯[おか]し続[つづ]けていた。"
  3: "彼[かれ]は主[しゅ]の家[いえ]の上[うえ]の門[もん]を建[た]て、オフェルの城壁[じょうへき]の上にも多[おお]くを築[きず]いた。"
  4: "また、ユダの山地[さんち]に町[まち]々[まち]を、森[もり]の中[なか]に住[す]まいと塔[とう]を建[た]てた。"
  5: "彼[かれ]はアンモン人[じん]の王[おう]と戦[たたか]ってこれに勝[か]ち、アンモン人はその年[とし]、銀[ぎん]百[ひゃく]タラント、小麦[こむぎ]一万[いちまん]コル、大麦[おおむぎ]一万コルを彼に納[おさ]めた。アンモン人の王はこれを、第一[だいいち]年[ねん]、第二[だいに]年、第三[だいさん]年にも毎年[まいとし]彼に納めた。"
  6: "ヨタムは強[つよ]くなった。彼[かれ]が自分[じぶん]の神[かみ]である主[しゅ]の前[まえ]に、自分の道[みち]を整[ととの]えたからである。"
  7: "ヨタムの残[のこ]りの言葉[ことば]、彼[かれ]の戦[たたか]い、およびその行[おこな]いのすべては、見[み]よ、ユダとイスラエルの王[おう]たちの書[しょ]に記[しる]されている。"
  8: "彼[かれ]は二十五歳[にじゅうごさい]で王[おう]となり、エルサレムで十六年[じゅうろくねん]治[おさ]めた。"
  9: "ヨタムは父[ちち]たちとともに眠[ねむ]り、ダビデの町[まち]に葬[ほうむ]られた。代[か]わりにその子[こ]アハズが王[おう]となった。"

notes:
  1: "Υἱὸς εἴκοσι πέντε ἐτῶν Ιωαθαμ — сын двадцати пяти лет Иоафам. δέκα ἓξ ἔτη — шестнадцать лет. ὄνομα τῆς μητρὸς αὐτοῦ Ιερουσα θυγάτηρ Σαδωκ — имя матери его Иеруса, дочь Садока (слав. «иеруса, дщи садокова», ru «Иеруша»; в тексте エルシャ, как в 4 Цар 15:33)."
  2: "ἐποίησεν τὸ εὐθὲς ἐνώπιον κυρίου — делал правое пред Господом. κατὰ πάντα, ὅσα ἐποίησεν Οζιας ὁ πατὴρ αὐτοῦ — по всему, что сделал Озия, отец его. ἀλλ᾿ οὐκ εἰσῆλθεν εἰς τὸν ναὸν κυρίου — но не вошёл в храм Господень. ἔτι ὁ λαὸς κατεφθείρετο — ещё народ развращался (καταφθείρω; слав. «согрешаху», ru «продолжал еще грешить»)."
  3: "ᾠκοδόμησεν τὴν πύλην οἴκου κυρίου τὴν ὑψηλήν — построил ворота дома Господня высокие (ὑψηλός; в 4 Цар 15:35 — «верхние»). ἐν τείχει τοῦ Οφλα — на стене Офлы (Οφλα, オフェル — холм южнее храма; слав. «офли»). ᾠκοδόμησεν πολλά — построил многое."
  4: "πόλεις ἐν ὄρει Ιουδα — города на горе Иудейской. ἐν τοῖς δρυμοῖς — в лесах (δρυμός — «дубрава, чаща»). οἰκήσεις καὶ πύργους — жилища и башни."
  5: "ἐμαχέσατο πρὸς βασιλέα υἱῶν Αμμων — воевал с царём сынов Аммона. κατίσχυσεν ἐπ᾿ αὐτόν — одолел его. ἐδίδουν... κατ᾿ ἐνιαυτὸν ἑκατὸν τάλαντα ἀργυρίου — давали ему каждый год сто талантов серебра. δέκα χιλιάδας κόρων πυροῦ καὶ κριθῶν δέκα χιλιάδας — десять тысяч кор пшеницы и десять тысяч ячменя (κόρος — мера сыпучего; слав. «кор (мер)»). ἐν τῷ πρώτῳ ἔτει καὶ τῷ δευτέρῳ καὶ τῷ τρίτῳ — в первый, второй и третий год."
  6: "κατίσχυσεν Ιωαθαμ — укрепился Иоафам. ὅτι ἡτοίμασεν τὰς ὁδοὺς αὐτοῦ ἔναντι κυρίου — ибо уготовил пути свои пред Господом (ἑτοιμάζω)."
  7: "οἱ λοιποὶ λόγοι Ιωαθαμ καὶ ὁ πόλεμος καὶ αἱ πράξεις αὐτοῦ — прочие слова Иоафама, и война, и деяния его. ἐπὶ βιβλίῳ βασιλέων Ιουδα καὶ Ισραηλ — в книге царей Иудейских и Израильских (слав. «в книзе царей иудиных и израилевых»)."
  8: "В гр. на месте стиха стоит только знак «.» — текст отсутствует (лакуна LXX). Слав. и ru повторяют здесь возрастную формулу 27:1: «Сын двадесяти и пяти лет бяше… шестьнадесть лет царствова во Иерусалиме». По паритету стих дан по слав. (без имени, как и в слав.)."
  9: "ἐκοιμήθη Ιωαθαμ μετὰ τῶν πατέρων αὐτοῦ — почил Иоафам с отцами своими. ἐτάφη ἐν πόλει Δαυιδ — погребён в городе Давида. ἐβασίλευσεν Αχαζ υἱὸς αὐτοῦ ἀντ αὐτοῦ — воцарился Ахаз, сын его, вместо него."
