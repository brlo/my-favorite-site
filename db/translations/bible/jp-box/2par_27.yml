# jp-box, 2-я Паралипоменон, глава 27. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет,
# jp-ni (под авторским правом) источником не был.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 27: Иофам — его правление (1–2), постройки (3–4), победа над Аммоном (5),
# причина силы (6), источники и смерть (7–9).
# Речь — нет. Красного нет.
# Нумерация по gr: 9 стихов; у csl и ru тоже 9.
# Паритет LXX/csl: csl-чтения в основном тексте без 〔…〕; вариант LXX — в notes.
# 27:8 — в гр. на месте стиха стоит только «.» (лакуна LXX); слав. и ru повторяют
# возрастную формулу 27:1. По паритету стих дан по слав. (без имени), в notes — гр.
# 〔…〕 не ставим. Сносок ⟨…⟩ нет: 神殿, 高[たか]い所[ところ], 城壁[じょうへき], 王[おう] уже в корпусе.

