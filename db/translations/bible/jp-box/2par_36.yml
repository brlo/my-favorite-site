# jp-box, 2-я Паралипоменон, глава 36. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru), по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»); ru (Синодальный) —
# только для понимания, не источник. jp-joc в книге нет; jp-ni (под авторским правом)
# не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 36: Иоахаз (1–4), Иоаким (5–8), Иехония (9–10), Седекия и падение
# Иерусалима (11–21), указ Кира (22–23).
# Речь: указ Кира — 「…」 (23). Красного нет.
# Нумерация по gr: 23 стиха. По LXX стихи 36:4 и 36:8 соединяют по несколько
# стихов (вставные номера 3, 4, 4a и 6–8 в тексте модуля), поэтому их содержание
# целиком отнесено к ст. 4 и 8; в csl распределение иное (см. notes). Держимся gr.
# 〔…〕 нет: слав. чтения и добавки внесены в основной текст без скобок (18 «церкве
# Господни»), расхождения с LXX — в notes.
# Сносок ⟨…⟩ нет: 神殿, 主の家, 契約の書, 律法, 預言者, 捕囚, 安息, 宝, 器 уже
# в корпусе.
# jp-ni не использовался.

