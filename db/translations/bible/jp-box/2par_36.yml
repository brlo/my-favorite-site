verses:
  1: "その地[ち]の民[たみ]はヨシヤの子[こ]ヨアハズを連[つ]れて来[き]、油[あぶら]を注[そそ]いで、父[ちち]に代[か]わってエルサレムで王[おう]とした。"
  2: "ヨアハズは二十三歳[にじゅうさんさい]で王[おう]となり、エルサレムで三[みっ]か月[げつ]治[おさ]めた。母[はは]の名[な]はアミタルといい、ロブナのエレミヤの娘[むすめ]であった。"
  3: "彼[かれ]は父[ちち]たちが行[おこな]ったすべてのとおりに、主[しゅ]の前[まえ]に悪[あく]を行[おこな]った。"
  4: "ファラオ・ネカオは彼[かれ]をハマテの地[ち]のリブラで縛[しば]り、エルサレムで王[おう]となれないようにした。こうして王[おう]は彼[かれ]をエジプトへ移[うつ]し、その地[ち]に銀[ぎん]百[ひゃく]タラントと金[きん]一[いち]タラントの貢[みつ]ぎを課[か]した。ファラオ・ネカオは、ヨシヤの子[こ]エルヤキムを父[ちち]ヨシヤに代[か]わってユダの王[おう]とし、その名[な]をヨヤキムと改[あらた]めた。また、その兄弟[きょうだい]ヨアハズを捕[と]らえてエジプトへ連[つ]れて行[い]き、彼はそこで死[し]んだ。彼らは銀と金をファラオに渡[わた]した。そのとき、この地[ち]はファラオの言葉[ことば]に従[したが]って銀を納[おさ]めるために課税[かぜい]され始[はじ]め、民[たみ]はそれぞれ力[ちから]に応[おう]じて、その地の民から銀と金を取り立[た]てて、ファラオ・ネカオに納めた。"
  5: "ヨヤキムは二十五歳[にじゅうごさい]で王[おう]となり、エルサレムで十一年[じゅういちねん]治[おさ]めた。母[はは]の名[な]はゼホラといい、ラマのネリヤの娘[むすめ]であった。彼[かれ]は父[ちち]たちが行[おこな]ったすべてのとおりに、主[しゅ]の前[まえ]に悪[あく]を行[おこな]った。彼[かれ]の日[ひ]々[び]に、バビロンの王[おう]ネブカドネツァルがこの地[ち]に来[き]て、彼は三年間[さんねんかん]、彼に仕[つか]えたが、その後[あと]で彼に背[そむ]いた。"
  6: "主[しゅ]は彼[かれ]らの上[うえ]にカルデア人[じん]、シリアの略奪[りゃくだつ]隊[たい]、モアブ人[じん]の略奪隊、アンモンの子[こ]らの略奪隊、サマリアの略奪隊を遣[つか]わされた。これらのことは、主[しゅ]がそのしもべである預言者[よげんしゃ]たちの手[て]によって語[かた]られた主の言葉[ことば]のとおりに起こった。"
  7: "しかし、主[しゅ]の怒[いか]りはユダに対[たい]して燃[も]え、彼[かれ]をその前[まえ]から退[しりぞ]けようとされた。マナセが行[おこな]ったすべての罪[つみ]のゆえであった。"
  8: "また、ヨヤキムが流[なが]した無実[むじつ]の血[ち]、すなわちエルサレムを無実の血で満[み]たしたことのゆえに、主[しゅ]は彼[かれ]らを滅[ほろ]ぼすことを望[のぞ]まれなかった。バビロンの王[おう]ネブカドネツァルは彼[かれ]のもとへ上[のぼ]って来[き]て、彼を青銅[せいどう]の足枷[あしかせ]で縛[しば]り、バビロンへ連[つ]れて行[い]った。また、主[しゅ]の家[いえ]の器[うつわ]の一部[いちぶ]をバビロンへ運[はこ]び、自分の神殿[しんでん]に置[お]いた。ヨヤキムの残[のこ]りの言葉[ことば]、彼[かれ]が行[おこな]ったすべてのことは、見[み]よ、ユダの王[おう]たちの日誌[にっし]の書[しょ]に記[しる]されているではないか。ヨヤキムは父[ちち]たちとともに眠[ねむ]り、父たちとともにガノザに葬[ほうむ]られた。その子[こ]ヨヤキンが彼[かれ]に代[か]わって王[おう]となった。"
  9: "ヨヤキンは十八歳[じゅうはちさい]で王[おう]となり、エルサレムで三[みっ]か月[げつ]と十日間[とおかかん]治[おさ]めた。彼[かれ]は主[しゅ]の前[まえ]に悪[あく]を行[おこな]った。"
  10: "年[とし]が巡[めぐ]って来[く]ると、ネブカドネツァル王[おう]は人[ひと]を遣[つか]わして彼をバビロンへ連[つ]れて行[い]かせ、主[しゅ]の家[いえ]の望[のぞ]ましい器[うつわ]もともに運[はこ]ばせた。そして、彼[かれ]の父[ちち]の兄弟[きょうだい]セデキヤをユダとエルサレムの王[おう]とした。"
  11: "セデキヤは二十一歳[にじゅういっさい]で王[おう]となり、エルサレムで十一年[じゅういちねん]治[おさ]めた。"
  12: "彼[かれ]は自分の神[かみ]である主[しゅ]の前[まえ]に悪[あく]を行[おこな]い、主[しゅ]の口[くち]から語[かた]った預言者[よげんしゃ]エレミヤの前[まえ]で身[み]を低[ひく]くしなかった。"
  13: "彼[かれ]はネブカドネツァル王[おう]との約[やく]束[そく]を破[やぶ]り、神[かみ]によって彼[かれ]に誓[ちか]わせた誓[ちか]いを捨[す]てた。そして、うなじを固[かた]くし、心[こころ]を強[かた]くして、イスラエルの神[かみ]である主[しゅ]に立[た]ち返[かえ]らなかった。"
  14: "また、ユダのすべての高官[こうかん]たち、祭司[さいし]たち、その地[ち]の民[たみ]は、諸国民[しょこくみん]の忌[い]まわしい行[おこな]いにならって背[そむ]きを重[かさ]ね、エルサレムにある主[しゅ]の家[いえ]を汚[けが]した。"
  15: "彼[かれ]らの父祖[ふそ]の神[かみ]である主[しゅ]は、朝早[あさはや]くから絶[た]えず使[つか]いを遣[つか]わして、預言者[よげんしゃ]たちの手[て]によって彼[かれ]らに語[かた]られた。自分の民[たみ]とその聖所[せいしょ]を惜[お]しんでおられたからである。"
  16: "しかし、彼[かれ]らはその使[つか]いたちを嘲[あざけ]り、その言葉[ことば]を軽[かろ]んじ、その預言者[よげんしゃ]たちを笑[わら]い物[もの]にした。ついに主[しゅ]の怒[いか]りがその民[たみ]の上[うえ]に上[のぼ]り、もはや癒[いや]すすべがなくなった。"
  17: "そこで主[しゅ]はカルデア人[じん]の王[おう]を彼[かれ]らの上[うえ]に連[つ]れて来[こ]られた。王はその聖所[せいしょ]の家[いえ]で、彼らの若者[わかもの]たちを剣[つるぎ]で殺[ころ]した。彼はセデキヤを惜[お]しまず、彼らの処女[しょじょ]たちをあわれまず、その長老[ちょうろう]たちを連[つ]れて行[い]った。すべてを彼[かれ]の手[て]に渡[わた]された。"
  18: "そして、神[かみ]の家[いえ]の器[うつわ]のすべて、大[おお]きいものも小[ちい]さいものも、神殿[しんでん]の宝[たから]も、王[おう]と高官[こうかん]たちのすべての宝も、ことごとくバビロンへ運[はこ]び込[こ]んだ。"
  19: "彼[かれ]らは主[しゅ]の家[いえ]を焼[や]き、エルサレムの城壁[じょうへき]を取[と]り壊[こわ]し、その塔[とう]を火[ひ]で焼[や]き、すべての美[うつく]しい器[うつわ]を滅[ほろ]ぼした。"
  20: "彼は残[のこ]った者[もの]たちを捕囚[ほしゅう]としてバビロンへ移[うつ]した。彼らはメディアの王国[おうこく]の時代[じだい]まで、彼[かれ]とその子[こ]らに仕[つか]える奴隷[どれい]となった。"
  21: "これは、主[しゅ]がエレミヤの口[くち]によって語[かた]られた言葉[ことば]が成就[じょうじゅ]するためであった。すなわち、この地[ち]がその安息[あんそく]の年[とし]を受[う]け入[い]れて安[やす]らうまで、荒廃[こうはい]のすべての日[ひ]々[び]に、七十年[ななじゅうねん]が満[み]ちるまで安[やす]らったのである。"
  22: "ペルシアの王[おう]クロスの第一年[だいいちねん]、主[しゅ]がエレミヤの口[くち]によって語[かた]られた言葉[ことば]が成就[じょうじゅ]した後[あと]、主[しゅ]はペルシアの王クロスの霊[れい]を奮[ふる]い起[おこ]させた。クロスは自分の王国[おうこく]のすべてに、書[しょ]をもって触[ふ]れを出[だ]させて言[い]った。"
  23: "「ペルシアの王[おう]クロスはこう言[い]う。天[てん]の神[かみ]である主[しゅ]は、地[ち]のすべての王国[おうこく]をわたしに与[あた]え、ユダにあるエルサレムに、ご自分[じぶん]のために家[いえ]を建[た]てるようわたしに命[めい]じられた。あなたがたのうち、その民[たみ]に属[ぞく]する者[もの]はだれでも、その神[かみ]がその人[ひと]とともにいるように。上[のぼ]って行[い]くがよい。」"

notes:
  1: "ἔλαβεν ὁ λαὸς τῆς γῆς — взял народ земли; Ιωαχαζ υἱὸν Ιωσιου — Иоахаза, сына Иосии (ヨアハズ); ἔχρισαν — помазали (χρίω; 油を注ぐ); κατέστησαν εἰς βασιλέα — поставили царём; ἀντὶ τοῦ πατρός — вместо отца; ср. 4 Цар 23:30."
  2: "υἱὸς εἴκοσι καὶ τριῶν ἐτῶν — «сын двадцати трёх лет»; τρίμηνον — три месяца; 2a — вставной номер в тексте модуля: ὄνομα τῆς μητρὸς αὐτοῦ Αμιταλ θυγάτηρ Ιερεμιου ἐκ Λοβενα — имя матери Амитал, дочь Иеремии, из Ловны (слав. «амитал, дщерь иеремиина от ловны»; в 4 Цар 23:31 по МТ — Хамуталь, дочь Еремии из Ливны). В csl ст. 2 включает и 2a, и «сотвори лукавое», и начало пленения."
  3: "ἐποίησεν τὸ πονηρόν — делал злое; κατὰ πάντα ἃ ἐποίησαν οἱ πατέρες αὐτοῦ — по всему, что делали отцы его; ср. 4 Цар 23:32. В csl этот стих входит в ст. 2 (сдвиг нумерации)."
  4: "Стих по LXX соединяет 36:4 и вставные 3, 4, 4a (номера в тексте модуля): ἔδησεν αὐτὸν Φαραω Νεχαω — связал его фараон Нехао; ἐν Δεβλαθα ἐν γῇ Εμαθ — в Деблафе, в земле Емаф (в тексте ハマテの地のリブラ: リブラ — как 4 Цар 25:6, ハマテ — как 4 Цар 23:33; слав. «в девлафе в земли ефамли»); τοῦ μὴ βασιλεύειν αὐτὸν ἐν Ιερουσαλημ — чтобы не царствовал в Иерусалиме; μετήγαγεν εἰς Αἴγυπτον — перевёл в Египет; ἐπέβαλεν φόρον — наложил подать (φόρος, 貢ぎ); ἑκατὸν τάλαντα ἀργυρίου καὶ τάλαντον χρυσίου — сто талантов серебра и талант золота; κατέστησεν τὸν Ελιακιμ — поставил Елиакима; μετέστρεψεν τὸ ὄνομα αὐτοῦ Ιωακιμ — переменил имя его на Иоаким (ヨヤキム); ἔλαβεν … εἰσήγαγεν εἰς Αἴγυπτον — взял и ввёл в Египет; ἀπέθανεν ἐκεῖ — умер там; τὸ ἀργύριον καὶ τὸ χρυσίον ἔδωκαν τῷ Φαραω — серебро и золото отдали фараону; ἐπὶ στόμα Φαραω — «на уста фараона», т. е. по слову, в казну фараона; ἕκαστος κατὰ δύναμιν ἀπῄτει — каждый по силе требовал (ἀπαιτέω)."
  5: "Υἱὸς εἴκοσι καὶ πέντε ἐτῶν — двадцати пяти лет; ἕνδεκα ἔτη — одиннадцать лет; Ζεχωρα θυγάτηρ Νηριου ἐκ Ραμα — Зехора, дочь Нерии, из Рамы (слав. «зехора, дщерь нириева от рамы»); ἐποίησεν τὸ πονηρόν — делал злое; 5a — вставной номер: ἐν ταῖς ἡμέραις αὐτοῦ ἦλθεν Ναβουχοδονοσορ — в дни его пришёл Навуходоносор; ἦν αὐτῷ δουλεύων τρία ἔτη — служил ему три года; ἀπέστη ἀπ᾿ αὐτοῦ — отступил от него. В csl ст. 5 включает и 5a, и ст. 6–7 (послание халдеев, гнев Господень)."
  6: "ἀπέστειλεν κύριος ἐπ᾿ αὐτοὺς τοὺς Χαλδαίους — послал Господь на них халдеев; λῃστήρια Σύρων — разбойничьи отряды Сирийцев (λῃστήριον); λῃστήρια Μωαβιτῶν καὶ υἱῶν Αμμων καὶ τῆς Σαμαρείας — Моавитян, сынов Аммона и Самарии; ἀπέστησαν μετὰ τὸν λόγον τοῦτον — «отступили после слова сего» (ἀφίστημι; слав. «по словеси сем отступиша»), вероятно, передаёт евр. «слово» иначе; по смыслу — совершилось по слову Господню; κατὰ τὸν λόγον κυρίου ἐν χειρὶ τῶν παίδων αὐτοῦ τῶν προφητῶν — по слову Господню рукою рабов Его пророков."
  7: "πλὴν θυμὸς κυρίου ἦν ἐπὶ Ιουδαν — но гнев Господень был на Иуду; τοῦ ἀποστῆσαι αὐτὸν ἀπὸ προσώπου αὐτοῦ — чтобы отставить его от лица Своего; διὰ τὰς ἁμαρτίας Μανασση — ради грехов Манассии; ἐν πᾶσιν, οἷς ἐποίησεν — во всём, что он сделал. В csl — в ст. 5."
  8: "Стих по LXX соединяет 36:8 и вставные 6–8 (номера в тексте модуля): ἐν αἵματι ἀθῴῳ, ᾧ ἐξέχεεν Ιωακιμ — за кровь невинную, которую пролил Иоаким (ἐκχέω); ἔπλησεν τὴν Ιερουσαλημ αἵματος ἀθῴου — наполнил Иерусалим кровью невинной; οὐκ ἠθέλησεν κύριος ἐξολεθρεῦσαι αὐτούς — не восхотел Господь истребить их; ἀνέβη ἐπ᾿ αὐτὸν Ναβουχοδονοσορ — взошёл на него Навуходоносор; ἔδησεν ἐν χαλκαῖς πέδαις — связал медными оковами (πέδη); ἀπήγαγεν εἰς Βαβυλῶνα — отвёл в Вавилон; μέρος τῶν σκευῶν οἴκου κυρίου — часть сосудов дома Господня (σκεῦος); ἔθηκεν ἐν τῷ ναῷ αὐτοῦ — поставил в храме своём (ναός); τὰ λοιπὰ τῶν λόγων Ιωακιμ — прочее слов Иоакима; ἐπὶ βιβλίῳ λόγων τῶν ἡμερῶν — в книге слов дней, летописи (日誌の書); ἐκοιμήθη μετὰ τῶν πατέρων — почил с отцами; ἐτάφη ἐν Γανοζα — погребён в Ганозе (слав. «в ганозане»); ἐβασίλευσεν Ιεχονιας — воцарился Иехония (ヨヤキン)."
  9: "Υἱὸς ὀκτωκαίδεκα ἐτῶν — восемнадцати лет (в 4 Цар 24:8 — то же); τρίμηνον καὶ δέκα ἡμέρας — три месяца и десять дней; ἐποίησεν τὸ πονηρόν — делал злое."
  10: "ἐπιστρέφοντος τοῦ ἐνιαυτοῦ — «при возвращении года» (слав. «егда лету круг вращашеся»); ἀπέστειλεν — послал; εἰσήνεγκεν αὐτὸν εἰς Βαβυλῶνα — ввёл его в Вавилон; μετὰ τῶν σκευῶν τῶν ἐπιθυμητῶν — с вожделенными сосудами (слав. «с предрагими сосуды»); ἐβασίλευσεν Σεδεκιαν ἀδελφὸν τοῦ πατρὸς αὐτοῦ — воцарил Седекию, брата отца его (т. е. дядю; セデキヤ); ἐπὶ Ιουδαν καὶ Ιερουσαλημ — над Иудой и Иерусалимом."
  11: "Ἐτῶν εἴκοσι ἑνὸς — двадцати одного года; ἕνδεκα ἔτη — одиннадцать лет; ср. 4 Цар 24:18."
  12: "ἐποίησεν τὸ πονηρὸν ἐνώπιον κυρίου θεοῦ αὐτοῦ — делал злое пред Господом Богом своим; οὐκ ἐνετράπη ἀπὸ προσώπου Ιερεμιου — не устыдился пред лицом Иеремии (ἐντρέπω); τοῦ προφήτου καὶ ἐκ στόματος κυρίου — пророка и из уст Господних (слав. «от уст Господних»)."
  13: "ἐν τῷ τὰ πρὸς τὸν βασιλέα Ναβουχοδονοσορ ἀθετῆσαι — в том, что отверг [верность] царю Навуходоносору (ἀθετέω); ἃ ὥρκισεν αὐτὸν κατὰ τοῦ θεοῦ — которыми заклял его пред Богом (ὁρκίζω); ἐσκλήρυνεν τὸν τράχηλον — ожесточил шею (σκληρύνω, τράχηλος; слав. «выю»); τὴν καρδίαν αὐτοῦ κατίσχυσεν — укрепил, ожесточил сердце своё; τοῦ μὴ ἐπιστρέψαι — чтобы не обратиться."
  14: "οἱ ἔνδοξοι Ιουδα — знатные Иуды (ἔνδοξος; слав. «славнии»); ἐπλήθυναν τοῦ ἀθετῆσαι ἀθετήματα — умножали преступления (ἀθέτημα); βδελυγμάτων ἐθνῶν — мерзостей народов; ἐμίαναν τὸν οἶκον κυρίου — осквернили дом Господень (μιαίνω)."
  15: "ἐξαπέστειλεν … ἐν χειρὶ προφητῶν — посылал рукою пророков; ὀρθρίζων καὶ ἀποστέλλων — «вставая рано и посылая» (ὀρθρίζω; слав. «утренюя и посылая»); τοὺς ἀγγέλους αὐτοῦ — посланников Своих (ἄγγελος); ἦν φειδόμενος — щадил (φείδομαι); τοῦ λαοῦ αὐτοῦ καὶ τοῦ ἁγιάσματος αὐτοῦ — народа Своего и святилища Своего (ἁγίασμα). Слав. в конце добавляет «и тии поношаху послом Божиим» (начало ст. 16) — в тексте отнесено к 16."
  16: "μυκτηρίζοντες — издеваясь (μυκτηρίζω); ἐξουδενοῦντες — уничижая (ἐξουδενόω); ἐμπαίζοντες ἐν τοῖς προφήταις — насмехаясь над пророками (ἐμπαίζω); ἕως ἀνέβη ὁ θυμὸς κυρίου ἐν τῷ λαῷ αὐτοῦ — доколе не взошёл гнев Господень на народ Его; ἕως οὐκ ἦν ἴαμα — доколе не было исцеления (ἴαμα; слав. «не бысть изцеления»). В csl нет издевательства над посланниками (ἀγγέλους) — только «уничижаху словеса»."
  17: "ἤγαγεν ἐπ᾿ αὐτοὺς βασιλέα Χαλδαίων — навёл на них царя Халдеев; ἀπέκτεινεν τοὺς νεανίσκους — умертвил юношей (νεανίσκος; слав. «младенцы» — иное понимание); ἐν ῥομφαίᾳ — мечом (ῥομφαία); ἐν οἴκῳ ἁγιάσματος αὐτοῦ — в доме святыни Его; οὐκ ἐφείσατο τοῦ Σεδεκιου — не пощадил Седекии; τὰς παρθένους οὐκ ἠλέησαν — над девами не смилостивились (ἐλεάω); τοὺς πρεσβυτέρους ἀπήγαγον — старцев увели; τὰ πάντα παρέδωκεν ἐν χερσὶν αὐτῶν — всё предал в руки их."
  18: "τὰ σκεύη οἴκου θεοῦ τὰ μεγάλα καὶ τὰ μικρά — сосуды дома Божия большие и малые; τοὺς θησαυρούς — сокровища; τοὺς θησαυροὺς βασιλέως καὶ μεγιστάνων — сокровища царя и вельмож (μεγιστάν); εἰσήνεγκεν εἰς Βαβυλῶνα — внёс в Вавилон. В csl добавлено «церкве Господни» (сокровища дома Господня) — по паритету 神殿の宝."
  19: "ἐνέπρησεν τὸν οἶκον κυρίου — сжёг дом Господень (ἐμπίμπρημι); κατέσκαψεν τὸ τεῖχος — разрушил стену (κατασκάπτω); τὰς βάρεις αὐτῆς ἐνέπρησεν ἐν πυρί — башни, укрепления её сжёг огнём (βᾶρις; слав. «столпы»); πᾶν σκεῦος ὡραῖον εἰς ἀφανισμόν — всякий сосуд прекрасный в истребление (ὡραῖος; слав. «драгий»)."
  20: "ἀπῴκισεν τοὺς καταλοίπους — переселил оставшихся (ἀποικίζω); ἦσαν αὐτῷ καὶ τοῖς υἱοῖς αὐτοῦ εἰς δούλους — были ему и сынам его в рабов; ἕως βασιλείας Μήδων — до царства Мидийского."
  21: "τοῦ πληρωθῆναι λόγον κυρίου — чтобы исполнилось слово Господне; διὰ στόματος Ιερεμιου — устами Иеремии; ἕως τοῦ προσδέξασθαι τὴν γῆν τὰ σάββατα αὐτῆς — доколе земля не примет суббот своих (προσδέχομαι); σαββατίσαι — субботствовать, отдыхать (σαββατίζω); πάσας τὰς ἡμέρας τῆς ἐρημώσεως — во все дни запустения (ἐρήμωσις); εἰς συμπλήρωσιν ἐτῶν ἑβδομήκοντα — до исполнения семидесяти лет."
  22: "Ἔτους πρώτου Κύρου — в первый год Кира (Κῦρος, クロス); μετὰ τὸ πληρωθῆναι ῥῆμα κυρίου — после исполнения слова Господня; ἐξήγειρεν κύριος τὸ πνεῦμα Κύρου — возбудил Господь дух Кира (ἐξεγείρω); παρήγγειλεν κηρύξαι — повелел объявить (παραγγέλλω, κηρύσσω); ἐν πάσῃ τῇ βασιλείᾳ αὐτοῦ — по всему царству его; ἐν γραπτῷ — письменно; λέγων — «говоря», вводит указ 23."
  23: "Τάδε λέγει Κῦρος — так говорит Кир; Πάσας τὰς βασιλείας τῆς γῆς ἔδωκέν μοι κύριος ὁ θεὸς τοῦ οὐρανοῦ — все царства земли дал мне Господь Бог небесный; ἐνετείλατό μοι οἰκοδομῆσαι αὐτῷ οἶκον — повелел мне построить Ему дом; ἐν Ιερουσαλημ ἐν τῇ Ιουδαίᾳ — в Иерусалиме, что в Иудее; τίς ἐξ ὑμῶν ἐκ παντὸς τοῦ λαοῦ αὐτοῦ — кто из вас из всего народа Его; ἔσται ὁ θεὸς αὐτοῦ μετ᾿ αὐτοῦ — да будет Бог его с ним; ἀναβήτω — пусть идёт (ἀναβαίνω)."
