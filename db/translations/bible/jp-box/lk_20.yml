verses:
  1: "ある日[ひ]、イエスが神殿[しんでん]で民[たみ]を教[おし]え、福音[ふくいん]を宣[の]べ伝[つた]えておられたとき、祭司長[さいしちょう]たちと律法学者[りっぽうがくしゃ]たちが、長老[ちょうろう]たちと一緒[いっしょ]に近[ちか]づいて来[き]て、"
  2: "言[い]った。「わたしたちに言[い]ってください。あなたは何[なん]の権威[けんい]によってこのようなことをしているのか。その権威[けんい]をあなたに与[あた]えたのはだれか。」"
  3: "イエスはお答[こた]えになった。「<j>わたしもあなたがたに一言[ひとこと]尋[たず]ねよう。わたしに答[こた]えなさい。</j>"
  4: "<j>ヨハネの洗礼[せんれい]は、天[てん]から出[で]たものか、それとも人[ひと]から出[で]たものか。</j>」"
  5: "彼[かれ]らは互[たが]いに論[ろん]じ合[あ]って言[い]った。「もし『天[てん]から』と言[い]えば、『では、なぜ彼[かれ]を信[しん]じなかったのか』と言[い]うだろう。"
  6: "だが、『人[ひと]から』と言[い]えば、民[たみ]が皆[みな]、わたしたちを石[いし]で打[う]ち殺[ころ]すだろう。民[たみ]はヨハネを預言者[よげんしゃ]だと確[かく]信[しん]しているからだ。」"
  7: "そこで彼[かれ]らは、どこからなのか知[し]らないと答[こた]えた。"
  8: "イエスは言[い]われた。「<j>わたしも、何[なん]の権威[けんい]によってこのようなことをしているのかを、あなたがたに言[い]わない。</j>」"
  9: "イエスは民[たみ]にこのたとえを語[かた]り始[はじ]められた。「<j>ある人[ひと]がぶどう園[えん]を植[う]え、それを農夫[のうふ]たちに貸[か]して、長[なが]い間[あいだ]、旅[たび]に出[で]た。</j>"
  10: "<j>季節[きせつ]になると、ぶどう園[えん]の収穫[しゅうかく]を農夫[のうふ]たちから受[う]け取[と]るために、僕[しもべ]を遣[つか]わした。ところが、農夫[のうふ]たちはその僕[しもべ]を打[う]ちたたき、何[なに]も持[も]たせずに帰[かえ]らせた。</j>"
  11: "<j>そこで、もう一人[ひとり]別[べつ]の僕[しもべ]を遣[つか]わしたが、彼[かれ]らはその僕[しもべ]をも打[う]ちたたき、辱[はずかし]めて、何[なに]も持[も]たせずに帰[かえ]らせた。</j>"
  12: "<j>さらに三人目[さんにんめ]の僕[しもべ]を遣[つか]わすと、彼[かれ]らはこの僕[しもべ]にも傷[きず]を負[お]わせて、追[お]い出[だ]した。</j>"
  13: "<j>ぶどう園[えん]の主人[しゅじん]は言[い]った。『どうしようか。わたしの愛[あい]する息子[むすこ]を遣[つか]わそう。おそらく、この子[こ]なら敬[うやま]うだろう。』</j>"
  14: "<j>しかし、農夫[のうふ]たちはその子[こ]を見[み]ると、互[たが]いに相談[そうだん]して言[い]った。『あれは跡取[あとと]りだ。さあ、あれを殺[ころ]してしまおう。そうすれば、遺産[いさん]はわたしたちのものになる。』</j>"
  15: "<j>そこで彼[かれ]らはその子[こ]をぶどう園[えん]の外[そと]に追[お]い出[だ]して殺[ころ]した。すると、ぶどう園[えん]の主人[しゅじん]は彼[かれ]らをどうするだろうか。</j>"
  16: "<j>彼[かれ]はやって来[き]て、この農夫[のうふ]たちを滅[ほろ]ぼし、ぶどう園[えん]をほかの人[ひと]々[びと]に与[あた]えるだろう。</j>」これを聞[き]いて人々[ひとびと]は言[い]った。「決[けっ]して、そのようなことはあってはなりません。」"
  17: "イエスは彼[かれ]らに目[め]を注[そそ]いで言[い]われた。「<j>では、こう書[か]いてあるのはどういうことか。『家[いえ]を建[た]てる者[もの]たちが捨[す]てた石[いし]、それが隅[すみ]の親石[おやいし]となった。』</j>"
  18: "<j>その石[いし]の上[うえ]に倒[たお]れる者[もの]は砕[くだ]かれ、その石[いし]が落[お]ちて来[く]る者[もの]は粉[こな]々[ごな]に砕[くだ]かれる。</j>」"
  19: "律法学者[りっぽうがくしゃ]たちと祭司長[さいしちょう]たちは、その時[とき]すぐにでもイエスに手[て]をかけたかったが、民[たみ]を恐[おそ]れた。イエスが自分[じぶん]たちを指[さ]してこのたとえを語[かた]られたのが分[わ]かったからである。"
  20: "彼[かれ]らは機会[きかい]をうかがい、正[ただ]しい者[もの]を装[よそお]った間[かん]者[じゃ]たちを遣[つか]わして、イエスの言葉[ことば]じりに捕[と]らえ、総督[そうとく]の支配[しはい]と権限[けんげん]に引[ひ]き渡[わた]そうとした。"
  21: "彼[かれ]らはイエスに尋[たず]ねた。「先生[せんせい]、わたしたちは、あなたが正[ただ]しく語[かた]り、教[おし]え、だれの顔色[かおいろ]もうかがわず、神[かみ]の道[みち]を真理[しんり]をもって教[おし]えておられることを知[し]っています。"
  22: "カエサルに税金[ぜいきん]を納[おさ]めるのは、わたしたちに許[ゆる]されているのでしょうか、いないのでしょうか。」"
  23: "イエスは彼[かれ]らの悪[あく]だくみを見抜[みぬ]いて言[い]われた。「<j>〔なぜ、わたしを試[こころ]みるのか。〕</j>"
  24: "<j>デナリオン銀貨[ぎんか]をわたしに見[み]せなさい。この肖像[しょうぞう]と銘[めい]は、だれのものか。</j>」彼[かれ]らは答[こた]えた。「カエサルのです。」"
  25: "イエスは言[い]われた。「<j>ならば、カエサルのものはカエサルに、神[かみ]のものは神[かみ]に返[かえ]しなさい。</j>」"
  26: "彼[かれ]らは民[たみ]の前[まえ]でイエスの言葉[ことば]を捕[と]らえることができず、その答[こた]えに驚[おどろ]いて、黙[だま]ってしまった。"
  27: "復活[ふっかつ]はないと言[い]うサドカイ派[は]の人々[ひとびと]の何人[なんにん]かが近[ちか]づいて来[き]て、イエスに問[と]いかけた。"
  28: "「先生[せんせい]、モーセはわたしたちのためにこう書[しる]しています。『もし人[ひと]の兄弟[きょうだい]が妻[つま]を残[のこ]して子[こ]なく死[し]んだなら、その兄弟[きょうだい]はその妻[つま]をめとり、兄弟[きょうだい]のために子孫[ししゅう]を起[お]こすべきである』と。"
  29: "そこで、七人[しちにん]の兄弟[きょうだい]がいました。最初[さいしょ]の者[もの]が妻[つま]をめとり、子[こ]なくして死[し]にました。"
  30: "二人目[ふたりめ]も彼女[かのじょ]をめとり、子[こ]なくして死[し]にました。"
  31: "三人目[さんにんめ]も彼女[かのじょ]をめとり、七人[しちにん]も同[おな]じように、子[こ]を残[のこ]さずに死[し]にました。"
  32: "そののち、女[おんな]も死[し]にました。"
  33: "それでは、復活[ふっかつ]のとき、この女[おんな]は七人[しちにん]のうちだれの妻[つま]になるのでしょうか。七人[しちにん]とも彼女[かのじょ]を妻[つま]にしたのですから。」"
  34: "イエスは言[い]われた。「<j>この世[よ]の子[こ]らはめとり、嫁[とつ]ぐ。</j>"
  35: "<j>しかし、かの世[よ]と、死[し]んだ者[もの]たちの中[なか]からの復活[ふっかつ]とにあずかるのにふさわしい者[もの]とされた人[ひと]々[びと]は、めとることも嫁[とつ]ぐこともない。</j>"
  36: "<j>彼[かれ]らはもはや死[し]ぬこともできない。天使[てんし]たちに等[ひと]しい者[もの]となり、復活[ふっかつ]の子[こ]として神[かみ]の子[こ]なのである。</j>"
  37: "<j>死[し]んだ者[もの]たちが復活[ふっかつ]することは、モーセも柴[しば]の箇所[かしょ]で示[しめ]している。すなわち、主[しゅ]を『アブラハムの神[かみ]、イサクの神[かみ]、ヤコブの神[かみ]』と呼[よ]んでいて、</j>"
  38: "<j>神[かみ]は死[し]んだ者[もの]の神[かみ]ではなく、生[い]きている者[もの]の神[かみ]である。神[かみ]にとっては、すべての者[もの]が生[い]きているからである。</j>」"
  39: "律法学者[りっぽうがくしゃ]たちの何人[なんにん]かが答[こた]えて言[い]った。「先生[せんせい]、よくぞ言[い]ってくださいました。」"
  40: "もはや、あえてイエスに問[と]う者[もの]はいなかった。"
  41: "イエスは彼[かれ]らに言[い]われた。「<j>どうして、キリストをダビデの子[こ]と言[い]うのか。</j>"
  42: "<j>ダビデ自身[じしん]が詩篇[しへん]の書[しょ]にこう言[い]っている。『主[しゅ]はわたしの主[しゅ]に言[い]われた。「わたしの右[みぎ]の座[ざ]に着[つ]きなさい。</j>"
  43: "<j>わたしがあなたの敵[てき]を、あなたの足[あし]の下[した]に置[お]くまで。」と。』</j>"
  44: "<j>ダビデがキリストを主[しゅ]と呼[よ]んでいるのなら、どうしてキリストがその子[こ]であり得[え]るのか。</j>」"
  45: "民[たみ]が皆[みな]聞[き]いている前[まえ]で、イエスは弟子[でし]たちに言[い]われた。"
  46: "「<j>律法学者[りっぽうがくしゃ]たちに気[き]をつけなさい。彼[かれ]らは長[なが]い衣[ころも]を着[き]て歩[ある]くことを好[この]み、広場[ひろば]での挨拶[あいさつ]を好[この]み、会堂[かいどう]の上座[かみざ]、宴会[えんかい]の上席[じょうせき]を好[この]む。</j>"
  47: "<j>彼[かれ]らはやもめの家[いえ]を食[く]い尽[く]し、見[み]せかけの長[なが]い祈[いの]りをする。この者[もの]たちは、いっそう重[おも]い裁[さば]きを受[う]ける。</j>」"

notes:
  1: "ἐν μιᾷ τῶν ἡμερῶν — «в один из дней»; ある日. У Луки сцена открывается иначе, чем у Мк 11:27 (там «пришли в Иерусалим»)."
  2: "По-гречески сначала λέγοντες πρός αὐτόν, затем вопрос; в японском введено 言った перед «». ἐξουσία — 権威, как в Мк 11:28."
  3: "Ἐρωτήσω ὑμᾶς κἀγὼ λόγον — буквально «спрошу и Я вас слово»; 一言尋ねよう."
  5: "συνελογίσαντο πρὸς ἑαυτούς — «рассуждали между собой»; 互いに論じ合って. Вложенные слова — 『』."
  6: "καταλιθάσει — «побьёт камнями»; 石で打ち殺す. πεπεισμένος γάρ ἐστιν — «ибо убеждён»."
  9: "Ἄνθρωπός τις — «некий человек»; ἀπεδήμησεν χρόνους ἱκανούς — «отправился в чужую страну на долгое время» (у Мк 12:1 просто «отправился», у Мф 21:33 — «уехал»). Деталь Луки сохранена."
  10: "ἵνα ἀπὸ τοῦ καρποῦ… δώσουσιν — «чтобы дали от плода»; форма будущего в значении повеления, передано 受け取るために. δείραντες — «избив»."
  16: "οἱ ἀκούσαντες — «слышавшие»; Μὴ γένοιτο — «да не будет», возглас ужаса; 決して、そのようなことはあってはなりません."
  18: "У Луки этого стиха нет у Марка и Матфея; συνθλασθήσεται — «разобьётся», λικμήσει — «развеет, как пыль»; передано 砕かれる / 粉々に砕かれる, чтобы различие глаголов не стёрлось."
  19: "ἐν αὐτῇ τῇ ὥρᾳ — «в тот самый час»; その時すぐにでも. ἔγνωσαν γὰρ ὅτι πρὸς αὐτοὺς εἶπεν — «поняли, что про них сказал»."
  20: "ἐγκαθέτους — «подосланных, сидевших в засаде»; 間者. ὑποκρινομένους ἑαυτοὺς δικαίους εἶναι — «представляющих себя праведными». ἡγεμών — прокуратор, 総督. τῇ ἀρχῇ καὶ τῇ ἐξουσίᾳ — «начальству и власти»."
  22: "Καῖσαρ — カエサル, как в Мк 12:14–17 и Лк 23:2; в Мф 22:17–21 стоит カエサル (расхождение в корпусе, вынесено на ревью). φόρος — подушная подать, 税金."
  23: "τί με πειράζετε в критической базе отсутствует (там только κατανοήσας… εἶπεν πρὸς αὐτούς); Церковь (Елизаветинская «что Мя искушаете», jp-joc 何ぞ我を試みる) читает — 〔…〕."
  24: "δηνάριον — динарий; сноски нет, слово объяснено в Мк 6:37. ἐπιγραφή — 銘."
  26: "ἐπιλαβέσθαι αὐτοῦ ῥήματος — «ухватить Его за слово»; ἐναντίον τοῦ λαοῦ — «перед народом»."
  27: "Σαδδουκαῖοι — сноска уже стоит в Мф 3:7. οἱ ἀντιλέγοντες ἀνάστασιν μὴ εἶναι — «противящиеся [учению], что нет воскресения»; 復活はないと言う."
  30: "В критической базе стих — только καὶ ὁ δεύτερος («и второй»); Церковь (Елизаветинская «и второй поя ю, и той умре безчаден», jp-joc) читает полностью — 〔…〕."
  31: "ὡσαύτως δὲ καὶ οἱ ἑπτά — «подобно и семь»; 七人も同じように."
  34: "οἱ υἱοὶ τοῦ αἰῶνος τούτου — «сыны века сего»; この世の子ら."
  35: "καταξιωθέντες τυχεῖν — «удостоившиеся достигнуть»; τῆς ἀναστάσεως τῆς ἐκ νεκρῶν — «воскресения из мёртвых»."
  36: "ἰσάγγελοι — «равные ангелам»; 天使たちに等しい者. τῆς ἀναστάσεως υἱοὶ ὄντες — «будучи сынами воскресения»."
  37: "ἐπὶ τῆς βάτου — «при кусте» (Исх 3:6); 柴の箇所, как в Мк 12:26. ὡς λέγει κύριον τὸν θεόν — «когда называет Господом Богом»."
  38: "πάντες γὰρ αὐτῷ ζῶσιν — «ибо все для Него живы»; 神にとっては、すべての者が生きている."
  41: "Χριστός — キリスト, не メシア (калька ハリストス)."
  42: "Пс 109:1 (Синод. 110:1); ἐν βίβλῳ ψαλμῶν — «в книге псалмов», 詩篇の書. ὑποπόδιον τῶν ποδῶν σου передано あなたの足の下に置く, как в Мф 22:44 (в Мк 12:36 — 足台)."
  44: "καὶ πῶς αὐτοῦ υἱός ἐστιν — «и как Он сын его»; どうしてキリストがその子であり得るのか."
  46: "στολαί — длинные парадные одежды; 長い衣. πρωτοκαθεδρία / πρωτοκλισία — 上座 / 上席, как в Мк 12:39."
  47: "κατεσθίουσιν τὰς οἰκίας — «поедают домы»; πρόφασις — «предлог»; 見せかけの. περισσότερον κρίμα — «большее осуждение»."
