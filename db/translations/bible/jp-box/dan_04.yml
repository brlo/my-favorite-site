# jp-box, Даниил, глава 4. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной: 34 стиха. В gr-lxx-byz эта глава — 4:1–37,
# наш стих = gr стих + 3 (наш 4:1 = gr 4:4 … наш 4:34 = gr 4:37).
# «Точки» gr (4:6,7,8,9,11,35) = наш 4:3,4,5,6,8,32: в модуле на месте стиха «.»,
# переведено по слав. (csl-ru) без 〔…〕, в notes отмечено. Содержание gr 4:1–3
# (указ Навуходоносора) — это наш 3:98–100, здесь не дублируется.
# Язык — современный 常体; порядок членов и клаузы — по греческому/слав.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: письмо царя. 1–3 царь в покое и повеление созвать мудрецов;
# 4–6 мудрецы не смогли, вошёл Даниил (Валтасар); 7–9 сон о дереве до небес;
# 10–14 бодрый и святый и приговор: срубить, корень оставить;
# 15 конец речи царя; 16 Даниил в изумлении, ответ «господине»; 17–24 толкование:
# дерево — царь, отлучение, семь времён, совет милостыней; 25–27 исполнение:
# двенадцать месяцев, «несть ли сей вавилон великий», глас с неба; 28–30 безумие,
# волосы как у льва; 31–34 возвращение разума, «Царя небеснаго хвалю».
# Голоса: 4:6–15 — речь царя в 「…」 (в 11–14 слова бодраго — 『…』);
# 4:16 — краткая речь царя 「…」 и ответ Даниила 「…」, идущий до конца 24
# (в 20 и 23 внутри — 『…』, повтор слов бодраго и «оставите корение»);
# 4:27 — слова царя 「…»; 4:28–29 — глас с неба 「…». 4:1–5, 25–26, 30–34 —
# авторское повествование от первого лица, без кавычек.
# Термины: 知者[ちしゃ] — σοφοί; 呪術師[じゅじゅし] — ἐπαοιδοί; 賢者[けんじゃ] — μάγοι;
# 占[うらな]い師[し] — γαζαρηνοί; カルデア人[じん] — Χαλδαῖοι; 解[と]き明[あ]かし — σύγκρισις;
# 夢[ゆめ]/幻[まぼろし] — ἐνύπνιον/ὅρασις; 目覚[めざ]めている聖[せい]なる者[もの] — «бодрый и святый»
# (ὁ ἐγρήγορος καὶ ὁ ἅγιος; LXX: ἄγγελος); いと高[たか]い方[かた] — ὕψιστος; 王座[おうざ] — θρόνος;
# 王国[おうこく] — βασιλεία; 露[つゆ] — δρόσος; 枷[かせ] — πέδαι.
# Имена: ネブカドネツァル, ダニエル, バルタザル, バビロン — по брифу и корпусу.

tr_code: jp-box
book: dan
chapter: 4
draft: true

verses:
  1: "わたし、ネブカドネツァルは、わが家[いえ]に豊[ゆた]かにあり、わが王座[おうざ]の上[うえ]で栄[さか]えていた。"
  2: "夢[ゆめ]を見[み]て、それはわたしを恐[おそ]れさせた。寝床[ねどこ]の上[うえ]でわたしは思[おも]い惑[まど]い、頭[あたま]に浮[う]かぶ幻[まぼろし]がわたしをかき乱[みだ]した。"
  3: "わたしは命[めい]じた。バビロンのすべての知者[ちしゃ]をわたしの前[まえ]に連[つ]れて来[こ]させ、その夢[ゆめ]の解[と]き明[あ]かしをわたしに告[つ]げさせるように、と。"
  4: "呪術師[じゅじゅつし]たち、賢者[けんじゃ]たち、占[うらな]い師[し]たち、カルデア人[じん]たちが入[はい]って来[き]た。わたしは彼らの前[まえ]で夢[ゆめ]を語[かた]ったが、その解[と]き明[あ]かしを告[つ]げる者[もの]はなかった。"
  5: "ついに、わが神[かみ]の名[な]にちなんでバルタザルと呼ばれるダニエルが、わたしの前[まえ]に入[はい]って来[き]た。彼のうちには聖[せい]なる神[かみ]の霊[れい]がある。わたしは彼の前[まえ]で夢[ゆめ]を語[かた]った。"
  6: "「バルタザル、呪術師[じゅじゅつし]たちの長[かしら]よ。わたしは知[し]っている、あなたのうちに聖[せい]なる神[かみ]の霊[れい]があり、どのような奥秘[おうぎ]もあなたの前[まえ]で行[ゆ]き詰[づ]まることはない、と。わたしが見[み]た夢[ゆめ]の幻[まぼろし]を聞[き]き、その解[と]き明[あ]かしをわたしに告[つ]げよ。"
  7: "わたしは寝床[ねどこ]の上[うえ]で、頭[あたま]に浮[う]かぶ幻[まぼろし]を見[み]た。見[み]よ、地[ち]の中央[ちゅうおう]に一本[いっぽん]の木[き]があり、その高[たか]さは大[おお]きかった。"
  8: "その木[き]は大[おお]きくなり、強[つよ]くなって、その高[たか]さは天[てん]に届[とど]き、その大[おお]きさは地[ち]の果[は]てまで及[およ]んだ。"
  9: "その葉[は]は美[うつく]しく、実[み]は多[おお]く、すべての者[もの]に食[た]べ物[もの]があった。その下[した]には野[の]のすべての獣[けもの]が住[す]み、その枝[えだ]には天[てん]の鳥[とり]が巣[す]をつくり、すべての肉[にく]なる者[もの]がそれによって養[やしな]われた。"
  10: "わたしは寝床[ねどこ]の上[うえ]で、夜[よる]の夢[ゆめ]のうちに見[み]た。見[み]よ、目覚[めざ]めている聖[せい]なる者[もの]が天[てん]から下[くだ]って来[き]た。"
  11: "その者[もの]は力[ちから]強[づよ]く叫[さけ]んで言[い]った。『この木[き]を切[き]り倒[たお]し、その枝[えだ]を払[はら]い、その葉[は]をふるい落[お]とし、その実[み]を散[ち]らせ。その下[した]から獣[けもの]たちが、その枝[えだ]から天[てん]の鳥[とり]たちが、追[お]い払[はら]われるように。"
  12: "ただ、その根[ね]の残[のこ]りを地[ち]に残[のこ]せ。それは鉄[てつ]と青銅[せいどう]の枷[かせ]につながれ、外[そと]の草[くさ]の中[なか]で天[てん]の露[つゆ]にぬれて住[す]む。野[の]の獣[けもの]たちとともに、その分[わ]け前[まえ]は地[ち]の草[くさ]となる。"
  13: "その心[こころ]は人[ひと]から取[と]り去[さ]られ、獣[けもの]の心[こころ]がそれに与[あた]えられ、七[なな]つの時[とき]がその上[うえ]を過[す]ぎる。"
  14: "これは目覚[めざ]めている者[もの]たちの定[さだ]めの言葉[ことば]により、聖[せい]なる者[もの]たちの言[ことば]の求[もと]めによって定[さだ]まった。生[い]きる者[もの]たちが、いと高[たか]い方[かた]が人[ひと]の王国[おうこく]を治[おさ]め、これを望[のぞ]む者[もの]に与[あた]え、人[ひと]々[びと]のうちで蔑[さげす]まれた者[もの]をその上[うえ]に立[た]てられることを知[し]るためである。』"
  15: "この夢[ゆめ]を、わたし、ネブカドネツァル王[おう]は見[み]た。バルタザルよ、あなたはその解[と]き明[あ]かしを告[つ]げよ。わが王国[おうこく]の知者[ちしゃ]はだれも、その解[と]き明[あ]かしをわたしに告[つ]げることができなかった。ダニエルよ、あなたにはそれができる。聖[せい]なる神[かみ]の霊[れい]があなたのうちにあるからだ。」"
  16: "そのとき、バルタザルという名[な]のダニエルは、一[いっ]時[とき]ほど、驚[おどろ]きにあっけにとられ、その思[おも]いが彼をかき乱[みだ]した。王[おう]が答[こた]えて言[い]った。「バルタザルよ、この夢[ゆめ]とその解[と]き明[あ]かしが、あなたをかき乱[みだ]してはならない。」バルタザルは答[こた]えて言[い]った。「わが主[あるじ]よ、この夢[ゆめ]はあなたを憎[にく]む者[もの]に、その解[と]き明[あ]かしはあなたの敵[てき]に臨[のぞ]めばよいのですが。"
  17: "あなたが見[み]た木[き]、すなわち大[おお]きくなり強[つよ]くなって、その高[たか]さが天[てん]に届[とど]き、その大[おお]きさが全[ぜん]地[ち]に及[およ]んだ木[き]、"
  18: "その葉[は]は美[うつく]しく、実[み]は多[おお]く、すべての者[もの]に食[た]べ物[もの]があり、その下[した]に野[の]の獣[けもの]たちが住[す]み、その枝[えだ]に天[てん]の鳥[とり]たちが巣[す]をつくった、その木[き]、"
  19: "それはあなたです、王[おう]よ。あなたは大[おお]きくなり強[つよ]くなり、その大[おお]いなる威[い]は高[たか]まり、天[てん]に届[とど]き、あなたの権力[けんりょく]は地[ち]の果[は]てに及[およ]んでいます。"
  20: "また、あなたが目覚[めざ]めている聖[せい]なる者[もの]が天[てん]から下[くだ]るのを見[み]、その者[もの]が『木[き]を切[き]り倒[たお]して散[ち]らせ。ただ、その根[ね]の残[のこ]りを地[ち]に残[のこ]せ。それは鉄[てつ]と青銅[せいどう]の枷[かせ]につながれ、外[そと]の草[くさ]の中[なか]で天[てん]の露[つゆ]にぬれ、野[の]の獣[けもの]たちとともにその分[わ]け前[まえ]は地[ち]の草[くさ]となる。七[なな]つの時[とき]がその上[うえ]を過[す]ぎるまで』と言[い]ったこと、"
  21: "これがその解[と]き明[あ]かしです、王[おう]よ。これが、わが主[あるじ]である王[おう]に臨[のぞ]む、いと高[たか]い方[かた]の定[さだ]めです。"
  22: "あなたは人[ひと]々[びと]から追[お]い出[だ]され、野[の]の獣[けもの]たちとともに住[す]むことになる。牛[うし]のように草[くさ]を食[た]べさせられ、天[てん]の露[つゆ]にぬれる。七[なな]つの時[とき]があなたの上[うえ]を過[す]ぎる。それは、あなたがいと高[たか]い方[かた]が人[ひと]の王国[おうこく]を治[おさ]め、これを望[のぞ]む者[もの]に与[あた]えられることを知[し]るためである。"
  23: "また『木[き]の根[ね]の残[のこ]りを地[ち]に残[のこ]せ』と言[い]われたことは、あなたが天[てん]の権[けん]力[りょく]を知[し]るとき、あなたの王国[おうこく]があなたに残[のこ]るという意味[いみ]です。"
  24: "ですから、王[おう]よ、どうかわたしの勧[すす]めを受け入[い]れてください。施[ほどこ]しによってあなたの罪[つみ]を贖[あがな]い、貧[まず]しい者[もの]への憐[あわ]れみによってあなたの不[ふ]義[ぎ]を贖[あがな]ってください。そうすれば、神[かみ]はあなたの罪[つみ]に寛[かん]容[よう]であられるかもしれません。」"
  25: "これらすべては、ネブカドネツァル王[おう]に臨[のぞ]んだ。"
  26: "十二[じゅうに]か月[げつ]の後[のち]、彼はバビロンで、自分の王国[おうこく]の家[いえ]の中[なか]を歩[ある]いていた。"
  27: "王[おう]は答[こた]えて言[い]った。「これは、わたしが王国[おうこく]の家[いえ]として、わが力[ちから]の権[けん]威[い]をもって、わが威光[いこう]の誉[ほま]れのために建[た]てた、大[おお]いなるバビロンではないか。」"
  28: "その言葉[ことば]がまだ王[おう]の口[くち]にあるうちに、天[てん]から声[こえ]があって言[い]った。「ネブカドネツァル王[おう]よ、あなたに告[つ]げる。王国[おうこく]はあなたから去[さ]った。"
  29: "あなたは人[ひと]々[びと]から追[お]い出[だ]され、野[の]の獣[けもの]たちとともに住[す]む。牛[うし]のように草[くさ]を食[た]べさせられ、七[なな]つの時[とき]があなたの上[うえ]を過[す]ぎる。それは、あなたがいと高[たか]い方[かた]が人[ひと]の王国[おうこく]を治[おさ]め、これを望[のぞ]む者[もの]に与[あた]えられることを知[し]るためである。」"
  30: "その時[とき]、その言葉[ことば]はネブカドネツァル王[おう]の上[うえ]に成[な]り果[は]てた。彼は人[ひと]々[びと]から追[お]い払[はら]われ、牛[うし]のように草[くさ]を食[た]べ、天[てん]の露[つゆ]にその身[み]をぬらした。ついに彼の毛[け]は獅子[しし]のように伸[の]び、その爪[つめ]は鳥[とり]のようになった。"
  31: "その日[ひ]々[び]が終[お]わったとき、わたし、ネブカドネツァルは目[め]を天[てん]に上[あ]げた。すると、わが思[おも]いがわたしに戻[もど]って来[き]た。わたしはいと高[たか]い方[かた]をほめたたえ、永遠[えいえん]に生[い]きておられる方[かた]を賛[さん]美[び]し、崇[あが]めた。その権[けん]威[い]は永遠[えいえん]の権威[けんい]、その王国[おうこく]は代[よ]々[よ]に及[およ]ぶからである。"
  32: "地[ち]に住[す]む者[もの]はすべて無[む]に等[ひと]しい。彼は天[てん]の軍[ぐん]勢[せい]のうちでも、地[ち]に住[す]む者[もの]のうちでも、御心[みこころ]のままに行[おこな]われる。その手[て]に逆[さか]らい、「何[なに]をなさったのか」と言[い]う者[もの]はない。"
  33: "その時[とき]、わが思[おも]いはわたしに戻[もど]り、わが王国[おうこく]の誉[ほま]れのためにわたしは戻[もど]って来[き]た。わが姿[すがた]もわたしに戻[もど]った。わが長官[ちょうかん]たちと貴[き]人[じん]たちがわたしを求[もと]め、わたしは王国[おうこく]に復[ふく]された。そして、いよいよ大[おお]きな威[い]がわたしに加[くわ]えられた。"
  34: "今[いま]、わたし、ネブカドネツァルは、天[てん]の王[おう]を賛[さん]美[び]し、崇[あが]め、ほめたたえる。そのすべての御業[みわざ]は真実[しんじつ]であり、その道[みち]は裁[さば]きであり、高[たか]ぶって歩[あゆ]む者[もの]をすべて低[ひく]くされるからである。"

notes:
  1: "Ἔτους ὀκτωκαιδεκάτου τῆς βασιλείας Ναβουχοδονοσορ εἶπεν· Εἰρηνεύων ἤμην ἐν τῷ οἴκῳ μου καὶ εὐθηνῶν ἐπὶ τοῦ θρόνου μου — «в восемнадцатый год царствования Навуходоносора он сказал: в мире (покое) был я в доме моём и благоденствовал на престоле моём» (gr 4:4; наш 4:1 = gr 4:4, сдвиг +3). Слав. (csl-ru) начинает иначе: «Аз навуходоносор обилуяй бех в дому моем и благоцветый на престоле моем» — «я, Навуходоносор, был в изобилии в доме моём и благоденствовал на престоле моём». По паритету взят слав. зачин (МТ), хронологическая заметка LXX («в восемнадцатый год») в текст не внесена. 豊[ゆた]か — «в изобилии, в довольстве» (обилуяй; LXX εὐθηνῶν)."
  2: "ἐνύπνιον εἶδον καὶ εὐλαβήθην, καὶ φόβος μοι ἐπέπεσεν — «сон я видел и устрашился, и страх напал на меня» (gr 4:5). Слав. полнее (МТ 4:5): «сон видех, и устраши мя, и смятохся на ложи моем, и видения главы моея смятоша мя» — «сон я видел, и он устрашил меня, и смутился я на ложе моём, и видения головы моей смутили меня»; по паритету взят слав. 幻[まぼろし] — ὅρασις, «видение» (в книге также ἐνύπνιον — 夢)."
  3: "В gr-lxx-byz на месте стиха стоит «.» (лакуна, gr 4:6); переведено по церковнославянскому (csl-ru, МТ 4:6): «и мною положися повеление, привести пред мя вся мужы мудрыя вавилонския, да сказание сна возвестят мне» — «и положено было мною повеление привести ко мне всех мудрецов Вавилонских, чтобы они сказали мне значение сна». 〔…〕 не ставится (решение брифа, как в iez_33:26). 知者[ちしゃ] — σοφοί,  мудрецы."
  4: "В gr-lxx-byz «.» (gr 4:7); по слав. (МТ 4:7): «и вхождаху обаятелие, волсви, газарини, халдее, и сон аз рех пред ними, и сказания его не возвестиша ми». Слав. перечисляет четырёх: ἐπαοιδοί (呪術師[じゅじゅつし]), μάγοι (賢者[けんじゃ]), γαζαρηνοί (占[うらな]い師[し]), Χαλδαῖοι (カルデア人[じん]); те же четыре разряда в 5:7. 賢者[けんじゃ] взято по корпусу (Мф 2:1, μάγοι), а не «волхвы» в смысле гадателей."
  5: "В gr-lxx-byz «.» (gr 4:8); по слав. (МТ 4:8): «дондеже вниде (пред мя) даниил, емуже имя валтасар, по имения бога моего, иже духа Божия свята имать в себе, и сон пред ним рех». Слав. «по имения бога моего» — тёмное место, понято как «по имени бога моего» (ср. евр. עַל־שֻׁם אֱלָהִי, слав. «по имени»; в модуле «по имения»); передано わが神[かみ]の名[な]にちなんで. Валтасар — имя, данное Даниилу (1:7; 4:6; 5:12)."
  6: "В gr-lxx-byz «.» (gr 4:9); по слав. (МТ 4:9): «валтасаре, княже обаятелей, егоже аз разумех, яко дух Божий святый имаши, и всякая тайна не изнемогает пред тобою, слыши видение сна моего, еже видех, и сказание его повеждь мне». 奥秘[おうぎ] — μυστήριον (как в 2:18–19 и в брифe). Здесь начинается прямая речь царя; она идёт до конца 4:15 (в 11–14 внутри — слова бодраго)."
  7: "ἐκάθευδον καὶ ἰδοὺ δένδρον ὑψηλὸν φυόμενον ἐπὶ τῆς γῆς· ἡ ὅρασις αὐτοῦ μεγάλη, καὶ οὐκ ἦν ἄλλο ὅμοιον αὐτῷ — «спал я, и вот дерево высокое, растущее на земле; видение его велико, и не было другого, подобного ему» (gr 4:10). Слав. (МТ 4:10) ближе к евр.: «и видение главы моея на ложи моем зрех, и се, древо среде земли, и высота его велика» — «и видение головы моей на ложе моём я видел: вот, дерево среди земли, и высота его велика»; по паритету взят слав. (地[ち]の中央[ちゅうおう])."
  8: "В gr-lxx-byz «.» (gr 4:11); по слав. (МТ 4:11): «и возвеличися древо то и укрепися, и высота его досязаше до небесе, и величина его до конец земли всея». 天[てん]に届[とど]き — досязаше до небесе (φθάνω εἰς τὸν οὐρανόν)."
  9: "В LXX (gr 4:12) описание дерева иное и пространнее: οἱ κλάδοι αὐτοῦ τῷ μήκει ὡς σταδίων τριάκοντα… ὁ ἥλιος καὶ ἡ σελήνη ἐν αὐτῷ ᾤκουν καὶ ἐφώτιζον πᾶσαν τὴν γῆν — «ветви его длиною около тридцати стадиев… солнце и луна обитали в нём и освещали всю землю». Слав. (МТ 4:12) этого не имеет: «листвие его прекрасное, и плод его мног, и пища всех в нем, и под ним вселяхуся вси зверие дивии, и в ветвех его живяху (вся) птицы небесныя, и от него питашеся всяка плоть»; по паритету взят слав., LXX-чтение (30 стадиев, солнце и луна) — только здесь, в текст не внесено."
  10: "ἐθεώρουν ἐν τῷ ὕπνῳ μου, καὶ ἰδοὺ ἄγγελος ἀπεστάλη ἐν ἰσχύι ἐκ τοῦ οὐρανοῦ — «смотрел я в сновидении моём, и вот ангел послан в силе с неба» (gr 4:13). Слав. (МТ 4:13): «видех во сне нощию на ложи моем, и се, бодрый и святый от небесе сниде» — «видел я в ночном сне на ложе моём: вот, бодрствующий и святой сошёл с неба» (евр. עִיר וְקַדִּישׁ, «страж и святой»). По паритету взят слав.; 目覚[めざ]めている聖[せい]なる者[もの] — «бодрый и святый», тот же оборот в 4:14 и 4:20. LXX называет его ἄγγελος (ангел) — отмечено в 20."
  11: "В gr-lxx-byz «.» (gr 4:14); по слав. (МТ 4:14): «и возгласи крепце и тако рече: посецыте древо и обийте ветви его, и оттрясите листвие его и разсыплите плод его, да позыблются зверие под ним и птицы с ветвий его». Слова бодраго — 『…』 (внутри речи царя). В LXX этот стих иной: Ἐκκόψατε αὐτὸ καὶ καταφθείρατε αὐτό· προστέτακται γὰρ ἀπὸ τοῦ ὑψίστου ἐκριζῶσαι καὶ ἀχρειῶσαι αὐτό — «срубите его и погубите его; ибо повелено от Всевышнего искоренить и обезценить его»."
  12: "καὶ οὕτως εἶπε· Ῥίζαν μίαν ἄφετε αὐτοῦ ἐν τῇ γῇ, ὅπως μετὰ τῶν θηρίων τῆς γῆς ἐν τοῖς ὄρεσι χόρτον ὡς βοῦς νέμηται — «и так сказал: один корень оставьте его в земле, чтобы с зверями земными в горах траву, как вол, он пасся» (gr 4:15). Слав. (МТ 4:15) добавляет узы: «точию отрасль корения его в земли оставите, и во узе железне и медне, и во злаце внешнем и в росе небесней вселится, и со зверьми (дивиими) часть его во траве земней»; по паритету взят слав. (鉄[てつ]と青銅[せいどう]の枷[かせ])."
  13: "καὶ ἀπὸ τῆς δρόσου τοῦ οὐρανοῦ τὸ σῶμα αὐτοῦ ἀλλοιωθῇ, καὶ ἑπτὰ ἔτη βοσκηθῇ σὺν αὐτοῖς — «и от росы небесной тело его изменится, и семь лет будет пастись с ними» (gr 4:16). Слав. (МТ 4:16): «сердце его от человек изменится, и сердце зверино дастся ему, и седмь времен изменятся над ним»; по паритету взят слав. 七[なな]つの時[とき] — «семь времён» (ἑπτὰ καιροί; LXX в этом месте — ἑπτὰ ἔτη, «семь лет»)."
  14: "В gr-lxx-byz «.» (gr 4:17); по слав. (МТ 4:17): «изречением бодраго слово, и глагол святых прошение: да уведят живущии, яко владеет вышний царством человеческим, и емуже восхощет, даст е, и уничтоженное человеков возставит над ним» — «по слову бодрствующих это определено и по прошению святых, чтобы знали живущие, что Всевышний владеет царством человеческим, и кому хочет, даёт его, и уничижённого из людей поставляет над ним». Здесь слова бодраго закрываются. 蔑[さげす]まれた者[もの] — «уничижённый» (LXX: ἐξουθενημένος)."
  15: "καὶ ἀναστὰς τὸ πρωῒ ἐκ τῆς κοίτης μου ἐκάλεσα τὸν Δανιηλ τὸν ἄρχοντα τῶν σοφιστῶν καὶ τὸν ἡγούμενον τῶν κρινόντων τὰ ἐνύπνια καὶ διηγησάμην αὐτῷ τὸ ἐνύπνιον, καὶ ὑπέδειξέ μοι πᾶσαν τὴν σύγκρισιν αὐτοῦ — «встав утром с постели, я позвал Даниила, начальника мудрецов и главу судящих сны, и рассказал ему сон, и он показал мне всё истолкование его» (gr 4:18). В LXX царь зовёт Даниила уже утром и тот сразу толкует; слав. (МТ 4:18) держит обращение внутри речи: «сей сон, егоже видех аз навуходоносор царь: ты же, валтасаре, сказание его повеждь, яко вси мудрии царства моего не могут сказания его поведати мне, ты же, данииле, можеши, яко дух Божий свят в тебе». По паритету взят слав. Здесь речь царя закрывается."
  16: "μεγάλως δὲ ἐθαύμασεν ὁ Δανιηλ, καὶ ὑπόνοια κατέσπευδεν αὐτόν… ἀπεκρίθη μοι φωνῇ πραείᾳ· Βασιλεῦ, τὸ ἐνύπνιον τοῦτο τοῖς μισοῦσί σε καὶ ἡ σύγκρισις αὐτοῦ τοῖς ἐχθροῖς σου ἐπέλθοι — «сильно изумился Даниил, и помысел стремительно охватил его… ответил мне кротким голосом: царь, этот сон — ненавидящим тебя, и истолкование его — врагам твоим да придёт» (gr 4:19). Слав. (МТ 4:16) вставляет краткую речь царя («валтасаре, сон мой и сказание его да не смущает тебе») и ответ Даниила «господине, да будет сон сей ненавидящым тя, и сказание его врагом твоим»; в LXX этой вставки нет. Ответ Даниила идёт до конца 4:24."
  17: "τὸ δένδρον τὸ ἐν τῇ γῇ πεφυτευμένον, οὗ ἡ ὅρασις μεγάλη, σὺ εἶ, βασιλεῦ — «дерево, насаждённое на земле, видение которого велико, — это ты, царь» (gr 4:20). Слав. (МТ 4:17) продолжает описание: «древо, еже видел еси возвеличившееся и укрепившееся, егоже высота досязаше до небесе и величина его на всю землю»; «ты еси, царю» у слав. в ст. 19. По паритету взят слав. порядок; этот стих и следующий — одно предложение, разбитое по стихам слав."
  18: "καὶ πάντα τὰ πετεινὰ τοῦ οὐρανοῦ τὰ νοσσεύοντα ἐν αὐτῷ· ἡ ἰσχὺς τῆς γῆς καὶ τῶν ἐθνῶν καὶ τῶν γλωσσῶν πασῶν ἕως τῶν περάτων τῆς γῆς καὶ πᾶσαι αἱ χῶραι σοὶ δουλεύουσι — «и все птицы небесные, гнездящиеся в нём; сила земли и народов и всех языков до концов земли, и все страны служат тебе» (gr 4:21). Слав. (МТ 4:18): «и листвие его благоцветное и плод его мног, и пища всем в нем, под ним живяху зверие дивии, и в ветвех его угнездяхуся птицы небесныя»; LXX-прибавка о «силе земли и народов» в текст не внесена."
  19: "τὸ δὲ ἀνυψωθῆναι τὸ δένδρον ἐκεῖνο… σύ, βασιλεῦ, ὑψώθης ὑπὲρ πάντας τοὺς ἀνθρώπους… ὑψώθη σου ἡ καρδία ὑπερηφανίᾳ καὶ ἰσχύι τὰ πρὸς τὸν ἅγιον καὶ τοὺς ἀγγέλους αὐτοῦ· τὰ ἔργα σου ὤφθη, καθότι ἐξερήμωσας τὸν οἶκον τοῦ θεοῦ τοῦ ζῶντος ἐπὶ ταῖς ἁμαρτίαις τοῦ λαοῦ τοῦ ἡγιασμένου — LXX (gr 4:22) добавляет: «вознеслось сердце твоё гордостью и силою против Святого и ангелов Его; дела твои явились, потому что ты опустошил дом Бога живого за грехи народа освящённого». В слав. (МТ 4:19) этого нет: «ты еси, царю, яко возвеличился еси и укрепел, и величество твое возвеличися и досяже небесе, и власть твоя до конец земли». По паритету взят слав.; LXX-обличение в текст не внесено."
  20: "В gr-lxx-byz «.» (gr 4:23); по слав. (МТ 4:20): «и яко виде царь бодраго и святаго сходяща с небесе, и рече: посецыте древо и разсыплите е, точию проничение корения его в земли оставите, и во узе железне и медяне и во злаце внешнем и в росе небесней водворится, и со зверьми дивиими часть его, дондеже седмь времен пременятся над ним». Повтор слов бодраго внутри речи Даниила — 『…』. В LXX (gr 4:23) иначе: «и видение, которое ты видел, что ангел в силе послан от Господа и что он сказал вырвать дерево и срубить: суд Бога великого придёт на тебя»."
  21: "В gr-lxx-byz «.» (gr 4:24); по слав. (МТ 4:21): «сие сказание его, царю, и изречение вышняго есть, еже приспе на господина моего царя» — «вот истолкование его, царь, и определение Всевышнего, которое постигло господина моего, царя». В LXX (gr 4:24) кратко: καὶ ὁ ὕψιστος καὶ οἱ ἄγγελοι αὐτοῦ ἐπὶ σὲ κατατρέχουσιν — «и Всевышний, и ангелы Его устремляются на тебя». 定[さだ]め — «определение» (ἀπόφασις/κρίσις)."
  22: "εἰς φυλακὴν ἀπάξουσί σε καὶ εἰς τόπον ἔρημον ἀποστελοῦσί σε — «в темницу уведут тебя и в место пустынное пошлют тебя» (gr 4:25). Слав. (МТ 4:22) полнее: «изженут тя от человек, и с дивиими зверьми будет житие твое, и травою аки вола напитают тя, и от росы небесныя тело твое оросится, и седмь времен изменятся над тобою, дондеже увеси, яко владеет вышний царством человеческим, и емуже восхощет, даст е»; по паритету взят слав. Стих почти дословно повторяет 4:29 (глас с неба) — в слав. так же, повтор сохранён."
  23: "καὶ ἡ ῥίζα τοῦ δένδρου ἡ ἀφεθεῖσα, ἐπεὶ οὐκ ἐξερριζώθη· ὁ τόπος τοῦ θρόνου σού σοι συντηρηθήσεται εἰς καιρὸν καὶ ὥραν. ἰδοὺ ἐπὶ σὲ ἑτοιμάζονται καὶ μαστιγώσουσί σε καὶ ἐπάξουσι τὰ κεκριμένα ἐπὶ σέ — LXX (gr 4:26): «и корень дерева, оставленный, так как не был искоренён: место престола твоего сохранено будет тебе на время и час; вот, на тебя готовятся и будут бичевать тебя и наведут на тебя решённое». Слав. (МТ 4:23) короче: «а еже рече: оставите проничение корения древа (в земли): царство твое тебе будет, отнележе увеси власть небесную». По паритету взят слав. Здесь в речи Даниила повтор слов бодраго — 『…』."
  24: "κύριος ζῇ ἐν οὐρανῷ, καὶ ἡ ἐξουσία αὐτοῦ ἐπὶ πάσῃ τῇ γῇ· αὐτοῦ δεήθητι περὶ τῶν ἁμαρτιῶν σου καὶ πάσας τὰς ἀδικίας σου ἐν ἐλεημοσύναις λύτρωσαι… τούτους τοὺς λόγους ἀγάπησον· ἀκριβὴς γάρ μου ὁ λόγος — LXX (gr 4:27): «Господь живёт на небе, и власть Его над всей землёй; Ему помолись о грехах твоих и все неправды твои милостынями искупи… возлюби эти слова, ибо точно слово моё». Слав. (МТ 4:24): «сего ради, царю, совет мой да будет тебе угоден, и грехи твоя милостынями искупи и неправды твоя щедротами убогих: негли будет долготерпелив грехом твоим Бог»; по паритету взят слав. 施[ほどこ]し — ἐλεημοσύνη, «милостыня». Здесь речь Даниила закрывается."
  25: "Слав. (МТ 4:25): «сия вся постигоша навуходоносора царя» — «всё это постигло царя Навуходоносора». LXX (gr 4:28) иначе: καὶ ἐπὶ συντελείᾳ τῶν λόγων Ναβουχοδονοσορ, ὡς ἤκουσε τὴν κρίσιν τοῦ ὁράματος, τοὺς λόγους ἐν τῇ καρδίᾳ συνετήρησε — «по окончании слов Навуходоносор, услышав суд видения, сохранил слова в сердце». По паритету взят слав., LXX — здесь."
  26: "καὶ μετὰ μῆνας δώδεκα ὁ βασιλεὺς ἐπὶ τῶν τειχῶν τῆς πόλεως μετὰ πάσης τῆς δόξης αὐτοῦ περιεπάτει καὶ ἐπὶ τῶν πύργων αὐτῆς διεπορεύετο — «и через двенадцать месяцев царь по стенам города со всею славою своею прохаживался и по башням его проходил» (gr 4:29). Слав. (МТ 4:26): «по двоюнадесяти месяцех в дому царства своего, в вавилоне бе ходя» — «по двенадцати месяцах в доме царства своего, в Вавилоне, ходил»; по паритету взят слав. (LXX: на стенах и башнях)."
  27: "καὶ ἀποκριθεὶς εἶπεν· Αὕτη ἐστὶ Βαβυλὼν ἡ μεγάλη, ἣν ἐγὼ ᾠκοδόμησα, καὶ οἶκος βασιλείας μου ἐν ἰσχύι κράτους μου κληθήσεται εἰς τιμὴν τῆς δόξης μου — «и, отвечая, сказал: это Вавилон великий, который я построил, и дом царства моего в силе державы моей наречётся в честь славы моей» (gr 4:30). Слав. (МТ 4:27): «отвеща царь и рече: несть ли сей вавилон великий, егоже аз соградих в дом царства, в державе крепости моея, в честь славы моея?» — вопрос сохранён."
  28: "καὶ ἐπὶ συντελείᾳ τοῦ λόγου αὐτοῦ φωνὴν ἐκ τοῦ οὐρανοῦ ἤκουσε· Σοὶ λέγεται, Ναβουχοδονοσορ βασιλεῦ, ἡ βασιλεία Βαβυλῶνος ἀφῄρηταί σου καὶ ἑτέρῳ δίδοται, ἐξουθενημένῳ ἀνθρώπῳ ἐν τῷ οἴκῳ σου… — LXX (gr 4:31) гораздо длиннее: «и по окончании слова его услышал голос с неба: тебе говорится, Навуходоносор царь, царство Вавилонское отнято у тебя и отдано другому, уничижённому человеку в доме твоём; вот, Я поставляю его над царством твоим, и власть твою, и славу твою, и роскошь твою он возьмёт…». Слав. (МТ 4:28): «еще слову сущу во устех царя, глас с небесе бысть: тебе глаголется, навуходоносоре царю: царство твое прейде от тебе»; по паритету взят слав., LXX-продолжение в текст не внесено."
  29: "καὶ οἱ ἄγγελοι διώξονταί σε ἐπὶ ἔτη ἑπτά, καὶ οὐ μὴ ὀφθῇς οὐδ' οὐ μὴ λαλήσῃς μετὰ παντὸς ἀνθρώπου· χόρτον ὡς βοῦν σε ψωμίσουσι… ἰδοὺ ἀντὶ τῆς δόξης σου δήσουσί σε — «и ангелы будут гнать тебя семь лет, и не будешь видим и не будешь говорить ни с одним человеком; травою, как вола, будут кормить тебя… вот, вместо славы твоей свяжут тебя» (gr 4:32). Слав. (МТ 4:29) повторяет ст. 22: «и от человек отженут тя, и со зверьми дивиими житие твое, и травою аки вола напитают тя и седмь времен изменятся на тебе, дондеже увеси…»; по паритету взят слав., повтор сохранён."
  30: "ἕως δὲ πρωῒ πάντα τελεσθήσεται ἐπὶ σέ… 33a ἐγὼ Ναβουχοδονοσορ βασιλεὺς Βαβυλῶνος ἑπτὰ ἔτη ἐπεδήθην· χόρτον ὡς βοῦν ἐψώμισάν με, καὶ ἀπὸ τῆς χλόης τῆς γῆς ἤσθιον — LXX (gr 4:33): «до утра всё исполнится над тобою… я, Навуходоносор, царь Вавилонский, семь лет был поражён; травою, как вол, кормили меня, и от злака земного я ел». Слав. (МТ 4:30): «в той час слово скончася на цари навуходоносоре, и от человек отгнася, и траву аки вол ядяше, и от росы небесныя тело его оросися, дондеже власи ему яко льву возрастоша и ногти ему аки птицам»; по паритету взят слав. (волосы как у льва, когти как у птиц — здесь, а не в 31)."
  31: "καὶ αἱ τρίχες μου ἐγένοντο ὡς πτέρυγες ἀετοῦ, οἱ ὄνυχές μου ὡσεὶ λέοντος· ἠλλοιώθη ἡ σάρξ μου… καὶ ἐπὶ συντελείᾳ τῶν ἑπτὰ ἐτῶν ὁ χρόνος μου τῆς ἀπολυτρώσεως ἦλθε… καὶ ἰδοὺ ἄγγελος εἷς ἐκάλεσέ με ἐκ τοῦ οὐρανοῦ λέγων· Ναβουχοδονοσορ, δούλευσον τῷ θεῷ τοῦ οὐρανοῦ τῷ ἁγίῳ καὶ δὸς δόξαν τῷ ὑψίστῳ — LXX (gr 4:34): «волосы мои стали как крылья орла, когти мои как у льва; изменилась плоть моя… и по окончании семи лет пришло время избавления моего… и вот, ангел один воззвал меня с неба: Навуходоносор, послужи Богу неба святому и воздай славу Всевышнему». Слав. (МТ 4:31): «и по скончании тех дний, аз навуходоносор очи свои на небо воздвиг, и ум мой ко мне возвратися, и вышняго благослових, и живущаго во веки похвалих и прославих, яко власть его власть вечна, и Царство его в роды и роды»; по паритету взят слав."
  32: "В gr-lxx-byz «.» (gr 4:35); по слав. (МТ 4:35): «и вси живущии на земли ни во чтоже вменишася, и по воли своей творит в силе небесней и в селении земнем: и несть, иже воспротивится руце его и речет ему: что сотворил еси?» — «и все живущие на земле ни во что вменены; по воле Своей Он действует в силе небесной и в селении земном; и нет того, кто воспротивился бы руке Его и сказал Ему: что Ты сделал?». Это продолжение славословия царя — речь от первого лица, но по слав. это повествование, не цитата; кавычек нет. 軍[ぐん]勢[せい] — «воинство» (στρατιά)."
  33: "ἐν ἐκείνῳ τῷ καιρῷ ἀποκατεστάθη ἡ βασιλεία μου ἐμοί, καὶ ἡ δόξα μου ἀπεδόθη μοι — «в то время возвращено мне царство моё, и слава моя отдана мне» (gr 4:36). Слав. (МТ 4:33): «в то время ум мой возвратися ко мне, и в честь царства моего приидох, и зрак мой возвратися ко мне, и началницы мои и вельможи мои искаху мене: и в царстве моем утвердихся, и величество изюбилнее приложися мне»; по паритету взят слав. (о возвращении сана и прежнего вида)."
  34: "τῷ ὑψίστῳ ἀνθομολογοῦμαι καὶ αἰνῶ τῷ κτίσαντι τὸν οὐρανὸν καὶ τὴν γῆν… ὅτι αὐτός ἐστι θεὸς τῶν θεῶν καὶ κύριος τῶν κυρίων καὶ βασιλεὺς τῶν βασιλέων… 37a ἀπὸ τοῦ νῦν αὐτῷ λατρεύσω… — LXX (gr 4:37) гораздо длиннее: «Всевышнему исповедуюсь и хвалю Сотворившего небо и землю, моря и реки и всё в них; исповедуюсь и хвалю, ибо Он Бог богов и Господь господ и Царь царей… отныне Ему буду служить…». Слав. (МТ 4:34): «ныне убо аз навуходоносор хвалю и превозношу и славлю Царя небеснаго, яко вся дела его истинна, и путие его судбы, и вся ходящыя в гордости может смирити»; по паритету взят слав. За этой главой в модуле следуют gr 4:38–39 (указ, наш 3:98–100) — здесь не дублируются."
