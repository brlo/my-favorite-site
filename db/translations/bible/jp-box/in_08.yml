# jp-box, Евангелие от Иоанна, глава 8.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 8: жена, взятая в прелюбодеянии (1–11; в критическом издании под скобками,
# каждый стих целиком в 〔…〕), свет миру (12–20), «куда Я иду» (21–30),
# истина и свобода (31–38), дети Авраама и дети диавола (39–47),
# «прежде нежели был Авраам, Я есмь» (48–59).
# ἐγώ εἰμι без сказуемого: 8:24, 8:28, 8:58 — このわたしである / わたしはいる.
# jp-ni не использовался.

