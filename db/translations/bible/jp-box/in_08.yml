verses:
  1: "イエスはオリーブ山[やま]へ行[い]かれた。"
  2: "夜[よ]が明[あ]けると、イエスはまた神殿[しんでん]へ来[こ]られ、民[たみ]は皆[みな]イエスのもとへ集[あつ]まって来[き]た。イエスは座[すわ]って、彼[かれ]らを教[おし]え始[はじ]められた。"
  3: "律法学者[りっぽうがくしゃ]たちとファリサイ派[は]の人々[ひとびと]が、姦淫[かんいん]の現場[げんば]で捕[と]らえた女[おんな]を連[つ]れて来[き]て、中[なか]に立[た]たせて、"
  4: "彼[かれ]らは言[い]った。「先生[せんせい]、この女[おんな]は姦淫[かんいん]の最中[さいちゅう]に捕[と]らえられました。」"
  5: "「モーセは律法[りっぽう]で、このような女[おんな]たちを石[いし]で打[う]ち殺[ころ]すように、わたしたちに命[めい]じています。あなたはどう思[おも]いますか。」"
  6: "彼[かれ]らがこう言[い]ったのは、イエスを試[こころ]みて、訴[うった]える口実[こうじつ]を得[え]るためであった。イエスは身[み]をかがめて、指[ゆび]で地面[じめん]に書[か]いておられた。"
  7: "彼[かれ]らが問[と]い続[つづ]けるので、イエスは身[み]を起[お]こして言[い]われた。「<j>あなたがたのうち、罪[つみ]のない者[もの]が、まずこの女[おんな]に石[いし]を投[な]げなさい。</j>」"
  8: "そしてまた身[み]をかがめて、地面[じめん]に書[か]いておられた。"
  9: "彼[かれ]らはこれを聞[き]くと、良心[りょうしん]に責[せ]められて、年長[ねんちょう]の者[もの]から始[はじ]めて次々[つぎつぎ]に退[しりぞ]いて行[い]き、イエスだけが残[のこ]り、女[おんな]は中[なか]に立[た]っていた。"
  10: "イエスは身[み]を起[お]こして、女[おんな]に言[い]われた。「<j>女[おんな]よ、あなたを訴[うった]えた人[ひと]たちはどこにいるのか。だれもあなたを罪[つみ]に定[さだ]めなかったのか。</j>」"
  11: "女[おんな]は言[い]った。「だれもおりません、主[しゅ]よ。」イエスは言[い]われた。「<j>わたしも、あなたを罪[つみ]に定[さだ]めない。行[い]きなさい。今[いま]からは、もう罪[つみ]を犯[おか]してはならない。</j>」"
  12: "イエスはまた彼[かれ]らに語[かた]って言[い]われた。「<j>わたしは世[よ]の光[ひかり]である。わたしに従[したが]う者[もの]は闇[やみ]の中[なか]を歩[ある]かない。命[いのち]の光[ひかり]を持[も]つ。</j>」"
  13: "ファリサイ派[は]の人々[ひとびと]は言[い]った。「あなたは自分[じぶん]自身[じしん]について証[あかし]しています。あなたの証[あかし]は真実[しんじつ]ではありません。」"
  14: "イエスは答[こた]えて言[い]われた。「<j>たとえわたしが自分[じぶん]について証[あかし]しても、わたしの証[あかし]は真実[しんじつ]である。わたしはどこから来[き]てどこへ行[い]くかを知[し]っているからである。あなたがたは、わたしがどこから来[き]てどこへ行[い]くかを知[し]らない。</j>"
  15: "<j>あなたがたは肉[にく]に従[したが]って裁[さば]いている。わたしはだれも裁[さば]かない。</j>"
  16: "<j>だが、たとえわたしが裁[さば]いても、わたしの裁[さば]きは真実[しんじつ]である。わたしは一人[ひとり]ではなく、わたしを遣[つか]わした父[ちち]が共[とも]におられるからである。</j>"
  17: "<j>あなたがたの律法[りっぽう]にも、二人[ふたり]の者[もの]の証[あかし]は真実[しんじつ]である、と書[か]かれている。</j>"
  18: "<j>わたしは自分[じぶん]について証[あかし]する者[もの]であり、わたしを遣[つか]わした父[ちち]もわたしについて証[あかし]する。</j>」"
  19: "そこで彼[かれ]らは言[い]った。「あなたの父[ちち]はどこにいますか。」イエスは答[こた]えられた。「<j>あなたがたはわたしも知[し]らず、わたしの父[ちち]も知[し]らない。もしわたしを知[し]っていたなら、わたしの父[ちち]も知[し]っていたであろう。</j>」"
  20: "イエスは神殿[しんでん]で教[おし]えながら、献金箱[けんきんばこ]のあたりでこれらの言葉[ことば]を語[かた]られた。イエスの時[とき]がまだ来[き]ていなかったので、だれもイエスを捕[と]らえる者[もの]はいなかった。"
  21: "イエスはまた彼[かれ]らに言[い]われた。「<j>わたしは行[い]く。あなたがたはわたしを捜[さが]すが、自分[じぶん]の罪[つみ]のうちに死[し]ぬ。わたしが行[い]く所[ところ]へは、あなたがたは来[く]ることができない。</j>」"
  22: "そこでユダヤ人[じん]たちは言[い]った。「『わたしが行[い]く所[ところ]へは、あなたがたは来[く]ることができない』と言[い]いますが、まさか自分[じぶん]の命[いのち]を断[た]つつもりなのでしょうか。」"
  23: "イエスは言[い]われた。「<j>あなたがたは下[しも]の者[もの]であり、わたしは上[かみ]の者[もの]である。あなたがたはこの世[よ]の者[もの]であり、わたしはこの世[よ]の者[もの]ではない。</j>"
  24: "<j>だから、あなたがたは自分[じぶん]の罪[つみ]のうちに死[し]ぬ、とわたしは言[い]ったのである。もし、『このわたしである』と信[しん]じなければ、あなたがたは自分[じぶん]の罪[つみ]のうちに死[し]ぬ。</j>」"
  25: "そこで彼[かれ]らは言[い]った。「あなたはどなたですか。」イエスは言[い]われた。「<j>初[はじ]めから⟨τὴν ἀρχήν は字義[じぎ]では「初[はじ]め」の意[い]。ここでは「初[はじ]めから」とも「そもそも」とも取[と]れ、スラヴ語訳[ごやく]は「始[はじ]まり」、ロシア語[ご]のシノドス訳[やく]は「初[はじ]めからおられる方[かた]」と訳[やく]す。⟩、わたしがあなたがたに語[かた]っているとおりの者[もの]である。</j>"
  26: "<j>わたしはあなたがたについて語[かた]ること、また裁[さば]くことが多[おお]くある。しかし、わたしを遣[つか]わした方[かた]は真実[しんじつ]であり、わたしはその方[かた]から聞[き]いたことを世[よ]に語[かた]っている。</j>」"
  27: "彼[かれ]らは、イエスが父[ちち]のことを言[い]っておられるのを悟[さと]らなかった。"
  28: "そこでイエスは言[い]われた。「<j>あなたがたが人[ひと]の子[こ]を上[あ]げる時[とき]、そのとき、このわたしであることを知[し]る。また、わたしが自分[じぶん]から何[なに]もせず、父[ちち]が教[おし]えてくださったとおりに語[かた]っていることも知[し]る。</j>"
  29: "<j>わたしを遣[つか]わした方[かた]はわたしと共[とも]にいる。その方[かた]はわたしを一人[ひとり]にして置[お]かれなかった。わたしはいつもその方[かた]の御心[みこころ]にかなうことを行[おこな]っているからである。</j>」"
  30: "イエスがこう語[かた]られると、多[おお]くの者[もの]がイエスを信[しん]じた。"
  31: "そこでイエスは、ご自分[じぶん]を信[しん]じたユダヤ人[じん]たちに言[い]われた。「<j>もしあなたがたがわたしの言葉[ことば]にとどまっているなら、あなたがたは本当[ほんとう]にわたしの弟子[でし]である。</j>"
  32: "<j>あなたがたは真理[しんり]を知[し]り、真理[しんり]はあなたがたを自由[じゆう]にする。</j>」"
  33: "彼[かれ]らは答[こた]えた。「わたしたちはアブラハムの子孫[しそん]であり、これまでだれの奴隷[どれい]にもなったことがありません。どうして、あなたは『あなたがたは自由[じゆう]になる』と言[い]うのですか。」"
  34: "イエスは答[こた]えて言[い]われた。「<j>よくよく言[い]っておく。罪[つみ]を行[おこな]う者[もの]はだれでも、罪[つみ]の奴隷[どれい]である。</j>"
  35: "<j>奴隷[どれい]はいつまでも家[いえ]にいる者[もの]ではない。子[こ]はいつまでもいる。</j>"
  36: "<j>だから、もし子[こ]があなたがたを自由[じゆう]にしたなら、あなたがたは本当[ほんとう]に自由[じゆう]な者[もの]となる。</j>"
  37: "<j>わたしは、あなたがたがアブラハムの子孫[しそん]であることを知[し]っている。しかし、あなたがたはわたしを殺[ころ]そうとしている。わたしの言葉[ことば]があなたがたのうちに入[はい]らないからである。</j>"
  38: "<j>わたしは父[ちち]のもとで見[み]たことを語[かた]っている。あなたがたもまた、父[ちち]から聞[き]いたことを行[おこな]っている。</j>」"
  39: "彼[かれ]らは答[こた]えて言[い]った。「わたしたちの父[ちち]はアブラハムです。」イエスは言[い]われた。「<j>もしあなたがたがアブラハムの子[こ]なら、アブラハムの業[わざ]を行[おこな]うだろう。</j>"
  40: "<j>ところが今[いま]、あなたがたは、神[かみ]から聞[き]いた真理[しんり]をあなたがたに語[かた]った人[ひと]を殺[ころ]そうとしている。アブラハムはそのようなことをしなかった。</j>"
  41: "<j>あなたがたは自分[じぶん]の父[ちち]の業[わざ]を行[おこな]っている。</j>」彼[かれ]らは言[い]った。「わたしたちは淫[いん]な行[おこな]いから生[う]まれたのではありません。わたしたちにはただ一人[ひとり]の父[ちち]、神[かみ]がいます。」"
  42: "イエスは言[い]われた。「<j>もし神[かみ]があなたがたの父[ちち]なら、あなたがたはわたしを愛[あい]したであろう。わたしは神[かみ]から出[で]て来[き]たからである。わたしは自分[じぶん]から来[き]たのではなく、その方[かた]がわたしを遣[つか]わしたのである。</j>"
  43: "<j>なぜ、あなたがたはわたしの語[かた]りを理解[りかい]しないのか。わたしの言葉[ことば]を聞[き]くことができないからである。</j>"
  44: "<j>あなたがたは悪魔[あくま]である父[ちち]から出[で]ており、その父[ちち]の欲[よく]を行[おこな]いたいと思[おも]っている。彼[かれ]は初[はじ]めから人殺[ひとごろ]しであり、真理[しんり]に立[た]っていなかった。彼[かれ]のうちに真理[しんり]がないからである。彼[かれ]が偽[いつわ]りを語[かた]るとき、自分[じぶん]のものから語[かた]っている。彼[かれ]は偽[いつわ]り者[もの]であり、その父[ちち]でもある。</j>"
  45: "<j>しかし、わたしが真理[しんり]を言[い]うので、あなたがたはわたしを信[しん]じない。</j>"
  46: "<j>あなたがたのうち、だれがわたしの罪[つみ]を指摘[してき]するのか。もしわたしが真理[しんり]を言[い]っているのなら、なぜわたしを信[しん]じないのか。</j>"
  47: "<j>神[かみ]から出[で]た者[もの]は神[かみ]の言葉[ことば]を聞[き]く。あなたがたが聞[き]かないのは、神[かみ]から出[で]た者[もの]ではないからである。</j>」"
  48: "ユダヤ人[じん]たちは答[こた]えて言[い]った。「わたしたちが、あなたはサマリア人[びと]で、悪霊[あくりょう]が憑[つ]いていると言[い]うのは、間違[まちが]っているでしょうか。」"
  49: "イエスは答[こた]えられた。「<j>わたしには悪霊[あくりょう]が憑[つ]いていない。わたしは父[ちち]を敬[うやま]っているのに、あなたがたはわたしを辱[はずかし]めている。</j>"
  50: "<j>わたしは自分[じぶん]の栄光[えいこう]を求[もと]めていない。求[もと]める者[もの]、裁[さば]く者[もの]がおられる。</j>"
  51: "<j>よくよく言[い]っておく。だれでもわたしの言葉[ことば]を守[まも]る者[もの]は、いつまでも死[し]を見[み]ない。</j>」"
  52: "ユダヤ人[じん]たちは言[い]った。「あなたに悪霊[あくりょう]が憑[つ]いていることが、今[いま]分[わ]かりました。アブラハムは死[し]にました。預言者[よげんしゃ]たちも死[し]にました。それなのに、あなたは『だれでもわたしの言葉[ことば]を守[まも]る者[もの]は、いつまでも死[し]を味[あじ]わわない』と言[い]うのですか。"
  53: "あなたは、死[し]んだわたしたちの父[ちち]アブラハムよりも大[おお]きい者[もの]なのですか。預言者[よげんしゃ]たちも死[し]にました。あなたは自分[じぶん]を何[なに]者[もの]だと思[おも]っているのですか。」"
  54: "イエスは答[こた]えられた。「<j>もしわたしが自分[じぶん]に栄光[えいこう]を求[もと]めるなら、わたしの栄光[えいこう]は何[なに]でもない。わたしに栄光[えいこう]を与[あた]える方[かた]は、あなたがたが『わたしたちの神[かみ]』と言[い]っているわたしの父[ちち]である。</j>"
  55: "<j>あなたがたはその方[かた]を知[し]っていないが、わたしはその方[かた]を知[し]っている。もし『わたしはその方[かた]を知[し]らない』と言[い]うなら、わたしはあなたがたと同[おな]じ偽[いつわ]り者[もの]になるであろう。しかし、わたしはその方[かた]を知[し]っており、その方[かた]の言葉[ことば]を守[まも]っている。</j>"
  56: "<j>あなたがたの父[ちち]アブラハムは、わたしの日[ひ]を見[み]ることを喜[よろこ]んで待[ま]ち望[のぞ]み、それを見[み]て喜[よろこ]んだ。</j>」"
  57: "ユダヤ人[じん]たちは言[い]った。「あなたはまだ五十歳[ごじゅっさい]にもならないのに、アブラハムを見[み]たのですか。」"
  58: "イエスは言[い]われた。「<j>よくよく言[い]っておく。アブラハムが生[う]まれる前[まえ]から、わたしはいる。</j>」"
  59: "そこで彼[かれ]らは石[いし]を取[と]り上[あ]げ、イエスに投[な]げつけようとした。しかしイエスは身[み]を隠[かく]して、〔その中[なか]を通[とお]って〕神殿[しんでん]から出[で]て行[い]かれた。"

notes:
  1: "Ὄρος τῶν Ἐλαιῶν — Масличная гора; オリーブ山, как в Мф 21:1 и Мк 11:1."
  4: "Речь книжников и фарисеев разорвана границей стихов: в греческом 4–5 — одно предложение, но из-за постишичных 〔…〕 цитата закрыта в 4-м и открыта в 5-м."
  6: "κατέγραφεν — имперфект «писал» (действие продолжается); 書いておられた. Что писал — не сказано, не добавлено."
  9: "В критической базе нет καὶ ὑπὸ τῆς συνειδήσεως ἐλεγχόμενοι; Церковь (Елизаветинская, jp-joc «良心に責められ») читает — 良心に責められて. Весь отрывок и так в 〔…〕, отдельных скобок нет."
  10: "В критической базе только Γύναι, ποῦ εἰσιν; Церковь читает ἐκεῖνοι οἱ κατήγοροί σου — あなたを訴えた人たち. Вопрос Христа — красный; ответ женщины (8:11) — нет."
  11: "κατακρίνω — «осуждаю»; 罪に定める, ср. 3:17. По критическому тексту отрывок кончается здесь; ст. 12 начинает новую речь."
  20: "γαζοφυλάκιον — сокровищница при храме, где стояли ящики для даров; 献金箱, как в Мк 12:41."
  24: "ἐγώ εἰμι без сказуемого — «это Я»; передано このわたしである, как в 8:28. Не «Я был»."
  25: "τὴν ἀρχήν ὅ τι καὶ λαλῶ ὑμῖν — тёмное место. τὴν ἀρχήν буквально «начало» (вин. п.); оборот допускает «от начала», «в начале», «вообще, прежде всего». Церковнославянский: «начаток»; Синодальный: «от начала Сущий»; jp-joc: «我は始より爾に言ふ所の如き者なり». В тексте — «初めから、わたしがあなたがたに語っているとおりの者である», без сглаживания; многозначность объяснена сноской ⟨…⟩ при «初めから»."
  28: "ἐγώ εἰμι без сказуемого — このわたしである. «Когда вознесёте Сына Человеческого» — о кресте, как в 3:14; 上げる оставлено буквально."
  37: "8:37 продолжает ту же речь, что 34–36; по-японски цитата не прерывается, новый абзац начинается без 「."
  41: "τοῦ πατρὸς ὑμῶν — «отца вашего»; кто он, откроется в 44-м. Не уточнено."
  44: "πατὴρ αὐτοῦ — «отец его»; в греческом можно понять и как «отец лжи». Двусмысленность сохранена: その父でもある. Не сглажено."
  58: "ἐγὼ εἰμί без сказуемого — わたしはいる (не «был»), ср. Исх 3:14. πρὶν Ἀβραὰμ γενέσθαι — «прежде нежели был Авраам»; 生まれる前から."
  59: "В критической базе только ἐκρύβη καὶ ἐξῆλθεν; Церковь (Елизаветинская «прошед посреде их», jp-joc «其の中を過ぎ») читает διελθὼν διὰ μέσου αὐτῶν — 〔その中を通って〕. «Взяли камни» — буквально 石を取り上げ."
