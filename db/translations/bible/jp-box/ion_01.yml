# jp-box, Иона, глава 1. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 1 (совпадает, 16 стихов).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1 повеление идти в Ниневию; 2–3 бегство в Фарсис через Иоппию;
# 4–5 буря, молитвы моряков, спящий Иона; 6 окрик кормчего; 7 жребий падает на Иону;
# 8–9 допрос и ответ «раб Господень я»; 10 страх моряков; 11–12 «бросьте меня в море»;
# 13–14 тщетная борьба с волнами и молитва; 15 море стихает; 16 жертва и обеты.
# Голоса: 1 — формула вне кавычек; 2 — слово Господа в 「…」; 3–5, 10, 13, 15–16 —
# повествование; 6 — речь кормчего в 「…」; 7 — слова друг другу в 「…」; 8 — вопрос
# моряков в 「…」; 9 — ответ Ионы в 「…」; 11 — вопрос в 「…」; 12 — ответ Ионы в 「…»;
# 14 — молитва моряков в 「…».
# Имена: ヨナ, アミタイ (отец), ニネベ, タルシシュ (Θαρσις), ヨッパ (Ιοππη) — по корпусу.
#
