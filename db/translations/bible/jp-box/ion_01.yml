book: ion
chapter: 1
draft: true

verses:
  1: "主[しゅ]の言葉[ことば]がアミタイの子[こ]ヨナに臨[のぞ]んで言[い]った。"
  2: "「立[た]って、大[おお]きな都[みやこ]ニネベへ行[き]、その都[みやこ]に向[む]かって叫[さけ]べ。彼らの悪[あく]の叫[さけ]びがわたしの前[まえ]に上[のぼ]って来[き]たからである。」"
  3: "ヨナは主[しゅ]の前[まえ]から逃[に]げてタルシシュへ行[い]こうと立[た]ち上[あ]がり、ヨッパに下[くだ]って、タルシシュへ行[ゆ]く船[ふね]を見[み]つけた。彼はその船賃[ふなちん]を払[はら]って乗[の]り込み、主[しゅ]の前[まえ]から逃[に]げて、彼らとともにタルシシュへ渡[わた]ろうとした。"
  4: "主[しゅ]は海[うみ]に大[おお]きな風[かぜ]を起[お]こし、海[うみ]には大[おお]きな波[なみ]が立[た]ち、船[ふね]は砕[くだ]けそうになった。"
  5: "船乗[ふなの]りたちは恐[おそ]れて、それぞれ自分[じぶん]の神[かみ]に叫[さけ]び、船[ふね]の中[なか]の荷[に]を海[うみ]に投[な]げ捨[す]てて、自分[じぶん]たちを軽[かる]くしようとした。ヨナはといえば、船[ふね]の底[そこ]に下[くだ]って横[よこ]になり、いびきをかいて眠[ねむ]っていた。"
  6: "船長[せんちょう]がそばに来[き]て言[い]った。「なぜ、あなたは眠[ねむ]っているのか。起[お]きて、あなたの神[かみ]に呼[よ]びかけよ。神[かみ]がわたしたちを救[すく]い、わたしたちが滅[ほろ]びないように。」"
  7: "人[ひと]々[びと]は互[たが]いに言[い]った。「さあ、くじを引[ひ]いて、この災[わざわ]いがだれのゆえにわたしたちに起[お]こっているのかを知[し]ろう。」彼らはくじを引[ひ]き、くじはヨナに当[あ]たった。"
  8: "彼らはヨナに言[い]った。「この災[わざわ]いがだれのゆえにわたしたちに起[お]こっているのか、わたしたちに告[つ]げよ。あなたの仕事[しごと]は何[なに]か。どこから来[き]たのか。どこへ行[ゆ]くのか。どの国[くに]の、どの民[たみ]の者[もの]なのか。」"
  9: "彼は言[い]った。「わたしは主[しゅ]のしもべである。わたしは、海[うみ]と陸[りく]を造[つく]られた天[てん]の神[かみ]、主[しゅ]を崇[あが]めている。」"
  10: "人[ひと]々[びと]は大[おお]いに恐[おそ]れて彼に言[い]った。「なぜ、あなたはこんなことをしたのか。」ヨナが主[しゅ]の前[まえ]から逃[に]げていることを、彼らは知[し]ったからである。ヨナがそのことを彼らに告[つ]げていたからである。"
  11: "彼らは言[い]った。「あなたのために、わたしたちは何[なに]をすれば、海[うみ]がわたしたちから静[しず]まるのか。」海[うみ]はますます荒[あ]れていたからである。"
  12: "彼は言[い]った。「わたしを取[と]って海[うみ]に投[な]げ込[こ]め。そうすれば海[うみ]はあなたがたから静[しず]まる。わたしのゆえに、この大[おお]きな荒[あ]れがあなたがたに来[き]たことを、わたしは知[し]っている。」"
  13: "人[ひと]々[びと]は陸[りく]へ戻[もど]ろうと努[つと]めたが、できなかった。海[うみ]がますます彼らに荒[あ]れ立[た]っていたからである。"
  14: "彼らは主[しゅ]に叫[さけ]んで言[い]った。「どうか、主[しゅ]よ。この人[ひと]の魂[たましい]のゆえに、わたしたちを滅[ほろ]ぼさないでほしい。わたしたちの上[うえ]に正[ただ]しい血[ち]を負[お]わせないでほしい。主[しゅ]よ、あなたは望[のぞ]まれたとおりになさったのだから。」"
  15: "彼らはヨナを取[と]って海[うみ]に投[な]げ込[こ]んだ。すると、海[うみ]はその荒[あ]れをやめた。"
  16: "人[ひと]々[びと]は主[しゅ]を大[おお]いに恐[おそ]れ、主[しゅ]に犠[ぎ]牲[せい]をささげ、誓[ちか]いを立[た]てた。"

notes:
  1: "Καὶ ἐγένετο λόγος κυρίου πρὸς Ιωναν τὸν τοῦ Αμαθι λέγων — «и было слово Господне к Ионе, сыну Амафиину, говоря» (слав. «ко ионе сыну амафиину, глаголя»). Имя отца в LXX Αμαθι (слав. «амафиин»); в тексте アミタイ — как в 4 Цар 14:25 по корпусу."
  2: "Ἀνάστηθι καὶ πορεύθητι — «встань и иди»; εἰς Νινευη τὴν πόλιν τὴν μεγάλην — «в Ниневию, город великий»; κήρυξον ἐν αὐτῇ — «проповедуй в нём» (слав. «проповеждь в нем»); ἀνέβη ἡ κραυγὴ τῆς κακίας αὐτῆς πρός με — «взошёл вопль злобы его ко Мне» (κραυγή — вопль, крик; слав. «взыде вопль злобы его ко мне»)."
  3: "ἀνέστη Ιωνας τοῦ φυγεῖν — «встал Иона, чтобы бежать» (τοῦ + inf. — цель); εἰς Θαρσις — «в Фарсис» (タルシシュ по корпусу); ἐκ προσώπου κυρίου — «от лица Господня», в стихе повторено дважды; κατέβη εἰς Ιοππην — «сошёл в Иоппию» (ヨッパ по корпусу); ἔδωκεν τὸ ναῦλον — «дал плату за провоз» (ναῦλον — плата за проезд; слав. «даде наем свой»)."
  4: "ἐξήγειρεν πνεῦμα εἰς τὴν θάλασσαν — «воздвиг дух (ветер) на море» (слав. «воздвиже ветр велий на мори» — «великий», в LXX этого слова нет; по паритету внесено в основной текст без 〔…〕); κλύδων μέγας — «великое волнение»; τὸ πλοῖον ἐκινδύνευεν συντριβῆναι — «корабль подвергался опасности разбиться»."
  5: "οἱ ναυτικοί — «корабельщики» (ναυτικός — мореход); ἀνεβόων ἕκαστος πρὸς τὸν θεὸν αὐτῶν — «взывали каждый к своему богу»; ἐκβολὴν ἐποιήσαντο τῶν σκευῶν τῶν ἐν τῷ πλοίῳ — «сделали выброс снаряжения, что в корабле» (σκεῦος — вещь, груз); τοῦ κουφισθῆναι ἀπ᾿ αὐτῶν — «чтобы облегчиться от них»; εἰς τὴν κοίλην τοῦ πλοίου — «во внутренность (трюм) корабля» (κοίλη — полость); ἐκάθευδεν καὶ ἔρρεγχεν — «спал и храпел»."
  6: "ὁ πρωρεύς — «кормчий» (букв. носовой, передний матрос; слав. «кормчий»); Τί σὺ ῥέγχεις — «что ты храпишь?»; ἐπικαλοῦ τὸν θεόν σου — «воззови к Богу твоему»; ὅπως διασώσῃ ὁ θεὸς ἡμᾶς — «чтобы Бог спас нас»; μὴ ἀπολώμεθα — «да не погибнем»."
  7: "Δεῦτε βάλωμεν κλήρους — «пойдём, бросим жребии» (слав. «вержим жребия»); τίνος ἕνεκεν ἡ κακία αὕτη ἐστὶν ἐν ἡμῖν — «за кого (из-за кого) зло это в нас»; ἔπεσεν ὁ κλῆρος ἐπὶ Ιωναν — «пал жребий на Иону»."
  8: "Ἀπάγγειλον ἡμῖν τίνος ἕνεκεν — «возвести нам, за кого»; τίς σου ἡ ἐργασία ἐστίν — «какое твоё дело (занятие)»; καὶ πόθεν ἔρχῃ — «и откуда идёшь»; ἐκ ποίας χώρας καὶ ἐκ ποίου λαοῦ εἶ σύ — «из какой страны и из какого народа ты». Слав. добавляет «и камо идеши» («и куда идёшь») — в LXX этого нет; по паритету внесено в основной текст без 〔…〕."
  9: "Δοῦλος κυρίου ἐγώ εἰμι — «раб Господень я» (слав. «раб Господень есмь аз»); в ru/МТ здесь «я Еврей», но LXX и слав. читают «раб Господень», поэтому в тексте 主のしもべ. τὸν κύριον θεὸν τοῦ οὐρανοῦ ἐγὼ σέβομαι — «Господа Бога небесного я чту» (σέβομαι — чтить, благоговеть); ὃς ἐποίησεν τὴν θάλασσαν καὶ τὴν ξηράν — «Который сотворил море и сушу»."
  10: "φόβον μέγαν — «страхом великим»; Τί τοῦτο ἐποίησας — «что это ты сделал?»; ὅτι ἔγνωσαν οἱ ἄνδρες ὅτι ἐκ προσώπου κυρίου ἦν φεύγων — «ибо узнали эти мужи, что он бежит от лица Господня»; ὅτι ἀπήγγειλεν αὐτοῖς — «потому что он возвестил им»."
  11: "Τί σοι ποιήσωμεν — «что тебе сделаем»; καὶ κοπάσει ἡ θάλασσα ἀφ᾽ ἡμῶν — «и утихнет море от нас» (κοπάζω — утихать); ἡ θάλασσα ἐπορεύετο καὶ ἐξήγειρεν μᾶλλον κλύδωνα — «море шло и поднимало тем большее волнение» (слав. «море восхождаше и воздвизаше паче волнение»)."
  12: "Ἄρατέ με καὶ ἐμβάλετέ με εἰς τὴν θάλασσαν — «возьмите меня и бросьте меня в море»; κοπάσει ἡ θάλασσα ἀφ᾽ ὑμῶν — «утихнет море от вас» (2 л. мн. ч. — к морякам); δι᾽ ἐμὲ ὁ κλύδων ὁ μέγας οὗτος ἐφ᾽ ὑμᾶς ἐστιν — «ради меня волнение это великое на вас»."
  13: "παρεβιάζοντο οἱ ἄνδρες τοῦ ἐπιστρέψαι πρὸς τὴν γῆν — «мужи усиливались (налегали), чтобы возвратиться к земле» (παρεβιάζοντο — принуждали себя, налегали на вёсла; слав. «нуждахуся»); οὐκ ἠδύναντο — «не могли»; ἐξηγείρετο μᾶλλον ἐπ᾽ αὐτούς — «поднималось тем более на них»."
  14: "Μηδαμῶς, κύριε — «никак, Господи» (слав. «никакоже, Господи»); μὴ ἀπολώμεθα ἕνεκεν τῆς ψυχῆς τοῦ ἀνθρώπου τούτου — «да не погибнем ради души человека сего»; μὴ δῷς ἐφ᾽ ἡμᾶς αἷμα δίκαιον — «не возложи на нас крови праведной» (αἷμα δίκαιον — невинная кровь; слав. «крове праведныя»); ὃν τρόπον ἐβούλου πεποίηκας — «как Ты хотел, так и сделал»."
  15: "ἔλαβον τὸν Ιωναν καὶ ἐξέβαλον αὐτὸν εἰς τὴν θάλασσαν — «взяли Иону и выбросили его в море»; ἔστη ἡ θάλασσα ἐκ τοῦ σάλου αὐτῆς — «стало море от волнения своего» (σάλος — волнение, качка; слав. «преста море от волнения своего»)."
  16: "ἐφοβήθησαν οἱ ἄνδρες φόβῳ μεγάλῳ τὸν κύριον — «убоялись мужи страхом великим Господа»; ἔθυσαν θυσίαν τῷ κυρίῳ — «принесли жертву Господу»; εὔξαντο εὐχάς — «дали обеты» (слав. «помолишася молитвами»)."
