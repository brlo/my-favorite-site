verses:
  1: "アブラムの妻[つま]サライは、彼[かれ]に子[こ]を産[う]まなかった。彼女[かのじょ]にはエジプト人[じん]の女奴隷[おんなどれい]がいて、名[な]をハガルといった。"
  2: "サライはアブラムに言[い]った。「見[み]よ、主[しゅ]はわたしが産[う]むことを閉[と]ざされた。わたしの女奴隷[おんなどれい]のところへ入[はい]れ。あなたが彼女[かのじょ]によって子[こ]をもうけるために。」アブラムはサライの声[こえ]に従[したが]った。"
  3: "アブラムの妻[つま]サライは、自分[じぶん]の女奴隷[おんなどれい]であるエジプト人[じん]ハガルを、アブラムがカナンの地[ち]に住[す]んでから十年後[じゅうねんご]に、夫[おっと]であるアブラムに妻[つま]として与[あた]えた。"
  4: "彼[かれ]はハガルのところへ入[はい]り、彼女[かのじょ]は身[み]ごもった。彼女[かのじょ]は自分[じぶん]が身[み]ごもったのを見[み]て、女主[おんなあるじ]は彼女[かのじょ]の前[まえ]で辱[はずか]しめられた。"
  5: "サライはアブラムに言[い]った。「わたしはあなたから不当[ふとう]に扱[あつか]われている。わたしは自分[じぶん]の女奴隷[おんなどれい]をあなたのふところに与[あた]えた。彼女[かのじょ]は自分[じぶん]が身[み]ごもったのを見[み]て、わたしは彼女[かのじょ]の前[まえ]で辱[はずか]しめられた。神[かみ]がわたしとあなたとの間[あいだ]を裁[さば]かれるように。」"
  6: "アブラムはサライに言[い]った。「見[み]よ、あなたの女奴隷[おんなどれい]はあなたの手[て]にある。あなたが良[よ]いと思[おも]うように、彼女[かのじょ]にせよ。」サライは彼女[かのじょ]を苦[くる]しめ、彼女[かのじょ]はサライの前[まえ]から逃[に]げた。"
  7: "主[しゅ]の天使[てんし]が、荒野[こうや]の水[みず]の泉[いずみ]のそば、スルの道[みち]にある泉[いずみ]のところで、彼女[かのじょ]を見[み]つけた。"
  8: "主[しゅ]の天使[てんし]は言[い]った。「サライの女奴隷[おんなどれい]ハガルよ、あなたはどこから来[き]て、どこへ行[ゆ]くのか。」彼女[かのじょ]は言[い]った。「わたしは女主[おんなあるじ]サライの前[まえ]から逃[に]げている。」"
  9: "主[しゅ]の天使[てんし]は彼女[かのじょ]に言[い]った。「あなたの女主[おんなあるじ]のところへ帰[かえ]り、その手[て]の下[した]に身[み]を低[ひく]くせよ。」"
  10: "主[しゅ]の天使[てんし]は彼女[かのじょ]に言[い]った。「わたしはあなたの子孫[しそん]を大[おお]いに増[ふ]やす。その多[おお]さのために、数[かぞ]えられなくなる。」"
  11: "主[しゅ]の天使[てんし]は彼女[かのじょ]に言[い]った。「見[み]よ、あなたは身[み]ごもっていて、男[おとこ]の子[こ]を産[う]む。その名[な]をイシュマエルと名[な]づけよ。主[しゅ]があなたの辱[はずか]しめを聞[き]かれたからである。"
  12: "彼[かれ]は野[の]の人[ひと]となる。彼[かれ]の手[て]はすべての者[もの]に及[およ]び、すべての者[もの]の手[て]は彼[かれ]に及[およ]ぶ。彼[かれ]はすべての兄弟[きょうだい]の前[まえ]に住[す]む。」"
  13: "ハガルは、自分[じぶん]に語[かた]られた主[しゅ]の名[な]を呼[よ]んで言[い]った。「あなたは、わたしに目[め]を留[と]めてくださる神[かみ]である。」なぜなら、彼女[かのじょ]は言[い]った。「わたしは、自分[じぶん]に現[あらわ]れた方[かた]を、ここで見[み]たのだから。」"
  14: "それゆえ、その井戸[いど]は、わたしがその前[まえ]で見[み]た方[かた]の井戸[いど]と呼[よ]ばれた。見[み]よ、それはカデスとバラドの間[あいだ]にある。"
  15: "ハガルはアブラムに男[おとこ]の子[こ]を産[う]んだ。アブラムは、ハガルが産[う]んだ自分[じぶん]の子[こ]の名[な]をイシュマエルと名[な]づけた。"
  16: "アブラムは、ハガルがアブラムにイシュマエルを産[う]んだとき、八十六歳[はちじゅうろくさい]であった。"

notes:
  1: "Σαρα δὲ ἡ γυνὴ Αβραμ οὐκ ἔτικτεν αὐτῷ — アブラムの妻サライは彼に子を産まなかった (τίκτω). παιδίσκη Αἰγυπτία — エジプト人の女奴隷 (παιδίσκη — «служанка, рабыня»). ᾗ ὄνομα Αγαρ — 名をハガルといった."
  2: "συνέκλεισέν με κύριος τοῦ μὴ τίκτειν — 主はわたしが産むことを閉ざされた (συγκλείω — «заключать»). εἴσελθε πρὸς τὴν παιδίσκην μου — 女奴隷のところへ入れ. ἵνα τεκνοποιήσῃς ἐξ αὐτῆς — あなたが彼女によって子をもうけるために (τεκνοποιέω, 2-е л. ед. ч.). ὑπήκουσεν δὲ Αβραμ τῆς φωνῆς Σαρας — アブラムはサライの声に従った."
  3: "λαβοῦσα… ἔδωκεν αὐτὴν Αβραμ τῷ ἀνδρὶ αὐτῆς αὐτῷ γυναῖκα — 夫であるアブラムに妻として与えた. μετὰ δέκα ἔτη τοῦ οἰκῆσαι Αβραμ ἐν γῇ Χανααν — アブラムがカナンの地に住んでから十年後に."
  4: "εἰσῆλθεν πρὸς Αγαρ — ハガルのところへ入り. συνέλαβεν — 身ごもった (συλλαμβάνω). ἠτιμάσθη ἡ κυρία ἐναντίον αὐτῆς — 女主は彼女の前で辱められた (LXX пассив: «госпожа была обесчещена пред нею»; масор. «госпожа стала презренной в её глазах»)."
  5: "Ἀδικοῦμαι ἐκ σοῦ — わたしはあなたから不当に扱われている (ἀδικέω — «обижать»). εἰς τὸν κόλπον σου — あなたのふところに (κόλπος). ἠτιμάσθην ἐναντίον αὐτῆς — わたしは彼女の前で辱められた. κρίναι ὁ θεὸς ἀνὰ μέσον ἐμοῦ καὶ σοῦ — 神がわたしとあなたとの間を裁かれるように (в LXX ὁ θεός; в масор. «Господь»)."
  6: "ἡ παιδίσκη σου ἐν ταῖς χερσίν σου — あなたの女奴隷はあなたの手にある. χρῶ αὐτῇ, ὡς ἄν σοι ἀρεστὸν ᾖ — あなたが良いと思うように彼女にせよ (χράομαι — «обращаться»). ἐκάκωσεν αὐτὴν Σαρα — サライは彼女を苦しめた (κακόω). ἀπέδρα ἀπὸ προσώπου αὐτῆς — 彼女の前から逃げた."
  7: "εὗρεν αὐτὴν ἄγγελος κυρίου — 主の天使が彼女を見つけた. ἐπὶ τῆς πηγῆς τοῦ ὕδατος — 水の泉のそば (πηγή). ἐν τῇ ὁδῷ Σουρ — スルの道に."
  8: "Αγαρ παιδίσκη Σαρας — サライの女奴隷ハガル. πόθεν ἔρχῃ καὶ ποῦ πορεύῃ — どこから来て、どこへ行くのか. ἀποδιδράσκω — 逃げている."
  9: "Ἀποστράφητι πρὸς τὴν κυρίαν σου — 女主のところへ帰り. ταπεινώθητι ὑπὸ τὰς χεῖρας αὐτῆς — その手の下に身を低くせよ."
  10: "Πληθύνων πληθυνῶ τὸ σπέρμα σου — わたしはあなたの子孫を大いに増やす (гебраизм «умножая умножу»). οὐκ ἀριθμηθήσεται ἀπὸ τοῦ πλήθους — その多さのために数えられない."
  11: "τέξῃ υἱόν — 男の子を産む. καλέσεις τὸ ὄνομα αὐτοῦ Ισμαηλ — その名をイシュマエルと名づけよ. ἐπήκουσεν κύριος τῇ ταπεινώσει σου — 主があなたの辱しめを聞かれた (ταπείνωσις — «унижение»; тот же корень, что в 16:4–5)."
  12: "ἄγροικος ἄνθρωπος — 野の人 (ἄγροικος — «живущий в поле, дикий»). αἱ χεῖρες αὐτοῦ ἐπὶ πάντας — 彼の手はすべての者に及び. κατὰ πρόσωπον πάντων τῶν ἀδελφῶν αὐτοῦ κατοικήσει — すべての兄弟の前に住む."
  13: "ἐκάλεσεν τὸ ὄνομα κυρίου τοῦ λαλοῦντος πρὸς αὐτὴν — 自分に語られた主の名を呼んで. Σὺ ὁ θεὸς ὁ ἐπιδών με — あなたは、わたしに目を留めてくださる神である (ἐφοράω — «призирать»). ἐνώπιον εἶδον ὀφθέντα μοι — わたしは自分に現れた方をここで見た."
  14: "Φρέαρ οὗ ἐνώπιον εἶδον — わたしがその前で見た方の井戸 (т. е. «колодезь Видящего меня»; масор. Беэр-лахай-рои). ἀνὰ μέσον Καδης καὶ ἀνὰ μέσον Βαραδ — カデスとバラドの間に."
  15: "ἔτεκεν Αγαρ τῷ Αβραμ υἱόν — ハガルはアブラムに男の子を産んだ. ἐκάλεσεν Αβραμ τὸ ὄνομα… Ισμαηλ — アブラムは…イシュマエルと名づけた."
  16: "ὀγδοήκοντα ἓξ ἐτῶν — 八十六歳. ἡνίκα ἔτεκεν Αγαρ τὸν Ισμαηλ — ハガルがイシュマエルを産んだとき."
