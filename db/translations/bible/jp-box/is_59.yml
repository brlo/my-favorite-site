verses:
  1: "主[しゅ]の手[て]が救[すく]うのに弱[よわ]いわけではない。主[しゅ]の耳[みみ]が聞[き]くのに重[おも]くなったのでもない。"
  2: "しかし、あなたがたの罪[つみ]があなたがたと神[かみ]との間[あいだ]を隔[へだ]て、あなたがたの罪[つみ]のゆえに、神[かみ]はあなたがたから顔[かお]を背[そむ]けて、あわれまない。"
  3: "あなたがたの手[て]は血[ち]で汚[けが]れ、あなたがたの指[ゆび]は罪[つみ]のうちにあり、あなたがたの唇[くちびる]は不法[ふほう]を語[かた]り、あなたがたの舌[した]は不正[ふせい]を考[かんが]えている。"
  4: "だれも正[ただ]しいことを語[かた]らず、真実[しんじつ]の裁[さば]きはない。彼[かれ]らは空[むな]しいものに頼[たよ]り、むだなことを語[かた]る。彼らは苦[くる]しみを宿[やど]し、不法[ふほう]を産[う]むからである。"
  5: "彼[かれ]らは毒蛇[どくじゃ]の卵[たまご]を割[わ]り、蜘蛛[くも]の巣[す]を織[お]る。その卵[たまご]を食[た]べようとする者[もの]は、これを割[わ]ると空[から]の卵[たまご]を見[み]いだし、その中[なか]に毒蛇[どくじゃ]がいる。"
  6: "彼[かれ]らの織[お]ったものは着物[きもの]にならず、彼らは自分[じぶん]の作[つく]ったもので身[み]を覆[おお]えない。彼らの行[おこな]いは不法[ふほう]の行[おこな]いだからである。"
  7: "彼[かれ]らの足[あし]は悪[あく]へと走[はし]り、血[ち]を流[なが]すことに速[はや]い。彼らの思[おも]いは人[ひと]を殺[ころ]す思[おも]いであり、破壊[はかい]と悲惨[ひさん]が彼らの道[みち]にある。"
  8: "彼[かれ]らは平和[へいわ]の道[みち]を知[し]らない。彼らの道[みち]には裁[さば]きがない。彼らの小道[こみち]は曲[ま]がり、彼らはそこを通[とお]りながら平和[へいわ]を知らない。"
  9: "「それゆえ、裁[さば]きは彼[かれ]らから遠[とお]ざかり、義[ぎ]は彼らに届[とど]かない。彼らが光[ひかり]を待[ま]っても、彼らには暗[くら]さとなり、明[あか]るさを待[ま]っても、彼らは暗[くら]やみの中[なか]を歩[あゆ]んだ。"
  10: "彼[かれ]らは盲人[もうじん]のように壁[かべ]を手[て]で探[さぐ]り、目[め]のない者のように手探[てさぐ]りをする。彼らは真昼[まひる]に、真夜中[まよなか]のように倒[たお]れ、死[し]ぬ者[もの]のように呻[うめ]く。"
  11: "彼[かれ]らは熊[くま]のように、鳩[はと]のようにともに歩[あゆ]む。わたしたちは裁[さば]きを待[ま]ったが、それはなく、救[すく]いはわたしたちから遠[とお]く離[はな]れた。"
  12: "わたしたちの不法[ふほう]はあなたの前[まえ]に多[おお]く、わたしたちの罪[つみ]はわたしたちに逆[さか]らった。わたしたちの不法[ふほう]はわたしたちのうちにあり、わたしたちは自分[じぶん]の不正[ふせい]を知[し]っている。"
  13: "わたしたちは不敬[ふけい]を行[おこな]い、偽[いつわ]りを言[い]い、わたしたちの神[かみ]の後[あと]から離[はな]れた。わたしたちは不正[ふせい]を語[かた]り、不従順[ふじゅうじゅん]であった。わたしたちは心[こころ]から不正[ふせい]な言葉[ことば]を宿[やど]し、思[おも]いめぐらした。"
  14: "わたしたちは裁[さば]きを後[うし]ろに退[しりぞ]け、義[ぎ]は遠[とお]く離[はな]れた。真理[しんり]は彼[かれ]らの道[みち]で消[き]え失[う]せ、まっすぐな道[みち]を通[とお]ることができなかったからである。」"
  15: "真理[しんり]は取[と]り去[さ]られ、彼[かれ]らは悟[さと]る心[こころ]を遠[とお]ざけた。主[しゅ]はこれを見[み]て、裁[さば]きがないことを喜[よろこ]ばれなかった。"
  16: "主[しゅ]は見[み]たが、そこに人[ひと]はいなかった。だれも助[たす]ける者[もの]がないのを悟[さと]り、ご自分[じぶん]の腕[うで]で彼[かれ]らを守[まも]り、ご自分[じぶん]のあわれみによって彼らを支[ささ]えられた。"
  17: "主[しゅ]は義[ぎ]を鎧[よろい]のように身[み]に着[つ]け、救[すく]いの兜[かぶと]を頭[あたま]に着[き]、復讐[ふくしゅう]の衣[ころも]をまとい、外套[がいとう]を身[み]にまとわれた。"
  18: "敵対[てきたい]する者[もの]に辱[はずかし]めをもって報[むく]いを返[かえ]される。"
  19: "西[にし]から来[く]る者[もの]たちは主[しゅ]の名[な]を恐[おそ]れ、日[ひ]の昇[のぼ]る東[ひがし]から来[く]る者たちは主の栄光[えいこう]ある名[な]を恐れる。主[しゅ]からの怒[いか]りは激[はげ]しい川[かわ]のように来[き]て、憤[いきどお]りとともに来るからである。"
  20: "シオンのために、救[すく]い出[だ]す者[もの]が来[き]て、ヤコブから不敬[ふけい]を遠[とお]ざけられる。"
  21: "主[しゅ]は言[い]われる。「これが、わたしから彼らへの契約[けいやく]である。あなたの上[うえ]にあるわたしの霊[れい]と、わたしがあなたの口[くち]に授[さず]けたわたしの言葉[ことば]は、あなたの口から、またあなたの子孫[しそん]の口から、今[いま]から永遠[えいえん]に至[いた]るまで離[はな]れない」と主[しゅ]は言[い]われた。"

notes:
  1: "Μὴ οὐκ ἰσχύει ἡ χεὶρ κυρίου — «разве не сильна рука Господня» (ἰσχύω; μὴ οὐκ — вопрос с ожиданием «да»); ἐβάρυνεν τὸ οὖς — «отягчил слух» (βαρύνω); τοῦ μὴ εἰσακοῦσαι — «чтобы не услышать» (εἰσακούω). В ru/МТ «не сократилась» (по евр.), в LXX «не ослабела»; ru также добавляет «Вот» — в LXX и слав. его нет."
  2: "τὰ ἁμαρτήματα ὑμῶν διιστῶσιν ἀνὰ μέσον — «грехи ваши разделяют между» (διΐστημι); ἀπέστρεψεν τὸ πρόσωπον — «отвратил лицо»; τοῦ μὴ ἐλεῆσαι — «чтобы не помиловать» (ἐλεέω)."
  3: "μεμολυμμέναι αἵματι — «осквернены кровью» (μολύνω); δάκτυλοι — «персты»; χείλη ἐλάλησεν ἀνομίαν — «уста изрекли беззаконие»; ἀδικίαν μελετᾷ — «неправде поучается, замышляет» (μελετάω)."
  4: "πεποίθασιν ἐπὶ ματαίοις — «уповают на суетное» (πείθω; μάταιος); λαλοῦσιν κενά — «говорят тщетное» (κενός); κύουσιν πόνον — «зачинают труд (боль)» (κυέω; πόνος); τίκτουσιν ἀνομίαν — «рождают беззаконие» (τίκτω)."
  5: "ᾠὰ ἀσπίδων ἔρρηξαν — «яйца аспидов разбили» (ᾠόν, ἀσπίς, ῥήγνυμι); ἱστὸν ἀράχνης ὑφαίνουσιν — «ткут паутину» (ἱστός — ткань, основа; ἀράχνη); συντρίψας οὔριον εὗρεν — «разбив, находит болтуна (пустое яйцо)» (οὔριον — «ветряное» яйцо; слав. «запорток»); βασιλίσκος — «василиск» (передано 毒蛇[どくじゃ]; мифический змей, здесь — ядовитая змея)."
  6: "ἱστός — «ткань, основа» (слав. «постав»); οὐκ ἔσται εἰς ἱμάτιον — «не будет на одежду» (ἱμάτιον); περιβάλωνται ἀπὸ τῶν ἔργων — «не оденутся от дел своих»; ἔργα ἀνομίας — «дела беззакония»."
  7: "οἱ πόδες … ἐπὶ πονηρίαν τρέχουσιν — «ноги бегут на зло» (πονηρία); ταχινοὶ ἐκχέαι αἷμα — «быстры пролить кровь» (ταχινός, ἐκχέω); διαλογισμοὶ ἀφρόνων — в LXX «помышления безумных» (ἄφρων), в слав. «помышления о убийствах» — иное чтение, по паритету взято слав.; σύντριμμα καὶ ταλαιπωρία — «сокрушение и бедствие» (ταλαιπωρία). Цитируется в Рим 3:15–17."
  8: "ὁδὸν εἰρήνης οὐκ οἴδασιν — «пути мира не знают»; οὐκ ἔστιν κρίσις ἐν ταῖς ὁδοῖς — «нет суда на путях их»; τρίβοι διεστραμμέναι — «тропы развращены» (διαστρέφω); διοδεύουσιν — «проходят» (διοδεύω). Ср. Рим 3:17."
  9: "ἀπέστη ἡ κρίσις ἀπ᾽ αὐτῶν — «отступил суд от них»: LXX и слав. говорят о них в 3-м лице, хотя это плач народа (с 59:11 — 1-е лицо); смена лица сохранена, в ru/МТ всюду «мы». ὑπομεινάντων αὐτῶν φῶς — «когда они ждали света» (ὑπομένω); ἐγένετο αὐτοῖς σκότος — «стала им тьма»; αὐγή — «заря, сияние»; ἐν ἀωρίᾳ — «во мраке, в неурочное время»; περιεπάτησαν — «ходили»."
  10: "ψηλαφήσουσιν ὡς τυφλοὶ τοῖχον — «ощупают, как слепые, стену» (ψηλαφάω; τοῖχος); ὡς οὐχ ὑπαρχόντων ὀφθαλμῶν — «как не имеющие глаз» (ὑπάρχω); πεσοῦνται ἐν μεσημβρίᾳ ὡς ἐν μεσονυκτίῳ — «упадут в полдень, как в полночь»; στενάξουσιν — «возстенут» (στενάζω). В ru/МТ «спотыкаемся… между живыми — как мёртвые» — иное."
  11: "ὡς ἄρκος καὶ ὡς περιστερά — «как медведь и как голубь» (ἄρκος, περιστερά); ἅμα πορεύσονται — «вместе пойдут» (3-е л.); ἀνεμείναμεν — «мы ожидали» (ἀναμένω, 1-е л.); σωτηρία μακρὰν ἀφέστηκεν — «спасение далеко отступило» (ἀφίστημι). В ru/МТ «ревём, как медведи, и стонем, как голуби» — иное."
  12: "πολλὴ ἡμῶν ἡ ἀνομία — «велико беззаконие наше»; ἀντέστησαν ἡμῖν — «восстали против нас» (ἀνθίστημι); τὰ ἀδικήματα ἔγνωμεν — «неправды познали» (ἀδίκημα)."
  13: "ἠσεβήσαμεν — «нечествовали» (ἀσεβέω); ἐψευσάμεθα — «солгали»; ἀπέστημεν ἀπὸ ὄπισθεν τοῦ θεοῦ — «отступили от последования Бога» (ὄπισθεν); ἠπειθήσαμεν — «не покорились» (ἀπειθέω); ἐκύομεν — «зачали» (κυέω); ἐμελετήσαμεν λόγους ἀδίκους — «поучились словам неправедным»."
  14: "ἀπεστήσαμεν ὀπίσω τὴν κρίσιν — «отставили назад суд» (ἀφίστημι); καταναλώθη ἡ ἀλήθεια — «истреблена истина» (καταναλίσκω); δι᾽ εὐθείας οὐκ ἠδύναντο διελθεῖν — «прямым путём не могли пройти» (εὐθεῖα). Здесь закрывается исповедь."
  15: "ἡ ἀλήθεια ἦρται — «истина взята» (αἴρω); μετέστησαν τὴν διάνοιαν τοῦ συνιέναι — «отвратили ум, чтобы разуметь» (μεθίστημι; διάνοια); οὐκ ἤρεσεν αὐτῷ — «не угодно было Ему» (ἀρέσκω); ὅτι οὐκ ἦν κρίσις — «что не было суда». В ru/МТ добавлено «и удаляющийся от зла подвергается оскорблению» — в LXX и слав. нет."
  16: "εἶδεν καὶ οὐκ ἦν ἀνήρ — «увидел, и не было мужа»; ἀντιλημψόμενος — «заступник» (ἀντιλαμβάνομαι); ἠμύνατο αὐτοὺς τῷ βραχίονι — «защитил их мышцею» (ἀμύνω; слав. «мсти им» — двусмысленно, взято LXX); ἐλεημοσύνη — «милость, милосердие» (слав. «помилование»); ἐστηρίσατο — «утвердил» (στηρίζω). В ru/МТ «помогла Ему мышца… правда Его поддержала» — иное."
  17: "ἐνεδύσατο δικαιοσύνην ὡς θώρακα — «облёкся в правду, как в броню» (θώραξ — броня, панцирь; 鎧[よろい]); περικεφαλαία σωτηρίου — «шлем спасения» (περικεφαλαία; ср. Еф 6:14–17); ἱμάτιον ἐκδικήσεως — «риза отмщения» (ἐκδίκησις); περιβόλαιον — «плащ, покров» (外套[がいとう]). Слав. «одеяся правдою яко щитом» — «как щитом», иное чтение; по LXX и ради цитаты в Еф 6:14 взято «броня»."
  18: "ὡς ἀνταποδώσων ἀνταπόδοσιν — «как воздающий воздаяние» (ἀνταποδίδωμι, ἀνταπόδοσις); ὄνειδος τοῖς ὑπεναντίοις — «поношение противникам» (ὄνειδος; ὑπεναντίος). Греческий стих краток; в ru/МТ добавлено «островам воздаст должное» — нет в LXX."
  19: "οἱ ἀπὸ δυσμῶν — «те, что от запада» (δυσμή); ἀπ᾽ ἀνατολῶν ἡλίου — «от восхода солнца»; τὸ ὄνομα τὸ ἔνδοξον — «имя славное» (ἔνδοξος); ποταμὸς βίαιος — «река стремительная» (βίαιος — бурный, насильственный); ὀργή / θυμός — «гнев / ярость». В ru/МТ «если враг придёт как река…» — иное."
  20: "ἕνεκεν Σιων — «ради Сиона»; ὁ ῥυόμενος — «Избавляющий, Искупитель» (ῥύομαι); ἀποστρέψει ἀσεβείας ἀπὸ Ιακωβ — «отвратит нечестие от Иакова» (ἀσέβεια). Цитируется в Рим 11:26 («Придёт Искупитель Сиона»); ср. также Ис 27:9. В ru/МТ добавлено «и сынов Иакова, обратившихся от нечестия» — по евр."
  21: "αὕτη αὐτοῖς ἡ παρ᾽ ἐμοῦ διαθήκη — «вот завет Мой с ними» (διαθήκη); τὸ πνεῦμα τὸ ἐμόν, ὅ ἐστιν ἐπὶ σοί — «Дух Мой, Который на тебе»; ῥήματα ἃ ἔδωκα εἰς τὸ στόμα σου — «слова, которые Я дал в уста твои»; οὐ μὴ ἐκλίπῃ — «не оскудеют» (ἐκλείπω); ἀπὸ τοῦ νῦν καὶ εἰς τὸν αἰῶνα — «отныне и в век». Формулы «сказал Господь» вынесены из кавычек."
