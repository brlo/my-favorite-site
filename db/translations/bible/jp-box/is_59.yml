# jp-box, Исаия, глава 59. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный, с МТ) — только для понимания,
# не источник. jp-joc для главы отсутствует; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 59: 1–2 рука Господа не ослабела, грехи разделяют; 3–8 руки в крови, суда нет,
# пути мира не знают (цит. Рим 3:15–17); 9–15 исповедь народа: суд отступил, слепота,
# истина взята; 15–19 Господь видит, что нет заступника, облекается в правду как в броню
# (ср. Еф 6:14–17), приходит как река; 20–21 Искупитель Сиона (цит. Рим 11:26), завет
# Духа и слов.
# Голоса: 1–8 обличение без кавычек; 9–14 исповедь народа — 「…」 (в LXX и слав. в 9–10
# и начале 11 — 3-е лицо, с 11 — 1-е; смена лица сохранена); 15–20 авторский текст;
# 21 речь Господа — 「…」, формулы «говорит Господь» вынесены из кавычек.
# Нумерация по gr: 21 стих; у csl и ru тоже 21, сдвигов нет.
# Слав. добавлений, которых нет в LXX, в главе нет; расхождения чтений — в notes
# (59:7 «помышления о убийствах», 59:16 «мсти им», 59:17 «яко щитом»).
# 〔…〕 нет; сносок ⟨…⟩ нет: 鎧, 兜, 外套, 証書, 嗣業 уже в корпусе.
# Имена — транслитерация греческого (LXX).

