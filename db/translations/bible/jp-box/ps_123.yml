# jp-box, Псалтирь, псалом 123. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0.
# Псалом 123: «если бы не Господь» (1–5), избавление от зубов и сети (6–7),
# помощь в имени Господнем (8).
# Красного и синего нет. Кавычки: слова Израиля в 1–5 — 「…」 (речь замыкается в ст. 5).
# 〔…〕 нет: перевод сделан по gr-lxx-byz, добавлений Церкви не вносилось.
# セラ (διάψαλμα) в этой главе нет.
# Сносок ⟨…⟩ нет: 罠, 雀, 餌食 уже в корпусе или понятны.
# jp-ni не использовался.

tr_code: jp-box
book: ps
chapter: 123
draft: true

verses:
  0: "登[とう]上[じょう]の歌[うた]。ダビデのもの。"
  1: "イスラエルは言[い]うがよい。「もし主[しゅ]がわたしたちの味方[みかた]でなかったなら、"
  2: "人[ひと]々[びと]がわたしたちに立[た]ち向[む]かったとき、もし主[しゅ]がわたしたちの味方[みかた]でなかったなら、"
  3: "彼[かれ]らの怒[いか]りがわたしたちに向[む]かって燃[も]え上[あ]がったとき、彼[かれ]らはわたしたちを生[い]きながら呑[の]み込[こ]んだだろう。"
  4: "水[みず]はわたしたちを沈[しず]め、奔流[ほんりゅう]はわたしたちの魂[たましい]の上[うえ]を流[なが]れ過[す]ぎただろう。"
  5: "荒[あ]れ狂[くる]う水[みず]は、わたしたちの魂[たましい]の上[うえ]を流[なが]れ過[す]ぎただろう」。"
  6: "わたしたちを彼[かれ]らの歯[は]の餌食[えじき]に渡[わた]されなかった主[しゅ]は、ほめたたえられる。"
  7: "わたしたちの魂[たましい]は、鳥[とり]を捕[と]らえる者[もの]の罠[わな]から逃[のが]れた雀[すずめ]のようである。罠[わな]は砕[くだ]け、わたしたちは逃[のが]れた。"
  8: "わたしたちの助[たす]けは、天[てん]と地[ち]を造[つく]られた主[しゅ]の名[な]にある。"

notes:
  0: "Ὠιδὴ τῶν ἀναβαθμῶν — 登[とう]上[じょう]の歌. В gr-lxx-byz без имени, в ru-базе и у jp-joc — «Давида»; надписание добавлено как в ru-базе, без 〔…〕 (надписания скобками не маркируются)."
  1: "Εἰ μὴ ὅτι κύριος ἦν ἐν ἡμῖν — もし主がわたしたちの味方でなかったなら (εἰ μή — «если бы не»; ἐν ἡμῖν — «с нами, в нас», передано 味方 — «на нашей стороне»). εἰπάτω δὴ Ισραηλ — イスラエルは言うがよい (императив 3 л. с δή — призыв к исповеданию). Конструкция условного периода с ἀπόδοσις начинается здесь и завершается в ст. 5, поэтому «…» открываются в ст. 1 и закрываются в ст. 5; речь Израиля — первый уровень."
  2: "εἰ μὴ ὅτι κύριος ἦν ἐν ἡμῖν — повтор первой половины условного периода (дословный повтор сохранён, как в евр. поэзии: もし主が…でなかったなら). ἐν τῷ ἐπαναστῆναι ἀνθρώπους ἐφ' ἡμᾶς — 人々がわたしたちに立ち向かったとき (ἐπανίστημι — «восставать против»)."
  3: "ἄρα ζῶντας ἂν κατέπιον ἡμᾶς — 彼らはわたしたちを生きながら呑み込んだだろう (ζῶντας — «живыми»; καταπίνω — «проглатывать»; ἄν — признак нереального условия, отсюда だろう). ἐν τῷ ὀργισθῆναι τὸν θυμὸν αὐτῶν ἐφ' ἡμᾶς — 彼らの怒りがわたしたちに向かって燃え上がったとき (ὀργίζομαι + θυμός — «воспылать гневом»; два однокоренных слова переданы 怒り/燃え上がる)."
  4: "ἄρα τὸ ὕδωρ κατεπόντισεν ἡμᾶς — 水はわたしたちを沈め (καταποντίζω — «потопить»; ἄρα — «тогда, вот»). χείμαρρον διῆλθεν ἡ ψυχὴ ἡμῶν — 奔流はわたしたちの魂の上を流れ過ぎただろう (χείμαρρος — «поток, зимний ручей»; διέρχομαι — «проходить через»). Образ потопа; нереальное условие продолжается, поэтому だろう."
  5: "ἄρα διῆλθεν ἡ ψυχὴ ἡμῶν τὸ ὕδωρ τὸ ἀνυπόστατον — 荒れ狂う水は、わたしたちの魂の上を流れ過ぎただろう (ἀνυπόστατος — «неудержимый, неодолимый»). Повтор διέρχομαι из ст. 4 сохранён повтором 流れ過ぎる; здесь «…» закрываются."
  6: "εὐλογητὸς κύριος — 主はほめたたえられる (εὐλογητός — «благословен»; по-японски пассивное сказуемое, чтобы не вводить 文語 «かな»). ὃς οὐκ ἔδωκεν ἡμᾶς εἰς θήραν — わたしたちを…餌食に渡されなかった (θήρα — «ловля, добыча»; δίδωμι εἰς θήραν — «отдать на съедение»). τοῖς ὀδοῦσιν αὐτῶν — 彼らの歯の (ὀδούς — 歯; датив «зубам их», по-русски «в снедь зубам их»)."
  7: "ἡ ψυχὴ ἡμῶν ὡς στρουθίον ἐρρύσθη — わたしたちの魂は…雀のように逃れた (στρουθίον — «воробей, пташка»; ῥύομαι — «избавляться»). ἐκ τῆς παγίδος τῶν θηρευόντων — 鳥を捕らえる者の罠から (παγίς — 罠; θηρεύω — «ловить»). ἡ παγὶς συνετρίβη, καὶ ἡμεῖς ἐρρύσθημεν — 罠は砕け、わたしたちは逃れた (συντρίβω — «сокрушить»; повтор ῥύομαι сохранён повтором 逃れる)."
  8: "ἡ βοήθεια ἡμῶν ἐν ὀνόματι κυρίου — わたしたちの助けは…主の名にある (ἐν ὀνόματι — «в имени», т. е. в призывании имени). τοῦ ποιήσαντος τὸν οὐρανὸν καὶ τὴν γῆν — 天と地を造られた方 (та же формула Творца, что 120:2; 133:3)."
