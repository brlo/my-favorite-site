# jp-box, 3-я Царств, глава 16. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); второй свидетель церковного текста —
# церковнославянский (csl-ru), по новому паритету (docs/japanese-bible.md,
# «Паритет LXX и церковнославянского»); ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге нет; jp-ni (под авторским правом) не использовался.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 16: пророчество Иуя о доме Ваасы (1–7); Ила и заговор Замврия (8–14);
# Замврий и его гибель (15–20); разделение народа и царствование Амврия (21–28);
# в LXX сюда же вставлен отдел об Иосафате (28a, 29–33), а ст. 34 соединяет
# конец истории Иосафата (МТ 22:49–50) с началом царствования Ахава (МТ 16:29–34).
# Речи — 「…」: Господь (2–4), народ в стане (16), царь Израиля (34).
# Красного нет.
# Нумерация по gr: 34 стиха. У csl тоже 34 стиха, но порядок иной: csl 16:29–34 —
# это Ахав (МТ 16:29–34), а отдел об Иосафате (28a, 29–33) в слав. стоит в гл. 22.
# Поэтому в ст. 29–33 переведён греческий текст об Иосафате, а ахавовский материал
# (csl 16:29–33) — в ст. 34, где он стоит в LXX. Слав. чтения внесены в основной
# текст: 16:1 «глаголя», 16:3 «отвергу наследие», 16:7 «пророка», 16:9 «воздвиже…»,
# 16:11 «не остави…», 16:12 «изби весь дом», 16:10 и 15 «в лето 27-е»,
# 16:29 «в лето 38-е Асы», 16:33 «разгневати Господа Бога израилева»;
# LXX-варианты — в notes.
# 〔…〕 нет.
# Сносок ⟨…⟩ нет: 神殿, 祭壇, 預言者, 高[たか]い所[ところ], 木立[こだち] уже в корпусе.

