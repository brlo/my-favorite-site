verses:
  1: "主[しゅ]の言葉[ことば]が、ハナニの子[こ]イエフによってバシャに臨[のぞ]んだ。こう告[つ]げられた。"
  2: "「わたしはあなたを土[つち]から高[たか]め、わたしの民[たみ]イスラエルの上[うえ]に指導者[しどうしゃ]としたのに、あなたはヤロブアムの道[みち]を歩[あゆ]み、わたしの民イスラエルを罪[つみ]に陥[おとしい]れて、その空[むな]しいものによってわたしを怒[いか]らせた。"
  3: "見[み]よ、わたしはバシャとその家[いえ]の後[あと]を退[しりぞ]け、あなたの家を、ナバトの子[こ]ヤロブアムの家のようにする。"
  4: "バシャに属[ぞく]する死者[ししゃ]が町[まち]で死[し]ねば犬[いぬ]が食[く]らい、野[の]で死ねば空[そら]の鳥[とり]が食らう。」"
  5: "バシャのほかの事柄[ことがら]、彼[かれ]が行[おこな]ったすべてのこと、およびその功績[こうせき]は、イスラエルの王[おう]たちの日々[ひび]の記録[きろく]に記[しる]されているではないか。"
  6: "バシャは父[ちち]たちとともに眠[ねむ]り、テルサに葬[ほうむ]られた。その子[こ]エラが彼[かれ]に代[か]わって王[おう]となった。アサ王[おう]の第二十六年[だいにじゅうろくねん]のことであった。"
  7: "主[しゅ]はまた、預言者[よげんしゃ]ハナニの子イエフによって、バシャとその家[いえ]に対して語られた。それは、彼が主の前[まえ]で行ったすべての悪[あく]、すなわち、自分[じぶん]の手[て]の業[わざ]によって主を怒らせ、ヤロブアムの家のようになったことのゆえであり、また彼が打[う]たれたことのゆえであった。"
  8: "エラはバシャの子[こ]で、テルサで二年[にねん]の間[あいだ]、イスラエルの王[おう]であった。"
  9: "彼[かれ]のしもべたちが彼に逆[さか]らい、騎兵[きへい]の半分[はんぶん]を率[ひき]いるジムリが彼に対して謀反[むほん]を起[お]こした。エラはテルサで、家令[かれい]アルサの家[いえ]で酒[さけ]を飲み、酔[よ]っていた。"
  10: "ジムリは入[はい]って来[き]て彼を打[う]ち、殺[ころ]した。アサの第二十七年[だいにじゅうななねん]のことであった。そして彼に代[か]わって王[おう]となった。"
  11: "彼が王となって、その王座[おうざ]に座[すわ]ると、バシャの家[いえ]をことごとく打[う]った。壁[かべ]に向[む]かって放[はな]つ者[もの]さえも、親族[しんぞく]も友人[ゆうじん]も、一人[ひとり]も残[のこ]さなかった。"
  12: "こうしてジムリは、主[しゅ]が預言者[よげんしゃ]イエフによってバシャの家について語られた言葉[ことば]のとおりに、バシャの家を滅[ほろ]ぼした。"
  13: "これは、バシャとその子[こ]エラのすべての罪[つみ]のゆえであり、彼らがイスラエルを罪に陥[おとしい]れ、その空[むな]しいものによって、イスラエルの神[かみ]である主を怒[いか]らせたことのゆえであった。"
  14: "エラのほかの事柄[ことがら]、彼が行[おこな]ったすべてのことは、イスラエルの王[おう]たちの日々[ひび]の記録[きろく]に記[しる]されているではないか。"
  15: "アサの第二十七年[だいにじゅうななねん]、ジムリはテルサで七日[なのか]の間[あいだ]王[おう]であった。そのとき、イスラエルの軍[ぐん]はペリシテ人[じん]のギベトンに陣[じん]を敷[し]いていた。"
  16: "陣営[じんえい]の民[たみ]は、「ジムリが謀反[むほん]を起[お]こし、王[おう]を打[う]った」と言[い]うのを聞[き]いた。そこでその日[ひ]、陣営で、民は皆[みな]、軍[ぐん]の長[ちょう]であるオムリをイスラエルの王[おう]とした。"
  17: "オムリと、彼とともにいたイスラエルのすべての者[もの]は、ギベトンから上[のぼ]って来[き]て、テルサを包囲[ほうい]した。"
  18: "ジムリは、町[まち]が取[と]られたのを見[み]ると、王[おう]の家[いえ]の奥[おく]の間[ま]に入[はい]り、王の家に火[ひ]を放[はな]って、自分[じぶん]もその火の中[なか]で死[し]んだ。"
  19: "これは彼の罪[つみ]のゆえであった。彼は主[しゅ]の前[まえ]に悪[あく]を行[おこな]い、ヤロブアムの道[みち]を歩[あゆ]み、ヤロブアムがイスラエルを罪に陥[おとしい]れたその罪の中を歩んだからである。"
  20: "ジムリのほかの事柄[ことがら]と、彼が企[くわだ]てたその謀[はかりごと]は、イスラエルの王[おう]たちの日々[ひび]の記録[きろく]に記[しる]されているではないか。"
  21: "そのとき、イスラエルの民[たみ]は二[ふた]つに分[わ]かれた。民の半分[はんぶん]は、ゴナトの子[こ]タムニを王[おう]にしようとして彼に従[したが]い、民の半分はオムリに従[したが]った。"
  22: "オムリにつく民[たみ]は、ゴナトの子タムニにつく民に勝[か]った。タムニとその兄弟[きょうだい]ヨラムはそのころ死[し]に、オムリがタムニに代[か]わって王[おう]となった。"
  23: "アサ王[おう]の第三十一年[だいさんじゅういちねん]に、オムリはイスラエルの王となり、十二年[じゅうにねん]の間[あいだ]王であった。テルサでは六年[ろくねん]の間[あいだ]王であった。"
  24: "オムリは、銀[ぎん]二[に]タラントで、山[やま]の持[も]ち主[ぬし]セメルからセメロンの山を買[か]い、その山を築[きず]いた。そして、自分[じぶん]が築いた山の名[な]を、山の持ち主セメルの名にちなんでサエメロンと名[な]づけた。"
  25: "オムリは主[しゅ]の前[まえ]に悪[あく]を行[おこな]い、彼より前[まえ]にいたすべての者[もの]よりも悪[わる]く行[おこな]った。"
  26: "彼はヤロブアムのすべての道[みち]を歩[あゆ]み、ヤロブアムがイスラエルを罪[つみ]に陥[おとしい]れたその罪の中を歩んで、その空[むな]しいものによって、イスラエルの神[かみ]である主を怒[いか]らせた。"
  27: "オムリのほかの事柄[ことがら]、彼が行ったすべてのこと、およびその功績[こうせき]は、イスラエルの王[おう]たちの日々[ひび]の記録[きろく]に記[しる]されているではないか。"
  28: "オムリは父[ちち]たちとともに眠[ねむ]り、サマリアに葬[ほうむ]られた。その子[こ]アハブが彼に代[か]わって王[おう]となった。オムリの第十一年[だいじゅういちねん]に、アサの子ヨシャファトが王となった。彼は三十五歳[さい]で、エルサレムで二十五年[にじゅうごねん]の間[あいだ]王であった。母[はは]の名[な]はガズバといい、セレイの娘[むすめ]であった。"
  29: "彼は父[ちち]アサの道[みち]を歩[あゆ]み、それを外[はず]れなかった。主[しゅ]の前[まえ]に正[ただ]しいことを行[おこな]った。ただ、高[たか]い所[ところ]は取[と]り除[のぞ]かれなかった。民[たみ]は高い所で犠牲[ぎせい]を献[ささ]げ、香[こう]を焚[た]いた。"
  30: "ヨシャファトのほかの事柄[ことがら]、彼が成[な]し遂[と]げたすべての功績[こうせき]、および彼が戦[たたか]った相手[あいて]は、ユダの王[おう]たちの日々[ひび]の記録[きろく]に記[しる]されているではないか。"
  31: "彼は、父[ちち]アサの時代[じだい]に残[のこ]っていた神殿[しんでん]の男娼[だんしょう]たちを、この地[ち]から取[と]り除[のぞ]いた。"
  32: "シリアには王[おう]がなく、代官[だいかん]がいた。"
  33: "ヨシャファト王[おう]は、金[きん]を求[もと]めてタルシシュへ行[い]く船[ふね]を造[つく]った。しかし、船はガシオンガベルで壊[こわ]れたので、行[い]けなかった。"
  34: "そのとき、イスラエルの王[おう]はヨシャファトに言[い]った。「あなたのしもべたちと、わたしの若者[わかもの]たちを、この船[ふね]で行[い]かせよう。」しかし、ヨシャファトは望[のぞ]まなかった。ヨシャファトは父[ちち]たちとともに眠[ねむ]り、父たちとともにダビデの町[まち]に葬[ほうむ]られた。その子[こ]ヨラムが彼に代[か]わって王[おう]となった。アサ王[おう]の第三十八年[だいさんじゅうはちねん]に、オムリの子[こ]アハブがイスラエルの王となり、サマリアで二十二年[にじゅうにねん]の間[あいだ]王であった。アハブは主[しゅ]の前[まえ]に悪[あく]を行[おこな]い、彼より前[まえ]にいたすべての者[もの]よりも悪[わる]く行った。彼には、ヤロブアムの罪[つみ]の中を歩[あゆ]むことさえ足[た]りなかった。彼は、シドンの王[おう]エトバアルの娘[むすめ]イゼベルを妻[つま]に迎[むか]え、バアルに仕[つか]えてこれに拝[おが]んだ。彼は、サマリアに建[た]てた自分の忌[い]まわしいものの家[いえ]に、バアルの祭壇[さいだん]を設[もう]けた。アハブはまた、木立[こだち]を造[つく]った。アハブはさらに、イスラエルの神[かみ]である主[しゅ]を怒[いか]らせ、自分[じぶん]の魂[たましい]を滅[ほろ]ぼすことを重[かさ]ねて行い、彼より前[まえ]にいたイスラエルのすべての王[おう]よりも悪[わる]いことを行った。彼の時代[じだい]に、ベテル人[びと]アヒエルがエリコを建[た]てた。彼は長子[ちょうし]アビロンの上[うえ]にその礎[いしずえ]を据[す]え、末[すえ]の子[こ]セグブの上[うえ]にその門[もん]を立[た]てた。これは主が、ヌンの子[こ]ヨシュアによって語られた言葉[ことば]のとおりであった。"

notes:
  1: "ἐγένετο λόγος κυρίου ἐν χειρὶ Ιου υἱοῦ Ανανι πρὸς Βαασα — «было слово Господне рукою Иуя, сына Анании, к Ваасе». слав. добавляет «глаголя» (внесено: こう告げられた). Ιου — Ииуй (イエフ), сын Анании; ἐν χειρί — «через» (букв. «рукою»)."
  2: "Ἀνθ' ὧν — «за то, что». ὕψωσά σε ἀπὸ τῆς γῆς — «возвысил тебя от земли» (слав. «от земли»; ru «из праха» — МТ). ἡγούμενον ἐπὶ τὸν λαόν — «вождём над народом». ἐξήμαρτες — «ввёл в грех». ἐν τοῖς ματαίοις αὐτῶν — «суетными их», т. е. идолами."
  3: "ἰδοὺ ἐγὼ ἐξεγείρω ὀπίσω Βαασα — «вот, Я воздвигну вслед Ваасы» (ἐξεγείρω — подниму против). слав. «се, аз отвергу наследие ваасы и наследие дому его» — чтение внесено в текст (退ける); LXX-вариант «воздвигну» отмечен. δώσω τὸν οἶκόν σου ὡς τὸν οἶκον Ιεροβοαμ — «сделаю дом твой как дом Иеровоама»."
  4: "τὸν τεθνηκότα τοῦ Βαασα — «умершего из дома Ваасы». καταφάγονται — съедят (κατεσθίω). οἱ κύνες — псы; τὰ πετεινὰ τοῦ οὐρανοῦ — птицы небесные. Формула казни, ср. 14:11; 21:24."
  5: "τὰ λοιπὰ τῶν λόγων — «прочие слова, дела». δυναστεῖαι — «могущество, деяния» (слав. «сильная его»); передано 功績. οὐκ ἰδοὺ ταῦτα γεγραμμένα — «не написано ли это» (риторический вопрос). βιβλίον λόγων τῶν ἡμερῶν — «книга слов дней», т. е. придворная летопись."
  6: "ἐκοιμήθη — почил (κοιμάω). θάπτεται — погребается (praes. hist.). Θερσα — Фирца (テルサ). В конце стиха LXX: ἐν τῷ εἰκοστῷ ἔτει βασιλέως Ασα — «в двадцатый год царя Асы»; слав. и МТ — «в двадцать шестой год», и в слав. эта формула стоит в начале 16:8. По паритету взято слав. число (26), LXX-вариант (20) отмечен; формула оставлена при ст. 6, как в LXX."
  7: "καὶ ἐν χειρὶ Ιου υἱοῦ Ανανι ἐλάλησεν κύριος — «и рукою Иуя, сына Анании, говорил Господь». слав. добавляет «пророка» (внесено: 預言者). πᾶσαν τὴν κακίαν — «всю злобу». τοῦ εἶναι κατὰ τὸν οἶκον Ιεροβοαμ — «чтобы быть как дом Иеровоама». καὶ ὑπὲρ τοῦ πατάξαι αὐτόν — «и за то, что Он поразил его»; слав. «и о еже ему поражену быти» — «быть поражённым» (внесено: 打たれた)."
  8: "Ηλα υἱὸς Βαασα — Ила, сын Ваасы (エラ). δύο ἔτη — два года. слав. начинает стих: «В лето двадесять шестое Асы царя иудина» (в LXX этого нет; год отнесён к ст. 6, ср. note 6)."
  9: "συνέστρεψεν ἐπ' αὐτὸν Ζαμβρι — «составил против него заговор Замврий» (συστρέφω). ὁ ἄρχων τῆς ἡμίσους τῆς ἵππου — «начальник половины конницы» (ἵππος — конница); передано 騎兵. слав. добавляет «воздвиже на него отроки его» (внесено: しもべたち; «Господь» в слав. в скобках). Ωσα τοῦ οἰκονόμου — Арса домоправитель (アルサ, 家令); πίνων μεθύων — «пил, напиваясь»."
  10: "ἐπάταξεν — поразил; ἐθανάτωσεν — умертвил; ἐβασίλευσεν ἀντ' αὐτοῦ — воцарился вместо него. слав. добавляет «в лето двадесять седьмое Асы царя иудина» (нет в LXX; внесено: アサの第二十七年)."
  11: "ἐν τῷ βασιλεῦσαι αὐτὸν ἐν τῷ καθίσαι αὐτὸν ἐπὶ τοῦ θρόνου — «когда он воцарился, когда сел на престол». LXX обрывается на ἐπάταξεν ὅλον τὸν οἶκον Βαασα; слав. добавляет «не остави ему мочащаго к стене, и ужиков его, и друга его» (внесено: 壁に向かって放つ者…); «мочащийся к стене» — идиома «всякий мужчина»."
  12: "κατὰ τὸ ῥῆμα — «по слову». πρὸς Ιου τὸν προφήτην — «через Иуя пророка». слав. начинает стих «И изби замврий весь дом ваасов» (нет в LXX; повторяет ст. 11), поэтому в переводе добавлено こうして…滅ぼした."
  13: "περὶ πασῶν τῶν ἁμαρτιῶν — «за все грехи». ἐξήμαρτεν τὸν Ισραηλ — «ввёл Израиль в грех» (ἐξαμαρτάνω). ἐν τοῖς ματαίοις αὐτῶν — «суетными их» (идолами)."
  14: "τὰ λοιπὰ τῶν λόγων Ηλα — «прочие дела Илы». Формула та же, что в ст. 5; ср. note 5."
  15: "ἑπτὰ ἡμέρας — семь дней. ἡ παρεμβολὴ Ισραηλ ἐπὶ Γαβαθων — «стан Израиля при Гавафоне» (Γαβαθων — Гибефон, ギベトン); ἀλλόφυλοι — иноплеменники, ペリシテ人. слав. добавляет «в лето двадесять седьмое Асы» (нет в LXX; внесено; ср. ст. 10)."
  16: "λεγόντων — «говорящих» (род. пад. мн. ч.). Συνεστράφη — «составил заговор» (слав. «превратися» — «изменил»); передано 謀反を起こし. ἐβασίλευσαν — «воцарили» (действ. залог). ἡγούμενος τῆς στρατιᾶς — военачальник."
  17: "ἀνέβη — поднялся; περιεκάθισαν ἐπὶ Θερσα — «обложили Фирцу» (περιεκάθισα — осадил)."
  18: "προκατείλημπται — «уже взят» (προκαταλαμβάνω, перфект). ἄντρον — пещера, внутреннее помещение (слав. «внутренний дом»); передано 奥の間. ἐνεπύρισεν ἐπ' αὐτὸν τὸν οἶκον — «зажёг над собой дом»; ἀπέθανεν — умер."
  19: "ὑπὲρ τῶν ἁμαρτιῶν αὐτοῦ — «за грехи его». τοῦ ποιῆσαι τὸ πονηρόν — «делать злое». πορευθῆναι ἐν ὁδῷ Ιεροβοαμ — «ходить путём Иеровоама». ὡς ἐξήμαρτεν τὸν Ισραηλ — «как он ввёл Израиль в грех»."
  20: "τὰς συνάψεις αὐτοῦ, ἃς συνῆψεν — «его связи, которые он составил» (σύναψις, συνάπτω); слав. «наветы его, яже совеща»; передано 謀. Формула летописи, как в ст. 5."
  21: "μερίζεται — «разделяется» (praes. hist.). ὀπίσω Θαμνι — «за Фамнием» (Θαμνι — タムニ); Γωναθ — Гонаф (ゴナト). τοῦ βασιλεῦσαι αὐτόν — «чтобы воцарить его»."
  22: "ὑπερεκράτησεν — «одолел, взял верх» (ὑπερκρατέω; слав. «превозмогоша»). ἀπέθανεν Θαμνι καὶ Ιωραμ ὁ ἀδελφὸς αὐτοῦ — «умер Фамний и Иорам, брат его». ἐβασίλευσεν Αμβρι μετὰ Θαμνι — «воцарился Амврий после Фамния»."
  23: "ἐν τῷ ἔτει τῷ τριακοστῷ καὶ πρώτῳ τοῦ βασιλέως Ασα — «в тридцать первый год царя Асы». δώδεκα ἔτη — двенадцать лет; ἐν Θερσα — в Фирце; ἓξ ἔτη — шесть лет."
  24: "ἐκτήσατο — приобрёл (κτάομαι). τὸ ὄρος τὸ Σεμερων — гора Семерон (セメロン山); παρὰ Σεμηρ τοῦ κυρίου τοῦ ὄρους — «у Семира, владельца горы» (κύριος здесь «хозяин», не Господь). δύο ταλάντων ἀργυρίου — «за два таланта серебра» (род. цены). ᾠκοδόμησεν τὸ ὄρος — «застроил гору». Σαεμηρων — Саемирон (サエメロン); слав. «Семирон»; в ru/МТ этот город — Самария (サマリア, ср. 16:28)."
  25: "ἐπονηρεύσατο — «поступал дурно» (πονηρεύομαι). ὑπὲρ πάντας τοὺς γενομένους ἔμπροσθεν αὐτοῦ — «хуже всех бывших до него»."
  26: "ἐπορεύθη ἐν πάσῃ ὁδῷ Ιεροβοαμ — «ходил всем путём Иеровоама». αἷς ἐξήμαρτεν τὸν Ισραηλ — «которыми ввёл Израиль в грех». ἐν τοῖς ματαίοις αὐτῶν — «суетными их»."
  27: "τὰ λοιπὰ τῶν λόγων Αμβρι — «прочие дела Амврия». ἡ δυναστεία αὐτοῦ — «могущество его» (слав. «вся сила его»); передано 功績. Формула летописи, как в ст. 5."
  28: "ἐκοιμήθη Αμβρι… θάπτεται ἐν Σαμαρείᾳ — «почил Амврий… погребён в Самарии». 28a: Καὶ ἐν τῷ ἐνιαυτῷ τῷ ἑνδεκάτῳ τοῦ Αμβρι βασιλεύει Ιωσαφατ υἱὸς Ασα — «в одиннадцатый год Амврия воцарился Иосафат, сын Асы, тридцати пяти лет… двадцать пять лет в Иерусалиме; имя матери — Газува, дочь Селея». В слав. 28a нет: отдел об Иосафате стоит в гл. 22; в LXX он внутри ст. 28 (помечен 28a), поэтому переведён здесь. Γαζουβα — Газува; Σελει — Селей."
  29: "В LXX этот стих — об Иосафате: ἐπορεύθη ἐν τῇ ὁδῷ Ασα τοῦ πατρὸς αὐτοῦ — «ходил путём Асы, отца своего»; οὐκ ἐξέκλινεν — «не уклонялся»; πλὴν τῶν ὑψηλῶν οὐκ ἐξῆραν — «только высот не уничтожили» (αἴρω); ἔθυον… ἐθυμίων — «приносили жертвы… воскуряли». В слав. 16:29 уже начинается Ахав (см. ст. 34)."
  30: "ἃ συνέθετο Ιωσαφατ — «что устроил Иосафат» (συντίθημι); δυναστεία — «сила, могущество»; οὓς ἐπολέμησεν — «с кем воевал». В слав. 16:30 — Ахав (см. ст. 34)."
  31: "τὰ λοιπὰ τῶν συμπλοκῶν — «остатки соитий, связей» (συμπλοκή), т. е. культовые блудники (ср. 1 Цар 15:12); передано 神殿の男娼たち. ἐν ταῖς ἡμέραις Ασα τοῦ πατρὸς αὐτοῦ — «во дни Асы, отца его». ἐξῆρεν ἀπὸ τῆς γῆς — «удалил из земли». В слав. 16:31 — Ахав и Иезавель (см. ст. 34)."
  32: "καὶ βασιλεὺς οὐκ ἦν ἐν Συρίᾳ νασιβ — «и царя не было в Сирии, насиб»; νασιβ — наместник (др.-евр. заимствование), передано 代官. В ru/МТ — «в Едоме» (иное чтение). В слав. 16:32 — жертвенник Ваалу (см. ст. 34)."
  33: "ὁ βασιλεὺς Ιωσαφατ ἐποίησεν ναῦν εἰς Θαρσις — «царь Иосафат сделал корабль в Тарсис» (ναῦς — корабль; Θαρσις — Тарсис, タルシシュ). εἰς Σωφιρ ἐπὶ τὸ χρυσίον — «в Софир за золотом» (Σωφιρ — ソフィル; в ru/МТ Офир, オフィル). συνετρίβη — «разбился» (συντρίβω). Γασιωνγαβερ — Гасионгавер (ガシオンガベル; в ru/МТ Ецион-Гавер). В слав. 16:33 — Ахав и дубрава (см. ст. 34)."
  34: "LXX соединяет в одном стихе конец истории Иосафата (МТ 22:49–50) и начало царствования Ахава (МТ 16:29–34); слав. распределяет это как 16:29–34 (Ахав), а Иосафата помещает в гл. 22. Переведён весь греческий текст ст. 34. Ἐξαποστελῶ τοὺς παῖδάς σου καὶ τὰ παιδάριά μου ἐν τῇ νηί — «пошлю слуг твоих и отроков моих на корабле»; οὐκ ἐβούλετο — «не захотел». ἐκοιμήθη… ἐν πόλει Δαυιδ — «почил… в городе Давида». Ἐν ἔτει δευτέρῳ τῷ Ιωσαφατ — «во второй год Иосафата»; слав. «в лето тридесять осмое Асы царя иудина» — чтение внесено в текст, LXX-вариант отмечен. ἐπονηρεύσατο ὑπὲρ πάντας — «поступал хуже всех». οὐκ ἦν αὐτῷ ἱκανὸν τοῦ πορεύεσθαι — «недостаточно было ему ходить». Ιεθεβααλ — Иефеваал (エトバアル; в ru/МТ Ефваал). οἶκος τῶν προσοχθισμάτων — «дом мерзостей». ἄλσος — дубрава (木立), т. е. столб, роща Асиры. παροργίσματα — «раздражения»; слав. «еже разгневати Господа Бога израилева и душу свою погубити» — чтение внесено в текст, LXX-вариант (раздражить душу свою на погибель) отмечен. ᾠκοδόμησεν Αχιηλ ὁ Βαιθηλίτης τὴν Ιεριχω — «Ахиил Вефилянин построил Иерихон»; ἐν τῷ Αβιρων τῷ πρωτοτόκῳ — «на Авироне, первенце»; τῷ Σεγουβ τῷ νεωτέρῳ — «на Сегубе, младшем». κατὰ τὸ ῥῆμα κυρίου… ἐν χειρὶ Ιησου υἱοῦ Ναυη — «по слову Господа… через Иисуса, сына Навина» (ヨシュア; ср. Нав 6:26)."
