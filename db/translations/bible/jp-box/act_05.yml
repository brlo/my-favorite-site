# jp-box, Деяния апостолов, глава 5. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 5: Анания и Сапфира (1–11), знамения и рост Церкви (12–16),
# заключение и освобождение (17–26), допрос в синедрионе (27–33),
# речь Гамалиила (34–39), избиение и радость (40–42).
# Красного в главе нет: Христос здесь не говорит; слова ангела (5:20),
# Петра (5:3–4, 8–9, 29–32) и Гамалиила (5:35–39) — не красные.
# 〔…〕: только 5:41 — церковное «за имя Господа Иисуса» (в базе τοῦ ὄνομα без имени).
# jp-ni не использовался.

