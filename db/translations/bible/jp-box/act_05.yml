verses:
  1: "ところが、アナニアという名[な]の男[おとこ]が、妻[つま]サッピラとともに自分[じぶん]の土地[とち]を売[う]り、"
  2: "妻[つま]もそのことを知[し]りながら、代金[だいきん]の一部[いちぶ]を取[と]っておき、その一部[いちぶ]を使徒[しと]たちの足元[あしもと]に置[お]いた。"
  3: "ペトロは言[い]った。「アナニア、なぜサタンがあなたの心[こころ]を満[み]たして、あなたが{聖霊[せいれい]|聖神[せいしん]}に偽[いつわ]り、地所[じしょ]の代金[だいきん]の一部[いちぶ]を取[と]っておくようにさせたのか。"
  4: "売[う]らないでおれば、それはあなたのものであり、売[う]った後[あと]もその代金[だいきん]はあなたの権限[けんげん]にあったではないか。なぜこのようなことを心[こころ]に抱[いだ]いたのか。あなたは人[ひと]にではなく、神[かみ]に偽[いつわ]ったのである。」"
  5: "アナニアはこの言葉[ことば]を聞[き]くと、倒[たお]れて息[いき]を引[ひ]き取[と]った。これを聞[き]いた者[もの]は皆[みな]、大[おお]きく恐[おそ]れた。"
  6: "若[わか]い者[もの]たちが立[た]ち上[あ]がって彼[かれ]を包[つつ]み、運[はこ]び出[だ]して葬[ほうむ]った。"
  7: "それからおよそ三時間[さんじかん]が過[す]ぎ、妻[つま]が、起[お]こったことを知[し]らないままに入[はい]って来[き]た。"
  8: "ペトロが彼女[かのじょ]に尋[たず]ねた。「わたしに言[い]いなさい。あなたがたはその土地[とち]をこれだけの値[ね]で売[う]ったのか。」彼女[かのじょ]は言[い]った。「はい、その値[ね]です。」"
  9: "ペトロは彼女[かのじょ]に言[い]った。「なぜあなたがたは共謀[きょうぼう]して主[しゅ]の霊[れい]を試[こころ]みようとしたのか。見[み]なさい。あなたの夫[おっと]を葬[ほうむ]った者[もの]たちの足[あし]が戸口[とぐち]にあり、あなたをも運[はこ]び出[だ]そうとしている。」"
  10: "彼女[かのじょ]はたちまちペトロの足元[あしもと]に倒[たお]れて息[いき]を引[ひ]き取[と]った。若[わか]い者[もの]たちが入[はい]って来[き]て、彼女[かのじょ]が死[し]んでいるのを見[み]、運[はこ]び出[だ]して、夫[おっと]のそばに葬[ほうむ]った。"
  11: "全[ぜん]教会[きょうかい]と、これらのことを聞[き]いた者[もの]すべてに、大[おお]きな恐[おそ]れが及[およ]んだ。"
  12: "使徒[しと]たちの手[て]によって、民[たみ]の中[なか]に多[おお]くのしるしと奇跡[きせき]が行[おこな]われた。そして、一同[いちどう]は心[こころ]を一[ひと]つにしてソロモンの回廊[かいろう]にいた。"
  13: "ほかの者[もの]たちは、だれも彼[かれ]らに近[ちか]づこうとしなかったが、民[たみ]は彼[かれ]らを崇[あが]めた。"
  14: "そして、主[しゅ]を信[しん]じる者[もの]はますます増[ふ]え、男[おとこ]も女[おんな]も多[おお]く加[くわ]わった。"
  15: "そのため、病[びょう]人[にん]を道[みち]に運[はこ]び出[だ]して、寝床[ねどこ]や粗[あら]い寝台[しんだい]に置[お]き、ペトロが通[とお]りかかる時[とき]に、その影[かげ]がだれか一人[ひとり]にでもかかるようにと願[ねが]うほどであった。"
  16: "また、エルサレム周辺[しゅうへん]の町々[まちまち]からも大勢[おおぜい]が、病[びょう]人[にん]や汚[けが]れた霊[れい]に悩[なや]まされる者[もの]を連[つ]れて集[あつ]まって来[き]たが、その者[もの]たちは皆[みな]、いやされた。"
  17: "そこで、大祭司[だいさいし]と、その仲間[なかま]の者[もの]たち、すなわちサドカイ派[は]の者[もの]たちは、立[た]ち上[あ]がって妬[ねた]みに満[み]たされ、"
  18: "使徒[しと]たちに手[て]をかけて捕[と]らえ、公[おおやけ]の牢[ろう]に入[い]れた。"
  19: "しかし、夜[よる]、主[しゅ]の天使[てんし]が牢[ろう]の戸[と]を開[ひら]き、彼[かれ]らを連[つ]れ出[だ]して言[い]った。"
  20: "「行[い]って、神殿[しんでん]に立[た]ち、このいのちの言葉[ことば]をすべて民[たみ]に語[かた]りなさい。」"
  21: "彼[かれ]らはこれを聞[き]くと、夜明[よあ]けに神殿[しんでん]に入[はい]って教[おし]え始[はじ]めた。一方[いっぽう]、大祭司[だいさいし]とその仲間[なかま]の者[もの]たちが来[き]て、最高法院[さいこうほういん]とイスラエルの子[こ]らの長老[ちょうろう]全員[ぜんいん]を召集[しょうしゅう]し、牢[ろう]から使徒[しと]たちを連[つ]れて来[く]るように命[めい]じた。"
  22: "しかし、役人[やくにん]たちが行[い]ってみると、牢[ろう]の中[なか]に彼[かれ]らはいなかった。そこで引[ひ]き返[かえ]して報告[ほうこく]した。"
  23: "「牢[ろう]は十分[じゅうぶん]に用心[ようじん]して閉[と]ざされ、番人[ばんにん]も戸口[とぐち]に立[た]っていましたが、開[あ]けてみると、中[なか]にはだれもいませんでした。」"
  24: "神殿[しんでん]の警備[けいび]の長[ちょう]と祭司長[さいしちょう]たちはこの言葉[ことば]を聞[き]いて、このことがどうなるのかと当惑[とうわく]した。"
  25: "そこへ、ある人[ひと]が来[き]て、「ご存[ぞん]じですか。牢[ろう]に入[い]れたあの人[ひと]たちが、神殿[しんでん]に立[た]って民[たみ]を教[おし]えています」と告[つ]げた。"
  26: "そこで、警備[けいび]の長[ちょう]は役人[やくにん]たちとともに出[で]かけて行[い]き、彼[かれ]らを連[つ]れて来[き]た。ただし、手荒[てあら]なことはしなかった。民[たみ]が石[いし]を投[な]げつけるのを恐[おそ]れたからである。"
  27: "彼[かれ]らを連[つ]れて来[き]て、最高法院[さいこうほういん]の中[なか]に立[た]たせた。大祭司[だいさいし]が彼[かれ]らに尋[たず]ねた。"
  28: "「わたしたちは、あの名[な]によって教[おし]えてはならないと、あなたがたに厳[きび]しく命[めい]じたではないか。ところが、見[み]なさい。あなたがたはその教[おし]えをエルサレム中[じゅう]に広[ひろ]め、あの人[ひと]の血[ち]をわたしたちに負[お]わせようとしている。」"
  29: "ペトロと使徒[しと]たちは答[こた]えて言[い]った。「人[ひと]に従[したが]うよりも、神[かみ]に従[したが]うべきです。"
  30: "わたしたちの先祖[せんぞ]の神[かみ]は、あなたがたが木[き]にかけて殺[ころ]したイエスを復活[ふっかつ]させ、"
  31: "この方[かた]を、その右[みぎ]の手[て]によって高[たか]く上[あ]げて、導[みちび]き手[て]また救[すく]い主[ぬし]とされた。それは、イスラエルに悔[く]い改[あらた]めと罪[つみ]の赦[ゆる]しを与[あた]えるためである。"
  32: "わたしたちはこれらのことの証人[しょうにん]であり、神[かみ]がご自分[じぶん]に従[したが]う者[もの]たちにお与[あた]えになった{聖霊[せいれい]|聖神[せいしん]}も、その証人[しょうにん]である。」"
  33: "これを聞[き]いた者[もの]たちは怒[いか]りに耐[た]えかね、使徒[しと]たちを殺[ころ]そうと企[たくら]んだ。"
  34: "ところが、最高法院[さいこうほういん]の中[なか]で、ガマリエルという名[な]のファリサイ派[は]の人[ひと]が立[た]ち上[あ]がった。律法[りっぽう]の教師[きょうし]として民[たみ]すべてに尊敬[そんけい]されている人[ひと]である。彼[かれ]は使徒[しと]たちを少[すこ]しの間[あいだ]外[そと]へ出[だ]すように命[めい]じた。"
  35: "そして、彼[かれ]らに言[い]った。「イスラエルの人々[ひとびと]よ、この人[ひと]たちをどうするか、よくよく考[かんが]えなさい。"
  36: "すこし前[まえ]、テウダが、自分[じぶん]は何者[なにもの]かであるかのように名乗[なの]って立[た]ち上[あ]がり、およそ四百人[よんひゃくにん]が彼[かれ]に加[くわ]わった。しかし、彼[かれ]は殺[ころ]され、従[したが]った者[もの]は皆[みな]散[ち]り散[ぢ]りになって、何[なに]も残[のこ]らなかった。"
  37: "そののち、登録[とうろく]の時[とき]、ガリラヤ人[じん]ユダが立[た]ち上[あ]がって民[たみ]を自分[じぶん]の後[あと]につかせたが、彼[かれ]も滅[ほろ]び、従[したが]った者[もの]も皆[みな]散[ち]ってしまった。"
  38: "そこで今[いま]、わたしはあなたがたに言[い]う。この人[ひと]たちから手[て]を引[ひ]いて、そのままにしておきなさい。もしこの企[くわだ]てやこのわざが人[ひと]から出[で]たものであるなら、それは滅[ほろ]びる。"
  39: "しかし、神[かみ]から出[で]たものであるなら、あなたがたはそれを滅[ほろ]ぼすことはできない。神[かみ]に逆[さから]う者[もの]と見[み]なされることのないようにしなさい。」彼[かれ]らは彼[かれ]の言[い]うことを聞[き]き入[い]れた。"
  40: "そして、使徒[しと]たちを呼[よ]び入[い]れてむちで打[う]ち、イエスの名[な]によって語[かた]ってはならないと命[めい]じてから、釈放[しゃくほう]した。"
  41: "そこで彼[かれ]らは、〔主[しゅ]イエスの〕御名[みな]のために辱[はずかし]めを受[う]けるにふさわしい者[もの]とされたことを喜[よろこ]びながら、最高法院[さいこうほういん]から出[で]て行[い]った。"
  42: "そして、毎日[まいにち]、神殿[しんでん]でも家[いえ]ごとにも、教[おし]え、またイエス・キリストの福音[ふくいん]を告[つ]げ知[し]らせることをやめなかった。"

notes:
  1: "ἐπώλησεν κτῆμα — «продал имение»; 土地. Жена названа по имени, как в греч."
  2: "ἐνοσφίσατο ἀπὸ τῆς τιμῆς — «утаил из цены»; 代金の一部を取っておき. συνειδυίης καὶ τῆς γυναικὸς — «с ведома и жены»; 妻もそのことを知りながら."
  3: "ψεύσασθαι τὸ πνεῦμα τὸ ἅγιον — «солгать Духу Святому»; 聖霊に偽り, без смягчения. Сатана — подстановка кальки サタナ."
  4: "Два вопроса Петра сохранены раздельно, как в греч.: οὐχὶ μένον σοὶ ἔμενεν…; τί ὅτι ἔθου…; 権限 — ἐξουσία."
  9: "πειράσαι τὸ πνεῦμα κυρίου — «искусить Духа Господня»; 主の霊 (у jp-joc 主の神). ἐπὶ τῇ θύρᾳ — 戸口に."
  11: "ἐκκλησία — 教会; в критическом тексте это первое слово ἐκκλησία в Деяниях (в 2:47 база читает ἐπὶ τὸ αὐτό, 〔教会に〕 — чтение Церкви). Далее 7:38, 8:1."
  12: "σημεῖα καὶ τέρατα — しるしと奇跡, как в 2:19. Стоа Соломона — ソロモンの回廊."
  15: "κλινάριον καὶ κράβαττος — «постель и кровать»; 寝床と粗い寝台 (у jp-joc 床・榻)."
  17: "αἵρεσις τῶν Σαδδουκαίων — «саддукейский толк»; サドカイ派の者たち."
  20: "Слова ангела — не красные. ῥήματα τῆς ζωῆς ταύτης — «глаголы жизни сей»; このいのちの言葉."
  28: "«Кровь Человека сего» — あの人[ひと]の血; указание на смерть Иисуса, без смягчения."
  30: "ἐπὶ ξύλου — «на древе»; 木にかけて. ἤγειρεν — 復活させ."
  31: "ἀρχηγὸς καὶ σωτήρ — «Начальник и Спаситель»; 導き手また救い主 (у jp-joc 主宰・救主); ср. 3:15."
  34: "Γαμαλιήλ — ガマリエル; νομοδιδάσκαλος — 律法の教師; τίμιος παντὶ τῷ λαῷ — 民すべてに尊敬されている."
  36: "Θευδᾶς — テウダ; λέγων εἶναί τινα ἑαυτόν — 自分は何者かであるかのように名乗って."
  37: "ἀπογραφή — перепись, 登録."
  41: "В критической базе только ὑπὲρ τοῦ ὀνόματος («за имя»); церковный текст (Елизаветинская «за имя Господа Иисуса», jp-joc 主イイススの名) добавляет имя — 〔主イエスの〕."
  42: "εὐαγγελιζόμενοι τὸν Χριστόν, Ἰησοῦν — «благовествуя Христа Иисуса»; イエス・キリストの福音."
