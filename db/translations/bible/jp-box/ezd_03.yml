verses:
  1: "第七[だいしち]の月[つき]になったとき、イスラエルの子[こ]らはすでに自分[じぶん]の町[まち]々[まち]にいた。そこで、民[たみ]は一[ひと]人[り]の者[もの]のように、エルサレムに集[あつ]まった。"
  2: "そこで、ヨセデクの子[こ]イエシュアとその兄弟[きょうだい]である祭司[さいし]たち、およびサラティエルの子[こ]ゼルバベルとその兄弟[きょうだい]たちが立[た]ち上[あ]がり、イスラエルの神[かみ]の祭壇[さいだん]を建[た]てた。それは、モーセという神[かみ]の人[ひと]の律法[りっぽう]に書[か]かれているとおりに、その上[うえ]に燔祭[はんさい]を捧[ささ]げるためであった。"
  3: "彼[かれ]らはその基[もとい]の上[うえ]に祭壇[さいだん]を据[す]えた。その地[ち]の民[たみ]たちに対[たい]する恐[おそ]れが彼[かれ]らの上[うえ]にあったからである。そして、朝[あさ]と夕[ゆう]べに、主[しゅ]に燔祭[はんさい]をその上[うえ]に捧[ささ]げた。"
  4: "彼[かれ]らは書[か]かれているとおりに仮庵[かりいお]の祭[まつ]りを行[おこな]い、定[さだ]められた数[かず]に従[したが]って、それぞれの日[ひ]の分[ぶん]を日[ひ]ごとの燔祭[はんさい]として捧[ささ]げた。"
  5: "その後[あと]、絶[た]え間[ま]ない燔祭[はんさい]、新月[しんげつ]の祭[まつ]り、主[しゅ]に聖別[せいべつ]されたすべての祭[まつ]り、また、だれでも自発[じはつ]の捧[ささ]げ物[もの]を主[しゅ]に捧[ささ]げようとする者[もの]の捧[ささ]げ物[もの]を捧[ささ]げた。"
  6: "第七[だいしち]の月[つき]の第一日[だいいちにち]から、彼[かれ]らは主[しゅ]に燔祭[はんさい]を捧[ささ]げ始[はじ]めた。しかし、主[しゅ]の家[いえ]の基[もとい]はまだ据[す]えられていなかった。"
  7: "彼[かれ]らは石切[いしき]りたちと大工[だいく]たちに銀[ぎん]を与[あた]え、シドン人[じん]とティルス人[じん]には食[た]べ物[もの]と飲[の]み物[もの]、油[あぶら]を与[あた]えて、レバノンから杉[すぎ]の木[き]をヤッファの海[うみ]へ運[はこ]ばせた。これはペルシアの王[おう]クロスの許[ゆる]しに従[したが]ってのことであった。"
  8: "彼[かれ]らがエルサレムにある神[かみ]の家[いえ]に来[き]てから第二年[だいにねん]の第二[だいに]の月[つき]、サラティエルの子[こ]ゼルバベル、ヨセデクの子[こ]イエシュア、および彼[かれ]らの兄弟[きょうだい]である残[のこ]りの祭司[さいし]たちとレビ人[びと]たち、すなわち捕囚[ほしゅう]からエルサレムへ来[き]たすべての者[もの]たちは、工事[こうじ]を始[はじ]めた。彼[かれ]らは二十歳以上[にじゅっさいいじょう]のレビ人[びと]たちを、主[しゅ]の家[いえ]の工事[こうじ]をする者[もの]たちの上[うえ]に立[た]たせた。"
  9: "イエシュアとその子[こ]ら、その兄弟[きょうだい]たち、カドミエルとその子[こ]ら、ユダの子[こ]らは、神[かみ]の家[いえ]の工事[こうじ]をする者[もの]たちの上[うえ]に、一[ひと]人[り]のように心[こころ]を合[あ]わせて立[た]った。エナダドの子[こ]ら、その子[こ]ら、その兄弟[きょうだい]であるレビ人[びと]たちも、ともに立[た]った。"
  10: "そして、彼[かれ]らは主[しゅ]の家[いえ]を建[た]てるために基[もとい]を据[す]えた。祭司[さいし]たちは装[よそお]いをしてラッパを持[も]ち、アサフの子[こ]らであるレビ人[びと]たちは、イスラエルの王[おう]ダビデの定[さだ]めに従[したが]って主[しゅ]を賛美[さんび]するためにシンバルを持[も]って立[た]った。"
  11: "そして、彼[かれ]らは互[たが]いに答[こた]えて、主[しゅ]を賛美[さんび]し、感謝[かんしゃ]して言[い]った。「主[しゅ]は善[よ]い方[かた]、その慈[いつく]しみはイスラエルの上[うえ]に永遠[えいえん]に及[およ]ぶ。」また、民[たみ]はすべて、主[しゅ]の家[いえ]の基[もとい]が据[す]えられたことを喜[よろこ]んで、大[おお]きな声[こえ]を上[あ]げて主[しゅ]を賛美[さんび]した。"
  12: "しかし、祭司[さいし]たち、レビ人[びと]たち、氏族[しぞく]の長[かしら]たちのうちの多[おお]くの者[もの]、すなわち以前[いぜん]の家[いえ]を見[み]た老[お]いた者[もの]たちは、この家[いえ]が彼[かれ]らの目[め]の前[まえ]に据[す]えられるのを見[み]て、大[おお]きな声[こえ]で泣[な]いた。しかし、多[おお]くの者[もの]は喜[よろこ]びの叫[さけ]びを上[あ]げ、歌[うた]を高[たか]らかにした。"
  13: "民[たみ]は喜[よろこ]びの叫[さけ]びの声[こえ]と民[たみ]の泣[な]き声[ごえ]とを聞[き]き分[わ]けることができなかった。民[たみ]が大[おお]きな声[こえ]を上[あ]げたからであり、その声[こえ]は遠[とお]くからも聞[き]こえたからである。"

notes:
  1: "ἔφθασεν ὁ μὴν ὁ ἕβδομος — наступил седьмой месяц (φθάνω). οἱ υἱοὶ Ισραηλ ἐν πόλεσιν αὐτῶν — сыны Израиля в городах своих (вставная клауза между тире). συνήχθη ὁ λαὸς ὡς ἀνὴρ εἷς — собрался народ как один человек (συνάγω)."
  2: "Ἰησοῦς ὁ τοῦ Ιωσεδεκ — Иисус, сын Иоседека (в тексте イエシュア, не ヨシュア). Ζοροβαβελ ὁ τοῦ Σαλαθιηλ — Зоровавель, сын Салафиила (サラティエル). ᾠκοδόμησαν τὸ θυσιαστήριον — построили жертвенник (οἰκοδομέω, θυσιαστήριον). τοῦ ἀνενέγκαι ὁλοκαυτώσεις — чтобы возносить всесожжения (ἀναφέρω). κατὰ τὰ γεγραμμένα ἐν νόμῳ Μωυσῆ ἀνθρώπου τοῦ θεοῦ — как написано в законе Моисея, человека Божия."
  3: "ἡτοίμασαν … ἐπὶ τὴν ἑτοιμασίαν αὐτοῦ — поставили его на его основание/приготовление (ἑτοιμασία; слав. «на основании его»). ὅτι ἐν καταπλήξει ἐπ᾿ αὐτοὺς ἀπὸ τῶν λαῶν τῶν γαιῶν — ибо ужас был на них от народов земель (κατάπληξις). ἀνέβη ἐπ᾿ αὐτὸ ὁλοκαύτωσις τῷ κυρίῳ τὸ πρωῒ καὶ εἰς ἑσπέραν — возносилось на нём всесожжение Господу утром и к вечеру."
  4: "ἑορτὴ τῶν σκηνῶν — праздник кущей (仮庵の祭り); κατὰ τὸ γεγραμμένον — по написанному. ὁλοκαυτώσεις ἡμέραν ἐν ἡμέρᾳ ἐν ἀριθμῷ — всесожжения день за днём по числу. ὡς ἡ κρίσις λόγον ἡμέρας ἐν ἡμέρᾳ αὐτοῦ — «как устав, дело дня в день его»: κρίσις здесь — определение, устав."
  5: "ὁλοκαυτώσεις ἐνδελεχισμοῦ — всесожжения постоянные (ἐνδελεχισμός). εἰς τὰς νουμηνίας — в новомесячия (νουμηνία, 新月). εἰς πάσας ἑορτὰς τὰς ἡγιασμένας — во все праздники освящённые (ἁγιάζω). παντὶ ἑκουσιαζομένῳ ἑκούσιον τῷ κυρίῳ — всякому добровольно приносящему добровольное Господу (ἑκουσιάζομαι)."
  6: "ἐν ἡμέρᾳ μιᾷ τοῦ μηνὸς τοῦ ἑβδόμου — в первый день седьмого месяца. ἤρξαντο ἀναφέρειν — начали возносить (ἀναφέρω). ὁ οἶκος κυρίου οὐκ ἐθεμελιώθη — дом Господень не был ещё основан (θεμελιόω)."
  7: "λατόμοι — каменотёсы (λατόμος); τέκτονες — плотники (τέκτων). βρώματα καὶ ποτὰ καὶ ἔλαιον — пища, питьё и масло. Σηδανιν καὶ Σωριν — сидонянам и тирянам. ξύλα κέδρινα ἀπὸ τοῦ Λιβάνου — кедровые деревья с Ливана. πρὸς θάλασσαν Ιόππης — к морю Иоппийскому (Яффа). κατ᾿ ἐπιχώρησιν Κύρου — с дозволения Кира (ἐπιχώρησις)."
  8: "ἐν τῷ ἔτει τῷ δευτέρῳ τοῦ ἐλθεῖν αὐτοὺς — во второй год по приходе их. ἤρξατο — начал (ед. ч.). οἱ κατάλοιποι τῶν ἀδελφῶν — остальные из братьев. ἔστησαν τοὺς Λευίτας ἀπὸ εἰκοσαετοῦς καὶ ἐπάνω — поставили левитов от двадцати лет и выше (εἰκοσαετής). ἐπὶ τοὺς ποιοῦντας τὰ ἔργα — над делающими работы."
  9: "Καδμιηλ — Кадмиил. υἱοὶ Ιουδα — сыны Иуды. υἱοὶ Ηναδαδ — сыны Хенадада. Слав. добавляет «якоже муж един да единодушно» («как один человек и единодушно») — в LXX этого нет; по паритету передано в тексте."
  10: "ἐθεμελίωσαν τοῦ οἰκοδομῆσαι — положили основание, чтобы строить. ἐστολισμένοι — облачённые (στολίζω). ἐν σάλπιγξιν — с трубами (σάλπιγξ). ἐν κυμβάλοις — с кимвалами (κύμβαλον). ἐπὶ χεῖρας Δαυιδ — «по рукам Давида», т. е. по уставу (слав. «по уставу»)."
  11: "ἀπεκρίθησαν ἐν αἴνῳ καὶ ἀνθομολογήσει — отвечали хвалой и благодарением (ἀνθομολόγησις; слав. «в песнех и исповедании»). ὅτι ἀγαθόν, ὅτι εἰς τὸν αἰῶνα τὸ ἔλεος αὐτοῦ — «ибо благ, ибо вовек милость Его». ἐσήμαινον φωνὴν μεγάλην — возглашали громким голосом (σημαίνω). ἐπὶ θεμελιώσει οἴκου κυρίου — по случаю основания дома Господня."
  12: "οἱ πρεσβύτεροι, οἳ εἴδοσαν τὸν οἶκον τὸν πρῶτον — старцы, видевшие первый дом (πρῶτος — прежний). ἐν θεμελιώσει αὐτοῦ — при основании его. ἔκλαιον φωνῇ μεγάλῃ — плакали громким голосом. ὄχλος ἐν σημασίᾳ μετ᾿ εὐφροσύνης τοῦ ὑψῶσαι ᾠδήν — толпа с восклицанием, в радости возвышала песнь (ὑψόω)."
  13: "οὐκ ἦν ὁ λαὸς ἐπιγινώσκων — народ не мог различать (ἐπιγινώσκω). φωνὴν σημασίας τῆς εὐφροσύνης — голос восклицания радости. ἀπὸ τῆς φωνῆς τοῦ κλαυθμοῦ — от голоса плача (κλαυθμός). ἠκούετο ἕως ἀπὸ μακρόθεν — слышен был издалека."
