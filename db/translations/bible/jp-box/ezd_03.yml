# ように心[こころ]を合[あ]わせて); в notes отмечено.
# Сносок ⟨…⟩ нет: 祭壇, 燔祭, 仮庵の祭り, 祭司, レビ人, 賛美 уже в корпусе.
# jp-ni не использовался.

