verses:
  1: "週[しゅう]の初[はじ]めの日[ひ]の朝[あさ]早[はや]く、女[おんな]たちは用意[ようい]した香料[こうりょう]を携[たずさ]えて墓[はか]へ行[い]った。〔ほかにも幾人[いくにん]かの女[おんな]たちが一緒[いっしょ]に来[き]ていた。〕"
  2: "そして、墓[はか]から石[いし]が転[ころ]がしてあるのを見[み]つけた。"
  3: "中[なか]に入[はい]ると、主[しゅ]イエスの遺体[いたい]は見[み]つからなかった。"
  4: "そのことで途方[とほう]に暮[く]れていると、見[み]よ、輝[かがや]く衣[ころも]を着[き]た二人[ふたり]の男[おとこ]が彼女[かのじょ]たちのそばに立[た]った。"
  5: "女[おんな]たちは恐[おそ]れて、顔[かお]を地[ち]に伏[ふ]せていた。二人[ふたり]が言[い]った。「なぜ、生[い]ける者[もの]を死者[ししゃ]の中[なか]に捜[さが]すのか。"
  6: "ここにはおられない。復活[ふっかつ]されたのだ。まだガリラヤにおられたとき、あなたがたに語[かた]られたことを思[おも]い出[だ]しなさい。"
  7: "『人[ひと]の子[こ]は罪[つみ]深[ぶか]い人々[ひとびと]の手[て]に引[ひ]き渡[わた]され、十字架[じゅうじか]につけられ、三日目[みっかめ]に復活[ふっかつ]する』と。」"
  8: "女[おんな]たちはイエスの言葉[ことば]を思[おも]い出[だ]した。"
  9: "そして墓[はか]から帰[かえ]り、このことをすべて十一人[じゅういちにん]とほかの者[もの]たちすべてに告[つ]げた。"
  10: "告[つ]げたのは、マグダラのマリア、ヨハンナ、ヤコブの母[はは]マリア、そして彼女[かのじょ]たちと一緒[いっしょ]にいたほかの女[おんな]たちであった。彼女[かのじょ]たちはこのことを使徒[しと]たちに話[はな]した。"
  11: "しかし、使徒[しと]たちには、その言葉[ことば]がたわごとのように思[おも]われ、彼女[かのじょ]たちを信[しん]じなかった。"
  12: "しかし、ペトロは立[た]ち上[あ]がって墓[はか]へ走[はし]って行[い]き、かがみ込[こ]んでのぞくと、亜麻布[あまぬの]だけが置[お]かれていた。そこで彼[かれ]は、起[お]こったことを不思議[ふしぎ]に思[おも]いながら帰[かえ]って行[い]った。"
  13: "見[み]よ、その日[ひ]、二人[ふたり]の者[もの]が、エルサレムから六十[ろくじゅう]スタディオン離[はな]れたエマオという名[な]の村[むら]へ向[む]かって歩[ある]いていた。"
  14: "二人[ふたり]は、起[お]こったすべてのことについて語[かた]り合[あ]っていた。"
  15: "そして、語[かた]り合[あ]い論[ろん]じ合[あ]っていると、イエスご自身[じしん]が近[ちか]づいて、彼[かれ]らと一緒[いっしょ]に歩[ある]いておられた。"
  16: "しかし、彼[かれ]らの目[め]は、イエスを見[み]分[わ]けないように遮[さえぎ]られていた。"
  17: "イエスは言[い]われた。「<j>あなたがたは、歩[ある]きながら何[なに]を話[はな]し合[あ]っているのか。</j>」すると、彼[かれ]らは暗[くら]い顔[かお]をして立[た]ち止[ど]まった。"
  18: "クレオパという名[な]の一人[ひとり]が答[こた]えて言[い]った。「エルサレムに泊[と]まっている者[もの]のうちで、あなただけが、この数日[すうじつ]にそこで起[お]こったことを知[し]らないのですか。」"
  19: "イエスは言[い]われた。「<j>何[なに]のことか。</j>」彼[かれ]らは言[い]った。「ナザレのイエスのことです。あの方[かた]は、神[かみ]と民[たみ]すべての前[まえ]で、行[おこな]いと言葉[ことば]とに力[ちから]ある預言者[よげんしゃ]でしたが、"
  20: "祭司長[さいしちょう]たちとわたしたちの指導者[しどうしゃ]たちが、あの方[かた]を死刑[しけい]の判決[はんけつ]に引[ひ]き渡[わた]し、十字架[じゅうじか]につけたのです。」"
  21: "わたしたちは、あの方[かた]こそイスラエルを贖[あがな]い出[だ]す方[かた]だと望[のぞ]みを抱[いだ]いていました。ところが、それに加[くわ]えて、これらのことが起[お]こってから今日[きょう]で三日目[みっかめ]になります。"
  22: "その上[うえ]、わたしたちの中[なか]の何人[なんにん]かの女[おんな]たちが、わたしたちを驚[おどろ]かせました。彼女[かのじょ]たちは朝早[あさはや]く墓[はか]へ行[い]き、"
  23: "あの方[かた]の遺体[いたい]は見[み]つからず、戻[もど]って来[き]て、天使[てんし]たちの現[あらわ]れを見[み]たと告[つ]げたのです。その天使[てんし]たちは、あの方[かた]は生[い]きていると言[い]っています。"
  24: "そこで、わたしたちの中[なか]の何人[なんにん]かが墓[はか]へ行[い]ってみると、女[おんな]たちが言[い]ったとおりでした。しかし、あの方[かた]は見[み]えませんでした。"
  25: "イエスは言[い]われた。「<j>ああ、愚[おろ]かで、預言者[よげんしゃ]たちが語[かた]ったすべてのことを信[しん]じるのに心[こころ]の鈍[にぶ]い者[もの]たちよ。</j>"
  26: "<j>キリストはこのように苦[くる]しみを受[う]け、ご自身[じしん]の栄光[えいこう]に入[はい]るべきではなかったか。</j>」"
  27: "そして、モーセとすべての預言者[よげんしゃ]から始[はじ]めて、聖書[せいしょ]全体[ぜんたい]にわたって、ご自身[じしん]について書[か]かれていることを彼[かれ]らに説[と]き明[あ]かされた。"
  28: "やがて、二人[ふたり]が向[む]かっていた村[むら]に近[ちか]づくと、イエスはもっと先[さき]へ行[い]くふりをされた。"
  29: "二人[ふたり]はイエスを引[ひ]き止[と]めて言[い]った。「わたしたちと一緒[いっしょ]にお泊[と]まりください。もう夕方[ゆうがた]近[ちか]く、日[ひ]もかたむいていますから。」そこでイエスは、一緒[いっしょ]に泊[と]まるために中[なか]へ入[はい]られた。"
  30: "そして、二人[ふたり]とともに食卓[しょくたく]に着[つ]かれたとき、イエスはパンを取[と]り、祝福[しゅくふく]してから裂[さ]き、二人[ふたり]に渡[わた]された。"
  31: "すると、二人[ふたり]の目[め]が開[ひら]けて、イエスだと分[わ]かった。しかし、イエスは彼[かれ]らの前[まえ]から姿[すがた]を消[け]された。"
  32: "二人[ふたり]は互[たが]いに言[い]った。「道[みち]で、あの方[かた]がわたしたちに語[かた]り、聖書[せいしょ]を説[と]き明[あ]かしてくださったとき、わたしたちの心[こころ]は〔胸[むね]の内[うち]で〕燃[も]えていたではないか。」"
  33: "二人[ふたり]はすぐに立[た]ち上[あ]がってエルサレムへ帰[かえ]り、十一人[じゅういちにん]と一緒[いっしょ]に集[あつ]まっていた者[もの]たちに会[あ]った。"
  34: "彼[かれ]らは言[い]った。「主[しゅ]は確[たし]かに復活[ふっかつ]され、シモンに現[あらわ]れたのだ。」"
  35: "二人[ふたり]も、道[みち]での出来事[できごと]と、パンを裂[さ]かれたときイエスだと分[わ]かった次第[しだい]を話[はな]した。"
  36: "こう話[はな]していると、イエスご自身[じしん]が彼[かれ]らの真[ま]ん中[なか]に立[た]って言[い]われた。「<j>あなたがたに平和[へいわ]があるように。</j>」"
  37: "しかし、彼[かれ]らは驚[おどろ]き恐[おそ]れて、霊[れい]を見[み]ているのだと思[おも]った。"
  38: "イエスは言[い]われた。「<j>なぜ慌[あわ]てているのか。なぜ心[こころ]に疑[うたが]いが起[お]こるのか。</j>"
  39: "<j>わたしの手[て]と足[あし]を見[み]なさい。わたし自身[じしん]である。わたしに触[さわ]って、見[み]なさい。霊[れい]には肉[にく]も骨[ほね]もないが、ご覧[らん]のとおり、わたしにはあるのだ。</j>」"
  40: "こう言[い]って、彼[かれ]らに手[て]と足[あし]をお見[み]せになった。"
  41: "彼[かれ]らは喜[よろこ]びのあまりまだ信[しん]じられず、不思議[ふしぎ]に思[おも]っていると、イエスは言[い]われた。「<j>ここに何[なに]か食[た]べるものがあるか。</j>」"
  42: "彼[かれ]らは、焼[や]いた魚[さかな]の一切[ひとき]れ〔と蜂[はち]の巣[す]の蜜[みつ]〕をイエスに渡[わた]した。"
  43: "イエスはそれを受[う]け取[と]り、彼[かれ]らの前[まえ]で食[た]べられた。"
  44: "そして言[い]われた。「<j>わたしがまだあなたがたと一緒[いっしょ]にいたとき、あなたがたに話[はな]したわたしの言葉[ことば]は、これである。モーセの律法[りっぽう]と預言者[よげんしゃ]と詩編[しへん]に、わたしについて書[か]かれていることはすべて、必[かなら]ず成就[じょうじゅ]しなければならない。</j>」"
  45: "そして、聖書[せいしょ]を悟[さと]るために、彼[かれ]らの心[こころ]を開[ひら]かれた。"
  46: "そして言[い]われた。「<j>こう書[か]かれている。すなわち、キリストは苦[くる]しみを受[う]け、三日目[みっかめ]に死者[ししゃ]の中[なか]から復活[ふっかつ]し、</j>"
  47: "<j>その名[な]によって悔[く]い改[あらた]めと罪[つみ]の赦[ゆる]しとが、エルサレムから始[はじ]めてすべての民[たみ]に宣[の]べ伝[つた]えられる、と。</j>"
  48: "<j>あなたがたは、これらのことの証人[しょうにん]である。</j>"
  49: "<j>見[み]よ、わたしは、父[ちち]が約束[やくそく]されたものを、あなたがたに送[おく]る。あなたがたは、上[うえ]から力[ちから]を着[き]るまで、都[みやこ]にとどまっていなさい。</j>」"
  50: "イエスは彼[かれ]らをベタニアのあたりまで連[つ]れ出[だ]し、手[て]を上[あ]げて彼[かれ]らを祝福[しゅくふく]された。"
  51: "そして、祝福[しゅくふく]しておられるうちに、イエスは彼[かれ]らから離[はな]れ、〔天[てん]に上[のぼ]って行[い]かれた。〕"
  52: "彼[かれ]らはイエスを拝[おが]み、大[おお]きな喜[よろこ]びを抱[かか]えてエルサレムへ帰[かえ]り、"
  53: "いつも神殿[しんでん]にいて、神[かみ]をほめたたえていた。"

notes:
  1: "ὄρθρου βαθέως — «глубокой зарёй», очень рано; 朝早く. В критическом нет καί τινες σὺν αὐταῖς; Церковь читает (Синод., jp-joc 他の婦も彼等と偕にせり) — 〔ほかにも幾人かの女たちが一緒に来ていた〕. Жёны несут то, что приготовили в 23:56, и не знают о печати и страже (ср. Мф 27:62–66)."
  2: "ἀποκεκυλισμένον — причастие совершенного вида, «уже отвален»; 転がしてある."
  3: "κυρίου в критической базе под скобками; Церковь читает τοῦ κυρίου Ἰησοῦ (jp-joc 主イイスス) — оставлено 主イエス без 〔〕, как обычное именование (ср. 24:34)."
  4: "ἐν ἐσθῆτι ἀστραπτούσῃ — «в одежде блистающей»; 輝く衣. ἄνδρες δύο — 二人の男; ангелами они названы только в 24:23."
  5: "Τί ζητεῖτε τὸν ζῶντα μετὰ τῶν νεκρῶν; — 生ける者を死者の中に捜すのか, как у jp-joc (何ぞ生ける者を死者の中に尋ぬる). Слова ангелов — не красные; речь продолжается до 24:7."
  6: "ἠγέρθη — 復活された. μνήσθητε ὡς ἐλάλησεν ὑμῖν — 語られたことを思い出しなさい (ср. 9:22)."
  7: "δεῖ παραδοθῆναι εἰς χεῖρας ἀνθρώπων ἁμαρτωλῶν — 罪深い人々の手に引き渡され; у Марка 9:31 без ἁμαρτωλῶν. Цитата внутри речи ангелов — 『』."
  9: "οἱ ἕνδεκα — 十一人. τοῖς λοιποῖς — ほかの者たちすべて."
  10: "Ἰωάννα — ヨハンナ (только у Луки, ср. 8:3). Μαρία ἡ Ἰακώβου — ヤコブの母マリア. αἱ λοιπαὶ σὺν αὐταῖς — ほかの女たちも一緒に."
  11: "λῆρος — «вздор, пустословие»; たわごと. ἠπίστουν αὐταῖς — 彼女たちを信じなかった, без сглаживания."
  12: "В критическом издании стих в двойных скобках (спорное чтение, нет в D); Церковь читает — весь стих в 〔…〕. παρακύψας — «наклонившись, заглянул»; かがみ込んでのぞくと. ὀθόνια — 亜麻布. ἀπῆλθεν πρὸς ἑαυτὸν θαυμάζων — 自分[じぶん]のところへ帰りながら不思議に思った."
  13: "σταδίους ἑξήκοντα — около 11 км; 六十スタディオン (мера уже пояснена в Мф 14:24). Ἐμμαοῦς — エマオ."
  14: "ὡμίλουν — имперфект, «беседовали»; 語り合っていた."
  16: "ἐκρατοῦντο τοῦ μὴ ἐπιγνῶναι αὐτόν — «удерживаемы были, чтобы не узнать Его»; 見分けないように遮られていた."
  17: "Слова Христа — вопрошение, красные; дальнейшее — повествование. σκυθρωποί — 暗い顔をして; ἐστάθησαν — 立ち止まった."
  18: "Σὺ μόνος παροικεῖς Ἰερουσαλήμ — «ты один странствуешь (живёшь пришлым) в Иерусалиме»; エルサレムに泊まっている者のうちで、あなただけが. Слова Клеопы — не красные."
  19: "ποῖα; — «какие?»; 何のことか (слова Христа, красные). προφήτης δυνατὸς ἐν ἔργῳ καὶ λόγῳ — 行いと言葉に力ある預言者. Стих кончается на «но», продолжение — 24:20."
  20: "παρέδωκαν εἰς κρίμα θανάτου — 死刑の判決に引き渡し."
  21: "λυτροῦσθαι τὸν Ἰσραήλ — イスラエルを贖い出す; ὁ μέλλων — «имеющий». τρίτην ταύτην ἡμέραν ἄγει — «третий день, как это»; 今日で三日目になります."
  23: "ὀπτασίαν ἀγγέλων — «явление ангелов»; 天使たちの現れ. οἳ λέγουσιν αὐτὸν ζῆν — あの方は生きていると言っている."
  25: "Ὦ ἀνόητοι καὶ βραδεῖς τῇ καρδίᾳ τοῦ πιστεύειν — 愚かで、心の鈍い者たち. Слова Христа красные; речь продолжается в 24:26."
  26: "οὐχὶ ταῦτα ἔδει παθεῖν τὸν Χριστόν… — キリストはこのように苦しみを受け…べきではなかったか. εἰσελθεῖν εἰς τὴν δόξαν αὐτοῦ — ご自身の栄光に入る (キリスト, не メシア)."
  27: "ἀπὸ Μωϋσέως καὶ ἀπὸ πάντων τῶν προφητῶν — モーセとすべての預言者から始めて. διερμήνευσεν — 説き明かされた. Это повествование евангелиста (речь Христа передана косвенно) — не красное."
  28: "προσεποιήσατο πορρώτερον πορεύεσθαι — «сделал вид, что идёт дальше»; 先へ行くふりをされた."
  29: "παρεβιάσαντο — «принудили (уговорили)»; 引き止めて. πρὸς ἑσπέραν ἐστίν — 夕方近く. Слова учеников — не красные."
  30: "λαβὼν τὸν ἄρτον εὐλόγησεν καὶ κλάσας ἐπεδίδου — パンを取り、祝福してから裂き、渡された. Не сглажено в «совершил евхаристию»."
  31: "ἄφαντος ἐγένετο ἀπ᾽ αὐτῶν — «стал невидим для них»; 姿を消された."
  32: "Слова Клеопы и его спутника (в передаче евангелиста) — не красные. καιομένη ἦν [ἐν ἡμῖν] — ἐν ἡμῖν в критической базе под скобками, Церковь читает — 〔胸の内で〕."
  34: "ὤφθη Σίμωνι — シモンに現れた (имя Симон, как в греческом; ср. 24:12 ペトロ)."
  35: "ἐξηγοῦντο — «рассказывали»; 話した. ἐγνώσθη αὐτοῖς ἐν τῇ κλάσει τοῦ ἄρτου — パンを裂かれたときイエスだと分かった次第."
  36: "Εἰρήνη ὑμῖν — あなたがたに平和があるように (ср. Мф 10:12). В критическом нет «это Я, не бойтесь» (ἐγώ εἰμι, μὴ φοβεῖσθε) — не добавляю. Слова Христа красные."
  37: "πτοηθέντες … ἔμφοβοι γενόμενοι — «смутившись и испугавшись»; 驚き恐れて. πνεῦμα θεωρεῖν — 霊を見ているのだと."
  39: "ψηλαφήσατέ με — 触ってみなさい. πνεῦμα σάρκα καὶ ὀστέα οὐκ ἔχει — 霊には肉も骨もない. ἐγώ εἰμι αὐτός — わたし自身である."
  40: "В критическом издании стих в двойных скобках (спорное чтение); Церковь читает — весь стих в 〔…〕. Повествование, не красное."
  41: "ἀπιστούντων αὐτῶν ἀπὸ τῆς χαρᾶς — «не верили от радости»; 喜びのあまりまだ信じられず."
  42: "ἰχθύος ὀπτοῦ μέρος — 焼いた魚の一切れ. В критическом нет καὶ ἀπὸ μελισσίου κηρίου; Церковь читает (Елизаветинская, jp-joc 蜜房) — 〔と蜂の巣の蜜〕."
  44: "πάντα τὰ γεγραμμένα ἐν τῷ νόμῳ Μωϋσέως καὶ τοῖς προφήταις καὶ ψαλμοῖς — モーセの律法と預言者と詩編に書かれているすべてのこと. δεῖ πληρωθῆναι — 必ず成就しなければならない."
  45: "διήνοιξεν αὐτῶν τὸν νοῦν τοῦ συνιέναι τὰς γραφάς — «отверз им ум к уразумению Писаний»; 聖書を悟るために心を開かれた. Повествование, не красное."
  46: "οὕτως γέγραπται — こう書かれている. Слова Христа красные, речь продолжается в 24:47–49."
  47: "κηρυχθῆναι … μετάνοιαν καὶ ἄφεσιν ἁμαρτιῶν — 悔い改めと罪の赦しとが宣べ伝えられる. ἐπὶ τῷ ὀνόματι αὐτοῦ — その名によって. εἰς πάντα τὰ ἔθνη — すべての民に. ἀρξάμενοι ἀπὸ Ἰερουσαλήμ — エルサレムから始めて."
  48: "ὑμεῖς μάρτυρες τούτων — あなたがたは…証人である."
  49: "ἐπαγγελία τοῦ πατρός — «обещание Отца»; оставлено без раскрытия в «Святого Духа» (ср. Деян 1:4–5 — раскрытие у Луки позже), чтобы не сглаживать. ἔνδυσησθε ἐξ ὕψους δύναμιν — 上から力を着る. καθίσατε ἐν τῇ πόλει — 都にとどまっていなさい. ἰδού в критической базе под скобками; 見よ оставлено без 〔〕 как частица."
  50: "ἕως πρὸς Βηθανίαν — ベタニアのあたりまで. ἐπάρας τὰς χεῖρας — 手を上げて."
  51: "В критическом издании καὶ ἀνεφέρετο εἰς τὸν οὐρανόν отмечено как спорное; Церковь читает (Елизаветинская, jp-joc 擧げられて、天に升れり) — 〔…〕."
  52: "προσκυνήσαντες αὐτόν — 拝み. μετὰ χαρᾶς μεγάλης — 大きな喜びを抱えて."
  53: "διὰ παντός — «постоянно»; いつも. В jp-joc в конце добавлено «アミン»; в критическом тексте его нет — не добавляю."
