# jp-box, Евангелие от Луки, глава 24. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий (gr-lxx-byz) — свидетель; расхождения — в 〔…〕 и notes.
# jp-ni не использовался.
#
# Глава Воскресения: жёны у гроба (1–12), Эммаус (13–35), явление в Иерусалиме
# (36–43), последняя беседа (44–49), вознесение (50–53).
# Слова Христа — в <j>…</j> (17, 19, 25–26, 36, 38–39, 41, 44, 46–49); слова
# ангелов, Клеопы, учеников — вне тегов (24:32 — речь Клеопы и его спутника,
# не красная; 24:27, 24:40, 24:42–43, 24:45 — повествование евангелиста).
# 24:12, 24:40, 24:51 в критическом тексте под скобками, Церковь читает — 〔…〕.
# 24:49 — 聖霊 дано калькой {聖霊[せいれい]|聖神[せいしん]}, чтобы работал
# переключатель «伝統表記».

