verses:
  1: "さて、あなたがたが書[か]いてきた事[こと]について言[い]えば、男[おとこ]が女[おんな]に触[ふ]れないのは良[よ]いことである。"
  2: "しかし、淫[いん]らな行[おこな]いのゆえに、男[おとこ]はそれぞれ自分[じぶん]の妻[つま]を持[も]ち、女[おんな]はそれぞれ自分[じぶん]の夫[おっと]を持[も]つようにしなさい。"
  3: "夫[おっと]は妻[つま]に当然[とうぜん]の務[つと]めを果[は]たし、同[おな]じように妻[つま]も夫[おっと]に果[は]たすようにしなさい。"
  4: "妻[つま]は自分[じぶん]の体[からだ]に権[けん]を持[も]たない。むしろ、夫[おっと]が持[も]つ。同[おな]じように、夫[おっと]も自分[じぶん]の体[からだ]に権[けん]を持[も]たない。むしろ、妻[つま]が持[も]つ。"
  5: "互[たが]いに相手[あいて]を拒[こば]んではならない。ただ、〔断食[だんじつ]と〕祈[いの]りに専念[せんねん]するために、しばらくの間[あいだ]、二人[ふたり]の合意[ごうい]によって別[べつ]に過[す]ごすことは構[かま]わない。そして、また一緒[いっしょ]に戻[もど]りなさい。サタンがあなたがたの自制[じせい]のなさに乗[じょう]じて、あなたがたを誘惑[ゆうわく]しないためである。"
  6: "わたしがこれを言[い]うのは、許[ゆる]しとしてであって、命令[めいれい]としてではない。"
  7: "わたしは、すべての人[ひと]がわたしのようであってほしいと願[ねが]っている。しかし、それぞれ神[かみ]から自分[じぶん]の賜物[たまもの]を受[う]けており、一方[いっぽう]はこのように、他方[たほう]はそのようにである。"
  8: "わたしは、結婚[けっこん]していない者[もの]たちとやもめたちに言[い]う。彼[かれ]らがわたしのようでいられるなら、それが良[よ]い。"
  9: "しかし、自制[じせい]できないなら、結婚[けっこん]しなさい。結婚[けっこん]するほうが、情欲[じょうよく]に燃[も]えるよりは良[よ]いからである。"
  10: "結婚[けっこん]した者[もの]たちには、わたしが命[めい]じるのではなく、主[しゅ]が命[めい]じる。「<j>妻[つま]は夫[おっと]から離[はな]れてはならない。</j>"
  11: "<j>もし離[はな]れたなら、結婚[けっこん]しないままでいるか、夫[おっと]と和解[わかい]しなさい。また、夫[おっと]も妻[つま]を離[はな]してはならない。</j>」"
  12: "そのほかの者[もの]たちには、わたしが言[い]う。主[しゅ]ではなく、わたしが言[い]うのである。もし兄弟[きょうだい]に信[しん]じていない妻[つま]があり、その妻[つま]が彼[かれ]と一緒[いっしょ]に住[す]むことに同意[どうい]しているなら、彼[かれ]は妻[つま]を離[はな]してはならない。"
  13: "また、女[おんな]に信[しん]じていない夫[おっと]があり、その夫[おっと]が彼女[かのじょ]と一緒[いっしょ]に住[す]むことに同意[どうい]しているなら、彼女[かのじょ]は夫[おっと]を離[はな]してはならない。"
  14: "というのは、信[しん]じていない夫[おっと]は妻[つま]によって聖[せい]とされ、信[しん]じていない妻[つま]は信[しん]じる夫[おっと]によって聖[せい]とされているからである。そうでなければ、あなたがたの子[こ]どもは汚[けが]れた者[もの]である。しかし今[いま]、彼[かれ]らは聖[せい]なる者[もの]なのである。"
  15: "しかし、信[しん]じていない者[もの]が別[わか]れようとするなら、別[わか]れなさい。そのような場合[ばあい]、兄弟[きょうだい]も姉妹[しまい]も束縛[そくばく]されていない。神[かみ]はあなたがたを平和[へいわ]のうちに召[め]されたのである。"
  16: "というのは、妻[つま]よ、あなたが夫[おっと]を救[すく]うことになるかどうか、どうして知[し]ることができようか。夫[おっと]よ、あなたが妻[つま]を救[すく]うことになるかどうか、どうして知[し]ることができようか。"
  17: "ただ、主[しゅ]がそれぞれに割[わ]り当[あ]てられたとおりに、神[かみ]がそれぞれを召[め]されたとおりに、そのように歩[あゆ]みなさい。そして、わたしはすべての教会[きょうかい]でそう命[めい]じている。"
  18: "割礼[かつれい]を受[う]けた者[もの]が召[め]されたのか。割礼[かつれい]をなかったことにしてはならない。割礼[かつれい]を受[う]けていない者[もの]が召[め]されたのか。割礼[かつれい]を受[う]けてはならない。"
  19: "割礼[かつれい]は何[なに]でもなく、無割礼[むかつれい]も何[なに]でもない。そうではなく、神[かみ]の戒[いまし]めを守[まも]ることである。"
  20: "それぞれ、召[め]されたときの状態[じょうたい]のままでいなさい。"
  21: "奴隷[どれい]として召[め]されたのか。気[き]にするな。しかし、もし自由[じゆう]になることができるなら、むしろそれを用[もち]いなさい。"
  22: "というのは、主[しゅ]にあって召[め]された奴隷[どれい]は、主[しゅ]の自由人[じゆうじん]だからである。同[おな]じように、自由[じゆう]な者[もの]として召[め]された者は、キリストの奴隷[どれい]なのである。"
  23: "あなたがたは代価[だいか]を払[はら]って買[か]い取[と]られたのである。人[ひと]の奴隷[どれい]になってはならない。"
  24: "兄弟[きょうだい]たちよ、それぞれ、召[め]されたときの状態[じょうたい]のまま、神[かみ]の前[まえ]にとどまりなさい。"
  25: "処女[しょじょ]について言[い]えば、わたしには主[しゅ]の命令[めいれい]がない。しかし、主[しゅ]のあわれみを受[う]けて忠実[ちゅうじつ]である者[もの]として、わたしは意見[いけん]を述[の]べる。"
  26: "そこで、わたしは、現在[げんざい]の切迫[せっぱく]した困難[こんなん]のゆえに、これが良[よ]いことだと考えている。すなわち、人[ひと]はそのままの状態[じょうたい]でいるのが良[よ]い、ということである。"
  27: "妻[つま]に結[むす]びつけられているのか。解[と]き放[はな]たれることを求[もと]めるな。妻[つま]から離[はな]れているのか。妻[つま]を求[もと]めるな。"
  28: "しかし、もし結婚[けっこん]しても、あなたは罪[つみ]を犯[おか]したのではない。処女[しょじょ]が結婚[けっこん]しても、罪[つみ]を犯[おか]したのではない。しかし、そのような者[もの]たちは肉[にく]に苦難[くなん]を受[う]ける。わたしはあなたがたを思[おも]いやっているのである。"
  29: "兄弟[きょうだい]たちよ、わたしはこう言[い]う。時[とき]は縮[ちぢ]められている。だから、これからは、妻[つま]のある者[もの]も妻[つま]のない者[もの]のようにし、"
  30: "泣[な]く者[もの]も泣[な]かない者[もの]のようにし、喜[よろこ]ぶ者[もの]も喜[よろこ]ばない者[もの]のようにし、買[か]う者[もの]も手[て]に入[い]れない者[もの]のようにし、"
  31: "この世[よ]を用[もち]いる者[もの]も、使[つか]い切[き]らない者[もの]のようにしなさい。というのは、この世[よ]の姿[すがた]は過[す]ぎ去[さ]って行[い]くからである。"
  32: "わたしはあなたがたに、思[おも]い煩[わずら]いのない者[もの]であってほしいと願[ねが]っている。結婚[けっこん]していない者[もの]は、主[しゅ]のことを思[おも]い煩[わずら]い、どうすれば主[しゅ]に喜[よろこ]ばれるかを考[かんが]える。"
  33: "しかし、結婚[けっこん]した者[もの]は、この世[よ]のことを思[おも]い煩[わずら]い、どうすれば妻[つま]に喜[よろこ]ばれるかを考[かんが]える。"
  34: "そして、心[こころ]が引[ひ]き裂[さ]かれてしまう。結婚[けっこん]していない女[おんな]も処女[しょじょ]も、体[からだ]でも霊[れい]でも聖[せい]であるために、主[しゅ]のことを思[おも]い煩[わずら]う。しかし、結婚[けっこん]した女[おんな]は、この世[よ]のことを思[おも]い煩[わずら]い、どうすれば夫[おっと]に喜[よろこ]ばれるかを考[かんが]える。"
  35: "わたしがこれを言[い]うのは、あなたがたの益[えき]のためであって、あなたがたに罠[わな]をかけようとしてではない。あなたがたがふさわしく、気[き]を散[ら]らさずに主[しゅ]に仕[つか]えるためである。"
  36: "しかし、もしある者[もの]が、自分[じぶん]の処女[しょじょ]が年頃[としごろ]を過[す]ぎているのにそのままにしておくのはふさわしくないと考[かんが]え、そうするのが当然[とうぜん]だと思[おも]うなら、その人[ひと]は望[のぞ]むままに行[おこな]いなさい。その人[ひと]は罪[つみ]を犯[おか]していない。二人[ふたり]は結婚[けっこん]しなさい。"
  37: "しかし、心[こころ]を堅[かた]く保[たも]ち、必要[ひつよう]に迫[せま]られておらず、自分[じぶん]の意志[いし]を決[き]める力[ちから]があり、自分[じぶん]の処女[しょじょ]をそのままにしておくことを心[こころ]に決[き]めた者[もの]は、よく行[おこな]うことになる。"
  38: "だから、自分[じぶん]の処女[しょじょ]を結婚[けっこん]させる者[もの]もよく行[おこな]い、結婚[けっこん]させない者[もの]はさらによく行[おこな]うのである。"
  39: "妻[つま]は、夫[おっと]が生[い]きている間[あいだ]は、〔律法[りっぽう]によって〕夫[おっと]に結[むす]びつけられている。しかし、夫[おっと]が死[し]ねば、自由[じゆう]になって、望[のぞ]む者[もの]と結婚[けっこん]することができる。ただし、主[しゅ]にあってすることである。"
  40: "しかし、わたしの意見[いけん]では、そのままにとどまるほうが、より幸[さいわ]いである。わたしも神[かみ]の霊[れい]を持[も]っていると考[かんが]えるからである。"

notes:
  1: "καλὸν ἀνθρώπῳ γυναικὸς μὴ ἅπτεσθαι — 男が女に触れないのは良いこと; ἀνθρώπῳ — 人, в контексте брака 男."
  2: "διὰ τὰς πορνείας — 淫らな行いのゆえに (причина, не цель)."
  3: "ὀφειλή — 当然の務め (супружеский долг)."
  4: "ἐξουσιάζει — 権を持つ; противопоставление ἀλλά сохранено: 夫が持つ / 妻が持つ."
  5: "В критической базе только τῇ προσευχῇ; церковный текст (Елизаветинская «в посте и молитве», jp-joc「齋と祈禱」) читает с постом —〔断食と〕. ἀκρασία — 自制のなさ; διὰ τὴν ἀκρασίαν ὑμῶν — あなたがたの自制のなさに乗じて."
  6: "κατὰ συγγνώμην — 許しとして; οὐ κατ᾿ ἐπιταγήν — 命令としてではない."
  7: "χάρισμα — 賜物. ὁ μὲν οὕτως, ὁ δὲ οὕτως — 一方はこのように、他方はそのように."
  8: "ἄγαμοι — 結婚していない者たち; χῆραι — やもめ."
  9: "πυροῦσθαι — 情欲に燃える; κρεῖττον γάρ — 良いからである (γάρ передан)."
  10: "παραγγέλλω, οὐκ ἐγὼ ἀλλὰ ὁ κύριος — わたしが命じるのではなく、主が命じる; эти слова — Павел, вне <j>. Слова Господа с 7:10 по 7:11 в <j>…</j> и 「…」."
  11: "Слова Господа: μενέτω ἄγαμος — 結婚しないままでいる; καταλλαγήτω — 和解しなさい; ἄνδρα γυναῖκα μὴ ἀφιέναι — 夫も妻を離してはならない. Тире критического издания не воспроизводится, смысл сохранён."
  12: "λέγω ἐγώ, οὐχ ὁ κύριος — 主ではなく、わたしが言う; слова Павла, не красные. ἄπιστος — 信じていない; συνευδοκεῖ — 同意している."
  13: "Параллель 7:12 для жены; μὴ ἀφιέτω τὸν ἄνδρα — 夫を離してはならない."
  14: "ἡγίασται — 聖とされている. ἐν τῷ ἀδελφῷ — через верующего мужа, 信じる夫によって. ἐπεὶ ἄρα — そうでなければ. ἀκάθαρτα — 汚れた者."
  15: "οὐ δεδούλωται — 束縛されていない. ἐν δὲ εἰρήνῃ κέκληκεν — 平和のうちに召された."
  16: "τί γὰρ οἶδας — というのは…どうして知ることができようか; γάρ передан というのは, вопрос сохранён."
  17: "Εἰ μὴ — ただ. ἐμέρισεν ὁ κύριος / κέκληκεν ὁ θεός — порядок греческого сохранён: 主が割り当て、神が召した. διατάσσομαι — 命じている."
  18: "ἐπισπάσθω — 割礼をなかったことにしてはならない (эписпазм); ἀκροβυστία — 無割礼."
  19: "περιτομή / ἀκροβυστία — 割礼 / 無割礼; ἀλλὰ τήρησις ἐντολῶν θεοῦ — 大切なのは、神の戒めを守ること."
  20: "κλῆσις — 召されたときの状態."
  21: "μᾶλλον χρῆσαι — むしろそれを用いなさい; местоимение не раскрыто, как в греческом."
  22: "ἀπελεύθερος κυρίου — 主の自由人."
  23: "τιμῆς ἠγοράσθητε — 代価を払って買い取られた."
  25: "ἐπιταγὴν κυρίου οὐκ ἔχω — 主の命令がない; γνώμη — 意見 (ср. 7:40). πιστὸς εἶναι — 忠実である者として."
  26: "ἐνεστῶσαν ἀνάγκην — 現在の切迫した困難; τὸ οὕτως εἶναι — そのままの状態でいること."
  27: "δέδεσαι — 結びつけられている; λύσις — 解き放たれること; λέλυσαι ἀπὸ γυναικός — 妻から離れている."
  28: "θλῖψιν τῇ σαρκί — 肉に苦難; φείδομαι — 思いやっている."
  29: "συνεσταλμένος — 縮められている; τὸ λοιπόν — これからは. Период 29–31 не дробится, как в греческом."
  31: "καταχρώμενοι — 使い切る; σχῆμα — 姿; παράγει γάρ — 過ぎ去って行くからである."
  34: "μεμέρισται — 心が引き裂かれてしまう. [καὶ] в базе есть, поэтому без 〔〕. πνεῦμα здесь — человеческий дух, не 聖霊."
  36: "ἀσχημονεῖν ἐπὶ τὴν παρθένον — 自分の処女に対してふさわしくないことをする; ὑπέρακμος — 年頃を過ぎている; ὀφείλει γίνεσθαι — そうするのが当然だ."
  37: "ἑδραῖος — 心を堅く保ち; ἐξουσίαν ἔχει περὶ τοῦ ἰδίου θελήματος — 自分の意志を決める力がある."
  38: "γαμίζων — 結婚させる; κρεῖσσον ποιήσει — さらによく行う."
  39: "В критической базе Γυνὴ δέδεται ἐφ᾿ ὅσον… без νόμῳ; церковный текст (Елизаветинская «связана есть законом», jp-joc「法に繋がれたり」) читает с νόμῳ —〔律法によって〕. μόνον ἐν κυρίῳ — ただし主にあって."
  40: "В базе и церковном тексте одинаково: δοκῶ… πνεῦμα θεοῦ ἔχειν — 神の霊, не 聖霊 (нет ἅγιον); 〔…〕 не ставятся."
