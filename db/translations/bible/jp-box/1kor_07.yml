# jp-box, Первое послание к Коринфянам, глава 7. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 7: брак и воздержание (1–7), безбрачие и вдовство (8–9),
# слово Господа о разводе (10–11), смешанные браки (12–16),
# призвание и состояние (17–24), девы и брак (25–38), вдовы (39–40).
# Красное (<j>): только 7:10–11 — слова Господа; «わたしが命じるのではなく、
# 主が命じる」 (7:10) и «主ではなく、わたしが言う」 (7:12) — слова Павла, вне тегов.
# 〔…〕: 7:5 — церковное «с постом» (в базе только молитва); 7:39 — церковное
# «законом» (νόμῳ в базе нет). 7:40 в базе и церковном тексте совпадает — скобок нет.
# Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

