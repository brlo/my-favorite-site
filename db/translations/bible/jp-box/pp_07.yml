chapter: 7
draft: true

verses:
  1: "「帰[かえ]れ、帰れ、シュラムの女[おんな]よ。帰れ、帰れ、あなたを眺[なが]めよう。」あなたがたは何[なに]をシュラムの女に見[み]ようというのか。陣営[じんえい]の踊[おど]りの群[む]れのように進[すす]む者[もの]である。"
  2: "「なんと美[うつく]しいか、サンダルを履[は]いたあなたの歩[あゆ]みは、ナダブの娘[むすめ]よ。あなたの腿[もも]の曲[ま]がりは首飾[くびかざ]りのよう、職人[しょくにん]の手[て]のわざだ。"
  3: "あなたのへそは、混[ま]ぜ合[あ]わせた酒[さけ]を絶[た]やさない、彫[ほ]り物[もの]の杯[さかずき]。あなたの腹[はら]は、ゆりで囲[かこ]まれた小麦[こむぎ]の山[やま]。"
  4: "あなたの二[ふた]つの乳房[ちぶさ]は、かもしかの双子[ふたご]の子鹿[こじか]二頭[にとう]のよう。"
  5: "あなたの首[くび]は象牙[ぞうげ]の塔[とう]。あなたの目[め]は、エセボンの池[いけ]、多[おお]くの娘[むすめ]たちの門[もん]のほとりの池。あなたの鼻[はな]は、ダマスコの方[ほう]をうかがうレバノンの塔。"
  6: "あなたの頭[あたま]はあなたの上[うえ]にカルメルのよう。あなたの頭の髪[かみ]は紫[むらさき]のよう、王[おう]がその流[なが]れに縛[しば]られている。"
  7: "なんと美[うつく]しいか、なんと快[こころよ]いか、愛[あい]する女[おんな]よ、あなたの喜[よろこ]びのうちで。"
  8: "あなたのこの背丈[せたけ]はなつめやしに、あなたの乳房[ちぶさ]はぶどうの房[ふさ]に似[に]ている。"
  9: "わたしは言[い]った。『なつめやしに上[のぼ]り、その高[たか]みをつかもう。』あなたの乳房[ちぶさ]はぶどうの房[ふさ]のようになり、あなたの鼻[はな]の香[かお]りはりんごのようになる。」"
  10: "「あなたの喉[のど]は良[よ]いぶどう酒[しゅ]のようだ。」そのぶどう酒はわが愛[あい]する者[もの]へまっすぐに流[なが]れ、わたしの唇[くちびる]と歯[は]を満[み]たす。"
  11: "わたしはわが愛[あい]する者[もの]のもの、彼[かれ]の顧[かえり]みはわたしにある。"
  12: "来[き]て、わが愛[あい]する者[もの]よ、野[の]へ出[で]て村々[むらむら]に宿[やど]ろう。"
  13: "朝早[あさはや]くぶどう畑[ばたけ]へ行[ゆ]き、ぶどうの木[き]が花[はな]を咲[さ]かせたか、蕾[つぼみ]が開[ひら]いたか、ざくろが花をつけたかを見[み]よう。そこでわたしはあなたにわたしの乳房[ちぶさ]を与[あた]えよう。"
  14: "マンドラゴラは香[かお]りを放[はな]ち、わたしたちの戸口[とぐち]にはあらゆる果実[かじつ]がある。新[あたら]しいものも古[ふる]いものも、わが愛[あい]する者[もの]よ、あなたのためにわたしが蓄[たくわ]えたものだ。"

notes:
  1: "Голос: хор (дочери Иерусалима) в 「」 — «возвратись, возвратись, Суламита»; вторая половина стиха (после закрытия кавычек) — голос женщины. Ἐπίστρεφε ἐπίστρεφε… καὶ ὀψόμεθα ἐν σοί — возвратись, возвратись… и посмотрим на тебя (ἐπιστρέφω — возвращаться; ὀψόμεθα — увидим). Τί ὄψεσθε ἐν τῇ Σουλαμίτιδι — что вы увидите в Суламите (2-е л. мн. ч.); ἡ ἐρχομένη ὡς χοροὶ τῶν παρεμβολῶν — идущая, как хоры ополчений (παρεμβολή — стан, войско; слав. «яко лики полков»; Син. «как хоровод Манаимский» — от евр. מַחֲנַיִם, «два стана», домысел не вносился). Нумерация: gr 7:1a = csl 6:12 («Обратися, обратися, суламитино…»), gr 7:1b — вторая половина csl 7:1."
  2: "Голос: возлюбленный (кавычка открывается здесь и закрывается в ст. 9). Τί ὡραιώθησαν διαβήματά σου ἐν ὑποδήμασιν — как прекрасны шаги твои в обуви (διάβημα — шаг; ὑπόδημα — сандалии; слав. «что украсишася стопы твоя во обутиих твоих»). θύγατερ Ναδαβ — дочь Надава (так в LXX; евр. נָדִיב, «знатный», отсюда Син. «дщерь именитая»). ῥυθμοὶ μηρῶν σου ὅμοιοι ὁρμίσκοις — изгибы бёдер твоих, подобные ожерельям (ῥυθμός — изгиб, округлость; ὁρμίσκος — ожерелье, подвеска), ἔργῳ χειρῶν τεχνίτου — делом рук художника. Это вторая половина csl 7:1."
  3: "Голос: возлюбленный. ὀμφαλός σου κρατὴρ τορευτός — пупок твой — точёная чаша (τορευτός — выточенный, резной; слав. «чаша источена»). μὴ ὑστερούμενος κρᾶμα — не оскудевающая смесь (κρᾶμα — вино, смешанное с водой и пряностями; слав. «не лишаемая мста»). κοιλία σου θιμωνιὰ σίτου πεφραγμένη ἐν κρίνοις — чрево твоё — стог пшеницы, ограждённый лилиями (θιμωνιά — груда, стог; φράσσω — ограждать)."
  4: "Голос: возлюбленный. δύο μαστοί σου ὡς δύο νεβροὶ δίδυμοι δορκάδος — две груди твои, как два близнеца-оленёнка серны (νεβρός — оленёнок; δορκάς — серна, газель; δίδυμοι — близнецы; слав. «два млада близнецы серны»). Глагола в греческом нет, сравнение оставлено без сказуемого."
  5: "Голос: возлюбленный. τράχηλός σου ὡς πύργος ἐλεφάντινος — шея твоя, как башня из слоновой кости. ὀφθαλμοί σου ὡς λίμναι ἐν Εσεβων ἐν πύλαις θυγατρὸς πολλῶν — глаза твои, как водоёмы в Есевоне, у ворот дочери многих (θυγάτηρ πολλῶν — «дочь многих», евр. название ворот Бат-Раббим); слав. здесь читает мн. ч. «во вратех дщерей многих», и по паритету взято слав. мн. ч., вариант LXX (ед. ч.) отмечен. μυκτὴρ σου ὡς πύργος τοῦ Λιβάνου σκοπεύων πρόσωπον Δαμασκοῦ — нос твой, как Ливанская башня, высматривающая лицо Дамаска (σκοπεύω — наблюдать с высоты)."
  6: "Голос: возлюбленный. κεφαλή σου ἐπὶ σὲ ὡς Κάρμηλος — голова твоя на тебе, как Кармил (Κάρμηλος — гора Кармель; слав. поясняет в скобках «кармил (гора)»). πλόκιον κεφαλῆς σου ὡς πορφύρα — плетение (коса) волос твоих, как пурпур (πλόκιον — заплетённые волосы; слав. «заплетение главы твоея яко багряница»). βασιλεὺς δεδεμένος ἐν παραδρομαῖς — царь, связанный в потоках (παραδρομή — течение, русло; слав. «царь увязан в приристаниих»; Син. «царь увлечен твоими кудрями»)."
  7: "Голос: возлюбленный. Τί ὡραιώθης καὶ τί ἡδύνθης, ἀγάπη, ἐν τρυφαῖς σου — как ты прекрасна и как усладительна, любовь, в негах твоих (ἡδύνω — услаждать; τρυφή — нега, наслаждение; слав. «что украсилася еси, и что усладилася еси, любы, во сладостех твоих»). ἀγάπη здесь — обращение к возлюбленной («любовь моя»), поэтому 愛する女よ, а не わが愛する者 (это ἀδελφιδός)."
  8: "Голос: возлюбленный. τοῦτο μέγεθός σου ὡμοιώθη τῷ φοίνικι — этот рост твой уподобился пальме (μέγεθος — величина, рост; слав. «сие величество твое»; φοῖνιξ — финиковая пальма). οἱ μαστοί σου τοῖς βότρυσιν — груди твои — гроздьям (βότρυς — гроздь винограда). В слав. глагол во 2-м л. ж. р. («уподобилася еси финику»), в LXX — 3-е л. страдательное; перевод по LXX."
  9: "Голос: возлюбленный (кавычка закрывается здесь). εἶπα Ἀναβήσομαι ἐν τῷ φοίνικι, κρατήσω τῶν ὕψεων αὐτοῦ — я сказал: взойду на пальму, ухвачусь за высоты её (ὕψος — высота, вершина); это его собственная речь внутри его же речи, поэтому 『…』. καὶ ἔσονται δή μαστοί σου ὡς βότρυες τῆς ἀμπέλου — и будут груди твои, как гроздья виноградной лозы (ἄμπελος — лоза). ὀσμὴ ῥινός σου ὡς μῆλα — запах носа твоего, как яблоки (ῥίς — нос; μῆλον — яблоко, плод)."
  10: "Голос: женщина (по принятой разметке 10–14); её первая фраза — слова возлюбленного, которые она повторяет, поэтому они в 「」 (ср. 5:2b). καὶ λάρυγξ σου ὡς οἶνος ὁ ἀγαθός — и гортань твоя, как доброе вино (λάρυγξ — горло, гортань; слав. «гортань твой яко вино благо»). πορευόμενος τῷ ἀδελφιδῷ μου εἰς εὐθύθητα — идущее к возлюбленному моему прямо (εὐθύθης — прямой, ровный; слав. «ходящее брату моему в правость»). ἱκανούμενος χείλεσίν μου καὶ ὀδοῦσιν — насыщающее губы мои и зубы (ἱκανόω — удовлетворять). В греческом первая половина стиха — ещё речь возлюбленного, вторая («к моему возлюбленному… губы мои») — уже речь женщины; стих один, поэтому начало отдано ей как цитата, вариант — закрывать кавычку возлюбленного в середине ст. 10."
  11: "Голос: женщина. Ἐγὼ τῷ ἀδελφιδῷ μου — я возлюбленному моему (формула принадлежности, ср. 2:16; 6:3). ἐπ᾽ ἐμὲ ἡ ἐπιστροφὴ αὐτοῦ — на меня обращение его (ἐπιστροφή — поворот, устремление; евр. תְּשׁוּקָה — влечение; слав. «ко мне обращение его», Син. «ко мне обращено желание его»)."
  12: "Голос: женщина. ἐλθέ, ἀδελφιδέ μου — приди, возлюбленный мой (звательный падеж). ἐξέλθωμεν εἰς ἀγρόν — выйдем в поле (ἀγρός), αὐλισθῶμεν ἐν κώμαις — заночуем в селениях (αὐλίζομαι — проводить ночь, располагаться станом; κώμη — селение)."
  13: "Голос: женщина. ὀρθρίσωμεν εἰς ἀμπελῶνας — встанем рано, пойдём в виноградники (ὀρθρίζω — вставать с рассветом). ἴδωμεν εἰ ἤνθησεν ἡ ἄμπελος, ἤνθησεν ὁ κυπρισμός, ἤνθησαν αἱ ῥοαί — посмотрим, расцвела ли лоза, расцвёл ли κυπρισμός, расцвели ли гранаты (ῥοά — гранат). κυπρισμός — тёмное слово, вероятно «цветение» (от κύπρος, «хна»); слав. передаёт «овощие» (плоды), Син. — «почки»; в тексте 蕾, точное значение спорно. ἐκεῖ δώσω τοὺς μαστούς μου σοί — там дам груди мои тебе (слав. «тамо дам тебе сосца моя»; Син. сглаживает: «окажу ласки»). Ср. 6:11: там в LXX список короче (лоза и гранаты, без κυπρισμός), поэтому набор членов другой, а концовка стиха та же."
  14: "Голос: женщина. οἱ μανδραγόραι ἔδωκαν ὀσμήν — мандрагоры дали запах (μανδραγόρας — мандрагора, сильно пахнущее растение, ср. Быт 30:14). ἐπὶ θύραις ἡμῶν πάντα ἀκρόδρυα — у дверей наших всякие плоды (ἀκρόδρυα — древесные плоды; слав. «вси плоды новии»). νέα πρὸς παλαιά — новые и старые. ἐτήρησά σοι — сберегла тебе (τηρέω — хранить). Этому стиху соответствует csl 7:13; в слав. главе 7 тринадцать стихов."
