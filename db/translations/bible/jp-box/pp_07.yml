# jp-box, Песнь Песней, глава 7. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для книги нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому;
# поэзия с параллелизмами не сглаживается.
# Глава 7: 14 стихов. Хор просит Суламиту возвратиться (1a), её ответ (1b);
# возлюбленный описывает её тело — шаги, бёдра, пупок, чрево, грудь, шея, глаза,
# нос, голова, пальма и гроздья (2–9); её ответ и призыв выйти в поле (10–14).
# Голоса: женщина — без кавычек (1b, 10–14); прочие — 「…」: хор/дочери в 1a,
# возлюбленный во 2–9 (одна цитата). В 7:9 его слова о самом себе — 『…』;
# в 7:10 его слова, повторённые женщиной, — 「…」 (см. notes).
# Нумерация по gr: 14 стихов. Сдвиг csl: csl 6:12 = gr 7:1a («Обратися, обратися,
# суламитино…»), csl 7:1 = gr 7:1b + gr 7:2, csl 7:2 = gr 7:3 и далее csl = gr − 1;
# csl 7:13 = gr 7:14, в слав. главе 13 стихов.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz; слав. добавлений, которых нет
# в LXX, в этой главе нет. Расхождения чтений (7:5 мн. ч., 7:8 лицо глагола) —
# в notes.
# Сносок ⟨…⟩ нет (кандидат: マンドラゴラ, 7:14). Имена — транслитерация греческого (LXX).

