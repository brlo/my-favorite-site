verses:
  1: "そこで、ダリウス王[おう]は命令[めいれい]を下[くだ]し、宝物[たからもの]が置[お]かれているバビロンの書庫[しょこ]を調[しら]べさせた。"
  2: "そして、メディアの町[まち]アマタの宮殿[きゅうでん]で、一[ひと]つの巻物[まきもの]が見[み]つかり、その中に「記録[きろく]」と書[か]かれていた。"
  3: "「クロス王[おう]の第一年[だいいちねん]に、クロス王[おう]はエルサレムにある神[かみ]の家[いえ]について命令[めいれい]を定[さだ]めた。家[いえ]を建[た]て、いけにえをささげる場所[ばしょ]を設[もう]けよ。高[たか]さは六十[ろくじゅう]キュビト、幅[はば]も六十[ろくじゅう]キュビトとせよ。"
  4: "丈夫[じょうぶ]な石[いし]の壁[かべ]を三段[さんだん]、木[き]の壁を一段[いちだん]とし、費用[ひよう]は王[おう]の家[いえ]から出[だ]す。"
  5: "また、ネブカドネツァルがエルサレムの家[いえ]から運[はこ]び出[だ]してバビロンへ持[も]って行[い]った、神[かみ]の家[いえ]の銀[ぎん]の器[うつわ]と金[きん]の器[うつわ]は返[かえ]され、エルサレムの家[いえ]、すなわち神[かみ]の家[いえ]で元[もと]あった場所[ばしょ]に運[はこ]び入[い]れられよ。」"
  6: "「今[いま]、川向[かわむ]こうの知事[ちじ]たち、すなわちサタルブザナと、その同僚[どうりょう]である川向[かわむ]こうのアファルサハイ人[じん]たちは、そこから遠[とお]く離[はな]れていなさい。"
  7: "神[かみ]の家[いえ]の工事[こうじ]をやめなさい。ユダヤ人[じん]の知事[ちじ]とその長老[ちょうろう]たちが、その場所[ばしょ]でこの神[かみ]の家[いえ]を建[た]てるように。"
  8: "また、わたしから命令[めいれい]を下[くだ]す。ユダヤ人[じん]の長老[ちょうろう]たちに反[はん]して、この神[かみ]の家[いえ]の建築[けんちく]について何[なに]もしてはならない。川向[かわむ]こうの王[おう]の税[ぜい]のうちから、その人[ひと]たちに費用[ひよう]を怠[おこた]りなく支[しはら]い、工事[こうじ]が中止[ちゅうし]されないようにせよ。"
  9: "また、天[てん]の神[かみ]への燔祭[はんさい]のための若[わか]い雄牛[おうし]、雄羊[おひつじ]、子羊[こひつじ]、また小麦[こむぎ]、塩[しお]、ぶどう酒[しゅ]、油[あぶら]は、足[た]りない分[ぶん]を、エルサレムの祭司[さいし]たちの言葉[ことば]に従[したが]って、毎日[まいにち]、彼[かれ]らが求[もと]めるままに彼[かれ]らに与[あた]えよ。"
  10: "それは、彼[かれ]らが天[てん]の神[かみ]に芳[かんば]しい香[かおり]をささげ、王[おう]とその子[こ]らたちの命[いのち]のために祈[いの]るためである。"
  11: "わたしからさらに命令[めいれい]を下[くだ]す。この言葉[ことば]を変[か]える者[もの]があれば、その家[いえ]から梁[はり]を一本[いっぽん]抜[ぬ]き取[と]って、その者[もの]をそれに吊[つ]るし、その家[いえ]はわたしのために没収[ぼっしゅう]する。"
  12: "そこに御名[みな]を住[す]まわせておられる神[かみ]が、エルサレムにあるこの神[かみ]の家[いえ]を変[か]え、あるいは滅[ほろ]ぼそうとして手[て]を伸[の]べる王[おう]や民[たみ]を、すべて倒[たお]されるように。わたし、ダリウスがこの命令[めいれい]を定[さだ]めた。怠[おこた]りなく行[おこな]われよ。」"
  13: "そこで、川向[かわむ]こうの知事[ちじ]タンタナイ、サタルブザナとその同僚[どうりょう]たちは、ダリウス王[おう]が命[めい]じたとおりに、怠[おこた]りなく行[おこな]った。"
  14: "ユダヤ人[じん]の長老[ちょうろう]たちとレビ人[びと]たちは、預言者[よげんしゃ]ハガイとアドの子[こ]ゼカリヤの預言[よげん]によって建[た]て続[つづ]け、完成[かんせい]させた。それは、イスラエルの神[かみ]の命令[めいれい]と、ペルシアの王[おう]たちクロス、ダリウス、アルタシャスタの命令[めいれい]によるものであった。"
  15: "この家[いえ]は、ダリウス王[おう]の治世[ちせい]の第六年[だいろくねん]、アダルの月[つき]の三日[みっか]に完成[かんせい]した。"
  16: "イスラエルの子[こ]ら、祭司[さいし]たち、レビ人[びと]たち、および残[のこ]りの、捕囚[ほしゅう]から帰[かえ]った者[もの]たちは、喜[よろこ]びのうちに神[かみ]の家[いえ]の奉献[ほうけん]を行[おこな]った。"
  17: "神[かみ]の家[いえ]の奉献[ほうけん]のとき、彼[かれ]らは雄牛[おうし]百頭[ひゃくとう]、雄羊[おひつじ]二百頭[にひゃくとう]、子羊[こひつじ]四百頭[よんひゃくとう]、およびイスラエル全部[ぜんぶ]のための罪[つみ]の献[ささ]げ物[もの]として、イスラエルの部族[ぶぞく]の数[かず]に従[したが]って雄山羊[おやぎ]十二頭[じゅうにとう]をささげた。"
  18: "そして、モーセの書[しょ]に書[か]かれているとおりに、祭司[さいし]たちをその組[くみ]ごとに、レビ人[びと]をその務[つと]めごとに、エルサレムにある家[いえ]の務[つと]めのために立[た]てた。"
  19: "捕囚[ほしゅう]から帰[かえ]った者[もの]たちは、第一[だいいち]の月[つき]の十四日[じゅうよっか]に過越[すぎこし]の祭[まつ]りを行[おこな]った。"
  20: "祭司[さいし]たちとレビ人[びと]たちは身[み]を清[きよ]め、すべてが一人[ひとり]に至[いた]るまで清[きよ]かったからである。そこで彼[かれ]らは、捕囚[ほしゅう]から帰[かえ]ったすべての者[もの]のため、また自分[じぶん]たちの兄弟[きょうだい]である祭司[さいし]たちのため、そして自分[じぶん]たちのために、過越[すぎこし]の子羊[こひつじ]を屠[ほふ]った。"
  21: "イスラエルの子[こ]ら、すなわち捕囚[ほしゅう]から帰[かえ]った者[もの]たちと、イスラエルの神[かみ]である主[しゅ]を求[もと]めるために、その地[ち]の民[たみ]の汚[けが]れから離[はな]れて彼[かれ]らに加[くわ]わった者[もの]たちは皆[みな]、過越[すぎこし]の祭[まつ]りを食[た]べた。"
  22: "そして、彼[かれ]らは七日間[なのかかん]、喜[よろこ]びのうちに種[たね]なしパンの祭[まつ]りを行[おこな]った。主[しゅ]が彼[かれ]らを喜[よろこ]ばせ、アッシリアの王[おう]の心[こころ]を彼[かれ]らに向[む]けて、イスラエルの神[かみ]である主[しゅ]の家[いえ]の工事[こうじ]において彼[かれ]らの手[て]を強[つよ]くされたからである。"

notes:
  1: "Τότε Δαρεῖος ὁ βασιλεύς — тогда царь Дарий (Δαρεῖος, ダリウス); ἔθηκεν γνώμην — «положил решение», т. е. дал повеление (γνώμη — решение, указ; формула указов в Ездре); ἐπεσκέψατο — осмотрел, разыскал (ἐπισκέπτομαι, 3-е л. ед. ч.; csl «искаша» — мн. ч.); βιβλιοθῆκαι — книгохранилища (書庫); γάζα — сокровище (перс. заимствование, ср. 7:20); ὅπου ἡ γάζα κεῖται — где лежит сокровище."
  2: "εὑρέθη — был найден; βάρις — крепость, укреплённая часть города (csl «палата»); κεφαλὶς μία — «один свиток» (κεφαλίς — свиток, столбец книги; 巻物); ὑπόμνημα — памятная запись (記録). csl добавляет имя города «во амафе граде мидийстем» (Ахмета/Екбатана, по евр.), которого в LXX нет: там только «в городе, в крепости Мидийского города». Имя アマタ и «палата» взяты по csl."
  3: "ἐν ἔτει πρώτῳ Κύρου — в первый год Кира; ἔθηκεν γνώμην περὶ οἴκου — дал повеление о доме; οἶκος οἰκοδομηθήτω — «дом да будет построен» (повелит. 3-е л.); τόπος, οὗ θυσιάζουσιν τὰ θυσιάσματα — место, где приносят жертвы (θυσίασμα); ἔθηκεν ἔπαρμα ὕψος πήχεις ἑξήκοντα — «поставил высоту — шестьдесят локтей» (ἔπαρμα — поднятие, мера высоты; csl «меру высоты»); πλάτος — ширина."
  4: "δόμοι λίθινοι κραταιοὶ τρεῖς — три ряда (пояса) крепкой каменной кладки (δόμος — слой, ряд; csl понял как «стены»); δόμος ξύλινος εἷς — один деревянный ряд (ср. 3 Цар 6:36); δαπάνη — издержки (費用); ἐξ οἴκου τοῦ βασιλέως — из царского дома."
  5: "σκεύη ἀργυρᾶ καὶ χρυσᾶ — серебряные и золотые сосуды (σκεῦος, 器); ἐξήνεγκεν … ἐκόμισεν — вынес и отнёс (ἐκφέρω, κομίζω); ἀπελθάτω — пусть уйдёт, будет отнесён; ἐπὶ τόπου, οὗ ἐτέθη — на место, где был поставлен (ед. ч.; csl «поставлени бяху» — мн. ч., принято csl); ναός — храм."
  6: "νῦν δώσετε — «теперь дадите» (буд. вр.; csl «дадите» — повелит.); ἔπαρχος πέραν τοῦ ποταμοῦ — заречный начальник, сатрап (知事; πέραν τοῦ ποταμοῦ — «за рекой», обычное обозначение Заевфратья); Σαθαρβουζανα — サタルブザナ (слав. Сафарвузанай); Αφαρσαχαῖοι — アファルサハイ人 (слав. Афарсахеи); μακρὰν ὄντες ἐκεῖθεν — «будучи далеко оттуда» (причастие; в csl повелительное «далече отидите» — принято csl); ср. ст. 13, где назван и Фафнай."
  7: "ἄφετε τὸ ἔργον — оставьте дело (ἀφίημι, повелит.); οἱ ἀφηγούμενοι τῶν Ιουδαίων — «начальствующие Иудеев» (ユダヤの知事); οἱ πρεσβύτεροι — старейшины (長老); οἰκοδομείτωσαν — пусть строят; ἐπὶ τοῦ τόπου αὐτοῦ — на месте его (csl «на месте своем»)."
  8: "ἀπ᾿ ἐμοῦ ἐτέθη γνώμη — «от меня положено решение»; μήποτέ τι ποιήσητε — «чтобы вы никогда ничего не делали»; csl добавляет «противно» — понял как запрет противиться старейшинам (принято csl); ὑπάρχοντα βασιλέως τῶν φόρων — царское имущество из податей (φόρος — подать, 税); ἐπιμελῶς — тщательно; τὸ μὴ καταργηθῆναι — чтобы не прекратилось (καταργέω)."
  9: "ὃ ἂν ὑστέρημα — чего бы ни недоставало (ὑστέρημα); υἱοὺς βοῶν — «сынов волов», т. е. молодых быков (слав. «телцы», 若い雄牛); κριοί, ἀμνοί — бараны, агнцы; πυρός, ἅλας, οἶνος, ἔλαιον — пшеница, соль, вино, елей; κατὰ τὸ ῥῆμα τῶν ἱερέων — по слову священников; ἡμέραν ἐν ἡμέρᾳ — день за днём."
  10: "ἵνα ὦσιν προσφέροντες — чтобы они приносили; εὐωδία — благоухание (εὐωδίας — род. мн.; 芳しい香); προσεύχωνται εἰς ζωὴν τοῦ βασιλέως — молились о жизни царя (εἰς ζωήν — «за жизнь»); τῶν υἱῶν αὐτοῦ — сынов его."
  11: "καθαιρεθήσεται ξύλον ἐκ τῆς οἰκίας — будет выломано бревно из дома его (καθαιρέω); ὠρθωμένος παγήσεται ἐπ᾿ αὐτοῦ — «поднятый будет пригвождён к нему» (ὀρθόω, πήγνυμι); csl «воздвижен обесится на нем» — повешен (принято csl); ὁ οἶκος αὐτοῦ τὸ κατ᾿ ἐμὲ ποιηθήσεται — «дом его по мне сделается», т. е. будет конфискован; csl «мне будет взят» — принято csl."
  12: "οὗ κατασκηνοῖ τὸ ὄνομα — где обитает имя (κατασκηνόω); καταστρέψει — низложит (καταστρέφω); ἐκτενεῖ τὴν χεῖρα — прострет руку; ἀλλάξαι ἢ ἀφανίσαι — изменить или истребить; ἐγὼ Δαρεῖος ἔθηκα γνώμην — «я, Дарий, положил решение»; ἐπιμελῶς ἔσται — «с тщанием да будет»."
  13: "Θανθαναι — タンタナイ (слав. Фафанай, Синод. Фафнай); Σαθαρβουζανα — サタルブザナ; ἔπαρχος πέραν τοῦ ποταμοῦ — заречный начальник; πρὸς ὃ ἀπέστειλεν — «к тому, что послал»; ἐποίησαν ἐπιμελῶς — сделали тщательно."
  14: "ᾠκοδομοῦσαν — строили (имперфект); ἐν προφητείᾳ Αγγαιου … καὶ Ζαχαριου υἱοῦ Αδδω — по пророчеству Аггея и Захарии, сына Адды (Ἀδδώ — アド); ἀνῳκοδόμησαν καὶ κατηρτίσαντο — отстроили и совершили (ἀνοικοδομέω, καταρτίζω); ἀπὸ γνώμης θεοῦ — по решению Бога (csl «по повелению»); Кир, Дарий и Артаксеркс названы царями Персидскими."
  15: "ἐτέλεσαν — окончили; ἕως ἡμέρας τρίτης — «до третьего дня», к третьему дню; μὴν Αδαρ — месяц Адар (アダル); ἔτος ἕκτον τῇ βασιλείᾳ Δαρείου — шестой год царствования Дария."
  16: "ἐγκαίνια — обновление, освящение (ἐγκαίνια, 奉献); οἱ κατάλοιποι υἱῶν ἀποικεσίας — остальные из сынов переселения (ἀποικεσία — переселение, плен); ἐν εὐφροσύνῃ — в радости."
  17: "μόσχοι — тельцы; κριοί — бараны; ἀμνοί — агнцы; χίμαροι αἰγῶν — козлы (χίμαρος); περὶ ἁμαρτίας — за грех, жертва за грех; εἰς ἀριθμὸν φυλῶν Ισραηλ — по числу колен Израиля (φυλή)."
  18: "ἔστησαν — поставили; ἐν διαιρέσεσιν αὐτῶν — по их отделениям (διαίρεσις); ἐν μερισμοῖς αὐτῶν — по их чередам (μερισμός); ἐπὶ δουλείᾳ θεοῦ τοῦ ἐν Ιερουσαλημ — «на служение Богу в Иерусалиме»; csl «на служение дому Божия» — принято csl (神殿の務め); κατὰ τὴν γραφὴν βιβλίου Μωυσῆ — по написанному в книге Моисея."
  19: "τὸ πασχα — Пасха (過越); τεσσαρεσκαιδεκάτῃ τοῦ μηνὸς τοῦ πρώτου — в четырнадцатый день первого месяца; οἱ υἱοὶ τῆς ἀποικεσίας — сыны переселения, вернувшиеся из плена."
  20: "ἐκαθαρίσθησαν — очистились (καθαρίζω); ἕως εἷς πάντες καθαροί — «все до одного чисты» (ἕως εἷς — до одного); ἔσφαξαν τὸ πασχα — закололи пасхальное (σφάζω); τοῖς ἀδελφοῖς αὐτῶν τοῖς ἱερεῦσιν — братьям их священникам."
  21: "ἔφαγον τὸ πασχα — ели пасху; οἱ ἀπὸ τῆς ἀποικεσίας — бывшие из переселения; ὁ χωριζόμενος τῆς ἀκαθαρσίας ἐθνῶν — отделяющийся от нечистоты народов (χωρίζω); πρὸς αὐτοὺς τοῦ ἐκζητῆσαι κύριον — чтобы вместе с ними искать Господа (ἐκζητέω)."
  22: "ἑορτὴ τῶν ἀζύμων — праздник опресноков (ἄζυμα), 種なしパンの祭り; εὐφροσύνη — радость; ἐπέστρεψεν καρδίαν βασιλέως Ασσουρ — обратил сердце царя Ассирийского (так LXX называет Дария, ср. ст. 14); κραταιῶσαι τὰς χεῖρας αὐτῶν — укрепить руки их, т. е. поддержать в работе."
