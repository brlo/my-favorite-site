# jp-box, Иисус Навин, глава 5. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc есть в 5:10–15 —
# свидетель церковного чтения (старый язык), не источник.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 5: страх царей (1), обрезание в Галгале (2–9), Пасха, опресноки и
# прекращение манны (10–12), вождь воинства Господня (13–15).
# Речь Бога — 「…」 (2, 9); речь вождя воинства Господня и людей — 「…» (13–15);
# вложенной речи нет. Красного нет. jp-ni не использовался.
# Нумерация по gr: 15 стихов. У csl 16: csl 5:16 («Иерихон же заключен…») = gr 6:1,
# поэтому здесь он не переводится.
# 〔…〕 два, оба проверены по базе: 5:2 «〔二度目に〕» (слав. «второе», в gr нет)
# и 5:15 конец стиха «〔ヨシュアはそのとおりに行った。〕» (слав. «И сотвори Иисус тако»
# и jp-joc, в gr нет).
# Сносок ⟨…⟩ нет: 割礼, 過越, 種なしパン, マナ уже пояснены в корпусе.

tr_code: jp-box
book: nav
chapter: 5
draft: true

verses:
  1: "ヨルダンの向[む]こう側[がわ]にいたアモリ人[じん]の王[おう]たち、また海[うみ]のほとりにいたフェニキアの王たちは、主[しゅ]なる神[かみ]がヨルダン川[がわ]をイスラエルの子[こ]らの前[まえ]で干[ひ]上がらせ、彼[かれ]らが渡[わた]って行[い]くのを聞[き]いて、彼[かれ]らの思[おも]いは溶[と]け、おののいた。イスラエルの子[こ]らの前[まえ]に、彼[かれ]らには何[なん]の分別[ふんべつ]も残[のこ]っていなかった。"
  2: "そのころ、主[しゅ]はヨシュアに言[い]われた。「鋭[するど]い岩[いわ]から石[いし]の小刀[こがたな]を作[つく]り、座[すわ]って、イスラエルの子[こ]らに〔二度目[にどめ]に〕割礼[かつれい]を施[ほどこ]しなさい。」"
  3: "ヨシュアは石[いし]の小刀[こがたな]を作[つく]り、割礼[かつれい]の丘[おか]と呼[よ]ばれる場所[ばしょ]で、イスラエルの子[こ]らに割礼[かつれい]を施[ほどこ]した。"
  4: "ヨシュアがイスラエルの子[こ]らに割礼[かつれい]を施[ほどこ]した次第[しだい]はこうである。すなわち、道[みち]で生[う]まれた者[もの]たち、また、エジプトから出[で]て来[き]た者[もの]たちのうちで包皮[ほうひ]を切[き]られていなかった者たち、"
  5: "ヨシュアは彼[かれ]らすべてに割礼[かつれい]を施[ほどこ]した。"
  6: "イスラエルは四十二年の間[あいだ]、マドバリティスの荒野[こうや]を歩[あゆ]んだ。それゆえ、エジプトの地[ち]から出[で]て来[き]た者[もの]のうち、戦[いくさ]に加[くわ]わる者[もの]の多[おお]くは包皮[ほうひ]を切[き]られていなかった。彼[かれ]らは神[かみ]の掟[おきて]に背[そむ]いた者[もの]たちであった。主[しゅ]は彼[かれ]らに、父[ちち]たちに誓[ちか]ってわたしたちに与[あた]えると約束[やくそく]された地[ち]、乳[ちち]と蜜[みつ]の流[なが]れる地[ち]を見[み]ることがないと定[さだ]められたのである。"
  7: "代[か]わりに、彼[かれ]らの子[こ]らを立[た]てられた。ヨシュアは、彼[かれ]らが道[みち]で包皮[ほうひ]を切[き]られないままであったために、彼[かれ]らに割礼[かつれい]を施[ほどこ]したのである。"
  8: "割礼[かつれい]を受[う]けると、彼[かれ]らは宿営[しゅくえい]に座[すわ]ったまま、癒[いや]されるまで静[しず]かに過[す]ごした。"
  9: "主[しゅ]はヌンの子[こ]ヨシュアに言[い]われた。「今日[きょう]、わたしはエジプトの恥[はじ]をあなたがたから転[ころ]がした。」そして、その場所[ばしょ]の名[な]をガルガルと呼[よ]んだ。"
  10: "イスラエルの子[こ]らは、その月[つき]の十四日[じゅうよっか]の夕[ゆう]べに、ヨルダン川[がわ]の向[む]こう側[がわ]、エリコの西[にし]に当[あ]たる平野[へいや]で、過越[すぎこし]の祭[まつ]りを行[おこな]った。"
  11: "彼[かれ]らはその日[ひ]、その地[ち]の穀物[こくもつ]から、種[たね]なしパンと新[あら]たな穀物を食[た]べた。"
  12: "その地[ち]の穀物[こくもつ]を食[た]べた後[あと]、マナは絶[た]えた。イスラエルの子[こ]らにはもはやマナはなかった。彼[かれ]らはその年[とし]、フェニキアの地[ち]の実[みの]りを食[た]べた。"
  13: "ヨシュアがエリコにいたとき、目[め]を上[あ]げて見[み]ると、一人[ひとり]の人[ひと]が彼[かれ]の前[まえ]に立[た]ち、手[て]に抜[ぬ]き身[み]の剣[つるぎ]を持[も]っていた。ヨシュアは近[ちか]づいて彼[かれ]に言[い]った。「あなたはわたしたちの味方[みかた]ですか、それとも敵[てき]の者[もの]ですか。」"
  14: "彼[かれ]は言[い]った。「わたしは主[しゅ]の軍[いくさ]の将[つかさ]、今[いま]ここに来[き]た。」ヨシュアは顔[かお]を地[ち]に伏[ふ]して言[い]った。「わが主[しゅ]よ、あなたは僕[しもべ]に何[なに]を命[めい]じられるのですか。」"
  15: "主[しゅ]の軍[いくさ]の将[つかさ]はヨシュアに言[い]った。「あなたの足[あし]から履[は]き物[もの]を脱[ぬ]げ。あなたが立[た]っているこの場所[ばしょ]は聖[せい]だからである。」〔ヨシュアはそのとおりに行[おこな]った。〕"

notes:
  1: "ἐγένετο ὡς ἤκουσαν — «было, когда услышали». οἱ βασιλεῖς τῶν Αμορραίων — цари Аморреев; οἱ βασιλεῖς τῆς Φοινίκης οἱ παρὰ τὴν θάλασσαν — цари Финикии, при море (слав. «финическии»). ἀπεξήρανεν — иссушил (ἀποξηραίνω). ἐτάκησαν αὐτῶν αἱ διάνοιαι — «растаяли их мысли» (τήκω; διάνοια — ум, помысел; слав. «истаяша мысли их»). οὐκ ἦν ἐν αὐτοῖς φρόνησις οὐδεμία — не было в них никакого разумения, т. е. мужества (φρόνησις; слав. «не бяше в них смышления»). ἀπὸ προσώπου τῶν υἱῶν Ισραηλ — от лица сынов Израиля."
  2: "Ὑπὸ δὲ τοῦτον τὸν καιρόν — «в это время» (ὑπό + вин.). μαχαίρας πετρίνας ἐκ πέτρας ἀκροτόμου — каменные ножи из острого, необтёсанного камня (ἀκρότομος). καθίσας — «сев» (причастие; слав. «сед»). περίτεμε — обрежь (περιτέμνω). Слав. добавляет «второе» — в gr нет, взято в 〔…〕."
  3: "μαχαίρας πετρίνας ἀκροτόμους — острые каменные ножи. Βουνὸς τῶν ἀκροβυστιῶν — «Холм обрезаний» (βουνός — холм, ἀκροβυστία — крайняя плоть; 包皮). ἐπὶ τοῦ καλουμένου τόπου — на называемом месте."
  4: "περιεκάθαρεν — редкий глагол (περικαθαίρω, букв. «очистил кругом»); по смыслу — обрезал, слав. «обреза». ὅσοι ποτὲ ἐγένοντο ἐν τῇ ὁδῷ — все, кто когда-либо оказались на пути (γίνομαι; слав. «родишася»). ὅσοι ποτὲ ἀπερίτμητοι ἦσαν τῶν ἐξεληλυθότων ἐξ Αἰγύπτου — кто был необрезан из вышедших из Египта. Стих обрывается на запятой, продолжение в 5; в csl 5:4 добавлено «вси мужие ратнии измроша в пустыни» — это содержание gr 5:6."
  5: "πάντας τούτους περιέτεμεν Ἰησοῦς — всех их обрезал Иисус. Короткое заключение к ст. 4; в csl слито с ним."
  6: "τεσσαράκοντα γὰρ καὶ δύο ἔτη — сорок два года (LXX; в МТ и Синодальном — сорок). ἀνέστραπται — «обращался, жил» (ἀναστρέφω). ἐν τῇ ἐρήμῳ τῇ Μαδβαρίτιδι — в пустыне Мадбаритиде (слав. «мавдаритиде»). οἱ πλεῖστοι αὐτῶν τῶν μαχίμων — большинство из них, воинов. οἱ ἀπειθήσαντες τῶν ἐντολῶν τοῦ θεοῦ — непослушные заповедям Божиим (ἀπειθέω + род.). οἷς καὶ διώρισεν — которым и определил (διορίζω). γῆν ῥέουσαν γάλα καὶ μέλι — землю, текущую молоком и мёдом."
  7: "ἀντὶ δὲ τούτων — вместо них. ἀντικατέστησεν — поставил вместо (ἀντικαθίστημι); подлежащее — Бог. διὰ τὸ αὐτοὺς γεγενῆσθαι κατὰ τὴν ὁδὸν ἀπεριτμήτους — потому что они были на пути необрезанными (γίνομαι в перфекте с διά + вин.)."
  8: "περιτμηθέντες — будучи обрезаны. ἡσυχίαν εἶχον — имели покой (ἡσυχία). αὐτόθι καθήμενοι ἐν τῇ παρεμβολῇ — там, сидя в стане. ἕως ὑγιάσθησαν — доколе не исцелились (ὑγιάζω)."
  9: "Ἐν τῇ σήμερον ἡμέρᾳ — «в сей день» (ἐν + дат. с указательным). ἀφεῖλον — снял (ἀφαιρέω, аорист 1 л. ед. ч.). ὀνειδισμὸν Αἰγύπτου — поношение, посрамление Египта (ὀνειδισμός; слав. «поношение египетско»). Γαλγαλα — Галгал. Слав. добавляет «даже до сего дне» — в gr нет."
  10: "τὸ πασχα — Пасха (несклоняемое). τῇ τεσσαρεσκαιδεκάτῃ ἡμέρᾳ τοῦ μηνός — в четырнадцатый день месяца. ἀπὸ ἑσπέρας — с вечера. ἐπὶ δυσμῶν Ιεριχω — к западу от Иерихона (δυσμή — заход; слав. «на западе»). ἐν τῷ πέραν τοῦ Ιορδάνου ἐν τῷ πεδίῳ — за Иорданом, на равнине. Слав. и jp-joc добавляют «ополчились в Галгале» — в gr этого нет (в gr «за Иорданом»)."
  11: "ἐφάγοσαν ἀπὸ τοῦ σίτου τῆς γῆς — ели от пшеницы, хлеба земли (σῖτος). ἄζυμα καὶ νέα — опресноки и новое, новые зёрна (νέα, ср. мн.). ἐν ταύτῃ τῇ ἡμέρᾳ — в этот день."
  12: "ἐξέλιπεν τὸ μαννα — прекратилась манна (ἐκλείπω). μετὰ τὸ βεβρωκέναι αὐτούς — после того как они поели (inf. перфекта от βιβρώσκω). ἐκαρπίσαντο — вкусили плодов (καρπίζομαι). τὴν χώραν τῶν Φοινίκων — землю Финикии (LXX; речь о Ханаане). ἐν τῷ ἐνιαυτῷ ἐκείνῳ — в тот год."
  13: "ὡς ἦν Ἰησοῦς ἐν Ιεριχω — когда Иисус был в Иерихоне (слав. «у иерихона»). ἀναβλέψας τοῖς ὀφθαλμοῖς — подняв глаза. ἡ ῥομφαία ἐσπασμένη ἐν τῇ χειρὶ αὐτοῦ — меч обнажённый в руке его (σπάω — вынимать). Ἡμέτερος εἶ ἢ τῶν ὑπεναντίων — «наш ли ты или из противников» (ὑπεναντίος)."
  14: "ἀρχιστράτηγος δυνάμεως κυρίου — вождь воинства Господня (ἀρχιστράτηγος; 主の軍の将). νυνὶ παραγέγονα — «теперь пришёл» (παραγίνομαι, перфект). ἔπεσεν ἐπὶ πρόσωπον ἐπὶ τὴν γῆν — пал лицом на землю; слав. добавляет «и поклонися ему» — в gr нет. Δέσποτα — Владыка, господин (зват.); τί προστάσσεις τῷ σῷ οἰκέτῃ — что повелеваешь рабу твоему (προστάσσω; οἰκέτης)."
  15: "Λῦσαι τὸ ὑπόδημα ἐκ τῶν ποδῶν σου — развяжи, сними обувь с ног твоих (λύω; ὑπόδημα — 履き物). ὁ γὰρ τόπος, ἐφ᾿ ᾧ σὺ ἕστηκας, ἅγιός ἐστιν — место, на котором ты стоишь, свято. Слав. и jp-joc добавляют «И сотвори Иисус тако» — в gr нет, взято в 〔…〕."
