# jp-box, Псалтирь, псалом 82. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0.
# Псалом 82: вопль о том, чтобы Бог не молчал (1–2), заговор народов (3–5),
# перечень союзников (6–8), молитва о суде, как над Мадиамом (9–12),
# образы бури и огня (13–15), да познают имя Божие (16–18).
# Красного и синего нет. Кавычки: слова врагов в 4 и 12 — 「…」 (первый уровень).
# 〔…〕 нет: всё переведено по gr-lxx-byz, добавлений Церкви не вносилось.
# セラ (διάψαλμα, в конце ст. 8) не передаётся — по решению пользователя, как у jp-joc;
# в ст. 9 буквы «セラ» есть только внутри имени シセラ (Σισαρα), это не передача διάψαλμα.
# Сносок ⟨…⟩ нет: 天幕, 聖所, 車輪 уже в корпусе или понятны. jp-ni не использовался.

