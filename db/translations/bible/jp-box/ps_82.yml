verses:
  0: "歌[うた]。アサフの詩[うた]。"
  1: "神[かみ]よ、だれがあなたに似[に]ているだろうか。どうか黙[だま]らず、静[しず]まらずにいてください、神[かみ]よ。"
  2: "見[み]よ、あなたの敵[てき]は騒[さわ]ぎ立[た]ち、あなたを憎[にく]む者[もの]たちは頭[あたま]を上[あ]げたからです。"
  3: "彼[かれ]らはあなたの民[たみ]に対[たい]して悪[わる]だくみを企[くわだ]て、あなたが守[まも]られる者[もの]たちに逆[さから]って謀[はか]った。"
  4: "彼[かれ]らは言[い]った。「さあ、彼[かれ]らを一[ひと]つの民[たみ]としても滅[ほろ]ぼし、イスラエルの名[な]がもう思[おも]い出[だ]されないようにしよう」と。"
  5: "彼[かれ]らは心[こころ]を一[ひと]つにして共[とも]に謀[はか]り、あなたに逆[さから]って契約[けいやく]を結[むす]んだ。"
  6: "エドムの天幕[てんまく]とイシュマエル人[じん]、モアブとハガル人[じん]、"
  7: "ゲバルとアンモンとアマレク、ペリシテ人[じん]とティルスに住[す]む者[もの]たち。"
  8: "アッシリアも彼[かれ]らとともに行[ゆ]き、ロトの子[こ]らを助[たす]ける手[て]となった。"
  9: "彼[かれ]らに、ミディアンに、シセラに、キションの川[かわ]のほとりでヤビンにしたようにしてください。"
  10: "彼[かれ]らはエンドルで滅[ほろ]ぼされ、地[ち]の肥[こ]やしとなった。"
  11: "彼[かれ]らの首[しゅ]領[りょう]たちを、オレブとゼエブ、ゼバフとサルマナのようにしてください。彼[かれ]らのすべての首[しゅ]領[りょう]たちを。"
  12: "彼[かれ]らは言[い]った。「神[かみ]の聖所[せいしょ]を自分[じぶん]たちのものとして取[と]ろう」と。"
  13: "わたしの神[かみ]よ、彼[かれ]らを車輪[しゃりん]のように、風[かぜ]の前[まえ]のわらのようにしてください。"
  14: "火[ひ]が森[もり]を焼[や]き尽[つ]くすように、炎[ほのお]が山[やま]々[やま]を焦[こが]すように、"
  15: "そのように、あなたの嵐[あらし]で彼[かれ]らを追[お]い、あなたの怒[いか]りで彼[かれ]らをかき乱[みだ]してください。"
  16: "彼[かれ]らの顔[かお]を恥[はじ]で満[み]たしてください。そうすれば、彼[かれ]らはあなたの名[な]を求[もと]めます、主[しゅ]よ。"
  17: "彼[かれ]らをとこしえに恥[は]じ、かき乱[みだ]されるままにし、辱[はずか]しめられて滅[ほろ]びるままにしてください。"
  18: "そして、彼[かれ]らが知[し]るようにしてください。あなたの名[な]は主[しゅ]であり、あなただけが全[ぜん]地[ち]のいと高[たか]き方[かた]であることを。"

notes:
  0: "Ὠιδὴ ψαλμοῦ τῷ Ασαφ — 歌。アサフの詩 (ᾠδή — 歌; ψαλμός — 詩; у jp-joc 歌。アサフの詠). Надписание — стих 0."
  1: "Ὁ θεός, τίς ὁμοιωθήσεταί σοι; — 神よ、だれがあなたに似ているでしょうか (ὁμοιόω — «уподобляться»; риторический вопрос). μὴ σιγήσῃς μηδὲ καταπραΰνῃς — どうか黙らず、静まらずにいてください (σιγάω — «молчать»; καταπραΰνω — «успокаивать, смягчать»; слав. «не премолчи, ниже укроти»)."
  2: "ὅτι ἰδοὺ οἱ ἐχθροί σου ἤχησαν — 見よ、あなたの敵は騒ぎ立った (ἠχέω — «шуметь»). οἱ μισοῦντές σε ἦραν κεφαλήν — あなたを憎む者たちは頭を上げた (αἴρω — «поднимать»)."
  3: "ἐπὶ τὸν λαόν σου κατεπανουργεύσαντο γνώμην — 彼らはあなたの民に対して悪だくみを企て (καταπανουργεύομαι — «коварно замышлять»; γνώμη — «замысел»). ἐβουλεύσαντο κατὰ τῶν ἁγίων σου — あなたが守られる者たちに逆らって謀った (ἅγιοι — 聖なる者たち, здесь «хранимые Тобою», как у Синодального)."
  4: "εἶπαν· Δεῦτε καὶ ἐξολεθρεύσωμεν αὐτοὺς ἐξ ἔθνους — さあ、彼らを一つの民としても滅ぼし (ἐξολεθρεύω — «истреблять»; ἐξ ἔθνους — «из народов», т. е. чтобы не были народом). οὐ μὴ μνησθῇ τὸ ὄνομα Ισραηλ ἔτι — イスラエルの名がもう思い出されないように (μνησθῇ — «вспомянуто будет»). Слова врагов — 「」."
  5: "ἐβουλεύσαντο ἐν ὁμονοίᾳ ἐπὶ τὸ αὐτό — 彼らは心を一つにして共に謀り (ὁμόνοια — «единомыслие»; ἐπὶ τὸ αὐτό — «вместе»). κατὰ σοῦ διαθήκην διέθεντο — あなたに逆らって契約を結んだ (διαθήκη — 契約; διατίθεμαι — «заключать завет»)."
  6: "τὰ σκηνώματα τῶν Ιδουμαίων — エドムの天幕の民 (σκήνωμα — 天幕, жилище; Ιδουμαῖοι — エドム人). οἱ Ισμαηλῖται — イシュマエル人. Μωαβ — モアブ. οἱ Αγαρηνοί — ハガル人 (потомки Агари; у jp-joc アガリ人)."
  7: "Γεβαλ — ゲバル (Γεβαλ, слав. Гевал). Αμμων — アンモン. Αμαληκ — アマレク. ἀλλόφυλοι — ペリシテ人 (как в Пс 55:1). οἱ κατοικοῦντες Τύρον — ティルスに住む者たち."
  8: "καὶ γὰρ καὶ Ασσουρ συμπαρεγένετο μετ᾽ αὐτῶν — アッシリアも彼らとともに行き (συμπαραγίνομαι — «присоединяться»). ἐγενήθησαν εἰς ἀντίλημψιν τοῖς υἱοῖς Λωτ — ロトの子らを助ける手となった (ἀντίλημψις — «поддержка, опора», слав. «в заступление»). διάψαλμα в конце стиха не передаётся."
  9: "ποίησον αὐτοῖς ὡς τῇ Μαδιαμ — 彼らに、ミディアンにしたようにしてください (Μαδιαμ — ミディアン, Суд 7). ὡς τῷ Σισαρα, ὡς ὁ Ιαβιν ἐν τῷ χειμάρρῳ Κισων — シセラに、キションの川のほとりでヤビンにしたように (Σισαρα — Сисара, Ιαβιν — Иавин, Суд 4; χείμαρρος — «поток»)."
  10: "ἐξωλεθρεύθησαν ἐν Αενδωρ — 彼らはエンドルで滅ぼされ (Αενδωρ — Аендор; ἐξολεθρεύω — «истреблять»). ἐγενήθησαν ὡσεὶ κόπρος τῇ γῇ — 地の肥やしとなった (κόπρος — «навоз»)."
  11: "θοῦ τοὺς ἄρχοντας αὐτῶν ὡς τὸν Ωρηβ καὶ Ζηβ — 彼らの首領たちを、オレブとゼエブのようにしてください (Ωρηβ — Орив, Ζηβ — Зив, Суд 7:25). καὶ Ζεβεε καὶ Σαλμανα — ゼバフとサルマナ (Ζεβεε — Зеев/Зевех, Σαλμανα — Салман, Суд 8; даны привычные японские формы). πάντας τοὺς ἄρχοντας αὐτῶν — 彼らのすべての首領たちを (повтор сохранён)."
  12: "οἵτινες εἶπαν· Κληρονομήσωμεν ἑαυτοῖς τὸ ἁγιαστήριον τοῦ θεοῦ — 神の聖所を自分たちのものとして取ろう (κληρονομέω — «наследовать, завладевать»; ἁγιαστήριον — 聖所, как в Пс 72:17). Слова врагов — 「」."
  13: "ὁ θεός μου, θοῦ αὐτοὺς ὡς τροχόν — わたしの神よ、彼らを車輪のようにしてください (τροχός — «колесо», образ пыли от колеса). ὡς καλάμην κατὰ πρόσωπον ἀνέμου — 風の前のわらのように (καλάμη — «солома»)."
  14: "ὡσεὶ πῦρ, ὃ διαφλέξει δρυμόν — 火が森を焼き尽くすように (διαφλέγω — «воспламенять»; δρυμός — «дубрава»). ὡς εἰ φλὸξ κατακαύσαι ὄρη — 炎が山々を焦がすように (φλόξ — «пламя»)."
  15: "οὕτως καταδιώξεις αὐτοὺς ἐν τῇ καταιγίδι σου — そのように、あなたの嵐で彼らを追い (καταδιώκω — «гнать, преследовать»; καταιγίς — «буря»). ἐν τῇ ὀργῇ σου ταρ άξεις αὐτούς — あなたの怒りで彼らをかき乱してください (ταράσσω — «приводить в смятение»)."
  16: "πλήρωσον τὰ πρόσωπα αὐτῶν ἀτιμίας — 彼らの顔を恥で満たしてください (ἀτιμία — «бесчестие»). ζητήσουσιν τὸ ὄνομά σου, κύριε — そうすれば、彼らはあなたの名を求めます、主よ."
  17: "αἰσχυνθήτωσαν καὶ ταραχθήτωσαν εἰς τὸν αἰῶνα τοῦ αἰῶνος — 彼らをとこしえに恥じ、かき乱されるままにし (αἰσχύνω — «стыдить»; усилительное «в век века» сохранено とこしえに). ἐντραπήτωσαν καὶ ἀπολέσθωσαν — 辱しめられて滅びるままにしてください (ἐντρέπω — «посрамлять»)."
  18: "καὶ γνώτωσαν ὅτι ὄνομά σοι κύριος — そして、彼らが知るようにしてください。あなたの名は主であり. σὺ μόνος ὕψιστος ἐπὶ πᾶσαν τὴν γῆν — あなただけが全地のいと高き方であることを (μόνος — «единственный»; ὕψιστος — いと高き方)."
