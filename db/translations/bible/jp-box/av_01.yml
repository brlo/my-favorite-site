# jp-box, Авдий, глава 1. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz глава одна, 21 стих (совпадает).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1 надписание, весть о войне против Едома; 2–4 уничижение и гордость
# едомлян, «кто низринет меня на землю», гнездо до звезд; 5–6 полное разорение,
# «как обобрано все у Исава»; 7 союзники и мирные предают; 8–9 гибель мудрых
# и храбрых Фемана; 10–14 вина: брат Иаков, день бедствия, ворота, перекрестки;
# 15–16 день Господень на все народы, чаша; 17–21 спасение на горе Сион, дом
# Иакова — огонь, дом Иосифа — пламя, остаток у Господа, «будет царство Господа».
# Голоса: 1а — надписание вне кавычек; 1б–21 — одно слово Господа в 「…» до конца
# главы (в 1 призыв к народам — 『…』, в 3 слова Едома в сердце — 『…』);
# «говорит Господь» в 4, 8, 15 — внутри речи, само слово в кавычках не отбивается.
# Едом говорит о себе в 1 л. («кто низринет меня»), пророк и Господь обращаются
# к нему во 2 л. ед. ч.; в 15–16 — переход к 2 л. ед. ч. и к 3 л. мн. ч. (народы).
# Слав. редакционные скобки не переносились: 1:7 «(ядущии с тобою)» — чтение МТ
# («хлеб твой»), в LXX его нет (см. notes 7); 1:5 «о‹емлющии» — дефект набора.
#
tr_code: jp-box
book: av
chapter: 1
draft: true

verses:
  1: "オバデヤの幻[まぼろし]。主[しゅ]である神[かみ]はエドムについてこう言[い]われる。「わたしは主[しゅ]からこの知[し]らせを聞[き]いた。諸国民[しょこくみん]には、こう告[つ]げが遣[つか]わされた。『立[た]て、エドムに向[む]かって戦[たたか]いを起[お]こそう』と。"
  2: "見[み]よ、わたしはあなたを諸国民[しょこくみん]のうちで小[ちい]さくした。あなたはひどく辱[はずかし]められている。"
  3: "あなたの心[こころ]の高慢[こうまん]があなたを引[ひ]き上[あ]げた。あなたは岩[いわ]の裂[さ]け目[め]に住[す]み、その住[す]まいを高[たか]くして、心[こころ]のうちで言[い]う。『だれがわたしを地[ち]に下[お]ろすのか』と。"
  4: "たとえあなたが鷲[わし]のように高[たか]く上[あ]がり、星[ほし]の間[あいだ]にあなたの巣[す]を置[お]いても、わたしはそこからあなたを下[お]ろす、と主[しゅ]は言[い]われる。"
  5: "もし盗人[ぬすびと]たちがあなたのところへ入[はい]り、夜[よる]の強盗[ごうとう]が来[き]たのなら、あなたはどこへ投[な]げ捨[す]てられたというのか。彼らは自分[じぶん]に足[た]りるだけを盗[ぬす]むのではないか。もしぶどうを摘[つ]み取[と]る者[もの]たちがあなたのところへ来[き]たのなら、彼らは摘[つ]み残[のこ]しを残[のこ]すのではないか。"
  6: "エサウはなんと調[しら]べ尽[つ]くされ、その隠[かく]し物[もの]はなんと取[と]り出[だ]されたことか。"
  7: "あなたの契約[けいやく]の男[おとこ]たちはみな、あなたを国[くに]の境[さかい]まで追[お]い出[だ]した。あなたと平和[へいわ]に暮[く]らす者[もの]たちはあなたに逆[さから]い、あなたに勝[か]った。あなたの下[した]に罠[わな]を仕掛[しか]けた者[もの]たちがいる。彼らには悟[さと]りがない。"
  8: "その日[ひ]、と主[しゅ]は言[い]われる、わたしはエドムから知恵[ちえ]ある者[もの]たちを、エサウの山[やま]から悟[さと]りを滅[ほろ]ぼす。"
  9: "テマンから出[で]るあなたの戦士[せんし]たちは恐[おそ]れおののく。それは、エサウの山[やま]から人[ひと]が断[た]ち絶[た]やされるためである。"
  10: "あなたの兄弟[きょうだい]ヤコブに対[たい]する殺[さつ]害[がい]と不敬[ふけい]のゆえに、恥[はじ]があなたを覆[おお]い、あなたは永遠[えいえん]に断[た]ち絶[た]やされる。"
  11: "あなたが向[む]こう側[がわ]に立[た]った日[ひ]、すなわち、他国人[たこくじん]たちがその軍[ぐん]を捕囚[ほしゅう]とした日[ひ]、異国人[いこくじん]たちがその門[もん]に入[はい]り、エルサレムについてくじを投[な]げた日[ひ]、あなたも彼らの一人[ひとり]のようであった。"
  12: "あなたは兄弟[きょうだい]の日[ひ]に、他国人[たこくじん]の日[ひ]に、これを見[み]てはならない。ユダの子[こ]らが滅[ほろ]びる日[ひ]に喜[よろこ]んではならない。苦難[くなん]の日[ひ]に大[おお]げさに語[かた]ってはならない。"
  13: "彼らの苦[くる]しみの日[ひ]に、わたしの民[たみ]の門[もん]に入[はい]ってはならない。彼らの滅[ほろ]びの日[ひ]に、あなたもその集[つど]いを見[み]てはならない。彼らの滅[ほろ]びの日[ひ]に、その軍勢[ぐんぜい]に手[て]を出[だ]してはならない。"
  14: "彼らの逃[に]げ道[みち]に立[た]って、のがれ残[のこ]る者[もの]たちを断[た]ち切[き]ってはならない。苦難[くなん]の日[ひ]に、その逃[に]げる者[もの]たちを閉[と]じ込[こ]めてはならない。"
  15: "主[しゅ]の日[ひ]がすべての国民[こくみん]の上[うえ]に近[ちか]づいているからである。あなたがしたように、あなたにもなされる。あなたの報[むく]いはあなたの頭[あたま]に返[かえ]って来[く]る。"
  16: "あなたがわたしの聖[せい]なる山[やま]で飲[の]んだように、すべての国民[こくみん]はぶどう酒[しゅ]を飲[の]む。彼らは飲[の]み、下[くだ]り、いない者[もの]のようになる。"
  17: "しかし、シオンの山[やま]には救[すく]いがある。そこは聖[せい]なる所[ところ]となる。ヤコブの家[いえ]は、自分[じぶん]たちを領[りょう]した者[もの]たちを領[りょう]する。"
  18: "ヤコブの家[いえ]は火[ひ]となり、ヨセフの家[いえ]は炎[ほのお]となる。エサウの家[いえ]はわらとなる。彼らはエサウの家[いえ]に燃[も]え上がり、これを食[く]い尽[つ]くす。エサウの家[いえ]には逃[に]げ延[の]びる者[もの]がなくなる。主[しゅ]が語[かた]られたからである。"
  19: "ナゲブにいる者[もの]たちはエサウの山[やま]を、セファラにいる者[もの]たちはペリシテ人[じん]を領[りょう]する。彼らはエフライムの山[やま]とサマリアの野[の]、またベニヤミンとギレアデを領[りょう]する。"
  20: "イスラエルの子[こ]らへのこの捕囚[ほしゅう]の始[はじ]まりは、カナン人[じん]の地[ち]をサレプタまでとする。エルサレムの捕囚[ほしゅう]はエフラタまで及び、彼らはナゲブの町[まち]々[まち]を領[りょう]する。"
  21: "救[すく]われた者[もの]たちは、エサウの山[やま]を裁[さば]くためにシオンの山[やま]から上[のぼ]って来[く]る。王国[おうこく]は主[しゅ]のものとなる。」"

notes:
  1: "Ὅρασις Αβδιου — «видение Авдия» (слав. «видение авдиино»), надписание, не отбивается кавычками. Τάδε λέγει κύριος ὁ θεὸς τῇ Ιδουμαίᾳ — «так говорит Господь Бог Идумее» (слав. «идумеи»); в тексте «エドム» — по корпусу и брифу. Ἀκοὴν ἤκουσα παρὰ κυρίου — «я услышал весть от Господа» (1 л. ед. ч.; в ru «слышали мы»). περιοχὴν εἰς τὰ ἔθνη ἐξαπέστειλεν — «и послал весть (περιοχή — известие, послание; слав. «известие») к народам». Ἀνάστητε καὶ ἐξαναστῶμεν ἐπ᾽ αὐτὴν εἰς πόλεμον — «встаньте, и восстанем на неё войною»: мн. ч., призыв к народам против Идумеи (αὐτήν — ж. р. по τῇ Ιδουμαίᾳ), поэтому вложенная 『…』."
  2: "ὀλιγοστὸν δέδωκά σε ἐν τοῖς ἔθνεσιν — «малым Я сделал тебя между народами» (слав. «мала дах тя во языцех»); ἠτιμωμένος σὺ εἶ σφόδρα — «ты в большом поругании»."
  3: "ὑπερηφανία τῆς καρδίας σου ἐπῆρέν σε — «гордость сердца твоего вознесла тебя» (слав. «презорство сердца твоего воздвиже тя»); ἐν ταῖς ὀπαῖς τῶν πετρῶν — «в расселинах скал» (ὀπή — расселина, нора); ὑψῶν κατοικίαν αὐτοῦ — «возвышая жилище своё» (3 л. ед. ч.: смена лица, слав. «возвышаяй храмину свою»); Τίς με κατάξει ἐπὶ τὴν γῆν — «кто низведёт меня на землю», внутренняя речь — 『…』."
  4: "μετεωρισθῇς ὡς ἀετός — «вознесёшься, как орёл»; ἀνὰ μέσον τῶν ἄστρων θῇς νοσσιάν σου — «среди звёзд положишь гнездо твоё»; ἐκεῖθεν κατάξω σε — «оттуда низведу тебя». λέγει κύριος внутри речи, второй раз кавычки не ставятся."
  5: "εἰ κλέπται εἰσῆλθον πρὸς σὲ ἢ λῃσταὶ νυκτός — «если бы воры вошли к тебе или ночные разбойники»; ποῦ ἂν ἀπερρίφης — «где бы ты был выброшен» — трудное место: МТ читается «как ты разорён», LXX даёт риторический вопрос; смысл сравнения — воры берут лишь нужное, ты же разорён весь (ст. 6), и в тексте вопрос сохранён без сглаживания. τὰ ἱκανὰ ἑαυτοῖς — «достаточное себе»; οὐκ ἂν ὑπελίποντο ἐπιφυλλίδα — «разве не оставили бы они остатков» (ἐπιφυλλίς — остаток после сбора винограда, слав. «гроздие»)."
  6: "πῶς ἐξηρευνήθη Ησαυ — «как изыскан Исав» (ἐξερευνάω — выискивать, обыскивать); κατελήμφθη αὐτοῦ τὰ κεκρυμμένα — «взято сокровенное его»."
  7: "ἕως τῶν ὁρίων σου ἐξαπέστειλάν σε — «до пределов твоих выслали тебя»; ἄνδρες τῆς διαθήκης σου — «мужи завета твоего»; ἠδυνάσθησαν πρὸς σὲ ἄνδρες εἰρηνικοί σου — «одолели тебя мужи мирные твои» (слав. «мужие мирницы твои»); ἔθηκαν ἔνεδρα ὑποκάτω σου — «положили засаду под тобою»; οὐκ ἔστιν σύνεσις αὐτοῖς — «нет разумения в них». Слав. вставка в скобках «(ядущии с тобою)» («хлеб твой», МТ) — редакционная, в LXX её нет, в текст не внесена."
  8: "ἀπολῶ σοφοὺς ἐκ τῆς Ιδουμαίας — «погублю премудрых от Идумеи»; σύνεσιν ἐξ ὄρους Ησαυ — «и разумение от горы Исава» (слав. «смысл от горы исавовы»)."
  9: "πτοηθήσονται οἱ μαχηταί σου οἱ ἐκ Θαιμαν — «устрашатся воины твои, что от Фемана»; ὅπως ἐξαρθῇ ἄνθρωπος ἐξ ὄρους Ησαυ — «чтобы исторгнут был человек с горы Исава» (слав. «да отимется человек»); ἄνθρωπος здесь в собирательном смысле — «человек, всякий»."
  10: "διὰ τὴν σφαγὴν καὶ τὴν ἀσέβειαν τὴν εἰς τὸν ἀδελφόν σου Ιακωβ — «за убийство и нечестие против брата твоего Иакова»; καλύψει σε αἰσχύνη — «покроет тебя стыд»; ἐξαρθήσῃ εἰς τὸν αἰῶνα — «исторгнут будешь вовеки»."
  11: "ἀφ᾽ ἧς ἡμέρας ἀντέστης ἐξ ἐναντίας — «с того дня, как ты встал напротив»; αἰχμαλωτευόντων ἀλλογενῶν δύναμιν αὐτοῦ — «когда иноплеменники уводили в плен войско его»; ἀλλότριοι εἰσῆλθον εἰς πύλας αὐτοῦ — «чужие вошли в ворота его»; ἐπὶ Ιερουσαλημ ἔβαλον κλήρους — «об Иерусалиме бросили жребии»; σὺ ἦς ὡς εἷς ἐξ αὐτῶν — «и ты был как один из них»."
  12: "μὴ ἐπίδῃς ἡμέραν ἀδελφοῦ σου ἐν ἡμέρᾳ ἀλλοτρίων — «не смотри на день брата твоего в день чужих» (слав. «да не презриши дне брата твоего в день чуждих»); μὴ ἐπιχαρῇς ἐπὶ τοὺς υἱοὺς Ιουδα — «не радуйся о сынах Иуды»; μὴ μεγαλορρημονήσῃς — «не велеречь» (слав. «да не велеречиши»)."
  13: "εἰς πύλας λαῶν — «в ворота народов»; слав. читает «во врата людий моих» — по паритету в тексте «わたしの民の門», вариант LXX в notes. μηδὲ ἐπίδῃς καὶ σὺ τὴν συναγωγὴν αὐτῶν — «и ты не смотри на собрание их» (συναγωγή — собрание, слав. «сонм»); μηδὲ συνεπιθῇ ἐπὶ τὴν δύναμιν αὐτῶν — «и не нападай вместе на силу их» (συνεπιτίθημι — нападать вместе; слав. «не совещайся на силу их» — иное понимание), в тексте «手を出してはならない», буквальность оговорена здесь."
  14: "μηδὲ ἐπιστῇς ἐπὶ τὰς διεκβολὰς αὐτῶν — «и не становись на переходах (развилках, броде) их» (διεκβολή — выход, переправа; слав. «на исходы их»); τοῦ ἐξολεθρεῦσαι τοὺς ἀνασῳζομένους αὐτῶν — «чтобы истребить спасающихся их»; μηδὲ συγκλείσῃς τοὺς φεύγοντας — «и не замыкай бегущих» (слав. «ниже заключай бежащыя»)."
  15: "διότι ἐγγὺς ἡμέρα κυρίου ἐπὶ πάντα τὰ ἔθνη — «ибо близок день Господень на все народы»; ὃν τρόπον ἐποίησας, οὕτως ἔσται σοι — «как ты сделал, так будет и тебе»; τὸ ἀνταπόδομά σου ἀνταποδοθήσεται εἰς κεφαλήν σου — «воздаяние твоё воздастся на главу твою» (слав. «воздастся на главу твою»)."
  16: "ὃν τρόπον ἔπιες ἐπὶ τὸ ὄρος τὸ ἅγιόν μου — «как ты пил на святой горе Моей» (2 л. ед. ч.); πίονται πάντα τὰ ἔθνη οἶνον — «будут пить все народы вино» (3 л. мн. ч.: смена лица, как в слав.); πίονται καὶ καταβήσονται καὶ ἔσονται καθὼς οὐχ ὑπάρχοντες — «будут пить, и сойдут, и будут как не существующие»."
  17: "ἐν δὲ τῷ ὄρει Σιων ἔσται ἡ σωτηρία — «на горе же Сионе будет спасение» (слав. «в горе же сиони будет спасение»); ἔσται ἅγιον — «и будет свято» (слав. «и будет свята»); κατακληρονομήσουσιν ὁ οἶκος Ιακωβ τοὺς κατακληρονομήσαντας αὐτούς — «дом Иакова наследует наследовавших их» (слав. «наследят дом иаковль наследивших я»)."
  18: "ὁ οἶκος Ιακωβ πῦρ, ὁ δὲ οἶκος Ιωσηφ φλόξ — «дом Иакова — огонь, дом Иосифа — пламя»; ὁ δὲ οἶκος Ησαυ εἰς καλάμην — «дом Исава — в солому (хворост)»; ἐκκαυθήσονται εἰς αὐτοὺς καὶ καταφάγονται αὐτούς — «возгорятся на них и поедят их»; οὐκ ἔσται πυροφόρος — «не будет носящего огонь», т. е. никого, кто уцелел бы (слав. «не будет избегаяй»)."
  19: "οἱ ἐν Ναγεβ — «те, что в Нагеве» (Ναγεβ — юг, Негев; в слав. «иже во нагеве»); οἱ ἐν τῇ Σεφηλα — «те, что в Сефиле» (Σεφηλα — низменность, Шефела; слав. «иже в раздолии»); τοὺς ἀλλοφύλους — «иноплеменников», т. е. филистимлян (ペリシテ人 по корпусу); τὸ πεδίον Σαμαρείας — «поле Самарии»."
  20: "τῆς μετοικεσίας ἡ ἀρχὴ αὕτη — «это начало переселения» (слав. «преселения начало сие») — тёмное место; τοῖς υἱοῖς Ισραηλ γῆ τῶν Χαναναίων ἕως Σαρεπτων — «сынам Израиля земля Ханаанская до Сарепты»; ἡ μετοικεσία Ιερουσαλημ ἕως Εφραθα — «переселение Иерусалима до Ефрафы»; κληρονομήσουσιν τὰς πόλεις τοῦ Ναγεβ — «наследуют города Нагева». Синтаксис LXX и слав. совпадает, но допускает иное членение (ср. ru); в тексте держимся LXX/слав. без сглаживания."
  21: "ἀναβήσονται ἄνδρες σεσῳσμένοι ἐξ ὄρους Σιων — «взойдут спасённые (мужи спасаемые) с горы Сиона»; τοῦ ἐκδικῆσαι τὸ ὄρος Ησαυ — «чтобы отмстить (судить) гору Исава»; ἔσται τῷ κυρίῳ ἡ βασιλεία — «и будет Господу царство» (слав. «будет Царство Господеви»)."
