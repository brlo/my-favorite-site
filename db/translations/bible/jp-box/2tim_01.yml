# jp-box, 2-е Послание к Тимофею, глава 1. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 1: надписание и приветствие (1–2), благодарение и память о вере (3–5),
# призыв возгревать дар и не стыдиться (6–8), спасение и призвание по благодати (9–10),
# Павел — проповедник, апостол и учитель (11), «я знаю, в Кого уверовал» (12),
# держать образец здравого учения и доброе предание (13–14),
# все в Асии оставили Павла (15), Онисифор и его дом (16–18).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет, <j>/<mo> не ставятся.
# 〔…〕 одно — 1:11 〔異邦人の〕: в базе стих кончается на διδάσκαλος, ἐθνῶν нет
# (проверено запросом к gr-lxx-byz: «εθνων» — НЕТ), а церковный текст читает «учитель язычников».
# πνεῦμα: 1:7 πνεῦμα δειλίας — 霊[れい]; 1:14 πνεῦμα ἅγιον — пара {聖霊|聖神}.
# Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

tr_code: jp-box
book: 2tim
chapter: 1
draft: true

verses:
  1: "パウロ、神[かみ]の御心[みこころ]により、キリスト・イエスにある命[いのち]の約束[やくそく]に従[したが]って、キリスト・イエスの使徒[しと]とされた者[もの]である。"
  2: "愛[あい]する子[こ]テモテへ。恵[めぐ]みとあわれみと平和[へいわ]が、父[ちち]である神[かみ]と、わたしたちの主[しゅ]キリスト・イエスから、あなたにありますように。"
  3: "わたしは、先祖[せんぞ]から清[きよ]い良心[りょうしん]をもって仕[つか]えてきた神[かみ]に感謝[かんしゃ]している。あなたのことを、昼[ひる]も夜[よる]も、絶[た]えず祈[いの]りのうちに覚[おぼ]えているからである。"
  4: "あなたの涙[なみだ]を思[おも]い起[おこ]しながら、あなたに会[あ]いたいと切[せつ]に願[ねが]っている。わたしが喜[よろこ]びで満[み]たされるためである。"
  5: "あなたのうちにある、偽[いつわ]りのない信仰[しんこう]を思[おも]い起[おこ]しているからである。この信仰[しんこう]は、まずあなたの祖母[そぼ]ロイスと母[はは]ユニケのうちに宿[やど]り、あなたのうちにも宿[やど]っていると、わたしは確[たし]かに信[しん]じている。"
  6: "そのために、わたしはあなたに、わたしが手[て]を置[お]いたことによってあなたのうちにある神[かみ]の賜物[たまもの]を、再[ふたた]び燃[も]え立[た]たせるように勧[すす]める。"
  7: "というのは、神[かみ]がわたしたちに与[あた]えてくださったのは、弱[よわ]気[き]の霊[れい]ではなく、力[ちから]と愛[あい]と自制[じせい]との霊[れい]である。"
  8: "だから、あなたは、わたしたちの主[しゅ]の証[あかし]を恥[は]じず、また、主[しゅ]の囚人[しゅうじん]であるわたしを恥[は]じないで、神[かみ]の力[ちから]に従[したが]って、福音[ふくいん]のために苦[くる]しみをともに忍[しの]んでほしい。"
  9: "神[かみ]はわたしたちを救[すく]い、聖[せい]なる召[め]しをもって召[め]してくださった。わたしたちの行[おこな]いによるのではなく、神[かみ]ご自身[じしん]の目的[もくてき]と恵[めぐ]みによるのである。この恵[めぐ]みは、時[とき]の始[はじ]めより前[まえ]から、キリスト・イエスにあってわたしたちに与[あた]えられ、"
  10: "今[いま]、わたしたちの救[すく]い主[ぬし]キリスト・イエスの現[あらわ]れによって明[あき]らかにされたのである。この方[かた]は死[し]を滅[ほろ]ぼし、福音[ふくいん]によって命[いのち]と不[ふ]朽[きゅう]とを照[て]らし出[だ]された。"
  11: "わたしはこの福音[ふくいん]のために、宣[せん]べ伝[つた]える者[もの]、使徒[しと]、そして〔異邦人[いほうじん]の〕教師[きょうし]として立[た]てられたのである。"
  12: "そのために、わたしはこれらの苦[くる]しみを受[う]けているが、恥[は]じていない。わたしは、自分[じぶん]が信[しん]じた方[かた]を知[し]っており、この方[かた]が、わたしの委[ゆだ]ねたものをかの日[ひ]まで守[まも]ることができると、確信[かくしん]しているからである。"
  13: "あなたは、わたしから聞[き]いた健全[けんぜん]な言葉[ことば]の手本[てほん]を、キリスト・イエスにある信仰[しんこう]と愛[あい]とをもって保[たも]ちなさい。"
  14: "あなたに委[ゆだ]ねられた善[よ]きものを、わたしたちのうちに住[す]んでおられる{聖霊[せいれい]|聖神[せいしん]}によって守[まも]りなさい。"
  15: "あなたが知[し]っているとおり、アジア州[しゅう]にいる者[もの]たちはみな、わたしから離[はな]れて行[い]った。その中[なか]にはフィゲロとエルモゲネがいる。"
  16: "どうか、主[しゅ]がオネシポロの家[いえ]に、あわれみをお与[あた]えになりますように。彼[かれ]はしばしばわたしを元気[げんき]づけ、わたしの鎖[くさり]を恥[は]じなかったからである。"
  17: "それどころか、ローマに着[つ]くと、熱心[ねっしん]にわたしを捜[さが]し、見[み]つけ出[だ]してくれた。"
  18: "どうか、主[しゅ]が、かの日[ひ]に、彼[かれ]が主[しゅ]からあわれみを見[み]いだすことをお許[ゆる]しくださいますように。また、彼[かれ]がエフェソでどれほどわたしに仕[つか]えたかは、あなたがよく知[し]っている。"

notes:
  1: "Παῦλος ἀπόστολος Χριστοῦ Ἰησοῦ — パウロ、…キリスト・イエスの使徒, порядок греческого сохранён. διὰ θελήματος θεοῦ — 神の御心により. κατ᾿ ἐπαγγελίαν ζωῆς τῆς ἐν Χριστῷ Ἰησοῦ — キリスト・イエスにある命の約束に従って (ἐπαγγελία — 約束, род. источник). У jp-joc «イイススハリストス» дважды — так и в базе, поэтому キリスト・イエス стоит в обоих местах."
  2: "Τιμοθέῳ ἀγαπητῷ τέκνῳ — 愛する子テモテへ (τέκνον — 子, не «сын» по плоти). χάρις, ἔλεος, εἰρήνη — 恵みとあわれみと平和: ἔλεος в приветствии только здесь и в 1 Тим 1:2, поэтому あわれみ не опущено. ἀπὸ θεοῦ πατρὸς καὶ Χριστοῦ Ἰησοῦ τοῦ κυρίου ἡμῶν — 父である神と、わたしたちの主キリスト・イエスから."
  3: "Χάριν ἔχω — 感謝している. ᾧ λατρεύω ἀπὸ προγόνων — 先祖から…仕えてきた. ἐν καθαρᾷ συνειδήσει — 清い良心をもって. ὡς ἀδιάλειπτον ἔχω τὴν περὶ σοῦ μνείαν — 絶えず…覚えている (ὡς передано からである). νυκτὸς καὶ ἡμέρας — 昼も夜も, порядок греческого."
  4: "ἐπιποθῶν σε ἰδεῖν — あなたに会いたいと切に願っている. μεμνημένος σου τῶν δακρύων — あなたの涙を思い起こしながら. ἵνα χαρᾶς πληρωθῶ — 喜びで満たされるため (ἵνα цели; χαρᾶς — род. наполнения)."
  5: "ὑπόμνησιν λαβών — 思い起こしている. ἀνυπόκριτος πίστις — 偽りのない信仰. μάμμη — 祖母, μήτηρ — 母. Λωΐς — ロイス, Εὐνίκη — ユニケ (у jp-joc ロイダ、エウニカ). ἐνῴκησεν — 宿り (обитание, ср. 1:14 ἐνοικοῦντος). πέπεισμαι — 確かに信じている (perfect)."
  6: "δι᾿ ἣν αἰτίαν — そのために. ἀναμιμνῄσκω σε — わたしはあなたに…勧める (букв. «напоминаю тебе»; при инфинитиве цели по-японски естественнее 勧める). ἀναζωπυρεῖν — «раздувать вновь»; 再び燃え立たせる. χάρισμα — 賜物. διὰ τῆς ἐπιθέσεως τῶν χειρῶν μου — わたしが手を置いたことによって (ἐπίθεσις χειρῶν — 按手; 按 вне 常用漢字, поэтому описательно)."
  7: "οὐ γὰρ ἔδωκεν ἡμῖν ὁ θεὸς πνεῦμα δειλίας — 神が…与えてくださったのは、弱気の霊ではなく; πνεῦμα здесь без ἅγιον, поэтому 霊[れい], не 聖霊. δειλία — робость, малодушие (не «страх» вообще). δυνάμεως καὶ ἀγάπης καὶ σωφρονισμοῦ — 力と愛と自制; σωφρονισμός — «здравое рассуждение, самообладание», не сглажено до «мужество»."
  8: "μὴ οὖν ἐπαισχυνθῇς — だから…恥じず. τὸ μαρτύριον τοῦ κυρίου ἡμῶν — 主の証. δέσμιος — 囚人. συγκακοπάθησον τῷ εὐαγγελίῳ — 福音のために苦しみをともに忍ぶ (συν- — «вместе»). κατὰ δύναμιν θεοῦ — 神の力に従って."
  9: "τοῦ σώσαντος ἡμᾶς καὶ καλέσαντος κλήσει ἁγίᾳ — 救い、聖なる召しをもって召してくださった. οὐ κατὰ τὰ ἔργα ἡμῶν — わたしたちの行いによるのではなく. ἰδία πρόθεσις — ご自身の目的. πρὸ χρόνων αἰωνίων — 時の始めより前から (буквально «прежде вечных времён»; по-японски передано без философского оттенка)."
  10: "φανερωθεῖσαν δὲ νῦν — 今…明らかにされた. ἐπιφάνεια — 現れ. καταργήσαντος τὸν θάνατον — 死を滅ぼし. φωτίσαντος ζωὴν καὶ ἀφθαρσίαν — 命と不朽とを照らし出された (ἀφθαρσία — 不[ふ]朽[きゅう])."
  11: "εἰς ὃ ἐτέθην ἐγὼ κῆρυξ καὶ ἀπόστολος καὶ διδάσκαλος — 宣べ伝える者、使徒、そして教師. В базе стих кончается на διδάσκαλος; ἐθνῶν нет (проверено: «εθνων» — НЕТ), поэтому церковное 異邦人の стоит в 〔…〕. κῆρυξ — 宣べ伝える者 (не 伝道者, чтобы не смешать с εὐαγγελιστής в 4:5)."
  12: "δι᾿ ἣν αἰτίαν καὶ ταῦτα πάσχω — そのために…苦しみを受けている. οἶδα γὰρ ᾧ πεπείστευκα — 自分が信じた方を知っており. παραθήκη — «вклад, отданное на хранение»; 委ねたもの — сохранена двусмысленность: вклад Павла у Бога или вклад Бога Павлу. εἰς ἐκείνην τὴν ἡμέραν — かの日まで."
  13: "ὑποτύπωσις — «образец, модель»; 手本 (у jp-joc 模範). ὑγιαινόντων λόγων — 健全な言葉 (ср. 4:3 ὑγιαινούσης διδασκαλίας — 健全な教え). ἐν πίστει καὶ ἀγάπῃ τῇ ἐν Χριστῷ Ἰησοῦ — キリスト・イエスにある信仰と愛とをもって."
  14: "τὴν καλὴν παραθήκην φύλαξον — 善き委託を守りなさい (ср. 1:12). διὰ πνεύματος ἁγίου — {聖霊|聖神}: πνεῦμα ἅγιον, поэтому пара по кальке. τοῦ ἐνοικοῦντος ἐν ἡμῖν — わたしたちのうちに住んでおられる."
  15: "Οἶδας τοῦτο — あなたが知っているとおり. οἱ ἐν τῇ Ἀσίᾳ — アジア州にいる者たち. ἀπεστράφησάν με — わたしから離れて行った. Φύγελος — フィゲロ, Ἑρμογένης — エルモゲネ (у jp-joc フィゲル、エルモゲン)."
  16: "δῴη ἔλεος ὁ κύριος τῷ Ὀνησιφόρου οἴκῳ — どうか、主がオネシポロの家に、あわれみをお与えになりますように (оптатив). ἀνέψυξεν — 元気づけた. ἅλυσις — 鎖. οὐκ ἐπαισχύνθη — 恥じなかった."
  17: "γενόμενος ἐν Ῥώμῃ — ローマに着くと. σπουδαίως ἐζήτησέν με καὶ εὗρεν — 熱心に捜し、見つけ出した."
  18: "δῴη αὐτῷ ὁ κύριος εὑρεῖν ἔλεος παρὰ κυρίου — 主が…主からあわれみを見いだすことをお許しくださいますように (κύριος дважды, оба сохранены). ἐν ἐκείνῃ τῇ ἡμέρᾳ — かの日に. ὅσα ἐν Ἐφέσῳ διηκόνησεν — エフェソでどれほど仕えたか. βέλτιον σὺ γινώσκεις — あなたがよく知っている."
