# jp-box, Откровение, глава 22. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 22: река и дерево жизни (1–5), заключение книги (6–21).
# Красное <j> — только прямая речь Христа: 22:7, 12–16, 18–19, 20a.
# 22:14–15 — продолжение той же речи 12–16 (вводящих слов в тексте нет, атрибуция
# дана по контексту 12–16). Не красные: 22:8–9 (Иоанн и ангел), 22:10–11 (ангел),
# 22:17 (Дух и невеста), 22:20b (ответ Церкви), 22:21. <mo> нет.
# 〔…〕: 22:14 — церковное «исполняющие заповеди» (в базе πλύνοντες τὰς στολάς),
# 22:19 — церковное «книга жизни» (в базе ξύλου τῆς ζωῆς); оба проверены запросом.
# Сносок ⟨…⟩ нет: アレルヤ уже пояснено в 19:1, прочее понятно.

