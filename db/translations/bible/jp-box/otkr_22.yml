verses:
  1: "また、彼[かれ]はわたしに、神[かみ]と小羊[こひつじ]の御座[みくら]から流[なが]れ出[で]る、水晶[すいしょう]のように澄[す]んだ命[いのち]の水[みず]の川[かわ]を示[しめ]した。"
  2: "都[みやこ]の大通[おおどお]りの真[ま]ん中[なか]、川[かわ]のこちら側[がわ]にもあちら側[がわ]にも命[いのち]の木[き]があり、十[じゅう]二[に]種[しゅ]の実[み]を結[むす]んで、毎月[まいつき]、それぞれの実[み]を実[み]らせていた。その木[き]の葉[は]は、諸国[しょこく]を癒[いや]すためのものである。"
  3: "もはや、のろわれるものは何[なに]もない。神[かみ]と小羊[こひつじ]の御座[みくら]が都[みやこ]にあり、その僕[しもべ]たちは神[かみ]に仕[つか]える。"
  4: "彼[かれ]らは神[かみ]の御顔[みかお]を見[み]、その名[な]は彼[かれ]らの額[ひたい]にある。"
  5: "もはや夜[よる]はなく、ともしびの光[ひかり]も太陽[たいよう]の光[ひかり]も要[い]らない。主[しゅ]なる神[かみ]が彼[かれ]らを照[て]らすからである。彼[かれ]らは世々[よよ]限[かぎ]りなく王[おう]として治[し]める。"
  6: "また、わたしに言[い]った。「これらの言葉[ことば]は確[たし]かであり、真実[しんじつ]である。預言者[よげんしゃ]たちの霊[れい]の神[かみ]である主[しゅ]は、すぐに起[お]こるべきことをその僕[しもべ]たちに示[しめ]すために、ご自身[じしん]の天使[てんし]を遣[つか]わされた。」"
  7: "「<j>見[み]よ、わたしはすぐに来[く]る。この書[しょ]の預言[よげん]の言葉[ことば]を守[まも]り続[つづ]ける者[もの]は幸[さいわ]いである。</j>」"
  8: "これらのことを聞[き]き、見[み]たのは、このわたしヨハネである。わたしは聞[き]き、見[み]たとき、これらのことを示[しめ]してくれた天使[てんし]の足[あし]もとにひれ伏[ふ]して礼拝[れいはい]しようとした。"
  9: "しかし、彼[かれ]はわたしに言[い]った。「やめなさい。わたしは、あなたや、あなたの兄弟[きょうだい]である預言者[よげんしゃ]たち、また、この書[しょ]の言葉[ことば]を守[まも]る者[もの]たちと同[おな]じ僕[しもべ]である。神[かみ]を礼拝[れいはい]しなさい。」"
  10: "また、わたしに言[い]った。「この書[しょ]の預言[よげん]の言葉[ことば]を封[ふう]じてはならない。時[とき]が近[ちか]いからである。"
  11: "不正[ふせい]を行[おこな]う者[もの]は、なおも不正[ふせい]を行[おこな]え。汚[けが]れた者[もの]は、なおも汚[けが]れよ。正[ただ]しい者[もの]は、なおも正[ただ]しい行[おこな]いをせよ。聖[せい]なる者[もの]は、なおも聖[せい]となれ。」"
  12: "「<j>見[み]よ、わたしはすぐに来[く]る。報[むく]いはわたしとともにあり、それぞれの行[おこな]いに応[おう]じて報[むく]いよう。</j>"
  13: "<j>わたしはアルファであり、オメガである。最[さい]初[しょ]であり、最後[さいご]であり、初[はじ]めであり、終[お]わりである。</j>"
  14: "<j>〔戒[いまし]めを行[おこな]う者[もの]〕は幸[さいわ]いである。命[いのち]の木[き]に対[たい]する権[けん]を持[も]ち、門[もん]から都[みやこ]に入[はい]るためである。</j>"
  15: "<j>犬[いぬ]ども、魔術[まじゅつ]を行[おこな]う者[もの]、淫[いん]らな者[もの]、人殺[ひとごろ]し、偶像[ぐうぞう]を礼拝[れいはい]する者[もの]、そして偽[いつわ]りを愛[あい]して行[おこな]う者[もの]は、外[そと]にいる。</j>"
  16: "<j>わたし、イエスは、これらのことを諸[しょ]教会[きょうかい]に証[あか]しするために、わたしの天使[てんし]を遣[つか]わした。わたしはダビデの根[ね]、ダビデの子孫[しそん]であり、輝[かがや]く明[あけ]の明星[みょうじょう]である。</j>」"
  17: "霊[れい]と花嫁[はなよめ]は言[い]う。「来[き]てください。」聞[き]く者[もの]も、「来[き]てください」と言[い]いなさい。渇[かわ]いている者[もの]は来[き]なさい。望[のぞ]む者[もの]は、命[いのち]の水[みず]をただで受[う]け取[と]りなさい。"
  18: "「<j>この書[しょ]の預言[よげん]の言葉[ことば]を聞[き]くすべての者[もの]に、わたしは証[あか]しする。もしだれかがこれに付[つ]け加[くわ]えるなら、神[かみ]は、この書[しょ]に書[か]かれている災[わざわ]いをその者[もの]に加[くわ]えられる。</j>"
  19: "<j>また、もしだれかが、この預言[よげん]の書[しょ]の言葉[ことば]から取[と]り除[のぞ]くなら、神[かみ]は、この書[しょ]に書[か]かれている〔命[いのち]の書[しょ]〕から、また聖[せい]なる都[みやこ]から、その者[もの]の受[う]ける分[ぶん]を取[と]り除[のぞ]かれる。</j>」"
  20: "これらのことを証[あか]しする方[かた]は言[い]われる。「『<j>然[しか]り、わたしはすぐに来[こ]る。</j>』」アーメン。主[しゅ]イエスよ、来[こ]てください。"
  21: "主[しゅ]イエスの{恵[めぐ]み|恩寵[おんちょう]}が、すべての人[ひと]とともにありますように。"

notes:
  1: "ποταμὸν ὕδατος ζωῆς λαμπρὸν ὡς κρύσταλλον — 水晶のように澄んだ命の水の川. ἐκπορευόμενον ἐκ τοῦ θρόνου τοῦ θεοῦ καὶ τοῦ ἀρνίου — 神と小羊の御座から流れ出る (один престол у Бога и Агнца, как в 3:21; 22:3)."
  2: "ἐν μέσῳ τῆς πλατείας αὐτῆς καὶ τοῦ ποταμοῦ ἐντεῦθεν καὶ ἐκεῖθεν — 大通りの真ん中、川のこちら側にもあちら側にも. ξύλον ζωῆς — 命の木. καρποὺς δώδεκα, κατὰ μῆνα ἕκαστον ἀποδιδοῦν τὸν καρπὸν αὐτοῦ — 十二種の実を結び、毎月、それぞれの実を実らせていた. εἰς θεραπείαν τῶν ἐθνῶν — 諸国を癒やすためのもの."
  3: "πᾶν κατάθεμα οὐκ ἔσται ἔτι — のろわれるものは何もない (κατάθεμα — «проклятие»). ὁ θρόνος τοῦ θεοῦ καὶ τοῦ ἀρνίου ἐν αὐτῇ ἔσται — 神と小羊の御座が都にあり. λατρεύσουσιν αὐτῷ — 神に仕える (λατρεύω — «служить»)."
  4: "ὄψονται τὸ πρόσωπον αὐτοῦ — 神の御顔を見る. τὸ ὄνομα αὐτοῦ ἐπὶ τῶν μετώπων αὐτῶν — その名は彼らの額にある."
  5: "οὐκ ἔχουσιν χρείαν φωτὸς λύχνου καὶ φῶς ἡλίου — ともしびの光も太陽の光も要らない. κύριος ὁ θεὸς φωτίσει ἐπ' αὐτούς — 主なる神が彼らを照らす. βασιλεύσουσιν εἰς τοὺς αἰῶνας τῶν αἰώνων — 世々限りなく王として治める."
  6: "οἱ λόγοι πιστοὶ καὶ ἀληθινοί — 確かであり、真実である. ὁ κύριος, ὁ θεὸς τῶν πνευμάτων τῶν προφητῶν — 預言者たちの霊の神である主; πνεῦμα без ἅγιον — 霊[れい]. ἀπέστειλεν τὸν ἄγγελον αὐτοῦ δεῖξαι — 天使を遣わして示す. ἃ δεῖ γενέσθαι ἐν τάχει — すぐに起こるべきこと."
  7: "ἰδοὺ ἔρχομαι ταχύ — 見よ、わたしはすぐに来る; слова Христа, поэтому красное. μακάριος ὁ τηρῶν τοὺς λόγους τῆς προφητείας — この書の預言の言葉を守る者は幸い."
  8: "Κἀγὼ Ἰωάννης — このわたしヨハネ. ὁ ἀκούων καὶ βλέπων ταῦτα — これらのことを聞き、見た者. ἔπεσα προσκυνῆσαι — ひれ伏して礼拝しようとした."
  9: "Ὅρα μή — やめなさい. σύνδουλός σού εἰμι — あなたと同じ僕. τῶν ἀδελφῶν σου τῶν προφητῶν — あなたの兄弟である預言者たち. τῷ θεῷ προσκύνησον — 神を礼拝しなさい."
  10: "Μὴ σφραγίσῃς — 封じてはならない. ὁ καιρὸς γὰρ ἐγγύς ἐστιν — 時が近いからである."
  11: "ὁ ἀδικῶν ἀδικησάτω ἔτι — 不正を行う者は、なおも不正を行え: четыре члена с ἔτι сохранены, повелительное наклонение передано императивом (せよ/なれ). ῥυπαρός — 汚れた者. ἁγιασθήτω — 聖となれ."
  12: "ἰδοὺ ἔρχομαι ταχύ — 見よ、わたしはすぐに来る (слова Христа). ὁ μισθός μου μετ' ἐμοῦ — 報いはわたしとともにあり. ἀποδοῦναι ἑκάστῳ ὡς τὸ ἔργον ἐστὶν αὐτοῦ — それぞれの行いに応じて報いよう."
  13: "τὸ Ἄλφα καὶ τὸ Ὦ, ὁ πρῶτος καὶ ὁ ἔσχατος, ἡ ἀρχὴ καὶ τὸ τέλος — アルファであり、オメガである。最初であり、最後であり、始めであり、終わりである (три пары сохранены)."
  14: "В базе οἱ πλύνοντες τὰς στολὰς αὐτῶν (омовение одежд); церковный текст (Елизаветинская «творящии заповеди Его», Синодальный «соблюдают заповеди Его», jp-joc 誡めを守る者) читает «исполняющие заповеди» — проверено: εντολ в 22:14 НЕТ, поэтому 〔戒めを行う者〕. ἵνα ἔσται ἡ ἐξουσία αὐτῶν ἐπὶ τὸ ξύλον τῆς ζωῆς — 命の木に対する権を持つため. τοῖς πυλῶσιν εἰσέλθωσιν — 門から都に入る. Атрибуция красного 14–15 — по контексту 12–16."
  15: "κύνες — 犬ども. φάρμακοι — 魔術を行う者. πόρνοι — 淫らな者. φονεῖς — 人殺し. εἰδωλολάτραι — 偶像を礼拝する者. φιλῶν καὶ ποιῶν ψεῦδος — 偽りを愛して行う者. ἔξω — 外にいる."
  16: "Ἐγὼ Ἰησοῦς ἔπεμψα τὸν ἄγγελόν μου — わたし、イエスは…天使を遣わした. μαρτυρῆσαι ὑμῖν ταῦτα ἐπὶ ταῖς ἐκκλησίαις — 諸教会に証しするため. ἡ ῥίζα καὶ τὸ γένος Δαυίδ — ダビデの根、その子孫 (γένος — «род, потомство»). ὁ ἀστὴρ ὁ λαμπρὸς ὁ πρωϊνός — 輝く明の明星."
  17: "τὸ πνεῦμα καὶ ἡ νύμφη λέγουσιν, Ἔρχου — 霊と花嫁は言う。「来てください」; πνεῦμα без ἅγιον — 霊[れい]. ὁ ἀκούων εἰπάτω, Ἔρχου — 聞く者も「来てください」と言いなさい. ὁ διψῶν ἐρχέσθω — 渇いている者は来なさい. ὁ θέλων λαβέτω ὕδωρ ζωῆς δωρεάν — 望む者は、命の水をただで受け取りなさい (θέλων — «желающий»; ср. 21:6)."
  18: "Μαρτυρῶ ἐγὼ παντὶ τῷ ἀκούοντι — 聞くすべての者に、わたしは証しする. ἐάν τις ἐπιθῇ ἐπ' αὐτά — もしだれかがこれに付け加えるなら. ἐπιθήσει ἐπ' αὐτὸν ὁ θεὸς τὰς πληγὰς τὰς γεγραμμένας — 神は…書かれている災いをその者に加えられる (ἐπιτίθημι дважды: 付け加える / 加える)."
  19: "ἀφέλῃ ἀπὸ τῶν λόγων…ἀφελεῖ τὸ μέρος αὐτοῦ — 取り除く…分を取り除かれる (ἀφαιρέω дважды). В базе ἀπὸ τοῦ ξύλου τῆς ζωῆς (дерево жизни); церковный текст (Елизаветинская, Синодальный «книги жизни», jp-joc 生命の書) читает βιβλίου τῆς ζωῆς — проверено: βιβλίου в стихе есть только в начале (λόγων τοῦ βιβλίου), а «книги жизни» нет, поэтому 〔命の書〕. τῶν γεγραμμένων ἐν τῷ βιβλίῳ τούτῳ — この書に書かれている."
  20: "Λέγει ὁ μαρτυρῶν ταῦτα — これらのことを証しする方は言われる: это Христос, поэтому вложенная цитата в 『』 и красная — Ναί, ἔρχομαι ταχύ — 然り、わたしはすぐに来る. Ἀμήν, ἔρχου, κύριε Ἰησοῦ — アーメン。主イエスよ、来てください: ответ Церкви и Иоанна, не красное. ἀμήν в базе есть — アーメン оставлен."
  21: "ἡ χάρις τοῦ κυρίου Ἰησοῦ μετὰ πάντων — 主イエスの恵みが、すべての人とともに (в базе πάντων, без ὑμῶν; церковное «со всеми вами» не добавлено)."
