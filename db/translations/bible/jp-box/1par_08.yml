# jp-box, 1-я Паралипоменон, глава 8. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет,
# jp-ni (943 стиха, под авторским правом) источником не был.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 8: сыновья Вениамина (1–5); сыновья Белы, Егуд и переселение в Манахаф,
# роды Моава и Аиалона (6–13); прочие вениамитяне, главы родов (14–28);
# родословие Саула от Гаваона до Ацела (29–40).
# Речи нет; красного нет: <j>/<mo> не ставятся.
# 〔…〕 нет: в gr-lxx-byz на месте каждого стиха есть текст.
# Сносок ⟨…⟩ нет: новых терминов в главе нет, 氏族 и 部族 уже в корпусе.
# Имена — транслитерация греческого (LXX) в катакане, как в Быт 46 и 1 Цар;
# расхождения с csl/ru/евр. — в notes.
# jp-ni не использовался.

tr_code: jp-box
book: 1par
chapter: 8
draft: true

verses:
  1: "ベニヤミンは長男[ちょうなん]のバレ、次男[じなん]のアスベル、三男[さんなん]のアアラを生[う]んだ。"
  2: "四男[よんなん]はノア、五男[ごなん]はラフェである。"
  3: "バレの子[こ]らはアデル、ゲラ、アビウド、"
  4: "アビスエ、ノオマ、アキア、"
  5: "ゲラ、ソファルファク、オイムである。"
  6: "これらはアオドの子[こ]らである。彼[かれ]らはギベアに住[す]む氏族[しぞく]の長[かしら]たちであり、人[ひと]々[びと]をマナハトへ移[うつ]した。"
  7: "またノオマ、アキア、ゲラ。この者[もの]はイグラムである。彼[かれ]はナアナとアキコドを生[う]んだ。"
  8: "サアレムはモアブの野[の]で子[こ]らを生[う]んだ。彼[かれ]が妻[つま]のオシムとバアダを去[さ]らせた後[あと]のことである。"
  9: "彼[かれ]はまた、妻[つま]アダからイオバブ、セビア、ミサ、メルカムを生[う]んだ。"
  10: "またイアオス、サビア、マルマ。これらは氏族[しぞく]の長[かしら]たちである。"
  11: "オシムからはアビトブとアルファアルを生[う]んだ。"
  12: "アルファアルの子[こ]らはオベド、メッサアム、センメルである。この者[もの]がオノとロド、およびその村[むら]々[むら]を建[た]てた。"
  13: "またベリガとサマ。彼[かれ]らはアイラムに住[す]む氏族[しぞく]の長[かしら]たちであり、ガテに住[す]む者[もの]たちを追[お]い出[だ]した。"
  14: "その兄弟[きょうだい]はソシク、イアリモト、"
  15: "ゼバディア、オレル、オデド、"
  16: "ミカエル、イエスファ、イオカである。これらはベリガの子[こ]らである。"
  17: "ゼバディア、モソラム、アザキ、アバル、"
  18: "イサマリ、イエズリア、イオバブである。これらはアルファアルの子[こ]らである。"
  19: "イアキム、ゼクリ、ザブディ、"
  20: "エリオエナイ、サルティ、エリエリ、"
  21: "アダイア、バライア、サマラトである。これらはサマイの子[こ]らである。"
  22: "イスファン、オベド、エレエル、"
  23: "アバドン、ゼクリ、アナン、"
  24: "アナニア、アムブリ、アイラム、アナトティア、"
  25: "アティン、イエフェリア、フェリエルである。これらはソシクの子[こ]らである。"
  26: "サムサリア、サアリア、オゴトリア、"
  27: "イアラシア、エリア、ゼクリである。これらはイラアムの子[こ]らである。"
  28: "これらは氏族[しぞく]の長[かしら]たちであり、その世代[せだい]に従[したが]って長[かしら]となった者[もの]たちである。彼[かれ]らはエルサレムに住[す]んだ。"
  29: "ガバオンには、ガバオンの父[ちち]と呼[よ]ばれる者[もの]が住[す]んだ。妻[つま]の名[な]はマアカであった。"
  30: "彼女[かのじょ]の長男[ちょうなん]はアバドン、そしてスル、キス、バアル、ネル、ナダブ、"
  31: "またゲドルとその兄弟[きょうだい]、ザクル、マカロト。"
  32: "マカロトはセマアを生[う]んだ。彼[かれ]らもまた、兄弟[きょうだい]たちとともに、兄弟[きょうだい]たちの向[む]かいにあたるエルサレムに住[す]んだ。"
  33: "ネルはキスを生[う]み、キスはサウルを生[う]み、サウルはヨナタン、メルキシュア、アミナダブ、アサバアルを生[う]んだ。"
  34: "ヨナタンの子[こ]はメリバアルである。メリバアルはミキアを生[う]んだ。"
  35: "ミキアの子[こ]らはピトン、メルケル、テレエ、アカズである。"
  36: "アカズはイオイアダを生[う]み、イオイアダはガレマト、アスモト、ザムブリを生[う]み、ザムブリはマイサを生[う]んだ。"
  37: "マイサはバアナを生[う]んだ。その子[こ]はラファイア、その子[こ]はエラサ、その子[こ]はエセルである。"
  38: "エセルには六人[ろくにん]の子[こ]があった。その名[な]は次[つぎ]のとおりである。長男[ちょうなん]エズリカム、イスマエル、サライア、アブディア、アナン。これらはみなエセルの子[こ]である。"
  39: "その兄弟[きょうだい]アセルの子[こ]らは、長男[ちょうなん]アイラム、次男[じなん]イアイス、三男[さんなん]エリファレトである。"
  40: "アイラムの子[こ]らは、力[ちから]ある勇[いさ]ましい男[おとこ]たちで、弓[ゆみ]を引[ひ]き、子[こ]と孫[まご]を多[おお]く増[ふ]やした。百五十人[ひゃくごじゅうにん]である。これらはみなベニヤミンの子[こ]らから出[で]た者[もの]たちである。"

notes:
  1: "Βενιαμιν — ベニヤミン (Быт 46:21; 1 Цар 9:1). Βαλε — バレ; LXX передаёт евр. בֶּלַע, слав. «Валу», Синод. «Бела». Ασβηλ — アスベル (так же Быт 46:21). Ααρα — アアラ (слав. «Диера» — порча, Синод. «Ахрай»). Родословие открывается пятью сыновьями, ст. 2 — его продолжение."
  2: "Νωα — ノア (слав. «Науил», Синод. «Ноха»). Ραφη — ラフェ (слав. «Рафу», Синод. «Рафа»). τὸν τέταρτον … τὸν πέμπτον — «четвёртого … пятого», счёт продолжается от ст. 1."
  3: "ἦσαν υἱοὶ τῷ Βαλε — «были сыновья у Бале» (дат. принадлежности). Αδερ — アデル (слав. «Адир», Синод. «Аддар»). Γηρα — ゲラ. Αβιουδ — アビウド. Перечень идёт через границы стихов, как в гр."
  4: "Αβισουε — アビスエ (слав. «Ависуй», Синод. «Авишуа»). Νοομα — ノオマ (слав. «Ноаман», Синод. «Нааман»). Αχια — アキア."
  5: "Σωφαρφακ — ソファルファク (слав. «Сефуфам», Синод. «Шефуфан»). Ωιμ — オイム (слав. «Урам», Синод. «Хурам»). Второй раз Γηρα — не описка: имя повторяется в списке."
  6: "οὗτοι υἱοὶ Αωδ — «эти — сыновья Аода» (евр. אֵחוּד, Синод. «Егуд»). ἄρχοντες πατριῶν — главы отечеств, т.е. родов. Γαβεε — ギベア (евр. גֶּבַע, Гева). μετῴκισαν αὐτοὺς εἰς Μαναχαθι — «переселили их в Манахаф» (μετοικίζω); слав. «ихже преселиша», Синод. «переселенных»."
  7: "οὗτος ιγλααμ — «этот — Иглам»; место в гр. испорчено: в евр. стоит «он переселил их» (הוּא הֶגְלָם), отсюда слав. «тойже иглаам» и Синод. «который переселил их». Держимся гр. Ναανα — ナアナ (слав. «азан»), Αχιχωδ — アキコド (слав. «нуа», Синод. «Ахихуд»)."
  8: "Σααρημ — サアレム (евр. Шегараим; слав. «Сеорим»). ἐν τῷ πεδίῳ Μωαβ — «на поле Моава», т.е. в земле Моавитской. μετὰ τὸ ἀποστεῖλαι αὐτὸν — «после того как он отослал» (ἀποστέλλω с артиклем инфинитива). В гр. два имени жён — Ωσιμ и Βααδα (слав. «осиму и вааду», Синод. «Хушиму и Баару»)."
  9: "ἐκ τῆς Αδα — «от Ады» (слав. «от валы» — порча, Синод. «от Ходеши»). Ιωβαβ — イオバブ, Σεβια — セビア (слав. «самию»), Μισα — ミサ, Μελχαμ — メルカム."
  10: "Ιαως — イアオス (слав. «иоаса», Синод. «Иеуц»). Σαβια — サビア (слав. «сехию», Синод. «Шахия»). Μαρμα — マルマ (Синод. «Мирма»). οὗτοι ἄρχοντες πατριῶν — итоговая формула рода."
  11: "Ωσιμ — та же жена, что в ст. 8 (Хушима). Αβιτωβ — アビトブ (слав. «амитова»), Αλφααλ — アルファアル (слав. «елифаада», Синод. «Елпаал»)."
  12: "υἱοὶ Αλφααλ — сыновья Елпаала. Ωβηδ — オベド (слав. «евер», Синод. «Евер»), Μεσσααμ — メッサアム, Σεμμηρ — センメル (Синод. «Шемер»). ᾠκοδόμησεν — построил (οἰκοδομέω); слав. добавляет «еод и веси его» — порча, в гр. этого нет. Ωνω — オノ, Λοδ — ロド (Синод. «Лод»)."
  13: "Βεριγα — ベリガ (евр. Берия; слав. «вериа»). Σαμα — サマ (Синод. «Шема»). Αιλαμ — アイラム (слав. «елам»; Синод. «Аиалон» по евр., ср. Нав 19:42). ἐξεδίωξαν — изгнали (ἐκδιώκω). Γεθ — ガテ."
  14: "ἀδελφὸς αὐτοῦ — «брат его» без имени; слав. «братия их», Синод. вставляет имя «Ахио». Σωσηκ — ソシク (слав. «сосил», Синод. «Шашак»), Ιαριμωθ — イアリモト (Синод. «Иремоф»)."
  15: "Ζαβαδια — ゼバディア, Ωρηρ — オレル (слав. «орид», Синод. «Арад»), Ωδηδ — オデド (слав. «авад», Синод. «Едер»)."
  16: "Μιχαηλ — ミカエル, Ιεσφα — イエスファ, Ιωχα — イオカ. υἱοὶ Βαριγα — сыновья Берии (ст. 13); слав. «сынове вериины»."
  17: "Μοσολλαμ — モソラム (слав. «мосоллам», Синод. «Мешуллам»), Αζακι — アザキ (Синод. «Хизкий»), Αβαρ — アバル (слав. «авер», Синод. «Хевер»)."
  18: "Ισαμαρι — イサマリ (Синод. «Ишмерай»), Ιεζλια — イエズリア (Синод. «Излия»). υἱοὶ Ελφααλ — сыновья Елпаала (ст. 12); в гр. имя стоит в конце, как в ст. 16."
  19: "Ιακιμ — イアキム, Ζεχρι — ゼクリ, Ζαβδι — ザブディ (слав. «завдий»)."
  20: "Ελιωηναι — エリオエナイ (Синод. «Елиенай»), Σαλθι — サルティ (слав. «салафий», Синод. «Цилфай»), Ελιηλι — エリエリ (слав. «елиил»)."
  21: "Αδαια — アダイア, Βαραια — バライア, Σαμαραθ — サマラト (Синод. «Шимраф»). υἱοὶ Σαμαι — сыновья Шимея."
  22: "Ισφαν — イスファン (Синод. «Ишпан»), Ωβηδ — オベド, Ελεηλ — エレエル. Слав. в скобках прибавляет «и адриа» — в гр. нет."
  23: "Αβαδων — アバドン, Αναν — アナン (Синод. «Ханан»)."
  24: "Ανανια — アナニア, Αμβρι — アムブリ (евр. Имри), Αιλαμ — アイラム (Синод. «Елам»), Αναθωθια — アナトティア (Синод. «Антофия»). В слав. и Синод. имени Амври нет — список короче на одно имя (два имени слились)."
  25: "Αθιν — アティン (слав. «иефадиа», Синод. «Ифдия»), Ιεφερια — イエフェリア (Синод. «Фенуил»), Φελιηλ — フェリエル. υἱοὶ Σωσηκ — сыновья Шашака (ст. 14)."
  26: "Σαμσαρια — サムサリア (Синод. «Шамшерай»), Σααρια — サアリア (Синод. «Шехария»), Ογοθολια — オゴトリア (слав. «ефниа», Синод. «Афалия»)."
  27: "Ιαρασια — イアラシア (Синод. «Иаарешия»), Ηλια — エリア, Ζεχρι — ゼクリ. υἱοὶ Ιρααμ — сыновья Иерохама (в гр. форма Ιρααμ, как в ст. 8 и 9:8)."
  28: "κατὰ γενέσεις αὐτῶν — «по рождениям их», т.е. по родам. Формула повторяется в 9:34 и замыкает раздел; с неё же начинается 9:35 — параллельный список гаваонитян."
  29: "πατὴρ Γαβαων — «отец Гаваона», т.е. родоначальник гаваонитян; имя в этом стихе не названо (в 9:35 — Ιιηλ, イエイル). Μααχα — マアカ. Гр. опускает имя, слав. «иеиль отец гаваона» вносит его из параллели."
  30: "υἱὸς αὐτῆς — «сын её», т.е. жены из ст. 29 (слав. «сын же его»). Σουρ — スル (Синод. «Цур»), Κις — キス, Βααλ — バアル, Νηρ — ネル, Ναδαβ — ナダブ; ср. 1 Цар 9:1; 14:50–51, где те же имена."
  31: "Γεδουρ — ゲドル (Синод. «Гедор»), ἀδελφὸς αὐτοῦ — «брат его» без имени (слав. «аиуй», Синод. «Ахио»), Ζαχουρ — ザクル (Синод. «Зехер»), Μακαλωθ — マカロト (Синод. «Миклоф»)."
  32: "Μακαλωθ ἐγέννησεν τὸν Σεμαα — セマア (слав. «самаа», Синод. «Шимей»). κατέναντι τῶν ἀδελφῶν αὐτῶν — «напротив братьев своих», т.е. рядом с ними; слав. «прямо братии своей»."
  33: "Νηρ — ネル, Κις — キス, Σαουλ — サウル (1 Цар 9:1–2). Μελχισουε — メルキシュア, как в 1 Цар 14:49; в 1 Цар 31:2 LXX читает Μελχισα (メルキサ). Αμιναδαβ — アミナダブ; по евр. Авинадав. Ασαβαλ — アサバアル (евр. Эшбаал); в 9:39 LXX читает Ισβααλ, в 2 Цар 2:8 — イシュボシェト."
  34: "Μεριβααλ — メリバアル; в евр. Мефибошет, в 2 Цар 4:4 LXX Μεμφιβοσθε. Имя дано в двух LXX-формах, держимся чтения этой главы. Μιχια — ミキア (в 9:40 Μιχα)."
  35: "Φιθων — ピトン (Синод. «Пифон»), Μελχηλ — メルケル (Синод. «Мелег»), Θερεε — テレエ (Синод. «Фаарея»), Αχαζ — アカズ."
  36: "Ιωιαδα — イオイアダ (слав. «иаду»), Γαλεμαθ — ガレマト (слав. «салемефа»), Ασμωθ — アスモト (Синод. «Азмавеф»), Ζαμβρι — ザムブリ, Μαισα — マイサ (слав. «меса», Синод. «Моца»)."
  37: "Βαανα — バアナ (Синод. «Бинея»). Трижды υἱὸς αὐτοῦ — «сын его»: цепочка Ραφαια — ラファイア, Ελασα — エラサ, Εσηλ — エセル."
  38: "ἓξ υἱοί — шесть сыновей, но в гр. перечислено пять имён (Εζρικαμ, Ισμαηλ, Σαραια, Αβδια, Αναν); в слав. шесть (добавлено «азариа»), в Синод. шесть (добавлен «Бохру») — по евр. Держимся гр. Εζρικαμ — エズリカム, Σαραια — サライア, Αβδια — アブディア."
  39: "Ασηλ — アセル, брат Есела (ст. 37–38). Αιλαμ — アイラム (слав. «улам»), Ιαις — イアイス (слав. «иесус», Синод. «Иеуш»), Ελιφαλετ — エリファレト (Синод. «Елифелет»)."
  40: "τείνοντες τόξον — «натягивающие лук» (τείνω). πληθύνοντες υἱοὺς καὶ υἱοὺς τῶν υἱῶν — «умножающие сыновей и сыновей сыновей», т.е. многодетные. ἑκατὸν πεντήκοντα — 150, итог рода Улама. ἐξ υἱῶν Βενιαμιν — «из сынов Вениамина», замыкающая формула главы."
