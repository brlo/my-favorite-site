verses:
  1: "主[しゅ]はモーセに語[かた]って言[い]われた。"
  2: "「イスラエルの子[こ]らに語[かた]って言[い]いなさい。わたしがあなたがたに与[あた]える、あなたがたの住[す]む地[ち]に入[はい]るとき、"
  3: "あなたがたは主[しゅ]に燔祭[はんさい]を、すなわち焼[や]き尽[つ]くす捧[ささ]げ物[もの]か犠牲[ぎせい]を献[ささ]げ、誓願[せいがん]を果[は]たすため、あるいは自[じ]ら進[すす]んで、あるいはあなたがたの祭[まつ]りに、主[しゅ]に芳[かんば]しい香[かおり]となるものを献[ささ]げるなら、それが牛[うし]の群[む]れからであれ、羊[ひつじ]の群[む]れからであれ、"
  4: "主[しゅ]に供[そな]え物[もの]を献[ささ]げる者[もの]は、小麦粉[こむぎこ]の犠牲[ぎせい]として、エファの十分[じゅうぶん]の一[いち]をヒンの四分[しぶん]の一[いち]の油[あぶら]でこねたものを献[ささ]げなさい。"
  5: "また、注[そそ]ぎ物[もの]としてぶどう酒[ぶどうしゅ]を、燔祭[はんさい]にも犠牲[ぎせい]にも、ヒンの四分[しぶん]の一[いち]を献[ささ]げなさい。小羊[こひつじ]一[いっ]匹[ぴき]につき、これだけを、主[しゅ]に芳[かんば]しい香[かおり]となる捧[ささ]げ物[もの]として献[ささ]げなさい。"
  6: "雄羊[おひつじ]を燔祭[はんさい]または犠牲[ぎせい]として献[ささ]げるときは、小麦粉[こむぎこ]の犠牲[ぎせい]として、エファの十分[じゅうぶん]の二[に]をヒンの三分[さんぶん]の一[いち]の油[あぶら]でこねたものを献[ささ]げなさい。"
  7: "また、注[そそ]ぎ物[もの]としてぶどう酒[ぶどうしゅ]を、ヒンの三分[さんぶん]の一[いち]を、主[しゅ]に芳[かんば]しい香[かおり]となるものとして献[ささ]げなさい。"
  8: "牛[うし]の群[む]れから燔祭[はんさい]または犠牲[ぎせい]を献[ささ]げ、誓願[せいがん]を果[は]たすため、あるいは主[しゅ]への酬恩祭[しゅうおんさい]として献[ささ]げるなら、"
  9: "その子牛[こうし]に添[そ]えて、小麦粉[こむぎこ]の犠牲[ぎせい]として、エファの十分[じゅうぶん]の三[さん]をヒンの二分[にぶん]の一[いち]の油[あぶら]でこねたものを献[ささ]げなさい。"
  10: "また、注[そそ]ぎ物[もの]としてぶどう酒[ぶどうしゅ]を、ヒンの二分[にぶん]の一[いち]を、主[しゅ]に芳[かんば]しい香[かおり]となる捧[ささ]げ物[もの]として献[ささ]げなさい。"
  11: "子牛[こうし]一[いっ]頭[とう]にも、雄羊[おひつじ]一[いっ]頭[とう]にも、羊[ひつじ]の群[む]れか山羊[やぎ]の群[む]れからの小羊[こひつじ]一[いっ]頭[とう]にも、このとおりに行[おこな]いなさい。"
  12: "あなたがたが献[ささ]げる数[かず]に応[おう]じて、一[いっ]頭[とう]ごとにその数[かず]に従[したが]って行[おこな]いなさい。"
  13: "この地[ち]に生[う]まれた者[もの]はみな、主[しゅ]に芳[かんば]しい香[かおり]となる捧[ささ]げ物[もの]を献[ささ]げるとき、このとおりに行[おこな]いなさい。"
  14: "もし、あなたがたの間に寄留者[きりゅうしゃ]が、あなたがたの地[ち]に、あるいはあなたがたの世代[せだい]の間[あいだ]に加[くわ]わったなら、その者[もの]が主[しゅ]に芳[かんば]しい香[かおり]となる捧[ささ]げ物[もの]を献[ささ]げるときは、あなたがたが行[おこな]うとおりに、会衆[かいしゅう]も主[しゅ]にそのとおりに行[おこな]いなさい。"
  15: "あなたがたにも、あなたがたの間に加[くわ]わった寄留者[きりゅうしゃ]にも、一[ひと]つの掟[おきて]がある。あなたがたの世代[せだい]にわたる永遠[えいえん]の掟[おきて]である。あなたがたも寄留者[きりゅうしゃ]も、主[しゅ]の前[まえ]では同[おな]じでなければならない。"
  16: "あなたがたにも、あなたがたの間に加[くわ]わった寄留者[きりゅうしゃ]にも、掟[おきて]は一[ひと]つ、定[さだ]めは一[ひと]つでなければならない。」"
  17: "主[しゅ]はモーセに語[かた]って言[い]われた。"
  18: "「イスラエルの子[こ]らに語[かた]って言[い]いなさい。わたしがあなたがたを導[みちび]き入[い]れる地[ち]に入[はい]るとき、"
  19: "あなたがたがその地[ち]のパンを食[た]べるとき、主[しゅ]への捧[ささ]げ物[もの]として、取[と]り分[わ]けたものを取[と]り分[わ]けなさい。"
  20: "あなたがたのこねた粉[こな]の初穂[はつほ]を、パンとして捧[ささ]げ物[もの]に取[と]り分[わ]けなさい。打[う]ち場[ば]からの捧[ささ]げ物[もの]のように、それを取[と]り分[わ]けなさい。"
  21: "あなたがたのこねた粉[こな]の初穂[はつほ]を、あなたがたの世代[せだい]にわたって主[しゅ]に捧[ささ]げ物[もの]として与[あた]えなさい。"
  22: "もしあなたがたが罪[つみ]を犯[おか]し、主[しゅ]がモーセに語[かた]られたこれらすべての戒[いまし]めを行[おこな]わないなら、"
  23: "すなわち、主[しゅ]があなたがたに命[めい]じられたとおりに、主[しゅ]があなたがたに命[めい]じられた日[ひ]から後[のち]、あなたがたの世代[せだい]に至[いた]るまで、"
  24: "それが会衆[かいしゅう]の目[め]から隠[かく]れて、知[し]らずに起[おこ]ったことなら、会衆[かいしゅう]は全体[ぜんたい]で、牛[うし]の群[む]れから傷[きず]のない子牛[こうし]一[いっ]頭[とう]を、主[しゅ]に芳[かんば]しい香[かおり]となる燔祭[はんさい]として、またその小麦粉[こむぎこ]の犠牲[ぎせい]と注[そそ]ぎ物[もの]を定[さだ]めに従[したが]って、さらに山羊[やぎ]の群[む]れから雄山羊[おやぎ]一[いっ]匹[ぴき]を罪[つみ]のために献[ささ]げなさい。"
  25: "祭司[さいし]はイスラエルの子[こ]らの会衆[かいしゅう]全体[ぜんたい]のために贖[あがな]いをし、彼[かれ]らは赦[ゆる]される。それが知[し]らずに犯[おか]したことだからである。彼[かれ]らは、自分[じぶん]たちの罪[つみ]のために、自分[じぶん]たちの知[し]らずに犯[おか]したことのために、主[しゅ]の前[まえ]で、自分[じぶん]たちの供[そな]え物[もの]、すなわち主[しゅ]への捧[ささ]げ物[もの]を携[たずさ]えて来[き]たのである。"
  26: "イスラエルの子[こ]らの会衆[かいしゅう]全体[ぜんたい]も、あなたがたに加[くわ]わった寄留者[きりゅうしゃ]も赦[ゆる]される。民[たみ]はみな、知[し]らずに犯[おか]したのだからである。"
  27: "もし一[ひと]人[り]の人[ひと]が知[し]らずに罪[つみ]を犯[おか]したなら、一[いっ]歳[さい]の山羊[やぎ]一[いっ]匹[ぴき]を罪[つみ]のために献[ささ]げなさい。"
  28: "祭司[さいし]は、知[し]らずに罪[つみ]を犯[おか]したその人[ひと]のために、主[しゅ]の前[まえ]で贖[あがな]いをする。その人[ひと]のために贖[あがな]うのである。"
  29: "イスラエルの子[こ]らのうちのその地[ち]の者[もの]にも、彼[かれ]らに加[くわ]わった寄留者[きりゅうしゃ]にも、知[し]らずに罪[つみ]を犯[おか]す者[もの]には、掟[おきて]は一[ひと]つである。"
  30: "しかし、その地[ち]の者[もの]であれ寄留者[きりゅうしゃ]であれ、高[たか]ぶった手[て]で、すなわち故意[こい]に罪[つみ]を犯[おか]す者[もの]は、神[かみ]を怒[いか]らせる。その者[もの]は自分[じぶん]の民[たみ]の間[あいだ]から絶[た]たれ、"
  31: "その者[もの]は主[しゅ]の言葉[ことば]を侮[あなど]り、その戒[いまし]めを破[やぶ]ったからである。その者[もの]は必[かなら]ず絶[た]たれる。その罪[つみ]はその者[もの]にとどまる。」"
  32: "イスラエルの子[こ]らが荒野[こうや]にいたとき、安息日[あんそくび]に薪[たきぎ]を集[あつ]めている人[ひと]を見[み]つけた。"
  33: "見[み]つけた者[もの]たちは、安息日[あんそくび]に薪[たきぎ]を集[あつ]めているその人[ひと]を、モーセとアロン、およびイスラエルの子[こ]らの会衆[かいしゅう]全体[ぜんたい]のところへ連[つ]れて来[き]た。"
  34: "彼[かれ]らはその人[ひと]を監禁[かんきん]した。どう扱[あつか]うべきかがまだ定[さだ]まっていなかったからである。"
  35: "主[しゅ]はモーセに言[い]われた。「その人[ひと]は必[かなら]ず死[し]ななければならない。会衆[かいしゅう]は全体[ぜんたい]で彼[かれ]を石[いし]で打[う]ち殺[ころ]しなさい。」"
  36: "会衆[かいしゅう]は全体[ぜんたい]で彼[かれ]を宿営[しゅくえい]の外[そと]に連[つ]れ出[だ]し、宿営[しゅくえい]の外[そと]で石[いし]で打[う]った。主[しゅ]がモーセに命[めい]じられたとおりである。"
  37: "主[しゅ]はモーセに語[かた]って言[い]われた。"
  38: "「イスラエルの子[こ]らに語[かた]って言[い]いなさい。彼[かれ]らは自分[じぶん]たちの衣[ころも]の端[はし]に房[ふさ]を作[つく]り、あなたがたはその房[ふさ]に青[あお]い糸[いと]を付[つ]けなさい。あなたがたの世代[せだい]にわたってそうしなさい。"
  39: "その房[ふさ]はあなたがたのためにあり、あなたがたはそれを見[み]て、主[しゅ]のすべての戒[いまし]めを思[おも]い起[おこ]し、それを行[おこな]う。あなたがたは、淫[いん]行[こう]してその後[あと]に従[したが]っているあなたがたの思[おも]いと目[め]に従[したが]って、道[みち]を曲[ま]げてはならない。"
  40: "こうしてあなたがたは、わたしのすべての戒[いまし]めを思[おも]い起[おこ]し、それを行[おこな]い、あなたがたの神[かみ]に聖[せい]なる者[もの]となる。"
  41: "わたしは、あなたがたをエジプトの地[ち]から導[みちび]き出[だ]して、あなたがたの神[かみ]となる主[しゅ]である。わたしは主[しゅ]、あなたがたの神[かみ]である。」"

notes:
  1: "εἶπεν κύριος πρὸς Μωυσῆν λέγων — 主はモーセに語って言われた."
  2: "Ὅταν εἰσέλθητε — когда войдёте (ὅταν с аористом конъюнктива). γῆ τῆς κατοικήσεως ὑμῶν — земля вашего жительства (κατοίκησις)."
  3: "μεγαλῦναι εὐχήν — «возвеличить обет», т. е. исполнить обещанное (εὐχή — 誓願; слав. «возвеличити мольбу»). καθ᾽ ἑκούσιον — по усердию, добровольно. ἐν ταῖς ἑορταῖς — в праздники. ὀσμὴ εὐωδίας — благоухание (жертвенная формула)."
  4: "θυσία σεμιδάλεως — хлебная жертва (σεμίδαλις — пшеничная мука тонкого помола). δέκατον τοῦ οιφι — десятая часть ефы (エファ). ἀναπεποιημένης ἐν ἐλαίῳ — смешанной с елеем (ἀναποιέω). τετάρτῳ τοῦ ιν — четверть гина (ヒン; пояснено в Исх 29:40)."
  5: "σπονδή — возлияние (注ぎ物). τὸ τέταρτον τοῦ ιν — четверть гина. τῷ ἀμνῷ τῷ ἑνὶ ποιήσεις τοσοῦτο — одному агнцу сделай столько. κάρπωμα — сожигаемое, 捧げ物."
  6: "τῷ κριῷ — при овне (κριός — 雄羊). δύο δέκατα — две десятых. τὸ τρίτον τοῦ ιν — треть гина."
  7: "τὸ τρίτον τοῦ ιν — треть гина. εἰς ὀσμὴν εὐωδίας — в благоухание."
  8: "ἐὰν δὲ ἀπὸ τῶν βοῶν — если из крупного скота. εἰς σωτήριον — в жертву спасения, 酬恩祭 (σωτήριον; слав. «спасителное»). μεγαλῦναι εὐχήν — исполнить обет (ср. ст. 3)."
  9: "ἐπὶ τοῦ μόσχου — при тельце. τρία δέκατα — три десятых. ἥμισυ τοῦ ιν — половина гина."
  10: "τὸ ἥμισυ τοῦ ιν — половина гина. κάρπωμα ὀσμὴν εὐωδίας — сожигаемое в благоухание."
  11: "οὕτως ποιήσεις — так делай. τῷ μόσχῳ … ἢ τῷ κριῷ … ἢ τῷ ἀμνῷ — при тельце, овне, агнце (перечисление с ἤ). ἐκ τῶν προβάτων ἢ ἐκ τῶν αἰγῶν — из овец или из коз."
  12: "κατὰ τὸν ἀριθμὸν ὧν ἐὰν ποιήσητε — по числу того, что сделаете. τῷ ἑνὶ κατὰ τὸν ἀριθμὸν αὐτῶν — на каждого по числу их."
  13: "πᾶς ὁ αὐτόχθων — всякий туземец (αὐτόχθων — «рождённый на земле»). προσενέγκαι καρπώματα — принести сожигаемое (инфинитив цели)."
  14: "προσήλυτος … προσγένηται — пришелец присоединится (προσγίνομαι). ὃς ἂν γένηται ἐν ὑμῖν ἐν ταῖς γενεαῖς — кто будет среди вас в родах ваших. ὃν τρόπον ποιεῖτε ὑμεῖς, οὕτως ποιήσει ἡ συναγωγὴ κυρίῳ — как делаете вы, так пусть делает общество Господу."
  15: "νόμος εἷς — один закон. νόμος αἰώνιος — вечный закон. ὡς ὑμεῖς, καὶ ὁ προσήλυτος — как вы, так и пришелец. ἔναντι κυρίου — пред Господом."
  16: "δικαίωμα ἕν — одно установление, одно оправдание (δικαίωμα). Сокращённый повтор ст. 15."
  17: "εἶπεν κύριος πρὸς Μωυσῆν λέγων — 主はモーセに語って言われた (новый раздел)."
  18: "ἐν τῷ εἰσπορεύεσθαι ὑμᾶς — при входе вашем (ἐν с инфинитивом). εἰσάγω ὑμᾶς ἐκεῖ — ввожу вас туда."
  19: "ἀφελεῖτε ἀφαίρεμα ἀφόρισμα — «отнимите отделяемое» (игра однокоренных: ἀφαιρέω / ἀφαίρεμα / ἀφόρισμα); передано «取り分けたものを取り分けなさい». ἄρτων τῆς γῆς — хлебов земли."
  20: "ἀπαρχὴν φυράματος — начаток теста (φύραμα — замешенное тесто; 初穂). ἄρτον — хлеб, лепёшку. ἀφαίρεμα ἀπὸ ἅλω — возношение с гумна (ἅλων — 打ち場)."
  21: "ἀπαρχὴν φυράματος ὑμῶν — начаток теста вашего. δώσετε κυρίῳ ἀφαίρεμα — дадите Господу возношение. εἰς τὰς γενεὰς ὑμῶν — в роды ваши."
  22: "διαμάρτητε — согрешите, промахнётесь (διαμαρτάνω). πάσας τὰς ἐντολὰς ταύτας — все эти заповеди. Здесь начинается раздел о невольных грехах."
  23: "καθὰ συνέταξεν κύριος — как повелел Господь (συντάσσω). ἐν χειρὶ Μωυσῆ — рукою Моисея. ἀπὸ τῆς ἡμέρας … καὶ ἐπέκεινα — с того дня и далее."
  24: "ἐξ ὀφθαλμῶν τῆς συναγωγῆς — «из очей общества», т. е. по недосмотру (слав. «от очес сонма»). ἀκουσίως — невольно. μόσχον ἕνα ἐκ βοῶν ἄμωμον — одного тельца из крупного скота без порока. χίμαρον ἐξ αἰγῶν ἕνα περὶ ἁμαρτίας — одного козла в жертву за грех (χίμαρος)."
  25: "ἐξιλάσεται — совершит умилостивление (ἐξιλάσκομαι). ἀφεθήσεται — будет прощено (ἀφίημι). ἀκούσιόν ἐστιν — это невольно. ἤνεγκαν τὸ δῶρον … κάρπωμα — принесли дар, сожигаемое. περὶ τῶν ἀκουσίων αὐτῶν — за невольные [грехи] их."
  26: "κατὰ πᾶσαν συναγωγήν — всему обществу. τῷ προσηλύτῳ τῷ προσκειμένῳ — пришельцу, присоединившемуся (πρόσκειμαι). παντὶ τῷ λαῷ ἀκούσιον — весь народ [сделал это] невольно."
  27: "ψυχὴ μία — одна душа, один человек. ἁμάρτῃ ἀκουσίως — согрешит невольно. αἶγα μίαν ἐνιαυσίαν — одну козу однолетнюю (ἐνιαύσιος)."
  28: "ἀκουσιασθείσης — согрешившей невольно (ἀκουσιάζομαι, редкий глагол). ἐξιλάσεται … ἐξιλάσασθαι — тавтология греческого текста сохранена. Слав. добавляет «и оставится ей»; в gr-lxx-byz этого нет (bracket_check: αφεθησεται в 15:28 — НЕТ), в текст не внесено, 〔…〕 не ставим."
  29: "τῷ ἐγχωρίῳ — местному, туземцу (ἐγχώριος). τῷ προσηλύτῳ τῷ προσκειμένῳ ἐν αὐτοῖς — пришельцу, живущему среди них. ὃς ἂν ποιήσῃ ἀκουσίως — кто сделает невольно."
  30: "ἐν χειρὶ ὑπερηφανίας — «рукою гордости», т. е. дерзко, намеренно (ὑπερηφανία). τὸν θεὸν οὗτος παροξύνει — он раздражает Бога (παροξύνω; слав. «Бога сия разгневает»). ἐξολεθρευθήσεται — будет истреблён (ἐξολεθρεύω). ἐκ τοῦ λαοῦ αὐτῆς — из народа своего."
  31: "τὸ ῥῆμα κυρίου ἐφαύλισεν — презрел слово Господне (φαυλίζω). τὰς ἐντολὰς αὐτοῦ διεσκέδασεν — заповеди Его рассыпал, нарушил (διασκεδάννυμι). ἐκτρίψει ἐκτριβήσεται — «истреблением истребится» (удвоение). ἡ ἁμαρτία αὐτῆς ἐν αὐτῇ — грех её на ней."
  32: "ἦσαν … ἐν τῇ ἐρήμῳ — были в пустыне. συλλέγοντα ξύλα — собирающего дрова (συλλέγω). τῇ ἡμέρᾳ τῶν σαββάτων — в день субботы (датив времени)."
  33: "προσήγαγον — привели (προσάγω). οἱ εὑρόντες — нашедшие (εὑρίσκω). πρὸς πᾶσαν συναγωγὴν — ко всему обществу."
  34: "ἀπέθεντο εἰς φυλακήν — поместили под стражу (ἀποτίθημι; φυλακή — темница, стража). οὐ γὰρ συνέκριναν — ибо не рассудили (συγκρίνω), т. е. не было решения."
  35: "Θανάτῳ θανατούσθω — «смертью да умрёт» (удвоение, гебраизм). λιθοβολήσατε λίθοις — побейте камнями (λιθοβολέω + λίθοις). πᾶσα ἡ συναγωγή — всё общество. Слав. добавляет «вне полка»; в gr 15:35 этого нет (bracket_check: εξω в 15:35 — НЕТ), оно стоит в ст. 36, поэтому в 35 не внесено."
  36: "ἐξήγαγον … ἔξω τῆς παρεμβολῆς — вывели вон из стана. ἐλιθοβόλησαν — побили камнями. καθὰ συνέταξεν κύριος τῷ Μωυσῇ — как повелел Господь Моисею."
  37: "εἶπεν κύριος πρὸς Μωυσῆν λέγων — 主はモーセに語って言われた."
  38: "κράσπεδα ἐπὶ τὰ πτερύγια τῶν ἱματίων — кисти на краях одежд (κράσπεδον — 房; πτερύγιον — край, «крыло» одежды). κλῶσμα ὑακίνθινον — нить гиацинтового, т. е. синего цвета (ὑακίνθινος)."
  39: "ἐν τοῖς κρασπέδοις — в кистях. μνησθήσεσθε — вспомните (μιμνήσκομαι). οὐ διαστραφήσεσθε — не совратитесь (διαστρέφω). ὀπίσω τῶν διανοιῶν … τῶν ὀφθαλμῶν — вслед помышлений и очей (διάνοια). ἐκπορνεύετε — блудодействуете (ἐκπορνεύω)."
  40: "ὅπως ἂν μνησθῆτε — чтобы вы вспомнили (ὅπως ἄν с конъюнктивом). ἅγιοι τῷ θεῷ ὑμῶν — святы Богу вашему."
  41: "ὁ ἐξαγαγὼν ὑμᾶς — выведший вас (причастие аориста). εἶναι ὑμῶν θεός — быть вашим Богом. ἐγὼ κύριος ὁ θεὸς ὑμῶν — Я Господь, Бог ваш (повтор в конце)."
