verses:
  1: "イエスはたとえを用[もち]いて彼[かれ]らに語[かた]り始[はじ]められた。「<j>ある人[ひと]がぶどう園[えん]を植[う]え、垣[かき]を巡[めぐ]らし、ぶどう搾[しぼ]りの穴[あな]を掘[ほ]り、やぐらを建[た]て、それを農夫[のうふ]たちに貸[か]して、旅[たび]に出[で]た。</j>"
  2: "<j>季節[きせつ]になると、ぶどう園[えん]の収穫[しゅうかく]を農夫[のうふ]たちから受[う]け取[と]るために、僕[しもべ]を一人[ひとり]遣[つか]わした。</j>"
  3: "<j>ところが、彼[かれ]らはその僕[しもべ]を捕[つか]まえて打[う]ちたたき、何[なに]も持[も]たせずに帰[かえ]らせた。</j>"
  4: "<j>そこでもう一度[いちど]、別[べつ]の僕[しもべ]を遣[つか]わした。彼[かれ]らはその僕[しもべ]の頭[あたま]を打[う]ち、辱[はずかし]めて帰[かえ]らせた。</j>"
  5: "<j>また別[べつ]の僕[しもべ]を遣[つか]わすと、彼[かれ]らはその僕[しもべ]を殺[ころ]した。ほかにも多[おお]くの僕[しもべ]を遣[つか]わしたが、ある者[もの]は打[う]ちたたき、ある者[もの]は殺[ころ]した。</j>"
  6: "<j>まだ一人[ひとり]、愛[あい]する息子[むすこ]が残[のこ]っていた。彼[かれ]は最後[さいご]にその息子[むすこ]を遣[つか]わして言[い]った。『わたしの子[こ]を、彼[かれ]らはきっと敬[うやま]うだろう。』</j>"
  7: "<j>しかし、農夫[のうふ]たちは互[たが]いに言[い]った。『あれは跡取[あとと]りだ。さあ、あれを殺[ころ]してしまおう。そうすれば、遺産[いさん]はわたしたちのものになる。』</j>"
  8: "<j>そこで彼[かれ]らは息子[むすこ]を捕[つか]まえて殺[ころ]し、ぶどう園[えん]の外[そと]に投[な]げ捨[す]てた。</j>"
  9: "<j>ぶどう園[えん]の主人[しゅじん]はどうするだろうか。彼[かれ]はやって来[き]て農夫[のうふ]たちを滅[ほろ]ぼし、ぶどう園[えん]をほかの人[ひと]々[びと]に与[あた]えるだろう。</j>"
  10: "<j>あなたがたは、この聖書[せいしょ]の言葉[ことば]を読[よ]んだことがないのか。『家[いえ]を建[た]てる者[もの]たちが捨[す]てた石[いし]、それが隅[すみ]の親石[おやいし]となった。</j>"
  11: "<j>これは主[しゅ]のなされたことで、わたしたちの目[め]には不思議[ふしぎ]なことだ。』</j>」"
  12: "彼[かれ]らはイエスを捕[と]らえようとしたが、群衆[ぐんしゅう]を恐[おそ]れた。イエスが自分[じぶん]たちを指[さ]してこのたとえを語[かた]られたことが分[わ]かったからである。そこで彼[かれ]らはイエスを残[のこ]して立[た]ち去[さ]った。"
  13: "彼[かれ]らはイエスを言葉[ことば]で捕[と]らえようとして、ファリサイ派[は]とヘロデ派[は]の何人[なんにん]かをイエスのもとに遣[つか]わした。"
  14: "彼[かれ]らは来[き]て言[い]った。「先生[せんせい]、わたしたちは、あなたが真実[しんじつ]な方[かた]で、だれをも気[き]にかけず、人[ひと]の顔色[かおいろ]をうかがわないことを知[し]っています。あなたは神[かみ]の道[みち]を真実[しんじつ]に教[おし]えておられます。カエサルに税金[ぜいきん]を納[おさ]めるのは許[ゆる]されているでしょうか。納[おさ]めるべきでしょうか、それとも納[おさ]めずにおくべきでしょうか。」"
  15: "イエスは彼[かれ]らの偽善[ぎぜん]を知[し]って言[い]われた。「<j>なぜわたしを試[こころ]みるのか。デナリオン銀貨[ぎんか]を一枚[いちまい]、わたしに見[み]せなさい。</j>」"
  16: "彼[かれ]らは持[も]って来[き]た。イエスは言[い]われた。「<j>この肖像[しょうぞう]と銘[めい]はだれのものか。</j>」彼[かれ]らは答[こた]えた。「カエサルのです。」"
  17: "イエスは言[い]われた。「<j>カエサルのものはカエサルに、神[かみ]のものは神[かみ]に返[かえ]しなさい。</j>」人々[ひとびと]はイエスに驚嘆[きょうたん]した。"
  18: "復活[ふっかつ]はないと言[い]うサドカイ派[は]の人々[ひとびと]がイエスのもとに来[き]て、問[と]いかけた。"
  19: "「先生[せんせい]、モーセはわたしたちのためにこう書[しる]しています。『もし人[ひと]の兄弟[きょうだい]が死[し]んで、妻[つま]を残[のこ]し、子[こ]を残[のこ]さなかったなら、その兄弟[きょうだい]はその妻[つま]をめとり、その兄弟[きょうだい]のために子孫[ししゅう]を起[お]こすべきである』と。"
  20: "七人[しちにん]の兄弟[きょうだい]がいた。最初[さいしょ]の者[もの]が妻[つま]をめとったが、死[し]ぬとき子[こ]を残[のこ]さなかった。"
  21: "次[つぎ]の者[もの]も彼女[かのじょ]をめとり、子[こ]を残[のこ]さずに死[し]んだ。三人目[さんにんめ]も同[おな]じであった。"
  22: "七人[しちにん]とも子[こ]を残[のこ]さなかった。最後[さいご]に、その女[おんな]も死[し]んだ。"
  23: "復活[ふっかつ]のとき、〔彼[かれ]らが復活[ふっかつ]するとき、〕この女[おんな]はだれの妻[つま]になるのか。七人[しちにん]とも彼女[かのじょ]を妻[つま]にしたのだから。」"
  24: "イエスは言[い]われた。「<j>あなたがたは聖書[せいしょ]も神[かみ]の力[ちから]も知[し]らないので、思[おも]い違[ちが]っているのではないか。</j>"
  25: "<j>死[し]んだ者[もの]たちの中[なか]から復活[ふっかつ]するとき、人[ひと]はめとることも嫁[とつ]ぐこともなく、天[てん]の天使[てんし]たちのようになる。</j>"
  26: "<j>死[し]んだ者[もの]たちが復活[ふっかつ]することについては、モーセの書[しょ]の柴[しば]の箇所[かしょ]で、神[かみ]がモーセに何[なん]と言[い]われたかを読[よ]んだことがないのか。『わたしはアブラハムの神[かみ]、イサクの神[かみ]、ヤコブの神[かみ]である』。</j>"
  27: "<j>神[かみ]は死[し]んだ者[もの]の神[かみ]ではなく、生[い]きている者[もの]の神[かみ]である。あなたがたは大[おお]きく思[おも]い違[ちが]っている。</j>」"
  28: "律法学者[りっぽうがくしゃ]の一人[ひとり]が、彼[かれ]らの論議[ろんぎ]を聞[き]いていた。イエスがうまく答[こた]えられたのを見[み]て、イエスに尋[たず]ねた。「すべての掟[おきて]のうちで、第一[だいいち]のものはどれですか。」"
  29: "イエスは答[こた]えられた。「<j>第一[だいいち]の掟[おきて]はこうである。『イスラエルよ、聞[き]け。主[しゅ]なるわたしたちの神[かみ]は、唯一[ゆいいつ]の主[しゅ]である。</j>"
  30: "<j>心[こころ]を尽[つ]くし、魂[たましい]を尽[つ]くし、思[おも]いを尽[つ]くし、力[ちから]を尽[つ]くして、あなたの神[かみ]である主[しゅ]を愛[あい]せよ。』</j>"
  31: "<j>第二[だいに]の掟[おきて]はこうである。『あなたの隣人[りんじん]をあなた自身[じしん]のように愛[あい]せよ』。この二[ふた]つの掟[おきて]より大[おお]きな掟[おきて]はほかにない。</j>」"
  32: "律法学者[りっぽうがくしゃ]は言[い]った。「先生[せんせい]、そのとおりです。神[かみ]は唯一[ゆいいつ]であり、そのほかに神[かみ]はない、とあなたが言[い]われたのは真実[しんじつ]です。"
  33: "また、心[こころ]を尽[つ]くし、悟[さと]りを尽[つ]くし、力[ちから]を尽[つ]くして神[かみ]を愛[あい]し、自分自身[じしん]のように隣人[りんじん]を愛[あい]することは、すべての焼[や]き尽[つ]くす献[ささ]げ物[もの]やいけにえよりもまさっています。」"
  34: "イエスは、彼[かれ]が賢明[けんめい]に答[こた]えたのを見[み]て言[い]われた。「<j>あなたは神[かみ]の国[くに]から遠[とお]くない。</j>」その後[あと]は、だれも敢[あえ]てイエスに問[と]おうとしなかった。"
  35: "イエスは神殿[しんでん]で教[おし]えておられたとき、こう言[い]われた。「<j>律法学者[りっぽうがくしゃ]たちは、なぜキリストがダビデの子[こ]だと言[い]うのか。</j>"
  36: "<j>ダビデ自身[じしん]が{聖霊[せいれい]|聖神[せいしん]}によって言[い]った。『主[しゅ]はわたしの主[しゅ]に言[い]われた。「わたしの右[みぎ]に座[すわ]れ。わたしがあなたの敵[てき]をあなたの足台[あしだい]とするまで」と』。</j>"
  37: "<j>ダビデ自身[じしん]がキリストを主[しゅ]と呼[よ]んでいる。それなら、どうしてキリストがダビデの子[こ]であり得[え]るのか。</j>」大勢[おおぜい]の群衆[ぐんしゅう]は喜[よろこ]んでイエスの話[はなし]を聞[き]いていた。"
  38: "イエスはその教[おし]えの中[なか]で言[い]われた。「<j>律法学者[りっぽうがくしゃ]たちに気[き]をつけなさい。彼[かれ]らは長[なが]い衣[ころも]を着[き]て歩[ある]き回[まわ]ることを好[この]み、広場[ひろば]での挨拶[あいさつ]を好[この]み、</j>"
  39: "<j>会堂[かいどう]の上座[かみざ]や宴会[えんかい]の上席[じょうせき]を好[この]む。</j>"
  40: "<j>やもめの家[いえ]を食[く]い尽[つ]くし、見[み]せかけで長[なが]い祈[いの]りをする者[もの]たちは、いっそう重[おも]い裁[さば]きを受[う]ける。</j>」"
  41: "イエスは献金箱[けんきんばこ]の向[む]かいに座[すわ]って、群衆[ぐんしゅう]が献金箱[けんきんばこ]に金[かね]を投[な]げ入[い]れる様子[ようす]をご覧[らん]になっていた。多[おお]くの金持[かねも]ちが多[おお]く投[な]げ入[い]れ、"
  42: "一人[ひとり]の貧[まず]しいやもめが来[き]て、レプタ銅貨[どうか]二枚[にまい]⟨ユダヤの最小[さいしょう]の銅貨[どうか]。二枚[にまい]で一[いち]コドラント（ローマの最小[さいしょう]の銅貨[どうか]）にあたる。⟩を投[な]げ入[い]れた。"
  43: "イエスは弟子[でし]たちを呼[よ]び寄[よ]せて言[い]われた。「<j>はっきり言[い]っておく。この貧[まず]しいやもめは、献金箱[けんきんばこ]に投[な]げ入[い]れる者[もの]たちのだれよりも多[おお]く投[な]げ入[い]れた。</j>"
  44: "<j>なぜなら、彼[かれ]らはみな、自分[じぶん]の余[あま]っているものから投[な]げ入[い]れたが、この人[ひと]は乏[とぼ]しい中[なか]から、自分[じぶん]の持[も]っているものすべて、生活[せいかつ]のすべてを投[な]げ入[い]れたからである。</j>」"

notes:
  1: "Ис 5:1-2. γεωργοί — «виноградари, работники»; 農夫."
  9: "τί [οὖν] ποιήσει — οὖν в критической базе в скобках; переведено без «итак», 〔〕 на частицу не ставил."
  10: "Пс 117:22-23 (Синод. 118:22-23); κεφαλὴ γωνίας — 隅の親石."
  15: "δηνάριον — дневная плата работнику; пояснение дано в 6:37, здесь без сноски."
  23: "ὅταν ἀναστῶσιν в критической базе в скобках; Церковь читает — 〔彼らが復活するとき〕."
  26: "Исх 3:6; ἐπὶ τοῦ βάτου — «при кусте», 柴の箇所."
  29: "Втор 6:4-5; εἷς ἐστιν — «один есть»."
  31: "Лев 19:18."
  36: "Пс 109:1 (Синод. 110:1). ἐν τῷ πνεύματι τῷ ἁγίῳ — «Духом Святым»; 聖霊 в кальке 聖神."
  41: "γαζοφυλάκιον — сокровищница при храме, куда опускали дары; 献金箱."
  42: "λεπτὰ δύο, ὅ ἐστιν κοδράντης — две лепты, то есть квадрант; сноска при первом упоминании. У jp-joc «五釐» (старая японская монета), объяснил через квадрант."
