# jp-box, Иезекииль, глава 36. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 36 (совпадает; см. карту 20/21).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: 1–15 — слово к горам Израилевым: враг взял землю в достояние,
# но Господь поднимет руку на народы, земля снова будет возделываема и заселена,
# умножение людей и скота; 16–38 — новое слово: дом Израилев осквернил землю,
# излилась ярость, народ рассеян и обесславил имя Божие среди народов; Господь
# действует не ради народа, а ради Своего святого имени: возвращение, окропление
# чистой водой, **новое сердце и новый дух**, «вложу дух Мой в вас», земля как сад
# отрады, города полны людей, как стада в праздники.
# Голоса: 1 — формула пророку вне кавычек, затем открывается 「…」 («слушайте слово
# Господне» — уже речь Господа); 1–15 одна непрерывная речь Господа (в 2 слова врага,
# в 13 и 20 слова людей — вложенная речь 『…』); 16 — формула вне кавычек;
# 17–38 вторая речь Господа (в 35 слова людей — 『…』). Формулы «так говорит Господь
# Бог» и «говорит Господь Бог» — внутри речи, вне отдельной цитаты.
# «Точка»: в этой главе нет.
# Имена и термины: イスラエル, エドム (Ιδουμαία), エルサレム; 偶像[ぐうぞう] (εἴδωλον),
# 所有[しょゆう]/嗣業[しぎょう] (κατάσχεσις, κληρονομία), 汚[けが]れ (ἀκαθαρσία),
# 不法[ふほう] (ἀνομία), 忌[い]まわしいもの (βδέλυγμα), 定[さだ]め (δικαίωμα),
# 裁[さば]き (κρίμα), 霊[れい] (πνεῦμα), 心[こころ] (καρδία), 主[しゅ]なる神[かみ]
# (κύριος κύριος / адонаи Господь).
#

