verses:
  1: "人[ひと]の子[こ]よ、イスラエルの山[やま]々[やま]について預言[よげん]せよ。イスラエルの山々に言[い]え。「イスラエルの山々よ、主[しゅ]の言葉[ことば]を聞[き]け。"
  2: "主[しゅ]なる神[かみ]はこう言[い]われる。敵[てき]があなたがたについて言[い]ったからである。『ああ、よし。永遠[えいえん]の荒[あ]れ地[ち]がわたしたちの所有[しょゆう]となった』と。"
  3: "それゆえ、預言[よげん]して言[い]え。主[しゅ]なる神[かみ]はこう言[い]われる。あなたがたが辱[はずかし]められ、周[まわ]りにいる者[もの]たちに憎[にく]まれ、残[のこ]りの諸国民[しょこくみん]の所有[しょゆう]とされ、人[ひと]の語[かた]り草[ぐさ]となり、諸国民のそしりとなったからである。"
  4: "それゆえ、イスラエルの山[やま]々よ、主[しゅ]の言葉[ことば]を聞[き]け。主[しゅ]なる神[かみ]はこう言[い]われる。山[やま]と丘[おか]、谷[たに]と涸[か]れ川[がわ]、荒[あ]れ果[は]てた所[ところ]と滅[ほろ]ぼされた所[ところ]、捨[す]てられた町[まち]々[まち]に。それらは周[まわ]りに残[のこ]った諸国民[しょこくみん]の獲物[えもの]となり、踏[ふ]みつけられる所[ところ]となった。"
  5: "それゆえ、主[しゅ]なる神[かみ]はこう言[い]われる。まことに、わたしは燃[も]える怒[いか]りの火[ひ]をもって、残[のこ]りの諸国民[しょこくみん]とエドムの全[ぜん]土[ど]に語[かた]った。彼らは喜[よろこ]びをもって、わたしの地[ち]を自分[じぶん]たちの所有[しょゆう]としたからである。彼らは魂[たましい]を蔑[さげす]み、それを獲物[えもの]として滅[ほろ]ぼそうとした。"
  6: "それゆえ、イスラエルの地[ち]について預言[よげん]して、山[やま]と丘[おか]、谷[たに]と窪[くぼ]みに言[い]え。主[しゅ]なる神[かみ]はこう言[い]われる。見[み]よ、わたしはわたしの妬[ねた]みと怒[いか]りとをもって語[かた]った。あなたがたが諸国民[しょこくみん]のそしりを負[お]わされたからである。"
  7: "主[しゅ]なる神[かみ]はこう言[い]われる。見[み]よ、わたしはあなたがたの周[まわ]りにいる諸国民[しょこくみん]に向[む]かって手[て]を上[あ]げる。彼らは自分[じぶん]たちの恥[はじ]を負[お]う。"
  8: "あなたがた、イスラエルの山[やま]々よ、あなたがたのぶどうと実[み]を、わたしの民[たみ]が食[た]べる。彼らは来[く]ることを待[ま]ち望[のぞ]んでいるからである。"
  9: "見[み]よ、わたしはあなたがたの側[そば]にいる。わたしはあなたがたを顧[かえり]みる。あなたがたは耕[たがや]され、蒔[ま]かれる。"
  10: "わたしはあなたがたの上[うえ]に人[ひと]を増[ふ]やす。イスラエルの全[ぜん]家[か]を、ついに。町[まち]々[まち]は住[す]まわれるようになり、荒[あ]れ果[は]てた所[ところ]は建[た]てられる。"
  11: "わたしはあなたがたの上[うえ]に人[ひと]と家畜[かちく]を増[ふ]やし、あなたがたを昔[むかし]のように住[す]まわせる。わたしはかつてあなたがたの前[まえ]にあった時[とき]よりも、あなたがたに良[よ]くする。あなたがたはわたしが主[しゅ]であることを知[し]る。"
  12: "わたしはあなたがたの上[うえ]に人[ひと]を産[う]む。わたしの民[たみ]イスラエルである。彼らはあなたがたを嗣業[しぎょう]として受[う]け継[つ]ぎ、あなたがたは彼らの所有[しょゆう]となる。あなたがたはもはや、彼らのゆえに子[こ]のない者[もの]とされることはない。"
  13: "主[しゅ]なる神[かみ]はこう言[い]われる。人[ひと]々[びと]があなたについて、『あなたは人[ひと]を食[く]らう地[ち]、その民[たみ]を子[こ]のない者[もの]とする地[ち]だ』と言[い]ったからである。"
  14: "それゆえ、あなたはもはや人[ひと]を食[く]らわず、あなたの民[たみ]をもはや子[こ]のない者[もの]としない、と主[しゅ]なる神[かみ]は言[い]われる。"
  15: "あなたがたはもはや諸国民[しょこくみん]の恥[はじ]を聞[き]くことがなく、民[たみ]々[びと]のそしりをもはや負[お]わない。あなたの民[たみ]はもはや子[こ]のない者[もの]とならない、と主[しゅ]なる神[かみ]は言[い]われる。」"
  16: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  17: "「人[ひと]の子[こ]よ、イスラエルの家[いえ]は自分[じぶん]たちの地[ち]に住[す]んだが、その道[みち]と偶像[ぐうぞう]と汚[けが]れとによって、その地を汚[けが]した。彼らの道[みち]は、わたしの前[まえ]で、月[つき]のさわりにある女[おんな]の汚[けが]れのようになった。"
  18: "わたしは彼らの上[うえ]にわたしの怒[いか]りを注[そそ]いだ。彼らが地[ち]に流[なが]した血[ち]のゆえ、また彼らが偶像[ぐうぞう]でその地を汚[けが]したゆえである。"
  19: "わたしは彼らを諸国民[しょこくみん]の間[あいだ]に散[ち]らし、国[くに]々[ぐに]にまき散[ち]らした。わたしは彼らの道[みち]とその罪[つみ]に従[したが]って彼らを裁[さば]いた。"
  20: "彼らは行[い]った先[さき]の諸国民[しょこくみん]の間[あいだ]に入[はい]り、わたしの聖[せい]なる名[な]を汚[けが]した。人[ひと]々[びと]が彼らについて、『これは主[しゅ]の民[たみ]であり、その地[ち]から出[で]て来[き]た者[もの]だ』と言[い]ったからである。"
  21: "しかし、わたしはわたしの聖[せい]なる名[な]のために彼らを惜[お]しんだ。イスラエルの家[いえ]が、行[い]った先[さき]の諸国民[しょこくみん]の間[あいだ]で汚[けが]した名[な]である。"
  22: "それゆえ、イスラエルの家[いえ]に言[い]え。主[しゅ]なる神[かみ]はこう言[い]われる。イスラエルの家[いえ]よ、わたしがこれをするのは、あなたがたのためではない。あなたがたが行[い]った先[さき]の諸国民[しょこくみん]の間[あいだ]で汚[けが]した、わたしの聖[せい]なる名[な]のためである。"
  23: "わたしは、諸国民[しょこくみん]の間[あいだ]で汚[けが]され、あなたがたが彼らの間[あいだ]で汚[けが]した、わたしの大[おお]いなる名[な]を聖[せい]とする。諸国民[しょこくみん]は、わたしがあなたがたの間[あいだ]で聖[せい]とされるとき、その目[め]の前[まえ]で、わたしが主[しゅ]であることを知[し]る、と主[しゅ]なる神[かみ]は言[い]われる。"
  24: "わたしはあなたがたを諸国民[しょこくみん]の間[あいだ]から取[と]り、すべての国[くに]々[ぐに]から集[あつ]めて、あなたがたをあなたがたの地[ち]に連[つ]れ戻[もど]す。"
  25: "わたしはあなたがたに清[きよ]い水[みず]を振[ふ]りかける。あなたがたはすべての汚[けが]れから、またすべての偶像[ぐうぞう]から清[きよ]められる。わたしはあなたがたを清[きよ]める。"
  26: "わたしはあなたがたに新[あたら]しい心[こころ]を与[あた]え、あなたがたの内[うち]に新[あたら]しい霊[れい]を与[あた]える。わたしはあなたがたの肉[にく]から石[いし]の心[こころ]を取[と]り除[のぞ]き、肉[にく]の心[こころ]をあなたがたに与[あた]える。"
  27: "わたしはあなたがたの内[うち]にわたしの霊[れい]を置[お]く。わたしは、あなたがたがわたしの定[さだ]めに従[したが]って歩[あゆ]み、わたしの裁[さば]きを守[まも]って行[おこな]うようにする。"
  28: "あなたがたは、わたしがあなたがたの父[ちち]たちに与[あた]えた地[ち]に住[す]む。あなたがたはわたしの民[たみ]となり、わたしはあなたがたの神[かみ]となる。"
  29: "わたしはあなたがたをすべての汚[けが]れから救[すく]う。わたしは麦[むぎ]を呼[よ]び寄[よ]せてこれを増[ふ]やし、あなたがたに飢[う]えを与[あた]えない。"
  30: "わたしは木[き]の実[み]と野[の]の産物[さんぶつ]を増[ふ]やし、あなたがたが諸国民[しょこくみん]の間[あいだ]で飢[う]えのそしりを受[う]けないようにする。"
  31: "あなたがたは自分[じぶん]たちの悪[わる]い道[みち]と、良[よ]くない行[おこな]いとを思[おも]い起[おこ]し、その不法[ふほう]と忌[い]まわしいもののゆえに、自分[じぶん]たちを忌[い]み嫌[きら]うようになる。"
  32: "わたしがこれをするのはあなたがたのためではない、と主[しゅ]なる神[かみ]は言[い]われる。このことはあなたがたに知[し]らせておく。イスラエルの家[いえ]よ、あなたがたの道[みち]を恥[は]じ、辱[はずかし]められよ。"
  33: "主[しゅ]なる神[かみ]はこう言[い]われる。わたしがあなたがたをすべての不法[ふほう]から清[きよ]める日[ひ]、わたしは町[まち]々[まち]に人を住[す]まわせ、荒[あ]れ果[は]てた所[ところ]は建[た]てられる。"
  34: "荒[あ]れ果[は]てた地[ち]は耕[たがや]される。それは、通[とお]り過[す]ぎるすべての者[もの]の目[め]に荒[あ]れ果[は]てていたからである。"
  35: "人[ひと]々[びと]は言[い]う。『あの荒[あ]れ果[は]てていた地[ち]は、楽[たの]しみの園[その]のようになった。荒[あ]れ果[は]てて滅[ほろ]び、崩[くず]れていた町[まち]々[まち]は、堅[かた]く囲[かこ]まれて建[た]っている』と。"
  36: "あなたがたの周[まわ]りに残[のこ]っているすべての諸国民[しょこくみん]は、わたしが主[しゅ]であることを知[し]る。わたしは崩[くず]された所[ところ]を建[た]て、荒[あ]れ果[は]てた所[ところ]を植[う]えた。わたしは主[しゅ]であり、語[かた]って、それを行[おこな]う。"
  37: "主[しゅ]なる神[かみ]はこう言[い]われる。イスラエルの家[いえ]は、なおもこれをわたしに求[もと]めるであろう。わたしが彼らのために行[おこな]うことを。わたしは彼らを羊[ひつじ]のように、人[ひと]を増[ふ]やす。"
  38: "エルサレムの祭[まつ]りにいる聖[せい]なる羊[ひつじ]のように、荒[あ]れ果[は]てた町[まち]々[まち]は人[ひと]の羊[ひつじ]で満[み]ちる。彼らはわたしが主[しゅ]であることを知[し]る。」"

notes:
  1: "Υἱὲ ἀνθρώπου, προφήτευσον ἐπὶ τὰ ὄρη Ισραηλ — «сын человеческий, изреки пророчество на горы Израилевы»; Ἀκούσατε λόγον κυρίου — «слушайте слово Господне»: это уже начало речи Господа, поэтому 「…」 открывается здесь и идёт до конца 15-го стиха. Слав. переносит «слышите слово Господне» в начало 2-го стиха (иное деление), повтор не внесён."
  2: "Τάδε λέγει κύριος κύριος — «так говорит Господь Бог» (слав. «адонаи Господь»); Ἀνθ᾽ ὧν εἶπεν ὁ ἐχθρός — «за то, что сказал враг»; Εὖγε — «хорошо! ага!» (слав. «благоже»); ἔρημα αἰώνια εἰς κατάσχεσιν ἡμῖν ἐγενήθη — «вечные пустыни стали нам в достояние» (κατάσχεσις — 所有). Слова врага — вложенная речь 『…』."
  3: "προφήτευσον καὶ εἰπόν — «изреки пророчество и скажи»; ἀντὶ τοῦ ἀτιμασθῆναι ὑμᾶς — «за то, что вы обесчещены»; εἰς κατάσχεσιν τοῖς καταλοίποις ἔθνεσιν — «в достояние остальным народам»; ἀνέβητε λάλημα γλώσσῃ — «вы взошли на язык», т. е. стали молвой; εἰς ὀνείδισμα ἔθνεσιν — «в поношение народам». Слав. «погубленым» — нет в LXX."
  4: "ὄρη, βουνούς, φάραγγας, χειμάρρους — «горы, холмы, долины, потоки» (χείμαρρος — 涸れ川); ἐξηρημωμένα καὶ ἠφανισμένα — «опустошённые и истреблённые»; πόλεις ἐγκαταλελειμμένας — «города оставленные»; εἰς προνομὴν καὶ εἰς καταπάτημα — «в добычу и в попрание». Слав. добавляет «и полянам» (καὶ ταῖς νάπαις, ср. 36:6) — нет в LXX."
  5: "εἰ μὴν ἐν πυρὶ θυμοῦ μου — «истинно, в огне ярости Моей»; ἐπὶ τὴν Ιδουμαίαν πᾶσαν — «на всю Идумею» (エドム); ἔδωκαν τὴν γῆν μου ἑαυτοῖς εἰς κατάσχεσιν — «отдали землю Мою себе в достояние»; ἀτιμάσαντες ψυχὰς τοῦ ἀφανίσαι ἐν προνομῇ — «обесчестив души, чтобы истребить в добычу». Слав. в скобках «(от всего сердца)» — редакционная скобка, не перенесена."
  6: "προφήτευσον ἐπὶ τὴν γῆν τοῦ Ισραηλ — «изреки пророчество на землю Израилеву»; ὄρεσιν, βουνοῖς, φάραγξιν, νάπαις — «горам, холмам, долинам, ложбинам» (νάπη — 窪み); ἐν τῷ ζήλῳ μου καὶ ἐν τῷ θυμῷ μου — «в ревности Моей и в ярости Моей» (ζῆλος — 妬み); ἀντὶ τοῦ ὀνειδισμοὺς ἐθνῶν ἐνέγκαι ὑμᾶς — «за то, что вы понесли поношения народов»."
  7: "ἐγὼ ἀρῶ τὴν χεῖρά μου ἐπὶ τὰ ἔθνη — «Я подниму руку Мою на народы» (жест клятвы); τὴν ἀτιμίαν αὐτῶν λήμψονται — «позор свой примут». Формула «так говорит Господь Бог» в начале стиха есть только в слав., в LXX её нет — внесена без 〔…〕."
  8: "τὴν σταφυλὴν καὶ τὸν καρπὸν ὑμῶν καταφάγεται ὁ λαός μου — «виноград ваш и плод ваш съест народ Мой»; ἐγγίζουσιν τοῦ ἐλθεῖν — «близки прийти». Слав. «яко надеются приити» (надеются) — расхождение с LXX; оставлено слав. чтение, вариант LXX в этой заметке."
  9: "ἰδοὺ ἐγὼ ἐφ᾽ ὑμᾶς — «вот, Я на вас», т. е. к вам; ἐπιβλέψω ἐφ᾽ ὑμᾶς — «призрю на вас»; κατεργασθήσεσθε καὶ σπαρήσεσθε — «будете возделываемы и засеваемы»."
  10: "πληθυνῶ ἐφ᾽ ὑμᾶς ἀνθρώπους — «умножу на вас людей»; πᾶν οἶκον Ισραηλ εἰς τέλος — «весь дом Израилев до конца»; κατοικηθήσονται αἱ πόλεις — «заселятся города»; ἡ ἠρημωμένη οἰκοδομηθήσεται — «опустевшее будет построено»."
  11: "πληθυνῶ ἀνθρώπους καὶ κτήνη — «умножу людей и скот» (κτῆνος — 家畜); κατοικιῶ ὑμᾶς ὡς τὸ ἐν ἀρχῇ ὑμῶν — «поселю вас как в начале вашем»; εὖ ποιήσω ὑμᾶς — «благотворю вам»; γνώσεσθε ὅτι ἐγώ εἰμι κύριος — формула 知る (ср. 36:12, 23, 36, 38)."
  12: "γεννήσω ἐφ᾽ ὑμᾶς ἀνθρώπους τὸν λαόν μου Ισραηλ — «рожу на вас людей, народ Мой Израиль»; κληρονομήσουσιν ὑμᾶς — «наследуют вас» (κληρονομέω); ἔσεσθε αὐτοῖς εἰς κατάσχεσιν — «будете им в достояние»; οὐ μὴ προστεθῆτε ἔτι ἀτεκνωθῆναι ἀπ᾽ αὐτῶν — «не будете более лишаемы детей от них» (ἀτεκνόω)."
  13: "Ἀνθ᾽ ὧν εἶπάν σοι — «за то, что сказали тебе»; Κατέσθουσα ἀνθρώπους εἶ — «поедающая людей ты»; ἠτεκνωμένη ὑπὸ τοῦ ἔθνους σου — «лишённая детей от народа твоего». Слова людей — вложенная речь 『…』."
  14: "ἀνθρώπους οὐκέτι φάγεσαι — «людей больше не съешь»; τὸ ἔθνος σου οὐκ ἀτεκνώσεις ἔτι — «народ твой больше не сделаешь бездетным»; λέγει κύριος κύριος — «говорит Господь Бог»."
  15: "οὐκ ἀκουσθήσεται οὐκέτι ἐφ᾽ ὑμᾶς ἀτιμία ἐθνῶν — «не услышится более на вас позор народов»; ὀνειδισμοὺς λαῶν οὐ μὴ ἀνενέγκητε — «поношений народов не понесёте более». Слав. добавляет в конце «и язык твой не будет без чад ктому» — нет в LXX, внесено без 〔…〕; здесь закрывается первая речь главы."
  16: "Καὶ ἐγένετο λόγος κυρίου πρός με λέγων — формула вне кавычек; ею закрывается речь 1–15 и открывается новая (17–38)."
  17: "κατῴκησεν ἐπὶ τῆς γῆς αὐτῶν — «поселился на земле своей»; ἐμίαναν αὐτὴν ἐν τῇ ὁδῷ αὐτῶν — «осквернили её в пути своём»; ἐν τοῖς εἰδώλοις — «идолами» (εἴδωλον — 偶像); κατὰ τὴν ἀκαθαρσίαν τῆς ἀποκαθημένης — «как нечистота женщины в отделении» (ἀποκαθημένη — женщина в месячном очищении; слав. «месячная имущия»)."
  18: "καὶ ἐξέχεα τὸν θυμόν μου ἐπ᾽ αὐτούς — «и излил Я ярость Мою на них»: в LXX стих кончается здесь. Слав. продолжает «крови ради, юже пролияша на землю, и кумирми своими оскверниша ю» — нет в LXX, внесено без 〔…〕."
  19: "διέσπειρα αὐτοὺς εἰς τὰ ἔθνη — «рассеял их по народам»; ἐλίκμησα αὐτοὺς εἰς τὰς χώρας — «развеял их по странам» (λικμάω — веять); κατὰ τὴν ὁδὸν αὐτῶν καὶ κατὰ τὴν ἁμαρτίαν αὐτῶν ἔκρινα αὐτούς — «по пути их и по греху их судил их»."
  20: "ἐβεβήλωσαν τὸ ὄνομά μου τὸ ἅγιον — «осквернили имя Моё святое» (βεβηλόω); ἐν τῷ λέγεσθαι αὐτούς — «когда говорили о них»; Λαὸς κυρίου οὗτοι — «это народ Господень» — вложенная речь 『…』; ἐκ τῆς γῆς αὐτοῦ ἐξεληλύθασιν — «из земли Его вышли»."
  21: "ἐφεισάμην αὐτῶν — «пощадил их» (φείδομαι); διὰ τὸ ὄνομά μου τὸ ἅγιον — «ради имени Моего святого»; ὃ ἐβεβήλωσαν οἶκος Ισραηλ ἐν τοῖς ἔθνεσιν — «которое осквернил дом Израилев среди народов»."
  22: "Οὐχ ὑμῖν ἐγὼ ποιῶ — «не вам Я делаю»; ἀλλ᾽ ἢ διὰ τὸ ὄνομά μου — «но ради имени Моего»; ὃ ἐβεβηλώσατε ἐν τοῖς ἔθνεσιν — «которое вы осквернили среди народов». Формула «так говорит Господь Бог» — внутри речи."
  23: "ἁγιάσω τὸ ὄνομά μου τὸ μέγα — «освящу имя Моё великое»; τὸ βεβηλωθὲν ἐν τοῖς ἔθνεσιν — «осквернённое среди народов»; γνώσονται τὰ ἔθνη ὅτι ἐγώ εἰμι κύριος — формула; ἐν τῷ ἁγιασθῆναί με ἐν ὑμῖν — «когда освящусь в вас»."
  24: "λήμψομαι ὑμᾶς ἐκ τῶν ἐθνῶν — «возьму вас из народов»; ἀθροίσω ὑμᾶς ἐκ πασῶν τῶν γαιῶν — «соберу вас из всех земель» (γαῖα); εἰσάξω ὑμᾶς εἰς τὴν γῆν ὑμῶν — «введу вас в землю вашу»."
  25: "ῥανῶ ἐφ᾽ ὑμᾶς ὕδωρ καθαρόν — «окроплю вас водою чистою» (ῥαίνω — кропить); καθαρισθήσεσθε ἀπὸ πασῶν τῶν ἀκαθαρσιῶν — «очиститесь от всех нечистот»; ἀπὸ πάντων τῶν εἰδώλων — «от всех идолов»; καθαριῶ ὑμᾶς — «очищу вас»."
  26: "δώσω ὑμῖν καρδίαν καινήν — «дам вам сердце новое»; πνεῦμα καινὸν δώσω ἐν ὑμῖν — «дух новый дам в вас»; ἀφελῶ τὴν καρδίαν τὴν λιθίνην ἐκ τῆς σαρκὸς ὑμῶν — «отниму сердце каменное из плоти вашей»; καρδίαν σαρκίνην — «сердце плотяное». Слав. добавляет в конце «и дух мой дам в вас» — в LXX эта клауза открывает 27-й стих, повтор не внесён."
  27: "τὸ πνεῦμά μου δώσω ἐν ὑμῖν — «Дух Мой дам в вас»; ποιήσω ἵνα ἐν τοῖς δικαιώμασίν μου πορεύησθε — «сделаю, чтобы в оправданиях Моих ходили» (δικαίωμα — 定め); τὰ κρίματά μου φυλάξησθε καὶ ποιήσητε — «суды Мои соблюдали и исполняли»."
  28: "κατοικήσετε ἐπὶ τῆς γῆς, ἧς ἔδωκα τοῖς πατράσιν ὑμῶν — «будете жить на земле, которую дал отцам вашим»; ἔσεσθέ μοι εἰς λαόν — «будете Мне народом»; κἀγὼ ἔσομαι ὑμῖν εἰς θεόν — «и Я буду вам Богом» (формула завета)."
  29: "σώσω ὑμᾶς ἐκ πασῶν τῶν ἀκαθαρσιῶν — «спасу вас от всех нечистот»; καλέσω τὸν σῖτον — «призову пшеницу» (σῖτος — 麦); πληθυνῶ αὐτόν — «умножу её»; οὐ δώσω ἐφ᾽ ὑμᾶς λιμόν — «не дам на вас голода» (λιμός — 飢え). Слав. в скобках «(и очищу вы от грех ваших всех)» — редакционная скобка, не перенесена."
  30: "τὸν καρπὸν τοῦ ξύλου — «плод дерева»; τὰ γενήματα τοῦ ἀγροῦ — «произведения поля» (γένημα); ὀνειδισμὸν λιμοῦ ἐν τοῖς ἔθνεσιν — «поношение голода среди народов»."
  31: "μνησθήσεσθε τὰς ὁδοὺς ὑμῶν τὰς πονηράς — «вспомните пути ваши злые»; τὰ ἐπιτηδεύματα ὑμῶν τὰ μὴ ἀγαθά — «дела ваши недобрые» (ἐπιτήδευμα); προσοχθιεῖτε κατὰ πρόσωπον αὐτῶν — «вознегодуете на лицах их» (προσοχθίζω — гнушаться); ἐν ταῖς ἀνομίαις καὶ ἐπὶ τοῖς βδελύγμασιν — «за беззакония и за мерзости»."
  32: "οὐ δι᾽ ὑμᾶς ἐγὼ ποιῶ — «не ради вас Я делаю»; γνωστὸν ἔσται ὑμῖν — «известно да будет вам»; αἰσχύνθητε καὶ ἐντράπητε — «устыдитесь и посрамитесь». Слав. в скобках повторяет «(доме израилев:)» — редакционная скобка, не перенесена."
  33: "ἐν ἡμέρᾳ, ᾗ καθαριῶ ὑμᾶς — «в день, когда очищу вас»; κατοικιῶ τὰς πόλεις — «поселю города»; οἰκοδομηθήσονται αἱ ἔρημοι — «построятся пустыни»."
  34: "ἡ γῆ ἡ ἠφανισμένη ἐργασθήσεται — «земля истреблённая будет возделана» (ἐργάζομαι); ἀνθ᾽ ὧν ὅτι ἠφανισμένη ἐγενήθη — «за то, что была истреблена»; κατ᾽ ὀφθαλμοὺς παντὸς παροδεύοντος — «пред глазами всякого проходящего»."
  35: "ὡς κῆπος τρυφῆς — «как сад отрады» (τρυφή — наслаждение); αἱ πόλεις αἱ ἔρημοι καὶ ἠφανισμέναι καὶ κατεσκαμμέναι — «города опустевшие, истреблённые и раскопанные» (κατασκάπτω); ὀχυραὶ ἐκάθισαν — «укреплёнными сели», т. е. стали обитаемы. Слова людей — вложенная речь 『…』; слав. «забралы утвержденни сташа»."
  36: "ὅσα ἂν καταλειφθῶσιν κύκλῳ ὑμῶν — «сколько ни останется вокруг вас»; ᾠκοδόμησα τὰς καθῃρημένας — «построил разрушенные» (καθαιρέω); κατεφύτευσα τὰς ἠφανισμένας — «насадил истреблённые»; ἐγὼ κύριος ἐλάλησα καὶ ποιήσω — «Я, Господь, сказал и сделаю»."
  37: "Ἔτι τοῦτο ζητηθήσομαι τῷ οἴκῳ Ισραηλ — «ещё этого взыщут у Меня дом Израилев» (passivum); τοῦ ποιῆσαι αὐτοῖς — «чтобы сделать им»; πληθυνῶ αὐτοὺς ὡς πρόβατα ἀνθρώπους — «умножу их как овец, людей». Слав. добавляет в конце «яко овцы святыя» — в LXX эта клауза начинает 38-й стих; повтор не внесён."
  38: "ὡς πρόβατα ἅγια — «как овцы святые»; ὡς πρόβατα Ιερουσαλημ ἐν ταῖς ἑορταῖς αὐτῆς — «как овцы Иерусалима в праздники его»; πλήρεις προβάτων ἀνθρώπων — «полны овец человеческих»; γνώσονται ὅτι ἐγώ εἰμι κύριος — формула; здесь закрывается вторая речь главы."
