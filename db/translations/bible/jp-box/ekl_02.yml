# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 2: опыт веселья и больших дел (1–11), мудрость и участь глупого (12–17),
# ненависть к труду, который останется другому (18–23), благо от руки Божией (24–26).
# Красного и синего нет: речь Екклесиаста от первого лица — без кавычек; его собственные
# слова, приведённые в тексте (1, 2, 15), — в 「…」; чужая речь — 「…」 (в этой главе нет).
