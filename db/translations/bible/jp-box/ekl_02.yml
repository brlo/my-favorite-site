verses:
  1: "わたしは心[こころ]のうちに言[い]った。「さあ、喜[よろこ]びによって自分[じぶん]を試[ため]してみよう。善[よ]いものを見[み]よ」と。すると、見[み]よ、これもまた空[むな]しい。"
  2: "笑[わら]いには「狂[くる]いだ」と言[い]い、喜[よろこ]びには「何[なに]をしているのか」と言[い]った。"
  3: "わたしは心[こころ]のうちで、自分[じぶん]の肉[にく]をぶどう酒[ぶどうしゅ]へと引[ひ]き寄[よ]せることを考[かんが]えた。わたしの心[こころ]は知恵[ちえ]によって導[みちび]かれていた。また、愚[おろ]かさに手[て]を伸[の]ばそうとした。人[ひと]の子[こ]らが日[ひ]の下[もと]で、その命[いのち]の日々[ひび]の数[かず]の間[あいだ]に何[なに]を行[おこな]うのが善[よ]いことなのか、見[み]るまでは。"
  4: "わたしは自分[じぶん]の業[わざ]を大[おお]きくした。家[いえ]を建[た]て、ぶどう畑[ばたけ]を植[う]えた。"
  5: "わたしは園[その]と果樹園[かじゅえん]を造[つく]り、そこにすべての実[み]のなる木[き]を植[う]えた。"
  6: "水[みず]の池[いけ]を造[つく]り、そこから木々[きぎ]の生[は]い茂[しげ]る森[もり]に水[みず]を注[そそ]ごうとした。"
  7: "召使[めしつかい]と女中[じょちゅう]を買[か]い取[と]り、家[いえ]に生[う]まれた者[もの]たちもわたしのものとなった。また、牛[うし]の群[む]れと羊[ひつじ]の群[む]れを、わたしより前[まえ]にエルサレムにいたすべての者[もの]よりも多[おお]く所有[しょゆう]した。"
  8: "銀[ぎん]と金[きん]、また王[おう]たちや諸国[しょこく]の宝[たから]を集[あつ]めた。歌[うた]う男[おとこ]と女[おんな]を、また人[ひと]の子[こ]らの喜[よろこ]びとなるもの、ぶどう酒[ぶどうしゅ]を注[そそ]ぐ者[もの]と女[おんな]たちを、自分[じぶん]のために用意[ようい]した。"
  9: "わたしは大[おお]きくなり、わたしより前[まえ]にエルサレムにいたすべての者[もの]にまさって、さらに増[ふ]えていった。そして、わたしの知恵[ちえ]はわたしにとどまった。"
  10: "わたしの目[め]が求[もと]めたものは何[なに]一つとして取[と]り上[あ]げず、どんな喜[よろこ]びからも心[こころ]を遠[とお]ざけなかった。わたしの心[こころ]はすべての労苦[ろうく]のうちで喜[よろこ]んだからである。これが、わたしのすべての労苦[ろうく]からの受[う]け持[も]ち分[ぶん]となった。"
  11: "わたしは、自分[じぶん]の手[て]が行[おこな]ったすべての業[わざ]と、そのために労苦[ろうく]した労苦[ろうく]とを、見[み]渡[わた]した。すると、見[み]よ、すべては空[むな]しく、風[かぜ]を追[お]うようなものだった。日[ひ]の下[もと]に益[えき]はない。"
  12: "わたしは知恵[ちえ]と狂[くる]いと愚[おろ]かさを見[み]ようとして、目[め]を向[む]けた。というのは、すでに決[けつ]定[てい]されたことの後[あと]に来[く]る者[もの]とは何[なに]者[もの]か。なされたすべてのことを、どうすることができようか。"
  13: "わたしは見[み]た。知恵[ちえ]には愚[おろ]かさにまさる益[えき]があり、それは光[ひかり]が闇[やみ]にまさる益[えき]のようなものである。"
  14: "知恵[ちえ]ある者[もの]の目[め]はその頭[あたま]にあるが、愚[おろ]かな者[もの]は闇[やみ]の中[なか]を歩[あゆ]む。しかし、わたしは知[し]った。同[おな]じ一[ひと]つの成[な]り行[ゆ]きが、すべての者[もの]に訪[おとず]れるということを。"
  15: "わたしは心[こころ]のうちに言[い]った。「愚[おろ]かな者[もの]の成[な]り行[ゆ]きは、わたしにも訪[おとず]れる。それなのに、なぜわたしは知恵[ちえ]を深[ふか]めたのか」と。そこでわたしは、心[こころ]のうちに余[あま]りあることを語[かた]った。愚[おろ]かな者[もの]は余[あま]りから語[かた]るからである。これもまた空[むな]しい。"
  16: "知恵[ちえ]ある者[もの]も愚[おろ]かな者[もの]とともに、永遠[えいえん]に記[き]憶[おく]されることはない。来[く]るべき日々[ひび]が、すべてを忘[わす]れ去[さ]らせるからである。どうして知恵[ちえ]ある者[もの]が、愚[おろ]かな者[もの]とともに死[し]なずにいられようか。"
  17: "わたしは命[いのち]を憎[にく]んだ。日[ひ]の下[もと]でなされる業[わざ]が、わたしには悪[わる]いことのように思[おも]われたからである。すべては空[むな]しく、風[かぜ]を追[お]うようなものだからである。"
  18: "わたしは日[ひ]の下[もと]で労苦[ろうく]するすべての労苦[ろうく]を憎[にく]んだ。それを、わたしの後[あと]に生[う]まれる人[ひと]に残[のこ]さなければならないからである。"
  19: "その者[もの]が知恵[ちえ]ある者[もの]か愚[おろ]かな者[もの]か、だれが知[し]ろうか。その者[もの]は、わたしが日[ひ]の下[もと]で労苦[ろうく]し、知恵[ちえ]を尽[つ]くしたすべての労苦[ろうく]を支配[しはい]するのである。これもまた空[むな]しい。"
  20: "そこでわたしは向[む]きを変[か]え、日[ひ]の下[もと]で労苦[ろうく]したすべての労苦[ろうく]について、心[こころ]に決別[けつべつ]を告[つ]げようとした。"
  21: "知恵[ちえ]と知識[ちしき]と力[ちから]をもって労苦[ろうく]する人[ひと]がいる。しかし、彼[かれ]は、その労苦[ろうく]にあずからなかった人[ひと]に、その受[う]け持[も]ち分[ぶん]を渡[わた]すのである。これもまた空[むな]しく、大[おお]きな悪[わる]である。"
  22: "人[ひと]は、日[ひ]の下[もと]で労苦[ろうく]するすべての労苦[ろうく]と、その心[こころ]の願[ねが]いによって、何[なに]を得[え]るというのか。"
  23: "その日々[ひび]はすべていたみであり、その務[つと]めは苛立[いらだ]ちである。夜[よる]でさえ、その心[こころ]は眠[ねむ]らない。これもまた空[むな]しい。"
  24: "人[ひと]には、食[た]べ、飲[の]み、自分[じぶん]の労苦[ろうく]のうちで善[よ]いものを自分[じぶん]の魂[たましい]に見[み]せることのほかに、善[よ]いことはない。これもまた神[かみ]の御手[みて]から出[で]ることだと、わたしは見[み]た。"
  25: "というのは、だれが神[かみ]なしに食[た]べ、だれが神[かみ]なしに味[あじ]わうことができようか。"
  26: "神[かみ]は、ご自分[じぶん]の御前[みまえ]で善[よ]い人[ひと]に、知恵[ちえ]と知識[ちしき]と喜[よろこ]びを与[あた]えられた。しかし、罪[つみ]を犯[おか]す者[もの]には、集[あつ]めて増[ふ]やし、神[かみ]の御前[みまえ]で善[よ]い人[ひと]に与[あた]えるための務[つと]めを与[あた]えられた。これもまた空[むな]しく、風[かぜ]を追[お]うようなものだからである。"

notes:
  1: "Εἶπον ἐγὼ ἐν καρδίᾳ μου — сказал я в сердце моём. Δεῦρο δή — «ну же, давай». πειράσω σε ἐν εὐφροσύνῃ — испытаю тебя весельем; σε — самого себя (слав. «да тя искушу в веселии»). ἰδὲ ἐν ἀγαθῷ — «посмотри на доброе» (императив). Собственные слова Екклесиаста — в 「…」; остальная его речь без кавычек."
  2: "τῷ γέλωτι εἶπα περιφοράν — смеху сказал я «блуждание» (περιφορά — «кружение, блуждание»; слав. «погрешение»; Синодальный «глупость»). τῇ εὐφροσύνῃ· Τί τοῦτο ποιεῖς; — веселью: «что ты делаешь?»; обращение к смеху и веселью, отсюда 「…」."
  3: "κατεσκεψάμην ἐν καρδίᾳ μου — рассмотрел в сердце моём. τοῦ ἑλκῦσαι εἰς οἶνον τὴν σάρκα μου — «увлечь плоть мою в вино» (ἕλκω — влечь; слав. «аще сердце моё повлечёт аки вино плоть мою»). καρδία μου ὡδήγησεν ἐν σοφίᾳ — сердце моё руководило в мудрости. τοῦ κρατῆσαι ἐπ᾽ ἀφροσύνῃ — «ухватиться за безумие», т. е. испробовать и его; слав. «еже удержати веселие» читает здесь εὐφροσύνη — иной вариант, в перевод не внесён. ἀριθμὸν ἡμερῶν ζωῆς αὐτῶν — число дней жизни их."
  4: "ἐμεγάλυνα ποίημά μου — возвеличил дела мои. ᾠκοδόμησά μοι οἴκους — построил себе дома. ἐφύτευσά μοι ἀμπελῶνας — насадил себе виноградники (ἀμπελών — ぶどう畑)."
  5: "κήπους καὶ παραδείσους — сады и парки (κήπος — сад; παράδεισος — «райский сад»; слав. «вертограды и сады»). ξύλον πᾶν καρποῦ — всякое плодовое дерево."
  6: "κολυμβήθρας ὑδάτων — водоёмы вод (κολυμβήθρα — бассейн, купель; 池). δρυμὸν βλαστῶντα ξύλα — рощу, произращающую деревья (δρυμός — дубрава, лес)."
  7: "ἐκτησάμην δούλους καὶ παιδίσκας — приобрёл рабов и рабынь (δοῦλος — 召使; παιδίσκη — 女中). οἰκογενεῖς — доморождённые. κτῆσις βουκολίου καὶ ποιμνίου — владение стадами крупного и мелкого скота (βουκόλιον — стадо быков; ποίμνιον — овечье стадо)."
  8: "ἀργύριον καὶ χρυσίον — серебро и золото (銀, 金). περιουσιασμοὺς βασιλέων καὶ τῶν χωρῶν — богатства царей и стран. ᾄδοντας καὶ ᾀδούσας — поющих мужчин и женщин. ἐντρυφήματα υἱῶν τοῦ ἀνθρώπου — услады сынов человеческих. οἰνοχόον καὶ οἰνοχόας — виночерпия и виночерпиц (ед. ч. и мн. ч.; возможно, «сосуды для вина», οἰνοχόη)."
  9: "ἐμεγαλύνθην καὶ προσέθηκα παρὰ πάντας — возвеличился и приложился более всех (προστίθημι — прибавлять; слав. «приложихся мудрости» — «мудрости» в греч. нет). σοφία μου ἐστάθη μοι — мудрость моя пребыла со мною (ἵστημι — стоять, пребывать)."
  10: "οὐχ ὑφεῖλον ἀπ᾽ αὐτῶν — не отнял у них (ὑφαιρέω — отнимать). οὐκ ἀπεκώλυσα τὴν καρδίαν μου — не возбранил сердцу моему. μερὶς μου — доля моя (受[う]け持[も]ち分[ぶん])."
  11: "ἐπέβλεψα — воззрел (ἐπιβλέπω — оглядывать). προαίρεσις πνεύματος — здесь «порыв ветра», 風を追う (πνεῦμα — ветер, не дух; ср. 3:21, где πνεῦμα — дух). οὐκ ἔστιν περισσεία — нет прибыли (περισσεία — 益)."
  12: "περιφορὰν καὶ ἀφροσύνην — кружение и безумие (περιφορά, см. 2:2; слав. «лесть»). τίς ὁ ἄνθρωπος, ὃς ἐπελεύσεται ὀπίσω τῆς βουλῆς… — тёмное место: «кто человек, который пойдёт после решения» (βουλή — совет, решение; αὐτήν относится к βουλή). Слова «царь» в греч. нет — оно из масоретского текста. Слав. «кто человек, иже пойдёт вслед совета, елика сотвори в нем»; Синодальный по масоретскому: «что может сделать человек после царя». Передано буквально, без сглаживания."
  13: "περισσεία τῇ σοφίᾳ ὑπὲρ τὴν ἀφροσύνην — преимущество мудрости перед безумием (περισσεία — 益; ср. 2:11). ὡς περισσεία τοῦ φωτὸς ὑπὲρ τὸ σκότος — как преимущество света перед тьмою."
  14: "τοῦ σοφοῦ οἱ ὀφθαλμοὶ αὐτοῦ ἐν κεφαλῇ αὐτοῦ — у мудрого глаза его в голове его (он видит, куда идёт). συνάντημα ἓν — одна участь (συνάντημα — «встреча, случай»; 成[な]り行[ゆ]き, ср. 3:19)."
  15: "Ὡς συνάντημα τοῦ ἄφρονος… — как участь глупого, и меня постигнет. ἵνα τί ἐσοφισάμην; — к чему я стал мудрым? περισσὸν ἐλάλησα — сказал лишнее. ἄφρων ἐκ περισσεύματος λαλεῖ — глупый говорит от избытка."
  16: "οὐκ ἔστιν μνήμη τοῦ σοφοῦ μετὰ τοῦ ἄφρονος εἰς αἰῶνα — нет памяти мудрого вместе с глупым в век. αἱ ἡμέραι αἱ ἐρχόμεναι τὰ πάντα ἐπελήσθη — грядущие дни всё забыли (ἐπιλανθάνομαι). πῶς ἀποθανεῖται ὁ σοφὸς… — как умрёт мудрый с глупым?"
  17: "ἐμίσησα σὺν τὴν ζωήν — возненавидел жизнь. πονηρὸν ἐπ᾽ ἐμὲ τὸ ποίημα — дела стали мне тяжки (πονηρός — «злой, тяжкий»). προαίρεσις πνεύματος — 風を追う (см. 2:11)."
  18: "ἀφίω αὐτόν — оставляю его (ἀφίημι). τῷ ἀνθρώπῳ τῷ γινομένῳ μετ᾽ ἐμέ — человеку, который будет после меня. Слав. «всяческая мира и труд мой»: «мира» в греч. нет — это славянское распространение, в текст не внесено."
  19: "τίς οἶδεν εἰ σοφὸς ἔσται ἢ ἄφρων — кто знает, мудр ли будет или глуп. ἐξουσιάζεται — будет распоряжаться. ᾧ ἐσοφισάμην — которым я показал себя мудрым."
  20: "ἐπέστρεψα τοῦ ἀποτάξασθαι τῇ καρδίᾳ μου — обратился, чтобы распроститься с сердцем моим (ἀποτάσσομαι — прощаться, отрекаться). ἐπὶ παντὶ τῷ μόχθῳ — о всяком труде."
  21: "ἐν σοφίᾳ καὶ ἐν γνώσει καὶ ἐν ἀνδρείᾳ — в мудрости, знании и мужестве (ἀνδρεία — «мужество»; здесь о силе и умении, ср. 4:4). μερὶς αὐτοῦ — доля его. πονηρία μεγάλη — великое зло."
  22: "ἐν προαιρέσει καρδίας αὐτοῦ — в устремлении сердца его; здесь προαίρεσις — «стремление», а не «ветер» (ср. προαίρεσις πνεύματος в 2:11)."
  23: "ἀλγημάτων — страданий (ἄλγημα — боль). θυμοῦ περισπασμὸς αὐτοῦ — занятие его — досада (θυμός; слав. «ярости попечение»; 苛立[いらだ]ち). ἐν νυκτὶ οὐ κοιμᾶται ἡ καρδία αὐτοῦ — и ночью не спит сердце его."
  24: "Οὐκ ἔστιν ἀγαθὸν ἐν ἀνθρώπῳ — нет блага человеку; ὃ φάγεται καὶ ὃ πίεται… ἀγαθὸν ἐν μόχθῳ αὐτοῦ — [кроме] того, что он ест, пьёт и покажет душе своей в труде своём. Слав. вставляет «но (разве)» — пояснение переводчика, в греч. нет; в 〔…〕 не берётся. ἀπὸ χειρὸς τοῦ θεοῦ — от руки Божией."
  25: "τίς φάγεται καὶ τίς φείσεται πάρεξ αὐτοῦ — кто будет есть и кто пощадит (φείδομαι) без Него (αὐτοῦ — Бога, поэтому 神[かみ]). Греч. φείσεται передаёт евр. «вкусит, насладится»; слав. «кто яст и пиет кроме его» (πίεται) — иное чтение; переведено по gr: 味[あじ]わう."
  26: "τῷ ἀνθρώπῳ τῷ ἀγαθῷ πρὸ προσώπου αὐτοῦ — человеку доброму пред лицом Его (Бога). περισπασμὸν τοῦ προσθεῖναι καὶ τοῦ συναγαγεῖν — занятие прибавлять и собирать. προαίρεσις πνεύματος — 風を追う (см. 2:11)."
