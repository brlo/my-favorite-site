# jp-box, Наум, глава 2. Черновик для приёмки.
#
# Нумерация — по славяно-синодальной. Карта границы глав 1/2:
# наш 1:15 = gr 2:1 (ноги благовестника, «празднуй, Иуда»); наш 2:1–13 = gr 2:2–2:14.
# То есть гр. глава 2 начинается на стих раньше слав., а заканчивается на стих позже:
# gr 2:14 («вот, Я — на тебя») — это слав. 2:13. Всего в книге 47 стихов.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1–2 (= gr 2:2–3) осадный вал, Господь возвращает славу Иакову;
# 3–5 (= gr 2:4–6) колесницы, кони, знатные бегут; 6–8 (= gr 2:7–9) речные ворота,
# дворец падает, Ниневия как пруд, пленение; 9–10 (= gr 2:10–11) разграбление,
# ужас; 11–12 (= gr 2:12–13) где логовище львов; 13 (= gr 2:14) «вот, Я — на тебя».
# Голоса: 1–12 — речь пророка; в 13 — формула «говорит Господь Вседержитель» внутри
# слова Господа (παντοκράτωρ — 全能者).
# 2:6: LXX πύλαι τῶν ποταμῶν — «речные ворота»; слав. «врата градная» — «городские
# ворота». По паритету взято слав.; вариант LXX в notes. МТ здесь «ворота рек».
# 2:7: слав. «сия» (αὕτη) — о Ниневии; «рабыни» = 侍女.
# 2:13: слав. «дела твоя», LXX τὰ ἔργα σου — «дела/деяния»; в ru «голос послов
# твоих» — по МТ, не внесено.
#
tr_code: jp-box
book: naum
chapter: 2
draft: true

verses:
  1: "あなたの顔[かお]に息[いき]を吹[ふ]きかける者[もの]が上[のぼ]って来[き]た。苦[くる]しみのうちから取[と]り去[さ]る者[もの]である。道[みち]を見張[みは]れ、腰[こし]を強[つよ]くせよ、力[ちから]を尽[つ]くして雄々[おお]しくあれ。"
  2: "主[しゅ]はヤコブの辱[はずかし]めを、イスラエルの辱[はずかし]めと同[おな]じように返[かえ]されたからである。荒[あ]らす者[もの]たちが彼らを荒[あ]らし、その枝[えだ]を腐[くさ]らせたからである。"
  3: "彼らの力[ちから]の武具[ぶぐ]は人[ひと]から出[で]たものであり、勇[いさ]ましい者[もの]たちは火[ひ]の中[なか]で戯[たわむ]れる。彼の備[そな]えの日[ひ]には戦車[せんしゃ]の手綱[たづな]が置[お]かれ、騎兵[きへい]たちは道[みち]の上[うえ]で騒[さわ]ぎ立[た]つ。"
  4: "戦車[せんしゃ]は入[い]り乱[みだ]れ、広[ひろ]場[ば]で絡[から]み合[あ]う。その姿[すがた]は火[ひ]の炎[ほのお]のよう、走[はし]り過[す]ぎる稲妻[いなずま]のようである。"
  5: "彼の貴人[きじん]たちは思[おも]い起[おこ]され、昼[ひる]のうちに逃[に]げ、その道[みち]で弱[よわ]り果[は]て、彼の城壁[じょうへき]に急[いそ]ぎ上[のぼ]り、自分[じぶん]たちの見張[みは]りを備[そな]える。"
  6: "都[みやこ]の門[もん]は開[ひら]かれ、王国[おうこく]は倒[たお]れ、財宝[ざいほう]はあらわになる。"
  7: "彼女[かのじょ]は上[のぼ]って行[い]き、その侍女[じじょ]たちは鳩[はと]のように心[こころ]のうちで鳴[な]きながら連[つ]れて行[い]かれる。"
  8: "ニネベはその水[みず]の池[いけ]のようであった。人[ひと]々[びと]は逃[に]げて立[た]ち止[と]まらず、だれも振[ふ]り向[む]く者[もの]はなかった。"
  9: "銀[ぎん]を奪[うば]え、金[きん]を奪[うば]え。彼女[かのじょ]の財[ざい]には限[かぎ]りがない。すべての望[のぞ]ましい器[うつわ]は重[おも]く積[つ]まれている。"
  10: "打[う]ち払[はら]い、振[ふ]るい落[お]とし、沸[わ]き立[た]ち、心[こころ]は砕[くだ]け、膝[ひざ]はよろめき、すべての腰[こし]に苦[くる]しみがあり、すべての顔[かお]はかまどの焦[こ]げたようになる。"
  11: "獅子[しし]の住[す]みか、若[わか]い獅子[しし]の牧[まき]場[ば]はどこにあるのか。雄[おす]獅子[しし]が行[い]き、雌[めす]獅子[しし]と若[わか]い獅子[しし]がそこに住[す]み、だれも脅[おど]かす者[もの]はいなかった。"
  12: "獅子[しし]はその子[こ]どもに足[た]りるほど捕[と]らえ、雌[めす]獅子[しし]のために絞[し]め殺[ころ]し、その洞穴[ほらあな]を獲物[えもの]で満[み]たし、その住[す]みかを奪[うば]った物[もの]で満[み]たした。"
  13: "見[み]よ、わたしはあなたに向[む]かう、と全能者[ぜんのうしゃ]である主[しゅ]は言[い]われる。「わたしは煙[けむり]のうちにあなたの多[おお]くの者[もの]を焼[や]き、あなたの獅子[しし]たちを剣[つるぎ]が食[く]らう。わたしは地[ち]からあなたの獲物[えもの]を断[た]ち、あなたの仕業[しわざ]はもはや聞[き]かれなくなる」。"

notes:
  1: "Это gr 2:2. ἀνέβη ἐμφυσῶν εἰς πρόσωπόν σου — «поднялся, дыша в лицо твоё» (ἐμφυσάω — дуть, 息を吹きかける); ἐξαιρούμενος ἐκ θλίψεως — «избавляющий от скорби» (ἐξαιρέω — изымать, 取り去る; тёмное: кто именно — слав. «отемляй от оскорбления»); σκόπευσον ὁδόν — «усмотри путь» (σκοπεύω — наблюдать, 見張る); κράτησον ὀσφύος — «укрепи чресла» (ὀσφύς — чресла, 腰); ἄνδρισαι τῇ ἰσχύι σφόδρα — «возмужай крепостью весьма»."
  2: "Это gr 2:3. ἀπέστρεψεν κύριος τὴν ὕβριν Ιακωβ — «отвратил Господь уничижение Иакова» (ὕβρις — надменность/обида, 辱め); καθὼς ὕβριν τοῦ Ισραηλ — «как уничижение Израиля»; ἐκτινάσσοντες ἐξετίναξαν αὐτούς — «потрясая, потрясли их» (ἐκτινάσσω — вытрясать, 荒らす); τὰ κλήματα αὐτῶν διέφθειραν — «ветви их повредили» (κλῆμα — ветвь, 枝)."
  3: "Это gr 2:4 (+ начало gr 2:5, «на путях» — слав. включает «на путех» в этот стих). ὅπλα δυναστείας αὐτῶν ἐξ ἀνθρώπων — «оружие силы их от людей»; ἄνδρας δυνατοὺς ἐμπαίζοντας ἐν πυρί — «мужей сильных, играющих в огне» (ἐμπαίζω — играть, 戯れる); αἱ ἡνίαι τῶν ἁρμάτων — «вожжи колесниц» (ἡνία — вожжи, 手綱); οἱ ἱππεῖς θορυβηθήσονται — «всадники встревожатся» (θορυβέω — шуметь, 騒ぎ立つ)."
  4: "Это gr 2:5. συγχυθήσονται τὰ ἅρματα — «смешаются колесницы» (συγχέω — смешивать, 入り乱れる); συμπλακήσονται ἐν ταῖς πλατείαις — «сплетутся на площадях» (πλατεῖα — широкая улица, 広場); ἡ ὅρασις αὐτῶν ὡς λαμπάδες πυρός — «вид их как огненные светильни» (λαμπάς — светильня, 炎); ὡς ἀστραπαὶ διατρέχουσαι — «как молнии пробегающие»."
  5: "Это gr 2:6. μνησθήσονται οἱ μεγιστᾶνες αὐτῶν — «вспомянутся вельможи их» (μεγιστάν — вельможа, 貴人); φεύξονται ἡμέρας — «побегут днём»; ἀσθενήσουσιν ἐν τῇ πορείᾳ αὐτῶν — «изнемогут в пути своём»; σπεύσουσιν ἐπὶ τὰ τείχη — «поспешат на стены»; ἑτοιμάσουσιν τὰς προφυλακὰς αὐτῶν — «приготовят предостережения (стражи) свои» (προφυλακή — стража, 見張り)."
  6: "Это gr 2:7 + начало gr 2:8 («открылось имение»). πύλαι τῶν ποταμῶν διηνοίχθησαν — «ворота рек открылись» (LXX); слав. «врата градная отверзошася» — «городские ворота»; по паритету взято слав., вариант LXX в notes. τὰ βασίλεια διέπεσεν — «царский дворец пал» (βασίλεια — дворец, 王宮/王国); ἡ ὑπόστασις ἀπεκαλύφθη — «имущество открылось» (ὑπόστασις — состояние, 財宝)."
  7: "Это gr 2:8 (вторая половина). αὕτη ἀνέβαινεν — «она поднималась» (о Ниневии); αἱ δοῦλαι αὐτῆς ἤγοντο — «рабыни её велись» (ἄγω — вести, 連れて行かれる); καθὼς περιστεραὶ φθεγγόμεναι ἐν καρδίαις αὐτῶν — «как голуби, воркующие в сердцах своих» (φθέγγομαι — издавать голос, 鳴く; περιστερά — 鳩)."
  8: "Это gr 2:9. καὶ Νινευη, ὡς κολυμβήθρα ὕδατος τὰ ὕδατα αὐτῆς — «и Ниневия, как водоём вод её» (κολυμβήθρα — купальня/водоём, 池); αὐτοὶ φεύγοντες οὐκ ἔστησαν — «они, убегая, не остановились»; οὐκ ἦν ὁ ἐπιβλέπων — «не было взирающего» (ἐπιβλέπω — оглядываться, 振り向く)."
  9: "Это gr 2:10. διήρπαζον τὸ ἀργύριον — «расхищали серебро» (διαρπάζω — расхищать, 奪う); οὐκ ἦν πέρας τοῦ κόσμου αὐτῆς — «не было конца украшению (богатству) её» (κόσμος — убранство, 財; слав. «имение»); βεβάρυνται ὑπὲρ πάντα τὰ σκεύη τὰ ἐπιθυμητά — «отяготились паче всех сосудов вожделенных»."
  10: "Это gr 2:11. ἐκτιναγμὸς καὶ ἀνατιναγμὸς καὶ ἐκβρασμὸς — «потрясение и вытрясение и вскипание» (ряд созвучий на ἐκ-; 打ち払い、振るい落とし、沸き立ち); καρδίας θραυσμός — «сокрушение сердца» (θραυσμός — раздробление, 砕け); ὑπόλυσις γονάτων — «расслабление колен» (γόνυ — колено, 膝); ὠδῖνες ἐπὶ πᾶσαν ὀσφύν — «боли на всякую поясницу»; τὸ πρόσωπον πάντων ὡς πρόσκαυμα χύτρας — «лицо всех как обожжённое горшком» (χύτρα — горшок, かまど)."
  11: "Это gr 2:12. ποῦ ἐστιν τὸ κατοικητήριον τῶν λεόντων — «где жилище львов» (κατοικητήριον — жилище, 住みか; λέων — 獅子); ἡ νομὴ ἡ οὖσα τοῖς σκύμνοις — «пажить, что у львят» (σκύμνος — львёнок, 若い獅子); οὗ ἐπορεύθη λέων… σκύμνος λέοντος — «куда ходил лев… львёнок льва»; οὐκ ἦν ὁ ἐκφοβῶν — «не было устрашающего» (ἐκφοβέω — пугать, 脅かす)."
  12: "Это gr 2:13. λέων ἥρπασεν τὰ ἱκανὰ τοῖς σκύμνοις αὐτοῦ — «лев похитил довольное для львят своих» (ἁρπάζω — похищать, 捕らえる); ἀπέπνιξεν τοῖς λέουσιν αὐτοῦ — «удушил для львиц своих» (ἀποπνίγω — душить, 絞め殺す); ἔπλησεν θήρας νοσσιὰν αὐτοῦ — «наполнил добычи гнездо своё» (θήρα — добыча, 獲物; νοσσιά — гнездо, 洞穴); τὸ κατοικητήριον αὐτοῦ ἁρπαγῆς — «жилище своё — похищения»."
  13: "Это gr 2:14 (слав. 2:13). ἰδοὺ ἐγὼ ἐπὶ σέ, λέγει κύριος παντοκράτωρ — «вот, Я — на тебя, говорит Господь Вседержитель» (παντοκράτωρ — 全能者); ἐκκαύσω ἐν καπνῷ πλῆθός σου — «зажгу в дыму множество твоё» (ἐκκαίω — зажигать, 焼く); τοὺς λέοντάς σου καταφάγεται ῥομφαία — «львов твоих поест меч»; ἐξολεθρεύσω ἐκ τῆς γῆς τὴν θήραν σου — «истреблю с земли добычу твою»; οὐ μὴ ἀκουσθῇ οὐκέτι τὰ ἔργα σου — «не будет более слышно дел твоих» (в ru «голос послов твоих» — по МТ, не внесено)."
