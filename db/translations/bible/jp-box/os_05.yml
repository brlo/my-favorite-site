# jp-box, Осия, глава 5. Черновик для приёмки.
#
# Нумерация — по славяно-синодальной (решение автора): главы 1–2 и 11–12
# переразбиты относительно гр. модуля (слав. 1:10–11 = прежние 2:1–2;
# слав. 11:12 = прежний 12:1). Текст — с Септуагинты, слав. контроль.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# --- прежние заметки (нумерация по гр.) ---
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по gr-lxx-byz (= jp-ni); в этой главе совпадает со славяно-синодальной.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: 1–2 обвинение священников, дома Израиля и дома царя: они сеть и петля;
# 3–5 Господь знает Ефрема, дух блуда, падение Израиля, Ефрема и Иуды; 6–7 искать
# Господа с овцами и тельцами и не найти, чужие дети, ржа; 8–9 труба в Гиве и доме Он,
# Ефрем в опустошение; 10–12 князья Иуды двигают межи, Ефрем притесняет, Господь
# как смятение и жало; 13–14 Ефрем идёт к Ассирии, царь Ярим не исцелит; Господь
# как пантера и лев; 15 уход до обращения и утреннего взыскания (переход к 6:1).
# Голоса: 1–15 — слово Господа в 「…」 (в 15 «говоря» вводит речь народа, она — 6:1–3).
# 5:1: LXX Ἰταβύριον — Фавор (タボル), оставлена транслитерация LXX.
#
tr_code: jp-box
book: os
chapter: 5
draft: true

verses:
  1: "「祭司[さいし]たちよ、これを聞[き]け。イスラエルの家[いえ]よ、心[こころ]を留[と]めよ。王[おう]の家[いえ]よ、耳[みみ]を傾[かたむ]けよ。裁[さば]きはあなたがたに及[およ]ぶ。あなたがたは見張[みは]り所[じょ]の罠[わな]となり、イタビュリオンの上[うえ]に張[は]られた網[あみ]となったからである。"
  2: "これを捕[つか]まえる者[もの]たちが仕掛[しか]けたのである。しかし、わたしはあなたがたを懲[こら]しめる者[もの]である。"
  3: "わたしはエフライムを知[し]っている。イスラエルはわたしから隠[かく]れていない。エフライムは今[いま]、淫行[いんこう]をし、イスラエルは汚[けが]れたからである。"
  4: "彼らは思[おも]いを向[む]けて自分[じぶん]の神[かみ]に帰[かえ]ろうとしない。淫行[いんこう]の霊[れい]が彼らの中[なか]にあり、彼らは主[しゅ]を知[し]らないからである。"
  5: "イスラエルの傲[おご]りはその面前[めんぜん]で低[ひく]くされる。イスラエルとエフライムは自分[じぶん]の不法[ふほう]によって力[ちから]を失[うしな]い、ユダも彼らと共[とも]に力[ちから]を失[うしな]う。"
  6: "彼らは羊[ひつじ]や子牛[こうし]を連[つ]れて主[しゅ]を求[もと]めに行[い]くが、見[み]つけることはできない。主[しゅ]は彼らから離[はな]れたからである。"
  7: "彼らは主[しゅ]を捨[す]て、自分[じぶん]たちにほかの者[もの]の子[こ]どもが生[う]まれたからである。今[いま]、さび病[びょう]が彼らとその嗣業[しぎょう]を食[く]い尽[つ]くす。"
  8: "丘[おか]の上[うえ]でラッパを吹[ふ]け。高[たか]い所[ところ]で声[こえ]を響[ひび]かせ。オンの家[いえ]で告[つ]げ知[し]らせよ。ベニヤミンは恐[おそ]れおののく。"
  9: "エフライムは懲[こら]しめの日[ひ]に滅[ほろ]びに至[いた]る。イスラエルの部族[ぶぞく]の中[なか]で、わたしは確[たし]かなことを示[しめ]した。"
  10: "ユダの君[きみ]たちは境[さかい]を移[うつ]す者[もの]のようになった。わたしは彼らの上[うえ]に、水[みず]のようにわたしの激[はげ]しさを注[そそ]ぐ。"
  11: "エフライムは自分[じぶん]の敵[てき]を虐[しいた]げ、裁[さば]きを踏[ふ]みにじった。むなしいものの後[あと]を歩[あゆ]み始[はじ]めたからである。"
  12: "わたしはエフライムには混乱[こんらん]、ユダの家[いえ]には突[つ]き棒[ぼう]となる。"
  13: "エフライムは自分[じぶん]の病[やまい]を、ユダは自分[じぶん]の痛[いた]みを見[み]た。エフライムはアッシリアへ行[い]き、王[おう]ヤリムに使者[ししゃ]を送[おく]った。しかし、彼はあなたがたを癒[いや]すことができず、あなたがたの痛[いた]みを止[と]めることもできない。"
  14: "わたしはエフライムにとって豹[ひょう]のように、ユダの家[いえ]にとって獅子[しし]のようである。わたしは引[ひ]き裂[さ]いて行[い]き、奪[うば]い去[さ]る。だれも救[すく]い出[だ]す者[もの]はいない。"
  15: "わたしは行[い]って、彼らが滅[ほろ]びるまで、わたしの場所[ばしょ]に帰[かえ]る。彼らはわたしの顔[かお]を求[もと]め、苦[くる]しみの中[なか]で朝[あさ]早[はや]くわたしに来[き]て言[い]う」。"

notes:
  1: "Ἀκούσατε ταῦτα, οἱ ἱερεῖς — «слушайте это, священники»; ὁ οἶκος τοῦ βασιλέως, ἐνωτίζεσθε — «дом царя, внимайте» (ἐνωτίζομαι — внимать, 耳を傾ける); πρὸς ὑμᾶς ἐστιν τὸ κρίμα — «на вас (к вам) суд»; παγὶς ἐγενήθητε τῇ σκοπιᾷ — «вы стали петлёй на страже» (σκοπιά — сторожевой пост, 見張り所; ru «в Массифе»); ὡς δίκτυον ἐκτεταμένον ἐπὶ τὸ Ἰταβύριον — «как сеть, растянутая на Фаворе» (LXX Ἰταβύριον — транслитерация, евр. Фавор)."
  2: "ὃ οἱ ἀγρεύοντες τὴν θήραν κατέπηξαν — «которую расставили ловящие лов» (ἀγρεύω — ловить; πήγνυμι — втыкать, ставить); ἐγὼ δὲ παιδευτὴς ὑμῶν — «Я же наставник (наказывающий) ваш» (παιδευτής; слав. «аз же наказатель вам»)."
  3: "ἐγὼ ἔγνων τὸν Εφραιμ — «Я знаю Ефрема»; Ισραηλ οὐκ ἄπεστιν ἀπ᾿ ἐμοῦ — «Израиль не отступил (не скрыт) от Меня» (ἄπειμι); ἐξεπόρνευσεν Εφραιμ — «блудил Ефрем»; ἐμιάνθη Ισραηλ — «осквернился Израиль» (μιαίνω)."
  4: "οὐκ ἔδωκαν τὰ διαβούλια αὐτῶν τοῦ ἐπιστρέψαι — «не дали (не положили) помышлений своих, чтобы обратиться» (слав. «не положиша помышлений своих»); πνεῦμα πορνείας ἐν αὐτοῖς — «дух блуда в них»; τὸν κύριον οὐκ ἐπέγνωσαν — «Господа не познали»."
  5: "ταπεινωθήσεται ἡ ὕβρις τοῦ Ισραηλ εἰς πρόσωπον αὐτοῦ — «смирится гордыня Израиля в лице его» (ὕβρις — гордыня, наглость, 傲り); ἀσθενήσουσιν ἐν ταῖς ἀδικίαις αὐτῶν — «изнемогут в беззакониях своих»; ἀσθενήσει καὶ Ιουδας μετ᾿ αὐτῶν — «изнеможет и Иуда с ними»."
  6: "μετὰ προβάτων καὶ μόσχων πορεύσονται — «с овцами и тельцами пойдут»; τοῦ ἐκζητῆσαι τὸν κύριον — «чтобы взыскать Господа»; οὐ μὴ εὕρωσιν αὐτόν — «не найдут Его»; ἐξέκλινεν ἀπ᾿ αὐτῶν — «уклонился от них» (ἐκκλίνω)."
  7: "τὸν κύριον ἐγκατέλιπον — «Господа оставили»; τέκνα ἀλλότρια ἐγεννήθησαν αὐτοῖς — «чужие дети родились у них» (ἀλλότριος — чужой); νῦν καταφάγεται αὐτοὺς ἡ ἐρυσίβη — «ныне съест их ржа (головня)» (ἐρυσίβη — болезнь хлеба, さび病; в евр. «новомесяц»); καὶ τοὺς κλήρους αὐτῶν — «и участки (наследия) их» (κλῆρος)."
  8: "Σαλπίσατε σάλπιγγι ἐπὶ τοὺς βουνούς — «трубите трубою на холмах» (σάλπιγξ — труба, ラッパ); ἠχήσατε ἐπὶ τῶν ὑψηλῶν — «дайте звук на высотах» (ἠχέω — звучать); κηρύξατε ἐν τῷ οἴκῳ Ων — «проповедуйте в доме Он» (= Вефиль); ἐξέστη Βενιαμιν — «ужаснулся Вениамин» (ἐξίστημι)."
  9: "Εφραιμ εἰς ἀφανισμὸν ἐγένετο ἐν ἡμέραις ἐλέγχου — «Ефрем стал в опустошение в дни обличения» (ἀφανισμός — истребление; ἔλεγχος — обличение); ἐν ταῖς φυλαῖς τοῦ Ισραηλ ἔδειξα πιστά — «в коленах Израилевых показал Я верное» (πιστά — верное, непреложное; слав. «показах верная»)."
  10: "ἐγένοντο οἱ ἄρχοντες Ιουδα ὡς μετατιθέντες ὅρια — «стали князья Иудины как передвигающие межи» (μετατίθημι — переставлять; ὅριον — межа, 境); ἐπ᾿ αὐτοὺς ἐκχεῶ ὡς ὕδωρ τὸ ὅρμημά μου — «на них изолью, как воду, ярость Мою» (ὅρμημα — порыв, ярость; слав. «гнев мой»)."
  11: "κατεδυνάστευσεν Εφραιμ τὸν ἀντίδικον αὐτοῦ — «притеснил (одолел) Ефрем соперника своего» (καταδυναστεύω — притеснять; слав. «соодоле»); κατεπάτησεν κρίμα — «попрал суд» (καταπατέω); ἤρξατο πορεύεσθαι ὀπίσω τῶν ματαίων — «начал ходить вслед суетных» (μάταιος — пустой, суетный)."
  12: "ὡς ταραχὴ τῷ Εφραιμ — «как смятение Ефрему» (ταραχή — потрясение, 混乱; в евр. «моль»); ὡς κέντρον τῷ οἴκῳ Ιουδα — «и как жало дому Иудину» (κέντρον — жало, стрекало; слав. «остен»; в евр. «червь»)."
  13: "εἶδεν Εφραιμ τὴν νόσον αὐτοῦ — «увидел Ефрем болезнь свою»; Ιουδας τὴν ὀδύνην αὐτοῦ — «и Иуда боль свою» (ὀδύνη); ἐπορεύθη Εφραιμ πρὸς Ασσυρίους — «пошёл Ефрем к Ассирийцам»; ἀπέστειλεν πρέσβεις πρὸς βασιλέα Ιαριμ — «послал послов к царю Яриму» (LXX Ιαριμ, евр. Ярев; отождествление неизвестно); οὐκ ἠδυνάσθη ἰάσασθαι ὑμᾶς — «не смог исцелить вас»; οὐ μὴ διαπαύσῃ ἐξ ὑμῶν ὀδύνη — «не прекратится у вас боль»."
  14: "ὡς πανθὴρ τῷ Εφραιμ — «как пантера (барс) Ефрему» (πάνθηρ — 豹); ὡς λέων τῷ οἴκῳ Ιουδα — «и как лев дому Иудину»; ἁρπῶμαι καὶ πορεύσομαι καὶ λήμψομαι — «похищу и пойду и возьму» (ἁρπάζω — хватать, терзать); οὐκ ἔσται ὁ ἐξαιρούμενος — «не будет избавляющего» (ἐξαιρέω)."
  15: "πορεύσομαι καὶ ἐπιστρέψω εἰς τὸν τόπον μου — «пойду и возвращусь на место Моё»; ἕως οὗ ἀφανισθῶσιν — «доколе они не исчезнут» (ἀφανίζω — истреблять; слав. «дондеже погибнут»); ἐπιζητήσουσιν τὸ πρόσωπόν μου — «взыщут лицо Моё»; ἐν θλίψει αὐτῶν ὀρθριοῦσι πρός με — «в скорби своей будут утренневать ко Мне» (ὀρθρίζω — вставать рано, 朝早く来る); λέγοντες — «говоря»: речь продолжается в 6:1–3."
