# jp-box, Иов, глава 3. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для Иова есть только в главах 1–2; в главе 3 его нет.
# jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 3: 3:1–2 повествование (Иов открывает уста и проклинает день), 3:2–26 речь
# Иова — одна цитата (открывается в конце 3:2): проклятие дня рождения (3–10), желание смерти и покоя (11–19),
# вопрос о свете и жизни (20–26). Поэзия с параллелизмами, не сглажена.
# Голоса: 3:1–2 повествование; 3:2–26 Иов — 「…」 (открывается в конце 3:2,
# закрывается в конце 3:26); внутри 3:3 слова о рождении — 『…』.
# Нумерация по gr: 26 стихов. Слав. сдвиг внутри стихов: csl 3:1 включает «и прокля
# день свой» (gr 3:2a), csl 3:2 = gr 3:2b («глаголя»); csl 3:5 включает начало gr 3:6
# («проклят буди день той»), csl 3:6 = gr 3:6b. Держимся gr.
# csl-добавление 3:23 «егоже путь сокровен есть» внесено в основной текст без скобок;
# в notes отмечено «нет в LXX».
# 〔…〕 нет: все 26 стихов есть в gr-lxx-byz. Сносок ⟨…⟩ нет: 胎, よみ, 海獣, 徴税人
# уже в корпусе или объяснены в notes.

tr_code: jp-box
book: iov
chapter: 3
draft: true

verses:
  1: "その後[のち]、ヨブは口[くち]を開[ひら]いた。"
  2: "そして、自分[じぶん]の日[ひ]を呪[のろ]って言[い]った。「"
  3: "わたしが生[う]まれた日[ひ]は滅[ほろ]びよ。『見[み]よ、男[おとこ]の子[こ]だ』と言[い]われた夜[よる]も。"
  4: "その日[ひ]は闇[やみ]となれ。主[しゅ]は上[うえ]からその日[ひ]を求[もと]めないように。光[ひかり]もその上[うえ]に来[こ]ないように。"
  5: "闇[やみ]と死[し]の影[かげ]がその日[ひ]を取[と]り囲[かこ]み、雲[くも]がその上[うえ]に覆[おお]いかかるように。"
  6: "その日[ひ]とその夜[よる]は呪[のろ]われよ。闇[やみ]がそれらを運[はこ]び去[さ]るように。年[とし]の日々[ひび]のうちに数[かぞ]えられず、月[つき]の日々[ひび]のうちに数[かぞ]えられないように。"
  7: "見[み]よ、その夜[よる]は苦[くる]しみの夜[よる]となれ。喜[よろこ]びも歓[よろこ]びもその上[うえ]に来[こ]ないように。"
  8: "その日[ひ]を呪[のろ]う者[もの]たちが、その夜[よる]を呪[のろ]うように。大[おお]いなる海獣[かいじゅう]を打[う]ち負[ま]かそうとする者[もの]が。"
  9: "その夜[よる]の星[ほし]たちは暗[くら]くなるように。その夜[よる]は光[ひかり]を待[ま]ちながら、ついに光[ひかり]が来[こ]ず、明[あ]けの明星[みょうじょう]が昇[のぼ]るのを見[み]ないように。"
  10: "なぜなら、その夜[よる]は、わたしの母[はは]の胎[たい]の戸[と]を閉[と]ざさなかったからだ。そうすれば、わたしの目[め]から苦[くる]しみは取[と]り去[さ]られていたのに。"
  11: "なぜ、わたしは胎[たい]の中で死[し]なず、腹[はら]から出[で]るとすぐに滅[ほろ]びなかったのか。"
  12: "なぜ、膝[ひざ]がわたしを迎[むか]えたのか。なぜ、わたしは乳房[ちぶさ]を吸[す]ったのか。"
  13: "そうでなければ、わたしは今[いま]、横[よこ]たわって静[しず]かに眠[ねむ]り、眠[ねむ]って休[やす]んでいただろう。"
  14: "地[ち]の王[おう]たち、その顧問[こもん]たちとともに。彼[かれ]らは剣[つるぎ]を誇[ほこ]っていた。"
  15: "または、金[きん]を多[おお]く持[も]ち、銀[ぎん]を家[いえ]に満[み]たした君[きみ]たちとともに。"
  16: "または、母[はは]の胎[たい]から出[で]てくる流産[りゅうざん]の子[こ]のように、光[ひかり]を見[み]なかった幼[おさな]い子[こ]たちのようであったろう。"
  17: "そこでは、不敬[ふけい]な者[もの]たちも怒[いか]りの炎[ほのお]を消[け]した。そこでは、体[からだ]の疲[つか]れ果[は]てた者[もの]たちが休[やす]んでいる。"
  18: "そこでは、とこしえの者[もの]たちも共[とも]に、徴税人[ちょうぜいにん]の声[こえ]を聞[き]かない。"
  19: "そこでは、小[ちい]さな者[もの]も大[おお]きな者[もの]も同[おな]じであり、僕[しもべ]も自分[じぶん]の主人[しゅじん]を恐[おそ]れない。"
  20: "なぜ、苦[くる]しみの中[なか]にある者[もの]に光[ひかり]が与[あた]えられ、苦[くる]しむ魂[たましい]に命[いのち]が与[あた]えられるのか。"
  21: "彼[かれ]らは死[し]を慕[した]い求[もと]めるが、得[え]られず、宝[たから]を掘[ほ]り当[あ]てるように、それを掘[ほ]り求[もと]める。"
  22: "彼[かれ]らは、それを得[え]たならば、大[おお]いに喜[よろこ]び、喜[よろこ]びに躍[おど]るだろう。"
  23: "死[し]はその人[ひと]にとって憩[いこ]いである。彼[かれ]の道[みち]は隠[かく]され、神[かみ]が彼[かれ]の周[まわ]りを閉[と]ざされたからである。"
  24: "わたしの食[た]べ物[もの]の前[まえ]に、すでに嘆[なげ]きがわたしに来[き]る。わたしは恐[おそ]れに捕[と]らわれて涙[なみだ]を流[なが]す。"
  25: "わたしが恐[おそ]れていたものはわたしに臨[のぞ]み、わたしが怖[こわ]がっていたものはわたしに会[あ]った。"
  26: "わたしは平和[へいわ]を得[え]ず、静[しず]まることも、憩[いこ]うこともなかった。怒[いか]りがわたしに臨[のぞ]んだからである。」"

notes:
  1: "Повествование. Μετὰ τοῦτο ἤνοιξεν Ιωβ τὸ στόμα αὐτοῦ — «после того открыл Иов уста свои». В LXX только это; «и проклял день свой» стоит в 3:2 (κατηράσατο). csl 3:1 включает и «прокля день свой» — сдвиг внутри стихов, держимся gr."
  2: "Повествование. καὶ κατηράσατο τὴν ἡμέραν αὐτοῦ λέγων — «и проклял день свой, говоря» (καταράομαι — проклинать). В конце стиха открывается речь Иова (「…」 до конца главы); в LXX 3:2 — вводная формула, содержание речи начинается с 3:3."
  3: "Иов — 「…」, речь до конца главы. Ἀπόλοιτο ἡ ἡμέρα, ἐν ᾗ ἐγεννήθην — «да погибнет день, в который я родился» (ἀπόλοιτο — оптатив). ἡ νύξ, ἐν ᾗ εἶπαν Ἰδοῦ ἄρσεν — «и ночь, в которую сказали: вот, мужской пол»; слова о рождении — 『…』 как вложенная речь."
  4: "Иов. ἡ ἡμέρα ἐκείνη εἴη σκότος — «день тот да будет тьмою». μὴ ἀναζητήσαι αὐτὴν ὁ κύριος ἄνωθεν — «да не взыщет его Господь свыше» (ἀναζητέω — искать, требовать). μηδὲ ἔλθοι εἰς αὐτὴν φέγγος — «и да не придёт на него свет». csl читает «та нощь» (ночь), LXX — ἡμέρα (день); по смыслу и LXX в тексте 日."
  5: "Иов. ἐκλάβοι … σκότος καὶ σκιὰ θανάτου — «да охватит его тьма и тень смертная» (ἐκλαμβάνω — захватывать); ἐπέλθοι ἐπ᾽ αὐτὴν γνόφος — «да найдёт на него мрак» (γνόφος). csl в конце 3:5 добавляет «проклят буди день той» — это начало gr 3:6, деление иное."
  6: "Иов. καταραθείη ἡ ἡμέρα καὶ ἡ νὺξ ἐκείνη — «да будет проклят день тот и ночь та». ἀπενέγκαιτο αὐτὴν σκότος — «да унесёт их тьма» (ἀποφέρω). μὴ εἴη εἰς ἡμέρας ἐνιαυτοῦ — «да не будет в днях года»; μηδὲ ἀριθμηθείη εἰς ἡμέρας μηνῶν — «и да не будет сочтён в днях месяцев»."
  7: "Иов. ἡ νὺξ ἐκεῖνη εἴη ὀδύνη — «ночь та да будет страданием, болью» (ὀδύνη); в евр. «бесплодна», LXX иначе. μὴ ἔλθοι ἐπ᾽ αὐτὴν εὐφροσύνη μηδὲ χαρμονή — «да не придёт на неё веселие и радость»."
  8: "Иов. ὁ καταρώμενος τὴν ἡμέραν ἐκείνην — «проклинающий день тот», т. е. знатоки проклятий. ὁ μέλλων τὸ μέγα κῆτος χειρώσασθαι — «тот, кто собирается одолеть великого кита» (κῆτος — морское чудовище; χειρόομαι — подчинять); ср. Левиафан в 40–41. csl: «великаго кита»."
  9: "Иов. σκοτωθείη τὰ ἄστρα τῆς νυκτὸς ἐκείνης — «да померкнут звёзды ночи той» (σκοτόω — затемнять). ὑπομείναι καὶ εἰς φωτισμὸν μὴ ἔλθοι — «да ждёт и на свет да не придёт». μὴ ἴδοι ἑωσφόρον ἀνατέλλοντα — «да не увидит денницы восходящей» (ἑωσφόρος — утренняя звезда)."
  10: "Иов. οὐ συνέκλεισεν πύλας γαστρὸς μητρός μου — «не затворила врат чрева матери моей» (подлежащее — ночь). ἀπήλλαξεν γὰρ ἂν πόνον ἀπὸ ὀφθαλμῶν μου — «ибо отняла бы боль от очей моих» (ἀπαλλάσσω — удалять); аподосис без главного предложения, как в греч."
  11: "Иов. διὰ τί γὰρ ἐν κοιλίᾳ οὐκ ἐτελεύτησα — «ибо для чего я не умер в утробе?» ἐκ γαστρὸς δὲ ἐξῆλθον καὶ οὐκ εὐθὺς ἀπωλόμην — «из чрева вышел и не тотчас погиб?»"
  12: "Иов. ἵνα τί … συνήντησάν μοι γόνατα — «для чего колени встретили меня?» (γόνυ — колено; образ принятия новорождённого на колени). μαστοὺς ἐθήλασα — «сосцы я сосал» (θηλάζω)."
  13: "Иов. νῦν ἂν κοιμηθεὶς ἡσύχασα — «теперь, уснув, я умолк бы» (ἂν с аористом — нереальное). ὑπνώσας δὲ ἀνεπαυσάμην — «уснув, почил бы»."
  14: "Иов. μετὰ βασιλέων βουλευτῶν γῆς — «с царями, советниками земли». οἳ ἠγαυριῶντο ἐπὶ ξίφεσιν — «которые хвалились мечами» (γαυριάω — гордиться); в евр. и ru «застраивали пустыни» — иное чтение. csl: «хваляхуся оружии»."
  15: "Иов. μετὰ ἀρχόντων, ὧν πολὺς ὁ χρυσός — «с князьями, у которых много золота». οἳ ἔπλησαν τοὺς οἴκους αὐτῶν ἀργυρίου — «которые наполнили домы свои серебром»."
  16: "Иов. ὥσπερ ἔκτρωμα ἐκπορευόμενον ἐκ μήτρας μητρός — «как выкидыш, выходящий из утробы матери» (ἔκτρωμα). ὥσπερ νήπιοι, οἳ οὐκ εἶδον φῶς — «как младенцы, которые не видели света»."
  17: "Иов. ἐκεῖ ἀσεβεῖς ἐξέκαυσαν θυμὸν ὀργῆς — «там нечестивые погасили ярость гнева» (ἐκκαίω — выжигать, гасить); ср. csl «утолиша ярость гнева». ἀνεπαύσαντο κατάκοποι τῷ σώματι — «успокоились утруждённые телом»."
  18: "Иов. ὁμοθυμαδὸν … οἱ αἰώνιοι οὐκ ἤκουσαν φωνὴν φορολόγου — «вместе вечные не услышали голоса сборщика податей» (φορολόγος — мытарь, сборщик); тёмное место: αἰώνιοι, вероятно, передаёт евр. «узники» (אֲסִירִים). csl: «в веце сем бывшии» — иное понимание; ru «узники»."
  19: "Иов. μικρὸς καὶ μέγας ἐκεῖ ἐστιν — «малый и великий там есть», т. е. равны. θεράπων οὐ δεδοικὼς τὸν κύριον αὐτοῦ — «раб, не боящийся господина своего»."
  20: "Иов. ἵνα τί γὰρ δέδοται τοῖς ἐν πικρίᾳ φῶς — «для чего дан пребывающим в горечи свет» (πικρία — горечь). ζωὴ δὲ ταῖς ἐν ὀδύναις ψυχαῖς — «и жизнь душам в страданиях»."
  21: "Иов. οἳ ὁμείρονται τοῦ θανάτου — «которые жаждут смерти» (ὁμείρομαι — страстно желать); καὶ οὐ τυγχάνουσιν — «и не получают». ἀνορύσσοντες ὥσπερ θησαυρούς — «роя, как сокровища»."
  22: "Иов. περιχαρεῖς δὲ ἐγένοντο, ἐὰν κατατύχωσιν — «и обрадовались бы, если бы достигли» (περιχαρής — весьма радостный; κατατυγχάνω — достигать)."
  23: "Иов. θάνατος ἀνδρὶ ἀνάπαυμα — «смерть человеку — покой». συνέκλεισεν γὰρ ὁ θεὸς κατ᾽ αὐτοῦ — «ибо Бог заключил против него» (συγκλείω — запирать, заключать; κατ᾽ αὐτοῦ — «против него», csl «окрест его»). csl добавляет «егоже путь сокровен есть» («его путь сокрыт») — нет в LXX, по паритету внесено без скобок."
  24: "Иов. πρὸ γὰρ τῶν σίτων μου στεναγμός μοι ἥκει — «ибо прежде пищи моей приходит ко мне стенание» (σῖτα — пища; στεναγμός — стон). δακρύω δὲ ἐγὼ συνεχόμενος φόβῳ — «я плачу, объятый страхом» (συνέχω — сжимать, охватывать)."
  25: "Иов. φόβος γάρ, ὃν ἐφρόντισα, ἦλθέν μοι — «ибо страх, о котором я помышлял, пришёл ко мне» (φροντίζω — думать, заботиться). ὃν ἐδεδοίκειν, συνήντησέν μοι — «чего я боялся, то встретило меня»."
  26: "Иов. οὔτε εἰρήνευσα οὔτε ἡσύχασα οὔτε ἀνεπαυσάμην — «я не имел мира, не успокоился, не отдохнул» (εἰρηνεύω — жить в мире). ἦλθεν δέ μοι ὀργή — «и пришёл на меня гнев». Конец речи; 「」 закрывается."
