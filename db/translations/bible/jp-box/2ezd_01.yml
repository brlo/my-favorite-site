verses:
  1: "ヨシヤはエルサレムで、自分[じぶん]の主[しゅ]に過越祭[すぎこしまつり]を行[おこな]い、第一[だいいち]の月[つき]の十四日[じゅうよっか]に過越祭の小羊[こひつじ]を屠[ほふ]った。"
  2: "祭服[さいふく]をまとった祭司[さいし]たちを、主[しゅ]の神殿[しんでん]で組[くみ]ごとに立[た]たせた。"
  3: "彼[かれ]は、イスラエルの聖[せい]なる務[つと]めを担[にな]うレビ人[びと]たちに言[い]った。「主[しゅ]に身[み]を聖別[せいべつ]せよ。ダビデの子[こ]、ソロモン王[おう]が建[た]てた家[いえ]に、主[しゅ]の聖[せい]なる契約[けいやく]の箱[はこ]を据[す]えるために。あなたがたは、それを肩[かた]に担[かつ]ぐことはない。"
  4: "今[いま]、あなたがたの神[かみ]である主[しゅ]に仕[つか]え、その民[たみ]イスラエルを顧[かえり]みよ。そして、あなたがたの氏族[しぞく]と部族[ぶぞく]ごとに、イスラエルの王[おう]ダビデの書[しょ]と、その子[こ]ソロモンの威光[いこう]に従[したが]って、備[そな]えをせよ。"
  5: "あなたがたレビ人[びと]は、父祖[ふそ]の組[くみ]分[わ]けに従[したが]って神殿[しんでん]に立[た]ち、あなたがたの兄弟[きょうだい]であるイスラエルの子[こ]らの前[まえ]に、順序[じゅんじょ]に従[したが]って立[た]て。"
  6: "過越祭[すぎこしまつり]の小羊[こひつじ]を屠[ほふ]り、あなたがたの兄弟[きょうだい]たちのために犠牲[ぎせい]を備[そな]え、主[しゅ]がモーセに与[あた]えられた命令[めいれい]に従[したが]って過越祭を行[おこな]え。」"
  7: "ヨシヤは、そこにいた民[たみ]に、子羊[こひつじ]と雄羊[おひつじ]三万[さんまん]頭[とう]、雄牛[おうし]三千頭[さんぜんとう]を贈[おく]り物[もの]として与[あた]えた。これらは王[おう]のものから、約束[やくそく]に従[したが]って民と祭司[さいし]たちとレビ人[びと]たちに与[あ]えられた。"
  8: "神殿[しんでん]の監督[かんとく]であるヒルキヤ、ザカリヤ、エスエロスは、祭司[さいし]たちに過越祭[すぎこしまつり]のために羊[ひつじ]二千六百頭[にせんろっぴゃくとう]、雄牛[おうし]三百頭[さんびゃくとう]を与[あた]えた。"
  9: "千人[せんにん]の長[かしら]であるエホヤキン、サマイアス、その兄弟[きょうだい]ナタナエル、アサビアス、オキエロス、ヨラムは、レビ人[びと]たちに過越祭[すぎこしまつり]のために羊[ひつじ]五千頭[ごせんとう]、雄牛[おうし]七百頭[ななひゃくとう]を与[あた]えた。"
  10: "これらのことが行[おこな]われたとき、祭司[さいし]たちとレビ人[びと]たちは見事[みごと]に整[ととの]って立[た]った。"
  11: "種[たね]なしパンを部族[ぶぞく]ごとに持[も]ち、"
  12: "父祖[ふそ]の組[くみ]分[わ]けに従[したが]って、民[たみ]の前[まえ]で、モーセの書[しょ]に書[か]かれているとおりに主[しゅ]にささげた。朝[あさ]の務[つと]めもそのとおりであった。"
  13: "彼[かれ]らは過越祭[すぎこしまつり]の小羊[こひつじ]を火[ひ]で焼[や]き、定[さだ]めどおりに、犠牲[ぎせい]を青銅[せいどう]の器[うつわ]と大鍋[おおなべ]で香[こう]ばしく煮[に]た。そして、民[たみ]のすべての者[もの]に運[はこ]んで行[い]った。"
  14: "その後[あと]、彼[かれ]らは自分[じぶん]たちと、その兄弟[きょうだい]である祭司[さいし]たちのために備[そな]えた。祭司たちは夜[よる]遅[おそ]くまで、脂肪[しぼう]をささげていたからである。レビ人[びと]たちは自分たちと、その兄弟であるアロンの子[こ]らのために備えた。"
  15: "歌[うた]い手[て]であるアサフの子[こ]らは、ダビデと、アサフと、ザカリヤと、王[おう]のもとにあったエディヌスが定[さだ]めたとおりに、自分[じぶん]たちの場所[ばしょ]に立[た]った。門番[もんばん]たちはそれぞれの門[もん]にいた。彼[かれ]らは自分[じぶん]の組[くみ]から離[はな]れることはできなかった。その兄弟[きょうだい]であるレビ人[びと]たちが、彼らのために備[そな]えたからである。"
  16: "その日[ひ]、主[しゅ]への犠牲[ぎせい]の務[つと]めがすべて終[お]わった。過越祭[すぎこしまつり]が行[おこな]われ、ヨシヤ王[おう]の命[めい]に従[したが]って神[かみ]の祭壇[さいだん]に犠牲がささげられた。"
  17: "その時[とき]そこにいたイスラエルの子[こ]らは、過越祭[すぎこしまつり]と除酵祭[じょこうさい]を七[なの]日[か]の間[あいだ]行[おこな]った。"
  18: "預言者[よげんしゃ]サムエルの日[ひ]以来[いらい]、イスラエルではこのような過越祭[すぎこしまつり]は行[おこな]われなかった。"
  19: "イスラエルのすべての王[おう]たちも、ヨシヤと祭司[さいし]たちとレビ人[びと]たち、ユダの人[ひと]々[びと]と、エルサレムに住[す]まいを定[さだ]めていたすべてのイスラエルが行[おこな]ったような過越祭[すぎこしまつり]を行[おこな]わなかった。"
  20: "ヨシヤの治世[ちせい]の第十八年目[だいじゅうはちねんめ]に、この過越祭[すぎこしまつり]は行[おこな]われた。"
  21: "ヨシヤの行[おこな]いは、敬虔[けいけん]さに満[み]ちた心[こころ]をもって、彼[かれ]の主[しゅ]の前[まえ]に正[ただ]しく整[ととの]えられた。"
  22: "彼[かれ]に起[お]こったことは、以前[いぜん]の時代[じだい]の記録[きろく]に書[か]かれている。すなわち、すべての国民[こくみん]と王国[おうこく]にまさって主[しゅ]に対[たい]して罪[つみ]を犯[おか]し、不敬[ふけい]を行[おこな]った者[もの]たちのこと、彼[かれ]らが自覚[じかく]して主を悲[かな]しませたこと、そして主[しゅ]の言葉[ことば]がイスラエルに対[たい]して立[た]ったことである。"
  23: "ヨシヤのこのすべての行[おこな]いの後[あと]、エジプトの王[おう]ファラオ・ネコが来[き]て、ユーフラテス川[がわ]のほとりのカルケミシュで戦[たたか]いを起[お]こした。ヨシヤは彼[かれ]に会[あ]いに出[で]た。"
  24: "エジプトの王[おう]は彼[かれ]のもとへ使者[ししゃ]を遣[つか]わして言[い]わせた。「ユダの王[おう]よ、わたしとあなたの間[あいだ]に何[なに]があろうか。"
  25: "わたしはあなたに敵[てき]して、主[しゅ]である神[かみ]から遣[つか]わされたのではない。わたしの戦[たたか]いはユーフラテス川[がわ]にあるからである。今[いま]、主はわたしとともにあり、主はわたしとともにあって、急[いそ]がせておられる。退[しりぞ]け、主に逆[さか]らってはならない。」"
  26: "しかしヨシヤは自分[じぶん]の戦車[せんしゃ]へ引[ひ]き返[かえ]さず、かえって彼[かれ]と戦[たたか]おうと企[くわだ]て、主[しゅ]の口[くち]から出[で]た預言者[よげんしゃ]エレミヤの言葉[ことば]に耳[みみ]を傾[かたむ]けなかった。"
  27: "それでも彼[かれ]とメギドの平野[へいや]で戦[たたか]いを交[まじ]え、長[かしら]たちがヨシヤ王[おう]のもとへ下[くだ]って来[き]た。"
  28: "王[おう]は自分[じぶん]のしもべたちに言[い]った。「わたしを戦[たたか]いから離[はな]れさせよ。ひどく弱[よわ]っているからである。」しもべたちはすぐに彼を戦列[せんれつ]から離[はな]れさせた。"
  29: "彼[かれ]は自分[じぶん]の第二[だいに]の戦車[せんしゃ]に乗[の]り、エルサレムへ連[つ]れ戻[もど]されて、生涯[しょうがい]を終[お]えた。父[ちち]たちの墓[はか]に葬[ほうむ]られた。"
  30: "ユダヤ全土[ぜんど]がヨシヤを嘆[なげ]いた。預言者[よげんしゃ]エレミヤはヨシヤのために哀歌[あいか]を歌[うた]った。長[かしら]たちとその妻[つま]たちは、今日[きょう]に至[いた]るまで彼のために嘆いた。これはイスラエルの民[たみ]全体のために、常[つね]に行[おこな]われることとして定[さだ]められた。"
  31: "これらのことは、ユダの王[おう]たちについての物語[ものがたり]の書[しょ]に書[か]かれている。ヨシヤの行[おこな]いの一[ひと]つ一[ひと]つ、その栄光[えいこう]、主[しゅ]の律法[りっぽう]に対するその識見[しきけん]、彼[かれ]が以前[いぜん]行[おこな]ったことと今[いま]のことも、イスラエルとユダの王たちの書に記[しる]されている。"
  32: "民[たみ]の者[もの]たちはヨシヤの子[こ]ヨアハズを連[つ]れて来[き]、父[ちち]ヨシヤに代[か]わって王[おう]とした。彼[かれ]は二十三歳[にじゅうさんさい]であった。"
  33: "彼[かれ]はユダとエルサレムで三[みっ]か月[げつ]王[おう]として治[おさ]めた。エジプトの王[おう]は彼を退[しりぞ]けて、エルサレムで王[おう]となれないようにした。"
  34: "また、民[たみ]に銀[ぎん]百[ひゃく]タラントと金[きん]一[いち]タラントの罰金[ばっきん]を課[か]した。"
  35: "エジプトの王[おう]は、彼[かれ]の兄弟[きょうだい]ヨヤキムを、ユダとエルサレムの王[おう]とした。"
  36: "ヨヤキムは貴族[きぞく]たちを縛[しば]り、その兄弟[きょうだい]ザリオンを捕[と]らえて、エジプトから連[つ]れ上[のぼ]った。"
  37: "ヨヤキムは二十五歳[にじゅうごさい]で、ユダとエルサレムの王[おう]となった。彼[かれ]は主[しゅ]の前[まえ]に悪[あく]を行[おこな]った。"
  38: "バビロンの王[おう]ネブカドネツァルが彼[かれ]のところへ上[のぼ]って来[き]、彼を青銅[せいどう]の枷[かせ]で縛[しば]ってバビロンへ連[つ]れて行[い]った。"
  39: "ネブカドネツァルは主[しゅ]の聖[せい]なる器[うつわ]の一部[いちぶ]を持[も]ち出[だ]して運[はこ]び、バビロンにある自分[じぶん]の神殿[しんでん]に置[お]いた。"
  40: "彼[かれ]について、また彼の汚[けが]れと不敬[ふけい]について語[かた]られたことは、王[おう]たちの時代[じだい]の書[しょ]に書[か]かれている。"
  41: "彼[かれ]に代[か]わってその子[こ]ヨヤキムが王[おう]となった。彼[かれ]が王[おう]に任[にん]じられたとき、十八歳[じゅうはちさい]であった。"
  42: "彼[かれ]はエルサレムで三[みっ]か月[げつ]と十[とお]日[か]の間[あいだ]王[おう]として治[おさ]め、主[しゅ]の前[まえ]に悪[あく]を行[おこな]った。"
  43: "一年[いちねん]の後[のち]、ネブカドネツァルは人[ひと]を遣[つか]わして彼を、主[しゅ]の聖[せい]なる器[うつわ]とともにバビロンへ移[うつ]した。"
  44: "そして、セデキヤをユダとエルサレムの王[おう]とした。セデキヤは二十一歳[にじゅういっさい]で、十一[じゅういち]年[ねん]の間[あいだ]王[おう]であった。"
  45: "彼[かれ]は主[しゅ]の前[まえ]に悪[あく]を行[おこな]い、主[しゅ]の口[くち]から出[で]て預言者[よげんしゃ]エレミヤが語[かた]った言葉[ことば]を恥[は]じなかった。"
  46: "彼[かれ]はネブカドネツァル王[おう]によって主[しゅ]の名[な]にかけて誓[ちか]わされたのに、その誓いを破[やぶ]って離反[りはん]し、うなじを固[かた]くし、心[こころ]を強[かた]くして、イスラエルの神[かみ]である主[しゅ]の掟[おきて]を犯[おか]した。"
  47: "民[たみ]の長[かしら]たちと祭司[さいし]たちもまた、すべての国民[こくみん]のあらゆる汚[けが]れにまさって、多[おお]くの不敬[ふけい]と不法[ふほう]を行[おこな]い、エルサレムで聖[せい]とされている主[しゅ]の聖所[せいしょ]を汚[けが]した。"
  48: "彼[かれ]らの父祖[ふそ]の神[かみ]は、彼らを呼[よ]び戻[もど]すために、ご自分[じぶん]の使[つか]いを遣[つか]わされた。彼らとご自分の幕屋[まくや]を惜[お]しんでおられたからである。"
  49: "しかし彼[かれ]らは、ご自分[じぶん]の使[つか]いたちを嘲[あざけ]り、主[しゅ]が語[かた]られたその日[ひ]にも、主の預言者[よげんしゃ]たちを嘲弄[ちょうろう]していた。ついに主は、彼らの不敬[ふけい]のゆえにご自分の民[たみ]に怒[いか]りを燃[も]やし、カルデア人[じん]の王[おう]を彼らの上[うえ]に上[のぼ]らせるよう命[めい]じられた。"
  50: "彼[かれ]らは聖[せい]なる神殿[しんでん]の周[まわ]りで、そこの若者[わかもの]たちを剣[つるぎ]にかけて殺[ころ]した。若者も処女[しょじょ]も、老人[ろうじん]も年少[ねんしょう]者[しゃ]も惜[お]しむことなく、すべてを彼らの手[て]に渡[わた]された。"
  51: "彼[かれ]らは、主[しゅ]の聖[せい]なる器[うつわ]のすべて、大[おお]きいものも小[ちい]さいものも、主の箱[はこ]々[ばこ]、王[おう]の宝物庫[ほうもつこ]の品[しな]々[しな]を取[と]り上[あ]げて、バビロンへ運[はこ]んだ。"
  52: "彼[かれ]らは主[しゅ]の家[いえ]を焼[や]き、エルサレムの城壁[じょうへき]を崩[くず]し、その塔[とう]を火[ひ]で焼[や]いた。"
  53: "彼[かれ]らはそのすべての輝[かがや]かしいものを無[む]に帰[き]した。そして、剣[つるぎ]を免[まぬが]れた残[のこ]りの者[もの]たちをバビロンへ連[つ]れて行[い]った。"
  54: "彼[かれ]らは、ペルシア人[じん]が王[おう]となるまで、彼とその子[こ]らとに奴隷[どれい]として仕[つか]えた。これは、エレミヤの口[くち]による主[しゅ]の言葉[ことば]が成就[じょうじゅ]するためであった。"
  55: "土地[とち]がその安息[あんそく]を受[う]け入[い]れるまで、すなわちその荒廃[こうはい]の全[すべ]ての期間[きかん]、七十年[ななじゅうねん]が満[み]ちるまで、土地は安息を守[まも]るであろう。"

notes:
  1: "ἤγαγεν τὸ πασχα — «совершил пасху» (ἄγω); ἔθυσεν τὸ πασχα — «заколол пасху» (θύω), т. е. пасхального агнца; τῇ τεσσαρεσκαιδεκάτῃ ἡμέρᾳ τοῦ μηνὸς τοῦ πρώτου — в четырнадцатый день первого месяца. τῷ κυρίῳ αὐτοῦ — «Господу своему»; так же в слав. «Господу своему»."
  2: "στήσας τοὺς ἱερεῖς κατ᾿ ἐφημερίας — «поставив священников по чредам» (ἐφημερία — чреда, 組); ἐστολισμένους — «облачённых» (στολίζω), слав. «в ризы одеянны»; ἐν τῷ ἱερῷ — «в храме» (ἱερόν, 神殿)."
  3: "ἱεροδοῦλοι τοῦ Ισραηλ — «священнослужители Израиля» (ἱερόδουλος); ἁγιάσαι ἑαυτοὺς τῷ κυρίῳ — «освятить себя Господу»; ἐν τῇ θέσει τῆς ἁγίας κιβωτοῦ — «при поставлении святого ковчега» (θέσις); Οὐκ ἔσται ὑμῖν ἆραι ἐπ᾿ ὤμων αὐτήν — «не будет вам носить её на плечах» (αἴρω). Слав. относит эту последнюю фразу к своему ст. 1:4."
  4: "λατρεύετε τῷ κυρίῳ θεῷ ὑμῶν — «служите Господу Богу вашему»; θεραπεύετε τὸ ἔθνος αὐτοῦ Ισραηλ — «заботьтесь о народе Его, Израиле» (θεραπεύω), слав. «пецытеся о языцех его израили»; ἑτοιμάσατε κατὰ τὰς πατριὰς καὶ τὰς φυλάς — «приготовьтесь по родам и племенам»; κατὰ τὴν γραφὴν Δαυιδ … καὶ κατὰ τὴν μεγαλειότητα Σαλωμων — «по писанию Давида… и по великолепию Соломона»."
  5: "στάντες ἐν τῷ ἱερῷ — «став в храме»; κατὰ τὴν μεριδαρχίαν τὴν πατρικήν — «по отеческому разделу» (μεριδαρχία); τῶν ἔμπροσθεν τῶν ἀδελφῶν ὑμῶν — «пред братьями вашими»; ἐν τάξει — «в порядке» (τάξις). Слав. «по участию началства отеческаго»."
  6: "θύσατε τὸ πασχα — «заколите пасху»; τὰς θυσίας ἑτοιμάσατε — «жертвы приготовьте»; κατὰ τὸ πρόσταγμα τοῦ κυρίου τὸ δοθὲν τῷ Μωυσῇ — «по повелению Господню, данному Моисею» (πρόσταγμα)."
  7: "ἐδωρήσατο — «дал в дар» (δωρέομαι); ἀρνῶν καὶ ἐρίφων τριάκοντα χιλιάδας — «агнцев и козлов тридцать тысяч»; в слав. «агнцев и овнов» — иное чтение (в тексте 子羊と雄羊); μόσχους τρισχιλίους — «тельцов три тысячи»; ἐκ τῶν βασιλικῶν — «из царского [имущества]»; κατ᾿ ἐπαγγελίαν — «по обещанию» (ἐπαγγελία)."
  8: "Χελκιας, Ζαχαριας, Ησυηλος — Хелкия, Захария, Есуил (ἐπιστάται τοῦ ἱεροῦ — «надзиратели храма»); слав. «хелкиа, захариа, сиил»; πρόβατα δισχίλια ἑξακόσια — две тысячи шестьсот овец; μόσχους τριακοσίους — триста тельцов. Χελκιας передан как ヒルキヤ, по 2 Пар 35:8."
  9: "Ιεχονιας, Σαμαιας, Ναθαναηλ ὁ ἀδελφός, Ασαβιας, Οχιηλος, Ιωραμ — Иехония, Шемаия, Нафанаил, Хашавия, Охиил, Иорам (χιλίαρχοι — тысяченачальники); слав. «иехониа, самеа, нафанаил…». Имя Ιεχονιας передано как エホヤキン, по таблице книги; ср. 2 Пар 35:9."
  10: "καὶ ταῦτα τὰ γενόμενα — «и это происходило» (γίνομαι); εὐπρεπῶς ἔστησαν — «благообразно стали» (εὐπρεπῶς). В слав. этот стих содержит и gr 1:11 («имеюще опресноки, по племеном»), поэтому деление gr 1:10–11 сохранено: «опресноки по племенам» отнесены к ст. 11."
  11: "ἔχοντες τὰ ἄζυμα κατὰ τὰς φυλάς — «имея опресноки по племенам» (ἄζυμα, 種なしパン). В слав. входит в ст. 1:10; по делению gr — отдельный стих, продолжение фразы в ст. 12."
  12: "κατὰ τὰς μεριδαρχίας τῶν πατέρων — «по разделениям отцов»; ἔμπροσθεν τοῦ λαοῦ — «пред народом»; προσενεγκεῖν τῷ κυρίῳ — «принести Господу»; κατὰ τὰ γεγραμμένα ἐν βιβλίῳ Μωυσῆ — «по написанному в книге Моисея»; καὶ οὕτω τὸ πρωινόν — «и так утреннее» (слав. «и тако во утрие»)."
  13: "ὤπτησαν τὸ πασχα πυρὶ ὡς καθῆκει — «испекли пасху на огне, как подобало» (ὀπτάω, καθῆκει); ἥψησαν ἐν τοῖς χαλκείοις καὶ λέβησιν — «сварили в медных сосудах и котлах» (ἕψω, χαλκεῖον, λέβης); μετ᾿ εὐωδίας — «с благовонием»; ἀπήνεγκαν πᾶσι τοῖς ἐκ τοῦ λαοῦ — «отнесли всем из народа»."
  14: "μετὰ δὲ ταῦτα — «после сего»; οἱ γὰρ ἱερεῖς ἀνέφερον τὰ στέατα ἕως ἀωρίας — «ибо священники возносили туки до позднего времени» (στέαρ — тук, 脂肪; ἀωρία — поздний час); слав. делит стих на 1:13–14."
  15: "οἱ ἱεροψάλται υἱοὶ Ασαφ — «священнопевцы, сыны Асафа» (ἱεροψάλτης, 歌い手); ἐπὶ τῆς τάξεως αὐτῶν — «на своём порядке»; κατὰ τὰ ὑπὸ Δαυιδ τεταγμένα — «по установленному Давидом»; Εδδινους οἱ παρὰ τοῦ βασιλέως — Еддин, «который от царя»; οἱ θυρωροί — «привратники» (θυρωρός, 門番); οὐκ ἔστιν παραβῆναι ἕκαστον τὴν ἑαυτοῦ ἐφημερίαν — «нельзя было каждому оставить свою чреду»."
  16: "συνετελέσθη τὰ τῆς θυσίας τοῦ κυρίου — «завершилось [всё] относящееся к жертве Господней» (συντελέω); ἀχθῆναι τὸ πασχα — «чтобы совершена была пасха»; προσενεχθῆναι τὰς θυσίας ἐπὶ τὸ θυσιαστήριον — «принесены жертвы на жертвенник» (θυσιαστήριον, 祭壇); в LXX он «Господень» (τοῦ κυρίου), в слав. «жертвенник Божий» — в тексте 神の祭壇; κατὰ τὴν ἐπιταγήν — «по повелению» (ἐπιταγή). В слав. это ст. 1:17–18."
  17: "ἠγάγοσαν … τὸ πασχα καὶ τὴν ἑορτὴν τῶν ἀζύμων ἡμέρας ἑπτά — «совершили пасху и праздник опресноков семь дней» (ἑορτή, ἄζυμα); οἱ εὑρεθέντες ἐν τῷ καιρῷ τούτῳ — «находившиеся в то время»."
  18: "οὐκ ἤχθη τὸ πασχα τοιοῦτο — «не была совершена такая пасха»; ἀπὸ τῶν χρόνων Σαμουηλ τοῦ προφήτου — «от времён Самуила пророка». Слав. «от времене самуила пророка»."
  19: "οὐκ ἠγάγοσαν πασχα τοιοῦτον, οἷον ἤγαγεν Ιωσιας — «не совершили такой пасхи, какую совершил Иосия»; οἱ εὑρεθέντες ἐν τῇ κατοικήσει αὐτῶν ἐν Ιερουσαλημ — «находившиеся в жилищах своих в Иерусалиме» (κατοίκησις)."
  20: "ὀκτωκαιδεκάτῳ ἔτει βασιλεύοντος Ιωσιου — «в восемнадцатый год царствования Иосии»; ἤχθη τὸ πασχα τοῦτο — «совершена эта пасха». Тире в конце стиха стоит в издании."
  21: "ὠρθώθη τὰ ἔργα Ιωσιου — «исправлены, направлены дела Иосии» (ὀρθόω); ἐνώπιον τοῦ κυρίου αὐτοῦ — «пред Господом его»; ἐν καρδίᾳ πλήρει εὐσεβείας — «в сердце, полном благочестия» (εὐσέβεια)."
  22: "τὰ κατ᾿ αὐτὸν — «то, что при нём»; ἀναγέγραπται ἐν τοῖς ἔμπροσθεν χρόνοις — «записано в прежних временах»; περὶ τῶν ἡμαρτηκότων καὶ ἠσεβηκότων — «о согрешивших и нечествовавших» (ἁμαρτάνω, ἀσεβέω); ἃ ἐλύπησαν αὐτὸν ἐν αἰσθήσει — «чем они огорчили Его сознательно» (λύπη, αἴσθησις); οἱ λόγοι τοῦ κυρίου ἀνέστησαν ἐπὶ Ισραηλ — «слова Господни восстали на Израиля»."
  23: "συνέβη Φαραω … ἐλθόντα πόλεμον ἐγεῖραι — «случилось, что фараон… пришёл поднять войну» (ἐγείρω); ἐν Χαρκαμυς ἐπὶ τοῦ Εὐφράτου — «в Каркамисе на Евфрате»; ἐξῆλθεν εἰς ἀπάντησιν αὐτῷ — «вышел навстречу ему». Φαραω Νεχαω — ファラオ・ネコ (как 4 Цар 23:29); слав. «фараону царю египетскому»."
  24: "διεπέμψατο … λέγων — «послал… сказать» (διαπέμπω); Τί ἐμοὶ καὶ σοί ἐστιν, βασιλεῦ τῆς Ιουδαίας; — «что мне и тебе, царь Иудейский?». В слав. это отдельный ст. 1:26; в gr-lxx-byz вопрос стоит уже здесь и добавлением из 2 Пар 35:21 не является, поэтому в ст. 25 он не повторён."
  25: "οὐχὶ πρὸς σὲ ἐξαπέσταλμαι — «не против тебя я послан» (ἐξαποστέλλω); ἐπὶ γὰρ τοῦ Εὐφράτου ὁ πόλεμός μού ἐστιν — «ибо на Евфрате война моя»; κύριος μετ᾿ ἐμοῦ ἐπισπεύδων ἐστίν — «Господь со мною, поспешающий» (ἐπισπεύδω); ἀπόστηθι καὶ μὴ ἐναντιοῦ — «отступи и не противься» (ἐναντιόομαι)."
  26: "οὐκ ἀπέστρεψεν ἑαυτὸν ἐπὶ τὸ ἅρμα αὐτοῦ — «не обратил себя к колеснице своей»; πολεμεῖν αὐτὸν ἐπιχειρεῖ — «предпринял воевать с ним» (ἐπιχειρέω); οὐ προσέχων ῥήμασιν Ιερεμιου — «не внимая словам Иеремии» (προσέχω); ἐκ στόματος κυρίου — «из уст Господних»."
  27: "συνεστήσατο πρὸς αὐτὸν πόλεμον — «составил против него войну» (συνίστημι); ἐν τῷ πεδίῳ Μαγεδδαους — «на поле Мегиддо» (メギド); κατέβησαν οἱ ἄρχοντες πρὸς τὸν βασιλέα — «сошли начальники к царю»."
  28: "Ἀποστήσατέ με ἀπὸ τῆς μάχης — «отстраните меня от битвы» (ἀφίστημι); ἠσθέννησα γὰρ λίαν — «ибо я сильно ослаб» (ἀσθενέω); ἀπὸ τῆς παρατάξεως — «от строя» (παράταξις). Слова Иосии — 「…」."
  29: "ἀνέβη ἐπὶ τὸ ἅρμα τὸ δευτέριον — «взошёл на вторую колесницу» (δευτέριος); ἀποκατασταθεὶς εἰς Ιερουσαλημ — «возвращённый в Иерусалим» (ἀποκαθίστημι); μετήλλαξεν τὸν βίον — «переменил жизнь», т. е. умер (μεταλλάσσω); ἐτάφη ἐν τῷ πατρικῷ τάφῳ — «погребён в отцовской гробнице»."
  30: "ἐπένθησαν τὸν Ιωσιαν — «оплакали Иосию» (πενθέω); ἐθρήνησεν Ιερεμιας — «рыдал, пел плач Иеремия» (θρηνέω); οἱ προκαθήμενοι σὺν γυναιξίν — «предстоящие с жёнами» (προκάθημαι); ἕως τῆς ἡμέρας ταύτης — «до сего дня»; ἐξεδόθη τοῦτο γίνεσθαι αἰεί — «это было предписано совершать всегда» (ἐκδίδωμι)."
  31: "ἐν τῇ βύβλῳ τῶν ἱστορουμένων περὶ τῶν βασιλέων τῆς Ιουδαίας — «в книге повествований о царях Иудеи» (ἱστορέω); τὸ καθ᾿ ἓν πραχθέν — «соделанное по одному»; τῆς δόξης … καὶ τῆς συνέσεως αὐτοῦ ἐν τῷ νόμῳ κυρίου — «славы… и разума его в законе Господнем» (σύνεσις); τά τε προπραχθέντα … καὶ τὰ νῦν — «и прежде соделанное… и нынешнее»."
  32: "ἀναλαβόντες οἱ ἐκ τοῦ ἔθνους — «взяв [его] бывшие из народа»; ἀνέδειξαν βασιλέα — «поставили царём» (ἀναδείκνυμι); ὄντα ἐτῶν εἴκοσι τριῶν — «когда ему было двадцать три года». В LXX стоит Ιεχονιαν (Иехония, エホヤキン), но слав. и ru читают Иоахаза, как 2 Пар 36:1; по паритету в тексте ヨアハズ. Слав. это ст. 1:34."
  33: "ἐβασίλευσεν … μῆνας τρεῖς — «царствовал три месяца»; ἀπεκατέστησεν αὐτὸν βασιλεὺς Αἰγύπτου — «отставил его царь Египетский» (ἀποκαθίστημι); τοῦ μὴ βασιλεύειν ἐν Ιερουσαλημ — «чтобы не царствовать в Иерусалиме»."
  34: "ἐζημίωσεν τὸ ἔθνος — «наложил штраф на народ» (ζημιόω); ἀργυρίου ταλάντοις ἑκατόν — «сто талантов серебра»; χρυσίου ταλάντῳ ἑνί — «один талант золота»."
  35: "ἀνέδειξεν … βασιλέα Ιωακιμ τὸν ἀδελφὸν αὐτοῦ — «поставил царём Иоакима, брата его»; βασιλέα τῆς Ιουδαίας καὶ Ιερουσαλημ — «царём Иудеи и Иерусалима». Слав. «иоакима брата его»."
  36: "ἔδησεν Ιωακιμ τοὺς μεγιστᾶνας — «связал Иоаким вельмож» (μεγιστάν); Ζαριον δὲ τὸν ἀδελφὸν αὐτοῦ συλλαβών — «а Зария, брата его, схватив» (συλλαμβάνω); ἀνήγαγεν ἐξ Αἰγύπτου — «вывел из Египта» (ἀνάγω). Слав. «заракина… изведе из египта»; ru читает «отвел в Египет» — иное понимание, в текст не внесено."
  37: "Ἐτῶν … εἴκοσι πέντε Ιωακιμ — «Иоаким был двадцати пяти лет»; ὅτε ἐβασίλευσεν τῆς Ιουδαίας καὶ Ιερουσαλημ — «когда воцарился над Иудеей и Иерусалимом»; ἐποίησεν τὸ πονηρὸν ἐνώπιον κυρίου — «делал злое пред Господом»."
  38: "ἀνέβη ἐπ᾿ αὐτὸν Ναβουχοδονοσορ — «взошёл на него Навуходоносор»; δήσας ἐν χαλκείῳ δεσμῷ — «связав медными узами» (δεσμός); ἀπήγαγεν εἰς Βαβυλῶνα — «отвёл в Вавилон»."
  39: "ἀπὸ τῶν ἱερῶν σκευῶν τοῦ κυρίου — «из священных сосудов Господних» (σκεῦος); ἀπενέγκας — «отнёс» (ἀποφέρω); ἀπηρείσατο ἐν τῷ ναῷ αὐτοῦ — «поставил в храме своём» (ἀπερείδω)."
  40: "τὰ ἱστορηθέντα περὶ αὐτοῦ — «рассказанное о нём» (ἱστορέω); τῆς ἀκαθαρσίας καὶ δυσσεβείας — «нечистоты и нечестия» (ἀκαθαρσία, δυσσέβεια); ἐν τῇ βίβλῳ τῶν χρόνων τῶν βασιλέων — «в книге времён царей»."
  41: "Καὶ ἐβασίλευσεν ἀντ᾿ αὐτοῦ Ιωακιμ ὁ υἱὸς αὐτοῦ — «и воцарился вместо него Иоаким, сын его»; ὅτε ἀνεδείχθη, ἦν ἐτῶν δέκα ὀκτώ — «когда был поставлен, был восемнадцати лет». В LXX и слав. здесь Ιωακιμ/Иоаким (ヨヤキム), но по 2 Пар 36:9 и по контексту (три месяца и десять дней, 18 лет) это Иехония (エホヤキン); чтение свидетелей оставлено в тексте."
  42: "βασιλεύει δὲ μῆνας τρεῖς καὶ ἡμέρας δέκα — «царствовал три месяца и десять дней»; ἐποίησεν τὸ πονηρὸν ἔναντι κυρίου — «делал злое пред Господом»."
  43: "μετ᾿ ἐνιαυτὸν ἀποστείλας — «через год послав» (ἀποστέλλω); μετήγαγεν αὐτὸν εἰς Βαβυλῶνα — «перевёл его в Вавилон» (μετάγω); ἅμα τοῖς ἱεροῖς σκεύεσιν — «вместе со священными сосудами»."
  44: "ἀνέδειξε Σεδεκιαν βασιλέα — «поставил Седекию царём»; ὄντα ἐτῶν εἴκοσι ἑνός — «когда ему был двадцать один год»; βασιλεύει δὲ ἔτη ἕνδεκα — «царствовал же одиннадцать лет»."
  45: "ἐποίησεν τὸ πονηρόν — «делал злое»; οὐκ ἐνετράπη ἀπὸ τῶν ῥηθέντων λόγων — «не устыдился сказанных слов» (ἐντρέπω); ὑπὸ Ιερεμιου … ἐκ στόματος τοῦ κυρίου — «через Иеремию… из уст Господних»."
  46: "ὁρκισθεὶς ἀπὸ τοῦ βασιλέως — «будучи заклят царём» (ὁρκίζω); ἐπιορκήσας ἀπέστη — «нарушив клятву, отступил» (ἐπιορκέω, ἀφίστημι); σκληρύνας τὸν τράχηλον καὶ τὴν καρδίαν — «ожесточив шею и сердце» (σκληρύνω); παρέβη τὰ νόμιμα — «преступил уставы» (νόμιμα)."
  47: "οἱ ἡγούμενοι τοῦ λαοῦ καὶ τῶν ἱερέων — «начальствующие народа и священников»; ἠσέβησαν καὶ ἠνόμησαν — «нечествовали и беззаконновали» (ἀσεβέω, ἀνομέω); ὑπὲρ πάσας τὰς ἀκαθαρσίας — «сверх всех нечистот»; ἐμίαναν τὸ ἱερόν — «осквернили святилище» (μιαίνω)."
  48: "ἀπέστειλεν ὁ θεὸς τῶν πατέρων αὐτῶν — «послал Бог отцов их»; διὰ τοῦ ἀγγέλου αὐτοῦ — «через ангела Своего» (ед. ч.); μετακαλέσαι αὐτούς — «призвать их» (μετακαλέω); καθὸ ἐφείδετο — «так как щадил» (φείδομαι); τοῦ σκηνώματος αὐτοῦ — «скинии Своей» (σκήνωμα)."
  49: "ἐξεμυκτήρισαν ἐν τοῖς ἀγγέλοις αὐτοῦ — «глумились над ангелами Его» (ἐκμυκτηρίζω); ᾗ ἡμέρᾳ ἐλάλησεν κύριος — «в тот день, когда говорил Господь»; ἐκπαίζοντες τοὺς προφήτας — «осмеивая пророков» (ἐμπαίζω); ἕως τοῦ θυμωθέντα … προστάξαι — «доколе… не повелел» (θυμόω, προστάσσω); τοὺς βασιλεῖς τῶν Χαλδαίων — «царей Халдейских» (мн. ч.); в слав. ед. ч. «царем халдейским» — в тексте 王 (ед. ч.)."
  50: "ἀπέκτειναν τοὺς νεανίσκους — «убили юношей» (ἀποκτείνω, νεανίσκος); ἐν ῥομφαίᾳ — «мечом» (ῥομφαία); περικύκλῳ τοῦ ἁγίου ἱεροῦ — «вокруг святого храма»; οὐκ ἐφείσαντο — «не пощадили» (φείδομαι); νεανίσκου καὶ παρθένου καὶ πρεσβύτου καὶ νεωτέρου — «юноши, девы, старца и младшего» (слав. «младенца»); παρέδωκεν εἰς τὰς χεῖρας αὐτῶν — «предал в руки их». Слав. ст. 1:53–54: слова «но всех предал в руки их» открывают слав. 1:54, где далее идут сосуды (gr 1:51)."
  51: "τὰ ἱερὰ σκεύη … τὰ μεγάλα καὶ τὰ μικρά — «священные сосуды… большие и малые»; τὰς κιβωτοὺς τοῦ κυρίου — «ковчеги Господни» (мн. ч., κιβωτός); τὰς βασιλικὰς ἀποθήκας — «царские хранилища» (ἀποθήκη); слав. «сосуды кивота Господня» и «царския ковчеги» — иное понимание; в тексте 主の箱々 и 宝物庫 по LXX."
  52: "ἐνεπύρισαν τὸν οἶκον τοῦ κυρίου — «сожгли дом Господень» (ἐμπυρίζω); ἔλυσαν τὰ τείχη — «разрушили стены» (λύω); τοὺς πύργους … ἐν πυρί — «башни… огнём» (слав. «столпы»)."
  53: "συνετέλεσαν πάντα τὰ ἔνδοξα αὐτῆς ἀχρεῶσαι — «довершили обратить в ничтожество всё славное её» (ἔνδοξος, ἀχρεόω); τοὺς ἐπιλοίπους — «оставшихся» (ἐπίλοιπος); ἀπήγαγεν μετὰ ῥομφαίας εἰς Βαβυλῶνα — «отвёл с мечом в Вавилон»; слав. «оставшихся от меча» — по нему в тексте 剣を免れた."
  54: "ἦσαν παῖδες αὐτῷ καὶ τοῖς υἱοῖς αὐτοῦ — «были рабами ему и сынам его» (παῖς); μέχρι τοῦ βασιλεῦσαι Πέρσας — «до воцарения Персов»; εἰς ἀναπλήρωσιν τοῦ ῥήματος — «в исполнение слова» (ἀναπλήρωσις); ἐν στόματι Ιερεμιου — «в устах Иеремии»."
  55: "Ἕως τοῦ εὐδοκῆσαι τὴν γῆν τὰ σάββατα αὐτῆς — «доколе земля не примет субботы свои» (εὐδοκέω, σάββατον); πάντα τὸν χρόνον τῆς ἐρημώσεως — «всё время запустения» (ἐρήμωσις); σαββατιεῖ — «будет субботствовать» (σαββατίζω); εἰς συμπλήρωσιν ἐτῶν ἑβδομήκοντα — «до исполнения семидесяти лет»."
