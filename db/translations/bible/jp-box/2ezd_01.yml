# jp-box, 2-я Ездры, глава 1. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc в книге нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 1: Пасха Иосии (1–22), смерть Иосии при Мегиддо и плач Иеремии (23–31),
# Иоахаз, Иоаким, Седекия, падение Иерусалима, плен и запустение (32–55).
# Прямая речь: Иосия левитам (3–6), Нехао (24–25), Иосия слугам (28); красного и синего нет.
# Нумерация по gr: 55 стихов. Слав. делит иначе: csl 1:4 вбирает конец gr 1:3; csl 1:10
# сливает gr 1:10–11; csl 1:13–14 = gr 1:14; csl 1:15–16 = gr 1:15; csl 1:17–18 = gr 1:16;
# с csl 1:19 сдвиг +2 (csl 1:34 = gr 1:32); csl 1:51–52 = gr 1:49; csl 1:54 соединяет
# конец gr 1:50 с gr 1:51; с csl 1:55 сдвиг +3. Держимся gr; содержание csl переведено
# внутри соответствующих стихов gr.
# Слав. 1:26 («что мне и тебе, царь Иудейский?») соответствует gr 1:24: в выгрузке
# gr-lxx-byz вопрос уже стоит здесь, поэтому в ст. 25 он не повторён.
# 〔…〕 нет: все стихи есть в gr-lxx-byz. Сносок ⟨…⟩ нет.
# Имена — транслитерация греческого (LXX), по таблице книги; слав. формы — в notes.

