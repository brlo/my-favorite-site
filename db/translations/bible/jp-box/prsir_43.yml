verses:
  1: "高[たか]みの輝[かがや]き、清[きよ]らかさの大空[おおぞら]、栄光[えいこう]の現[あら]われのうちに見[み]える天[てん]の姿[すがた]。"
  2: "太陽[たいよう]は姿[すがた]を現[あら]わすとき、昇[のぼ]りながら告[つ]げ知[し]らせる。驚[おどろ]くべき器[うつわ]、いと高[たか]き者[もの]のわざである。"
  3: "真[ま]昼[ひる]には地[ち]を乾[かわ]かせ、その暑[あつ]さの前[まえ]にだれが立[た]ち向[む]かえようか。"
  4: "炉[ろ]を熱[ねつ]のわざに吹[ふ]き込[こ]むように、太陽[たいよう]は山[やま]を三[さん]倍[ばい]に焼[や]く。火[ひ]の蒸[じょう]気[き]を吹き出[だ]し、光[こう]線[せん]を放[はな]って、目[め]をくらませる。"
  5: "これを造[つく]られた主[しゅ]は大[おお]いなる方[かた]であり、その御言葉[みことば]によって、太陽[たいよう]は速[はや]く進[すす]む。"
  6: "月[つき]もまた、すべてのことについて、その時[とき]に従[したが]う。時の移[うつ]り変[か]わりを示[しめ]し、世[よ]のしるしとなる。"
  7: "祭[まつ]りは月[つき]によって定[さだ]められる。月は満[み]ちる時[とき]が過[す]ぎると欠[か]けていく光[ひかり]である。"
  8: "月[つき]はその名[な]に応[おう]じて月となり、変[か]わりゆく中[なか]で驚[おどろ]くほどに満[み]ちていく。"
  9: "高[たか]みの陣[じん]営[えい]の器[うつわ]として、天[てん]の大空[おおぞら]に輝[かがや]く。"
  10: "天[てん]の美[うつく]しさは星[ほし]の栄光[えいこう]、主[しゅ]の高[たか]みのうちで光[ひかり]を放[はな]つ飾[かざ]りである。"
  11: "聖[せい]なる方[かた]の言葉[ことば]によって、星[ほし]は定[さだ]められた順[じゅん]に立[た]ち、その見張[みは]りをゆるめることはない。"
  12: "虹[にじ]を見[み]て、これを造[つく]られた方[かた]をほめたたえよ。虹はその輝[かがや]きにおいて、まことに美[うつく]しい。"
  13: "虹[にじ]は栄光[えいこう]の輪[わ]をもって天[てん]を囲[かこ]み、いと高[たか]き者[もの]の御手[みて]がこれを広[ひろ]げた。"
  14: "その命[めい]じによって雪[ゆき]は速[すみ]やかに降[ふ]り、その裁[さば]きの稲妻[いなずま]は速[はや]く走[はし]る。"
  15: "それゆえ、宝[たから]の庫[くら]が開[ひら]かれ、雲[くも]が鳥[とり]のように飛[と]び出[だ]した。"
  16: "主[しゅ]はその偉[い]大[だい]さによって雲[くも]を強[つよ]め、雹[ひょう]の石[いし]は砕[くだ]けた。"
  17: "その現[あら]われの前[まえ]に山[やま]は揺[ゆ]れ動[うご]き、その御心[みこころ]によって南[みなみ]風[かぜ]が吹[ふ]く。"
  18: "その雷[かみなり]の声[こえ]は地[ち]を責[せ]め、北[きた]の嵐[あらし]と風[かぜ]の渦[うず]が起こる。"
  19: "主[しゅ]は鳥[とり]が舞[ま]い下[お]りるように雪[ゆき]を降[ふ]らせ、その降り方[かた]は蝗[いなご]が下りるようである。"
  20: "その白[しろ]さの美[うつく]しさに目[め]は驚[おどろ]き、その雨[あめ]の降るのに心[こころ]は震[ふる]える。"
  21: "主[しゅ]は霜[しも]を塩[しお]のように地[ち]に降[ふ]らせ、それが凍[こお]ると棘[とげ]の先[さき]のようになる。"
  22: "冷[つめ]たい北[きた]風[かぜ]が吹[ふ]くと、水[みず]の上[うえ]に氷[こおり]が張[は]る。すべての水の集[あつ]まりを覆[おお]い、水は鎧[よろい]をまとったようになる。"
  23: "それは山[やま]を食[く]らい尽[つ]くし、荒[あ]れ野[の]を焼[や]き、草[くさ]を火[ひ]のように枯[か]らす。"
  24: "すべてを癒[いや]すのは、すばやく立[た]ち現[あら]われる霧[きり]である。炎天[えんてん]の後[あと]に降[お]りる露[つゆ]は人[ひと]を喜[よろこ]ばせる。"
  25: "主[しゅ]はその思[おも]いによって深[しん]淵[えん]を静[しず]め、そこに島々[しまじま]を植[う]えられた。"
  26: "海[うみ]を渡[わた]る者[もの]たちはその危[き]険[けん]を語[かた]り、わたしたちはその話[はなし]を耳[みみ]にして驚[おどろ]く。"
  27: "そこには驚[おどろ]くべき不思[ふし]議[ぎ]なわざがあり、あらゆる生[い]き物[もの]の多[た]様[よう]さ、海[かい]獣[じゅう]の造[つく]りがある。"
  28: "主[しゅ]によって、その使[つか]いの者[もの]は道[みち]を進[すす]み、その言葉[ことば]によってすべてのものが成[な]り立[た]っている。"
  29: "わたしたちは多[おお]くを語[かた]っても、到[いた]り着[つ]くことはない。言葉[ことば]の終[お]わりはこれである。すなわち、すべては主[しゅ]である。"
  30: "主[しゅ]をたたえても、わたしたちはどこに力[ちから]を得[え]ようか。主はそのすべてのわざをはるかに超[こ]えて大[おお]いなる方[かた]である。"
  31: "主[しゅ]は恐[おそ]るべき方[かた]、まことに大[おお]いなる方であり、その支[し]配[はい]は驚[おどろ]くべきものである。"
  32: "主[しゅ]をたたえて、できるかぎり高[たか]く掲[かか]げよ。主はさらにそれを超[こ]えて高くなるからである。"
  33: "主を高く掲げて、力[ちから]を尽[つ]くせ。労[ろう]しても無[む]駄[だ]である。到[いた]り着[つ]くことはないからである。"
  34: "だれが主[しゅ]を見[み]て語[かた]り得[え]たか。だれが、あるがままに主を大[おお]きくたたえ得るだろうか。"
  35: "これらよりも大[おお]きな、隠[かく]されたことが多[おお]くある。わたしたちが見[み]たのは、主[しゅ]のわざのわずかな部分[ぶぶん]にすぎない。"
  36: "主[しゅ]はすべてを造[つく]り、敬[けい]虔[けん]な者[もの]たちに知恵[ちえ]を与[あた]えた。"

notes:
  1: "Γαυρίαμα ὕψους — «величие, гордость высоты» (γαυρίαμα — величание, гордость). στερέωμα καθαριότητος — «твердь чистоты» (στερέωμα — твердь, опора; καθαριότης — чистота). εἶδος οὐρανοῦ ἐν ὁράματι δόξης — «вид неба в видении славы» (εἶδος — вид, образ; ὅραμα — видение)."
  2: "ἥλιος ἐν ὀπτασίᾳ διαγγέλλων — «солнце, в явлении возвещающее» (ὀπτασία — явление, зрелище; διαγγέλλω — возвещать). ἐν ἐξόδῳ — «при выходе», т. е. при восходе. σκεῦος θαυμαστόν — «сосуд дивный» (σκεῦος — сосуд, орудие)."
  3: "ἐν μεσημβρίᾳ αὐτοῦ — «в полдень его» (μεσημβρία — полдень). ἀναξηραίνει χώραν — «иссушает страну» (ξηραίνω — сушить; χώρα — страна, земля). ἐναντίον καύματος αὐτοῦ τίς ὑποστήσεται — «против жара его кто устоит» (ὑφίστημι — выдерживать)."
  4: "κάμινον φυσῶν ἐν ἔργοις καύματος — «раздувающий печь в делах жара» (κάμινος — печь; φυσάω — раздувать). τριπλασίως ἥλιος ἐκκαίων ὄρη — «втрое солнце сжигает горы» (τριπλασίως — втройне; ἐκκαίω — сжигать). ἀτμίδας πυρώδεις ἐκφυσῶν — «огненные пары выдувая» (ἀτμίς — пар, испарение). ἐκλάμπων ἀκτῖνας ἀμαυροῖ ὀφθαλμούς — «испуская лучи, помрачает глаза» (ἀκτίς — луч; ἀμαυρόω — помрачать)."
  5: "μέγας κύριος ὁ ποιήσας αὐτόν — «велик Господь, создавший его». ἐν λόγοις αὐτοῦ κατέσπευσεν πορείαν — «словами Своими ускорил путь» (κατασπεύδω — ускорять; πορεία — шествие)."
  6: "ἡ σελήνη ἐν πᾶσιν εἰς καιρὸν αὐτῆς — «луна во всём в своё время» (καιρός — время, срок). ἀνάδειξιν χρόνων — «указание времён» (ἀνάδειξις — показание, объявление; χρόνος — время). σημεῖον αἰῶνος — «знамение века»."
  7: "ἀπὸ σελήνης σημεῖον ἑορτῆς — «от луны — знамение праздника»: по новолуниям определялись праздничные сроки (ἑορτή — праздник). φωστὴρ μειούμενος ἐπὶ συντελείας — «светило, умаляющееся к завершению» (μειόω — уменьшать; συντέλεια — окончание, полнота)."
  8: "μὴν κατὰ τὸ ὄνομα αὐτῆς — «месяц по имени её»: месяц (μείς) называется по луне (σελήνη). αὐξανόμενος θαυμαστῶς ἐν ἀλλοιώσει — «возрастающий дивно в изменении» (αὔξω — растить; ἀλλοίωσις — перемена)."
  9: "σκεῦος παρεμβολῶν ἐν ὕψει — «сосуд ополчений в высоте» (παρεμβολή — стан, ополчение). ἐν στερεώματι οὐρανοῦ ἐκλάμπων — «на тверди небесной сияющий» (ἐκλάμπω — сиять)."
  10: "κάλλος οὐρανοῦ δόξα ἄστρων — «красота неба — слава звёзд» (κάλλος — красота; ἄστρον — звезда). κόσμος φωτίζων ἐν ὑψίστοις κυρίου — «украшение, светящее в вышних Господа» (κόσμος здесь — украшение; φωτίζω — освещать)."
  11: "ἐν λόγοις ἁγίου στήσονται κατὰ κρίμα — «по словам Святого станут по суду» (κρίμα — суд, чин). οὐ μὴ ἐκλυθῶσιν ἐν φυλακαῖς αὐτῶν — «не ослабнут в стражах своих» (ἐκλύω — ослабевать; φυλακή — стража)."
  12: "ἰδὲ τόξον — «смотри на радугу» (τόξον — лук, радуга). εὐλόγησον τὸν ποιήσαντα αὐτό — «благослови Сотворившего её». σφόδρα ὡραῖον ἐν τῷ αὐγάσματι αὐτοῦ — «весьма прекрасна в сиянии своём» (αὔγασμα — сияние, блеск)."
  13: "ἐγύρωσεν οὐρανὸν ἐν κυκλώσει δόξης — «окружил небо кругом славы» (γυρόω — окружать; κύκλωσις — кружение, круг). χεῖρες ὑψίστου ἐτάνυσαν αὐτό — «руки Всевышнего распростёрли её» (τανύω — простирать)."
  14: "Προστάγματι αὐτοῦ κατέσπευσεν χιόνα — «повелением Его поспешил снег» (πρόσταγμα — повеление; χιών — снег). ταχύνει ἀστραπὰς κρίματος αὐτοῦ — «ускоряет молнии суда Своего» (ἀστραπή — молния; ταχύνω — ускорять)."
  15: "διὰ τοῦτο ἠνεῴχθησαν θησαυροί — «поэтому открылись сокровищницы» (θησαυρός — сокровищница). ἐξέπτησαν νεφέλαι ὡς πετεινά — «вылетели облака, как птицы» (ἐκπέτομαι — вылетать; νεφέλη — облако; πετεινόν — птица)."
  16: "ἐν μεγαλείῳ αὐτοῦ ἴσχυσεν νεφέλας — «в величии Своём Он укрепил облака» (μεγαλεῖον — величие; ἰσχύω — укреплять). διεθρύβησαν λίθοι χαλάζης — «раздробились камни града» (διαθρύπτω — раздроблять; χάλαζα — град)."
  17: "ἐν ὀπτασίᾳ αὐτοῦ σαλευθήσεται ὄρη — «в явлении Его потрясутся горы» (σαλεύω — колебать). ἐν θελήματι αὐτοῦ πνεύσεται νότος — «по воле Его повеет южный ветер» (θέλημα — воля; νότος — южный ветер)."
  18: "φωνὴ βροντῆς αὐτοῦ ὠνείδισεν γῆν — «голос грома Его укорил землю» (βροντή — гром; ὀνειδίζω — укорять). καταιγὶς βορέου καὶ συστροφὴ πνεύματος — «буря северного ветра и вихрь духа» (καταιγίς — буря; βορέας — северный ветер; συστροφή — вихрь, сгущение)."
  19: "ὡς πετεινὰ καθιπτάμενα πάσσει χιόνα — «как птицы, слетающие вниз, сыплет снег» (καθίπταμαι — слетать вниз; πάσσω — сыпать). ὡς ἀκρὶς καταλύουσα ἡ κατάβασις αὐτῆς — «как саранча, опускающаяся, — падение его» (ἀκρίς — саранча; κατάβασις — спуск)."
  20: "κάλλος λευκότητος αὐτῆς ἐκθαυμάσει ὀφθαλμός — «красоте белизны его изумится глаз» (λευκότης — белизна; ἐκθαυμάζω — изумляться). ἐπὶ τοῦ ὑετοῦ αὐτῆς ἐκστήσεται καρδία — «при дожде его ужаснётся сердце» (ὑετός — дождь; ἐξίστημι — приходить в изумление)."
  21: "πάχνην ὡς ἅλα ἐπὶ γῆς χέει — «иней, как соль, на землю льёт» (πάχνη — иней; χέω — лить). παγεῖσα γίνεται σκολόπων ἄκρα — «замёрзнув, становится остриями терний» (πήγνυμι — замораживать; σκόλοψ — терние, кол; ἄκρον — остриё)."
  22: "ψυχρὸς ἄνεμος βορέης πνεύσει — «холодный северный ветер повеет» (ψυχρός — холодный). παγήσεται κρύσταλλος ἐφ᾽ ὕδατος — «замёрзнет лёд на воде» (κρύσταλλος — лёд). ἐπὶ πᾶσαν συναγωγὴν ὕδατος καταλύσει — «на всякое собрание воды опустится» (συναγωγή — собрание). ὡς θώρακα ἐνδύσεται τὸ ὕδωρ — «как панцирь облечётся вода» (θώραξ — панцирь, броня)."
  23: "καταφάγεται ὄρη καὶ ἔρημον ἐκκαύσει — «пожрёт горы и пустыню сожжёт» (κατεσθίω — поедать; ἔρημος — пустыня). ἀποσβέσει χλόην ὡς πῦρ — «угасит траву, как огонь» (ἀποσβέννυμι — гасить; χλόη — молодая трава)."
  24: "ἴασις πάντων κατὰ σπουδὴν ὁμίχλη — «исцеление всех — поспешно туман» (ἴασις — исцеление; ὁμίχλη — туман). δρόσος ἀπαντῶσα ἀπὸ καύσωνος ἱλαρώσει — «роса, встречающая после зноя, обрадует» (δρόσος — роса; καύσων — зной; ἱλαρόω — веселить)."
  25: "Λογισμῷ αὐτοῦ ἐκόπασεν ἄβυσσον — «помыслом Своим Он успокоил бездну» (λογισμός — помысел; κοπάζω — успокаивать; ἄβυσσος — бездна). ἐφύτευσεν ἐν αὐτῇ νήσους — «насадил в ней острова» (φυτεύω — насаждать; νῆσος — остров)."
  26: "οἱ πλέοντες τὴν θάλασσαν — «плавающие по морю» (πλέω — плыть). διηγοῦνται τὸν κίνδυνον αὐτῆς — «рассказывают об опасности её» (κίνδυνος — опасность). ἀκοαῖς ὠτίων ἡμῶν θαυμάζομεν — «слухом ушей наших дивимся» (ἀκοή — слух; οὖς — ухо; θαυμάζω — дивиться)."
  27: "τὰ παράδοξα καὶ θαυμάσια ἔργα — «необычайные и дивные дела» (παράδοξος — необычайный; θαυμάσιος — дивный). ποικιλία παντὸς ζῴου — «разнообразие всякого животного» (ποικιλία — пестрота, разнообразие). κτῖσις κητῶν — «создание китов» (κτῖσις — создание; κῆτος — морское чудовище, кит)."
  28: "δι᾿ αὐτὸν εὐοδοῖ ἄγγελος αὐτοῦ — «через Него преуспевает вестник Его» (εὐοδόω — давать успех; ἄγγελος — вестник). ἐν λόγῳ αὐτοῦ σύγκειται τὰ πάντα — «словом Его составлено всё» (σύγκειμαι — состоять, быть составленным)."
  29: "Πολλὰ ἐροῦμεν καὶ οὐ μὴ ἀφικώμεθα — «много скажем и не достигнем» (ἀφικνέομαι — достигать). συντέλεια λόγων Τὸ πᾶν ἐστιν αὐτός — «завершение слов: всё — Он» (συντέλεια — завершение)."
  30: "δοξάζοντες ποῦ ἰσχύσομεν — «славя, где [возьмём] силу» (δοξάζω — славить; ἰσχύω — быть в силах). αὐτὸς γὰρ ὁ μέγας παρὰ πάντα τὰ ἔργα αὐτοῦ — «ибо Он велик превыше всех дел Своих» (παρά с вин. — «сверх, больше»)."
  31: "φοβερὸς κύριος καὶ σφόδρα μέγας — «страшен Господь и весьма велик» (φοβερός — страшный). θαυμαστὴ ἡ δυναστεία αὐτοῦ — «дивно могущество Его» (δυναστεία — власть, могущество)."
  32: "δοξάζοντες κύριον ὑψώσατε καθ᾽ ὅσον ἂν δύνησθε — «славя Господа, возвышайте, сколько можете» (ὑψόω — возвышать; δύναμαι — мочь). ὑπερέξει γὰρ καὶ ἔτι — «ибо Он превзойдёт ещё» (ὑπερέχω — превосходить)."
  33: "πληθύνατε ἐν ἰσχύι — «умножьтесь в силе»; μὴ κοπιᾶτε — «не трудитесь [напрасно]» (κοπιάω — утруждаться); οὐ γὰρ μὴ ἀφίκησθε — «ибо не достигнете»."
  34: "τίς ἑόρακεν αὐτὸν καὶ ἐκδιηγήσεται — «кто видел Его и расскажет» (ἐκδιηγέομαι — возвещать подробно). τίς μεγαλυνεῖ αὐτὸν καθώς ἐστιν — «кто прославит Его, как Он есть» (μεγαλύνω — величать)."
  35: "πολλὰ ἀπόκρυφά ἐστιν μείζονα τούτων — «много сокрытого, большее этого» (ἀπόκρυφος — сокрытый; μείζων — больший). ὀλίγα γὰρ ἑωράκαμεν τῶν ἔργων αὐτοῦ — «ибо немногое мы видели из дел Его»."
  36: "πάντα γὰρ ἐποίησεν ὁ κύριος — «ибо всё сотворил Господь». τοῖς εὐσεβέσιν ἔδωκεν σοφίαν — «благочестивым дал мудрость» (εὐσεβής — благочестивый; σοφία — мудрость)."
