# jp-box, Деяния апостолов, глава 1. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 1: пролог (1–2), сорок дней и вознесение (3–11), ожидание в горнице (12–14),
# речь Петра об Иуде и избрание Матфия (15–26).
# Красное (<j>): только 1:4–5 и 1:7–8 — слова воскресшего Господа. Слова ангелов
# (1:11), Петра (1:16–22, 1:24–25) и молитва собрания — не красные. Синего (<mo>)
# в главе нет: Богородица в 1:14 только упомянута.
# 〔…〕: 1:15 — церковное μαθητῶν (в базе ἀδελφῶν; Синодальный «посреди учеников»).
# jp-ni не использовался.

tr_code: jp-box
book: act
chapter: 1
draft: true

verses:
  1: "テオフィロよ、わたしは第一[だいいち]の書[しょ]に、イエスが行[おこな]い始[はじ]め、教[おし]え始[はじ]められたすべてのことを書[か]き記[しる]した。"
  2: "天[てん]に上[あ]げられる日[ひ]まで、ご自分[じぶん]がお選[えら]びになった使徒[しと]たちに、{聖霊[せいれい]|聖神[せいしん]}によって命[めい]じをお与[あた]えになった。"
  3: "イエスは苦[くる]しみを受[う]けられた後[のち]、多[おお]くの確[かく]かな証[あかし]によって、ご自分[じぶん]が生[い]きておられることを彼[かれ]らに示[しめ]された。すなわち、四十日[しじゅうにち]の間[あいだ]、彼[かれ]らに現[あらわ]れて、神[かみ]の国[くに]のことを語[かた]られたのである。"
  4: "そして、彼[かれ]らと集[あつ]まっておられたとき、彼[かれ]らに命[めい]じて言[い]われた。「<j>エルサレムを離[はな]れず、父[ちち]が約束[やくそく]されたもの、すなわち、あなたがたがわたしから聞[き]いたものを待[ま]ちなさい。</j>"
  5: "<j>ヨハネは水[みず]によって洗礼[せんれい]を授[さず]けたが、あなたがたは、この後[のち]、多[おお]くの日[ひ]を経[へ]ないうちに、{聖霊[せいれい]|聖神[せいしん]}によって洗礼[せんれい]を受[う]けるであろう。</j>」"
  6: "そこで、集[あつ]まった彼[かれ]らは、イエスに問[と]うて言[い]った。「主[しゅ]よ、今[いま]、この時[とき]に、あなたはイスラエルの国[くに]を興[おこ]されるのですか。」"
  7: "イエスは彼[かれ]らに言[い]われた。「<j>父[ちち]がご自身[じしん]の権限[けんげん]によって定[さだ]められた時[とき]と期[き]は、あなたがたの知[し]ることではない。</j>"
  8: "<j>しかし、{聖霊[せいれい]|聖神[せいしん]}があなたがたの上[うえ]に臨[のぞ]むとき、あなたがたは力[ちから]を受[う]け、エルサレム、ユダヤ全[ぜん]土[ど]、サマリア、また地[ち]の果[は]てに至[いた]るまで、わたしの証人[しょうにん]となるであろう。</j>」"
  9: "こう言[い]われた後[のち]、彼[かれ]らが見[み]ている間に、イエスは上[あ]げられた。すると、雲[くも]がイエスを覆[おお]い、彼[かれ]らの目[め]から見[み]えなくなった。"
  10: "イエスが上[あ]がって行[い]かれるとき、彼[かれ]らは天[てん]をじっと見[み]つめていた。すると、見[み]よ、白[しろ]い衣[ころも]を着[き]た二人[ふたり]の男[おとこ]が、彼[かれ]らのそばに立[た]っていた。"
  11: "「ガリラヤの人[ひと]たちよ、なぜ天[てん]を見[み]上[あ]げて立[た]っているのか。あなたがたのところから天[てん]に上[あ]げられたこのイエスは、あなたがたが天[てん]に上[あ]がって行[い]かれるのを見[み]たのと同[おな]じように、また来[こ]られる。」"
  12: "そこで、彼[かれ]らは、オリーブ山[やま]と呼[よ]ばれる山[やま]からエルサレムへ帰[かえ]った。この山[やま]はエルサレムに近[ちか]く、安息日[あんそくび]の道[みち]のりほどのところにある。"
  13: "彼[かれ]らは都[みやこ]に入[はい]ると、二階[にかい]の部屋[へや]へ上[のぼ]った。そこに泊[と]まっていたのは、ペトロ、ヨハネ、ヤコブ、アンデレ、ピリポ、トマス、バルトロマイ、マタイ、アルファイの子[こ]ヤコブ、熱心党[ねっしんとう]のシモン、ヤコブの子[こ]ユダであった。"
  14: "この人[ひと]たちは皆[みな]、心[こころ]を一[ひと]つにして、婦人[ふじん]たち、イエスの母[はは]マリア、またイエスの兄弟[きょうだい]たちとともに、ひたすら祈[いの]りに励[はげ]んでいた。"
  15: "そのころ、ペトロは〔弟子[でし]たち〕の真[ま]ん中[なか]に立[た]って言[い]った。そこに集[あつ]まった人々[ひとびと]の数[かず]は、およそ百二十人[ひゃくにじゅうにん]であった。"
  16: "「兄弟[きょうだい]たちよ、{聖霊[せいれい]|聖神[せいしん]}がダビデの口[くち]を通[とお]して、イエスを捕[と]らえた者[もの]たちの導[みちび]き手[て]となったユダについて預言[よげん]された聖書[せいしょ]の言[こと]葉[ば]は、成就[じょうじゅ]しなければならなかった。"
  17: "彼[かれ]はわたしたちの数[かず]に加[くわ]えられ、この務[つと]めの割[わ]り当[あ]てを受[う]けていたのである。"
  18: "ところが、このユダは不義[ふぎ]の報酬[ほうしゅう]で土地[とち]を買[か]い、まっさかさまに落[お]ちて腹[はら]が裂[さ]け、内臓[ないぞう]がすべて流[なが]れ出[で]た。"
  19: "これがエルサレムに住[す]むすべての者[もの]に知[し]れ渡[わた]り、そのため、この土地[とち]は彼[かれ]らの言[こと]葉[ば]でアケルダマ、すなわち「血[ち]の地[ち]」と呼[よ]ばれるようになった。"
  20: "「詩篇[しへん]の書[しょ]にこう書[か]かれているからである。『その住[す]まいは荒[あ]れ果[は]てて、そこに住[す]む者[もの]がだれもいなくなるように。』また、『その職[しょく]をほかの者[もの]が取[と]るように。』」"
  21: "だから、主[しゅ]イエスがわたしたちの間[あいだ]を出[で]入[い]りされたすべての間[あいだ]、わたしたちと一緒[いっしょ]にいた人[ひと]たちのうちから、"
  22: "すなわち、ヨハネの洗礼[せんれい]から始[はじ]めて、主[しゅ]がわたしたちを離[はな]れて天[てん]に上[あ]げられた日[ひ]まで、いつもわたしたちとともにいた者[もの]のうち、一人[ひとり]が、わたしたちとともにイエスの復活[ふっかつ]の証人[しょうにん]となるべきである。」"
  23: "そこで、彼[かれ]らは、バルサバと呼[よ]ばれ、またユストという名[な]も持[も]つヨセフと、マティアの二人[ふたり]を立[た]てた。"
  24: "そして、祈[いの]って言[い]った。「主[しゅ]よ、すべての者[もの]の心[こころ]をご存[ぞん]じの方[かた]よ、あなたがこの二人[ふたり]のうちからお選[えら]びになった一人[ひとり]を、お示[しめ]しください。"
  25: "この務[つと]めと使徒職[しとしょく]の場所[ばしょ]を受[う]けさせてください。ユダはこれから離[はな]れて、自分[じぶん]の行[ゆ]くべき所[ところ]へ行[い]ったのですから。」"
  26: "そこで、彼[かれ]らは二人[ふたり]のために籤[くじ]を引[ひ]いた。籤[くじ]はマティアに当[あ]たり、マティアは十一人[じゅういちにん]の使徒[しと]たちの列[れつ]に加[くわ]えられた。"

notes:
  1: "λόγος — «слово, повествование»; 書. ἤρξατο ποιεῖν τε καὶ διδάσκειν — «начал делать и учить»; 行い始め、教え始められた."
  2: "ἐντειλάμενος — «заповедав»; 命じをお与えになった. ἀνελήμφθη — «был вознесён»; 天に上げられる. Длинный период 1–2 разрезан по стихам."
  3: "τεκμήρια — «неопровержимые доказательства»; 確かな証. ὀπτανόμενος — «являясь»; 現れて. δι᾿ ἡμερῶν τεσσαράκοντα — 四十日の間."
  4: "συναλιζόμενος — «собираясь вместе» (не «разделяя трапезу»); 集まっておられた. Слова Господа — красные, 4–5."
  5: "οὐ μετὰ πολλὰς ταύτας ἡμέρας — «не через много дней после этих»; 多くの日を経ないうちに."
  6: "ἀποκαθιστάνεις — «восстанавливаешь»; 興される. Вопрос апостолов — не красный."
  7: "ἐν τῇ ἰδίᾳ ἐξουσίᾳ — «в Своей власти»; ご自身の権限によって."
  8: "μάρτυς — 証人. Границы свидетельства: Иерусалим, вся Иудея, Самария, до края земли."
  9: "ἐπήρθη — «был поднят»; 上げられた. νεφέλη ὑπέλαβεν — 雲が覆い."
  10: "ἄνδρες δύο — «два мужа»; 二人の男. В тексте не названы ангелами (ср. 1:11)."
  11: "Слова ангелов — не красные. ὃν τρόπον — «таким же образом»; 同じように."
  12: "σαββάτου ἔχον ὁδόν — «имея путь субботы», около километра; 安息日の道のり. Ἐλαιών — オリーブ山."
  13: "ὑπερῷον — 二階の部屋, как Лк 22:12. Порядок имён по греч. Ἰούδας Ἰακώβου — ヤコブの子ユダ (у jp-joc ошибочно «брат Иакова»)."
  14: "προσκαρτεροῦντες — «постоянно пребывая»; ひたすら励んでいた. Мария только упомянута — синего нет."
  15: "μαθητῶν — чтение Церкви (Синодальный «посреди учеников», jp-joc「門徒の中に」); в базе ἀδελφῶν, поэтому 弟子 в 〔…〕. ὄχλος ὀνομάτων — «толпа имён», то есть человек; в базе эти слова стоят в квадратных скобках — 〔…〕 не ставятся."
  16: "ἔδει πληρωθῆναι — «надлежало исполниться»; 成就しなければならなかった. ὁδηγός — 導き手."
  17: "κλῆρος — «жребий, удел»; 割り当て."
  18: "πρηνὴς γενόμενος — «упав ничком»; まっさかさまに落ちて."
  19: "διαλέκτῳ — 言葉. Ἀκελδαμάχ — арамейское «поле крови»; сноска на 血の田 уже стоит при первом упоминании в корпусе (Мф 27:8)."
  20: "Пс 68:26 и 108:8 по LXX. ἐπαυλίς — 住まい; ἐπισκοπή — 職."
  21: "εἰσῆλθεν καὶ ἐξῆλθεν ἐφ᾿ ἡμᾶς — «входил и выходил к нам»; 出入りされた."
  22: "Стих продолжает речь 1:16–22. ἀρξάμενος ἀπὸ τοῦ βαπτίσματος — 洗礼から始めて."
  23: "Βαρσαββᾶς, ἐπεκλήθη Ἰοῦστος — バルサバ、ユスト."
  24: "καρδιογνῶστα — «сердцеведец»; 心をご存じの方. Молитва собрания — не красная."
  25: "ἀποστολή — 使徒職. τόπον τὸν ἴδιον — 自分の行くべき所."
  26: "ἔδωκαν κλήρους — «бросили жребий»; 籤を引いた. συγκατεψηφίσθη — 列に加えられた."
