# jp-box, Варух, глава 5. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для книги есть только в 3:36–4:4; в главе 5 его нет.
# jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Нумерация по gr: 9 стихов; совпадает со слав. и Синодальным, точек-лакун нет.
# Глава 5 — завершение пророчества Иерусалиму (4:5–5:9): 1–4 «сними одежду плача»,
# «облекись в правду», венец славы, новое имя «мир правды и слава богочестия»;
# 5–9 «встань, Иерусалим, на высоте»: дети собраны от запада до востока, вышли
# пешими — возвращаются несомыми со славою, горы и холмы понижаются, долины
# наполняются, леса осеняют Израиля, Бог ведёт его светом славы Своей.
# Голоса и кавычки: вся глава — авторская (пророческая) речь без кавычек; в 5:4 имя
# «Мир правды и слава богочестия» поставлено в 「…» как нарекаемое имя (по образцу ru,
# где оно в кавычках). Красно-синего нет.
# 〔…〕 нет: все 9 стихов и все слова есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 冠, 玉座, 敬虔, 義, 栄光 уже в корпусе.
# Имена: エルサレム, イスラエル, シオン — по корпусу.

tr_code: jp-box
book: var
chapter: 5
draft: true

verses:
  1: "エルサレムよ、悲[かな]しみと苦[くる]しみの衣[ころも]を脱[ぬ]ぎ、神[かみ]から与[あた]えられる栄光[えいこう]の美[うつく]しさを、永遠[えいえん]に身[み]にまといなさい。"
  2: "神[かみ]から与[あた]えられる義[ぎ]の衣[ころも]をまとい、永遠[えいえん]の方[かた]の栄光[えいこう]の冠[かんむり]を頭[あたま]に戴[いただ]きなさい。"
  3: "神[かみ]は、天[てん]の下[した]のすべてに、あなたの輝[かがや]きを示[しめ]されるからである。"
  4: "あなたの名[な]は、神[かみ]によって永遠[えいえん]に「義[ぎ]の平和[へいわ]、敬虔[けいけん]の栄光[えいこう]」と呼ばれる。"
  5: "エルサレムよ、立[た]ち上[あ]がり、高[たか]い所[ところ]に立[た]って、東[ひがし]の方[ほう]を見回[みまわ]しなさい。あなたの子[こ]どもたちが、聖[せい]なる方[かた]の言葉[ことば]によって、日[ひ]の沈[しず]む西[にし]から日[ひ]の昇[のぼ]る東[ひがし]まで集[あつ]められ、神[かみ]の記念[きねん]によって喜[よろこ]びながら来[き]ているのを、見[み]なさい。"
  6: "彼らはあなたのもとから、敵[てき]に引[ひ]かれて歩[ある]いて出[で]て行[い]った。しかし神[かみ]は彼らを、王[おう]の国[くに]の子[こ]らとして、栄光[えいこう]とともに担[かつ]がれてあなたのもとへ連[つ]れ戻[もど]される。"
  7: "神[かみ]は、すべての高[たか]い山[やま]と永遠[えいえん]の丘[おか]を低[ひく]くし、谷[たに]を満[み]たして地[ち]を平[たい]らにされるよう定[さだ]められた。イスラエルが神[かみ]の栄光[えいこう]によって安[あん]全[ぜん]に歩[あゆ]むためである。"
  8: "また、森[もり]とすべての香[かお]り高[たか]い木[き]が、神[かみ]の命[めい]によってイスラエルに陰[かげ]を落[お]とした。"
  9: "神[かみ]は喜[よろこ]びとともに、ご自分[じぶん]の栄光[えいこう]の光[ひかり]によってイスラエルを先導[せんどう]される。それは、ご自身[じしん]から出[で]る憐[あわ]れみと義[ぎ]とによる。"

notes:
  1: "ἔκδυσαι, Ιερουσαλημ, τὴν στολὴν τοῦ πένθους καὶ τῆς κακώσεώς σου — «сними, Иерусалим, одежду плача и озлобления твоего» (ἐκδύω; κακώσις — 苦しみ); ἔνδυσαι τὴν εὐπρέπειαν τῆς παρὰ τοῦ θεοῦ δόξης εἰς τὸν αἰῶνα — «облекись в благолепие славы от Бога в век» (ἐνδύω; εὐπρέπεια — благолепие, 美しさ)."
  2: "περιβαλοῦ τὴν διπλοῖδα τῆς παρὰ τοῦ θεοῦ δικαιοσύνης — «облекись в двойную одежду правды от Бога» (περιβάλλω; διπλοίς — верхняя одежда, мантия, 衣; слав. «во одежду правды»); ἐπίθου τὴν μίτραν ἐπὶ τὴν κεφαλήν σου — «возложи венец (повязку) на голову твою» (μίτρα — головная повязка, венец, 冠); τῆς δόξης τοῦ αἰωνίου — «славы Вечного»."
  3: "ὁ γὰρ θεὸς δείξει — «ибо Бог покажет» (δείκνυμι); τῇ ὑπ᾽ οὐρανὸν πάσῃ — «всей поднебесной» (ἡ ὑπ᾽ οὐρανόν — 天の下); τὴν σὴν λαμπρότητα — «светлость твою» (λαμπρότης — 輝き)."
  4: "κληθήσεται γάρ σου τὸ ὄνομα παρὰ τοῦ θεοῦ — «наречётся имя твоё от Бога» (καλέω в пассиве); εἰς τὸν αἰῶνα — «в век»; Εἰρήνη δικαιοσύνης καὶ δόξα θεοσεβείας — «Мир правды и слава богочестия» (θεοσέβεια — благочестие, 敬虔): имя-титул, передано в 「…」 по образцу ru. В греч. текст заканчивается разделительным тире."
  5: "ἀνάστηθι, Ιερουσαλημ, καὶ στῆθι ἐπὶ τοῦ ὑψηλοῦ — «встань, Иерусалим, и стань на высоком» (ἀνίστημι; ὕψος); περίβλεψαι πρὸς ἀνατολάς — «оглянись на восток»; ἰδέ σου συνηγμένα τὰ τέκνα ἀπὸ ἡλίου δυσμῶν ἕως ἀνατολῶν — «увидь детей твоих, собранных от заката солнца до востока» (δυσμή — 西, ἀνατολή — 東); τῷ ῥήματι τοῦ ἁγίου — «словом Святого» (ῥῆμα — 言葉); χαίροντας τῇ τοῦ θεοῦ μνείᾳ — «радуясь памяти Божией» (μνεία — 記念)."
  6: "ἐξῆλθον γὰρ παρὰ σοῦ πεζοὶ ἀγόμενοι ὑπὸ ἐχθρῶν — «ибо вышли от тебя пешими, ведомые врагами» (πεζός — пеший; ἄγω — вести); εἰσάγει δὲ αὐτοὺς ὁ θεὸς πρὸς σὲ αἰρομένους μετὰ δόξης — «а вводит их Бог к тебе несомыми со славою» (εἰσάγω; αἴρω — 担う); ὡς θρόνον βασιλείας — «как престол царства» (θρόνος — 王座): в LXX так, в слав. «яко сыны царствия» (王国の子ら); в тексте по csl, чтение LXX отмечено."
  7: "συνέταξεν ὁ θεὸς ταπεινοῦσθαι πᾶν ὄρος ὑψηλὸν — «Бог определил унизиться всякой высокой горе» (συντάσσω; ταπεινόω); θῖνας ἀενάους — «холмы вечные» (θίς — песчаный холм, дюна; ἀέναος — вечный); φάραγγας πληροῦσθαι εἰς ὁμαλισμὸν τῆς γῆς — «долинам наполниться для уравнения земли» (φάραγξ — ущелье; ὁμαλισμός — выравнивание); ἵνα βαδίσῃ Ισραηλ ἀσφαλῶς τῇ τοῦ θεοῦ δόξῃ — «чтобы шёл Израиль безопасно славою Божиею» (ἀσφαλῶς — 安全に)."
  8: "ἐσκίασαν δὲ καὶ οἱ δρυμοὶ — «осенили и дубравы» (σκιάζω — осенять; δρυμός — 森); πᾶν ξύλον εὐωδίας — «всякое дерево благовония» (εὐωδία — 香り); τῷ Ισραηλ προστάγματι τοῦ θεοῦ — «Израилю по повелению Божию» (πρόσταγμα — 命)."
  9: "ἡγήσεται γὰρ ὁ θεὸς Ισραηλ μετ᾽ εὐφροσύνης — «ибо поведёт Бог Израиля с веселием» (ἡγέομαι — вести, идти впереди, 先導する); τῷ φωτὶ τῆς δόξης αὐτοῦ — «светом славы Своей»; σὺν ἐλεημοσύνῃ καὶ δικαιοσύνῃ τῇ παρ᾽ αὐτοῦ — «с милостью и правдою, которые от Него» (ἐλεημοσύνη — 憐れみ; δικαιοσύνη — 義)."
