verses:
  1: "バラムはバラクに言[い]った。「私[わたし]のために、ここに七[なな]つの祭壇[さいだん]を建[た]て、ここに七[なな]つの子牛[こうし]と七[なな]つの雄羊[おひつじ]を用意[ようい]してください。」"
  2: "バラクはバラムが言[い]ったとおりに行[おこな]い、子牛[こうし]と雄羊[おひつじ]を祭壇[さいだん]の上[うえ]に捧[ささ]げた。"
  3: "バラムはバラクに言[い]った。「あなたの犠牲[ぎせい]のそばに立[た]っていなさい。私[わたし]は行[い]く。もしかすると、神[かみ]が私[わたし]に会[あ]いに現[あらわ]れるかもしれない。神[かみ]が私[わたし]に示[しめ]すこと、それをあなたに告[つ]げよう。」バラクは自分[じぶん]の犠牲[ぎせい]のそばに立[た]った。バラムは神[かみ]に問[と]うために行[い]き、まっすぐに進[すす]んだ。"
  4: "神[かみ]はバラムに現[あらわ]れた。バラムは神[かみ]に言[い]った。「私[わたし]は七[なな]つの祭壇[さいだん]を用意[ようい]し、子牛[こうし]と雄羊[おひつじ]を祭壇[さいだん]の上[うえ]に捧[ささ]げました。」"
  5: "神[かみ]はバラムの口[くち]に言葉[ことば]を置[お]き、言[い]われた。「バラクのもとへ戻[もど]って、こう語[かた]りなさい。」"
  6: "彼[かれ]は彼[かれ]のもとへ戻[もど]った。見[み]よ、彼[かれ]は自分[じぶん]の燔祭[はんさい]のそばに立[た]っており、モアブの長[おさ]たちはみな彼[かれ]とともにいた。"
  7: "神[かみ]の霊[れい]が彼[かれ]の上[うえ]に臨[のぞ]んだ。彼[かれ]はそのたとえを取[と]り上[あ]げて言[い]った。「メソポタミアからバラクが私[わたし]を呼[よ]び寄[よ]せた。モアブの王[おう]が、東[ひがし]の山[やま]々から、こう言[い]った。『来[き]て、私[わたし]のためにヤコブを呪[のろ]え。来[き]て、私[わたし]のためにイスラエルを呪[のろ]え。』"
  8: "主[しゅ]が呪[のろ]わない者[もの]を、どうして私[わたし]が呪[のろ]えようか。神[かみ]が呪[のろ]わない者[もの]を、どうして私[わたし]が呪[のろ]えようか。"
  9: "山[やま]々の頂[いただき]から私[わたし]は彼[かれ]を見[み]、丘[おか]の上[うえ]から彼[かれ]を見晴[みは]らす。見[み]よ、この民[たみ]はひとりで住[す]み、国々[くにぐに]の間[あいだ]で数[かぞ]えられない。"
  10: "誰[だれ]がヤコブの種[たね]を数[かぞ]え尽[つ]くしただろうか。誰[だれ]がイスラエルの民[たみ]の数[かず]を数[かぞ]え上げるだろうか。私[わたし]の魂[たましい]が正[ただ]しい者[もの]たちの魂[たましい]のうちに死[し]ぬように。私[わたし]の種[たね]が彼[かれ]らの種[たね]のようになるように。」"
  11: "バラクはバラムに言[い]った。「あなたは私[わたし]に何[なに]をしたのか。私[わたし]は敵[てき]を呪[のろ]うためにあなたを呼[よ]んだのに、見[み]よ、あなたは祝福[しゅくふく]をもって祝福[しゅくふく]してしまった。」"
  12: "彼[かれ]は答[こた]えて言[い]った。「神[かみ]が私[わたし]の口[くち]に置[お]かれることなら何[なん]でも、それを語[かた]るように私[わたし]は守[まも]るのではありませんか。」"
  13: "バラクは彼[かれ]に言[い]った。「私[わたし]とともに別[べつ]の場所[ばしょ]へ来[き]なさい。そこからあなたは彼[かれ]をすべては見[み]ない。ただその一部[いちぶ]だけを見[み]るのであって、すべてを見[み]ることはない。そこから彼[かれ]を私[わたし]のために呪[のろ]ってくれ。」"
  14: "彼[かれ]は彼[かれ]を野[の]の見張[みは]り所[じょ]、削[けず]り出[だ]された岩[いわ]の頂[いただき]へ連[つ]れて行[い]き、そこに七[なな]つの祭壇[さいだん]を建[た]て、子牛[こうし]と雄羊[おひつじ]を祭壇[さいだん]の上[うえ]に捧[ささ]げた。"
  15: "バラムはバラクに言[い]った。「あなたの犠牲[ぎせい]のそばに立[た]っていなさい。私[わたし]は神[かみ]に問[と]うために行[い]く。」"
  16: "神[かみ]はバラムに会[あ]い、言葉[ことば]を彼[かれ]の口[くち]に置[お]いて言[い]われた。「バラクのもとへ戻[もど]って、こう語[かた]りなさい。」"
  17: "彼[かれ]は彼[かれ]のもとへ戻[もど]った。見[み]よ、彼[かれ]は自分[じぶん]の燔祭[はんさい]のそばに立[た]っており、モアブの長[おさ]たちはみな彼[かれ]とともにいた。バラクは彼[かれ]に言[い]った。「主[しゅ]は何[なに]を語[かた]られたのか。」"
  18: "彼[かれ]はそのたとえを取[と]り上[あ]げて言[い]った。「バラクよ、立[た]って聞[き]け。セポルの子[こ]よ、耳[みみ]を傾[かたむ]けよ。"
  19: "神[かみ]は人[ひと]のように欺[あざむ]かれる者[もの]ではなく、人[ひと]の子[こ]のように脅[おびや]かされて変[か]わる者[もの]でもない。彼[かれ]が言[い]ったのに、行[おこな]わないことがあろうか。語[かた]ったのに、成[な]し遂[と]げないことがあろうか。"
  20: "見[み]よ、私[わたし]は祝福[しゅくふく]するために受[う]け入[い]れられている。祝福[しゅくふく]し、引[ひ]き返[かえ]さない。"
  21: "彼[かれ]のうちに労苦[ろうく]はなく、イスラエルのうちに苦[くる]しみは見[み]られない。主[しゅ]なるその神[かみ]が彼[かれ]とともにいて、長[おさ]たちの栄[えい]光[こう]が彼[かれ]のうちにある。"
  22: "神[かみ]は彼[かれ]らをエジプトから導[みちび]き出[だ]された。彼[かれ]には野牛[やぎゅう]の輝[かがや]きがある。"
  23: "ヤコブのうちに鳥占[とりうら]いもなく、イスラエルのうちに占[うらな]いもない。時[とき]が来[く]れば、ヤコブに、イスラエルに、神[かみ]が何[なに]を成[な]し遂[と]げられるかが告[つ]げられる。"
  24: "見[み]よ、この民[たみ]は獅子[しし]の子[こ]のように起[お]き上[あ]がり、獅子[しし]のように勇[いさ]み立[た]つ。獲物[えもの]を食[た]べ、刺[さ]された者[もの]の血[ち]を飲[の]むまで、眠[ねむ]ることはない。」"
  25: "バラクはバラムに言[い]った。「私[わたし]のために彼[かれ]を呪[のろ]いで呪[のろ]うことも、祝福[しゅくふく]して祝福[しゅくふく]することもやめてくれ。」"
  26: "バラムは答[こた]えてバラクに言[い]った。「私[わたし]はあなたに、『神[かみ]が語[かた]ることは何[なん]でも、それを私[わたし]は行[おこな]う』と言[い]ったではないか。」"
  27: "バラクはバラムに言[い]った。「さあ、私[わたし]はあなたを別[べつ]の場所[ばしょ]へ連[つ]れて行[い]く。もしかすると、神[かみ]の目[め]にかなうなら、そこから彼[かれ]を私[わたし]のために呪[のろ]ってくれ。」"
  28: "バラクはバラムをフォゴルの頂[いただき]へ連[つ]れて行[い]った。それは荒野[こうや]へと延[の]びている。"
  29: "バラムはバラクに言[い]った。「私[わたし]のために、ここに七[なな]つの祭壇[さいだん]を建[た]て、ここに七[なな]つの子牛[こうし]と七[なな]つの雄羊[おひつじ]を用意[ようい]してください。」"
  30: "バラクはバラムが言[い]ったとおりに行[おこな]い、子牛[こうし]と雄羊[おひつじ]を祭壇[さいだん]の上[うえ]に捧[ささ]げた。"

notes:
  1: "Οἰκοδόμησόν μοι … ἑπτὰ βωμούς — построй мне семь жертвенников (βωμός — «жертвенник», у LXX о языческих; в тексте 祭壇, как θυσιαστήριον). ἑτοίμασόν μοι — приготовь мне. ἑπτὰ μόσχους καὶ ἑπτὰ κριοὺς — семь тельцов и семь овнов (μόσχος, κριός — 雄羊)."
  2: "ὃν τρόπον εἶπεν αὐτῷ Βαλααμ — как сказал ему Валаам (ὅν τρόπον — «каким образом»). ἀνήνεγκεν μόσχον καὶ κριὸν ἐπὶ τὸν βωμόν — вознёс тельца и овна на жертвенник (ἀναφέρω; ед. ч. — по одному на каждый из семи, ср. ru «на каждом жертвеннике»)."
  3: "Παράστηθι ἐπὶ τῆς θυσίας σου — стань у жертвы твоей (παρίστημι; θυσία — 犠牲). εἴ μοι φανεῖται ὁ θεὸς ἐν συναντήσει — если явится мне Бог навстречу (εἰ + будущее — «может быть»; συνάντησις — «встреча»). ῥῆμα ὃ ἐάν μοι δείξῃ — слово, которое Он покажет (δείκνυμι). ἐπορεύθη εὐθεῖαν — пошёл прямо (εὐθεῖαν — наречие, «прямо»); ср. csl, где эта клауза перенесена в ст. 4."
  4: "ἐφάνη ὁ θεὸς τῷ Βαλααμ — явился Бог Валааму (φαίνω, pass.). εἶπεν πρὸς αὐτὸν Βαλααμ — сказал Ему Валаам (Βαλααμ — подлежащее, хотя стоит после αὐτόν; ср. csl «рече к нему валаам»). Τοὺς ἑπτὰ βωμοὺς ἡτοίμασα — семь жертвенников я приготовил (аорист с результатом)."
  5: "ἐνέβαλεν ὁ θεὸς ῥῆμα εἰς τὸ στόμα — вложил Бог слово в уста (ἐμβάλλω; ср. 22:38). Ἐπιστραφεὶς πρὸς Βαλακ — обратившись к Валаку. οὕτως λαλήσεις — так скажешь. Речь Бога — 「…」."
  6: "ἀπεστράφη πρὸς αὐτόν — возвратился к нему. ὅδε ἐφειστήκει — «вот, он стоял» (ὅδε; pluperfect ἐφίστημι). ἐπὶ τῶν ὁλοκαυτωμάτων αὐτοῦ — у всесожжений его (ὁλοκαύτωμα — 燔祭, мн. ч.). πάντες οἱ ἄρχοντες Μωαβ — все князья Моава."
  7: "ἐγενήθη πνεῦμα θεοῦ ἐπ᾽ αὐτῷ — был на нём Дух Божий (γίνομαι; πνεῦμα θεοῦ — 神の霊). ἀναλαβὼν τὴν παραβολὴν αὐτοῦ — приняв (подняв) своё изречение, т.е. начав пророческую речь (παραβολή — «притча, изречение»; たとえ). Ἐκ Μεσοποταμίας μετεπέμψατό με — из Месопотамии призвал меня (μεταπέμπω). ἐξ ὀρέων ἀπ᾽ ἀνατολῶν — от гор восточных."
  8: "τί ἀράσωμαι ὃν μὴ καταρᾶται κύριος — что прокляну того, кого не проклинает Господь? (ἀράομαι; оптатив в вопросе). ἢ τί καταράσωμαι ὃν μὴ καταρᾶται ὁ θεός; — параллелизм κύριος / ὁ θεός сохранён дословно (слав. «что проклену … или что зло реку»)."
  9: "ἀπὸ κορυφῆς ὀρέων ὄψομαι — с вершины гор увижу. ἀπὸ βουνῶν προσνοήσω — с холмов усмотрю (προσνοέω — «вникать, замечать»; отсюда 見晴らす). λαὸς μόνος κατοικήσει — народ будет жить отдельно. ἐν ἔθνεσιν οὐ συλλογισθήσεται — между народами не будет считаться (συλλογίζομαι — «счислять»)."
  10: "τίς ἐξηκριβάσατο τὸ σπέρμα Ιακωβ — кто точно исчислил семя Иакова (ἐξακριβάζω — «выведывать точно»; ru «песок Иакова» — по евр.). ἐξαριθμήσεται δήμους — сочтёт народы (δῆμος — «народ, племя»). ἀποθάνοι — да умрёт (оптатив пожелания). γένοιτο — да будет (оптатив). ὡς τὸ σπέρμα τούτων — как семя этих."
  11: "Τί πεποίηκάς μοι; — что ты сделал мне? (perfect). εἰς κατάρασιν ἐχθρῶν μου — на проклятие врагов моих (κατάρασις). κέκληκά σε — я призвал тебя (perfect καλέω). εὐλόγηκας εὐλογίᾳ — «благословил благословением» (датив внутреннего объекта, евр. конструкция; повтор сохранён)."
  12: "Οὐχὶ ὅσα ἐὰν ἐμβάλῃ ὁ θεὸς εἰς τὸ στόμα μου — не всё ли, что вложит Бог в уста мои (ἐμβάλλω, ср. 5). τοῦτο φυλάξω λαλῆσαι — это сохраню, чтобы говорить (φυλάσσω + inf.; ср. 22:35). Вопрос с οὐχί ожидает утвердительного ответа."
  13: "Δεῦρο ἔτι μετ᾽ ἐμοῦ — пойди ещё со мной. ἐξ ὧν οὐκ ὄψῃ αὐτὸν ἐκεῖθεν — откуда ты не увидишь его (ἀλλ᾽ ἢ — «но только»). μέρος τι αὐτοῦ ὄψῃ — только часть его увидишь. πάντας δὲ οὐ μὴ ἴδῃς — а всех не увидишь (οὐ μή + конъюнктив — сильное отрицание)."
  14: "εἰς ἀγροῦ σκοπιάν — на стражу поля, наблюдательный пункт (σκοπιά — «стража, вышка»). ἐπὶ κορυφὴν λελαξευμένου — на вершину высеченной [скалы] (ср. 21:20). ᾠκοδόμησεν ἐκεῖ ἑπτὰ βωμούς — построил там семь жертвенников."
  15: "Παράστηθι ἐπὶ τῆς θυσίας σου — стань у жертвы твоей (повтор 3-го). ἐγὼ δὲ πορεύσομαι ἐπερωτῆσαι τὸν θεόν — а я пойду вопросить Бога (ἐπερωτάω)."
  16: "συνήντησεν ὁ θεὸς τῷ Βαλααμ — встретил Бог Валаама (συναντάω). ἐνέβαλεν ῥῆμα εἰς τὸ στόμα αὐτοῦ — вложил слово в уста его. Ἀποστράφητι πρὸς Βαλακ — обратись (возвратись) к Валаку (ἀποστρέφω, imper. pass.)."
  17: "ὅδε ἐφειστήκει ἐπὶ τῆς ὁλοκαυτώσεως — вот, он стоял у всесожжения (ед. ч. здесь, ср. мн. ч. в 6). Τί ἐλάλησεν κύριος; — что говорил Господь? (вопрос Валака)."
  18: "Ἀνάστηθι, Βαλακ, καὶ ἄκουε — встань, Валак, и слушай. ἐνώτισαι — внемли (ἐνωτίζομαι, букв. «влагать в уши»). μάρτυς — «свидетель» (звательный падеж; слав. «свидетель»; слово стоит без пояснения и в евр. тексте тёмное). υἱὸς Σεπφωρ — сын Сепфора."
  19: "οὐχ ὡς ἄνθρωπος ὁ θεὸς διαρτηθῆναι — Бог не как человек, чтобы быть обманутым / колебаться (διαρτάω; слав. «колеблется»; евр. «лгать»). οὐδὲ ὡς υἱὸς ἀνθρώπου ἀπειληθῆναι — и не как сын человеческий, чтобы устрашиться и измениться (ἀπειλέω, pass.; слав. «изменяется»). αὐτὸς εἴπας οὐχὶ ποιήσει; — Он сказал — и не сделает? λαλήσει, καὶ οὐχὶ ἐμμενεῖ; — скажет и не исполнит (ἐμμένω — «пребывать»)."
  20: "εὐλογεῖν παρείλημμαι — я принят, чтобы благословлять (perfect pass. παραλαμβάνω). εὐλογήσω καὶ οὐ μὴ ἀποστρέψω — благословлю и не отвращу (οὐ μή — сильное отрицание). В отличие от ru, добавки «Он благословил» в LXX нет."
  21: "οὐκ ἔσται μόχθος ἐν Ιακωβ — не будет труда (бедствия) в Иакове (μόχθος — «тягота, труд»). οὐδὲ ὀφθήσεται πόνος — и не увидится страдание (πόνος). τὰ ἔνδοξα ἀρχόντων ἐν αὐτῷ — «славное начальников в нём» (ἔνδοξα — «славные дела, величие»; слав. «слава царская на нем»; ru «трубный царский звук» — по евр.)."
  22: "θεὸς ὁ ἐξαγαγὼν αὐτοὺς ἐξ Αἰγύπτου — Бог, выведший их из Египта. ὡς δόξα μονοκέρωτος αὐτῷ — «как слава единорога у него» (μονόκερως — «единорог», у LXX передаёт евр. рээм, дикий бык; отсюда 野牛, как в Пс 21 и 91; δόξα — «слава, великолепие»)."
  23: "οὐ γάρ ἐστιν οἰωνισμὸς ἐν Ιακωβ — ибо нет в Иакове птицегадания (οἰωνισμός — «гадание по птицам, примета»). οὐδὲ μαντεία — и нет прорицания. κατὰ καιρὸν ῥηθήσεται — в своё время будет сказано (ῥηθήσεται, pass.). τί ἐπιτελέσει ὁ θεός — что совершит Бог (ἐπιτελέω)."
  24: "ὡς σκύμνος ἀναστήσεται — как львёнок встанет (σκύμνος; 獅子の子). ὡς λέων γαυριωθήσεται — как лев возвеличится, воспрянет (γαυριάομαι — «гордиться, быть бодрым»; слав. «вознесется»). οὐ κοιμηθήσεται ἕως φάγῃ θήραν — не ляжет, пока не съест добычу (θήρα). αἷμα τραυματιῶν πίεται — кровь раненых будет пить (τραυματίας)."
  25: "Οὔτε κατάραις καταράσῃ μοι αὐτὸν — ни проклятиями не прокляни мне его (датив κατάραις — «проклятиями»; повтор корня). οὔτε εὐλογῶν μὴ εὐλογήσῃς αὐτόν — ни благословляя не благослови его (μὴ с конъюнктивом — запрет). Двойной оборот евр. сохранён."
  26: "ἀποκριθεὶς … εἶπεν — отвечая, сказал. Οὐκ ἐλάλησά σοι λέγων — не говорил ли я тебе, говоря (оборот с причастием; ср. 22:38). Τὸ ῥῆμα ὃ ἐὰν λαλήσῃ ὁ θεός — слово, которое скажет Бог. τοῦτο ποιήσω — это сделаю. Своя прежняя речь — 『…』."
  27: "Δεῦρο παραλάβω σε — пойди, я возьму тебя (παραλαμβάνω; конъюнктив в приглашении). εἰ ἀρέσει τῷ θεῷ — если будет угодно Богу (ἀρέσκω). καταρᾶσαί μοι αὐτὸν ἐκεῖθεν — прокляни мне его оттуда (καταράομαι)."
  28: "ἐπὶ κορυφὴν τοῦ Φογωρ — на вершину Фогора (Φογωρ — Фегор; フォゴル). τὸ παρατεῖνον εἰς τὴν ἔρημον — простирающуюся к пустыне (παρατείνω — «протягивать»)."
  29: "Повтор 23:1 дословно, с ὧδε вместо ἐνταῦθα («здесь»); в LXX оба стиха совпадают почти буквально."
  30: "καθάπερ εἶπεν αὐτῷ Βαλααμ — как сказал ему Валаам (καθάπερ — «подобно как»; в 2-м ὅν τρόπον). ἀνήνεγκεν μόσχον καὶ κριὸν ἐπὶ τὸν βωμόν — вознёс тельца и овна на жертвенник."
