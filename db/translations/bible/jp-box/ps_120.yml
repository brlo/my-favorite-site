# jp-box, Псалтирь, псалом 120. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация — славяно-синодальная (csl-ru): в слав. надписание отдельным стихом
# не стоит, поэтому наш стих 0 (надписание) влит в начало стиха 1; дальше номера 1..8.
# Псалом 120: взор к горам и источник помощи (1–2), непусыпный хранитель (3–4),
# сень одесную (5–6), хранение на всех путях (7–8).
# Красного и синего нет. Кавычек нет: в псалме нет прямой речи.
# 〔…〕 нет: перевод сделан по gr-lxx-byz, добавлений Церкви не вносилось.
# セラ (διάψαλμα) в этой главе нет.
# Сносок ⟨…⟩ нет: 助け, 守る者, 陰 уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: ps
chapter: 120
draft: true

verses:
  1: "登[とう]上[じょう]の歌[うた]。わたしは目[め]を上[あ]げて山[やま]々[やま]を仰[あお]ぐ。わたしの助[たす]けは、どこから来[く]るのか。"
  2: "わたしの助[たす]けは、天[てん]と地[ち]を造[つく]られた主[しゅ]から来[く]る。"
  3: "主[しゅ]はあなたの足[あし]を揺[ゆ]るがせない。あなたを守[まも]る方[かた]はまどろまない。"
  4: "見[み]よ、イスラエルを守[まも]る方[かた]は、まどろむことも、眠[ねむ]ることもない。"
  5: "主[しゅ]はあなたを守[まも]る方[かた]。主[しゅ]はあなたの右[みぎ]の手[て]を覆[おお]う陰[かげ]である。"
  6: "昼[ひる]は日[ひ]があなたを焼[や]かず、夜[よる]は月[つき]もあなたを害[そこな]わない。"
  7: "主[しゅ]はすべての災[わざわ]いからあなたを守[まも]り、あなたの魂[たましい]を守[まも]られる。"
  8: "主[しゅ]は、あなたが入[はい]るときも出[で]るときも、今[いま]からとこしえに至[いた]るまで守[まも]られる。"

notes:
  1: "Ὠιδὴ τῶν ἀναβαθμῶν — 登[とう]上[じょう]の歌. Надписание — стих 0 (в csl-ru отдельного стиха нет, влито в ст. 1) (в gr-lxx-byz и в ru-базе одно и то же, «Песнь восхождения»); скобками не маркируется. Ἦρα τοὺς ὀφθαλμούς μου εἰς τὰ ὄρη — わたしは目を上げて山々を仰ぐ (αἴρω — «поднимать»; ὄρη — мн. ч., «горы», отсюда 山々). Πόθεν ἥξει ἡ βοήθειά μου; — わたしの助けは、どこから来るのか (πόθεν — «откуда»; ἥξει — будущее от ἥκω, «приходить»). Вопрос сохранён без ответа внутри стиха, как в греч."
  2: "ἡ βοήθειά μου παρὰ κυρίου — わたしの助けは…主から来る (παρά + gen. — «от»). τοῦ ποιήσαντος τὸν οὐρανὸν καὶ τὴν γῆν — 天と地を造られた方 (формула Творца, ср. Пс 123:8, 133:3; повторяется в псалмах восхождений)."
  3: "μὴ δῷς εἰς σάλον τὸν πόδα σου — 主はあなたの足を揺るがせない (δίδωμι εἰς σάλον — «отдать в колебание»; σάλος — «зыбь, шатание»). μηδὲ νυστάξῃ ὁ φυλάσσων σε — あなたを守る方はまどろまない (νυστάζω — «дремать, кивать»; φυλάσσω — 守る). Подлежащее в греч. не названо; по контексту и по jp-joc («彼») поставлено 主 — это Тот же, о Ком ст. 2."
  4: "ἰδοὺ οὐ νυστάξει οὐδὲ ὑπνώσει ὁ φυλάσσων τὸν Ισραηλ — 見よ、イスラエルを守る方は、まどろむことも、眠ることもない (два разных глагола: νυστάζω «дремать» и ὑπνόω «спать» — оба сохранены; ср. ст. 3). 見よ — ἰδού, как по всему корпусу."
  5: "κύριος φυλάξει σε — 主はあなたを守る方 (букв. «Господь сохранит тебя»; по-японски именное предложение, чтобы сохранить параллелизм со следующим членом). κύριος σκέπη σου ἐπὶ χεῖρα δεξιάν σου — 主はあなたの右手を覆う陰 (σκέπη — «покров, сень»; ἐπί + acc. — «над, на»). 陰[かげ] — «тень, сень», не «темнота»."
  6: "ἡμέρας ὁ ἥλιος οὐ συγκαύσει σε — 昼は日があなたを焼かず (συγκαίω — «ожечь, спалить»; ἡμέρας — генетив времени). οὐδὲ ἡ σελήνη τὴν νύκτα — 夜は月もあなたを害わない (τὴν νύκτα — винительный времени; глагол подразумевается тот же). Симметрия 昼/日 и 夜/月 сохранена."
  7: "κύριος φυλάξει σε ἀπὸ παντὸς κακοῦ — 主はすべての災いからあなたを守り (κακός — «злой, дурной»; 災い — бедствие, а не «зло» в нравственном смысле). φυλάξει τὴν ψυχήν σου — あなたの魂を守られる (повтор φυλάξει сохранён повтором 守る)."
  8: "κύριος φυλάξει τὴν εἴσοδόν σου καὶ τὴν ἔξοδόν σου — あなたが入るときも出るときも…守られる (εἴσοδος/ἔξοδος — «вход/выход», т. е. весь путь; ср. Втор 28:6). ἀπὸ τοῦ νῦν καὶ ἕως τοῦ αἰῶνος — 今からとこしえに至るまで (формула, ср. Пс 120:8; 124:2; 130:3)."
