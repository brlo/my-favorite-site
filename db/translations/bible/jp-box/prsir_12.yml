# jp-box, Сирах, глава 12. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для книги нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 12: 1–7 о благодеяниях — кому творить добро; 8–12 о друге и враге,
# о недоверии врагу; 13–18 враг и его притворство.
# Прямой речи нет; в 12:12 слова учителя от первого лица (私の言葉) — авторский текст,
# не цитата. Кавычек в главе нет.
# Нумерация: 18 стихов, как в csl, но деление внутри разное: csl 12:5–6 делит гр. 12:5
# на два стиха (вторая половина у csl — начало 12:6), csl 12:13 соединяет гр. 12:13–14,
# csl 12:16–17 делят гр. 12:17. В тексте — деление по гр., весь csl-текст внесён.
# 〔…〕 нет: все стихи есть в gr-lxx-byz, текста csl сверх гр. нет.
# Сносок ⟨…⟩ нет: 恵み, 復讐, 魂, 鏡, 呪術師 и пр. уже в корпусе или понятны.
# Имён и топонимов в главе нет.

tr_code: jp-box
book: prsir
chapter: 12
draft: true

verses:
  1: "善[ぜん]を行[おこな]うなら、だれに対[たい]して行うかを知[し]れ。そうすれば、あなたの善[よ]い行いには恵[めぐ]みがある。"
  2: "敬虔[けいけん]な者[もの]に善[ぜん]を行[おこな]え。そうすれば報[むく]いを得[え]る。たとえその者からでなくとも、いと高[たか]き方[かた]から受[う]ける。"
  3: "悪[あく]に励[はげ]む者[もの]と、施[ほどこ]しを施さない者には善[ぜん]はない。"
  4: "敬虔[けいけん]な者[もの]に与[あた]えよ。罪人[つみびと]を助[たす]けるな。"
  5: "へりくだる者[もの]に善[ぜん]を行[おこな]え。不敬虔[ふけいけん]な者に与[あた]えるな。その者のパンを差[さ]し止[と]めよ。与えてはならない。その者がそれによってあなたを支配[しはい]しないためである。あなたがその者のために行うすべての善に対[たい]して、倍[ばい]の悪[あく]を受[う]けるからである。"
  6: "いと高[たか]き方[かた]も罪人[つみびと]を憎[にく]み、不敬虔[ふけいけん]な者[もの]に復讐[ふくしゅう]を報[むく]いられるからである。"
  7: "善[よ]い者[もの]に与[あた]えよ。罪人[つみびと]を助[たす]けるな。"
  8: "友[とも]は幸[さいわ]いのうちでは見分[みわ]けられず、敵[てき]は災[わざわ]いのうちでは隠[かく]れていない。"
  9: "人[ひと]の幸[さいわ]いのうちには、その敵[てき]も悲[かな]しみの中[なか]にあり、その不幸[ふこう]のうちには、友[とも]もまた離[はな]れ去[さ]る。"
  10: "あなたの敵[てき]を永遠[えいえん]に信[しん]じるな。銅[どう]が錆[さび]るように、その者[もの]の悪[あく]も錆びるからである。"
  11: "たとえその者[もの]がへりくだって身[み]をかがめて歩[あゆ]んでいても、あなたの魂[たましい]を注意[ちゅうい]して、その者から身を守[まも]れ。あなたはその者に対[たい]して、よく磨[みが]いた鏡[かがみ]のようになり、その者が最後[さいご]まで錆[さび]きっていないことを知[し]るだろう。"
  12: "その者[もの]を自分[じぶん]のそばに置[お]くな。あなたを押[お]しのけて、あなたの場所[ばしょ]に立[た]たないためである。その者を自分の右[みぎ]に座[すわ]らせるな。いつかあなたの座[ざ]を求[もと]め、あなたはついに私[わたし]の言葉[ことば]を悟[さと]り、私の言葉によって心[こころ]を刺[さ]されることのないためである。"
  13: "蛇[へび]に噛[か]まれた呪術師[じゅじゅつし]を、またすべて野獣[やじゅう]に近[ちか]づく者[もの]を、だれが憐[あわ]れむだろうか。"
  14: "罪人[つみびと]に近[ちか]づき、その罪[つみ]に交[まじ]わる者[もの]も、同[おな]じである。"
  15: "その者[もの]はしばらくあなたとともにいるが、あなたが傾[かたむ]けば、耐[た]えられない。"
  16: "敵[てき]はその唇[くちびる]で甘[あま]く語[かた]り、その心[こころ]ではあなたを穴[あな]に投[な]げ落[お]とそうと謀[はか]る。敵はその目[め]で涙[なみだ]を流[なが]すが、機会[きかい]を見[み]つければ、血[ち]に飽[あ]きることはない。"
  17: "もし災[わざわ]いがあなたに降[ふ]りかかれば、あなたより先[さき]にそこにその者[もの]を見[み]いだす。その者は助[たす]けるふりをして、あなたのかかとを切[き]り裂[さ]く。"
  18: "その者[もの]は頭[あたま]を振[ふ]り、手[て]を打[う]ち、多[おお]くをささやき、顔[かお]を変[か]える。"

notes:
  1: "ἐὰν εὖ ποιῇς — «если будешь делать добро»; γνῶθι τίνι ποιεῖς — «знай, кому делаешь»; ἔσται χάρις τοῖς ἀγαθοῖς σου — «будет благодать (χάρις) благам твоим» (слав. «благодать благим твоим»). χάρις здесь — благодарность, награда, а не благодать в догматическом смысле."
  2: "εὖ ποίησον εὐσεβεῖ — «сделай добро благочестивому»; ἀνταπόδομα — «воздаяние» (слав. «воздаяние»); εἰ μὴ παρ᾽ αὐτοῦ, ἀλλὰ παρὰ τοῦ ὑψίστου — «если не от него, то от Всевышнего» (слав. «аще не от него, то от вышняго»)."
  3: "τῷ ἐνδελεχίζοντι εἰς κακά — «постоянно пребывающему во зле» (ἐνδελεχίζω — упорствовать; слав. «прилежащему во злых»); τῷ ἐλεημοσύνην μὴ χαριζομένῳ — «не подающему милостыни» (ἐλεημοσύνη — милостыня, слав. «милостыня»)."
  4: "δὸς τῷ εὐσεβεῖ — «дай благочестивому»; μὴ ἀντιλάβῃ τοῦ ἁμαρτωλοῦ — «не помогай грешнику» (ἀντιλαμβάνομαι — поддерживать; слав. «не заступай»)."
  5: "εὖ ποίησον ταπεινῷ — «сделай добро смиренному»; ἐμπόδισον τοὺς ἄρτους αὐτοῦ — «загради хлебы его» (ἐμποδίζω — препятствовать; слав. «возбрани»); ἵνα μὴ ἐν αὐτοῖς σε δυναστεύσῃ — «чтобы он через них не возобладал тобой» (δυναστεύω); διπλάσια γὰρ κακὰ εὑρήσεις — «ибо сугубое зло найдёшь». Слав. делит гр. 12:5 на два стиха: вторая половина у csl идёт началом 12:6."
  6: "ὁ ὕψιστος ἐμίσησεν ἁμαρτωλούς — «Всевышний возненавидел грешников»; ἀποδώσει ἐκδίκησιν — «воздаст отмщение» (ἐκδίκησις). Слав. 12:6 соединяет вторую половину гр. 12:5 и весь гр. 12:6."
  7: "Повтор 12:4 с ἀγαθῷ вместо εὐσεβεῖ («дай доброму»); в LXX и csl стих повторён почти дословно, поэтому перевод близок к 12:4 — это особенность текста, а не ошибка."
  8: "οὐκ ἐκδικηθήσεται ἐν ἀγαθοῖς ὁ φίλος — «друг не будет испытан в благах»; ἐκδικέω здесь тёмное (букв. «мстить, наказывать»), слав. читает «не познан будет во благих друг» — в тексте по смыслу csl/ru: счастье не выявляет друга. οὐ κρυβήσεται ἐν κακοῖς ὁ ἐχθρός — «враг не скроется в злых»: беда не скрывает врага."
  9: "ἐν ἀγαθοῖς ἀνδρός — «в благах человека»; οἱ ἐχθροὶ αὐτοῦ ἐν λύπῃ — «враги его в печали»; ἐν τοῖς κακοῖς αὐτοῦ καὶ ὁ φίλος διαχωρισθήσεται — «в злых его и друг разлучится» (διαχωρίζω)."
  10: "μὴ πιστεύσῃς τῷ ἐχθρῷ σου εἰς τὸν αἰῶνα — «не верь врагу твоему вовек»; ὡς ὁ χαλκὸς ἰοῦται — «как медь (χαλκός) ржавеет» (ἰόω — покрываться ржавчиной, зеленью); οὕτως ἡ πονηρία αὐτοῦ — «так и злоба его». Злоба не исчезает, как ржавчина на меди; слав. «якоже бо медь ржавеет»."
  11: "ἐὰν ταπεινωθῇ καὶ πορεύηται συγκεκυφώς — «если смирится и будет ходить согбенным» (συγκύπτω — сгибаться); ἐπίστησον τὴν ψυχήν σου — «внимай душе твоей» (ἐφίστημι); ἔσῃ αὐτῷ ὡς ἐκμεμαχὼς ἔσοπτρον — «будешь ему как вычищенное зеркало» (ἐκμάσσω — стирать, полировать; ἔσοπτρον — зеркало); οὐκ εἰς τέλος κατίωσεν — «не до конца проржавел» (κατιόω)."
  12: "μὴ στήσῃς αὐτὸν παρὰ σεαυτῷ — «не ставь его при себе»; μὴ ἀνατρέψας σε στῇ ἐπὶ τὸν τόπον σου — «чтобы он, низринув тебя, не стал на место твоё» (ἀνατρέπω); μὴ καθίσῃς αὐτὸν ἐκ δεξιῶν σου — «не посади его справа от себя»; ἐπ᾽ ἐσχάτων ἐπιγνώσῃ τοὺς λόγους μου — «в конце познаешь слова мои» (ἐπ᾽ ἐσχάτων — напоследок); ἐπὶ τῶν ῥημάτων μου κατανυγήσῃ — «о словах моих умилишься, будешь уязвлён» (κατανύσσομαι). Учитель говорит от первого лица — в тексте 私の言葉."
  13: "τίς ἐλεήσει ἐπαοιδὸν ὀφιόδηκτον — «кто помилует заклинателя, ужаленного змеёй» (ἐπαοιδός — заклинатель; ὀφιόδηκτος — ужаленный змеёй); τοὺς προσάγοντας θηρίοις — «приближающихся к зверям» (θηρίον)."
  14: "οὕτως τὸν προσπορευόμενον ἀνδρὶ ἁμαρτωλῷ — «так и приступающего к мужу грешному» (προσπορεύομαι); συμφυρόμενον ἐν ταῖς ἁμαρτίαις αὐτοῦ — «смешивающегося с грехами его» (συμφύρομαι). Слав. 12:13 соединяет 13 и 14 в одном стихе; здесь деление по гр."
  15: "ὥραν μετὰ σοῦ διαμενεῖ — «на час останется с тобой» (ὥρα — короткое время); ἐὰν ἐκκλίνῃς — «если уклонишься» (ἐκκλίνω); οὐ μὴ καρτερήσῃ — «не устоит, не выдержит» (καρτερέω). Слав. «час с тобою пребудет»."
  16: "ἐν τοῖς χείλεσιν αὐτοῦ γλυκανεῖ ὁ ἐχθρός — «устами своими усладит враг» (γλυκαίνω — делать сладким); ἐν τῇ καρδίᾳ αὐτοῦ βουλεύσεται ἀνατρέψαι σε εἰς βόθρον — «в сердце своём замыслит низринуть тебя в яму» (βόθρος — яма); ἐν ὀφθαλμοῖς αὐτοῦ δακρύσει — «глазами своими заплачет»; οὐκ ἐμπλησθήσεται ἀφ᾽ αἵματος — «не насытится кровью»."
  17: "κακὰ ἐὰν ὑπαντήσῃ σοι — «если злое встретит тебя» (ὑπαντάω); εὑρήσεις αὐτὸν πρότερον ἐκεῖ σου — «найдёшь его там прежде себя»; ὡς βοηθῶν ὑποσχάσει πτέρναν σου — «как помогающий, подсечёт пяту твою» (ὑποσχάζω — подрезать, подсекать; πτέρνα — пята). Слав. делит стих на 12:16–17."
  18: "τὴν κεφαλὴν αὐτοῦ κινήσει — «головой своей кивнёт» (κινέω); ἐπικροτήσει ταῖς χερσὶν αὐτοῦ — «всплеснёт руками» (ἐπικροτέω); πολλὰ διαψιθυρίσει — «много нашепчет» (διαψιθυρίζω); ἀλλοιώσει τὸ πρόσωπον αὐτοῦ — «изменит лицо своё»."
