# jp-box, Первое соборное послание Петра, глава 5. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 5: пастырям (1–4), младшим и всем — смиренномудрие (5–7),
# трезвость против диавола (8–9), Бог всякой благодати (10–11),
# заключение и приветствия (12–14).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет.
# 〔…〕 одно — 5:11 〔栄光[えいこう]と〕: церковное чтение αὐτῷ ἡ δόξα καὶ τὸ κράτος
# (Елизаветинская «Тому слава и держава»; jp-joc 光榮と權能), в gr-lxx-byz
# δόξα НЕТ (проверено), κράτος ЕСТЬ — добавление Церкви в 〔…〕. В 5:8 [τινα]
# и в 5:9 [τῷ] стоят в базе в квадратных скобках, слова есть — 〔…〕 не ставятся.
# Цитата Писания: 5:5 (Притч 3:34) — в 「」, атрибуция в notes.
# Сносок ⟨…⟩ нет: 長老, 冠, 獅子, 悪魔 уже встречались в корпусе. jp-ni не использовался.

tr_code: jp-box
book: 1pet
chapter: 5
draft: true

verses:
  1: "あなたがたの間[あいだ]の長老[ちょうろう]たちに、わたしは勧[すす]める。わたしも長老[ちょうろう]であり、キリストの苦[くる]しみの証人[しょうにん]であり、やがて現[あらわ]れる栄光[えいこう]にあずかる者[もの]である。"
  2: "あなたがたのうちにある神[かみ]の群[む]れを牧[ぼく]し、それを監督[かんとく]しなさい。強[し]いられてではなく、神[かみ]に従[したが]って自[みずか]ら進[すす]んでしなさい。不正[ふせい]な利[り]を求[もと]めてではなく、熱心[ねっしん]にしなさい。"
  3: "また、ゆだねられた者[もの]たちの上[うえ]に君臨[くんりん]するのではなく、群[む]れの模範[もはん]となりなさい。"
  4: "そうすれば、大牧者[だいぼくしゃ]が現[あらわ]れるとき、しぼむことのない栄光[えいこう]の冠[かんむり]を受[う]けるであろう。"
  5: "同[おな]じように、若[わか]い者[もの]たちよ、長老[ちょうろう]たちに従[したが]いなさい。あなたがたは皆[みな]、互[たが]いに謙遜[けんそん]を身[み]に着[つ]けなさい。というのは、「神[かみ]は高慢[こうまん]な者[もの]に敵[てき]して、謙遜[けんそん]な者[もの]に{恵[めぐ]み|恩寵[おんちょう]}を与[あた]えられる」からである。"
  6: "だから、神[かみ]の力強[ちからづよ]い手[て]の下[した]にへりくだりなさい。そうすれば、神[かみ]は時[とき]が来[く]ればあなたがたを高[たか]くしてくださる。"
  7: "あなたがたの心配[しんぱい]をすべて神[かみ]に委[ゆだ]ねなさい。神[かみ]はあなたがたのことを心[こころ]にかけておられるからである。"
  8: "目[め]を覚[さ]まし、警戒[けいかい]しなさい。あなたがたの敵[てき]である悪魔[あくま]が、ほえたける獅子[しし]のように歩[あゆ]き回[まわ]り、食[く]い尽[つ]くす者[もの]を探[さが]している。"
  9: "信仰[しんこう]に堅[かた]く立[た]って、悪魔[あくま]に抵抗[ていこう]しなさい。あなたがたは、世[よ]にある兄弟[きょうだい]たちが同[おな]じ苦[くる]しみを受けていることを知[し]っているのである。"
  10: "すべての{恵[めぐ]み|恩寵[おんちょう]}の神[かみ]は、あなたがたをキリストにあってご自身[じしん]の永遠[えいえん]の栄光[えいこう]へと召[め]された方[かた]である。あなたがたがしばらくの間[あいだ]苦[くる]しみを受[う]けたのち、神[かみ]ご自身[じしん]があなたがたを整[ととの]え、強[つよ]くし、力[ちから]づけ、揺[ゆ]るぎない土台[どだい]の上[うえ]に据[す]えてくださる。"
  11: "〔栄光[えいこう]と〕権能[けんのう]は、世[よ]々[よ]限[かぎ]りなく、この方[かた]にありますように。アーメン。"
  12: "わたしは、信[しん]実[じつ]な兄弟[きょうだい]であるシルワノによって、あなたがたに手短[てみじか]に書[か]いた。これは、わたしが思[おも]うところでは、励[はげ]ましであり、これが神[かみ]のまことの{恵[めぐ]み|恩寵[おんちょう]}であることの証[あかし]である。この{恵[めぐ]み|恩寵[おんちょう]}のうちに、しっかり立[た]ちなさい。"
  13: "バビロンにいる、あなたがたとともに選[えら]ばれた教会[きょうかい]が、あなたがたによろしくと言[い]っている。わたしの子[こ]であるマルコも、同[おな]じくよろしくと言[い]っている。"
  14: "愛[あい]の口[くち]づけをもって互[たが]いによろしく挨拶[あいさつ]をしなさい。キリストにあるあなたがたすべてに、平和[へいわ]があるように。"

notes:
  1: "Πρεσβυτέρους — 長老たち (ср. Деян 20:17; 1 Тим 5:17). συμπρεσβύτερος — わたしも長老 (букв. «сопресвитер»). μάρτυς τῶν τοῦ Χριστοῦ παθημάτων — キリストの苦しみの証人. τῆς μελλούσης ἀποκαλύπτεσθαι δόξης κοινωνός — やがて現れる栄光にあずかる者."
  2: "ποιμάνατε τὸ ἐν ὑμῖν ποίμνιον τοῦ θεοῦ — あなたがたのうちにある神の群れを牧しなさい (ποιμαίνω, ср. Ин 21:16). ἐπισκοποῦντες — 監督しなさい (ἐπισκοπέω, ср. 2:25). μὴ ἀναγκαστῶς ἀλλὰ ἑκουσίως κατὰ θεόν — 強いられてではなく、神に従って自ら進んで. μηδὲ αἰσχροκερδῶς ἀλλὰ προθύμως — 不正な利を求めてではなく、熱心に."
  3: "μηδ᾽ ὡς κατακυριεύοντες τῶν κλήρων — ゆだねられた者たちの上に君臨するのではなく (κλῆροι — «уделы», т.е. вверенные; κατακυριεύω — господствовать, ср. Мф 20:25). τύποι τοῦ ποιμνίου — 群れの模範 (ср. 1 Тим 4:12)."
  4: "ἀρχιποίμενος — 大牧者 (ср. Евр 13:20 «великий пастырь»). κομιεῖσθε — 受けるであろう (будущее). ἀμαράντινος τῆς δόξης στέφανος — しぼむことのない栄光の冠 (ἀμαράντινος — «неувядающий», ср. 1:4 ἀμάραντον)."
  5: "νεώτεροι — 若い者たち. ὑποτάγητε πρεσβυτέροις — 長老たちに従いなさい. τὴν ταπεινοφροσύνην ἐγκομβώσασθε — 謙遜を身に着けなさい (ἐγκομβόομαι — «опоясываться», hapax: надеть передник раба). Цитата Притч 3:34 (ср. Иак 4:6). ὑπερηφάνοις ἀντιτάσσεται — 高慢な者に敵して. ταπεινοῖς δίδωσιν χάριν — 謙遜な者に恵みを与えられる."
  6: "Ταπεινώθητε ὑπὸ τὴν κραταιὰν χεῖρα τοῦ θεοῦ — 神の力強い手の下にへりくだりなさい. ἵνα ὑμᾶς ὑψώσῃ ἐν καιρῷ — 時が来ればあなたがたを高くしてくださる (ср. Лк 14:11)."
  7: "πᾶσαν τὴν μέριμναν — すべての心配. ἐπιρίψαντες ἐπ᾿ αὐτόν — 神に委ねなさい (ср. Пс 54:23). αὐτῷ μέλει περὶ ὑμῶν — 神はあなたがたのことを心にかけておられる (μέλει — безличное «заботиться»)."
  8: "Νήψατε, γρηγορήσατε — 目を覚まし、警戒しなさい (ср. 4:7). ἀντίδικος — 敵 (противник в суде). διάβολος — 悪魔. ὡς λέων ὠρυόμενος περιπατεῖ — ほえたける獅子のように歩き回る. ζητῶν τινα καταπιεῖν — 食い尽くす者を探している ([τινα] в базе есть)."
  9: "ᾧ ἀντίστητε στερεοὶ τῇ πίστει — 信仰に堅く立って、悪魔に抵抗しなさい (ср. Иак 4:7). τὰ αὐτὰ τῶν παθημάτων — 同じ苦しみ. τῇ ἐν τῷ κόσμῳ ὑμῶν ἀδελφότητι — 世にあるあなたがたの兄弟たちに ([τῷ] в базе есть). ἐπιτελεῖσθαι — 受けている (совершается)."
  10: "ὁ θεὸς πάσης χάριτος — すべての恵みの神. ὁ καλέσας ὑμᾶς εἰς τὴν αἰώνιον αὐτοῦ δόξαν ἐν Χριστῷ — キリストにあってご自身の永遠の栄光へと召された方. ὀλίγον παθόντας — しばらくの間苦しみを受けたのち. Четыре глагола сохранены: καταρτίσει, στηρίξει, σθενώσει, θεμελιώσει — 整え、強くし、力づけ、土台の上に据える."
  11: "αὐτῷ τὸ κράτος — 権能はこの方に. εἰς τοὺς αἰῶνας — 世々限りなく. 〔栄光と〕: церковное αὐτῷ ἡ δόξα καὶ τὸ κράτος (Елизаветинская «Тому слава и держава»; jp-joc 光榮と權能) — в gr-lxx-byz δόξα НЕТ, κράτος ЕСТЬ, проверено; добавление Церкви в 〔…〕. ἀμήν в базе есть — アーメン без скобок."
  12: "Διὰ Σιλουανοῦ τοῦ πιστοῦ ἀδελφοῦ — 信実な兄弟シルワノによって (Σιλουανός — シルワノ, как в 1 Сол 1:1). ὡς λογίζομαι — わたしが思うところでは. δι᾽ ὀλίγων ἔγραψα — 手短に書いた. παρακαλῶν καὶ ἐπιμαρτυρῶν — 励まし、証しして. ταύτην εἶναι ἀληθῆ χάριν τοῦ θεοῦ — これが神のまことの恵みであること. εἰς ἣν στῆτε — この恵みのうちに立ちなさい."
  13: "ἡ ἐν Βαβυλῶνι συνεκλεκτή — バビロンにいる、ともに選ばれた教会 (συνεκλεκτή — «сопризванная»; традиционно разумеется Рим, ср. Откр 17:5). Μᾶρκος ὁ υἱός μου — わたしの子マルコ (о духовном сыне, ср. Деян 12:12)."
  14: "φίλημα ἀγάπης — 愛の口づけ (ср. Рим 16:16). εἰρήνη ὑμῖν πᾶσιν τοῖς ἐν Χριστῷ — キリストにあるあなたがたすべてに平和があるように. В базе нет Ἰησοῦ и ἀμήν — не добавлены."
