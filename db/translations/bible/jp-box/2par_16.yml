# jp-box, 2-я Паралипоменон, глава 16. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc для книги нет,
# jp-ni (под авторским правом) не использовался.
# Язык — современный 常体 (в речи тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 16: война с Ваасой и договор с сирийским царём (1–6),
# пророчество Анани и гнев Асы (7–10), болезнь и смерть Асы (11–14).
# Речь — 「…」: послание Асы (2–3), слово Анани (7–9). Красного нет.
# Нумерация по gr-lxx-byz: 14 стихов, совпадает с csl и ru; сдвига нет.
# Числа: 16:1 — у гр. и csl 38-й год царства Асы, у ru 36-й (в тексте гр. и csl);
# 16:13 — у гр. 39-й год, у csl и ru 41-й (в тексте csl), см. notes.
# Паритет: слав. чтения входят в основной текст без 〔…〕, вариант LXX — в notes
# (16:5 «царь израилев», 16:7 «царя», 16:10 «уби»).
# 〔…〕 нет: текст всех стихов есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 王, 契約, 預言者, 祭壇, 神殿, 香料 уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
