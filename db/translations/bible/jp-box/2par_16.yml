chapter: 16
draft: true

verses:
  1: "アサの治世[ちせい]の第三十八年[だいさんじゅうはちねん]に、イスラエルの王[おう]バシャがユダに攻[せ]め上[のぼ]り、ラマを建[た]てて、ユダの王アサにだれも出入[でいり]できないようにした。"
  2: "アサは主[しゅ]の家[いえ]と王の家の宝[たから]の中[なか]から銀[ぎん]と金[きん]を取[と]り、ダマスコに住[す]むシリアの王[おう]アデルの子[こ]のもとへ遣[つか]わして言[い]った。「"
  3: "わたしとあなたの間[あいだ]に、またわたしの父[ちち]とあなたの父の間に契約[けいやく]を結[むす]ぼう。見[み]よ、わたしはあなたに金[きん]と銀[ぎん]を送[おく]った。来[き]て、イスラエルの王バシャをわたしから離[はな]れさせ、彼をわたしから去[さ]らせてくれ。」"
  4: "アデルの子[こ]はアサ王[おう]の言[い]うことを聞[き]き入[い]れ、自分[じぶん]の軍[ぐん]の長[ちょう]たちをイスラエルの町々[まちまち]へ遣[つか]わした。彼らはアイン、ダン、アベル・マイム、およびナフタリの全[ぜん]地方[ちほう]を打[う]った。"
  5: "イスラエルの王[おう]バシャはこれを聞[き]くと、もはやラマを建[た]てることをやめ、その仕事[しごと]を中止[ちゅうし]した。"
  6: "アサ王[おう]はユダのすべての者[もの]を集[あつ]め、バシャが造[つく]るために用[もち]いたラマの石[いし]と材木[ざいもく]を運[はこ]び出[だ]させ、それらでギベアとマスファを建[た]てた。"
  7: "そのころ、預言者[よげんしゃ]アナニがユダの王[おう]アサのところに来[き]て、彼に言[い]った。「あなたがシリアの王[おう]に頼[たよ]り、あなたの神[かみ]である主[しゅ]に頼らなかったので、シリアの王の軍[ぐん]はあなたの手[て]から逃[のが]れ去[さ]った。"
  8: "エチオピア人[じん]とリビア人[じん]は、おびただしい軍勢[ぐんぜい]、非常[ひじょう]に多[おお]い戦車[せんしゃ]と騎兵[きへい]ではなかったか。しかし、あなたが主に頼[たよ]んだとき、主は彼らをあなたの手[て]に渡[わた]された。"
  9: "主の目[め]は全地[ぜんち]を見回[みまわ]し、心[こころ]が主に向かって全[まった]き者[もの]を強[つよ]くされる。このことにおいて、あなたは愚[おろ]かなことをした。今[いま]から後[のち]、あなたには戦[たたか]いがあるであろう。」"
  10: "アサはこの預言者[よげんしゃ]に怒[いか]り、彼を牢[ろう]に入[い]れた。このことのために腹[はら]を立[た]てたからである。そのころ、アサは民[たみ]のうちの者[もの]たちを苦[くる]しめた。"
  11: "見[み]よ、アサの初[はじ]めの言葉[ことば]と最後[さいご]の言葉は、ユダとイスラエルの王[おう]たちの書[しょ]に記[しる]されている。"
  12: "アサはその治世[ちせい]の第三十九年[だいさんじゅうきゅうねん]に、足[あし]の病[やまい]にかかって、ひどく病[や]んだ。しかし、その病の中[なか]で、彼は主を求[もと]めず、医者[いしゃ]たちを求めた。"
  13: "アサは父[ちち]たちとともに眠[ねむ]り、その治世の第四十一年[だいよんじゅういちねん]に死[し]んだ。"
  14: "彼らは、彼がダビデの町[まち]で自分[じぶん]のために掘[ほ]った墓[はか]に彼を葬[ほうむ]り、寝台[しんだい]の上[うえ]に横[よこ]たわらせ、香料[こうりょう]と、調合[ちょうごう]したさまざまな香油[こうゆ]を満[み]たし、彼のために非常[ひじょう]に大[おお]きな葬儀[そうぎ]を行[おこな]った。"

notes:
  1: "ἐν τῷ ὀγδόῳ καὶ τριακοστῷ ἔτει τῆς βασιλείας Ασα — в тридцать восьмой год царства Асы; у ru «в тридцать шестой год» (36) — иное чтение, в тексте гр. и csl. ἀνέβη Βαασα — поднялся Вааса (バシャ, как в 3 Цар 15:16–22; Синод. «Вааса»); ᾠκοδόμησεν τὴν Ραμα — построил Раму; τοῦ μὴ δοῦναι ἔξοδον καὶ εἴσοδον — чтобы не дать выхода и входа; τῷ Ασα βασιλεῖ Ιουδα — Асе, царю Иуды."
  2: "ἔλαβεν χρυσίον καὶ ἀργύριον ἐκ θησαυρῶν οἴκου κυρίου καὶ οἴκου τοῦ βασιλέως — взял золото и серебро из сокровищ дома Господня и дома царя; πρὸς τὸν υἱὸν τοῦ Αδερ βασιλέως Συρίας — к сыну Адера, царя Сирии; τὸν κατοικοῦντα ἐν Δαμασκῷ — живущему в Дамаске; λέγων — говоря. Слав. вставляет в скобках «(венададу)» — пояснение, не внесено; в Синод. «Венадад»."
  3: "Διάθου διαθήκην — положи завет (διατίθεμαι); ἀνὰ μέσον ἐμοῦ καὶ σοῦ — между мною и тобою; ἰδοὺ ἀπέσταλκά σοι χρυσίον καὶ ἀργύριον — вот, послал я тебе золото и серебро (перфект); δεῦρο καὶ διασκέδασον ἀπ᾽ ἐμοῦ τὸν Βαασα — приди и расторгни, отгони от меня Ваасу (διασκεδάζω); ἀπελθέτω ἀπ᾽ ἐμοῦ — пусть отойдёт от меня. Здесь закрываются слова Асы."
  4: "ἤκουσεν υἱὸς Αδερ τοῦ βασιλέως Ασα — послушал сын Адера, царя Асы (в гр. «Ασα» — Аса, не «Сирии»; слав. то же); ἀπέστειλεν τοὺς ἄρχοντας τῆς δυνάμεως — послал начальников силы; ἐπάταξεν τὴν Ιων — поразил Ион (Ιων; слав. «аинон»); в 3 Цар 15:20 та же местность — Αιν, アイン; τὴν Δαν — Дан; τὴν Αβελμαιν — Авел-Маин (слав. «авелмаин»; Синод. «Авелмаим»; ср. アベル・ベト・マアハ в 3 Цар 15:20); πάσας τὰς περιχώρους Νεφθαλι — все окрестности Неффалима."
  5: "ἀπέλιπεν τοῦ μηκέτι οἰκοδομεῖν — оставил строить более; κατέπαυσεν τὸ ἔργον αὐτοῦ — прекратил дело своё. Слав. добавляет «царь израилев» (в гр. только Βαασα) — внесено (イスラエルの王)."
  6: "ἔλαβεν πάντα τὸν Ιουδαν — взял всего Иуду, т. е. собрал всех; τοὺς λίθους τῆς Ραμα καὶ τὰ ξύλα αὐτῆς, ἃ ᾠκοδόμησεν Βαασα — камни Рамы и дерева её, которые употребил Вааса; ᾠκοδόμησεν ἐν αὐτοῖς τὴν Γαβαε καὶ τὴν Μασφα — построил из них Геву и Мицфу (Γαβαε — ギベア, как Γαβεε в 1 Пар 8:6, евр. Гева; слав. «гаваю»; Μασφα — マスファ, слав. «масфу»; Синод. «Геву и Мицфу»)."
  7: "Ανανι ὁ προφήτης — Анани пророк (Ανανι; слав. «ананий»; в корпусе アナニ, 1 Пар 3:24); πρὸς Ασα βασιλέα Ιουδα — к Асе, царю Иуды; ἐν τῷ πεποιθέναι σε ἐπὶ βασιλέα Συρίας — в том, что ты понадеялся на царя Сирии; διὰ τοῦτο ἐσώθη δύναμις Συρίας ἀπὸ τῆς χειρός σου — поэтому спаслась сила Сирии от руки твоей. Слав. добавляет «царя» (сила царя сирского) — внесено (シリアの王の軍). Здесь открывается речь Анани, закрывается в 16:9."
  8: "οὐχ οἱ Αἰθίοπες καὶ Λίβυες ἦσαν εἰς δύναμιν πολλὴν εἰς θάρσος — не были ли эфиопы и ливийцы в силе многой, в дерзости; εἰς ἱππεῖς εἰς πλῆθος σφόδρα — в конниках в множество весьма; слав. уточняет «колесниц» (в гр. этого слова нет); καὶ ἐν τῷ πεποιθέναι σε ἐπὶ κύριον παρέδωκεν εἰς τὰς χεῖράς σου — и когда ты уповал на Господа, Он предал в руки твои."
  9: "οἱ ὀφθαλμοὶ κυρίου ἐπιβλέπουσιν ἐν πάσῃ τῇ γῇ — очи Господни призирают на всю землю; κατισχῦσαι ἐν πάσῃ καρδίᾳ πλήρει πρὸς αὐτόν — чтобы укрепить всякое сердце полное к Нему; ἠγνόηκας ἐπὶ τούτῳ — ты не понял, поступил неразумно (ἀγνοέω; слав. «буе сотворил еси»); ἀπὸ τοῦ νῦν ἔσται μετὰ σοῦ πόλεμος — отныне будет с тобою война. Слав. вставляет в скобках «(сего ради)» — не внесено."
  10: "ἐθυμώθη Ασα τῷ προφήτῃ — разгневался Аса на пророка; παρέθετο αὐτὸν εἰς φυλακήν — заключил его в темницу (παρατίθημι); ὅτι ὠργίσθη ἐπὶ τούτῳ — ибо разгневался за это; ἐλυμήνατο ἐν τῷ λαῷ — повредил, притеснил в народе (λυμαίνω); слав. «уби аса от людий» — уникальное чтение; взято LXX «притеснил», слав. вариант отмечен; в скобках «(многих)» — редакционная вставка, не внесена.е внесена, а «уби» (殺した) оставлено по паритету; вариант гр. — 苦しめた."
  11: "οἱ λόγοι Ασα οἱ πρῶτοι καὶ οἱ ἔσχατοι — слова Асы первые и последние; γεγραμμένοι ἐν βιβλίῳ βασιλέων Ιουδα καὶ Ισραηλ — записанные в книге царей Иуды и Израиля."
  12: "ἐμαλακίσθη τοὺς πόδας — ослаб ногами, заболел (μαλακίζομαι); ἕως σφόδρα ἐμαλακίσθη — до крайности ослаб; ἐν τῇ μαλακίᾳ αὐτοῦ — в болезни его; οὐκ ἐζήτησεν κύριον, ἀλλὰ τοὺς ἰατρούς — не взыскал Господа, но врачей. ru: «болезнь поднялась до верхних частей тела» — по МТ, в гр. только «ноги»."
  13: "ἐκοιμήθη μετὰ τῶν πατέρων αὐτοῦ — почил с отцами своими; ἐτελεύτησεν ἐν τῷ ἐνάτῳ καὶ τριακοστῷ ἔτει τῆς βασιλείας αὐτοῦ — скончался в тридцать девятый год царства своего (гр.); слав. и ru — «в четыредесять первое лето» / «на сорок первом году» (41); в тексте csl."
  14: "ἐν τῷ μνήματι, ᾧ ὤρυξεν ἑαυτῷ ἐν πόλει Δαυιδ — в гробнице, которую он выкопал себе в городе Давида; ἐκοίμισαν αὐτὸν ἐπὶ τῆς κλίνης — положили его на постель; ἔπλησαν ἀρωμάτων καὶ γένη μύρων μυρεψῶν — наполнили ароматами и родами миров составляющих масти (μυρεψός); ἐποίησαν αὐτῷ ἐκφορὰν μεγάλην ἕως σφόδρα — устроили ему вынос, погребение весьма великое."
