# jp-box, Первое соборное послание Петра, глава 1. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 1: надписание и приветствие (1–2), благодарение за живое упование
# и нетленное наследие (3–5), радость в испытаниях (6–9), пророки и ангелы
# свидетельствуют о спасении (10–12), призыв к святости, страху Божию
# и любви (13–25), слово Божие пребывает вовек (24–25).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет,
# <j>/<mo> не ставятся.
# 〔…〕 в главе нет: [ἐστὶν] (1:6) стоит в базе в квадратных скобках, слово есть,
# поэтому не оборачивается (проверено запросом к gr-lxx-byz).
# Цитаты Писания: 1:16 (Лев 11:44–45; 19:2), 1:24–25 (Ис 40:6–8) — в 「」,
# атрибуция в notes. 1:2 и 1:11 — πνεῦμα без ἅγιον, поэтому 霊[れい], не 聖霊;
# 1:12 — πνεῦμα ἅγιον, пара {聖霊|聖神}.
# Сносок ⟨…⟩ нет: 離散, 寄留, 嗣業, 新生 уже встречались в корпусе. jp-ni не использовался.

tr_code: jp-box
