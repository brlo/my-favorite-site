chapter: 1
draft: true

verses:
  1: "ペトロ、イエス・キリストの使徒[しと]から、ポント、ガラテヤ、カパドキア、アジア、およびビティニアの離散[りさん]のうちに寄留[きりゅう]している選[えら]ばれた者[もの]たちへ。"
  2: "すなわち、父[ちち]である神[かみ]の予知[よち]に従[したが]って、霊[れい]による聖[きよ]めのうちに、従順[じゅうじゅん]とイエス・キリストの血[ち]の振[ふ]り注[そそ]ぎへと選[えら]ばれた者[もの]たちである。恵[めぐ]みと平和[へいわ]が、あなたがたに豊[ゆた]かに増[ま]し加[くわ]わりますように。"
  3: "わたしたちの主[しゅ]イエス・キリストの父[ちち]である神[かみ]が、ほめたたえられますように。神[かみ]は、その大[おお]いなるあわれみによって、イエス・キリストが死者[ししゃ]の中[なか]から復活[ふっかつ]されたことにより、わたしたちを生[い]ける希望[きぼう]へと新生[しんせい]させてくださった。"
  4: "すなわち、朽[く]ちず、汚[けが]れず、しぼむことのない嗣業[しぎょう]へと。この嗣業[しぎょう]は、あなたがたのために天[てん]に保[たも]たれている。"
  5: "あなたがたは、末[すえ]の時[とき]に現[あらわ]される用意[ようい]のできた救[すく]いへと、信仰[しんこう]によって神[かみ]の力[ちから]のうちに守[まも]られているのである。"
  6: "このことのゆえに、あなたがたは喜[よろこ]びにあふれている。今[いま]しばらくの間[あいだ]、もし必要[ひつよう]なら、さまざまな試練[しれん]によって悲[かな]しむことがあっても、"
  7: "それは、火[ひ]によって試[ため]され、やがて滅[ほろ]びる金[きん]よりもはるかに尊[とうと]い、あなたがたの信仰[しんこう]が試[ため]されたことが、イエス・キリストの現[あらわ]れの時[とき]に、賛美[さんび]と栄光[えいこう]と誉[ほま]れとなるためである。"
  8: "あなたがたは、この方[かた]を見[み]ずに愛[あい]している。今[いま]は見[み]ていなくても、この方[かた]を信[しん]じて、言[い]い尽[つ]くせない、栄光[えいこう]に満[み]ちた喜[よろこ]びをもって喜[よろこ]んでいる。"
  9: "あなたがたは、信仰[しんこう]の終[お]わり、すなわち魂[たましい]の救[すく]いを受[う]け取[と]っているのである。"
  10: "この救[すく]いについて、あなたがたに与[あた]えられる恵[めぐ]みについて預言[よげん]した預言者[よげんしゃ]たちは、それを尋[たず]ね、細[こま]かく調[しら]べた。"
  11: "キリストの霊[れい]が彼[かれ]らのうちにあって、キリストに降[ふ]りかかる苦[くる]しみと、そののちに来[く]る栄光[えいこう]とをあらかじめ証[あかし]しつつ、指[さ]し示[しめ]しておられたのは、どの時[とき]、いかなる時[とき]のことかを、彼[かれ]らは探[さぐ]り求[もと]めた。"
  12: "彼[かれ]らには、それらが自分[じぶん]たちのためではなく、あなたがたのために仕[つか]えていることが示[しめ]された。それらのことは、天[てん]から遣[つか]わされた{聖霊[せいれい]|聖神[せいしん]}によってあなたがたに福音[ふくいん]を告[つ]げ知[し]らせた者[もの]たちを通して、今[いま]あなたがたに告[つ]げ知[し]らされている。天使[てんし]たちも、それをのぞき込[こ]みたいと願[ねが]っている。"
  13: "だから、あなたがたの心[こころ]の腰[こし]を引[ひ]き締[し]め、気[き]を抜[ぬ]かずに、イエス・キリストの現[あらわ]れの時[とき]にあなたがたに携[たずさ]えられる恵[めぐ]みを、全[まった]く望[のぞ]みなさい。"
  14: "従順[じゅうじゅん]の子[こ]として、かつて無知[むち]であったころの欲[よく]に身[み]を合[あ]わせてはならない。"
  15: "むしろ、あなたがたを召[め]された方[かた]が聖[せい]であるように、あなたがたもすべての行[おこな]いにおいて聖[せい]でありなさい。"
  16: "書[か]かれている。「わたしが聖[せい]であるから、あなたがたも聖[せい]でなければならない。」"
  17: "あなたがたが、人[ひと]をかたよらずに、それぞれの行[おこな]いによって裁[さば]かれる方[かた]を父[ちち]と呼[よ]んでいるのなら、恐[おそ]れをもって、あなたがたの寄留[きりゅう]の時[とき]を過[す]ごしなさい。"
  18: "あなたがたは、先祖[せんぞ]から伝[つた]わったむなしい生活[せいかつ]から、銀[ぎん]や金[きん]のような朽[く]ちるものによってではなく、贖[あがな]われたことを知[し]っている。"
  19: "そうではなく、傷[きず]も汚[けが]れもない小羊[こひつじ]のようなキリストの尊[とうと]い血[ち]によってである。"
  20: "キリストは、世[よ]の創[はじ]めの前[まえ]から知[し]られており、この末[すえ]の時[とき]に、あなたがたのために現[あらわ]れた。"
  21: "あなたがたは、キリストを通して、死者[ししゃ]の中[なか]から復活[ふっかつ]させ、栄光[えいこう]をお与[あた]えになった神[かみ]を信[しん]じている。それは、あなたがたの信仰[しんこう]と希望[きぼう]が神[かみ]にあるためである。"
  22: "真理[しんり]への従順[じゅうじゅん]によってあなたがたの魂[たましい]を清[きよ]め、偽[いつわ]りのない兄弟愛[きょうだいあい]を抱[だ]くに至[いた]ったのだから、心[こころ]から熱[あつ]く互[たが]いに愛[あい]し合[あ]いなさい。"
  23: "あなたがたは、朽[く]ちる種[たね]からではなく、朽[く]ちない種[たね]から、すなわち、生[い]きて永遠[えいえん]に残[のこ]る神[かみ]の言葉[ことば]によって、新生[しんせい]したのである。"
  24: "「すべての肉[にく]は草[くさ]のようであり、その栄光[えいこう]はすべて草[くさ]の花[はな]のようである。草[くさ]は枯[か]れ、花[はな]は散[ち]った。」"
  25: "しかし、「主[しゅ]の言葉[ことば]は永遠[えいえん]に残[のこ]る。」これこそ、あなたがたに告[つ]げ知[ら]された福音[ふくいん]の言葉[ことば]である。"

notes:
  1: "Πέτρος ἀπόστολος Ἰησοῦ Χριστοῦ — ペトロ、イエス・キリストの使徒 (без глагола, как в надписаниях посланий). ἐκλεκτοῖς παρεπιδήμοις — 選ばれた寄留者たち; παρεπίδημος — «пришелец, временный житель» (ср. 2:11; Евр 11:13). διασπορά — 離散 (как Иак 1:1). Пять областей сохранены в порядке греч.: ポント、ガラテヤ、カパドキア、アジア、ビティニア."
  2: "κατὰ πρόγνωσιν θεοῦ πατρός — 父である神の予知に従って. ἐν ἁγιασμῷ πνεύματος — 霊による聖め: πνεῦμα без ἅγιον, поэтому 霊[れい], не 聖霊 (ср. 1 Тим 3:16). εἰς ὑπακοὴν καὶ ῥαντισμὸν αἵματος — 従順と血の振り注ぎ; ῥαντισμός — окропление (ср. Евр 12:24). πληθυνθείη — оптатив, 豊かに増し加わりますように."
  3: "εὐλογητός — ほめたたえられますように (формула благословения, ср. Еф 1:3). ἀναγεννήσας — 新生させて; ἀναγεννάω — 新生 (1:3,23). εἰς ἐλπίδα ζῶσαν — 生ける希望へ. δι᾿ ἀναστάσεως Ἰησοῦ Χριστοῦ ἐκ νεκρῶν — イエス・キリストが死者の中から復活されたことにより."
  4: "κληρονομία ἄφθαρτος καὶ ἀμίαντος καὶ ἀμάραντος — 朽ちず、汚れず、しぼむことのない嗣業: три прилагательных не сведены в одно. τετηρημένην ἐν οὐρανοῖς — 天に保たれている (перфект: уже хранится). εἰς ὑμᾶς — あなたがたのために."
  5: "φρουρουμένους — 守られている (военный образ: стража, ср. Флп 4:7). ἑτοίμην ἀποκαλυφθῆναι — 現される用意のできた. καιρὸς ἔσχατος — 末の時. ἐν δυνάμει θεοῦ διὰ πίστεως — 信仰によって神の力のうちに."
  6: "ἀγαλλιᾶσθε — 喜びにあふれている. ὀλίγον ἄρτι — 今しばらくの間; εἰ δέον — もし必要なら ([ἐστὶν] в базе есть, 〔〕 не ставятся). ποικίλοι πειρασμοί — さまざまな試練. Стих обрывается на причастии, сказуемое — в 1:7."
  7: "τὸ δοκίμιον ὑμῶν τῆς πίστεως — あなたがたの信仰が試されたこと (δοκίμιον — испытанность, ср. Иак 1:3). χρυσίον ἀπολλύμενον — 滅びる金. διὰ πυρὸς δοκιμαζόμενον — 火によって試される. εἰς ἔπαινον καὶ δόξαν καὶ τιμήν — 賛美と栄光と誉れ. ἐν ἀποκαλύψει Ἰησοῦ Χριστοῦ — イエス・キリストの現れの時."
  8: "ὃν οὐκ ἰδόντες ἀγαπᾶτε — 見ずに愛している. ἄρτι μὴ ὁρῶντες — 今は見ていなくても. χαρᾷ ἀνεκλαλήτῳ καὶ δεδοξασμένῃ — 言い尽くせない、栄光に満ちた喜び (ἀνεκλάλητος — «неизреченный»)."
  9: "κομιζόμενοι — 受け取っている (настоящее время: спасение уже получается). τέλος τῆς πίστεως — 信仰の終わり; τέλος — и «конец», и «цель», двусмысленность сохранена. σωτηρία ψυχῶν — 魂の救い."
  10: "ἐξεζήτησαν καὶ ἐξηρεύνησαν — 尋ね、細かく調べた (два глагола: разыскивать и исследовать; в базе ἐξηραύνησαν — вариант ἐξηρεύνησαν). οἱ περὶ τῆς εἰς ὑμᾶς χάριτος προφητεύσαντες — あなたがたに与えられる恵みについて預言した."
  11: "ἐραυνῶντες — 探り求めた. τὸ ἐν αὐτοῖς πνεῦμα Χριστοῦ — キリストの霊: πνεῦμα без ἅγιον, поэтому 霊[れい]. προμαρτυρόμενον — あらかじめ証ししつつ. τὰ εἰς Χριστὸν παθήματα — キリストに降りかかる苦しみ. τὰς μετὰ ταῦτα δόξας — そののちの栄光 (в греч. мн. ч.)."
  12: "ἀπεκαλύφθη — 示された. οὐχ ἑαυτοῖς ὑμῖν δὲ διηκόνουν — 自分たちのためではなく、あなたがたのために仕えている. πνεύματι ἁγίῳ — 聖霊: пара {聖霊|聖神}. ἀποσταλέντι ἀπ᾿ οὐρανοῦ — 天から遣わされた. παρακύψαι — のぞき込む (ср. Ин 20:5,11)."
  13: "ἀναζωσάμενοι τὰς ὀσφύας τῆς διανοίας — 心の腰を引き締め (образ подпоясанного путника, ср. Лк 12:35). νήφοντες — 気を抜かずに (трезвясь). τελείως ἐλπίσατε — 全く望みなさい. τὴν φερομένην ὑμῖν χάριν — 携えられる恵み."
  14: "τέκνα ὑπακοῆς — 従順の子 (семитская конструкция «дети послушания»). μὴ συσχηματιζόμενοι — 身を合わせてはならない (συσχηματίζω, ср. Рим 12:2). ἐν τῇ ἀγνοίᾳ ὑμῶν — 無知であったころ."
  15: "κατὰ τὸν καλέσαντα ὑμᾶς ἅγιον — 召された方が聖であるように. ἅγιοι ἐν πάσῃ ἀναστροφῇ — すべての行いにおいて聖; ἀναστροφή — 行い (ключевое слово послания, ср. 1:18; 2:12; 3:1,2,16)."
  16: "γέγραπται — 書かれている; цитата Лев 11:44–45; 19:2 (ср. Мф 5:48). В 「」, как цитата Писания первого уровня."
  17: "ἀπροσωπολήμπτως — 人をかたよらずに (ср. Рим 2:11; Деян 10:34). παροικία — 寄留 (ср. 2:11 πάροικοι). ἀναστράφητε — 過ごしなさい. ἐν φόβῳ — 恐れをもって."
  18: "ἐλυτρώθητε — 贖われた (λύτρον — выкуп). ματαία ἀναστροφή πατροπαράδοτος — 先祖から伝わったむなしい生活 (πατροπαράδοτος — переданный от отцов). φθαρτοῖς — 朽ちるもの (о серебре и золоте)."
  19: "ἀμνός — 小羊 (агнец Пасхи, ср. Исх 12; Ин 1:29). ἄμωμος καὶ ἄσπιλος — 傷も汚れもない. τιμίῳ αἵματι — 尊い血. Сказуемое 1:18 (ἐλυτρώθητε) продолжается здесь."
  20: "προεγνωσμένου — 知られており (предузнан; ср. 1:2 πρόγνωσις). πρὸ καταβολῆς κόσμου — 世の創めの前. ἐπ᾿ ἐσχάτου τῶν χρόνων — この末の時. δι᾿ ὑμᾶς — あなたがたのために."
  21: "τὸν ἐγείραντα αὐτὸν ἐκ νεκρῶν — 死者の中から復活させ. δόξαν αὐτῷ δόντα — 栄光をお与えになった. ὥστε τὴν πίστιν ὑμῶν καὶ ἐλπίδα εἶναι εἰς θεόν — 信仰と希望が神にある (εἰς θεόν — «к Богу»)."
  22: "ἡγνικότες — 清め (перфект: уже очистили). ὑπακοὴ τῆς ἀληθείας — 真理への従順. φιλαδελφία ἀνυπόκριτος — 偽りのない兄弟愛. ἐκτενῶς — 熱く, усиленно."
  23: "ἀναγεγεννημένοι — 新たに生まれた (перфект, ср. 1:3). σπορὰ φθαρτή / ἄφθαρτος — 朽ちる種 / 朽ちない種. λόγος ζῶν θεοῦ καὶ μένων — 生きて永遠に残る神の言葉; ζῶν относится к θεοῦ («Бога живого»), μένων — «пребывающий»."
  24: "Цитата Ис 40:6–7 (LXX). πᾶσα σάρξ — すべての肉. ἡ δόξα αὐτῆς — その栄光 (ж. р. при σάρξ). ἐξηράνθη — 枯れ; ἐξέπεσεν — 散った (аористы: сказано о совершившемся)."
  25: "τὸ ῥῆμα κυρίου — 主の言葉 (ῥῆμα, не λόγος; ср. Ис 40:8). μένει εἰς τὸν αἰῶνα — 永遠に残る. τὸ ῥῆμα τὸ εὐαγγελισθέν εἰς ὑμᾶς — あなたがたに告げ知らされた福音の言葉. Цитата заканчивается в начале стиха, дальше — слово апостола."
