verses:
  1: "輝[かがや]け、輝[かがや]け、エルサレムよ。あなたの光[ひかり]が来[き]たからである。主[しゅ]の栄光[えいこう]があなたの上[うえ]に昇[のぼ]った。"
  2: "見[み]よ、暗[やみ]と暗黒[あんこく]が地[ち]を覆[おお]い、もろもろの民[たみ]の上[うえ]に及[およ]ぶ。しかし、あなたの上[うえ]には主[しゅ]が現[あら]われ、その栄光[えいこう]があなたの上に現[あら]わされる。"
  3: "もろもろの王[おう]たちはあなたの光[ひかり]によって、諸国民[しょこくみん]はあなたの輝[かがや]きによって歩[あゆ]んで来[く]る。"
  4: "あなたの目[め]を周[まわ]りに上[あ]げて見[み]よ。彼[かれ]らはみな集[あつ]まってあなたのもとへ来[き]ている。見[み]よ、あなたの息子[むすこ]たちはみな遠[とお]くから来[き]、あなたの娘[むすめ]たちは肩[かた]に抱[だ]かれて運[はこ]ばれる。"
  5: "そのとき、あなたは見[み]て喜[よろこ]び、恐[おそ]れ、心[こころ]に驚[おどろ]く。海[うみ]の富[とみ]と、諸国民[しょこくみん]と民[たみ]の富[とみ]があなたのもとへ移[うつ]って来[く]るからである。そして、あなたのもとへ来[く]る。"
  6: "ラクダの群[む]れ、ミディアンとガイファのラクダがあなたを覆[おお]う。彼[かれ]らはみなシバから来[き]、金[きん]と乳香[にゅうこう]と貴[とうと]い石[いし]を携[たずさ]えて来[き]、主[しゅ]の救[すく]いを告[つ]げ知[し]らせる。"
  7: "「ケダルのすべての羊[ひつじ]はあなたのもとに集[あつ]められ、ネバヨトの雄羊[おひつじ]はあなたのもとへ来[き]、わたしの祭壇[さいだん]の上[うえ]に喜[よろこ]ばれるささげ物[もの]として上[あ]げられる。わたしの祈[いの]りの家[いえ]は栄光[えいこう]を受[う]ける。"
  8: "雲[くも]のように飛[と]び、雛[ひな]を連[つ]れた鳩[はと]のように、わたしのもとへ飛[と]ぶ者[もの]たちはだれか。"
  9: "わたしを島々[しまじま]が待[ま]ち望[のぞ]み、タルシシュの船[ふね]が真[ま]っ先[さき]に来[き]て、あなたの子[こ]らを遠[とお]くから、また彼らとともに銀[ぎん]と金[きん]を運[はこ]んで来[く]る。主[しゅ]の聖[せい]なる名[な]のゆえ、イスラエルの聖[せい]なる方[かた]が栄光[えいこう]を受[う]けられるゆえである。"
  10: "異国人[いこくじん]たちがあなたの城壁[じょうへき]を建[た]て直[なお]し、その王[おう]たちがあなたに仕[つか]える。わたしは怒[いか]りのゆえにあなたを打[う]ち、あわれみのゆえにあなたを愛[あい]したからである。"
  11: "あなたの門[もん]はいつも開[ひら]かれ、昼[ひる]も夜[よる]も閉[と]ざされない。諸国民[しょこくみん]の力[ちから]があなたのもとへ運[はこ]び込[こ]まれ、王[おう]たちが導[みちび]かれて来[く]るためである。"
  12: "あなたに仕[つか]えない国民[こくみん]と王[おう]たちは滅[ほろ]び、その国民[こくみん]は荒[あ]れに荒れ果[は]てる。"
  13: "レバノンの栄光[えいこう]が、糸杉[いとすぎ]と松[まつ]と杉[すぎ]とともにあなたのもとへ来[き]て、わたしの聖[せい]なる場所[ばしょ]に栄光[えいこう]を与[あた]え、わたしの足[あし]の置[お]き所[どころ]に栄光[えいこう]を与[あた]える。"
  14: "あなたを卑[いや]しくし、あなたを怒[いか]らせた者[もの]たちの子[こ]らは、恐[おそ]れながらあなたのもとへ来[き]、あなたを怒[いか]らせた者たちはみな、あなたの足[あし]の跡[あと]にひれ伏[ふ]す。あなたは『主[しゅ]の都[みやこ]、イスラエルの聖[せい]なる方[かた]のシオン』と呼ばれる。"
  15: "あなたが捨[す]てられ、憎[にく]まれ、助[たす]ける者[もの]もいなかったゆえに、わたしはあなたを永遠[えいえん]の喜[よろこ]び、代々[よよ]の歓喜[かんき]とする。"
  16: "あなたは諸国民[しょこくみん]の乳[ちち]を吸[す]い、王[おう]たちの富[とみ]を食[た]べる。そして、わたしが主[しゅ]、あなたを救[すく]う者[もの]、あなたを救[すく]い出[だ]すイスラエルの神[かみ]であることを知[し]る。"
  17: "青銅[せいどう]の代[か]わりに金[きん]を、鉄[てつ]の代わりに銀[ぎん]を、木[き]の代わりに青銅[せいどう]を、石[いし]の代わりに鉄[てつ]をあなたに与[あた]える。わたしはあなたの支配者[しはいしゃ]たちを平和[へいわ]のうちに、あなたの監督[かんとく]たちを義[ぎ]のうちに置[お]く。"
  18: "あなたの地[ち]にはもはや不正[ふせい]も破[やぶ]れも悲惨[ひさん]も聞[き]かれず、あなたの国境[こっきょう]にもない。あなたの城壁[じょうへき]は『救[すく]い』と呼ばれ、あなたの門[もん]は『賛美[さんび]』と呼ばれる。"
  19: "あなたにはもはや太陽[たいよう]が昼[ひる]の光[ひかり]とならず、月[つき]の昇[のぼ]りが夜[よる]を照[て]らさない。主[しゅ]があなたの永遠[えいえん]の光[ひかり]となり、あなたの神[かみ]があなたの栄光[えいこう]となるからである。"
  20: "あなたの太陽[たいよう]はもはや沈[しず]まず、あなたの月[つき]も欠[か]けない。主[しゅ]があなたの永遠[えいえん]の光[ひかり]となり、あなたの嘆[なげ]きの日々[ひび]が満[み]ちるからである。"
  21: "あなたの民[たみ]はみな正[ただ]しい者[もの]となり、永遠[えいえん]に地[ち]を嗣業[しぎょう]として受[う]け継[つ]ぐ。それは、植[う]えられたもの、すなわち主[しゅ]の手[て]の業[わざ]を、栄光[えいこう]のために守[まも]るためである。"
  22: "小[ちい]さな者[もの]は千[せん]となり、最[もっと]も小さい者[もの]は大[おお]きな国民[こくみん]となる。わたしは主[しゅ]、時[とき]が来[く]れば彼らを集[あつ]める。」"

notes:
  1: "Φωτίζου φωτίζου — удвоенный императив «светись, светись» (φωτίζω, страд. «просвещайся»); Ιερουσαλημ — звательный; ἥκει σου τὸ φῶς — «пришёл свет твой» (ἥκω); ἡ δόξα κυρίου ἐπὶ σὲ ἀνατέταλκεν — «слава Господня над тобою взошла» (ἀνατέλλω). Слав. «Светися, светися»; в ru/МТ «восстань, светись» (קומי) — «восстань» в LXX нет."
  2: "σκότος καὶ γνόφος — «тьма и мрак» (γνόφος — густая тьма); καλύψει γῆν ἐπ᾽ ἔθνη — «покроет землю, на народы» (καλύπτω); φανήσεται — «явится» (φαίνω); ὀφθήσεται — «будет видна» (ὁράω)."
  3: "πορεύσονται βασιλεῖς τῷ φωτί σου — «пойдут цари светом твоим» (датив средства); ἔθνη τῇ λαμπρότητί σου — «народы светлостью твоею» (λαμπρότης — светлость, сияние). В ru порядок иной («народы… цари») — по евр.; держим гр."
  4: "ἆρον κύκλῳ τοὺς ὀφθαλμούς — «подними очи вокруг» (αἴρω; κύκλῳ); ἰδὲ συνηγμένα τὰ τέκνα σου — «увидь собранных детей твоих» (συνάγω); ἥκασιν — «пришли» (ἥκω); ἐπ᾽ ὤμων ἀρθήσονται — «на плечах будут несены» (ὦμος)."
  5: "ὄψῃ καὶ φοβηθήσῃ καὶ ἐκστήσῃ τῇ καρδίᾳ — «увидишь, убоишься и ужаснёшься сердцем» (ἐξίστημι); μεταβαλεῖ εἰς σὲ πλοῦτος θαλάσσης — «обратится к тебе богатство моря» (μεταβάλλω); ἐθνῶν καὶ λαῶν — «народов и людей». Слав. добавляет «и возрадуешися» (и возрадуешься) — в LXX нет, внесено без 〔…〕. Стих продолжается в 60:6 (καὶ ἥξουσίν σοι)."
  6: "ἀγέλαι καμήλων — «стада верблюдов» (ἀγέλη, κάμηλος); Μαδιαμ καὶ Γαιφα — Мадиам и Гаифа (ミディアン、ガイファ); ἐκ Σαβα — «из Савы» (シバ); χρυσίον καὶ λίβανον — «золото и ливан (ладан)» (乳香[にゅうこう]); τὸ σωτήριον κυρίου εὐαγγελιοῦνται — «спасение Господне благовествуют» (εὐαγγελίζομαι). Слав. добавляет «и камень честен» (драгоценный камень) — в LXX нет, внесено без 〔…〕. Ср. Мф 2:11 (золото и ладан)."
  7: "πάντα τὰ πρόβατα Κηδαρ — «все овцы Кидара» (ケダル); κριοὶ Ναβαιωθ — «овны Наваиофа» (ネバヨト); ἀνενεχθήσεται δεκτά — «вознесутся угодные» (ἀναφέρω; δεκτός); θυσιαστήριον — «жертвенник» (祭壇[さいだん]); ὁ οἶκος τῆς προσευχῆς μου δοξασθήσεται — «дом молитвы Моей прославится». С 60:7 говорит Господь (1-е л. «Мой»), поэтому речь в 「…」 до конца главы; вводной формулы в LXX нет."
  8: "τίνες οἵδε — «кто эти»; ὡς νέφελαι πέτανται — «как облака летят» (νέφος, πέτομαι); ὡς περιστεραὶ σὺν νεοσσοῖς — «как голуби с птенцами» (νεοσσός). Слав. добавляет «ко мне» — «ко мне летят»; внесено без 〔…〕."
  9: "ἐμὲ νῆσοι ὑπέμειναν — «Меня острова ожидали» (ὑπομένω; νῆσος); πλοῖα Θαρσις ἐν πρώτοις — «корабли Фарсиса в первых (впереди)» (Θαρσις — タルシシュ); ἀγαγεῖν — «привести» (ἄγω); ἄργυρος καὶ χρυσός — «серебро и золото»; διὰ τὸ ὄνομα κυρίου τὸ ἅγιον — «ради имени Господня святого»; τὸν ἅγιον τοῦ Ισραηλ ἔνδοξον εἶναι — «что Святой Израилев славен»."
  10: "οἰκοδομήσουσιν ἀλλογενεῖς τὰ τείχη σου — «создадут иноплеменники стены твои» (ἀλλογενής, τεῖχος); παραστήσονταί σοι — «предстанут тебе» (παρίστημι — служить); διὰ ὀργήν μου ἐπάταξά σε — «за гнев Мой Я поразил тебя» (πατάσσω); διὰ ἔλεον ἠγάπησά σε — «за милость возлюбил тебя» (ἔλεος). В ru/МТ «в благоволении Моем буду милостив» — иное."
  11: "ἀνοιχθήσονται αἱ πύλαι σου διὰ παντός — «отверзутся врата твои всегда»; ἡμέρας καὶ νυκτὸς οὐ κλεισθήσονται — «днём и ночью не затворятся» (κλείω); εἰσαγαγεῖν δύναμιν ἐθνῶν — «чтобы внести силу народов» (δύναμις — сила, богатство); βασιλεῖς ἀγομένους — «царей ведомых» (ἄγω)."
  12: "τὰ ἔθνη καὶ οἱ βασιλεῖς, οἵτινες οὐ δουλεύσουσίν σοι — «народы и цари, которые не будут служить тебе» (δουλεύω); ἀπολοῦνται — «погибнут» (ἀπόλλυμι); ἐρημίᾳ ἐρημωθήσονται — «запустением запустеют» (датив cognatus; ἐρημόω) — фигура повторения сохранена («荒[あ]れに荒[あ]れ果[は]てる»)."
  13: "ἡ δόξα τοῦ Λιβάνου — «слава Ливана» (レバノン); ἐν κυπαρίσσῳ καὶ πεύκῃ καὶ κέδρῳ — «кипарисом, певгом и кедром» (κυπάρισσος — 糸杉[いとすぎ], πεύκη — 松[まつ], κέδρος — 杉[すぎ]); δοξάσαι τὸν τόπον τὸν ἅγιόν μου — «прославить место святое Моё». Слав. добавляет «и место ногу моею прославлю» (и подножие ног Моих прославлю) — в LXX нет, внесено без 〔…〕."
  14: "δεδοικότες υἱοὶ ταπεινωσάντων σε — «боящиеся сыны смиривших тебя» (δείδω, ταπεινόω); παροξυνάντων σε — «раздраживших тебя» (παροξύνω); κληθήσῃ Πόλις κυρίου Σιων ἁγίου Ισραηλ — «наречёшься город Господа, Сион Святого Израилева». Слав. добавляет «и поклонятся следам ногу твоею вси прогневавшии тя» — внесено без 〔…〕; в LXX этого нет."
  15: "ἐγκαταλελειμμένην καὶ μεμισημένην — «оставленную и ненавидимую» (ἐγκαταλείπω, μισέω); οὐκ ἦν ὁ βοηθῶν — «не было помогающего» (βοηθέω); θήσω σε ἀγαλλίαμα αἰώνιον — «положу тебя в радость вечную» (ἀγαλλίαμα — ликование); εὐφροσύνην γενεῶν γενεαῖς — «веселие родов родам» (εὐφροσύνη). В ru/МТ «никто не проходил чрез тебя» — иное."
  16: "θηλάσεις γάλα ἐθνῶν — «будешь сосать молоко народов» (θηλάζω, γάλα); πλοῦτον βασιλέων φάγεσαι — «богатство царей будешь есть» (ἐσθίω, fut. φάγεσαι); ὁ σῴζων σε καὶ ἐξαιρούμενός σε — «спасающий и избавляющий тебя» (σῴζω, ἐξαιρέω). В ru/МТ «груди царские сосать будешь… Сильный Иаковлев» — иное."
  17: "ἀντὶ χαλκοῦ … χρυσίον — «вместо меди золото» (χαλκός); ἀντὶ σιδήρου … ἀργύριον — «вместо железа серебро» (σίδηρος); ἀντὶ ξύλων … χαλκόν — «вместо дерева медь»; ἀντὶ λίθων … σίδηρον — «вместо камней железо»; δώσω τοὺς ἄρχοντάς σου ἐν εἰρήνῃ — «дам князей твоих в мире» (ἄρχων); τοὺς ἐπισκόπους σου ἐν δικαιοσύνῃ — «надзирателей твоих в правде» (ἐπίσκοπος). Четыре замены сохранены."
  18: "οὐκ ἀκουσθήσεται ἔτι ἀδικία — «не услышится более неправда» (ἀκούω); σύντριμμα — «сокрушение»; ταλαιπωρία — «бедствие»; ὅρια — «пределы» (ὅριον); κληθήσεται Σωτήριον τὰ τείχη σου — «нарекутся спасением стены твои»; αἱ πύλαι σου Γλῦμμα — «врата твои — изваяние» (γλῦμμα — резьба, изваяние; слав. «хвала», ru «слава»; по паритету взято слав. 「賛美[さんび]」)."
  19: "οὐκ ἔσται σοι ὁ ἥλιος εἰς φῶς ἡμέρας — «не будет тебе солнце в свет дня»; ἀνατολὴ σελήνης — «восход луны»; φωτιεῖ — «осветит» (φωτίζω); κύριος φῶς αἰώνιον — «Господь — свет вечный»; ὁ θεὸς δόξα σου — «Бог — слава твоя». Ср. Откр 21:23; 22:5."
  20: "οὐ δύσεται ὁ ἥλιος — «не зайдёт солнце» (δύω); ἡ σελήνη οὐκ ἐκλείψει — «луна не оскудеет» (ἐκλείπω — также «затмится»); ἀναπληρωθήσονται αἱ ἡμέραι τοῦ πένθους — «исполнятся дни плача» (ἀναπληρόω, πένθος)."
  21: "ὁ λαός σου πᾶς δίκαιος — «народ твой весь праведный»; δι᾿ αἰῶνος κληρονομήσουσιν τὴν γῆν — «в век наследуют землю» (κληρονομέω); φυλάσσων τὸ φύτευμα — «хранящий насаждение» (φύτευμα; при λαός ед. ч.); ἔργα χειρῶν αὐτοῦ εἰς δόξαν — «дела рук Его во славу» (αὐτοῦ — Бога)."
  22: "ὁ ὀλιγοστὸς ἔσται εἰς χιλιάδας — «малый будет в тысячи» (ὀλιγοστός — малочисленный; χιλιάς); ὁ ἐλάχιστος εἰς ἔθνος μέγα — «наименьший в народ великий» (ἐλάχιστος); κατὰ καιρὸν συνάξω αὐτούς — «в своё время соберу их» (καιρός). В ru/МТ «ускорю совершить это» — по евр."
