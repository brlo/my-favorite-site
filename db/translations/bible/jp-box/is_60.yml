# jp-box, Исаия, глава 60. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный, с МТ) — только для понимания,
# не источник. jp-joc для главы есть (фрагмент), в работе не использовался;
# jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 60: 1–4 «светись, Иерусалим», тьма на земле и слава над Сионом, цари и народы;
# 5–9 богатство моря, верблюды Мадиама и Савы, золото и ладан, корабли Фарсиса;
# 10–14 стены, врата, цари, слава Ливана; 15–18 вечная радость, молоко народов, золото
# вместо меди, спасение в стенах; 19–22 Господь — вечный свет, праведный народ, малый
# станет тысячей.
# Голоса: 1–6 пророческое обращение к Иерусалиму (о Господе в 3-м лице) — без кавычек;
# с 60:7 говорит Господь (1-е лицо: «Мой жертвенник», «Меня ждут острова», «Я прославлю»),
# поэтому 7–22 — 「…」 до конца главы, вводной формулы нет (оговорено в notes 7).
# Нумерация по gr: 22 стиха; у csl и ru тоже 22, сдвигов нет.
# Слав. добавления внесены без 〔…〕: 60:5 «и возрадуешися», 60:6 «и камень честен»,
# 60:8 «ко мне», 60:13 «и место ногу моею прославлю», 60:14 «и поклонятся следам ногу
# твоею» — в LXX нет (notes 5, 6, 8, 13, 14). Расхождения чтений — notes 1, 7, 10, 15, 16, 18, 22.
# 〔…〕 нет; сносок ⟨…⟩ нет: 糸杉, 松, 杉, 乳香, 嗣業, 兜 уже в корпусе.
# Имена — транслитерация греческого (LXX): ケダル, ネバヨト, シバ, タルシシュ.

