# jp-box, Псалтирь, псалом 108. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный 常体, без 文語.
# Нумерация — славяно-синодальная (csl-ru): в слав. надписание отдельным стихом
# не стоит, поэтому наш стих 0 (надписание) влит в начало стиха 1; дальше номера 1..31.
# Псалом 108: молитва оклеветанного — жалоба (1–5), проклятие клеветникам (6–20),
# мольба о помощи (21–29), обет хвалы (30–31).
# Красного и синего нет. Кавычек нет: прямая речь не звучит, всё — молитва от «я».
# 〔…〕 нет: все слова в gr-lxx-byz есть.
# セラ (διάψαλμα) в этой главе нет.
# Сносок ⟨…⟩ нет: やもめ, 孤児, 断食, 帯 уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
