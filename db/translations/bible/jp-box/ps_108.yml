verses:
  1: "指揮者[しきしゃ]に。ダビデの詩[うた]。神[かみ]よ、わたしの賛美[さんび]に黙[だま]っておられないでください。"
  2: "悪[わる]い者[もの]の口[くち]と偽[いつわ]りの者[もの]の口[くち]がわたしに向[む]かって開[ひら]かれ、偽[いつわ]りの舌[した]でわたしに逆[さか]らって語[かた]ったからです。"
  3: "彼[かれ]らは憎[にく]しみの言葉[ことば]でわたしを取[と]り囲[かこ]み、理由[りゆう]もなくわたしと戦[たたか]った。"
  4: "わたしが愛[あい]するかわりに、彼[かれ]らはわたしを中傷[ちゅうしょう]した。しかし、わたしは祈[いの]っていた。"
  5: "彼[かれ]らは善[ぜん]に悪[あく]を、わたしの愛[あい]に憎[にく]しみをもって報[むく]いた。"
  6: "彼[かれ]の上[うえ]に悪[わる]い者[もの]を立[た]て、その右[みぎ]に訴[うった]え出[で]る者[もの]を立[た]たせてください。"
  7: "彼[かれ]が裁[さば]かれるとき、罪[つみ]ある者[もの]として出[で]て行[ゆ]き、その祈[いの]りが罪[つみ]となってしまいますように。"
  8: "彼[かれ]の日[ひ]々[び]が短[みじか]くされ、その職[しょく]をほかの者[もの]が取[と]りますように。"
  9: "その子[こ]らが孤児[みなしご]となり、その妻[つま]がやもめとなりますように。"
  10: "その子[こ]らがさまよい出[で]て物乞[ものご]いし、荒[あ]れた住[す]まいから追[お]い出[だ]されますように。"
  11: "債[さい]権[けん]者[しゃ]が彼[かれ]のすべての財産[ざいさん]を取[と]り立[た]て、他人[たにん]がその労苦[ろうく]の実[み]を奪[うば]いますように。"
  12: "彼[かれ]を助[たす]ける者[もの]がなく、その孤児[みなしご]たちをあわれむ者[もの]もありませんように。"
  13: "その子[こ]らが滅[ほろ]ぼされ、その名[な]が次[つぎ]の代[よ]で消[き]え去[さ]りますように。"
  14: "その父[ちち]たちの不法[ふほう]が主[しゅ]の前[まえ]に思[おも]い起[おこ]され、その母[はは]の罪[つみ]が消[け]されませんように。"
  15: "それらがいつも主[しゅ]の前[まえ]にあり、彼[かれ]らの記[き]念[ねん]が地[ち]から断[た]たれますように。"
  16: "彼[かれ]はあわれみを行[おこな]うことを思[おも]い起[おこ]さず、貧[まず]しく乏[とぼ]しい者[もの]、心[こころ]の傷[いた]んだ者[もの]をさえ追[お]い詰[つ]めて殺[ころ]そうとしたからである。"
  17: "彼[かれ]は呪[のろ]いを愛[あい]した。それゆえ、呪[のろ]いが彼[かれ]に臨[のぞ]む。彼[かれ]は祝福[しゅくふく]を望[のぞ]まず、祝福[しゅくふく]は彼[かれ]から遠[とお]ざかる。"
  18: "彼[かれ]は呪[のろ]いを衣[ころも]のようにまとった。呪[のろ]いは水[みず]のようにその内[うち]に、油[あぶら]のようにその骨[ほね]にしみ込[こ]んだ。"
  19: "その呪[のろ]いが、彼[かれ]がまとう衣[ころも]のように、いつも締[し]める帯[おび]のようになりますように。"
  20: "これが、わたしを中傷[ちゅうしょう]する者[もの]たち、わたしの魂[たましい]に悪[わる]を語[かた]る者[もの]たちが主[しゅ]から受[う]ける報[むく]いである。"
  21: "主[しゅ]よ、わたしの主[しゅ]よ。あなたの名[な]のゆえに、わたしにあわれみを施[ほどこ]してください。あなたのあわれみはいつくしみ深[ぶか]いのですから。"
  22: "わたしを救[すく]い出[だ]してください。わたしは貧[まず]しく乏[とぼ]しい者[もの]であり、わたしの心[こころ]は内[うち]で激[はげ]しく動揺[どうよう]しているのです。"
  23: "わたしは傾[かたむ]く影[かげ]のように消[き]え去[さ]り、いなごのように振[ふ]り落[おと]とされた。"
  24: "わたしの膝[ひざ]は断食[だんじつ]で弱[よわ]り、わたしの肉[にく]は油[あぶら]を失[うしな]ってやせ衰[おとろ]えた。"
  25: "わたしは彼[かれ]らの嘲[あざけ]りとなった。彼[かれ]らはわたしを見[み]て頭[あたま]を振[ふ]った。"
  26: "わたしの神[かみ]である主[しゅ]よ、わたしを助[たす]け、あなたのあわれみに従[したが]ってわたしを救[すく]ってください。"
  27: "そうして、彼[かれ]らが知[し]りますように。これがあなたの手[て]であり、主[しゅ]であるあなたがこれをなさったのだと。"
  28: "彼[かれ]らは呪[のろ]うが、あなたは祝福[しゅくふく]してくださる。わたしに立[た]ち向[む]かう者[もの]たちは辱[はずかし]められ、あなたの僕[しもべ]は喜[よろこ]ぶ。"
  29: "わたしを中傷[ちゅうしょう]する者[もの]たちが恥[はじ]をまとい、その辱[はずかし]めを外套[がいとう]のようにまといますように。"
  30: "わたしは口[くち]いっぱいに主[しゅ]に感謝[かんしゃ]し、多[おお]くの人[ひと]々[びと]の間[あいだ]で主[しゅ]を賛美[さんび]する。"
  31: "主[しゅ]は貧[まず]しい者[もの]の右[みぎ]に立[た]ち、その魂[たましい]を追[お]い求[もと]める者[もの]から救[すく]ってくださるからである。"

notes:
  1: "Εἰς τὸ τέλος· τῷ Δαυιδ ψαλμός — 指揮者に。ダビデの詩 (εἰς τὸ τέλος — «в конец», т. е. для начальника хора; 指揮者, как по всему корпусу). Надписание — стих 0 (в csl-ru отдельного стиха нет, влито в ст. 1). Ὁ θεός, τὴν αἴνεσίν μου μὴ παρασιωπήσῃς — 神よ、わたしの賛美に黙っておられないでください (παρασιωπάω — «промолчать, обойти молчанием»; слав. «не премолчи»)."
  2: "στόμα ἁμαρτωλοῦ καὶ στόμα δολίου ἐπ᾿ ἐμὲ ἠνοίχθη — 悪い者の口と偽りの者の口がわたしに向かって開かれ (δολιος — «коварный»). ἐλάλησαν κατ᾿ ἐμοῦ γλώσσῃ δολίᾳ — 偽りの舌でわたしに逆らって語った."
  3: "λόγοις μίσους ἐκύκλωσάν με — 憎しみの言葉で取り囲み (κυκλόω — «окружать»). ἐπολέμησάν με δωρεάν — 理由もなく戦った (δωρεάν — «даром, без причины»)."
  4: "ἀντὶ τοῦ ἀγαπᾶν με ἐνδιέβαλλόν με — 愛するかわりに中傷した (ἐνδιαβάλλω — «клеветать»). ἐγὼ δὲ προσευχόμην — しかし、わたしは祈っていた (имперфект — «продолжал молиться»)."
  5: "ἔθεντο κατ᾿ ἐμοῦ κακὰ ἀντὶ ἀγαθῶν — 善に悪を報いた (τίθημι — «полагать»). μῖσος ἀντὶ τῆς ἀγαπήσεώς μου — わたしの愛に憎しみを (ἀγάπησις — «любовь»)."
  6: "κατάστησον ἐπ᾿ αὐτὸν ἁμαρτωλόν — 彼の上に悪い者を立て (καθίστημι — «ставить»). διάβολος στήτω ἐκ δεξιῶν αὐτοῦ — その右に訴え人を立たせてください (διάβολος здесь — «обвинитель, клеветник», не имя сатаны; поэтому 訴え出る者, ср. jp-joc 惡魔)."
  7: "ἐν τῷ κρίνεσθαι αὐτὸν ἐξέλθοι καταδεδικασμένος — 裁かれるとき、罪ある者として出て行き (καταδικάζω — «осуждать»). ἡ προσευχὴ αὐτοῦ γενέσθω εἰς ἁμαρτίαν — その祈りが罪となりますように (ср. Притч 28:9)."
  8: "γενηθήτωσαν αἱ ἡμέραι αὐτοῦ ὀλίγαι — 彼の日々が短くされ (ὀλίγος — «малый»). τὴν ἐπισκοπὴν αὐτοῦ λάβοι ἕτερος — その職をほかの者が取りますように (ἐπισκοπή — «надзор, должность»; стих цитируется в Деян 1:20, где передано 職)."
  9: "γενηθήτωσαν οἱ υἱοὶ αὐτοῦ ὀρφανοί — その子らが孤児となり (ὀρφανός — 孤児). ἡ γυνὴ αὐτοῦ χήρα — その妻がやもめとなりますように (χήρα — やもめ)."
  10: "σαλευόμενοι μεταναστήτωσαν οἱ υἱοὶ αὐτοῦ — その子らがさまよい出て (σαλεύω — «колебать»; μεταναστέω — «переселяться»). ἐπαιτησάτωσαν — 物乞いし (ἐπαιτέω — «просить милостыню»). ἐκβληθήτωσαν ἐκ τῶν οἰκοπέδων αὐτῶν — 荒れた住まいから追い出されますように (οἰκόπεδον — «жилище, усадьба»)."
  11: "ἐξερευνησάτω δανειστὴς πάντα, ὅσα ὑπάρχει αὐτῷ — 債権者がすべての財産を取り立て (ἐξερευνάω — «разыскивать»; δανειστής — «заимодавец»). διαρπασάτωσαν ἀλλότριοι τοὺς πόνους αὐτοῦ — 他人がその労苦の実を奪いますように (διαρπάζω — «расхищать»; πόνος — «труд»)."
  12: "μὴ ὑπαρξάτω αὐτῷ ἀντιλήμπτωρ — 彼を助ける者がないように (ἀντιλήμπτωρ — «заступник»). μηδὲ γενηθήτω οἰκτίρμων τοῖς ὀρφανοῖς αὐτοῦ — その孤児たちをあわれむ者もないように (οἰκτίρμων — «милостивый»)."
  13: "γενηθήτω τὰ τέκνα αὐτοῦ εἰς ἐξολέθρευσιν — その子らが滅ぼされ (ἐξολέθρευσις — «истребление»). ἐν γενεᾷ μιᾷ ἐξαλειφθήτω τὸ ὄνομα αὐτοῦ — その名が次の代で消え去りますように (ἐξαλείφω — «изглаживать»; μία γενεά — «одно поколение», т. е. ближайшее)."
  14: "ἀναμνησθείη ἡ ἀνομία τῶν πατέρων αὐτοῦ ἔναντι κυρίου — その父たちの不法が主の前に思い起され (ἀναμιμνῄσκω). ἡ ἁμαρτία τῆς μητρὸς αὐτοῦ μὴ ἐξαλειφθείη — その母の罪が消されませんように."
  15: "γενηθήτωσαν ἔναντι κυρίου διὰ παντός — それらがいつも主の前にあり. ἐξολεθρευθείη ἐκ γῆς τὸ μνημόσυνον αὐτῶν — 彼らの記念が地から断たれますように (μνημόσυνον — «память»)."
  16: "ἀνθ᾿ ὧν οὐκ ἐμνήσθη τοῦ ποιῆσαι ἔλεος — あわれみを行うことを思い起さず (ἀνθ᾿ ὧν — «за то, что»). κατεδίωξεν ἄνθρωπον πένητα καὶ πτωχὸν καὶ κατανενυγμένον τῇ καρδίᾳ — 貧しく乏しい者、心の傷んだ者をさえ追い詰めて (καταδιώκω — «преследовать»; κατανύσσομαι — «быть уязвлённым, сокрушённым»). τοῦ θανατῶσαι — 殺そうとした (θανατόω)."
  17: "ἠγάπησεν κατάραν, καὶ ἥξει αὐτῷ — 呪いを愛した、それゆえ呪いが彼に臨む (κατάρα — 呪い; ἥκω — «приходить»). οὐκ ἠθέλησεν εὐλογίαν, καὶ μακρυνθήσεται ἀπ᾿ αὐτοῦ — 祝福を望まず、祝福は彼から遠ざかる (μακρύνω — «удалять»)."
  18: "ἐνεδύσατο κατάραν ὡς ἱμάτιον — 呪いを衣のようにまとった (ἐνδύω). εἰσῆλθεν ὡς ὕδωρ εἰς τὰ ἔγκατα αὐτοῦ — 水のようにその内にしみ込んだ (ἔγκατα — «внутренности»). ὡσεὶ ἔλαιον ἐν τοῖς ὀστέοις αὐτοῦ — 油のようにその骨に (ἔλαιον — «елей»)."
  19: "γενηθήτω αὐτῷ ὡς ἱμάτιον, ὃ περιβάλλεται — 彼がまとう衣のように (περιβάλλω). ὡσεὶ ζώνη, ἣν διὰ παντὸς περιζώννυται — いつも締める帯のように (ζώνη — «пояс»; περιζώννυμι — «опоясывать»)."
  20: "τοῦτο τὸ ἔργον τῶν ἐνδιαβαλλόντων με παρὰ κυρίου — これが、わたしを中傷する者たちが主から受ける報い (ἐνδιαβάλλω — «клеветать»; παρὰ κυρίου — «от Господа»). τῶν λαλούντων πονηρὰ κατὰ τῆς ψυχῆς μου — わたしの魂に悪を語る者たち."
  21: "καὶ σύ, κύριε κύριε — 主よ、わたしの主よ (удвоение κύριε сохранено). ποίησον μετ᾿ ἐμοῦ ἔλεος ἕνεκεν τοῦ ὀνόματός σου — あなたの名のゆえに、わたしにあわれみを施してください. ὅτι χρηστὸν τὸ ἔλεός σου — あなたのあわれみはいつくしみ深い (χρηστός — «благ»)."
  22: "ῥῦσαί με — わたしを救い出してください (ῥύομαι). πτωχὸς καὶ πένης ἐγώ εἰμι — わたしは貧しく乏しい者 (πένης — «бедняк»). ἡ καρδία μου τετάρακται ἐντός μου — 心は内で激しく動揺している (ταράσσω)."
  23: "ὡσεὶ σκιὰ ἐν τῷ ἐκκλῖναι αὐτὴν ἀντανῃρέθην — 傾く影のように消え去り (ἐκκλίνω — «склоняться»; ἀνταναιρέω — «уничтожать»). ἐξετινάχθην ὡσεὶ ἀκρίδες — いなごのように振り落とされた (ἐκτινάσσω — «стряхивать»; ἀκρίς — いなご)."
  24: "τὰ γόνατά μου ἠσθένεισαν ἀπὸ νηστείας — 膝は断食で弱り (γόνυ — 膝; νηστεία — 断食). ἡ σάρξ μου ἠλλοιώθη δι᾽ ἔλαιον — 肉は油を失ってやせ衰えた (ἀλλοιόω — «изменять»; ἔλαιον — «елей, умащение»; у jp-joc 肥えたるを失へり)."
  25: "ἐγὼ ἐγενήθην ὄνειδος αὐτοῖς — わたしは彼らの嘲りとなった (ὄνειδος — «поношение»). εἴδοσάν με, ἐσάλευσαν κεφαλὰς αὐτῶν — わたしを見て頭を振った (жест глумления, ср. Мф 27:39)."
  26: "βοήθησόν μοι, κύριε ὁ θεός μου — わたしの神である主よ、わたしを助け (βοηθέω). σῶσόν με κατὰ τὸ ἔλεός σου — あなたのあわれみに従って救ってください."
  27: "καὶ γνώτωσαν ὅτι ἡ χείρ σου αὕτη — 彼らが知りますように、これがあなたの手であると. σὺ, κύριε, ἐποίησας αὐτήν — 主であるあなたがこれをなさったのだと (аорист ἐποίησας)."
  28: "καταράσονται αὐτοί, καὶ σὺ εὐλογήσεις — 彼らは呪うが、あなたは祝福してくださる (καταράομαι; εὐλογέω). οἱ ἐπανιστάμενοί μοι αἰσχυνθήτωσαν — わたしに立ち向かう者たちは辱められ (ἐπανίστημι; αἰσχύνω). ὁ δὲ δοῦλός σου εὐφρανθήσεται — あなたの僕は喜ぶ."
  29: "ἐνδυσάσθωσαν οἱ ἐνδιαβάλλοντές με ἐντροπήν — 中傷する者たちが恥をまとい (ἐντροπή — «стыд»). περιβαλέσθωσαν ὡσεὶ διπλοΐδα αἰσχύνην αὐτῶν — その辱めを外套のようにまといますように (διπλοΐς — «двойная мантия, плащ»; αἰσχύνη — «стыд»)."
  30: "ἐξομολογήσομαι τῷ κυρίῳ σφόδρα ἐν τῷ στόματί μου — 口いっぱいに主に感謝し (σφόδρα — «весьма»). ἐν μέσῳ πολλῶν αἰνέσω αὐτόν — 多くの人々の間で主を賛美する."
  31: "παρέστη ἐκ δεξιῶν πένητος — 貧しい者の右に立ち (παρίστημι). τοῦ σῶσαι ἐκ τῶν καταδιωκόντων τὴν ψυχήν μου — その魂を追い求める者から救うために (καταδιώκω — «преследовать»)."
