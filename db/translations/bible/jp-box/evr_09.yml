# jp-box, Послание к Евреям, глава 9. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 9: устройство первой скинии (1–5), её богослужение (6–10),
# Христос — первосвященник большего и совершеннейшего скинии (11–14),
# новый завет и смерть завещателя (15–22), небесное святилище (23–28).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет,
# 10:5–7 с цитатой Писания — тоже без <j> (так в корпусе: Рим 10, Евр 2).
# 〔…〕: 9:19 — церковное καὶ τράγων (雄山羊; Елизаветинская «и козлов», jp-joc
# 「犢と牡山羊との血」); в базе τράγων нет (проверено bracket_check).
# Сноска ⟨…⟩ одна — 9:5 ケルビム, первое место в корпусе.
# Стих 9:20 — слова Моисея из Исх 24:8, поэтому 「…」 без красного.
# Сосуд «ковчег» — 契約の箱; ἀπολύτρωσις — 贖[あがな]い; ἡμέρα — 日; jp-ni не использовался.

