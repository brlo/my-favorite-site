verses:
  1: "第一[だいいち]の契約[けいやく]にも、礼拝[れいはい]の定[さだ]めと、地上[ちじょう]の聖所[せいしょ]とがあった。"
  2: "というのは、幕屋[まくや]が設[もう]けられ、その前[まえ]の部分[ぶぶん]には、燭台[しょくだい]と机[つくえ]と供[そな]えのパンとがあった。これが聖所[せいしょ]と呼[よ]ばれる所[ところ]である。"
  3: "第二[だい]の垂[た]れ幕[まく]の後[うし]ろには、至[し]聖所[せいしょ]と呼[よ]ばれる幕屋[まくや]があった。"
  4: "そこには金[きん]の香[こう]の祭壇[さいだん]と、四方[しほう]を金[きん]で覆[おお]われた契約[けいやく]の箱[はこ]とがあり、その中[なか]には、マンナを入[い]れた金[きん]の壺[つぼ]、芽[め]を出[だ]したアロンの杖[つえ]、また契約[けいやく]の板[いた]があった。"
  5: "その上[うえ]には、贖[あがな]いの蓋[ふた]を覆[おお]う栄光[えいこう]のケルビム⟨旧約[きゅうやく]の幕屋[まくや]の至[し]聖所[せいしょ]に置[お]かれた、翼[つばさ]のある天使[てんし]たちの像[ぞう]。⟩がいた。これらのことについて、今[いま]、一[ひと]つ一[ひと]つ語[かた]ることはできない。"
  6: "これらのものが、このように整[ととの]えられているので、祭司[さいし]たちは、いつも前[まえ]の幕屋[まくや]に入[はい]って礼拝[れいはい]の務[つと]めを行[おこな]っているが、"
  7: "第二[だい]の幕屋[まくや]に入[はい]るのは大祭司[だいさいし]だけであり、しかも、年[とし]に一度[いちど]だけ、血[ち]を携[たずさ]えずに入[はい]ることはない。その血[ち]は、自分[じぶん]のため、また民[たみ]の過[あやま]ちのためにささげられる。"
  8: "{聖霊[せいれい]|聖神[せいしん]}は、このことによって、前[まえ]の幕屋[まくや]がまだ存[そん]している間[あいだ]は、聖所[せいしょ]へ入[はい]る道[みち]がまだ明[あき]らかにされていないことを示[しめ]しておられる。"
  9: "これが現在[げんざい]の時[とき]のためのたとえである。それに従[したが]って、ささげ物[もの]やいけにえがささげられているが、これらは、礼拝[れいはい]する者[もの]の良心[りょうしん]を完全[かんぜん]にすることはできず、"
  10: "ただ、食[た]べ物[もの]と飲[の]み物[もの]と、さまざまな洗[あら]いに関[かん]するもの、すなわち、肉[にく]に関[かん]する定[さだ]めとして、改新[かいしん]の時[とき]まで課[か]せられているにすぎない。"
  11: "しかし、キリストは、すでに実現[じつげん]した善[よ]きものの大祭司[だいさいし]として来[こ]られ、さらに大[おお]きく、さらに完全[かんぜん]な、手[て]で造[つく]られたのではない幕屋[まくや]、すなわち、この造[つく]られたものに属[ぞく]さない幕屋[まくや]を通[とお]って、"
  12: "雄山羊[おやぎ]や子牛[こうし]の血[ち]によるのではなく、ご自身[じしん]の血[ち]によって、ただ一度[いちど]、聖所[せいしょ]に入[はい]り、永遠[えいえん]の贖[あがな]いを手[て]に入[い]れられたのである。"
  13: "というのは、もし雄山羊[おやぎ]や雄牛[おうし]の血[ち]、また雌[め]の子牛[こうし]の灰[はい]が、汚[けが]れた者[もの]に振[ふ]りかけられて、肉[にく]の清[きよ]さに至[いた]らせるのなら、"
  14: "まして、永遠[えいえん]の霊[れい]によって、傷[きず]のないご自身[じしん]を神[かみ]にささげられたキリストの血[ち]は、生[い]ける神[かみ]に仕[つか]えるために、死[し]んだ行[おこな]いからわたしたちの良心[りょうしん]を清[きよ]めるであろう。"
  15: "それゆえ、キリストは新[あたら]しい契約[けいやく]の仲介者[ちゅうかいしゃ]である。それは、最初[さいしょ]の契約[けいやく]の下[もと]で犯[おか]した罪[つみ]からの贖[あがな]いのためにキリストが死[し]なれたことによって、召[め]された者[もの]たちが永遠[えいえん]の嗣業[しぎょう]の約束[やくそく]を受[う]けるためである。"
  16: "というのは、契約[けいやく]のあるところには、それを定[さだ]めた者[もの]の死[し]が必[かなら]ず伴[ともな]わなければならないからである。"
  17: "契約[けいやく]は死[し]んだ者[もの]によって確[かく]かなものとなる。定[さだ]めた者[もの]が生[い]きている間[あいだ]は、それは効力[こうりょく]を持[も]たない。"
  18: "それゆえ、最初[さいしょ]の契約[けいやく]も、血[ち]なしに成[な]り立[た]ったのではない。"
  19: "というのは、モーセが律法[りっぽう]に従[したが]ってすべての戒[いまし]めを民[たみ]全員[ぜんいん]に告[つ]げた後[のち]、子牛[こうし]と〔雄山羊[おやぎ]〕の血[ち]、水[みず]、緋色[ひいろ]の羊毛[ようもう]、ヒソプを取[と]り、その書[しょ]と民[たみ]全員[ぜんいん]とに振[ふ]りかけて、"
  20: "こう言[い]った。「これは、神[かみ]があなたがたに命[めい]じられた契約[けいやく]の血[ち]である。」"
  21: "また、幕屋[まくや]と礼拝[れいはい]の務[つと]めのすべての器[うつわ]にも、同じように血[ち]を振[ふ]りかけた。"
  22: "そして、ほとんどすべてのものは、律法[りっぽう]に従[したが]って血[ち]によって清[きよ]められ、血[ち]を流[なが]すことなしには、赦[ゆる]しはない。"
  23: "そこで、天[てん]にあるもののひな型[がた]は、これらのものによって清[きよ]められなければならないのであるが、天[てん]にあるもの自体[じたい]は、これらよりもさらに良[よ]いいけにえによって清[きよ]められるのである。"
  24: "というのは、キリストは、手[て]で造[つく]られた聖所[せいしょ]、すなわち真[しん]のものの写[うつ]しに入[はい]られたのではなく、今[いま]、わたしたちのために神[かみ]の御前[みまえ]に立[た]つために、天[てん]そのものに入[はい]られたのである。"
  25: "また、大祭司[だいさいし]が年[とし]ごとに、ほかのものの血[ち]を携[たずさ]えて聖所[せいしょ]に入[はい]るように、何度[なんど]もご自身[じしん]をささげるためではない。"
  26: "もしそうだとすれば、キリストは世[よ]の創[はじ]めから何度[なんど]も苦[くる]しみを受[う]けなければならなかったであろう。しかし今[いま]は、世[よ]の終[お]わりに、ただ一度[いちど]、ご自身[じしん]のいけにえによって、罪[つみ]を消[け]し去[さ]るために現[あらわ]れたのである。"
  27: "そして、人[ひと]には一度[いちど]死[し]ぬことが定[さだ]められており、その後[あと]に裁[さば]きがあるように、"
  28: "キリストも、多[おお]くの者[もの]の罪[つみ]を負[お]うためにただ一度[いちど]ささげられ、二度目[にどめ]には、罪[つみ]と関[かか]わりなく、ご自身[じしん]を待[ま]ち望[のぞ]む者[もの]たちに、救[すく]いのために現[あらわ]れるのである。"

notes:
  1: "Εἶχε μὲν οὖν [καὶ] ἡ πρώτη — 第一の契約にも; [καὶ] в базе есть, 〔…〕 не ставятся. δικαιώματα λατρείας — 礼拝の定め (δικαίωμα — установление, предписание). τό τε ἅγιον κοσμικόν — 地上の聖所 (κοσμικός — здешний, земной, не «мирской» в смысле греха)."
  2: "σκηνὴ γὰρ κατεσκευάσθη ἡ πρώτη — 幕屋が設けられ; «первая скиния» = первое отделение, передняя часть. ἡ πρόθεσις τῶν ἄρτων — 供えのパン (хлебы предложения, Лев 24:5–9). ἥτις λέγεται Ἅγια — 聖所と呼ばれる所; здесь Ἅγια ещё не «святое святых»."
  3: "μετὰ δὲ τὸ δεύτερον καταπέτασμα — 第二の垂れ幕の後ろ (внутренняя завеса). σκηνὴ ἡ λεγομένη Ἅγια Ἁγίων — 至聖所と呼ばれる幕屋; передано 至[し]聖所[せいしょ] (термин корпуса)."
  4: "χρυσοῦν ἔχουσα θυμιατήριον — 金の香の祭壇 (θυμιατήριον — жертвенник курения; по термину книги 香[こう]の祭壇[さいだん]). κιβωτὸς τῆς διαθήκης περικεκαλυμμένη πάντοθεν χρυσίῳ — 四方を金で覆われた契約の箱. στάμνος χρυσῆ ἔχουσα τὸ μάννα — マンナを入れた金の壺; ῥάβδος Ἀαρὼν ἡ βλαστήσασα — 芽を出したアロンの杖 (Числ 17:8–10). πλάκες τῆς διαθήκης — 契約の板; 板[いた] — скрижали."
  5: "ὑπεράνω δὲ αὐτῆς Χερουβεὶν δόξης — その上に、栄光のケルビム; сноска при первом месте в корпусе. κατασκιάζοντα τὸ ἱλαστήριον — 贖いの蓋を覆う (ἱλαστήριον — крышка ковчега, «престол милости»; в корпусе 贖[あがな]いの蓋[ふた], ср. Рим 3:25). περὶ ὧν οὐκ ἔστιν νῦν λέγειν κατὰ μέρος — 今、一つ一つ語ることはできない; κατά μέρος — «подробно, по частям»."
  6: "τούτων οὕτως κατεσκευασμένων — これらのものが、このように整えられているので (gen. absolutus). εἰς μὲν τὴν πρώτην σκηνήν — 前の幕屋に. διὰ παντός — いつも. τὰς λατρείας ἐπιτελοῦντες — 礼拝の務めを行っている; причастие, сказуемое в 7 ст."
  7: "εἰς δὲ τὴν δευτέραν — 第二の幕屋に (то есть в святое святых). ἅπαξ τοῦ ἐνιαυτοῦ — 年に一度. οὐ χωρὶς αἵματος — 血を携えずに入ることはない (двойное отрицание сохранено). ὑπὲρ ἑαυτοῦ καὶ τῶν τοῦ λαοῦ ἀγνοημάτων — 自分のため、また民の過ちのために; ἀγνόημα — грех по неведению, поэтому 過[あやま]ち, а не 罪."
  8: "τοῦτο δηλοῦντος τοῦ πνεύματος τοῦ ἁγίου — 聖霊が…示しておられる; πνεῦμα ἅγιον → пара {聖霊|聖神}. μήπω πεφανερῶσθαι τὴν τῶν ἁγίων ὁδόν — 聖所へ入る道がまだ明らかにされていない. ἔτι τῆς πρώτης σκηνῆς ἐχοῦσης στάσιν — 前の幕屋がまだ存している間 (στάσις — «стоянка, существование»)."
  9: "ἥτις παραβολὴ εἰς τὸν καιρὸν τὸν ἐνεστηκότα — 現在の時のためのたとえ (παραβολή — прообраз, иносказание). καθ᾿ ἣν — それに従って; относится к παραβολή. μὴ δυνάμεναι κατὰ συνείδησιν τελειῶσαι τὸν λατρεύοντα — 礼拝する者の良心を完全にすることはできず; придаточное тянется в 10 ст."
  10: "μόνον ἐπὶ βρώμασιν καὶ πόμασιν καὶ διαφόροις βαπτισμοῖς — ただ、飲み物と食べ物と、さまざまな洗いに関するもの; βαπτισμός здесь — ритуальное омовение, не «крещение», поэтому 洗[あら]い. δικαιώματα σαρκὸς μέχρι καιροῦ διορθώσεως ἐπικείμενα — 肉に関する定めとして、改新の時まで課せられている; διόρθωσις — «исправление, восстановление порядка»."
  11: "Χριστὸς δὲ παραγενόμενος ἀρχιερεὺς τῶν γενομένων ἀγαθῶν — すでに実現した善きものの大祭司; в базе γενομένων, церковный текст (Елизаветинская «грядущих благ», jp-joc「将来の福」) читает μελλόντων — оставлено по базе. διὰ τῆς μείζονος καὶ τελειοτέρας σκηνῆς οὐ χειροποιήτου — 手で造られたのではない、さらに大きく、さらに完全な幕屋を通って; οὐ ταύτης τῆς κτίσεως — この造られたものに属さない."
  12: "οὐδὲ δι᾽ αἵματος τράγων καὶ μόσχων — 雄山羊や子牛の血によるのではなく. διὰ δὲ τοῦ ἰδίου αἵματος — ご自身の血によって. ἐφάπαξ — ただ一度. αἰωνίαν λύτρωσιν εὑράμενος — 永遠の贖いを手に入れられた; λύτρωσις — 贖[あがな]い, ср. 9:15 ἀπολύτρωσις."
  13: "τὸ αἷμα τράγων καὶ ταύρων — 雄山羊や雄牛の血. σποδὸς δαμάλεως ῥαντίζουσα τοὺς κεκοινωμένους — 汚れた者に振りかけられる雌の子牛の灰 (Числ 19:9,17–19 — обряд очищения). ἁγιάζει πρὸς τὴν τῆς σαρκὸς καθαρότητα — 肉の清さに至らせる, то есть только внешнее очищение."
  14: "πόσῳ μᾶλλον — まして. διὰ πνεύματος αἰωνίου — 永遠の霊によって; в базе αἰωνίου, церковный текст (Елизаветинская «Духом Святым», jp-joc「聖神」) читает πνεύματος ἁγίου — оставлено по базе (bracket_check: ἁγίου в стихе нет); поэтому 霊[れい], без пары {聖霊|聖神}. ἑαυτὸν προσήνεγκεν ἄμωμον τῷ θεῷ — 傷のないご自身を神にささげられた. ἀπὸ νεκρῶν ἔργων — 死んだ行いから. εἰς τὸ λατρεύειν θεῷ ζῶντι — 生ける神に仕えるために."
  15: "διαθήκης καινῆς μεσίτης — 新しい契約の仲介者 (μεσίτης — посредник, ср. 8:6; 12:24). θανάτου γενομένου — キリストが死なれたことによって. εἰς ἀπολύτρωσιν τῶν ἐπὶ τῇ πρώτῃ διαθήκῃ παραβάσεων — 最初の契約の下で犯した罪からの贖いのために (παράβασις — преступление, 犯した罪). οἱ κεκλημένοι τῆς αἰωνίου κληρονομίας — 永遠の嗣業に召された者たち."
  16: "ὅπου γὰρ διαθήκη — 契約のあるところには. θάνατον ἀνάγκη φέρεσθαι τοῦ διαθεμένου — それを定めた者の死が必ず伴わなければならない; διαθέμενος — завещатель, тот, кто заключает завет. Греческое διαθήκη значит и «завет», и «завещание»; в тексте оставлено 契約[けいやく] по единству термина, игра слов объяснена здесь (ср. 9:17)."
  17: "διαθήκη γὰρ ἐπὶ νεκροῖς βεβαία — 契約は死んだ者によって確かなものとなる. ἐπεὶ μήποτε ἰσχύει ὅτε ζῇ ὁ διαθέμενος — 定めた者が生きている間は効力を持たない; μήποτε здесь в значении «пока не»."
  18: "ὅθεν οὐδὲ ἡ πρώτη χωρὶς αἵματος ἐγκεκαίνισται — 最初の契約も、血なしに成り立ったのではない; ἐγκαινίζω — «освящать при основании, вводить в действие» (ср. 9:18; 10:20)."
  19: "λαληθείσης πάσης ἐντολῆς κατὰ τὸν νόμον ὑπὸ Μωϋσέως παντὶ τῷ λαῷ — モーセが律法に従ってすべての戒めを民全員に告げた後. λαβὼν τὸ αἷμα τῶν μόσχων μετὰ ὕδατος καὶ ἐρίου κοκκίνου καὶ ὑσσώπου — 子牛の血、水、緋色の羊毛、ヒソプ (Исх 24:5–8). В базе только μόσχων; церковный текст (Синодальный «кровь тельцов и козлов», jp-joc「犢と牡山羊との血」) добавляет καὶ τράγων — 〔雄山羊〕. ὑσσωπος — ヒソプ, уже пояснён сноской в Ин 19:29. αὐτὸ τὸ βιβλίον — その書 (книга завета)."
  20: "Слова Моисея, Исх 24:8; внутри повествования — 「…」, как цитата Писания, без красного. Τοῦτο τὸ αἷμα τῆς διαθήκης ἧς ἐνετείλατο πρὸς ὑμᾶς ὁ θεός — これは、神があなたがたに命じられた契約の血である."
  21: "καὶ τὴν σκηνὴν δὲ καὶ πάντα τὰ σκεύη τῆς λειτουργίας — 幕屋と礼拝の務めのすべての器; λειτουργία — 務[つと]め (ср. 8:2,6). τῷ αἵματι ὁμοίως ἐράντισεν — 同じように血を振りかけた."
  22: "σχεδὸν ἐν αἵματι πάντα καθαρίζεται — ほとんどすべてのものは血によって清められ. χωρὶς αἱματεκχυσίας οὐ γίνεται ἄφεσις — 血を流すことなしには赦しはない; αἱματεκχυσία — «излияние крови»."
  23: "τὰ μὲν ὑποδείγματα τῶν ἐν τοῖς οὐρανοῖς — 天にあるもののひな型 (ὑπόδειγμα — образец, ср. 8:5). κρείττοσιν θυσίαις παρὰ ταύτας — これらよりもさらに良い犠牲によって."
  24: "οὐ γὰρ εἰς χειροποίητα ἅγια — 手で造られた聖所にではなく. ἀντίτυπα τῶν ἀληθινῶν — 真のものの写し (ἀντίτυπος — соответствие, отображение; 型 оставлено для τύπος/ὑπόδειγμα). εἰς αὐτὸν τὸν οὐρανόν — 天そのものに. ἐμφανισθῆναι τῷ προσώπῳ τοῦ θεοῦ ὑπὲρ ἡμῶν — わたしたちのために神の御前に立つために."
  25: "οὐδ᾿ ἵνα πολλάκις προσφέρῃ ἑαυτόν — 何度もご自身をささげるためではない. ὥσπερ ὁ ἀρχιερεὺς … κατ᾽ ἐνιαυτὸν ἐν αἵματι ἀλλοτρίῳ — 大祭司が年に一度、ほかのものの血を携えて入るように."
  26: "ἐπεὶ ἔδει αὐτὸν πολλάκις παθεῖν ἀπὸ καταβολῆς κόσμου — 世の創めから何度も苦しみを受けなければならなかった. ἐπὶ συντελείᾳ τῶν αἰώνων — 世の終わりに. εἰς ἀθέτησιν τῆς ἁμαρτίας — 罪を消し去るために (ἀθέτησις — упразднение, отмена). διὰ τῆς θυσίας αὐτοῦ — ご自身のいけにえによって."
  27: "καθ᾿ ὅσον ἀπόκειται τοῖς ἀνθρώποις ἅπαξ ἀποθανεῖν — 人には一度死ぬことが定められており. μετὰ δὲ τοῦτο κρίσις — その後に裁きがある; положительное сравнение продолжается в 28 ст."
  28: "οὕτως καὶ ὁ Χριστός — キリストも…ように (период 27–28 не разбит). ἅπαξ προσενεχθεὶς εἰς τὸ πολλῶν ἀνενεγκεῖν ἁμαρτίας — 多くの者の罪を負うためにただ一度ささげられ. ἐκ δευτέρου χωρὶς ἁμαρτίας ὀφθήσεται — 二度目には、罪と関わりなく現れる (χωρίς ἁμαρτίας — «не для греха», не «без греха»). τοῖς αὐτὸν ἀπεκδεχομένοις εἰς σωτηρίαν — ご自身を待ち望む者たちに、救いのために."
