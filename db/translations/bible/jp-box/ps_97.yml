verses:
  0: "ダビデの詩[うた]。"
  1: "主[しゅ]に新[あたら]しい歌[うた]を歌[うた]え。主[しゅ]は驚[おどろ]くべきことを行[おこな]われた。その右[みぎ]の手[て]と聖[せい]なる腕[うで]が、主[しゅ]ご自身[じしん]のために救[すく]いを成[な]し遂[と]げた。"
  2: "主[しゅ]はその救[すく]いを明[あき]らかにし、諸国[しょこく]の民[たみ]の前[まえ]にその義[ぎ]を現[あらわ]された。"
  3: "主[しゅ]はヤコブへのあわれみと、イスラエルの家[いえ]への真実[しんじつ]とを思[おも]い起[おこ]された。地[ち]の果[は]てはこぞって、わたしたちの神[かみ]の救[すく]いを見[み]た。"
  4: "全[ぜん]地[ち]よ、神[かみ]に向[む]かって喜[よろこ]びの声[こえ]を上[あ]げよ。歌[うた]え、喜[よろこ]び躍[おど]れ、琴[こと]を奏[かな]でよ。"
  5: "琴[こと]をもって主[しゅ]にほめ歌[うた]を歌[うた]え。琴[こと]と、賛美[さんび]の声[こえ]とをもって。"
  6: "ラッパの響[ひび]きと角笛[つのぶえ]の声[こえ]をもって、王[おう]である主[しゅ]の前[まえ]に喜[よろこ]びの声[こえ]を上[あ]げよ。"
  7: "海[うみ]とその満[み]ちるものは震[ふる]え。世界[せかい]とそこに住[す]む者[もの]も震[ふる]えよ。"
  8: "川[かわ]々[がわ]はそろって手[て]を打[う]ち、山[やま]々[やま]はともに喜[よろこ]び躍[おど]る。"
  9: "主[しゅ]が地[ち]を裁[さば]くために来[こ]られるからである。主[しゅ]は義[ぎ]をもって世界[せかい]を、正[ただ]しさをもって諸[しょ]民[みん]を裁[さば]かれる。"

notes:
  0: "Ψαλμὸς τῷ Δαυιδ — ダビデの詩 (ψαλμός — «псалом», песнь под струнный инструмент). Надписание — стих 0, как в русской базе сайта; в gr-lxx-byz строка 0 есть, поэтому взято оттуда (у jp-joc «（ダワィドの）詠»)."
  1: "Ἄισατε τῷ κυρίῳ ᾆσμα καινόν — 主に新しい歌を歌え (ᾆσμα καινόν — «песнь новая»; та же формула в Откр 5:9; 14:3). ὅτι θαυμαστὰ ἐποίησεν κύριος — 主は驚くべきことを行われた (θαυμαστά — «дивное»). ἔσωσεν αὐτῷ ἡ δεξιὰ αὐτοῦ — その右の手が主ご自身のために救いを成し遂げた (αὐτῷ — датив выгоды: «Ему», т. е. Он даровал Себе победу; слав. «спасе Его десница»; поэтому не «спасла Его»). ὁ βραχίων ὁ ἅγιος αὐτοῦ — 聖なる腕 (βραχίων — «мышца», образ силы)."
  2: "ἐγνώρισεν κύριος τὸ σωτήριον αὐτοῦ — 主はその救いを明らかにし (γνωρίζω — «делать известным»; σωτήριον — «спасение»). ἐναντίον τῶν ἐθνῶν ἀπεκάλυψεν τὴν δικαιοσύνην αὐτοῦ — 諸国の民の前にその義を現された (ἀποκαλύπτω — «открывать»; δικαιοσύνη — 義, как по корпусу)."
  3: "ἐμνήσθη τοῦ ἐλέους αὐτοῦ τῷ Ιακωβ — ヤコブへのあわれみを思い起された (ἔλεος — あわれみ; датив «Иакову»). τῆς ἀληθείας αὐτοῦ τῷ οἴκῳ Ισραηλ — イスラエルの家への真実 (ἀλήθεια — «истина, верность», передано 真実). εἴδοσαν πάντα τὰ πέρατα τῆς γῆς — 地の果てはこぞって見た (πέρας — «предел»); τὸ σωτήριον τοῦ θεοῦ ἡμῶν — わたしたちの神の救い."
  4: "ἀλαλάξατε τῷ θεῷ, πᾶσα ἡ γῆ — 全地よ、神に喜びの声を上げよ (ἀλαλάζω — «восклицать, ликовать», как в ст. 6). ᾄσατε καὶ ἀγαλλιᾶσθε καὶ ψάλατε — 歌え、喜び躍れ、琴を奏でよ; три глагола сохранены, ψάλλω — «петь под струны»."
  5: "ψάλατε τῷ κυρίῳ ἐν κιθάρᾳ — 琴をもって主にほめ歌を歌え (κιθάρα — 琴[こと], как по корпусу, Пс 32:2; 42:5). ἐν κιθάρᾳ καὶ φωνῇ ψαλμοῦ — 琴と、賛美の声とをもって; повтор «на кифаре» сохранён (φωνὴ ψαλμοῦ — «голос псалма»)."
  6: "ἐν σάλπιγξιν ἐλαταῖς — ラッパの響き (σάλπιγξ ἐλατή — «труба кованая», из цельного серебра, Числ 10:2; ラッパ как в Пс 46:6). φωνῇ σάλπιγγος κερατίνης — 角笛の声 (κεράτινος — «роговой»). ἀλαλάξατε ἐνώπιον τοῦ βασιλέως κυρίου — 王である主の前に喜びの声を上げよ."
  7: "σαλευθήτω ἡ θάλασσα καὶ τὸ πλήρωμα αὐτῆς — 海とその満ちるものは震えよ (σαλεύω — «колебать»; πλήρωμα — «полнота, то, что наполняет»). ἡ οἰκουμένη καὶ οἱ κατοικοῦντες ἐν αὐτῇ — 世界とそこに住む者も (οἰκουμένη — 世界, как по корпусу)."
  8: "ποταμοὶ κροτήσουσιν χειρὶ ἐπὶ τὸ αὐτό — 川々はそろって手を打ち (κροτέω — «ударять, рукоплескать»; ἐπὶ τὸ αὐτό — «вместе»). τὰ ὄρη ἀγαλλιάσονται — 山々は喜び躍る; параллелизм сохранён."
  9: "ὅτι ἥκει κρῖναι τὴν γῆν — 主が地を裁くために来られるからである (ἥκω — «приходить, прибывать»; инфинитив цели). κρινεῖ τὴν οἰκουμένην ἐν δικαιοσύνῃ — 義をもって世界を裁かれる. λαοὺς ἐν εὐθύτητι — 諸民を正しさをもって (εὐθύτης — «прямота»; 正しさ, как в Пс 44:7)."
