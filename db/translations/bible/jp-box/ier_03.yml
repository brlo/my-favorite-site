verses:
  1: "「人[ひと]が自分[じぶん]の妻[つま]を去[さ]らせ、その女[おんな]が彼[かれ]のもとを離[はな]れて別[べつ]の男[おとこ]の妻[つま]になったなら、その女[おんな]はもとの夫[おっと]のもとへ再[ふたた]び帰[かえ]って来[く]るだろうか。その女[おんな]は汚[けが]れ、汚[けが]れてしまうのではないか。あなたは多[おお]くの牧者[ぼくしゃ]たちと淫行[いんこう]を重[かさ]ねたのに、それでもわたしのもとへ帰[かえ]って来[き]たのか、と主[しゅ]は言[い]われる。"
  2: "あなたの目[め]を高[たか]い所[ところ]に上[あ]げて見[み]よ。どこで、あなたは辱[はずかし]められなかったというのか。あなたは道[みち]のほとりに座[すわ]って彼[かれ]らを待[ま]った。荒野[こうや]に捨[す]てられた烏[からす]のように。あなたは淫行[いんこう]と悪[あく]とによって地[ち]を汚[けが]した。"
  3: "また、あなたは多[おお]くの牧者[ぼくしゃ]たちを自分[じぶん]のつまずきとした。あなたの顔[かお]は遊女[ゆうじょ]の顔となり、あなたはすべての者[もの]の前[まえ]で恥[はじ]を知[し]らぬ者[もの]となった。"
  4: "『あなたはわたしを家[いえ]のように、父[ちち]のように、わたしの処女[しょじょ]の時[とき]の導[みちび]き手[て]のように呼[よ]ばなかったか。"
  5: "いつまでも怒[いか]りを保[たも]たれるのか。とこしえに敵意[てきい]を抱[だ]かれるのか』。見[み]よ、あなたはこう語[かた]り、悪[あく]をなして、それを成[な]し遂[と]げた。」"
  6: "主[しゅ]はヨシヤ王[おう]の時代[じだい]にわたしに言[い]われた。「あなたは、イスラエルの家[いえ]がわたしにしたことを見[み]たか。彼女[かのじょ]はすべての高[たか]い山[やま]、すべての茂[しげ]った木[き]の下[した]へ行[い]って、そこで淫行[いんこう]を重[かさ]ねた。"
  7: "わたしは、彼女[かのじょ]がこれらすべてのことをした後[あと]、『わたしのもとへ帰[かえ]れ』と言[い]った。しかし、彼女は帰[かえ]らなかった。そして、その背信[はいしん]の妹[いもうと]ユダが見[み]た。"
  8: "わたしは、背信[はいしん]の女[おんな]イスラエルが姦淫[かんいん]を犯[おか]したすべてのことのゆえに彼女を去[さ]らせ、離縁状[りえんじょう]を彼女の手[て]に渡[わた]したのを見[み]た。しかし、その背信[はいしん]の妹[いもうと]ユダは恐[おそ]れず、自分[じぶん]も行[い]って淫行[いんこう]を重[かさ]ねた。"
  9: "彼女[かのじょ]の淫行[いんこう]は何[なん]にもならず、彼女は地[ち]を汚[けが]し、木[き]と石[いし]と姦淫[かんいん]した。"
  10: "それでも、そのすべてのことに、その背信[はいしん]の妹[いもうと]ユダは心[こころ]の底[そこ]からわたしに帰[かえ]らなかった。ただ偽[いつわ]りであった、と主[しゅ]は言[い]われる。」"
  11: "主[しゅ]はわたしに言[い]われた。「背信[はいしん]の女[おんな]イスラエルは、背信[はいしん]の妹[いもうと]ユダよりも自分[じぶん]の魂[たましい]を正[ただ]しいとした。」"
  12: "「行[い]って、これらの言葉[ことば]を北[きた]に向[む]かって告[つ]げよ。『背[そむ]いた子[こ]らよ、わたしのもとへ帰[かえ]れ、と主[しゅ]は言[い]われる。わたしはあなたがたに顔[かお]を固[かた]めて向[む]けることはしない。わたしはあわれみ深[ぶか]く、とこしえに怒[いか]り続[つづ]けることはしない、と主[しゅ]は言[い]われる。"
  13: "しかし、あなたの罪[つみ]を知[し]れ。あなたは自分[じぶん]の神[かみ]である主[しゅ]に背[そむ]き、すべての茂[しげ]った木[き]の下[した]でよその者[もの]たちにあなたの道[みち]を広[ひろ]げ、わたしの声[こえ]に聞[き]き従[したが]わなかった、と主[しゅ]は言[い]われる』。"
  14: "背[そむ]いた子[こ]らよ、帰[かえ]れ、と主[しゅ]は言[い]われる。わたしはあなたがたを治[おさ]める者[もの]となり、あなたがたを町[まち]から一人[ひとり]、氏族[しぞく]から二人[ふたり]ずつ取[と]って、シオンへ連[つ]れて来[く]る。"
  15: "わたしはあなたがたに、わたしの心[こころ]にかなう牧者[ぼくしゃ]たちを与[あた]え、彼[かれ]らは知識[ちしき]と教[おし]えをもってあなたがたを養[やしな]う。"
  16: "そして、あなたがたが地[ち]に増[ふ]え、多[おお]くなる日[ひ]には、と主[しゅ]は言[い]われる、その日[ひ]にはもはや『イスラエルの聖[せい]なる方[かた]の契約[けいやく]の箱[はこ]』と言[い]わず、それが心[こころ]に上[のぼ]ることも、思[おも]い起[こ]こすことも、訪[おとず]れることもなく、もう造[つく]られることもない。"
  17: "その日[ひ]、その時[とき]には、人々[ひとびと]はエルサレムを『主[しゅ]の王座[おうざ]』と呼[よ]び、すべての民[たみ]がそこに、主[しゅ]の名[な]のゆえにエルサレムに集[あつ]められ、もはや自分[じぶん]の悪[あく]い心[こころ]の思[おも]いのままに歩[あゆ]まない。"
  18: "その日[ひ]には、ユダの家[いえ]がイスラエルの家[いえ]のもとへ連[つら]なって行[い]き、ともに北[きた]の地[ち]から、わたしがあなたがたの父祖[ふそ]たちに嗣業[しぎょう]として与[あた]えた地[ち]へ来[く]る。"
  19: "わたしは言[い]った。『主[しゅ]よ、どうか、そうなってほしい。わたしはあなたを子[こ]らの中[なか]に置[お]き、あなたに望[のぞ]ましい地[ち]、もろもろの民[たみ]の嗣業[しぎょう]の誉[ほま]れである選[えら]ばれた地[ち]を与[あた]えよう』と。そして言[い]った。『あなたはわたしを父[ちち]と呼[よ]び、わたしから離[はな]れない』と。"
  20: "しかし、女[おんな]がその夫[おっと]を裏切[うらぎ]るように、イスラエルの家[いえ]はわたしを裏切[うらぎ]った、と主[しゅ]は言[い]われる。」"
  21: "丘[おか]の上[うえ]には、イスラエルの子[こ]らの泣[な]きと願[ねが]いの声[こえ]が、その唇[くちびる]から聞[き]こえた。彼[かれ]らが自分[じぶん]の道[みち]を曲[ま]げ、自分[じぶん]の神[かみ]、聖[せい]なる方[かた]を忘[わす]れたからである。"
  22: "「背[そむ]いた子[こ]らよ、帰[かえ]れ。わたしはあなたがたの背[そむ]きを癒[いや]す」。「見[み]よ、わたしたちはあなたのもとへ行[い]く。あなたは主[しゅ]、わたしたちの神[かみ]だからだ。"
  23: "まことに、丘[おか]の上[うえ]のもの、山々[やまやま]の群[む]れは偽[いつわ]りであった。まことに、イスラエルの救[すく]いは主[しゅ]、わたしたちの神[かみ]にある。"
  24: "恥[はずかし]めは、わたしたちの若[わか]い時[とき]から、父祖[ふそ]たちの労苦[ろうく]を食[く]い尽[つ]くしてきた。彼[かれ]らの羊[ひつじ]も牛[うし]も、その息子[むすこ]たちも娘[むすめ]たちも。"
  25: "わたしたちは恥[はずかし]めの中[なか]に伏[ふ]し、辱[はずかし]めがわたしたちを覆[おお]っている。わたしたちも父祖[ふそ]たちも、若[わか]い時[とき]から今日[きょう]まで、わたしたちの神[かみ]である主[しゅ]に罪[つみ]を犯[おか]し、主[しゅ]の声[こえ]に聞[き]従[したが]わなかったからである。」"

notes:
  1: "Ἐὰν ἐξαποστείλῃ ἀνὴρ τὴν γυναῖκα αὐτοῦ — «если муж отпустит жену свою» (ἐξαποστέλλω — отпускать, отсылать). μὴ ἀνακάμπτουσα ἀνακάμψει πρὸς αὐτὸν ἔτι — «разве, возвращаясь, вернётся к нему ещё?» (ἀνακάμπτω — возвращаться; повтор корня сохранён). Глава открывается словом Господа без вводной формулы — кавычки открываются здесь и держатся до 3:5. οὐ μιαινομένη μιανθήσεται ἡ γυνὴ ἐκείνη — «не осквернится ли жена та?» (μιαίνω — осквернять; слав. «еда непорочна будет и неосквернена»). καὶ σὺ ἐξεπόρνευσας ἐν ποιμέσιν πολλοῖς — «а ты блудила с пастырями многими» (ἐκπορνεύω). καὶ ἀνέκαμπτες πρός με — «и возвращалась ко Мне» (имперфект — длительное действие), в тексте вопрос."
  2: "ἆρον εἰς εὐθεῖαν τοὺς ὀφθαλμούς σου — «подними глаза твои прямо [на высоты]» (εὐθεῖα — прямое, правое; слав. «на правоту»). ποῦ οὐχὶ ἐξεφύρθης — «где ты не была осквернена [блудом]?» (ἐκφύρω — марать, осквернять). ἐπὶ ταῖς ὁδοῖς ἐκάθισας αὐτοῖς — «на дорогах сидела ты для них». ὡσεὶ κορώνη ἐρημουμένη — «как ворон пустынный, одинокий» (κορώνη — ворон; ἐρημόω — опустошать); у ru (МТ) «как Аравитянин в пустыне» — иное чтение, держим LXX/csl («аки врана особящаяся»). ἐμίανας τὴν γῆν ἐν ταῖς πορνείαις σου — «осквернила землю блудом твоим»."
  3: "καὶ ἔσχες ποιμένας πολλοὺς εἰς πρόσκομμα σεαυτῇ — «и имела пастырей многих в преткновение себе» (πρόσκομμα — преткновение, соблазн). ὄψις πόρνης ἐγένετό σοι — «лицо блудницы стало у тебя» (ὄψις — лицо, вид). ἀπηναισχύντησας πρὸς πάντας — «ты потеряла стыд перед всеми» (ἀπαναισχυντέω — бесстыдствовать); слав. «не хотела еси постыдетися ко всем». У ru (МТ) стих начинается с «удержаны дожди» — этого нет в LXX."
  4: "οὐχ ὡς οἶκόν με ἐκάλεσας καὶ πατέρα — «разве ты не называла Меня домом и отцом?» (καλέω — называть). ἀρχηγὸν τῆς παρθενίας σου — «вождём девства твоего» (ἀρχηγός — начальник, вождь; παρθενία — девство). Это слова Иуды, обращённые к Богу, поэтому вложенная цитата 『…』; она продолжается в 3:5."
  5: "μὴ διαμενεῖ εἰς τὸν αἰῶνα ἢ διαφυλαχθήσεται εἰς νεῖκος — «разве пребудет вовеки или сохранится в вражду?» (διαμένω — пребывать; νεῖκος — вражда, ссора; слав. «в победу» — иное понимание). ἰδοὺ ἐλάλησας καὶ ἐποίησας τὰ πονηρὰ ταῦτα καὶ ἠδυνάσθης — «вот, ты говорила и делала это злое и преуспела» (δύναμαι — быть в силах). Здесь закрываются и вложенная цитата, и слово Господа."
  6: "ἐν ταῖς ἡμέραις Ιωσια τοῦ βασιλέως — «во дни Иосии царя». ἡ κατοικία τοῦ Ισραηλ — «обиталище Израиля», т. е. Израиль как дом (κατοικία — жилище; слав. «дом израилев»). ἐπορεύθησαν ἐπὶ πᾶν ὄρος ὑψηλὸν καὶ ὑποκάτω παντὸς ξύλου ἀλσώδους — «ходили на всякую гору высокую и под всяким деревом ветвистым» (ἀλσώδης — лесистый, ветвистый); καὶ ἐπόρνευσαν ἐκεῖ — «и блудили там»."
  7: "καὶ εἶπα μετὰ τὸ πορνεῦσαι αὐτὴν ταῦτα πάντα Πρός με ἀνάστρεψον — «и Я сказал после того, как она блудила всё это: обратись ко Мне» (ἀναστρέφω — возвращать, обращать): слова Господа внутри Его же речи — вложенная 『…』. καὶ οὐκ ἀνέστρεψεν — «и не обратилась». ἡ ἀσύνθετος Ιουδα — «вероломная Иуда» (ἀσύνθετος — нарушившая договор, вероломная); этот эпитет проходит через главу."
  8: "περὶ πάντων ὧν κατελήμφθη ἐν οἷς ἐμοιχᾶτο — «за всё, в чём она была уличены, в чём прелюбодействовала» (καταλαμβάνω — застигать, уличать; μοιχάομαι — прелюбодействовать). ἐξαπέστειλα αὐτὴν καὶ ἔδωκα αὐτῇ βιβλίον ἀποστασίου εἰς τὰς χεῖρας αὐτῆς — «Я отпустил её и дал ей разводное письмо в руки её» (βιβλίον ἀποστασίου — разводная грамота, 離縁状). οὐκ ἐφοβήθη ἡ ἀσύνθετος Ιουδα — «не убоялась вероломная Иуда»."
  9: "καὶ ἐγένετο εἰς οὐθὲν ἡ πορνεία αὐτῆς — «и блуд её обратился в ничто» (εἰς οὐθέν — ни во что). ἐμοίχευσεν τὸ ξύλον καὶ τὸν λίθον — «прелюбодействовала с деревом и камнем», т. е. с идолами. Слав. добавляет «и оскверни землю» — нет в LXX, внесено в основной текст без скобок."
  10: "καὶ ἐν πᾶσιν τούτοις οὐκ ἐπεστράφη πρός με ἐξ ὅλης τῆς καρδίας αὐτῆς — «и при всём этом не обратилась ко Мне всем сердцем своим» (ἐπιστρέφω). ἀλλ᾽ ἐπὶ ψεύδει — «но лживо» (ψεῦδος — ложь); слав. «но во лжи». Слово Господа закрывается в конце стиха."
  11: "Ἐδικαίωσεν τὴν ψυχὴν αὐτοῦ Ισραηλ ἀπὸ τῆς ἀσυνθέτου Ιουδα — «оправдал душу свою Израиль по сравнению с вероломной Иудой» (δικαιόω — оправдывать; ἀπό — «от», здесь сравнительно); слав. «оправда душу свою отступница израиль, паче преступницы иудеи». Смысл: Израиль менее виновен, чем Иуда."
  12: "πορεύου καὶ ἀνάγνωθι τοὺς λόγους τούτους πρὸς βορρᾶν — «иди и прочти слова эти к северу» (ἀναγινώσκω — читать, провозглашать). Ἐπιστράφητι πρός με, ἡ κατοικία τοῦ Ισραηλ — «обратись ко Мне, обиталище Израиля»: начало вложенной цитаты-провозглашения, она идёт до 3:13. οὐ στηριῶ τὸ πρόσωπόν μου ἐφ᾽ ὑμᾶς — «не утвержу лица Моего на вас» (στηρίζω — утверждать), т. е. не буду держать гнев; в тексте «顔を固めて向けることはしない». ὅτι ἐλεήμων ἐγώ εἰμι — «ибо Я милостив» (ἐλεήμων); καὶ οὐ μηνιῶ ὑμῖν εἰς τὸν αἰῶνα — «и не буду гневаться на вас вовеки» (μηνίω — гневаться)."
  13: "πλὴν γνῶθι τὴν ἀδικίαν σου — «впрочем, знай беззаконие твоё» (πλήν — впрочем; ἀδικία — неправда). εἰς κύριον τὸν θεόν σου ἠσέβησας — «ты нечествовала против Господа Бога твоего» (ἀσεβέω). διέχεας τὰς ὁδούς σου εἰς ἀλλοτρίους — «расточила пути твои чужим» (διαχέω — разливать, расточать). τῆς δὲ φωνῆς μου οὐχ ὑπήκουσας — «гласа Моего не послушала» (ὑπακούω). Здесь закрывается вложенная цитата; слово Господа продолжается до 3:20."
  14: "ἐπιστράφητε, υἱοὶ ἀφεστηκότες — «обратитесь, сыны отступившие» (ἀφεστηκώς — отпавший, отступивший). ἐγὼ κατακυριεύσω ὑμῶν — «Я буду господствовать над вами» (κατακυριεύω); слав. «возобладаю вами». λήμψομαι ὑμᾶς ἕνα ἐκ πόλεως καὶ δύο ἐκ πατριᾶς — «возьму вас по одному из города и по два из племени»: малое число возвращённых, сохранено без сглаживания."
  15: "δώσω ὑμῖν ποιμένας κατὰ τὴν καρδίαν μου — «дам вам пастырей по сердцу Моему» (ποιμήν — пастырь, 牧者). ποιμανοῦσιν ὑμᾶς ποιμαίνοντες μετ᾽ ἐπιστήμης — «будут пасти вас, пася с знанием» (ποιμαίνω; ἐπιστήμη — знание, разумение); повтор глагола сохранён деепричастием. Слав. даёт два существительных («разумом и учением»), в LXX одно ἐπιστήμη — оба внесены (知識と教え)."
  16: "ἐὰν πληθυνθῆτε καὶ αὐξηθῆτε ἐπὶ τῆς γῆς — «когда вы умножитесь и возрастёте на земле» (πληθύνω, αὔξω). οὐκ ἐροῦσιν ἔτι Κιβωτὸς διαθήκης ἁγίου Ισραηλ — «не будут говорить более: ковчег завета Святого Израилева»: слова народа — вложенная 『…』 (κιβωτός — ковчег, 箱; διαθήκη — завет, 契約). οὐκ ἀναβήσεται ἐπὶ καρδίαν — «не взойдёт на сердце», οὐκ ὀνομασθήσεται οὐδὲ ἐπισκεφθήσεται — «не будет назван и не будет посещаем» (ἐπισκέπτομαι — посещать, взыскивать); καὶ οὐ ποιηθήσεται ἔτι — «и не будет более сделан». У ru (МТ) «ковчег завета Господня» — чтение МТ, в LXX «Святого Израилева»."
  17: "ἐν ταῖς ἡμέραις ἐκείναις καὶ ἐν τῷ καιρῷ ἐκείνῳ — «в те дни и в то время»: двойная дата, как в греч. καλέσουσιν τὴν Ιερουσαλημ Θρόνος κυρίου — «нарекут Иерусалим престолом Господним» (θρόνος — престол, 王座): вложенная 『…』. συναχθήσονται εἰς αὐτὴν πάντα τὰ ἔθνη — «соберутся в неё все народы». οὐ πορεύσονται ἔτι ὀπίσω τῶν ἐνθυμημάτων τῆς καρδίας αὐτῶν τῆς πονηρᾶς — «не будут более ходить за помышлениями сердца своего злого» (ἐνθύμημα — помышление). Слав. добавляет «во имя Господне во Иерусалим» — нет в LXX, внесено без скобок (主の名のゆえに)."
  18: "συνελεύσονται οἶκος Ιουδα ἐπὶ τὸν οἶκον τοῦ Ισραηλ — «соберутся дом Иудин с домом Израилевым» (συνέρχομαι — сходиться); слав. «приидет дом иудин ко дому израилеву». ἥξουσιν ἐπὶ τὸ αὐτὸ ἀπὸ γῆς βορρᾶ — «придут вместе из земли северной» (ἐπὶ τὸ αὐτό — вместе). ἣν κατεκληρονόμησα τοὺς πατέρας αὐτῶν — «которую Я дал в наследие отцам их» (κληρονομέω — наследовать, давать в наследие; 嗣業)."
  19: "καὶ ἐγὼ εἶπα Γένοιτο, κύριε — «и Я сказал: да будет, Господи» (γένοιτο — оптатив от γίνομαι). ὅτι τάξω σε εἰς τέκνα — «что поставлю тебя в сынов» (τάσσω — ставить). γῆν ἐκλεκτὴν κληρονομίαν θεοῦ παντοκράτορος ἐθνῶν — «землю избранную, наследие Бога Вседержителя народов» (παντοκράτωρ — Вседержитель). καὶ εἶπα Πατέρα καλέσετέ με — «и сказал: отцом будете называть Меня»; καὶ ἀπ᾽ ἐμοῦ οὐκ ἀποστραφήσεσθε — «и от Меня не отвратитесь». Оба речения Господа о самом себе — вложенные 『…』; обращение «Господи» внутри Его же речи — особенность текста, не сглажена."
  20: "πλὴν ὡς ἀθετεῖ γυνὴ εἰς τὸν συνόντα αὐτῇ — «впрочем, как жена вероломно поступает с живущим с нею» (ἀθετέω — отвергать, нарушать верность; σύνειμι — быть вместе). οὕτως ἠθέτησεν εἰς ἐμὲ οἶκος Ισραηλ — «так поступил вероломно со Мною дом Израилев». Слово Господа закрывается в конце стиха."
  21: "φωνὴ ἐκ χειλέων ἠκούσθη κλαυθμοῦ καὶ δεήσεως υἱῶν Ισραηλ — «голос с уст слышен был плача и моления сынов Израилевых» (χεῖλος — губа; κλαυθμός — плач; δέησις — моление). ὅτι ἠδίκησαν ἐν ταῖς ὁδοῖς αὐτῶν — «что они неправду делали на путях своих» (ἀδικέω). ἐπελάθοντο θεοῦ ἁγίου αὐτῶν — «забыли Бога, Святого своего» (ἐπιλανθάνομαι). Авторский текст, кавычек нет."
  22: "ἐπιστράφητε, υἱοὶ ἐπιστρέφοντες — «обратитесь, сыны обращающиеся»: игра слов ἐπιστρέφω сохранена двумя формами. καὶ ἰάσομαι τὰ συντρίμματα ὑμῶν — «и исцелю сокрушения ваши» (ἰάομαι — исцелять; σύντριμμα — сокрушение, 背き). ἰδοὺ δοῦλοι ἡμεῖς ἐσόμενά σοι — «вот, мы будем рабами Тебе»: с этого места начинается исповедание народа в 「…», оно идёт до конца главы. ὅτι σὺ κύριος ὁ θεὸς ἡμῶν εἶ — «ибо Ты Господь Бог наш»."
  23: "ὄντως εἰς ψεῦδος ἦσαν οἱ βουνοὶ καὶ ἡ δύναμις τῶν ὀρέων — «воистину в ложь были холмы и сила гор» (ὄντως — воистину; βουνός — холм); слав. «истинно лживи быша холми и множество гор». πλὴν διὰ κυρίου θεοῦ ἡμῶν ἡ σωτηρία τοῦ Ισραηλ — «но Господом Богом нашим спасение Израиля» (σωτηρία — спасение). Противопоставление «ложь — спасение» сохранено."
  24: "ἡ δὲ αἰσχύνη κατανάλωσεν τοὺς μόχθους τῶν πατέρων ἡμῶν — «а стыд поел труды отцов наших» (αἰσχύνη — стыд, здесь идол Ваал; κατανάλισκω — поедать; μόχθος — труд, 労苦). ἀπὸ νεότητος ἡμῶν — «от юности нашей». τὰ πρόβατα αὐτῶν καὶ τοὺς μόσχους αὐτῶν καὶ τοὺς υἱοὺς αὐτῶν καὶ τὰς θυγατέρας αὐτῶν — «овец их, тельцов их, сыновей их и дочерей их»: перечень без глагола, как в греч."
  25: "ἐκοιμήθημεν ἐν τῇ αἰσχύνῃ ἡμῶν — «мы уснули в стыде нашем» (κοιμάομαι — спать, лежать). ἐπεκάλυψεν ἡμᾶς ἡ ἀτιμία ἡμῶν — «покрыл нас бесчестие наше» (ἀτιμία). ὅτι ἔναντι τοῦ θεοῦ ἡμῶν ἡμάρτομεν — «ибо пред Богом нашим согрешили мы». ἀπὸ νεότητος ἡμῶν ἕως τῆς ἡμέρας ταύτης — «от юности нашей до дня сего»; καὶ οὐχ ὑπηκούσαμεν τῆς φωνῆς κυρίου — «и не послушали гласа Господа». Кавычки закрываются, глава кончается исповеданием."
