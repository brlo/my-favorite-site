# jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 3: 1–5 суд над блудной женой: развод, пути на высотах, лоб блудницы, детский
# зов «отец»; 6–11 две сестры — Израиль и Иуда, отпускное письмо, Иуда виновнее;
# 12–13 призыв вернуться с севера и признать вину; 14–15 пастыри по сердцу;
# 16–18 ковчег завета больше не вспоминается, Иерусалим — престол Господа, возвращение
# обоих домов; 19–20 отцовство и измена; 21–25 плач на высотах и покаянное исповедание
# народа.
# Голоса: 3:1–5 одна цитата (слово Господа; слова Иуды — вложенная 『…』 с 3:4 до 3:5);
# 3:6–10 слово Господа (вложенная 『…』 в 3:7); 3:11 краткая цитата; 3:12–20 слово
# Господа (вложенные 『…』: призыв к северу в 3:12–13, ковчег в 3:16, престол в 3:17,
# два обетования в 3:19); 3:21 авторский текст без кавычек; 3:22а слово Господа —
# краткая цитата, с 3:22б до конца главы — исповедание народа в 「…」.
# Нумерация по gr: 25 стихов, совпадает с csl и ru. Держим гр; слав. местами сливает
# и добавляет (3:9 «и оскверни землю» — нет в LXX, внесено без скобок).
# 〔…〕 нет. Сносок ⟨…⟩ нет: 離縁状, 契約の箱, 王座, 嗣業, 処女 уже в корпусе или
