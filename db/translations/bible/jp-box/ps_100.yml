verses:
  1: "ダビデの詩[うた]。主[しゅ]よ、わたしはあわれみと裁[さば]きをあなたに歌[うた]おう。"
  2: "わたしは歌[うた]い、とがめのない道[みち]を悟[さと]ろう。あなたはいつ、わたしのところに来[こ]られるのか。わたしは家[いえ]の中[なか]で、心[こころ]の誠実[せいじつ]をもって歩[あゆ]んだ。"
  3: "わたしは自分[じぶん]の目[め]の前[まえ]に不正[ふせい]なことを置[お]かなかった。違反[いはん]を行[おこな]う者[もの]たちをわたしは憎[にく]んだ。"
  4: "曲[ま]がった心[こころ]はわたしに結[むす]び付[つ]かなかった。わたしから離[はな]れて行[ゆ]く悪[わる]い者[もの]を、わたしは知[し]らなかった。"
  5: "隣[となり]の人[ひと]をひそかに中傷[ちゅうしょう]する者[もの]を、わたしは追[お]い出[だ]した。高[たか]ぶった目[め]と飽[あ]くことのない心[こころ]の者[もの]と、わたしはともに食[た]べなかった。"
  6: "わたしの目[め]は地[ち]の忠実[ちゅうじつ]な者[もの]たちに向[む]けられ、彼[かれ]らをわたしのそばに座[すわ]らせた。とがめのない道[みち]を歩[あゆ]む者[もの]が、わたしに仕[つか]えた。"
  7: "高[たか]ぶることを行[おこな]う者[もの]は、わたしの家[いえ]の中[なか]に住[す]まなかった。不正[ふせい]を語[かた]る者[もの]は、わたしの目[め]の前[まえ]に立[た]ち続[つづ]けられなかった。"
  8: "朝[あさ]ごとに、わたしは地[ち]の罪[つみ]人[びと]をことごとく殺[ころ]し、主[しゅ]の都[みやこ]から不法[ふほう]を行[おこな]う者[もの]をすべて断[た]ち滅[ほろ]ぼした。"

notes:
  1: "Надписание (прежний ст. 0, влит в этот стих): Τῷ Δαυιδ ψαλμός — ダビデの詩; в gr-lxx-byz строка 0 есть, взято оттуда (порядок слов греч. «Давиду псалом»). Надписание влито в ст. 1, скобками не маркируется. Стих: Ἔλεος καὶ κρίσιν ᾄσομαί σοι, κύριε — 主よ、わたしはあわれみと裁きをあなたに歌おう (ἔλεος — あわれみ; κρίσις — 裁き). Будущее-решимость ᾄσομαι передано 歌おう, как и дальнейшие ψαλῶ, συνήσω."
  2: "ψαλῶ καὶ συνήσω ἐν ὁδῷ ἀμώμῳ — わたしは歌い、とがめのない道を悟ろう (ψάλλω — «петь под струны»; συνίημι — «разуметь»; ἄμωμος — «непорочный»). πότε ἥξεις πρός με — あなたはいつ、わたしのところに来られるのか (ἥκω — «приходить»). διεπορευόμην ἐν ἀκακίᾳ καρδίας μου — 心の誠実をもって歩んだ (διαπορεύομαι — «проходить, ходить»; ἀκακία — «незлобие, простота»). ἐν μέσῳ τοῦ οἴκου μου — 家の中で."
  3: "οὐ προεθέμην πρὸ ὀφθαλμῶν μου πρᾶγμα παράνομον — 目の前に不正なことを置かなかった (προτίθεμαι — «полагать пред собой»; παράνομος — «беззаконный»). ποιοῦντας παραβάσεις ἐμίσησα — 違反を行う者たちを憎んだ (παράβασις — «преступление, нарушение»)."
  4: "οὐκ ἐκολλήθη μοι καρδία σκαμβή — 曲がった心はわたしに結び付かなかった (κολλάω — «прилепляться»; σκαμβός — «кривой, развращенный»). ἐκκλίνοντος ἀπ᾿ ἐμοῦ τοῦ πονηροῦ οὐκ ἐγίνωσκον — わたしから離れて行く悪い者を、わたしは知らなかった (genitivus absolutus; слав. «Уклоняющагося от мене лукаваго не познавах»)."
  5: "τὸν καταλαλοῦντα λάθρᾳ τοῦ πλησίον αὐτοῦ — 隣人をひそかに中傷する者 (καταλαλέω — «злословить»; λάθρᾳ — «тайно»). τοῦτον ἐξεδίωκον — わたしは追い出した (ἐκδιώκω — «изгонять»). ὑπερηφάνῳ ὀφθαλμῷ καὶ ἀπλήστῳ καρδίᾳ — 高ぶった目と飽くことのない心 (ὑπερήφανος — «надменный»; ἄπληστος — «ненасытный»). τούτῳ οὐ συνήσθιον — ともに食べなかった (συνεσθίω — «есть вместе», т. е. не делил трапезы)."
  6: "οἱ ὀφθαλμοί μου ἐπὶ τοὺς πιστοὺς τῆς γῆς — わたしの目は地の忠実な者たちに向けられ (πιστός — «верный»). τοῦ συγκαθῆσθαι αὐτοὺς μετ᾿ ἐμοῦ — 彼らをわたしのそばに座らせるため (συγκάθημαι — «сидеть вместе»). πορευόμενος ἐν ὁδῷ ἀμώμῳ, οὗτός μοι ἐλειτούργει — とがめのない道を歩む者がわたしに仕えた (λειτουργέω — «служить»)."
  7: "οὐ κατῴκει ἐν μέσῳ τῆς οἰκίας μου ποιῶν ὑπερηφανίαν — 高ぶることを行う者はわたしの家の中に住まなかった (κατοικέω — «обитать»). λαλῶν ἄδικα οὐ κατεύθυνεν ἐναντίον τῶν ὀφθαλμῶν μου — 不正を語る者はわたしの目の前に立ち続けられなかった (κατευθύνω — «направлять прямо, утверждать»; слав. «не исправляше пред очима моима»)."
  8: "εἰς τὰς πρωίας ἀπέκτεννον πάντας τοὺς ἁμαρτωλοὺς τῆς γῆς — 朝ごとに、わたしは地の罪人をことごとく殺した (imperfect: делал это постоянно; πρωία — «утро»). τοῦ ἐξολεθρεῦσαι ἐκ πόλεως κυρίου πάντας τοὺς ἐργαζομένους τὴν ἀνομίαν — 主の都から不法を行う者をすべて断ち滅ぼすため (ἐξολεθρεύω — «истреблять»; ἐργάζομαι τὴν ἀνομίαν — «делать беззаконие»)."
