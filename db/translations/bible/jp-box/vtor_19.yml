verses:
  1: "「あなたの神[かみ]である主[しゅ]が、彼[かれ]らの地[ち]をあなたに与[あた]えようとして、その国民[こくみん]たちを滅[ほろ]ぼし尽[つ]くし、あなたが彼らを嗣業[しぎょう]として受[う]け継[つ]いで、彼らの町々[まちまち]と家々[いえいえ]に住[す]むようになったなら、"
  2: "あなたは、あなたの神[かみ]である主[しゅ]があなたに与[あた]えるあなたの地[ち]の中央[ちゅうおう]に、三[みっ]つの町[まち]をあなたのために選[えら]び分[わ]けなさい。"
  3: "あなたのために道[みち]を整[ととの]え、あなたの神[かみ]である主[しゅ]があなたに分[わ]け与[あた]える地[ち]の境[さかい]を三[みっ]つに分[わ]けなさい。そこが、人[ひと]を殺[ころ]した者[もの]すべてにとっての避難所[ひなんじょ]となるためである。"
  4: "殺[ころ]した者[もの]がそこへ逃[に]げて生[い]き延[の]びることのできる定[さだ]めは次[つぎ]のとおりである。すなわち、思[おも]いがけず隣人[りんじん]を打[う]ち、これまで彼[かれ]を憎[にく]んでいなかった者[もの]である。"
  5: "また、隣人[りんじん]とともに森[もり]へ行[い]って木[き]を集[あつ]めるとき、木を切[き]ろうとして斧[おの]を振[ふ]り上[あ]げた手[て]が滑[すべ]り、鉄[てつ]の刃[は]が柄[え]から抜[ぬ]けて隣人[りんじん]に当[あ]たり、その人[ひと]が死[し]んだなら、その者[もの]はこれらの町[まち]の一[ひと]つへ逃[に]げ込[こ]んで生き延[の]びることができる。"
  6: "血[ち]の復讐者[ふくしゅうしゃ]が、心[こころ]が燃[も]え立[た]って殺[ころ]した者[もの]の後[あと]を追[お]い、道[みち]が遠[とお]いために彼に追[お]いついてその命[いのち]を打[う]ち、死[し]なせてしまうことのないようにするためである。その者[もの]には死[し]の裁[さば]きはない。これまで彼[かれ]を憎[にく]んでいなかったからである。"
  7: "それゆえ、わたしはあなたにこの言葉[ことば]を命[めい]じて言[い]う。『あなたは自分のために三[みっ]つの町[まち]を選[えら]び分[わ]けなさい』と。"
  8: "また、あなたの神[かみ]である主[しゅ]が、あなたの父[ちち]たちに誓[ちか]ったとおりにあなたの境[さかい]を広[ひろ]げ、あなたに、父たちに与[あた]えると言[い]われたそのすべての地[ち]をお与[あた]えになるとき、"
  9: "もしあなたが、わたしが今日[きょう]あなたに命[めい]じるこのすべての戒[いまし]めを守[まも]って行[おこな]い、あなたの神[かみ]である主[しゅ]を愛[あい]し、そのすべての道[みち]をすべての日々[ひび]に歩[あゆ]むなら、あなたはこれらの三[みっ]つの町[まち]に、さらに三[みっ]つの町を加[くわ]えなければならない。"
  10: "あなたの神[かみ]である主[しゅ]が嗣業[しぎょう]としてあなたに与[あた]える地[ち]に、罪[つみ]のない血[ち]が流[なが]されることのないようにするためである。あなたのうちに血[ち]の罪を負[お]う者[もの]はない。"
  11: "しかし、もし人[ひと]が隣人[りんじん]を憎[にく]み、彼を待[ま]ち伏[ぶ]せして、立[た]ち向[む]かい、その命[いのち]を打[う]って死[し]なせ、そしてこれらの町[まち]の一[ひと]つへ逃[に]げたなら、"
  12: "その町[まち]の長老[ちょうろう]たちは人[ひと]を遣[つか]わして彼[かれ]をそこから引[ひ]き取[と]り、血[ち]の復讐者[ふくしゅうしゃ]の手[て]に渡[わた]さなければならない。彼[かれ]は死[し]ぬ。"
  13: "あなたの目[め]は彼[かれ]を惜[お]しんではならない。あなたはイスラエルから罪[つみ]のない血[ち]を清[きよ]めなければならない。そうすればあなたは幸[しあわ]せになる。"
  14: "あなたは、父[ちち]たちがあなたの嗣業[しぎょう]の地[ち]に定[さだ]めた隣人[りんじん]の境[さかい]を移[うつ]してはならない。その地は、あなたの神[かみ]である主[しゅ]が嗣業としてあなたに与[あた]える地である。"
  15: "一[ひと]人[り]の証人[しょうにん]は、人[ひと]に対[たい]するどのような不正[ふせい]、どのような罪[つみ]、どのような過[あやま]ちについても、それを証[しょう]言[げん]するために立[た]つことはできない。事[こと]は二[ふた]人[り]の証人[しょうにん]の口[くち]、または三人[さんにん]の証人[しょうにん]の口によって確[たし]かになる。"
  16: "もし、不正[ふせい]な証人[しょうにん]が人[ひと]に立[た]ち向[む]かい、その者[もの]の不敬[ふけい]を挙[あ]げて訴[うった]えるなら、"
  17: "争[あらそ]いのあるその二[ふた]人[り]は、主[しゅ]の前[まえ]、祭司[さいし]たちの前、その日々[ひび]にいる裁[さば]き人[びと]たちの前[まえ]に立[た]たなければならない。"
  18: "裁[さば]き人[びと]たちがよく調[しら]べたとき、見[み]よ、その証人[しょうにん]は偽[にせ]の証人であり、兄弟[きょうだい]に逆[さから]って偽[いつわ]りを証[しょう]言[げん]したなら、"
  19: "あなたがたは、彼[かれ]が兄弟[きょうだい]に加[くわ]えようとしたそのとおりのことを、彼[かれ]に対して行[おこな]わなければならない。こうしてあなたがたの間[あいだ]から悪[わる]い者[もの]を除[のぞ]き去[さ]らなければならない。"
  20: "残[のこ]りの者[もの]たちは聞[き]いて恐[おそ]れ、あなたがたの間[あいだ]で二度[にど]とこの悪[わる]いことを行[おこな]わなくなる。"
  21: "あなたの目[め]は彼[かれ]を惜[お]しんではならない。命[いのち]は命[いのち]をもって、目は目をもって、歯[は]は歯をもって、手[て]は手をもって、足[あし]は足をもって償[つぐな]われる。」"

notes:
  1: "ἀφανίσῃ — истребит (ἀφανίζω); κατακληρονομήσητε — наследуете, изгоните (κατακληρονομέω); анаколуф: ἃ ὁ θεός σου δίδωσίν σοι τὴν γῆν αὐτῶν — относительное с лишним дополнением («народы, которых землю даёт тебе Бог твой»); κατοικήσητε — поселитесь."
  2: "διαστελεῖς σεαυτῷ — отделишь себе (διαστέλλω); ἐν μέσῳ τῆς γῆς σου — среди земли твоей."
  3: "στόχασαι — наметь, приготовь (στοχάζομαι, «целиться»; слав. «уготови»); τριμεριεῖς — разделишь на три части (τριμερίζω); καταφυγή — убежище; φονευτής — убийца."
  4: "πρόσταγμα — постановление, устав; φύγῃ καὶ ζήσεται — убежит и будет жить; ἀκουσίως — невольно; πρὸ τῆς ἐχθὲς καὶ πρὸ τῆς τρίτης — «прежде вчерашнего и третьего дня», т.е. до последнего времени (идиом)."
  5: "ἐκκρουσθῇ ἡ χεὶρ αὐτοῦ τῇ ἀξίνῃ — «выбьется рука его с топором», т.е. рука сорвётся; ἀξίνη — топор; τὸ σιδήριον ἀπὸ τοῦ ξύλου — «железо от дерева», т.е. лезвие с рукояти (слав. «секира с топорища»); τύχῃ τοῦ πλησίον — попадёт в ближнего (τυγχάνω с родительным)."
  6: "ἀγχιστεύων τοῦ αἵματος — «ближайший родственник крови», мститель за кровь (血の復讐者, как в Числ 35); παρατεθέρμανται τῇ καρδίᾳ — воспламенился сердцем (perfect); κρίσις θανάτου — осуждение на смерть."
  7: "ἐντέλλομαι — заповедую; τὸ ῥῆμα τοῦτο — слово сие; διαστελεῖς σεαυτῷ — отдели себе. Слова повеления — 『…』."
  8: "ἐμπλατύνῃ τὰ ὅριά σου — распространит пределы твои (ἐμπλατύνω); ὤμοσεν τοῖς πατράσιν — поклялся отцам; ἣν εἶπεν δοῦναι — которую сказал дать."
  9: "ἀκούσῃς ποιεῖν — послушаешься делать; ἀγαπᾶν — любить; πορεύεσθαι ἐν ταῖς ὁδοῖς — ходить путями; προσθήσεις — прибавишь (προστίθημι)."
  10: "ἐκχυθήσεται — прольётся (ἐκχέω); αἷμα ἀναίτιον — кровь безвинная; ἐν κλήρῳ — в удел; αἵματι ἔνοχος — виновный в крови."
  11: "ἐνεδρεύσῃ — подстережёт, устроит засаду (ἐνεδρεύω); ἐπαναστῇ — восстанет; πατάξῃ ψυχήν — поразит жизнь."
  12: "γερουσία — совет старейшин (слав. «старейшины»); λήμψονται — возьмут; παραδώσουσιν εἰς χεῖρας — предадут в руки; ἀγχιστεύων τοῦ αἵματος — мститель за кровь."
  13: "οὐ φείσεται ὁ ὀφθαλμός — не пощадит глаз твой (фразеологизм); καθαριεῖς — очистишь; εὖ σοι ἔσται — благо тебе будет."
  14: "μετακινήσεις ὅρια — передвинешь границы (μετακινέω); ἃ ἔστησαν οἱ πατέρες — которые поставили отцы; κληρονομία — 嗣業; повтор «в наследии твоём, которым ты наследовал» в переводе сжат."
  15: "ἐμμενεῖ — устоит (ἐμμένω); μαρτυρῆσαι κατά — свидетельствовать против; ἀδικία — неправда, обида; ἁμάρτημα / ἁμαρτία — преступление / грех; ἐπὶ στόματος — «при устах», по показанию; σταθήσεται πᾶν ῥῆμα — утвердится всякое слово."
  16: "καταστῇ — выступит (καθίστημι); μάρτυς ἄδικος — свидетель неправедный; καταλέγων ἀσέβειαν — перечисляя нечестие, обвиняя."
  17: "ἀντιλογία — тяжба, пререкание; ἔναντι κυρίου καὶ ἔναντι τῶν ἱερέων καὶ τῶν κριτῶν — пред Господом, пред священниками и судьями."
  18: "ἐξετάσωσιν ἀκριβῶς — исследуют точно; μάρτυς ἄδικος — свидетель ложный; ἐμαρτύρησεν ἄδικα — свидетельствовал неправду; ἀντέστη — восстал (аорист)."
  19: "ποιήσετε αὐτῷ — сделаете ему; ἐπονηρεύσατο ποιῆσαι — замыслил сделать (πονηρεύομαι); ἐξαρεῖς τὸ πονηρόν — истребишь злое; ἐξ ὑμῶν αὐτῶν — из среды вас."
  20: "οἱ ἐπίλοιποι — остальные; φοβηθήσονται — убоятся; οὐ προσθήσουσιν — не приложат, т.е. не станут впредь; ῥῆμα πονηρόν — злое дело."
  21: "οὐ φείσεται ὁ ὀφθαλμός — не пощадит глаз; ψυχὴν ἀντὶ ψυχῆς — душу за душу (命は命をもって); ὀφθαλμὸν ἀντὶ ὀφθαλμοῦ и далее; в греч. нет сказуемого — эллипсис, в переводе добавлено 償われる. Слав. добавляет «якоже аще кто даст порок на ближняго своего, сице воздастся ему» — в греч. нет, не переводим."
