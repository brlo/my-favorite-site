verses:
  0: "エタン・エズラ人[じん]の教[おし]え。"
  1: "主[しゅ]よ、わたしはあなたのあわれみをとこしえに歌[うた]い、あなたの真実[しんじつ]を代[よ]々[よ]に、この口[くち]で告[つ]げ知[し]らせよう。"
  2: "あなたは言[い]われた。「あわれみはとこしえに建[た]てられる。あなたの真実[しんじつ]は天[てん]に備[そな]えられる。"
  3: "わたしは選[えら]ばれた者[もの]たちと契約[けいやく]を結[むす]び、わたしの僕[しもべ]ダビデに誓[ちか]った。"
  4: "とこしえにあなたの子孫[しそん]を備[そな]え、代[よ]々[よ]にあなたの王座[おうざ]を建[た]てよう」と。"
  5: "主[しゅ]よ、天[てん]はあなたの奇[き]跡[せき]とあなたの真実[しんじつ]を、聖[せい]なる者[もの]たちの集[つど]いのうちでほめたたえる。"
  6: "雲[くも]のうちで、だれが主[しゅ]に並[なら]び得[え]るだろうか。神[かみ]の子[こ]らのうちで、だれが主[しゅ]に似[に]ているだろうか。"
  7: "神[かみ]は聖[せい]なる者[もの]たちの集[つど]いのうちでほめたたえられ、大[おお]いなる方[かた]、ご自分[じぶん]の周[まわ]りにいるすべての者[もの]にとって恐[おそ]るべき方[かた]である。"
  8: "主[しゅ]、万軍[ばんぐん]の神[かみ]よ、だれがあなたに似[に]ているだろうか。あなたは力[ちから]ある方[かた]、主[しゅ]よ。あなたの真実[しんじつ]はあなたを囲[かこ]んでいる。"
  9: "あなたは海[うみ]の力[ちから]を治[おさ]め、その波[なみ]の荒[あ]れを静[しず]められる。"
  10: "あなたは高[たか]ぶる者[もの]を、傷[きず]ついた者[もの]のように低[ひく]くされ、力[ちから]ある御腕[みうで]によって敵[てき]を散[ち]らされた。"
  11: "天[てん]はあなたのもの、地[ち]もあなたのものである。世界[せかい]とその中[なか]に満[み]ちるものとを、あなたは基[もと]を据[す]えられた。"
  12: "北[きた]と海[うみ]を、あなたは造[つく]られた。タボルとエルモンは、あなたの名[な]によって喜[よろこ]び躍[おど]る。"
  13: "あなたの御腕[みうで]は力[ちから]とともにあり、あなたの手[て]は強[つよ]く、あなたの右[みぎ]の手[て]は高[たか]く上[あ]げられている。"
  14: "義[ぎ]と裁[さば]きはあなたの王座[おうざ]の備[そな]えであり、あわれみと真実[しんじつ]はあなたの前[まえ]を先[さき]を行[ゆ]く。"
  15: "喜[よろこ]びの声[こえ]を知[し]る民[たみ]は幸[さいわ]いである。主[しゅ]よ、彼[かれ]らはあなたの顔[かお]の光[ひかり]のうちを歩[あゆ]み、"
  16: "一日中[いちにちじゅう]、あなたの名[な]によって喜[よろこ]び、あなたの義[ぎ]によって高[たか]く上[あ]げられる。"
  17: "あなたは彼[かれ]らの力[ちから]の誇[ほこ]りであり、あなたの恵[めぐ]みによって、わたしたちの角[つの]は高[たか]く上[あ]げられる。"
  18: "わたしたちの助[たす]けは主[しゅ]から来[く]る。わたしたちの王[おう]はイスラエルの聖[せい]なる方[かた]から来[く]る。"
  19: "そのとき、あなたは幻[まぼろし]のうちで聖[せい]なる者[もの]たちに語[かた]り、言[い]われた。「わたしは力[ちから]ある者[もの]の上[うえ]に助[たす]けを置[お]き、わたしの民[たみ]のうちから選[えら]ばれた者[もの]を高[たか]く上[あ]げた。"
  20: "わたしはわたしの僕[しもべ]ダビデを見[み]いだし、わたしの聖[せい]なる油[あぶら]で彼[かれ]に油[あぶら]を注[そそ]いだ。"
  21: "わたしの手[て]は彼[かれ]を支[ささ]え、わたしの御腕[みうで]は彼[かれ]を強[つよ]くする。"
  22: "敵[てき]は彼[かれ]に勝[か]つことができず、不法[ふほう]の子[こ]も、重[かさ]ねて彼[かれ]を損[そこな]うことはない。"
  23: "わたしは彼[かれ]の敵[てき]を彼[かれ]の前[まえ]で打[う]ち砕[くだ]き、彼[かれ]を憎[にく]む者[もの]たちを敗走[はいそう]させる。"
  24: "わたしの真実[しんじつ]とわたしのあわれみは彼[かれ]とともにあり、わたしの名[な]によって彼[かれ]の角[つの]は高[たか]く上[あ]げられる。"
  25: "わたしは彼[かれ]の手[て]を海[うみ]に、彼[かれ]の右[みぎ]の手[て]を川[かわ]々[がわ]に置[お]く。"
  26: "彼[かれ]はわたしを呼[よ]び、『あなたはわたしの父[ちち]、わたしの神[かみ]、わたしの救[すく]いの支[ささ]え手[て]である』と言[い]う。"
  27: "わたしは彼[かれ]を長子[ちょうし]とし、地[ち]の王[おう]たちよりも高[たか]い者[もの]とする。"
  28: "わたしはとこしえに彼[かれ]にわたしのあわれみを守[まも]り、わたしの契約[けいやく]は彼[かれ]に対して忠実[ちゅうじつ]であり続[つづ]ける。"
  29: "わたしは彼[かれ]の子孫[しそん]をとこしえに、彼[かれ]の王座[おうざ]を天[てん]の日[ひ]のように保[たも]つ。"
  30: "もし彼[かれ]の子[こ]らがわたしの律法[りっぽう]を捨[す]て、わたしの裁[さば]きに従[したが]って歩[あゆ]まなければ、"
  31: "もし彼[かれ]らがわたしの定[さだ]めを汚[けが]し、わたしの戒[いまし]めを守[まも]らなければ、"
  32: "わたしは杖[つえ]で彼[かれ]らの不法[ふほう]を、鞭[むち]で彼[かれ]らの罪[つみ]を罰[ばっ]する。"
  33: "しかし、わたしのあわれみを彼[かれ]から取[と]り去[さ]ることはない。わたしの真実[しんじつ]によって偽[いつわ]りをすることもない。"
  34: "わたしは自分の契約[けいやく]を汚[けが]さず、この唇[くちびる]から出[で]たことを無[む]効[こう]にしない。"
  35: "わたしは一度[いちど]、わたしの聖[せい]なるものによって誓[ちか]った。ダビデに偽[いつわ]りをつくことがあろうか。"
  36: "彼[かれ]の子孫[しそん]はとこしえに残[のこ]り、彼[かれ]の王座[おうざ]はわたしの前[まえ]で太陽[たいよう]のようである。"
  37: "月[つき]のように、とこしえに整[ととの]えられる。天[てん]の証人[しょうにん]は忠実[ちゅうじつ]である」と。"
  38: "しかし、あなたは退[しりぞ]け、軽[かろ]んじられた。あなたの油[あぶら]を注[そそ]がれた方[かた]を投[な]げ捨[す]てられた。"
  39: "あなたは僕[しもべ]との契約[けいやく]を覆[くつがえ]し、その聖所[せいしょ]を地[ち]に汚[けが]された。"
  40: "あなたは彼[かれ]の垣[かき]をことごとく壊[こわ]し、その砦[とりで]を恐[おそ]れの的[まと]とされた。"
  41: "道[みち]を行[ゆ]く者[もの]はみな、彼[かれ]をかすめ奪[うば]った。彼[かれ]は隣[となり]の者[もの]たちの嘲[あざけ]りとなった。"
  42: "あなたは彼[かれ]の敵[てき]たちの右[みぎ]の手[て]を高[たか]く上[あ]げ、彼[かれ]の敵[てき]をことごとく喜[よろこ]ばせられた。"
  43: "あなたは彼[かれ]の剣[つるぎ]の助[たす]けを退[しりぞ]け、戦[いくさ]のとき、彼[かれ]を支[ささ]えられなかった。"
  44: "あなたは彼[かれ]の清[きよ]めを取[と]り去[さ]り、その王座[おうざ]を地[ち]に打[う]ち倒[たお]された。"
  45: "あなたは彼[かれ]の生[い]きる時[とき]の日[ひ]々[び]を短[みじか]くし、彼[かれ]の上[うえ]に恥[はじ]を注[そそ]がれた。"
  46: "主[しゅ]よ、いつまでですか。あなたはどこまでも退[しりぞ]けられるのですか。あなたの怒[いか]りは火[ひ]のように燃[も]え上[あ]がるのですか。"
  47: "思[おも]い起[おこ]してください。わたしが何[なに]であるかを。あなたは人[ひと]の子[こ]らをみな、むなしく造[つく]られたのですか。"
  48: "人[ひと]のうち、だれが生[い]きながら死[し]を見[み]ずにいられるだろうか。だれがその魂[たましい]を陰府[よみ]の手[て]から救[すく]い出[だ]せるだろうか。"
  49: "主[しゅ]よ、あなたの昔[むかし]のあわれみはどこにあるのですか。あなたが真実[しんじつ]をもってダビデに誓[ちか]われた、あのあわれみは。"
  50: "主[しゅ]よ、あなたの僕[しもべ]たちが受[う]けた辱[はずかし]めを思[おも]い起[おこ]してください。このわたしが胸[むね]に抱[いだ]いてきた、多[おお]くの民[たみ]からの辱[はずかし]めを。"
  51: "主[しゅ]よ、あなたの敵[てき]が辱[はずかし]めたことを。彼[かれ]らがあなたの油[あぶら]を注[そそ]がれた方[かた]の足跡[あしあと]を辱[はずかし]めたことを。"
  52: "主[しゅ]はとこしえにほめたたえられますように。アーメン、アーメン。"

notes:
  0: "Συνέσεως Αιθαν τῷ Ισραηλίτῃ — «Разумения Ефаму Израильтянину» (σύνεσις — «разумение, учение»; в евр. «Ефам Езрахит», отсюда エズラ人; в греч. модуле стоит Ισραηλίτης — «израильтянин», ср. слав. «Ефама Израилтянина»). Надписание — стих 0, скобками не маркируется."
  1: "Τὰ ἐλέη σου, κύριε, εἰς τὸν αἰῶνα ᾄσομαι — 主よ、わたしはあなたのあわれみをとこしえに歌い (ἔλεος — あわれみ, как по корпусу; ᾄδω — «петь»). εἰς γενεὰν καὶ γενεὰν ἀπαγγελῶ τὴν ἀλήθειάν σου — あなたの真実を代々に告げ知らせよう (ἀλήθεια — 真実; ἀπαγγέλλω — «возвещать»). ἐν τῷ στόματί μου — この口で."
  2: "ὅτι εἶπας — あなたは言われた (вводит речь Божию; она продолжается в 3–4, поэтому 「」 открываются здесь и закрываются в 4). Εἰς τὸν αἰῶνα ἔλεος οἰκοδομηθήσεται — あわれみはとこしえに建てられる (οἰκοδομέω — «созидать»). ἐν τοῖς οὐρανοῖς ἑτοιμασθήσεται ἡ ἀλήθειά σου — あなたの真実は天に備えられる."
  3: "Διεθέμην διαθήκην τοῖς ἐκλεκτοῖς μου — わたしは選ばれた者たちと契約を結び (διατίθεμαι — «заключать завет»; ἐκλεκτοί — 選ばれた者たち). ὤμοσα Δαυιδ τῷ δούλῳ μου — わたしの僕ダビデに誓った."
  4: "Ἕως τοῦ αἰῶνος ἑτοιμάσω τὸ σπέρμα σου — とこしえにあなたの子孫を備え (σπέρμα — 子孫, как по корпусу). οἰκοδομήσω εἰς γενεὰν καὶ γενεὰν τὸν θρόνον σου — 代々にあなたの王座を建てよう (θρόνος — 王座). Слова Божии закрываются 」. διάψαλμα не передаётся."
  5: "ἐξομολογήσονται οἱ οὐρανοὶ τὰ θαυμάσιά σου, κύριε — 主よ、天はあなたの奇跡を…ほめたたえる (ἐξομολογέομαι — «славить, исповедовать»; θαυμάσιον — 奇跡). καὶ τὴν ἀλήθειάν σου ἐν ἐκκλησίᾳ ἁγίων — あなたの真実を、聖なる者たちの集いのうちで (ἀλήθεια — 真実; ἐκκλησία — «собрание»; ἅγιοι — 聖なる者たち, как по корпусу)."
  6: "τίς ἐν νεφέλαις ἰσωθήσεται τῷ κυρίῳ — 雲のうちで、だれが主に並び得るだろうか (ἰσόω — «уравнивать, уподоблять»; νεφέλη — 雲). τίς ὁμοιωθήσεται τῷ κυρίῳ ἐν υἱοῖς θεοῦ — 神の子らのうちで、だれが主に似ているだろうか (ὁμοιόω — «уподобляться»)."
  7: "ὁ θεὸς ἐνδοξαζόμενος ἐν βουλῇ ἁγίων — 神は聖なる者たちの集いのうちでほめたたえられ (βουλή — «совет, собрание»). μέγας καὶ φοβερὸς ἐπὶ πάντας τοὺς περικύκλῳ αὐτοῦ — 大きなる方、ご自分の周りにいるすべての者にとって恐るべき方 (φοβερός — «страшный, внушающий благоговение»)."
  8: "κύριε ὁ θεὸς τῶν δυνάμεων — 主、万軍の神よ (δυνάμεις — 万軍, как по корпусу). τίς ὅμοιός σοι — だれがあなたに似ているだろうか. δυνατὸς εἶ, κύριε — あなたは力ある方、主よ. ἡ ἀλήθειά σου κύκλῳ σου — あなたの真実はあなたを囲んでいる."
  9: "σὺ δεσπόζεις τοῦ κράτους τῆς θαλάσσης — あなたは海の力を治め (δεσπόζω — «властвовать»; κράτος — «сила, держава»; θάλασσα — 海). τὸν δὲ σάλον τῶν κυμάτων αὐτῆς σὺ καταπραΰνεις — その波の荒れを静められる (σάλος — «волнение»; καταπραΰνω — «утишать»; κῦμα — 波)."
  10: "σὺ ἐταπείνωσας ὡς τραυματίαν ὑπερήφανον — あなたは高ぶる者を、傷ついた者のように低くされ (ταπεινόω — «смирять»; τραυματίας — «раненый»; ὑπερήφανος — 高ぶる者, как по корпусу). ἐν τῷ βραχίονι τῆς δυνάμεώς σου διεσκόρπισας τοὺς ἐχθρούς σου — 力ある御腕によって敵を散らされた (βραχίων — 御腕; διασκορπίζω — «рассеивать»)."
  11: "σοί εἰσιν οἱ οὐρανοί, καὶ σή ἐστιν ἡ γῆ — 天はあなたのもの、地もあなたのものである. τὴν οἰκουμένην καὶ τὸ πλήρωμα αὐτῆς σὺ ἐθεμελίωσας — 世界とその中に満ちるものとを、あなたは基を据えられた (οἰκουμένη — 世界; πλήρωμα — «полнота»; θεμελιόω — «основывать»)."
  12: "τὸν βορρᾶν καὶ θαλάσσας σὺ ἔκτισας — 北と海を、あなたは造られた (βορρᾶς — «север»; θάλασσαι — «моря»; слав. «север и море»; у jp-joc 北と南 — по евр.). Θαβωρ καὶ Ερμων ἐν τῷ ὀνόματί σου ἀγαλλιάσονται — タボルとエルモンは、あなたの名によって喜び躍る (Фавор и Ермон — горы; ἀγαλλιάομαι — «ликовать»)."
  13: "σὸς ὁ βραχίων μετὰ δυναστείας — あなたの御腕は力とともにあり (δυναστεία — «могущество»). κραταιωθήτω ἡ χείρ σου, ὑψωθήτω ἡ δεξιά σου — あなたの手は強く、あなたの右の手は高く上げられている (греч. импер. «да укрепится… да возвысится»; в хвале передано изъявительно, как в слав. «да будет»)."
  14: "δικαιοσύνη καὶ κρίμα ἑτοιμασία τοῦ θρόνου σου — 義と裁きはあなたの王座の備えであり (ἑτοιμασία — «уготовление, основание»). ἔλεος καὶ ἀλήθεια προπορεύσεται πρὸ προσώπου σου — あわれみと真実はあなたの前を先に行く (προπορεύομαι — «идти впереди»)."
  15: "μακάριος ὁ λαὸς ὁ γινώσκων ἀλαλαγμόν — 喜びの声を知る民は幸いである (ἀλαλαγμός — «радостный клич, ликование»; 喜びの声, как по корпусу). ἐν τῷ φωτὶ τοῦ προσώπου σου πορεύσονται — あなたの顔の光のうちを歩み (φῶς — 光)."
  16: "ἐν τῷ ὀνόματί σου ἀγαλλιάσονται ὅλην τὴν ἡμέραν — 一日中、あなたの名によって喜び (ὅλην τὴν ἡμέραν — 一日中). ἐν τῇ δικαιοσύνῃ σου ὑψωθήσονται — あなたの義によって高く上げられる (δικαιοσύνη — 義; ὑψόω — «возвышать»)."
  17: "τὸ καύχημα τῆς δυνάμεως αὐτῶν εἶ σύ — あなたは彼らの力の誇りであり (καύχημα — «похвала, слава»). ἐν τῇ εὐδοκίᾳ σου ὑψωθήσεται τὸ κέρας ἡμῶν — あなたの恵みによって、わたしたちの角は高く上げられる (εὐδοκία — «благоволение»; κέρας — 角, образ силы и чести)."
  18: "τοῦ κυρίου ἡ ἀντίλημψις — わたしたちの助けは主から来る (ἀντίλημψις — «заступление, помощь»; слав. «Господня помощь»). τοῦ ἁγίου Ισραηλ βασιλέως ἡμῶν — わたしたちの王はイスラエルの聖なる方から来る (род. приложения: «от Святого Израилева, царя нашего»)."
  19: "τότε ἐλάλησας ἐν ὁράσει τοῖς ὁσίοις σου καὶ εἶπας — そのとき、あなたは幻のうちで聖なる者たちに語り、言われた (ὅρασις — 幻; ὅσιοι — 聖なる者たち). С этого места и до конца 37-го стиха — речь Божия в 「」. Ἐθέμην βοήθειαν ἐπὶ δυνατόν — わたしは力ある者の上に助けを置き (βοήθεια — 助け). ὕψωσα ἐκλεκτὸν ἐκ τοῦ λαοῦ μου — わたしの民のうちから選ばれた者を高く上げた."
  20: "εὗρον Δαυιδ τὸν δοῦλόν μου — わたしはわたしの僕ダビデを見いだし. ἐν ἐλαίῳ ἁγίῳ μου ἔχρισα αὐτόν — わたしの聖なる油で彼に油を注いだ (χρίω — «помазывать»; ἔλαιον — 油)."
  21: "ἡ γὰρ χείρ μου συναντιλήμψεται αὐτῷ — わたしの手は彼を支え (συναντιλαμβάνομαι — «поддерживать вместе»). ὁ βραχίων μου κατισχύσει αὐτόν — わたしの御腕は彼を強くする (κατισχύω — «укреплять»)."
  22: "οὐκ ὠφελήσει ἐχθρὸς ἐν αὐτῷ — 敵は彼に勝つことができず (ὠφελέω — «иметь успех, пользу»). υἱὸς ἀνομίας οὐ προσθήσει τοῦ κακῶσαι αὐτόν — 不法の子も、重ねて彼を損なうことはない (προστίθημι — «прибавлять, продолжать»; κακόω — «озлоблять»)."
  23: "συγκόψω τοὺς ἐχθροὺς αὐτοῦ ἀπὸ προσώπου αὐτοῦ — わたしは彼の敵を彼の前で打ち砕き (συγκόπτω — «сокрушать»). τοὺς μισοῦντας αὐτὸν τροπώσομαι — 彼を憎む者たちを敗走させる (τροπόω — «обращать в бегство»)."
  24: "ἡ ἀλήθειά μου καὶ τὸ ἔλεός μου μετ᾿ αὐτοῦ — わたしの真実とわたしのあわれみは彼とともにあり. ἐν τῷ ὀνόματί μου ὑψωθήσεται τὸ κέρας αὐτοῦ — わたしの名によって彼の角は高く上げられる."
  25: "θήσομαι ἐν θαλάσσῃ χεῖρα αὐτοῦ — わたしは彼の手を海に (θάλασσα — 海; образ власти над морями). ἐν ποταμοῖς δεξιὰν αὐτοῦ — 彼の右の手を川々に置く (ποταμός — 川)."
  26: "αὐτὸς ἐπικαλέσεταί με — 彼はわたしを呼び (ἐπικαλέομαι — «призывать, называть»). Πατήρ μου εἶ σύ, θεός μου καὶ ἀντιλήμπτωρ τῆς σωτηρίας μου — あなたはわたしの父、わたしの神、わたしの救いの支え手である (ἀντιλήμπτωρ — «заступник»). Это речь Давида внутри речи Бога — 『…』."
  27: "κἀγὼ πρωτότοκον θήσομαι αὐτόν — わたしは彼を長子とし (πρωτότοκος — 長子). ὑψηλὸν παρὰ τοῖς βασιλεῦσιν τῆς γῆς — 地の王たちよりも高い者とする."
  28: "εἰς τὸν αἰῶνα φυλάξω αὐτῷ τὸ ἔλεός μου — わたしはとこしえに彼にわたしのあわれみを守り (φυλάσσω — «хранить»). ἡ διαθήκη μου πιστὴ αὐτῷ — わたしの契約は彼に対して忠実であり続ける (πιστός — 忠実)."
  29: "θήσομαι εἰς τὸν αἰῶνα τοῦ αἰῶνος τὸ σπέρμα αὐτοῦ — わたしは彼の子孫をとこしえに…保つ. τὸν θρόνον αὐτοῦ ὡς τὰς ἡμέρας τοῦ οὐρανοῦ — 彼の王座を天の日のように (то есть на все дни, пока стоит небо)."
  30: "ἐὰν ἐγκαταλίπωσιν οἱ υἱοὶ αὐτοῦ τὸν νόμον μου — もし彼の子らがわたしの律法を捨て (ἐγκαταλείπω — «оставлять»; νόμος — 律法). τοῖς κρίμασίν μου μὴ πορευθῶσιν — わたしの裁きに従って歩まなければ (κρίμα — 裁き)."
  31: "ἐὰν τὰ δικαιώματά μου βεβηλώσουσιν — もし彼らがわたしの定めを汚し (δικαίωμα — «оправдание, устав»; βεβηλόω — «осквернять»). τὰς ἐντολάς μου μὴ φυλάξωσιν — わたしの戒めを守らなければ (ἐντολή — 戒め)."
  32: "ἐπισκέψομαι ἐν ῥάβδῳ τὰς ἀνομίας αὐτῶν — わたしは杖で彼らの不法を…罰する (ῥάβδος — 杖). ἐν μάστιξιν τὰς ἁμαρτίας αὐτῶν — 鞭で彼らの罪を (μάστιξ — «бич»)."
  33: "τὸ δὲ ἔλεός μου οὐ μὴ διασκεδάσω ἀπ᾿ αὐτοῦ — しかし、わたしのあわれみを彼から取り去ることはない (διασκεδάζω — «рассеивать, отнимать»). οὐδὲ μὴ ἀδικήσω ἐν τῇ ἀληθεία μου — わたしの真実によって偽りをすることもない (ἀδικέω — «поступать неправдою»)."
  34: "οὐδὲ μὴ βεβηλώσω τὴν διαθήκην μου — わたしは自分の契約を汚さず. τὰ ἐκπορευόμενα διὰ τῶν χειλέων μου οὐ μὴ ἀθετήσω — この唇から出たことを無効にしない (ἀθετέω — «отменять, нарушать»)."
  35: "ἅπαξ ὤμοσα ἐν τῷ ἁγίῳ μου — わたしは一度、わたしの聖なるものによって誓った (ἅπαξ — «однажды»). εἰ τῷ Δαυιδ ψεύσομαι — ダビデに偽りをつくことがあろうか (клятвенная формула «εἰ…» = «не…», передана вопросом, как в слав. «аще Давиду солжу»)."
  36: "τὸ σπέρμα αὐτοῦ εἰς τὸν αἰῶνα μενεῖ — 彼の子孫はとこしえに残り (μένω — «пребывать»). ὁ θρόνος αὐτοῦ ὡς ὁ ἥλιος ἐναντίον μου — 彼の王座はわたしの前で太陽のようである (ἥλιος — 太陽)."
  37: "ὡς ἡ σελήνη κατηρτισμένη εἰς τὸν αἰῶνα — 月のように、とこしえに整えられる (σελήνη — 月; καταρτίζω — «устроять, утверждать»). ὁ μάρτυς ἐν οὐρανῷ πιστός — 天の証人は忠実である (μάρτυς — 証人; здесь — Бог как свидетель завета). Речь Божия закрывается 」. διάψαλμα не передаётся."
  38: "σὺ δὲ ἀπώσω καὶ ἐξουδένωσας — しかし、あなたは退け、軽んじられた (ἀπωθέω — «отталкивать»; ἐξουδενόω — «уничижать»). ἀνεβάλου τὸν χριστόν σου — あなたの油を注がれた方を投げ捨てられた (ἀναβάλλω — «отбрасывать, отринуть»; χριστός — 油を注がれた方, как в Пс 2, потому что здесь это ещё титул)."
  39: "κατέστρεψας τὴν διαθήκην τοῦ δούλου σου — あなたは僕との契約を覆し (καταστρέφω — «ниспровергать»). ἐβεβήλωσας εἰς τὴν γῆν τὸ ἁγίασμα αὐτοῦ — その聖所を地に汚された (ἁγίασμα — «святыня»; βεβηλόω — «осквернять»)."
  40: "καθεῖλες πάντας τοὺς φραγμοὺς αὐτοῦ — あなたは彼の垣をことごとく壊し (καθαιρέω — «сокрушать»; φραγμός — «ограда»). ἔθου τὰ ὀχυρώματα αὐτοῦ δειλίαν — その砦を恐れの的とされた (ὀχύρωμα — «твердыня»; δειλία — «робость, страх»; слав. «в страх»)."
  41: "διήρπασαν αὐτὸν πάντες οἱ διοδεύοντες ὁδόν — 道を行く者はみな、彼をかすめ奪った (διαρπάζω — «расхищать»). ἐγενήθη ὄνειδος τοῖς γείτοσιν αὐτοῦ — 彼は隣の者たちの嘲りとなった (ὄνειδος — «поношение»)."
  42: "ὕψωσας τὴν δεξιὰν τῶν ἐχθρῶν αὐτοῦ — あなたは彼の敵たちの右の手を高く上げ (δεξιά — «правая рука», образ силы). εὔφρανας πάντας τοὺς ἐχθροὺς αὐτοῦ — 彼の敵をことごとく喜ばせられた (εὐφραίνω — «веселить»)."
  43: "ἀπέστρεψας τὴν βοήθειαν τῆς ῥομφαίας αὐτοῦ — あなたは彼の剣の助けを退け (ῥομφαία — «меч»; βοήθεια — 助け). οὐκ ἀντελάβου αὐτοῦ ἐν τῷ πολέμῳ — 戦のとき、彼を支えられなかった (ἀντιλαμβάνομαι — «поддерживать»)."
  44: "κατέλυσας ἀπὸ καθαρισμοῦ αὐτόν — あなたは彼の清めを取り去り (καταλύω — «разорять»; καθαρισμός — «очищение»; слав. «от очищения его», у jp-joc 光 «блеск»). τὸν θρόνον αὐτοῦ εἰς τὴν γῆν κατέρραξας — その王座を地に打ち倒された (καταρράσσω — «низвергать»)."
  45: "ἐσμίκρυνας τὰς ἡμέρας τοῦ χρόνου αὐτοῦ — あなたは彼の生きる時の日々を短くし (σμικρύνω — «умалять»; χρόνος — «время»; у jp-joc 少壮の日). κατέχεας αὐτοῦ αἰσχύνην — 彼の上に恥を注がれた (καταχέω — «изливать»). διάψαλμα не передаётся."
  46: "ἕως πότε, κύριε, ἀποστρέψεις εἰς τέλος — 主よ、いつまでですか、あなたはどこまでも退けられるのですか (εἰς τέλος — «до конца»). ἐκκαυθήσεται ὡς πῦρ ἡ ὀργή σου — あなたの怒りは火のように燃え上がるのですか (ἐκκαίω — «воспламенять»)."
  47: "μνήσθητι τίς μου ἡ ὑπόστασις — 思い起してください、わたしが何であるかを (ὑπόστασις — «состав, существо»; у jp-joc «我が生くる時», Синодальный «существование моё»). μὴ γὰρ ματαίως ἔκτισας πάντας τοὺς υἱοὺς τῶν ἀνθρώπων — あなたは人の子らをみな、むなしく造られたのですか (ματαίως — «напрасно»)."
  48: "τίς ἐστιν ἄνθρωπος, ὃς ζήσεται καὶ οὐκ ὄψεται θάνατον — 人のうち、だれが生きながら死を見ずにいられるだろうか. ῥύσεται τὴν ψυχὴν αὐτοῦ ἐκ χειρὸς ᾅδου — だれがその魂を陰府の手から救い出せるだろうか (ᾅδης — 陰府, как по корпусу). διάψαλμα не передаётся."
  49: "ποῦ εἰσιν τὰ ἐλέη σου τὰ ἀρχαῖα, κύριε — 主よ、あなたの昔のあわれみはどこにあるのですか (ἀρχαῖος — «древний, прежний»). ἃ ὤμοσας τῷ Δαυιδ ἐν τῇ ἀληθεία σου — あなたが真実をもってダビデに誓われた、あのあわれみは."
  50: "μνήσθητι, κύριε, τοῦ ὀνειδισμοῦ τῶν δούλων σου — 主よ、あなたの僕たちが受けた辱めを思い起してください (ὀνειδισμός — «поношение»). οὗ ὑπέσχον ἐν τῷ κόλπῳ μου, πολλῶν ἐθνῶν — このわたしが胸に抱いてきた、多くの民からの辱めを (ὑπέχω — «подвергаться, нести»; κόλπος — «лоно, грудь»)."
  51: "οὗ ὠνείδισαν οἱ ἐχθροί σου, κύριε — 主よ、あなたの敵が辱めたことを (ὀνειδίζω — «поносить»). ὠνείδισαν τὸ ἀντάλλαγμα τοῦ χριστοῦ σου — 彼らがあなたの油を注がれた方の足跡を辱めたことを (ἀντάλλαγμα — «замена, перемена»; здесь «шаги, следы» — у jp-joc 跡, Синодальный «изменение»)."
  52: "Εὐλογητὸς κύριος εἰς τὸν αἰῶνα — 主はとこしえにほめたたえられますように. γένοιτο γένοιτο — «да будет, да будет»; в корпусе принято アーメン、アーメン (ср. Пс 40:14, 71:19; у jp-joc 「アミン」、「アミン」)."
