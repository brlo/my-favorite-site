verses:
  1: "アポロがコリントにいる間[あいだ]、パウロは内陸[ないりく]の地方[ちほう]を巡[めぐ]ってエフェソに来[き]て、何人[なんにん]かの弟子[でし]たちに会[あ]った。"
  2: "パウロは彼[かれ]らに言[い]った。「あなたがたは、信[しん]じたとき{聖霊[せいれい]|聖神[せいしん]}を受[う]けたか。」彼[かれ]らは答[こた]えた。「いいえ、{聖霊[せいれい]|聖神[せいしん]}があるということさえ聞[き]いたことがありません。」"
  3: "パウロが言[い]った。「では、あなたがたは何[なに]の洗礼[せんれい]を受[う]けたのか。」彼[かれ]らは言[い]った。「ヨハネの洗礼[せんれい]です。」"
  4: "パウロが言[い]った。「ヨハネは悔[くい]改[ため]めの洗礼[せんれい]を授[さず]けて、民[たみ]に、自分[じぶん]の後[あと]から来[く]る方[かた]、すなわちイエスを信[しん]じるように告[つ]げた。」"
  5: "彼[かれ]らはこれを聞[き]いて、主[しゅ]イエスの御名[みな]によって洗礼[せんれい]を受[う]けた。"
  6: "パウロが彼[かれ]らに手[て]を置[お]くと、{聖霊[せいれい]|聖神[せいしん]}が彼[かれ]らの上[うえ]に降[くだ]り、彼[かれ]らは異言[いげん]を語[かた]り、また預言[よげん]した。"
  7: "その数[かず]は、およそ十[じゅう]二[に]人[にん]であった。"
  8: "パウロは会堂[かいどう]に入[はい]り、三[さん]か月[げつ]の間[あいだ]、大胆[だいたん]に語[かた]り、神[かみ]の国[くに]について論[ろん]じ、人々[ひとびと]を説[と]き勧[すす]めた。"
  9: "しかし、ある者[もの]たちが頑[かたくな]になって信[しん]じず、この道[みち]を人々[ひとびと]の前[まえ]で悪[わる]く言[い]ったので、パウロは彼[かれ]らから離[はな]れ、弟子[でし]たちを別[わか]ち、ティラノという人[ひと]の講堂[こうどう]で毎日[まいにち]論[ろん]じた。"
  10: "これは二[に]年[ねん]続[つづ]いたので、アジア州[しゅう]に住[す]む者[もの]は、ユダヤ人[じん]もギリシャ人[じん]も皆[みな]、主[しゅ]の言葉[ことば]を聞[き]くことになった。"
  11: "神[かみ]はパウロの手[て]によって、並[なみ]はずれの奇跡[きせき]を行[おこな]った。"
  12: "パウロの体[からだ]に触[ふ]れた手拭[てぬぐ]いや前掛[まえか]けを病[びょう]人[にん]のところへ持[も]って行[い]くと、病[やまい]は去[さ]り、悪[あく]霊[れい]は出[で]て行[い]った。"
  13: "そこで、各地[かくち]を巡[めぐ]り歩[ある]いて悪[あく]霊[れい]を追[お]い払[はら]うユダヤ人[じん]たちのうちのある者[もの]たちが、悪[あく]霊[れい]に取[と]り憑[つ]かれた者[もの]たちに主[しゅ]イエスの名[な]を唱[とな]えようとして、「パウロが宣[の]べ伝[つた]えているイエスによって、お前[まえ]たちに命[めい]じる」と言[い]った。"
  14: "ユダヤ人[じん]の祭司長[さいしちょう]スケワという人[ひと]の七人[しちにん]の息子[むすこ]たちが、これをしていた。"
  15: "しかし、悪[あく]霊[れい]は彼[かれ]らに答[こた]えて言[い]った。「イエスはよく知[し]っているし、パウロのことも承知[しょうち]している。だが、お前[まえ]たちは何者[なにもの]だ。」"
  16: "悪[あく]霊[れい]に取[と]り憑[つ]かれたその人[ひと]は彼[かれ]らに飛[と]びかかり、彼[かれ]らを力[ちから]ずくで押[おさ]えつけ、打[う]ち負[ま]かした。彼[かれ]らは裸[はだか]にされ、傷[きず]を負[お]って、その家[いえ]から逃[に]げ出[だ]した。"
  17: "このことが、エフェソに住[す]むユダヤ人[じん]にもギリシャ人[じん]にも知[し]れ渡[わた]り、人々[ひとびと]は皆[みな]、恐[おそ]れを抱[いだ]いた。主[しゅ]イエスの御名[みな]は大[おお]いに崇[あが]められた。"
  18: "信[しん]じた者[もの]の多[おお]くが、自分[じぶん]の行[おこな]いを告白[こくはく]し、明[あき]らかにして、やって来[き]た。"
  19: "魔術[まじゅつ]を行[おこな]っていた者[もの]のうち、少[すく]なからぬ者[もの]たちは、自分[じぶん]の書物[しょもつ]を集[あつ]めて、皆[みな]の見[み]ている前[まえ]で焼[や]いた。その値[あたい]を計算[けいさん]すると、銀[ぎん]五万[ごまん]になった。"
  20: "こうして、主[しゅ]の言葉[ことば]は力[ちから]強[づよ]く広[ひろ]がり、大[おお]いに勢[いきお]いを得[え]た。"
  21: "これらのことが済[す]むと、パウロは心[こころ]に決[き]めて、マケドニアとアカイアを通[とお]ってエルサレムへ行[ゆ]こうとし、「そこへ行[い]った後[あと]で、ローマも見[み]なければならない」と言[い]った。"
  22: "そして、自分[じぶん]に仕[つか]えている者[もの]のうち二人[ふたり]、ティモテとエラストをマケドニアへ遣[つか]わし、自分[じぶん]はしばらくアジア州[しゅう]に留[とど]まった。"
  23: "そのころ、この道[みち]について、少[すく]なからぬ騒[さわ]ぎが起[お]こった。"
  24: "デメトリオという名[な]の銀細工[ぎんざいく]師[し]がいた。彼[かれ]はアルテミス⟨エフェソで崇[あが]められていた女神[めがみ]。⟩の銀[ぎん]の神殿[しんでん]の模型[もけい]を作[つく]り、職人[しょくにん]たちに少[すく]なからぬ仕事[しごと]を与[あた]えていた。"
  25: "彼[かれ]は彼[かれ]らと、同[おな]じような仕事[しごと]をする職人[しょくにん]たちを集[あつ]めて言[い]った。「皆[みな]さん、わたしたちがこの仕事[しごと]で豊[ゆた]かさを得[え]ていることは、ご存[ぞん]じのとおりです。"
  26: "また、このパウロが、エフェソだけでなく、アジア州[しゅう]のほとんど全域[ぜんいき]で、多[おお]くの民[たみ]を説[と]き伏[ふ]せ、引[ひ]き離[はな]してしまったことは、あなたがたが見[み]、また聞[き]いている通[とお]りです。彼[かれ]は、手[て]で作[つく]ったものは神[かみ]ではないと言[い]っています。"
  27: "そうなれば、わたしたちのこの仕事[しごと]が信用[しんよう]を失[うしな]うだけでなく、大[おお]きな女神[めがみ]アルテミスの神殿[しんでん]も無[む]に等[ひと]しいものとされ、アジア州[しゅう]全体[ぜんたい]と世界[せかい]中[じゅう]が崇[あが]めているこの女神[めがみ]の威厳[いげん]さえも失[うしな]われる危険[きけん]があります。」"
  28: "彼[かれ]らはこれを聞[き]いて怒[いか]りに満[み]ち、「エフェソの人々[ひとびと]のアルテミスは偉大[いだい]だ」と叫[さけ]んだ。"
  29: "町[まち]は混乱[こんらん]に包[つつ]まれ、人々[ひとびと]は一[いっ]斉[せい]に劇場[げきじょう]になだれ込[こ]み、パウロの同行者[どうこうしゃ]であるマケドニア人[じん]のガイオとアリスタルコを引[ひ]っ張[ぱ]って行[い]った。"
  30: "パウロは民衆[みんしゅう]の中[なか]に入[はい]ろうとしたが、弟子[でし]たちは許[ゆる]さなかった。"
  31: "また、アジア州[しゅう]の高官[こうかん]たちのうち、パウロと親[した]しい者[もの]たちも、人[ひと]を遣[つか]わして、劇場[げきじょう]に入[はい]らないようにと頼[たの]んだ。"
  32: "ある者[もの]はこれと、ある者[もの]はあれと叫[さけ]んでいた。集会[しゅうかい]は混乱[こんらん]し、多[おお]くの者[もの]は何[なん]のために集[あつ]まったのかさえ知[し]らなかったのである。"
  33: "群衆[ぐんしゅう]の中[なか]のある者[もの]たちが、ユダヤ人[じん]たちの押[お]し出[だ]したアレクサンドロを前[まえ]に引[ひ]き出[だ]した。アレクサンドロは手[て]を振[ふ]って、民[たみ]に弁明[べんめい]しようとした。"
  34: "しかし、彼[かれ]がユダヤ人[じん]だと分[わ]かると、皆[みな]が一[いっ]声[せい]に、二[に]時間[じかん]ほども、「エフェソの人々[ひとびと]のアルテミスは偉大[いだい]だ」と叫[さけ]び続[つづ]けた。"
  35: "町[まち]の書記官[しょきかん]は群衆[ぐんしゅう]を静[しず]めて言[い]った。「エフェソの人々[ひとびと]よ、エフェソの町[まち]が大[おお]きな女神[めがみ]アルテミスと、天[てん]から降[お]りた像[ぞう]⟨ゼウスから落[お]ちてきたと信[しん]じられていた石[いし]の像[ぞう]。⟩の守[まも]りであることを知[し]らない者[もの]が、誰[だれ]かいるだろうか。"
  36: "これらのことに反論[はんろん]できない以上、あなたがたは静[しず]かにして、軽率[けいそつ]なことをしてはならない。"
  37: "あなたがたがここに引[ひ]っ張[ぱ]って来[き]たこの人々[ひとびと]は、神殿[しんでん]の物[もの]を盗[ぬす]んだのでも、わたしたちの女神[めがみ]を冒涜[ぼうとく]したのでもない。"
  38: "だから、デメトリオと彼[かれ]とともにある職人[しょくにん]たちが、誰[だれ]かを訴[うった]えたいのなら、裁判[さいばん]の日[ひ]は開[ひら]かれており、総督[そうとく]たちもいるのだから、互[たが]いに訴[うった]え出[で]るがよい。"
  39: "さらに何[なに]か求[もと]めることがあれば、正式[せいしき]の集会[しゅうかい]で決[き]められるであろう。"
  40: "今日[きょう]のこの騒[さわ]ぎのことで、わたしたちは騒乱[そうらん]の罪[つみ]に問[と]われるかもしれない。しかも、この集[あつ]まりについては、弁明[べんめい]のしようもないのだ。」こう言[い]って、彼[かれ]は集会[しゅうかい]を解散[かいさん]させた。"

notes:
  1: "ἀνωτερικὰ μέρη — «верхние, внутренние области»; 内陸の地方. Павел шёл внутренним путём, не прибрежным."
  2: "πνεῦμα ἅγιον — Святой Дух; в тексте всюду пара {聖霊[せいれい]|聖神[せいしん]}. Ответ: «мы и не слышали, есть ли Дух Святой» — 聖霊があるということさえ聞いたことがない."
  3: "εἰς τί — «во что (в какое учение)»; 何の洗礼. Иоанново крещение — ヨハネの洗礼."
  4: "Иоанн крестил «крещением покаяния» (βάπτισμα μετανοίας) и указывал на Грядущего, то есть на Иисуса; 悔い改めの洗礼."
  6: "ἐλάλουν γλώσσαις — «говорили языками»; 異言. Рядом с προφητεύω — 預言する."
  7: "ὡσεὶ δώδεκα — «около двенадцати»; およそ十二人."
  9: "ἡ ὁδός — «Путь», самоназвание христиан (ср. 19:23; 22:4; 24:14); この道, сноска уже при первом упоминании в Деяниях (9:2). σχολὴ Τυράννου — «училище Тирана», помещение для ежедневных бесед; 講堂."
  13: "ἐξορκισταί — заклинатели, изгоняющие бесов; ὀνομάζειν τὸ ὄνομα — «именовать имя»; 名を唱える. Формула заклинания — прямая речь, но не Христа: не красная."
  14: "ἀρχιερεύς — здесь «первосвященник» (Скева), 祭司長. Сыновей семь — 七人の息子."
  15: "В базе τὸν [μὲν] Ἰησοῦν: μὲν стоит в квадратных скобках, но слово в базе есть — 〔〕 не ставится. γινώσκω/ἐπίσταμαι — «знаю»/«хорошо знаю»; よく知っている/承知している."
  16: "ἀμφοτέρων («обоих») в базе при семи сыновьях — вероятно, порча текста; перевёл «он одолел их», без добавления."
  19: "ἀργυρίου μυριάδας πέντε — 50 000 серебряных (драхм); оставлено 銀五万, как у jp-joc, без уточнения монеты."
  24: "ἀργυροκόπος — серебряных дел мастер; ναοί — серебряные модели храма (ковчежцы) Артемиды; 神殿の模型. Сноска на アルテミス — первое упоминание в книге."
  31: "Ἀσιάρχαι — «азиархи», выборные сановники провинции Асия; アジア州の高官. Не красная речь."
  32: "ἐκκλησία здесь и в 39–40 — городское собрание, а не церковь; поэтому 集会, а не 教会."
  35: "γραμματεύς — городской секретарь (не книжник); 書記官. νεωκόρος — «хранитель храма»; διοπετής — «упавший от Зевса»; 天から降りた像, сноска. Речь секретаря — не красная."
  38: "ἀνθύπατοι — проконсулы; 総督. ἀγοραῖοι ἄγονται — «идут судебные дни»; 裁判の日."
  39: "ἔννομος ἐκκλησία — законное, официальное собрание; 正式の集会."
  40: "В базе περὶ οὗ [οὐ] δυνησόμεθα: οὐ в квадратных скобках, но слово есть — 〔〕 не ставится. Смысл: «нам нечем оправдать это сборище»."
