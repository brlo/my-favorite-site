# jp-box, Деяния апостолов, глава 19. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 19: ученики Иоанна и Святой Дух (1–7), проповедь в Ефесе и школа Тирана (8–10),
# силы через Павла (11–12), сыны Скевы (13–17), сожжение книг (18–20),
# планы Павла (21–22), мятеж Димитрия (23–40).
# Красного в главе нет: Христос здесь не говорит; речи Павла, Димитрия, ефесян,
# Александра и городского секретаря — не красным.
# 〔…〕 в главе нет: расхождений с базой не нашлось (19:15 [μὲν] и 19:40 [οὐ] стоят в
# квадратных скобках, но в базе есть — не оборачиваются).
# Сноски: 19:24 (アルテミス), 19:35 (天から降りた像); この道 подписано раньше, в 9:2.
# jp-ni не использовался.

