# jp-box, Иов, глава 1. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc (1901) есть для глав 1–2: использован как контроль церковного
# чтения и имён, архаизмы не копировались. jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 1: прозаический пролог. Праведность и богатство Иова, жертвы за сыновей (1–5),
# совет ангелов и диалог Господа с сатаной (6–12), нападения на имение и детей,
# речи вестников (13–19), ответ Иова и благословение имени Господня (20–22).
# Голоса: повествование; Господь — 「…」 (7, 8, 12); сатана — 「…」 (7, 9–11);
# вестники — 「…」 (14–15, 16, 17, 18–19); Иов — 「…」 (5, 21). Вводные формулы
# («И сказал Господь…», «И отвечал…») — вне кавычек.
# Нумерация по gr: 22 стиха; границы стихов совпадают с ru; у csl вопрос 1:9
# отнесён к 1:10 (см. notes 1:9).
# csl-добавления в основной текст без скобок: 1:20 「услышав», «посыпав прахом главу»,
# «Господеви»; 1:21 «во веки»; 1:22 «ниже устнама своима». В notes отмечено «нет в LXX».
# 〔…〕 нет: все 22 стиха есть в gr-lxx-byz. Сносок ⟨…⟩ нет: 悪魔, 主, 神, 家畜 уже
# в корпусе.

