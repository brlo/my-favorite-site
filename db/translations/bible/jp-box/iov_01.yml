verses:
  1: "アウシティスの地[ち]に、名[な]をヨブという人[ひと]がいた。この人[ひと]は真実[しんじつ]で、非[ひ]のない者[もの]で、正[ただ]しく、神[かみ]を畏[おそ]れ、すべていかなる悪[あく]からも遠[とお]ざかる者[もの]であった。"
  2: "彼[かれ]には七人[ななにん]の息子[むすこ]と三人[さんにん]の娘[むすめ]が生[う]まれた。"
  3: "彼[かれ]の家畜[かちく]は羊[ひつじ]七千[ななせん]、らくだ三千[さんぜん]、牛[うし]五百[ごひゃく]対[つい]、草[くさ]を食[は]む雌[めす]ロバ五百[ごひゃく]頭[とう]、僕[しもべ]も非常[ひじょう]に多[おお]く、地[ち]の上[うえ]に大[おお]きな事業[じぎょう]があった。この人[ひと]は東[ひがし]の者[もの]たちのうちで最も尊[とうと]い者[もの]であった。"
  4: "彼[かれ]の息子[むすこ]たちは互[たが]いに集[あつ]まって、日[ひ]ごとに宴[うたげ]を開[ひら]き、三人[さんにん]の姉妹[しまい]も一緒[いっしょ]に連[つ]れて来[き]て、彼[かれ]らとともに食[た]べ飲[の]んだ。"
  5: "宴[うたげ]の日々[ひび]が終[お]わるたびに、ヨブは人[ひと]を遣[つか]わして彼[かれ]らを清[きよ]め、朝[あさ]早[はや]く起[お]きて、彼[かれ]らの数[かず]に応[おう]じて彼[かれ]らのために犠牲[ぎせい]をささげ、彼[かれ]らの魂[たましい]の罪[つみ]のために若[わか]い雄牛[おうし]一頭[いっとう]をささげた。ヨブは言[い]った。「もしかすると、わたしの息子[むすこ]たちは心[こころ]のうちで神[かみ]に悪[わる]いことを思[おも]ったのかもしれない。」このようにヨブはすべての日[ひ]に行[おこな]った。"
  6: "ある日[ひ]、神[かみ]の使[つかい]たちが主[しゅ]の前[まえ]に立[た]つために来[き]た。見[み]よ、悪魔[あくま]も彼[かれ]らとともに来[き]た。"
  7: "主[しゅ]は悪魔[あくま]に言[い]った。「どこから来[き]たのか。」悪魔[あくま]は主[しゅ]に答[こた]えて言[い]った。「地[ち]を巡[めぐ]り、天[てん]の下[した]を歩[ある]き回[まわ]って、ここにいる。」"
  8: "主[しゅ]は彼[かれ]に言[い]った。「あなたはわたしの僕[しもべ]ヨブに心[こころ]を留[と]めたか。彼[かれ]に似[に]た者[もの]は地[ち]の上[うえ]にいない。無垢[むく]で、真実[しんじつ]で、神[かみ]を畏[おそ]れ、すべていかなる悪[あく]からも遠[とお]ざかる者[もの]である。」"
  9: "悪魔[あくま]は主[しゅ]に答[こた]えて言[い]った。「ヨブはただで神[かみ]を畏[おそ]れているのだろうか。"
  10: "あなたは彼[かれ]の外[そと]にあるものも、その家[いえ]の内[うち]にあるものも、彼[かれ]の持[も]つすべてのものの周[まわ]りも、垣[かき]で囲[かこ]んではいないか。あなたは彼[かれ]の手[て]の業[わざ]を祝福[しゅくふく]し、その家畜[かちく]を地[ち]の上[うえ]に増[ふ]やした。"
  11: "しかし、あなたの手[て]を伸[の]べて、彼[かれ]の持[も]つすべてのものに触[ふ]れてみよ。きっと彼[かれ]はあなたの顔[かお]に向[む]かってあなたを呪[のろ]うだろう。」"
  12: "主[しゅ]は悪魔[あくま]に言[い]った。「見[み]よ、彼[かれ]の持[も]つすべてのものを、わたしはあなたの手[て]に渡[わた]す。ただ、彼[かれ]自身[じしん]には手[て]を触[ふ]れるな。」悪魔[あくま]は主[しゅ]の前[まえ]から出[で]て行[い]った。"
  13: "ある日[ひ]、ヨブの息子[むすこ]たちと娘[むすめ]たちは、一番上[いちばんうえ]の兄[あに]の家[いえ]で葡萄酒[ぶどうしゅ]を飲[の]んでいた。"
  14: "見[み]よ、使[つかい]がヨブのもとに来[き]て言[い]った。「牛[うし]が耕[たがや]し、雌[めす]ロバがそのそばで草[くさ]を食[は]んでいたところ、"
  15: "略奪[りゃくだつ]する者[もの]たちが襲[おそ]って来[き]て、それらを奪[うば]い、若[わか]い者[もの]たちを剣[つるぎ]で殺[ころ]した。わたしだけが逃[のが]れて、あなたに告[つ]げるために来[き]た。」"
  16: "まだこの人[ひと]が語[かた]っているうちに、ほかの使[つかい]が来[き]て言[い]った。「火[ひ]が天[てん]から降[ふ]りて、羊[ひつじ]と羊飼[ひつじか]いたちを同[おな]じく焼[や]き尽[つ]くした。わたしだけが逃[のが]れて、あなたに告[つ]げるために来[き]た。」"
  17: "まだこの人[ひと]が語[かた]っているうちに、ほかの使[つかい]が来[き]て言[い]った。「騎兵[きへい]たちが三[みっ]つの部隊[ぶたい]に分[わ]かれて、らくだを囲[かこ]み、それらを奪[うば]い、若[わか]い者[もの]たちを剣[つるぎ]で殺[ころ]した。わたしだけが逃[のが]れて、あなたに告[つ]げるために来[き]た。」"
  18: "まだこの人[ひと]が語[かた]っているうちに、ほかの使[つかい]が来[き]て言[い]った。「あなたの息子[むすこ]たちと娘[むすめ]たちが、一番上[いちばんうえ]の兄[あに]の家[いえ]で食[た]べ飲[の]みしていたとき、"
  19: "見[み]よ、荒[あ]れ野[の]から大[おお]きな風[かぜ]が突然[とつぜん]吹[ふ]いて来[き]て、家[いえ]の四[よっ]つの隅[すみ]を打[う]ち、家[いえ]があなたの子[こ]どもたちの上[うえ]に倒[たお]れ、彼[かれ]らは死[し]んだ。わたしだけが逃[のが]れて、あなたに告[つ]げるために来[き]た。」"
  20: "ヨブはこれを聞[き]くと立[た]ち上[あ]がり、衣[ころも]を裂[さ]き、頭[あたま]の髪[かみ]をそり、頭[あたま]に土[つち]を振[ふ]りかけて、地[ち]に伏[ふ]して主[しゅ]を拝[おが]み、言[い]った。"
  21: "「わたしは裸[はだか]で母[はは]の胎[たい]から出[で]た。裸[はだか]でそこへ帰[かえ]ろう。主[しゅ]は与[あた]え、主[しゅ]は取[と]られた。主[しゅ]が望[のぞ]まれたとおりに成[な]った。主[しゅ]の名[な]は世々[よよ]にほむべきかな。」"
  22: "このすべてのことにおいて、ヨブは主[しゅ]の前[まえ]で何[なに]ひとつ罪[つみ]を犯[おか]さず、口[くち]でも罪[つみ]を犯[おか]さず、神[かみ]に愚[おろ]かなことを言[い]わなかった。"

notes:
  1: "Повествование. Ἄνθρωπός τις ἦν ἐν χώρᾳ τῇ Αυσίτιδι — «был некий человек в земле Авситидийской» (Αὐσῖτις — Уц; アウシティス, у jp-joc アウシティディヤ). ᾧ ὄνομα Ιωβ — «имя ему Иов». ἀληθινός, ἄμεμπτος, δίκαιος, θεοσεβής — «истинный, непорочный, праведный, богобоязненный»; ἀπεχόμενος ἀπὸ παντὸς πονηροῦ πράγματος — «удаляющийся от всякой лукавой вещи». Пять определений и их порядок сохранены; csl: «истинен, непорочен, праведен, Богочестив»."
  2: "Повествование. ἐγένοντο δὲ αὐτῷ υἱοὶ ἑπτὰ καὶ θυγατέρες τρεῖς — «родились у него семь сыновей и три дочери». Числа кандзи, без сглаживания."
  3: "Повествование. πρόβατα ἑπτακισχίλια — семь тысяч овец; κάμηλοι τρισχίλιαι — три тысячи верблюдов; ζεύγη βοῶν πεντακόσια — пятьсот пар волов (ζεῦγος — упряжка, пара); ὄνοι θήλειαι νομάδες πεντακόσιαι — пятьсот ослиц пасущихся (νομάς — пасущийся на воле). ὑπηρεσία πολλὴ σφόδρα — «прислуга весьма многая»; ἔργα μεγάλα — «великие дела». εὐγενὴς τῶν ἀφ᾽ ἡλίου ἀνατολῶν — «благороднейший из [сынов] востока солнца», т. е. знатнейший на Востоке."
  4: "Повествование. συμπορευόμενοι … ἐποίουσαν πότον καθ᾽ ἑκάστην ἡμέραν — «сходясь, устраивали пир каждый день»; LXX говорит о ежедневном пире, а не о череде дней у каждого брата (так в евр. и ru: «каждый в своем доме в свой день»). συμπαραλαμβάνοντες ἅμα καὶ τὰς τρεῖς ἀδελφὰς αὐτῶν — «беря с собою и трёх сестёр своих»."
  5: "Повествование; в конце стиха — речь Иова, 「…」. ὡς ἂν συνετελέσθησαν αἱ ἡμέραι τοῦ πότου — «когда завершались дни пира». ἀπέστελλεν … καὶ ἐκαθάριζεν — «посылал и очищал». ἀνιστάμενος τὸ πρωί — «вставая рано». θυσίας κατὰ τὸν ἀριθμὸν αὐτῶν — «жертвы по числу их»; μόσχον ἕνα περὶ ἁμαρτίας — «одного тельца за грех». Μήποτε — «не случилось ли, что…», осторожное предположение; ἐν τῇ διανοίᾳ — «в уме, в мыслях»."
  6: "Повествование. οἱ ἄγγελοι τοῦ θεοῦ — «ангелы Божии» (в евр. и ru «сыны Божии»); παραστῆναι ἐνώπιον τοῦ κυρίου — «предстать пред Господом». ὁ διάβολος — 悪魔[あくま], не «сатана»: в LXX стоит διάβολος. ἦλθεν μετ᾽ αὐτῶν — «пришёл с ними» (2:1 — ἐν μέσῳ αὐτῶν)."
  7: "Господь — 「…」; сатана — 「…」. Πόθεν παραγέγονας; — «откуда пришёл, явился?» (παραγίνομαι — приходить). Περιελθὼν τὴν γῆν καὶ ἐμπεριπατήσας τὴν ὑπ᾽ οὐρανὸν πάρειμι — «обойдя землю и исходив поднебесную, я здесь» (πάρειμι — присутствую). csl: «обшед землю и прошед поднебесную, се, есмь»."
  8: "Господь — 「…」. Προσέσχες τῇ διανοίᾳ σου κατὰ τοῦ παιδός μου Ιωβ — «обратил ли ты мысль твою на раба Моего Иова» (προσέχω — обращать внимание). οὐκ ἔστιν κατ᾽ αὐτὸν … ἄνθρωπος ἄμεμπτος, ἀληθινός, θεοσεβής — «нет подобного ему человека непорочного, истинного, богобоязненного»; по сравнению с 1:1 опущено δίκαιος."
  9: "Сатана — 「…」, речь продолжается до конца 11. Μὴ δωρεὰν σέβεται Ιωβ τὸν θεόν; — «разве даром богобоязнен Иов?» (δωρεάν — даром, бесплатно; σέβομαι — чтить). Вопрос предполагает отрицательный ответ. csl 1:9 обрывается на «рече пред Господем:», а сам вопрос относит к csl 1:10; держимся деления gr."
  10: "Сатана, продолжение речи. οὐ σὺ περιέφραξας τὰ ἔξω αὐτοῦ καὶ τὰ ἔσω τῆς οἰκίας αὐτοῦ — «не Ты ли оградил внешнее его и внутреннее дома его» (περιφράσσω — обносить оградой). τὰ ἔργα τῶν χειρῶν αὐτοῦ εὐλόγησας — «дела рук его благословил». τὰ κτήνη αὐτοῦ πολλὰ ἐποίησας — «стада его многими сделал»."
  11: "Сатана, продолжение речи. ἀπόστειλον τὴν χεῖρά σου καὶ ἅψαι — «простри руку Твою и коснись». εἰ μὴν εἰς πρόσωπόν σε εὐλογήσει — букв. «если не в лицо Тебя благословит», клятвенная формула; εὐλογεῖν здесь эвфемизм «проклинать» (так и в csl «благословит»). В тексте передан смысл — 呪う; буквальное «благословит» было бы непонятно."
  12: "Господь — 「…」; затем повествование. Ἰδοὺ πάντα, ὅσα ἔστιν αὐτῷ, δίδωμι ἐν τῇ χειρί σου — «вот, всё, что есть у него, даю в руку твою». ἀλλὰ αὐτοῦ μὴ ἅψῃ — «но самого не коснись». ἐξῆλθεν … παρὰ τοῦ κυρίου — «вышел от Господа»."
  13: "Повествование. οἱ υἱοὶ Ιωβ καὶ αἱ θυγατέρες αὐτοῦ ἔπινον οἶνον — «сыновья и дочери его пили вино». ἐν τῇ οἰκίᾳ τοῦ ἀδελφοῦ αὐτῶν τοῦ πρεσβυτέρου — «в доме брата их старшего»."
  14: "Повествование; речь вестника — 「…」, продолжается в 15. Τὰ ζεύγη τῶν βοῶν ἠροτρία — «упряжки волов пахали» (ἀροτριάω — пахать). αἱ θήλειαι ὄνοι ἐβόσκοντο ἐχόμεναι αὐτῶν — «ослицы паслись подле них» (ἐχόμενος — рядом)."
  15: "Вестник, продолжение речи. οἱ αἰχμαλωτεύοντες ᾐχμαλώτευσαν αὐτὰς — «пленители пленили их»; в LXX племя не названо (в евр. и ru — савеяне). τοὺς παῖδας ἀπέκτειναν ἐν μαχαίραις — «отроков убили мечами». σωθεὶς δὲ ἐγὼ μόνος — «спасся только я один»."
  16: "Повествование; речь второго вестника — 「…」. Πῦρ ἔπεσεν ἐκ τοῦ οὐρανοῦ — «огонь упал с неба» (в LXX без «Божий», ср. ru). κατέκαυσεν τὰ πρόβατα καὶ τοὺς ποιμένας κατέφαγεν — «сжёг овец и пожрал пастухов»."
  17: "Повествование; речь третьего вестника — 「…」. Οἱ ἱππεῖς ἐποίησαν ἡμῖν κεφαλὰς τρεῖς — «всадники сделали нам три отряда, три головы» (κεφαλή здесь — боевой отряд); в LXX без имени халдеев (в евр. и ru — халдеи). ἐκύκλωσαν τὰς καμήλους — «окружили верблюдов»."
  18: "Повествование; речь четвёртого вестника — 「…」, продолжается в 19. Τῶν υἱῶν σου καὶ τῶν θυγατέρων σου ἐσθιόντων καὶ πινόντων — родительный абсолют: «когда сыновья и дочери твои ели и пили»."
  19: "Вестник, продолжение речи. πνεῦμα μέγα — «великий ветер, дух»; ἐκ τῆς ἐρήμου — «из пустыни». ἥψατο τῶν τεσσάρων γωνιῶν τῆς οἰκίας — «коснулся четырёх углов дома». ἔπεσεν ἡ οἰκία ἐπὶ τὰ παιδία σου — «дом упал на детей твоих»."
  20: "Повествование. διέρρηξεν τὰ ἱμάτια — «разодрал одежды»; ἐκείρατο τὴν κόμην τῆς κεφαλῆς — «остриг волосы головы»; πεσὼν χαμαὶ προσεκύνησεν — «пав на землю, поклонился». csl добавляет «услышав», «посыпав прахом главу» и «Господеви» — этих слов нет в LXX, но по паритету они внесены в основной текст без скобок."
  21: "Иов — 「…」. Αὐτὸς γυμνὸς ἐξῆλθον ἐκ κοιλίας μητρός μου — «сам наг вышел из чрева матери моей»; γυμνὸς καὶ ἀπελεύσομαι ἐκεῖ — «наг и отойду туда». ὁ κύριος ἔδωκεν, ὁ κύριος ἀφείλατο — формула сохранена: 「主は与え、主は取られた」 (ἀφαιρέω — отнимать). ὡς τῷ κυρίῳ ἔδοξεν, οὕτως καὶ ἐγένετο — «как Господу было угодно, так и стало». εἴη τὸ ὄνομα κυρίου εὐλογημένον — оптатив: «да будет имя Господне благословенно». csl добавляет «во веки» — нет в LXX."
  22: "Повествование. οὐδὲν ἥμαρτεν Ιωβ ἐναντίον τοῦ κυρίου — «ни в чём не согрешил Иов пред Господом». οὐκ ἔδωκεν ἀφροσύνην τῷ θεῷ — «не дал безумия Богу», т. е. не произнёс неразумного о Боге (ἀφροσύνη — безумие). csl добавляет «ниже устнама своима» — нет в LXX; внесено без скобок."
