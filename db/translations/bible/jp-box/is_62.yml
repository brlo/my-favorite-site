verses:
  1: "「シオンのために、わたしは黙[だま]らない。エルサレムのために、わたしは休[やす]まない。わたしの義[ぎ]が光[ひかり]のように出[で]て行[ゆ]き、わたしの救[すく]いがともし火[び]のように燃[も]えるまで。"
  2: "国[くに]々[ぐに]はあなたの義[ぎ]を見[み]、王[おう]たちはあなたの栄光[えいこう]を見る。あなたは新[あたら]しい名[な]で呼[よ]ばれる。主[しゅ]がそれを名[な]づけられるのである。"
  3: "あなたは主[しゅ]の手[て]のうちにある美[うつく]しさの冠[かんむり]、あなたの神[かみ]の手のうちにある王国[おうこく]の冠となる。"
  4: "あなたはもはや『見捨[みす]てられた者[もの]』と呼ばれず、あなたの地[ち]も『荒[あ]れ野[の]』と呼ばれない。あなたは『わたしの喜[よろこ]び』と呼ばれ、あなたの地は『住[す]まわれた地』と呼ばれるからである。主[しゅ]はあなたを喜[よろこ]ばれ、あなたの地はともに住[す]まわれる。"
  5: "若[わか]い男[おとこ]が処女[おとめ]とともに住[す]むように、あなたの子[こ]らはあなたとともに住む。花婿[はなむこ]が花嫁[はなよめ]を喜[よろこ]ぶように、主[しゅ]はあなたを喜[よろこ]ばれる。"
  6: "エルサレムよ、わたしはあなたの城壁[じょうへき]の上[うえ]に、昼[ひる]も夜[よる]も絶[た]えず、黙[だま]らずに主[しゅ]を思[おも]い起[おこ]す見張[みは]りたちを置[お]いた。"
  7: "まことに、あなたに似[に]た者[もの]はない。あなたが正[ただ]しく整[ととの]え、エルサレムを地[ち]の上[うえ]の誇[ほこ]りとしてくださるなら。」"
  8: "主[しゅ]はご自身[じしん]の右[みぎ]の手[て]と、その腕[うで]の力[ちから]によって誓[ちか]われた。「わたしはもう、あなたの小麦[こむぎ]と食物[しょくもつ]をあなたの敵[てき]に与[あた]えない。"
  9: "他国[たこく]の子[こ]らが、あなたが労苦[ろうく]して造[つく]ったぶどう酒[ぶどうしゅ]を飲[の]むこともない。ただ、それを集[あつ]める者[もの]たちが食[た]べ、主[しゅ]をほめたたえる。それを集める者たちが、わたしの聖[せい]なる庭[にわ]でそれを飲む。"
  10: "わたしの門[もん]を通[とお]って行[ゆ]け。わたしの民[たみ]のために道[みち]を備[ととの]えよ。道から石[いし]を取[と]り除[のぞ]け。諸国[しょこく]に向[む]かって旗[はた]を上[あ]げよ。」"
  11: "見[み]よ、主[しゅ]は地[ち]の果[は]てまで聞[き]こえさせられた。「シオンの娘[むすめ]に言[い]え。見[み]よ、あなたの救[すく]い主[ぬし]が来[く]る。見よ、その報[むく]いはその方[かた]とともにあり、その働[はたら]きはその方の前[まえ]にある。"
  12: "そして、彼[かれ]らは彼を、主[しゅ]によって贖[あがな]われた聖[せい]なる民[たみ]と呼[よ]ぶ。あなたは『求[もと]められた都[みやこ]、見捨[みす]てられない都』と呼ばれる。」"

notes:
  1: "Διὰ Σιων οὐ σιωπήσομαι — «ради Сиона не умолкну» (σιωπάω — молчать); οὐκ ἀνήσω — «не дам покоя, не отпущу» (ἀνίημι — ослаблять, оставлять; слав. «не попущу»). ἕως ἂν ἐξέλθῃ ὡς φῶς ἡ δικαιοσύνη μου — «доколе не выйдет, как свет, правда моя»; τὸ σωτήριόν μου ὡς λαμπὰς καυθήσεται — «спасение моё, как светильник, возгорится» (λαμπάς — светильник, факел). Речь от 1-го лица; в церковном чтении это слово Господа о Сионе, но в 62:7 тот же голос обращается к Богу — деление кавычек см. в шапке."
  2: "ὄψονται ἔθνη τὴν δικαιοσύνην σου — «увидят народы правду твою» (обращение к Сиону, ж. р.); καλέσει σε τὸ ὄνομά σου τὸ καινόν — букв. «назовёт тебя имя твоё новое»; ὃ ὁ κύριος ὀνομάσει αὐτό — «которое Господь наименует». Слав. «прозовут тя именем новым, имже Господь наименует е». Син. «нарекут уста Господа» — по МТ, в текст не внесено."
  3: "στέφανος κάλλους — «венец красоты» (στέφανος — венец, венок); ἐν χειρὶ κυρίου — «в руке Господней»; διάδημα βασιλείας — «диадема царства» (διάδημα — царская повязка, в тексте 冠). Слав. «венец доброты… диадима царствия»."
  4: "Καταλελειμμένη — «Оставленная» (καταλείπω — оставлять); Ἔρημος — «Пустыня»; Θέλημα ἐμόν — «Воля Моя» (θέλημα — воля, желание; LXX передаёт евр. «Моё благоволение»); Οἰκουμένη — «Вселенная», обитаемая земля. Слав. добавляет в конце «яко благоволи Господь в тебе, и земля твоя вкупе населится» — в LXX этого нет, внесено в основной текст без 〔…〕. Син. «замужнею» — по МТ."
  5: "ὡς συνοικῶν νεανίσκος παρθένῳ — «как живущий юноша с девою» (συνοικέω — жить вместе; παρθένος — дева); κατοικήσουσιν οἱ υἱοί σου μετὰ σοῦ — «поселятся сыны твои с тобою»; εὐφρανθήσεται κύριος ἐπὶ σοί — «возрадуется Господь о тебе». Син. «Бог твой» — по МТ."
  6: "ἐπὶ τῶν τειχέων σου — «на стенах твоих» (τεῖχος — стена); κατέστησα φύλακας — «поставил стражей» (καθίστημι — ставить; φύλαξ — страж, в тексте 見張り); οἳ διὰ τέλους οὐ σιωπήσονται — «которые до конца не умолкнут»; μιμνῃσκόμενοι κυρίου — «поминая Господа» (μιμνῄσκομαι с род. падежом)."
  7: "οὐκ ἔστιν γὰρ ὑμῖν ὅμοιος — «ибо нет подобного вам»; в гр. мн. ч. ὑμῖν — порча, по смыслу обращение к Богу в ед. ч. (слав. сохраняет «вам»). ἐὰν διορθώσῃ καὶ ποιήσῃ Ιερουσαλημ ἀγαυρίαμα ἐπὶ τῆς γῆς — «если исправишь и сделаешь Иерусалим похвалою на земле» (διορθόω — исправлять, устроять; ἀγαυρίαμα — похвальба, слава). Стих в LXX испорчен: у МТ «не давайте Ему покоя, доколе не утвердит и не сделает Иерусалим славою на земле»."
  8: "ὤμοσεν κύριος κατὰ τῆς δεξιᾶς αὐτοῦ — «поклялся Господь десницею Своею»; κατὰ τῆς ἰσχύος τοῦ βραχίονος αὐτοῦ — «крепостию мышцы Своея». Εἰ ἔτι δώσω — еврейская формула клятвы («если ещё дам» = «не дам»), передана отрицанием; слав. «аще ктому отдам». ἀλλότριοι — «чужие, сторонние»; ἐφ᾽ ᾧ ἐμόχθησας — «над которым ты трудился» (μόχθος — труд)."
  9: "οἱ συνάγοντες — «собирающие» (συνάγω); αἰνέσουσιν κύριον — «восхвалят Господа» (αἰνέω); ἐν ταῖς ἐπαύλεσιν ταῖς ἁγίαις μου — «во дворах святых Моих» (ἔπαυλις — двор, загон; в тексте 庭)."
  10: "πορεύεσθε διὰ τῶν πυλῶν μου — «проходите вратами Моими» (в слав. «Идите враты моими»; в МТ врата повторены дважды — «проходите, проходите»); ὁδοποιήσατε τῷ λαῷ μου — «путь сотворите народу Моему»; τοὺς λίθους τοὺς ἐκ τῆς ὁδοῦ διαρρίψατε — «камни с пути разметайте» (διαρρίπτω — разбрасывать); ἐξάρατε σύσσημον εἰς τὰ ἔθνη — «воздвигните знамение на народы» (σύσσημον — знамя, сигнал). Речь Господа («врата Мои», «народ Мой») продолжается без новой вводной формулы — это конец клятвы 62:8."
  11: "ἐποίησεν ἀκουστὸν ἕως ἐσχάτου τῆς γῆς — «сделал слышным до конца земли»; τῇ θυγατρὶ Σιων — «дщери Сиона»; ὁ σωτὴρ παραγίνεται — «Спаситель приходит» (σωτήρ; в тексте 救い主); ἔχων τὸν ἑαυτοῦ μισθὸν — «имея Свою награду» (μισθός — плата, награда); τὸ ἔργον πρὸ προσώπου αὐτοῦ — «дело Своё пред лицом Его». «Скажите дщери Сиона» — внутри возвещения Господа; второго уровня кавычек не ставим, так как в греческом знаков нет и содержание возвещения — та же речь."
  12: "καλέσει αὐτὸν λαὸν ἅγιον — «назовут его народом святым» (в гр. ед. ч. глагола при собирательном объекте; слав. «прозовет я люди святы»); λελυτρωμένον ὑπὸ κυρίου — «искупленный Господом» (λυτρόω — выкупать, искупать); ἐπιζητουμένη πόλις — «город взысканный» (ἐπιζητέω — искать, взыскивать); οὐκ ἐγκαταλελειμμένη — «не оставленный»."
