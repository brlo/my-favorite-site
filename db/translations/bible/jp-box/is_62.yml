# Глава 62: 1–5 «не умолкну ради Сиона»: правда как свет, новое имя, венец,
# «Оставленная»/«Пустыня» → «Воля Моя»/«Вселенная», жених и невеста; 6–7 стражи
# на стенах, молитва «нет подобного Тебе»; 8–10 клятва Господа десницею Своею:
# врагам не есть хлеба, святые дворы, шествие вратами, знамя народам; 11–12
# возвещение до конца земли: «вот, Спаситель твой грядёт», народ святой,
# взысканный город.
# Голоса: 1–7 речь от 1-го лица — 「…」 (в церковном чтении 62:1–6 — слово
# Господа о Сионе; 62:7 — обращение к Богу; в LXX стих испорчен, у МТ иначе);
# 8–9 клятва Господа: вводная формула «поклялся Господь» вне кавычек, слова
# Господа — 「…」; 62:10 продолжает ту же речь Господа без новой формулы;
# 11–12 вводное «вот, Господь возвестил» — вне кавычек, возвещение — 「…」.
# Нумерация по gr: 12 стихов; у csl и ru тоже 12.
# Паритет: слав. добавление 62:4 «яко благоволи Господь в тебе, и земля твоя
# вкупе населится» (нет в LXX) внесено в основной текст без 〔…〕. 62:7 в LXX
# испорчен (ὑμῖν, «вам»; у МТ «не давайте Ему покоя») — перевод буквальный, см. notes.
# 〔…〕 нет. Сносок ⟨…⟩ нет: 冠, 城壁, 見張り, 小麦, ぶどう酒, 旗 уже в корпусе.
# Имена — транслитерация греческого (LXX): シオン, エルサレム.

