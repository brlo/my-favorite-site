# jp-box, Первое послание к Коринфянам, глава 8. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 8: «знание надмевает» (1–3), один Бог и один Господь (4–6),
# немощная совесть и идоложертвенное (7–13).
# Красного (<j>) и синего (<mo>) нет: прямой речи Христа в главе нет.
# 〔…〕 в главе нет: все стихи в gr-lxx-byz есть, церковный текст совпадает.
# 8:4–6 — исповедание Павла, а не цитата Писания с формулой цитирования,
# поэтому кавычек 「」 нет (в отличие от Быт 2:24 в 6:16).
# Сносок ⟨…⟩ в главе нет: 偶像に供えた物 уже встречается в корпусе (Деян 15:20, 21:25).
# jp-ni не использовался.

tr_code: jp-box
book: 1kor
chapter: 8
draft: true

verses:
  1: "さて、偶像[ぐうぞう]に供[そな]えた物[もの]について言[い]えば、わたしたちはみな知識[ちしき]を持[も]っていることを知[し]っている。知識[ちしき]は人[ひと]を高[たか]ぶらせるが、愛[あい]は人[ひと]を建[た]て上[あ]げる。"
  2: "もしある者[もの]が、自分[じぶん]は何[なに]かを知[し]っていると考[かんが]えているなら、その人[ひと]はまだ、知[し]るべきように知[し]ってはいない。"
  3: "しかし、もしある者[もの]が神[かみ]を愛[あい]しているなら、その人[ひと]は神[かみ]に知[し]られているのである。"
  4: "さて、偶像[ぐうぞう]に供[そな]えた物[もの]を食[た]べることについて言[い]えば、わたしたちは知[し]っている。世[よ]の中[なか]に偶像[ぐうぞう]というものは何[なに]もなく、唯一[ゆいいつ]の神[かみ]のほかに神[かみ]はない、ということを。"
  5: "たとえ天[てん]にも地[ち]にも、神[かみ]と呼[よ]ばれる者[もの]たちがいて、多[おお]くの神[かみ]や多[おお]くの主[しゅ]があるかのように見[み]えても、"
  6: "しかし、わたしたちには、唯一[ゆいいつ]の神[かみ]である父[ちち]があり、すべてはこの方[かた]から出[で]て、わたしたちもこの方[かた]に向[む]かうのである。また、唯一[ゆいいつ]の主[しゅ]イエス・キリストがあり、すべてはこの方[かた]によって成[な]り、わたしたちもこの方[かた]によって成[な]るのである。"
  7: "しかし、その知識[ちしき]がすべての者[もの]にあるのではない。ある者[もの]たちは、今[いま]に至[いた]るまで偶像[ぐうぞう]に慣[な]れ親[した]しんできたため、それを偶像[ぐうぞう]に供[そな]えた物[もの]として食[た]べ、その弱[よわ]い良心[りょうしん]が汚[けが]されるのである。"
  8: "食物[しょくもつ]はわたしたちを神[かみ]の前[まえ]に立[た]たせはしない。食[た]べなくても不足[ふそく]することはなく、食[た]べても余[あま]りが出[で]ることはない。"
  9: "しかし、あなたがたのこの自由[じゆう]が、弱[よわ]い者[もの]たちにつまずきとなることのないように、よく気[き]をつけなさい。"
  10: "というのは、もしある人[ひと]が、知識[ちしき]を持[も]っているあなたが偶像[ぐうぞう]の神殿[しんでん]に座[すわ]って食[た]べているのを見[み]たら、その弱[よわ]い者[もの]の良心[りょうしん]は、偶像[ぐうぞう]に供[そな]えた物[もの]を食[た]べるようにと建[た]て上[あ]げられてしまうではないか。"
  11: "というのは、あなたの知識[ちしき]によって、弱[よわ]い兄弟[きょうだい]が滅[ほろ]びるからである。キリストが死[し]なれた、その兄弟[きょうだい]なのである。"
  12: "このように、兄弟[きょうだい]たちに対して罪[つみ]を犯[おか]し、彼[かれ]らの弱[よわ]い良心[りょうしん]を傷[きず]つけるとき、あなたがたはキリストに対して罪[つみ]を犯[おか]しているのである。"
  13: "だから、もし食物[しょくもつ]がわたしの兄弟[きょうだい]をつまずかせるなら、わたしの兄弟[きょうだい]をつまずかせないために、わたしは永久[えいきゅう]に肉[にく]を食[た]べないであろう。"

notes:
  1: "εἰδωλόθυτα — 偶像に供えた物 (уже в Деян 15:20, 21:25). γνῶσις φυσιοῖ — 知識は人を高ぶらせる; ἡ δὲ ἀγάπη οἰκοδομεῖ — 愛は人を建て上げる, без сглаживания."
  4: "οὐδὲν εἴδωλον ἐν κόσμῳ — 世の中に偶像というものは何もない; οὐδεὶς θεὸς εἰ μὴ εἷς — 唯一の神のほかに神はない. Это исповедание Павла, не цитата Писания: 「」 нет."
  5: "λεγόμενοι θεοί — 神と呼ばれる者たち; ὥσπερ — かのように見えても."
  6: "εἷς θεὸς ὁ πατήρ — 唯一の神である父; ἐξ οὗ τὰ πάντα καὶ ἡμεῖς εἰς αὐτόν — すべてはこの方から出て、わたしたちもこの方に向かう; εἷς κύριος Ἰησοῦς Χριστός — 唯一の主イエス・キリスト; δι᾿ οὗ τὰ πάντα — すべてはこの方によって成り."
  7: "τῇ συνηθείᾳ ἕως ἄρτι τοῦ εἰδώλου — 今に至るまで偶像に慣れ親しんできたため; συνείδησις — 良心; μολύνεται — 汚される."
  8: "παραστήσει τῷ θεῷ — 神の前に立たせる; ὑστερούμεθα / περισσεύομεν — 不足する / 余りが出る."
  9: "ἡ ἐξουσία ὑμῶν αὕτη — あなたがたのこの自由; πρόσκομμα — つまずき; ἀσθενεῖς — 弱い者たち."
  10: "ἐν εἰδωλείῳ κατακείμενον — 偶像の神殿に座って食べている; οἰκοδομηθήσεται εἰς τὸ ἐσθίειν — 食べるようにと建て上げられてしまう, ирония с 8:1 сохранена."
  11: "ἀπόλλυται γάρ — 滅びるからである; ὁ ἀδελφὸς δι᾿ ὃν Χριστὸς ἀπέθανεν — キリストが死なれた、その兄弟, относительное придаточное вынесено в конец для силы."
  12: "τύπτοντες αὐτῶν τὴν συνείδησιν ἀσθενοῦσαν — 弱い良心を傷つける; εἰς Χριστὸν ἁμαρτάνετε — キリストに対して罪を犯す."
  13: "διόπερ — だから; οὐ μὴ φάγω κρέα εἰς τὸν αἰῶνα — 永久に肉を食べないであろう; σκανδαλίζειν — つまずかせる."
