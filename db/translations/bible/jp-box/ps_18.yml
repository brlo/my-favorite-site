verses:
  0: "指揮者[しきしゃ]のために。ダビデの詩[うた]。"
  1: "天[てん]は神[かみ]の栄光[えいこう]を語[かた]り、大空[おおぞら]はその手[て]のわざを告[つ]げる。"
  2: "日[ひ]は日[ひ]に言葉[ことば]を語[かた]り、夜[よる]は夜[よる]に知識[ちしき]を示[しめ]す。"
  3: "その声[こえ]が聞[き]こえないような語[かた]りも言葉[ことば]もない。"
  4: "その響[ひび]きは全[ぜん]地[ち]に、その言葉[ことば]は世界[せかい]の果[は]てまで届[とど]いた。神[かみ]は太陽[たいよう]の中[なか]にその幕屋[まくや]を置[お]かれた。"
  5: "太陽[たいよう]は、花婿[はなむこ]が新婚[しんこん]の部屋[へや]から出[で]てくるように、力[ちから]ある者[もの]のように、その道[みち]を走[はし]って喜[よろこ]ぶ。"
  6: "その出[で]るところは天[てん]の端[はし]から、その巡[めぐ]るところは天[てん]の端[はし]まで。その熱[ねつ]を免[まぬか]れる者[もの]はない。"
  7: "主[しゅ]の律法[りっぽう]は完全[かんぜん]で、魂[たましい]を立[た]ち返[かえ]らせる。主[しゅ]の証[あかし]は確[たし]かで、幼[おさな]い者[もの]を賢[かしこ]くする。"
  8: "主[しゅ]の定[さだ]めは正[ただ]しく、心[こころ]を喜[よろこ]ばせる。主[しゅ]の戒[いまし]めは明[あき]らかで、目[め]を照[て]らす。"
  9: "主[しゅ]への恐[おそ]れは清[きよ]く、とこしえに保[たも]たれる。主[しゅ]の裁[さば]きは真実[しんじつ]で、すべて等[ひと]しく正[ただ]しい。"
  10: "金[きん]よりも、多[おお]くの高価[こうか]な石[いし]よりも慕[した]わしく、蜜[みつ]よりも、蜂[はち]の巣[す]から滴[したた]る蜜[みつ]よりも甘[あま]い。"
  11: "あなたの僕[しもべ]はそれらを守[まも]る。それを守[まも]ることには大[おお]きな報[むく]いがある。"
  12: "だれが、自分[じぶん]の過[あやま]ちに気[き]づくであろうか。どうか、わたしの隠[かく]れた罪[つみ]からわたしを清[きよ]めてください。"
  13: "どうか、あなたの僕[しもべ]を、ほかの者[もの]の罪[つみ]から遠[とお]ざけてください。それらがわたしを支配[しはい]しなければ、わたしは傷[きず]のない者[もの]となり、大[おお]きな罪[つみ]から清[きよ]められる。"
  14: "主[しゅ]よ、わたしの助[たす]け、わたしを贖[あがな]う方[かた]よ。どうか、わたしの口[くち]の言葉[ことば]と、わたしの心[こころ]の思[おも]いとが、いつもあなたの前[まえ]で喜[よろこ]ばれるように。"

notes:
  0: "Εἰς τὸ τέλος· ψαλμὸς τῷ Δαυιδ — 指揮者のために。ダビデの詩. Надписание — стих 0."
  1: "διηγοῦνται — 語り. δόξαν θεοῦ — 神の栄光. ποίησιν χειρῶν — 手のわざ. στερέωμα — 大空 (твердь)."
  2: "ἐρεύγεται ῥῆμα — 言葉を語り (букв. «изрыгает слово»). ἀναγγέλλει γνῶσιν — 知識を示す."
  3: "λαλιαί… λόγοι — 語り…言葉. ὧν οὐχὶ ἀκούονται αἱ φωναί — その声が聞こえないような語りも言葉もない (двойное отрицание греч.)."
  4: "φθόγγος — 響き. εἰς τὰ πέρατα τῆς οἰκουμένης — 世界の果てまで. ἐν τῷ ἡλίῳ ἔθετο τὸ σκήνωμα — 太陽の中に幕屋を置かれた."
  5: "νυμφίος ἐκ παστοῦ — 花婿が新婚の部屋から. γίγας — 力ある者 (исполин). δραμεῖν ὁδόν — 道を走る."
  6: "ἄκρου τοῦ οὐρανοῦ — 天の端. κατάντημα — 巡るところ. θέρμη — 熱."
  7: "νόμος ἄμωμος — 律法は完全. ἐπιστρέφων ψυχάς — 魂を立ち返らせる. μαρτυρία πιστή — 証は確か. σοφίζουσα νήπια — 幼い者を賢くする."
  8: "δικαιώματα εὐθεῖα — 定めは正しい. ἐντολὴ τηλαυγής — 戒めは明らか. φωτίζουσα ὀφθαλμούς — 目を照らす."
  9: "φόβος ἁγνός — 恐れは清い. διαμένων εἰς αἰῶνα — とこしえに保たれる. δεδικαιωμένα ἐπὶ τὸ αὐτό — すべて等しく正しい."
  10: "ἐπιθυμητά — 慕わしい. χρυσίον καὶ λίθος τίμιος — 金と高価な石. γλυκύτερα ὑπὲρ μέλι καὶ κηρίον — 蜜と蜂の巣の蜜よりも甘い."
  11: "φυλάσσει — 守る. ἀνταπόδοσις πολλή — 大きな報い."
  12: "παραπτώματα — 過ち. ἐκ τῶν κρυφίων — 隠れた罪から. καθάρισον — 清めてください."
  13: "ἀπὸ ἀλλοτρίων — ほかの者の罪から (букв. «от чужих»; имеются в виду чужие грехи, ср. Синодальный «от чужих»). κατακυριεύσωσιν — 支配する. ἄμωμος — 傷のない."
  14: "εἰς εὐδοκίαν — 喜ばれるように. μελέτη τῆς καρδίας — 心の思い. βοηθέ… λυτρωτά — 助け…贖う方."
