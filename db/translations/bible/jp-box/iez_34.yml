verses:
  1: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  2: "「人[ひと]の子[こ]よ、イスラエルの牧者[ぼくしゃ]たちに向[む]かって預言[よげん]せよ。預言[よげん]して、牧者[ぼくしゃ]たちに言[い]え。主[しゅ]である神[かみ]はこう言[い]われる。ああ、イスラエルの牧者[ぼくしゃ]たちよ。牧者[ぼくしゃ]たちは自分[じぶん]たちを飼[か]うのか。牧者[ぼくしゃ]たちは羊[ひつじ]を飼[か]うのではないのか。"
  3: "見[み]よ、あなたがたは乳[ちち]を食[た]べ、羊毛[ようもう]をまとい、肥[こ]えた者[もの]を屠[ほふ]り、わたしの羊[ひつじ]を飼[か]わない。"
  4: "弱[よわ]った者[もの]を強[つよ]めず、病[や]む者[もの]を癒[いや]さず、砕[くだ]かれた者[もの]を包[つつ]まず、迷[まよ]う者[もの]を連[つ]れ戻[もど]さず、失[うしな]われた者[もの]を探[さが]さず、強[つよ]い者[もの]を苦[くる]しみと力[ちから]によって虐[しいた]げ、罰[ばっ]して辱[はずかし]めた。"
  5: "そして、わたしの羊[ひつじ]は牧者[ぼくしゃ]がいないために散[ち]り、野[の]のすべての獣[けもの]の食[た]べ物[もの]となった。"
  6: "わたしの羊[ひつじ]はすべての山[やま]とすべての高[たか]い丘[おか]に散[ち]り、地[ち]のすべての面[おもて]に散[ち]り散[ち]らされた。これを尋[たず]ねる者[もの]も、連[つ]れ戻[もど]す者[もの]もいない。"
  7: "それゆえ、牧者[ぼくしゃ]たちよ、主[しゅ]の言葉[ことば]を聞[き]け。"
  8: "わたしは生[い]きている、と主[しゅ]である神[かみ]は言[い]われる。わたしの羊[ひつじ]が奪[うば]われ、牧者[ぼくしゃ]がいないためにわたしの羊[ひつじ]が野[の]のすべての獣[けもの]の食[た]べ物[もの]となり、わたしの牧者[ぼくしゃ]たちがわたしの羊[ひつじ]を尋[たず]ねず、牧者[ぼくしゃ]たちが自分[じぶん]たちを飼[か]って、わたしの羊[ひつじ]を飼[か]わなかったゆえに、"
  9: "それゆえ、牧者[ぼくしゃ]たちよ、主[しゅ]の言葉[ことば]を聞[き]け。"
  10: "主[しゅ]である神[かみ]はこう言[い]われる。見[み]よ、わたしは牧者[ぼくしゃ]たちに向[む]かう。わたしはその手[て]からわたしの羊[ひつじ]を求[もと]め、彼らを退[しりぞ]けて、わたしの羊[ひつじ]を飼[か]わせない。牧者[ぼくしゃ]たちはもはやこれを飼[か]わず、自分[じぶん]たちも飼[か]わない。わたしはその口[くち]からわたしの羊[ひつじ]を取[と]り出[だ]す。彼らはもはや彼らの食[た]べ物[もの]とならない。"
  11: "それゆえ、主[しゅ]である神[かみ]はこう言[い]われる。見[み]よ、わたしはわたしの羊[ひつじ]を求[もと]め、これを顧[かえり]みる。"
  12: "羊飼[ひつじか]いが、雲[くも]と暗[くら]やみの日[ひ]に、散[ち]り分[わ]けられた自分[じぶん]の羊[ひつじ]のただ中[なか]でその群[む]れを顧[かえり]みるように、わたしはわたしの羊[ひつじ]を尋[たず]ね、彼らを、雲[くも]と暗[くら]やみの日[ひ]に散[ち]らされたすべての所[ところ]から連[つ]れ出[だ]す。"
  13: "わたしは彼らを国[くに]々[ぐに]から連[つ]れ出[だ]し、それらの地[ち]から集[あつ]めて、その地[ち]に連[つ]れて行[い]き、イスラエルの山[やま]々[やま]で、谷[たに]々[たに]で、その地[ち]のすべての住[す]まいで彼らを飼[か]う。"
  14: "良[よ]い牧[まき]場[ば]でわたしは彼らを飼[か]う。その囲[かこ]いはイスラエルの高[たか]い山[やま]にある。そこで彼らは横[よこ]たわり、豊[ゆた]かな安[やす]らぎのうちに休[やす]む。イスラエルの山[やま]々[やま]の肥[こ]えた牧[まき]場[ば]で草[くさ]を食[は]む。"
  15: "わたしがわたしの羊[ひつじ]を飼[か]い、わたしが彼らを休[やす]ませる。彼らはわたしが主[しゅ]であることを知[し]る。"
  16: "主[しゅ]である神[かみ]はこう言[い]われる。失[うしな]われた者[もの]をわたしは尋[たず]ね、迷[まよ]う者[もの]を連[つ]れ戻[もど]し、砕[くだ]かれた者[もの]を包[つつ]み、弱[よわ]った者[もの]を強[つよ]め、強[つよ]い者[もの]を守[まも]り、裁[さば]きをもって彼らを飼[か]う。"
  17: "あなたがた、わたしの羊[ひつじ]たちよ。主[しゅ]である神[かみ]はこう言[い]われる。見[み]よ、わたしは羊[ひつじ]と羊[ひつじ]の間[あいだ]、雄羊[おひつじ]と雄山羊[おやぎ]の間[あいだ]を裁[さば]く。"
  18: "あなたがたが良[よ]い牧[まき]場[ば]で草[くさ]を食[は]むだけでは足[た]りないのか。あなたがたは自分[じぶん]の牧[まき]場[ば]の残[のこ]りを足[あし]で踏[ふ]みにじり、澄[す]んだ水[みず]を飲[の]みながら、残[のこ]りを足[あし]で濁[にご]らす。"
  19: "そして、わたしの羊[ひつじ]はあなたがたの足[あし]の踏[ふ]みにじった所[ところ]を食[た]べ、あなたがたの足[あし]で濁[にご]らした水[みず]を飲[の]むというのか。"
  20: "それゆえ、主[しゅ]である神[かみ]はこう言[い]われる。見[み]よ、わたしは強[つよ]い羊[ひつじ]と弱[よわ]い羊[ひつじ]の間[あいだ]を裁[さば]く。"
  21: "あなたがたは脇腹[わきばら]と肩[かた]で押[お]し、角[つの]で突[つ]いて、すべて弱[よわ]った者[もの]を押[お]し出[だ]し、ついに彼らを外[そと]へ追[お]い出[だ]したので、"
  22: "わたしはわたしの羊[ひつじ]を救[すく]い、彼らはもはや奪[うば]われる者[もの]とならない。わたしは雄羊[おひつじ]と雄羊[おひつじ]の間[あいだ]を裁[さば]く。"
  23: "わたしは彼らの上[うえ]に一人[ひとり]の牧者[ぼくしゃ]を立[た]て、彼が彼らを飼[か]う。わたしの僕[しもべ]ダビデである。彼が彼らを飼[か]い、彼が彼らの牧者[ぼくしゃ]となる。"
  24: "わたしは主[しゅ]として彼らの神[かみ]となり、わたしの僕[しもべ]ダビデは彼らの間[あいだ]で君[きみ]となる。わたしは主[しゅ]である、と語[かた]った。"
  25: "わたしはダビデと平和[へいわ]の契約[けいやく]を結[むす]び、悪[わる]い獣[けもの]を地[ち]から滅[ほろ]ぼす。彼らは荒[あ]れ野[の]に住[す]み、森[もり]の中で望[のぞ]みをもって眠[ねむ]る。"
  26: "わたしは彼らに、わたしの山[やま]の周[まわ]りの祝福[しゅくふく]を与[あた]え、あなたがたにその時[とき]の雨[あめ]、祝福[しゅくふく]の雨[あめ]を降[ふ]らす。"
  27: "野[の]の木[き]はその実[み]を結[むす]び、地[ち]はその力[ちから]を与[あた]える。彼らは自分[じぶん]の地[ち]に平和[へいわ]の望[のぞ]みをもって住[す]む。わたしが彼らの軛[くびき]の結[むす]び目[め]を砕[くだ]き、彼らを奴隷[どれい]にした者[もの]の手[て]から彼らを救[すく]い出[だ]すとき、彼らはわたしが主[しゅ]であることを知[し]る。"
  28: "彼らはもはや国[くに]々[ぐに]の獲物[えもの]とならず、地[ち]の獣[けもの]も彼らを食[た]べない。彼らは望[のぞ]みをもって住[す]み、彼らを恐[おそ]れさせる者[もの]はいなくなる。"
  29: "わたしは彼らに平和[へいわ]の若木[わかぎ]を起[お]こす。彼らはもはや地[ち]で数[かず]少[すく]なくならず、飢[う]えによって滅[ほろ]びず、国[くに]々[ぐに]の辱[はずかし]めを負[お]わない。"
  30: "彼らは、わたしが彼らの神[かみ]である主[しゅ]であり、彼らがわたしの民[たみ]、イスラエルの家[いえ]であることを知[し]る、と主[しゅ]である神[かみ]は言[い]われる。"
  31: "あなたがたはわたしの羊[ひつじ]、わたしの牧[まき]場[ば]の羊[ひつじ]である。わたしはあなたがたの神[かみ]である、と主[しゅ]である神[かみ]は言[い]われる」。"

notes:
  1: "Καὶ ἐγένετο λόγος κυρίου πρός με λέγων — «и было слово Господне ко мне, говоря»: формула вне кавычек. Слав. «И бысть слово Господне ко мне глаголя»."
  2: "Υἱὲ ἀνθρώπου, προφήτευσον ἐπὶ τοὺς ποιμένας τοῦ Ισραηλ — «сын человеческий, прореки на пастырей Израилевых» (ποιμήν — 牧者[ぼくしゃ], как в Иер 23); Ὦ ποιμένες Ισραηλ — «о пастыри Израилевы» (звательный с Ὦ); μὴ βόσκουσιν ποιμένες ἑαυτούς — «разве пасут пастыри самих себя?» (βόσκω — 飼[か]う); οὐ τὰ πρόβατα βόσκουσιν οἱ ποιμένες — «не овец ли пасут пастыри?» Слав. «оле, пастырие израилевы!» (горе) — Ὦ передано ああ; в ru «горе пастырям»."
  3: "τὸ γάλα κατέσθετε — «молоко ели» (κατεσθίω); τὰ ἔρια περιβάλλεσθε — «шерстью одевались» (ἔριον — 羊毛[ようもう]); τὸ παχὺ σφάζετε — «тучное закалали» (σφάζω — 屠[ほふ]る); τὰ πρόβατά μου οὐ βόσκετε — «овец Моих не пасёте». Стих начинается с ἰδού — 見[み]よ."
  4: "τὸ ἠσθενηκὸς οὐκ ἐνισχύσατε — «немощное не укрепили»; τὸ κακῶς ἔχον οὐκ ἐσωματοποιήσατε — «больное не уврачевали» (σωματοποιέω — тёмное слово, слав. «не уврачевасте»); τὸ συντετριμμένον οὐ κατεδήσατε — «сокрушённое не перевязали»; τὸ πλανώμενον οὐκ ἐπεστρέψατε — «блуждающее не возвратили»; τὸ ἀπολωλὸς οὐκ ἐζητήσατε — «погибшее не искали»; τὸ ἰσχυρὸν κατειργάσασθε μόχθῳ — «сильное (изнурили) трудом». Слав. добавляет «и властию наказасте я и наруганием» — нет в LXX, внесено."
  5: "διεσπάρη τὰ πρόβατά μου διὰ τὸ μὴ εἶναι ποιμένας — «рассеялись овцы Мои, ибо нет пастырей» (διασπείρω); ἐγενήθη εἰς κατάβρωμα πᾶσι τοῖς θηρίοις τοῦ ἀγροῦ — «стали снедью всем зверям полевым»."
  6: "ἐν παντὶ ὄρει καὶ ἐπὶ πᾶν βουνὸν ὑψηλόν — «по всякой горе и по всякому холму высокому» (βουνός — 丘[おか]); ἐπὶ προσώπου πάσης τῆς γῆς — «по лицу всей земли»; οὐκ ἦν ὁ ἐκζητῶν οὐδὲ ὁ ἀποστρέφων — «не было ни взыскующего, ни возвращающего». Слав. содержит в скобках «(заблудиша)» — редакционное, не перенесено."
  7: "διὰ τοῦτο, ποιμένες, ἀκούσατε λόγον κυρίου — «потому, пастыри, услышьте слово Господне». Слав. «Того ради, о, пастырие, слышите слово Господне»."
  8: "Ζῶ ἐγώ — «живу Я»; ἀντὶ τοῦ γενέσθαι τὰ πρόβατά μου εἰς προνομήν — «за то, что овцы Мои стали добычей» (προνομή — добыча, 奪[うば]われる); εἰς κατάβρωμα — «в снедь»; παρὰ τὸ μὴ εἶναι ποιμένας — «за то, что нет пастырей»; οὐκ ἐξεζήτησαν οἱ ποιμένες τὰ πρόβατά μου — «не взыскали пастыри овец Моих»; ἐβόσκησαν ἑαυτούς — «пасли сами себя». Стих кончается запятой: мысль продолжается в 9–10, поэтому и в переводе 、."
  9: "ἀντὶ τούτου, ποιμένες — «за то, пастыри»: в LXX стих — обрывок без глагола, слав. добавляет «слышите слово Господне» — внесено (повтор 7-го)."
  10: "Ἰδοὺ ἐγὼ ἐπὶ τοὺς ποιμένας — «вот, Я — на пастырей» (формула суда, ср. 26:3; 35:3); ἐκζητήσω τὰ πρόβατά μου ἐκ τῶν χειρῶν αὐτῶν — «взыщу овец Моих от рук их»; ἀποστρέψω αὐτοὺς τοῦ μὴ ποιμαίνειν — «отвращу их, чтобы не пасти»; ἐξελοῦμαι… ἐκ τοῦ στόματος αὐτῶν — «избавлю из уст их»; οὐκ ἔσονται αὐτοῖς ἔτι εἰς κατάβρωμα — «не будут им более в снедь». Слав. добавляет «ниже самих себе имут пасти» — нет в LXX, внесено."
  11: "διότι τάδε λέγει κύριος — «ибо так говорит Господь»; Ἰδοὺ ἐγὼ ἐκζητήσω τὰ πρόβατά μου — «вот, Я взыщу овец Моих»; ἐπισκέψομαι αὐτά — «посещу (призрю) их» (ἐπισκέπτομαι — 顧[かえり]みる)."
  12: "ὥσπερ ζητεῖ ὁ ποιμὴν τὸ ποίμνιον αὐτοῦ — «как ищет пастух стадо своё»; ἐν ἡμέρᾳ, ὅταν ᾖ γνόφος καὶ νεφέλη — «в день, когда мрак и облако» (γνόφος — 暗[くら]やみ); ἐν μέσῳ προβάτων διακεχωρισμένων — «среди овец разделённых» (διαχωρίζω); ἀπελάσω αὐτὰ ἀπὸ παντὸς τόπου, οὗ διεσπάρησαν — «изгоню (выведу) их из всякого места, где рассеялись» (ἀπελαύνω). В МТ/ru «поверяет стадо» — иной образ; держим LXX."
  13: "ἐξάξω αὐτοὺς ἐκ τῶν ἐθνῶν καὶ συνάξω αὐτοὺς ἀπὸ τῶν χωρῶν — «выведу их из народов и соберу из стран» (χώρα — 地[ち]); εἰσάξω αὐτοὺς εἰς τὴν γῆν αὐτῶν — «введу их в землю их»; βοσκήσω αὐτοὺς ἐπὶ τὰ ὄρη Ισραηλ — «буду пасти их на горах Израилевых»; ἐν ταῖς φάραγξιν καὶ ἐν πάσῃ κατοικίᾳ τῆς γῆς — «в ущельях и во всяком обитании земли» (κατοικία — 住[す]まい)."
  14: "ἐν νομῇ ἀγαθῇ βοσκήσω αὐτούς — «на пажити благой буду пасти их» (νομή — 牧[まき]場[ば]); ἐν τῷ ὄρει τῷ ὑψηλῷ Ισραηλ — «на горе высокой Израилевой»; αἱ μάνδραι αὐτῶν — «дворы (загоны) их» (μάνδρα — 囲[かこ]い); κοιμηθήσονται — «возлягут»; ἐν τρυφῇ ἀγαθῇ — «в неге благой» (τρυφή — нега, изобилие); ἐν νομῇ πίονι — «на пажити тучной» (πίων — тучный)."
  15: "ἐγὼ βοσκήσω τὰ πρόβατά μου καὶ ἐγὼ ἀναπαύσω αὐτά — «Я буду пасти овец Моих и Я успокою их»: «Я Сам» — удвоение ἐγώ; γνώσονται ὅτι ἐγώ εἰμι κύριος — формула знания; τάδε λέγει κύριος κύριος — в LXX формула стоит в конце стиха и открывает 16-й, слав. ставит её в начало 16-го — так и переведено."
  16: "Τὸ ἀπολωλὸς ζητήσω — «погибшее взыщу»; τὸ πλανώμενον ἐπιστρέψω — «блуждающее возвращу»; τὸ συντετριμμένον καταδήσω — «сокрушённое перевяжу»; τὸ ἐκλεῖπον ἐνισχύσω — «оскудевающее укреплю»; τὸ ἰσχυρὸν φυλάξω — «сильное соблюду»; βοσκήσω αὐτὰ μετὰ κρίματος — «буду пасти их с судом». В ru (МТ) «разжиревшую и буйную истреблю» — иное чтение, не внесено."
  17: "καὶ ὑμεῖς, πρόβατα — «и вы, овцы» (слав. добавляет «моя» — わたしの羊[ひつじ]); διακρινῶ ἀνὰ μέσον προβάτου καὶ προβάτου — «различу (рассужу) между овцою и овцою» (διακρίνω); κριῶν καὶ τράγων — «овнов и козлов» (κριός — 雄羊[おひつじ], τράγος — 雄山羊[おやぎ])."
  18: "οὐχ ἱκανὸν ὑμῖν ὅτι τὴν καλὴν νομὴν ἐνέμεσθε — «разве мало вам, что на благой пажити паслись?» (νέμομαι); τὰ κατάλοιπα τῆς νομῆς ὑμῶν κατεπατεῖτε τοῖς ποσὶν ὑμῶν — «остатки пажити вашей попирали ногами вашими» (καταπατέω); τὸ καθεστηκὸς ὕδωρ ἐπίνετε — «стоячую (отстоявшуюся) воду пили» (καθεστηκός; слав. «устоявшуюся»); τὸ λοιπὸν… ἐταράσσετε — «остальное… возмущали» (ταράσσω — 濁[にご]らす)."
  19: "τὰ πατήματα τῶν ποδῶν ὑμῶν ἐνέμοντο — «попираемое ногами вашими ели» (πάτημα — попрание); τὸ τεταραγμένον ὕδωρ ὑπὸ τῶν ποδῶν ὑμῶν ἔπινον — «возмущённую воду ногами вашими пили»: стих продолжает вопрос 18-го, поэтому в конце のか."
  20: "διακρινῶ ἀνὰ μέσον προβάτου ἰσχυροῦ καὶ… ἀσθενοῦς — «различу между овцою сильной и овцою немощной»: в тексте 強[つよ]い羊[ひつじ]/弱[よわ]い羊[ひつじ], в ru (МТ) «тучною и тощею» — иное чтение."
  21: "ἐπὶ ταῖς πλευραῖς καὶ τοῖς ὤμοις ὑμῶν διωθεῖσθε — «боками и плечами толкали» (πλευρά — 脇腹[わきばら], ὦμος — 肩[かた]; διωθέομαι); τοῖς κέρασιν ὑμῶν ἐκερατίζετε — «рогами бодали»; πᾶν τὸ ἐκλεῖπον ἐξεθλίβετε — «всякое оскудевающее вытесняли» (ἐκθλίβω). Слав. добавляет «дондеже изгнасте я вон» — нет в LXX, внесено; поэтому стих кончается на 、 и продолжается в 22-м."
  22: "σώσω τὰ πρόβατά μου — «спасу овец Моих»; οὐ μὴ ὦσιν ἔτι εἰς προνομήν — «не будут более в добычу»; κρινῶ ἀνὰ μέσον κριοῦ πρὸς κριόν — «рассужу между овном и овном». Слав. добавляет ещё пару «между овчатем и овчатем» — дублет, в текст не внесён."
  23: "ἀναστήσω ἐπ' αὐτοὺς ποιμένα ἕνα — «поставлю над ними пастыря одного»; τὸν δοῦλόν μου Δαυιδ — «раба Моего Давида»; ἔσται αὐτῶν ποιμήν — «будет их пастырем». Слав. содержит в скобках «(и той упокоит я,)» — редакционное, не перенесено."
  24: "ἐγὼ κύριος ἔσομαι αὐτοῖς εἰς θεόν — «Я, Господь, буду им в Бога»; Δαυιδ ἐν μέσῳ αὐτῶν ἄρχων — «Давид среди них князь» (ἄρχων — 君[きみ]); ἐγὼ κύριος ἐλάλησα — «Я, Господь, сказал»."
  25: "διαθήσομαι τῷ Δαυιδ διαθήκην εἰρήνης — «заключу с Давидом завет мира» (слав. «завещаю давидови завет мирный»); ἀφανιῶ θηρία πονηρὰ ἀπὸ τῆς γῆς — «истреблю зверей злых с земли» (ἀφανίζω); κατοικήσουσιν ἐν τῇ ἐρήμῳ — «будут жить в пустыне»; ὑπνώσουσιν ἐν τοῖς δρυμοῖς — «будут спать в дубравах» (δρυμός — 森[もり]). Слав. добавляет «уповающе» (с надеждою) — нет в LXX, внесено."
  26: "δώσω αὐτοὺς περικύκλῳ τοῦ ὄρους μου — «дам их (благословение) вокруг горы Моей»; δώσω τὸν ὑετὸν ὑμῖν — «дам вам дождь» (ὑετός); ὑετὸν εὐλογίας — «дождь благословения». Слав. добавляет «во время свое» — нет в LXX, внесено."
  27: "τὰ ξύλα τὰ ἐν τῷ πεδίῳ δώσει τὸν καρπὸν αὐτῶν — «деревья полевые дадут плод свой»; ἡ γῆ δώσει τὴν ἰσχὺν αὐτῆς — «земля даст силу свою»; ἐν ἐλπίδι εἰρήνης — «в надежде мира»; συντρίψας τὸν ζυγὸν αὐτῶν — «сокрушив ярмо их» (ζυγός — 軛[くびき]); ἐξελοῦμαι… ἐκ χειρὸς τῶν καταδουλωσαμένων — «избавлю из руки поработивших» (καταδουλόω). Слав. «узы ига их» — добавлено «узы», передано 結[むす]び目[め]."
  28: "οὐκ ἔσονται ἔτι ἐν προνομῇ τοῖς ἔθνεσιν — «не будут более в добычу народам»; τὰ θηρία τῆς γῆς οὐκέτι μὴ φάγωσιν αὐτούς — «звери земные не будут есть их»; ἐν ἐλπίδι — «в надежде»; οὐκ ἔσται ὁ ἐκφοβῶν αὐτούς — «не будет устрашающего их» (ἐκφοβέω)."
  29: "ἀναστήσω αὐτοῖς φυτὸν εἰρήνης — «воздвигну им растение мира» (φυτόν — 若木[わかぎ]); οὐκέτι ἔσονται ἀπολλύμενοι λιμῷ — «не будут более гибнуть от голода»; οὐ μὴ ἐνέγκωσιν ἔτι ὀνειδισμὸν ἐθνῶν — «не понесут более поношения народов» (ὄνειδος — поношение). Слав. добавляет «не будут ктому малы числом» — нет в LXX, внесено."
  30: "γνώσονται ὅτι ἐγώ εἰμι κύριος ὁ θεὸς αὐτῶν — «узнают, что Я — Господь Бог их»; αὐτοὶ λαός μου, οἶκος Ισραηλ — «они — народ Мой, дом Израилев»; λέγει κύριος — слав. добавляет «адонаи»."
  31: "πρόβατά μου καὶ πρόβατα ποιμνίου μού ἐστε — «овцы Мои и овцы паствы Моей вы» (ποίμνιον — 群[む]れ); ἐγὼ κύριος ὁ θεὸς ὑμῶν — «Я — Господь Бог ваш». В ru (МТ) добавлено «вы — человеки» — нет ни в LXX, ни в слав., не внесено. Здесь слово Господа (2–31) закрывается."
