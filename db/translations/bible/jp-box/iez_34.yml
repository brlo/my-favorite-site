# jp-box, Иезекииль, глава 34. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 34 (совпадает).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: пастыри и овцы. 1–2 слово Господа; 2–6 обвинение пастырям: пасут себя,
# молоко, шерсть, тук, больных и потерянных не ищут; 7–10 суд над пастырями: «вот, Я —
# на пастырей», овец изыму из уст их; 11–16 «Я Сам буду пасти»: взыщу, соберу, приведу,
# на горах Израилевых, на благой пажити, «потерявшуюся отыщу»; 17–22 суд между овцами,
# тучными и тощими, рогами бодающими; 23–31 единый пастырь — раб Давид, завет мира,
# дождь благословения, «вы — овцы Мои».
# Голоса: 1 — формула вне кавычек. 2–31 — одно непрерывное слово Господа в 「…»
# (формулы «так говорит Господь Бог» в 2, 10, 11, 17, 20, 30 внутри речи; вложенной
# речи нет). В 15 у LXX формула «так говорит» стоит в конце стиха и открывает 16-й;
# в слав. она в начале 16-го — так и переведено.
# «Точка»: в этой главе нет.
# Термины: 牧者[ぼくしゃ] — ποιμήν (как в Иер 23), 羊[ひつじ] — πρόβατον, 群[む]れ — ποίμνιον,
# 牧[まき]場[ば] — νομή, 囲[かこ]い — μάνδρα, 飼[か]う — βόσκω (ποιμαίνω), 雄羊[おひつじ] — κριός,
# 雄山羊[おやぎ] — τράγος, 軛[くびき] — ζυγός; 顧[かえり]みる — ἐπισκέπτομαι (34:11, 12).
#
