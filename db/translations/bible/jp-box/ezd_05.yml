verses:
  1: "預言者[よげんしゃ]ハガイと、アドの子[こ]である預言者[よげんしゃ]ゼカリヤは、イスラエルの神[かみ]の名[な]によって、ユダとエルサレムにいるユダヤ人[じん]たちに預言[よげん]した。"
  2: "そのとき、サラティエルの子[こ]ゼルバベルとヨセデクの子[こ]イエシュアは立[た]ち上[あ]がり、エルサレムにある神[かみ]の家[いえ]を建[た]て始[はじ]めた。神[かみ]の預言者[よげんしゃ]たちも彼[かれ]らとともにいて、彼[かれ]らを助[たす]けた。"
  3: "そのとき、川向[かわむ]こうの知事[ちじ]タンタナイ、サタルブザナ、および彼[かれ]らの同僚[どうりょう]たちが彼[かれ]らのところへ来[き]て、こう言[い]った。「だれがあなたがたに、この家[いえ]を建[た]て、この城壁[じょうへき]を整[ととの]える権限[けんげん]を与[あた]えたのか。」"
  4: "そのとき、彼[かれ]らはわたしたちにこう言[い]った。「この町[まち]を建[た]てている者[もの]たちの名[な]は何[なに]か。」"
  5: "しかし、神[かみ]の目[め]はユダの捕囚[ほしゅう]の者[もの]たちの上[うえ]にあった。ダリウスに上奏[じょうそう]され、そのことについて返答[へんとう]が送[おく]られるまで、彼[かれ]らをやめさせなかった。"
  6: "手紙[てがみ]の写[うつ]しは次[つぎ]のとおりである。それは、川向[かわむ]こうの知事[ちじ]タンタナイ、サタルブザナ、および川向[かわむ]こうにいる彼[かれ]らの同僚[どうりょう]であるアファルサハイ人[じん]たちが、ダリウス王[おう]に送[おく]ったものである。"
  7: "彼[かれ]らは彼[かれ]に次[つぎ]の言葉[ことば]を送[おく]った。その中[なか]にはこう書[か]かれている。「ダリウス王[おう]に、すべての平和[へいわ]があるように。」"
  8: "「王[おう]に知[し]らせる。わたしたちはユダの地方[ちほう]へ、大[おお]いなる神[かみ]の家[いえ]へ行[い]った。それは選[えら]ばれた石[いし]で建[た]てられ、その壁[かべ]には木[き]が入[い]れられている。その工事[こうじ]は入念[にゅうねん]に行[おこな]われ、彼[かれ]らの手[て]のうちで順調[じゅんちょう]に進[すす]んでいる。」"
  9: "「そこで、わたしたちはあの長老[ちょうろう]たちに尋[たず]ね、彼[かれ]らにこう言[い]った。『だれがあなたがたに、この家[いえ]を建[た]て、この城壁[じょうへき]を整[ととの]える権限[けんげん]を与[あた]えたのか。』」"
  10: "「また、わたしたちは彼[かれ]らに名[な]を尋[たず]ねて、あなたに知[し]らせ、彼[かれ]らの長[かしら]である者[もの]たちの名[な]をあなたに書[か]き送[おく]ることができるようにした。」"
  11: "「そして、彼[かれ]らはわたしたちにこう答[こた]えて言[い]った。『わたしたちは天[てん]と地[ち]の神[かみ]のしもべであり、ずっと昔[むかし]に建[た]てられた家[いえ]を建[た]てているのである。イスラエルの偉大[いだい]な王[おう]がそれを建[た]て、それを完成[かんせい]させた。』」"
  12: "「『しかし、わたしたちの父祖[ふそ]たちが天[てん]の神[かみ]を怒[いか]らせたとき、神[かみ]は彼[かれ]らを、バビロンの王[おう]であるカルデア人[じん]ネブカドネツルの手[て]に渡[わた]された。彼[かれ]はこの家[いえ]を壊[こわ]し、民[たみ]をバビロンへ移[うつ]した。』」"
  13: "「『しかし、クロス王[おう]の第一年[だいいちねん]、バビロンの王[おう]クロスは、この神[かみ]の家[いえ]を建[た]てるように命令[めいれい]を定[さだ]めたのである。』」"
  14: "「『また、ネブカドネツァルがエルサレムの神殿[しんでん]から取[と]り出[だ]して、自分[じぶん]の神殿[しんでん]に運[はこ]んだ神[かみ]の家[いえ]の金[きん]と銀[ぎん]の器[うつわ]を、クロス王[おう]は自分[じぶん]の神殿[しんでん]から取[と]り出[だ]し、自分[じぶん]の宝物[たからもの]の管理[かんり]を任[まか]された者[もの]、ササバサルに渡[わた]した。』」"
  15: "「『そして、彼[かれ]に、すべての器[うつわ]を取[と]って行[い]き、エルサレムにある家[いえ]の、それぞれの場所[ばしょ]に置[お]くように言[い]った。』」"
  16: "「『そこで、あのササバサルが来[き]て、エルサレムにある神[かみ]の家[いえ]の基[もとい]を据[す]えた。そして、そのときから今[いま]に至[いた]るまで建[た]てられているが、まだ完成[かんせい]していない。』」"
  17: "「『それゆえ今[いま]、もし王[おう]に良[よ]いと思[おも]われるなら、バビロンにある王[おう]の宝物庫[たからものぐら]を調[しら]べさせてほしい。クロス王[おう]から、エルサレムにあるこの神[かみ]の家[いえ]を建[た]てるよう命令[めいれい]が定[さだ]められたかどうかを、確[たし]かめてほしい。そして、王[おう]がこのことについてお決[き]めになったことを、わたしたちにお送[おく]りいただきたい。』」"

notes:
  1: "ἐπροφήτευσεν Αγγαιος ὁ προφήτης — пророчествовал Аггей пророк. Ζαχαριας ὁ τοῦ Αδδω — Захария, сын Адды (Аддо; слав. «аддов»). προφητείαν ἐπὶ τοὺς Ιουδαίους — пророчество на иудеев (ἐπί + acc.). ἐν ὀνόματι θεοῦ Ισραηλ — именем Бога Израилева. ἐπ᾿ αὐτούς — «на них», повтор в конце."
  2: "ἀνέστησαν — встали (в слав. двойственное «востаста»). ἤρξαντο οἰκοδομῆσαι — начали строить. οἱ προφῆται τοῦ θεοῦ βοηθοῦντες αὐτοῖς — пророки Божии, помогавшие им (βοηθέω)."
  3: "Θανθαναι ὁ ἔπαρχος πέραν τοῦ ποταμοῦ — Танфанай, начальник за рекой (ἔπαρχος, 知事; слав. «фафанай»). Σαθαρβουζανα — Сафарбузана (слав. «сафарвузанай»). Τίς ἔθηκεν ὑμῖν γνώμην — кто дал вам разрешение (γνώμη). χορηγίαν ταύτην καταρτίσασθαι — привести в порядок это снабжение, устроение (χορηγία); слав. «стены сия» следует евр. אשפא, в тексте 城壁."
  4: "Τίνα ἐστὶν τὰ ὀνόματα — каковы имена. τῶν οἰκοδομούντων τὴν πόλιν — строящих город. В LXX и слав. это вопрос; ru и МТ: «тогда мы сказали им имена» — иное членение."
  5: "οἱ ὀφθαλμοὶ τοῦ θεοῦ ἐπὶ τὴν αἰχμαλωσίαν Ιουδα — очи Божии на пленение Иуды. οὐ κατήργησαν — не остановили (καταργέω). ἕως γνώμη τῷ Δαρείῳ ἀπηνέχθη — пока решение не было отнесено Дарию (ἀποφέρω). ἀπεστάλη τῷ φορολόγῳ — было послано сборщику, писцу (φορολόγος)."
  6: "διασάφησις ἐπιστολῆς — изъяснение, список письма (διασάφησις). ἧς ἀπέστειλεν Θανθαναι — которое послал Танфанай. Αφαρσαχαῖοι οἱ ἐν τῷ πέραν — афарсахеи, что за рекой."
  7: "ῥῆσιν ἀπέστειλαν — «слово» послали (ῥῆσις). τάδε γέγραπται ἐν αὐτῷ — так написано в нём. Δαρείῳ τῷ βασιλεῖ εἰρήνη πᾶσα — Дарию царю всякий мир (обычное приветствие)."
  8: "ἐπορεύθημεν εἰς τὴν Ιουδαίαν χώραν — мы пошли в Иудейскую область. οἶκος τοῦ θεοῦ τοῦ μεγάλου — дом Бога великого. λίθοις ἐκλεκτοῖς — камнями избранными. ξύλα ἐντίθεται ἐν τοῖς τοίχοις — дерево вкладывается в стены. ἐπιδέξιον — искусно, успешно (ἐπιδέξιος). εὐοδοῦται — благопоспешается (εὐοδόω)."
  9: "ἠρωτήσαμεν τοὺς πρεσβυτέρους — спросили старцев. οὕτως εἴπαμεν — так сказали. Повтор вопроса 5:3; в письме это вложенная речь (『…』)."
  10: "τὰ ὀνόματα αὐτῶν ἠρωτήσαμεν — спросили имена их. γνωρίσαι σοι — чтобы известить тебе. τῶν ἀρχόντων αὐτῶν — начальствующих у них."
  11: "ῥῆμα ἀπεκρίθησαν — ответили слово. δοῦλοι τοῦ θεοῦ τοῦ οὐρανοῦ καὶ τῆς γῆς — рабы Бога неба и земли. ἦν ᾠκοδομημένος πρὸ τούτου ἔτη πολλά — был построен прежде сего за много лет. κατηρτίσατο αὐτόν — устроил, совершил его (καταρτίζω); слав. «и соверши его им»."
  12: "ἀφ᾿ ὅτε δὲ παρώργισαν — с тех пор как прогневали (παροργίζω). ἔδωκεν αὐτοὺς εἰς χεῖρας — предал их в руки. τοῦ Χαλδαίου — Халдеянина. κατέλυσεν — разрушил (καταλύω). ἀπῴκισεν — переселил (ἀποικίζω)."
  13: "ἐν ἔτει πρώτῳ Κύρου — в первый год Кира. ἔθετο γνώμην — положил решение (γνώμη). οἰκοδομηθῆναι — быть построенным. Слав. добавляет «кир царь вавилонский» — в тексте バビロンの王クロス."
  14: "τὰ σκεύη … τὰ χρυσᾶ καὶ τὰ ἀργυρᾶ — сосуды золотые и серебряные. ἐξήνεγκεν ἀπὸ οἴκου τοῦ ἐν Ιερουσαλημ — вынес из дома, что в Иерусалиме. εἰς ναὸν τοῦ βασιλέως — в храм царя (ναός, 神殿). θησαυροφύλαξ ὁ ἐπὶ τοῦ θησαυροῦ — хранитель сокровищ (θησαυροφύλαξ)."
  15: "Πάντα τὰ σκεύη λαβὲ καὶ πορεύου — возьми все сосуды и иди. θὲς αὐτὰ ἐν τῷ οἴκῳ … εἰς τὸν ἑαυτῶν τόπον — поставь их в доме … на своё место. Прямая речь Кира передана косвенно, чтобы не вводить третью ступень кавычек."
  16: "ἔδωκεν θεμελίους — положил основания (θεμέλιος). ἀπὸ τότε ἕως τοῦ νῦν — с тех пор доныне. ᾠκοδομήθη καὶ οὐκ ἐτελέσθη — строился и не был завершён (τελέω)."
  17: "εἰ ἐπὶ τὸν βασιλέα ἀγαθόν — если царю благоугодно. ἐπισκεπήτω ἐν οἴκῳ τῆς γάζης — пусть посмотрят в доме сокровищницы (γάζα). ὅπως γνῷς — чтобы ты узнал. γνοὺς … πεμψάτω πρὸς ἡμᾶς — узнав, пусть пошлёт к нам."
