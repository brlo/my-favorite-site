verses:
  1: "裁[さば]き人[びと]が裁いていたころ、その地[ち]に飢[き]饉[きん]が起こった。そこで、一人[ひとり]の男[おとこ]が、ユダのベツレヘムから、モアブの野[の]に寄留[きりゅう]するために、自分[じぶん]と妻[つま]と息子[むすこ]たちとともに出[で]て行[い]った。"
  2: "その男[おとこ]の名[な]はエリメレク、妻[つま]の名はナオミ、二人[ふたり]の息子[むすこ]の名はマフロンとキルヨンであった。彼[かれ]らはユダのベツレヘムから出[で]たエフラタ人[じん]で、モアブの野[の]に来[き]て、そこにいた。"
  3: "エリメレク、ナオミの夫[おっと]は死[し]に、彼女[かのじょ]は二人[ふたり]の息子[むすこ]とともに残[のこ]された。"
  4: "彼[かれ]らは自分[じぶん]たちのためにモアブの女[おんな]たちを妻[つま]に迎[むか]えた。一人[ひとり]の名[な]はオルパ、もう一人の名はルツであった。彼らはそこに十[じゅう]年[ねん]ほど住[す]んだ。"
  5: "そして、マフロンとキルヨンも二人[ふたり]とも死[し]んだ。こうして女[おんな]は、夫[おっと]と二人[ふたり]の息子[むすこ]を失[うしな]って、ひとり残[のこ]された。"
  6: "そこで彼女[かのじょ]は二人[ふたり]の嫁[よめ]とともに立[た]ち上[あ]がり、モアブの野[の]から帰[かえ]った。モアブの野[の]で、主[しゅ]がご自分[じぶん]の民[たみ]を訪[おとず]れて、パンを与[あた]えられたと聞[き]いたからである。"
  7: "彼女[かのじょ]はそこにいた場所[ばしょ]を出[で]た。二人[ふたり]の嫁[よめ]も彼女とともにいた。二人[ふたり]はユダの地[ち]へ帰[かえ]ろうと、道[みち]を歩[ある]いていた。"
  8: "ナオミは二人[ふたり]の嫁[よめ]に言[い]った。「さあ、それぞれ母[はは]の家[いえ]へ帰[かえ]りなさい。主[しゅ]が、あなたがたが死[し]んだ者[もの]たちとわたしにしたように、あなたがたに恵[めぐ]みをしてくださるように。"
  9: "主[しゅ]があなたがたに、それぞれ夫[おっと]の家[いえ]で安[やす]らぎを見[み]いださせるように。」そして彼女[かのじょ]は二人[ふたり]に口[くち]づけをし、彼らは声[こえ]を上[あ]げて泣[な]いた。"
  10: "二人[ふたり]は彼女[かのじょ]に言[い]った。「あなたとともに、あなたの民[たみ]のところへ帰[かえ]る。」"
  11: "ナオミは言[い]った。「娘[むすめ]たちよ、帰[かえ]りなさい。なぜわたしとともに来[く]るのか。わたしの腹[はら]のうちに、まだあなたがたの夫[おっと]となる息子[むすこ]がいるというのか。"
  12: "娘[むすめ]たちよ、帰[かえ]りなさい。わたしはもう年[とし]を取[と]って、夫[おっと]を持つ身ではないからだ。たとえわたしが『まだ望[のぞ]みはある』と言[い]い、その夜[よる]にでも夫を持ち、息子[むすこ]たちを産[う]んだとしても、"
  13: "彼[かれ]らが成人[せいじん]するまで、あなたがたは待[ま]つというのか。彼らのために、あなたがたは夫[おっと]を持[も]たずにいるというのか。娘[むすめ]たちよ、そうではない。わたしはあなたがたよりも、もっと苦[くる]しい。主[しゅ]の手[て]がわたしに及[およ]んだからだ。」"
  14: "二人[ふたり]はまた声[こえ]を上[あ]げて泣[な]いた。オルパはしゅうとめに口[くち]づけをして、自分[じぶん]の民[たみ]のところへ帰[かえ]った。しかし、ルツは彼女[かのじょ]につき従[したが]った。"
  15: "ナオミはルツに言[い]った。「見[み]なさい。あなたの義理[ぎり]の姉妹[しまい]は、自分の民[たみ]と自分の神々[かみがみ]のもとへ帰[かえ]って行[い]った。あなたも、その後[あと]を追[お]って帰りなさい。」"
  16: "ルツは言[い]った。「どうか、わたしにあなたを捨[す]てて、あなたのもとを去[さ]ることを求[もと]めないでほしい。あなたが行[い]く所[ところ]へ、わたしも行く。あなたが泊[と]まる所に、わたしも泊まる。あなたの民[たみ]はわたしの民、あなたの神[かみ]はわたしの神。"
  17: "あなたが死[し]ぬ所で、わたしも死に、そこに葬[ほうむ]られるように。主[しゅ]がわたしにそうしてくださり、さらにそれに加[くわ]えてくださるように。死[し]だけが、わたしとあなたを分[わ]けるのだ。」"
  18: "ナオミは、彼女[かのじょ]が自分[じぶん]とともに行[い]こうと固[かた]く決[き]めているのを見[み]て、それ以上[いじょう]語[かた]りかけるのをやめた。"
  19: "二人[ふたり]はベツレヘムに着[つ]くまで歩[ある]き続[つづ]けた。彼らがベツレヘムに着くと、町[まち]中[じゅう]が二人のことで騒[さわ]ぎ立[た]ち、こう言[い]った。「これはナオミではないか。」"
  20: "彼女[かのじょ]は女[おんな]たちに言[い]った。「わたしをナオミと呼[よ]ぶのはやめて、マラと呼んでほしい。全能者[ぜんのうしゃ]がわたしをひどく苦[くる]しくされたからだ。"
  21: "わたしは満[み]ちて出[で]て行[い]ったのに、主[しゅ]はわたしを空[から]にして帰[かえ]された。なぜわたしをナオミと呼ぶのか。主がわたしを低[ひく]くされ、全能者[ぜんのうしゃ]がわたしを苦[くる]しめられたのだ。」"
  22: "こうしてナオミは、嫁[よめ]であるモアブの女[おんな]ルツとともに、モアブの野[の]から帰[かえ]って来[き]た。二人[ふたり]がベツレヘムに着[つ]いたのは、大麦[おおむぎ]の刈[か]り入[い]れの始[はじ]めのころであった。"

notes:
  1: "ἐν τῷ κρίνειν τοὺς κριτάς — «когда судили судьи» (ἐν τῷ + inf.). λιμός — голод. ἀγρὸς Μωαβ — モアブの野 (слав. «село моавле»). παροικῆσαι — пожить пришельцем (παροικέω), отсюда 寄留."
  2: "В LXX муж назван Αβιμελεχ (Авимелех), а в csl — Елимелех; держимся церковного чтения: エリメレク (так же в 2:1; 4:3,9). Εφραθαῖοι — ефрафяне, жители Ефрафы (Вифлеема). καὶ ἦσαν ἐκεῖ — и были там."
  3: "κατελείφθη — «была оставлена» (καταλείπω, pass.); подлежащее — она вместе с сыновьями, поэтому 残された."
  4: "ἐλάβοσαν ἑαυτοῖς γυναῖκας Μωαβίτιδας — взяли себе жён моавитянок. κατῴκησαν … ὡς δέκα ἔτη — жили там около десяти лет."
  5: "καί γε ἀμφότεροι — «и оба они». κατελείφθη ἡ γυνὴ ἀπὸ τοῦ ἀνδρὸς … καὶ ἀπὸ τῶν δύο υἱῶν — осталась без мужа и без двух сыновей (ἀπό — отделение, утрата)."
  6: "ἀνέστη — встала. ἐπέσκεπται κύριος τὸν λαὸν αὐτοῦ — Господь посетил народ Свой (ἐπισκέπτομαι); δοῦναι αὐτοῖς ἄρτους — дать им хлебы."
  7: "ἐξῆλθεν ἐκ τοῦ τόπου, οὗ ἦν ἐκεῖ — вышла из места, где была. ἐπορεύοντο ἐν τῇ ὁδῷ τοῦ ἐπιστρέψαι — шли по дороге, чтобы возвратиться."
  8: "εἰς οἶκον μητρὸς αὐτῆς — в дом матери её; в csl «в дом отца своего» (иное чтение), держимся греческого. ποιήσαι κύριος μεθ᾿ ὑμῶν ἔλεος — да сотворит Господь с вами милость (optative)."
  9: "δῴη κύριος — да даст Господь (optative). ἀνάπαυσις — покой, пристанище. κατεφίλησεν — поцеловала (прощальный поцелуй). ἐπῆραν τὴν φωνὴν αὐτῶν — подняли голос свой."
  10: "Μετὰ σοῦ ἐπιστρέφομεν — «с тобою возвращаемся». В csl добавлено «ни», в греческом его нет — не переводим."
  11: "ἵνα τί πορεύεσθε μετ᾿ ἐμοῦ — зачем идёте со мною. μὴ ἔτι μοι υἱοὶ ἐν τῇ κοιλίᾳ — разве ещё есть у меня сыновья во чреве. ἔσονται ὑμῖν εἰς ἄνδρας — и будут вам мужьями."
  12: "γεγήρακα τοῦ μὴ εἶναι ἀνδρί — состарилась, так что не быть за мужем. ὑπόστασις — надежда, основание. Стих обрывается: продолжение в 13."
  13: "προσδέξεσθε — будете ждать (προσδέχομαι). κατασχεθήσεσθε — удержитесь. ἐπικράνθη μοι ὑπὲρ ὑμᾶς — горько мне более вас. ἐξῆλθεν ἐν ἐμοὶ χεὶρ κυρίου — рука Господня вышла на меня."
  14: "ἔκλαυσαν ἔτι — плакали ещё. κατεφίλησεν τὴν πενθεράν — поцеловала свекровь. ἠκολούθησεν — последовала."
  15: "σύννυμφος — жена брата мужа («ятровь» в csl); по-японски передано 義理の姉妹. πρὸς τοὺς θεοὺς αὐτῆς — к богам её: LXX прямо говорит о богах Моава."
  16: "Μὴ ἀπαντήσαι ἐμοὶ τοῦ καταλιπεῖν σε — «да не случится мне оставить тебя» (optative с μή). αὐλισθήσομαι — буду ночевать (αὐλίζομαι). Речь — 常体, как по всему корпусу."
  17: "τάδε ποιήσαι μοι κύριος καὶ τάδε προσθείη — так да сделает мне Господь и так да приложит (клятвенная формула). θάνατος διαστελεῖ — смерть разделит."
  18: "κραταιοῦται — укрепляется, т. е. твёрдо решилась. ἐκόπασεν τοῦ λαλῆσαι — перестала говорить (κόπτω)."
  19: "ἤχησεν πᾶσα ἡ πόλις — весь город зашумел (ἠχέω). Αὕτη ἐστὶν Νωεμιν; — «это ли Ноеминь?»"
  20: "Πικράν — «Горькая» (πικρός); передано как имя マラ, ср. ru «Марою». ὁ ἱκανός — Вседержитель (букв. «Достаточный»). ἐπικράνθη ἐν ἐμοὶ — горько стало во мне."
  21: "πλήρης — с достатком. κενήν — пустой. ἐταπείνωσέν με — смирил меня. ἐκάκωσέν με — озлобил меня."
  22: "ἐπιστρέφουσα ἐξ ἀγροῦ Μωαβ — возвращающаяся с полей Моава. ἐν ἀρχῇ θερισμοῦ κριθῶν — в начале жатвы ячменя (важно для 2:23)."
