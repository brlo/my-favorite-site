# jp-box, 1-я Царств, глава 27. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет,
# jp-ni (под авторским правом) не использовался.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 27: Давид решает уйти к филистимлянам (1); Анхус, Геф (2–4); просьба
# о сельском городе и Секелаг (5–7); набеги на гесиритян и амаликитян (8–9);
# обман Анхуса (10–11); Анхус верит Давиду (12).
# Речь персонажей — 「…」 (1 — слова в сердце, 5, 10, 11, 12); вложенная речь —
# 『…』 (11 — слова, которых Давид боялся). Красного нет.
# Нумерация по gr: 12 стихов, совпадает с csl/ru.
# Отличия от csl/ru: в ст. 2 у gr «четыреста мужей», в csl/ru «шестьсот»
# (по МТ); в ст. 7 у gr «четыре месяца», в csl/ru «год и четыре месяца» (по МТ).
# 〔…〕 нет: в gr-lxx-byz на месте каждого стиха есть текст, знака «.» нет;
# добавлений церковного чтения в текст не вносилось (расхождения — в notes).
# Сносок ⟨…⟩ нет: ペリシテ人, アマレク人, 王, しもべ уже в корпусе; セケラク,
# ガト, アンクス — имена и топонимы (Анхус и Секелаг уже в гл. 29–30).
# jp-ni не использовался.

tr_code: jp-box
book: 1ts
chapter: 27
draft: true

verses:
  1: "ダビデは心[こころ]のうちで言[い]った。「今[いま]、わたしはいつか一日[いちにち]のうちにサウルの手[て]に落[お]ちるだろう。わたしにとって良[よ]いのは、ペリシテ人[じん]の地[ち]へ逃[に]げること以外[いがい]にない。そうすればサウルは、イスラエルのすべての地境[ちざかい]でわたしを探[さが]すことをやめ、わたしは彼[かれ]の手から救[すく]われる。」"
  2: "ダビデは立[た]って、自分[じぶん]とともにいる四百人[よんひゃくにん]の者[もの]たちとともに、ガトの王[おう]、アマフの子[こ]アンクスのもとへ行[い]った。"
  3: "ダビデはアンクスとともにガトに住[す]んだ。彼[かれ]もその者[もの]たちも、それぞれ家族[かぞく]とともに住み、ダビデには二人[ふたり]の妻[つま]がいた。イズレエル人[じん]アヒノアムと、カルメル人ナバルの妻アビガイルである。"
  4: "サウルに、ダビデがガトへ逃[に]げたことが告[つ]げられると、彼[かれ]はもうダビデを探[さが]さなかった。"
  5: "ダビデはアンクスに言[い]った。「もし、しもべがあなたの目[め]に恵[めぐ]みを見[み]いだしたのなら、どうか、野[の]の町々[まちまち]の一[ひと]つに、わたしのための場所[ばしょ]を与[あた]えてください。わたしはそこに住[す]む。なぜ、しもべはあなたとともに、王[おう]の治[おさ]める町[まち]に住まねばならないのか。」"
  6: "アンクスはその日[ひ]、彼[かれ]にセケラクを与[あた]えた。それゆえ、セケラクは今日[こんにち]までユダの王[おう]のものとなっている。"
  7: "ダビデがペリシテ人[じん]の野[の]に住[す]んだ日[ひ]の数[かず]は、四[よっ]か月[げつ]であった。"
  8: "ダビデとその部下[ぶか]たちは上[のぼ]って行[い]き、ゲシル人[じん]とアマレク人を襲[おそ]った。見[み]よ、その地[ち]には、ゲラムスルの要塞[ようさい]の地からエジプトの地に至[いた]るまで、古[ふる]くから人[ひと]が住[す]んでいた。"
  9: "ダビデはその地[ち]を打[う]ち、男[おとこ]も女[おんな]も生[い]かしておかず、羊[ひつじ]の群[む]れ、牛[うし]の群れ、ろば、らくだ、衣服[いふく]を取[と]って、アンクスのもとへ帰[かえ]って来[き]た。"
  10: "アンクスはダビデに言[い]った。「今日[きょう]はどこを襲[おそ]ったのか。」ダビデはアンクスに言った。「ユダの南[みなみ]、イェスメガの南、ケネズの南だ。」"
  11: "ダビデは男[おとこ]も女[おんな]も生[い]かしておかず、だれもガトへ連[つ]れて行[い]かなかった。彼[かれ]は言[い]った。「彼らがガトでわたしたちのことを告[つ]げ、『ダビデはこうした』と言うことがないように。」ダビデがペリシテ人[じん]の野[の]に住[す]んだすべての日[ひ]、これが彼の決[き]まりであった。"
  12: "アンクスはダビデをひどく信[しん]じ、言[い]った。「彼[かれ]は自分[じぶん]の民[たみ]、イスラエルの中でひどく恥[は]ずかしめられた。だから、彼はいつまでもわたしのしもべとなるだろう。」"
notes:
  1: "εἶπεν ἐν τῇ καρδίᾳ αὐτοῦ — сказал в сердце своём (внутренняя речь дана в 「…」, как и в 1ts 24:7). προστεθήσομαι εἰς χεῖρας Σαουλ — «буду причтён (к павшим) в руки Саула», т. е. погибну (προστίθημι). οὐκ ἔστιν μοι ἀγαθόν — «нет мне добра». ἀνῇ Σαουλ τοῦ ζητεῖν — «отстанет Саул искать» (ἀνίημι). εἰς πᾶν ὅριον — «во всякий предел»."
  2: "οἱ τετρακόσιοι ἄνδρες — 400 мужей; в csl и ru «шестьсот» — по МТ (в 1ts 30:9 у Давида снова 600). Αγχους υἱὸν Αμμαχ — Анхус, сын Аммаха (в ru «Маоха» — по МТ). βασιλέα Γεθ — царь Гефский (ガト, как в гл. 21 и 29)."
  3: "ἕκαστος καὶ ὁ οἶκος αὐτοῦ — «каждый и дом его», т. е. с семейством. Αχινααμ ἡ Ιεζραηλῖτις — Ахиноам Изреелитянка (イズレエル人, как в 30:5). Αβιγαια ἡ γυνὴ Ναβαλ τοῦ Καρμηλίου — Авигаила, жена Навала Кармилитянина (カルメル人, как в 30:5)."
  4: "ἀνηγγέλη τῷ Σαουλ — «возвещено было Саулу» (ἀναγγέλλω). οὐ προσέθετο ἔτι ζητεῖν — «не приложил более искать» (προστίθημι)."
  5: "Εἰ δὴ εὕρηκεν ὁ δοῦλός σου χάριν ἐν ὀφθαλμοῖς σου — «если же обрёл раб твой благодать в глазах твоих». τόπον ἐν μιᾷ τῶν πόλεων τῶν κατ᾽ ἀγρόν — «место в одном из городов сельских» (κατ᾽ ἀγρόν). καθήσομαι — «сяду», поселюсь. ἐν πόλει βασιλευομένῃ — «в городе, царски управляемом» (βασιλεύω); в ru «в царском городе»."
  6: "Σεκελακ — Секелаг (в тексте セケラク, как в гл. 30; в 1ts 27:6 LXX передаёт Σεκελακ). τῷ βασιλεῖ τῆς Ιουδαίας — «царю Иудеи» (в ru «за царями Иудейскими» — множественное). ἕως τῆς ἡμέρας ταύτης — «до сего дня»."
  7: "ὁ ἀριθμὸς τῶν ἡμερῶν — число дней. ἐν ἀγρῷ τῶν ἀλλοφύλων — «в поле филистимлян», т. е. в их стране. τέσσαρας μῆνας — четыре месяца; в csl и ru «год и четыре месяца» — по МТ."
  8: "ἀνέβαινεν — восходил (ἀναβαίνω), т. е. ходил в набеги. ἐπετίθεντο — нападали (ἐπιτίθημι). τὸν Γεσιρι — гесиритян (Γεσιρι; в ru «Гессурян и Гирзеян» — по МТ). τὸν Αμαληκίτην — амаликитянина (в тексте アマレク人). ἀπὸ ἀνηκόντων — тёмное место (возможно, «от пришедших, обитавших»); Γελαμψουρ — Геламсур (слав. «ламсур»). τετειχισμένων — «укреплённых» (τειχίζω)."
  9: "ἔτυπτε τὴν γῆν — поражал землю (τύπτω). οὐκ ἐζωογόνει — не оставлял живым (ζωογονέω). ποίμνια καὶ βουκόλια — стада мелкого и крупного скота (βουκόλιον). ἱματισμός — одежда. ἀνέστρεψαν — возвратились (ἀναστρέφω)."
  10: "Ἐπὶ τίνα ἐπέθεσθε — «на кого напали» (ἐπιτίθημι). κατὰ νότον — «к югу» (νότος). Ιεσμεγα — Иесмега (в ru «Иерахмеел» — по МТ). τοῦ Κενεζι — «Кенези» (в ru «Кенеи»)."
  11: "τοῦ εἰσαγαγεῖν εἰς Γεθ — «чтобы не привести в Геф». Μὴ ἀναγγείλωσιν — «как бы не возвестили» (Μή + conjunctivus aoristi). δικαίωμα — «устав, обычай» (в ru «образ действий»). ἐκάθητο — жил (κάθημαι, имперфект)."
  12: "ἐπιστεύθη Δαυιδ ἐν τῷ Αγχους — «Давид был доверен (ему поверили) у Анхуса» (πιστεύω, страдат.). ᾔσχυνται αἰσχυνόμενος — усилительная конструкция «опозорился позором» (αἰσχύνω; слав. «омерзением омерзе»). εἰς τὸν αἰῶνα — «навек»."
