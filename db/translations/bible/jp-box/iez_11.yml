# jp-box, Иезекииль, глава 11. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 11 (совпадает).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Глава 11: 1–13 видение у восточных ворот: двадцать пять мужей, приговор советникам
# («этот город — котёл, мы — мясо»), смерть Фалтии; 14–21 слово утешения: Господь —
# малое святилище в рассеянии, соберёт из народов, даст иное сердце и новый дух;
# 22–25 слава уходит на гору к востоку, дух возвращает пророка к переселенцам.
# Голоса: 11:2–4 и 5–12 — 「…» (речь Господа, дважды вводимая; в 3 слова мужей — 『…』);
# 11:13 — 「…」 (молитва пророка); 11:15–21 — 「…」 (речь Господа; в 15 слова
# жителей Иерусалима — 『…』). Вводные формулы — вне кавычек.
# csl-добавления: 11:12 (обвинение в неисполнении заповедей — нет в LXX),
# 11:23 («на восток» — нет в LXX). Слав. «на горах израилевых» (11:10, 11)
# при LXX «на пределах» — в тексте слав. чтение, вариант LXX в notes.

