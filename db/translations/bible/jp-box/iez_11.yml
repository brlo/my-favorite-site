verses:
  1: "霊[れい]がわたしを取[と]り上[あ]げ、主[しゅ]の家[いえ]の東[ひがし]を向[む]く向[む]かいの門[もん]へ連[つ]れて行[い]った。見[み]よ、門[もん]の入口[いりぐち]に二十五人[にじゅうごにん]ほどの者[もの]がいた。わたしはその中[なか]に、民[たみ]を導[みちび]く者[もの]であるエゼルの子[こ]イエゾニアと、バナイオスの子[こ]ファルティアスを見[み]た。"
  2: "主[しゅ]はわたしに言[い]われた。「人[ひと]の子[こ]よ、この者[もの]たちはこの都[みやこ]で空[むな]しいことを図[はか]り、悪[わる]い計[はか]りごとをめぐらす者[もの]たちである。"
  3: "彼[かれ]らは言[い]う。『家々[いえいえ]はまだ新[あたら]しく建[た]てられたばかりではないか。この都[みやこ]は鍋[なべ]であり、わたしたちは肉[にく]である』と。"
  4: "それゆえ、人[ひと]の子[こ]よ、彼[かれ]らに対[たい]して預言[よげん]せよ。預言[よげん]せよ。」"
  5: "そのとき、主[しゅ]の霊[れい]がわたしの上[うえ]に降[くだ]り、わたしに言[い]った。「言[い]え。主[しゅ]はこう言[い]われる。イスラエルの家[いえ]よ、あなたがたはこう言[い]った。あなたがたの霊[れい]の企[たくら]みを、わたしは知[し]っている。"
  6: "あなたがたはこの都[みやこ]で、自分[じぶん]たちの死[し]んだ者[もの]を多[おお]くし、その通[とお]りを殺[ころ]された者[もの]で満[み]たした。"
  7: "それゆえ、主[しゅ]なる神[かみ]はこう言[い]われる。あなたがたがこの都[みやこ]のただ中[なか]で打[う]ち殺[ころ]した者[もの]たち、それが肉[にく]であり、この都[みやこ]が鍋[なべ]である。しかし、わたしはあなたがたをそのただ中[なか]から連[つ]れ出[だ]す。"
  8: "あなたがたは剣[つるぎ]を恐[おそ]れている。わたしはあなたがたの上[うえ]に剣[つるぎ]を臨[のぞ]ませる、と主[しゅ]は言[い]われる。"
  9: "わたしはあなたがたをそのただ中[なか]から連[つ]れ出[だ]し、他国人[たこくじん]の手[て]に渡[わた]し、あなたがたの間[あいだ]で裁[さば]きを行[おこな]う。"
  10: "あなたがたは剣[つるぎ]によって倒[たお]れる。わたしはイスラエルの山々[やまやま]であなたがたを裁[さば]く。あなたがたは、わたしが主[しゅ]であることを知[し]る。"
  11: "この都[みやこ]はあなたがたの鍋[なべ]にはならない。あなたがたもその中[なか]で肉[にく]にはならない。わたしはイスラエルの山々[やまやま]であなたがたを裁[さば]く。"
  12: "あなたがたは、わたしが主[しゅ]であることを知[し]る。あなたがたはわたしの掟[おきて]に歩[あゆ]まず、わたしの定[さだ]めを行[おこな]わず、あなたがたの周[まわ]りにいる異邦人[いほうじん]の習[なら]わしに従[したが]って行[い]ったからである。」"
  13: "わたしが預言[よげん]しているとき、バナイオスの子[こ]ファルティアスが死[し]んだ。わたしはひれ伏[ふ]して、大[おお]きな声[こえ]で叫[さけ]び、言[い]った。「ああ、主[しゅ]なる神[かみ]よ。あなたはイスラエルの残[のこ]りの者[もの]を全[まった]く滅[ほろ]ぼし尽[つ]くされるのですか。」"
  14: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  15: "「人[ひと]の子[こ]よ、あなたの兄弟[きょうだい]たち、あなたの捕囚[ほしゅう]の仲間[なかま]たち、イスラエルの全[ぜん]家[か]は終[お]わった。エルサレムに住[す]む者[もの]たちは彼[かれ]らに、『あなたがたは主[しゅ]から遠[とお]く離[はな]れている。この地[ち]はわたしたちに嗣業[しぎょう]として与[あた]えられた』と言[い]った。"
  16: "それゆえ、言[い]え。主[しゅ]はこう言[い]われる。わたしは彼[かれ]らを異邦人[いほうじん]の間[あいだ]へ追[お]いやり、国々[くにぐに]に散[ち]らしたが、彼[かれ]らが行[い]くその国々[くにぐに]で、わたしは彼[かれ]らにとって小[ちい]さな聖所[せいしょ]となる。"
  17: "それゆえ、言[い]え。主[しゅ]はこう言[い]われる。わたしは彼[かれ]らを諸国民[しょこくみん]の間[あいだ]から受[う]け入[い]れ、彼[かれ]らを散[ち]らした国々[くにぐに]から集[あつ]め、イスラエルの地[ち]を彼[かれ]らに与[あた]える。"
  18: "彼[かれ]らはそこへ行[い]き、都[みやこ]からすべての忌[い]まわしいものと、すべての不法[ふほう]を除[のぞ]き去[さ]る。"
  19: "わたしは彼[かれ]らに別[べつ]の心[こころ]を与[あた]え、彼[かれ]らの内[うち]に新[あたら]しい霊[れい]を与[あた]える。わたしは彼[かれ]らの肉[にく]から石[いし]の心[こころ]を取[と]り除[のぞ]き、彼[かれ]らに肉[にく]の心[こころ]を与[あた]える。"
  20: "彼[かれ]らがわたしの掟[おきて]に歩[あゆ]み、わたしの定[さだ]めを守[まも]って行[おこな]うためである。彼[かれ]らはわたしの民[たみ]となり、わたしは彼[かれ]らの神[かみ]となる。"
  21: "しかし、その心[こころ]が忌[い]まわしいものと不法[ふほう]へと向[む]かって歩[あゆ]む者[もの]たちには、わたしはその道[みち]を彼[かれ]らの頭[あたま]に返[かえ]す、と主[しゅ]なる神[かみ]は言[い]われる。」"
  22: "ケルビムはその翼[つばさ]を上[あ]げ、車輪[しゃりん]は彼[かれ]らのそばにあり、イスラエルの神[かみ]の栄光[えいこう]は彼[かれ]らの上[うえ]にあった。"
  23: "主[しゅ]の栄光[えいこう]は都[みやこ]の中[なか]から上[のぼ]って、都[みやこ]の東[ひがし]、都[みやこ]に向[む]かい合[あ]う山[やま]の上[うえ]に立[た]ち止[ど]まった。"
  24: "霊[れい]がわたしを取[と]り上[あ]げ、神[かみ]の霊[れい]による幻[まぼろし]のうちに、わたしをカルデアの地[ち]の捕囚[ほしゅう]のところへ連[つ]れて行[い]った。わたしは見[み]た幻[まぼろし]から離[はな]れた。"
  25: "わたしは捕囚[ほしゅう]の者[もの]たちに、主[しゅ]がわたしに示[しめ]されたすべての言葉[ことば]を語[かた]った。"

notes:
  1: "ἀνέλαβέν με πνεῦμα — «поднял меня дух»; πύλην τοῦ οἴκου κυρίου τὴν κατέναντι τὴν βλέπουσαν κατὰ ἀνατολάς — «ворота дома Господня, противоположные, смотрящие на восток»; ἐπὶ τῶν προθύρων — «у притворов (входа)»; Ιεζονιας ὁ τοῦ Εζερ — イエゾニア, сын Эзера (в слав. «Иехония сын Иазеров» — иное имя, в тексте по LXX); Φαλτιας ὁ τοῦ Βαναιου — ファルティアス, сын Баная (バナイオス); ἀφηγούμενοι τοῦ λαοῦ — «вожди народа»."
  2: "οἱ λογιζόμενοι μάταια — «замышляющие пустое» (λογίζομαι); βουλευόμενοι βουλὴν πονηράν — «советующие злой совет» (cognatus accusativus). Начало речи Господа; в ст. 4 она закрывается, в ст. 5 начинается снова (новое «и сказал мне»)."
  3: "οὐχὶ προσφάτως ᾠκοδόμηνται αἱ οἰκίαι — «не недавно ли построены дома?» (προσφάτως — недавно); ὁ λέβης — «котёл»; τὰ κρέα — «мясо». Слова мужей — вложенная цитата 『…』."
  4: "προφήτευσον ἐπ᾽ αὐτούς — «пророчествуй на них» (ἐπί с винитивом — против); повтор повеления сохранён."
  5: "ἔπεσεν ἐπ᾽ ἐμὲ πνεῦμα κυρίου — «пал на меня Дух Господень»; τὰ διαβούλια τοῦ πνεύματος ὑμῶν — «помышления духа вашего» (διαβούλιον — замысел); ἐγὼ ἐπίσταμαι — «Я знаю»."
  6: "ἐπληθύνατε νεκροὺς ὑμῶν — «умножили мёртвых ваших»; ἐνεπλήσατε τὰς ὁδοὺς αὐτῆς τραυματιῶν — «наполнили улицы её ранеными (убитыми)» (τραυματίας)."
  7: "Τοὺς νεκροὺς ὑμῶν οὓς ἐπατάξατε — «мёртвых ваших, которых вы поразили»; οὗτοί εἰσιν τὰ κρέα, αὐτὴ δὲ ὁ λέβης — «они мясо, а она котёл»: образ из ст. 3 перевёрнут; ἐξάξω ἐκ μέσου αὐτῆς — «выведу из среды её»."
  8: "ῥομφαίαν φοβεῖσθε, καὶ ῥομφαίαν ἐπάξω — «меча боитесь, и меч наведу»: игра слов сохранена; λέγει κύριος — «говорит Господь» внутри речи."
  9: "εἰς χεῖρας ἀλλοτρίων — «в руки чужих» (ἀλλότριος); ποιήσω ἐν ὑμῖν κρίματα — «произведу над вами суды»."
  10: "ἐν ῥομφαίᾳ πεσεῖσθε — «от меча падёте»; ἐπὶ τῶν ὁρίων τοῦ Ισραήλ — «на пределах Израиля»: в слав. «на горах израилевых», принято слав. чтение 山々, вариант LXX — «пределы»; κρινῶ ὑμᾶς — «буду судить вас»."
  11: "αὐτὴ ὑμῖν οὐκ ἔσται εἰς λέβητα — «она не будет вам в котёл»; οὐ μὴ γένησθε ... εἰς κρέα — «не будете в ней мясом»; повтор «на горах израилевых» (слав.) — см. note 10."
  12: "καὶ ἐπιγνώσεσθε διότι ἐγὼ κύριος — «и узнаете, что Я Господь»: в gr-lxx-byz стих на этом кончается; слав. (и MT) добавляет «ибо по заповедям Моим не ходили и судов Моих не творили, но по обычаям народов...» — нет в LXX, внесено в текст без 〔…〕; здесь закрывается речь Господа."
  13: "ἐν τῷ προφητεύειν με — «когда я пророчествовал»; Φαλτιας ... ἀπέθανεν — «Фалтия умер»; πίπτω ἐπὶ πρόσωπόν μου — «падаю на лицо моё» (историческое настоящее); Οἴμμοι οἴμμοι — «увы, увы» (двойное восклицание); εἰς συντέλειαν σὺ ποιεῖς τοὺς καταλοίπους — «неужели Ты до конца истребляешь остаток?». Слова пророка — отдельная 「…」."
  14: "Вводная формула вне кавычек; начинается новое слово Господа (15–21)."
  15: "οἱ ἀδελφοί σου καὶ οἱ ἄνδρες τῆς αἰχμαλωσίας σου — «братья твои и мужи плена твоего»; συντετέλεσται — «скончался (погиб)», слав. «скончася»; οἷς εἶπαν ... οἱ κατοικοῦντες Ιερουσαλημ — «которым сказали живущие в Иерусалиме»; Μακρὰν ἀπέχετε ἀπὸ τοῦ κυρίου — «далеко отстоите от Господа»; ἡμῖν δέδοται ἡ γῆ εἰς κληρονομίαν — «нам дана земля в наследие»: слова жителей Иерусалима — 『…』."
  16: "Ἀπώσομαι αὐτοὺς εἰς τὰ ἔθνη — «отрину их к народам»; ἔσομαι αὐτοῖς εἰς ἁγίασμα μικρόν — «буду им в малое святилище (освящение)» (ἁγίασμα — святыня): образ малого святилища в рассеянии."
  17: "εἰσδέξομαι αὐτοὺς ἐκ τῶν ἐθνῶν — «приму их от народов»; συνάξω ... οὗ διέσπειρα — «соберу... где рассеял»; δώσω αὐτοῖς τὴν γῆν τοῦ Ισραηλ — «дам им землю Израиля»."
  18: "ἐξαροῦσιν πάντα τὰ βδελύγματα αὐτῆς — «извергнут все мерзости её» (αἴρω — убирать, изымать); τὰς ἀνομίας — «беззакония»."
  19: "καρδίαν ἑτέραν — «сердце иное» (слав. «сердце ино»; в ru/MT «сердце единое» — иное чтение, не внесено); πνεῦμα καινόν — «дух новый»; ἐκσπάσω τὴν καρδίαν τὴν λιθίνην — «исторгну сердце каменное» (ἐκσπάω — вырывать); καρδίαν σαρκίνην — «сердце плотяное»."
  20: "ὅπως ... πορεύωνται — «чтобы ходили» (цель); προστάγματα — «повеления» (掟); δικαιώματα — «уставы, оправдания» (定め); ἔσονταί μοι εἰς λαόν ... εἰς θεόν — формула завета."
  21: "εἰς τὴν καρδίαν τῶν βδελυγμάτων ... ὡς ἡ καρδία αὐτῶν ἐπορεύετο — «по сердцу мерзостей их... как сердце их ходило»: тёмное место, передано «чьё сердце идёт за мерзостями»; τὰς ὁδοὺς αὐτῶν εἰς κεφαλὰς αὐτῶν δέδωκα — «пути их на головы их дал» (воздаяние); здесь закрывается речь Господа."
  22: "ἐξῆραν τὰ χερουβιν τὰς πτέρυγας — «подняли херувимы крылья»; οἱ τροχοὶ ἐχόμενοι αὐτῶν — «колёса, держащиеся их (рядом)»; ἡ δόξα θεοῦ Ισραηλ ἐπ᾽ αὐτὰ ὑπεράνω αὐτῶν — «слава Бога Израилева над ними»."
  23: "ἀνέβη ἡ δόξα κυρίου ἐκ μέσης τῆς πόλεως — «поднялась слава Господня из среды города»; ἔστη ἐπὶ τοῦ ὄρους — «стала на горе»; ὃ ἦν ἀπέναντι τῆς πόλεως — «которая напротив города»: слав. добавляет «на восток» — нет в LXX, внесено."
  24: "ἀνέλαβέν με πνεῦμα — «взял меня дух»; εἰς γῆν Χαλδαίων εἰς τὴν αἰχμαλωσίαν — «в землю Халдеев, к плену (переселенцам)»; ἐν ὁράσει ἐν πνεύματι θεοῦ — «в видении, в Духе Божием»; ἀνέβην ἀπὸ τῆς ὁράσεως — «я поднялся от видения», т. е. видение окончилось."
  25: "τοὺς λόγους τοῦ κυρίου, οὓς ἔδειξέν μοι — «слова Господни, которые показал мне» (δείκνυμι); ἐλάλησα πρὸς τὴν αἰχμαλωσίαν — «говорил к плену (переселенцам)»."
