# 28:26 — τῶν νέων, «день нового (новин)», отсюда 初穂の日 (в масоретском тексте —
# «день первых плодов»); 28:7 — σίκερα, «сикер» (крепкий напиток), в ru «вино»;
# 28:23 — в греч. нет глагола «сотворите», он восстановлен по смыслу (в csl добавлено
# «сотворите сия»).
# Сносок ⟨…⟩ нет: 過越, 種なしパン, 安息日, 初穂, 燔祭, 素祭, 贖罪祭 уже пояснены
