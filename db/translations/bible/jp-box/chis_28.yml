# jp-box, Числа, глава 28. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в этой главе нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 28: постоянное всесожжение на каждый день (1–8), субботнее (9–10),
# новомесячия (11–15), Пасха и опресноки (16–25), праздник седмиц и первые плоды (26–31).
# Вся глава — одна речь Бога Моисею: кавычка открывается во 2-м стихе и закрывается
# в конце 31-го. Красного и синего нет.
# Числа и меры по LXX: эфа (エファ), гин (ヒン), десятая часть ефы (十分の一).
# Жертвы: 燔祭 (ὁλοκαύτωμα), 素祭 (θυσία семидала), 贖罪祭 (περὶ ἁμαρτίας),
# 注ぎ物 (σπονδή); σίκερα передано 強い酒 (ср. Лев 10:9).
# 〔…〕 нет: все слова есть в gr-lxx-byz (сверено bracket_check.rb).
