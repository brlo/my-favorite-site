verses:
  1: "主[しゅ]はモーセに語[かた]って言[い]われた。"
  2: "「イスラエルの子[こ]らに命[めい]じ、彼[かれ]らに言[い]いなさい。あなたがたは、わたしの贈[おく]り物[もの]、わたしの捧[ささ]げ物[もの]、わたしへの芳[かんば]しい香[かおり]となるわたしの犠牲[ぎせい]を、わたしの祭[まつ]りのときにわたしへ献[ささ]げることを守[まも]りなさい。"
  3: "そして、彼[かれ]らに言[い]いなさい。これがあなたがたが主[しゅ]に献[ささ]げる捧[ささ]げ物[もの]である。傷[きず]のない一歳[いっさい]の小羊[こひつじ]を二匹[にひき]、毎日[まいにち]、燔祭[はんさい]として絶[た]えず献げなさい。"
  4: "一匹[いっぴき]の小羊[こひつじ]は朝[あさ]に、もう一匹の小羊は夕暮[ゆうぐ]れに献[ささ]げなさい。"
  5: "また、素祭[そさい]として、エファの十分[じゅうぶん]の一[いち]の上等[じょうとう]の小麦粉[こむぎこ]を、油[あぶら]を混[ま]ぜて献げなさい。すなわち、一[いっ]ヒンの四分[よんぶん]の一[いち]の油である。"
  6: "これは、シナの山[やま]で献[ささ]げられた、主[しゅ]への芳[かんば]しい香[かおり]となる、絶[た]えず献げる燔祭[はんさい]である。"
  7: "また、その注[そそ]ぎ物[もの]は、一匹[いっぴき]の小羊[こひつじ]に一[いっ]ヒンの四分[よんぶん]の一[いち]を、聖[せい]なる所[ところ]で主[しゅ]に注ぎかけなさい。それは強[つよ]い酒[さけ]の注ぎ物である。"
  8: "もう一匹[いっぴき]の小羊[こひつじ]は夕暮[ゆうぐ]れに献[ささ]げ、その素祭[そさい]とその注[そそ]ぎ物[もの]を朝[あさ]のものと同[おな]じようにして、主[しゅ]への芳[かんば]しい香[かおり]となるようにしなさい。"
  9: "安息日[あんそくび]には、傷[きず]のない一歳[いっさい]の小羊[こひつじ]を二匹[にひき]、素祭[そさい]として油[あぶら]を混[ま]ぜた上等[じょうとう]の小麦粉[こむぎこ]の十分[じゅうぶん]の二[に]、およびその注[そそ]ぎ物[もの]を献[ささ]げなさい。"
  10: "これは、絶[た]えず献[ささ]げる燔祭[はんさい]とその注[そそ]ぎ物[もの]に加[くわ]えて、安息日[あんそくび]ごとに献げる安息日の燔祭である。"
  11: "新月[しんげつ]には、主[しゅ]に燔祭[はんさい]として、牛[うし]の群[む]れから雄[おす]の子牛[こうし]二頭[にとう]、雄羊[おひつじ]一匹[いっぴき]、傷[きず]のない一歳[いっさい]の小羊[こひつじ]七匹[ななひき]を献[ささ]げなさい。"
  12: "雄[おす]の子牛[こうし]一頭[いっとう]には、油[あぶら]を混[ま]ぜた上等[じょうとう]の小麦粉[こむぎこ]の十分[じゅうぶん]の三[さん]、雄羊[おひつじ]一匹には十分の二[に]を、"
  13: "小羊[こひつじ]一匹[いっぴき]には十分[じゅうぶん]の一[いち]を、素祭[そさい]として献[ささ]げなさい。これは芳[かんば]しい香[かおり]の犠牲[ぎせい]、主[しゅ]への捧[ささ]げ物[もの]である。"
  14: "その注[そそ]ぎ物[もの]は、雄[おす]の子牛[こうし]一頭[いっとう]に一[いっ]ヒンの半分[はんぶん]、雄羊[おひつじ]一匹に三分[さんぶん]の一[いち]、小羊[こひつじ]一匹に四分[よんぶん]の一[いち]のぶどう酒[ぶどうしゅ]である。これが、年[とし]の月々[つきづき]に、月[つき]ごとに献[ささ]げる燔祭[はんさい]である。"
  15: "また、主[しゅ]への贖罪祭[しょくざいさい]として、雄山羊[おすやぎ]一匹[いっぴき]を献[ささ]げなさい。それは絶[た]えず献げる燔祭[はんさい]に加[くわ]えて献げられ、その注[そそ]ぎ物[もの]も共[とも]に献げられる。"
  16: "第一[だいいち]の月[つき]の十四日[じゅうよっか]は、主[しゅ]の過越[すぎこし]である。"
  17: "その月[つき]の十五日[じゅうごにち]は祭[まつ]りである。あなたがたは七日[なのか]の間[あいだ]、種[たね]なしパンを食[た]べなさい。"
  18: "最初[さいしょ]の日[ひ]は、あなたがたのために聖[せい]なる集[つど]いの日である。あなたがたはどのような仕事[しごと]もしてはならない。"
  19: "そして、主[しゅ]に燔祭[はんさい]として捧[ささ]げ物[もの]を献[ささ]げなさい。牛[うし]の群[む]れから雄[おす]の子牛[こうし]二頭[にとう]、雄羊[おひつじ]一匹[いっぴき]、一歳[いっさい]の小羊[こひつじ]七匹[ななひき]である。それらはあなたがたにとって傷[きず]のないものでなければならない。"
  20: "それらの素祭[そさい]は、油[あぶら]を混[ま]ぜた上等[じょうとう]の小麦粉[こむぎこ]である。雄[おす]の子牛[こうし]一頭[いっとう]に十分[じゅうぶん]の三[さん]、雄羊[おひつじ]一匹[いっぴき]に十分の二[に]を、"
  21: "七匹[ななひき]の小羊[こひつじ]の一匹[いっぴき]ごとに十分[じゅうぶん]の一[いち]を献[ささ]げなさい。"
  22: "また、贖罪祭[しょくざいさい]として、雄山羊[おすやぎ]一匹[いっぴき]を、あなたがたのために贖[あがな]いをするために献[ささ]げなさい。"
  23: "あなたがたは、朝[あさ]の燔祭[はんさい]、すなわち絶[た]えず献[ささ]げる常[つね]の燔祭のほかに、これらを献げなさい。"
  24: "あなたがたはこれを七日[なのか]の間[あいだ]、毎日[まいにち]、主[しゅ]への芳[かんば]しい香[かおり]となる捧[ささ]げ物[もの]として献[ささ]げなさい。それは、絶[た]えず献げる燔祭[はんさい]に加[くわ]えて、その注[そそ]ぎ物[もの]とともに献げる。"
  25: "七日目[なのかめ]は、あなたがたのために聖[せい]なる集[つど]いの日[ひ]である。あなたがたはどのような仕事[しごと]もしてはならない。"
  26: "初穂[はつほ]の日[ひ]、すなわちあなたがたが主[しゅ]に七週[しちしゅう]の新しい[あたら]しい犠牲[ぎせい]を献[ささ]げる日は、あなたがたのために聖[せい]なる集[つど]いの日である。あなたがたはどのような仕事[しごと]もしてはならない。"
  27: "また、主[しゅ]への芳[かんば]しい香[かおり]として燔祭[はんさい]を献[ささ]げなさい。牛[うし]の群[む]れから雄[おす]の子牛[こうし]二頭[にとう]、雄羊[おひつじ]一匹[いっぴき]、傷[きず]のない一歳[いっさい]の小羊[こひつじ]七匹[ななひき]である。"
  28: "それらの素祭[そさい]は、油[あぶら]を混[ま]ぜた上等[じょうとう]の小麦粉[こむぎこ]である。雄[おす]の子牛[こうし]一頭[いっとう]に十分[じゅうぶん]の三[さん]、雄羊[おひつじ]一匹[いっぴき]に十分の二[に]を、"
  29: "七匹[ななひき]の小羊[こひつじ]の一匹[いっぴき]ごとに十分[じゅうぶん]の一[いち]を、"
  30: "また、贖罪祭[しょくざいさい]として、雄山羊[おすやぎ]一匹[いっぴき]を、あなたがたのために贖[あがな]いをするために献[ささ]げなさい。"
  31: "あなたがたは、絶[た]えず献[ささ]げる燔祭[はんさい]のほかに、その素祭[そさい]とその注[そそ]ぎ物[もの]とともに、それらをわたしへの犠牲[ぎせい]として献[ささ]げなさい。それらはあなたがたにとって傷[きず]のないものでなければならない。」"

notes:
  1: "Формула ἐλάλησεν κύριος πρὸς Μωυσῆν λέγων; вся глава — одна речь Бога, поэтому кавычка открывается в ст. 2 и закрывается в конце ст. 31."
  2: "Ἔντειλαι — повели (ἐντέλλομαι, imper. aor.). Τὰ δῶρά μου δόματά μου καρπώματά μου — дары Мои, даяния Мои, приношения Мои (три синонима: δῶρον, δόμα, κάρπωμα). εἰς ὀσμὴν εὐωδίας — в запах благоухания (芳しい香り). διατηρήσετε — соблюдите (διατηρέω). ἐν ταῖς ἑορταῖς μου — «в праздники Мои» (ἑορτή, 祭り); в ru «в своё время» — иное чтение."
  3: "Ταῦτα τὰ καρπώματα, ὅσα προσάξετε κυρίῳ — вот приношения, которые принесёте Господу. ἀμνοὺς ἐνιαυσίους ἀμώμους δύο τὴν ἡμέραν — двух агнцев однолетних непорочных в день (ἐνιαύσιος, 一歳). εἰς ὁλοκαύτωσιν ἐνδελεχῶς — во всесожжение постоянно (ἐνδελεχῶς, 絶えず)."
  4: "τὸν ἀμνὸν τὸν ἕνα … τὸ πρωΐ — одного агнца утром. τὸν ἀμνὸν τὸν δεύτερον … τὸ πρὸς ἑσπέραν — другого агнца к вечеру (ἑσπέρα)."
  5: "τὸ δέκατον τοῦ οιφι — десятую часть ефы (οἴφι, евр. эфа; エファ). σεμίδαλιν — семидал, пшеничная мука (小麦粉). εἰς θυσίαν ἀναπεποιημένην ἐν ἐλαίῳ — в жертву, смешанную с елеем (ἀναποιέω). ἐν τετάρτῳ τοῦ ιν — в четверть гина (ἵν, ヒン)."
  6: "ὁλοκαύτωμα ἐνδελεχισμοῦ — всесожжение постоянное (ἐνδελεχισμός). ἡ γενομένη ἐν τῷ ὄρει Σινα — бывшее на горе Синай. εἰς ὀσμὴν εὐωδίας κυρίῳ — в запах благоухания Господу."
  7: "σπονδὴν αὐτοῦ τὸ τέταρτον τοῦ ιν — возлияние его, четверть гина. ἐν τῷ ἁγίῳ σπείσεις — на святом месте возльёшь (σπείρω здесь «возливать»). σπονδὴν σικερα — возлияние сикера (σίκερα, крепкий напиток; в ru «вино»), отсюда 強い酒."
  8: "τὸν ἀμνὸν τὸν δεύτερον ποιήσεις τὸ πρὸς ἑσπέραν — другого агнца сделаешь к вечеру. κατὰ τὴν θυσίαν αὐτοῦ καὶ κατὰ τὴν σπονδὴν αὐτοῦ — по жертве его и по возлиянию его."
  9: "τῇ ἡμέρᾳ τῶν σαββάτων — в день суббот (σαββάτων). δύο δέκατα σεμιδάλεως — две десятых семидала (в японском «十分の二»). ἀναπεποιημένης ἐν ἐλαίῳ — смешанной с елеем."
  10: "ὁλοκαύτωμα σαββάτων ἐν τοῖς σαββάτοις — всесожжение суббот в субботы. ἐπὶ τῆς ὁλοκαυτώσεως τῆς διὰ παντός — сверх всесожжения постоянного (διὰ παντός, 絶えず). τὴν σπονδὴν αὐτοῦ — и возлияние его."
  11: "ἐν ταῖς νεομηνίαις — в новомесячия (νεομηνία, 新月). μόσχους ἐκ βοῶν δύο — двух тельцов из крупного скота (μόσχος, βοῦς). κριὸν ἕνα — одного овна (κριός, 雄羊). ἀμνοὺς ἐνιαυσίους ἑπτὰ ἀμώμους — семь агнцев однолетних непорочных."
  12: "τρία δέκατα σεμιδάλεως — три десятых семидала. τῷ μόσχῳ τῷ ἑνὶ … τῷ κριῷ τῷ ἑνί — тельцу одному … овну одному (датив распределения)."
  13: "δέκατον σεμιδάλεως … τῷ ἀμνῷ τῷ ἑνί — десятая часть семидала агнцу одному. θυσίαν ὀσμὴν εὐωδίας κάρπωμα κυρίῳ — жертва, запах благоухания, приношение Господу."
  14: "ἡ σπονδὴ αὐτῶν τὸ ἥμισυ τοῦ ιν … τῷ μόσχῳ — возлияние их: половина гина тельцу. τὸ τρίτον τοῦ ιν … τῷ κριῷ — треть гина овну. τὸ τέταρτον τοῦ ιν … τῷ ἀμνῷ — четверть гина агнцу. οἴνου — вина (οἶνος, ぶどう酒). τοῦτο ὁλοκαύτωμα μῆνα ἐκ μηνὸς εἰς τοὺς μῆνας τοῦ ἐνιαυτοῦ — это всесожжение месяц за месяцем во все месяцы года."
  15: "χίμαρον ἐξ αἰγῶν ἕνα περὶ ἁμαρτίας — одного козла из коз в жертву за грех (χίμαρος, 雄山羊). ἐπὶ τῆς ὁλοκαυτώσεως τῆς διὰ παντὸς ποιηθήσεται καὶ ἡ σπονδὴ αὐτοῦ — сверх всесожжения постоянного совершится и возлияние его."
  16: "ἐν τῷ μηνὶ τῷ πρώτῳ τεσσαρεσκαιδεκάτῃ ἡμέρᾳ — в первом месяце, в четырнадцатый день. πασχα κυρίῳ — Пасха Господня (πάσχα, 過越)."
  17: "τῇ πεντεκαιδεκάτῃ ἡμέρᾳ — в пятнадцатый день. ἑορτή — праздник (祭り). ἑπτὰ ἡμέρας ἄζυμα ἔδεσθε — семь дней опресноки ешьте (ἄζυμος, 種なしパン)."
  18: "ἡ ἡμέρα ἡ πρώτη ἐπίκλητος ἁγία — первый день нарочитый святой (ἐπίκλητος, 聖なる集い). πᾶν ἔργον λατρευτὸν οὐ ποιήσετε — никакого дела служебного не сделаете (λατρευτός)."
  19: "προσάξετε ὁλοκαυτώματα καρπώματα κυρίῳ — принесёте всесожжения, приношения Господу. μόσχους ἐκ βοῶν δύο, κριὸν ἕνα, ἑπτὰ ἀμνοὺς ἐνιαυσίους — двух тельцов, одного овна, семь агнцев однолетних. ἄμωμοι ἔσονται ὑμῖν — непорочны будут вам."
  20: "ἡ θυσία αὐτῶν σεμίδαλις ἀναπεποιημένη ἐν ἐλαίῳ — жертва их: семидал, смешанный с елеем. τρία δέκατα τῷ μόσχῳ τῷ ἑνὶ καὶ δύο δέκατα τῷ κριῷ τῷ ἑνί — три десятых тельцу одному и две десятых овну одному."
  21: "δέκατον δέκατον ποιήσεις τῷ ἀμνῷ τῷ ἑνὶ τοῖς ἑπτὰ ἀμνοῖς — «десятую, десятую сделаешь агнцу одному, семи агнцам», т. е. по десятой части на каждого из семи."
  22: "χίμαρον ἐξ αἰγῶν ἕνα περὶ ἁμαρτίας ἐξιλάσασθαι περὶ ὑμῶν — одного козла в жертву за грех, чтобы умилостивить за вас (ἐξιλάσκομαι)."
  23: "πλὴν τῆς ὁλοκαυτώσεως τῆς διὰ παντὸς τῆς πρωινῆς — кроме всесожжения постоянного, утреннего. ὅ ἐστιν ὁλοκαύτωμα ἐνδελεχισμοῦ — которое есть всесожжение постоянное; в греч. нет глагола «сотворите», он восстановлен по смыслу (слав. «сотворите сия»)."
  24: "ταῦτα κατὰ ταῦτα ποιήσετε τὴν ἡμέραν εἰς τὰς ἑπτὰ ἡμέρας — так делайте день в семь дней. δῶρον κάρπωμα εἰς ὀσμὴν εὐωδίας — дар, приношение в запах благоухания. ἐπὶ τοῦ ὁλοκαυτώματος τοῦ διὰ παντὸς ποιήσεις τὴν σπονδὴν αὐτοῦ — сверх всесожжения постоянного делай возлияние его."
  25: "ἡ ἡμέρα ἡ ἑβδόμη κλητὴ ἁγία — седьмой день нарочитый святой (κλητός, ср. ἐπίκλητος). πᾶν ἔργον λατρευτὸν οὐ ποιήσετε ἐν αὐτῇ — никакого дела служебного не сделаете в нём."
  26: "τῇ ἡμέρᾳ τῶν νέων — в день нового, т. е. новин (νέος; отсюда 初穂の日, хотя это не ἀπαρχή). ὅταν προσφέρητε θυσίαν νέαν κυρίῳ τῶν ἑβδομάδων — когда принесёте жертву новую Господу седмиц (ἑβδομάς). ἐπίκλητος ἁγία — нарочитый святой."
  27: "προσάξετε ὁλοκαυτώματα εἰς ὀσμὴν εὐωδίας κυρίῳ — принесёте всесожжения в запах благоухания Господу. μόσχους ἐκ βοῶν δύο, κριὸν ἕνα, ἑπτὰ ἀμνοὺς ἐνιαυσίους ἀμώμους — те же числа, что в ст. 19."
  28: "ἡ θυσία αὐτῶν σεμίδαλις ἀναπεποιημένη ἐν ἐλαίῳ — жертва их: семидал, смешанный с елеем. τρία δέκατα … δύο δέκατα — три и две десятых части ефы (повтор ст. 20)."
  29: "δέκατον δέκατον τῷ ἀμνῷ τῷ ἑνὶ τοῖς ἑπτὰ ἀμνοῖς — по десятой части на каждого из семи агнцев (повтор ст. 21)."
  30: "χίμαρον ἐξ αἰγῶν ἕνα περὶ ἁμαρτίας — одного козла в жертву за грех; повтор ст. 22."
  31: "πλὴν τοῦ ὁλοκαυτώματος τοῦ διὰ παντός — кроме всесожжения постоянного. καὶ τὴν θυσίαν αὐτῶν ποιήσετέ μοι — и жертву их сделайте Мне. ἄμωμοι ἔσονται ὑμῖν — в греч. вставка в скобках, непорочны да будут вам. καὶ τὰς σπονδὰς αὐτῶν — и возлияния их."
