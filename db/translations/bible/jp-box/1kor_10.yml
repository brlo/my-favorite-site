# jp-box, Первое послание к Коринфянам, глава 10. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 10: прообразы пустыни и предостережение (1–13), трапеза Господня
# и трапеза бесовская (14–22), о идоложертвенном и свободе (23–33).
# Красного и синего нет: прямой речи Христа в главе нет, <j>/<mo> не ставятся.
# 〔…〕: 10:28 — церковное добавление τοῦ κυρίου γὰρ ἡ γῆ καὶ τὸ πλήρωμα αὐτῆς (в базе стих
# обрывается на συνείδησιν). Все прочие расхождения ([τὰ ἔθνη] в 10:20) в базе есть — без скобок.
# Кавычки 「…」: 10:7 (Исх 32:6), 10:26 (Пс 23:1), 10:28 (тот же стих в 〔…〕).
# Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

