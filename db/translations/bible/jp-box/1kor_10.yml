book: 1kor
chapter: 10
draft: true

verses:
  1: "兄弟[きょうだい]たちよ、あなたがたに知[し]ってもらいたい。というのは、わたしたちの先祖[せんぞ]は皆[みな]、雲[くも]の下[した]にあり、皆[みな]海[うみ]を通[とお]り過[す]ぎたからである。"
  2: "そして皆[みな]、雲[くも]の中[なか]と海[うみ]の中[なか]で、モーセに属[ぞく]する洗礼[せんれい]を受[う]けた。"
  3: "そして皆[みな]、同[おな]じ霊[れい]の食物[しょくもつ]を食[た]べ、"
  4: "皆[みな]、同[おな]じ霊[れい]の飲[の]み物[もの]を飲[の]んだ。彼[かれ]らは、自分[じぶん]たちに伴[とも]う霊[れい]の岩[いわ]から飲[の]んでいたからである。その岩[いわ]とはキリストであった。"
  5: "しかし、神[かみ]は彼[かれ]らの多[おお]くの者[もの]を喜[よろこ]ばれなかった。彼[かれ]らは荒[あ]れ野[の]で倒[たお]れたからである。"
  6: "これらのことは、わたしたちへの型[かた]となった。わたしたちが、彼[かれ]らが欲[ほっ]したように悪[あく]を欲[ほっ]することがないためである。"
  7: "また、彼[かれ]らのある者[もの]たちのように、偶像[ぐうぞう]を拝[おが]む者[もの]となってはならない。こう書[か]かれている。「民[たみ]は座[すわ]して食[た]べ飲[の]み、立[た]ち上[あ]がって遊[あそ]んだ」と。"
  8: "また、彼[かれ]らのある者[もの]たちが淫行[いんこう]を犯[おか]して一日[いちにち]に二万三千人[にまんさんぜんにん]が倒[たお]れたように、わたしたちも淫行[いんこう]を犯[おか]してはならない。"
  9: "また、彼[かれ]らのある者[もの]たちが主[しゅ]を試[こころ]みて蛇[へび]に滅[ほろ]ぼされたように、わたしたちも主[しゅ]を試[こころ]みてはならない。"
  10: "また、彼[かれ]らのある者[もの]たちが不平[ふへい]を言[い]って滅[ほろ]ぼす者[もの]に滅[ほろ]ぼされたように、あなたがたも不平[ふへい]を言[い]ってはならない。"
  11: "これらのことが彼[かれ]らに起[お]こったのは、型[かた]としてであり、世[よ]の終[お]わりに達[たっ]したわたしたちへの戒[いまし]めとして書[か]かれたのである。"
  12: "だから、立[た]っていると思[おも]っている者[もの]は、倒[たお]れないように気[き]をつけなさい。"
  13: "あなたがたに及[およ]んだ試練[しれん]は、人間[にんげん]の身[み]に過[す]ぎないものだった。神[かみ]は真実[しんじつ]であり、あなたがたが耐[た]えられないほどの試練[しれん]に遭[あ]わせることはなさらない。必[かなら]ず、試練[しれん]と共[とも]に、耐[た]え抜[ぬ]くことのできる出口[でぐち]を備[そな]えてくださる。"
  14: "だから、わたしの愛[あい]する者[もの]たちよ、偶像[ぐうぞう]礼拝[れいはい]から逃[に]げなさい。"
  15: "わたしは賢[かしこ]い者[もの]たちに語[かた]るように語[かた]る。わたしが言[い]うことを、あなたがた自身[じしん]で判[はん]断[だん]してほしい。"
  16: "わたしたちが祝福[しゅくふく]する祝福[しゅくふく]の杯[さかずき]は、キリストの血[ち]に共[とも]にあずかることではないか。わたしたちが割[わ]るパンは、キリストの体[からだ]に共[とも]にあずかることではないか。"
  17: "パンは一[ひと]つである。だから、わたしたち多[おお]くの者[もの]も一[ひと]つの体[からだ]なのである。わたしたちは皆[みな]、一[ひと]つのパンから受[う]けているからである。"
  18: "肉[にく]によるイスラエルを見[み]なさい。祭[そな]え物[もの]を食[た]べる者[もの]たちは、祭壇[さいだん]に共[とも]にあずかる者[もの]ではないか。"
  19: "では、わたしは何[なに]を言[い]っているのか。偶像[ぐうぞう]に供[そな]えた物[もの]が何[なに]かであるというのか。偶像[ぐうぞう]が何[なに]かであるというのか。"
  20: "いや、異邦人[いほうじん]が犠牲[ぎせい]をささげるのは、神[かみ]にではなく悪霊[あくりょう]にささげているのである。わたしは、あなたがたが悪霊[あくりょう]と共[とも]にあずかる者[もの]になることを望[のぞ]まない。"
  21: "あなたがたは、主[しゅ]の杯[さかずき]と悪霊[あくりょう]の杯[さかずき]を、同[どう]時[じ]に飲[の]むことはできない。主[しゅ]の食卓[しょくたく]と悪霊[あくりょう]の食卓[しょくたく]に、同[どう]時[じ]にあずかることはできない。"
  22: "それとも、わたしたちは主[しゅ]を嫉妬[しっと]させるのだろうか。わたしたちは主[しゅ]よりも強[つよ]いのだろうか。"
  23: "すべてのことは許[ゆる]されている。だが、すべてのことが益[えき]になるとは限[かぎ]らない。すべてのことは許[ゆる]されている。だが、すべてのことが建[た]て上[あ]げるとは限[かぎ]らない。"
  24: "だれも自分[じぶん]の益[えき]を求[もと]めず、ほかの人[ひと]の益[えき]を求[もと]めなさい。"
  25: "市[いち]で売[う]られているものは何[なん]でも、良心[りょうしん]のために何[なに]も問[と]わずに食[た]べなさい。"
  26: "「地[ち]は主[しゅ]のもの、そこに満[み]ちるものも主[しゅ]のものである」からである。"
  27: "信[しん]じていない者[もの]のうちのだれかがあなたがたを招[まね]き、あなたがたが行[い]こうと思[おも]うなら、出[だ]されたものは何[なん]でも、良心[りょうしん]のために何[なに]も問[と]わずに食[た]べなさい。"
  28: "しかし、だれかがあなたがたに「これは偶像[ぐうぞう]に供[そな]えた物[もの]だ」と言[い]うなら、それを告[つ]げた者[もの]のため、また良心[りょうしん]のために、食[た]べてはならない。〔「地[ち]は主[しゅ]のもの、そこに満[み]ちるものも主[しゅ]のものである」。〕"
  29: "わたしが言[い]う良心[りょうしん]とは、自分[じぶん]の良心[りょうしん]ではなく、ほかの人[ひと]の良心[りょうしん]である。なぜなら、わたしの自由[じゆう]がほかの人[ひと]の良心[りょうしん]によって裁[さば]かれる理由[りゆう]は、どこにあるのか。"
  30: "わたしが感謝[かんしゃ]して食[た]べるのなら、なぜ、わたしが感謝[かんしゃ]するその物[もの]のために、ののしられなければならないのか。"
  31: "だから、あなたがたが食[た]べるにしても飲[の]むにしても、何[なに]かをするにしても、すべてを神[かみ]の栄光[えいこう]のためにしなさい。"
  32: "ユダヤ人[じん]にも、ギリシア人[じん]にも、神[かみ]の教会[きょうかい]にも、つまずきとなる者[もの]になってはならない。"
  33: "わたしもまた、すべての人[ひと]にすべてのことをして喜[よろこ]んでもらい、自分[じぶん]の益[えき]ではなく多[おお]くの者[もの]の益[えき]を求[もと]めている。彼[かれ]らが救[すく]われるためである。"

notes:
  1: "γάρ — связь с предупреждением 9:24–27: というのは…からである. νεφέλη — 雲 (облачный столп, Исх 13:21)."
  2: "εἰς τὸν Μωϋσῆν ἐβαπτίσαντο — «крестились в Моисея», то есть стали народом Моисея, как христиане — Христовыми; モーセに属する洗礼. πάντες («все») повторено в 10:1–4 четыре раза — не сглаживать."
  3: "πνευματικὸν βρῶμα — 霊の食物 (манна); τὸ αὐτό — 同じ."
  4: "πνευματικὴ ἀκολουθοῦσα πέτρα — «следующая [за ними] духовная скала»; 自分たちに伴う霊の岩. ἡ πέτρα δὲ ἦν ὁ Χριστός — その岩とはキリストであった. У jp-joc 後來の磐."
  5: "οὐκ ἐν τοῖς πλείοσιν εὐδόκησεν — «не в большинстве их благоволил»; 多くの者を喜ばれなかった. κατεστρώθησαν — «были уложены [мёртвыми]»; 倒れた."
  6: "τύποι — «образцы, прообразы»; 型. ἐπιθυμητάς — «пожелавшими»; 欲する."
  7: "Цитата Исх 32:6. εἰδωλολάτραι — 偶像を拝む者. παίξειν — «играть, плясать»; 遊ぶ."
  8: "Числ 25:9 (там 24 000; у Павла 23 000 — так в тексте, не выравнивать); 二万三千人."
  9: "В византийском тексте κύριον («Господь»), в критическом Χριστόν; в базе κύριον, поэтому 主, без 〔…〕. У jp-joc ハリストス. ὄφεις — 蛇."
  10: "γογγύζω — «роптать»; 不平を言う. ὀλοθρευτής — «губитель»; 滅ぼす者."
  11: "τυπικῶς — «прообразовательно»; 型として. τὰ τέλη τῶν αἰώνων — «концы веков»; 世の終わり. νουθεσία — 戒め."
  12: "δοκῶν ἑστάναι — «думающий, что стоит»; 立っていると思っている者. ὥστε — だから. Не сглаживать."
  13: "πειρασμός — 試練. ἀνθρώπινος — «человеческий», то есть посильный человеку; 人間の身に過ぎない. ἔκβασις — «выход»; 出口."
  14: "διόπερ — だから. εἰδωλολατρία — 偶像礼拝."
  15: "ὡς φρονίμοις — «как разумным»; 賢い者たちに語るように. κρίνατε — 判断してほしい."
  16: "ποτήριον τῆς εὐλογίας — «чаша благословения»; 祝福の杯. κοινωνία — «общение, участие»; 共にあずかること. κλῶμεν — 割る."
  17: "εἷς ἄρτος — パンは一つ. ἓν σῶμα οἱ πολλοί — 多くの者も一つの体. μετέχομεν — 受けている."
  18: "τὸν Ἰσραὴλ κατὰ σάρκα — 肉によるイスラエル. κοινωνοὶ τοῦ θυσιαστηρίου — 祭壇に共にあずかる者."
  19: "τί οὖν φημι — では、わたしは何を言っているのか. Два вопроса; ответ даётся в 10:20 («いや»)."
  20: "ἀλλ᾽ ὅτι — «но [говорю], что»; передано いや. δαιμόνια — 悪霊 (не 悪魔). В критическом тексте τὰ ἔθνη в квадратных скобках, в базе оно есть — 異邦人 без 〔…〕."
  21: "ποτήριον κυρίου / τράπεζα κυρίου — 主の杯 / 主の食卓. Не сглаживать: оба стола несовместимы (οὐ δύνασθε — «не можете»)."
  22: "παραζηλοῦμεν — «возбуждаем ревность»; 嫉妬させる. ἰσχυρότεροι — 強い."
  23: "Πάντα ἔξεστιν повторено дважды — すべてのことは許されている (дважды); とは限らない передаёт οὐ πάντα. συμφέρει — 益になる. οἰκοδομεῖ — 建て上げる."
  24: "μηδεὶς τὸ ἑαυτοῦ ζητείτω — だれも自分の益を求めず."
  25: "μάκελλον — 市場. ἀνακρίνοντες — «разбирая, допытываясь»; 問う. συνείδησις — 良心."
  26: "Цитата Пс 23:1 (LXX). τοῦ κυρίου γὰρ ἡ γῆ — 地は主のもの; γάρ — からである."
  27: "ἄπιστοι — 信じていない者. παρατιθέμενον — «предлагаемое»; 出されたもの."
  28: "ἱερόθυτον — «идоложертвенное»; 偶像に供えた物. В критическом тексте стих обрывается на συνείδησιν (тире); добавка τοῦ κυρίου γὰρ ἡ γῆ καὶ τὸ πλήρωμα αὐτῆς — церковное чтение (Елизаветинская, Синод., jp-joc), в базе сайта её нет — 〔…〕."
  29: "συνείδησις — 良心. ἡ ἐλευθερία μου — わたしの自由. κρίνεται — 裁かれる."
  30: "χάριτι μετέχω — «по благодати участвую»; 感謝して食べる. βλασφημοῦμαι — ののしられる."
  31: "εἴτε… εἴτε… — にしても…にしても. εἰς δόξαν θεοῦ — 神の栄光のために."
  32: "ἀπρόσκοποι — «не подающие повода к преткновению»; つまずきとなる者にならない. Ἕλληνες — ギリシア人."
  33: "πάντα πᾶσιν ἀρέσκω — «всем во всём угождаю»; すべての人にすべてのことをして喜んでもらい. Не сглаживать связь с 9:19–23."
