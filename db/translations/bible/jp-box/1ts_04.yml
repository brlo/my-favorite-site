# jp-box, 1-я Царств, глава 4. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в 1 Царств нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 4: война с филистимлянами и поражение при Авен-Езере (1–2), ковчег принесён
# в стан (3–5), страх филистимлян (6–9), разгром, гибель сыновей Илия и пленение
# ковчега (10–11), вестник и смерть Илия (12–18), роды и смерть невестки, Ихавод
# (19–22).
# Речь людей — 「…」: 3, 6, 7, 9, 14, 16, 17, 20, 22. Красного и синего нет.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (проверено по базе). Славянский
# в ст. 1 добавляет фразу о слове Самуила, которой в греческом нет; она не переведена.
# Сносок ⟨…⟩ нет: 契約の箱, ペリシテ人, 祭司 уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: 1ts
chapter: 4
draft: true

verses:
  1: "そのころ、ペリシテ人[じん]がイスラエルと戦[たたか]うために集[あつ]まった。イスラエルは彼らを迎[むか]えて戦いに出[で]て、アベン・エゼルに陣[じん]を張[は]った。ペリシテ人はアフェクに陣を張った。"
  2: "ペリシテ人はイスラエルと戦[たたか]うために戦列[せんれつ]を整[ととの]えた。戦[いくさ]は傾[かたむ]き、イスラエルの人[ひと]々[びと]はペリシテ人の前[まえ]で打[う]ち倒[たお]された。野[の]での戦[たたか]いで、四千人[よんせんにん]の者[もの]が打たれた。"
  3: "民[たみ]は陣営[じんえい]に戻[もど]った。イスラエルの長老[ちょうろう]たちは言[い]った。「なぜ主[しゅ]は今日[きょう]、ペリシテ人の前[まえ]でわたしたちを打[う]たれたのか。シロからわたしたちの神[かみ]の契約[けいやく]の箱[はこ]を持[も]って来[こ]よう。箱がわたしたちのただ中[なか]に出[で]て、敵[てき]の手[て]からわたしたちを救[すく]うだろう。」"
  4: "民[たみ]はシロへ人[ひと]を遣[つか]わし、ケルビムの上[うえ]に座[すわ]しておられる主[しゅ]の契約[けいやく]の箱[はこ]を、そこから運[はこ]ばせた。エリの二人[ふたり]の息子[むすこ]、ホフニとピネハスも、契約の箱とともにいた。"
  5: "主[しゅ]の契約[けいやく]の箱[はこ]が陣営[じんえい]に着[つ]くと、イスラエルはこぞって大[おお]きな声[こえ]を上[あ]げ、地[ち]が鳴[な]り響[ひび]いた。"
  6: "ペリシテ人[じん]はその叫[さけ]びを聞[き]いて言[い]った。「ヘブライ人[じん]の陣営[じんえい]のこの大[おお]きな叫びは何[なん]だ。」そして、主[しゅ]の契約[けいやく]の箱[はこ]が陣営に来[き]たことを知[し]った。"
  7: "ペリシテ人は恐[おそ]れて言った。「神[かみ]々[がみ]が彼らの陣営[じんえい]に来[き]た。わざわいだ。主[しゅ]よ、今日[きょう]、わたしたちを救[すく]い出[だ]してほしい。昨日[きのう]も一昨日[おととい]も、このようなことはなかった。」"
  8: "ああ、わたしたちは不幸[ふこう]だ。この強[つよ]い神[かみ]々[がみ]の手[て]から、だれがわたしたちを救[すく]い出[だ]せるのか。これは、あらゆる災[わざわ]いをもってエジプトを、また荒野[こうや]で打[う]った神々である。"
  9: "ペリシテ人[じん]よ、強[つよ]くあれ、男[おとこ]となれ。ヘブライ人[じん]に仕[つか]えることがないように。彼らがわたしたちに仕えたように。男となって、彼らと戦[たたか]え。"
  10: "彼らは戦[たたか]った。イスラエルの人[ひと]は打[う]たれ、おのおの自分[じぶん]の天幕[てんまく]へ逃[に]げた。打ち殺[ころ]される者[もの]が非常[ひじょう]に多[おお]く、イスラエルから三万[さんまん]の部隊[ぶたい]が倒[たお]れた。"
  11: "神[かみ]の契約[けいやく]の箱[はこ]は奪[うば]われ、エリの二人[ふたり]の息子[むすこ]、ホフニとピネハスは死[し]んだ。"
  12: "一人[ひとり]のベニヤミン人[じん]が戦列[せんれつ]から走[はし]って、その日[ひ]にシロへ来[き]た。衣[ころも]は裂[さ]け、頭[あたま]には土[つち]があった。"
  13: "彼が来[き]たとき、見[み]よ、エリは門[もん]のそばの椅子[いす]に座[すわ]って、道[みち]を眺[なが]めていた。神[かみ]の契約[けいやく]の箱[はこ]のことで、心[こころ]は動揺[どうよう]していたからである。その人[ひと]が告[つ]げるために町[まち]に入[はい]ると、町中[まちじゅう]が叫[さけ]び声[ごえ]を上[あ]げた。"
  14: "エリはその叫[さけ]びの声[こえ]を聞[き]いて言[い]った。「このどよめきは何[なん]の声か。」その人は急[いそ]いで入[はい]って来[き]て、エリに告[つ]げた。"
  15: "エリは九十歳[きゅうじゅっさい]の男[おとこ]で、目[め]は見[み]えなくなっていた。エリは自分[じぶん]の周[まわ]りに立[た]つ人[ひと]々[びと]に言った。「この響[ひび]きは何[なん]の声[こえ]か。」"
  16: "その人[ひと]は急[いそ]いでエリに近[ちか]づき、言った。「わたしは陣営[じんえい]から来[き]た者[もの]だ。今日[きょう]、わたしは戦列[せんれつ]から逃[に]げて来た。」エリは言った。「何[なに]が起[お]こったのか、わが子[こ]よ。」"
  17: "若者[わかもの]は答[こた]えて言った。「イスラエルの人[ひと]々[びと]はペリシテ人[じん]の前[まえ]から逃[に]げた。民[たみ]に大[おお]きな打撃[だげき]があり、あなたの二人[ふたり]の息子[むすこ]も死[し]んだ。神[かみ]の契約[けいやく]の箱[はこ]も奪[うば]われた。」"
  18: "神[かみ]の契約[けいやく]の箱[はこ]のことが出[で]ると、彼は門[もん]のそばで、戸口[とぐち]につかまったまま椅子[いす]から後[うし]ろ向[き]に倒[たお]れ、背骨[せぼね]を砕[くだ]いて死[し]んだ。年[とし]を取[と]った重[おも]い人[ひと]であったからである。彼は二十年[にじゅうねん]の間[あいだ]、イスラエルを裁[さば]いた。"
  19: "彼の嫁[よめ]で、ピネハスの妻[つま]である女[おんな]は、身[み]ごもって産[う]もうとしていた。神[かみ]の契約[けいやく]の箱[はこ]が奪[うば]われ、しゅうとと夫[おっと]が死[し]んだという知[し]らせを聞[き]くと、彼女は膝[ひざ]を折[お]り曲[ま]げて産んだ。出産[しゅっさん]の苦[くる]しみが彼女に襲[おそ]いかかったからである。"
  20: "彼女が死[し]にかかるとき、そばに立[た]っていた女[おんな]たちが言[い]った。「恐[おそ]れるな。男[おとこ]の子[こ]を産[う]んだのだから。」しかし彼女は答[こた]えず、心[こころ]に留[と]めもしなかった。"
  21: "彼女はその子[こ]をイカボドと呼[よ]んだ。神[かみ]の契約[けいやく]の箱[はこ]のゆえ、しゅうとのゆえ、夫[おっと]のゆえであった。"
  22: "彼女は言った。「栄光[えいこう]はイスラエルから去[さ]った。」主[しゅ]の契約[けいやく]の箱[はこ]が奪[うば]われたからである。"

notes:
  1: "συναθροίζονται — собираются (настоящее историческое, частое в LXX). παρεμβάλλουσιν ἐπὶ Αβενεζερ — располагаются станом при Авен-Езере, «камне помощи» (アベン・エゼル). ἐν Αφεκ — при Афеке. Слав. и ru в начале стиха имеют «И было слово Самуила ко всему Израилю» (евр. 4:1a); в греческом этой фразы нет — не переведена."
  2: "παρατάσσονται εἰς πόλεμον — выстраиваются на войну (παρατάσσω). ἔκλινεν ὁ πόλεμος — война склонилась, т. е. чаша весов. ἔπταισεν ἀνὴρ Ισραηλ — споткнулся, пал муж Израиля (πταίω). ἐν τῇ παρατάξει ἐν ἀγρῷ — в строю, на поле. τέσσαρες χιλιάδες ἀνδρῶν — четыре тысячи мужей."
  3: "παρεμβολή — стан, лагерь. Κατὰ τί ἔπταισεν ἡμᾶς κύριος — за что поразил нас Господь (πταίω — заставить споткнуться). λάβωμεν τὴν κιβωτόν — возьмём ковчег: расчёт на то, что ковчег сам обеспечит победу. ἐν μέσῳ ἡμῶν — среди нас. ἐκ χειρὸς ἐχθρῶν — из руки врагов."
  4: "ἀπέστειλεν ὁ λαὸς εἰς Σηλωμ — народ послал в Силом. αἴρουσιν ἐκεῖθεν — поднимают, несут оттуда (αἴρω). κυρίου καθημένου χερουβιμ — Господа, сидящего на херувимах (над ковчегом; ср. Исх 25:22, Пс 79:2). ἀμφότεροι οἱ υἱοὶ Ηλι — оба сына Илия."
  5: "ἀνέκραξεν — возопил (ἀνακράζω). φωνῇ μεγάλῃ — голосом великим. ἤχησεν ἡ γῆ — земля загудела, отозвалась (ἠχέω)."
  6: "κραυγή — вопль, крик. ἐν παρεμβολῇ τῶν Εβραίων — в стане Евреев: так иноплеменники называют израильтян. ἥκει — пришёл (ἥκω)."
  7: "οὐαὶ ἡμῖν — горе нам. ἐξελοῦ ἡμᾶς, κύριε — избавь нас, Господи (ἐξαιρέω): язычники взывают к Богу Израиля, буквальное обращение сохранено. ἐχθὲς καὶ τρίτην — вчера и третьего дня, т. е. прежде."
  8: "τῶν θεῶν τῶν στερεῶν τούτων — этих твёрдых, крепких богов (στερεός — твёрдый, сильный). οἱ πατάξαντες τὴν Αἴγυπτον ἐν πάσῃ πληγῇ — поразившие Египет всякою казнью (πληγή — удар, казнь). ἐν τῇ ἐρήμῳ — в пустыне."
  9: "κραταιοῦσθε — укрепляйтесь (κραταιόω). γίνεσθε εἰς ἄνδρας — станьте мужами: воинская формула. μήποτε δουλεύσητε — чтобы не стать рабами. καθὼς ἐδούλευσαν ἡμῖν — как они служили нам. πολεμήσατε — сразитесь."
  10: "πταίει ἀνὴρ Ισραηλ — падает муж Израиля (настоящее историческое). εἰς σκήνωμα αὐτοῦ — в шатёр свой. πληγὴ μεγάλη σφόδρα — поражение весьма великое. τριάκοντα χιλιάδες ταγμάτων — тридцать тысяч строёв, полков (τάγμα — отряд, строй); у ru «пеших»."
  11: "ἐλήμφθη — был взят (λαμβάνω). ἀπέθανον — умерли. Исполнение пророчества 2:34."
  12: "ἀνὴρ Ιεμιναῖος — вениамитянин (Ιεμινί — Вениамин). διερρηγότα — разодранные (διαρρήγνυμι). γῆ ἐπὶ τῆς κεφαλῆς — земля на голове: знак траура (ср. Нав 7:6; 2 Цар 1:2)."
  13: "δίφρος — седалище. παρὰ τὴν πύλην σκοπεύων τὴν ὁδόν — у ворот, высматривая дорогу (σκοπεύω). ἐξεστηκυῖα — вышедшая из себя, в трепете (ἐξίστημι). ἀνεβόησεν ἡ πόλις — город возопил."
  14: "βοή — крик, вопль. σπεύσας — поспешив (σπεύδω)."
  15: "υἱὸς ἐνενήκοντα ἐτῶν — букв. «сын девяноста лет», т. е. девяностолетний; в евр. и ru — 98 лет. ἐπανέστησαν — поднялись, помутнели (ἐπανίστημι): глаза перестали видеть. ἤχος — звук, гул."
  16: "Ἐγώ εἰμι ὁ ἥκων ἐκ τῆς παρεμβολῆς — я тот, кто пришёл из стана. πέφευγα — бежал (perfect). Τί τὸ γεγονὸς ῥῆμα — что произошло, какое слово случилось."
  17: "τὸ παιδάριον — отрок, слуга (вестник назван отроком). ἀπὸ προσώπου ἀλλοφύλων — от лица иноплеменников. τεθνήκασιν — умерли (perfect). ἐλήμφθη — взят."
  18: "ὡς ἐμνήσθη τῆς κιβωτοῦ — когда упомянул о ковчеге (μιμνῄσκομαι). ὀπισθίως — назад, навзничь. ἐχόμενος τῆς πύλης — держась за ворота. συνετρίβη ὁ νῶτος — сокрушился хребет (νῶτος — спина, хребет). πρεσβύτης… καὶ βαρύς — стар и тяжёл. εἴκοσι ἔτη — двадцать лет; в евр. и ru — сорок."
  19: "νύμφη — невестка, сноха. συνειληφυῖα τοῦ τεκεῖν — зачавшая, чтобы родить, т. е. беременная. ὤκλασεν — упала на колени, присела (ὀκλάζω). ἐπεστράφησαν ἐπ᾿ αὐτὴν ὠδῖνες — обратились на неё родовые муки (ὠδίς)."
  20: "ἐν τῷ καιρῷ αὐτῆς — в свой час. ἀποθνῄσκει — умирает (настоящее историческое). Μὴ φοβοῦ — не бойся. υἱὸν τέτοκας — сына родила. οὐκ ἀπεκρίθη — не ответила. οὐκ ἐνόησεν ἡ καρδία αὐτῆς — не уразумело сердце её (νοέω)."
  21: "ἐκάλεσεν τὸ παιδάριον Οὐαὶ βαρχαβωθ — назвала дитя «Увы, Вархавоф»: LXX передаёт евр. имя Ихавод (אִי־כָבוֹד, «где слава?») искажённо; по решению партии — イカボド. ὑπὲρ τῆς κιβωτοῦ… ὑπὲρ τοῦ πενθεροῦ… ὑπὲρ τοῦ ἀνδρός — из-за ковчега, из-за свёкра, из-за мужа. Слав. здесь добавляет «преселися слава от израиля…» — это ст. 22 по греческому делению."
  22: "Ἀπῴκισται δόξα Ισραηλ — отошла, выселилась слава Израиля (ἀποικίζω — выселять). ἐν τῷ λημφθῆναι τὴν κιβωτὸν κυρίου — при взятии ковчега Господня. По-гречески «сказали» (εἶπαν) — мн. ч.; возможно, женщины при ней."
