verses:
  1: "ルベンの子[こ]らとガドの子[こ]らには、家畜[かちく]が非常[ひじょう]に多[おお]くいた。彼らはイアゼルの地[ち]とギレアデの地を見[み]て、そこが家畜に適[てき]した場所[ばしょ]であることに気[き]づいた。"
  2: "ルベンの子らとガドの子らは近[ちか]づいて、モーセと祭司[さいし]エレアザル、および会衆[かいしゅう]の長[ちょう]たちに言[い]った。"
  3: "「アタロト、ダイボン、イアゼル、ナムラ、エセボン、エレアレ、セバマ、ナバウ、ベアン、"
  4: "すなわち、主[しゅ]がイスラエルの子[こ]らの前[まえ]に渡[わた]されたこの地[ち]は、家畜[かちく]を育[やしな]う地[ち]です。そして、あなたの僕[しもべ]たちには家畜がおります。"
  5: "もしあなたの前[まえ]に恵[めぐ]みを得[え]たなら、この地[ち]をあなたの僕[しもべ]たちに所有[しょゆう]として与[あた]えてください。わたしたちをヨルダン川[がわ]の向[む]こうへ渡[わた]らせないでください。」"
  6: "モーセはガドの子[こ]らとルベンの子[こ]らに言[い]った。「あなたがたの兄弟[きょうだい]たちは戦[たたか]いに出[で]るのに、あなたがたはここに座[すわ]っているのか。"
  7: "なぜ、あなたがたはイスラエルの子[こ]らの心[こころ]を曲[ま]げて、主[しゅ]が彼らに与[あた]える地[ち]へ渡[わた]らせないようにするのか。"
  8: "あなたがたの父[ちち]たちも、わたしが彼らをカデス・バルネから地[ち]を探[さぐ]り見[み]るために送[おく]ったとき、そのようにしたではないか。"
  9: "彼らはぶどうの房[ふさ]の谷[たに]に上[のぼ]り、その地を探り見て、イスラエルの子らの心を離[はな]れさせ、主が彼らに与えた地に入[はい]らないようにした。"
  10: "その日[ひ]、主[しゅ]は怒[いか]りに燃[も]えて誓[ちか]って言[い]われた。『"
  11: "エジプトから上[のぼ]って来[き]たこの者[もの]たちのうち、二十歳[はたち]以上[いじょう]で、善[ぜん]と悪[あく]を知[し]る者[もの]は、わたしがアブラハム、イサク、ヤコブに誓[ちか]った地[ち]を見[み]ることはない。彼らはわたしに従[したが]わなかったからである。』"
  12: "ただ、イェフォンネの子[こ]カレブと、ヌンの子[こ]ヨシュアだけは別[べつ]である。彼らは主[しゅ]に従[したが]ったからである。"
  13: "主[しゅ]はイスラエルに対[たい]して怒[いか]りに燃[も]え、彼らを荒野[こうや]で四十年[よんじゅうねん]の間[あいだ]さまよわせ、主[しゅ]の前[まえ]で悪[わる]を行[おこな]ったその世代[せだい]がすべて絶[た]え果[は]てるまでにされた。"
  14: "見[み]よ、あなたがたは父[ちち]たちに代[か]わって立[た]ち、罪[つみ]ある者[もの]の群[む]れとなって、主[しゅ]のイスラエルに対[たい]する激[はげ]しい怒[いかり]にさらに増[ふ]し加[くわ]えようとしている。"
  15: "あなたがたが彼[かれ]から離[はな]れ去[さ]るなら、彼は再[ふたた]びこの民[たみ]を荒野[こうや]に置[お]き去[ざ]りにし、あなたがたはこの全会衆[ぜんかいしゅう]に対して罪[つみ]を犯[おか]すことになる。」"
  16: "彼らは彼[かれ]に近[ちか]づいて言[い]った。「わたしたちはここに、家畜[かちく]のために羊[ひつじ]の囲[かこ]いを建[た]て、子[こ]どもたちのために町々[まちまち]を建てましょう。"
  17: "そしてわたしたちは、イスラエルの子[こ]らより先[さき]に武装[ぶそう]して先陣[せんじん]を務[つと]め、彼らをその場所[ばしょ]へ導[みちび]き入[い]れるまで進[すす]みます。わたしたちの子[こ]どもたちは、この地[ち]に住[す]む者[もの]たちのゆえに、城壁[じょうへき]のある町々[まちまち]に住[す]みます。"
  18: "イスラエルの子らがそれぞれ自分[じぶん]の嗣業[しぎょう]を受[う]けるまで、わたしたちは自分[じぶん]の家[いえ]に帰[かえ]りません。"
  19: "わたしたちはヨルダン川[がわ]の向[む]こう岸[ぎし]へ渡[わた]って、彼らとともに嗣業[しぎょう]を受[う]けることはありません。わたしたちの割[わ]り当[あ]ては、ヨルダン川のこちら岸[ぎし]、すなわち東[ひがし]の側[がわ]にあるからです。」"
  20: "モーセは彼らに言[い]った。「もしあなたがたがこの言葉[ことば]のとおりに行[おこな]い、主[しゅ]の前[まえ]で戦[たたか]いのために武装[ぶそう]するなら、"
  21: "あなたがたの兵[へい]がすべて主[しゅ]の前[まえ]でヨルダン川[がわ]を渡[わた]り、主[しゅ]がその敵[てき]を御前[みまえ]から滅[ほろ]ぼし尽[つ]くされるまで、"
  22: "そして主[しゅ]の前[まえ]でその地[ち]が征服[せいふく]されたなら、その後[あと]であなたがたは帰[かえ]ることができ、主[しゅ]に対[たい]してもイスラエルに対しても責[せ]めを負[お]わない。この地[ち]は主[しゅ]の前[まえ]であなたがたの所有[しょゆう]となる。"
  23: "もしそうしなければ、あなたがたは主[しゅ]の前[まえ]で罪[つみ]を犯[おか]すことになる。災[わざわ]いがあなたがたを襲[おそ]うとき、あなたがたは自分[じぶん]の罪[つみ]を知[し]るであろう。"
  24: "あなたがたは自分[じぶん]たちのために、子[こ]どもたちの町々[まちまち]と、家畜[かちく]の囲[かこ]いを建[た]て、あなたがたの口[くち]から出[で]たことを行[おこな]いなさい。」"
  25: "ルベンの子[こ]らとガドの子[こ]らはモーセに言[い]った。「あなたの僕[しもべ]たちは、わたしたちの主人[しゅじん]が命[めい]じられるとおりに行[おこな]います。"
  26: "わたしたちの子[こ]どもと妻[つま]たち、およびすべての家畜[かちく]は、ギレアデの町々[まちまち]にいます。"
  27: "しかし、あなたの僕[しもべ]たちはみな、武装[ぶそう]して戦列[せんれつ]を整[ととの]え、主[しゅ]の前[まえ]で戦[たたか]いに出[で]ます。わたしたちの主人[しゅじん]が言[い]われるとおりに。」"
  28: "モーセは彼らのために、祭司[さいし]エレアザルと、ヌンの子[こ]ヨシュア、およびイスラエルの部族[ぶぞく]の氏族[しぞく]の長[ちょう]たちを任命[にんめい]した。"
  29: "モーセは彼らに言[い]った。「もしルベンの子[こ]らとガドの子[こ]らが、すべて武装[ぶそう]して主[しゅ]の前[まえ]で戦[たたか]いのためにあなたがたとともにヨルダン川[がわ]を渡[わた]り、あなたがたの前[まえ]にあるその地[ち]を征服[せいふく]したなら、あなたがたはギレアデの地[ち]を彼らに所有[しょゆう]として与[あた]えなさい。"
  30: "しかし、もし彼らが武装[ぶそう]して主[しゅ]の前[まえ]で戦[たたか]いのためにあなたがたとともに渡[わた]らないなら、あなたがたは彼らの子[こ]どもと妻[つま]たちと家畜[かちく]を、あなたがたより先[さき]にカナンの地[ち]へ移[うつ]さなければならない。彼らはあなたがたとともにカナンの地[ち]で嗣業[しぎょう]を受[う]ける。」"
  31: "ルベンの子[こ]らとガドの子[こ]らは答[こた]えて言[い]った。「わたしたちの主人[しゅじん]がその僕[しもべ]たちに言[い]われることは、すべてそのとおりに行[おこな]います。"
  32: "わたしたちは武装[ぶそう]して主[しゅ]の前[まえ]でカナンの地[ち]へ渡[わた]ります。あなたがたはヨルダン川[がわ]の東[ひがし]の側[がわ]で、わたしたちに所有[しょゆう]地[ち]を与[あた]えてください。」"
  33: "モーセは、ガドの子[こ]らとルベンの子[こ]ら、およびヨセフの子[こ]らのうちのマナセの部族[ぶぞく]の半分[はんぶん]に、アモリ人[じん]の王[おう]シホンの王国[おうこく]と、バシャンの王[おう]オグの王国を、その地[ち]と、その境界[きょうかい]に沿[そ]った町々[まちまち]、すなわちその地[ち]の周[まわ]りの町々とともに与[あた]えた。"
  34: "ガドの子[こ]らは、ダイボン、アタロト、アロエルを建[た]て、"
  35: "またソファルとイアゼルを建て、それらを高[たか]くした。"
  36: "またナムラとベタラン、すなわち堅固[けんご]な町々[まちまち]を建て、羊[ひつじ]の囲[かこ]いを築[きず]いた。"
  37: "ルベンの子[こ]らは、エセボン、エレアレ、カリアタイムを建て、"
  38: "また城壁[じょうへき]で囲[かこ]まれたベエルメオンとセバマを建てた。そして、自分[じぶん]たちが建てた町々[まちまち]に、自分たちの名[な]にちなんだ名[な]を付[つ]けた。"
  39: "マナセの子[こ]マキルの子[こ]らはギレアデへ行[い]き、それを取[と]って、そこに住[す]んでいたアモリ人[じん]を滅[ほろ]ぼした。"
  40: "モーセはギレアデをマナセの子[こ]マキルに与[あた]え、彼はそこに住[す]んだ。"
  41: "マナセの子[こ]ヤイルは行[い]って、その村々[むらむら]を取[と]り、それらをヤイルの村々[むらむら]と名[な]づけた。"
  42: "ナバウは行[い]って、カナアトとその村々[むらむら]を取[と]り、自分[じぶん]の名[な]にちなんで、それらをナボトと名[な]づけた。"

notes:
  1: "κτήνη πλῆθος — множество скота (πλῆθος — «множество»). Ρουβην, Γαδ — Рувим и Гад. χώρα — страна, область. Ιαζηρ — イアゼル, Γαλααδ — ギレアデ (в корпусе Числ — ギレアデ, ср. 26:33; 27:1). τόπος κτήνεσιν — место для скота (датив). εἶδον — увидели."
  2: "προσελθόντες — подойдя (προσέρχομαι). οἱ υἱοὶ Ρουβην καὶ οἱ υἱοὶ Γαδ — в LXX порядок «Рувим и Гад», в Синодальном часто «Гад и Рувим». λέγοντες — говоря (далее речь, ст. 3–5)."
  3: "Перечисление городов (Αταρωθ, Δαιβων, Ιαζηρ, Ναμβρα, Εσεβων, Ελεαλη, Σεβαμα, Ναβαυ, Βαιαν) — в Синодальном: Атароф, Дивон, Иазер, Нимра, Есевон, Елеале, Севам, Нево, Веон. Стих — начало речи, продолжается в ст. 4–5 (винительный падеж при подразумеваемом глаголе)."
  4: "παρέδωκεν κύριος ἐνώπιον τῶν υἱῶν Ισραηλ — Господь предал пред сынами Израиля, т.е. дал им. γῆ κτηνοτρόφος — земля, питающая скот (κτηνοτρόφος). παισίν σου — рабам твоим; κτήνη ὑπάρχει — есть скот (ὑπάρχει — «имеется»)."
  5: "εὕρομεν χάριν ἐνώπιόν σου — нашли благодать/благоволение пред тобою. δοθήτω... ἐν κατασχέσει — да будет дана во владение (κατάσχεσις). μὴ διαβιβάσῃς ἡμᾶς τὸν Ιορδάνην — не переведи нас через Иордан (διαβιβάζω)."
  6: "καθῆσθε αὐτοῦ — сидите здесь (κάθημαι; αὐτοῦ — «здесь»). Риторический вопрос с противопоставлением: братья идут на войну, а вы остаётесь."
  7: "διαστρέφετε τὰς διανοίας — развращаете/совращаете помышления (διαστρέφω, διάνοια). μὴ διαβῆναι — чтобы не перейти (διαβαίνω)."
  8: "οὐχ οὕτως ἐποίησαν — не так ли поступили (вопрос-укор). Καδης Βαρνη — Кадес-Варни (Кадес в пустыне Фаран). κατανοῆσαι — осмотреть, разведать (κατανοέω)."
  9: "ἀνέβησαν Φάραγγα βότρυος — взошли в долину грозда (φάραγξ — ущелье; βότρυς — гроздь), т.е. в долину Есхол. ἀπέστησαν τὴν καρδίαν — отвратили сердце (ἀφίστημι). ὅπως μὴ εἰσέλθωσιν — чтобы не вошли."
  10: "ὠργίσθη θυμῷ — воспылал гневом (cognate датив). ὤμοσεν λέγων — поклялся, говоря; далее до ст. 11 — клятва Господа, оформленная вложенной цитатой 『…』."
  11: "Εἰ ὄψονται — «если увидят» — клятвенная формула, означающая «не увидят» (аподосис опущен). ἀπὸ εἰκοσαετοῦς καὶ ἐπάνω — от двадцатилетнего и выше. οἱ ἐπιστάμενοι τὸ κακὸν καὶ τὸ ἀγαθόν — знающие добро и зло (зрелые). ὤμοσα τῷ Αβρααμ καὶ Ισαακ καὶ Ιακωβ — клялся Аврааму, Исааку и Иакову. οὐ γὰρ συνεπηκολούθησαν ὀπίσω μου — ибо не последовали за Мною (συνεπακολουθέω)."
  12: "πλὴν Χαλεβ υἱὸς Ιεφοννη — кроме Халева, сына Иефоннии. ὁ διακεχωρισμένος — отделённый, особый (διαχωρίζω; в Синодальном «Кенезеянин» — иное чтение, в LXX этого нет). Ἰησοῦς ὁ τοῦ Ναυη — Иисус [сын] Навин. ὅτι συνεπηκολούθησεν ὀπίσω κυρίου — ибо последовал за Господом (ед. ч.)."
  13: "κατερρόμβευσεν αὐτούς — «кружил/истомил их» (καταρρομβεύω, редкий глагол; слав. «томи», Синодальный «водил»), т.е. заставил скитаться. τεσσαράκοντα ἔτη — сорок лет. ἕως ἐξανηλώθη — пока не истребился (ἐξαναλίσκω). οἱ ποιοῦντες τὰ πονηρά — делающие злое."
  14: "σύστρεμμα ἀνθρώπων ἁμαρτωλῶν — сборище/отродье людей грешных (σύστρεμμα). προσθεῖναι ἔτι — прибавить ещё (προστίθημι + инфинитив). ἐπὶ τὸν θυμὸν τῆς ὀργῆς — к ярости гнева (удвоение)."
  15: "ἀποστραφήσεσθε ἀπ᾿ αὐτοῦ — отвратитесь от Него (ἀποστρέφω). καταλιπεῖν αὐτὸν ἐν τῇ ἐρήμῳ — оставить Его [народ] в пустыне. ἀνομήσετε εἰς ὅλην τὴν συναγωγήν — согрешите/беззаконнуете против всего общества (ἀνομέω)."
  16: "Ἐπαύλεις προβάτων — дворы/загоны для овец (ἔπαυλις). οἰκοδομήσωμεν — построим (сослагательное с ὧδε). ἀποσκευή — здесь «дети, домочадцы»."
  17: "ἐνοπλισάμενοι — вооружившись (ἐνοπλίζομαι). προφυλακή — охрана, авангард (προφυλακή). πρότεροι τῶν υἱῶν Ισραηλ — первые/впереди сынов Израиля. ἕως ἂν ἀγάγωμεν — пока не приведём (ἄγω). τετειχισμέναις — обнесённые стеной (τειχίζω). διὰ τοὺς κατοικοῦντας τὴν γῆν — из-за жителей земли."
  18: "οὐ μὴ ἀποστραφῶμεν — «не возвратимся» (усиленное отрицание οὐ μή). καταμερισθῶσιν — разделятся, получат надел (καταμερίζω). ἕκαστος εἰς τὴν κληρονομίαν αὐτοῦ — каждый в наследие своё."
  19: "οὐκέτι κληρονομήσωμεν — более не получим наследия (κληρονομέω). ἀπὸ τοῦ πέραν τοῦ Ιορδάνου καὶ ἐπέκεινα — по ту сторону Иордана и далее. ἀπέχομεν τοὺς κλήρους — получили/имеем жребии (ἀπέχω — «получать сполна»). ἐν ἀνατολαῖς — на востоке, т.е. на заиорданской стороне."
  20: "ἐξοπλίσησθε — вооружитесь (ἐξοπλίζω). ἔναντι κυρίου — пред Господом. εἰς πόλεμον — на войну."
  21: "παρελεύσεται... πᾶς ὁπλίτης — перейдёт всякий воин (ὁπλίτης). ἕως ἂν ἐκτριβῇ ὁ ἐχθρὸς αὐτοῦ — пока не истребится враг Его (ἐκτρίβω). ἀπὸ προσώπου αὐτοῦ — от лица Его."
  22: "κατακυριευθῇ ἡ γῆ — земля будет покорена (κατακυριεύω). ἀθῷοι — неповинные, свободные от вины (ἀθῷος). ἐν κατασχέσει — во владение."
  23: "γνώσεσθε τὴν ἁμαρτίαν — узнаете грех свой. ὅταν ὑμᾶς καταλάβῃ τὰ κακά — когда постигнут вас беды (καταλαμβάνω)."
  24: "οἰκοδομήσετε — построите (буд. в знач. имп.). ἀποσκευή — дети. τὸ ἐκπορευόμενον ἐκ τοῦ στόματος — выходящее из уст; ποιήσετε — сделаете."
  25: "ὁ κύριος ἡμῶν — господин наш, т.е. Моисей (не «Господь»; поэтому 主人). ἐντέλλεται — повелевает (ἐντέλλομαι)."
  26: "ἡ ἀποσκευή — дети/домочадцы. αἱ γυναῖκες — жёны. Γαλααδ — Галаад."
  27: "παρελεύσονται — перейдут. ἐνωπλισμένοι καὶ ἐκτεταγμένοι — вооружённые и построенные (ἐκτάσσω). ὃν τρόπον ὁ κύριος λέγει — как господин [наш] говорит."
  28: "συνέστησεν αὐτοῖς — поставил/приставил им (συνίστημι). τοὺς ἄρχοντας πατριῶν τῶν φυλῶν — начальников родов колен."
  29: "διαβῶσιν — перейдут (διαβαίνω). κατακυριεύσητε τῆς γῆς — овладеете землёй. ἀπέναντι ὑμῶν — напротив вас, т.е. перед вами. ἐν κατασχέσει — во владение."
  30: "διαβιβάσετε — переведёте (διαβιβάζω; буд. в знач. имп.). πρότερα ὑμῶν — прежде вас. συγκατακληρονομηθήσονται — получат наследие вместе (συγκατακληρονομέω)."
  31: "Ὅσα ὁ κύριος λέγει — что господин [наш] говорит; θεράπων — слуга (слав. «раб»)."
  32: "διαβησόμεθα — перейдём. ἐν τῷ πέραν τοῦ Ιορδάνου — на той стороне Иордана (для говорящих — восточной)."
  33: "τῷ ἡμίσει φυλῆς Μανασση — половине колена Манассии. βασιλείαν Σηων... Ωγ — царства Сигона и Ога (Аморрейского и Васанского). ὁρίοις — границы, пределы. κύκλῳ — вокруг, окрест."
  34: "ᾠκοδόμησαν — построили (οἰκοδομέω), здесь скорее «отстроили, восстановили». Δαιβων, Αταρωθ, Αροηρ — Дивон, Атароф, Ароер."
  35: "Σωφαρ, Ιαζηρ — Софар, Иазер. ὕψωσαν αὐτάς — возвысили их (ὑψόω), возможно, укрепили/надстроили; в Синодальном этот стих иной (Атароф-Шофан, Иазер, Иогбега)."
  36: "Ναμβρα, Βαιθαραν — Намра, Беф-Гаран. πόλεις ὀχυράς — укреплённые города (ὀχυρός). ἐπαύλεις προβάτων — овчие дворы."
  37: "Εσεβων, Ελεαλη, Καριαθαιμ — Есевон, Елеале, Кириафаим."
  38: "Βεελμεων — Беельмеон. περικεκυκλωμένας — обнесённые кругом (περικυκλόω), т.е. укреплённые. ἐπωνόμασαν κατὰ τὰ ὀνόματα αὐτῶν — назвали по именам своим. Σεβαμα — Севама/Сивма."
  39: "υἱὸς Μαχιρ υἱοῦ Μανασση — сын Махира, сына Манассии (в евр. и Синодальном — «сыны Махира»; LXX ед. ч.). ἀπώλεσεν — погубил, истребил (ἀπόλλυμι)."
  40: "ἔδωκεν... τῷ Μαχιρ — отдал Махиру. κατῴκησεν ἐκεῖ — поселился там."
  41: "Ιαιρ ὁ τοῦ Μανασση — Иаир [сын] Манассии. ἐπαύλεις αὐτῶν — селения их. Ἐπαύλεις Ιαιρ — «Селения Иаировы» (топоним)."
  42: "Ναβαυ — Навав (в Синодальном Новах). Κανααθ — Кенаф. κώμας — села. Ναβωθ — Навоф/Новах. ἐκ τοῦ ὀνόματος αὐτοῦ — по имени своему."
