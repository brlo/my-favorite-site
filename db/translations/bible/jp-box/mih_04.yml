# jp-box, Михей, глава 4. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной. ГРАНИЦА ГЛАВ 4/5: в gr-lxx-byz глава 4 имеет
# 14 стихов, у слав. — 13. Стих gr 4:14 («νῦν ἐμφραχθήσεται θυγάτηρ Εφραιμ…»,
# слав. «Ныне оградится дщи ефремова…») у слав. открывает главу 5 и стоит там
# стихом 5:1; в этой главе он НЕ дублируется. Соответствие дальше: слав. 5:N = gr 5:(N−1)
# до слав. 5:15 = gr 5:14 (у гр. гл. 5 всего 14 стихов). Гл. 6–7 совпадают с gr.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1–2 гора Господня в последние дни, народы текут к ней, «придите,
# взойдём»; 3 мечи на орала, суд над народами, «не будут учиться воевать»;
# 4 каждый под своей лозой и смоковницей; 5 «мы будем ходить во имя Господа»;
# 6–7 в тот день: собрать сокрушённую, остаток, царство на Сионе;
# 8 башня стада, дочь Сиона, «придёт прежнее владычество»; 9–10 родовые муки,
# выход из города, Вавилон, избавление; 11–12 народы собрались на Сион,
# но не знают помысла Господня — снопы на гумне; 13 «встань и молоти»,
# рога железные, народы размельчены, прибыток посвящён Господу.
# Голоса: 1–5 — пророческое слово в 「…」 (в 2 слова народов — 『…』; в 5 голос
# общины «мы»); 6–13 — слово Господа в 「…」 (в 11 слова народов — 『…』).
#
