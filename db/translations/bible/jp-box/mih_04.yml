chapter: 4
draft: true

verses:
  1: "「末[すえ]の日[ひ]々[び]に、主[しゅ]の山[やま]は現[あらわ]れ出[で]て、山[やま]々[やま]の頂[いただき]に備[そな]えられ、丘[おか]々[おか]よりも高[たか]く上[あ]げられる。もろもろの民[たみ]がそこへ急[いそ]いで上[のぼ]って来[く]る。"
  2: "多[おお]くの国民[こくみん]が来[き]て言[い]う。『さあ、主[しゅ]の山[やま]へ、ヤコブの神[かみ]の家[いえ]へ上[のぼ]ろう。主[しゅ]はわたしたちにその道[みち]を示[しめ]し、わたしたちはその道[みち]々[みち]を歩[ある]もう』と。律法[りっぽう]はシオンから、主[しゅ]の言葉[ことば]はエルサレムから出[で]るからである。"
  3: "主[しゅ]は多[おお]くの民[たみ]の間[あいだ]を裁[さば]き、遠[とお]くの強[つよ]い国民[こくみん]を戒[いまし]められる。彼らはその剣[つるぎ]を鋤[すき]に、その槍[やり]を鎌[かま]に打[う]ち変[か]える。国民[こくみん]は国民[こくみん]に向[む]かって剣[つるぎ]を上[あ]げず、もはや戦[たたか]いを学[まな]ばない。"
  4: "それぞれが自分[じぶん]のぶどうの木[き]の下[した]、自分[じぶん]のいちじくの木[き]の下[した]に座[すわ]り、これを恐[おそ]れさせる者[もの]はいない。万軍[ばんぐん]の主[しゅ]の口[くち]がこれを語[かた]られたからである。"
  5: "すべての民[たみ]はそれぞれ自分[じぶん]の神[かみ]の名[な]によって歩[ある]むが、わたしたちは永遠[えいえん]に、いつまでもわたしたちの神[かみ]、主[しゅ]の名[な]によって歩[ある]む。」"
  6: "「その日[ひ]、と主[しゅ]は言[い]われる、わたしは砕[くだ]かれた者[もの]を集[あつ]め、追[お]い払[はら]われた者[もの]を受[う]け入[い]れ、わたしが災[わざわ]いを下[くだ]した者[もの]を集[あつ]める。"
  7: "わたしは砕[くだ]かれた者[もの]を残[のこ]りの者[もの]とし、追[お]い払[はら]われた者[もの]を強[つよ]い国民[こくみん]とする。主[しゅ]はシオンの山[やま]で彼らの上[うえ]に王[おう]として治[おさ]め、今[いま]から永遠[えいえん]に至[いた]る。"
  8: "あなた、羊[ひつじ]の群[む]れの乾[かわ]いたやぐら、シオンの娘[むすめ]よ。あなたにこそ、先[さき]の支[し]配[はい]が来[き]、バビロンからの王国[おうこく]がエルサレムの娘[むすめ]に入[はい]る。"
  9: "今[いま]、なぜあなたは災[わざわ]いを知[し]ったのか。あなたに王[おう]がいないのか。あなたの議[ぎ]官[かん]が滅[ほろ]びたのか。産[さん]婦[ぷ]のように、あなたは苦[くる]しみに捕[と]らえられた。"
  10: "シオンの娘[むすめ]よ、産[さん]婦[ぷ]のように苦[くる]しみ、力[ちから]を出[だ]して産[う]め。今[いま]あなたは都[みやこ]から出[で]て野[の]に住[す]み、バビロンまで行[い]く。そこであなたは救[すく]われる。そこであなたの神[かみ]、主[しゅ]があなたを敵[てき]の手[て]から贖[あがな]い出[だ]される。"
  11: "今[いま]、多[おお]くの国民[こくみん]があなたに集[つど]い、言[い]う。『喜[よろこ]ぼう。わたしたちの目[め]がシオンを見[み]るのだ』と。"
  12: "しかし、彼らは主[しゅ]の思[おも]いを知[し]らず、その計[はかり]ごとを悟[さと]らない。主[しゅ]が彼らを脱[だっ]穀[こく]場[じょう]の束[たば]のように集[あつ]められたことを。"
  13: "シオンの娘[むすめ]よ、立[た]って脱[だっ]穀[こく]せよ。わたしはあなたの角[つの]を鉄[てつ]とし、あなたの爪[つめ]を青銅[せいどう]とする。あなたは多[おお]くの国民[こくみん]を打[う]ち砕[くだ]き、彼らの獲[え]物[もの]を主[しゅ]に、彼らの富[とみ]を全[ぜん]地[ち]の主[しゅ]にささげる。」"

notes:
  1: "ἐπ᾽ ἐσχάτων τῶν ἡμερῶν — «в последние дни» (ἔσχατον — последнее); ἐμφανὲς τὸ ὄρος τοῦ κυρίου — «явлена (видима) гора Господня» (ἐμφανής — явный; слав. «явлена гора Господня»; в ru/МТ «поставлена во главу гор» — иное чтение, в текст не внесено); ἕτοιμον ἐπὶ τὰς κορυφὰς τῶν ὀρέων — «готова на вершинах гор» (слав. «уготована над верхи гор»); μετεωρισθήσεται ὑπεράνω τῶν βουνῶν — «возвысится выше холмов»; σπεύσουσιν πρὸς αὐτὸ λαοί — «поспешат к ней народы» (σπεύδω — спешить)."
  2: "πορεύσονται ἔθνη πολλὰ καὶ ἐροῦσιν — «пойдут народы многие и скажут» (слова народов в 『…』); Δεῦτε ἀναβῶμεν — «придите, взойдём»; δείξουσιν ἡμῖν τὴν ὁδὸν αὐτοῦ — «укажут нам путь Его» (δεικνύω — показывать); πορευσόμεθα ἐν ταῖς τρίβοις αὐτοῦ — «пойдём по стезям Его» (τρίβος — стезя, тропа); ἐκ Σιων ἐξελεύσεται νόμος — «из Сиона выйдет закон»; λόγος κυρίου ἐξ Ιερουσαλημ — «слово Господне из Иерусалима»."
  3: "κρινεῖ ἀνὰ μέσον λαῶν πολλῶν — «будет судить между народами многими»; ἐξελέγξει ἔθνη ἰσχυρὰ ἕως εἰς γῆν μακράν — «обличит народы сильные до земли далёкой» (ἐξελέγχω — обличать); κατακόψουσιν τὰς ῥομφαίας αὐτῶν εἰς ἄροτρα — «перекуют мечи свои на плуги (орала)» (ῥομφαία — меч; ἄροτρον — плуг); τὰ δόρατα αὐτῶν εἰς δρέπανα — «копья свои на серпы» (δρέπανον — серп); οὐκέτι μὴ ἀντάρῃ ἔθνος ἐπ᾽ ἔθνος ῥομφαίαν — «не поднимет более народ на народ меча» (ἀνταίρω — поднимать против); οὐκέτι μὴ μάθωσιν πολεμεῖν — «и не научатся более воевать»."
  4: "ἀναπαύσεται ἕκαστος ὑποκάτω ἀμπέλου αὐτοῦ — «почиет каждый под лозою своею» (ἀναπαύομαι — покоиться); ὑποκάτω συκῆς αὐτοῦ — «под смоковницею своею»; οὐκ ἔσται ὁ ἐκφοβῶν — «не будет устрашающего» (ἐκφοβέω — устрашать); τὸ στόμα κυρίου παντοκράτορος ἐλάλησεν ταῦτα — «уста Господа Вседержителя изрекли это» (παντοκράτωρ — Вседержитель, 万軍の主 по корпусу)."
  5: "πάντες οἱ λαοὶ πορεύσονται ἕκαστος τὴν ὁδὸν αὐτοῦ — «все народы пойдут каждый путём своим»; ἡμεῖς δὲ πορευσόμεθα ἐν ὀνόματι κυρίου θεοῦ ἡμῶν — «мы же пойдём во имя Господа Бога нашего» (голос общины, «мы» — не сглажен); εἰς τὸν αἰῶνα καὶ ἐπέκεινα — «в век и далее» (слав. «в век и далечае»)."
  6: "συνάξω τὴν συντετριμμένην — «соберу сокрушённую» (συντρίβω — сокрушать; ж. р. — о дочери, о городе); τὴν ἐξωσμένην εἰσδέξομαι — «отринутую приму» (ἐξωθέω — выталкивать; εἰσδέχομαι — принимать); οὓς ἀπωσάμην — «которых Я отринул» (ἀπωθέω — отталкивать)."
  7: "θήσομαι τὴν συντετριμμένην εἰς ὑπόλειμμα — «обращу сокрушённую в остаток» (ὑπόλειμμα — остаток); τὴν ἀπωσμένην εἰς ἔθνος ἰσχυρόν — «отринутую — в народ сильный»; βασιλεύσει κύριος ἐπ᾽ αὐτοὺς ἐν ὄρει Σιων — «воцарится Господь над ними на горе Сионе»; ἀπὸ τοῦ νῦν καὶ ἕως εἰς τὸν αἰῶνα — «отныне и до века»."
  8: "πύργος ποιμνίου αὐχμώδης — «башня стада иссохшая» (αὐχμώδης — сухой, измождённый; слав. «столпе паствы мгляный» — «мглистый», иное понимание; в тексте по LXX); θύγατερ Σιων — «дочь Сиона», обращение; ἐπὶ σὲ ἥξει καὶ εἰσελεύσεται ἡ ἀρχὴ ἡ πρώτη — «к тебе придёт и войдёт власть первая» (ἀρχή — власть, начало); βασιλεία ἐκ Βαβυλῶνος τῇ θυγατρὶ Ιερουσαλημ — «царство из Вавилона дочери Иерусалима»: «ἐκ Βαβυλῶνος» в LXX стоит неожиданно (в МТ «царство дочери Иерусалима»), сохранено и отмечено; в тексте оба оборота соединены («прежняя власть придёт… и царство из Вавилона войдёт к дочери Иерусалима»), порядок греческого сохранён."
  9: "Καὶ νῦν ἵνα τί ἔγνως κακά — «и ныне, для чего ты познала злое?» (ἵνα τί — для чего; слав. «вскую познала еси зло»; в ru/МТ «что ты так громко вопиешь» — иное); μὴ βασιλεὺς οὐκ ἦν σοι — «разве не было у тебя царя?»; ἢ ἡ βουλή σου ἀπώλετο — «или погиб совет твой?» (βουλή — совет, замысел); ὅτι κατεκράτησάν σου ὠδῖνες ὡς τικτούσης — «что овладели тобой боли, как рождающей» (ὠδίν — родовая боль; τίκτω — рождать)."
  10: "ὤδινε καὶ ἀνδρίζου — «болей и мужайся» (ὀδίνω — мучиться родами; ἀνδρίζομαι — мужаться); ἔγγιζε ὡς τίκτουσα — «приблизься, как рождающая»; ἐξελεύσῃ ἐκ πόλεως — «выйдешь из города»; κατασκηνώσεις ἐν πεδίῳ — «поселишься в поле» (κατασκηνόω — водворяться); ἥξεις ἕως Βαβυλῶνος — «дойдёшь до Вавилона»; ἐκεῖθεν ῥύσεταί σε — «оттуда избавит тебя» (ῥύομαι — избавлять); ἐκεῖθεν λυτρώσεταί σε κύριος ὁ θεός σου ἐκ χειρὸς ἐχθρῶν σου — «оттуда искупит тебя Господь Бог твой из руки врагов твоих» (λυτρόω — искупать, 贖う)."
  11: "ἐπισυνήχθη ἐπὶ σὲ ἔθνη πολλὰ οἱ λέγοντες — «собрались на тебя народы многие, говорящие» (ἐπισυνάγω — собирать на); Ἐπιχαρούμεθα — «возрадуемся» (ἐπιχαίρω — радоваться, злорадствовать); ἐπόψονται ἐπὶ Σιων οἱ ὀφθαλμοὶ ἡμῶν — «посмотрят на Сион глаза наши» (ἐφοράω — смотреть на, с злорадством; слав. «воззрят на сион очи наши»), слова народов в 『…』."
  12: "αὐτοὶ δὲ οὐκ ἔγνωσαν τὸν λογισμὸν κυρίου — «они же не познали помышления Господня» (λογισμός — помышление, замысел); οὐ συνῆκαν τὴν βουλὴν αὐτοῦ — «и не уразумели совета Его»; ὅτι συνήγαγεν αὐτοὺς ὡς δράγματα ἅλωνος — «что собрал их, как снопы гумна» (δράγμα — сноп; ἅλων — гумно, 脱穀場)."
  13: "ἀνάστηθι καὶ ἀλόα αὐτούς — «встань и молоти их» (ἀλοάω — молотить); θήσομαι τὰ κέρατά σου σιδηρᾶ — «сделаю рога твои железными» (κέρας — рог); τὰς ὁπλάς σου θήσομαι χαλκᾶς — «копыта твои сделаю медными» (ὁπλή — копыто; слав. «пазнокти» — когти, поэтому в тексте 爪, разница отмечена); κατατήξεις ἐν αὐτοῖς ἔθνη — «размельчишь (расплавишь) в них народы» (κατατήκω — расплавлять, размельчать); λεπτυνεῖς λαοὺς πολλούς — «измельчишь народы многие» (λεπτύνω — делать мелким); ἀναθήσεις τῷ κυρίῳ τὸ πλῆθος αὐτῶν — «посвятишь Господу множество их» (ἀνατίθημι — возлагать, посвящать); τὴν ἰσχὺν αὐτῶν τῷ κυρίῳ πάσης τῆς γῆς — «силу их Господу всей земли»."
