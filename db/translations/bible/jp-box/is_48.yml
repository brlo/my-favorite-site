# jp-box, Исаия, глава 48. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный, с МТ) — только для понимания,
# не источник. jp-joc для гл. 48 есть фрагментами (48:17–22), в выгрузку источников
# не входил; сверен по нему только 48:22; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 48: 1–2 обличение дома Иакова (клянутся именем, а не по правде);
# 3–11 «прежнее Я объявлял» — чтобы не сказали «идол мой это сделал»; продан не за
# серебро, изъят из печи бедности; 12–15 «Я первый и в век тот же», призвание Кира
# над Вавилоном; 16 «Господь послал Меня и Дух Его»; 17–21 «если бы ты слушал
# заповеди Мои», выход из Вавилона, вода из скалы; 22 «нечестивым нет радости».
# Речи: 1–2 — обращение пророка без кавычек; 3–16 — слова Господа в 「…」 (в конце
# 48:16 входит голос Посланного: «Господь послал Меня и Дух Его» — в греч. без новой
# формулы); 17–21 — вторая речь Господа в 「…」 (в 48:20 весть «Господь искупил раба
# Своего Иакова» — 『…』); 22 — краткая цитата с формулой.
# Нумерация по gr: 22 стиха; у csl и ru тоже 22. Внутри главы слав. делит иначе:
# «καὶ οὐκ εἶπας» (конец гр. 48:6) слав. переносит в начало 48:7 («и не рекл еси»);
# номера от этого не сдвигаются.
# Паритет: 48:9 — LXX и слав. «покажу тебе ярость Мою», в ru «отлагал гнев Мой»;
# 48:10 — LXX и слав. «продал тебя не за серебро, изъял из печи бедности», в ru
# «расплавил… в горниле страдания»; 48:12 — LXX и слав. «первый и в век», в ru
# «первый и последний»; 48:14 — LXX «любя тебя, Я исполнил волю твою над Вавилоном»,
# в ru «Господь возлюбил его, и он исполнит волю Его»; 48:16 — в LXX один κύριος,
# слав. удваивает «Господь Господь», в ru «Господь Бог» — держим LXX; 48:17 — слав.
# добавляет «Господь» («аз есмь Господь Бог твой»); 48:22 — LXX χαίρειν («радоваться»),
# в ru «нет мира» (по МТ).
# 〔…〕 нет. Сносок ⟨…⟩ нет: 偶像, 刻んだ像, 鋳た像, 炉, 青銅, 鉄, 砂, 塵, 戒め, 栄光,
# 霊, 荒野 уже в корпусе.
# Имена — транслитерация греческого (LXX): ヤコブ, イスラエル, ユダ, バビロン,
# カルデア人, シオン.

