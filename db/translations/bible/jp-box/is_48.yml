verses:
  1: "これを聞[き]け。ヤコブの家[いえ]、イスラエルの名[な]で呼[よ]ばれ、ユダから出[で]た者[もの]たちよ。主[しゅ]、イスラエルの神[かみ]の名によって誓[ちか]いながら、真実[しんじつ]も義[ぎ]もなく、その名を思[おも]い起[お]こす者[もの]たちよ。"
  2: "あなたがたは聖[せい]なる都[みやこ]の名[な]にすがり、イスラエルの神[かみ]に寄[よ]り頼[たの]む。その名[な]は万軍[ばんぐん]の主[しゅ]という。"
  3: "「わたしは昔[むかし]のことを前[まえ]もって告[つ]げた。それはわたしの口[くち]から出[で]て、聞[き]こえるようになった。わたしはにわかに行[おこな]い、それは起[お]こった。"
  4: "わたしは知[し]っている。あなたが頑[かた]くて、あなたの首[くび]の筋[すじ]が鉄[てつ]、あなたの額[ひたい]が青銅[せいどう]であることを。"
  5: "だから、あなたに起[お]こる前[まえ]に、昔[むかし]から告[つ]げておいた。起[お]こる前に、あなたに聞[き]かせた。『わたしの偶像[ぐうぞう]がこれをした』と言[い]ってはならない。『刻[きざ]んだ像[ぞう]と鋳[い]た像[ぞう]が、わたしに命[めい]じた』と言ってはならない。"
  6: "あなたがたはすべてを聞[き]いた。しかし、あなたがたは知[し]らなかった。今[いま]から、これから起[お]こる新[あたら]しいことを、わたしはあなたに聞[き]かせる。あなたはそれについて何[なに]も言[い]わなかった。"
  7: "それは今[いま]起[お]こり、昔[むかし]のことではない。あなたはこれを以前[いぜん]の日[ひ]々[び]に聞[き]いたことがない。『そうだ、わたしはそれを知[し]っている』と言[い]ってはならない。"
  8: "あなたは知[し]らず、悟[さと]らず、初[はじ]めから耳[みみ]を開[ひら]かれたこともなかった。わたしは知[し]っていたからである。あなたが必[かなら]ず裏切[うらぎ]り、胎[たい]から不[ふ]法[ほう]な者[もの]と呼ばれることを。"
  9: "わたしの名[な]のために、わたしはあなたに怒[いか]りを示[しめ]し、あなたの上[うえ]にわたしの栄[は]えあることを臨[のぞ]ませる。あなたを滅[ほろ]ぼし尽[つ]くさないためである。"
  10: "見[み]よ、わたしはあなたを銀[ぎん]のために売[う]ったのではない。あなたを貧[まず]しさの炉[ろ]から取[と]り出[だ]した。"
  11: "わたし自身[じしん]のために、わたしはあなたに対して行[おこな]う。わたしの名[な]が汚[けが]されているからである。わたしはわたしの栄光[えいこう]をほかの者[もの]に与[あた]えない。"
  12: "ヤコブよ、わたしが呼[よ]ぶイスラエルよ、わたしの言[ことば]を聞[き]け。わたしは初[はじ]めの者[もの]、わたしは永遠[えいえん]にわたってわたしである。"
  13: "わたしの手[て]は地[ち]を据[す]え、わたしの右[みぎ]の手は天[てん]を固[かた]めた。わたしが彼[かれ]らを呼[よ]べば、彼らはともに立[た]つ。"
  14: "すべてもろもろの者[もの]が集[あつ]まって聞[き]くがよい。だれが彼[かれ]らにこれらのことを告[つ]げたのか。わたしはあなたを愛[あい]し、バビロンに対[たい]してあなたの望[のぞ]みを成[な]し遂[と]げ、カルデア人[じん]の種[たね]を取[と]り去[さ]った。"
  15: "わたしが語[かた]り、わたしが呼[よ]んだ。わたしは彼[かれ]を連[つ]れて来[き]て、その道[みち]を栄[さか]えさせた。"
  16: "わたしに近[ちか]づいて、これを聞[き]け。わたしは初[はじ]めから隠[かく]れて語[かた]ったのではなく、暗[くら]い地[ち]の場[ば]所[しょ]で語ったのでもない。それが起[お]こったとき、わたしはそこにいた。今[いま]、主[しゅ]とその霊[れい]が、わたしを遣[つか]わされた。」"
  17: "あなたを贖[あがな]う方[かた]、イスラエルの聖[せい]なる方[かた]である主[しゅ]はこう言[い]われる。「わたしは主[しゅ]、あなたの神[かみ]である。あなたが歩[あゆ]むべき道[みち]を見[み]いだすために、わたしはあなたを教[おし]えてきた。"
  18: "あなたがわたしの戒[いまし]めに聞[き]いていたなら、あなたの平和[へいわ]は川[かわ]のように、あなたの義[ぎ]は海[うみ]の波[なみ]のようになったであろうに。"
  19: "あなたの子孫[しそん]は砂[すな]のように、あなたの胎[たい]の産[う]みの子[こ]らは地[ち]の塵[ちり]のようになったであろうに。あなたは滅[ほろ]ぼされず、あなたの名[な]もわたしの前[まえ]から消[き]えることはなかったであろうに。"
  20: "バビロンから出[で]よ。カルデア人[じん]のところから逃[に]げよ。喜[よろこ]びの声[こえ]を告[つ]げ、これを聞[き]こえるようにせよ。地[ち]の果[は]てまで告げよ。『主[しゅ]はそのしもべヤコブを贖[あがな]われた』と言[い]え。"
  21: "彼[かれ]らが渇[かわ]いても、荒野[こうや]を通[とお]って導[みちび]き、岩[いわ]から水[みず]を出[だ]して彼らに与[あた]える。岩は裂[さ]け、水は流[なが]れ、わたしの民[たみ]はそれを飲[の]む。」"
  22: "「悪[あく]しき者[もの]たちに喜[よろこ]びはない」と主[しゅ]は言[い]われる。"

notes:
  1: "Ἀκούσατε ταῦτα, οἶκος Ιακωβ — «слушайте это, дом Иакова»; οἱ κεκλημένοι τῷ ὀνόματι Ισραηλ — «называемые именем Израиля»; οἱ ἐξ Ιουδα ἐξελθόντες — «вышедшие из Иуды» (в ru/МТ «от источника Иудина» — по МТ). οἱ ὀμνύοντες τῷ ὀνόματι κυρίου θεοῦ Ισραηλ — «клянущиеся именем Господа, Бога Израилева»; μιμνῃσκόμενοι οὐ μετὰ ἀληθείας οὐδὲ μετὰ δικαιοσύνης — «вспоминающие не по истине и не по правде» (причастия при одном подлежащем)."
  2: "καὶ ἀντεχόμενοι τῷ ὀνόματι τῆς πόλεως τῆς ἁγίας — «и держащиеся имени города святого» (ἀντέχομαι); ἐπὶ τῷ θεῷ τοῦ Ισραηλ ἀντιστηριζόμενοι — «и на Бога Израилева опирающиеся» (ἀντιστηρίζω). В греч. у стиха нет главного сказуемого: цепь причастий продолжается с 48:1, поэтому в японском добавлено 者たちよ и дано отдельное утверждение. κύριος σαβαωθ ὄνομα αὐτῷ — «Господь Саваоф имя Ему» (万軍の主)."
  3: "Τὰ πρότερα ἔτι ἀνήγγειλα — «прежнее Я ещё возвестил»; ἐκ τοῦ στόματός μου ἐξῆλθεν καὶ ἀκουστὸν ἐγένετο — «из уст Моих вышло и слышимым стало»; ἐξάπινα ἐποίησα, καὶ ἐπῆλθεν — «внезапно Я сделал, и пришло» (ἐξάπινα — внезапно; слав. «внезапу сотворих, и найде»). С 48:3 по 48:16 — слова Господа в 「…」."
  4: "γινώσκω ἐγὼ ὅτι σκληρὸς εἶ — «знаю Я, что ты жесток [упорен]» (σκληρός); νεῦρον σιδηροῦν ὁ τράχηλός σου — «жила железная шея твоя» (νεῦρον — жила, сухожилие; τράχηλος — шея); τὸ μέτωπόν σου χαλκοῦν — «лоб твой медный» (χαλκοῦς — медный, 青銅). Три образа упрямства сохранены."
  5: "καὶ ἀνήγγειλά σοι πάλαι, πρὶν ἐλθεῖν ἐπὶ σὲ ἀκουστόν σοι ἐποίησα — «и возвестил тебе давно, прежде чем пришло на тебя, сделал тебе слышимым». μὴ εἴπῃς ὅτι Τὰ εἴδωλά μου ἐποίησαν — «не скажи: идолы мои сделали [это]» (ὅτι с прямой речью, поэтому 『…』); τὰ γλυπτὰ καὶ τὰ χωνευτὰ ἐνετείλατό μοι — «изваянное и литое заповедало мне» (χωνευτόν — 鋳た像)."
  6: "ἠκούσατε πάντα, καὶ ὑμεῖς οὐκ ἔγνωτε — «вы слышали всё, и вы не познали»; ἀκουστά σοι ἐποίησα τὰ καινὰ ἀπὸ τοῦ νῦν — «сделал тебе слышимым новое отныне»; ἃ μέλλει γίνεσθαι — «что имеет быть». καὶ οὐκ εἶπας — «и ты не сказал» (в слав. эта фраза отнесена к началу 48:7, «и не рекл еси»; держим деление gr)."
  7: "νῦν γίνεται καὶ οὐ πάλαι — «теперь происходит, а не давно»; οὐ προτέραις ἡμέραις ἤκουσας αὐτά — «не в прежние дни ты слышал это». μὴ εἴπῃς ὅτι Ναί, γινώσκω αὐτά — «не скажи: да, я знаю это» (в тексте 『…』)."
  8: "οὔτε ἔγνως οὔτε ἠπίστω — «ты и не знал, и не верил» (ἀπιστέω — не верить, не понимать); οὔτε ἀπ᾿ ἀρχῆς ἤνοιξά σου τὰ ὦτα — «и от начала не открыл тебе уши». ἔγνων γὰρ ὅτι ἀθετῶν ἀθετήσεις — «ибо Я знал, что отвергая отвергнешь» (ἀθετέω; слав. «отвергая отринеши»); ἄνομος ἔτι ἐκ κοιλίας κληθήσῃ — «беззаконником ещё от чрева назовёшься» (в gr опечатка κηλθήσῃ вм. κληθήσῃ)."
  9: "ἕνεκεν τοῦ ἐμοῦ ὀνόματος δείξω σοι τὸν θυμόν μου — «ради имени Моего покажу тебе ярость Мою» (слав. «имене моего ради покажу ти ярость мою»); τὰ ἔνδοξά μου ἐπάξω ἐπὶ σοί — «славное Моё наведу на тебя» (ἐπάγω); ἵνα μὴ ἐξολεθρεύσω σε — «чтобы не истребить тебя». В ru «отлагал гнев Мой» — иное чтение (по МТ)."
  10: "ἰδοὺ πέπρακά σε οὐχ ἕνεκεν ἀργυρίου — «вот, Я продал тебя не ради серебра» (πωλέω, perfect; слав. «продах тя не сребра ради»); ἐξειλάμην δέ σε ἐκ καμίνου πτωχείας — «и изъял тебя из печи бедности» (κάμινος — печь, горнило; πτωχεία — бедность; 炉). В ru «расплавил тебя… испытал в горниле страдания» — по МТ, не внесено."
  11: "ἕνεκεν ἐμοῦ ποιήσω σοι — «ради Меня сделаю тебе [это]» (слав. «мене ради сотворю ти»); ὅτι τὸ ἐμὸν ὄνομα βεβηλοῦται — «ибо имя Моё хулится, оскверняется» (βεβηλόω); τὴν δόξαν μου ἑτέρῳ οὐ δώσω — «славы Моей иному не дам». Слав. «яко мое имя оскверняется» — тот же смысл."
  12: "Ἄκουέ μου, Ιακωβ καὶ Ισραηλ ὃν ἐγὼ καλῶ — «слушай Меня, Иаков и Израиль, которого Я призываю»; ἐγώ εἰμι πρῶτος — «Я есмь первый»; ἐγώ εἰμι εἰς τὸν αἰῶνα — «Я есмь в век» (слав. «аз есмь во век»). В ru/МТ «Я первый и Я последний» — по МТ, держим LXX."
  13: "καὶ ἡ χείρ μου ἐθεμελίωσεν τὴν γῆν — «и рука Моя основала землю» (θεμελιόω); ἡ δεξιά μου ἐστερέωσεν τὸν οὐρανόν — «десница Моя утвердила небо» (στερεόω); καλέσω αὐτούς, καὶ στήσονται ἅμα — «призову их, и станут вместе». Слав. «призову я, и станут вкупе» — тот же образ."
  14: "καὶ συναχθήσονται πάντες καὶ ἀκούσονται — «и соберутся все и услышат»; τίς αὐτοῖς ἀνήγγειλεν ταῦτα — «кто им возвестил это». ἀγαπῶν σε ἐποίησα τὸ θέλημά σου ἐπὶ Βαβυλῶνα — «любя тебя, Я исполнил волю твою над Вавилоном» (ἀγαπάω, причастие; слав. «любя тя сотворих волю твою над вавилоном»); τοῦ ἆραι σπέρμα Χαλδαίων — «чтобы убрать семя халдеев». В ru/МТ «Господь возлюбил его, и он исполнит волю Его» — иное чтение."
  15: "ἐγὼ ἐλάλησα, ἐγὼ ἐκάλεσα — «Я сказал, Я призвал»; ἤγαγον αὐτὸν καὶ εὐόδωσα τὴν ὁδὸν αὐτοῦ — «привёл его и благоустроил путь его» (повтор из 46:11). «Он» здесь — тот, кого Господь призвал (Кир), без имени, как и в греч."
  16: "προσαγάγετε πρός με καὶ ἀκούσατε ταῦτα — «приступите ко Мне и слушайте это»; οὐκ ἀπ᾿ ἀρχῆς ἐν κρυφῇ ἐλάλησα — «не от начала в тайне говорил Я»; οὐδὲ ἐν τόπῳ γῆς σκοτεινῷ — «и не в месте земли тёмном»; ἡνίκα ἐγένετο, ἐκεῖ ἤμην — «когда это происходило, там Я был». καὶ νῦν κύριος ἀπέσταλκέν με καὶ τὸ πνεῦμα αὐτοῦ — «и ныне Господь послал Меня и Дух Его»: в LXX один κύριος, слав. удваивает («Господь Господь посла мя и дух его»), в ru/МТ «Господь Бог» — держим LXX. Здесь голос Посланного (Раба, ср. 49:1–7; 50:4–9), без новой формулы; этим стихом речь закрывается."
  17: "οὕτως λέγει κύριος ὁ ῥυσάμενός σε ὁ ἅγιος Ισραηλ — «так говорит Господь, избавивший тебя, Святой Израилев»; Ἐγώ εἰμι ὁ θεός σου — «Я Бог твой» (слав. добавляет «Господь»: «аз есмь Господь Бог твой» — внесено по паритету). δέδειχά σοι τοῦ εὑρεῖν σε τὴν ὁδόν — «Я показал тебе, чтобы найти тебе путь» (δείκνυμι, perfect); ἐν ᾗ πορεύσῃ ἐν αὐτῇ — «по которому ты пойдёшь». С 48:17 по 48:21 — вторая речь Господа в 「…」."
  18: "καὶ εἰ ἤκουσας τῶν ἐντολῶν μου — «и если бы ты послушал заповеди Мои» (ἐντολή — 戒め); ἐγένετο ἂν ὡσεὶ ποταμὸς ἡ εἰρήνη σου — «стал бы как река мир твой»; ἡ δικαιοσύνη σου ὡς κῦμα θαλάσσης — «правда твоя как волна морская» (κῦμα). Ирреальное условие передано оборотом …であろうに."
  19: "καὶ ἐγένετο ἂν ὡς ἡ ἄμμος τὸ σπέρμα σου — «и стало бы как песок семя твоё»; τὰ ἔκγονα τῆς κοιλίας σου ὡς ὁ χοῦς τῆς γῆς — «порождения чрева твоего как прах земной» (ἔκγονα, χοῦς). οὐδὲ νῦν οὐ μὴ ἐξολεθρευθῇς — «и ныне ты не был бы истреблён» (ἐξολεθρεύω; слав. «ниже ныне потребишися»); οὐδὲ ἀπολεῖται τὸ ὄνομά σου ἐνώπιόν μου — «и не погибло бы имя твоё предо Мною»."
  20: "Ἔξελθε ἐκ Βαβυλῶνος φεύγων ἀπὸ τῶν Χαλδαίων — «выйди из Вавилона, беги от халдеев» (ед. ч., как и в слав.); φωνὴν εὐφροσύνης ἀναγγείλατε — «голос радости возвестите» (далее мн. ч., сбой числа оригинала сохранён). ἀπαγγείλατε ἕως ἐσχάτου τῆς γῆς — «возвестите до последних земли»; λέγετε· Ἐρρύσατο κύριος τὸν δοῦλον αὐτοῦ Ιακωβ — «говорите: избавил Господь раба Своего Иакова» (весть — 『…』 внутри речи Господа)."
  21: "καὶ ἐὰν διψήσωσιν, δι᾿ ἐρήμου ἄξει αὐτούς — «и если возжаждут, через пустыню проведёт их» (подлежащее не названо); ὕδωρ ἐκ πέτρας ἐξάξει αὐτοῖς — «воду из камня изведёт им»; σχισθήσεται πέτρα — «расколется камень» (σχίζω); ῥυήσεται ὕδωρ — «потечёт вода» (ῥέω); πίεται ὁ λαός μου — «и будет пить народ Мой» (πίνω). Здесь закрывается вторая речь 「…」."
  22: "οὐκ ἔστιν χαίρειν τοῖς ἀσεβέσιν — «нет радости нечестивым» (χαίρειν — радоваться; слав. «несть радоватися нечестивым»), λέγει κύριος — «говорит Господь». В ru/МТ «нет мира» (εἰρήνη) — иное чтение, держим LXX и слав.; jp-joc в этом стихе тоже даёт 平安, но здесь основа — греческий."
