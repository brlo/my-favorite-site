verses:
  0: "ダビデの詩[うた]。週[しゅう]の第四[だいよん]の日[ひ]のもの。"
  1: "主[しゅ]は復讐[ふくしゅう]の神[かみ]、復讐[ふくしゅう]の神[かみ]は自[みずか]らを現[あらわ]された。"
  2: "地[ち]を裁[さば]く方[かた]よ、立[た]ち上[あ]がってください。高[たか]ぶる者[もの]たちに、その報[むく]いを返[かえ]してください。"
  3: "主[しゅ]よ、罪[つみ]人[びと]はいつまで、罪[つみ]人[びと]はいつまで誇[ほこ]るのか。"
  4: "彼[かれ]らは口[くち]を開[ひら]いて不義[ふぎ]を語[かた]り、不法[ふほう]を行[おこな]う者[もの]はみな語[かた]る。"
  5: "主[しゅ]よ、彼[かれ]らはあなたの民[たみ]を踏[ふ]みにじり、あなたの嗣業[しぎょう]を損[そこな]った。"
  6: "彼[かれ]らは寡婦[やもめ]と寄留[きりゅう]の者[もの]を殺[ころ]し、みなしごを虐殺[ぎゃくさつ]した。"
  7: "そして言[い]った。「主[しゅ]は見[み]ない。ヤコブの神[かみ]は悟[さと]らない」と。"
  8: "民[たみ]のうちの愚[おろ]かな者[もの]たちよ、悟[さと]れ。愚[おろ]か者[もの]たちよ、いつになったら分別[ふんべつ]がつくのか。"
  9: "耳[みみ]を植[う]えられた方[かた]は聞[き]かれないのだろうか。目[め]を形[かたち]づくられた方[かた]は見[み]られないのだろうか。"
  10: "諸[しょ]民[みん]を戒[いまし]められる方[かた]が責[せ]めないはずがあろうか。人[ひと]に知識[ちしき]を教[おし]えられる方[かた]が、責[せ]めないはずがあろうか。"
  11: "主[しゅ]は人[ひと]の思[おも]いのむなしいことを知[し]っておられる。"
  12: "主[しゅ]よ、あなたが戒[いまし]め、あなたの律法[りっぽう]によって教[おし]えられる人[ひと]は、幸[さいわ]いである。"
  13: "あなたはその人[ひと]を悪[わる]い日[ひ]々[び]から安[やす]らかにし、罪[つみ]人[びと]のために穴[あな]が掘[ほ]られるまで、彼[かれ]を安[やす]らかにされる。"
  14: "主[しゅ]はご自分[じぶん]の民[たみ]を退[しりぞ]けず、その嗣業[しぎょう]を捨[す]てられない。"
  15: "それは、義[ぎ]が裁[さば]きに帰[かえ]るまでである。心[こころ]の正[ただ]しい者[もの]はみな、それに従[したが]う。"
  16: "だれがわたしのために立[た]ち上[あ]がって、悪[わる]を行[おこな]う者[もの]たちに立[た]ち向[む]かうだろうか。だれがわたしとともに立[た]って、不法[ふほう]を行[おこな]う者[もの]たちに抗[こう]するだろうか。"
  17: "もし主[しゅ]がわたしを助[たす]けてくださらなければ、わたしの魂[たましい]はまもなく陰府[よみ]に住[す]むことになった。"
  18: "「わたしの足[あし]は滑[すべ]った」とわたしが言[い]うとき、主[しゅ]よ、あなたのあわれみがわたしを支[ささ]えてくださった。"
  19: "主[しゅ]よ、わたしの心[こころ]に多[おお]くの苦[くる]しみがあるとき、あなたの慰[なぐさ]めはわたしの魂[たましい]を喜[よろこ]ばせた。"
  20: "不法[ふほう]の王座[おうざ]があなたとともにあるでしょうか。苦[くる]しみを造[つく]り出[だ]す者が、あなたの定[さだ]めによって、そこに据[す]えられるでしょうか。"
  21: "彼[かれ]らは正[ただ]しい者[もの]の命[いのち]を狙[ねら]い、罪[つみ]のない血[ち]を罪[つみ]に定[さだ]める。"
  22: "しかし、主[しゅ]はわたしの逃[に]げ場[ば]、わたしの神[かみ]はわたしの望[のぞ]みの支[ささ]えとなってくださった。"
  23: "主[しゅ]は彼[かれ]らの不法[ふほう]を彼[かれ]らに返[かえ]し、その悪[わる]に応[おう]じて、わたしたちの神[かみ]である主[しゅ]は彼[かれ]らを滅[ほろ]ぼされる。"

notes:
  0: "Ψαλμὸς τῷ Δαυιδ, τετράδι σαββάτων — «Псалом Давиду, в четвёртый день суббот» (τετράς — «четвёртый день, среда»; слав. «в четвертый субботы»). Надписание — стих 0."
  1: "ὁ θεὸς ἐκδικήσεων κύριος — 主は復讐の神 (ἐκδίκησις — «мщение, отмщение»; в евр. «Бог отмщений»). ὁ θεὸς ἐκδικήσεων ἐπαρρησιάσατο — 復讐の神は自らを現された (παρρησιάζομαι — «являть себя открыто»)."
  2: "ὑψώθητι, ὁ κρίνων τὴν γῆν — 地を裁く方よ、立ち上がってください (ὑψόω — «возноситься»; κρίνω — 裁く). ἀπόδος ἀνταπόδοσιν τοῖς ὑπερηφάνοις — 高ぶる者たちに、その報いを返してください (ἀνταπόδοσις — «воздаяние»; ὑπερήφανος — 高ぶる者)."
  3: "ἕως πότε ἁμαρτωλοί, κύριε — 主よ、罪人はいつまで (ἕως πότε — «доколе»). ἕως πότε ἁμαρτωλοὶ καυχήσονται — 罪人はいつまで誇るのか (καυχάομαι — «хвалиться»; повтор сохранён)."
  4: "φθέγξονται καὶ λαλήσουσιν ἀδικίαν — 彼らは口を開いて不義を語り (φθέγγομαι — «изрекать»; ἀδικία — 不義). λαλήσουσιν πάντες οἱ ἐργαζόμενοι τὴν ἀνομίαν — 不法を行う者はみな語る (вопрос 3–4 в слав. слитный; передано утверждением)."
  5: "τὸν λαόν σου, κύριε, ἐταπείνωσαν — 主よ、彼らはあなたの民を踏みにじり (ταπεινόω — «уничижать, попирать»). τὴν κληρονομίαν σου ἐκάκωσαν — あなたの嗣業を損なった (κληρονομία — 嗣業; κακόω — «озлоблять, разорять»)."
  6: "χήραν καὶ προσήλυτον ἀπέκτειναν — 彼らは寡婦と寄留の者を殺し (χήρα — 寡婦; προσήλυτος — «пришелец»). ὀρφανοὺς ἐφόνευσαν — みなしごを虐殺した (ὀρφανός — «сирота»; φονεύω — «умерщвлять»; 虐殺, чтобы отличить от ἀποκτείνω)."
  7: "καὶ εἶπαν — そして言った (слова притеснителей — 「」). Οὐκ ὄψεται κύριος — 主は見ない. οὐδὲ συνήσει ὁ θεὸς τοῦ Ιακωβ — ヤコブの神は悟らない (συνίημι — «уразумевать»)."
  8: "σύνετε δή, ἄφρονες ἐν τῷ λαῷ — 民のうちの愚かな者たちよ、悟れ (ἄφρων — «безумный»). μωροί, ποτὲ φρονήσατε — 愚か者たちよ、いつになったら分別がつくのか (μωρός — «глупый»; φρονέω — «мыслить, быть разумным»)."
  9: "ὁ φυτεύσας τὸ οὖς οὐχὶ ἀκούει — 耳を植えられた方が聞かれないのだろうか (φυτεύω — «сажать»; οὖς — 耳). ὁ πλάσας τὸν ὀφθαλμὸν οὐ κατανοεῖ — 目を形づくられた方が見られないのだろうか (πλάσσω — «образовывать»; κατανοέω — «внимательно смотреть»)."
  10: "ὁ παιδεύων ἔθνη οὐχὶ ἐλέγξει — 諸民を戒められる方が責めないはずがあろうか (παιδεύω — «наставлять, наказывать»; ἐλέγχω — «обличать»). ὁ διδάσκων ἄνθρωπον γνῶσιν — 人に知識を教えられる方が (γνῶσις — 知識; греч. вторая половина стиха оборвана, смысл вопроса сохранён повтором)."
  11: "κύριος γινώσκει τοὺς διαλογισμοὺς τῶν ἀνθρώπων — 主は人の思いを…知っておられる (διαλογισμός — «помышление»). ὅτι εἰσὶν μάταιοι — むなしいことを (μάταιος — «суетный»)."
  12: "μακάριος ἄνθρωπος, ὃν ἂν σὺ παιδεύσῃς, κύριε — 主よ、あなたが戒め…る人は幸いである (μακάριος — 幸い). ἐκ τοῦ νόμου σου διδάξῃς αὐτόν — あなたの律法によって教えられる (νόμος — 律法)."
  13: "τοῦ πραῦναι αὐτῷ ἀφ᾿ ἡμερῶν πονηρῶν — あなたはその人を悪い日々から安らかにし (πραΰνω — «успокаивать»). ἕως οὗ ὀρυγῇ τῷ ἁμαρτωλῷ βόθρος — 罪人のために穴が掘られるまで (ὀρύσσω — «копать»; βόθρος — «яма»)."
  14: "οὐκ ἀπώσεται κύριος τὸν λαὸν αὐτοῦ — 主はご自分の民を退けず (ἀπωθέω — «отталкивать»). τὴν κληρονομίαν αὐτοῦ οὐκ ἐγκαταλείψει — その嗣業を捨てられない (ἐγκαταλείπω — «оставлять»)."
  15: "ἕως οὗ δικαιοσύνη ἐπιστρέψῃ εἰς κρίσιν — それは、義が裁きに帰るまでである (ἐπιστρέφω — «обращаться»; слав. «дондеже правда обратится в суд»). ἐχόμενοι αὐτῆς πάντες οἱ εὐθεῖς τῇ καρδίᾳ — 心の正しい者はみな、それに従う (ἔχομαι — «держаться»; εὐθύς — «правый»). διάψαλμα не передаётся."
  16: "τίς ἀναστήσεταί μοι ἐπὶ πονηρευομένους — だれがわたしのために立ち上がって、悪を行う者たちに立ち向かうだろうか (ἐπανίστημι — «восставать против»). τίς συμπαραστήσεταί μοι — だれがわたしとともに立って (συμπαρίστημι — «вставать рядом»)."
  17: "εἰ μὴ ὅτι κύριος ἐβοήθησέν μοι — もし主がわたしを助けてくださらなければ (βοηθέω — «помогать»). παρὰ βραχὺ παρῴκησεν τῷ ᾅδῃ ἡ ψυχή μου — わたしの魂はまもなく陰府に住むことになった (παρὰ βραχύ — «почти»; παροικέω — «обитать»; ᾅδης — 陰府)."
  18: "εἰ ἔλεγον Σεσάλευται ὁ πούς μου — 「わたしの足は滑った」とわたしが言うとき (σαλεύω — «колебать»; слова псалмопевца — 「」). τὸ ἔλεός σου, κύριε, βοηθεῖ μοι — 主よ、あなたのあわれみがわたしを支えてくださった (βοηθέω — «помогать, поддерживать»)."
  19: "κατὰ τὸ πλῆθος τῶν ὀδυνῶν μου ἐν τῇ καρδίᾳ μου — わたしの心に多くの苦しみがあるとき (πλῆθος — «множество»; ὀδύνη — «боль»). αἱ παρακλήσεις σου ἠγάπησαν τὴν ψυχήν μου — あなたの慰めはわたしの魂を喜ばせた (παράκλησις — 慰め; ἀγαπάω — «возлюбили», то есть утешения стали дороги душе)."
  20: "μὴ συμπροσέσται σοι θρόνος ἀνομίας — 不法の王座があなたとともにあるでしょうか (συμπάρειμι — «быть вместе»; ответ подразумевается отрицательный). ὁ πλάσσων κόπον ἐπὶ προστάγματι — 苦しみを造り出す者が、あなたの定めによって (πλάσσω — «образовывать»; κόπος — «труд, страдание»; πρόσταγμα — «повеление»; место тёмное, слав. «созидаяй труд на повеление»)."
  21: "θηρεύσουσιν ἐπὶ ψυχὴν δικαίου — 彼らは正しい者の命を狙い (θηρεύω — «ловить, подстерегать»). αἷμα ἀθῷον καταδικάσονται — 罪のない血を罪に定める (ἀθῷος — «невинный»; καταδικάζω — «осуждать»)."
  22: "ἐγένετό μοι κύριος εἰς καταφυγήν — 主はわたしの逃げ場となってくださった (καταφυγή — 逃げ場). ὁ θεός μου εἰς βοηθὸν ἐλπίδος μου — わたしの神はわたしの望みの支えとなってくださった (βοηθός — «помощник»)."
  23: "ἀποδώσει αὐτοῖς τὴν ἀνομίαν αὐτῶν — 主は彼らの不法を彼らに返し (ἀποδίδωμι — «воздавать»). κατὰ τὴν πονηρίαν αὐτῶν ἀφανιεῖ αὐτούς — その悪に応じて…彼らを滅ぼされる (πονηρία — «злоба»; ἀφανίζω — «истреблять»). κύριος ὁ θεὸς ἡμῶν — わたしたちの神である主."
