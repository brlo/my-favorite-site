verses:
  1: "主[しゅ]からエレミヤに臨[のぞ]んだ言葉[ことば]は、こうである。"
  2: "「この契約[けいやく]の言葉[ことば]を聞[き]け。そして、あなたはユダの人々[ひとびと]と、エルサレムに住[す]む者[もの]たちに語[かた]らなければならない。"
  3: "そして彼[かれ]らに言[い]え。イスラエルの神[かみ]、主[しゅ]はこう言[い]われる。この契約[けいやく]の言葉[ことば]を聞[き]かない人[ひと]は呪[のろ]われる。"
  4: "すなわち、あなたがたの父[ちち]たちに命[めい]じたところのものである。わたしが彼[かれ]らをエジプトの地[ち]から、鉄[てつ]の炉[ろ]から導[みちび]き上[あ]げた日[ひ]、わたしはこう言[い]って命[めい]じた。わたしの声[こえ]を聞[き]き、わたしがあなたがたに命[めい]じるすべてのことを行[おこな]え。そうすれば、あなたがたはわたしの民[たみ]となり、わたしはあなたがたの神[かみ]となる。"
  5: "わたしがあなたがたの父[ちち]たちに誓[ちか]った誓[ちか]いを果[は]たすためである。すなわち、彼らに乳[ちち]と蜜[みつ]の流[なが]れる地[ち]を与[あた]えるという誓いを。今日[きょう]のとおりである。」わたしは答[こた]えて言[い]った。「そのとおりになりますように、主[しゅ]よ。」"
  6: "主[しゅ]はわたしに言[い]われた。「これらの言葉[ことば]を、ユダの町[まち]々[まち]と、エルサレムの外[そと]で読[よ]み上[あ]げ、こう言[い]え。この契約[けいやく]の言葉[ことば]を聞[き]いて、それを行[おこな]え。"
  7: "なぜなら、わたしはあなたがたの父[ちち]たちをエジプトの地[ち]から導[みちび]き出[だ]した日[ひ]から、今日[こんにち]この日[ひ]に至[いた]るまで、朝[あさ]早[はや]く起[お]きては、彼らに証[あかし]し続[つづ]けて言[い]った。わたしの声[こえ]を聞[き]け、と。"
  8: "しかし、彼[かれ]らは聞[き]かず、耳[みみ]を傾[かたむ]けず、おのおの自分[じぶん]の悪[わる]い心[こころ]の頑[かたくな]さに従[したが]って歩[あゆ]んだ。それゆえ、わたしは彼らの上[うえ]に、この契約[けいやく]のすべての言葉[ことば]を臨[のぞ]ませた。それは彼らが行[おこな]うように命[めい]じたものだったが、彼らは行[おこな]わなかった。」"
  9: "主[しゅ]はわたしに言[い]われた。「ユダの人々[ひとびと]の間[あいだ]に、またエルサレムに住[す]む者[もの]たちの間に、陰謀[いんぼう]が見[み]つかった。"
  10: "彼[かれ]らは、昔[むかし]の父[ちち]たちの不法[ふほう]に戻[もど]った。その父たちはわたしの言葉[ことば]を聞[き]くことを望[のぞ]まなかった。見[み]よ、彼ら自身[じしん]も異[い]なる神々[かみがみ]の後[あと]に歩[あゆ]み、それらに仕[つか]えている。イスラエルの家[いえ]とユダの家[いえ]は、わたしが彼らの父たちと結[むす]んだわたしの契約[けいやく]を破[やぶ]った。"
  11: "それゆえ、主[しゅ]はこう言[い]われる。見[み]よ、わたしはこの民[たみ]の上[うえ]に災[わざわ]いを臨[のぞ]ませる。彼らはそこから逃[に]げ出[だ]すことができない。彼らがわたしに叫[さけ]んでも、わたしは彼らを聞[き]かない。"
  12: "ユダの町[まち]々[まち]とエルサレムの住[す]む者[もの]たちは行[い]って、自分[じぶん]たちが香[こう]をたいて仕[つか]えている神々[かみがみ]に叫[さけ]ぶ。彼らの災[わざわ]いの時[とき]に、その神々が彼らを救[すく]うだろうか。"
  13: "ユダよ、あなたの町[まち]の数[かず]だけ、あなたの神々[かみがみ]があった。エルサレムの通[とお]り路[じ]の数[かず]だけ、あなたがたはバアルに香[こう]をたくための祭壇[さいだん]を立[た]てた。それは恥[はず]べき祭壇[さいだん]である。"
  14: "あなたは、この民[たみ]のために祈[いの]ってはならない。彼らのために、願[ねが]いと祈りをもって求[もと]めてはならない。彼らがわたしを呼[よ]び求[もと]める時[とき]、彼らの苦[くる]しみの時[とき]に、わたしは聞[き]かないからである。"
  15: "わたしの愛[あい]する者[もの]が、わたしの家[いえ]で何[なに]を忌[い]まわしいこととして行[おこな]ったのか。誓[ちか]いと聖[せい]なる肉[にく]が、あなたからあなたの悪[あく]を取[と]り去[さ]るだろうか。それらによって、あなたは逃[のが]れられるだろうか。」"
  16: "主[しゅ]はあなたの名[な]を、美[うつく]しく、姿[すがた]の麗[うるわ]しい、陰[かげ]をなすオリーブの木[き]と呼[よ]んだ。その枝[えだ]を刈[か]り込[こ]む音[おと]とともに、火[ひ]がその上[うえ]に燃[や]き上[あ]がった。あなたの上[うえ]に大[おお]きな苦[くる]しみがある。その枝[えだ]は役[やく]に立[た]たなくなった。"
  17: "万軍[ばんぐん]の主[しゅ]は、あなたを植[う]えた方[かた]として、あなたに災[わざわ]いを語[かた]られた。イスラエルの家[いえ]とユダの家[いえ]の悪[あく]のゆえである。彼らはバアルに香[こう]をたいて、わたしを怒[いか]らせることを自分[じぶん]のためにしたからである。"
  18: "「主[しゅ]よ、わたしに知[し]らせてください。そうすれば、わたしは知[し]るでしょう。そのとき、わたしは彼[かれ]らの企[たくら]みを見[み]ました。"
  19: "しかし、わたしは屠[ほふ]り場[ば]に引[ひ]かれて行[ゆ]く、悪[わる]いことを知[し]らない子羊[こひつじ]のようで、何[なに]も知[し]りませんでした。彼らはわたしに対して悪[わる]い企[たくら]みを図[はか]り、こう言[い]いました。『来[こ]い、彼のパンに木[き]を入[い]れ、生[い]きている者[もの]の地[ち]から彼を断[た]ち滅[ほろ]ぼそう。彼の名[な]がもはや思[おも]い起[おこ]されることのないように。』"
  20: "万軍[ばんぐん]の主[しゅ]よ、正[ただ]しい裁[さば]きをし、内[うち]なるものと心[こころ]とを試[ため]される方[かた]よ。わたしが彼[かれ]らへのあなたの報復[ほうふく]を見[み]ることができますように。わたしはあなたに、わたしの訴[うった]えを明[あ]かしたからです。」"
  21: "それゆえ、主[しゅ]は、あなたの命[いのち]を求[もと]めて『主[しゅ]の名[な]によって預言[よげん]してはならない。さもなければ、あなたはわたしたちの手[て]で死[し]ぬ』と言[い]うアナトトの人々[ひとびと]について、こう言[い]われる。"
  22: "「見[み]よ、わたしは彼らを罰[ばっ]する。彼らの若者[わかもの]たちは剣[つるぎ]で死[し]に、彼らの息子[むすこ]たちと娘[むすめ]たちは飢[うえ]えで死[し]ぬ。"
  23: "彼らの残[のこ]りは一人[ひとり]もいなくなる。わたしはアナトトに住[す]む者[もの]たちの上[うえ]に、彼らの罰[ばつ]の年[とし]に災[わざわ]いを臨[のぞ]ませるからである。」"

notes:
  1: "Ὁ λόγος ὁ γενόμενος παρὰ κυρίου πρὸς Ιερεμιαν λέγων — «слово, бывшее от Господа к Иеремии, говорящее» (γίνομαι — быть, становиться; слав. «Слово еже бысть»). Надписание; вводная формула вне кавычек, слово Господа начинается в 11:2. Слав. и ru держат ту же нумерацию, что gr."
  2: "Ἀκούσατε — 2-е л. мн. ч. «слушайте», а λαλήσεις — 2-е л. ед. ч. «скажешь»: в греч. и слав. число меняется внутри стиха; в яп. оба обращены к пророку и число не выражено. διαθήκη — завет (契約); слав. «завет». Вводная формула «так говорит Господь» в 11:3 стоит внутри речи."
  3: "Τάδε λέγει κύριος ὁ θεὸς Ισραηλ — «так говорит Господь Бог Израилев». Ἐπικατάρατος ὁ ἄνθρωπος — «проклят человек» (ἐπικατάρατος — проклятый; слав. «проклят муж»). ὃς οὐκ ἀκούσεται τῶν λόγων — «кто не послушает слов»: будущее в значении долженствования передано настоящим. Стих открывает слово, которое пророк должен передать народу."
  4: "ἐν ἡμέρᾳ, ᾗ ἀνήγαγον — «в день, когда Я вывел» (ἀνάγω — выводить; слав. «изведох»). ἐκ καμίνου τῆς σιδηρᾶς — «из железной печи» (κάμινος — печь, горн); слав. «от пещи железныя». εἰς λαόν… εἰς θεόν — «в народ… в Бога»: обе конструкции с εἰς сохранены (民となり…神となる). Слова завета (ср. Исх 19:5–6; Лев 26:12) идут внутри речи без вложенных кавычек: это предмет поручения, а не речь другого лица."
  5: "ὅπως στήσω τὸν ὅρκον — «чтобы исполнить клятву» (ἵστημι; слав. «да утвержду клятву»); ὤμοσα — «Я поклялся». γῆν ῥέουσαν γάλα καὶ μέλι — «земля, текущая молоком и мёдом» (слав. «точащую млеко и мед»). Γένοιτο, κύριε — оптатив «да будет, Господи» (слав. «буди, Господи»; ru «аминь»); ответ пророка выделен в отдельную короткую цитату, потому что это уже не речь Господа."
  6: "Ἀνάγνωθι — «прочти, провозгласи» (ἀναγινώσκω; слав. «прочти»). ἐν πόλεσιν Ιουδα καὶ ἔξωθεν Ιερουσαλημ — «в городах Иуды и вне Иерусалима». λέγων Ἀκούσατε… — «говоря: слушайте…»: передано こう言え, потому что это порученная пророку речь Господа, а не речь иного лица. κύριος σαβαωθ в стихе нет; слав. «Господь» без «сил»."
  7: "В модуле gr-lxx-byz на месте стиха стоит «.» — лакуна; в gr-lxx-swete стиха тоже нет (LXX здесь короче МТ). Стих переведён по слав. 11:7: «яко свидетелствуя засвидетелствовах отцем вашым… заутра востая засвидетелствовах глаголя: слышите глас мой» — «ибо, свидетельствуя, Я свидетельствовал отцам вашим… вставая рано, свидетельствовал, говоря: слушайте глас Мой». Удвоение «свидетельствовал» передано 証しし続けて; «до сего дня» — 今日この日に至るまで."
  8: "В LXX стих сохранён только как καὶ οὐκ ἐποίησαν — «и не сделали»; слав. 11:8 содержит полный текст: «И не слышаша, ни приклониша уха своего, но идоша кийждо в стропотстве сердца своего злаго: и наведох на них вся словеса завета сего… и не сотвориша». По паритету слав. чтение внесено в основной текст без скобок, «и не сделали» стоит в конце. слав. «в стропотстве сердца своего» — «в кривизне, упорстве сердца своего» (頑なさ); ἐπάγω — «наводить» (臨ませる)."
  9: "σύνδεσμος — «узы, связь, сговор» (συνδέω — связывать; слав. «совещание (на зло)»); в LXX слово означает сговор, в ru «заговор». Формула «И сказал мне Господь» — вне кавычек."
  10: "ἐπεστράφησαν ἐπὶ τὰς ἀδικίας — «обратились к беззакониям» (ἐπιστρέφω; слав. «возвратишася»). οἱ πρότερον — «прежние, древние» (昔の). οὐκ ἤθελον εἰσακοῦσαι — «не хотели слушать». βαδίζουσιν ὀπίσω θεῶν ἀλλοτρίων — «ходят вслед чужих богов»: настоящее при аористах сохранено. διεσκέδασαν — «разорили, нарушили» (διασκεδάννυμι; слав. «разори»)."
  11: "ἐπάγω ἐπὶ τὸν λαὸν τοῦτον κακά — «навожу на народ этот бедствия» (слав. «наведу… злая»); ἐξ ὧν οὐ δυνήσονται ἐξελθεῖν — «из которых не смогут выйти» (слав. «от нихже изыти не возмогут»). κεκράξονται… οὐκ εἰσακούσομαι — «воззовут… не услышу»: будущее и настоящее сохранены."
  12: "θυμιῶσιν — «калят, воскуряют фимиам» (θυμιάω; слав. «кадят»); μὴ σώσουσιν…; — вопрос с μή, ожидающий отрицательного ответа, сохранён вопросом (救うだろうか). Слав. «и пойдут грады иудины» — по LXX καὶ πορεύσονται."
  13: "κατ᾿ ἀριθμὸν τῶν πόλεών σου — «по числу городов твоих»; κατ᾿ ἀριθμὸν ἐξόδων — «по числу выходов, улиц» (ἔξοδος; слав. «путий»); ἐτάξατε — «поставили» (τάσσω). βωμοὺς θυμιᾶν τῇ Βααλ — «жертвенники для каждения Ваалу» (βωμός — жертвенник, 祭壇). Слав. добавляет «олтари студныя» («постыдные жертвенники») — нет в LXX, внесено в текст без скобок (恥ずべき祭壇)."
  14: "μὴ προσεύχου… μὴ ἀξίου — два запрета: «не молись» и «не проси» (ἀξιόω — просить, требовать; слав. «не проси»). ἐν δεήσει καὶ προσευχῇ — «в молении и молитве» (δέησις — прошение). οὐκ εἰσακούσομαι ἐν τῷ καιρῷ, ἐν ᾧ ἐπικαλοῦνταί με — «не услышу во время, когда призывают Меня»: повтор καιρός сохранён (時…時)."
  15: "τί ἡ ἠγαπημένη ἐν τῷ οἴκῳ μου ἐποίησεν βδέλυγμα — «что возлюбленная в доме Моём сделала мерзость?» (βδέλυγμα — мерзость; слав. «мерзости (многи)», скобки слав. — редакционные). εὐχαὶ καὶ κρέα ἅγια — «обеты и мясо святое» (εὐχή — обет, молитва; κρέας — мясо); слав. «обеты и мяса святая». ἀφελοῦσιν ἀπὸ σοῦ τὰς κακίας σου — «отнимут от тебя злобы твои» (ἀφαιρέω). ἢ τούτοις διαφεύξῃ — «или этим избежишь?»."
  16: "ἐλαίαν ὡραίαν εὔσκιον τῷ εἴδει — «маслину красивую, тенистую по виду» (ἐλαία — маслина; εὔσκιος — тенистый; εἶδος — вид); слав. «Маслину благосенну, красну зраком». εἰς φωνὴν περιτομῆς αὐτῆς — букв. «при голосе обрезания её»: περιτομή здесь, вероятно, «срезание, обрезка» ветвей, поэтому 枝を刈り込む音 (см. отчёт, сомнительное место). ἀνήφθη πῦρ ἐπ᾿ αὐτήν — «возжёгся огонь на неё» (ἀνάπτω; слав. «разгореся огнь в ней»). ἠχρεώθησαν οἱ κλάδοι — «ветви стали негодны» (ἀχρεόω; слав. «непотребны быша»)."
  17: "ὁ καταφυτεύσας σε — «насадивший тебя» (καταφυτεύω). ἐλάλησεν ἐπὶ σὲ κακά — «изрёк на тебя злое». ἀντὶ τῆς κακίας — «за зло» (ἀντί — вместо, за). Слав. добавляет «Господь сил» (万軍の主) — в LXX только κύριος. ἐποίησαν ἑαυτοῖς τοῦ παροργίσαι με — «сделали себе, чтобы разгневать Меня» (παροργίζω); θυμιᾶν τῇ Βααλ — «кадить Ваалу»."
  18: "Κύριε, γνώρισόν μοι — «Господи, дай мне знать» (γνωρίζω; слав. «скажи ми»); καὶ γνώσομαι — «и узнаю». τότε εἶδον τὰ ἐπιτηδεύματα αὐτῶν — «тогда я увидел их дела» (ἐπιτήδευμα — дело, промысел; слав. «начинания»). С 11:18 начинается молитва пророка — 「…」."
  19: "ὡς ἀρνίον ἄκακον ἀγόμενον τοῦ θύεσθαι — «как агнец незлобивый, ведомый на заклание» (ἀρνίον — агнец; ἄκακος — незлобивый; θύω — закалать). ἐλογίσαντο λογισμὸν πονηρόν — «замыслили злой замысел»: повтор корня сохранён. ἐμβάλωμεν ξύλον εἰς τὸν ἄρτον αὐτοῦ — «положим дерево в хлеб его», буквально по LXX и слав. («вложим древо во хлеб его»); в ru «ядовитое дерево» — по МТ, не внесено. ἐκτρίψωμεν — «истребим, сотрём» (ἐκτρίβω). Слова врагов — 『…』."
  20: "κρίνων δίκαια — «судящий правое» (слав. «судяй праведно»); δοκιμάζων νεφροὺς καὶ καρδίας — «испытующий внутренности и сердца» (νεφρός — почка, внутреннее; передано 内なるもの). ἴδοιμι — оптатив «да увижу»; ἐκδίκησις — «мщение» (報復). ἀπεκάλυψα τὸ δικαίωμά μου — «открыл правое дело моё» (δικαίωμα; слав. «оправдание»). Слав. добавляет «саваоф» (万軍の主) — в LXX κύριε."
  21: "ἐπὶ τοὺς ἄνδρας Αναθωθ — «о мужах Анатофа» (Αναθωθ — родной город пророка, アナトト). τοὺς ζητοῦντας τὴν ψυχήν μου — «ищущих души моей», т. е. жизни (слав. «ищущыя души моея»). Οὐ μὴ προφητεύσῃς — запрет с усиленным οὐ μή. εἰ δὲ μή, ἀποθανῇ ἐν ταῖς χερσὶν ἡμῶν — «если же нет, умрёшь в руках наших». Их слова — 『…』 внутри вводной формулы; сама формула вне кавычек."
  22: "ἐπισκέψομαι ἐπ᾿ αὐτούς — «посещу их» (ἐπισκέπτομαι — посещать, взыскивать; слав. «посещу»). οἱ νεανίσκοι — «юноши»; ἐν μαχαίρᾳ ἀποθανοῦνται — «умрут от меча»; τελευτήσουσιν ἐν λιμῷ — «скончаются от голода» (λιμός — голод; слав. «гладом»)."
  23: "ἐγκατάλειμμα — «остаток» (слав. «останок»); ἐν ἐνιαυτῷ ἐπισκέψεως αὐτῶν — «в год посещения их». ἐπάξω κακά — «наведу бедствия». Стих закрывает слово Господа."
