# jp-box, Иеремия, глава 11. Черновик для приёмки.
#
# Нумерация — по славянской и Синодальной Библии (масоретский порядок глав):
# так привычнее читателю. В Септуагинте (gr-lxx-byz) эта глава — 11.
# База: Септуагинта; контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# --- прежние заметки (написаны при нумерации по гр.; номера в них — греческие) ---
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc по Иеремии — только фрагменты (гл. 11, 12,
# 31), в выгрузку не входил и не использовался; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 11: 1 надписание; 2–5а слово Господа — завет и клятва отцам; 5б ответ пророка;
# 6–8 повеление читать слова завета и непослушание отцов; 9–15 заговор, суд и запрет
# молитвы; 16–17 пророк о насаждённой маслине; 18–20 молитва пророка; 21–23 слово
# Господа об анатофянах.
# Голоса: 2–5а, 6–8, 9–15, 22–23 — 「…」 (слово Господа); 5б — короткая цитата пророка;
# 16–17 — пророческий текст без кавычек; 18–20 — 「…」 (молитва пророка), в 19 слова
# врагов — 『…』; 21 — вводная формула вне кавычек, в ней слова врагов — 『…』.
# Слово, которое пророк должен передать народу (11:3–5а, 6), оставлено в той же речи
# Господа без вложенных 『…』: это не речь другого лица; 『…』 — только речь иных лиц
# внутри речи. Вводные формулы — вне кавычек.
# Нумерация по gr: 23 стиха; слав. и ru — та же глава 11, номера совпадают. 11:7 в
# модуле — «точка» (лакуна), стих переведён по слав. 11:7; в 11:8 LXX сохранил только
# καὶ οὐκ ἐποίησαν, полный текст — по слав. 11:8. Карта — в notes к 11:7–8.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX): エレミヤ, ユダ,
# エルサレム, イスラエル, バアル, アナトト.
# 
