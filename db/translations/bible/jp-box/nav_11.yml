verses:
  1: "ハツォルの王[おう]ヤビンは、これを聞[き]いて、マロンの王[おう]ヨバブ、シモオンの王[おう]、アジフの王[おう]に人[ひと]を遣[つか]わし、"
  2: "また、大[おお]きなシドンの近[ちか]くの山地[さんち]、キネロトの向[む]かい側[がわ]のアラバ、平野[へいや]、ナフェドルにいる王[おう]たちに、"
  3: "また、東[ひがし]の海沿[うみぞ]いのカナン人[じん]、海沿[うみぞ]いのアモリ人[じん]、ヒビ人[じん]、エブス人[じん]、ペリジ人[じん]、すなわち山地[さんち]にいる者[もの]たち、またヘルモンの下[した]にいるヘテ人[じん]に、マスファの地[ち]へと。"
  4: "彼[かれ]らは、その王[おう]たちすべてとともに出[で]て来[き]た。その数[かず]は海[うみ]の砂[すな]のようで、馬[うま]も戦車[せんしゃ]も非常[ひじょう]に多[おお]かった。"
  5: "これらの王[おう]たちはみな集[あつ]まって来[き]、マロンの水[みず]のほとりにともども陣[じん]を張[は]って、イスラエルと戦[たたか]おうとした。"
  6: "主[しゅ]はヨシュアに言[い]われた。「彼[かれ]らを恐[おそ]れてはならない。明日[あす]、この時刻[じこく]に、わたしは彼[かれ]らをイスラエルの前[まえ]で打[う]ち破[やぶ]られた者[もの]として渡[わた]す。あなたは彼[かれ]らの馬[うま]の筋[すじ]を切[き]り、彼[かれ]らの戦車[せんしゃ]を火[ひ]で焼[や]きなさい。」"
  7: "ヨシュアと、彼[かれ]とともにいる戦[いくさ]の民[たみ]すべては、マロンの水[みず]のほとりへ突然[とつぜん]彼[かれ]らのもとへ来[き]て、山地[さんち]で彼[かれ]らに襲[おそ]いかかった。"
  8: "主[しゅ]は彼[かれ]らをイスラエルの手[て]の下[した]に渡[わた]された。イスラエルは彼[かれ]らを打[う]ちながら、大[おお]きなシドン、マセロン、また東[ひがし]に広[ひろ]がるマソクの平野[へいや]に至[いた]るまで追[お]いかけた。彼[かれ]らを打[う]ち、逃[に]げ延[び]びた者[もの]を一[ひと]人[り]も残[のこ]さなかった。"
  9: "ヨシュアは、主[しゅ]が彼[かれ]に命[めい]じられたとおりに彼[かれ]らにした。すなわち、彼[かれ]らの馬[うま]の筋[すじ]を切[き]り、彼[かれ]らの戦車[せんしゃ]を火[ひ]で焼[や]いた。"
  10: "そのころ、ヨシュアは引[ひ]き返[かえ]してハツォルを取[と]り、その王[おう]をも取[と]った。ハツォルは以前[いぜん]、これらすべての王国[おうこく]の首[かしら]であったからである。"
  11: "彼[かれ]らは剣[つるぎ]にかけて、その中[なか]の息[いき]のあるものすべてを殺[ころ]し、すべてを聖絶[せいぜつ]した。その中[なか]には息[いき]のあるものが一[ひと]つも残[のこ]らなかった。彼[かれ]はハツォルを火[ひ]で焼[や]いた。"
  12: "ヨシュアはこれらの王[おう]たちのすべての町[まち]々と、その王[おう]たちとを取[と]り、剣[つるぎ]の刃[やいば]にかけて彼[かれ]らを殺[ころ]し、彼[かれ]らを聖絶[せいぜつ]した。主[しゅ]のしもべモーセが命[めい]じたとおりである。"
  13: "しかしイスラエルは、土塁[どるい]を築[きず]いた町[まち]をすべて焼[や]いたわけではなかった。ただハツォルだけをヨシュアは焼[や]いた。"
  14: "イスラエルの人[ひと]々[びと]はそのすべての分捕[ぶんど]り物[もの]と家畜[かちく]を自分[じぶん]たちのために奪[うば]ったが、人[ひと]はすべて剣[つるぎ]の刃[やいば]にかけて、彼[かれ]らを滅[ほろ]ぼし尽[つ]くすまで打[う]ち、息[いき]のあるものを一[ひと]つも残[のこ]さなかった。"
  15: "主[しゅ]がそのしもべモーセに命[めい]じられたとおりに、モーセはヨシュアに命[めい]じ、ヨシュアはそのとおりに行[おこな]った。モーセが彼[かれ]に命[めい]じたすべてのうち、一[ひと]つも違[ちが]えなかった。"
  16: "ヨシュアは、山地[さんち]の全[すべ]ての地[ち]、ネゲブの全[すべ]て、ゴソムの全[すべ]ての地[ち]、平地[へいち]、西[にし]の地[ち]、イスラエルの山[やま]、およびその低地[ていち]を取[と]った。"
  17: "すなわち、アケル山[やま]から、セイルへと上[のぼ]って行[ゆ]く所[ところ]、バアルガドまで、またヘルモン山[やま]の下[した]のレバノンの平野[へいや]までである。そしてヨシュアは彼[かれ]らの王[おう]たちすべてを取[と]り、彼[かれ]らを打[う]ち、殺[ころ]した。"
  18: "ヨシュアは長[なが]い日[ひ]々[び]の間[あいだ]、これらの王[おう]たちと戦[たたか]った。"
  19: "イスラエルが取[と]らなかった町[まち]は一[ひと]つもなかった。彼[かれ]らはすべてを戦[たたか]いによって取[と]った。"
  20: "彼[かれ]らの心[こころ]を強[つよ]くして、イスラエルとの戦[たたか]いに臨[のぞ]ませることは、主[しゅ]によって起[お]こった。それは彼[かれ]らが聖絶[せいぜつ]されるためであり、彼[かれ]らに憐[あわ]れみが与[あた]えられず、主[しゅ]がモーセに語[かた]られたとおりに聖絶[せいぜつ]されるためであった。"
  21: "そのころ、ヨシュアは来[き]て、山地[さんち]から、すなわちヘブロン、ダビル、アナボト、およびイスラエルの全[すべ]ての氏族[しぞく]、ユダの全[すべ]ての山[やま]から、その町[まち]々とともにエナキム人[じん]を聖絶[せいぜつ]した。ヨシュアは彼[かれ]らを滅[ほろ]ぼし尽[つ]くした。"
  22: "エナキム人[じん]はイスラエルの人[ひと]々[びと]のうちに一[ひと]人[り]も残[のこ]らなかった。ただガザ、ガト、アシドトにだけ残[のこ]った。"
  23: "ヨシュアは全[すべ]ての地[ち]を、主[しゅ]がモーセに命[めい]じられたとおりに取[と]り、それをイスラエルに嗣業[しぎょう]として、その部族[ぶぞく]ごとの分[わ]け前[まえ]として与[あた]えた。そして地[ち]は戦[たたか]いをやめた。"

notes:
  1: "Ὡς δὲ ἤκουσεν Ιαβιν βασιλεὺς Ασωρ — когда услышал Иавин, царь Хацора (Ιαβιν — ヤビン; Ασωρ — ハツォル, форма по брифу). ἀπέστειλεν πρὸς Ιωβαβ βασιλέα Μαρρων καὶ πρὸς βασιλέα Συμοων καὶ πρὸς βασιλέα Αζιφ — послал к Иоваву, царю Маррона (ヨバブ, マロン), и к царю Симрона (Συμοων — シモオン; в слав. «семеронску»), и к царю Ахсафа (Αζιφ — アジフ; в слав. «ахиавску», в ru «Ахсаф»). Формы этих трёх имён в ст. 20 повторяются; пишем одинаково."
  2: "τοὺς βασιλεῖς τοὺς κατὰ Σιδῶνα τὴν μεγάλην — царей, что при великом Сидоне (κατά + вин. — «в сторону, близ»; シドン). εἰς τὴν ὀρεινήν — в нагорье (山地). εἰς τὴν Ραβα ἀπέναντι Κενερωθ — в Раву напротив Кинерофа: в гр. Ραβα — вариант Ἀραβά (долина Иордана), слав. читает «араву», поэтому アラバ, а не «Раба»; так же в 12:3 и 12:8. εἰς τὸ πεδίον — в равнину (平野). εἰς Ναφεδδωρ — в Нафеддор (ナフェドル; ср. 12:23 τοῦ Ναφεδδωρ)."
  3: "τοὺς παραλίους Χαναναίους ἀπὸ ἀνατολῶν — приморских хананеев с востока (παράλιος — «прибрежный»). τοὺς παραλίους Αμορραίους καὶ Ευαίους καὶ Ιεβουσαίους καὶ Φερεζαίους τοὺς ἐν τῷ ὄρει — приморских аморреев, и евеев, и иевусеев, и ферезеев, которые на горе; по-японски: アモリ人, ヒビ人, エブス人, ペリジ人 (формы корпуса). τοὺς Χετταίους τοὺς ὑπὸ τὴν Αερμων — хеттеев, что под Хермоном (ヘルモン). εἰς γῆν Μασσηφα — в землю Массифу (Μασσηφα — マスファ; в слав. «массифа», в ru «Массифе»)."
  4: "ἐξῆλθον αὐτοὶ καὶ οἱ βασιλεῖς αὐτῶν μετ᾿ αὐτῶν — вышли они и цари их с ними. ὥσπερ ἡ ἄμμος τῆς θαλάσσης τῷ πλήθει — как песок морской по множеству (датив отношения). ἵπποι καὶ ἅρματα πολλὰ σφόδρα — коней и колесниц весьма много (ἅρμα — 戦車)."
  5: "συνῆλθον … καὶ παρεγένοντο ἐπὶ τὸ αὐτό — сошлись и пришли на одно место (ἐπὶ τὸ αὐτό). παρενέβαλον ἐπὶ τοῦ ὕδατος Μαρρων — расположились станом при водах Маррона (παρεμβάλλω; ὕδωρ Μαρρων — マロンの水). πολεμῆσαι τὸν Ισραηλ — чтобы воевать с Израилем."
  6: "Μὴ φοβηθῇς ἀπὸ προσώπου αὐτῶν — не бойся от лица их (ἀπό + род. — «из-за, перед»). αὔριον ταύτην τὴν ὥραν — завтра в этот час. παραδίδωμι τετροπωμένους αὐτούς — предаю их обращёнными в бегство, разбитыми (τροπόω — «обращать в бегство»; perfect pass.). νευροκοπήσεις — перережешь жилы (νευροκοπέω, от νεῦρον — «жила, сухожилие»); 馬の筋を切る. κατακαύσεις ἐν πυρί — сожжёшь огнём."
  7: "ἦλθεν … ἐπ᾿ αὐτοὺς ἐπὶ τὸ ὕδωρ Μαρρων ἐξάπινα — пришёл на них к воде Маррон внезапно (ἐξάπινα — «внезапно»). ἐπέπεσαν ἐπ᾿ αὐτοὺς ἐν τῇ ὀρεινῇ — напали на них на нагорье (ἐπιπίπτω)."
  8: "παρέδωκεν αὐτοὺς κύριος ὑποχειρίους Ισραηλ — предал их Господь в руки Израиля (ὑποχείριος). κόπτοντες αὐτοὺς κατεδίωκον — поражая их, преследовали (καταδιώκω). ἕως Σιδῶνος τῆς μεγάλης — до великого Сидона. ἕως Μασερων — до Масерона (Μασερων; в слав. «масрефоф-маима», в ru «Мисрефоф-Маим» — в гр. одно имя). ἕως τῶν πεδίων Μασσωχ κατ᾿ ἀνατολάς — до равнин Массох к востоку (Μασσωχ — マソク; слав. «поль массифских»). ἕως τοῦ μὴ καταλειφθῆναι … διασεσῳσμένον — до того, что не осталось уцелевшего."
  9: "ἐποίησεν αὐτοῖς … ὃν τρόπον ἐνετείλατο αὐτῷ κύριος — поступил с ними так, как заповедал ему Господь. ἐνευροκόπησεν — перерезал жилы (ср. ст. 6). ἐνέπρησεν ἐν πυρί — сжёг огнём (ἐμπίμπρημι)."
  10: "ἀπεστράφη … ἐν τῷ καιρῷ ἐκείνῳ — обратился в то время (ἀποστρέφω). κατελάβετο Ασωρ καὶ τὸν βασιλέα αὐτῆς — овладел Хацором и царём его (καταλαμβάνω); в слав. добавлено «царя его уби мечем» — в гр. нет. ἦν δὲ Ασωρ τὸ πρότερον ἄρχουσα πασῶν τῶν βασιλειῶν τούτων — Хацор же прежде был главой всех этих царств (ἄρχω — «начальствовать»; причастие ж. р. при Ασωρ как имени города)."
  11: "ἀπέκτειναν πᾶν ἐμπνέον ἐν αὐτῇ ἐν ξίφει — убили всё дышащее в нём мечом. ἐξωλέθρευσαν πάντας — истребили всех. οὐ κατελείφθη ἐν αὐτῇ ἐμπνέον — не осталось в нём дышащего. τὴν Ασωρ ἐνέπρησαν ἐν πυρί — Хацор сожгли огнём."
  12: "πάσας τὰς πόλεις τῶν βασιλέων — все города царей. ἀνεῖλεν αὐτοὺς ἐν στόματι ξίφους — убил их остриём меча (ἀναιρέω; ср. 10:28). ὃν τρόπον συνέταξεν Μωϋσῆς ὁ παῖς κυρίου — как заповедал Моисей, раб Господень (παῖς — しもべ)."
  13: "τὰς πόλεις τὰς κεχωματισμένας — города, насыпанные валом, т.е. укреплённые земляным валом (χωματίζω — «насыпать вал»; perfect pass.; слав. «грады крепки», ru «города, лежавшие на возвышенности») — отсюда 土塁を築いた町. πλὴν Ασωρ μόνην ἐνέπρησεν Ἰησοῦς — кроме одного Хацора, который сжёг Иисус."
  14: "πάντα τὰ σκῦλα αὐτῆς ἐπρονόμευσαν ἑαυτοῖς — всю добычу его разграбили себе (σκῦλον — «добыча, трофей»; προνομεύω). αὐτοὺς δὲ πάντας ἐξωλέθρευσαν ἐν στόματι ξίφους — а их всех истребили остриём меча. ἕως ἀπώλεσεν αὐτούς — до того, что погубил их. οὐ κατέλιπον … οὐδὲ ἓν ἐμπνέον — не оставили ни одного дышащего."
  15: "ὃν τρόπον συνέταξεν κύριος τῷ Μωυσῇ … καὶ Μωϋσῆς ὡσαύτως ἐνετείλατο τῷ Ἰησοῖ — как заповедал Господь Моисею, так и Моисей заповедал Иисусу (ὡσαύτως — «равным образом»). οὐ παρέβη οὐδὲν ἀπὸ πάντων — не преступил ничего из всего (παραβαίνω)."
  16: "πᾶσαν τὴν γῆν τὴν ὀρεινήν — всю землю нагорную. πᾶσαν τὴν Ναγεβ — весь Негев. πᾶσαν τὴν γῆν Γοσομ — всю землю Госом (ゴソム; ср. 10:41). τὴν πεδινήν — низменность. τὴν πρὸς δυσμαῖς — то, что к западу (δυσμή — «закат»). τὸ ὄρος Ισραηλ — гору Израилеву (イスラエルの山). τὰ ταπεινά — низменные места (ταπεινός — «низкий»); отсюда 低地."
  17: "τὰ πρὸς τῷ ὄρει ἀπὸ ὄρους Αχελ — то, что при горе, от горы Ахел (Αχελ — アケル山; евр. Халак; в 12:7 та же гора названа Χελχα — там ヘルカ山, см. notes 12:7). ὃ προσαναβαίνει εἰς Σηιρ — что поднимается к Сеиру (Σηιρ — セイル). ἕως Βααλγαδ — до Ваал-Гада (バアルガド). τὰ πεδία τοῦ Λιβάνου ὑπὸ τὸ ὄρος τὸ Αερμων — равнины Ливана под горою Хермон (レバノン, ヘルモン). ἀνεῖλεν αὐτοὺς καὶ ἀπέκτεινεν — убил их и умертвил (два глагола, как в LXX)."
  18: "πλείους ἡμέρας ἐποίησεν … τὸν πόλεμον — «многие дни делал войну», т.е. долгое время вёл войну (πλείους — «больше, многие»)."
  19: "οὐκ ἦν πόλις, ἢν οὐκ ἔλαβεν Ισραηλ — не было города, которого не взял Израиль (двойное отрицание). πάντα ἐλάβοσαν ἐν πολέμῳ — всё взяли войной. Слав. и ru добавляют «кроме евеев, жителей Гаваона» (масорет) — в греч. нет, не переводим."
  20: "διὰ κυρίου ἐγένετο κατισχῦσαι αὐτῶν τὴν καρδίαν — от Господа было укрепиться сердцу их (κατισχύω — «укреплять»; конструкция с διά + род.). συναντᾶν εἰς πόλεμον πρὸς Ισραηλ — выходить на войну против Израиля (συναντάω). ἵνα ἐξολεθρευθῶσιν — чтобы они были истреблены. ὅπως μὴ δοθῇ αὐτοῖς ἔλεος — чтобы не дано было им помилования (ἔλεος). ἀλλ᾿ ἵνα ἐξολεθρευθῶσιν — но чтобы истреблены были (повтор, как в LXX)."
  21: "ἐξωλέθρευσεν τοὺς Ενακιμ ἐκ τῆς ὀρεινῆς — истребил Енакимов с нагорья (Ενακιμ — エナキム人). ἐκ Χεβρων καὶ ἐκ Δαβιρ καὶ ἐξ Αναβωθ — из Хеврона, Давира и Анава (Αναβωθ — アナボト; в слав. «анова», в ru «Анав»). ἐκ παντὸς γένους Ισραηλ — «из всего рода Израилева»: в гр. γένος («род»), тогда как слав. и ru читают здесь «гора Израилева» (масорет); держимся греческого, отсюда イスラエルのすべての氏族 — место тёмное. ἐκ παντὸς ὄρους Ιουδα σὺν ταῖς πόλεσιν αὐτῶν — со всей горы Иуды с городами их."
  22: "οὐ κατελείφθη τῶν Ενακιμ ἀπὸ τῶν υἱῶν Ισραηλ — не осталось из Енакимов у сынов Израилевых. πλὴν ἐν Γάζῃ καὶ ἐν Γεθ καὶ ἐν Ασεδωθ — кроме Газы, Гефа и Аседофа (ガザ, ガト, アシドト; Ασεδωθ — アシドト, как 10:40)."
  23: "ἔλαβεν Ἰησοῦς πᾶσαν τὴν γῆν, καθότι ἐνετείλατο κύριος τῷ Μωυσῇ — взял Иисус всю землю, так как заповедал Господь Моисею. ἔδωκεν αὐτοὺς … ἐν κληρονομίᾳ … ἐν μερισμῷ κατὰ φυλὰς αὐτῶν — дал их в наследие, в раздел, по племенам их (κληρονομία — 嗣業, μερισμός — «раздел, доля», φυλή — 部族). καὶ ἡ γῆ κατέπαυσεν πολεμουμένη — и земля перестала быть воюемой, т.е. успокоилась от войны (παύω в страдательном причастии)."
