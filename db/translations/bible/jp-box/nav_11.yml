# jp-box, Иисус Навин, глава 11. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в главе отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 11: северный союз во главе с Иавином Хацорским (1–5); слово Господа:
# не бойся, коням перережь жилы, колесницы сожги (6); внезапный удар у вод Меромских,
# погоня до Сидона (7–9); взятие и сожжение Хацора (10–11); истребление городов
# и царей (12–15); итог: вся земля взята, енакимы истреблены (16–23).
# Нумерация: 23 стиха — как в gr-lxx-byz (совпадает с csl-ru и ru).
# Кавычки: слово Господа — 「…」 (6). Больше речей в главе нет.
# Красного <j> нет. 〔…〕 нет: все стихи и слова есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 聖絶, 嗣業, 部族, 戦車 уже в корпусе.
# Отличия LXX: 11:10 в гр. нет «и царя его убил мечом» (это csl); 11:19 в гр. нет
# «кроме евеев, живущих в Гаваоне» (масорет, есть у csl и ru) — не переводим;
# 11:21 в гр. стоит ἐκ παντὸς γένους Ισραηλ («из всего рода Израилева»), тогда как
# слав. и ru читают «гора Израилева» (масорет) — держимся греческого с оговоркой.
# jp-ni не использовался.

