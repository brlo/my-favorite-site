# jp-box, Второе соборное послание Петра, глава 2. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 2: ложные учители в народе и в Церкви (1–3), примеры суда — согрешившие
# ангелы, потоп, Содом (4–9), дерзость и скотское неразумие (10–16),
# пустые источники, обольщение и рабство тления (17–19),
# лучше не знать пути правды; две поговорки (20–22).
# Красного и синего нет: прямой речи Христа и Богородицы в главе нет.
# 〔…〕 в главе нет: 2:22 — Притч 26:11 и вторая поговорка в базе есть (παροιμιασ — ЕСТЬ);
# 2:17 — в базе нет εἰς αἰῶνα, церковное добавление не внесено (см. notes).
# Сносок ⟨…⟩ в главе нет: 偽り, 異端, 滅び, 泉, 迷い уже встречались в корпусе.
# jp-ni не использовался.

