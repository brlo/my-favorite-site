verses:
  1: "しかし、民[たみ]のうちにも偽[いつわ]りの預言者[よげんしゃ]が現[あらわ]れたように、あなたがたのうちにも偽[いつわ]りの教師[きょうし]が現[あらわ]れる。彼[かれ]らは滅[ほろ]びに至[いた]る異端[いたん]をひそかにもち込[こ]み、自分[じぶん]たちを買[か]い取[と]ってくださった主人[しゅじん]を否[いな]んで、自分[じぶん]たちに速[すみや]かな滅[ほろ]びを招[まね]き寄[よ]せるのである。"
  2: "多[おお]くの人[ひと]が彼[かれ]らの放縦[ほうじゅう]に従[したが]い、彼[かれ]らのために真理[しんり]の道[みち]がそしられるであろう。"
  3: "彼[かれ]らは貪欲[どんよく]のあまり、巧[たく]みな言葉[ことば]であなたがたを商[あきな]う。彼[かれ]らへの裁[さば]きは昔[むかし]から怠[おこた]っておらず、彼[かれ]らの滅[ほろ]びもまどろまない。"
  4: "神[かみ]は、罪[つみ]を犯[おか]した天使[てんし]たちを容[ゆる]さず、暗[くら]やみの鎖[くさり]に縛[しば]って地獄[じごく]に投[な]げ込[こ]み、裁[さば]きのために取[と]っておかれた。"
  5: "また、昔[むかし]の世[よ]を容[ゆる]さず、不敬虔[ふけいけん]な者[もの]たちの世[よ]に洪水[こうずい]をもたらし、義[ぎ]を宣[の]べ伝[つた]えたノアと、ほかに七人[ななにん]とを守[まも]られた。"
  6: "また、ソドムとゴモラの町[まち]々[まち]を灰[はい]に変[か]えて滅[ほろ]ぼし、これから不敬虔[ふけいけん]に生[い]きようとする者[もの]たちへの見[み]せしめとされた。"
  7: "また、無[む]法[ほう]な者[もの]たちの放縦[ほうじゅう]な行[おこな]いによって苦[くる]しめられていた義[ぎ]人[じん]ロトを救[すく]い出[だ]された。"
  8: "この義[ぎ]人[じん]は彼[かれ]らの間[あいだ]に住[す]みながら、日[ひ]ごとに、目[め]で見[み]、耳[みみ]で聞[き]く無[む]法[ほう]な行[おこな]いによって、自分[じぶん]の正[ただ]しい心[こころ]を痛[いた]めていたのである。"
  9: "主[しゅ]は、敬虔[けいけん]な者[もの]を試[こころ]みから救[すく]い出[だ]し、正[ただ]しくない者[もの]を、裁[さば]きの日[ひ]まで罰[ばつ]を受[う]けるままに取[と]っておかれることを知[し]っておられる。"
  10: "とりわけ、肉[にく]に従[したが]って汚[けが]れた欲[よく]に身[み]を任[まか]せ、主権[しゅけん]を蔑[さげす]む者[もの]たちを。彼[かれ]らは大胆[だいたん]で、わがままにふるまい、尊[とうと]い者[もの]たちをそしりながら、恐[おそ]れようともしない。"
  11: "他方[たほう]、天使[てんし]たちは、力[ちから]と権威[けんい]において彼[かれ]らにまさっていながら、主[しゅ]の前[まえ]で彼[かれ]らに対[たい]して、そしりの裁[さば]きを下[くだ]そうとはしない。"
  12: "しかし、彼[かれ]らは、捕[と]らえて滅[ほろ]ぼされるために生[う]まれた、理性[りせい]のない獣[けもの]のような者[もの]である。自分[じぶん]たちが知[し]りもしないことをそしり、その滅[ほろ]びのうちに、彼[かれ]らも滅[ほろ]ぼされていくのである。"
  13: "不義[ふぎ]の報[むく]いを受[う]けるのである。彼[かれ]らは昼[ひる]の享楽[きょうらく]を喜[よろこ]びとし、あなたがたと食卓[しょくたく]を共[とも]にしながら、自分[じぶん]たちの欺[あざむ]きのうちでぜいたくにふるまう、しみとよごれなのである。"
  14: "彼[かれ]らの目[め]は淫[いん]らな女[おんな]で満[み]ち、罪[つみ]を犯[おか]してやまない。彼[かれ]らは心[こころ]の定[さだ]まらない者[もの]たちを誘[さそ]い、その心[こころ]は貪欲[どんよく]に鍛[きた]えられている。彼[かれ]らは呪[のろ]いの子[こ]らである。"
  15: "正[ただ]しい道[みち]を捨[す]てて迷[まよ]い出[で]、不義[ふぎ]の報酬[ほうしゅう]を愛[あい]したボソルの子[こ]バラムの道[みち]に従[したが]った。"
  16: "しかし、彼[かれ]は自分[じぶん]の無[む]法[ほう]のことで責[せ]められた。ものを言[い]わない荷[に]を負[お]う獣[けもの]が人[ひと]の声[こえ]で語[かた]り、預言者[よげんしゃ]の狂[くる]いを止[とど]めたのである。"
  17: "彼[かれ]らは水[みず]のない泉[いずみ]、嵐[あらし]に追[お]い払[はら]われる霧[きり]であり、暗[くら]やみの濃[こ]い闇[やみ]が〔永遠[えいえん]に〕彼[かれ]らのために取[と]っておかれている。"
  18: "彼[かれ]らはむなしく大[おお]げさなことを語[かた]り、肉[にく]の欲[よく]にふけって放縦[ほうじゅう]にふるまい、迷[まよ]いのうちに生[い]きている者[もの]たちから、かろうじて逃[のが]れた人[ひと]々[びと]を誘[さそ]い込[こ]む。"
  19: "彼[かれ]らは人[ひと]々[びと]に自由[じゆう]を約束[やくそく]しながら、自分[じぶん]たちは滅[ほろ]びの奴隷[どれい]である。人[ひと]は、自分[じぶん]が負[ま]けた者[もの]の奴隷[どれい]だからである。"
  20: "というのは、彼[かれ]らが、わたしたちの主[しゅ]であり救[すく]い主[ぬし]であるイエス・キリストを知[し]ることによって世[よ]の汚[けが]れから逃[のが]れた後[のち]、再[ふたた]びそれに巻[ま]き込[こ]まれて負[ま]けるなら、その後[のち]の状態[じょうたい]は初[はじ]めよりも悪[わる]くなるからである。"
  21: "彼[かれ]らには、義[ぎ]の道[みち]を知[し]らないほうが、むしろよかったのだ。知[し]ったうえで、自分[じぶん]たちに伝[つた]えられた聖[せい]なる戒[いまし]めから背[そむ]き返[かえ]すよりは。"
  22: "彼[かれ]らには、あの真[しん]のことわざのとおりのことが起[お]こったのである。「犬[いぬ]は自分[じぶん]の吐[は]いた物[もの]に戻[もど]る」、また「豚[ぶた]は洗[あら]われてから、また泥[どろ]の中[なか]に転[ころ]がる」。"

notes:
  1: "Ἐγένοντο δὲ καὶ ψευδοπροφῆται ἐν τῷ λαῷ — 民のうちにも偽りの預言者が現れたように (ψευδοπροφήτης — 偽りの預言者). ψευδοδιδάσκαλοι — 偽りの教師 (слово только здесь в НЗ). παρεισάξουσιν αἱρέσεις ἀπωλείας — 滅びに至る異端をひそかにもち込む (παρεισάγω — «вводить тайком»; αἵρεσις здесь — «разделение, ересь»). τὸν ἀγοράσαντα αὐτοὺς δεσπότην — 買い取ってくださった主人 (δεσπότης — 主人[しゅじん], как в 1 Тим 6:1–2). ἐπάγοντες ἑαυτοῖς ταχινὴν ἀπώλειαν — 自分たちに速やかな滅びを招き寄せる."
  2: "πολλοὶ ἐξακολουθήσουσιν αὐτῶν ταῖς ἀσελγείαις — 多くの人が彼らの放縦に従う (ἀσέλγεια — «распущенность, бесстыдство»). δι᾿ οὓς ἡ ὁδὸς τῆς ἀληθείας βλασφημηθήσεται — 彼らのために真理の道がそしられる (βλασφημέω — «хулить, злословить»)."
  3: "ἐν πλεονεξίᾳ πλαστοῖς λόγοις ὑμᾶς ἐμπορεύσονται — 貪欲のあまり、巧みな言葉であなたがたを商う (ἐμπορεύομαι — «торговать»; πλαστός — «поддельный, измышленный»). τὸ κρίμα ἔκπαλαι οὐκ ἀργεῖ — 裁きは昔から怠っていない (ἀργέω — «медлить, бездействовать»). ἡ ἀπώλεια αὐτῶν οὐ νυστάζει — 彼らの滅びもまどろまない (νυστάζω — «дремать»)."
  4: "ἀγγέλων ἁμαρτησάντων οὐκ ἐφείσατο — 罪を犯した天使たちを容れず (φείδομαι — «щадить»; ср. Иуд 6). σιραῖς ζόφου ταρταρώσας — 暗やみの鎖に縛って地獄に投げ込み (σειραί — «верёвки, узы», в базе σιραῖς; ταρταρόω — «низвергать в тартар»; у jp-joc 地獄の幽暗の縲絏). εἰς κρίσιν τηρουμένους — 裁きのために取っておかれた (τηρέω — «блюсти, хранить»)."
  5: "ἀρχαίου κόσμου οὐκ ἐφείσατο — 昔の世を容れず. ὄγδοον Νῶε δικαιοσύνης κήρυκα ἐφύλαξεν — ノアと、ほかに七人とを守られた (букв. «восьмого Ноя сохранил»: ὄγδοος — «восьмой», т. е. Ной с семью другими; ср. 1 Пет 3:20). κατακλυσμὸν κόσμῳ ἀσεβῶν ἐπάξας — 不敬虔な者たちの世に洪水をもたらして."
  6: "πόλεις Σοδόμων καὶ Γομόρρας τεφρώσας κατέκρινεν — ソドムとゴモラの町々を灰に変えて滅ぼし (τεφρόω — «обращать в пепел»). ὑπόδειγμα μελλόντων ἀσεβέσιν τεθεικώς — これから不敬虔になる者たちへの見せしめとされた (ὑπόδειγμα — «образец, пример»)."
  7: "δίκαιον Λὼτ καταπονούμενον — 苦しめられていた義人ロト (καταπονέω — «изнурять, мучить»). ὑπὸ τῆς τῶν ἀθέσμων ἐν ἀσελγείᾳ ἀναστροφῆς — 無法な者たちの放縦な行いによって (ἄθεσμος — «беззаконный»; ἀναστροφή — «поведение»). ἐρρύσατο — 救い出された."
  8: "βλέμματι γὰρ καὶ ἀκοῇ — 目と耳によって (букв. «взглядом и слухом»). ἐγκατοικῶν ἐν αὐτοῖς — 彼らの間に住みながら. ἡμέραν ἐξ ἡμέρας — 日ごとに. ψυχὴν δικαίαν ἀνόμοις ἔργοις ἐβασάνιζεν — 正しい心を痛めていた (βασανίζω — «мучить»)."
  9: "οἶδεν κύριος εὐσεβεῖς ἐκ πειρασμοῦ ῥύεσθαι — 主は敬虔な者を試みから救い出すことを知っておられる (πειρασμός — 試み). ἀδίκους…κολαζομένους τηρεῖν — 正しくない者を…罰を受けるままに取っておかれる (κολάζω — «наказывать»). εἰς ἡμέραν κρίσεως — 裁きの日まで."
  10: "τοὺς ὀπίσω σαρκὸς ἐν ἐπιθυμίᾳ μιασμοῦ πορευομένους — 肉に従って汚れた欲に身を任せ (μιασμός — «осквернение»). κυριότητος καταφρονοῦντας — 主権を蔑む (κυριότης — «господство», ангельский чин). δόξας οὐ τρέμουσιν βλασφημοῦντες — 尊い者たちをそしりながら恐れようともしない (δόξαι — «славы», ангельские силы; у jp-joc 尊者)."
  11: "ἰσχύϊ καὶ δυνάμει μείζονες — 力と権威においてまさって. οὐ φέρουσιν κατ᾽ αὐτῶν…βλάσφημον κρίσιν — そしりの裁きを下そうとはしない (φέρω — «приносить»; κρίσις βλασφημίας — «обвинение в хуле»). παρὰ κυρίῳ — 主の前で."
  12: "ὡς ἄλογα ζῷα γεγεννημένα φυσικὰ εἰς ἅλωσιν καὶ φθοράν — 捕らえて滅ぼされるために生まれた、理性のない獣のように (ἄλογος — «бессловесный»; ἅλωσις — «поимка»). ἐν οἷς ἀγνοοῦσιν βλασφημοῦντες — 知りもしないことをそしり. ἐν τῇ φθορᾷ αὐτῶν καὶ φθαρήσονται — その滅びのうちに彼らも滅ぼされていく (игра слов φθορά — «тление» и φθείρω — «истреблять»)."
  13: "ἀδικούμενοι μισθὸν ἀδικίας — 不義の報いを受ける (ἀδικέω — «терпеть неправду»; род. цены). ἡδονὴν ἡγούμενοι τὴν ἐν ἡμέρᾳ τρυφήν — 昼の享楽を喜びとし (τρυφή — «роскошь, пиршество»). σπίλοι καὶ μῶμοι — しみとよごれ (σπίλος — «пятно», μῶμος — «порок»). ἐντρυφῶντες ἐν ταῖς ἀπάταις αὐτῶν συνευωχούμενοι ὑμῖν — あなたがたと食卓を共にしながら、自分たちの欺きのうちでぜいたくにふるまう."
  14: "ὀφθαλμοὺς…μεστοὺς μοιχαλίδος — 目は淫らな女で満ち (род. содержания; μοιχαλίς — «прелюбодейка»). ἀκαταπαύστους ἁμαρτίας — 罪を犯してやまない. δελεάζοντες ψυχὰς ἀστηρίκτους — 心の定まらない者たちを誘い (δελεάζω — «приманивать приманкой»; ἀστήρικτος — «неутверждённый»). καρδίαν γεγυμνασμένην πλεονεξίας — 心は貪欲に鍛えられている (γυμνάζω — «упражнять»). κατάρας τέκνα — 呪いの子ら."
  15: "καταλείποντες εὐθεῖαν ὁδόν — 正しい道を捨てて (εὐθεῖα ὁδός — «прямой путь»). τῇ ὁδῷ τοῦ Βαλαὰμ τοῦ Βοσόρ — ボソルの子バラムの道 (Βοσόρ — ボソル; у jp-joc ワォソル; ср. Числ 22–24; Откр 2:14). μισθὸν ἀδικίας ἠγάπησεν — 不義の報酬を愛した."
  16: "ἔλεγξιν…ἔσχεν ἰδίας παρανομίας — 自分の無法のことで責められた (ἔλεγξις — «обличение»). ὑποζύγιον ἄφωνον — ものを言わない荷を負う獣 (ὑποζύγιον — «вьючное животное»). ἐν ἀνθρώπου φωνῇ φθεγξάμενον — 人の声で語り. τὴν τοῦ προφήτου παραφρονίαν — 預言者の狂い (παραφρονία — «безумие»)."
  17: "πηγαὶ ἄνυδροι — 水のない泉. ὁμίχλαι ὑπὸ λαίλαπος ἐλαυνόμεναι — 嵐に追い払われる霧 (λαῖλαψ — «буря»). ὁ ζόφος τοῦ σκότους τετήρηται — 暗やみの濃い闇が…取っておかれている. εἰς αἰῶνα («навсегда») — церковное добавление (Елизаветинская «вовеки», jp-joc「永遠の幽暗»); в базе его нет (проверено: αιωνα — НЕТ), поэтому 〔永遠に〕."
  18: "ὑπέρογκα…φθεγγόμενοι — むなしく大げさなことを語り (ὑπέρογκος — «надутый»). δελεάζουσιν ἐν ἐπιθυμίαις σαρκὸς ἀσελγείαις — 肉の欲にふけって放縦にふるまい、誘い込む. τοὺς ὀλίγως ἀποφεύγοντας τοὺς ἐν πλάνῃ ἀναστρεφομένους — 迷いのうちに生きている者たちから、かろうじて逃れた人々 (ὀλίγως — «едва»)."
  19: "ἐλευθερίαν αὐτοῖς ἐπαγγελλόμενοι — 自由を約束しながら. δοῦλοι ὑπάρχοντες τῆς φθορᾶς — 滅びの奴隷. ᾧ γάρ τις ἥττηται, τούτῳ δεδούλωται — 人が負けた者の奴隷となる (ἡττάω — «быть побеждённым»; δουλόω — «порабощать»)."
  20: "ἀποφυγόντες τὰ μιάσματα τοῦ κόσμου — 世の汚れから逃れて (μίασμα — «скверна»). ἐν ἐπιγνώσει τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ — 主であり救い主であるイエス・キリストを知ることによって. ἐμπλακέντες ἡττῶνται — 巻き込まれて負ける. γέγονεν αὐτοῖς τὰ ἔσχατα χείρονα τῶν πρώτων — その後の状態は初めよりも悪くなる."
  21: "κρεῖττον γὰρ ἦν αὐτοῖς μὴ ἐπεγνωκέναι — 知らないほうが、むしろよかった. ἐπιγνοῦσιν ὑποστρέψαι — 知ったうえで背き返す. τῆς παραδοθείσης αὐτοῖς ἁγίας ἐντολῆς — 自分たちに伝えられた聖なる戒め."
  22: "συμβέβηκεν αὐτοῖς τὸ τῆς ἀληθοῦς παροιμίας — あの真のことわざのとおりのことが起こった (συμβαίνω — «случаться»). Первая половина — Притч 26:11 (κύων ἐπιστρέψας ἐπὶ τὸ ἴδιον ἐξέραμα — 犬は自分の吐いた物に戻る); вторая — поговорка, известная и в раввинской традиции (ср. также «Ахикар»), в канон не входит; отнесена к тому же 諺. ὗς λουσαμένη εἰς κυλισμὸν βορβόρου — 豚は洗われてから、また泥の中に転がる."
