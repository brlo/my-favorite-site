# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 29: обличающий и жестоковыйный (1); праведные и нечестивые начальники (2);
# любящий премудрость (3); царь праведный и беззаконник (4); сеть другу (5);
# сеть грешнику (6); праведный суд для бедных (7); губители города (8); мудрый и дурной
# (9); кровожадные и прямые (10); гнев глупого (11); царь и неправое слово (12);
# заимодавец и должник (13); престол царя (14); удары и обличения (15); множество
# нечестивых (16); наказание сына (17); без возвещателя (18); раб жестокий (19);
# скорый в словах (20); нежащий раба (21); гневливый (22); гордость и смирение (23);
# сообщник вора (24); страх людей и упование на Господа (25); угождение начальникам (26);
# мерзость для праведного (27).
# Прямой речи нет.
