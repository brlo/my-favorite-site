verses:
  1: "責[せ]める人[ひと]は、強情[ごうじょう]な人[ひと]よりも良[よ]い。強情な者[もの]は、突然[とつぜん]燃[も]え上[あ]がると、癒[いや]しがなくなるからである。"
  2: "正[ただ]しい者[もの]たちがほめたたえられると、民[たみ]は喜[よろこ]ぶ。しかし、不敬[ふけい]な者[もの]たちが支配[しはい]すると、人[ひと]は嘆[なげ]く。"
  3: "知恵[ちえ]を愛[あい]する人[ひと]の父[ちち]は喜[よろこ]ぶ。しかし、遊女[ゆうじょ]たちを牧[まき]する者[もの]は富[とみ]を失[うしな]う。"
  4: "正[ただ]しい王[おう]は国[くに]を興[おこ]す。しかし、不法[ふほう]な者[もの]はそれを掘[ほ]り崩[くず]す。"
  5: "自分[じぶん]の友[とも]の前[まえ]に網[あみ]を仕掛[しか]ける者[もの]は、それを自分[じぶん]の足[あし]に掛[か]けることになる。"
  6: "罪[つみ]を犯[おか]す人[ひと]には大[おお]きな罠[わな]がある。しかし、正[ただ]しい者[もの]は喜[よろこ]びと楽しみのうちにある。"
  7: "正[ただ]しい者[もの]は貧[まず]しい者[もの]のために裁[さば]くことを知[し]っている。しかし、不敬[ふけい]な者[もの]は知識[ちしき]を悟[さと]らない。貧しい者[もの]には、わきまえる心[こころ]がない。"
  8: "悪[わる]い者[もの]たちは町[まち]を焼[や]き払[はら]った。しかし、知恵[ちえ]ある者[もの]たちは怒[いか]りをそらした。"
  9: "知恵[ちえ]ある人[ひと]は民[たみ]を裁[さば]く。しかし、つまらない者[もの]は怒[いか]っても嘲笑[ちょうしょう]われ、恐[おそ]れられもしない。"
  10: "血[ち]を流[なが]すことに加[くわ]わる者[もの]たちは敬虔[けいけん]な者[もの]を憎[にく]む。しかし、正[まっ]すぐな者[もの]たちはその魂[たましい]を求[もと]める。"
  11: "愚[おろ]かな者[もの]は怒[いか]りをすべて吐[は]き出[だ]す。しかし、知恵[ちえ]ある者[もの]はそれを少[すこ]しずつ収[おさ]める。"
  12: "王[おう]が不正[ふせい]な言葉[ことば]に耳[みみ]を貸[か]すなら、その下[した]にいる者[もの]はすべて不法[ふほう]な者[もの]となる。"
  13: "貸[か]し主[ぬし]と借[か]り主[ぬし]が互[たが]いに出会[であ]うとき、主[しゅ]はその両方[りょうほう]を顧[かえり]みられる。"
  14: "王[おう]が真理[しんり]をもって貧[まず]しい者[もの]たちを裁[さば]くなら、その王座[おうざ]は証[あかし]として堅[かた]く据[す]えられる。"
  15: "打[う]ちたたきと責[せ]めは知恵[ちえ]を与[あた]える。しかし、迷[まよ]い歩[ある]く子[こ]は自分[じぶん]の親[おや]を辱[はずかし]める。"
  16: "不敬[ふけい]な者[もの]が多[おお]くなれば罪[つみ]も多くなる。しかし、正[ただ]しい者[もの]たちは、彼[かれ]らが倒[たお]れるのを見[み]て恐[おそ]れを抱[いだ]く。"
  17: "あなたの子[こ]を戒[いまし]めよ。そうすれば、子はあなたを安[やす]らかにし、あなたの魂[たましい]に飾[かざ]りを与[あた]える。"
  18: "不法[ふほう]な民[たみ]には告[つ]げ知[し]らせる者[もの]が立[た]たない。しかし、律法[りっぽう]を守[まも]る者[もの]は幸[さいわ]いである。"
  19: "強情[ごうじょう]なしもべは言葉[ことば]では戒[いまし]められない。たとえ理解[りかい]しても、聞[き]き従[したが]わないからである。"
  20: "言葉[ことば]の速[はや]い人[ひと]を見[み]たら、その人[ひと]よりも愚[おろ]かな者[もの]のほうがまだ希望[きぼう]があると知[し]れ。"
  21: "幼[おさな]い時[とき]から甘[あま]やかされて育[そだ]つ者[もの]は、しもべとなる。そして最後[さいご]には、そのことで自分[じぶん]を苦[くる]しめる。"
  22: "短気[たんき]な人[ひと]は争[あらそ]いを掘[ほ]り起[お]こし、怒[いか]りやすい人[ひと]は罪[つみ]を掘[ほ]り出[だ]す。"
  23: "傲慢[ごうまん]は人[ひと]を低[ひく]くする。しかし、主[しゅ]は心[こころ]の低[ひく]い者[もの]たちを栄光[えいこう]のうちに据[す]えられる。"
  24: "盗人[ぬすびと]と分[わ]け合[あ]う者[もの]は自分[じぶん]の魂[たましい]を憎[にく]んでいる。呪[のろ]いの誓[ちか]いを聞[き]いても、告[つ]げないのである。"
  25: "人[ひと]を恐[おそ]れて恥[は]じる者[もの]たちはつまずく。しかし、主[しゅ]に信頼[しんらい]する者[もの]は喜[よろこ]ぶ。不敬[ふけい]は人[ひと]につまずきを与[あた]える。しかし、主[しゅ]に信頼する者[もの]は救[すく]われる。"
  26: "多[おお]くの者[もの]が支配者[しはいしゃ]たちの顔[かお]に仕[つか]える。しかし、人[ひと]の正[ただ]しさは主[しゅ]から来[く]る。"
  27: "正[ただ]しい者[もの]たちにとって、不正[ふせい]な人[ひと]は忌[い]まわしい。不法[ふほう]な者[もの]にとって、正[まっ]すぐな道[みち]は忌まわしい。"

notes:
  1: "κρείσσων ἀνὴρ ἐλέγχων ἀνδρὸς σκληροτραχήλου — «лучше муж обличающий мужа жестоковыйного» (ἐλέγχω — «обличать»; σκληροτράχηλος — «с жёсткой шеей, упрямый»); ἐξαπίνης γὰρ φλεγομένου αὐτοῦ οὐκ ἔστιν ἴασις — «ибо внезапно, когда он воспламенится, нет исцеления» (φλέγομαι — «гореть, воспламеняться»; ἴασις — «исцеление»). Синодальный иной (по масоретскому тексту: «ожесточает выю»)."
  2: "ἐγκωμιαζομένων δικαίων εὐφρανθήσονται λαοί — «когда хвалят праведных, возвеселятся народы» (ἐγκωμιάζω — «восхвалять»); ἀρχόντων δὲ ἀσεβῶν στένουσιν ἄνδρες — «когда же начальствуют нечестивые, стонут мужи» (ἄρχω — «начальствовать»; στένω — «стенать»)."
  3: "ἀνδρὸς φιλοῦντος σοφίαν εὐφραίνεται πατὴρ αὐτοῦ — «о муже, любящем премудрость, радуется отец его»; ὃς δὲ ποιμαίνει πόρνας, ἀπολεῖ πλοῦτον — «кто же пасёт блудниц, погубит богатство» (πόρνη — «блудница»; ἀπόλλυμι — «губить»)."
  4: "βασιλεὺς δίκαιος ἀνίστησιν χώραν — «царь праведный воздвигает страну» (ἀνίστημι — «поднимать, утверждать»; χώρα — «страна»); ἀνὴρ δὲ παράνομος κατασκάπτει — «муж же беззаконный разрушает (подкапывает)» (κατασκάπτω — «разрывать, разрушать»); слав. «раскоповает». Синодальный «любящий подарки» (по масоретскому тексту)."
  5: "ὃς παρασκευάζεται ἐπὶ πρόσωπον τοῦ ἑαυτοῦ φίλου δίκτυον — «кто готовит пред лицом друга своего сеть» (παρασκευάζω — «готовить»; δίκτυον — «сеть»); περιβάλλει αὐτὸ τοῖς ἑαυτοῦ ποσίν — «возлагает её на свои ноги» (περιβάλλω — «налагать»)."
  6: "ἁμαρτάνοντι ἀνδρὶ μεγάλη παγίς — «грешащему мужу — великая западня» (παγίς — «западня, сеть»); δίκαιος δὲ ἐν χαρᾷ καὶ ἐν εὐφροσύνῃ ἔσται — «праведный же в радости и веселии будет» (εὐφροσύνη — «веселие»)."
  7: "ἐπίσταται δίκαιος κρίνειν πενιχροῖς — «умеет праведный судить для бедных» (ἐπίσταμαι — «уметь, знать»; πενιχρός — «бедный»); ὁ δὲ ἀσεβὴς οὐ συνήσει γνῶσιν — «нечестивый же не уразумеет знания»; καὶ πτωχῷ οὐχ ὑπάρχει νοῦς ἐπιγνώμων — «и у бедного нет ума понимающего»: тёмное место, сохранено буквально; слав. «убогому несть ума разумевающаго»."
  8: "ἄνδρες λοιμοὶ ἐξέκαυσαν πόλιν — «мужи губительные сожгли город» (λοιμός — «гибельный, заразительный»; ἐκκαίω — «сожигать»); σοφοὶ δὲ ἀπέστρεψαν ὀργήν — «мудрые же отвратили гнев» (ἀποστρέφω — «отвращать»). Синодальный «возмущают город» (по масоретскому тексту)."
  9: "ἀνὴρ σοφὸς κρίνει ἔθνη — «муж мудрый судит народы»; ἀνὴρ δὲ φαῦλος ὀργιζόμενος καταγελᾶται καὶ οὐ καταπτήσσει — «муж же дурной, гневаясь, осмеивается и не устрашает» (φαῦλος — «плохой, ничтожный»; καταγελάομαι — «быть осмеиваемым»). Синодальный иной (по масоретскому тексту: «судясь с глупым»)."
  10: "ἄνδρες αἱμάτων μέτοχοι μισήσουσιν ὅσιον — «мужи, участники кровей, возненавидят преподобного» (μέτοχος — «участник»; ὅσιος — «святой, благочестивый»); οἱ δὲ εὐθεῖς ἐκζητήσουσιν ψυχὴν αὐτοῦ — «прямые же взыщут душу его» (ἐκζητέω — «искать, требовать»). Оборот допускает и «будут заботиться о его жизни» (так Син.); буквальный смысл сохранён."
  11: "ὅλον τὸν θυμὸν αὐτοῦ ἐκφέρει ἄφρων — «весь гнев свой изливает глупый» (ἐκφέρω — «выносить, изливать»); σοφὸς δὲ ταμιεύεται κατὰ μέρος — «мудрый же сберегает по частям» (ταμιεύομαι — «хранить в запасе»)."
  12: "βασιλέως ὑπακούοντος λόγον ἄδικον — «когда царь слушает слово неправедное» (ὑπακούω — «слушаться, внимать»); πάντες οἱ ὑπ᾽ αὐτὸν παράνομοι — «все, кто под ним, — беззаконники» (παράνομος — «беззаконный»)."
  13: "δανιστοῦ καὶ χρεοφειλέτου ἀλλήλοις συνελθόντων — «заимодавца и должника, друг с другом сошедшихся» (δανιστής — «заимодавец»; χρεοφειλέτης — «должник»); ἐπισκοπὴν ποιεῖται ἀμφοτέρων ὁ κύριος — «посещение (попечение) творит обоим Господь» (ἐπισκοπή — «посещение, надзор»). Синодальный «свет глазам» (по масоретскому тексту)."
  14: "βασιλέως ἐν ἀληθείᾳ κρίνοντος πτωχούς — «когда царь во истине судит нищих»; ὁ θρόνος αὐτοῦ εἰς μαρτύριον κατασταθήσεται — «престол его в свидетельство поставлен будет» (μαρτύριον — «свидетельство»; καθίστημι — «ставить»)."
  15: "πληγαὶ καὶ ἔλεγχοι διδόασιν σοφίαν — «удары и обличения дают премудрость» (πληγή — «удар, казнь»); παῖς δὲ πλανώμενος αἰσχύνει γονεῖς αὐτοῦ — «отрок же блуждающий срамит родителей своих» (πλανάομαι — «блуждать»; αἰσχύνω — «срамить»), т. е. оставленный без надзора."
  16: "πολλῶν ὄντων ἀσεβῶν πολλαὶ γίνονται ἁμαρτίαι — «когда много нечестивых, многие бывают грехи»; οἱ δὲ δίκαιοι ἐκείνων πιπτόντων κατάφοβοι γίνονται — «праведные же, когда те падают, приходят в страх» (κατάφοβος — «объятый страхом»)."
  17: "παίδευε υἱόν σου, καὶ ἀναπαύσει σε — «наказывай сына твоего, и упокоит тебя» (ἀναπαύω — «успокаивать»); δώσει κόσμον τῇ ψυχῇ σου — «даст украшение душе твоей» (κόσμος — «украшение»)."
  18: "οὐ μὴ ὑπάρξῃ ἐξηγητὴς ἔθνει παρανόμῳ — «не будет изъяснителя народу беззаконному» (ἐξηγητής — «изъяснитель, возвещатель»; слав. «сказатель»); ὁ δὲ φυλάσσων τὸν νόμον μακαριστός — «хранящий же закон блажен» (μακαριστός — «блаженный»). Синодальный «без откровения свыше» (по масоретскому тексту); держимся греческого."
  19: "λόγοις οὐ παιδευθήσεται οἰκέτης σκληρός — «словами не научится раб жестокий» (παιδεύω — «воспитывать, наставлять»; οἰκέτης — «раб, слуга»); ἐὰν γὰρ καὶ νοήσῃ, ἀλλ᾽ οὐχ ὑπακούσεται — «ибо если и поймёт, но не послушается» (ὑπακούω — «слушаться»)."
  20: "ἐὰν ἴδῃς ἄνδρα ταχὺν ἐν λόγοις — «если увидишь мужа скорого в словах» (ταχύς — «быстрый»); γίνωσκε ὅτι ἐλπίδα ἔχει μᾶλλον ἄφρων αὐτοῦ — «знай, что надежду имеет больше глупый, чем он» (ἐλπίς — «надежда»)."
  21: "ὃς κατασπαταλᾷ ἐκ παιδός, οἰκέτης ἔσται — «кто живёт в неге с детства, рабом будет» (κατασπαταλάω — «жить в роскоши, нежиться»); ἔσχατον δὲ ὀδυνηθήσεται ἐφ᾽ ἑαυτῷ — «в конце же будет болезновать о том» (ὀδυνάομαι — «скорбеть, болеть»); слав. «ласкосерд будет от детства». Синодальный иной (по масоретскому тексту: «захочет быть сыном»)."
  22: "ἀνὴρ θυμώδης ὀρύσσει νεῖκος — «муж гневливый выкапывает ссору» (θυμώδης — «вспыльчивый»; ὀρύσσω — «копать»; νεῖκος — «ссора»); ἀνὴρ δὲ ὀργίλος ἐξώρυξεν ἁμαρτίας — «муж же яростный выкопал грехи» (ὀργίλος — «гневливый»)."
  23: "ὕβρις ἄνδρα ταπεινοῖ — «надменность унижает мужа» (ὕβρις — «гордыня, наглость»; ταπεινόω — «унижать»); τοὺς δὲ ταπεινόφρονας ἐρείδει δόξῃ κύριος — «смиренномудрых же утверждает в славе Господь» (ταπεινόφρων — «смиренномудрый»; ἐρείδω — «утверждать»)."
  24: "ὃς μερίζεται κλέπτῃ, μισεῖ τὴν ἑαυτοῦ ψυχήν — «кто делится с вором, ненавидит свою душу» (μερίζομαι — «иметь часть, делиться»); ἐὰν δὲ ὅρκου προτεθέντος ἀκούσαντες μὴ ἀναγγείλωσιν — «если же, при предложенной клятве, услышав, не возвестят» (προτίθημι — «предлагать»; ἀναγγέλλω — «возвещать»). Мысль продолжается в ст. 25."
  25: "φοβηθέντες καὶ αἰσχυνθέντες ἀνθρώπους ὑπεσκελίσθησαν — «убоявшись и постыдившись людей, преткнулись» (ὑποσκελίζω — «подставлять ногу, соблазнять»); ὁ δὲ πεποιθὼς ἐπὶ κύριον εὐφρανθήσεται — «полагающийся же на Господа возвеселится»; ἀσέβεια ἀνδρὶ δίδωσιν σφάλμα — «нечестие мужу даёт преткновение» (σφάλμα — «падение, преткновение»); ὃς δὲ πέποιθεν ἐπὶ τῷ δεσπότῃ, σωθήσεται — «полагающийся же на Владыку спасётся». В gr стих двойной (25a и 25b), в csl обе половины в одном стихе."
  26: "πολλοὶ θεραπεύουσιν πρόσωπα ἡγουμένων — «многие угождают лицам начальствующих» (θεραπεύω — «служить, угождать»; ἡγούμενος — «начальствующий»); παρὰ δὲ κυρίου γίνεται τὸ δίκαιον ἀνδρὶ — «от Господа же бывает правда мужу»."
  27: "βδέλυγμα δικαίοις ἀνὴρ ἄδικος — «мерзость праведным муж неправедный» (βδέλυγμα — «мерзость»); βδέλυγμα δὲ ἀνόμῳ κατευθύνουσα ὁδός — «мерзость же беззаконному путь прямой» (κατευθύνω — «направлять прямо»)."
