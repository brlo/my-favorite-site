verses:
  1: "モーセとイスラエルの長老[ちょうろう]たちは、民[たみ]に命[めい]じて言[い]った。「あなたがたは、今日[きょう]、わたしがあなたがたに命じるこれらすべての戒[いまし]めを守[まも]りなさい。"
  2: "あなたがたがヨルダン川[がわ]を渡[わた]って、あなたの神[かみ]である主[しゅ]があなたに与[あた]える地[ち]に入[はい]る日[ひ]には、あなたは大[おお]きな石[いし]を立[た]て、それらを石灰[せっかい]で塗[ぬ]りなさい。"
  3: "あなたがたがヨルダン川を渡って、あなたの父[ちち]たちの神[かみ]である主[しゅ]があなたに与える地、乳[ちち]と蜜[みつ]の流[なが]れる地に入[はい]るとき、あなたはこの律法[りっぽう]のすべての言葉[ことば]をその石[いし]の上[うえ]に書[か]き記[しる]しなさい。あなたの父たちの神である主があなたに語[かた]られたとおりである。"
  4: "あなたがたがヨルダン川を渡ったなら、今日[きょう]、わたしがあなたに命[めい]じるこれらの石をエバル山[やま]に立て、それらを石灰[せっかい]で塗りなさい。"
  5: "そこで、あなたの神[かみ]である主[しゅ]に祭壇[さいだん]を築[きず]きなさい。石[いし]の祭壇である。その上[うえ]に鉄[てつ]を当[あ]ててはならない。"
  6: "あなたの神[かみ]である主[しゅ]に、そのままの石[いし]で祭壇[さいだん]を築き、その上[うえ]であなたの神である主に燔祭[はんさい]をささげなさい。"
  7: "そこであなたの神[かみ]である主[しゅ]に酬恩祭[しゅうおんさい]をささげ、食[た]べて満[み]ち足[た]り、あなたの神である主の前[まえ]で喜[よろこ]びなさい。"
  8: "あなたはこの律法[りっぽう]のすべてを、非常[ひじょう]に明[あき]らかに石[いし]の上[うえ]に書き記しなさい。」"
  9: "モーセとレビ人[びと]の祭司[さいし]たちは、すべてのイスラエルに言[い]った。「静[しず]まって聞[き]け、イスラエルよ。今日[きょう]、あなたはあなたの神[かみ]である主[しゅ]の民[たみ]となった。"
  10: "あなたはあなたの神[かみ]である主[しゅ]の声[こえ]に聞[き]き従[したが]い、今日[きょう]、わたしがあなたに命[めい]じる主のすべての戒[いまし]めと定[さだ]めを行[おこな]いなさい。」"
  11: "モーセはその日[ひ]、民[たみ]に命[めい]じて言[い]った。「"
  12: "ヨルダン川[がわ]を渡[わた]った後[あと]、ゲリジム山[やま]に立[た]って民[たみ]を祝福[しゅくふく]するのは、シメオン、レビ、ユダ、イッサカル、ヨセフ、ベニヤミンである。"
  13: "呪[のろ]いのためにエバル山[やま]に立[た]つのは、ルベン、ガド、アシェル、ゼブルン、ダン、ナフタリである。」"
  14: "レビ人[びと]たちは答[こた]えて、すべてのイスラエルに大声[おおごえ]で言[い]う。"
  15: "「彫[ほ]ったものや鋳[い]たもの、主[しゅ]に忌[い]まわしいもの、職人[しょくにん]の手の業[わざ]を造[つく]り、それを隠[かく]れた所[ところ]に置[お]く者[もの]は呪[のろ]われる。」『アーメン』"
  16: "「父[ちち]または母[はは]を軽[かろ]んじる者[もの]は呪[のろ]われる。」『アーメン』"
  17: "「隣人[りんじん]の地境[じざかい]を移[うつ]す者[もの]は呪[のろ]われる。」『アーメン』"
  18: "「道[みち]で盲人[もうじん]を迷[まよ]わせる者[もの]は呪[のろ]われる。」『アーメン』"
  19: "「寄留者[きりゅうしゃ]、孤児[こじ]、寡婦[かふ]の裁[さば]きを曲[ま]げる者[もの]は呪[のろ]われる。」『アーメン』"
  20: "「父[ちち]の妻[つま]と寝[ね]る者[もの]は呪[のろ]われる。彼は父の覆[おお]いを開[ひら]いたからである。」『アーメン』"
  21: "「すべての家畜[かちく]と寝[ね]る者[もの]は呪[のろ]われる。」『アーメン』"
  22: "「父[ちち]を同じくするか、母[はは]を同じくする姉妹[しまい]と寝[ね]る者[もの]は呪[のろ]われる。」『アーメン』"
  23: "「妻[つま]の母[はは]と寝[ね]る者[もの]は呪[のろ]われる。」『アーメン』「妻の姉妹[しまい]と寝る者は呪われる。」『アーメン』"
  24: "「隣人[りんじん]をこっそり打[う]つ者[もの]は呪[のろ]われる。」『アーメン』"
  25: "「無実[むじつ]の者[もの]の血[ち]を流[なが]すために賄賂[わいろ]を取[と]る者は呪[のろ]われる。」『アーメン』"
  26: "「この律法[りっぽう]のすべての言葉[ことば]にとどまって行[おこな]わない者[もの]は、だれでも呪[のろ]われる。」『アーメン』"

notes:
  1: "προσέταξεν — повелел, заповедал (προστάσσω); γερουσία — старейшины, совет старейшин (слав. «старейшины сынов израилевых»); Φυλάσσεσθε — соблюдайте (φυλάσσω), повелительное мн. ч."
  2: "ᾗ ἂν ἡμέρᾳ — в какой бы день; διαβῆτε τὸν Ιορδάνην — перейдёте Иордан; κονιάσεις αὐτοὺς κονίᾳ — обмажешь их известью (κονιάω, κονία — известь; тавтология греческого сохранена)."
  3: "γράψεις — напишешь; πάντας τοὺς λόγους τοῦ νόμου — все слова закона; ὡς ἂν διαβῆτε … ἡνίκα ἐὰν εἰσέλθητε — двойное «когда» (перейдёте… войдёте), сохранено; γῆν ῥέουσαν γάλα καὶ μέλι — землю, текущую молоком и мёдом."
  4: "στήσετε τοὺς λίθους — поставите камни; ἐν ὄρει Γαιβαλ — на горе Гевал (LXX Γαιβαλ = евр. Эйбал; яп. エバル山 по корпусной передаче); κονιάσεις — обмажешь известью."
  5: "οἰκοδομήσεις — созиждешь, построишь; θυσιαστήριον ἐκ λίθων — жертвенник из камней; οὐκ ἐπιβαλεῖς ἐπ᾽ αὐτοὺς σίδηρον — не возложишь на них железо, т.е. камни не обтёсаны железным инструментом (ср. Исх 20:25)."
  6: "λίθους ὁλοκλήρους — камни цельные, нетронутые (ὁλόκληρος; слав. «всецелым»); ἀνοίσεις — вознесёшь (ἀναφέρω); ὁλοκαυτώματα — всесожжения (燔祭)."
  7: "θύσεις — заколёшь, принесёшь в жертву; θυσία σωτηρίου — жертва спасения, мирная (в корпусе 酬恩祭); ἐμπλησθήσῃ — насытишься; εὐφρανθήσῃ ἐναντίον κυρίου — возвеселишься пред Господом."
  8: "γράψεις — напишешь; πάντα τὸν νόμον τοῦτον — весь закон сей; σαφῶς σφόδρα — ясно весьма, отчётливо (слав. «яве зело»); наречие усиливает требование читаемости."
  9: "ἐλάλησεν Μωϋσῆς καὶ οἱ ἱερεῖς οἱ Λευῖται — сказал Моисей и священники-левиты; Σιώπα — молчи (σιωπάω), призыв к вниманию; γέγονας εἰς λαόν — стал народом (γίνομαι εἰς)."
  10: "εἰσακούσῃ — послушаешь (εἰσακούω); ποιήσεις — исполнишь; δικαιώματα — оправдания, уставы (定め); ὅσα ἐγὼ ἐντέλλομαί σοι — которые я заповедую тебе."
  11: "ἐνετείλατο — заповедал; τῷ λαῷ — народу; ἐν τῇ ἡμέρᾳ ἐκείνῃ — в тот день; λέγων — говоря (вводная формула, содержание — в 12–13)."
  12: "στήσονται εὐλογεῖν — станут благословлять (ἵστημι + инфинитив цели); διαβάντες τὸν Ιορδάνην — перейдя Иордан; ἐν ὄρει Γαριζιν — на горе Геризим; перечислены шесть колен."
  13: "στήσονται ἐπὶ τῆς κατάρας — станут для проклятия (ἐπί + род.; слав. «на клятву»); ἐν ὄρει Γαιβαλ — на горе Гевал (エバル山); перечислены шесть колен."
  14: "ἀποκριθέντες — отвечав (семитизм, «и отвечали»); οἱ Λευῖται — левиты; φωνῇ μεγάλῃ — громким голосом; в 15–26 их слова даны первым уровнем 「…」, ответ народа — 『アーメン』."
  15: "γλυπτὸν καὶ χωνευτόν — изваяние и литое (γλυπτός, χωνευτός); βδέλυγμα κυρίῳ — мерзость Господу; ἔργον χειρῶν τεχνίτου — дело рук художника (τεχνίτης); ἐν ἀποκρύφῳ — в тайном месте (слав. «в сокровении»); Γένοιτο — «да будет», по-японски церковное アーメン; 『アーメン』 — ответ всего народа (так же в 16–26)."
  16: "ἀτιμάζων — бесчестящий, позорящий (ἀτιμάζω); πατέρα … ἢ μητέρα — отца или мать; Γένοιτο — アーメン."
  17: "μετατιθεὶς ὅρια — передвигающий межи (μετατίθημι, ὅριον — граница); τοῦ πλησίον — ближнего; Γένοιτο — アーメン."
  18: "πλανῶν τυφλὸν ἐν ὁδῷ — сбивающий слепого с пути (πλανάω — вводить в заблуждение); Γένοιτο — アーメン."
  19: "ἐκκλίνῃ κρίσιν — уклоняет, извращает суд (ἐκκλίνω); προσηλύτου καὶ ὀρφανοῦ καὶ χήρας — пришельца, сироты и вдовы; Γένοιτο — アーメン."
  20: "κοιμώμενος μετὰ γυναικὸς τοῦ πατρὸς αὐτοῦ — спящий с женой отца своего (κοιμάομαι — эвфемизм); συγκάλυμμα τοῦ πατρός — покрывало отца (слав. «покровение»), т.е. край одежды, символ брака; Γένοιτο — アーメン."
  21: "μετὰ παντὸς κτήνους — со всяким скотом (κτῆνος); Γένοιτο — アーメン."
  22: "ἀδελφῆς ἐκ πατρὸς ἢ ἐκ μητρός — сестры по отцу или по матери; Γένοιτο — アーメン."
  23: "πενθερά — тёща, мать жены; ἀδελφῆς γυναικὸς αὐτοῦ — сестры жены его. В LXX в этом стихе два проклятия с двумя ответами (в масоретском тексте и Синодальном — только первое); оба переведены, Γένοιτο — アーメン."
  24: "τύπτων τὸν πλησίον δόλῳ — бьющий ближнего коварно, тайно (δόλος — коварство; слав. «с лестию»); Синодальный «тайно убивает» — истолкование; Γένοιτο — アーメン."
  25: "λάβῃ δῶρα — возьмёт дары, т.е. взятку (δῶρον); πατάξαι ψυχὴν αἵματος ἀθῴου — букв. «поразить душу крови невинной», т.е. убить невинного (αἷμα ἀθῷον); Γένοιτο — アーメン."
  26: "ἐμμενεῖ ἐν πᾶσιν τοῖς λόγοις — пребудет во всех словах (ἐμμένω — держаться, оставаться); τοῦ ποιῆσαι αὐτούς — чтобы исполнять их; ср. Гал 3:10; Γένοιτο — アーメン."
