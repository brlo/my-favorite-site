# jp-box, Второзаконие, глава 27. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в этой главе нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 27: заповедь поставить камни и написать закон (1–8), жертвенник на Евале
# (5–8), «внимай и слушай, Израиль» (9–10), благословение на Геризиме и проклятие
# на Евале (11–13), введение к проклятиям (14), проклятия с ответом народа (15–26; в LXX
# их тринадцать — в 23-м стихе два).
# Речь: 1–8 — слова Моисея и старейшин (「…」), 9–10 — слова Моисея и
# священников-левитов (「…」), 11–13 — слова Моисея (「…» открывается в конце 11-го
# стиха), 14 — повествование. В 15–26 говорит не Моисей, а левиты, поэтому их
# слова стоят первым уровнем 「…」, а ответ народа — 『アーメン』.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (проверено по выгрузке).
# Сносок ⟨…⟩ нет: 祭壇, 燔祭, 酬恩祭, レビ人, 祭司, 律法 уже в корпусе.
# LXX-особенности: 27:4 Γαιβαλ — Гевал (евр. Эйбал), отсюда エバル山; самарянское
# чтение здесь — Геризим; 27:23 в LXX два проклятия в одном стихе (к тёще и к сестре
# жены), в масоретском тексте и Синодальном — только первое; 27:15 ἐν ἀποκρύφῳ — «в тайном месте».
# jp-ni не использовался.

