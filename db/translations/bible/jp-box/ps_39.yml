verses:
  0: "合唱[がっしょう]の長[ちょう]に歌[うた]わせる。ダビデの詩[うた]。"
  1: "わたしは耐[た]え忍[しの]んで主[しゅ]を待[ま]ち望[のぞ]んだ。主[しゅ]はわたしに耳[みみ]を傾[かたむ]け、わたしの願[ねが]いを聞[き]いてくださった。"
  2: "主[しゅ]はわたしを苦[くる]しみの穴[あな]から、泥[どろ]の沼[ぬま]から引[ひ]き上[あ]げ、わたしの足[あし]を岩[いわ]の上[うえ]に立[た]たせ、わたしの歩[あゆ]みを確[たし]かなものにされた。"
  3: "主[しゅ]はわたしの口[くち]に新[あたら]しい歌[うた]、わたしたちの神[かみ]への賛美[さんび]を置[お]かれた。多[おお]くの者[もの]がこれを見[み]て恐[おそ]れ、主[しゅ]に寄[よ]り頼[たの]む。"
  4: "幸[さいわ]いなのは、その望[のぞ]みを主[しゅ]の名[な]に置[お]く人[ひと]、むなしいものや偽[いつわ]りの狂気[きょうき]に目[め]を向[む]けない人[ひと]である。"
  5: "主[しゅ]、わたしの神[かみ]よ、あなたは多[おお]くの不思議[ふしぎ]を行[おこな]われた。あなたの思[おも]いを、だれもあなたに並[なら]べることはできない。わたしはそれを告[つ]げ、語[かた]ったが、数[かず]が多[おお]すぎて数[かぞ]えきれない。"
  6: "あなたは犠牲[ぎせい]と供[そな]え物[もの]を望[のぞ]まず、かえってわたしに〔体[からだ]〕を備[ととの]えてくださった。焼[や]き尽[つ]くしの犠牲[ぎせい]も、罪[つみ]のための犠牲[ぎせい]も、あなたは求[もと]めなかった。"
  7: "そこで、わたしは言[い]った。「見[み]よ、わたしは来[き]た。書[か]き物[もの]の巻[まき]に、わたしについて記[しる]されている。"
  8: "わたしの神[かみ]よ、わたしはあなたの御心[みこころ]を行[おこな]うことを望[のぞ]んだ。あなたの律法[りっぽう]は、わたしの心[こころ]の内[うち]にある。」"
  9: "わたしは大[おお]きな集[つど]いの中で、義[ぎ]を告[つ]げ知[し]らせた。見[み]よ、わたしは口[くち]を閉[と]ざさない。主[しゅ]よ、あなたがそれを知[し]っておられる。"
  10: "わたしはあなたの義[ぎ]を心[こころ]に隠[かく]さず、あなたの真実[しんじつ]と救[すく]いとを告[つ]げた。あなたのあわれみと真実[しんじつ]とを、大[おお]きな集[つど]いから隠[かく]さなかった。"
  11: "しかし、主[しゅ]よ、あなたの深[ふか]いあわれみを、わたしから遠[とお]ざけないでください。あなたのあわれみと真実[しんじつ]が、いつもわたしを支[ささ]えてきた。"
  12: "数[かぞ]えきれない災[わざわ]いがわたしを取り囲[かこ]み、わたしの不[ふ]法[ほう]がわたしを捕[と]らえ、見上[みあ]げることもできない。それは頭[あたま]の髪[かみ]の毛[け]よりも多[おお]く、わたしの心[こころ]も、わたしを見捨[みす]てた。"
  13: "主[しゅ]よ、どうかわたしを救[すく]い出[だ]してください。主[しゅ]よ、わたしを助[たす]けるために、目[め]を向[む]けてください。"
  14: "わたしの命[いのち]を奪[うば]おうとする者[もの]たちが、ともどもに恥[は]じ、辱[はずかし]められるように。わたしに災[わざわ]いを望[のぞ]む者[もの]たちが、後[うし]ろに退[しりぞ]き、恥[は]じるように。"
  15: "わたしに「うまくいった、うまくいった」と言[い]う者[もの]たちが、直[ただ]ちに、その恥[は]じを負[お]うように。"
  16: "主[しゅ]よ、あなたを求[もと]める者[もの]はみな、あなたによって喜[よろこ]び、楽[たの]しむように。あなたの救[すく]いを愛[あい]する者[もの]が、いつも「主[しゅ]は大[おお]いに讃[たた]えられるように」と言[い]うように。"
  17: "わたしは貧[まず]しく、乏[とぼ]しい。しかし、主[しゅ]はわたしを顧[かえり]みてくださる。あなたはわたしの助[たす]け、わたしの盾[たて]である。わたしの神[かみ]よ、遅[おく]れないでください。"

notes:
  0: "Εἰς τὸ τέλος· τῷ Δαυιδ ψαλμός — 合唱の長に歌わせる、ダビデの詩. εἰς τὸ τέλος — «в конец», церковное понимание «начальнику хора» (Синодальный, jp-joc 伶長に歌はしむ). Надписание — стих 0, скобками не маркируется."
  1: "Ὑπομένων ὑπέμεινα τὸν κύριον — терпя потерпех Господа; евр. усилительная конструкция (inf. absolutus + финитный глагол), отсюда 耐え忍んで待ち望んだ. προσέσχεν μοι — внят ми (προσέχω «склоняться, внимать»). εἰσήκουσεν τῆς δεήσεώς μου — услыша молитву мою (δέησις «прошение»)."
  2: "ἀνήγαγέν με ἐκ λάκκου ταλαιπωρίας — возведе мя от рова страстей (λάκκος «яма, ров»; ταλαιπωρία «бедствие»); 苦しみの穴. ἀπὸ πηλοῦ ἰλύος — от брения тины (πηλός «глина, грязь»; ἰλύς «ил»); 泥の沼. ἔστησεν ἐπὶ πέτραν τοὺς πόδας μου — постави на камени нозе мои. κατηύθυνεν τὰ διαβήματά μου — исправи стопы моя."
  3: "ἐνέβαλεν εἰς τὸ στόμα μου ᾆσμα καινόν — вложи во уста моя песнь нову. ὕμνον τῷ θεῷ ἡμῶν — пение Богу нашему (ὕμνος «гимн, хвала»); 賛美. ὄψονται πολλοὶ καὶ φοβηθήσονται — узрят мнози и убоятся. ἐλπιοῦσιν ἐπὶ κύριον — будут уповать на Господа."
  4: "μακάριος ἀνήρ, οὗ ἐστιν τὸ ὄνομα κυρίου ἐλπὶς αὐτοῦ — блажен муж, емуже есть имя Господне упование его; 望みを主の名に置く人. οὐκ ἐνέβλεψεν εἰς ματαιότητας καὶ μανίας ψευδεῖς — не призре в суеты и неистовления ложная (ἐμβλέπω «всматриваться»; μανία «исступление, безумие»)."
  5: "πολλὰ ἐποίησας σύ, κύριε ὁ θεός μου, τὰ θαυμάσιά σου — многа сотворил еси, Господи Боже мой, чудеса Твоя. τοῖς διαλογισμοῖς σου οὐκ ἔστιν τίς ὁμοιωθήσεταί σοι — помышлениям Твоим несть кто уподобится (διαλογισμός «помысел»). ἀπήγγειλα καὶ ἐλάλησα — возвестих и глаголах. ἐπληθύνθησαν ὑπὲρ ἀριθμόν — умножишася паче числа."
  6: "θυσίαν καὶ προσφορὰν οὐκ ἠθέλησας — жертвы и приношения не восхотел еси (θυσία — 犠牲; προσφορά — 供え物). ὠτία δὲ κατηρτίσω μοι — уши же совершил ми еси. В церковном тексте (слав. «тело же свершил ми еси», Евр 10:5, jp-joc 肉體) здесь σῶμα, которого в gr-lxx-byz нет, поэтому 体[からだ] стоит в 〔…〕. ὁλοκαύτωμα καὶ περὶ ἁμαρτίας οὐκ ᾔτησας — всесожжения и о гресе не взыскал еси (ὁλοκαύτωμα — 焼き尽くしの犠牲)."
  7: "τότε εἶπον Ἰδοὺ ἥκω — тогда рех: се, прииду. ἐν κεφαλίδι βιβλίου γέγραπται περὶ ἐμοῦ — в главизне книжне писано есть о мне (κεφαλίς «свиток, глава книги»); 書き物の巻. Слова Мессии по церковному пониманию (Евр 10:5–7), но красного нет: в псалме это не евангельская речь Христа. Речь открывается здесь и закрывается в конце ст. 8."
  8: "τοῦ ποιῆσαι τὸ θέλημά σου, ὁ θεός μου, ἐβουλήθην — еже сотворити волю Твою, Боже мой, восхотех. τὸν νόμον σου ἐν μέσῳ τῆς κοιλίας μου — закон Твой посреде чрева моего, т. е. во внутреннем существе; 心の内 — по смыслу, букв. «посреди чрева»."
  9: "εὐηγγελισάμην δικαιοσύνην ἐν ἐκκλησίᾳ μεγάλῃ — благовестих правду в церкви велицей (ἐκκλησία «собрание, церковь»); 大きな集い. τὰ χείλη μου οὐ μὴ κωλύσω — уст моих не возбраню (κωλύω «удерживать, запрещать»). κύριε, σὺ ἔγνως — Господи, Ты познал еси."
  10: "τὴν δικαιοσύνην σου οὐκ ἔκρυψα ἐν τῇ καρδίᾳ μου — правду Твою не скрых в сердце моем. τὴν ἀλήθειάν σου καὶ τὸ σωτήριόν σου εἶπα — истину Твою и спасение Твое рех. τὸ ἔλεός σου καὶ τὴν ἀλήθειάν σου ἀπὸ συναγωγῆς πολλῆς — милость Твою и истину Твою от сонма многа (συναγωγή «собрание»)."
  11: "μὴ μακρύνῃς τοὺς οἰκτιρμούς σου ἀπ᾽ ἐμοῦ — не удали щедрот Твоих от мене (οἰκτιρμός «милость, сострадание»); 深いあわれみ. τὸ ἔλεός σου καὶ ἡ ἀλήθειά σου διὰ παντὸς ἀντελάβοντό μου — милость Твоя и истина Твоя выну да заступите мя; аорист «поддержали» — 支えてきた."
  12: "περιέσχον με κακά, ὧν οὐκ ἔστιν ἀριθμός — одержаша мя злая, имже несть числа. κατέλαβόν με αἱ ἀνομίαι μου — постигоша мя беззакония моя. οὐκ ἠδυνήθην τοῦ βλέπειν — не возмогох зрети. ἐπληθύνθησαν ὑπὲρ τὰς τρίχας τῆς κεφαλῆς μου — умножишася паче влас главы моея (θρίξ «волос»). ἡ καρδία μου ἐγκατέλιπέν με — сердце мое остави мя."
  13: "εὐδόκησον, κύριε, τοῦ ῥύσασθαί με — благоволи, Господи, избавити мя (εὐδοκέω «благоволить»). εἰς τὸ βοηθῆσαί μοι πρόσχες — в помощь мою вонми."
  14: "καταισχυνθείησαν καὶ ἐντραπείησαν ἅμα — да постыдятся и посрамятся вкупе (καταισχύνω «посрамлять»; ἐντρέπω «стыдить»). οἱ ζητοῦντες τὴν ψυχήν μου τοῦ ἐξᾶραι αὐτήν — ищущии душу мою, изъяти ю (ἐξαίρω «уносить, губить»). ἀποστραφείησαν εἰς τὰ ὀπίσω — да возвратятся вспять."
  15: "κομισάσθωσαν παραχρῆμα αἰσχύνην αὐτῶν — да приимут абие студ свой (κομίζομαι «получать»; παραχρῆμα «тотчас»). οἱ λέγοντές μοι Εὖγε εὖγε — глаголющии ми: благоже, благоже (εὖγε «хорошо! так тебе!»); うまくいった передаёт злорадство."
  16: "ἀγαλλιάσαιντο καὶ εὐφρανθείησαν ἐπὶ σοί — да возрадуются и возвеселятся о Тебе. πάντες οἱ ζητοῦντές σε — вси ищущии Тебе. εἰπάτωσαν διὰ παντός Μεγαλυνθήτω ὁ κύριος — да рекут выну: да возвеличится Господь. οἱ ἀγαπῶντες τὸ σωτήριόν σου — любящии спасение Твое."
  17: "ἐγὼ δὲ πτωχός εἰμι καὶ πένης — аз же нищ есмь и убог. κύριος φροντιεῖ μου — Господь попечется о мне (φροντίζω «печься»). βοηθός μου καὶ ὑπερασπιστής μου σὺ εἶ — помощник мой и защититель мой еси Ты. ὁ θεός μου, μὴ χρονίσῃς — Боже мой, не закосни (χρονίζω «медлить»)."
