# jp-box, Псалтирь, псалом 39. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный 常体, без 文語.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0.
# Псалом 39: избавление из рва (1–3), блаженство уповающего (4–5),
# жертва заменена послушанием (6–8), благовестие в собрании (9–10),
# молитва о помощи (11–17).
# Красного и синего нет: ст. 6–9 Церковь относит к словам Мессии (Евр 10:5–7),
# но в псалме это не евангельская речь Христа — отмечено в notes, без <j>.
# 〔…〕 одно: 6 — 体[からだ] (церковное σῶμα), в gr-lxx-byz стоит ὠτία («уши»).
# セラ (διάψαλμα) в псалме не встречается.
# Сносок ⟨…⟩ нет: 穴, 沼, 岩 уже понятны.
# jp-ni не использовался.

