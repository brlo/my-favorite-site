# jp-box, Псалтирь, псалом 112. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0,
# стихи 1..9 (ровно по номерам gr-lxx-byz).
# Псалом 112: призыв к хвале (1), имя Господне от восхода до заката (2–3),
# высота Господа и Его снисхождение (4–6), возвышение нищего (7–8),
# неплодная, ставшая матерью (9).
# Красного и синего нет. Кавычек нет: прямой речи в псалме нет.
# 〔…〕 нет: все слова в gr-lxx-byz есть.
# セラ (διάψαλμα) в этой главе нет.
# Сносок ⟨…⟩ нет: あくた — обычное слово, остальное уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: ps
chapter: 112
draft: true

verses:
  0: "アレルヤ。"
  1: "主[しゅ]の僕[しもべ]たちよ、主[しゅ]を賛美[さんび]せよ。主[しゅ]の名[な]を賛美[さんび]せよ。"
  2: "今[いま]からとこしえに至[いた]るまで、主[しゅ]の名[な]がほめたたえられるように。"
  3: "日[ひ]の昇[のぼ]るところから沈[しず]むところまで、主[しゅ]の名[な]を賛美[さんび]せよ。"
  4: "主[しゅ]はもろもろの民[たみ]すべての上[うえ]に高[たか]く、その栄光[えいこう]は天[てん]の上[うえ]にある。"
  5: "だれが、わたしたちの神[かみ]である主[しゅ]に並[なら]ぶだろうか。主[しゅ]は高[たか]い所[ところ]に住[す]まい、"
  6: "天[てん]にも地[ち]にも、低[ひく]くされた者[もの]に目[め]を留[と]められる。"
  7: "主[しゅ]は貧[まず]しい者[もの]を土[つち]の中[なか]から起[おこ]し、乏[とぼ]しい者[もの]をあくたの山[やま]から引[ひ]き上[あ]げ、"
  8: "その人[ひと]を支配者[しはいしゃ]たちとともに、ご自分[じぶん]の民[たみ]の支配者[しはいしゃ]たちとともに座[すわ]らせる。"
  9: "主[しゅ]は子[こ]を産[う]めない女[おんな]を家[いえ]に住[す]まわせ、子[こ]どもを喜[よろこ]ぶ母[はは]とされる。"

notes:
  0: "Αλληλουια — アレルヤ, как по всему корпусу (Откр 19:1, сноска при первом упоминании). В ру-базе надписание «Аллилуия» — стих 0."
  1: "Αἰνεῖτε, παῖδες, κύριον — 主の僕たちよ、主を賛美せよ (παῖς — «отрок, слуга»; 僕[しもべ], как в Пс 113:17 и по корпусу). αἰνεῖτε τὸ ὄνομα κυρίου — 主の名を賛美せよ; двойной призыв сохранён."
  2: "εἴη τὸ ὄνομα κυρίου εὐλογημένον — 主の名がほめたたえられるように (εἴη — оптатив, «да будет»; εὐλογέω — «благословлять, хвалить»). ἀπὸ τοῦ νῦν καὶ ἕως τοῦ αἰῶνος — 今からとこしえに至るまで; формула ἀπὸ τοῦ νῦν καὶ ἕως τοῦ αἰῶνος, как в 113:26 и 117:1."
  3: "ἀπὸ ἀνατολῶν ἡλίου μέχρι δυσμῶν — 日の昇るところから沈むところまで (ἀνατολή — «восход», δύσις/δυσμή — «заход»); пространственная формула сохранена. αἰνεῖτε τὸ ὄνομα κυρίου — 主の名を賛美せよ, повтор 1-го стиха."
  4: "ὑψηλὸς ἐπὶ πάντα τὰ ἔθνη ὁ κύριος — 主はもろもろの民すべての上に高く (ἔθνη — 民[たみ], как в Пс 2:1). ἐπὶ τοὺς οὐρανοὺς ἡ δόξα αὐτοῦ — その栄光は天の上にある (οὐρανοί мн. ч. передано собирательно 天[てん])."
  5: "τίς ὡς κύριος ὁ θεὸς ἡμῶν — だれが、わたしたちの神である主に並ぶだろうか (риторический вопрос, ср. Исх 15:11). ὁ ἐν ὑψηλοῖς κατοικῶν — 高い所に住まい (κατοικέω — «обитать»); предложение продолжается в 6-м стихе, поэтому стих кончается на 住まい、."
  6: "καὶ τὰ ταπεινὰ ἐφορῶν ἐν τῷ οὐρανῷ καὶ ἐν τῇ γῇ — 天にも地にも、低くされた者に目を留められる (ἐφοράω — «смотреть на, призирать»; τὰ ταπεινά — «низкое, смиренное»). Синодальный «на смиренное взирающий»; 低くされた者 — конкретнее, но не сужает смысл до людей только на земле, потому что сказано «на небе и на земле»."
  7: "ὁ ἐγείρων ἀπὸ γῆς πτωχὸν — 貧しい者を土の中から起し (ἐγείρω — «поднимать»; πτωχός — «нищий»). ἀπὸ κοπρίας ἀνυψῶν πένητα — 乏しい者をあくたの山から引き上げ (κοπρία — «навозная куча, свалка»; ἀνυψόω — «возвышать»); あくた — «сор, отбросы», образ не сглажен."
  8: "τοῦ καθίσαι αὐτὸν μετὰ ἀρχόντων — その人を支配者たちとともに座らせる (infinitivus цели; καθίζω — «сажать»). μετὰ ἀρχόντων λαοῦ αὐτοῦ — ご自分の民の支配者たちとともに; повтор ἀρχόντων сохранён, как в греч."
  9: "ὁ κατοικίζων στεῖραν ἐν οἴκῳ — 子を産めない女を家に住まわせ (στεῖρα — «бесплодная»; κατοικίζω — «поселять»). μητέρα τέκνων εὐφραινομένην — 子どもを喜ぶ母とされる (εὐφραίνομαι — «радоваться, веселиться»). Родительный τέκνων — «матерь детей», радость о детях; ср. 1 Цар 2:5, Ис 54:1."
