verses:
  1: "ああ、傲慢[ごうまん]の冠[かんむり]よ、エフライムの雇[やと]い人[びと]たちよ。肥[こ]えた山[やま]の頂[いただき]で栄光[えいこう]から落[お]ちた花[はな]、ぶどう酒[ぶどうしゅ]によらずに酔[よ]った者[もの]たちよ。"
  2: "見[み]よ、主[しゅ]の怒[いか]りは強[つよ]く、激[はげ]しい。覆[おお]いのない雹[ひょう]のように、力[ちから]ずくで降[ふ]りかかる。国[くに]を引[ひ]き流[なが]す多[おお]くの水[みず]のように、それは地[ち]に手[て]ずから休[やす]みを与[あた]える。"
  3: "傲慢[ごうまん]の冠[かんむり]、エフライムの雇[やと]い人[びと]たちは、足[あし]で踏[ふ]みにじられる。"
  4: "栄光[えいこう]の望[のぞ]みから落[お]ちた花[はな]は、高[たか]い山[やま]の頂[いただき]で、いちじくの初[はつ]なりの実[み]のようになる。それを見[み]た者[もの]は、手[て]に取[と]る前[まえ]に、それを飲[の]み込[こ]みたくなる。"
  5: "その日[ひ]、万軍[ばんぐん]の主[しゅ]は、残[のこ]されたわたしの民[たみ]にとって、望[のぞ]みの冠[かんむり]、栄光[えいこう]で編[あ]まれた冠[かんむり]となる。"
  6: "残[のこ]された者[もの]たちには、裁[さば]きの霊[れい]による裁[さば]きと、滅[ほろ]ぼすことを阻[はば]む力[ちから]がある。"
  7: "彼[かれ]らはぶどう酒[ぶどうしゅ]に惑[まど]わされ、シケラによって迷[まよ]わされた。祭司[さいし]も預言者[よげんしゃ]もぶどう酒[ぶどうしゅ]によって我[われ]を失[うしな]い、ぶどう酒に呑[の]み込[こ]まれ、シケラの酔[よ]いによって揺[ゆ]れ動[うご]き、迷[まよ]わされた。これは幻[まぼろし]にすぎない。"
  8: "のろいがこの計画[けいかく]を食[く]らう。この計画は強欲[ごうよく]のためであるからだ。"
  9: "わたしたちはだれに災[わざわ]いを告[つ]げ、だれに知[し]らせを告[つ]げたのか。乳[ちち]から離[はな]された者[もの]たち、乳房[ちぶさ]から引[ひ]き離[はな]された者[もの]たちに。"
  10: "苦[くる]しみの上[うえ]に苦[くる]しみを待[ま]ち望[のぞ]め。望[のぞ]みの上に望みを。もうちょっとで、もうちょっとで。"
  11: "軽[かろ]んじられた唇[くちびる]のゆえに、ほかの舌[した]によって、彼[かれ]らはこの民[たみ]に語[かた]る。"
  12: "彼[かれ]に言[い]う。「これが飢[うえ]た者[もの]への休[やす]みであり、これが打[う]ち砕[くだ]きである。」しかし彼[かれ]らは聞[き]こうとしなかった。"
  13: "主[しゅ]なる神[かみ]の仰[おお]せは彼[かれ]らにとって、苦[くる]しみの上[うえ]の苦しみ、望[のぞ]みの上[うえ]の望み、もうちょっとで、もうちょっとで、というものとなる。彼[かれ]らが行[い]って後[うしろ]へ倒[たお]れ、危険[きけん]に陥[おちい]り、砕[くだ]かれ、捕[と]らえられるために。"
  14: "それゆえ、主[しゅ]の言葉[ことば]を聞[き]け。苦[くる]しめられた者[もの]たち、エルサレムにいるこの民[たみ]の支配者[しはいしゃ]たちよ。"
  15: "あなたがたは言[い]ったからだ。「わたしたちはよみと契約[けいやく]を結[むす]び、死[し]と協定[きょうてい]を結[むす]んだ。押[お]し寄[よ]せる嵐[あらし]が過[す]ぎても、わたしたちには及[およ]ばない。わたしたちは偽[いつわ]りを望[のぞ]みとし、偽りで身[み]を覆[おお]う。」"
  16: "それゆえ、主[しゅ]はこう言[い]う。「見[み]よ、わたしはシオンの基[き]に、価[あたい]ある石[いし]、選[えら]ばれた隅[すみ]の石[いし]、尊[とうと]い石[いし]を、その基として据[す]える。彼[かれ]を信[しん]じる者[もの]は決[けっ]して恥[は]じない。」"
  17: "わたしは裁[さば]きを望[のぞ]みとし、わたしのあわれみを秤[はかり]とする。偽[いつわ]りにむだに望みを置[お]く者[もの]たちよ。嵐[あらし]はあなたがたを過[す]ぎ去[さ]らないからだ。"
  18: "あなたがたから死[し]との契約[けいやく]は取[と]り去[さ]られ、よみへのあなたがたの望[のぞ]みは残[のこ]らない。押[お]し寄[よ]せる嵐[あらし]が来[く]るとき、あなたがたはそれに踏[ふ]みにじられる。"
  19: "それが過[す]ぎるとき、あなたがたを捕[と]らえる。朝[あさ]ごとに、昼[ひる]の間[あいだ]に過ぎ、夜[よる]には悪[わる]い望みが残[のこ]る。聞[き]くことを学[まな]べ、圧迫[あっぱく]されている者[もの]たちよ。"
  20: "わたしたちは狭[せま]くされて戦[たたか]うことができず、自[みずか]らは弱[よわ]って集[あつ]まることもできない。"
  21: "主[しゅ]は不敬虔[ふけいけん]な者[もの]の山[やま]のように立[た]ち上[あ]がり、ガバオンの谷[たに]にいるようになる。怒[いか]りをもってご自分[じぶん]の業[わざ]を行[おこな]い、苦[にが]い業をなさる。その怒りは他[た]の者[もの]のように働[はたら]き、その苦[にが]さは他のもののようである。"
  22: "あなたがたは喜[よろこ]んではならない。あなたがたの束縛[そくばく]が強[つよ]くなってはならない。わたしは万軍[ばんぐん]の主[しゅ]から、全[ぜん]地[ち]に行[おこな]われる、定[さだ]められ、切[き]り縮[つ]められた事[こと]を聞[き]いたからだ。"
  23: "耳[みみ]を傾[かたむ]けて、わたしの声[こえ]を聞[き]け。注意[ちゅうい]して、わたしの言葉[ことば]を聞け。"
  24: "耕[たがや]す者[もの]は一日中[いちにちじゅう]、耕し続[つづ]けるのか。地[ち]を耕す前[まえ]に、種[たね]を用意[ようい]するのか。"
  25: "その面[おもて]を平[たい]らかにしたとき、初[はじ]めてクロタネソウを少[すこ]し、クミンを蒔[ま]き、また小麦[こむぎ]、大麦[おおむぎ]、スペルト小麦をあなたの地[ち]の境[さかい]に蒔くのではないか。"
  26: "あなたはあなたの神[かみ]の定[さだ]めによって教[おし]えられ、喜[よろこ]ぶ。"
  27: "クロタネソウは激[はげ]しく打[う]って脱穀[だっこく]するのではない。車[くるま]の輪[わ]をクミンの上[うえ]に回[まわ]すのでもない。クロタネソウは杖[つえ]で打[う]ち払[はら]われ、クミンは"
  28: "パンとともに食[た]べられる。わたしは永遠[えいえん]にあなたがたに怒[いか]り続[つづ]けることはない。わたしの苦[にが]さの声[こえ]があなたがたを踏[ふ]みにじることもない。"
  29: "これらは万軍[ばんぐん]の主[しゅ]から出[で]た不思議[ふしぎ]である。謀[はか]れ、むだな慰[なぐさ]めを高[たか]く掲[かか]げよ。"

notes:
  1: "Οὐαὶ τῷ στεφάνῳ τῆς ὕβρεως — «горе венцу гордыни/наглости» (ὕβρις — надменность, насилие; στέφανος — венец). οἱ μισθωτοὶ Εφραιμ — «наёмники Ефрема»: в LXX так передано евр. «пьяные Ефремляне», отсюда 雇い人たち; у Син. «пьяных Ефремлян». τὸ ἄνθος τὸ ἐκπεσὸν ἐκ τῆς δόξης — «цветок, отпавший от славы» (ἐκπίπτω); οἱ μεθύοντες ἄνευ οἴνου — «упивающиеся без вина» (μεθύω)."
  2: "ὡς χάλαζα καταφερομένη οὐκ ἔχουσα σκέπην — «как град, падающий без прикрытия» (χάλαζα — град; σκέπη — покров, слав. «кров»). βίᾳ καταφερομένη — «силою низвергаемый» (βία). ὡς ὕδατος πολὺ πλῆθος σῦρον χώραν — «как множество воды, увлекающее страну» (σύρω — влечь). τῇ γῇ ποιήσει ἀνάπαυσιν ταῖς χερσίν — тёмное место: «земле сделает покой руками» (ἀνάπαυσις); смысл неясен, передано буквально."
  3: "τοῖς ποσὶν καταπατηθήσεται — «ногами будет попираем» (καταπατέω). οἱ μισθωτοὶ τοῦ Εφραιμ — повтор из ст. 1; слав. «наимницы ефремовы»."
  4: "ὡς πρόδρομος σύκου — «как ранний, преждевременный плод смоковницы» (πρόδρομος — предшествующий, ранний; σῦκον — смоква). ὁ ἰδὼν αὐτὸ πρὶν ἢ εἰς τὴν χεῖρα αὐτοῦ λαβεῖν θελήσει αὐτὸ καταπιεῖν — «увидевший его прежде, чем взять в руку, захочет проглотить его» (καταπίνω)."
  5: "ἔσται κύριος σαβαωθ ὁ στέφανος τῆς ἐλπίδος — «будет Господь Саваоф венцом надежды»; ὁ πλακεὶς τῆς δόξης — «сплетённый славою» (πλέκω — плести; слав. «сплетеный славою»). τῷ καταλειφθέντι μου λαῷ — «оставшемуся народу Моему» (καταλείπω)."
  6: "καταλειφθήσονται ἐπὶ πνεύματι κρίσεως ἐπὶ κρίσιν — «оставленные будут на духе суда, на суд»: тёмный оборот, передан «получат суд Духом суда». ἰσχὺν κωλῦον ἀνελεῖν — «силу, препятствующую убивать» (κωλύω — препятствовать, ἀναιρέω — убивать); слав. «крепость возбраняющих погубляти». Смысл: сила для тех, кто удерживает от истребления."
  7: "οἴνῳ πεπλανημένοι — «вином введены в заблуждение» (πλανάω); σικερα — сикера, крепкий напиток (транслитерация シケラ, слав. «сикера»). ἱερεὺς καὶ προφήτης ἐξέστησαν — «священник и пророк обезумели» (ἐξίστημι); ἐσεσίσθησαν — «поколебались» (σείω). τοῦτ᾿ ἔστι φάσμα — «это призрак, видение» (φάσμα), тёмное место. Слав. добавляет «пожерты быша вином» (были поглощены вином), чего нет в LXX; по паритету внесено в основной текст без 〔…〕."
  8: "ἀρὰ ἔδεται ταύτην τὴν βουλήν — «проклятие пожрёт этот совет» (ἀρά — проклятие; ἐσθίω — есть). αὕτη γὰρ ἡ βουλὴ ἕνεκεν πλεονεξίας — «ибо этот совет ради лихоимства» (πλεονεξία — корыстолюбие, слав. «лихоимства»). У Син. «столы наполнены блевотиною» — МТ; LXX совсем иное, в текст не вносится."
  9: "τίνι ἀνηγγείλαμεν κακά — «кому мы возвестили злое»: 1-е лицо мн. ч., поэтому это не речь противников (у Син. «кого хочет он учить»), а слова пророков, возвещающих волю Божию; разночтение отмечено. οἱ ἀπογεγαλακτισμένοι ἀπὸ γάλακτος — «отнятые от молока» (ἀπογαλακτίζω); οἱ ἀπεσπασμένοι ἀπὸ μαστοῦ — «оторванные от сосца» (ἀποσπάω)."
  10: "θλῖψιν ἐπὶ θλῖψιν προσδέχου — «ожидай скорбь на скорбь» (προσδέχομαι — ожидать); ἐλπίδα ἐπ᾿ ἐλπίδι — «надежду на надежду»; ἔτι μικρὸν ἔτι μικρόν — «ещё немного, ещё немного». В Син. это передано как «заповедь на заповедь» (МТ), у нас — по LXX."
  11: "διὰ φαυλισμὸν χειλέων — «через уничижение уст» (φαυλισμός — унижение, низость; слав. «худостию устен»); διὰ γλώσσης ἑτέρας — «через иной язык». ὅτι λαλήσουσιν τῷ λαῷ τούτῳ — «ибо будут говорить этому народу»: придаточное продолжается в ст. 12."
  12: "λέγοντες αὐτῷ — «говоря ему»; Τοῦτο τὸ ἀνάπαυμα τῷ πεινῶντι — «вот покой голодному» (ἀνάπαυμα — покой); τοῦτο τὸ σύντριμμα — «вот сокрушение» (σύντριμμα). καὶ οὐκ ἠθέλησαν ἀκούειν — «и не захотели слушать». Речь, которую они услышат, — в 「…」."
  13: "τὸ λόγιον κυρίου τοῦ θεοῦ — «изречение Господа Бога» (λόγιον; в Псалтири передаётся 仰せ). ἵνα πορευθῶσιν καὶ πέσωσιν εἰς τὰ ὀπίσω — «чтобы пошли и упали назад» (τὰ ὀπίσω — назад); κινδυνεύσουσιν — «подвергнутся опасности»; συντριβήσονται καὶ ἁλώσονται — «сокрушатся и будут взяты»."
  14: "ἄνδρες τεθλιμμένοι — «мужи теснимые, озлобленные» (θλίβω — теснить; слав. «озлобленнии»); ἄρχοντες τοῦ λαοῦ τούτου τοῦ ἐν Ιερουσαλημ — «правители народа сего в Иерусалиме». У Син. «хульники» — МТ; LXX держим."
  15: "Ἐποιήσαμεν διαθήκην μετὰ τοῦ ᾅδου — «мы заключили завет с адом» (ᾅδης — преисподняя, здесь よみ; слав. «со адом»); μετὰ τοῦ θανάτου συνθήκας — «с смертью соглашения» (συνθήκη — договор, слав. «сложение»). καταιγὶς φερομένη — «буря несущаяся» (καταιγίς, слав. «буря носима»). ἐθήκαμεν ψεῦδος τὴν ἐλπίδα ἡμῶν — «мы положили ложь надеждою нашею»; τῷ ψεύδει σκεπασθησόμεθα — «ложью покроемся» (σκεπάζω)."
  16: "ἐμβαλῶ εἰς τὰ θεμέλια Σιων λίθον πολυτελῆ ἐκλεκτὸν ἀκρογωνιαῖον ἔντιμον — «положу в основание Сиона камень драгоценный, избранный, краеугольный, почётный» (ἀκρογωνιαῖος — краеугольный; ἔντιμος — чтимый, слав. «честен»). καὶ ὁ πιστεύων ἐπ᾿ αὐτῷ οὐ μὴ καταισχυνθῇ — «и верующий в Него не постыдится»: LXX-добавление, цитируется в Рим 9:33 и 1 Пет 2:6; в слав. тоже есть («веруяй в онь не постыдится»), поэтому в тексте без скобок. У МТ этой части нет."
  17: "θήσω κρίσιν εἰς ἐλπίδα — «положу суд в надежду»; ἐλεημοσύνη μου εἰς σταθμούς — «милость Моя на весы» (σταθμός — вес, весы; слав. «на мерилех»). οἱ πεποιθότες μάτην ψεύδει — «надеющиеся напрасно на ложь»; οὐ μὴ παρέλθῃ ὑμᾶς καταιγίς — «не пройдёт вас буря»."
  18: "μὴ καὶ ἀφέλῃ ὑμῶν τὴν διαθήκην τοῦ θανάτου — «не отнимет ли Он у вас завета смерти»: вопросительная форма с μή; слав. читает утвердительно («и не отимет»), в тексте утвердительно. ἡ ἐλπὶς ὑμῶν ἡ πρὸς τὸν ᾅδην οὐ μὴ ἐμμείνῃ — «надежда ваша на ад не пребудет» (ἐμμένω — пребывать). ἔσεσθε αὐτῇ εἰς καταπάτημα — «будете ей на попрание» (καταπάτημα)."
  19: "ὅταν παρέλθῃ, λήμψεται ὑμᾶς — «когда пройдёт, возьмёт вас». πρωῒ πρωῒ παρελεύσεται ἡμέρας — «каждое утро будет проходить днём» (πρωΐ — утром). ἐν νυκτὶ ἔσται ἐλπὶς πονηρά — «ночью будет надежда злая». μάθετε ἀκούειν — «научитесь слушать»; слав. добавляет «утесняемии» (теснимые), в LXX этого нет — по паритету внесено без 〔…〕."
  20: "στενοχωρούμενοι οὐ δυνάμεθα μάχεσθαι — «теснимые, мы не можем сражаться» (στενοχωρέω — стеснять; μάχομαι). αὐτοὶ δὲ ἀσθενοῦμεν τοῦ ἡμᾶς συναχθῆναι — «и сами мы слабы, чтобы собраться нам». У Син. «слишком коротка постель…» — МТ, LXX иное; 1-е лицо мн. ч. сохранено."
  21: "ὥσπερ ὄρος ἀσεβῶν ἀναστήσεται — «как гора нечестивых, восстанет [Господь]»: подлежащее подразумевается (слав. «востанет Господь»); «гора нечестивых» — тёмное место, у Син. «как на горе Перациме» (МТ). ἐν τῇ φάραγγι Γαβαων — «в долине Гаваон» (слав. «в дебри гаваонстей»). ἀλλοτρίως χρήσεται — «употребится чуждо», т. е. сделает необычное, «чужое» дело; ἡ πικρία αὐτοῦ ἀλλοτρία — «горечь его чужда»."
  22: "μηδὲ ἰσχυσάτωσαν ὑμῶν οἱ δεσμοί — «и да не укрепятся узы ваши» (δεσμός — узы, слав. «узы»). συντετελεσμένα καὶ συντετμημένα πράγματα — «совершённые и сокращённые дела» (συντελέω — завершать, συντέμνω — сокращать), т. е. решённое и кратко исполняемое."
  23: "Ἐνωτίζεσθε καὶ ἀκούετε — «внимайте и слушайте» (ἐνωτίζομαι — внимать, слав. «внушите»); προσέχετε — «замечайте» (слав. «внемлите»). Двойной призыв сохранён."
  24: "μὴ ὅλην τὴν ἡμέραν μέλλει ὁ ἀροτριῶν ἀροτριᾶν — «разве целый день земледелец будет пахать?» (ἀροτριάω — пахать); ἢ σπόρον προετοιμάσει πρὶν ἐργάσασθαι τὴν γῆν — «или приготовит семя прежде возделывания земли?» (σπόρος — семя, ἐργάζομαι — возделывать)."
  25: "ὅταν ὁμαλίσῃ αὐτῆς τὸ πρόσωπον — «когда выровняет поверхность её» (ὁμαλίζω — выравнивать). σπεῖρει μικρὸν μελάνθιον καὶ κύμινον — «сеет немного чернушки и тмина»: μελάνθιον — чернушка (нигелла), передано クロタネソウ; κύμινον — тмин, кумин (クミン); оба слова новые для корпуса. πυρὸν καὶ κριθὴν καὶ ζέαν — «пшеницу, ячмень и полбу» (ζέα — полба, спельта; слав. «просо» — иное чтение)."
  26: "καὶ παιδευθήσῃ κρίματι θεοῦ σου — «и будешь наставлен судом Бога твоего» (παιδεύω — наставлять; слав. «научишися»). Смена лица (2-е ед.) после 3-го лица ст. 25 сохранена."
  27: "οὐ γὰρ μετὰ σκληρότητος καθαίρεται τὸ μελάνθιον — «ибо не с жестокостью обмолачивается чернушка» (σκληρότης — жёсткость, καθαίρω — очищать). τροχὸς ἁμάξης — «колесо телеги» (τροχός, ἅμαξα); περιάξει ἐπὶ τὸ κύμινον — «проведут по тмину». ῥάβδῳ ἐκτινάσσεται — «палкою выколачивается» (ἐκτινάσσω). Стих обрывается на «クミンは»; по gr «с хлебом съедается» открывает ст. 28, у csl — конец 27."
  28: "μετὰ ἄρτου βρωθήσεται — «с хлебом съедается»: по gr открывает ст. 28, у csl стоит в конце 27; держимся gr. οὐ γὰρ εἰς τὸν αἰῶνα ἐγὼ ὑμῖν ὀργισθήσομαι — «ибо не вовек Я буду гневаться на вас» (ὀργίζομαι); φωνὴ τῆς πικρίας μου — «голос горечи Моей» (πικρία)."
  29: "ταῦτα παρὰ κυρίου σαβαωθ ἐξῆλθεν τὰ τέρατα — «эти чудеса от Господа Саваофа произошли» (τέρας — чудо, знамение). βουλεύσασθε, ὑψώσατε ματαίαν παράκλησιν — «советуйтесь, возносите тщетное утешение» (παράκλησις — утешение, ободрение); повелительное наклонение сохранено. У Син. «дивны судьбы Его» — МТ."
