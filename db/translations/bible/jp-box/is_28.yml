# jp-box, Исаия, глава 28. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для Исаии есть фрагментами (гл. 25–29), использован только для
# сверки; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 28: 1–6 горе венцу гордыни Ефрема и обетование остатку; 7–10 священники и
# пророки, обезумевшие от вина; 11–13 чужим языком — и слово Господне им в
# преткновение; 14–19 завет со смертью и краеугольный камень (16 — LXX-стих,
# цитируемый в Рим 9:33 и 1 Пет 2:6; 21 — «чужое дело»); 20–22 гибель убежища лжи;
# 23–29 притча о земледельце.
# Голоса: 1–13 без кавычек (пророческий возглас и обличение; слова, которые будут
# говорить народу, — 「…」 в 12); 14–15 обращение пророка, слова народа — 「…」;
# 16–19 слова Господа после формулы «так говорит Господь» — 「…」; 20–29 без кавычек.
# Нумерация по gr: 29 стихов (совпадает с csl/ru). Граница 27/28 иная: gr 27
# обрывается на «クミンは», а «パンとともに食べられる» (gr 28:1a) у csl — конец 27;
# держимся gr.
# 〔…〕 нет: все 29 стихов есть в gr-lxx-byz. csl-добавление 28:7 «пожерты быша вином»
# и 28:19 «утесняемии» внесены без скобок.
# Сносок ⟨…⟩ нет: 冠, ぶどう畑, よみ, 隅の石, 秤, 陶工 уже в корпусе; クロタネソウ,
# クミン, スペルト小麦 — новые слова (в notes), без сносок.
# Имена — транслитерация греческого (LXX).

