# jp-box, Евангелие от Иоанна, глава 3. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 3: Никодим (1–21), свидетельство Иоанна (22–36).
# Красное (<j>): 3:3, 5–8, 10–21 — слова Христа.
# Слова Никодима (3:2, 4, 9) и Иоанна Крестителя (3:27–36) — не красные.
# Синего (<mo>) в главе нет. jp-ni не использовался.

tr_code: jp-box
book: in
chapter: 3
draft: true

verses:
  1: "ファリサイ派[は]の人[ひと]で、ニコデモという名[な]の者[もの]がいた。ユダヤ人[じん]の指導者[しどうしゃ]の一人[ひとり]であった。"
  2: "この人[ひと]は夜[よる]、イエスのもとに来[き]て言[い]った。「ラビ、わたしたちはあなたが神[かみ]から来[きた]られた教師[きょうし]であることを知[し]っています。神[かみ]がともにおられなければ、あなたが行[おこな]われるようなしるしは、だれも行[おこな]うことができません。」"
  3: "イエスは答[こた]えて言[い]われた。「<j>よくよく言[い]っておく。人[ひと]は上[うえ]から生[う]まれなければ、神[かみ]の国[くに]を見[み]ることができない。</j>」"
  4: "ニコデモは言[い]った。「どうして人[ひと]が年[とし]を取[と]ってから生[う]まれることができましょうか。もう一度[いちど]、母[はは]の胎[たい]に入[はい]って生[う]まれることなど、できるのでしょうか。」"
  5: "イエスは答[こた]えて言[い]われた。「<j>よくよく言[い]っておく。人[ひと]は水[みず]と霊[れい]によって生[う]まれなければ、神[かみ]の国[くに]に入[はい]ることができない。</j>」"
  6: "<j>肉[にく]から生[う]まれた者[もの]は肉[にく]であり、霊[れい]から生[う]まれた者[もの]は霊[れい]である。</j>"
  7: "<j>わたしが『あなたがたは上[うえ]から生[う]まれなければならない』と言[い]ったことを不思議[ふしぎ]に思[おも]うな。</j>"
  8: "<j>風[かぜ]は思[おも]うままに吹[ふ]き、あなたはその音[おと]を聞[き]くが、どこから来[き]てどこへ行[く]のかは知[し]らない。霊[れい]から生[う]まれた者[もの]も、みなそうである。</j>"
  9: "ニコデモは答[こた]えて言[い]った。「どうして、そのようなことがあり得[え]るのでしょうか。」"
  10: "イエスは答[こた]えて言[い]われた。「<j>あなたはイスラエルの教師[きょうし]でありながら、これらのことを知[し]らないのか。</j>」"
  11: "<j>よくよく言[い]っておく。わたしたちは知[し]っていることを語[かた]り、見[み]たことを証[あかし]する。しかし、あなたがたはわたしたちの証[あかし]を受[う]け入[い]れない。</j>"
  12: "<j>わたしが地上[ちじょう]のことを話[はな]してもあなたがたは信[しん]じない。まして天上[てんじょう]のことを話[はな]すなら、どうして信[しん]じるだろうか。</j>"
  13: "<j>天[てん]に上[のぼ]った者[もの]は、天[てん]から降[くだ]った者[もの]、人[ひと]の子[こ]〔、天[てん]にいる者[もの]〕のほかには、だれもいない。</j>"
  14: "<j>モーセが荒[あ]れ野[の]で蛇[へび]を上[あ]げたように、人[ひと]の子[こ]も上[あ]げられなければならない。</j>"
  15: "<j>それは、人[ひと]の子[こ]を信[しん]じる者[もの]がみな、〔滅[ほろ]びることなく、〕永遠[えいえん]の命[いのち]を受[う]けるためである。</j>"
  16: "<j>神[かみ]は世[よ]をこれほど愛[あい]されたので、独[ひと]り子[こ]をお与[あた]えになった。信[しん]じる者[もの]が一人[ひとり]も滅[ほろ]びず、永遠[えいえん]の命[いのち]を受[う]けるためである。</j>"
  17: "<j>神[かみ]が子[こ]を世[よ]に遣[つか]わされたのは、世[よ]を裁[さば]くためではなく、世[よ]が子[こ]によって救[すく]われるためである。</j>"
  18: "<j>子[こ]を信[しん]じる者[もの]は裁[さば]かれない。信[しん]じない者[もの]はすでに裁[さば]かれている。神[かみ]の独[ひと]り子[こ]の名[な]を信[しん]じなかったからである。</j>"
  19: "<j>裁[さば]きとはこれである。光[ひかり]が世[よ]に来[き]たのに、人々[ひとびと]は光[ひかり]よりも闇[やみ]を愛[あい]した。自分[じぶん]の行[おこな]いが悪[わる]かったからである。</j>"
  20: "<j>悪[わる]いことを行[おこな]う者[もの]はだれでも光[ひかり]を憎[にく]み、自分[じぶん]の行[おこな]いが明[あき]らかにされないように、光[ひかり]へ来[こ]ようとしない。</j>"
  21: "<j>しかし、真理[しんり]を行[おこな]う者[もの]は光[ひかり]へ来[く]る。自分[じぶん]の行[おこな]いが神[かみ]によってなされたことが明[あき]らかになるためである。</j>"
  22: "その後[そののち]、イエスは弟子[でし]たちとともにユダヤの地[ち]へ行[い]き、そこに彼[かれ]らとともに滞在[たいざい]して、洗礼[せんれい]を授[さず]けておられた。"
  23: "ヨハネもサリムに近[ちか]いアイノンで洗礼[せんれい]を授[さず]けていた。そこには水[みず]が多[おお]くあったからである。人々[ひとびと]は来[き]ては洗礼[せんれい]を受[う]けていた。"
  24: "ヨハネはまだ獄[ひとや]に入[はい]れられていなかった。"
  25: "そこで、ヨハネの弟子[でし]たちとユダヤ人[じん]との間[あいだ]に、清[きよ]めについての論争[ろんそう]が起[お]こった。"
  26: "彼[かれ]らはヨハネのもとに来[き]て言[い]った。「ラビ、あなたとともにヨルダン川[がわ]の向[む]こうにいて、あなたが証[あかし]したあの方[かた]が、洗礼[せんれい]を授[さず]けています。そして、人々[ひとびと]はみな、その方[かた]のもとへ行[い]っています。」"
  27: "ヨハネは答[こた]えて言[い]った。「人[ひと]は天[てん]から与[あた]えられなければ、何[なに]一[ひと]つとして受[う]けることはできない。"
  28: "わたしが『わたしはキリストではない。その方[かた]の前[まえ]に遣[つか]わされた者[もの]である』と言[い]ったことを、あなたがた自身[じしん]が証言[しょうげん]している。"
  29: "花嫁[はなよめ]がいる者[もの]は花婿[はなむこ]である。花婿[はなむこ]の友[とも]は、立[た]って花婿[はなむこ]の声[こえ]を聞[き]くと、その声[こえ]のゆえに大[おお]いに喜[よろこ]ぶ。わたしのこの喜[よろこ]びは、こうして満[み]ちている。"
  30: "その方[かた]は栄[さか]え、わたしは衰[おとろ]えなければならない。"
  31: "上[うえ]から来[く]る者[もの]は、すべてのものの上[うえ]にある。地[ち]から出[で]た者[もの]は地[ち]に属[ぞく]し、地[ち]のことを話[はな]す。天[てん]から来[く]る者[もの]は〔すべてのものの上[うえ]にある〕。"
  32: "その方[かた]は、見[み]たこと、聞[き]いたことを証[あかし]するが、その証[あかし]を受[う]ける者[もの]はだれもいない。"
  33: "その証[あかし]を受[う]けた者[もの]は、神[かみ]が真実[しんじつ]であることを確[たし]かにしたのである。"
  34: "神[かみ]が遣[つか]わされた方[かた]は、神[かみ]の言葉[ことば]を語[かた]る。神[かみ]が霊[れい]をお与[あた]えになるのに、量[りょう]を定[さだ]めておられないからである。"
  35: "父[ちち]は子[こ]を愛[あい]し、すべてのものをその手[て]に委[ゆだ]ねておられる。"
  36: "子[こ]を信[しん]じる者[もの]は永遠[えいえん]の命[いのち]を持[も]っている。子[こ]に従[したが]わない者[もの]は命[いのち]を見[み]ることはなく、神[かみ]の怒[いか]りがその上[うえ]にとどまっている。」"

notes:
  1: "ἄρχων τῶν Ἰουδαίων — «один из начальников иудейских»; 指導者の一人. Никодим — фарисей и один из начальников иудейских."
  2: "Ῥαββί — ラビ, без сноски: объяснён при первом упоминании в корпусе (Мф 23:7)."
  3: "ἄνωθεν — «свыше» и «снова» одновременно; оставлено 上から, двусмысленность не разрешена. В 3:4 Никодим понимает как 再び."
  5: "ἐξ ὕδατος καὶ πνεύματος — 水と霊; jp-joc передаёт πνεῦμα как 神. 聖霊 здесь не поставлено, чтобы сохранить связь с 3:6 и 3:8."
  8: "τὸ πνεῦμα — и «ветер», и «Дух»; 風 в первой половине, 霊 во второй. Игра слов не разрешена."
  13: "Критический текст: … ὁ υἱὸς τοῦ ἀνθρώπου. Церковь (Елизаветинская «Сын Человеческий, сущий на небесах», jp-joc «仍天に在る者») добавляет ὁ ὢν ἐν τῷ οὐρανῷ — 〔、天にいる者〕."
  15: "Критический текст: ἵνα πᾶς ὁ πιστεύων ἐν αὐτῷ ἔχῃ ζωὴν αἰώνιον. Церковь (Елизаветинская «не погиб, но», jp-joc) добавляет μὴ ἀπόληται ἀλλ᾽ — 〔滅びることなく、〕."
  16: "οὕτως — «так», «до такой степени»; これほど. ὥστε передано причинно-следственно: 愛されたので…お与えになった."
  25: "В критическом μετὰ Ἰουδαίου — с одним иудеем; в японском тексте число не выражено."
  27: "3:27–36 — прямая речь Иоанна Крестителя (по указанию к книге; в древности 3:31–36 читали и как слово евангелиста). Кавычки открыты в 3:27 и закрыты в 3:36, красного нет."
  31: "Критический текст повторяет ἐπάνω πάντων ἐστίν в скобках; Церковь (jp-joc) читает дважды — второе в 〔すべてのものの上にある〕."
  33: "ἐσφράγισεν — «запечатлел, заверил»; 確かにした."
  34: "οὐ γὰρ ἐκ μέτρου δίδωσιν τὸ πνεῦμα — «не мерою даёт Духа»; подлежащее не выражено (Бог или Христос). Подлежащее при 定める не названо; по контексту и гонорифику — Бог: 量を定めておられない."
  36: "ἀπειθῶν — «не покоряющийся», сильнее, чем «не верующий»; 従わない者."
