# jp-box, Псалтирь, псалом 45. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный 常体, без 文語.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0.
# Псалом 45: Бог — прибежище (1–3), река Божия в городе Божием (4–5),
# глас Божий и «с нами Бог» (6–7), дела Божии и «остановитесь и познайте» (8–10),
# повтор припева (11).
# Красного и синего нет: слова Бога в ст. 10 — не красные (в псалмах красного нет).
# Кавычки: речь Бога в ст. 10 — 「…」 (первый уровень; ср. Пс 2:6).
# 〔…〕 нет: все слова в gr-lxx-byz есть (проверено tmp/bracket_check.rb).
# セラ (διάψαλμα, в конце ст. 3 и 7) не передаётся — по решению пользователя, как у jp-joc.
# Сносок ⟨…⟩ нет: 盾, 万軍, ヤコブ, いと高き уже в корпусе.
# jp-ni не использовался.

