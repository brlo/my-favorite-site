verses:
  0: "指揮者[しきしゃ]に。コラの子[こ]らのために。隠[かく]された事[こと]についての詩[うた]。"
  1: "神[かみ]はわたしたちの避[ひ]け所[どころ]、力[ちから]、苦[くる]しみが激[はげ]しく迫[せま]るときの助[たす]けである。"
  2: "それゆえ、たとえ地[ち]が揺[ゆ]れ動[うご]き、山[やま]が海[うみ]の心[こころ]に移[うつ]っても、わたしたちは恐[おそ]れない。"
  3: "その水[みず]は鳴[な]り響[ひび]いて騒[さわ]ぎ立ち、山[やま]はその激[はげ]しさに震[ふる]える。"
  4: "川[かわ]の流[なが]れは神[かみ]の都[みやこ]を喜[よろこ]ばせる。いと高[たか]き方[かた]はご自分[じぶん]の住[す]まいを聖[せい]なるものとされた。"
  5: "神[かみ]はその都[みやこ]の中[なか]におられる。都[みやこ]は揺[ゆ]るがない。神[かみ]は朝[あさ]になると、これを助[たす]けられる。"
  6: "諸国[しょこく]の民[たみ]は騒[さわ]ぎ立ち、王国[おうこく]は傾[かたむ]いた。神[かみ]が声[こえ]を発[はっ]せられると、地[ち]は溶[と]けた。"
  7: "万軍[ばんぐん]の主[しゅ]はわたしたちとともにおられる。ヤコブの神[かみ]はわたしたちの盾[たて]である。"
  8: "来[き]て、主[しゅ]のみわざを見[み]よ。主[しゅ]は地[ち]の上[うえ]に驚[おどろ]くべきことを行[おこな]われた。"
  9: "主[しゅ]は地[ち]の果[は]てまで戦[いくさ]を取[と]り除[のぞ]かれる。弓[ゆみ]を折[お]り、槍[やり]を砕[くだ]き、盾[たて]を火[ひ]で焼[や]かれる。"
  10: "「静[しず]まって、わたしが神[かみ]であることを知[し]れ。わたしは諸国[しょこく]の民[たみ]の間[あいだ]で、また地[ち]の上[うえ]で、高[たか]く上[あ]げられる。」"
  11: "万軍[ばんぐん]の主[しゅ]はわたしたちとともにおられる。ヤコブの神[かみ]はわたしたちの盾[たて]である。"

notes:
  0: "Εἰς τὸ τέλος· ὑπὲρ τῶν υἱῶν Κορε, ὑπὲρ τῶν κρυφίων ψαλμός — 指揮者に。コラの子らのために。隠された事についての詩 (ὑπὲρ τῶν υἱῶν Κορε — «о сынех Кореовых»; ὑπὲρ τῶν κρυφίων — «о тайных», в церковнослав. «о тайных»; по евр. это название напева (аламоф), в переводе оставлено буквально, без домысла). Надписание — стих 0, скобками не маркируется."
  1: "Ὁ θεὸς ἡμῶν καταφυγὴ καὶ δύναμις — 神はわたしたちの避け所、力 (καταφυγή — «убежище»; ср. 2 Цар 22:2). βοηθὸς ἐν θλίψεσιν ταῖς εὑρούσαις ἡμᾶς σφόδρα — 苦しみが激しく迫るときの助け (εὑρίσκω — «находить, постигать»; σφόδρα — «весьма»). Сказуемое である, как в евр. именном предложении."
  2: "διὰ τοῦτο οὐ φοβηθησόμεθα — それゆえ…わたしたちは恐れない (вывод из ст. 1). ἐν τῷ ταράσσεσθαι τὴν γῆν — 地が揺れ動き (ταράσσω — «потрясать»). μετατίθεσθαι ὄρη ἐν καρδίαις θαλασσῶν — 山が海の心に移っても (καρδίαι θαλασσῶν — «сердца морей», т. е. глубина)."
  3: "ἤχησαν καὶ ἐταράχθησαν τὰ ὕδατα αὐτῶν — その水は鳴り響いて騒ぎ立ち (ἠχέω — «звучать, шуметь»). ἐταράχθησαν τὰ ὄρη ἐν τῇ κραταιότητι αὐτοῦ — 山はその激しさに震える (κραταιότης — «могущество»). διάψαλμα не передаётся."
  4: "τοῦ ποταμοῦ τὰ ὁρμήματα εὐφραίνουσιν τὴν πόλιν τοῦ θεοῦ — 川の流れは神の都を喜ばせる (ὅρμημα — «стремление, поток»; образ реки, текущей из храма, ср. Иез 47). ἡγίασεν τὸ σκήνωμα αὐτοῦ ὁ ὕψιστος — いと高き方はご自分の住まいを聖なるものとされた (ἁγιάζω — «освящать»; σκήνωμα — 住まい)."
  5: "ὁ θεὸς ἐν μέσῳ αὐτῆς, οὐ σαλευθήσεται — 神はその都の中におられる。都は揺るがない (σαλεύω — «колебать»). βοηθήσει αὐτῇ ὁ θεὸς τὸ πρὸς πρωί — 神は朝になると、これを助けられる (τὸ πρὸς πρωί — «к утру», т. е. на рассвете)."
  6: "ἐταράχθησαν ἔθνη, ἔκλιναν βασιλεῖαι — 諸国の民は騒ぎ立ち、王国は傾いた (κλίνω — «склонять»). ἔδωκεν φωνὴν αὐτοῦ, ἐσαλεύθη ἡ γῆ — 神が声を発せられると、地は溶けた (букв. «дал голос свой»; ἐσαλεύθη — «поколебалась»; 溶けた по jp-joc и Синодальному «растаяла»)."
  7: "κύριος τῶν δυνάμεων μεθ᾿ ἡμῶν — 万軍の主はわたしたちとともにおられる (κύριος τῶν δυνάμεων — «Господь сил», в церковнослав. «Господь сил с нами»). ἀντιλήμπτωρ ἡμῶν ὁ θεὸς Ιακωβ — ヤコブの神はわたしたちの盾である (ἀντιλήμπτωρ — «заступник»; передано 盾, как в Пс 3:3). διάψαλμα не передаётся."
  8: "δεῦτε ἴδετε τὰ ἔργα κυρίου — 来て、主のみわざを見よ (δεῦτε — «идите сюда», призыв). ἃ ἔθετο τέρατα ἐπὶ τῆς γῆς — 主は地の上に驚くべきことを行われた (τίθημι — «полагать»; τέρατα — «знамения, чудеса»)."
  9: "ἀνταναιρῶν πολέμους μέχρι τῶν περάτων τῆς γῆς — 地の果てまで戦を取り除かれる (ἀνταναιρέω — «уничтожать»; πόλεμος — 戦). τόξον συντρίψει καὶ συγκλάσει ὅπλον — 弓を折り、槍を砕き (συντρίβω / συγκλάω — «сокрушать»; ὅπλον — «оружие»). θυρεοὺς κατακαύσει ἐν πυρί — 盾を火で焼かれる (θυρεός — большой щит)."
  10: "σχολάσατε καὶ γνῶτε ὅτι ἐγώ εἰμι ὁ θεός — 静まって、わたしが神であることを知れ (σχολάζω — «останавливаться, быть праздным»; ἐγώ εἰμι ὁ θεός — с прямым сказуемым, поэтому わたしが神である, а не абсолютное わたしはいる; ср. Пс 45:11 в слав. «упразднитеся и разумейте»). ὑψωθήσομαι ἐν τοῖς ἔθνεσιν, ὑψωθήσομαι ἐν τῇ γῇ — 諸国の民の間で、また地の上で、高く上げられる (повтор сохранён). Слова Бога — 「」, красного нет."
  11: "Повтор припева ст. 7 — стих повторён дословно, как в греч. (в евр. здесь иная строка; в базе текст совпадает со ст. 7)."
