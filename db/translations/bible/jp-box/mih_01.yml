chapter: 1
draft: true

verses:
  1: "主[しゅ]の言葉[ことば]がモラシ人[びと]ミカに臨[のぞ]んだ。ユダの王[おう]ヨタム、アハズ、ヒゼキヤの時代[じだい]のことである。それは、彼がサマリアとエルサレムについて見[み]たものである。"
  2: "「すべての民[たみ]よ、言葉[ことば]を聞[き]け。地[ち]とそこに満[み]ちるすべてのものは耳[みみ]を傾[かたむ]けよ。主[しゅ]である神[かみ]はあなたがたの間[あいだ]で証[あかし]となる。主[しゅ]はその聖[せい]なる家[いえ]から。」"
  3: "「見[み]よ、主[しゅ]はその所[ところ]から出[で]て、下[くだ]り、地[ち]の高[たか]い所[ところ]を踏[ふ]まれる。"
  4: "山[やま]々[やま]は主[しゅ]の下[した]で揺[ゆ]れ動[うご]き、谷[たに]は火[ひ]の前[まえ]のろうのように、急[きゅう]な坂[さか]を流[なが]れ下[くだ]る水[みず]のように溶[と]ける。"
  5: "すべてこれはヤコブの不敬[ふけい]のゆえ、イスラエルの家[いえ]の罪[つみ]のゆえである。ヤコブの不敬[ふけい]とは何[なに]か。サマリアではないか。ユダの家[いえ]の罪[つみ]とは何か。エルサレムではないか。"
  6: "わたしはサマリアを野[の]の果[か]物[もの]の倉[くら]とし、ぶどうの植[う]え場[ば]とする。わたしはその石[いし]を谷[たに]に投[な]げ込[こ]み、その基[もとい]をあらわにする。"
  7: "その刻[こく]像[ぞう]はすべて打[う]ち壊[こわ]され、その淫[いん]行[こう]の報[むく]いはすべて火[ひ]で焼[や]かれ、その偶像[ぐうぞう]はすべて滅[ほろ]ぼされる。それは淫行[いんこう]の報[むく]いから集[あつ]めたものだからである。それらは淫行[いんこう]の報[むく]いに帰[かえ]る。」"
  8: "「それゆえ、わたしは嘆[なげ]き、泣[な]き、はだしで、裸[はだか]で歩[ある]く。わたしは竜[りゅう]のように泣[な]き、セイレンの娘[むすめ]たちのように悲[かな]しむ。"
  9: "その打[う]ち傷[きず]は癒[いや]しがたい。ユダにまで及び、わたしの民[たみ]の門[もん]、エルサレムにまで届[とど]いたからである。」"
  10: "「ガトにいる者[もの]たちよ、大[おお]げさに語[かた]るな。アキムにいる者[もの]たちよ、笑[わら]いものとされる家[いえ]を建[た]てるな。あなたがたの笑[わら]いを土[つち]で覆[おお]え。"
  11: "その町[まち]々[まち]に良[よ]く住[す]む者[もの]は、センナンに住[す]む者[もの]のもとから出[で]て来[こ]ない。隣[となり]の家[いえ]のために泣[な]け。あなたがたは苦痛[くつう]の傷[きず]を受[う]け取[と]る。"
  12: "苦痛[くつう]のうちに住[す]む者[もの]に良[よ]いことを始[はじ]めた者[もの]はだれか。災[わざわ]いが主[しゅ]から下[くだ]って、エルサレムの門[もん]に及[およ]んだからである。"
  13: "戦車[せんしゃ]と騎兵[きへい]の音[おと]がする。ラキシュに住[す]む者[もの]よ、あなたこそシオンの娘[むすめ]の罪[つみ]の始[はじ]まりである。イスラエルの不敬[ふけい]があなたのうちに見[み]いだされたからである。"
  14: "それゆえ、あなたはガトの嗣業[しぎょう]にまで送[おく]られる者[もの]たちに、むなしい家[いえ]々[いえ]を与[あた]える。それはイスラエルの王[おう]たちにとってむなしいものとなった。"
  15: "わたしがあなたに相続人[そうぞくにん]たちを連[つ]れて来[く]るまで、ラキシュに住[す]む者[もの]よ、嗣業[しぎょう]はオドラムにまで及[およ]ぶ。シオンの娘[むすめ]の栄[えい]光[こう]がそこへ来[く]る。"
  16: "あなたの愛[いと]しい子[こ]どもたちのために、頭[あたま]を刈[か]り、髪[かみ]をそれ。鷲[わし]のように、やもめの悲[かな]しみを広[ひろ]げよ。彼らはあなたから捕囚[ほしゅう]として連[つ]れ去[さ]られたからである。」"

notes:
  1: "Καὶ ἐγένετο λόγος κυρίου πρὸς Μιχαιαν τὸν τοῦ Μωρασθι — «и было слово Господне к Михею Морасфитину» (слав. «ко михею морасфитину»); ἐν ἡμέραις Ιωαθαμ καὶ Αχαζ καὶ Εζεκιου βασιλέων Ιουδα — «во дни Иоафама и Ахаза и Езекии, царей Иуды»; ὑπὲρ ὧν εἶδεν περὶ Σαμαρείας καὶ περὶ Ιερουσαλημ — «о том, что он видел о Самарии и об Иерусалиме» (слав. «о нихже виде о самарии и о Иерусалиме»). モラシ人 — по Иер 26:18 (モラシ人ミカ)."
  2: "Ἀκούσατε, λαοί, λόγους — «слушайте, народы, слова» (слав. «слышите, людие вси, словеса»); προσεχέτω ἡ γῆ καὶ πάντες οἱ ἐν αὐτῇ — «да внимает земля и все, что на ней»; ἔσται κύριος ἐν ὑμῖν εἰς μαρτύριον — «будет Господь среди вас во свидетельство» (εἰς μαρτύριον — в свидетеля; слав. «будет Господь Бог в вас в послушествование» добавляет «Бог» — по паритету внесено без 〔…〕); κύριος ἐξ οἴκου ἁγίου αὐτοῦ — «Господь из дома святого Своего» — конец стиха без глагола, оставлен так."
  3: "ἐκπορεύεται ἐκ τοῦ τόπου αὐτοῦ — «исходит от места Своего»; καταβήσεται καὶ ἐπιβήσεται ἐπὶ τὰ ὕψη τῆς γῆς — «сойдёт и наступит на высоты земли» (ἐπιβαίνω — ступать, наступать)."
  4: "σαλευθήσεται τὰ ὄρη ὑποκάτωθεν αὐτοῦ — «поколеблются горы под Ним» (ὑποκάτωθεν — снизу, под); αἱ κοιλάδες τακήσονται ὡς κηρὸς ἀπὸ προσώπου πυρός — «долины растают, как воск от лица огня» (κήρ — воск); ὡς ὕδωρ καταφερόμενον ἐν καταβάσει — «как вода, низвергающаяся при падении» (слав. «яко вода сходящи со устремлением»)."
  5: "διὰ ἀσέβειαν Ιακωβ πάντα ταῦτα — «за нечестие Иакова всё это»; τίς ἡ ἀσέβεια τοῦ Ιακωβ; οὐ Σαμάρεια; — «какое нечестие Иакова? не Самария ли?»; τίς ἡ ἁμαρτία οἴκου Ιουδα; οὐχὶ Ιερουσαλημ; — «какой грех дома Иуды? не Иерусалим ли?» (в ru второе — «кто устроил высоты в Иудее» — масоретское чтение, в текст не внесено)."
  6: "θήσομαι Σαμάρειαν εἰς ὀπωροφυλάκιον ἀγροῦ — «обращу Самарию в плодовую сторожку поля» (ὀπωροφυλάκιον — сторожка для плодов, место хранения плодов; слав. «во овощное хранилище селное»; в тексте 「果物の倉」 — «житница плодов»); εἰς φυτείαν ἀμπελῶνος — «в насаждение виноградника»; κατασπάσω εἰς χάος τοὺς λίθους αὐτῆς — «низрину в хаос (пропасть) камни её»; τὰ θεμέλια αὐτῆς ἀποκαλύψω — «основания её открою»."
  7: "πάντα τὰ γλυπτὰ αὐτῆς κατακόψουσιν — «все изваяния её разрубят» (γλυπτόν — резное изображение); τὰ μισθώματα αὐτῆς ἐμπρήσουσιν ἐν πυρί — «плату её сожгут огнём» (μίσθωμα — плата, наёмная цена; слав. «мзды»); τὰ εἴδωλα αὐτῆς θήσομαι εἰς ἀφανισμόν — «истуканы её обращу в уничтожение»; ἐκ μισθωμάτων πορνείας συνήγαγεν — «из платы блуда собрала»; ἐκ μισθωμάτων πορνείας συνέστρεψεν — «в плату блуда и обратила» (συστρέφω — свёртывать, обращать; слав. «от найма блужения соврати»)."
  8: "Ἕνεκεν τούτου κόψεται καὶ θρηνήσει — «из-за этого будет бить себя и плакать» (κόπτω — ударять в знак скорби; θρηνέω — рыдать); πορεύσεται ἀνυπόδετος καὶ γυμνή — «пойдёт босая и нагая» (ἀνυπόδετος — без обуви; слав. «пойдет боса и нага»); ποιήσεται κοπετὸν ὡς δρακὄντων — «сделает плач, как драконов» (δράκων — дракон, змей; слав. «аки змиев»; в МТ — шакалы); πένθος ὡς θυγατέρων σειρήνων — «рыдание, как дочерей сирен» (σειρήν — сирена; в МТ — страусы; отсюда транслитерация セイレン)."
  9: "κατεκράτησεν ἡ πληγὴ αὐτῆς — «одолела язва её» (κρατέω — одолевать, брать верх; слав. «одержа язва ея»); ἦλθεν ἕως Ιουδα — «дошла до Иуды»; ἥψατο ἕως πύλης λαοῦ μου, ἕως Ιερουσαλημ — «коснулась до ворот народа моего, до Иерусалима»."
  10: "οἱ ἐν Γεθ, μὴ μεγαλύνεσθε — «в Гефе не величайтесь» (Γεθ — Геф, в корпусе ガト); οἱ ἐν Ακιμ — «в Акиме» (слав. «иенакимляне» — искажение того же названия); μὴ ἀνοικοδομεῖτε ἐξ οἴκου κατὰ γέλωτα — «не отстраивайте из дома ради смеха» — тёмное место LXX; γῆν καταπάσασθε κατὰ γέλωτα ὑμῶν — «землёю посыпьте смех ваш» (καταπάσσω — посыпать; слав. «перстию посыплите посмеяние ваше»). Игра слов подлинника (Геф — «возвещайте», Аким — «плачьте», прах — Беф-Афра) в LXX утрачена, в тексте буквальность без сглаживания."
  11: "κατοικοῦσα καλῶς τὰς πόλεις αὐτῆς — «живущая хорошо (благополучно) в городах своих»; οὐκ ἐξῆλθεν κατοικοῦσα Σεννααν — «не вышла живущая в Сеннаане» (Σεννααν — Сенан; слав. «в сеннааре»); κόψασθαι οἶκον ἐχόμενον αὐτῆς — «плакать о доме, близком её» (ἐχόμενος — смежный, близкий; слав. «плачитеся дому сущаго близ ея»); λήμψεται ἐξ ὑμῶν πληγὴν ὀδύνης — «примет от вас язву боли» — тёмное место, в тексте 「苦痛の傷を受け取る」 без сглаживания."
  12: "τίς ἤρξατο εἰς ἀγαθὰ κατοικούσῃ ὀδύνας — «кто начал во благое живущей в болезнях?» (слав. «кто нача во благая вселившейся в болезнех»): LXX не разобрал евр. «יושבת מרות» (жительница Марофа), в тексте буквально по LXX; ὅτι κατέβη κακὰ παρὰ κυρίου ἐπὶ πύλας Ιερουσαλημ — «ибо сошли злая от Господа на врата Иерусалима»."
  13: "ψόφος ἁρμάτων καὶ ἱππευόντων — «шум колесниц и всадников» (ψόφος — шум; ἅρμα — колесница); ἀρχηγὸς ἁμαρτίας αὐτὴ τῇ θυγατρὶ Σιων — «она — начало (вождь) греха для дочери Сиона» (ἀρχηγός — вождь, начало; слав. «началница греха»); ὅτι ἐν σοὶ εὑρέθησαν ἀσέβειαι τοῦ Ισραηλ — «ибо в тебе нашлись нечестия Израиля»."
  14: "δώσεις ἐξαποστελλομένους ἕως κληρονομίας Γεθ — «дашь отсылаемых до удела Гефа»: LXX прочитал «Морешет-Гаф» как «κληρονομία Γεθ» (удел Гефа), игра слов подлинника утрачена; οἴκους ματαίους — «домы суетные» (слав. «домы суетны»); εἰς κενὰ ἐγένετο τοῖς βασιλεῦσιν τοῦ Ισραηλ — «в тщету стало царям Израиля» (слав. «вотще быша царем израилевым»)."
  15: "ἕως τοὺς κληρονόμους ἀγάγω σοι — «доколе наследников приведу тебе» (слав. «дондеже наследники приведу тебе»); κατοικοῦσα Λαχις κληρονομία — «живущая в Лахис, наследие» (обращение); ἕως Οδολλαμ ἥξει ἡ δόξα — «до Одоллама дойдёт слава»; τῆς θυγατρὸς Ισραηλ — «дочери Израиля», слав. читает «дщере сиони» — по паритету в тексте 「シオンの娘」, вариант LXX здесь. Синтаксис стиха тёмный, сохранён порядок LXX."
  16: "ξύρησαι καὶ κεῖραι — «обрейся и остригись» (ξυράω — брить; κείρω — стричь; слав. «оброснися и остризися»); ἐπὶ τὰ τέκνα τὰ τρυφερά σου — «о детях твоих нежных»; ἐμπλάτυνον τὴν χηρείαν σου ὡς ἀετός — «расширь вдовство твоё, как орёл» (χήρα — вдова; χηρεία — вдовство, здесь плешь; слав. «разшири оброснение твое яко орел»); ὅτι ᾐχμαλωτεύθησαν ἀπό σοῦ — «ибо отведены в плен от тебя»."
