# jp-box, Михей, глава 1. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 1 (совпадает, 16 стихов).
# Карта книги (важно для гл. 4/5): гл. 1–3 совпадают с gr стих в стих; гл. 4 — gr 4:1–13
# (13 стихов, у слав. тоже 13); гл. 5 — слав. 5:1 = gr 4:14, далее слав. 5:N = gr 5:(N−1)
# до слав. 5:15 = gr 5:14 (у гр. гл. 5 всего 14 стихов, 5:15 в ней нет); гл. 6–7
# совпадают. Всего 105 стихов — столько же в gr и в слав. Стихи не дублируются.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1 надписание (Иоафам, Ахаз, Езекия); 2–4 вселенский вызов: Господь
# выходит из места Своего, горы плавятся; 5–7 нечестие Иакова — Самария, грех Иуды —
# Иерусалим, Самария как житница плодов, камни в пропасть; 8–9 плач пророка,
# язва дошла до Иерусалима; 10–15 цепь городов (Геф, Аким, Сеннаан, Лахис, Одоллам):
# «не величайтесь», «посыпьте себя прахом», «расширь вдовство, как орёл»;
# 16 обритие головы и плен.
# Голоса: 1 — надписание вне кавычек; 2 — призыв «слушайте, народы» (речь пророка
# или глашатая) в 「…」, закрывается в стихе; 3–7 — слово Господа в 「…」 (открывается
# в 3, закрывается в 7); 8–9 — речь пророка в 「…」 (8–9); 10–16 — речь пророка
# в 「…」 до конца главы. Внутри кавычек второго уровня нет.
# География передана транслитерацией LXX: ガト (Γεθ), アキム (Ακιμ), センナン (Σεννααν),
# ラキシュ (Λαχις), オドラム (Οδολλαμ); ナゲブ/セファラ — только в Авдии.
#
