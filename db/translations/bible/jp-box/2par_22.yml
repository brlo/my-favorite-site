# jp-box, 2-я Паралипоменон, глава 22. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc для книги нет,
# jp-ni (под авторским правом) источником не был.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы —
# по греческому.
# Нумерация по gr: 12 стихов, совпадает с csl/ru.
# Глава 22: воцарение Охозии (1–2), его нечестие (3–4), поход с Иорамом и
# гибель (5–9), Аталия истребляет царский род (10), Иосавеф спасает Иоаса
# (11), Иоас скрыт в храме шесть лет (12).
# Паритет: слав. чтения внесены в основной текст без скобок (9 «лечившегося»
# вместо «скрывавшегося»); варианты LXX и МТ — в notes.
# Речь — 「…」 (9, слова народа). Красного нет.
# 〔…〕 нет: на месте каждого стиха в gr-lxx-byz есть текст.
# Сносок ⟨…⟩ нет: 神殿, 祭司, 契約, 王座 уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: 2par
chapter: 22
draft: true

verses:
  1: "エルサレムの住民[じゅうみん]は、彼[かれ]の末[すえ]の子[こ]アハズヤを彼[かれ]に代[か]わって王[おう]とした。彼[かれ]らに襲[おそ]いかかった略奪者[りゃくだつしゃ]の一団[いちだん]、すなわちアラビア人[じん]とアリマゾン人[じん]が、兄[あに]たちをすべて殺[ころ]していたからである。こうしてヨラムの子[こ]アハズヤがユダの王[おう]として治[おさ]めた。"
  2: "アハズヤは王[おう]となったとき二十歳[はたち]で、エルサレムで一年[いちねん]治[おさ]めた。彼[かれ]の母[はは]の名[な]はアタリヤといい、アムリの娘[むすめ]であった。"
  3: "彼[かれ]もまたアハブの家[いえ]の道[みち]を歩[あゆ]んだ。彼[かれ]の母[はは]が、彼[かれ]に罪[つみ]を犯[おか]させる助言者[じょげんしゃ]であったからである。"
  4: "彼[かれ]は主[しゅ]の前[まえ]に悪[わる]を行[おこな]い、アハブの家[いえ]のようであった。父[ちち]の死[し]んだ後[あと]、彼[かれ]らが彼[かれ]を滅[ほろ]ぼすための助言者[じょげんしゃ]となったからである。"
  5: "彼[かれ]は彼[かれ]らの助言[じょげん]に従[したが]って歩[あゆ]んだ。そしてアハブの子[こ]ヨラムとともに、シリアの王[おう]ハザエルに対[たい]する戦[いくさ]のためにギレアデのラモトへ行[い]った。射手[しゃしゅ]たちはヨラムを射[い]た。"
  6: "彼[かれ]は、シリア人[じん]がラモトでハザエル王[おう]と戦[たたか]うときに負[お]った傷[きず]を癒[いや]すために、イズレエルへ戻[もど]った。ヨラムの子[こ]、ユダの王[おう]アハズヤは、ヨラムが病[やまい]であったので、イズレエルへ下[くだ]った。"
  7: "アハズヤがヨラムのもとへ行[い]ったことは、神[かみ]による彼[かれ]の滅亡[めつぼう]であった。彼[かれ]が着[つ]くと、ヨラムとともに、アハブの家[いえ]のために主[しゅ]が油[あぶら]を注[そそ]いだイエフ、ナメシの子[こ]のもとへ出[で]て行[い]ったからである。"
  8: "イエフがアハブの家[いえ]に裁[さば]きを行[おこな]ったとき、彼[かれ]はユダの首長[しゅちょう]たちと、アハズヤに仕[つか]えていたアハズヤの兄弟[きょうだい]たちを見[み]つけて、彼[かれ]らを殺[ころ]した。"
  9: "彼[かれ]はアハズヤを捜[さが]させた。人々[ひとびと]はサマリアで傷[きず]を癒[いや]していた彼[かれ]を見[み]つけ、イエフのもとへ連[つ]れて来[き]た。イエフは彼[かれ]を殺[ころ]し、葬[ほうむ]った。「彼[かれ]はヨシャファトの子[こ]で、主[しゅ]を全心[ぜんしん]で求[もと]めたからである」と人々[ひとびと]は言[い]った。アハズヤの家[いえ]には、王国[おうこく]を支[ささ]える力[ちから]のある者[もの]は一人[ひとり]もいなかった。"
  10: "アハズヤの母[はは]アタリヤは、自分[じぶん]の子[こ]が死[し]んだのを見[み]て、立[た]ち上[あ]がり、ユダの家[いえ]の王[おう]の一族[いちぞく]をことごとく滅[ほろ]ぼした。"
  11: "しかし、王[おう]の娘[むすめ]ヨサベアは、アハズヤの子[こ]ヨアシュを連[つ]れて行[い]き、殺[ころ]されようとしていた王[おう]の子[こ]らの中[なか]から彼[かれ]を盗[ぬす]み出[だ]し、彼[かれ]とその乳母[うば]を寝台[しんだい]の部屋[へや]に置[お]いた。こうして、王[おう]ヨラムの娘[むすめ]で、アハズヤの妹[いもうと]であり、祭司[さいし]ヨヤダの妻[つま]であるヨサベアが彼[かれ]を隠[かく]し、アタリヤの顔[かお]から遠[とお]ざけたので、アタリヤは彼[かれ]を殺[ころ]さなかった。"
  12: "彼[かれ]は彼女[かのじょ]とともに神[かみ]の家[いえ]に隠[かく]されて六年間[ろくねんかん]いた。その間[あいだ]、アタリヤがその国[くに]を治[おさ]めていた。"

notes:
  1: "ἐβασίλευσαν — поставили царём (βασιλεύω здесь переходно). τὸν μικρόν — младшего. τὸ λῃστήριον — разбойничья шайка (λῃστήριον). Ἀλιμαζονεῖς — алимазоняне (ἅπ. λεγ.; слав. «алимазоняне»; в ru «Аравитянами к стану» — по МТ). πρεσβύτεροι — старшие."
  2: "ὢν εἴκοσι ἐτῶν — «будучи 20 лет» (LXX); слав. даёт уникальные 22, ru/МТ — 42. По принципу разумного паритета взято чтение LXX (20), слав. и масоретский варианты отмечены. Γοθολια — Гофолия (アタリヤ). θυγάτηρ Αμβρι — дочь Амврия (в 21:6 она названа дочерью Ахава; Амврий — дед по МТ)."
  3: "σύμβουλος τοῦ ἁμαρτάνειν — «советница грешить» (σύμβουλος — советник, советчица)."
  4: "αὐτοὶ ἦσαν αὐτῷ … σύμβουλοι — «они были ему советниками» (мн. ч.: дом Ахава). τοῦ ἐξολεθρεῦσαι — чтобы погубить (ἐξολεθρεύω)."
  5: "ἐν ταῖς βουλαῖς αὐτῶν — «в советах их». Αζαηλ — Азаил (ハザエル). Ραμα Γαλααδ — Рама Галаадская (ギレアデのラモト; слав. «рамоф галаадский»). τοξόται — стрелки (射手). ἐπάταξαν — поразили, ранили."
  6: "ἐπέστρεψεν … ἰατρευθῆναι — «возвратился лечиться» (ἰατρεύω). Ιεζραελ — Изреель (イズレエル). κατέβη — сошёл (下った). ἠρρώστει — болел (ἀρρωστέω)."
  7: "παρὰ τοῦ θεοῦ ἐγένετο καταστροφή — «от Бога было сокрушение» (καταστροφή — низвержение, погибель). χριστὸν κυρίου — помазанника Господня (χριστός); слав. «егоже помаза Господь на дом Ахаавль» — «на дом Ахава» внесено в текст."
  8: "ἐξεδίκησεν — отомстил, совершил суд (ἐκδικέω). ἄρχοντες Ιουδα — начальники Иуды (首長). λειτουργοῦντας — служащих (λειτουργέω). ἀδελφοί — братья (в ru «сыновья братьев» — по МТ). Слав. добавляет «и уби ииуй иорама, и убежа охозиа» — в гр этого нет (вставка из 4Цар 9)."
  9: "ἐζήτησεν — велел искать (ζητέω). ἰατρευόμενον — «лечившегося» (слав. «врачующася»; в ru «скрывался» — по МТ). ἔθαψαν — похоронили. ἐζήτησεν τὸν κύριον ἐν ὅλῃ καρδίᾳ — искал Господа всем сердцем. κατισχῦσαι δύναμιν — «иметь силу» (κατισχύω)."
  10: "ἠγέρθη — встала. ἀπώλεσεν — погубила (ἀπόλλυμι). σπέρμα τῆς βασιλείας — семя царства, царский род."
  11: "ἔκλεψεν — украла (κλέπτω). ἐκ μέσου — из среды. τῶν θανατουμένων — умерщвляемых (θανατόω). ταμίειον τῶν κλινῶν — «кладовая постелей», спальня (слав. «храмина постельная»). τροφός — кормилица (乳母). ἀπὸ προσώπου — от лица."
  12: "κατακεκρυμμένος — «скрываемый» (κατακρύπτω). ἓξ ἔτη — шесть лет. ἐβασίλευσεν ἐπὶ τῆς γῆς — «царствовала над землёй»."
