# jp-box, 3-я Маккавейская, глава 7. Черновик для приёмки.
#
# Нумерация — по Синодальному (ru, 20 стихов); текст — с греческого (gr-lxx-byz,
# 23 стиха); карта книги — в шапке гл. 1. В этой главе соединены:
# 7:1 (gr 1+2), 7:18 (gr 19+20+21). Остальные — один к одному.
#
# Содержание: письмо царя (1–9): Птолемей и дети здоровы, клеветники
# подстрекали к избиению иудеев, царь запретил, узнал, что Бог защищает
# иудеев, освободил их и позволил им наказать отступников; угроза Божиим
# отмщением. 10–14 — иудеи просят позволить им наказать отступников,
# царь соглашается; они казнят более трёхсот. 15–18 — возвращение,
# благодарение, стоянка в Птолемаиде, праздник, путь домой. 19–20 —
# возвращение имущества и славословие.
# Прямая речь: 7:1–9 — письмо царя в 「…」. Остальное — повествование.
# 〔…〕 нет; сносок ⟨…⟩ нет. ru — только нумерация и понимание, его чтения
# в текст не вносятся (расхождения отмечены в notes).

