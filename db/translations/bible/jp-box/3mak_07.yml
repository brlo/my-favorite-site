verses:
  1: "「王[おう]プトレマイオス・フィロパトルは、エジプトの将軍[しょうぐん]たちと、すべての務[つと]めに任[にん]じられた者[もの]たちに、喜[よろこ]びと健康[けんこう]を願[ねが]って挨拶[あいさつ]する。わたしたちも子[こ]どもたちも無事[ぶじ]である。大[おお]いなる神[かみ]が、わたしたちの望[のぞ]みどおりに事[こと]を導[みちび]いてくださったからである。"
  2: "友人[ゆうじん]たちのうちのある者[もの]たちが悪意[あくい]によってたびたびわたしたちに進[すす]言[げん]し、支配下[しはいか]のユダヤ人[じん]を一[ひと]つの集[しゅう]まりに集[あつ]めて、反逆者[はんぎゃくしゃ]にふさわしい珍[めずら]しい罰[ばつ]で罰[ばっ]するよう、わたしたちを説[と]き伏[ふ]せた。"
  3: "彼[かれ]らは、これが成[な]し遂[と]げられるまでは、この者[もの]たちがすべての民[たみ]に対[たい]して抱[いだ]く敵意[てきい]のゆえに、わたしたちの事[こと]がらが決[けっ]して安定[あんてい]しないだろう、と言[い]い添[そ]えた。"
  4: "彼[かれ]らはこの者[もの]たちを、奴隷[どれい]のように、いや、陰謀[いんぼう]を企[くわだ]てる者[もの]のように、乱暴[らんぼう]に引[ひ]き立[た]てて連[つ]れて来[き]ながら、何[なん]の取[と]り調[しら]べも尋問[じんもん]もなしに殺[ころ]そうとした。スキタイ人[じん]の慣習[かんしゅう]よりも野蛮[やばん]な残酷[ざんこく]さを身[み]にまとっていたのである。"
  5: "しかしわたしたちは、このことについて彼[かれ]らを厳[きび]しく戒[いまし]め、すべての人[ひと]に対[たい]するわたしたちの寛容[かんよう]によって、ようやく彼[かれ]らに命[いのち]を許[ゆる]した。また、天[てん]の神[かみ]がユダヤ人[じん]を確[たし]かに守[まも]り、父[ちち]が子[こ]らを守[まも]るように、いつも味方[みかた]してくださることを知[し]った。"
  6: "さらに、彼[かれ]らがわたしたちとわたしたちの祖先[そせん]たちに抱[いだ]いている確[たし]かな善意[ぜんい]を考[かんが]え、わたしたちは彼[かれ]らをどのようないわれのない罪[つみ]からも、正[ただ]しく放免[ほうめん]した。"
  7: "そして、すべての者[もの]がめいめい自分[じぶん]の家[いえ]へ帰[かえ]るよう、どこの場所[ばしょ]でも誰[だれ]も彼[かれ]らを害[がい]したり、理[り]に外[はず]れた出来事[できごと]について咎[とが]めたりしてはならない、と命[めい]じた。"
  8: "知[し]っておくがよい。もしわたしたちが彼[かれ]らに対[たい]して何[なに]か悪[わる]いことを企[くわだ]てたり、彼[かれ]らを少[すこ]しでも悲[かな]しませたりするなら、わたしたちは人[ひと]ではなく、すべての力[ちから]を支配[しはい]するいと高[たか]き神[かみ]を、あらゆることにおいて、いついかなる時[とき]も避[さ]け難[がた]い報復[ほうふく]者[しゃ]として相手[あいて]に持[も]つことになる。健[すこ]やかであれ。」"
  9: "彼[かれ]らはこの書簡[しょかん]を受[う]け取[と]っても、すぐに出発[しゅっぱつ]しようとはせず、王[おう]に、ユダヤ人[じん]の血筋[ちすじ]のうちで聖[せい]なる神[かみ]と神[かみ]の律法[りっぽう]を自[みずか]ら破[やぶ]った者[もの]たちが、彼[かれ]らによって当然[とうぜん]の罰[ばつ]を受[う]けるようにしてほしいと願[ねが]い出[で]た。"
  10: "彼[かれ]らは、腹[はら]のために神[かみ]の定[さだ]めを破[やぶ]った者[もの]たちは、決[けっ]して善意[ぜんい]を示[しめ]すことはなく、王[おう]の事[こと]がらにも従[したが]わないだろう、と言[い]い添[そ]えた。"
  11: "王[おう]は彼[かれ]らが真[しん]実[じつ]を言[い]っていると認[みと]め、勧[すす]めを与[あた]えて、すべてのことについて彼[かれ]らに自由[じゆう]を与[あた]えた。神[かみ]の律法[りっぽう]を破[やぶ]った者[もの]たちを、王[おう]の支配下[しはいか]のどの場所[ばしょ]でも、王[おう]の権限[けんげん]や監督[かんとく]を一切[いっさい]受[う]けずに、公然[こうぜん]と滅[ほろ]ぼし尽[つ]くすためであった。"
  12: "そこで彼[かれ]らの祭司[さいし]たちと民[たみ]の全[すべ]ては、ふさわしい仕方[しかた]で王[おう]をたたえ、「アレルヤ」と叫[さけ]んで喜[よろこ]びながら帰[かえ]って行[い]った。"
  13: "こうして彼[かれ]らは道[みち]で見[み]つけた汚[けが]れた同族[どうぞく]の者[もの]を罰[ばっ]し、見[み]せしめとして殺[ころ]した。"
  14: "その日[ひ]、彼[かれ]らは三百人[さんびゃくにん]余[あま]りを殺[ころ]し、汚[けが]れた者[もの]たちを打[う]ち負[ま]かして、喜[よろこ]びのうちにこの日[ひ]を祝[いわ]った。"
  15: "彼[かれ]らは死[し]に至[いた]るまで神[かみ]を離[はな]れず、完全[かんぜん]な救[すく]いの喜[よろこ]びを味[あじ]わった者[もの]たちとして、都[みやこ]を出[で]発[はったつ]した。あらゆる香[かお]り高[たか]い花[はな]で身[み]を飾[かざ]り、喜[よろこ]びと叫[さけ]びのうちに、賛美[さんび]とあらゆる旋律[せんりつ]の讃美歌[さんびか]を歌[うた]い、彼[かれ]らの父祖[ふそ]の神[かみ]、イスラエルの永遠[えいえん]の救[すく]い主[ぬし]に感謝[かんしゃ]した。"
  16: "彼[かれ]らは、その土地[とち]の特徴[とくちょう]からロドフォロス（薔薇[ばら]を産[う]む所[ところ]）と呼[よ]ばれるプトレマイスに着[つ]いた。そこでは、彼[かれ]らの共通[きょうつう]の決[けつ]めに従[したが]って、船団[せんだん]が七日間[なのかかん]彼[かれ]らを待[ま]っていた。"
  17: "そこで彼[かれ]らは、王[おう]がめいめいの家[いえ]に着[つ]くまでに必要[ひつよう]なすべてのものを惜[お]しみなく支給[しきゅう]してくれたので、救[すく]いの宴[うたげ]を開[ひら]いた。"
  18: "彼[かれ]らは平和[へいわ]のうちに導[みちび]かれ、ふさわしい感謝[かんしゃ]をささげ、そこでも同[おな]じように、寄留[きりゅう]の間[あいだ]これらの日[ひ]々[び]を喜[よろこ]びの日[ひ]として祝[いわ]うことに決[き]めた。そして、宴[うたげ]の場所[ばしょ]に石柱[せきちゅう]を立[た]ててこれを聖別[せいべつ]し、祈[いの]りの場所[ばしょ]を設[もう]けてから、無傷[むきず]で、自由[じゆう]で、この上[うえ]なく喜[よろこ]びながら、王[おう]の命令[めいれい]によって陸[りく]と海[うみ]と川[かわ]を越[こ]えて、めいめい自分[じぶん]の家[いえ]へ帰[かえ]って行[い]った。彼[かれ]らは以前[いぜん]よりも、敵[てき]の間[あいだ]で大[おお]きな権威[けんい]を、栄光[えいこう]と恐[おそ]れとともに持[も]ち、持[も]ち物[もの]は何[なに]一つ誰[だれ]にも揺[ゆ]さぶられなかった。"
  19: "そして彼[かれ]らは皆[みな]、登録[とうろく]に従[したが]って自分[じぶん]たちのものをすべて取[と]り戻[もど]した。何[なに]かを持[も]っていた者[もの]たちも、非常[ひじょう]な恐[おそ]れをもって彼[かれ]らに返[かえ]した。大[おお]いなる神[かみ]が、彼[かれ]らの救[すく]いのために大[おお]いなることを完全[かんぜん]に行[おこな]われたからである。"
  20: "イスラエルの救[すく]い主[ぬし]は、永遠[えいえん]にほめたたえられますように。アーメン。"

notes:
  1: "СТИХ СОЕДИНЁН: gr 7:1+2. Начало письма (1) и известие о здоровье царя и детей (2). χαίρειν καὶ ἐρρῶσθαι — «радоваться и здравствовать»; κατευθύναντος — «направившего»."
  2: "gr 7:3. κατὰ κακοήθειαν — «по злобе»; παρακείμενοι — «приступая, докучая»; σύστημα — «толпа, скопище»; ἀποστατῶν τιμωρίαις — «карами, как для отступников»."
  3: "gr 7:4. προφερόμενοι — «приводя (довод)»; μηδέποτε εὐσταθήσειν — «что никогда не будет устойчиво»; δυσμένεια — враждебность."
  4: "gr 7:5. δεσμίους καταγαγόντες — «приведя связанными»; ἀνδράποδα — «рабы»; ἄνευ ἀνακρίσεως — «без расследования»; νόμου Σκυθῶν ἀγριωτέρα ὠμότης — «жестокость диче скифского обычая»."
  5: "gr 7:6. διαπειλησάμενοι — «пригрозив»; ἐπιείκεια — снисходительность; μόγις — едва; ὑπερησπικέναι — «защищать»."
  6: "gr 7:7. ἀναλογισάμενοι — «приняв в расчёт»; βεβαία εὔνοια — «твёрдое доброжелательство»; ἀπολελύκαμεν — «освободили»; καθ᾽ ὁντινοῦν αἰτίας τρόπον — «по всякому виду вины»."
  7: "gr 7:8. ἐπιστρέφειν εἰς τὰ ἴδια — «возвращаться к себе»; μηθενὸς καταβλάπτοντος — «никто не вредит»; ὀνειδίζειν περὶ τῶν γεγενημένων παρὰ λόγον — «укорять за случившееся вопреки разуму»."
  8: "gr 7:9. κακοτεχνεῖν — «замышлять злое»; ἐπιλυπεῖν — «огорчить»; ὕψιστος — всевышний; ἀφεύκτως — «неизбежно»; ἔρρωσθε — «будьте здоровы» (конец письма)."
  9: "gr 7:10. οὐκ ἐσπούδασαν εὐθέως — «не поспешили тотчас»; ἄφοδος — уход, отбытие; προσηξίωσαν — «попросили»; ὀφειλομένη κόλασις — «должное наказание»."
  10: "gr 7:11. γαστρὸς ἕνεκεν — «ради чрева»; παραβεβηκότας — «преступивших»; μηδέποτε εὐνοήσειν — «что никогда не будут благосклонны»."
  11: "gr 7:12. τἀληθὲς λέγειν — «говорить правду»; ἄδεια — свобода, позволение; ἐξολεθρεύσωσιν — «истребят»; ἄνευ βασιλικῆς ἐπισκέψεως — «без царского надзора»."
  12: "gr 7:13. κατευφημήσαντες — «восхвалив»; ἀλληλουια — аллилуиа; ἀνέλυσαν — «отправились»."
  13: "gr 7:14. τὸν ἐμπεσόντα τῶν μεμιαμμένων ὁμοεθνῆ — «попавшегося осквернённого соплеменника»; μετὰ παραδειγματισμῶν — «с показательным устрашением»."
  14: "gr 7:15. ὑπὲρ τοὺς τριακοσίους ἄνδρας — «более трёхсот мужей»; βεβήλους χειρωσάμενοι — «одолев нечестивых»."
  15: "gr 7:16. οἱ μέχρι θανάτου τὸν θεὸν ἐσχηκότες — «до смерти державшиеся Бога»; παντελὴς σωτηρίας ἀπόλαυσις — «полное наслаждение спасением»; παμμελεῖς ὕμνοι — «вселадные гимны»."
  16: "gr 7:17. Πτολεμαΐς — Птолемаида (プトレマイス); ῥοδοφόρος — «розоносная» (ロドフォロス); στόλος — флот, корабли; κατὰ κοινὴν βουλήν — «по общему решению»."
  17: "gr 7:18. πότος σωτήριος — «спасительный пир»; χορηγήσαντος — «снабдившего»; εὐψύχως — «щедро, бодро»."
  18: "СТИХ СОЕДИНЁН: gr 7:19+20+21. Прибытие с миром и установление праздника (19); освящение столбом, возвращение по земле, морю и реке, свобода и радость (20); большая, чем прежде, власть и страх у врагов (21). ἀνιερώσαντες ἐν στήλῃ — «освятив столбом»; ἀσινεῖς — невредимые; ἀνασῳζόμενοι — «спасаемые»; διασεισθέντες — «поколебленные»."
  19: "gr 7:22. ἐκομίσαντο ἐξ ἀπογραφῆς — «получили по переписи»; μετὰ φόβου μεγίστου — «с величайшим страхом»; τὰ μεγαλεῖα τοῦ θεοῦ — «великие дела Божии»."
  20: "gr 7:23. εὐλογητὸς ὁ ῥύστης Ισραηλ — «благословен Избавитель Израиля»; εἰς τοὺς ἀεὶ χρόνους — «во веки»; αμην — аминь."
