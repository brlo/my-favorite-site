verses:
  1: "オニアの子[こ]、大祭司[だいさいし]シモン。彼は自分[じぶん]の生[い]きている間[あいだ]に主[しゅ]の家[いえ]を繕[つくろ]い直[なお]し、その日々[ひび]に神殿[しんでん]を堅[かた]くした。"
  2: "彼によって二重[にじゅう]の高[たか]さの土台[どだい]が据[す]えられ、聖[せい]なる囲[かこ]いの高[たか]い支[ささ]えとなった。"
  3: "彼の日々[ひび]に水[みず]の溜[た]め池[いけ]が岩[いわ]から掘[ほ]り抜[ぬ]かれ、その周[まわ]りは海[うみ]のような水槽[すいそう]となった。"
  4: "彼は自分[じぶん]の民[たみ]が倒[たお]れることのないように心[こころ]を配[くば]り、包囲[ほうい]の中[なか]で都[みやこ]を強[つよ]くした。"
  5: "彼は民[たみ]の中[なか]を巡[めぐ]るとき、垂[た]れ幕[まく]の家[いえ]から出[で]て来[く]るとき、なんと栄光[えいこう]に満[み]ちていたことか。"
  6: "雲[くも]の間[あいだ]の明[あ]けの明星[みょうじょう]のように、その日々[ひび]に満[み]ちる月[つき]のように、"
  7: "いと高[たか]き者[もの]の神殿[しんでん]に照[て]り輝[かがや]く太陽[たいよう]のように、栄光[えいこう]の雲[くも]の中[なか]で光[ひかり]を放[はな]つ虹[にじ]のように、"
  8: "若[わか]い日々[ひび]の薔薇[ばら]の花[はな]のように、水[みず]の流[なが]れ出[で]るほとりの百合[ゆり]のように、夏[なつ]の日々のレバノンの若枝[わかえだ]のように、"
  9: "火皿[ひざら]の上[うえ]の火[ひ]と乳香[にゅうこう]のように、"
  10: "あらゆる高価[こうか]な石[いし]で飾[かざ]られた、打[う]ち出[だ]しの純金[じゅんきん]の器[うつわ]のように、"
  11: "実[み]を結[むす]んで茂[しげ]るオリーブの木[き]のように、雲[くも]にまで高[たか]く伸[の]びる糸杉[いとすぎ]のように。"
  12: "彼が栄光[えいこう]の衣[ころも]をまと[まと]い、誇[ほこ]りの極[きわ]みを身[み]に着[つ]けたとき、聖[せい]なる祭壇[さいだん]に上[のぼ]るにあたって、彼は聖所[せいしょ]の装[よそお]いを輝[かがや]かせた。"
  13: "彼が祭司[さいし]たちの手[て]から分[わ]け前[まえ]を受[う]け取[と]るとき、彼自身[じしん]は祭壇[さいだん]の炉[ろ]のそばに立[た]っていた。"
  14: "彼の周[まわ]りには兄弟[きょうだい]たちの冠[かんむり]があり、レバノンの杉[すぎ]の若枝[わかえだ]のようであり、彼らはなつめやしの幹[みき]のように彼を取り囲[かこ]んだ。"
  15: "また、アロンの子[こ]らはすべてその栄光[えいこう]のうちにあり、イスラエルの全会衆[ぜんかいしゅう]の前[まえ]に、主[しゅ]へのささげ物[もの]は彼らの手[て]にあった。"
  16: "彼らは祭壇[さいだん]の上[うえ]で務[つと]めを全[まっと]うし、いと高[たか]き全能者[ぜんのうしゃ]へのささげ物[もの]を飾[かざ]った。"
  17: "彼は注[そそ]ぎの杯[さかずき]に手[て]を伸[の]べ、ぶどうの血[ち]を注[そそ]ぎ入[い]れ、祭壇[さいだん]の基[もと]に注ぎ出[だ]した。いと高[たか]き全能[ぜんのう]の王[おう]に、香[こう]ばしい香りとして。"
  18: "そのとき、アロンの子[こ]らは叫[さけ]び、鍛[きた]えたラッパで吹[ふ]き鳴[な]らし、いと高[たか]き者の前[まえ]に記念[きねん]として大[おお]きな声[こえ]を響[ひび]かせた。"
  19: "そのとき、民[たみ]はすべて共[とも]に急[いそ]ぎ寄[よ]り、地[ち]の上[うえ]に顔[かお]を伏[ふ]せて、自分[じぶん]たちの主[しゅ]、全能[ぜんのう]の神[かみ]、いと高[たか]き者を拝[おが]んだ。"
  20: "歌[うた]い手[て]たちはその声[こえ]でほめたたえ、大[おお]きな響[ひび]きの中[なか]で歌[うた]は甘[あま]く流[なが]れた。"
  21: "民[たみ]はあわれみ深[ふか]い方[かた]の前[まえ]で祈[いの]りをもって主[しゅ]、いと高[たか]き者に願[ねが]い、主の飾[かざ]りが完成[かんせい]するまで、こうしてその務[つと]めを終[お]えた。"
  22: "そのとき、彼は下[お]りて、イスラエルの子[こ]らへの全会衆[ぜんかいしゅう]の上[うえ]に手[て]を上[あ]げ、自分[じぶん]の唇[くちびる]から主[しゅ]の祝福[しゅくふく]を与[あた]え、主の名[な]によって誇[ほこ]るために。"
  23: "そして彼らは再[ふたた]び拝[おが]んで、いと高[たか]き者から祝福[しゅくふく]を受[う]け取[と]った。"
  24: "さあ、すべての者[もの]の神[かみ]をほめたたえよ。神はいたるところで大[おお]いなることを行[おこな]い、母[はは]の胎[たい]からわたしたちの日々[ひび]を高[たか]く上[あ]げ、そのあわれみにしたがってわたしたちを扱[あつか]ってくださる。"
  25: "神がわたしたちに心[こころ]の喜[よろこ]びを与[あた]え、イスラエルに、わたしたちの日々[ひび]に、永遠[えいえん]の日々のように平和[へいわ]が訪[おとず]れるように。"
  26: "神がそのあわれみをわたしたちとともに確[かた]くし、わたしたちの日々[ひび]にわたしたちを救[すく]い出[だ]してくださるように。"
  27: "わたしの魂[たましい]は二[ふた]つの民[たみ]に怒[いか]りを覚[おぼ]えた。そして三[みっ]つ目[め]は民[たみ]ですらない。"
  28: "サマリアの山[やま]に住[す]む者[もの]たち、ペリシテ人[じん]、そしてシケムに住む愚[おろ]かな民[たみ]である。"
  29: "エルサレムの人[ひと]、シラクの子[こ]、エレアザルの子イエスが、この書[しょ]に悟[さと]りと知識[ちしき]の教[おし]えを刻[きざ]みつけた。彼は自分[じぶん]の心[こころ]から知恵[ちえ]を雨[あめ]のように降[ふ]らせた。"
  30: "これらのことの中[なか]を歩[あゆ]む者[もの]は幸[しあわ]せである。それらを自分[じぶん]の心[こころ]に置[お]く者は知恵[ちえ]を得[え]る。"
  31: "それを実際[じっさい]に行[おこな]うなら、その者はすべてに対して強[つよ]くなる。主[しゅ]の光[ひかり]がその歩[あゆ]みであるからである。"

notes:
  1: "Σιμων Ονιου υἱὸς ἱερεὺς ὁ μέγας — «Симон, сын Онии, священник великий» (ὁ μέγας — великий, то есть первосвященник). ὃς ἐν ζωῇ αὐτοῦ ὑπέρραψεν οἶκον — «который при жизни своей обновил (починил) дом» (ὑπορράπτω — подшивать, чинить; οἶκος — дом, храм). ἐστερέωσεν ναόν — «укрепил храм» (στερεόω — утверждать, укреплять). Слав. «сострои дом и... утверди церковь»."
  2: "ὑπ᾿ αὐτοῦ ἐθεμελιώθη ὕψος διπλῆς — «им положено основание высоты двойной (стены)» (θεμελιόω — класть основание; ὕψος — высота; διπλῆς — двойной). ἀνάλημμα ὑψηλὸν περιβόλου ἱεροῦ — «высокая опора ограды святилища» (ἀνάλημμα — опора, подпорная стена; περίβολος — ограда; ἱερός — священный). Слав. «воздвижение высоко ограждения церковнаго»."
  3: "ἐλατομήθη ἀποδοχεῖον ὑδάτων — «было высечено водохранилище» (λατομέω — высекать в камне; ἀποδοχεῖον — вместилище, резервуар). λάκκος ὡσεὶ θαλάσσης τὸ περίμετρον — «водоём, как море, по окружности» (λάκκος — яма, цистерна; περίμετρον — окружность): большой бассейн. Слав. «ров яко моря окружение»."
  4: "ὁ φροντίζων τοῦ λαοῦ αὐτοῦ ἀπὸ πτώσεως — «пекущийся о народе своём, чтобы он не пал» (φροντίζω — заботиться; πτῶσις — падение). ἐνισχύσας πόλιν ἐν πολιορκίᾳ — «укрепивший город при осаде» (ἐνισχύω — укреплять; πολιορκία — осада). Слав. «блюдый люди своя от падения и укрепивый град во обседении»."
  5: "ὡς ἐδοξάσθη ἐν περιστροφῇ λαοῦ — «как он был прославлен при обходе народа» (περιστροφή — обхождение, круговращение): вероятно, при обходе народа с благословением. ἐν ἐξόδῳ οἴκου καταπετάσματος — «при выходе из дома завесы» (ἔξοδος — выход; καταπέτασμα — завеса): из храма, за завесой которого Святое святых. Слав. «в сожителстве людий, во исходе дому катапетасмы»."
  6: "ὡς ἀστὴρ ἑωθινὸς ἐν μέσῳ νεφελῶν — «как звезда утренняя среди облаков» (ἑωθινός — утренний; νεφέλη — облако). ὡς σελήνη πλήρης ἐν ἡμέραις — «как луна полная в дни свои» (σελήνη — луна; πλήρης — полный)."
  7: "ὡς ἥλιος ἐκλάμπων ἐπὶ ναὸν ὑψίστου — «как солнце, сияющее над храмом Всевышнего» (ἐκλάμπω — сиять; ναός — храм). ὡς τόξον φωτίζον ἐν νεφέλαις δόξης — «как радуга, светящаяся в облаках славы» (τόξον — лук, радуга; φωτίζω — освещать). Слав. «яко солнце сияющее на церковь вышняго»."
  8: "ὡς ἄνθος ῥόδων ἐν ἡμέραις νέων — «как цвет роз в дни юности (весны)» (ῥόδον — роза; νέων — юных, то есть весенних). ὡς κρίνα ἐπ᾿ ἐξόδῳ ὕδατος — «как лилии при выходе (источнике) воды» (κρίνον — лилия; ἔξοδος — выход). ὡς βλαστὸς Λιβάνου ἐν ἡμέραις θέρους — «как побег Ливана в дни лета» (βλαστός — росток; θέρος — лето)."
  9: "ὡς πῦρ καὶ λίβανος ἐπὶ πυρείου — «как огонь и ладан на кадильнице» (λίβανος — ладан; πυρεῖον — жаровня, кадильница)."
  10: "ὡς σκεῦος χρυσίου ὁλοσφύρητον — «как сосуд золотой, цельно выкованный» (ὁλοσφύρητος — весь кованый, чеканный). κεκοσμημένον παντὶ λίθῳ πολυτελεῖ — «украшенный всяким драгоценным камнем» (πολυτελής — многоценный)."
  11: "ὡς ἐλαία ἀναθάλλουσα καρπούς — «как маслина, произращающая плоды» (ἐλαία — маслина; ἀναθάλλω — пускать побеги). ὡς κυπάρισσος ὑψουμένη ἐν νεφέλαις — «как кипарис, возвышающийся до облаков» (κυπάρισσος — кипарис; ὑψόω — возвышать). Слав. «яко маслина износящая плоды и яко кипарис возрастаяй до облак»."
  12: "ἐν τῷ ἀναλαμβάνειν αὐτὸν στολὴν δόξης — «когда он надевал одежду славы» (ἀναλαμβάνω — брать на себя, надевать; στολή — одеяние). ἐνδιδύσκεσθαι αὐτὸν συντέλειαν καυχήματος — «облачался в совершенство похвалы» (ἐνδύω — одевать; συντέλεια — полнота, совершенство; καύχημα — похвала). ἐν ἀναβάσει θυσιαστηρίου ἁγίου — «при восхождении к святому жертвеннику» (ἀνάβασις — восхождение). ἐδόξασεν περιβολὴν ἁγιάσματος — «он прославил (осветил) облачение святыни» (περιβολή — одеяние, облачение)."
  13: "ἐν δὲ τῷ δέχεσθαι μέλη ἐκ χειρῶν ἱερέων — «когда он принимал части из рук священников» (μέλη — члены, части жертвы; δέχομαι — принимать). ἑστὼς παρ᾿ ἐσχάρᾳ βωμοῦ — «стоя у очага жертвенника» (ἐσχάρα — очаг, жаровня; βωμός — жертвенник)."
  14: "κυκλόθεν αὐτοῦ στέφανος ἀδελφῶν — «вокруг него венец братьев» (στέφανος — венец). ὡς βλάστημα κέδρων ἐν τῷ Λιβάνῳ — «как отростки кедров на Ливане» (βλάστημα — произрастание, отпрыск; κέδρος — кедр). ἐκύκλωσαν αὐτὸν ὡς στελέχη φοινίκων — «окружили его, как стволы пальм» (στέλεχος — ствол; φοῖνιξ — пальма)."
  15: "πάντες οἱ υἱοὶ Ααρων ἐν δόξῃ αὐτῶν — «все сыны Аарона во славе своей». προσφορὰ κυρίου ἐν χερσὶν αὐτῶν — «приношение Господне в руках их» (προσφορά — приношение). ἔναντι πάσης ἐκκλησίας Ισραηλ — «пред всем собранием Израиля» (ἐκκλησία — собрание; ἔναντι — перед лицом)."
  16: "συντέλειαν λειτουργῶν ἐπὶ βωμῶν — «совершая полноту служения на жертвенниках» (λειτουργέω — священнослужить; βωμός — жертвенник). κοσμῆσαι προσφορὰν ὑψίστου παντοκράτορος — «чтобы украсить приношение Всевышнего Вседержителя» (κοσμέω — украшать; παντοκράτωρ — Вседержитель)."
  17: "ἐξέτεινεν ἐπὶ σπονδείου χεῖρα αὐτοῦ — «он простирал руку свою к чаше возлияния» (σπονδεῖον — чаша для возлияния; ἐκτείνω — простирать). ἔσπεισεν ἐξ αἵματος σταφυλῆς — «возливал из крови винограда» (σπένδω — совершать возлияние; σταφυλή — виноградная гроздь). ἐξέχεεν εἰς θεμέλια θυσιαστηρίου — «выливал к основанию жертвенника» (ἐκχέω — выливать; θεμέλια — основания). ὀσμὴν εὐωδίας ὑψίστῳ παμβασιλεῖ — «в благоухание Всевышнему Всецарю» (ὀσμὴ εὐωδίας — запах благоухания; παμβασιλεύς — всецарь)."
  18: "τότε ἀνέκραγον οἱ υἱοὶ Ααρων — «тогда возопили сыны Аарона» (ἀνακράζω — вскрикивать). ἐν σάλπιγξιν ἐλαταῖς ἤχησαν — «в трубы кованые затрубили» (σάλπιγξ — труба; ἔλατος — кованый, тянутый; ἠχέω — звучать). ἀκουστὴν ἐποίησαν φωνὴν μεγάλην — «сделали слышным голос великий» (ἀκουστός — слышимый). εἰς μνημόσυνον ἔναντι ὑψίστου — «в память пред Всевышним» (μνημόσυνον — памятование)."
  19: "πᾶς ὁ λαὸς κοινῇ κατέσπευσαν — «весь народ вместе устремился» (κοινῇ — сообща; κατασπεύδω — спешить, устремляться). ἔπεσαν ἐπὶ πρόσωπον ἐπὶ τὴν γῆν — «пали лицом на землю» (πρόσωπον — лицо). προσκυνῆσαι τῷ κυρίῳ αὐτῶν — «поклониться Господу своему» (προσκυνέω — поклоняться). παντοκράτορι θεῷ ὑψίστῳ — «Вседержителю Богу Всевышнему»."
  20: "ᾔνεσαν οἱ ψαλτῳδοὶ ἐν φωναῖς αὐτῶν — «восхвалили певцы голосами своими» (ψαλτῳδός — певец; φωνή — голос). ἐν πλείστῳ ἤχῳ ἐγλυκάνθη μέλος — «при величайшем звуке усладился напев» (ἦχος — звук; γλυκαίνω — услаждать; μέλος — напев). Слав. «в велицем гласе усладися пение»."
  21: "ἐδεήθη ὁ λαὸς κυρίου ὑψίστου ἐν προσευχῇ — «молился народ Господу Всевышнему в молитве» (δέομαι — просить, молиться; προσευχή — молитва). κατέναντι ἐλεήμονος — «пред Милостивым» (ἐλεήμων — милосердный). ἕως συντελεσθῇ κόσμος κυρίου — «доколе не совершится благолепие Господне» (κόσμος здесь — убранство, благолепие; слав. «красота»). τὴν λειτουργίαν αὐτοῦ ἐτελείωσαν — «службу Его совершили» (λειτουργία — служение; τελειόω — завершать)."
  22: "τότε καταβὰς ἐπῆρεν χεῖρας αὐτοῦ — «тогда, сойдя, он поднял руки свои» (καταβαίνω — сходить; ἐπαίρω — поднимать). ἐπὶ πᾶσαν ἐκκλησίαν υἱῶν Ισραηλ — «на всё собрание сынов Израиля». δοῦναι εὐλογίαν κυρίου ἐκ χειλέων αὐτοῦ — «чтобы дать благословение Господне из уст его» (χείλη — уста). ἐν ὀνόματι αὐτοῦ καυχῆσασθαι — «и именем Его похвалиться» (καυχάομαι — хвалиться, величать)."
  23: "ἐδευτέρωσαν ἐν προσκυνήσει — «они повторили поклонение» (δευτερόω — повторять, делать вторично; προσκύνησις — поклонение). ἐπιδέξασθαι τὴν εὐλογίαν παρὰ ὑψίστου — «чтобы принять благословение от Всевышнего» (ἐπιδέχομαι — принимать). Слав. «и повтори поклонение прияти благословение от вышняго»."
  24: "Καὶ νῦν εὐλογήσατε τὸν θεὸν πάντων — «и ныне благословите Бога всех». τὸν μεγάλα ποιοῦντα πάντῃ — «творящего великое повсюду» (πάντῃ — везде). τὸν ὑψοῦντα ἡμέρας ἡμῶν ἐκ μήτρας — «возвышающего дни наши от чрева» (ὑψόω — возвышать; μήτρα — чрево, утроба). ποιοῦντα μεθ᾿ ἡμῶν κατὰ τὸ ἔλεος αὐτοῦ — «поступающего с нами по милости Своей». С этого стиха — заключительное благословение автора, без кавычек."
  25: "δῴη ἡμῖν εὐφροσύνην καρδίας — «да даст нам веселие сердца» (δῴη — оптатив от δίδωμι; εὐφροσύνη — радость, веселие). γενέσθαι εἰρήνην ἐν ἡμέραις ἡμῶν ἐν Ισραηλ — «да будет мир во дни наши в Израиле». κατὰ τὰς ἡμέρας τοῦ αἰῶνος — «как во дни века» (αἰών — век): как в древние дни."
  26: "ἐμπιστεῦσαι μεθ᾿ ἡμῶν τὸ ἔλεος αὐτοῦ — «да утвердит с нами милость Свою» (ἐμπιστεύω — вверять, утверждать). ἐν ταῖς ἡμέραις ἡμῶν λυτρωσάσθω ἡμᾶς — «во дни наши да избавит нас» (λυτρόω — выкупать, избавлять; императив 3-го лица)."
  27: "Ἐν δυσὶν ἔθνεσιν προσώχθισεν ἡ ψυχή μου — «двумя народами вознегодовала душа моя» (προσοχθίζω — гневаться, досадовать; ἔθνος — народ). τὸ τρίτον οὐκ ἔστιν ἔθνος — «третий не есть народ». С этого стиха идёт личное слово автора от первого лица, но это не прямая речь, кавычек нет."
  28: "οἱ καθήμενοι ἐν ὄρει Σαμαρείας — «сидящие на горе Самарии» (κάθημαι — сидеть, жить; ὄρος — гора): самаряне. Φυλιστιιμ — филистимляне (в тексте ペリシテ人, как в 1 Цар). ὁ λαὸς ὁ μωρὸς ὁ κατοικῶν ἐν Σικιμοις — «народ глупый, живущий в Сикимах» (μωρός — глупый; κατοικέω — населять). Слав. «людие буи живущии в сикимех»."
  29: "Παιδείαν συνέσεως καὶ ἐπιστήμης — «наставление разумения и знания» (παιδεία — наставление, учение; σύνεσις — разумение; ἐπιστήμη — знание). ἐχάραξεν ἐν τῷ βιβλίῳ τούτῳ — «начертал в книге сей» (χαράσσω — вырезать, начертывать). Ἰησοῦς υἱὸς Σιραχ Ελεαζαρ ὁ Ιεροσολυμίτης — «Иисус, сын Сираха, Елеазара, иерусалимлянин»: Ελεαζαρ — имя отца, отсюда エレアザルの子. ἀνώμβρησεν σοφίαν ἀπὸ καρδίας αὐτοῦ — «пролил, как дождь, премудрость от сердца своего» (ἀνομβρέω — изливать дождём)."
  30: "μακάριος ὃς ἐν τούτοις ἀναστραφήσεται — «блажен, кто будет обращаться в этом» (ἀναστρέφομαι — вести себя, жить; ἐν τούτοις — в этих [наставлениях]). θεὶς αὐτὰ ἐπὶ καρδίαν αὐτοῦ σοφισθήσεται — «положивший их на сердце своё умудрится» (τίθημι — класть; σοφίζω — делать мудрым)."
  31: "ἐὰν γὰρ αὐτὰ ποιήσῃ, πρὸς πάντα ἰσχύσει — «ибо если он сделает это, ко всему будет крепок» (ἰσχύω — быть сильным, мочь). ὅτι φῶς κυρίου τὸ ἴχνος αὐτοῦ — «ибо свет Господень — след его» (ἴχνος — след, стезя). Слав. «яко свет Господень след его»."
