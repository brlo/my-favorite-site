verses:
  1: "サムエルは死[し]んだ。イスラエルはすべて集[あつ]まって彼[かれ]のために泣[な]き、彼をアルマタイムにある自分[じぶん]の家[いえ]に葬[ほうむ]った。ダビデは立[た]って、マオンの荒野[こうや]へ下[くだ]った。"
  2: "マオンに一人[ひとり]の男[おとこ]がいた。その羊[ひつじ]の群[む]れはカルメルにあり、その人[ひと]は非常[ひじょう]に豊[ゆた]かな者[もの]であった。彼[かれ]には羊[ひつじ]が三千匹[さんぜんびき]、山羊[やぎ]が千匹[せんびき]いた。彼がカルメルで自分の群れの毛[け]を刈[か]ったときのことである。"
  3: "その人[ひと]の名[な]はナバル、妻[つま]の名はアビガイルであった。妻は賢[かしこ]く、見[み]た目[め]も非常[ひじょう]に美[うつく]しかった。しかし、その人は頑[かた]くらで、行状[ぎょうじょう]が悪[わる]く、犬[いぬ]のような男[おとこ]であった。"
  4: "ダビデは荒野[こうや]で、ナバルがカルメルで自分の群[む]れの毛[け]を刈[か]っていることを聞[き]いた。"
  5: "ダビデは十人[じゅうにん]の若者[わかもの]を遣[つか]わし、その若者たちに言[い]った。「カルメルへ上[のぼ]り、ナバルのところへ行[い]って、わたしの名[な]によって彼[かれ]に平安[へいあん]を告[つ]げ、"
  6: "そしてこう言[い]いなさい。『良[よ]い時[とき]に。あなたも、あなたの家[いえ]も、あなたのすべてのものが無事[ぶじ]であるように。"
  7: "今[いま]、わたしは、あなたが毛[け]を刈[か]っていると聞[き]いた。あなたの羊飼[ひつじか]いたちは荒野[こうや]でわたしたちとともにいたが、わたしたちは彼[かれ]らを妨[さまた]げず、彼らがカルメルにいたすべての日[ひ]、何[なに]ひとつ彼らに求[もと]めなかった。"
  8: "若者[わかもの]たちに聞[き]いてみなさい。彼[かれ]らがあなたに話[はな]すだろう。どうか、若者たちがあなたの目[め]に恵[めぐ]みを見[み]いだすように。わたしたちは良[よ]い日[ひ]に来[き]たのだから。どうか、あなたの手[て]が見つけたものを、あなたの子[こ]ダビデに与[あた]えてほしい。』」"
  9: "ダビデの若者[わかもの]たちは来[き]て、ダビデの名[な]によってこれらの言葉[ことば]をすべてナバルに話[はな]した。すると、彼[かれ]は跳[と]び上[あ]がった。"
  10: "ナバルは答[こた]えてダビデの若者[わかもの]たちに言[い]った。「ダビデとは何者[なにもの]か。エッサイの子[こ]とは何者か。近頃[ちかごろ]は、主人[しゅじん]の顔[かお]から逃[に]げ出[だ]す奴隷[どれい]が多[おお]くなっている。"
  11: "わたしのパンと、わたしのぶどう酒[しゅ]と、わたしが毛[け]を刈[か]る者[もの]たちのために屠[ほふ]った犠牲[ぎせい]を取[と]って、どこから来[き]たかも知[し]らない人々[ひとびと]に与[あた]えるのか。」"
  12: "ダビデの若者[わかもの]たちは自分[じぶん]の道[みち]へ引[ひ]き返[かえ]し、戻[もど]って来[き]て、これらの言葉[ことば]をすべて彼[かれ]に告[つ]げた。"
  13: "ダビデは部下[ぶか]たちに言[い]った。「それぞれ剣[つるぎ]を帯[お]びよ。」彼[かれ]らはそれぞれ剣を帯び、ダビデの後[あと]に上[のぼ]った。四百人[よんひゃくにん]であった。二百人[にひゃくにん]は器[うつわ]のところにとどまった。"
  14: "ナバルの妻[つま]アビガイルに、若者[わかもの]の一人[ひとり]が告[つ]げて言[い]った。「見[み]よ、ダビデは荒野[こうや]から使者[ししゃ]を遣[つか]わして、わたしたちの主人[しゅじん]を祝福[しゅくふく]しようとしたが、彼[かれ]はその者[もの]たちから顔[かお]を背[そむ]けた。"
  15: "あの人々[ひとびと]はわたしたちに非常[ひじょう]に良[よ]くしてくれた。わたしたちが彼[かれ]らのそばにいたすべての日[ひ]、彼らはわたしたちを妨[さまた]げず、何[なに]ひとつ求めなかった。わたしたちが野[の]にいたとき、"
  16: "彼[かれ]らは、わたしたちが彼らのそばにいて群[む]れを飼[か]っていたすべての日[ひ]、昼[ひる]も夜[よる]も、わたしたちの周[まわ]りの壁[かべ]であった。"
  17: "そして今[いま]、あなたが何[なに]をするかを知[し]って、見[み]なさい。わたしたちの主人[しゅじん]とその家[いえ]に災[わざわ]いが定[さだ]まってしまったからだ。彼[かれ]は不法[ふほう]な者[もの]で、話[はな]しかけることもできない。」"
  18: "アビガイルは急[いそ]いで、パン二百個[にひゃくこ]、ぶどう酒[しゅ]の入[はい]った器[うつわ]二[ふた]つ、調理[ちょうり]した羊[ひつじ]五匹[ごひき]、麦粉[むぎこ]五[いつ]つ分[ぶん]、干[ほ]しぶどう一[ひと]塊[かたまり]、いちじくの菓子[かし]二百束[にひゃくたば]を取[と]り、それらをろばの上[うえ]に載[の]せた。"
  19: "彼女[かのじょ]は若者[わかもの]たちに言[い]った。「わたしの前[まえ]を行[い]きなさい。見[み]よ、わたしはあなたがたの後[あと]から行く。」しかし、夫[おっと]には告[つ]げなかった。"
  20: "彼女[かのじょ]がろばに乗[の]って、山[やま]の陰[かげ]を下[くだ]って行[い]くと、見[み]よ、ダビデとその部下[ぶか]たちが彼女に会[あ]おうとして下って来[き]た。彼女は彼[かれ]らに会った。"
  21: "ダビデは言[い]った。「なるほど、わたしは荒野[こうや]でこの人[ひと]のすべてのものを見張[みは]っていたが、むだであった。彼[かれ]のすべてのもののうち、何[なに]ひとつ取[と]られなかった。それなのに、彼は善[ぜん]に悪[あく]を返[かえ]した。"
  22: "神[かみ]がダビデにそうし、その上[うえ]にさらに加[くわ]えられるように。もし、朝[あさ]までに、ナバルに属[ぞく]する者[もの]のうち、壁[かべ]に向[む]かって小水[しょうすい]をする者さえ残[のこ]すなら。」"
  23: "アビガイルはダビデを見[み]て、急[いそ]いでろばから飛[と]び降[お]り、ダビデの前[まえ]に顔[かお]を伏[ふ]せて地[ち]にひれ伏し、"
  24: "ダビデの足[あし]もとで言[い]った。「わが主人[しゅじん]よ、この咎[とが]はわたしにある。どうか、はしためがあなたの耳[みみ]に語[かた]ることをお許[ゆる]しください。はしための言葉[ことば]を聞[き]いてください。"
  25: "わが主人[しゅじん]よ、どうか、この不法[ふほう]な者[もの]に心[こころ]を向[む]けないでください。名[な]のとおり、彼[かれ]はそのとおりの者だ。ナバルがその名で、愚[おろ]かさは彼とともにある。このはしためは、あなたが遣[つか]わした若者[わかもの]たちを見[み]なかった。"
  26: "そして今[いま]、わが主人[しゅじん]よ、主[しゅ]は生[い]きておられ、あなたの魂[たましい]も生きている。主があなたを、無実[むじつ]の血[ち]に来[く]ることから、あなたの手[て]をあなたのために救[すく]うことから、とどめてくださった。そして今、あなたの敵[てき]も、わが主人に災[わざわ]いを求[もと]める者[もの]たちも、ナバルのようになるように。"
  27: "そして今[いま]、この祝福[しゅくふく]を取[と]ってください。はしためがわが主人[しゅじん]に持[も]って来[き]たものだ。わが主人に仕[つか]える若者[わかもの]たちに与[あた]えてください。"
  28: "どうか、はしための咎[とが]をお赦[ゆる]しください。主[しゅ]は必[かなら]ずわが主人[しゅじん]のために堅[かた]い家[いえ]を建[た]ててくださる。わが主人は主の戦[いくさ]を戦[たたか]っておられるからだ。あなたの中[なか]に悪[あく]は決[けっ]して見[み]つからない。"
  29: "たとえ人[ひと]があなたを追[お]い、あなたの魂[たましい]を求[もと]めて立[た]ち上[あ]がっても、わが主人[しゅじん]の魂は、あなたの神[かみ]である主[しゅ]のもとで、命[いのち]の結[むす]び目[め]に結ばれている。あなたの敵[てき]の魂は、石投[いしな]げの真[ま]ん中[なか]に投[な]げ入[い]れられる。"
  30: "そして、主[しゅ]がわが主人[しゅじん]について語[かた]られたすべつの善[ぜん]をわが主人に成[な]し遂[と]げ、あなたをイスラエルの上[うえ]の司[つかさ]とされるなら、"
  31: "わが主人[しゅじん]にとって、無実[むじつ]の血[ち]をむだに流[なが]し、自分の手[て]を自分のために救[すく]うことは、忌[い]まわしいことにも、つまずきにもならないだろう。主[しゅ]はわが主人に良[よ]くしてくださり、あなたははしためを思[おも]い起[お]こして、良くしてくださるだろう。」"
  32: "ダビデはアビガイルに言[い]った。「イスラエルの神[かみ]、主[しゅ]はほめたたえられるように。主は今日[きょう]、あなたをわたしに会[あ]わせるために遣[つか]わされた。"
  33: "あなたの分別[ふんべつ]もほめたたえられるように。あなたもほめたたえられるように。あなたは今日[きょう]、わたしが血[ち]を流[なが]しに行[い]くのをとどめ、わたしの手[て]をわたしのために救[すく]った。"
  34: "しかし、イスラエルの神[かみ]である主[しゅ]は生[い]きておられる。主は今日[きょう]、わたしがあなたに害[がい]を加[くわ]えるのをとどめてくださった。もし、あなたが急[いそ]いでわたしに会[あ]いに来[こ]なかったなら、朝[あさ]の光[ひかり]までに、わたしはナバルに、壁[かべ]に向[む]かって小水[しょうすい]をする者[もの]さえ残[のこ]さなかっただろう。」"
  35: "ダビデは彼女[かのじょ]の手[て]から、彼女が持[も]って来[き]たすべてのものを受[う]け取[と]り、彼女に言[い]った。「平安[へいあん]のうちに、あなたの家[いえ]へ上[のぼ]りなさい。見[み]よ、わたしはあなたの声[こえ]を聞[き]き、あなたの顔[かお]を尊[とうと]んだ。」"
  36: "アビガイルはナバルのところへ来[き]た。見[み]よ、彼[かれ]の家[いえ]には、王[おう]の宴会[えんかい]のような宴会があった。ナバルの心[こころ]は楽[たの]しくなり、彼はひどく酔[よ]っていた。それで彼女[かのじょ]は、朝[あさ]の光[ひかり]まで、大[おお]きなことでも小[ちい]さなことでも彼に告[つ]げなかった。"
  37: "朝[あさ]になって、ナバルがぶどう酒[しゅ]から醒[さ]めると、妻[つま]はこれらの言葉[ことば]を彼[かれ]に告[つ]げた。すると彼の心[こころ]は彼の中[なか]で死[し]に、彼は石[いし]のようになった。"
  38: "それからおよそ十日のち、主[しゅ]はナバルを打[う]ち、彼[かれ]は死[し]んだ。"
  39: "ダビデはこれを聞[き]いて言[い]った。「主[しゅ]はほめたたえられるように。主はナバルの手[て]から、わたしのそしりの裁[さば]きを裁き、しもべを悪[わる]い者[もの]たちの手から守[まも]ってくださった。主はナバルの悪[あく]を彼[かれ]の頭[あたま]に返[かえ]された。」ダビデは人[ひと]を遣[つか]わし、アビガイルと話[はな]して、彼女[かのじょ]を自分[じぶん]の妻[つま]に迎[むか]えようとした。"
  40: "ダビデのしもべたちはカルメルにいるアビガイルのところへ来[き]て、彼女[かのじょ]に言[い]った。「ダビデはあなたを自分[じぶん]の妻[つま]に迎[むか]えるために、わたしたちを遣[つか]わした。」"
  41: "彼女[かのじょ]は立[た]って、地[ち]にひれ伏[ふ]し、顔[かお]を伏せて言[い]った。「見[み]よ、はしためは、あなたの若者[わかもの]たちの足[あし]を洗[あら]うための女[おんな]奴隷[どれい]である。」"
  42: "アビガイルは立[た]って、ろばに乗[の]った。五人[ごにん]の侍女[じじょ]が彼女[かのじょ]の後[あと]に従[したが]った。彼女はダビデの使者[ししゃ]たちの後を追[お]って行[い]き、彼[かれ]の妻[つま]になった。"
  43: "ダビデはイズレエルからアヒノアムを迎[むか]え、二人[ふたり]とも彼[かれ]の妻[つま]になった。"
  44: "サウルは自分[じぶん]の娘[むすめ]、ダビデの妻[つま]ミカルを、ロマ出身[しゅっしん]のライスの子[こ]ファルティに与[あた]えた。"
notes:
  1: "συναθροίζονται — собираются (praesens historicum), πᾶς Ισραηλ — весь Израиль. κόπτονται — оплакивают (κόπτομαι). ἐν οἴκῳ αὐτοῦ ἐν Αρμαθαιμ — «в доме его в Армафеме» (в ru «в Раме» — иное отождествление). εἰς τὴν ἔρημον Μααν — «в пустыню Маон» (в ru «Фаран» — по МТ)."
  2: "ἦν ἄνθρωπος ἐν τῇ Μααν — был человек в Маоне. τὰ ποίμνια αὐτοῦ ἐν τῷ Καρμήλῳ — стада его на Кармиле (Кармил здесь — не гора, а местность в Иудее). μέγας σφόδρα — «весьма велик», т. е. богат, поэтому 豊かな者 (в ru «очень богатый»). ποίμνια τρισχίλια καὶ αἶγες χίλιαι — 3000 овец и 1000 коз. ἐν τῷ κείρειν — «при стрижке» (κείρω)."
  3: "ἀγαθὴ συνέσει — «хороша разумом» (σύνεσις — понимание; слав. «блага смыслом»). καλὴ τῷ εἴδει σφόδρα — «красива видом весьма». σκληρὸς καὶ πονηρὸς ἐν ἐπιτηδεύμασιν — «жёсткий и злой в занятиях» (ἐπιτήδευμα — занятие, нрав). ὁ ἄνθρωπος κυνικός — «человек пёс»: LXX так передал евр. «калеви» («из рода Халева», так в ru), поняв слово как «пёс»; в тексте сохранено 犬のような男, в notes оговорено."
  4: "ὁ Καρμήλιος — «кармилитянин» (так в 25:5, 10). κείρει τὸ ποίμνιον — стрижёт стадо."
  5: "παιδάρια — отроки, слуги (в тексте 若者たち, как в гл. 25 постоянно). ἐρωτήσατε αὐτὸν ἐπὶ τῷ ὀνόματί μου εἰς εἰρήνην — «спросите его именем моим о мире», т. е. приветствуйте, объявите мир от моего имени (слав. «вопросите его именем моим с миром»), отсюда 平安を告げ. Стих обрывается на «и объявите», продолжение — ст. 6."
  6: "Εἰς ὥρας — приветственная формула «в добрый час» (εἰς ὥρας, букв. «на часы»); слав. «здрав ли еси», ru «мир тебе». ὑγιαίνοντα — «здоровые, здравствующие» (ὑγιαίνω). Приветствие — вложенная речь 『…』, так как это слова, которые велят передать."
  7: "ἀκήκοα — услышал (перфект ἀκούω). οἱ ποιμένες σου — пастухи твои. οὐκ ἀπεκωλύσαμεν — не препятствовали (ἀποκωλύω). οὐκ ἐνετειλάμεθα αὐτοῖς οὐθέν — «ничего им не заповедали», т. е. ничего не требовали (ἐντέλλομαι)."
  8: "χάριν ἐν ὀφθαλμοῖς σου — «благодать (благоволение) в глазах твоих». ἐφ᾽ ἡμέραν ἀγαθήν — «в добрый день» (праздничный; слав. «в день благ»). ὃ ἐὰν εὕρῃ ἡ χείρ σου — «что найдёт рука твоя». τῷ υἱῷ σου τῷ Δαυιδ — «сыну твоему Давиду»: Давид называет себя так из вежливости; в тексте сохранено あなたの子ダビデ."
  9: "κατὰ πάντα τὰ ῥήματα ταῦτα — «по всем этим словам». ἐν τῷ ὀνόματι Δαυιδ — именем Давида. ἀνεπήδησεν — «вскочил» (ἀναπηδάω): в gr этот глагол стоит в конце ст. 9, в csl отнесён к ст. 10; в тексте оставлен при ст. 9, ответ Навала начинается в ст. 10."
  10: "Τίς ὁ Δαυιδ καὶ τίς ὁ υἱὸς Ιεσσαι — «кто Давид и кто сын Иессея». πεπληθυμμένοι εἰσίν — «умножились» (πληθύνω, перфект). οἱ δοῦλοι ἀναχωροῦντες ἕκαστος ἐκ προσώπου τοῦ κυρίου αὐτοῦ — «рабы, уходящие каждый от лица господина своего», т. е. беглые рабы (ругательство)."
  11: "θύματά μου — «закланное моё» (θῦμα). ἃ τέθυκα τοῖς κείρουσίν μου — «что я заклал для стригущих моих» (θύω, перфект). В csl «вино», в ru «воду» — по МТ; в gr οἶνόν μου, поэтому ぶどう酒."
  12: "ἀπεστράφησαν εἰς ὁδὸν αὐτῶν — «повернули на путь свой» (ἀποστρέφω). ἀνήγγειλαν — возвестили (ἀναγγέλλω)."
  13: "Ζώσασθε — опояшьтесь (ζώννυμι). ὡς τετρακόσιοι ἄνδρες — около 400 мужей. οἱ διακόσιοι ἐκάθισαν μετὰ τῶν σκευῶν — «двести остались при сосудах», т. е. при обозе (σκεῦος — 器). В csl добавлено «и сам Давид препоясася мечем своим» — в gr этого нет."
  14: "εὐλογῆσαι — «благословить», здесь в смысле приветствовать (εὐλογέω). ἐξέκλινεν ἀπ᾽ αὐτῶν — «уклонился от них», т. е. обошёлся грубо (ἐκκλίνω; слав. «отвратися»)."
  15: "ἀγαθοὶ ἡμῖν σφόδρα — «очень добры к нам». ἐνετείλαντο — заповедали (ἐντέλλομαι). В gr стих обрывается на «и когда мы были в поле» (продолжение — ст. 16), в csl эта часть отнесена к ст. 16."
  16: "ὡς τεῖχος ἦσαν περὶ ἡμᾶς — «как стена были вокруг нас». ποιμαίνοντες τὸ ποίμνιον — пася стадо (ποιμαίνω)."
  17: "συντετέλεσται ἡ κακία — «совершилась злоба» (συντελέω, перфект), т. е. беда уже решена и неминуема: 災いが定まってしまった. υἱὸς λοιμός — «сын негодный, погибельный» (λοιμός; слав. «сын губитель»). οὐκ ἔστιν λαλῆσαι πρὸς αὐτόν — «нет возможности говорить с ним»."
  18: "ἄρτοι διακόσιοι — 200 хлебов. ἀγγεῖα οἴνου — сосуды вина. πρόβατα πεποιημένα — «овцы приготовленные», т. е. заколотые. οἰφι ἀλφίτου — мера муки (οἶφι — евр. ефа; слав. «пять мер муки чистыя»). γομορ ἓν σταφίδος — один гомор изюма (γόμορ — мера объёма; σταφίς — кисть, изюм). παλάθαι — связки сушёных смокв (слав. «вязаницы смоквей»). В ru «сто связок изюму» — иное число, в gr двести παλάθαι."
  19: "προπορεύεσθε — идите впереди (προπορεύομαι). ὀπίσω ὑμῶν παραγίνομαι — «за вами прихожу» (παραγίνομαι). τῷ ἀνδρὶ αὐτῆς οὐκ ἀπήγγειλεν — мужу своему не возвестила."
  20: "ἐπιβεβηκυίης ἐπὶ τὴν ὄνον — «когда она села на осла» (ἐπιβαίνω). ἐν σκέπῃ τοῦ ὄρους — «под прикрытием горы» (σκέπη — кров, сень; ru «по извилинам горы»). εἰς συνάντησιν — навстречу. ἀπήντησεν αὐτοῖς — встретила их."
  21: "Ἴσως εἰς ἄδικον — «пожалуй, напрасно» (ἴσως — «может быть», εἰς ἄδικον — «без причины»); в ru «да, напрасно». πεφύλακα — сохранил (φυλάσσω, перфект). ἀνταπέδωκέν μοι πονηρὰ ἀντὶ ἀγαθῶν — воздал мне злое за доброе."
  22: "τάδε ποιήσαι ὁ θεὸς τῷ Δαυιδ καὶ τάδε προσθείη — клятвенная формула «то и то пусть сделает Бог Давиду и ещё прибавит» (προστίθημι; слав. «сия да сотворит… и сия да приложит»). οὐρῶν πρὸς τοῖχον — «мочащийся к стене», идиома: всякий мужчина (слав. «даже до мочащагося к стене»); в тексте сохранён порядок греческого: клятва, затем условие."
  23: "κατεπήδησεν ἀπὸ τῆς ὄνου — соскочила с осла (καταπηδάω). ἔπεσεν ἐπὶ πρόσωπον αὐτῆς — пала лицом своим. προσεκύνησεν ἐπὶ τὴν γῆν — поклонилась до земли. Стих обрывается на «и поклонилась», продолжение — ст. 24."
  24: "Ἐν ἐμοί, κύριέ μου, ἡ ἀδικία — «на мне, господин мой, неправда» (ἀδικία). ἐπὶ τοὺς πόδας αὐτοῦ — «у ног его»: в гр это продолжение позы ст. 23, поэтому без повтора ひれ伏して. λαλησάτω δὴ ἡ δούλη σου εἰς τὰ ὦτά σου — «пусть говорит раба твоя в уши твои». ἄκουσον τῆς δούλης σου λόγον — послушай слово рабы твоей."
  25: "μὴ θέσθω ὁ κύριός μου καρδίαν — «да не положит господин мой сердца». κατὰ τὸ ὄνομα αὐτοῦ οὕτως ἐστίν — «по имени его таков и он» (игра слов: נָבָל — «глупый», ср. 25:3). ἀφροσύνη μετ᾽ αὐτοῦ — «безумие с ним». οὐκ εἶδον τὰ παιδάρια — не видела отроков."
  26: "ζῇ κύριος καὶ ζῇ ἡ ψυχή σου — «жив Господь и жива душа твоя» (клятвенная формула). ἐκώλυσέν σε κύριος τοῦ μὴ ἐλθεῖν εἰς αἷμα ἀθῷον — «воспретил тебе Господь прийти на кровь невинную» (κωλύω). σῴζειν τὴν χεῖρά σού σοι — «спасти руку твою тебе», т. е. удержать от мщения (слав. «спасти тебе руку твою»); в тексте передано буквально. γένοιντο ὡς Ναβαλ οἱ ἐχθροί σου — «да будут как Навал враги твои»."
  27: "εὐλογία — благословение, здесь дар, приношение (слав. «благословение»). ἐνήνοχεν — принесла (перфект φέρω). τοῖς παρεστηκόσιν — предстоящим, т. е. служащим при господине."
  28: "ἆρον — «подними, сними» (αἴρω), т. е. прости. ἀνόμημα — беззаконие, вина. ποιῶν ποιήσει — «делая сделает», усилительная конструкция: непременно устроит. οἶκος πιστός — «дом верный», т. е. прочный. πόλεμον κυρίου ὁ κύριός μου πολεμεῖ — «войны Господни ведёт господин мой» (πολεμέω). πώποτε — «когда-либо»."
  29: "ἐνδεδεμένη ἐν δεσμῷ τῆς ζωῆς — «связанная в узел жизни» (δεσμός; слав. «соузом жизни»). σφενδονήσεις — «бросишь пращой» (σφενδονάω), 2-е лицо ед. ч., хотя по смыслу подлежащее — Бог. ἐν μέσῳ τῆς σφενδόνης — «посреди пращи» (σφενδόνη — 石投げ): тёмное место, слав. «поразиши пращею посреде пращи», в ru «бросит Он как бы пращею»; в тексте — 石投げの真ん中に投げ入れられる, буквально по гр. с учётом контекста."
  30: "ὅσα ἐλάλησεν ἀγαθά — «всё доброе, что сказал». εἰς ἡγούμενον — «в вождя» (ἡγούμενος). ἐντελεῖταί σοι — «заповедает тебе» (ἐντέλλομαι)."
  31: "βδελυγμός — мерзость, отвращение. σκάνδαλον — соблазн, преткновение. δωρεάν — «даром, напрасно» (слав. «туне»). σῶσαι χεῖρα κυρίου μου αὐτῷ — «спасти руку господина моего ему», ср. ст. 26. ἀγαθώσει — облагодетельствует (ἀγαθόω). μνησθήσῃ — вспомнишь (μιμνῄσκομαι)."
  32: "Εὐλογητὸς κύριος ὁ θεὸς Ισραηλ — «благословен Господь Бог Израилев» (в корпусе ほめたたえられるように). ὃς ἀπέστειλέν σε σήμερον ἐν ταύτῃ — «который послал тебя сегодня, в этот [день]». εἰς ἀπάντησίν μου — «на встречу мне»."
  33: "ὁ τρόπος σου — «образ твой, поведение» (τρόπος; слав. «совет»). ἡ ἀποκωλύσασά με — «удержавшая меня» (ἀποκωλύω). εἰς αἵματα — «на крови» (мн. ч., как в гр.). σῶσαι χεῖρά μου ἐμοί — «спасти руку мою мне»."
  34: "πλὴν ὅτι ζῇ κύριος — «впрочем, жив Господь» (клятва с ограничением). ὃς ἀπεκώλυσέν με τοῦ κακοποιῆσαί σε — «который воспретил мне сделать тебе зло». εἰ μὴ ἔσπευσας — «если бы ты не поспешила» (contrary to fact). οὐρῶν πρὸς τοῖχον — см. ст. 22."
  35: "Ἀνάβηθι εἰς εἰρήνην — «взойди с миром». ᾑρέτισα τὸ πρόσωπόν σου — «почтил лицо твоё», т. е. оказал уважение (αἱρετίζω; слав. «приях лице твое»)."
  36: "πότος ὡς πότος βασιλέως — «пир, как пир царский» (πότος). ἡ καρδία Ναβαλ ἀγαθὴ ἐπ᾽ αὐτόν — «сердце Навала весело на нём» (ἀγαθός). μεθύων ἕως σφόδρα — «пьян до крайности» (μεθύω). ῥῆμα μικρὸν ἢ μέγα — «слово малое или великое», т. е. ни слова."
  37: "ἐξένηψεν ἀπὸ τοῦ οἴνου — «отрезвел от вина» (ἐκνήφω). ἐναπέθανεν ἡ καρδία αὐτοῦ ἐν αὐτῷ — «умерло сердце его в нём» (ἐναποθνῄσκω; слав. «умре сердце его в нем»). γίνεται ὡς λίθος — «стал как камень» (оцепенение, удар)."
  38: "ὡσεὶ δέκα ἡμέραι — «около десяти дней». ἐπάταξεν κύριος τὸν Ναβαλ — «поразил Господь Навала» (πατάσσω)."
  39: "ἔκρινεν τὴν κρίσιν τοῦ ὀνειδισμοῦ μου — «рассудил тяжбу посрамления моего» (ὀνειδισμός — поношение). περιεποιήσατο — сохранил, оградил (περιποιέω). ἀπέστρεψεν εἰς κεφαλὴν αὐτοῦ — «обратил на голову его». ἐλάλησεν περὶ Αβιγαιας λαβεῖν αὐτὴν ἑαυτῷ — «говорил об Авигаиле, чтобы взять её себе»."
  40: "οἱ παῖδες Δαυιδ — слуги Давида (в 25:5, 9, 12, 14, 19, 41 — παιδάρια, отроки; в тексте те же 若者たち в речах и しもべ здесь, где говорит автор). εἰς γυναῖκα — «в жену»."
  41: "ἀνέστη καὶ προσεκύνησεν ἐπὶ τὴν γῆν ἐπὶ πρόσωπον — встала и поклонилась до земли лицом. εἰς παιδίσκην — «в служанку» (παιδίσκη). νίψαι πόδας τῶν παίδων σου — омыть ноги слуг твоих (νίπτω). В ru добавлено «господина моего» — в gr только «слуг твоих»."
  42: "ἐπέβη ἐπὶ τὴν ὄνον — села на осла. πέντε κοράσια — пять девиц (κοράσιον). ἠκολούθουν — следовали. ἐπορεύθη ὀπίσω τῶν παίδων — пошла вслед слуг. γίνεται αὐτῷ εἰς γυναῖκα — стала ему женою."
  43: "Αχινααμ ἐξ Ιεζραελ — Ахиноам из Изрееля (в 27:3 и 30:5 — イズレエル人, изреелитянка). ἀμφότεραι ἦσαν αὐτῷ γυναῖκες — обе были ему жёнами."
  44: "Σαουλ ἔδωκεν Μελχολ — Саул отдал Мелхолу (Μελχολ). Φαλτι υἱῷ Λαις — Фалтию, сыну Лаиса (в csl «фалтию сыну амисову» — иное чтение). τῷ ἐκ Ρομμα — «из Роммы» (в ru «из Галлима» — по МТ). τὴν γυναῖκα Δαυιδ — жену Давида: Мелхола была отдана Давиду (18:27)."
