# jp-box, 1-я Царств, глава 25. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет,
# jp-ni (под авторским правом) не использовался.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 25: смерть Самуила (1); Навал и Авигаила (2–3); посольство Давида и
# грубый ответ Навала (4–13); рассказ слуги и речь Авигаилы (14–31); ответ Давида
# и примирение (32–35); пир, смерть Навала (36–38); Давид берёт Авигаилу в жёны,
# Ахиноам и Мелхола (39–44).
# Речь персонажей — 「…」 (5–8, 10–11, 14–17, 19, 21–22, 24–31, 32–34, 35, 39,
# 40, 41); вложенная речь — 『…』 (6–8 — приветствие, которое велят передать).
# Непрерывная речь 5–8 (послание Давида), 10–11 (Навал), 14–17 (слуга),
# 21–22 (клятва Давида), 24–31 (Авигаила), 32–34 (Давид) не закрывается на
# границах стихов, как в греческом; стих 23 обрывается на «и поклонилась».
# Красного нет.
# Нумерация по gr: 44 стиха, совпадает с csl/ru; «вскочил» (ἀνεπήδησεν) в gr
# стоит в конце ст. 9, в csl отнесено к ст. 10.
# 〔…〕 нет: в gr-lxx-byz на месте каждого стиха есть текст, знака «.» нет;
# добавлений церковного чтения в текст не вносилось (слав. вставки — в notes).
# Сносок ⟨…⟩ нет: 器, 荒野, 恵み, 嗣業, 裁き, 油を注がれた者 уже в корпусе;
# ナバル, アビガイル, カルメル — имена и топонимы, они в сносках не нуждаются.
# jp-ni не использовался.

