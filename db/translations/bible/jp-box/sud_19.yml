verses:
  1: "そのころ、イスラエルには王がなかった。エフライムの山[やま]のふもとに、一人[ひとり]のレビ人[びと]が寄留[きりゅう]していた。彼[かれ]は自分[じぶん]のために、ベツレヘム・ユダから一人の女[おんな]をめとって側女[そばめ]とした。"
  2: "しかし、その側女[そばめ]は彼[かれ]に怒[おこ]って、彼のもとを去[さ]り、ベツレヘム・ユダにある自分[じぶん]の父[ちち]の家[いえ]へ帰[かえ]って、そこに四[よっ]か月[げつ]の間[あいだ]いた。"
  3: "彼女[かのじょ]の夫[おっと]は立[た]ち上[あ]がり、彼女の心[こころ]に語[かた]りかけて、自分[じぶん]と和解[わかい]させて連[つ]れ戻[もど]そうとして、彼女の後[あと]を追[お]って行[い]った。彼[かれ]の従者[じゅうしゃ]と二頭[にとう]のろばが彼とともにいた。彼は彼女の父[ちち]の家[いえ]まで行った。娘[むすめ]の父は彼を見[み]て、喜[よろこ]んで迎[むか]えに出[で]た。"
  4: "娘[むすめ]の父[ちち]であるしゅうとが彼[かれ]を家[いえ]に招[まね]き入[い]れ、彼は三日[みっか]の間[あいだ]、彼とともにそこにいた。彼らは食[た]べ、飲[の]み、そこに泊[と]まった。"
  5: "四日目[よっかめ]の朝[あさ]、彼[かれ]らは早[はや]く起[お]き、彼は立[た]って出[で]かけた。娘[むすめ]の父[ちち]は婿[むこ]に言[い]った。「パンのかけらで心[こころ]を強[つよ]くしなさい。それから出かけるがよい。」"
  6: "彼[かれ]らは二人[ふたり]とも座[すわ]って、ともに食[た]べ、飲[の]んだ。娘[むすめ]の父[ちち]はその男[おとこ]に言[い]った。「どうか、今夜[こんや]も泊[と]まって、心[こころ]を楽[たの]しませなさい。」"
  7: "その男[おとこ]は立[た]って出[で]かけた。しかし、しゅうとが彼[かれ]を引[ひ]き止[と]めたので、彼はまたそこに泊[と]まった。"
  8: "五日目[いつかめ]の朝[あさ]、彼[かれ]は早[はや]く起[お]きて出[で]かけた。娘[むすめ]の父[ちち]は言[い]った。「どうか、パンを食[た]べて心[こころ]を強[つよ]くし、日[ひ]が傾[かたむ]くまで待[ま]ちなさい。」そこで二人[ふたり]は食べ、飲[の]んだ。"
  9: "そこでその男[おとこ]は、自分[じぶん]と側女[そばめ]と従者[じゅうしゃ]とともに立[た]って出[で]かけた。しゅうとである娘[むすめ]の父[ちち]は彼[かれ]に言[い]った。「見[み]よ、今[いま]、日[ひ]が暮[く]れようとしている。どうか今夜[こんや]もここに泊[と]まり、心[こころ]を楽[たの]しませなさい。明日[あす]の朝[あさ]、早[はや]く起[お]きてあなたがたの道[みち]を行[い]き、自分の住[す]まいへ帰[かえ]るがよい。」"
  10: "しかし、その男[おとこ]は泊[と]まることを望[のぞ]まず、立[た]って出[で]かけた。彼[かれ]らはエブス、すなわちエルサレムの前[まえ]まで来[き]た。彼とともに荷[に]を負[お]わせた二頭[にとう]のろばと、彼の側女[そばめ]がいた。"
  11: "彼[かれ]らがエブスの近[ちか]くにいて、日[ひ]がすっかり傾[かたむ]いたとき、従者[じゅうしゃ]は主人[しゅじん]に言[い]った。「さあ、このエブス人[じん]の町[まち]に寄[よ]って、そこで泊[と]まりましょう。」"
  12: "主人[しゅじん]は彼[かれ]に言[い]った。「いや、わたしたちは外国人[がいこくじん]の町[まち]、イスラエルの子[こ]らに属[ぞく]さない町には寄[よ]らない。ギベアまで行[い]こう。」"
  13: "そして従者[じゅうしゃ]に言[い]った。「さあ、ある場所[ばしょ]に入[はい]って、ギベアかラマで泊[と]まろう。」"
  14: "彼[かれ]らは進[すす]んで行[い]った。日[ひ]はギベアのそばで沈[しず]んだ。ギベアはベニヤミンに属[ぞく]していた。"
  15: "彼[かれ]らはギベアで泊[と]まろうとそこへ寄[よ]り、町[まち]に入[はい]って町の広場[ひろば]に座[すわ]った。しかし、彼らを家[いえ]に招[まね]き入[い]れて泊まらせる者[もの]は、だれもいなかった。"
  16: "見[み]よ、夕方[ゆうがた]、野良[のら]仕事[しごと]から帰[かえ]って来[き]た一人[ひとり]の年老[としお]いた男[おとこ]がいた。彼[かれ]はエフライムの山[やま]の人[ひと]で、ギベアに寄留[きりゅう]していたが、その土地[とち]の人々[ひとびと]はベニヤミンの子[こ]らであった。"
  17: "彼[かれ]が目[め]を上[あ]げて見[み]ると、旅人[たびびと]が町[まち]の広場[ひろば]にいた。年老[としお]いた男[おとこ]は言[い]った。「あなたはどこへ行[い]くのか。どこから来[き]たのか。」"
  18: "彼[かれ]は言[い]った。「わたしたちはベツレヘム・ユダから、エフライムの山[やま]のふもとまで行[い]くところです。わたしはそこの者[もの]で、ベツレヘム・ユダまで行って来[き]ました。今[いま]、わたしは自分[じぶん]の家[いえ]へ帰[かえ]るところですが、わたしを家に招[まね]き入[い]れる者がありません。"
  19: "わたしと、あなたの女奴隷[おんなどれい]と、この若者[わかもの]のために、すなわちあなたの僕[しもべ]たちのために、パンとぶどう酒[しゅ]があります。ろばのためには藁[わら]と飼[か]い葉[ば]があります。何[なに]ひとつ乏[とぼ]しいものはありません。」"
  20: "年老[としお]いた男[おとこ]は言[い]った。「あなたに平安[へいあん]があるように。あなたに足[た]りないものはすべてわたしが受[う]け持[も]とう。ただ、広場[ひろば]では泊[と]まらないでください。」"
  21: "彼[かれ]は彼を自分[じぶん]の家[いえ]に連[つ]れて入[はい]り、ろばに飼[か]い葉[ば]を与[あた]えた。彼らは足[あし]を洗[あら]い、食[た]べ、飲[の]んだ。"
  22: "彼[かれ]らが心[こころ]を楽[たの]しませていたとき、見[み]よ、町[まち]の者[もの]たち、不法[ふほう]な者たちの子[こ]らがその家[いえ]を取[と]り囲[かこ]み、戸[と]を叩[たた]いて、家の主人[しゅじん]である年老[としお]いた男[おとこ]に言[い]った。「あなたの家に入[はい]った男を連[つ]れ出[だ]せ。わたしたちは彼を知[し]りたいのだ。」"
  23: "家[いえ]の主人[しゅじん]である男[おとこ]は彼[かれ]らのところへ出[で]て行[い]って言[い]った。「いいえ、兄弟[きょうだい]たちよ、どうか悪[わる]いことをしないでください。この男がわたしの家に入[はい]ったのですから、この愚[おろ]かなことをしてはなりません。"
  24: "見[み]よ、わたしの処女[しょじょ]の娘[むすめ]と、この人[ひと]の側女[そばめ]がいます。わたしは彼女[かのじょ]たちを連[つ]れ出[だ]しますから、彼女たちを辱[はずか]しめ、あなたがたの目[め]に良[よ]いと思[おも]うことを彼女たちにしてください。ただ、この男[おとこ]には、この愚[おろ]かなことをしてはなりません。」"
  25: "しかし、その者[もの]たちは彼[かれ]の言[い]うことを聞[き]こうとしなかった。そこでその男[おとこ]は自分[じぶん]の側女[そばめ]を捕[つか]まえ、外[そと]にいる彼らのところへ連[つ]れ出[だ]した。彼らは彼女[かのじょ]を知[し]り、夜通[よどお]し朝[あさ]まで彼女を辱[はずか]しめた。そして夜明[よあ]けが上[のぼ]るころ、彼らは彼女を放[はな]った。"
  26: "朝[あさ]になって、その女[おんな]は、自分[じぶん]の主人[しゅじん]がいる男[おとこ]の家[いえ]の門[もん]の戸口[とぐち]に来[き]て、夜[よる]が明[あ]けるまでそこに倒[たお]れていた。"
  27: "朝[あさ]、彼女[かのじょ]の主人[しゅじん]は起[お]きて、家[いえ]の戸[と]を開[あ]け、自分[じぶん]の道[みち]を行[い]こうと出[で]て来[き]た。見[み]よ、彼[かれ]の側女[そばめ]であるその女[おんな]が戸口[とぐち]に倒[たお]れ、その両手[りょうて]を敷居[しきい]の上[うえ]に置[お]いていた。"
  28: "彼[かれ]は彼女[かのじょ]に言[い]った。「起[お]きなさい。行[い]こう。」しかし、答[こた]えはなかった。彼女は死[し]んでいたからである。彼は彼女をろばの上[うえ]に載[の]せ、立[た]って自分[じぶん]の場所[ばしょ]へ行[い]った。"
  29: "彼[かれ]は自分[じぶん]の家[いえ]に入[はい]ると、刀[かたな]を取[と]り、自分の側女[そばめ]を捕[つか]まえて、その骨[ほね]に沿[そ]って彼女[かのじょ]を十二[じゅうに]の部分[ぶぶん]に切[き]り分[わ]け、イスラエルのすべての部族[ぶぞく]に送[おく]った。"
  30: "見[み]た者[もの]はみな言[い]った。「イスラエルの子[こ]らがエジプトの地[ち]から上[のぼ]って来[き]た日[ひ]から今日[こんにち]まで、このようなことは起[お]こったことも、見られたこともない。」彼[かれ]は遣[つか]わした者たちに命[めい]じて言った。「イスラエルのすべての男[おとこ]にこう言いなさい。『イスラエルの子らがエジプトの地から上って来た日から今日まで、このようなことがあっただろうか。』このことについて、あなたがたは自分[じぶん]たちで考[かんが]えを定[さだ]め、語[かた]りなさい。」"

notes:
  1: "ἐν μηροῖς ὄρους Εφραιμ — «в боках (склонах) горы Ефремовой» (μηρός — «бедро»; слав. «во стране горы»). γυναῖκα παλλακήν — «жену-наложницу» (παλλακή — 側女; слав. «жену подложницу»). ἔλαβεν ἑαυτῷ — «взял себе»."
  2: "ὠργίσθη αὐτῷ ἡ παλλακὴ αὐτοῦ — «разгневалась на него наложница его»; в масор. тексте и ru — «согрешила (блудила) против него», это иное чтение, держимся LXX. ἡμέρας τετράμηνον — «дней четыре месяца», т. е. четыре месяца."
  3: "ἀνέστη … ἐπορεύθη κατόπισθεν αὐτῆς — «встал… пошёл вслед за ней». λαλῆσαι ἐπὶ τὴν καρδίαν αὐτῆς — «поговорить к сердцу её», т. е. успокоить, уговорить. διαλλάξαι αὐτὴν ἑαυτῷ — «примирить её с собой» (διαλλάσσω). ζεῦγος ὑποζυγίων — «пара вьючных ослов». καὶ ἐπορεύθη ἕως οἴκου τοῦ πατρὸς αὐτῆς — «и дошёл до дома отца её» (в csl здесь добавлено «она же введе его в дом отца своего»). παρῆν εἰς ἀπάντησιν — «вышел навстречу»."
  4: "εἰσήγαγεν αὐτὸν ὁ γαμβρὸς αὐτοῦ — «ввёл его тесть его» (γαμβρός — «зять»; здесь о тесте). ἐκάθισεν μετ᾿ αὐτοῦ ἡμέρας τρεῖς — «оставался с ним три дня» (κάθημαι — «сидеть, оставаться»); слав. «удержа его тесть» — иное понимание."
  5: "ὤρθρισαν τὸ πρωί — «встали рано утром» (ὀρθρίζω). ἀνέστη τοῦ ἀπελθεῖν — «встал, чтобы уйти». Στήρισον τὴν καρδίαν σου κλάσματι ἄρτου — «подкрепи сердце твоё куском хлеба» (στηρίζω; κλάσμα — «ломоть»)."
  6: "ἐκάθισαν … ἐπὶ τὸ αὐτό — «сели вместе» (ἐπὶ τὸ αὐτό — «вместе»). Ἀρξάμενος αὐλίσθητι — «начав, переночуй», т. е. «останься на ночь» (ἄρχομαι + αὐλίζομαι). ἀγαθυνθήτω ἡ καρδία σου — «да возвеселится сердце твоё»."
  7: "ἀνέστη … ἀπελθεῖν — «встал, чтобы уйти». ἐβιάσατο αὐτόν — «принудил его (настоял)» (βιάζομαι). πάλιν ηὐλίσθη — «снова переночевал»."
  8: "ὤρθρισεν τὸ πρωί — «встал рано утром». στρατεύθητι — букв. «ополчись», здесь «побудь, замедли» (στρατεύομαι; слав. «пребуди»). ἕως κλίνῃ ἡ ἡμέρα — «пока не склонится день»."
  9: "κατάλυσον ὧδε ἔτι σήμερον — «переночуй здесь ещё сегодня» (καταλύω — «останавливаться»). ὀρθριεῖτε αὔριον εἰς τὴν ὁδὸν ὑμῶν — «завтра рано встанете в путь ваш». εἰς τὸ σκήνωμά σου — «в жилище твоё» (σκήνωμα; слав. «в селение свое»)."
  10: "οὐκ ἠθέλησεν … αὐλισθῆναι — «не захотел переночевать». ἕως κατέναντι Ιεβους — «до [места] напротив Иевуса» (κατέναντι — «напротив»). αὕτη ἐστὶν Ιερουσαλημ — пояснение в скобках, оставлено в тексте. ζεῦγος ὑποζυγίων ἐπισεσαγμένων — «пара навьюченных ослов»."
  11: "ἡ ἡμέρα κεκλικυῖα σφόδρα — «день склонился весьма» (κλίνω, perfect). Δεῦρο δὴ καὶ ἐκκλίνωμεν — «ну, свернём» (ἐκκλίνω). τοῦ Ιεβουσαίου — «иевусея» (единственное число, как в гр.)."
  12: "Οὐ μὴ ἐκκλίνω — решительное «не сверну» (οὐ μή + conj.). πόλιν ἀλλοτρίου — «город чужого (иноплеменника)». ἣ οὐκ ἔστιν ἐκ τῶν υἱῶν Ισραηλ — «который не из сынов Израиля». παρελευσόμεθα ἕως Γαβαα — «пройдём до Гивы»; csl «до гаваона» передаёт то же Γαβαα."
  13: "εἰς ἕνα τῶν τόπων — «в одно из мест». ἐν Γαβαα ἢ ἐν Ραμα — «в Гиве или в Раме»."
  14: "ἔδυ γὰρ ὁ ἥλιος ἐχόμενα τῆς Γαβαα — «ибо зашло солнце близ Гивы» (ἐχόμενα — «рядом»). ἥ ἐστιν τοῦ Βενιαμιν — «которая Вениаминова»."
  15: "τοῦ εἰσελθεῖν καταλῦσαι ἐν Γαβαα — «чтобы войти и переночевать в Гиве». ἐν τῇ πλατείᾳ τῆς πόλεως — «на площади города» (πλατεῖα). οὐκ ἔστιν ἀνὴρ ὁ συνάγων — «нет человека, который бы собрал (принял) их»."
  16: "ἀνὴρ πρεσβύτης — «муж старый». ἀπὸ τῶν ἔργων αὐτοῦ ἐκ τοῦ ἀγροῦ ἑσπέρας — «от работ своих с поля вечером». παρῴκει ἐν Γαβαα — «жил пришельцем в Гиве»; он ефраимит, а жители — вениамитяне."
  17: "ἀναβλέψας τοῖς ὀφθαλμοῖς — «подняв глаза». ὁδοιπόρον — «путника» (ὁδοιπόρος). Ποῦ πορεύῃ καὶ πόθεν ἔρχῃ; — «куда идёшь и откуда идёшь?»"
  18: "Διαβαίνομεν … ἕως μηρῶν ὄρους τοῦ Εφραιμ — «идём… до склонов горы Ефремовой». ἐγὼ δὲ ἐκεῖθέν εἰμι — «я оттуда родом». εἰς τὸν οἶκόν μου ἐγὼ ἀποτρέχω — «в дом мой я иду» (ἀποτρέχω — «убегать, спешить»); в ru «к дому Господа» — иное чтение. οὐκ ἔστιν ἀνὴρ συνάγων με εἰς τὴν οἰκίαν — «нет человека, принимающего меня в дом»."
  19: "ἄχυρα καὶ χορτάσματα — «солома и корм» (χόρτασμα). τῇ δούλῃ σου — «рабыне твоей»: так левит вежливо называет наложницу (ср. ст. 24). τῷ παιδαρίῳ τοῖς δούλοις σου — «отроку, рабам твоим». ὑστέρημα παντὸς πράγματος — «недостаток всякой вещи»."
  20: "Εἰρήνη σοι — «мир тебе». πλὴν πᾶν τὸ ὑστέρημά σου ἐπ᾿ ἐμέ — «впрочем, всякий недостаток твой на мне», т. е. я всё восполню. ἐν τῇ πλατείᾳ μὴ καταλύσῃς — «на площади не ночуй»."
  21: "παρέβαλεν τοῖς ὑποζυγίοις — «подложил корм ослам» (παραβάλλω). ἐνίψαντο τοὺς πόδας αὐτῶν — «омыли ноги свои» (νίπτω)."
  22: "ἀγαθυνθέντων τῇ καρδίᾳ αὐτῶν — «когда развеселилось сердце их» (ἀγαθύνω). υἱοὶ παρανόμων — «сыны беззаконников» (идиома: негодяи). περιεκύκλωσαν — «окружили». ἵνα γνῶμεν αὐτόν — «чтобы мы познали его»: γινώσκω здесь о плотском познании, как в Быт 4:1, поэтому 知る, без смягчения и без грубости."
  23: "Μηδαμῶς — «ни в коем случае». μὴ πονηρεύσησθε — «не делайте зла» (πονηρεύομαι). μετὰ τὸ εἰσεληλυθέναι — «после того как вошёл». ἀφροσύνη — «безумие, глупость»."
  24: "ἡ θυγάτηρ μου ἡ παρθένος — «дочь моя, девица» (παρθένος — 処女). ταπεινώσατε αὐτὰς — «смирите, унизьте их» (ταπεινόω; передано 辱しめる). ποιήσατε αὐταῖς τὸ ἀγαθὸν ἐν ὀφθαλμοῖς ὑμῶν — «сделайте им доброе в глазах ваших», т. е. что вам угодно. τὸ ῥῆμα τῆς ἀφροσύνης ταύτης — «это слово безумия»."
  25: "οὐκ ἠθέλησαν … ἀκοῦσαι — «не захотели слушать». ἐπελάβετο — «схватил» (ἐπιλαμβάνομαι). ἐξήγαγεν … ἔξω — «вывел наружу». ἔγνωσαν αὐτὴν — «познали её» (см. ст. 22). ἐνέπαιξαν αὐτῇ — «глумились над ней» (ἐμπαίζω; передано 辱しめる). ἅμα τῷ ἀναβαίνειν τὸν ὄρθρον — «когда восходила заря» (ὄρθρος; слав. «денница»)."
  26: "τὸ πρὸς πρωί — «к утру». ἔπεσεν παρὰ τὴν θύραν τοῦ πυλῶνος — «упала у двери ворот». ἕως οὗ διέφαυσεν — «пока не рассвело» (διαυγάζω)."
  27: "ἤνοιξεν τὰς θύρας — «отворил двери». ἐξῆλθεν τοῦ ἀπελθεῖν τὴν ὁδὸν αὐτοῦ — «вышел, чтобы идти в путь свой». πεπτωκυῖα παρὰ τὴν θύραν — «лежащая у двери» (perfect part.). αἱ χεῖρες αὐτῆς ἐπὶ τὸ πρόθυρον — «руки её на пороге» (πρόθυρον — «преддверие»)."
  28: "Ἀνάστηθι καὶ ἀπέλθωμεν — «встань и пойдём». οὐκ ἀπεκρίθη — «не ответила». ἀλλὰ τεθνήκει — «но она умерла» (plusquamperfect от θνῄσκω; LXX не смягчает). ἀνέλαβεν αὐτὴν ἐπὶ τὸ ὑποζύγιον — «поднял её на осла»."
  29: "ἔλαβεν τὴν μάχαιραν — «взял нож (меч)». ἐμέλισεν αὐτὴν κατὰ τὰ ὀστᾶ αὐτῆς — «рассек её по костям её» (μελίζω — «рассекать на части», как в Лев 1:6). εἰς δώδεκα μερίδας — «на двенадцать частей». ἐξαπέστειλεν … εἰς πάσας τὰς φυλάς — «послал… во все племена»."
  30: "πᾶς ὁ ὁρῶν ἔλεγεν — «всякий видящий говорил». Οὔτε ἐγενήθη οὔτε ὤφθη οὕτως — «ни бывало, ни видано было так». ἀπὸ τῆς ἡμέρας ἀναβάσεως — «от дня восхода (исхода)». ἐνετείλατο … λέγων — «заповедал, говоря». Εἰ γέγονεν …; — вопрос: «случилось ли…?» (εἰ в косвенном вопросе). θέσθε ἑαυτοῖς βουλὴν — «положите себе совет», т. е. примите решение. В LXX ст. 30 соединяет голос рассказчика и повеление — не сглаживаем."
