verses:
  0: "指揮者[しきしゃ]に。ダビデの詩[うた]。"
  1: "主[しゅ]よ、あなたはわたしを試[こころ]み、わたしを知[し]っておられる。"
  2: "あなたはわたしが座[すわ]ることも立[た]つことも知[し]り、わたしの思[おも]いを遠[とお]くから悟[さと]っておられる。"
  3: "わたしが歩[あゆ]む道[みち]も、わたしの床[とこ]も、あなたは見[み]通[とお]し、わたしのすべての道[みち]を前[まえ]もって知[し]っておられる。"
  4: "わたしの舌[した]にまだ言葉[ことば]がないうちに、主[しゅ]よ、あなたはすでにそのすべてを知[し]っておられる。"
  5: "見[み]よ、主[しゅ]よ、あなたはすべてのことを知[し]っておられる。後[あと]のことも先[さき]のことも。あなたはわたしを造[つく]り、わたしの上[うえ]に手[て]を置[お]かれた。"
  6: "あなたの知[ち]識[しき]はわたしにとって驚[おどろ]くべきものとなり、あまりに高[たか]く、わたしはそれに及[およ]ぶことができない。"
  7: "わたしはどこへ行[い]って、あなたの霊[れい]から逃[のが]れようか。あなたの顔[かお]からどこへ逃[に]げようか。"
  8: "天[てん]に上[のぼ]っても、あなたはそこにおられ、陰府[よみ]に下[くだ]っても、あなたはそこにおられる。"
  9: "暁[あかつき]の翼[つばさ]を身[み]につけて、海[うみ]の果[は]てに住[す]み着[つ]いても、"
  10: "そこでも、あなたの手[て]がわたしを導[みちび]き、あなたの右[みぎ]の手[て]がわたしを支[ささ]えてくださる。"
  11: "わたしは言[い]った。「きっと闇[やみ]がわたしを覆[おお]い、わたしを囲[かこ]む光[ひかり]が夜[よる]になるにちがいない」と。"
  12: "しかし、闇[やみ]もあなたの前[まえ]では暗[くら]くならず、夜[よる]も昼[ひる]のように明[あき]らかになる。暗[くら]さも光[ひかり]も、あなたにとっては同[おな]じである。"
  13: "あなたは、主[しゅ]よ、わたしの内臓[ないぞう]を造[つく]り、母[はは]の胎[たい]のうちからわたしを支[ささ]えてくださった。"
  14: "わたしはあなたに感謝[かんしゃ]をささげます。わたしは驚[おどろ]くほど見事[みごと]に造[つく]られたからです。あなたのわざは驚[おどろ]くべきものであり、わたしの魂[たましい]はそれをよく知[し]っています。"
  15: "わたしの骨[ほね]はあなたに隠[かく]れていない。あなたが隠[かく]れたところでわたしを造[つく]り、地[ち]の深[ふか]みでわたしの身[み]を形[かたち]づくられたときも。"
  16: "まだ形[かたち]の整[ととの]わないわたしを、あなたの目[め]は見[み]られた。すべてのものはあなたの書[しょ]に記[しる]され、日々[ひび]は形[かたち]づくられるが、まだだれ一[ひと]人[り]その中[なか]にいない。"
  17: "神[かみ]よ、あなたの友[とも]はわたしにとっていかに尊[とうと]いことか。その権[けん]力[りょく]は、いかに強[つよ]いことか。"
  18: "数[かぞ]えようとすれば、砂[すな]よりも多[おお]い。目[め]を覚[さ]ますとき、わたしはまだあなたと共[とも]にいる。"
  19: "神[かみ]よ、あなたが罪[つみ]人[びと]を殺[ころ]されるとき、血[ち]を流[なが]す者[もの]たちよ、わたしから離[はな]れよ。"
  20: "彼[かれ]らはあなたをそしって悪[わる]を語[かた]り、あなたの町[まち]々[まち]をむなしく奪[うば]おうと企[くわだ]てる。"
  21: "主[しゅ]よ、あなたを憎[にく]む者[もの]を、わたしが憎[にく]まないはずがあろうか。あなたに立[た]ち向[む]かう者[もの]を、わたしが忌[い]み嫌[きら]わないはずがあろうか。"
  22: "わたしは彼[かれ]らを完[かん]全[ぜん]な憎[にく]しみをもって憎[にく]んだ。彼[かれ]らはわたしの敵[てき]となった。"
  23: "神[かみ]よ、わたしを試[こころ]み、わたしの心[こころ]を知[し]ってください。わたしを確[たし]かめ、わたしの道[みち]を知[し]ってください。"
  24: "わたしのうちに邪[よこしま]な道[みち]があるかどうかを見[み]て、わたしを永遠[えいえん]の道[みち]に導[みちび]いてください。"

notes:
  0: "Εἰς τὸ τέλος· ψαλμὸς τῷ Δαυιδ — 指揮者に。ダビデの詩 (εἰς τὸ τέλος — «в конец», т. е. начальнику хора; как в Пс 4–6). Надписание — стих 0."
  1: "Κύριε, ἐδοκίμασάς με καὶ ἔγνως με — 主よ、あなたはわたしを試み、わたしを知っておられる (δοκιμάζω — «испытывать»; γινώσκω — «знать»)."
  2: "σὺ ἔγνως τὴν καθέδραν μου καὶ τὴν ἔγερσίν μου — わたしが座ることも立つことも知り (καθέδρα — «сидение»; ἔγερσις — «вставание»). σὺ συνῆκας τοὺς διαλογισμούς μου ἀπὸ μακρόθεν — わたしの思いを遠くから悟っておられる (συνίημι — «понимать»; διαλογισμός — «помышление»)."
  3: "τὴν τρίβον μου καὶ τὴν σχοῖνόν μου σὺ ἐξιχνίασας — わたしが歩む道も、わたしの床も、あなたは見通し (τρίβος — «стезя»; σχοῖνος — «камыш, камышовая циновка», отсюда «ложе», как в слав. «ложе мое»). πάσας τὰς ὁδούς μου προεῖδες — すべての道を前もって知っておられる (προοράω — «предвидеть»)."
  4: "ὅτι οὐκ ἔστιν λόγος ἐν γλώσσῃ μου — わたしの舌にまだ言葉がないうちに (в греч. стих обрывается; продолжение — в 5, по смыслу: Ты уже знаешь)."
  5: "ἰδού, κύριε, σὺ ἔγνως πάντα, τὰ ἔσχατα καὶ τὰ ἀρχαῖα — 見よ、主よ、あなたはすべてのことを知っておられる、後のことも先のことも. σὺ ἔπλασάς με — あなたはわたしを造り (πλάσσω — «лепить, создавать»). ἔθηκας ἐπ᾽ ἐμὲ τὴν χεῖρά σου — わたしの上に手を置かれた."
  6: "ἐθαυμαστώθη ἡ γνῶσίς σου ἐξ ἐμοῦ — あなたの知識はわたしにとって驚くべきものとなり (θαυμαστόω — «делать дивным»). ἐκραταιώθη, οὐ μὴ δύνωμαι πρὸς αὐτήν — あまりに高く、わたしはそれに及ぶことができない (κραταιόω — «укреплять»; δύναμαι πρός — «быть в силах против»)."
  7: "ποῦ πορευθῶ ἀπὸ τοῦ πνεύματός σου — どこへ行って、あなたの霊から逃れようか (πνεῦμα — 霊, без ἅγιον, поэтому 霊[れい]). ἀπὸ τοῦ προσώπου σου ποῦ φύγω — あなたの顔からどこへ逃げようか."
  8: "ἐὰν ἀναβῶ εἰς τὸν οὐρανόν, σὺ εἶ ἐκεῖ — 天に上っても、あなたはそこにおられる. ἐὰν καταβῶ εἰς τὸν ᾅδην, πάρει — 陰府に下っても、あなたはそこにおられる (ᾅδης — 陰府; πάρειμι — «присутствовать»)."
  9: "ἐὰν ἀναλάβοιμι τὰς πτέρυγάς μου κατ᾽ ὄρθρον — 暁の翼を身につけて (ὄρθρος — «рассвет»; образ зари с крыльями). κατασκηνώσω εἰς τὰ ἔσχατα τῆς θαλάσσης — 海の果てに住み着いても (κατασκηνόω — «поселяться»)."
  10: "καὶ γὰρ ἐκεῖ ἡ χείρ σου ὁδηγήσει με — そこでも、あなたの手がわたしを導き (ὁδηγέω — «вести»). καθέξει με ἡ δεξιά σου — 右の手がわたしを支えてくださる (κατέχω — «держать, удерживать»)."
  11: "καὶ εἶπα· Ἄρα σκότος καταπατήσει με — わたしは言った、「きっと闇がわたしを覆う」 (καταπατέω — «попирать»; ἆρα — «итак, может быть»). καὶ νὺξ φωτισμὸς ἐν τῇ τρυφῇ μου — わたしを囲む光が夜になる (φωτισμός — «свет»; τρυφή — «наслаждение, нега»; смысл: свет вокруг станет ночью, как у jp-joc). Слова псалмопевца — 「」."
  12: "ὅτι σκότος οὐ σκοτισθήσεται ἀπὸ σοῦ — 闇もあなたの前では暗くならない (σκοτίζω — «затмевать»). καὶ νὺξ ὡς ἡμέρα φωτισθήσεται — 夜も昼のように明らかになる. ὡς τὸ σκότος αὐτῆς, οὕτως καὶ τὸ φῶς αὐτῆς — 暗さも光も、あなたにとっては同じである."
  13: "ὅτι σὺ ἐκτήσω τοὺς νεφρούς μου, κύριε — あなたはわたしの内臓を造り (κτάομαι — «приобретать, создавать»; νεφροί — «внутренности, почки»). ἀντελάβου μου ἐκ γαστρὸς μητρός μου — 母の胎のうちからわたしを支えてくださった (ἀντιλαμβάνομαι — «поддерживать, принимать»)."
  14: "ἐξομολογήσομαί σοι, ὅτι φοβερῶς ἐθαυμαστώθην — あなたに感謝をささげます、わたしは驚くほど見事に造られたからです (φοβερῶς — «страшно, дивно»). θαυμάσια τὰ ἔργα σου — あなたのわざは驚くべきもの. ἡ ψυχή μου γινώσκει σφόδρα — わたしの魂はそれをよく知っています."
  15: "οὐκ ἐκρύβη τὸ ὀστοῦν μου ἀπὸ σοῦ — わたしの骨はあなたに隠れていない (κρύπτω — «скрывать»). ὃ ἐποίησας ἐν κρυφῇ — あなたが隠れたところで造った骨 (ἐν κρυφῇ — «втайне»). ἡ ὑπόστασίς μου ἐν τοῖς κατωτάτοις τῆς γῆς — わたしの身は地の最も深いところで (ὑπόστασις — «состав, сущность»; κατώτατος — «самый низкий»)."
  16: "τὸ ἀκατέργαστόν μου εἴδοσαν οἱ ὀφθαλμοί σου — まだ形の整わないわたしを、あなたの目は見られた (ἀκατέργαστος — «необработанный, неоформленный»). ἐπὶ τὸ βιβλίον σου πάντες γραφήσονται — すべてのものはあなたの書に記される (βιβλίον — «книга»). ἡμέρας πλασθήσονται, καὶ οὐθεὶς ἐν αὐτοῖς — 日々は形づくられるが、まだだれ一人その中にいない (πλάσσω — «лепить»; тёмное место, передано буквально)."
  17: "ἐμοὶ δὲ λίαν ἐτιμήθησαν οἱ φίλοι σου, ὁ θεός — 神よ、あなたの友はわたしにとっていかに尊いことか (τιμάω — «чтить»; φίλοι — «друзья», как в слав. «друзи твои»). λίαν ἐκραταιώθησαν αἱ ἀρχαὶ αὐτῶν — その権力はいかに強いことか (ἀρχαί — «начала, власти»; тёмное место: в ru и jp-joc передано «число», здесь оставлено «власти/начала», чтобы не сглаживать)."
  18: "ἐξαριθμήσομαι αὐτούς — 数えようとすれば (ἐξαριθμέω — «исчислять»). ὑπὲρ ἄμμον πληθυνθήσονται — 砂よりも多い (ἄμμος — «песок»). ἐξηγέρθην καὶ ἔτι εἰμὶ μετὰ σοῦ — 目を覚ますとき、わたしはまだあなたと共にいる (ἐξεγείρω — «пробуждать»)."
  19: "ἐὰν ἀποκτείνῃς ἁμαρτωλούς, ὁ θεός — 神よ、あなたが罪人を殺されるとき (ἀποκτείνω — «умерщвлять»). ἄνδρες αἱμάτων, ἐκκλίνατε ἀπ᾿ ἐμοῦ — 血を流す者たちよ、わたしから離れよ (ἐκκλίνω — «уклоняться»). Обращение к кровожадным — без кавычек: это не цитата, а прямая речь псалмопевца внутри молитвы."
  20: "ὅτι ἐρεῖς εἰς διαλογισμόν — 彼らはあなたをそしって悪を語り (в гр. 2 л. ед. ч. «скажешь», тёмное место; передано по церковному чтению — 3 л. мн. ч., как в ru и jp-joc). λήμψονται εἰς ματαιότητα τὰς πόλεις σου — あなたの町々をむなしく奪おうと企てる (εἰς ματαιότητα — «впустую»)."
  21: "οὐχὶ τοὺς μισοῦντάς σε, κύριε, ἐμίσησα — 主よ、あなたを憎む者を、わたしが憎まないはずがあろうか (риторический вопрос с οὐχί). ἐπὶ τοῖς ἐχθροῖς σου ἐξετηκόμην — あなたの敵たちのゆえに、わたしは溶け崩れるほどであった (ἐκτήκω — «расплавлять, изнемогать»)."
  22: "τέλειον μῖσος ἐμίσουν αὐτούς — 完全な憎しみをもって憎んだ (внутренний объект τέλειον μῖσος сохранён). εἰς ἐχθροὺς ἐγένοντό μοι — 彼らはわたしの敵となった."
  23: "δοκίμασόν με, ὁ θεός, καὶ γνῶθι τὴν καρδίαν μου — 神よ、わたしを試み、わたしの心を知ってください. ἔτασόν με καὶ γνῶθι τὰς τρίβους μου — わたしを確かめ、わたしの道を知ってください (ἐτάζω — «исследовать, испытывать»)."
  24: "καὶ ἰδὲ εἰ ὁδὸς ἀνομίας ἐν ἐμοί — わたしのうちに邪な道があるかどうかを見て (ἀνομία — «беззаконие»). ὁδήγησόν με ἐν ὁδῷ αἰωνίᾳ — 永遠の道に導いてください (повтор 道 сохранён)."
