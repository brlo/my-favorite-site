# jp-box, Иисус Навин, глава 7. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в этой главе нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 7: Ахар и Гай (1–26): грех Ахара, поражение под Гаем, молитва Иисуса,
# указание виновного, казнь в долине Ахор.
# Речь Бога — 「…」 (10–15); речь Иисуса — 「…」 (7–9, 19, 25); речь Ахара — 「…」
# (20–21). Вложенная речь — 『…』 (7:13), внутри неё снова 「…」 — слова Господа,
# которые Иисус должен передать народу.
# Красного нет. jp-ni не использовался.
