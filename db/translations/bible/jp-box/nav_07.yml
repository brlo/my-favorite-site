verses:
  1: "イスラエルの子[こ]らは大[おお]きな罪[つみ]を犯[おか]し、聖絶[せいぜつ]の物[もの]から取[と]った。ユダの部族[ぶぞく]のアハル、すなわちハルミの子[こ]、ザムブリの子[こ]、ゼラの子[こ]が、聖絶の物から取ったのである。主[しゅ]の怒[いか]りはイスラエルの子[こ]らに対[たい]して燃[も]え上[あ]がった。"
  2: "ヨシュアは、ベテルに面[めん]したアイに人[ひと]々[びと]を遣[つか]わして言[い]った。「アイを探[さぐ]って来[き]なさい。」人[ひと]々[びと]は上[のぼ]って行[い]き、アイを探[さぐ]った。"
  3: "彼[かれ]らはヨシュアのもとへ戻[もど]り、言[い]った。「民[たみ]がみな上[のぼ]って行[い]く必要[ひつよう]はありません。二千人[にん]か三千人ほどの者[もの]が上[のぼ]って、あの町[まち]を攻[せ]め落[お]とすべきです。民[たみ]をみなそこへ連[つ]れて行[い]かないでください。あの町の者[もの]は少[すく]ないのですから。」"
  4: "そこで、三千人[にん]ほどの者[もの]が上[のぼ]って行[い]ったが、アイの人[ひと]々[びと]の前[まえ]から逃[に]げた。"
  5: "アイの人[ひと]々[びと]は彼[かれ]らのうち三十六人[にん]を殺[ころ]し、門[もん]から追[お]いかけて、下[くだ]り坂[ざか]で彼[かれ]らを打[う]ち砕[くだ]いた。民[たみ]の心[こころ]は恐[おそ]れに捕[と]らわれ、水[みず]のようになった。"
  6: "ヨシュアは自分[じぶん]の衣[ころも]を引[ひ]き裂[さ]き、地[ち]に顔[かお]を伏[ふ]して主[しゅ]の前[まえ]に夕[ゆう]べまで伏[ふ]していた。イスラエルの長老[ちょうろう]たちも彼[かれ]とともに伏[ふ]し、頭[あたま]に土[つち]をかけた。"
  7: "ヨシュアは言[い]った。「ああ、主[しゅ]よ。なぜ、あなたはこの民[たみ]をヨルダン川[がわ]の向[む]こうへ渡[わた]らせ、アモリ人[じん]の手[て]に渡[わた]して、わたしたちを滅[ほろ]ぼそうとされるのですか。わたしたちがヨルダン川[がわ]のそばにとどまって住[す]んでいたなら、どんなによかったでしょう。"
  8: "イスラエルが敵[てき]の前[まえ]に背[せ]を向[む]けてしまった今[いま]、わたしは何[なに]を言[い]えるでしょうか。"
  9: "カナン人[じん]とこの地[ち]に住[す]むすべての者[もの]が聞[き]けば、わたしたちを取[と]り囲[かこ]み、この地[ち]からわたしたちを滅[ほろ]ぼしてしまうでしょう。あなたは、あなたの大[おお]いなる名[な]のために何[なに]をなさるのですか。」"
  10: "主[しゅ]はヨシュアに言[い]われた。「立[た]ちなさい。なぜ、あなたは顔[かお]を伏[ふ]しているのか。"
  11: "民[たみ]は罪[つみ]を犯[おか]した。わたしが彼[かれ]らと結[むす]んだ契約[けいやく]を破[やぶ]り、聖絶[せいぜつ]の物[もの]から盗[ぬす]んで、自分[じぶん]たちの器[うつわ]の中[なか]に入[い]れた。"
  12: "イスラエルの子[こ]らは敵[てき]の前[まえ]に立[た]つことができない。彼[かれ]らは敵[てき]の前[まえ]に背[せ]を向[む]ける。彼[かれ]らは聖絶[せいぜつ]の物[もの]となったからである。あなたがたが自分[じぶん]たちの間[あいだ]から聖絶の物を取[と]り除[のぞ]かないなら、わたしはもはやあなたがたとともにいることはない。"
  13: "立[た]って、民[たみ]を聖[きよ]めなさい。そして言[い]いなさい。『明日[あす]のために身[み]を聖めなさい。イスラエルの神[かみ]、主[しゅ]はこう言[い]われる。「あなたがたの間[あいだ]に聖絶[せいぜつ]の物[もの]がある。あなたがたは、自分[じぶん]たちの間から聖絶の物を取[と]り除[のぞ]くまで、敵[てき]の前[まえ]に立[た]つことはできない。」』"
  14: "朝[あさ]になったら、あなたがたはみな部族[ぶぞく]ごとに集[あつ]まりなさい。主[しゅ]が示[しめ]される部族を氏族[しぞく]ごとに進[すす]み出[で]させ、主[しゅ]が示[しめ]される氏族を家[いえ]ごとに進[すす]み出[で]させ、主[しゅ]が示[しめ]される家を男[おとこ]ごとに進[すす]み出[で]させなさい。"
  15: "そして、示[しめ]された者[もの]は、彼[かれ]も、彼[かれ]にあるすべてのものも火[ひ]で焼[や]かれなければならない。彼[かれ]が主[しゅ]の契約[けいやく]を破[やぶ]り、イスラエルの中[なか]で不法[ふほう]を行[おこな]ったからである。」"
  16: "ヨシュアは朝早[あさはや]く起[お]き、民[たみ]を部族[ぶぞく]ごとに連[つ]れて来[き]た。すると、ユダの部族[ぶぞく]が示[しめ]された。"
  17: "ユダの氏族[しぞく]が氏族[しぞく]ごとに連[つ]れて来[こ]られると、ゼラの氏族[しぞく]が示[しめ]され、男[おとこ]ごとに連[つ]れて来[こ]られると、"
  18: "ザムブリの子[こ]、ゼラの子[こ]であるアハルが示[しめ]された。"
  19: "ヨシュアはアハルに言[い]った。「今[いま]、イスラエルの神[かみ]、主[しゅ]に栄光[えいこう]を帰[き]し、告白[こくはく]しなさい。そして、あなたが何[なに]をしたのか、わたしに告[つ]げなさい。わたしに隠[かく]してはならない。」"
  20: "アハルはヨシュアに答[こた]えて言[い]った。「確[たし]かに、わたしはイスラエルの神[かみ]、主[しゅ]の前[まえ]に罪[つみ]を犯[おか]しました。わたしはこのとおりのことをしました。"
  21: "わたしは戦利品[せんりひん]の中[なか]に、美[うつく]しい色[いろ]とりどりの衣[ころも]と、銀[ぎん]二百[にひゃく]ディドラクマ、五十[ごじゅう]ディドラクマの金[きん]の延[の]べ金[がね]を見[み]ました。それを欲[ほ]しくなって取[と]ったのです。ご覧[らん]のとおり、それはわたしの天幕[てんまく]の地中[ちちゅう]に隠[かく]されており、銀[ぎん]はその下[した]に隠れています。」"
  22: "ヨシュアは使者[ししゃ]たちを遣[つか]わした。彼[かれ]らは宿営[しゅくえい]の天幕[てんまく]へ走[はし]って行[い]った。すると、それは天幕[てんまく]の中[なか]に隠[かく]されており、銀[ぎん]はその下[した]にあった。"
  23: "彼[かれ]らはそれを天幕[てんまく]から運[はこ]び出[だ]し、ヨシュアとイスラエルの長老[ちょうろう]たちのところへ持[も]って来[き]て、主[しゅ]の前[まえ]に置[お]いた。"
  24: "ヨシュアは、ゼラの子[こ]であるアハルと、その息子[むすこ]たち、娘[むすめ]たち、子牛[こうし]たち、荷[に]を運[はこ]ぶ家畜[かちく]、すべての羊[ひつじ]、天幕[てんまく]、および彼[かれ]のすべての財産[ざいさん]を取[と]り、民[たみ]もみな彼[かれ]とともに、彼[かれ]らをアコルの谷[たに]、すなわちエメカホルへ連[つ]れ上[のぼ]った。"
  25: "ヨシュアは言[い]った。「なぜ、あなたはわたしたちを滅[ほろ]ぼしたのか。主[しゅ]が今日[きょう]、あなたを滅[ほろ]ぼされますように。」イスラエルはみな、彼[かれ]を石[いし]で打[う]ち殺[ころ]した。"
  26: "彼[かれ]の上[うえ]に大[おお]きな石塚[いしづか]を積[つ]み上[あ]げた。こうして主[しゅ]は激[はげ]しい怒[いか]りを収[おさ]められた。それゆえ、その場所[ばしょ]は今日[きょう]までアコルの谷[たに]と呼[よ]ばれている。"

notes:
  1: "ἐπλημμέλησαν πλημμέλειαν μεγάλην — «согрешили грехом великим» (πλημμελέω, внутренний винительный). ἐνοσφίσαντο ἀπὸ τοῦ ἀναθέματος — присвоили из заклятого (νοσφίζομαι). Αχαρ υἱὸς Χαρμι υἱοῦ Ζαμβρι υἱοῦ Ζαρα — Ахар, сын Харми, сына Замври, сына Зара (LXX Αχαρ; в МТ Ахан). ἐθυμώθη ὀργῇ κύριος — воспламенился гневом Господь."
  2: "ἥ ἐστιν κατὰ Βαιθηλ — которая против Вефиля (κατά + вин.). Κατασκέψασθε — осмотрите (κατασκέπτομαι). Слав. добавляет «от иерихона» и «на восток вефиля» — в gr нет."
  3: "Μὴ ἀναβήτω πᾶς ὁ λαός — пусть не восходит весь народ. ὡς δισχίλιοι ἢ τρισχίλιοι ἄνδρες — около двух или трёх тысяч мужей. ἐκπολιορκησάτωσαν — осадят, возьмут (ἐκπολιορκέω). μὴ ἀναγάγῃς — не выводи (ἀνάγω). ὀλίγοι γάρ εἰσιν — ибо их мало."
  4: "ἀνέβησαν ὡσεὶ τρισχίλιοι ἄνδρες — взошли около трёх тысяч мужей. ἔφυγον ἀπὸ προσώπου τῶν ἀνδρῶν Γαι — побежали от лица мужей Гая."
  5: "ἀπέκτειναν ... εἰς τριάκοντα καὶ ἓξ ἄνδρες — убили до тридцати шести мужей (εἰς — «до»). κατεδίωξαν ἀπὸ τῆς πύλης — преследовали от ворот. συνέτριψαν ἐπὶ τοῦ καταφεροῦς — разбили на спуске, склоне (καταφερές). ἐπτοήθη ἡ καρδία τοῦ λαοῦ — устрашилось сердце народа (πτοέω). ἐγένετο ὥσπερ ὕδωρ — стало как вода."
  6: "διέρρηξεν τὰ ἱμάτια — разодрал одежды (διαρρήγνυμι). ἔπεσεν ἐπὶ τὴν γῆν ἐπὶ πρόσωπον ἐναντίον κυρίου — пал на землю лицом пред Господом. ἕως ἑσπέρας — до вечера. ἐπεβάλοντο χοῦν ἐπὶ τὰς κεφαλάς — возложили прах на головы (ἐπιβάλλω; χοῦς — прах, земля)."
  7: "Δέομαι, κύριε — молю, Господи (δέομαι). ἵνα τί διεβίβασεν ὁ παῖς σου — для чего перевёл раб твой (διαβιβάζω). παραδοῦναι αὐτὸν τῷ Αμορραίῳ — предать его Аморрею. εἰ κατεμείναμεν καὶ κατῳκίσθημεν παρὰ τὸν Ιορδάνην — если бы мы остались и поселились при Иордане."
  8: "τί ἐρῶ — что скажу. ἐπεὶ μετέβαλεν Ισραηλ αὐχένα ἀπέναντι τοῦ ἐχθροῦ — после того как Израиль обратил шею, т. е. тыл, пред врагом (μεταβάλλω; αὐχήν)."
  9: "περικυκλώσουσιν ἡμᾶς — окружат нас (περικυκλόω). ἐκτρίψουσιν ἡμᾶς ἀπὸ τῆς γῆς — истребят нас с земли (ἐκτρίβω). τί ποιήσεις τὸ ὄνομά σου τὸ μέγα — что сделаешь имени Твоему великому (винительный при ποιέω)."
  10: "Ἀνάστηθι — встань. ἵνα τί τοῦτο σὺ πέπτωκας ἐπὶ πρόσωπόν σου — для чего ты пал на лицо твоё (перфект)."
  11: "ἡμάρτηκεν ὁ λαός — согрешил народ (перфект). παρέβη τὴν διαθήκην — преступил завет. κλέψαντες ἀπὸ τοῦ ἀναθέματος ἐνέβαλον εἰς τὰ σκεύη αὐτῶν — украв из заклятого, вложили в сосуды, вещи свои."
  12: "οὐ μὴ δύνωνται ... ὑποστῆναι — не смогут устоять (ὑφίστημι). αὐχένα ἐπιστρέψουσιν — обратят шею. ἐγενήθησαν ἀνάθεμα — стали заклятыми. οὐ προσθήσω ἔτι εἶναι μεθ᾽ ὑμῶν — не приложу более быть с вами. ἐὰν μὴ ἐξάρητε τὸ ἀνάθεμα ἐξ ὑμῶν αὐτῶν — если не изымете заклятое из самих себя."
  13: "ἀναστὰς ἁγίασον τὸν λαόν — встав, освяти народ. ἁγιασθῆναι εἰς αὔριον — освятиться к утру. τάδε λέγει κύριος ὁ θεὸς Ισραηλ — так говорит Господь Бог Израиля. τὸ ἀνάθεμα ἐν ὑμῖν ἐστιν — заклятое среди вас. οὐ δυνήσεσθε ἀντιστῆναι — не сможете противостать. Три уровня речи: слова Бога Иисусу — 「…」, слова Иисуса народу — 『…』, слова Господа в них — снова 「…」."
  14: "συναχθήσεσθε πάντες τὸ πρωῒ κατὰ φυλάς — соберётесь все утром по племенам. ὃν ἂν δείξῃ κύριος — которое укажет Господь. προσάξετε κατὰ δήμους — приведёте по родам (δῆμος; 氏族). κατ᾽ οἶκον — по домам. κατ᾽ ἄνδρα — по одному человеку."
  15: "κατακαυθήσεται ἐν πυρί — сожжён будет огнём (κατακαίω). παρέβη τὴν διαθήκην κυρίου — преступил завет Господень. ἐποίησεν ἀνόμημα — сделал беззаконие (ἀνόμημα)."
  16: "ὤρθρισεν Ἰησοῦς — встал рано Иисус (ὀρθρίζω). προσήγαγεν τὸν λαὸν κατὰ φυλάς — привёл народ по племенам. ἐνεδείχθη ἡ φυλὴ Ιουδα — указано племя Иуды (ἐνδείκνυμι)."
  17: "προσήχθη κατὰ δήμους — приведён по родам. ἐνεδείχθη δῆμος ὁ Ζαραι — указан род Зары. προσήχθη κατὰ ἄνδρα — приведён по мужам; стих обрывается, продолжение в 18."
  18: "ἐνεδείχθη Αχαρ υἱὸς Ζαμβρι υἱοῦ Ζαρα — указан Ахар, сын Замври, сына Зара."
  19: "δὸς δόξαν σήμερον τῷ κυρίῳ θεῷ Ισραηλ — воздай славу сегодня Господу Богу Израиля. δὸς τὴν ἐξομολόγησιν — воздай исповедание, признание (ἐξομολόγησις). ἀνάγγειλόν μοι τί ἐποίησας — возвести мне, что сделал. μὴ κρύψῃς ἀπ᾽ ἐμοῦ — не скрой от меня."
  20: "Ἀληθῶς ἥμαρτον ἐναντίον κυρίου θεοῦ Ισραηλ — истинно согрешил пред Господом Богом Израиля. οὕτως καὶ οὕτως ἐποίησα — «так и так сделал», т. е. сделал то-то и то-то."
  21: "ἐν τῇ προνομῇ — в добыче (προνομή). ψιλὴν ποικίλην καλὴν — тонкую пёструю красивую одежду (ψιλός — тонкий, ποικίλος — пёстрый). διακόσια δίδραχμα ἀργυρίου — двести дидрахм серебра (δίδραχμον — двойная драхма). γλῶσσαν μίαν χρυσῆν πεντήκοντα διδράχμων — «один язык золотой» весом в пятьдесят дидрахм, т. е. слиток, пластина золота; передано 延べ金. ἐνθυμηθεὶς αὐτῶν ἔλαβον — помыслив о них, взял. ἐγκέκρυπται ἐν τῇ γῇ ἐν τῇ σκηνῇ μου — скрыто в земле в шатре моём."
  22: "ἀπέστειλεν Ἰησοῦς ἀγγέλους — послал Иисус вестников. ἔδραμον εἰς τὴν σκηνὴν εἰς τὴν παρεμβολήν — побежали в шатёр, в стан. ἐγκεκρυμμένα — скрытые (ἐγκρύπτω)."
  23: "ἐξήνεγκαν αὐτὰ ἐκ τῆς σκηνῆς — вынесли это из шатра. ἤνεγκαν πρὸς Ἰησοῦν καὶ τοὺς πρεσβυτέρους — принесли к Иисусу и старейшинам. ἔθηκαν αὐτὰ ἔναντι κυρίου — положили это пред Господом."
  24: "ἀνήγαγεν αὐτὸν εἰς φάραγγα Αχωρ — возвёл его в долину Ахор (φάραγξ). ὑποζύγια — вьючные животные. πάντα τὰ ὑπάρχοντα αὐτοῦ — всё имущество его (τὰ ὑπάρχοντα). πᾶς ὁ λαὸς μετ᾽ αὐτοῦ — весь народ с ним. ἀνήγαγεν αὐτοὺς εἰς Εμεκαχωρ — возвёл их в Емекахор (= долина Ахор)."
  25: "Τί ὠλέθρευσας ἡμᾶς — что ты погубил нас (ὀλεθρεύω). ἐξολεθρεύσαι σε κύριος καθὰ καὶ σήμερον — да погубит тебя Господь, как и сегодня. ἐλιθοβόλησαν αὐτὸν λίθοις πᾶς Ισραηλ — побили его камнями все Израиль (λιθοβολέω). Слав. добавляет «и сожгоша вся огнем, и наметаша их камением» — в gr нет."
  26: "ἐπέστησαν αὐτῷ σωρὸν λίθων μέγαν — поставили над ним груду камней великую (σωρός). ἐπαύσατο κύριος τοῦ θυμοῦ τῆς ὀργῆς — перестал Господь от ярости гнева. διὰ τοῦτο ἐπωνόμασεν αὐτὸ Εμεκαχωρ ἕως τῆς ἡμέρας ταύτης — поэтому назвал его Емекахор до сего дня (ἐπονομάζω)."
