verses:
  1: "そこで、主[しゅ]にあって囚人[しゅうじん]であるわたしは、あなたがたに勧[すす]める。あなたがたが召[め]された召[め]しにふさわしく歩[あゆ]みなさい。"
  2: "すべての謙遜[けんそん]と柔和[にゅうわ]とをもって、寛容[かんよう]をもって、愛[あい]のうちに互[たが]いに耐[た]え忍[しの]び、"
  3: "平和[へいわ]の束[たば]ねによって、霊[れい]の一致[いっち]を保[たも]つことに努[つと]めなさい。"
  4: "体[からだ]は一[ひと]つ、霊[れい]は一[ひと]つである。あなたがたが召[め]されたのも、召[め]しの希望[きぼう]が一[ひと]つであったのと同じである。"
  5: "主[しゅ]は一[ひと]つ、信仰[しんこう]は一[ひと]つ、洗礼[せんれい]は一[ひと]つである。"
  6: "神[かみ]は一[ひと]つ、すべての者[もの]の父[ちち]であり、すべてのものの上[うえ]にあり、すべてのものを貫[つらぬ]き、すべての者のうちにおられる。"
  7: "しかし、わたしたちの一人[ひとり]一人[ひとり]に、キリストの賜物[たまもの]の量[りょう]に応[おう]じて、恵[めぐ]みが与[あた]えられた。"
  8: "だから、こう言われている。「高[たか]みに上[のぼ]って、捕虜[ほりょ]を捕[とりこ]にし、人[ひと]々[びと]に賜物[たまもの]をお与[あた]えになった。」"
  9: "「上[のぼ]った」とは、どういうことか。それは、〔まず〕地[ち]の最[もっと]も低[ひく]い所[ところ]に下[くだ]られたということではないか。"
  10: "下[くだ]られた方[かた]こそ、すべての天[てん]の上[うえ]に上[のぼ]られた方[かた]であり、万物[ばんぶつ]を満[み]たすためである。"
  11: "そして、ご自身[じしん]が、ある者[もの]を使徒[しと]、ある者[もの]を預言者[よげんしゃ]、ある者[もの]を福音[ふくいん]を宣[の]べ伝[つた]える者[もの]、ある者[もの]を牧者[ぼくしゃ]また教師[きょうし]として与[あた]えられた。"
  12: "それは、聖徒[せいと]たちを整[ととの]え、奉仕[ほうし]の業[わざ]を行[おこな]わせ、キリストの体[からだ]を建[た]て上[あ]げるためである。"
  13: "ついには、わたしたちすべてが、信仰[しんこう]の一致[いっち]と、神[かみ]の子[こ]の知識[ちしき]とに達[たっ]し、成人[せいじん]となり、キリストの満[み]ちあふれる成長[せいちょう]の量[りょう]にまで至[いた]るためである。"
  14: "それは、もはやわたしたちが幼子[おさなご]ではなく、人[ひと]の欺[あざむ]きと、惑[まど]わしへと導[みちび]く策略[さくりゃく]の巧[たくみ]さによる、あらゆる教[おし]えの風[かぜ]に、波[なみ]に揺[ゆ]られて漂[ただよ]い、あちらこちらへ運[はこ]ばれる者[もの]とならないためである。"
  15: "むしろ、愛[あい]をもって真理[しんり]を語[かた]り、すべてのことにおいて、頭[かしら]であるキリストに向[む]かって成長[せいちょう]しよう。"
  16: "この方[かた]から、体[からだ]全体[ぜんたい]が、すべての関節[かんせつ]の助[たす]けによって組[く]み合[あ]わされ、結[むす]び合[あ]わされ、各部分[ぶぶん]がそれぞれの量[りょう]に応[おう]じて働[はたら]くことによって、体[からだ]の成長[せいちょう]を遂[と]げ、愛[あい]のうちに自分[じぶん]を建[た]て上[あ]げるのである。"
  17: "そこで、わたしは主[しゅ]にあって言[い]い、また証[あかし]する。あなたがたは、もはや、〔ほかの〕異邦人[いほうじん]がその思[おも]いの空[むな]しさのうちに歩[あゆ]むように歩[あゆ]んではならない。"
  18: "彼[かれ]らは思[おも]いが暗[くら]くされ、自分[じぶん]たちのうちにある無知[むち]と、心[こころ]の頑[かたくな]さのために、神[かみ]の命[いのち]から遠[とお]ざけられている。"
  19: "彼[かれ]らは無感覚[むかんかく]になって、自分[じぶん]を放縦[ほうじゅう]にゆだね、あらゆる汚[けが]れを貪欲[どんよく]に行[おこな]っている。"
  20: "しかし、あなたがたは、そのようにキリストを学[まな]んだのではない。"
  21: "もし、あなたがたが彼[かれ]を聞[き]き、彼[かれ]にあって教[おし]えられたのなら、イエスのうちに真理[しんり]があるとおり、"
  22: "あなたがたは、かつての生活[せいかつ]に従[したが]って、惑[まど]わしの欲[よく]によって朽[く]ちていく古[ふる]い人[ひと]を脱[ぬ]ぎ捨[す]て、"
  23: "心[こころ]の霊[れい]において新[あら]たにされ、"
  24: "真理[しんり]の義[ぎ]と聖[せい]とをもって、神[かみ]に従[したが]って造[つく]られた新[あたら]しい人[ひと]を着[き]なさい。"
  25: "だから、偽[いつわ]りを捨[す]てて、「それぞれ隣人[りんじん]と真理[しんり]を語[かた]れ」とあるとおりにしなさい。わたしたちは互[たが]いに肢体[したい]だからである。"
  26: "「怒[いか]ることはあっても、罪[つみ]を犯[おか]してはならない。」日[ひ]が暮[く]れるまで、あなたがたの怒[いか]りをそのままにしておいてはならない。"
  27: "また、悪魔[あくま]に場[ば]を与[あた]えてはならない。"
  28: "盗[ぬす]む者[もの]は、もはや盗[ぬす]んではならない。むしろ、労[ろう]して自分[じぶん]の手[て]で善[よ]いことを行[おこな]い、必要[ひつよう]な者[もの]に分[わ]け与[あた]えることができるようにしなさい。"
  29: "腐[くさ]った言葉[ことば]は、あなたがたの口[くち]から出[で]てはならない。むしろ、必要[ひつよう]に応[おう]じて建[た]て上[あ]げるのに役立[やくだ]つ良[よ]い言葉[ことば]があれば、それを語[かた]り、聞[き]く者[もの]たちに恵[めぐ]みを与[あた]えなさい。"
  30: "また、神[かみ]の{聖霊[せいれい]|聖神[せいしん]}を悲[かな]しませてはならない。あなたがたは、この方[かた]によって、贖[あがな]いの日[ひ]のために印[しるし]を押[お]されたのである。"
  31: "すべての苦[にが]味[み]、憤[いきどお]り、怒[いか]り、叫[さけ]び、ののしりは、すべての悪[あく]とともに、あなたがたの中[なか]から除[のぞ]き去[さ]りなさい。"
  32: "むしろ、互[たが]いに親切[しんせつ]にし、憐[あわ]れみ深[ぶか]い者[もの]となり、神[かみ]がキリストにあってあなたがたを赦[ゆる]してくださったように、互[たが]いに赦[ゆる]し合[あ]いなさい。"

notes:
  1: "παρακαλῶ — 勧める. ὁ δέσμιος ἐν κυρίῳ — 主にあって囚人 (ср. 3:1). ἀξίως περιπατῆσαι — ふさわしく歩む, инфинитив при παρακαλῶ."
  2: "μετὰ πάσης ταπεινοφροσύνης — すべての謙遜. πραΰτης — 柔和. μακροθυμία — 寛容. ἀνεχόμενοι ἀλλήλων — 互いに耐え忍ぶ (причастие, продолжается в 4:3)."
  3: "σπουδάζοντες τηρεῖν — 保つことに努める. ἑνότης τοῦ πνεύματος — 霊の一致. σύνδεσμος τῆς εἰρήνης — 平和の束ね."
  4: "ἓν σῶμα καὶ ἓν πνεῦμα — 体は一つ、霊は一つ. καθὼς καὶ ἐκλήθητε ἐν μιᾷ ἐλπίδι τῆς κλήσεως — 召しの希望も一つ."
  5: "εἷς κύριος, μία πίστις, ἓν βάπτισμα — 主・信仰・洗礼."
  6: "εἷς θεὸς καὶ πατὴρ πάντων — すべての者の父. ὁ ἐπὶ πάντων καὶ διὰ πάντων καὶ ἐν πᾶσιν — 上にあり、貫き、うちに. ἐν πᾶσιν понято как «во всех» (лица), ср. слав. «во всех нас»."
  7: "ἑνὶ δὲ ἑκάστῳ ἡμῶν — 一人一人に. κατὰ τὸ μέτρον τῆς δωρεᾶς τοῦ Χριστοῦ — キリストの賜物の量に応じて."
  8: "Пс 68:19 (67:19 LXX). ᾐχμαλώτευσεν αἰχμαλωσίαν — 捕虜を捕りこに. ἔδωκεν δόματα — 賜物を与えた (в Пс «принял»). Цитата — 「…」."
  9: "В базе нет πρῶτον; церковный текст (Елизаветинская «прежде», jp-joc「先づ」) читает с ним — 〔まず〕. Ἀνέβη — «восшёл»; риторический вопрос сохранён. κατώτερα [μέρη] — в базе в квадратных скобках, слово есть, 〔〕 не ставятся."
  10: "ὁ καταβὰς αὐτός — 下った方こそ. ὑπεράνω πάντων τῶν οὐρανῶν — すべての天の上. πληρώσῃ τὰ πάντα — 万物を満たす."
  11: "ἔδωκεν — дал: 与えられた. εὐαγγελιστάς — 福音を宣べ伝える者. ποιμένας καὶ διδασκάλους — 牧者また教師 (одна группа, как в греч.)."
  12: "καταρτισμός — 整え. ἔργον διακονίας — 奉仕の業. οἰκοδομή — 建て上げ."
  13: "εἰς ἄνδρα τέλειον — 成人. μέτρον ἡλικίας τοῦ πληρώματος — 満ちあふれる成長の量; ἡλικία — возраст и рост, двусмысленность сохранена."
  14: "νήπιοι — 幼子. κυβεία — «игра в кости», обман; 欺き. μεθοδεία τῆς πλάνης — 惑わしへと導く策略."
  15: "ἀληθεύοντες ἐν ἀγάπῃ — 愛をもって真理を語る. αὐξήσωμεν — сослагательное 1 л. мн. ч.; 成長しよう."
  16: "ἁφή — связь, сочленение; 関節. ἐπιχορηγία — 助け. ἐν μέτρῳ ἑνὸς ἑκάστου μέρους — 各部分がそれぞれの量に応じて. εἰς οἰκοδομὴν ἑαυτοῦ — 自分を建て上げる."
  17: "В базе нет λοιπά; церковный текст (Елизаветинская «прочии», слав. «прочіи») читает с ним — 〔ほかの〕; jp-joc без него. ματαιότης τοῦ νοός — 思いの空しさ."
  18: "ἐσκοτωμένοι τῇ διανοίᾳ — 思いが暗くされ. ἀπηλλοτριωμένοι — 遠ざけられ. πώρωσις — 頑なさ."
  19: "ἀπηλγηκότες — 無感覚になって. ἀσέλγεια — 放縦. ἐν πλεονεξίᾳ — 貪欲に."
  20: "οὐχ οὕτως ἐμάθετε — そのように学んだのではない."
  21: "εἴ γε — もし…のなら. ἀλήθεια ἐν τῷ Ἰησοῦ — イエスのうちにある真理. Стих кончается запятой: продолжение в 4:22."
  22: "ἀποθέσθαι — 脱ぎ捨てる. παλαιὸς ἄνθρωπος — 古い人. ἐπιθυμίαι τῆς ἀπάτης — 惑わしの欲."
  23: "ἀνανεοῦσθαι τῷ πνεύματι τοῦ νοός — 心の霊において新たにされる."
  24: "καινὸς ἄνθρωπος — 新しい人. ὁσιότης τῆς ἀληθείας — 真理の聖."
  25: "Зах 8:16 — 「…」. ἀποθέμενοι τὸ ψεῦδος — 偽りを捨てて. μέλη ἀλλήλων — 互いに肢体."
  26: "Пс 4:5 — 「…」. ὀργίζεσθε καὶ μὴ ἁμαρτάνετε — 怒ることはあっても罪を犯してはならない. ὁ ἥλιος μὴ ἐπιδυέτω ἐπὶ τῷ παροργισμῷ — 日が暮れるまで、怒りをそのままにしない."
  27: "μηδὲ δίδοτε τόπον τῷ διαβόλῳ — 悪魔に場を与える."
  28: "κοπιάτω ἐργαζόμενος ταῖς ἰδίαις χερσίν — 自分の手で善いことをして労する. μεταδιδόναι τῷ χρείαν ἔχοντι — 必要な者に分け与える."
  29: "λόγος σαπρός — 腐った言葉. πρὸς οἰκοδομὴν τῆς χρείας — 必要に応じて建て上げる (в слав. и Синод. «в вере» — иное чтение; в базе χρεία). ἵνα δῷ χάριν — 恵みを与える."
  30: "τὸ πνεῦμα τὸ ἅγιον τοῦ θεοῦ — {聖霊|聖神}. ἐσφραγίσθητε εἰς ἡμέραν ἀπολυτρώσεως — 贖いの日のために印を押された."
  31: "πικρία, θυμός, ὀργή, κραυγή, βλασφημία — 苦味・憤り・怒り・叫び・ののしり. ἀρθήτω ἀφ᾽ ὑμῶν — あなたがたから除き去りなさい."
  32: "χρηστοί — 親切. εὔσπλαγχνοι — 憐れみ深い. χαριζόμενοι ἑαυτοῖς — 赦し合う. ὁ θεὸς ἐν Χριστῷ ἐχαρίσατο — 神がキリストにあって赦してくださった."
