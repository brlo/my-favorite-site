# jp-box, Послание к Ефесянам, глава 4. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный 常体, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 4: единство Духа (1–6), дары и тело (7–16), ветхий и новый человек (17–24),
# гнев, кража, гнилое слово (25–32).
# Красного и синего нет: прямой речи Христа в послании нет, <j>/<mo> не ставятся.
# 〔…〕: 4:9 — церковное πρῶτον (〔まず〕); 4:17 — церковное λοιπά (〔ほかの〕).
# Проверено по базе: πρῶτον в 4:9 — 0 вхождений, λοιπά в 4:17 — 0 вхождений.
# Сносок ⟨…⟩ в главе нет: слова понятны без пояснений. jp-ni не использовался.

