# jp-box, Премудрость Соломона, глава 6. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для главы есть фрагментами (6:1–3, 12,
# 14–16, 18, 21–23) — служил контролем чтения, архаизмы не копировались; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 6: обращение к царям и судьям (1–11), премудрость и её происхождение (12–25).
# Прямой речи нет: всё — речь автора, обращённая к царям; красного и синего нет.
# Нумерация по gr: 25 стихов. Слав. сдвиги (держимся деления gr):
#   csl 6:18 вбирает гр. 6:17b («φροντὶς δὲ παιδείας ἀγάπη» — «попечение же наказания
#   любы»), csl 6:19 вбирает гр. 6:18b («προσοχὴ δὲ νόμων βεβαίωσις ἀφθαρσίας» —
#   «хранение же законов утверждение нерастления»); счёт при этом совпадает,
#   стихи перекрываются (отмечено в notes 17–19).
#   csl 6:23–24 — два стиха сверх gr (вторая и третья части гр. 6:22: «и не утаю от
#   вас таин…», «и положу на свет разум ея…»), они влиты в наш 6:22, стихов не
#   добавляем. У csl 27 стихов, у gr 25.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz. Сносок ⟨…⟩ нет.

tr_code: jp-box
book: prs
chapter: 6
draft: true

verses:
  1: "それゆえ、王[おう]たちよ、聞[き]いて悟[さと]れ。地[ち]の果[は]ての裁[さば]き手[て]たちよ、学[まな]べ。"
  2: "多[おお]くの民[たみ]を治[おさ]める者[もの]、諸国[しょこく]の群[む]れを誇[ほこ]る者[もの]たちよ、耳[みみ]を傾[かたむ]けよ。"
  3: "支[し]配[はい]は主[しゅ]から、力[ちから]は高[たか]い方[かた]からあなたがたに与[あた]えられた。その方[かた]はあなたがたの行[おこな]いを調[しら]べ、その企[くわだ]てを探[さぐ]り出[だ]される。"
  4: "あなたがたはその方[かた]の王国[おうこく]の仕[つか]え人[にん]でありながら、正[ただ]しく裁[さば]かず、律法[りっぽう]を守[まも]らず、神[かみ]の御心[みこころ]に従[したが]って歩[あゆ]まなかった。"
  5: "その方は恐[おそ]ろしく、また速[すみ]やかにあなたがたに臨[のぞ]まれる。支[し]配[はい]する者[もの]には、厳[きび]しい裁[さば]きが下[くだ]るからである。"
  6: "小[ちい]さな者[もの]はあわれみを受[う]けるに値[あたい]するが、強[つよ]い者[もの]は力[ちから]強[づよ]く調[しら]べられる。"
  7: "すべての者[もの]の主[しゅ]は、だれの顔[かお]も立[た]てず、大[おお]きな者[もの]をはばかることもない。小[ちい]さな者も大きな者も、ご自分[じぶん]が造[つく]られたからであり、すべての者[もの]を同[おな]じように顧[かえり]みられる。"
  8: "しかし、権力[けんりょく]ある者[もの]には、厳[きび]しい追及[ついきゅう]が待[ま]ち受[う]けている。"
  9: "それゆえ、王[おう]たちよ、わたしの言[ことば]はあなたがたに向[む]けられている。知恵[ちえ]を学[まな]び、倒[たお]れないためである。"
  10: "聖[せい]なるものを聖[せい]なるままに守[まも]る者[もの]は聖とされ、それを学[まな]んだ者[もの]は弁明[べんめい]を得[え]る。"
  11: "それゆえ、わたしの言[ことば]を慕[した]い求[もと]めよ。これを愛[あい]し、教[きょう]えを受[う]けよ。"
  12: "知恵[ちえ]は輝[かがや]かしく、朽[く]ちない。これを愛[あい]する者[もの]にはたやすく見[み]られ、これを求[もと]める者[もの]には見[み]いだされる。"
  13: "知恵[ちえ]は、これを知[し]ろうと願[ねが]う者[もの]たちに先[さき]に現[あらわ]れる。"
  14: "朝[あさ]早[はや]くから知恵[ちえ]を尋[たず]ねる者[もの]は疲[つか]れることがない。自分[じぶん]の門[もん]のそばにこれが座[すわ]っているのを見[み]いだすからである。"
  15: "これについて思[おも]いを巡[めぐ]らすこと自体[じたい]が思慮[しりょ]の完成[かんせい]であり、これのために夜[よ]を眠[ねむ]らずに過[す]ごす者[もの]は、やがて心[こころ]の安[やす]らぎを得[え]る。"
  16: "知恵[ちえ]は、自分[じぶん]にふさわしい者[もの]たちを自[みずか]ら巡[めぐ]って尋[たず]ね、道[みち]の上[うえ]で親[した]しく姿[すがた]を現[あらわ]し、あらゆる思[おも]いの中[なか]で彼らに出会[であ]うからである。"
  17: "知恵[ちえ]の始[はじ]めは、教[きょう]えを求[もと]める真実[しんじつ]な願[ねが]いであり、教えへの関心[かんしん]は愛[あい]である。"
  18: "知恵[ちえ]への愛[あい]はその律法[りっぽう]を守[まも]ることであり、律法を守ることは不滅[ふめつ]の確[かく]保[ほ]である。"
  19: "不滅[ふめつ]は人[ひと]を神[かみ]の近[ちか]くに置[お]く。"
  20: "それゆえ、知恵[ちえ]への願[ねが]いは人[ひと]を王国[おうこく]へと導[みちび]き上[のぼ]らせる。"
  21: "それゆえ、もしあなたがたが王座[おうざ]と王笏[おうしゃく]を喜[よろこ]びとするなら、民[たみ]の王[おう]たちよ、知恵[ちえ]を敬[うやま]え。とこしえに治[おさ]めるためである。"
  22: "知恵[ちえ]とは何[なん]であり、どのように生[う]まれたのか、わたしは告[つ]げ知[し]らせ、あなたがたに秘密[ひみつ]を隠[かく]さない。むしろ、その成[な]り立[た]ちの始[はじ]めから詳[くわ]しく調[しら]べ、その知識[ちしき]を明[あき]らかなものとし、真理[しんり]を決[けっ]して見[み]過[す]ごさない。"
  23: "また、ねたみに溶[と]け崩[くず]れる者[もの]と道[みち]をともにすることをしない。そのような者[もの]は知恵[ちえ]と関[かか]わりを持[も]たないからである。"
  24: "多[おお]くの知恵[ちえ]ある者[もの]は世[よ]の救[すく]いであり、思慮[しりょ]ある王[おう]は民[たみ]の安定[あんてい]である。"
  25: "それゆえ、わたしの言[ことば]によって教[きょう]えを受[う]けよ。そうすれば、あなたがたは益[えき]を得[え]る。"

notes:
  1: "Ἀκούσατε … βασιλεῖς — 王たちよ、聞け (императив при звательном). σύνετε — 悟れ (συνίημι — понимать). δικασταὶ περάτων γῆς — 地の果ての裁き手たち (δικαστής — судья); слав. «судии концев земли». Начало обращения к царям и судьям (6:1–11)."
  2: "ἐνωτίσασθε — 耳を傾けよ (ἐνωτίζομαι — внимать, слушать). οἱ κρατοῦντες πλήθους — 多くの民を治める者 (κρατέω — властвовать). γεγαυρωμένοι ἐπὶ ὄχλοις ἐθνῶν — 諸国の群れを誇る者 (γαυρόομαι — гордиться); слав. «гордящиися о народех языков»."
  3: "ἐδόθη παρὰ κυρίου ἡ κράτησις — 支配は主から与えられた (κράτησις — держава, власть); слав. «дана есть от Господа держава». ἡ δυναστεία παρὰ ὑψίστου — 力は高い方から (δυναστεία — могущество, сила); слав. «сила от вышняго». ἐξετάσει … τὰ ἔργα — 行いを調べる (ἐξετάζω — исследовать). τὰς βουλὰς διερευνήσει — 企てを探り出す (διερευνάω — разыскивать, выслеживать)."
  4: "ὑπηρέται ὄντες τῆς αὐτοῦ βασιλείας — その方の王国の仕え人でありながら (ὑπηρέτης — служитель); слав. «слузи суще Царства его». οὐκ ἐκρίνατε ὀρθῶς — 正しく裁かなかった (κρίνω). οὐδὲ ἐφυλάξατε νόμον — 律法を守らなかった (φυλάσσω). κατὰ τὴν βουλὴν τοῦ θεοῦ — 神の御心に従って (βουλή — воля, совет); слав. «по воли Божией»."
  5: "φρικτῶς καὶ ταχέως ἐπιστήσεται — 恐ろしく、また速やかに臨む (φρικτός — ужасный; ἐφίστημι — наступать, являться). κρίσις ἀπότομος — 厳しい裁き (ἀπότομος — резкий, строгий); слав. «суд жесточайший». ἐν τοῖς ὑπερέχουσιν — 支配する者には (ὑπερέχω — превосходить, начальствовать)."
  6: "ὁ ἐλάχιστος — 小さな者 (ἐλάχιστος — наименьший). συγγνωστός ἐλέους — あわれみを受けるに値する (συγγνωστός — заслуживающий прощения; родительный падеж при нём); слав. «достоин есть милости». δυνατοὶ … ἐτασθήσονται — 強い者は調べられる (ἐτάζω — испытывать); слав. «сильнии же сильне истязани будут» — повтор δυνατῶς сохранён (力強く)."
  7: "οὐχ ὑποστελεῖται πρόσωπον — だれの顔も立てない (ὑποστέλλομαι — уклоняться, щадить; πρόσωπον — лицо); слав. «не щадит лица». οὐδὲ ἐντραπήσεται μέγεθος — 大きな者をはばからない (ἐντρέπομαι — стыдиться). ὁ πάντων δεσπότης — すべての者の主 (δεσπότης — Владыка, здесь не κύριος). ὁμοίως προνοεῖ περὶ πάντων — すべての者を同じように顧みる (προνοέω — промышлять); слав. «подобне… проразумевает о всех»."
  8: "τοῖς κραταιοῖς — 権力ある者たちに (κραταιός — сильный, державный). ἰσχυρὰ ἐφίσταται ἔρευνα — 厳しい追及が待ち受ける (ἰσχυρός — крепкий; ἔρευνα — исследование, испытание); слав. «державным же крепко настоит испытание». Стих продолжает мысль 6:6–7."
  9: "πρὸς ὑμᾶς … οἱ λόγοι μου — わたしの言葉はあなたがたに向けられている (πρός с вин. — к). ὦ τύραννοι — 王たちよ (τύραννος — властитель, тиран); слав. «о, царие» — 王, по паритету взято церковное слово, LXX-чтение «тираны, властители» отмечено. ἵνα μάθητε σοφίαν — 知恵を学ぶため. μὴ παραπέσητε — 倒れない (παραπίπτω — отпадать, падать)."
  10: "φυλάξαντες ὁσίως τὰ ὅσια — 聖なるものを聖なるままに守る (ὅσιος — святой; винительный внутреннего содержания, «свято хранить святое»); слав. «сохраняющии преподобне преподобная». ὁσιωθήσονται — 聖とされる (ὁσιάζω — освящать); слав. «преподобни будут». εὑρήσουσιν ἀπολογίαν — 弁明を得る (ἀπολογία — оправдание, ответ); слав. «обрящут ответ»."
  11: "ἐπιθυμήσατε — 慕い求めよ (ἐπιθυμέω — желать). ποθήσατε — 愛せよ (ποθέω — страстно желать). παιδευθήσεσθε — 教えを受ける (παιδεύω — наставлять, наказывать); слав. «накажитеся». Императивы с результатом в будущем."
  12: "Λαμπρὰ καὶ ἀμάραντος — 輝かしく、朽ちない (λαμπρός — светлый, яркий; ἀμάραντος — неувядаемый); слав. «светла и не увядаема». εὐχερῶς θεωρεῖται — たやすく見られる (εὐχερής — легко доступный; θεωρέω — созерцать). ὑπὸ τῶν ἀγαπώντων … ὑπὸ τῶν ζητούντων — 愛する者に…求める者に. Начало речи о премудрости и её происхождении (6:12–25)."
  13: "φθάνει — 先に現れる (φθάνω — предварять, упреждать). τοὺς ἐπιθυμοῦντας προγνωσθῆναι — 知ろうと願う者たち (προγινώσκομαι — быть узнанным заранее); слав. «предваряет желающым предуведетися»."
  14: "ὁ ὀρθρίσας πρὸς αὐτήν — 朝早くからこれを尋ねる者 (ὀρθρίζω — вставать рано, с рассвета). οὐ κοπιάσει — 疲れることがない (κοπιάω — утруждаться). πάρεδρον — そばに座っている (πάρεδρος — сидящий рядом); слав. «приседящую». τῶν πυλῶν αὐτοῦ — 自分の門の (πύλη — ворота; αὐτοῦ — ищущего, «его врат»)."
  15: "τὸ ἐνθυμηθῆναι περὶ αὐτῆς — これについて思いを巡らすこと (ἐνθυμέομαι — размышлять, замышлять). φρονήσεως τελειότης — 思慮の完成 (φρόνησις — благоразумие; τελειότης — совершенство); слав. «разума… совершенство». ὁ ἀγρυπνήσας δι᾽ αὐτήν — これのために夜を眠らずに過ごす者 (ἀγρυπνέω — бодрствовать); слав. «бдяй ея ради». ἀμέριμνος — 心の安らぎを得た (ἀμέριμνος — свободный от забот); слав. «без печали»."
  16: "τοὺς ἀξίους αὐτῆς — 自分にふさわしい者たち (ἄξιος — достойный). περιέρχεται ζητοῦσα — 巡って尋ねる (περιέρχομαι — обходить). ἐν ταῖς τρίβοις φαντάζεται … εὐμενῶς — 道の上で親しく姿を現す (φαντάζομαι — являться; εὐμενής — благосклонный); слав. «на стезях показуется им благоприятно». ἐν πάσῃ ἐπινοίᾳ ὑπαντᾷ — あらゆる思いの中で出会う (ἐπίνοια — мысль, замысел; ὑπαντάω — встречать); слав. «во всем провидении сретает их»."
  17: "ἀρχὴ γὰρ αὐτῆς — 知恵の始め (ἀρχή — начало). ἡ ἀληθεστάτη παιδείας ἐπιθυμία — 教えを求める真実な願い (ἀληθής в превосходной степени — самый истинный; παιδεία — учение, наставление); слав. «истиннейшее наказания возжеление». φροντὶς δὲ παιδείας ἀγάπη — 教えへの関心は愛である: эта половина у csl открывает 6:18 («попечение же наказания любы»), по делению gr она в нашем 6:17."
  18: "ἀγάπη δὲ τήρησις νόμων αὐτῆς — 知恵への愛はその律法を守ること (τήρησις — соблюдение, хранение). προσοχὴ δὲ νόμων — 律法を守ること (προσοχή — внимание, усердие). βεβαίωσις ἀφθαρσίας — 不滅の確保 (βεβαίωσις — утверждение, обеспечение; ἀφθαρσία — нетление, 不滅). У csl эта половина — в 6:19 («хранение же законов утверждение нерастления»), перекрытие отмечено."
  19: "ἀφθαρσία δὲ ἐγγὺς εἶναι ποιεῖ θεοῦ — 不滅は人を神の近くに置く (ἐγγύς — близко); слав. «нерастление же творит близ быти Бога». Первая половина csl 6:19 («хранение же законов утверждение нерастления») относится к гр. 6:18 и переведена там."
  20: "ἐπιθυμία ἄρα σοφίας — 知恵への願い (ἐπιθυμία — желание). ἀνάγει ἐπὶ βασιλείαν — 王国へと導き上らせる (ἀνάγω — возводить); слав. «возжеление… возводит к Царству». Слав. добавляет в скобках «(вечному)» — пояснение переводчика, в тексте не отражено."
  21: "ἥδεσθε ἐπὶ θρόνοις καὶ σκήπτροις — 王座と王笏を喜びとする (ἥδομαι — наслаждаться; σκῆπτρον — скипетр). τύραννοι λαῶν — 民の王たち (о τύραννος см. 6:9: по csl «царие»). τιμήσατε σοφίαν — 知恵を敬え (τιμάω — чтить). εἰς τὸν αἰῶνα βασιλεύσητε — とこしえに治める (βασιλεύω — царствовать); слав. «почтите премудрость, да во веки царствуете»."
  22: "τί δέ ἐστιν σοφία καὶ πῶς ἐγένετο — 知恵とは何であり、どのように生まれたのか. ἀπαγγελῶ — 告げ知らせる (ἀπαγγέλλω). οὐκ ἀποκρύψω ὑμῖν μυστήρια — あなたがたに秘密を隠さない (ἀποκρύπτω; μυστήριον). ἀπ᾽ ἀρχῆς γενέσεως ἐξιχνιάσω — 成り立ちの始めから詳しく調べる (ἐξιχνιάζω — исследовать, выслеживать). θήσω εἰς τὸ ἐμφανὲς τὴν γνῶσιν — 知識を明らかにする (ἐμφανής — явный); слав. «положу на свет разум ея». οὐ μὴ παροδεύσω τὴν ἀλήθειαν — 真理を決して見過ごさない (παροδεύω — проходить мимо). У csl этот стих разделён на три (csl 6:22–24: «Что же есть премудрость…», «и не утаю от вас таин…», «и положу на свет разум ея…»); всё содержание влито в наш 6:22, стихов не добавляем."
  23: "οὔτε μὴν φθόνῳ τετηκότι συνοδεύσω — ねたみに溶け崩れる者と道をともにすることをしない (φθόνος — зависть; τήκω — плавить, изнывать; συνοδεύω — идти вместе); слав. «ниже завистию тающему спутьствую». οὐ κοινωνήσει σοφίᾳ — 知恵と関わりを持たない (κοινωνέω — иметь общение, быть причастным); слав. «не будет причастник премудрости»."
  24: "πλῆθος σοφῶν — 多くの知恵ある者 (πλῆθος — множество). σωτηρία κόσμου — 世の救い (σωτηρία — спасение; κόσμος — мир). βασιλεὺς φρόνιμος — 思慮ある王 (φρόνιμος — разумный). εὐστάθεια δήμου — 民の安定 (εὐστάθεια — устойчивость, благосостояние); слав. «утверждение людем»."
  25: "ὥστε — それゆえ (вывод). παιδεύεσθε τοῖς ῥήμασίν μου — わたしの言葉によって教えを受けよ (παιδεύω с дат. — наставлять; ῥῆμα — слово); слав. «приимите наказание по словесем моим». ὠφεληθήσεσθε — 益を得る (ὠφελέω — приносить пользу). Конец обращения к царям."
