verses:
  1: "王[おう]ダビデは年[とし]を重[かさ]ね、日[ひ]を経[へ]て老[お]いていた。人[ひと]々[びと]は衣[ころも]を幾[いく]重[かさ]にも着[き]せたが、彼[かれ]は暖[あたた]まらなかった。"
  2: "家来[けらい]たちは彼[かれ]に言[い]った。「わたしたちの主[しゅ]君[くん]である王[おう]のために、若[わか]い処女[しょじょ]を探[さが]させよ。彼女[かのじょ]は王[おう]のそばに立[た]ち、王[おう]を暖[あたた]め、王[おう]とともに寝[ね]る。そうすれば、わたしたちの主[しゅ]君[くん]である王[おう]は暖[あたた]まる。」"
  3: "彼[かれ]らはイスラエルの全[ぜん]領[りょう]土[ど]から美[うつく]しい若[わか]い女[おんな]を探[さが]し、シュネム人[じん]のアビシャグを見[み]つけて、王[おう]のもとへ連[つ]れて来[き]た。"
  4: "その女[おんな]は非常[ひじょう]に美[うつく]しかった。彼女[かのじょ]は王[おう]を暖[あたた]め、王[おう]に仕[つか]えたが、王[おう]は彼女[かのじょ]を知[し]らなかった。"
  5: "ハギトの子[こ]アドニヤは高[たか]ぶり、言[い]った。「わたしが王[おう]になる。」そして自分[じぶん]のために戦車[せんしゃ]と騎兵[きへい]を整[ととの]え、自分[じぶん]の前[まえ]を走[はし]る五[ご]十人[じゅうにん]の男[おとこ]たちを置[お]いた。"
  6: "父[ちち]は彼[かれ]を一度[いちど]も止[と]めず、「なぜ、そんなことをしたのか」と言[い]わなかった。彼[かれ]は非常[ひじょう]に美[うつく]しい顔[かお]だちで、アブサロムの後[あと]に生[う]まれた。"
  7: "彼[かれ]はツルヤの子[こ]ヨアブや祭司[さいし]アビアタルと相談[そうだん]し、彼[かれ]らはアドニヤに味方[みかた]した。"
  8: "しかし、祭司[さいし]サドク、ヨヤダの子[こ]ベナヤ、預言者[よげんしゃ]ナタン、シメイ、レイ、そしてダビデの勇者[ゆうしゃ]たちは、アドニヤの側[がわ]につかなかった。"
  9: "アドニヤは、ロゲルの泉[いずみ]のそばにあるゾヘレトの石[いし]のところで、羊[ひつじ]と子牛[こうし]と子[こ]羊[ひつじ]を屠[ほふ]り、兄弟[きょうだい]である王[おう]の子[こ]ら全員[ぜんいん]と、ユダの身分[みぶん]の高[たか]い者[もの]たち、王[おう]に仕[つか]える者[もの]たちをみな招[まね]いた。"
  10: "しかし、預言者[よげんしゃ]ナタン、ベナヤ、勇者[ゆうしゃ]たち、そして自分[じぶん]の兄弟[きょうだい]ソロモンは招[まね]かなかった。"
  11: "ナタンはソロモンの母[はは]バテシバに言[い]った。「ハギトの子[こ]アドニヤが王[おう]になったのを聞[き]かなかったのか。わたしたちの主[しゅ]君[くん]ダビデはそれを知[し]らないのに。」"
  12: "「さあ、今[いま]、わたしはあなたに一[ひと]つ助言[じょげん]しよう。あなたは自分[じぶん]の命[いのち]と、子[こ]どもソロモンの命[いのち]を救[すく]い出[だ]すのだ。」"
  13: "「行[い]って、王[おう]ダビデのもとへ入[はい]り、こう言[い]いなさい。『わたしの主[しゅ]君[くん]である王[おう]よ、あなたははしために、ソロモン、あなたの子[こ]はわたしの後[あと]に王[おう]となり、彼[かれ]がわたしの王座[おうざ]に座[すわ]ると誓[ちか]ったのではなかったか。それなのに、なぜアドニヤが王[おう]になったのか』と。」"
  14: "「見[み]よ、あなたがまだそこで王[おう]と語[かた]っているうちに、わたしもあなたの後[あと]から入[はい]って、あなたの言葉[ことば]を補[おぎな]う。」"
  15: "バテシバは王[おう]の寝室[しんしつ]に入[はい]った。王[おう]は非常[ひじょう]に老[お]いており、シュネム人[じん]のアビシャグが王[おう]に仕[つか]えていた。"
  16: "バテシバは身[み]をかがめて王[おう]を拝[おが]んだ。王[おう]が言[い]った。「どうしたのか。」"
  17: "彼女[かのじょ]は言[い]った。「わたしの主[しゅ]君[くん]である王[おう]よ。あなたは主[しゅ]なるあなたの神[かみ]によって、はしために、『ソロモン、あなたの子[こ]はわたしの後[あと]に王[おう]となり、彼[かれ]がわたしの王座[おうざ]に座[すわ]る』と誓[ちか]った。"
  18: "ところが今[いま]、見[み]よ、アドニヤが王[おう]になっているのに、わたしの主[しゅ]君[くん]である王[おう]はそれを知[し]らないのだ。"
  19: "彼[かれ]は子牛[こうし]と子[こ]羊[ひつじ]と羊[ひつじ]を多[おお]く屠[ほふ]り、王[おう]の子[こ]ら全員[ぜんいん]、祭司[さいし]アビアタル、軍[ぐん]の長[ちょう]ヨアブを招[まね]いたが、あなたのしもべソロモンは招[まね]かなかった。"
  20: "わたしの主[しゅ]君[くん]である王[おう]よ、全[ぜん]イスラエルの目[め]はあなたに注[そそ]がれている。あなたの後[あと]に、わたしの主[しゅ]君[くん]である王[おう]の王座[おうざ]にだれが座[すわ]るのかを、彼[かれ]らに告[つ]げ知[し]らせるために。"
  21: "そうでなければ、わたしの主[しゅ]君[くん]である王[おう]が父[ちち]たちとともに眠[ねむ]られたとき、わたしと子[こ]どもソロモンは罪[つみ]ある者[もの]とされるだろう。」"
  22: "彼女[かのじょ]がまだ王[おう]と語[かた]っていると、見[み]よ、預言者[よげんしゃ]ナタンが来[き]た。"
  23: "王[おう]に、「見[み]よ、預言者[よげんしゃ]ナタンが参[まい]った」と告[つ]げる者[もの]があった。彼[かれ]は王[おう]の前[まえ]に入[はい]り、顔[かお]を地[ち]につけて王[おう]を拝[おが]んだ。"
  24: "ナタンは言[い]った。「わたしの主[しゅ]君[くん]である王[おう]よ。あなたは、『アドニヤはわたしの後[あと]に王[おう]となり、彼[かれ]がわたしの王座[おうざ]に座[すわ]る』と言[い]われたのか。"
  25: "今日[きょう]、彼[かれ]は下[くだ]って行[い]き、子牛[こうし]と子[こ]羊[ひつじ]と羊[ひつじ]を多[おお]く屠[ほふ]り、王[おう]の子[こ]ら全員[ぜんいん]、軍[ぐん]の長[ちょう]たち、祭司[さいし]アビアタルを招[まね]いた。そして見[み]よ、彼[かれ]らは彼[かれ]の前[まえ]で食[た]べ飲[の]みしながら、『アドニヤ王[おう]、万歳[ばんざい]』と言[い]っている。"
  26: "しかし、このわたし、あなたのしもべを、また祭司[さいし]サドク、ヨヤダの子[こ]ベナヤ、あなたのしもべソロモンを招[まね]かなかった。"
  27: "この事[こと]がわたしの主[しゅ]君[くん]である王[おう]の意[い]によって起[お]こったのなら、なぜ、あなたのしもべに、あなたの後[あと]にだれがわたしの主[しゅ]君[くん]である王[おう]の王座[おうざ]に座[すわ]るのかを告[つ]げ知[し]らせなかったのか。」"
  28: "ダビデ王[おう]は答[こた]えて言[い]った。「わたしのためにバテシバを呼[よ]べ。」彼女[かのじょ]は王[おう]の前[まえ]に入[はい]り、彼[かれ]の前に立[た]った。"
  29: "王[おう]は誓[ちか]って言[い]った。「主[しゅ]は生[い]きておられる。主[しゅ]はあらゆる苦[くる]しみからわたしの命[いのち]を救[すく]い出[だ]してくださった。"
  30: "わたしが、イスラエルの神[かみ]である主[しゅ]によってあなたに、『ソロモン、あなたの子[こ]はわたしの後[あと]に王[おう]となり、彼[かれ]がわたしの代[か]わりにわたしの王座[おうざ]に座[すわ]る』と誓[ちか]ったとおり、今日[きょう]、そのとおりにする。」"
  31: "バテシバは顔[かお]を地[ち]につけて王[おう]を拝[おが]み、言[い]った。「わたしの主[しゅ]君[くん]、ダビデ王[おう]が永遠[えいえん]に生[い]きておられるように。」"
  32: "ダビデ王[おう]は言[い]った。「祭司[さいし]サドク、預言者[よげんしゃ]ナタン、ヨヤダの子[こ]ベナヤをわたしのところへ呼[よ]べ。」彼[かれ]らは王[おう]の前[まえ]に入[はい]った。"
  33: "王[おう]は彼[かれ]らに言[い]った。「あなたがたの主[しゅ]君[くん]のしもべたちを伴[とも]い、わたしの子[こ]ソロモンをわたしのラバに乗[の]せて、ギオンへ下[くだ]らせよ。"
  34: "そこでは、祭司[さいし]サドクと預言者[よげんしゃ]ナタンが、彼[かれ]をイスラエルの王[おう]として油[あぶら]を注[そそ]ぐ。あなたがたは角笛[つのぶえ]を吹[ふ]き、「ソロモン王[おう]、万歳[ばんざい]」と言[い]え。"
  35: "あなたがたは彼[かれ]の後[あと]について行[い]け。彼[かれ]は入[はい]って、わたしの王座[おうざ]に座[すわ]り、わたしの代[か]わりに王[おう]となる。わたしは、彼[かれ]がイスラエルとユダの上[うえ]の支配[しはい]者[しゃ]となることを命[めい]じた。」"
  36: "ヨヤダの子[こ]ベナヤは王[おう]に答[こた]えて言[い]った。「そのとおりになるように。わたしたちの主[しゅ]君[くん]である王[おう]の神[かみ]である主[しゅ]が、そのとおりに確[かた]くしてくださるように。"
  37: "主[しゅ]がわたしの主[しゅ]君[くん]である王[おう]とともにおられたように、ソロモンともともにおられ、彼[かれ]の王座[おうざ]を、わたしの主[しゅ]君[くん]であるダビデ王[おう]の王座[おうざ]よりも大[おお]きくしてくださるように。」"
  38: "祭司[さいし]サドク、預言者[よげんしゃ]ナタン、ヨヤダの子[こ]ベナヤ、ケレティ人[じん]、ペレティ人[じん]が下[くだ]って行[い]き、ソロモンをダビデ王[おう]のラバに乗[の]せ、ギオンへ連[つ]れて行[い]った。"
  39: "祭司[さいし]サドクは幕屋[まくや]から油[あぶら]の角[つの]を取[と]り、ソロモンに油[あぶら]を注[そそ]いだ。そして角笛[つのぶえ]を吹[ふ]くと、民[たみ]はみな、「ソロモン王[おう]、万歳[ばんざい]」と言[い]った。"
  40: "民[たみ]はみな彼[かれ]の後[あと]について上[のぼ]り、輪[わ]になって踊[おど]り、大[おお]いに喜[よろこ]んだ。その声[こえ]で地[ち]が裂[さ]けるほどだった。"
  41: "アドニヤと、彼[かれ]に招[まね]かれた者[もの]たちはみな、これを聞[き]いた。彼[かれ]らはちょうど食[た]べ終[お]えたところだった。ヨアブは角笛[つのぶえ]の音[ね]を聞[き]いて言[い]った。「なぜ、町[まち]が騒[さわ]いでいるのか。」"
  42: "彼[かれ]がまだ話[はな]していると、見[み]よ、祭司[さいし]アビアタルの子[こ]ヨナタンが来[き]た。アドニヤは言[い]った。「入[はい]れ。あなたは力[ちから]ある男[おとこ]だから、きっといい知[し]らせを持[も]って来[き]たのだろう。」"
  43: "ヨナタンは答[こた]えて言[い]った。「そのとおり。わたしたちの主[しゅ]君[くん]であるダビデ王[おう]がソロモンを王[おう]にしたのだ。"
  44: "王[おう]は彼[かれ]とともに祭司[さいし]サドク、預言者[よげんしゃ]ナタン、ヨヤダの子[こ]ベナヤ、ケレティ人[じん]、ペレティ人[じん]を送[おく]り、彼[かれ]らは彼[かれ]を王[おう]のラバに乗[の]せた。"
  45: "祭司[さいし]サドクと預言者[よげんしゃ]ナタンはギオンで彼[かれ]に油[あぶら]を注[そそ]いで王[おう]とした。彼[かれ]らはそこから喜[よろこ]びながら上[のぼ]って来[き]て、町[まち]が騒[さわ]ぎ立[た]った。これが、あなたがたの聞[き]いた声[こえ]だ。」"
  46: "そしてソロモンは王[おう]の王座[おうざ]に座[すわ]った。"
  47: "王[おう]のしもべたちも来[き]て、わたしたちの主[しゅ]君[くん]であるダビデ王[おう]を祝[いわ]い、こう言[い]った。「あなたの神[かみ]が、あなたの名[な]よりもソロモン、あなたの子[こ]の名[な]を高[たか]め、彼[かれ]の王座[おうざ]をあなたの王座[おうざ]よりも大[おお]きくしてくださるように。」すると、王[おう]は寝床[ねどこ]の上[うえ]で身[み]をかがめた。"
  48: "そして王[おう]はこう言[い]った。「イスラエルの神[かみ]である主[しゅ]はほめたたえられるように。主[しゅ]は今日[きょう]、わたしの子孫[しそん]の一人[ひとり]をわたしの王座[おうざ]に座[すわ]らせ、わたしの目[め]がそれを見[み]ている。」"
  49: "アドニヤに招[まね]かれた者[もの]たちはみな驚[おどろ]いて立[た]ち上[あ]がり、それぞれ自分[じぶん]の道[みち]へ帰[かえ]って行[い]った。"
  50: "アドニヤはソロモンを恐[おそ]れて立[た]ち、行[い]って祭壇[さいだん]の角[つの]を握[にぎ]った。"
  51: "ソロモンに告[つ]げる者[もの]があり、言[い]った。「見[み]よ、アドニヤはソロモン王[おう]を恐[おそ]れ、祭壇[さいだん]の角[つの]を握[にぎ]っている。『ソロモン王[おう]が今日[きょう]、剣[つるぎ]でわたし、そのしもべを殺[ころ]さないと誓[ちか]ってくださるように』と言[い]っている。」"
  52: "ソロモンは言[い]った。「彼[かれ]が力[ちから]ある者[もの]の子[こ]らしくふるまうなら、髪[かみ]の毛[け]一[いっ]本[ぽん]も地[ち]に落[お]ちない。しかし、彼[かれ]のうちに悪[あく]が見[み]つかれば、彼[かれ]は死[し]ぬ。」"
  53: "ソロモン王[おう]は人[ひと]を遣[つか]わして、アドニヤを祭壇[さいだん]のところから連[つ]れて来[き]させた。彼[かれ]は来[き]てソロモン王[おう]を拝[おが]んだ。ソロモンは彼[かれ]に言[い]った。「自分[じぶん]の家[いえ]へ帰[かえ]れ。」"

notes:
  1: "πρεσβύτερος προβεβηκὼς ἡμέραις — «старый, преуспевший днями» (ἡμέραις — датив отношения); περιέβαλλον — одевали, накидывали (несов.); οὐκ ἐθερμαίνετο — не согревался. Слав. «ризами (многими)» — слово в скобках, пояснение переписчика; в гр. его нет."
  2: "παρθένον νεᾶνιδα — «девицу юную» (плеоназм); παραστήσεται — предстанет (παρίστημι); ἔσται θάλπουσα — будет согревать (θάλπω, «лелеять»); κοιμηθήσεται μετ᾽ αὐτοῦ — будет спать с ним; θερμανθήσεται — согреется."
  3: "ἐκ παντὸς ὁρίου Ισραηλ — из всех пределов Израилевых; Αβισακ τὴν Σωμανῖτιν — Ависага Сунамитянка (Σωμανῖτις, от Шунема, シュネム人); ἤνεγκαν — привели (φέρω)."
  4: "καλὴ ἕως σφόδρα — прекрасна весьма (ἕως — усиление); ἐλειτούργει — прислуживала (λειτουργέω); ὁ βασιλεὺς οὐκ ἔγνω αὐτήν — царь не познал её (эвфемизм, слав. «не позна ея»)."
  5: "ἐπῄρετο — возносился, возгордился (ἐπαίρω); Ἐγὼ βασιλεύσω — «я буду царствовать» (буд. от βασιλεύω); ἅρματα καὶ ἱππεῖς — колесницы и всадники; πεντήκοντα ἄνδρας παρατρέχειν ἔμπροσθεν αὐτοῦ — пятьдесят мужей бежать пред ним (скороходы)."
  6: "οὐκ ἀπεκώλυσεν — не возбранил, не удерживал (ἀποκωλύω); ὡραῖος τῇ ὄψει σφόδρα — прекрасен видом весьма; αὐτὸν ἔτεκεν ὀπίσω Αβεσσαλωμ — его родила после Авессалома, т. е. он младший."
  7: "ἐγένοντο οἱ λόγοι αὐτοῦ μετὰ Ιωαβ — «были слова его с Иоавом», т. е. держал с ним совет (слав. «совети его»); ἐβοήθουν ὀπίσω — помогали вслед, поддерживали (βοηθέω)."
  8: "Σαδωκ — サドク; Βαναιας υἱὸς Ιωδαε — ベナヤ, ヨヤダの子; οἱ δυνατοὶ τοῦ Δαυιδ — сильные, храбрые Давида (δυνατός); οὐκ ἦσαν ὀπίσω — не были за ним, на его стороне."
  9: "ἐθυσίασεν — заколол в жертву (θυσιάζω); μετὰ λίθου τοῦ Ζωελεθ — у камня Зохелет; ἐχόμενα τῆς πηγῆς Ρωγηλ — близ источника Рогель (ἔχομαι — прилегать); ἁδροὺς Ιουδα — «тучных» Иуды, т. е. знатных (ἁδρός); παῖδας τοῦ βασιλέως — отроков царя. Порядок жертв: овцы, тельцы, агнцы."
  10: "τὸν Ναθαν τὸν προφήτην — пророка Нафана; τοὺς δυνατούς — сильных; οὐκ ἐκάλεσεν — не позвал (καλέω)."
  11: "Οὐκ ἤκουσας ὅτι — «не слышала ли, что» (вопрос-утверждение); ὁ κύριος ἡμῶν Δαυιδ οὐκ ἔγνω — господин наш Давид не знает (γινώσκω)."
  12: "δεῦρο — иди, ну же; συμβουλεύσω σοι συμβουλίαν — «посоветую тебе совет» (внутренний винительный); ἐξελοῦ — избавь, спаси (αἱρέω, импер.); τὴν ψυχήν — жизнь (ψυχή)."
  13: "Οὐχὶ σύ ... ὤμοσας — «не ты ли клялся»; καθιεῖται — сядет (καθίζω, буд. καθιῶ); τί ὅτι — почему же. Слова Вирсавии — во вложенной речи 『…』 (Нафан передаёт их)."
  14: "ἔτι λαλούσης σου ἐκεῖ — пока ты ещё будешь говорить там; εἰσελεύσομαι ὀπίσω σου — войду вслед за тобою; πληρώσω τοὺς λόγους σου — исполню, восполню слова твои (слав. «дополню»)."
  15: "εἰς τὸ ταμίειον — в спальню, внутренний покой (ταμιεῖον); πρεσβύτης σφόδρα — очень стар; ἦν λειτουργοῦσα — прислуживала (перифраза с причастием)."
  16: "ἔκυψεν — наклонилась (κύπτω); προσεκύνησεν — поклонилась; Τί ἐστίν σοι — «что тебе» (что угодно)."
  17: "σὺ ὤμοσας ἐν κυρίῳ τῷ θεῷ σου — ты клялся Господом Богом твоим (ἐν — формула клятвы); τῇ δούλῃ σου — рабе твоей (はしため); καθήσεται — сядет."
  18: "καὶ νῦν ἰδοὺ — «и вот теперь»; ἐβασίλευσεν — воцарился (аорист); οὐκ ἔγνως — не знаешь (γινώσκω, аорист)."
  19: "εἰς πλῆθος — во множестве (много); ἄρχοντα τῆς δυνάμεως — начальника силы, т. е. войска; τὸν δοῦλόν σου οὐκ ἐκάλεσεν — раба твоего не позвал."
  20: "οἱ ὀφθαλμοὶ παντὸς Ισραηλ πρὸς σέ — глаза всего Израиля к тебе (обращены); ἀπαγγεῖλαι — возвестить; μετ᾽ αὐτόν — после него."
  21: "ὡς ἂν κοιμηθῇ — когда почиет (κοιμάω, эвфемизм смерти); μετὰ τῶν πατέρων αὐτοῦ — с отцами своими; ἔσομαι ... ἁμαρτωλοί — «буду я и сын мой грешны», т. е. виновны, под обвинением."
  22: "ἔτι αὐτῆς λαλούσης — пока она ещё говорила (родительный самостоятельный); ἦλθεν — пришёл."
  23: "ἀνηγγέλη τῷ βασιλεῖ — было возвещено царю (ἀναγγέλλω, pass.); κατὰ πρόσωπον τοῦ βασιλέως — пред лицо царя; προσεκύνησεν ... ἐπὶ τὴν γῆν — поклонился до земли."
  24: "σὺ εἶπας — «ты ли сказал» (вопрос); βασιλεύσει ὀπίσω μου — будет царствовать после меня; καθήσεται ἐπὶ τοῦ θρόνου μου — сядет на престоле моём."
  25: "κατέβη σήμερον — сошёл сегодня (καταβαίνω); ἄρχοντας τῆς δυνάμεως — начальников войска; ἐσθίοντες καὶ πίνοντες — едя и пия; εἶπαν Ζήτω — сказали: да живёт (возглас, 万歳)."
  26: "ἐμὲ αὐτὸν τὸν δοῦλόν σου — меня самого, раба твоего (усиление); οὐκ ἐκάλεσεν — не позвал."
  27: "εἰ διὰ τοῦ κυρίου μου ... γέγονεν — «не по воле ли господина моего царя было»; ἐγνώρισας — открыл, дал знать (γνωρίζω); ἐπὶ τὸν θρόνον — на престол (вин. при καθήσεται)."
  28: "Καλέσατέ μοι τὴν Βηρσαβεε — позовите мне Вирсавию; εἰσῆλθεν ἐνώπιον τοῦ βασιλέως — вошла пред царя; ἔστη — стала. Слав. вставляет «(вирсавиа)» — пояснение, в гр. нет."
  29: "Ζῇ κύριος — «жив Господь» (формула клятвы); ὃς ἐλυτρώσατο — который избавил (λυτρόω); ἐκ πάσης θλίψεως — от всякой скорби (θλῖψις)."
  30: "καθὼς ὤμοσά σοι — как я клялся тебе; ἀντ ἐμοῦ — вместо меня; οὕτως ποιήσω τῇ ἡμέρᾳ ταύτῃ — так сделаю в день сей. Слав. добавляет «ему» («сотворю ему»), в гр. нет."
  31: "ἔκυψεν ... ἐπὶ πρόσωπον ἐπὶ τὴν γῆν — наклонилась лицом до земли (двойное ἐπί); εἰς τὸν αἰῶνα — во веки; Ζήτω — да живёт."
  32: "Καλέσατέ μοι — позовите мне; εἰσῆλθον ἐνώπιον τοῦ βασιλέως — вошли пред царя (аорист)."
  33: "τοὺς δούλους τοῦ κυρίου ὑμῶν — слуг господина вашего; ἐπιβιβάσατε — посадите (ἐπιβιβάζω); ἡμίονον — мул (ラバ); καταγάγετε — сведите (κατάγω); Γιων — Гион (ギオン), источник у Иерусалима."
  34: "χρισάτω — да помажет (χρίω, импер. 3 л.); εἰς βασιλέα ἐπὶ Ισραηλ — в царя над Израилем; σαλπίσατε κερατίνῃ — затрубите роговою трубою (κερατίνη, 角笛); ἐρεῖτε — скажете."
  35: "καθήσεται ἐπὶ τοῦ θρόνου μου — сядет на престоле моём; ἐνετειλάμην — я заповедал (ἐντέλλομαι); εἰς ἡγούμενον — в вождя (ἡγέομαι). Слав. «и изыдите вслед его» (пойдёте за ним) — добавление из МТ, в LXX его нет; по паритету внесено в основной текст без скобок. В гр. стих начинается с «и сядет»."
  36: "Γένοιτο — да будет, аминь; οὕτως πιστώσαι κύριος — так да утвердит Господь (πιστόω); τοῦ κυρίου μου τοῦ βασιλέως — господина моего царя."
  37: "καθὼς ἦν κύριος μετὰ τοῦ κυρίου μου — как был Господь с господином моим; εἴη — да будет (оптатив); μεγαλύναι — да возвеличит (μεγαλύνω); ὑπὲρ τὸν θρόνον — более престола."
  38: "ὁ χερεθθι καὶ ὁ φελεθθι — керети и пелети, царские телохранители (слав. «хереффи и фелеффи»); ἐπεκάθισαν — посадили (ἐπικαθίζω); ἀπήγαγον — повели, отвели."
  39: "τὸ κέρας τοῦ ἐλαίου — рог масла, елея (κέρας — рог, сосуд); ἐκ τῆς σκηνῆς — из скинии (幕屋); ἔχρισεν — помазал; ἐσάλπισεν τῇ κερατίνῃ — затрубил роговою трубою; πᾶς ὁ λαός — весь народ."
  40: "ἀνέβη ... ὀπίσω αὐτοῦ — пошёл вслед его; ἐχόρευον ἐν χοροῖς — плясали в хороводах (χορός); εὐφραινόμενοι εὐφροσύνην μεγάλην — внутренний винительный («радуясь радостью великою»); ἐρράγη ἡ γῆ — расселась земля (ῥήγνυμι)."
  41: "πάντες οἱ κλητοὶ αὐτοῦ — все званные его; συνετέλεσαν φαγεῖν — окончили есть (συντελέω); φωνὴ τῆς πόλεως ἠχούσης — голос города шумящего (ἠχέω, род. причастие)."
  42: "ἀνὴρ δυνάμεως εἶ σύ — «муж силы ты», т. е. достойный, честный человек; ἀγαθὰ εὐαγγέλισαι — благое благовествуешь (εὐαγγελίζω)."
  43: "Καὶ μάλα — «и весьма», т. е. да, именно так; ἐβασίλευσεν τὸν Σαλωμων — поставил Соломона царём (двойной винительный при βασιλεύω)."
  44: "ἀπέστειλεν μετ᾽ αὐτοῦ — послал с ним; ἐπεκάθισαν αὐτὸν ἐπὶ τὴν ἡμίονον — посадили его на мула."
  45: "ἔχρισαν αὐτὸν ... εἰς βασιλέα — помазали его в царя; ἀνέβησαν ἐκεῖθεν εὐφραινόμενοι — пошли оттуда радуясь; ἤχησεν ἡ πόλις — воззвучал город; αὕτη ἡ φωνή — вот этот голос."
  46: "ἐκάθισεν ... ἐπὶ θρόνον τῆς βασιλείας — сел на престол царства (род. принадлежности)."
  47: "εὐλογῆσαι — благословить, поздравить (εὐλογέω); Ἀγαθύναι ὁ θεὸς τὸ ὄνομα — да облагопоспешит Бог имя (ἀγαθύνω); ὑπὲρ τὸ ὄνομά σου — более имени твоего; προσεκύνησεν ... ἐπὶ τὴν κοίτην — поклонился на ложе (κοίτη)."
  48: "Εὐλογητὸς κύριος — благословен Господь; ὃς ἔδωκεν ... ἐκ τοῦ σπέρματός μου καθήμενον — который дал от семени моего сидящего (причастие); οἱ ὀφθαλμοί μου βλέπουσιν — очи мои видят."
  49: "ἐξέστησαν — изумились, пришли в смятение (ἐξίστημι); ἐξανέστησαν — встали (усилительный предлог); ἀνὴρ εἰς τὴν ὁδὸν αὐτοῦ — каждый в путь свой."
  50: "ἐφοβήθη ἀπὸ προσώπου Σαλωμων — убоялся лица Соломона; ἐπελάβετο τῶν κεράτων τοῦ θυσιαστηρίου — ухватился за роги жертвенника (место убежища, ср. Исх 21:14)."
  51: "κατέχει τῶν κεράτων — держится за роги (κατέχω); Ὀμοσάτω μοι — да поклянётся мне (ὀμνύω, импер.); εἰ οὐ θανατώσει — «если не умертвит» (формула клятвы с опущенной угрозой)."
  52: "εἰς υἱὸν δυνάμεως — «в сына силы», т. е. если будет достойным мужем; εἰ πεσεῖται τῶν τριχῶν αὐτοῦ ἐπὶ τὴν γῆν — «упадёт ли из волос его на землю» (ни один волос); κακία — злоба, лукавство."
  53: "ἀπέστειλεν ... καὶ κατήνεγκεν αὐτὸν ἀπάνωθεν τοῦ θυσιαστηρίου — послал и снял его сверху жертвенника (κατάγω); προσεκύνησεν — поклонился; Δεῦρο εἰς τὸν οἶκόν σου — иди в дом твой."
