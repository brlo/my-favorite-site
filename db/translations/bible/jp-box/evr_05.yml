# jp-box, Послание к Евреям, глава 5. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 5: всякий первосвященник берётся из людей (1–4), Христос не Сам Себя
# прославил, «Ты Сын Мой» и «Ты священник вовек» (5–6), молитва с воплем и
# слезами, послушание через страдания, источник вечного спасения (7–10),
# упрёк в неразумии: молоко и твёрдая пища (11–14).
# Красного и синего нет: слова Христа и Богородицы не цитируются; <j>/<mo> не ставятся.
# 5:5–6 — Пс 2:7 и Пс 110:4 (109:4 LXX), в 「…」, без красного: это слова Бога Отца.
# 〔…〕 в главе нет: все слова на месте в gr-lxx-byz (проверено запросом к базе).
# Сносок ⟨…⟩ в главе нет: 大祭司, 契約, 供え物 уже встречались в корпусе. jp-ni не использовался.

