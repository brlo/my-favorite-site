chapter: 5
draft: true

verses:
  1: "すべての大祭司[だいさいし]は、人[ひと]の中[なか]から選[えら]ばれ、人[ひと]のために、神[かみ]に対[たい]する事柄[ことがら]について立[た]てられ、罪[つみ]のために供[そな]え物[もの]といけにえをささげる者[もの]である。"
  2: "無知[むち]な者[もの]や迷[まよ]っている者[もの]に寛[かん]容[よう]でありうる。自分[じぶん]も弱[よわ]さを身[み]にまとっているからである。"
  3: "その弱[よわ]さのゆえに、民[たみ]のためにも自分[じぶん]のためにも、罪[つみ]のためにささげる義務[ぎむ]がある。"
  4: "この栄誉[えいよ]は、だれも自分[じぶん]で受[う]けるのではなく、アロンのように神[かみ]に召[め]されて受[う]けるものである。"
  5: "同じように、キリストも、大祭司[だいさいし]となる栄光[えいこう]を自分[じぶん]に帰[き]さなかった。「あなたはわたしの子[こ]である。わたしは今日[きょう]、あなたを生[う]んだ」と語[かた]られた方[かた]によるのである。"
  6: "また、ほかの所[ところ]でも言[い]われているとおりである。「あなたは永遠[えいえん]に、メルキセデクの位[くらい]に従[したが]う祭司[さいし]である」。"
  7: "この方[かた]は、その肉[にく]の日[ひ]々[び]に、死[し]から救[すく]い出[だ]すことのできる方[かた]に、強[つよ]い叫[さけ]びと涙[なみだ]とをもって祈[いの]りと願[ねが]いをささげられ、その敬虔[けいけん]のゆえに聞[き]き入[い]れられた。"
  8: "御子[みこ]でありながら、その受[う]けられた苦[くる]しみによって従順[じゅうじゅん]を学[まな]ばれた。"
  9: "そして、完成[かんせい]された方[かた]として、ご自身[じしん]に従[したが]うすべての者[もの]にとって、永遠[えいえん]の救[すく]いの源[みなもと]となられた。"
  10: "神[かみ]によって、メルキセデクの位[くらい]に従[したが]う大祭司[だいさいし]と呼ばれたのである。"
  11: "この方[かた]については、わたしたちに多[おお]くの話[はなし]があるが、あなたがたが聞[き]くことに鈍[にぶ]くなっているので、説明[せつめい]するのは難[むずか]しい。"
  12: "あなたがたは、時[とき]がたつにつれて教師[きょうし]になるべき者[もの]なのに、もう一度[いちど]、神[かみ]の言葉[ことば]の初歩[しょほ]を、だれかに教[おし]えてもらう必要[ひつよう]がある。そして、堅[かた]い食物[しょくもつ]ではなく、乳[ちち]を必要[ひつよう]とする者[もの]になってしまった。"
  13: "乳[ちち]を飲[の]む者[もの]は、義[ぎ]の言葉[ことば]に通[つう]じていない。幼[おさな]い者[もの]だからである。"
  14: "堅[かた]い食物[しょくもつ]は、成熟[せいじゅく]した者[もの]のものである。その人[ひと]たちは、習慣[しゅうかん]によって善[ぜん]悪[あく]を見分[みわ]ける力[ちから]を鍛[きた]えられている。"

notes:
  1: "Πᾶς γὰρ ἀρχιερεύς — すべての大祭司は. ἐξ ἀνθρώπων λαμβανόμενος — 人の中から選ばれて (λαμβάνω здесь «избирается, берётся»). ὑπὲρ ἀνθρώπων καθίσταται τὰ πρὸς τὸν θεόν — 人のために、神に対する事柄について立てられ (καθίστημι — «ставить, назначать»). ἵνα προσφέρῃ δῶρά τε καὶ θυσίας ὑπὲρ ἁμαρτιῶν — 罪のために供え物といけにえをささげるため; два слова, δῶρα и θυσίαι, сохранены раздельно (θυσία — いけにえ, как в 9:9)."
  2: "μετριοπαθεῖν δυνάμενος — 寛容でありうる (μετριοπαθέω — «снисходить, умеренно сострадать»; не συμπαθέω из 4:15). τοῖς ἀγνοοῦσιν καὶ πλανωμένοις — 無知な者や迷っている者. ἐπεὶ καὶ αὐτὸς περίκειται ἀσθένειαν — 自分も弱さを身にまとっている (περίκειμαι — «быть облечённым, окружённым»)."
  3: "καὶ δι᾽ αὐτὴν — その弱さのゆえに (διά с винительным — причина). ὀφείλει — 義務がある. καθὼς περὶ τοῦ λαοῦ οὕτως καὶ περὶ αὑτοῦ — 民のためにも自分のためにも; порядок членов сохранён."
  4: "οὐχ ἑαυτῷ τις λαμβάνει τὴν τιμήν — だれも自分でこの栄誉を受けるのではない (τιμή — «честь, достоинство», здесь о сане). καλούμενος ὑπὸ τοῦ θεοῦ — 神に召されて. καθώσπερ καὶ Ἀαρών — アロンのように; имя アロン — как в корпусе."
  5: "Пс 2:7. Οὕτως καὶ ὁ Χριστός — 同じように、キリストも. οὐχ ἑαυτὸν ἐδόξασεν γενηθῆναι ἀρχιερέα — 大祭司となる栄光を自分に帰さなかった. ἀλλ᾽ ὁ λαλήσας πρὸς αὐτόν — ではなく、…と語られた方による; глагол «прославил» во второй части не повторён, эллипсис сохранён. Цитата — слова Бога Отца, поэтому 「…」 и не красная."
  6: "Пс 110:4 (109:4 LXX). καθὼς καὶ ἐν ἑτέρῳ λέγει — ほかの所でも言われているとおり. ἱερεὺς εἰς τὸν αἰῶνα — 永遠に祭司. κατὰ τὴν τάξιν Μελχισέδεκ — メルキセデクの位に従う (τάξις — «чин, порядок»; 位 — принятое соответствие)."
  7: "ἐν ταῖς ἡμέραις τῆς σαρκὸς αὐτοῦ — その肉の日々に. δεήσεις τε καὶ ἱκετηρίας — 祈りと願い (два слова сохранены). πρὸς τὸν δυνάμενον σῴζειν αὐτὸν ἐκ θανάτου — 死から救い出すことのできる方に. μετὰ κραυγῆς ἰσχυρᾶς καὶ δακρύων — 強い叫びと涙とをもって. εἰσακουσθεὶς ἀπὸ τῆς εὐλαβείας — 敬虔のゆえに聞き入れられた (εὐλάβεια — «благоговение»; ἀπό указывает на причину)."
  8: "καίπερ ὢν υἱός — 御子でありながら (уступительное значение καίπερ сохранено). ἔμαθεν ἀφ᾽ ὧν ἔπαθεν τὴν ὑπακοήν — 受けた苦しみによって従順を学んだ; созвучие ἔπαθεν/ἔμαθεν по-японски не передать, смысл сохранён."
  9: "τελειωθείς — 完成された方として (τελειόω — «доводить до полноты, посвящать»; ср. 2:10; 7:28). αἴτιος σωτηρίας αἰωνίου — 永遠の救いの源 (αἴτιος — «причина, источник»). τοῖς ὑπακούουσιν αὐτῷ — ご自身に従うすべての者にとって."
  10: "προσαγορευθεὶς ὑπὸ τοῦ θεοῦ — 神によって…と呼ばれた. κατὰ τὴν τάξιν Μελχισέδεκ — メルキセデクの位に従う. Стих замыкает рассуждение 5:5–10 и готовит гл. 7."
  11: "Περὶ οὗ — この方について (речь о Христе как Первосвященнике по чину Мелхиседека). πολὺς ἡμῖν ὁ λόγος — わたしたちには多くの話がある. δυσερμήνευτος λέγειν — 説明するのが難しい. νωθροὶ γεγόνατε ταῖς ἀκοαῖς — 聞くことに鈍くなっている (νωθρός — «вялый, медлительный»)."
  12: "ὀφείλοντες εἶναι διδάσκαλοι διὰ τὸν χρόνον — 時がたつにつれて教師になるべき者なのに. πάλιν χρείαν ἔχετε τοῦ διδάσκειν ὑμᾶς τινά — もう一度、だれかに教えてもらう必要がある. τὰ στοιχεῖα τῆς ἀρχῆς τῶν λογίων τοῦ θεοῦ — 神の言葉の初歩 (στοιχεῖα — «основы, начатки»; λόγια — «изречения»). γάλακτος, [καὶ] οὐ στερεᾶς τροφῆς — 乳で、堅い食物ではなく; [καὶ] стоит в базе в квадратных скобках, слово есть, поэтому 〔〕 не ставятся."
  13: "πᾶς ὁ μετέχων γάλακτος — 乳を飲む者は (μετέχω — «быть причастным, питаться»). ἄπειρος λόγου δικαιοσύνης — 義の言葉に通じていない (ἄπειρος — «неопытный»). νήπιος γάρ ἐστιν — 幼い者だからである."
  14: "τελείων δέ ἐστιν ἡ στερεὰ τροφή — 堅い食物は成熟した者のものである. ἕξις — 習慣 (навык). τὰ αἰσθητήρια γεγυμνασμένα — 見分ける力を鍛えられた (γυμνάζω — «упражнять»; αἰσθητήρια — «органы чувств»). πρὸς διάκρισιν καλοῦ τε καὶ κακοῦ — 善悪を見分けるために. 成熟[せいじゅく] — τέλειοι (5:14; ср. τελειότης, 6:1)."
