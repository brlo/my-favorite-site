# jp-box, Иисус Навин, глава 19. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в этой главе нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 19: второй жребий — Симеон (1–9), третий — Завулон (10–16), четвёртый —
# Иссахар (17–23), пятый — Асир (24–31), шестой — Неффалим (32–39), седьмой —
# Дан (40–48), удел Иисуса (49–50), заключение (51).
# Речи нет, красного нет.
# 〔…〕 нет: все слова есть в gr-lxx-byz; слав. добавления числом городов
# (19:15 «дванадесять», 19:22 «шестьнадесять», 19:30 «двадесять два», 19:38
# «девятьнадесят») и «и ко иуде» (19:34) в гр. отсутствуют и не внесены.
# Сносок ⟨…⟩ нет: 嗣業, 部族, 氏族, くじ уже в корпусе.
# Отличия LXX: 19:35 «πόλεις τειχήρεις τῶν Τυρίων» — «укреплённые города тирян»;
# 19:47–48 текст перемешан относительно слав./ru: в гр. ст. 47 = формула удела
# Дана + 47a об аморреях, ст. 48 = поход «сынов Иуды» на Лахис + 48a (он же
# вторая половина слав. ст. 48). 19:36 Ασωρ и 19:37 πηγὴ Ασορ переданы по брифу
# как ハツォル; 19:43 Ακκαρων — エクロン (бриф); 19:46 Ιοππη — ヤッファ (бриф);
# 19:48 Λαχις — ラキシュ (бриф).
# jp-ni не использовался.

