verses:
  1: "第二[だいに]のくじはシメオンの子[こ]らのために出[で]た。彼[かれ]らの嗣業[しぎょう]は、ユダの子らのくじの間[あいだ]にあった。"
  2: "彼[かれ]らのくじには、ベエル・シェバ、サマア、コラダム、"
  3: "アルソラ、ボラ、アソム、"
  4: "エルトラ、ブラ、エルマ、"
  5: "シケラク、ベト・マヘレブ、サルスシン、"
  6: "バタロトとその畑[はたけ]。これらは十三[じゅうさん]の町[まち]とその村々[むらむら]である。"
  7: "エレモン、ファルハ、エテル、アサン。これらは四[よっ]つの町[まち]とその村々[むらむら]である。"
  8: "彼[かれ]らの町々[まちまち]の周[まわ]りにあるすべての村[むら]、南[みなみ]へと進[すす]むバメトに至[いた]るバレクまで。これがシメオンの子[こ]らの部族[ぶぞく]の嗣業[しぎょう]、その氏族[しぞく]ごとのものである。"
  9: "シメオンの子[こ]らの部族[ぶぞく]の嗣業[しぎょう]は、ユダのくじから取[と]られた。ユダの子らの割[わ]り当[あ]てが彼[かれ]らにとって大[おお]きすぎたからである。そこでシメオンの子らは、彼らのくじの真[ま]ん中[なか]で嗣業を受[う]け継[つ]いだ。"
  10: "第三[だいさん]のくじはゼブルンに、その氏族[しぞく]ごとに出[で]た。彼[かれ]らの嗣業[しぎょう]の境界[きょうかい]は、エセデクに及[およ]ぶ。"
  11: "境界[きょうかい]はゴラから海[うみ]へと至[いた]り、マラゲラに及び、ベト・アラバに接[せっ]して谷[たに]に至る。その谷はイエクマンの前[まえ]にある。"
  12: "それはセドゥクから、東[ひがし]のベト・サムスの反対側[がわ]へと戻[もど]り、ハセロタイトの境界[きょうかい]に及び、ダビロトへ進[すす]み、ファンガイへ上[のぼ]る。"
  13: "そこから境界[きょうかい]は、東[ひがし]へ向[む]かってゲベレに巡[めぐ]り、カタセムの町[まち]に至[いた]り、レモン、アマファル、アオザへ進む。"
  14: "境界[きょうかい]は北[きた]へ巡[めぐ]ってアモトに及び、その果[は]てはガイファエルである。"
  15: "またカタナト、ナバアル、スモオン、エリコ、ベトマン。"
  16: "これがゼブルンの子[こ]らの部族[ぶぞく]の嗣業[しぎょう]、その氏族[しぞく]ごとのものであり、町々[まちまち]とその村々[むらむら]である。"
  17: "第四[だいし]のくじはイッサカルに出[で]た。"
  18: "彼[かれ]らの境界[きょうかい]はイアゼル、ハサロト、スナン、"
  19: "アギン、シオナ、レエロト、アナヘレト、"
  20: "ダビロン、キソン、レベス、"
  21: "レンマス、イエオン、トンマン、アイマレク、ベルサフェス、"
  22: "境界[きょうかい]はガイトボルに接[せっ]し、海[うみ]に面[めん]したサリムとベト・サムスに及[およ]ぶ。その境界の果[は]てはヨルダン川[がわ]である。"
  23: "これがイッサカルの子[こ]らの部族[ぶぞく]の嗣業[しぎょう]、その氏族[しぞく]ごとのものであり、町々[まちまち]とその村々[むらむら]である。"
  24: "第五[だいご]のくじはアシェルに出[で]た。"
  25: "彼[かれ]らの境界[きょうかい]はエレケト、アレフ、ベトク、ケアフ、"
  26: "エリメレク、アミエル、マアサであり、境界[きょうかい]は海[うみ]に面[めん]したカルメルとシオン、ラバナトに接[せっ]する。"
  27: "境界[きょうかい]は日[ひ]の出[で]る東[ひがし]へ戻[もど]ってベト・エゲネトに至[いた]り、ゼブルンとガイ、それに北[きた]のフトアイエルに接[せっ]する。境界はサフタイ・ベトメとイナエルへ入[はい]り、ホバ・マソメルへ進[すす]む。"
  28: "エルボン、ラアブ、エメマオン、カンタン、すなわち大[おお]きなシドンに至[いた]るまで。"
  29: "境界[きょうかい]はラマへ、またマスファサトの泉[いずみ]とティルス人[じん]のところへ戻[もど]り、さらにイアシフへ戻る。その果[は]ては海[うみ]であり、レブとエホゾブ、"
  30: "アルホブ、アフェク、ラアウ。"
  31: "これがアシェルの子[こ]らの部族[ぶぞく]の嗣業[しぎょう]、その氏族[しぞく]ごとのものであり、町々[まちまち]とその村々[むらむら]である。"
  32: "第六[だいろく]のくじはナフタリに出[で]た。"
  33: "彼[かれ]らの境界[きょうかい]はモオラム、モラ、ベセミイン、アルメ、ナボク、イエフタマイ、すなわちダダムに至[いた]るまでであった。その果[は]てはヨルダン川[がわ]であった。"
  34: "境界[きょうかい]は海[うみ]へ、すなわちエナト・タボルへ向[む]かって戻[もど]り、そこからイアカナへ進[すす]んで、南[みなみ]でゼブルンに接[せっ]し、海でアシェルに接する。ヨルダン川[がわ]は日[ひ]の出[で]る東[ひがし]の側[がわ]にある。"
  35: "ティルス人[じん]の堅固[けんご]な町々[まちまち]は、ティルス、オマタ、ダケト、ケネレト、"
  36: "アルマイト、アラエル、ハツォル、"
  37: "ケデス、アサリ、ハツォルの泉[いずみ]、"
  38: "ケロエ、メガラ、アリム、ベト・タメ、テッサムス。"
  39: "これがナフタリの子[こ]らの部族[ぶぞく]の嗣業[しぎょう]である。"
  40: "第七[だいしち]のくじはダンに出[で]た。"
  41: "彼[かれ]らの境界[きょうかい]はサラト、アサ、サンマウスの町々[まちまち]、"
  42: "サラビン、アンモン、シラタ、"
  43: "アイロン、ファムナタ、エクロン、"
  44: "アルカタ、ベゲトン、ゲベエラン、"
  45: "アゾル、バナイバカト、ゲトレンモン、"
  46: "海[うみ]からイエラコン、ヤッファに近[ちか]い境界[きょうかい]である。"
  47: "これがダンの子[こ]らの部族[ぶぞく]の嗣業[しぎょう]、その氏族[しぞく]ごとのものであり、彼[かれ]らの町々[まちまち]とその村々[むらむら]である。ダンの子らは、山[やま]で彼らを苦[くる]しめるアモリ人[じん]を追[お]い出[だ]さなかった。アモリ人は彼らを谷[たに]へ下[くだ]らせようとはせず、彼らの嗣業の境界[きょうかい]を彼らから狭[せば]めた。"
  48: "ユダの子[こ]らは行[い]ってラキシュと戦[たたか]い、それを取[と]って、剣[つるぎ]の刃[は]で打[う]ち、そこに住[す]んだ。そしてその名[な]をラセン・ダクと呼[よ]んだ。アモリ人[じん]はエロムとサラミンに住み続[つづ]け、エフライムの手[て]は彼[かれ]らの上[うえ]に重[おも]くのしかかり、彼らは彼らのために税[みつぎ]を納[おさ]める者[もの]となった。"
  49: "彼[かれ]らは、その境界[きょうかい]に従[したが]って地[ち]を受[う]け取[と]るために出[で]かけた。そこでイスラエルの子[こ]らは、彼らの間[あいだ]でヌンの子ヨシュアに嗣業[しぎょう]をくじによって与[あた]えた。"
  50: "神[かみ]の命令[めいれい]によって、彼らはヨシュアが求[もと]めた町[まち]、エフライムの山[やま]にあるタムナサラフを与[あた]えた。彼[かれ]はその町を建[た]て直[なお]し、そこに住[す]んだ。"
  51: "これらは、祭司[さいし]エレアザルと、ヌンの子[こ]ヨシュアと、イスラエルの部族[ぶぞく]の氏族[しぞく]の長[かしら]たちが、シロで、主[しゅ]の前[まえ]、証[あかし]の幕屋[まくや]の戸口[とぐち]のそばで、くじによって、イスラエルの部族に嗣業[しぎょう]として分[わ]け与[あた]えた分[わ]け前[まえ]である。そして彼らは地[ち]を受[う]け取[と]るために出[で]かけた。"

notes:
  1: "ὁ δεύτερος κλῆρος — второй жребий. ἀνὰ μέσον κλήρων υἱῶν Ιουδα — среди жребиев сынов Иуды."
  2: "Βηρσαβεε — Вирсавия (ベエル・シェバ, по брифу); Σαμαα — Самаа; Κωλαδαμ — Коладам."
  3: "Αρσωλα — Арсола; Βωλα — Бола (слав. «вафул»); Ασομ — Асом. В слав. четыре имени: «асерсуал и вафул, и велвола и асом»."
  4: "Ελθουλα — Елтула; Βουλα — Була; Ερμα — Ерма."
  5: "Σικελακ — Сикелак (Секелаг); Βαιθμαχερεβ — Беф-Махерев; Σαρσουσιν — Сарсусин."
  6: "Βαθαρωθ καὶ οἱ ἀγροὶ αὐτῶν — Бафарот и поля его (ἀγρός). πόλεις δέκα τρεῖς — тринадцать городов."
  7: "Ερεμμων — Ереммон; Θαλχα — Фалха; Εθερ — Ефер; Ασαν — Асан. τέσσαρες — четыре."
  8: "κύκλῳ τῶν πόλεων — вокруг городов. ἕως Βαρεκ πορευομένων Βαμεθ κατὰ λίβα — тёмное место: «до Варек, [у] идущих [в] Вамеф на юг» (слав. «до ваалферирраммоф… во иамеф к ливу», ru «до Ваалаф-Беера, или южной Рамы»); передано буквально."
  9: "ἀπὸ τοῦ κλήρου Ιουδα — из жребия Иуды. μερίς — часть. ἐκληρονόμησαν ἐν μέσῳ τοῦ κλήρου — получили удел внутри жребия Иуды."
  10: "ὁ τρίτος κλῆρος — третий. Εσεδεκ — Еседек (слав. и ru «Сарид»); форма LXX иная, передана транслитерацией."
  11: "Γωλα — Гола (в слав. не передано). ὅρια αὐτῶν ἡ θάλασσα — «предел их — море». Μαραγελλα — Марагелла. Ιεκμαν — Иекман."
  12: "Σεδδουκ — Седдук (слав. «сарид»). Βαιθσαμυς — Беф-Самс. Χασελωθαιθ — Хаселофаиф. Δαβιρωθ — Давироф. Φαγγαι — Фангай."
  13: "Γεβερε — Гевере; Κατασεμ — Катасем; Ρεμμωνα Αμαθαρ Αοζα — три имени: Реммон, Амафар, Аоза (ru «Риммон, Мифоар и Нея»)."
  14: "Αμωθ — Амоф (слав. «еннафоф»); Γαιφαηλ — Гайфаил (слав. «гай иеффаил»)."
  15: "Καταναθ — Катанаф; Ναβααλ — Наваал; Συμοων — Симон; Ιεριχω — Иерихон (в LXX здесь стоит エリコ); Βαιθμαν — Бефман. Слав. даёт иной список (каттаф, наалол, семрон, иадила, вифлеем) и число «дванадесять», в гр. числа нет."
  16: "Формула удела: πόλεις καὶ αἱ κῶμαι — города и села."
  17: "ὁ κλῆρος ὁ τέταρτος — четвёртый (в гр. без «по родам»; слав. добавляет «по сродством их»)."
  18: "Ιαζηλ — Иазель (слав. и ru «Изреель»); Χασαλωθ — Хасалоф; Σουναν — Сунам."
  19: "Αγιν — Агин; Σιωνα — Сиона; Ρεηρωθ — Реэроф; Αναχερεθ — Анахереф."
  20: "Δαβιρων — Давирон; Κισων — Кисон; Ρεβες — Ревес."
  21: "Ρεμμας — Реммас; Ιεων — Иеон; Τομμαν — Томман; Αιμαρεκ — Аимарек; Βηρσαφης — Берсафес."
  22: "Γαιθβωρ — Гайфвор (Фавор); Σαλιμ — Салим; Βαιθσαμυς — Беф-Самс. Слав. добавляет «грады шестьнадесять», в гр. нет."
  23: "Формула удела."
  24: "ὁ πέμπτος — пятый; Ασηρ — Асир (Ашер)."
  25: "Ελεκεθ — Елекеф; Αλεφ — Алеф; Βαιθοκ — Бефок; Κεαφ — Кеаф."
  26: "Ελιμελεκ — Елимелех; Αμιηλ — Амиил; Μαασα — Мааса. συνάψει τῷ Καρμήλῳ — «примкнёт к Кармилу» (カルメル). Σιων — Сион, здесь имя места, не гора Сион. Λαβαναθ — Лаванаф."
  27: "Βαιθεγενεθ — Беф-Егенеф; Γαι — Гай; Φθαιηλ — Ффаил; Σαφθαιβαιθμε — Сафтай-Бетме (в слав. «виф-аемек»); Ιναηλ — Инаил; Χωβα μασομελ — Хова-Масомел."
  28: "Ελβων — Елвон; Ρααβ — Раав; Εμεμαων — Емемаон; Κανθαν — Канфан; ἕως Σιδῶνος τῆς μεγάλης — до великого Сидона (シドン)."
  29: "Ραμα — Рама. πηγὴ Μασφασσατ — источник Маспассат (слав. «град тверд» понимает иначе). τῶν Τυρίων — тирян (ティルス人). Ιασιφ — Иасиф. Λεβ — Лев; Εχοζοβ — Ехозов."
  30: "Αρχωβ — Архов; Αφεκ — Афек; Ρααυ — Раау. Слав. добавляет «грады двадесять два», в гр. нет."
  31: "Формула удела (Ασηρ)."
  32: "ὁ ἕκτος — шестой; Νεφθαλι — Неффалим (ナフタリ)."
  33: "Μοολαμ — Моолам; Μωλα — Мола; Βεσεμιιν — Бесемиин; Αρμε — Арме; Ναβωκ — Навок; Ιεφθαμαι — Иефтамай; Δωδαμ — Додам. διέξοδοι — исходы, концы предела."
  34: "Εναθ Θαβωρ — Енаф-Фавор; Ιακανα — Иакана. συνάψει τῷ Ζαβουλων ἀπὸ νότου — примкнёт к Завулону с юга; Ασηρ … κατὰ θάλασσαν — к Асиру с моря. Слав. добавляет «и ко иуде», в гр. нет."
  35: "πόλεις τειχήρεις τῶν Τυρίων — «города укреплённые тирян» (τειχήρης); Τύρος — Тир (ティルス); Ωμαθα — Омафа; Δακεθ — Дакеф; Κενερεθ — Кенереф."
  36: "Αρμαιθ — Армаиф; Αραηλ — Араил; Ασωρ — Асор (ハツォル, по брифу)."
  37: "Καδες — Кадес; Ασσαρι — Ассари; πηγὴ Ασορ — источник Асор (ハツォルの泉)."
  38: "Κερωε — Керое; Μεγαλα — Мегала; Αριμ — Арим; Βαιθθαμε — Беф-Фаме; Θεσσαμυς — Фессамс. Слав. добавляет «грады девятьнадесят», в гр. нет."
  39: "Формула удела (Νεφθαλι); слав. добавляет «по сродству их, грады и предградия их»."
  40: "ὁ ἕβδομος — седьмой; Δαν — Дан."
  41: "Σαραθ — Сараф; Ασα — Аса; πόλεις Σαμμαυς — «города Саммаус» (ru «Ир-Шемеш»); передано как サンマウス."
  42: "Σαλαβιν — Салабин; Αμμων — Аммон; Σιλαθα — Силафа."
  43: "Αιλων — Аилон; Θαμναθα — Фамнафа; Ακκαρων — Екрон (エクロン, по брифу)."
  44: "Αλκαθα — Алкафа; Βεγεθων — Бегефон; Γεβεελαν — Гевеелан."
  45: "Αζωρ — Азор; Βαναιβακατ — Банаивакат; Γεθρεμμων — Гефреммон."
  46: "Ιερακων — Иеракон; πλησίον Ιόππης — близ Иоппии (ヤッファ, по брифу). Слав. добавляет в конце «и изыде предел сынов дановых от них» (соответствует 19:47 масоретского текста)."
  47: "В гр. ст. 47 = формула удела Дана + 47a: Дан не вытеснил аморрея, теснившего их на горе; аморреи не давали им сойти в долину и стеснили их предел. В слав. ст. 47 — рассказ о походе Дана на Лашем, ст. 48 — формула удела, порядок иной."
  48: "В гр. ст. 48 = поход «сынов Иуды» на Лахис (Λαχις; ラキシュ) и название города Λασενδακ, затем 48a об аморреях, оставшихся в Еломе (Ελωμ) и Саламине (Σαλαμιν) и платящих дань Ефрему; этот 48a соответствует второй половине слав. ст. 48. «Сыны Иуды» вместо Дана — особенность текста модуля."
  49: "ἐμβατεῦσαι τὴν γῆν — «вступить во владение землёй» (ἐμβατεύω). κατὰ τὸ ὅριον αὐτῶν — по пределу их. ἔδωκαν κλῆρον Ἰησοῖ — дали жребий Иисусу."
  50: "διὰ προστάγματος τοῦ θεοῦ — по повелению Божию. Θαμνασαραχ — Фамнасарах (слав. «фамнаф-сараи», ru «Фамнаф-Сараи»); передано タムナサラフ. ᾠκοδόμησεν — построил."
  51: "αἱ διαιρέσεις — разделы (διαίρεσις). κατεκληρονόμησεν — разделил в удел (κατακληρονομέω). ἄρχοντες τῶν πατριῶν — начальники отцов. παρὰ τὰς θύρας — у дверей. ἐπορεύθησαν ἐμβατεῦσαι — пошли вступить во владение."
