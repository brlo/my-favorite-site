verses:
  1: "空[むな]しいうわさを信[しん]じてはならない。不正[ふせい]な者[もの]と手[て]を組[く]んで、不正[ふせい]な証人[しょうにん]になってはならない。"
  2: "多[おお]くの者[もの]とともに悪[あく]に加[くわ]わってはならない。多[おお]くの者[もの]に従[したが]って裁[さば]きを曲[ま]げてはならない。"
  3: "また、貧[まず]しい者[もの]を裁[さば]きの場[ば]でかばってはならない。"
  4: "もしあなたが、敵[てき]の牛[うし]やろばが道[みち]に迷[まよ]っているのに出会[であ]ったなら、引[ひ]き返[かえ]してその人[ひと]に返[かえ]さなければならない。"
  5: "もしあなたが、敵[てき]のろばが荷[に]の下[した]に倒[たお]れているのを見[み]たなら、見[み]過[す]ごしてはならない。必[かなら]ずその人[ひと]とともにそれを起[お]こさなければならない。"
  6: "貧[まず]しい者[もの]の裁[さば]きを、その裁[さば]きの場[ば]で曲[ま]げてはならない。"
  7: "不正[ふせい]なことばから遠[とお]ざからなければならない。罪[つみ]のない正[ただ]しい者[もの]を殺[ころ]してはならない。わたしは悪[あく]しき者[もの]を、贈[おく]り物[もの]のゆえに正[ただ]しいとはしない。"
  8: "贈[おく]り物[もの]を受[う]け取[と]ってはならない。贈[おく]り物[もの]は見[み]る者[もの]の目[め]をくらませ、正[ただ]しいことばを損[そこ]なうからである。"
  9: "寄留者[きりゅうしゃ]を悩[なや]ましてはならない。あなたがたは寄留者[きりゅうしゃ]の心[こころ]を知[し]っている。あなたがたもまたエジプトの地[ち]で寄留者[きりゅうしゃ]であったからである。"
  10: "六年[ろくねん]の間[あいだ]、あなたは自分の地[ち]に種[たね]を蒔[ま]いて、その産物[さんぶつ]を集[あつ]めなければならない。"
  11: "しかし七年目[ななねんめ]には、地[ち]を休[やす]ませて解[かい]放[ほう]し、あなたの民[たみ]の貧[まず]しい者[もの]たちが食[た]べるようにしなければならない。残[のこ]ったものは野[の]の獣[けもの]が食[た]べる。あなたのぶどう畑[ばたけ]とオリーブ畑[ばたけ]についても、同[おな]じようにしなければならない。"
  12: "六日[むいか]の間[あいだ]は自分の仕事[しごと]をし、七日目[なぬかめ]には休[やす]まなければならない。あなたの牛[うし]やろばが休[やす]み、あなたの女奴隷[おんなどれい]の子[こ]と寄留者[きりゅうしゃ]が息[いき]をつぐためである。"
  13: "わたしがあなたがたに告[つ]げたすべてのことを守[まも]らなければならない。ほかの神々[かみがみ]の名前[なまえ]を思[おも]い起[お]こしてはならない。あなたがたの口[くち]からそれが聞[き]こえてはならない。"
  14: "年[とし]に三度[さんど]、わたしのために祭[まつ]りを祝[いわ]いなさい。"
  15: "種[たね]なしパンの祭[まつ]りを守[まも]って行[おこな]わなければならない。新[あたら]しい実[みの]りの月[つき]の定[さだ]めの時[とき]に、わたしがあなたに命[めい]じたとおり、七日[なのか]の間[あいだ]種[たね]なしパンを食[た]べる。あなたはその月[つき]にエジプトから出[で]たからである。わたしの前[まえ]に空[から]の手[て]で現[あらわ]れてはならない。"
  16: "また、あなたが畑[はたけ]に蒔[ま]いた仕事[しごと]の初穂[はつほ]の刈[か]り入[い]れの祭[まつ]りを祝[いわ]わなければならない。また、年[とし]の終[お]わりに、畑[はたけ]からの仕事[しごと]の取[と]り入[い]れの祭[まつ]りを祝[いわ]わなければならない。"
  17: "年[とし]に三度[さんど]、あなたの男[おとこ]はすべて、あなたの神[かみ]である主[しゅ]の前[まえ]に現[あらわ]れなければならない。"
  18: "わたしがあなたの前[まえ]から異邦[いほう]の民[たみ]を追[お]い出[だ]し、あなたの国境[こっきょう]を広[ひろ]げるとき、あなたはわたしのいけにえの血[ち]をパン種[だね]の上[うえ]に注[そそ]いではならない。わたしの祭[まつ]りの脂肪[しぼう]を朝[あさ]まで残[のこ]しておいてはならない。"
  19: "あなたの地[ち]の初穂[はつほ]の最[さい]初[しょ]のものを、あなたの神[かみ]である主[しゅ]の家[いえ]に持[も]ち込[こ]まなければならない。子[こ]やぎをその母[はは]の乳[ちち]で煮[に]てはならない。"
  20: "見[み]よ、わたしはあなたの前[まえ]にわたしの天使[てんし]を遣[つか]わし、あなたを道[みち]で守[まも]らせ、わたしがあなたのために備[そな]えた地[ち]へあなたを導[みちび]き入[い]れさせる。"
  21: "あなたは自分[じぶん]に気[き]をつけ、その声[こえ]に聞[き]き従[したが]い、これに逆[さか]らってはならない。その者[もの]はあなたを赦[ゆる]さない。わたしの名[な]がその者[もの]のうちにあるからである。"
  22: "もしあなたがわたしの声[こえ]に必[かなら]ず聞[き]き従[したが]い、わたしがあなたに命[めい]じるすべてのことを行[おこな]い、わたしの契約[けいやく]を守[まも]るなら、あなたはすべての民[たみ]のうちからわたしの宝[たから]の民[たみ]となる。地[ち]はすべてわたしのものだからである。あなたがたはわたしにとって祭司[さいし]の王国[おうこく]、聖[せい]なる民[たみ]となる。あなたはこれらのことばをイスラエルの子[こ]らに告[つ]げなければならない。もしあなたがわたしの声[こえ]に必[かなら]ず聞[き]き従[したが]い、わたしがあなたに告[つ]げるすべてのことを行[おこな]うなら、わたしはあなたの敵[てき]の敵[てき]となり、あなたに敵対[てきたい]する者[もの]に敵対[てきたい]する。"
  23: "わたしの天使[てんし]はあなたの前[まえ]を導[みちび]いて行[い]き、あなたをアモリ人[じん]、ヘテ人[じん]、フェレジ人[じん]、カナン人[じん]、ゲルゲシ人[じん]、ヒビ人[じん]、エブス人[じん]のもとへ導[みちび]き入[い]れる。そして、わたしは彼[かれ]らを滅[ほろ]ぼし尽[つ]くす。"
  24: "あなたは彼[かれ]らの神々[かみがみ]を拝[おが]んではならない。それらに仕[つか]えてもならない。彼[かれ]らの行[おこな]いにならってはならない。むしろ、彼[かれ]らの石柱[せきちゅう]を打[う]ち倒[たお]し、粉々[こなごな]に砕[くだ]かなければならない。"
  25: "あなたはあなたの神[かみ]である主[しゅ]に仕[つか]えなければならない。わたしはあなたのパンとぶどう酒[ぶどうしゅ]、水[みず]を祝福[しゅくふく]し、あなたがたから病[やまい]を遠[とお]ざける。"
  26: "あなたの地[ち]には、子[こ]を産[う]めない者[もの]も、不妊[ふにん]の者[もの]もいなくなる。わたしはあなたの日々[ひび]の数[かず]を満[み]たす。"
  27: "わたしはあなたの前[まえ]に恐[おそ]れを送[おく]り、あなたが入[はい]って行[い]くすべての民[たみ]をかき乱[みだ]す。わたしはあなたの敵[てき]をすべて、あなたの前[まえ]から逃[に]げ去[さ]らせる。"
  28: "わたしはまた、あなたの前[まえ]に蜂[はち]を送[おく]り、アモリ人[じん]、ヒビ人[じん]、カナン人[じん]、ヘテ人[じん]をあなたの前[まえ]から追[お]い払[はら]う。"
  29: "わたしは彼[かれ]らを一年[いちねん]のうちに追[お]い出[だ]さない。地[ち]が荒[あ]れ果[は]てて、野[の]の獣[けもの]があなたを襲[おそ]うほど増[ふ]えないためである。"
  30: "わたしは彼[かれ]らを、あなたの前[まえ]から少[すこ]しずつ追[お]い出[だ]す。あなたが増[ふ]え、その地[ち]を嗣業[しぎょう]として受[う]け継[つ]ぐまで、そうする。"
  31: "わたしはあなたの国境[こっきょう]を、紅[あか]い海[うみ]からペリシテ人[じん]の海[うみ]まで、荒[あ]れ野[の]から大[おお]きな川[かわ]ユーフラテスまでとする。わたしはその地[ち]に住[す]む者[もの]たちをあなたがたの手[て]に渡[わた]し、彼[かれ]らをあなたの前[まえ]から追[お]い出す。"
  32: "あなたは彼[かれ]らと、また彼[かれ]らの神々[かみがみ]と、契約[けいやく]を結[むす]んではならない。"
  33: "彼[かれ]らはあなたの地[ち]に住[す]んではならない。あなたをわたしに対して罪[つみ]を犯[おか]させることのないためである。もしあなたが彼[かれ]らの神々[かみがみ]に仕[つか]えるなら、それはあなたにとって罠[わな]となる。"

notes:
  1: "ἀκοὴ ματαία — 空しいうわさ (ματαία — «тщетная»). συγκαταθήσῃ — 手を組む (συγκατατίθεμαι — «соглашаться»). μάρτυς ἄδικος — 不正な証人."
  2: "μετὰ πλειόνων ἐπὶ κακίᾳ — 多くの者とともに悪に加わる. ἐκκλῖναι κρίσιν — 裁きを曲げる (ἐκκλίνω — «уклонять»)."
  3: "πένης — 貧しい者. οὐκ ἐλεήσεις ἐν κρίσει — 裁きの場でかばってはならない (букв. «не помилуешь»); LXX запрещает неправый суд и в пользу бедного."
  4: "ἀποστρέψας ἀποδώσεις — 引き返して返す (двойной оборот с причастием). πλανωμένοις — 迷っている."
  5: "πεπτωκὸς ὑπὸ τὸν γόμον — 荷の下に倒れている (γόμος — вьюк). συνεγερεῖς — ともに起こす (συνεγείρω)."
  6: "διαστρέψεις κρίμα — 裁きを曲げる (διαστρέφω — «извращать»)."
  7: "ἀπὸ παντὸς ῥήματος ἀδίκου ἀποστήσῃ — 不正なことばから遠ざかる. οὐ δικαιώσεις τὸν ἀσεβῆ ἕνεκεν δώρων — 贈り物のゆえに悪しき者を正しいとはしない."
  8: "ἐκτυφλοῖ ὀφθαλμοὺς βλεπόντων — 見る者の目をくらませる. λυμαίνεται ῥήματα δίκαια — 正しいことばを損なう (λυμαίνομαι — «портить»)."
  9: "οἴδατε τὴν ψυχὴν τοῦ προσηλύτου — 寄留者の心を知っている (букв. «душу»)."
  10: "Ἓξ ἔτη σπερεῖς — 六年の間…種を蒔く. γενήματα — 産物."
  11: "ἄφεσιν ποιήσεις καὶ ἀνήσεις αὐτήν — 休ませて解放する (ἄφεσις — «отпущение»; субботний год). τὰ ὑπολειπόμενα — 残ったもの."
  12: "ἀνάπαυσις — 休み. ἀναψύξῃ — 息をつぐ (ἀναψύχω — «освежиться, передохнуть»)."
  13: "ὄνομα θεῶν ἑτέρων οὐκ ἀναμνησθήσεσθε — ほかの神々の名前を思い起こさない (ἀναμιμνῄσκομαι)."
  14: "τρεῖς καιροὺς τοῦ ἐνιαυτοῦ — 年に三度 (καιρός — «срок, время»)."
  15: "ἑορτὴν τῶν ἀζύμων — 種なしパンの祭り. μηνὸς τῶν νέων — 新しい実りの月 (Авив; слав. «месяца новых плодов»). οὐκ ὀφθήσῃ κενός — 空の手で現れてはならない."
  16: "θερισμοῦ πρωτογενημάτων — 初穂の刈り入れの祭り. ἑορτὴν συντελείας — 年の終わりの祭り (праздник собирания плодов). συναγωγή — 取り入れ (букв. «собрание»)."
  17: "πᾶν ἀρσενικόν σου — あなたの男はすべて (букв. «всё мужское»)."
  18: "ὅταν γὰρ ἐκβάλω — 追い出すとき (у LXX придаточное в начале стиха; в Синодальном — в 23:20). ἐπὶ ζύμῃ — パン種の上に. στέαρ — 脂肪."
  19: "ἀπαρχὰς τῶν πρωτογενημάτων — 初穂. οὐχ ἑψήσεις ἄρνα ἐν γάλακτι μητρός — 子やぎを母の乳で煮てはならない (ἕψω — «варить»)."
  20: "ἀποστέλλω τὸν ἄγγελόν μου — 天使を遣わす. πρὸ προσώπου σου — あなたの前に."
  21: "πρόσεχε σεαυτῷ — 自分に気をつけよ. οὐ μὴ ὑποστείληταί σε — 赦さない (ὑποστέλλω — «щадить, уступать»). τὸ ὄνομά μού ἐστιν ἐπ᾿ αὐτῷ — 名がその者のうちにある."
  22: "Византийский текст здесь сливает 23:22 с 19:5–6: «народ избранный… царское священство» и вновь «если послушаешь гласа Моего…». В Синодальном (МТ) стих короче; переведено по gr-lxx-byz полностью. λαὸς περιούσιος — 宝の民 (περιούσιος — «особый, собственный»). βασίλειον ἱεράτευμα — 祭司の王国."
  23: "ἡγούμενός σου — あなたの前を導いて. ἐκτρίψω — 滅ぼし尽くす (ἐκτρίβω). Семь народов — по LXX; в Синодальном шесть народов."
  24: "στήλας — 石柱 (слав. «капища»). καθαιρέσει καθελεῖς — 打ち倒す (датив усиления при глаголе). συντρίβων συντρίψεις — 粉々に砕く."
  25: "μαλακίαν ἀποστρέψω — 病を遠ざける (μαλακία — «слабость, болезнь»)."
  26: "ἄγονος — 子を産めない. στεῖρα — 不妊の. ἀναπληρώσω — 満たす (ἀναπληρόω)."
  27: "τὸν φόβον ἀποστελῶ — 恐れを送る. ἐκστήσω — かき乱す (ἐξίστημι — «приводить в смятение»). φυγάδας — 逃げ去らせる (φυγάς — «беглец»)."
  28: "σφηκίας — 蜂 (в евр. «шершни»; σφηκία — осиный рой)."
  29: "ἔρημος — 荒れ果てた. θηρία τῆς γῆς — 野の獣."
  30: "κατὰ μικρὸν μικρόν — 少しずつ. κληρονομήσῃς — 嗣業として受け継ぐ (κληρονομέω)."
  31: "ἐρυθρὰ θάλασσα — 紅い海. Φυλιστιιμ — ペリシテ人. Εὐφράτης — ユーフラテス."
  32: "συγκαταθήσῃ … διαθήκην — 契約を結ぶ (συγκατατίθεμαι — «вступать в соглашение»)."
  33: "πρόσκομμα — 罠, соблазн (букв. «преткновение»)."
