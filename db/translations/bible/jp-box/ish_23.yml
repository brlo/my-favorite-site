# jp-box, Исход, глава 23. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — csl-ru, ru (с масоретского —
# только для понимания); jp-joc в этой главе нет. Язык — современный 常体.
# Глава 23: суд, правда и милосердие к врагу (1–9), субботний год и суббота (10–13),
# три праздника (14–19), Ангел Господень и обетование о земле (20–33).
# Красного и синего нет: говорит Бог, но это не прямая речь Христа во плоти; «<j>» не ставится.
# Прямая речь — в 「…」; вложенной речи нет.
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено по базе). Славянское «(от лица вашего)»
# в 23:23 — редакторская вставка в скобках, в 〔…〕 не берётся.
# Нумерация: у LXX 23:18 начинается с ὅταν γὰρ ἐκβάλω («когда изгоню народы…»), у Синодального
# (МТ) это начало 23:20. У LXX 23:22 византийского типа сливает нынешний стих с 19:5–6
# («народ избранный… царское священство»); в Синодальном стих короче. Перевод — по gr-lxx-byz.
# Сносок ⟨…⟩ нет: 石柱, 蜂, 嗣業 уже в корпусе или понятны по контексту.
# jp-ni не использовался.

