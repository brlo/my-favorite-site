verses:
  1: "アッシリアの軍勢[ぐんぜい]の総大将[そうだいしょう]ホロフェルネスに、イスラエルの子[こ]らが戦[いくさ]の備[そな]えを整[ととの]え、山地[さんち]の通[とお]り道[みち]を閉[と]ざし、高[たか]い山[やま]の頂[いただき]をことごとく城壁[じょうへき]で囲[かこ]み、平野[へいや]に躓[つまず]きとなるものを置[お]いたことが告[つ]げられた。"
  2: "彼[かれ]は激[はげ]しく怒[いか]りに燃[も]え、モアブの長[かしら]たちすべて、アンモンの将軍[しょうぐん]たち、海沿[うみぞ]いの地[ち]の太守[たいしゅ]たちすべてを呼[よ]び集[あつ]めた。"
  3: "そして彼[かれ]らに言[い]った。「カナンの子[こ]らよ、わたしに告[つ]げよ。山地[さんち]に住[す]むこの民[たみ]は何者[なにもの]か。彼[かれ]らが住[す]む町々[まちまち]はどのようなものか。その軍勢[ぐんぜい]の数[かず]、その支配[しはい]と力[ちから]はどこにあるのか。彼[かれ]らの上[うえ]に立[た]ち、その軍[いくさ]を率[ひき]いる王[おう]はだれか。"
  4: "また、なぜ彼[かれ]らは、西[にし]に住[す]むすべての者[もの]たちにもまして、わたしに会[あ]いに来[く]ることに背[せ]を向[む]けたのか。」"
  5: "アンモンの子[こ]らすべての長[かしら]であるアヒオルは、彼[かれ]に言[い]った。「わが主人[しゅじん]よ、どうか、しもべの口[くち]から出[で]る言葉[ことば]をお聞[き]きください。あなたの近[ちか]くに住[す]む、この山地[さんち]の民[たみ]について、わたしはあなたに真実[しんじつ]を告[つ]げる。しもべの口[くち]から偽[いつわ]りは出[で]ない。"
  6: "この民[たみ]はカルデア人[じん]の子孫[しそん]である。"
  7: "彼[かれ]らは以前[いぜん]、メソポタミアに寄留[きりゅう]していた。カルデアの地[ち]にいた自分[じぶん]たちの父[ちち]たちの神々[かみがみ]に従[したが]うことを望[のぞ]まなかったからである。"
  8: "彼[かれ]らは自分[じぶん]たちの父[ちち]たちの道[みち]から離[はな]れ、天[てん]の神[かみ]を拝[おが]んだ。自分[じぶん]たちが知[し]った神[かみ]である。そして、自分[じぶん]たちの神々[かみがみ]の前[まえ]から追[お]い出[だ]され、メソポタミアへ逃[に]げて、そこに長[なが]い日々[ひび]の間[あいだ]、寄留[きりゅう]した。"
  9: "彼[かれ]らの神[かみ]は、その寄留[きりゅう]の地[ち]から出[で]てカナンの地[ち]へ行[い]くように言[い]われた。彼[かれ]らはそこに住[す]み、金[きん]と銀[ぎん]、および非常[ひじょう]に多[おお]くの家畜[かちく]によって増[ふ]え広[ひろ]がった。"
  10: "そしてエジプトへ下[くだ]った。飢饉[ききん]がカナンの地[ち]の面[おもて]を覆[おお]ったからである。彼[かれ]らはそこで養[やしな]われるまで寄留[きりゅう]し、そこでおびただしい数[かず]の民[たみ]となり、その一族[いちぞく]には数[かず]がなかった。"
  11: "エジプトの王[おう]が彼[かれ]らに立[た]ち向[む]かい、巧[たくみ]みに計[はか]って労苦[ろうく]と煉瓦[れんが]の業[わざ]で彼[かれ]らを苦[くる]しめ、彼[かれ]らを卑[いや]しめて奴隷[どれい]とした。"
  12: "彼[かれ]らが自分[じぶん]たちの神[かみ]に向[む]かって叫[さけ]ぶと、神はエジプトの全土[ぜんど]を、癒[いや]すことのできない災[わざわ]いで打[う]たれた。そこでエジプト人[じん]は彼[かれ]らを自分[じぶん]たちの前[まえ]から追[お]い出[だ]した。"
  13: "神[かみ]は彼[かれ]らの前[まえ]で紅海[こうかい]を干[ひ]からされた。"
  14: "そして彼[かれ]らをシナイとカデシュ・バルネアの道[みち]へ導[みちび]き、彼[かれ]らは荒野[こうや]に住[す]むすべての者[もの]を追[お]い出[だ]した。"
  15: "彼[かれ]らはアモリ人[じん]の地[ち]に住[す]み、自分[じぶん]たちの力[ちから]によってエセボン人[じん]をすべて滅[ほろ]ぼした。そしてヨルダン川[がわ]を渡[わた]り、山地[さんち]のすべてを嗣業[しぎょう]として受[う]け継[つ]いだ。"
  16: "彼[かれ]らはカナン人[じん]、ペリジ人[じん]、エブス人[じん]、シケムの人々[ひとびと]、およびギルガシ人[じん]をすべて自分[じぶん]たちの前[まえ]から追[お]い出[だ]し、そこに長[なが]い日々[ひび]の間[あいだ]、住[す]んだ。"
  17: "彼[かれ]らが自分[じぶん]たちの神[かみ]の前[まえ]で罪[つみ]を犯[おか]さない間[あいだ]は、良[よ]いものは彼[かれ]らとともにあった。不正[ふせい]を憎[にく]む神[かみ]が彼[かれ]らとともにおられるからである。"
  18: "しかし、彼[かれ]らが神[かみ]の定[さだ]めた道[みち]から離[はな]れたとき、彼[かれ]らは多[おお]くの戦[いくさ]でひどく滅[ほろ]ぼされ、自分[じぶん]のものではない地[ち]へ捕囚[ほしゅう]として連[つ]れて行[い]かれ、自分[じぶん]たちの神[かみ]の神殿[しんでん]は地[ち]に打[う]ち倒[たお]され、その町々[まちまち]は敵[てき]に占領[せんりょう]された。"
  19: "そして今、彼[かれ]らは自分[じぶん]たちの神[かみ]に立[た]ち返[かえ]り、かつて散[ち]らされた離散[りさん]の地[ち]から上[のぼ]って来[き]て、自分[じぶん]たちの聖所[せいしょ]のあるエルサレムを手[て]に収[おさ]め、荒[あ]れていた山地[さんち]に住[す]みついた。"
  20: "そこで今、わが主人[しゅじん]よ。もしこの民[たみ]のうちに無知[むち]があり、彼[かれ]らが自分[じぶん]たちの神[かみ]に罪[つみ]を犯[おか]しているなら、わたしたちはこれが彼[かれ]らのうちにある躓[つまず]きであることを確[たし]かめ、上[のぼ]って行[い]って彼[かれ]らと戦[たたか]おう。"
  21: "しかし、もし彼[かれ]らの民[たみ]のうちに不法[ふほう]がないのなら、わが主人[しゅじん]よ、どうか、そのまま通[とお]り過[す]ぎてください。彼[かれ]らの主[しゅ]と彼[かれ]らの神[かみ]が彼[かれ]らのために立[た]ち向[む]かうことのないように。そうなれば、わたしたちは全[ぜん]地[ち]の前[まえ]で恥辱[ちじょく]の的[まと]となるであろう。」"
  22: "アヒオルがこれらの言葉[ことば]を語[かた]り終[お]えると、天幕[てんまく]を取[と]り囲[かこ]み、その周[まわ]りに立[た]つ民[たみ]はすべてつぶやいた。ホロフェルネスの貴族[きぞく]たちと、海沿[うみぞ]いの地[ち]およびモアブに住[す]むすべての者[もの]は言[い]った。「彼[かれ]を斬[き]れ」。"
  23: "「われわれはイスラエルの子[こ]らを恐[おそ]れないからだ。見[み]よ、彼[かれ]らは、力[ちから]もなく、強[つよ]い戦列[せんれつ]を組[く]む威力[いりょく]もない民[たみ]である。"
  24: "だから、上[のぼ]って行[い]こう。彼[かれ]らはあなたの全[ぜん]軍勢[ぐんぜい]の餌食[えじき]となるであろう、主人[しゅじん]ホロフェルネスよ。」"

notes:
  1: "ἀνηγγέλη — «было возвещено» (ἀναγγέλλω, аор. пассив). ἀρχιστράτηγος δυνάμεως Ασσουρ — 総大将 силы Ассирийской (слав. «вождоначалник силы ассурския»). παρεσκευάσαντο εἰς πόλεμον — «приготовились к войне»; διόδους συνέκλεισαν — «заперли проходы» (συγκλείω). σκάνδαλα — «преткновения», заграждения (σκάνδαλον; слав. «преткновения»)."
  2: "ὠργίσθη θυμῷ σφόδρα — «разгневался яростью весьма»: ὀργίζομαι с дательным θυμός, плеоназм; слав. «разгневася яростию зело». ἄρχοντες Μωαβ — начальники Моава; στρατηγοί — 将軍; σατράπαι τῆς παραλίας — 太守 приморья (παραλία). Глагол «сказал» открывает ст. 3."
  3: "Ἀναγγείλατε δή μοι — «возвестите же мне» (импер. аор.); υἱοὶ Χανααν — обращение к моавитянам и аммонитянам как к хананеям. ὁ καθήμενος — «сидящий», т. е. обитающий; τίς ... βασιλεὺς ἡγούμενος στρατιᾶς — «кто царь, ведущий войско их» (ἡγέομαι). Речь продолжается в ст. 4."
  4: "κατενωτίσαντο — «повернулись спиной, воспротивились» (κατανωτίζομαι, от νῶτον — спина); слав. «сопротивишася». παρὰ πάντας τοὺς κατοικοῦντας ἐν δυσμαῖς — «более всех живущих на западе» (δυσμή — закат, запад). εἰς ἀπάντησιν — «навстречу»; здесь кончается речь Олоферна."
  5: "ὁ ἡγούμενος πάντων υἱῶν Αμμων — «вождь всех сынов Аммона». Ἀκουσάτω ὁ κύριός μου — импер. 3 л.: «пусть господин мой услышит»; ἐκ στόματος τοῦ δούλου σου — «из уст раба твоего». πλησίον σοῦ οἰκοῦντος — genitivus absolutus; слав. и ru относят «близ тебя» к народу, так же передано. οὐκ ἐξελεύσεται ψεῦδος — «не выйдет ложь». Начало речи Ахиора (до ст. 21)."
  6: "ἀπόγονοι Χαλδαίων — «потомки халдеев» (ἀπόγονος); слав. «исчадия халдеов». Короткий стих-тезис, с которого начинается история народа."
  7: "παρῴκησαν τὸ πρότερον — «жили прежде» (παροικέω — 寄留). οὐκ ἐβουλήθησαν ἀκολουθῆσαι — «не пожелали последовать» (βούλομαι, ἀκολουθέω). οἳ ἐγένοντο ἐν γῇ Χαλδαίων — «которые были в земле Халдейской» (относительное к πατέρων)."
  8: "ἐξέβησαν ἐξ ὁδοῦ — «вышли (уклонились) с пути» (ἐκβαίνω); γονεῖς — родители (передано 父たち, как в слав. «отец»). προσεκύνησαν τῷ θεῷ τοῦ οὐρανοῦ — «поклонились Богу неба»; θεῷ ᾧ ἐπέγνωσαν — «Богу, Которого познали» (ἐπιγινώσκω). ἐξέβαλον — 3 л. мн. ч. без подлежащего (по смыслу халдеи, в ru названы прямо), поэтому в японском пассив."
  9: "εἶπεν ὁ θεὸς ἐξελθεῖν ... πορευθῆναι — «сказал выйти и идти»: инфинитивы при εἶπεν, поэтому косвенная речь. παροικία — место странствия (слав. «пришелствие»). ἐπληθύνθησαν χρυσίῳ καὶ ἀργυρίῳ — «умножились золотом и серебром» (датив средства); ἐν κτήνεσιν πολλοῖς σφόδρα — «скотом многим весьма»."
  10: "κατέβησαν εἰς Αἴγυπτον — «сошли в Египет». ἐκάλυψεν τὸ πρόσωπον τῆς γῆς λιμός — «голод покрыл лицо земли» (λιμός; слав. «покры бо лице земли... глад»). μέχρις οὗ διετράφησαν — «доколе не были вскормлены» (διατρέφω; слав. «прекормишася»). εἰς πλῆθος πολύ — «в множество великое»; οὐκ ἦν ἀριθμός — «не было числа»."
  11: "ἐπανέστη — «восстал» (ἐπανίστημι). κατεσοφίσατο — «перехитрил, обошёл хитростью» (κατασοφίζομαι; слав. «прехитри»). ἐν πόνῳ καὶ πλίνθῳ — «трудом и кирпичом» (πλίνθος — кирпич, слав. «плинфа»); ἔθεντο εἰς δούλους — «поставили в рабы»."
  12: "ἀνεβόησαν — «возопили»; ἐπάταξεν πᾶσαν τὴν γῆν — «поразил всю землю» (πατάσσω), подлежащее — Бог. πληγαῖς, ἐν αἷς οὐκ ἦν ἴασις — «язвами, в которых не было исцеления» (πληγή, ἴασις). ἐξέβαλον οἱ Αἰγύπτιοι — «изгнали египтяне»."
  13: "κατεξήρανεν — «иссушил» (καταξηραίνω). ἐρυθρὰ θάλασσα — Чермное море (紅海). Стих без сказуемого «перевёл»: оно в ст. 14 (ἤγαγεν)."
  14: "ἤγαγεν εἰς ὁδὸν τοῦ Σινα καὶ Καδης Βαρνη — «вёл путём Сины и Кадис-Варни» (Σινα — Синай; слав. «сины»). ἐξέβαλον πάντας τοὺς κατοικοῦντας ἐν τῇ ἐρήμῳ — «изгнали всех живущих в пустыне»."
  15: "ᾤκησαν ἐν γῇ Αμορραίων — «поселились в земле аморреев». ἐξωλέθρευσαν — «истребили» (ἐξολεθρεύω, усилительный глагол). ἐν τῇ ἰσχύι αὐτῶν — «силою их». διαβάντες τὸν Ιορδάνην — «перейдя Иордан»; ἐκληρονόμησαν — «наследовали» (κληρονομέω)."
  16: "τὸν Συχεμ — в греческом винительный падеж в ряду народов (Χαναναῖον, Φερεζαῖον, Ιεβουσαῖον), поэтому シケムの人々; слав. «сихема». Γεργεσαῖοι — ギルガシ人 (слав. «гергесеи»). κατῴκησαν ἐν αὐτῇ — «жили в ней» (в земле)."
  17: "ἕως οὐχ ἥμαρτον — «доколе не согрешили» (ἕως с отрицанием). τὰ ἀγαθά — блага, доброе (слав. «благая»). θεὸς μισῶν ἀδικίαν — «Бог, ненавидящий неправду» (причастие μισῶν); ἐστιν — настоящее время: «есть с ними»."
  18: "ἀπέστησαν ἀπὸ τῆς ὁδοῦ — «отступили от пути»; ἧς διέθετο αὐτοῖς — «который завещал им» (διατίθεμαι — устанавливать, завещать). ἐξωλεθρεύθησαν — «были истреблены»; ᾐχμαλωτεύθησαν εἰς γῆν οὐκ ἰδίαν — «отведены в плен в землю не свою». ἐγενήθη εἰς ἔδαφος — «стал землёй», т. е. разрушен до основания (ἔδαφος); слав. «бысть в попрание» — иное чтение. ἐκρατήθησαν ὑπὸ τῶν ὑπεναντίων — «взяты неприятелями» (ὑπεναντίος)."
  19: "ἐπιστρέψαντες ἐπὶ τὸν θεόν — «обратившись к Богу». ἀνέβησαν ἐκ τῆς διασπορᾶς — «взошли из рассеяния» (διασπορά); οὗ διεσπάρησαν — «куда были рассеяны» (διασπείρω). κατέσχον τὴν Ιερουσαλημ — «овладели Иерусалимом» (κατέχω); τὸ ἁγίασμα — святилище. κατῳκίσθησαν — «поселились» (κατοικίζω, пассив); ὅτι ἦν ἔρημος — «ибо была пуста»."
  20: "δέσποτα κύριε — обращение «владыко господи» (δέσποτης + κύριος; слав. «владыко господине»). ἀγνόημα — «неведение, заблуждение» (слав. «безумие»); ἁμαρτάνουσιν εἰς τὸν θεόν — «грешат против Бога». ἐπισκεψόμεθα — «усмотрим, заметим» (ἐπισκέπτομαι); σκάνδαλον — преткновение; ἐκπολεμήσομεν — «будем воевать» (ἐκπολεμέω)."
  21: "ἀνομία — беззаконие; παρελθέτω ὁ κύριός μου — «пусть пройдёт господин мой [мимо]» (παρέρχομαι). μήποτε ὑπερασπίσῃ — «как бы не защитил» (ὑπερασπίζω), оборот опасения. ἐσόμεθα εἰς ὀνειδισμόν — «будем в поношение»; ἐναντίον πάσης τῆς γῆς — «пред всей землёй». Конец речи Ахиора."
  22: "ἐπαύσατο λαλῶν — «перестал говорить» (παύω с причастием); ἐγόγγυσεν — «возроптал» (γογγύζω). ὁ κυκλῶν τὴν σκηνὴν καὶ περιεστώς — «окружающий шатёр и предстоящий» (κυκλόω, περιΐστημι; σκηνή — 天幕). μεγιστᾶνες — вельможи (μεγιστάν); παραλία — приморье. συγκόψαι αὐτόν — «посечь его» (συγκόπτω): инфинитив при εἶπαν, передан прямой речью."
  23: "οὐ γὰρ φοβηθησόμεθα — «ибо не убоимся» (буд. от φοβέομαι). λαὸς ἐν ᾧ οὐκ ἔστιν δύναμις — «народ, в котором нет силы» (ἐν ᾧ; слав. «в нихже»). κράτος — могущество, власть; εἰς παράταξιν ἰσχυράν — «для сильного строя» (παράταξις — боевой порядок, 戦列). Вторая часть речи вельмож — до ст. 24."
  24: "διὸ δή — «итак, поэтому». ἀναβησόμεθα — «взойдём»; εἰς κατάβρωσιν — «в снедь, на съедение» (κατάβρωσις). πάσης τῆς στρατιᾶς σου — «всего войска твоего» (στρατιά). δέσποτα Ολοφέρνη — обращение «владыко Олоферне»."
