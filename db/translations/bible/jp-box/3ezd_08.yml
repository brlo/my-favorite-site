verses:
  1: "彼[かれ]は答[こた]えて言[い]った。「いと高[たか]き方[かた]はこの世[よ]を多[おお]くの者[もの]のために、来[きた]るべき世[よ]を少[すく]ない者[もの]のために造[つく]られた。"
  2: "エズラ、たとえをあなたに語[かた]ろう。あなたが地[ち]に問[と]えば、地[ち]はあなたに答[こた]える。土[つち]の器[うつわ]のできる土[つち]は多[おお]く、金[きん]の出[で]る砂[すな]は少[すく]ない、と。この世[よ]の営[いとな]みも同[おな]じである。"
  3: "多[おお]くの者[もの]が造[つく]られたが、救[すく]われる者[もの]は少[すく]ない。」"
  4: "わたしは答[こた]えて言[い]った。「わが魂[たましい]よ、悟[さと]りを食[く]らい、知恵[ちえ]を飲[の]み干[ほ]せ。"
  5: "おまえは聞[き]き従[したが]うことを約束[やくそく]し、預言[よげん]しようと望[のぞ]んだ。しかし、おまえに与[あた]えられているのは、ただ生[い]きるための時[とき]だけである。」"
  6: "「ああ、主[しゅ]よ。あなたは僕[しもべ]に、あなたの前[まえ]で祈[いの]らせ、わたしたちの心[こころ]に種[たね]を、感覚[かんかく]に清[きよ]めをお与[あた]えにならないのですか。そこから実[み]が生[しょう]じ、朽[くち]ちる者[もの]がみな、人[ひと]の位[くらい]を負[お]う者[もの]として生[い]きることができるように。"
  7: "あなたはただ一人[ひとり]であり、わたしたちはあなたの御手[みて]の一[ひと]つの造[つく]られたもの、あなたが言[い]われたとおりです。"
  8: "どうして今[いま]、胎[たい]のうちに体[からだ]が造[つく]られ、あなたがその肢[えだ]をお与[あた]えになるのですか。あなたの造[つく]られたものは火[ひ]と水[みず]の中[なか]に保[たも]たれ、九か月[きゅうかげつ]のあいだ、その中[なか]に造[つく]られたものを身[み]に宿[やど]して耐[た]えるのです。"
  9: "保[たも]つものと保[たも]たれるもの、その両方[りょうほう]が保[たも]たれる。やがて胎[たい]は、その中[なか]で育[そだ]った保[たも]たれたものを再[ふたた]び外[そと]へ出[だ]すのです。"
  10: "あなたは、その肢[えだ]そのもの、すなわち乳房[ちぶさ]から、乳房[ちぶさ]の実[み]である乳[ちち]を出[だ]すように命[めい]じられた。"
  11: "造[つく]られたものが、ある時[とき]まで養[やしな]われ、その後[あと]はあなたのあわれみに委[ゆだ]ねられるためです。"
  12: "あなたはこれをあなたの正[ただ]しさによって育[そだ]て、あなたの律法[りっぽう]を教[おし]え、あなたの悟[さと]りによって導[みちび]かれた。"
  13: "あなたはこれをあなたの造[つく]られたものとして死[し]なせ、またあなたの業[わざ]として生[い]き返[かえ]らせるのです。"
  14: "だから、もしあなたが、これほど大[おお]きな労[ろう]苦[く]によって造[つく]られたものを滅[ほろ]ぼされるなら、あなたの命[めい]令[れい]によって、造[つく]られつつあったものも保[たも]たれるように整[ととの]えることは容易[ようい]です。"
  15: "それゆえ今[いま]、主[しゅ]よ、わたしは語[かた]ります。すべての人[ひと]については、あなたがわたしよりもよく知[し]っておられます。わたしが苦[くる]しむあなたの民[たみ]について、"
  16: "わたしが泣[な]き叫[さけ]ぶあなたの嗣業[しぎょう]について、わたしが悲[かな]しむイスラエルについて、わたしが苦[くる]しむヤコブについて語[かた]ります。"
  17: "だから、わたしは自分[じぶん]のため、また彼らのために、あなたの前[まえ]で祈[いの]り始[はじ]めます。わたしたち地[ち]に住[す]む者[もの]の堕落[だらく]を、わたしは見[み]ているからです。"
  18: "しかし、わたしは、やがて来[く]る裁[さば]き手[て]の速[はや]さを聞[き]きました。"
  19: "だから、わたしの声[こえ]を聞[き]き、わたしの言葉[ことば]を悟[さと]ってください。わたしはあなたの前[まえ]に語[かた]ります。」――エズラが取[と]り去[さ]られる前[まえ]の、エズラの言葉[ことば]の始[はじ]め。"
  20: "わたしは言[い]った。「主[しゅ]よ、あなたは永遠[えいえん]に住[す]まい、その目[め]は高[たか]い所[ところ]と空[そら]に上[あ]げられ、"
  21: "あなたの座[ざ]は値[あたい]知[し]れず、栄光[えいこう]は測[はか]り知[し]れません。天[てん]使[し]の軍[ぐん]勢[せい]がおののきつつあなたの前[まえ]に立[た]ち、その務[つと]めは風[かぜ]と火[ひ]の中[なか]に移[うつ]り行[ゆ]きます。あなたの言葉[ことば]は真[しん]実[じつ]であり、その語[かた]りは永遠[えいえん]です。"
  22: "あなたの命[めい]令[れい]は強[つよ]く、その顧[かえり]みは恐[おそ]ろしいものです。あなたのまなざしは淵[ふち]を干[ひ]からせ、怒[いか]りは山[やま]を溶[と]かし、真理[しんり]は証[あかし]をします。"
  23: "あなたの僕[しもべ]の祈[いの]りを聞[き]き、あなたの造[つく]られたものの願[ねが]いを耳[みみ]に納[おさ]めてください。"
  24: "わたしが生[い]きるかぎり語[かた]り、悟[さと]るかぎり答[こた]えます。あなたの民[たみ]の罪[つみ]に目[め]を留[と]めず、真理[しんり]をもってあなたに仕[つか]える者[もの]たちに目[め]を留[と]めてください。"
  25: "もろもろの民[たみ]の不敬[ふけい]な企[くわだ]てに心[こころ]を留[と]めず、苦[くる]しみのうちにあなたの戒[いまし]めを守[まも]った者[もの]たちに心[こころ]を留[と]めてください。"
  26: "あなたの前[まえ]で偽[いつわ]りをもって生[い]きた者[もの]たちを思[おも]わず、あなたの御心[みこころ]によって恐[おそ]れを知[し]った者[もの]たちを思[おも]い起[お]こしてください。"
  27: "獣[けもの]のような習[なら]わしを持[も]った者[もの]たちを滅[ほろ]ぼそうと望[のぞ]まず、あなたの律法[りっぽう]を明[あき]らかに教[おし]えた者[もの]たちに目[め]を注[そそ]いでください。"
  28: "獣[けもの]よりも悪[わる]いと定[さだ]められた者[もの]たちに怒[いか]らないでください。"
  29: "いつもあなたの正[ただ]しさと栄光[えいこう]に望[のぞ]みを置[お]く者[もの]たちを愛[あい]してください。"
  30: "わたしたちも父祖[ふそ]たちも、このような病[やまい]によって消[き]え去[さ]りつつあります。"
  31: "あなたは、罪[つみ]深[ぶか]いわたしたちのゆえに、あわれみ深[ぶか]い方[かた]と呼[よ]ばれるのです。"
  32: "もしあなたがわたしたちをあわれもうと望[のぞ]まれるなら、そのときあなたはあわれみ深[ぶか]い方[かた]と呼ばれます。わたしたちには正[ただ]しさの業[わざ]がないからです。"
  33: "正[ただ]しい者[もの]たちは、多[おお]くの業[わざ]が備[そな]えられているので、自分[じぶん]の業[わざ]によって報[むく]いを受[う]けます。"
  34: "人[ひと]とは何[なん]ですか。あなたがこれに怒[いか]られるとは。朽[くち]ちた者[もの]の族[ぞく]とは何[なん]ですか。あなたがこれほどに心[こころ]を痛[いた]められるとは。"
  35: "まことに、生[う]まれた者[もの]のうちに不敬[ふけい]を行[おこな]わなかった者[もの]はなく、あなたをほめたたえる者[もの]のうちに罪[つみ]を犯[おか]さなかった者[もの]はいません。"
  36: "主[しゅ]よ、あなたが善[ぜん]い業[わざ]の実[み]を持[も]たない者[もの]たちをあわれまれるとき、あなたの正[ただ]しさとあなたの善[ぜん]が告[つ]げ知[し]らされるのです。」"
  37: "彼[かれ]は答[こた]えて言[い]った。「あなたはいくつかのことを正[ただ]しく語[かた]った。あなたの言葉[ことば]どおりになる。"
  38: "わたしは、罪[つみ]を犯[おか]した者[もの]たちの造[つく]られたものについて、死[し]の前[まえ]、裁[さば]きの前[まえ]、滅[ほろ]びの前[まえ]に、真[しん]実[じつ]に思[おも]い巡[めぐ]らすことはない。"
  39: "しかし、正[ただ]しい者[もの]たちの業[わざ]を喜[よろこ]び、彼らの旅路[たびじ]と救[すく]いと報[むく]いの受[う]け取[と]りを思[おも]い起[お]こす。"
  40: "わたしが語[かた]ったとおり、そのとおりである。"
  41: "農夫[のうふ]が地[ち]に多[おお]くの種[たね]を蒔[ま]き、多[おお]くの苗木[なえぎ]を植[う]えても、蒔[ま]かれたものがすべて時[とき]にかなって救[すく]われるのでも、植[う]えられたものがすべて根[ね]づくのでもない。同[おな]じように、この世[よ]に蒔[ま]かれた者[もの]たちがすべて救[すく]われるのでもない。」"
  42: "わたしは答[こた]えて言[い]った。「もし恵[めぐ]みを得[え]たのなら、語[かた]ります。"
  43: "農夫[のうふ]の種[たね]が芽[め]を出[だ]さず、あるいは時[とき]にあなたの雨[あめ]を受[う]けず、あるいは雨[あめ]が多[おお]すぎて腐[くさ]ってしまうなら、"
  44: "同[おな]じように、あなたの御手[みて]によって造[つく]られた人[ひと]も滅[ほろ]びるのです。あなたは彼[かれ]の像[かたち]と呼ばれました。あなたは彼に似[に]ておられ、彼のためにすべてを造[つく]られ、彼を農夫[のうふ]の種[たね]に似[に]せられたからです。"
  45: "わたしたちに怒[いか]らず、あなたの民[たみ]を赦[ゆる]し、あなたの嗣業[しぎょう]をあわれんでください。あなたは御自分[おんじしん]の造[つく]られたものをあわれまれるのです。」"
  46: "彼[かれ]は答[こた]えて言[い]った。「今[いま]あるものは今[いま]ある者[もの]に、やがて来[く]るものは来[く]る者[もの]に。"
  47: "あなたがわたしの造[つく]られたものをわたしよりも愛[あい]するには、まだ多[おお]くのものが足[た]りない。わたしはあなた自身[じしん]にはしばしば近[ちか]づいたが、不[ふ]正[せい]な者[もの]たちには決[けっ]して近[ちか]づかなかった。"
  48: "しかし、その点[てん]でもあなたはいと高[たか]き方[かた]の前[まえ]で驚[おどろ]くべき者[もの]である。"
  49: "あなたはふさわしくへりくだり、自分[じぶん]を、正[ただ]しい者[もの]たちの間[あいだ]で多[おお]くほめたたえられるほど高[たか]く評[ひょう]さなかったからである。"
  50: "それゆえ、この世[よ]の終[お]わりに住[す]む者[もの]たちには多[おお]くの災[わざわ]いと貧[まず]しさが臨[のぞ]む。彼らが大[おお]きな高[こう]慢[まん]のうちを歩[あゆ]んだからである。"
  51: "あなたは自分[じぶん]自身[じしん]について悟[さと]り、あなたに似[に]た者[もの]たちについて栄光[えいこう]を求[もと]めよ。"
  52: "あなたがたには楽園[らくえん]が開[ひら]かれ、命[いのち]の木[き]が植[う]えられ、来[きた]るべき時[とき]が備[そな]えられ、豊[ゆた]かさが整[ととの]えられ、都[みやこ]が建[た]てられ、安[やす]らぎが確[たし]かなものとされ、善[ぜん]と知恵[ちえ]が完全[かんぜん]にされている。"
  53: "悪[あく]の根[ね]はあなたがたから印[しるし]で封[ふう]じられ、弱[よわ]さと朽[くち]ちるものはあなたがたから隠[かく]され、朽[くち]ちることは忘[わす]れのうちによみへ逃[に]げ去[さ]る。"
  54: "病[やまい]は過[す]ぎ去[さ]り、終[お]わりに不死[ふし]の宝[たから]が示[しめ]された。"
  55: "だから、滅[ほろ]びる者[もの]の多[おお]さについて、これ以上[いじょう]探[さぐ]り求[もと]めてはならない。"
  56: "彼らは自由[じゆう]を受[う]けながら、いと高[たか]き方[かた]を軽[かろ]んじ、その律法[りっぽう]を無視[むし]し、その道[みち]を捨[す]て去[さ]ったからである。"
  57: "さらに、その正[ただ]しい者[もの]たちをも踏[ふ]みにじった。"
  58: "そして心[こころ]のうちで言[い]った。『神[かみ]はいない』と。自分[じぶん]たちが死[し]ぬべき者[もの]であることを知[し]っていながら。"
  59: "あなたがたには予[あらかじ]め告[つ]げられたことが臨[のぞ]むように、彼らには備[そな]えられた渇[かわ]きと責[せ]め苦[く]が臨[のぞ]む。神[かみ]は人[ひと]を滅[ほろ]ぼすことを望[のぞ]まれなかった。"
  60: "しかし、造[つく]られた者[もの]たちは、自分[じぶん]たちを造[つく]った方[かた]の名[な]を汚[けが]し、自分[じぶん]たちに命[いのち]を備[そな]えられた方[かた]に感謝[かんしゃ]しなかった。"
  61: "それゆえ、わたしの裁[さば]きは今[いま]近[ちか]づいている。"
  62: "それはわたしがすべての者[もの]に示[しめ]したのではなく、あなたと、あなたに似[に]た少[すく]ない者[もの]たちにだけ示[しめ]した。」わたしは答[こた]えて言[い]った。"
  63: "「見[み]よ、主[しゅ]よ。あなたは今[いま]、終[お]わりの時[とき]に始[はじ]められる多[おお]くのしるしを、わたしに示[しめ]されました。しかし、それがどの時[とき]なのかは示[しめ]されませんでした。」"

notes:
  1: "«сей век сотворил вышний многих ради, будущий же ради малых» — «этот век сотворил Всевышний ради многих, а будущий — ради малых»."
  2: "«реку же тебе уподобление» — «скажу тебе подобие»; «яко даст земли много болши, от неяже будет скудельное, мало же праха, отонудуже злато бывает» — «что земля даёт много больше того, из чего бывает глиняное, а праха, из которого бывает золото, — мало»; «тако и деяние настоящаго века» — «так и дела (устройство) настоящего века»."
  3: "«мнози убо сотворени суть, не мнози же спасутся» — «многие сотворены, но немногие спасутся»."
  4: "«душе моя! пожри убо разумение и поглоти мудрость» — «душа моя! пожри разумение и поглоти мудрость»."
  5: "«обещала еси слушати, и пророчествовати хотящи» — «ты обещала слушать и пожелала пророчествовать»; «не бо дано есть тебе время, разве токмо жити» — «ибо не дано тебе время, а только жить»."
  6: "«аще не попустиши рабу твоему, да помолимся пред тобою, и даси нам семя в сердце и чувству очищение» — «если не попустишь рабу Твоему, чтобы мы молились пред Тобою и Ты дал нам семя в сердце и чувству очищение»; «иже носити будет место человека» — «кто будет носить место человека». ru: «имя человека» — иное чтение."
  7: "«един бо еси, и едино сотворение мы есмы руку твоею, якоже глаголал еси» — «ибо Ты един, и мы единое творение рук Твоих, как Ты сказал»."
  8: "«како ныне в ложеснах создано есть тело, и подаеши составы?» — «как ныне во чреве создаётся тело, и Ты подаёшь составы (члены)?»; «содержится во огни и в воде твое творение» — «содержится в огне и воде творение Твоё»; «девять месяц терпит твое создание твою тварь» — «девять месяцев терпит создание Твоё творение Твоё»."
  9: "«самое же еже хранит, и еже хранится, обоя сохранятся» — «и хранящее, и хранимое — оба сохраняются»; «сохраненая же некогда паки издают ложесна, яже в них растоша» — «сохранённое некогда снова издают чресла (утроба), что в них возросло»."
  10: "«повелел бо еси от самых членов, сиречь от сосцев издаяти млеко плоду сосцев» — «ибо Ты повелел от самых членов, то есть от сосцов, издавать молоко, плод сосцов»."
  11: "«да питается то, еже создано есть, даже до времене некоего, и потом управиши его твоему милосердию» — «чтобы питалось созданное до некоего времени, а потом Ты передашь его милосердию Твоему»."
  12: "«воспитал еси его твоею правдою и научил еси его закону твоему и наказал еси его твоим разумом» — «Ты воспитал его правдою Твоею, научил закону Твоему и наставил разумом Твоим»."
  13: "«умертвиши его якоже твое сотворение, и паки оживиши его, якоже дело твое» — «Ты умертвишь его, как творение Твоё, и снова оживишь, как дело Твоё»."
  14: "«аще убо погубиши его, иже толикими труды создан есть» — «если Ты погубишь созданного с таким трудом»; «твоим повелением удобно есть устроити, да и то, еже творяшеся, сохранится» — «повелением Твоим легко устроить, чтобы и то, что творилось, сохранилось»."
  15: "«о всяцем человеце ты паче веси» — «о всяком человеке Ты больше знаешь»; «о людех твоих, о нихже болезную» — «о народе Твоём, о котором я болею (скорблю)»."
  16: "«о наследии твоем, егоже ради аз рыдаю» — «о наследии Твоём, о котором я рыдаю»; «и ради израиля, о немже скорбен есмь, и иакова ради, о немже аз болезную» — «и об Израиле, о котором я скорбен, и об Иакове, о котором я болею»."
  17: "«начну молитися пред тобою за мя и за них» — «начну молиться пред Тобою за себя и за них»; «вижду падение наше, иже обитаем на земли» — «вижу падение наше, обитающих на земле»."
  18: "«слышах скорость судии, иже приидет» — «я слышал о скорости Судии, который придёт»."
  19: "«услыши глас мой и разумей слово мое, и возглаголю пред тобою» — «услышь голос мой, уразумей слово моё, и я буду говорить пред Тобою». «Начало словес ездриных, прежде неже взят бысть» — редакционный заголовок (лат. Incipit...), стоящий в конце стиха; вынесен за кавычки как заглавие. ru даёт его в скобках."
  20: "«И рех: Господи, иже обитаеши во век, егоже очи вознесенны на вышняя и на воздусе» — «я сказал: Господи, живущий во век, Которого очи вознесены к вышнему и к воздуху». Здесь начинается вторая молитва."
  21: "«егоже престол безценный есть и слава непостижима, емуже предстоят вои ангелстии с трепетом, ихже сохранение в ветре и огни обращается, егоже слово истинно и глаголы вечнии» — «Которого престол неоценим и слава непостижима, Которому предстоят с трепетом ангельские воинства, которых хранение обращается в ветре и огне, Которого слово истинно и глаголы вечны»."
  22: "«повеление крепко и разсмотрение страшно, егоже зрак изсушает бездны и гнев растаявати творит горы и истина свидетелствует» — «повеление крепко и смотрение страшно, Которого взор иссушает бездны, гнев заставляет горы таять, и истина свидетельствует». ru: «истина пребывает во веки» — иное чтение."
  23: "«услыши молитву раба твоего и во ушеса приими моление творения твоего» — «услышь молитву раба Твоего и в уши прими моление творения Твоего»."
  24: "«егда бо живу, глаголати буду, и егда разумею, отвещати буду» — «ибо пока живу, буду говорить, и пока разумею, буду отвечать»; «не смотри на людий твоих грехи, но иже тебе во истине служат» — «не смотри на грехи народа Твоего, но на тех, кто служит Тебе в истине»."
  25: "«ни внемли нечестивым языков начинанием, но иже твоя свидения со болезнию сохраниша» — «не внимай нечестивым начинаниям народов, но тем, кто с болезнью сохранил откровения Твои»."
  26: "«ни помысли иже пред тобою лживо пожиша, но помяни сих, иже по воли твоей страх познаша» — «не помышляй о тех, кто лживо жил пред Тобою, но помяни тех, кто по воле Твоей познал страх»."
  27: "«ниже хощи погубити, иже скотския обычаи имеша, но воззри на тех, иже закону твоему ясно учиша» — «не желай погубить тех, кто имел скотские обычаи, но воззри на тех, кто ясно учил закону Твоему»."
  28: "«ни прогневайся на них, иже зверей горши осуждени суть» — «не гневайся на тех, кто осуждён хуже зверей»."
  29: "«но возлюби сих, иже всегда на правду твою надеются и славу» — «но возлюби тех, кто всегда надеется на правду Твою и славу»."
  30: "«яко мы и отцы наши таковыми болезньми исчезаем» — «ибо мы и отцы наши такими болезнями исчезаем»."
  31: "«ты же ради нас грешных милосерд наречешися» — «Ты же ради нас, грешных, назовёшься милосердым»."
  32: "«аще бо пожелаеши, да нас помилуеши, тогда милосерд наречешися, не имеющим нам дел правды» — «если Ты пожелаешь помиловать нас, тогда назовёшься милосердым, так как мы не имеем дел правды»."
  33: "«праведнии бо, ихже суть дела многа представленна, от своих дел приимут мзду» — «праведники, у которых много дел представлено, от своих дел получат мзду»."
  34: "«что бо есть человек, да на него прогневаешися? или род растлен, да тако огорчен будеши на него?» — «что есть человек, чтобы Ты гневался на него? или род растленный, чтобы Ты так огорчался им?»"
  35: "«воистинну бо никтоже от рожденных есть, иже бы нечестиво не сотворил, и от исповедающихся, иже бы не согрешил» — «поистине нет никого из рождённых, кто не сделал бы нечестиво, и из исповедующих Тебя, кто не согрешил бы»."
  36: "«в том бо возвестится правда твоя и благость твоя, Господи, егда милосерд будеши им, иже не имеют существа благих дел» — «в том возвестится правда Твоя и благость Твоя, Господи, когда Ты будешь милосерд к тем, кто не имеет существа добрых дел»."
  37: "«право глаголал еси некая, и по словесем твоим тако и будет» — «справедливо ты сказал нечто, и по словам твоим так и будет»."
  38: "«понеже не истинно помышлю на здание сих, иже согрешиша прежде смерти, прежде суда, прежде погубления» — «ибо истинно не помышляю о делах тех созданий, которые согрешили прежде смерти, прежде суда, прежде погибели». Место тёмное; ru понимает так же."
  39: "«но услаждуся над праведных творением и помяну пришелствие и спасение и мзды восприятие» — «но услаждаюсь делами праведных и поминаю странствование, спасение и принятие мзды»."
  40: "«якоже убо глаголал есмь, тако и есть» — «как Я сказал, так и есть»."
  41: "«якоже бо земледелец сеет на земли семена многа и саждения множество садит» — «как земледелец сеет на земле много семян и садит множество насаждений»; «не во время вся, яже сеяна суть, спасутся, но ни вся, яже сажена суть, вкоренятся» — «не всё посеянное со временем спасётся, и не всё посаженное укоренится»."
  42: "«аще обретох благодать, возглаголю» — «если я обрёл благодать, буду говорить»."
  43: "«якоже семя земледелца аще не взыдет, или не приимет дождя твоего во время, или аще растлено будет умножением дождя» — «как семя земледельца, если не взойдёт, или не примет дождя Твоего вовремя, или повредится от множества дождя»."
  44: "«погибает подобне и человек, иже рукама твоима создан бысть» — «погибает подобно и человек, созданный руками Твоими»; «ты ему образ именовался еси» — «Ты назвался его образом»; ru: «Ты называешься его первообразом» — уточнение, в тексте по слав. (像)."
  45: "«понеже подобен еси ему, егоже ради вся создал еси и уподобил еси семени земледелцеву» — «ибо Ты подобен ему, для которого всё создал и которого уподобил семени земледельца»; «не прогневайся на нас, но прости людем твоим и помилуй наследие твое» — «не гневайся на нас, но прости народу Твоему и помилуй наследие Твоё»."
  46: "«яже суть настоящая, настоящим, и яже будущая, будущим» — «что настоящее — настоящим, а что будущее — будущим»."
  47: "«много бо тебе останет, да можеши возлюбити мое сотворение паче мене» — «многого тебе недостаёт, чтобы ты мог возлюбить создание Моё более Меня»; «тебе же часто и самому приближахся, к неправедным же никогда» — «к тебе самому Я часто приближался, а к неправедным никогда»."
  48: "«но и в сем дивен еси пред вышним» — «но и в этом ты дивен пред Всевышним»."
  49: "«яко смирился еси якоже подобает тебе, и не судил еси тебе, да между праведными много славишися» — «что ты смирился, как подобает тебе, и не судил о себе так, чтобы много славиться между праведными»."
  50: "«того ради беды многи и нищеты сотворятся тем, иже обитают век на последок, понеже во мнозей гордыни ходиша» — «потому многие беды и нищета постигнут тех, кто обитает век в последние времена, ибо они ходили в великой гордыне»."
  51: "«ты же о тебе разумей и о подобных тебе взыскуй славу» — «ты же о себе разумей и о подобных тебе ищи славы»."
  52: "«вам бо отверст есть рай, насаждено есть древо жизни, предуготовано есть будушее время, готово есть изобилие, создан есть град, искушен есть покой, совершенна есть благостыня и совершенна премудрость» — «вам открыт рай, насаждено древо жизни, предуготовано будущее время, готово изобилие, создан город, испытан покой, совершенна благость и совершенна премудрость». ru: «приготовлен покой»."
  53: "«корень зла знаменан есть от вас, немощь и молие от вас скрыто есть» — «корень зла ознаменован (запечатан) от вас, немощь и моль (тля) от вас сокрыты»; «во ад бежит растление в забвении» — «во ад бежит тление в забвение» (ад — よみ)."
  54: "«преидоша болезни, и явлено есть на конец сокровище безсмертия» — «прошли болезни, и в конце явлено сокровище бессмертия»."
  55: "«не прилагай убо испытовати о множестве погибающих» — «не прилагай более испытывать о множестве погибающих»."
  56: "«ибо и тии, приемлюще свободу, уничижиша вышняго, и закон его презреша, и пути его оставиша» — «ибо они, получая свободу, уничижили Всевышнего, презрели закон Его и оставили пути Его»."
  57: "«еще же и праведных его попраша» — «ещё и праведных Его попрали»."
  58: "«и рекоша в сердцы своем: несть Бога, аще и ведяху, яко умирают» — «и сказали в сердце своём: нет Бога, хотя и знали, что умирают»."
  59: "«якоже бо вас приимут яже предреченна суть, тако тех жажда и мучения, яже уготована суть» — «как вас примет предречённое, так их — жажда и мучения, которые уготованы»; «ибо не хотяше человека погубити» — «ибо Он не хотел погубить человека»."
  60: "«но и тии, иже сотворени суть, оскверниша имя того, иже сотвори их» — «но и сами сотворённые осквернили имя Того, Кто сотворил их»; «неблагодарни быша тому, иже уготовал им живот» — «были неблагодарны Тому, Кто уготовал им жизнь»."
  61: "«сего ради суд мой ныне приближается» — «потому суд Мой ныне приближается»."
  62: "«яже не всем показах, токмо тебе и тебе подобным не многим» — «чего Я не всем показал, а только тебе и немногим, тебе подобным». Здесь речь ангела закрывается; далее вводка «И отвешах и рекох»."
  63: "«се, ныне, Господи, показал еси мне множество знамений, яже начнеши творити в последний час, но не показал еси мне, в кое время» — «вот, ныне, Господи, Ты показал мне множество знамений, которые начнёшь творить в последний час, но не показал мне, в какое время»."
