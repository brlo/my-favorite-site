# jp-box, 3-я Ездры, глава 8. Черновик для приёмки.
#
# База: церковнославянский текст (csl-ru) — в Септуагинте (gr-lxx-byz) книги нет;
# ru (Синодальный) — только для понимания, не источник; у ru другое деление стихов,
# сверка по содержанию. Нумерация — славянская. Язык — современный 常体; 〔…〕 нет;
# сносок ⟨…⟩ нет. Красного и синего в Ветхом Завете нет.
# jp-joc в книге нет; jp-ni не использовался.
#
# Содержание: 1–3 ответ ангела: век для многих, будущий — для малых, «многие
# сотворены, но немногие спасутся»; 4–5 Ездра говорит своей душе: «пожри разумение»;
# 6–14 молитва о создании человека во чреве, о молоке, воспитании, смерти и оживлении;
# 15–19 молитва о народе и «начало словес Ездриных»; 20–36 великая молитва:
# Господь, живущий вечно, престол неоценимый, творение, «мы — единое творение рук
# Твоих», «нет никого из рождённых, кто не согрешил бы»; 37–41 ответ: «право
# глаголал еси некая», притча о земледельце и семени; 42–45 молитва о прощении;
# 46–54 «настоящее настоящим», «вам отверст есть рай», корень зла запечатан;
# 55–62 не испытывать о множестве погибающих, «Бог не хотел погубить человека»;
# 63 просьба о времени знамений.
# Голоса: ангел — 1–3, 37–41, 46–62; Ездра — 4–19 (к душе и молитва), 20–36,
# 42–45, 63. Редакционный заголовок в конце ст. 19 («Начало словес ездриных,
# прежде неже взят бысть») вынесен за кавычки как заглавие, в notes отмечен.
# Имена: エズラ, アダム, アブラハム, イサク, ヤコブ, モーセ, ダビデ.

