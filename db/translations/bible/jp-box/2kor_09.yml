# jp-box, Второе послание к Коринфянам, глава 9. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 9: сбор для святых — готовность коринфян (1–5), сеющий скупо и сеющий
# с благословениями (6–11), плод служения — благодарение Богу (12–15).
# Красного и синего нет: прямой речи Христа и Богородицы в главе нет, <j>/<mo> не ставятся.
# 〔…〕 в главе нет: проверено по базе — все 15 стихов в gr-lxx-byz на месте (`.` нет).
# Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

tr_code: jp-box
book: 2kor
chapter: 9
draft: true

verses:
  1: "聖徒[せいと]たちへの務[つと]めについては、あなたがたに書[か]くまでもない。"
  2: "なぜなら、わたしはあなたがたの熱心[ねつしん]を知[し]っているからである。わたしはあなたがたのことをマケドニアの人々[ひとびと]に誇[ほこ]っている。すなわち、アカイアは去年[きょねん]からすでに用意[ようい]ができている、と。そして、あなたがたの熱心は多[おお]くの人[ひと]を奮[ふる]い立[た]たせたのである。"
  3: "しかし、わたしは兄弟[きょうだい]たちを遣[つか]わした。この点[てん]で、あなたがたについてのわたしたちの誇[ほこ]りが空[むな]しくなることがないためである。すなわち、わたしが言[い]っていたとおりに、あなたがたが用意[ようい]を整[ととの]えているためである。"
  4: "そうでないと、マケドニアの人々[ひとびと]がわたしとともに来[き]て、あなたがたが用意[ようい]をしていないのを見[み]つけたとき、わたしは——あなたがたのことを言[い]うまでもない——この誇[ほこ]りに基[もと]づいて恥[は]ずかしい思[おも]いをするであろう。"
  5: "そこで、わたしは、兄弟[きょうだい]たちが先[さき]にあなたがたのもとへ行[い]き、すでに約束[やくそく]しておいたあなたがたの祝福[しゅくふく]を、祝福[しゅくふく]として、貪[むさぼ]りとしてではなく、用意[ようい]しておく必要[ひつよう]があると考[かんが]えた。"
  6: "なお、こう言[い]おう。惜[お]しんで蒔[ま]く者[もの]は惜しんで刈[か]り取[と]り、祝福[しゅくふく]をもって蒔[ま]く者[もの]は祝福をもって刈り取るのである。"
  7: "それぞれ、心[こころ]に決[き]めたとおりに、悲[かな]しみからでなく、強[し]いられてでもなく、与[あた]えるがよい。神[かみ]は喜[よろこ]んで与える者[もの]を愛[あい]されるからである。"
  8: "神[かみ]は、あなたがたにすべての恵[めぐ]みを満[み]ちあふれさせることがおできになる。あなたがたが、いつもすべてのことにおいて十分[じゅうぶん]に足[た]りて、あらゆる善[よ]い業[わざ]に満ちあふれるためである。"
  9: "「彼[かれ]は散[ち]らし、貧[まず]しい者[もの]たちに与[あた]えた。その義[ぎ]はとこしえに残[のこ]る」と書[か]かれているとおりである。"
  10: "蒔[ま]く者[もの]に種[たね]を備[そな]え、食[しょく]のためのパンを与[あた]える方は、あなたがたが蒔[ま]く種を備え、増[ふ]やし、あなたがたの義[ぎ]の実[み]を豊[ゆたか]にしてくださるであろう。"
  11: "あなたがたは、すべてのことにおいて豊[ゆた]かにされ、あらゆる施[ほどこ]しを行[おこな]うことができるようになる。それは、わたしたちを通[とお]して神[かみ]への感謝[かんしゃ]を生[しょう]じさせるのである。"
  12: "なぜなら、この務[つと]めの奉仕[ほうし]は、聖徒[せいと]たちの乏[とぼ]しさを補[おぎな]うだけでなく、多[おお]くの感謝[かんしゃ]となって神[かみ]に満ちあふれるからである。"
  13: "彼[かれ]らは、この務[つと]めが証[あかし]されたことによって、あなたがたがキリストの福音[ふくいん]に服[ふく]し、告白[こくはく]をもってそれに従[したが]い、また彼[かれ]らとすべての人[ひと]とに共[とも]に与[あずか]ることに惜[お]しみがないのを見[み]て、神[かみ]を崇[あが]めるのである。"
  14: "また、彼[かれ]らは、あなたがたの上[うえ]に注[そそ]がれた神[かみ]の溢[あふ]れる恵[めぐ]みのゆえに、あなたがたを慕[した]いながら、あなたがたのために祈[いの]るのである。"
  15: "神[かみ]に感謝[かんしゃ]があるように。その言[い]い尽[つ]くせない賜物[たまもの]のゆえに。"

notes:
  1: "διακονία ἡ εἰς τοὺς ἁγίους — 聖徒たちへの務め (сбор для иерусалимских святых, ср. 8:4). περισσόν μοί ἐστιν τὸ γράφειν — «излишне мне писать»; 書くまでもない."
  2: "προθυμία — 熱心. καυχῶμαι ὑπὲρ ὑμῶν Μακεδόσιν — «хвалюсь вами перед македонянами»; あなたがたのことを…誇っている. ἀπὸ πέρυσι — 去年から. ἠρέθισεν — «возбудил, разжёг»; 奮い立たせた."
  3: "καύχημα — 誇り (не καύχησις). κενωθῇ — «опустеет, окажется пустым»; 空しくなる. ἔλεγον — импф. «говорил»; 言っていた."
  4: "ὑπόστασις — «основание, уверенность»; 誇りに基づいて. ἵνα μὴ λέγω ὑμεῖς — «чтобы не сказать: вы»; あなたがたのことを言うまでもない."
  5: "εὐλογία — 祝福; здесь собранное, дар. πλεονεξία — «корысть, лихоимство»; 貪り. προκαταρτίσωσιν — «приготовят заранее»; 用意しておく."
  6: "φειδομένως — «скупо»; 惜しんで. ἐπ' εὐλογίαις — «с благословениями», то есть щедро; 祝福をもって. Двойной повтор в греч. (φειδομένως φειδομένως, ἐπ' εὐλογίαις ἐπ' εὐλογίαις) передан усилительно, без сглаживания."
  7: "προῄρηται τῇ καρδίᾳ — «решил в сердце»; 心に決めた. ἐκ λύπης — «от печали»; 悲しみから. ἱλαρόν — «радостного, светлого»; 喜んで与える."
  8: "δυνατεῖ — «силён»; おできになる. αὐτάρκεια — «довольство, достаточность»; 十分に足りて. περισσεύητε — 満ちあふれる."
  9: "Пс 111:9 (LXX). ἐσκόρπισεν — «рассыпал, роздал»; 散らし. Цитата Писания — в 「」."
  10: "ἐπιχορηγῶν — «подающий, снабжающий»; 備える. χορηγήσει — буд. «подаст». γενήματα — «плоды»; 実."
  11: "ἁπλότης — «простота, щедрость»; 施し. κατεργάζεται — «производит»; 生じさせる."
  12: "λειτουργία — «служение»; 奉仕. ὑστερήματα — 乏しさ. προσαναπληροῦσα — «восполняющий»; 補う. περισσεύουσα — 満ちあふれる."
  13: "δοκιμή — «испытание, доказательство»; 証. ὁμολογία — 告白. κοινωνία — «общение, участие»; 共に与ること. ἁπλότης — 惜しみがないこと."
  14: "ἐπιποθούντων — «сильно желающих, тоскующих»; 慕う. ὑπερβάλλουσα χάρις — 溢れる恵み. δεήσει — «молитвой»; 祈る."
  15: "ἀνεκδιήγητος — «неизреченный»; 言い尽くせない. δωρεά — 賜物. χάρις τῷ θεῷ — 神に感謝があるように."
