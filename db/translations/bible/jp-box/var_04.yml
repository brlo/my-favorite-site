# jp-box, Варух, глава 4. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для книги есть только в 3:36–4:4; 4:1–4 — его последние стихи,
# использованы как свидетель церковного чтения; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Нумерация по gr: 37 стихов; совпадает со слав. и Синодальным, точек-лакун нет.
# Глава 4: 1–4 конец поэмы о премудрости: «это книга заповедей Божиих», «обратись,
# Иаков», «блаженны мы, Израиль»; 5–9а пророческое слово к рассеянным детям
# («дерзайте, народ мой»): проданы не на погибель, но за грех, забыли Бога и огорчили
# Иерусалим; 9б–29 речь самого Иерусалима: «слушайте, сожители Сиона», плен сыновей
# и дочерей, вдова, чуждый народ, «я осталась пуста», одежда мира и рубище, надежда
# на спасение, «как ныне видели пленение, так увидят спасение», «дерзайте, дети»,
# «вдесятеро обратитесь»; 30–37 слово к Иерусалиму: «дерзай, Иерусалим», гибель
# гонителей, «оглянись на восток», возвращение сыновей от востока до запада.
# Голоса и кавычки: 4:1–9а — авторская речь без кавычек; 4:9б–4:29 — одна речь
# Иерусалима в 「…» (вводится «и сказала», καὶ εἶπεν, в 4:9; закрывается в конце
# 4:29); 4:30–37 — авторская речь без кавычек. Вложенной речи в главе нет.
# 〔…〕 нет: все 37 стихов и все слова есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 律法, 寡婦, 捕囚, 寄留, 悪霊, 粗布, 義 уже в корпусе.
# Имена: ヤコブ, イスラエル, シオン, エルサレム, ユダ — по корпусу.

