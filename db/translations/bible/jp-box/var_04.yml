verses:
  1: "これは神[かみ]の戒[いまし]めの書[しょ]、永遠[えいえん]に存[そん]する律法[りっぽう]である。すべてこれを保[たも]つ者[もの]は生[い]き、これを捨[す]てる者[もの]は死[し]ぬ。"
  2: "ヤコブよ、立[た]ち返[かえ]ってこれを取[と]り、その光[ひかり]の輝[かがや]きに向[む]かって歩[あゆ]め。"
  3: "あなたの栄光[えいこう]をほかの者[もの]に、あなたに益[やく]するものを異[い]なる民[たみ]に与[あた]えてはならない。"
  4: "イスラエルよ、私たちは幸[さいわ]いである。神[かみ]に喜[よろこ]ばれることが、私たちに知[し]らされているからである。"
  5: "勇[いさ]みなさい、わたしの民[たみ]、イスラエルの記念[きねん]よ。"
  6: "あなたがたは国々[くにぐに]に売[う]られたが、それは滅[ほろ]びのためではない。あなたがたが神[かみ]を怒[いか]らせたために、敵[てき]に渡[わた]されたのである。"
  7: "あなたがたは、自分[じぶん]を造[つく]られた方[かた]を怒[いか]らせた。神[かみ]にではなく、悪霊[あくりょう]に犠牲[ぎせい]をささげたからである。"
  8: "あなたがたは、自分[じぶん]を養[やしな]ってくださった永遠[えいえん]の神[かみ]を忘[わす]れ、自分を育[はぐく]んだエルサレムをも悲[かな]しませた。"
  9: "エルサレムは、神[かみ]からあなたがたに臨[のぞ]んだ怒[いか]りを見[み]て、言[い]った。「シオンに寄留[きりゅう]する者[もの]たちよ、聞[き]いてください。神[かみ]はわたしに大[おお]きな悲[かな]しみを臨[のぞ]ませられました。"
  10: "わたしは、永遠[えいえん]の方がわたしの息子[むすこ]たちと娘[むすめ]たちに臨[のぞ]ませられた捕囚[ほしゅう]を見[み]たからです。"
  11: "わたしは彼らを喜[よろこ]びとともに養[やしな]い、泣[な]きと悲[かな]しみとともに送[おく]り出[だ]しました。"
  12: "わたしは寡婦[かふ]となり、多[おお]くの者[もの]から見捨[みす]てられた。だれもわたしを喜[よろこ]んではならない。わたしが荒[あ]れ果[は]てたのは、子[こ]どもたちの罪[つみ]のためである。彼らが神[かみ]の律法[りっぽう]からそれたからである。"
  13: "彼らは神[かみ]の定[さだ]めを知[し]らず、神の戒[いまし]めの道[みち]を歩[あゆ]まず、神の義[ぎ]による教[おし]えの小径[こみち]にも足[あし]を踏[ふ]み入[い]れなかった。"
  14: "シオンに寄留[きりゅう]する者[もの]たちよ、来[き]てください。わたしの息子[むすこ]たちと娘[むすめ]たちの捕囚[ほしゅう]を思[おも]い起[おこ]してください。永遠[えいえん]の方が彼らに臨[のぞ]ませられた捕囚です。"
  15: "永遠[えいえん]の方は彼らに遠[とお]い国[くに]の民[たみ]を臨[のぞ]ませられた。恥[はじ]知[し]らずの、異[こと]なる言葉[ことば]の民である。彼らは年寄[としよ]りを敬[うやま]わず、幼[おさな]い子[こ]にも憐[あわ]れみをかけなかった。"
  16: "彼らは寡婦[かふ]の愛[あい]する者[もの]たちを連[つ]れ去[さ]り、ただ一人[ひとり]の娘[むすめ]を荒[あ]れ果[は]てさせた。"
  17: "しかし、わたしにあなたがたを助[たす]ける力[ちから]が何[なに]ありましょうか。"
  18: "あなたがたに災[わざわ]いを臨[のぞ]ませた方[かた]が、あなたがたを敵[てき]の手[て]から救[すく]い出[だ]してくださるのです。"
  19: "行[い]きなさい、子[こ]どもたちよ、行きなさい。わたしはひとり残[のこ]されて、荒[あ]れ果[は]ててしまった。"
  20: "わたしは平和[へいわ]の衣[ころも]を脱[ぬ]ぎ、願[ねが]いの粗布[あらぬの]をまとった。わたしは自分[じぶん]の日[ひ]々[び]のうちに、永遠[えいえん]の方[かた]に向[む]かって叫[さけ]ぶ。"
  21: "勇[いさ]みなさい、子[こ]どもたちよ。神[かみ]に向かって叫[さけ]びなさい。神はあなたがたを暴虐[ぼうぎゃく]から、敵[てき]の手[て]から救[すく]い出[だ]してくださる。"
  22: "わたしは永遠[えいえん]の方[かた]に、あなたがたの救[すく]いを望[のぞ]み見[み]ていた。聖[せい]なる方[かた]から喜[よろこ]びがわたしに来[き]た。それは、あなたがたの救[すく]い主[ぬし]である永遠[えいえん]の方[かた]から、間[ま]もなくあなたがたに臨[のぞ]む憐[あわ]れみによる喜びである。"
  23: "わたしはあなたがたを悲[かな]しみと泣[な]きとともに送[おく]り出[だ]した。しかし神[かみ]はあなたがたを、喜[よろこ]びと楽[たの]しみとともに、永遠[えいえん]にわたしに返[かえ]してくださる。"
  24: "今[いま]、シオンに寄留[きりゅう]する者[もの]たちがあなたがたの捕囚[ほしゅう]を見[み]たように、彼らは間[ま]もなく、あなたがたの神[かみ]からの救[すく]いを見[み]る。その救いは、永遠[えいえん]の方[かた]の大[おお]きな栄光[えいこう]と輝[かがや]きとともに、あなたがたに臨[のぞ]む。"
  25: "子[こ]どもたちよ、あなたがたに臨[のぞ]んだ神[かみ]からの怒[いか]りを、長[なが]く耐[た]え忍[しの]びなさい。敵[てき]はあなたを追[お]い求[もと]めたが、あなたは間[ま]もなくその滅[ほろ]びを見[み]、彼らの首[くび]を踏[ふ]むであろう。"
  26: "わたしの甘[あま]やかされて育[そだ]った者[もの]たちは、険[けわ]しい道[みち]を歩[あゆ]んだ。敵[てき]に奪[うば]われた群[む]れのように、連[つ]れ去[さ]られた。"
  27: "勇[いさ]みなさい、子[こ]どもたちよ。神[かみ]に向かって叫[さけ]びなさい。あなたがたを、災[わざわ]いを臨[のぞ]ませた方[かた]が覚[おぼ]えていてくださるからである。"
  28: "あなたがたの心[こころ]が神[かみ]から迷[まよ]い出[で]て行[い]ったのだから、今[いま]は十[じゅう]倍[ばい]にして、立[た]ち返[かえ]って神を求[もと]めなさい。"
  29: "あなたがたに災[わざわ]いを臨[のぞ]ませた方[かた]が、あなたがたの救[すく]いとともに、永遠[えいえん]の喜[よろこ]びを臨[のぞ]ませてくださるからです。」"
  30: "勇[いさ]みなさい、エルサレムよ。あなたに名[な]を与[あた]えた方[かた]が、あなたを慰[なぐさ]めてくださる。"
  31: "不幸[ふこう]なのは、あなたを苦[くる]しめ、あなたの倒[たお]れるのを喜[よろこ]んだ者[もの]たちである。"
  32: "不幸なのは、あなたの子[こ]どもたちが仕[つか]えた都々[みやこみやこ]である。不幸なのは、あなたの息子[むすこ]たちを受[う]け入[い]れた地[ち]である。"
  33: "その都は、あなたの倒れるのを喜[よろこ]び、あなたの滅[ほろ]びを楽[たの]しんだ。同じように、自分[じぶん]の荒[あ]れ果[は]てるのを悲[かな]しむであろう。"
  34: "わたしはその都から、多[おお]くの民[たみ]の喜[よろこ]びを取[と]り去[さ]る。その誇[ほこ]りは悲[かな]しみとなる。"
  35: "永遠[えいえん]の方[かた]から火[ひ]がその都に臨[のぞ]み、長[なが]い日[ひ]々[び]の間[あいだ]燃[も]え続[つづ]ける。その都は長い間[あいだ]、悪霊[あくりょう]たちの住[す]みかとなる。"
  36: "エルサレムよ、東[ひがし]の方[ほう]を見回[みまわ]して、神[かみ]からあなたに来[く]る喜[よろこ]びを見[み]なさい。"
  37: "見[み]よ、あなたが送[おく]り出[だ]したあなたの息子[むすこ]たちが来[き]る。聖[せい]なる方[かた]の言葉[ことば]によって、東[ひがし]から西[にし]まで集[あつ]められ、神[かみ]の栄光[えいこう]を喜[よろこ]びながら来る。"

notes:
  1: "αὕτη ἡ βίβλος τῶν προσταγμάτων τοῦ θεοῦ — «это книга заповедей Божиих» (πρόσταγμα — 戒め; βίβλος — 書); ὁ νόμος ὁ ὑπάρχων εἰς τὸν αἰῶνα — «закон, пребывающий в век» (ὑπάρχω); οἱ κρατοῦντες αὐτῆς εἰς ζωήν — «держащиеся её — в жизнь» (κρατέω — держаться); οἱ καταλείποντες αὐτὴν ἀποθανοῦνται — «оставляющие её умрут». Слав. «в живот (внидут)» — редакционная вставка в скобках, не переводилась. jp-joc: 此は乃ち神の誡の書、世世に存する法なり."
  2: "ἐπιστρέφου, Ιακωβ — «обратись, Иаков» (императив наст. вр.); ἐπιλαβοῦ αὐτῆς — «возьмись за неё» (ἐπιλαμβάνομαι — хватать, 取る); διόδευσον πρὸς τὴν λάμψιν κατέναντι τοῦ φωτὸς αὐτῆς — «ходи к сиянию против света её» (διοδεύω — проходить; λάμψις — сияние; κατέναντι — напротив)."
  3: "μὴ δῷς ἑτέρῳ τὴν δόξαν σου — «не дай иному славы твоей» (δίδωμι в запрете); τὰ συμφέροντά σοι — «полезное тебе» (συμφέρω — приносить пользу); ἔθνει ἀλλοτρίῳ — «народу чужому» (ἀλλότριος — 異なる)."
  4: "μακάριοί ἐσμεν, Ισραηλ — «блаженны мы, Израиль» (μακάριος — 幸い, ср. Пс 1:1); τὰ ἀρεστὰ τῷ θεῷ — «угодное Богу» (ἀρεστός — приятный, угодный); ἡμῖν γνωστά ἐστιν — «нам известно» (γνωστός). Здесь кончается свидетельство jp-joc (3:36–4:4)."
  5: "Начало пророчества Иерусалиму и Сиону (4:5–5:9), авторская речь без кавычек до 4:9; Θαρσεῖτε, λαός μου — «дерзайте, народ мой» (θαρσέω); μνημόσυνον Ισραηλ — «памятник (память) Израиля» (μνημόσυνον — 記念)."
  6: "ἐπράθητε τοῖς ἔθνεσιν οὐκ εἰς ἀπώλειαν — «вы проданы народам не на погибель» (πιπράσκω — продавать; ἀπώλεια — 滅び); διὰ δὲ τὸ παροργίσαι ὑμᾶς τὸν θεὸν — «но за то, что вы прогневали Бога» (παροργίζω); παρεδόθητε τοῖς ὑπεναντίοις — «вы преданы противникам» (ὑπεναντίος)."
  7: "παρωξύνατε τὸν ποιήσαντα ὑμᾶς — «вы раздражили Сотворившего вас» (παροξύνω); θύσαντες δαιμονίοις καὶ οὐ θεῷ — «принеся жертвы демонам, а не Богу» (θύω — приносить жертву; δαιμόνιον — 悪霊); слав. «(Бога вечнаго)» — редакционная вставка в скобках, не переводилась."
  8: "ἐπελάθεσθε τὸν τροφεύσαντα ὑμᾶς θεὸν αἰώνιον — «вы забыли питающего вас вечного Бога» (ἐπιλανθάνομαι; τροφεύω — кормить, 養う); ἐλυπήσατε τὴν ἐκθρέψασαν ὑμᾶς Ιερουσαλημ — «вы огорчили воспитавший вас Иерусалим» (λυπέω; ἐκτρέφω — вскармливать)."
  9: "εἶδεν γὰρ τὴν ἐπελθοῦσαν ὑμῖν ὀργὴν παρὰ τοῦ θεοῦ καὶ εἶπεν — «ибо она увидела пришедший на вас гнев от Бога и сказала»: с этих слов речь Иерусалима в 「…» (до конца 4:29); Ἀκούσατε, αἱ πάροικοι Σιων — «слушайте, сожители (пришельцы) Сиона» (πάροικος — пришлый, живущий рядом; 寄留する者); ἐπήγαγέν μοι ὁ θεὸς πένθος μέγα — «навёл на меня Бог великую скорбь» (πένθος — 悲しみ)."
  10: "τὴν αἰχμαλωσίαν τῶν υἱῶν μου καὶ τῶν θυγατέρων — «пленение сыновей моих и дочерей» (αἰχμαλωσία — 捕囚); ἣν ἐπήγαγεν αὐτοῖς ὁ αἰώνιος — «которое навёл на них Вечный» (ὁ αἰώνιος — «Вечный», титул Бога, 永遠の方)."
  11: "ἔθρεψα γὰρ αὐτοὺς μετ᾽ εὐφροσύνης — «я питал их с веселием»; ἐξαπέστειλα δὲ μετὰ κλαυθμοῦ καὶ πένθους — «а отпустил с плачем и скорбью» (ἐξαποστέλλω; κλαυθμός)."
  12: "μηδεὶς ἐπιχαιρέτω μοι τῇ χήρᾳ — «никто да не радуется обо мне, вдове» (ἐπιχαίρω — радоваться чужому горю; χήρα — 寡婦); καταλειφθείσῃ ὑπὸ πολλῶν — «оставленной многими» (καταλείπω); ἠρημώθην διὰ τὰς ἁμαρτίας τῶν τέκνων μου — «я опустела за грехи детей моих» (ἐρημόω)."
  13: "δικαιώματα δὲ αὐτοῦ οὐκ ἔγνωσαν — «оправданий (уставов) Его не познали» (δικαίωμα — 定め); ἐπορεύθησαν ὁδοῖς ἐντολῶν θεοῦ — «ходили путями заповедей Божиих»; τρίβους παιδείας ἐν δικαιοσύνῃ αὐτοῦ ἐπέβησαν — «на стези наставления в правде Его вступили» (παιδεία — наставление, 教え; ἐπιβαίνω — вступать)."
  14: "ἐλθάτωσαν αἱ πάροικοι Σιων — «да придут сожители Сиона» (императив 3-го лица); μνήσθητε τὴν αἰχμαλωσίαν — «вспомните пленение» (μιμνῄσκομαι с acc.); ἣν ἐπήγαγεν αὐτοῖς ὁ αἰώνιος — «которое навёл на них Вечный» (повтор 4:10)."
  15: "ἐπήγαγεν γὰρ ἐπ᾽ αὐτοὺς ἔθνος μακρόθεν — «ибо Он навёл на них народ издалека»; ἔθνος ἀναιδὲς καὶ ἀλλόγλωσσον — «народ наглый и иноязычный» (ἀναιδής — бесстыдный; ἀλλόγλωσσος — 異なる言葉の); οἳ οὐκ ᾐσχύνθησαν πρεσβύτην — «которые не устыдились старца» (αἰσχύνομαι); οὐδὲ παιδίον ἠλέησαν — «и не помиловали ребёнка» (ἐλεάω)."
  16: "ἀπήγαγον τοὺς ἀγαπητοὺς τῆς χήρας — «увели возлюбленных вдовы» (ἀπάγω); ἀπὸ τῶν θυγατέρων τὴν μόνην ἠρήμωσαν — «из дочерей единственную опустошили» (τὴν μόνην — «единственную»; тёмное место: ru «лишили одинокую дочерей», слав. «от дщерей едину опустошиша»; передано ただ一人の娘を荒れ果てさせた)."
  17: "ἐγὼ δὲ τί δυνατὴ βοηθῆσαι ὑμῖν — «я же чем могу (сильна) помочь вам» (δυνατός — сильный, способный; ж. р. — говорит Иерусалим)."
  18: "ὁ γὰρ ἐπαγαγὼν τὰ κακὰ ὑμῖν — «ибо Наведший на вас бедствия» (ἐπάγω); ἐξελεῖται ὑμᾶς ἐκ χειρὸς ἐχθρῶν ὑμῶν — «избавит вас от руки врагов ваших» (ἐξαιρέω)."
  19: "βαδίζετε, τέκνα, βαδίζετε — «идите, дети, идите» (повтор); ἐγὼ γὰρ κατελείφθην ἔρημος — «ибо я осталась пустой (одинокой)» (καταλείπω; ἔρημος — 荒れ果てた)."
  20: "ἐξεδυσάμην τὴν στολὴν τῆς εἰρήνης — «я снял (с себя) одежду мира» (ἐκδύω — снимать; στολή — 衣); ἐνεδυσάμην σάκκον τῆς δεήσεώς μου — «оделся в рубище моления моего» (ἐνδύω; σάκκος — 粗布); κεκράξομαι πρὸς τὸν αἰώνιον ἐν ταῖς ἡμέραις μου — «буду взывать к Вечному во дни мои» (κράζω). В конце стиха в греч. разделительное тире."
  21: "θαρσεῖτε, τέκνα — «дерзайте, дети»; βοήσατε πρὸς τὸν θεόν — «возопите к Богу» (βοάω); ἐξελεῖται ὑμᾶς ἐκ δυναστείας, ἐκ χειρὸς ἐχθρῶν — «избавит вас от насилия, от руки врагов» (δυναστεία — 暴虐)."
  22: "ἤλπισα ἐπὶ τῷ αἰωνίῳ τὴν σωτηρίαν ὑμῶν — «я надеялся на Вечного о спасении вашем» (ἐλπίζω); ἦλθέν μοι χαρὰ παρὰ τοῦ ἁγίου — «пришла мне радость от Святого» (ὁ ἅγιος — 聖なる方); ἐπὶ τῇ ἐλεημοσύνῃ — «о милости» (ἐλεημοσύνη — 憐れみ); ἣ ἥξει ὑμῖν ἐν τάχει παρὰ τοῦ αἰωνίου σωτῆρος ὑμῶν — «которая скоро придёт вам от Вечного, Спасителя вашего» (σωτήρ — 救い主)."
  23: "ἐξέπεμψα γὰρ ὑμᾶς μετὰ πένθους καὶ κλαυθμοῦ — «я отпустил вас со скорбью и плачем» (ἐκπέμπω); ἀποδώσει δέ μοι ὁ θεὸς ὑμᾶς — «но Бог возвратит мне вас» (ἀποδίδωμι — отдавать обратно); μετὰ χαρμοσύνης καὶ εὐφροσύνης εἰς τὸν αἰῶνα — «с радостью и веселием в век»."
  24: "ὥσπερ νῦν ἑωράκασιν αἱ πάροικοι Σιων τὴν ὑμετέραν αἰχμαλωσίαν — «как ныне видели сожители Сиона пленение ваше»; οὕτως ὄψονται ἐν τάχει τὴν παρὰ τοῦ θεοῦ ὑμῶν σωτηρίαν — «так увидят скоро спасение ваше от Бога вашего»; μετὰ δόξης μεγάλης καὶ λαμπρότητος τοῦ αἰωνίου — «с великою славою и светлостью Вечного» (λαμπρότης — 輝き)."
  25: "τέκνα, μακροθυμήσατε — «дети, долготерпите» (μακροθυμέω); τὴν παρὰ τοῦ θεοῦ ἐπελθοῦσαν ὑμῖν ὀργήν — «пришедший на вас от Бога гнев»; κατεδίωξέν σε ὁ ἐχθρός σου — «преследовал тебя враг твой» (καταδιώκω); ὄψει αὐτοῦ τὴν ἀπώλειαν ἐν τάχει — «скоро увидишь погибель его»; ἐπὶ τραχήλους αὐτῶν ἐπιβήσῃ — «на выи (шеи) их наступишь» (τράχηλος — 首; ἐπιβαίνω)."
  26: "οἱ τρυφεροί μου — «изнеженные мои» (τρυφερός — нежный, избалованный; слав. «младии мои» — иное чтение; в тексте по LXX 甘やかされて育った者たち, отмечено); ἐπορεύθησαν ὁδοὺς τραχείας — «пошли путями жёсткими» (τραχύς — суровый, 険しい); ἤρθησαν ὡς ποίμνιον ἡρπασμένον ὑπὸ ἐχθρῶν — «унесены, как стадо, расхищенное врагами» (αἴρω; ἁρπάζω — 奪う; ποίμνιον — 群れ)."
  27: "θαρσήσατε, τέκνα, καὶ βοήσατε πρὸς τὸν θεόν — «дерзайте, дети, и возопите к Богу»; ἔσται γὰρ ὑμῶν ὑπὸ τοῦ ἐπάγοντος μνεία — «ибо будет о вас память у Наводящего» (μνεία — 記念; ὁ ἐπάγων — Наводящий бедствия, т. е. Бог)."
  28: "ὥσπερ ἐγένετο ἡ διάνοια ὑμῶν εἰς τὸ πλανηθῆναι ἀπὸ τοῦ θεοῦ — «как помышление ваше было к тому, чтобы уклониться от Бога» (πλανάω — 迷う); δεκαπλασιάσατε ἐπιστραφέντες ζητῆσαι αὐτόν — «вдесятеро увеличьте, обратившись, искать Его» (δεκαπλασιάζω — 十倍にする; ἐπιστρέφω)."
  29: "ὁ ἐπαγαγὼν ὑμῖν τὰ κακὰ ἐπάξει ὑμῖν τὴν αἰώνιον εὐφροσύνην — «Наведший на вас бедствия наведёт на вас вечное веселие» (ἐπάγω; εὐφροσύνη); μετὰ τῆς σωτηρίας ὑμῶν — «со спасением вашим». Здесь речь Иерусалима закрывается (」 в конце стиха)."
  30: "Θάρσει, Ιερουσαλημ — «дерзай, Иерусалим» (θαρσέω); παρακαλέσει σε ὁ ὀνομάσας σε — «утешит тебя Нарекший тебя (давший тебе имя)» (παρακαλέω — утешать; ὀνομάζω — называть). С 4:30 снова авторская речь без кавычек."
  31: "δείλαιοι οἱ σὲ κακώσαντες — «жалки (несчастны) те, кто тебя озлобил» (δείλαιος — жалкий, несчастный; κακόω — 苦しめる); ἐπιχαρέντες τῇ σῇ πτώσει — «порадовавшиеся падению твоему» (πτῶσις — 倒れること). Слав. «(мщение будет над ними)» — редакционная вставка в скобках, не переводилась."
  32: "δείλαιαι αἱ πόλεις αἷς ἐδούλευσαν τὰ τέκνα σου — «жалки города, которым служили дети твои» (δουλεύω); δειλαία ἡ δεξαμένη τοὺς υἱούς σου — «жалка [земля], принявшая сынов твоих» (δέχομαι — принимать; подлежащее не названо, по смыслу «земля»)."
  33: "ὥσπερ ἐχάρη ἐπὶ τῇ σῇ πτώσει καὶ εὐφράνθη ἐπὶ τῷ πτώματί σου — «как она радовалась падению твоему и веселилась поражению твоему» (πτῶμα — падение, труп); οὕτως λυπηθήσεται ἐπὶ τῇ ἑαυτῆς ἐρημίᾳ — «так опечалится о своём запустении» (ἐρημία)."
  34: "περιελῶ αὐτῆς τὸ ἀγαλλίαμα τῆς πολυοχλίας — «отниму у неё ликование многолюдства» (περιαιρέω — отнимать; ἀγαλλίαμα — ликование; πολυοχλία — многолюдство); τὸ ἀγαυρίαμα αὐτῆς ἔσται εἰς πένθος — «хвастовство её будет в плач» (ἀγαυρίαμα — похвальба, 誇り)."
  35: "πῦρ γὰρ ἐπελεύσεται αὐτῇ παρὰ τοῦ αἰωνίου εἰς ἡμέρας μακράς — «ибо придёт на неё огонь от Вечного на долгие дни»; κατοικηθήσεται ὑπὸ δαιμονίων τὸν πλείονα χρόνον — «будет обитаема демонами большее время» (κατοικέω в пассиве; δαιμόνιον — 悪霊)."
  36: "περίβλεψαι πρὸς ἀνατολάς, Ιερουσαλημ — «оглянись на восток, Иерусалим» (περιβλέπω — озираться; ἀνατολή — 東); ἰδὲ τὴν εὐφροσύνην τὴν παρὰ τοῦ θεοῦ σοι ἐρχομένην — «увидь веселие, от Бога к тебе идущее» (ἔρχομαι)."
  37: "ἰδοὺ ἔρχονται οἱ υἱοί σου, οὓς ἐξαπέστειλας — «вот, идут сыны твои, которых ты отпустил» (ἐξαποστέλλω); ἔρχονται συνηγμένοι ἀπ᾽ ἀνατολῶν ἕως δυσμῶν — «идут собранные от востока до запада» (συνάγω; δυσμή — 西); τῷ ῥήματι τοῦ ἁγίου — «словом Святого» (ῥῆμα — 言葉); χαίροντες τῇ τοῦ θεοῦ δόξῃ — «радуясь славе Божией». В греч. текст заканчивается разделительным тире."
