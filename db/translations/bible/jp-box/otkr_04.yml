# jp-box, Откровение Иоанна, глава 4. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий (gr-lxx-byz) — свидетель; чего в нём нет, то в 〔…〕.
# Глава 4: престол на небе, двадцать четыре старца, четыре живых существа (1–8);
# славословие старцев (9–11).
# Красного <j> в главе нет: прямой речи Христа здесь нет. 4:1 — голос с неба,
# но он не отождествлён с Христом, поэтому «…» без красного (см. notes к 4:1).
# Песни и славословия 4:8 и 4:11 — в «…», не красные.
# 〔…〕 в главе нет: все слова стихов в базе есть, в том числе в 4:3 (проверено запросом:
# ιασπιδι, σαρδιω, σμαραγδινω — ЕСТЬ). πνεῦμα без ἅγιον — 霊[れい].
# Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

tr_code: jp-box
book: otkr
chapter: 4
draft: true

verses:
  1: "その後[のち]、わたしが見[み]ていると、天[てん]に開[ひら]いた門[もん]があった。すると、わたしが最初[さいしょ]に聞[き]いた、ラッパが語[かた]りかけるようなあの声[こえ]が、こう言[い]った。「ここへ上[のぼ]って来[き]なさい。これから起[お]こるべきことを、あなたに見[み]せよう。」"
  2: "たちまち、わたしは霊[れい]のうちにあった。見[み]ると、天[てん]に御座[みくら]が置[お]かれ、その御座[みくら]の上[うえ]に、座[すわ]っておられる方[かた]がいた。"
  3: "座[すわ]っておられる方[かた]は、その姿[すがた]が碧玉[へきぎょく]と赤[あか]い瑪瑙[めのう]の石[いし]のようであり、御座[みくら]の周[まわ]りには虹[にじ]があって、その色[いろ]は緑玉[りょくぎょく]のようであった。"
  4: "御座[みくら]の周[まわ]りには、二十四[にじゅうし]の御座[みくら]が並[なら]んでいた。そこには二十四[にじゅうし]人[にん]の長老[ちょうろう]が、白[しろ]い衣[ころも]を着[き]、頭[あたま]に金[きん]の冠[かんむり]を戴[いただ]いて座[すわ]っていた。"
  5: "御座[みくら]からは、稲妻[いなずま]と声[こえ]と雷[かみなり]とが、出[で]ている。御座[みくら]の前[まえ]には、七[なな]つの火[ひ]のともしびが燃[も]えており、これが神[かみ]の七[なな]つの霊[れい]である。"
  6: "御座[みくら]の前[まえ]には、水晶[すいしょう]に似[に]たガラスの海[うみ]のようなものがある。御座[みくら]の真[ま]ん中[なか]と御座[みくら]の周[まわ]りには、前[まえ]にも後[うしろ]にも目[め]が満[み]ちた四[よっ]つの生[い]き物[もの]がいる。"
  7: "第一[だいいち]の生[い]き物[もの]は獅子[しし]に似[に]ており、第二[だいに]の生[い]き物[もの]は子[こ]牛[うし]に似[に]ており、第三[だいさん]の生[い]き物[もの]は人[ひと]のような顔[かお]を持[も]ち、第四[だいよん]の生[い]き物[もの]は飛[と]ぶ鷲[わし]に似[に]ていた。"
  8: "四[よっ]つの生[い]き物[もの]には、それぞれ六[むっ]つの翼[つばさ]があり、その周[まわ]りにも内側[うちがわ]にも、目[め]で満[み]ちあふれている。彼[かれ]らは昼[ひる]も夜[よる]も休[やす]むことなく、こう言[い]いつづける。「聖[せい]なるかな、聖[せい]なるかな、聖[せい]なるかな、全能者[ぜんのうしゃ]である主[しゅ]なる神[かみ]、かつておられた方[かた]、今[いま]おられる方[かた]、来[こ]られる方[かた]。」"
  9: "生[い]き物[もの]たちが、御座[みくら]に座[すわ]っておられる方[かた]、すなわち世々[よよ]限[かぎ]りなく生[い]きておられる方[かた]に、栄光[えいこう]と尊[そん]敬[けい]と感謝[かんしゃ]とをささげるたびに、"
  10: "二十四[にじゅうし]人[にん]の長老[ちょうろう]たちは、御座[みくら]におられる方[かた]の前[まえ]にひれ伏[ふ]した。そして、世々[よよ]限[かぎ]りなく生[い]きておられる方[かた]を拝[はい]し、自分[じぶん]の冠[かんむり]を御座[みくら]の前[まえ]に置[お]いて、こう言[い]う。"
  11: "「わたしたちの主[しゅ]であり神[かみ]である方[かた]よ、あなたは栄光[えいこう]と尊[そん]敬[けい]と力[ちから]とを受[う]けるにふさわしい方[かた]である。あなたがすべてのものを造[つく]られたからである。すべてのものはあなたの御心[みこころ]によって存在[そんざい]するようになり、造[つく]られた。」"

notes:
  1: "Голос с неба не назван голосом Христа, поэтому «…» без красного (по заданию). θύρα ἠνεῳγμένη — 開いた門. φωνὴ… ὡς σάλπιγγος — ラッパのような声. Ἀνάβα ὧδε — ここへ上って来なさい. ἃ δεῖ γενέσθαι — 起こるべきこと."
  2: "εὐθέως ἐγενόμην ἐν πνεύματι — たちまち霊のうちにあった (состояние, не «в духе» как настроение). θρόνος ἔκειτο — 御座が置かれ."
  3: "ἴασπις — 碧玉, σάρδιον — 赤い瑪瑙, σμάραγδος — 緑玉 (изумруд). ἶρις — 虹; ὅμοιος ὁράσει σμαραγδίνῳ относится к радуге, поэтому その色は緑玉のよう. 〔…〕 не нужны: все слова в базе есть."
  4: "θρόνους εἴκοσι τέσσαρες — 二十四の御座. πρεσβύτεροι — 長老 (термин корпуса). στεφάνους χρυσοῦς — 金の冠."
  5: "ἀστραπαὶ καὶ φωναὶ καὶ βρονταί — 稲妻と声と雷 (порядок базы; у jp-joc иначе). λαμπάδες πυρός — 火のともしび. ἑπτὰ πνεύματα τοῦ θεοῦ — 七つの霊, без ἅγιον."
  6: "θάλασσα ὑαλίνη ὁμοία κρυστάλλῳ — 水晶に似たガラスの海. ζῷα — 生き物 (не «животные»). γέμοντα ὀφθαλμῶν — 目が満ちた."
  7: "λέων, μόσχος, ἄνθρωπος, ἀετός — 獅子、子牛、人、鷲. У третьего не облик зверя, а лицо как у человека, поэтому 人のような顔."
  8: "ἓν καθ᾽ ἓν… ἀνὰ πτέρυγας ἕξ — у каждого по шести крыл. Гимн в «…», не красный. ὁ παντοκράτωρ — 全能者 (как 1:8 в otkr_01). ὁ ἦν καὶ ὁ ὢν καὶ ὁ ἐρχόμενος — かつておられた方、今おられる方、来られる方 (порядок базы; ср. 1:4)."
  9: "δώσουσιν — fut.: «когда воздадут»; ささげるたびに. εἰς τοὺς αἰῶνας τῶν αἰώνων — 世々限りなく."
  10: "πεσοῦνται — ひれ伏す. βαλοῦσιν τοὺς στεφάνους — 冠を御座の前に置く; венец слагается перед престолом."
  11: "Ἄξιος εἶ, ὁ κύριος καὶ ὁ θεὸς ἡμῶν — わたしたちの主であり神である方よ. διὰ τὸ θέλημά σου ἦσαν καὶ ἐκτίσθησαν — あなたの御心によって存在するようになり、造られた. Славословие в «…», не красное."
