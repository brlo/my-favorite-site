verses:
  1: "サウルの家[いえ]とダビデの家[いえ]との間[あいだ]の戦[たたか]いは長[なが]く続[つづ]いた。ダビデの家はますます強[つよ]くなり、サウルの家はますます弱[よわ]くなった。"
  2: "ヘブロンでダビデに六人[ろくにん]の息子[むすこ]が生[う]まれた。長男[ちょうなん]はイズレエル人[じん]アヒノアムの子[こ]アムノン、"
  3: "次男[じなん]はカルメル人[じん]アビガイルの子[こ]ダルイア、三男[さんなん]はゲシルの王[おう]トルミの娘[むすめ]マアカの子[こ]アブサロム、"
  4: "四男[よんなん]はアギトの子[こ]アドニヤ、五男[ごなん]はアビタルの子[こ]サファティア、"
  5: "六男[ろくなん]はダビデの妻[つま]エグラの子[こ]イエテラアム。これらはヘブロンでダビデに生[う]まれた。"
  6: "サウルの家[いえ]とダビデの家[いえ]との戦[たたか]いが続[つづ]く中[なか]、アブネルはサウルの家を支[ささ]えていた。"
  7: "サウルには、イオルの娘[むすめ]リツパという側女[そばめ]がいた。アブネルは彼女[かのじょ]のところに入[はい]った。そこでサウルの子[こ]イシュボシェトはアブネルに言[い]った。「なぜ父[ちち]の側女[そばめ]のところに入[はい]ったのか。」"
  8: "アブネルはイシュボシェトのこの言葉[ことば]にひどく怒[いか]って言[い]った。「わたしは犬[いぬ]の頭[あたま]か。今日[きょう]、わたしはあなたの父[ちち]サウルの家[いえ]に、その兄弟[きょうだい]たちや友人[ゆうじん]たちに慈[いつく]しみを施[ほどこ]し、あなたをダビデの家[いえ]に渡[わた]さず、ダビデの家へ逃[に]げ込[こ]みもしなかった。それなのに、あなたは今日、女[おんな]のことをわたしに問[と]い詰[つ]めるのか。」"
  9: "神[かみ]がアブネルにこうし、さらに重[かさ]ねてこうされるように。主[しゅ]がダビデに誓[ちか]われたとおりを、今日[きょう]、わたしは彼[かれ]に行[おこな]う。"
  10: "すなわち、サウルの家[いえ]から王国[おうこく]を取[と]り去[さ]り、ダビデの王座[おうざ]をダンからベエル・シェバまで、イスラエルとユダの上[うえ]に立[た]てることだ。"
  11: "イシュボシェトは、アブネルを恐[おそ]れていたので、もはや一言[ひとこと]も答[こた]えることができなかった。"
  12: "アブネルは、ダビデがいたタイラムへ使者[ししゃ]を送[おく]って言[い]った。「わたしと契約[けいやく]を結[むす]べ。見[み]よ、わたしの手[て]はあなたとともにあり、イスラエルの家[いえ]すべてをあなたのもとへ返[かえ]そう。」"
  13: "ダビデは言[い]った。「よし、わたしはあなたと契約[けいやく]を結[むす]ぼう。ただ、一[ひと]つのことだけをあなたに求[もと]める。わたしの顔[かお]を見[み]に来[く]るとき、サウルの娘[むすめ]ミカルを連[つ]れて来[こ]なければ、わたしの顔を見ることはできない。」"
  14: "ダビデはサウルの子[こ]イシュボシェトに使者[ししゃ]を送[おく]って言[い]った。「わたしの妻[つま]ミカルを返[かえ]せ。わたしは彼女[かのじょ]をペリシテ人[じん]の百[ひゃく]の包皮[ほうひ]で手[て]に入[い]れたのだ。」"
  15: "イシュボシェトは人[ひと]を遣[つか]わし、彼女[かのじょ]を夫[おっと]であるセラの子[こ]ファルティエルのもとから連[つ]れ去[さ]らせた。"
  16: "彼女[かのじょ]の夫[おっと]は泣[な]きながら彼女の後[あと]をバラキムまでついて来[き]た。アブネルは彼[かれ]に言[い]った。「帰[かえ]れ。」彼は帰[かえ]った。"
  17: "アブネルはイスラエルの長老[ちょうろう]たちに語[かた]って言[い]った。「昨日[きのう]も一昨日[おととい]も、あなたがたはダビデが自分[じぶん]たちの上[うえ]に王[おう]として立[た]つことを求[もと]めていた。"
  18: "今[いま]、それを実行[じっこう]せよ。主[しゅ]はダビデについて、こう言[い]われたからだ。『わたしは、わたしのしもべダビデの手[て]によってイスラエルを、ペリシテ人[じん]の手[て]から、またすべての敵[てき]の手[て]から救[すく]う。』」"
  19: "アブネルはベニヤミンにもそう語[かた]った。そして、イスラエルとベニヤミンの家[いえ]すべての目[め]に良[よ]しとされたことを残[のこ]らず、ヘブロンでダビデの耳[みみ]に入[い]れるために行[い]った。"
  20: "アブネルは二十人[にじゅうにん]の男[おとこ]たちとともにヘブロンでダビデのもとに来[き]た。ダビデはアブネルとその男[おとこ]たちのために酒宴[しゅえん]を開[ひら]いた。"
  21: "アブネルはダビデに言[い]った。「わたしは立[た]って行[い]き、イスラエルすべてをわたしの主人[しゅじん]である王[おう]のもとへ集[あつ]め、あなたと契約[けいやく]を結[むす]ばせよう。あなたは、あなたの魂[たましい]が望[のぞ]むすべての者の上[うえ]に王として立[た]つことになる。」ダビデはアブネルを送[おく]り出[だ]し、彼は平穏[へいおん]のうちに去[さ]った。"
  22: "見[み]よ、ダビデの若者[わかもの]たちとヨアブは遠征[えんせい]から帰[かえ]って来[き]て、多[おお]くの分捕[ぶんど]り物[もの]を携[たずさ]えていた。アブネルはもうヘブロンのダビデのもとにいなかった。ダビデが彼を送[おく]り出[だ]し、彼が平穏[へいおん]のうちに去[さ]っていたからである。"
  23: "ヨアブとその全[ぜん]軍[ぐん]が着[つ]き、人[ひと]々[びと]はヨアブに告[つ]げて言[い]った。「ネルの子[こ]アブネルがダビデのもとに来[き]た。ところが、ダビデは彼を送[おく]り出[だ]し、彼は平穏のうちに去[さ]った。」"
  24: "ヨアブは王[おう]のもとに入[はい]って言[い]った。「何[なん]ということをしたのか。見[み]よ、アブネルがあなたのもとに来[き]たのに、なぜ彼を送[おく]り出[だ]して、平穏のうちに去[さ]らせたのか。"
  25: "ネルの子[こ]アブネルの悪[わる]だくみを、あなたは知[し]らないのか。彼はあなたを欺[あざむ]き、あなたの出[で]入[い]りを探[さぐ]り、あなたがするすべてのことを知[し]ろうとして来[き]たのだ。」"
  26: "ヨアブはダビデのもとを出[で]て、アブネルの後[あと]を追[お]う使者[ししゃ]たちを送[おく]った。彼らは彼をセイラムの井戸[いど]から連[つ]れ戻[もど]した。ダビデはそのことを知[し]らなかった。"
  27: "アブネルがヘブロンに戻[もど]ると、ヨアブは彼を門[もん]の脇[わき]へ引[ひ]き寄[よ]せ、親[した]しく話[はな]すかのように装[よそお]って、そこで彼の脇腹[わきばら]を打[う]った。彼は、ヨアブの兄弟[きょうだい]アサエルの血[ち]によって死[し]んだ。"
  28: "その後[のち]、ダビデはこのことを聞[き]いて言[い]った。「わたしもわたしの王国[おうこく]も、ネルの子[こ]アブネルの血[ち]については、主[しゅ]の前[まえ]に永遠[えいえん]に潔白[けっぱく]だ。"
  29: "その血[ち]がヨアブの頭[あたま]と、その父[ちち]の家[いえ]すべての上[うえ]に降[くだ]るように。ヨアブの家[いえ]には、漏[も]らす病[やまい]の者[もの]、重[おも]い皮膚病[ひふびょう]の者[もの]、杖[つえ]をつく者[もの]、剣[つるぎ]に倒[たお]れる者[もの]、パンを欠[か]く者[もの]が絶[た]えないように。」"
  30: "ヨアブとその兄弟[きょうだい]アベシャは、アブネルがガバオンの戦[いくさ]で自分[じぶん]たちの兄弟アサエルを殺[ころ]したので、アブネルをねらっていた。"
  31: "ダビデはヨアブと、彼とともにいるすべての民[たみ]に言[い]った。「あなたがたの衣[ころも]を裂[さ]き、粗布[あらぬの]を身[み]に着[つ]けて、アブネルの前[まえ]で泣[な]け。」ダビデ王[おう]は寝台[しんだい]の後[あと]を追[お]って行[い]った。"
  32: "人[ひと]々[びと]はアブネルをヘブロンに葬[ほうむ]った。王[おう]は声[こえ]を上[あ]げて、アブネルの墓[はか]の上[うえ]で泣[な]いた。民[たみ]もみなアブネルのために泣[な]いた。"
  33: "王[おう]はアブネルのために嘆[なげ]いて言[い]った。「アブネルはナバルのような死[し]に方[かた]で死[し]ぬのか。"
  34: "あなたの手[て]は縛[しば]られず、足[あし]は足枷[あしかせ]にかけられていなかった。ナバルのように扱[あつか]われることもなく、あなたは不正[ふせい]の子[こ]らの前[まえ]に倒[たお]れた。」民[たみ]はみな、彼[かれ]を泣[な]くために集[あつ]まった。"
  35: "民[たみ]はみな、まだ日[ひ]のあるうちに、ダビデにパンを食[た]べさせようとして来[き]た。しかしダビデは誓[ちか]って言[い]った。「神[かみ]がわたしにこうし、さらにこう加[くわ]えられるように。日[ひ]が沈[しず]むまでは、わたしはパンも、そのほかの何[なに]も口[くち]にしない。」"
  36: "民[たみ]はみな、このことを知[し]り、王[おう]が民の前[まえ]でしたすべてのことを、彼[かれ]らの目[め]に良[よ]しとした。"
  37: "民[たみ]はみな、イスラエルはみな、その日[ひ]、ネルの子[こ]アブネルを殺[ころ]したのが王[おう]によるのでないことを知[し]った。"
  38: "王[おう]は自分[じぶん]の若者[わかもの]たちに言[い]った。「今日[きょう]、イスラエルで大[おお]きな指[し]導[どう]者[しゃ]が倒[たお]れたことを知[し]らないのか。"
  39: "わたしは今日[きょう]、油[あぶら]を注[そそ]がれて王[おう]とされた、血[ち]の近[ちか]い者[もの]にすぎない。しかし、この男[おとこ]たち、ツルヤの子[こ]らはわたしよりも手荒[てあら]い。主[しゅ]が、悪[わる]を行[う]者[もの]に、その悪[あく]に応[おう]じて報[むく]いられますように。」"

notes:
  1: "ἐπὶ πολύ — надолго, продолжительно. ἀνὰ μέσον — между. ἐπορεύετο καὶ ἐκραταιοῦτο — шёл и укреплялся (κραταιόω). ἠσθένει — ослабевал (ἀσθενέω)."
  2: "ἐτέχθησαν — родились (τίκτω). πρωτότοκος — первенец. Слав. добавляет «сынов шесть» — в LXX числа нет; по паритету внесено в основной текст без скобок. Αχινοομ ἡ Ιεζραηλῖτις — Ахиноама Изреелитянка (アヒノアム, イズレエル人)."
  3: "Δαλουια — Далуиа (LXX; евр. Хилеав), ダルイア. Αβιγαια τῆς Καρμηλίας — Авигея Кармилитянка (カルメル人). Θολμι βασιλέως Γεσιρ — Фолмий, царь Гесирский (ゲシル; Синод. «Фалмай, царь Гессурский»). Μααχα — Мааха."
  4: "Ορνια υἱὸς Φεγγιθ — Орния, сын Феггифы (LXX); слав. «адониа сын аггифы» — по МТ (Адония), в тексте держим слав. чтение. Σαβατια τῆς Αβιταλ — Саватия от Авиталы (LXX); слав. «сафатиа от авиталы» — держим слав."
  5: "Ιεθερααμ τῆς Αιγλα γυναικὸς Δαυιδ — Иефераам от Еглы, жены Давидовой (LXX Αιγλα; слав. «егла»). οὗτοι ἐτέχθησαν — эти родились."
  6: "ἦν κρατῶν τοῦ οἴκου Σαυλ — держал, поддерживал дом Саула (κρατέω, прич. наст.)."
  7: "παλλακή — наложница (παλλακή), 側女. Ρεσφα θυγάτηρ Ιαλ — Рицпа, дочь Иоля (LXX Ιαλ; слав. «иоля»), リツパ, イオル. Слав. добавляет «и вниде к ней авенир» — в LXX этого нет; по паритету внесено в основной текст без скобок. LXX здесь и в 11, 14, 15 называет Иевосфея Μεμφιβοσθε — то же лицо, что Ιεβοσθε в 2:8."
  8: "Μὴ κεφαλὴ κυνὸς ἐγώ εἰμι; — разве я собачья голова? ἐποίησα ἔλεος — я оказал милость. ηὐτομόλησα εἰς τὸν οἶκον Δαυιδ — не перебежал к дому Давида (αὐτομολέω); Синод. «не предал тебя в руки Давида» (по МТ). ἐπιζητεῖς ἐπ᾽ ἐμὲ ὑπὲρ ἀδικίας γυναικὸς — взыскиваешь на мне за вину женщины."
  9: "Τάδε ποιήσαι ὁ θεὸς τῷ Αβεννηρ καὶ τάδε προσθείη αὐτῷ — «то и то пусть сделает Бог Авениру и то приложит ему» (клятвенная формула, ср. 1 Цар 3:17). ὤμοσεν κύριος τῷ Δαυιδ — клялся Господь Давиду."
  10: "περιελεῖν τὴν βασιλείαν — отнять царство (περιαιρέω). τοῦ ἀναστῆσαι τὸν θρόνον — воздвигнуть престол. ἀπὸ Δαν ἕως Βηρσαβεε — от Дана до Вирсавии; здесь это место (ベエル・シェバ), не лицо (ср. 11:3)."
  11: "οὐκ ἠδυνάσθη ἀποκριθῆναι ῥῆμα — не мог ответить ни слова. ἀπὸ τοῦ φοβεῖσθαι — из страха (ἀπό причины)."
  12: "εἰς Θαιλαμ, οὗ ἦν παραχρῆμα — в Фелам/Тайлам, где он был тогда (Θαιλαμ; Синод. «в Хеврон»). Διάθου διαθήκην σου μετ᾽ ἐμοῦ — положи завет твой со мною (διατίθημι). ἐπιστρέψαι πρὸς σὲ πάντα τὸν οἶκον Ισραηλ — обратить к тебе весь дом Израилев."
  13: "καλῶς διαθήσομαι — хорошо заключу завет. λόγον ἕνα αἰτοῦμαι — одного слова прошу. Οὐκ ὄψει τὸ πρόσωπόν μου — не увидишь лица моего. Μελχολ θυγατέρα Σαυλ — Мелхола, дочь Саула; в корпусе ミカル (ср. 1 Цар 18:20–27)."
  14: "ἀπόδος μοι τὴν γυναῖκά μου — отдай мне жену мою. ἐν ἑκατὸν ἀκροβυστίαις ἀλλοφύλων — за сто краеобрезаний филистимских (ἀκροβυστία), 包皮; ср. 1 Цар 18:25–27."
  15: "Φαλτιηλ υἱοῦ Σελλης — Фалтиил, сын Селлиса (ファルティエル, セラ; Синод. «Фалтий, сын Лаишев»)."
  16: "ἐπορεύετο ... κλαίων ὀπίσω αὐτῆς — шёл за нею, плача (прич. наст.). ἕως Βαρακιμ — до Баракима (слав. «Вараким»; Синод. «Бахурим»). Πορεύου ἀνάστρεφε — иди, возвратись."
  17: "Ἐχθὲς καὶ τρίτην — вчера и третьего дня, т.е. давно. ἐζητεῖτε τὸν Δαυιδ βασιλεύειν ἐφ᾽ ὑμῶν — вы искали Давида, чтобы он царствовал над вами."
  18: "ποιήσατε — сделайте. Ἐν χειρὶ τοῦ δούλου μου Δαυιδ — рукою раба Моего Давида. σώσω τὸν Ισραηλ — спасу Израиля (слав. «люди моя израиля»). ἐκ χειρὸς ἀλλοφύλων — от руки иноплеменников. Слова Господа — 『…』 внутри речи Авенира."
  19: "ἐλάλησεν ἐν τοῖς ὠσὶν Βενιαμιν — говорил в уши Вениамина, т.е. лично, тайно. ὅσα ἤρεσεν ἐν ὀφθαλμοῖς — что было угодно в очах."
  20: "πότον — пир (πότος). εἴκοσι ἄνδρες — двадцать человек."
  21: "Ἀναστήσομαι ... συναθροίσω — встану и соберу. πρὸς κύριόν μου τὸν βασιλέα — к господину моему царю. διαθήσομαι μετὰ σοῦ — заключу с тобою (LXX; слав. «положу с ним завет»). ἐπιθυμεῖ ἡ ψυχή σου — желает душа твоя. ἐν εἰρήνῃ — с миром."
  22: "παρεγίνοντο ἐκ τῆς ἐξοδίας — приходили из похода (ἐξοδία). σκῦλα πολλά — много добычи (σκῦλον). ἀπεστάλκει — отпустил (плюсквамперфект)."
  23: "ἤχθησαν — пришли, были приведены (ἄγω). Ἥκει — пришёл (плюсквамперфект ἥκω). ἀπέσταλκεν αὐτὸν — отпустил его."
  24: "Τί τοῦτο ἐποίησας; — что это ты сделал? ἵνα τί ἐξαπέσταλκας — зачем отпустил."
  25: "ἀπατῆσαί σε παρεγένετο — пришёл обмануть тебя (ἀπατάω). γνῶναι τὴν ἔξοδόν σου καὶ τὴν εἴσοδόν σου — узнать выход твой и вход твой."
  26: "ἀπὸ τοῦ φρέατος τοῦ Σειραμ — от колодца Сира/Сеирама (φρέαρ — колодец), 井戸. ἐπιστρέφουσιν αὐτόν — возвращают его."
  27: "ἐξέκλινεν αὐτὸν ... ἐκ πλαγίων τῆς πύλης — отвёл его в сторону от ворот (ἐκκλίνω). ἐνεδρεύων — замышляя коварство (ἐνεδρεύω); слав. «лукавно». ἐπὶ τὴν ψόαν — в чресла, 脇腹. ἐν τῷ αἵματι Ασαηλ — в крови Асаила, т.е. за его кровь."
  28: "Ἀθῷός εἰμι — неповинен я (ἀθῷος). ἀπὸ κυρίου ἕως αἰῶνος — от Господа вовеки. ἀπὸ τῶν αἱμάτων — от крови (мн. ч.)."
  29: "καταντησάτωσαν ἐπὶ κεφαλήν — да сойдут на голову. γονορρυής — страдающий истечением семени (γονορρυής), 漏らす病. λεπρός — прокажённый, 重い皮膚病 (как в Лк 5:12). κρατῶν σκυτάλης — держащий посох (σκυτάλη). ἐλασσούμενος ἄρτοις — умалённый хлебами. μὴ ἐκλίποι — да не оскудеет (ἐκλείπω); Синод. «пусть не отсечётся» (по МТ)."
  30: "διεπαρετηροῦντο — подстерегали (διαπαρετηρέω); слав. «наблюдаху», Синод. «убили». ἀνθ᾽ ὧν — за то, что."
  31: "Διαρρήξατε τὰ ἱμάτια — разорвите одежды. περιζώσασθε σάκκους — препояшьтесь вретищем (σάκκος), 粗布. κόπτεσθε — рыдайте, бия себя (κόπτομαι). ὀπίσω τῆς κλίνης — за одром/гробом (κλίνη), 寝台."
  32: "ἦρεν τὴν φωνὴν αὐτοῦ — возвысил голос свой. ἐπὶ τοῦ τάφου αὐτοῦ — над гробом его."
  33: "ἐθρήνησεν ὁ βασιλεύς — оплакал царь. Εἰ κατὰ τὸν θάνατον Ναβαλ ἀποθανεῖται Αβεννηρ; — «смертью Навала умрёт ли Авенир?»; נָבָל («навал») — безумный, подлый; отсюда Синод. «смертью ли подлого»."
  34: "αἱ χεῖρές σου οὐκ ἐδέθησαν — руки твои не были связаны (δέω). οἱ πόδες σου οὐκ ἐν πέδαις — ноги твои не в оковах (πέδη), 足枷. οὐ προσήγαγεν ὡς Ναβαλ — «не привёл/не поступил, как Навал» (тёмное место LXX; евр. иначе). ἐνώπιον υἱῶν ἀδικίας ἔπεσας — пред сынами беззакония пал ты. συνήχθη ὁ λαὸς τοῦ κλαῦσαι — собрался народ плакать."
  35: "περιδειπνῆσαι τὸν Δαυιδ ἄρτοις — предложить Давиду хлеба (περιδειπνέω). ἔτι οὔσης ἡμέρας — когда ещё был день. οὐ μὴ γεύσωμαι ἄρτου ἢ ἀπό παντός τινος — не вкушу хлеба или чего-либо (двойное отрицание)."
  36: "ἔγνω πᾶς ὁ λαός — узнал весь народ. ἤρεσεν ἐνώπιον αὐτῶν — понравилось им."
  37: "ὅτι οὐκ ἐγένετο παρὰ τοῦ βασιλέως θανατῶσαι — что не от царя произошло умерщвление."
  38: "ἡγούμενος μέγας — вождь великий. πέπτωκεν — пал (перф. πίπτω)."
  39: "συγγενὴς καὶ καθεσταμένος ὑπὸ βασιλέως — родственник и поставленный царём (καθίστημι); Синод. «слаб, хотя и помазан» (по МТ). σκληρότεροί μού εἰσιν — жёстче, жесточе меня (σκληρός). ἀνταποδῷ κύριος — да воздаст Господь (ἀνταποδίδωμι)."
