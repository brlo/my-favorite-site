# jp-box, 2-я Царств, глава 3. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); второй свидетель церковного текста —
# церковнославянский (csl-ru), по новому паритету (docs/japanese-bible.md,
# «Паритет LXX и церковнославянского»); ru (Синодальный) — только для понимания.
# jp-joc в книге нет; jp-ni (под авторским правом) источником не был.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 3: дом Давида и дом Саула (1), сыновья Давида в Хевроне (2–5), Авенир и
# Рицпа (6–11), Авенир у Давида и возвращение Мелхолы (12–16), Авенир у старейшин
# (17–19), пир и гибель Авенира (20–27), плач и проклятие (28–39).
# Речь — 「…」; слова Господа в речи Авенира — 『…』 (18); плач царя — 33–34.
# Красного и синего нет.
# Нумерация по gr: 39 стихов, совпадает с csl/ru.
# 〔…〕 нет, но по паритету в основной текст без скобок внесены две славянские
# фразы, которых нет в LXX: 3:2 «шесть [сыновей]» и 3:7 «и вошёл к ней Авенир».
# Сносок ⟨…⟩ нет: 契約, 油を注ぐ, 包皮 уже в корпусе.

