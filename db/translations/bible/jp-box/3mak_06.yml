verses:
  1: "そのとき、この国[くに]の祭司[さいし]たちのうちの名高[なだか]い人[ひと]、エレアザルという者[もの]がいた。彼[かれ]はすでに老年[ろうねん]の域[いき]に達[たっ]し、生涯[しょうがい]のあらゆる徳[とく]を身[み]にまとっていた。彼[かれ]はそばにいた長老[ちょうろう]たちを静[しず]め、聖[せい]なる神[かみ]を呼[よ]び求[もと]めるよう促[うなが]して、こう祈[いの]った。"
  2: "「大[おお]いなる力[ちから]の王[おう]、いと高[たか]き全能者[ぜんのうしゃ]なる神[かみ]よ、あなたはすべての造[つく]られたものを憐[あわ]れみをもって治[おさ]めておられます。父[ちち]よ、アブラハムの子孫[しそん]に、聖[せい]とされたヤコブの子[こ]らに、あなたの聖[せい]なる嗣業[しぎょう]である民[たみ]に目[め]を留[と]めてください。彼[かれ]らは異[い]なる国[くに]で異邦[いほう]の者[もの]となり、不正[ふせい]にも滅[ほろ]ぼされようとしています。"
  3: "あなたは、数多[かずおお]くの戦車[せんしゃ]を持[も]ち、不法[ふほう]な厚[あつ]かましさと大言壮語[たいげんそうご]する舌[した]によって高[たか]ぶくれていた、かつてのこのエジプトの支配者[しはいしゃ]ファラオを、高慢[こうまん]な軍[ぐん]もろとも海[うみ]に沈[しず]めて滅[ほろ]ぼされました。そしてイスラエルの民[たみ]には憐[あわ]れみの光[ひかり]を照[て]らされたのです。"
  4: "あなたは、数[かぞ]え切[き]れない軍勢[ぐんぜい]に驕[おご]り、槍[やり]ですでに全[すべ]ての地[ち]を手[て]に収[おさ]め、あなたの聖[せい]なる都[みやこ]にまで攻[せ]め上[のぼ]り、高慢[こうまん]と厚[あつ]かましさで大[おお]いなることを語[かた]ったアッシリアの重[おも]い王[おう]センナケリムを、主[しゅ]よ、あなたは打[う]ち砕[くだ]き、多[おお]くの民[たみ]にあなたの支配[しはい]の力[ちから]を明[あき]らかに示[しめ]されました。"
  5: "あなたは、虚[むな]しいものに仕[つか]えないために自[みずか]ら魂[たましい]を火[ひ]に委[ゆだ]ねたバビロンの三人[さんにん]の友[とも]を、燃[も]え盛[さか]る炉[ろ]を涼[すず]しくして救[すく]い出[だ]し、髪[かみ]の一筋[ひとすじ]さえ傷[きず]つけず、逆[さから]う者[もの]たちすべてに炎[ほのお]を送[おく]られました。"
  6: "あなたは、妬[ねた]みの中傷[ちゅうしょう]によって地[ち]に投[な]げられ、獣[けもの]の餌[えさ]とされたダニエルを、無傷[むきず]で光[ひかり]の中[なか]へ引[ひ]き上[あ]げられました。また、深[ふか]みに住[す]む大[おお]きな魚[さかな]の腹[はら]の中[なか]で溶[と]けかかっていたヨナを、父[ちち]よ、あなたは顧[かえり]みて、彼[かれ]の身内[みうち]すべての前[まえ]に無傷[むきず]で立[た]たせられました。"
  7: "今[いま]、暴虐[ぼうぎゃく]を憎[にく]み、多[おお]くの憐[あわ]れみを抱[いだ]き、すべてを覆[おお]う方[かた]よ、速[すみ]やかに現[あらわ]れてください。イスラエルの血筋[ちすじ]の者[もの]たちは、忌[い]まわしい不法[ふほう]な民[たみ]たちから辱[はずかし]められています。"
  8: "もしわたしたちの生活[せいかつ]が、この移住[いじゅう]の地[ち]で不敬[ふけい]によって捕[と]らわれているのなら、敵[てき]の手[て]からわたしたちを救[すく]い出[だ]したうえで、主[しゅ]よ、あなたが選[えら]ばれる死[し]にわたしたちを渡[わた]してください。"
  9: "虚[むな]しいものに心[こころ]を寄[よ]せる者[もの]たちが、あなたに愛[あい]された者[もの]たちの滅[ほろ]びのゆえに、『彼[かれ]らの神[かみ]さえ彼[かれ]らを救[すく]い出[だ]さなかった』と言[い]って、虚[むな]しいものをほめたたえることのありませんように。"
  10: "しかし、あなたは永遠[えいえん]なる方[かた]、すべての力[ちから]と支配[しはい]を持[も]つ方[かた]です。今[いま]、目[め]を留[と]めてください。"
  11: "不法[ふほう]な者[もの]たちの傲慢[ごうまん]によって、陰謀[いんぼう]を企[くわだ]てる者[もの]たちの流[りゅう]儀[ぎ]で、理[り]不尽[ふじん]にも命[いのち]を奪[うば]われようとしているわたしたちを憐[あわ]れんでください。"
  12: "誉[ほま]れある方[かた]よ、ヤコブの血筋[ちすじ]を救[すく]う力[ちから]を持[も]つあなたの、打[う]ち勝[か]ち難[がた]い力[ちから]を、今日[きょう]、異邦人[いほうじん]たちが恐[おそ]れおののくようにしてください。"
  13: "幼[おさな]い子[こ]どもたちの群[む]れと、その親[おや]たちが涙[なみだ]とともにあなたに願[ねが]っています。すべての異邦人[いほうじん]に、主[しゅ]よ、あなたがわたしたちとともにいて、わたしたちから御顔[みかお]を背[そむ]けられなかったことが示[しめ]されますように。"
  14: "あなたが『彼[かれ]らが敵[てき]の国[くに]にいても、わたしは彼[かれ]らを見捨[みす]てなかった』と言[い]われたとおりに、主[しゅ]よ、そうしてください。」"
  15: "エレアザルがちょうど祈[いの]り終[お]えたとき、王[おう]は獣[けもの]たちと、軍[ぐん]のすべての咆哮[ほうこう]とともに競馬場[けいばじょう]を通[とお]り過[す]ぎた。"
  16: "これを見[み]て、ユダヤ人[じん]たちは天[てん]に向[む]かって大[おお]きな声[こえ]で叫[さけ]んだ。その声[こえ]は近[ちか]くの谷[たに]々[だに]にも響[ひび]きわたり、軍[ぐん]の全[すべ]てに抑[おさ]え難[がた]い恐慌[きょうこう]を引[ひ]き起[おこ]した。"
  17: "そのとき、大[おお]いなる栄光[えいこう]に輝[かがや]く全能[ぜんのう]の真実[しんじつ]の神[かみ]は、その聖[せい]なる御顔[みかお]を現[あらわ]し、天[てん]の門[もん]を開[ひら]かれた。そこから栄光[えいこう]をまとった二人[ふたり]の恐[おそ]ろしい姿[すがた]の天使[てんし]が降[くだ]りて来[き]た。ユダヤ人[じん]たちのほかは、すべての者[もの]にそれが見[み]えた。"
  18: "彼[かれ]らは立[た]ち向[む]かい、敵[てき]の軍[ぐん]を混乱[こんらん]と臆病[おくびょう]で満[み]たし、動[うご]くことのできない枷[かせ]で縛[しば]った。王[おう]の体[からだ]も震[ふる]えおののき、その荒々[あらあら]しい大胆[だいたん]さは忘[わす]れ去[さ]った。"
  19: "そして獣[けもの]たちは、ともに従[したが]って来[き]ていた武装[ぶそう]した軍[ぐん]の方[ほう]へ向[む]きを変[か]え、彼[かれ]らを踏[ふ]みにじり、滅[ほろ]ぼした。"
  20: "王[おう]の怒[いか]りは、以前[いぜん]に彼[かれ]が企[くわだ]てたことへの憐[あわ]れみと涙[なみだ]に変[か]わった。"
  21: "彼[かれ]は叫[さけ]び声[ごえ]を聞[き]き、すべての者[もの]が滅[ほろ]びに向[む]かって地[ち]に伏[ふ]しているのを見[み]て涙[なみだ]を流[なが]し、怒[いか]りをもって友人[ゆうじん]たちを脅[おど]しながら言[い]った。"
  22: "「おまえたちは王[おう]に背[そむ]き、その残酷[ざんこく]さにおいて暴君[ぼうくん]たちをしのぎ、わたし自身[じしん]、おまえたちの恩人[おんじん]である者[もの]を、すでに支配[しはい]と命[いのち]から追[お]いやろうとしている。ひそかに王国[おうこく]の益[えき]にならないことを企[くわだ]てているのだ。"
  23: "わたしたちの国[くに]の砦[とりで]を忠実[ちゅうじつ]に守[まも]ってきた者[もの]たちを、誰[だれ]が家[いえ]から引[ひ]き離[はな]し、理由[りゆう]もなくここに集[あつ]めたのか。"
  24: "最初[さいしょ]からすべての民[たみ]のうちでわたしたちに善意[ぜんい]を示[しめ]して際立[きわだ]ち、たびたび人[ひと]の受[う]ける最[もっと]も酷[ひど]い危険[きけん]を引[ひ]き受[う]けてきた者[もの]たちを、誰[だれ]がこうも不法[ふほう]に拷問[ごうもん]で苦[くる]しめたのか。"
  25: "不正[ふせい]な鎖[くさり]を解[と]け、ほどけ。これまで行[おこな]われたことを詫[わ]びて、彼[かれ]らを平和[へいわ]のうちに自分[じぶん]たちの家[いえ]へ帰[かえ]してやれ。全能[ぜんのう]の、天[てん]にいます生[い]ける神[かみ]の子[こ]らを放[はな]してやれ。この神[かみ]は、わたしたちの祖先[そせん]の時代[じだい]から今[いま]に至[いた]るまで、わたしたちの事[こと]がらに栄光[えいこう]と揺[ゆ]るぎない安定[あんてい]を妨[さまた]げられることなく与[あた]えてきた方[かた]である。」"
  26: "こうして王[おう]は語[かた]った。すると彼[かれ]らは、またたく間[ま]に解[と]き放[はな]たれ、死[し]を免[まぬか]れたばかりの身[み]で、聖[せい]なる救[すく]い主[ぬし]なる自分[じぶん]たちの神[かみ]をほめたたえた。"
  27: "その後[のち]、王[おう]は都[みやこ]に戻[もど]ると収入[しゅうにゅう]の担当者[たんとうしゃ]を呼[よ]び、七日間[なのかかん]、ユダヤ人[じん]にぶどう酒[さけ]と宴[うたげ]に必要なそのほかの品[しな]を配[くば]るよう命[めい]じた。彼[かれ]らが滅[ほろ]びを受[う]けると思[おも]われたその場所[ばしょ]で、彼[かれ]らにすべての喜[よろこ]びをもって救[すく]いの日[ひ]を過[す]ごさせるためであった。"
  28: "そのとき、以前[いぜん]は辱[はずかし]められ、黄泉[よみ]に近[ちか]く、いや、すでにその上[うえ]に立[た]っていた者[もの]たちは、苦[にが]く耐[た]え難[がた]い死[し]の代[か]わりに救[すく]いの宴[うたげ]を設[もう]け、自分[じぶん]たちの倒[たお]れと墓[はか]のために用意[ようい]されていた場所[ばしょ]を、喜[よろこ]びに満[み]ちた寝床[ねどこ]として分[わ]け合[あ]った。"
  29: "彼[かれ]らは嘆[なげ]きの歌[うた]をやめ、先祖[せんぞ]の歌[うた]を歌[うた]い始[はじ]め、救[すく]い主[ぬし]であり奇[き]跡[せき]を行[おこな]う神[かみ]を賛美[さんび]した。すべての泣[な]き声[ごえ]と悲[かな]しみの声[こえ]を退[しりぞ]け、平和[へいわ]な喜[よろこ]びのしるしとして輪[わ]を作[つく]って踊[おど]った。"
  30: "同[おな]じように王[おう]も、このことのために盛大[せいだい]な宴[うたげ]を開[ひら]き、思[おも]いがけず自分[じぶん]に与[あた]えられた救[すく]いのゆえに、絶[た]え間[ま]なく天[てん]に向[む]かって大[おお]いに感謝[かんしゃ]をささげた。"
  31: "以前[いぜん]は彼[かれ]らを滅[ほろ]びに、また鳥[とり]の餌[えさ]となる者[もの]と定[さだ]め、喜[よろこ]んで登録[とうろく]までした者[もの]たちは、自分[じぶん]たちの上[うえ]に恥[はじ]をまとって嘆[なげ]き、火[ひ]を吐[は]くような大胆[だいたん]さも不名誉[ふめいよ]に消[き]え去[さ]った。"
  32: "先[さき]に述[の]べたように、ユダヤ人[じん]たちはその輪[わ]を作[つく]り、宴[うたげ]とともに、明[あか]るい感謝[かんしゃ]と賛美[さんび]の歌[うた]の中で日[ひ]を過[す]ごした。"
  33: "彼[かれ]らはこのことについて共通[きょうつう]の定[さだ]めを設[もう]け、自分[じぶん]たちのすべての寄留地[きりゅうち]で、代々[だいだい]、かの日[ひ]々[び]を喜[よろこ]びの日[ひ]として祝[いわ]うことに決[き]めた。飲[の]み食[く]いのためではなく、神[かみ]によって彼[かれ]らに与[あた]えられた救[すく]いのためである。"
  34: "そして彼[かれ]らは王[おう]に願[ねが]い出[で]て、自分[じぶん]たちの家[いえ]へ帰[かえ]ることを許[ゆる]してほしいと求[もと]めた。"
  35: "彼[かれ]らの登録[とうろく]は、パホン月[つき]の二十五日[にじゅうごにち]からエピフ月[つき]の四日[よっか]まで、四十日間[よそかかん]行[おこな]われた。彼[かれ]らの滅[ほろ]びは、エピフ月[つき]の五日[いつか]から七日[なのか]までの三日間[みっかかん]に定[さだ]められていた。その日[ひ]々[び]、万物[ばんぶつ]の支配者[しはいしゃ]はその憐[あわ]れみを大[おお]いなる栄光[えいこう]とともに現[あらわ]し、彼[かれ]らを一斉[いっせい]に、つまずくことなく救[すく]い出[だ]された。"
  36: "彼[かれ]らは王[おう]からすべてを支給[しきゅう]されて、十四日[じゅうよっか]まで宴[うたげ]を続[つづ]けた。その日[ひ]に、彼[かれ]らは自分[じぶん]たちの解放[かいほう]について願[ねが]い出[で]たのである。"
  37: "王[おう]は彼[かれ]らに同意[どうい]し、町[まち]々[まち]の将軍[しょうぐん]たちに宛[あ]てて、寛大[かんだい]な心[こころ]を込[こ]めた次[つぎ]の書簡[しょかん]を彼[かれ]らに書[か]いた。"

notes:
  1: "Ἐλεάζαρος — Елеазар (エレアザル), священник из страны; ἐπίσημος — именитый; ἐν πρεσβείῳ τὴν ἡλικίαν λελογχώς — «достигший старческого возраста»; καταστείλας — «успокоив, поставив»."
  2: "СТИХ СОЕДИНЁН: gr 6:2+3. Обращение к Богу (2) и просьба призреть на семя Авраама (3). μεγαλοκράτωρ — «великодержавный»; μερὶς ἡγιασμένη — «освящённый удел» (嗣業); ἐν ξένῃ γῇ ξένος — «в чужой земле чужой»."
  3: "gr 6:4. Φαραω πληθύνοντα ἅρμασιν — «фараон, умноживший колесницы»; ποντοβρόχους ἀπώλεσας — «потопил в море»; φέγγος ἐλέους — «свет милости»."
  4: "gr 6:5. Σενναχηριμ — Сеннахирим (センナケリム); ἀναριθμήτοις δυνάμεσιν γαυρωθείς — «возгордившийся бесчисленными силами»; ἔθραυσας — «сокрушил»; ἔκδηλον — явный."
  5: "gr 6:6. τοὺς τρεῖς ἑταίρους — трёх друзей (отроков); διάπυρος κάμινος — «раскалённая печь»; δροσίσας — «оросив»; μέχρι τριχός — «до волоса»."
  6: "СТИХ СОЕДИНЁН: gr 6:7+8. Даниил (7) и Иона (8). διαβολαῖς φθόνου — «по клеветам зависти»; βορὰν θηρσίν — «в пищу зверям»; βυθοτρεφής — «живущий в глубине»; ἀπήμαντος — невредимый."
  7: "gr 6:9. μίσυβρις — «ненавидящий насилие»; πολυέλεος — многомилостивый; σκεπαστά — «покровитель, покрывающий»; ἐβδελυγμένα ἔθνη — «омерзительные народы»."
  8: "gr 6:10. ἀσεβείαις ἐνέσχησθαι — «быть связанным нечестием»; ᾧ προαιρῇ μόρῳ — «какой смертью изберёшь»; δέσποτα — владыка."
  9: "gr 6:11. ματαιόφρονες — «пустомыслящие»; ἐπὶ τῇ ἀπωλείᾳ τῶν ἠγαπημένων — «при погибели возлюбленных»; слова их в 『…』."
  10: "gr 6:12 (начало). πᾶσαν ἀλκὴν καὶ δυναστείαν ἔχων — «имеющий всякую силу и власть»; αἰώνιε — вечный; ἔπιδε — «призри»."
  11: "gr 6:12 (конец). καθ᾽ ὕβριν ἀνόμων — «по дерзости беззаконных»; ἀλόγιστον — «неразумно, без основания»; ἐν ἐπιβούλων τρόπῳ — «как с заговорщиками»."
  12: "gr 6:13. πτηξάτω — «да устрашатся»; ἀνίκητος — непобедимый; ἔντιμε — «почтенный»; ἐπὶ σωτηρίᾳ Ιακωβ γένους — «ко спасению рода Иакова»."
  13: "СТИХ СОЕДИНЁН: gr 6:14+15 (начало). Младенцы и родители умоляют (14), да будет явно язычникам, что Бог с ними (15а). νήπια — младенцы; ἀπέστρεψας τὸ πρόσωπον — «отвратил лицо»."
  14: "gr 6:15 (конец). Слова Бога «не презрел их в земле врагов» — в 『…』; ἐπιτέλεσον — «доверши». Здесь молитва (2–15) закрывается."
  15: "gr 6:16. λήγοντος ἄρτι τῆς προσευχῆς — «как только окончил молитву»; φρύαγμα — «рёв, кичение»; ἱππόδρομος — ипподром."
  16: "gr 6:17. ἀνέκραξαν — «возопили»; αὐλῶνες — долины, ущелья; ἀκατάσχετος πτόη — «неудержимый страх»."
  17: "gr 6:18. μεγαλόδοξος — «великой славы»; ἐπιφάνας τὸ ἅγιον πρόσωπον — «явив святое лицо»; φοβεροειδεῖς ἄγγελοι — «страшные видом ангелы»; πλὴν τοῖς Ιουδαίοις — «кроме иудеев»."
  18: "СТИХ СОЕДИНЁН: gr 6:19+20. Ангелы устрашают войско (19), трепет и забвение дерзости у царя (20). ἀκίνητοι πέδαι — «недвижимые оковы»; ὑπόφρικος — «объятый дрожью»; λήθη — забвение."
  19: "gr 6:21. ἀπέστρεψαν τὰ θηρία — «обратили зверей»; συνεπόμεναι ἔνοπλοι δυνάμεις — «сопровождающие вооружённые силы»."
  20: "gr 6:22. μετεστράφη ἡ ὀργὴ εἰς οἶκτον καὶ δάκρυα — «гнев обратился в жалость и слёзы»."
  21: "gr 6:23. ἀκούσας τῆς κραυγῆς — «услышав вопль»; πρηνεῖς — «ниц»; διηπειλεῖτο — «грозил»."
  22: "gr 6:24 (начало речи). Παραβασιλεύετε — «вы поступаете против царя»; τυράννους ὑπερβεβήκατε ὠμότητι — «превзошли тиранов жестокостью»; τῆς ἀρχῆς καὶ τοῦ πνεύματος μεθιστᾶν — «лишить власти и жизни»."
  23: "gr 6:25. κρατοῦντας ἐν πίστει τὰ τῆς χώρας ὀχυρώματα — «верно державших крепости страны»; ἀποστήσας τῆς οἰκίας — «отторгнув от дома»; ἀλόγως — «без разумной причины»."
  24: "gr 6:26. ἐξ ἀρχῆς εὐνοίᾳ διαφέροντας — «изначала отличавшихся доброжелательством»; χειρίστους κινδύνους — «жесточайшие опасности»; ἀθέσμως περιέβαλεν αἰκίαις — «беззаконно подверг мучениям»."
  25: "СТИХ СОЕДИНЁН: gr 6:27+28. «Разрешите, расторгните неправедные узы» и отпустите с миром (27); отпустите сынов всевышнего Бога (28). ἐκλύσατε — «ослабьте, расторгните»; παραιτησάμενοι — «испросив прощение»; ἀπαραπόδιστος εὐστάθεια — «беспрепятственная устойчивость»."
  26: "gr 6:29. ἐν ἀμερεῖ χρόνῳ — «в неделимый миг»; λυθέντες — «разрешённые»; ἐκπεφευγότες — «избежавшие»."
  27: "gr 6:30. ὁ ἐπὶ τῶν προσόδων — «заведующий доходами»; χορηγεῖν — «снабжать»; ἐπὶ ἡμέρας ἑπτά — семь дней; ἐν ᾧ τόπῳ ἔδοξαν τὸν ὄλεθρον ἀναλαμβάνειν — «на том месте, где, казалось, примут погибель»."
  28: "gr 6:31. ἐπονείδιστοι — «поносимые»; ἐπ᾽ αὐτῷ βεβηκότες — «стоявшие уже на самом аде»; κώθων σωτήριος — «спасительный пир» (κώθων — чаша, попойка); κλισίαι — ложа."
  29: "gr 6:32. θρῆνος — плач; ᾠδὴ πάτριος — песнь отцов; τερατοποιός — чудотворец; χοροί — хоры; εἰρηνικὴ εὐφροσύνη — мирная радость."
  30: "gr 6:33. συμπόσιον βαρύ — «большой пир»; ἀνθωμολογεῖτο — «воздавал благодарение»; παράδοξος σωτηρία — «неожиданное спасение»."
  31: "gr 6:34. οἰωνοβρώτους — «в пищу птицам»; ἀπογραψάμενοι — «переписав»; πυρόπνους τόλμα — «огнедышащая дерзость»; ἀκλεῶς — бесславно."
  32: "gr 6:35. χορός — хоровод; ἐξομολογήσεις ἱλαραί — «радостные славословия»; ψαλμοί — псалмы."
  33: "gr 6:36. κοινὸς θεσμός — «общее установление»; παροικία — переселение, жительство (寄留地); οὐ πότου χάριν — «не ради питья»."
  34: "gr 6:37. ἐντυχία — прошение; ἄφεσις — отпуск."
  35: "СТИХ СОЕДИНЁН: gr 6:38+39. Сроки переписи — с 25 пахона по 4 епифи, сорок дней (38); казнь назначена на 5–7 епифи; в эти дни Бог явил милость и спас (39). Παχων, Επιφι — египетские месяцы; ἀπταίστους — «непреткновенных»."
  36: "gr 6:40. εὐωχοῦντο — «пировали»; χορηγούμενοι — «снабжаемые»; τεσσαρεσκαιδεκάτη — четырнадцатый день; ἐντυχία περὶ τῆς ἀπολύσεως — прошение об отпуске."
  37: "gr 6:41. συναινέσας — «согласившись»; μεγαλοψύχως — великодушно; ἐπιστολή — письмо (書簡); ἡ ἐκτενία — «пространность, содержание»."
