# jp-box, 3-я Маккавейская, глава 6. Черновик для приёмки.
#
# Нумерация — по Синодальному (ru, 37 стихов); текст — с греческого (gr-lxx-byz,
# 41 стих); карта книги — в шапке гл. 1. В этой главе соединены:
# 6:2 (gr 2+3), 6:6 (gr 7+8), 6:13 (gr 14+15 нач.), 6:18 (gr 19+20),
# 6:25 (gr 27+28), 6:35 (gr 38+39). Кроме того gr 12 разделён между 6:10
# и 6:11, а gr 15 — между 6:13 и 6:14. Остальные — один к одному.
#
# Содержание: молитва священника Елеазара (1–15): Бог, погубивший фараона,
# Сеннахирима, сохранивший трёх отроков, Даниила и Иону; просьба о милости
# и о том, чтобы язычники не торжествовали. 16–23 — царь выходит на
# ипподром, иудеи вопиют, являются два ангела, звери обращаются на войско,
# царь в страхе. 24–28 — речь царя: «вы преступаете царскую власть»,
# освободите иудеев. 29–37 — избавление, пир, благодарственный праздник,
# просьба об отпуске, письмо.
# Прямая речь: 6:2–15 — молитва Елеазара в 「…」 (в 9 слова врагов и в 14
# слова Бога — 『…』); 6:24–28 — речь царя в 「…」. Остальное — повествование.
# 〔…〕 нет; сносок ⟨…⟩ нет. ru — только нумерация и понимание, его чтения
# в текст не вносятся (расхождения отмечены в notes).

