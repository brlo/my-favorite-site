verses:
  1: "ダビデはそこから上[のぼ]り、エン・ゲディの谷間[たにま]に住[す]んだ。"
  2: "サウルがペリシテ人の後[うし]ろから引[ひ]き返[かえ]したとき、人々[ひとびと]は彼[かれ]に告[つ]げて言[い]った。「見[み]よ、ダビデはエン・ゲディの荒野[こうや]にいる。」"
  3: "サウルはイスラエル全体[ぜんたい]から選[えら]ばれた者[もの]三千人[さんぜんにん]を引[ひ]き連[つ]れて、ダビデとその部下[ぶか]たちを、かもしかの岩[いわ]のあたりで探[さが]そうとして出[で]かけた。"
  4: "道[みち]ぞいの羊[ひつじ]の群[む]れのところへ来[き]ると、そこに洞窟[どうくつ]があった。サウルは用[よう]を足[た]すためにその中へ入[はい]った。ダビデとその部下[ぶか]たちは洞窟の奥[おく]に座[すわ]っていた。"
  5: "ダビデの部下[ぶか]たちは彼[かれ]に言[い]った。「見[み]よ、これは、主[しゅ]があなたに『あなたの敵[てき]をあなたの手[て]に渡[わた]す。あなたは彼に、あなたの目[め]に良[よ]いと思[おも]うことをするがよい』と言われた日[ひ]である。」ダビデは立[た]って、サウルの上着[うわぎ]の裾[すそ]をこっそり切[き]り取[と]った。"
  6: "その後[あと]、ダビデは、サウルの上着[うわぎ]の裾[すそ]を切[き]ったことで、心[こころ]が痛[いた]んだ。"
  7: "ダビデは部下[ぶか]たちに言[い]った。「主[しゅ]がわたしに、そのようなことをさせるはずがない。わたしの主人[しゅじん]、主の油[あぶら]を注[そそ]がれた者[もの]に手[て]をかけてはならない。この人[ひと]は主の油を注がれた者だからだ。」"
  8: "ダビデは言葉[ことば]をもって部下[ぶか]たちを説[と]き伏[ふ]せ、サウルを殺[ころ]そうと立[た]つことを許[ゆる]さなかった。サウルは立って、道[みち]へ下[くだ]った。"
  9: "ダビデもまた、後[あと]から洞窟[どうくつ]を出[で]て立[た]ち、サウルの後に向[む]かって叫[さけ]んで言[い]った。「わが主人[しゅじん]よ、王[おう]よ。」サウルは後[うし]ろを振[ふ]り向き、ダビデは顔[かお]を地[ち]につけて彼[かれ]を拝[おが]んだ。"
  10: "ダビデはサウルに言[い]った。「なぜ、あなたは『見[み]よ、ダビデがあなたの命[いのち]を求[もと]めている』と言う人々[ひとびと]の言葉[ことば]を聞[き]くのか。"
  11: "見[み]よ、今日[きょう]、あなたの目[め]は、主[しゅ]が今日あなたを洞窟[どうくつ]の中[なか]でわたしの手[て]に渡[わた]されたのを見た。わたしはあなたを殺[ころ]すことを望[のぞ]まず、あなたを惜[お]しんで言[い]った。『わたしの主人[しゅじん]に手をかけはしない。この人[ひと]は主の油[あぶら]を注[そそ]がれた者[もの]だから』と。"
  12: "そして、見[み]よ、あなたの上着[うわぎ]の裾[すそ]がわたしの手[て]にある。わたしは裾を切[き]ったが、あなたを殺[ころ]さなかった。今日[きょう]、知[し]って見なさい。わたしの手に悪[あく]も、不敬[ふけい]も、背[そむ]きもなく、わたしはあなたに罪[つみ]を犯[おか]していない。それなのに、あなたはわたしの命[いのち]を縛[しば]って取[と]ろうとしている。"
  13: "主[しゅ]がわたしとあなたの間[あいだ]を裁[さば]き、主があなたから、わたしのために報[むく]いてくださるように。しかし、わたしの手[て]はあなたに及[およ]ばない。"
  14: "古[ふる]いことわざにもあるとおりだ。『不法[ふほう]な者[もの]から不法が出[で]る』。わたしの手[て]はあなたに及[およ]ばない。"
  15: "そして今[いま]、イスラエルの王[おう]よ、あなたはだれの後[あと]を追[お]って出[で]て来[き]たのか。だれを追いかけているのか。死[し]んだ犬[いぬ]、一匹[いっぴき]のノミではないか。"
  16: "主[しゅ]がわたしとあなたの間[あいだ]の裁[さば]き手[て]となり、裁く方[かた]となってくださるように。主が見[み]て、わたしの裁きを裁き、あなたの手からわたしを弁護[べんご]してくださるように。」"
  17: "ダビデがこれらの言葉[ことば]をサウルに語[かた]り終[お]えると、サウルは言[い]った。「ダビデ、わが子[こ]よ、これはあなたの声[こえ]か。」サウルは声を上[あ]げて泣[な]いた。"
  18: "サウルはダビデに言[い]った。「あなたはわたしよりも正[ただ]しい。あなたはわたしに善[ぜん]をもって報[むく]いたが、わたしはあなたに悪[あく]をもって報いた。"
  19: "あなたは今日[きょう]、わたしにしてくれた善[ぜん]を告[つ]げた。主[しゅ]がわたしをあなたの手[て]に閉[と]じ込[こ]めたのに、あなたはわたしを殺[ころ]さなかった。"
  20: "人が自分[じぶん]の敵[てき]を苦[くる]しみの中[なか]で見[み]つけ、良[よ]い道[みち]へ送[おく]り出[だ]すなら、主[しゅ]はその人[ひと]に、今日[きょう]あなたがしたとおりに善[ぜん]を報[むく]いる。"
  21: "そして今[いま]、見[み]よ、わたしは知[し]っている。あなたは必[かなら]ず王[おう]として治[おさ]め、イスラエルの王国[おうこく]はあなたの手[て]に堅[かた]く立[た]つ。"
  22: "そして今[いま]、主[しゅ]によってわたしに誓[ちか]ってくれ。あなたはわたしの後[あと]の子孫[しそん]を断[た]ち滅[ほろ]ぼさず、わたしの名[な]を父[ちち]の家[いえ]から消[け]さない、と。」"
  23: "ダビデはサウルに誓[ちか]った。サウルは自分[じぶん]の場所[ばしょ]へ帰[かえ]り、ダビデとその部下[ぶか]たちはメサラの狭[せま]い谷[たに]へ上[のぼ]った。"
notes:
  1: "ἀνέβη ἐκεῖθεν — взошёл оттуда. ἐκάθισεν — сел, поселился (καθίζω). ἐν τοῖς στενοῖς Εγγαδδι — «в теснинах Ен-Гадди» (στενά — теснина, ущелье; слав. «во узинах енгадди», ru «в безопасных местах» — иное понимание)."
  2: "ἐγενήθη ὡς — «и было, когда» (семитский оборот). ἀνέστρεψεν ἀπὸ ὄπισθεν τῶν ἀλλοφύλων — «возвратился из-за спины филистимлян», т. е. оставив преследование (ἀναστρέφω). ἀπηγγέλη αὐτῷ λεγόντων — безличное «возвещено было ему говорящих» (слав. «возвестиша ему, глаголюще»), поэтому в тексте 「…」 как содержание вести."
  3: "ἔλαβεν μεθ᾽ ἑαυτοῦ — «взял с собою», отсюда 引き連れて. ἐκλεκτούς — отборных. ἐπὶ πρόσωπον Σαδαιεμ — «к лицу Садаием»: транслитерация евр. «скалы серн» (צורי היעלים), поэтому передан смысл — かもしかの岩; слав. «прямо лицу саддеем», ru «по горам, где живут серны». ζητεῖν — искать."
  4: "ἀγέλαι τῶν ποιμνίων — стада овец (ἀγέλη). ἐπὶ τῆς ὁδοῦ — при дороге. παρασκευάσασθαι — «приготовиться», эвфемизм: справить нужду (слав. «испразднитися»). ἐσώτερον τοῦ σπηλαίου — «во внутренней части пещеры», в глубине (слав. «во внутренних вертепа»)."
  5: "ἡ ἡμέρα αὕτη, ἣν εἶπεν κύριος πρὸς σέ — «этот день, о котором сказал Господь тебе». παραδοῦναι — предать. ὡς ἀγαθὸν ἐν ὀφθαλμοῖς σου — «как добро в глазах твоих». πτερύγιον τῆς διπλοΐδος — «крылышко (край) двойной одежды»: πτερύγιον — уменьшительное от πτέρυξ, край, кисть; слав. «воскрилие»; διπλοΐς — верхняя двойная одежда, мантия. λαθραίως — тайком."
  6: "ἐπάταξεν καρδία Δαυιδ αὐτόν — «поразило сердце Давида его», т. е. совесть уязвила (πατάσσω; слав. «вострепета давиду сердце»), поэтому 心が痛んだ, а не 心を打たれた (последнее по-японски значит «быть тронутым»). ὅτι ἀφεῖλεν — что отнял, отрезал (ἀφαιρέω)."
  7: "Μηδαμῶς μοι παρὰ κυρίου — «ни в коем случае мне от Господа», клятвенная формула отказа. εἰ ποιήσω — «если сделаю» (условная форма вместо отрицания). ἐπενέγκαι χεῖρά μου ἐπ᾽ αὐτόν — «нанести руку мою на него». χριστὸς κυρίου — 主の油を注がれた者, помазанник Господень."
  8: "ἔπεισεν — убедил (πείθω; слав. «увеща»). τοῦ μὴ ἀναστάντας θανατῶσαι — «чтобы не восстав убить» (θανατόω). κατέβη εἰς τὴν ὁδόν — «сошёл на дорогу»; в ru добавлено «из пещеры» — в gr этого нет."
  9: "ἀνέστη ὀπίσω αὐτοῦ ἐκ τοῦ σπηλαίου — «встал за ним из пещеры». ἐβόησεν ὀπίσω Σαουλ — «закричал вслед Саулу» (βοάω). Κύριε βασιλεῦ — «господин мой, царь» (звательный; передано わが主人よ、王よ, чтобы 主 оставалось именем Бога). ἔκυψεν ἐπὶ πρόσωπον αὐτοῦ ἐπὶ τὴν γῆν — «склонился лицом своим до земли» (κύπτω). προσεκύνησεν — поклонился."
  10: "Ἵνα τί — «к чему, зачем». ἀκούεις τῶν λόγων τοῦ λαοῦ — слушаешь слова народа. ζητεῖ τὴν ψυχήν σου — «ищет души твоей», т. е. жизни (ψυχή здесь — жизнь); в ru содержание передано иначе («умышляет зло»)."
  11: "ἑοράκασιν οἱ ὀφθαλμοί σου — «видели глаза твои» (перфект ὁράω). παρέδωκέν σε κύριος — предал тебя Господь. οὐκ ἠβουλήθην — не захотел (βούλομαι). ἐφεισάμην σου — пощадил (φείδομαι; слав. «пощадех тя»). В ru вставлено «мне говорили, чтоб убить тебя» — по МТ, в LXX этого нет."
  12: "ἀφῄρηκα — отрезал (перфект ἀφαιρέω). ἀθέτησις — «отвержение, нарушение» (слав. «презорство», ru «коварство» — и передача смысла). οὐχ ἡμάρτηκα εἰς σέ — не согрешил против тебя. δεσμεύεις τὴν ψυχήν μου λαβεῖν αὐτήν — «связываешь (уловляешь) душу мою, чтобы взять её» (δεσμεύω). В ru стих начинается «Отец мой!» — масоретское добавление, в LXX его нет."
  13: "δικάσαι κύριος ἀνὰ μέσον ἐμοῦ καὶ σοῦ — «да рассудит Господь между мною и тобою» (δικάζω). ἐκδικήσαι με κύριος ἐκ σοῦ — «да отмстит мне Господь от тебя» (ἐκδικέω); слав. «да защитит мя Господь от тебе» — понято иначе."
  14: "καθὼς λέγεται ἡ παραβολὴ ἡ ἀρχαία — «как говорится в древней притче» (παραβολή здесь — поговорка, пословица). Ἐξ ἀνόμων ἐξελεύσεται πλημμέλεια — «от беззаконных изойдёт преступление» (πλημμέλεια — проступок; слав. «преступление»). Повтор «рука моя не будет на тебе» в гр стоит дважды (13 и 14) — сохранён."
  15: "ὀπίσω τίνος — за кем. ἐκπορεύῃ — выходишь. κυνὸς τεθνηκότος — «мёртвого пса» (κύων). ψύλλου ἑνός — «одной блохи» (ψύλλος); в тексте ノミ катаканой — слово редкое в кандзи и в корпусе не встречается."
  16: "γένοιτο κύριος εἰς κριτὴν καὶ δικαστήν — «да будет Господь в судью и судию» (κριτής, δικαστής). ἴδοι — «да увидит» (оптатив ὁράω). κρίναι τὴν κρίσιν μου — «рассудить тяжбу мою». δικάσαι μοι ἐκ χειρός σου — «оправдать меня от руки твоей»; слав. «да осудит мя от руки твоея» — иное понимание."
  17: "συνετέλεσεν — окончил (συντελέω). Ἦ φωνή σου αὕτη — «твой ли этот голос?» (ἦ — вопросительная частица). τέκνον — «чадо, сын». ἦρεν τὴν φωνὴν αὐτοῦ — «возвысил голос свой» (αἴρω). ἔκλαυσεν — плакал."
  18: "Δίκαιος σὺ ὑπὲρ ἐμέ — «праведен ты более меня». ἀνταπέδωκάς μοι ἀγαθά — воздал мне доброе. ἐγὼ δὲ ἀνταπέδωκά σοι κακά — а я воздал тебе злое (ἀνταποδίδωμι)."
  19: "ἀπήγγειλάς μοι — возвестил мне. ἀπέκλεισέν με κύριος εἰς χεῖράς σου — «заключил меня Господь в руки твои» (ἀποκλείω). οὐκ ἀπέκτεινάς με — не убил меня."
  20: "εἰ εὕροιτό τις τὸν ἐχθρὸν αὐτοῦ ἐν θλίψει — «если кто найдёт врага своего в скорби» (εὑρίσκω, θλῖψις). ἐκπέμψαι αὐτὸν ἐν ὁδῷ ἀγαθῇ — «отпустить его в добрый путь» (ἐκπέμπω). Конструкция с оптативом и инфинитивом не завершена (анаколуф); по смыслу это риторический вопрос — так в ru («Кто, найдя врага своего, отпустил бы его?»), в тексте сохранена условная форма. ἀνταποτείσει — воздаст (ἀνταποτίνω)."
  21: "βασιλεύων βασιλεύσεις — «царствуя воцаришься», гебраизм, усилительная конструкция (слав. «царюя царствовати имаши»). στήσεται ἐν χερσίν σου — «встанет в руках твоих», утвердится."
  22: "ὄμοσόν μοι ἐν κυρίῳ — поклянись мне Господом. ἐξολεθρεύσεις — истребишь (ἐξολοθρεύω). σπέρμα — семя, потомство. ἀφανιεῖς — уничтожишь (ἀφανίζω)."
  23: "ὤμοσεν — поклялся (ὀμνύω). ἀπῆλθεν εἰς τὸν τόπον αὐτοῦ — пошёл в место своё. εἰς τὴν Μεσσαρα στενήν — «в теснину Мессара» (Μεσσαρα — транслитерация, στενή — теснина); слав. «в мессеру тесную», ru «в место укрепленное»."
