# jp-box, 1-я Царств, глава 24. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет,
# jp-ni (под авторским правом) не использовался.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 24: Давид в Ен-Гадди (1–2); Саул входит в пещеру, отрезанный край одежды
# и укор совести (3–6); «не подниму руки на помазанника Господня» (7–8); речь
# Давида со скалы (9–16); раскаяние Саула и клятва (17–22); расставание (23).
# Речь персонажей — 「…」 (5, 7, 9, 10–16, 17, 18–22); вложенная речь — 『…』
# (5 — слово Господа, 11 — свои слова Давида, 14 — древняя поговорка).
# Непрерывная речь Давида 10–16 и речь Саула 18–22 не закрываются на границах
# стихов, как в греческом.
# Красного нет.
# Нумерация по gr: 23 стиха, совпадает с csl/ru.
# 〔…〕 нет: в gr-lxx-byz на месте каждого стиха есть текст, знака «.» нет;
# добавлений церковного чтения в текст не вносилось (слав. вставки — в notes).
# Сносок ⟨…⟩ нет: 洞窟, 上着, 油を注がれた者, 荒野, 裁き уже в корпусе.
# jp-ni не использовался.

