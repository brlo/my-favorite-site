verses:
  1: "主[しゅ]がバビロンとカルデア人[じん]の地[ち]について、預言者[よげんしゃ]エレミヤによって語[かた]られた言葉[ことば]。"
  2: "「諸国[しょこく]に告[つ]げ、それを聞[き]かせよ。旗[はた]を上[あ]げ、呼[よ]ばわり、隠[かく]すな。言[い]え。『バビロンは捕[と]らえられた。ベルは辱[はずかし]められ、メロダクは打[う]ち負[ま]かされ、その彫[ほ]り物[もの]は辱められ、その偶像[ぐうぞう]は砕[くだ]かれた』と。"
  3: "北[きた]から一[ひと]つの民[たみ]がバビロンに上[のぼ]って来[き]たからである。それはその地[ち]を荒[あ]れ果[は]てたものとし、そこには人[ひと]も家畜[かちく]も住[す]まなくなる。彼らは動[うご]き、去[さ]った。"
  4: "その日[ひ]、その時[とき]に――主[しゅ]は言[い]われる――イスラエルの子[こ]らは、彼らもユダの子らも共[とも]に来[く]る。彼らは泣[な]きながら歩[ある]き、主なる神[かみ]を求[もと]める。"
  5: "彼らはシオンへの道[みち]を尋[たず]ね、そこへ顔[かお]を向[む]ける。彼らは来[き]て主なる神に身[み]を寄[よ]せる。永遠[えいえん]の契約[けいやく]は忘[わす]れられないからである。"
  6: "わたしの民[たみ]は失[うしな]われた羊[ひつじ]となった。その牧者[ぼくしゃ]たちが彼らを追[お]い出[だ]し、山々[やまやま]で迷[まよ]わせた。彼らは山から丘[おか]へとさまよい、寝床[ねどこ]を忘れた。"
  7: "すべて彼[かれ]らを見[み]つける者[もの]は彼らを食[く]い尽[つ]くし、その敵[てき]は言[い]った。『彼らを赦[ゆる]してはならない。彼らは主[しゅ]に、すなわち義[ぎ]の牧[まき]場[ば]に、その父祖[ふそ]を集[あつ]められた主に罪[つみ]を犯[おか]したのだから』と。"
  8: "バビロンの中[なか]から離[はな]れよ。カルデア人[じん]の地[ち]から出[で]て行[い]け。群[む]れの羊[ひつじ]の前[まえ]を行[ゆ]く雄山羊[おやぎ]のようになれ。"
  9: "見[み]よ、わたしは北[きた]の地[ち]から諸国[しょこく]の集[つど]いをバビロンに起[お]こして来[こ]させる。彼らはバビロンに向[む]かって陣[じん]を敷[し]く。そこからバビロンは捕[と]らえられる。熟練[じゅくれん]した戦士[せんし]の矢[や]はむなしく戻[もど]らないからである。"
  10: "カルデアは略奪[りゃくだつ]の的[まと]となり、それを略奪する者[もの]はみな満[み]ち足[た]りる――主[しゅ]は言[い]われる。"
  11: "わたしの嗣業[しぎょう]を奪[うば]って喜[よろこ]び、誇[ほこ]り高[たか]ぶる者[もの]たちよ。あなたがたは草[くさ]の上[うえ]の子牛[こうし]のように跳[は]ね、雄牛[おうし]のように角[つの]を突[つ]き上[あ]げた。"
  12: "あなたがたの母[はは]はひどく辱[はずかし]められ、あなたがたを生[う]んだ者[もの]は恥[はじ]を見[み]る。見よ、彼女[かのじょ]は諸国民[しょこくみん]の末[すえ]となり、荒[あ]れ果て、通[とお]り過[す]ぎることもできず、乾[かわ]ききった野[の]となる。"
  13: "主[しゅ]の怒[いか]りのゆえに、そこは住[す]む者[もの]のない所[ところ]となり、全[まった]く荒[あ]れ果てる。バビロンを過[よ]ぎる者[もの]はみな、そのすべての災[わざわ]いを見て驚[おどろ]き、嘲[あざけ]って口笛[くちぶえ]を吹[ふ]く。"
  14: "バビロンに向[む]かって四方[しほう]に陣[じん]を敷[し]け。弓[ゆみ]を引[ひ]く者[もの]はみな、バビロンを射[い]よ。矢[や]を惜[お]しむな。バビロンは主[しゅ]の前[まえ]に罪[つみ]を犯[おか]したからである。"
  15: "バビロンに向かって叫[さけ]び声[ごえ]を上[あ]げよ。その手[て]は弱[よわ]り、その胸壁[きょうへき]は倒[たお]れ、その城壁[じょうへき]は打[う]ち壊[こわ]された。これは主の復讐[ふくしゅう]である。バビロンに復讐せよ。バビロンがしたとおりに、バビロンにせよ。"
  16: "バビロンから種[たね]を根[ね]こそぎ絶[た]やせ。刈[か]り入[い]れの時[とき]に鎌[かま]を握[にぎ]る者[もの]も、ともに絶やせ。ギリシアの剣[つるぎ]のゆえに、それぞれが自分[じぶん]の民[たみ]のもとへ帰[かえ]り、それぞれが自分の地[ち]へ逃[に]げる。"
  17: "イスラエルは迷[まよ]い出[で]た羊[ひつじ]、獅子[しし]たちがこれを追[お]い払[はら]った。初[はじ]めにこれを食[く]ったのはアッシリアの王[おう]であり、後[のち]にはバビロンの王ネブカドネツァルがその骨[ほね]をかじった。"
  18: "それゆえ、全能者[ぜんのうしゃ]である主[しゅ]、イスラエルの神[かみ]はこう言[い]われる。見[み]よ、わたしはバビロンの王[おう]とその地[ち]を罰[ばっ]する。アッシリアの王を罰したように。"
  19: "わたしはイスラエルをその牧[まき]場[ば]に帰[かえ]らせる。彼はカルメルとバシャンで草[くさ]を食[は]み、その魂[たましい]はエフライムの山[やま]とガラデで満[み]ち足[た]りる。"
  20: "その日[ひ]、その時[とき]に、人々[ひとびと]はイスラエルの不義[ふぎ]を捜[さが]すが、それはなく、ユダの罪[つみ]を捜すが、それは見[み]つからない。わたしはこの地[ち]に残[のこ]された者[もの]たちを赦[ゆる]すからである、と主[しゅ]は言[い]われる。"
  21: "剣[つるぎ]よ、その地[ち]とそこに住[す]む者[もの]に向[む]かって、激[はげ]しく上[のぼ]れ。復讐[ふくしゅう]し、滅[ほろ]ぼせ、と主[しゅ]は言[い]われる。わたしがあなたに命[めい]じたすべてを行[おこな]え。"
  22: "カルデア人[じん]の地[ち]に戦[いくさ]の声[こえ]と大[おお]いなる破壊[はかい]がある。"
  23: "全[ぜん]地[ち]の鎚[つち]は、どうして打[う]ち砕[くだ]かれ、砕[くだ]かれたのか。バビロンは、どうして諸国民[しょこくみん]の間[あいだ]で荒[あ]れ果[は]てたものとなったのか。"
  24: "バビロンよ、人々[ひとびと]はあなたに迫[せま]り、あなたは捕[と]らえられ、しかもそれが分[わ]からない。あなたは見[み]つけられ、捕らえられた。主[しゅ]に逆[さか]らったからである。"
  25: "主[しゅ]はご自分[じぶん]の宝[たから]を開[ひら]き、その怒[いか]りの器[うつわ]を取[と]り出[だ]された。全能者[ぜんのうしゃ]である主[しゅ]なる神[かみ]がカルデア人[じん]の地[ち]でなすべき業[わざ]があるからである。"
  26: "その時[とき]が来[き]たからである。バビロンの蔵[くら]を開[ひら]き、それを洞窟[どうくつ]のように探[さぐ]り、根[ね]こそぎ滅[ほろ]ぼせ。その残[のこ]りが何[なに]も残[のこ]らないようにせよ。"
  27: "そのすべとの実[み]を干[ひ]からせ、屠[ほふ]り場[ば]へ下[くだ]らせよ。彼らに災[わざわ]いあれ。彼らの日[ひ]と、その罰[ばつ]の時[とき]が来[き]たからである。"
  28: "バビロンの地[ち]から逃[に]げ、逃[のが]れ出[で]る者[もの]の声[こえ]がある。それは、主[しゅ]なるわれわれの神[かみ]の復讐[ふくしゅう]、その神殿[しんでん]のための復讐をシオンに告[つ]げるためである。"
  29: "多[おお]くの者[もの]にバビロンへの告[つ]げを伝[つた]えよ。弓[ゆみ]を引[ひ]くすべての者[もの]に。バビロンの周[まわ]りに陣[じん]を敷[し]け。一人[ひとり]も逃[のが]れるな。その業[わざ]に応[おう]じてバビロンに報[むく]いよ。バビロンがしたすべてに応じて、そのとおりにバビロンにせよ。バビロンはイスラエルの聖[せい]なる神[かみ]である主[しゅ]に逆[さか]らったからである。"
  30: "それゆえ、その若者[わかもの]たちはその広場[ひろば]で倒[たお]れ、そのすべとの戦士[せんし]たちはその日[ひ]に倒れる、と主[しゅ]は言[い]われる。"
  31: "見[み]よ、傲慢[ごうまん]な者[もの]よ、わたしはあなたを罰[ばっ]する、と全能者[ぜんのうしゃ]である主[しゅ]は言[い]われる。あなたの日[ひ]、あなたを罰する時[とき]が来[き]たからである。"
  32: "傲慢[ごうまん]はよろめき、倒[たお]れ、それを起[お]こす者[もの]はない。わたしはその森[もり]に火[ひ]を点[つ]け、その周[まわ]りをすべべて焼[や]き尽[つ]くす。"
  33: "全能者[ぜんのうしゃ]である主[しゅ]はこう言[い]われる。イスラエルの子[こ]らとユダの子らは共[とも]に虐[しいた]げられている。彼らを捕[と]らえた者[もの]はみな、彼らを奴隷[どれい]とした。彼らを去[さ]らせようとはしない。"
  34: "しかし、彼らの贖[あがな]い主[ぬし]は強[つよ]く、その名[な]は全能者[ぜんのうしゃ]である主[しゅ]。主は彼らの訴[うった]えを弁護[べんご]し、地[ち]を救[すく]い出[だ]し、バビロンに住[す]む者[もの]たちを震[ふる]え上[あ]がらせる。"
  35: "カルデア人[じん]に、バビロンに住[す]む者[もの]に、その高官[こうかん]たちに、その知者[ちしゃ]たちに、――主[しゅ]は言[い]われる――剣[つるぎ]がある。"
  36: "その占[うらな]い師[し]たちに剣[つるぎ]があり、彼らは愚[おろ]かになる。その強[つよ]い者[もの]たちに剣があり、彼らは弱[よわ]る。"
  37: "その馬[うま]に、その戦車[せんしゃ]に剣[つるぎ]がある。その戦士[せんし]たちに、その中[なか]に混[ま]じる寄[よ]せ集[あつ]めの者[もの]たちに剣があり、彼らは女[おんな]のようになる。その宝[たから]に剣があり、それらは奪[うば]い去[さ]られる。"
  38: "その水[みず]に剣[つるぎ]があり、彼らは辱[はずかし]められる。これは彫[ほ]り物[もの]の地[ち]であり、島々[しまじま]で彼らは誇[ほこ]っていたからである。"
  39: "それゆえ、島々[しまじま]には野[の]の幻[まぼろし]が住[す]みつき、そこには人魚[にんぎょ]たちの娘[むすめ]が住む。そこはもはや、永久[えいきゅう]に住[す]む者[もの]のない所となり、代々[よよ]にわたって建[た]て直[なお]されることもない。"
  40: "神[かみ]がソドムとゴモラとその近隣[きんりん]の町々[まちまち]を覆[くつがえ]したように、と主[しゅ]は言[い]われる。ここには人[ひと]も住[す]まず、人[ひと]の子[こ]もここに滞在[たいざい]しない。"
  41: "見[み]よ、北[きた]から民[たみ]が来[く]る。大[おお]いなる国民[こくみん]と多[おお]くの王[おう]たちが地[ち]の果[は]てから起[お]こされる。"
  42: "彼らは弓[ゆみ]と投[な]げ槍[やり]を手[て]にしている。彼らは残酷[ざんこく]で、あわれみをかけない。その声[こえ]は海[うみ]のように響[ひび]く。彼らは馬[うま]に乗[の]り、火[ひ]のように戦[いくさ]の備[そな]えをして、バビロンの娘[むすめ]よ、あなたと戦[たたか]うために来[く]る。"
  43: "バビロンの王[おう]は彼らのうわさを聞[き]いて、その手[て]を弱[よわ]らせた。苦[くる]しみが彼を捕[と]らえ、子[こ]を産[う]む女[おんな]のような産[さん]みの苦しみが。"
  44: "見[み]よ、彼[かれ]はヨルダン[がわ]から、アイタムの地[ち]へ向[む]かって上[のぼ]る獅子[しし]のように来[く]る。わたしは彼らをその地[ち]からたちまち追[お]い出[だ]し、選[えら]ばれた者[もの]をその上[うえ]に立[た]てる。だれがわたしに似[に]ているのか。だれがわたしと争[あらそ]えるのか。だれが、わたしの前[まえ]に立[た]てる牧者[ぼくしゃ]なのか。"
  45: "それゆえ、バビロンについて主[しゅ]が定[さだ]めた計[はか]りと、カルデア人[じん]の住[す]む者[もの]について思[おも]い巡[めぐ]らした考[かんが]えを聞[き]け。群[む]れの小[ちい]さな羊[ひつじ]たちが彼らを引[ひ]きずり出[だ]す。彼らの牧[まき]場[ば]は彼らと共[とも]に荒[あ]らされる。"
  46: "バビロンが捕[と]らえられる声[こえ]によって地[ち]は揺[ゆ]れ動[うご]き、その叫[さけ]びは諸国民[しょこくみん]の間[あいだ]に聞[き]こえる。」"

notes:
  1: "Λόγος κυρίου, ὃν ἐλάλησεν ἐπὶ Βαβυλῶνα — «Слово Господне, которое изрёк [он] на Вавилон»: надписание, вне кавычек. Слав. добавляет «и на землю халдейскую иеремиею пророком» — нет в LXX, внесено в текст без 〔…〕. Глава соответствует слав./ru 50; gr 27:N = слав. 50:N."
  2: "Ἀναγγείλατε ἐν τοῖς ἔθνεσιν — «возвестите среди народов»: обращение Господа к глашатаям, с него открывается сплошная цитата 27:2–46. Слав. добавляет «воздвигните знамение» (旗を上げ) — нет в LXX, внесено без 〔…〕. εἴπατε Ἑάλωκεν Βαβυλών — «скажите: взят Вавилон»: вложенная речь-возглас, поэтому 『…』. κατῃσχύνθη Βῆλος ἡ ἀπτόητος — «посрамлён Бел неодолимый» (ベル); ἡ τρυφερὰ παρεδόθη Μαρωδαχ — «изнеженная предана Меродаху» (тёмное место LXX); слав. читает «победися меродах» — понято как поражение Меродаха, в тексте по csl."
  3: "ὅτι ἀνέβη ἐπ᾿ αὐτὴν ἔθνος ἀπὸ βορρᾶ — «ибо поднялся на неё народ с севера». θήσει τὴν γῆν αὐτῆς εἰς ἀφανισμόν — «обратит землю её в запустение»; οὐκ ἔσται ὁ κατοικῶν ἐν αὐτῇ ἀπὸ ἀνθρώπου καὶ ἕως κτήνους — «не будет живущего в ней от человека до скота». Слав. добавляет «подвигнушася, отидоша» (彼らは動き、去った) — нет в LXX, внесено без 〔…〕."
  4: "ἐν ταῖς ἡμέραις ἐκείναις καὶ ἐν τῷ καιρῷ ἐκείνῳ — «в те дни и в то время»: начало нового отдела о возвращении. ἥξουσιν οἱ υἱοὶ Ισραηλ, αὐτοὶ καὶ οἱ υἱοὶ Ιουδα ἐπὶ τὸ αὐτό — «придут сыны Израиля, они и сыны Иуды вместе»; βαδίζοντες καὶ κλαίοντες πορεύσονται — «идя и плача пойдут»; τὸν κύριον θεὸν αὐτῶν ζητοῦντες — «Господа Бога своего ища». Слав. ставит здесь «глаголет Господь» — нет в LXX, внесено (――主は言われる)."
  5: "ἕως Σιων ἐρωτήσουσιν τὴν ὁδόν — «до Сиона спросят о пути» (ἐρωτάω — спрашивать); ὧδε γὰρ τὸ πρόσωπον αὐτῶν δώσουσιν — «ибо сюда обратят лица свои». καταφεύξονται πρὸς κύριον τὸν θεόν — «прибегут к Господу Богу»; διαθήκη γὰρ αἰώνιος οὐκ ἐπιλησθήσεται — «ибо завет вечный не забудется» (永遠の契約)."
  6: "πρόβατα ἀπολωλότα ἐγενήθη ὁ λαός μου — «стадом погибшим стал народ Мой» (失われた羊). οἱ ποιμένες αὐτῶν ἐξῶσαν αὐτούς — «пастыри их изгнали их» (牧者; ἐξωθέω — выгонять); ἐπὶ τὰ ὄρη ἀπεπλάνησαν αὐτούς — «по горам развели (сбили с пути) их»; ἐξ ὄρους ἐπὶ βουνὸν ᾤχοντο — «с горы на холм уходили» (丘); ἐπελάθοντο κοίτης αὐτῶν — «забыли ложе своё» (寝床)."
  7: "πάντες οἱ εὑρίσκοντες αὐτοὺς κατανάλισκον αὐτούς — «все, находившие их, поедали их». οἱ ἐχθροὶ αὐτῶν εἶπαν Μὴ ἀνῶμεν αὐτούς — «враги их сказали: не пощадим (не оставим) их»: прямая речь врагов, поэтому 『…』; слав. «не пощадим их». ἀνθ᾿ ὧν ἥμαρτον τῷ κυρίῳ νομῇ δικαιοσύνης — «за то, что согрешили Господу, пажити правды» (義の牧場); τῷ συναγαγόντι τοὺς πατέρας αὐτῶν — «Собравшему отцов их»."
  8: "ἀπαλλοτριώθητε ἐκ μέσου Βαβυλῶνος — «отчуждитесь (уйдите) из среды Вавилона»; ἀπὸ γῆς Χαλδαίων ἐξέλθατε — «из земли Халдейской выйдите». γένεσθε ὥσπερ δράκοντες κατὰ πρόσωπον προβάτων — «будьте как драконы (змеи) перед овцами»: LXX δράκοντες, слав. читает «козлища» (雄山羊), так же ru; по паритету в тексте csl, вариант LXX в notes."
  9: "ἰδοὺ ἐγὼ ἐγείρω ἐπὶ Βαβυλῶνα συναγωγὰς ἐθνῶν ἐκ γῆς βορρᾶ — «вот, Я воздвигаю на Вавилон собрания народов от земли северной»; παρατάξονται αὐτῇ — «ополчатся на неё» (陣を敷く). ἐκεῖθεν ἁλώσεται — «оттуда будет взят»; ὡς βολὶς μαχητοῦ συνετοῦ οὐκ ἐπιστρέψει κενή — «как стрела воина искусного, не возвратится пустой» (矢はむなしく戻らない)."
  10: "ἔσται ἡ Χαλδαία εἰς προνομήν — «Халдея будет в добычу (расхищение)» (略奪の的); πάντες οἱ προνομεύοντες αὐτὴν ἐμπλησθήσονται — «все расхищающие её насытятся». Слав. добавляет «глаголет Господь» — нет в LXX, внесено (――主は言われる)."
  11: "ηὐφραίνεσθε καὶ κατεκαυχᾶσθε διαρπάζοντες τὴν κληρονομίαν μου — «вы веселились и величались, расхищая наследие Моё» (嗣業). ἐσκιρτᾶτε ὡς βοίδια ἐν βοτάνῃ — «прыгали, как телицы на траве» (跳ねる); ἐκερατίζετε ὡς ταῦροι — «бодали, как быки» (角を突き上げた)."
  12: "ᾐσχύνθη ἡ μήτηρ ὑμῶν σφόδρα — «посрамлена мать ваша сильно»; μήτηρ ἐπ᾿ ἀγαθὰ ἐσχάτη ἐθνῶν ἔρημος — «мать по благам — последняя из народов, пустыня» (тёмный оборот, оставлен буквально: 諸国民の末). Слав. добавляет «пуста и непроходна и суха» — «непроходна и суха» нет в LXX, внесено без 〔…〕."
  13: "ἀπὸ ὀργῆς κυρίου οὐ κατοικηθήσεται — «от гнева Господня не будет обитаема»; ἔσται εἰς ἀφανισμὸν πᾶσα — «вся будет в запустение». πᾶς ὁ διοδεύων διὰ Βαβυλῶνος σκυθρωπάσει — «всякий проходящий через Вавилон помрачится (изумится)» (驚く); συριοῦσιν ἐπὶ πᾶσαν τὴν πληγὴν αὐτῆς — «посвищут над всякой язвой её» (口笛を吹く)."
  14: "παρατάξασθε ἐπὶ Βαβυλῶνα κύκλῳ — «ополчитесь на Вавилон вокруг»; πάντες τεύνοντες τόξον — «все, натягивающие лук» (弓を引く). τοξεῦσατε ἐπ᾿ αὐτήν — «стреляйте в неё»; μὴ φείσησθε ἐπὶ τοῖς τοξεύμασιν ὑμῶν — «не щадите стрел ваших» (矢を惜しむな). Слав. добавляет «понеже пред Господем согреши» — нет в LXX (в LXX это в 27:15), внесено без 〔…〕."
  15: "κατακροτήσατε ἐπ᾿ αὐτήν — «возопите (ударьте) на неё» (叫び声を上げよ); παρελύθησαν αἱ χεῖρες αὐτῆς — «ослабели руки её»; ἔπεσαν αἱ ἐπάλξεις αὐτῆς — «пали твердыни (зубцы) её» (胸壁); κατεσκάφη τὸ τεῖχος αὐτῆς — «разрушена стена её» (城壁). ἐκδίκησις παρὰ θεοῦ ἐστιν — «отмщение от Бога»; ἐκδικεῖτε ἐπ᾿ αὐτήν — «отмстите ей»; καθὼς ἐποίησεν, ποιήσατε αὐτῇ — «как она сделала, сделайте ей»."
  16: "ἐξολεθρεύσατε σπέρμα ἐκ Βαβυλῶνος — «истребите семя из Вавилона» (根こそぎ絶やせ); κατέχοντα δρέπανον ἐν καιρῷ θερισμοῦ — «держащего серп во время жатвы» (鎌). ἀπὸ προσώπου μαχαίρας Ἑλληνικῆς — «от лица меча эллинского» (ギリシアの剣, ср. 26:16); ἕκαστος εἰς τὸν λαὸν αὐτοῦ ἀποστρέψουσιν — «каждый обратится к народу своему»; εἰς τὴν γῆν αὐτοῦ φεύξεται — «в землю свою убежит»."
  17: "πρόβατον πλανώμενον Ισραηλ — «овца заблудшая Израиль» (迷い出た羊); λέοντες ἐξῶσαν αὐτόν — «львы изгнали его» (獅子). ὁ πρῶτος ἔφαγεν αὐτὸν βασιλεὺς Ασσουρ — «первый съел его царь Ассур» (アッシリア); οὗτος ὕστερον τὰ ὀστᾶ αὐτοῦ βασιλεὺς Βαβυλῶνος — «сей после — кости его царь Вавилонский»; слав. называет его «навуходоносор» — нет в LXX, внесено без 〔…〕."
  18: "διὰ τοῦτο τάδε λέγει κύριος — «посему так говорит Господь»: формула внутри речи (Бог говорит о Себе в 3-м лице). ἰδοὺ ἐγὼ ἐκδικῶ ἐπὶ τὸν βασιλέα Βαβυλῶνος καὶ ἐπὶ τὴν γῆν αὐτοῦ — «вот, Я посещу царя Вавилона и землю его»; καθὼς ἐξεδίκῃσα ἐπὶ τὸν βασιλέα Ασσουρ — «как посетил царя Ассура». Слав. добавляет «вседержитель, Бог израилев» — нет в LXX, внесено без 〔…〕."
  19: "ἀποκαταστήσω τὸν Ισραηλ εἰς τὴν νομὴν αὐτοῦ — «возвращу Израиля на пажить его» (牧場); νεμήσεται ἐν τῷ Καρμήλῳ — «будет пастись на Кармиле»; ἐν ὄρει Εφραιμ καὶ ἐν τῷ Γαλααδ — «на горе Ефремовой и в Галааде»; πλησθήσεται ἡ ψυχὴ αὐτοῦ — «насытится душа его». Слав. вставляет «васане» (バシャン) — нет в LXX, внесено без 〔…〕."
  20: "ζητήσουσιν τὴν ἀδικίαν Ισραηλ, καὶ οὐχ ὑπάρξει — «взыщут неправду Израиля, и не будет»; τὰς ἁμαρτίας Ιουδα, καὶ οὐ μὴ εὑρεθῶσιν — «грехов Иуды, и не найдутся». ὅτι ἵλεως ἔσομαι τοῖς ὑπολελειμμένοις ἐπὶ τῆς γῆς — «ибо милостив буду оставшимся на земле» (赦す); λέγει κύριος — формула внутри речи."
  21: "Πικρῶς ἐπίβηθι ἐπ᾿ αὐτὴν — «горько (жестоко) взойди на неё»: обращение к мечу (μάχαιρα), слав. «на землю владеющих взыди». ἐπὶ τοὺς κατοικοῦντας ἐπ᾿ αὐτήν — «на живущих на ней»; ἐκδίκησον, μάχαιρα, καὶ ἀφάνισον — «отмсти, меч, и истреби»; ποίει κατὰ πάντα ὅσα ἐντέλλομαί σοι — «делай по всему, что Я заповедую тебе»."
  22: "φωνὴ πολέμου — «голос войны» (戦の声); συντριβὴ μεγάλη ἐν γῇ Χαλδαίων — «великое сокрушение в земле Халдейской» (大いなる破壊)."
  23: "πῶς συνεκλάσθη καὶ συνετρίβη ἡ σφῦρα πάσης τῆς γῆς — «как сокрушился и разбился молот всей земли» (σφῦρα — молот, 鎚); πῶς ἐγενήθη εἰς ἀφανισμὸν Βαβυλὼν ἐν ἔθνεσιν — «как стал Вавилон запустением среди народов»."
  24: "ἐπιθήσονταί σοι, καὶ ἁλώσῃ, ὦ Βαβυλών, καὶ οὐ γνώσῃ — «наложат [руки] на тебя, и будешь взят, о Вавилон, и не узнаешь»; εὑρέθης καὶ ἐλήμφθης — «найден и взят»; ὅτι τῷ κυρίῳ ἀντέστης — «ибо Господу воспротивился». Слав. вставляет «яко вавилон еси» — пояснительное, отдельно не переводилось."
  25: "ἤνοιξεν κύριος τὸν θησαυρὸν αὐτοῦ — «открыл Господь сокровищницу Свою» (宝); ἐξήνεγκεν τὰ σκεύη ὀργῆς αὐτοῦ — «вынес сосуды гнева Своего» (器); ὅτι ἔργον τῷ κυρίῳ θεῷ ἐν γῇ Χαλδαίων — «ибо дело Господу Богу в земле Халдейской». Слав. читает «Господу вседержителю» — по паритету внесено (全能者である主なる神)."
  26: "ὅτι ἐληλύθασιν οἱ καιροὶ αὐτῆς — «ибо пришли времена её» (その時が来た); ἀνοίξατε τὰς ἀποθήκας αὐτῆς — «откройте хранилища её» (蔵); ἐρευνήσατε αὐτὴν ὡς σπήλαιον — «обыщите её, как пещеру» (洞窟); ἐξολεθρεύσατε αὐτήν, μὴ γενέσθω αὐτῆς κατάλειμμα — «истребите её, да не будет остатка её»."
  27: "ἀναξηράνατε αὐτῆς πάντας τοὺς καρπούς — «иссушите все плоды её» (実); καταβήτωσαν εἰς σφαγήν — «да сойдут на заклание» (屠り場); οὐαὶ αὐτοῖς — «горе им» (災いあれ); ἥκει ἡ ἡμέρα αὐτῶν καὶ καιρὸς ἐκδικήσεως αὐτῶν — «пришёл день их и время отмщения их»."
  28: "φωνὴ φευγόντων καὶ ἀνασῳζομένων ἐκ γῆς Βαβυλῶνος — «голос бегущих и спасающихся из земли Вавилонской». τοῦ ἀναγγεῖλαι εἰς Σιων τὴν ἐκδίκησιν παρὰ κυρίου θεοῦ ἡμῶν — «чтобы возвестить на Сионе отмщение от Господа Бога нашего». Слав. добавляет «отмщение храма его» (その神殿のための復讐) — нет в LXX, внесено без 〔…〕."
  29: "παραγγείλατε ἐπὶ Βαβυλῶνα πολλοῖς — «возвестите на Вавилон многим»; παντὶ ἐντείνοντι τόξον — «всякому натягивающему лук»; παρεμβάλετε ἐπ᾿ αὐτὴν κυκλόθεν — «обложите её вокруг»; μὴ ἔστω αὐτῆς ἀνασῳζόμενος — «да не будет из неё спасающегося». ἀνταπόδοτε αὐτῇ κατὰ τὰ ἔργα αὐτῆς — «воздайте ей по делам её»; ὅτι πρὸς τὸν κύριον ἀντέστη θεὸν ἅγιον τοῦ Ισραηλ — «ибо восстала против Господа, Святого Израилева»."
  30: "πεσοῦνται οἱ νεανίσκοι αὐτῆς ἐν ταῖς πλατείαις αὐτῆς — «падут юноши её на площадях её» (広場); πάντες οἱ ἄνδρες οἱ πολεμισταὶ αὐτῆς ῥιφήσονται — «все воины её будут повержены» (倒れる); εἶπεν κύριος."
  31: "ἰδοὺ ἐγὼ ἐπὶ σὲ τὴν ὑβρίστριαν — «вот, Я на тебя, наглую (гордую)» (ὑβρίστρια — жен. р., о Вавилоне); λέγει κύριος; ἥκει ἡ ἡμέρα σου καὶ ὁ καιρὸς ἐκδικήσεώς σου — «пришёл день твой и время отмщения твоего». Слав. добавляет «Бог вседержитель» — нет в LXX, внесено без 〔…〕."
  32: "ἀσθενήσει ἡ ὕβρις σου καὶ πεσεῖται — «изнеможет гордыня твоя и падёт» (傲慢); οὐκ ἔσται ὁ ἀνιστῶν αὐτήν — «не будет поднимающего её». ἀνάψω πῦρ ἐν τῷ δρυμῷ αὐτῆς — «зажгу огонь в лесу её» (森); καταφάγεται πάντα τὰ κύκλῳ αὐτῆς — «пожрёт всё вокруг неё»."
  33: "Καταδεδυνάστευνται οἱ υἱοὶ Ισραηλ — «порабощены сыны Израиля» (καταδυναστεύω — угнетать, порабощать; 虐げられている); πάντες οἱ αἰχμαλωτεύσαντες αὐτοὺς κατεδυνάστευσαν αὐτούς — «все пленившие их поработили их»; ὅτι οὐκ ἠθέλησαν ἐξαποστεῖλαι αὐτούς — «ибо не захотели отпустить их» (去らせようとしない)."
  34: "ὁ λυτρούμενος αὐτοὺς ἰσχυρός — «Избавитель их силён» (贖い主); κύριος παντοκράτωρ ὄνομα αὐτῷ — «Господь Вседержитель имя Ему» (全能者である主). κρίσιν κρινεῖ πρὸς τοὺς ἀντιδίκους αὐτοῦ — «суд будет судить с противниками его» (訴えを弁護し); ὅπως ἐξάρῃ τὴν γῆν — «чтобы изъять (успокоить) землю»; слав. читает «да избавит землю» (救い出す) — по паритету csl, вариант LXX в notes; παροξυνεῖ τοῖς κατοικοῦσι Βαβυλῶνα — «раздражит живущих в Вавилоне» (震え上がらせる)."
  35: "μάχαιραν ἐπὶ τοὺς Χαλδαίους — «меч на Халдеев»: анаколуф, ряд винительных без глагола, сохранён. καὶ ἐπὶ τοὺς μεγιστᾶνας αὐτῆς καὶ ἐπὶ τοὺς συνετοὺς αὐτῆς — «и на вельмож её и на мудрых её» (高官, 知者). Слав. добавляет «глаголет Господь» — нет в LXX, внесено (――主は言われる)."
  36: "μάχαιραν ἐπὶ τοὺς μαχητὰς αὐτῆς, καὶ παραλυθήσονται — «меч на воинов её, и расслабеют». Слав. вставляет перед этим «мечь на обаятели его, и буии будут» (占い師, 愚かになる) — нет в LXX, внесено без 〔…〕, поэтому в стихе два меча, как у слав."
  37: "μάχαιραν ἐπὶ τοὺς ἵππους αὐτῶν καὶ ἐπὶ τὰ ἅρματα αὐτῶν — «меч на коней их и на колесницы их» (戦車); ἐπὶ τὸν σύμμικτον τὸν ἐν μέσῳ αὐτῆς — «на смешанный [народ] среди неё» (寄せ集めの者たち); ἔσονται ὡσεὶ γυναῖκες — «будут как женщины»; μάχαιραν ἐπὶ τοὺς θησαυροὺς αὐτῆς, καὶ διασκορπισθήσονται — «меч на сокровища её, и будут рассеяны» (奪い去られる)."
  38: "ἐπὶ τῷ ὕδατι αὐτῆς ἐπεποίθει καὶ καταισχυνθήσονται — «на воду её надеялся и посрамится»; слав. читает «мечь на воды его, и постыдятся» (その水に剣) — по паритету csl, вариант LXX в notes. ὅτι γῆ τῶν γλυπτῶν ἐστιν — «ибо земля изваяний (истуканов)» (彫り物の地); ἐν ταῖς νήσοις, οὗ κατεκαυχῶντο — «и на островах, где они хвалились» (島々で誇っていた)."
  39: "κατοικήσουσιν ἰνδάλματα ἐν ταῖς νήσοις — «поселятся призраки на островах» (ἴνδαλμα — призрак, видение; 野の住みか); κατοικήσουσιν ἐν αὐτῇ θυγατέρες σειρήνων — «поселятся в ней дочери сирен» (人魚たちの娘); οὐ μὴ κατοικηθῇ οὐκέτι εἰς τὸν αἰῶνα — «не будет обитаема вовеки». Слав. добавляет «ниже соградится от рода в род» (代々にわたって建て直されることもない) — нет в LXX, внесено без 〔…〕."
  40: "καθὼς κατέστρεψεν ὁ θεὸς Σοδομα καὶ Γομορρα καὶ τὰς ὁμορούσας αὐταῖς — «как ниспроверг Бог Содом и Гоморру и соседние с ними [города]» (近隣の町々); εἶπεν κύριος. οὐ μὴ κατοικήσῃ ἐκεῖ ἄνθρωπος — «не будет жить там человек»; οὐ μὴ παροικήσῃ ἐκεῖ υἱὸς ἀνθρώπου — «не остановится там сын человеческий» (滞在しない)."
  41: "ἰδοὺ λαὸς ἔρχεται ἀπὸ βορρᾶ — «вот, народ идёт с севера»; ἔθνος μέγα καὶ βασιλεῖς πολλοὶ ἐξεγερθήσονται ἀπ᾿ ἐσχάτου τῆς γῆς — «народ великий и цари многие поднимутся от края земли»."
  42: "τόξον καὶ ἐγχειρίδιον ἔχοντες — «лук и кинжал имеющие» (弓と投げ槍); ἰταμός ἐστιν καὶ οὐ μὴ ἐλεήσῃ — «дерзок и не помилует» (残酷で、あわれみをかけない); φωνὴ αὐτῶν ὡς θάλασσα ἠχήσει — «голос их, как море, зашумит». ἐφ᾿ ἵπποις ἱππάσονται παρεσκευασμένοι ὥσπερ πῦρ εἰς πόλεμον — «на конях понесутся, приготовленные, как огонь, на войну»; πρὸς σέ, θύγατερ Βαβυλῶνος — «против тебя, дочь Вавилона»."
  43: "ἤκουσεν βασιλεὺς Βαβυλῶνος τὴν ἀκοὴν αὐτῶν — «услышал царь Вавилонский весть о них» (うわさ); παρελύθησαν αἱ χεῖρες αὐτοῦ — «ослабели руки его»; θλῖψις κατεκράτησεν αὐτοῦ — «скорбь овладела им» (苦しみ); ὠδῖνες ὡς τικτούσης — «муки, как у рождающей» (産みの苦しみ)."
  44: "ὥσπερ λέων ἀναβήσεται ἀπὸ τοῦ Ιορδάνου εἰς τόπον Αιθαμ — «как лев поднимется от Иордана к месту Аифам» (アイタム); ὅτι ταχέως ἐκδιώξω αὐτοὺς ἀπ᾿ αὐτῆς — «ибо скоро изгоню их от неё» (たちまち追い出す); πάντα νεανίσκον ἐπ᾿ αὐτὴν ἐπιστήσω — «всякого юношу поставлю над ней» (選ばれた者を立てる). τίς ὥσπερ ἐγώ; καὶ τίς ἀντιστήσεταί μοι; — «кто как Я? и кто противостанет Мне?»; τίς οὗτος ποιμήν, ὃς στήσεται κατὰ πρόσωπόν μου — «кто этот пастырь, который станет перед лицом Моим?»."
  45: "ἀκούσατε τὴν βουλὴν κυρίου — «услышьте совет Господень» (計り); ἣν βεβούλευται ἐπὶ Βαβυλῶνα — «который Он определил на Вавилон»; λογισμοὺς αὐτοῦ, οὓς ἐλογίσατο ἐπὶ τοὺς κατοικοῦντας Χαλδαίους — «и помышления Его о живущих в Халдее» (思い巡らした考え). ἐὰν μὴ διαφθαρῇ τὰ ἀρνία τῶν προβάτων αὐτῶν — «если не будут истреблены агнцы овец их»; ἐὰν μὴ ἀφανισθῇ νομὴ ἀπ᾿ αὐτῶν — «если не будет опустошена пажить от них» (小さな羊たちが引きずり出す; 牧場は荒らされる). Слав. добавляет «(вкупе с ними)» — служебная вставка, отдельно не переводилась."
  46: "ἀπὸ φωνῆς ἁλώσεως Βαβυλῶνος σεισθήσεται ἡ γῆ — «от голоса взятия Вавилона потрясётся земля»; κραυγὴ ἐν ἔθνεσιν ἀκουσθήσεται — «вопль среди народов будет слышен». Цитата 27:2–46 закрывается в конце стиха."
