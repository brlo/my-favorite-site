# jp-box, Иеремия, глава 27. Черновик для приёмки.
#
# Нумерация — по славянской и Синодальной Библии (масоретский порядок глав):
# так привычнее читателю. В Септуагинте (gr-lxx-byz) эта глава — 34.
# База: Септуагинта; контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# --- прежние заметки (написаны при нумерации по гр.; номера в них — греческие) ---
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc в книге почти нет (фрагменты гл. 11, 12, 31),
# для этой главы нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 27 = слав./ru 50: оракул о Вавилоне. 1 надписание; 2–3 глашатаям велено
# объявить падение Вавилона; 4–5 возвращение сынов Израиля и Иуды на Сион, вечный
# завет; 6–7 народ Мой — погибшие овцы, враги не щадят их; 8 призыв выйти из среды
# Вавилона; 9–13 войско с севера, «день Господень», опустошение Халдеи; 14–16 стрелы
# и серп, «от лица меча эллинского»; 17–20 Израиль — овца, которую ели львы; Я посещу
# царя Вавилонского, возвращу Израиля на пажить, прощу остаток; 21–27 меч на Халдею,
# сокровищница гнева, «горе им»; 28–33 голос бегущих на Сион, суд над гордыней,
# порабощённые сыны и их Избавитель; 34–38 меч на коней, сокровища, воды; 39–40
# запустение навек, как Содом; 41–44 народ с севера, ужас царя, лев с Иордана;
# 45–46 совет Господень и потрясение земли.
# Голоса: 27:1 — надписание вне кавычек; 27:2–46 — одна цитата 「…」 (сплошное слово
# Господа, как в Ис 47), открывается в 27:2 и закрывается в конце 27:46; вложенная
# речь — 『…』: 27:2 (возглас глашатаев), 27:7 (слова врагов). Внутри цитаты формулы
# «так говорит Господь» / «говорит Господь» остаются в речи (Бог говорит о Себе
# в 3-м лице, как в евр.), они не разрывают цитату.
# Нумерация по gr: 46 стихов; у слав. 50 тоже 46, номера совпадают стих в стих
# (gr 27:N = слав. 50:N). «Точек» в этой главе нет.
# 〔…〕 нет. Слав. добавления внесены в основной текст без скобок и оговорены:
# 27:1 «и на землю халдейскую… иеремиею пророком», 27:2 «воздвигните знамение»,
# 27:3 «подвигнушася, отидоша», 27:4 «глаголет Господь», 27:10 «глаголет Господь»,
# 27:12 «непроходна и суха», 27:14 «понеже пред Господем согреши», 27:17
# «навуходоносор», 27:18 «вседержитель, Бог израилев», 27:19 «васане», 27:25
# «вседержителю», 27:28 «отмщение храма его», 27:31 «Бог вседержитель», 27:35
# «глаголет Господь», 27:36 «на обаятели его», 27:39 «ниже соградится от рода в род».
# 27:8 «козлища» (слав.) против δράκοντες LXX; 27:38 «мечь на воды его» против
# «надеялся на воду свою» LXX — по паритету держим csl, LXX в notes; 27:34
# «избавит землю» (слав.) против ἐξάρῃ «унесёт» LXX.
# Сносок ⟨…⟩ нет: 盾, 弓, 矢, 剣, 戦車, 城壁, 嗣業, 契約, 偶像, 神殿 уже в корпусе.
# Имена — транслитерация греческого (LXX): バビロン, カルデア人, ベル, メロダク,
# アッシリア, ネブカドネツァル, シオン, カルメル, バシャン, エフライム, ガラデ,
# ヨルダン, アイタム.
# 
