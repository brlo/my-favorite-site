verses:
  1: "ヨヤキム、ヨシヤの子[こ]、ユダの王[おう]の治[ち]世[せい]の初[はじ]めに、この言葉[ことば]が主[しゅ]からエレミヤにあった。"
  2: "主[しゅ]はこう言[い]われた。「自分[じぶん]のために綱[つな]と軛[くびき]を作[つく]り、自分の首[くび]に掛[か]けよ。"
  3: "そして、それをエドムの王[おう]、モアブの王、アンモンの子[こ]らたちの王、ツロの王、シドンの王に送[おく]れ。エルサレムのセデキヤ、ユダの王[おう]のもとへ来[き]ている彼らの使者[ししゃ]の手[て]によって。"
  4: "そして、彼らに、その主君[しゅくん]たちにこう言[い]うよう命[めい]じよ。イスラエルの神[かみ]である主[しゅ]はこう言[い]われる。あなたがたは自分[じぶん]の主君[しゅくん]たちにこう言[い]え。"
  5: "わたしは大[おお]いなる力[ちから]と高[たか]く上[あ]げた腕[うで]によって、地[ち]と、地の面[おもて]にいる人[ひと]と家畜[かちく]を造[つく]った。そして、それを、わたしの目[め]にかなう者[もの]のだれにでも与[あた]える。"
  6: "今[いま]、わたしはこのすべての地[ち]を、バビロンの王[おう]ネブカドネツァルの手[て]に与[あた]え、彼に仕[つか]えさせ、野[の]の獣[けもの]たちも彼に仕えさせる。"
  7: "すべての民[たみ]は彼に、その子[こ]に、その孫[まご]に仕[つか]える。彼の地[ち]の時[とき]、彼自身[じしん]の時が来[く]るまで。多[おお]くの民[たみ]と大[おお]きな王[おう]たちが彼に仕える。"
  8: "バビロンの王[おう]の軛[くびき]の下[した]に首[くび]を入[い]れない民[たみ]と国[くに]は、剣[つるぎ]と飢[うえ]でわたしが罰[ばつ]する、と主[しゅ]は言[い]われる。彼の手[て]によってそれが尽[つ]きるまで。"
  9: "あなたがたは、自分[じぶん]たちの偽[ぎ]預言者[よげんしゃ]たち、あなたがたのために占[うらな]う者[もの]たち、夢[ゆめ]を見[み]る者たち、あなたがたの鳥占[とりうら]い、あなたがたの呪術師[じゅじゅつし]たちの言[い]うことを聞[き]くな。彼らは『バビロンの王[おう]に仕[つか]えてはならない』と言[い]っている。"
  10: "彼らはあなたがたに偽[いつわ]りを預言[よげん]し、あなたがたを自分[じぶん]の地[ち]から遠[とお]ざけ、追[お]い出[だ]して滅[ほろ]ぼそうとしているからである。"
  11: "バビロンの王[おう]の軛[くびき]の下[した]に首[くび]を入[い]れて彼に仕[つか]える民[たみ]は、わたしがその地[ち]に残[のこ]す、と主[しゅ]は言[い]われる。彼はそれを耕[たがや]し、そこに住[す]む。」"
  12: "わたしはゼデキヤ、ユダの王[おう]にも、これらすべての言葉[ことば]をもって語[かた]って言[い]った。「あなたがたの首[くび]をバビロンの王[おう]の軛[くびき]の下[した]に入[い]れ、彼とその民[たみ]に仕[つか]えよ。そうすれば生[い]きる。"
  13: "なぜ、あなたとあなたの民[たみ]は、剣[つるぎ]と飢[うえ]と疫病[えきびょう]で死[し]ぬのか。主[しゅ]が、バビロンの王[おう]に仕[つか]えようとしない民[たみ]々[ぐに]について語[かた]られたとおりである。"
  14: "あなたがたに『バビロンの王[おう]に仕[つか]えてはならない』と言[い]う預言者[よげんしゃ]たちの言葉[ことば]を聞[き]くな。"
  15: "彼らはあなたがたに不正[ふせい]に預言[よげん]している。わたしは彼らを遣[つか]わしたのではない、と主[しゅ]は言[い]われる。彼らはわたしの名[な]によって偽[いつわ]りを語[かた]り、あなたがたを滅[ほろ]ぼそうとしている。あなたがたも、あなたがたに偽りを預言するあなたがたの預言者[よげんしゃ]たちも滅びる。」"
  16: "わたしはあなたがたにも、このすべての民[たみ]にも、祭司[さいし]たちにも語[かた]って言[い]った。主[しゅ]はこう言[い]われる。「あなたがたに預言[よげん]する預言者[よげんしゃ]たちの言葉[ことば]を聞[き]くな。彼らは『見[み]よ、主[しゅ]の家[いえ]の器[うつわ]が、間[ま]もなくバビロンから返[かえ]って来[く]る』と言[い]って、あなたがたに偽[いつわ]りを預言している。わたしは彼らを遣[つか]わしていない。"
  17: "彼らの言[い]うことを聞[き]くな。バビロンの王[おう]に仕[つか]えて生[い]きよ。なぜ、この町[まち]を荒[あ]れ果[は]てるままにするのか。"
  18: "もし彼らが預言者[よげんしゃ]であり、彼らの中[なか]に主[しゅ]の言葉[ことば]があるなら、わたしのところに来[き]て願[ねが]うがよい。主[しゅ]の家[いえ]、ユダの王[おう]の家[いえ]、エルサレムに残[のこ]っている器[うつわ]がバビロンへ行[い]かないように。"
  19: "万軍[ばんぐん]の主[しゅ]はこう言[い]われる。すなわち、柱[はしら]と、洗[あら]い盤[ばん]と、台座[だいざ]と、この町[まち]に残[のこ]っているほかの器[うつわ]について。"
  20: "バビロンの王[おう]が、エホヤキンとユダとエルサレムのすべての長老[ちょうろう]たちをエルサレムから移[うつ]したとき、取[と]らなかったものである。"
  21: "万軍[ばんぐん]の主[しゅ]、イスラエルの神[かみ]はこう言[い]われる。主[しゅ]の家[いえ]、ユダの王[おう]の家[いえ]、エルサレムに残[のこ]った器[うつわ]について。"
  22: "それらはバビロンへ運[はこ]ばれ、わたしが訪[おとず]れる日[ひ]までそこにある、と主[しゅ]は言[い]われる。そして、わたしは命[めい]じてそれを運[はこ]び帰[かえ]らせ、この場所[ばしょ]に戻[もど]す。」"

notes:
  1: "«ТОЧКА» В МОДУЛЕ: в gr-lxx-byz стих 34:1 — `.` (в LXX этой строки нет), переведено по слав. 27:1: «В начале царства иоакима сына иосиина, царя иудина, бысть слово сие ко иеремии от Господа глаголя». Царь — Иоаким (ヨヤキム), а не Седекия, о котором речь дальше; надписание относится ко всему блоку 34–35. Слав. «царя иудина» добавлено к греч. подлежащему, но здесь стих целиком по слав."
  2: "Ποίησον δεσμοὺς καὶ κλοιοὺς — «сделай себе узы и ярма (шейные обручи)»: δεσμός — узы, верёвка; κλοιός — ярмо, надеваемое на шею (ср. 27:2); слав. «узы и клады». περίθου περὶ τὸν τράχηλόν σου — «возложи на шею твою» (περιτίθημι — надевать вокруг). Знак пророческий: пророк носит ярмо, как раб."
  3: "ἀποστελεῖς αὐτοὺς πρὸς βασιλέα Ιδουμαίας — «пошлёшь их к царю Идумеи»; далее Моав, сыны Аммона, Тир, Сидон: пять царей, соседи Иуды, собравшиеся в Иерусалиме (вероятно, на переговоры о союзе против Вавилона). ἐν χερσὶν ἀγγέλων αὐτῶν — «через их послов» (ἄγγελος здесь — посол, вестник); τῶν ἐρχομένων εἰς ἀπάντησιν αὐτῶν εἰς Ιερουσαλημ — «приходящих на встречу их в Иерусалим» (ἀπάντησις — встреча); πρὸς Σεδεκιαν — «к Седекии». Слав. «во Иерусалим ко седекии царю иудину»."
  4: "συντάξεις αὐτοῖς — «заповедаешь им» (συντάσσω — приказывать); πρὸς τοὺς κυρίους αὐτῶν — «господам их» (κύριος здесь о земных владыках, поэтому 主君). Двойная формула «так говорит Господь Бог Израилев: так скажите господам вашим» сохранена: первая часть — слова Господа пророку, вторая — что сказать царям."
  5: "ἐν τῇ ἰσχύι μου τῇ μεγάλῃ καὶ ἐν τῷ ἐπιχείρῳ μου τῷ ὑψηλῷ — «великою силою Моею и мышцею Моею высокою» (ἐπίχειρον — рука, мышца; ср. 31:25); слав. «крепостию моею великою и мышцею моею высокою». Слав. добавляет «и человека и скоты» — нет в LXX (греч. только τὴν γῆν), внесено в текст без скобок. ᾧ ἐὰν δόξῃ ἐν ὀφθαλμοῖς μου — «кому будет угодно в очах Моих» (δοκέω — казаться, быть угодным)."
  6: "ἔδωκα τὴν γῆν τῷ Ναβουχοδονοσορ βασιλεῖ Βαβυλῶνος δουλεύειν αὐτῷ — «отдал землю Навуходоносору, царю Вавилонскому, чтобы служила ему» (δουλεύω — служить, быть рабом); τὰ θηρία τοῦ ἀγροῦ ἐργάζεσθαι αὐτῷ — «и зверей полевых — работать ему» (ἐργάζομαι — обрабатывать, работать), слав. «делати ему». Мысль: вся тварь отдана под власть Вавилона."
  7: "«ТОЧКА» В МОДУЛЕ (34:7 — `.`): стих переведён по слав. 27:7: «и послужат ему вси языцы и сыну его и сыну сына его, дондеже приидет время земли его и его самого, и послужат ему мнози народи и царие велицы». То есть царство Вавилона продержится три поколения, до своего часа. В LXX этого стиха в модуле нет; он читается в других свидетелях, поэтому дан церковным текстом, без 〔…〕."
  8: "τὸ ἔθνος καὶ ἡ βασιλεία, ὅσοι ἐὰν μὴ ἐμβάλωσιν τὸν τράχηλον αὐτῶν ὑπὸ τὸν ζυγὸν — «народ и царство, которые не вложат шеи свои под ярмо» (ἐμβάλλω — вкладывать; ζυγόν — ярмо); ἐν μαχαίρᾳ καὶ ἐν λιμῷ ἐπισκέψομαι αὐτούς — «мечом и голодом посещу их» (ἐπισκέπτομαι — посещать, карать); ἕως ἐκλίπωσιν ἐν χειρὶ αὐτοῦ — «доколе не исчезнут от руки его» (ἐκλείπω — иссякать). Слав. удваивает условие («елицы аще не поработают… и елицы не вдежут выи»); в тексте по греч. одному."
  9: "μὴ ἀκούετε τῶν ψευδοπροφητῶν ὑμῶν — «не слушайте ваших лжепророков»; τῶν μαντευομένων ὑμῖν — «гадающих (волхвующих) вам» (μαντεύομαι — прорицать, гадать); τῶν ἐνυπνιαζομένων ὑμῖν — «сновидцев ваших» (ἐνυπνιάζομαι — видеть сны); τῶν οἰωνισμάτων ὑμῶν — «птицегаданий ваших» (οἰώνισμα — примета по птицам); τῶν φαρμακῶν ὑμῶν — «чародеев ваших» (φαρμακός — колдун, отравитель), слав. «обаятелей». Слова лжепророков — 『…』."
  10: "ψευδῆ αὐτοὶ προφητεύουσιν ὑμῖν — «ложь они пророчествуют вам» (ψευδῆ — ложное, наречно); πρὸς τὸ μακρῦναι ὑμᾶς ἀπὸ τῆς γῆς ὑμῶν — «чтобы удалить вас от земли вашей». Слав. добавляет «извергнути вас и еже погибнути вам» — нет в LXX, внесено в текст без скобок (追い出して滅ぼそうとしている)."
  11: "τὸ ἔθνος, ὃ ἐὰν εἰσαγάγῃ τὸν τράχηλον αὐτοῦ ὑπὸ τὸν ζυγὸν… καὶ ἐργάσηται αὐτῷ — «народ, который вложит шею свою под ярмо… и будет работать ему»; καταλείψω αὐτὸν ἐπὶ τῆς γῆς αὐτοῦ — «оставлю его на земле его»; ἐργᾶται αὐτῷ καὶ ἐνοικήσει ἐν αὐτῇ — «будет возделывать её и жить в ней». Слав. «орати будет ю» (орать — пахать). Здесь закрывается слово Господа, начатое в 2."
  12: "καὶ πρὸς Σεδεκιαν βασιλέα Ιουδα ἐλάλησα κατὰ πάντας τοὺς λόγους τούτους — «и Седекии, царю Иуде, я говорил по всем словам этим»: первый раз за главу пророк говорит о себе прямо (12); дальше — слово Господа. Слав. добавляет «склоните выи вашя под иго царя вавилонска и служите ему и людем его, и живи будете» — в греч. стих обрывается на «Εἰσαγάγετε τὸν τράχηλον ὑμῶν»; добавление внесено в текст без скобок и оговорено."
  13: "«ТОЧКА» В МОДУЛЕ (34:13 — `.`): переведено по слав. 27:13: «почто умираете, ты и людие твои, мечем и гладом и мором, якоже рече Господь ко странам, не хотевшым служити царю вавилонску?» μορός — мор, повальная болезнь (в тексте 疫病). Стих продолжает слово к Седекии и прямо связан с 8 («мечом и голодом посещу»)."
  14: "Иное чтение: gr 34:14 — «καὶ ἐργάσασθε τῷ βασιλεῖ Βαβυλῶνος, ὅτι ἄδικα αὐτοὶ προφητεύουσιν ὑμῖν» («и работайте царю Вавилонскому, ибо они неправедно пророчествуют вам»). Слав. 27:14 повторяет 27:9: «не послушайте слов пророков глаголющих вам: не послужите царю вавилонску». По умолчанию держим csl и отмечаем LXX; повтор в слав. — от МТ, но церковное чтение его сохраняет."
  15: "οὐκ ἀπέστειλα αὐτούς — «не Я послал их»; προφητεύουσιν τῷ ὀνόματί μου ἐπ' ἀδίκῳ — «пророчествуют именем Моим неправедно» (ἐπ' ἀδίκῳ — «на неправду», несправедливо); πρὸς τὸ ἀπολέσαι ὑμᾶς — «чтобы погубить вас»; ἀπολεῖσθε ὑμεῖς καὶ οἱ προφῆται ὑμῶν — «погибнете вы и пророки ваши». Слав. «яко неправедно тии прорицают вам» и «о неправде ложная». Здесь закрывается слово к Седекии."
  16: "ὑμῖν καὶ παντὶ τῷ λαῷ τούτῳ καὶ τοῖς ἱερεῦσιν ἐλάλησα — «вам и всему народу сему и священникам я говорил»: пророк снова говорит о себе, дальше — слово Господа. σκεύη οἴκου κυρίου ἐπιστρέψει ἐκ Βαβυλῶνος — «сосуды дома Господня возвратятся из Вавилона» (σκεῦος — сосуд, утварь; ср. 4 Цар 25:13–17). ὅτι ἄδικα αὐτοὶ προφητεύουσιν ὑμῖν, οὐκ ἀπέστειλα αὐτούς — «ибо неправедно они пророчествуют вам, Я не посылал их». Слова лжепророков — 『…』."
  17: "«ТОЧКА» В МОДУЛЕ (34:17 — `.`): переведено по слав. 27:17: «не послушайте их, но служите царю вавилонскому, да живи будете. Вскую даете град сей в запустение?» εἰς ἐρήμωσιν — в опустошение (в тексте 荒れ果てるまま). Стих прямо продолжает речь 16 и связан с 12–13."
  18: "εἰ προφῆταί εἰσιν — «если они пророки»; εἰ ἔστιν λόγος κυρίου ἐν αὐτοῖς — «если есть слово Господне в них»; ἀπαντησάτωσάν μοι — «пусть предстанут Мне» (ἀπαντάω — встречать, представать); в греч. стих обрывается здесь. Слав. продолжает: «да не отидут сосуди, оставшиися в дому Господни… в вавилон» (по МТ); добавление внесено в текст без скобок."
  19: "τῶν ἐπιλοίπων σκευῶν — «об остальных сосудах»: в греч. стих обрывается. Слав. перечисляет: «о столпех и о умывалнице, и о подставах и о прочих сосудех оставшихся во граде сем» — по МТ; внесено в текст без скобок. Столпы (столбы), умывальница (медное море), подставы (подножия) — утварь храма (3 Цар 7:15–37); в тексте 柱, 洗い盤, 台座."
  20: "ὧν οὐκ ἔλαβεν βασιλεὺς Βαβυλῶνος — «которых не взял царь Вавилонский»; ὅτε ἀπῴκισεν τὸν Ιεχονιαν ἐξ Ιερουσαλημ — «когда переселил Иехонию из Иерусалима» (ἀποικίζω — выселять, переселять); слав. «егда пресели иехонию сына иоакимова, царя иудина… и вся старейшины иудины» — добавления по МТ, «сына Иоакимова» и «всех старейшин» внесены в текст без скобок (長老たち)."
  21: "«ТОЧКА» В МОДУЛЕ (34:21 — `.`): переведено по слав. 27:21: «Тако бо глаголет Господь вседержитель Бог израилев о сосудех оставшихся в дому Господни и в дому царя иудина и в Иерусалиме». Стих возобновляет речь о сосудах после перечня в 19–20."
  22: "εἰς Βαβυλῶνα εἰσελεύσεται — «в Вавилон войдут (придут)»; в греч. стих короткий: «в Вавилон войдут, говорит Господь». Слав. добавляет «и тамо будут даже до дне посещения своего… и повелю принести я и возвратити на место сие» — по МТ; внесено в текст без скобок (обетование о возвращении, ср. 29:10). Здесь закрывается слово Господа, начатое в 16."
