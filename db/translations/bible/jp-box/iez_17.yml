# jp-box, Иезекииль, глава 17. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава тоже 17. Стихов 24,
# деление совпадает.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: 1–10 притча о двух орлах и виноградной лозе (вавилонский царь унёс
# царский род в Вавилон, лоза изменила ему и потянулась к Египту); 11–21 объяснение:
# царь вавилонский взял царя и князей, поставил Седекию, тот нарушил клятву и погибнет
# в Вавилоне; 22–24 обетование: Господь возьмёт нежную отрасль кедра и насадит на
# высокой горе Израилевой.
# Речь: 17:1 — вне кавычек; 17:2–10 — речь Господа в 「…» (повеление пророку, затем
# притча оракула в 『…』 — «主なる神はこう言われる» вне внутренней цитаты, как в
# Иер 2:1); 17:11 — формула вне кавычек; 17:12–24 — речь Господа в 「…» (в 12 вопрос
# к дому мятежному — 『…』; с 22 новой формулы «主なる神はこう言われる» кавычки не
# прерывают, как в Иер 38:3). Кавычки сбалансированы: две пары 「」 и две пары 『』.
# Паритет: 17:3 ru/МТ добавляет «пестрый, пушистый» — нет в LXX, не внесено; 17:5
# LXX «видимое (ἐπιβλεπόμενον)», ru/МТ «как иву»; 17:20 LXX обрывается
# на «пойман будет в тенета его», csl
# добавляет «и приведу его в Вавилон и буду судиться с ним там» — нет в LXX, внесено;
# 17:21 csl добавляет «все убежавшие его и все избранные» — нет в LXX, внесено;
# 17:22 csl/LXX «повешу его» (κρεμάσω), в ru/МТ «посажу».

