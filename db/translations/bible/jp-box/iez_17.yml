verses:
  1: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]われた。"
  2: "「人[ひと]の子[こ]よ、なぞを語[かた]り、イスラエルの家[いえ]にたとえを語[かた]れ。"
  3: "そして言[い]え。主[しゅ]なる神[かみ]はこう言[い]われる。『大[おお]きな鷲[わし]、翼[つばさ]の大[おお]きな者[もの]、長[なが]く伸[の]びた羽[はね]を持[も]ち、爪[つめ]に満[み]ちた鷲[わし]が、レバノンに入[はい]る命[めい]じを受[う]けて来[き]た。そして杉[すぎ]の頂[いただき]の選[えら]ばれた枝[えだ]を取[と]った。"
  4: "彼はその柔[やわ]らかな梢[こずえ]の先[さき]を摘[つ]み取[と]り、それをカナンの地[ち]に運[はこ]び、城壁[じょうへき]のある町[まち]に置[お]いた。"
  5: "彼はその地[ち]の種[たね]を取[と]って、野[の]の畑[はたけ]に蒔[ま]き、多[おお]くの水[みず]のほとりに、目[め]につく所[ところ]に植[う]えた。"
  6: "それは芽[め]を出[だ]して、弱[よわ]い小[ちい]さなぶどうの木[き]になり、その枝[えだ]はそれに向[む]かい、その根[ね]はその下[した]にあった。それはぶどうの木[き]となり、枝[えだ]を伸[の]ばし、若枝[わかえだ]を広[ひろ]げた。"
  7: "また、もう一[ひと]つの大[おお]きな鷲[わし]がいた。翼[つばさ]が大[おお]きく、爪[つめ]が多[おお]かった。見[み]よ、このぶどうの木[き]はその鷲[わし]の方[ほう]へと絡[から]みつき、その根[ね]を彼[かれ]の方[ほう]へ向[む]け、その枝[えだ]を彼[かれ]に伸[の]ばして、自分[じぶん]の植[う]えられた畑[はたけ]の土[つち]とともに、彼[かれ]に水[みず]を注[そそ]いでもらおうとした。"
  8: "それは良[よ]い畑[はたけ]で、多[おお]くの水[みず]のほとりで肥[こ]え、枝[えだ]を伸[の]ばして実[み]を結[むす]び、大[おお]きなぶどうの木[き]となるためであった。"
  9: "それゆえ、言[い]え。主[しゅ]なる神[かみ]はこう言[い]われる。それは栄[さか]えるだろうか。その根[ね]は抜[ぬ]かれず、その実[み]は腐[くさ]らず、その若枝[わかえだ]はすべてい枯[か]れてしまわないだろうか。大[おお]きな腕[うで]も多[おお]い民[たみ]もなく、それは根[ね]から引[ひ]き抜[ぬ]かれるのではないか。"
  10: "見[み]よ、それは植[う]えられている。だが、栄[さか]えるだろうか。焼[や]けつくような風[かぜ]がそれに触[ふ]れたなら、すっかり枯[か]れてしまわないだろうか。その育[そだ]った畑[はたけ]で枯[か]れるであろう』」。"
  11: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]われた。"
  12: "「人[ひと]の子[こ]よ、わたしを怒[いか]らせる家[いえ]に言[い]え。『あなたがたは、これが何[なに]を意味[いみ]するか知[し]らないのか』と。見[み]よ、バビロンの王[おう]がエルサレムに来[き]て、その王[おう]とその君[きみ]たちを取[と]り、自分[じぶん]のもとへバビロンに連[つ]れて行[い]った。"
  13: "彼は王[おう]の一族[いちぞく]から一[ひと]人[り]を取[と]って、彼と契約[けいやく]を結[むす]び、彼に誓[ちか]いを課[か]し、その地[ち]の指[し]導[どう]者[しゃ]たちを連[つ]れて行[い]った。"
  14: "それは、その王国[おうこく]が弱[よわ]くなり、高[たか]ぶることができず、彼と結[むす]んだ契約[けいやく]を守[まも]って立[た]ち続[つづ]けるためであった。"
  15: "しかし、彼はバビロンの王[おう]に叛[そむ]き、使者[ししゃ]をエジプトに遣[つか]わして、馬[うま]と多[おお]くの民[たみ]を求[もと]めた。彼は栄[さか]えるだろうか。このようなことをする者[もの]は逃[のが]れられるだろうか。契約[けいやく]を破[やぶ]る者[もの]が逃[のが]れられるだろうか。"
  16: "わたしは生[い]きている、と主[しゅ]なる神[かみ]は言[い]われる。彼を王[おう]としたその王[おう]のいる所[ところ]、彼がその誓[ちか]いを蔑[さげす]み、その契約[けいやく]を破[やぶ]ったその王[おう]のもとで、彼はバビロンの中[なか]で死[し]ぬ。"
  17: "ファラオ[ファラオ]は、たとえ塁[るい]を築[きず]き、攻[こう]城[じょう]櫓[やぐら]を建[た]てて多[おお]くの魂[たましい]を取[と]り除[のぞ]こうとしても、大[だい]きな力[ちから]も多[おお]い群[ぐん]衆[しゅう]もなく、彼とともに戦[たたか]いをしない。"
  18: "彼は誓[ちか]いを蔑[さげす]み、契約[けいやく]を破[やぶ]った。見[み]よ、彼は手[て]を差[さ]し出[だ]して誓[ちか]いながら、これらすべてのことをした。彼は逃[のが]れられない。"
  19: "それゆえ、言[い]え。主[しゅ]なる神[かみ]はこう言[い]われる。わたしは生[い]きている。彼が蔑[さげす]んだわたしの誓[ちか]いと、彼が破[やぶ]ったわたしの契約[けいやく]を、わたしは彼の頭[あたま]に返[かえ]す。"
  20: "わたしは彼の上[うえ]に網[あみ]を広[ひろ]げ、彼はわたしの罠[わな]にかかる。わたしは彼をバビロンに連[つ]れて行[い]き、そこで彼と、彼がわたしに対して犯[おか]した背[はい]信[しん]について裁[さば]きを行[おこな]う。"
  21: "彼のすべての逃[に]げる者[もの]も、すべての選[えら]ばれた者[もの]も、そのすべての軍[ぐん]とともに剣[つるぎ]に倒[たお]れる。そして、わたしは彼らの残[のこ]りを四方[しほう]の風[かぜ]に散[ち]らす。あなたがたは、語[かた]ったのがわたし、主[しゅ]であることを知[し]る。"
  22: "それゆえ、主[しゅ]なる神[かみ]はこう言[い]われる。わたしは高[たか]い杉[すぎ]の選[えら]ばれた枝[えだ]を取[と]り、その頂[いただき]の真[ま]ん中[なか]から摘[つ]み取[と]って、わたし自身[じしん]それを高[たか]い山[やま]に植[う]える。わたしはそれを高[たか]く掲[かか]げる。"
  23: "イスラエルの高[たか]い山[やま]に、わたしはそれを植[う]える。それは枝[えだ]を出[だ]して実[み]を結[むす]び、大[おお]きな杉[すぎ]となる。その下[した]にすべての野獣[やじゅう]が休[やす]み、その影[かげ]の下[した]にすべての鳥[とり]が休[やす]む。その枝[えだ]は再[ふたた]び整[ととの]えられる。"
  24: "野[の]のすべての木[き]は、わたしが主[しゅ]であることを知[し]る。わたしは高[たか]い木[き]を低[ひく]くし、低[ひく]い木[き]を高[たか]くし、生[い]きている木[き]を枯[か]らし、枯[か]れた木[き]を芽吹[めぶ]かせる。わたしは主[しゅ]であり、語[かた]って、それを行[おこな]う」。"

notes:
  1: "Καὶ ἐγένετο λόγος κυρίου πρός με λέγων — «и было слово Господне ко мне, говоря»: формула начала речи."
  2: "διήγησαι διήγημα καὶ εἰπὸν παραβολὴν — «поведай повесть и скажи притчу» (cognatus: διήγησις/διήγημα — рассказ; παραβολή — притча); πρὸς τὸν οἶκον τοῦ Ισραηλ — «к дому Израилеву»."
  3: "ὁ ἀετὸς ὁ μέγας ὁ μεγαλοπτέρυγος ὁ μακρὸς τῇ ἐκτάσει πλήρης ὀνύχων — «орёл великий, великокрылый, длинный протяжением, полный когтей» (ὄνυξ — коготь); ὃς ἔχει τὸ ἥγημα εἰσελθεῖν εἰς τὸν Λίβανον — «имеющий вождение (повеление) войти в Ливан» (ἥγημα); τὰ ἐπίλεκτα τῆς κέδρου — «избранное кедра» (верхушка). ru/МТ добавляет «пестрый, пушистый» — нет в LXX, не внесено."
  4: "τὰ ἄκρα τῆς ἁπαλότητος ἀπέκνισεν — «верхушки нежности оторвал» (ἀποκνίζω — обрывать; ἁπαλότης — нежность, мягкость); εἰς γῆν Χανααν — «в землю Ханаан»; εἰς πόλιν τετειχισμένην — «в город ограждённый» (τειχίζω — обносить стеной); в ru/МТ «в городе торговцев» — иное чтение."
  5: "ἀπὸ τοῦ σπέρματος τῆς γῆς — «от семени земли»; εἰς τὸ πεδίον — «на поле»; ἐφ᾽ ὕδατι πολλῷ — «при водах многих»; ἐπιβλεπόμενον ἔταξεν αὐτό — «видимым (на виду) поставил его» (ἐπιβλέπω — смотреть на), 目につく所. В ru/МТ «как сажают иву» — нет в LXX."
  6: "εἰς ἄμπελον ἀσθενοῦσαν καὶ μικράν — «в виноград слабый и малый» (ἀσθενέω — быть слабым); ἀπώρυγας — «отводки, розги» (ἀπώρυξ); τὴν ἀναδενδράδα — «отрасли» (виноград, вьющийся по дереву); ἐξέτεινεν — «простёр»."
  7: "ἀετὸς ἕτερος μέγας μεγαλοπτέρυγος πολὺς ὄνυξιν — «орёл другой великий, великокрылый, многий когтями»; περιπεπλεγμένη πρὸς αὐτόν — «обвившаяся к нему» (περιπλέκω); σὺν τῷ βώλῳ τῆς φυτείας αὐτῆς — «с глыбой (землёй) насаждения своего» (βῶλος — глыба)."
  8: "εἰς πεδίον καλὸν ἐφ᾽ ὕδατι πολλῷ αὕτη πιαίνεται — «на поле доброе при воде многой она утучняется» (πιαίνω — откармливать, 肥える); τοῦ ποιεῖν βλαστοὺς καὶ φέρειν καρπόν — «чтобы делать побеги и приносить плод» (βλαστός — побег)."
  9: "Εἰ κατευθυνεῖ; — «будет ли успех (прямо ли пойдёт)?» (κατευθύνω — направлять, преуспевать); ὁ καρπὸς σαπήσεται — «плод сгниёт» (σήπω); τὰ προανατέλλοντα αὐτῆς — «прежде взошедшее её» (προανατέλλω); οὐκ ἐν βραχίονι μεγάλῳ… τοῦ ἐκσπάσαι — «не великой ли мышцей… исторгнуть» (ἐκσπάω — вырывать)."
  10: "ἄνεμον τὸν καύσωνα — «ветер знойный» (καύσων — зной, суховей); ξηρανθήσεται ξηρασίᾳ — «иссохнет сухотой» (cognatus accusativus); σὺν τῷ βώλῳ ἀνατολῆς αὐτῆς — «с глыбой всхода (произрастания) своего»."
  11: "Καὶ ἐγένετο λόγος κυρίου πρός με λέγων — формула нового слова."
  12: "τὸν οἶκον τὸν παραπικραίνοντα — «дом прогневляющий (мятежный)» (παραπικραίνω — горько огорчать); Οὐκ ἐπίστασθε τί ἦν ταῦτα; — «разве не знаете, что это было?»; Ὅταν ἔλθῃ βασιλεὺς Βαβυλῶνος — «когда придёт царь Вавилонский» (греч. настоящее/аорист, в тексте прошедшее)."
  13: "ἐκ τοῦ σπέρματος τῆς βασιλείας — «от семени царства (царского рода)»; διαθήσεται πρὸς αὐτὸν διαθήκην — «заключит с ним завет» (cognatus); εἰσάξει αὐτὸν ἐν ἀρᾷ — «введёт его в клятву (проклятие)» (ἀρά — клятва с проклятием); τοὺς ἡγουμένους τῆς γῆς — «вождей земли»."
  14: "εἰς βασιλείαν ἀσθενῆ — «в царство слабое»; τὸ καθόλου μὴ ἐπαίρεσθαι — «чтобы вовсе не возноситься» (ἐπαίρω); φυλάσσειν τὴν διαθήκην αὐτοῦ καὶ ἱστάνειν αὐτήν — «хранить завет его и держать его» (ἵστημι — ставить, держать)."
  15: "ἀποστήσεται ἀπ᾽ αὐτοῦ — «отступит от него» (ἀφίστημι); τοῦ ἐξαποστέλλειν ἀγγέλους εἰς Αἴγυπτον — «посылая послов в Египет»; εἰ διασωθήσεται ὁ ποιῶν ἐναντία; — «спасётся ли делающий противное?» (ἐναντίος); παραβαίνων διαθήκην."
  16: "ζῶ ἐγώ — клятва «живу Я»; ἐν ᾧ τόπῳ ὁ βασιλεὺς ὁ βασιλεύσας αὐτόν — «на месте, где царь, воцаривший его»; ἠτίμωσεν τὴν ἀράν μου — «обесчестил клятву Мою» (ἀτιμόω); τελευτήσει — «скончается» (τελευτάω)."
  17: "ἐν χαρακοβολίᾳ — «при насыпании вала» (χαρακοβολία); ἐν οἰκοδομῇ βελοστάσεων — «при построении осадных машин (башен)» (βελοστάσις); τοῦ ἐξᾶραι ψυχάς — «чтобы исторгнуть души» (ἐξαίρω); καὶ οὐκ ἐν δυνάμει… ποιήσει πόλεμον — «и не в силе… сделает войну», т. е. фараон не поможет."
  18: "ἠτίμωσεν ὁρκωμοσίαν — «обесчестил клятву» (ὁρκωμοσία); δέδωκεν τὴν χεῖρα αὐτοῦ — «дал руку свою» (жест клятвы и поручительства); μὴ σωθήσεται; — «не спасётся ли?», по смыслу «не спасётся»."
  19: "Ζῶ ἐγὼ ἐὰν μή — клятвенное «живу Я, если не» (= непременно); δώσω αὐτὰ εἰς κεφαλὴν αὐτοῦ — «дам их на голову его» (образ возмездия)."
  20: "ἐκπετάσω ἐπ᾽ αὐτὸν τὸ δίκτυόν μου — «распростру на него сеть Мою» (δίκτυον); ἁλώσεται ἐν τῇ περιοχῇ αὐτοῦ — «пойман будет в охвате (тенетах) его» (περιοχή). Здесь LXX обрывается; csl добавляет «и приведу его в Вавилон и рассужусь с ним там о неправде его» — нет в LXX, внесено."
  21: "ἐν πάσῃ παρατάξει αὐτοῦ — «во всём ополчении его» (παράταξις); τοὺς καταλοίπους εἰς πάντα ἄνεμον διασπερῶ — «остатки развею по всякому ветру» (διασπείρω). csl добавляет «все убежавшие его и все избранные» — нет в LXX, внесено. ἐγὼ κύριος λελάληκα — «Я, Господь, сказал»."
  22: "ἐκ τῶν ἐπιλέκτων τῆς κέδρου — «из избранных кедра»; ἐκ κορυφῆς καρδίας αὐτῶν ἀποκνιῶ — «с вершины сердца их оторву» (ἀποκνίζω); καταφυτεύσω ἐπ᾽ ὄρος ὑψηλόν — «насажу на горе высокой»; κρεμάσω αὐτὸν — «повешу его» (κρεμάννυμι), в тексте 高く掲げる; в ru/МТ «посажу»."
  23: "ἐν ὄρει μετεώρῳ τοῦ Ισραηλ — «на горе возвышенной Израиля» (μετέωρος); ἐξοίσει βλαστόν — «произрастит побег» (βλαστός); ἀναπαύσεται ὑποκάτω αὐτοῦ πᾶν θηρίον — «почиет под ним всякий зверь»; τὰ κλήματα αὐτοῦ ἀποκατασταθήσεται — «ветви его восстановятся» (ἀποκαθίστημι)."
  24: "ὁ ταπεινῶν ξύλον ὑψηλὸν καὶ ὑψῶν ξύλον ταπεινόν — «смиряющий дерево высокое и возвышающий дерево низкое» (ταπεινόω, ὑψόω); ξηραίνων ξύλον χλωρὸν καὶ ἀναθάλλων ξύλον ξηρόν — «иссушающий дерево зелёное и возвращающий цвет дереву сухому» (χλωρός — зелёный, свежий; ἀναθάλλω — вновь расцветать); ἐγὼ κύριος λελάληκα καὶ ποιήσω — «Я, Господь, сказал и сделаю». Здесь речь закрывается."
