verses:
  1: "ベツァレルとオホリアブ、また、心[こころ]に知恵[ちえ]と知識[ちしき]を授[さず]けられ、聖所[せいしょ]に属[ぞく]するすべての仕事[しごと]を理解[りかい]して行[おこな]うことのできる者[もの]たちはみな、主[しゅ]が命[めい]じたすべてのとおりに、その仕事[しごと]を行[おこな]った。"
  2: "モーセは、ベツァレルとオホリアブ、および心[こころ]に知恵[ちえ]のある者[もの]たち、すなわち神[かみ]がその心[こころ]に知識[ちしき]を与[あた]えられた者[もの]たちを、また、進[すす]んでその仕事[しごと]に加[くわ]わり、これを成[な]し遂[と]げようと願[ねが]う者[もの]たちを、すべて呼[よ]び寄[よ]せた。"
  3: "彼[かれ]らはモーセから、イスラエルの子[こ]らが聖所[せいしょ]のすべての仕事[しごと]をなすために持[も]ち寄[よ]った献[ささ]げ物[もの]を、すべて受[う]け取[と]った。人々はなおも、毎朝[まいあさ]、持[も]って来[く]る献[ささ]げ物[もの]をささげ続[つづ]けていた。"
  4: "聖所[せいしょ]の仕事[しごと]をする賢[かしこ]い者[もの]たちはみな、それぞれ自分[じぶん]の携[たずさ]わっている仕事[しごと]のところへ来[き]て、"
  5: "モーセに言[い]った。「民[たみ]は、主[しゅ]がなせと命[めい]じられた仕事[しごと]に必要[ひつよう]な量[りょう]をはるかに超[こ]えて、持[も]ち寄[よ]っています。」"
  6: "そこでモーセは命[めい]じ、宿営[しゅくえい]の中[なか]に告[つ]げ知[し]らせた。「男[おとこ]も女[おんな]も、もはや聖所[せいしょ]への献[ささ]げ物[もの]のために働[はたら]いてはならない。」こうして民[たみ]は、それ以上[いじょう]持[も]ち寄[よ]ることを止[や]められた。"
  7: "その仕事[しごと]を仕上[しあ]げるには材料[ざいりょう]が十分[じゅうぶん]にあり、なお余[あま]った。"
  8: "仕事[しごと]をする者[もの]たちのうち、賢[かしこ]い者[もの]はみな、聖[せい]なる衣服[いふく]、すなわち祭司[さいし]アロンのための衣服[いふく]を造[つく]った。主[しゅ]がモーセに命[めい]じたとおりである。"
  9: "彼[かれ]らは金[きん]、青[あお]、紫[むらさき]、撚[よ]った緋[ひ]の糸[いと]、撚[よ]った亜麻布[あまぬの]で、エフォドを造[つく]った。"
  10: "金[きん]の板[いた]を髪[かみ]の毛[け]のように細[ほそ]く切[き]り、青[あお]、紫[むらさき]、撚[よ]った緋[ひ]の糸[いと]、撚[よ]った亜麻布[あまぬの]とともに織[お]り込[こ]んで、織[お]り物[もの]とした。"
  11: "すなわち、両側[りょうがわ]で互[たが]いに連[つら]なるエフォドに仕上[しあ]げた。"
  12: "これは互[たが]いに組[く]み合[あ]わされた織[お]り物[もの]で、それ自体[じたい]から一[ひと]つに織[お]り上[あ]げられた。金[きん]、青[あお]、紫[むらさき]、撚[よ]った緋[ひ]の糸[いと]、撚[よ]った亜麻布[あまぬの]で、主[しゅ]がモーセに命[めい]じたとおりに造[つく]った。"
  13: "また、二[ふた]つのエメラルドの石[いし]を金[きん]で縁[ふち]どり、金[きん]の中[なか]にはめ込[こ]み、イスラエルの子[こ]らの名[な]を、印[いん]を彫[ほ]るように彫[ほ]り込[こ]んだ。"
  14: "これをエフォドの両肩[りょうかた]に、イスラエルの子[こ]らの記念[きねん]の石[いし]として付[つ]けた。主[しゅ]がモーセに命[めい]じたとおりである。"
  15: "彼[かれ]らは胸当[むねあて]を、エフォドと同じ手法[しゅほう]の、刺繍師[ししゅうし]の技[わざ]による織[お]り物[もの]として造[つく]った。金[きん]、青[あお]、紫[むらさき]、撚[よ]った緋[ひ]の糸[いと]、撚[よ]った亜麻布[あまぬの]による。"
  16: "胸当[むねあて]は四角[しかく]で、二[ふた]重[え]にした。長[なが]さも幅[はば]も一[いっ]スパンで、二重[ふたえ]であった。"
  17: "その中[なか]には、石[いし]を四[よ]つ並[なら]べた織[お]り模様[もよう]を織[お]り込[こ]んだ。第一[だいいち]の列[れつ]は、サルディオン、トパーズ、エメラルド。"
  18: "第二[だいに]の列[れつ]は、カーバンクル、サファイア、ジャスパー。"
  19: "第三[だいさん]の列[れつ]は、リグリオン、アゲート、アメシスト。"
  20: "第四[だいし]の列[れつ]は、クリソライト、ベリル、オニキス。いずれも金[きん]で縁[ふち]どられ、金[きん]で留[と]められていた。"
  21: "その石[いし]はイスラエルの子[こ]らの名[な]による十二[じゅうに]の石[いし]で、それぞれの名[な]が、十二[じゅうに]の部族[ぶぞく]のために、印[いん]のように一[ひと]つずつ彫[ほ]り込[こ]まれていた。"
  22: "また、胸当[むねあて]の上[うえ]には、純金[じゅんきん]で編[あ]んだ紐[ひも]を付[つ]けた。"
  23: "また、金[きん]の枠[わく]二[ふた]つと金[きん]の環[かん]二[ふた]つを造[つく]り、その金[きん]の環[かん]二[ふた]つを胸当[むねあて]の両端[りょうたん]に付[つ]けた。"
  24: "また、金[きん]の編[あ]み紐[ひも]を、胸当[むねあて]の両側[りょうがわ]にある環[かん]に通[とお]した。"
  25: "そして、その二[ふた]つの編[あ]み紐[ひも]を二[ふた]つの枠[わく]に通[とお]し、それをエフォドの両肩[りょうかた]の前[まえ]側[がわ]に、向[む]かい合[あ]うように付[つ]けた。"
  26: "また、金[きん]の環[かん]二[ふた]つを造[つく]り、胸当[むねあて]の端[はし]にある二[ふた]つの翼[つばさ]に、すなわちエフォドの後[うし]ろ側[がわ]の端[はし]の内側[うちがわ]に付[つ]けた。"
  27: "また、金[きん]の環[かん]二[ふた]つを造[つく]り、エフォドの両肩[りょうかた]の下[した]、前[まえ]側[がわ]の、エフォドの織[お]り目[め]の上[うえ]の継[つ]ぎ目[め]に当[あ]たる所[ところ]に付[つ]けた。"
  28: "そして、胸当[むねあて]をその環[かん]からエフォドの環[かん]へ青[あお]の紐[ひも]で結[むす]び、エフォドの織[お]り物[もの]に織[お]り込[こ]んで、胸当[むねあて]がエフォドから外[はず]れないようにした。主[しゅ]がモーセに命[めい]じたとおりである。"
  29: "彼[かれ]らは、エフォドの下[した]に着[き]る、足[あし]まで届[とど]く衣[ころも]を、全体[ぜんたい]青[あお]の織[お]り物[もの]として造[つく]った。"
  30: "その衣[ころも]の真[ま]ん中[なか]に頭[あたま]を通[とお]す口[くち]があり、口[くち]の周[まわ]りには織[お]り物[もの]の縁[ふち]を付[つ]けて、裂[さ]けないようにした。"
  31: "また、その衣[ころも]の裾[すそ]には、ざくろの花[はな]のような飾[かざ]りを、青[あお]、紫[むらさき]、撚[よ]った緋[ひ]の糸[いと]、撚[よ]った亜麻布[あまぬの]で造[つく]り付[つ]けた。"
  32: "また、金[きん]の鈴[すず]を造[つく]り、その鈴[すず]を衣[ころも]の裾[すそ]の周[まわ]り、飾[かざ]りと飾[かざ]りの間[あいだ]に付[つ]けた。"
  33: "鈴[すず]と飾[かざ]りを衣[ころも]の裾[すそ]の周[まわ]りに交互[こうご]に並[なら]べ、務[つと]めを果[は]たすためとした。主[しゅ]がモーセに命[めい]じたとおりである。"
  34: "彼[かれ]らはアロンとその子[こ]らのために、亜麻布[あまぬの]の衣[ころも]を、織[お]り物[もの]として造[つく]った。"
  35: "また、亜麻布[あまぬの]の頭[あたま]の被[かぶ]り物[もの]、亜麻布[あまぬの]の冠[かんむり]、撚[よ]った亜麻布[あまぬの]の下[した]ばきを造[つく]った。"
  36: "また、その帯[おび]を、亜麻布[あまぬの]、青[あお]、紫[むらさき]、撚[よ]った緋[ひ]の糸[いと]で、刺繍師[ししゅうし]の手法[しゅほう]により造[つく]った。主[しゅ]がモーセに命[めい]じたとおりである。"
  37: "また、聖[せい]なるために取[と]り分[わ]けた金[きん]の板[いた]を純金[じゅんきん]で造[つく]り、その上[うえ]に、印[いん]を彫[ほ]るように「主[しゅ]の聖[せい]なるもの」と記[しる]した。"
  38: "また、その上[うえ]に青[あお]の紐[ひも]を付[つ]け、冠[かんむり]の上[うえ]に載[の]せるようにした。主[しゅ]がモーセに命[めい]じたとおりである。"

notes:
  1: "καὶ ἐποίησεν Βεσελεηλ καὶ Ελιαβ — ベツァレルとオホリアブ (LXX: Βεσελεηλ, Ελιαβ; евр. אָהֳלִיאָב, отсюда традиц. オホリアブ; ср. 31:6). πᾶς σοφὸς τῇ διανοίᾳ — 心に知恵ある者 (διάνοια — «ум, разумение»). ᾧ ἐδόθη σοφία καὶ ἐπιστήμη ἐν αὐτοῖς — даны премудрость и разумение в них (относит. ед. при мн. «каждый»). τὰ ἅγια — 聖所, святыня. καθῆκοντα — «подобающее, потребное»."
  2: "ἐκάλεσεν — созвал. τοὺς ἔχοντας τὴν σοφίαν — 知恵のある者. ἐπιστήμη ἐν τῇ καρδίᾳ — 心に知識 (ἐπιστήμη — «знание, умение»). ἑκουσίως βουλομένους — 進んで願う. προσπορεύεσθαι πρὸς τὰ ἔργα — приступить к работам."
  3: "τὰ ἀφαιρέματα — 献げ物 (ἀφαίρεμα — «отделяемое, приношение»; слав. «участия»). εἰς πάντα τὰ ἔργα τοῦ ἁγίου — на все дела святилища. τὸ πρωῒ πρωί — 毎朝 (букв. «утро за утром»)."
  4: "παρεγίνοντο — приходили. ἕκαστος κατὰ τὸ αὐτοῦ ἔργον — каждый по своей работе."
  5: "Πλῆθος φέρει ὁ λαὸς παρὰ τὰ ἔργα — народ приносит больше, чем нужно для работ (παρά + вин. — «сверх»)."
  6: "ἐκήρυξεν ἐν τῇ παρεμβολῇ — 宿営の中で告げ知らせた (παρεμβολή — «стан»). ἀπαρχαί — 献げ物, начатки. ἐκωλύθη — был удержан."
  7: "ἱκανὰ εἰς τὴν κατασκευήν — достаточно для устройства, изготовления. προσκατέλιπον — «оставили сверх», осталось лишнее."
  8: "στολὰς τῶν ἁγίων — 聖なる衣服 (одежды святыни; слав. «ризы святыни»). αἵ εἰσιν Ααρων τῷ ἱερεῖ — которые для Аарона-священника. С этого стиха LXX начинает одежды, тогда как в евр. это гл. 39."
  9: "ἐπωμίς — エフォド (нарамник; евр. אֵפוֹד). ὑάκινθος — 青 (сине-фиолетовая шерсть), πορφύρα — 紫, κόκκινον — 緋 (алая шерсть), βύσσος — 亜麻布 (виссон), νενησμένον — 撚った (緋), κεκλωσμένη — 撚った (亜麻布; сканная)."
  10: "τὰ πέταλα τοῦ χρυσίου — 金の板 (πέταλον — «пластина»). τρίχες — как волосы, тонко. διανενημένον — ссученное. ἔργον ὑφαντόν — 織り物."
  11: "ἐπωμίδας συνεχούσας ἐξ ἀμφοτέρων τῶν μερῶν — нарамники, скреплённые с обеих сторон."
  12: "εἰς ἄλληλα συμπεπλεγμένον — 互いに組み合わされた. καθ᾿ ἑαυτὸ ἐξ αὐτοῦ — само по себе из него (ткань единая)."
  13: "σμάραγδος — エメラルド (в евр. здесь שֹׁהַם, обычно «оникс» — расхождение LXX и МТ). συμπεπορπημένους — 留められた (застёгнутые). περισεσιαλωμένους χρυσίῳ — 金で縁どられた. ἐκκόλαμμα σφραγῖδος — 印の彫り物."
  14: "λίθοι μνημοσύνου — 記念の石 (напоминание пред Богом о сынах Израиля)."
  15: "λογεῖον — 胸当 (наперсник; евр. חֹשֶׁן). ποικιλία — 刺繍, узор. κατὰ τὸ ἔργον τῆς ἐπωμίδος — как работа ефода."
  16: "τετράγωνον διπλοῦν — 四角で二重. σπιθαμή — 一スパン (пядь; сноска при первом упоминании — 28:16)."
  17: "ὕφασμα κατάλιθον τετράστιχον — 石を四つ並べた織り模様 (ткань с камнями в четыре ряда). σάρδιον — サルディオン (сердолик; ср. 28:17), τοπάζιον — トパーズ, σμάραγδος — エメラルド."
  18: "ἄνθραξ — カーバンクル (карбункул), σάπφειρος — サファイア, ἴασπις — ジャスパー (ср. 28:18)."
  19: "λιγύριον — リグリオン (лигурий, камень точно не отождествлён; ср. 28:19), ἀχάτης — アゲート, ἀμέθυστος — アメシスト."
  20: "χρυσόλιθος — クリソライト, βηρύλλιον — ベリル, ὀνύχιον — オニキス. περικεκυκλωμένα χρυσίῳ — 金で縁どられ."
  21: "ἐκ τῶν ὀνομάτων — по именам. ἐγγεγραμμένα εἰς σφραγῖδας — 印のように彫られた. εἰς τὰς δώδεκα φυλάς — для двенадцати колен."
  22: "κροσσοὶ συμπεπλεγμένοι — 編んだ紐 (плетёные шнуры). ἔργον ἐμπλοκίου — 編み細工."
  23: "ἀσπιδίσκαι — 枠 (букв. «щитки»; золотые гнёзда). δακτύλιοι — 環."
  24: "τὰ ἐμπλόκια — 編み紐. ἐπ᾿ ἀμφοτέρων τῶν μερῶν — с обеих сторон."
  25: "εἰς τὰς δύο συμβολάς — в два соединения. ἐξ ἐναντίας κατὰ πρόσωπον — 向かい合うように (лицом к лицу)."
  26: "πτερύγια — 翼 (края наперсника). ἐπὶ τὸ ἄκρον τοῦ ὀπισθίου τῆς ἐπωμίδος ἔσωθεν — у края задней части ефода, внутри."
  27: "κάτωθεν αὐτοῦ — ниже его. κατὰ τὴν συμβολὴν ἄνωθεν τῆς συνυφῆς — у соединения выше ткани ефода."
  28: "συνέσφιγξεν — стянул. ἵνα μὴ χαλᾶται — чтобы не отставал, не ослаблялся."
  29: "ὑποδύτης — 下に着る衣 (подризник, голубая риза под ефодом). ὅλον ὑακίνθινον — вся гиацинтовая."
  30: "περιστόμιον — 頭を通す口 (отверстие для головы). διυφασμένον συμπλεκτόν — 織り合わせて編んだ. ᾤα — 縁 (кайма). ἀδιάλυτον — неразрывное, чтобы не рвалось."
  31: "λῶμα — 裾 (кайма). ὡς ἐξανθούσης ῥόας — как цветущий гранат. ῥοΐσκοι — 飾り (гранатовые подвески)."
  32: "κώδωνες — 鈴."
  33: "κώδων καὶ ῥοΐσκος — 鈴と房. εἰς τὸ λειτουργεῖν — для служения."
  34: "χιτῶνες βύσσινοι — 亜麻布の衣 (хитоны)."
  35: "κίδαρις — 頭の被り物 (головной убор священника). μίτρα — 冠 (митра первосвященника). περισκελῆ — 下ばき (надраги)."
  36: "ζῶναι — 帯. ἔργον ποικιλτοῦ — 刺繍師の手法 (работа вышивальщика)."
  37: "πέταλον — 板 (золотая дощечка). ἀφόρισμα τοῦ ἁγίου — отделённое для святыни. Ἁγίασμα κυρίῳ — «Святыня Господня», 主の聖なるもの (ср. 28:36)."
  38: "λῶμα ὑακίνθινον — 青の紐 (гиацинтовая тесьма). ἐπικεῖσθαι ἐπὶ τὴν μίτραν ἄνωθεν — лежать на митре сверху."
