# jp-box, Исход, глава 36. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — csl-ru (jp-joc в гл. 36 нет).
# Русский Синодальный — только для понимания. Язык — современный 常体.
# ВНИМАНИЕ: у LXX своя нумерация глав 36–40, она не совпадает с Синодальным:
#   LXX 36 = пошив священных одежд (евр. 39), LXX 37 = скиния и двор (евр. 36),
#   LXX 38 = ковчег, стол, светильник, жертвенники, умывальница (евр. 37–38:8),
#   LXX 39 = счёт золота, серебра и меди и принесение всего Моисею (евр. 38:21–31; 39:32–43),
#   LXX 40 = постановка скинии и облако над ней.
# Глава 36: остаток приношений (1–7), ефод и наперсник (8–28),
# риза под ефод, хитоны, кидары, дощечка «Святыня Господня» (29–38).
# Красного и синего нет: речь Бога — в 「…」, «<j>» не ставится.
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено по базе).
# Сносок ⟨…⟩ нет: エフォド, 胸当, 祭司, 亜麻布, 青, 紫, 緋 — термины, объяснённые в гл. 25–30.

