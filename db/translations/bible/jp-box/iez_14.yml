verses:
  1: "イスラエルの長老[ちょうろう]たちのうちの数人[すうにん]がわたしのところへ来[き]て、わたしの前[まえ]に座[すわ]った。"
  2: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  3: "「人[ひと]の子[こ]よ、この者[もの]たちは心[こころ]のうちに自分[じぶん]の偶像[ぐうぞう]を置[お]き、自分[じぶん]の不法[ふほう]の罰[ばつ]を顔[かお]の前[まえ]に据[す]えている。わたしは彼[かれ]らに答[こた]えるべきだろうか。"
  4: "それゆえ、彼[かれ]らに語[かた]り、言[い]え。主[しゅ]なる神[かみ]はこう言[い]われる。イスラエルの家[いえ]の者[もの]はだれでも、自分[じぶん]の思[おも]いを心[こころ]に置[お]き、自分[じぶん]の不法[ふほう]の罰[ばつ]を顔[かお]の前[まえ]に据[す]え、預言者[よげんしゃ]のところへ来[く]るなら、その者[もの]には、わたし、主[しゅ]が、その者[もの]の思[おも]いが捕[と]らわれていることに応[おう]じて答[こた]える。"
  5: "それは、イスラエルの家[いえ]が、その思[おも]いによってわたしから遠[とお]ざかった自分[じぶん]の心[こころ]のままに、迷[まよ]い去[さ]るためである。"
  6: "それゆえ、イスラエルの家[いえ]に言[い]え。主[しゅ]なる神[かみ]はこう言[い]われる。立[た]ち返[かえ]り、あなたがたの営[いとな]みから、すべての不敬[ふけい]から離[はな]れ、あなたがたの顔[かお]をわたしに向[む]けよ。"
  7: "イスラエルの家[いえ]の者[もの]でも、イスラエルに住[す]む寄留者[きりゅうしゃ]でも、だれでもわたしから遠[とお]ざかり、心[こころ]に自分[じぶん]の思[おも]いを置[お]き、自分[じぶん]の不法[ふほう]の罰[ばつ]を顔[かお]の前[まえ]に据[す]え、わたしに問[と]うために預言者[よげんしゃ]のところへ来[く]るなら、その者[もの]には、わたし、主[しゅ]が、その者[もの]のうちに捕[と]らわれていることに応[おう]じて答[こた]える。"
  8: "わたしはその者[もの]にわたしの顔[かお]を向[む]け、彼[かれ]を荒[あ]れ野[の]とし、滅[ほろ]びとし、わたしの民[たみ]のただ中[なか]から断[た]ち切[き]る。あなたがたはわたしが主[しゅ]であることを知[し]る。"
  9: "もし預言者[よげんしゃ]が惑[まど]わされて語[かた]るなら、わたし、主[しゅ]がその預言者[よげんしゃ]を惑[まど]わしたのである。わたしは彼[かれ]に手[て]を伸[の]べ、わたしの民[たみ]イスラエルのただ中[なか]から彼[かれ]を滅[ほろ]ぼす。"
  10: "彼[かれ]らは自分[じぶん]の不法[ふほう]を負[お]う。問[と]う者[もの]の不法[ふほう]も、預言者[よげんしゃ]の不法[ふほう]も同[おな]じである。"
  11: "それは、イスラエルの家[いえ]がもはやわたしから迷[まよ]い出[で]ず、すべての罪[つみ]によって二度[にど]と汚[けが]れないためである。彼[かれ]らはわたしの民[たみ]となり、わたしは彼[かれ]らの神[かみ]となる、と主[しゅ]なる神[かみ]は言[い]われる。」"
  12: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  13: "「人[ひと]の子[こ]よ、もし地[ち]がわたしに対[たい]して罪[つみ]を犯[おか]し、わたしに背[そむ]いて背[そむ]き、わたしがそれに手[て]を伸[の]べてパンの支[ささ]えを砕[くだ]き、それに飢[う]えを送[おく]り、人[ひと]と家畜[かちく]をそれから断[た]ち切[き]るなら、"
  14: "たとえその中[なか]に、ノア、ダニエル、ヨブの三[さん]人[にん]がいても、彼[かれ]らは自分[じぶん]の義[ぎ]によって救[すく]われる、と主[しゅ]なる神[かみ]は言[い]われる。"
  15: "もしわたしがその地[ち]に悪[わる]い獣[けもの]たちを送[おく]り、それを罰[ばっ]して荒廃[こうはい]させ、獣[けもの]のゆえに通[とお]る者[もの]もいなくなるなら、"
  16: "たとえその中[なか]にこの三[さん]人[にん]がいても、わたしは生[い]きている、と主[しゅ]なる神[かみ]は言[い]われる。彼[かれ]らは息子[むすこ]も娘[むすめ]も救[すく]わず、ただ彼[かれ]らだけが救[すく]われ、地[ち]は滅[ほろ]びとなる。"
  17: "あるいは、もしわたしがその地[ち]に剣[つるぎ]を送[おく]り、『剣[つるぎ]よ、この地[ち]を通[とお]り抜[ぬ]けよ』と言[い]い、人[ひと]と家畜[かちく]をそれから断[た]ち切[き]るなら、"
  18: "たとえその中[なか]にこの三[さん]人[にん]がいても、わたしは生[い]きている、と主[しゅ]なる神[かみ]は言[い]われる。彼[かれ]らは息子[むすこ]も娘[むすめ]も救[すく]い出[だ]さず、ただ彼[かれ]らだけが救[すく]われる。"
  19: "あるいは、もしわたしがその地[ち]に死[し]を送[おく]り、血[ち]によってわたしの怒[いか]りをそれに注[そそ]ぎ、人[ひと]と家畜[かちく]をそれから断[た]ち切[き]るなら、"
  20: "たとえその中[なか]にノア、ダニエル、ヨブがいても、わたしは生[い]きている、と主[しゅ]なる神[かみ]は言[い]われる。彼[かれ]らは息子[むすこ]も娘[むすめ]も残[のこ]さず、自分[じぶん]の義[ぎ]によって自分[じぶん]の魂[たましい]を救[すく]う。」"
  21: "主[しゅ]なる神[かみ]はこう言[い]われる。「わたしがエルサレムに、剣[つるぎ]と飢[う]えと悪[わる]い獣[けもの]と死[し]という四[よっ]つの悪[わる]い裁[さば]きを送[おく]って、人[ひと]と家畜[かちく]をそれから断[た]ち切[き]るなら、"
  22: "見[み]よ、その中[なか]に残[のこ]され、救[すく]い出[だ]された者[もの]たちがいて、息子[むすこ]たちと娘[むすめ]たちをそこから連[つ]れ出[だ]す。見[み]よ、彼[かれ]らはあなたがたのところへ出[で]て来[く]る。あなたがたは彼[かれ]らの道[みち]と彼[かれ]らの思[おも]いを見[み]て、わたしがエルサレムに下[くだ]した災[わざわ]い、わたしがそれに下[くだ]したすべての災[わざわ]いについて慰[なぐさ]められる。"
  23: "彼[かれ]らはあなたがたを慰[なぐさ]める。あなたがたは彼[かれ]らの道[みち]と彼[かれ]らの思[おも]いを見[み]て、わたしがその都[みやこ]で行[おこな]ったすべてのことを、むだに行[おこな]ったのではないことを知[し]る、と主[しゅ]なる神[かみ]は言[い]われる。」"

notes:
  1: "ἄνδρες ἐκ τῶν πρεσβυτέρων τοῦ Ισραηλ — «мужи из старейшин Израиля»; ἐκάθισαν πρὸ προσώπου μου — «сели пред лицом моим»."
  2: "Вводная формула."
  3: "ἔθεντο τὰ διανοήματα αὐτῶν ἐπὶ τὰς καρδίας — «положили помышления свои на сердца»; τὴν κόλασιν τῶν ἀδικιῶν — «наказание (мучение) неправд»: в ru (МТ) «соблазн нечестия» — иное чтение; εἰ ἀποκρινόμενος ἀποκριθῶ — «отвечая, отвечу ли?» (усиление); начинается речь 3–11."
  4: "Ἄνθρωπος ἄνθρωπος — «человек человек» (евр. удвоение, «каждый»); ἐν οἷς ἐνέχεται ἡ διάνοια αὐτοῦ — «в чём запуталась мысль его» (ἐνέχω — держать, запутывать)."
  5: "ὅπως πλαγιάσῃ — «чтобы совратился (уклонился)» (πλαγιάζω); τὰς καρδίας ... τὰς ἀπηλλοτριωμένας ἀπ᾽ ἐμοῦ — «сердца, отчуждённые от Меня» (ἀπαλλοτριόω)."
  6: "Ἐπιστράφητε καὶ ἀποστρέψατε — «обратитесь и отвратитесь» (два глагола); ἀπὸ τῶν ἐπιτηδευμάτων — «от занятий (дел) ваших» (ἐπιτήδευμα); слав. добавляет «ко мне» — нет в LXX, внесено."
  7: "καὶ ἐκ τῶν προσηλύτων τῶν προσηλυτευόντων — «и из пришельцев, пришельствующих» (προσήλυτος); ἀπαλλοτριωθῇ ἀπ᾽ ἐμοῦ — «отчуждится от Меня»; τοῦ ἐπερωτῆσαι αὐτὸν ἐν ἐμοί — «чтобы вопросить его (Меня) через него»."
  8: "στηριῶ τὸ πρόσωπόν μου ἐπὶ τὸν ἄνθρωπον — «утвержу лицо Моё на человека»; θήσομαι αὐτὸν εἰς ἔρημον καὶ εἰς ἀφανισμόν — «положу его в пустыню и в опустошение»; ἐξαρῶ ἐκ μέσου τοῦ λαοῦ — «изыму из среды народа»."
  9: "ἐὰν πλανηθῇ — «если совратится»; ἐγὼ κύριος πεπλάνηκα — «Я, Господь, совратил» (perfect с результатом; ср. 3 Цар 22:23); ἀφανιῶ — «истреблю»."
  10: "λήμψονται τὴν ἀδικίαν αὐτῶν — «понесут неправду (вину) свою»; κατὰ τὸ ἀδίκημα τοῦ ἐπερωτῶντος ... ὁμοίως τῷ προφήτῃ — «по вине вопрошающего... так же и пророка»."
  11: "ὅπως μὴ πλανᾶται ἔτι — «чтобы не блуждал более»; μιαίνωνται — «осквернялись»; ἔσονταί μοι εἰς λαόν — формула завета; здесь закрывается речь."
  12: "Вводная формула; начинается речь 13–20."
  13: "γῆ ἐὰν ἁμάρτῃ μοι — «если земля согрешит Мне»; τοῦ παραπεσεῖν παράπτωμα — «чтобы пасть падением (отпасть)»; στήριγμα ἄρτου — «опору хлеба» (στήριγμα); ἐξαρῶ ἄνθρωπον καὶ κτήνη — «изыму человека и скот»."
  14: "Νωε καὶ Δανιηλ καὶ Ιωβ — ノア、ダニエル、ヨブ; ἐν τῇ δικαιοσύνῃ αὐτῶν σωθήσονται — «в правде своей спасутся»; в ru добавлено «только свои души» — в LXX нет, не внесено."
  15: "θηρία πονηρά — «звери злые»; τιμωρήσομαι αὐτήν — «накажу её»; ὁ διοδεύων — «проходящий» (διοδεύω)."
  16: "ζῶ ἐγώ — «живу Я» (клятвенная формула); εἰ υἱοὶ ἢ θυγατέρες σωθήσονται — «если сыновья или дочери спасутся» (клятвенное «если» = не спасутся); ἀλλ᾽ ἢ αὐτοὶ μόνοι — «но только они одни»."
  17: "Ῥομφαία διελθάτω διὰ τῆς γῆς — «меч, пройди по земле»: слова Господа — 『…』; ἐξαρῶ ἄνθρωπον καὶ κτῆνος."
  18: "οὐ μὴ ῥύσωνται υἱοὺς οὐδὲ θυγατέρας — «не избавят ни сыновей, ни дочерей» (ῥύομαι); αὐτοὶ μόνοι σωθήσονται."
  19: "θάνατον ἐπαποστείλω — «пошлю смерть» (ἐπαποστέλλω); ἐκχεῶ τὸν θυμόν μου ἐν αἵματι — «изолью ярость Мою в крови»; τοῦ ἐξολεθρεῦσαι — «чтобы истребить»."
  20: "ἐὰν υἱοὶ ἢ θυγατέρες ὑπολειφθῶσιν — «если сыновья или дочери останутся» (клятвенное «если»); ῥύσονται τὰς ψυχὰς αὐτῶν — «избавят души свои»; здесь закрывается речь."
  21: "τὰς τέσσαρας ἐκδικήσεις μου τὰς πονηράς — «четыре отмщения (казни) Мои злые»; ῥομφαίαν καὶ λιμὸν καὶ θηρία πονηρὰ καὶ θάνατον — «меч, голод, зверей злых и смерть»: четыре казни; начинается речь 21–23."
  22: "οἱ ἀνασεσῳσμένοι αὐτῆς — «спасённые (уцелевшие) её»; οἳ ἐξάγουσιν ... υἱοὺς καὶ θυγατέρας — «которые выведут сыновей и дочерей»; μεταμεληθήσεσθε ἐπὶ τὰ κακά — «раскаетесь (утешитесь) о бедах» (μεταμέλομαι); повтор «все беды, которые Я навёл на него»."
  23: "παρακαλέσουσιν ὑμᾶς — «утешат вас»; οὐ μάτην πεποίηκα — «не напрасно сделал Я»; здесь закрывается речь."
