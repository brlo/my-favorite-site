# jp-box, Екклесиаст, глава 4. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru); ru (Синодальный)
# только для понимания. jp-joc в Екклесиасте отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 4: притеснения под солнцем (1–3), труд и зависть (4–6), одинокий труженик (7–8),
# двое лучше одного (9–12), старый царь и бедный юноша (13–16), дом Божий (17).
# В LXX 4:17 = Синодальный 5:1: деление глав иное, держимся gr.
# Красного и синего нет: речь Екклесиаста от первого лица — без кавычек; его собственные
# слова, приведённые в тексте (8), — в 「…」; чужая речь — 「…」 (в этой главе нет).
# 〔…〕 нет: все слова в gr-lxx-byz есть.
# Сносок ⟨…⟩ нет: слова обычные (神の家 — 神殿, понятно из контекста).
# πνεῦμα в 4, 6, 16 — «ветер» (風を追う), не дух.
# jp-ni не использовался.

tr_code: jp-box
