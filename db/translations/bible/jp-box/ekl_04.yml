verses:
  1: "わたしは向[む]きを変[か]え、日[ひ]の下[もと]で行[おこな]われるすべての虐[しいた]げを見[み]た。すると、見[み]よ、虐[しいた]げられる者[もの]たちの涙[なみだ]があり、彼[かれ]らを慰[なぐさ]める者[もの]はいない。虐[しいた]げる者[もの]たちの手[て]には力[ちから]があり、彼[かれ]らを慰[なぐさ]める者[もの]はいない。"
  2: "わたしは、すでに死[し]んだ死者[ししゃ]を、今[いま]なお生[い]きている者[もの]たちよりも、ほめたたえた。"
  3: "また、まだ生[う]まれず、日[ひ]の下[もと]で行[おこな]われる悪[わる]い業[わざ]を見[み]ていない者[もの]は、その二者[ふたもの]よりも、さらに良[よ]い。"
  4: "わたしは、すべての労苦[ろうく]と、業[わざ]におけるすべての力[ちから]を見[み]た。それは友[とも]からの妬[ねた]みである。これもまた空[むな]しく、風[かぜ]を追[お]うようなものだった。"
  5: "愚[おろ]かな者[もの]は両手[りょうて]を組[く]み、自分[じぶん]の肉[にく]を食[た]べる。"
  6: "安[やす]らぎの一握[ひとにぎ]りは、労苦[ろうく]と風[かぜ]を追[お]うことの二握[ふたにぎ]りにまさる。"
  7: "わたしは向[む]きを変[か]え、日[ひ]の下[もと]の空[むな]しさを見[み]た。"
  8: "一[ひと]人[り]がいる。二[ふた]人[り]目[め]はなく、子[こ]も兄弟[きょうだい]もいない。それなのに、そのすべての労苦[ろうく]には終[お]わりがなく、その目[め]は富[とみ]に満[み]ち足[た]りない。「わたしはだれのために労苦[ろうく]し、自分[じぶん]の魂[たましい]を善[よ]いことから奪[うば]っているのか」と。これもまた空[むな]しく、悪[わる]い務[つと]めである。"
  9: "二[ふた]人[り]は一[ひと]人[り]にまさる。彼[かれ]らには、その労苦[ろうく]のうちに良[よ]い報[むく]いがあるからである。"
  10: "一[ひと]人[り]が倒[たお]れても、もう一[ひと]人[り]がその仲間[なかま]を起[お]こすからである。しかし、ひとりで倒[たお]れて、起[お]こす二[ふた]人[り]目[め]がいない者[もの]は、わざわいである。"
  11: "また、二[ふた]人[り]が共[とも]に寝[ね]れば暖[あたた]かい。ひとりでどうして暖[あたた]かくなれようか。"
  12: "また、ひとりが押[お]さえられても、二[ふた]人[り]はそれに向[む]かって立[た]つ。三[み]つ撚[よ]りの綱[つな]は、なかなか切[き]れない。"
  13: "貧[まず]しくても知恵[ちえ]のある若者[わかもの]は、もはや耳[みみ]を貸[か]すことを知[し]らない年老[としお]いた愚[おろ]かな王[おう]にまさる。"
  14: "その者[もの]は囚人[しゅうじん]の家[いえ]から出[で]て王[おう]となるからである。彼[かれ]は自分[じぶん]の王国[おうこく]で貧[まず]しく生[う]まれたのだ。"
  15: "わたしは、日[ひ]の下[もと]を歩[あゆ]むすべての生[い]きている者[もの]たちが、あの者[もの]に代[か]わって立[た]つ二人目[ふたりめ]の若者[わかもの]とともにいるのを見[み]た。"
  16: "その民[たみ]すべてに、彼[かれ]らより前[まえ]にいたすべての者[もの]にも、限[かぎ]りがない。しかし、末[すえ]の者[もの]たちもまた、その者[もの]によって喜[よろこ]びを得[え]ない。これもまた空[むな]しく、風[かぜ]を追[お]うようなものだからである。"
  17: "神[かみ]の家[いえ]へ行[い]くときには、あなたの足[あし]を守[まも]りなさい。そして、聞[き]くことに近[ちか]づきなさい。愚[おろ]かな者[もの]たちの供[そな]え物[もの]よりも、あなたの犠牲[ぎせい]は、聞[き]くことに近[ちか]づくことである。彼[かれ]らは、悪[わる]いことをしていると知[し]らないからである。"

notes:
  1: "συκοφαντίας — притеснения, вымогательства (συκοφαντία — «клевета, ложное обвинение»; слав. «оклеветания»; Синодальный «угнетения»); передано 虐[しいた]げ. οὐκ ἔστιν αὐτοῖς παρακαλῶν — нет им утешающего (παρακαλῶν, прич. от παρακαλέω); повторено дважды, как в греч. ἀπὸ χειρὸς συκοφαντούντων αὐτοὺς ἰσχύς — от руки притесняющих их сила."
  2: "ἐπῄνεσα — похвалил (ἐπαινέω). τοὺς τεθνηκότας τοὺς ἤδη ἀποθανόντας — умерших, уже умерших (усиление, как в греч.). ὑπὲρ τοὺς ζῶντας, ὅσοι αὐτοὶ ζῶσιν ἕως τοῦ νῦν — более живых, которые живут доныне."
  3: "ἀγαθὸς ὑπὲρ τοὺς δύο τούτους — лучше обоих этих. ὅστις οὔπω ἐγένετο — кто ещё не был (γίνομαι — рождаться, быть). τὸ ποίημα τὸ πονηρόν — злое дело."
  4: "πᾶσαν ἀνδρείαν τοῦ ποιήματος — всякое умение и успех в деле (ἀνδρεία — «мужество»; здесь о силе и мастерстве, ср. 2:21). ζῆλος ἀνδρὸς ἀπὸ τοῦ ἑταίρου αὐτοῦ — зависть человека от ближнего его (ἀπό — «от»; смысл — зависть к ближнему). προαίρεσις πνεύματος — 風を追う (см. 2:11); πνεῦμα здесь — ветер."
  5: "περιέλαβεν τὰς χεῖρας αὐτοῦ — сложил руки свои (περιλαμβάνω — обхватить). ἔφαγεν τὰς σάρκας αὐτοῦ — съел плоть свою (образ праздной гибели, ср. Притч 6:10–11)."
  6: "πλήρωμα δρακὸς ἀναπαύσεως — полная горсть покоя (δράξ — горсть; 一握[ひとにぎ]り). ὑπὲρ πλήρωμα δύο δρακῶν — более двух горстей. προαίρεσις πνεύματος — 風を追う (πνεῦμα — ветер)."
  7: "ἐπέστρεψα — обратился. ματαιότητα ὑπὸ τὸν ἥλιον — суету под солнцем."
  8: "εἷς, καὶ οὐκ ἔστιν δεύτερος — один, и нет второго. οὐκ ἔστιν περασμὸς τῷ παντὶ μόχθῳ — нет предела всему труду (περασμός — «предел, конец»). ὀφθαλμὸς αὐτοῦ οὐκ ἐμπίπλαται πλούτου — глаз его не насыщается богатством. στερίσκω τὴν ψυχήν μου ἀπὸ ἀγαθωσύνης — лишаю душу мою блага (στερέω — лишать; 魂[たましい]). περισπασμὸς πονηρός — злое занятие. Собственные слова — в 「…」."
  9: "ἀγαθοὶ οἱ δύο ὑπὲρ τὸν ἕνα — двое лучше одного. μισθὸς ἀγαθός — добрая награда (μισθός; 報[むく]い)."
  10: "ἐὰν πέσωσιν — если упадут. ἐγερεῖ τὸν μέτοχον αὐτοῦ — поднимет товарища своего (ἐγείρω; μέτοχος — «участник», слав. «причастник»; 仲間[なかま]). οὐαὶ αὐτῷ τῷ ἑνί — горе одному."
  11: "ἐὰν κοιμηθῶσιν δύο — если лягут двое (κοιμάομαι — спать, лежать). θέρμη αὐτοῖς — тепло им. πῶς θερμανθῇ — как согреется (θερμαίνομαι)."
  12: "ἐπικραταιωθῇ — одолеет (ἐπικραταιόω — усиливаться против). οἱ δύο στήσονται κατέναντι αὐτοῦ — двое станут против него. σπαρτίον τὸ ἔντριτον — вервь втрое скрученная (σπαρτίον — верёвка; ἔντριτος — тройной); 三[み]つ撚[よ]りの綱[つな]."
  13: "παῖς πένης καὶ σοφός — бедный и мудрый отрок (παῖς — «отрок, слуга»; 若者[わかもの]). βασιλέα πρεσβύτερον καὶ ἄφρονα — царя старого и глупого. ὃς οὐκ ἔγνω τοῦ προσέχειν ἔτι — который не умеет внимать (советам) более."
  14: "ἐξ οἴκου τῶν δεσμίων ἐξελεύσεται τοῦ βασιλεῦσαι — из дома узников выйдет, чтобы царствовать (δεσμίος — узник; 囚人[しゅうじん]). ἐν βασιλείᾳ αὐτοῦ ἐγεννήθη πένης — в царстве своём родился бедным."
  15: "τοὺς ζῶντας τοὺς περιπατοῦντας ὑπὸ τὸν ἥλιον — живущих, ходящих под солнцем. μετὰ τοῦ νεανίσκου τοῦ δευτέρου — с юношей вторым (ὁ δεύτερος — «второй», т. е. преемник; 二人目[ふたりめ]). ὃς στήσεται ἀντ αὐτοῦ — который станет вместо него."
  16: "οὐκ ἔστιν περασμὸς τῷ παντὶ λαῷ — нет предела всему народу. ὅσοι ἐγένοντο ἔμπροσθεν αὐτῶν — сколько их было прежде них. οἱ ἔσχατοι οὐκ εὐφρανθήσονται ἐν αὐτῷ — последние не возрадуются о нём. προαίρεσις πνεύματος — 風を追う (πνεῦμα — ветер)."
  17: "Φύλαξον πόδα σου — храни ногу твою, т. е. следи за поведением при входе в храм. ἐγγὺς τοῦ ἀκούειν — близок к слушанию. ὑπὲρ δόμα τῶν ἀφρόνων θυσία σου — более дара глупых жертва твоя (эллипсис; слав. «паче даяния безумных жертва твоя»); θυσία — 犠牲[ぎせい]. οὔκ εἰσιν εἰδότες τοῦ ποιῆσαι κακόν — они не знают, что делают зло (слав. «не ведят, яко творят зло»). В Синодальном это 5:1 — иное деление глав."
