verses:
  1: "ダビデはロスから少[すこ]し進[すす]んだ。見[み]ると、メフィボシェトの若者[わかもの]ツィバが、二頭[にとう]のろばに荷[に]を負[お]わせて、彼[かれ]を迎[むか]えに来[き]ていた。ろばの上[うえ]には、パン二百個[にひゃくこ]、干[ほ]しぶどう百房[ひゃくふさ]、ナツメヤシの実百房、ぶどう酒の皮袋[かわぶくろ]が載[の]せてあった。"
  2: "王[おう]はツィバに言[い]った。「これは何[なん]のためだ。」ツィバが言[い]った。「ろばは王[おう]の家[いえ]の者[もの]が乗[の]るため、パンとナツメヤシの実は若者[わかもの]たちの食[た]べ物[もの]、ぶどう酒は荒野[こうや]で疲[つか]れ果[は]てた者[もの]が飲[の]むためです。」"
  3: "王[おう]は言[い]った。「あなたの主人[しゅじん]の子[こ]はどこにいるのか。」ツィバは王[おう]に言[い]った。「見[み]てください、エルサレムに座[すわ]っております。『今日[きょう]、イスラエルの家[いえ]はすべて、父[ちち]の王国[おうこく]をわたしに返[かえ]す』と言[い]っておりますから。」"
  4: "王[おう]はツィバに言[い]った。「見[み]よ、メフィボシェトに属[ぞく]するものはすべて、おまえのものだ。」ツィバは礼[れい]をして言[い]った。「わが主人[しゅじん]、王[おう]よ。あなたの目[め]にかなう者[もの]となれますように。」"
  5: "ダビデ王[おう]はバフリムまで来[き]た。すると、そこからサウルの家[いえ]の一族[いちぞく]の者[もの]が出[で]て来[き]た。名[な]をシメイといい、ゲラの子[こ]である。彼は出て来て、歩[ある]きながら呪[のろ]っていた。"
  6: "シメイはダビデと、ダビデ王[おう]のすべてのしもべに石[いし]を投[な]げつけた。民[たみ]はすべて、勇士[ゆうし]たちもみな、王[おう]の右[みぎ]と左[ひだり]にいた。"
  7: "シメイは呪[のろ]いながらこう言[い]った。「出[で]て行[い]け、出て行け。血[ち]の人[ひと]、不法[ふほう]の人よ。"
  8: "主[しゅ]はサウルの家[いえ]の血[ち]をことごとくあなたに返[かえ]された。あなたが彼[かれ]に代[か]わって王[おう]となったからだ。主は王国[おうこく]をあなたの子[こ]アブサロムの手[て]に渡[わた]された。見[み]よ、あなたは自分[じぶん]の悪[あく]の中[なか]にいる。あなたは血の人[ひと]だからだ。」"
  9: "ツルヤの子[こ]アベシャは王[おう]に言[い]った。「なぜ、この死[し]んだ犬[いぬ]が、わが主人[しゅじん]である王[おう]を呪[のろ]うのですか。すぐに参[まい]って、彼[かれ]の首[くび]を取[と]って来[き]ましょう。」"
  10: "王[おう]は言[い]った。「ツルヤの子[こ]らよ、わたしとあなたがたに何[なん]の関係[かんけい]があるのか。彼[かれ]を放[はな]っておけ。そうさせておくがよい。主[しゅ]が彼に『ダビデを呪[のろ]え』と言[い]われたのだ。だれが『なぜそうしたのか』と言[い]えようか。」"
  11: "ダビデはアベシャと、自分[じぶん]のすべてのしもべに言[い]った。「見[み]よ、わたしの胎[はら]から出[で]たわたしの子[こ]が、わたしの命[いのち]を求[もと]めている。まして今[いま]、このベニヤミン人[じん]はなおさらだ。彼[かれ]を放っておいて、呪[のろ]わせなさい。主[しゅ]が彼にそう言[い]われたのだから。"
  12: "もしかすると、主[しゅ]はわたしの卑[ひく]められた姿[すがた]をご覧[らん]になり、今日[きょう]の彼[かれ]の呪[のろ]いに代[か]えて、わたしに良[よ]いものを返[かえ]してくださるかもしれない。」"
  13: "ダビデとその部下[ぶか]たちは道[みち]を進[すす]んだ。シメイは山[やま]の側面[そくめん]を、彼[かれ]のすぐそばについて歩[ある]き、呪いながら、彼の横[よこ]から石[いし]を投[な]げ、土[つち]をまき散[ち]らした。"
  14: "王[おう]と、彼[かれ]とともにいたすべての民[たみ]は、疲[つか]れ果[は]ててそこへ来[き]て、そこで息[いき]を吹[ふ]き返[かえ]した。"
  15: "アブサロムと、イスラエルのすべての者[もの]はエルサレムに入[はい]った。アヒトフェルも彼[かれ]とともにいた。"
  16: "ダビデの友[とも]であるアルキ人[じん]フシャイがアブサロムのもとに来[き]たとき、フシャイはアブサロムに言[い]った。「王[おう]さま、万歳[ばんざい]。」"
  17: "アブサロムはフシャイに言[い]った。「これがあなたの友[とも]に対する情[なさ]けというものか。なぜ友とともに去[さ]らなかったのか。」"
  18: "フシャイはアブサロムに言[い]った。「いいえ。主[しゅ]が、この民[たみ]が、イスラエルのすべての者[もの]が選[えら]んだ方[かた]に、わたしは従[したが]います。その方とともに留[とど]まります。"
  19: "第二[だいに]に、わたしはだれに仕[つか]えるべきでしょうか。彼[かれ]の子[こ]にではありませんか。あなたの父[ちち]に仕[つか]えたように、あなたにもそのまま仕えます。」"
  20: "アブサロムはアヒトフェルに言[い]った。「あなたがたで相談[そうだん]して、われわれが何[なに]をするか決[き]めてくれ。」"
  21: "アヒトフェルはアブサロムに言[い]った。「父上[ちちうえ]が家[いえ]を守[まも]らせるために残[のこ]したそばめたちのところへ入[はい]りなさい。イスラエルはすべて、あなたが父[ちち]を辱[はずかし]めたと聞[き]いて、あなたとともにいるすべての者[もの]の手[て]が強[つよ]くなるでしょう。」"
  22: "人々[ひとびと]はアブサロムのために屋上[おくじょう]に天幕[てんまく]を張[は]った。アブサロムは、イスラエルすべての目[め]の前[まえ]で、父[ちち]のそばめたちのところへ入[はい]った。"
  23: "初[はじ]めのころ、アヒトフェルが与[あた]える勧[すす]めは、神[かみ]のことばを問[と]うたときの答[こた]えのようであった。アヒトフェルの勧めは、ダビデにとってもアブサロムにとっても、そのとおりであった。"

notes:
  1: "παρῆλθεν βραχύ τι ἀπὸ τῆς Ροως — «прошёл немного от Роса» (Ρως — вершина/скала близ Иерусалима; слав. «от роса»). ζεῦγος ὄνων ἐπισεσαγμένων — «пара навьюченных ослов». σταφίς — связка сушёного винограда, изюм; φοῖνιξ — финик, плод пальмы (в ru «смоквы» — по МТ, в LXX и слав. финики). νεβελ οἴνου — мех вина."
  2: "Τί ταῦτά σοι — «что это тебе?». τὰ ὑποζύγια τῇ οἰκίᾳ τοῦ βασιλέως τοῦ ἐπικαθῆσθαι — «ослы для дома царя, чтобы садиться», т. е. для езды; слав. «на яждение» — тёмное место, вероятно порча текста, смысл дан по LXX. παιδάρια — отроки, слуги. ἐκλελυμένοις — ослабевшим, утомлённым."
  3: "ὁ υἱὸς τοῦ κυρίου σου — «сын господина твоего» (Мемфивосфей). ἐπιστρέψουσίν μοι ὁ οἶκος Ισραηλ τὴν βασιλείαν — «дом Израилев возвратит мне царство»; слав. добавляет «весь» — в gr этого слова нет. Слова Мемфивосфея переданы вложенной речью 『…』."
  4: "προσκυνήσας — поклонившись. Εὕροιμι χάριν ἐν ὀφθαλμοῖς σου — «обрёл бы я благодать в глазах твоих» (оптатив); слав. «да обрящу благодать». κύριέ μου βασιλεῦ — «господин мой, царь» (звательный)."
  5: "ἕως Βαουριμ — до Баурима (слав. «вафирима»). ἐκ συγγενείας οἴκου Σαουλ — «из родства дома Саулова». Σεμει υἱὸς Γηρα — Семей, сын Геры. καταρώμενος — проклиная (καταράομαι)."
  6: "λίθαζεν — бросал камнями (λιθάζω). πάντες οἱ δυνατοί — все сильные, храбрые; ἐκ δεξιῶν καὶ ἐξ εὐωνύμων — по правую и левую сторону. В gr причастие «бросая камнями» продолжает предложение ст. 5; по-японски разделено на самостоятельное предложение."
  7: "Ἔξελθε ἔξελθε — «уходи, уходи» (повтор). ἀνὴρ αἱμάτων — «муж кровей», т. е. кровопийца; ἀνὴρ ὁ παράνομος — беззаконник, преступник."
  8: "ἐπέστρεψεν ἐπὶ σὲ κύριος πάντα τὰ αἵματα — «возвратил на тебя Господь всю кровь». ἐβασίλευσας ἀντ᾽ αὐτοῦ — «ты воцарился вместо него». ἐν τῇ κακίᾳ σου — «в злобе твоей», т. е. в беде, которую ты сам навлёк на себя. Речь Семея, начатая в ст. 7, заканчивается здесь."
  9: "ὁ κύων ὁ τεθνηκώς — «мёртвый пёс» (κύων). διαβήσομαι δὴ καὶ ἀφελῶ τὴν κεφαλήν — «перейду же и отниму голову его» (ἀφαιρέω); слав. «отиму главу его»."
  10: "Τί ἐμοὶ καὶ ὑμῖν, υἱοὶ Σαρουιας — «что мне и вам, сыны Саруины» (семитский оборот отказа). ἄφετε αὐτὸν καὶ οὕτως καταράσθω — «оставьте его, и так пусть проклинает». ὅτι κύριος εἶπεν αὐτῷ — «ибо Господь сказал ему»; слав. «рече ему проклинати давида»."
  11: "ὁ υἱὸς τοῦ Ιεμινι — «сын Иеминия», т. е. вениамитянин (Семей). ζητεῖ τὴν ψυχήν μου — «ищет души моей», т. е. жизни. ἄφετε αὐτὸν καταρᾶσθαι — «оставьте его проклинать»; речь Давида продолжается в ст. 12."
  12: "εἴ πως ἴδοι κύριος — «может быть, увидит Господь» (εἴ πως с оптативом). ἐν τῇ ταπεινώσει μου — «в уничижении моём» (ταπείνωσις). ἀντὶ τῆς κατάρας αὐτοῦ — «вместо проклятия его». Стих заканчивает речь, начатую в 11."
  13: "ἐκ πλευρᾶς τοῦ ὄρους — «со стороны горы». ἐχόμενα αὐτοῦ — «близ него», рядом. λιθάζων ἐν λίθοις ἐκ πλαγίων αὐτοῦ — «бросая камни с боков его». τῷ χοὶ πάσσων — тёмное место (вероятно, χοῦν πάσσων, «сыпля прах»); слав. «перстию сыпая»."
  14: "ἐκλελυμένοι — утомлённые, ослабевшие (ἐκλύω). ἀνέψυξαν — «освежились, отдохнули» (ἀναψύχω); слав. «препочиша ту»."
  15: "πᾶς ἀνὴρ Ισραηλ — «всякий муж Израиля», т. е. все израильтяне. Ахитофел пришёл в Иерусалим вместе с Авессаломом."
  16: "Χουσι ὁ Αρχι — Хусий Архитянин (Αρχι — этникон, а не «первый»); слав. понял как «первый» («хусий первый друг давидов») — ошибка перевода. ἑταῖρος Δαυιδ — друг Давида. Ζήτω ὁ βασιλεύς — «да живёт царь» (приветственное восклицание); в ru удвоено, в gr и слав. один раз."
  17: "Τοῦτο τὸ ἔλεός σου — «это милость твоя?» (вопрос с оттенком укора). ἵνα τί οὐκ ἀπῆλθες — «почему не ушёл ты». μετὰ τοῦ ἑταίρου σου — «с другом твоим», т. е. с Давидом."
  18: "κατόπισθεν οὗ ἐξελέξατο κύριος — «за тем, кого избрал Господь» (κατόπισθεν — вслед, за). αὐτῷ ἔσομαι — «его буду», т. е. буду на его стороне. καθήσομαι — «сяду, останусь». Речь продолжается в ст. 19."
  19: "τὸ δεύτερον — «во-вторых». τίνι ἐγὼ δουλεύσω — «кому я буду служить?». οὐχὶ ἐνώπιον τοῦ υἱοῦ αὐτοῦ — «не пред сыном ли его?». καθάπερ ἐδούλευσα ἐνώπιον τοῦ πατρός σου — «как служил я пред отцом твоим»; слав. «якоже работах пред отцем твоим»."
  20: "Φέρετε ἑαυτοῖς βουλήν — «принесите себе совет» (мн. ч.; слав. «дадите себе совет»). τί ποιήσωμεν — «что сделаем?»."
  21: "παλλακαί — наложницы, побочные жёны. κατέλιπεν φυλάσσειν τὸν οἶκον — «оставил охранять дом». κατῄσχυνας — «посрамил» (καταισχύνω). ἐνισχύσουσιν αἱ χεῖρες — «укрепятся руки», т. е. ободрятся, осмелеют."
  22: "ἔπηξαν τὴν σκηνήν — «поставили шатёр» (πήγνυμι). ἐπὶ τὸ δῶμα — на кровлю, на плоскую крышу. κατ᾽ ὀφθαλμοὺς παντὸς Ισραηλ — «пред глазами всего Израиля»."
  23: "ἡ βουλὴ Αχιτοφελ ... ὃν τρόπον ἐπερωτήσῃ ἐν λόγῳ τοῦ θεοῦ — «совет Ахитофела... каким образом вопросил бы кто Бога в слове»; смысл: его совет принимали как ответ Божий (слав. «имже образом вопросил бы кто Бога о словеси»). καί γε τῷ Δαυιδ καί γε τῷ Αβεσσαλωμ — «и Давиду, и Авессалому»; слав. «и иже давиду, и иже авессалому»."
