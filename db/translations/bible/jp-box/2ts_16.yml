# jp-box, 2-я Царств, глава 16. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); второй свидетель церковного текста —
# церковнославянский (csl-ru), по новому паритету (docs/japanese-bible.md,
# «Паритет LXX и церковнославянского»); ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге нет; jp-ni (под авторским правом) не использовался.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 16: Сива и Мемфивосфей (1–4); Семей проклинает Давида в Бахуриме (5–14);
# Хусий у Авессалома (15–19); совет Ахитофела о наложницах отца (20–23).
# Речи — 「…」: царь (2, 3, 4, 10, 11–12), Сива (2, 3, 4), Семей (7–8),
# Авесса (9), Хусий (16, 18–19), Авессалом (17, 20), Ахитофел (21).
# Вложенная речь — 『…』: слова Мемфивосфея в передаче Сивы (3), слово Господне
# и укор людям в передаче Давида (10).
# Непрерывная речь Давида 11–12 и Хусия 18–19 не закрывается на границах стихов.
# Нумерация по gr: 23 стиха, совпадает с csl/ru.
# 〔…〕 нет: на месте каждого стиха в gr-lxx-byz есть текст; слав. слова и фразы,
# которых нет в LXX, внесены в основной текст без скобок (отмечены в notes).
# Сносок ⟨…⟩ нет: новых терминов в главе нет (天幕, 勇士, そばめ уже в корпусе).
# Красного нет.
# jp-ni не использовался.

