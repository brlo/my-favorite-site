verses:
  0: "指揮者[しきしゃ]に。歌[うた]をもって。ダビデの詩[うた]。"
  1: "神[かみ]よ、わたしの願[ねが]いを聞[き]き、わたしの祈[いの]りに耳[みみ]を傾[かたむ]けてください。"
  2: "地[ち]の果[は]てから、わたしはあなたに呼[よ]ばわった。わたしの心[こころ]が沈[しず]んでいるときである。あなたはわたしを岩[いわ]の上[うえ]に高[たか]く上[あ]げられた。"
  3: "あなたはわたしを導[みちび]き、わたしの望[のぞ]みとなられた。敵[てき]の前[まえ]にある強[つよ]い塔[とう]となられた。"
  4: "わたしはとこしえにあなたの住[す]まいに宿[やど]り、あなたの翼[つばさ]の陰[かげ]に覆[おお]われる。"
  5: "神[かみ]よ、あなたはわたしの誓[ちか]いを聞[き]き、あなたの名[な]を恐[おそ]れる者[もの]に嗣業[しぎょう]を与[あた]えられた。"
  6: "あなたは王[おう]の日[ひ]に日[ひ]を加[くわ]え、その年[とし]を代[よ]々[よ]に延[の]ばされる。"
  7: "王[おう]はとこしえに神[かみ]の前[まえ]に住[す]む。その恵[めぐ]みと真[しん]実[じつ]とを、だれが求[もと]めるだろうか。"
  8: "こうして、わたしは日[ひ]ごとに誓[ちか]いを果[は]たしながら、世[よ]々[よ]にあなたの名[な]をほめたたえる。"

notes:
  0: "Εἰς τὸ τέλος, ἐν ὕμνοις· τῷ Δαυιδ — 指揮者に。歌をもって。ダビデの歌 (εἰς τὸ τέλος — «в конец», начальнику хора; ἐν ὕμνοις — «в гимнах»)."
  1: "Εἰσάκουσον… τῆς δεήσεώς μου — 願いを聞き (δέησις — «прошение»). πρόσχες τῇ προσευχῇ μου — 祈りに耳を傾けてください (προσέχω — «внимать»)."
  2: "ἀπὸ τῶν περάτων τῆς γῆς πρὸς σὲ ἐκέκραξα — 地の果てからあなたに呼ばわった (πέρατα — «пределы»). ἐν τῷ ἀκηδιάσαι τὴν καρδίαν μου — 心が沈んでいるとき (ἀκηδιάω — «унывать, цепенеть»; слав. «внегда уныти сердцу моему»). ἐν πέτρᾳ ὕψωσάς με — 岩の上に高く上げられた (πέτρα — 岩, как по корпусу)."
  3: "ὡδήγησάς με — あなたはわたしを導き (ὁδηγέω). ἐγενήθης ἐλπίς μου — わたしの望みとなられた. πύργος ἰσχύος ἀπὸ προσώπου ἐχθροῦ — 敵の前にある強い塔 (πύργος — «башня»; ἰσχύς — «крепость»)."
  4: "παροικήσω ἐν τῷ σκηνώματί σου εἰς τοὺς αἰῶνας — とこしえにあなたの住まいに宿り (σκήνωμα — «жилище, скиния»). σκεπασθήσομαι ἐν σκέπῃ τῶν πτερύγων σου — 翼の陰に覆われる (σκέπη — «покров»)."
  5: "εἰσήκουσας τῶν εὐχῶν μου — わたしの誓いを聞き (εὐχή — «обет»). ἔδωκας κληρονομίαν τοῖς φοβουμένοις τὸ ὄνομά σου — 名を恐れる者に嗣業を与えられた (κληρονομία — 嗣業, как по корпусу)."
  6: "ἡμέρας ἐφ᾽ ἡμέρας βασιλέως προσθήσεις — 王の日に日を加え (προστίθημι — «прибавлять»). ἔτη αὐτοῦ ἕως ἡμέρας γενεᾶς καὶ γενεᾶς — その年を代々に延ばされる (γενεά — «род»)."
  7: "διαμενεῖ εἰς τὸν αἰῶνα ἐνώπιον τοῦ θεοῦ — とこしえに神の前に住む (διαμένω — «пребывать»). ἔλεος καὶ ἀλήθειαν αὐτοῦ τίς ἐκζητήσει — その恵みと真実とを、だれが求めるだろうか (риторический вопрос: верность Божия несомненна; ἐκζητέω — «взыскивать»)."
  8: "οὕτως ψαλῶ τῷ ὀνόματί σου εἰς τὸν αἰῶνα τοῦ αἰῶνος — こうして世々にあなたの名をほめたたえる (εἰς τὸν αἰῶνα τοῦ αἰῶνος — «во век века»). τοῦ ἀποδοῦναί με τὰς εὐχάς μου ἡμέραν ἐξ ἡμέρας — 日ごとに誓いを果たしながら (ἀποδίδωμι — «воздавать»)."
