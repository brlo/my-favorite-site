# jp-box, 1 Маккавейская, глава 14. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; совпадает с gr (49 стихов).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: 1–3 пленение Димитрия Арсаком; 4–15 похвала Симону и мир в стране
# («каждый под своей виноградной лозой»); 16–23 Рим и Спарта чтят Симона, письмо
# спартанцев; 24–26 щит в Рим и решение народа; 27–49 постановление на медных
# досках: Симон — вождь и первосвященник «доколе восстанет Пророк верный».
# Голоса: 21–23 (письмо спартанцев), 25 (слова народа), 27–45 (постановление) —
# 「…». В 26 клауза о медных досках и столпах — по LXX здесь, у слав. в 27.
#
tr_code: jp-box
book: 1mak
chapter: 14
draft: true

verses:
  1: "百七十二年[ひゃくななじゅうにねん]、デメトリオス王[おう]は自分[じぶん]の軍勢[ぐんぜい]を集[あつ]め、トリュフォンと戦[たたか]うために、自分[じぶん]の助[たす]けを得[え]ようとメディアへ行[い]った。"
  2: "ペルシアとメディアの王[おう]アルサケスは、デメトリオスが自分[じぶん]の境[さかい]に入[はい]ったと聞[き]き、自分[じぶん]の長[ちょう]の一人[ひとり]を送[おく]って、彼[かれ]を生[い]きたまま捕[と]らえさせた。"
  3: "彼[かれ]は行[い]ってデメトリオスの陣営[じんえい]を打[う]ち、彼[かれ]を捕[と]らえてアルサケスのもとへ連[つ]れて行[い]き、彼[かれ]を牢[ろう]に入[い]れた。"
  4: "ユダの地[ち]はシモンのすべての日[ひ]、静[しず]まり、彼[かれ]は自分[じぶん]の民族[みんぞく]のために良[よ]いものを求[もと]めた。彼[かれ]の権威[けんい]と栄光[えいこう]はすべての日[ひ]、彼[かれ]らに喜[よろこ]ばれた。"
  5: "彼[かれ]は自分[じぶん]のすべての栄光[えいこう]に加[くわ]えて、ヤッファを港[みなと]として取[と]り、海[うみ]の島々[しまじま]への入口[いりぐち]とした。"
  6: "彼[かれ]は自分[じぶん]の民族[みんぞく]の境[さかい]を広[ひろ]げ、その国[くに]を掌握[しょうあく]した。"
  7: "彼[かれ]は多[おお]くの捕虜[ほりょ]を集[あつ]め、ガザラとベテズルとアクラを支配[しはい]し、そこから汚[けが]れを取[と]り除[のぞ]き、彼[かれ]に立[た]ち向[む]かう者[もの]はいなかった。"
  8: "彼[かれ]らは平和[へいわ]のうちに自分[じぶん]の土地[とち]を耕[たがや]し、地[ち]はその産物[さんぶつ]を、野[の]の木[き]はその実[み]を与[あた]えた。"
  9: "長老[ちょうろう]たちは広場[ひろば]に座[すわ]し、皆[みな]が良[よ]いことについて語[かた]り合[あ]い、若者[わかもの]たちは栄光[えいこう]と戦[たたか]いの衣[ころも]をまとった。"
  10: "彼[かれ]は町々[まちまち]に食糧[しょくりょう]を供給[きょうきゅう]し、それらを堅固[けんご]な備[そな]えのある所[ところ]とし、その栄光[えいこう]の名[な]が地[ち]の果[は]てまで告[つ]げられた。"
  11: "彼[かれ]は地[ち]に平和[へいわ]を築[きず]き、イスラエルは大[おお]きな喜[よろこ]びをもって喜[よろこ]んだ。"
  12: "それぞれが自分[じぶん]のぶどうの木[き]と自分[じぶん]のいちじくの木[き]の下[した]に座[すわ]し、彼[かれ]らを恐[おそ]れさせる者[もの]はいなかった。"
  13: "彼[かれ]らと戦[たたか]う者[もの]は地[ち]に尽[つ]き、その日々[ひび]に王[おう]たちは砕[くだ]かれた。"
  14: "彼[かれ]は自分[じぶん]の民[たみ]のすべての低[ひく]い者[もの]たちを支[ささ]え、律法[りっぽう]を求[もと]め、不法[ふほう]な者[もの]と悪[わる]い者[もの]をすべて除[のぞ]いた。"
  15: "彼[かれ]は聖所[せいしょ]を重[おも]んじ、聖所[せいしょ]の器[うつわ]を増[ふ]やした。"
  16: "ヨナタンが死[し]んだことがローマでも、スパルタにまで聞[き]こえ、彼[かれ]らは非常[ひじょう]に悲[かな]しんだ。"
  17: "彼[かれ]らは、兄弟[きょうだい]シモンが彼[かれ]の代[か]わりに大祭司[だいさいし]となり、その地方[ちほう]とそこにある町々[まちまち]を支配[しはい]していると聞[き]くと、"
  18: "彼[かれ]と友情[ゆうじょう]と同盟[どうめい]を新[あら]たにするために、銅[どう]の板[いた]に書[か]いて彼[かれ]に送[おく]った。それは彼[かれ]らが兄弟[きょうだい]ユダとヨナタンと結[むす]んだものであった。"
  19: "それらはエルサレムの集会[しゅうかい]の前[まえ]で読[よ]み上[あ]げられた。"
  20: "これは、スパルタ人[じん]が、スパルタ人[じん]の長[ちょう]たちとその町[まち]から、大祭司[だいさいし]シモンと、長老[ちょうろう]たちと祭司[さいし]たちと、ユダヤ人[じん]の残[のこ]りの民[たみ]である兄弟[きょうだい]たちに送[おく]った手紙[てがみ]の写[うつ]しである。"
  21: "「われわれの民[たみ]に送[おく]られた使節[しせつ]たちは、あなたがたの栄光[えいこう]と名誉[めいよ]についてわれわれに告[つ]げ、われわれは彼[かれ]らの到着[とうちゃく]を喜[よろこ]んだ。"
  22: "われわれは彼[かれ]らが民[たみ]の議会[ぎかい]で述[の]べたことを書[か]き記[しる]した。アンティオコスの子[こ]ヌメニオスとヤソンの子[こ]アンティパトロス、ユダヤ人[じん]の使節[しせつ]が、われわれとの友情[ゆうじょう]を新[あら]たにするためにわれわれのもとへ来[き]た。"
  23: "民[たみ]はその者[もの]たちを栄誉[えいよ]をもって受[う]け入[い]れ、彼[かれ]らの言葉[ことば]の写[うつ]しを、スパルタ人[じん]の民[たみ]の記念[きねん]となるよう、民[たみ]の公[おおやけ]の書[しょ]に置[お]くことを喜[よろこ]んだ。その写[うつ]しは大祭司[だいさいし]シモンに書[か]き送[おく]った。」"
  24: "これらの後[あと]、シモンはヌメニオスを、千[せん]ムナの重[おも]さの大[おお]きな金[きん]の盾[たて]を持[も]たせてローマへ送[おく]り、彼[かれ]らとの同盟[どうめい]を確立[かくりつ]しようとした。"
  25: "民[たみ]がこれらの言葉[ことば]を聞[き]くと、彼[かれ]らは言[い]った。「シモンとその子[こ]らに、どんな感謝[かんしゃ]を返[かえ]せばよいのか。」"
  26: "彼[かれ]自身[じしん]とその兄弟[きょうだい]たち、父[ちち]の家[いえ]が固[かた]く立[た]っていたからである。彼[かれ]らはイスラエルの敵[てき]を彼[かれ]らから遠[とお]ざけ、彼[かれ]に自由[じゆう]を確立[かくりつ]した。そして人[ひと]々[びと]はこれを銅[どう]の板[いた]に書[か]き記[しる]し、シオンの山[やま]の柱[はしら]に据[す]えた。"
  27: "これはその記録[きろく]の写[うつ]しである。「エルルの月[つき]の十八日[じゅうはちにち]、百七十二年[ひゃくななじゅうにねん]、大祭司[だいさいし]シモンの第三年[だいさんねん]、サラメルにおいて、"
  28: "祭司[さいし]たちと民[たみ]、民族[みんぞく]の長[ちょう]たちとその地方[ちほう]の長老[ちょうろう]たちの大[おお]きな集[つど]いにおいて、われわれに知[し]らされた。"
  29: "この地方[ちほう]にしばしば戦[たたか]いが起[お]こったが、マタティアの子[こ]で、ヤリブの子[こ]らの祭司[さいし]であるシモンとその兄弟[きょうだい]たちは、自分[じぶん]たちを危険[きけん]にさらし、自分[じぶん]たちの聖所[せいしょ]と律法[りっぽう]が立[た]つように、自分[じぶん]たちの民族[みんぞく]の敵[てき]に立[た]ち向[む]かい、大[おお]きな栄光[えいこう]をもって自分[じぶん]たちの民族[みんぞく]を輝[かがや]かせた。"
  30: "ヨナタンは彼[かれ]らの民族[みんぞく]を集[あつ]め、彼[かれ]らの大祭司[だいさいし]となり、自分[じぶん]の民[たみ]に加[くわ]えられた。"
  31: "彼[かれ]らの敵[てき]は彼[かれ]らの地方[ちほう]に入[はい]り、彼[かれ]らの聖所[せいしょ]に手[て]を伸[の]ばそうと望[のぞ]んだ。"
  32: "その時[とき]、シモンは立[た]ち上[あ]がり、自分[じぶん]の民族[みんぞく]のために戦[たたか]い、自分[じぶん]の多[おお]くの財[ざい]を費[つい]やし、自分[じぶん]の民族[みんぞく]の軍勢[ぐんぜい]の者[もの]たちに武器[ぶき]を備[そな]えさせ、彼[かれ]らに報酬[ほうしゅう]を与[あた]えた。"
  33: "彼[かれ]はユダヤの町々[まちまち]と、ユダヤの境[さかい]にあるベテズルを堅固[けんご]にした。そこには以前[いぜん]、敵[てき]の武器[ぶき]があった。彼[かれ]はそこにユダヤ人[じん]を守備隊[しゅびたい]として置[お]いた。"
  34: "また、海辺[うみべ]のヤッファと、アゾトの境[さかい]にあるガザラを堅固[けんご]にした。そこには以前[いぜん]、敵[てき]が住[す]んでいた。彼[かれ]はそこにユダヤ人[じん]を住[す]まわせ、それらを整[ととの]えるのに必要[ひつよう]なすべてのものをそこに置[お]いた。"
  35: "民[たみ]はシモンの誠実[せいじつ]さと、自分[じぶん]の民族[みんぞく]のために行[おこな]おうと計画[けいかく]した栄光[えいこう]を見[み]て、彼[かれ]を自分[じぶん]たちの指導者[しどうしゃ]また大祭司[だいさいし]とした。彼[かれ]がこれらすべてを行[おこな]い、自分[じぶん]の民族[みんぞく]に対[たい]して守[まも]った正義[せいぎ]と誠実[せいじつ]のゆえであり、またあらゆる方法[ほうほう]で自分[じぶん]の民[たみ]を高[たか]めようと求[もと]めたからである。"
  36: "彼[かれ]の日々[ひび]に、彼[かれ]の手[て]によって、諸民族[しょみんぞく]を彼[かれ]らの地方[ちほう]から追[お]い出[だ]し、ダビデの町[まち]にいるエルサレムの者[もの]たちをも追[お]い出[だ]すことが成[な]し遂[と]げられた。彼[かれ]らは自分[じぶん]たちのためにアクラを造[つく]り、そこから出[で]て聖所[せいしょ]の周[まわ]りを汚[けが]し、聖[せい]なるものに大[おお]きな害[がい]を加[くわ]えていた。"
  37: "彼[かれ]はそこにユダヤ人[じん]を住[す]まわせ、その地方[ちほう]と町[まち]の安全[あんぜん]のためにこれを堅固[けんご]にし、エルサレムの城壁[じょうへき]を高[たか]くした。"
  38: "そこでデメトリオス王[おう]は、これらに従[したが]って彼[かれ]に大祭司[だいさいし]の職[しょく]を確認[かくにん]した。"
  39: "彼[かれ]を自分[じぶん]の友[とも]たちのうちとし、大[おお]きな栄光[えいこう]をもって彼[かれ]を重[おも]んじた。"
  40: "彼[かれ]は、ユダヤ人[じん]がローマ人[じん]によって友[とも]、同盟者[どうめいしゃ]、兄弟[きょうだい]と呼[よ]ばれ、シモンの使節[しせつ]たちを栄誉[えいよ]をもって迎[むか]えたと聞[き]いたからである。"
  41: "また、ユダヤ人[じん]と祭司[さいし]たちは、忠実[ちゅうじつ]な預言者[よげんしゃ]が起[お]こるまで、シモンが永遠[えいえん]に彼[かれ]らの指導者[しどうしゃ]また大祭司[だいさいし]であることを喜[よろこ]んだ。"
  42: "また、彼[かれ]が彼[かれ]らの将軍[しょうぐん]であり、聖所[せいしょ]についての務[つと]めを負[お]い、彼[かれ]を通[とお]してその業[わざ]と地方[ちほう]と武器[ぶき]と要塞[ようさい]を司[つかさど]る者[もの]たちを置[お]き、"
  43: "聖所[せいしょ]についての務[つと]めを負[お]い、すべての者[もの]が彼[かれ]に聞[き]き従[したが]い、この地方[ちほう]のすべての契約[けいやく]が彼[かれ]の名[な]で書[か]かれ、彼[かれ]が紫[むらさき]の衣[ころも]をまとい、金[きん]の飾[かざ]りを身[み]につけるためである。"
  44: "また、民[たみ]の者[もの]も祭司[さいし]の者[もの]もだれも、これらのうちの何[なに]かを取[と]り消[け]し、彼[かれ]が語[かた]ることに対[たい]して逆[さか]らい、彼[かれ]なしにこの地方[ちほう]で集[つど]まりを起[お]こし、紫[むらさき]の衣[ころも]をまとい、金[きん]の留[と]め金[がね]を身[み]につけることは許[ゆる]されない。"
  45: "このことに反[はん]して行[おこな]い、これらのうちの何[なに]かを取[と]り消[け]す者[もの]は、だれでも責[せき]めを負[お]う。」"
  46: "民[たみ]は皆[みな]、シモンにこれらの言葉[ことば]どおりに行[おこな]わせることを喜[よろこ]んだ。"
  47: "シモンは受[う]け入[い]れ、大祭司[だいさいし]となり、ユダヤ人[じん]と祭司[さいし]たちの将軍[しょうぐん]また族長[ぞくちょう]となり、すべての上[うえ]に立[た]つことを喜[よろこ]んだ。"
  48: "彼[かれ]らはこの記録[きろく]を銅[どう]の板[いた]に書[か]いて、聖所[せいしょ]の囲[かこ]いの中[なか]の目立[めだ]つ場所[ばしょ]に立[た]てることを言[い]い、"
  49: "その写[うつ]しを宝物庫[ほうもつこ]に置[お]いて、シモンとその子[こ]らが持[も]つようにした。"

notes:
  1: "εἰς Μηδίαν τοῦ ἐπισπάσασθαι βοήθειαν ἑαυτῷ — «в Мидию, чтобы привлечь себе помощь»; 172-й год."
  2: "Ἀρσάκης ὁ βασιλεὺς τῆς Περσίδος καὶ Μηδίας — アルサケス (Аршак), царь Персиды и Мидии; συλλαβεῖν αὐτὸν ζῶντα — «взять его живым»."
  4: "ἡσύχασεν ἡ γῆ Ιουδα — «умолкла земля Иудина»; ἤρεσεν αὐτοῖς ἡ ἐξουσία αὐτοῦ — «угодна им была власть его»."
  5: "εἰς λιμένα — «в пристань (гавань)»; ἐποίησεν εἴσοδον ταῖς νήσοις τῆς θαλάσσης — «сделал вход (доступ) островам морским»."
  7: "ἐξῆρεν τὰς ἀκαθαρσίας ἐξ αὐτῆς — «изъял нечистоты из неё»; ὁ ἀντικείμενος — «противящийся»."
  8: "τὰ ξύλα τῶν πεδίων — «дерева полей»."
  9: "ἐκοινολογοῦντο — «беседовали (совещались)»; ἐνεδύσαντο δόξας καὶ στολὰς πολέμου — «облеклись в славу и одежды войны»."
  10: "ἐχορήγησεν βρώματα — «снабжал снедями»; ὄνομα τῆς δόξης αὐτοῦ — «имя славы его»."
  11: "ἐποίησεν εἰρήνην ἐπὶ τῆς γῆς — «сотворил мир на земле»."
  12: "ὑπὸ τὴν ἄμπελον αὐτοῦ καὶ τὴν συκῆν αὐτοῦ — «под виноградом своим и смоковницею своею» (образ мира, ср. 3 Цар 4:25); ὁ ἐκφοβῶν — «устрашающий»."
  13: "ἐξέλιπεν πολεμῶν αὐτούς — «оскудел воюющий против них»; συνετρίβησαν — «сокрушены»."
  14: "τοὺς ταπεινοὺς τοῦ λαοῦ — «смиренных (бедных) народа»; ἐξεζήτησεν τὸν νόμον — «взыскал закон»."
  16: "ἕως Σπάρτης — «до Спарты»; ἐλυπήθησαν σφόδρα — «опечалились весьма»."
  18: "δέλτοις χαλκαῖς — «медными досками»; ἣν ἔστησαν πρὸς Ιουδαν καὶ Ιωναθαν — «который поставили с Иудой и Ионатаном»."
  19: "ἐνώπιον τῆς ἐκκλησίας — «пред собранием (церковью)», 集会."
  20: "οἱ Σπαρτιατῶν ἄρχοντες καὶ ἡ πόλις — «начальники Спартанцев и город»; Σιμωνι ἱερεῖ μεγάλῳ — «Симону, иерею великому»."
  22: "ἐν ταῖς βουλαῖς τοῦ δήμου — «в советах (постановлениях) народа»; ἀνανεούμενοι τὴν φιλίαν — «возобновляя дружбу»."
  23: "ἐν τοῖς ἀποδεδειγμένοις τῷ δήμῳ βιβλίοις — «в положенных у народа книгах» (публичные записи); τὸ μνημόσυνον — «память»."
  24: "ἀσπίδα χρυσῆν ... ὁλκὴν μνῶν χιλίων — «щит золотой весом в тысячу мин»; εἰς τὸ στῆσαι τὴν συμμαχίαν — «чтобы поставить (утвердить) союз»."
  25: "Τίνα χάριν ἀποδώσομεν — «какую благодарность воздадим»."
  26: "ἐστήρισεν — «утвердил»; ἔστησαν αὐτῷ ἐλευθερίαν — «поставили ему свободу»; δέλτοι χαλκαῖ — 銅の板; στήλαις ἐν ὄρει Σιων — «на столпах на горе Сион»."
  27: "Ὀκτωκαιδεκάτῃ Ελουλ — «в восемнадцатый (день) Елула»; τρίτον ἔτος ἐπὶ Σιμωνος — «третий год при Симоне»; ἐν ασαραμελ — тёмное слово, передано как サラメル (слав. «в сарамели»)."
  28: "ἐπὶ συναγωγῆς μεγάλης — «в собрании великом»; ἐγνώρισεν ἡμῖν — «возвещено нам»."
  29: "ἱερεὺς τῶν υἱῶν Ιωαριβ — «священник из сынов Иарива»; ἔδωκαν αὑτοὺς τῷ κινδύνῳ — «отдали себя опасности»."
  30: "προσετέθη πρὸς τὸν λαὸν αὐτοῦ — «приложился к народу своему», т.е. умер."
  31: "ἐμβατεῦσαι εἰς τὴν χώραν — «войти (вторгнуться) в страну»; ἐκτεῖναι χεῖρας ἐπὶ τὰ ἅγια — «простереть руки на святыни»."
  33: "τὴν Βαιθσουραν τὴν ἐπὶ τῶν ὁρίων — ベテズル на границе; ἔθετο φρουράν — «поставил стражу»."
  36: "τοὺς ἐν τῇ πόλει Δαυιδ τοὺς ἐν Ιερουσαλημ, οἳ ἐποίησαν αὑτοῖς ἄκραν — «бывших в городе Давида, в Иерусалиме, которые сделали себе крепость» (アクラ); ἐποίουν πληγὴν μεγάλην ἐν τῇ ἁγνείᾳ — «делали великое поражение в святыне (чистоте)»."
  38: "κατὰ ταῦτα — «по сему (сообразно этому)»."
  40: "προσηγόρευνται — «наречены»; ἀπήντησαν τοῖς πρεσβευταῖς ἐνδόξως — «приняли послов с честью»."
  41: "εἰς τὸν αἰῶνα ἕως τοῦ ἀναστῆναι προφήτην πιστόν — «навек, доколе восстанет Пророк верный» — важная формула; 忠実な預言者."
  42: "τοῦ εἶναι ἐπ᾿ αὐτῶν στρατηγόν — «быть над ними военачальником»; ἐπὶ τῶν χρεῶν — «над делами (службами)»."
  43: "γράφωνται ἐπὶ τῷ ὀνόματι αὐτοῦ πᾶσαι συγγραφαί — «писались на имя его все договоры»; χρυσοφορῇ — «носил золото (золотые украшения)»."
  44: "ἀθετῆσαι — «отменить (отвергнуть)»; ἐπισυστρέψαι συστροφήν — «созвать сборище (заговор)»; ἐμπορποῦσθαι πόρπην χρυσῆν — «застёгивать золотую пряжку»."
  45: "ἔνοχος ἔσται — «будет повинен»."
  47: "ἀρχιερατεύειν — «быть первосвященником»; ἐθνάρχης — «народоначальник, этнарх», 族長; προστατῆσαι πάντων — «предстоятельствовать над всеми»."
  49: "γαζοφυλάκιον — «сокровищница», 宝物庫."
