# jp-box, Первое послание к Коринфянам, глава 11. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 11: покрывало и глава (1–16), беспорядки на вечере и установление Вечери (17–34).
# Красное <j> — только прямая речь Христа: 11:24–25 (установление Вечери).
# 11:23 («я принял от Господа») — слова Павла, не красные. <mo> нет.
# 〔…〕: 11:24 — церковные λάβετε φάγετε и κλώμενον; 11:29 — церковные ἀναξίως и τοῦ κυρίου.
# Прочее ([αὐτῇ] в 11:15, [καὶ] в 11:19, [τοῦ] в 11:32) в базе есть — без скобок.
# Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

tr_code: jp-box
book: 1kor
chapter: 11
draft: true

verses:
  1: "わたしがキリストに倣[なら]う者[もの]であるように、あなたがたもわたしに倣[なら]いなさい。"
  2: "兄弟[きょうだい]たちよ、あなたがたがすべてのことにおいてわたしを思[おも]い起[おこ]し、わたしがあなたがたに伝[つた]えた事[こと]がらを、そのまま守[まも]っていることを、わたしはほめている。"
  3: "しかし、あなたがたに知[し]ってもらいたい。すべての男[おとこ]の頭[かしら]はキリストであり、女[おんな]の頭[かしら]は男[おとこ]であり、キリストの頭[かしら]は神[かみ]である。"
  4: "男[おとこ]は、頭[かしら]にかぶり物[もの]をして祈[いの]ったり預言[よげん]したりするなら、自分[じぶん]の頭[かしら]を辱[はずかし]めることになる。"
  5: "女[おんな]は、頭[かしら]にかぶり物[もの]をせずに祈[いの]ったり預言[よげん]したりするなら、自分[じぶん]の頭[かしら]を辱[はずかし]めることになる。それは、髪[かみ]を剃[そ]った女[おんな]と少[すこ]しも変[か]わらないからである。"
  6: "女[おんな]がかぶり物[もの]をしないのなら、髪[かみ]を切[き]ってしまいなさい。しかし、女[おんな]が髪[かみ]を切[き]ったり剃[そ]ったりするのを恥[はじ]とするなら、かぶり物[もの]をしなさい。"
  7: "男[おとこ]は神[かみ]の像[かたち]であり栄光[えいこう]であるから、頭[かしら]にかぶり物[もの]をする必要[ひつよう]はない。しかし、女[おんな]は男[おとこ]の栄光[えいこう]である。"
  8: "男[おとこ]は女[おんな]から出[で]たのではなく、女[おんな]が男[おとこ]から出[で]たからである。"
  9: "また、男[おとこ]が女[おんな]のために造[つく]られたのではなく、女[おんな]が男[おとこ]のために造[つく]られたからである。"
  10: "それゆえ、女[おんな]は天使[てんし]たちのゆえに、頭[かしら]の上[うえ]に権[けん]のしるしを持[も]つべきである。"
  11: "とはいえ、主[しゅ]にあっては、女[おんな]が男[おとこ]なしにいることも、男[おとこ]が女[おんな]なしにいることもない。"
  12: "女[おんな]が男[おとこ]から出[で]たように、男[おとこ]も女[おんな]によって生[う]まれる。しかし、すべてのものは神[かみ]から出[で]ている。"
  13: "あなたがた自身[じしん]で判[はん]断[だん]しなさい。女[おんな]が頭[かしら]にかぶり物[もの]をせずに神[かみ]に祈[いの]るのは、ふさわしいことだろうか。"
  14: "自然[しぜん]そのものがあなたがたに教[おし]えているではないか。男[おとこ]が長[なが]い髪[かみ]を持[も]つのは、彼[かれ]にとって辱[はずかし]めであり、"
  15: "女[おんな]が長[なが]い髪[かみ]を持[も]つのは、彼女[かのじょ]にとって栄光[えいこう]である。髪[かみ]はかぶり物[もの]の代[か]わりに彼女[かのじょ]に与[あた]えられているからである。"
  16: "しかし、だれかが争[あらそ]いを好[この]む者[もの]であるなら、わたしたちにも神[かみ]の諸[しょ]教会[きょうかい]にも、そのような慣[なら]わしはない。"
  17: "しかし、次のことを命[めい]じるにあたって、わたしはあなたがたをほめない。あなたがたが集[あつ]まるのは、良[よ]いためではなく悪[わる]いためになっているからである。"
  18: "まず第一[だいいち]に、あなたがたが教会[きょうかい]に集[あつ]まるとき、あなたがたの間[あいだ]に分裂[ぶんれつ]があると聞[き]いている。わたしはそれをいくらか信[しん]じている。"
  19: "認[みと]められた者[もの]たちがあなたがたの間[あいだ]に明[あき]らかになるために、あなたがたの間[あいだ]に分[わ]かれた派[は]がどうしても生[しょう]じるのである。"
  20: "だから、あなたがたが一[ひと]つの所[ところ]に集[あつ]まっても、それは主[しゅ]の晩餐[ばんさん]を食[た]べることにはならない。"
  21: "食[た]べるとき、めいめいが自分[じぶん]の食事[しょくじ]を先[さき]に済[す]ませてしまうからである。そのため、飢[う]えている者[もの]もいれば、酔[よ]っている者[もの]もいる。"
  22: "あなたがたには食[た]べたり飲[の]んだりする家[いえ]がないのか。それとも、神[かみ]の教会[きょうかい]を蔑[さげす]み、持[も]たない者[もの]たちを辱[はずかし]めるのか。あなたがたに何[なん]と言[い]おうか。あなたがたをほめようか。このことでは、ほめない。"
  23: "わたしは主[しゅ]から受[う]け取[と]ったことを、あなたがたに伝[つた]えた。すなわち、主[しゅ]イエスは、渡[わた]される夜[よる]、パンを取り、"
  24: "感謝[かんしゃ]してからそれを割[わ]き、言[い]われた。「<j>〔取[と]って食[た]べなさい。〕これは、あなたがたのために〔割[わ]られる〕わたしの体[からだ]である。わたしを記念[きねん]するために、これを行[おこな]いなさい。</j>」"
  25: "同[おな]じように、食事[しょくじ]の後[あと]に杯[さかずき]も取[と]って、言[い]われた。「<j>この杯[さかずき]は、わたしの血[ち]による新[あたら]しい契約[けいやく]である。あなたがたは、飲[の]むたびごとに、わたしを記念[きねん]するために、これを行[おこな]いなさい。</j>」"
  26: "あなたがたは、このパンを食[た]べ、この杯[さかずき]を飲[の]むたびごとに、主[しゅ]の死[し]を宣[の]べ告[つ]げているのである。主[しゅ]が来[こ]られるまで。"
  27: "だから、ふさわしくないままに主[しゅ]のパンを食[た]べたり、主[しゅ]の杯[さかずき]を飲[の]んだりする者[もの]は、主[しゅ]の体[からだ]と血[ち]に対して罪[つみ]を負[お]うことになる。"
  28: "人[ひと]はまず自分[じぶん]を吟味[ぎんみ]し、それからパンを食[た]べ、杯[さかずき]を飲[の]むべきである。"
  29: "というのは、〔ふさわしくないまま〕食[た]べたり飲[の]んだりする者[もの]は、〔主[しゅ]の〕体[からだ]を見分[みわ]けずに、自分[じぶん]のため裁[さば]きを食[た]べたり飲[の]んだりしているからである。"
  30: "そのために、あなたがたの間[あいだ]には弱[よわ]い者[もの]や病[や]む者[もの]が多[おお]く、眠[ねむ]りについた者[もの]も少[すく]なくない。"
  31: "もしわたしたちが自分[じぶん]を見分[みわ]けていたなら、裁[さば]かれはしなかったであろう。"
  32: "しかし、裁[さば]かれるとき、わたしたちは主[しゅ]に懲[こら]しを受[う]けているのである。世[よ]と共[とも]に罪[つみ]に定[さだ]められないためである。"
  33: "だから、わたしの兄弟[きょうだい]たちよ、食[た]べるために集[あつ]まるときは、互[たが]いに待[ま]ちなさい。"
  34: "飢[う]えている者[もの]は家[いえ]で食[た]べなさい。あなたがたが集[あつ]まって裁[さば]きを受[う]けないためである。ほかのことについては、わたしが行[い]ったときに定[さだ]めよう。"

notes:
  1: "μιμηταί — 倣う者. Связь с 10:33: подражание Павлу есть подражание Христу."
  2: "παραδόσεις — «предания», то есть переданное Павлом учение; 伝えた事がら (связь с παρέδωκα в 11:23 — 伝えた). κατέχετε — 守っている."
  3: "κεφαλή — 頭 (и «голова», и «глава»). Цепь: Христос — муж — жена; Христу глава — Бог. Не сглаживать, порядок членов сохранён."
  4: "κατὰ κεφαλῆς ἔχων — «имея [покров] на голове»; 頭にかぶり物をして. καταισχύνει — 辱める."
  5: "ἀκατακαλύπτῳ τῇ κεφαλῇ — «с непокрытой головой»; 頭にかぶり物をせずに. ἓν καὶ τὸ αὐτό — «одно и то же»; 少しも変わらない. ἐξυρημένη — 髪を剃った女."
  6: "κειράσθω — «пусть острижётся»; 髪を切る. ξυρᾶσθαι — 剃る. αἰσχρόν — 恥."
  7: "εἰκὼν καὶ δόξα θεοῦ — 神の像であり栄光. ἡ γυνὴ δὲ δόξα ἀνδρός ἐστιν — 女は男の栄光. Не сглаживать (по заданию); сказано прямо, без пояснений."
  8: "οὐ… ἀλλά — ではなく…だからである. ἐκ — «из» (Творение, Быт 2:22)."
  9: "διὰ τὴν γυναῖκα — «ради жены»; 女のために. Порядок творения сохранён."
  10: "ἐξουσίαν ἔχειν ἐπὶ τῆς κεφαλῆς — букв. «иметь власть на своей голове»; передано 権のしるしを持つ (как jp-joc 權の號): покров — знак власти. διὰ τοὺς ἀγγέλους — 天使たちのゆえに (в корпусе 天使[てんし]); в notes отмечено, что толкование спорно."
  11: "πλήν — とはいえ. ἐν κυρίῳ — 主にあって. οὔτε… οὔτε — も…もない."
  12: "ὥσπερ… οὕτως — ように…も. τὰ δὲ πάντα ἐκ τοῦ θεοῦ — すべてのものは神から出ている."
  13: "ἐν ὑμῖν αὐτοῖς κρίνατε — あなたがた自身で判断しなさい. πρέπον — ふさわしい. Риторический вопрос сохранён."
  14: "φύσις — 自然. κομᾷ — «носит длинные волосы»; 長い髪を持つ. ἀτιμία — 辱め."
  15: "δόξα — 栄光. ἀντὶ περιβολαίου — «вместо покрывала»; かぶり物の代わりに. В критическом αὐτῇ в квадратных скобках, в базе есть — без 〔…〕."
  16: "φιλόνεικος — «любящий споры»; 争いを好む者. συνήθεια — 慣わし. οὐδὲ αἱ ἐκκλησίαι τοῦ θεοῦ — 神の諸教会にも…ない."
  17: "παραγγέλλων — 命じる. εἰς τὸ κρεῖσσον / ἧσσον — «к лучшему / худшему»; 良いため / 悪いため."
  18: "σχίσματα — 分裂. μέρος τι — «отчасти»; いくらか."
  19: "αἱρέσεις — «разделения, толки»; 分かれた派. δόκιμοι — «испытанные, одобренные»; 認められた者. δεῖ — どうしても…のである."
  20: "κυριακὸν δεῖπνον — 主の晩餐. οὐκ ἔστιν… φαγεῖν — «не [то], чтобы есть»; 食べることにはならない. οὖν — だから."
  21: "προλαμβάνει — «берёт раньше, съедает своё заранее»; 先に済ませてしまう. μεθύει — 酔っている. Не сглаживать."
  22: "καταφρονεῖτε — 蔑む. τοὺς μὴ ἔχοντας — 持たない者たち. ἐπαινέσω — ほめようか. Три вопроса подряд."
  23: "παρέλαβον ἀπὸ τοῦ κυρίου — «я принял от Господа»; это слова Павла, не Христа, — красного нет. παρεδίδετο — «был предаваем»; 渡される."
  24: "В критическом тексте нет λάβετε φάγετε и κλώμενον; Церковь (Елизаветинская «приимите, ядите… еже за вы ломимое», jp-joc 取りて食へ…擘かるる者) читает — 〔取って食べなさい〕 и 〔割られる〕. Слова Христа — красные. ἀνάμνησις — 記念 (как Лк 22:19)."
  25: "ἡ καινὴ διαθήκη ἐν τῷ ἐμῷ αἵματι — «новый завет в Моей крови»; わたしの血による新しい契約. ὁσάκις ἐὰν πίνητε — 飲むたびごとに. Красное — только прямая речь."
  26: "καταγγέλλετε — «возвещаете»; 宣べ告げている. ἄχρις οὗ ἔλθῃ — 主が来られるまで."
  27: "ἀναξίως — ふさわしくないまま. ἔνοχος — «повинен»; 罪を負う."
  28: "δοκιμαζέτω — «пусть испытывает»; 吟味する. ἐκ τοῦ ἄρτου — パンから."
  29: "В критическом тексте нет ἀναξίως и τοῦ κυρίου; Церковь (Елизаветинская «недостойно… о Теле Господнем», jp-joc 宜しきに合はずして…主の体) читает — 〔ふさわしくないまま〕 и 〔主の〕. κρῖμα — 裁き. διακρίνων — 見分ける."
  30: "ἀσθενεῖς καὶ ἄρρωστοι — 弱い者や病む者. κοιμῶνται — «спят» (об умерших); 眠りについた."
  31: "διεκρίνομεν — «различали бы себя»; 見分けていた. Контрфактическое условие: 裁かれはしなかったであろう."
  32: "παιδευόμεθα — «воспитываемся, наказываемся»; 懲らしを受けている. κατακριθῶμεν — 罪に定められる."
  33: "ἐκδέχεσθε — «ждите друг друга»; 互いに待ちなさい. ὥστε — だから."
  34: "ἐν οἴκῳ — 家で. διατάξομαι — 定めよう."
