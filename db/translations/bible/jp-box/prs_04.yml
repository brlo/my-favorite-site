# jp-box, Премудрость Соломона, глава 4. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для главы есть фрагментами (4:1, 7–17,
# 19–20) — служил контролем чтения, архаизмы не копировались; jp-ni не
# использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 4: бесплодие и ранняя смерть праведника (1–6), старость и кончина праведника
# (7–14), осуждение нечестивых и их погибель (15–19), страх нечестивых на суде (20).
# Прямой речи нет: всё — авторский текст; красного и синего нет.
# Нумерация по gr: 20 стихов. Слав. граница иная: csl 4:15 вбирает конец гр. 4:14
# («людие же видевше и не разумевше…»), поэтому наш 4:14 включает обе половины
# греческого стиха, а 4:15 начинается с «яко благодать…»; счёт у csl тот же (20),
# держимся деления gr.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz. Сносок ⟨…⟩ нет.

tr_code: jp-box
book: prs
chapter: 4
draft: true

verses:
  1: "子[こ]のないことは、徳[とく]とともにあれば、すぐれている。その記憶[きおく]は不死[ふし]であり、神[かみ]の前[まえ]にも人[ひと]の前にも認[みと]められるからである。"
  2: "そばにあるとき、人々[ひとびと]はこれを模倣[もほう]し、去[さ]ったのちにはこれを慕[した]う。そして、世[よ]にあって冠[かんむり]を戴[いただ]き、汚[けが]れなき競技[きょうぎ]の戦[たたか]いに勝[か]って、勝利[しょうり]の行進[ぎょうしん]をする。"
  3: "しかし、不敬虔[ふけいけん]な者[もの]たちの多産[たさん]な群[む]れは役[やく]に立[た]たない。私生[しせい]の挿[さ]し木[き]は深[ふか]く根[ね]を張[は]らず、しっかとした基盤[きばん]を据[す]えることもない。"
  4: "たとえしばらく枝[えだ]のうちに芽吹[めぶ]いても、その立[た]ちは危[あや]うく、風[かぜ]に揺[ゆ]らされ、風[かぜ]の激[はげ]しさに根[ね]こそぎにされる。"
  5: "未熟[みじゅく]な枝[えだ]は折[お]られ、その実[み]は役[やく]に立[た]たず、食[た]べるにはまだ早[はや]く、何[なに]の役[やく]にも立[た]たない。"
  6: "不法[ふほう]な交[まじ]わりから生[う]まれる子[こ]どもは、その取[と]り調[しら]べのときに、親[おや]に不利[ふり]な証人[しょうにん]となる。"
  7: "正[ただ]しい者[もの]は、たとえ早[はや]く死[し]を迎[むか]えても、安息[あんそく]のうちにある。"
  8: "老[お]いの尊[とうと]さは長[なが]生[い]きにあるのではなく、年[とし]の数[かず]で量[はか]られるのでもない。"
  9: "人[ひと]にとっての白髪[しらが]は思慮[しりょ]であり、老[お]いの齢[よわい]は汚[けが]れのない生涯[しょうがい]である。"
  10: "彼[かれ]は神[かみ]に喜[よろこ]ばれる者[もの]となって愛[あい]され、罪[つみ]びとの中[なか]に生[い]きながら、移[うつ]された。"
  11: "彼は奪[うば]い去[さ]られた。悪[あく]がその悟[さと]りを変[か]え、偽[いつわ]りがその魂[たましい]を欺[あざむ]くことのないように。"
  12: "悪[あく]への熱意[ねつい]は善[よ]いものを暗[くら]ませ、欲望[よくぼう]の迷[まよ]いは無垢[むく]な心[こころ]を蝕[むしば]む。"
  13: "短[みじか]い時[とき]のうちに全[まった]くされ、長[なが]い年[とし]を満[み]たした。"
  14: "その魂[たましい]は主[しゅ]に喜[よろこ]ばれた。それゆえ、彼は悪[あく]のただ中[なか]から急[いそ]ぎ出[で]た。人々[ひとびと]はこれを見[み]ながら悟[さと]らず、そのようなことを心[こころ]に留[と]めもしなかったが、"
  15: "恵[めぐ]みとあわれみはその聖[せい]なる者[もの]たちのうちにあり、訪[おとず]れはその選[えら]ばれた者[もの]たちのうちにあるということである。"
  16: "死[し]んだ正[ただ]しい者[もの]は、生[い]きている不敬虔[ふけいけん]な者[もの]たちを裁[さば]き、早[はや]く全[まった]くされた若[わか]さは、不正[ふせい]な者[もの]の長[なが]い老[お]いを裁く。"
  17: "彼[かれ]らは知恵[ちえ]ある者[もの]の終[お]わりを見[み]るが、主[しゅ]がその者について何[なに]を定[さだ]め、何[なん]のためにその者を堅[かた]く守[まも]られたかを悟[さと]らない。"
  18: "彼らは見[み]て、これを侮[あなど]る。しかし主[しゅ]は彼らを笑[わら]われる。"
  19: "その後[のち]、彼らは恥[は]ずかしい倒[たお]れとなり、死[し]んだ者[もの]の間[あいだ]でとこしえに辱[はずかし]めとなる。主は彼らを無言[むごん]にしてうつ伏[ぶ]せに打[う]ち倒[たお]し、基礎[きそ]から揺[ゆ]り動[うご]かされるからである。彼らは遂[つい]には荒[あ]れ果[は]て、苦[くる]しみのうちにあり、その記憶[きおく]は滅[ほろ]びる。"
  20: "彼らは自分[じぶん]の罪[つみ]を思[おも]い起[お]こし、おののいて来[く]る。そして、その不法[ふほう]が彼らを直[じか]に向[む]かい合[あ]って責[せ]める。"

notes:
  1: "κρείσσων ἀτεκνία μετὰ ἀρετῆς — 子のないことは、徳とともにあれば、すぐれている (ἀτεκνία — бездетность; ἀρετή — добродетель, 徳). ἀθανασία γάρ ἐστιν ἐν μνήμῃ αὐτῆς — その記憶は不死 (αὐτῆς — «её» — бездетности или добродетели; в слав. «в памяти ея» так же двусмысленно). γινώσκεται — 認められる (γινώσκω — знать, признавать); слав. «познается» — то же."
  2: "παροῦσαν … μιμοῦνται — そばにあるとき…模倣する (μιμέομαι — подражать). ποθοῦσιν ἀπελθοῦσαν — 去ったのちには慕う (ποθέω — тосковать, жаждать). στεφανηφοροῦσα πομπεύει — 冠を戴いて行進する (στεφανηφορέω — носить венец; πομπεύω — шествовать в торжественной процессии); слав. «венценосно чтится» передаёт πομπεύω как «чествуется». ἀμίαντος — 汚れなき (неосквернённый)."
  3: "πολύγονον … πλῆθος — 多産な群れ (πολύγονος — многородящий); слав. «многоплодно… множество». οὐ χρησιμεύσει — 役に立たない (χρησιμεύω — быть полезным); слав. «неключимо будет». ἐκ νόθων μοσχευμάτων — 私生の挿し木から (νόθος — незаконнорождённый; μόσχευμα — отросток, черенок); слав. «прелюбодейная насаждения» — толкование, а не иное чтение. ἑδράσει — 据える (ἑδράζω — утверждать, ставить)."
  4: "κἂν … ἀναθάλῃ — たとえ…芽吹いても (ἀναθάλλω — зеленеть, расцветать). ἐπισφαλῶς βεβηκότα — その立ちは危うく (ἐπισφαλής — ненадёжный, шаткий). σαλευθήσεται … ἐκριζωθήσεται — 揺らされ…根こそぎにされる (σαλεύω — колебать; ἐκριζόω — искоренять). Повтор «ветра… ветров» сохранён."
  5: "περικλασθήσονται κλῶνες ἀτέλεστοι — 未熟な枝は折られる (περικλάω — обламывать кругом; ἀτέλεστος — несовершенный, недозрелый); слав. «сокрушатся ветви несовершенны». ἄωρος εἰς βρῶσιν — 食べるにはまだ早く (ἄωρος — незрелый, преждевременный). εἰς οὐθὲν ἐπιτήδειος — 何の役にも立たない."
  6: "ἐξ ἀνόμων ὕπνων — 不法な交わりから (ὕπνος здесь — сожительство; слав. «от беззаконных снов»). μάρτυρες πονηρίας κατὰ γονέων — 親に不利な証人 (κατά с род. — «против»; πονηρία — злоба, разврат). ἐν ἐξετασμῷ αὐτῶν — その取り調べのときに (ἐξετασμός — исследование, допрос); слав. «во испытании их»."
  7: "Δίκαιος δὲ ἐὰν φθάσῃ τελευτῆσαι — 正しい者は、たとえ早く死を迎えても (φθάνω — предварять, успевать; слав. «аще постигнет скончатися»). ἐν ἀναπαύσει ἔσται — 安息のうちにある (ἀνάπαυσις — покой); слав. «в покои будет»."
  8: "γῆρας τίμιον — 老いの尊さ (τίμιος — честный, драгоценный). τὸ πολυχρόνιον — 長生き (букв. «многолетность»). ἀριθμῷ ἐτῶν μεμέτρηται — 年の数で量られる (μετρέω — измерять); слав. «ниже в числе лет изчитается»."
  9: "πολιά — 白髪 (седина). φρόνησις — 思慮 (благоразумие, разумение); слав. и Син. «мудрость» — более широкое слово, в тексте точнее φρόνησις. ἡλικία γήρως — 老いの齢 (ἡλικία — возраст). βίος ἀκηλίδωτος — 汚れのない生涯 (κηλίς — пятно); слав. «житие нескверно»."
  10: "εὐάρεστος θεῷ γενόμενος — 神に喜ばれる者となって (εὐάρεστος — благоугодный). ἠγαπήθη — 愛され. μετετέθη — 移された (μετατίθημι — переносить; о Енохе, ср. Быт 5:24; слав. «преставлен бысть»)."
  11: "ἡρπάγη — 奪い去られた (ἁρπάζω — восхищать, уносить; слав. «восхищен бысть»). μὴ κακία ἀλλάξῃ σύνεσιν — 悪が悟りを変えないように (ἀλλάσσω — изменять; σύνεσις — разумение). δόλος ἀπατήσῃ ψυχήν — 偽りが魂を欺かないように (δόλος — коварство). Цель передана оборотом 〜ないように."
  12: "βασκανία φαυλότητος — 悪への熱意 (βασκανία — злоба, зависть; φαυλότης — низость); слав. «рачение злобы» — «усердие злобы». ἀμαυροῖ τὰ καλά — 善いものを暗ませる (ἀμαυρόω — затемнять). ῥεμβασμός ἐπιθυμίας — 欲望の迷い (ῥεμβασμός — блуждание, кружение). μεταλλεύει — 蝕む (букв. «подкапывает», μεταλλεύω — добывать руду, подрывать)."
  13: "τελειωθεὶς ἐν ὀλίγῳ — 短い時のうちに全くされ (τελειόω — совершать, завершать; слав. «скончався вмале» поняло как «скончавшись»). ἐπλήρωσεν χρόνους μακρούς — 長い年を満たした (πληρόω — исполнять)."
  14: "ἀρεστὴ ἦν κυρίῳ ἡ ψυχὴ αὐτοῦ — その魂は主に喜ばれた (ἀρεστός — угодный). ἔσπευσεν ἐκ μέσου πονηρίας — 悪のただ中から急ぎ出た (σπεύδω — спешить). οἱ δὲ λαοὶ ἰδόντες … — 人々は見ながら…: у csl эта часть открывает 4:15 («людие же видевше»), по делению gr она в нашем 4:14. μηδὲ θέντες ἐπὶ διανοίᾳ — 心に留めもしなかった (τίθημι ἐπὶ διάνοιαν — полагать на ум)."
  15: "χάρις καὶ ἔλεος — 恵みとあわれみ. ἐπισκοπή — 訪れ (посещение, попечение). По csl взято его чтение: «в преподобных его и посещение во избранных его» — 聖なる者たちのうちに恵み、選ばれた者たちのうちに訪れ; у LXX порядок обратный (ἐν τοῖς ἐκλεκτοῖς … ἐν τοῖς ὁσίοις), отмечено. ὅτι в начале стиха вводит содержание, которого люди не поняли (продолжение 4:14)."
  16: "κατακρινεῖ — 裁く (κατακρίνω — осуждать); слав. «осудит». καμών — 死んだ (κάμνω — трудиться, изнемогать; слав. «умираяй», Син. «умирая» — понято как «скончавшись»). νεότης τελεσθεῖσα ταχέως — 早く全くされた若さ. πολυετὲς γῆρας ἀδίκου — 不正な者の長い老い (πολυετής — многолетний)."
  17: "ὄψονται … τελευτὴν σοφοῦ — 知恵ある者の終わりを見る (σοφός — мудрый; слав. «премудраго»). τί ἐβουλεύσατο περὶ αὐτοῦ — 何を定めたか (βουλεύομαι — держать совет, решать). εἰς τί ἠσφαλίσατο αὐτόν — 何のために堅く守られたか (ἀσφαλίζομαι — обезопасить; слав. «во что утверди»)."
  18: "ὄψονται καὶ ἐξουθενήσουσιν — 見て侮る (ἐξουθενέω — уничижать); слав. «уничижат его» — с дополнением, которого в греч. нет. ἐκγελάσεται — 笑われる (ἐκγελάω — осмеивать)."
  19: "εἰς πτῶμα ἄτιμον — 恥ずべき倒れ (πτῶμα — падение, труп; ἄτιμος — бесчестный). εἰς ὕβριν ἐν νεκροῖς — 死んだ者の間で辱め (ὕβρις — поругание). ῥήξει … ἀφώνους πρηνεῖς — 無言にしてうつ伏せに打ち倒す (ῥήγνυμι — разбивать; πρηνής — ничком); слав. «расторгнет их безгласны ниц». ἕως ἐσχάτου χερσωθήσονται — 終いには荒れ果てる (χερσόω — опустошать). ἡ μνήμη αὐτῶν ἀπολεῖται — その記憶は滅びる."
  20: "ἐλεύσονται ἐν συλλογισμῷ ἁμαρτημάτων — 自分の罪を思い起して来る (συλλογισμός — размышление, сознание; слав. «в помышление грехов своих»). δειλοί — おののいて (δειλός — робкий, боязливый). ἐλέγξει … ἐξ ἐναντίας — 向かい合って責める (ἐλέγχω — обличать; ἐξ ἐναντίας — напротив, в лицо)."
