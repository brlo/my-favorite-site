# jp-box, Левит, глава 3. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в Левите отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 3: закон мирной жертвы — 酬恩祭: из крупного скота (1–5), из мелкого (6–11),
# из коз (12–16); запрет тука и крови (17).
# Речь Бога — 「…」 (1–17), красного нет.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (в том числе слова в квадратных скобках
# критического издания — σὺν τοῖς νεφροῖς περιελεῖ и σὺν ταῖς ψόαις περιελεῖ αὐτό).
# Сноска ⟨…⟩ одна: 酬恩祭 (3:1) — первое упоминание в корпусе.
# Стихи 7 и 12 по греческому переходят в 8 и 13, но клауза в них закончена, поэтому
# по-японски они кончаются на 「…。」.
# jp-ni не использовался.

tr_code: jp-box
book: lev
chapter: 3
draft: true

verses:
  1: "「もし彼[かれ]の捧[ささ]げ物[もの]が主[しゅ]への酬恩祭[しゅうおんさい]⟨神[かみ]との平和[へいわ]を願[ねが]い、感謝[かんしゃ]を表[あらわ]す供[そな]え物[もの]。⟩であるなら、もし彼[かれ]が牛[うし]の群[む]れから献[ささ]げる場合[ばあい]は、雄[おす]でも雌[めす]でも、傷[きず]のないものを主[しゅ]の前[まえ]に献[ささ]げなさい。"
  2: "彼[かれ]はその捧[ささ]げ物[もの]の頭[あたま]に手[て]を置[お]き、証[あかし]の幕屋[まくや]の入口[いりぐち]のそばでそれを屠[ほふ]りなさい。アロンの子[こ]らである祭司[さいし]たちは、その血[ち]を燔祭[はんさい]の祭壇[さいだん]の周[まわ]りに注[そそ]ぎかけなさい。"
  3: "彼[かれ]は酬恩祭[しゅうおんさい]の犠牲[ぎせい]から、主[しゅ]への焼[や]き尽[つ]くす捧[ささ]げ物[もの]として、腹[はら]の内[うち]を覆[おお]う脂肪[しぼう]と、腹[はら]の内[うち]の上[うえ]にあるすべての脂肪[しぼう]を献[ささ]げなさい。"
  4: "また、二[ふた]つの腎臓[じんぞう]と、その上[うえ]の脂肪[しぼう]、すなわち腰[こし]のあたりにあるもの、および肝臓[かんぞう]の上[うえ]の部分[ぶぶん]を、腎臓[じんぞう]とともに取[と]り除[のぞ]きなさい。"
  5: "アロンの子[こ]らである祭司[さいし]たちは、それを祭壇[さいだん]の上[うえ]、火[ひ]の上[うえ]の薪[たきぎ]の上[うえ]にある燔祭[はんさい]の上[うえ]で焼[や]きなさい。これは主[しゅ]に芳[かんば]しい香[かおり]となる焼[や]き尽[つ]くす捧[ささ]げ物[もの]である。"
  6: "もし彼[かれ]の捧[ささ]げ物[もの]が羊[ひつじ]の群[む]れからの、主[しゅ]への酬恩祭[しゅうおんさい]であるなら、雄[おす]でも雌[めす]でも、傷[きず]のないものを献[ささ]げなさい。"
  7: "もし彼[かれ]が小羊[こひつじ]を捧[ささ]げ物[もの]として献[ささ]げるなら、それを主[しゅ]の前[まえ]に献[ささ]げなさい。"
  8: "彼[かれ]はその捧[ささ]げ物[もの]の頭[あたま]に手[て]を置[お]き、証[あかし]の幕屋[まくや]の入口[いりぐち]のそばでそれを屠[ほふ]りなさい。アロンの子[こ]らである祭司[さいし]たちは、その血[ち]を祭壇[さいだん]の周[まわ]りに注[そそ]ぎかけなさい。"
  9: "彼[かれ]は酬恩祭[しゅうおんさい]の犠牲[ぎせい]から、神[かみ]への焼[や]き尽[つ]くす捧[ささ]げ物[もの]として、脂肪[しぼう]と、腰[こし]のところで取[と]り除[のぞ]く傷[きず]のない尾[お]、および腹[はら]の内[うち]の脂肪[しぼう]を献[ささ]げなさい。"
  10: "また、二[ふた]つの腎臓[じんぞう]と、その上[うえ]の脂肪[しぼう]、すなわち腰[こし]のあたりにあるもの、および肝臓[かんぞう]の上[うえ]の部分[ぶぶん]を、腎臓[じんぞう]とともに取[と]り除[のぞ]きなさい。"
  11: "祭司[さいし]はそれを祭壇[さいだん]の上[うえ]で焼[や]きなさい。これは主[しゅ]に芳[かんば]しい香[かおり]となる焼[や]き尽[つ]くす捧[ささ]げ物[もの]である。"
  12: "もし彼[かれ]の捧[ささ]げ物[もの]が山羊[やぎ]の群[む]れからのものであるなら、彼[かれ]はそれを主[しゅ]の前[まえ]に献[ささ]げなさい。"
  13: "彼[かれ]はその頭[あたま]に手[て]を置[お]き、主[しゅ]の前[まえ]、証[あかし]の幕屋[まくや]の入口[いりぐち]のそばでそれを屠[ほふ]りなさい。アロンの子[こ]らである祭司[さいし]たちは、その血[ち]を祭壇[さいだん]の周[まわ]りに注[そそ]ぎかけなさい。"
  14: "彼[かれ]はそれから、主[しゅ]への焼[や]き尽[つ]くす捧[ささ]げ物[もの]として、腹[はら]の内[うち]を覆[おお]う脂肪[しぼう]と、腹[はら]の内[うち]の上[うえ]にあるすべての脂肪[しぼう]を献[ささ]げなさい。"
  15: "また、二[ふた]つの腎臓[じんぞう]と、その上[うえ]のすべての脂肪[しぼう]、すなわち腰[こし]のあたりにあるもの、および肝臓[かんぞう]の上[うえ]の部分[ぶぶん]を、腎臓[じんぞう]とともに取[と]り除[のぞ]きなさい。"
  16: "祭司[さいし]はそれを祭壇[さいだん]の上[うえ]で焼[や]きなさい。これは主[しゅ]に芳[かんば]しい香[かおり]となる焼[や]き尽[つ]くす捧[ささ]げ物[もの]である。脂肪[しぼう]はすべて主[しゅ]のものである。"
  17: "これはあなたがたの代々[よよ]にわたる、あなたがたのすべての住[す]む所[ところ]での永遠[えいえん]の定[さだ]めである。脂肪[しぼう]も血[ち]も、いっさい食[た]べてはならない。」"

notes:
  1: "θυσία σωτηρίου — «жертва спасения» (σωτήριον); слав. «жертва спасения», традиционно «мирная жертва» (酬恩祭). ἐάν τε ἄρσεν ἐάν τε θῆλυ — «мужеского или женского пола» (в отличие от всесожжения, где только самец). ἄμωμον — непорочное. ἐναντίον κυρίου — пред Господом."
  2: "ἐπιθήσει τὰς χεῖρας — возложит руки (мн. ч.). παρὰ τὰς θύρας — «у дверей». προσχεοῦσιν — «возольют» (кровь вокруг жертвенника; ср. 1:5). θυσιαστήριον τῶν ὁλοκαυτωμάτων — жертвенник всесожжений (燔祭の祭壇)."
  3: "κάρπωμα κυρίῳ — сожигаемое Господу. κοιλία — чрево, внутренности (腹の内; ср. ἐγκοίλια в 1:9 — 内臓). κατακαλύπτον — покрывающий."
  4: "νεφροί — почки (腎臓). μηρία — бёдра, чресла (腰). λοβός — доля, лопасть печени (肝臓の上の部分). В критическом издании слова σὺν τοῖς νεφροῖς περιελεῖ даны в квадратных скобках как сомнительные, но в базе gr-lxx-byz они есть, поэтому 〔…〕 не ставится."
  5: "ἐπὶ τὰ ὁλοκαυτώματα — «на всесожжения», то есть поверх уже лежащих на жертвеннике всесожжений (ср. 6:5). κάρπωμα, ὀσμὴ εὐωδίας — сожигаемое, благоухание."
  6: "ἀπὸ τῶν προβάτων — из мелкого скота (羊). ἄρσεν ἢ θῆλυ — мужского или женского пола."
  7: "ἄρνα — агнца (小羊). προσάξει — представит. Стих обрывается, продолжение в ст. 8."
  8: "Ср. ст. 2; σφάξει — заколет."
  9: "ὀσφύς — здесь «курдюк, хвост» (слав. «чресла»); ψόαι — поясничные мышцы, «стегна» (слав. «лядвия»); περιελεῖ — отделит. В критическом издании слова σὺν ταῖς ψόαις περιελεῖ αὐτὸ в квадратных скобках, но в базе есть. κάρπωμα τῷ θεῷ — «сожигаемое Богу» (не «Господу», как обычно)."
  10: "Ср. ст. 4; περιελών — «отделив» (причастие)."
  11: "ἀνοίσει — вознесёт. ὀσμὴ εὐωδίας, κάρπωμα κυρίῳ — ср. ст. 5."
  12: "αἰγῶν — коз (山羊). Стих обрывается, продолжение в ст. 13."
  13: "σφάξουσιν — заколют (3-е л. мн. ч.). ἔναντι κυρίου — пред Господом."
  14: "ἀνοίσει ἐπ' αὐτοῦ — «вознесёт на нём» (на жертвеннике; слав. «от него»). κάρπωμα κυρίῳ."
  15: "Ср. ст. 4."
  16: "πᾶν τὸ στέαρ τῷ κυρίῳ — «весь тук Господу» (формула)."
  17: "νόμιμον εἰς τὸν αἰῶνα — «устав вечный» (定め). κατοικία — жилище, место обитания (住む所). πᾶν στέαρ καὶ πᾶν αἷμα οὐκ ἔδεσθε — «никакого тука и никакой крови не ешьте»."
