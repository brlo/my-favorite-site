verses:
  1: "除酵祭[じょこうさい]、すなわち過越祭[すぎこしまつり]と呼[よ]ばれる祭[まつ]りが近[ちか]づいていた。"
  2: "祭司長[さいしちょう]たちと律法学者[りっぽうがくしゃ]たちは、どうやってイエスを殺[ころ]そうかと考[かんが]えていたが、民[たみ]を恐[おそ]れていた。"
  3: "十二人[じゅうににん]の一人[ひとり]であるイスカリオテと呼[よ]ばれるユダに、サタンが入[はい]った。"
  4: "ユダは出[で]て行[い]き、祭司長[さいしちょう]たちと神殿[しんでん]の警護[けいご]の長[ちょう]たちに、どうやってイエスを彼[かれ]らに引[ひ]き渡[わた]そうかと話[はな]し合[あ]った。"
  5: "彼[かれ]らは喜[よろこ]んで、ユダに銀[ぎん]を与[あた]えることを約束[やくそく]した。"
  6: "ユダはそれを承知[しょうち]して、群衆[ぐんしゅう]のいない間[あいだ]にイエスを引[ひ]き渡[わた]す機会[きかい]をうかがい始[はじ]めた。"
  7: "除酵祭[じょこうさい]の日[ひ]、すなわち過越[すぎこし]の小羊[こひつじ]を屠[ほふ]るべき日[ひ]が来[き]た。"
  8: "イエスはペトロとヨハネを遣[つか]わして言[い]われた。「<j>行[い]って、わたしたちが過越[すぎこし]の食事[しょくじ]を食[た]べられるように、用意[ようい]をしなさい。</j>」"
  9: "彼[かれ]らは言[い]った。「どこに用意[ようい]いたしましょうか。」"
  10: "イエスは言[い]われた。「<j>都[みやこ]に入[はい]ると、水[みず]の入[はい]った甕[かめ]を運[はこ]んでいる人[ひと]が、あなたがたに出会[であ]う。その人[ひと]について、その人[ひと]が入[はい]って行[い]く家[いえ]へ行[い]きなさい。</j>"
  11: "<j>そして、その家[いえ]の主人[しゅじん]にこう言[い]いなさい。『先生[せんせい]が、「わたしが弟子[でし]たちと一緒[いっしょ]に過越[すぎこし]の食事[しょくじ]をする部屋[へや]はどこか」と言[い]っています』と。</j>"
  12: "<j>すると、その人[ひと]は、敷[し]き物[もの]の敷[し]かれた大[おお]きな二階[にかい]の部屋[へや]を、あなたがたに見[み]せる。そこに用意[ようい]をしなさい。</j>」"
  13: "彼[かれ]らは行[い]って、イエスが言[い]われたとおりのことを見[み]つけ、過越[すぎこし]の食事[しょくじ]の用意[ようい]をした。"
  14: "時[とき]になると、イエスは席[せき]に着[つ]き、使徒[しと]たちも一緒[いっしょ]に着[つ]いた。"
  15: "そして、言[い]われた。「<j>わたしは、苦[くる]しみを受[う]ける前[まえ]に、この過越[すぎこし]の食事[しょくじ]をあなたがたと一緒[いっしょ]に食[た]べることを、切[せつ]に願[ねが]っていた。</j>"
  16: "<j>あなたがたに言[い]っておく。神[かみ]の国[くに]でこれが成就[じょうじゅ]するまで、わたしはもうこれを食[た]べない。</j>」"
  17: "そして、杯[さかずき]を受[う]け取[と]って感謝[かんしゃ]の祈[いの]りを唱[とな]え、言[い]われた。「<j>この杯[さかずき]を取[と]って、あなたがたの間[あいだ]で分[わ]けなさい。</j>"
  18: "<j>あなたがたに言[い]っておく。神[かみ]の国[くに]が来[く]るまで、わたしはもう、ぶどうの実[み]から造[つく]ったものは飲[の]まない。</j>」"
  19: "また、パンを受[う]け取[と]って感謝[かんしゃ]の祈[いの]りを唱[とな]え、それを裂[さ]いて彼[かれ]らに渡[わた]し、言[い]われた。「<j>これは、あなたがたのために渡[わた]されるわたしの体[からだ]である。〔これを行[おこな]って、わたしを記念[きねん]しなさい。〕</j>」"
  20: "食事[しょくじ]が済[す]んでから、杯[さかずき]についても同[おな]じようにして、こう言[い]われた。「<j>この杯[さかずき]は、わたしの血[ち]による新[あたら]しい契約[けいやく]である。その血[ち]は、あなたがたのために流[なが]される。</j>」"
  21: "「<j>しかし、見[み]よ、わたしを裏切[うらぎ]る者[もの]の手[て]は、わたしと一緒[いっしょ]に食卓[しょくたく]の上[うえ]にある。</j>"
  22: "<j>人[ひと]の子[こ]は、定[さだ]められているとおりに去[さ]って行[く]。しかし、人[ひと]の子[こ]を裏切[うらぎ]るその人[ひと]は災[わざわ]いである。</j>」"
  23: "彼[かれ]らは、自分[じぶん]たちのうちのだれがそんなことをするのかと、互[たが]いに問[と]い始[はじ]めた。"
  24: "また、彼[かれ]らの間[あいだ]に、自分[じぶん]たちのうちでだれが一番[いちばん]偉[えら]いかという争[あらそ]いが起[お]こった。"
  25: "イエスは言[い]われた。「<j>異邦人[いほうじん]の王[おう]たちは民[たみ]を支配[しはい]し、民[たみ]の上[うえ]に権[けん]をふるう者[もの]は恩人[おんじん]と呼[よ]ばれている。</j>"
  26: "<j>しかし、あなたがたはそうではない。あなたがたのうちで一番[いちばん]偉[えら]い者[もの]は、一番[いちばん]若[わか]い者[もの]のようになり、導[みちび]く者[もの]は仕[つか]える者[もの]のようになりなさい。</j>"
  27: "<j>食卓[しょくたく]に着[つ]いている者[もの]と仕[つか]える者[もの]とでは、どちらが偉[えら]いのか。食卓[しょくたく]に着[つ]いている者[もの]ではないか。しかし、わたしはあなたがたの間[あいだ]で仕[つか]える者[もの]となっている。</j>"
  28: "<j>あなたがたこそ、わたしが試練[しれん]に遭[あ]っていたとき、ずっとわたしと一緒[いっしょ]にいてくれた者[もの]たちである。</j>"
  29: "<j>わたしは、わたしの父[ちち]がわたしに国[くに]を委[ゆだ]ねたのと同[おな]じように、あなたがたに国[くに]を委[ゆだ]ねる。</j>"
  30: "<j>それは、あなたがたがわたしの国[くに]で、わたしの食卓[しょくたく]に着[つ]いて食[た]べ飲[の]みし、また位[くらい]に着[つ]いて、イスラエルの十二[じゅうに]の部族[ぶぞく]を裁[さば]くためである。</j>」"
  31: "「<j>シモン、シモン、見[み]よ、サタンは、あなたがたを小麦[こむぎ]のようにふるいにかけようと求[もと]めている。</j>"
  32: "<j>しかし、わたしは、あなたの信仰[しんこう]が失[うしな]われないように、あなたのために祈[いの]った。あなたは、立[た]ち返[かえ]ったとき、兄弟[きょうだい]たちを力[ちから]づけなさい。</j>」"
  33: "ペトロは言[い]った。「主[しゅ]よ、わたしは、あなたと一緒[いっしょ]なら、牢[ろう]にも死[し]にも行[い]く覚悟[かくご]です。」"
  34: "イエスは言[い]われた。「<j>ペトロ、あなたに言[い]っておく。今日[きょう]、鶏[にわとり]が鳴[な]くまでに、あなたは三度[さんど]、わたしを知[し]らないと言[い]うだろう。</j>」"
  35: "そして、彼[かれ]らに言[い]われた。「<j>わたしが、財布[さいふ]も旅[たび]袋[ぶくろ]も履物[はきもの]も持[も]たせずにあなたがたを遣[つか]わしたとき、何[なに]か不足[ふそく]したものはあったか。</j>」彼[かれ]らは言[い]った。「何[なに]もありませんでした。」"
  36: "イエスは言[い]われた。「<j>しかし、今[いま]は、財布[さいふ]のある者[もの]はそれを取[と]り、旅[たび]袋[ぶくろ]のある者[もの]も同[おな]じようにしなさい。また、剣[けん]を持[も]たない者[もの]は、自分[じぶん]の衣[ころも]を売[う]って剣[けん]を買[か]いなさい。</j>"
  37: "<j>あなたがたに言[い]っておく。『彼[かれ]は罪人[ざいにん]たちの仲間[なかま]に数[かぞ]えられた』と書[か]かれていることが、わたしにおいて成就[じょうじゅ]しなければならない。わたしについて書[か]かれていることは、終[お]わりを迎[むか]えているからである。</j>」"
  38: "彼[かれ]らは言[い]った。「主[しゅ]よ、ご覧[らん]ください。ここに二[ふた]つの剣[けん]があります。」イエスは言[い]われた。「<j>それで十分[じゅうぶん]である。</j>」"
  39: "イエスは外[そと]へ出[で]て、いつものようにオリーブ山[やま]へ行[い]かれた。弟子[でし]たちも彼[かれ]について行[い]った。"
  40: "その場所[ばしょ]に着[つ]かれると、弟子[でし]たちに言[い]われた。「<j>誘惑[ゆうわく]に陥[おちい]らないように、祈[いの]っていなさい。</j>」"
  41: "そして、イエスは石[いし]を投[な]げるほど彼[かれ]らから離[はな]れ、ひざまずいて祈[いの]られた。"
  42: "「<j>父[ちち]よ、もしお望[のぞ]みなら、この杯[さかずき]をわたしから過[す]ぎ去[さ]らせてください。しかし、わたしの思[おも]いではなく、あなたの御心[みこころ]がなりますように。</j>」"
  43: "〔そのとき、天使[てんし]が天[てん]から現[あらわ]れ、イエスに力[ちから]を与[あた]えた。〕"
  44: "〔イエスは苦[くる]しみもだえ、いっそう切[せつ]に祈[いの]られた。その汗[あせ]は、血[ち]の滴[したた]りのように地[ち]に落[お]ちた。〕"
  45: "祈[いの]りから起[お]きて弟子[でし]たちのところへ来[き]てみると、彼[かれ]らは悲[かな]しみのあまり眠[ねむ]っていた。"
  46: "そこで言[い]われた。「<j>なぜ眠[ねむ]っているのか。起[お]きて、誘惑[ゆうわく]に陥[おちい]らないように祈[いの]りなさい。</j>」"
  47: "イエスがまだ話[はな]しておられるうちに、見[み]よ、群衆[ぐんしゅう]がやって来[き]た。十二人[じゅうににん]の一人[ひとり]でユダという者[もの]が、その先[さき]に立[た]って進[すす]み、イエスに近[ちか]づいて接吻[せっぷん]しようとした。〔ユダはあらかじめ彼[かれ]らに合図[あいず]を決[き]めておいて、『わたしが接吻[せっぷん]する者[もの]が、その人[ひと]だ』と言[い]っていたのである。〕"
  48: "イエスはユダに言[い]われた。「<j>ユダ、あなたは接吻[せっぷん]で人[ひと]の子[こ]を裏切[うらぎ]るのか。</j>」"
  49: "イエスと一緒[いっしょ]にいた者[もの]たちは、事[こと]のなろうとしているのを見[み]て言[い]った。「主[しゅ]よ、剣[けん]で打[う]ちましょうか。」"
  50: "すると、彼[かれ]らのうちの一人[ひとり]が大祭司[だいさいし]の僕[しもべ]を打[う]ち、その右[みぎ]の耳[みみ]を切[き]り落[と]した。"
  51: "イエスはお答[こた]えになって言[い]われた。「<j>これ以上[いじょう]はやめなさい。</j>」そして、その耳[みみ]に触[ふ]れて癒[いや]された。"
  52: "イエスは、自分[じぶん]を捕[と]らえに来[き]た祭司長[さいしちょう]たち、神殿[しんでん]の警護[けいご]の長[ちょう]たち、長老[ちょうろう]たちに言[い]われた。「<j>まるで強盗[ごうとう]にでも向[む]かうように、剣[けん]や棒[ぼう]を持[も]って出[で]て来[き]たのか。</j>"
  53: "<j>わたしは毎日[まいにち]、あなたがたと一緒[いっしょ]に神殿[しんでん]にいたのに、あなたがたはわたしに手[て]をかけたことがなかった。しかし、今[いま]はあなたがたの時[とき]、闇[やみ]の支配[しはい]の時[とき]である。</j>」"
  54: "彼[かれ]らはイエスを捕[と]らえて引[ひ]き連[つ]れて行[い]き、大祭司[だいさいし]の家[いえ]に連[つ]れ込[こ]んだ。ペトロは遠[とお]くからついて行[い]った。"
  55: "人[ひと]々[びと]が中庭[なかにわ]の真[ま]ん中[なか]に火[ひ]を起[お]こして一緒[いっしょ]に座[すわ]ったので、ペトロも彼[かれ]らの間[あいだ]に座[すわ]った。"
  56: "一人[ひとり]の女中[じょちゅう]が、火[ひ]の明[あ]かりのそばに座[すわ]っているペトロを見[み]て、じっと見[み]つめながら言[い]った。「この人[ひと]も、あの人[ひと]と一緒[いっしょ]にいました。」"
  57: "しかし、ペトロはそれを否[いな]んで言[い]った。「女[おんな]よ、わたしはあの人[ひと]を知[し]らない。」"
  58: "しばらくすると、別[べつ]の人[ひと]がペトロを見[み]て言[い]った。「あなたも、あの人[ひと]たちの一人[ひとり]だ。」ペトロは言[い]った。「人[ひと]よ、そうではない。」"
  59: "一時間[いちじかん]ほどたつと、また別[べつ]の人[ひと]が強[つよ]く言[い]い張[は]った。「確[たし]かに、この人[ひと]もあの人[ひと]と一緒[いっしょ]にいた。ガリラヤ人[じん]だからだ。」"
  60: "ペトロは言[い]った。「人[ひと]よ、あなたが何[なに]を言[い]っているのか、わたしには分[わ]からない。」彼[かれ]がまだ話[はな]しているうちに、鶏[にわとり]が鳴[な]いた。"
  61: "主[しゅ]は振[ふ]り向[む]いてペトロを見[み]つめられた。ペトロは、主[しゅ]が自分[じぶん]に言[い]われた「今日[きょう]、鶏[にわとり]が鳴[な]く前に、あなたは三度[さんど]、わたしを知[し]らないと言[い]うだろう」という言葉[ことば]を思[おも]い出[だ]した。"
  62: "そして、外[そと]へ出[で]て、激[はげ]しく泣[な]いた。"
  63: "イエスを警護[けいご]していた男[おとこ]たちは、イエスを嘲[あざけ]り、打[う]ちたたいた。"
  64: "そして、目[め]を覆[おお]って尋[たず]ねた。「預言[よげん]しろ。あなたを打[う]ったのはだれか。」"
  65: "また、そのほか多[おお]くのことを言[い]って、イエスを冒涜[ぼうとく]した。"
  66: "夜[よ]が明[あ]けると、民[たみ]の長老[ちょうろう]たちの議会[ぎかい]、すなわち祭司長[さいしちょう]たちと律法学者[りっぽうがくしゃ]たちが集[あつ]まり、イエスを最高法院[さいこうほういん]に引[ひ]き立[た]てて言[い]った。"
  67: "「もし、あなたがキリストなら、わたしたちに言[い]ってください。」イエスは言[い]われた。「<j>わたしが言[い]っても、あなたがたは信[しん]じないだろう。</j>"
  68: "<j>わたしが尋[たず]ねても、あなたがたはわたしに答[こた]えない。〔わたしを放[はな]つこともない。〕</j>"
  69: "<j>しかし、今[いま]から後[のち]、人[ひと]の子[こ]は神[かみ]の力[ちから]の右[みぎ]の座[ざ]に着[つ]くのである。</j>」"
  70: "そこで、皆[みな]が言[い]った。「それなら、あなたは神[かみ]の子[こ]なのか。」イエスは彼[かれ]らに言[い]われた。「<j>あなたがたが、わたしがそうだと言[い]っているのである。</j>」"
  71: "彼[かれ]らは言[い]った。「これ以上[いじょう]、何[なん]の証言[しょうげん]が必要[ひつよう]でしょうか。この人[ひと]の口[くち]から、じかに聞[き]いたのですから。」"

notes:
  1: "ἡ ἑορτὴ τῶν ἀζύμων ἡ λεγομένη πάσχα — у Луки обратный порядок: сначала опресноки, потом «называемая Пасха». Порядок сохранён. Сноски нет: 過越祭 и 除酵祭 объяснены в Мк 14:1 (и Мф 26:2)."
  2: "τὸ πῶς ἀνέλωσιν αὐτόν — «как убить Его»; ἐφοβοῦντο γὰρ τὸν λαόν — «ибо боялись народа»."
  3: "εἰσῆλθεν… Σατανᾶς εἰς Ἰούδαν — «вошёл сатана в Иуду»; ὄντα ἐκ τοῦ ἀριθμοῦ τῶν δώδεκα — «бывшего из числа двенадцати», передано 十二人の一人である."
  4: "στρατηγοί — начальники храмовой стражи, 神殿の警護の長. У Мк 14:10 и Мф 26:15 только первосвященники."
  5: "συνέθεντο αὐτῷ ἀργύριον δοῦναι — «согласились дать ему серебро»; суммы у Луки нет."
  6: "ἐξωμολόγησεν — «обещал, согласился»; 承知して. ἄτερ ὄχλου — «без народа», то есть без толпы."
  7: "ἐν ᾗ ἔδει θύεσθαι τὸ πάσχα — «в который надлежало заколать пасхального агнца»; 過越の小羊を屠るべき日."
  8: "ἀπέστειλεν Πέτρον καὶ Ἰωάννην — у Луки посланы именно Пётр и Иоанн (у Мк 14:13 — два ученика без имён)."
  9: "Ποῦ θέλεις ἑτοιμάσωμεν — «где хочешь, чтобы мы приготовили?»"
  10: "κεράμιον ὕδατος βαστάζων — «несущий глиняный сосуд с водой»; 甕. У Мк 14:13 то же, у Луки добавлено «входит в дом»."
  11: "κατάλυμα — «гостиница, горница»; 部屋. Речь Христа → 『』 внутри «»; «わたしが…」 — слова Учителя внутри 『』, остаются красными."
  12: "ἀνάγαιον μέγα ἐστρωμένον — «большая горница, устланная»; 敷き物の敷かれた大きな二階の部屋."
  14: "ἀνέπεσεν καὶ οἱ ἀπόστολοι σὺν αὐτῷ — «возлёг и апостолы с Ним»; у Луки ἀπόστολοι, поэтому 使徒."
  15: "Ἐπιθυμίᾳ ἐπεθύμησα — гебраизм, усиленное желание: 切に願っていた. πρὸ τοῦ με παθεῖν — «прежде нежели Мне пострадать»."
  16: "οὐ μὴ φάγω αὐτὸ ἕως ὅτου πληρωθῇ ἐν τῇ βασιλείᾳ τοῦ θεοῦ — «не буду есть его, пока не исполнится в Царствии Божием»."
  17: "δεξάμενος ποτήριον εὐχαριστήσας — «приняв чашу и возблагодарив»; у Луки чаша прежде хлеба (17–18), затем хлеб (19), затем снова чаша (20). Порядок не сглажен."
  18: "ἀπὸ τοῦ γενήματος τῆς ἀμπέλου — «от плода виноградной лозы»; ぶどうの実から造ったもの, как в Мк 14:25."
  19: "В критическом издании под скобками стоит τὸ ὑπὲρ ὑμῶν διδόμενον… εἰς τὴν ἐμὴν ἀνάμνησιν; Церковь (Елизаветинская «еже за вы ломимое; сие творите в Мое воспоминание», jp-joc) читает — 〔…〕. Хлеб — «тело, за вас предаваемое»; τὸ διδόμενον — 渡される."
  20: "Стих целиком отсутствует в критическом издании (скобка закрывается в конце стиха); Церковь читает — весь стих в 〔…〕. ἡ καινὴ διαθήκη ἐν τῷ αἵματί μου — «новый завет в крови Моей»; わたしの血による新しい契約. τὸ ὑπὲρ ὑμῶν ἐκχυννόμενον — «за вас изливаемое»."
  21: "πλὴν ἰδοὺ ἡ χεὶρ τοῦ παραδιδόντος με μετ᾽ ἐμοῦ ἐπὶ τῆς τραπέζης — «рука предающего Меня со Мною за столом»."
  22: "κατὰ τὸ ὡρισμένον — «по определённому [совету]»; 定められているとおりに. οὐαὶ τῷ ἀνθρώπῳ ἐκείνῳ — 災いである."
  23: "συζητεῖν πρὸς ἑαυτούς — «рассуждать между собой»."
  24: "φιλονεικία — «спор, соперничество»; τὸ τίς αὐτῶν δοκεῖ εἶναι μείζων — «кто из них кажется большим»."
  25: "οἱ ἐξουσιάζοντες… εὐεργέται καλοῦνται — «властвующие называются благодетелями»; 恩人. Историческая деталь: «благодетель» — титул эллинистических царей."
  26: "ὁ νεώτερος — «младший»; 一番若い者. ὁ ἡγούμενος ὡς ὁ διακονῶν — «начальствующий — как служащий»."
  27: "ὁ ἀνακείμενος — «возлежащий [за трапезой]»; 食卓に着いている者. ἐγὼ δὲ ἐν μέσῳ ὑμῶν εἰμι ὡς ὁ διακονῶν — «Я посреди вас — как служащий»."
  28: "οἱ διαμεμενηκότες μετ᾽ ἐμοῦ ἐν τοῖς πειρασμοῖς μου — «пребывшие со Мною в искушениях Моих»; 試練に遭っていたとき、ずっと一緒にいてくれた."
  29: "διατίθεμαι ὑμῖν… βασιλείαν — «завещаваю вам Царство»; 国を委ねる. Порядок «как завещал Мне Отец Мой» сохранён после главного глагола."
  30: "καθῆσθε ἐπὶ θρόνων — «сядете на престолах»; 位に着いて. τὰς δώδεκα φυλὰς κρίνοντες — 十二の部族を裁く."
  31: "Σίμων Σίμων — двойное обращение сохранено. ἐξῃτήσατο ὑμᾶς τοῦ σινιάσαι ὡς τὸν σῖτον — «испросил вас, чтобы сеять, как пшеницу»; σινιάζω — просеивать через сито, поэтому ふるいにかける; σῖτος — пшеница, 小麦 (не «плевелы»)."
  32: "ἐδεήθην περὶ σοῦ — «Я молился о тебе»; ἵνα μὴ ἐκλίπῃ ἡ πίστις σου — «чтобы не оскудела вера твоя». ἐπιστρέψας στήρισον τοὺς ἀδελφούς σου — «обратившись, утверди братьев твоих»; 立ち返ったとき、兄弟たちを力づけなさい."
  33: "Κύριε — обращение Петра, не красным. ἕτοιμός εἰμι — 覚悟です."
  34: "οὐ φωνήσει σήμερον ἀλέκτωρ ἕως τρὶς με ἀπαρνήσῃ εἰδένᾳ — «не пропоёт сегодня петух, как ты трижды отречёшься»; ἕως с аористом передано 鳴くまでに. У Луки петух поёт один раз (у Мк 14:30 — дважды)."
  35: "ἄτερ βαλλαντίου καὶ πήρας καὶ ὑποδημάτων — «без мешка, сумы и обуви»; 財布、旅袋、履物. μή τινος ὑστερήσατε — «не имели ли недостатка в чём?»"
  36: "ὁ ἔχων βαλλάντιον ἀράτω… ὁ μὴ ἔχων πωλησάτω τὸ ἱμάτιον αὐτοῦ καὶ ἀγορασάτω μάχαιραν — «не имеющий пусть продаст одежду свою и купит меч». Эллипсис «не имеющий [меча]» раскрыт в 剣を持たない者; смысл не сглажен."
  37: "Ис 53:12. δεῖ τελεσθῆναι ἐν ἐμοί — «должно исполниться на Мне». τὸ περὶ ἐμοῦ τέλος ἔχει — «то, что о Мне, приходит к концу»."
  38: "Ἱκανόν ἐστιν — «довольно»; それで十分である. Ответ не разъяснён нарочно: двусмысленность сохранена, как в греческом."
  39: "κατὰ τὸ ἔθος — «по обычаю»; いつものように. Ὄρος τῶν Ἐλαιῶν — オリーブ山; написание корпуса, в задании オリーブ山 — вынесено на ревью."
  40: "Προσεύχεσθε μὴ εἰσελθεῖν εἰς πειρασμόν — «молитесь, чтобы не войти в искушение»; 誘惑に陥らないように, как в Мф 26:41 и Мк 14:38."
  41: "ὡσεὶ λίθου βολήν — «на расстояние броска камня»; 石を投げるほど. θεὶς τὰ γόνατα — «преклонив колени»; ひざまずいて."
  42: "εἰ βούλει παρένεγκε τοῦτο τὸ ποτήριον ἀπ᾽ ἐμοῦ — «если хочешь, пронеси чашу сию мимо Меня». πλὴν μὴ τὸ θέλημά μου ἀλλὰ τὸ σὸν γινέσθω — «но не Моя воля, но Твоя да будет»; わたしの思いではなく、あなたの御心がなりますように (御心 — как в Мф 26:42)."
  43: "Стих отсутствует в критическом издании; Церковь читает — весь стих в 〔…〕. ὤφθη δὲ αὐτῷ ἄγγελος ἀπ᾽ οὐρανοῦ ἐνισχύων αὐτόν — «явился Ему ангел с неба и укреплял Его»; 力づけた."
  44: "Стих отсутствует в критическом издании; Церковь читает — весь стих в 〔…〕. γενόμενος ἐν ἀγωνίᾳ — «будучи в борении»; 苦しみもだえ. θρόμβοι αἵματος — «капли (сгустки) крови»; 血の滴り."
  45: "ἀναστὰς ἀπὸ τῆς προσευχῆς — «встав от молитвы»; εὗρεν κοιμωμένους αὐτοὺς ἀπὸ τῆς λύπης — «нашёл их спящими от печали»; 悲しみのあまり眠っていた."
  46: "Τί καθεύδετε; — «что вы спите?»; なぜ眠っているのか."
  47: "В критическом издании стих кончается на φιλῆσαι αὐτόν; слова о знаке (τοῦτο γὰρ σημεῖον δεδώκει αὐτοῖς…) есть в Церкви (Елизаветинская «се же знамение даяше им», Синод. «Ибо он дал им знак», jp-joc) — 〔…〕. Формулировка согласована с Мк 14:44."
  48: "φιλήματι τὸν υἱὸν τοῦ ἀνθρώπου παραδίδως — «поцелуем ли Сына Человеческого предаёшь?»; 接吻で…裏切るのか."
  49: "τὸ ἐσόμενον — «что будет»; εἰ πατάξομεν ἐν μαχαίρῃ — «не ударить ли нам мечом?»"
  50: "ἀφεῖλεν τὸ οὖς αὐτοῦ τὸ δεξιόν — «отсёк ухо его правое»; порядок «правое ухо» сохранён. У Луки не назван ученик (у Ин 18:10 — Пётр)."
  51: "Ἐᾶτε ἕως τούτου — тёмное место: «оставьте, довольно того»; これ以上はやめなさい. ἁψάμενος τοῦ ὠτίου ἰάσατο αὐτόν — «коснувшись уха, исцелил его»."
  52: "πρὸς τοὺς παραγενομένους ἐπ᾽ αὐτὸν ἀρχιερεῖς καὶ στρατηγοὺς τοῦ ἱεροῦ καὶ πρεσβυτέρους — три группы, как у Луки, порядок сохранён. ὡς ἐπὶ λῃστήν — «как на разбойника»."
  53: "καθ᾽ ἡμέραν ὄντος μου μεθ᾽ ὑμῶν ἐν τῷ ἱερῷ — «бывая с вами каждый день в храме». αὕτη ἐστὶν ὑμῶν ἡ ὥρα καὶ ἡ ἐξουσία τοῦ σκότους — «это ваш час и власть тьмы»."
  54: "εἰσήγαγον εἰς τὴν οἰκίαν τοῦ ἀρχιερέως — «ввели в дом первосвященника»; ὁ δὲ Πέτρος ἠκολούθει μακρόθεν — «Пётр следовал издали»."
  55: "περιαψάντων πῦρ ἐν μέσῳ τῆς αὐλῆς — «разведя огонь посреди двора»; 中庭の真ん中に火を起こして."
  56: "παιδίσκη τις — 女中, как в Мк 14:66. πρὸς τὸ φῶς — «при свете [огня]»; 火の明かりのそばに. У Луки одна служанка, у Мк — та же и другие."
  57: "γύναι — «женщина», обращение без грубости; 女よ. Οὐκ οἶδα αὐτόν — わたしはあの人を知らない."
  58: "ἕτερος — «другой»; 別の人. Ἄνθρωπε — 人よ."
  59: "διαστάσης ὡσεὶ ὥρας μιᾶς — «спустя около часа». διϊσχυρίζετο — «настойчиво утверждал»; 強く言い張った. καὶ γὰρ Γαλιλαῖός ἐστιν — «ибо он галилеянин»."
  60: "παραχρῆμα ἔτι λαλοῦντος αὐτοῦ — «тотчас, когда он ещё говорил»; ἐφώνησεν ἀλέκτωρ — 鶏が鳴いた."
  61: "στραφεὶς ὁ κύριος ἐνέβλεψεν τῷ Πέτρῳ — «Господь, обернувшись, взглянул на Петра»; только у Луки. Слова Господа переданы косвенной цитатой в 「」, поэтому не красным."
  62: "ἔκλαυσεν πικρῶς — «горько плакал»; 激しく泣いた. У Луки нет «и вышел вон» после взгляда — только 外へ出て."
  63: "οἱ ἄνδρες οἱ συνέχοντες αὐτόν — «державшие Его»; 警護していた男たち. ἐνέπαιζον… δέροντες — «издевались, били»."
  64: "περικαλύψαντες αὐτὸν — «закрыв Ему [лицо]»; ἐπηρώτων — 尋ねた. Προφήτευσον, τίς ἐστιν ὁ παίσας σε — «прореки, кто ударил Тебя?»"
  65: "ἕτερα πολλὰ βλασφημοῦντες — «много и другого, богохульствуя»; 冒涜した."
  66: "ὡς ἐγένετο ἡμέρα — «когда настал день»; 夜が明けると. πρεσβυτέριον τοῦ λαοῦ — «собрание старейшин народных»; 民の長老たちの議会. συνέδριον — 最高法院, как в Мк 14:55. Суд происходит на рассвете, а не ночью, как у Мк 14:53."
  67: "Εἰ σὺ εἶ ὁ Χριστός — «если Ты Христос»; キリスト (не メシア). Ἐὰν ὑμῖν εἴπω οὐ μὴ πιστεύσητε — «если скажу вам, не поверите»."
  68: "ἐὰν δὲ ἐρωτήσω οὐ μὴ ἀποκριθῆτε — «если же спрошу, не ответите». В Церкви (Елизаветинская «ни отпустите», jp-joc 又我を釋さざらん) добавлено ἢ ἀπολύσητε — 〔…〕."
  69: "ἀπὸ τοῦ νῦν — «отныне»; ἔσται… καθήμενος — «будет сидеть»; 右の座に着く. ἐκ δεξιῶν τῆς δυνάμεως τοῦ θεοῦ — «одесную силы Божией»; здесь «сила» не перифраза имени, а прямое 神の力."
  70: "Σὺ οὖν εἶ ὁ υἱὸς τοῦ θεοῦ; — «итак, Ты Сын Божий?» Ὑμεῖς λέγετε ὅτι ἐγώ εἰμι — «вы говорите, что это Я»; あなたがたが、わたしがそうだと言っているのである (семитизм, не сглажен)."
  71: "Τί ἔτι ἔχομεν μαρτυρίας χρείαν; — «какое ещё нужно свидетельство?» ἀπὸ τοῦ στόματος αὐτοῦ — «из уст Его»; じかに聞いた."
