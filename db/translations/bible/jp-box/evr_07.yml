verses:
  1: "このメルキセデクは、サレムの王[おう]であり、いと高[たか]き神[かみ]の祭司[さいし]であった。彼[かれ]は、王[おう]たちを討[う]って帰[かえ]って来[き]たアブラハムを迎[むか]え、彼[かれ]を祝福[しゅくふく]した。"
  2: "アブラハムは、すべてのものの十[じゅう]分[ぶん]の一[いち]を彼[かれ]に分[わ]け与[あた]えた。まず、その名[な]を訳[やく]すと「義[ぎ]の王[おう]」であり、次[つぎ]に「サレムの王[おう]」、すなわち「平和[へいわ]の王[おう]」である。"
  3: "父[ちち]もなく、母[はは]もなく、系図[けいず]もなく、日[ひ]の始[はじ]めもなく、いのちの終[お]わりもなく、神[かみ]の御子[みこ]に似[に]た者[もの]とされ、いつまでも祭司[さいし]としてとどまっている。"
  4: "この人[ひと]がどれほど大[おお]きい者[もの]であるかを、よく考[かんが]えなさい。族長[ぞくちょう]であるアブラハムさえも、最[もっと]も良[よ]い戦利品[せんりひん]の十[じゅう]分[ぶん]の一[いち]を彼[かれ]に与[あた]えたのである。"
  5: "レビの子[こ]たちのうちで祭司職[さいししょく]を受[う]ける者[もの]たちは、律法[りっぽう]によって民[たみ]から、すなわち自分[じぶん]の兄弟[きょうだい]たちから十[じゅう]分[ぶん]の一[いち]を取[と]る掟[おきて]を与[あた]えられている。その兄弟[きょうだい]たちも、アブラハムの腰[こし]から出[で]た者[もの]であるのに。"
  6: "しかし、彼[かれ]らの系図[けいず]に属[ぞく]さないこの人[ひと]は、アブラハムから十[じゅう]分[ぶん]の一[いち]を受[う]け取[と]り、約束[やくそく]を持[も]っている者[もの]を祝福[しゅくふく]した。"
  7: "小[ちい]さい者[もの]が大[おお]きい者[もの]から祝福[しゅくふく]を受[う]けることは、疑[うたが]いのないことである。"
  8: "また、ここでは死[し]ぬべき人[ひと]たちが十[じゅう]分[ぶん]の一[いち]を受[う]け取[と]っているが、そこでは、生[い]きていると証[あかし]されている者[もの]が受[う]け取[と]っている。"
  9: "いわば、十[じゅう]分[ぶん]の一[いち]を受[う]け取[と]るレビも、アブラハムを通[とお]して十[じゅう]分[ぶん]の一[いち]を納[おさ]めたのである。"
  10: "メルキセデクがアブラハムに会[あ]ったとき、レビはまだ父[ちち]の腰[こし]のうちにいたからである。"
  11: "そこで、もしレビの祭司職[さいししょく]によって完成[かんせい]が得[え]られたのなら——民[たみ]はその祭司職[さいししょく]の下[もと]で律法[りっぽう]を受[う]けたのだから——なぜもう一人[ひとり]、アロンの位[くらい]に従[したが]うのではなく、メルキセデクの位[くらい]に従[したが]う祭司[さいし]が立[た]つ必要[ひつよう]があったのか。"
  12: "祭司職[さいししょく]が変[か]えられるなら、律法[りっぽう]も必[かなら]ず変[か]えられる。"
  13: "これらのことが言[い]われている方[かた]は、別[べつ]の部族[ぶぞく]に属[ぞく]しておられる。その部族[ぶぞく]からは、だれ一人[ひとり]も祭壇[さいだん]に仕[つか]えた者[もの]はいない。"
  14: "わたしたちの主[しゅ]がユダから出[で]たことは明[あき]らかである。モーセは、その部族[ぶぞく]について祭司[さいし]のことに何[なに]も語[かた]っていない。"
  15: "このことは、さらに明[あき]らかである。メルキセデクに似[に]た別[べつ]の祭司[さいし]が立[た]つなら、"
  16: "その祭司[さいし]は、肉[にく]についての掟[おきて]の律法[りっぽう]によるのではなく、朽[く]ちないいのちの力[ちから]によって立[た]つ者[もの]だからである。"
  17: "「あなたは永遠[えいえん]に、メルキセデクの位[くらい]に従[したが]う祭司[さいし]である」と証[あかし]されているからである。"
  18: "というのは、以前[いぜん]の掟[おきて]は、その弱[よわ]さと役[やく]に立[た]たなさのゆえに廃止[はいし]され、"
  19: "律法[りっぽう]は何[なに]も完成[かんせい]しなかったからである。しかし、それに代[か]わって、より良[よ]い希望[きぼう]が導[みちび]き入[い]れられ、その希望[きぼう]によって、わたしたちは神[かみ]に近[ちか]づくのである。"
  20: "また、このことは誓[ちか]いなしではない。あの者[もの]たちは誓[ちか]いなしに祭司[さいし]となったが、"
  21: "この方は、ご自身[じしん]に「主[しゅ]は誓[ちか]って、悔[く]いることはない。あなたは永遠[えいえん]に〔メルキセデクの位[くらい]に従[したが]う〕祭司[さいし]である」と語[かた]られた方[かた]によって、誓[ちか]いをもって祭司[さいし]とされたのである。"
  22: "その分[ぶん]だけ、イエスはより良[よ]い契約[けいやく]の保証者[ほしょうしゃ]となられたのである。"
  23: "また、あの者[もの]たちは死[し]によって祭司[さいし]の務[つと]めを続[つづ]けることを妨[さまた]げられるので、多[おお]くの者[もの]が祭司[さいし]となったが、"
  24: "この方は永遠[えいえん]にとどまるので、移[うつ]ることのない祭司職[さいししょく]を持[も]っておられる。"
  25: "それゆえ、この方は、ご自身[じしん]を通[とお]して神[かみ]に近[ちか]づく者[もの]たちを、完全[かんぜん]に救[すく]うことができる。いつも生[い]きて、彼[かれ]らのために執[と]り成[な]しておられるからである。"
  26: "このような大祭司[だいさいし]こそ、わたしたちにはふさわしい方[かた]であった。聖[せい]にして、悪[あく]なく、汚[けが]れなく、罪人[ざいにん]から離[はな]され、天[てん]よりも高[たか]くされた方[かた]である。"
  27: "この方は、あの大祭司[だいさいし]たちのように、まず自分[じぶん]の罪[つみ]のために、次[つぎ]に民[たみ]の罪[つみ]のために、日[ひ]ごとにいけにえをささげる必要[ひつよう]がない。ご自身[じしん]をささげて、一度[いちど]でそれを成[な]し遂[と]げられたからである。"
  28: "律法[りっぽう]は弱[よわ]さを持[も]つ人[ひと]たちを大祭司[だいさいし]に任[にん]じるが、律法[りっぽう]の後[のち]に来[き]た誓[ちか]いの言葉[ことば]は、永遠[えいえん]に完成[かんせい]された御子[みこ]を任[にん]じるのである。"

notes:
  1: "Οὗτος γὰρ ὁ Μελχισέδεκ — このメルキセデクは. βασιλεὺς Σαλήμ — サレムの王. ἱερεὺς τοῦ θεοῦ τοῦ ὑψίστου — いと高き神の祭司 (ὕψιστος — いと高き). ὁ συναντήσας Ἀβραάμ — アブラハムを迎えた (συναντάω — «встречать»). ὑποστρέφοντι ἀπὸ τῆς κοπῆς τῶν βασιλέων — 王たちを討って帰って来た (κοπή — «поражение, избиение»). εὐλογήσας αὐτόν — 彼を祝福した."
  2: "ᾧ καὶ δεκάτην ἀπὸ πάντων ἐμέρισεν Ἀβραάμ — アブラハムはすべてのものの十分の一を彼に分け与えた. πρῶτον μὲν ἑρμηνευόμενος — まず、その名を訳すと (ἑρμηνεύω — «переводить, толковать»). βασιλεὺς δικαιοσύνης — 義の王. ἔπειτα δὲ καὶ βασιλεὺς Σαλήμ, ὅ ἐστιν βασιλεὺς εἰρήνης — 次にサレムの王、すなわち平和の王; игра имён сохранена."
  3: "ἀπάτωρ, ἀμήτωρ, ἀγενεαλόγητος — 父もなく、母もなく、系図もなく (Писание не сообщает о его родителях и родословии; буквального «не имел родителей» текст не говорит). μήτε ἀρχὴν ἡμερῶν μήτε ζωῆς τέλος ἔχων — 日の始めもなく、いのちの終わりもなく. ἀφωμοιωμένος δὲ τῷ υἱῷ τοῦ θεοῦ — 神の御子に似た者とされ (ὁμοιόω — «уподоблять»; не «Сын Божий», а уподобленный Ему). μένει ἱερεὺς εἰς τὸ διηνεκές — いつまでも祭司としてとどまる (διηνεκές — «непрерывно, постоянно»)."
  4: "Θεωρεῖτε δέ — よく考えなさい (θεωρέω — «смотреть, рассматривать»). πηλίκος — どれほど大きい者. ἐκ τῶν ἀκροθινίων — 最も良い戦利品から (ἀκροθίνια — «начатки добычи»). ὁ πατριάρχης — 族長."
  5: "οἱ ἐκ τῶν υἱῶν Λευὶ τὴν ἱερατείαν λαμβάνοντες — レビの子たちのうちで祭司職を受ける者たち. ἐντολὴν ἔχουσιν ἀποδεκατοῦν — 十分の一を取る掟を与えられている (ἀποδεκατόω — «брать десятину»). κατὰ τὸν νόμον — 律法によって. καίπερ ἐξεληλυθότας ἐκ τῆς ὀσφύος Ἀβραάμ — アブラハムの腰から出た者であるのに (уступка: они тоже потомки Авраама)."
  6: "ὁ δὲ μὴ γενεαλογούμενος ἐξ αὐτῶν — 彼らの系図に属さないこの人. δεδεκάτωκεν Ἀβραάμ — アブラハムから十分の一を受け取り. τὸν ἔχοντα τὰς ἐπαγγελίας εὐλόγηκεν — 約束を持っている者を祝福した (множественное число: 約束)."
  7: "χωρὶς δὲ πάσης ἀντιλογίας — 疑いのないことである (ἀντιλογία — «возражение, спор»). τὸ ἔλαττον ὑπὸ τοῦ κρείττονος εὐλογεῖται — 小さい者が大きい者から祝福を受ける; сравнительные степени сохранены."
  8: "ὧδε μὲν δεκάτας ἀποθνῄσκοντες ἄνθρωποι λαμβάνουσιν — ここでは死ぬべき人たちが十分の一を受け取っている. ἐκεῖ δὲ μαρτυρούμενος ὅτι ζῇ — そこでは、生きていると証しされている者が受け取っている (μαρτυρέω в страдательном: «о нём свидетельствуется»; подлежащее не названо)."
  9: "ὡς ἔπος εἰπεῖν — いわば (букв. «так сказать»). δι᾽ Ἀβραὰμ καὶ Λευὶ ὁ δεκάτας λαμβάνων δεδεκάτωται — 十分の一を受け取るレビも、アブラハムを通して十分の一を納めた (логика: Леви был в Аврааме, ст. 10)."
  10: "ἔτι γὰρ ἐν τῇ ὀσφύϊ τοῦ πατρὸς ἦν — まだ父の腰のうちにいた (ὀσφύς — «чресла, поясница»). ὅτε συνήντησεν αὐτῷ Μελχισέδεκ — メルキセデクがアブラハムに会ったとき."
  11: "Εἰ μὲν οὖν τελείωσις διὰ τῆς Λευιτικῆς ἱερωσύνης ἦν — もしレビの祭司職によって完成が得られたのなら (τελείωσις — «совершение, достижение полноты»). ὁ λαὸς γὰρ ἐπ᾽ αὐτῆς νενομοθέτηται — 民はその祭司職の下で律法を受けた (νομοθετέω — «давать закон»), вставка в скобках-тире. τίς ἔτι χρεία…ἕτερον ἀνίστασθαι ἱερέα — なぜもう一人の祭司が立つ必要があったのか. κατὰ τὴν τάξιν Ἀαρών — アロンの位に従う."
  12: "μετατιθεμένης γὰρ τῆς ἱερωσύνης — 祭司職が変えられるなら (μετατίθημι — «переменять, переносить»). ἐξ ἀνάγκης καὶ νόμου μετάθεσις γίνεται — 律法も必ず変えられる (ἐξ ἀνάγκης — «по необходимости»)."
  13: "ἐφ᾽ ὃν γὰρ λέγεται ταῦτα — これらのことが言われている方は. φυλῆς ἑτέρας μετέσχηκεν — 別の部族に属しておられる (μετέχω — «участвовать, принадлежать»). ἀφ᾽ ἧς οὐδεὶς προσέσχεν τῷ θυσιαστηρίῳ — その部族からは、だれ一人祭壇に仕えた者はいない (προσέχω — «обращаться к, служить»)."
  14: "πρόδηλον γὰρ ὅτι ἐξ Ἰούδα ἀνατέταλκεν ὁ κύριος ἡμῶν — わたしたちの主がユダから出たことは明らか (ἀνατέλλω — «восходить, происходить»). εἰς ἣν φυλὴν περὶ ἱερέων οὐδὲν Μωϋσῆς ἐλάλησεν — モーセはその部族について祭司のことに何も語っていない."
  15: "καὶ περισσότερον ἔτι κατάδηλόν ἐστιν — このことは、さらに明らかである (κατάδηλος — «совершенно ясный»). εἰ κατὰ τὴν ὁμοιότητα Μελχισέδεκ ἀνίσταται ἱερεὺς ἕτερος — メルキセデクに似た別の祭司が立つなら (ὁμοιότης — «подобие»)."
  16: "ὃς οὐ κατὰ νόμον ἐντολῆς σαρκίνης γέγονεν — 肉についての掟の律法によるのではなく (σάρκινος — «плотской», о телесном происхождении и родословии). κατὰ δύναμιν ζωῆς ἀκαταλύτου — 朽ちないいのちの力によって (ἀκατάλυτος — «неразрушимый»)."
  17: "Пс 110:4. μαρτυρεῖται γὰρ ὅτι — 証しされているからである (безличное «свидетельствуется»). Цитата — 「…」, слова Бога Отца, не красная."
  18: "ἀθέτησις μὲν γὰρ γίνεται προαγούσης ἐντολῆς — 以前の掟は廃止され (ἀθέτησις — «отмена»; προάγω — «предшествовать»). διὰ τὸ αὐτῆς ἀσθενὲς καὶ ἀνωφελές — その弱さと役に立たなさのゆえに; два определения сохранены."
  19: "οὐδὲν γὰρ ἐτελείωσεν ὁ νόμος — 律法は何も完成しなかった (τελειόω — ср. 7:11,28). ἐπεισαγωγὴ δὲ κρείττονος ἐλπίδος — それに代わって、より良い希望が導き入れられ (ἐπεισαγωγή — «введение сверх, дополнительно»). δι᾽ ἧς ἐγγίζομεν τῷ θεῷ — その希望によって、わたしたちは神に近づく (ἐγγίζω — «приближаться»)."
  20: "καθ᾽ ὅσον οὐ χωρὶς ὁρκωμοσίας — このことは誓いなしではない (ὁρκωμοσία — «клятва»). οἱ μὲν γὰρ χωρὶς ὁρκωμοσίας εἰσὶν ἱερεῖς γεγονότες — あの者たちは誓いなしに祭司となったが (левитские священники)."
  21: "ὁ δὲ μετὰ ὁρκωμοσίας διὰ τοῦ λέγοντος πρὸς αὐτόν — この方は、ご自身に…と語られた方によって、誓いをもって祭司とされた (цитата вложена в речь Бога). В базе цитата обрывается на εἰς τὸν αἰῶνα: слов κατὰ τὴν τάξιν Μελχισέδεκ нет (проверено: 0 вхождений), поэтому 〔メルキセデクの位に従う〕. Ὤμοσεν κύριος, καὶ οὐ μεταμεληθήσεται — 主は誓って、悔いることはない (μεταμέλομαι — «раскаиваться»; в базе μεταμεληθήσεται, 3 л., а не μεταμεληθήσομαι). Пс 110:4."
  22: "κατὰ τοσοῦτο — その分だけ (соотносится с καθ᾽ ὅσον, ст. 20). κρείττονος διαθήκης γέγονεν ἔγγυος Ἰησοῦς — イエスはより良い契約の保証者となられた (ἔγγυος — «поручитель, гарант»; ср. 8:6 μεσίτης)."
  23: "οἱ μὲν πλείονές εἰσιν γεγονότες ἱερεῖς — 多くの者が祭司となった. διὰ τὸ θανάτῳ κωλύεσθαι παραμένειν — 死によって祭司の務めを続けることが妨げられるので (κωλύω — «препятствовать»; παραμένω — «оставаться»)."
  24: "ὁ δὲ διὰ τὸ μένειν αὐτὸν εἰς τὸν αἰῶνα — この方は永遠にとどまるので. ἀπαράβατον ἔχει τὴν ἱερωσύνην — 移ることのない祭司職を持っておられる (ἀπαράβατος — «непереходящий»: сан не переходит к другому)."
  25: "ὅθεν — それゆえ. σῴζειν εἰς τὸ παντελὲς — 完全に救う (εἰς τὸ παντελές — «до конца, совершенно»). τοὺς προσερχομένους δι᾽ αὐτοῦ τῷ θεῷ — ご自身を通して神に近づく者たち. πάντοτε ζῶν εἰς τὸ ἐντυγχάνειν ὑπὲρ αὐτῶν — いつも生きて、彼らのために執り成しておられる (ἐντυγχάνω — «ходатайствовать»)."
  26: "Τοιοῦτος γὰρ ἡμῖν καὶ ἔπρεπεν ἀρχιερεύς — このような大祭司こそ、わたしたちにはふさわしい方であった (πρέπω — «подобать»). ὅσιος, ἄκακος, ἀμίαντος — 聖にして、悪なく、汚れなく (три определения, каждое отдельным словом). κεχωρισμένος ἀπὸ τῶν ἁμαρτωλῶν — 罪人から離され. ὑψηλότερος τῶν οὐρανῶν γενόμενος — 天よりも高くされた方."
  27: "οὐκ ἔχει καθ᾽ ἡμέραν ἀνάγκην — 日ごとに…必要がない (καθ᾽ ἡμέραν — «каждый день»). ὥσπερ οἱ ἀρχιερεῖς, πρότερον ὑπὲρ τῶν ἰδίων ἁμαρτιῶν θυσίας ἀναφέρειν, ἔπειτα τῶν τοῦ λαοῦ — あの大祭司たちのように、まず自分の罪のために、次に民の罪のためにいけにえをささげる. τοῦτο γὰρ ἐποίησεν ἐφάπαξ ἑαυτὸν ἀνενέγκας — ご自身をささげて、一度でそれを成し遂げられた (ἐφάπαξ — «однажды, раз и навсегда»)."
  28: "ὁ νόμος γὰρ ἀνθρώπους καθίστησιν ἀρχιερεῖς ἔχοντας ἀσθένειαν — 律法は弱さを持つ人たちを大祭司に任じる (καθίστημι — ср. 5:1). ὁ λόγος δὲ τῆς ὁρκωμοσίας τῆς μετὰ τὸν νόμον — 律法の後に来た誓いの言葉. υἱὸν εἰς τὸν αἰῶνα τετελειωμένον — 永遠に完成された御子 (perfect: «доведён до полноты»)."
