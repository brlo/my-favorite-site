# jp-box, Послание к Евреям, глава 7. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 7: Мелхиседек, царь Салима, священник Бога Всевышнего (1–3), десятины
# и благословение, Левий в чреслах Авраама (4–10), несовершенство левитского
# священства и перемена закона (11–19), клятва, лучший завет, вечное
# священство и ходатайство (20–28).
# Красного и синего нет: слова Христа и Богородицы не цитируются; <j>/<mo> не ставятся.
# 7:22 и далее — рассуждение автора, а не речь Христа, поэтому красного нет.
# 7:17 и 7:21 — Пс 110:4 (109:4 LXX), в 「…」, без красного: это слова Бога Отца.
# 〔…〕: 7:21 — в базе цитата обрывается на εἰς τὸν αἰῶνα, слов κατὰ τὴν τάξιν
# Μελχισέδεκ нет (проверено запросом к gr-lxx-byz), поэтому 〔メルキセデクの位に従う〕.
# Сносок ⟨…⟩ в главе нет: メルキセデク — имя, а 十分の一, 族長, 戦利品 уже есть в корпусе.
# jp-ni не использовался.

