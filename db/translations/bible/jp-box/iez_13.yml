# jp-box, Иезекииль, глава 13. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 13 (совпадает).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Глава 13: 1–16 против пророков, пророчествующих от своего сердца (лисицы в пустыне,
# стена и обмазка, град и буря); 17–23 против пророчиц (чародейные мешочки и покрывала,
# совращение душ).
# Голоса: 13:2–16 — 「…» (одна речь Господа; 『…』 — «говорит Господь» в 6–7,
# «мир, мир» в 10, «где обмазка ваша» в 12); 13:17–23 — 「…» (вторая речь).
# csl-добавления: 13:2 («пророчествующим от сердца своего»), 13:3 («ходящим вслед
# духа своего») — нет в LXX, внесены в текст без 〔…〕.

