verses:
  1: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  2: "「人[ひと]の子[こ]よ、イスラエルの預言者[よげんしゃ]たちに向[む]かって預言[よげん]せよ。自分[じぶん]の心[こころ]から預言[よげん]する者[もの]たちに、あなたは言[い]え。主[しゅ]の言葉[ことば]を聞[き]け。"
  3: "主[しゅ]なる神[かみ]はこう言[い]われる。自分[じぶん]の心[こころ]から預言[よげん]し、自分[じぶん]の霊[れい]に従[したが]って歩[あゆ]み、全[まった]く何[なに]も見[み]ていない者[もの]たちは、わざわいだ。"
  4: "イスラエルよ、あなたの預言者[よげんしゃ]たちは荒[あ]れ野[の]の狐[きつね]のようだ。"
  5: "彼[かれ]らは堅[かた]い所[ところ]に立[た]たず、イスラエルの家[いえ]のために群[む]れを集[あつ]めなかった。主[しゅ]の日[ひ]に語[かた]る者[もの]たちは立[た]ち上[あ]がらなかった。"
  6: "彼[かれ]らは偽[いつわ]りを見[み]、空[むな]しいものを占[うらな]い、『主[しゅ]は言[い]われる』と言[い]う。しかし主[しゅ]は彼[かれ]らを遣[つか]わしていない。それなのに彼[かれ]らは、その言葉[ことば]を成[な]り立[た]たせようとし始[はじ]めた。"
  7: "あなたがたは偽[いつわ]りの幻[まぼろし]を見[み]、空[むな]しい占[うらな]いを語[かた]ったではないか。しかも『主[しゅ]は言[い]われる』と言[い]うが、わたしは語[かた]っていない。"
  8: "それゆえ、主[しゅ]なる神[かみ]はこう言[い]われる。あなたがたの言葉[ことば]は偽[いつわ]りであり、あなたがたの占[うらな]いは空[むな]しい。それゆえ、見[み]よ、わたしはあなたがたに敵対[てきたい]する、と主[しゅ]なる神[かみ]は言[い]われる。"
  9: "わたしは偽[いつわ]りを見[み]る預言者[よげんしゃ]たちと、空[むな]しいことを告[つ]げる者[もの]たちに手[て]を伸[の]べる。彼[かれ]らはわたしの民[たみ]の集[つど]いには加[くわ]わらず、イスラエルの家[いえ]の記録[きろく]にも記[しる]されず、イスラエルの地[ち]にも入[はい]らない。あなたがたはわたしが主[しゅ]であることを知[し]る。"
  10: "彼[かれ]らは『平和[へいわ]、平和[へいわ]』と言[い]って、わたしの民[たみ]を惑[まど]わせた。しかし平和[へいわ]はなかった。ある者[もの]が壁[かべ]を築[きず]くと、彼[かれ]らはそれを漆喰[しっくい]で塗[ぬ]る。それは倒[たお]れるではないか。"
  11: "漆喰[しっくい]を塗[ぬ]る者[もの]たちに言[い]え。それは倒[たお]れる。わたしは大雨[おおあめ]を降[ふ]らせ、雹[ひょう]の石[いし]を彼[かれ]らの結[むす]び目[め]に送[おく]り、彼[かれ]らは倒[たお]れる。激[はげ]しい風[かぜ]が起[お]こり、壁[かべ]は裂[さ]ける。"
  12: "見[み]よ、壁[かべ]が倒[たお]れると、人[ひと]々[びと]はあなたがたに言[い]うではないか。『あなたがたが塗[ぬ]った漆喰[しっくい]はどこにあるのか』と。"
  13: "それゆえ、主[しゅ]なる神[かみ]はこう言[い]われる。わたしは怒[いか]りとともに激[はげ]しい風[かぜ]を起[お]こし、わたしの怒[いか]りのうちに大雨[おおあめ]を降[ふ]らせ、憤[いきどお]りのうちに雹[ひょう]の石[いし]を送[おく]って、全[まった]く滅[ほろ]ぼす。"
  14: "わたしはあなたがたが塗[ぬ]った壁[かべ]を打[う]ち壊[こわ]し、それを倒[たお]す。わたしはそれを地[ち]に置[お]き、その礎[いしずえ]を現[あらわ]にする。それは倒[たお]れ、あなたがたは責[せ]めとともに滅[ほろ]びる。あなたがたはわたしが主[しゅ]であることを知[し]る。"
  15: "わたしは壁[かべ]と、それを塗[ぬ]った者[もの]たちの上[うえ]に、わたしの怒[いか]りを全[まっと]うする。壁[かべ]は倒[たお]れる。わたしはあなたがたに言[い]う。壁[かべ]はなく、それを塗[ぬ]った者[もの]たちもいない。"
  16: "すなわち、エルサレムについて預言[よげん]し、平和[へいわ]がないのにエルサレムに平和[へいわ]の幻[まぼろし]を見[み]るイスラエルの預言者[よげんしゃ]たちである、と主[しゅ]なる神[かみ]は言[い]われる。」"
  17: "「人[ひと]の子[こ]よ、あなたの民[たみ]の娘[むすめ]たちのうち、自分[じぶん]の心[こころ]から預言[よげん]する者[もの]たちに顔[かお]を向[む]け、彼[かれ]らに向[む]かって預言[よげん]せよ。"
  18: "言[い]え。主[しゅ]なる神[かみ]はこう言[い]われる。すべての肘[ひじ]のために枕[まくら]を縫[ぬ]い、あらゆる年齢[ねんれい]の頭[あたま]のために覆[おお]いを作[つく]って魂[たましい]を惑[まど]わす女[おんな]たちは、わざわいだ。あなたがたはわたしの民[たみ]の魂[たましい]を惑[まど]わし、自分[じぶん]のために魂[たましい]を手[て]に入[い]れる。"
  19: "あなたがたは、ひと握[にぎ]りの大麦[おおむぎ]とひとかけらのパンのために、わたしの民[たみ]の前[まえ]でわたしを汚[けが]した。死[し]ぬべきでない魂[たましい]を殺[ころ]し、生[い]きるべきでない魂[たましい]を生[い]かし、空[むな]しい告[つ]げを聞[き]き入[い]れる民[たみ]に空[むな]しい告[つ]げを語[かた]ったからである。"
  20: "それゆえ、主[しゅ]なる神[かみ]はこう言[い]われる。見[み]よ、わたしはあなたがたの枕[まくら]に向[む]かう。あなたがたはそこで魂[たましい]を捕[と]らえている。わたしはそれをあなたがたの腕[うで]から引[ひ]き裂[さ]き、あなたがたが惑[まど]わした魂[たましい]を解[と]き放[はな]って散[ち]らす。"
  21: "わたしはあなたがたの覆[おお]いを引[ひ]き裂[さ]き、わたしの民[たみ]をあなたがたの手[て]から救[すく]い出[だ]す。彼[かれ]らはもはやあなたがたの手[て]のうちで捕[と]らえられる獲物[えもの]にはならない。あなたがたはわたしが主[しゅ]であることを知[し]る。"
  22: "あなたがたは、わたしが曲[ま]げなかった正[ただ]しい者[もの]の心[こころ]を不[ふ]正[せい]に曲[ま]げ、悪[あく]しき者[もの]の手[て]を強[つよ]めて、その悪[わる]い道[みち]から立[た]ち返[かえ]らず、生[い]きないようにしたからである。"
  23: "それゆえ、あなたがたはもはや偽[いつわ]りの幻[まぼろし]を見[み]ず、占[うらな]いをすることもない。わたしはわたしの民[たみ]をあなたがたの手[て]から救[すく]い出[だ]す。あなたがたはわたしが主[しゅ]であることを知[し]る。」"

notes:
  1: "Вводная формула."
  2: "προφήτευσον ἐπὶ τοὺς προφήτας — «пророчествуй на пророков»; слав. добавляет «прорицающим от сердца своего» — нет в LXX, внесено; Ἀκούσατε λόγον κυρίου — «слушайте слово Господне»."
  3: "Οὐαὶ τοῖς προφητεύουσιν ἀπὸ καρδίας αὐτῶν — «горе пророчествующим от сердца своего»; τὸ καθόλου μὴ βλέπουσιν — «совсем не видящим»; слав. добавляет «ходящим вслед духа своего» — нет в LXX, внесено."
  4: "ὡς ἀλώπεκες ἐν ταῖς ἐρήμοις — «как лисицы в пустынях» (ἀλώπηξ); в ru (МТ) «в развалинах» — иное чтение, не внесено."
  5: "οὐκ ἔστησαν ἐν στερεώματι — «не стали в твердыне (крепком месте)» (στερέωμα); συνήγαγον ποίμνια — «собрали стада»; οἱ λέγοντες Ἐν ἡμέρᾳ κυρίου — «говорящие: в день Господень»: тёмное место, передано «в день Господень говорящие»; в ru (МТ) «в проломы не входите...» — иное чтение."
  6: "βλέποντες ψευδῆ, μαντευόμενοι μάταια — «видящие ложное, прорицающие пустое»; Λέγει κύριος — «говорит Господь»: слова лжепророков — 『…』; ἤρξαντο τοῦ ἀναστῆσαι λόγον — «начали воздвигать (утверждать) слово»."
  7: "οὐχ ὅρασιν ψευδῆ ἑωράκατε — «не ложное ли видение видели вы?»; μαντείας ματαίας — «прорицания пустые»; повтор 『主は言われる』."
  8: "Ἀνθ᾽ ὧν — «за то, что»; ἐφ᾽ ὑμᾶς — «против вас» (ἐπί с винитивом); λέγει κύριος — внутри речи."
  9: "ἐκτενῶ τὴν χεῖρά μου — «простру руку Мою»; ἐν παιδείᾳ τοῦ λαοῦ μου οὐκ ἔσονται — «в наказании (наставлении) народа Моего не будут»: слав. «в наказании», ru «в совете»; передано «в собрании народа»; ἐν γραφῇ οἴκου Ισραηλ οὐ γραφήσονται — «в записи дома Израилева не будут записаны»."
  10: "Εἰρήνη εἰρήνη, καὶ οὐκ ἦν εἰρήνη — «мир, мир, и не было мира»: слова лжепророков — 『…』; οἰκοδομεῖ τοῖχον — «строит стену»; ἀλείφουσιν αὐτόν — «мажут (обмазывают) её»; εἰ πεσεῖται — «упадёт ли?»."
  11: "Πεσεῖται — «упадёт»; ὑετὸς κατακλύζων — «дождь потопляющий»; λίθους πετροβόλους — «камни бросаемые (град)»; εἰς τοὺς ἐνδέσμους αὐτῶν — «в связи (скрепы) их»: тёмное место; πνεῦμα ἐξαῖρον — «ветер поднимающий (бурный)»."
  12: "ἡ ἀλοιφὴ ὑμῶν, ἣν ἠλείψατε — «обмазка ваша, которою вы обмазали»: слова людей — 『…』."
  13: "ῥήξω πνοὴν ἐξαίρουσαν μετὰ θυμοῦ — «произведу дыхание (ветер) поднимающее с яростью»; ὑετὸς κατακλύζων — «дождь потопляющий»; εἰς συντέλειαν — «в конец (истребление)»."
  14: "κατασκάψω τὸν τοῖχον — «подкопаю (разрушу) стену»; θήσω ἐπὶ τὴν γῆν — «положу на землю»; ἀποκαλυφθήσεται τὰ θεμέλια — «откроются основания»; συντελεσθήσεσθε μετ᾽ ἐλέγχων — «будете истреблены с обличениями»."
  15: "συντελέσω τὸν θυμόν μου — «совершу (доведу до конца) ярость Мою»; Οὐκ ἔστιν ὁ τοῖχος — «нет стены»."
  16: "προφῆται τοῦ Ισραηλ — «пророки Израиля»: уточнение к ст. 15; εἰρήνη οὐκ ἔστιν — «мира нет»; здесь закрывается речь."
  17: "στήρισον τὸ πρόσωπόν σου — «утверди лицо твоё» (στηρίζω); τὰς θυγατέρας τοῦ λαοῦ σου — «дочерей народа твоего»; начинается вторая речь 17–23."
  18: "συρραπτούσαις προσκεφάλαια ἐπὶ πάντα ἀγκῶνα χειρός — «сшивающим подушки (чародейные мешочки) на всякий локоть руки»; ἐπιβόλαια ἐπὶ πᾶσαν κεφαλὴν πάσης ἡλικίας — «покрывала на всякую голову всякого возраста»; τοῦ διαστρέφειν ψυχάς — «чтобы совращать души»; ψυχὰς περιεποιοῦντο — «души приобретали (ловили)»."
  19: "δρακὸς κριθῶν — «горсть ячменя» (δράξ); κλασμάτων ἄρτου — «куски хлеба»; ἐβεβήλουν με — «оскверняли Меня» (βεβηλόω); ἃς οὐκ ἔδει ἀποθανεῖν — «которым не должно было умереть»; μάταια ἀποφθέγματα — «пустые изречения»."
  20: "ἐγὼ ἐπὶ τὰ προσκεφάλαια ὑμῶν — «Я против подушек ваших»; συστρέφετε ... ψυχάς — «собираете (ловите) души»; διαρρήξω ἀπὸ τῶν βραχιόνων — «разорву от мышц (плеч) ваших»; εἰς διασκορπισμόν — «в рассеяние»."
  21: "διαρρήξω τὰ ἐπιβόλαια — «разорву покрывала»; ῥύσομαι τὸν λαόν μου — «избавлю народ Мой»; εἰς συστροφήν — «в стяжение (добычу)»."
  22: "διεστρέφετε καρδίαν δικαίου ἀδίκως — «совращали сердце праведника неправедно»; ἐγὼ οὐ διέστρεφον — «Я не совращал»; κατισχῦσαι χεῖρας ἀνόμου — «укрепить руки беззаконника»; τοῦ μὴ ἀποστρέψαι ... καὶ ζῆσαι — «чтобы не обратился... и не жил»."
  23: "ψευδῆ οὐ μὴ ἴδητε — «лжи не увидите»; μαντείας οὐ μὴ μαντεύσησθε — «прорицаний не будете прорицать»; ῥύσομαι τὸν λαόν μου — «избавлю народ Мой»; здесь закрывается речь."
