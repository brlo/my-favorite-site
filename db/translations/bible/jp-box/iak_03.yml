# jp-box, Соборное послание Иакова, глава 3. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 3: ответственность учителя (1), обуздание языка: узда, руль, огонь (2–6),
# неукротимость языка и благословение с проклятием из одних уст (7–12),
# две мудрости — земная и свыше (13–18).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет.
# 〔…〕 в главе нет: все слова в базе gr-lxx-byz есть. 3:3 в базе начинается с εἰ δέ,
# без ἰδού (у jp-joc 視よ) — «見よ» не добавлено.
# Цитат Писания в главе нет. Сносок ⟨…⟩ нет. jp-ni не использовался.

tr_code: jp-box
book: iak
chapter: 3
draft: true

verses:
  1: "わたしの兄弟[きょうだい]たちよ、多[おお]くの者[もの]が教師[きょうし]となってはならない。わたしたちが、さらに厳[きび]しい裁[さば]きを受[う]けることを知[し]っているからである。"
  2: "というのは、わたしたちはみな、多[おお]くの点[てん]でつまずくからである。言葉[ことば]につまずかない者[もの]がいれば、その人[ひと]は完全[かんぜん]な人[ひと]であり、体[からだ]全体[ぜんたい]にもくつわをはめることのできる人[ひと]である。"
  3: "馬[うま]の口[くち]にくつわをはめて、わたしたちに従[したが]わせるなら、その体[からだ]全体[ぜんたい]をも操[あやつ]ることができる。"
  4: "見[み]なさい。船[ふね]はあれほど大[おお]きく、激[はげ]しい風[かぜ]に押[お]されていても、ごく小[ちい]さな舵[かじ]によって、操舵[そうだ]する者[もの]が望[のぞ]むところへ向[む]けられる。"
  5: "同[おな]じように、舌[した]も小[ちい]さな器官[きかん]でありながら、大[おお]きなことを誇[ほこ]る。見[み]なさい。どんなに小[ちい]さな火[ひ]が、どんなに大[おお]きな森[もり]を焼[や]き払[はら]うことか。"
  6: "舌[した]も火[ひ]である。不義[ふぎ]の世界[せかい]である。舌[した]はわたしたちの器官[きかん]のうちに置[お]かれ、体[からだ]全体[ぜんたい]を汚[けが]し、誕生[たんじょう]の車輪[しゃりん]を焼[や]き、自[みずか]らも地獄[じごく]の火[ひ]で焼[や]かれる。"
  7: "というのは、獣[けもの]も鳥[とり]も、這[は]うものも海[うみ]のものも、あらゆる種類[しゅるい]が、人間[にんげん]の本性[ほんせい]によってならされ、すでにならされてきたからである。"
  8: "しかし、舌[した]は、人間[にんげん]のだれもならすことができない。それは落[お]ち着[つ]かない悪[あく]であり、死[し]をもたらす毒[どく]に満[み]ちている。"
  9: "この舌[した]でわたしたちは、主[しゅ]である父[ちち]をほめたたえ、またこの舌[した]で、神[かみ]にかたどって造[つく]られた人[ひと]々[びと]を呪[のろ]う。"
  10: "同[おな]じ口[くち]から、祝福[しゅくふく]と呪[のろ]いとが出[で]てくる。わたしの兄弟[きょうだい]たちよ、そういうことがあってはならない。"
  11: "泉[いずみ]が、同[おな]じ穴[あな]から甘[あま]い水[みず]と苦[にが]い水[みず]とを噴[ふ]き出[だ]すことがあろうか。"
  12: "わたしの兄弟[きょうだい]たちよ、いちじくの木[き]がオリーブを実[みの]らせ、ぶどうの木[き]がいちじくを実[みの]らせることができるだろうか。塩[しお]けの水[みず]が甘[あま]い水[みず]を出[だ]すこともできない。"
  13: "あなたがたのうちに、知恵[ちえ]があり、見識[けんしき]のある者[もの]はだれか。その人[ひと]は、知恵[ちえ]に基[もと]づく柔和[にゅうわ]さをもって、良[よ]い生[い]き方[かた]からその行[おこな]いを示[しめ]すがよい。"
  14: "しかし、もしあなたがたの心[こころ]のうちに、苦[にが]い妬[ねた]みと利己的[りこてき]な野心[やしん]があるなら、誇[ほこ]ってはならない。真理[しんり]に逆[さか]らってうそをついてはならない。"
  15: "その知恵[ちえ]は、上[うえ]から下[くだ]ってくるものではなく、地[ち]に属[ぞく]し、魂[たましい]に属[ぞく]し、悪魔[あくま]に属[ぞく]するものである。"
  16: "というのは、妬[ねた]みと利己的[りこてき]な野心[やしん]のあるところには、混[こん]乱[らん]と、あらゆる悪[あく]い事[こと]とがあるからである。"
  17: "しかし、上[うえ]からの知恵[ちえ]は、まず清[きよ]く、次[つぎ]に平和[へいわ]を好[この]み、寛容[かんよう]で、素直[すなお]に従[したが]い、あわれみと良[よ]い実[みのり]とに満[み]ち、偏[かたよ]らず、偽[いつわ]りのないものである。"
  18: "義[ぎ]の実[みのり]は、平和[へいわ]を造[つく]る者[もの]たちに、平和[へいわ]のうちにまかれるのである。"

notes:
  1: "Μὴ πολλοὶ διδάσκαλοι γίνεσθε — 多くの者が教師となってはならない (μὴ с императивом — запрет). μεῖζον κρίμα λημψόμεθα — さらに厳しい裁きを受ける (κρίμα — суд, приговор; μεῖζον — бо́льший)."
  2: "πολλὰ γὰρ πταίομεν ἅπαντες — わたしたちはみな、多くの点でつまずく (πταίω — спотыкаться, ошибаться, ср. 2:10). εἴ τις ἐν λόγῳ οὐ πταίει — 言葉につまずかない者. τέλειος ἀνήρ — 完全な人 (ср. 1:4). δυνατὸς χαλιναγωγῆσαι καὶ ὅλον τὸ σῶμα — 体全体にもくつわをはめることのできる (χαλιναγωγέω, ср. 1:26)."
  3: "τοὺς χαλινοὺς εἰς τὰ στόματα βάλλομεν — 口にくつわをはめて (χαλινός — узда, удила). εἰς τὸ πείθεσθαι αὐτοὺς ἡμῖν — わたしたちに従わせるために. μετάγομεν — 操る (μετάγω — направлять, поворачивать). В базе εἰ δέ, без ἰδού; «見よ» не добавлено."
  4: "ἰδοὺ καὶ τὰ πλοῖα — 見なさい、船も. τηλικαῦτα ὄντα — あれほど大きく. ὑπὸ ἀνέμων σκληρῶν ἐλαυνόμενα — 激しい風に押されていても (ἐλαύνω — гнать, толкать). ὑπὸ ἐλαχίστου πηδαλίου — ごく小さな舵によって (πηδάλιον — руль). ὅπου ἡ ὁρμὴ τοῦ εὐθύνοντος βούλεται — 操舵する者が望むところへ (ὁρμή — стремление, порыв; εὐθύνω — управлять)."
  5: "μικρὸν μέλος — 小さな器官 (μέλος — член тела, ср. 4:1). μεγάλα αὐχεῖ — 大きなことを誇る (αὐχέω — хвалиться). ἡλίκον πῦρ ἡλίκην ὕλην ἀνάπτει — どんなに小さな火が、どんなに大きな森を焼き払うことか: ἡλίκον может значить и «сколь велик»; смысл — несоразмерность малого огня и огромного вещества (ὕλη — лес, топливо)."
  6: "ὁ κόσμος τῆς ἀδικίας — 不義の世界 (букв. «мир неправды»; crux, оставлено как есть). ἡ σπιλοῦσα ὅλον τὸ σῶμα — 体全体を汚し (σπιλόω — пятнать, ср. 1:27 ἄσπιλος). τὸν τροχὸν τῆς γενέσεως — 誕生の車輪 (τροχός — колесо; γένεσις — рождение, бытие; crux: образ круга рождения, у jp-joc 一生の範圍; буквальный образ сохранён). φλογιζομένη ὑπὸ τῆς γεέννης — 地獄の火で焼かれる (γέεννα — 地獄, как везде в корпусе)."
  7: "πᾶσα γὰρ φύσις θηρίων τε καὶ πετεινῶν ἑρπετῶν τε καὶ ἐναλίων — 獣も鳥も、這うものも海のものも、あらゆる種類 (четыре ряда сохранены). δαμάζεται καὶ δεδάμασται — ならされ、すでにならされてきた (настоящее и перфект: общее правило и совершившийся факт). τῇ φύσει τῇ ἀνθρωπίνῃ — 人間の本性によって."
  8: "τὴν δὲ γλῶσσαν οὐδεὶς δαμάσαι δύναται ἀνθρώπων — 舌は、人間のだれもならすことができない. ἀκατάστατον κακόν — 落ち着かない悪 (ἀκατάστατος — неугомонный, необузданный, ср. 1:8). μεστὴ ἰοῦ θανατηφόρου — 死をもたらす毒に満ちている (ἰός — яд; ср. 5:3, где ἰός — ржавчина)."
  9: "ἐν αὐτῇ εὐλογοῦμεν τὸν κύριον καὶ πατέρα — この舌で主である父をほめたたえ (εὐλογέω — благословлять, славословить). καταρώμεθα — 呪う (καταράομαι). τοὺς καθ' ὁμοίωσιν θεοῦ γεγονότας — 神にかたどって造られた人々 (ὁμοίωσις — подобие, Быт 1:26)."
  10: "ἐκ τοῦ αὐτοῦ στόματος ἐξέρχεται εὐλογία καὶ κατάρα — 同じ口から、祝福と呪いとが出てくる. οὐ χρή… ταῦτα οὕτως γίνεσθαι — そういうことがあってはならない (χρή — должно, подобает)."
  11: "μήτι ἡ πηγὴ ἐκ τῆς αὐτῆς ὀπῆς βρύει τὸ γλυκὺ καὶ τὸ πικρόν — 泉が同じ穴から甘い水と苦い水を噴き出すことがあろうか (βρύω — бить ключом, изливать; ὀπή — отверстие). 水 добавлено по смыслу: в греч. субстантивированные прилагательные, по-японски нужен предмет; 〔〕 не ставятся."
  12: "μὴ δύναται… συκῆ ἐλαίας ποιῆσαι ἢ ἄμπελος σῦκα — いちじくの木がオリーブを実らせ、ぶどうの木がいちじくを実らせることができるだろうか (συκῆ — смоковница; ἐλαία — маслина; ἄμπελος — виноградная лоза; σῦκον — смоква). ἁλυκὸν γλυκὺ ποιῆσαι ὕδωρ — 塩けの水が甘い水を出すこと (ἁλυκός — солёный, горько-солёный)."
  13: "Τίς σοφὸς καὶ ἐπιστήμων ἐν ὑμῖν — 知恵があり、見識のある者はだれか (ἐπιστήμων — сведущий, понимающий). ἐκ τῆς καλῆς ἀναστροφῆς — 良い生き方から (ἀναστροφή — поведение, образ жизни). ἐν πραΰτητι σοφίας — 知恵に基づく柔和さをもって (род. источника)."
  14: "ζῆλον πικρόν — 苦い妬み (ζῆλος — ревность, здесь зависть; πικρός — горький). ἐριθείαν — 利己的な野心 (ἐριθεία — своекорыстие, ср. Флп 2:3, где то же слово). μὴ κατακαυχᾶσθε καὶ ψεῦδεσθε κατὰ τῆς ἀληθείας — 誇ってはならない、真理に逆らってうそをついてはならない."
  15: "οὐκ ἔστιν αὕτη ἡ σοφία ἄνωθεν κατερχομένη — その知恵は、上から下ってくるものではなく. ἐπίγειος, ψυχική, δαιμονιώδης — 地に属し、魂に属し、悪魔に属する: три члена сохранены; ψυχικός — душевный, природный в противоположность духовному (ср. 1 Кор 2:14; 15:44), поэтому не сглажено в «人間的»."
  16: "ὅπου γὰρ ζῆλος καὶ ἐριθεία — 妬みと利己的な野心のあるところに. ἀκαταστασία — 混乱 (ср. 3:8 ἀκατάστατον). πᾶν φαῦλον πρᾶγμα — あらゆる悪い事 (φαῦλος — дурной, низкий)."
  17: "ἁγνή, εἰρηνική, ἐπιεικής, εὐπειθής, μεστὴ ἐλέους καὶ καρπῶν ἀγαθῶν, ἀδιάκριτος, ἀνυπόκριτος — 清く、平和を好み、寛容で、素直に従い、あわれみと良い実とに満ち、偏らず、偽りのない: семь определений сохранены (ἐπιεικής — уступчивый, мягкий; εὐπειθής — послушный; ἀδιάκριτος — нелицеприятный, неколебимый; ἀνυπόκριτος — нелицемерный)."
  18: "καρπὸς δὲ δικαιοσύνης — 義の実. ἐν εἰρήνῃ σπείρεται — 平和のうちにまかれる (σπείρω — сеять). τοῖς ποιοῦσιν εἰρήνην — 平和を造る者たちに (дат. пользы)."
