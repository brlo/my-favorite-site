book: iov
chapter: 5
draft: true

verses:
  1: "「さあ、呼[よ]んでみよ。だれかあなたに答[こた]える者[もの]があるだろうか。聖[せい]なる天使[てんし]のうち、あなたはだれに目[め]を向[む]けるのか。"
  2: "怒[いか]りは愚[おろ]かな者[もの]を殺[ころ]し、ねたみは迷[まよ]える者[もの]を死[し]に至[いた]らせるからである。"
  3: "わたしは愚かな者[もの]が根[ね]を張[は]るのを見[み]たが、その住[す]まいはただちに食[く]い尽[つ]くされた。"
  4: "その息子[むすこ]たちは救[すく]いから遠[とお]く、弱[よわ]い者[もの]たちの門[もん]の前[まえ]で打[う]ち砕[くだ]かれ、救[すく]い出[だ]す者[もの]がいないように。"
  5: "彼[かれ]らが集[あつ]めたものは正[ただ]しい者[もの]たちが食[た]べ、彼ら自身[じしん]は災[わざわ]いから免[まぬが]れず、その力[ちから]は吸[す]い尽[つ]くされる。"
  6: "苦[くる]しみが地[ち]から出[で]ることはなく、痛[いた]みが山々[やまやま]から芽生[めば]えることもない。"
  7: "人[ひと]は労苦[ろうく]のために生[う]まれ、禿鷲[はげわし]のひなは高[たか]みへと飛[と]ぶ。"
  8: "しかし、このわたしは主[しゅ]に願[ねが]い、すべてのものの支配者[しはいしゃ]である主を呼[よ]び求[もと]めよう。"
  9: "主は大[おお]いなること、探[さぐ]り知[し]れないこと、栄光[えいこう]あること、驚[おどろ]くべきことを、数[かぞ]えきれないほど行[おこな]われる。"
  10: "地[ち]に雨[あめ]を降[ふ]らせ、天[てん]の下[した]に水[みず]を送[おく]られる。"
  11: "低[ひく]くされた者[もの]を高[たか]みに上[あ]げ、滅[ほろ]びた者[もの]たちを救[すく]いへと立[た]ち上[あ]がらせる。"
  12: "悪賢[わるがしこ]い者[もの]たちの企[くわだ]てを覆[くつがえ]し、その手[て]が真実[しんじつ]を行[おこな]えないようにされる。"
  13: "知恵[ちえ]ある者[もの]をその賢[かしこ]さのうちで捕[と]らえ、曲[ま]がりくねった者[もの]たちの企てを崩[くず]される。"
  14: "昼[ひる]には闇[やみ]が彼[かれ]らに襲[おそ]いかかり、真昼[まひる]には夜[よる]のように手[て]探[さぐ]りする。"
  15: "彼らは戦[いくさ]のうちに滅[ほろ]び、弱[よわ]い者[もの]は強[つよ]い者[もの]の手[て]から逃[のが]れ出[で]るように。"
  16: "弱い者[もの]に希望[きぼう]があり、不[ふ]正[せい]な者[もの]の口[くち]がふさがれるように。"
  17: "見[み]よ、主[しゅ]に戒[いまし]められる人[ひと]は幸[さいわ]いである。全能者[ぜんのうしゃ]の諭[さと]しを拒[こば]んではならない。"
  18: "主は苦[くる]しみを与[あた]え、また元[もと]どおりに戻[もど]される。主が打[う]ち、その手[て]が癒[いや]やすのである。"
  19: "主は六度[ろくど]あなたを苦難[くなん]から救[すく]い出[だ]し、七度目[しちどめ]には災[わざわ]いがあなたに触[ふ]れることもない。"
  20: "飢[う]えのときには死[し]から、戦[いくさ]のときには鉄[てつ]の手[て]から、あなたを解[とき]き放[はな]つ。"
  21: "舌[した]の鞭[むち]からあなたを隠[かく]し、迫[せま]り来[く]る災[わざわ]いを恐[おそ]れさせない。"
  22: "不[ふ]正[せい]な者[もの]と不[ふ]法[ほう]な者[もの]を笑[わら]い、野[の]の獣[けもの]を恐[おそ]れることもない。"
  23: "野[の]の石[いし]とあなたは契約[けいやく]を結[むす]び、野の獣[けもの]はあなたと和[やわ]らぐからである。"
  24: "そのとき、あなたは知[し]るであろう、あなたの家[いえ]が平和[へいわ]であることを。あなたの天幕[てんまく]の住[す]まいに過[あやま]ちはない。"
  25: "また、あなたの子孫[しそん]が多[おお]いこと、あなたの子[こ]どもが野[の]の草[くさ]のようになることを知るであろう。"
  26: "あなたは、時[とき]が来[き]て刈[か]り取[と]られる熟[じゅく]した麦[むぎ]のように、また、その時[とき]に集[あつ]められる打[う]ち場[ば]の麦[むぎ]の山[やま]のように、墓[はか]へと入[はい]るであろう。"
  27: "見[み]よ、わたしたちはこれをこのとおりに探[さぐ]り出[だ]し、これを聞[き]いた。あなたは、自分[じぶん]が何[なに]かを行[おこな]ったかどうかを、よく知[し]るがよい。」"

notes:
  1: "Елифаз. ἐπικάλεσαι δέ — «призови же» (импер. аор. от ἐπικαλέομαι). εἴ τίς σοι ὑπακούσεται — «если кто тебя услышит», т. е. ответит. ἄγγελοι ἅγιοι — «святые ангелы»: в LXX так передано евр. «святые»; слав. «святых ангел». Речь Елифаза началась в 4:2, здесь продолжение без вводной формулы, поэтому в начале стиха открывается 「 (цитата закрывается в 5:27)."
  2: "Елифаз. ἄφρων — «глупец, безумный»; ἀναιρεῖ — «уничтожает, убивает» (ἀναιρέω). ζῆλος — «ревность, рвение» (слав. «рвение»). Параллелизм «гнев/ревность» сохранён."
  3: "Елифаз. ἑώρακα — перфект «я видел». ῥίζαν βάλλοντας — «пускающих корень», т. е. укореняющихся. ἐβρώθη ἡ δίαιτα — «съедено было жилище» (βιβρώσκω — «пожирать»; δίαιτα — «образ жизни, жилище»); слав. «жилище». ru по МТ: «проклял дом его» — иное чтение, не внесено."
  4: "Елифаз. πόρρω γένοιντο — оптатив «да будут далеко» (пожелание). κολαβρισθεῖησαν — оптатив от κολαβρίζω, «да будут биты, поруганы» (гапакс). ἐπὶ θύραις ἡσσόνων — «у ворот меньших», т. е. людей низкого состояния. ὁ ἐξαιρούμενος — «избавляющий»."
  5: "Елифаз. ἃ συνήγαγον — «что они собрали». δίκαιοι ἔδονται — «праведники съедят». ἐκ κακῶν οὐκ ἐξαίρετοι — «не будут изъяты из зол» (ἐξαίρετος — «изъятый»). ἐκσιφωνισθείη — оптатив от σιφωνίζω, «да будет вытянута, высосана» (образ сифона); слав. «изможденна буди крепость их»."
  6: "Елифаз. οὐ μὴ ἐξέλθῃ ἐκ τῆς γῆς κόπος — «не выйдет из земли труд» (двойное отрицание). ἀναβλαστήσει — «прорастёт» (ἀναβλαστάνω). Пара κόπος/πόνος передана как 苦しみ/痛み; слав. «труд/болезнь»."
  7: "Елифаз. ἄνθρωπος γεννᾶται κόπῳ — «человек рождается для труда» (датив цели). νεοσσοὶ γυπός — «птенцы грифа» (γύψ); τὰ ὑψηλὰ πέτονται — «летят в высоту». ru по МТ: «как искры» — иное чтение."
  8: "Елифаз. οὐ μὴν δὲ ἀλλά — «но однако же». δεηθήσομαι — «буду умолять» (δέομαι). κύριον τὸν πάντων δεσπότην — «Господа, Владыку всех»: оба члена сохранены."
  9: "Елифаз. ἀνεξιχνίαστος — «неисследимый» (ἐξιχνιάζω — «выслеживать»); ἐξαίσια — «необычайные, дивные»; ὧν οὐκ ἔστιν ἀριθμός — «которым нет числа». Тот же оборот дословно повторён в 9:10."
  10: "Елифаз. ὑετός — «дождь»; ἐπὶ τὴν ὑπ᾿ οὐρανόν — «на поднебесную», т. е. на землю. Причастия продолжают относительную цепь от 5:8 («призываю… делающего»); в японском цепь разорвана на отдельные предложения."
  11: "Елифаз. ταπεινοὺς εἰς ὕψος — «смиренных на высоту»; ἀπολωλότας ἐξεγείροντα — «восставляющего погибших». Слав. добавляет «во спасение», чего в LXX нет; по паритету слово вошло в основной текст (救いへと) без 〔…〕."
  12: "Елифаз. διαλλάσσοντα — «изменяющего, расстраивающего» (διαλλάσσω). πανοῦργοι — «лукавые, коварные». οὐ μὴ ποιήσουσιν αἱ χεῖρες αὐτῶν ἀληθές — «руки их не сделают истины», т. е. не доведут дела до правды."
  13: "Елифаз. καταλαμβάνων — «уловляющий» (καταλαμβάνω); ἐν τῇ φρονήσει — «в их разумности». πολύπλοκοι — «многосплетённые, коварные» (букв. «многоплетёные»); ἐξέστησεν — «сбил, обратил вспять»."
  14: "Елифаз. συναντήσεται αὐτοῖς σκότος — «встретится им тьма». μεσημβρινόν — «полуденное время»; ἴσα νυκτί — «как ночью». ψηλαφήσαισαν — оптатив от ψηλαφάω, «ощупывали бы». Переход к оптативу в 5:15–16 сохранён."
  15: "Елифаз. ἀπόλοιντο — оптатив «да погибнут»; ἐξέλθοι — оптатив «да выйдет». ἀδύνατος — «немощный, бессильный»; δυνάστου — «сильного, властителя». ru по МТ даёт иное («спасает бедного от меча»); в тексте LXX и слав."
  16: "Елифаз. εἴη — оптатив «да будет». ἐμφραχθείη — оптатив от ἐμφράσσω, «да будет заграждён» (о рте). ἀδίκου — «неправедного»; не смешивать с ἀσεβής «нечестивый»."
  17: "Елифаз. μακάριος — «блажен» (формула, ср. Пс 1:1). ἤλεγξεν — «обличил, вразумил» (ἐλέγχω). νουθέτημα — «наставление, вразумление»; μὴ ἀπαναίνου — «не отказывайся, не отвергай» (ἀπαναίνομαι). LXX читает κύριος, слав. «Бог»; в тексте 主."
  18: "Елифаз. ἀλγεῖν ποιεῖ — «причиняет боль» (ἄλγος). ἀποκαθίστησιν — «восстанавливает» (ἀποκαθίστημι). ἔπαισεν — «ударил» (παίω); ἰάσαντο — «исцелили» (ἰάομαι). Смена времён (настоящее — аорист) сохранена."
  19: "Елифаз. ἑξάκις — «шесть раз»; ἐν τῷ ἑβδόμῳ — «в седьмой [раз]». ἅψηται — «коснётся» (ἅπτω). Числа переданы кандзи."
  20: "Елифаз. λιμός — «голод»; ῥύσεταί σε ἐκ θανάτου — «избавит тебя от смерти». ἐκ χειρὸς σιδήρου — «из руки железа», т. е. меча; λύσει — «разрешит, освободит»."
  21: "Елифаз. μάστιξ γλώσσης — «бич языка», т. е. злоречие. κρύψει — «скроет». ἀπὸ κακῶν ἐρχομένων — «от приходящих зол»."
  22: "Елифаз. καταγελάσῃ — «посмеёшься» (καταγελάω). ἀδίκων καὶ ἀνόμων — «неправедных и беззаконных»; ru по МТ: «опустошению и голоду» — иное чтение, в тексте LXX и слав."
  23: "Елифаз. θῆρες ἄγριοι εἰρηνεύσουσίν σοι — «дикие звери будут в мире с тобою». Слав. перед этим добавляет «с камением дивиим завет твой» («с дикими камнями завет твой»), чего в LXX нет; по паритету добавление вошло в основной текст без 〔…〕."
  24: "Елифаз. εἶτα γνώσῃ — «потом узнаешь». δίαιτα τῆς σκηνῆς σου οὐ μὴ ἁμάρτῃ — «жилище шатра твоего не согрешит», т. е. не потерпит ущерба; тёмный оборот, передан 過ちはない."
  25: "Елифаз. πολὺ τὸ σπέρμα σου — «много семени твоего». παμβότανον τοῦ ἀγροῦ — «всякая трава поля» (παμβότανον — гапакс, «все-трава»); слав. «весь злак селный»."
  26: "Елифаз. ἐλεύσῃ ἐν τάφῳ — «войдёшь в могилу». σῖτος ὥριμος — «пшеница зрелая»; θεριζόμενος — «пожинаемая». θιμωνιά ἅλωνος — «скирда гумна» (θιμωνιά — «куча, скирда»); συγκομισθεῖσα — «собранная»."
  27: "Елифаз. ἐξιχνιάσαμεν — «мы выследили, разыскали» (ἐξιχνιάζω); ταῦτά ἐστιν ἃ ἀκηκόαμεν — «это то, что мы слышали». γνῶθι σεαυτῷ εἴ τι ἔπραξας — «узнай сам, не сделал ли ты чего», т. е. проверь себя. Здесь закрывается цитата Елифаза, начатая в 4:2."
