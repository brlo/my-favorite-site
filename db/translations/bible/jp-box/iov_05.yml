# jp-box, Иов, глава 5. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге только главы 1–2; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 5: продолжение речи Елифаза (начата в 4:2): вызов — кто ответит (1), гибель
# нечестивого и его потомства (2–7), призыв искать Бога и Его дела (8–16),
# блаженство вразумлённого и обетование мира, потомства и мирной кончины (17–27).
# Голос: только Елифаз. Вводной формулы в главе нет — речь продолжается, поэтому
# в 5:1 открывается 「 (продолжение без формулы) и закрывается в конце 5:27.
# Нумерация по gr: 27 стихов; деление совпадает с csl и ru.
# 〔…〕 нет: все стихи есть в gr-lxx-byz. Слав. добавление в 5:23 («с камением
# дивиим завет твой») внесено в основной текст без скобок, в notes отмечено «нет в LXX».
# Сносок ⟨…⟩ нет: 全能者, 知恵, 正しい者 уже в корпусе.
# Имена: エリファズ (4:1), テマン人 (4:1).

