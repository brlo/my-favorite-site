verses:
  1: "その後[あと]、モアブ人[じん]とアンモン人[じん]、そして彼[かれ]らとともにアンモン人のうちから来[き]た者[もの]たちが、ヨシャファトに戦[たたか]いを仕[しか]けた。"
  2: "人[ひと]々[びと]が来[き]てヨシャファトに告[つ]げて言[い]った。「海[うみ]の向[む]こう、シリアから大[おお]きな群[む]れがあなたに向[む]かって来[き]ている。見[み]よ、彼[かれ]らはアササンタマル、すなわちエン・ゲディにいる。」"
  3: "ヨシャファトは恐[おそ]れ、顔[かお]を主[しゅ]に向[む]けて求[もと]め、ユダ全土[ぜんど]に断食[だんじつ]を布告[ふこく]した。"
  4: "ユダの人[ひと]々[びと]は集[あつ]まって主[しゅ]を求[もと]めた。ユダのすべての町[まち]から、主[しゅ]を求[もと]めに来[き]た。"
  5: "ヨシャファトは、エルサレムの主[しゅ]の家[いえ]で、新[あたら]しい庭[にわ]の前[まえ]に、ユダの集会[しゅうかい]のただ中[なか]に立[た]った。"
  6: "彼[かれ]は言[い]った。「われらの父[ちち]たちの神[かみ]である主[しゅ]よ。あなたこそ天[てん]の上[うえ]におられる神[かみ]であり、すべての国々[くにぐに]の王国[おうこく]を統治[とうち]しておられる。あなたの手[て]には力[ちから]と権威[けんい]があり、あなたに立[た]ち向[む]かえる者[もの]はない。"
  7: "あなたこそ、あなたの民[たみ]イスラエルの前[まえ]からこの地[ち]の住民[じゅうみん]を根絶[こんぜつ]し、この地[ち]を、あなたが愛[あい]されたアブラハムの子孫[しそん]に永遠[えいえん]に与[あた]えられた、われらの神[かみ]ではないか。"
  8: "彼[かれ]らはこの地[ち]に住[す]み、あなたの名[な]のために聖所[せいしょ]を建[た]てて言[い]った。"
  9: "『もしわれわれに災[わざわ]い、すなわち剣[けん]、裁[さば]き、滅[ほろ]び、飢饉[ききん]が臨[のぞ]むなら、われわれはこの家[いえ]の前[まえ]、あなたの前[まえ]に立[た]ち、この家[いえ]にあなたの名[な]が置[お]かれているゆえに、苦[くる]しみの中[なか]からあなたに叫[さけ]ぶ。あなたは聞[き]いて、救[すく]ってくださる。』"
  10: "そして今[いま]、見[み]よ、アンモン人[じん]、モアブ人[じん]、セイル山[やま]の者[もの]たちがいる。あなたは、エジプトの地[ち]を出[で]たイスラエルに、彼[かれ]らを通[とお]って行[い]くことをお許[ゆる]しにならなかった。民[たみ]は彼[かれ]らから離[はな]れて、彼[かれ]らを根絶[こんぜつ]しなかったからである。"
  11: "見[み]よ、今[いま]、彼[かれ]らはわれわれに手[て]をかけて来[き]て、あなたがわれわれに与[あた]えられた嗣業[しぎょう]からわれわれを追[お]い出[だ]そうとしている。"
  12: "われらの神[かみ]である主[しゅ]よ、あなたは彼[かれ]らを裁[さば]かれないのか。われわれには、この大[おお]きな群[む]れがわれわれに臨[のぞ]んだとき、これに立[た]ち向[む]かう力[ちから]がない。彼[かれ]らに何[なに]をすべきかも、われわれには分[わ]からない。ただ、われわれの目[め]はあなたに注[そそ]がれている。」"
  13: "ユダの人[ひと]々[びと]はみな、幼[おさな]い子[こ]どもたちや妻[つま]たちとともに、主[しゅ]の前[まえ]に立[た]っていた。"
  14: "そのとき、アサフの子[こ]らのうちのレビ人[びと]で、マンタニウの子[こ]、エレエルの子[こ]、バナヤの子[こ]、ゼカリヤの子[こ]であるオジエルに、集会[しゅうかい]の中[なか]で主[しゅ]の霊[れい]が臨[のぞ]んだ。"
  15: "彼[かれ]は言[い]った。「ユダの人[ひと]々[びと]、エルサレムの住民[じゅうみん]、またヨシャファト王[おう]よ、聞[き]け。主[しゅ]はあなたがたにこう言[い]われる。『この大[おお]きな群[む]れのゆえに恐[おそ]れてはならない。おののいてはならない。この戦[たたか]いはあなたがたのものではなく、神[かみ]のものだからである。"
  16: "明日[あした]、彼[かれ]らに向[む]かって下[くだ]れ。見[み]よ、彼[かれ]らはアサの坂[さか]を上[のぼ]って来[き]ている。あなたがたは彼[かれ]らを、荒野[こうや]のイエリエルの川[かわ]のほとりの高[たか]みで見[み]いだすだろう。"
  17: "この戦[たたか]いはあなたがたが戦[たたか]うのではない。これらのことを悟[さと]り、あなたがたとともにいる主[しゅ]の救[すく]いを見[み]よ。ユダとエルサレムよ、明日[あした]、彼[かれ]らに会[あ]いに出[で]ることを恐[おそ]れてはならない。おののいてはならない。主[しゅ]はあなたがたとともにいる。』」"
  18: "ヨシャファトは顔[かお]を地[ち]に伏[ふ]せ、ユダの人[ひと]々[びと]とエルサレムの住民[じゅうみん]はみな、主[しゅ]の前[まえ]に伏[ふ]して主[しゅ]を拝[おが]んだ。"
  19: "レビ人[びと]のうち、カアテの子[こ]らとコラの子[こ]らが立[た]ち上[あ]がり、大[おお]きな声[こえ]を高[たか]く上[あ]げて、イスラエルの神[かみ]である主[しゅ]をほめたたえた。"
  20: "彼[かれ]らは朝早[あさはや]く起[お]きて、テコアの荒野[こうや]へ出[で]て行[い]った。彼[かれ]らが出[で]て行[い]くとき、ヨシャファトは立[た]って叫[さけ]び、言[い]った。「ユダの人[ひと]々[びと]、エルサレムの住民[じゅうみん]よ、わたしの声[こえ]を聞[き]け。あなたがたの神[かみ]である主[しゅ]を信[しん]じなさい。そうすれば、堅[かた]く立[た]つことができる。主[しゅ]の預言者[よげんしゃ]を信[しん]じなさい。そうすれば、成功[せいこう]する。」"
  21: "彼[かれ]は民[たみ]と相談[そうだん]し、主[しゅ]に歌[うた]う者[もの]たちを立[た]てて、武[ぶ]装[そう]した者[もの]たちの前[まえ]に進[すす]ませ、聖[せい]なるものを告白[こくはく]してほめたたえさせた。彼[かれ]らは言[い]った。「主[しゅ]に感謝[かんしゃ]せよ。その憐[あわ]れみは永遠[えいえん]に至[いた]るからである。」"
  22: "彼[かれ]らが賛美[さんび]と告白[こくはく]を始[はじ]めると、主[しゅ]は、アンモン人[じん]がモアブ人[じん]と、ユダに向[む]かって来[き]たセイル山[やま]の者[もの]たちを攻[せ]めるようにされた。こうして彼[かれ]らは打[う]ち負[ま]かされた。"
  23: "アンモン人[じん]とモアブ人[じん]は、セイル山[やま]の住民[じゅうみん]を根絶[こんぜつ]し、滅[ほろ]ぼし尽[つ]くそうとして立[た]ち上[あ]がった。セイルの住民[じゅうみん]を滅[ほろ]ぼし終[お]えると、彼[かれ]らは互[たが]いに滅[ほろ]ぼし合[あ]うために立[た]ち上[あ]がった。"
  24: "ユダの人[ひと]々[びと]が荒野[こうや]を見渡[みわた]す高[たか]みに来[き]て目[め]をやると、大[おお]きな群[む]れがいた。見[み]よ、彼[かれ]らはみな、地[ち]に倒[たお]れた死[し]体[たい]となっており、救[すく]われる者[もの]は一人[ひとり]もいなかった。"
  25: "ヨシャファトとその民[たみ]は、彼[かれ]らの戦利品[せんりひん]を奪[うば]い取[と]るために来[き]て、多[おお]くの家畜[かちく]、荷物[にもつ]、戦利品[せんりひん]、望[のぞ]ましい品々[しなじな]を見[み]つけ、それを自分[じぶん]たちのために奪[うば]い取[と]った。彼[かれ]らが戦利品[せんりひん]を奪[うば]い取[と]るのに三日[みっか]かかった。それほど多[おお]かったからである。"
  26: "第四日[だいよっか]に、彼[かれ]らは祝福[しゅくふく]の谷[たに]に集[あつ]まった。そこでは彼[かれ]らが主[しゅ]をほめたたえたからである。それゆえ、その場所[ばしょ]の名[な]は今日[きょう]に至[いた]るまで「祝福[しゅくふく]の谷[たに]」と呼[よ]ばれている。"
  27: "ユダの人[ひと]はみな、ヨシャファトを先頭[せんとう]にして大[おお]きな喜[よろこ]びとともにエルサレムへ帰[かえ]った。主[しゅ]が彼[かれ]らを敵[てき]から喜[よろこ]ばせてくださったからである。"
  28: "彼[かれ]らは琴[こと]、竪琴[たてごと]、ラッパを奏[かな]でながら、エルサレムの主[しゅ]の家[いえ]へ入[はい]った。"
  29: "主[しゅ]への恐[おそ]れが地[ち]のすべての王国[おうこく]の上[うえ]に臨[のぞ]んだ。主[しゅ]がイスラエルの敵[てき]と戦[たたか]われたと聞[き]いたからである。"
  30: "ヨシャファトの王国[おうこく]は平和[へいわ]になった。主[しゅ]が周[まわ]りのすべてに休[やす]みを与[あた]えられたからである。"
  31: "ヨシャファトはユダの王[おう]となった。彼[かれ]が王[おう]となったとき三十五歳[さんじゅうごさい]で、エルサレムで二十五年[にじゅうごねん]治[おさ]めた。母[はは]の名[な]はアズバ、セレイの娘[むすめ]であった。"
  32: "彼[かれ]は父[ちち]アサの道[みち]を歩[あゆ]み、主[しゅ]の前[まえ]に正[ただ]しいことを行[おこな]うことから離[はな]れなかった。"
  33: "ただ、高[たか]い所[ところ]はなお残[のこ]っていた。民[たみ]はまだ、父[ちち]たちの神[かみ]である主[しゅ]に心[こころ]を向[む]けていなかった。"
  34: "ヨシャファトの残[のこ]りの事[こと]ども、初[はじ]めのものも末[すえ]のものも、見[み]よ、ハナニの子[こ]イエフの記録[きろく]に書[か]かれている。彼[かれ]はそれをイスラエルの王[おう]たちの書[しょ]に記[しる]した。"
  35: "その後[あと]、ユダの王[おう]ヨシャファトはイスラエルの王[おう]アハズヤと誼[よしみ]を結[むす]んだ。この者[もの]もまた不法[ふほう]を働[はたら]いた。"
  36: "彼[かれ]はアハズヤと組[く]んで、タルシシュへ行[い]く船[ふね]を造[つく]ろうとした。彼[かれ]らはエツヨン・ゲベルで船[ふね]を造[つく]った。"
  37: "マレシャのドダワの子[こ]エリエゼルは、ヨシャファトについて預言[よげん]して言[い]った。「あなたはアハズヤと親[した]しくしたので、主[しゅ]はあなたの事業[じぎょう]を打[う]ち砕[くだ]かれた。あなたの船[ふね]は壊[こわ]された。」そして、それらはタルシシュへ行[い]くことができなかった。"

notes:
  1: "υἱοὶ Μωαβ καὶ υἱοὶ Αμμων — «сыны Моава и сыны Аммона» (モアブ人[じん]、アンモン人[じん]). ἐκ τῶν Μιναίων — из меунитян (Μιναῖοι); слав. «от амманитов», отсюда в тексте «アンモン人のうちから来た者たち» (чтение csl). В ru «из страны Маонитской». εἰς πόλεμον — на войну."
  2: "Ἥκει — «идёт, пришёл» (перфект ἥκω). πλῆθος πολύ — множество великое (大きな群れ). ἐκ πέραν τῆς θαλάσσης — из-за моря, т.е. с юго-востока (Мёртвое море). ἀπὸ Συρίας — от Сирии. Ασασανθαμαρ — Асасан-Фамар (アササンタマル, ср. Быт 14:7; в ru Хацацон-Фамар). [αὕτη ἐστὶν Ενγαδδι] — «это Ен-Гедди»; в гр в квадратных скобках, в слав. без скобок — переведено."
  3: "ἐφοβήθη — устрашился (φοβέομαι). ἔδωκεν τὸ πρόσωπον αὐτοῦ — «обратил лицо своё», т.е. устремился (слав. «вдаде лице свое»). ἐκζητῆσαι — взыскать. ἐκήρυξεν — провозгласил (κηρύσσω). νηστεία — пост (断食[だんじつ])."
  4: "συνήχθη — собрался (συνάγω). ἀπὸ πασῶν τῶν πόλεων — из всех городов. ἦλθον ζητῆσαι — пришли искать; слав. «ко умолению Господню» — на моление."
  5: "ἐκκλησία — собрание (集会[しゅうかい]). κατὰ πρόσωπον τῆς αὐλῆς τῆς καινῆς — «пред лицом двора нового» (新しい庭[にわ]; слав. «пред лицем двора новаго»): место у входа в дом Господень."
  6: "οὐχί — «не [ты ли]» (усиленное). κυριεύεις — господствуешь, владычествуешь (κυριεύω). ἰσχὺς δυναστείας — сила могущества (слав. «крепость силы»). οὐκ ἔστιν πρὸς σὲ ἀντιστῆναι — «нет [никого], чтобы стать против Тебя» (ἀνθίστημι). Молитва Иосафата — 「…」 до ст. 12."
  7: "ὁ ἐξολεθρεύσας — «истребивший» (ἐξολεθρεύω); слав. «Бог наш искоренивый» — вместо «Господь», отсюда われらの神. σπέρμα — семя, потомство (子孫[しそん]). τῷ ἠγαπημένῳ σου — «возлюбленному Твоему» (слав. «возлюбленному твоему»), т.е. другу Божию."
  8: "κατῴκησαν — поселились (κατοικέω). ἁγίασμα — святилище, святыня (聖所[せいしょ]; слав. «святыню»). λέγοντες — «говоря»: вводит вложенную речь потомков, которая продолжается в ст. 9 (『…』)."
  9: "κακά, ῥομφαία, κρίσις, θάνατος, λιμός — бедствия: меч, суд, смерть, голод; слав. «мечь, суд, губителство, глад» — «губителство» вместо «смерть» (θάνατος), отсюда 滅[ほろ]び. στησόμεθα — станем (ἵστημι). τὸ ὄνομά σου ἐπὶ τῷ οἴκῳ τούτῳ — «имя Твоё на доме этом» (слав. «призвано имя твое в дому сем»). βοησόμεθα — воззовём (βοάω). Здесь закрывается вложенная речь."
  10: "ὄρος Σηιρ — гора Сеир (セイル山[やま]). εἰς οὓς οὐκ ἔδωκας ... διελθεῖν — «в чьи [земли] Ты не дал пройти». ἐξελθόντων αὐτῶν ἐκ γῆς Αἰγύπτου — родительный абсолют: когда они вышли из Египта. ἐξέκλιναν ἀπ᾿ αὐτῶν — уклонились от них, обошли (ἐκκλίνω; слав. «уклонишася»). οὐκ ἐξωλέθρευσαν — не истребили (ἐξολεθρεύω)."
  11: "ἐπιχειροῦσιν ἐφ᾿ ἡμᾶς — «налагают руку на нас», покушаются (ἐπιχειρέω). ἐκβαλεῖν — изгнать (ἐκβάλλω). κληρονομία — наследие, удел (嗣業[しぎょう]). ἧς ἔδωκας ἡμῖν — которое Ты дал нам."
  12: "οὐ κρινεῖς ἐν αὐτοῖς — «не судишь ли их?». ἰσχὺς τοῦ ἀντιστῆναι — сила противостать. οὐκ οἴδαμεν τί ποιήσωμεν — не знаем, что делать. ἀλλ᾿ ἢ ἐπὶ σοὶ οἱ ὀφθαλμοὶ ἡμῶν — «но на Тебе очи наши» (слав. «но токмо очи наши к тебе»). Здесь закрывается молитва."
  13: "ἑστηκώς — стоя (перфект причастие ἵστημι). παιδία — малые дети (幼[おさな]い子[こ]ども). Слав. «чада их, и жены их»; в ru добавлено «и сыновья их» — в гр этого нет, не вносим. Тире в гр — конец периода."
  14: "Родословная цепочка: Οζιηλ (オジエル) — сын Захарии, сын Ванеи, сын Елеела (Ελεηλ — エレエル, ср. 1 Пар 8:22), сын Матфании (Μανθανιου — マンタニウ; в ru Матфания), левит из сынов Асафа (アサフ). ἐγένετο ἐπ᾿ αὐτὸν πνεῦμα κυρίου — «сошёл на него Дух Господень»; ἐν τῇ ἐκκλησίᾳ — среди собрания."
  15: "Ἀκούσατε — «слушайте». τάδε λέγει κύριος ὑμῖν αὐτοῖς — «так говорит Господь вам самим». μὴ φοβεῖσθε μηδὲ πτοηθῆτε — не бойтесь и не ужасайтесь (πτοέω). ἀπὸ προσώπου τοῦ ὄχλου τοῦ πολλοῦ τούτου — «от лица народа этого многого». οὐχ ὑμῖν ἐστιν ἡ παράταξις, ἀλλ᾿ ἢ τῷ θεῷ — «не вам [принадлежит] это сражение, но Богу» (παράταξις — строй, битва; слав. «ополчение»)."
  16: "αὔριον — завтра. κατάβητε — сойдите (καταβαίνω). ἀνάβασις Ασας — «восход Аса», подъём (坂[さか]; в ru «возвышенность Циц»). ἐπ᾿ ἄκρου ποταμοῦ τῆς ἐρήμου Ιεριηλ — «на конце реки пустыни Иериил» (слав. «на краи реки противу пустыни иериил»; в ru «на конце долины, пред пустынею Иеруилом»)."
  17: "οὐχ ὑμῖν ἐστιν πολεμῆσαι — «не вам воевать». σύνετε — уразумейте (συνίημι). ἴδετε τὴν σωτηρίαν κυρίου μεθ᾿ ὑμῶν — «увидьте спасение Господне с вами». μηδὲ πτοηθῆτε — не ужасайтесь. καὶ κύριος μεθ᾿ ὑμῶν — «и Господь с вами». Здесь закрываются и слова Господа, и речь Озиила."
  18: "κύψας ἐπὶ πρόσωπον — склонившись лицом (κύπτω). ἔπεσαν — пали (πίπτω). προσκυνῆσαι — чтобы поклониться (προσκυνέω)."
  19: "Κααθ — Кааф (カアテ); Κορε — Корей (コラ). αἰνεῖν — хвалить (ほめたたえる). ἐν φωνῇ μεγάλῃ εἰς ὕψος — «голосом великим до высоты» (слав. «гласом великим в высоту»)."
  20: "ὤρθρισαν πρωί — встали рано (ὀρθρίζω). ἔρημος Θεκωε — пустыня Фекоя (テコア; слав. «фекое»). ἐβόησεν — воззвал (βοάω). ἐμπιστεύσατε ... καὶ ἐμπιστευθήσεσθε — «верьте... и будете уверены, тверды» (ἐμπιστεύω); слав. «веруйте... и уверитеся». ἐν προφήτῃ αὐτοῦ — «пророку Его» (датив веры). εὐοδωθήσεσθε — «будете иметь успех» (εὐοδόω)."
  21: "ἐβουλεύσατο — держал совет (βουλεύομαι). ψαλτῳδοί — певцы (歌[うた]う者[もの]). ἐξομολογεῖσθαι καὶ αἰνεῖν τὰ ἅγια — «исповедовать и хвалить святое» (τὰ ἅγια — святыни; слав. «исповедатися и хвалити святая»), передано 聖[せい]なるもの. ἔμπροσθεν τῆς δυνάμεως — перед войском (武[ぶ]装[そう]した者[もの]). ἔλεγον — говорили; далее слова певцов (Пс 105:1; 117:1)."
  22: "ἐν τῷ ἄρξασθαι τῆς αἰνέσεως ... τῆς ἐξομολογήσεως — «когда начали хвалу и исповедание». ἔδωκεν ... πολεμεῖν — «дал воевать», т.е. возбудил войну (слав. «обрати Господь воевати»). τοὺς ἐξελθόντας ἐπὶ Ιουδαν — пришедших на Иуду. ἐτροπώθησαν — были обращены в бегство, поражены (τροπόω)."
  23: "ἐξολεθρεῦσαι καὶ ἐκτρῖψαι — истребить и сокрушить (ἐξολεθρεύω, ἐκτρίβω). ὡς συνετέλεσαν — когда покончили (συντελέω). ἀνέστησαν εἰς ἀλλήλους — «восстали друг на друга». τοῦ ἐξολεθρευθῆναι — чтобы истребить друг друга."
  24: "σκοπιά — сторожевой пост, вершина (荒野[こうや]を見渡[みわた]す高[たか]み; слав. «созирание»). ἐπέβλεψεν — воззрел (ἐπιβλέπω). νεκροὶ πεπτωκότες — мёртвые, павшие (перфект πίπτω). οὐκ ἦν σῳζόμενος — «не было спасаемого» (σῴζω)."
  25: "σκυλεῦσαι τὰ σκῦλα — «обобрать добычу» (σκυλεύω, σκῦλα — 戦利品[せんりひん]). κτήνη — скот (家畜[かちく]). ἀποσκευή — снаряжение, обоз (荷物[にもつ]; слав. «одежды» — иное). σκεύη ἐπιθυμητά — сосуды вожделенные, драгоценные вещи (望[のぞ]ましい品々[しなじな]). ἐγένοντο ἡμέραι τρεῖς σκυλευόντων — «было три дня, пока они обирали» (родительный абсолют). В слав. этого нет; в ru «набрали себе столько, что не могли нести» — по МТ."
  26: "αὐλών — ущелье, долина (谷[たに]). ἐπισυνήχθησαν — собрались (ἐπισυνάγω). ηὐλόγησαν — благословили, восхвалили (εὐλογέω). Κοιλὰς εὐλογίας — «долина благословения» (евр. Эмек-Бераха), отсюда 祝福[しゅくふく]の谷[たに]."
  27: "ἐπέστρεψεν — возвратился (ἐπιστρέφω). ἡγούμενος αὐτῶν — во главе их (先頭[せんとう]). ἐν εὐφροσύνῃ μεγάλῃ — в великой радости (喜[よろこ]び). εὔφρανεν — возвеселил (εὐφραίνω). ἀπὸ τῶν ἐχθρῶν — «от врагов», т.е. избавив от врагов."
  28: "νάβλαι — псалтири (琴[こと]), κινύραι — киниры (竪琴[たてごと]), σάλπιγγες — трубы (ラッパ) — по корпусу. εἰσῆλθον ... εἰς οἶκον κυρίου — вошли в дом Господень."
  29: "ἔκστασις — ужас, страх (слав. «страх Господень»). ὑπεναντίοι — противники, враги (敵[てき]). ἐπολέμησεν — воевал (πολεμέω)."
  30: "εἰρήνευσεν — умирилось (εἰρηνεύω; слав. «умирися»). κατέπαυσεν — дал покой (καταπαύω). κυκλόθεν — со всех сторон, вокруг (слав. «окрест»). ὁ θεὸς αὐτοῦ — «Бог его»; в слав. «Господь» — по паритету в тексте 主[しゅ], вариант LXX — здесь."
  31: "ἐτῶν τριάκοντα πέντε — «тридцати пяти лет». ἐν τῷ βασιλεῦσαι αὐτόν — «когда воцарился». Αζουβα — Азува (アズバ); Σαλι — Сали (セレイ; слав. «Салиина», ru «Салаила»). Ср. 3 Цар 22:42."
  32: "ἐξέκλινεν — уклонился (ἐκκλίνω). τὸ εὐθὲς ἐνώπιον κυρίου — «правое пред Господом» (слав. «правое пред Господем»). Стих кончается двоеточием — продолжение в ст. 33."
  33: "ὑψηλά — высоты (高[たか]い所[ところ]). ὑπῆρχεν — «были, существовали» (ὑπάρχω; ед. ч. при мн. подлежащем). κατεύθυνεν τὴν καρδίαν — направил сердце (κατευθύνω; слав. «не управиша сердца»). В 3 Цар 22:44 та же мысль изложена иначе."
  34: "οἱ λοιποὶ λόγοι — прочие слова, деяния (残[のこ]りの事[こと]ども). ἐν λόγοις Ιου τοῦ Ανανι — «в словах Иуя, сына Анании» (ハナニの子[こ]イエフ). κατέγραψεν βιβλίον βασιλέων Ισραηλ — «описал книгу царей Израиля» (слав. «написа книгу царей израилевых»)."
  35: "ἐκοινώνησεν — вошёл в общение, вступил в союз (κοινωνέω; слав. «сообщися»). [καὶ οὗτος ἠνόμησεν] — «и этот беззаконновал»; в гр в квадратных скобках, в слав. без скобок — переведено (不法[ふほう]を働[はたら]いた)."
  36: "Θαρσις — Фарсис (タルシシュ). Γασιωνγαβερ — Гасион-Гавер, Ецион-Гавер (エツヨン・ゲベル). Синтаксис гр тёмен: «в том, что сделал и пошёл к нему, чтобы сделать корабли...» (слав. «занеже сотвори, и отиде к нему, да сотворят корабли»); передано по смыслу."
  37: "Ελιεζερ ὁ τοῦ Δωδια — Елиезер, сын Додавы (エリエゼル、ドダワの子; слав. «сын додиа»). ἀπὸ Μαρισης — из Мариши (マレシャ; слав. «от марисиса»). Ὡς ἐφιλίασας — «так как ты подружился» (φιλιάζω). ἔθραυσεν — сокрушил (θραύω); συνετρίβη — разбились (συντρίβω). οὐκ ἐδυνάσθη — не смогли (δύναμαι). Исполнение — ср. 3 Цар 22:49."
