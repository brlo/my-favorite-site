# jp-box, 2-я Паралипоменон, глава 20. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); церковнославянский (csl-ru) — второй
# свидетель церковного текста (новый паритет, docs/japanese-bible.md):
# слав. чтения входят в основной текст без 〔…〕, вариант LXX — в notes.
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет;
# jp-ni (под авторским правом) не использовался.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление
# на клаузы — по греческому.
# Глава 20: нашествие Моава, Аммона и Сеира (1–2), пост и молитва Иосафата
# (3–12), собрание и слово Озиила (13–17), поклонение и хвала левитов
# (18–19), выступление и обетование (20), певцы впереди войска (21),
# междоусобица врагов и добыча (22–25), долина благословения (26–30),
# итог царствования (31–34), союз с Охозией и крушение кораблей (35–37).
# Параллели к ст. 31–37 — 3 Цар 22:41–49; расхождения отмечены в notes.
# Нумерация по gr: 37 стихов, совпадает с csl и ru.
# Речь — 「…」: вестники (2), молитва Иосафата (6–12; вложенная речь
# потомков — 『…』 в 8–9), Озиил и слова Господа в нём (15–17, вложенная
# речь Господа — 『…』), Иосафат к народу (20), певцы (21), Елиезер (37).
# Красного нет.
# 〔…〕 нет: текст всех стихов есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 断食[だんじつ], 嗣業[しぎょう], 集会[しゅうかい], 歌[うた]い手[て],
# 琴[こと], 竪琴[たてごと], ラッパ, 戦利品[せんりひん] уже в корпусе.
# jp-ni не использовался.

