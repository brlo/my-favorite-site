# jp-box, 1-е Послание к Тимофею, глава 2. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 2: молитва за всех людей и за царей (1–2); это благоугодно Богу, желающему
# всем спасения (3–4); единый Бог и единый посредник — человек Христос Иисус (5–6);
# Павел — проповедник и учитель язычников (7); о молитве мужчин (8), о приличии
# женщин (9–10), об учении и тишине (11–12), Адам и Ева (13–14), спасение через
# деторождение при вере (15).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет,
# <j>/<mo> не ставятся.
# 〔…〕 одно — 2:7 〔キリストにあって〕: церковное ἀλήθειαν λέγω ἐν Χριστῷ
# (Елизаветинская «истину глаголю о Христе»; jp-joc «ハリストスに在りて眞實を言ひて»).
# В gr-lxx-byz 2:7 ἐν Χριστῷ нет — проверено запросом к базе, поэтому 〔…〕.
# В 2:9 [καί] в критическом издании стоит в квадратных скобках, но в базе слово
# есть — 女もまた без 〔…〕. В остальных стихах слова все есть.
# Сносок ⟨…⟩ нет: 真珠, 高価な衣, 仲介者, 系図 — понятные слова; 敬虔, 良心, 異邦人
# уже встречались в корпусе и пояснены при первом упоминании.
# jp-ni не использовался.

tr_code: jp-box
book: 1tim
chapter: 2
draft: true

verses:
  1: "そこで、まず第一[だいいち]に勧[すす]める。すべての人[ひと]のために、願[ねが]いと、祈[いの]りと、執[と]り成[な]しと、感謝[かんしゃ]とをささげなさい。"
  2: "また、王[おう]たちと、すべての高[たか]い地位[ちい]にある人[ひと]たちのために。それは、わたしたちが、すべての敬虔[けいけん]と品位[ひんい]とをもって、穏[おだ]やかで静[しず]かな生活[せいかつ]を送[おく]るためである。"
  3: "これは、わたしたちの救[すく]い主[ぬし]である神[かみ]の御前[みまえ]に、善[よ]く、受[う]け入[い]れられることである。"
  4: "神[かみ]は、すべての人[ひと]が救[すく]われ、真理[しんり]の知識[ちしき]に至[いた]ることを望[のぞ]んでおられる。"
  5: "というのは、神[かみ]はひとりであり、神[かみ]と人[ひと]との間[あいだ]の仲介者[ちゅうかいしゃ]もひとりである。すなわち、人[ひと]であるキリスト・イエスである。"
  6: "この方[かた]は、すべての人[ひと]のための贖[あがな]いとして、ご自身[じしん]をお与[あた]えになった。その証[あかし]は、定[さだ]められた時[とき]に与[あた]えられる。"
  7: "わたしはそのために、宣教[せんきょう]者[しゃ]として、また使徒[しと]として立[た]てられた。〔キリストにあって〕真実[しんじつ]を言[い]う、偽[いつわ]りは言[わ]ない。信仰[しんこう]と真理[しんり]とにおいて、異邦人[いほうじん]の教師[きょうし]である。"
  8: "そこで、わたしは、男[おとこ]たちがどこででも祈[いの]ることを望[のぞ]む。聖[せい]なる手[て]を上[あ]げ、怒[いか]りも疑[うたが]いもなく祈[いの]るのである。"
  9: "同[おな]じように、女[おんな]たちも、整[ととの]った装[よそお]いで、慎[つつ]みと貞淑[ていしゅく]とをもって自分[じぶん]を飾[かざ]るように。髪[かみ]を編[あ]んだり、金[きん]や真珠[しんじゅ]、高価[こうか]な衣[ころも]を着[き]たりしてではなく、"
  10: "神[かみ]に仕[つか]えることを約束[やくそく]している女[おんな]たちにふさわしく、善[よ]い業[わざ]によって飾[かざ]るように。"
  11: "女[おんな]は、すべての従順[じゅうじゅん]をもって、静[しず]かに学[まな]ぶように。"
  12: "女[おんな]が教[おし]えること、また男[おとこ]に対して権威[けんい]を振[ふ]るうことを、わたしは許[ゆる]さない。むしろ、静[しず]かであるべきである。"
  13: "というのは、アダムが先[さき]に造[つく]られ、次[つぎ]にエバが造[つく]られたからである。"
  14: "また、アダムは欺[あざむ]かれなかったが、女[おんな]は欺[あざむ]かれて、背[そむ]きのうちに陥[おちい]ったのである。"
  15: "しかし、女[おんな]は、子[こ]を産[う]むことによって救[すく]われる。ただし、信仰[しんこう]と愛[あい]と聖化[せいか]とを、貞淑[ていしゅく]とともに保[たも]ち続[つづ]けるならば、である。"

notes:
  1: "Παρακαλῶ οὖν πρῶτον πάντων — そこで、まず第一に勧める. ποιεῖσθαι δεήσεις, προσευχάς, ἐντεύξεις, εὐχαριστίας — 願いと、祈りと、執り成しと、感謝とをささげなさい: четыре разных слова сохранены (δέησις — прошение, προσευχή — молитва, ἔντευξις — ходатайство, εὐχαριστία — благодарение, ср. Флп 4:6). ὑπὲρ πάντων ἀνθρώπων — すべての人のために: относится ко всем четырём."
  2: "ὑπὲρ βασιλέων — 王たちのために (то есть и за римского императора, ср. Рим 13:1). τῶν ἐν ὑπεροχῇ ὄντων — 高い地位にある人たち (ὑπεροχή — «превосходство, начальство»). ἵνα ἤρεμον καὶ ἡσύχιον βίον διάγωμεν — 穏やかで静かな生活を送る (ἤρεμος — hapax; ἡσύχιος — «тихий»). ἐν πάσῃ εὐσεβείᾳ καὶ σεμνότητι — すべての敬虔と品位とをもって (εὐσέβεια — 敬虔[けいけん]; σεμνότης — 品位[ひんい], ср. 3:4,8,11)."
  3: "τοῦτο καλὸν καὶ ἀπόδεκτον — これは…善く、受け入れられることである. ἐνώπιον τοῦ σωτῆρος ἡμῶν θεοῦ — わたしたちの救い主である神の御前に. В базе нет γάρ (у jp-joc 蓋), поэтому связка «なぜなら» не добавлена."
  4: "ὃς πάντας ἀνθρώπους θέλει σωθῆναι — 神は、すべての人が救われ…ことを望んでおられる (θέλει — «хочет», подлежащее — Бог). εἰς ἐπίγνωσιν ἀληθείας ἐλθεῖν — 真理の知識に至る (ἐπίγνωσις — 知識, как в Еф 4:13; полнота знания не сглажена)."
  5: "εἷς γὰρ θεός — というのは、神はひとりであり (γάρ в базе есть, связка сохранена). εἷς καὶ μεσίτης θεοῦ καὶ ἀνθρώπων — 神と人との間の仲介者もひとり (μεσίτης — 仲介者[ちゅうかいしゃ], ср. Евр 8:6; 9:15; 12:24). ἄνθρωπος Χριστὸς Ἰησοῦς — 人であるキリスト・イエス: приложение, ἄνθρωπος не опущено."
  6: "ὁ δοὺς ἑαυτὸν ἀντίλυτρον ὑπὲρ πάντων — すべての人のための贖いとして、ご自身をお与えになった (ἀντίλυτρον — hapax, «выкуп вместо», ср. Мк 10:45 λύτρον ἀντί; приставка ἀντί сохранена в ための). τὸ μαρτύριον καιροῖς ἰδίοις — その証は、定められた時に与えられる: καιροῖς ἰδίοις — «в свои сроки»; может относиться и к следующему стиху (свидетельство, данное в свой срок через проповедь); 定められた時に — минимальное уточнение."
  7: "εἰς ὃ ἐτέθην ἐγὼ κῆρυξ καὶ ἀπόστολος — わたしはそのために、宣教者として、また使徒として立てられた (κῆρυξ — глашатай, ср. 2 Тим 1:11). ἀλήθειαν λέγω, οὐ ψεύδομαι — 真実を言う、偽りは言わない (торжественное уверение; в базе между тире). 〔キリストにあって〕: церковное чтение ἀλήθειαν λέγω ἐν Χριστῷ (Елизаветинская «истину глаголю о Христе»; jp-joc «ハリストスに在りて眞實を言ひて謊らず»). В gr-lxx-byz 2:7 ἐν Χριστῷ нет — проверено, поэтому 〔…〕. διδάσκαλος ἐθνῶν — 異邦人の教師 (ἔθνη — 異邦人[いほうじん]). ἐν πίστει καὶ ἀληθεία — 信仰と真理とにおいて."
  8: "Βούλομαι οὖν — そこで、わたしは…望む (βούλομαι, ср. 5:14). τοὺς ἄνδρας — 男たち (ἀνήρ — мужчина, муж, не ἄνθρωπος). ἐν παντὶ τόπῳ — どこででも. ἐπαίροντας ὁσίους χεῖρας — 聖なる手を上げ (ὅσιος — «непорочный»; жест молитвы, ср. Пс 140:2, LXX). χωρὶς ὀργῆς καὶ διαλογισμοῦ — 怒りも疑いもなく (διαλογισμός здесь — сомнение, спор, ср. Лк 24:38)."
  9: "ὡσαύτως [καὶ] γυναῖκας — 同じように、女たちも: [καί] в критическом издании в квадратных скобках, но в базе оно есть — 〔…〕 не ставятся. ἐν καταστολῇ κοσμίῳ — 整った装いで (καταστολή — «одеяние», κόσμιος — «приличный, скромный»). μετὰ αἰδοῦς καὶ σωφροσύνης — 慎みと貞淑とをもって (αἰδώς — стыдливость; σωφροσύνη — целомудрие, ср. 2:15). κοσμεῖν ἑαυτάς — 自分を飾る (κοσμέω, ср. 1 Пет 3:5). μὴ ἐν πλέγμασιν — 髪を編んだり (πλέγμα — «плетение»). χρυσίῳ ἢ μαργαρίταις ἢ ἱματισμῷ πολυτελεῖ — 金や真珠、高価な衣 (μαργαρίτης — 真珠[しんじゅ], ср. Мф 13:45). Стих обрывается на ではなく, сказуемое — в ст. 10."
  10: "ἀλλ᾿ ὃ πρέπει — ではなく、…にふさわしく (продолжение ст. 9). γυναιξὶν ἐπαγγελλομέναις θεοσέβειαν — 神に仕えることを約束している女たちに (ἐπαγγέλλομαι — «обещать, исповедовать»; θεοσέβεια, ср. 6:3,5,6,11). δι᾿ ἔργων ἀγαθῶν — 善い業によって (ἔργον — 業[わざ])."
  11: "γυνὴ ἐν ἡσυχίᾳ μανθανέτω — 女は、静かに学ぶように (μανθάνω — «учиться», не «слушать»). ἐν πάσῃ ὑποταγῇ — すべての従順をもって (ὑποταγή — 従順[じゅうじゅん], ср. 3:4)."
  12: "διδάσκειν δὲ γυναικὶ οὐκ ἐπιτρέπω — 女が教えることを、わたしは許さない. οὐδὲ αὐθεντεῖν ἀνδρός — また男に対して権威を振るうこと (αὐθεντέω — hapax в НЗ, «самовластно распоряжаться»; не сглажено в «начальствовать»). ἀλλ᾿ εἶναι ἐν ἡσυχίᾳ — むしろ、静かであるべきである (инфинитив как продолжение ἐπιτρέπω)."
  13: "Ἀδὰμ γὰρ πρῶτος ἐπλάσθη, εἶτα Εὕα — というのは、アダムが先に造られ、次にエバが造られたからである (πλάσσω — «лепить», ср. Быт 2:7; 1 Кор 11:9). Имена: アダム, エバ — по списку корпуса."
  14: "καὶ Ἀδὰμ οὐκ ἠπατήθη — また、アダムは欺かれなかった (ἀπατάω — «обманывать»). ἡ δὲ γυνὴ ἐξαπατηθεῖσα — 女は欺かれて (ἐξαπατάω с усилением ἐξ-, ср. 2 Кор 11:3; Быт 3:13). ἐν παραβάσει γέγονεν — 背きのうちに陥った (παράβασις — 背き, как в Еф 2:1; γέγονεν — «оказалась»)."
  15: "σωθήσεται δὲ διὰ τῆς τεκνογονίας — しかし、女は、子を産むことによって救われる (трудное место; τεκνογονία — «деторождение», не сглажено). ἐὰν μείνωσιν — 保ち続けるならば: в греч. множественное число (μείνωσιν), хотя подлежащее в начале стиха единственное; в японском подлежащее не названо, чтобы не решать, о ком речь (женщина одна, она с мужем, дети). ἐν πίστει καὶ ἀγάπῃ καὶ ἁγιασμῷ — 信仰と愛と聖化と (ἁγιασμός — 聖化[せいか], как в 1 Кор 1:30). μετὰ σωφροσύνης — 貞淑とともに (σωφροσύνη, как в 2:9)."
