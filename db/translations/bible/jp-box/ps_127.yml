verses:
  0: "登[とう]上[じょう]の歌[うた]。"
  1: "幸[さいわ]いなのは、すべて主[しゅ]を恐[おそ]れ、その道[みち]を歩[あゆ]む者[もの]である。"
  2: "あなたは自分[じぶん]の手[て]の労苦[ろうく]の実[み]を食[た]べる。あなたは幸[さいわ]いであり、すべてがよく進[すす]む。"
  3: "あなたの妻[つま]は、あなたの家[いえ]の隅[すみ]に実[み]を結[むす]ぶぶどうの木[き]のようである。あなたの子[こ]どもたちは、あなたの食卓[しょくたく]の周[まわ]りに植[う]えられたオリーブの若木[わかぎ]のようである。"
  4: "見[み]よ、主[しゅ]を恐[おそ]れる人[ひと]は、このように祝福[しゅくふく]される。"
  5: "主[しゅ]がシオンからあなたを祝福[しゅくふく]してくださるように。あなたが生[い]きる日[ひ]々[び]のすべても、エルサレムの幸[しあわ]せを見[み]るように。"
  6: "あなたが子[こ]どもたちの子[こ]どもを見[み]るように。イスラエルに平和[へいわ]があるように。"

notes:
  0: "Ὠιδὴ τῶν ἀναβαθμῶν — 登[とう]上[じょう]の歌. Стих 0; совпадает в gr-lxx-byz и в ru-базе."
  1: "Μακάριοι πάντες οἱ φοβούμενοι τὸν κύριον — 幸いなのは、すべて主を恐れ…る者である (μακάριος — «блажен», как в 1:1; 2:12; φοβέομαι — «бояться», в библейском смысле — благоговеть). οἱ πορευόμενοι ἐν ταῖς ὁδοῖς αὐτοῦ — その道を歩む者 (πορεύομαι — «ходить»; мн. ὁδοί — «пути»)."
  2: "τοὺς πόνους τῶν καρπῶν σου φάγεσαι — あなたは自分の手の労苦の実を食べる (πόνος — «труд, страдание»; καρπός — 実; φάγεσαι — будущее от ἐσθίω). μακάριος εἶ, καὶ καλῶς σοι ἔσται — あなたは幸いであり、すべてがよく進む (καλῶς — «хорошо»; ἔσται — «будет», передано すべてがよく進む, ср. 1:3)."
  3: "ἡ γυνή σου ὡς ἄμπελος εὐθηνοῦσα — あなたの妻は…実を結ぶぶどうの木のようである (ἄμπελος — «виноградная лоза»; εὐθηνέω — «процветать, плодоносить»). ἐν τοῖς κλίτεσι τῆς οἰκίας σου — あなたの家の隅に (κλίτος — «склон, сторона», т. е. внутренние покои дома). οἱ υἱοί σου ὡς νεόφυτα ἐλαιῶν — あなたの子どもたちは…オリーブの若木のようである (νεόφυτον — «новонасаждение, молодой побег»; ἐλαία — «олива»). κύκλῳ τῆς τραπέζης σου — あなたの食卓の周りに (τράπεζα — 食卓)."
  4: "ἰδοὺ οὕτως εὐλογηθήσεται ἄνθρωπος ὁ φοβούμενος τὸν κύριον — 見よ、主を恐れる人は、このように祝福される (εὐλογέω — «благословлять»; повтор мысли ст. 1, но уже как вывод, поэтому このように)."
  5: "εὐλογήσαι σε κύριος ἐκ Σιων — 主がシオンからあなたを祝福してくださるように (оптатив εὐλογήσαι — пожелание-благословение, отсюда ように; ἐκ Σιων — от храма, ср. 133:3). καὶ ἴδοις τὰ ἀγαθὰ Ιερουσαλημ — エルサレムの幸せを見るように (ἀγαθά — «блага»; ἴδοις — оптатив «увидеть бы»). πάσας τὰς ἡμέρας τῆς ζωῆς σου — あなたが生きる日々のすべても (букв. «во все дни жизни твоей»)."
  6: "καὶ ἴδοις υἱοὺς τῶν υἱῶν σου — あなたが子どもたちの子どもを見るように (внуки; повтор ἴδοις из ст. 5 сохранён повтором 見る). εἰρήνη ἐπὶ τὸν Ισραηλ — イスラエルに平和があるように (заключительная формула, ср. 124:5; 128:6)."
