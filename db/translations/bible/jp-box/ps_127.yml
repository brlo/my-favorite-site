# jp-box, Псалтирь, псалом 127. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация — славяно-синодальная (csl-ru): в слав. надписание отдельным стихом
# не стоит, поэтому наш стих 0 (надписание) влит в начало стиха 1; дальше номера 1..7.
# Разбивка — славяно-синодальная (csl-ru): слав. ст. 3 — только о жене,
# ст. 4 — о детях (гр. 3 разделён); дальше номера сдвинуты на 1 (см. notes 3–4).
# Псалом 127: блажен боящийся Господа (1–2), жена и дети как знак благословения (3–4),
# благословение от Сиона (5–7).
# Красного и синего нет. Кавычек нет: в псалме нет прямой речи.
# 〔…〕 нет: перевод сделан по gr-lxx-byz, добавлений Церкви не вносилось.
# セラ (διάψαλμα) в этой главе нет.
# Сносок ⟨…⟩ нет: 妻, 食卓, 若木 понятны; 平和 уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: ps
chapter: 127
draft: true

verses:
  1: "登[とう]上[じょう]の歌[うた]。幸[さいわ]いなのは、すべて主[しゅ]を恐[おそ]れ、その道[みち]を歩[あゆ]む者[もの]である。"
  2: "あなたは自分[じぶん]の手[て]の労苦[ろうく]の実[み]を食[た]べる。あなたは幸[さいわ]いであり、すべてがよく進[すす]む。"
  3: "あなたの妻[つま]は、あなたの家[いえ]の隅[すみ]に実[み]を結[むす]ぶぶどうの木[き]のようである。"
  4: "あなたの子[こ]どもたちは、あなたの食卓[しょくたく]の周[まわ]りに植[う]えられたオリーブの若木[わかぎ]のようである。"
  5: "見[み]よ、主[しゅ]を恐[おそ]れる人[ひと]は、このように祝福[しゅくふく]される。"
  6: "主[しゅ]がシオンからあなたを祝福[しゅくふく]してくださるように。あなたが生[い]きる日[ひ]々[び]のすべても、エルサレムの幸[しあわ]せを見[み]るように。"
  7: "あなたが子[こ]どもたちの子[こ]どもを見[み]るように。イスラエルに平和[へいわ]があるように。"

notes:
  1: "Ὠιδὴ τῶν ἀναβαθμῶν — 登[とう]上[じょう]の歌. Стих 0; совпадает в gr-lxx-byz и в ru-базе. В csl-ru отдельного стиха 0 нет — надписание влито в ст. 1. Μακάριοι πάντες οἱ φοβούμενοι τὸν κύριον — 幸いなのは、すべて主を恐れ…る者である (μακάριος — «блажен», как в 1:1; 2:12; φοβέομαι — «бояться», в библейском смысле — благоговеть). οἱ πορευόμενοι ἐν ταῖς ὁδοῖς αὐτοῦ — その道を歩む者 (πορεύομαι — «ходить»; мн. ὁδοί — «пути»)."
  2: "τοὺς πόνους τῶν καρπῶν σου φάγεσαι — あなたは自分の手の労苦の実を食べる (πόνος — «труд, страдание»; καρπός — 実; φάγεσαι — будущее от ἐσθίω). μακάριος εἶ, καὶ καλῶς σοι ἔσται — あなたは幸いであり、すべてがよく進む (καλῶς — «хорошо»; ἔσται — «будет», передано すべてがよく進む, ср. 1:3)."
  3: "ἡ γυνή σου ὡς ἄμπελος εὐθηνοῦσα — あなたの妻は…実を結ぶぶどうの木のようである (ἄμπελος — «виноградная лоза»; εὐθηνέω — «процветать, плодоносить»). ἐν τοῖς κλίτεσι τῆς οἰκίας σου — あなたの家の隅に (κλίτος — «склон, сторона», т. е. внутренние покои дома). Слав. ст. 3 — только о жене."
  4: "οἱ υἱοί σου ὡς νεόφυτα ἐλαιῶν — あなたの子どもたちは…オリーブの若木のようである (νεόφυτον — «новонасаждение, молодой побег»; ἐλαία — «олива»). κύκλῳ τῆς τραπέζης σου — あなたの食卓の周りに (τράπεζα — 食卓). Слав. ст. 4 — о детях."
  5: "ἰδοὺ οὕτως εὐλογηθήσεται ἄνθρωπος ὁ φοβούμενος τὸν κύριον — 見よ、主を恐れる人は、このように祝福される (εὐλογέω — «благословлять»; повтор мысли ст. 1, но уже как вывод, поэтому このように)."
  6: "εὐλογήσαι σε κύριος ἐκ Σιων — 主がシオンからあなたを祝福してくださるように (оптатив εὐλογήσαι — пожелание-благословение, отсюда ように; ἐκ Σιων — от храма, ср. 133:3). καὶ ἴδοις τὰ ἀγαθὰ Ιερουσαλημ — エルサレムの幸せを見るように (ἀγαθά — «блага»; ἴδοις — оптатив «увидеть бы»). πάσας τὰς ἡμέρας τῆς ζωῆς σου — あなたが生きる日々のすべても (букв. «во все дни жизни твоей»)."
  7: "καὶ ἴδοις υἱοὺς τῶν υἱῶν σου — あなたが子どもたちの子どもを見るように (внуки; повтор ἴδοις из ст. 5 сохранён повтором 見る). εἰρήνη ἐπὶ τὸν Ισραηλ — イスラエルに平和があるように (заключительная формула, ср. 124:5; 128:6)."
