verses:
  0: "指揮者[しきしゃ]に。ぶどう搾[しぼ]り場[ば]について。アサフの詩[うた]。"
  1: "わたしたちの助[たす]けである神[かみ]に喜[よろこ]びの声[こえ]を上[あ]げ、ヤコブの神[かみ]に叫[さけ]び声[ごえ]を上[あ]げよ。"
  2: "歌[うた]を取[と]り、太鼓[たいこ]を打[う]ち鳴[な]らせ。美[うつく]しい調[しら]べの琴[こと]を、竪琴[たてごと]とともに奏[かな]でよ。"
  3: "新月[しんげつ]にラッパを吹[ふ]き鳴[な]らせ。わたしたちの祭[まつ]りの定[さだ]められた日[ひ]に。"
  4: "これはイスラエルへの掟[おきて]、ヤコブの神[かみ]の定[さだ]めである。"
  5: "神[かみ]はこれをヨセフのうちに証[あかし]として置[お]かれた。ヨセフがエジプトの地[ち]から出[で]たときのことである。彼[かれ]はまだ知[し]らない言葉[ことば]を聞[き]いた。"
  6: "「わたしは彼[かれ]の肩[かた]から重[おも]荷[に]を下[お]ろし、その手[て]を籠[かご]から解[と]き放[はな]った。"
  7: "苦[くる]しみのうちで、あなたはわたしを呼[よ]んだ。わたしはあなたを救[すく]い出[だ]した。嵐[あらし]の隠[かく]れたところで、わたしはあなたに答[こた]えた。メリバの水[みず]のほとりで、わたしはあなたを試[こころ]みた。"
  8: "わたしの民[たみ]よ、聞[き]け。わたしはあなたに証[しょう]しをする。イスラエルよ、あなたがわたしの声[こえ]を聞[き]くなら。"
  9: "あなたのうちに新[あたら]しい神[かみ]があってはならない。あなたは異[い]なる神[かみ]を拝[おが]んではならない。"
  10: "わたしは主[しゅ]、あなたの神[かみ]、あなたをエジプトの地[ち]から上[のぼ]らせた者[もの]である。あなたの口[くち]を広[ひろ]く開[ひら]け。わたしはそれを満[み]たす。"
  11: "しかし、わたしの民[たみ]はわたしの声[こえ]を聞[き]かなかった。イスラエルはわたしに耳[みみ]を傾[かたむ]けなかった。"
  12: "それで、わたしは彼[かれ]らをその心[こころ]の望[のぞ]みに任[まか]せ、自分[じぶん]たちの思[おも]いのままに歩[あゆ]ませた。"
  13: "わたしの民[たみ]がわたしの声[こえ]を聞[き]き、イスラエルがわたしの道[みち]を歩[あゆ]んだなら。"
  14: "わたしはたちまち彼[かれ]らの敵[てき]を低[ひく]くし、彼[かれ]らを苦[くる]しめる者[もの]の上[うえ]に手[て]を置[お]いたであろう。"
  15: "主[しゅ]を憎[にく]む者[もの]たちは彼[かれ]らに偽[いつわ]って従[したが]い、彼[かれ]らの時[とき]はとこしえに続[つづ]く。"
  16: "わたしは最[もっと]も良[よ]い小麦[こむぎ]で彼[かれ]らを養[やしな]い、岩[いわ]から出[で]る蜜[みつ]で彼[かれ]らを満[み]ち足[た]らせたであろう。」"

notes:
  0: "Εἰς τὸ τέλος, ὑπὲρ τῶν ληνῶν· τῷ Ασαφ ψαλμός — 指揮者に。ぶどう搾り場について。アサフの詩 (ληνός — «точило, давильня»; ぶどう搾り場, как в надписании Пс 8; у Синодального «на Гефском орудии» — перенос по евр., здесь по греч.). Надписание — стих 0."
  1: "Ἀγαλλιᾶσθε τῷ θεῷ τῷ βοηθῷ ἡμῶν — わたしたちの助けである神に喜びの声を上げ (ἀγαλλιάομαι — «ликовать»; βοηθός — «помощник»). ἀλαλάξατε τῷ θεῷ Ιακωβ — ヤコブの神に叫び声を上げよ (ἀλαλάζω — «восклицать», боевой клич)."
  2: "λάβετε ψαλμὸν καὶ δότε τύμπανον — 歌を取り、太鼓を打ち鳴らせ (ψαλμός — 歌, псалом; τύμπανον — 太鼓, как в Пс 67:26). ψαλτήριον τερπνὸν μετὰ κιθάρας — 美しい調べの琴を、竪琴とともに奏でよ (ψαλτήριον — 琴, κιθάρα — 竪琴, как в Пс 56:9)."
  3: "σαλπίσατε ἐν νεομηνίᾳ σάλπιγγι — 新月にラッパを吹き鳴らせ (νεομηνία — «новомесячие»; σάλπιγξ — ラッパ, как по всему корпусу). ἐν εὐσήμῳ ἡμέρᾳ ἑορτῆς ἡμῶν — わたしたちの祭りの定められた日に (εὔσημος — «нарочитый, отмеченный»; ἑορτή — 祭り)."
  4: "ὅτι πρόσταγμα τῷ Ισραηλ ἐστὶν — これはイスラエルへの掟 (πρόσταγμα — «повеление»). κρίμα τῷ θεῷ Ιακωβ — ヤコブの神の定め (κρίμα — «определение, суд»; датив «Богу Иаковлеву» передан の)."
  5: "μαρτύριον ἐν τῷ Ιωσηφ ἔθετο αὐτόν — 神はこれをヨセフのうちに証として置かれた (μαρτύριον — 証; αὐτόν — «его», т. е. установление). ἐν τῷ ἐξελθεῖν αὐτὸν ἐκ γῆς Αἰγύπτου — ヨセフがエジプトの地から出たときに. γλῶσσαν, ἣν οὐκ ἔγνω, ἤκουσεν — 彼はまだ知らない言葉を聞いた (γλῶσσα — «язык, речь»)."
  6: "ἀπέστησεν ἀπὸ ἄρσεων τὸν νῶτον αὐτοῦ — わたしは彼の肩から重荷を下ろし (ἄρσεις — «ношение, тяжести»; νῶτον — «спина, плечи»). αἱ χεῖρες αὐτοῦ ἐν τῷ κοφίνῳ ἐδούλευσαν — букв. «руки его в корзине работали» (ἐδούλευσαν — «служили»); по церковному чтению (Синодальный «руки его освободились от корзин», jp-joc 筐筥より免れしめたり) — 手を籠から解き放った. Начало речи Бога — 「」."
  7: "Ἐν θλίψει ἐπεκαλέσω με, καὶ ἐρρυσάμην σε — 苦しみのうちで、あなたはわたしを呼んだ。わたしはあなたを救い出した (ῥύομαι — «избавлять»). ἐπήκουσά σου ἐν ἀποκρύφῳ καταιγίδος — 嵐の隠れたところで、わたしはあなたに答えた (ἀπόκρυφος — «сокровенный»; καταιγίς — «буря»; слав. «в тайне бури»). ἐδοκίμασά σε ἐπὶ ὕδατος ἀντιλογίας — メリバの水のほとりで、わたしはあなたを試みた (δοκιμάζω — «испытывать»; ὕδωρ ἀντιλογίας — «вода пререкания», Исх 17:7). διάψαλμα в конце стиха не передаётся."
  8: "ἄκουσον, λαός μου, καὶ διαμαρτύρομαί σοι — わたしの民よ、聞け。わたしはあなたに証しをする (διαμαρτύρομαι — «торжественно свидетельствовать», как в Пс 49:7). Ισραηλ, ἐὰν ἀκούσῃς μου — イスラエルよ、あなたがわたしの声を聞くなら (условие без аподосиса — продолжение в 13–16)."
  9: "οὐκ ἔσται ἐν σοὶ θεὸς πρόσφατος — あなたのうちに新しい神があってはならない (πρόσφατος — «недавний, новый», т. е. чужой, только что изобретённый). οὐδὲ προσκυνήσεις θεῷ ἀλλοτρίῳ — あなたは異なる神を拝んではならない (ἀλλότριος — «чужой»)."
  10: "ἐγὼ γάρ εἰμι κύριος ὁ θεός σου — わたしは主、あなたの神 (порядок греч. сохранён). ὁ ἀναγαγών σε ἐκ γῆς Αἰγύπτου — あなたをエジプトの地から上らせた者. πλάτυνον τὸ στόμα σου, καὶ πληρώσω αὐτό — あなたの口を広く開け。わたしはそれを満たす (πλατύνω — «расширять»)."
  11: "καὶ οὐκ ἤκουσεν ὁ λαός μου τῆς φωνῆς μου — しかし、わたしの民はわたしの声を聞かなかった. Ισραηλ οὐ προσέσχεν μοι — イスラエルはわたしに耳を傾けなかった (προσέχω — «внимать»)."
  12: "καὶ ἐξαπέστειλα αὐτοὺς κατὰ τὰ ἐπιτηδεύματα τῶν καρδιῶν αὐτῶν — それで、わたしは彼らをその心の望みに任せ (ἐξαποστέλλω — «отпускать»; ἐπιτήδευμα — «склонность, дело»). πορεύσονται ἐν τοῖς ἐπιτηδεύμασιν αὐτῶν — 自分たちの思いのままに歩ませた (повтор ἐπιτήδευμα сохранён)."
  13: "εἰ ὁ λαός μου ἤκουσέν μου — わたしの民がわたしの声を聞き. Ισραηλ ταῖς ὁδοῖς μου εἰ ἐπορεύθη — イスラエルがわたしの道を歩んだなら (εἰ с оптативом-аористом — нереальное условие; аподосис в 14–16)."
  14: "ἐν τῷ μηδενὶ ἂν τοὺς ἐχθροὺς αὐτῶν ἐταπείνωσα — わたしはたちまち彼らの敵を低くし (ἐν τῷ μηδενί — «в ничто, мгновенно»; ταπεινόω — «смирять»). ἐπὶ τοὺς θλίβοντας αὐτοὺς ἐπέβαλον τὴν χεῖρά μου — 彼らを苦しめる者の上に手を置いたであろう (ἐπιβάλλω — «налагать»)."
  15: "οἱ ἐχθροὶ κυρίου ἐψεύσαντο αὐτῷ — 主を憎む者たちは彼らに偽り従い (ψεύδομαι — «лгать», здесь «льстить, притворно покоряться»; слав. «солгаша Ему»; у jp-joc «服事し»). ἔσται ὁ καιρὸς αὐτῶν εἰς τὸν αἰῶνα — 彼らの時はとこしえに続く (καιρός — «время, срок»). Место тёмное; передано по церковному чтению (Синодальный «раболепствовали бы им»)."
  16: "ἐψώμισεν αὐτοὺς ἐκ στέατος πυροῦ — わたしは最も良い小麦で彼らを養い (στέαρ πυροῦ — «тук пшеницы», т. е. лучшее зерно). ἐκ πέτρας μέλι ἐχόρτασεν αὐτούς — 岩から出る蜜で彼らを満ち足らせた (χορτάζω — «насыщать»). Конец речи Бога — 」."
