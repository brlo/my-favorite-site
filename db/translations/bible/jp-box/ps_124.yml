verses:
  0: "登[とう]上[じょう]の歌[うた]。"
  1: "主[しゅ]に寄[よ]り頼[たの]む者[もの]はシオンの山[やま]のようである。エルサレムに住[す]む者[もの]は、とこしえに揺[ゆ]るがない。"
  2: "山[やま]々[やま]がエルサレムを囲[かこ]むように、主[しゅ]はご自分[じぶん]の民[たみ]を、今[いま]からとこしえに至[いた]るまで囲[かこ]まれる。"
  3: "主[しゅ]は悪[わる]い者[もの]の杖[つえ]を、正[ただ]しい者[もの]の受[う]け継[つ]ぎの上[うえ]に置[お]いたままにされない。正[ただ]しい者[もの]が、不法[ふほう]に手[て]を伸[の]べることのないように。"
  4: "主[しゅ]よ、善[よ]い者[もの]と、心[こころ]の直[す]ぐな者[もの]とに、恵[めぐ]みを施[ほどこ]してください。"
  5: "しかし、曲[ま]がった道[みち]へそれる者[もの]を、主[しゅ]は不法[ふほう]を行[おこな]う者[もの]たちとともに連[つ]れて行[ゆ]かれる。イスラエルに平和[へいわ]があるように。"

notes:
  0: "Ὠιδὴ τῶν ἀναβαθμῶν — 登[とう]上[じょう]の歌. Стих 0; в gr-lxx-byz и в ru-базе одинаково; скобками не маркируется."
  1: "Οἱ πεποιθότες ἐπὶ κύριον ὡς ὄρος Σιων — 主に寄り頼む者はシオンの山のようである (πεποίθασιν — perfect от πείθω, «положились и полагаются», ср. 2:12; ὄρος — 山). οὐ σαλευθήσεται εἰς τὸν αἰῶνα ὁ κατοικῶν Ιερουσαλημ — エルサレムに住む者は、とこしえに揺るがない (σαλεύω — «колебать»; κατοικῶν — «живущий», т. е. тот, кто в Сионе/Иерусалиме). Сравнение с горой и утверждение о живущем в Иерусалиме соединены в одном стихе, как в греч."
  2: "ὄρη κύκλῳ αὐτῆς — 山々がエルサレムを囲むように (κύκλῳ — «вокруг»; подразумевается Иерусалим). καὶ κύριος κύκλῳ τοῦ λαοῦ αὐτοῦ — 主はご自分の民を…囲まれる (повтор κύκλῳ сохранён повтором 囲む — параллелизм города и народа). ἀπὸ τοῦ νῦν καὶ ἕως τοῦ αἰῶνος — 今からとこしえに至るまで (та же формула, что 120:8; 130:3)."
  3: "ὅτι οὐκ ἀφήσει τὴν ῥάβδον τῶν ἁμαρτωλῶν ἐπὶ τὸν κλῆρον τῶν δικαίων — 主は悪い者の杖を、正しい者の受け継ぎの上に置いたままにされない (ῥάβδος — «жезл, палка»; κλῆρος — «жребий, удел», передано 受け継ぎ; ἀφίημι — «оставлять»). ὅπως ἂν μὴ ἐκτείνωσιν οἱ δίκαιοι ἐν ἀνομίᾳ χεῖρας αὐτῶν — 正しい者が、不法に手を伸べることのないように (ἐκτείνω — «простирать»; ἀνομία — 不法). Цель выражена ように, как и в греч. ὅπως."
  4: "ἀγάθυνον, κύριε, τοῖς ἀγαθοῖς — 主よ、善い者と…に恵みを施してください (ἀγαθύνω — «благотворить»; τοῖς ἀγαθοῖς — «благим»). καὶ τοῖς εὐθέσι τῇ καρδίᾳ — 心の直ぐな者とに (εὐθύς — «прямой, правый»; датив τῇ καρδίᾳ — «сердцем»)."
  5: "τοὺς δὲ ἐκκλίνοντας εἰς τὰς στραγγαλιάς — 曲がった道へそれる者を (ἐκκλίνω — «уклоняться»; στραγγαλιά — «кривизна, извилина», ед. число в базе). ἀπάξει κύριος μετὰ τῶν ἐργαζομένων τὴν ἀνομίαν — 主は不法を行う者たちとともに連れて行かれる (ἀπάγω — «уводить»; ἐργάζομαι — «делать, совершать»; т. е. на суд вместе с делателями беззакония). εἰρήνη ἐπὶ τὸν Ισραηλ — イスラエルに平和があるように (формула-благопожелание, ср. 127:6; 128:6)."
