verses:
  1: "だから、わたしの愛[あい]する、慕[した]わしい兄弟[きょうだい]たち、わたしの喜[よろこ]び、わたしの冠[かんむり]よ。このように、愛[あい]する者[もの]たちよ、主[しゅ]にあって堅[かた]く立[た]ちなさい。"
  2: "わたしはエボディアに勧[すす]め、シンティケに勧[すす]める。主[しゅ]にあって同[おな]じ思[おも]いを抱[いだ]くように。"
  3: "そうだ、真[しん]の同労[どうろう]者[しゃ]よ、あなたにも頼[たの]む。この二人[ふたり]の婦人[ふじん]を助[たす]けてほしい。彼女[かのじょ]たちは、クレメンスと、そのほかのわたしの同労[どうろう]者[しゃ]たちとともに、福音[ふくいん]のためにわたしと一緒[いっしょ]に戦[たたか]った。その名[な]は命[いのち]の書[しょ]に記[しる]されている。"
  4: "主[しゅ]にあって、いつも喜[よろこ]びなさい。もう一度[いちど]言[い]う。喜[よろこ]びなさい。"
  5: "あなたがたの寛容[かんよう]を、すべての人[ひと]に知[し]らせなさい。主[しゅ]は近[ちか]い。"
  6: "何[なに]も思[おも]い悩[なや]んではならない。むしろ、どんなことでも、祈[いの]りと願[ねが]いによって、感謝[かんしゃ]を添[そ]えて、あなたがたの願[ねが]いを神[かみ]に知[し]らせなさい。"
  7: "そうすれば、すべての理解[りかい]を越[こ]えた神[かみ]の平和[へいわ]が、キリスト・イエスにあって、あなたがたの心[こころ]と考[かんが]えを守[まも]ってくださる。"
  8: "最後[さいご]に、兄弟[きょうだい]たち。真実[しんじつ]なこと、尊[とうと]いこと、正[ただ]しいこと、純潔[じゅんけつ]なこと、愛[あい]すべきこと、評判[ひょうばん]の良[よ]いこと、何[なに]か徳[とく]とされること、何[なに]か称賛[しょうさん]に値[あたい]することがあれば、それらを思[おも]いなさい。"
  9: "あなたがたがわたしから学[まな]び、受[う]け取[と]り、聞[き]き、またわたしのうちに見[み]たことは、それを行[おこな]いなさい。そうすれば、平和[へいわ]の神[かみ]があなたがたとともにいてくださる。"
  10: "わたしは、あなたがたが今[いま]ようやく、わたしへの思[おも]いやりを新[あら]たにしたことを、主[しゅ]にあって大[おお]いに喜[よろこ]んでいる。あなたがたは以前[いぜん]から思[おも]っていたが、その機会[きかい]がなかったのである。"
  11: "わたしがこれを言[い]うのは、乏[とぼ]しさのゆえではない。というのは、わたしは、自分[じぶん]が置[お]かれているどんな状態[じょうたい]でも、それに満足[まんぞく]することを学[まな]んだからである。"
  12: "わたしは、貧[まず]しい暮[く]らしをするすべも、豊[ゆた]かな暮[く]らしをするすべも知[し]っている。満腹[まんぷく]することも、飢[う]えることも、豊[ゆた]かなことも、乏[とぼ]しいことも、どんなことにも慣[な]れている。"
  13: "わたしを強[つよ]くしてくださる〔キリスト〕によって、わたしはすべてのことができる。"
  14: "しかし、あなたがたは、わたしの苦難[くなん]にあずかって、よくしてくれた。"
  15: "フィリピ人[じん]よ、あなたがたも知[し]っているように、福音[ふくいん]の初[はじ]め、わたしがマケドニアを出[で]たとき、与[あた]えることと受[う]けることにおいて、わたしと交[まじ]わりを持[も]った教会[きょうかい]は、あなたがたのほかには一[ひと]つもなかった。"
  16: "あなたがたは、テサロニケにいたときも、一度[いちど]ならず二度[にど]までも、わたしの必要[ひつよう]のために送[おく]ってくれた。"
  17: "わたしがこれを言[い]うのは、贈[おく]り物[もの]を求[もと]めているからではない。むしろ、あなたがたの益[えき]となる実[み]が豊[ゆた]かに実[みの]ることを求[もと]めているのである。"
  18: "わたしはすべてを受[う]け取[と]り、満[み]ち足[た]りている。エパフロディトから、あなたがたの贈[おく]り物[もの]を受[う]けて、満[み]ちあふれている。それは、芳[かんば]しい香[かお]り、受[う]け入[い]れられる、神[かみ]に喜[よろこ]ばれる供[そな]え物[もの]である。"
  19: "わたしの神[かみ]は、その栄光[えいこう]の富[とみ]にしたがって、キリスト・イエスにあって、あなたがたのすべての必要[ひつよう]を満[み]たしてくださる。"
  20: "わたしたちの神[かみ]であり父[ちち]である方[かた]に、栄光[えいこう]が世々[よよ]限[かぎ]りなくありますように。アーメン。"
  21: "キリスト・イエスにある聖徒[せいと]たちすべてに、よろしく伝[つた]えなさい。わたしとともにいる兄弟[きょうだい]たちが、あなたがたによろしくと言[い]っている。"
  22: "聖徒[せいと]たちすべてが、とりわけカエサルの家[いえ]に属[ぞく]する者[もの]たちが、あなたがたによろしくと言[い]っている。"
  23: "主[しゅ]イエス・キリストの{恵[めぐ]み|恩寵[おんちょう]}が、あなたがたすべてとともにありますように。〔アーメン〕。"

notes:
  1: "Ὥστε — だから. ἐπιπόθητοι — 慕わしい. στέφανος — 冠. οὕτως στήκετε ἐν κυρίῳ — このように、主にあって堅く立ちなさい."
  2: "Εὐοδία, Συντύχη — エボディア、シンティケ. παρακαλῶ…παρακαλῶ — 勧め…勧める (повтор сохранён). τὸ αὐτὸ φρονεῖν ἐν κυρίῳ — 主にあって同じ思いを抱く."
  3: "ναὶ ἐρωτῶ καὶ σέ — そうだ、あなたにも頼む. γνήσιε σύζυγε — 真の同労者. συλλαμβάνου — 助けてほしい. συνήθλησάν μοι — わたしと一緒に戦った. Κλήμης — クレメンス. βίβλος ζωῆς — 命の書 (образ, не цитата; ср. Исх 32:32; Пс 69:28), поэтому 「」 не ставятся."
  4: "χαίρετε…πάντοτε — いつも喜びなさい. πάλιν ἐρῶ — もう一度言う."
  5: "ἐπιεικές — 寛容. γνωσθήτω — 知らせなさい. ὁ κύριος ἐγγύς — 主は近い."
  6: "μηδὲν μεριμνᾶτε — 何も思い悩んではならない. ἀλλ᾽ ἐν παντί — むしろ、どんなことでも. προσευχή, δέησις, εὐχαριστία — 祈り、願い、感謝. αἰτήματα — 願い."
  7: "εἰρήνη τοῦ θεοῦ ἡ ὑπερέχουσα πάντα νοῦν — すべての理解を越えた神の平和. φρουρήσει — 守ってくださる. νοήματα — 考え."
  8: "ὅσα ἀληθῆ, σεμνά, δίκαια, ἁγνά, προσφιλῆ, εὔφημα — 真実なこと、尊いこと、正しいこと、純潔なこと、愛すべきこと、評判の良いこと. ἀρετή, ἔπαινος — 徳、称賛. λογίζεσθε — 思いなさい."
  9: "ἃ ἐμάθετε καὶ παρελάβετε — 学び、受け取り. πράσσετε — 行いなさい. ὁ θεὸς τῆς εἰρήνης — 平和の神."
  10: "Ἐχάρην…μεγάλως — 大いに喜んでいる. ἀνεθάλετε — 新たにした. ἐφ᾽ ᾧ καὶ ἐφρονεῖτε ἠκαιρεῖσθε δέ — 以前から思っていたが、機会がなかった."
  11: "οὐχ ὅτι καθ᾽ ὑστέρησιν λέγω — 乏しさのゆえではない. ἔμαθον…αὐτάρκης εἶναι — 満足することを学んだ."
  12: "ταπεινοῦσθαι, περισσεύειν — 貧しい暮らし、豊かな暮らし. μεμύημαι — «посвящён, научен»; 慣れている. χορτάζεσθαι, πεινᾶν — 満腹すること、飢えること."
  13: "πάντα ἰσχύω — すべてのことができる. ἐν τῷ ἐνδυναμοῦντί με — 強くしてくださる方によって. В базе нет Χριστῷ; церковный текст (TR, jp-joc 「イイススハリストス」, Синодальный «Иисусе Христе») добавляет — 〔キリスト〕. Проверено по базе: Χριστῷ — 0."
  14: "συγκοινωνήσαντές μου τῇ θλίψει — 苦難にあずかって."
  15: "Φιλιππήσιοι — フィリピ人. ἐν ἀρχῇ τοῦ εὐαγγελίου — 福音の初め. ἐξῆλθον ἀπὸ Μακεδονίας — マケドニアを出た. εἰς λόγον δόσεως καὶ λήμψεως — 与えることと受けることにおいて. ἐκοινώνησεν — 交わりを持った."
  16: "ἐν Θεσσαλονίκῃ — テサロニケで. ἅπαξ καὶ δίς — 一度ならず二度までも. εἰς τὴν χρείαν — 必要のために."
  17: "ἐπιζητῶ τὸ δόμα — 贈り物を求めている. τὸν καρπὸν τὸν πλεονάζοντα — 豊かに実る実. εἰς λόγον ὑμῶν — あなたがたの益となる."
  18: "ἀπέχω…καὶ περισσεύω — すべてを受け取り、満ち足りている. πεπλήρωμαι — 満ちあふれている. ὀσμὴ εὐωδίας — 芳しい香り. θυσία δεκτή, εὐάρεστος τῷ θεῷ — 神に喜ばれる、受け入れられる供え物."
  19: "πληρώσει πᾶσαν χρείαν — すべての必要を満たしてくださる. κατὰ τὸ πλοῦτος αὐτοῦ ἐν δόξῃ — その栄光の富にしたがって."
  20: "τῷ θεῷ καὶ πατρὶ ἡμῶν — わたしたちの神、また父に. εἰς τοὺς αἰῶνας τῶν αἰώνων — 世々限りなく. ἀμήν в базе есть — アーメン без скобок."
  21: "ἀσπάσασθε — よろしく伝えなさい. πάντα ἅγιον — 聖徒すべて. οἱ σὺν ἐμοὶ ἀδελφοί — わたしとともにいる兄弟たち."
  22: "πάντες οἱ ἅγιοι — 聖徒たちすべて. οἱ ἐκ τῆς Καίσαρος οἰκίας — カエサルの家に属する者たち (Καῖσαρ — カエサル, как в корпусе; не カイサリア)."
  23: "ἡ χάρις τοῦ κυρίου Ἰησοῦ Χριστοῦ — 主イエス・キリストの恵み. В базе μετὰ τοῦ πνεύματος ὑμῶν — «с вашим духом»; церковный текст (jp-joc 「爾等衆と偕に」, Синодальный «со всеми вами») читает μετὰ πάντων ὑμῶν — あなたがたすべてとともに (замена, без скобок). ἀμήν в базе нет; у jp-joc 「アミン」 — 〔アーメン〕 (ср. 1 Кор 16:24). ἡμῶν при κυρίου в базе нет — не добавлено (у jp-joc и Синодального «наш»). Проверено: ἀμήν — 0, πάντων — 0."
