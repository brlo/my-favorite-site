# jp-box, Послание к Филиппийцам, глава 4. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 4: «стойте в Господе» и единодушие (1–3), радость, молитва, мир Божий (4–9),
# довольство и «всё могу» (10–13), благодарность за помощь (14–20), приветствия (21–23).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет, <j>/<mo> не ставятся.
# 〔…〕 два: 4:13 — церковное Χριστῷ (в базе нет, проверено: Χριστῷ — 0); 4:23 — ἀμήν
# (в базе нет; πάντων ὑμῶν вместо τοῦ πνεύματος ὑμῶν — замена, без скобок).
# Цитат Писания в главе нет; 4:3 βίβλος ζωῆς — образ, не цитата, 「」 не ставятся.
# Сносок ⟨…⟩ нет. jp-ni не использовался.

