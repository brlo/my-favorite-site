verses:
  1: "これらは、ヨシュアが、カナンとの戦[たたか]いをすべて知[し]らないイスラエルのすべての者[もの]を、彼[かれ]らによって試[ため]すために残[のこ]した諸国民[しょこくみん]である。"
  2: "ただ、イスラエルの子[こ]らの世代[せだい]に戦[たたか]いを教[おし]えるためであった。彼[かれ]らより前[まえ]の者[もの]たちは、それを知[し]らなかったからである。"
  3: "すなわち、ペリシテ人[じん]の五[いつ]つの太守[たいしゅ]領[りょう]、すべてのカナン人[じん]、シドン人[じん]、レバノンに住[す]むヒビ人[じん]で、バアル・ヘルモンの山[やま]からレボ・ハマトの入口[いりぐち]までに及[およ]ぶ者[もの]たちである。"
  4: "これは、イスラエルを彼[かれ]らによって試[ため]し、彼[かれ]らが、主[しゅ]がモーセの手[て]によって父祖[ふそ]たちに命[めい]じた主[しゅ]の戒[いまし]めに聞[き]き従[したが]うかどうかを知[し]るためであった。"
  5: "イスラエルの子[こ]らは、カナン人[じん]、ヘテ人[じん]、アモリ人[じん]、ペリジ人[じん]、ヒビ人[じん]、エブス人[じん]のただ中[なか]に住[す]んだ。"
  6: "彼[かれ]らは彼[かれ]らの娘[むすめ]たちを自分[じぶん]たちの妻[つま]に迎[むか]え、自分[じぶん]たちの娘[むすめ]たちを彼[かれ]らの息子[むすこ]たちに与[あた]え、彼[かれ]らの神[かみ]々[がみ]に仕[つか]えた。"
  7: "イスラエルの子[こ]らは主[しゅ]の目[め]に悪[あく]を行[おこな]い、自分[じぶん]たちの神[かみ]である主[しゅ]を忘[わす]れて、バアル神[がみ]々[がみ]と聖[せい]なる木立[こだち]に仕[つか]えた。"
  8: "主[しゅ]はイスラエルに激[はげ]しく怒[いか]り、彼[かれ]らをメソポタミアの王[おう]フサルサトムの手[て]に売[う]り渡[わた]された。彼[かれ]らは八[はち]年[ねん]の間[あいだ]、彼[かれ]に仕[つか]えた。"
  9: "イスラエルの子[こ]らが主[しゅ]に向[む]かって叫[さけ]ぶと、主[しゅ]はイスラエルに救[すく]い手[て]を起[お]こし、彼[かれ]らを救[すく]われた。すなわち、ケネズの子[こ]で、カレブの弟[おとうと]であるオトニエルである。主[しゅ]は彼[かれ]に耳[みみ]を傾[かたむ]けられた。"
  10: "主[しゅ]の霊[れい]が彼[かれ]の上[うえ]に下[くだ]り、彼[かれ]はイスラエルを裁[さば]き、戦[たたか]いに出[で]た。主[しゅ]はシリアの王[おう]フサルサトムを彼[かれ]の手[て]に渡[わた]されたので、彼[かれ]の手[て]はフサルサトムに対[たい]して強[つよ]くなった。"
  11: "地[ち]は五十[ごじゅう]年[ねん]の間[あいだ]平穏[へいおん]であった。そしてケネズの子[こ]オトニエルは死[し]んだ。"
  12: "イスラエルの子[こ]らは再[ふたた]び主[しゅ]の目[め]に悪[あく]を行[おこな]った。主[しゅ]は、彼[かれ]らが主[しゅ]の目[め]に悪[あく]を行[おこな]ったため、モアブの王[おう]エグロンをイスラエルに対[たい]して強[つよ]くされた。"
  13: "彼[かれ]はアンモン人[じん]とアマレク人[じん]のすべての子[こ]らを自分[じぶん]のもとに集[あつ]め、行[い]ってイスラエルを打[う]ち、なつめやしの町[まち]を手[て]に入[い]れた。"
  14: "イスラエルの子[こ]らはモアブの王[おう]エグロンに十八[じゅうはち]年[ねん]の間[あいだ]仕[つか]えた。"
  15: "イスラエルの子[こ]らが主[しゅ]に向[む]かって叫[さけ]ぶと、主[しゅ]は彼[かれ]らのために救[すく]い手[て]を起[お]こされた。すなわち、イエメニの子[こ]ゲラの子[こ]エフドである。彼[かれ]は両手[りょうて]利[き]きの者[もの]であった。イスラエルの子[こ]らは彼[かれ]の手[て]によって、モアブの王[おう]エグロンに贈[おく]り物[もの]を送[おく]った。"
  16: "エフドは自分[じぶん]のために、長[なが]さ一[いっ]スパンの両刃[りょうば]の剣[つるぎ]を作[つく]り、それを外套[がいとう]の下[した]、右[みぎ]のももに帯[お]びた。"
  17: "彼[かれ]はモアブの王[おう]エグロンに贈[おく]り物[もの]を差[さ]し出[だ]した。エグロンは非常[ひじょう]に立派[りっぱ]な体格[たいかく]の男[おとこ]であった。"
  18: "エフドが贈[おく]り物[もの]を差[さ]し出[だ]し終[お]えると、彼[かれ]は贈[おく]り物[もの]を運[はこ]ぶ者[もの]たちを帰[かえ]らせた。"
  19: "エグロンはギルガルのそばの彫像[ちょうぞう]のところから引[ひ]き返[かえ]した。エフドは言[い]った。「王[おう]よ、あなたに内密[ないみつ]の話[はなし]があります。」エグロンはすべての者[もの]に言[い]った。「下[さ]がれ。」すると、彼[かれ]に仕[つか]えていた者[もの]たちはすべて彼[かれ]のもとから出[で]て行[い]った。"
  20: "エフドは彼[かれ]のところへ入[はい]って行[い]った。彼[かれ]はひとり、自分[じぶん]の涼[すず]しい屋上[おくじょう]の部屋[へや]に座[すわ]っていた。エフドは言[い]った。「王[おう]よ、あなたに神[かみ]の言葉[ことば]があります。」エグロンは彼[かれ]のそばに立[た]つため、王座[おうざ]から立[た]ち上[あ]がった。"
  21: "エフドは彼[かれ]が立[た]ち上[あ]がると同時[どうじ]に、左[ひだり]の手[て]を伸[の]ばして右[みぎ]のももから剣[つるぎ]を取[と]り、それをエグロンの腹[はら]に突[つ]き刺[さ]した。"
  22: "柄[つか]まで刃[は]の後[うし]ろに押[お]し入[い]れ、脂[あぶら]が刃[は]の上[うえ]を覆[おお]った。彼[かれ]はその剣[つるぎ]を腹[はら]から抜[ぬ]かなかったからである。"
  23: "エフドは前室[まえしつ]へ出[で]て、屋上[おくじょう]の部屋[へや]の戸[と]を彼[かれ]の後[うし]ろで閉[と]じ、かんぬきをかけた。"
  24: "エフドは出[で]て行[い]った。エグロンの僕[しもべ]たちが来[き]て見[み]ると、屋上[おくじょう]の部屋[へや]の戸[と]は閉[と]ざされていた。彼[かれ]らは言[い]った。「きっと彼[かれ]は寝室[しんしつ]の奥[おく]の便所[べんじょ]に座[すわ]っているのだ。」"
  25: "彼[かれ]らは恥[は]ずかしくなるまで待[ま]ち続[つづ]けたが、屋上[おくじょう]の部屋[へや]の戸[と]を開[あ]ける者[もの]はなかった。そこで鍵[かぎ]を取[と]って開[あ]けると、彼[かれ]らの主[あるじ]は地[ち]に倒[たお]れて死[し]んでいた。"
  26: "エフドは、彼[かれ]らが騒[さわ]いでいる間[あいだ]に逃[に]げ延[の]び、彼[かれ]に気[き]づく者[もの]もなかった。彼[かれ]は彫像[ちょうぞう]のそばを通[とお]り過[す]ぎて、セイラトへ逃[に]げ延[の]びた。"
  27: "彼[かれ]が着[つ]くと、エフライムの山地[さんち]で角笛[つのぶえ]を吹[ふ]き鳴[な]らした。イスラエルの子[こ]らは彼[かれ]とともに下[くだ]り、彼[かれ]は彼[かれ]らの前[まえ]を進[すす]んだ。"
  28: "彼[かれ]は彼[かれ]らに言[い]った。「わたしの後[あと]に従[したが]って下[くだ]れ。あなたがたの神[かみ]である主[しゅ]は、あなたがたの敵[てき]、モアブをあなたがたの手[て]に渡[わた]された。」彼[かれ]らは彼[かれ]の後[あと]に従[したが]って下[くだ]り、モアブへ渡[わた]るヨルダン川[がわ]の渡[わた]し場[ば]を先[さき]に押[お]さえ、ひとりも渡[わた]らせなかった。"
  29: "彼[かれ]らはそのとき、モアブを打[う]ち、およそ一万人[いちまんにん]の者[もの]たち、すなわち、そのうちのすべでの戦[たたか]い人[びと]とすべでの力[ちから]ある者[もの]を倒[たお]した。ひとりも逃[に]げ延[の]びなかった。"
  30: "その日[ひ]、モアブはイスラエルの手[て]の下[もと]に服[ふく]した。地[ち]は八十[はちじゅう]年[ねん]の間[あいだ]平穏[へいおん]であった。エフドは死[し]ぬまで彼[かれ]らを裁[さば]いた。"
  31: "この後[のち]、アナトの子[こ]サメガルが起[お]こり、牛[うし]を追[お]う突[つ]き棒[ぼう]でペリシテ人[じん]六百人[ろっぴゃくにん]を打[う]って、彼[かれ]もまたイスラエルを救[すく]った。"

notes:
  1: "ταῦτα τὰ ἔθνη ἀφῆκεν Ἰησοῦς — «эти народы оставил Иисус»; слав. читает «остави Господь» (иное чтение). ὥστε πειράσαι — «чтобы испытать». πάντας τοὺς μὴ ἐγνωκότας πάντας τοὺς πολέμους Χανααν — «всех не знавших всех войн Ханаана» (двойное πάντας, как в греч.)."
  2: "πλὴν... πλὴν — «только... именно»: второе уточняет, о каких поколениях речь. τοῦ διδάξαι — «чтобы научить». οἱ ἔμπροσθεν αὐτῶν — «бывшие прежде них»."
  3: "σατραπείαι — «сатрапии, области» (слав. «воеводства»). ἀλλόφυλοι — ペリシテ人. Σιδώνιοι — сидоняне. Λίβανος — Ливан. Βαλαερμων — Ваал-Ермон. Λοβωημαθ — Лаво-Емаф (вход в Емаф; слав. «лавоемаф»)."
  4: "γνῶναι εἰ ἀκούσονται — «узнать, послушают ли». ἐν χειρὶ Μωυσῆ — «рукою Моисея». ἐντολαί — «заповеди», 戒め."
  5: "κατῴκησαν ἐν μέσῳ — «жили среди». Перечислены шесть народов; слав. добавляет «гергесеа» (в греч. нет)."
  6: "ἔλαβον... εἰς γυναῖκας — «взяли в жёны». ἔδωκαν τοῖς υἱοῖς — «отдали сынам». ἐλάτρευσαν — «служили»."
  7: "ἐπελάθοντο — «забыли» (ἐπιλανθάνομαι + род.). τοῖς ἄλσεσιν — «священным рощам» (ἄλσος, 聖なる木立); ru «Астартам» (МТ)."
  8: "Χουσαρσαθωμ — Хусарсафем (слав.), в тексте フサルサトム. Συρίας ποταμῶν — «Сирии рек», т. е. Месопотамии (слав. «месопотамии сирския»). ἀπέδοτο — «продал». ὀκτὼ ἔτη — «восемь лет»."
  9: "ἐκέκραξαν — «возопили». σωτῆρα — «спасителя», 救い手. ἀδελφὸν Χαλεβ τὸν νεώτερον — «младшего брата Халева» (см. 1:13). εἰσήκουσεν αὐτοῦ — «услышал его»; в слав. опущено."
  10: "ἐγένετο ἐπ' αὐτὸν πνεῦμα κυρίου — «был на нём Дух Господень» (слав. «бысть на нем»). ἔκρινεν — «судил». ἐκραταιώθη — «укрепилась» (κραταιόω). βασιλέα Συρίας — здесь просто «царя Сирии» (ср. 3:8 «Сирии рек»)."
  11: "ἡσύχασεν ἡ γῆ — «покоилась земля». ἔτη πεντήκοντα — «пятьдесят лет»; слав. читает «четыредесять лет» (иное чтение)."
  12: "προσέθεντο... ποιῆσαι — «приложили (снова) делать». ἐνίσχυσεν κύριος τὸν Εγλωμ — «укрепил Господь Еглона» (Бог делает его сильным в наказание)."
  13: "προσήγαγεν — «собрал к себе» (προσάγω). υἱοὺς Αμμων καὶ Αμαληκ — аммонитян и амаликитян. πόλις τῶν φοινίκων — «город пальм»."
  14: "ἔτη δέκα ὀκτώ — «восемнадцать лет»."
  15: "ἄνδρα ἀμφοτεροδέξιον — «мужа, владеющего обеими руками» (ἀμφοτεροδέξιος); слав. «ободесноручна», ru «левша»; в тексте 両手利き. υἱὸν Γηρα υἱοῦ τοῦ Ιεμενι — «сына Геры, сына Иемения» (слав. «сына гираня, сына иемениина»). δῶρα — «дары, дань»."
  16: "μάχαιραν δίστομον — «меч обоюдоострый». σπιθαμῆς τὸ μῆκος — «длиною в пядь» (σπιθαμή). περιεζώσατο — «опоясался». μανδύας — «плащ, верхняя одежда» (слав. «риза»)."
  17: "ἀστεῖος σφόδρα — «очень видный, статный» (ἀστεῖος); слав. «добротелесен», ru «очень тучный» (МТ); ср. 3:22 τὸ στέαρ «жир». LXX понял иначе, чем масоретский текст."
  18: "συνετέλεσεν — «закончил». τοὺς αἴροντας τὰ δῶρα — «несущих дары»."
  19: "ἀνέστρεψεν ἀπὸ τῶν γλυπτῶν μετὰ τῆς Γαλγαλ — «возвратился от идолов, что при Галгале». Λόγος μοι κρύφιος — «есть у меня тайное слово». Ἐκ μέσου — «выйдите вон» (слав. «молчи» — иное понимание)."
  20: "ὑπερῷον θερινόν — «летняя (прохладная) горница», 涼しい屋上の部屋. μονώτατος — «совершенно один». Λόγος θεοῦ — «слово Божие». ἐξανέστη ἀπὸ τοῦ θρόνου — «встал с престола»."
  21: "ἅμα τοῦ ἀναστῆναι — «вместе с тем как встать», т. е. как только он встал. ἐνέπηξεν — «вонзил» (πήγνυμι). κοιλία — «чрево, живот»."
  22: "ἐπεισήνεγκεν — «вдвинул (вместе)». λαβή — «рукоять». φλόξ — «пламя», здесь «лезвие». στέαρ — «жир, тук». οὐκ ἐξέσπασεν — «не вырвал, не извлёк». Слав. добавляет «и изыде лайно» (в греч. нет)."
  23: "προστάς — «притвор, передняя». ἐσφήνωσεν — «заклинил, запер» (σφηνόω)."
  24: "οἱ παῖδες — «слуги». δίφρος — «кресло, стульчак». ἀποχώρησις τοῦ κοιτῶνος — «отхожее место спальни»; слав. «потреба... во отлучении ложа»."
  25: "προσέμειναν αἰσχυνόμενοι — «ждали, стыдясь» (слав. «дондеже посрамишася»). κλείς — «ключ». πεπτωκώς... τεθνηκώς — «упавший... умерший»."
  26: "διεσώθη — «спасся» (διασώζω). ἕως ἐθορυβοῦντο — «пока они были в смятении». ὁ προσνοῶν — «тот, кто замечал/думал о нём». Σειρωθα — Сеираф."
  27: "ἐσάλπισεν κερατίνῃ — «вострубил рогом» (κερατίνη — рог). ἔμπροσθεν αὐτῶν — «впереди них»."
  28: "Καταβαίνετε ὀπίσω μου — «сходите за мною». παρέδωκεν... ἐν χειρὶ ὑμῶν — «предал в руки ваши». διαβάσεις τοῦ Ιορδάνου τῆς Μωαβ — «переправы Иордана Моава». προκατελάβοντο — «захватили прежде»."
  29: "ὡσεὶ δέκα χιλιάδας — «около десяти тысяч». μαχητάς — «воинов». ἄνδρα δυνάμεως — «мужа силы». οὐ διεσώθη ἀνήρ — «не спасся ни один»."
  30: "ἐνετράπη — «был посрамлён, покорён» (ἐντρέπω). ἡσύχασεν ἡ γῆ — «покоилась земля». ἔκρινεν ἕως οὗ ἀπέθανεν — «судил, доколе не умер»."
  31: "Σαμεγαρ υἱὸς Αναθ — Самегар, сын Анафов. ἐκτὸς μόσχων τῶν βοῶν — букв. «кроме телят воловьих»: тёмное место, вероятно передаёт евр. מַלְמַד הַבָּקָר «воловье рожно/стрекало»; слав. «ралом воловым», ru «воловьим рожном»; переведено по смыслу (突き棒). ἑξακοσίους — «шестьсот»."
