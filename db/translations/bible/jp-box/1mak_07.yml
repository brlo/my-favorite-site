verses:
  1: "第[だい]百五十一[ひゃくごじゅういち]年[ねん]、セレウコスの子[こ]デメトリオスがローマから出[で]て、少[すく]ない者[もの]たちとともに海辺[うみべ]の町[まち]へ上[のぼ]り、そこで王[おう]となった。"
  2: "彼が父[ちち]たちの王国[おうこく]の家[いえ]に入[はい]ろうとしているとき、軍勢[ぐんぜい]がアンティオコスとリュシアスを捕[と]らえ、彼[かれ]のもとへ連[つ]れて来[こ]ようとした。"
  3: "そのことが彼に知[し]らされると、彼は言[い]った。「彼らの顔[かお]をわたしに見[み]せるな。」"
  4: "軍勢[ぐんぜい]が彼らを殺[ころ]すと、デメトリオスは自分[じぶん]の王国[おうこく]の王座[おうざ]に座[すわ]った。"
  5: "そのとき、イスラエルから不法[ふほう]な者[もの]、不敬[ふけい]な者[もの]たちが皆[みな]彼のもとへ来[き]た。その先頭[せんとう]に立[た]っていたのはアルキモスで、祭司[さいし]の務[つと]めを望[のぞ]んでいた。"
  6: "彼らは王[おう]の前[まえ]で民[たみ]を訴[うった]えて言[い]った。「ユダとその兄弟[きょうだい]たちは、あなたの友[とも]を皆[みな]滅[ほろ]ぼし、わたしたちを自分[じぶん]たちの地[ち]から追[お]い出[だ]した。"
  7: "今[いま]、あなたが信[しん]頼[らい]する人[ひと]を遣[つか]わし、彼[かれ]に行[い]かせて、わたしたちと王[おう]の国[くに]に対して行[おこな]われたすべての破壊[はかい]を見[み]せ、彼[かれ]と彼[かれ]を助[たす]けるすべての者[もの]を罰[ばっ]させてほしい。」"
  8: "王[おう]は王[おう]の友[とも]の一人[ひとり]であるバッキデスを選[えら]んだ。彼は川[かわ]の向[む]こう側[がわ]を治[おさ]め、王国[おうこく]の中[なか]で大[おお]きな者[もの]であり、王[おう]に忠実[ちゅうじつ]であった。"
  9: "王[おう]は彼と不敬[ふけい]なアルキモスを遣[つか]わし、彼に祭司[さいし]職[しょく]を定[さだ]めて、イスラエルの子[こ]らに復讐[ふくしゅう]を果[は]たすように命[めい]じた。"
  10: "彼らは出発[しゅっぱつ]して大[おお]きな軍勢[ぐんぜい]とともにユダの地[ち]へ来[き]た。バッキデスは偽[いつわ]りをもって平和[へいわ]の言葉[ことば]を携[たずさ]え、使者[ししゃ]をユダとその兄弟[きょうだい]たちへ遣[つか]わした。"
  11: "しかし彼らはその言葉[ことば]に耳[みみ]を貸[か]さなかった。彼らが大[おお]きな軍勢[ぐんぜい]とともに来[き]たのを見[み]たからである。"
  12: "アルキモスとバッキデスのもとには、正[ただ]しいことを求[もと]める書記[しょき]たちの集[あつ]まりができた。"
  13: "イスラエルの子[こ]らのうち、まずハシディムが彼らに和[わ]を求[もと]めた。"
  14: "彼らは言[い]ったからである。「アロンの血筋[ちすじ]の祭司[さいし]が軍勢[ぐんぜい]とともに来[き]た。彼はわたしたちを害[がい]さない。」"
  15: "彼は彼らと平和[へいわ]の言葉[ことば]を語[かた]り、彼らに誓[ちか]って言[い]った。「わたしたちはあなたがたにも、あなたがたの友[とも]にも災[わざわ]いを求[もと]めない。」"
  16: "彼らは彼を信[しん]じた。しかし彼は彼らの中[なか]から六十[ろくじゅう]人[にん]を捕[と]らえ、書[か]かれているとおりに、一日[いちにち]のうちに彼らを殺[ころ]した。"
  17: "「あなたの聖[せい]なる者[もの]の肉[にく]と彼らの血[ち]を、彼らはエルサレムの周[まわ]りに注[そそ]ぎ出[だ]した。しかも、彼らを葬[ほうむ]る者[もの]はなかった。」"
  18: "彼らへの恐[おそ]れと震[ふる]えが民[たみ]全体[ぜんたい]に襲[おそ]いかかり、人[ひと]々[びと]は言[い]った。「彼らの中[なか]には真実[しんじつ]も裁[さば]きもない。彼らは約束[やくそく]と、自分[じぶん]たちが誓[ちか]った誓[ちか]いを破[やぶ]ったのだ。」"
  19: "バッキデスはエルサレムを去[さ]ってベテザイトに陣[じん]を敷[し]き、人[ひと]を遣[つか]わして、自分[じぶん]から離反[りはん]した者[もの]たちと民[たみ]のうち幾人[いくにん]かを捕[と]らえ、大[おお]きな井戸[いど]の中[なか]で彼らを殺[ころ]した。"
  20: "彼はその地方[ちほう]をアルキモスに任[まか]せ、彼を助[たす]ける軍勢[ぐんぜい]を残[のこ]して、バッキデスは王[おう]のもとへ帰[かえ]った。"
  21: "アルキモスは大祭司[だいさいし]の位[くらい]をめぐって争[あらそ]った。"
  22: "自分[じぶん]たちの民[たみ]を乱[みだ]す者[もの]たちが皆[みな]彼のもとに集[あつ]まり、ユダの地[ち]を支配[しはい]して、イスラエルに大[おお]きな打撃[だげき]を与[あた]えた。"
  23: "ユダは、アルキモスとその仲間[なかま]たちがイスラエルの子[こ]らに、異邦人[いほうじん]以上[いじょう]の悪[あく]を行[おこな]ったのを見[み]た。"
  24: "彼はユダヤの全[ぜん]領土[りょうど]を周[まわ]りから巡[めぐ]って、離反[りはん]した者[もの]たちに復讐[ふくしゅう]を果[は]たし、彼らはもはやこの地[ち]へ出[で]て来[こ]なくなった。"
  25: "アルキモスは、ユダとその仲間[なかま]たちが強[つよ]くなったのを見[み]、自分[じぶん]が彼らに立[た]ち向[む]かえないことを知[し]って、王[おう]のもとへ帰[かえ]り、彼らを悪[わる]く訴[うった]えた。"
  26: "王[おう]は自分[じぶん]の高名[こうめい]な長[おさ]たちの一人[ひとり]であるニカノルを遣[つか]わした。彼はイスラエルを憎[にく]み、敵[てき]とする者[もの]であった。王[おう]は彼に、この民[たみ]を根[ね]こそぎ除[のぞ]くように命[めい]じた。"
  27: "ニカノルは大[おお]きな軍勢[ぐんぜい]とともにエルサレムへ来[き]て、偽[いつわ]りをもって平和[へいわ]の言葉[ことば]を携[たずさ]え、ユダとその兄弟[きょうだい]たちへ使者[ししゃ]を遣[つか]わして言[い]った。"
  28: "「わたしとあなたがたの間[あいだ]に争[あらそ]いがあってはならない。わたしは少[すく]ない者[もの]たちとともに来[き]て、平和[へいわ]のうちにあなたがたの顔[かお]を見[み]たい。」"
  29: "彼はユダのもとへ来[き]、互[たがい]に平和[へいわ]に挨拶[あいさつ]した。しかし、敵[てき]の者[もの]たちはユダをさらおうと待[ま]ち構[かま]えていた。"
  30: "ユダには、彼が自分[じぶん]を欺[あざむ]こうとして来[き]たことが知[し]らされ、彼を恐[おそ]れて、もはや彼の顔[かお]を見[み]ようとしなかった。"
  31: "ニカノルは自分[じぶん]の計[はかり]ごとが露見[ろけん]したのを知[し]り、ハファルサラマで戦[たたか]いをもってユダを迎[むか]えた。"
  32: "ニカノルの側[がわ]から五百[ごひゃく]人[にん]ほどが倒[たお]れ、残[のこ]った者[もの]たちはダビデの町[まち]へ逃[に]げた。"
  33: "これらのことの後[のち]、ニカノルはシオンの山[やま]に上[のぼ]った。祭司[さいし]たちと民[たみ]の長老[ちょうろう]たちのうち幾人[いくにん]かが聖所[せいしょ]から出[で]て、彼に平和[へいわ]に挨拶[あいさつ]し、王[おう]のためにささげられる燔祭[はんさい]を見[み]せようとした。"
  34: "しかし彼は彼らを鼻[はな]で笑[わら]い、嘲笑[ちょうしょう]し、汚[けが]して、傲慢[ごうまん]に語[かた]った。"
  35: "そして怒[いか]りをもって誓[ちか]って言[い]った。「もし今[いま]、ユダとその陣[じん]がわたしの手[て]に渡[わた]されなければ、わたしが平和[へいわ]のうちに帰[かえ]ったとき、この家[いえ]を焼[や]き払[はら]おう。」そして大[おお]きな怒[いか]りとともに去[さ]った。"
  36: "祭司[さいし]たちは入[はい]って祭壇[さいだん]と神殿[しんでん]の前[まえ]に立[た]ち、泣[な]いて言[い]った。"
  37: "「あなたはこの家[いえ]を選[えら]び、御名[みな]がその上[うえ]に呼[よ]ばれ、あなたの民[たみ]のための祈[いの]りと願[ねが]いの家[いえ]となるようにされた。"
  38: "この人[ひと]とその陣[じん]に復讐[ふくしゅう]を果[は]たし、彼らを剣[つるぎ]にかからせてほしい。彼らの冒瀆[ぼうとく]を思[おも]い起[おこ]し、彼らに住[す]みかを与[あた]えないでほしい。」"
  39: "ニカノルはエルサレムを出[で]てベテ・ホロンに陣[じん]を敷[し]き、そこへシリアの軍勢[ぐんぜい]が彼に加[くわ]わった。"
  40: "ユダは三千[さんぜん]の者[もの]とともにアダサに陣[じん]を敷[し]き、祈[いの]って言[い]った。"
  41: "「王[おう]から遣[つか]わされた者[もの]たちがあなたを冒瀆[ぼうとく]したとき、あなたの天使[てんし]が出[で]て、そのうち十八万五千[じゅうはちまんごせん]を打[う]った。"
  42: "どうか今[いま]、この陣[じん]をわたしたちの前[まえ]で砕[くだ]いてほしい。残[のこ]った者[もの]たちが、あなたの聖[せい]なるものに対して悪[わる]く語[かた]ったことを知[し]るように。そして彼をその悪[あく]に従[したが]って裁[さば]いてほしい。」"
  43: "陣[じん]はアダルの月[つき]の十三[じゅうさん]日[にち]に戦[たたか]いに入[はい]り、ニカノルの陣[じん]は砕[くだ]かれ、彼自身[じしん]が真[ま]っ先[さき]に戦[たたか]いで倒[たお]れた。"
  44: "彼の陣[じん]はニカノルが倒[たお]れたのを見[み]ると、武器[ぶき]を投[な]げ捨[す]てて逃[に]げた。"
  45: "彼らはアダサからガジラに着[つ]くまで一日[いちにち]の道[みち]を追[お]い、彼らの後[うし]ろで合図[あいず]のラッパを吹[ふ]いた。"
  46: "ユダヤの周[まわ]りのすべての村[むら]からも人[ひと]々[びと]が出[で]て彼らを包囲[ほうい]した。彼らは追[お]う者[もの]たちの方[ほう]へ向[む]きを返[かえ]し、皆[みな]剣[つるぎ]にかかって倒[たお]れ、彼らのうち一人[ひとり]も残[のこ]らなかった。"
  47: "彼らは戦利品[せんりひん]と略奪品[りゃくだつひん]を取[と]り、ニカノルの頭[あたま]と、彼が傲慢[ごうまん]にも伸[の]ばした右[みぎ]の手[て]を切[き]り取[と]って、エルサレムのそばに持[も]って来[き]てさらした。"
  48: "民[たみ]は大[おお]いに喜[よろこ]び、その日[ひ]を大[おお]きな喜[よろこ]びの日[ひ]とした。"
  49: "彼らは毎年[まいとし]、アダルの月[つき]の十三[じゅうさん]日[にち]にこの日[ひ]を祝[いわ]うことに定[さだ]めた。"
  50: "ユダの地[ち]は少[すこ]しの日[ひ]の間[あいだ]、静[しず]まった。"

notes:
  1: "Ἔτους ἑνὸς καὶ πεντηκοστοῦ καὶ ἑκατοστοῦ — «года сто пятьдесят первого» (151 г.); ἐξῆλθεν Δημήτριος ὁ τοῦ Σελεύκου ἐκ Ῥώμης — «вышел Димитрий, сын Селевка, из Рима» (デメトリオス, セレウコス); πόλιν παραθαλασσίαν — «город приморский»; ἐβασίλευσεν ἐκεῖ — «воцарился там»."
  2: "εἰσεπορεύετο εἰς οἶκον βασιλείας πατέρων αὐτοῦ — «входил в дом царства отцов своих»; συνέλαβον αἱ δυνάμεις τὸν Ἀντίοχον καὶ τὸν Λυσίαν — «схватили войска Антиоха и Лисия» (συλλαμβάνω); ἀγαγεῖν αὐτοὺς αὐτῷ — «привести их к нему»."
  3: "ἐγνώσθη αὐτῷ τὸ πρᾶγμα — «стало известно ему дело»; Μή μοι δείξητε τὰ πρόσωπα αὐτῶν — «не показывайте мне лиц их» (δείκνυμι). Слова Димитрия — 「…」."
  4: "ἀπέκτειναν αὐτοὺς αἱ δυνάμεις — «умертвили их войска»; ἐκάθισεν… ἐπὶ θρόνου βασιλείας αὐτοῦ — «воссел… на престоле царства своего» (θρόνος — 王座[おうざ])."
  5: "πάντες ἄνδρες ἄνομοι καὶ ἀσεβεῖς — «все мужи беззаконные и нечестивые»; Ἄλκιμος ἡγεῖτο αὐτῶν — «Алким предводительствовал ими» (アルキモス); βουλόμενος ἱερατεύειν — «желая священствовать» (ἱερατεύω)."
  6: "κατηγόρησαν τοῦ λαοῦ πρὸς τὸν βασιλέα — «обвинили народ пред царём» (κατηγορέω); Ἀπώλεσεν Ιουδας… πάντας τοὺς φίλους σου — «погубил Иуда… всех друзей твоих»; ἡμᾶς ἐσκόρπισεν ἀπὸ τῆς γῆς ἡμῶν — «нас рассеял из земли нашей» (σκορπίζω)."
  7: "ἀπόστειλον ἄνδρα, ᾧ πιστεύεις — «пошли мужа, которому веришь»; ἰδέτω τὴν ἐξολέθρευσιν πᾶσαν — «пусть увидит всё истребление» (ἐξολέθρευσις); κολασάτω αὐτούς — «пусть накажет их» (κολάζω); τοὺς ἐπιβοηθοῦντας — «помогающих» (ἐπιβοηθέω)."
  8: "ἐπέλεξεν… τὸν Βακχίδην — «избрал Вакхида» (バッキデス); κυριεύοντα ἐν τῷ πέραν τοῦ ποταμοῦ — «владеющего по ту сторону реки» (περάν); μέγαν ἐν τῇ βασιλείᾳ — «великого в царстве»; πιστὸν τῷ βασιλεῖ — «верного царю»."
  9: "ἀπέστειλεν αὐτὸν καὶ Ἄλκιμον τὸν ἀσεβῆ — «послал его и Алкима нечестивого»; ἔστησεν αὐτῷ τὴν ἱερωσύνην — «поставил ему священство» (ἵστημι); ποιῆσαι τὴν ἐκδίκησιν ἐν τοῖς υἱοῖς Ισραηλ — «сотворить отмщение в сынах Израиля»."
  10: "ἀπῇρον καὶ ἦλθον μετὰ δυνάμεως πολλῆς — «отправились и пришли с силою великою»; ἀπέστειλεν ἀγγέλους — «послал вестников»; λόγοις εἰρηνικοῖς μετὰ δόλου — «со словами мирными с коварством» (δόλος — 偽[いつわ]り)."
  11: "οὐ προσέσχον τοῖς λόγοις αὐτῶν — «не вняли словам их» (προσέχω); εἶδον γὰρ ὅτι ἦλθαν μετὰ δυνάμεως πολλῆς — «ибо увидели, что пришли с силою великою»."
  12: "ἐπισυνήχθησαν… συναγωγὴ γραμματέων — «собралось… собрание книжников» (γραμματεύς — 書記[しょき]); ἐκζητῆσαι δίκαια — «искать правды (справедливости)» (ἐκζητέω)."
  13: "πρῶτοι οἱ Ασιδαῖοι ἦσαν ἐν υἱοῖς Ισραηλ — «первыми Асидеи были в сынах Израиля» (ハシディム); ἐπεζήτουν παρ' αὐτῶν εἰρήνην — «искали у них мира»."
  14: "Ἄνθρωπος ἱερεὺς ἐκ σπέρματος Ααρων — «человек священник из семени Аарона» (アロン); ἦλθεν ἐν ταῖς δυνάμεσιν — «пришёл в силах (с войском)»; οὐκ ἀδικήσει ἡμᾶς — «не обидит нас» (ἀδικέω). Слова Асидеев — 「…」."
  15: "ἐλάλησεν μετ' αὐτῶν λόγους εἰρηνικούς — «говорил с ними слова мирные»; ὤμοσεν αὐτοῖς — «поклялся им» (ὀμνύω); Οὐκ ἐκζητήσομεν ὑμῖν κακόν — «не взыщем вам зла»; τοῖς φίλοις ὑμῶν — «друзьям вашим». Слав. добавляет в конце «и вероваша ему» — в LXX это начало 16-го, отмечено."
  16: "ἐνεπίστευσαν αὐτῷ — «поверили ему» (ἐμπιστεύω); συνέλαβεν ἐξ αὐτῶν ἑξήκοντα ἄνδρας — «взял из них шестьдесят мужей»; ἀπέκτεινεν αὐτοὺς ἐν ἡμέρᾳ μιᾷ — «умертвил их в один день»; κατὰ τὸν λόγον, ὃν ἔγραψεν — «по слову, которое написал» (Пс 78:2–3)."
  17: "Σάρκας ὁσίων σου — «плоти святых Твоих» (ὅσιος — 聖[せい]なる者[もの]); αἷμα αὐτῶν ἐξέχεαν — «кровь их пролили» (ἐκχέω); κύκλῳ Ιερουσαλημ — «вокруг Иерусалима»; οὐκ ἦν αὐτοῖς ὁ θάπτων — «не было им погребающего» (θάπτω). Цитата Пс 78:2–3 — 「…」."
  18: "ἐπέπεσεν αὐτῶν ὁ φόβος καὶ ὁ τρόμος — «напал от них страх и трепет» (τρόμος); εἰς πάντα τὸν λαόν — «на весь народ»; Οὐκ ἔστιν ἐν αὐτοῖς ἀλήθεια καὶ κρίσις — «нет в них истины и суда»; παρέβησαν τὴν στάσιν καὶ τὸν ὅρκον — «преступили договор и клятву» (στάσις здесь — соглашение; ὅρκος — 誓[ちか]い). Слова народа — 「…」."
  19: "ἀπῆρεν Βακχίδης ἀπὸ Ιερουσαλημ — «отправился Вакхид из Иерусалима»; παρενέβαλεν ἐν Βηθζαιθ — «расположился станом в Визефе» (ベテザイト; слав. «визефе»); τῶν αὐτομολησάντων — «перебежчиков» (αὐτομολέω — 寝返[ねがえ]る); ἔθυσεν αὐτοὺς εἰς τὸ φρέαρ τὸ μέγα — «заколол их в колодезь великий» (φρέαρ — 井戸[いど])."
  20: "κατέστησεν τὴν χώραν τῷ Ἀλκίμῳ — «поручил страну Алкиму»; ἀφῆκεν μετ' αὐτοῦ δύναμιν τοῦ βοηθεῖν αὐτῷ — «оставил с ним силу помогать ему»; ἀπῆλθεν… πρὸς τὸν βασιλέα — «ушёл… к царю»."
  21: "ἠγωνίσατο Ἄλκιμος περὶ τῆς ἀρχιερωσύνης — «боролся Алким за первосвященство» (ἀγωνίζομαι — 争[あらそ]う)."
  22: "οἱ ταράσσοντες τὸν λαὸν αὐτῶν — «возмущающие народ свой» (ταράσσω); κατεκράτησαν γῆν Ιουδα — «овладели землёй Иуды» (κατακρατέω); ἐποίησαν πληγὴν μεγάλην ἐν Ισραηλ — «произвели поражение великое в Израиле»."
  23: "εἶδεν Ιουδας πᾶσαν τὴν κακίαν — «увидел Иуда всё зло»; οἱ μετ' αὐτοῦ ἐν υἱοῖς Ισραηλ — «бывшие с ним в сынах Израиля»; ὑπὲρ τὰ ἔθνη — «более (нежели) язычники»."
  24: "ἐξῆλθεν εἰς πάντα τὰ ὅρια τῆς Ιουδαίας κυκλόθεν — «вышел во все пределы Иудеи вокруг»; ἐποίησεν ἐκδίκησιν ἐν τοῖς ἀνδράσιν τοῖς αὐτομολήσασιν — «сотворил отмщение мужам перебежавшим»; ἀνεστάλησαν τοῦ ἐκπορεύεσθαι εἰς τὴν χώραν — «удержаны были выходить в страну» (ἀναστέλλω — 止[や]めさせる)."
  25: "ἐνίσχυσεν Ιουδας — «усилился Иуда» (ἐνισχύω); οὐ δύναται ὑποστῆναι αὐτούς — «не может устоять против них»; ἐπέστρεψεν πρὸς τὸν βασιλέα — «возвратился к царю»; κατηγόρησεν αὐτῶν πονηρά — «обвинил их злобно (в худом)»."
  26: "Νικάνορα ἕνα τῶν ἀρχόντων αὐτοῦ τῶν ἐνδόξων — «Никанора, одного из начальников его славных» (ニカノル); μισοῦντα καὶ ἐχθραίνοντα τῷ Ισραηλ — «ненавидящего и враждующего Израилю» (ἐχθραίνω); ἐξᾶραι τὸν λαόν — «истребить народ»."
  27: "ἦλθεν… δυνάμει πολλῇ — «пришёл… с силою великою»; μετὰ δόλου λόγοις εἰρηνικοῖς — «с коварством, со словами мирными». Его послание — 「…」 до 28."
  28: "Μὴ ἔστω μάχη ἀνὰ μέσον ἐμοῦ καὶ ὑμῶν — «да не будет войны между мною и вами» (μάχη); ἥξω ἐν ἀνδράσιν ὀλίγοις — «приду с мужами немногими» (ἥκω); ἵνα ἴδω ὑμῶν τὰ πρόσωπα μετ' εἰρήνης — «чтобы увидеть лица ваши с миром». Здесь речь закрывается."
  29: "ἠσπάσαντο ἀλλήλους εἰρηνικῶς — «приветствовали друг друга мирно» (ἀσπάζομαι); οἱ πολέμιοι ἕτοιμοι ἦσαν ἐξαρπάσαι τὸν Ιουδαν — «враги готовы были похитить Иуду» (ἐξαρπάζω — さらう)."
  30: "ἐγνώσθη ὁ λόγος τῷ Ιουδα — «стало известно слово Иуде»; μετὰ δόλου ἦλθεν ἐπ' αὐτόν — «с коварством пришёл к нему»; ἐπτοήθη ἀπ' αὐτοῦ — «устрашился его» (πτοέω); οὐκ ἐβουλήθη ἔτι ἰδεῖν τὸ πρόσωπον — «не захотел более видеть лицо его»."
  31: "ἀπεκαλύφθη ἡ βουλὴ αὐτοῦ — «открылся замысел его» (ἀποκαλύπτω); ἐξῆλθεν εἰς συνάντησιν… ἐν πολέμῳ — «вышел навстречу… с войной»; κατὰ Χαφαρσαλαμα — «при Хафарсаламе» (ハファルサラマ; слав. «харфарсарама»)."
  32: "ἔπεσον τῶν παρὰ Νικάνορος ὡσεὶ πεντακόσιοι ἄνδρες — «пали из бывших при Никаноре около пятисот мужей» (πεντακόσιοι — 500). Слав. «пять тысящ» — расхождение, вероятно, порча; держим LXX 五百[ごひゃく], отмечено. ἔφυγον εἰς τὴν πόλιν Δαυιδ — «убежали в город Давидов»."
  33: "ἀνέβη Νικάνωρ εἰς ὄρος Σιων — «взошёл Никанор на гору Сион»; ἐξῆλθον ἀπὸ τῶν ἱερέων… καὶ ἀπὸ τῶν πρεσβυτέρων — «вышли из священников… и из старейшин»; ἀσπάσασθαι αὐτὸν εἰρηνικῶς — «приветствовать его мирно»; δεῖξαι… τὴν ὁλοκαύτωσιν τὴν προσφερομένην ὑπὲρ τοῦ βασιλέως — «показать… всесожжение, приносимое за царя»."
  34: "ἐμυκτήρισεν αὐτούς — «осмеял (презрительно фыркнул) их» (μυκτηρίζω); κατεγέλασεν αὐτῶν — «посмеялся над ними» (καταγελάω); ἐμίανεν αὐτούς — «осквернил их» (μιαίνω); ἐλάλησεν ὑπερηφάνως — «говорил надменно»."
  35: "ὤμοσεν μετὰ θυμοῦ — «поклялся с яростью»; Ἐὰν μὴ παραδοθῇ Ιουδας… εἰς χεῖράς μου τὸ νῦν — «если не предастся Иуда… в руки мои теперь»; ἐὰν ἐπιστρέψω ἐν εἰρήνῃ — «если возвращусь в мире»; ἐμπυριῶ τὸν οἶκον τοῦτον — «сожгу дом этот» (ἐμπυρίζω)."
  36: "εἰσῆλθον οἱ ἱερεῖς — «вошли священники»; ἔστησαν κατὰ πρόσωπον τοῦ θυσιαστηρίου καὶ τοῦ ναοῦ — «стали пред лицом жертвенника и храма»; ἔκλαυσαν — «заплакали»."
  37: "Σὺ ἐξελέξω τὸν οἶκον τοῦτον — «Ты избрал дом этот»; ἐπικληθῆναι τὸ ὄνομά σου ἐπ' αὐτοῦ — «чтобы наречено было имя Твоё на нём»; οἶκον προσευχῆς καὶ δεήσεως — «дом молитвы и моления» (δέησις — 願[ねが]い). Молитва — 「…」 до 38."
  38: "ποίησον ἐκδίκησιν ἐν τῷ ἀνθρώπῳ τούτῳ — «сотвори отмщение человеку сему»; πεσέτωσαν ἐν ῥομφαίᾳ — «пусть падут мечом»; μνήσθητι τῶν δυσφημιῶν αὐτῶν — «вспомни злохуления их» (δυσφημία — 冒瀆[ぼうとく]); μὴ δῷς αὐτοῖς μονήν — «не дай им пребывания (жилища)» (μονή)."
  39: "ἐξῆλθεν Νικάνωρ ἐξ Ιερουσαλημ — «вышел Никанор из Иерусалима»; παρενέβαλεν ἐν Βαιθωρων — «расположился станом в Вефороне» (ベテ・ホロン); συνήντησεν αὐτῷ δύναμις Συρίας — «встретила его сила Сирии»."
  40: "παρενέβαλεν ἐν Αδασα ἐν τρισχιλίοις ἀνδράσιν — «расположился в Адасе с тремя тысячами мужей» (アダサ); προσηύξατο — «помолился»."
  41: "Οἱ παρὰ τοῦ βασιλέως ὅτε ἐδυσφήμησαν — «бывшие от царя, когда злословили» (δυσφημέω); ἐξῆλθεν ὁ ἄγγελός σου — «вышел ангел Твой» (ἄγγελος — 天使[てんし]); ἐπάταξεν ἐν αὐτοῖς ἑκατὸν ὀγδοήκοντα πέντε χιλιάδας — «поразил из них сто восемьдесят пять тысяч» (4 Цар 19:35). Молитва — 「…」 до 42."
  42: "σύντριψον τὴν παρεμβολὴν ταύτην — «сокруши этот стан»; γνώτωσαν οἱ ἐπίλοιποι — «да узнают остальные»; κακῶς ἐλάλησεν ἐπὶ τὰ ἅγιά σου — «худо говорил на святыни Твои»; κρῖνον αὐτὸν κατὰ τὴν κακίαν αὐτοῦ — «суди его по злобе его»."
  43: "συνῆψαν αἱ παρεμβολαὶ εἰς πόλεμον — «вступили станы в войну» (συνάπτω); τῇ τρισκαιδεκάτῃ τοῦ μηνὸς Αδαρ — «в тринадцатый день месяца Адар» (アダル); συνετρίβη ἡ παρεμβολὴ Νικάνορος — «сокрушён был стан Никанора»; ἔπεσεν αὐτὸς πρῶτος — «пал сам первым»."
  44: "ὡς δὲ εἶδεν ἡ παρεμβολὴ αὐτοῦ ὅτι ἔπεσεν Νικάνωρ — «когда увидел стан его, что пал Никанор»; ῥίψαντες τὰ ὅπλα ἔφυγον — «бросив оружие, побежали» (ῥίπτω)."
  45: "κατεδίωκον αὐτοὺς ὁδὸν ἡμέρας μιᾶς — «преследовали их путём одного дня» (καταδιώκω); ἀπὸ Αδασα ἕως τοῦ ἐλθεῖν εἰς Γαζηρα — «от Адасы до прихода в Газеру» (ガジラ); ἐσάλπιζον ὀπίσω αὐτῶν ταῖς σάλπιγξιν τῶν σημασιῶν — «трубили за ними трубами знамений (сигналов)»."
  46: "ἐξῆλθον ἐκ πασῶν τῶν κωμῶν τῆς Ιουδαίας κυκλόθεν — «вышли из всех селений Иудеи вокруг» (κώμη — 村[むら]); ὑπερεκέρων αὐτούς — «охватывали (окружали) их» (ὑπερκεράννυμι — охватывать с флангов); ἀπέστρεφον οὗτοι πρὸς τούτους — «эти оборачивались к тем»; οὐ κατελείφθη ἐξ αὐτῶν οὐδὲ εἷς — «не осталось из них ни одного»."
  47: "ἔλαβον τὰ σκῦλα καὶ τὴν προνομήν — «взяли добычу и награбленное» (προνομή — 略奪品[りゃくだつひん]); τὴν κεφαλὴν Νικάνορος ἀφεῖλον — «голову Никанора отсекли» (ἀφαιρέω); τὴν δεξιὰν αὐτοῦ, ἣν ἐξέτεινεν ὑπερηφάνως — «правую руку его, которую он простёр надменно»; ἐξέτειναν παρὰ τῇ Ιερουσαλημ — «выставили близ Иерусалима» (ἐκτείνω)."
  48: "ηὐφράνθη ὁ λαὸς σφόδρα — «возвеселился народ весьма» (εὐφραίνω); ἤγαγον τὴν ἡμέραν ἐκείνην ἡμέραν εὐφροσύνης μεγάλην — «провели тот день как день великого веселья» (ἄγω)."
  49: "ἔστησαν τοῦ ἄγειν κατ' ἐνιαυτὸν τὴν ἡμέραν ταύτην — «постановили праздновать каждый год этот день»; τῇ τρισκαιδεκάτῃ τοῦ Αδαρ — «в тринадцатый (день) Адара»."
  50: "ἡσύχασεν ἡ γῆ Ιουδα ἡμέρας ὀλίγας — «успокоилась земля Иуды на дни немногие» (ἡσυχάζω)."
