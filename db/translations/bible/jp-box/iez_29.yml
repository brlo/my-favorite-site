verses:
  1: "第十年[だいじゅうねん]、第十[だいじゅう]の月[つき]の一日[ついたち]に、主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  2: "「人[ひと]の子[こ]よ、顔[かお]をエジプトの王[おう]ファラオに向[む]け、彼とエジプト全[ぜん]体[たい]に向[む]かって預言[よげん]せよ。"
  3: "語[かた]って言[い]え。主[しゅ]なる神[かみ]はこう言[い]われる。見[み]よ、わたしはあなたに対[たい]する、ファラオ、エジプトの王[おう]よ。あなたは自分[じぶん]の川[かわ]々の真[ま]ん中[なか]に横[よこ]たわる大[おお]きな竜[りゅう]である。あなたは言[い]う。『川[かわ]はわたしのものだ。わたしがこれを造[つく]った』と。"
  4: "わたしはあなたの顎[あご]にくつわをかけ、あなたの川[かわ]の魚[さかな]をあなたの翼[つばさ]に貼[は]りつける。わたしはあなたをあなたの川[かわ]の真[ま]ん中[なか]から、すべての川[かわ]の魚[さかな]とともに引[ひ]き上[あ]げる。魚[さかな]はあなたの鱗[うろこ]に貼[は]りつく。"
  5: "わたしはあなたを速[すみ]やかに地[ち]に投[な]げ落[お]とし、あなたの川[かわ]のすべての魚[さかな]も投[な]げ落[お]とす。あなたは野[の]の面[おもて]に倒[たお]れ、集[あつ]められず、葬[ほうむ]られもしない。わたしはあなたを地[ち]の獣[けもの]と空[そら]の鳥[とり]に食[た]べ物[もの]として与[あた]えた。"
  6: "エジプトに住[す]む者[もの]たちはみな、わたしが主[しゅ]であることを知[し]る。あなたはイスラエルの家[いえ]にとって葦[あし]の杖[つえ]であったからである。"
  7: "彼らが手[て]であなたを握[にぎ]ると、あなたは折[お]れた。彼らの手[て]があなたに及[およ]ぶと、あなたは砕[くだ]け、彼らがあなたに寄[よ]りかかると、あなたは彼らのすべての腰[こし]を砕[くだ]いた。"
  8: "それゆえ、主[しゅ]なる神[かみ]はこう言[い]われる。見[み]よ、わたしはあなたの上[うえ]に剣[つるぎ]を臨[のぞ]ませ、人[ひと]と家畜[かちく]をあなたから滅[ほろ]ぼす。"
  9: "エジプトの地[ち]は滅[ほろ]びと荒[あ]れ野[の]となる。彼らはわたしが主[しゅ]であることを知[し]る。あなたは『川[かわ]はわたしのものだ。わたしがこれを造[つく]った』と言[い]ったからである。"
  10: "それゆえ、見[み]よ、わたしはあなたとあなたのすべての川[かわ]々に対[たい]する。わたしはエジプトの地[ち]を、マグドルからシエネまで、エチオピアの境[さかい]に至[いた]るまで、剣[つるぎ]と滅[ほろ]びの荒[あ]れ野[の]とする。"
  11: "人[ひと]の足[あし]はそこを通[とお]らず、家畜[かちく]の足[あし]もそこを通[とお]らず、それは四十年[よんじゅうねん]の間[あいだ]、住[す]まれることがない。"
  12: "わたしはその地[ち]を、荒[あ]れ果[は]てた地[ち]々の真[ま]ん中[なか]で荒[あ]れ果[は]てさせ、その町[まち]々は、荒[あ]れ果[は]てた町[まち]々の真[ま]ん中[なか]で四十年[よんじゅうねん]の間[あいだ]荒[あ]れ果[は]てる。わたしはエジプトを諸国民[しょこくみん]の間[あいだ]に散[ち]らし、国々[くにぐに]にまき散[ち]らす。"
  13: "主[しゅ]なる神[かみ]はこう言[い]われる。四十年[よんじゅうねん]の後[のち]、わたしはエジプト人[じん]を、彼らが散[ち]らされた諸国民[しょこくみん]の間[あいだ]から集[あつ]める。"
  14: "わたしはエジプトの捕囚[ほしゅう]を帰[かえ]し、彼らをパトゥレスの地[ち]に、彼らが取[と]られたもとの地[ち]に住[す]まわせる。そこは弱[よわ]い王国[こくおう]となる。"
  15: "それはもろもろの王国[こくおう]よりも弱[よわ]くなり、もはや諸国民[しょこくみん]の上[うえ]に高[たか]ぶらない。わたしは彼らを小[ちい]さくして、もはや諸国民[しょこくみん]の間[あいだ]で多[おお]くなることのないようにする。"
  16: "彼らはもはやイスラエルの家[いえ]の望[のぞ]みとならず、彼らがエジプト人[じん]に従[したが]った時[とき]の不法[ふほう]を思[おも]い起[おこ]させることもない。彼らはわたしが主[しゅ]なる神[かみ]であることを知[し]る。」"
  17: "第二十七年[だいにじゅうしちねん]、第一[だいいち]の月[つき]の一日[ついたち]に、主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  18: "「人[ひと]の子[こ]よ、バビロンの王[おう]ネブカドネツァルは、ツロに向[む]かってその軍[ぐん]を大[おお]きな働[はたら]きに服[ふく]させた。すべての頭[あたま]は禿[は]げ、すべての肩[かた]は毛[け]が抜[ぬ]け落[お]ちた。しかし彼もその軍[ぐん]も、ツロに向[む]かってなした働[はたら]きの報[むく]いを受[う]けなかった。"
  19: "それゆえ、主[しゅ]なる神[かみ]はこう言[い]われる。見[み]よ、わたしはバビロンの王[おう]ネブカドネツァルにエジプトの地[ち]を与える。彼はその多[おお]くの者[もの]を取[と]り、その獲物[えもの]を奪[うば]い、戦利品[せんりひん]を取[と]る。それが彼の軍[ぐん]の報[むく]いとなる。"
  20: "彼がツロに向[む]かって働[はたら]いた働[はたら]きの報[むく]いとして、わたしは彼にエジプトの地[ち]を与えた。彼がわたしに仕[つか]えたからである、と主[しゅ]なる神[かみ]は言[い]われる。"
  21: "その日[ひ]、わたしはイスラエルの家[いえ]に角[つの]を生[は]えさせ、あなたには彼らの間[あいだ]で口[くち]を開[ひら]かせる。彼らはわたしが主[しゅ]であることを知[し]る。」"

notes:
  1: "Ἐν τῷ ἔτει τῷ δεκάτῳ ἐν τῷ δεκάτῳ μηνὶ μιᾷ τοῦ μηνός — «в десятый год, в десятый месяц, в первый [день] месяца». В слав. «(в первый день)» стоит в редакционных скобках, но в LXX μιᾷ есть, поэтому в тексте 一日[ついたち] без 〔…〕; в Синодальном «в двенадцатый день» (МТ) — не внесено. ἐγένετο λόγος κυρίου πρός με λέγων — формула вне кавычек."
  2: "Υἱὲ ἀνθρώπου — «сын человеческий»; στήρισον τὸ πρόσωπόν σου ἐπὶ Φαραω — «утверди лицо твоё на фараона» (ファラオ); προφήτευσον ἐπ᾽ αὐτὸν καὶ ἐπ᾽ Αἴγυπτον ὅλην — «пророчествуй на него и на весь Египет» (エジプト全体[ぜんたい])."
  3: "Τάδε λέγει κύριος Ἰδοὺ ἐγὼ ἐπὶ Φαραω — «так говорит Господь: вот, Я — на фараона» (слав. добавляет «наведу на тя»); τὸν δράκοντα τὸν μέγαν — «дракона великого» (δράκων — 竜[りゅう]; слав. «змий великий»; в Синодальном «крокодил» — по МТ תַּנִּים, не внесено); τὸν ἐγκαθήμενον ἐν μέσῳ ποταμῶν αὐτοῦ — «лежащего (сидящего) среди рек его»; Ἐμοί εἰσιν οἱ ποταμοί, καὶ ἐγὼ ἐποίησα αὐτούς — «мои реки, и я создал их»: слова фараона в 『…』 (слав. «моя суть реки, и аз сотворих я»)."
  4: "δώσω παγίδας εἰς τὰς σιαγόνας σου — «дам петли (силки) в челюсти твои» (παγίς — сеть, петля); слав. «узду» (くつわ), и это церковное чтение оставлено в тексте, вариант LXX — в notes. προσκολλήσω τοὺς ἰχθῦς τοῦ ποταμοῦ σου πρὸς τὰς πτέρυγάς σου — «прилеплю рыб реки твоей к крыльям твоим» (πτέρυγες — 翼[つばさ]; в Синодальном «к чешуе» — МТ); ἀνάξω σε ἐκ μέσου τοῦ ποταμοῦ σου — «изведу тебя из среды реки твоей». Слав. добавляет «и к чешуям твоим прильпнут» — нет в LXX, внесено без 〔…〕 (鱗[うろこ])."
  5: "καταβαλῶ σε ἐν τάχει — «повергну тебя скоро» (τάχος — быстрота, 速[すみ]やかに); ἐπὶ πρόσωπον τοῦ πεδίου πεσῇ — «на лицо поля падёшь»; οὐ μὴ συναχθῇς — «не будешь собран» (συνάγω); οὐ μὴ περισταλῇς — «не будешь обёрнут», т. е. не погребён (περιστέλλω; слав. «не оградишися»); δέδωκά σε εἰς κατάβρωμα — «дал тебя в снедь» (κατάβρωμα)."
  6: "ἀνθ᾽ ὧν ἐγενήθης ῥάβδος καλαμίνη τῷ οἴκῳ Ισραηλ — «за то, что ты стал тростью (камышовым жезлом) дому Израилеву» (ῥάβδος καλαμίνη — 葦[あし]の杖[つえ]). γνώσονται ὅτι ἐγὼ κύριος — формула «узнают, что Я Господь»."
  7: "ὅτε ἐπελάβοντό σου τῇ χειρὶ αὐτῶν, ἐθλάσθης — «когда взялись за тебя рукою, ты надломился» (θλάω — ломать); καὶ ὅτε ἐπεκράτησεν ἐπ᾿ αὐτοὺς πᾶσα χεὶρ — тёмное место: «когда овладела (укрепилась) над ними всякая рука» (слав. «егда восплеска на них всяка рука»); ὅτε ἐπανεπαύσαντο ἐπὶ σέ, συνετρίβης — «когда оперлись на тебя, ты сокрушился»; συνέκλασας αὐτῶν πᾶσαν ὀσφύν — «сломил им все чресла» (ὀσφύς — 腰[こし]). Образ сломанного жезла, который ранит опирающихся."
  8: "διὰ τοῦτο τάδε λέγει κύριος — «посему так говорит Господь» (слав. «адонаи Господь»); ἐπάγω ἐπὶ σὲ ῥομφαίαν — «наведу на тебя меч»; ἀπολῶ ἀνθρώπους ἀπὸ σοῦ καὶ κτήνη — «погублю у тебя людей и скот» (κτῆνος — 家畜[かちく])."
  9: "ἔσται ἡ γῆ Αἰγύπτου ἀπώλεια καὶ ἔρημος — «будет земля Египетская погибелью и пустыней»; ἀντὶ τοῦ λέγειν σε — «за то, что ты говорил»; Οἱ ποταμοὶ ἐμοί εἰσιν, καὶ ἐγὼ ἐποίησα αὐτούς — повтор слов фараона из 3-го стиха (без кавычек: это уже речь Господа о них)."
  10: "διὰ τοῦτο ἰδοὺ ἐγὼ ἐπὶ σὲ καὶ ἐπὶ πάντας τοὺς ποταμούς σου — «посему вот, Я — на тебя и на все реки твои»; δώσω γῆν Αἰγύπτου εἰς ἔρημον καὶ ῥομφαίαν καὶ ἀπώλειαν — «дам землю Египетскую в пустыню, и меч, и погибель»; ἀπὸ Μαγδώλου καὶ Συήνης καὶ ἕως ὁρίων Αἰθιόπων — «от Магдола и Сиены и до пределов Ефиопских» (マグドル、シエネ、エチオピア)."
  11: "οὐ μὴ διέλθῃ ἐν αὐτῇ ποὺς ἀνθρώπου — «не пройдёт по ней нога человека»; ποὺς κτήνους — «нога скота»; οὐ κατοικηθήσεται τεσσαράκοντα ἔτη — «не будет населена сорок лет» (四十年[よんじゅうねん])."
  12: "δώσω τὴν γῆν αὐτῆς ἀπώλειαν — «дам землю его в погибель»; ἐν μέσῳ γῆς ἠρημωμένης — «среди земли опустошённой»; αἱ πόλεις αὐτῆς ἐν μέσῳ πόλεων ἠρημωμένων — «города его среди городов опустошённых»; διασπερῶ Αἴγυπτον ἐν τοῖς ἔθνεσιν καὶ λικμήσω αὐτοὺς εἰς τὰς χώρας — «рассею Египет по народам и развею их по странам» (λικμάω — веять, まき散[ち]らす)."
  13: "Μετὰ τεσσαράκοντα ἔτη συνάξω τοὺς Αἰγυπτίους — «после сорока лет соберу Египтян»; ἀπὸ τῶν ἐθνῶν, οὗ διεσκορπίσθησαν ἐκεῖ — «из народов, где они рассеялись там». τάδε λέγει κύριος — «так говорит Господь» (слав. «адонаи Господь»)."
  14: "ἀποστρέψω τὴν αἰχμαλωσίαν τῶν Αἰγυπτίων — «возвращу плен Египтян» (αἰχμαλωσία — 捕囚[ほしゅう]); ἐν γῇ Παθουρης — «в земле Пафроса» (Παθουρης, パトゥレス; слав. «фафорская», в Синодальном «Пафрос»); ὅθεν ἐλήμφθησαν — «откуда взяты были»; ἔσται ἀρχὴ ταπεινή — «будет начальство (царство) уничижённое» (ἀρχή — 王国[こくおう])."
  15: "παρὰ πάσας τὰς ἀρχάς — «более всех начальств (царств)»; οὐ μὴ ὑψωθῇ ἔτι ἐπὶ τὰ ἔθνη — «не вознесётся более над народами»; ὀλιγοστοὺς αὐτοὺς ποιήσω — «умалёнными сделаю их» (ὀλιγοστός — немногочисленный); τοῦ μὴ εἶναι αὐτοὺς πλείονας ἐν τοῖς ἔθνεσιν — «чтобы не были они многочисленны среди народов»."
  16: "καὶ οὐκέτι ἔσονται τῷ οἴκῳ Ισραηλ εἰς ἐλπίδα — «и не будут более дому Израилеву в надежду» (望[のぞ]み); ἀναμιμνῄσκουσαν ἀνομίαν — «напоминающую беззаконие» (ἀναμιμνῄσκω); ἐν τῷ αὐτοὺς ἀκολουθῆσαι ὀπίσω αὐτῶν — «когда они пошли за ними» (Израиль за Египтом); γνώσονται ὅτι ἐγὼ κύριος — формула, слав. «адонаи Господь» (主[しゅ]なる神[かみ]). Здесь первое слово закрывается."
  17: "Καὶ ἐγένετο ἐν τῷ ἑβδόμῳ καὶ εἰκοστῷ ἔτει μιᾷ τοῦ μηνὸς τοῦ πρώτου — «и было в двадцать седьмой год, в первый [день] первого месяца» (第二十七年[だいにじゅうしちねん]); формула вне кавычек. Это последняя дата книги до 32:1."
  18: "κατεδουλώσατο αὐτοῦ τὴν δύναμιν δουλείᾳ μεγάλῃ ἐπὶ Τύρου — «поработил войско своё рабством (трудом) великим при Тире» (καταδουλόω); πᾶσα κεφαλὴ φαλακρὰ καὶ πᾶς ὦμος μαδῶν — «всякая голова плешива и всякое плечо облезло» (μαδάω — лысеть, 毛[け]が抜[ぬ]け落[お]ちる); μισθὸς οὐκ ἐγενήθη αὐτῷ — «платы не было ему» (μισθός — 報[むく]い); ἐπὶ Τύρου καὶ τῆς δουλείας, ἧς ἐδούλευσαν ἐπ᾽ αὐτήν — «при Тире и [за] работу, которую работали на него»."
  19: "ἰδοὺ δίδωμι τῷ Ναβουχοδονοσορ γῆν Αἰγύπτου — «вот, даю Навуходоносору землю Египетскую»; προνομεύσει τὴν προνομὴν αὐτῆς — «расхитит добычу (захват) её» (προνομή; слав. добавляет «возмет множество ея»); σκυλεύσει τὰ σκῦλα αὐτῆς — «ограбит добычу её» (σκῦλα — 戦利品[せんりひん]); ἔσται μισθὸς τῇ δυνάμει αὐτοῦ — «будет плата войску его»."
  20: "ἀντὶ τῆς λειτουργίας αὐτοῦ, ἧς ἐδούλευσεν ἐπὶ Τύρον — «за службу его, которую он отслужил при Тире» (λειτουργία — служба); δέδωκα αὐτῷ γῆν Αἰγύπτου — «дал ему землю Египетскую»; слав. добавляет «зане послужи мне» (нет в LXX) — внесено без 〔…〕. τάδε λέγει κύριος κύριος — формула в конце стиха (слав. «сия глаголет адонаи Господь»), вводит 21-й; оставлена внутри речи."
  21: "Ἐν τῇ ἡμέρᾳ ἐκείνῃ ἀνατελεῖ κέρας παντὶ τῷ οἴκῳ Ισραηλ — «в тот день произрастёт рог всему дому Израилеву» (κέρας — 角[つの], образ силы); σοὶ δώσω στόμα ἀνεῳγμένον ἐν μέσῳ αὐτῶν — «тебе дам уста отверстые среди них» (ἀνοίγω — открывать): пророку возвращается слово. γνώσονται ὅτι ἐγὼ κύριος — формула; слово Господа закрывается."
