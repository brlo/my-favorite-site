# jp-box, Иезекииль, глава 29. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 29 (совпадает; см. карту 20/21).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: два слова о Египте. 1–16 — первое: дата (десятый год, десятый месяц,
# первый день); фараон — «большой дракон, лежащий среди рек своих», «мои реки, и я
# создал их»; крючья в челюсти, рыбы, прилипшие к крыльям, поле и звери; Египет —
# «тростниковый жезл» дому Израилеву, который ломается и ранит; меч и опустошение,
# сорок лет, рассеяние, возвращение в землю Пафроса, уничижённое царство, конец
# надежды Израиля. 17–21 — второе: дата (двадцать седьмой год, первый месяц, первый
# день); Навуходоносор не получил платы за Тир, ему отдан Египет; «в тот день
# произрастёт рог дому Израилеву».
# Голоса: 1 — формула вне кавычек; 2–16 — слово Господа в 「…」 (в 3 слова фараона
# в 『…』); 17 — формула; 18–21 — слово Господа в 「…」 (формула «так говорит Господь»
# в конце 20-го стоит внутри речи и вводит 21-й, как в слав.).
# «Точка»: в этой главе нет.
# Имена и термины: エジプト, ファラオ, エチオピア, ネブカドネツァル, バビロン, ツロ,
# イスラエル, ヤコブ; 大[おお]きな竜[りゅう] — δράκων μέγας (29:3; слав. «змий великий»);
# マグドル (Μαγδωλ), シエネ (Συήνη), パトゥレス (Παθουρης), エチオピア (Αἰθιοπία);
# 葦[あし]の杖[つえ] — ῥάβδος καλαμίνη; 四十年[よんじゅうねん] — τεσσαράκοντα ἔτη (29:11–13).
