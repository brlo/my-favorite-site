verses:
  0: "ダビデの詩[うた]。彼[かれ]の子[こ]に追[お]われていたときのもの。"
  1: "主[しゅ]よ、わたしの祈[いの]りを聞[き]いてください。あなたの真実[しんじつ]によって、わたしの願[ねが]いに耳[みみ]を傾[かたむ]けてください。あなたの義[ぎ]によって、わたしに答[こた]えてください。"
  2: "あなたの僕[しもべ]と裁[さば]きの場[ば]に立[た]たないでください。あなたの前[まえ]に生[い]ける者[もの]は、だれ一人[ひとり]義[ぎ]と認[みと]められないからです。"
  3: "敵[てき]はわたしの魂[たましい]を追[お]い、わたしの命[いのち]を地[ち]に踏[ふ]みつけ、わたしを昔[むかし]の死者[ししゃ]のように暗[くら]いところに住[す]まわせた。"
  4: "わたしの霊[れい]はわたしの内[うち]で悩[なや]み、わたしの心[こころ]はわたしの内[うち]でかき乱[みだ]された。"
  5: "わたしは昔[むかし]の日[ひ]々[び]を思[おも]い、あなたのすべてのわざを思[おも]い巡[めぐ]らし、あなたの手[て]のわざを考[かんが]えた。"
  6: "わたしはあなたに向[む]かって手[て]を広[ひろ]げる。わたしの魂[たましい]は、水[みず]のない地[ち]のように、あなたを渇[かわ]き求[もと]める。"
  7: "主[しゅ]よ、早[はや]くわたしに答[こた]えてください。わたしの霊[れい]は尽[つ]き果[は]てようとしています。あなたの顔[かお]をわたしから隠[かく]さないでください。そうでなければ、わたしは穴[あな]に下[くだ]る者[もの]のようになります。"
  8: "朝[あさ]には、あなたのあわれみをわたしに聞[き]かせてください。わたしはあなたに寄[よ]り頼[たの]んでいるからです。主[しゅ]よ、わたしが歩[あゆ]むべき道[みち]をわたしに知[し]らせてください。わたしはあなたに魂[たましい]を上[あ]げているからです。"
  9: "主[しゅ]よ、わたしをわたしの敵[てき]から救[すく]い出[だ]してください。わたしはあなたに逃[に]げ込[こ]んだからです。"
  10: "あなたの御心[みこころ]を行[おこな]うことをわたしに教[おし]えてください。あなたはわたしの神[かみ]であるからです。あなたの善[よ]い霊[れい]が、まっすぐな地[ち]へわたしを導[みちび]いてくださいますように。"
  11: "主[しゅ]よ、あなたの名[な]のためにわたしを生[い]かし、あなたの義[ぎ]によってわたしの魂[たましい]を苦難[くなん]から引[ひ]き出[だ]してください。"
  12: "あなたのあわれみによって、わたしの敵[てき]を滅[ほろ]ぼし、わたしの魂[たましい]を苦[くる]しめる者[もの]をすべて断[た]ってください。わたしはあなたの僕[しもべ]であるからです。"

notes:
  0: "Ψαλμὸς τῷ Δαυιδ, ὅτε αὐτὸν ὁ υἱὸς καταδιώκει — ダビデの詩。彼の子に追われていたときのもの (καταδιώκω — «преследовать»; Авессалом в греч. не назван, поэтому не добавлен). Надписание — стих 0."
  1: "Κύριε, εἰσάκουσον τῆς προσευχῆς μου — 主よ、わたしの祈りを聞いてください. ἐνώτισαι τὴν δέησίν μου ἐν τῇ ἀληθείᾳ σου — あなたの真実によって、わたしの願いに耳を傾けてください (ἐνωτίζομαι — «внимать»). ἐπάκουσόν μου ἐν τῇ δικαιοσύνῃ σου — あなたの義によって、わたしに答えてください."
  2: "καὶ μὴ εἰσέλθῃς εἰς κρίσιν μετὰ τοῦ δούλου σου — あなたの僕と裁きの場に立たないでください (εἰσέρχομαι εἰς κρίσιν — «вступать в суд»). οὐ δικαιωθήσεται ἐνώπιόν σου πᾶς ζῶν — あなたの前に生ける者は、だれ一人義と認められない (δικαιόω — «оправдывать»)."
  3: "κατεδίωξεν ὁ ἐχθρὸς τὴν ψυχήν μου — 敵はわたしの魂を追い (καταδιώκω — «преследовать»). ἐταπείνωσεν εἰς γῆν τὴν ζωήν μου — わたしの命を地に踏みつけ. ἐκάθισέν με ἐν σκοτεινοῖς ὡς νεκροὺς αἰῶνος — わたしを昔の死者のように暗いところに住まわせた (νεκροὶ αἰῶνος — «умершие в веке», т. е. давно умершие)."
  4: "ἠκηδίασεν ἐπ᾿ ἐμὲ τὸ πνεῦμά μου — わたしの霊はわたしの内で悩み (ἀκηδιάω — «унывать, изнемогать»; πνεῦμα — 霊). ἐν ἐμοὶ ἐταράχθη ἡ καρδία μου — わたしの心はわたしの内でかき乱された (ταράσσω — «смущать»)."
  5: "ἐμνήσθην ἡμερῶν ἀρχαίων — 昔の日々を思い (ἀρχαῖος — «древний»). ἐμελέτησα ἐν πᾶσι τοῖς ἔργοις σου — あなたのすべてのわざを思い巡らし (μελετάω — «размышлять»). ἐν ποιήμασιν τῶν χειρῶν σου ἐμελέτων — あなたの手のわざを考えた (ποίημα — «произведение»)."
  6: "διεπέτασα τὰς χεῖράς μου πρὸς σέ — あなたに向かって手を広げる (διαπετάννυμι — «простирать»). ἡ ψυχή μου ὡς γῆ ἄνυδρός σοι — わたしの魂は、水のない地のように、あなたを渇き求める (ἄνυδρος — «безводный»). διάψαλμα не передаётся."
  7: "ταχὺ εἰσάκουσόν μου, κύριε — 主よ、早くわたしに答えてください (ταχύ — «скоро»). ἐξέλιπεν τὸ πνεῦμά μου — わたしの霊は尽き果てようとしている (ἐκλείπω — «иссякать»). μὴ ἀποστρέψῃς τὸ πρόσωπόν σου ἀπ᾿ ἐμοῦ — あなたの顔をわたしから隠さないでください. ὁμοιωθήσομαι τοῖς καταβαίνουσιν εἰς λάκκον — 穴に下る者のようになる (λάκκος — «яма, ров», образ шеола)."
  8: "ἀκουστὸν ποίησόν μοι τὸ πρωῒ τὸ ἔλεός σου — 朝には、あなたのあわれみをわたしに聞かせてください (ἀκουστός — «слышимый»). ἐπὶ σοὶ ἤλπισα — わたしはあなたに寄り頼んでいる. γνώρισόν μοι… ὁδὸν ἐν ᾗ πορεύσομαι — わたしが歩むべき道を知らせてください. πρὸς σὲ ἦρα τὴν ψυχήν μου — わたしはあなたに魂を上げている (αἴρω — «поднимать»)."
  9: "ἐξελοῦ με ἐκ τῶν ἐχθρῶν μου — わたしを敵から救い出してください. ὅτι πρὸς σὲ κατέφυγον — わたしはあなたに逃げ込んだからです (καταφεύγω — «прибегать»)."
  10: "δίδαξόν με τοῦ ποιεῖν τὸ θέλημά σου — あなたの御心を行うことを教えてください (θέλημα — 御心). σὺ εἶ ὁ θεός μου — あなたはわたしの神である. τὸ πνεῦμά σου τὸ ἀγαθὸν ὁδηγήσει με — あなたの善い霊がわたしを導いてくださる (πνεῦμα без ἅγιον — 霊). ἐν γῇ εὐθείᾳ — まっすぐな地へ (εὐθύς — «прямой»)."
  11: "ἕνεκα τοῦ ὀνόματός σου, κύριε, ζήσεις με — 主よ、あなたの名のためにわたしを生かし (ἕνεκα — «ради»; ζάω — «жить»). ἐν τῇ δικαιοσύνῃ σου ἐξάξεις ἐκ θλίψεως τὴν ψυχήν μου — あなたの義によってわたしの魂を苦難から引き出してください."
  12: "καὶ ἐν τῷ ἐλέει σου ἐξολεθρεύσεις τοὺς ἐχθρούς μου — あなたのあわれみによって、わたしの敵を滅ぼし (ἐξολεθρεύω — «истреблять»). ἀπολεῖς πάντας τοὺς θλίβοντας τὴν ψυχήν μου — わたしの魂を苦しめる者をすべても断ってください. ὅτι δοῦλός σού εἰμι ἐγώ — わたしはあなたの僕であるからです."
