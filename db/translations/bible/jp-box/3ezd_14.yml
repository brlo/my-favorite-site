verses:
  1: "三日目[みっかめ]になったとき、わたしは樫[かし]の木[き]の下[した]に座[すわ]っていた。見[み]よ、柴[しば]の茂[しげ]みの中[なか]から、わたしに向[む]かって声[こえ]が出[で]て言[い]った。「エズラ、エズラ。」わたしは言[い]った。"
  2: "「主[しゅ]よ、ここにおります。」わたしは自分[じぶん]の足[あし]で立[た]った。彼はわたしに言[い]った。"
  3: "「わたしは柴[しば]の中[なか]で自[みずか]らを現[あらわ]してモーセに語[かた]った。わたしの民[たみ]がエジプトで仕[つか]えていたときのことである。"
  4: "わたしは彼を遣[つか]わし、わたしの民[たみ]をエジプトから導[みちび]き出[だ]し、彼をシナイの山[やま]に上[のぼ]らせ、長[なが]い間[あいだ]、わたしの前[まえ]に置[お]いた。"
  5: "わたしは彼に多[おお]くの驚[おどろ]くべきわざを告[つ]げ、時[とき]の秘[ひ]密[みつ]と終[お]わりとを示[しめ]し、彼に命[めい]じて言[い]った。"
  6: "『これらの言葉[ことば]は明[あき]らかにし、かの言葉[ことば]は隠[かく]せ。』"
  7: "今[いま]、わたしはあなたに言[い]う。"
  8: "わたしが示[しめ]したしるしと、あなたが見[み]た夢[ゆめ]と、あなたが知[し]った解[と]き明[あ]かしを、あなたの心[こころ]に置[お]け。"
  9: "あなたはすべてもろもろの者[もの]から取[と]り去[さ]られ、残[のこ]りの者[もの]として、わたしの計[はか]らいと、あなたに似[に]た者[もの]たちとともに、時[とき]が終[お]わるまで過[す]ごすからである。"
  10: "この世[よ]はその若[わか]さを失[うしな]い、時[とき]は老[お]いに近[ちか]づいているからである。"
  11: "この世[よ]は十二[じゅうに]の部分[ぶぶん]に分[わ]けられており、そのうちの九[ここの]つと、十番目[じゅうばんめ]の半分[はんぶん]が過[す]ぎ去[さ]った。"
  12: "残[のこ]っているのは、十番目[じゅうばんめ]の半分[はんぶん]の後[あと]の部分[ぶぶん]だけである。"
  13: "だから今[いま]、あなたの家[いえ]を整[ととの]え、あなたの民[たみ]を教[おし]え戒[いまし]め、彼らのうちの卑[いや]しめられた者[もの]たちを慰[なぐさ]め、もはや朽[く]ちることを捨[す]てよ。"
  14: "死[し]についての思[おも]いを自分[じぶん]から放[はな]ち、人[ひと]々[びと]の重[おも]荷[に]を自分[じぶん]から投[な]げ捨[す]て、もはや弱[よわ]い本性[ほんしょう]を自分[じぶん]から脱[ぬ]ぎ捨[す]て、あなたをかき乱[みだ]す思[おも]いを一[ひと]つの場所[ばしょ]へ退[しりぞ]け、この時[とき]から移[うつ]り去[さ]ろうと努[つと]めよ。"
  15: "あなたが今[いま]見[み]た、起[お]こった災[わざわ]いよりも、さらにひどいことが後[のち]に起[お]こるからである。"
  16: "この世[よ]が老[お]いによって弱[よわ]るほどに、住[す]む者[もの]たちの上[うえ]に災[わざわ]いが増[ふ]えていく。"
  17: "真実[しんじつ]は遠[とお]く遠[とお]ざかり、偽[いつわ]りは近[ちか]づく。あなたが見[み]た幻[まぼろし]は、すでに来[こ]ようと急[いそ]いでいる。」"
  18: "わたしは答[こた]えて言[い]った。「主[しゅ]よ、わたしはあなたの前[まえ]におります。"
  19: "見[み]よ、わたしはあなたが命[めい]じられたとおりに行[い]き、今[いま]の民[たみ]を教[おし]え戒[いまし]めます。しかし、これから生[う]まれる者[もの]たちを、だれが教[おし]えるのでしょうか。"
  20: "この世[よ]は闇[やみ]の中[なか]に置[お]かれ、その中[なか]に住[す]む者[もの]たちは光[ひかり]を持[も]たないからです。"
  21: "あなたの律法[りっぽう]は焼[や]かれ、それゆえ、あなたによって造[つく]られたこと、またこれからなされるわざを、だれも知[し]らないからです。"
  22: "もしわたしがあなたの前[まえ]に恵[めぐ]みを得[え]たのなら、わたしに聖[せい]なる霊[れい]を遣[つか]わし、この世[よ]の初[はじ]めから行[おこな]われたすべてのこと、あなたの律法[りっぽう]に書[か]かれていたことを書[か]き記[しる]させてください。そうすれば、人[ひと]々[びと]は道[みち]を見[み]いだし、終[お]わりの時[とき]に生[い]きようと願[ねが]う者[もの]たちは生[い]きることができるでしょう。」"
  23: "彼はわたしに答[こた]えて言[い]った。「行[い]って民[たみ]を集[あつ]め、四十日[よんじゅうにち]の間[あいだ]、あなたを尋[たず]ねないように彼らに言[い]え。"
  24: "あなたは多[おお]くの板[いた]を用意[ようい]し、サリヤ、ダブリヤ、サレミヤ、エハナ、アシエルの五[ご]人[にん]を自分[じぶん]とともに連[つ]れて行[い]け。彼らは速[すみ]やかに書[か]くことに備[そな]えている者[もの]たちである。"
  25: "そしてここに来[こ]い。わたしはあなたの心[こころ]に悟[さと]りの灯[ともしび]をともす。それはあなたが書[か]き始[はじ]めることが終[お]わるまで消[き]えない。"
  26: "書[か]き終[お]えたなら、あるものは明[あき]らかにし、あるものは知恵[ちえ]ある者[もの]たちに秘[ひ]かに伝[つた]えよ。明日[あした]のこの時刻[じこく]に、あなたは書[か]き始[はじ]める。」"
  27: "わたしは命[めい]じられたとおりに行[い]き、すべてもろもろの民[たみ]を集[あつ]めて言[い]った。"
  28: "「イスラエルよ、これらの言葉[ことば]を聞[き]け。"
  29: "わたしたちの父祖[ふそ]たちは初[はじ]めからエジプトに寄留[きりゅう]し、そこから救[すく]い出[だ]された。"
  30: "彼らは命[いのち]の律法[りっぽう]を受[う]け取[と]ったが、それを守[まも]らなかった。あなたがたも彼らの後[あと]にそれを犯[おか]した。"
  31: "あなたがたには嗣業[しぎょう]として地[ち]が与[あた]えられ、シオンの地[ち]も与[あた]えられた。しかし、あなたがたの父祖[ふそ]たちもあなたがたも不法[ふほう]を犯[おか]し、いと高[たか]き方[かた]があなたがたに命[めい]じた道[みち]を保[たも]たなかった。"
  32: "しかし、正[ただ]しい裁[さば]き主[ぬし]である方[かた]は、あなたがたに与[あた]えたものを時[とき]が来[く]ると取[と]り上[あ]げられた。"
  33: "今[いま]、あなたがたはここにおり、あなたがたの兄弟[きょうだい]たちもあなたがたの間[あいだ]にいる。"
  34: "だから、もしあなたがたが自分[じぶん]の感覚[かんかく]を治[おさ]め、心[こころ]を教[おし]え導[みちび]くなら、あなたがたは生[い]きたまま保[たも]たれ、死[し]んだ後[のち]にはあわれみを受[う]け継[つ]ぐであろう。"
  35: "死[し]の後[のち]に裁[さば]きが来[く]るからである。わたしたちが再[ふたた]び生[い]き返[かえ]るとき、そのとき正[ただ]しい者[もの]たちの名[な]が現[あらわ]れ、不敬[ふけい]な者[もの]たちのわざが示[しめ]される。"
  36: "だから今[いま]、だれもわたしに近[ちか]づかず、四十日[よんじゅうにち]の間[あいだ]、わたしを尋[たず]ねてはならない。」"
  37: "わたしは命[めい]じられたとおりに五[ご]人[にん]の男[おとこ]たちを連[つ]れ、野[の]へ行[い]ってそこに滞在[たいざい]した。"
  38: "翌日[よくじつ]、見[み]よ、声[こえ]がわたしを呼[よ]んで言[い]った。「エズラよ、あなたの口[くち]を開[ひら]き、わたしがあなたに飲[の]ませるものを飲[の]め。」"
  39: "わたしが口[くち]を開[ひら]くと、見[み]よ、満[み]たされた杯[さかずき]がわたしに差[さ]し出[だ]された。その中[なか]に満[み]ちていたものは水[みず]のようであったが、その色[いろ]は火[ひ]に似[に]ていた。"
  40: "わたしはそれを取[と]って飲[の]んだ。飲[の]むとき、わたしの心[こころ]は悟[さと]りによって波立[なみだ]ち、胸[むね]の内[うち]に知恵[ちえ]が育[そだ]った。わたしの霊[れい]が記憶[きおく]によって保[たも]たれていたからである。"
  41: "わたしの口[くち]は開[ひら]かれ、もはや閉[と]じられることはなかった。"
  42: "いと高[たか]き方[かた]は五[ご]人[にん]の男[おとこ]たちに悟[さと]りを与[あた]え、彼らは、夜[よる]の恐[おそ]ろしい事[こと]として語[かた]られたことを、自分[じぶん]たちが知[し]らないままに書[か]き記[しる]した。"
  43: "彼らは夜[よる]にパンを食[た]べ、わたしは昼[ひる]に語[かた]り、夜[よる]も黙[だま]らなかった。"
  44: "四十日[よんじゅうにち]の間[あいだ]に二百四[にひゃくよん]巻[かん]の書[しょ]が書[か]き記[しる]された。"
  45: "四十日[よんじゅうにち]が満[み]ちたとき、"
  46: "いと高[たか]き方[かた]が言[い]われた。「あなたが書[か]いた最初[さいしょ]のものは公[おおやけ]に置[お]き、ふさわしい者[もの]もふさわしくない者[もの]も読[よ]めるようにせよ。"
  47: "しかし、後の七十[ななじゅう]は取[と]っておき、あなたの民[たみ]のうちの知恵[ちえ]ある者[もの]たちに伝[つた]えよ。"
  48: "そこに悟[さと]りの根[ね]、知恵[ちえ]の泉[いずみ]、知識[ちしき]の川[かわ]があるからである。」わたしはそのようにした。"

notes:
  1: "Под дубом — «под дубом»; от купины — «из куста (терновника)», ср. Исх 3:2. Слова голоса — «エズラ、エズラ」; ответ Ездры — в 2."
  6: "Сия во явление сотвориши словеса и сия скрыеши — «эти слова сделай явными, а эти скрой». В слав. прямая речь Моисею внутри речи Бога, передана вложенными 『…』."
  9: "Восприят будеши от всех — «будешь взят от всех (людей)»; с советом моим — «с советом Моим». ru «с Сыном Моим» — иное чтение (в слав. «совет»), отмечено; в тексте по слав."
  11: "Слав. сжато: десятая и полдесятыя части — «десятая и полдесятыя части». ru уточняет: «девять частей и половина десятой», т. е. 9,5 из 12; в тексте по смыслу ru, слав. формула отмечена."
  14: "Извлецы уже от себе немощное естество — «сними с себя немощное естество»; отстави во едину страну смущающая тя помышления — «отложи в сторону смущающие тебя помыслы»."
  17: "Удалибося далече истина — «удалилась далеко истина»; тщится приити — «спешит прийти»."
  19: "Кто научит я — «кто научит их»."
  21: "Закон твой сожжен есть — «закон Твой сожжён» (ср. 4 Цар 22–23); в слав. и ru так, без смягчения."
  22: "Посли в мя дух свят — «пошли в меня Духа Святого»; да возмогут человецы обрести стезю — «чтобы люди могли найти стезю»."
  24: "Дщиц много — «много дощечек (таблиц)». Имена: Сарий, Даврий, Салемий, Ехан, Асиель — транслитерация слав. (サリヤ, ダブリヤ, サレミヤ, エハナ, アシエル); в ru те же имена."
  26: "Некая явственно да сотвориши, некоторая мудрым сокровенно предаси — «одно сделай явным, другое тайно передай мудрым»."
  42: "Ужасы нощныя — «ночные ужасы»; ru «писали по порядку, что было говорено им и чего они не знали» — слав. «ночные ужасы» в ru не отражено."
  44: "Слав. «книги двести четыри» — 204 книги; ru «девяносто четыре книги» — расхождение (204 / 94). В тексте по слав."
  46: "Первая, яже псал еси, в яве постави — «первые, которые ты написал, положи открыто»; последняя же седмьдесят сохрани — «последние семьдесят сбереги» (14:47)."
