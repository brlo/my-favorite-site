# Нумерация — славянская. Язык — современный 常体; 〔…〕 нет; сносок ⟨…⟩ нет.
# Глава 14: голос из куста (1–2); откровение Моисею и повеление Ездре (3–9);
# век и его двенадцать частей (10–17); молитва Ездры о Духе (18–22);
# сорок дней, пять писцов, чаша, 204 книги, явные и сокровенные (23–48).
# Голоса: 1 — повествование, слова голоса в 「…」; 2 — ответ Ездры в 「…»;
# 3–17 — слово Бога в 「…」 (закрывается в 17); 18–22 — молитва Ездры в 「…»
# (вводка 18 вне кавычек); 23–26 — ответ Бога в 「…»; 27 — вводка; 28–36 — речь
# Ездры к народу в 「…」; 38 — слова голоса в 「…»; 46–48 — слово Всевышнего в 「…»
