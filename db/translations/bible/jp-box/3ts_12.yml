verses:
  1: "ロボアム王[おう]はシケムへ行[い]った。イスラエルはすべて、彼[かれ]を王とするためにシケムに来[き]ていたからである。"
  2: "ナバトの子[こ]イエロボアムは、まだエジプトにいたとき——ソロモンの前[まえ]から逃[に]げていたのである——それを聞[き]き、エジプトから帰[かえ]って来[き]た。"
  3: "そして彼[かれ]らは人[ひと]を遣[つか]わして彼を呼[よ]んだ。イエロボアムとイスラエルの全会衆[ぜんかいしゅう]が来[き]て、民[たみ]はロボアム王[おう]に言[い]った。"
  4: "「あなたの父[ちち]はわたしたちのくびきを重[おも]くした。どうか今[いま]、あなたの父のきびしい労役[ろうえき]と、わたしたちに負[お]わせたその重いくびきを軽[かる]くしてください。そうすれば、わたしたちはあなたに仕[つか]える。」"
  5: "彼[かれ]は彼らに言[い]った。「三日[みっか]の間[あいだ]、去[さ]って、またわたしのところへ戻[もど]って来[き]なさい。」民[たみ]は去った。"
  6: "ロボアム王[おう]は、父[ちち]ソロモンが生[い]きていたとき彼の前[まえ]に立[た]っていた長老[ちょうろう]たちに尋[たず]ねた。「この民[たみ]にどう答[こた]えたらよいと、あなたがたは思[おも]うか。」"
  7: "彼[かれ]らは彼に言[い]った。「もし今日[きょう]、あなたがこの民[たみ]の僕[しもべ]となって彼らに仕[つか]え、彼らに良[よ]い言葉[ことば]を語[かた]るなら、彼らはすべても日[ひ]、あなたの僕となるでしょう。」"
  8: "しかし彼[かれ]は、長老[ちょうろう]たちが自分[じぶん]に勧[すす]めたその相談[そうだん]を捨[す]て、自分とともに育[そだ]ち、自分の前[まえ]に立[た]っている若者[わかもの]たちと相談した。"
  9: "彼は彼らに言[い]った。「あなたがたは何[なに]を勧[すす]めるか。『あなたの父[ちち]がわたしたちに負[お]わせたそのくびきを軽[かる]くしてくれ』とわたしに語ったこの民[たみ]に、何と答[こた]えたらよいか。」"
  10: "自分[じぶん]とともに育[そだ]った若者[わかもの]たちは彼[かれ]にこう言[い]った。「『あなたの父[ちち]はわたしたちのくびきを重[おも]くした。あなたはそれをわたしたちから軽[かる]くしてくれ』とあなたに語ったこの民[たみ]には、こう語[かた]りなさい。『わたしの小[ちい]ささは父の腰[こし]よりも太[ふと]い。"
  11: "今[いま]、わたしの父[ちち]はあなたがたに重[おも]いくびきを負[お]わせたが、わたしはあなたがたのくびきにさらに加[くわ]える。わたしの父はむちであなたがたを懲[こら]らしたが、わたしはさそりで懲らす。』」"
  12: "イスラエルはすべて、王[おう]が言[い]ったとおり、三日目[みっかめ]にロボアムのもとへ来[き]た。王は「三日目にわたしのところへ戻[もど]って来なさい」と言っていたからである。"
  13: "王[おう]は民[たみ]にきびしく答[こた]え、長老[ちょうろう]たちが自分[じぶん]に勧[すす]めたその相談[そうだん]を捨[す]てた。"
  14: "そして若者[わかもの]たちの相談[そうだん]に従[したが]って、彼[かれ]らにこう語[かた]った。「わたしの父[ちち]はあなたがたのくびきを重[おも]くしたが、わたしはあなたがたのくびきにさらに加[くわ]える。わたしの父はむちであなたがたを懲[こら]らしたが、わたしはさそりで懲らす。」"
  15: "王[おう]は民[たみ]の言[こと]を聞[き]かなかった。主[しゅ]からの変[か]わりが起[お]こって、主がシロ人[じん]アヒヤによってナバトの子[こ]イエロボアムについて語[かた]られたその言葉[ことば]が成[な]り立[た]つためであった。"
  16: "イスラエルはすべて、王[おう]が自分[じぶん]たちの言[こと]を聞[き]かなかったのを見[み]て、民[たみ]は王に答[こた]えて言[い]った。「ダビデにわたしたちの分[ぶん]は何[なに]があるのか。エッサイの子[こ]にわたしたちの嗣業[しぎょう]はない。イスラエルよ、自分の天幕[てんまく]へ帰[かえ]れ。ダビデよ、今[いま]は自分の家[いえ]を飼[か]え。」そしてイスラエルは自分の天幕へ去[さ]った。"
  17: "ユダの町々[まちまち]に住[す]むイスラエルの子[こ]らに対しては、ロボアムが彼[かれ]らの上[うえ]に王[おう]となった。"
  18: "ロボアム王[おう]は労役[ろうえき]の監督[かんとく]アドニラムを遣[つか]わしたが、イスラエルはすべて彼[かれ]を石[いし]で打[う]ち殺[ころ]した。ロボアム王はエルサレムへ逃[に]げるために急[いそ]いで戦車[せんしゃ]に上[のぼ]った。"
  19: "イスラエルはダビデの家[いえ]から離反[りはん]し、今日[こんにち]に至[いた]っている。"
  20: "イスラエルはすべて、イエロボアムがエジプトから帰[かえ]ったと聞[き]くと、人[ひと]を遣[つか]わして彼を集会[しゅうかい]に呼[よ]び、彼をイスラエルの上[うえ]に王[おう]とした。ダビデの家[いえ]に従[したが]う者は、ユダの王杖[おうじょう]とベニヤミンだけのほかはなかった。"
  21: "ロボアムはエルサレムに入[はい]り、ユダの全会衆[ぜんかいしゅう]とベニヤミンの王杖[おうじょう]、すなわち戦[たたか]いを行[おこな]う若者[わかもの]十二万[じゅうにまん]を集[あつ]めて、イスラエルの家[いえ]と戦い、王国[おうこく]をソロモンの子[こ]ロボアムに取[と]り戻[もど]そうとした。"
  22: "主[しゅ]の言葉[ことば]が、神[かみ]の人[ひと]サメヤに臨[のぞ]んで言[い]った。"
  23: "「ソロモンの子[こ]、ユダの王[おう]ロボアムに、ユダの全家[ぜんか]とベニヤミン、また残[のこ]りの民[たみ]に言[い]いなさい。"
  24: "『主[しゅ]はこう言[い]われる。あなたがたは上[のぼ]ってはならない。あなたがたの兄弟[きょうだい]であるイスラエルの子[こ]らと戦[たたか]ってはならない。おのおの自分[じぶん]の家[いえ]へ帰[かえ]りなさい。このことはわたしから出[で]たからである。』」そして彼[かれ]らは主の言葉を聞[き]いて、主の言葉のとおりに行[い]くことをやめた。"
  25: "イエロボアムはエフライムの山地[さんち]にシケムを建[た]ててそこに住[す]み、そこから出[で]てペヌエルを建てた。"
  26: "イエロボアムは心[こころ]のうちに言[い]った。「見[み]よ、今[いま]、王国[おうこく]はダビデの家[いえ]に戻[もど]る。"
  27: "もしこの民[たみ]が、主[しゅ]の家[いえ]でいけにえを献[ささ]げるためにエルサレムへ上[のぼ]るなら、この民の心[こころ]は、彼[かれ]らの主である主と、彼らの主人[しゅじん]であるユダの王[おう]ロボアムに帰[かえ]り、わたしを殺[ころ]して、ユダの王ロボアムに戻[もど]ってしまう。」"
  28: "王[おう]は相談[そうだん]して二頭[にとう]の金[きん]の子牛[こうし]を造[つく]り、民[たみ]に言[い]った。「エルサレムへ上[のぼ]るのはもうやめなさい。イスラエルよ、見[み]よ、あなたをエジプトの地[ち]から導[みちび]き上らせたあなたの神々[かみがみ]が、ここにおられる。」"
  29: "彼は一頭[いっとう]をベテルに、もう一頭をダンに置[お]いた。"
  30: "そしてこのことが罪[つみ]となった。民[たみ]はその一頭[いっとう]の前[まえ]をダンまで行[い]き、主[しゅ]の神殿[しんでん]を捨[す]てた。"
  31: "彼は高[たか]い所[ところ]に宮[みや]を建[た]て、レビの子[こ]らでない民[たみ]のうちから祭司[さいし]を立[た]てた。"
  32: "イエロボアムは八[や]つ目[め]の月[つき]、その月の十五日[じゅうごにち]に、ユダの地[ち]にある祭[まつ]りに似[に]せた祭りを定[さだ]め、自分[じぶん]がベテルに造[つく]った祭壇[さいだん]に上[のぼ]って、自分が造った子牛[こうし]たちにいけにえを献[ささ]げた。また自分が造った高[たか]い所[ところ]の祭司[さいし]たちをベテルに立[た]てた。"
  33: "そして彼は、自分[じぶん]が心[こころ]に思[おも]い描[えが]いて定めた祭[まつ]りに、八[や]つ目の月[つき]の十五日[じゅうごにち]に、自分が造[つく]った祭壇[さいだん]に上[のぼ]った。彼[かれ]はイスラエルの子[こ]らに祭りを定め、いけにえを献[ささ]げるために祭壇に上った。"

notes:
  1: "Σικιμα — Сихем (シケム). ἤρχοντο — приходили (имперфект). βασιλεῦσαι αὐτόν — воцарить его."
  2: "В gr-lxx-byz на месте стиха «.» — в LXX его нет; перевод по csl. «Яко убегл бе от лица соломона» — ибо убежал от лица Соломона. В LXX этот материал (καὶ ἐγενήθη ὡς ἤκουσεν Ιεροβοαμ…) стоит в конце 11:43 как двойное чтение, откуда здесь повторён по csl."
  3: "ἐλάλησεν ὁ λαὸς … λέγοντες — говорил народ… говоря. «И послаша, и призваша его. И прииде иеровоам и весь сонм израилев» — в csl, в LXX стих начинается сразу с речи народа; внесено по паритету."
  4: "κλοιός — ошейник, ярмо (κλοιός; слав. «ярем»). ἐβάρυνεν — отяготил (βαρύνω). κούφισον ἀπὸ τῆς δουλείας — облегчи от работы (κουφίζω, δουλεία). σκληρός — жестокий. δουλεύσομέν σοι — будем служить тебе."
  5: "Ἀπέλθετε ἕως ἡμερῶν τριῶν — отойдите до трёх дней. ἀναστρέψατε — возвратитесь (ἀναστρέφω). В csl «отидите (и пребудите) до третияго дне» — в скобках редакторское добавление."
  6: "παρήγγειλεν — объявил, велел (παραγγέλλω); в csl «возвести». οἱ πρεσβύτεροι οἱ παρεστῶτες ἐνώπιον Σαλωμων — старейшины, предстоявшие Соломону. Πῶς ὑμεῖς βουλεύεσθε καὶ ἀποκριθῶ — как вы советуете, и мне ответить (βουλεύομαι)."
  7: "ἔσῃ δοῦλος — будешь рабом, слугою. δουλεύσῃς αὐτοῖς — послужишь им. λόγους ἀγαθούς — добрые слова. ἔσονταί σοι δοῦλοι — будут тебе рабами."
  8: "ἐγκατέλιπεν τὴν βουλὴν τῶν πρεσβυτέρων — оставил совет старейшин (ἐγκαταλείπω, βουλή). ἃ συνεβουλεύσαντο αὐτῷ — который они советовали ему. παιδάρια τὰ ἐκτραφέντα μετ᾿ αὐτοῦ — юноши, вскормленные с ним (παιδάριον, ἐκτρέφω)."
  9: "Τί ὑμεῖς συμβουλεύετε — что вы советуете. τοῖς λαλήσασιν πρός με λεγόντων — говорившим мне, говоря (смешение конструкций в греч.). κούφισον ἀπὸ τοῦ κλοιοῦ — облегчи от ярма."
  10: "ἡ μικρότης μου — «малость моя» (μικρότης); в csl «юность моя», в МТ и ru «мой мизинец». παχυτέρα — толще. ὀσφύς — чресла, поясница (ὀσφύς)."
  11: "ἐπεσάσσετο — навьючивал, налагал (ἐπισάσσω). προσθήσω ἐπὶ τὸν κλοιόν — прибавлю к ярму. ἐπαίδευσεν ἐν μάστιγξιν — наказал бичами (παιδεύω, μάστιξ). ἐν σκορπίοις — скорпионами (σκορπίος): бич с металлическими шипами."
  12: "καθότι ἐλάλησεν αὐτοῖς ὁ βασιλεύς — как сказал им царь. Ἀναστράφητε — возвратитесь."
  13: "ἀπεκρίθη … σκληρά — ответил жестоко (σκληρός в роли наречия). ἐγκατέλιπεν — оставил."
  14: "κατὰ τὴν βουλὴν τῶν παιδαρίων — по совету юношей. Тот же текст, что в ст. 11: формула повторена в LXX и csl."
  15: "μεταστροφή — перемена, поворот (μεταστροφή); слав. «превращение». ὅπως στήσῃ τὸ ῥῆμα — чтобы поставить, исполнить слово (ἵστημι). ἐν χειρὶ Αχια — рукою Ахии."
  16: "Τίς ἡμῖν μερὶς ἐν Δαυιδ; — какая нам часть в Давиде? (μερίς). κληρονομία — наследие (κληρονομία), 嗣業. ἀπότρεχε — убегай (ἀποτρέχω). σκηνώματα — шатры (σκήνωμα), 天幕. βόσκε τὸν οἶκον σου — паси дом твой (βόσκω)."
  17: "В gr-lxx-byz на месте стиха «.» — в LXX его нет; перевод по csl: «Над сынми же израилевыми, иже живяху во градех иудиных, воцарися ровоам над ними» (в ru «Только над сынами Израилевыми, жившими в городах Иудиных»)."
  18: "τὸν ἐπὶ τοῦ φόρου — начальника над податью (φόρος), Адонирам (Αδωνιραμ; ср. 4:6; 5:14). ἐλιθοβόλησαν — побили камнями (λιθοβολέω). ἔφθασεν ἀναβῆναι — поспешил взойти (φθάνω); «на колесницу» — в csl, в LXX нет."
  19: "ἠθέτησεν — отложился, изменил (ἀθετέω); слав. «отложися». ἕως τῆς ἡμέρας ταύτης — до сего дня."
  20: "ἀνέκαμψεν — возвратился (ἀνακάμπτω). συναγωγή — собрание (συναγωγή). πάρεξ σκήπτρου Ιουδα καὶ Βενιαμιν μόνοι — кроме скипетра Иуды и Вениамина только (παρέξ)."
  21: "ἐξεκκλησίασεν — созвал собрание (ἐκκλησιάζω). ἑκατὸν καὶ εἴκοσι χιλιάδες — 120 000 (в ru 180 000 — масоретское чтение). νεανίαι ποιοῦντες πόλεμον — юноши, творящие войну. ἐπιστρέψαι τὴν βασιλείαν — возвратить царство."
  22: "Σαμαιαν — Самея (Σαμαιας). ἄνθρωπος τοῦ θεοῦ — человек Божий (神の人). λέγων — говоря; речь продолжается в ст. 23–24."
  23: "Εἰπὸν τῷ Ροβοαμ — скажи Ровоаму (εἰπόν, императив). τῷ καταλοίπῳ τοῦ λαοῦ — остатку народа (κατάλοιπος)."
  24: "Τάδε λέγει κύριος — так говорит Господь. Οὐκ ἀναβήσεσθε — не взойдёте. ἀναστρεφέτω ἕκαστος εἰς τὸν οἶκον ἑαυτοῦ — пусть возвратится каждый в дом свой. ὅτι παρ᾿ ἐμοῦ γέγονεν — ибо от Меня было. κατέπαυσαν τοῦ πορευθῆναι — перестали идти (καταπαύω). В базе после слов Господа стоит добавка «24a»: Соломон почил и погребён, Ровоам воцарился, 16 лет, 12 лет царствовал, мать Нааман, дочь Анана, делал злое; это двойное чтение (ср. 11:43; 14:21), в csl его нет — не повторено."
  25: "Церковное чтение (csl): «И созда иеровоам сикиму в горе ефремли, и вселися в ней, и изыде оттуду, и созда фануила». ᾠκοδόμησεν — построил, укрепил (οἰκοδομέω); Φανουηλ — Пенуил (ペヌエル; в ru «Пенуил»). В gr-lxx-byz на этом месте начало LXX-дублета (12:24b): «ἦν ἄνθρωπος ἐξ ὄρους Εφραιμ δοῦλος τῷ Σαλωμων… Ιεροβοαμ…» — Иеровоам, раб Соломона, ефрафянин из Сариры, сын вдовы, надзирал за работами дома Иосифа. Дублет повторяет 11:26–28 и здесь не переводится (см. шапку)."
  26: "Церковное чтение (csl): «И рече иеровоам в сердцы своем: се, ныне возвратится царство в дом давидов». εἶπεν ἐν τῇ καρδίᾳ αὐτοῦ — сказал в сердце своём. ἐπιστρέψει ἡ βασιλεία — возвратится царство. В гр. здесь слова Иеровоама из дублета («ибо поистине возвратится царство… и убьют меня»)."
  27: "Церковное чтение (csl): «аще взыдут людие сии вознести жертву в храме Господни во Иерусалим… и убиют мя». ἀναφέρειν θυσίας — приносить жертвы (ἀναφέρω). ἐπιστραφήσεται καρδία τοῦ λαοῦ πρὸς κύριον καὶ κύριον αὐτῶν — обратится сердце народа к Господу и господину своему (κύριος дважды; слав. «ко Господу и господину своему»). ἀποκτενοῦσίν με — убьют меня."
  28: "Церковное чтение (csl): «И усоветова царь, и сотвори две юницы златы… се, бози твои, израилю, изведшии тя из земли египетския». ἐβουλεύσατο — посоветовался, решил (βουλεύομαι). δύο δαμάλεις χρυσᾶς — двух золотых телиц (δάμαλις), 子牛. Ἱκανούσθω ὑμῖν ἀναβαίνειν — «довольно вам восходить», полно ходить (ἱκανόω). Образ Исх 32:4."
  29: "Церковное чтение (csl): «И постави едину в вефили, а другую в дане». Βαιθηλ — Вефиль (ベテル); Δαν — Дан (ダン)."
  30: "Церковное чтение (csl): «И бысть слово сие на согрешение, и идяху людие пред лицем юницы единыя даже до дана, и оставиша храм Господень». ἐγένετο ὁ λόγος οὗτος εἰς ἁμαρτίαν — стало это слово в грех. οἶκος κυρίου — храм Господень (神殿)."
  31: "Церковное чтение (csl): «И сотвори капища на высоких, и сотвори жерцов часть от людий…». οἴκους ἐφ᾿ ὑψηλῶν — дома, капища на высотах. ἱερεῖς μέρος τι ἐκ τοῦ λαοῦ — священников часть из народа (μέρος); οἳ οὐκ ἦσαν ἐκ τῶν υἱῶν Λευι — которые не были из сынов Левия."
  32: "Церковное чтение (csl): «И сотвори иеровоам праздник в осмый месяц в пятыйнадесять день месяца, по празднику, иже в земли иудине…». ἑορτὴ ἐν τῷ μηνὶ τῷ ὀγδόῳ — праздник в восьмом месяце. κατὰ τὴν ἑορτὴν τὴν ἐν γῇ Ιουδα — по празднику, что в земле Иуды (по образцу праздника кущей). θυσιαστήριον — жертвенник (祭壇). В гр. ст. 32 — большой свод: сначала двойное чтение о жене Иеровоама (хлебы для Ахии, пророчество о смерти ребёнка, знамение с разодранной одеждой, собрание в Сихеме, ответ Ровоама), затем после тире — 12:24–32 церковного счёта (война Ровоама, слово Самеи, Сихем, тельцы, праздник), т. е. то, что в csl стоит ст. 25–32. Переведено церковное чтение, дублет не переводится (см. шапку)."
  33: "Церковное чтение (csl): «И взыде на олтарь, егоже сотвори в вефили… еже пожрети». ᾗ ἐπλάσατο ἀπὸ καρδίας αὐτοῦ — который он вымыслил от сердца своего (πλάσσω). τοῦ ἐπιθῦσαι — чтобы принести жертву (ἐπιθύω)."
