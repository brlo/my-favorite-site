# jp-box, 3-я Царств, глава 12. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); второй свидетель — церковнославянский
# (csl-ru); ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет,
# jp-ni не источник (только проверка tmp/sim_jp.rb).
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 12: Ровоам в Сихеме (1–5), совет старцев и юношей (6–11), ответ и отпадение
# десяти колен (12–20), война запрещена через Самею (21–24), Иеровоам, Сихем и тельцы,
# праздник в Вефиле (25–33).
# Речи — 「…」: народ (4), Ровоам (5, 6, 9, 14), старцы (7), юноши (10–11), народ (16),
# Самея (23–24), Иеровоам (26–27, 28). Слова Господа внутри речи Самеи — 『…』 (24),
# речь народа и ответ в речи юношей — 『…』 (9–11). Красного нет.
# Паритет: csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes.
# ВАЖНО о ст. 25–33: в gr-lxx-byz это текст LXX-дублета (12:24a–z) — рассказ о жене
# Иеровоама у Ахии, пророчество о больном ребёнке, знамение с разодранной одеждой,
# собрание в Сихеме и ответ Ровоама; церковное чтение этих же стихов (Сихем, Пенуил,
# тельцы, праздник) в базе влито в 12:32 после тире и в 12:33. По паритету в основном
# тексте — csl (церковное чтение, ст. 25–33), LXX-дублет отмечен в notes; целиком он
# не переводится, потому что повторяет гл. 11 и 12:1–24 (повтор не переводится).
# 〔…〕 нет. Сносок ⟨…⟩ нет: 王杖, 天幕, 嗣業, 祭壇, 高い所, 子牛 уже в корпусе или пояснены в notes.
# jp-ni не использовался.

