# jp-box, 3-я Ездры, глава 11. Черновик для приёмки.
#
# База: церковнославянский текст (csl-ru) — в Септуагинте книги нет; ru — для понимания.
# Нумерация — славянская. Язык — современный 常体; 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: видение орла, поднимающегося из моря: двенадцать пернатых крыльев и три
# головы (1–4); орёл царствует над землёй (5–6); его речь к перьям: не бодрствовать всем
# вместе, головы сберегаются на конец (7–9); голос из средины тела (10); восемь малых
# перьев (11); поочерёдно царствуют перья с правой стороны и исчезают (12–21); не
# являются более двенадцать перьев и два малых пера, остаются две головы и шесть малых
# перьев (22–24); подкрыльные перья пытаются царствовать и исчезают (25–27); два
# оставшихся пытаются царствовать (28); пробуждается средняя голова, большая из двух,
# к ней присоединяются две головы, она пожирает два подкрыльных пера и с великим
# угнетением держит власть (29–32); средняя голова исчезает, остаются две, правая
# пожирает левую (33–35); голос велит смотреть (36); лев говорит орлу (37–46).
# Голоса: 11:1–7 — рассказ, 11:8–9 — речь орла к перьям 「…»; 11:10–15 — рассказ,
# 11:16–17 — голос к перу 「…»; 11:18–35 — рассказ; 11:36 — голос к Ездре 「…»;
# 11:38–46 — речь льва 「…». Числа крыльев, голов и перьев — буквально по слав.
# Термины: 鷲[わし] — орёл; 翼[つばさ] — крыло; 羽[はね] — перо; 小[ちい]さな羽[はね] —
# перийце, малые перья; 頭[あたま] — голова; 獣[けもの] — животное (Дан 7);
# いと高[たか]き方[かた] — Вышний; 力[ちから]ある者[もの] — Крепкий; 王[おう]として
# 君臨[くんりん]する — воцаритися; 支配[しはい] — началство; 地[ち]の円[えん] — круг
# земный; 不法[ふほう] — беззаконие; 高[こう]慢[まん] — гордыня. Имена: エズラ, ダニエル.
#
