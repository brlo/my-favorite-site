verses:
  1: "わたしは夢[ゆめ]を見[み]た。見[み]よ、海[うみ]から鷲[わし]が上[のぼ]って来[き]た。それには羽[はね]の生[は]えた翼[つばさ]が十二[じゅうに]と、三[みっ]つの頭[あたま]があった。"
  2: "わたしが見[み]ると、見[み]よ、それは翼[つばさ]を全[ぜん]地[ち]に広[ひろ]げ、天[てん]の風[かぜ]はみなそれに吹[ふ]きつけ、雲[くも]が集[あつ]まってきた。"
  3: "わたしが見[み]ると、その羽[はね]から別[べつ]の羽[はね]が生[う]まれ、それらは小[ちい]さく短[みじか]い羽[はね]となった。"
  4: "その頭[あたま]は休[やす]んでおり、中[なか]の頭[あたま]はほかの頭[あたま]よりも大[おお]きかったが、それも彼[かれ]らとともに休[やす]んでいた。"
  5: "わたしが見[み]ると、見[み]よ、鷲[わし]は翼[つばさ]で飛[と]び、地[ち]とそこに住[す]む者[もの]たちの上[うえ]に王[おう]として君臨[くんりん]した。"
  6: "わたしは、天[てん]の下[した]のすべてがそれに従[したが]い、地[ち]にあるどんな被造[ひぞう]物[ぶつ]もそれに逆[さか]らわなかったのを見[み]た。"
  7: "わたしが見[み]ると、見[み]よ、鷲[わし]は爪[つめ]の上[うえ]に立[た]ち、その羽[はね]に向[む]かって声[こえ]を発[はっ]して言[い]った。"
  8: "「すべてともに目[め]を覚[さ]ましていてはならない。おのおの自分[じぶん]の場所[ばしょ]で眠[ねむ]り、時[とき]に応[おう]じて目[め]を覚[さ]ましていなさい。"
  9: "頭[あたま]たちは終[お]わりの時[とき]まで保[たも]たれよ。」"
  10: "わたしが見[み]ると、見[み]よ、その声[こえ]は頭[あたま]からではなく、体[からだ]の真[ま]ん中[なか]から出[で]ていた。"
  11: "わたしはその別[べつ]の羽[はね]を数[かぞ]えた。見[み]よ、それは八[やっ]つあった。"
  12: "わたしが見[み]ると、見[み]よ、右[みぎ]の側[がわ]から一[ひと]つの羽[はね]が起[お]こり、全[ぜん]地[ち]の上[うえ]に王[おう]として君臨[くんりん]した。"
  13: "それが治[おさ]めていると、その終[お]わりが来[き]て、その場所[ばしょ]は見[み]えなくなった。すると別[べつ]の羽[はね]が起[お]こり、治[おさ]めた。それは長[なが]い時[とき]を保[たも]った。"
  14: "それが治[おさ]めているとき、その終[お]わりが近[ちか]づいて、前[まえ]のもののように見[み]えなくなろうとした。"
  15: "そして見[み]よ、それに向[む]かって声[こえ]が発[はっ]せられて言[い]った。"
  16: "「あなたは聞[き]きなさい。これほど長[なが]い間[あいだ]、地[ち]を保[たも]ってきた者[もの]よ。あなたが見[み]えなくなる前[まえ]に、わたしはあなたにこれを告[つ]げる。"
  17: "あなたの後[あと]に、あなたの時[とき]を保[たも]つ者[もの]はない。その半分[はんぶん]さえない。」"
  18: "三番目[さんばんめ]の羽[はね]が起[お]こり、前[まえ]の者[もの]たちのように支配[しはい]したが、それも見[み]えなくなった。"
  19: "ほかのすべての羽[はね]にも同[おな]じことが起[お]こり、それぞれが一[ひと]つの支配[しはい]を保[たも]ち、やがて再[ふたた]び現[あらわ]れることはなかった。"
  20: "わたしが見[み]ると、見[み]よ、時[とき]が進[すす]むうちに、右[みぎ]の側[がわ]の羽[はね]が起[お]こり、彼[かれ]らもまた支配[しはい]を保[たも]とうとした。そのうちから支配[しはい]を保[たも]つ者[もの]も出[で]たが、すぐに見[み]えなくなった。"
  21: "そのうちの幾[いく]つかは起[お]こったが、支配[しはい]を保[たも]つことはなかった。"
  22: "その後[あと]わたしが見[み]ると、見[み]よ、十二[じゅうに]の羽[はね]と二[ふた]つの小[ちい]さな羽[はね]はもはや現[あらわ]れなくなっていた。"
  23: "鷲[わし]の体[からだ]には何[なに]も残[のこ]らず、ただ二[ふた]つの休[やす]んでいる頭[あたま]と六[むっ]つの小[ちい]さな羽[はね]だけが残[のこ]った。"
  24: "わたしが見[み]ると、見[み]よ、六[むっ]つの小[ちい]さな羽[はね]のうち二[ふた]つが分[わ]かれ、右[みぎ]の側[がわ]の頭[あたま]の下[した]にとどまった。四[よっ]つは自分[じぶん]の場所[ばしょ]にとどまった。"
  25: "わたしが見[み]ると、見[み]よ、翼[つばさ]の下[した]の羽[はね]たちが自[みずか]ら起[お]こって支配[しはい]を保[たも]とうとした。"
  26: "わたしが見[み]ると、見[み]よ、一[ひと]つが起[お]こったが、すぐに見[み]えなくなった。"
  27: "次[つぎ]のものたちは、前[まえ]のものたちよりも早[はや]く見[み]えなくなった。"
  28: "わたしが見[み]ると、見[み]よ、残[のこ]った二[ふた]つも、自[みずか]らもまた王[おう]になろうと考[かんが]えた。"
  29: "彼[かれ]らがそう考[かんが]えていると、見[み]よ、休[やす]んでいた頭[あたま]の一[ひと]つ、すなわち中[なか]の頭[あたま]が目[め]を覚[さ]ました。この頭[あたま]はほかの二[ふた]つの頭[あたま]よりも大[おお]きかったからである。"
  30: "わたしは、二[ふた]つの頭[あたま]がそれと結[むす]びついたのを見[み]た。"
  31: "見[み]よ、その頭[あたま]はそれに連[つら]なる者[もの]たちとともに向[む]きを変[か]え、王[おう]になろうとした二[ふた]つの翼[つばさ]の下[した]の羽[はね]を食[く]らった。"
  32: "この頭[あたま]は全[ぜん]地[ち]を恐[おそ]れさせ、地[ち]に住[す]む者[もの]たちを大[おお]きな苦[くる]しみをもって治[おさ]め、先[さき]にあったすべての翼[つばさ]にもまして、地[ち]の円[えん]の上[うえ]に権力[けんりょく]を保[たも]った。"
  33: "その後[あと]わたしが見[み]ると、見[み]よ、中[なか]の頭[あたま]も突然[とつぜん]見[み]えなくなり、翼[つばさ]も同[おな]じようになった。"
  34: "二[ふた]つの頭[あたま]が残[のこ]り、それらもまた同[おな]じように地[ち]とそこに住[す]む者[もの]たちの上[うえ]に王[おう]として君臨[くんりん]した。"
  35: "わたしが見[み]ると、見[み]よ、右[みぎ]の側[がわ]の頭[あたま]が、左[ひだり]の側[がわ]の頭[あたま]を食[く]らった。"
  36: "わたしは、わたしに語[かた]る声[こえ]を聞[き]いた。「前[まえ]を見[み]て、あなたが見[み]ているものをよく考[かんが]えなさい。」"
  37: "わたしが見[み]ると、見[み]よ、森[もり]から出[で]てきた怒[いか]り狂[くる]った獅子[しし]のように、それは鷲[わし]に向[む]かって人[ひと]の声[こえ]を放[はな]って言[い]った。"
  38: "「あなたは聞[き]きなさい。わたしはあなたに語[かた]ろう。いと高[たか]き方[かた]があなたに告[つ]げる。"
  39: "あなたは、わたしがわたしの世[よ]に王[おう]として立[た]てた四[よっ]つの獣[けもの]のうちから残[のこ]った者[もの]ではないか。彼[かれ]らによってその時[とき]の終[お]わりが来[く]るようにするためである。"
  40: "四番目[よんばんめ]の者が来[き]て、先[さき]にあったすべての獣[けもの]に勝[か]ち、大[おお]きな震[ふる]えをもって世[よ]を支配[しはい]し、全[ぜん]世[せ]界[かい]をひどい苦[くる]しみで治[おさ]め、長[なが]い間[あいだ]、欺[あざむ]きをもって地[ち]の円[えん]の上[うえ]に住[す]んだ。"
  41: "あなたは地[ち]を真実[しんじつ]をもって裁[さば]かなかった。"
  42: "あなたは柔和[にゅうわ]な者[もの]たちを砕[くだ]き、平和[へいわ]を愛[あい]する者[もの]たちを傷[きず]つけ、偽[いつわ]りを好[この]み、益[えき]を生[しょう]じる者[もの]たちの住[す]まいを荒[あ]らし、あなたに害[がい]を加[くわ]えなかった者[もの]たちの城壁[じょうへき]を低[ひく]くした。"
  43: "あなたの侮辱[ぶじょく]はいと高[たか]き方[かた]に上[のぼ]り、あなたの高[こう]慢[まん]は力[ちから]ある者[もの]に上[のぼ]った。"
  44: "いと高[たか]き方[かた]は高[こう]慢[まん]の時[とき]々[どき]をご覧[らん]になった。見[み]よ、それらは終[お]わり、その不法[ふほう]は満[み]ちた。"
  45: "だから、鷲[わし]よ、あなたは現[あらわ]れてはならない。恐[おそ]ろしい翼[つばさ]も、逆[さか]らった小[ちい]さな羽[はね]も、悪[わる]い頭[あたま]も、最[もっと]も悪[わる]い爪[つめ]も、むなしい体[からだ]すべてとともに。"
  46: "そうして全[ぜん]地[ち]は息[いき]をつき、あなたの力[ちから]から解[と]き放[はな]たれて自由[じゆう]になり、それを造[つく]られた方[かた]の裁[さば]きとあわれみに望[のぞ]みを置[お]くであろう。」"

notes:
  1: "«восхождаше от моря орел, емуже бяху дванадесять крил пернатых и главы три» — «поднимался от моря орёл, у которого было двенадцать крыльев пернатых и три головы». Числа — буквально: 十二の翼、三つの頭."
  2: "«простираше криле свои по всей земли, и вси ветри небеснии надыхаху въ него и собирахуся» — «простирал крылья свои по всей земле, и все ветры небесные дули на него и собирались»; слав. не называет, что собиралось; ru добавляет «облака» — внесено как 雲[くも] (по смыслу)."
  3: "«от перия его раждахуся сопротивная перия, и тая творяхуся в перийцах дробныхъ и малых» — «из перьев его рождались другие перья, и они делались мелкими и малыми перьями»; «сопротивная» здесь — «противные, иные», не «враждебные»; diminutiv «перийца» передано 小[ちい]さな羽[はね]."
  4: "«главы его бяху покойны, и средняя глава бе болши инех глав, но та покояшеся с ними» — «головы его были в покое, и средняя голова была больше других голов, но и та покоилась с ними»."
  5: "«орел летяще крилами своими и воцарися на земли и над живущими на ней» — «орёл летал крыльями своими и воцарился над землёй и над живущими на ней»."
  6: "«яко повиновена бяху ему вся поднебесная» — «что всё поднебесное было покорно ему»; «никтоже ему противляшеся ни един от твари, яже есть на земли» — «никто не противился ему, ни одна из тварей, какие есть на земле»."
  7: "«воста орел на ногти своя» — «орёл встал на когти свои»; «испусти глас перием своим» — «испустил голос к перьям своим»."
  8: "«не бдите вси вкупе, спите един кийждо в месте своем и по времени бдите» — «не бодрствуйте все вместе, спите каждый на своём месте и по времени бодрствуйте»."
  9: "«главы же на последок да сохранятся» — «головы же на конец (последок) да сохранятся». Здесь речь орла закрывается."
  10: "«глас не исхождаше от глав его, но от среды тела его» — «голос исходил не от голов его, но из средины тела его»."
  11: "«исчислих противная перия его, и се, сих бяше осмь» — «я исчислил иные перья его, и вот, их было восемь». Число — буквально: 八."
  12: "«о десную страну воста едино перо и воцарися над всею землею» — «с правой стороны встало одно перо и воцарилось над всею землёю»."
  13: "«прииде ему конец, и не явися место его, и ино воста и царствоваше: тое много держа время» — «пришёл ему конец, и не стало видно места его; и иное встало и царствовало: оно много держало времени»."
  14: "«грядяше конецъ его, да не явится якоже прежднее» — «приходил конец его, чтобы не явилось, как прежнее»; предложение продолжается в 11:15."
  15: "«глас испущен бысть тому, глаголя» — «голос был испущен к нему, говоря»; речь 11:16–17 — «…»."
  16: "«слыши ты, еже толико время держало еси землю» — «слушай ты, которое столько времени держало землю» — слав. согласование по среднему роду (перо); «прежде неже начнеши не являтися» — «прежде нежели начнёшь не являться» (двойное отрицание), передано «прежде нежели станешь невидимым»."
  17: "«никтоже последи тебе одержит время твое, но ни пол его» — «никто после тебя не удержит время твоё, ни даже половины его»."
  18: "«воздвижеся третие и одержа началство, якоже и преждняя, и не явися и тое» — «поднялось третье и держало начальство, как и прежние, и не явилось и оно»."
  19: "«тако случашеся всем иным, коемуждо особно началство содержати и паки никогда явитися» — «так случалось со всеми иными: каждому особо держать начальство и потом никогда не явиться»."
  20: "«во время последствующее перие воздвизахуся о десную страну, да одержатъ и тии началство» — «в последующее время перья поднимались с правой стороны, чтобы и они получили начальство»; «от тех быша, иже содержаху, но обаче абие не являхуся» — «из них были и такие, которые держали, но тотчас исчезали»."
  21: "«ибо и нецыи от них воздвизахуся, но не содержаху началства» — «ибо и некоторые из них поднимались, но не держали начальства»."
  22: "«не явишася дванадесять перий и два перийца» — «не явились двенадцать перьев и два малых пера». Числа — буквально: 十二と二."
  23: "«ничтоже бяше остало в теле орли, токмо две главы покоящияся и шесть перийц» — «ничего не осталось в теле орла, кроме двух голов в покое и шести малых перьев». Числа — буквально: 二つの頭、六つの小羽."
  24: "«шестим перийцам разделена суть два и пребыста под главою, яже есть на десней стране, ибо четыри пребыша в месте своем» — «из шести малых перьев отделились два и остались под головою, которая на правой стороне, а четыре остались на своём месте». Числа — буквально: 二つと四つ."
  25: "«подкрилия мышляху себе воздвигнути и одержати началство» — «подкрыльные [перья] замышляли подняться и получить начальство»; «подкрилие» — перо под крылом, 翼[つばさ]の下[した]の羽[はね]."
  26: "«едино воздвижено есть, но абие не явися» — «одно поднялось, но тотчас исчезло»."
  27: "«и вторая скорее, неже прежняя, не явишася» — «и следующие (вторые) скорее прежних исчезли»; слав. мн. ч. среднего рода, передано 次[つぎ]のものたち."
  28: "«два, яже остастася въ себе сами, помышляста и тая царствовати» — «два, которые остались сами по себе, замышляли и они царствовать»."
  29: "«едина от покоящихся глав, яже бяше средняя, возбуждашеся: сия бо бяше от дву главу болшая» — «одна из покоящихся голов, которая была средняя, пробудилась: она была из двух голов большая»."
  30: "«яко соединены суть две главы с собою» — «что две головы соединились с нею» (слав. «с собою» — с нею, с среднею)."
  31: "«обращена есть глава с теми, яже с нею бяху, и снеде два подкрылята, яже помышляста царствовати» — «голова обратилась с теми, которые были с нею, и пожрала два подкрыльных пера, которые замышляли царствовать»."
  32: "«обладаше на ней теми, иже обитают на земли, с трудностию многою» — «владела на ней теми, кто обитает на земле, с великим угнетением»; «власть обдержа над кругом земнымъ паче всех крил, яже быша» — «держала власть над кругом земным более всех крыльев, какие были»."
  33: "«средняя глава внезапу не явися, и сия якоже криле» — «средняя голова внезапно исчезла, и она — как крылья»."
  34: "«остастеся же две главы, яже и те такожде царствовасте на земли и над обитающими на ней» — «остались две головы, которые и те так же царствовали на земле и над обитающими на ней»."
  35: "«пожре глава, сущая о десную страну, оную, яже о шуюю» — «пожрала голова, которая с правой стороны, ту, которая с левой»."
  36: "«зри противу тебе и разсмотряй еже видиши» — «смотри перед собою и рассматривай, что видишь» (голос к Ездре)."
  37: "«якоже лев разгневанъ от леса рыкающь» — «как лев разгневанный, из леса рыкающий»; «испускаше глас человеческии ко орлу» — «испускал голос человеческий к орлу»; подлежащее — лев, но слав. «видех, яко испускаше» допускает и орла, поэтому в тексте それは (о льве)."
  38: "«слыши ты, и возглаголю тебе, и речет вышний тебе» — «слушай ты, и я буду говорить тебе, и скажет тебе Вышний»."
  39: "«не ты ли еси, иже остался от четырехъ животных, яже сотворих царствовати в веце моем» — «не ты ли тот, кто остался из четырёх животных, которых Я поставил царствовать в веке Моём»; «да чрез них приидет конец века их» — «чтобы через них пришёл конец века их»."
  40: "«четвертый грядый победи вся животная, яже преидоша» — «четвёртый пришедший победил всех животных, которые прошли»; «властию одержа век со трепетомъ многим и всю вселенную с трудностию лютою» — «властью держал век в великом трепете и всю вселенную в лютом угнетении»; «обиташе толико времен на крузе земнем съ лестию» — «обитал столько времени на круге земном с лестью (коварством)»."
  41: "«судил еси землю не со истиною» — «ты судил землю не по истине»."
  42: "«сокрушил бо еси кротких и повредил еси миролюбивых, и возлюбил ложных» — «ибо ты сокрушил кротких и повредил миролюбивых, и возлюбил ложных»; «разорилъ еси жилища их, иже плод творяху, и смирилъ еси стены их, иже тебе не повредиша» — «разорил жилища тех, кто приносил плод, и смирил стены тех, кто тебе не повредил»."
  43: "«взыде укорение твое к вышнему и гордыня твоя ко крепкому» — «взошло укорение (обида) твоё к Вышнему и гордыня твоя к Крепкому»."
  44: "«узре вышний гордая времена, и се, скончана суть, и беззакония его исполнишася» — «увидел Вышний гордые времена, и вот, они окончены, и беззакония его исполнились»; «его» — орла."
  45: "«не являйся ты, орле, и криле твои грозныя и перийца твоя строптивая, и главы твоя лукавыя, и ногти твои злейшии, и все тело твое суетное» — «не являйся ты, орёл, и крылья твои грозные, и перья твои строптивые, и головы твои лукавые, и когти твои злейшие, и всё тело твоё суетное»; слав. перечисление в именительном — в тексте «…も…も»."
  46: "«яко да прохладится вся земля и обратится свободна от твоея силы, и уповает на судъ и милосердие того, иже сотвори ю» — «дабы прохладилась вся земля и обратилась свободной от силы твоей, и уповала на суд и милосердие Того, кто сотворил её». Здесь речь льва закрывается."
