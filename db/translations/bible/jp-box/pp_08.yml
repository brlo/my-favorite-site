# jp-box, Песнь Песней, глава 8. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для книги нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому;
# поэзия с параллелизмами не сглаживается.
# Глава 8: 14 стихов. Желание братской близости и встреча (1–2), объятия (3),
# заклятие дочерей Иерусалима (4), хор о восходящей (5a), рождение под яблоней (5b),
# печать на сердце, «крепка, как смерть, любовь», пламя (6–7), братья о малой
# сестре (8–9), её ответ (10), виноградник Соломона в Вееламоне (11–12),
# голос возлюбленного в садах (13), «беги, возлюбленный мой» (14).
# Голоса: женщина — без кавычек (1–4, 5b–7, 10–12, 14); прочие — 「…」: хор 5a,
# братья 8–9 (одна цитата), возлюбленный 13.
# Нумерация по gr: 14 стихов; деление совпадает с csl-ru и ru.
# 〔…〕 нет: все стихи есть в gr-lxx-byz. Слав. добавление «тамо мя научиши» (8:2)
# в LXX отсутствует; по паритету внесено в основной текст без скобок, отмечено
# в notes. Расхождения 8:6 («углие огненно» в скобках у слав.), 8:10 (слав. «их»)
# — в notes.
# Сносок ⟨…⟩ нет: новых терминов глава не вводит (マンドラゴラ — уже в 7:14, кандидат
# в отчёт, сноска не ставится). Имена и топонимы — транслитерация греческого (LXX).

