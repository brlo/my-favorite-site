verses:
  1: "あなたが、わたしの母[はは]の乳房[ちぶさ]を吸[す]った、わたしの兄弟[きょうだい]であったなら。外[そと]であなたを見[み]つけて口[くち]づけしても、人[ひと]はわたしを蔑[さげす]まない。"
  2: "わたしはあなたを伴[ともな]い、わたしの母[はは]の家[いえ]、わたしを宿[やど]した者の奥[おく]の間[ま]へ連[つ]れて行[い]こう。そこで、あなたはわたしに教[おし]えてくれる。香[こう]を調[ととの]えたぶどう酒[しゅ]、わたしのざくろの果汁[かじゅう]であなたに飲[の]ませよう。"
  3: "その左[ひだり]の手[て]はわたしの頭[あたま]の下[した]にあり、その右[みぎ]の手はわたしを抱[だ]きしめる。"
  4: "エルサレムの娘[むすめ]たち、わたしはあなたがたを、野[の]の力[ちから]と野の強[つよ]さにかけて誓[ちか]わせる。愛[あい]が自[みずか]ら望[のぞ]むまで、あなたがたは愛を起[お]こさず、目覚[めざ]めさせてもならない。"
  5: "「白[しろ]く装[よそお]い、愛[あい]する者[もの]に寄[よ]りかかって上[のぼ]って来[く]るこの女[おんな]はだれか。」りんごの木[き]の下[した]で、わたしはあなたを目覚[めざ]めさせた。そこであなたの母[はは]はあなたのことで産[う]みの苦[くる]しみを味[あじ]わい、そこであなたを生[う]んだ者[もの]も産みの苦しみを味わった。"
  6: "わたしを印章[いんしょう]のようにあなたの心[こころ]に、印章のようにあなたの腕[うで]に置[お]いてほしい。愛[あい]は死[し]のように強[つよ]く、嫉妬[しっと]はよみのように厳[きび]しいからである。その翼[つばさ]は火[ひ]の翼、その炎[ほのお]は燃[も]え盛[さか]る。"
  7: "多[おお]くの水[みず]も愛[あい]を消[け]すことはできず、川[かわ]もそれを押[お]し流[なが]すことはない。人[ひと]がその全[すべ]ての財産[ざいさん]を愛のために与[あた]えても、その人は蔑[さげす]まれ、蔑み尽[つ]くされる。"
  8: "「わたしたちには小[ちい]さな妹[いもうと]があり、乳房[ちぶさ]もまだない。妹[いもうと]のことが語[かた]られる日[ひ]に、わたしたちは妹のために何[なに]をしようか。"
  9: "もし妹[いもうと]が城壁[じょうへき]なら、その上[うえ]に銀[ぎん]の胸壁[きょうへき]を建[た]てよう。もし妹が扉[とびら]なら、その上に杉[すぎ]の板[いた]を据[す]えよう。」"
  10: "わたしは城壁[じょうへき]、わたしの乳房[ちぶさ]は塔[とう]のよう。わたしは彼[かれ]の目[め]に、平和[へいわ]を見出[みいだ]す者[もの]として映[うつ]った。"
  11: "ソロモンには、ベエラモンにぶどう畑[ばたけ]があった。彼はそのぶどう畑を番人[ばんにん]たちに貸[か]し、それぞれがその実[み]の代[か]わりに銀[ぎん]千枚[せんまい]を納[おさ]めることになっていた。"
  12: "わたしのぶどう畑[ばたけ]はわたしのもの、わたしの前[まえ]にある。ソロモンよ、千[せん]はあなたに、二百[にひゃく]はその実[み]を守[まも]る者[もの]たちに。"
  13: "「園[その]に住[す]む者[もの]よ、友[とも]らはあなたの声[こえ]に耳[みみ]を傾[かたむ]けている。わたしにもその声を聞[き]かせてほしい。」"
  14: "逃[に]げて行[い]け、わが愛[あい]する者[もの]よ、かもしかや鹿[しか]の子[こ]のように、香[かお]りの山々[やまやま]へ。"

notes:
  1: "Голос: женщина. Τίς δῴη σε ἀδελφιδόν μου θηλάζοντα μαστοὺς μητρός μου — о, если бы ты был братом моим, сосавшим груди матери моей (ἀδελφιδός здесь буквально «брат», а не «возлюбленный»; θηλάζω — сосать грудь; δῴη — оптатив). εὑροῦσά σε ἔξω φιλήσω σε — найдя тебя на улице, я бы поцеловала тебя (φιλέω — целовать). καί γε οὐκ ἐξουδενώσουσίν μοι — и притом не обесчестили бы меня (ἐξουδενόω — уничижать; слав. «ктому не уничижат мене»)."
  2: "Голос: женщина. παραλήμψομαί σε, εἰσάξω σε εἰς οἶκον μητρός μου — возьму тебя, введу тебя в дом матери моей (παραλαμβάνω — принимать, уводить с собой); εἰς ταμίειον τῆς συλλαβούσης με — в покой зачавшей меня (ταμίειον — внутренняя комната, хранилище; συλλαμβάνω — зачинать). ποτιῶ σε ἀπὸ οἴνου τοῦ μυρεψικοῦ, ἀπὸ νάματος ῥοῶν μου — напою тебя вином благовонным, соком гранатов моих (μυρεψικός — от μυρεψός, составитель мазей; νᾶμα — поток, сок). Слав. добавляет «тамо мя научиши» (там ты научишь меня), чего в LXX нет; по паритету добавление внесено в основной текст без 〔…〕 (так же в Син.), в шапке отмечено."
  3: "Голос: женщина. Дословный повтор 2:6: εὐώνυμος αὐτοῦ ὑπὸ τὴν κεφαλήν μου — левая рука его под головою моею (εὐώνυμος — левый; сказуемого нет, как и в греческом). ἡ δεξιὰ αὐτοῦ περιλήμψεταί με — правая его обнимет меня (περιλαμβάνω). Формулировка согласована с главой 2 (2:6), чтобы повтор читался как повтор."
  4: "Голос: женщина. ὥρκισα ὑμᾶς, θυγατέρες Ιερουσαλημ — заклинаю вас, дочери Иерусалима (ὁρκίζω — заклинать, брать клятву). ἐν ταῖς δυνάμεσιν καὶ ἐν ταῖς ἰσχύσεσιν τοῦ ἀγροῦ — силами и крепостями поля (δύναμις, ἰσχύς; слав. «в силах и в крепостех селных»): та же формула заклятия, что в 2:7 и 3:5, и формулировка припева сохранена единой; «сернами или полевыми ланями» — чтение Синодального по масоретскому тексту, в LXX и слав. его нет. τί ἐγείρητε καὶ τί ἐξεγείρητε τὴν ἀγάπην, ἕως ἂν θελήσῃ — что вы будите и что возбуждаете любовь, доколе она не пожелает; в 2:7 и 3:5 стоит ἐὰν ἐγείρητε, здесь τί ἐγείρητε (вопросительная форма с тем же запретительным смыслом), поэтому по-японски передан запрет, как в припеве."
  5: "Часть a — голос хора в 「」: Τίς αὕτη ἡ ἀναβαίνουσα λελευκανθισμένη — кто эта восходящая убелённая (λευκαίνω — делать белым; слав. «убелена»); в LXX нет «от пустыни» (это масоретское чтение, есть у Син.), поэтому 荒野から не внесено. ἐπιστηριζομένη ἐπὶ τὸν ἀδελφιδὸν αὐτῆς — опирающаяся на возлюбленного своего (ἐπιστηρίζω — утверждать, подпирать). Часть b — голос женщины: Ὑπὸ μῆλον ἐξήγειρά σε — под яблоней я разбудила тебя (μῆλον — яблоко); ἐκεῖ ὠδίνησέν σε ἡ μήτηρ σου, ἐκεῖ ὠδίνησέν σε ἡ τεκοῦσά σου — там родила тебя в муках мать твоя, там родила тебя в муках родившая тебя (ὠδίνω — мучиться родами; двойное ἐκεῖ сохранено)."
  6: "Голос: женщина. Θές με ὡς σφραγῖδα ἐπὶ τὴν καρδίαν σου — положи меня, как печать, на сердце твоё (σφραγίς — печать, перстень-печатка). ὅτι κραταιὰ ὡς θάνατος ἀγάπη — ибо крепка, как смерть, любовь (κραταιός — сильный, могучий); σκληρὸς ὡς ᾅδης ζῆλος — жестока, как ад (よみ), ревность (ζῆλος — ревность, пыл; слав. «ревность»). περίπτερα αὐτῆς περίπτερα πυρός, φλόγες αὐτῆς — крылья её — крылья огня, пламя её (περίπτερον — крыло; φλόξ — пламя); в LXX при «пламя её» сказуемое опущено и стих обрывается, в слав. стоит «крила ея крила огня, (углие огненно) пламы ея» — «углие огненно» в скобках и в LXX отсутствует, поэтому не переведено; оборванная клауза передана глагольно (燃え盛る), чтобы фраза не повисла."
  7: "Голос: женщина. ὕδωρ πολὺ οὐ δυνήσεται σβέσαι τὴν ἀγάπην — многие воды не смогут угасить любовь (σβέννυμι — гасить). καὶ ποταμοὶ οὐ συγκλύσουσιν αὐτήν — и реки не потопят её (συγκλύζω — заливать, затоплять). ἐὰν δῷ ἀνὴρ τὸν πάντα βίον αὐτοῦ ἐν τῇ ἀγάπῃ — если отдаст человек всё достояние своё за любовь (βίος — жизнь, средства к жизни, имение); ἐξουδενώσει ἐξουδενώσουσιν αὐτόν — уничижением уничижат его (усиление, слав. «уничижением уничижат его»; Син. «отвергнут с презреньем»)."
  8: "Голос: братьев (кавычка открывается здесь и закрывается в ст. 9). Ἀδελφὴ ἡμῖν μικρά — сестра наша мала (ἀδελφή здесь буквально «сестра»). καὶ μαστοὺς οὐκ ἔχει — и грудей не имеет, т. е. ещё не взрослая. τί ποιήσωμεν τῇ ἀδελφῇ ἡμῶν ἐν ἡμέρᾳ, ᾗ ἐὰν λαληθῇ ἐν αὐτῇ — что сделаем сестре нашей в день, когда о ней будут говорить (λαλέω — говорить; слав. «в оньже аще глаголатися будет ей»; Син. «когда будут свататься за нее» — раскрытие смысла, не внесено)."
  9: "Голос: братьев (кавычка закрывается). εἰ τεῖχός ἐστιν, οἰκοδομήσωμεν ἐπ᾽ αὐτὴν ἐπάλξεις ἀργυρᾶς — если она стена, построим на ней серебряные зубцы (ἐπάλξεις — зубцы, забрала; слав. «забрала сребряна»). καὶ εἰ θύρα ἐστίν, διαγράψωμεν ἐπ᾽ αὐτὴν σανίδα κεδρύνην — если она дверь, начертаем на ней кедровую доску (διαγράφω — начертывать, размечать; σανίς — доска; κέδρινος — кедровый; слав. «напишем на ней дску кедрову»)."
  10: "Голос: женщина (ответ на слова братьев). Ἐγὼ τεῖχος, καὶ μαστοί μου ὡς πύργοι — я стена, и груди мои, как башни. ἐγὼ ἤμην ἐν ὀφθαλμοῖς αὐτοῦ ὡς εὑρίσκουσα εἰρήνην — я была в глазах его, как обретающая мир (εὑρίσκω — находить; слав. «аз бех во очию их аки обретающая мир»). В слав. здесь мн. ч. «их», в LXX — αὐτοῦ (ед. ч.); контекст (возлюбленный) и Син. дают ед. ч., поэтому перевод по LXX, слав. чтение отмечено."
  11: "Голос: женщина. Ἀμπελὼν ἐγενήθη τῷ Σαλωμων ἐν Βεελαμων — виноградник был у Соломона в Вееламоне (Βεελαμων; слав. «во вееламоне»; Син. «в Ваал-Гамоне» — по масоретскому בַּעַל הָמוֹן; в тексте ベエラモン по LXX). ἔδωκεν τὸν ἀμπελῶνα αὐτοῦ τοῖς τηροῦσιν — отдал виноградник свой стерегущим (τηρέω — хранить, стеречь). ἀνὴρ οἴσει ἐν καρπῷ αὐτοῦ χιλίους ἀργυρίου — каждый муж принесёт за плод его тысячу серебра (ἀργύριον — серебро, сребреник; слав. «тысящу сребреник»)."
  12: "Голос: женщина. ἀμπελών μου ἐμὸς ἐνώπιόν μου — виноградник мой мой, предо мною (т. е. он при мне, под моей властью). οἱ χίλιοι σοί, Σαλωμων, καὶ οἱ διακόσιοι τοῖς τηροῦσι τὸν καρπὸν αὐτοῦ — тысяча тебе, Соломон, и двести стерегущим плод его. Чья именно тысяча и чьи двести, в стихе не сказано — домысел не вносился."
  13: "Голос: возлюбленный — 「」. Ὁ καθήμενος ἐν κήποις — сидящий (обитающий) в садах (κάθημαι — сидеть, обитать; слав. «седяй в вертоградех»); обращение к возлюбленной, хотя причастие мужского рода. ἑταῖροι προσέχοντες τῇ φωνῇ σου — товарищи, внимающие голосу твоему (ἑταῖρος — товарищ, друг; προσέχω — внимать). ἀκούτισόν με — дай мне услышать (ἀκουτίζω — заставлять слышать; слав. «глас твой внуши мне»)."
  14: "Голос: женщина. Φύγε, ἀδελφιδέ μου — беги, возлюбленный мой (φεύγω — бежать; слав. «бежи, брате мой»). ὁμοιώθητι τῇ δορκάδι ἢ τῷ νεβρῷ τῶν ἐλάφων — уподобься серне или оленёнку оленей (δορκάς — серна; νεβρός — оленёнок; ἔλαφος — олень). ἐπὶ ὄρη ἀρωμάτων — по горам ароматов (ἄρωμα — благовоние; ср. 2:17 «по горам расселин»)."
