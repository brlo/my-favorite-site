# jp-box, Бытие, глава 9. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru),
# русский Синодальный (ru) и, где есть, jp-joc (1901, public domain).
# Язык — современный 常体, без 文語; порядок членов и деление на клаузы — по греческому.
# Глава 9: завет с Ноем и знамение радуги (1–17), сыновья Ноя (18–19),
# опьянение Ноя и проклятие Ханаана (20–29).
# Красного и синего нет: Бог говорит, но это не прямая речь Христа во плоти; «<j>» не ставится.
# Прямая речь Бога — в 「…」: 1–7 (одна речь), 9–11, 12–16, 17; речь Ноя — 25–27.
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено по базе).
# LXX отличается от масоретского текста в 9:6 (нет «рукою человека» — агент казни не назван),
# 9:8–17 (завет и радуга) и в именах (Ханаан, а не «Хам» в проклятии). Отличия — в notes.
# Сносок ⟨…⟩ нет: 洪水, 契約, 虹, 天幕, 祭壇, 奴隷 уже в корпусе или понятны.
# jp-ni не использовался.

