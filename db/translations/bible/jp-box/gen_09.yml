verses:
  1: "神[かみ]はノアとその息子[むすこ]たちを祝福[しゅくふく]して言[い]われた。「産[う]めよ、増[ふ]えよ、地[ち]に満[み]ちよ、地[ち]を支配[しはい]せよ。"
  2: "あなたがたへの恐[おそ]れとおののきは、地[ち]のすべての獣[けもの]、天[てん]のすべての鳥[とり]、地[ち]に動[うご]くすべてのもの、海[うみ]のすべての魚[さかな]の上[うえ]にある。わたしはそれらをあなたがたの手[て]に与[あた]えた。"
  3: "すべての這[は]うもの、すなわち生[い]きているものは、あなたがたの食物[しょくもつ]となる。わたしはすべてのものを、青[あお]菜[な]のようにあなたがたに与[あた]えた。"
  4: "ただ、肉[にく]をその命[いのち]の血[ち]とともに食[た]べてはならない。"
  5: "あなたがたの命[いのち]の血[ち]についても、わたしはそれを求[もと]める。すべての獣[けもの]の手[て]から、わたしはそれを求[もと]める。人[ひと]の手[て]から、すなわちその兄弟[きょうだい]の手[て]から、わたしは人[ひと]の命[いのち]を求[もと]める。"
  6: "人[ひと]の血[ち]を流[なが]す者[もの]は、その血[ち]を流[なが]される。神[かみ]が人[ひと]をご自分[じぶん]の姿[かたち]に造[つく]られたからである。"
  7: "あなたがたは産[う]めよ、増[ふ]えよ、地[ち]に満[み]ちよ、その上[うえ]に増[ふ]えよ。」"
  8: "神[かみ]はノアと、彼[かれ]とともにある息子[むすこ]たちに言[い]われた。"
  9: "「見[み]よ、わたしはあなたがたと、あなたがたの後[のち]の子孫[しそん]とに、わたしの契約[けいやく]を立[た]てる。"
  10: "あなたがたとともにいるすべての生[い]き物[もの]とも、すなわち鳥[とり]、家畜[かちく]、あなたがたとともにいる地[ち]のすべての獣[けもの]、箱舟[はこぶね]から出[で]たすべてのものとともに、わたしは契約[けいやく]を立[た]てる。"
  11: "わたしはあなたがたとわたしの契約[けいやく]を立[た]てる。もはや、すべての肉[にく]が洪水[こうずい]の水[みず]によって死[し]ぬことはない。地[ち]を滅[ほろ]ぼす洪水[こうずい]の水[みず]も、もはやない。」"
  12: "主[しゅ]なる神[かみ]はノアに言[い]われた。「わたしとあなたがたとの間[あいだ]、またあなたがたとともにいるすべての生[い]きた魂[たましい]との間[あいだ]に、わたしが永遠[えいえん]の代々[よよ]に与[あた]える契約[けいやく]のしるしは、これである。"
  13: "わたしはわたしの虹[にじ]を雲[くも]の中[なか]に置[お]く。それは、わたしと地[ち]との間[あいだ]の契約[けいやく]のしるしとなる。"
  14: "わたしが雲[くも]を地[ち]の上[うえ]に覆[おお]いかぶせるとき、虹[にじ]が雲[くも]の中[なか]に現[あらわ]れる。"
  15: "わたしは、わたしとあなたがたとの間[あいだ]、またすべての肉[にく]の中[なか]にいるすべての生[い]きた魂[たましい]との間[あいだ]にある、わたしの契約[けいやく]を思[おも]い起[お]こす。水[みず]はもはや、すべての肉[にく]を滅[ほろ]ぼす洪水[こうずい]とはならない。"
  16: "虹[にじ]が雲[くも]の中[なか]にあると、わたしはそれを見[み]、わたしと、地[ち]の上[うえ]にあるすべての肉[にく]の中[なか]のすべての生[い]きた魂[たましい]との間[あいだ]にある永遠[えいえん]の契約[けいやく]を思[おも]い起[お]こすために。」"
  17: "神[かみ]はノアに言[い]われた。「これは、わたしと地[ち]の上[うえ]のすべての肉[にく]との間[あいだ]に立[た]てた契約[けいやく]のしるしである。」"
  18: "ノアの息子[むすこ]たちのうち、箱舟[はこぶね]から出[で]たのは、セム、ハム、ヤフェトであった。ハムはカナンの父[ちち]である。"
  19: "この三[さん]人[にん]がノアの息子[むすこ]たちである。彼[かれ]らから、全[ぜん]地[ち]に人々[ひとびと]が散[ち]らばった。"
  20: "ノアは地[ち]を耕[たがや]すことを始[はじ]め、ぶどう園[えん]を植[う]えた。"
  21: "彼[かれ]はそのぶどう酒[しゅ]を飲[の]み、酔[よ]って、自分[じぶん]の天幕[てんまく]の中[なか]で裸[はだか]になった。"
  22: "カナンの父[ちち]ハムは、父[ちち]の裸[はだか]を見[み]て、外[そと]に出[で]て、二人[ふたり]の兄弟[きょうだい]に告[つ]げた。"
  23: "セムとヤフェトは衣[ころも]を取[と]り、それを二人[ふたり]の背[せ]に掛[か]け、後[うしろ]向[む]きに歩[ある]いて、父[ちち]の裸[はだか]を覆[おお]った。彼[かれ]らの顔[かお]は後[うしろ]向[む]きであり、彼[かれ]らは父[ちち]の裸[はだか]を見[み]なかった。"
  24: "ノアはぶどう酒[しゅ]から醒[さ]め、末[すえ]の息子[むすこ]が自分[じぶん]にしたことを知[し]った。"
  25: "そして言[い]った。「カナンは呪[のろ]われる。彼[かれ]は兄弟[きょうだい]たちの奴隷[どれい]の中[なか]の奴隷[どれい]となる。」"
  26: "また言[い]った。「セムの神[かみ]である主[しゅ]は、ほめたたえられる。カナンは彼[かれ]の奴隷[どれい]となる。"
  27: "神[かみ]がヤフェトを広[ひろ]くし、彼[かれ]がセムの天幕[てんまく]に住[す]まうように。カナンは彼[かれ]らの奴隷[どれい]となる。」"
  28: "ノアは洪水[こうずい]の後[のち]、三百五十年[さんびゃくごじゅうねん]生[い]きた。"
  29: "ノアの日[ひ]はすべて九百五十年[きゅうひゃくごじゅうねん]であった。そして、彼[かれ]は死[し]んだ。"

notes:
  1: "ηὐλόγησεν ὁ θεὸς τὸν Νωε — 神はノアを祝福して. Αὐξάνεσθε καὶ πληθύνεσθε — 産めよ、増えよ (imper. praes., букв. «растите и умножайтесь»; ср. 1:28). πληρώσατε τὴν γῆν — 地に満ちよ. κατακυριεύσατε αὐτῆς — 地を支配せよ (κατακυριεύω — «господствовать над»)."
  2: "ὁ τρόμος καὶ ὁ φόβος — 恐れとおののき (τρόμος — «трепет»). ἐπὶ πάντα τὰ ὄρνεα τοῦ οὐρανοῦ — 天のすべての鳥. ὑπὸ χεῖρας ὑμῖν δέδωκα — あなたがたの手に与えた (perfect: дар уже совершён)."
  3: "πᾶν ἑρπετόν, ὅ ἐστιν ζῶν — すべての這うもの、すなわち生きているもの (ἑρπετόν — «пресмыкающееся», здесь вся живность). ὡς λάχανα χόρτου — 青菜のように (λάχανον — «огородная зелень»; ср. 1:29–30)."
  4: "πλὴν κρέας ἐν αἵματι ψυχῆς οὐ φάγεσθε — только плоти с душою её, с кровью её, не ешьте: запрет крови как носительницы жизни, ещё до Моисеева закона."
  5: "τὸ ὑμέτερον αἷμα τῶν ψυχῶν ὑμῶν ἐκζητήσω — вашу кровь, в которой жизнь ваша, взыщу (ἐκζητέω — «требовать обратно», кровь как долг). ἐκ χειρὸς ἀνθρώπου ἀδελφοῦ — от руки человека, брата его (LXX: «человека, брата»)."
  6: "ὁ ἐκχέων αἷμα ἀνθρώπου ἀντὶ τοῦ αἵματος αὐτοῦ ἐκχυθήσεται — кто прольёт кровь человеческую, того кровь прольётся: в LXX нет «рукою человека» (это масоретское чтение, есть в слав. и Синодальном), поэтому агент казни не назван. ἐν εἰκονι θεοῦ — в образе Божием (ср. 1:26–27)."
  7: "ὑμεῖς δὲ αὐξάνεσθε καὶ πληθύνεσθε — あなたがたは産めよ、増えよ. πληθύνεσθε ἐπ᾽ αὐτῆς — その上に増えよ (повтор, как в LXX)."
  8: "λέγων — «говоря»: по-японски переходит в 「言われた。」"
  9: "ἀνίστημι τὴν διαθήκην μου — 契約を立てる (ἀνίστημι — «ставить», не «заключать»; ср. ст. 11–17). τῷ σπέρματι ὑμῶν μεθ᾽ ὑμᾶς — あなたがたの後の子孫に."
  10: "ψυχῇ τῇ ζώσῃ — 生き物 (букв. «живая душа»). ἀπὸ ὀρνέων καὶ ἀπὸ κτηνῶν — 鳥、家畜. ἀπὸ πάντων τῶν ἐξελθόντων ἐκ τῆς κιβωτοῦ — 箱舟から出たすべてのもの."
  11: "στήσω τὴν διαθήκην μου πρὸς ὑμᾶς — あなたがたと契約を立てる. οὐκ ἀποθανεῖται πᾶσα σὰρξ ἔτι — всеобъемлющее отрицание: «никакая плоть более не умрёт»; すべての肉 — πᾶσα σάρξ."
  12: "κύριος ὁ θεός — 主なる神. εἰς γενεὰς αἰωνίους — 永遠の代々に. σημεῖον τῆς διαθήκης — 契約のしるし."
  13: "τὸ τόξον μου — わたしの虹 (τόξον — «лук»: радуга как лук, положенный в облако; у jp-joc 虹). τίθημι — 置く («ставлю»)."
  14: "ἐν τῷ συννεφεῖν με νεφέλας ἐπὶ τὴν γῆν — わたしが雲を地の上に覆いかぶせるとき (συννεφέω — «покрывать облаками»). ὀφθήσεται τὸ τόξον — 虹が現れる."
  15: "μνησθήσομαι τῆς διαθήκης μου — 契約を思い起こす. ἐν πάσῃ σαρκί — すべての肉の中に. ὥστε ἐξαλεῖψαι — 滅ぼすために (ἐξαλείφω — «истреблять, стирать»)."
  16: "ὄψομαι τοῦ μνησθῆναι — 見て…思い起こすために (ὄψομαι с инфинитивом цели). διαθήκην αἰώνιον — 永遠の契約. ἥ ἐστιν ἐπὶ τῆς γῆς — 地の上にある."
  17: "τοῦτο τὸ σημεῖον — これは…しるし. ἧς διεθέμην — わたしが立てた (διατίθημι; ср. 15:18)."
  18: "οἱ ἐξελθόντες ἐκ τῆς κιβωτοῦ — 箱舟から出た. Χαμ ἦν πατὴρ Χανααν — ハムはカナンの父: пояснение LXX, важное для ст. 25."
  19: "τρεῖς οὗτοι — この三人. διεσπάρησαν ἐπὶ πᾶσαν τὴν γῆν — 全地に散らばった (διασπείρω)."
  20: "ἄνθρωπος γεωργὸς γῆς — 地を耕す人 (γεωργός — «земледелец»). ἤρξατο — 始めた. ἐφύτευσεν ἀμπελῶνα — ぶどう園を植えた."
  21: "ἐμεθύσθη — 酔って (μεθύσκομαι). ἐγυμνώθη ἐν τῷ οἴκῳ αὐτοῦ — 自分の天幕の中で裸になった (οἶκος — «дом»; контекст шатра, у jp-joc 幕)."
  22: "τὴν γύμνωσιν τοῦ πατρός — 父の裸. ἀνήγγειλεν — 告げた (ἀναγγέλλω — «возвещать»). ἔξω — 外に."
  23: "τὰ δύο νῶτα — 二人の背 (νῶτον — «спина»). ὀπισθοφανῶς — 後ろ向きに. συνεκάλυψαν — вместе покрыли."
  24: "ὁ υἱὸς αὐτοῦ ὁ νεώτερος — 末の息子 (νεώτερος — «младший»). ἐξένηψεν — 醒めた (ἐκνήφω — «протрезветь»)."
  25: "Ἐπικατάρατος Χανααν — カナンは呪われる (ἐπικατάρατος — «проклят»). παῖς οἰκέτης — 奴隷の中の奴隷 (букв. «раб-слуга»; слав. «раб рабом»). Проклят Ханаан, а не Хам — так в LXX и в масоретском тексте."
  26: "Εὐλογητὸς κύριος ὁ θεὸς τοῦ Σημ — セムの神である主はほめたたえられる (не «Бог Симов» как имя, а Господь, Бог Сима). παῖς αὐτοῦ — 彼の奴隷."
  27: "πλατύναι ὁ θεὸς τῷ Ιαφεθ — да распространит Бог Иафета (оптатив). κατοικησάτω ἐν τοῖς οἴκοις τοῦ Σημ — セムの天幕に住まうように. παῖς αὐτῶν — 彼らの奴隷 (мн. ч., как в LXX)."
  28: "μετὰ τὸν κατακλυσμόν — 洪水の後. τριακόσια πεντήκοντα ἔτη — 三百五十年."
  29: "πᾶσαι αἱ ἡμέραι Νωε — ノアの日はすべて. ἐννακόσια πεντήκοντα ἔτη — 九百五十年. ἀπέθανεν — 死んだ."
