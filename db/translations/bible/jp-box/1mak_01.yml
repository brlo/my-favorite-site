# jp-box, 1 Маккавейская, глава 1. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz и csl-ru глава 1 имеет 64 стиха (совпадает).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: 1–9 Александр Македонский, его смерть и раздел царства; 10–16 Антиох
# Епифан, корень греха, поход на Египет; 17–19 война с Птолемеем; 20–24 разграбление
# Иерусалима и святилища; 25–28 плач Израиля; 29–40 начальник податей, разорение
# города, крепость Акра, запустение святилища; 41–53 царский указ о едином народе,
# гонение, отступники; 54–64 мерзость запустения, сожжение книг закона, мученики.
# Голоса: 11 — слова беззаконных в 「…」; 41–51 — царский указ в косвенной речи,
# без кавычек (греч. acc. cum inf.); остальное — повествование.
# Термины: 聖所[せいしょ] — ἁγίασμα; 神殿[しんでん] — ναός; 祭壇[さいだん] — θυσιαστήριον/βωμός;
# 燔祭[はんさい] — ὁλοκαύτωμα; 安息日[あんそくび]; 律法[りっぽう] — νόμος; 契約[けいやく] — διαθήκη;
# 割礼[かつれい]/無割礼[むかつれい]; 異邦人[いほうじん] — ἔθνη; 偶像[ぐうぞう] — εἴδωλον;
# 戦利品[せんりひん] — σκῦλα; 要塞[ようさい] — ὀχύρωμα; 騎兵[きへい] — ἱππεῖς; 戦車[せんしゃ] — ἅρματα;
# 象[ぞう] — ἐλέφαντες; 王冠[おうかん] — διάδημα; 人質[ひとじち] — ὅμηρα.
#
tr_code: jp-box
