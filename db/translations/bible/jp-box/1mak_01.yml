verses:
  1: "フィリッポスの子[こ]であるマケドニア人[じん]アレクサンドロスが、キティムの地[ち]から出[で]て、ペルシア人[じん]とメディア人[じん]の王[おう]ダレイオスを撃[う]ち、彼[かれ]に代[か]わって王[おう]となり、まずギリシアを治[おさ]めた後[のち]のことであった。"
  2: "彼は多[おお]くの戦[たたか]いを起[お]こし、多[おお]くの要塞[ようさい]を取[と]り、地[ち]の王[おう]たちを殺[ころ]した。"
  3: "彼は地[ち]の果[は]てまで行[い]き渡[わた]り、多[おお]くの民[たみ]から戦利品[せんりひん]を取[と]った。地[ち]は彼[かれ]の前[まえ]に静[しず]まり、彼は高[たか]く上[あ]げられ、その心[こころ]は高[たか]ぶった。"
  4: "彼は非常[ひじょう]に強[つよ]い軍勢[ぐんぜい]を集[あつ]め、国[くに]々[ぐに]と民[たみ]と暴君[ぼうくん]たちを支配[しはい]し、彼らは彼[かれ]に貢[みつ]ぎを納[おさ]める者[もの]となった。"
  5: "その後[のち]、彼は床[とこ]に伏[ふ]し、自分[じぶん]が死[し]ぬことを知[し]った。"
  6: "彼は自分[じぶん]の高名[こうめい]な若[わか]い家臣[かしん]たち、すなわち幼[おさな]い時[とき]から共[とも]に育[そだ]った者[もの]たちを呼[よ]び、まだ生[い]きているうちに、彼らに自分[じぶん]の王国[おうこく]を分[わ]け与[あた]えた。"
  7: "アレクサンドロスは十二[じゅうに]年[ねん]の間[あいだ]王[おう]として治[おさ]め、そして死[し]んだ。"
  8: "彼の家臣[かしん]たちは、それぞれ自分[じぶん]の場所[ばしょ]で権力[けんりょく]を握[にぎ]った。"
  9: "彼が死[し]んだ後[のち]、彼らは皆[みな]王冠[おうかん]をかぶり、その子[こ]らも彼らの後[あと]を継[つ]いで多[おお]くの年[とし]の間[あいだ]そうし、地[ち]に悪[あく]を増[ふ]やした。"
  10: "彼らから罪[つみ]の根[ね]が生[う]まれた。王[おう]アンティオコスの子[こ]アンティオコス・エピファネスである。彼はローマに人質[ひとじち]として置[お]かれていたが、ギリシア人[じん]の王国[おうこく]の第[だい]百三十七[ひゃくさんじゅうなな]年[ねん]に王[おう]となった。"
  11: "その日[ひ]々[び]、イスラエルから不法[ふほう]な者[もの]たちが出[で]て、多[おお]くの者[もの]を説[と]き伏[ふ]せて言[い]った。「さあ、わたしたちの周[まわ]りにいる異邦人[いほうじん]と契約[けいやく]を結[むす]ぼう。彼らから離[はな]れて以来[いらい]、多[おお]くの災[わざわ]いがわたしたちを襲[おそ]ったからである。」"
  12: "この言葉[ことば]は彼らの目[め]に良[よ]いものと映[うつ]った。"
  13: "民[たみ]の中[なか]から幾人[いくにん]かが進[すす]んで王[おう]のもとへ行[い]った。王は彼らに、異邦人[いほうじん]の定[さだ]めを行[おこな]う権限[けんげん]を与[あた]えた。"
  14: "彼らはエルサレムに、異邦人[いほうじん]の慣[なら]わしに従[したが]って体育場[たいいくじょう]を建[た]てた。"
  15: "彼らは自分[じぶん]たちの包皮[ほうひ]を元[もと]に戻[もど]し、聖[せい]なる契約[けいやく]から離[はな]れ、異邦人[いほうじん]と結[むす]びついて、悪[あく]を行[おこな]うために身[み]を売[う]った。"
  16: "アンティオコスの前[まえ]に王国[おうこく]が固[かた]まり、彼はエジプトの地[ち]を治[おさ]めようと思[おも]い立[た]った。二[ふた]つの王国[おうこく]を支配[しはい]するためであった。"
  17: "彼は重[おも]い軍勢[ぐんぜい]、戦車[せんしゃ]と象[ぞう]、騎兵[きへい]、そして大[おお]きな船隊[せんたい]を率[ひき]いてエジプトに入[はい]った。"
  18: "彼はエジプトの王[おう]プトレマイオスと戦[たたか]いを起[お]こした。プトレマイオスは彼の前[まえ]から退[しりぞ]いて逃[に]げ、多[おお]くの者[もの]が傷[きず]ついて倒[たお]れた。"
  19: "彼らはエジプトの地[ち]の堅固[けんご]な町[まち]々[まち]を取[と]り、エジプトの地[ち]の戦利品[せんりひん]を奪[うば]った。"
  20: "アンティオコスはエジプトを撃[う]った後[のち]、第[だい]百四十三[ひゃくよんじゅうさん]年[ねん]に引[ひ]き返[かえ]し、イスラエルに上[のぼ]って、重[おも]い軍勢[ぐんぜい]とともにエルサレムに入[はい]った。"
  21: "彼は高[たか]ぶった心[こころ]で聖所[せいしょ]に入[はい]り、金[きん]の祭壇[さいだん]と光[ひかり]の燭台[しょくだい]とそのすべての器[うつわ]を取[と]った。"
  22: "また、供[そな]えのパンの机[つくえ]、注[そそ]ぎの器[うつわ]、鉢[はち]、金[きん]の香炉[こうろ]、垂[た]れ幕[まく]、冠[かんむり]、神殿[しんでん]の正面[しょうめん]の金[きん]の飾[かざ]りをも取[と]り、すべてを剥[は]ぎ取[と]った。"
  23: "彼は銀[ぎん]と金[きん]、望[のぞ]ましい器[うつわ]を取[と]り、見[み]つけた隠[かく]された宝[たから]をも取[と]った。"
  24: "すべても取[と]って、彼は自分[じぶん]の地[ち]へ去[さ]った。彼は人[ひと]を殺[ころ]し、大[おお]いなる高[たか]ぶりを語[かた]った。"
  25: "イスラエルの上[うえ]に、そのすべての場所[ばしょ]で大[おお]きな悲[かな]しみが生[しょう]じた。"
  26: "君[きみ]たちと長老[ちょうろう]たちは嘆[なげ]き、処女[しょじょ]たちと若者[わかもの]たちは力[ちから]を失[うしな]い、女[おんな]たちの美[うつく]しさは変[か]わった。"
  27: "すべての花婿[はなむこ]は悲[かな]しみの歌[うた]を上[あ]げ、新婚[しんこん]の部屋[へや]に座[すわ]る者[もの]は嘆[なげ]いた。"
  28: "地[ち]はそこに住[す]む者[もの]たちのゆえに震[ふる]え、ヤコブの家[いえ]はすべて恥[はじ]をまとった。"
  29: "二[に]年[ねん]の後[のち]、王[おう]は税[ぜい]を取[と]り立[た]てる長[おさ]をユダの町[まち]々[まち]へ遣[つか]わし、彼は重[おも]い軍勢[ぐんぜい]とともにエルサレムに来[き]た。"
  30: "彼は偽[いつわ]りをもって彼らに平和[へいわ]の言葉[ことば]を語[かた]り、彼らは彼を信[しん]じた。しかし彼は突然[とつぜん]その町[まち]に襲[おそ]いかかり、大[おお]きな打撃[だげき]を与[あた]えて、イスラエルから多[おお]くの民[たみ]を滅[ほろ]ぼした。"
  31: "彼はその町[まち]の戦利品[せんりひん]を取[と]り、町[まち]を火[ひ]で焼[や]き、その家[いえ]々[いえ]と周[まわ]りの城壁[じょうへき]を壊[こわ]した。"
  32: "彼らは女[おんな]たちと子[こ]どもたちを捕[と]らえ、家畜[かちく]を自分[じぶん]たちのものとした。"
  33: "彼らはダビデの町[まち]を大[おお]きく堅固[けんご]な城壁[じょうへき]と堅固[けんご]な塔[とう]で囲[かこ]み、それが彼らの砦[とりで]となった。"
  34: "彼らはそこに罪[つみ]の民[たみ]、不法[ふほう]な者[もの]たちを置[お]き、その中[なか]で力[ちから]を強[つよ]めた。"
  35: "彼らは武器[ぶき]と食[た]べ物[もの]を蓄[たくわ]え、エルサレムの戦利品[せんりひん]を集[あつ]めてそこに置[お]いた。そしてそれは大[おお]きな罠[わな]となった。"
  36: "それは聖所[せいしょ]への待[ま]ち伏[ぶ]せとなり、イスラエルに対する悪[あ]しき悪魔[あくま]となって、いつまでも続[つづ]いた。"
  37: "彼らは聖所[せいしょ]の周[まわ]りに無実[むじつ]の血[ち]を流[なが]し、聖所[せいしょ]を汚[けが]した。"
  38: "エルサレムの住[す]み人[びと]たちは彼らのゆえに逃[に]げ去[さ]り、都[みやこ]は他[た]の者[もの]たちの住[す]みかとなった。都[みやこ]は自分[じぶん]が生[う]んだ者[もの]たちにとって異[い]邦[ほう]のようになり、その子[こ]らは都[みやこ]を見捨[みす]てた。"
  39: "その聖所[せいしょ]は荒[あ]れ野[の]のように荒[あ]れ果[は]て、その祭[まつ]りは悲[かな]しみに変[か]わり、その安息日[あんそくび]は辱[はずかし]めに、その栄[えい]誉[よ]は蔑[さげす]みに変[か]わった。"
  40: "その栄[えい]光[こう]に応[おう]じてその恥[はじ]は増[ふ]え、その高[たか]さは悲[かな]しみに変[か]わった。"
  41: "王[おう]は自分[じぶん]の王国[おうこく]のすべてに書[か]き送[おく]り、すべての者[もの]が一[ひと]つの民[たみ]となるようにと命[めい]じた。"
  42: "また、それぞれが自分[じぶん]の定[さだ]めを捨[す]てるようにと命[めい]じた。そしてすべての民[たみ]が王[おう]の言葉[ことば]に従[したが]った。"
  43: "また、イスラエルから多[おお]くの者[もの]が彼の礼拝[れいはい]を喜[よろこ]び、偶像[ぐうぞう]に犠牲[ぎせい]をささげ、安息日[あんそくび]を汚[けが]した。"
  44: "王[おう]は使者[ししゃ]の手[て]によって、エルサレムとユダの町[まち]々[まち]に書[しょ]簡[かん]を送[おく]り、この地[ち]にとって他国[たこく]の定[さだ]めに従[したが]うようにと命[めい]じた。"
  45: "すなわち、聖所[せいしょ]からの燔祭[はんさい]、犠牲[ぎせい]、注[そそ]ぎの供[そな]えを禁[きん]じ、安息日[あんそくび]と祭[まつ]りを汚[けが]させ、"
  46: "聖所[せいしょ]と聖[せい]なる者[もの]たちを汚[けが]させ、"
  47: "祭壇[さいだん]と聖域[せいいき]と偶像[ぐうぞう]の社[やしろ]を建[た]てさせ、豚[ぶた]や汚[けが]れた家畜[かちく]を犠牲[ぎせい]にささげさせ、"
  48: "自分[じぶん]の子[こ]らを無割礼[むかつれい]のままにさせ、あらゆる汚[けが]れと冒瀆[ぼうとく]によって自分[じぶん]の魂[たましい]を忌[い]まわしいものとさせ、"
  49: "ついには律法[りっぽう]を忘[わす]れ、すべての定[さだ]めを変[か]えさせた。"
  50: "王[おう]の言葉[ことば]どおりに行[おこな]わない者[もの]は死[し]ぬ。"
  51: "彼はこれらのすべての言葉[ことば]に従[したが]って自分[じぶん]の王国[おうこく]のすべてに書[か]き送[おく]り、すべての民[たみ]の上[うえ]に監督[かんとく]を置[お]き、ユダの町[まち]々[まち]に命[めい]じて、町[まち]ごとに犠牲[ぎせい]をささげさせた。"
  52: "民[たみ]の中[なか]から多[おお]くの者[もの]、すなわち律法[りっぽう]を捨[す]てるすべての者[もの]が彼らのもとに集[あつ]まり、地[ち]に悪[あく]を行[おこな]った。"
  53: "そしてイスラエルを、そのあらゆる逃[に]げ場[ば]の隠[かく]れ場[ば]に追[お]い込[こ]んだ。"
  54: "第[だい]百四十五[ひゃくよんじゅうご]年[ねん]のキスレウの月[つき]の十五[じゅうご]日[にち]、彼らは祭壇[さいだん]の上[うえ]に荒廃[こうはい]をもたらす忌[い]まわしいものを建[た]て、ユダの周[まわ]りの町[まち]々[まち]に祭壇[さいだん]を建[た]てた。"
  55: "また、家[いえ]々[いえ]の戸口[とぐち]や広場[ひろば]で香[こう]をたいた。"
  56: "また、見[み]つけた律法[りっぽう]の書[しょ]物[もつ]を引[ひ]き裂[さ]いて、火[ひ]の中[なか]に投[な]げ入[い]れた。"
  57: "契約[けいやく]の書[しょ]がだれかのもとで見[み]つかるたびに、また律法[りっぽう]に賛同[さんどう]する者[もの]がいれば、王[おう]の定[さだ]めによってその者[もの]を殺[ころ]した。"
  58: "彼らはその力[ちから]をもって、毎月[まいつき]町[まち]々[まち]で見[み]つかるイスラエルの者[もの]たちにそうした。"
  59: "また、月[つき]の二十五[にじゅうご]日[にち]には、祭壇[さいだん]の上[うえ]に設[もう]けた祭壇[さいだん]で犠牲[ぎせい]をささげた。"
  60: "彼らはその定[さだ]めに従[したが]って、子[こ]どもに割礼[かつれい]を施[ほどこ]した女[おんな]たちを殺[ころ]し、"
  61: "その子[こ]どもをその首[くび]に掛[か]けて吊[つ]るし、その家[いえ]々[いえ]を奪[うば]い、子[こ]どもに割礼[かつれい]を施[ほどこ]した者[もの]たちを殺[ころ]した。"
  62: "しかし、イスラエルの多[おお]くの者[もの]は強[つよ]くされ、汚[けが]れた物[もの]を食[た]べないために、自分[じぶん]たちの中[なか]で固[かた]く立[た]った。"
  63: "彼らは食物[しょくもつ]によって汚[けが]されず、聖[せい]なる契約[けいやく]を汚[けが]さないために、死[し]ぬことを選[えら]んで死[し]んだ。"
  64: "こうして、イスラエルの上[うえ]に非常[ひじょう]に大[おお]きな怒[いか]りが下[くだ]った。"

notes:
  1: "Μετὰ τὸ πατάξαι Ἀλέξανδρον… — «после того как Александр поразил»; τὸν Φιλίππου Μακεδόνα — «Филиппова Македонянина» (フィリッポス, マケドニア); Χεττιιμ — «Киттим» (キティム, ср. слав. «хеттиим»); πρότερον ἐπὶ τὴν Ἑλλάδα — «прежде над Элладой», т. е. сначала воцарился над Грецией; слав. «первый во елладе». Порядок членов сохранён."
  2: "συνεστήσατο πολέμους πολλούς — «составил (поднял) многие войны» (συνίστημι); ἐκράτησεν ὀχυρωμάτων — «овладел укреплениями» (ὀχύρωμα — 要塞[ようさい]); ἔσφαξεν — «заколол» (σφάζω)."
  3: "διῆλθεν ἕως ἄκρων τῆς γῆς — «прошёл до краёв земли»; σκῦλα πλήθους ἐθνῶν — «добычу множества народов»; ἡσύχασεν ἡ γῆ ἐνώπιον αὐτοῦ — «умолкла земля пред ним»; ἐπήρθη ἡ καρδία αὐτοῦ — «поднялось (возгордилось) сердце его»."
  4: "δύναμιν ἰσχυρὰν σφόδρα — «силу весьма крепкую»; ἦρξεν χωρῶν ἐθνῶν καὶ τυράννων — «начальствовал над странами народов и тиранов» (τύραννος — 暴君[ぼうくん]); ἐγένοντο αὐτῷ εἰς φόρον — «стали ему в дань» (φόρος — 貢[みつ]ぎ)."
  5: "ἔπεσεν ἐπὶ τὴν κοίτην — «пал на ложе» (κοίτη — 床[とこ]); ἔγνω ὅτι ἀποθνῄσκει — «познал, что умирает». Слав. «позна, яко умирает»."
  6: "τοὺς παῖδας αὐτοῦ τοὺς ἐνδόξους — «отроков (слуг) его знатных»; τοὺς συνεκτρόφους αὐτοῦ ἐκ νεότητος — «совоспитанных с ним от юности» (σύντροφος); διεῖλεν αὐτοῖς τὴν βασιλείαν — «разделил им царство»; ἔτι αὐτοῦ ζῶντος — «ещё ему живому»."
  7: "ἐβασίλευσεν… ἔτη δώδεκα — «царствовал двенадцать лет». Слав. «лет дванадесять»."
  8: "ἐπεκράτησαν οἱ παῖδες αὐτοῦ — «взяли верх (власть) отроки его»; ἕκαστος ἐν τῷ τόπῳ αὐτοῦ — «каждый в месте своём» (слав. «кийждо в месте своем»)."
  9: "ἐπέθεντο πάντες διαδήματα — «возложили все венцы (диадемы)» (διάδημα — 王冠[おうかん]); οἱ υἱοὶ αὐτῶν ὀπίσω αὐτῶν — «сыны их после них»; ἐπλήθυναν κακὰ ἐν τῇ γῇ — «умножили зло на земле»."
  10: "ῥίζα ἁμαρτωλός — «корень грешный» (слав. «корень греха»); Ἀντίοχος Ἐπιφανής — アンティオコス・エピファネス; ὃς ἦν ὅμηρα ἐν Ῥώμῃ — «который был заложником в Риме» (ὅμηρα — 人質[ひとじち]); ἐν ἔτει ἑκατοστῷ καὶ τριακοστῷ καὶ ἑβδόμῳ — «в год сто тридцатый седьмой» (137 г. эры Селевкидов); βασιλείας Ἑλλήνων — «царства Еллинов»."
  11: "υἱοὶ παράνομοι — «сыны беззаконные»; ἀνέπεισαν πολλοὺς λέγοντες — «убедили многих, говоря»; Πορευθῶμεν καὶ διαθώμεθα διαθήκην — «пойдём и заключим завет» (διατίθημι); ἀφ' ἧς ἐχωρίσθημεν ἀπ' αὐτῶν — «с тех пор как мы отделились от них»; εὗρεν ἡμᾶς κακὰ πολλά — «постигли нас многие беды». Слова отступников — 「…」."
  12: "ἠγαθύνθη ὁ λόγος ἐν ὀφθαλμοῖς αὐτῶν — «показалось слово добрым в очах их»; слав. «благоувидеся слово во очию их»."
  13: "προεθυμήθησάν τινες — «пожелали (возымели усердие) некоторые» (προθυμέομαι); ἔδωκεν αὐτοῖς ἐξουσίαν — «дал им власть»; ποιῆσαι τὰ δικαιώματα τῶν ἐθνῶν — «творить оправдания (установления) язычников»."
  14: "γυμνάσιον — «гимнасий» (体育場[たいいくじょう]); κατὰ τὰ νόμιμα τῶν ἐθνῶν — «по обычаям язычников». Слав. «училище» — неточная передача; в тексте по LXX."
  15: "ἐποίησαν ἑαυτοῖς ἀκροβυστίας — «сделали себе необрезание», т. е. восстановили крайнюю плоть (эписпазм), передано 包皮[ほうひ]を元[もと]に戻[もど]す; ἀπέστησαν ἀπὸ διαθήκης ἁγίας — «отступили от завета святого»; ἐζευγίσθησαν τοῖς ἔθνεσιν — «сопряглись с язычниками» (ζευγνύω); ἐπράθησαν τοῦ ποιῆσαι τὸ πονηρόν — «продались, чтобы делать злое»."
  16: "ἡτοιμάσθη ἡ βασιλεία ἐνώπιον Ἀντιόχου — «уготовилось царство пред Антиохом»; ὑπέλαβεν βασιλεῦσαι γῆς Αἰγύπτου — «предпринял (замыслил) воцариться над землёй Египта» (ὑπολαμβάνω); ἐπὶ τὰς δύο βασιλείας — «над двумя царствами» (Египет и Сирия)."
  17: "ἐν ὄχλῳ βαρεῖ — «с тяжёлым множеством (войском)»; ἐν ἅρμασιν καὶ ἐλέφασιν — «на колесницах и слонах»; ἐν ἱππεῦσιν — «в конниках»; ἐν στόλῳ μεγάλῳ — «с великим снаряжением (флотом)». Слав. «на кораблех многих» — понял στόλος как флот; в тексте 船隊[せんたい], отмечено."
  18: "συνεστήσατο πόλεμον πρὸς Πτολεμαῖον — «составил войну против Птолемея»; ἐνετράπη Πτολεμαῖος ἀπὸ προσώπου αὐτοῦ — «обратился в бегство Птолемей от лица его» (ἐντρέπω — поворачивать); ἔπεσον τραυματίαι πολλοί — «пали раненых многие»."
  19: "κατελάβοντο τὰς πόλεις τὰς ὀχυράς — «овладели городами укреплёнными» (καταλαμβάνω); ἔλαβεν τὰ σκῦλα γῆς Αἰγύπτου — «взял добычу земли Египта». Число: в LXX и слав. мн. ч. «овладели», затем ед. ч. «взял»."
  20: "μετὰ τὸ πατάξαι Αἴγυπτον — «после поражения Египта»; ἐν τῷ ἑκατοστῷ καὶ τεσσαρακοστῷ καὶ τρίτῳ ἔτει — «в год сто сорок третий» (143 г.); ἀνέβη ἐπὶ Ισραηλ — «пошёл на Израиль»; ἐν ὄχλῳ βαρεῖ — «с тяжёлым войском»."
  21: "εἰσῆλθεν εἰς τὸ ἁγίασμα ἐν ὑπερηφανίᾳ — «вошёл в святилище с надменностью»; τὸ θυσιαστήριον τὸ χρυσοῦν — «жертвенник золотой»; τὴν λυχνίαν τοῦ φωτός — «светильник света» (燭台[しょくだい]); πάντα τὰ σκεύη αὐτῆς — «все сосуды его»."
  22: "τὴν τράπεζαν τῆς προθέσεως — «трапезу предложения» (供[そな]えのパン, ср. слав. «трапезу предложения»); σπονδεῖα — «возлияльники»; φιάλας — «чаши» (鉢[はち]); θυίσκας — «кадильницы» (香炉[こうろ]); τὸ καταπέτασμα — «завеса» (垂[た]れ幕[まく]); τοὺς στεφάνους — «венцы»; τὸν κόσμον τὸν χρυσοῦν τὸν κατὰ πρόσωπον τοῦ ναοῦ — «украшение золотое, что пред лицом храма»; ἐλέπισεν πάντα — «соскоблил (содрал) всё»; слав. «сокруши вся» — иное понимание λεπίζω, отмечено."
  23: "τὰ σκεύη τὰ ἐπιθυμητά — «сосуды вожделенные»; τοὺς θησαυροὺς τοὺς ἀποκρύφους — «сокровища сокровенные»; οὓς εὗρεν — «какие нашёл»."
  24: "λαβὼν πάντα ἀπῆλθεν εἰς τὴν γῆν αὐτοῦ — «взяв всё, ушёл в землю свою»; ἐποίησεν φονοκτονίαν — «совершил избиение» (φονοκτονία — убийство); ἐλάλησεν ὑπερηφανίαν μεγάλην — «говорил надменность великую»."
  25: "πένθος μέγα ἐπὶ Ισραηλ — «плач великий над Израилем»; ἐν παντὶ τόπῳ αὐτῶν — «во всяком месте их». Слав. «плачь велик во израили»."
  26: "ἐστέναξαν ἄρχοντες καὶ πρεσβύτεροι — «возстенали начальники и старейшины»; παρθένοι καὶ νεανίσκοι ἠσθένησαν — «девы и юноши изнемогли»; τὸ κάλλος τῶν γυναικῶν ἠλλοιώθη — «красота жён изменилась»."
  27: "πᾶς νυμφίος ἀνέλαβεν θρῆνον — «всякий жених принял плач» (θρῆνος); καθημένη ἐν παστῷ ἐπένθει — «сидящая в брачном чертоге плакала» (παστός — 新婚[しんこん]の部屋[へや])."
  28: "ἐσείσθη ἡ γῆ ἐπὶ τοὺς κατοικοῦντας αὐτήν — «потряслась земля за живущих на ней»; ἐνεδύσατο αἰσχύνην — «облеклась в стыд» (слав. «облечеся студом»)."
  29: "Μετὰ δύο ἔτη ἡμερῶν — «через два года дней»; ἄρχοντα φορολογίας — «начальника подати» (φορολογία — 税[ぜい]); εἰς τὰς πόλεις Ιουδα — «в города Иуды»; ἐν ὄχλῳ βαρεῖ — «с тяжёлым войском»."
  30: "ἐλάλησεν αὐτοῖς λόγους εἰρηνικοὺς ἐν δόλῳ — «говорил им слова мирные с коварством» (δόλος); ἐνεπίστευσαν αὐτῷ — «поверили ему»; ἐπέπεσεν ἐπὶ τὴν πόλιν ἐξάπινα — «напал на город внезапно» (ἐξάπινα); ἐπάταξεν… πληγὴν μεγάλην — «поразил поражением великим»."
  31: "ἔλαβεν τὰ σκῦλα τῆς πόλεως — «взял добычу города»; ἐνέπρησεν αὐτὴν πυρί — «сжёг его огнём» (ἐμπίμπρημι); καθεῖλεν τοὺς οἴκους — «снёс домы» (καθαιρέω); τὰ τείχη κύκλῳ — «стены вокруг»."
  32: "ᾐχμαλώτισαν τὰς γυναῖκας καὶ τὰ τέκνα — «пленили жён и детей» (αἰχμαλωτίζω); τὰ κτῆνη ἐκληρονόμησαν — «скот наследовали (взяли себе)» (κληρονομέω)."
  33: "τὴν πόλιν Δαυιδ — «город Давидов»; τείχει μεγάλῳ καὶ ὀχυρῷ — «стеною великой и крепкой»; πύργοις ὀχυροῖς — «башнями крепкими»; ἐγένετο αὐτοῖς εἰς ἄκραν — «стал им в крепость (акру)» (ἄκρα — 砦[とりで])."
  34: "ἔθηκαν ἐκεῖ ἔθνος ἁμαρτωλόν — «поставили там народ грешный»; ἄνδρας παρανόμους — «мужей беззаконных»; ἐνίσχυσαν ἐν αὐτῇ — «укрепились в ней»."
  35: "παρέθεντο ὅπλα καὶ τροφήν — «положили (запасли) оружие и пищу»; συναγαγόντες τὰ σκῦλα Ιερουσαλημ — «собрав добычи Иерусалима»; ἐγένοντο εἰς μεγάλην παγίδα — «стали в великую сеть (ловушку)» (παγίς — 罠[わな])."
  36: "εἰς ἔνεδρον τῷ ἁγιάσματι — «в засаду святилищу» (ἔνεδρον — 待[ま]ち伏[ぶ]せ); εἰς διάβολον πονηρὸν τῷ Ισραηλ — «в диавола лукавого Израилю» (διάβολος здесь — «клеветник, противник»); διὰ παντός — «всегда»."
  37: "ἐξέχεαν αἷμα ἀθῷον — «пролили кровь невинную» (ἀθῷος); κύκλῳ τοῦ ἁγιάσματος — «вокруг святилища»; ἐμόνυναν — «осквернили» (μολύνω)."
  38: "ἔφυγον οἱ κάτοικοι — «убежали жители»; ἐγένετο κατοικία ἀλλοτρίων — «стал жилищем чужих»; ἀλλοτρία τοῖς γενήμασιν αὐτῆς — «чужим для порождений его» (γένημα — 産[う]みの者[もの]); τὰ τέκνα αὐτῆς ἐγκατέλιπον αὐτήν — «дети его оставили его»."
  39: "τὸ ἁγίασμα αὐτῆς ἠρημώθη ὡς ἔρημος — «святилище его опустело, как пустыня»; αἱ ἑορταὶ αὐτῆς ἐστράφησαν εἰς πένθος — «праздники его обратились в плач»; τὰ σάββατα… εἰς ὀνειδισμόν — «субботы… в поношение»; ἡ τιμὴ αὐτῆς εἰς ἐξουδένωσιν — «честь его в уничижение»."
  40: "κατὰ τὴν δόξαν αὐτῆς ἐπληθύνθη ἡ ἀτιμία αὐτῆς — «по славе его умножилось бесчестие его»; τὸ ὕψος αὐτῆς ἐστράφη εἰς πένθος — «высота его обратилась в плач»."
  41: "ἔγραψεν ὁ βασιλεὺς πάσῃ τῇ βασιλείᾳ αὐτοῦ — «написал царь всему царству своему»; εἶναι πάντας εἰς λαὸν ἕνα — «быть всем народом одним». Далее указ в косвенной речи (acc. cum inf.), кавычки не ставятся."
  42: "ἐγκαταλιπεῖν ἕκαστον τὰ νόμιμα αὐτοῦ — «оставить каждому свои уставы»; ἐπεδέξαντο πάντα τὰ ἔθνη — «приняли (согласились) все народы»; κατὰ τὸν λόγον τοῦ βασιλέως — «по слову царя»."
  43: "εὐδόκησαν τῇ λατρείᾳ αὐτοῦ — «благоволили к служению (культу) его» (λατρεία — 礼拝[れいはい]); ἔθυσαν τοῖς εἰδώλοις — «принесли жертвы идолам»; ἐβεβήλωσαν τὸ σάββατον — «осквернили субботу»."
  44: "βιβλία ἐν χειρὶ ἀγγέλων — «письма рукою вестников» (ἄγγελος — 使者[ししゃ]); πορευθῆναι ὀπίσω νομίμων ἀλλοτρίων τῆς γῆς — «пойти вслед уставов чужих для земли»."
  45: "κωλῦσαι ὁλοκαυτώματα καὶ θυσίαν καὶ σπονδὴν — «воспрепятствовать всесожжениям, жертве и возлиянию» (κωλύω); ἐκ τοῦ ἁγιάσματος — «из святилища»; βεβηλῶσαι σάββατα καὶ ἑορτάς — «осквернить субботы и праздники»."
  46: "μιᾶναι ἁγίασμα καὶ ἁγίους — «осквернить святилище и святых» (μιαίνω)."
  47: "οἰκοδομῆσαι βωμοὺς καὶ τεμένη καὶ εἰδώλια — «построить жертвенники, священные участки и идольские капища» (τέμενος — 聖域[せいいき]; εἰδώλιον — 偶像[ぐうぞう]の社[やしろ]); θύειν ὕεια — «приносить в жертву свиное»; κτήνη κοινά — «скотов нечистых» (κοινός — 汚[けが]れた)."
  48: "ἀφιέναι τοὺς υἱοὺς αὐτῶν ἀπεριτμήτους — «оставлять сыновей своих необрезанными»; βδελύξαι τὰς ψυχὰς αὐτῶν — «сделать души их мерзостью» (βδελύσσω); ἐν παντὶ ἀκαθάρτῳ καὶ βεβηλώσει — «во всякой нечистоте и осквернении»."
  49: "ὥστε ἐπιλαθέσθαι τοῦ νόμου — «так что забыть закон»; ἀλλᾶξαι πάντα τὰ δικαιώματα — «изменить все оправдания». Слав. добавляет «(Божия)» — редакционное, не перенесено."
  50: "ὃς ἂν μὴ ποιήσῃ κατὰ τὸν λόγον τοῦ βασιλέως — «кто не сделает по слову царя»; ἀποθανεῖται — «умрёт». Слав. «да умрет» — та же косвенная модальность."
  51: "κατὰ πάντας τοὺς λόγους τούτους — «по всем словам этим»; ἐποίησεν ἐπισκόπους ἐπὶ πάντα τὸν λαόν — «поставил надзирателей над всем народом» (ἐπίσκοπος); ἐνετείλατο ταῖς πόλεσιν Ιουδα θυσιάζειν — «заповедал городам Иуды приносить жертвы»; κατὰ πόλιν καὶ πόλιν — «по городу и городу»."
  52: "συνηθροίσθησαν… πολλοὶ πρὸς αὐτούς — «собрались многие к ним» (συναθροίζω); πᾶς ὁ ἐγκαταλείπων τὸν νόμον — «всякий, оставляющий закон»; ἐποίησαν κακὰ ἐν τῇ γῇ — «сделали зло на земле»."
  53: "ἔθεντο τὸν Ισραηλ ἐν κρύφοις — «поставили Израиль в потаённых местах»; ἐν παντὶ φυγαδευτηρίῳ αὐτῶν — «во всяком убежище их» (φυγαδευτήριον — 逃[に]げ場[ば])."
  54: "τῇ πεντεκαιδεκάτῃ ἡμέρᾳ Χασελευ — «в пятнадцатый день Хаслева» (キスレウ, вавилонское название месяца); τῷ πέμπτῳ καὶ τεσσαρακοστῷ καὶ ἑκατοστῷ ἔτει — «в год сто сорок пятый»; ᾠκοδόμησεν βδέλυγμα ἐρημώσεως ἐπὶ τὸ θυσιαστήριον — «построил мерзость запустения на жертвеннике» (ср. Дан 11:31; 1 Макк 6:7); ἐν πόλεσιν Ιουδα κύκλῳ ᾠκοδόμησαν βωμούς — «в городах Иуды вокруг построили жертвенники»."
  55: "ἐπὶ τῶν θυρῶν τῶν οἰκιῶν — «при дверях домов»; ἐν ταῖς πλατείαις ἐθυμίων — «на улицах кадили» (θυμιάω)."
  56: "τὰ βιβλία τοῦ νόμου, ἃ εὗρον — «книги закона, какие нашли»; ἐνεπύρισαν ἐν πυρὶ κατασχίσαντες — «сожгли огнём, разодрав» (κατασχίζω)."
  57: "ὅπου εὑρίσκετο παρά τινι βιβλίον διαθήκης — «где находилась у кого книга завета»; εἴ τις συνευδόκει τῷ νόμῳ — «если кто соизволял закону» (συνευδοκέω); τὸ σύγκριμα τοῦ βασιλέως — «определение царя» (σύγκριμα); ἐθανάτου αὐτόν — «умерщвлял его»."
  58: "ἐν ἰσχύι αὐτῶν — «в силе своей» (т. е. насилием); τοῖς εὑρισκομένοις — «находящимся»; ἐν παντὶ μηνὶ καὶ μηνὶ — «в каждый месяц»; ἐν ταῖς πόλεσιν — «в городах». Смысл: гонение шло по городам ежемесячно."
  59: "τῇ πέμπτῃ καὶ εἰκάδι τοῦ μηνός — «в двадцать пятый день месяца»; θυσιάζοντες ἐπὶ τὸν βωμόν — «принося жертвы на жертвеннике»; ὃς ἦν ἐπὶ τοῦ θυσιαστηρίου — «который был на (над) алтарём». Слав. «в капищи, еже бе на олтари» — иное понимание, отмечено."
  60: "τὰς γυναῖκας τὰς περιτετμηκυίας τὰ τέκνα αὐτῶν — «жён, обрезавших детей своих»; ἐθανάτωσαν κατὰ τὸ πρόσταγμα — «умертвили по повелению»."
  61: "ἐκρέμασαν τὰ βρέφη ἐκ τῶν τραχήλων αὐτῶν — «повесили младенцев за шеи их» (τράχηλος); τοὺς οἴκους αὐτῶν — «домы их»; τοὺς περιτετμηκότας αὐτούς — «обрезавших их». Слав. добавляет «домы их расхищаху» — по смыслу то же; в тексте 奪[うば]い."
  62: "ἐκραταιώθησαν καὶ ὠχυρώθησαν ἐν αὑτοῖς — «укрепились и утвердились в себе» (κραταιόω, ὀχυρόω); τοῦ μὴ φαγεῖν κοινά — «чтобы не есть нечистого (общего)»."
  63: "ἐπεδέξαντο ἀποθανεῖν — «приняли (избрали) умереть»; ἵνα μὴ μιανθῶσιν τοῖς βρώμασιν — «чтобы не оскверниться снедями»; μὴ βεβηλώσωσιν διαθήκην ἁγίαν — «не осквернить завет святой»; ἀπέθανον — «умерли». Слав. «заклани быша» — уточнение способа смерти, в тексте общее 死[し]んだ."
  64: "ὀργὴ μεγάλη ἐπὶ Ισραηλ σφόδρα — «гнев великий на Израиль весьма». Слав. «гнев велий на израиля зело»."
