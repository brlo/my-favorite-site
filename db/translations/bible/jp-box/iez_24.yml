verses:
  1: "第九年[だいきゅうねん]の第十[だいじゅう]の月[つき]の十日[とおか]、主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]われた。"
  2: "「人[ひと]の子[こ]よ、この日[ひ]の名[な]を、バビロンの王[おう]がエルサレムに攻[せ]め寄[よ]せたこの日[ひ]から、今日[きょう]という日[ひ]から、自分[じぶん]のために書[か]き記[しる]せ。"
  3: "この反逆[はんぎゃく]の家[いえ]にたとえ話[ばなし]を語[かた]り、彼らに言[い]え。主[しゅ]なる神[かみ]はこう言[い]われる。鍋[なべ]を据[す]え、据えて、その中に水[みず]を注[そそ]げ。"
  4: "その中に切[き]り分[わ]けた肉[にく]を、すべて良[よ]い切[き]り身[み]を入[い]れよ。腿[もも]と肩[かた]を、骨[ほね]から肉[にく]を削[そ]ぎ取[と]ったものを。"
  5: "選[え]り抜[ぬ]かれた家畜[かちく]を取[と]り、その下[した]に骨[ほね]を燃[も]やせ。よく煮[に]えた、よく煮えた。その骨[ほね]もそのただ中[なか]で煮[に]えた。"
  6: "それゆえ、主[しゅ]なる神[かみ]はこう言[い]われる。血[ち]の都[みやこ]よ、その中に錆[さび]のある鍋[なべ]よ、その錆[さび]がそこから出[で]て行[い]かない鍋よ。それを部分[ぶぶん]ごとに、一片[いっぺん]ずつ取[と]り出[だ]せ。その上[うえ]に籤[くじ]は落[お]ちない。"
  7: "その血[ち]はそのただ中[なか]にある。わたしはそれを裸[はだか]の岩[いわ]の上[うえ]に置[お]き、地[ち]に注[そそ]いで土[つち]で覆[おお]うことをしなかった。"
  8: "わたしの怒[いか]りを上[のぼ]らせ、復讐[ふくしゅう]を果[は]たすために、わたしはその血[ち]を裸[はだか]の岩[いわ]の上[うえ]に置[お]き、これを覆[おお]わなかった。"
  9: "それゆえ、主[しゅ]なる神[かみ]はこう言[い]われる。血[ち]の都[みやこ]よ、ああ、災[わざわ]いだ。わたしはまた、燃[も]え木[ぎ]の山[やま]を大[おお]きくする。"
  10: "薪[まき]を多[おお]くし、火[ひ]を強[つよ]く燃[も]やせ。肉[にく]を煮[に]詰[つ]め、汁[しる]を少[すく]なくし、骨[ほね]も溶[と]けるようにせよ。"
  11: "これを炭[すみ]の上[うえ]に据[す]え、その銅[どう]が焼[や]けて熱[あつ]くなり、そのただ中[なか]の汚[けが]れが溶[と]け、その錆[さび]が消[き]えるようにせよ。"
  12: "それは労苦[ろうく]によって疲[つか]れ果[は]て、その多[おお]い錆[さび]はそこから出[で]ない。その錆[さび]は辱[はずかし]めを受[う]ける。"
  13: "あなたは汚[けが]れのうちにあり、自分[じぶん]を汚[けが]した。あなたは自分の汚れから清[きよ]められなかった。わたしが自分の怒[いか]りをあなたのうちに満[み]たすまで、あなたはもはや清められない。"
  14: "わたしは主[しゅ]、語[かた]った。それは来[く]る。わたしは行[おこな]う。わたしはためらわず、惜[お]しまず、悔[く]いない。あなたの道[みち]とあなたの思[おも]いによって、わたしはあなたを裁[さば]く、と主[しゅ]なる神[かみ]は言[い]われる。それゆえ、わたしはあなたの血[ち]によって、あなたの思[おも]いによってあなたを裁[さば]く。汚[けが]れた者[もの]、名[な]高[だか]く、怒[いか]りを引[ひ]き起[おこ]すことに大[おお]きな者よ。」"
  15: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]われた。"
  16: "「人[ひと]の子[こ]よ、見[み]よ、わたしは一撃[いちげき]をもって、あなたの目[め]の喜[よろこ]びをあなたから取[と]り去[さ]る。あなたは嘆[なげ]いてはならない。泣[な]いてはならない。涙[なみだ]を流[なが]してもならない。"
  17: "黙[だま]って呻[うめ]け。それは血[ち]の、腰[こし]の、喪[も]の嘆[なげ]きである。あなたの髪[かみ]は結[むす]ばれ、あなたの足[あし]には靴[くつ]がある。あなたは彼らの唇[くちびる]で慰[なぐさ]められず、人[ひと]のパンを食[た]べてはならない。」"
  18: "わたしは朝[あさ]、民[たみ]に語[かた]った。夕[ゆう]べ、わたしの妻[つま]は死[し]んだ。翌[よく]朝[あさ]、わたしは命[めい]じられたとおりに行[おこな]った。"
  19: "民[たみ]はわたしに言[い]った。あなたが行[おこな]っているこれらのことは、わたしたちにとって何[なに]なのか、告[つ]げないのか。"
  20: "わたしは彼らに言[い]った。「わたしに主[しゅ]の言葉[ことば]が臨[のぞ]んだ。『"
  21: "イスラエルの家[いえ]に言[い]え。主[しゅ]なる神[かみ]はこう言[い]われる。見[み]よ、わたしはわたしの聖所[せいしょ]を汚[けが]す。それはあなたがたの力[ちから]の誇[ほこ]り、あなたがたの目[め]の喜[よろこ]び、あなたがたの魂[たましい]が惜[お]しむものである。あなたがたが残[のこ]した息子[むすこ]たちと娘[むすめ]たちは剣[つるぎ]に倒[たお]れる。"
  22: "あなたがたはわたしが行[おこな]ったとおりに行[おこな]う。あなたがたは彼らの唇[くちびる]で慰[なぐさ]められず、人[ひと]のパンを食[た]べない。"
  23: "あなたがたの髪[かみ]は頭[あたま]にあり、あなたがたの靴[くつ]は足[あし]にある。あなたがたは嘆[なげ]かず、泣[な]かない。あなたがたは自分の不義[ふぎ]のうちに溶[と]け、互[たが]いに兄弟[きょうだい]を慰[なぐさ]めない。"
  24: "エゼキエルはあなたがたにとってしるしとなる。彼が行[おこな]ったすべてのことを、あなたがたも行[おこな]う。これらが来[き]たとき、あなたがたは、わたしが主[しゅ]なる神[かみ]であることを知[し]る。"
  25: "人[ひと]の子[こ]よ、わたしが彼らからその力[ちから]、その誇[ほこ]りの高[たか]ぶり、その目[め]の喜[よろこ]び、その魂[たましい]の高[たか]ぶり、その息子[むすこ]たちと娘[むすめ]たちを取[と]り去[さ]る日[ひ]に、"
  26: "その日[ひ]、逃[に]げ延[の]びた者[もの]があなたのもとに来[き]て、あなたの耳[みみ]に告[つ]げる。"
  27: "その日[ひ]、あなたの口[くち]は逃[に]げ延[の]びた者[もの]に向[む]かって開[ひら]かれ、あなたは語[かた]る。あなたはもはや黙[だま]っていない。あなたは彼らにとってしるしとなり、彼らは、わたしが主[しゅ]であることを知[し]る。』」"

notes:
  1: "ἐν τῷ ἔτει τῷ ἐνάτῳ... ἐν τῷ μηνὶ τῷ δεκάτῳ δεκάτῃ τοῦ μηνός — «в девятый год, в десятый месяц, в десятый день месяца»: 第九年、第十月、十日. Дата начала осады, ср. 4 Цар 25:1; Иер 39:1."
  2: "γράψον σεαυτῷ εἰς ἡμέραν ἀπὸ τῆς ἡμέρας ταύτης — «запиши себе (имя) дня от дня сего»; ἀφ᾿ ἧς ἀπηρείσατο βασιλεὺς Βαβυλῶνος ἐπὶ Ιερουσαλημ — «с которого ополчился царь Вавилонский на Иерусалим» (ἀπερείδομαι — опираться, налегать); ἀπὸ τῆς ἡμέρας τῆς σήμερον — «от сего дня»."
  3: "τὸν οἶκον τὸν παραπικραίνοντα — «дом огорчающий (мятежный)»; παραβολήν — «притчу»; Ἐπίστησον τὸν λέβητα — «поставь котёл» (λέβης); ἔκχεον εἰς αὐτὸν ὕδωρ — «нали в него воду»."
  4: "τὰ διχοτομήματα — «разрубленное на две части» (διχοτόμημα); πᾶν διχοτόμημα καλόν — «всякий хороший кусок»; σκέλος καὶ ὦμον — «голень и плечо»; ἐκσεσαρκισμένα ἀπὸ τῶν ὀστῶν — «снятые (очищенные) с костей»."
  5: "ἐξ ἐπιλέκτων κτηνῶν εἰλημμένων — «из отборных скотов взятых»; ὑπόκαιε τὰ ὀστᾶ ὑποκάτω αὐτῶν — «поджигай кости под ними»; ἔζεσεν ἔζεσεν — «вскипело, вскипело» (повтор); ἥψηται τὰ ὀστᾶ αὐτῆς — «сварились кости её»."
  6: "Ὦ πόλις αἱμάτων — «о город кровей»; λέβης ἐν ᾧ ἐστιν ἰὸς ἐν αὐτῷ — «котёл, в котором ржавчина (накипь)» (ἰός — ржавчина, яд); ὁ ἰὸς οὐκ ἐξῆλθεν ἐξ αὐτῆς — «ржавчина не вышла из него»; κατὰ μέλος αὐτῆς ἐξήνεγκεν — «по членам её вынес (вынимай)»; οὐκ ἔπεσεν ἐπ᾿ αὐτὴν κλῆρος — «не пал на неё жребий» (не выбирая по жребию)."
  7: "αἷμα αὐτῆς ἐν μέσῳ αὐτῆς — «кровь её среди неё»; ἐπὶ λεωπετρίαν τέταχα αὐτό — «на голую скалу Я положил её» (1 л. ед. ч., τέταχα; слав. «вчиних ю»); οὐκ ἐκκέχυκα... ἐπὶ τὴν γῆν τοῦ καλύψαι — «не пролил её на землю, чтобы покрыть»."
  8: "τοῦ ἀναβῆναι θυμὸν εἰς ἐκδίκησιν — «чтобы поднялся гнев на отмщение»; δέδωκα τὸ αἷμα αὐτῆς ἐπὶ λεωπετρίαν — «Я отдал кровь её на голую скалу»; τοῦ μὴ καλύψαι αὐτό — «чтобы не покрыть её»."
  9: "μεγαλυνῶ τὸν δαλόν — «возвеличу головню (костёр)» (δαλός — головня, 燃え木); слав. «возвеличу главню»."
  10: "πληθυνῶ τὰ ξύλα — «умножу дрова»; ἀνακαύσω τὸ πῦρ — «разожгу огонь»; ὅπως τακῇ τὰ κρέα καὶ ἐλαττωθῇ ὁ ζωμός — «чтобы растопилось мясо и убавился бульон (сок)» (ζωμός). Слав. добавляет «и кости истают» — нет в LXX, внесено без скобок."
  11: "στῇ ἐπὶ τοὺς ἄνθρακας — «станет на угли»; προσκαυθῇ καὶ θερμανθῇ ὁ χαλκός — «пригорит и разогреется медь»; τακῇ ἐν μέσῳ ἀκαθαρσίας αὐτῆς — «расплавится среди нечистоты её»; ἐκλίπῃ ὁ ἰός — «исчезнет ржавчина». Слав. «(тощь) разгореся» — редакционная вставка в скобках, не перенесена."
  12: "πολὺς ὁ ἰὸς αὐτῆς — «многая ржавчина её»; οὐ μὴ ἐξέλθῃ ἐξ αὐτῆς — «не выйдет из неё»; καταισχυνθήσεται ὁ ἰὸς αὐτῆς — «посрамится ржавчина её». Тёмное место: слав. «да смирится яд его... и посрамится яд его»."
  13: "ἀνθ᾿ ὧν ἐμιαίνου σύ — «за то, что ты осквернялся»; καὶ τί ἐὰν μὴ καθαρισθῇς ἔτι — «и что, если не очистишься ещё»; ἕως οὗ ἐμπλήσω τὸν θυμόν μου — «доколе не исполню гнев Мой». Слав. «в нечистоте твоей укроп» — тёмное, передано по смыслу."
  14: "ἐγὼ κύριος λελάληκα — «Я, Господь, сказал»; ἥξει, καὶ ποιήσω — «придёт, и сделаю»; οὐ διαστελῶ — «не сделаю различия» (слав. «не укосню», в тексте слав.); οὐδὲ μὴ ἐλεήσω — «и не помилую»; κατὰ τὰς ὁδούς σου... κρινῶ σε — «по путям твоим... буду судить тебя»; повтор «сего ради... по кровем твоим и по помыслом твоим» передан."
  15: "Вводная формула; далее слово о смерти жены пророка (16–17)."
  16: "τὰ ἐπιθυμήματα τῶν ὀφθαλμῶν σου — «вожделения (утеху) очей твоих»; ἐν παρατάξει — «в строю (сражении)», слав. «в поражении»; οὐ μὴ κοπῇς οὐδὲ μὴ κλαυσθῇς — «не будешь сетовать и не будешь плакать»."
  17: "στεναγμὸς αἵματος, ὀσφύος, πένθους ἐστίν — «стенание — крови, чресл, плача» (тёмное); слав. добавляет «возстени молчя» — нет в LXX, внесено без скобок. οὐκ ἔσται τὸ τρίχωμά σου συμπεπλεγμένον — «волосы твои не будут заплетены»; слав. «да будут власи твои сплетени» (утвердительно), в тексте слав.; τὰ ὑποδήματά σου ἐν τοῖς ποσίν σου — «обувь твоя на ногах твоих»; ἄρτον ἀνδρῶν οὐ μὴ φάγῃς — «хлеба мужей не ешь» (погребальный хлеб)."
  18: "ἐλάλησα πρὸς τὸν λαόν — «говорил я народу»; ἀπέθανεν ἡ γυνή μου ἑσπέρας — «умерла жена моя вечером»; ἐποίησα τὸ πρωῒ ὃν τρόπον ἐπετάγη μοι — «сделал утром, как повелено мне»."
  19: "Οὐκ ἀναγγελεῖς ἡμῖν τί ἐστιν ταῦτα, ἃ σὺ ποιεῖς; — «не возвестишь ли нам, что это, что ты делаешь?»"
  20: "Начало ответа пророка: «и сказал я им» — вне кавычек; далее его речь в 「…」, а слово Господа внутри неё — 『…』 (до конца главы)."
  21: "τὰ ἅγιά μου — «святыни Мои» (聖所); φρύαγμα ἰσχύος ὑμῶν — «гордость силы вашей»; ἐπιθυμήματα ὀφθαλμῶν ὑμῶν — «вожделения очей ваших»; ὑπὲρ ὧν φείδονται αἱ ψυχαὶ ὑμῶν — «то, чего щадят души ваши»; ἐν ῥομφαίᾳ πεσοῦνται — «падут от меча»."
  22: "ποιήσετε ὃν τρόπον πεποίηκα — «сделаете, как я сделал»; ἀπὸ στόματος αὐτῶν οὐ παρακληθήσεσθε — «устами их не утешитесь»; ἄρτον ἀνδρῶν οὐ φάγεσθε — «хлеба мужей не будете есть»."
  23: "αἱ κόμαι ὑμῶν ἐπὶ τῆς κεφαλῆς — «волосы ваши на голове»; τὰ ὑποδήματα ἐν τοῖς ποσίν — «обувь на ногах»; οὔτε μὴ κόψησθε οὔτε μὴ κλαύσητε — «не будете сетовать и не будете плакать»; ἐντακήσεσθε ἐν ταῖς ἀδικίαις ὑμῶν — «растаете в беззакониях ваших»; παρακαλέσετε ἕκαστος τὸν ἀδελφὸν αὐτοῦ — «утешите каждый брата своего» (LXX); слав. «не утешите» (отрицание), в тексте слав."
  24: "ἔσται Ιεζεκιηλ ὑμῖν εἰς τέρας — «будет вам Иезекииль в знамение» (τέρας); κατὰ πάντα, ὅσα ἐποίησεν, ποιήσετε — «по всему, что он сделал, сделаете»; ἐπιγνώσεσθε διότι ἐγὼ κύριος — «узнаете, что Я Господь»."
  25: "τὴν ἰσχὺν παρ᾿ αὐτῶν — «силу их»; τὴν ἔπαρσιν τῆς καυχήσεως αὐτῶν — «высоту похвалы их»; τὰ ἐπιθυμήματα ὀφθαλμῶν αὐτῶν — «вожделения очей их»; τὴν ἔπαρσιν ψυχῆς αὐτῶν — «высоту души их»; υἱοὺς αὐτῶν καὶ θυγατέρας — «сыновей их и дочерей». Стих обрывается — продолжение в 26."
  26: "ὁ ἀνασῳζόμενος — «спасшийся (уцелевший)»; τοῦ ἀναγγεῖλαί σοι εἰς τὰ ὦτα — «возвестить тебе в уши»; греч. знак вопроса в конце — артефакт пунктуации, переведено утвердительно (слав. без вопроса)."
  27: "διανοιχθήσεται τὸ στόμα σου πρὸς τὸν ἀνασῳζόμενον — «откроются уста твои к уцелевшему»; οὐ μὴ ἀποκωφωθῇς οὐκέτι — «не будешь более немым» (ἀποκωφόομαι); ἔσῃ αὐτοῖς εἰς τέρας — «будешь им в знамение»; ἐπιγνώσονται διότι ἐγὼ κύριος — «узнают, что Я Господь»."
