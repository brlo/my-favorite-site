# jp-box, Иезекииль, глава 24. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в этой главе gr, csl и ru совпадают: 27 стихов.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
# Содержание: 1–2 девятый год, десятый месяц, десятый день — день начала осады,
# повеление записать его; 3–5 притча о котле: мясо, кости, огонь; 6–8 город кровей,
# ржавчина, кровь на голой скале; 9–14 костёр, расплавленная медь, нечистота,
# «не пощажу и не помилую»; 15–17 смерть жены пророка и запрет плакать; 18–19
# исполнение и вопрос народа; 20–27 ответ пророка: осквернение святыни, дети падут
# от меча, знамение, уста откроются при уцелевшем.
# Речи: 1 — формула с датой; 2–14 — 「…»; 15 — формула; 16–17 — 「…»; 18–19 —
# повествование пророка без кавычек; 20 — «и сказал я им» вне кавычек, далее речь
# пророка в 「…」, а слово Господа внутри неё — 『…』 (открывается в 20, закрывается
# в 27).
# Паритет: 24:10 слав. добавляет «и кости истают» — нет в LXX; 24:11 слав. «(тощь)»
# — редакционная вставка в скобках, не перенесена; 24:14 слав. «не укосню» при греч.
# «не сделаю различия»; 24:17 слав. добавляет «возстени молчя» — нет в LXX, и держит
# утвердительное «да будут власи твои сплетени» при греч. отрицании; 24:23 слав.
# «не утешите» при греч. «утешите» — в тексте слав.
# Имена: エゼキエル, エルサレム, イスラエル, バビロン, ユダ.

