# jp-box, Второе послание к Коринфянам, глава 2. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 2: почему Павел писал со слезами (1–4), прощение согрешившего (5–11),
# беспокойство о Тите и путь в Македонию (12–13), триумф и запах познания (14–17).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет, <j>/<mo> не ставятся.
# 〔…〕 в главе нет: расхождений с базой, требующих скобок, нет.
# Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

tr_code: jp-box
book: 2kor
chapter: 2
draft: true

verses:
  1: "なぜなら、わたしは自分自身[じぶんじしん]にこう決[き]めた。再[ふたた]び悲[かな]しみをもってあなたがたのところへ行[い]かない、と。"
  2: "なぜなら、もしわたしがあなたがたを悲[かな]しませるなら、わたしを喜[よろこ]ばせてくれるのは、わたしが悲[かな]しませたその人[ひと]のほかに、だれがいるだろうか。"
  3: "わたしがこのことを書[か]いたのは、行[い]ったとき、わたしが喜[よろこ]ぶべき人[ひと]々[びと]から悲[かな]しみを受[う]けることのないためであった。わたしは、あなたがたすべてについて、わたしの喜[よろこ]びがあなたがたすべての喜[よろこ]びであると確信[かくしん]している。"
  4: "なぜなら、わたしは大[おお]きな苦難[くなん]と心[こころ]の痛[いた]みのゆえに、多[おお]くの涙[なみだ]をもってあなたがたに書[か]いた。あなたがたを悲[かな]しませるためではなく、あなたがたに対してわたしがどれほど豊[ゆた]かな愛[あい]を抱[いだ]いているかを、あなたがたに知[し]ってもらうためであった。"
  5: "しかし、もしだれかが悲[かな]しみを引[ひ]き起[お]こしたのなら、その人[ひと]はわたしを悲[かな]しませたのではなく、ある程度[ていど]は——あまり重[おも]くは言[い]わないが——あなたがたすべてを悲[かな]しませたのである。"
  6: "そのような人[ひと]には、多[おお]数[すう]の人[ひと]々[びと]によるこの懲[こ]らしで十分[じゅうぶん]である。"
  7: "だから、かえってあなたがたは、むしろその人[ひと]を赦[ゆる]し、慰[なぐさ]めるべきである。あまりに大[おお]きな悲[かな]しみに、その人[ひと]が呑[の]み込[こ]まれてしまわないためである。"
  8: "それゆえ、わたしはあなたがたに勧[すす]める。その人[ひと]への愛[あい]を確[かく]かなものとしなさい。"
  9: "なぜなら、わたしがこのことを書[か]いたのは、あなたがたがすべてのことにおいて従順[じゅうじゅん]であるかどうか、あなたがたの試[こころ]みを確[たし]かめるためでもあった。"
  10: "あなたがたがだれかを何[なに]か赦[ゆる]すなら、わたしも赦[ゆる]す。なぜなら、わたしも何かを赦[ゆる]したのなら、その赦[ゆる]しは、あなたがたのために、キリストの御前[みまえ]で行[おこな]ったのである。"
  11: "それは、わたしたちがサタンに付[つ]け込[こ]まれないためである。わたしたちはサタンの企[たくら]みを知[し]らないわけではないからである。"
  12: "わたしがキリストの福音[ふくいん]のためにトロアスへ行[い]ったとき、主[しゅ]にあってわたしのために門[と]が開[ひら]かれていたが、"
  13: "わたしの兄弟[きょうだい]テトスに会[あ]えなかったので、わたしの霊[れい]には安[やす]らぎがなかった。そこで、彼[かれ]らに別[わか]れを告[つ]げて、マケドニアへ出発[しゅっぱつ]した。"
  14: "しかし、神[かみ]に感謝[かんしゃ]する。神[かみ]は、キリストにあってわたしたちをいつも凱旋[がいせん]の行列[ぎょうれつ]に連[つ]れて行[い]き、わたしたちを通[とお]して、キリストを知[し]る香[かおり]をいたるところで漂[ただよ]わせてくださる。"
  15: "なぜなら、わたしたちは、救[すく]われつつある者[もの]たちの間[あいだ]でも、滅[ほろ]びつつある者[もの]たちの間でも、神[かみ]に対してキリストの香[かおり]だからである。"
  16: "一方[いっぽう]の人[ひと]々[びと]には、死[し]から死[し]へと至[いた]らせる死の香[かおり]であり、他方[たほう]の人[ひと]々[びと]には、命[いのち]から命[いのち]へと至[いた]らせる命の香[かおり]である。これらのことに、だれが堪[た]えられるだろうか。"
  17: "なぜなら、わたしたちは、多[おお]くの人[ひと]々[びと]のように、神[かみ]の言葉[ことば]を混[ま]ぜ物[もの]にして売[う]る者[もの]ではない。そうではなく、わたしたちは誠実[せいじつ]から出[で]た者[もの]として、いや、神[かみ]から出[で]た者[もの]として、神[かみ]の御前[みまえ]で、キリストにあって語[かた]っているのである。"

notes:
  1: "ἔκρινα ἐμαυτῷ — 自分自身に決めた; ἐν λύπῃ — 悲しみをもって."
  2: "ὁ λυπούμενος ἐξ ἐμοῦ — «огорчённый мною»; わたしが悲しませたその人. Риторический вопрос сохранён."
  3: "ἀφ᾽ ὧν ἔδει με χαίρειν — «те, от кого мне надлежало радоваться»; わたしが喜ぶべき人々. πεποιθώς — 確信している."
  4: "συνοχὴ καρδίας — «стеснение сердца»; 心の痛み. οὐχ ἵνα λυπηθῆτε — 悲しませるためではなく."
  5: "ἀλλὰ ἀπὸ μέρους, ἵνα μὴ ἐπιβαρῶ — «но отчасти, чтобы не обременять»; ある程度は——あまり重くは言わないが——."
  6: "ἐπιτιμία — 懲らし; οἱ πλείονες — 多数の人々."
  7: "τοὐναντίον μᾶλλον — かえってむしろ; καταποθῇ — 呑み込まれる."
  8: "κυρῶσαι — «утвердить, ратифицировать»; 確かなものとする."
  9: "δοκιμή — 試み; ὑπήκοος — 従順."
  10: "κἀγώ — わたしも; ἐν προσώπῳ Χριστοῦ — キリストの御前で (в базе без Ἰησοῦ)."
  11: "πλεονεκτηθῶμεν — 付け込まれる; νοήματα — 企み."
  12: "εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ — キリストの福音のために; θύρα ἀνεῳγμένη — 門が開かれている."
  13: "ἄνεσις — 安らぎ; ἀποταξάμενος — 別れを告げて."
  14: "θριαμβεύοντι ἡμᾶς — «ведущему нас в триумфальном шествии»; 凱旋の行列に連れて行き. ὀσμὴ τῆς γνώσεως — 自分を知る香り."
  15: "εὐωδία — 香り; σῳζόμενοι / ἀπολλύμενοι — 救われつつある者 / 滅びつつある者."
  16: "ὀσμὴ ἐκ θανάτου εἰς θάνατον — 死から死へと至らせる香り; τίς ἱκανός — だれが堪えられるか."
  17: "καπηλεύοντες — «торгующие вразнос, подмешивающие»; 混ぜ物にして売る. Двойное ἀλλά передано явно: そうではなく…いや…."
