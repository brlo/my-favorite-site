# jp-box, Притчи, глава 6. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для Притчей есть (гл. 4–6) — контроль церковного чтения;
# jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 6: поручительство (1–5), лень и муравей (6–11), нечестивый человек (12–15),
# семь мерзостей (16–19), хранение заповеди отца и матери (20–23),
# предостережение от прелюбодеяния (24–35).
# Прямая речь: слова ленивого в 6:10 — 「…」; остальное — наставление, без кавычек.
# Нумерация по gr: 35 стихов. 6:8 включает подстихи 8a–c (пчела) — перевод целиком
# внутри 6:8, стихи не добавлены. 6:11 включает 11a — внутри 6:11.
# В LXX 6:16 нет МТ-формулы «шесть… семь»; список начинается с 6:17.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).

