verses:
  1: "わが子[こ]よ、もしあなたが友[とも]の保証人[ほしょうにん]となり、自分[じぶん]の手[て]を敵[てき]に渡[わた]すなら、"
  2: "自分[じぶん]の唇[くちびる]は人[ひと]にとって強[つよ]い罠[わな]であり、人は自分の口[くち]の唇によって捕[とら]えられるからである。"
  3: "わが子[こ]よ、わたしが命[めい]じることを行[おこな]い、自分[じぶん]を救[すく]え。あなたは友[とも]のゆえに悪[あく]の手[て]に陥[おちい]っているからである。気[き]を弱[よわ]らせずに行[い]き、あなたが保証[ほしょう]した友を奮[ふる]い立[た]たせよ。"
  4: "あなたの目[め]に眠[ねむ]りを与[あた]えるな。まぶたにまどろみを与えるな。"
  5: "罠[わな]から逃[のが]れるかもしかのように、仕掛[しか]け網[あみ]から逃れる鳥[とり]のように、救[すく]われるためである。"
  6: "怠[なま]け者[もの]よ、蟻[あり]のところへ行[い]き、その道[みち]を見[み]て学[まね]び、蟻よりも賢[かしこ]くなれ。"
  7: "蟻[あり]には畑[はたけ]もなく、これを強[し]いる者[もの]もなく、主人[しゅじん]に仕[つか]えることもないのに、"
  8: "夏[なつ]のうちに食[た]べ物[もの]を備[そな]え、刈[か]り入[い]れの時[とき]に多[おお]くの蓄[たくわ]えをする。あるいは、蜂[はち]のところへ行[い]き、それがいかに働[はたら]き者[もの]で、その仕事[しごと]をいかに尊[とうと]く行[おこな]うかを学[まな]べ。蜂の労苦[ろうく]を、王[おう]たちも平民[へいみん]も健康[けんこう]のために用[もち]い、蜂はすべての者[もの]に慕[した]われ、栄誉[えいよ]を受[う]ける。力[ちから]は弱[よわ]いけれども、知恵[ちえ]を尊[とうと]んだゆえに前[まえ]へ進[すす]められたのである。"
  9: "怠[なま]け者[もの]よ、いつまでそうやって寝[ね]ているのか。目覚[めざ]めるのは、いつのことか。"
  10: "「少[すこ]し眠[ねむ]ろう。少し座[すわ]ろう。少しまどろもう。両手[りょうて]を組[く]んで胸[むね]を抱[だ]こう。」"
  11: "そうして、貧[まず]しさが悪[わる]い旅人[たびびと]のように、乏[とぼ]しさが速[はや]い走[はし]り手[て]のように、あなたのところへ来[く]る。しかし、あなたが怠[おこた]らなければ、あなたの刈[か]り入[か]れは泉[いずみ]のように来[き]たり、乏しさは悪い走り手のようにあなたから逃[に]げ去[さ]る。"
  12: "愚[おろ]かな不法[ふほう]の者[もの]は良[よ]くない道[みち]を歩[あゆ]む。"
  13: "その者[もの]は目[め]で合図[あいず]し、足[あし]で示[しめ]し、指[ゆび]の動[うご]きで教[おし]える。"
  14: "曲[ま]がった心[こころ]で、いつも悪[あく]を企[たくら]む。このような者[もの]は都[みやこ]に争[あらそ]いを起[お]こす。"
  15: "それゆえ、その者[もの]の滅[ほろ]びは突然[とつぜん]に来[く]る。断[た]ち切[き]られ、癒[いや]しがたい破[は]壊[かい]が来る。"
  16: "主[しゅ]が憎[にく]むすべてのものを、その者[もの]は喜[よろこ]ぶ。魂[たましい]の汚[けが]れのゆえに、その者は砕[くだ]かれる。"
  17: "高慢[こうまん]な者[もの]の目[め]、不正[ふせい]な舌[した]、正[ただ]しい者[もの]の血[ち]を流[なが]す手[て]、"
  18: "悪[あく]い思[おも]いを企[たくら]む心[こころ]、悪を行[おこな]うために急[いそ]ぐ足[あし]は滅[ほろ]ぼされる。"
  19: "不正[ふせい]な証人[しょうにん]は偽[いつわ]りを燃[も]え上[あ]がらせ、兄弟[きょうだい]の間[あいだ]に争[あらそ]いを送[おく]り込[こ]む。"
  20: "わが子[こ]よ、父[ちち]の掟[おきて]を守[まも]れ。母[はは]の定[さだ]めを捨[す]てるな。"
  21: "それをいつもあなたの魂[たましい]に結[むす]びつけ、あなたの首[くび]に巻[ま]きつけよ。"
  22: "あなたが歩[あゆ]むとき、それを伴[とも]なえ。それはあなたとともにいる。あなたが眠[ねむ]るとき、それはあなたを守[まも]り、あなたが目覚[めざ]めるとき、あなたと語[かた]る。"
  23: "律法[りっぽう]の戒[いまし]めは灯[ともしび]であり、光[ひかり]である。叱責[しっせき]と戒めは命[いのち]の道[みち]である。"
  24: "それは、あなたを人[ひと]の妻[つま]から、また他人[たにん]の舌[した]の讒言[ざんげん]から守[まも]るためである。"
  25: "わが子[こ]よ、美[うつく]しさへの欲[よく]に負[ま]けるな。あなたの目[め]に捕[とら]えられるな。彼女[かのじょ]のまぶたにさらわれるな。"
  26: "遊女[ゆうじょ]の値段[ねだん]はパン一個[いっこ]ほどであるが、人妻[ひとづま]は人[ひと]の尊[とうと]い魂[たましい]を捕[とら]える。"
  27: "人[ひと]が火[ひ]を胸[むね]に包[くる]んで、衣服[いふく]を焼[や]かないでいられるだろうか。"
  28: "あるいは、人[ひと]が火[ひ]の炭[すみ]の上[うえ]を歩[あゆ]んで、足[あし]を焼[や]かないでいられるだろうか。"
  29: "人[ひと]の妻[つま]のところに入[はい]る者[もの]も同[おな]じである。彼女[かのじょ]に触[ふ]れる者[もの]は、だれひとり罪[つみ]なき者とされない。"
  30: "人[ひと]が盗[ぬす]みをして捕[とら]えられても不思議[ふしぎ]ではない。飢[う]えているとき、自分[じぶん]の魂[たましい]を満[み]たすために盗[ぬす]むのだから。"
  31: "しかし、捕[とら]えられれば、七倍[ななばい]を償[つぐな]い、自分[じぶん]のすべての財産[ざいさん]を出[だ]して自分を贖[あがな]う。"
  32: "しかし、姦淫[かんいん]する者[もの]は分別[ふんべつ]に欠[か]けるゆえに、自分[じぶん]の魂[たましい]に滅[ほろ]びを招[まね]く。"
  33: "その者[もの]は苦[くる]しみと辱[はずかし]めを受[う]け、その恥[はじ]は永遠[とこしえ]に消[け]し去[さ]られない。"
  34: "彼女[かのじょ]の夫[おっと]の怒[いか]りは嫉妬[しっと]に満[み]ちている。裁[さば]きの日[ひ]に、夫は容赦[ようしゃ]しない。"
  35: "夫[おっと]はどんな身代[みのしろ]金[きん]をもってしても敵意[てきい]を捨[す]てず、多[おお]くの贈[おく]り物[もの]によっても和[やわ]らがない。"

notes:
  1: "ἐὰν ἐγγυήσῃ σὸν φίλον — もし友の保証人となるなら (ἐγγυάω — «поручиться»). παραδώσεις σὴν χεῖρα ἐχθρῷ — 自分の手を敵に渡す (παραδίδωμι — «предавать, отдавать»). Условная клауза продолжается в 6:2."
  2: "παγὶς ἰσχυρὰ ἀνδρὶ τὰ ἴδια χείλη — 自分の唇は人にとって強い罠 (παγίς — «сеть, ловушка»). ἁλίσκεται χείλεσιν ἰδίου στόματος — 自分の口の唇によって捕らえられる (ἁλίσκομαι — «быть пойманным»)."
  3: "ποίει… ἃ ἐγώ σοι ἐντέλλομαι — わたしが命じることを行え. ἥκεις εἰς χεῖρας κακῶν διὰ σὸν φίλον — 友のゆえに悪の手に陥っている (ἥκω — «приходить»). ἴθι μὴ ἐκλυόμενος — 気を弱らせずに行け (ἐκλύομαι — «ослабевать»). παρόξυνε τὸν φίλον σου — 友を奮い立たせよ (παροξύνω — «побуждать»)."
  4: "μὴ δῷς ὕπνον σοῖς ὄμμασιν — 目に眠りを与えるな (ὄμμα — «глаз»). ἐπινυστάξῃς σοῖς βλεφάροις — まぶたにまどろみを与えるな (ἐπινυστάζω — «дремать»; βλέφαρον — «веко»)."
  5: "ἵνα σῴζῃ ὥσπερ δορκὰς ἐκ βρόχων — 罠から逃れるかもしかのように、救われるためである (δορκάς — «серна, газель»; βρόχος — «петля, силок»). ὥσπερ ὄρνεον ἐκ παγίδος — 網から逃れる鳥のように (παγίς — «ловушка»)."
  6: "Ἴθι πρὸς τὸν μύρμηκα, ὦ ὀκνηρέ — 怠け者よ、蟻のところへ行け (μύρμηξ — «муравей»; ὀκνηρός — «ленивый»). ζήλωσον ἰδὼν τὰς ὁδοὺς αὐτοῦ — その道を見て学べ (ζηλόω — «ревновать, подражать»). γενοῦ ἐκείνου σοφώτερος — 蟻よりも賢くなれ."
  7: "ἐκείνῳ γεωργίου μὴ ὑπάρχοντος — у него нет хозяйства (γεώργιον — «поле, хозяйство»; gen. abs.). μηδὲ τὸν ἀναγκάζοντα ἔχων — не имея понуждающего (ἀναγκάζω — «принуждать»). μηδὲ ὑπὸ δεσπότην ὤν — и не будучи под господином (δεσπότης — «господин»)."
  8: "ἑτοιμάζεται θέρους τὴν τροφήν — 夏に食べ物を備える (θέρος — «лето»; в csl порядок обратный: «готовит в жатву пищу… в лето уготование»). ἐν τῷ ἀμήτῳ ποιεῖται τὴν παράθεσιν — 刈り入れ時に蓄えをする (ἀμητός — «жатва»; παράθεσις — «запас»). 8a–c — добавление о пчеле (ἢ πορεύθητι πρὸς τὴν μέλισσαν…), есть в csl и в gr-lxx-byz; ὡς ἐργάτις ἐστίν — «как она работяща», τὴν ἐργασίαν ὡς σεμνὴν ποιεῖται — «как делает работу почтенной»; в ряде изданий LXX отсутствует. Переведено целиком внутри 6:8, деление на подстихи сохранено, стихов не добавлено."
  9: "ἕως τίνος, ὀκνηρέ, κατάκεισαι — いつまでそうやって寝ているのか (κατάκειμαι — «лежать»). πότε ἐξ ὕπνου ἐγερθήσῃ — 目覚めるのは、いつのことか (ἐγείρω — «пробуждать»; ἐξ ὕπνου — «от сна»)."
  10: "Слова ленивого — 「」: ὀλίγον ὑπνοῖς, ὀλίγον κάθησαι, μικρὸν νυστάζεις, ὀλίγον ἐναγκαλίζῃ χερσὶν στήθη — «немного поспишь, немного посидишь, немного подремлешь, немного обнимешь руками грудь» (слав. «Мало убо спиши…»). ἐναγκαλίζομαι — «обнимать»; στῆθος — «грудь»."
  11: "εἶτα ἐμπαραγίνεταί σοι… ἡ πενία — そうして貧しさがやって来る (πενία — «бедность»). ὥσπερ κακὸς ὁδοιπόρος — 悪い旅人のように (ὁδοιπόρος — «путник»). ἡ ἔνδεια ὥσπερ ἀγαθὸς δρομεύς — 乏しさが速い走り手のように (ἔνδεια — «нужда»; δρομεύς — «бегун»). 11a: ἐὰν δὲ ἄοκνος ᾖς… — если будешь трудолюбив (ἄοκνος — «неленивый»); ἀπαυτομολήσει — «убежит» (слав. «отбежит»)."
  12: "Ἀνὴρ ἄφρων καὶ παράνομος — 愚かな不法の者 (ἄφρων — «глупый»; παράνομος — «беззаконный»). πορεύεται ὁδοὺς οὐκ ἀγαθάς — 良くない道を歩む. В ru «человек лукавый… со лживыми устами» (МТ), в LXX иначе."
  13: "ἐννεύει ὀφθαλμῷ — 目で合図する (ἐννεύω — «кивать, подавать знак»). σημαίνει ποδί — 足で示す (σημαίνω — «значить, указывать»). διδάσκει ἐννεύμασιν δακτύλων — 指の動きで教える (δάκτυλος — «палец»)."
  14: "διεστραμμένῃ καρδίᾳ τεκταίνεται κακά — 曲がった心で悪を企む (τεκταίνομαι — «замышлять»; букв. «плотничать»). ὁ τοιοῦτος ταραχὰς συνίστησιν πόλει — このような者は都に争いを起こす (ταραχή — «смута»; συνίστημι — «возбуждать»)."
  15: "διὰ τοῦτο ἐξαπίνης ἔρχεται ἡ ἀπώλεια αὐτοῦ — それゆえ滅びは突然に来る (ἐξαπίνης — «внезапно»). διακοπὴ καὶ συντριβὴ ἀνίατος — 断ち切られ、癒しがたい破壊 (διακοπή — «отсечение»; συντριβή — «сокрушение»; ἀνίατος — «неисцельный»)."
  16: "ὅτι χαίρει πᾶσιν, οἷς μισεῖ ὁ κύριος — 主が憎むすべてのものを喜ぶ (χαίρω — «радоваться»). συντρίβεται δι᾽ ἀκαθαρσίαν ψυχῆς — 魂の汚れのゆえに砕かれる (ἀκαθαρσία — «нечистота»). В LXX 6:16 нет МТ-формулы «шесть… семь»; список начинается с 6:17. В csl «Бог» (в gr ὁ κύριος) — переведено 主 по терминологии."
  17: "ὀφθαλμὸς ὑβριστοῦ — 高慢な者の目 (ὕβριστος — «дерзкий, наглый»; слав. «око досадителя»). γλῶσσα ἄδικος — 不正な舌. χεῖρες ἐκχέουσαι αἷμα δικαίου — 正しい者の血を流す手 (ἐκχέω — «проливать»). Перечень 6:17–19, поэтому стих кончается запятой."
  18: "καρδία τεκταινομένη λογισμοὺς κακούς — 悪い思いを企む心 (λογισμός — «помысел»). πόδες ἐπισπεύδοντες κακοποιεῖν — 悪を行うために急ぐ足 (ἐπισπεύδω — «спешить»). Слав. прибавляет в конце «потребятся» — «будут истреблены» (в LXX нет); внесено в основной текст по паритету («足は滅ぼされる»)."
  19: "ἐκκαίει ψεύδη μάρτυς ἄδικος — 不正な証人は偽りを燃え上がらせる (ἐκκαίω — «зажигать»; ψεῦδος — «ложь»). ἐπιπέμπει κρίσεις ἀνὰ μέσον ἀδελφῶν — 兄弟の間に争いを送り込む (κρίσεις — «суды, тяжбы»; слав. «насылает суды»). Переведено 争い, как в ru, по смыслу «тяжбы, раздоры»."
  20: "φύλασσε νόμους πατρός σου — 父の掟を守れ (νόμος — «закон»). μὴ ἀπώσῃ θεσμοὺς μητρός σου — 母の定めを捨てるな (θεσμός — «устав, установление»; ἀπωθέω — «отталкивать»)."
  21: "ἄφαψαι αὐτὰ ἐπὶ σῇ ψυχῇ διὰ παντός — いつもあなたの魂に結びつけよ (ἄφαπτω — «привязывать»). ἐγκλοίωσαι ἐπὶ σῷ τραχήλῳ — 首に巻きつけよ (ἐγκλοιόω — «обвязывать»; τράχηλος — «шея»)."
  22: "ἡνίκα ἂν περιπατῇς, ἐπάγου αὐτήν — 歩むとき、それを伴なえ (ἐπάγω — «вести с собой»). ὡς δ᾽ ἂν καθεύδῃς, φυλασσέτω σε — 眠るとき、それはあなたを守る. ἵνα ἐγειρομένῳ συλλαλῇ σοι — 目覚めるとき、あなたと語る (συλλαλέω — «беседовать»)."
  23: "λύχνος ἐντολὴ νόμου καὶ φῶς — 律法の戒めは灯であり光 (λύχνος — «светильник»). ὁδὸς ζωῆς ἔλεγχος καὶ παιδεία — 叱責と戒めは命の道 (ἔλεγχος — «обличение»; παιδεία — «наставление»)."
  24: "τοῦ διαφυλάσσειν σε ἀπὸ γυναικὸς ὑπάνδρου — あなたを人妻から守るため (διαφυλάσσω — «охранять»; ὕπανδρος — «замужняя»). ἀπὸ διαβολῆς γλώσσης ἀλλοτρίας — 他人の舌の讒言から (διαβολή — «клевета»)."
  25: "Слав. добавляет обращение «Сыне» (в LXX нет), внесено без скобок по паритету. μή σε νικήσῃ κάλλους ἐπιθυμία — 美しさへの欲に負けるな (νικάω — «побеждать»; ἐπιθυμία — «желание»). μηδὲ ἀγρευθῇς σοῖς ὀφθαλμοῖς — あなたの目に捕らえられるな (ἀγρεύω — «ловить»). μηδὲ συναρπασθῇς ἀπὸ τῶν αὐτῆς βλεφάρων — 彼女のまぶたにさらわれるな (συναρπάζω — «уносить, похищать»)."
  26: "τιμὴ πόρνης ὅση καὶ ἑνὸς ἄρτου — 遊女の値段はパン一個ほど (τιμή — «цена»; πόρνη — «блудница»). γυνὴ ἀνδρῶν τιμίας ψυχὰς ἀγρεύει — 人妻は尊い魂を捕らえる (γυνὴ ἀνδρῶν — «замужняя»; ἀγρεύω — «ловить»)."
  27: "ἀποδήσει τις πῦρ ἐν κόλπῳ — 人が火を胸に包む (ἀποδέω — «связывать»; κόλπος — «недро, пазуха»). τὰ ἱμάτια οὐ κατακαύσει — 衣服を焼かないでいられるか (ἱμάτιον — «одежда»; κατακαίω — «сжигать»). Риторический вопрос."
  28: "περιπατήσει τις ἐπ᾽ ἀνθράκων πυρός — 火の炭の上を歩む (ἄνθραξ — «уголь»). τοὺς πόδας οὐ κατακαύσει — 足を焼かないでいられるか. Риторический вопрос, параллельный 6:27."
  29: "ὁ εἰσελθὼν πρὸς γυναῖκα ὕπανδρον — 人妻のところに入る者 (ὕπανδρος — «замужняя»). οὐκ ἀθῳωθήσεται — 罪なき者とされない (ἀθῳόω — «оправдывать»; слав. «не без вины будет»). πᾶς ὁ ἁπτόμενος αὐτῆς — 彼女に触れる者はだれも (ἅπτομαι — «касаться»)."
  30: "οὐ θαυμαστὸν ἐὰν ἁλῷ τις κλέπτων — 盗みをして捕らえられても不思議ではない (θαυμαστόν — «удивительно»; ἁλίσκομαι — «быть пойманным»). κλέπτει ἵνα ἐμπλήσῃ τὴν ψυχὴν πεινῶν — 飢えて魂を満たすために盗む (ἐμπίπλημι — «наполнять»; πεινάω — «голодать»)."
  31: "ἀποτείσει ἑπταπλάσια — 七倍を償う (ἀποτίνω — «уплачивать»; ἑπταπλάσιος — «семеричный»). πάντα τὰ ὑπάρχοντα αὐτοῦ δοὺς ῥύσεται ἑαυτόν — すべての財産を出して自分を贖う (ῥύομαι — «избавлять, выкупать»)."
  32: "ὁ μοιχὸς δι᾽ ἔνδειαν φρενῶν — 姦淫する者は分別に欠けるゆえに (μοιχός — «прелюбодей»; ἔνδεια φρενῶν — «недостаток ума»). ἀπώλειαν τῇ ψυχῇ αὐτοῦ περιποιεῖται — 自分の魂に滅びを招く (περιποιέω — «приобретать, готовить себе»)."
  33: "ὀδύνας καὶ ἀτιμίας ὑποφέρει — 苦しみと辱めを受ける (ὀδύνη — «боль»; ἀτιμία — «бесчестие»). τὸ ὄνειδος αὐτοῦ οὐκ ἐξαλειφθήσεται εἰς τὸν αἰῶνα — その恥は永遠に消し去られない (ὄνειδος — «поношение»; ἐξαλείφω — «изглаживать»)."
  34: "μεστὸς ζήλου θυμὸς ἀνδρὸς αὐτῆς — 彼女の夫の怒りは嫉妬に満ちている (ζῆλος — «ревность»; θυμός — «ярость»; μεστός — «полный»). οὐ φείσεται ἐν ἡμέρᾳ κρίσεως — 裁きの日に容赦しない (φείδομαι — «щадить»)."
  35: "οὐκ ἀνταλλάξεται οὐδενὸς λύτρου τὴν ἔχθραν — どんな身代金でも敵意を捨てない (ἀνταλλάσσω — «обменивать»; λύτρον — «выкуп»; ἔχθρα — «вражда»). οὐδὲ μὴ διαλυθῇ πολλῶν δώρων — 多くの贈り物でも和らがない (διαλύω — «развязывать, умилостивлять»; слав. «не разрешится многими дарми»)."
