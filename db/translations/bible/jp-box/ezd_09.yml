verses:
  1: "これらのことが終[お]わったとき、長[かしら]たちがわたしのもとに来[き]て言[い]った。「イスラエルの民[たみ]、祭司[さいし]たち、レビ人[びと]たちは、その地[ち]の民[たみ]々[みん]と分[わ]かれず、彼[かれ]らの忌[い]まわしい行[おこな]いにならっている。すなわち、カナン人[じん]、ヘテ人[じん]、ペレジ人[じん]、エブス人[じん]、アモン人[じん]、モアブ人[じん]、モセリ人[じん]、アモリ人[じん]である。"
  2: "彼[かれ]らは自分[じぶん]たちとその子[こ]らたちのために、その娘[むすめ]たちを妻[つま]に迎[むか]え、聖[せい]なる血統[けっとう]がその地[ち]の民[たみ]々[みん]と混[ま]じ合[あ]った。しかも、長[かしら]たちと支配[しはい]する者[もの]たちの手[て]が、この背信[はいしん]の先頭[せんとう]にあった。」"
  3: "わたしはこの言葉[ことば]を聞[き]いて、自分[じぶん]の上着[うわぎ]と下着[したぎ]を引[ひ]き裂[さ]き、頭[あたま]の毛[け]とひげを引[ひ]き抜[ぬ]き、悲[かな]しみながら座[すわ]っていた。"
  4: "そのとき、捕囚[ほしゅう]から帰[かえ]った者[もの]たちの背信[はいしん]のゆえに、イスラエルの神[かみ]の言葉[ことば]を恐[おそ]れる者[もの]たちが皆[みな]、わたしのもとに集[あつ]まった。わたしは夕[ゆう]べの献[ささ]げ物[もの]の時[とき]まで、悲[かな]しみながら座[すわ]っていた。"
  5: "夕[ゆう]べの献[ささ]げ物[もの]の時[とき]に、わたしは苦[くる]しみの中[なか]から立[た]ち上[あ]がった。上着[うわぎ]と下着[したぎ]を引[ひ]き裂[さ]いたまま、わたしはひざまずき、わたしの神[かみ]である主[しゅ]に向[む]かって両手[りょうて]を広[ひろ]げた。"
  6: "そして言[い]った。「わたしの神[かみ]よ、わたしは恥[は]じて、あなたに向[む]かって顔[かお]を上[あ]げることができない。わたしたちの不義[ふぎ]が頭[あたま]の上[うえ]に積[つ]み上[あ]がり、わたしたちの罪[つみ]が天[てん]にまで大[おお]きくなったからである。"
  7: "わたしたちの父祖[ふそ]の日[ひ]から今日[こんにち]まで、わたしたちは大[おお]きな罪[つみ]のうちにあり、わたしたちの不義[ふぎ]のゆえに、わたしたちも、わたしたちの王[おう]たちも、祭司[さいし]たちも、子[こ]らたちも、異邦[いほう]の王[おう]たちの手[て]に渡[わた]されて、剣[つるぎ]にかかり、捕囚[ほしゅう]となり、略奪[りゃくだつ]され、顔[かお]に恥[はじ]を受[う]けた。今日[こんにち]もそうである。"
  8: "しかし今[いま]、わたしたちの神[かみ]である主[しゅ]はわたしたちをあわれみ、救[すく]いのために残[のこ]る者[もの]を残[のこ]し、その聖所[せいしょ]の場所[ばしょ]にわたしたちを立[た]たせてくださった。こうしてわたしたちの神[かみ]はわたしたちの目[め]を照[て]らし、わたしたちの奴隷[どれい]の身[み]に小[ちい]さな生[い]き返[かえ]りを与[あた]えてくださった。"
  9: "わたしたちは奴隷[どれい]である。しかし、その奴隷[どれい]の身[み]にあっても、わたしたちの神[かみ]である主[しゅ]はわたしたちを見捨[みす]てず、ペルシアの王[おう]たちの前[まえ]でわたしたちに慈[いつく]しみを傾[かたむ]け、わたしたちを生[い]き返[かえ]らせ、わたしたちの神[かみ]の家[いえ]を建[た]て直[なお]し、その荒[あ]れ果[は]てたところを復興[ふっこう]させ、ユダヤとエルサレムに垣[かき]を与[あた]えてくださった。"
  10: "わたしたちの神[かみ]よ、この後[あと]、何[なに]を言[い]えようか。あなたの戒[いまし]めから離[はな]れたからである。"
  11: "あなたは、しもべである預言者[よげんしゃ]たちの手[て]によって、こう命[めい]じられた。『あなたがたが行[い]って嗣業[しぎょう]として受[う]け取[と]ろうとしている地[ち]は、その地[ち]の民[たみ]々[みん]の汚[けが]れ、すなわち彼[かれ]らがその忌[い]まわしい行[おこな]いによって、端[はし]から端[はし]まで満[み]たした汚[けが]れのゆえに、汚[けが]れている。"
  12: "あなたがたの娘[むすめ]を彼[かれ]らの子[こ]らに与[あた]えてはならない。彼[かれ]らの娘[むすめ]をあなたがたの子[こ]らに迎[むか]えてもならない。彼[かれ]らの平和[へいわ]と幸福[こうふく]を永久[えいきゅう]に求[もと]めてはならない。あなたがたが強[つよ]くなり、その地[ち]の良[よ]いもの食[た]べ、これを永久[えいきゅう]にあなたがたの子[こ]らに嗣業[しぎょう]として伝[つた]えるためである。』"
  13: "わたしたちの悪[わる]い行[おこな]いと大[おお]きな咎[とが]のゆえに、これらすべてのことがわたしたちに降[ふ]りかかった後[あと]でも、わたしたちの神[かみ]のような方[かた]はほかにない。あなたはわたしたちの不義[ふぎ]を軽[かる]くし、救[すく]いを与[あた]えてくださった。"
  14: "なぜなら、わたしたちは再[ふたた]びあなたの戒[いまし]めを破[やぶ]り、その地[ち]の民[たみ]と縁組[えんぐみ]しようとしているからである。どうか、残[のこ]る者[もの]も救[すく]われる者[もの]もなくなるまで、わたしたちに怒[いか]りを発[はっ]されないように。"
  15: "イスラエルの神[かみ]である主[しゅ]よ、あなたは正[ただ]しい。わたしたちは今日[こんにち]まで残[のこ]された者[もの]である。見[み]よ、わたしたちは自分[じぶん]の不義[ふぎ]のうちにあって、あなたの前[まえ]にいる。このような後[あと]では、だれもあなたの前[まえ]に立[た]つことはできない。」"

notes:
  1: "ἐν μακρύμμασιν αὐτῶν — «в мерзостях их» (μακρύμμα — мерзость; слав. «в мерзостех их»); οὐκ ἐχωρίσθη — не отделился (χωρίζω); λαῶν τῶν γαιῶν — народов земель, т. е. местных; перечень: Χανανι, Εθι, Φερεζι, Ιεβουσι, Αμμωνι, Μωαβι, Μοσερι, Αμορι — カナン人, ヘテ人, ペレジ人, エブス人, アモン人, モアブ人, モセリ人, アモリ人. В LXX «Μοσερι» (モセリ), у csl «мосеритяне»; Синод. по евр. «Египтян». Речь начальников — кавычки до ст. 2."
  2: "ἐλάβοσαν ἀπὸ θυγατέρων αὐτῶν — взяли из дочерей их; παρήχθη σπέρμα τὸ ἅγιον — «было увлечено семя святое», т. е. смешалось (παράγω); ἐν λαοῖς τῶν γαιῶν — с народами земель; χεὶρ τῶν ἀρχόντων — рука начальствующих; ἐν τῇ ἀσυνθεσίᾳ ταύτῃ — в этом беззаконии, нарушении завета (ἀσυνθεσία); ἐν ἀρχῇ — в начале, т. е. они были первыми."
  3: "διέρρηξα τὰ ἱμάτιά μου — разодрал одежды мои (διαρρήγνυμι); ἐπαλλόμην — трепетал, бился (πάλλω); ἔτιλλον — рвал (τίλλω); ἀπὸ τῶν τριχῶν τῆς κεφαλῆς — из волос головы; ἀπὸ τοῦ πώγωνος — из бороды (πώγων); ἐκαθήμην ἠρεμάζων — «сидел в покое, оцепенении» (ἠρεμάζω; csl «седох тужа» — принято csl)."
  4: "πᾶς ὁ διώκων λόγον θεοῦ — «всякий стремящийся к слову Бога» (διώκω — гнать, стремиться); csl «вси боящиися слова» — принято csl (神の言葉を恐れる者); ἐπὶ ἀσυνθεσίᾳ τῆς ἀποικίας — из-за беззакония переселения (ἀποικία); ἕως τῆς θυσίας τῆς ἑσπερινῆς — до вечерней жертвы (θυσία ἑσπερινή)."
  5: "ἐν θυσίᾳ τῇ ἑσπερινῇ — во время вечерней жертвы; ἀνέστην ἀπὸ ταπεινώσεώς μου — встал от уничижения моего (ταπείνωσις); ἐν τῷ διαρρῆξαί με — при раздирании мною [одежд]; κλίνω ἐπὶ τὰ γόνατά μου — преклоняю колени; ἐκπετάζω τὰς χεῖρας — простираю руки (ἐκπετάζω)."
  6: "ᾐσχύνθην καὶ ἐνετράπην — устыдился и устрашился (αἰσχύνομαι, ἐντρέπω); τοῦ ὑψῶσαι τὸ πρόσωπόν μου — поднять лицо моё; αἱ ἀνομίαι ἡμῶν ἐπληθύνθησαν ὑπὲρ κεφαλῆς — беззакония умножились выше головы; αἱ πλημμέλειαι — прегрешения (πλημμέλεια); ἕως εἰς οὐρανόν — до неба. С этого стиха — молитва Ездры (кавычки до ст. 15)."
  7: "ἀπὸ ἡμερῶν πατέρων ἡμῶν — со дней отцов наших; ἐν πλημμελείᾳ μεγάλῃ — в великой вине; ἕως τῆς ἡμέρας ταύτης — до сего дня; παρεδόθημεν — преданы (παραδίδωμι); ἐν ῥομφαίᾳ — под мечом (ῥομφαία); ἐν αἰχμαλωσίᾳ — в плену; ἐν διαρπαγῇ — в разграблении (διαρπαγή); ἐν αἰσχύνῃ προσώπου — в посрамлении лица; ὡς ἡ ἡμέρα αὕτη — как в сей день; csl добавляет «священницы наши» (祭司) — принято; «сынове наши» (子ら) есть и в LXX."
  8: "ἐπιεικεύσατο — смилостивился (ἐπιεικεύω); τοῦ καταλιπεῖν ἡμῖν εἰς σωτηρίαν — чтобы оставить нам [уцелевших] для спасения; στήριγμα — утверждение, опора (στήριγμα); ἐν τόπῳ ἁγιάσματος αὐτοῦ — на месте святыни Его (ἁγίασμα); φωτίσαι ὀφθαλμούς — просветить очи; ζωοποίησις μικρά — «малое оживление» (ζωοποίησις); ἐν τῇ δουλείᾳ ἡμῶν — в рабстве нашем. «По малом времени» — масоретская добавка Синодального, в LXX и csl её нет."
  9: "δοῦλοί ἐσμεν — мы рабы; οὐκ ἐγκατέλιπεν — не оставил (ἐγκαταλείπω); ἔκλινεν ἐφ᾿ ἡμᾶς ἔλεος — склонил к нам милость; ἐνώπιον βασιλέων Περσῶν — пред царями Персидскими; ζωοποίησις — оживление; ἀναστῆσαι τὰ ἔρημα αὐτῆς — восставить пустыни его (ἔρημος); φραγμός — ограда (φραγμός), т. е. защита."
  10: "τί εἴπωμεν — что скажем (сослагательное); μετὰ τοῦτο — после этого; ἐγκατελίπομεν ἐντολάς σου — оставили заповеди Твои."
  11: "ἐν χειρὶ δούλων σου τῶν προφητῶν — рукою рабов Твоих пророков; λέγων — говоря (вводит речь Бога); ἡ γῆ, εἰς ἣν εἰσπορεύεσθε — земля, в которую вы входите; κληρονομῆσαι αὐτήν — наследовать её; γῆ μετακινουμένη ἐν μετακινήσει λαῶν — «земля, колеблемая в колебании народов» (μετακίνησις); csl «земля нечиста есть по нечистоте людий языческих» — принято csl (汚れている); ἐν μακρύμμασιν αὐτῶν — мерзостями их; ἀπὸ στόματος ἐπὶ στόμα — «из уст в уста», т. е. от края до края; ἐν ἀκαθαρσίαις — в нечистотах."
  12: "μὴ δῶτε … μὴ λάβητε — не давайте … не берите (сослагательные); οὐκ ἐκζητήσετε εἰρήνην αὐτῶν — не будете искать мира их; ἕως αἰῶνος — вовек; ὅπως ἐνισχύσητε — чтобы укрепиться (ἐνισχύω); φάγητε τὰ ἀγαθὰ τῆς γῆς — есть блага земли; κληροδοτήσητε — дадите в наследие (κληροδοτέω)."
  13: "μετὰ πᾶν τὸ ἐρχόμενον ἐφ᾿ ἡμᾶς — после всего, что пришло на нас; ἐν ποιήμασιν ἡμῶν τοῖς πονηροῖς — в делах наших злых (ποίημα); ἐν πλημμελείᾳ τῇ μεγάλῃ — в великой вине; ὅτι οὐκ ἔστιν ὡς ὁ θεὸς ἡμῶν — «ибо нет [Бога] как Бог наш», т. е. нет подобного Ему; ἐκούφισας τὰς ἀνομίας — облегчил беззакония (κουφίζω; csl «избавил еси»); ἔδωκας σωτηρίαν — дал спасение. Тёмное место, понято по csl и контексту."
  14: "ἐπεστρέψαμεν διασκεδάσαι — обратились разорить (διασκεδάζω — рассеять, разрушить); ἐπιγαμβρεῦσαι — вступить в родство (ἐπιγαμβρεύω); μὴ παροξυνθῇς — не разгневайся (παροξύνω); ἕως συντελείας — до конца, до истребления (συντέλεια); ἐγκατάλειμμα — остаток; διασῳζόμενον — спасаемый."
  15: "δίκαιος σύ — праведен Ты; κατελείφθημεν διασῳζόμενοι — мы остались спасёнными; ὡς ἡ ἡμέρα αὕτη — как в сей день; ἐναντίον σου ἐν πλημμελείαις — пред Тобою в прегрешениях; οὐκ ἔστιν στῆναι ἐνώπιόν σου ἐπὶ τούτῳ — невозможно стать пред Тобою из-за этого (csl «не возможно стати пред тобою сего ради»)."
