verses:
  1: "イエスがある場所[ばしょ]で祈[いの]っておられたとき、祈[いの]り終[お]えられると、弟子[でし]の一人[ひとり]が言[い]った。「主[しゅ]よ、ヨハネが自分[じぶん]の弟子[でし]たちに教[おし]えたように、わたしたちにも祈[いの]りを教[おし]えてください。」"
  2: "イエスは彼[かれ]らに言[い]われた。「<j>あなたがたが祈[いの]るときは、こう言[い]いなさい。『〔天[てん]におられるわたしたちの〕父[ちち]よ。御名[みな]が聖[せい]とされますように。御国[みくに]が来[き]ますように。〔御心[みこころ]が、天[てん]におけるように地[ち]の上[うえ]にも行[おこな]われますように。〕</j>"
  3: "<j>わたしたちの日[ひ]ごとの糧[かて]を、毎日[まいにち]わたしたちにお与[あた]えください。</j>"
  4: "<j>わたしたちの罪[つみ]をお赦[ゆる]しください。わたしたちも、自分[じぶん]に負[お]い目[め]のあるすべての人[ひと]を赦[ゆる]しますから。わたしたちを試[こころ]みに導[みちび]き入[い]れないでください。〔しかし、わたしたちを悪[わる]い者[もの]からお救[すく]いください。〕</j>』」"
  5: "イエスは彼[かれ]らに言[い]われた。「<j>あなたがたのうち、友[とも]のところへ真夜中[まよなか]に行[い]って、こう言[い]う者[もの]がいるだろうか。『友[とも]よ、パンを三[みっ]つ貸[か]してくれ。</j>"
  6: "<j>旅[たび]の友[とも]がわたしのところへ来[き]たのだが、出[だ]すものが何[なに]もない。』</j>"
  7: "<j>すると、家[いえ]の中[なか]から彼[かれ]が答[こた]えて言[い]う。『わたしを煩[わずら]わせないでくれ。戸[と]はもう閉[と]ざされてしまい、子[こ]どもたちもわたしと一緒[いっしょ]に寝床[ねどこ]にいる。起[お]きて、おまえに何[なに]か渡[わた]すことはできない。』</j>"
  8: "<j>あなたがたに言[い]う。彼[かれ]は友[とも]であるからという理由[りゆう]だけでは、起[お]きて何[なに]か与[あた]えようとはしないだろう。しかし、その厚[あつ]かましさのゆえに、起[お]きて、必要[ひつよう]なものを何[なん]でも与[あた]えるであろう。</j>"
  9: "<j>わたしもあなたがたに言[い]う。求[もと]めなさい。そうすれば与[あた]えられる。探[さが]しなさい。そうすれば見[み]つかる。叩[たた]きなさい。そうすれば開[あ]けられる。</j>"
  10: "<j>求[もと]める者[もの]はだれでも受[う]け、探[さが]す者[もの]は見[み]つけ、叩[たた]く者[もの]には開[あ]けられるからである。</j>」"
  11: "「<j>あなたがたのうち、どの父[ちち]が、〔子[こ]にパンを求[もと]められて石[いし]を与[あた]えるだろうか。〕子[こ]が魚[さかな]を求[もと]めたとき、魚[さかな]の代[か]わりに蛇[へび]を渡[あた]すだろうか。</j>"
  12: "<j>卵[たまご]を求[もと]められて、蠍[さそり]を渡[あた]すだろうか。</j>"
  13: "<j>あなたがたは悪[わる]い者[もの]であっても、自分[じぶん]の子[こ]どもに良[よ]い物[もの]を与[あた]えることを知[し]っている。まして天[てん]の父[ちち]は、願[ねが]い求[もと]める者[もの]たちに{聖霊[せいれい]|聖神[せいしん]}をお与[あた]えにならないことがあろうか。</j>」"
  14: "さて、イエスは口[くち]のきけない悪霊[あくりょう]を追[お]い出[だ]しておられた。悪霊[あくりょう]が出[で]て行[い]くと、口[くち]のきけない人[ひと]が物[もの]を言[い]った。群衆[ぐんしゅう]は驚[おどろ]いた。"
  15: "しかし、その中[なか]のある者[もの]たちは言[い]った。「この人[ひと]が悪霊[あくりょう]を追[お]い出[だ]すのは、悪霊[あくりょう]の頭[かしら]ベルゼブルによるのだ。」"
  16: "ほかの者[もの]たちは、イエスを試[こころ]みようとして、天[てん]から来[く]るしるしを求[もと]めていた。"
  17: "イエスは彼[かれ]らの思[おも]いを知[し]って、言[い]われた。「<j>国[くに]はどれも、自[みずか]ら分裂[ぶんれつ]すれば荒[あ]れ果[は]て、家[いえ]は家[いえ]の上[うえ]に倒[たお]れる。</j>"
  18: "<j>もしサタンも自[みずか]ら分裂[ぶんれつ]したのなら、その国[くに]はどうして立[た]ち行[ゆ]くことができるだろうか。あなたがたは、わたしがベルゼブルによって悪霊[あくりょう]を追[お]い出[だ]していると言[い]っている。</j>"
  19: "<j>わたしがベルゼブルによって悪霊[あくりょう]を追[お]い出[だ]しているのなら、あなたがたの子[こ]らは、だれによって追[お]い出[だ]しているのか。だから、彼[かれ]らがあなたがたを裁[さば]く者[もの]となる。</j>"
  20: "<j>しかし、わたしが神[かみ]の指[ゆび]によって悪霊[あくりょう]を追[お]い出[だ]しているのなら、神[かみ]の国[くに]はあなたがたのところにまで臨[のぞ]んでいるのである。</j>」"
  21: "「<j>強[つよ]い者[もの]が武具[ぶぐ]を身[み]に着[つ]けて自分[じぶん]の家[いえ]を守[まも]っている間[あいだ]は、その財産[ざいさん]は安[やす]らかである。</j>"
  22: "<j>しかし、彼[かれ]よりも強[つよ]い者[もの]が攻[せ]め来[き]て彼[かれ]に勝[か]つと、彼[かれ]が頼[たよ]りにしていた武具[ぶぐ]を奪[うば]い取[と]り、戦利品[せんりひん]を分[わ]け与[あた]える。</j>"
  23: "<j>わたしと共[とも]にいない者[もの]は、わたしに敵[てき]する者[もの]である。わたしと共[とも]に集[あつ]めない者[もの]は、散[ち]らす者[もの]である。</j>」"
  24: "「<j>汚[けが]れた霊[れい]が人[ひと]から出[で]て行[い]くと、水[みず]のない所[ところ]を巡[めぐ]って休[やす]み場[ば]を求[もと]めるが、見[み]つからずに言[い]う。『出[で]て来[き]た自分[じぶん]の家[いえ]へ帰[かえ]ろう。』</j>"
  25: "<j>そして来[き]てみると、その家[いえ]は掃[は]き清[きよ]められ、整[ととの]えられている。</j>"
  26: "<j>そこで、自分[じぶん]よりも悪[わる]い七[なな]つの霊[れい]を連[つ]れて来[き]て、中[なか]に入[はい]り、そこに住[す]みつく。こうして、その人[ひと]の最後[さいご]の状態[じょうたい]は、初[はじ]めよりも悪[わる]くなる。</j>」"
  27: "イエスがこれらのことを話[はな]しておられると、群衆[ぐんしゅう]の中[なか]から一人[ひとり]の女[おんな]が声[こえ]を上[あ]げて言[い]った。「あなたを宿[やど]した腹[はら]と、あなたが吸[す]った乳[ちち]とは、なんと幸[さいわ]いなことでしょう。」"
  28: "イエスは言[い]われた。「<j>むしろ、神[かみ]の言葉[ことば]を聞[き]いて守[まも]る者[もの]たちこそ、幸[さいわ]いである。</j>」"
  29: "群衆[ぐんしゅう]がますます集[あつ]まって来[き]たとき、イエスは話[はな]し始[はじ]められた。「<j>この時代[じだい]は悪[わる]い時代[じだい]である。しるしを求[もと]めているが、預言者[よげんしゃ]ヨナのしるしのほかには、しるしは与[あた]えられない。</j>"
  30: "<j>ヨナがニネベの人々[ひとびと]にとってしるしとなったように、人[ひと]の子[こ]もこの時代[じだい]にとってしるしとなるであろう。</j>"
  31: "<j>シバの女王[じょおう]は、裁[さば]きのとき、この時代[じだい]の人々[ひとびと]と共[とも]に立[た]ち上[あ]がって、彼[かれ]らを罪[つみ]に定[さだ]める。彼女[かのじょ]は地[ち]の果[は]てから、ソロモンの知恵[ちえ]を聞[き]こうとして来[き]たからである。ここに、ソロモンにまさるものがある。</j>"
  32: "<j>ニネベの人々[ひとびと]は、裁[さば]きのとき、この時代[じだい]と共[とも]に立[た]ち上[あ]がって、この時代[じだい]を罪[つみ]に定[さだ]める。彼[かれ]らはヨナの宣教[せんきょう]によって悔[く]い改[あらた]めたからである。ここに、ヨナにまさるものがある。</j>」"
  33: "「<j>ともし火[び]をともして、それを隠[かく]し場[ば]や升[ます]の下[した]に置[お]く者[もの]はいない。燭台[しょくだい]の上[うえ]に置[お]くのである。入[はい]って来[く]る者[もの]たちが、その光[ひかり]を見[み]るためである。</j>"
  34: "<j>体[からだ]のともし火[び]は、あなたの目[め]である。あなたの目[め]が清[きよ]らかであれば、全身[ぜんしん]も明[あか]るい。しかし、目[め]が悪[わる]ければ、あなたの体[からだ]も暗[くら]い。</j>"
  35: "<j>だから、あなたの中[なか]にある光[ひかり]が暗[くら]やみでないか、よく注意[ちゅうい]しなさい。</j>"
  36: "<j>あなたの全身[ぜんしん]が明[あか]るく、暗[くら]い部分[ぶぶん]がどこにもないなら、ともし火[び]がその光[ひかり]であなたを照[て]らすときのように、すべてが明[あか]るくなるであろう。</j>」"
  37: "イエスが話[はな]し終[お]えられると、一人[ひとり]のファリサイ派[は]の人[ひと]が、一緒[いっしょ]に食事[しょくじ]をしたいとイエスに願[ねが]った。イエスはその家[いえ]に入[はい]って席[せき]に着[つ]かれた。"
  38: "ファリサイ派[は]の人[ひと]は、イエスが食事[しょくじ]の前[まえ]に手[て]を洗[あら]わなかったのを見[み]て、不思議[ふしぎ]に思[おも]った。"
  39: "主[しゅ]は彼[かれ]に言[い]われた。「<j>今[いま]、あなたがたファリサイ派[は]の人々[ひとびと]は、杯[さかずき]や皿[さら]の外側[そとがわ]を清[きよ]める。しかし、あなたがたの内側[うちがわ]は強奪[ごうだつ]と悪[あく]で満[み]ちている。</j>"
  40: "<j>愚[おろ]か者[もの]たちよ。外側[そとがわ]を造[つく]った方[かた]は、内側[うちがわ]をも造[つく]られたのではないか。</j>"
  41: "<j>ただ、中[なか]にあるものを施[ほどこ]しに与[あた]えなさい。そうすれば、あなたがたにはすべてが清[きよ]いのである。</j>"
  42: "<j>しかし、あなたがたファリサイ派[は]の人々[ひとびと]は、不幸[ふこう]である。あなたがたはミントとルー⟨香辛料[こうしんりょう]や薬[くすり]に用[もち]いる草[くさ]。⟩と、あらゆる野菜[やさい]の十分[じゅうぶん]の一[いち]を納[おさ]めながら、裁[さば]きと神[かみ]への愛[あい]をないがしろにしている。これこそ行[おこな]うべきことで、あれもなおざりにしてはならない。</j>"
  43: "<j>あなたがたファリサイ派[は]の人々[ひとびと]は、不幸[ふこう]である。あなたがたは会堂[かいどう]の上座[じょうざ]や、広場[ひろば]での挨拶[あいさつ]を好[この]んでいる。</j>"
  44: "<j>〔律法学者[りっぽうがくしゃ]たちとファリサイ派[は]の偽善者[ぎぜんしゃ]たちよ。〕あなたがたは不幸[ふこう]である。あなたがたは人目[ひとめ]につかない墓[はか]のようである。その上[うえ]を歩[あ]く人々[ひとびと]は、それが何[なに]だか知[し]らない。</j>」"
  45: "すると、律法学者[りっぽうがくしゃ]の一人[ひとり]がイエスに答[こた]えて言[い]った。「先生[せんせい]。そうおっしゃるのは、わたしたちをも辱[はずか]しめることです。」"
  46: "イエスは言[い]われた。「<j>あなたがた律法学者[りっぽうがくしゃ]たちも、不幸[ふこう]である。あなたがたは人々[ひとびと]に負[お]い難[がた]い荷[に]を負[お]わせながら、自分[じぶん]ではその荷[に]に指[ゆび]一[いっ]本[ぽん]も触[ふ]れようとしない。</j>"
  47: "<j>あなたがたは不幸[ふこう]である。あなたがたは預言者[よげんしゃ]たちの墓[はか]を建[た]てている。しかし、彼[かれ]らを殺[ころ]したのは、あなたがたの父[ちち]たちである。</j>"
  48: "<j>こうして、あなたがたは父[ちち]たちの行[おこな]いの証人[しょうにん]であり、その行[おこな]いを認[みと]めているのである。彼[かれ]らは預言者[よげんしゃ]たちを殺[ころ]し、あなたがたは墓[はか]を建[た]てている。</j>"
  49: "<j>だから、神[かみ]の知恵[ちえ]も言[い]った。『わたしは預言者[よげんしゃ]たちと使徒[しと]たちを彼[かれ]らに遣[つか]わす。彼[かれ]らはそのうちのある者[もの]を殺[ころ]し、ある者[もの]を迫害[はくがい]する。</j>"
  50: "<j>それは、世[よ]の創[はじ]めから流[なが]されてきたすべての預言者[よげんしゃ]たちの血[ち]が、この時代[じだい]から求[もと]められるためである。</j>"
  51: "<j>アベルの血[ち]から、祭壇[さいだん]と神殿[しんでん]との間[あいだ]で殺[ころ]されたザカリヤの血[ち]に至[いた]るまで。』そう、あなたがたに言[い]う。それはこの時代[じだい]から求[もと]められる。</j>"
  52: "<j>あなたがた律法学者[りっぽうがくしゃ]たちは、不幸[ふこう]である。あなたがたは知識[ちしき]の鍵[かぎ]を取[と]り上[あ]げてしまった。自分[じぶん]は入[はい]らず、入[はい]ろうとしている者[もの]たちを妨[さまた]げている。</j>」"
  53: "イエスがこれらのことを話[はな]しておられると、律法学者[りっぽうがくしゃ]たちとファリサイ派[は]の人々[ひとびと]は、激[はげ]しく詰[つ]め寄[よ]り、いろいろなことについてイエスに問[と]い詰[つ]め始[はじ]めた。"
  54: "イエスの口[くち]から出[で]る何[なに]かを捕[と]らえようと、待[ま]ち伏[ぶ]せしていたのである。〔彼[かれ]を訴[うった]えるためであった。〕"

notes:
  2: "Молитва Господня в редакции Луки: адрес: в критической базе только Πάτερ; Церковь читает полный «Πάτερ ἡμῶν ὁ ἐν τοῖς οὐρανοῖς» (Елизаветинская, jp-joc 天に在す我等の父よ) — добавка в 〔…〕. Прошение о воле Божией — церковное чтение (Елизаветинская, jp-joc 爾の旨は…), в критической базе его нет — в 〔〕."
  3: "τὸν ἐπιούσιον τὸ καθ᾽ ἡμέραν — «хлеб на каждый день»; 日ごとの糧を毎日."
  4: "В критической базе молитва кончается на πειρασμός; Церковь (Елизаветинская «но избави нас от лукаваго», jp-joc 凶惡より救ひ給へ) читает ἀλλὰ ῥῦσαι ἡμᾶς ἀπὸ τοῦ πονηροῦ — в 〔〕."
  11: "В критической базе только рыба/змей; Церковь (Елизаветинская «еда камень подаст ему», jp-joc 餅/石) читает ещё хлеб/камень — вся вставка в 〔〕. Яйцо/скорпион (11:12) есть и в базе."
  14: "κωφόν — «немой» (о бесе, делающем человека немым); 口のきけない."
  20: "ἐν δακτύλῳ θεοῦ — «перстом Божиим» (у Мф 12:28 — Духом Святым); 神の指."
  24: "ἀνύδρων τόπων — 水のない所; ἀνάπαυσις — 休み場."
  31: "βασίλισσα νότου — «царица Юга»; передано シバの女王 по глоссарию (3 Цар 10:1), сглаживание отмечено."
  33: "В критической базе οὐδὲ ὑπὸ τὸν μόδιον под скобками; Церковь читает — 升の下, без 〔〕 (замена, а не добавка)."
  42: "τὸ ἡδύοσμον καὶ τὸ πήγανον — мята и рута; ミントとルー."
  44: "В критической базе только οὐαὶ ὑμῖν; Церковь (Елизаветинская, jp-joc 學士及びファリセイ等) читает «горе вам, книжники и фарисеи, лицемеры» — обращение в 〔〕."
  53: "В критической базе Κἀκεῖθεν ἐξελθόντος αὐτοῦ («когда Он вышел оттуда»); Церковь (Елизаветинская, jp-joc) читает λέγοντος δὲ αὐτοῦ ταῦτα («когда Он это говорил») — взято церковное чтение, без 〔〕 (замена, как Мф 6:1)."
  54: "Церковь добавляет ἵνα κατηγορήσωσιν αὐτοῦ («чтобы обвинить Его»; jp-joc 彼を罪せん為なり) — в 〔〕."
