verses:
  1: "そこで、ピラトはイエスを引[ひ]き取[と]ると、鞭打[むちう]った。"
  2: "兵士[へいし]たちは茨[いばら]で冠[かんむり]を編[あ]んで、その頭[あたま]に載[の]せ、紫[むらさき]の衣[ころも]を着[き]せた。"
  3: "そして、彼[かれ]のもとへ来[き]ては、「ユダヤ人[じん]の王[おう]、万歳[ばんざい]」と言[い]い、頰[ほお]を打[う]った。"
  4: "ピラトはまた外[そと]へ出[で]て、彼[かれ]らに言[い]った。「見[み]よ、この人[ひと]をあなたがたの前[まえ]に連[つ]れ出[だ]す。わたしがこの人[ひと]に何[なん]の罪[つみ]も見[み]いださないことを、あなたがたに知[し]ってもらうためである。」"
  5: "そこで、イエスは茨[いばら]の冠[かんむり]をかぶり、紫[むらさき]の衣[ころも]を着[き]て、外[そと]へ出[で]て来[こ]られた。ピラトは彼[かれ]らに言[い]った。「見[み]よ、この人[ひと]だ。」"
  6: "祭司長[さいしちょう]たちと下役[したやく]たちは、イエスを見[み]ると、「十字架[じゅうじか]につけろ、十字架[じゅうじか]につけろ」と叫[さけ]んだ。ピラトは彼[かれ]らに言[い]った。「あなたがたが引[ひ]き取[と]って、自分[じぶん]たちで十字架[じゅうじか]につけるがよい。わたしはこの人[ひと]に何[なん]の罪[つみ]も見[み]いださないのだから。」"
  7: "ユダヤ人[じん]たちは答[こた]えた。「わたしたちには律法[りっぽう]がある。その律法[りっぽう]によれば、この人[ひと]は死[し]ぬべきである。自分[じぶん]を神[かみ]の子[こ]としたからである。」"
  8: "ピラトはこの言葉[ことば]を聞[き]いて、ますます恐[おそ]れた。"
  9: "ピラトはまた総督官邸[そうとくかんてい]の中[なか]へ入[はい]り、イエスに言[い]った。「あなたはどこから来[き]たのか。」しかし、イエスは何[なに]もお答[こた]えにならなかった。"
  10: "ピラトはイエスに言[い]った。「わたしに答[こた]えないのか。わたしには、あなたを釈放[しゃくほう]する権[けん]も、十字架[じゅうじか]につける権[けん]もあることを知[し]らないのか。」"
  11: "イエスはお答[こた]えになった。「<j>上[うえ]から与[あた]えられていなければ、あなたはわたしに対して何[なん]の権[けん]も持[も]てなかった。だから、わたしをあなたに引[ひ]き渡[わた]した者[もの]の罪[つみ]は、さらに大[おお]きい。</j>」"
  12: "このことから、ピラトはイエスを釈放[しゃくほう]しようと努[つと]めた。しかし、ユダヤ人[じん]たちは叫[さけ]んで言[い]った。「この人[ひと]を釈放[しゃくほう]するなら、あなたはカエサルの友[とも]ではない。自分[じぶん]を王[おう]とする者[もの]は、だれでもカエサルに逆[さか]らう者[もの]である。」"
  13: "ピラトはこの言葉[ことば]を聞[き]くと、イエスを外[そと]へ連[つ]れ出[だ]し、敷石[しきいし]と呼[よ]ばれる所[ところ]、ヘブライ語[ご]でガバタという名[な]の裁[さば]きの座[ざ]に着[つ]いた。"
  14: "その日[ひ]は過越祭[すぎこしまつり]の準備[じゅんび]の日[ひ]で、時[とき]はおよそ第六時[だいろくじ]であった。ピラトはユダヤ人[じん]たちに言[い]った。「見[み]よ、あなたがたの王[おう]だ。」"
  15: "しかし、彼[かれ]らは叫[さけ]んだ。「連[つ]れ去[さ]れ、連[つ]れ去[さ]れ、十字架[じゅうじか]につけよ。」ピラトは彼[かれ]らに言[い]った。「あなたがたの王[おう]を十字架[じゅうじか]につけるのか。」祭司長[さいしちょう]たちは答[こた]えた。「わたしたちには、カエサルのほかに王[おう]はない。」"
  16: "そこで、ピラトはイエスを十字架[じゅうじか]につけるために、彼[かれ]らに引[ひ]き渡[わた]した。彼[かれ]らはイエスを引[ひ]き取[と]った。"
  17: "イエスはご自身[じしん]の十字架[じゅうじか]を負[お]って外[そと]へ出[で]、「されこうべ」と呼[よ]ばれる所[ところ]、ヘブライ語[ご]でゴルゴタという所[ところ]へ行[い]かれた。"
  18: "そこで、彼[かれ]らはイエスを十字架[じゅうじか]につけた。また、イエスとともにほかの二人[ふたり]を、一人[ひとり]はこちら側[がわ]、一人[ひとり]はあちら側[がわ]につけ、イエスはその真[ま]ん中[なか]にいた。"
  19: "ピラトはまた、罪状[ざいじょう]の書[か]きも記[しる]して、十字架[じゅうじか]の上[うえ]に掲[かか]げた。そこには、「ナザレのイエス、ユダヤ人[じん]の王[おう]」と書[か]かれていた。"
  20: "十字架[じゅうじか]につけられた所[ところ]が都[みやこ]に近[ちか]かったので、この罪状[ざいじょう]の書[か]きを読[よ]むユダヤ人[じん]は多[おお]かった。それにはヘブライ語[ご]、ラテン語[ご]、ギリシア語[ご]の三[みっ]つの言語[げんご]で記[しる]されていた。"
  21: "そこで、ユダヤ人[じん]の祭司長[さいしちょう]たちがピラトに言[い]った。「『ユダヤ人[じん]の王[おう]』と書[か]かないで、『この人[ひと]は、わたしはユダヤ人[じん]の王[おう]だと言[い]った』と書[か]いてください。」"
  22: "ピラトは答[こた]えた。「わたしが書[か]いたものは、書[か]いたとおりである。」"
  23: "兵士[へいし]たちは、イエスを十字架[じゅうじか]につけると、その衣[ころも]を取[と]って四[よっ]つに分[わ]け、兵士[へいし]が一人[ひとり]ずつ一[ひと]つずつを受[う]け取[と]った。また、下着[したぎ]も取[と]った。この下着[したぎ]は縫[ぬい]い目[め]がなく、上[うえ]から全体[ぜんたい]にわたって織[お]り上[あ]げたものであった。"
  24: "そこで、彼[かれ]らは互[たが]いに言[い]った。「これを裂[さ]かないで、だれのものになるか、くじを引[ひ]こう。」これは、『彼[かれ]らはわたしの衣[ころも]を自分[じぶん]たちで分[わ]け合[あ]い、わたしの着物[きもの]のためにくじを引[ひ]いた』と書[か]いてある聖書[せいしょ]が成就[じょうじゅ]するためであった。兵士[へいし]たちはこのようにした。"
  25: "イエスの十字架[じゅうじか]のそばには、イエスの母[はは]と、母[はは]の姉妹[しまい]、クロパの妻[つま]マリアと、マグダラのマリアが立[た]っていた。"
  26: "イエスは母[はは]と、そばに立[た]っている愛[あい]しておられた弟子[でし]をご覧[らん]になって、母[はは]に言[い]われた。「<j>婦人[ふじん]よ、ご覧[らん]なさい、あなたの子[こ]です。</j>」"
  27: "それから、その弟子[でし]に言[い]われた。「<j>ご覧[らん]なさい、あなたの母[はは]です。</j>」その時[とき]から、その弟子[でし]は母[はは]を自分[じぶん]の家[いえ]に迎[むか]え入[い]れた。"
  28: "その後[のち]、イエスは、すべてのことがすでに完了[かんりょう]していることを知[し]り、聖書[せいしょ]が成就[じょうじゅ]するために、「<j>わたしは渇[かわ]く</j>」と言[い]われた。"
  29: "そこには、酸[す]いぶどう酒[さけ]の満[み]ちた器[うつわ]が置[お]かれていた。そこで、海綿[かいめん]にその酸[す]いぶどう酒[さけ]をたっぷり含[ふく]ませ、ヒソプ⟨清[きよ]めに用[もち]いる草[くさ]。⟩に巻[ま]きつけて、イエスの口[くち]に差[さ]し出[だ]した。"
  30: "イエスは酸[す]いぶどう酒[さけ]を受[う]けると、「<j>完了[かんりょう]した</j>」と言[い]われ、頭[あたま]を垂[た]れて、霊[れい]を渡[わた]された。"
  31: "その日[ひ]は準備[じゅんび]の日[ひ]で、その安息日[あんそくび]は大[おお]きな日[ひ]であったから、ユダヤ人[じん]たちは、安息日[あんそくび]に遺体[いたい]を十字架[じゅうじか]の上[うえ]に残[のこ]さないように、ピラトに、彼[かれ]らの脛[はぎ]を折[お]って、遺体[いたい]を下[お]ろすことを願[ねが]い出[で]た。"
  32: "そこで、兵士[へいし]たちが来[き]て、まず一人[ひとり]の脛[はぎ]を折[お]り、次[つぎ]にもう一人[ひとり]の脛[はぎ]を折[お]った。"
  33: "しかし、イエスのところへ来[き]て、すでに死[し]んでいるのを見[み]ると、その脛[はぎ]は折[お]らなかった。"
  34: "しかし、兵士[へいし]の一人[ひとり]が槍[やり]でその脇腹[わきばら]を刺[さ]すと、すぐに血[ち]と水[みず]とが流[なが]れ出[で]た。"
  35: "これを見[み]た者[もの]が証[あかし]したのであり、その証[あかし]は真[まこと]である。彼[かれ]は自分[じぶん]が真実[しんじつ]を言[い]っていることを知[し]っている。あなたがたも信[しん]じるようになるためである。"
  36: "これらのことが起[お]こったのは、『その骨[ほね]は一[ひと]つも折[お]られない』と書[か]いてある聖書[せいしょ]が成就[じょうじゅ]するためであった。"
  37: "また、ほかの聖書[せいしょ]の言葉[ことば]も言[い]っている。『彼[かれ]らは、自分[じぶん]たちが刺[さ]し貫[つらぬ]いた方[かた]を仰[あお]ぎ見[み]るであろう。』"
  38: "その後[のち]、アリマタヤのヨセフが、イエスの遺体[いたい]を取[と]り下[お]ろすことをピラトに願[ねが]い出[で]た。彼[かれ]はイエスの弟子[でし]であったが、ユダヤ人[じん]たちを恐[おそ]れて、それを隠[かく]していたのである。ピラトは許[ゆる]したので、彼[かれ]は来[き]て、イエスの遺体[いたい]を取[と]り下[お]ろした。"
  39: "また、以前[いぜん]に夜[よる]イエスのもとへ来[き]たことのあるニコデモも、没薬[もつやく]とアロエを混[ま]ぜ合[あ]わせたものを持[も]って来[き]た。その重[おも]さはおよそ百[ひゃく]リトラであった。"
  40: "彼[かれ]らはイエスの遺体[いたい]を受[う]け取[と]り、ユダヤ人[じん]の葬[ほうむ]りの習[なら]わしに従[したが]って、香料[こうりょう]とともに亜麻布[あまぬの]で包[つつ]んだ。"
  41: "イエスが十字架[じゅうじか]につけられた所[ところ]には園[その]があり、その園[その]の中[なか]に、まだだれも葬[ほうむ]られたことのない新[あたら]しい墓[はか]があった。"
  42: "ユダヤ人[じん]の準備[じゅんび]の日[ひ]のことで、しかも墓[はか]が近[ちか]かったので、彼[かれ]らはイエスをそこに納[おさ]めた。"

notes:
  1: "ἔλαβεν — «взял» (в свою власть); 引き取った. ἐμαστίγωσεν — 鞭打った; у Марка 15:15 — φραγελλώσας, у Луки бичевание не описано."
  2: "πλέξαντες στέφανον ἐξ ἀκανθῶν — 茨で冠を編んで; ср. Мк 15:17, Мф 27:29. ἱμάτιον πορφυροῦν — 紫の衣 (у Матфея χλαμὺς κοκκίνη, 緋色の外套)."
  3: "ἤρχοντο … ἔλεγον … ἐδίδουσαν — имперфекты: подходили, говорили, били (повторялось); 来ては…言い、頰を打った. Слова воинов — не красные. ῥάπισμα — удар по щеке, 頰を打つ."
  4: "Ἴδε ἄγω ὑμῖν αὐτὸν ἔξω — 見よ、この人をあなたがたの前に連れ出す; ἵνα γνῶτε — 知ってもらうため. Речь Пилата — не красная."
  5: "Ἰδοὺ ὁ ἄνθρωπος — 見よ、この人だ (Ecce homo); без сглаживания в «вот Царь» или «вот Праведник»."
  6: "Σταύρωσον σταύρωσον — двойной императив сохранён. Λάβετε αὐτὸν ὑμεῖς καὶ σταυρώσατε — あなたがたが引き取って、自分たちで十字架につけるがよい (emphatic ὑμεῖς; Пилат отклоняет дело от себя); οὐχ εὑρίσκω … αἰτίαν — 何の罪も見いださない (как в 18:38)."
  7: "Ἡμεῖς νόμον ἔχομεν — わたしたちには律法がある; κατὰ τὸν νόμον ὀφείλει ἀποθανεῖν — その律法によれば死ぬべきである. υἱὸν θεοῦ ἑαυτὸν ἐποίησεν — 自分を神の子とした."
  8: "μᾶλλον ἐφοβήθη — «ещё более испугался»; ますます恐れた."
  9: "Πόθεν εἶ σύ; — あなたはどこから来たのか. ἀπόκρισιν οὐκ ἔδωκεν — 何もお答えにならなかった (ср. Мк 15:5; Мф 27:12)."
  10: "ἐξουσίαν ἔχω ἀπολῦσαί σε καὶ … σταυρῶσαί σε — порядок греческого: сначала освободить, потом распять. Слова Пилата — не красные."
  11: "ἄνωθεν — 上から (двусмысленность «свыше» сохранена, без раскрытия в «от Бога-Отца»). οὐκ εἶχες … εἰ μὴ ἦν δεδομένον — контрфактическое: 与えられていなければ…持てなかった. μείζονα ἁμαρτίαν — さらに大きい罪; παραδούς — 引き渡した者 (Иуда или Каиафа, евангелист не уточняет)."
  12: "ἐκ τούτου — «с этого времени, по этой причине»; このことから. φίλος τοῦ Καίσαρος — カエサルの友 (титул приближённых императора; здесь угроза обвинением в измене). ἀντιλέγει τῷ Καίσαρι — カエサルに逆らう."
  13: "βῆμα — 裁きの座. Λιθόστρωτον — 敷石 (греч. «каменный помост»), по-еврейски Γαββαθα — ガバタ. Ἑβραϊστί у Иоанна передано ヘブライ語 (ср. 5:2; 19:17,20; 20:16)."
  14: "παρασκευὴ τοῦ πάσχα — 過越祭の準備の日 (четверг); ὡς ἕκτη — およそ第六時, церковный счёт часов сохранён (ср. Мк 15:25,33). Ἴδε ὁ βασιλεὺς ὑμῶν — 見よ、あなたがたの王だ. Слова Пилата — не красные."
  15: "Ἆρον ἆρον — «убери, убери»; 連れ去れ, повтор сохранён. Τὸν βασιλέα ὑμῶν σταυρώσω; — あなたがたの王を十字架につけるのか (вопрос Пилата). Οὐκ ἔχομεν βασιλέα εἰ μὴ Καίσαρα — カエサルのほかに王はない."
  16: "παρέδωκεν αὐτὸν αὐτοῖς ἵνα σταυρωθῇ — 十字架につけるために引き渡した; Παρέλαβον — 引き取った (ирония: они принимают Того, от Кого только что требовали избавиться)."
  17: "βαστάζων αὑτῷ τὸν σταυρόν — «неся Свой крест»; ご自身の十字架を負って. У Иоанна нет Симона Киринеянина. Γολγοθᾶ — ゴルゴタ; сноска не нужна, слово уже объяснено в Мф 27:33 и Мк 15:22."
  18: "ἐντεῦθεν καὶ ἐντεῦθεν — こちら側とあちら側; μέσον δὲ τὸν Ἰησοῦν — イエスはその真ん中. У Иоанна нет насмешек проходящих и разбойников."
  19: "τίτλος — 罪状の書き (ср. Лк 23:38); Ἰησοῦς ὁ Ναζωραῖος — ナザレのイエス (у jp-joc «ナゾレイ»). Надпись приводится в 「」, но это не слова Христа — не красная."
  20: "Ἑβραϊστί, Ῥωμαϊστί, Ἑλληνιστί — порядок греческого: ヘブライ語、ラテン語、ギリシア語 (у Луки 23:38 порядок церковного текста иной). ἐγγὺς ἦν ὁ τόπος τῆς πόλεως — 都に近かった."
  21: "Μὴ γράφε … ἀλλ' ὅτι ἐκεῖνος εἶπεν — 書かないで…と書いてください. Вложенная цитата — 『』; речь Христа внутри неё передана косвенно, чтобы не добавлять третий уровень кавычек."
  22: "Ὃ γέγραφα, γέγραφα — 書いたものは書いたとおりである (perfect с повтором, отказ Пилата)."
  23: "χιτών — 下着 (у jp-joc 裏衣). ἄραφος — 縫い目がない; ἐκ τῶν ἄνωθεν ὑφαντὸς δι᾽ ὅλου — 上から全体にわたって織り上げた. τέσσαρα μέρη — 四つに分けた."
  24: "Пс 21:19. ἵνα ἡ γραφὴ πληρωθῇ — 聖書が成就するため; цитата в 『』. Οἱ μὲν οὖν στρατιῶται ταῦτα ἐποίησαν — 兵士たちはこのようにした."
  25: "ἀδελφὴ τῆς μητρὸς αὐτοῦ — 母の姉妹; Μαρία ἡ τοῦ Κλωπᾶ — クロパの妻マリア (родство точно не определено, отсюда без пояснений). Богородица здесь только присутствует и не говорит: <mo> не ставится, синих стихов в главе нет."
  26: "Γύναι — 婦人よ (обращение Христа к Матери, как в 2:4); ἴδε ὁ υἱός σου — ご覧なさい、あなたの子です. Слова Христа красные; порядок «мать — ученик» сохранён; ὃν ἠγάπα — 愛しておられた弟子, как в 20:2."
  27: "εἶτα — «затем»; ἴδε ἡ μήτηρ σου — ご覧なさい、あなたの母です. εἰς τὰ ἴδια — 自分の家に (букв. «в своё»); 迎え入れた."
  28: "εἰδὼς … ὅτι ἤδη πάντα τετέλεσται — すべてのことがすでに完了している; ἵνα τελειωθῇ ἡ γραφή — 聖書が成就するために. Διψῶ — わたしは渇く (Пс 68:22), без ослабления в «хочу пить»."
  29: "σκεῦος … ὄξους μεστόν — 酸いぶどう酒の満ちた器; σπόγγον … ὑσσώπῳ περιθέντες — 海綿をヒソプに巻きつけて. ὕσσωπος — ヒソプ, сноска при первом упоминании в корпусе (в Мф 27:48 и Мк 15:36 слова нет, там трость)."
  30: "Τετέλεσται — perfect от τελέω; 完了した (не «свершилось» с оттенком совершившегося пророчества). κλίνας τὴν κεφαλήν — 頭を垂れて; παρέδωκεν τὸ πνεῦμα — 霊を渡された."
  31: "παρασκευή — 準備の日; μεγάλη ἡ ἡμέρα ἐκείνου τοῦ σαββάτου — その安息日は大きな日. κατεαγῶσιν αὐτῶν τὰ σκέλη — 脛を折る (crurifragium), чтобы ускорить смерть и снять тела до субботы."
  32: "τοῦ μὲν πρώτου … καὶ τοῦ ἄλλου τοῦ συσταυρωθέντος αὐτῷ — まず一人…もう一人 (порядок греческого)."
  33: "τεθνηκότα — perfect причастие, «уже умер»; すでに死んでいる."
  34: "ἔνυξεν — «пронзил»; 槍で刺す. αἷμα καὶ ὕδωρ — 血と水, без аллегорического объяснения в тексте."
  35: "ὁ ἑωρακώς — «видевший» (о евангелисте); μεμαρτύρηκεν — perfect, 証しした. ἀληθινὴ … ἡ μαρτυρία — その証しは真である; ἵνα καὶ ὑμεῖς πιστεύσητε — あなたがたも信じるようになるため."
  36: "Исх 12:46; Числ 9:12; Пс 33:21. Ὀστοῦν οὐ συντριβήσεται αὐτοῦ — その骨は一つも折られない; цитата в 『』."
  37: "Зах 12:10. Ὄψονται εἰς ὃν ἐξεκέντησαν — 自分たちが刺し貫いた方を仰ぎ見る; цитата в 『』."
  38: "Ἰωσὴφ ὁ ἀπὸ Ἁριμαθαίας — アリマタヤのヨセフ; κεκρυμμένος δὲ διὰ τὸν φόβον — 恐れて隠していた (тайный ученик); ἐπέτρεψεν — 許した."
  39: "Νικόδημος — ニコデモ (ср. 3:1–2; 7:50). σμύρνη — 没薬 (сноска уже дана в Мф 2:11, повторно не ставлю); ἀλόη — アロエ. λίτρα — римский фунт, ок. 327 г; リトラ оставлено без пересчёта (около 100 фунтов, ок. 33 кг)."
  40: "ἔδησαν αὐτὸ ὀθονίοις μετὰ τῶν ἀρωμάτων — 香料とともに亜麻布で包んだ; ἔθος … ἐνταφιάζειν — 葬りの習わし."
  41: "κῆπος — 園; μνημεῖον καινόν — 新しい墓; οὐδέπω οὐδεὶς ἦν τεθειμένος — まだだれも葬られたことのない."
  42: "διὰ τὴν παρασκευὴν τῶν Ἰουδαίων, ὅτι ἐγγὺς ἦν τὸ μνημεῖον — 準備の日のことで、しかも墓が近かったので; ἔθηκαν — 納めた."
