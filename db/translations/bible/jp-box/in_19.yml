# jp-box, Евангелие от Иоанна, глава 19. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий (gr-lxx-byz) — свидетель; расхождения — в 〔…〕 и notes.
# jp-ni не использовался.
#
# Глава Распятия: суд у Пилата (1–16), Голгофа и распятие (17–27), смерть (28–37),
# погребение (38–42).
# Слова Христа — в <j>…</j> (11, 26–28, 30); слова Пилата, иудеев,
# первосвященников, воинов — вне тегов. Богородица в 19:25–27 присутствует,
# но не говорит: <mo> не ставится, синих стихов в главах 19–21 нет.
# τετέλεσται (19:28.30) — 完了した/完了している, без «свершилось».

