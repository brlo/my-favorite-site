# jp-box, Второзаконие, глава 7. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — csl-ru (jp-joc в гл. 7 отсутствует).
# ru (Синодальный, с масоретского) — только для понимания, не источник.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 7: речь Моисея: изгнание семи народов и запрет союза с ними (1–5),
# избранный народ, а не по многочисленности (6–11), благословение за послушание (12–16),
# ободрение перед войной и постепенное истребление (17–24),
# запрет брать серебро идолов (25–26).
# Истребление народов (ἀφανισμός, ἐξολεθρεύω, herem) не смягчается.
# Красного и синего нет; 〔…〕 нет: все слова есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 聖絶, 契約, 嗣業 уже в корпусе или понятны.
# jp-ni не использовался.

tr_code: jp-box
book: vtor
chapter: 7
draft: true

verses:
  1: "「あなたの神[かみ]である主[しゅ]が、あなたが入[はい]って嗣業[しぎょう]として受[う]け継[つ]ぐ地[ち]へ、あなたを導[みちび]き入[い]れられるとき、あなたの前[まえ]から大[おお]きな民[たみ]々[びと]を追[お]い払[はら]われる。すなわち、ヘテ人[じん]、ゲルガシ人[じん]、アモリ人[じん]、カナン人[じん]、ペリジ人[じん]、ヒビ人[じん]、エブス人[じん]の七[なな]つの民[たみ]であり、あなたがたよりも多[おお]く、強[つよ]い者[もの]たちである。"
  2: "あなたの神[かみ]である主[しゅ]が彼[かれ]らをあなたの手[て]に渡[わた]されるとき、あなたは彼[かれ]らを打[う]ち、必[かなら]ず滅[ほろ]ぼし尽[つ]くさなければならない。彼[かれ]らと契約[けいやく]を結[むす]んではならず、彼[かれ]らを憐[あわ]れんではならない。"
  3: "彼[かれ]らと縁組[えんぐみ]してはならない。あなたの娘[むすめ]をその息子[むすこ]に与[あた]えてはならず、その娘[むすめ]をあなたの息子[むすこ]に娶[めと]ってはならない。"
  4: "彼[かれ]らはあなたの息子[むすこ]をわたしから離[はな]れさせ、ほかの神[かみ]々[がみ]に仕[つか]えさせるからである。そうすれば、主[しゅ]の怒[いか]りがあなたがたに対して燃[も]え上[あ]がり、主[しゅ]はあなたを速[すみ]やかに滅[ほろ]ぼし尽[つ]くされる。"
  5: "しかし、あなたがたは彼[かれ]らにこうしなければならない。彼[かれ]らの祭壇[さいだん]を打[う]ち壊[こわ]し、その石柱[せきちゅう]を砕[くだ]き、その木立[こだち]を切[き]り倒[たお]し、その神[かみ]々[がみ]の彫[ほ]り物[もの]を火[ひ]で焼[や]きなさい。"
  6: "あなたは、あなたの神[かみ]である主[しゅ]にとって聖[せい]なる民[たみ]である。あなたの神[かみ]である主[しゅ]は、地[ち]の面[おもて]にあるすべての民[たみ]の中[なか]から、あなたを選[えら]んで、ご自分[じぶん]の宝[たから]の民[たみ]とされた。"
  7: "主[しゅ]があなたがたを選[えら]び、取[と]り分[わ]けられたのは、あなたがたがすべての民[たみ]よりも多[おお]かったからではない。あなたがたはすべての民[たみ]よりも少[すく]ないからである。"
  8: "しかし、主[しゅ]があなたがたを愛[あい]されたからであり、あなたがたの父[ちち]たちに誓[ちか]われた誓[ちか]いを守[まも]られたからである。それゆえ、主[しゅ]は強[つよ]い手[て]と高[たか]く上[あ]げた腕[うで]によってあなたがたを導[みちび]き出[だ]し、奴隷[どれい]の家[いえ]から、エジプトの王[おう]ファラオの手[て]から贖[あがな]い出[だ]された。"
  9: "あなたは、あなたの神[かみ]である主[しゅ]が神[かみ]であり、信[しん]実[じつ]な神[かみ]であることを知[し]らなければならない。主[しゅ]は、ご自分[じぶん]を愛[あい]し、その戒[いまし]めを守[まも]る者[もの]に、契約[けいやく]と慈[いつく]しみを千代[せんだい]に至[いた]るまで守[まも]られる。"
  10: "主[しゅ]は、ご自分[じぶん]を憎[にく]む者[もの]には、その顔[かお]に報[むく]いて滅[ほろ]ぼし尽[つ]くされる。主[しゅ]は憎[にく]む者[もの]をためらうことなく、その顔[かお]に報[むく]いを与[あた]えられる。"
  11: "あなたは、わたしが今日[きょう]あなたに命[めい]じる戒[いまし]めと定[さだ]めと裁[さば]きを守[まも]って行[おこな]わなければならない。"
  12: "あなたがたがこれらの定[さだ]めをすべて聞[き]き、守[まも]って行[おこな]うなら、あなたの神[かみ]である主[しゅ]は、あなたの父[ちち]たちに誓[ちか]われた契約[けいやく]と慈[いつく]しみを、あなたに対して守[まも]られる。"
  13: "主[しゅ]はあなたを愛[あい]し、祝福[しゅくふく]し、多[おお]く増[ふ]やされる。主[しゅ]はあなたの胎[たい]の実[み]と地[ち]の実[み]、すなわちあなたの小麦[こむぎ]、ぶどう酒[さけ]、油[あぶら]、牛[うし]の群[む]れと羊[ひつじ]の群[む]れを、あなたの父[ちち]たちに与[あた]えると誓[ちか]われた地[ち]で祝福[しゅくふく]される。"
  14: "あなたはすべての民[たみ]よりも祝福[しゅくふく]される。あなたがたの間[あいだ]にも、あなたの家畜[かちく]の間[あいだ]にも、子[こ]のない者[もの]も、不妊[ふにん]の者[もの]もいない。"
  15: "主[しゅ]はあなたからすべていかなる病[やまい]も取[と]り除[のぞ]かれる。あなたが見[み]、知[し]っているエジプトの悪[わる]い病[やまい]を、あなたに負[お]わせず、あなたを憎[にく]むすべての者[もの]に負[お]わせられる。"
  16: "あなたはすべての民[たみ]の分捕[ぶんど]り物[もの]を食[た]べる。あなたの目[め]は彼[かれ]らを惜[お]しんではならず、彼[かれ]らの神[かみ]々[がみ]に仕[つか]えてはならない。それはあなたのつまずきとなるからである。"
  17: "もしあなたが心[こころ]の中[なか]で『この民[たみ]はわたしよりも多[おお]い。どうしてわたしは彼[かれ]らを滅[ほろ]ぼし尽[つ]くすことができるだろうか』と言[い]うなら、"
  18: "彼[かれ]らを恐[おそ]れてはならない。あなたの神[かみ]である主[しゅ]がファラオとすべてのエジプト人[じん]に何[なに]をされたかを、よく思[おも]い出[だ]しなさい。"
  19: "すなわち、あなたの目[め]が見[み]た大[おお]きな試[ため]し、あの大[おお]きなしるしと不思議[ふしぎ]、強[つよ]い手[て]と高[たか]く上[あ]げた腕[うで]、あなたの神[かみ]である主[しゅ]があなたを導[みちび]き出[だ]されたそのすべてを思[おも]い出[だ]しなさい。わたしたちの神[かみ]である主[しゅ]は、あなたがその顔[かお]を恐[おそ]れるすべての民[たみ]にも、同じようにされる。"
  20: "あなたの神[かみ]である主[しゅ]は、あなたから逃[に]げ隠[かく]れた残[のこ]りの者[もの]たちが滅[ほろ]びるまで、彼[かれ]らにスズメバチを送[おく]られる。"
  21: "あなたは彼[かれ]らによって傷[きず]つけられることはない。あなたの神[かみ]である主[しゅ]があなたの中[なか]におられ、大[おお]いなる強[つよ]い神[かみ]だからである。"
  22: "あなたの神[かみ]である主[しゅ]は、これらの民[たみ]をあなたの前[まえ]から少[すこ]しずつ滅[ほろ]ぼされる。あなたは彼[かれ]らを速[すみ]やかに滅[ほろ]ぼし尽[つ]くすことはできない。地[ち]が荒[あ]れ果[は]てることなく、野[の]の獣[けもの]があなたに対して多[おお]くならないためである。"
  23: "主[しゅ]は彼[かれ]らをあなたの手[て]に渡[わた]し、大[おお]きな滅[ほろ]びで彼[かれ]らを滅[ほろ]ぼされる。あなたが彼[かれ]らを滅[ほろ]ぼし尽[つ]くすまでである。"
  24: "主[しゅ]は彼[かれ]らの王[おう]たちをあなたがたの手[て]に渡[わた]される。あなたがたは彼[かれ]らの名[な]をその場所[ばしょ]から滅[ほろ]ぼす。あなたが彼[かれ]らを滅[ほろ]ぼし尽[つ]くすまで、だれもあなたの前[まえ]に立[た]ち向[む]かうことはできない。"
  25: "あなたがたは彼[かれ]らの神[かみ]々[がみ]の彫[ほ]り物[もの]を火[ひ]で焼[や]かなければならない。その上[うえ]の銀[ぎん]や金[きん]を欲[ほ]しがってはならず、それを自分[じぶん]のために取[と]ってもならない。それによって、あなたがつまずくことがないためである。それはあなたの神[かみ]である主[しゅ]にとって忌[い]まわしいものだからである。"
  26: "あなたは忌[い]まわしいものを自分[じぶん]の家[いえ]に持[も]ち込[こ]んではならない。あなたもそれと同じく、聖絶[せいぜつ]のものとなるからである。あなたはそれを忌[い]み嫌[きら]い、ひどく嫌[いや]がらなければならない。それは聖絶[せいぜつ]のものだからである。」"

notes:
  1: "ἐξαρεῖ — устранит, изгонит (ἐξαίρω). Перечислены семь народов (в Синодальном те же семь в иной передаче имён). ἑπτὰ ἔθνη πολλὰ καὶ ἰσχυρότερα ὑμῶν — семь народов многочисленных и сильнейших вас."
  2: "παραδώσει … εἰς τὰς χεῖράς σου — предаст в руки твои. ἀφανισμῷ ἀφανιεῖς — истреблением истребишь (удвоение, слав. «пагубою погубиши»). οὐ διαθήσῃ … διαθήκην — не заключишь завета. οὐδὲ μὴ ἐλεήσητε — и не помилуете (переход на мн. ч.)."
  3: "οὐδὲ μὴ γαμβρεύσητε — не породнитесь (γαμβρεύω «вступать в свойство»). τὴν θυγατέρα σου οὐ δώσεις — дочь твою не отдашь. οὐ λήμψῃ — не возьмёшь (в жёны сыну)."
  4: "ἀποστήσει — отвратит (ед. ч.). λατρεύσει θεοῖς ἑτέροις — будет служить иным богам. ὀργισθήσεται θυμῷ — воспламенится гневом (удвоение). ἐξολεθρεύσει σε τὸ τάχος — истребит тебя скоро."
  5: "βωμούς — жертвенники (βωμός). στήλας — столбы, стелы. ἄλση — священные рощи (ἄλσος). γλυπτά — изваяния, 彫り物. κατακαύσετε πυρί — сожжёте огнём."
  6: "λαὸς ἅγιος — народ святой. προείλατο — предпочёл, избрал (προαιρέω). λαὸν περιούσιον — народ уделённый, собственный (περιούσιος; слав. «людие избранни»; ср. Исх 19:5)."
  7: "πολυπληθεῖτε — многочисленны (πολυπληθέω). ὀλιγοστοί — малочисленны (ὀλιγοστός); слав. «меншии»."
  8: "παρὰ τὸ ἀγαπᾶν — по любви (παρά + вин. причины). διατηρῶν τὸν ὅρκον — соблюдая клятву. ἐλυτρώσατο — искупил, избавил (λυτρόω). ἐκ χειρὸς Φαραω βασιλέως Αἰγύπτου — из руки фараона, царя Египетского."
  9: "θεὸς πιστός — Бог верный. φυλάσσων διαθήκην καὶ ἔλεος — хранящий завет и милость. εἰς χιλίας γενεάς — до тысячи родов."
  10: "ἀποδιδοὺς … κατὰ πρόσωπον — воздающий лицом к лицу, лично. ἐξολεθρεῦσαι — истребить. οὐχὶ βραδυνεῖ — не замедлит (βραδύνω). κατὰ πρόσωπον ἀποδώσει — лично воздаст."
  11: "φυλάξῃ … ποιεῖν — сохранишь исполнять."
  12: "ἡνίκα ἂν ἀκούσητε — когда услышите (мн. ч.). διαφυλάξει — сохранит (διαφυλάσσω). ὃ ὤμοσεν — которое клялся."
  13: "ἔκγονα τῆς κοιλίας — плод чрева (ἔκγονος «рождённый»). σῖτον, οἶνον, ἔλαιον — хлеб, вино, елей. βουκόλια βοῶν — стада крупного скота. ποίμνια προβάτων — отары овец."
  14: "εὐλογητός — благословенный. ἄγονος οὐδὲ στεῖρα — ни бесплодный, ни бесплодная (ἄγονος общ. рода, στεῖρα ж. р.). ἐν τοῖς κτήνεσιν — в скоте."
  15: "μαλακία — немощь, слабость. νόσους Αἰγύπτου τὰς πονηράς — злые болезни Египта. ἐπιθήσει — возложит, наведёт."
  16: "σκῦλα — добыча, 分捕り物. οὐ φείσεται ὁ ὀφθαλμός σου — не пощадит глаз твой. σκῶλον — заноза, преткновение (слав. «претыкание»; Синодальный «сеть»)."
  17: "διανοίᾳ — помышление, мысль. Πολὺ τὸ ἔθνος τοῦτο ἢ ἐγώ — многочисленнее народ этот, чем я."
  18: "οὐ φοβηθήσῃ — не убоишься. μνείᾳ μνησθήσῃ — памятью вспомнишь (удвоение)."
  19: "πειρασμούς — испытания. εἴδοσαν οἱ ὀφθαλμοί σου — видели глаза твои. βραχίονα τὸν ὑψηλόν — мышцу высокую. Здесь греч. переходит на «Господь Бог наш» (ὁ θεὸς ἡμῶν), затем снова «твой»."
  20: "σφηκίας — шершни, осы (σφηκία «осиный рой»). ἐκτριβῶσιν — истребятся (ἐκτρίβω). καταλελειμμένοι — оставшиеся. κεκρυμμένοι — скрывающиеся."
  21: "οὐ τρωθήσῃ — не будешь поражён (τιτρώσκω «ранить»). θεὸς μέγας καὶ κραταιός — Бог великий и крепкий."
  22: "κατὰ μικρὸν μικρόν — мало-помалу (удвоение). ἐξαναλῶσαι — истребить. ἔρημος — пустынная. θηρία τὰ ἄγρια — дикие звери."
  23: "ἀπολέσει … ἀπωλείᾳ μεγάλῃ — погубит погибелью великою. ἕως ἂν ἐξολεθρεύσῃ — доколе не истребишь."
  24: "ἀπολεῖται τὸ ὄνομα — погибнет имя. ἐκ τοῦ τόπου ἐκείνου — из места того. οὐκ ἀντιστήσεται — не восстанет, не устоит."
  25: "γλυπτά — изваяния. ἐπιθυμήσεις ἀργύριον … χρυσίον — не пожелай серебра и золота. μὴ πταίσῃς — как бы не преткнуться (πταίω). βδέλυγμα — мерзость, 忌まわしいもの."
  26: "ἀνάθημα — заклятое, 聖絶 (herem). προσοχθίσματι προσοχθιεῖς — отвращением возненавидишь. βδελύγματι βδελύξῃ — гнушением возгнушаешься."
