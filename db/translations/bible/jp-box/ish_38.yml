# jp-box, Исход, глава 38. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — csl-ru (jp-joc в гл. 38 нет).
# Русский Синодальный — только для понимания. Язык — современный 常体.
# Нумерация LXX: эта глава соответствует евр. 37 — 38:8 (ковчег, стол, светильник,
# жертвенник курения, жертвенник всесожжения, умывальница); см. шапку гл. 36.
# Глава 38: ковчег и очистилище (1–8), стол и его сосуды (9–12),
# светильник (13–17), работы Веселеила: серебро, крюки, жертвенник, умывальница (18–27).
# Красного и синего нет: речь Бога — в 「…」, «<j>» не ставится.
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено по базе).
# Сносок ⟨…⟩ нет: 契約の箱, 贖いの座, 燭台, 洗い盤 объяснены в гл. 25–30.

tr_code: jp-box
book: ish
chapter: 38
draft: true

verses:
  1: "ベツァレルは箱[はこ]を造[つく]った。"
  2: "これを内[うち]も外[そと]も純金[じゅんきん]で覆[おお]った。"
  3: "また、これに金[きん]の環[かん]四[よっ]つを鋳[い]て、一[ひと]つの側[がわ]に二[ふた]つ、もう一[ひと]つの側[がわ]に二[ふた]つ付[つ]けた。"
  4: "担[にな]い棒[ぼう]を差[さ]し込[こ]んで、それでこれを運[はこ]べるように、環[かん]は広[ひろ]く作[つく]られていた。"
  5: "また、箱[はこ]の上[うえ]に、金[きん]で贖[あがな]いの座[ざ]を造[つく]った。"
  6: "また、金[きん]のケルビム二[ふた]つを造[つく]った。"
  7: "一[ひと]つのケルビムを贖[あがな]いの座[ざ]の一[ひと]つの端[はし]に、もう一[ひと]つのケルビムを贖[あがな]いの座[ざ]のもう一[ひと]つの端[はし]に据[す]えた。"
  8: "それらは翼[つばさ]を広[ひろ]げて、贖[あがな]いの座[ざ]の上[うえ]を覆[おお]っていた。"
  9: "また、供[そな]えのパンのための机[つくえ]を純金[じゅんきん]で造[つく]った。"
  10: "これに金[きん]の環[かん]四[よっ]つを鋳[い]て、一[ひと]つの側[がわ]に二[ふた]つ、もう一[ひと]つの側[がわ]に二[ふた]つ付[つ]け、担[にな]い棒[ぼう]を差[さ]し込[こ]んで運[はこ]べるように広[ひろ]くした。"
  11: "また、箱[はこ]と机[つくえ]の担[にな]い棒[ぼう]を造[つく]り、金[きん]で覆[おお]った。"
  12: "また、机[つくえ]の器[うつわ]、すなわち皿[さら]、香[こう]の器[うつわ]、注[そそ]ぎの器[うつわ]、杯[さかずき]を金[きん]で造[つく]った。それらで注[そそ]ぎの献[ささ]げ物[もの]をするのである。"
  13: "また、光[ひかり]を放[はな]つ燭台[しょくだい]を金[きん]で造[つく]り、その柄[え]を堅[かた]くした。"
  14: "また、その両側[りょうがわ]に枝[えだ]を造[つく]った。"
  15: "その枝[えだ]から伸[の]び出[で]る芽[め]は、こちらに三[みっ]つ、あちらに三[みっ]つで、互[たが]いに等[ひと]しかった。"
  16: "また、その端[はし]にある灯[ともしび]は、それらから出[で]た胡桃[くるみ]の形[かたち]であった。また、その上[うえ]に灯[ともしび]を据[す]えるための受[う]け金[がね]が、それらから出[で]ていた。第七[だいしち]の受[う]け金[がね]は、燭台[しょくだい]の端[はし]から上[うえ]の頂[いただき]にあり、全体[ぜんたい]が堅[かた]い純金[じゅんきん]であった。"
  17: "また、その上[うえ]に金[きん]の灯[ともしび]七[なな]つ、金[きん]の芯切[しんき]りばさみ、金[きん]の受[う]け皿[ざら]を造[つく]った。"
  18: "この者[もの]は柱[はしら]に銀[ぎん]をかぶせ、柱[はしら]のために金[きん]の環[かん]を鋳[い]て、横木[よこぎ]に金[きん]をかぶせ、垂[た]れ幕[まく]の柱[はしら]に金[きん]をかぶせ、金[きん]の鉤[かぎ]を造[つく]った。"
  19: "この者[もの]はまた、幕屋[まくや]の鉤[かぎ]を金[きん]で、庭[にわ]の鉤[かぎ]を、また上[うえ]の覆[おお]いを張[は]るための鉤[かぎ]を青銅[せいどう]で造[つく]った。"
  20: "この者[もの]は、幕屋[まくや]の銀[ぎん]の柱[はしら]の頭[かしら]と、幕屋[まくや]の入口[いりぐち]の青銅[せいどう]の柱[はしら]の頭[かしら]、庭[にわ]の門[もん]を鋳[い]て、柱[はしら]のための銀[ぎん]の鉤[かぎ]を造[つく]り、柱[はしら]にそれをかぶせた。"
  21: "この者[もの]はまた、幕屋[まくや]の杭[くい]と庭[にわ]の杭[くい]を青銅[せいどう]で造[つく]った。"
  22: "この者[もの]は、青銅[せいどう]の祭壇[さいだん]を、コラの一党[いっとう]とともに立[た]ち逆[さか]らった者[もの]たちの青銅[せいどう]の火[ひ]皿[ざら]から造[つく]った。"
  23: "この者[もの]は、祭壇[さいだん]のすべての器[うつわ]、その火[ひ]皿[ざら]、台[だい]、鉢[はち]、肉[にく]を取[と]る鉤[かぎ]を青銅[せいどう]で造[つく]った。"
  24: "この者[もの]は祭壇[さいだん]のために、網[あみ]細工[ざいく]の火床[どこ]を、その火[ひ]皿[ざら]の下[した]から祭壇[さいだん]の半[なか]ばまで造[つく]り、その火床[どこ]の四[よっ]つの側[がわ]から青銅[せいどう]の環[かん]四[よっ]つを祭壇[さいだん]に付[つ]けて、担[かつ]ぎ棒[ぼう]を差[さ]し込[こ]んで祭壇[さいだん]を運[はこ]べるようにした。"
  25: "この者[もの]は、聖[せい]なる油[あぶら]と、香油師[こうゆし]の手[て]による純[じゅん]な香[こう]の調[ととの]え物[もの]を造[つく]った。"
  26: "この者[もの]は、青銅[せいどう]の洗[あら]い盤[ばん]とその青銅[せいどう]の台[だい]を、幕屋[まくや]を据[す]えた日[ひ]に、その入口[いりぐち]で断食[だんじき]した女[おんな]たちの鏡[かがみ]から造[つく]った。"
  27: "そして、洗[あら]い盤[ばん]を造[つく]った。モーセとアロン、およびその子[こ]らが、そこから手[て]と足[あし]を洗[あら]うためである。彼[かれ]らが証[あかし]の幕屋[まくや]に入[はい]るとき、また祭壇[さいだん]に近[ちか]づいて務[つと]めを果[は]たすとき、そこから洗[あら]った。主[しゅ]がモーセに命[めい]じたとおりである。"

notes:
  1: "κιβωτός — 箱 (ковчег). В гр. здесь без διαθήκη; определение «ковчег завета» появляется в 39:14. LXX начинает главу с ковчега (евр. 37:1)."
  2: "κατεχρύσωσεν — покрыл золотом. ἔσωθεν καὶ ἔξωθεν — внутри и снаружи."
  3: "ἐχώνευσεν — отлил. δακτύλιοι — 環 (кольца). κλῖτος — сторона."
  4: "εὐρεῖς τοῖς διωστῆρσιν — 担い棒を差し込める広さ (широкие для шестов). διωστήρ — 担い棒, шест для ношения."
  5: "ἱλαστήριον — 贖いの座 (очистилище, крышка ковчега; ср. Евр 9:5, Рим 3:25). ἐκ χρυσίου — 金で (в csl добавлено «чиста»)."
  6: "χερουβίμ — ケルビム (херувимы)."
  7: "ἄκρον — 端 (край). ἱλαστήριον — 贖いの座."
  8: "σκιάζοντα ταῖς πτέρυξιν — 翼を広げて覆っていた (осеняющие крыльями)."
  9: "τράπεζα ἡ προκειμένη — 供えのパンのための机 (стол предложения; ср. 25:23). ἐκ χρυσίου καθαροῦ — из чистого золота."
  10: "εὐρεῖς ὥστε αἴρειν — широкие, чтобы носить. κλῖτος — сторона."
  11: "διωστῆρες τῆς κιβωτοῦ καὶ τῆς τράπεζης — 箱と机の棒 (шесты ковчега и стола)."
  12: "τρυβλία — 皿, θυίσκαι — 香炉, κυάθοι — 杯, σπονδεῖα — 注ぎ入れ (чаши для возлияния). σπείσει — возливать."
  13: "λυχνία — 燭台. καυλός — 柄 (стебель). στερεά — цельная, жёсткая."
  14: "καλαμίσκοι — 枝 (ветви, букв. «трости»)."
  15: "βλαστοί — 芽 (побеги). ἐξισούμενοι ἀλλήλοις — 互いに等しい."
  16: "λαμπάδια — 灯 (лампады). καρυωτά — 胡桃の形 (в форме ореха). ἐνθέμια — 受け金 (гнёзда, чашечки). τὸ ἕβδομον — седьмое; место в LXX тёмное, передано буквально."
  17: "λύχνοι — 灯. λαβίδες — 芯切りばさみ (щипцы). ἐπαρυστρίδες — 受け皿 (щипцы для снятия нагара; ср. 25:38)."
  18: "οὗτος — この者: с этого стиха LXX переходит на ед. ч. и анафору «сей». μοχλοί — 横木 (шесты). καταπέτασμα — 垂れ幕."
  19: "κρίκοι — 鉤. κατακάλυμμα — 覆い (покров)."
  20: "κεφαλίδες — 柱の頭 (капители). πύλη — 門."
  21: "πάσσαλοι — 杭."
  22: "πυρεῖα — 火皿 (кадильницы). Κόρε — Корей (Числ 16:1–35), медные кадильницы мятежников пошли на жертвенник (ср. Числ 17:2–4)."
  23: "σκεύη τοῦ θυσιαστηρίου — 祭壇の器. βάσις — 台. φιάλαι — 鉢. κρεάγραι — 肉刺し (вилки)."
  24: "παράθεμα, ἔργον δικτυωτόν — 網細工の火床 (решётка, сетка; ср. 27:4). ἕως τοῦ ἡμίσους — до половины."
  25: "ἔλαιον χρίσεως — 聖なる油 (елей помазания). σύνθεσις θυμιάματος — 香の調え物. μυρεψός — 香油師 (составитель мастей)."
  26: "λουτήρ — 洗い盤 (умывальница). κάτοπτρα — 鏡. νηστεύσασαι — 断食した女たち (обычай при скинии; ср. 1 Цар 2:22). ἐν ᾗ ἡμέρᾳ ἔπηξεν αὐτήν — 幕屋を据えた日に."
  27: "νίπτωνται — 洗う. λειτουργεῖν — 務めを果たす (служить). Ср. 30:18–21."
