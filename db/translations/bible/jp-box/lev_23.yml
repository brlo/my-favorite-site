# jp-box, Левит, глава 23. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в Левите отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 23 — календарь праздников: суббота (3), Пасха (5), опресноки (6–8),
# сноп первого снопа (10–14), семь недель / Пятидесятница (15–22),
# праздник труб (24–25), день очищения (27–32), кущи (34–43), итог (44).
# Речь Бога — 「…」: 2–8, 10–22, 24–25, 27–32, 34–43; красного нет.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (проверено по базе).
# Сноска ⟨…⟩ одна: 贖罪の日 (23:27) — первое упоминание в корпусе.
# LXX: 23:11 «на другой день первого» (слав. «на утрие перваго дне субботы»);
# 23:13 δύο δέκατα — «две десятых»; 23:40 LXX добавляет ἄγνου (агн, «прутняк»)
# к иве; 23:41 τοῦ ἐνιαυτοῦ относится к концу ст. 40 («семь дней в году»);
# 23:32 слав. добавляет «до десятого дня», в LXX этого нет.
# jp-ni не использовался.

