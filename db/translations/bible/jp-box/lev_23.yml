verses:
  1: "主[しゅ]はモーセに言[い]われた。"
  2: "「イスラエルの子[こ]らに語[かた]って言[い]いなさい。主[しゅ]の祭[まつ]り、すなわちあなたがたが聖[せい]なる集[つど]いとして告[つ]げ知[し]らせる祭[まつ]りは、これらである。これらはわたしの祭[まつ]りである。"
  3: "六日[むいか]の間[あいだ]は仕事[しごと]をしなさい。七日目[なぬかめ]は主[しゅ]への安息日[あんそくび]、すなわち休[やす]みの聖[せい]なる集[つど]いである。どのような仕事[しごと]もしてはならない。これはあなたがたのすべての住[す]まいで、主[しゅ]への安息日[あんそくび]である。"
  4: "これらは主[しゅ]の祭[まつ]りであり、あなたがたがそれぞれの時[とき]に聖[せい]なる集[つど]いとして告[つ]げ知[し]らせるものである。"
  5: "第一[だいいち]の月[つき]の十四日[じゅうよっか]、夕暮[ゆうぐ]れに、主[しゅ]の過越[すぎこし]がある。"
  6: "この月[つき]の十五日[じゅうごにち]には、主[しゅ]の種[たね]なしパンの祭[まつ]りがある。七日[なぬか]の間[あいだ]、種[たね]なしパンを食[た]べなさい。"
  7: "初[はじ]めの日[ひ]はあなたがたの聖[せい]なる集[つど]いである。どのような仕事[しごと]もしてはならない。"
  8: "七日[なぬか]の間[あいだ]、あなたがたは主[しゅ]に燔祭[はんさい]を捧[ささ]げなさい。七日目[なぬかめ]は聖[せい]なる集[つど]いであり、どのような仕事[しごと]もしてはならない。」"
  9: "主[しゅ]はモーセに言[い]われた。"
  10: "「イスラエルの子[こ]らに語[かた]って言[い]いなさい。わたしがあなたがたに与[あた]える地[ち]に入[はい]り、その刈[か]り入[れ]を刈[か]り取[と]るとき、あなたがたの刈[か]り入[れ]の初穂[はつほ]の束[たば]を祭司[さいし]のもとに持[も]って来[き]なさい。"
  11: "祭司[さいし]はその束[たば]を主[しゅ]の前[まえ]に掲[かか]げる。それはあなたがたが受[う]け入[い]れられるためである。祭司[さいし]はそれを、最初[さいしょ]の日[ひ]の翌日[よくじつ]に掲げる。"
  12: "あなたがたがその束[たば]を携[たずさ]えて来[く]る日[ひ]には、傷[きず]のない一歳[いっさい]の羊[ひつじ]を、主[しゅ]への燔祭[はんさい]として捧[ささ]げなさい。"
  13: "その素祭[そさい]は、油[あぶら]を混[ま]ぜた小麦粉[こむぎこ]の十分[じゅうぶん]の二[ふた]つ、すなわち主[しゅ]への犠牲[ぎせい]であり、主[しゅ]に芳[かんば]しい香[かおり]となる。その注[そそ]ぎ物[もの]は、ぶどう酒[ぶどうしゅ]の四分[よんぶん]の一[いち]ヒンである。"
  14: "あなたがたが自分[じぶん]たちの神[かみ]に捧[ささ]げ物[もの]を献[ささ]げるまで、すなわちこの日[ひ]その日[ひ]までは、パンも、新[あたら]しい炒[い]り麦[むぎ]も食[た]べてはならない。これはあなたがたの代々[よよ]にわたる、すべての住[す]まいにおける永遠[えいえん]の定[さだ]めである。"
  15: "あなたがたは、安息日[あんそくび]の翌日[よくじつ]、すなわち掲[かか]げ物[もの]の束[たば]を献[ささ]げる日[ひ]から、七[なな]つの週[しゅう]を、満[み]ちるまで数[かぞ]えなさい。"
  16: "最後[さいご]の週[しゅう]の翌日[よくじつ]まで、あなたがたは五十日[ごじゅうにち]を数[かぞ]え、主[しゅ]に新[あたら]しい犠牲[ぎせい]を捧[ささ]げなさい。"
  17: "あなたがたは住[す]まいから、掲[かか]げ物[もの]のパン、すなわち二[ふた]つのパンを捧[ささ]げなさい。それは小麦粉[こむぎこ]の十分[じゅうぶん]の二[ふた]つから作[つく]られ、パン種[ぱんだね]を入[い]れて焼[や]かれる。それらは主[しゅ]への初穂[はつほ]である。"
  18: "あなたがたはパンとともに、傷[きず]のない一歳[いっさい]の小羊[こひつじ]七匹[ななひき]、牛[うし]の群[む]れから一頭[いっとう]の子牛[こうし]、傷[きず]のない雄羊[おすひつじ]二匹[にひき]を捧[ささ]げなさい。それらは主[しゅ]への燔祭[はんさい]となる。また、それらの素祭[そさい]と注[そそ]ぎ物[もの]も、主[しゅ]に芳[かんば]しい香[かおり]となる犠牲[ぎせい]である。"
  19: "また、贖罪祭[しょくざいさい]として山羊[やぎ]の子[こ]一匹[いっぴき]、酬恩祭[しゅうおんさい]として一歳[いっさい]の小羊[こひつじ]二匹[にひき]を、初穂[はつほ]のパンとともに献[ささ]げなさい。"
  20: "祭司[さいし]は、初穂[はつほ]のパンとともに、その二匹[にひき]の小羊[こひつじ]を主[しゅ]の前[まえ]に掲[かか]げ物[もの]として掲げる。それらは主[しゅ]に聖[せい]なるものであり、それを献[ささ]げる祭司[さいし]のものとなる。"
  21: "あなたがたはこの日[ひ]を聖[せい]なる集[つど]いの日[ひ]として告[つ]げ知[し]らせなさい。それはあなたがたに聖[せい]なる日[ひ]となる。その日[ひ]にはどのような仕事[しごと]もしてはならない。これはあなたがたの代々[よよ]にわたる、すべての住[す]まいにおける永遠[えいえん]の定[さだ]めである。"
  22: "あなたがたの地[ち]の刈[か]り入[れ]を刈[か]り取[と]るとき、あなたの畑[はたけ]の刈[か]り入[れ]の残[のこ]りを刈[か]り尽[つ]くしてはならない。また、あなたの刈[か]り入[れ]の落[お]ち穂[ぼ]を集[あつ]めてはならない。貧[まず]しい者[もの]と寄留者[きりゅうしゃ]のために、それを残[のこ]しておきなさい。わたしは主[しゅ]、あなたがたの神[かみ]である。」"
  23: "主[しゅ]はモーセに言[い]われた。"
  24: "「イスラエルの子[こ]らに語[かた]って言[い]いなさい。第七[だいしち]の月[つき]の一日[ついたち]は、あなたがたに休[やす]みがある。これはラッパを吹[ふ]き鳴[な]らして記念[きねん]する日[ひ]、あなたがたの聖[せい]なる集[つど]いである。"
  25: "どのような仕事[しごと]もしてはならない。そして主[しゅ]に燔祭[はんさい]を捧[ささ]げなさい。」"
  26: "主[しゅ]はモーセに言[い]われた。"
  27: "「この第七[だいしち]の月[つき]の十日[とおか]は贖罪[しょくざい]の日[ひ]⟨一年[いちねん]に一度[いちど]、民[たみ]の罪[つみ]を贖[あがな]うために定[さだ]められた特別[とくべつ]な日[ひ]。⟩である。あなたがたの聖[せい]なる集[つど]いであり、あなたがたは自分[じぶん]の魂[たましい]を苦[くる]しめ、主[しゅ]に燔祭[はんさい]を捧[ささ]げなさい。"
  28: "その日[ひ]にはどのような仕事[しごと]もしてはならない。それはあなたがたのための贖罪[しょくざい]の日[ひ]であり、あなたがたの神[かみ]であられる主[しゅ]の前[まえ]で、あなたがたのために贖[あがな]いをするためである。"
  29: "この日[ひ]に自分[じぶん]の魂[たましい]を苦[くる]しまない者[もの]は、だれでもその魂[たましい]が自分[じぶん]の民[たみ]から断[た]たれる。"
  30: "この日[ひ]に仕事[しごと]をする者[もの]は、だれでも、その魂[たましい]が自分[じぶん]の民[たみ]から滅[ほろ]びる。"
  31: "あなたがたはどのような仕事[しごと]もしてはならない。これはあなたがたの代々[よよ]にわたる、すべての住[す]まいにおける永遠[えいえん]の定[さだ]めである。"
  32: "これはあなたがたにとって安息日[あんそくび]のうちの安息日である。あなたがたは自分[じぶん]の魂[たましい]を苦[くる]しめなさい。月[つき]の九日[ここのか]の夕[ゆう]べから夕[ゆう]べまで、あなたがたは自分の安息日を守[まも]りなさい。」"
  33: "主[しゅ]はモーセに言[い]われた。"
  34: "「イスラエルの子[こ]らに語[かた]って言[い]いなさい。この第七[だいしち]の月[つき]の十五日[じゅうごにち]は、主[しゅ]の仮庵[かりいお]の祭[まつ]りであり、七日[なぬか]の間[あいだ]続[つづ]く。"
  35: "初[はじ]めの日[ひ]は聖[せい]なる集[つど]いである。どのような仕事[しごと]もしてはならない。"
  36: "七日[なぬか]の間[あいだ]、あなたがたは主[しゅ]に燔祭[はんさい]を捧[ささ]げなさい。八日目[ようかめ]はあなたがたの聖[せい]なる集[つど]いであり、主[しゅ]に燔祭[はんさい]を捧[ささ]げなさい。これは閉会[へいかい]の日[ひ]である。どのような仕事[しごと]もしてはならない。"
  37: "これらは主[しゅ]の祭[まつ]りであり、あなたがたが聖[せい]なる集[つど]いとして告[つ]げ知[し]らせ、主[しゅ]に焼[や]き尽[つ]くす捧[ささ]げ物[もの]、すなわち燔祭[はんさい]とその素祭[そさい]、その注[そそ]ぎ物[もの]を、日[ひ]ごとに捧[ささ]げるためのものである。"
  38: "これは主[しゅ]の安息日[あんそくび]のほか、あなたがたの贈[おく]り物[もの]、すべての誓[ちか]いの捧[ささ]げ物[もの]、あなたがたが自[みずか]ら進[すす]んで主[しゅ]に与[あた]えるすべてのもののほかである。"
  39: "この第七[だいしち]の月[つき]の十五日[じゅうごにち]、あなたがたが地[ち]の実[みの]りを取[と]り入[い]れ終[お]えたとき、あなたがたは七日[なぬか]の間[あいだ]、主[しゅ]の祭[まつ]りを祝[いわ]いなさい。初[はじ]めの日[ひ]は休[やす]みであり、八日目[ようかめ]も休[やす]みである。"
  40: "初[はじ]めの日[ひ]に、あなたがたは美[うつく]しい木[き]の実[み]、ナツメヤシの枝[えだ]、葉[は]の茂[しげ]った木[き]の枝[えだ]、それに小川[おがわ]のほとりの柳[やなぎ]とアグノスの枝[えだ]を取[と]り、あなたがたの神[かみ]であられる主[しゅ]の前[まえ]で、年[とし]ごとに七日[なぬか]の間[あいだ]喜[よろこ]びなさい。"
  41: "これはあなたがたの代々[よよ]にわたる永遠[えいえん]の定[さだ]めである。第七[だいしち]の月[つき]に、あなたがたはこれを祝[いわ]いなさい。"
  42: "あなたがたは七日[なぬか]の間[あいだ]、仮庵[かりいお]に住[す]みなさい。イスラエルに生[う]まれた者[もの]はすべて、仮庵に住[す]む。"
  43: "それは、あなたがたの代[よ]の者[もの]たちが、わたしがイスラエルの子[こ]らをエジプトの地[ち]から導[みちび]き出[だ]したとき、彼[かれ]らを仮庵に住[す]まわらせたことを知[し]るためである。わたしは主[しゅ]、あなたがたの神[かみ]である。」"
  44: "モーセはイスラエルの子[こ]らに、主[しゅ]の祭[まつ]りについて語[かた]った。"

notes:
  1: "εἶπεν κύριος πρὸς Μωυσῆν λέγων — стандартная формула введения речи; λέγων по-японски отдельно не передаётся (ср. Лев 1:1)."
  2: "Λάλησον … καὶ ἐρεῖς — скажи … и скажешь (императив + будущее, как в LXX). ἑορταί — праздники (ἑορτή). κλητὰς ἁγίας — священные собрания (букв. «созванные святые»; слав. «нарочитыя святыя»; ср. Исх 12:16). αὗταί εἰσιν ἑορταί μου — вот праздники Мои."
  3: "ἓξ ἡμέρας ποιήσεις ἔργα — шесть дней делай дела. σάββατα ἀνάπαυσις — суббота покоя (σάββατον + ἀνάπαυσις; слав. «суббота, покой»). κλητὴ ἁγία τῷ κυρίῳ — священное собрание Господу. πᾶν ἔργον — всякое дело, без λατρευτός (ср. ст. 7). ἐν πάσῃ κατοικίᾳ ὑμῶν — во всех жилищах ваших."
  4: "Αὗται αἱ ἑορταὶ τῷ κυρίῳ — повтор ст. 2. ἐν τοῖς καιροῖς αὐτῶν — в свои времена (καιρός — «время, срок»)."
  5: "τῷ πρώτῳ μηνί — в первый месяц (Авив/Нисан). ἀνὰ μέσον τῶν ἑσπερινῶν — между вечерами (слав. «между вечерними»), т.е. в сумерках; евр. בין הערבים. πάσχα τῷ κυρίῳ — Пасха Господня."
  6: "ἑορτὴ τῶν ἀζύμων — праздник опресноков (ἄζυμος — «пресный»). ἑπτὰ ἡμέρας ἄζυμα ἔδεσθε — семь дней ешьте опресноки."
  7: "κλητὴ ἁγία — священное собрание. ἔργον λατρευτόν — дело служебное, рабское (λατρευτός; слав. «дело работне»); в ст. 3 было просто ἔργον. В японском оба переданы как 仕事."
  8: "προσάξετε ὁλοκαυτώματα — принесёте всесожжения (προσάγω). ἑβδόμη — седьмой [день]."
  9: "Формула введения новой речи (ср. ст. 1)."
  10: "Εἰπόν … καὶ ἐρεῖς — скажи … и скажешь (εἰπόν — имп. аор. от λέγω, редкая форма). ὅταν εἰσέλθητε — когда войдёте. δράγμα — сноп (слав. «снопы»). ἀπαρχὴ τοῦ θερισμοῦ — начаток жатвы. πρὸς τὸν ἱερέα — к священнику."
  11: "ἀνοίσει — вознесёт (ἀναφέρω; о возношении снопа). ἔναντι κυρίου δεκτὸν ὑμῖν — пред Господом, приятно вам (δεκτός — «принятый»). τῇ ἐπαύριον τῆς πρώτης — на другой день первого (слав. «на утрие перваго дне субботы»; евр. «на другой день субботы»)."
  12: "ἐν ᾗ ἂν φέρητε — в который принесёте (φέρω). πρόβατον ἄμωμον ἐνιαύσιον — овцу непорочную однолетнюю. εἰς ὁλοκαύτωμα — во всесожжение."
  13: "δύο δέκατα σεμιδάλεως — две десятых [ефы] пшеничной муки (σεμίδαλις; слав. «две десятины муки пшеничны»). ἀναπεποιημένης ἐν ἐλαίῳ — смешанной с елеем (ἀναποιέω). σπονδή — возлияние. τὸ τέταρτον τοῦ ἵν — четверть гина (ἵν — мера объёма)."
  14: "πεφρυγμένα χίδρα νέα — жареные новые зёрна (χίδρον — «крупа, зерно»; слав. «пряженых класов новых»; евр. קלי וכרמל). ἕως εἰς αὐτὴν τὴν ἡμέραν ταύτην — до самого этого дня. νόμιμον αἰώνιον — вечный устав."
  15: "ἀπὸ τῆς ἐπαύριον τῶν σαββάτων — от следующего дня после суббот (слав. «от наутрия суббот»). δράγμα τοῦ ἐπιθέματος — сноп возношения (ἐπίθεμα — «возложение»; слав. «снопы возложения»). ἑπτὰ ἑβδομάδας ὁλοκλήρους — семь седмиц полных."
  16: "ἕως τῆς ἐπαύριον τῆς ἐσχάτης ἑβδομάδος — до следующего дня после последней седмицы. πεντήκοντα ἡμέρας — пятьдесят дней (Пятидесятница). θυσίαν νέαν — новую жертву."
  17: "ἀπὸ τῆς κατοικίας ὑμῶν — от жилищ ваших. ἄρτους ἐπίθεμα — хлебы возношения. ἐκ δύο δεκάτων — из двух десятых [ефы]. ἐζυμωμένοι πεφθήσονται — квасные испекутся (ζυμόω, πέσσω). πρωτογενημάτων τῷ κυρίῳ — начатки Господу (πρωτογένημα)."
  18: "μόσχον ἕνα ἐκ βουκολίου — одного тельца из стада (βουκόλιον — «стадо крупного скота»; слав. «телца единаго от стад»). κριοὺς δύο — двух овнов. θυσία ὀσμὴ εὐωδίας — жертва, благоухание."
  19: "χίμαρον ἐξ αἰγῶν — козла из коз. περὶ ἁμαρτίας — за грех (жертва за грех). θυσία σωτηρίου — жертва спасения, мирная (слав. «жертва спасения»; в книге — 酬恩祭). ἄρτων τοῦ πρωτογενήματος — хлебов начатков."
  20: "ἐπιθήσει … ἐπίθεμα — возложит как приношение возложения (тавтология LXX; слав. «да возложит я… возложение»). ἅγια ἔσονται — будут святы. τῷ ἱερεῖ τῷ προσφέροντι — священнику приносящему."
  21: "καλέσετε … κλητήν — назовёте священным собранием. ἁγία ἔσται ὑμῖν — святым будет вам. νόμιμον αἰώνιον — вечный устав."
  22: "οὐ συντελέσετε τὸ λοιπόν — не закончите остатка (συντελέω). τὰ ἀποπίπτοντα — опадающее (ἀποπίπτω). οὐ συλλέξεις — не соберёшь. τῷ πτωχῷ καὶ τῷ προσηλύτῳ — бедному и пришельцу. Переход с 2 л. мн. на 2 л. ед. — как в LXX и слав."
  23: "Формула введения речи."
  24: "μηνὸς τοῦ ἑβδόμου μιᾷ τοῦ μηνός — в седьмой месяц, в первый [день] месяца. ἀνάπαυσις — покой. μνημόσυνον σαλπίγγων — памятование труб (слав. «память труб»; евр. «напоминание трубным звуком»). σάλπιγξ — труба."
  25: "ἔργον λατρευτόν — дело служебное. προσάξετε ὁλοκαύτωμα — принесёте всесожжение."
  26: "Формула введения речи."
  27: "τῇ δεκάτῃ τοῦ μηνὸς τοῦ ἑβδόμου — в десятый день седьмого месяца (в LXX и слав. десятый; в Синодальном — девятый). ἡμέρα ἐξιλασμοῦ — день очищения (ἐξιλασμός; отсюда 贖罪の日; сноска). ταπεινώσετε τὰς ψυχάς — смирите души (слав. «смирите души вашя»), т.е. пост и самоограничение."
  28: "πᾶν ἔργον οὐ ποιήσετε — никакого дела не сделаете. ἡμέρα ἐξιλασμοῦ — день очищения. ἐξιλάσασθαι περὶ ὑμῶν — умилостивить, очистить за вас (ἐξιλάσκομαι)."
  29: "πᾶσα ψυχή, ἥτις μὴ ταπεινωθήσεται — всякая душа, которая не смирится. ἐξολεθρευθήσεται ἐκ τοῦ λαοῦ αὐτῆς — истребится из народа своего (ἐξολεθρεύω)."
  30: "ἀπολεῖται ἡ ψυχὴ ἐκείνη — погибнет душа та (ἀπόλλυμι); в LXX без «Я», ср. слав. «погибнет душа та»."
  31: "πᾶν ἔργον οὐ ποιήσετε — ср. ст. 28. νόμιμον αἰώνιον — вечный устав."
  32: "σάββατα σαββάτων — суббота суббот (слав. «субботы суббот»). σαββατιεῖτε — будете субботствовать (σαββατίζω). ἀπὸ ἐνάτης τοῦ μηνός — от девятого [дня] месяца; слав. добавляет «до десятого дня», в LXX этого нет."
  33: "Формула введения речи."
  34: "ἑορτὴ σκηνῶν — праздник кущей (σκηνή — «куща, шатёр»; 仮庵の祭り; ср. Ин 7:2). ἑπτὰ ἡμέρας τῷ κυρίῳ — семь дней Господу."
  35: "κλητὴ ἁγία — священное собрание; ἔργον λατρευτόν — дело служебное."
  36: "ἡ ἡμέρα ἡ ὀγδόη — восьмой день. ἐξόδιόν ἐστιν — это исходное, заключительное [собрание] (ἐξόδιον; слав. «исходное»); 閉会の日."
  37: "καρπώματα — сожигаемые приношения (κάρπωμα). τὸ καθ᾿ ἡμέραν εἰς ἡμέραν — день за днём, ежедневно (букв. «что по дню на день»)."
  38: "πλὴν τῶν σαββάτων κυρίου — кроме суббот Господних. δόματα — дары. εὐχαί — обеты (εὐχή). ἑκούσια — добровольные (ἑκούσιος)."
  39: "ὅταν συντελέσητε τὰ γενήματα τῆς γῆς — когда завершите [сбор] произведений земли. ἀνάπαυσις — покой. В LXX ст. 39 начинает новый раздел о кущах."
  40: "καρπὸν ξύλου ὡραῖον — красивый плод дерева (слав. «плод древа красен»; евр. פרי עץ הדר, традиционно этрог). κάλλυνθρα φοινίκων — пальмовые ветви (κάλλυνθρον — «украшение»; слав. «ветвь финическую»). κλάδους ξύλου δασεῖς — густые ветви дерева (мирт). ἰτέας καὶ ἄγνου κλάδους — ветви ивы и агна (ἄγνος — «прутняк»; LXX добавляет его к евр. «ивы речные»). ἐκ χειμάρρου — от потока. εὐφρανθῆναι — веселиться."
  41: "τοῦ ἐνιαυτοῦ — «года»: в LXX это слово открывает ст. 41, но относится к концу ст. 40 («семь дней в году»); поэтому 年ごとに стоит в ст. 40. ἑορτάσετε αὐτήν — празднуйте его."
  42: "ἐν σκηναῖς κατοικήσετε — в кущах живите. αὐτόχθων — туземец, рождённый в земле (слав. «туземец»)."
  43: "ὅπως ἴδωσιν — чтобы увидели. κατῴκισα — поселил (κατοικίζω). ἐν τῷ ἐξαγαγεῖν με — когда Я вывел."
  44: "ἐλάλησεν Μωϋσῆς τὰς ἑορτὰς κυρίου — Моисей изложил праздники Господни (глагол с винительным объекта)."
