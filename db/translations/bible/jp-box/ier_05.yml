verses:
  1: "「エルサレムの通[とお]りを巡[めぐ]り、見[み]よ、そして知[し]れ。その広場[ひろば]で探[さが]せ。もし、裁[さば]きを行[おこな]い、真実[しんじつ]を求[もと]める人[ひと]を見[み]つけたなら、わたしは彼[かれ]らにあわれみを示[しめ]そう、と主[しゅ]は言[い]われる。"
  2: "『主[しゅ]は生[い]きておられる』と彼[かれ]らは言[い]うが、それゆえ、彼らは偽[いつわ]りによって誓[ちか]っているのではないか。」"
  3: "「主[しゅ]よ、あなたの目[め]は真実[しんじつ]を求[もと]めている。あなたが彼[かれ]らを打[う]っても、彼らは痛[いた]みを感[かん]じない。あなたが彼らを滅[ほろ]ぼしても、彼らは懲[こら]しめを受[う]けようとしない。彼らはその顔[かお]を岩[いわ]よりも固[かた]くし、帰[かえ]ろうとしなかった。」"
  4: "わたしは言[い]った。「おそらく、彼[かれ]らは貧[まず]しい者[もの]たちだ。彼らは愚[おろ]かで、主[しゅ]の道[みち]とその神[かみ]の裁[さば]きを知[し]らないのだ。"
  5: "わたしは身分[みぶん]の高[たか]い者[もの]たちのところへ行[い]って、彼[かれ]らに語[かた]ろう。彼らこそ主[しゅ]の道[みち]とその神[かみ]の裁[さば]きを知[し]っているはずだから。しかし、見[み]よ、彼らも皆[みな]、軛[くびき]を折[お]り、綱[つな]を引[ひ]きちぎっていた。"
  6: "それゆえ、森[もり]の獅子[しし]が彼[かれ]らを打[う]ち、荒野[こうや]の狼[おおかみ]が彼らを家々[いえいえ]に至[いた]るまで滅[ほろ]ぼし、豹[ひょう]がその町々[まちまち]を見張[みは]っている。彼[かれ]らのうちから出[で]る者[もの]はすべて捕[つか]まえられる。彼らの罪[つみ]が多[おお]くなり、その背[そむ]きが強[つよ]くなったからである。」"
  7: "「なぜ、わたしはあなたを赦[ゆる]すことができようか。あなたの子[こ]らはわたしを捨[す]て、神[かみ]でないものによって誓[ちか]った。わたしが彼[かれ]らを満[み]ち足[た]らせたのに、彼らは姦淫[かんいん]を犯[おか]し、遊女[ゆうじょ]の家[いえ]に群[む]れ集[あつ]まった。"
  8: "彼[かれ]らは牝馬[ひんば]のように欲[よく]に狂[くる]い、おのおのその隣人[りんじん]の妻[つま]に向[む]かって嘶[いなな]いた。"
  9: "これらのことのゆえに、わたしは彼[かれ]らを罰[ばっ]しないでおこうか、と主[しゅ]は言[い]われる。このような民[たみ]に、わたしの魂[たましい]は復讐[ふくしゅう]しないでおこうか。"
  10: "その城壁[じょうへき]の上[うえ]に上[のぼ]って、それを打[う]ち壊[こわ]せ。しかし、全[まった]く滅[ほろ]ぼし尽[つ]くすな。その支[ささ]えは残[のこ]しておけ。それらは主[しゅ]のものだからである。"
  11: "イスラエルの家[いえ]もユダの家[いえ]も、わたしに対して甚[はなは]だしく裏切[うらぎ]った、と主[しゅ]は言[い]われる。"
  12: "彼[かれ]らは主[しゅ]に偽[いつわ]りをつき、『そのようなことはない。災[わざわ]いはわたしたちに来[こ]ない。剣[つるぎ]も飢[うえ]も見[み]ない。"
  13: "われわれの預言者[よげんしゃ]たちは風[かぜ]となった。主[しゅ]の言葉[ことば]は彼[かれ]らのうちにない。彼らにはそのとおりになれ』。」"
  14: "それゆえ、万軍[ばんぐん]の主[しゅ]はこう言[い]われる。「あなたがたがこの言葉[ことば]を語[かた]ったゆえに、見[み]よ、わたしはわたしの言葉[ことば]をあなたの口[くち]のうちで火[ひ]とし、この民[たみ]を薪[たきぎ]とする。火は彼[かれ]らを焼[や]き尽[く]くす。」"
  15: "「見[み]よ、わたしはあなたがたの上[うえ]に、遠[とお]いところから一[ひと]つの民[たみ]を連[つ]れて来[く]る、イスラエルの家[いえ]よ、と主[しゅ]は言[い]われる。それは強[つよ]い民、古[ふる]い民であり、あなたはその言語[げんご]を聞[き]いても、その語[かた]ることを理解[りかい]できない。"
  16: "その矢筒[やづつ]は開[ひら]かれた墓[はか]のようであり、すべての者は勇士[ゆうし]である。"
  17: "彼[かれ]らはあなたがたの収穫[しゅうかく]とパンを食[く]い、あなたがたの息子[むすこ]たちと娘[むすめ]たちを食い、あなたがたの羊[ひつじ]と牛[うし]を食い、あなたがたのぶどう畑[ばたけ]と無花果[いちじく]の木[き]とオリーブ畑[ばたけ]を食い尽[つ]くし、あなたがたが頼[たよ]りとしている城壁[じょうへき]のある町々[まちまち]を剣[つるぎ]で打[う]ち壊[こわ]す。"
  18: "しかし、その日々[ひび]には、あなたの神[かみ]である主[しゅ]は言[い]われる、わたしはあなたがたを滅[ほろ]ぼし尽[く]くしはしない。」"
  19: "「そして、あなたがたが『なぜ、わたしたちの神[かみ]である主[しゅ]は、これらのすべてのことをわたしたちにされたのか』と言[い]うとき、あなたは彼[かれ]らに言[い]え。『あなたがたが自分[じぶん]の地[ち]でわたしを捨[す]てて異[い]なる神々[かみがみ]に仕[つか]えたように、あなたがたは自分[じぶん]のものでない地[ち]で異[い]なる者[もの]たちに仕[つか]えるだろう』と。」"
  20: "「ヤコブの家[いえ]にこのことを告[つ]げ、ユダで聞[き]こえさせよ、と言[い]って。"
  21: "これを聞[き]け、愚[おろ]かで心[こころ]のない民[たみ]よ。彼[かれ]らには目[め]があるのに見[み]えず、耳[みみ]があるのに聞[き]こえない。"
  22: "わたしを恐[おそ]れないのか、と主[しゅ]は言[い]われる。わたしの前[まえ]でおののかないのか。わたしは砂[すな]を海[うみ]の境[さかい]とし、とこしえの掟[おきて]とした。それは越[こ]えられない。波[なみ]が荒[あ]れても、それはできず、鳴[な]り響[ひび]いても、それを越[こ]えることはない。"
  23: "しかし、この民[たみ]には不従順[ふじゅうじゅん]で反抗的[はんこうてき]な心[こころ]があり、彼[かれ]らはそれて行[い]ってしまった。"
  24: "彼[かれ]らは心[こころ]のうちで言[い]わなかった。『わたしたちの神[かみ]である主[しゅ]を恐[おそ]れよう。主は時[とき]にかなって、先[さき]の雨[あめ]と後[あと]の雨[あめ]を与[あた]え、刈[か]り入[い]れの時[とき]を定[さだ]めて、それをわたしたちのために守[まも]ってくださる』と。"
  25: "あなたがたの不法[ふほう]がこれらのことを退[しりぞ]け、あなたがたの罪[つみ]が良[よ]いものをあなたがたから遠[とお]ざけた。"
  26: "わたしの民[たみ]のうちに悪[あく]い者[もの]たちが見[み]つかった。彼[かれ]らは鳥刺[とりさ]しのように見張[みは]り、罠[わな]を仕掛[しか]けて人[ひと]を滅[ほろ]ぼし、人を捕[と]らえる。"
  27: "鳥[とり]で満[み]ちた籠[かご]のように、彼[かれ]らの家[いえ]は欺[あざむ]きで満ちている。それゆえ、彼らは大[おお]きくなり、富[とみ]を増[ま]した。"
  28: "彼[かれ]らは肥[ふと]り、光[ひか]り輝[かがや]いて、裁[さば]きを踏[ふ]み越[こ]えた。孤児[みなしご]の裁[さば]きを行[おこな]わず、やもめの裁[さば]きを裁[さば]かなかった。"
  29: "これらのことのゆえに、わたしは彼[かれ]らを罰[ばっ]しないでおこうか、と主[しゅ]は言[い]われる。このような民[たみ]に、わたしの魂[たましい]は復讐[ふくしゅう]しないでおこうか。」"
  30: "「この地[ち]に驚[おどろ]くべきこと、恐[おそ]ろしいことが起[お]こった。"
  31: "預言者[よげんしゃ]たちは不[ふ]正[せい]なことを預言[よげん]し、祭司[さいし]たちはその手[て]で拍手[はくしゅ]を送[おく]り、わたしの民[たみ]はそれを愛[あい]している。それで、あなたがたはこの後[あと]、どうするのか。」"

notes:
  1: "Περιδράμετε ἐν ταῖς ὁδοῖς Ιερουσαλημ — «обегите пути Иерусалима» (περιτρέχω — обегать); καὶ ἴδετε καὶ γνῶτε — «и увидьте, и познайте». ζητήσατε ἐν ταῖς πλατείαις αὐτῆς — «поищите на площадях его» (πλατεῖα — широкая улица, площадь). ἐὰν εὕρητε ἄνδρα, εἰ ἔστιν ποιῶν κρίμα καὶ ζητῶν πίστιν — «если найдёте человека, делающего суд и ищущего верности» (κρίμα — суд; πίστις — верность, 真実). ἵλεως ἔσομαι αὐτοῖς — «буду милостив к ним» (ἵλεως — милостивый); слав. «милосерд буду ему» (ед. ч.). Глава открывается словом Господа без вводной формулы; кавычки открываются здесь и закрываются в 5:2."
  2: "Ζῇ κύριος, λέγουσιν — «жив Господь, говорят»: клятва народа — вложенная 『…』. διὰ τοῦτο οὐκ ἐπὶ ψεύδεσιν ὀμνύουσιν — «потому не ложно ли клянутся?» (ψεῦδος — ложь; ὄμνυμι — клясться); слав. «сего ради не во лжах ли кленутся?». Вопрос риторический, ответ отрицательный; кавычки закрываются."
  3: "κύριε, οἱ ὀφθαλμοί σου εἰς πίστιν — «Господи, очи Твои [обращены] к верности» (πίστις; слав. «на веру»). ἐμαστίγωσας αὐτούς, καὶ οὐκ ἐπόνεσαν — «Ты бичевал их, и они не почувствовали боли» (μαστιγόω — бичевать; πονέω — болеть). συνετέλεσας αὐτούς, καὶ οὐκ ἠθέλησαν δέξασθαι παιδείαν — «Ты сокрушил их, и они не захотели принять наставления» (συντελέω — завершать, истреблять; παιδεία — наставление, 懲らしめ). ἐστερέωσαν τὰ πρόσωπα αὐτῶν ὑπὲρ πέτραν — «сделали лица свои крепче камня» (στερεόω — укреплять, делать твёрдым). Молитвенное обращение пророка — 「…」."
  4: "Ἴσως πτωχοί εἰσιν — «может быть, они бедны» (πτωχός — бедный, 貧しい); διότι οὐκ ἐδυνάσθησαν — «ибо они не смогли [уразуметь]» (δύναμαι). οὐκ ἔγνωσαν ὁδὸν κυρίου καὶ κρίσιν θεοῦ — «не познали пути Господня и суда Бога [своего]». Слав. добавляет «(и буии)» и «Бога своего»: первое — вне LXX, внесено в основной текст без скобок («愚かで»); второе — по смыслу, в LXX θεοῦ без местоимения."
  5: "πορεύσομαι πρὸς τοὺς ἁδροὺς — «пойду к сильным [знатным]» (ἁδρός — крепкий, знатный; слав. «ко державным»). ὅτι αὐτοὶ ἐπέγνωσαν ὁδὸν κυρίου — «ибо они познали путь Господень»: ирония снимается в следующем члене. ὁμοθυμαδὸν συνέτριψαν ζυγόν — «единодушно сокрушили ярмо» (ὁμοθυμαδόν — единодушно; ζυγός — 軛); διέρρηξαν δεσμούς — «расторгли узы» (διαρρήγνυμι)."
  6: "ἔπαισεν αὐτοὺς λέων ἐκ τοῦ δρυμοῦ — «поразил их лев из дубравы» (παίω — поражать; δρυμός — дубрава). λύκος ἕως τῶν οἰκιῶν ὠλέθρευσεν αὐτούς — «волк до самых домов истребил их» (ὀλεθρεύω). πάρδαλις ἐγρηγόρησεν ἐπὶ τὰς πόλεις αὐτῶν — «барс бодрствует над городами их» (πάρδαλις — барс, 豹; γρηγορέω). πάντες οἱ ἐκπορευόμενοι ἀπ᾽ αὐτῶν θηρευθήσονται — «все выходящие из них будут пойманы» (θηρεύω — ловить). ἐπλήθυναν ἀσεβείας αὐτῶν — «умножили нечестия свои»; ἴσχυσαν ἐν ταῖς ἀποστροφαῖς αὐτῶν — «укрепились в отступлениях своих» (ἀποστροφή). Кавычки закрываются."
  7: "ποίᾳ τούτων ἵλεως γένωμαί σοι — «за что из этого Мне быть милостивым к тебе?» (ἵλεως γίνομαι — быть милостивым); слав. «о чем от сих милосерд буду тебе?». οἱ υἱοί σου ἐγκατέλιπόν με — «сыны твои оставили Меня». ὤμνυον ἐν τοῖς οὐκ οὖσιν θεοῖς — «клялись теми, которые не боги» (ὄμνυμι ἐν — клясться кем-либо). ἐχόρτασα αὐτούς — «Я насытил их» (χορτάζω); ἐμοιχῶντο — «прелюбодействовали» (μοιχάομαι); ἐν οἴκοις πορνῶν κατέλυον — «в домах блудниц останавливались» (καταλύω — останавливаться, ночевать)."
  8: "ἵπποι θηλυμανεῖς ἐγενήθησαν — «они стали конями, беснующимися по самкам» (θηλυμανής — одержимый похотью к самкам; слав. «кони женонеистовни»). ἕκαστος ἐπὶ τὴν γυναῖκα τοῦ πλησίον αὐτοῦ ἐχρεμέτιζον — «каждый ржал на жену ближнего своего» (χρεμετίζω — ржать, 嘶く; πλησίον — ближний)."
  9: "μὴ ἐπὶ τούτοις οὐκ ἐπισκέψομαι — «разве за это Я не посещу?» (ἐπισκέπτομαι — посещать, взыскивать; в тексте 罰する). ἢ ἐν ἔθνει τοιούτῳ οὐκ ἐκδικήσει ἡ ψυχή μου — «или над таким народом не отмстит душа Моя?» (ἐκδικέω — мстить). Двойной риторический вопрос, как в греч."
  10: "ἀνάβητε ἐπὶ τοὺς προμαχῶνας αὐτῆς — «взойдите на передовые укрепления его» (προμαχών — передовой вал, 城壁). κατασκάψατε — «срывайте» (κατασκάπτω). συντέλειαν δὲ μὴ ποιήσητε — «но полного истребления не делайте» (συντέλεια). ὑπολίπεσθε τὰ ὑποστηρίγματα αὐτῆς — «оставьте опоры его» (ὑπολιμπάνομαι — оставлять; ὑποστήριγμα — опора); ὅτι τοῦ κυρίου εἰσίν — «ибо они Господни». У ru (МТ) «уничтожьте зубцы их, потому что они не Господни» — противоположное чтение; держим LXX/csl."
  11: "ἀθετῶν ἠθέτησεν εἰς ἐμέ — «вероломно поступил против Меня» (ἀθετέω — отвергать, нарушать верность; усиление повторением корня). οἶκος Ισραηλ καὶ οἶκος Ιουδα — «дом Израилев и дом Иудин»; слав. «преступлением бо преступил есть на мя». Слово Господа продолжается."
  12: "ἐψεύσαντο τῷ κυρίῳ ἑαυτῶν — «они солгали Господу своему» (ψεύδομαι — лгать, 偽る). καὶ εἶπαν Οὐκ ἔστιν ταῦτα — «и сказали: этого нет»: слова народа — вложенная 『…』, она идёт до 5:13. οὐχ ἥξει ἐφ᾽ ἡμᾶς κακά — «не придёт на нас злое»; μάχαιραν καὶ λιμὸν οὐκ ὀψόμεθα — «меча и голода не увидим» (λιμός — голод, 飢え)."
  13: "οἱ προφῆται ἡμῶν ἦσαν εἰς ἄνεμον — «пророки наши стали ветром» (εἰς ἄνεμον — в ветер, т. е. в ничто): продолжение слов народа. καὶ λόγος κυρίου οὐχ ὑπῆρχεν ἐν αὐτοῖς — «и слова Господня не было в них» (ὑπάρχω — быть, находиться). οὕτως ἔσται αὐτοῖς — «так будет им»: заключение речения, оставлено внутри вложенной цитаты. Ею и словом Господа 5:7–13 кавычки закрываются."
  14: "διὰ τοῦτο τάδε λέγει κύριος παντοκράτωρ — «посему так говорит Господь Вседержитель» (παντοκράτωρ — Вседержитель; в тексте 万軍の主 по корпусу). Ἀνθ᾽ ὧν ἐλαλήσατε τὸ ῥῆμα τοῦτο — «за то, что вы говорили это слово» (ἀνθ᾽ ὧν — вместо того, потому что). ἰδοὺ ἐγὼ δέδωκα τοὺς λόγους μου εἰς τὸ στόμα σου πῦρ — «вот, Я дал слова Мои в уста твои огнём»; τὸν λαὸν τοῦτον ξύλα — «а народ этот — дрова» (ξύλον — дерево, дрова); καταφάγεται αὐτούς — «и пожрёт их» (κατεσθίω). Кавычки закрываются."
  15: "ἐγὼ ἐπάγω ἐφ᾽ ὑμᾶς ἔθνος πόρρωθεν — «Я навожу на вас народ издалека» (ἐπάγω — наводить; πόρρωθεν — издалека). ἔθνος, οὗ οὐκ ἀκούσῃ τῆς φωνῆς τῆς γλώσσης αὐτοῦ — «народ, чьего языка ты не услышишь», т. е. не поймёшь (ἀκούω — слышать и понимать). Слав. добавляет «(ни уразумееши, что глаголет)» — нет в LXX, внесено без скобок («その語ることも理解できない»)."
  16: "В модуле gr 5:16 сокращён до πάντες ἰσχυροί — «все сильны/крепки». Начало стиха LXX (οἱ φαρέτραι αὐτῶν ὡς τάφος ἀνεῳγμένος — «колчаны их, как открытый гроб») в gr отсутствует, но есть в csl («тул его яко гроб отверст») и в LXX — поэтому внесено в основной текст без скобок: 矢筒, 開かれた墓. Слав. в этом же стихе начинает 5:17 («и поядят жатву вашу»); держим gr."
  17: "κατέδονται τὸν θερισμὸν ὑμῶν καὶ τοὺς ἄρτους ὑμῶν — «съедят жатву вашу и хлебы ваши» (θερισμός — жатва; ἄρτος — хлеб). Пять раз повторено κατέδονται — повтор сохранён. ἀλοήσουσιν τὰς πόλεις τὰς ὀχυράς — «разрушат города укреплённые» (ἀλοάω — молотить, здесь сокрушать); ἐν ῥομφαίᾳ — «мечом» (ῥομφαία — меч, 剣)."
  18: "καὶ ἔσται ἐν ταῖς ἡμέραις ἐκείναις, λέγει κύριος ὁ θεός σου — «и будет в те дни, говорит Господь Бог твой». οὐ μὴ ποιήσω ὑμᾶς εἰς συντέλειαν — «не сделаю вас полным истреблением» (συντέλεια). Слав. «Обаче во днех онех» — «впрочем, в те дни»; союз «впрочем» внесён («しかし»), т. к. он есть в csl и несёт противопоставление. Кавычки закрываются."
  19: "ὅταν εἴπητε Τίνος ἕνεκεν ἐποίησεν κύριος ὁ θεὸς ἡμῶν ἡμῖν ἅπαντα ταῦτα — «когда вы скажете: зачем сделал нам Господь Бог наш всё это?»: вопрос народа — вложенная 『…』. καὶ ἐρεῖς αὐτοῖς — «и скажи им» (ед. ч.); Ἀνθ᾽ ὧν ἐδουλεύσατε θεοῖς ἀλλοτρίοις ἐν τῇ γῇ ὑμῶν — «за то, что служили чужим богам в земле вашей» (δουλεύω — служить). οὕτως δουλεύσετε ἀλλοτρίοις ἐν γῇ οὐχ ὑμῶν — «так будете служить чужим в земле не вашей»: ответ — вторая 『…』."
  20: "ἀναγγείλατε ταῦτα εἰς τὸν οἶκον Ιακωβ — «возвестите это дому Иаковлеву»; καὶ ἀκουσθήτω ἐν τῷ Ιουδα — «и да услышится в Иудее». Слав. добавляет «(рекуще)» — «говоря»; этого нет в LXX, внесено без скобок («と言って»), чтобы связать с 5:21. Кавычки открываются здесь и идут до 5:29."
  21: "ἀκούσατε δὴ ταῦτα — «услышьте же это» (δή — усилительная частица). λαὸς μωρὸς καὶ ἀκάρδιος — «народ глупый и бессердечный» (μωρός — глупый; ἀκάρδιος — без сердца, неразумный, 心のない). ὀφθαλμοὶ αὐτοῖς καὶ οὐ βλέπουσιν — «глаза у них, и не видят»; ὦτα αὐτοῖς καὶ οὐκ ἀκούουσιν — «уши у них, и не слышат»: параллелизм сохранён."
  22: "μὴ ἐμὲ οὐ φοβηθήσεσθε — «Меня ли не убоитесь?» (двойное отрицание в греч. усиливает вопрос). ἢ ἀπὸ προσώπου μου οὐκ εὐλαβηθήσεσθε — «и лица Моего не устыдитесь?» (εὐλαβέομαι — благоговеть). τὸν τάξαντα ἄμμον ὅριον τῇ θαλάσσῃ — «положившего песок пределом морю» (ἄμμος — песок; ὅριον — предел). πρόσταγμα αἰώνιον — «устав вечный» (πρόσταγμα — повеление, устав). καὶ ταραχθήσεται καὶ οὐ δυνήσεται — «и возмутится, но не сможет [перейти]» (ταράσσω); ἠχήσουσιν τὰ κύματα αὐτῆς — «возшумят волны его» (κῦμα — волна)."
  23: "τῷ δὲ λαῷ τούτῳ ἐγενήθη καρδία ἀνήκοος καὶ ἀπειθής — «а у народа этого стало сердце непослушное и непокорное» (ἀνήκοος — неслушающий; ἀπειθής — непокорный). ἐξέκλιναν καὶ ἀπήλθοσαν — «они уклонились и ушли» (ἐκκλίνω — уклоняться)."
  24: "καὶ οὐκ εἶπον ἐν τῇ καρδίᾳ αὐτῶν — «и не сказали в сердце своём»; Φοβηθῶμεν δὴ κύριον τὸν θεὸν ἡμῶν — «убóимся же Господа Бога нашего»: слова, которых не было, — вложенная 『…』. τὸν διδόντα ἡμῖν ὑετὸν πρόιμον καὶ ὄψιμον — «дающего нам дождь ранний и поздний» (ὑετός — дождь; πρόιμος — ранний; ὄψιμος — поздний). κατὰ καιρὸν πληρώσεως προστάγματος θερισμοῦ — «в срок исполнения устава жатвы» (θερισμός — жатва); καὶ ἐφύλαξεν ἡμῖν — «и сохранил нам» (φυλάσσω)."
  25: "αἱ ἀνομίαι ὑμῶν ἐξέκλιναν ταῦτα — «беззакония ваши отклонили это» (ἀνομία; ἐκκλίνω — отклонять); αἱ ἁμαρτίαι ὑμῶν ἀπέστησαν τὰ ἀγαθὰ ἀφ᾽ ὑμῶν — «грехи ваши удалили благое от вас» (ἀφίστημι). Слав. читает «беззакония наша… греси наши» (1-е л. мн. ч., покаянно); в тексте по LXX 2-е л. мн. ч., расхождение отмечено."
  26: "εὑρέθησαν ἐν τῷ λαῷ μου ἀσεβεῖς — «нашлись в народе Моём нечестивые» (ἀσεβής). παγίδας ἔστησαν διαφθεῖραι ἄνδρας — «поставили сети, чтобы погубить мужей» (παγίς — сеть, 罠; διαφθείρω — губить, растлевать). συνελαμβάνοσαν — «ловили» (συλλαμβάνω — захватывать)."
  27: "ὡς παγὶς ἐφεσταμένη πλήρης πετεινῶν — «как сеть поставленная, полная птиц» (ἐφίστημι — ставить; πετεινόν — птица); слав. «аки клетка поставлена полна птиц» (клетка вместо сети). οἱ οἶκοι αὐτῶν πλήρεις δόλου — «домы их полны обмана» (δόλος — коварство, 欺き). ἐμεγαλύνθησαν καὶ ἐπλούτησαν — «они возвеличились и обогатились» (μεγαλύνω; πλουτέω)."
  28: "παρέβησαν κρίσιν — «они преступили суд» (παραβαίνω — переступать, нарушать). οὐκ ἔκριναν κρίσιν ὀρφανοῦ — «не судили суда сироты» (ὀρφανός — сирота, 孤児); κρίσιν χήρας οὐκ ἐκρίνοσαν — «суда вдовы не судили» (χήρα — вдова, やもめ). Слав. в начале добавляет «утыша и утолстеша» («отучнели и разжирели») — нет в LXX (чтение МТ), внесено без скобок; там же «преступиша словеса моя» вместо «суд» и лишний член «суда убогим» — держим LXX, отмечено."
  29: "Повтор 5:9 почти дословно: μὴ ἐπὶ τούτοις οὐκ ἐπισκέψομαι — «разве за это не посещу?»; ἢ ἐν ἔθνει τῷ τοιούτῳ οὐκ ἐκδικήσει ἡ ψυχή μου — «или над таким народом не отмстит душа Моя?». Повтор намеренный, не сглажен. Кавычки закрываются; 5:30 начинает новое речение."
  30: "ἔκστασις καὶ φρικτὰ ἐγενήθη ἐπὶ τῆς γῆς — «изумление и ужасное произошло на земле» (ἔκστασις — исступление, изумление, 驚くべきこと; φρικτός — страшный, ужасный). Стихи 30–31 — одно речение; кавычки открываются здесь и закрываются в 5:31. Вероятно, это слово Господа (в 5:31 речь от первого лица: «народ Мой»), но возможно и слово пророка — отмечено как спорное."
  31: "οἱ προφῆται προφητεύουσιν ἄδικα — «пророки пророчествуют неправедное» (ἄδικος — неправедный). οἱ ἱερεῖς ἐπεκρότησαν ταῖς χερσὶν αὐτῶν — «священники рукоплескали руками своими» (ἐπικροτέω — рукоплескать), т. е. одобряли. ὁ λαός μου ἠγάπησεν οὕτως — «народ Мой возлюбил это» (οὕτως — так). καὶ τί ποιήσετε εἰς τὰ μετὰ ταῦτα — «и что будете делать после этого?» (εἰς τὰ μετά — в последующем, この後). Кавычки закрываются, глава кончается."
