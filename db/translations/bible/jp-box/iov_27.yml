verses:
  1: "ヨブはさらに言葉[ことば]を続[つづ]けて、格言[かくげん]によって言[い]った。"
  2: "「主[しゅ]は生[い]きておられる。わたしをこのように裁[さば]いた方[かた]、わたしの魂[たましい]を苦[くる]しめた全能者[ぜんのうしゃ]は。"
  3: "わたしの息[いき]がまだあり、神[かみ]の息がわたしの鼻[はな]の内[うち]にあるかぎり、"
  4: "わたしの唇[くちびる]は不法[ふほう]を語[かた]らず、わたしの魂[たましい]は不正[ふせい]を思[おも]わない。"
  5: "わたしは死[し]ぬまで、あなたがたを正[ただ]しい者[もの]と呼[よ]ぶことはない。わたしは自分[じぶん]の無垢[むく]を捨[す]てないからである。"
  6: "わたしは正義[せいぎ]に心[こころ]を留[と]め、それを手放[てばな]さない。わたしは自分[じぶん]の内[うち]に、ふさわしくない行[おこな]いをした覚[おぼ]えがないからである。"
  7: "わたしの敵[てき]は不敬[ふけい]な者[もの]の滅[ほろ]びのようになり、わたしに立[た]ち向[む]かう者[もの]は不法[ふほう]の者[もの]の破滅[はめつ]のようになれ。"
  8: "不敬[ふけい]な者に何[なん]の希望[きぼう]があろうか。何[なに]を待[ま]ち続[つづ]けているというのか。主[しゅ]に寄[よ]り頼[たの]んでも、果[は]たして救[すく]われるのだろうか。"
  9: "主[しゅ]はその願[ねが]いを聞[き]かれるだろうか。彼の身[み]に苦[くる]しみが迫[せま]ったとき、"
  10: "彼は神[かみ]の前[まえ]に何[なん]の確[かく]信[しん]を持[も]てるだろうか。彼が呼[よ]び求[もと]めるとき、神は彼の声[こえ]を聞[き]かれるだろうか。"
  11: "しかし、わたしはあなたがたに告[つ]げよう。主[しゅ]の御手[みて]にあるものを。全能者[ぜんのうしゃ]のもとにあることを、わたしは偽[いつわ]らない。"
  12: "見[み]よ、あなたがたはみな知[し]っている。あなたがたは空[むな]しいものを空しいものに付[つ]け加[くわ]えているのだ。"
  13: "これが、主[しゅ]から不敬[ふけい]な者[もの]への分[ぶん]であり、力[ちから]ある者[もの]たちが全能者[ぜんのうしゃ]から受[う]ける嗣業[しぎょう]であり、彼[かれ]らの上[うえ]に来[く]る。"
  14: "たとえその子[こ]らが多[おお]くなっても、彼らは屠[ほふ]り場[ば]に送[おく]られる。たとえ彼らが成人[せいじん]しても、物乞[ものご]いをする。"
  15: "彼のもとに残[のこ]る者[もの]たちは死[し]によって果[は]て、彼[かれ]らの寡婦[かふ]をあわれむ者[もの]はだれもいない。"
  16: "たとえ彼が銀[ぎん]を土[つち]のように集[あつ]め、金[きん]を泥[どろ]のように備[そな]えても、"
  17: "これらすべてを正[ただ]しい者[もの]たちが手[て]に入[い]れ、彼の財産[ざいさん]は真実[しんじつ]な者[もの]たちが取[と]る。"
  18: "その家[いえ]は蛾[が]のように、彼が守[まも]り続[つづ]けた蜘蛛[くも]の巣[す]のように過[す]ぎ去[さ]る。"
  19: "富[とみ]ある者[もの]は眠[ねむ]りにつき、再[ふたた]び起[お]きることはない。目[め]を開[ひら]いても、もういない。"
  20: "苦[くる]しみが水[みず]のように彼を襲[おそ]い、夜[よる]には暗[くら]闇[やみ]が彼を奪[うば]い去[さ]る。"
  21: "熱風[ねっぷう]が彼を取[と]り去[さ]り、彼は消[き]え去[さ]って、その場所[ばしょ]から吹[ふ]き払[はら]われる。"
  22: "それは彼の上[うえ]に投[な]げかかり、容赦[ようしゃ]しない。彼はその手[て]から逃[に]げ去[さ]ろうと懸命[けんめい]に走[はし]る。"
  23: "彼の上[うえ]で手[て]を打[う]ち鳴[な]らし、彼の場所[ばしょ]から彼に口笛[くちぶえ]を吹[ふ]く。」"

notes:
  1: "Повествование. Ἔτι δὲ προσθεὶς Ιωβ εἶπεν τῷ προοιμίῳ — «И ещё, продолжив, Иов сказал в притче»: προοίμιον — «вступление, притча» (LXX передаёт евр. מָשָׁל); слав. «рече в притчах», Син. «возвышенную речь». Формула вне кавычек; речь открывается в ст. 2. Та же формула — 29:1. Речь Иова продолжается и в гл. 28 (там без новой формулы)."
  2: "Иов. Ζῇ κύριος, ὃς οὕτω με κέκρικεν — «жив Господь, который так меня судил»: клятвенная формула (ср. 1 Цар 14:39); κρίνω — «судить». ὁ παντοκράτωρ ὁ πικράνας μου τὴν ψυχήν — «и Вседержитель, огорчивший душу мою»: πικραίνω — «горчить, огорчать»; παντοκράτωρ — 全能者. Клятва продолжается в ст. 3–4."
  3: "Иов. ἦ μὴν ἔτι τῆς πνοῆς μου ἐνούσης — «пока ещё дыхание моё во мне»: ἦ μήν — усилительная клятвенная частица; πνοή — «дыхание». πνεῦμα δὲ θεῖον τὸ περιόν μοι ἐν ῥισίν — «и дух Божий, сущий во мне в ноздрях»: ῥίς — «нос, ноздря»; слав. «дух Божий сущий в ноздрех моих». Придаточное продолжается в ст. 4."
  4: "Иов. μὴ λαλήσειν τὰ χείλη μου ἄνομα — «не скажут уста мои беззакония»: ἄνομος — «беззаконный». οὐδὲ ἡ ψυχή μου μελετήσει ἄδικα — «и душа моя не будет помышлять неправды»: μελετάω — «размышлять, замышлять». Клятва: пока жив, не буду говорить лжи; слав. «не возглаголют устне мои беззакония»."
  5: "Иов. μή μοι εἴη δικαίους ὑμᾶς ἀποφῆναι — «да не будет мне признать вас праведными»: ἀποφαίνω — «объявлять, признавать». ἕως ἂν ἀποθάνω — «доколе не умру». οὐ γὰρ ἀπαλλάξω μου τὴν ἀκακίαν — «ибо не отступлю от незлобия моего»: ἀκακία — «незлобие, невинность» (в тексте 無垢); ἀπαλλάσσω — «оставлять, отступать». Син. «не уступлю непорочности моей»."
  6: "Иов. δικαιοσύνῃ δὲ προσέχων οὐ μὴ προῶμαι — «внимая правде, не оставлю её»: προσέχω — «внимать, держаться»; προΐημι — «оставлять, отпускать». οὐ γὰρ σύνοιδα ἐμαυτῷ ἄτοπα πράξας — «ибо не сознаю за собой ничего неуместного»: σύνοιδα — «сознавать»; ἄτοπος — «неуместный, дурной». Слав. «не свем бо себе злых соделавша»."
  7: "Иов. οὐ μὴν δὲ ἀλλά — «итак, да» (переход к пожеланию). εἴησαν οἱ ἐχθροί μου ὥσπερ ἡ καταστροφὴ τῶν ἀσεβῶν — «да будут враги мои как низвержение нечестивых»: καταστροφή — «ниспровержение, погибель»; ἀσεβής — 不敬な者. οἱ ἐπ᾿ ἐμὲ ἐπανιστάμενοι — «восстающие на меня»; ἀπώλεια τῶν παρανόμων — «погибель беззаконных». Пожелание-проклятие, как в Пс 108."
  8: "Иов. καὶ τίς γάρ ἐστιν ἐλπὶς ἀσεβεῖ ὅτι ἐπέχει — «и какая надежда нечестивому, что он держится?»: ἐπέχω — «держать, удерживать, внимать», тёмное место (слав. «яко ожидает»). πεποιθὼς ἐπὶ κύριον ἆρα σωθήσεται — «полагаясь на Господа, спасётся ли?»: ἆρα — вопросительная частица. В евр. «лицемеру, когда исторгнет Бог душу его» — иное чтение, не вносим."
  9: "Иов. ἦ τὴν δέησιν αὐτοῦ εἰσακούσεται κύριος — «или услышит Господь прошение его?»: δέησις — «моление, просьба». ἢ ἐπελθούσης αὐτῷ ἀνάγκης — «или когда придёт на него нужда»: ἀνάγκη — «нужда, принуждение». Стих обрывается на полуслове; продолжение — в ст. 10, как в греческом и слав."
  10: "Иов. μὴ ἔχει τινὰ παρρησίαν ἔναντι αὐτοῦ — «разве имеет он какое дерзновение пред Ним?»: παρρησία — «свобода речи, дерзновение». ἢ ὡς ἐπικαλεσαμένου αὐτοῦ εἰσακούσεται αὐτοῦ — «или, когда он призовёт, услышит его?»: ἐπικαλέομαι — «призывать». Завершение мысли, начатой в ст. 9."
  11: "Иов. ἀλλὰ δὴ ἀναγγελῶ ὑμῖν τί ἐστιν ἐν χειρὶ κυρίου — «но возвещу вам, что в руке Господней»: ἀναγγέλλω — «возвещать». ἅ ἐστιν παρὰ παντοκράτορι, οὐ ψεύσομαι — «что у Вседержителя, не солгу»: ψεύδομαι — «лгать». Слав. «возвещу вам, что есть в руце Господни»."
  12: "Иов. ἰδοὺ δὴ πάντες οἴδατε — «вот, все вы знаете». ὅτι κενὰ κενοῖς ἐπιβάλλετε — «что пустое к пустому прилагаете»: κενός — «пустой»; ἐπιβάλλω — «накладывать, прибавлять». Тёмный образ: вы только умножаете пустые слова; слав. «тщетная ко тщетным прилагаете»."
  13: "Иов. αὕτη ἡ μερὶς ἀνθρώπου ἀσεβοῦς παρὰ κυρίου — «вот часть человека нечестивого от Господа»: μερίς — «доля, удел». κτῆμα δὲ δυναστῶν ἐλεύσεται παρὰ παντοκράτορος ἐπ᾿ αὐτούς — «и достояние сильных придёт от Вседержителя на них»: κτῆμα — «имущество, владение»; δυνάστης — «владыка, сильный» (в тексте 力ある者たち). Слав. «сия часть человека нечестиваго… и жребий сильных»."
  14: "Иов. ἐὰν δὲ πολλοὶ γένωνται οἱ υἱοὶ αὐτοῦ, εἰς σφαγὴν ἔσονται — «если и умножатся сыновья его, будут на заклание»: σφαγή — «заклание, бойня». ἐὰν δὲ καὶ ἀνδρωθῶσιν, προσαιτήσουσιν — «если и возмужают, будут просить милостыню»: ἀνδρόω — «возмужать»; προσαιτέω — «просить подаяние». Судьба потомства нечестивого."
  15: "Иов. οἱ δὲ περιόντες αὐτοῦ ἐν θανάτῳ τελευτήσουσιν — «оставшиеся из него умрут смертью»: περίειμι — «оставаться в живых»; τελευτάω — «умирать». χήρας δὲ αὐτῶν οὐθεὶς ἐλεήσει — «и вдов их никто не помилует»: ἐλεέω — «миловать». Слав. «оставшиися же ему смертию умрут»."
  16: "Иов. ἐὰν συναγάγῃ ὥσπερ γῆν ἀργύριον — «если соберёт серебро, как землю»: συνάγω — «собирать». ἴσα δὲ πηλῷ ἑτοιμάσῃ χρυσίον — «и приготовит золото, как грязь»: πηλός — «глина, грязь»; ἑτοιμάζω — «готовить». Сравнение богатства с землёй и грязью; слав. «якоже землю сребро… якоже брение злато»."
  17: "Иов. ταῦτα πάντα δίκαιοι περιποιήσονται — «всё это приобретут праведники»: περιποιέομαι — «приобретать, сберегать». τὰ δὲ χρήματα αὐτοῦ ἀληθινοὶ καθέξουσιν — «и имущество его истинные получат»: ἀληθινός — «истинный, верный» (в тексте 真実な者); κατέχω — «держать, получать». Собранное нечестивым достаётся праведнику."
  18: "Иов. ἀπέβη δὲ ὁ οἶκος αὐτοῦ ὥσπερ σῆτες — «и отошёл дом его, как моль»: ἀποβαίνω — «уходить, исчезать»; σής — «моль». καὶ ὥσπερ ἀράχνη — «и как паук (паутина)»; слав. добавляет «яже снабде» («которую он сберёг») — этих слов в LXX нет, но по паритету они внесены в основной текст без 〔…〕."
  19: "Иов. πλούσιος κοιμηθεὶς καὶ οὐ προσθήσει — «богатый уснёт и не приложит», т. е. не встанет более: προστίθημι — «прибавлять» (здесь «продолжить»). ὀφθαλμοὺς αὐτοῦ διήνοιξεν καὶ οὐκ ἔστιν — «открыл глаза свои, и нет его»: διανοίγω — «открывать». Слав. «богатый уснет и не приложит, очи свои отверзе, и несть»."
  20: "Иов. συνήντησαν αὐτῷ ὥσπερ ὕδωρ αἱ ὀδύναι — «встретили его, как вода, скорби»: συναντάω — «встречать»; ὀδύνη — «боль, скорбь». νυκτὶ δὲ ὑφείλατο αὐτὸν γνόφος — «ночью похитил его мрак»: ὑφαιρέομαι — «похищать»; γνόφος — «мрак, тьма» (в тексте 暗闇). Слав. «обыдоша его якоже вода болезни»."
  21: "Иов. ἀναλήμψεται αὐτὸν καύσων — «возьмёт его зной»: καύσων — «палящий зной, южный ветер» (в тексте 熱風). ἀπελεύσεται καὶ λικμήσει αὐτὸν ἐκ τοῦ τόπου αὐτοῦ — «уйдёт и развеет его с места его»: λικμάω — «веять, развеивать», как зерно на ветру. Слав. «возмет же его вар, и отидет, и возвеет его от места его»."
  22: "Иов. καὶ ἐπιρρίψει ἐπ᾿ αὐτὸν καὶ οὐ φείσεται — «и обрушит на него, и не пощадит»: ἐπιρρίπτω — «бросать на»; φείδομαι — «щадить». ἐκ χειρὸς αὐτοῦ φυγῇ φεύξεται — «из руки его побежит бегством»: усиление φυγῇ φεύγειν. Подлежащее в греческом не названо (зной? Бог?); сохранено без уточнения."
  23: "Иов. κροτήσει ἐπ᾿ αὐτοῦ χεῖρας αὐτοῦ — «всплеснёт над ним руками своими»: κροτέω — «бить, хлопать». συριεῖ αὐτὸν ἐκ τοῦ τόπου αὐτοῦ — «посвистит ему с места его»: συρίζω — «свистеть». Жест презрения и изгнания; слав. «восплещет нань рукама своима». Цитата закрыта, в гл. 28 речь продолжается."
