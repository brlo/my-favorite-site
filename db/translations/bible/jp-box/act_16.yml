verses:
  1: "パウロはデルベとリストラにも着[つ]いた。見[み]よ、そこにティモテという名[な]の弟子[でし]がいた。母[はは]は信[しん]じたユダヤ人[じん]の女[おんな]で、父[ちち]はギリシア人[じん]であった。"
  2: "彼[かれ]は、リストラとイコニオンにいる兄弟[きょうだい]たちから、よく証[あかし]されていた。"
  3: "パウロはこの人[ひと]を自分[じぶん]と一緒[いっしょ]に連[つ]れて行[い]こうと思[おも]い、その地方[ちほう]にいるユダヤ人[じん]たちのために、彼[かれ]に割礼[かつれい]を施[ほどこ]した。彼[かれ]の父[ちち]がギリシア人[じん]であることを、皆[みな]が知[し]っていたからである。"
  4: "町々[まちまち]を通[とお]るうちに、彼[かれ]らは、エルサレムにいる使徒[しと]たちと長老[ちょうろう]たちが決[き]めた定[さだ]めを人々[ひとびと]に渡[わた]して、守[まも]らせていた。"
  5: "こうして、教会[きょうかい]たちは信仰[しんこう]に堅[かた]くされ、日[ひ]ごとに数[かず]を増[ふ]していった。"
  6: "彼[かれ]らはフリギアとガラテヤの地方[ちほう]を巡[めぐ]った。{聖霊[せいれい]|聖神[せいしん]}によって、アジアで御言葉[みことば]を語[かた]ることを妨[さまた]げられたからである。"
  7: "そして、ミシアに来[き]て、ビティニアへ行[い]こうと試[こころ]みたが、イエスの霊[れい]がそれを許[ゆる]さなかった。"
  8: "そこで、ミシアを通[とお]り過[す]ぎて、トロアスに下[くだ]った。"
  9: "すると夜[よる]、パウロに幻[まぼろし]が現[あらわ]れた。一人[ひとり]のマケドニア人[じん]が立[た]って、彼[かれ]に願[ねが]い、こう言[い]った。「マケドニアへ渡[わた]って来[き]て、わたしたちを助[たす]けてください。」"
  10: "パウロがこの幻[まぼろし]を見[み]た後[のち]、わたしたちは、神[かみ]がわたしたちを召[め]して、彼[かれ]らに福音[ふくいん]を宣[の]べ伝[つた]えさせようとしておられるのを悟[さと]り、すぐにマケドニアへ出[で]かけることにした。"
  11: "トロアスから船[ふね]でまっすぐにサモトラケへ渡[わた]り、翌日[よくじつ]はネアポリスに着[つ]いた。"
  12: "そこからフィリピへ行[い]った。ここはマケドニアの一地方[いちちほう]の第一[だいいち]の町[まち]で、植民市[しょくみんし]⟨ローマの退役[たいえき]軍人[ぐんじん]たちが入植[にゅうしょく]した、ローマ市民権[しみんけん]をもつ都市[とし]。⟩であった。わたしたちはこの町[まち]で幾日[いくにち]か過[す]ごした。"
  13: "安息日[あんそくび]に、わたしたちは町[まち]の門[もん]を出[で]て、川[かわ]のほとりへ行[い]った。そこが祈[いの]りの場所[ばしょ]であると考[かんが]えていたからである。そして座[すわ]って、集[あつ]まって来[き]た女[おんな]たちに話[はな]した。"
  14: "ルデヤという女[おんな]が一人[ひとり]聞[き]いていた。ティアティラの町[まち]の者[もの]で、紫[むらさき]布[ぬの]の商人[しょうにん]、神[かみ]を崇[あが]める人[ひと]であった。主[しゅ]は彼女[かのじょ]の心[こころ]を開[ひら]いて、パウロの語[かた]ることに心[こころ]を向[む]けさせた。"
  15: "彼女[かのじょ]は家族[かぞく]ともども洗礼[せんれい]を受[う]けると、わたしたちに願[ねが]って言[い]った。「もし、わたしが主[しゅ]に忠実[ちゅうじつ]な者[もの]だとお思[おも]いでしたら、わたしの家[いえ]に入[はい]って滞在[たいざい]してください。」そして、わたしたちを強[し]いて引[ひ]き止[と]めた。"
  16: "ある日[ひ]、わたしたちが祈[いの]りの場所[ばしょ]へ行[い]く途中[とちゅう]、占[うらな]いの霊[れい]に取[と]りつかれた若[わか]い女[おんな]奴隷[どれい]が、わたしたちに会[あ]った。彼女[かのじょ]は占[うらな]いによって、主人[しゅじん]たちに多[おお]くの利益[りえき]をもたらしていた。"
  17: "彼女[かのじょ]はパウロとわたしたちにつき従って、叫[さけ]んで言[い]った。「この人[ひと]たちは、いと高[たか]き神[かみ]の僕[しもべ]たちで、あなたがたに救[すく]いの道[みち]を告[つ]げ知[し]らせている者[もの]です。」"
  18: "彼女[かのじょ]はこれを何日[なんにち]も続[つづ]けた。パウロは煩[わずら]わしく思[おも]って振[ふ]り向[む]き、霊[れい]に言[い]った。「イエス・キリストの名[な]によって命[めい]じる。この女[おんな]から出[で]て行[い]け。」すると霊[れい]はその場[ば]で出[で]て行[い]った。"
  19: "ところが、彼女[かのじょ]の主人[しゅじん]たちは、自分[じぶん]たちの利益[りえき]の望[のぞ]みが消[き]えたのを見[み]て、パウロとシラスを捕[つか]まえ、広場[ひろば]へ引[ひ]きずって行[い]き、役人[やくにん]たちの前[まえ]に引[ひ]き出[だ]した。"
  20: "そして、長官[ちょうかん]たちの前[まえ]に二人[ふたり]を連[つ]れて来[き]て言[い]った。「この人[ひと]たちはユダヤ人[じん]で、わたしたちの町[まち]をかき乱[みだ]しています。"
  21: "そして、わたしたちローマ人[じん]が受[う]け入[い]れることも行[おこな]うことも許[ゆる]されない慣習[かんしゅう]を宣[の]べ伝[つた]えているのです。」"
  22: "群衆[ぐんしゅう]もまた、彼[かれ]らに立[た]ち向[む]かった。そこで長官[ちょうかん]たちは、彼[かれ]らの衣[ころも]を剥[は]ぎ取[と]らせ、杖[むち]で打[う]つよう命[めい]じた。"
  23: "そして、多[おお]くの鞭打[むちう]ちを加[くわ]えたうえで、彼[かれ]らを牢[ろう]に入[い]れ、獄吏[ごくり]に厳重[げんじゅう]に守[まも]るよう命[めい]じた。"
  24: "獄吏[ごくり]はこのような命令[めいれい]を受[う]けると、彼[かれ]らを奥[おく]の牢[ろう]に入[い]れ、足[あし]を木枷[きかせ]にしっかと固定[こてい]した。"
  25: "真夜中[まよなか]ごろ、パウロとシラスは祈[いの]りながら神[かみ]をほめたたえていた。囚人[しゅうじん]たちはそれに聞[き]き入[い]っていた。"
  26: "すると突然[とつぜん]、大[おお]きな地震[じしん]が起[お]こり、牢[ろう]の土台[どだい]までもが揺[ゆ]れ動[うご]いた。すべての戸[と]がたちまち開[ひら]き、皆[みな]の枷[かせ]が緩[ゆる]んだ。"
  27: "獄吏[ごくり]は目[め]を覚[さま]し、牢[ろう]の戸[と]が開[ひら]いているのを見[み]て、囚人[しゅうじん]たちが逃[に]げたと思[おも]い、刀[かたな]を抜[ぬ]いて自[みずか]らを殺[ころ]そうとした。"
  28: "しかし、パウロは大[おお]きな声[こえ]で呼[よ]ばわった。「自分[じぶん]を傷[きず]つけてはならない。わたしたちは皆[みな]、ここにいる。」"
  29: "獄吏[ごくり]は灯[あか]りを求[もと]めて駆[か]け込[こ]み、震[ふる]えながらパウロとシラスの前[まえ]にひれ伏[ふ]した。"
  30: "そして、二人[ふたり]を外[そと]へ連[つ]れ出[だ]して言[い]った。「ご主人[しゅじん]がた、わたしは救[すく]われるために何[なに]をしなければならないのでしょうか。」"
  31: "二人[ふたり]は言[い]った。「主[しゅ]イエス〔キリスト〕を信[しん]じなさい。そうすれば、あなたもあなたの家[いえ]の者[もの]も救[すく]われる。」"
  32: "そして、主[しゅ]の御言葉[みことば]を、彼[かれ]にも、その家[いえ]にいるすべての人[ひと]にも語[かた]った。"
  33: "獄吏[ごくり]はその夜[よる]のその時[とき]、二人[ふたり]を連[つ]れて行[い]って傷[きず]を洗[あら]い、自分[じぶん]も、その家[いえ]の者[もの]たちも皆[みな]、すぐに洗礼[せんれい]を受[う]けた。"
  34: "そして、二人[ふたり]を自分[じぶん]の家[いえ]へ連[つ]れて上[のぼ]り、食卓[しょくたく]を整[ととの]えて、神[かみ]を信[しん]じたことを全[ぜん]家[か]で喜[よろこ]び合[あ]った。"
  35: "夜[よ]が明[あ]けると、長官[ちょうかん]たちは警吏[けいり]たちを遣[つか]わして、「あの人[ひと]たちを釈放[しゃくほう]せよ」と言[い]わせた。"
  36: "獄吏[ごくり]はこの言葉[ことば]をパウロに告[つ]げた。「長官[ちょうかん]たちが、あなたがたを釈放[しゃくほう]せよ、との使[つか]いを寄[よ]こしました。ですから今[いま]、出[で]て、平安[へいあん]のうちにお行[い]きください。」"
  37: "しかし、パウロは彼[かれ]らに言[い]った。「わたしたちはローマ市民[しみん]⟨ローマ市民権[しみんけん]を持[も]つ者[もの]は、むち打[う]ちや縛[しば]りつけの前[まえ]に裁判[さいばん]を受[う]ける権利[けんり]を持[も]ち、皇帝[こうてい]に上訴[じょうそ]することもできた。⟩であるのに、公然[こうぜん]と、罪[つみ]の宣告[せんこく]も受[う]けずに杖[むち]で打[う]たれ、牢[ろう]に入[い]れられた。それなのに今[いま]、ひそかにわたしたちを追[お]い出[だ]すというのか。とんでもない。長官[ちょうかん]たち自身[じしん]が来[き]て、わたしたちを連[つ]れ出[だ]すべきである。」"
  38: "警吏[けいり]たちはこの言葉[ことば]を長官[ちょうかん]たちに告[つ]げた。長官[ちょうかん]たちは、二人[ふたり]がローマ人[じん]であると聞[き]いて恐[おそ]れ、"
  39: "来[き]て二人[ふたり]に謝[あやま]り、連[つ]れ出[だ]して、この町[まち]から出[で]て行[い]ってくれるよう頼[たの]んだ。"
  40: "二人[ふたり]は牢[ろう]を出[で]て、ルデヤの家[いえ]へ行[い]った。そして兄弟[きょうだい]たちに会[あ]って励[はげ]まし、そこを立[た]ち去[さ]った。"

notes:
  1: "κατήντησεν — «прибыл, достиг»; 着いた. Тимофей — сын иудеянки, уверовавшей, и отца-эллина; у jp-joc ティモフェイ, в корпусе принято ティモテ."
  3: "περιέτεμεν αὐτόν — обрезал его ради тамошних иудеев; не ради спасения (ср. 15:1–2, Гал 2:3), а чтобы не подать повода. В критической базе текст без разночтений."
  5: "ἐστερεοῦντο — «утверждались»; 堅くされ."
  6: "κωλυθέντες ὑπὸ τοῦ ἁγίου πνεύματος — «будучи воспрепятствованы Святым Духом»; 聖霊によって妨げられた. Голос Духа — не речь Христа, не красный."
  7: "τὸ πνεῦμα Ἰησοῦ — «Дух Иисусов» (в Елизаветинской просто «Дух»); イエスの霊."
  9: "ὅραμα — «видение»; 幻. Македонянин — не ангел и не Христос, его слова не красные."
  10: "συμβιβάζοντες — «соображая, заключая»; 悟り. С этого стиха начинаются «мы»-отрывки (16:10–17; 20:5–15; 21:1–18; 27:1–28:16)."
  12: "κολωνία — римская колония; 植民市. πρώτης μερίδος τῆς Μακεδονίας πόλις — «первый город той части Македонии»; マケドニアの一地方の第一の町."
  13: "προσευχή — место молитвы (у реки, за городом), не синагога; 祈りの場所. ἐνομίζομεν — «мы полагали»; 考えていた."
  14: "πορφυρόπωλις — торговка багряницей (дорогая пурпурная ткань); 紫布の商人. σεβομένη τὸν θεόν — «чтущая Бога», то есть язычница, близкая к синагоге; 神を崇める人."
  16: "πνεῦμα πύθωνα — «дух Пифона», прорицательный (пифийский) дух; 占いの霊, без мифологического имени."
  17: "καταγγέλλουσιν ὑμῖν — «возвещают вам» (в Елизаветинской «нам»); あなたがたに. Слова беса не красные."
  18: "διαπονηθείς — «вознегодовав, тяготясь»; 煩わしく思って. ἐπιστρέψας τῷ πνεύματι — «обратившись, духу сказал»; 振り向き…霊に言った."
  19: "ἄρχοντες — городские начальники; 役人 (не στρατηγοί, ср. 16:20)."
  20: "στρατηγοί — двое высших магистратов римской колонии (дуумвиры); 長官, чтобы отличить от ἄρχοντες в 16:19."
  23: "δεσμοφύλαξ — тюремный страж; 獄吏. πολλὰς πληγάς — «много ударов»; 多くの鞭打ち."
  24: "τὸ ξύλον — колода, в которую забивали ноги; 木枷."
  31: "В критической базе Πίστευσον ἐπὶ τὸν κύριον Ἰησοῦν, без Χριστόν; церковный текст (Елизаветинская «веруй в Господа Иисуса Христа», jp-joc 主イイススハリストス) читает с Христом — 〔キリスト〕. Слова Павла и Силы, не красные."
  37: "Ῥωμαίους ὑπάρχοντας — «будучи римскими гражданами»; ローマ市民. ἀκατακρίτους — «без суда, неосуждёнными»; 罪の宣告も受けずに. Ср. дело в Филиппах и ἀπολογία Павла."
  40: "παρεκάλεσαν — «ободрили, утешили»; 励まし."
