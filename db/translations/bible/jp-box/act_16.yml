# jp-box, Деяния апостолов, глава 16. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий (gr-lxx-byz) — свидетель; расхождения — в 〔…〕 и notes.
# jp-ni не использовался.
#
# Глава 16: Тимофей (1–5), македонский муж (6–12), Лидия (13–15), служанка-прорицательница
# (16–18), темница (19–34), освобождение (35–40).
# Красного в главе нет: слова Павла и Силы (16:31), темничного стража, Лидии, бесов —
# не речь Христа. 16:31 — слова Павла и Силы, не красные.
# 〔…〕: 16:31 〔キリスト〕 — в критической базе только Ἰησοῦν; церковный текст
# (Елизаветинская «Иисуса Христа», jp-joc イイススハリストス) читает с Христом.
# 聖霊 дано калькой {聖霊[せいれい]|聖神[せいしん]} (16:6), чтобы работал переключатель.

tr_code: jp-box
