verses:
  1: "王[おう]アンティオコスは上[かみ]の地方[ちほう]を巡[めぐ]っていたが、ペルシアにエリマイスという、富[とみ]と銀[ぎん]と金[きん]で名[な]の高[たか]い町[まち]があると聞[き]いた。"
  2: "その中[なか]の神殿[しんでん]はきわめて豊[ゆた]かで、そこには金[きん]の覆[おお]い、鎧[よろい]、武器[ぶき]があった。それはフィリッポスの子[こ]、マケドニア人[じん]の王[おう]アレクサンドロスがそこに残[のこ]したもので、ギリシア人[じん]の間[あいだ]で最初[さいしょ]に王[おう]となった者[もの]である。"
  3: "彼はそこへ行[い]き、その町[まち]を取[と]って掠奪[りゃくだつ]しようと求[もと]めたが、できなかった。町[まち]の者[もの]たちにその話[はなし]が知[し]れてしまったからである。"
  4: "彼らは戦[たたか]いのために彼に立[た]ち向[む]かい、彼は逃[に]げて、大[おお]きな悲[かな]しみとともにそこを去[さ]り、バビロンへ帰[かえ]ろうとした。"
  5: "そのとき、ある者[もの]がペルシアにいる彼のもとへ来[き]て、ユダの地[ち]へ行[い]った陣[じん]が敗走[はいそう]したことを告[つ]げた。"
  6: "また、リュシアスが強[つよ]い軍勢[ぐんぜい]を率[ひき]いて先[さき]に進[すす]んだが、ユダヤ人[じん]の前[まえ]から退[しりぞ]き、彼らは武器[ぶき]と軍勢[ぐんぜい]と、打[う]ち破[やぶ]った陣[じん]から取[と]った多[おお]くの戦利品[せんりひん]によって力[ちから]を増[ま]したこと、"
  7: "また、彼らがエルサレムの祭壇[さいだん]の上[うえ]に建[た]てた忌[い]まわしいものを壊[こわ]し、聖所[せいしょ]を前[まえ]のように高[たか]い城壁[じょうへき]で囲[かこ]み、ベテズルという町[まち]をも囲[かこ]んだことを告[つ]げた。"
  8: "王[おう]はこれらの言葉[ことば]を聞[き]くと、驚[おどろ]き、ひどく動揺[どうよう]して床[とこ]に伏[ふ]し、悲[かな]しみのゆえに病[やまい]に陥[おちい]った。自分[じぶん]の思[おも]い描[えが]いていたとおりにならなかったからである。"
  9: "彼はそこに幾日[いくにち]もとどまった。大[おお]きな悲[かな]しみが彼の上[うえ]に新[あら]たになり、自分[じぶん]が死[し]ぬのだと思[おも]ったからである。"
  10: "彼は自分[じぶん]の友[とも]たちを皆[みな]呼[よ]び寄[よ]せて言[い]った。「眠[ねむ]りがわたしの目[め]から遠[とお]ざかり、わたしは心配[しんぱい]のゆえに心[こころ]が打[う]ちひしがれている。"
  11: "わたしは心[こころ]の中[なか]で言[い]った。『どれほどの苦[くる]しみと大[おお]きな波[なみ]の中[なか]に、わたしは今[いま]いるのか』と。かつてわたしは自分[じぶん]の権力[けんりょく]の中[なか]で善[よ]き者[もの]、愛[あい]される者[もの]であった。"
  12: "しかし今[いま]、わたしはエルサレムで行[おこな]った悪[あく]のことを思[おも]い起[おこ]す。すなわち、そこにある銀[ぎん]と金[きん]の器[うつわ]をすべて取[と]り、ユダに住[す]む者[もの]たちをむだに根[ね]こそぎ除[のぞ]こうと遣[つか]わしたことである。"
  13: "これらのゆえに、この災[わざわ]いがわたしを襲[おそ]ったのだと知[し]った。見[み]よ、わたしは他[た]の国[くに]で大[おお]きな悲[かな]しみのうちに滅[ほろ]びようとしている。」"
  14: "彼は自分[じぶん]の友[とも]の一人[ひとり]であるフィリッポスを呼[よ]び、自分[じぶん]の全[ぜん]王国[おうこく]の上[うえ]に立[た]て、"
  15: "王冠[おうかん]と自分[じぶん]の衣[ころも]と指輪[ゆびわ]を与[あた]え、その子[こ]アンティオコスを導[みちび]いて王[おう]として治[おさ]めるために養育[よういく]するよう命[めい]じた。"
  16: "そして、王[おう]アンティオコスはそこで第[だい]百四十九[ひゃくよんじゅうきゅう]年[ねん]に死[し]んだ。"
  17: "リュシアスは王[おう]が死[し]んだことを知[し]ると、まだ幼[おさな]い時[とき]から自分[じぶん]が育てたその子[こ]アンティオコスを王[おう]として立[た]て、その名[な]をエウパトルと呼[よ]んだ。"
  18: "アクラの者[もの]たちは、聖所[せいしょ]の周[まわ]りでイスラエルを閉[と]じ込[こ]め、いつも彼らに災[わざわ]いを求[もと]め、異邦人[いほうじん]の支[ささ]えとなっていた。"
  19: "ユダは彼らを追[お]い出[だ]そうと決[けっ]め、全会衆[ぜんかいしゅう]を呼[よ]び集[あつ]めて彼らを包囲[ほうい]した。"
  20: "彼らはともに集[あつ]まって第[だい]百五十[ひゃくごじゅう]年[ねん]にアクラを包囲[ほうい]し、矢[や]を射[い]る装置[そうち]と機械[きかい]を造[つく]った。"
  21: "しかし、包囲[ほうい]された者[もの]のうち幾人[いくにん]かが抜[ぬ]け出[だ]し、イスラエルから出[で]た不敬[ふけい]な者[もの]たちが彼らに加[くわ]わった。"
  22: "彼らは王[おう]のもとへ行[い]って言[い]った。「いつまであなたは裁[さば]きを行[おこな]わず、わたしたちの兄弟[きょうだい]たちの復讐[ふくしゅう]をしないのか。"
  23: "わたしたちはあなたの父[ちち]に仕[つか]え、その言[い]われたことに従[したが]い、その定[さだ]めに従[したが]うことを喜[よろこ]んでいた。"
  24: "ところが、わたしたちの民[たみ]の子[こ]らがこのゆえにアクラを包囲[ほうい]し、わたしたちから離[はな]れている。しかも、わたしたちのうち見[み]つかった者[もの]は殺[ころ]され、わたしたちの嗣業[しぎょう]は奪[うば]われている。"
  25: "彼らはわたしたちにだけ手[て]を伸[の]ばしたのではなく、そのすべての領地[りょうち]にも伸[の]ばした。"
  26: "そして見[み]よ、彼らは今日[きょう]、エルサレムのアクラを取[と]ろうとして陣[じん]を敷[し]き、聖所[せいしょ]とベテズルを堅[かた]めたのだ。"
  27: "もしあなたが急[いそ]いで彼らを先[さき]に制[せい]さなければ、彼らはこれより大[おお]きなことをするだろう。あなたはもはや彼らを押[お]さえられなくなる。」"
  28: "王[おう]はこれを聞[き]いて怒[いか]り、自分[じぶん]の友[とも]たち、軍[ぐん]の長[おさ]たち、そして騎兵[きへい]の指揮[しき]官[かん]たちを皆[みな]集[あつ]めた。"
  29: "また、ほかの王国[おうこく]からも、海[うみ]の島[しま]々[じま]からも、傭兵[ようへい]の軍勢[ぐんぜい]が彼のもとへ来[き]た。"
  30: "その軍勢[ぐんぜい]の数[かず]は歩兵[ほへい]十万[じゅうまん]、騎兵[きへい]二万[にまん]、そして戦[たたか]いをよく知[し]る象[ぞう]三十二頭[さんじゅうにとう]であった。"
  31: "彼らはイドマヤを通[とお]ってベテズルに陣[じん]を敷[し]き、多[おお]くの日[ひ]の間[あいだ]戦[たたか]って機械[きかい]を造[つく]った。しかし、ベテズルの者[もの]たちは出[で]て来[き]てそれらを火[ひ]で焼[や]き、雄々[おお]しく戦[たたか]った。"
  32: "ユダはアクラから去[さ]り、王[おう]の陣[じん]の前[まえ]のベテ・ザハリヤに陣[じん]を敷[し]いた。"
  33: "王[おう]は朝[あさ]早[はや]く起[お]き、その突撃[とつげき]の勢[いきお]いでベテ・ザハリヤへの道[みち]を陣[じん]とともに進[すす]んだ。軍勢[ぐんぜい]は戦[たたか]いの備[そな]えを整[ととの]え、ラッパを吹[ふ]いた。"
  34: "そして象[ぞう]たちに、戦[たたか]いへと奮[ふる]い立[た]たせるために、ぶどうの血[ち]と桑[くわ]の実[み]を見[み]せた。"
  35: "彼らはその獣[けもの]を部隊[ぶたい]に分[わ]け、おのおのの象[ぞう]に鎖[くさり]の鎧[よろい]を着[き]、頭[あたま]に青銅[せいどう]の兜[かぶと]をかぶった千[せん]人[にん]の者[もの]を付[つ]け、さらに各[かく]の獣[けもの]に精鋭[せいえい]の騎兵[きへい]五百[ごひゃく]を配[はい]した。"
  36: "これらの者[もの]たちは獣[けもの]のいる所[ところ]に先[さき]回[まわ]りして待[ま]ち、獣[けもの]が進[すす]む所[ところ]へはともに進[すす]み、決[けっ]してそれから離[はな]れなかった。"
  37: "また、各[かく]の獣[けもの]の上[うえ]には、それを覆[おお]う堅固[けんご]な木造[もくぞう]の塔[とう]が機械[きかい]でしつらえてあり、その中[なか]には戦[たたか]う力[ちから]ある者[もの]が四人[よにん]、そしてその象[ぞう]のインド人[じん]の御者[ぎょしゃ]がいた。"
  38: "残[のこ]りの騎兵[きへい]は陣[じん]の両側[りょうがわ]の二[ふた]つの部分[ぶぶん]にここかしこに置[お]き、隊列[たいれつ]の中[なか]で合図[あいず]を送[おく]り、備[そな]えを固[かた]めさせた。"
  39: "日[ひ]が金[きん]と青銅[せいどう]の盾[たて]に照[て]ると、山[やま]々[やま]はそれに照[て]り返[かえ]し、火[ひ]のともしびのように輝[かがや]いた。"
  40: "王[おう]の陣[じん]の一部[いちぶ]は高[たか]い山[やま]に、またある者[もの]たちは低[ひく]い所[ところ]に広[ひろ]がり、彼らは確[たし]かに、整然[せいぜん]と進[すす]んだ。"
  41: "彼らの群[む]れの声[こえ]と、その大[おお]軍[ぐん]の行[ゆ]き交[か]い、武具[ぶぐ]のぶつかり合[あ]う音[おと]を聞[き]く者[もの]は皆[みな]、震[ふる]えた。陣[じん]はきわめて大[おお]きく強[つよ]かったからである。"
  42: "ユダとその陣[じん]は戦列[せんれつ]を整[ととの]えて近[ちか]づき、王[おう]の陣[じん]から六百[ろっぴゃく]人[にん]が倒[たお]れた。"
  43: "エレアザル（アバランの子[こ]）は、王[おう]の鎧[よろい]で覆[おお]われ、すべての獣[けもの]より抜[ぬ]きんでている一頭[いっとう]の象[ぞう]を見[み]て、その上[うえ]に王[おう]がいると思[おも]った。"
  44: "彼は自分[じぶん]の民[たみ]を救[すく]い、永遠[えいえん]の名[な]を自分[じぶん]のために得[え]ようとして、自分[じぶん]を差[さ]し出[だ]し、"
  45: "大胆[だいたん]にその象[ぞう]へ駆[か]け寄[よ]って部隊[ぶたい]の中[なか]へ入[はい]り、右[みぎ]左[ひだり]を殺[ころ]した。彼らは彼[かれ]から裂[さ]けてここかしこへ分[わ]かれた。"
  46: "彼は象[ぞう]の下[した]に潜[もぐ]り込み、その下[した]に身[み]を置[お]いてこれを殺[ころ]した。象[ぞう]は彼の上[うえ]に地[ち]へ倒[たお]れ、彼はそこで死[し]んだ。"
  47: "しかし、ユダヤ人[じん]たちは王国[おうこく]の力[ちから]と軍勢[ぐんぜい]の突撃[とつげき]を見[み]て、彼らから退[しりぞ]いた。"
  48: "王[おう]の陣[じん]の者[もの]たちはエルサレムへ彼らを迎[むか]えに上[のぼ]り、王[おう]はユダヤとシオンの山[やま]に陣[じん]を敷[し]いた。"
  49: "彼はベテズルの者[もの]たちと和[わ]を結[むす]んだ。彼らは町[まち]から出[で]て来[き]た。包囲[ほうい]されて町[まち]の中[なか]にとどまる食[た]べ物[もの]が彼らになかったからである。地[ち]には安息年[あんそくねん]が来[き]ていた。"
  50: "王[おう]はベテズルを取[と]り、そこに守備[しゅび]の者[もの]を置[お]いてこれを守[まも]らせた。"
  51: "そして彼は聖所[せいしょ]を多[おお]くの日[ひ]の間[あいだ]包囲[ほうい]し、そこに矢[や]を射[い]る装置[そうち]と機械[きかい]、火[ひ]を放[はな]つ兵器[へいき]、石[いし]を放[はな]つ兵器[へいき]、蠍[さそり]（弩[いしゆみ]）を据[す]えて、矢[や]と投[な]げ石[いし]を放[はな]たせた。"
  52: "彼らもまた、相手[あいて]の機械[きかい]に対[たい]して機械[きかい]を造[つく]り、多[おお]くの日[ひ]の間[あいだ]戦[たたか]った。"
  53: "しかし、第七[だいしち]年[ねん]であったため、蔵[くら]に食[た]べ物[もの]がなかった。また、異邦人[いほうじん]から逃[に]げてユダヤに来[き]た者[もの]たちが、蓄[たくわ]えの残[のこ]りを食[た]べ尽[つ]くした。"
  54: "聖所[せいしょ]に残[のこ]った者[もの]は少[すく]なかった。飢[う]えが彼らをとらえたからであり、彼らはおのおの自分[じぶん]の場所[ばしょ]へ散[ち]って行[い]った。"
  55: "リュシアスは、王[おう]アンティオコスがまだ生[い]きているうちに、その子[こ]アンティオコスを王[おう]として治[おさ]めさせるために養育[よういく]を任[まか]せたフィリッポスが、"
  56: "ペルシアとメディアから、また王[おう]とともに出[で]て行[い]った軍勢[ぐんぜい]とともに帰[かえ]って来[き]て、政務[せいむ]を引[ひ]き継[つ]ごうとしていることを聞[き]いた。"
  57: "そこで彼は急[いそ]いでアクラから去[さ]ろうと決[けっ]め、王[おう]、軍[ぐん]の長[おさ]たち、そして兵[へい]たちに言[い]った。「わたしたちは日[ひ]ごとに弱[よわ]り、食[た]べ物[もの]も少[すく]なく、包囲[ほうい]している場所[ばしょ]は堅固[けんご]である。しかも王国[おうこく]の務[つと]めがわたしたちに迫[せま]っている。"
  58: "それゆえ今[いま]、この者[もの]たちに右手[みぎて]を与[あた]え、彼らおよびそのすべての民[たみ]と和[わ]を結[むす]ぼうではないか。"
  59: "そして彼らが前[まえ]のように自分[じぶん]の定[さだ]めに従[したが]って歩[あゆ]むことを認[みと]めよう。彼らが怒[いか]ったのも、すべてこれを行[おこな]ったのも、わたしたちが打[う]ち壊[こわ]した彼らの定[さだ]めのゆえなのだから。」"
  60: "この言葉[ことば]は王[おう]と長[おさ]たちの前[まえ]で良[よ]いと認[みと]められ、彼は和[わ]を結[むす]ぶために彼らのもとへ使者[ししゃ]を送[おく]り、彼らはこれを受[う]け入[い]れた。"
  61: "王[おう]と長[おさ]たちは彼らに誓[ちか]った。これによって彼らは要害[ようがい]から出[で]て来[き]た。"
  62: "王[おう]はシオンの山[やま]に上[のぼ]り、その場所[ばしょ]の要害[ようがい]を見[み]て、自分[じぶん]が誓[ちか]った誓[ちか]いを破[やぶ]り、周[まわ]りの城壁[じょうへき]を壊[こわ]すように命[めい]じた。"
  63: "そして急[いそ]いで去[さ]り、アンティオキアへ帰[かえ]った。彼はフィリッポスがその町[まち]を支配[しはい]しているのを見[み]つけ、彼と戦[たたか]って力[ちから]ずくでその町[まち]を取[と]った。"

notes:
  1: "διεπορεύετο τὰς ἐπάνω χώρας — «проходил верхние страны»; Ἐλυμαὶς ἐν τῇ Περσίδι πόλις ἔνδοξος πλούτῳ — «Елимаис в Персиде, город славный богатством» (エリマイス; слав. «елимаис»); ἀργυρίῳ καὶ χρυσίῳ — «серебром и золотом»."
  2: "τὸ ἱερὸν τὸ ἐν αὐτῇ πλούσιον σφόδρα — «храм в нём весьма богатый»; καλύμματα χρυσᾶ — «покровы золотые» (κάλυμμα — 覆[おお]い); θώρακες καὶ ὅπλα — «брони и оружия»; ἃ κατέλιπεν ἐκεῖ Ἀλέξανδρος ὁ τοῦ Φιλίππου — «которые оставил там Александр, сын Филиппа»; ὃς ἐβασίλευσεν πρῶτος ἐν τοῖς Ἕλλησι — «который царствовал первым у Еллинов»."
  3: "ἐζήτει καταλαβέσθαι τὴν πόλιν καὶ προνομεῦσαι αὐτήν — «искал взять город и разграбить его» (προνομεύω); οὐκ ἠδυνάσθη — «не смог»; ἐγνώσθη ὁ λόγος τοῖς ἐκ τῆς πόλεως — «стало известно слово (замысел) бывшим в городе»."
  4: "ἀντέστησαν αὐτῷ εἰς πόλεμον — «восстали против него на войну» (ἀνθίστημι); ἔφυγεν καὶ ἀπῆρεν ἐκεῖθεν — «убежал и отправился оттуда»; μετὰ λύπης μεγάλης — «с великою печалью» (λύπη); ἀποστρέψαι εἰς Βαβυλῶνα — «чтобы возвратиться в Вавилон» (バビロン)."
  5: "ἦλθέν τις ἀπαγγέλλων αὐτῷ — «пришёл некто, возвещая ему»; τετρόπωνται αἱ παρεμβολαὶ αἱ πορευθεῖσαι εἰς γῆν Ιουδα — «обращены в бегство станы, ходившие в землю Иуды» (τροπόω)."
  6: "ἐπορεύθη Λυσίας δυνάμει ἰσχυρᾷ ἐν πρώτοις — «пошёл Лисий с силою крепкою в первых (впереди)»; ἐνετράπη ἀπὸ προσώπου αὐτῶν — «обращён в бегство от лица их»; ἐπίσχυσαν ὅπλοις καὶ δυνάμει — «усилились оружием и силою» (ἐπισχύω); οἷς ἔλαβον ἀπὸ τῶν παρεμβολῶν, ὧν ἐξέκοψαν — «которые взяли из станов, которые истребили» (ἐκκόπτω)."
  7: "καθεῖλον τὸ βδέλυγμα — «низвергли мерзость» (βδέλυγμα — 忌[い]まわしいもの); ὃ ᾠκοδόμησεν ἐπὶ τὸ θυσιαστήριον — «которую построил на жертвеннике»; ἐκύκλωσαν τείχεσιν ὑψηλοῖς — «обнесли стенами высокими» (κυκλόω); τὴν Βαιθσουραν πόλιν αὐτοῦ — «Вефсуру, город его» (ベテズル)."
  8: "ἐθαμβήθη καὶ ἐσαλεύθη σφόδρα — «изумился и потрясён был весьма» (θαμβέομαι; σαλεύω); ἔπεσεν ἐπὶ τὴν κοίτην — «пал на ложе»; ἐνέπεσεν εἰς ἀρρωστίαν — «впал в болезнь» (ἀρρωστία); οὐκ ἐγένετο αὐτῷ καθὼς ἐνεθυμεῖτο — «не произошло с ним, как он замышлял» (ἐνθυμέομαι)."
  9: "ἦν ἐκεῖ ἡμέρας πλείους — «был там дней больше (много дней)»; ἀνεκαινίσθη ἐπ' αὐτὸν λύπη μεγάλη — «обновилась на нём печаль великая»; ἐλογίσατο ὅτι ἀποθνῄσκει — «помыслил, что умирает»."
  10: "Ἀφίσταται ὁ ὕπνος ἀπὸ τῶν ὀφθαλμῶν μου — «отступает сон от глаз моих» (ἀφίστημι); συμπέπτωκα τῇ καρδίᾳ ἀπὸ τῆς μερίμνης — «я пал (изнемог) сердцем от заботы» (μερίμνα — 心配[しんぱい]). Речь Антиоха — 「…」 до 13."
  11: "Ἕως τίνος θλίψεως ἦλθα καὶ κλύδωνος μεγάλου — «до какой скорби дошёл я и великого волнения» (κλύδων — 波[なみ]); χρηστὸς καὶ ἀγαπώμενος ἤμην ἐν τῇ ἐξουσίᾳ μου — «я был добр (полезен) и любим во власти моей»."
  12: "μιμνῄσκομαι τῶν κακῶν, ὧν ἐποίησα — «вспоминаю злодеяния, которые сделал» (μιμνῄσκομαι); τὰ σκεύη τὰ ἀργυρᾶ καὶ τὰ χρυσᾶ — «сосуды серебряные и золотые»; ἐξαπέστειλα ἐξᾶραι τοὺς κατοικοῦντας Ιουδα διὰ κενῆς — «послал истребить живущих в Иудее напрасно» (διὰ κενῆς — むだに)."
  13: "χάριν τούτων εὗρέν με τὰ κακὰ ταῦτα — «за это постигли меня эти беды» (χάριν — ради); ἀπόλλυμαι λύπῃ μεγάλῃ — «погибаю от великой печали»; ἐν γῇ ἀλλοτρίᾳ — «в земле чужой». Здесь речь закрывается."
  14: "ἐκάλεσεν Φίλιππον ἕνα τῶν φίλων αὐτοῦ — «призвал Филиппа, одного из друзей своих» (フィリッポス); κατέστησεν αὐτὸν ἐπὶ πάσης τῆς βασιλείας — «поставил его над всем царством»."
  15: "τὸ διάδημα καὶ τὴν στολὴν καὶ τὸν δακτύλιον — «венец, одежду и перстень» (διάδημα — 王冠[おうかん]; στολή — 衣[ころも]; δακτύλιος — 指輪[ゆびわ]); τοῦ ἀγαγεῖν Ἀντίοχον τὸν υἱὸν αὐτοῦ — «чтобы вести (воспитывать) Антиоха, сына его»; ἐκθρέψαι… τοῦ βασιλεύειν — «вскормить… чтобы царствовать»."
  16: "ἀπέθανεν ἐκεῖ Ἀντίοχος ὁ βασιλεύς — «умер там Антиох царь»; ἔτους ἐνάτου καὶ τεσσαρακοστοῦ καὶ ἑκατοστοῦ — «года сто сорок девятого» (149 г.)."
  17: "ἐπέγνω Λυσίας ὅτι τέθνηκεν ὁ βασιλεύς — «узнал Лисий, что умер царь»; κατέστησεν βασιλεύειν Ἀντίοχον τὸν υἱὸν αὐτοῦ — «поставил царствовать Антиоха, сына его»; ὃν ἐξέθρεψεν νεώτερον — «которого вскормил юным»; ἐκάλεσεν τὸ ὄνομα αὐτοῦ Εὐπάτωρ — «нарек имя ему Евпатор» (エウパトル)."
  18: "οἱ ἐκ τῆς ἄκρας — «бывшие из акры»; συγκλείοντες τὸν Ισραηλ κύκλῳ τῶν ἁγίων — «заключающие Израиля вокруг святынь» (συγκλείω); ζητοῦντες κακὰ δι' ὅλου — «ищущие зла всегда»; στήριγμα τοῖς ἔθνεσιν — «опора (подкрепление) язычникам» (στήριγμα)."
  19: "ἐλογίσατο… ἐξᾶραι αὐτούς — «решил истребить их»; ἐξεκκλησίασε πάντα τὸν λαόν — «созвал весь народ» (ἐκκλησιάζω); τοῦ περικαθίσαι ἐπ' αὐτούς — «чтобы обложить (осадить) их» (περικαθίζω)."
  20: "συνήχθησαν ἅμα — «собрались вместе»; περιεκάθισαν ἐπ' αὐτήν — «обложили её»; ἔτους πεντηκοστοῦ καὶ ἑκατοστοῦ — «года сто пятидесятого» (150 г.); βελοστάσεις — «стреломётные орудия» (βελοστάσις); μηχανάς — «машины» (μηχανή)."
  21: "ἐξῆλθον ἐξ αὐτῶν ἐκ τοῦ συγκλεισμοῦ — «вышли из них из заключения (осады)» (συγκλεισμός); ἐκολλήθησαν αὐτοῖς τινες τῶν ἀσεβῶν ἐξ Ισραηλ — «прилепились к ним некоторые из нечестивых Израиля» (κολλάω)."
  22: "Ἕως πότε οὐ ποιήσῃ κρίσιν — «доколе не сотворишь суда»; ἐκδικήσεις τοὺς ἀδελφοὺς ἡμῶν — «отмстишь за братьев наших» (ἐκδικέω). Речь отступников — 「…」 до 27."
  23: "εὐδοκοῦμεν δουλεύειν τῷ πατρί σου — «мы благоволим служить отцу твоему» (εὐδοκέω); πορεύεσθαι τοῖς ὑπ' αὐτοῦ λεγομένοις — «ходить по сказанному им»; κατακολουθεῖν τοῖς προστάγμασιν — «следовать повелениям» (κατακολουθέω)."
  24: "περιεκάθηντο ἐπ' αὐτήν — «обложили её»; οἱ υἱοὶ τοῦ λαοῦ ἡμῶν — «сыны народа нашего»; χάριν τούτου — «по этой причине»; ἠλλοτριοῦντο ἀφ' ἡμῶν — «отчуждаются от нас» (ἀλλοτριόω); αἱ κληρονομίαι ἡμῶν διηρπάζοντο — «наследия наши расхищались» (διαρπάζω)."
  25: "οὐκ ἐφ' ἡμᾶς μόνον ἐξέτειναν χεῖρα — «не на нас только простёрли руку» (ἐκτείνω); ἐπὶ πάντα τὰ ὅρια αὐτῶν — «на все пределы их». В слав. «нашя» (наши) — иное местоимение, смысл тот же; в тексте по LXX そのすべての領地[りょうち]."
  26: "παρεμβεβλήκασι σήμερον ἐπὶ τὴν ἄκραν — «расположились сегодня против акры» (παρεμβάλλω); τοῦ καταλαβέσθαι αὐτήν — «чтобы взять её»; ὠχύρωσαν — «укрепили» (ὀχυρόω)."
  27: "ἐὰν μὴ προκαταλάβῃ αὐτοὺς διὰ τάχους — «если не предупредишь их скоро» (προκαταλαμβάνω; διὰ τάχους — 急[いそ]いで); μείζονα τούτων ποιήσουσιν — «сделают больше этого»; οὐ δυνήσῃ τοῦ κατασχεῖν αὐτῶν — «не сможешь удержать их» (κατέχω). Здесь речь закрывается."
  28: "ὠργίσθη ὁ βασιλεύς — «разгневался царь»; συνήγαγεν πάντας τοὺς φίλους — «собрал всех друзей»; ἄρχοντας δυνάμεως — «начальников силы»; τοὺς ἐπὶ τῶν ἡνιῶν — «бывших при вожжах», т. е. начальников конницы (ἡνία — 手綱[たづな])."
  29: "ἀπὸ βασιλειῶν ἑτέρων — «из иных царств»; ἀπὸ νήσων θαλασσῶν — «с морских островов» (νῆσος — 島[しま]); δυνάμεις μισθωταί — «силы наёмные» (μισθωτός — 傭兵[ようへい])."
  30: "ἑκατὸν χιλιάδες πεζῶν — «сто тысяч пеших» (πεζός — 歩兵[ほへい]); εἴκοσι χιλιάδες ἱππέων — «двадцать тысяч всадников»; ἐλέφαντες δύο καὶ τριάκοντα — «слонов тридцать два»; εἰδότες πόλεμον — «знающие войну»."
  31: "παρενέβαλον ἐπὶ Βαιθσουραν — «расположились против Вефсуры»; ἐπολέμησαν ἡμέρας πολλάς — «воевали многие дни»; ἐποίησαν μηχανάς — «сделали машины»; ἐξῆλθον καὶ ἐνεπύρισαν αὐτὰς πυρί — «вышли и сожгли их огнём»; ἐπολέμησαν ἀνδρωδῶς — «воевали мужественно» (ἀνδρωδῶς — 雄々[おお]しく)."
  32: "ἀπῆρεν Ιουδας ἀπὸ τῆς ἄκρας — «отправился Иуда от акры»; παρενέβαλεν εἰς Βαιθζαχαρια — «расположился в Вефзахарии» (ベテ・ザハリヤ); ἀπέναντι τῆς παρεμβολῆς τοῦ βασιλέως — «напротив стана царя»."
  33: "ὤρθρισεν… τὸ πρωΐ — «встал рано утром»; ἀπῆρεν τὴν παρεμβολὴν ἐν ὁρμήματι αὐτῆς — «двинул стан в его устремлении» (ὅρμημα — 突撃[とつげき]); διεσκευάσθησαν αἱ δυνάμεις εἰς τὸν πόλεμον — «приготовились силы к войне» (διασκευάζω); ἐσάλπισαν ταῖς σάλπιγξιν — «вострубили трубами»."
  34: "ἔδειξαν αἷμα σταφυλῆς καὶ μόρων — «показали кровь винограда и тутовых ягод» (μόρον — 桑[くわ]の実[み]); τοῦ παραστῆσαι αὐτοὺς εἰς τὸν πόλεμον — «чтобы возбудить (поставить) их на войну» (παρίστημι)."
  35: "διεῖλον τὰ θηρία εἰς τὰς φάλαγγας — «разделили зверей по отрядам (фалангам)» (φάλαγξ); ἑκάστῳ ἐλέφαντι χιλίους ἄνδρας τεθωρακισμένους ἐν ἁλυσιδωτοῖς — «каждому слону тысячу мужей, облачённых в кольчужные брони» (ἁλυσιδωτός — 鎖[くさり]の鎧[よろい]); περικεφαλαῖαι χαλκαῖ — «шлемы медные» (περικεφαλαία — 兜[かぶと]); πεντακόσια ἵππος — «пятьсот конницы»."
  36: "πρὸ καιροῦ οὗ ἂν ᾖ τὸ θηρίον — «прежде времени, (там) где будет зверь»; οὐκ ἀφίσταντο ἀπ' αὐτοῦ — «не отступали от него» (ἀφίστημι)."
  37: "πύργοι ξύλινοι ἐπ' αὐτοὺς ὀχυροὶ σκεπαζόμενοι — «башни деревянные на них, крепкие, покрывающие» (σκεπάζω); ἐζωσμένοι… μηχαναῖς — «препоясанные (скреплённые) машинами»; ἐφ' ἑκάστου ἄνδρες δυνάμεως τέσσαρες — «на каждом по четыре мужа силы» (τέσσαρες — четверо); ὁ Ἰνδὸς αὐτοῦ — «его индиец (вожатый)». Слав. «тридесять два» — очевидная порча (ср. 32 слона в 6:30); держим LXX 四人[よにん], отмечено."
  38: "τὴν ἐπίλοιπον ἵππον — «остальную конницу»; ἔνθεν καὶ ἔνθεν — «сюда и туда»; ἐπὶ τὰ δύο μέρη τῆς παρεμβολῆς — «на две части стана»; κατασείοντες — «подавая знаки (потрясая)» (κατασείω); καταφρασσόμενοι ἐν ταῖς φάλαγξιν — «заграждая (укрепляя) в отрядах» (καταφράσσω)."
  39: "ἔστιλβεν ὁ ἥλιος ἐπὶ τὰς χρυσᾶς καὶ χαλκᾶς ἀσπίδας — «блистало солнце на щитах золотых и медных» (στίλβω); κατηύγαζεν ὡς λαμπάδες πυρός — «озаряло, как светильники огня» (καταυγάζω)."
  40: "ἐξετάθη μέρος τι τῆς παρεμβολῆς — «протянулась некая часть стана» (ἐκτείνω); ἐπὶ τὰ ὑψηλὰ ὄρη — «по высоким горам»; ἐπὶ τὰ ταπεινά — «по низким (местам)»; ἀσφαλῶς καὶ τεταγμένως — «безопасно (твёрдо) и стройно» (τεταγμένως — 整然[せいぜん]と)."
  41: "ἐσαλεύοντο πάντες οἱ ἀκούοντες — «поколебались все слышащие»; φωνῆς πλήθους — «голоса множества»; ὁδοιπορίας τοῦ πλήθους — «шествия множества» (ὁδοιπορία); συγκρουσμοῦ τῶν ὅπλων — «стука (столкновения) оружий» (συγκρουσμός)."
  42: "ἤγγισεν… εἰς παράταξιν — «приблизился… к построению (бою)»; ἔπεσον ἀπὸ τῆς παρεμβολῆς τοῦ βασιλέως ἑξακόσιοι ἄνδρες — «пали из стана царя шестьсот мужей»."
  43: "Ελεαζαρος ὁ Αυαραν — «Елеазар, (сын) Аварана» (エレアザル; слав. «сын саварань» — иная форма имени); τεθωρακισμένον θώραξιν βασιλικοῖς — «облачённого в брони царские»; ὑπερᾶγον πάντα τὰ θηρία — «превосходящего всех зверей» (ὑπεράγω); ᾠήθη ὅτι ἐν αὐτῷ ἐστιν ὁ βασιλεύς — «помыслил, что на нём царь» (οἴομαι)."
  44: "ἔδωκεν ἑαυτὸν τοῦ σῶσαι τὸν λαὸν αὐτοῦ — «отдал себя, чтобы спасти народ свой»; περιποιῆσαι ἑαυτῷ ὄνομα αἰώνιον — «приобрести себе имя вечное» (περιποιέω)."
  45: "ἐπέδραμεν αὐτῷ θράσει — «устремился на него с дерзостью» (ἐπιτρέχω; θράσος — 大胆[だいたん]さ); ἐθανάτου δεξιὰ καὶ εὐώνυμα — «умерщвлял направо и налево» (εὐώνυμος — левый); ἐσχίζοντο ἀπ' αὐτοῦ ἔνθα καὶ ἔνθα — «раскрывались (расступались) от него туда и сюда» (σχίζω)."
  46: "εἰσέδυ ὑπὸ τὸν ἐλέφαντα — «подлез под слона» (εἰσδύω); ὑπέθηκεν αὐτῷ — «подложился под него» (ὑποτίθημι); ἀνεῖλεν αὐτόν — «убил его» (ἀναιρέω); ἔπεσεν ἐπὶ τὴν γῆν ἐπάνω αὐτοῦ — «упал на землю на него»."
  47: "εἶδον τὴν ἰσχὺν τῆς βασιλείας — «увидели силу царства»; τὸ ὅρμημα τῶν δυνάμεων — «устремление войск»; ἐξέκλιναν ἀπ' αὐτῶν — «уклонились от них» (ἐκκλίνω)."
  48: "οἱ ἐκ τῆς παρεμβολῆς τοῦ βασιλέως — «бывшие из стана царя»; ἀνέβαινον εἰς συνάντησιν αὐτῶν εἰς Ιερουσαλημ — «поднимались навстречу им в Иерусалим»; παρενέβαλεν… εἰς τὸ ὄρος Σιων — «расположился станом… на горе Сион»."
  49: "ἐποίησεν εἰρήνην μετὰ τῶν ἐκ Βαιθσουρων — «заключил мир с бывшими в Вефсуре»; οὐκ ἦν αὐτοῖς ἐκεῖ διατροφή — «не было у них там пропитания» (διατροφή); τοῦ συγκλεισθῆναι ἐν αὐτῇ — «чтобы держаться в осаде в нём»; σάββατον ἦν τῇ γῇ — «суббота (субботний год) была земле» (安息年[あんそくねん])."
  50: "κατελάβετο… τὴν Βαιθσουραν — «овладел Вефсурой»; ἀπέταξεν ἐκεῖ φρουρὰν τηρεῖν αὐτήν — «оставил там стражу охранять её» (φρουρά — 守備[しゅび])."
  51: "παρενέβαλεν ἐπὶ τὸ ἁγίασμα ἡμέρας πολλάς — «расположился против святилища на многие дни»; βελοστάσεις — «стреломёты»; μηχανάς — «машины»; πυροβόλα καὶ λιθοβόλα — «огнемёты и камнемёты» (πυροβόλον, λιθοβόλον); σκορπίδια — «скорпионы (малые баллисты)» (σκορπίδιον); εἰς τὸ βάλλεσθαι βέλη καὶ σφενδόνας — «чтобы метать стрелы и пращные камни» (σφενδόνη — 投[な]げ石[いし])."
  52: "ἐποίησαν καὶ αὐτοὶ μηχανὰς πρὸς τὰς μηχανὰς αὐτῶν — «сделали и они машины против их машин»; ἐπολέμησαν ἡμέρας πολλάς — «воевали многие дни»."
  53: "βρώματα δὲ οὐκ ἦν ἐν τοῖς ἀγγείοις — «снедей не было в сосудах (хранилищах)» (ἀγγεῖον); διὰ τὸ ἕβδομον ἔτος εἶναι — «потому что был седьмой год» (субботний); οἱ ἀνασῳζόμενοι — «спасающиеся (укрывшиеся)» (ἀνασῴζω); τὸ ὑπόλειμμα τῆς παραθέσεως — «остаток запаса» (παράθεσις)."
  54: "ὑπελείφθησαν… ἄνδρες ὀλίγοι — «осталось… мужей немного» (ὑπολείπω); κατεκράτησεν αὐτῶν ὁ λιμός — «одолел их голод» (κατακρατέω); ἐσκορπίσθησαν ἕκαστος εἰς τὸν τόπον αὐτοῦ — «рассеялись каждый в место своё» (σκορπίζω)."
  55: "ὃν κατέστησεν… ἐκθρέψαι Ἀντίοχον τὸν υἱὸν αὐτοῦ — «которого поставил… вскормить Антиоха, сына его»; ἔτι ζῶντος αὐτοῦ — «ещё при жизни его»; εἰς τὸ βασιλεῦσαι αὐτόν — «чтобы он царствовал»."
  56: "ἀπέστρεψεν ἀπὸ τῆς Περσίδος καὶ Μηδίας — «возвратился из Персиды и Мидии» (メディア); αἱ δυνάμεις αἱ πορευθεῖσαι μετὰ τοῦ βασιλέως — «силы, ходившие с царём»; ζητεῖ παραλαβεῖν τὰ τῶν πραγμάτων — «ищет принять (взять) дела (правление)» (παραλαμβάνω)."
  57: "κατέσπευδεν — «спешил» (κατασπεύδω); ἐπένευσεν τοῦ ἀπελθεῖν — «склонился (решил) уйти» (ἐπινεύω); Ἐκλείπομεν καθ' ἡμέραν — «оскудеваем каждый день» (ἐκλείπω); ὁ τόπος… ἐστιν ὀχυρός — «место… крепко»; ἐπίκειται ἡμῖν τὰ τῆς βασιλείας — «лежит на нас (забота) о царстве» (ἐπίκειμαι). Речь Лисия — 「…」 до 59."
  58: "δῶμεν δεξιάς — «дадим правые руки (заключим мир)»; ποιήσωμεν μετ' αὐτῶν εἰρήνην — «сотворим с ними мир»; μετὰ παντὸς ἔθνους αὐτῶν — «со всем народом их»."
  59: "στήσωμεν αὐτοῖς τοῦ πορεύεσθαι τοῖς νομίμοις αὐτῶν — «постановим им ходить по уставам их» (ἵστημι); ὡς τὸ πρότερον — «как прежде»; χάριν γὰρ τῶν νομίμων αὐτῶν, ὧν διεσκεδάσαμεν — «ибо ради уставов их, которые мы рассеяли (отменили)» (διασκεδάζω)."
  60: "ἤρεσεν ὁ λόγος ἐναντίον τοῦ βασιλέως — «угодно было слово пред царём» (ἀρέσκω); ἀπέστειλεν πρὸς αὐτοὺς εἰρηνεῦσαι — «послал к ним заключить мир» (εἰρηνεύω); ἐπεδέξαντο — «приняли» (ἐπιδέχομαι)."
  61: "ὤμοσεν αὐτοῖς ὁ βασιλεὺς καὶ οἱ ἄρχοντες — «поклялись им царь и начальники»; ἐπὶ τούτοις — «на этих (условиях)»; ἐξῆλθον ἐκ τοῦ ὀχυρώματος — «вышли из крепости»."
  62: "εἰσῆλθεν… εἰς ὄρος Σιων — «вошёл… на гору Сион»; εἶδεν τὸ ὀχύρωμα τοῦ τόπου — «увидел крепость места»; ἠθέτησεν τὸν ὁρκισμόν — «отверг (нарушил) клятву» (ἀθετέω); καθελεῖν τὸ τεῖχος κυκλόθεν — «низвергнуть стену вокруг»."
  63: "ἀπῆρεν κατὰ σπουδήν — «отправился поспешно» (σπουδή); εὗρεν Φίλιππον κυριεύοντα τῆς πόλεως — «нашёл Филиппа владеющим городом» (κυριεύω); ἐπολέμησεν πρὸς αὐτὸν — «воевал с ним»; κατελάβετο τὴν πόλιν βίᾳ — «взял город силою» (βία)."
