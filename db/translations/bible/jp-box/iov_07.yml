verses:
  1: "「人[ひと]の生[い]きることは地[ち]の上[うえ]で試練[しれん]であり、その命[いのち]は日雇[ひやと]いの者[もの]のようではないか。"
  2: "主人[しゅじん]を恐[おそ]れる奴隷[どれい]が日陰[ひかげ]を得[え]、雇[やと]われた者[もの]がその賃金[ちんぎん]を待[ま]つように。"
  3: "同[おな]じように、わたしもむなしい月[つき]々[つき]を耐[た]え忍[しの]び、苦[くる]しみの夜[よる]がわたしに与[あた]えられている。"
  4: "横[よこ]になれば、『いつ昼[ひる]になるのか』と言[い]い、起[お]き上[あ]がればまた、『いつ夕[ゆう]べになるのか』と言う。わたしは夕べから朝[あさ]まで苦[くる]しみに満[み]たされている。"
  5: "わたしの体[からだ]は虫[むし]のわく腐[くさ]りの中でこね回[まわ]され、わたしは膿[うみ]から土[つち]の塊[かたまり]をこそげ落[お]としながら、溶[と]けていく。"
  6: "わたしの日々[ひび]は語[かた]りよりも速[はや]く、むなしい望[のぞ]みのうちに消[き]え失[う]せた。"
  7: "思[おも]い起[お]こしてほしい、わたしの命[いのち]は息[いき]にほかならず、わたしの目[め]はもはや良[よ]いものを見[み]るために戻[もど]ることはない。"
  8: "わたしを見[み]る者[もの]の目[め]が、もはやわたしを顧[かえり]みることはない。あなたの目[め]はわたしの上[うえ]にあり、わたしはもういない。"
  9: "雲[くも]が晴[は]れて天[てん]から消[き]えるように。人[ひと]がよみに下[くだ]れば、もはや上[のぼ]って来[く]ることはない。"
  10: "彼[かれ]はもはや自分[じぶん]の家[いえ]に帰[かえ]ることはなく、その場所[ばしょ]も彼を知[し]ることはない。"
  11: "だから、わたしも自分の口[くち]を慎[つつし]まない。苦[くる]しみの中[なか]にあって語[かた]り、魂[たましい]の苦[にが]さに迫[せま]られて口を開[ひら]く。"
  12: "わたしは海[うみ]なのか、それとも竜[りゅう]なのか。あなたがわたしの上[うえ]に見張[みは]りを置[お]かれたのはなぜか。"
  13: "わたしは言[い]った、『寝床[ねどこ]がわたしを慰[なぐさ]めてくれる』と。わたしは床[とこ]の上[うえ]で、ひとり自分[じぶん]に語[かた]りかけよう。"
  14: "あなたは夢[ゆめ]でわたしを恐[おそ]れさせ、幻[まぼろし]でわたしを打[う]ちのめされる。"
  15: "あなたはわたしの魂[たましい]を息[いき]から、わたしの骨[ほね]を死[し]から解[とき]き放[はな]たれる。"
  16: "わたしは永遠[えいえん]に生[い]きる者ではない。長[なが]く耐[た]え忍[しの]ぶこともない。わたしから離[はな]れてくれ。わたしの命[いのち]はむなしいからである。"
  17: "人[ひと]とは何[なに]か。あなたがその人[ひと]を大[おお]きくし、これに心[こころ]を留[と]められるとは。"
  18: "朝[あさ]ごとにその人[ひと]を顧[かえり]み、その休[やす]みに至[いた]るまでこれを裁[さば]かれるとは。"
  19: "いつまで、あなたはわたしを放[はな]っておかず、わたしが苦[くる]しみのうちに唾[つば]を飲[の]み込[こ]む間[あいだ]も、わたしを解[とき]き放[はな]たないのか。"
  20: "わたしが罪[つみ]を犯[おか]したとして、人[ひと]の心[こころ]を知[し]るあなたに、わたしが何[なに]をなし得[え]るだろうか。なぜあなたはわたしをあなたに逆[さか]らう者[もの]とし、わたしをあなたの重[おも]荷[に]とされたのか。"
  21: "なぜ、わたしの不法[ふほう]を忘[わす]れ、わたしの罪[つみ]を清[きよ]めてくださらなかったのか。今[いま]、わたしは土[つち]へ去[さ]る。朝[あさ]早[はや]く起[お]きても、わたしはもういない。」"

notes:
  1: "Иов. πότερον οὐχί — «разве не…» (вопрос с ожиданием «да»). πειρατήριον — «испытание, поприще»; βίος — «жизнь». μισθίου αὐθημερινοῦ — «подённого наёмника» (αὐθημερινός — «однодневный»). Речь продолжается из главы 6 без формулы, здесь снова открывается 「 (закрывается в 7:21)."
  2: "Иов. θεράπων δεδοικώς τὸν κύριον — «слуга, боящийся господина»; τετευχὼς σκιᾶς — «получивший тень», т. е. укрытие от зноя (перфект от τυγχάνω). μισθωτός — «наёмный работник»; μισθός — «плата». Пара «слуга/наёмник» сохранена."
  3: "Иов. ὑπέμεινα μῆνας κενούς — «я вытерпел месяцы пустые» (ὑπομένω). νύκτες ὀδυνῶν — «ночи болей» (ὀδύνη); δεδομέναι μοί εἰσιν — «даны мне»."
  4: "Иов. ἐὰν κοιμηθῶ — «если лягу». Пότε ἡμέρα; … Пότε ἑσπέρα; — прямые вопросы самому себе, поэтому вложенная речь в 『…』 (внутри внешней цитаты Иова). πλήρης ὀδυνῶν — «полон болей». ἀπὸ ἑσπέρας ἕως πρωί — «от вечера до утра»."
  5: "Иов. φύρεται — «месится, размешивается» (φύρω). σαπρία σκωλήκων — «гниение червей». βώλακας γῆς — «комья земли» (βῶλαξ); ἀπὸ ἰχῶρος — «от сукровицы, гноя» (ἰχώρ); ξύων — «соскабливая» (ξύω). Тёмный образ сохранён без сглаживания."
  6: "Иов. ἐλαφρότερος λαλιᾶς — «легче, быстрее речи» (λαλιά — «говор, слово»); слав. «скоряе беседы». ἀπόλωλεν ἐν κενῇ ἐλπίδι — «погибла в пустой надежде»."
  7: "Иов. μνήσθητι — импер. «вспомни». πνεῦμά μου ἡ ζωή — «жизнь моя — дух, дыхание»: отсюда 命は息にほかならない; слав. «дух мой живот». ἐπανελεύσεται — «вернётся» (ἐπανέρχομαι)."
  8: "Иов. οὐ περιβλέψεταί με — «не оглянется на меня, не увидит» (περιβλέπω). οἱ ὀφθαλμοί σου ἐν ἐμοί — «очи Твои на мне»; καὶ οὐκέτι εἰμί — «и меня уже нет»."
  9: "Иов. ὥσπερ νέφος ἀποκαθαρθέν — «как облако очищенное, рассеянное» (ἀποκαθαίρω). καταβῇ εἰς ᾅδην — «сойдёт в ад»; ᾅδης — よみ. οὐκέτι μὴ ἀναβῇ — «уже не взойдёт»."
  10: "Иов. ἐπιστρέψῃ εἰς τὸν ἴδιον οἶκον — «вернётся в свой дом». ἐπιγνῷ αὐτὸν ὁ τόπος αὐτοῦ — «узнает его место его»; двойное отрицание οὐδ᾿ οὐ μή сохранено по смыслу."
  11: "Иов. φείσομαι τῷ στόματί μου — «пощажу уст моих» (φείδομαι). ἐν ἀνάγκῃ ὤν — «будучи в нужде, стеснении». ἀνοίξω πικρίαν ψυχῆς μου — «открою горечь души моей»; συνεχόμενος — «будучи тесним» (συνέχω)."
  12: "Иов. πότερον θάλασσα — «разве море»; δράκων — «дракон, морское чудовище» (здесь не Левиафан; ср. 41). κατέταξας ἐπ᾿ ἐμέ φυλακήν — «поставил надо мною стражу» (τάσσω, φυλακή). Тёмное место: почему Бог стережёт его, как море."
  13: "Иов. εἶπα ὅτι Παρακαλέσει με ἡ κλίνη μου — «я сказал, что постель моя утешит меня»: ὅτι с будущим допускает и прямую речь, поэтому 『…』. ἀνοίσω … λόγον τῇ κοίτῃ μου — «произнесу слово на ложе моём»; ἰδίᾳ — «наедине»."
  14: "Иов. ἐκφοβεῖς με ἐνυπνίοις — «устрашаешь меня снами» (ἐκφοβέω; ἐνύπνιον — сон). ἐν ὁράμασίν με καταπλήσσεις — «видениями приводишь меня в ужас» (καταπλήσσω)."
  15: "Иов. ἀπαλλάξεις ἀπὸ πνεύματός μου τὴν ψυχήν μου — «удалишь от духа моего душу мою», т. е. отнимешь дыхание жизни; ἀπὸ θανάτου τὰ ὀστᾶ μου — «кости мои от смерти». Тёмное место, слав. «свободиши от духа моего душу мою»; сохранено буквально."
  16: "Иов. οὐ γὰρ εἰς τὸν αἰῶνα ζήσομαι — «не буду жить в век». ἵνα μακροθυμήσω — «чтобы долготерпеть». ἀπόστα ἀπ᾿ ἐμοῦ — импер. «отступи от меня». κενὸς ὁ βίος — «пуста жизнь моя»."
  17: "Иов. τί ἐστιν ἄνθρωπος — «что есть человек»: реминисценция Пс 8:5 и 143:3. ἐμεγάλυνας — «возвеличил» (μεγαλύνω); προσέχεις τὸν νοῦν — «обращаешь ум, внимание»."
  18: "Иов. ἐπισκοπὴν ποιήσῃ ἕως τὸ πρωί — «посещение делаешь до утра» (слав. «по всяко утро», в тексте 朝ごとに). εἰς ἀνάπαυσιν αὐτὸν κρινεῖς — «судишь его к покою»: тёмный оборот, слав. «в покои судити его имаши»; передан буквально (休みに至るまで裁く)."
  19: "Иов. ἕως τίνος — «доколе». οὐκ ἐᾷς με — «не оставляешь меня» (ἐάω); προίῃ — «отпускаешь» (προΐημι). ἕως ἂν καταπίω τὸν πτύελόν μου — «пока не проглочу слюну мою» (πτύελον); ἐν ὀδύνῃ — «в боли»."
  20: "Иов. εἰ ἐγὼ ἥμαρτον — «если я согрешил». ὁ ἐπιστάμενος τὸν νοῦν τῶν ἀνθρώπων — «знающий ум человеческий». κατεντευκτήν σου — «противником, обвинителем Твоим» (κατεντευκτής, гапакс); φορτίον — «бремя»."
  21: "Иов. διὰ τί οὐκ ἐποιήσω … λήθην — «почему не сделал забвения» (λήθη); καθαρισμὸν τῆς ἁμαρτίας — «очищение греха». νυνὶ δὲ εἰς γῆν ἀπελεύσομαι — «ныне пойду в землю». ὀρθρίζων — «вставая рано» (ὀρθρίζω). Здесь закрывается цитата; в главе 8 новая формула Вилдада."
