# jp-box, Иов, глава 7. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге только главы 1–2; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 7: продолжение ответа Иова. Жизнь человека — как участь наёмника (1–3),
# ночи боли и краткость жизни (4–10), он не будет щадить своих уст (11–16),
# вопрос о человеке и о том, зачем Бог испытывает его (17–19),
# «если я согрешил» и просьба о прощении (20–21).
# Голоса: только Иов; вводной формулы в главе нет, речь продолжается из главы 6.
# Поэтому в 7:1 открывается 「 (продолжение без формулы) и закрывается в конце 7:21.
# Вложенная речь (свои слова) — 『…』 в 7:4 («когда день?» / «когда вечер?») и 7:13
# («постель утешит меня»), внутри внешней цитаты.
# Нумерация по gr: 21 стих; деление совпадает с csl и ru.
# 〔…〕 нет: все стихи есть в gr-lxx-byz. Сносок ⟨…⟩ нет: よみ, 竜, 日雇い и пр.
# уже в корпусе. Тёмные места — 7:5, 7:12, 7:15, 7:18 (см. notes).

