# jp-box, 3-я Царств, глава 5. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); церковнославянский (csl-ru) — второй
# свидетель церковного текста (новый паритет, docs/japanese-bible.md):
# слав. чтения и добавки входят в основной текст без 〔…〕, вариант LXX — в notes.
# ru (Синодальный) — только для понимания, не источник. jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 5: приставники и продовольствие (1–8), мудрость Соломона (9–14),
# переписка с Хирамом о постройке (15–26), набор работников (27–32).
# Нумерация по gr: 32 стиха (у csl 18). В gr гл. 4 кончается 19-м стихом, поэтому
# материал csl 4:20–34 и 5:1–18 в gr распределён иначе и переставлен:
# gr 5:1–4 = csl 4:27–28, 4:22–24; gr 5:9–14 = csl 4:29–34 (+ суб-стих 14a);
# gr 5:15–32 = csl 5:1–18. Соответствие csl указано в notes каждого стиха.
# В gr 5:5–8 стоит «.» (текст утрачен, порядок стихов сбит): четыре стиха даны по
# csl 4:20, 4:21, 4:25, 4:26 — иначе их в этой главе нет вовсе.
# В gr 5:31 тоже «.»; стих по csl 5:17, те же слова стоят в gr 6:1a (двойное чтение).
# 〔…〕 нет: всё взятое у csl отмечено в notes.
# Сносок ⟨…⟩ нет: 神殿, 契約の箱, 祭壇, 祭司 уже пояснены в корпусе.

tr_code: jp-box
book: 3ts
chapter: 5
draft: true

verses:
  1: "任命[にんめい]された者[もの]たちは、こうしてソロモン王[おう]に、王の食卓[しょくたく]に必要[ひつよう]なすべての品[しな]を、それぞれの月[つき]に、欠[か]けることなく供給[きょうきゅう]した。また、馬[うま]と戦車[せんしゃ]のための大麦[おおむぎ]と藁[わら]を、王がいる場所[ばしょ]へ、それぞれの割[わ]り当[あ]てに従[したが]って運[はこ]んだ。"
  2: "ソロモンの一日[いちにち]の食料[しょくりょう]は、上等[じょうとう]の小麦粉[こむぎこ]三十[さんじゅう]コル、ついた粉[こな]六十[ろくじゅう]コルであった。"
  3: "さらに、選[え]り抜[ぬ]きの子牛[こうし]十頭[じゅっとう]、放牧[ほうぼく]の雄牛[おうし]二十頭[にじゅっとう]、羊[ひつじ]百[ひゃく]匹[ぴき]、そのほかに鹿[しか]、かもしか、選り抜きの肥[こ]えた鳥[とり]が加[くわ]わった。"
  4: "彼[かれ]は川[かわ]の向[む]こう側[がわ]、ティフサハからガザに至[いた]るまでを治[おさ]める者[もの]であり、四方[しほう]のどこからも平和[へいわ]であった。"
  5: "ユダとイスラエルは海辺[うみべ]の砂[すな]のように多[おお]く、食[た]べ、飲[の]み、楽[たの]しんでいた。"
  6: "ソロモンは、川[かわ]からペリシテ人[じん]の地[ち]、エジプトの境[さかい]に至[いた]るまでのすべての王国[おうこく]を支配[しはい]していた。それらの国々[くにぐに]は彼[かれ]に贈[おく]り物[もの]を持[も]って来[き]て、生涯[しょうがい]彼に仕[つか]えた。"
  7: "ユダとイスラエルは、ダンからベエル・シェバに至[いた]るまで、ソロモンの生涯[しょうがい]、それぞれ自分[じぶん]のぶどうの木[き]の下[した]、いちじくの木の下で、食[た]べ、飲[の]みながら安[やす]らかに暮[く]らした。"
  8: "ソロモンには、戦車[せんしゃ]のための雌馬[めうま]が四万[よんまん]頭[とう]、騎兵[きへい]が二万[にまん]人[にん]いた。"
  9: "主[しゅ]はソロモンに思慮[しりょ]と非常[ひじょう]に多[おお]い知恵[ちえ]、海辺[うみべ]の砂[すな]のような広[ひろ]やかな心[こころ]を与[あた]えた。"
  10: "ソロモンの知恵[ちえ]は、すべての昔[むかし]の人々[ひとびと]の思慮[しりょ]よりも、またエジプトのすべての知者[ちしゃ]よりも、はるかに増[ま]し加[くわ]わった。"
  11: "彼[かれ]はすべての人[ひと]よりも、またエズラ人[じん]ガイタン、エマン、カルコル、ダルダ、マホルの子[こ]らよりも賢[かしこ]かった。その名[な]は四方[しほう]のすべての国々[くにぐに]に広[ひろ]まった。"
  12: "彼[かれ]は三千[さんぜん]のたとえ話[ばなし]を語[かた]り、その歌[うた]は五千[ごせん]首[しゅ]あった。"
  13: "彼[かれ]はレバノンの杉[すぎ]から壁[かべ]から生[は]えるヒソプに至[いた]るまでの木[き]について語[かた]り、獣[けもの]、鳥[とり]、這[は]うもの、魚[さかな]についても語った。"
  14: "すべての民[たみ]がソロモンの知恵[ちえ]を聞[き]こうとして来[き]た。彼[かれ]は、その知恵のうわさを聞いた地[ち]のすべての王[おう]から贈[おく]り物[もの]を受[う]け取[と]った。ソロモンはファラオの娘[むすめ]を妻[つま]に迎[むか]え、主[しゅ]の家[いえ]と自分[じぶん]の家、エルサレムの城壁[じょうへき]を建[た]て終[お]えるまで、彼女[かのじょ]をダビデの町[まち]へ連[つ]れて入[はい]った。"
  15: "そのころ、エジプトの王[おう]ファラオは上[のぼ]って来[き]てガゼルを取[と]り、これを火[ひ]で焼[や]いて、メルガブに住[す]むカナン人[じん]も焼いた。ファラオはこれを、自分の娘[むすめ]であるソロモンの妻[つま]に持[も]ち物[もの]として与[あた]え、ソロモンはガゼルを建[た]て直[なお]した。ツロの王ヒラムは、自分[じぶん]の僕[しもべ]たちを遣[つか]わしてソロモンに油[あぶら]を注[そそ]がせた。ヒラムがダビデをいつも愛[あい]していたからである。"
  16: "ソロモンはヒラムに人[ひと]を遣[つか]わして言[い]った。"
  17: "「あなたは、わたしの父[ちち]ダビデが、周[まわ]りを囲[かこ]んだ戦[いくさ]のゆえに、主[しゅ]なるわたしの神[かみ]の名[な]のために家[いえ]を建[た]てることができなかったことを知[し]っている。主が彼[かれ]らを彼の足の裏の下に置[お]かれるまで、そうだった。"
  18: "しかし今[いま]、主[しゅ]なるわたしの神[かみ]は、わたしの周[まわ]り四方[しほう]に安[やす]らぎを与[あた]えてくださった。妨[さまた]げる者[もの]もなく、災[わざわ]いもない。"
  19: "だから、見[み]よ、わたしは主[しゅ]なるわたしの神[かみ]の名[な]のために家[いえ]を建[た]てようとしている。主がわたしの父[ちち]ダビデに語[かた]って言[い]われたとおりである。『あなたの代[か]わりに、あなたの王座[おうざ]に据[す]えるあなたの子[こ]、その者[もの]が、わたしの名のために家を建て上[あ]げる』と。"
  20: "そして今[いま]、命[めい]じて、レバノンからわたしのために木[き]を切[き]らせてほしい。見[み]よ、わたしの僕[しもべ]たちはあなたの僕たちとともに働[はたら]く。あなたの働[はたら]きへの賃金[ちんぎん]は、あなたが言[い]うとおりにすべて払[はら]おう。わたしたちのうちには、シドン人[じん]のように木を切ることのできる者[もの]がいないことを、あなたは知[し]っているからである。」"
  21: "ヒラムはソロモンの言葉[ことば]を聞[き]くと、大[おお]いに喜[よろこ]んで言[い]った。「今日[きょう]、ダビデに賢[かしこ]い子[こ]を与[あた]えられた神[かみ]はほめたたえられる。この多[おお]くの民[たみ]を治[おさ]めるためである。」"
  22: "ヒラムはソロモンに遣[つか]わして言[い]った。「わたしは、あなたがわたしに遣わしたすべてのことを聞[き]いた。わたしはあなたの望[のぞ]みをすべてかなえよう。杉[すぎ]の木[き]と糸杉[いとすぎ]の木を。"
  23: "わたしの僕[しもべ]たちはそれをレバノンから海[うみ]へ下[おろ]す。わたしはそれをいかだにして、あなたがわたしに知[しら]せる場所[ばしょ]まで運[はこ]び、そこでそれを解[ほど]こう。あなたはそれを取[と]り上[あ]げなさい。そして、わたしの家[いえ]にパンを与[あた]えるというわたしの望[のぞ]みをかなえなさい。」"
  24: "ヒラムはソロモンに杉[すぎ]の木[き]と糸杉[いとすぎ]の木、望[のぞ]まれるすべてのものを与[あた]え続[つづ]けた。"
  25: "ソロモンはヒラムに、小麦[こむぎ]二万[にまん]コルと、その家[いえ]のための食[しょく]べ物[もの]、打[う]って採[と]った油[あぶら]二万バトを与[あた]えた。ソロモンは毎年[まいとし]、これだけをヒラムに与えた。"
  26: "主[しゅ]は、ご自分[じぶん]が語[かた]られたとおりに、ソロモンに知恵[ちえ]を与[あた]えた。ソロモンとヒラムの間[あいだ]には平和[へいわ]があり、二人[ふたり]は互[たが]いに契約[けいやく]を結[むす]んだ。"
  27: "王[おう]はイスラエル全体[ぜんたい]から賦役[ふえき]を取[と]り立[た]てた。賦役は三万人[さんまんにん]であった。"
  28: "彼[かれ]らをレバノンへ遣[つか]わした。一月[ひとつき]に一万人[いちまんにん]ずつ、交代[こうたい]で、一月はレバノンに、二月[ふたつき]は自分[じぶん]の家[いえ]にいた。アドニラムが賦役[ふえき]の上[うえ]にいた。"
  29: "ソロモンには、荷[に]を運[はこ]ぶ者[もの]が七万[しちまん]人[にん]、山[やま]で石[いし]を切[き]る者が八万[はちまん]人いた。"
  30: "ソロモンの工事[こうじ]の上[うえ]に置[お]かれた長[かしら]たちとは別[べつ]に、工事を行[おこな]う監督[かんとく]が三千六百人[さんぜんろっぴゃくにん]いた。"
  31: "王[おう]は命[めい]じて、大[おお]きな貴重[きちょう]な石[いし]、神殿[しんでん]の礎[いしずえ]のための切[き]り出[だ]した石を運[はこ]ばせた。"
  32: "そして彼[かれ]らは石[いし]と木[き]を三年[さんねん]かけて準備[じゅんび]した。"

notes:
  1: "ἐχορήγουν — снабжали (χορηγέω); τὰ διαγγέλματα — «распоряжения», всё назначенное к столу; οὐ παραλλάσσουσιν λόγον — «не изменяют слова», т. е. не допускают недостатка (слав. «не пременяюще словесе»); ᾖρον — носили, доставляли; κατὰ τὴν σύνταξιν αὐτοῦ — по своему распорядку. В gr 5:1 слиты csl 4:27–28 (приставники, ячмень и солома коням)."
  2: "σεμίδαλις — тонкая пшеничная мука (上等の小麦粉); ἄλευρον κεκοπανισμένον — «толчёная» мука (слав. «мука смешаная»), т. е. обычная; κόρος — кор (コル — мера сыпучего). = csl 4:22."
  3: "μόσχοι ἐκλεκτοί — отборные телята; βόες νομάδες — пастбищные, откормленные на траве волы (слав. «волов тучных»); πρόβατα — овцы; ἐκτὸς ἐλάφων καὶ δορκάδων καὶ ὀρνίθων ἐκλεκτῶν, σιτευτά — кроме оленей, косуль и отборных откормленных птиц. = csl 4:23."
  4: "πέραν τοῦ ποταμοῦ — за рекой (Евфрат). В csl 4:24 прибавлено «от фапсы и даже до газы» (ἀπὸ Θαψακοῦ ἕως Γάζης), в gr модуля этой клаузы нет — по паритету внесено в текст (ティフサハ, ガザ). εἰρήνη ἐκ πάντων τῶν μερῶν κυκλόθεν — мир со всех сторон."
  5: "В gr-lxx-byz (и в gr-ru) на месте стиха стоит «.» — текст в модуле утрачен. Порядок стихов здесь сбит: материал csl 4:20–34 стоит в gr 5:1–14, причём четыре стиха потеряны. Стих дан по csl 4:20: Иуда и Израиль многочисленны, как песок при море, едят, пьют и веселятся (МТ 4:20)."
  6: "Стих по csl 4:21 (в gr на месте стиха «.»): Соломон владел всеми царствами от реки до земли Филистимской и до пределов Египта; приносили дары и служили ему во все дни жизни его (МТ 4:21)."
  7: "Стих по csl 4:25 (в gr «.»): Иуда и Израиль жили беспечально, каждый под виноградом своим и под смоковницей своею, от Дана до Вирсавии, во все дни Соломона (МТ 4:25)."
  8: "Стих по csl 4:26 (в gr «.»): у Соломона сорок тысяч кобылиц для колесниц и двадцать тысяч всадников; в ru/МТ — двенадцать тысяч всадников. Держимся csl как церковного чтения, расхождение отмечено."
  9: "ἔδωκεν κύριος φρόνησιν — Господь дал разумение (слав. «смысл»); σοφίαν πολλὴν σφόδρα — весьма много мудрости; χύμα καρδίας — «разлитие сердца», широта ума (слав. «широту сердца»); ἄμμος ἡ παρὰ τὴν θάλασσαν — песок приморский. = csl 4:29 (в ru «Бог» вместо «Господь»)."
  10: "ἐπληθύνθη — «умножился» (о мудрости); ὑπὲρ τὴν φρόνησιν πάντων ἀρχαίων ἀνθρώπων — сверх разумения всех древних людей; τοὺς φρονίμους Αἰγύπτου — разумных Египта. = csl 4:30."
  11: "ἐσοφίσατο — «умудрился», стал мудрее (σοφίζω); Γαιθαν τὸν Εζραίτην — Гефан Езрахитянин (エズラ人); Αιμαν, Χαλκαλ, Δαρδα υἱοὺς Μαλ — Еман, Халкал, Дарда, сыновья Махола (слав. «сына самадова» — ед. ч.). Клауза «и прославилось имя его во всех окрестных странах» есть в csl, в gr модуля её нет — внесена. = csl 4:31."
  12: "παραβολάς — притчи, подобия (слав. «притчи»); ᾠδαί — песни; τρισχιλίας / πεντακισχίλιαι — три тысячи / пять тысяч. = csl 4:32."
  13: "ἀπὸ τῆς κέδρου τῆς ἐν τῷ Λιβάνῳ — от кедра Ливанского (杉); ὕσσωπος ἡ ἐκπορευομένη διὰ τοῦ τοίχου — иссоп, вырастающий из стены (ヒソプ); κτήνη — скот, звери; πετεινά — птицы; ἑρπετά — пресмыкающиеся (這うもの); ἰχθύες — рыбы. = csl 4:33."
  14: "παρεγίνοντο — приходили; ἐλάμβανεν δῶρα — принимал дары. Суб-стих «14a» (в тексте модуля помечен цифрой) — о дочери фараона; в csl/ru этот рассказ стоит в 3:1, в gr он присоединён к 5:14, отдельного стиха нет. τὸ τεῖχος Ιερουσαλημ — стена Иерусалима. = csl 4:34 + 14a."
  15: "τότε ἀνέβη Φαραω — тогда вышел (поднялся) фараон; προκατελάβετο τὴν Γαζερ — захватил Газер (ガゼル); τὸν Χανανίτην τὸν κατοικοῦντα ἐν Μεργαβ — хананея, живущего в Мергаве; ἀποστολάς — «в приданое» (ἀποστολή — отправка, дар). Вторая половина стиха (Хирам послал отроков помазать Соломона) в csl — 5:1: gr склеил здесь рассказ о Газере (ср. csl 9:16, в gr модуля 9:16 — «.») и 5:1b. χρῖσαι — помазать (油を注ぐ)."
  16: "ἀπέστειλεν Σαλωμων πρὸς Χιραμ λέγων — послал Соломон к Хираму сказать. Здесь начинается речь Соломона (17–20). = csl 5:2."
  17: "Σὺ οἶδας — «ты знаешь»; ἀπὸ προσώπου τῶν πολέμων τῶν κυκλωσάντων αὐτόν — «от лица войн, окруживших его» (слав. «от лица противных»); ἕως τοῦ δοῦναι κύριον αὐτοὺς ὑπὸ τὰ ἴχνη τῶν ποδῶν αὐτοῦ — доколе Господь не положил их под следы ног его (в gr рассогласование: αὐτούς «их» при αὐτοῦ «его»; переведено по gr). = csl 5:3."
  18: "ἀνέπαυσε ... ἐμοὶ κυκλόθεν — «дал мне покой кругом»; ἐπίβουλος — злоумышленник, противник (слав. «наветник»); ἀπάντημα πονηρόν — злая напасть (слав. «сопротивник лукавый»). = csl 5:4."
  19: "ἰδοὺ ἐγὼ λέγω οἰκοδομῆσαι — «вот, я говорю (намерен) построить»; τῷ ὀνόματι κυρίου — имени Господню. Вложенная речь 『…』 — слова Господа Давиду (λέγων). ὃν δώσω ἀντὶ σοῦ ἐπὶ τὸν θρόνον σου — которого дам вместо тебя на престол твой. = csl 5:5."
  20: "ἔντειλαι — прикажи; κοψάτωσάν μοι ξύλα — пусть срубят мне деревья; μισθὸν δουλείας — плату за работу; οὐκ ἔστιν ἡμῖν εἰδὼς ξύλα κόπτειν — нет у нас умеющего рубить дерево; οἱ Σιδώνιοι — сидоняне (シドン人). Здесь речь Соломона закрывается. = csl 5:6."
  21: "ἐχάρη σφόδρα — обрадовался весьма; Εὐλογητὸς ὁ θεὸς σήμερον — благословен Бог сегодня; υἱὸν φρόνιμον ἐπὶ τὸν λαὸν τὸν πολὺν τοῦτον — сына разумного над народом этим многочисленным. Здесь начинается речь Хирама. = csl 5:7."
  22: "Ἀκήκοα — «я услышал» (перфект); πᾶν θέλημά σου — всякое желание твоё; ξύλα κέδρινα καὶ πεύκινα — кедровые и певговые деревья (杉 и 糸杉; πεύκη — сосна/пихта). = csl 5:8."
  23: "κατάξουσιν — сведут, спустят (κατάγω); σχεδίας — плотами (σχεδία — плот); ἐκτινάξω — «вытрясу», т. е. развяжу плот (слав. «довезу»); ἀρεῖς — возьмёшь; ἄρτους τῷ οἴκῳ μου — хлеб дому моему, т. е. продовольствие. = csl 5:9."
  24: "ἦν ... διδούς — «был дающим», давал постоянно (перифраза); κέδρους — кедры. В csl прибавлено «и певги» (糸杉), в gr только κέδρους — внесено по csl. = csl 5:10."
  25: "κόρους πυροῦ — коры пшеницы; μαχιρ — евр. слово, оставленное LXX без перевода (слав. «пищу»); βεθ — бат, мера объёма (слав. «мер»; バト); ἐλαίου κεκομμένου — выбитого (толчёного) масла, т. е. первого отжима; κατ᾽ ἐνιαυτόν — ежегодно. = csl 5:11."
  26: "καθὼς ἐλάλησεν αὐτῷ — как сказал ему (Бог Соломону); ἀνὰ μέσον — между; διέθεντο διαθήκην — заключили договор (διαθήκη здесь «союз»). = csl 5:12."
  27: "ἀνήνεγκεν φόρον — наложил повинность (слав. «взя дань»); φόρος здесь — трудовой набор, а не деньги; τριάκοντα χιλιάδες ἀνδρῶν — тридцать тысяч мужей. = csl 5:13."
  28: "ἀλλασσόμενοι — сменяясь; μῆνα ... καὶ δύο μῆνας — месяц и два месяца; Αδωνιραμ ἐπὶ τοῦ φόρου — Адонирам над повинностью. = csl 5:14."
  29: "αἴροντες ἄρσιν — «носящие ношу» (слав. «носящих бремена»); λατόμοι — каменосеки; ἑβδομήκοντα / ὀγδοήκοντα χιλιάδες — 70 000 / 80 000. = csl 5:15."
  30: "χωρὶς ἀρχόντων τῶν καθεσταμένων ἐπὶ τῶν ἔργων — кроме начальников, поставленных над работами; τρεῖς χιλιάδες καὶ ἑξακόσιοι ἐπιστάται — три тысячи шестьсот надзирателей (в csl то же). = csl 5:16."
  31: "В gr-lxx-byz (и в gr-ru) на месте стиха стоит «.» — текст в модуле утрачен; стих по csl 5:17: царь приказал брать большие дорогие камни, тёсаные, для основания дома. Те же слова в gr стоят в 6:1a (двойное чтение LXX) — повтор оставлен, как в церковном тексте. λίθοι ἀπελεκήτοι — тёсаные камни."
  32: "ἡτοίμασαν τοὺς λίθους καὶ τὰ ξύλα τρία ἔτη — приготовили камни и дерева (за) три года (вин. п. длительности; слав. «в три лета»). Первая половина csl 5:18 («и обтесали сыны Соломона и сыны Хирама…») в gr стоит в 6:2. = csl 5:18."
