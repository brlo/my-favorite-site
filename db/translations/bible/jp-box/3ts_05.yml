# jp-box, 3-я Царств, глава 5. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); церковнославянский (csl-ru) — второй
# свидетель церковного текста (новый паритет, docs/japanese-bible.md):
# слав. чтения и добавки входят в основной текст без 〔…〕, вариант LXX — в notes.
# ru (Синодальный) — только для понимания, не источник. jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
#
# Нумерация — славяно-синодальная (по csl-ru): 18 стихов.
# Глава 5: приготовления к храму — переписка с Хирамом о постройке (1–12),
# набор работников и заготовка камня (13–18).
# В прежней греческой нумерации это была вторая половина гр. гл. 5
# (гр 5:15–32): первая её половина (гр 5:1–14) теперь в гл. 4 (слав. 4:20–34).
# Поэтому сдвиг −14: слав. 5:1 = прежний гр 5:15, слав. 5:18 = прежний гр 5:32.
# Слав. 5:1 объединяет два рассказа: о Газере (в LXX он стоит здесь, у слав. —
# 9:16, где уже переведён) и о посольстве Хирама; оба предложения сохранены,
# отмечено в notes.
# Один стих в гр. модуле стоял как «.» и закрыт по csl: прежний гр 5:31
# (= гр 6:1a, двойное чтение LXX) = слав. 5:17. Первая половина слав. 5:18
# (обтёсывали сыны Соломона и сыны Хирама) в гр стоит в 6:2 — присоединена
# к 5:18; вторая половина (изготовили камни и дерева в три года) — по гр 5:18.
# 〔…〕 нет: всё взятое у csl отмечено в notes.
# Сносок ⟨…⟩ нет: 神殿, 契約の箱, 祭壇, 祭司 уже пояснены в корпусе.

tr_code: jp-box
book: 3ts
chapter: 5
draft: true

verses:
  1: "そのころ、エジプトの王[おう]ファラオは上[のぼ]って来[き]てガゼルを取[と]り、これを火[ひ]で焼[や]いて、メルガブに住[す]むカナン人[じん]も焼いた。ファラオはこれを、自分の娘[むすめ]であるソロモンの妻[つま]に持[も]ち物[もの]として与[あた]え、ソロモンはガゼルを建[た]て直[なお]した。ツロの王ヒラムは、自分[じぶん]の僕[しもべ]たちを遣[つか]わしてソロモンに油[あぶら]を注[そそ]がせた。ヒラムがダビデをいつも愛[あい]していたからである。"
  2: "ソロモンはヒラムに人[ひと]を遣[つか]わして言[い]った。"
  3: "「あなたは、わたしの父[ちち]ダビデが、周[まわ]りを囲[かこ]んだ戦[いくさ]のゆえに、主[しゅ]なるわたしの神[かみ]の名[な]のために家[いえ]を建[た]てることができなかったことを知[し]っている。主が彼[かれ]らを彼の足の裏の下に置[お]かれるまで、そうだった。"
  4: "しかし今[いま]、主[しゅ]なるわたしの神[かみ]は、わたしの周[まわ]り四方[しほう]に安[やす]らぎを与[あた]えてくださった。妨[さまた]げる者[もの]もなく、災[わざわ]いもない。"
  5: "だから、見[み]よ、わたしは主[しゅ]なるわたしの神[かみ]の名[な]のために家[いえ]を建[た]てようとしている。主がわたしの父[ちち]ダビデに語[かた]って言[い]われたとおりである。『あなたの代[か]わりに、あなたの王座[おうざ]に据[す]えるあなたの子[こ]、その者[もの]が、わたしの名のために家を建て上[あ]げる』と。"
  6: "そして今[いま]、命[めい]じて、レバノンからわたしのために木[き]を切[き]らせてほしい。見[み]よ、わたしの僕[しもべ]たちはあなたの僕たちとともに働[はたら]く。あなたの働[はたら]きへの賃金[ちんぎん]は、あなたが言[い]うとおりにすべて払[はら]おう。わたしたちのうちには、シドン人[じん]のように木を切ることのできる者[もの]がいないことを、あなたは知[し]っているからである。」"
  7: "ヒラムはソロモンの言葉[ことば]を聞[き]くと、大[おお]いに喜[よろこ]んで言[い]った。「今日[きょう]、ダビデに賢[かしこ]い子[こ]を与[あた]えられた神[かみ]はほめたたえられる。この多[おお]くの民[たみ]を治[おさ]めるためである。」"
  8: "ヒラムはソロモンに遣[つか]わして言[い]った。「わたしは、あなたがわたしに遣わしたすべてのことを聞[き]いた。わたしはあなたの望[のぞ]みをすべてかなえよう。杉[すぎ]の木[き]と糸杉[いとすぎ]の木を。"
  9: "わたしの僕[しもべ]たちはそれをレバノンから海[うみ]へ下[おろ]す。わたしはそれをいかだにして、あなたがわたしに知[しら]せる場所[ばしょ]まで運[はこ]び、そこでそれを解[ほど]こう。あなたはそれを取[と]り上[あ]げなさい。そして、わたしの家[いえ]にパンを与[あた]えるというわたしの望[のぞ]みをかなえなさい。」"
  10: "ヒラムはソロモンに杉[すぎ]の木[き]と糸杉[いとすぎ]の木、望[のぞ]まれるすべてのものを与[あた]え続[つづ]けた。"
  11: "ソロモンはヒラムに、小麦[こむぎ]二万[にまん]コルと、その家[いえ]のための食[しょく]べ物[もの]、打[う]って採[と]った油[あぶら]二万バトを与[あた]えた。ソロモンは毎年[まいとし]、これだけをヒラムに与えた。"
  12: "主[しゅ]は、ご自分[じぶん]が語[かた]られたとおりに、ソロモンに知恵[ちえ]を与[あた]えた。ソロモンとヒラムの間[あいだ]には平和[へいわ]があり、二人[ふたり]は互[たが]いに契約[けいやく]を結[むす]んだ。"
  13: "王[おう]はイスラエル全体[ぜんたい]から賦役[ふえき]を取[と]り立[た]てた。賦役は三万人[さんまんにん]であった。"
  14: "彼[かれ]らをレバノンへ遣[つか]わした。一月[ひとつき]に一万人[いちまんにん]ずつ、交代[こうたい]で、一月はレバノンに、二月[ふたつき]は自分[じぶん]の家[いえ]にいた。アドニラムが賦役[ふえき]の上[うえ]にいた。"
  15: "ソロモンには、荷[に]を運[はこ]ぶ者[もの]が七万[しちまん]人[にん]、山[やま]で石[いし]を切[き]る者が八万[はちまん]人いた。"
  16: "ソロモンの工事[こうじ]の上[うえ]に置[お]かれた長[かしら]たちとは別[べつ]に、工事を行[おこな]う監督[かんとく]が三千六百人[さんぜんろっぴゃくにん]いた。"
  17: "王[おう]は命[めい]じて、大[おお]きな貴重[きちょう]な石[いし]、神殿[しんでん]の礎[いしずえ]のための切[き]り出[だ]した石を運[はこ]ばせた。"
  18: "ソロモンの子[こ]らとヒラムの子ら、それにゲバルの石工[いしこう]たちは、それを切[き]り整[ととの]えて据[す]え付[つ]けた。そして彼[かれ]らは石[いし]と木[き]を三年[さんねん]かけて準備[じゅんび]した。"

notes:
  1: "τότε ἀνέβη Φαραω — тогда вышел (поднялся) фараон; προκατελάβετο τὴν Γαζερ — захватил Газер (ガゼル); τὸν Χανανίτην τὸν κατοικοῦντα ἐν Μεργαβ — хананея, живущего в Мергаве; ἀποστολάς — «в приданое» (ἀποστολή — отправка, дар). У слав. этот рассказ о Газере стоит отдельно — 9:16 (в gr модуля 9:16 — «.»), поэтому слав. 5:1 начинается с Хирама: «И посла хирам царь тирский отроки своя к соломону: услыша бо, яко помазаша его на царство вместо давида отца его, яко любяше хирам давида во вся дни» (вторая половина нашего стиха). Оба рассказа сохранены в одном стихе: по гр. модулю они склеены здесь, а перевод 9:16 уже есть отдельно. χρῖσαι — помазать (油を注ぐ). = csl 5:1."
  2: "ἀπέστειλεν Σαλωμων πρὸς Χιραμ λέγων — послал Соломон к Хираму сказать. Здесь начинается речь Соломона (3–6). = csl 5:2 (прежний гр 5:16)."
  3: "Σὺ οἶδας — «ты знаешь»; ἀπὸ προσώπου τῶν πολέμων τῶν κυκλωσάντων αὐτόν — «от лица войн, окруживших его» (слав. «от лица противных»); ἕως τοῦ δοῦναι κύριον αὐτοὺς ὑπὸ τὰ ἴχνη τῶν ποδῶν αὐτοῦ — доколе Господь не положил их под следы ног его (в gr рассогласование: αὐτούς «их» при αὐτοῦ «его»; переведено по gr). = csl 5:3."
  4: "ἀνέπαυσε ... ἐμοὶ κυκλόθεν — «дал мне покой кругом»; ἐπίβουλος — злоумышленник, противник (слав. «наветник»); ἀπάντημα πονηρόν — злая напасть (слав. «сопротивник лукавый»). = csl 5:4."
  5: "ἰδοὺ ἐγὼ λέγω οἰκοδομῆσαι — «вот, я говорю (намерен) построить»; τῷ ὀνόματι κυρίου — имени Господню. Вложенная речь 『…』 — слова Господа Давиду (λέγων). ὃν δώσω ἀντὶ σοῦ ἐπὶ τὸν θρόνον σου — которого дам вместо тебя на престол твой. = csl 5:5."
  6: "ἔντειλαι — прикажи; κοψάτωσάν μοι ξύλα — пусть срубят мне деревья; μισθὸν δουλείας — плату за работу; οὐκ ἔστιν ἡμῖν εἰδὼς ξύλα κόπτειν — нет у нас умеющего рубить дерево; οἱ Σιδώνιοι — сидоняне (シドン人). Здесь речь Соломона закрывается. = csl 5:6."
  7: "ἐχάρη σφόδρα — обрадовался весьма; Εὐλογητὸς ὁ θεὸς σήμερον — благословен Бог сегодня; υἱὸν φρόνιμον ἐπὶ τὸν λαὸν τὸν πολὺν τοῦτον — сына разумного над народом этим многочисленным. Здесь начинается речь Хирама. = csl 5:7."
  8: "Ἀκήκοα — «я услышал» (перфект); πᾶν θέλημά σου — всякое желание твоё; ξύλα κέδρινα καὶ πεύκινα — кедровые и певговые деревья (杉 и 糸杉; πεύκη — сосна/пихта). = csl 5:8."
  9: "κατάξουσιν — сведут, спустят (κατάγω); σχεδίας — плотами (σχεδία — плот); ἐκτινάξω — «вытрясу», т. е. развяжу плот (слав. «довезу»); ἀρεῖς — возьмёшь; ἄρτους τῷ οἴκῳ μου — хлеб дому моему, т. е. продовольствие. = csl 5:9."
  10: "ἦν ... διδούς — «был дающим», давал постоянно (перифраза); κέδρους — кедры. В csl прибавлено «и певги» (糸杉), в gr только κέδρους — внесено по csl. = csl 5:10."
  11: "κόρους πυροῦ — коры пшеницы; μαχιρ — евр. слово, оставленное LXX без перевода (слав. «пищу»); βεθ — бат, мера объёма (слав. «мер»; バト); ἐλαίου κεκομμένου — выбитого (толчёного) масла, т. е. первого отжима; κατ᾽ ἐνιαυτόν — ежегодно. = csl 5:11."
  12: "καθὼς ἐλάλησεν αὐτῷ — как сказал ему (Бог Соломону); ἀνὰ μέσον — между; διέθεντο διαθήκην — заключили договор (διαθήκη здесь «союз»). = csl 5:12."
  13: "ἀνήνεγκεν φόρον — наложил повинность (слав. «взя дань»); φόρος здесь — трудовой набор, а не деньги; τριάκοντα χιλιάδες ἀνδρῶν — тридцать тысяч мужей. = csl 5:13."
  14: "ἀλλασσόμενοι — сменяясь; μῆνα ... καὶ δύο μῆνας — месяц и два месяца; Αδωνιραμ ἐπὶ τοῦ φόρου — Адонирам над повинностью. = csl 5:14."
  15: "αἴροντες ἄρσιν — «носящие ношу» (слав. «носящих бремена»); λατόμοι — каменосеки; ἑβδομήκοντα / ὀγδοήκοντα χιλιάδες — 70 000 / 80 000. = csl 5:15."
  16: "χωρὶς ἀρχόντων τῶν καθεσταμένων ἐπὶ τῶν ἔργων — кроме начальников, поставленных над работами; τρεῖς χιλιάδες καὶ ἑξακόσιοι ἐπιστάται — три тысячи шестьсот надзирателей (в csl то же). = csl 5:16."
  17: "В гр. модуле на месте прежнего гр 5:31 (и в gr-ru) стоит «.» — текст утрачен; стих по csl 5:17: царь приказал брать большие дорогие камни, тёсаные, для основания дома. Те же слова в gr стоят в 6:1a (двойное чтение LXX) — повтор оставлен, как в церковном тексте. λίθοι ἀπελεκήτοι — тёсаные камни. = csl 5:17."
  18: "Слав. 5:18: «И истесаша сынове соломони и сынове хирамли и каменосечцы гевалстии: и изготовиша камения и древа в три лета». Первая половина в gr стоит в 6:2 (ἐπελέκησαν… ἔβαλαν αὐτούς; слав. добавляет «каменосечцы гивлитские»), вторая — в gr 5:18 (ἡτοίμασαν τοὺς λίθους καὶ τὰ ξύλα τρία ἔτη). Обе соединены в этом стихе."
