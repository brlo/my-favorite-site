# jp-box, Бытие, глава 18. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — csl-ru, ru (с масоретского —
# только для понимания) и jp-joc (1901, PD). Язык — современный 常体.
# Глава 18: явление трёх мужей у дуба Мамре (1–8), обетование сына Сарре (9–15),
# ходатайство Авраама о Содоме (16–33).
# Красного и синего нет: говорит Бог, но это не прямая речь Христа во плоти; «<j>» не ставится.
# Прямая речь — в 「…」; слова Сарры внутри речи Господа — 『…』 (18:13).
# 18:1–3: LXX читает «явился ему Бог», евр./Синодальный — «Господь»; Авраам обращается
# «Кύριε» (ед. ч.) к одному из трёх. Двусмысленность не сглаживается: 神 в 1-м стихе,
# 主[しゅ] в обращении, 主 в 13-м. Различие с масоретским текстом — в notes.
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено по базе).
# Сносок ⟨…⟩ нет: 天幕, 樫, 灰 уже в корпусе или понятны.
# jp-ni не использовался.

