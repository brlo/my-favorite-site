verses:
  1: "神[かみ]は、マンブレの樫[かし]の木[き]のそばで彼[かれ]に現[あらわ]れた。彼[かれ]は天幕[てんまく]の入口[いりぐち]に座[すわ]っていた。真昼[まひる]のことであった。"
  2: "彼[かれ]が目[め]を上[あ]げて見[み]ると、見[み]よ、三人[さんにん]の男[おとこ]たちが彼[かれ]のそばに立[た]っていた。彼[かれ]は彼[かれ]らを見[み]るや、天幕[てんまく]の入口[いりぐち]から彼[かれ]らを迎[むか]えに走[はし]り、地[ち]に向[む]かってひれ伏した。"
  3: "そして言[い]った。「主[しゅ]よ、もしわたしがあなたの前[まえ]に{恵[めぐ]み|恩寵[おんちょう]}を得[え]ているなら、どうか、あなたのしもべを通[とお]り過[す]ぎないでください。"
  4: "どうか、水[みず]を持[も]って来[こ]させ、あなたがたの足[あし]を洗[あら]わせてください。木[き]の下[した]で涼[すず]んでください。"
  5: "パンを持[も]って来[き]ます。あなたがたは食[た]べて、その後[あと]、自分[じぶん]たちの道[みち]を行[い]ってください。あなたがたが、しもべのところへ立[た]ち寄[よ]ったのは、そのためですから。」彼[かれ]らは言[い]った。「あなたの言[い]ったとおりに、そうしてください。」"
  6: "アブラハムは天幕[てんまく]のサラのもとへ急[いそ]いだ。そして彼女[かのじょ]に言[い]った。「急[いそ]いで、上等[じょうとう]の小麦粉[こむぎこ]を三[みっ]つの量[りょう]だけこね、灰[はい]の中[なか]で焼[や]くパンを作[つく]りなさい。」"
  7: "アブラハムは牛[うし]の群[む]れのところへ走[はし]り、柔[やわ]らかで良[よ]い子牛[こうし]を取[と]って、若[わか]い者[もの]に渡[わた]した。その者[もの]は急[いそ]いでそれを調理[ちょうり]した。"
  8: "彼[かれ]は、バターと乳[ちち]と、調理[ちょうり]した子牛[こうし]を取[と]って、彼[かれ]らの前[まえ]に置[お]いた。彼[かれ]らは食[た]べた。彼[かれ]自身[じしん]は木[き]の下[した]で、彼[かれ]らのそばに立[た]っていた。"
  9: "彼[かれ]らは彼[かれ]に言[い]った。「あなたの妻[つま]サラはどこにいるか。」彼[かれ]は答[こた]えて言[い]った。「見[み]よ、天幕[てんまく]の中[なか]にいます。」"
  10: "そして言[い]った。「わたしは再[ふたた]び、来[らい]年[ねん]のこの時[とき]に、あなたのもとへ来[く]る。あなたの妻[つま]サラに男[おとこ]の子[こ]ができる。」サラは、彼[かれ]の後[うし]ろの天幕[てんまく]の入口[いりぐち]で、これを聞[き]いていた。"
  11: "アブラハムとサラは年[とし]を重[かさ]ねた老人[ろうじん]であった。サラには、女[おんな]の月[つき]のものが、もはや起[お]こらなくなっていた。"
  12: "サラは心[こころ]のうちに笑[わら]って言[い]った。「わたしには今[いま]まで、そのようなことはなかった。わたしの主人[しゅじん]も年[とし]を取[と]っているのに。」"
  13: "主[しゅ]はアブラハムに言[い]われた。「なぜサラは、『本当[ほんとう]に子[こ]を産[う]むのだろうか。わたしは年[とし]を取[と]ったのに』と言[い]って、心[こころ]のうちに笑[わら]ったのか。"
  14: "神[かみ]にできないことばがあるだろうか。この時[とき]に、わたしはあなたのもとへ帰[かえ]って来[く]る。そのとき、サラには男[おとこ]の子[こ]ができる。」"
  15: "サラは否認[ひにん]して言[い]った。「わたしは笑[わら]っていません。」彼女[かのじょ]は恐[こわ]かったからである。しかし、彼[かれ]は言[い]った。「いや、あなたは笑[わら]った。」"
  16: "その男[おとこ]たちはそこから立[た]ち上[あ]がり、ソドムとゴモラの方[ほう]を眺[なが]めた。アブラハムは彼[かれ]らとともに歩[ある]き、彼[かれ]らを送[おく]って行[い]った。"
  17: "主[しゅ]は言[い]われた。「わたしは、わたしが行[おこな]おうとしていることを、わたしのしもべアブラハムから隠[かく]すだろうか。"
  18: "アブラハムは必[かなら]ず大[おお]きく多[おお]い民[たみ]となる。地[ち]のすべての民[たみ]は、彼[かれ]によって祝福[しゅくふく]を受[う]ける。"
  19: "わたしは彼[かれ]を知[し]っていたからである。彼[かれ]は自分[じぶん]の子[こ]らと、自分[じぶん]の後[あと]の家[いえ]の者[もの]たちに命[めい]じて、主[しゅ]の道[みち]を守[まも]らせ、義[ぎ]と裁[さば]きを行[おこな]わせる。それは、主[しゅ]がアブラハムに語[かた]られたすべてのことを、彼[かれ]の上[うえ]に果[は]たすためである。」"
  20: "主[しゅ]は言[い]われた。「ソドムとゴモラの叫[さけ]びは増[ふ]えに増[ふ]え、彼[かれ]らの罪[つみ]は甚[はなは]だ重[おも]い。"
  21: "わたしは下[くだ]って行[い]き、彼[かれ]らの叫[さけ]びがわたしに届[とど]いたとおりに、彼[かれ]らが行[おこな]っているかどうかを見[み]よう。そうでなければ、知[し]るためである。」"
  22: "その男[おとこ]たちはそこから向[む]きを変[か]えてソドムへ行[い]った。アブラハムはまだ主[しゅ]の前[まえ]に立[た]っていた。"
  23: "アブラハムは近[ちか]づいて言[い]った。「あなたは義[ぎ]者[しゃ]を悪[あく]者[しゃ]とともに滅[ほろ]ぼされるのですか。義[ぎ]者[しゃ]が悪[あく]者[しゃ]と同[おな]じになるのですか。"
  24: "もしその町[まち]に五十人[ごじゅうにん]の義[ぎ]者[しゃ]がいたら、あなたは彼[かれ]らを滅[ほろ]ぼされるのですか。その中[なか]に五十人[ごじゅうにん]の義[ぎ]者[しゃ]がいるなら、彼[かれ]らのために、その場所[ばしょ]をすべて赦[ゆる]されないのですか。"
  25: "そのようなことを、あなたは決[けっ]してなさらないでしょう。義[ぎ]者[しゃ]を悪[あく]者[しゃ]とともに殺[ころ]して、義[ぎ]者[しゃ]を悪[あく]者[しゃ]と同[おな]じにすることは。決[けっ]して。全[ぜん]地[ち]を裁[さば]かれる方[かた]が、裁[さば]きを行[おこな]わないことがあるでしょうか。」"
  26: "主[しゅ]は言[い]われた。「もしわたしがソドムの町[まち]の中[なか]に五十人[ごじゅうにん]の義[ぎ]者[しゃ]を見[み]つけたなら、彼[かれ]らのために、その場所[ばしょ]をすべて赦[ゆる]そう。」"
  27: "アブラハムは答[こた]えて言[い]った。「わたしは今[いま]、主[しゅ]に語[かた]り始[はじ]めました。わたしは土[つち]と灰[はい]にすぎません。"
  28: "もし五十人[ごじゅうにん]の義[ぎ]者[しゃ]が五人[ごにん]分[ぶん]足[た]りなくなったら、あなたはその五人[ごにん]のために町[まち]をすべて滅[ほろ]ぼされるのですか。」彼[かれ]は言[い]った。「そこに四十五人[よんじゅうごにん]を見[み]つけるなら、わたしは滅[ほろ]ぼさない。」"
  29: "彼[かれ]はさらに続[つづ]けて、彼[かれ]に語[かた]った。「もしそこに四十人[よんじゅうにん]が見[み]つかったら。」彼[かれ]は言[い]った。「四十人[よんじゅうにん]のために、わたしは滅[ほろ]ぼさない。」"
  30: "そして言[い]った。「主[しゅ]よ、わたしが語[かた]っても、お怒[いか]りにならないでください。もしそこに三十人[さんじゅうにん]が見[み]つかったら。」彼[かれ]は言[い]った。「そこに三十人[さんじゅうにん]を見[み]つけるなら、わたしは滅[ほろ]ぼさない。」"
  31: "そして言[い]った。「わたしは主[しゅ]に語[かた]ろうとしています。もしそこに二十人[にじゅうにん]が見[み]つかったら。」彼[かれ]は言[い]った。「二十人[にじゅうにん]のために、わたしは滅[ほろ]ぼさない。」"
  32: "そして言[い]った。「主[しゅ]よ、もう一度[いちど]だけ語[かた]っても、お怒[いか]りにならないでください。もしそこに十人[じゅうにん]が見[み]つかったら。」彼[かれ]は言[い]った。「十人[じゅうにん]のために、わたしは滅[ほろ]ぼさない。」"
  33: "主[しゅ]は、アブラハムと語[かた]り終[お]えると、去[さ]って行[い]かれた。アブラハムもまた、自分[じぶん]の場所[ばしょ]へ帰[かえ]った。"

notes:
  1: "Ὤφθη δὲ αὐτῷ ὁ θεὸς — 神は彼に現れた (LXX: ὁ θεός; евр./Синодальный — «Господь»; не сглаживаем: в 1-м стихе 神, в 13-м 主). πρὸς τῇ δρυὶ τῇ Μαμβρη — マンブレの樫の木のそばで (δρῦς — «дуб»; Μαμβρη — Мамре). καθημένου αὐτοῦ ἐπὶ τῆς θύρας τῆς σκηνῆς — 彼が天幕の入口に座っていたとき (родительный самостоятельный). μεσημβρίας — 真昼 (букв. «в полдень»)."
  2: "ἀναβλέψας τοῖς ὀφθαλμοῖς — 目を上げて (семитский оборот). τρεῖς ἄνδρες εἱστήκεισαν ἐπάνω αὐτοῦ — 三人の男たちが彼のそばに立っていた (ἐπάνω — «над, у»; двусмысленность не сглаживаем). προσέδραμεν εἰς συνάντησιν — 迎えに走り (προστρέχω). προσεκύνησεν ἐπὶ τὴν γῆν — 地に向かってひれ伏した (προσκυνέω — «поклоняться»)."
  3: "Κύριε — 主よ (обращение в ед. ч. к одному из трёх; LXX: Κύριε, Синодальный: «Владыка», евр. אֲדֹנָי; двусмысленность сохранена). εἰ ἄρα εὗρον χάριν ἐναντίον σου — もしわたしがあなたの前に恵みを得ているなら. μὴ παρέλθῃς τὸν παῖδά σου — しもべを通り過ぎないでください (μὴ с аористом — запрет)."
  4: "λημφθήτω δὴ ὕδωρ — 水を持って来させ (императив 3 л.). νιψάτωσαν τοὺς πόδας ὑμῶν — 足を洗わせ. καταψύξατε ὑπὸ τὸ δένδρον — 木の下で涼んでください (καταψύχω — «охлаждать»)."
  5: "λήμψομαι ἄρτον — パンを持って来ます (букв. «возьму хлеб»). φάγεσθε — 食べて. παρελεύσεσθε εἰς τὴν ὁδὸν ὑμῶν — 自分たちの道を行ってください. οὗ εἵνεκεν ἐξεκλίνατε — そのために立ち寄った (ἐκκλίνω — «сворачивать»). Οὕτως ποίησον, καθὼς εἴρηκας — あなたの言ったとおりに、そうしてください."
  6: "ἔσπευσεν ... ἐπὶ τὴν σκηνὴν πρὸς Σαρραν — 天幕のサラのもとへ急いだ. Σπεῦσον καὶ φύρασον τρία μέτρα σεμιδάλεως — 急いで上等の小麦粉を三つの量だけこね (σεμίδαλις — «лучшая мука»; μέτρον — мера). ποίησον ἐγκρυφίας — 灰の中で焼くパンを作りなさい (ἐγκρυφίας — хлеб, печённый в золе)."
  7: "εἰς τὰς βόας ἔδραμεν — 牛の群れのところへ走り (βόας — «коровы»). μοσχάριον ἁπαλὸν καὶ καλόν — 柔らかで良い子牛. ἔδωκεν τῷ παιδί — 若い者に渡した. ἐτάχυνεν τοῦ ποιῆσαι αὐτό — 急いで調理した."
  8: "βούτυρον καὶ γάλα — バターと乳 (βούτυρον — «масло»). παρέθηκεν αὐτοῖς — 彼らの前に置いた. ἐφάγοσαν — 彼らは食べた. παρειστήκει αὐτοῖς ὑπὸ τὸ δένδρον — 木の下で彼らのそばに立っていた."
  9: "Εἶπεν δὲ πρὸς αὐτόν — 彼らは彼に言った (ед. ч. глагола при мн. подлежащем — как в евр.). Ποῦ Σαρρα ἡ γυνή σου; — 妻サラはどこにいるか. Ἰδοὺ ἐν τῇ σκηνῇ — 見よ、天幕の中にいます."
  10: "Ἐπαναστρέφων ἥξω — 再び…来る (ἐπαναστρέφω — «возвращаться»). κατὰ τὸν καιρὸν τοῦτον εἰς ὥρας — 来年のこの時に (букв. «по этому времени, в часы»). ἕξει υἱὸν — 男の子ができる. οὖσα ὄπισθεν αὐτοῦ — 彼の後ろにいて (Сарра слушала у входа)."
  11: "πρεσβύτεροι προβεβηκότες ἡμερῶν — 年を重ねた老人 (букв. «продвинутые в днях»). ἐξέλιπεν ... γίνεσθαι τὰ γυναικεῖα — 女の月のものが起きなくなっていた (τὰ γυναικεῖα — «женское», о месячных)."
  12: "ἐγέλασεν ἐν ἑαυτῇ — 心のうちに笑った. Οὔπω μέν μοι γέγονεν ἕως τοῦ νῦν — わたしには今まで、そのようなことはなかった (двусмысленно: о рождении и о женском; не сглаживаем). ὁ κύριός μου πρεσβύτερος — わたしの主人も年を取っている."
  13: "Τί ὅτι ἐγέλασεν — なぜ…笑ったのか. Ἆρά γε ἀληθῶς τέξομαι; — 本当に子を産むのだろうか (ἆρα γε — усилительная частица сомнения). ἐγὼ δὲ γεγήρακα — わたしは年を取ったのに. Вложенная речь — 『…』."
  14: "μὴ ἀδυνατεῖ παρὰ τῷ θεῷ ῥῆμα; — 神にできないことばがあるだろうか (ἀδυνατέω — «быть бессильным»). εἰς τὸν καιρὸν τοῦτον — この時に. ἀναστρέψω πρὸς σέ — あなたのもとへ帰って来る."
  15: "ἠρνήσατο — 否認した (ἀρνέομαι — «отрицать»). Οὐκ ἐγέλασα — わたしは笑っていません. ἐφοβήθη γάρ — 恐かったからである. Οὐχί, ἀλλὰ ἐγέλασας — いや、あなたは笑った."
  16: "ἐξαναστάντες ... κατέβλεψαν ἐπὶ πρόσωπον Σοδομων — 立ち上がり、ソドムの方を見下ろした (καταβλέπω — «смотреть вниз»; πρόσωπον — «лицо», здесь «сторона»). συνεπορεύετο ... συμπροπέμπων — ともに歩き、送って行った (συμπροπέμπω — «провожать»)."
  17: "Μὴ κρύψω ἐγὼ ἀπὸ Αβρααμ τοῦ παιδός μου — しもべアブラハムから隠すだろうか (риторический вопрос с μή)."
  18: "γινόμενος ἔσται εἰς ἔθνος μέγα καὶ πολύ — 必ず大きく多い民となる (γινόμενος — «становясь», усиливает будущее). ἐνευλογηθήσονται ἐν αὐτῷ πάντα τὰ ἔθνη — すべての民が彼によって祝福を受ける (ἐνευλογέομαι — «получать благословение»)."
  19: "ᾔδειν γὰρ ὅτι συντάξει — わたしは彼を知っていたからである (ᾔδειν — «знал»; в евр. «избрал»; держимся греческого). φυλάξουσιν τὰς ὁδοὺς κυρίου — 主の道を守る. ποιεῖν δικαιοσύνην καὶ κρίσιν — 義と裁きを行う. ὅπως ἂν ἐπαγάγῃ — 果たすために (ἐπάγω — «наводить»)."
  20: "Κραυγὴ Σοδομων καὶ Γομορρας πεπλήθυνται — ソドムとゴモラの叫びは増えに増え (perfect; κραυγή — «вопль»). αἱ ἁμαρτίαι αὐτῶν μεγάλαι σφόδρα — 彼らの罪は甚だ重い (букв. «велики весьма»)."
  21: "καταβὰς οὖν ὄψομαι — 下って行き、見よう. εἰ κατὰ τὴν κραυγὴν αὐτῶν ... συντελοῦνται — 叫びに応じて行われているか (συντελέω — «исполнять»). εἰ δὲ μή, ἵνα γνῶ — そうでなければ、知るためである."
  22: "ἀποστρέψαντες ἐκεῖθεν — そこから向きを変えて. ἦλθον εἰς Σοδομα — ソドムへ行った (LXX: «пришли»; в евр. «пошли»). ἑστηκὼς ἐναντίον κυρίου — 主の前に立っていた."
  23: "Μὴ συναπολέσῃς δίκαιον μετὰ ἀσεβοῦς — 義者を悪者とともに滅ぼされるのですか (συναπόλλυμι — «губить вместе»). ἔσται ὁ δίκαιος ὡς ὁ ἀσεβής — 義者が悪者と同じになる."
  24: "ἐὰν ὦσιν πεντήκοντα δίκαιοι — 五十人の義者がいたら. οὐκ ἀνήσεις πάντα τὸν τόπον — その場所をすべて赦されないのか (ἀνίημι — «оставлять, щадить»). ἕνεκεν τῶν πεντήκοντα — 五十人のために."
  25: "μηδαμῶς — 決して (дважды, как в греч.). τοῦ ἀποκτεῖναι δίκαιον μετὰ ἀσεβοῦς — 義者を悪者とともに殺すこと. ὁ κρίνων πᾶσαν τὴν γῆν — 全地を裁かれる方. οὐ ποιήσεις κρίσιν; — 裁きを行わないことがあるか."
  26: "Ἐὰν εὕρω ἐν Σοδομοις πεντήκοντα δικαίους — ソドムに五十人の義者を見つけたなら. ἀφήσω πάντα τὸν τόπον δι᾿ αὐτούς — 彼らのためにその場所をすべて赦そう (ἀφίημι — «оставлять»)."
  27: "Νῦν ἠρξάμην λαλῆσαι — 今、語り始めた. ἐγὼ δέ εἰμι γῆ καὶ σποδός — わたしは土と灰にすぎない (σποδός — «пепел»)."
  28: "ἐλαττονωθῶσιν ... πέντε — 五人分足りなくなる (ἐλαττονόω — «умалять»). ἀπολεῖς ἕνεκεν τῶν πέντε πᾶσαν τὴν πόλιν; — その五人のために町をすべて滅ぼされるのか. Οὐ μὴ ἀπολέσω — 決して滅ぼさない (οὐ μή + аорист — сильное отрицание)."
  29: "προσέθηκεν ἔτι λαλῆσαι — さらに続けて語った (προστίθημι — «прибавлять»). τεσσαράκοντα — 四十人."
  30: "Μή τι, κύριε, ἐὰν λαλήσω; — 主よ、語ってもお怒りにならないでください (букв. «неужели что, Господи, если скажу»). τριάκοντα — 三十人."
  31: "Ἐπειδὴ ἔχω λαλῆσαι — わたしは語ろうとしています (ἔχω + инфинитив). εἴκοσι — 二十人."
  32: "ἔτι ἅπαξ — もう一度だけ. δέκα — 十人."
  33: "ὡς ἐπαύσατο λαλῶν — 語り終えると (παύομαι — «переставать»). ἀπέστρεψεν εἰς τὸν τόπον αὐτοῦ — 自分の場所へ帰った."
