# jp-box, Второе послание к Коринфянам, глава 4. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 4: служение и открытая истина (1–6), сокровище в глиняных сосудах (7–12),
# «я веровал, потому и говорил» (13), надежда воскресения (14–15),
# внешний и внутренний человек (16–18).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет, <j>/<mo> не ставятся.
# 〔…〕: 4:6 — церковное Ἰησοῦ (в базе ἐν προσώπῳ Χριστοῦ); 4:10 — церковное κυρίου
#       (в базе τοῦ Ἰησοῦ). Оба проверены по базе: Ἰησοῦ в 4:6 — 0, κυρίου в 4:10 — 0.
# Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

tr_code: jp-box
book: 2kor
chapter: 4
draft: true

verses:
  1: "こういうわけで、わたしたちは、憐[あわ]れみを受[う]けてこの務[つと]めを任[まか]された者[もの]として、落胆[らくたん]しないのである。"
  2: "かえって、わたしたちは恥[は]ずべき隠[かく]し事[ごと]を捨[す]て去[さ]った。悪巧[わるだく]みによって歩[あゆ]むことなく、神[かみ]の言葉[ことば]を偽[いつわ]ることもなく、真理[しんり]を明[あき]らかに示[しめ]すことによって、神[かみ]の御前[みまえ]で、すべての人[ひと]の良心[りょうしん]に自分自身[じぶんじしん]を推薦[すいせん]しているのである。"
  3: "もしわたしたちの福音[ふくいん]が覆[おお]われているとしても、それは滅[ほろ]びゆく者[もの]たちの間[あいだ]で覆[おお]われているのである。"
  4: "彼[かれ]らのうちで、この世[よ]の神[かみ]が、信[しん]じない者[もの]たちの思[おも]いを盲目[もうもく]にした。神[かみ]の像[ぞう]であるキリストの栄光[えいこう]の福音[ふくいん]の光[ひかり]が、彼[かれ]らに輝[かがや]かないためである。"
  5: "なぜなら、わたしたちが宣[の]べ伝[つた]えているのは、自分自身[じぶんじしん]ではなく、イエス・キリストが主[しゅ]であるということ、そして、わたしたち自身[じしん]はイエスのゆえにあなたがたの僕[しもべ]たちであるということだからである。"
  6: "なぜなら、「闇[やみ]から光[ひかり]が輝[かがや]き出[で]る」と言[い]われた神[かみ]は、わたしたちの心[こころ]を照[て]らされた。それは、〔イエス・〕キリストの御顔[みかお]にある神[かみ]の栄光[えいこう]を知[し]る知識[ちしき]の光[ひかり]を、わたしたちに与[あた]えるためである。"
  7: "しかし、わたしたちはこの宝[たから]を土[つち]の器[うつわ]の中[なか]に持[も]っている。それは、力[ちから]の絶大[ぜつだい]さが神[かみ]に属[ぞく]し、わたしたちから出[で]たものでないためである。"
  8: "わたしたちは、四方[しほう]から患難[かんなん]を受[う]けているが、行[い]き詰[づ]まってはいない。途方[とほう]に暮[く]れているが、絶望[ぜつぼう]してはいない。"
  9: "迫害[はくがい]されているが、見捨[みす]てられてはいない。倒[たお]されているが、滅[ほろ]びてはいない。"
  10: "わたしたちはいつも、〔主[しゅ]〕イエスの死[し]を体[からだ]に負[お]いながら、イエスの命[いのち]もまた、わたしたちの体[からだ]に現[あらわ]されるためである。"
  11: "なぜなら、生[い]きているわたしたちは、いつもイエスのために死[し]に渡[わた]されているからである。それは、イエスの命[いのち]もまた、死[し]すべきわたしたちの肉[にく]に現[あらわ]されるためである。"
  12: "こうして、死[し]はわたしたちのうちに働[はたら]き、命[いのち]はあなたがたのうちに働[はたら]いているのである。"
  13: "わたしたちは、同[おな]じ信仰[しんこう]の霊[れい]を持[も]っているので、「わたしは信[しん]じた、それゆえに語[かた]った」と書[か]かれているとおり、わたしたちも信じ、それゆえに語[かた]るのである。"
  14: "主[しゅ]イエスを復活[ふっかつ]させた方[かた]が、わたしたちもイエスとともに復活[ふっかつ]させ、あなたがたとともに御前[みまえ]に立[た]たせてくださることを知[し]っているのである。"
  15: "なぜなら、すべてのことはあなたがたのためであり、恵[めぐ]みが多[おお]くの人[ひと]々[びと]を通[とお]して豊[ゆた]かになり、その感謝[かんしゃ]が満[み]ちあふれて神[かみ]の栄光[えいこう]となるためである。"
  16: "だから、わたしたちは落胆[らくたん]しない。たとえ外[そと]なる人[ひと]が朽[く]ちていっても、内[うち]なる人[ひと]は日[ひ]ごとに新[あら]たにされていくのである。"
  17: "なぜなら、わたしたちの一時[いちじ]の軽[かる]い苦難[くなん]は、はるかに越[こ]えて、ますます絶大[ぜつだい]な、永遠[えいえん]の栄光[えいこう]の重[おも]みを、わたしたちのために生[う]み出[だ]しているからである。"
  18: "わたしたちは、見[み]えるものに目[め]を留[と]めず、見[み]えないものに目[め]を留[と]めているのである。見[み]えるものは一時[いちじ]のもの、見[み]えないものは永遠[えいえん]のものだからである。"

notes:
  1: "διακονία — 務め; ἠλεήθημεν — 憐れみを受けて; ἐγκακοῦμεν — 落胆する."
  2: "τὰ κρυπτὰ τῆς αἰσχύνης — 恥ずべき隠し事; πανουργία — 悪巧み; δολοῦντες τὸν λόγον — 神の言葉を偽る; συνείδησις — 良心."
  3: "κεκαλυμμένον — 覆われている; ἀπολλύμενοι — 滅びゆく者たち."
  4: "ὁ θεὸς τοῦ αἰῶνος τούτου — «бог века сего»; この世の神. ἐτύφλωσεν τὰ νοήματα — 思いを盲目にした; εἰκὼν τοῦ θεοῦ — 神の像."
  5: "Ἰησοῦν Χριστὸν κύριον — イエス・キリストが主であること; δοῦλοι ὑμῶν διὰ Ἰησοῦν — イエスのゆえにあなたがたの僕."
  6: "Ἐκ σκότους φῶς λάμψει — цитата Писания (Быт 1:3), 「」. В базе ἐν προσώπῳ Χριστοῦ без Ἰησοῦ (проверено: Ἰησοῦ в стихе — 0); церковный текст (Елизаветинская, jp-joc) читает с ним — 〔イエス・〕."
  7: "ὀστράκινα σκεύη — 土の器; ὑπερβολὴ τῆς δυνάμεως — 力の絶大さ."
  8: "θλιβόμενοι — 患難を受ける; στενοχωρούμενοι — 行き詰まる; ἀπορούμενοι / ἐξαπορούμενοι — 途方に暮れる / 絶望する."
  9: "διωκόμενοι — 迫害される; ἐγκαταλειπόμενοι — 見捨てられる; καταβαλλόμενοι — 倒される."
  10: "νέκρωσις — 死; в базе τοῦ Ἰησοῦ (κυρίου в стихе — 0); церковный текст (Елизаветинская, jp-joc) читает τοῦ κυρίου Ἰησοῦ — 〔主〕."
  11: "θνητὴ σάρξ — 死すべき肉; παραδιδόμεθα — 渡されている."
  12: "ἐνεργεῖται — 働いている (оба члена)."
  13: "τὸ αὐτὸ πνεῦμα τῆς πίστεως — 同じ信仰の霊. Цитата Пс 115:1 (LXX 115:1), 「」."
  14: "σὺν Ἰησοῦ — イエスとともに (у Синод. «через Иисуса», у jp-joc «イイススを以て» — замена, не добавление, без 〔〕)."
  15: "πλεονάσασα — 豊かになり; εἰς τὴν δόξαν τοῦ θεοῦ — 神の栄光となる."
  16: "ὁ ἔξω / ὁ ἔσω ἄνθρωπος — 外なる人 / 内なる人; ἀνακαινοῦται — 新たにされる."
  17: "καθ᾽ ὑπερβολὴν εἰς ὑπερβολήν — はるかに越えて、ますます; βάρος δόξης — 栄光の重み."
  18: "σκοπούντων — 目を留める; πρόσκαιρα / αἰώνια — 一時のもの / 永遠のもの."
