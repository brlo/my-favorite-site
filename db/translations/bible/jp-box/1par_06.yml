# jp-box, 1-я Паралипоменон, глава 6. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc и jp-ni в 1 Пар нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Нумерация — славяно-синодальная (как в csl-ru): в главе 81 стих.
#   • 6:1–15 = LXX 5:27–41 — родословие Левия от Левия до Иоседека (перенесено из гл. 5:
#     по LXX оно стоит в конце 5-й главы, по csl и евр. нумерации — в начале 6-й);
#   • 6:16–81 = LXX 6:1–66 — сыны Левия (16–19), ветви Гирсона (20–21), Каафа (22–28),
#     Мерари (29–30), певцы при Давиде: Еман (31–38), Асаф (39–43), Ефан (44–47),
#     служение левитов и священников (48–53), города священников (54–60),
#     города остальных левитов (61–81).
# Соответствие: LXX 6:N = csl 6:(N+15).
# Родословия транслитерированы с греческого; формы корпуса сохранены: レビ, ゲルション,
# カアト, メラリ, ロベニ, セメイ, モオリ, オムシ, アムラム, イサアル, ヘブロン, オジエル,
# アミナダブ, コラ, アシル, エルカナ, アビアサフ, サムエル, エマン, アサフ, エタン,
# アザリヤ, サドク, アヒマアス, ヒルキヤ, シケム, ガゼル, ベト・ホロン, ダビル, アシロト,
# エセボン, ヤゼル, マハナイム, ロオブ, ケデモト, ケデシュ, カリアタイム, レモン, ボソル.
# Паритет LXX/csl: где csl расходится с греческим в именах или числах, в тексте стоит
# греческое чтение (родословия передаются с греческого), а csl-вариант назван в notes.
# 〔…〕 нет. Красного и синего нет. Прямой речи нет, кавычек нет.
# Сносок ⟨…⟩ нет: 幕屋, 契約の箱, 祭壇, 燔祭, 至聖所, 祭司, レビ人, 逃れの町 уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: 1par
chapter: 6
draft: true

verses:
  1: "レビの子[こ]らは、ゲルション、カアト、メラリ。"
  2: "カアトの子[こ]らは、アムラム、イサアル、ヘブロン、オジエル。"
  3: "アムラムの子[こ]らは、アロン、モーセ、マリアム。アロンの子[こ]らは、ナダブ、アビウド、エレアザル、イタマル。"
  4: "エレアザルはピネハスを生[う]み、ピネハスはアビスを生[う]み、"
  5: "アビスはボカイを生[う]み、ボカイはオジを生[う]み、"
  6: "オジはザラヤを生[う]み、ザラヤはマリエルを生[う]み、"
  7: "マリエルはアマルヤを生[う]み、アマルヤはアヒトブを生[う]み、"
  8: "アヒトブはサドクを生[う]み、サドクはアヒマアスを生[う]み、"
  9: "アヒマアスはアザリヤを生[う]み、アザリヤはヨハナンを生[う]み、"
  10: "ヨハナンはアザリヤを生[う]んだ。この者[もの]は、ソロモンがエルサレムに建[た]てた家[いえ]で祭司[さいし]の務[つと]めをした。"
  11: "アザリヤはアマルヤを生[う]み、アマルヤはアヒトブを生[う]み、"
  12: "アヒトブはサドクを生[う]み、サドクはサルムを生[う]み、"
  13: "サルムはヒルキヤを生[う]み、ヒルキヤはアザリヤを生[う]み、"
  14: "アザリヤはセラヤを生[う]み、セラヤはヨサダクを生[う]んだ。"
  15: "ヨサダクは、ユダとエルサレムがネブカドネツァルの手[て]によって移[うつ]されるとき、その移[うつ]りの中[なか]へ行[い]った。"
  16: "レビの子[こ]らは、ゲルション、カアト、メラリ。"
  17: "ゲルションの子[こ]らの名[な]は次[つぎ]のとおりである。ロベニとセメイ。"
  18: "カアトの子[こ]らは、アムラム、イサアル、ヘブロン、オジエル。"
  19: "メラリの子[こ]らは、モオリとオムシ。これらが、その氏族[しぞく]ごとのレビの父[ちち]の家[いえ]である。"
  20: "ゲルションには、その子[こ]ロベニ、その子[こ]イエト、その子[こ]ゼマ、"
  21: "その子[こ]ヨアハ、その子[こ]アディ、その子[こ]ゼラ、その子[こ]イエトリ。"
  22: "カアトの子[こ]らは、その子[こ]アミナダブ、その子[こ]コラ、その子[こ]アシル、"
  23: "その子[こ]エルカナ、その子[こ]アビアサフ、その子[こ]アシル、"
  24: "その子[こ]タハト、その子[こ]ウリエル、その子[こ]ウジヤ、その子[こ]サウル。"
  25: "エルカナの子[こ]らは、アマサイとアヒモト、"
  26: "その子[こ]エルカナ、その子[こ]スフィ、その子[こ]ナハト、"
  27: "その子[こ]エリアブ、その子[こ]イダエル、その子[こ]エルカナ。"
  28: "サムエルの子[こ]らは、長子[ちょうし]サニとアビヤ。"
  29: "メラリの子[こ]らは、モオリ、その子[こ]ロベニ、その子[こ]セメイ、その子[こ]ウザ、"
  30: "その子[こ]ソメア、その子[こ]アンギア、その子[こ]アサヤ。"
  31: "次[つぎ]の者[もの]たちは、契約[けいやく]の箱[はこ]が安置[あんち]されたとき、ダビデが主[しゅ]の家[いえ]で歌[うた]い手[て]たちの指導[しどう]にあたらせた者[もの]たちである。"
  32: "彼[かれ]らは、ソロモンがエルサレムに主[しゅ]の家[いえ]を建[た]てるまで、証[あかし]の幕屋[まくや]の前[まえ]で楽器[がっき]を用[もち]いて務[つと]めをした。そして、彼[かれ]らはその定[さだ]めに従[したが]って、それぞれの務[つと]めに立[た]った。"
  33: "立[た]っている者[もの]たちとその子[こ]らは次[つぎ]のとおりである。カアトの子[こ]らのうち、歌[うた]い手[て]であるエマン。エマンはヨエルの子[こ]、サムエルの子[こ]、"
  34: "エルカナの子[こ]、エダドの子[こ]、エリエルの子[こ]、ティエの子[こ]、"
  35: "スフの子[こ]、エルカナの子[こ]、メトの子[こ]、アマシウの子[こ]、"
  36: "エルカナの子[こ]、ヨエルの子[こ]、アザリヤの子[こ]、ゼパニヤの子[こ]、"
  37: "タハトの子[こ]、アシルの子[こ]、アビアサフの子[こ]、コラの子[こ]、"
  38: "イサアルの子[こ]、カアトの子[こ]、レビの子[こ]、イスラエルの子[こ]である。"
  39: "彼[かれ]の兄弟[きょうだい]アサフは、彼[かれ]の右[みぎ]に立[た]った。アサフはバラキヤの子[こ]、シマの子[こ]、"
  40: "ミカエルの子[こ]、マアセヤの子[こ]、マルキヤの子[こ]、"
  41: "エタニの子[こ]、ゼライの子[こ]、アダヤの子[こ]、"
  42: "エタンの子[こ]、ザマの子[こ]、セメイの子[こ]、"
  43: "エカの子[こ]、ゲルションの子[こ]、レビの子[こ]である。"
  44: "その兄弟[きょうだい]であるメラリの子[こ]らは、左[ひだり]の側[がわ]にいた。エタン。エタンはキシャイの子[こ]、アブディの子[こ]、マロクの子[こ]、"
  45: "アセビの子[こ]、アマツヤの子[こ]、ヒルキヤの子[こ]、"
  46: "アマサイの子[こ]、バニの子[こ]、シェメルの子[こ]、"
  47: "モオリの子[こ]、オムシの子[こ]、メラリの子[こ]、レビの子[こ]である。"
  48: "彼[かれ]らの兄弟[きょうだい]たち、すなわちレビ人[びと]は、その父[ちち]の家[いえ]ごとに、神[かみ]の家[いえ]の幕屋[まくや]の務[つと]めのあらゆる仕事[しごと]に任[まか]された。"
  49: "アロンとその子[こ]らは、燔祭[はんさい]の祭壇[さいだん]と香[こう]の祭壇で香[こう]をたき、至聖所[しせいしょ]のすべての務[つと]めをし、イスラエルのために贖[あがな]いをした。それは、神[かみ]のしもべモーセが命[めい]じたすべてに従[したが]ってのことである。"
  50: "アロンの子[こ]らは次[つぎ]のとおりである。エレアザル、その子[こ]。ピネハス、その子[こ]、アビス、その子[こ]、"
  51: "ボカイ、その子[こ]、オジ、その子[こ]、ザラヤ、その子[こ]、"
  52: "マリエル、その子[こ]、アマルヤ、その子[こ]、アヒトブ、その子[こ]、"
  53: "サドク、その子[こ]、アヒマアス、その子[こ]である。"
  54: "彼[かれ]らの住[す]まい、すなわちその境[さかい]の内[うち]の村[むら]々[むら]は次[つぎ]のとおりである。まず、カアト人[びと]の氏族[しぞく]であるアロンの子[こ]らに。くじが彼[かれ]らに当[あ]たったからである。"
  55: "彼[かれ]らは、ユダの地[ち]にあるヘブロンと、その周[まわ]りの村[むら]々[むら]をアロンの子[こ]らに与[あた]えた。"
  56: "また、その町[まち]の畑[はたけ]とその村[むら]々[むら]は、イェフォンネの子[こ]カレブに与[あた]えた。"
  57: "アロンの子[こ]らには、逃[に]げの町[まち]として、ヘブロン、リブナとその周[まわ]りの村[むら]々[むら]、セルナとその周[まわ]りの村[むら]々[むら]、エシュタモとその周[まわ]りの村[むら]々[むら]を与[あた]えた。"
  58: "イエタルとその周[まわ]りの村[むら]々[むら]、ダビルとその周[まわ]りの村[むら]々[むら]、"
  59: "アサンとその周[まわ]りの村[むら]々[むら]、アタンとその周[まわ]りの村[むら]々[むら]、バサミスとその周[まわ]りの村[むら]々[むら]、"
  60: "また、ベニヤミンの部族[ぶぞく]から、ガベエとその周[まわ]りの村[むら]々[むら]、ガレメトとその周[まわ]りの村[むら]々[むら]、アンコクとその周[まわ]りの村[むら]々[むら]である。彼[かれ]らの町[まち]はすべて、その氏族[しぞく]ごとに十三[じゅうさん]の町[まち]であった。"
  61: "カアトの子[こ]らのうちの残[のこ]りの者[もの]たちには、その氏族[しぞく]のうちから、マナセの部族[ぶぞく]の半[はん]分[ぶん]から、くじによって十[とお]の町[まち]が与[あた]えられた。"
  62: "ゲルションの子[こ]らには、その氏族[しぞく]ごとに、イッサカルの部族[ぶぞく]、アシェルの部族[ぶぞく]、ナフタリの部族[ぶぞく]、バシャンにあるマナセの部族[ぶぞく]から、十三[じゅうさん]の町[まち]を与[あた]えた。"
  63: "メラリの子[こ]らには、その氏族[しぞく]ごとに、ルベンの部族[ぶぞく]、ガドの部族[ぶぞく]、ゼブルンの部族[ぶぞく]から、くじによって十二[じゅうに]の町[まち]を与[あた]えた。"
  64: "イスラエルの子[こ]らは、レビ人[びと]に町[まち]々[まち]とその周[まわ]りの村[むら]々[むら]を与[あた]えた。"
  65: "彼[かれ]らは、ユダの子[こ]らの部族[ぶぞく]とシメオンの子[こ]らの部族[ぶぞく]から、名[な]を呼[よ]ばれたこれらの町[まち]々[まち]を、くじによって与[あた]えた。"
  66: "カアトの子[こ]らの氏族[しぞく]のうち、その境[さかい]の内[うち]の町[まち]々[まち]は、エフライムの部族[ぶぞく]から出[で]たものであった。"
  67: "彼[かれ]らはカアトの子[こ]らに、逃[に]げの町[まち]として、エフライムの山[やま]にあるシケムとその周[まわ]りの村[むら]々[むら]、ガゼルとその周[まわ]りの村[むら]々[むら]を与[あた]えた。"
  68: "イエクマアムとその周[まわ]りの村[むら]々[むら]、ベト・ホロンとその周[まわ]りの村[むら]々[むら]、"
  69: "エグラムとその周[まわ]りの村[むら]々[むら]、ゲテレモンとその周[まわ]りの村[むら]々[むら]、"
  70: "また、マナセの部族[ぶぞく]の半[はん]分[ぶん]から、アナルとその周[まわ]りの村[むら]々[むら]、イエブラアムとその周[まわ]りの村[むら]々[むら]を、氏族[しぞく]ごとに、残[のこ]りのカアトの子[こ]らに与[あた]えた。"
  71: "ゲルションの子[こ]らには、マナセの部族[ぶぞく]の半[はん]分[ぶん]の氏族[しぞく]のうちから、バシャンにあるゴランとその周[まわ]りの村[むら]々[むら]、アシロトとその周[まわ]りの村[むら]々[むら]を与[あた]えた。"
  72: "また、イッサカルの部族[ぶぞく]から、ケデシュとその周[まわ]りの村[むら]々[むら]、デベリとその周[まわ]りの村[むら]々[むら]、"
  73: "ダボルとその周[まわ]りの村[むら]々[むら]、アナムとその周[まわ]りの村[むら]々[むら]、"
  74: "また、アシェルの部族[ぶぞく]から、マサルとその周[まわ]りの村[むら]々[むら]、アバランとその周[まわ]りの村[むら]々[むら]、"
  75: "イカクとその周[まわ]りの村[むら]々[むら]、ロオブとその周[まわ]りの村[むら]々[むら]、"
  76: "また、ナフタリの部族[ぶぞく]から、ガリラヤにあるケデシュとその周[まわ]りの村[むら]々[むら]、ハモトとその周[まわ]りの村[むら]々[むら]、カリアタイムとその周[まわ]りの村[むら]々[むら]である。"
  77: "残[のこ]りのメラリの子[こ]らには、ゼブルンの部族[ぶぞく]から、レモンとその周[まわ]りの村[むら]々[むら]、タキヤとその周[まわ]りの村[むら]々[むら]を与[あた]えた。"
  78: "また、ヨルダン川[がわ]の向[む]こう側[がわ]、エリコのあたり、ヨルダンの西[にし]に面[めん]した所[ところ]で、ルベンの部族[ぶぞく]から、荒野[こうや]にあるボソルとその周[まわ]りの村[むら]々[むら]、ヤサとその周[まわ]りの村[むら]々[むら]、"
  79: "ケデモトとその周[まわ]りの村[むら]々[むら]、モファアトとその周[まわ]りの村[むら]々[むら]、"
  80: "また、ガドの部族[ぶぞく]から、ギレアデのラモトとその周[まわ]りの村[むら]々[むら]、マハナイムとその周[まわ]りの村[むら]々[むら]、"
  81: "エセボンとその周[まわ]りの村[むら]々[むら]、ヤゼルとその周[まわ]りの村[むら]々[むら]である。"

notes:
  1: "Γεδσων, Κααθ, Μεραρι — ゲルション, カアト, メラリ (формы корпуса, Исх 6:16). С этого стиха LXX начинает родословие Левия: по LXX оно стоит в конце гл. 5 (5:27–41), по славяно-синодальной нумерации — в начале гл. 6 (6:1–15); поэтому здесь 81 стих, а LXX 6:N = csl 6:(N+15). Наш ст. 1 = LXX 5:27 = csl 6:1."
  2: "Αμβραμ καὶ Ισσααρ, Χεβρων καὶ Οζιηλ — Амрам, Исаар, Хеврон, Озиил; формы корпуса: アムラム, イサアル, ヘブロン, オジエル (Исх 6:18; Числ 3:19)."
  3: "Ααρων καὶ Μωϋσῆς καὶ Μαριαμ — Аарон, Моисей и Мариам (в корпусе マリアム, Исх 6:20); Ναδαβ καὶ Αβιουδ, Ελεαζαρ καὶ Ιθαμαρ — Надав, Авиуд, Елеазар, Ифамар (ナダブ, アビウド, エレアザル, イタマル)."
  4: "ἐγέννησεν — родил (формула родословия); Φινεες — ピネハス (в корпусе); Αβισου — Авис(у) (евр. אֲבִישׁוּעַ), в корпусе нет, передано с греческого アビス."
  5: "Βωκαι — ボカイ (евр. בֻּקִּי); Οζι — オジ (Уззий, עֻזִּי). Имена переданы с греческого; csl: «вокхий», «озий»."
  6: "Ζαραια — ザラヤ (Зерахия, זְרַחְיָה); Μαριηλ — マリエル (Мераиоф, מְרָיוֹת; LXX Μαριηλ)."
  7: "Αμαρια — アマルヤ (Амария); Αχιτωβ — アヒトブ (Ахитув; в корпусе, 2 Цар 8:17)."
  8: "Σαδωκ — サドク; Αχιμαας — アヒマアス (формы корпуса, 2 Цар 8:17; 15:27)."
  9: "Αζαρια — アザリヤ (в корпусе アザリヤ); Ιωαναν — ヨハナン (Иоанан); ср. 6:50–53, где та же цепь дана вторично."
  10: "ἱεράτευσεν — священствовал (ἱερατεύω); ἐν τῷ οἴκῳ, ᾧ ᾠκοδόμησεν Σαλωμων — «в доме, который построил Соломон» (слав. «в дому, егоже созда соломон»); это Азария, сын Иоанана (ср. 6:25)."
  11: "Второй круг родословия (от Азарии до Иоседека); имена те же, что в ст. 7. Греч. ἐγέννησεν Αζαρια — без артикля при подлежащем."
  12: "Σαλωμ — サルム (Шаллум, שַׁלּוּם); в корпусе для царя Шаллума — シャルム, здесь по греческому サルム."
  13: "Χελκιας — ヒルキヤ (в корпусе, 4 Цар 18:18); Αζαρια — アザリヤ."
  14: "Σαραια — セラヤ (Сераия, в корпусе セラヤ); Ιωσαδακ — ヨサダク (Иоседек, יְהוֹצָדָק)."
  15: "ἐπορεύθη ἐν τῇ μετοικίᾳ — «пошёл в переселение» (μετοικία — плен); μετὰ Ιουδα καὶ Ιερουσαλημ — с Иудой и Иерусалимом; ἐν χειρὶ Ναβουχοδονοσορ — рукою Навуходоносора (в корпусе ネブカドネツァル). Csl добавляет «Господь пресели» и «в вавилон» — в греч. этого нет."
  16: "Υἱοὶ Λευι· Γεδσων, Κααθ καὶ Μεραρι — повторение 6:1 (LXX 5:27) в начале нового раздела; по славяно-синодальной нумерации это ст. 16 (= LXX 6:1). Соответствие дальше: LXX 6:N = csl 6:(N+15)."
  17: "καὶ ταῦτα τὰ ὀνόματα τῶν υἱῶν Γεδσων — «и вот имена сынов Гирсона»; Λοβενι καὶ Σεμει — ロベニ и セメイ (формы корпуса, Исх 6:17; Числ 3:18). Слав. (6:17): «сия имена сынов герсоних: ловений и семей»."
  18: "υἱοὶ Κααθ — сыны Каафа; Αμβραμ, Ισσααρ, Χεβρων, Οζιηλ — アムラム, イサアル, ヘブロン, オジエル (формы корпуса; ср. 6:2). Слав. (6:18) повторяет этот стих."
  19: "υἱοὶ Μεραρι· Μοολι καὶ Ομουσι — モオリ и オムシ (в Числ 3:20 Μουσι; формы корпуса). καὶ αὗται αἱ πατριαὶ τοῦ Λευι κατὰ πατριὰς αὐτῶν — «вот отечества Левия по родам их» (слав. «сии роди левиини по отечеством их»); тире в издании отделяет итоговую формулу."
  20: "Формула τῷ ... υἱὸς αὐτοῦ — дательный принадлежности: «у Гирсона: Ливни, сын его...». Ιεεθ — イエト (Иахаф), Ζεμμα — ゼマ (Зимма). Слав. (6:20): «ловений сын его, иеф сын его, семна сын его»."
  21: "Ιωαχ — ヨアハ (Иоах); Αδδι — アディ (Иддо); Ζαρα — ゼラ (Зерах, в корпусе ゼラ); Ιεθρι — イエトリ (Иефрай). Тире закрывает ветвь Гирсона. Слав. (6:21): «иола, аддо, зара, иефри»."
  22: "υἱοὶ Κααθ — новая ветвь; Αμιναδαβ, Κορε, Ασιρ — アミナダブ, コラ, アシル (формы корпуса, Исх 6:21.24). В LXX ветвь Каафа начинается с Аминадава (в евр. — с Ицгара), ср. ст. 37. Слав. (6:22)."
  23: "Ελκανα — エルカナ, Αβιασαφ — アビアサフ (формы корпуса, Исх 6:24); Ασιρ повторён из ст. 22 (в греч. дважды). Слав. (6:23)."
  24: "Θααθ — タハト (Тахаф); Ουριηλ — ウリエル; Οζια — ウジヤ; Σαουλ — サウル. Слав. (6:24) вместо Θααθ читает «кааф»: «кааф сын его, уриил сын его, озиа сын его, саул сын его»."
  25: "καὶ υἱοὶ Ελκανα — «и сыны Елканы» (новое подлежащее, ср. ст. 23); Αμασι — アマサイ (Амасай), Αχιμωθ — アヒモト (Ахимоф). Слав. (6:25) при каждом имени добавляет «сын его»."
  26: "Σουφι — スフィ (Цуф/Софай); Νααθ — ナハト (Нахаф, в корпусе ナハト). Слав. (6:26): «елкана, суфий, нааф»."
  27: "Ελιαβ — エリアブ (в корпусе, 1 Цар 16:6); Ιδαερ — イダエル (Иерохам); ветвь Елканы замыкается Елканой же. Слав. (6:27) добавляет в конце «самуил сын его»."
  28: "υἱοὶ Σαμουηλ — сыны Самуила; ὁ πρωτότοκος — первенец; Σανι — サニ (LXX читает Σανι; в csl и евр. — Иоиль); Αβια — アビヤ (в корпусе アビヤ). Слав. (6:28): «первенец его иоиль и вторый авиа» — расхождение с LXX отмечено."
  29: "υἱοὶ Μεραρι — ветвь Мерари; Μοολι — モオリ, Λοβενι — ロベニ, Σεμει — セメイ, Οζα — ウザ (Уза, в корпусе ウザ). Слав. (6:29): «мооли, ловений, семей, озиа»."
  30: "Σομεα — ソメア (Шимей/Шима); Αγγια — アンギア (Хаггия); Ασαια — アサヤ (в корпусе アサヤ). Слав. (6:30): «саммаа, ананий, асаиа»."
  31: "οὗτοι οὓς κατέστησεν Δαυιδ — «вот те, кого поставил Давид» (καθίστημι); ἐπὶ χεῖρας ᾀδόντων — «в руки поющих», т. е. в ведение певцов (слав. «над певцы»); ἐν τῇ καταπαύσει τῆς κιβωτοῦ — «при упокоении ковчега», когда ковчег был поставлен (2 Цар 6). Слав. (6:31)."
  32: "ἦσαν λειτουργοῦντες — служили (λειτουργέω); ἐναντίον τῆς σκηνῆς οἴκου μαρτυρίου — пред скинией дома свидетельства (証の幕屋); ἐν ὀργάνοις — на музыкальных инструментах; κατὰ τὴν κρίσιν αὐτῶν — «по уставу их»; ἐπὶ τὰς λειτουργίας — на служения. Слав. (6:32)."
  33: "οἱ ἑστηκότες — «стоящие», поставленные на служение; ψαλτῳδός — певец (слав. «певец»); Αιμαν — エマン (Еман, в корпусе エマン); цепь родительных: υἱὸς Ιωηλ υἱοῦ Σαμουηλ — «сын Иоиля, сына Самуила». Слав. (6:33)."
  34: "υἱοῦ Ελκανα υἱοῦ Ηδαδ υἱοῦ Ελιηλ υἱοῦ Θιε — цепь без глагола, продолжается в ст. 35; Ηδαδ — エダド, Θιε — ティエ (в евр. иначе). Слав. (6:34): «сына елканова, сына еремеилева, сына елиавля, сына наафова»."
  35: "υἱοῦ Σουφ υἱοῦ Ελκανα υἱοῦ Μεθ᾽ υἱοῦ Αμασιου — Σουφ スフ (Цуф), Μεθ メト (Махаф), Αμασιου アマシウ (Амасай); с апострофом Μεθ᾽ — вероятно, усечённая форма. Слав. (6:35)."
  36: "υἱοῦ Ελκανα υἱοῦ Ιωηλ υἱοῦ Αζαρια υἱοῦ Σαφανια — Σαφανια ゼパニヤ (Софония, в корпусе ゼパニヤ). Слав. (6:36)."
  37: "υἱοῦ Θααθ υἱοῦ Ασιρ υἱοῦ Αβιασαφ υἱοῦ Κορε — タハト, アシル, アビアサフ, コラ (см. ст. 22–23). Слав. (6:37): «сына маафова, сына ассерова, сына авиасафова, сына асирова, сына кореова» — Асир дважды."
  38: "Цепь замыкается: Ισσααρ — Κααθ — Λευι — Ισραηλ (Исаар, Кааф, Левий, Израиль); тире закрывает родословие Емана. Слав. (6:38)."
  39: "καὶ ἀδελφὸς αὐτοῦ Ασαφ ὁ ἑστηκὼς ἐν δεξιᾷ αὐτοῦ — брат его Асаф, стоящий по правую руку его (вторая группа певцов); Βαραχια — バラキヤ (в корпусе, Мф 23:35); Σαμαα — シマ. Слав. (6:39)."
  40: "Μιχαηλ, Μαασια, Μελχια — ミカエル, マアセヤ, マルキヤ. Слав. (6:40): «сына михаилова, сына масилова, сына мелхиева»."
  41: "Αθανι — エタニ (Ефан); Ζαραι — ゼライ (Зерах); Αδια — アダヤ (Адаия). Слав. (6:41)."
  42: "Αιθαν — エタン (в корпусе エタン, Пс 88:1); Ζαμμα — ザマ, Σεμει — セメイ. Слав. (6:42)."
  43: "Ηχα — エカ (тёмное место; LXX Ηχα, в евр. Иахаф); цепь замыкается на Левии; тире закрывает родословие Асафа. Слав. (6:43)."
  44: "υἱοὶ Μεραρι ἀδελφοῦ αὐτῶν ἐξ ἀριστερῶν — сыны Мерари, брата их, с левой стороны (третья группа); Κισαι — キシャイ (Кишай), Αβδι — アブディ, Μαλωχ — マロク (Маллух). Слав. (6:44): «ефам сын хусии, сына авдиина, сына малохова»."
  45: "Ασεβι — アセビ (Хашавия); Αμεσσια — アマツヤ (в корпусе アマツヤ); Χελκιου — ヒルキヤ. Слав. (6:45): «савиева, амасиева, хелкиева»."
  46: "Αμασαι, Βανι, Σεμμηρ — アマサイ, バニ, シェメル (Амасия, Ваний, Шемер). Слав. (6:46)."
  47: "Μοολι, Μουσι, Μεραρι, Λευι — モオリ, オムシ, メラリ, レビ (см. ст. 19); цепь Ефана замыкается на Левии. Слав. (6:47): «моолиина, мусиева, мерарина, левиина»."
  48: "ἀδελφοὶ αὐτῶν κατ᾽ οἴκους πατριῶν — братья их по домам отцов; οἱ Λευῖται δεδομένοι εἰς πᾶσαν ἐργασίαν λειτουργίας σκηνῆς οἴκου τοῦ θεοῦ — левиты, отданные на всякое дело служения скинии дома Божия (perfect от δίδωμι). Слав. (6:48)."
  49: "θυμιῶντες — воскуряющие (θυμιάω); θυσιαστήριον τῶν ὁλοκαυτωμάτων — жертвенник всесожжений (燔祭の祭壇); θυσιαστήριον τῶν θυμιαμάτων — жертвенник курений; ἅγια τῶν ἁγίων — Святое святых (至聖所); ἐξιλάσκεσθαι περὶ Ισραηλ — совершать очищение за Израиля; παῖς τοῦ θεοῦ — раб Божий. Слав. (6:49)."
  50: "καὶ οὗτοι υἱοὶ Ααρων — и вот сыны Аарона; цепь первосвященников (ср. 6:4–15); точка после Ελεαζαρ в издании членит фразу. Αβισου — アビス (ср. 6:4). Слав. (6:50)."
  51: "Βωκαι, Οζι, Ζαραια — ボカイ, オジ, ザラヤ: те же имена, что в 6:5–6. Слав. (6:51): «вокхий, озий, сарей»."
  52: "Μαριηλ, Αμαρια, Αχιτωβ — マリエル, アマルヤ, アヒトブ (ср. 6:6–7). Слав. (6:52)."
  53: "Σαδωκ, Αχιμαας — サドク, アヒマアス; родословие первосвященников обрывается на Ахимаасе (далее 6:9–15). Слав. (6:53)."
  54: "αὗται αἱ κατοικίαι αὐτῶν ἐν ταῖς κώμαις αὐτῶν ἐν τοῖς ὁρίοις αὐτῶν — «вот поселения их в селениях их, в пределах их»; τῇ πατριᾷ τοῦ Κααθι — «отечеству Каафитянина» (слав. «племени каафову»); ὅτι αὐτοῖς ἐγένετο ὁ κλῆρος — ибо им выпал жребий. Слав. (6:54): «тем бо бысть жребий»."
  55: "ἔδωκαν αὐτοῖς — дали им; Χεβρων ἐν γῇ Ιουδα — Хеврон в земле Иудиной; περισπόρια — предместья, зависимые селения (слав. «подградия»); κύκλῳ αὐτῆς — вокруг него. Слав. (6:55)."
  56: "πεδία τῆς πόλεως — поля города (слав. «села града»); τῷ Χαλεβ υἱῷ Ιεφοννη — Халеву, сыну Иефоннии (カレブ, イェフォンネ — формы корпуса). Слав. (6:56)."
  57: "πόλεις τῶν φυγαδευτηρίων — города убежища (逃れの町); Λοβνα — リブナ (в корпусе リブナ); Σελνα — セルナ (LXX Σελνα); Εσθαμω — エシュタモ (Ештемоа; в Нав 21:16 греч. иначе). Слав. (6:57): «хеврон, ловну, алом»."
  58: "Ιεθθαρ — イエタル (Иаттир, יַתִּיר); Δαβιρ — ダビル (в корпусе ダビル). Слав. (6:58): «келом, давир»."
  59: "Ασαν, Ατταν, Βασαμυς — アサン, アタン, バサミス (в евр. Аин, Ютта, Беф-Шемеш; LXX иначе). Слав. (6:59): «асан, вефсамис, вефсур»."
  60: "Γαβεε — ガベエ (Гива/Гева); Γαλεμεθ — ガレメト (Алемеф); Αγχωχ — アンコク (LXX Αγχωχ, в евр. Анафоф?); πᾶσαι αἱ πόλεις αὐτῶν τρισκαίδεκα — всех городов их тринадцать (слав. «тринадесять»). Слав. (6:60)."
  61: "τοῖς υἱοῖς Κααθ τοῖς καταλοίποις — остальным сынам Каафа (κατάλοιπος); ἐκ τῶν πατριῶν — из отечеств; κλήρῳ πόλεις δέκα — по жребию десять городов. Слав. (6:61)."
  62: "κατὰ πατριὰς αὐτῶν — по отечествам (родам) их; ἐκ φυλῆς Ισσαχαρ ... ἐν τῇ Βασαν — из племени Иссахара, Асира, Неффалима и Манассии в Васане; πόλεις τρισκαίδεκα — тринадцать городов. Слав. (6:62)."
  63: "κλήρῳ πόλεις δέκα δύο — по жребию двенадцать городов (Рувим, Гад, Завулон). Слав. (6:63)."
  64: "Итог: сыны Израиля дали левитам города и предместья их (Числ 35:1–8). Слав. (6:64)."
  65: "ἐν κλήρῳ — по жребию; ἃς ἐκάλεσεν αὐτὰς ἐπ᾽ ὀνόματος — «которые назвал их по имени», т. е. поименованные; Συμεων — シメオン (в корпусе シメオン). Слав. (6:65)."
  66: "ἀπὸ τῶν πατριῶν υἱῶν Κααθ — из отечеств сынов Каафа; πόλεις τῶν ὁρίων αὐτῶν — города пределов их; ἐκ φυλῆς Εφραιμ — из племени Ефрема. Слав. (6:66)."
  67: "ἔδωκαν αὐτῷ — дали ему (ед. ч. вместо мн.; слав. «им»); Συχεμ — シケム, Γαζερ — ガゼル (формы корпуса, Нав 21:21); ἐν ὄρει Εφραιμ — на горе Ефремовой. Слав. (6:67)."
  68: "Ιεκμααμ — イエクマアム (Иокмеам); Βαιθωρων — ベト・ホロン (в корпусе ベト・ホロン). Слав. (6:68): «екмаан, вефорон»."
  69: "Εγλαμ — エグラム (Аиалон, אִיָּלוֹן); Γεθρεμμων — ゲテレモン (Гаф-Риммон). Слав. (6:69): «елон, гефремон»."
  70: "ἀπὸ τοῦ ἡμίσους φυλῆς Μανασση — из половины племени Манассии; Αναρ — アナル (Анер), Ιεβλααμ — イエブラアム (Билеам); κατὰ πατριὰν — по отечеству; τοῖς καταλοίποις — остальным. Слав. (6:70)."
  71: "ἀπὸ πατριῶν ἡμίσους φυλῆς — «из отечеств половины племени»; Γωλαν ἐκ τῆς Βασαν — Голан в Васане; Ασηρωθ — アシロト (в корпусе アシロト). Слав. (6:71): «гавлон ... асироф»."
  72: "Κεδες — ケデシュ (в корпусе ケデシュ); Δεβερι — デベリ (Давраф). Слав. (6:72): «кедес ... надар»."
  73: "Δαβωρ — ダボル (евр. דָּבְרַת; слав. «рамоф»); Αναμ — アナム (Анем, עָנֵם). Слав. (6:73)."
  74: "Μασαλ — マサル (Машал, מָשָׁל); Αβαραν — アバラン (Авдон, עַבְדּוֹן). Слав. (6:74)."
  75: "Ικακ — イカク (Хукок, חוּקֹק); Ροωβ — ロオブ (Рехов, в корпусе ロオブ). Слав. (6:75)."
  76: "Κεδες ἐν τῇ Γαλιλαίᾳ — Кедес в Галилее (слав. «кадис в галилеи»); Χαμωθ — ハモト (Хаммон); Καριαθαιμ — カリアタイム (в корпусе カリアタイム). Слав. (6:76)."
  77: "τοῖς καταλοίποις — остальным; Ρεμμων — レモン (в корпусе レモン); Θαχχια — タキヤ (LXX Θαχχια; слав. «фавор» — иное чтение). Слав. (6:77)."
  78: "κατὰ δυσμὰς τοῦ Ιορδάνου — «к западу от Иордана» (слав. «противу востока иорданова» — иначе); Βοσορ ἐν τῇ ἐρήμῳ — Восор в пустыне; Ιασα — ヤサ (Иааца). Слав. (6:78)."
  79: "Καδημωθ — ケデモト (в корпусе ケデモト); Μωφααθ — モファアト (Мефааф). Слав. (6:79): «кадимоф ... моапсаф»."
  80: "Ραμωθ Γαλααδ — Рамоф Галаадский (ラモト・ギレアデ); Μααναιμ — マハナイム (в корпусе マハナイム). Слав. (6:80): «раммоф галаадский ... наим»."
  81: "Εσεβων, Ιαζηρ — エセボン, ヤゼル (формы корпуса, Числ 21:25.32); конец списка левитских городов. Слав. (6:81): «есевон ... иазир»."
