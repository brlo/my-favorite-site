# jp-box, 1-я Паралипоменон, глава 6. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc и jp-ni в 1 Пар нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 6: сыны Левия (1–4), ветви Гирсона (5–6), Каафа (7–13), Мерари (14–15),
# певцы при Давиде: Еман (16–23), Асаф (24–28), Ефан (29–32), служение левитов и
# священников (33–38), города священников (39–45), города остальных левитов (46–66).
# Нумерация — строго по gr-lxx-byz: в LXX в этой главе 66 стихов, в csl — 81, потому что
# csl 6:1–15 = LXX 5:27–41 (родословие Левия до Иоседека). Соответствие: LXX 6:N = csl 6:(N+15).
# Родословия транслитерированы с греческого; формы корпуса сохранены: レビ, ゲルション,
# カアト, メラリ, ロベニ, セメイ, モオリ, オムシ, アムラム, イサアル, ヘブロン, オジエル,
# アミナダブ, コラ, アシル, エルカナ, アビアサフ, サムエル, エマン, アサフ, エタン,
# アザリヤ, サドク, アヒマアス, ヒルキヤ, シケム, ガゼル, ベト・ホロン, ダビル, アシロト,
# エセボン, ヤゼル, マハナイム, ロオブ, ケデモト, ケデシュ, カリアタイム, レモン, ボソル.
# Паритет LXX/csl: где csl расходится с греческим в именах или числах, в тексте стоит
# греческое чтение (родословия передаются с греческого), а csl-вариант назван в notes.
# 〔…〕 нет. Красного и синего нет. Прямой речи нет, кавычек нет.
# Сносок ⟨…⟩ нет: 幕屋, 契約の箱, 祭壇, 燔祭, 至聖所, 祭司, レビ人, 逃れの町 уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: 1par
chapter: 6
draft: true

verses:
  1: "レビの子[こ]らは、ゲルション、カアト、メラリ。"
  2: "ゲルションの子[こ]らの名[な]は次[つぎ]のとおりである。ロベニとセメイ。"
  3: "カアトの子[こ]らは、アムラム、イサアル、ヘブロン、オジエル。"
  4: "メラリの子[こ]らは、モオリとオムシ。これらが、その氏族[しぞく]ごとのレビの父[ちち]の家[いえ]である。"
  5: "ゲルションには、その子[こ]ロベニ、その子[こ]イエト、その子[こ]ゼマ、"
  6: "その子[こ]ヨアハ、その子[こ]アディ、その子[こ]ゼラ、その子[こ]イエトリ。"
  7: "カアトの子[こ]らは、その子[こ]アミナダブ、その子[こ]コラ、その子[こ]アシル、"
  8: "その子[こ]エルカナ、その子[こ]アビアサフ、その子[こ]アシル、"
  9: "その子[こ]タハト、その子[こ]ウリエル、その子[こ]ウジヤ、その子[こ]サウル。"
  10: "エルカナの子[こ]らは、アマサイとアヒモト、"
  11: "その子[こ]エルカナ、その子[こ]スフィ、その子[こ]ナハト、"
  12: "その子[こ]エリアブ、その子[こ]イダエル、その子[こ]エルカナ。"
  13: "サムエルの子[こ]らは、長子[ちょうし]サニとアビヤ。"
  14: "メラリの子[こ]らは、モオリ、その子[こ]ロベニ、その子[こ]セメイ、その子[こ]ウザ、"
  15: "その子[こ]ソメア、その子[こ]アンギア、その子[こ]アサヤ。"
  16: "次[つぎ]の者[もの]たちは、契約[けいやく]の箱[はこ]が安置[あんち]されたとき、ダビデが主[しゅ]の家[いえ]で歌[うた]い手[て]たちの指導[しどう]にあたらせた者[もの]たちである。"
  17: "彼[かれ]らは、ソロモンがエルサレムに主[しゅ]の家[いえ]を建[た]てるまで、証[あかし]の幕屋[まくや]の前[まえ]で楽器[がっき]を用[もち]いて務[つと]めをした。そして、彼[かれ]らはその定[さだ]めに従[したが]って、それぞれの務[つと]めに立[た]った。"
  18: "立[た]っている者[もの]たちとその子[こ]らは次[つぎ]のとおりである。カアトの子[こ]らのうち、歌[うた]い手[て]であるエマン。エマンはヨエルの子[こ]、サムエルの子[こ]、"
  19: "エルカナの子[こ]、エダドの子[こ]、エリエルの子[こ]、ティエの子[こ]、"
  20: "スフの子[こ]、エルカナの子[こ]、メトの子[こ]、アマシウの子[こ]、"
  21: "エルカナの子[こ]、ヨエルの子[こ]、アザリヤの子[こ]、ゼパニヤの子[こ]、"
  22: "タハトの子[こ]、アシルの子[こ]、アビアサフの子[こ]、コラの子[こ]、"
  23: "イサアルの子[こ]、カアトの子[こ]、レビの子[こ]、イスラエルの子[こ]である。"
  24: "彼[かれ]の兄弟[きょうだい]アサフは、彼[かれ]の右[みぎ]に立[た]った。アサフはバラキヤの子[こ]、シマの子[こ]、"
  25: "ミカエルの子[こ]、マアセヤの子[こ]、マルキヤの子[こ]、"
  26: "エタニの子[こ]、ゼライの子[こ]、アダヤの子[こ]、"
  27: "エタンの子[こ]、ザマの子[こ]、セメイの子[こ]、"
  28: "エカの子[こ]、ゲルションの子[こ]、レビの子[こ]である。"
  29: "その兄弟[きょうだい]であるメラリの子[こ]らは、左[ひだり]の側[がわ]にいた。エタン。エタンはキシャイの子[こ]、アブディの子[こ]、マロクの子[こ]、"
  30: "アセビの子[こ]、アマツヤの子[こ]、ヒルキヤの子[こ]、"
  31: "アマサイの子[こ]、バニの子[こ]、シェメルの子[こ]、"
  32: "モオリの子[こ]、オムシの子[こ]、メラリの子[こ]、レビの子[こ]である。"
  33: "彼[かれ]らの兄弟[きょうだい]たち、すなわちレビ人[びと]は、その父[ちち]の家[いえ]ごとに、神[かみ]の家[いえ]の幕屋[まくや]の務[つと]めのあらゆる仕事[しごと]に任[まか]された。"
  34: "アロンとその子[こ]らは、燔祭[はんさい]の祭壇[さいだん]と香[こう]の祭壇で香[こう]をたき、至聖所[しせいしょ]のすべての務[つと]めをし、イスラエルのために贖[あがな]いをした。それは、神[かみ]のしもべモーセが命[めい]じたすべてに従[したが]ってのことである。"
  35: "アロンの子[こ]らは次[つぎ]のとおりである。エレアザル、その子[こ]。ピネハス、その子[こ]、アビス、その子[こ]、"
  36: "ボカイ、その子[こ]、オジ、その子[こ]、ザラヤ、その子[こ]、"
  37: "マリエル、その子[こ]、アマルヤ、その子[こ]、アヒトブ、その子[こ]、"
  38: "サドク、その子[こ]、アヒマアス、その子[こ]である。"
  39: "彼[かれ]らの住[す]まい、すなわちその境[さかい]の内[うち]の村[むら]々[むら]は次[つぎ]のとおりである。まず、カアト人[びと]の氏族[しぞく]であるアロンの子[こ]らに。くじが彼[かれ]らに当[あ]たったからである。"
  40: "彼[かれ]らは、ユダの地[ち]にあるヘブロンと、その周[まわ]りの村[むら]々[むら]をアロンの子[こ]らに与[あた]えた。"
  41: "また、その町[まち]の畑[はたけ]とその村[むら]々[むら]は、イェフォンネの子[こ]カレブに与[あた]えた。"
  42: "アロンの子[こ]らには、逃[に]げの町[まち]として、ヘブロン、リブナとその周[まわ]りの村[むら]々[むら]、セルナとその周[まわ]りの村[むら]々[むら]、エシュタモとその周[まわ]りの村[むら]々[むら]を与[あた]えた。"
  43: "イエタルとその周[まわ]りの村[むら]々[むら]、ダビルとその周[まわ]りの村[むら]々[むら]、"
  44: "アサンとその周[まわ]りの村[むら]々[むら]、アタンとその周[まわ]りの村[むら]々[むら]、バサミスとその周[まわ]りの村[むら]々[むら]、"
  45: "また、ベニヤミンの部族[ぶぞく]から、ガベエとその周[まわ]りの村[むら]々[むら]、ガレメトとその周[まわ]りの村[むら]々[むら]、アンコクとその周[まわ]りの村[むら]々[むら]である。彼[かれ]らの町[まち]はすべて、その氏族[しぞく]ごとに十三[じゅうさん]の町[まち]であった。"
  46: "カアトの子[こ]らのうちの残[のこ]りの者[もの]たちには、その氏族[しぞく]のうちから、マナセの部族[ぶぞく]の半[はん]分[ぶん]から、くじによって十[とお]の町[まち]が与[あた]えられた。"
  47: "ゲルションの子[こ]らには、その氏族[しぞく]ごとに、イッサカルの部族[ぶぞく]、アシェルの部族[ぶぞく]、ナフタリの部族[ぶぞく]、バシャンにあるマナセの部族[ぶぞく]から、十三[じゅうさん]の町[まち]を与[あた]えた。"
  48: "メラリの子[こ]らには、その氏族[しぞく]ごとに、ルベンの部族[ぶぞく]、ガドの部族[ぶぞく]、ゼブルンの部族[ぶぞく]から、くじによって十二[じゅうに]の町[まち]を与[あた]えた。"
  49: "イスラエルの子[こ]らは、レビ人[びと]に町[まち]々[まち]とその周[まわ]りの村[むら]々[むら]を与[あた]えた。"
  50: "彼[かれ]らは、ユダの子[こ]らの部族[ぶぞく]とシメオンの子[こ]らの部族[ぶぞく]から、名[な]を呼[よ]ばれたこれらの町[まち]々[まち]を、くじによって与[あた]えた。"
  51: "カアトの子[こ]らの氏族[しぞく]のうち、その境[さかい]の内[うち]の町[まち]々[まち]は、エフライムの部族[ぶぞく]から出[で]たものであった。"
  52: "彼[かれ]らはカアトの子[こ]らに、逃[に]げの町[まち]として、エフライムの山[やま]にあるシケムとその周[まわ]りの村[むら]々[むら]、ガゼルとその周[まわ]りの村[むら]々[むら]を与[あた]えた。"
  53: "イエクマアムとその周[まわ]りの村[むら]々[むら]、ベト・ホロンとその周[まわ]りの村[むら]々[むら]、"
  54: "エグラムとその周[まわ]りの村[むら]々[むら]、ゲテレモンとその周[まわ]りの村[むら]々[むら]、"
  55: "また、マナセの部族[ぶぞく]の半[はん]分[ぶん]から、アナルとその周[まわ]りの村[むら]々[むら]、イエブラアムとその周[まわ]りの村[むら]々[むら]を、氏族[しぞく]ごとに、残[のこ]りのカアトの子[こ]らに与[あた]えた。"
  56: "ゲルションの子[こ]らには、マナセの部族[ぶぞく]の半[はん]分[ぶん]の氏族[しぞく]のうちから、バシャンにあるゴランとその周[まわ]りの村[むら]々[むら]、アシロトとその周[まわ]りの村[むら]々[むら]を与[あた]えた。"
  57: "また、イッサカルの部族[ぶぞく]から、ケデシュとその周[まわ]りの村[むら]々[むら]、デベリとその周[まわ]りの村[むら]々[むら]、"
  58: "ダボルとその周[まわ]りの村[むら]々[むら]、アナムとその周[まわ]りの村[むら]々[むら]、"
  59: "また、アシェルの部族[ぶぞく]から、マサルとその周[まわ]りの村[むら]々[むら]、アバランとその周[まわ]りの村[むら]々[むら]、"
  60: "イカクとその周[まわ]りの村[むら]々[むら]、ロオブとその周[まわ]りの村[むら]々[むら]、"
  61: "また、ナフタリの部族[ぶぞく]から、ガリラヤにあるケデシュとその周[まわ]りの村[むら]々[むら]、ハモトとその周[まわ]りの村[むら]々[むら]、カリアタイムとその周[まわ]りの村[むら]々[むら]である。"
  62: "残[のこ]りのメラリの子[こ]らには、ゼブルンの部族[ぶぞく]から、レモンとその周[まわ]りの村[むら]々[むら]、タキヤとその周[まわ]りの村[むら]々[むら]を与[あた]えた。"
  63: "また、ヨルダン川[がわ]の向[む]こう側[がわ]、エリコのあたり、ヨルダンの西[にし]に面[めん]した所[ところ]で、ルベンの部族[ぶぞく]から、荒野[こうや]にあるボソルとその周[まわ]りの村[むら]々[むら]、ヤサとその周[まわ]りの村[むら]々[むら]、"
  64: "ケデモトとその周[まわ]りの村[むら]々[むら]、モファアトとその周[まわ]りの村[むら]々[むら]、"
  65: "また、ガドの部族[ぶぞく]から、ギレアデのラモトとその周[まわ]りの村[むら]々[むら]、マハナイムとその周[まわ]りの村[むら]々[むら]、"
  66: "エセボンとその周[まわ]りの村[むら]々[むら]、ヤゼルとその周[まわ]りの村[むら]々[むら]である。"

notes:
  1: "Υἱοὶ Λευι· Γεδσων, Κααθ καὶ Μεραρι — повторение 5:27 в начале нового раздела. В csl вся эта глава на 15 стихов позже (csl 6:1–15 = LXX 5:27–41), поэтому у LXX 66 стихов, у csl 81; соответствие: LXX 6:N = csl 6:(N+15)."
  2: "καὶ ταῦτα τὰ ὀνόματα τῶν υἱῶν Γεδσων — «и вот имена сынов Гирсона»; Λοβενι καὶ Σεμει — ロベニ и セメイ (формы корпуса, Исх 6:17; Числ 3:18). Слав. (6:17): «сия имена сынов герсоних: ловений и семей»."
  3: "υἱοὶ Κααθ — сыны Каафа; Αμβραμ, Ισσααρ, Χεβρων, Οζιηλ — アムラム, イサアル, ヘブロン, オジエル (формы корпуса; ср. 5:28). Слав. (6:18) повторяет этот стих."
  4: "υἱοὶ Μεραρι· Μοολι καὶ Ομουσι — モオリ и オムシ (в Числ 3:20 Μουσι; формы корпуса). καὶ αὗται αἱ πατριαὶ τοῦ Λευι κατὰ πατριὰς αὐτῶν — «вот отечества Левия по родам их» (слав. «сии роди левиини по отечеством их»); тире в издании отделяет итоговую формулу."
  5: "Формула τῷ ... υἱὸς αὐτοῦ — дательный принадлежности: «у Гирсона: Ливни, сын его...». Ιεεθ — イエト (Иахаф), Ζεμμα — ゼマ (Зимма). Слав. (6:20): «ловений сын его, иеф сын его, семна сын его»."
  6: "Ιωαχ — ヨアハ (Иоах); Αδδι — アディ (Иддо); Ζαρα — ゼラ (Зерах, в корпусе ゼラ); Ιεθρι — イエトリ (Иефрай). Тире закрывает ветвь Гирсона. Слав. (6:21): «иола, аддо, зара, иефри»."
  7: "υἱοὶ Κααθ — новая ветвь; Αμιναδαβ, Κορε, Ασιρ — アミナダブ, コラ, アシル (формы корпуса, Исх 6:21.24). В LXX ветвь Каафа начинается с Аминадава (в евр. — с Ицгара), ср. ст. 22. Слав. (6:22)."
  8: "Ελκανα — エルカナ, Αβιασαφ — アビアサフ (формы корпуса, Исх 6:24); Ασιρ повторён из ст. 7 (в греч. дважды). Слав. (6:23)."
  9: "Θααθ — タハト (Тахаф); Ουριηλ — ウリエル; Οζια — ウジヤ; Σαουλ — サウル. Слав. (6:24) вместо Θααθ читает «кааф»: «кааф сын его, уриил сын его, озиа сын его, саул сын его»."
  10: "καὶ υἱοὶ Ελκανα — «и сыны Елканы» (новое подлежащее, ср. ст. 8); Αμασι — アマサイ (Амасай), Αχιμωθ — アヒモト (Ахимоф). Слав. (6:25) при каждом имени добавляет «сын его»."
  11: "Σουφι — スフィ (Цуф/Софай); Νααθ — ナハト (Нахаф, в корпусе ナハト). Слав. (6:26): «елкана, суфий, нааф»."
  12: "Ελιαβ — エリアブ (в корпусе, 1 Цар 16:6); Ιδαερ — イダエル (Иерохам); ветвь Елканы замыкается Елканой же. Слав. (6:27) добавляет в конце «самуил сын его»."
  13: "υἱοὶ Σαμουηλ — сыны Самуила; ὁ πρωτότοκος — первенец; Σανι — サニ (LXX читает Σανι; в csl и евр. — Иоиль); Αβια — アビヤ (в корпусе アビヤ). Слав. (6:28): «первенец его иоиль и вторый авиа» — расхождение с LXX отмечено."
  14: "υἱοὶ Μεραρι — ветвь Мерари; Μοολι — モオリ, Λοβενι — ロベニ, Σεμει — セメイ, Οζα — ウザ (Уза, в корпусе ウザ). Слав. (6:29): «мооли, ловений, семей, озиа»."
  15: "Σομεα — ソメア (Шимей/Шима); Αγγια — アンギア (Хаггия); Ασαια — アサヤ (в корпусе アサヤ). Слав. (6:30): «саммаа, ананий, асаиа»."
  16: "οὗτοι οὓς κατέστησεν Δαυιδ — «вот те, кого поставил Давид» (καθίστημι); ἐπὶ χεῖρας ᾀδόντων — «в руки поющих», т. е. в ведение певцов (слав. «над певцы»); ἐν τῇ καταπαύσει τῆς κιβωτοῦ — «при упокоении ковчега», когда ковчег был поставлен (2 Цар 6). Слав. (6:31)."
  17: "ἦσαν λειτουργοῦντες — служили (λειτουργέω); ἐναντίον τῆς σκηνῆς οἴκου μαρτυρίου — пред скинией дома свидетельства (証の幕屋); ἐν ὀργάνοις — на музыкальных инструментах; κατὰ τὴν κρίσιν αὐτῶν — «по уставу их»; ἐπὶ τὰς λειτουργίας — на служения. Слав. (6:32)."
  18: "οἱ ἑστηκότες — «стоящие», поставленные на служение; ψαλτῳδός — певец (слав. «певец»); Αιμαν — エマン (Еман, в корпусе エマン); цепь родительных: υἱὸς Ιωηλ υἱοῦ Σαμουηλ — «сын Иоиля, сына Самуила». Слав. (6:33)."
  19: "υἱοῦ Ελκανα υἱοῦ Ηδαδ υἱοῦ Ελιηλ υἱοῦ Θιε — цепь без глагола, продолжается в ст. 20; Ηδαδ — エダド, Θιε — ティエ (в евр. иначе). Слав. (6:34): «сына елканова, сына еремеилева, сына елиавля, сына наафова»."
  20: "υἱοῦ Σουφ υἱοῦ Ελκανα υἱοῦ Μεθ᾽ υἱοῦ Αμασιου — Σουφ スフ (Цуф), Μεθ メト (Махаф), Αμασιου アマシウ (Амасай); с апострофом Μεθ᾽ — вероятно, усечённая форма. Слав. (6:35)."
  21: "υἱοῦ Ελκανα υἱοῦ Ιωηλ υἱοῦ Αζαρια υἱοῦ Σαφανια — Σαφανια ゼパニヤ (Софония, в корпусе ゼパニヤ). Слав. (6:36)."
  22: "υἱοῦ Θααθ υἱοῦ Ασιρ υἱοῦ Αβιασαφ υἱοῦ Κορε — タハト, アシル, アビアサフ, コラ (см. ст. 7–8). Слав. (6:37): «сына маафова, сына ассерова, сына авиасафова, сына асирова, сына кореова» — Асир дважды."
  23: "Цепь замыкается: Ισσααρ — Κααθ — Λευι — Ισραηλ (Исаар, Кааф, Левий, Израиль); тире закрывает родословие Емана. Слав. (6:38)."
  24: "καὶ ἀδελφὸς αὐτοῦ Ασαφ ὁ ἑστηκὼς ἐν δεξιᾷ αὐτοῦ — брат его Асаф, стоящий по правую руку его (вторая группа певцов); Βαραχια — バラキヤ (в корпусе, Мф 23:35); Σαμαα — シマ. Слав. (6:39)."
  25: "Μιχαηλ, Μαασια, Μελχια — ミカエル, マアセヤ, マルキヤ. Слав. (6:40): «сына михаилова, сына масилова, сына мелхиева»."
  26: "Αθανι — エタニ (Ефан); Ζαραι — ゼライ (Зерах); Αδια — アダヤ (Адаия). Слав. (6:41)."
  27: "Αιθαν — エタン (в корпусе エタン, Пс 88:1); Ζαμμα — ザマ, Σεμει — セメイ. Слав. (6:42)."
  28: "Ηχα — エカ (тёмное место; LXX Ηχα, в евр. Иахаф); цепь замыкается на Левии; тире закрывает родословие Асафа. Слав. (6:43)."
  29: "υἱοὶ Μεραρι ἀδελφοῦ αὐτῶν ἐξ ἀριστερῶν — сыны Мерари, брата их, с левой стороны (третья группа); Κισαι — キシャイ (Кишай), Αβδι — アブディ, Μαλωχ — マロク (Маллух). Слав. (6:44): «ефам сын хусии, сына авдиина, сына малохова»."
  30: "Ασεβι — アセビ (Хашавия); Αμεσσια — アマツヤ (в корпусе アマツヤ); Χελκιου — ヒルキヤ. Слав. (6:45): «савиева, амасиева, хелкиева»."
  31: "Αμασαι, Βανι, Σεμμηρ — アマサイ, バニ, シェメル (Амасия, Ваний, Шемер). Слав. (6:46)."
  32: "Μοολι, Μουσι, Μεραρι, Λευι — モオリ, オムシ, メラリ, レビ (см. ст. 4); цепь Ефана замыкается на Левии. Слав. (6:47): «моолиина, мусиева, мерарина, левиина»."
  33: "ἀδελφοὶ αὐτῶν κατ᾽ οἴκους πατριῶν — братья их по домам отцов; οἱ Λευῖται δεδομένοι εἰς πᾶσαν ἐργασίαν λειτουργίας σκηνῆς οἴκου τοῦ θεοῦ — левиты, отданные на всякое дело служения скинии дома Божия (perfect от δίδωμι). Слав. (6:48)."
  34: "θυμιῶντες — воскуряющие (θυμιάω); θυσιαστήριον τῶν ὁλοκαυτωμάτων — жертвенник всесожжений (燔祭の祭壇); θυσιαστήριον τῶν θυμιαμάτων — жертвенник курений; ἅγια τῶν ἁγίων — Святое святых (至聖所); ἐξιλάσκεσθαι περὶ Ισραηλ — совершать очищение за Израиля; παῖς τοῦ θεοῦ — раб Божий. Слав. (6:49)."
  35: "καὶ οὗτοι υἱοὶ Ααρων — и вот сыны Аарона; цепь первосвященников (ср. 5:30–41); точка после Ελεαζαρ в издании членит фразу. Αβισου — アビス (ср. 5:30). Слав. (6:50)."
  36: "Βωκαι, Οζι, Ζαραια — ボカイ, オジ, ザラヤ: те же имена, что в 5:31–32. Слав. (6:51): «вокхий, озий, сарей»."
  37: "Μαριηλ, Αμαρια, Αχιτωβ — マリエル, アマルヤ, アヒトブ (ср. 5:32–33). Слав. (6:52)."
  38: "Σαδωκ, Αχιμαας — サドク, アヒマアス; родословие первосвященников обрывается на Ахимаасе (далее 5:35–41). Слав. (6:53)."
  39: "αὗται αἱ κατοικίαι αὐτῶν ἐν ταῖς κώμαις αὐτῶν ἐν τοῖς ὁρίοις αὐτῶν — «вот поселения их в селениях их, в пределах их»; τῇ πατριᾷ τοῦ Κααθι — «отечеству Каафитянина» (слав. «племени каафову»); ὅτι αὐτοῖς ἐγένετο ὁ κλῆρος — ибо им выпал жребий. Слав. (6:54): «тем бо бысть жребий»."
  40: "ἔδωκαν αὐτοῖς — дали им; Χεβρων ἐν γῇ Ιουδα — Хеврон в земле Иудиной; περισπόρια — предместья, зависимые селения (слав. «подградия»); κύκλῳ αὐτῆς — вокруг него. Слав. (6:55)."
  41: "πεδία τῆς πόλεως — поля города (слав. «села града»); τῷ Χαλεβ υἱῷ Ιεφοννη — Халеву, сыну Иефоннии (カレブ, イェフォンネ — формы корпуса). Слав. (6:56)."
  42: "πόλεις τῶν φυγαδευτηρίων — города убежища (逃れの町); Λοβνα — リブナ (в корпусе リブナ); Σελνα — セルナ (LXX Σελνα); Εσθαμω — エシュタモ (Ештемоа; в Нав 21:16 греч. иначе). Слав. (6:57): «хеврон, ловну, алом»."
  43: "Ιεθθαρ — イエタル (Иаттир, יַתִּיר); Δαβιρ — ダビル (в корпусе ダビル). Слав. (6:58): «келом, давир»."
  44: "Ασαν, Ατταν, Βασαμυς — アサン, アタン, バサミス (в евр. Аин, Ютта, Беф-Шемеш; LXX иначе). Слав. (6:59): «асан, вефсамис, вефсур»."
  45: "Γαβεε — ガベエ (Гива/Гева); Γαλεμεθ — ガレメト (Алемеф); Αγχωχ — アンコク (LXX Αγχωχ, в евр. Анафоф?); πᾶσαι αἱ πόλεις αὐτῶν τρισκαίδεκα — всех городов их тринадцать (слав. «тринадесять»). Слав. (6:60)."
  46: "τοῖς υἱοῖς Κααθ τοῖς καταλοίποις — остальным сынам Каафа (κατάλοιπος); ἐκ τῶν πατριῶν — из отечеств; κλήρῳ πόλεις δέκα — по жребию десять городов. Слав. (6:61)."
  47: "κατὰ πατριὰς αὐτῶν — по отечествам (родам) их; ἐκ φυλῆς Ισσαχαρ ... ἐν τῇ Βασαν — из племени Иссахара, Асира, Неффалима и Манассии в Васане; πόλεις τρισκαίδεκα — тринадцать городов. Слав. (6:62)."
  48: "κλήρῳ πόλεις δέκα δύο — по жребию двенадцать городов (Рувим, Гад, Завулон). Слав. (6:63)."
  49: "Итог: сыны Израиля дали левитам города и предместья их (Числ 35:1–8). Слав. (6:64)."
  50: "ἐν κλήρῳ — по жребию; ἃς ἐκάλεσεν αὐτὰς ἐπ᾽ ὀνόματος — «которые назвал их по имени», т. е. поименованные; Συμεων — シメオン (в корпусе シメオン). Слав. (6:65)."
  51: "ἀπὸ τῶν πατριῶν υἱῶν Κααθ — из отечеств сынов Каафа; πόλεις τῶν ὁρίων αὐτῶν — города пределов их; ἐκ φυλῆς Εφραιμ — из племени Ефрема. Слав. (6:66)."
  52: "ἔδωκαν αὐτῷ — дали ему (ед. ч. вместо мн.; слав. «им»); Συχεμ — シケム, Γαζερ — ガゼル (формы корпуса, Нав 21:21); ἐν ὄρει Εφραιμ — на горе Ефремовой. Слав. (6:67)."
  53: "Ιεκμααμ — イエクマアム (Иокмеам); Βαιθωρων — ベト・ホロン (в корпусе ベト・ホロン). Слав. (6:68): «екмаан, вефорон»."
  54: "Εγλαμ — エグラム (Аиалон, אִיָּלוֹן); Γεθρεμμων — ゲテレモン (Гаф-Риммон). Слав. (6:69): «елон, гефремон»."
  55: "ἀπὸ τοῦ ἡμίσους φυλῆς Μανασση — из половины племени Манассии; Αναρ — アナル (Анер), Ιεβλααμ — イエブラアム (Билеам); κατὰ πατριὰν — по отечеству; τοῖς καταλοίποις — остальным. Слав. (6:70)."
  56: "ἀπὸ πατριῶν ἡμίσους φυλῆς — «из отечеств половины племени»; Γωλαν ἐκ τῆς Βασαν — Голан в Васане; Ασηρωθ — アシロト (в корпусе アシロト). Слав. (6:71): «гавлон ... асироф»."
  57: "Κεδες — ケデシュ (в корпусе ケデシュ); Δεβερι — デベリ (Давраф). Слав. (6:72): «кедес ... надар»."
  58: "Δαβωρ — ダボル (евр. דָּבְרַת; слав. «рамоф»); Αναμ — アナム (Анем, עָנֵם). Слав. (6:73)."
  59: "Μασαλ — マサル (Машал, מָשָׁל); Αβαραν — アバラン (Авдон, עַבְדּוֹן). Слав. (6:74)."
  60: "Ικακ — イカク (Хукок, חוּקֹק); Ροωβ — ロオブ (Рехов, в корпусе ロオブ). Слав. (6:75)."
  61: "Κεδες ἐν τῇ Γαλιλαίᾳ — Кедес в Галилее (слав. «кадис в галилеи»); Χαμωθ — ハモト (Хаммон); Καριαθαιμ — カリアタイム (в корпусе カリアタイム). Слав. (6:76)."
  62: "τοῖς καταλοίποις — остальным; Ρεμμων — レモン (в корпусе レモン); Θαχχια — タキヤ (LXX Θαχχια; слав. «фавор» — иное чтение). Слав. (6:77)."
  63: "κατὰ δυσμὰς τοῦ Ιορδάνου — «к западу от Иордана» (слав. «противу востока иорданова» — иначе); Βοσορ ἐν τῇ ἐρήμῳ — Восор в пустыне; Ιασα — ヤサ (Иааца). Слав. (6:78)."
  64: "Καδημωθ — ケデモト (в корпусе ケデモト); Μωφααθ — モファアト (Мефааф). Слав. (6:79): «кадимоф ... моапсаф»."
  65: "Ραμωθ Γαλααδ — Рамоф Галаадский (ラモト・ギレアデ); Μααναιμ — マハナイム (в корпусе マハナイム). Слав. (6:80): «раммоф галаадский ... наим»."
  66: "Εσεβων, Ιαζηρ — エセボン, ヤゼル (формы корпуса, Числ 21:25.32); конец списка левитских городов. Слав. (6:81): «есевон ... иазир»."
