# jp-box, Числа, глава 4. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в этих главах нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 4: служба сынов Каафа и утварь святилища (1–20), Елеазар (16),
# служба Гирсона (21–28), Мерари (29–33), перепись трёх родов (34–48), исполнение (49).
# Речь Бога — 「…」: 2–16, 18–20, 22–28, 29–33; прочее — рассказ. Красного нет.
# 〔…〕: 4:26 〔祭壇の周りのもの、〕 — в gr-lxx-byz стиха нет слов о жертвеннике
# (проверено: BOOK=chis CH=4 bracket_check.rb "4:26:θυσιαστηρι" → НЕТ); csl-ru даёт
# «и яже окрест олтаря», это чтение масоретского текста («двор, который вокруг скинии
# и жертвенника»). Вставка церковного чтения отмечена скобками.
# Сносок ⟨…⟩ нет: レビ人 пояснён в 1:47; 祭壇, 幕屋, 燭台, 供えのパン, シケル уже в корпусе.
# Возраст служащих левитов: LXX и csl-ru — от 25 до 50 лет; Синодальный (с масоретского) —
# от 30 лет; переводим по LXX. Числа: Кааф 2 750, Гирсон 2 630, Мерари 3 200, всего 8 580.
# В 4:31 LXX дважды даёт «подножия и столбы» и «покрывало» — повтор сохранён (ср. Исх 26).
# jp-ni не использовался.

