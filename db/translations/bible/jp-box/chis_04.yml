verses:
  1: "主[しゅ]はモーセとアロンに語[かた]って言[い]われた。"
  2: "「レビの子[こ]らの中[なか]から、カアトの子らの数[かず]を、その氏族[しぞく]に従[したが]って、その父[ちち]の家[いえ]に従って取[と]りなさい。"
  3: "二十五歳[さい]から五十歳[さい]まで、証[あかし]の幕屋[まくや]で仕事[しごと]をするために務[つと]めに入[はい]る者[もの]はみな。"
  4: "これが、証[あかし]の幕屋[まくや]でのカアトの子[こ]らの仕事[しごと]である。聖[せい]なるもののうちでもっとも聖[せい]なるものである。"
  5: "アロンとその子[こ]らは、宿営[しゅくえい]が出発[しゅっぱつ]するときに入[はい]り、覆[おお]いの垂[た]れ幕[まく]を下[おろ]して、それで証[あかし]の箱[はこ]を覆い、"
  6: "その上[うえ]に青[あお]い皮[かわ]の覆[おお]いを置[お]き、その上に青[あお]一色[いっしょく]の布[ぬの]をかけ、その担[にな]い棒[ぼう]を差[さ]し込[こ]みなさい。"
  7: "供[そな]えのパンの机[つくえ]の上[うえ]には、紫[むらさき]一色[いっしょく]の布[ぬの]をかけ、その上に皿[さら]、香[こう]の器[うつわ]、杯[さかずき]、注[そそ]ぎの器を置[お]き、その上にいつもあるパンがあるようにしなさい。"
  8: "その上[うえ]に緋[ひ]の布[ぬの]をかけ、青[あお]い皮[かわ]の覆[おお]いでそれを覆い、その担[にな]い棒[ぼう]を差[さ]し込[こ]みなさい。"
  9: "彼[かれ]らは青[あお]い布[ぬの]を取[と]り、ともし火[び]の燭台[しょくだい]とその灯[ともしび]、その火挟[ひばさ]み、その灰皿[はいざら]、およびその中[なか]で務[つと]めをする油[あぶら]のすべての器[うつわ]を覆[おお]い、"
  10: "これを、そのすべての器[うつわ]とともに青[あお]い皮[かわ]の覆[おお]いに入[い]れ、担[にな]い棒[ぼう]の上[うえ]に載[の]せなさい。"
  11: "金[きん]の祭壇[さいだん]の上[うえ]には青[あお]い布[ぬの]をかけ、青い皮[かわ]の覆[おお]いでそれを覆い、その担[にな]い棒[ぼう]を差[さ]し込[こ]みなさい。"
  12: "彼[かれ]らは聖所[せいしょ]で務[つと]めに用[もち]いるすべての務めの器[うつわ]を取[と]り、青[あお]い布[ぬの]に入[はい]れて、青い皮[かわ]の覆[おお]いで覆い、担[にな]い棒[ぼう]の上[うえ]に載[の]せなさい。"
  13: "祭壇[さいだん]の上[うえ]に覆[おお]いを置[お]き、その上に紫[むらさき]一色[いっしょく]の布[ぬの]をかけなさい。"
  14: "その上[うえ]に、その上で務[つと]めをするすべての器[うつわ]、すなわち火皿[ひざら]、肉挟[にくばさ]み、鉢[はち]、覆[おお]い、および祭壇[さいだん]のすべての器を置[お]き、その上に青[あお]い皮[かわ]の覆いをかけ、その担[にな]い棒[ぼう]を差[さ]し込[こ]みなさい。彼[かれ]らは紫の布[ぬの]を取[と]り、洗[あら]い盤[ばん]とその台座[だいざ]を覆い、それを青い皮の覆いに入[はい]れ、担い棒の上に載[の]せなさい。"
  15: "アロンとその子[こ]らが、宿営[しゅくえい]の出発[しゅっぱつ]のときに聖[せい]なるものと聖なるもののすべての器[うつわ]を覆[おお]い終[お]えたなら、その後[のち]でカアトの子らが入[はい]って運[はこ]びなさい。彼[かれ]らは聖なるものに触[ふ]れてはならない。死[し]なないためである。証[あかし]の幕屋[まくや]のこれらのものを運ぶのはカアトの子らである。"
  16: "祭司[さいし]アロンの子[こ]エレアザルは、ともし火[び]の油[あぶら]、調[ととの]え香[こう]、毎日[まいにち]の素祭[そさい]、聖別[せいべつ]の油、幕屋全体[ぜんたい]、およびその中[なか]にあるすべてのものの監督[かんとく]である。聖所[せいしょ]とそのすべての仕事[しごと]において。」"
  17: "主[しゅ]はモーセとアロンに語[かた]って言[い]われた。"
  18: "「レビ人[びと]の中[なか]から、カアトの氏族[しぞく]の部族[ぶぞく]を滅[ほろ]ぼしてはならない。"
  19: "彼[かれ]らが聖[せい]なるもののうちでもっとも聖なるものに近[ちか]づくときに、死[し]なずに生[い]きるために、彼らにこうしなさい。アロンとその子[こ]らが入[はい]って、彼らをそれぞれの務[つと]めに、それぞれの運[はこ]ぶべきものに従[したが]って置[お]きなさい。"
  20: "彼[かれ]らは、聖[せい]なるものをのぞき見[み]ようとして入[はい]ってはならない。死[し]なないためである。」"
  21: "主[しゅ]はモーセに語[かた]って言[い]われた。"
  22: "「ゲルションの子[こ]らの数[かず]を、その父[ちち]の家[いえ]に従[したが]って、その氏族[しぞく]に従って取[と]りなさい。"
  23: "二十五歳[さい]から五十歳[さい]まで、証[あかし]の幕屋[まくや]でその仕事[しごと]をするために務[つと]めに入[はい]る者[もの]はみな、数[かぞ]えなさい。"
  24: "これが、ゲルションの氏族[しぞく]の務[つと]め、すなわち運[はこ]ぶべきものである。"
  25: "彼[かれ]らは、幕屋[まくや]の幕[まく]、証[あかし]の幕屋とその覆[おお]い、その上[うえ]の青[あお]い皮[かわ]の覆い、証の幕屋の入口[いりぐち]の垂[た]れ幕、"
  26: "庭[にわ]の幕[まく]、証[あかし]の幕屋[まくや]のそばにあるもの、〔祭壇[さいだん]の周[まわ]りのもの、〕その残[のこ]りのもの、およびそのすべての務[つと]めの器[うつわ]、すなわち彼[かれ]らがそれをもって務めるもの。彼らはそのとおりに行[おこな]う。"
  27: "ゲルションの子[こ]らの務[つと]めはすべて、アロンとその子らの言葉[ことば]に従[したが]って、そのすべての務めに従って、そのすべての運[はこ]ぶべきものに従って行[おこな]われる。あなたは、彼[かれ]らが運ぶべきものをすべて、その名[な]によって数[かぞ]え上[あ]げなさい。"
  28: "これが、証[あかし]の幕屋[まくや]でのゲルションの子[こ]らの務[つと]めである。彼[かれ]らの務めは、祭司[さいし]アロンの子イタマルの手[て]にある。"
  29: "メラリの子[こ]らを、その氏族[しぞく]に従[したが]って、その父[ちち]の家[いえ]に従って数[かぞ]え上[あ]げなさい。"
  30: "二十五歳[さい]から五十歳[さい]まで、証[あかし]の幕屋[まくや]の仕事[しごと]のために務[つと]めに入[はい]る者[もの]はみな。数[かぞ]え上[あ]げなさい。"
  31: "これが、証[あかし]の幕屋[まくや]でのそのすべての仕事[しごと]に従[したが]った、彼[かれ]らが運[はこ]ぶべきものの務[つと]めである。幕屋の板[いた]、その横木[よこぎ]、その柱[はしら]、その台座[だいざ]、その覆[おお]い、またそれらの台座と柱[はしら]、幕屋の入口[いりぐち]の覆い、"
  32: "庭[にわ]の周[まわ]りの柱[はしら]とその台座[だいざ]、庭の門[もん]の垂[た]れ幕[まく]の柱とその台座、その杭[くい]とその綱[つな]、そのすべての器[うつわ]とそのすべての務[つと]めである。あなたは彼[かれ]らが運[はこ]ぶべき器を、その名[な]によって数[かぞ]え上[あ]げなさい。"
  33: "これが、証[あかし]の幕屋[まくや]でのメラリの子[こ]らの氏族[しぞく]の務[つと]めで、祭司[さいし]アロンの子イタマルの手[て]にある。」"
  34: "モーセとアロンとイスラエルの長[かしら]たちは、カアトの子[こ]らを、その氏族[しぞく]に従[したが]って、その父[ちち]の家[いえ]に従って数[かぞ]え上[あ]げた。"
  35: "二十五歳[さい]から五十歳[さい]まで、証[あかし]の幕屋[まくや]で務[つと]めに入[はい]り、仕事[しごと]をする者[もの]はみな。"
  36: "その氏族[しぞく]に従[したが]ったその数[かぞ]え上[あ]げは、二千七百五十人[にん]であった。"
  37: "これが、証[あかし]の幕屋[まくや]で務[つと]める者[もの]であるカアトの氏族[しぞく]の数[かぞ]え上[あ]げで、モーセとアロンが主[しゅ]の声[こえ]によって、モーセの手[て]によって数え上げたものである。"
  38: "ゲルションの子[こ]らは、その氏族[しぞく]に従[したが]って、その父[ちち]の家[いえ]に従って数[かぞ]え上[あ]げられた。"
  39: "二十五歳[さい]から五十歳[さい]まで、証[あかし]の幕屋[まくや]で務[つと]めに入[はい]り、仕事[しごと]をする者[もの]はみな。"
  40: "その氏族[しぞく]に従[したが]い、その父[ちち]の家[いえ]に従ったその数[かぞ]え上[あ]げは、二千六百三十人[にん]であった。"
  41: "これが、証[あかし]の幕屋[まくや]で務[つと]める者[もの]であるゲルションの子[こ]らの氏族[しぞく]の数[かぞ]え上[あ]げで、モーセとアロンが主[しゅ]の声[こえ]によって、モーセの手[て]によって数え上げたものである。"
  42: "メラリの氏族[しぞく]も、その氏族に従[したが]って、その父[ちち]の家[いえ]に従って数[かぞ]え上[あ]げられた。"
  43: "二十五歳[さい]から五十歳[さい]まで、証[あかし]の幕屋[まくや]の仕事[しごと]のために務[つと]めに入[はい]る者[もの]はみな。"
  44: "その氏族[しぞく]に従[したが]い、その父[ちち]の家[いえ]に従ったその数[かぞ]え上[あ]げは、三千二百人[にん]であった。"
  45: "これが、メラリの子[こ]らの氏族[しぞく]の数[かぞ]え上[あ]げで、モーセとアロンが主[しゅ]の声[こえ]によって、モーセの手[て]によって数え上げたものである。"
  46: "モーセとアロンとイスラエルの長[かしら]たちが、その氏族[しぞく]に従[したが]って、その父[ちち]の家[いえ]に従って数[かぞ]え上[あ]げたレビ人[びと]はすべて、"
  47: "二十五歳[さい]から五十歳[さい]まで、もろもろの仕事[しごと]の務[つと]めに、また証[あかし]の幕屋[まくや]で運[はこ]ぶべき仕事に就[つ]く者[もの]はみな、"
  48: "その数[かぞ]え上[あ]げられた者[もの]は、八千五百八十人[にん]であった。"
  49: "主[しゅ]の声[こえ]によって、モーセの手[て]によって、彼[かれ]らは数[かぞ]え上[あ]げられた。人[ひと]ごとに、その仕事[しごと]とその運[はこ]ぶべきものに従[したが]って。彼らは、主がモーセに命[めい]じられたとおりに数え上げられた。"

notes:
  1: "καὶ ἐλάλησεν κύριος πρὸς Μωυσῆν καὶ Ααρων λέγων — введение речи Бога к Моисею и Аарону (как 2:1)."
  2: "Λαβὲ τὸ κεφάλαιον τῶν υἱῶν Κααθ — возьми итог (главу, сумму) сынов Каафа (κεφάλαιον — «главное, итог», здесь «поголовный список»); ἐκ μέσου υἱῶν Λευι — из среды сынов Левия; κατὰ δήμους — по родам (氏族), κατ᾿ οἴκους πατριῶν — по домам отцов."
  3: "ἀπὸ εἴκοσι καὶ πέντε ἐτῶν καὶ ἐπάνω καὶ ἕως πεντήκοντα ἐτῶν — от двадцати пяти лет и выше и до пятидесяти лет (LXX и слав.; масоретский текст и Синодальный — от тридцати); πᾶς ὁ εἰσπορευόμενος λειτουργεῖν — всякий входящий служить (λειτουργέω); ποιῆσαι πάντα τὰ ἔργα — делать все дела."
  4: "ταῦτα τὰ ἔργα τῶν υἱῶν Κααθ — вот дела сынов Каафа; ἅγιον τῶν ἁγίων — «святое святых» (слав. «святая святых»): речь о самой святыне, которую они носят, а не о помещении. В csl-ru ст. 4 повторяет «от среды сынов левииных, по сонмом их, по домом отечеств их» (в греч. это стоит только в ст. 2) — повтор не переведён."
  5: "ὅταν ἐξαίρῃ ἡ παρεμβολή — когда поднимется стан (ἐξαίρω); καθελοῦσιν τὸ καταπέτασμα τὸ συσκιάζον — снимут завесу осеняющую (συσκιάζω — «осенять, закрывать тенью»); κατακαλύψουσιν ἐν αὐτῷ τὴν κιβωτὸν τοῦ μαρτυρίου — покроют ею ковчег свидетельства (証の箱; ср. Исх 26:33, где 契約の箱 — κιβωτὸς τῆς διαθήκης)."
  6: "κατακάλυμμα δέρμα ὑακίνθινον — покрывало кожаное синее (ὑακίνθινον — «гиацинтовое», цвет синий; у Синодального — «кожи синего цвета», а не евр. «тахаш»); ἱμάτιον ὅλον ὑακίνθινον — одежда вся синяя (ὅλον — «цельная»); διεμβαλοῦσιν τοὺς ἀναφορεῖς — вложат шесты (ἀναφορεύς — «носило»)."
  7: "τράπεζα ἡ προκειμένη — стол предложения (предлежащий); ἱμάτιον ὁλοπόρφυρον — одежда вся пурпуровая; τρύβλια — блюда (皿), θυίσκαι — кадильницы/чаши (香の器), κύαθοι — чаши (杯), σπονδεῖα — сосуды возлияния (注ぎの器); οἱ ἄρτοι οἱ διὰ παντός — хлебы всегдашние."
  8: "ἱμάτιον κόκκινον — одежда алая (绯); καλύμματι δερματίνῳ ὑακινθίνῳ — покрывалом кожаным синим; повтор «вложат шесты», как в ст. 6."
  9: "λυχνία ἡ φωτίζουσα — светильник светящий; λύχνοι — лампады (灯); λαβίδες — щипцы (火挟み); ἐπαρυστρίδες — черпалки/лотки (灰皿; слав. «очищала»); ἀγγεῖα τοῦ ἐλαίου — сосуды елея."
  10: "ἐμβαλοῦσιν αὐτὴν … εἰς κάλυμμα δέρματινον ὑακίνθινον — положат его в кожаное синее покрывало; ἐπὶ ἀναφορέων — на носилках (мн. ч.)."
  11: "τὸ θυσιαστήριον τὸ χρυσοῦν — золотой жертвенник (кадильный); ἐπικαλύψουσιν — покроют сверху; ἀναφορεῖς αὐτοῦ — шесты его."
  12: "τὰ σκεύη τὰ λειτουργικά — сосуды служебные; ἐν τοῖς ἁγίοις — во святилище; ἐπὶ ἀναφορεῖς — на носилки."
  13: "τὸν καλυπτῆρα ἐπιθήσει ἐπὶ τὸ θυσιαστήριον — возложат покрывало на жертвенник (καλυπτήρ — «покров»); ἐπικαλύψουσιν … ἱμάτιον ὁλοπόρφυρον — покроют одеждою всею пурпуровою. У Синодального здесь «очистят жертвенник от пепла» — это масоретское чтение, в LXX иного слова нет."
  14: "τὰ πυρεῖα — угольницы (火皿); κρεάγραι — вилки/крюки (肉挟み); φιάλαι — чаши (鉢); καλυπτήρ — покров; ἐπιβαλοῦσιν … κάλυμμα δερμάτινον ὑακίνθινον — возложат кожаное синее покрывало; λουτῆρα — умывальницу (洗い盤), βάσις — подножие. LXX присоединяет сюда умывальницу, у масоретского текста она в другом месте."
  15: "συντελέσουσιν … καλύπτοντες τὰ ἅγια — окончат, покрывая святыни; μετὰ ταῦτα εἰσελεύσονται υἱοὶ Κααθ αἴρειν — после этого войдут сыны Каафа, чтобы нести; οὐχ ἅψονται τῶν ἁγίων, ἵνα μὴ ἀποθάνωσιν — не прикоснутся к святыням, чтобы не умереть."
  16: "ἐπίσκοπος Ελεαζαρ — надзиратель (блюститель) Елеазар; τὸ ἔλαιον τοῦ φωτός — елей света (для светильника); θυμίαμα τῆς συνθέσεως — курение составное (сложенное по рецепту); ἡ θυσία ἡ καθ᾽ ἡμέραν — жертва ежедневная (хлебное приношение, ср. Исх 29:38–42); τὸ ἔλαιον τῆς χρίσεως — елей помазания; ἐπισκοπὴ ὅλης τῆς σκηνῆς — надзор за всей скинией."
  17: "Введение речи Бога к Моисею и Аарону (ср. ст. 1)."
  18: "Μὴ ὀλεθρεύσητε — не погубите (ὀλεθρεύω — «истреблять»); τῆς φυλῆς τὸν δῆμον τὸν Κααθ — племенной род Каафа (двойной винительный: «племя — род»); ἐκ μέσου τῶν Λευιτῶν — из среды левитов."
  19: "τοῦτο ποιήσατε αὐτοῖς καὶ ζήσονται — это сделайте им, и будут живы; οὐ μὴ ἀποθάνωσιν — никак не умрут (усиленное отрицание); προσπορευομένων αὐτῶν πρὸς τὰ ἅγια τῶν ἁγίων — когда они приступают к святому святых; καταστήσουσιν αὐτοὺς ἕκαστον κατὰ τὴν ἀναφορὰν αὐτοῦ — поставят их каждого по его ноше (ἀναφορά — «ношение»)."
  20: "οὐ μὴ εἰσέλθωσιν ἰδεῖν ἐξάπινα τὰ ἅγια — никак не войдут, чтобы увидеть внезапно святыни (ἐξάπινα — «вдруг, внезапно»); καὶ ἀποθανοῦνται — и умрут."
  21: "Введение речи Бога; ср. ст. 17."
  22: "Λαβὲ τὴν ἀρχὴν τῶν υἱῶν Γεδσων — возьми начало (итог) сынов Гирсона (ἀρχή здесь = κεφάλαιον, ср. ст. 2); κατ᾿ οἴκους πατριῶν — по домам отцов."
  23: "ἀπὸ πεντεκαιεικοσαετοῦς … ἕως πεντηκονταετοῦς — от двадцатипятилетнего до пятидесятилетнего (LXX; ср. ст. 3); ἐπίσκεψαι αὐτούς — исчисли их; λειτουργεῖν καὶ ποιεῖν τὰ ἔργα αὐτοῦ — служить и делать дела его."
  24: "αὕτη ἡ λειτουργία τοῦ δήμου τοῦ Γεδσων — вот служение рода Гирсона; λειτουργεῖν καὶ αἴρειν — служить и носить."
  25: "ἀρεῖ — будет носить (αἴρω); δέρρεις τῆς σκηνῆς — покровы скинии (δέρρις — «кожаный покров, шатёр»); τὸ κάλυμμα τὸ ὑακίνθινον τὸ ὂν ἐπ᾽ αὐτῆς ἄνωθεν — синее покрывало, что сверху на ней; τὸ κάλυμμα τῆς θύρας — покрывало входа."
  26: "τὰ ἱστία τῆς αὐλῆς — полотнища двора; ὅσα ἐπὶ τῆς σκηνῆς τοῦ μαρτυρίου — сколько их при скинии свидетельства; τὰ περισσά — остатки, лишнее; σκεύη λειτουργικά — сосуды служебные; ποιήσουσιν — сделают (у LXX глагол в конце). Слав. прибавляет «и яже окрест олтаря» (περὶ τοῦ θυσιαστηρίου) — этого нет в греч.; отмечено в 〔…〕."
  27: "κατὰ στόμα Ααρων — по устам (слову) Аарона; ἔσται ἡ λειτουργία — будет служение; κατὰ πάντα τὰ ἀρτά — по всем ношам (ἀρτόν — «ноша»); ἐπισκέψῃ αὐτοὺς ἐξ ὀνομάτων — пересмотришь их по именам."
  28: "αὕτη ἡ λειτουργία τῶν υἱῶν Γεδσων — вот служение сынов Гирсона; ἐν χειρὶ Ιθαμαρ — в руке Ифамара (т. е. под его надзором)."
  29: "Οἱ υἱοὶ Μεραρι — сыны Мерари; ἐπισκέψασθε αὐτούς — исчислите их (мн. ч.)."
  30: "ἀπὸ πεντεκαιεικοσαετοῦς καὶ ἐπάνω ἕως πεντηκονταετοῦς — от 25 до 50 лет; πᾶς ὁ εἰσπορευόμενος λειτουργεῖν τὰ ἔργα — всякий входящий служить дела."
  31: "τὰ φυλάγματα τῶν αἰρομένων ὑπ᾽ αὐτῶν — стражи (предметы охранения) носимого ими; κεφαλίδες — брусья (板); μοχλοί — шесты (横木); στῦλοι — столбы; βάσεις — подножия; κατακάλυμμα — покрывало. LXX повторяет «подножия их и столбы их» и вновь «покрывало двери скинии» — повтор сохранён (ср. Исх 26)."
  32: "στῦλοι τῆς αὐλῆς κύκλῳ — столбы двора вокруг; τοὺς στύλους τοῦ καταπετάσματος τῆς πύλης — столбы завесы ворот; πάσσαλοι — колья (杭); κάλοι — верёвки (綱); λειτουργήματα — служения; ἐξ ὀνομάτων ἐπισκέψασθε — по именам исчислите."
  33: "αὕτη ἡ λειτουργία δήμου υἱῶν Μεραρι — вот служение рода сынов Мерари; ἐν χειρὶ Ιθαμαρ — в руке Ифамара."
  34: "ἐπεσκέψατο Μωϋσῆς καὶ Ααρων καὶ οἱ ἄρχοντες Ισραηλ — исчислили Моисей, Аарон и начальники Израиля; τοὺς υἱοὺς Κααθ — сынов Каафа."
  35: "ἀπὸ πεντεκαιεικοσαετοῦς … ἕως πεντηκονταετοῦς — от 25 до 50 лет; πᾶς ὁ εἰσπορευόμενος λειτουργεῖν καὶ ποιεῖν — всякий входящий служить и делать."
  36: "δισχίλιοι διακόσιοι πεντήκοντα — 2 750."
  37: "αὕτη ἡ ἐπίσκεψις δήμου Κααθ — вот исчисление рода Каафа; πᾶς ὁ λειτουργῶν — всякий служащий; καθὰ ἐπεσκέψατο Μωϋσῆς καὶ Ααρων — как исчислили Моисей и Аарон; διὰ φωνῆς κυρίου ἐν χειρὶ Μωυσῆ — по голосу Господню, рукою Моисея."
  38: "ἐπεσκέπησαν υἱοὶ Γεδσων — исчислены сыны Гирсона (pass.); κατὰ δήμους … κατ᾿ οἴκους πατριῶν — по родам, по домам отцов."
  39: "Та же формула возраста, что в ст. 35; ср. ст. 23."
  40: "δισχίλιοι ἑξακόσιοι τριάκοντα — 2 630."
  41: "αὕτη ἡ ἐπίσκεψις δήμου υἱῶν Γεδσων — вот исчисление рода сынов Гирсона; οὓς ἐπεσκέψατο Μωϋσῆς καὶ Ααρων — которых исчислили Моисей и Аарон."
  42: "Ἐπεσκέπησαν δὲ καὶ δῆμος υἱῶν Μεραρι — исчислен был и род сынов Мерари (ед. ч. δῆμος при глаголе мн. ч. — так в LXX)."
  43: "Та же формула возраста; πρὸς τὰ ἔργα τῆς σκηνῆς — на дела скинии (предлог πρός, как в ст. 43, ср. ст. 39)."
  44: "τρισχίλιοι καὶ διακόσιοι — 3 200."
  45: "αὕτη ἡ ἐπίσκεψις δήμου υἱῶν Μεραρι — вот исчисление рода сынов Мерари; без «и начальники Израиля» — в LXX так же, как в ст. 41."
  46: "Πάντες οἱ ἐπεσκεμμένοι, οὓς ἐπεσκέψατο Μωϋσῆς καὶ Ααρων καὶ οἱ ἄρχοντες Ισραηλ, τοὺς Λευίτας — все исчисленные, которых исчислили Моисей, Аарон и начальники Израиля, — левитов."
  47: "πρὸς τὸ ἔργον τῶν ἔργων — на дело дел (т. е. на главные работы; слав. «на дело дел»); τὰ ἔργα τὰ αἰρόμενα — дела носимые, т. е. ноши; πᾶς ὁ εἰσπορευόμενος — всякий входящий."
  48: "ὀκτακισχίλιοι πεντακόσιοι ὀγδοήκοντα — 8 580 (2 750 + 2 630 + 3 200); примечательно, что сумма не совпадает с 22 000 гл. 3, т. к. там считались все мужского пола от месяца, а здесь — служащие от 25 до 50 лет."
  49: "διὰ φωνῆς κυρίου ἐπεσκέψατο αὐτοὺς ἐν χειρὶ Μωυσῆ — по голосу Господню исчислил их рукою Моисея; ἄνδρα κατ᾽ ἄνδρα — человека за человеком (поголовно); ἐπὶ τῶν ἔργων αὐτῶν καὶ ἐπὶ ὧν αἴρουσιν αὐτοί — по делам их и по тому, что они носят; ὃν τρόπον συνέταξεν κύριος — как повелел Господь."
