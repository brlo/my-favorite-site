# jp-box, Второзаконие, глава 9. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — csl-ru; ru — только для понимания.
# jp-joc в этой главе отсутствует. Язык — современный 常体; порядок членов и
# деление на клаузы — по греческому.
# Глава 9: не за праведность народа (1–6), воспоминание о жестоковыйности в пустыне
# (7–24), ходатайство Моисея и его молитва (25–29).
# Речь Моисея — 「…」 (1–29). Внутри неё: слова народа (2, 4), слова Бога (12–14),
# повеление Бога из Кадес-Варни (23), молитва Моисея (26–29) — 『…』.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (jp-joc отсутствует; проверять нечего).
# Сносок ⟨…⟩ нет: 燔祭, 契約, 石板, 荒れ野, 割礼 объяснены ранее в корпусе.
# LXX-особенности: 9:2 «сыны Енака»; 9:12 χώνευμα — «литое изваяние»; 9:22 LXX передаёт
# названия мест нарицательно (Возгорание, Искушение, Гробы похоти); 9:24 «с того дня,
# как Он был познан вами» (масор. «когда Я узнал вас» — отсюда «как я стал знать вас»
# в Синодальном); 9:10 в базе нет «из среды огня» (это 10:4 и славянский).
# Речь Моисея в файле открыта 「 в начале главы и закрыта 」 в конце: она продолжается
# и в следующей главе, поэтому кавычки балансируются внутри файла.
# jp-ni не использовался.

