verses:
  1: "「聞[き]け、イスラエルよ。あなたは今日[きょう]、ヨルダン川[がわ]を渡[わた]って、あなたがたよりも大[おお]きく強[つよ]いもろもろの民[たみ]、天[てん]にまで届[とど]く城壁[じょうへき]に囲[かこ]まれた大[おお]きな町々[まちまち]を嗣業[しぎょう]として受[う]け継[つ]ぐために入[はい]って行[ゆ]こうとしている。"
  2: "大[おお]きく、多[おお]く、背[せ]の高[たか]い民[たみ]、すなわちあなたが知[し]り、また聞[き]いているエナクの子[こ]らである。『エナクの子[こ]らの前[まえ]に、だれが立[た]ち向[む]かえようか。』"
  3: "今日[きょう]、あなたは、あなたの神[かみ]である主[しゅ]があなたの前[まえ]を進[すす]まれることを知[し]るであろう。主は焼[や]き尽[つ]くす火[ひ]である。主が彼[かれ]らを滅[ほろ]ぼし尽[つ]くし、主が彼[かれ]らをあなたの前[まえ]から退[しりぞ]けられる。あなたは彼[かれ]らを、主があなたに語[かた]られたとおりに滅[ほろ]ぼし尽[つ]くす。"
  4: "あなたの神[かみ]である主[しゅ]が、これらの民[たみ]をあなたの前[まえ]から滅[ほろ]ぼし尽[つ]くされるとき、心[こころ]のうちで『わたしの正[ただ]しさのゆえに、主[しゅ]はわたしを導[みちび]いて、この良[よ]い地[ち]を嗣業[しぎょう]として受[う]け継[つ]がせてくださった』と言[い]ってはならない。そうではなく、これらの民[たみ]の不敬虔[ふけいけん]のゆえに、主[しゅ]は彼[かれ]らをあなたの前[まえ]から滅[ほろ]ぼし尽[つ]くされるのである。"
  5: "あなたが彼[かれ]らの地[ち]を嗣業[しぎょう]として受[う]け継[つ]ぐために入[はい]って行[ゆ]くのは、あなたの正[ただ]しさのゆえでも、あなたの心[こころ]の敬虔[けいけん]のゆえでもない。これらの民[たみ]の不敬虔[ふけいけん]のゆえに、主[しゅ]は彼[かれ]らをあなたの前[まえ]から滅[ほろ]ぼし尽[つ]くし、また、あなたがたの父[ちち]たち、アブラハム、イサク、ヤコブに誓[ちか]われたご自分[じぶん]の契約[けいやく]を立[た]てるためである。"
  6: "今日[きょう]、あなたの神[かみ]である主[しゅ]が、この良[よ]い地[ち]を嗣業[しぎょう]として受[う]け継[つ]がせてくださるのは、あなたの正[ただ]しさのゆえではないことを知[し]りなさい。あなたはかたくなな民[たみ]だからである。"
  7: "思[おも]い起[おこ]しなさい。忘[わす]れてはならない。あなたが荒[あ]れ野[の]で、あなたの神[かみ]である主[しゅ]をどれほど怒[いか]らせたかを。あなたがたがエジプトの地[ち]を出[で]た日[ひ]から、この場所[ばしょ]に来[き]た今日[きょう]まで、あなたがたは主[しゅ]に逆[さか]らい続[つづ]けた。"
  8: "また、ホレブでは、あなたがたは主[しゅ]を怒[いか]らせた。主はあなたがたに対して怒[いか]りを燃[も]やし、あなたがたを滅[ほろ]ぼし尽[つ]くそうとされた。"
  9: "わたしが、石[いし]の板[いた]、すなわち主[しゅ]があなたがたと結[むす]ばれた契約[けいやく]の板[いた]を受[う]けるために山[やま]に上[のぼ]ったとき、わたしは四十日[しじゅうにち]四十夜[しじゅうや]、山[やま]にとどまった。パンも食[た]べず、水[みず]も飲[の]まなかった。"
  10: "主[しゅ]は神[かみ]の指[ゆび]で書[か]かれた二枚[にまい]の石[いし]の板[いた]をわたしに与[あた]えられた。そこには、主[しゅ]が山[やま]で、集会[しゅうかい]の日[ひ]にあなたがたに語[かた]られたすべての言葉[ことば]が書[か]かれていた。"
  11: "そして、四十日[しじゅうにち]四十夜[しじゅうや]が過[す]ぎたとき、主[しゅ]はわたしに、契約[けいやく]の板[いた]である二枚[にまい]の石[いし]の板[いた]を与[あた]えられた。"
  12: "主[しゅ]はわたしに言[い]われた。『立[た]って、急[いそ]いでここから下[くだ]りなさい。あなたがエジプトの地[ち]から導[みちび]き出[だ]したあなたの民[たみ]が悪[あく]を行[おこな]ったからである。彼[かれ]らは、あなたが彼[かれ]らに命[めい]じた道[みち]から速[すみ]やかに外[はず]れ、自分[じぶん]たちのために鋳物[いもの]の像[ぞう]を造[つく]った。』"
  13: "主[しゅ]はまた言[い]われた。『わたしはあなたに一度[いちど]また二度[にど]、こう言[い]った。わたしはこの民[たみ]を見[み]た。そして見[み]よ、彼[かれ]らはかたくなな民[たみ]である。"
  14: "わたしを放[はな]っておきなさい。わたしは彼[かれ]らを滅[ほろ]ぼし尽[つ]くし、彼[かれ]らの名[な]を天[てん]の下[した]から消[け]し去[さ]り、あなたを、この民[たみ]よりも大[おお]きく強[つよ]く多[おお]い民[たみ]としよう。』"
  15: "わたしは向[む]きを変[か]えて山[やま]を下[くだ]った。山[やま]は火[ひ]で燃[も]えていた。二枚[にまい]の板[いた]はわたしの両手[りょうて]にあった。"
  16: "わたしは、あなたがたがあなたがたの神[かみ]である主[しゅ]の前[まえ]で罪[つみ]を犯[おか]し、自分[じぶん]たちのために鋳物[いもの]の子牛[こうし]を造[つく]り、主[しゅ]があなたがたに命[めい]じた道[みち]から速[すみ]やかに外[はず]れたのを見[み]た。"
  17: "わたしは二枚[にまい]の板[いた]を取[と]り、両手[りょうて]からそれを投[な]げ捨[す]て、あなたがたの前[まえ]で砕[くだ]いた。"
  18: "わたしは主[しゅ]の前[まえ]で、はじめのときと同[おな]じように、四十日[しじゅうにち]四十夜[しじゅうや]、再[ふたた]び祈[いの]った。パンも食[た]べず、水[みず]も飲[の]まなかった。あなたがたが、あなたがたの神[かみ]である主[しゅ]の前[まえ]で悪[あく]を行[おこな]い、主を怒[いか]らせて犯[おか]したすべての罪[つみ]のためである。"
  19: "わたしは、その怒[いか]りと激[はげ]しい憤[いきどお]りのゆえに恐[おそ]れた。主[しゅ]があなたがたに対して怒[いか]りを燃[も]やし、あなたがたを滅[ほろ]ぼし尽[つ]くそうとされたからである。しかし主[しゅ]は、このときもまた、わたしの声[こえ]を聞[き]かれた。"
  20: "主[しゅ]はアロンにもひどく怒[いか]りを燃[も]やし、彼[かれ]を滅[ほろ]ぼし尽[つ]くそうとされた。そのとき、わたしはアロンのためにも祈[いの]った。"
  21: "あなたがたが造[つく]った罪[つみ]、すなわちあの子牛[こうし]を、わたしは取[と]って火[ひ]で焼[や]き、細[こま]かく砕[くだ]いて粉々[こなごな]にし、ついには細[こま]かな粉[こな]となって、塵[ちり]のようになった。その塵[ちり]を、山[やま]から流[なが]れ下[くだ]る小川[おがわ]に投[な]げ入[い]れた。"
  22: "また、燃[も]え上[あ]がりの地[ち]、試[こころ]みの地[ち]、欲情[よくじょう]の墓[はか]の地[ち]でも、あなたがたはあなたがたの神[かみ]である主[しゅ]を怒[いか]らせ続[つづ]けた。"
  23: "主[しゅ]があなたがたをカデシュ・バルネアから遣[つか]わし、『上[のぼ]って行[ゆ]き、わたしがあなたがたに与[あた]える地[ち]を嗣業[しぎょう]として受[う]け継[つ]げ』と言[い]われたとき、あなたがたはあなたがたの神[かみ]である主[しゅ]の言葉[ことば]に逆[さか]らい、主を信[しん]じず、その声[こえ]を聞[き]かなかった。"
  24: "あなたがたは、あなたがたが主[しゅ]を知[し]るようになった日[ひ]から、主[しゅ]に逆[さか]らい続[つづ]けてきた。"
  25: "わたしは主[しゅ]の前[まえ]で、四十日[しじゅうにち]四十夜[しじゅうや]、すなわち祈[いの]ったそのすべての日[ひ]、祈[いの]り続[つづ]けた。主[しゅ]があなたがたを滅[ほろ]ぼし尽[つ]くすと言[い]われたからである。"
  26: "わたしは神[かみ]に祈[いの]って言[い]った。『主[しゅ]よ、主[しゅ]よ、神々[かみがみ]の王[おう]よ。あなたが大[おお]きな力[ちから]で贖[あがな]われたあなたの民[たみ]、あなたの嗣業[しぎょう]を滅[ほろ]ぼさないでください。あなたはこれを、大[おお]きな力[ちから]と強[つよ]い手[て]と高[たか]く掲[かか]げられた腕[うで]によって、エジプトの地[ち]から導[みちび]き出[だ]されたのです。"
  27: "あなたの僕[しもべ]アブラハム、イサク、ヤコブを思[おも]い起[おこ]してください。あなたは彼[かれ]らにご自分[じぶん]にかけて誓[ちか]われました。この民[たみ]の頑[かた]なさと、その不敬虔[ふけいけん]と罪[つみ]をご覧[らん]にならないでください。"
  28: "あなたがわたしたちを導[みちび]き出[だ]された地[ち]に住[す]む者[もの]たちが、主[しゅ]は彼[かれ]らを、約束[やくそく]された地[ち]に導[みちび]き入[い]れることができなかった、また彼[かれ]らを憎[にく]んで、荒[あ]れ野[の]で殺[ころ]すために導[みちび]き出[だ]した、と言[い]うことのないようにしてください。"
  29: "しかし彼[かれ]らはあなたの民[たみ]、あなたの嗣業[しぎょう]です。あなたが大[おお]きな力[ちから]と高[たか]く掲[かか]げられた腕[うで]によって、エジプトの地[ち]から導[みちび]き出[だ]されたのです。』」"

notes:
  1: "Ἄκουε, Ισραηλ — 聞け、イスラエルよ (обращение Моисея). διαβαίνεις σήμερον τὸν Ιορδάνην — переходишь сегодня Иордан. κληρονομῆσαι — 嗣業として受け継ぐ. τειχήρεις — «с укреплениями» (τεῖχος — стена). ἕως τοῦ οὐρανοῦ — до неба (о высоте стен)."
  2: "λαὸν μέγαν καὶ πολὺν καὶ εὐμήκη — большой, многочисленный и высокорослый (εὐμήκης — «высокий»). υἱοὺς Ενακ — сыны Енака (исполины). οὓς σὺ οἶσθα καὶ σὺ ἀκήκοας — которых ты знаешь и слышал. Τίς ἀντιστήσεται κατὰ πρόσωπον — «кто устоит пред лицом» — поговорка, поэтому в 『…』."
  3: "γνώσῃ — узнаешь. προπορεύεται πρὸ προσώπου σου — идёт пред лицом твоим. πῦρ καταναλίσκον — огонь поедающий. ἐξολεθρεύσει — истребит. ἀποστρέψει — отвратит, низложит. ἀπολεῖς — истребишь (2-е л. ед. ч.). καθάπερ εἶπέν σοι κύριος — как сказал тебе Господь."
  4: "ἐν τῷ ἐξαναλῶσαι — когда истребит (ἐξαναλίσκω). μὴ εἴπῃς ἐν τῇ καρδίᾳ σου — не скажи в сердце твоём. δικαιοσύνας — правды, праведность. ἀσέβειαν — нечестие. λέγων вводит слова в 『…』."
  5: "οὐχὶ… οὐδὲ — не за… и не за. ὁσιότης τῆς καρδίας — святость, благочестие сердца. εἰσπορεύῃ — входишь. ἵνα στήσῃ τὴν διαθήκην — чтобы поставить завет. ὤμοσεν τοῖς πατράσιν — клялся отцам."
  6: "δίδωσίν σοι — даёт тебе. λαὸς σκληροτράχηλος — народ жестоковыйный (букв. «с жёсткой шеей»); かたくなな."
  7: "μνήσθητι μὴ ἐπιλάθῃ — помни, не забудь (двойное повеление). παρώξυνας — раздражил (παροξύνω). ἀφ᾿ ἧς ἡμέρας — с того дня. ἀπειθοῦντες διετελεῖτε — продолжали противиться (διατελέω)."
  8: "ἐν Χωρηβ — при Хориве. ἐθυμώθη κύριος ἐφ᾿ ὑμῖν — воспылал Господь на вас. ἐξολεθρεῦσαι — чтобы истребить."
  9: "ἀναβαίνοντός μου — когда я восходил (gen. abs.). πλάκας λιθίνας — каменные скрижали. πλάκας διαθήκης — скрижали завета. διέθετο — поставил (завет). κατεγινόμην — пробыл (καταγίνομαι). ἄρτον οὐκ ἔφαγον καὶ ὕδωρ οὐκ ἔπιον — хлеба не ел и воды не пил."
  10: "γεγραμμένας ἐν τῷ δακτύλῳ τοῦ θεοῦ — написанные перстом Божиим. ἐπ᾿ αὐταῖς ἐγέγραπτο — на них было написано. ἡμέρᾳ ἐκκλησίας — в день собрания; «из среды огня» здесь в базе нет (ср. 10:4 и слав.)."
  11: "ἐγένετο διὰ τεσσαράκοντα ἡμερῶν — по прошествии сорока дней. πλάκας διαθήκης — скрижали завета (повтор 9)."
  12: "Ἀνάστηθι κατάβηθι τὸ τάχος — встань, сойди быстро (τὸ τάχος — «быстро»). ἠνόμησεν — беззаконновал. οὓς ἐξήγαγες — которых ты вывел. παρέβησαν ταχύ — скоро преступили. χώνευμα — литое изваяние (χωνευτός); 鋳物の像."
  13: "Λελάληκα πρὸς σὲ ἅπαξ καὶ δὶς — говорил тебе однажды и дважды. Ἑώρακα τὸν λαόν — увидел народ. ἰδοὺ λαὸς σκληροτράχηλός ἐστιν — вот народ жестоковыйный."
  14: "ἔασόν με — оставь меня, дай Мне. ἐξαλείψω τὸ ὄνομα — изглажу имя. ὑποκάτωθεν τοῦ οὐρανοῦ — под небом. ποιήσω σὲ εἰς ἔθνος μέγα — произведу тебя в народ великий."
  15: "ἐπιστρέψας — обратившись. κατέβην — сошёл. τὸ ὄρος ἐκαίετο πυρί — гора горела огнём."
  16: "ἰδὼν ὅτι — увидев, что. ἐναντίον κυρίου τοῦ θεοῦ ὑμῶν — пред Господом Богом вашим. χωνευτόν — литого. παρέβητε ἀπὸ τῆς ὁδοῦ — преступили с пути."
  17: "ἐπιλαβόμενος τῶν δύο πλακῶν — взяв две скрижали. ἔρριψα — бросил. συνέτριψα ἐναντίον ὑμῶν — разбил пред вами."
  18: "ἐδεήθην — умолял (δέομαι). δεύτερον καθάπερ καὶ τὸ πρότερον — во второй раз, как и прежде. περὶ πασῶν τῶν ἁμαρτιῶν — за все грехи. παροξῦναι αὐτόν — раздражить Его."
  19: "ἔκφοβός εἰμι — я был в страхе (praesens historicum). ὀργή и θυμός — гнев и ярость. παρωξύνθη — разгневался. εἰσήκουσεν κύριος ἐμοῦ — услышал меня Господь."
  20: "ἐπὶ Ααρων ἐθυμώθη σφόδρα — на Аарона сильно разгневался. ηὐξάμην — молился (εὔχομαι); в 26 снова εὐξάμην."
  21: "τὴν ἁμαρτίαν ὑμῶν… τὸν μόσχον — грех ваш, тельца (приложение). κατέκαυσα ἐν πυρί — сжёг огнём. συνέκοψα καταλέσας σφόδρα — разбил, истёр сильно. ἕως οὗ ἐγένετο λεπτόν — пока не стал мелким. κονιορτός — прах. χειμάρρους — поток."
  22: "Ἐμπυρισμός, Πειρασμός, Μνήματα τῆς ἐπιθυμίας — LXX передаёт названия нарицательно: Возгорание (Тавера), Искушение (Масса), Гробы похоти (Киброт-Гаттаава). παροξύνοντες ἦτε — вы раздражали."
  23: "ἐξαπέστειλεν — послал. ἐκ Καδης Βαρνη — из Кадес-Варни. Ἀνάβητε — взойдите. ἠπειθήσατε τῷ ῥήματι — воспротивились слову. οὐκ ἐπιστεύσατε — не поверили. οὐκ εἰσηκούσατε τῆς φωνῆς — не послушали гласа."
  24: "ἀπειθοῦντες ἦτε — были непокорны. ἀπὸ τῆς ἡμέρας, ἧς ἐγνώσθη ὑμῖν — с того дня, как Он был познан вами (LXX pass.; масор. «когда Я узнал вас», отсюда «как я стал знать вас» в Синодальном)."
  25: "ἐδεήθην… ὅσας ἐδεήθην — умолял сорок дней и ночей, сколько умолял. εἶπεν γὰρ κύριος ἐξολεθρεῦσαι ὑμᾶς — ибо сказал Господь истребить вас."
  26: "Κύριε κύριε βασιλεῦ τῶν θεῶν — Господи, Господи, Царю богов. μερίδα — удел. ἐλυτρώσω — искупил. ἰσχύι, χειρί, βραχίονι — силой, рукой, мышцей; в базе «силой Твоею великою» повторено дважды, в переводе один раз."
  27: "θεράποντες — служители, рабы. ὤμοσας κατὰ σεαυτοῦ — клялся Собою. μὴ ἐπιβλέψῃς ἐπί — не воззри на. σκληρότητα — жестокость, упорство. ἀσεβήματα καὶ ἁμαρτήματα — нечестия и грехи."
  28: "οἱ κατοικοῦντες τὴν γῆν, ὅθεν ἐξήγαγες — живущие в земле, откуда Ты вывел. παρὰ τὸ μὴ δύνασθαι κύριον εἰσαγαγεῖν — из-за того, что Господь не мог ввести. παρὰ τὸ μισῆσαι — из-за того, что возненавидел. Слова народов переданы косвенно, чтобы не вводить третий уровень кавычек."
  29: "λαός σου καὶ κλῆρός σου — народ Твой и удел Твой. ἐξήγαγες ἐν ἰσχύι… καὶ ἐν τῷ βραχίονι τῷ ὑψηλῷ — вывел силою… и мышцею высокою."
