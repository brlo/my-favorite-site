verses:
  0: "指揮者[しきしゃ]に。変[か]えられようとしている者[もの]たちのために。ダビデの詩[うた]。"
  1: "神[かみ]よ、わたしを救[すく]ってください。水[みず]がわたしの魂[たましい]まで入[はい]り込[こ]んでいるからである。"
  2: "わたしは深[ふか]い泥[どろ]に沈[しず]み、立[た]つ所[ところ]がない。海[うみ]の深[ふか]みに入[はい]り、嵐[あらし]がわたしを覆[おお]い尽[つ]くした。"
  3: "わたしは呼[よ]び続[つづ]けて疲[つか]れ、喉[のど]はかすれた。わたしの目[め]は、わたしの神[かみ]を待[ま]ち望[のぞ]みながら衰[おとろ]えた。"
  4: "わたしをいたずらに憎[にく]む者[もの]は、わたしの頭[あたま]の毛[け]よりも多[おお]く、わたしを不正[ふせい]に追[お]う敵[てき]は強[つよ]くなった。わたしが奪[うば]わなかったものまで、わたしは返[かえ]さねばならない。"
  5: "神[かみ]よ、あなたはわたしの愚[おろ]かさを知[し]っておられ、わたしの罪[つみ]はあなたから隠[かく]れていない。"
  6: "主[しゅ]、万軍[ばんぐん]の主[しゅ]よ、あなたを待[ま]ち望[のぞ]む者[もの]たちが、わたしのゆえに恥[は]をかきませんように。イスラエルの神[かみ]よ、あなたを求[もと]める者[もの]たちが、わたしのゆえに辱[はずかし]められませんように。"
  7: "あなたのゆえに、わたしは非難[ひなん]を負[お]い、辱[はずかし]めがわたしの顔[かお]を覆[おお]った。"
  8: "わたしは兄弟[きょうだい]たちから遠[とお]ざかり、母[はは]の子[こ]らにとってよそ者[もの]となった。"
  9: "あなたの家[いえ]への熱[ねつ]意[い]がわたしを食[く]い尽[つ]くし、あなたをそしる者[もの]のそしりがわたしに降[ふ]りかかった。"
  10: "わたしは断食[だんじつ]して魂[たましい]を低[ひく]くしたが、それがわたしへの非難[ひなん]になった。"
  11: "わたしは着物[きもの]を粗[あら]布[ぬの]とし、彼[かれ]らのことわざとなった。"
  12: "門[もん]のそばに座[すわ]る者[もの]たちはわたしのことを語[かた]り合[あ]い、酒[さけ]を飲[の]む者[もの]たちはわたしを歌[うた]にした。"
  13: "しかし、わたしはあなたに祈[いの]る。主[しゅ]よ、恵[めぐ]みの時[とき]に、神[かみ]よ、あなたのあわれみの多[おお]さによって、あなたの救[すく]いの真実[しんじつ]をもって、わたしの声[こえ]を聞[き]いてください。"
  14: "わたしを泥[どろ]から救[すく]い出[だ]してください。わたしが沈[しず]みませんように。わたしを憎[にく]む者[もの]から、深[ふか]い水[みず]から、救[すく]い出[だ]してください。"
  15: "水[みず]の嵐[あらし]がわたしを沈[しず]めませんように。深[ふか]みがわたしを飲[の]み込[こ]みませんように。井戸[いど]がその口[くち]をわたしの上[うえ]に閉[と]じませんように。"
  16: "主[しゅ]よ、わたしの声[こえ]を聞[き]いてください。あなたのあわれみは恵[めぐ]み深[ぶか]いからである。あなたの多[おお]くのあわれみによって、わたしに目[め]を留[と]めてください。"
  17: "あなたの顔[かお]をあなたの僕[しもべ]から背[そむ]けませんように。わたしは苦[くる]しんでいるからである。すみやかにわたしの声[こえ]を聞[き]いてください。"
  18: "わたしの魂[たましい]に心[こころ]を留[と]め、これを贖[あがな]い出[だ]してください。わたしの敵[てき]のゆえに、わたしを救[すく]い出[だ]してください。"
  19: "あなたはわたしへの非難[ひなん]、わたしの恥[は]ずかしさ、わたしの辱[はずかし]めを知[し]っておられる。わたしを苦[くる]しめる者[もの]はすべて、あなたの前[まえ]にいる。"
  20: "わたしの魂[たましい]は非難[ひなん]と苦[くる]しみを待[ま]ち望[のぞ]んだ。わたしはともに悲[かな]しむ者[もの]を待[ま]ったが、だれもおらず、慰[なぐさ]める者[もの]を求[もと]めたが、見[み]つからなかった。"
  21: "彼[かれ]らはわたしの食[た]べ物[もの]に苦[にが]い胆汁[たんじゅう]を与[あた]え、渇[かわ]いたわたしに酢[す]を飲[の]ませた。"
  22: "彼[かれ]らの食卓[しょくたく]が彼[かれ]らの前[まえ]でわなとなり、報[むく]いとなり、つまずきとなるように。"
  23: "彼[かれ]らの目[め]が暗[くら]くなって見[み]えなくなりますように。彼[かれ]らの背[せ]をいつまでも曲[ま]げておられますように。"
  24: "あなたの怒[いか]りを彼[かれ]らの上[うえ]に注[そそ]ぎ、あなたの怒[いか]りの激[はげ]しさが彼[かれ]らを捕[と]らえますように。"
  25: "彼[かれ]らの住[す]まいが荒[あ]れ果[は]て、その天幕[てんまく]に住[す]む者[もの]がいなくなりますように。"
  26: "あなたが打[う]たれた者[もの]を、彼[かれ]らは追[お]いかけ、あなたが傷[きず]つけられた者[もの]の痛[いた]みをさらに増[ま]した。"
  27: "彼[かれ]らの不法[ふほう]に不法[ふほう]を重[かさ]ねてください。彼[かれ]らがあなたの義[ぎ]に入[はい]らないように。"
  28: "彼[かれ]らが生[い]ける者[もの]の書[しょ]から消[け]し去[さ]られ、正[ただ]しい者[もの]とともに記[しる]されませんように。"
  29: "わたしは貧[まず]しく、苦[くる]しんでいる。神[かみ]よ、あなたの顔[かお]の救[すく]いが、わたしを支[ささ]えてくれる。"
  30: "わたしは歌[うた]をもって神[かみ]の名[な]をほめたたえ、賛美[さんび]をもって神[かみ]を崇[あが]める。"
  31: "これは、角[つの]とひづめのある若[わか]い牛[うし]よりも、神[かみ]に喜[よろこ]ばれる。"
  32: "貧[まず]しい者[もの]たちはこれを見[み]て喜[よろこ]ぶように。神[かみ]を求[もと]めよ。そうすれば、あなたがたの魂[たましい]は生[い]きる。"
  33: "主[しゅ]は貧[まず]しい者[もの]の声[こえ]を聞[き]き、鎖[くさり]につながれた者[もの]たちを軽[かろ]んじられなかった。"
  34: "天[てん]と地[ち]、海[うみ]とその中[なか]に這[は]うすべての者[もの]が、神[かみ]をほめたたえるように。"
  35: "神[かみ]はシオンを救[すく]い、ユダの町[まち]々[まち]を建[た]て直[なお]される。人[ひと]々[びと]はそこに住[す]み、そこを嗣[つ]ぎの地[ち]とする。"
  36: "その僕[しもべ]たちの子孫[しそん]がそこを治[おさ]め、その名[な]を愛[あい]する者[もの]たちがそこに住[す]む。"

notes:
  0: "Εἰς τὸ τέλος, ὑπὲρ τῶν ἀλλοιωθησομένων· τῷ Δαυιδ — «в конец, о имеющих измениться, Давиду»; 指揮者に。変えられようとしている者たちのために。ダビデの詩。 В ru-базе «На Шошанниме» — по евр.; здесь греч. ἀλλοιωθησόμενος («имеющий измениться»). Надписание — стих 0."
  1: "Σῶσόν με, ὁ θεός — 神よ、わたしを救ってください. ὅτι εἰσήλθοσαν ὕδατα ἕως ψυχῆς μου — 水がわたしの魂まで入り込んでいる (εἰσέρχομαι — «входить»; слав. «внидоша воды до души моея»)."
  2: "ἐνεπάγην εἰς ἰλὺν βυθοῦ — 深い泥に沈み (ἐμπήγνυμι — «увязать, втыкаться»; ἰλύς — «ил, тина»; βυθός — «глубина»). οὐκ ἔστιν ὑπόστασις — 立つ所がない (ὑπόστασις — «основание, опора»; слав. «несть постояния»). ἦλθον εἰς τὰ βάθη τῆς θαλάσσης — 海の深みに入り. καταιγὶς κατεπόντισέν με — 嵐がわたしを覆い尽くした (καταιγίς — «буря»; καταποντίζω — «потоплять»)."
  3: "ἐκοπίασα κράζων — 呼び続けて疲れ (κοπιάω — «утомляться»; κράζω — «взывать»). ἐβραγχίασεν ὁ λάρυγξ μου — 喉はかすれた (βραγχιάω — «хрипнуть»; λάρυγξ — «гортань»). ἐξέλιπον οἱ ὀφθαλμοί μου ἀπὸ τοῦ ἐλπίζειν ἐπὶ τὸν θεόν μου — わたしの目は、神を待ち望みながら衰えた (ἐκλείπω — «иссякать»; ἐλπίζω ἐπί — «надеяться на»)."
  4: "ἐπληθύνθησαν ὑπὲρ τὰς τρίχας τῆς κεφαλῆς μου οἱ μισοῦντές με δωρεάν — いたずらに憎む者は頭の毛よりも多い (δωρεάν — «напрасно, без причины»; θρίξ — «волос»). ἃ οὐχ ἥρπασα, τότε ἀπετίννυον — 奪わなかったものまで返さねばならない (ἁρπάζω — «похищать»; ἀποτίνω — «возвращать, платить»; слав. «яже не восхищах, тогда воздах»)."
  5: "σὺ ἔγνως τὴν ἀφροσύνην μου — あなたはわたしの愚かさを知っておられる (ἀφροσύνη — «безумие, глупость»). αἱ πλημμέλειαί μου ἀπὸ σοῦ οὐκ ἐκρύβησαν — わたしの罪はあなたから隠れていない (πλημμέλεια — «прегрешение»; κρύπτω — «скрывать»)."
  6: "μὴ αἰσχυνθείησαν ἐπ᾽ ἐμοὶ οἱ ὑπομένοντές σε — あなたを待ち望む者たちが、わたしのゆえに恥じませんように (αἰσχύνομαι — «стыдиться»; ὑπομένω — «ожидать, терпеть»). κύριε κύριε τῶν δυνάμεων — 主、万軍の主よ (двойное обращение сохранено). μὴ ἐντραπείησαν οἱ ζητοῦντές σε — あなたを求める者たちが辱められませんように (ἐντρέπω — «срамить»)."
  7: "ἕνεκα σοῦ ὑπήνεγκα ὀνειδισμόν — あなたのゆえに非難を負い (ὑποφέρω — «нести, терпеть»; ὀνειδισμός — «поношение»). ἐκάλυψεν ἐντροπὴ τὸ πρόσωπόν μου — 辱めがわたしの顔を覆った (ἐντροπή — «срам»; καλύπτω — «покрывать»)."
  8: "ἀπηλλοτριωμένος ἐγενήθην τοῖς ἀδελφοῖς μου — 兄弟たちから遠ざかり (ἀπαλλοτριόω — «делать чужим»). ξένος τοῖς υἱοῖς τῆς μητρός μου — 母の子らにとってよそ者となった (ξένος — «чужой, странник»)."
  9: "ὁ ζῆλος τοῦ οἴκου σου κατέφαγέν με — あなたの家への熱意がわたしを食い尽くし (ζῆλος — «ревность, усердие»; κατεσθίω — «пожирать»). οἱ ὀνειδισμοὶ τῶν ὀνειδιζόντων σε ἐπέπεσαν ἐπ᾽ ἐμέ — あなたをそしる者のそしりがわたしに降りかかった (ὀνειδίζω — «поносить»; ἐπιπίπτω — «нападать»). Стих приведён в Ин 2:17 как слова Христа; здесь это слова Давида — красного нет."
  10: "συνέκαμψα ἐν νηστείᾳ τὴν ψυχήν μου — 断食して魂を低くした (συγκάμπτω — «сгибать, смирять»; νηστεία — 断食). ἐγενήθη εἰς ὀνειδισμὸν ἐμοί — それがわたしへの非難になった (слав. «бысть в поношение мне»)."
  11: "ἐθέμην τὸ ἔνδυμά μου σάκκον — 着物を粗布とした (ἔνδυμα — «одежда»; σάκκος — «вретище»; 粗布[あらぬの], как по корпусу). ἐγενόμην αὐτοῖς εἰς παραβολήν — 彼らのことわざとなった (παραβολή — «притча, поговорка»; слав. «бых им в притчу»)."
  12: "κατ᾽ ἐμοῦ ἠδολέσχουν οἱ καθήμενοι ἐν πύλῃ — 門のそばに座る者たちはわたしのことを語り合い (ἀδολεσχέω — «пустословить»; πύλη — «врата»). εἰς ἐμὲ ἔψαλλον οἱ πίνοντες τὸν οἶνον — 酒を飲む者たちはわたしを歌にした (ψάλλω — «петь»; οἶνος — 酒)."
  13: "ἐγὼ δὲ τῇ προσευχῇ μου πρὸς σέ — しかし、わたしはあなたに祈る. καιρὸς εὐδοκίας — 恵みの時 (καιρός — «время»; εὐδοκία — «благоволение»). ἐν τῷ πλήθει τοῦ ἐλέους σου — あなたのあわれみの多さによって (ἔλεος — あわれみ). ἐπάκουσόν μου ἐν ἀληθείᾳ τῆς σωτηρίας σου — あなたの救いの真実をもって聞いてください (ἀλήθεια — «истина, верность»; слав. «во истине спасения Твоего»)."
  14: "σῶσόν με ἀπὸ πηλοῦ, ἵνα μὴ ἐμπαγῶ — 泥から救い出してください、沈みませんように (πηλός — «глина, грязь»; ἐμπήγνυμι — «увязать»). ῥυσθείην ἐκ τῶν μισούντων με — 憎む者から救い出されますように (ῥύομαι — «избавлять»). ἐκ τοῦ βάθους τῶν ὑδάτων — 深い水から."
  15: "μὴ καταποντισάτω με καταιγὶς ὕδατος — 水の嵐が沈めませんように. μηδὲ καταπιέτω με βυθός — 深みが飲み込みませんように (καταπίνω — «проглатывать»; βυθός — «пучина»). μηδὲ συσχέτω ἐπ᾽ ἐμὲ φρέαρ τὸ στόμα αὐτοῦ — 井戸がその口をわたしの上に閉じませんように (φρέαρ — «колодец, яма»; слав. «ров»)."
  16: "ὅτι χρηστὸν τὸ ἔλεός σου — あなたのあわれみは恵み深い (χρηστός — «благой»). κατὰ τὸ πλῆθος τῶν οἰκτιρμῶν σου ἐπίβλεψον ἐπ᾽ ἐμέ — あなたの多くのあわれみによって、わたしに目を留めてください (οἰκτιρμός — «милосердие, щедроты»; ἐπιβλέπω — «призирать»)."
  17: "μὴ ἀποστρέψῃς τὸ πρόσωπόν σου ἀπὸ τοῦ παιδός σου — あなたの顔を僕から背けませんように (ἀποστρέφω — «отвращать»; παῖς — 僕). ὅτι θλίβομαι — わたしは苦しんでいる (θλίβω — «теснить, угнетать»). ταχὺ ἐπάκουσόν μου — すみやかに聞いてください."
  18: "πρόσχες τῇ ψυχῇ μου — わたしの魂に心を留め (προσέχω — «внимать»). λύτρωσαι αὐτήν — これを贖い出してください (λυτρόω — «искупать»). ἕνεκα τῶν ἐχθρῶν μου ῥῦσαί με — 敵のゆえに、わたしを救い出してください (ἕνεκα — «ради»)."
  19: "σὺ γὰρ γινώσκεις τὸν ὀνειδισμόν μου — あなたはわたしへの非難を知っておられる. τὴν αἰσχύνην μου καὶ τὴν ἐντροπήν μου — わたしの恥ずかしさと辱め (три близких слова сохранены, как в греч.). ἐναντίον σου πάντες οἱ θλίβοντές με — わたしを苦しめる者はすべて、あなたの前にいる."
  20: "ὀνειδισμὸν προσεδόκησεν ἡ ψυχή μου καὶ ταλαιπωρίαν — わたしの魂は非難と苦しみを待ち望んだ (προσδοκάω — «ожидать»; ταλαιπωρία — «бедствие, страдание»; слав. «поношение чаяше душа моя и страсть»). ὑπέμεινα συλλυπούμενον, καὶ οὐχ ὑπῆρξεν — ともに悲しむ者を待ったが、だれもいなかった (συλλυπέομαι — «сострадать»). παρακαλοῦντας, καὶ οὐχ εὗρον — 慰める者を求めたが見つからなかった (παρακαλέω — «утешать»)."
  21: "ἔδωκαν εἰς τὸ βρῶμά μου χολὴν — 食べ物に苦い胆汁を与え (χολή — «желчь»; 胆汁[たんじゅう]). εἰς τὴν δίψαν μου ἐπότισάν με ὄξος — 渇いたわたしに酢を飲ませた (δίψα — «жажда»; ὄξος — «уксус»; ποτίζω — «поить»). Стих приведён в Страстях (Мф 27:34,48); здесь слова Давида — красного нет."
  22: "γενηθήτω ἡ τράπεζα αὐτῶν ἐνώπιον αὐτῶν εἰς παγίδα — 彼らの食卓が彼らの前でわなとなるように (τράπεζα — 食卓; παγίς — «сеть, петля»). εἰς ἀνταπόδοσιν καὶ εἰς σκάνδαλον — 報いとなり、つまずきとなるように (ἀνταπόδοσις — «воздаяние»; σκάνδαλον — «соблазн, ловушка»)."
  23: "σκοτισθήτωσαν οἱ ὀφθαλμοὶ αὐτῶν τοῦ μὴ βλέπειν — 彼らの目が暗くなって見えなくなりますように (σκοτίζω — «омрачать»). τὸν νῶτον αὐτῶν διὰ παντὸς σύγκαμψον — 彼らの背をいつまでも曲げておられますように (νῶτος — «спина»; συγκάμπτω — «сгибать»; слав. «хребет их выну сляцай»)."
  24: "ἔκχεον ἐπ᾽ αὐτοὺς τὴν ὀργήν σου — あなたの怒りを彼らの上に注ぎ (ἐκχέω — «изливать»; ὀργή — 怒り). ὁ θυμὸς τῆς ὀργῆς σου καταλάβοι αὐτούς — あなたの怒りの激しさが彼らを捕らえますように (θυμός — «ярость»; καταλαμβάνω — «постигать»)."
  25: "γενηθήτω ἡ ἔπαυλις αὐτῶν ἠρημωμένη — 彼らの住まいが荒れ果てますように (ἔπαυλις — «двор, усадьба»; ἐρημόω — «опустошать»). ἐν τοῖς σκηνώμασιν αὐτῶν μὴ ἔστω ὁ κατοικῶν — その天幕に住む者がいなくなりますように (σκήνωμα — «жилище, шатёр»). Стих приведён в Деян 1:20."
  26: "ὃν σὺ ἐπάταξας, αὐτοὶ κατεδίωξαν — あなたが打たれた者を、彼らは追いかけた (πατάσσω — «поражать»; καταδιώκω — «преследовать»). ἐπὶ τὸ ἄλγος τῶν τραυματιῶν σου προσέθηκαν — あなたが傷つけられた者の痛みをさらに増した (ἄλγος — «боль»; τραυματίας — «раненый»; προστίθημι — «прибавлять»)."
  27: "πρόσθες ἀνομίαν ἐπὶ τὴν ἀνομίαν αὐτῶν — 彼らの不法に不法を重ねてください (ἀνομία — 不法; πρόστιθημι — «прибавлять»). μὴ εἰσελθέτωσαν ἐν δικαιοσύνῃ σου — 彼らがあなたの義に入らないように (δικαιοσύνη — 義; слав. «в правду Твою»)."
  28: "ἐξαλειφθήτωσαν ἐκ βίβλου ζώντων — 生ける者の書から消し去られますように (ἐξαλείφω — «изглаживать»; βίβλος ζώντων — «книга живых»). μετὰ δικαίων μὴ γραφήτωσαν — 正しい者とともに記されませんように (γράφω — «записывать»; ср. Откр 3:5; 20:15)."
  29: "πτωχὸς καὶ ἀλγῶν εἰμι ἐγώ — わたしは貧しく、苦しんでいる (ἀλγέω — «болеть, страдать»). ἡ σωτηρία τοῦ προσώπου σου ἀντελάβετό μου — あなたの顔の救いが、わたしを支えてくれる (ἀντιλαμβάνω — «поддерживать, заступать»; слав. «спасение Твое, Боже, заступит мя»)."
  30: "αἰνέσω τὸ ὄνομα τοῦ θεοῦ μετ᾽ ᾠδῆς — 歌をもって神の名をほめたたえる (αἰνέω — «хвалить»; ᾠδή — 歌). μεγαλυνῶ αὐτὸν ἐν αἰνέσει — 賛美をもって神を崇める (μεγαλύνω — «величать»; 崇める для δοξάζω/μεγαλύνω, в отличие от ほめたたえる — αἰνέω; αἴνεσις — «хваление»)."
  31: "ἀρέσει τῷ θεῷ ὑπὲρ μόσχον νέον — 若い牛よりも神に喜ばれる (ἀρέσκω — «быть угодным»; μόσχος — «телец»). κέρατα ἐκφέροντα καὶ ὁπλάς — 角とひづめのある (ὁπλή — «копыто»; слав. «роги износяща и пазнокти»)."
  32: "ἰδέτωσαν πτωχοὶ καὶ εὐφρανθήτωσαν — 貧しい者たちはこれを見て喜ぶように (εὐφραίνω — «веселить»). ἐκζητήσατε τὸν θεόν — 神を求めよ (ἐκζητέω — «взыскивать»). ζήσεται ἡ ψυχὴ ὑμῶν — あなたがたの魂は生きる (в ru-базе и у jp-joc «сердце» — по евр.; здесь ψυχή — 魂)."
  33: "εἰσήκουσεν τῶν πενήτων ὁ κύριος — 主は貧しい者の声を聞き (πένης — «бедный, неимущий»; εἰσακούω — «услышать»). τοὺς πεπεδημένους αὐτοῦ οὐκ ἐξουδένωσεν — 鎖につながれた者たちを軽んじられなかった (πεδέω — «связывать»; ἐξουδενόω — «уничижать»)."
  34: "αἰνεσάτωσαν αὐτὸν οἱ οὐρανοὶ καὶ ἡ γῆ — 天と地が神をほめたたえるように. θάλασσα καὶ πάντα τὰ ἕρποντα ἐν αὐτοῖς — 海とその中に這うすべての者 (ἕρπω — «ползать»; слав. «вся живущая в нем»)."
  35: "ὁ θεὸς σώσει τὴν Σιων — 神はシオンを救い (Σιων — シオン). οἰκοδομηθήσονται αἱ πόλεις τῆς Ιουδαίας — ユダの町々を建て直される (οἰκοδομέω — «строить»; Ιουδαία — ユダ). κατοικήσουσιν ἐκεῖ καὶ κληρονομήσουσιν αὐτήν — そこに住み、そこを嗣ぎの地とする (κληρονομέω — «наследовать»)."
  36: "τὸ σπέρμα τῶν δούλων αὐτοῦ καθέξουσιν αὐτήν — その僕たちの子孫がそこを治める (σπέρμα — «семя, потомство»; κατέχω — «владеть, держать»). οἱ ἀγαπῶντες τὸ ὄνομα αὐτοῦ κατασκηνώσουσιν ἐν αὐτῇ — その名を愛する者たちがそこに住む (κατασκηνόω — «обитать»)."
