# jp-box, Псалтирь, псалом 68. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0.
# Псалом 68: воды до души (1–3), ненавидящие без вины (4–5), чуждый братьям (6–9),
# пост и вретище (10–12), молитва в благоприятное время (13–18),
# поношение и желчь (19–21), проклятия врагам (22–28),
# хвала вместо жертвы и спасение Сиона (29–36).
# Красного и синего нет: это слова Давида (ст. 9 приведён в Ин 2:17, ст. 21 — в Страстях,
# но здесь говорит псалмопевец), поэтому <j> не ставится.
# Кавычки: прямой речи в главе нет; проклятия и обеты — речь самого псалмопевца.
# 〔…〕 нет: все слова в gr-lxx-byz есть.
# セラ (διάψαλμα) в этом псалме нет; надписание и стихи — по номерам базы, не сдвинуты.
