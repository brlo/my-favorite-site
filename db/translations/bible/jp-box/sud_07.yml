verses:
  1: "エルバアル、すなわちギデオンは朝早[あさはや]く起[お]き、彼[かれ]とともにいる民[たみ]すべてとともにアロエドの地[ち]に陣[じん]を敷[し]いた。ミディアンとアマレクの陣[じん]は、彼[かれ]の北[きた]、アボルの丘[おか]のほとり、谷[たに]の中[なか]にあった。"
  2: "主[しゅ]はギデオンに言[い]われた。「あなたとともにいる民[たみ]は多[おお]すぎる。わたしがミディアンを彼[かれ]らの手[て]に渡[わた]すと、イスラエルがわたしに向[む]かって『わたしの手がわたしを救[すく]った』と言[い]って誇[ほこ]るかもしれない。」"
  3: "主[しゅ]は彼[かれ]に言[い]われた。「民[たみ]の耳[みみ]に語[かた]って言[い]いなさい。『恐[おそ]れて怖[こわ]がる者[もの]は、引[ひ]き返[かえ]してギレアデの山[やま]から去[さ]れ』と。」すると民[たみ]のうち二万二千人[にん]が引き返[かえ]し、一万人[にん]が残[のこ]った。"
  4: "主[しゅ]はギデオンに言[い]われた。「民[たみ]はまだ多[おお]い。彼[かれ]らを水[みず]のところへ下[お]ろしなさい。そこでわたしはあなたのために彼[かれ]らを試[こころ]みる。わたしがあなたに『この者[もの]はあなたとともに行[い]く』と言[い]う者[もの]は、あなたとともに行[い]き、わたしがあなたに『この者[もの]はあなたとともに行[い]かない』と言[い]う者[もの]は、行[い]かない。」"
  5: "彼[かれ]が民[たみ]を水[みず]のところへ下[おろ]すと、主[しゅ]はギデオンに言[い]われた。「犬[いぬ]が水[みず]をなめるように、舌[した]で水[みず]をなめる者[もの]は、すべて、別[べつ]にして立[た]たせなさい。また、ひざをかがめて水[みず]を飲[の]む者[もの]も、すべて、別にして立[た]たせなさい。」"
  6: "舌[した]で水[みず]をなめた者[もの]の数[かず]は三百人[にん]であった。民[たみ]のほかの者[もの]はみな、水[みず]を飲[の]むためにひざをかがめた。"
  7: "主[しゅ]はギデオンに言[い]われた。「水[みず]をなめた三百人[にん]によって、わたしはあなたがたを救[すく]い、ミディアンをあなたの手[て]に渡[わた]す。民[たみ]はみな、それぞれ自分[じぶん]の場所[ばしょ]へ去[さ]らせなさい。」"
  8: "彼[かれ]らは民[たみ]の食[た]べ物[もの]と、その角笛[つのぶえ]を手[て]に取[と]った。ギデオンはイスラエルのすべての人[ひと]をそれぞれ自分[じぶん]の天幕[てんまく]へ帰[かえ]し、三百人[にん]だけを引[ひ]き止[と]めた。ミディアン人[じん]の陣[じん]は、彼[かれ]の下[した]の谷[たに]にあった。"
  9: "その夜[よる]、主[しゅ]は彼[かれ]に言[い]われた。「立[た]ち上[あ]がって、この場所[ばしょ]から急[いそ]いで陣[じん]へ下[お]りなさい。わたしはそれをあなたの手[て]に渡[わた]した。"
  10: "もしあなたが下[お]りるのを恐[おそ]れるなら、しもべのフラとともに陣[じん]へ下[お]りなさい。"
  11: "彼[かれ]らが何[なに]を語[かた]っているかを聞[き]きなさい。その後[あと]、あなたの手[て]は強[つよ]くなり、あなたは陣[じん]へ下[お]りるであろう。」ギデオンはしもべのフラとともに、陣[じん]にいる五十人[にん]の隊[たい]のところへ下[お]りた。"
  12: "ミディアン人[じん]、アマレク人[じん]、および東[ひがし]のすべての民[たみ]は谷[たに]に陣[じん]を敷[し]いていた。それはいなごのように多[おお]く、らくだは数[かず]がなく、海[うみ]の岸[きし]の砂[すな]のようであった。"
  13: "ギデオンがそこへ入[はい]ると、見[み]よ、一人[ひとり]の男[おとこ]が隣[となり]の者[もの]に夢[ゆめ]を語[かた]っていた。「見よ、わたしが見た夢はこうだ。大麦[おおむぎ]のパンが一[ひと]つ、ミディアンの陣[じん]を転[ころ]がって行[い]き、ミディアンの天幕[てんまく]に届[とど]いて、それを打[う]ち、くつがえした。天幕は倒[たお]れた。」"
  14: "隣[となり]の者[もの]が答[こた]えて言[い]った。「これはほかのものでもない。イスラエル人[じん]であるヨアシュの子[こ]ギデオンの剣[つるぎ]だ。主[しゅ]はミディアンとその全[ぜん]軍[ぐん]を彼[かれ]の手[て]に渡[わた]された。」"
  15: "ギデオンは夢[ゆめ]の話[はなし]とその解[と]き明[あ]かしを聞[き]くと、主[しゅ]を拝[おが]み、イスラエルの陣[じん]に戻[もど]って言[い]った。「立[た]ち上[あ]がりなさい。主[しゅ]はミディアンの陣[じん]をあなたがたの手[て]に渡[わた]された。」"
  16: "彼[かれ]は三百人[にん]を三[みっ]つの隊[たい]に分[わ]け、すべての者[もの]の手[て]に角笛[つのぶえ]と、空[あ]きの水[みず]がめと、その水[みず]がめの中[なか]のたいまつを与[あた]えた。"
  17: "そして彼[かれ]らに言[い]った。「わたしを見[み]て、そのとおりにしなさい。見[み]よ、わたしは陣[じん]の中[なか]へ入[はい]って行[い]く。わたしがするように、あなたがたもそのとおりにしなさい。"
  18: "わたしとともにいるすべての者[もの]が角笛[つのぶえ]を吹[ふ]いたら、あなたがたも陣[じん]の周[まわ]りで角笛を吹[ふ]き、『主[しゅ]のため、ギデオンのため』と言[い]いなさい。」"
  19: "ギデオンと彼[かれ]とともにいる百人[にん]は、真[ま]ん中[なか]の見張[みは]りの始[はじ]まるころ、陣[じん]の端[はし]に着[つ]いた。彼[かれ]らは見張[みは]りたちを起[お]こし、角笛[つのぶえ]を吹[ふ]いて、手[て]に持[も]っていた水[みず]がめを打[う]ち砕[くだ]いた。"
  20: "三[みっ]つの隊[たい]は角笛[つのぶえ]を吹[ふ]き、水[みず]がめを打[う]ち砕[くだ]き、左[ひだり]の手[て]にたいまつを、右[みぎ]の手[て]に吹[ふ]くための角笛[つのぶえ]を取[と]って、叫[さけ]んだ。「主[しゅ]の剣[つるぎ]、ギデオンの剣[つるぎ]。」"
  21: "彼[かれ]らはそれぞれ自分[じぶん]の場所[ばしょ]に立[た]って、陣[じん]の周[まわ]りを囲[かこ]んだ。すると陣[じん]の全[ぜん]軍[ぐん]は走[はし]り出[だ]し、叫[さけ]び、逃[に]げた。"
  22: "三百本[ぼん]の角笛[つのぶえ]が吹[ふ]き鳴[な]らされると、主[しゅ]は陣[じん]の全[ぜん]域[いき]で、人[ひと]の剣[つるぎ]を隣[となり]の者[もの]に向[む]けさせた。陣[じん]はベテ・シャッタまで逃[に]げ、アベル・メホラの岸[きし]に追[お]い詰[つ]められ、さらにタバトにまで及[およ]んだ。"
  23: "イスラエルの人[ひと]々[びと]は、ナフタリとアシェルから、またマナセの部[ぶ]族[ぞく]の全[すべ]てから呼[よ]び集[あつ]められ、ミディアンの後[あと]を追[お]った。"
  24: "ギデオンはエフライムの山[さん]地[ち]の全[すべ]てに使者[ししゃ]を送[おく]って言[い]った。「ミディアンに会[あ]いに出[で]て、彼[かれ]らに先[さき]んじてベテ・バラに至[いた]る水[みず]とヨルダン川を押[お]さえなさい。」エフライムの人[ひと]々[びと]はみな呼[よ]び集[あつ]められ、ベテ・バラに至[いた]る水[みず]とヨルダン川を先[さき]んじて押[お]さえた。"
  25: "彼[かれ]らはミディアンの二人[ふたり]の首長[しゅちょう]、オレブとゼエブを捕[つか]まえた。オレブはスリンで、ゼエブはヤケフ・ゼブで殺[ころ]された。彼[かれ]らはミディアンを追[お]い、オレブとゼエブの首[くび]をヨルダン川の向[む]こう側[がわ]からギデオンのところへ持[も]って来[き]た。"

notes:
  1: "ὤρθρισεν — встал рано (ὀρθρίζω). Ιεροβααλ [αὐτός ἐστιν Γεδεων] — пояснение переводчика LXX: Ероваал, он же Гедеон (в корпусе エルバアル). παρενέβαλεν — расположился станом (παρεμβάλλω). ἐπὶ τὴν γῆν Αρωεδ — «на землю Ароед»; слав. «у источника арад», Син. «у источника Харода» — в gr другой топоним, поэтому アロエドの地. ἀπὸ βουνοῦ τοῦ Αβωρ — «от холма Авор»; слав. «на холме мосе гавааф-аморе», Син. «у холма Море» (евр. Гив‘ат ха-Море). κοιλάς — долина."
  2: "πολὺς ὁ λαός — народ многочислен. ὥστε μὴ παραδοῦναί με — так что не предать Мне (ὥστε + инфинитив). μήποτε καυχήσηται — как бы не похвалился. Ἡ χεὶρ μου ἔσωσέν με — «рука моя спасла меня»: вложенная речь 『…』."
  3: "εἰς τὰ ὦτα τοῦ λαοῦ — «в уши народа», т. е. вслух. Τίς δειλὸς καὶ φοβούμενος; — кто боязлив и страшится. ἀποστραφήτω — да возвратится (повелит. 3 л. ед. ч.). ἀπὸ τοῦ ὄρους τοῦ Γαλααδ — от горы Галаад (слав. «от горы галаадовы»). ἐξώρμησαν — устремились прочь. εἴκοσι καὶ δύο χιλιάδες — 22 000; ὑπελείφθησαν — осталось 10 000."
  4: "κατάγαγε — сведи вниз (κατάγω). δοκιμῶ αὐτούς σοι — «испытаю их тебе» (δοκιμάζω). Оба раза ὃν ἐὰν εἴπω — «кого скажу»; слова Бога о каждом — вложенная речь 『…』. Второе «не пойдёт» — αὐτὸς οὐ πορεύσεται."
  5: "λάψῃ τῇ γλώσσῃ — лизнёт языком (λάπτω). ὡς ἐὰν λάψῃ ὁ κύων — как лижет пёс. στήσεις αὐτὸν κατὰ μόνας — поставишь его отдельно. κάμψῃ ἐπὶ τὰ γόνατα — преклонит колени. μεταστήσεις αὐτὸν καθ᾽ αὑτόν — отставишь его особо."
  6: "ὁ ἀριθμὸς τῶν λαψάντων — число лизавших. τριακόσιοι ἄνδρες — 300 мужей. ὁ ἐπίλοιπος τοῦ λαοῦ — остальной народ. Слав. добавляет «в горстех» (пригоршнями, с ладоней) — в gr этого нет; ἔκαμψαν на колени."
  7: "ἐν τοῖς τριακοσίοις — тремястами. σώσω ὑμᾶς — спасу вас (мн. ч.), παραδώσω ἐν χειρί σου — предам в руку твою (ед. ч.): в gr число меняется. ἀποτρεχέτω ἀνὴρ εἰς τὸν τόπον αὐτοῦ — пусть бежит каждый на своё место."
  8: "ἐπισιτισμόν — съестной припас (ἐπισιτισμός). κερατίνας — роговые трубы (κερατίνη). ἐξαπέστειλεν ἄνδρα εἰς τὸ σκήνωμα αὐτοῦ — отпустил каждого в шатёр его. ἐκράτησεν — удержал. ὑποκάτωθεν αὐτοῦ — ниже его."
  9: "ἐγενήθη ἐν τῇ νυκτὶ ἐκείνῃ — было в ту ночь. Ἀνάστα κατάβηθι τὸ τάχος — встань, сойди быстро. παρέδωκα — предал (перфект: решено и совершено)."
  10: "εἰ δὲ φοβῇ σὺ καταβῆναι — если же боишься сойти. Φαρα τὸ παιδάριόν σου — Фара, отрок (слуга) твой; в корпусе フラ, ср. Син. «Фура»."
  11: "ἀκούσῃ τί λαλοῦσιν — услышишь, что говорят. ἰσχύσουσιν αἱ χεῖρές σου — укрепятся руки твои. εἰς μέρος τῶν πεντήκοντα — «к части пятидесяти», т. е. к отряду из полусотни (слав. «в часть пятьдесятников»)."
  12: "ὡς ἀκρὶς εἰς πλῆθος — как саранча по множеству. ταῖς καμήλοις οὐκ ἦν ἀριθμός — верблюдам не было числа. ὡς ἡ ἄμμος ἡ ἐπὶ τὸ χεῖλος τῆς θαλάσσης — как песок на берегу моря."
  13: "ἐξηγεῖτο τὸ ἐνύπνιον — изъяснял сон (ἐξηγέομαι). μαγὶς ἄρτου κριθίνου — лепёшка (круглый хлеб) ячменная; μαγίς — «коврига». κυλιομένη — катаясь. ἐπάταξεν καὶ κατέστρεψεν — ударил и опрокинул."
  14: "ῥομφαία Γεδεων υἱοῦ Ιωας — меч Гедеона, сына Иоаса. ἀνδρὸς Ισραηλ — мужа Израилева. В gr παρέδωκεν κύριος — «предал Господь»; слав. и Син. здесь «Бог»."
  15: "τὴν διήγησιν τοῦ ἐνυπνίου καὶ τὴν σύγκρισιν — рассказ сна и его истолкование (σύγκρισις). προσεκύνησεν κύριον — поклонился Господу. παρέδωκεν ἐν χερσὶν ὑμῶν — предал в руки ваши."
  16: "τρεῖς ἀρχάς — три отряда (ἀρχή здесь «часть, начальство»). κερατίνας — роговые трубы. ὑδρίας κενάς — пустые кувшины (ὑδρία). λαμπάδας ἐν μέσῳ τῶν ὑδριῶν — светильники внутри кувшинов."
  17: "Ἀπ᾽ ἐμοῦ ὄψεσθε — «с меня смотрите». εἰσπορεύομαι — вхожу (настоящее время). ἔσται ὡς ἐὰν ποιήσω — будет, как сделаю."
  18: "σαλπιῶ τῇ κερατίνῃ — затрублю рогом (σαλπίζω). κύκλῳ τῆς παρεμβολῆς — вокруг стана. ἐρεῖτε Τῷ κυρίῳ καὶ τῷ Γεδεων — «Господу и Гедеону»; слав. вставляет «мечь» в скобках, в gr его нет (ср. 7:20)."
  19: "ἐν μέρει τῆς παρεμβολῆς — в край (часть) стана. ἀρχομένης τῆς φυλακῆς τῆς μεσούσης — при начале средней стражи. πλὴν ἐγέρσει ἤγειρεν τοὺς φυλάσσοντας — «только поднятием разбудил стражей»: тёмное место, слав. «убужением возбудиша стрегущих». ἐξετίναξαν τὰς ὑδρίας — вытряхнули (разбили) кувшины."
  20: "συνέτριψαν τὰς ὑδρίας — сокрушили кувшины. ἐν τῇ χειρὶ τῇ ἀριστερᾷ ... τῇ δεξιᾷ — в левой и правой руке. ἀνέκραξαν Ῥομφαία τῷ κυρίῳ καὶ τῷ Γεδεων — «меч Господу и Гедеону»; в корпусе «主の剣、ギデオンの剣»."
  21: "ἔστησαν ἕκαστος καθ᾽ ἑαυτόν — стал каждый на своём месте (букв. «по себе»). ἐσήμαναν — дали знак, затрубили (σημαίνω). ἔδραμεν πᾶσα ἡ παρεμβολή — побежал весь стан."
  22: "ἐσάλπισαν αἱ τριακόσιαι κερατίναι — затрубили триста труб. ἔθετο κύριος μάχαιραν ἀνδρὸς ἐν τῷ πλησίον αὐτοῦ — Господь обратил меч каждого на ближнего его. ἕως Βαιθασεττα — до Беф-Шитты; ἕως χείλους Αβελμεουλα — до «берега» Авел-Мехолы; ἐπὶ Ταβαθ — до Табафа. συνηγμένη — «собранный», тёмное место (слав. «собрася»)."
  23: "ἐβόησεν ἀνὴρ Ισραηλ — воззвал муж Израиля (ед. ч., собирательно); слав. и Син. — множественное число. ἐκ Νεφθαλιμ καὶ ἐξ Ασηρ καὶ ἐκ παντὸς Μανασση — из Неффалима, Асира и всего Манассии. κατεδίωξαν ὀπίσω — погнались вслед."
  24: "ἐν παντὶ ὁρίῳ Εφραιμ — во всём пределе Ефрема. κατάβητε εἰς συνάντησιν — сойдите навстречу. καταλάβετε ἑαυτοῖς τὸ ὕδωρ — захватите себе воду (переправы). ἕως Βαιθβηρα — до Беф-Бара. προκατελάβοντο — предварительно заняли."
  25: "συνέλαβον τοὺς δύο ἄρχοντας — взяли двух начальников (ἄρχων). Ωρηβ καὶ Ζηβ — Орив и Зив (в корпусе オレブ, ゼエブ). ἐν Σουριν — в Сурине; ἐν Ιακεφζηβ — в Иакеф-Зиве; слав. «в суре», «во иакефзиве». ἤνεγκαν ... ἐκ τοῦ πέραν τοῦ Ιορδάνου — принесли с той стороны Иордана."
