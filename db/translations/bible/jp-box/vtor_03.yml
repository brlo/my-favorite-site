verses:
  1: "「そして、わたしたちは向[む]きを変[か]えてバシャンへの道[みち]を上[のぼ]った。すると、バシャンの王[おう]オグは、彼[かれ]とその民[たみ]すべてとともに、エドラインでわたしたちに戦[たたか]いを仕[しか]けて出[で]て来[き]た。"
  2: "主[しゅ]はわたしに言[い]われた。『彼[かれ]を恐[おそ]れてはならない。わたしは彼[かれ]とその民[たみ]、その地[ち]のすべてを、あなたの手[て]に渡[わた]したからである。あなたは、エセボンに住[す]んでいたアモリ人[じん]の王[おう]シホンにしたとおりに、彼[かれ]にもしなさい。』"
  3: "わたしたちの神[かみ]である主[しゅ]は、バシャンの王[おう]オグとその民[たみ]すべてをわたしたちの手[て]に渡[わた]されたので、わたしたちは彼[かれ]を打[う]ち、彼[かれ]の子孫[しそん]を一人[ひとり]も残[のこ]さなかった。"
  4: "その時[とき]、わたしたちは彼[かれ]のすべての町[まち]を取[と]った。わたしたちが彼[かれ]らから取[と]らなかった町[まち]は一[ひと]つもない。六十[ろくじゅう]の町[まち]、すなわちバシャンにあるオグの王国[おうこく]、アルゴブのすべての地域[ちいき]である。"
  5: "これらはみな、高[たか]い城壁[じょうへき]、門[もん]とかんぬきを備[そな]えた堅固[けんご]な町々[まちまち]であった。ただ、フェレズ人[じん]の町々[まちまち]は非常[ひじょう]に多[おお]く、城壁[じょうへき]はなかった。"
  6: "わたしたちはシホン王[おう]にしたのと同[おな]じく、彼[かれ]らを聖絶[せいぜつ]した。すなわち、すべての町[まち]と、その女[おんな]たちと子[こ]どもたちを続[つづ]けて聖絶した。"
  7: "ただ、すべての家畜[かちく]と、町々[まちまち]の分捕[ぶんど]り物[もの]は、わたしたちのものとして奪[うば]い取[と]った。"
  8: "そして、その時[とき]、わたしたちは、ヨルダン川[がわ]の向[む]こう側[がわ]にある、アルノン川[がわ]からヘルモン山[やま]に至[いた]るまでの、アモリ人[じん]の二人[ふたり]の王[おう]の手[て]から地[ち]を取[と]った。"
  9: "フェニキア人[じん]はヘルモンをサニオルと呼[よ]び、アモリ人[じん]はそれをサニルと名[な]づけた。"
  10: "すなわち、ミソルのすべての町[まち]、ギレアデすべて、バシャンすべて、サルカとエドラインに至[いた]るまで、バシャンにあるオグの王国[おうこく]の町々[まちまち]である。"
  11: "バシャンの王[おう]オグだけがレファイム人[じん]のうちに残[のこ]っていた。見[み]よ、彼[かれ]の寝台[しんだい]は鉄[てつ]の寝台である。見よ、それは、アンモン人[じん]の子[こ]らの都[みやこ]にあるとりでに置[お]かれている。その長[なが]さは九[きゅう]キュビト、その幅[はば]は四[よん]キュビト、人[ひと]の腕[うで]によるキュビトである。"
  12: "その時[とき]、わたしたちはこの地[ち]を嗣業[しぎょう]として受[う]け継[つ]いだ。アルノン川[がわ]の岸[きし]にあるアロエルから、ギレアデの山[やま]の半分[はんぶん]とその町々[まちまち]を、わたしはルベンとガドに与[あた]えた。"
  13: "残[のこ]りのギレアデとバシャンすべて、すなわちオグの王国[おうこく]、アルゴブのすべての地域[ちいき]、そのバシャンすべてを、わたしはマナセの部族[ぶぞく]の半分[はんぶん]に与[あた]えた。それはレファイム人[じん]の地[ち]と見[み]なされる。"
  14: "マナセの子[こ]ヤイルはアルゴブのすべての地域[ちいき]を、ガルガシ人[じん]とオマハティ人[じん]の領界[りょうかい]に至[いた]るまで取[と]り、それらをバシャンとともに、自分[じぶん]の名[な]にちなんでアウォト・ヤイル（ヤイルの村々[むらむら]）と名[な]づけた。今日[きょう]に至[いた]るまで。"
  15: "わたしはマヒルにギレアデを与[あた]えた。"
  16: "ルベンとガドには、ギレアデからアルノン川[がわ]まで、すなわち川[かわ]の真[ま]ん中[なか]を境[さかい]として、ヤボク川[がわ]に至[いた]るまでを与[あた]えた。ヤボク川はアンモン人[じん]の子[こ]らの境[さかい]である。"
  17: "また、アラバとヨルダン川[がわ]を境[さかい]とし、マハナレトから、アラバの海[うみ]、すなわち塩[しお]の海[うみ]まで、アシドトの下[した]のファスガの東[ひがし]側[がわ]までを与えた。"
  18: "その時[とき]、わたしはあなたがたに命[めい]じて言[い]った。あなたがたの神[かみ]である主[しゅ]は、この地[ち]をあなたがたに割[わ]り当[あ]ての地[ち]として与[あた]えられた。あなたがたは武装[ぶそう]して、あなたがたの兄弟[きょうだい]であるイスラエルの子[こ]らの前[まえ]を、力[ちから]ある者[もの]はみな先[さき]に進[すす]みなさい。"
  19: "ただ、あなたがたの妻[つま]たちと子[こ]どもたち、家畜[かちく]は、わたしがあなたがたに与[あた]えた町々[まちまち]に住[す]みなさい。あなたがたに家畜[かちく]が多[おお]いことは、わたしも知[し]っている。"
  20: "あなたがたの神[かみ]である主[しゅ]があなたがたに与[あた]えられたように、あなたがたの兄弟[きょうだい]たちにも安息[あんそく]を与[あた]え、彼[かれ]らもまた、主[しゅ]がヨルダン川[がわ]の向[む]こう側[がわ]で彼[かれ]らに与[あた]えられる地[ち]を嗣業[しぎょう]として受[う]け継[つ]ぐまで。そうして、あなたがたはおのおの、わたしがあなたがたに与[あた]えた自分の嗣業[しぎょう]に帰[かえ]りなさい。"
  21: "その時[とき]、わたしはヨシュアに命[めい]じて言[い]った。あなたの目[め]は、わたしたちの神[かみ]である主[しゅ]がこの二人[ふたり]の王[おう]にされたすべてのことを見[み]た。主[しゅ]は、あなたが渡[わた]って行[い]くすべての王国[おうこく]にも、同[おな]じようにされるであろう。"
  22: "彼[かれ]らを恐[おそ]れてはならない。あなたがたの神[かみ]である主[しゅ]が、あなたがたのためにご自身[じしん]で戦[たたか]われるからである。"
  23: "その時[とき]、わたしは主[しゅ]に願[ねが]って言[い]った。"
  24: "『主[しゅ]よ、主[しゅ]よ。あなたはご自分[じぶん]の僕[しもべ]に、あなたの強[つよ]さと力[ちから]、強[つよ]い手[て]と高[たか]く上[あ]げられた腕[うで]を示[しめ]し始[はじ]められました。天[てん]でも地[ち]でも、あなたがなさったようなことを、あなたの強[つよ]さに応[おう]じてなしうる神[かみ]が、ほかにいるでしょうか。"
  25: "どうか、わたしに渡[わた]らせて、ヨルダン川[がわ]の向[む]こう側[がわ]にあるあの良[よ]い地[ち]、あの良[よ]い山[やま]とレバノンを見[み]させてください。』"
  26: "しかし、主[しゅ]はあなたがたのゆえにわたしに怒[いか]りを発[はっ]し、わたしの願[ねが]いを聞[き]き入[い]れず、わたしに言[い]われた。『あなたには十分[じゅうぶん]である。このことについて、もはやわたしに語[かた]ってはならない。"
  27: "削[けず]られた岩[いわ]の頂[いただき]に上[のぼ]り、目[め]を上[あ]げて、海[うみ]の方[ほう]、北[きた]、南[みなみ]、東[ひがし]を眺[なが]め、あなたの目[め]で見[み]なさい。あなたはこのヨルダン川[がわ]を渡[わた]らないからである。"
  28: "ヨシュアに命[めい]じ、彼[かれ]を強[つよ]くし、彼[かれ]を励[はげ]ましなさい。彼[かれ]がこの民[たみ]の前[まえ]を進[すす]み、彼[かれ]があなたの見[み]た地[ち]を彼[かれ]らに嗣業[しぎょう]として分[わ]け与[あた]えるからである。』"
  29: "そして、わたしたちはフォゴルの家[いえ]の近[ちか]くの谷[たに]に住[す]んだ。」"

notes:
  1: "ἐπιστραφέντες ἀνέβημεν ὁδὸν τὴν εἰς Βασαν — «обратившись, пошли дорогою в Васан» (дорога идёт в гору, отсюда 上った). ἐξῆλθεν Ωγ … εἰς συνάντησιν ἡμῖν — «вышел Ог навстречу нам». εἰς πόλεμον εἰς Εδραιν — «на войну в Едрею» (Εδραιν; в корпусе エドライン, ср. Числ 21:33)."
  2: "Μὴ φοβηθῇς αὐτόν — «не убойся его» (конъюнктив-запрет). παραδέδωκα — перфект «предал», дар уже совершён. ὥσπερ ἐποίησας Σηων βασιλεῖ τῶν Αμορραίων — «как сделал Сигону, царю Аморрейскому» (двойной датив). ὃς κατῴκει ἐν Εσεβων — «который жил в Есевоне»."
  3: "παρέδωκεν … εἰς τὰς χεῖρας ἡμῶν — «предал в руки наши». ἐπατάξαμεν αὐτὸν ἕως τοῦ μὴ καταλιπεῖν αὐτοῦ σπέρμα — «поразили его так, что не осталось у него семени» (καταλείπω)."
  4: "ἐκρατήσαμεν πασῶν τῶν πόλεων — «овладели всеми городами» (κρατέω с родительным). οὐκ ἦν πόλις, ἣν οὐκ ἐλάβομεν — «не было города, которого мы не взяли» (двойное отрицание, как в LXX). ἑξήκοντα πόλεις — «шестьдесят городов». πάντα τὰ περίχωρα Αργοβ — «все окрестности Аргоба» (περίχωρον). βασιλείας Ωγ ἐν Βασαν — «царства Ога в Васане»."
  5: "πόλεις ὀχυραί — «города укреплённые» (ὀχυρός). τείχη ὑψηλά — «стены высокие». πύλαι καὶ μοχλοί — «ворота и засовы» (μοχλός). πλὴν τῶν πόλεων τῶν Φερεζαίων τῶν πολλῶν σφόδρα — «кроме городов Ферезеев, весьма многих»; слав. «кроме градов ферезейских многих зело», у Синодального «кроме городов неукреплённых» (иное понимание того же места); в тексте добавлено 城壁はなかった по смыслу — речь именно о неукреплённых городах."
  6: "ἐξωλεθρεύσαμεν — «предали заклятию, истребили» (ἐξολεθρεύω; в корпусе 聖絶, сноска не нужна). ὥσπερ ἐποιήσαμεν τὸν Σηων — «как сделали Сигону» (винитив при ἐποίησα со значением «сделали с»). πᾶσαν πόλιν ἑξῆς — «всякий город подряд». γυναῖκας καὶ τὰ παιδία — «женщин и детей»."
  7: "καὶ πάντα τὰ κτῆνη καὶ τὰ σκῦλα τῶν πόλεων ἐπρονομεύσαμεν ἑαυτοῖς — «и весь скот и добычу городов взяли себе в добычу» (προνομεύω; слав. «пленихом себе»)."
  8: "ἐλάβομεν … τὴν γῆν ἐκ χειρῶν δύο βασιλέων τῶν Αμορραίων — «взяли землю из рук двух царей Аморрейских». οἳ ἦσαν πέραν τοῦ Ιορδάνου — «которые были за Иорданом». ἀπὸ τοῦ χειμάρρου Αρνων καὶ ἕως Αερμων — «от потока Арнона до Ермона» (Αερμων — Ермон)."
  9: "Стих в квадратных скобках в gr-lxx-byz (вставка-пояснение). οἱ Φοίνικες — «финикийцы» (слав. «финикиане»; у Синодального «Сидоняне» — по масоретскому тексту). ἐπονομάζουσιν τὸ Αερμων Σανιωρ — «называют Ермон Саниором». ὁ Αμορραῖος ἐπωνόμασεν αὐτὸ Σανιρ — «Аморрей назвал его Санир»."
  10: "πᾶσαι πόλεις Μισωρ — «все города Мисор» (מִישֹׁר — «равнина»; оставлено транслитерацией ミソル, слав. «мисоровы»). ἕως Σελχα καὶ Εδραιν — «до Салхи и Едреи». πόλεις βασιλείας τοῦ Ωγ — «города царства Ога»."
  11: "κατελείφθη ἀπὸ τῶν Ραφαιν — «остался из Рефаимов». κλίνη σιδηρᾶ — «одр железный» (κλίνη — «ложе»; передано 寝台). ἐν τῇ ἄκρᾳ τῶν υἱῶν Αμμων — «в крепости (кремле, столице) сынов Аммоновых»; у Синодального «в Равве». ἐννέα πηχῶν τὸ μῆκος … τεσσάρων πηχῶν τὸ εὖρος — «девять локтей длина … четыре локтя ширина» (πῆχυς — キュビト). ἐν πήχει ἀνδρός — «локтем мужским», т. е. по обычной, не царской мере."
  12: "ἐκληρονομήσαμεν — «получили в удел». ἀπὸ Αροηρ, ἥ ἐστιν ἐπὶ τοῦ χείλους χειμάρρου Αρνων — «от Ароера, что у берега потока Арнона» (χεῖλος — «берег»). τὸ ἥμισυ ὄρους Γαλααδ — «половину горы Галаад». ἔδωκα τῷ Ρουβην καὶ τῷ Γαδ — «дал Рувиму и Гаду»."
  13: "τὸ κατάλοιπον τοῦ Γαλααδ — «остаток Галаада». βασιλείαν Ωγ — «царство Ога». τῷ ἡμίσει φυλῆς Μανασση — «половине племени Манассии». πᾶσαν περίχωρον Αργοβ — «всю округу Аргоба». γῆ Ραφαιν λογισθήσεται — «землёю Рефаимов сочтётся» (в LXX повтор из 2:20)."
  14: "Ιαιρ υἱὸς Μανασση — «Иаир, сын Манассии». ἕως τῶν ὁρίων Γαργασι καὶ Ομαχαθι — «до пределов Гаргаси и Омахафи»; у Синодального «Гесурских и Маахских» (масоретские имена), в LXX иные формы — переданы транслитерацией. ἐπωνόμασεν αὐτὰς ἐπὶ τῷ ὀνόματι αὐτοῦ — «назвал их по имени своему». τὴν Βασαν Αυωθ Ιαιρ — «Васан Авоф Иаир», т. е. «селения Иаира» (חַוִּית יָאִיר), отсюда пояснение в скобках."
  15: "καὶ τῷ Μαχιρ ἔδωκα τὴν Γαλααδ — «и Махиру дал Галаад». Махир — первенец Манассии (ср. Числ 32:39). Краткий стих, как в LXX и слав."
  16: "ἀπὸ τῆς Γαλααδ ἕως χειμάρρου Αρνων — «от Галаада до потока Арнона». μέσον τοῦ χειμάρρου ὅριον — «середина потока — предел» (в квадратных скобках в gr-lxx-byz). ἕως τοῦ Ιαβοκ — «до Иавока». ὁ χειμάρρους ὅριον τοῖς υἱοῖς Αμμαν — «поток — предел сынам Аммоновым»."
  17: "ἡ Αραβα καὶ ὁ Ιορδάνης ὅριον — «Арава и Иордан — предел» (без глагола, как в LXX). Μαχαναρεθ — «Маханарет» (у Синодального «Киннереф» — иное чтение, вероятно Χενερεθ). θάλασσα ἁλυκή — «море солёное» (ἁλυκός), т. е. Мёртвое. ὑπὸ Ασηδωθ τὴν Φασγα ἀνατολῶν — «под Асидофом, Фасга, к востоку»."
  18: "ἐνετειλάμην ὑμῖν — «заповедал вам». ἐν κλήρῳ — «в удел». ἐνοπλισάμενοι προπορεύεσθε — «вооружившись, идите впереди» (ὁπλίζομαι). πᾶς δυνατός — «всякий сильный», т. е. годный к войне."
  19: "πλὴν αἱ γυναῖκες ὑμῶν — «только жёны ваши». οἶδα ὅτι πολλὰ κτῆνη ὑμῖν — «знаю, что много скота у вас» (вставка в скобках в LXX). κατοικείτωσαν — «пусть живут» (императив 3 л.)."
  20: "ἕως ἂν καταπαύσῃ κύριος — «доколе не успокоит Господь» (καταπαύω). ὥσπερ καὶ ὑμᾶς — «как и вас». κατακληρονομήσουσιν — «получат в удел». ἐπαναστραφήσεσθε ἕκαστος εἰς τὴν κληρονομίαν αὐτοῦ — «возвратитесь каждый в удел свой»."
  21: "τῷ Ἰησοῖ ἐνετειλάμην — «Иисусу заповедал». Οἱ ὀφθαλμοὶ ὑμῶν ἑωράκασιν — «очи ваши видели» (мн. ч. при обращении к Иисусу — так в LXX; в ст. 22 тоже мн. ч.). ἐφ᾿ ἃς σὺ διαβαίνεις ἐκεῖ — «в которые ты переходишь там»."
  22: "οὐ φοβηθήσεσθε — «не убоитесь». αὐτὸς πολεμήσει περὶ ὑμῶν — «Сам будет воевать за вас» (πολεμέω περί с родительным)."
  23: "ἐδεήθην κυρίου — «умолял Господа» (δέομαι). λέγων вводит молитву ст. 24–25; она дана как вложенная речь в 『…』."
  24: "Κύριε κύριε — «Господи, Господи», удвоение обращения (слав. «Господи Боже»). ἤρξω δεῖξαι — «начал показывать». τῷ σῷ θεράποντι — «рабу Твоему» (θεράπων — «слуга»). τὴν ἰσχύν … τὴν δύναμιν … τὴν χεῖρα τὴν κραταιὰν … τὸν βραχίονα τὸν ὑψηλόν — «крепость, силу, руку крепкую и мышцу высокую». τίς γάρ ἐστιν θεὸς ἐν τῷ οὐρανῷ ἢ ἐπὶ τῆς γῆς — «кто бо есть Бог на небе или на земле»."
  25: "διαβὰς οὖν ὄψομαι — «перейдя, увижу». τὴν γῆν τὴν ἀγαθήν — «землю благую». τὸ ὄρος τοῦτο τὸ ἀγαθὸν καὶ τὸν Ἀντιλίβανον — «гору сию благую и Антиливан». Слав. «дай мне» — в греч. нет, это подразумеваемое прошение; в тексте передано 渡らせて…見させてください."
  26: "ὑπερεῖδεν κύριος ἐμὲ ἕνεκεν ὑμῶν — «презрел меня Господь из-за вас» (ὑπεροράω — «проглядеть, оставить без внимания»). Ἱκανούσθω σοι — «довольно тебе». μὴ προσθῇς ἔτι λαλῆσαι τὸν λόγον τοῦτον — «не продолжай более говорить слово сие» (προστίθημι + инфинитив)."
  27: "ἀνάβηθι ἐπὶ κορυφὴν Λελαξευμένου — «взойди на вершину [горы] изсечённой» (λαξεύω — «высекать в камне»; слав. «горы изсеченыя», у Синодального «Фасги»). ἀναβλέψας τοῖς ὀφθαλμοῖς — «возведя очи». κατὰ θάλασσαν καὶ βορρᾶν καὶ λίβα καὶ ἀνατολάς — «к морю, северу, югу и востоку»; θάλασσα здесь — запад, Средиземное море. οὐ διαβήσῃ τὸν Ιορδάνην τοῦτον — «не перейдёшь Иордана сего»."
  28: "ἔντειλαι Ἰησοῖ — «заповедай Иисусу». κατίσχυσον αὐτὸν καὶ παρακάλεσον — «укрепи его и ободри» (κατισχύω, παρακαλέω). οὗτος διαβήσεται πρὸ προσώπου τοῦ λαοῦ τούτου — «он перейдёт пред лицом народа сего». κατακληρονομήσει αὐτοῖς τὴν γῆν — «разделит им землю в удел» (κατακληρονομέω с дативом). Конец слов Господа."
  29: "ἐνεκαθήμεθα ἐν νάπῃ — «оставались в долине (лощине)» (νάπη — «лесная лощина»; слав. «во юдоли»). σύννεγγυς οἴκου Φογωρ — «близ дома Фогора», т. е. Беф-Фегора (ср. 4:46). Конец главы; речь Моисея продолжается в гл. 4."
