# jp-box, Второзаконие, глава 3. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в этой главе нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 3: поражение Ога (1–7), раздел Заиорданья (8–17), увещание воинам
# и заповедь Иисусу Навину (18–22), молитва Моисея и ответ Господа (23–28),
# стоянка в долине против Беф-Фегора (29).
# Нумерация совпадает с csl-ru и ru: 29 стихов.
# Кавычки: речь Моисея — 「…」 (1–29, начинается заново); слова Бога — 『…』 (2,
# 26–28); молитва Моисея, которую он приводит (24–25), — 『…』 как вложенная
# речь. Слова Моисея к народу и к Иисусу (18–22) оставлены в первом уровне.
# Красного нет.
# Квадратные скобки gr-lxx-byz 3:9 и 3:16 (μέσον τοῦ χειμάρρου ὅριον) —
# вставки в греческом тексте, переведены без добавления скобок.
# 〔…〕 нет: все слова есть в gr-lxx-byz. Отличия церковного чтения не внесены:
# 3:9 в LXX οἱ Φοίνικες (финикийцы), у Синодального «Сидоняне»; 3:11 LXX ἄκρα
# («кремль, столица»), у Синодального «Равва»; 3:17 LXX Μαχαναρεθ, у Синодального
# «Киннереф»; 3:27 LXX Λελαξευμένου («изсечённой»), у Синодального «Фасги» —
# см. notes. Проверено bracket_check.rb.
# Сносок ⟨…⟩ нет: レビ人, 嗣業, 聖絶, キュビト уже в корпусе; 鉄の寝台 и
# 避難の町 понятны по контексту.
# Имена: シホン, オグ, バシャン, エセボン, エドライン, アルゴブ, ミソル, サルカ,
# ヤイル, マヒル, マナセ, ルベン, ガド — по корпусу (Числ 21, 32) и брифу.

