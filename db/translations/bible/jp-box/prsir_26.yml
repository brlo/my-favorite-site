  27: "μόλις ἐξελεῖται ἔμπορος ἀπὸ πλημμελείας — 商人が過ちから免れることは難しい (μόλις — едва; ἐξαιρέω — избавлять; πλημμέλεια — погрешность). οὐ δικαιωθήσεται κάπηλος ἀπὸ ἁμαρτίας — 小売商人が罪から正しいとされることはない (κάπηλος — торговец, корчемник; δικαιόω — оправдывать; слав. «корчемник»)."
