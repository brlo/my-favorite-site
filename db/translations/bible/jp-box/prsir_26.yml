verses:
  1: "良[よ]い妻[つま]を持[も]つ夫[おっと]は幸[さいわ]いである。その日[ひ]の数[かず]は二倍[にばい]となる。"
  2: "勇[いさ]ましい妻[つま]は夫[おっと]を喜[よろこ]ばせ、その年[とし]を平和[へいわ]のうちに満[み]たす。"
  3: "良[よ]い妻[つま]は良い分[ぶん]であり、主[しゅ]を恐[おそ]れる者[もの]たちへの分として与[あた]えられる。"
  4: "富[とみ]む者[もの]も貧[まず]しい者も、心[こころ]は良[よ]く、いつも顔[かお]は穏[おだ]やかである。"
  5: "わたしの心[こころ]は三[みっ]つのことを恐[おそ]れ、四[よっ]つ目[め]のことについては祈[いの]った。"
  6: "すなわち、町[まち]のそしり、群衆[ぐんしゅう]の集[つど]い、偽[いつわ]りの告発[こくはつ]である。これらはすべて死[し]よりも悪[あ]い。"
  7: "心[こころ]の痛[いた]みと悲[かな]しみは、ほかの女[おんな]に嫉妬[しっと]する妻[つま]であり、"
  8: "舌[した]の鞭[むち]はすべての者[もの]に及[およ]ぶ。"
  9: "悪[わる]い妻[つま]は揺[ゆ]れ動[うご]く牛[うし]の軛[くびき]であり、これに掴[つか]まる者[もの]は蠍[さそり]を掴む者のようである。"
  10: "酔[よ]った妻[つま]は大[おお]きな怒[いか]りを引[ひ]き起[お]こし、自分[じぶん]の恥[はじ]を隠[かく]さない。"
  11: "女[おんな]の不貞[ふてい]は、目[め]の高[たか]ぶりとまぶたによって知[し]られる。"
  12: "向[む]こう見[み]ずな娘[むすめ]には見張[みは]りを堅[かた]くせよ。彼女[かのじょ]が自由[じゆう]を得[え]て、それを用[もち]いてしまうことのないように。"
  13: "恥[はじ]知[し]らずの目[め]つきには気[き]をつけよ。たとえ彼女[かのじょ]があなたに罪[つみ]を犯[おか]しても、驚[おどろ]いてはならない。"
  14: "渇[かわ]いた旅人[たびびと]が口[くち]を開[ひら]いて、近[ちか]くの水[みず]ならどれでも飲[の]むように、"
  15: "彼女[かのじょ]はどの杭[くい]の前[まえ]にも座[すわ]り、どの矢[や]の前にも矢筒[やづつ]を開く。"
  16: "妻[つま]の恵[めぐ]みは夫[おっと]を喜[よろこ]ばせ、その知恵[ちえ]は夫の骨[ほね]を肥[こ]やかす。"
  17: "静[しず]かな妻[つま]は主[しゅ]の贈[おく]り物[もの]であり、よく育[そだ]てられた魂[たましい]に代[か]わるものは何[なに]もない。"
  18: "恥[はじ]らいを知[し]る妻[つま]は恵[めぐ]みの上[うえ]に恵みであり、"
  19: "節度[せつど]ある魂[たましい]に値[あたい]する秤[はかり]はない。"
  20: "主[しゅ]の高[たか]みで昇[のぼ]る太陽[たいよう]がそうであるように、"
  21: "良[よ]い妻[つま]の美[うつく]しさはその家[いえ]の整[ととの]えのうちにある。"
  22: "聖[せい]なる燭台[しょくだい]の上[うえ]で輝[かがや]く灯[あか]しがそうであるように、美[うつく]しい顔[かお]は落[お]ち着[つ]いた年頃[としごろ]にある。"
  23: "銀[ぎん]の台座[だいざ]の上[うえ]の金[きん]の柱[はしら]がそうであるように、美[うつく]しい足[あし]は堅[かた]固[こ]な胸[むね]の上にある。子[こ]よ、あなたの若[わか]さの盛[さか]りを健[すこ]やかに保[たも]ち、あなたの力[ちから]を他人[たにん]に与[あた]えてはならない。すべての野[の]を探[さが]して肥[こ]えた土地[とち]の分[ぶん]を見[み]つけ、自分[じぶん]の血筋[ちすじ]にふさわしい自分の種[たね]を蒔[ま]け。そうすれば、あなたの子孫[しそん]は栄[さか]え、良[よ]い血筋[ちすじ]への誇[ほこ]りを持[も]って大[おお]きくなる。遊女[ゆうじょ]は唾[つば]のように見[み]なされ、夫[おっと]ある女[おんな]は、彼女[かのじょ]を求[もと]める者[もの]にとって死[し]の塔[とう]と見なされる。不敬[ふけい]な女[おんな]は不法[ふほう]な者[もの]への分[ぶん]として与[あた]えられ、敬虔[けいけん]な女は主[しゅ]を恐[おそ]れる者に与えられる。恥[はじ]知[し]らずの女[おんな]は恥を踏[ふ]みにじり、礼[れい]儀[ぎ]正[ただ]しい娘[むすめ]は夫[おっと]にも敬[うやま]いを払[はら]う。向[む]こう見[み]ずな女[おんな]は犬[いぬ]のように見なされ、恥[はじ]を知[し]る女は主[しゅ]を恐[おそ]れる。自分[じぶん]の夫[おっと]を敬[うやま]う女[おんな]は、すべての人[ひと]に賢[かしこ]い者と現[あらわ]れる。しかし、高[たか]ぶって夫を軽[かろ]んじる女は、すべての人に不敬[ふけい]な者と知[し]られる。良[よ]い妻[つま]を持つ夫は幸[さいわ]いである。その年[とし]の数[かず]は倍[ばい]となるからである。声[こえ]が大[おお]きく、よく喋[しゃべ]る女[おんな]は、戦[いくさ]を告[つ]げるラッパのように、敗走[はいそう]と見[み]なされる。そのような者[もの]と同[おな]じ魂[たましい]の者は皆[みな]、戦の混[こん]乱[らん]のうちに身[み]を置[お]くことになる。"
  24: "わたしの心[こころ]は二[ふた]つのことで悲[かな]しみ、三[みっ]つ目のことで怒[いか]りがわたしに臨[のぞ]んだ。"
  25: "すなわち、貧[まず]しさのために困[こま]っている戦士[せんし]、軽[かろ]んじられる悟[さと]りのある人々[ひとびと]、"
  26: "正[ただ]しさから罪[つみ]へと引[ひ]き返[かえ]す者[もの]である。主[しゅ]はその者を剣[つるぎ]のために備[そな]えられる。"
  27: "商人[しょうにん]が過[あやま]ちから免[まぬか]れることは難[かた]しく、小売[こうり]商人が罪[つみ]から正[ただ]しいとされることはない。"

notes:
  1: "Γυναικὸς ἀγαθῆς μακάριος ὁ ἀνήρ — 良い妻を持つ夫は幸い (μακάριος — блажен; слав. «блажен есть муж»). ἀριθμὸς τῶν ἡμερῶν αὐτοῦ διπλάσιος — その日の数は二倍 (διπλάσιος — двойной; слав. «сугубо»): добрая жена удваивает жизнь мужа. Стих открывает похвалу доброй жене."
  2: "γυνὴ ἀνδρεία — 勇ましい妻 (ἀνδρεῖος — мужественный, доблестный; слав. «добляя»). εὐφραίνει τὸν ἄνδρα αὐτῆς — 夫を喜ばせ. τὰ ἔτη αὐτοῦ πληρώσει ἐν εἰρήνῃ — その年を平和のうちに満たす (πληρόω — исполнять; слав. «лета его исполнит миром»)."
  3: "γυνὴ ἀγαθὴ μερὶς ἀγαθή — 良い妻は良い分 (μερίς — часть, доля, жребий; слав. «часть блага»). ἐν μερίδι φοβουμένων κύριον δοθήσεται — 主を恐れる者たちへの分として与えられる (букв. «в части боящихся Господа дана будет»), т. е. входит в жребий боящихся Бога."
  4: "πλουσίου δὲ καὶ πτωχοῦ καρδία ἀγαθή — 富む者も貧しい者も心は良く (букв. «богатого и бедного сердце доброе»). ἐν παντὶ καιρῷ πρόσωπον ἱλαρόν — いつも顔は穏やか (ἱλαρός — светлый, радостный; слав. «лице тихо»). Мысль: добрая жена даёт мужу довольство при любом достатке."
  5: "Ἀπὸ τριῶν εὐλαβήθη ἡ καρδία μου — 三つのことを恐れ (εὐλαβέομαι — страшиться, благоговеть; слав. «от трех убояся»). ἐπὶ τῷ τετάρτῳ προσώπῳ ἐδεήθην — 四つ目のことについては祈った (букв. «о четвёртом лице помолился»; слав. «от лица четвертаго устрашихся»). διαβολὴν πόλεως, ἐκκλησίαν ὄχλου, καταψευσμόν — 町のそしり、群衆の集い、偽りの告発 (διαβολή — клевета; ἐκκλησία — собрание; καταψευσμός — ложное обвинение). ὑπὲρ θάνατον πάντα μοχθηρά — すべて死よりも悪い (μοχθηρός — тяжкий, злой)."
  6: "Продолжение ст. 5 (тот же стих по-гречески)."
  7: "ἄλγος καρδίας καὶ πένθος — 心の痛みと悲しみ (ἄλγος — страдание; слав. «болезнь сердца»). γυνὴ ἀντίζηλος ἐπὶ γυναικί — ほかの女に嫉妬する妻 (ἀντίζηλος — соперница). μάστιξ γλώσσης πᾶσιν ἐπικοινωνοῦσα — 舌の鞭はすべての者に及ぶ (μάστιξ — бич; ἐπικοινωνέω — достигать, сообщаться)."
  8: "Продолжение ст. 7 (тот же стих по-гречески)."
  9: "βοοζύγιον σαλευόμενον — 揺れ動く牛の軛 (βοοζύγιον — воловье ярмо; σαλεύω — трясти; слав. «воловое иго движимо»). ὁ κρατῶν αὐτῆς ὡς ὁ δρασσόμενος σκορπίου — これに掴まる者は蠍を掴む者のよう (δράσσομαι — хватать; слав. «держайся ея яко емляйся скорпии»)."
  10: "ὀργὴ μεγάλη γυνὴ μέθυσος — 酔った妻は大きな怒りを引き起こし (μέθυσος — пьяная; слав. «жена пиянчива»). ἀσχημοσύνην αὐτῆς οὐ συγκαλύψει — 自分の恥を隠さない (συγκαλύπτω — прикрывать; слав. «студа своего не покрыет»)."
  11: "πορνεία γυναικὸς — 女の不貞 (πορνεία — блудодеяние). ἐν μετεωρισμοῖς ὀφθαλμῶν — 目の高ぶりによって (μετεωρισμός — надменность, поднятое положение; слав. «в возвышении очес»). ἐν τοῖς βλεφάροις αὐτῆς γνωσθήσεται — まぶたによって知られる (βλέφαρον — веко)."
  12: "ἐπὶ θυγατρὶ ἀδιατρέπτῳ στερέωσον φυλακήν — 向こう見ずな娘には見張りを堅くせよ (ἀδιάτρεπτος — неукротимая, своевольная; στερεόω — укреплять; слав. «над дщерию безстудною утверди стражу»). ἵνα μὴ εὑροῦσα ἄνεσιν ἑαυτῇ χρήσηται — 自由を得て、それを用いてしまうことのないように (ἄνεσις — послабление, свобода; χράομαι — пользоваться; слав. «да не попущение обретши употребит себе»)."
  13: "ὀπίσω ἀναιδοῦς ὀφθαλμοῦ φύλαξαι — 恥知らずの目つきには気をつけよ (ὀπίσω — вслед, за; ἀναιδής — бесстыдный; слав. «вслед безстудна ока сохранися»). ἐὰν εἰς σὲ πλημμελήσῃ — あなたに罪を犯しても (πλημμελέω — поступать неверно)."
  14: "ὡς διψῶν ὁδοιπόρος — 渇いた旅人のように. ἀπὸ παντὸς ὕδατος τοῦ σύνεγγυς πίεται — 近くの水ならどれでも飲む. κατέναντι παντὸς πασσάλου καθήσεται — どの杭の前にも座る (πάσσαλος — кол, веха; слав. «кол»). ἔναντι βέλους ἀνοίξει φαρέτραν — どの矢の前にも矢筒を開く (φαρέτρα — колчан). Образ доступной всем блудницы."
  15: "Продолжение ст. 14 (тот же стих по-гречески)."
  16: "χάρις γυναικὸς — 妻の恵み (χάρις — прелесть, благодать; слав. «благодать женска»). τέρψει τὸν ἄνδρα — 夫を喜ばせ (τέρπω — услаждать). τὰ ὀστᾶ αὐτοῦ πιανεῖ ἡ ἐπιστήμη αὐτῆς — その知恵は夫の骨を肥やかす (πιαίνω — откармливать; ἐπιστήμη — знание, разумение; слав. «художество»)."
  17: "δόσις κυρίου γυνὴ σιγηρά — 静かな妻は主の贈り物 (σιγηρός — тихая; слав. «жена молчалива»). οὐκ ἔστιν ἀντάλλαγμα πεπαιδευμένης ψυχῆς — よく育てられた魂に代わるものはない (ἀντάλλαγμα — обмен, выкуп; παιδεύω — воспитывать; слав. «несть искупа наказанныя души»)."
  18: "χάρις ἐπὶ χάριτι — 恵みの上に恵み. γυνὴ αἰσχυντηρά — 恥らいを知る妻 (αἰσχυντηρός — совестливая, стыдливая). οὐκ ἔστιν σταθμὸς πᾶς ἄξιος ἐγκρατοῦς ψυχῆς — 節度ある魂に値する秤はない (σταθμός — вес, весы; ἐγκρατής — целомудренный, владеющий собой; слав. «несть мерило всякое достойное воздержныя души»)."
  19: "Продолжение ст. 18 (тот же стих по-гречески)."
  20: "ἥλιος ἀνατέλλων ἐν ὑψίστοις κυρίου — 主の高みで昇る太陽. κάλλος ἀγαθῆς γυναικὸς ἐν κόσμῳ οἰκίας αὐτῆς — 良い妻の美しさはその家の整えのうちにある (κόσμος — порядок, убранство; слав. «в красоте дому ея»). Сравнение с восходящим солнцем."
  21: "Продолжение ст. 20 (тот же стих по-гречески)."
  22: "λύχνος ἐκλάμπων ἐπὶ λυχνίας ἁγίας — 聖なる燭台の上で輝く灯し (λυχνία — подставка для лампады; слав. «свещница»). κάλλος προσώπου ἐπὶ ἡλικίᾳ στασίμῃ — 美しい顔は落ち着いた年頃にある (ἡλικία — возраст; στάσιμος — устойчивый, зрелый; слав. «на возрасте постояннем»)."
  23: "στῦλοι χρύσεοι ἐπὶ βάσεως ἀργυρᾶς — 銀の台座の上の金の柱. πόδες ὡραῖοι ἐπὶ στέρνοις εὐσταθοῦς — 美しい足は堅固な胸の上にある (εὐσταθής — твёрдый, стойкий; слав. «нозе красни на плеснах добре стоящих» — слав. понял иначе). Греч. образ тёмный, оставлен буквально. 26:19–27 — блок «.» в gr-lxx-byz (дефект модуля); в csl этих стихов нет (слав. 26 = 27 стихов, см. шапку), поэтому перевод по греч. LXX (Ральфс). Τέκνον — 子よ (обращение). ἀκμὴν ἡλικίας σου συντήρησον ὑγιῆ — 若さの盛りを健やかに保て (ἀκμή — цветущая пора; ὑγιής — здоровый). μὴ δῷς ἀλλοτρίοις τὴν ἰσχύν σου — 力を他人に与えるな (ἀλλότριος — чужой; ἰσχύς — сила). Блок восстановлен по LXX (в модуле «.», в csl нет): ἀναζητήσας παντὸς πεδίου εὔγειον κλῆρον — すべての野を探して肥えた土地の分を見つけ (εὔγειος — плодородный; κλῆρος — жребий, участок). σπεῖρε τὰ ἴδια σπέρματα τῇ εὐγενείᾳ σου — 自分の血筋にふさわしい自分の種を蒔け (εὐγένεια — благородство, хороший род). Блок восстановлен по LXX (в модуле «.», в csl нет): οὕτως τὰ γενήματά σου περιόντα — そうすれば子孫は栄え (γένημα — плод, потомство; περίειμι — оставаться, превосходить). παρρησίαν εὐγενείας ἔχοντα — 良い血筋への誇りを持って (παρρησία — смелость, уверенность). μεγαλυνοῦσι — 大きくなる (μεγαλύνω — возвеличивать). Блок восстановлен по LXX (в модуле «.», в csl нет): γυνὴ μισθία ἴση σιάλῳ λογισθήσεται — 遊女は唾のように見なされる (μίσθιος — наёмный; σίαλον — слюна). ὕπανδρος δὲ πύργος θανάτου τοῖς χρωμένοις λογισθήσεται — 夫ある女は、彼女を求める者にとって死の塔と見なされる (πύργος — башня). Блок восстановлен по LXX (в модуле «.», в csl нет): γυνὴ ἀσεβὴς ἀνόμῳ μερὶς δοθήσεται — 不敬な女は不法な者への分として与えられる. εὐσεβὴς δὲ δίδοται τῷ φοβουμένῳ τὸν κύριον — 敬虔な女は主を恐れる者に与えられる. Антитеза нечестивой и благочестивой жены сохранена. Блок восстановлен по LXX (в модуле «.», в csl нет): γυνὴ ἀσχήμων ἀτιμίαν κατατρίψει — 恥知らずの女は恥を踏みにじる (ἀσχήμων — непристойная; κατατρίβω — стирать, попирать). θυγάτηρ δὲ εὐσχήμων καὶ τὸν ἄνδρα ἐντραπήσεται — 礼儀正しい娘は夫にも敬いを払う (ἐντρέπομαι — стыдиться, уважать). Блок восстановлен по LXX (в модуле «.», в csl нет): γυνὴ ἀδιάτρεπτος ὡς κύων λογισθήσεται — 向こう見ずな女は犬のように見なされる. ἡ δὲ ἔχουσα αἰσχύνην τὸν κύριον φοβηθήσεται — 恥を知る女は主を恐れる. Блок восстановлен по LXX (в модуле «.», в csl нет): γυνὴ ἄνδρα ἴδιον τιμῶσα σοφὴ πᾶσι φανήσεται — 自分の夫を敬う女はすべての人に賢い者と現れる. ἀτιμάζουσα δὲ ἐν ὑπερηφανίᾳ ἀσεβὴς πᾶσι γνωσθήσεται — 高ぶって夫を軽んじる女はすべての人に不敬な者と知られる. Конец стиха повторяет 26:1 (γυναικὸς ἀγαθῆς μακάριος ὁ ἀνήρ…), повтор сохранён. Блок восстановлен по LXX (в модуле «.», в csl нет): γυνὴ μεγαλόφωνος καὶ γλωσσώδης — 声が大きく、よく喋る女 (γλωσσώδης — языкастая). ὡς σάλπιγξ πολέμων εἰς τροπὴν θεωρηθήσεται — 戦を告げるラッパのように敗走と見なされる (τροπή — поворот, бегство). πολέμου ἀκαταστασίαις τὴν ψυχὴν διαιτηθήσεται — 戦の混乱のうちに身を置く (ἀκαταστασία — беспорядок, смута). Слав. краткая (и Синодальная) редакция не содержит блока 26:19–27 полного LXX (о сыновьях, блуднице, сраме и болтливой жене); девять стихов LXX сохранены здесь, при csl 26:23, отдельными номерами не выводятся — иначе счёт главы разошёлся бы со слав. (27)."
  24: "Ἐπὶ δυσὶ λελύπηται ἡ καρδία μου — 二つのことで心は悲しむ (λυπέω — печалить). ἐπὶ τῷ τρίτῳ θυμός μοι ἐπῆλθεν — 三つ目のことで怒りが臨んだ. ἀνὴρ πολεμιστὴς ὑστερῶν δι᾽ ἔνδειαν — 貧しさのために困っている戦士 (ὑστερέω — нуждаться; ἔνδεια — недостаток). ἄνδρες συνετοὶ ἐὰν σκυβαλισθῶσιν — 軽んじられる悟りのある人々 (σκυβαλίζω — считать сором, презирать). ἐπανάγων ἀπὸ δικαιοσύνης ἐπὶ ἁμαρτίαν — 正しさから罪へと引き返す者. ὁ κύριος ἑτοιμάσει εἰς ῥομφαίαν αὐτόν — 主はその者を剣のために備えられる (ῥομφαία — меч)."
