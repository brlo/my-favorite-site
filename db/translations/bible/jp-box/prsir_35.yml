# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для книги нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 35: закон и приношения (1–2), благоугождение и милостыня (3–6),
# щедрость и десятина (7–10), дары и суд без лицеприятия (11–13),
# молитва сироты и вдовы (14–17), молитва смиренного и суд Божий (18–23),
# милость во время скорби (24). Прямой речи нет; основной текст — поучение,
# без внешних кавычек; красного и синего нет.
# Нумерация по gr: 24 стиха; слав. 23 (−1). Слав. сливает gr 19–20 в слав. 19
# («дондеже сокрушит чресла немилостивых»), а gr 20б–21 — в слав. 20
# («И языком воздаст месть, дондеже потребит множество досадителей»); поэтому
# слав. 21 = gr 22, слав. 22 = gr 23, слав. 23 = gr 24. Держимся деления gr
# (24 стиха), слав. деление отмечено в notes.
# 〔…〕 нет: все стихи есть в gr-lxx-byz. Сносок ⟨…⟩ нет.
# Имена — транслитерация греческого (LXX).

