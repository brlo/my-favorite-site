verses:
  1: "律法[りっぽう]を守[まも]る者[もの]は供[そな]え物[もの]を増[ま]す。戒[いまし]めに心[こころ]を留[と]める者[もの]は救[すく]いの犠牲[ぎせい]を献[ささ]げる者[もの]である。"
  2: "感謝[かんしゃ]を返[かえ]す者[もの]は小麦粉[こむぎこ]の供[そな]え物[もの]を献[ささ]げ、施[ほどこ]しをする者[もの]は賛美[さんび]の犠牲[ぎせい]を献げる者[もの]である。"
  3: "主[しゅ]の喜[よろこ]びは悪[わる]から遠[とお]ざかることにあり、贖[あがな]いは不正[ふせい]から遠ざかることにある。"
  4: "主[しゅ]の前[まえ]に空[から]の手[て]で現[あらわ]れてはならない。これらはすべて戒[いまし]めのゆえだからである。"
  5: "正[ただ]しい者[もの]の供[そな]え物[もの]は祭壇[さいだん]を肥[こ]やし、その香[かおり]はいと高[たか]き者[もの]の前[まえ]に届[とど]く。"
  6: "正[ただ]しい人[ひと]の犠牲[ぎせい]は受[う]け入[い]れられ、その記憶[きおく]は忘[わす]れられない。"
  7: "善[よ]い目[め]をもって主[しゅ]をほめたたえよ。あなたの手[て]の初穂[はつほ]を少[すく]なくしてはならない。"
  8: "どんな贈[おく]り物[もの]のときも明[あか]るい顔[かお]をし、喜[よろこ]びをもって十分[じゅう]の一[いち]を聖[せい]とせよ。"
  9: "いと高[たか]き者[もの]には、その与[あた]えに応[おう]じて与[あた]えよ。善[よ]い目[め]をもって、あなたの手[て]が得[え]たものに応[おう]じて与[あた]えよ。"
  10: "主[しゅ]は報[むく]いを与[あた]える方[かた]であり、七倍[ななばい]に増[ふ]してあなたに報[むく]いられるからである。"
  11: "贈[おく]り物[もの]を少[すく]なくしてはならない。主[しゅ]はそれを受[う]け取[と]られないからである。不正[ふせい]な犠牲[ぎせい]に頼[たよ]ってはならない。"
  12: "主[しゅ]は裁[さば]き主[ぬし]であり、そのもとには人[ひと]の顔[かお]による偏[かたよ]りがないからである。"
  13: "主[しゅ]は貧[まず]しい者[もの]だからといって、ひいきをしない。虐[しいた]げられた者[もの]の願[ねが]いは聞[き]き入[い]れられる。"
  14: "主[しゅ]は孤児[こじ]の願[ねが]いを蔑[ないがし]ろにせず、やもめが言葉[ことば]を注[そそ]ぎ出[だ]すとき、その者[もの]をも顧[かえり]みられる。"
  15: "やもめの涙[なみだ]は頬[ほお]を伝[つた]って流[なが]れ落[お]ちるではないか。その叫[さけ]びは、それを引[ひ]き起[お]こした者[もの]に届[とど]く。"
  16: "喜[よろこ]んで仕[つか]える者[もの]は受[う]け入[い]れられ、その願[ねが]いは雲[くも]にまで届[とど]く。"
  17: "へりくだる者[もの]の祈[いの]りは雲[くも]を貫[つらぬ]き、近[ちか]づくまでは、彼は慰[なぐさ]めを得[え]ない。"
  18: "そして、いと高[たか]き者[もの]が顧[かえり]みて、正[ただ]しく裁[さば]き、裁きを行[おこな]われるまで、その祈[いの]りは退[しりぞ]かない。"
  19: "主[しゅ]は遅[おく]れず、彼らに対[たい]して長[なが]く忍[しの]んでおられることもない。"
  20: "情[なさ]け知[し]らずの者[もの]の腰[こし]を砕[くだ]き、国々[くにぐに]に報復[ほうふく]を返[かえ]されるまでは。"
  21: "高[こう]ぶる者[もの]の群[む]れを取[と]り除[の]き、不正[ふせい]な者[もの]の王笏[おうしゃく]を砕[くだ]かれるまでは。"
  22: "人[ひと]にはその行[おこな]いに応[おう]じて報[むく]い、人々[ひとびと]のわざにはその思[おも]いに応[おう]じて報いられるまでは。"
  23: "ご自分[じぶん]の民[たみ]の裁[さば]きをなさり、その憐[あわ]れみによって民を喜[よろこ]ばせるまでは。"
  24: "その苦[くる]しみの時[とき]における憐[あわ]れみは美[うつく]しい。雨[あめ]の降[ふ]らない時[とき]の雨雲[あまぐも]のように。"

notes:
  1: "Ὁ συντηρῶν νόμον πλεονάζει προσφοράς — «соблюдающий закон умножает приношения» (συντηρέω — соблюдать, хранить; πλεονάζω — умножать; προσφορά — приношение). θυσιάζων σωτηρίου ὁ προσέχων ἐντολαῖς — «приносящий жертву спасения — внимающий заповедям» (θυσία σωτηρίου — мирная жертва спасения); слав. «приносит жертву спасения внимаяй заповедем»."
  2: "ἀνταποδιδοὺς χάριν προσφέρων σεμίδαλιν — «воздающий благодарность приносит семидал» (ἀνταποδίδωμι — воздавать; χάρις — благодарность; σεμίδαλις — лучшая пшеничная мука, семидал); слав. «аки приносяй семидал». ὁ ποιῶν ἐλεημοσύνην θυσιάζων αἰνέσεως — «делающий милостыню приносит жертву хвалы» (ἐλεημοσύνη; αἴνεσις — хвала)."
  3: "εὐδοκία κυρίου ἀποστῆναι ἀπὸ πονηρίας — «благоволение Господа — отступить от злобы» (εὐδοκία; ἀφίστημι — отступать; πονηρία). ἐξιλασμὸς ἀποστῆναι ἀπο ἀδικίας — «умилостивление — отступить от неправды» (ἐξιλασμός — умилостивление, очищение); слав. «очищение»."
  4: "μὴ ὀφθῇς ἐν προσώπῳ κυρίου κενός — «не явись пред лицом Господа пустым», т. е. с пустыми руками (κενός — пустой); слав. «тощь». πάντα γὰρ ταῦτα χάριν ἐντολῆς — «ибо всё это ради заповеди» (χάριν — ради; ἐντολή — заповедь)."
  5: "προσφορὰ δικαίου λιπαίνει θυσιαστήριον — «приношение праведного утучняет жертвенник» (λιπαίνω — делать тучным; θυσιαστήριον — жертвенник, алтарь); слав. «утучняет олтарь». ἡ εὐωδία αὐτῆς ἔναντι ὑψίστου — «благоухание его пред Всевышним» (εὐωδία — благоухание)."
  6: "θυσία ἀνδρὸς δικαίου δεκτή — «жертва мужа праведного приятна (принята)» (δεκτός — приемлемый). τὸ μνημόσυνον αὐτῆς οὐκ ἐπιλησθήσεται — «память её не будет забыта» (μνημόσυνον — память, воспоминание); слав. «память ея не забвена будет»."
  7: "ἐν ἀγαθῷ ὀφθαλμῷ — «с добрым (щедрым) оком», т. е. с добрым расположением. δόξασον τὸν κύριον — «прославь Господа». μὴ σμικρύνῃς ἀπαρχὴν χειρῶν σου — «не умаляй начатка (первых плодов) рук твоих» (σμικρύνω — уменьшать; ἀπαρχή — начаток); слав. «не умали от начатка рук твоих»."
  8: "ἐν πάσῃ δόσει ἱλάρωσον τὸ πρόσωπόν σου — «при всяком даянии сделай светлым (радостным) лицо твоё» (δόσις — даяние; ἱλαρόω — делать весёлым); слав. «весело имей лице твое». ἁγίασον δεκάτην — «освяти десятину» (δεκάτη)."
  9: "δὸς ὑψίστῳ κατὰ τὴν δόσιν αὐτοῦ — «дай Всевышнему по даянию Его» (δόσις). ἐν ἀγαθῷ ὀφθαλμῷ καθ᾽ εὕρεμα χειρός — «с добрым оком — по находке руки», т. е. по достатку (εὕρεμα — находка, приобретение); слав. «оком благим приобретение руки»."
  10: "ὅτι κύριος ἀνταποδιδούς ἐστιν — «ибо Господь есть воздающий» (ἀνταποδίδωμι). ἑπταπλάσια ἀνταποδώσει σοι — «семикратно (в семь раз больше) воздаст тебе» (ἑπταπλάσιος); слав. «седмерицею воздаст ти»."
  11: "Μὴ δωροκώπει — редкое δωροκωπέω; по LXX-пониманию «не подкупай дарами» (δῶρον — дар), но слав. «дара не умаляй» и ru «не уменьшай даров» читают иначе; в тексте держимся церковного чтения, вариант — здесь. οὐ γὰρ προσδέξεται — «ибо Он не примет». μὴ ἔπεχε θυσίᾳ ἀδίκῳ — «не надейся (не держись) на неправедную жертву» (ἐπέχω)."
  12: "κύριος κριτής ἐστιν — «Господь есть судия» (κριτής). οὐκ ἔστιν παρ᾿ αὐτῷ δόξα προσώπου — «нет у Него славы лица», т. е. лицеприятия (δόξα προσώπου — букв. «слава лица»); слав. «несть у него славы лица»."
  13: "οὐ λήμψεται πρόσωπον ἐπὶ πτωχοῦ — «не примет лица [бедного]», т. е. не будет лицеприятен (λαμβάνω πρόσωπον — калька евр. «принимать лицо»); слав. «не приимет лица на убога». δέησιν ἠδικημένου εἰσακούσεται — «молитву обиженного услышит» (ἀδικέω — обижать)."
  14: "οὐ μὴ ὑπερίδῃ ἱκετείαν ὀρφανοῦ — «не презрит моления сироты» (ὑπεροράω — презирать, обходить; ἱκετεία — моление; ὀρφανός — сирота). καὶ χήραν, ἐὰν ἐκχέῃ λαλιάν — «и вдову, когда она изольёт речь» (χήρα — вдова; ἐκχέω — изливать; λαλιά — речь)."
  15: "οὐχὶ δάκρυα χήρας ἐπὶ σιαγόνα καταβαίνει — «не слёзы ли вдовы на щёку сходят?» (σιαγών — щека; καταβαίνω — сходить). ἡ καταβόησις ἐπὶ τῷ καταγαγόντι αὐτά — «вопль (обвинение) — на низведшего их» (καταβόησις — вопль; κατάγω — низводить); слав. «вопль ея на наведшаго я»."
  16: "θεραπεύων ἐν εὐδοκίᾳ δεχθήσεται — «служащий с благоволением будет принят» (θεραπεύω — служить, угождать; εὐδοκία; δέχομαι — принимать). ἡ δέησις αὐτοῦ ἕως νεφελῶν συνάψει — «моление его до облаков дойдёт (соединится)» (συνάπτω — соединять); слав. «до облак дойдет»."
  17: "προσευχὴ ταπεινοῦ νεφέλας διῆλθεν — «молитва смиренного облака прошла» (ταπεινός — смиренный; διέρχομαι — проходить). ἕως συνεγγίσῃ, οὐ μὴ παρακληθῇ — «пока не приблизится, не будет утешен» (συνεγγίζω — приближаться; παρακαλέω — утешать)."
  18: "οὐ μὴ ἀποστῇ — «не отступит (не отстанет)» (ἀφίσταμαι). ἕως ἐπισκέψηται ὁ ὕψιστος — «пока не посетит Всевышний» (ἐπισκέπτομαι). κρινεῖ δικαίοις καὶ ποιήσει κρίσιν — «рассудит по правде и сотворит суд» (κρίνω; δικαίως — по правде); слав. «судит в правду и сотворит суд»."
  19: "ὁ κύριος οὐ μὴ βραδύνῃ — «Господь не замедлит» (βραδύνω — медлить). οὐδὲ μὴ μακροθυμήσῃ ἐπ᾽ αὐτοῖς — «и не будет долготерпеть над ними» (μακροθυμέω — быть долготерпеливым); слав. «ниже имать долготерпети о них». Слав. включает сюда и «дондеже сокрушит чресла немилостивых» (гр. 20а)."
  20: "συντρίψῃ ὀσφὺν ἀνελεημόνων — «сокрушит чресла немилосердных» (συντρίβω — сокрушать; ὀσφύς — чресла, поясница; ἀνελεήμων — немилосердный); слав. «сокрушит чресла немилостивых» — в слав. 19. τοῖς ἔθνεσιν ἀνταποδώσει ἐκδίκησιν — «народам воздаст отмщение» (ἔθνος — народ; ἐκδίκησις — отмщение); слав. «языком воздаст месть»."
  21: "ἕως ἐξάρῃ πλῆθος ὑβριστῶν — «пока не истребит множество надменных (наглых)» (ἐξαίρω — убирать, истреблять; ὑβρισταί — наглецы, обидчики); слав. «дондеже потребит множество досадителей». σκῆπτρα ἀδίκων συντρίψει — «скипетры неправедных сокрушит» (σκῆπτρον — скипетр); слав. «скиптры неправедных сокрушит» — в слав. 20."
  22: "ἀνταποδῷ ἀνθρώπῳ κατὰ τὰς πράξεις αὐτοῦ — «воздаст человеку по делам его» (ἀνταποδίδωμι; πρᾶξις — дело, поступок). τὰ ἔργα τῶν ἀνθρώπων κατὰ τὰ ἐνθυμήματα αὐτῶν — «дела людей — по их помыслам» (ἐνθύμημα — помысел, намерение); слав. 21 «по делом человеческим и помышлением их»."
  23: "ἕως κρίνῃ τὴν κρίσιν τοῦ λαοῦ αὐτοῦ — «пока не рассудит суд народа Своего» (κρίνω τὴν κρίσιν — совершить суд). εὐφρανεῖ αὐτοὺς ἐν τῷ ἐλέει αὐτοῦ — «обрадует их милостью Своею» (εὐφραίνω; ἔλεος — милость); слав. 22 «возвеселит я милостию своею»."
  24: "ὡραῖον ἔλεος ἐν καιρῷ θλίψεως αὐτοῦ — «прекрасна (благовременна) милость в час скорби его» (ὡραῖος — прекрасный, благовременный; θλῖψις — скорбь). ὡς νεφέλαι ὑετοῦ ἐν καιρῷ ἀβροχίας — «как облака дождя в час бездождия» (ὑετός — дождь; ἀβροχία — бездождие); слав. «якоже облацы дождевнии во время бездождия». По слав. это ст. 23."
