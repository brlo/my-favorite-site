chapter: 6
draft: true

verses:
  1: "どうか、主[しゅ]の言葉[ことば]を聞[き]け。主[しゅ]は言[い]われた。「立[た]って、山[やま]々[やま]と争[あらそ]え。丘[おか]々[おか]にあなたの声[こえ]を聞[き]かせよ。"
  2: "山[やま]々[やま]よ、主[しゅ]の裁[さば]きを聞[き]け。地[ち]の基[もとい]である谷[たに]々[たに]よ。主[しゅ]はその民[たみ]と争[あらそ]い、イスラエルと論[ろん]じ合[あ]う。"
  3: "わたしの民[たみ]よ、わたしがあなたに何[なに]をしたというのか。何[なに]であなたを煩[わずら]わせ、何[なに]であなたを疲[つか]れさせたというのか。わたしに答[こた]えよ。"
  4: "わたしはあなたをエジプトの地[ち]から上[のぼ]らせ、奴隷[どれい]の家[いえ]から贖[あがな]い出[だ]し、モーセ、アロン、ミリアムをあなたの前[まえ]に遣[つか]わした。"
  5: "わたしの民[たみ]よ、モアブの王[おう]バラクがあなたに対して何[なに]を企[たくら]んだか、またベオルの子[こ]バラムが彼に何[なに]と答[こた]えたか、またシティムからギルガルまでのことを思[おも]い起[おこ]せ。主[しゅ]の正[ただ]しい行[おこな]いを知[し]るためである。」"
  6: "「わたしは何[なに]をもって主[しゅ]に近[ちか]づき、高[たか]い所[ところ]におられる神[かみ]に身[み]を寄[よ]せようか。燔祭[はんさい]をもって、一歳[いっさい]の子[こ]牛[うし]をもって、主[しゅ]の前[まえ]に出[で]ればよいのか。"
  7: "主[しゅ]は千[せん]の雄羊[おひつじ]を、また幾万[いくまん]の脂[あぶら]の流[なが]れる谷川[たにがわ]を喜[よろこ]ばれるだろうか。わたしは自分[じぶん]の不敬[ふけい]のために長子[ちょうし]を、自分[じぶん]の魂[たましい]の罪[つみ]のために腹[はら]の子[こ]をささげるべきなのか。」"
  8: "「人[ひと]よ、何[なに]が良[よ]いことかは、すでにあなたに告[つ]げられている。主[しゅ]があなたに求[もと]めておられるのは、ただ裁[さば]きを行[おこな]い、あわれみを愛[あい]し、あなたの神[かみ]とともに歩[ある]む備[そな]えをすることである。」"
  9: "「主[しゅ]の声[こえ]が都[みやこ]に呼[よ]びかけられる。その名[な]を恐[おそ]れる者[もの]を救[すく]うのは、主[しゅ]である。部族[ぶぞく]よ、聞[き]け。町[まち]を整[ととの]える者[もの]はだれか。"
  10: "不正[ふせい]な者[もの]の家[いえ]が不正[ふせい]な宝[たから]を蓄[たくわ]え、侮辱[ぶじょく]とともに不[ふ]正[せい]を行うことは、火[ひ]ではないか。"
  11: "不正[ふせい]な秤[はかり]と、欺[あざむ]きの分[ふん]銅[どう]をもって、だれが正[ただ]しいと認[みと]められるだろうか。"
  12: "その富[とみ]は不敬[ふけい]で満[み]ち、そこに住[す]む者[もの]たちは偽[いつわ]りを語[かた]り、その舌[した]は口[くち]のうちで高[たか]ぶっている。"
  13: "だから、わたしはあなたを打[う]ち始[はじ]め、あなたの罪[つみ]のゆえにあなたを滅[ほろ]ぼす。"
  14: "あなたは食[た]べても飽[あ]き足[た]りず、あなたのうちは暗[くら]くなり、あなたはよろめき去[さ]る。あなたは身[み]をかわしても救[すく]われない。救[すく]われた者[もの]も剣[つるぎ]に渡[わた]される。"
  15: "あなたは種[たね]を蒔[ま]いても刈[か]り取[と]らず、オリーブを踏[ふ]んでも油[あぶら]を塗[ぬ]らず、ぶどう酒[しゅ]を搾[しぼ]っても飲[の]まない。そして、わたしの民[たみ]の掟[おきて]は滅[ほろ]びる。"
  16: "あなたはザンブリの掟[おきて]と、アハブの家[いえ]のすべてもろもろの行[おこな]いを守[まも]り、彼らの計[はかり]ごとに従[したが]って歩[ある]んだ。それゆえ、わたしはあなたを滅[ほろ]びに渡[わた]し、そこに住[す]む者[もの]たちを嘲[あざけ]りの的[まと]とする。あなたがたは民[たみ]の嘲[あざけ]りを負[お]う。」"

notes:
  1: "Ἀκούσατε δὴ λόγον κυρίου — «услышьте же слово Господне» (слав. «слышите, яже глагола Господь»); κύριος εἶπεν — «Господь сказал»; Ἀνάστηθι κρίθητι πρὸς τὰ ὄρη — «встань, судись с горами» (κρίνομαι — судиться, тягаться; слав. «судися с горами»); ἀκουσάτωσαν οἱ βουνοὶ φωνήν σου — «да услышат холмы голос твой» (βουνός — холм)."
  2: "ἀκούσατε, βουνοί, τὴν κρίσιν τοῦ κυρίου — «слушайте, холмы, суд Господень»; αἱ φάραγγες θεμέλια τῆς γῆς — «долины, основания земли» (φάραγξ — ущелье, долина); κρίσις τῷ κυρίῳ πρὸς τὸν λαὸν αὐτοῦ — «суд у Господа с народом Его» (πρός + acc. — с, против); μετὰ τοῦ Ισραηλ διελεγχθήσεται — «с Израилем будет состязаться» (διελέγχω — обличать, состязаться)."
  3: "λαός μου, τί ἐποίησά σοι — «народ Мой, что сделал Я тебе?»; ἢ τί ἐλύπησά σε — «или чем огорчил тебя?» (λυπέω — огорчать); ἢ τί παρηνώχλησά σοι — «или чем обеспокоил (утрудил) тебя?» (παρενοχλέω — докучать, стеснять; слав. «чим стужих вам»); ἀποκρίθητί μοι — «ответь Мне»."
  4: "ἀνήγαγόν σε ἐκ γῆς Αἰγύπτου — «вывел Я тебя из земли Египетской»; ἐξ οἴκου δουλείας ἐλυτρωσάμην σε — «из дома рабства искупил тебя» (λυτρόω — искупать); ἐξαπέστειλα πρὸ προσώπου σου τὸν Μωυσῆν καὶ Ααρων καὶ Μαριαμ — «послал перед лицом твоим Моисея, Аарона и Мариам» (в LXX Μαριαμ — Мириам; в тексте ミリアム по корпусу, ср. Чис 12)."
  5: "μνήσθητι δὴ τί ἐβουλεύσατο κατὰ σοῦ Βαλακ βασιλεὺς Μωαβ — «вспомни же, что замыслил против тебя Валак, царь Моава» (βουλεύομαι — замышлять); τί ἀπεκρίθη αὐτῷ Βαλααμ υἱὸς τοῦ Βεωρ — «что ответил ему Валаам, сын Веора»; ἀπὸ τῶν σχοίνων ἕως τοῦ Γαλγαλ — «от тростников (Шиттима) до Галгала» (σχοῖνος — тростник; евр. Шиттим; слав. «от сития до галгал»); ὅπως γνωσθῇ ἡ δικαιοσύνη τοῦ κυρίου — «чтобы познала правда Господня» (γιγνώσκω — познавать)."
  6: "ἐν τίνι καταλάβω τὸν κύριον — «чем (как) достигну (постигну) Господа» (καταλαμβάνω — достигать, постигать; слав. «в чем постигну Господа»); ἀντιλήμψομαι θεοῦ μου ὑψίστου — «приму (взыщу) Бога моего Вышнего» (ἀντιλαμβάνομαι — брать, держаться; ὕψιστος — Вышний); εἰ καταλήμψομαι αὐτὸν ἐν ὁλοκαυτώμασιν — «предстану ли пред Ним со всесожжениями» (ὁλοκαύτωμα — всесожжение, 燔祭); ἐν μόσχοις ἐνιαυσίοις — «с тельцами однолетними» (μόσχος — телёнок; ἐνιαύσιος — однолетний; слав. «телцы единолетными»)."
  7: "εἰ προσδέξεται κύριος ἐν χιλιάσιν κριῶν — «примет ли Господь в тысячах овнов» (κριός — баран); ἢ ἐν μυριάσιν χειμάρρων πιόνων — «или в мириадах тучных потоков» (χείμαρρος — зимний поток, поток; πίων — тучный; слав. «во тмах козлищ тучных» — «козлов», иное чтение; держим LXX); εἰ δῶ πρωτότοκά μου ἀσεβείας — «дам ли первенцев моих за нечестие» (πρωτότοκος — первенец); καρπὸν κοιλίας μου ὑπὲρ ἁμαρτίας ψυχῆς μου — «плод чрева моего за грех души моей»."
  8: "εἰ ἀνηγγέλη σοι, ἄνθρωπε, τί καλόν — «разве не возвещено тебе, человек, что добро?» (ἀναγγέλλω — возвещать); ἢ τί κύριος ἐκζητεῖ παρὰ σοῦ — «или чего Господь ищет (требует) от тебя» (ἐκζητέω — взыскивать, требовать); ἀλλ᾽ ἢ τοῦ ποιεῖν κρίμα — «кроме как творить суд»; καὶ ἀγαπᾶν ἔλεον — «и любить милость» (ἔλεος — милость, あわれみ); καὶ ἕτοιμον εἶναι τοῦ πορεύεσθαι μετὰ κυρίου θεοῦ σου — «и быть готовым ходить с Господом Богом твоим» (ἕτοιμος — готовый): так LXX и слав. («готову быти еже ходити с Господем Богом твоим»); в ru/МТ «смиренномудренно ходить пред Богом твоим» (הצנע) — иное чтение, в текст не внесено, отмечено здесь."
  9: "Φωνὴ κυρίου τῇ πόλει ἐπικληθήσεται — «голос Господа к городу призовётся» (ἐπικαλέομαι — призывать, взывать; слав. «глас Господень граду призовется»); σώσει φοβουμένους τὸ ὄνομα αὐτοῦ — «спасёт боящихся имени Его»; ἄκουε, φυλή — «слушай, племя» (φυλή — племя, 部族); τίς κοσμήσει πόλιν — «кто украсит (устроит) город?» (κοσμέω — украшать, устроять; слав. «кто украсит град»)."
  10: "μὴ πῦρ καὶ οἶκος ἀνόμου θησαυρίζων θησαυροὺς ἀνόμους — «разве не огонь — дом беззаконного, собирающего сокровища беззаконные» (θησαυρίζω — собирать в сокровищницу; слав. «еда огнь и дом беззаконнаго собирая имения беззаконная»); μετὰ ὕβρεως ἀδικία — «с надменностью (насилием) неправда» (ὕβρις — надменность, насилие): евр. «עוֹד» («ещё») LXX прочитал как «אֵשׁ» («огонь»), отсюда 火; сохранено и оговорено здесь."
  11: "εἰ δικαιωθήσεται ἐν ζυγῷ ἄνομος — «оправдается ли на весах беззаконник?» (ζυγός — весы); ἐν μαρσίππῳ στάθμια δόλου — «в суме — гири обмана» (μαρσίππιον — сума, кошель; στάθμιον — гиря; δόλος — обман; слав. «во вретищи меры неправыя»)."
  12: "ἐξ ὧν τὸν πλοῦτον αὐτῶν ἀσεβείας ἔπλησαν — «от них богатство своё нечестием наполнили» (πίμπλημι — наполнять); οἱ κατοικοῦντες αὐτὴν ἐλάλουν ψευδῆ — «живущие в нём говорили ложь»; ἡ γλῶσσα αὐτῶν ὑψώθη ἐν τῷ στόματι αὐτῶν — «язык их возвысился в устах их» (ὑψόω — возвышать)."
  13: "καὶ ἐγὼ ἄρξομαι τοῦ πατάξαι σε — «и Я начну поражать тебя» (πατάσσω — поражать, бить); ἀφανιῶ σε ἐπὶ ταῖς ἁμαρτίαις σου — «уничтожу тебя за грехи твои» (ἀφανίζω — истреблять)."
  14: "σὺ φάγεσαι καὶ οὐ μὴ ἐμπλησθῇς — «ты будешь есть и не насытишься» (ἐμπίπλημι — наполнять, насыщать); σκοτάσει ἐν σοὶ καὶ ἐκνεύσει — «потемнеет в тебе и уклонится» (σκοτάζω — темнеть; ἐκνεύω — уклоняться, ускользать; слав. «померкнет в тебе, и совратишися»); οὐ μὴ διασωθῇς — «не спасёшься»; ὅσοι ἐὰν διασωθῶσιν, εἰς ῥομφαίαν παραδοθήσονται — «которые спасутся, мечу преданы будут»."
  15: "σὺ σπερεῖς καὶ οὐ μὴ ἀμήσῃς — «ты посеешь и не пожнёшь» (ἀμάω — жать); σὺ πιέσεις ἐλαίαν — «ты выжмешь маслину» (πιέζω — давить, жать); οὐ μὴ ἀλείψῃ ἔλαιον — «не помажешься елеем» (ἀλείφω — умащаться); οἶνον καὶ οὐ μὴ πίητε — «вина и не выпьете»; ἀφανισθήσεται νόμιμα λαοῦ μου — «погибнут уставы народа Моего» (νόμιμον — установление, устав; слав. «погибнут законы людий моих»)."
  16: "ἐφύλαξας τὰ δικαιώματα Ζαμβρι — «ты сохранил уставы Замврия» (δικαίωμα — оправдание, устав; слав. «оправдания замвриина»); πάντα τὰ ἔργα οἴκου Αχααβ — «все дела дома Ахава»; ἐπορεύθητε ἐν ταῖς βουλαῖς αὐτῶν — «ходили по советам их»; ὅπως παραδῶ σε εἰς ἀφανισμόν — «чтобы предать тебя в уничтожение»; τοὺς κατοικοῦντας αὐτὴν εἰς συρισμόν — «живущих в нём в освистание» (συρισμός — свист, освистание; слав. «во звиздание»; в тексте 「嘲りの的」); ὀνείδη λαῶν λήμψεσθε — «поношения народов примете» (ὄνειδος — поношение)."
