# jp-box, Михей, глава 6. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 6 (совпадает, 16 стихов).
# Карта книги: гл. 6 совпадает с gr; расхождение границ только в 4/5 (слав. 5:1 =
# gr 4:14, слав. 5:N = gr 5:(N−1); см. шапки гл. 4 и 5).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1–2 суд Господень с горами: «встань, судись с горами»; 3–5 «народ Мой,
# что сделал Я тебе»: Египет, Моисей и Аарон и Мариам, Валак и Валаам, Шиттим — Галгал;
# 6–7 вопрос народа: с чем предстать, всесожжения, тысячи овнов, первенец;
# 8 **ответ**: «сказано тебе, человек, что добро: творить суд, любить милость
# и быть готовым ходить с Господом Богом твоим»; 9–16 обвинение: глас Господа к городу,
# неверные весы, богатство от нечестия, «будешь есть и не насытишься», уставы
# Амврия и дома Ахава, посмеяние народов.
# Голоса: 1 — призыв пророка вне кавычек, слово Господа в 「…」 (открывается в 1,
# закрывается в 5); 6–7 — речь народа в 「…」; 8 — ответ пророка в 「…」;
# 9–16 — слово Господа в 「…」 до конца главы.
# 6:8 — ключевой стих: по LXX и слав. «быть готовым ходить с Господом Богом твоим»;
# в ru/МТ «смиренномудренно ходить» — иное чтение, в текст не внесено (см. notes).
#
tr_code: jp-box
