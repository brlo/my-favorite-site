verses:
  1: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  2: "「人[ひと]の子[こ]よ、あなたの顔[かお]をゴグに、マゴグの地[ち]に、すなわちロシュ、モソク、トベルの君[きみ]に向[む]け、彼について預言[よげん]せよ。"
  3: "言[い]え。主[しゅ]なる神[かみ]はこう言[い]われる。見[み]よ、わたしはあなたに敵対[てきだい]する。ゴグ、ロシュ、モソク、トベルの君[きみ]よ。"
  4: "わたしはあなたを引[ひ]き返[かえ]し、あなたの顎[あご]に銜[くつわ]をはめ、あなたとあなたの全[ぜん]軍[ぐん]勢[ぜい]を出[だ]す。馬[うま]と騎兵[きへい]、すべて鎧[よろい]を着[き]た者[もの]たち、大[おお]きな集[あつ]まり、すなわち盾[たて]と兜[かぶと]と剣[つるぎ]を持[も]つ者[もの]たちである。"
  5: "ペルシア人[じん]、エチオピア人[じん]、リュディア人[じん]、リビア人[じん]も、すべて兜[かぶと]と盾[たて]を身[み]につけている。"
  6: "ゴメルとその周[まわ]りのすべての者[もの]、北[きた]の果[は]てからのテルガマの家[いえ]とその周[まわ]りのすべての者[もの]、あなたとともにいる多[おお]くの国民[こくみん]である。"
  7: "備[そな]えよ。あなたと、あなたのもとに集[あつ]まったあなたのすべていきみとともに、身[み]を整[ととの]えよ。あなたはわたしのための守[まも]りとなる。"
  8: "多[おお]くの日[ひ]々[び]の後[のち]、あなたは備[そな]えられ、終[お]わりの年[とし]々[とし]に、剣[つるぎ]から遠[とお]ざけられた地[ち]、多[おお]くの国民[こくみん]から集[あつ]められた者[もの]たちの所[ところ]、すなわち常[つね]に荒[あ]れていたイスラエルの地[ち]へ来[く]る。彼らは諸国民[しょこくみん]から出[で]て来[き]て、すべて安[やす]らかに住[す]んでいる。"
  9: "あなたは上[のぼ]って来[く]る。雨[あめ]のように、雲[くも]のように来[き]て、地[ち]を覆[おお]う。あなたと、あなたの周[まわ]りのすべての者[もの]と、あなたとともにいる多[おお]くの国民[こくみん]が。"
  10: "主[しゅ]なる神[かみ]はこう言[い]われる。その日[ひ]、あなたの心[こころ]に言[こと]葉[ば]が上[のぼ]り、あなたは悪[わる]い計[はか]りごとを思[おも]い巡[めぐ]らす。"
  11: "あなたは言[い]う。『わたしは守[まも]りのない地[ち]に上[のぼ]り、静[しず]かに安[やす]らかに住[す]む者[もの]たちの所[ところ]へ行[い]こう。すなわち、すべていまだ城壁[じょうへき]も門[もん]もかんぬきもない地[ち]に住[す]む者[もの]たちの所[ところ]へ。』"
  12: "獲物[えもの]を奪[うば]い、分捕[ぶんど]りを取[と]り、荒[あ]れ果[は]てて住[す]まわれた所[ところ]に手[て]を伸[の]べ、多[おお]くの国民[こくみん]から集[あつ]められて財産[ざいさん]をなし、地[ち]のへそに住[す]む国民[こくみん]に手[て]を伸[の]べるためである。"
  13: "サバとデダンとカルタゴの商人[しょうにん]たち、およびそのすべての村[むら]々[むら]があなたに言[い]う。『あなたは奪[うば]うために来[き]たのか。分捕[ぶんど]りを取[と]るために、銀[ぎん]と金[きん]を取り、財産[ざいさん]を持[も]ち去[さ]り、大[おお]きな分捕[ぶんど]りを取るために、あなたのいきみを集[あつ]めたのか』と。"
  14: "それゆえ、人[ひと]の子[こ]よ、預言[よげん]して、ゴグに言[い]え。主[しゅ]なる神[かみ]はこう言[い]われる。わたしの民[たみ]イスラエルが安[やす]らかに住[す]むその日[ひ]に、あなたは立[た]ち上[あ]がるではないか。"
  15: "あなたは自分[じぶん]の所[ところ]から、北[きた]の果[は]てから来[く]る。あなたと、あなたとともにいる多[おお]くの国民[こくみん]、すなわちすべてい馬[うま]に乗[の]る者[もの]、大[おお]きないきみと多[おお]くの軍[ぐん]勢[ぜい]である。"
  16: "あなたはわたしの民[たみ]イスラエルに、雲[くも]のように上[のぼ]って、地[ち]を覆[おお]う。これは終[お]わりの日[ひ]々[び]に起[お]こる。わたしはあなたをわたしの地[ち]に導[みちび]き、諸国民[しょこくみん]が、わたしがあなたのうちで、彼らの目[め]の前[まえ]に聖[せい]とされるとき、わたしを知[し]るようにする。"
  17: "主[しゅ]なる神[かみ]はゴグにこう言[い]われる。あなたは、わたしが昔[むかし]の日[ひ]々[び]に、わたしの僕[しもべ]であるイスラエルの預言[よげん]者[しゃ]たちの手[て]によって語[かた]った者[もの]ではないか。彼らはその日[ひ]々[ひ]、その年[とし]々[とし]に、あなたを彼らの上[うえ]に連[つ]れて来[く]ると預言[よげん]した。"
  18: "その日[ひ]、ゴグがイスラエルの地[ち]に来[く]る日[ひ]に、わたしの怒[いか]りが上[のぼ]る、と主[しゅ]なる神[かみ]は言[い]われる。"
  19: "わたしの妬[ねた]みが、わたしの怒[いか]りの火[ひ]の中[なか]で語[かた]る。まことに、その日[ひ]、イスラエルの地[ち]に大[おお]きな震動[しんどう]が起[お]こる。"
  20: "主[しゅ]の顔[かお]の前[まえ]に、海[うみ]の魚[さかな]、空[そら]の鳥[とり]、野[の]の獣[けもの]、地[ち]を這[は]うすべての這[は]うもの、地上[ちじょう]のすべての人[ひと]が震[ふる]える。山[やま]々[やま]は裂[さ]け、谷[たに]は崩[くず]れ、すべての城壁[じょうへき]は地[ち]に倒[たお]れる。"
  21: "わたしは彼の上[うえ]にすべての恐[おそ]れを呼[よ]び寄[よ]せる、と主[しゅ]は言[い]われる。それぞれの剣[つるぎ]がその兄弟[きょうだい]に向[む]かう。"
  22: "わたしは死[し]と血[ち]と、降[ふ]り注[そそ]ぐ雨[あめ]と雹[ひょう]の石[いし]とをもって彼を裁[さば]く。わたしは火[ひ]と硫黄[いおう]を彼の上[うえ]に、彼とともにいるすべての者[もの]の上[うえ]に、彼とともにいる多[おお]くの国民[こくみん]の上[うえ]に降[ふ]らす。"
  23: "わたしは大[おお]いなる者[もの]となり、聖[せい]とされ、栄光[えいこう]を受[う]け、多[おお]くの国民[こくみん]の目[め]の前[まえ]で知[し]られる。彼らはわたしが主[しゅ]であることを知[し]る。」"

notes:
  1: "Καὶ ἐγένετο λόγος κυρίου πρός με λέγων — формула вне кавычек; ею открывается слово о Гоге (38–39)."
  2: "στήρισον τὸ πρόσωπόν σου ἐπὶ Γωγ — «утверди лице твоё на Гога» (στήριζον — ставить, направлять; 顔を向け); τὴν γῆν τοῦ Μαγωγ — «землю Магога»; ἄρχοντα Ρως, Μοσοχ καὶ Θοβελ — «князя Роша, Мешеха и Фувала» (слав. «князя рос, мосоха и фовеля»; евр. Рош, Мешех, Тувал). Здесь открывается речь Господа — 「…」 до конца главы."
  3: "Τάδε λέγει κύριος κύριος — «так говорит Господь Бог»; Ἰδοὺ ἐγὼ ἐπὶ σέ — «вот, Я на тебя», т. е. Я против тебя (формула 39:1). Слав. «и на князя рос…» — повтор обращения, в LXX его нет."
  4: "συνάξω σε — «соберу тебя»; θώρακες — «брони» (θώραξ — 鎧); πέλται — «щиты» (πέλτη — 小盾); περικεφαλαῖαι — «шлемы» (兜); μάχαιραι — «мечи». Слав. добавляет «и вложу узду в челюсти твоя» (χαλινός — 銜) — нет в LXX, внесено без 〔…〕."
  5: "Πέρσαι καὶ Αἰθίοπες καὶ Λίβυες — «персы, ефиопы и ливийцы». Слав. добавляет «и лидяне» (Λυδοί, リュディア人) — нет в LXX, внесено без 〔…〕; слав. «муряне» = ефиопы."
  6: "Γομερ — «Гомер» (ゴメル); οἶκος τοῦ Θεργαμα — «дом Фогарма» (Θεργαμα, テルガマ; слав. «форгама»); ἀπ᾽ ἐσχάτου βορρᾶ — «от пределов севера»; ἔθνη πολλὰ μετὰ σοῦ — «народы многие с тобою»."
  7: "ἑτοιμάσθητι, ἑτοίμασον σεαυτόν — «готовься, снаряжайся» (двойной императив); πᾶσα ἡ συναγωγή σου — «всё собрание твоё»; ἔσῃ μοι εἰς προφυλακήν — «будешь Мне в предохранение (стражу)» (προφυλακή — 守り); в Синодальном «будь им вождем» (МТ) — не источник."
  8: "ἀφ᾽ ἡμερῶν πλειόνων ἑτοιμασθήσεται — «от дней многих приготовится»; ἐπ᾽ ἐσχάτου ἐτῶν ἐλεύσεται — «в последние годы придёт»; γῆν τὴν ἀπεστραμμένην ἀπὸ μαχαίρας — «землю, отвращённую от меча»; συνηγμένων ἀπὸ ἐθνῶν πολλῶν — «собранную из народов многих»; ἐπ᾽ εἰρήνης ἅπαντες — «все в мире»."
  9: "ἀναβήσῃ ὡς ὑετός — «поднимешься, как дождь» (ὑετός); ὡς νεφέλη κατακαλύψαι γῆν — «как облако, чтобы покрыть землю» (κατακαλύπτω). Слав. «и падеши ты» — расхождение, в LXX «и будешь ты»."
  10: "ἀναβήσεται ῥήματα ἐπὶ τὴν καρδίαν σου — «взойдут слова на сердце твоё»; λογιῇ λογισμοὺς πονηρούς — «задумаешь помыслы злые» (λογίζομαι). Слав. переносит «и помыслиши помышления злая» в начало 11-го стиха — деление по LXX."
  11: "Ἀναβήσομαι ἐπὶ γῆν ἀπερριμμένην — «поднимусь на землю отверженную» (ἀπορρίπτω — отвергать); ἥξω ἐπὶ ἡσυχάζοντας ἐν ἡσυχίᾳ — «приду на покоящихся в покое» (cognatus: 静かに安らかに); οὐχ ὑπάρχει τεῖχος οὐδὲ μοχλοί — «нет ни стены, ни запоров» (μοχλός — かんぬき). Слова Гога — вложенная речь 『…』."
  12: "προνομεῦσαι προνομὴν καὶ σκυλεῦσαι σκῦλα — «произвести грабёж и захватить добычу» (cognatus accusativus: 獲物を奪い、分捕りを取る); ἐπιστρέψαι χεῖρά σου — «обратить руку твою»; ἐπὶ τὸν ὀμφαλὸν τῆς γῆς — «на пуп земли» (ὀμφαλός — へそ), т. е. на середину земли."
  13: "Σαβα καὶ Δαιδαν — «Сава и Дедан»; ἔμποροι Καρχηδόνιοι — «торговцы карфагенские» (Καρχηδόνιοι; в Синодальном «Фарсисские» — МТ, не источник); πᾶσαι αἱ κῶμαι αὐτῶν — «все селения их»; λαβεῖν ἀργύριον καὶ χρυσίον — «взять серебро и золото». Слова купцов — вложенная речь 『…』."
  14: "Οὐκ ἐν τῇ ἡμέρᾳ ἐκείνῃ… ἐγερθήσῃ; — «не в тот ли день… ты поднимешься?» (риторический вопрос); ἐν τῷ κατοικισθῆναι τὸν λαόν μου Ισραηλ ἐπ᾽ εἰρήνης — «когда народ Мой Израиль будет жить в мире». В Синодальном «ты узнаешь это» — иное чтение (МТ)."
  15: "ἥξεις ἐκ τοῦ τόπου σου ἀπ᾽ ἐσχάτου βορρᾶ — «придёшь с места твоего от пределов севера»; ἀναβάται ἵππων — «всадники на конях» (ἀναβάτης — 馬に乗る者); συναγωγὴ μεγάλη καὶ δύναμις πολλή — «собрание великое и сила многая»."
  16: "ἀναβήσῃ ἐπὶ τὸν λαόν μου Ισραηλ ὡς νεφέλη — «поднимешься на народ Мой Израиль, как облако»; ἐπ᾽ ἐσχάτων τῶν ἡμερῶν — «в последние дни»; ἵνα γνῶσιν πάντα τὰ ἔθνη ἐμέ — «чтобы узнали все народы Меня»; ἐν τῷ ἁγιασθῆναί με ἐν σοὶ ἐνώπιον αὐτῶν — «когда освящусь в тебе пред ними». Слав. в скобках «(о, гогъ!)» — редакционная вставка, не перенесена."
  17: "Σὺ εἶ περὶ οὗ ἐλάλησα πρὸ ἡμερῶν τῶν ἔμπροσθεν — «ты тот, о котором Я говорил в прежние дни»; διὰ χειρὸς τῶν δούλων μου προφητῶν — «рукою рабов Моих пророков»; ἐν ταῖς ἡμέραις ἐκείναις καὶ ἔτεσιν — «в те дни и годы»."
  18: "ἐν ἡμέρᾳ, ᾗ ἂν ἔλθῃ Γωγ ἐπὶ τὴν γῆν τοῦ Ισραηλ — «в день, когда придёт Гог на землю Израилеву»; ἀναβήσεται ὁ θυμός μου — «поднимется ярость Моя» (θυμός); слав. добавляет «во гневе моем» — нет в LXX."
  19: "ὁ ζῆλός μου — «ревность Моя» (ζῆλος — 妬み); ἐν πυρὶ τῆς ὀργῆς μου ἐλάλησα — «в огне негодования Моего Я сказал»; σεισμὸς μέγας — «потрясение великое» (σείω — 震動)."
  20: "οἱ ἰχθύες τῆς θαλάσσης — «рыбы морские»; τὰ πετεινὰ τοῦ οὐρανοῦ — «птицы небесные»; τὰ θηρία τοῦ πεδίου — «звери полевые»; τὰ ἑρπετὰ τὰ ἕρποντα — «пресмыкающиеся, ползающие»; ῥαγήσεται τὰ ὄρη — «расторгнутся горы» (ῥήγνυμι); πεσοῦνται αἱ φάραγγες — «падут ущелья»; πᾶν τεῖχος ἐπὶ τὴν γῆν πεσεῖται — «всякая стена на землю упадёт»."
  21: "καλὲσω ἐπ᾽ αὐτὸν πᾶν φόβον — «призову на него всякий страх»; μάχαιρα ἀνθρώπου ἐπὶ τὸν ἀδελφὸν αὐτοῦ — «меч человека на брата его», т. е. меч каждого на его брата; слав. «мечь человека на брата его будет»."
  22: "κρινῶ αὐτὸν θανάτῳ καὶ αἵματι — «буду судиться с ним смертью и кровью» (κρίνω — 裁く); ὑετῷ κατακλύζοντι — «дождём потопляющим» (κατακλύζω); λίθοις χαλάζης — «камнями града» (χάλαζα — 雹); πῦρ καὶ θεῖον — «огонь и сера» (θεῖον — 硫黄); слав. «огнь и камень горящь»."
  23: "μεγαλυνθήσομαι — «возвеличусь» (μεγαλύνω); ἁγιασθήσομαι — «освящусь»; ἐνδοξασθήσομαι — «прославлюсь» (ἐνδοξάζω); γνωσθήσομαι ἐναντίον ἐθνῶν πολλῶν — «буду познан пред многими народами»; γνώσονται ὅτι ἐγώ εἰμι κύριος — формула; здесь речь закрывается."
