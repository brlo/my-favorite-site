# jp-box, Иезекииль, глава 38. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 38 (совпадает; см. карту 20/21).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: 1–9 — слово о Гоге, князе Роша, Мешеха и Фувала, в земле Магог:
# Господь повернёт его, выведет его войско — коней и всадников в бронях, персов,
# ефиопов, ливийцев, Гомера, дом Фогарма от севера; в последние годы он придёт
# на землю Израилеву, собранную из народов, как туча на землю. 10–13 — его замысел:
# «поднимусь на землю неогражденную», на живущих мирно, чтобы грабить; вопрос
# Савы, Дедана и карфагенских купцов. 14–23 — Господь приводит его на землю Свою:
# великое потрясение, рыбы, птицы, звери и люди трепещут, горы рушатся, меч брата
# на брата, мор, кровь, каменный град, огонь и сера; Господь возвеличится и освятится
# пред многими народами.
# Голоса: 1 — формула вне кавычек; 2–23 — одна непрерывная речь Господа 「…»
# (в 11 замысел Гога и в 13 слова купцов — вложенная речь 『…』). «Так говорит
# Господь Бог» внутри речи, отдельной цитатой не выделено.
# «Точка»: в этой главе нет.
# Имена и термины: ゴグ、マゴグ、ロシュ、モソク、トベル (Ρως, Μοσοχ, Θοβελ);
# ゴメル (Γομερ), テルガマ (Θεργαμα, слав. «форгама»), サバ, デダン, カルタゴ (Καρχηδόνιοι);
# ペルシア人[じん], エチオピア人[じん], リビア人[じん], リュディア人[じん] (слав. «лидяне»);
# 兜[かぶと] (περικεφαλαία), 盾[たて] (πέλτη), 鎧[よろい] (θώραξ), 剣[つるぎ] (μάχαιρα),
# 銜[くつわ] (χαλινός — слав. «узда»), 霊[れい] не встречается; 主[しゅ]なる神[かみ]
# (κύριος κύριος / адонаи Господь).
#

