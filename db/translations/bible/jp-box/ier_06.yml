# jp-box, Иеремия, глава 6. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc по Иеремии — только фрагменты (гл. 11, 12, 31); в гл. 6 его нет.
# jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 6: 1–3 пророк — нашествие с севера, «дочь Сиона»; 4–5 речь врагов; 6–8 слово
# Господа — срубить деревья, «город лживый»; 9 Господь — «обирайте, как виноград»;
# 10–11 речь пророка от первого лица (ярость, которую нельзя удержать); 12–15 слово
# Господа — суд, «мир, мир»; 16–20 слово Господа — «станьте на путях», отказ народа,
# стражи, «слушай, земля», ладан из Савы; 21 Господь — болезнь на народ; 22–23 Господь
# — народ с севера; 24–26 голос города/пророка — ужас, «не выходите в поле», плач
# дочери; 27–30 Господь Иеремии — испытатель, серебро отверженное.
# Голоса: 6:4–5 — 「…」 (речь врагов; в гр. без вводной формулы, кавычки поставлены как
# для прямой речи); 6:6–8, 6:9, 6:12–15, 6:16–20 (со вложенными 『…』 в 6:16 и 6:17),
# 6:21, 6:22–23, 6:27–30 — 「…» (слово Господа; вводные формулы вне кавычек);
# 6:10–11 — 「…» (пророк от первого лица); 6:1–3 и 6:24–26 — без кавычек.
# Нумерация по gr: 30 стихов, совпадает с csl и ru. По gr 6:7 кончается словами
# «πόνῳ καὶ μάστιγι», а 6:8 начинается глаголом «παιδευθήσῃ»; слав. относит «болезнию
# и язвою» к 6:8 — клауза в гр. разорвана, поэтому в тексте эти слова отнесены к 6:8
# (см. notes к 6:7–8). В остальном деление держим по gr.
# 〔…〕 нет: все 30 стихов есть в gr-lxx-byz. Сносок ⟨…⟩ нет: テコア, ベト・ハケレム,
# 天幕, ふいご, 粗布, 花婿 уже в корпусе или пояснены в notes.
# Имена — транслитерация греческого (LXX): ベニヤミン, テコア, ベト・ハケレム (гр.
# Βαιθαχαρμα; в корпусе — ベト・ハケレム), シオン, サバ, エフライム.

