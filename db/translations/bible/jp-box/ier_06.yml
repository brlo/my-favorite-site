verses:
  1: "ベニヤミンの子[こ]らよ、エルサレムの中[なか]から、心[こころ]を強[つよ]く持[も]て。テコアで角笛[つのぶえ]を吹[ふ]き鳴[な]らせ、ベト・ハケレムの上[うえ]に旗[はた]を掲[かか]げよ。災[わざわ]いが北[きた]から覗[のぞ]き、大[おお]いなる破[やぶ]れが起[おこ]っているからである。"
  2: "シオンの娘[むすめ]よ、あなたの高[たか]みは取[と]り去[さ]られる。"
  3: "牧者[ぼくしゃ]たちとその群[む]れが彼女[かのじょ]のところへ来[き]て、周[まわ]りに天幕[てんまく]を張[は]り、おのおのその手[て]で牧[まき]をする。"
  4: "「彼女[かのじょ]に向[む]かって戦[いくさ]の備[そな]えをせよ。立[た]て、昼[ひる]のうちに彼女へ上[のぼ]って行[い]こう。ああ、われわれは災[わざわ]いだ。日[ひ]は傾[かたむ]き、夕[ゆう]べの影[かげ]は消[き]え去[さ]るからである。"
  5: "立[た]て、夜[よる]のうちに上[のぼ]って行[い]き、彼女の基[もとい]を壊[こわ]そう。」"
  6: "まことに、主[しゅ]はこう言[い]われる。「彼女の木[き]を切[き]り倒[たお]し、エルサレムに力[ちから]を注[そそ]げ。ああ、偽[いつわ]りの都[みやこ]よ。その中にはすべて暴虐[ぼうぎゃく]がある。"
  7: "井戸[いど]がその水[みず]を冷[ひ]やすように、彼女もその悪[あく]を冷[ひ]やす。不敬[ふけい]と苦難[くなん]が彼女の面[おもて]の上[うえ]で、いつも彼女の中[なか]から聞[き]こえる。"
  8: "エルサレムよ、あなたは痛[いた]みと鞭[むち]とをもって懲[こ]らしめを受[う]ける。わたしの魂[たましい]があなたから離[はな]れないように。わたしがあなたを、住[す]む者[もの]のない、通[とお]れない地[ち]としないように。」"
  9: "主[しゅ]はこう言[い]われる。「ぶどうのように、イスラエルの残[のこ]りを摘[つ]み取[と]れ、摘[つ]み取[と]れ。ぶどう摘[つ]みがその籠[かご]に戻[もど]るように、戻[もど]れ。」"
  10: "「だれに語[かた]り、だれに証[あかし]して、聞[き]かせることができようか。見[み]よ、彼らの耳[みみ]は無割礼[むかつれい]で、聞くことができない。見よ、主[しゅ]の言葉[ことば]は彼らにとって罵[ののし]りとなり、彼らはそれを聞[き]こうともしない。"
  11: "わたしは怒[いか]りに満[み]たされ、それを抑[おさ]えて、彼らを滅[ほろ]ぼし尽[つ]くさなかった。わたしは外[そと]の幼[おさな]い子[こ]たちに、また若者[わかもの]たちの集[つど]いにも、それを注[そそ]ぎ出す。男[おとこ]も女[おんな]も、老[お]いた者[もの]も日[ひ]を満[み]たした者[もの]も、共[とも]に捕[と]らえられるからである。」"
  12: "「それゆえ、彼らの家[いえ]は他人[たにん]に移[うつ]り、畑[はたけ]も妻[つま]たちも同[おな]じように移[うつ]る。わたしがこの地[ち]に住[す]む者[もの]の上[うえ]に手[て]を伸[の]べるからである、と主[しゅ]は言[い]われる。"
  13: "彼らは小[ちい]さな者[もの]から大[おお]きな者[もの]まで、すべて不正[ふせい]を行[おこな]い、祭司[さいし]から偽預言者[ぎよげんしゃ]まで、すべて偽[いつわ]りを行[おこな]う。"
  14: "彼らはわが民[たみ]の娘[むすめ]の破[やぶ]れを、これを軽[かろ]んじながら癒[いや]し、『平和[へいわ]、平和』と言[い]う。しかし、平和はない。"
  15: "彼らは恥[は]じた。しかし、彼らは衰[おとろ]え果[は]てながらも、辱[はずかし]められてなお恥じようとせず、自分[じぶん]の不名誉[ふめいよ]を知[し]らなかった。それゆえ、彼らは倒[たお]れる者[もの]とともに倒れ、彼らを訪[おとず]れる時[とき]に滅[ほろ]びる。」と主[しゅ]は言[い]われた。"
  16: "主[しゅ]はこう言[い]われる。「道[みち]の上[うえ]に立[た]って見[み]よ。とこしえの主[しゅ]の道[みち]について尋[たず]ね、良[よ]い道[みち]はどれかを見[み]て、その道[みち]を歩[あゆ]め。そうすれば、あなたがたの魂[たましい]に清[きよ]めを得[え]る。しかし、彼らは言[い]った。『われわれは行[い]かない』。"
  17: "わたしはあなたがたの上[うえ]に見張[みは]りを置[お]いた。角笛[つのぶえ]の音[ね]を聞[き]け。しかし、彼らは言[い]った。『われわれは聞[き]かない』。"
  18: "それゆえ、もろもろの民[たみ]は聞[き]き、自分[じぶん]の群[む]れを牧[まき]する者[もの]たちも聞[き]いた。"
  19: "地[ち]よ、聞[き]け。見[み]よ、わたしはこの民[たみ]の上[うえ]に災[わざわ]いを、すなわち彼[かれ]らの背[そむ]きの実[み]を臨[のぞ]ませる。彼らはわたしの言葉[ことば]に耳[みみ]を傾[かたむ]けず、わたしの律法[りっぽう]を退[しりぞ]けたからである。"
  20: "なぜ、わたしにサバから乳香[にゅうこう]を、遠[とお]い地[ち]から肉桂[にっけい]を携[たずさ]えて来[く]るのか。あなたがたの燔祭[はんさい]は受[う]け入[い]れられず、あなたがたの犠牲[ぎせい]はわたしを喜[よろこ]ばせない。」"
  21: "まことに、主[しゅ]はこう言[い]われる。「見[み]よ、わたしはこの民[たみ]の上[うえ]に病[やまい]を与[あた]える。父[ちち]も子[こ]も共[とも]にその病[やまい]で弱[よわ]り、隣[となり]もその近[ちか]くの者[もの]も滅[ほろ]びる。」"
  22: "主[しゅ]はこう言[い]われる。「見[み]よ、民[たみ]が北[きた]から来[き]て、大[おお]いなる民[たみ]が地[ち]の果[は]てから起[お]こる。"
  23: "彼[かれ]らは弓[ゆみ]と投[な]げ槍[やり]を握[にぎ]り、残忍[ざんにん]で、あわれみをかけない。その声[こえ]は荒[あ]れ狂[くる]う海[うみ]のようである。彼らは馬[うま]と戦車[せんしゃ]に乗[の]り、火[ひ]のように、シオンの娘[むすめ]よ、あなたと戦[たたか]うために陣[じん]を構[かま]える。」"
  24: "われわれは彼[かれ]らのうわさを聞[き]いて、手[て]が弱[よわ]った。苦[くる]しみがわれわれを捕[と]らえ、子[こ]を産[う]む女[おんな]のような痛[いた]みが来[き]た。"
  25: "野[の]に出[で]てはならない。道[みち]を歩[ある]いてもならない。敵[てき]の剣[つるぎ]が周[まわ]りに住[す]みついているからである。"
  26: "わが民[たみ]の娘[むすめ]よ、粗布[あらぬの]を身[み]にまとって、灰[はい]を身に振[ふ]りかけよ。愛[いと]しい者[もの]のための喪[も]のように、痛[いた]ましい嘆[なげ]きを自分[じぶん]のためにせよ。荒[あ]らす者[もの]が突然[とつぜん]、あなたがたに臨[のぞ]むからである。"
  27: "「わたしはあなたを、試[ため]された民[たみ]の中[なか]の試[ため]す者[もの]とした。あなたは、わたしが彼らの道[みち]を試[ため]すとき、わたしを知[し]るであろう。"
  28: "彼[かれ]らは皆[みな]、聞[き]き従[したが]わない者[もの]で、曲[ま]がった道[みち]を歩[あゆ]む。青銅[せいどう]と鉄[てつ]、彼らは皆[みな]、堕落[だらく]した者[もの]である。"
  29: "ふいごは火[ひ]に焼[や]けて尽[つ]き、鉛[なまり]も尽[つ]きた。銀細工[ぎんざいく]師[し]はむなしく銀を打[う]つ。彼らの悪[あく]は溶[と]けないからである。"
  30: "彼[かれ]らを捨[す]てられた銀[ぎん]と呼[よ]べ。主[しゅ]が彼らを捨[す]てられたからである。」"

notes:
  1: "Ἐνισχύσατε — «укрепитесь» (ἐνισχύω; слав. «укрепитеся»); ru «бегите» следует МТ, в текст не внесено. ἐκ μέσου τῆς Ιερουσαλημ — «из среды Иерусалима». Θεκουε — Фекоя (テコア по корпусу, ср. 2 Цар 14:2). σημαίνατε σάλπιγγι — «трубите трубою» (σημαίνω — давать знак трубой). Βαιθαχαρμα — Беф-Хахарма; в корпусе это место — ベト・ハケレム (ср. Неем 3:14, Βηθαχαρμ), греч. форма отлична, отмечено. ἄρατε σημεῖον — «поднимите знамя» (αἴρω). κακὰ ἐκκέκυφεν ἀπὸ βορρᾶ — «зло выглянуло с севера» (ἐκκύπτω — высовываться, выглядывать); слав. «злая произникоша от севера». συντριβὴ μεγάλη γίνεται — «сокрушение великое бывает» (γίνεται — наст. вр., отсюда «起きている»)."
  2: "ἀφαιρεθήσεται τὸ ὕψος σου — «отнимется высота твоя» (ἀφαιρέω — отнимать; ὕψος — высота, 高み); слав. «отимется высота твоя». У ru (МТ) иначе: «Разорю дочь Сиона, красивую и изнеженную» — чтение МТ, не внесено. «Дочь Сиона» — обращение к Иерусалиму."
  3: "εἰς αὐτὴν ἥξουσιν ποιμένες — «к ней придут пастыри» (ποιμήν — пастырь, 牧者). πήξουσιν ἐπ᾽ αὐτὴν σκηνὰς κύκλῳ — «поставят на ней шатры вокруг» (πήγνυμι — вбивать, ставить; σκηνή — шатёр, 天幕). ποιμανοῦσιν ἕκαστος τῇ χειρὶ αὐτοῦ — «будут пасти каждый рукою своею», т. е. каждый на своём участке; слав. «упасут кийждо рукою своею»."
  4: "Речь врагов; в гр. без вводной формулы, кавычки поставлены как для прямой речи (ср. 6:6, где уже говорит Господь). παρασκευάσασθε ἐπ᾽ αὐτὴν εἰς πόλεμον — «приготовьтесь на неё на войну» (παρασκευάζω). ἀναβῶμεν μεσημβρίας — «взойдём в полдень» (μεσημβρία — полдень). οὐαὶ ἡμῖν — «горе нам». κέκλικεν ἡ ἡμέρα — «день склонился» (κλίνω, перфект); ἐκλείπουσιν αἱ σκιαὶ τῆς ἑσπέρας — «исчезают тени вечера» (ἐκλείπω; ἑσπέρα — вечер)."
  5: "Продолжение речи врагов. διαφθείρωμεν τὰ θεμέλια αὐτῆς — «разрушим основания её» (διαφθείρω — портить, разрушать; θεμέλια — основания, 基); слав. «расточим основания ея». У ru «разорим чертоги её» — иное чтение (МТ)."
  6: "Вводная формула вне кавычек: ὅτι τάδε λέγει κύριος — «ибо так говорит Господь». Ἔκκοψον τὰ ξύλα αὐτῆς — «сруби деревья её» (ἐκκόπτω); слав. «посецы древа его». ἔκχεον ἐπὶ Ιερουσαλημ δύναμιν — «излей на Иерусалим силу» (ἐκχέω; δύναμις — сила); в МТ здесь «насыпьте вал», LXX понял иначе — держим LXX, отмечено. ὦ πόλις ψευδής — «о город лживый»; ὅλη καταδυναστεία ἐν αὐτῇ — «вся [она] притеснение» (καταδυναστεία — насилие, угнетение, 暴虐)."
  7: "ὡς ψύχει λάκκος ὕδωρ — «как студит колодец воду» (ψύχω — охлаждать; λάκκος — яма, колодец, 井戸); слав. «якоже студену творит кладязь воду свою». οὕτως ψύχει κακία αὐτῆς — «так студит злоба её», т. е. злоба не иссякает, как вода в колодце. ἀσέβεια καὶ ταλαιπωρία ἀκουσθήσεται ἐν αὐτῇ — «нечестие и бедствие услышится в ней» (ταλαιπωρία — бедствие, страдание); ἐπὶ πρόσωπον αὐτῆς διὰ παντός — «пред лицом её всегда» (в LXX нет «Моим», как в ru; слав. «над лицем его всегда»). πόνῳ καὶ μάστιγι — «болезнью и бичом» (πόνος, μάστιξ): по gr эти слова завершают 6:7, а сказуемое παιδευθήσῃ открывает 6:8; клауза разорвана, поэтому в тексте они отнесены к 6:8 по слав. («Немощию и язвою накажешися»)."
  8: "παιδευθήσῃ — «будешь наказана» (παιδεύω — наставлять, наказывать); слав. «накажешися». μὴ ἀποστῇ ἡ ψυχή μου ἀπὸ σοῦ — «да не отступит душа Моя от тебя» (ἀφίστημι). μὴ ποιήσω σε ἄβατον γῆν ἥτις οὐ κατοικηθήσεται — «не сделаю тебя землёю непроходимою, которая не будет обитаема» (ἄβατος — непроходимый; κατοικέω — обитать). «Болезнью и бичом» (πόνῳ καὶ μάστιγι) — конец 6:7 по gr, см. notes к 6:7."
  9: "Καλαμᾶσθε καλαμᾶσθε — «обирайте, обирайте» (καλαμάομαι — собирать виноград, срезать гроздья); повтор сохранён. ὡς ἄμπελον τὰ κατάλοιπα τοῦ Ισραηλ — «как виноград — остаток Израиля». ἐπιστρέψατε ὡς ὁ τρυγῶν ἐπὶ τὸν κάρταλλον αὐτοῦ — «возвратитесь, как собирающий [виноград] к корзине своей» (τρυγάω — собирать виноград; κάρταλλος — корзина, 籠); слав. «обратитеся аки обиратель на кошницу свою». Образ: обирают до последней грозди."
  10: "Речь пророка от первого лица (в гр. без формулы; ср. 6:11). πρὸς τίνα λαλήσω καὶ διαμαρτύρωμαι — «к кому буду говорить и свидетельствовать» (διαμαρτύρομαι — торжественно свидетельствовать, увещевать). ἀπερίτμητα τὰ ὦτα αὐτῶν — «необрезаны уши их» (ἀπερίτμητος — необрезанный, 無割礼); слав. «необрезана ушеса их». τὸ ῥῆμα κυρίου ἐγένετο αὐτοῖς εἰς ὀνειδισμόν — «слово Господне стало для них в поношение» (ὀνειδισμός — поношение, 罵り); οὐ μὴ βουληθῶσιν αὐτὸ ἀκοῦσαι — «не захотят его слышать» (сильное отрицание)."
  11: "καὶ τὸν θυμόν μου ἔπλησα — «и ярость Мою исполнил» (πίμπλημι); καὶ ἐπέσχον — «и удержал» (ἐπέχω); οὐ συνετέλεσα αὐτούς — «не истребил их» (συντελέω). По контексту 6:10 это речь пророка, исполненного гнева (ср. ru «я преисполнен яростью Господнею»), а не прямая речь Бога; отмечено. ἐκχεῶ ἐπὶ νήπια ἔξωθεν — «изолью на младенцев вне [дома]» (νήπιος — младенец, 幼い子); ἐπὶ συναγωγὴν νεανίσκων ἅμα — «на собрание юношей вместе» (συναγωγή — собрание; νεανίσκος — юноша). ἀνὴρ καὶ γυνὴ συλλημφθήσονται — «муж и жена будут взяты» (συλλαμβάνω — захватывать); πρεσβύτερος μετὰ πλήρους ἡμερῶν — «старец с исполненным дней» (πλήρης — полный)."
  12: "Новое слово Господа; «と主は言われる» в конце стиха оставлено внутри кавычек (ср. 1:15). μεταστραφήσονται αἱ οἰκίαι αὐτῶν εἰς ἑτέρους — «перейдут дома их к другим» (μεταστρέφω — передавать, обращать); ἀγροὶ καὶ αἱ γυναῖκες αὐτῶν ἐπὶ τὸ αὐτό — «поля и жёны их вместе» (ἐπὶ τὸ αὐτό — вместе). ἐκτενῶ τὴν χεῖρά μου — «простру руку Мою» (ἐκτείνω); ἐπὶ τοὺς κατοικοῦντας τὴν γῆν ταύτην — «на обитателей земли сей»."
  13: "ἀπὸ μικροῦ αὐτῶν καὶ ἕως μεγάλου — «от малого их и до великого», т. е. от мала до велика. πάντες συνετελέσαντο ἄνομα — «все совершили беззаконие» (συντελέω; ἄνομος — беззаконный); слав. «вси совершиша беззаконная». ἀπὸ ἱερέως καὶ ἕως ψευδοπροφήτου — «от священника и до лжепророка»; πάντες ἐποίησαν ψευδῆ — «все делали ложное»."
  14: "ἰῶντο τὸ σύντριμμα τοῦ λαοῦ μου — «врачевали сокрушение народа Моего» (ἰάομαι — лечить); слав. «целяху сотрение людий моих». ἐξουθενοῦντες — «уничижая, легкомысленно» (ἐξουθενέω — ни во что ставить), отсюда 軽んじながら. εἰρήνη «мир, мир» — слова ложных врачевателей, вложенная цитата 『…』. καὶ ποῦ ἐστιν εἰρήνη; — «и где есть мир?» — вопрос Бога."
  15: "κατῃσχύνθησαν, ὅτι ἐξελίποσαν — «постыдились, что оскудели»; καὶ οὐδ᾽ ὧς καταισχυνόμενοι κατῃσχύνθησαν — «и даже так, посрамляемые, не постыдились» (καταισχύνω — посрамлять); τὴν ἀτιμίαν αὐτῶν οὐκ ἔγνωσαν — «бесчестия своего не познали» (ἀτιμία). Греч. тёмен, смысл: стыда у них нет. πεσοῦνται ἐν τῇ πτώσει αὐτῶν — «падут падением своим» (πτῶσις); ἐν καιρῷ ἐπισκοπῆς αὐτῶν ἀπολοῦνται — «во время посещения их погибнут» (ἐπισκοπή — посещение, 訪れ); εἶπεν κύριος — «сказал Господь», формула вне кавычек закрывает слово."
  16: "Στῆτε ἐπὶ ταῖς ὁδοῖς — «станьте на путях» (ἵστημι); ἴδετε — «смотрите». ἐρωτήσατε τρίβους κυρίου αἰωνίους — «спросите о стезях Господних вечных» (τρίβος — тропа, стезя; αἰώνιος — вечный); слав. «вопросите о стезях Господних вечных». ποία ἐστὶν ἡ ὁδὸς ἡ ἀγαθή — «какой путь добрый»; βαδίζετε ἐν αὐτῇ — «ходите по нему». εὑρήσετε ἁγνισμὸν ταῖς ψυχαῖς ὑμῶν — «найдёте очищение душам вашим» (ἁγνισμός — очищение, 清め); слав. «обрящете очищение душам вашым». Ответ народа — вложенная цитата 『…』: καὶ εἶπαν Οὐ πορευσόμεθα — «и сказали: не пойдём»."
  17: "κατέστακα ἐφ᾽ ὑμᾶς σκοπούς — «Я поставил над вами стражей» (καθίστημι, перфект; σκοπός — страж, 見張り). ἀκούσατε τῆς φωνῆς τῆς σάλπιγγος — «слушайте голос трубы». Ответ народа снова 『…』: Οὐκ ἀκουσόμεθα — «не будем слушать»."
  18: "διὰ τοῦτο ἤκουσαν τὰ ἔθνη — «посему услышали народы» (аорист); καὶ οἱ ποιμαίνοντες τὰ ποίμνια αὐτῶν — «и пасущие стада свои». Греч. фраза тёмная (в МТ иначе: «слушайте, народы»); держим LXX, не сглаживаем."
  19: "ἄκουε, γῆ — «слушай, земля». ἐπάγω ἐπὶ τὸν λαὸν τοῦτον κακά — «навожу на народ сей злая» (ἐπάγω — наводить); τὸν καρπὸν ἀποστροφῆς αὐτῶν — «плод отвращения их» (ἀποστροφή — отвращение, отступление, 背き); слав. «плод отвращения их». τῶν λόγων μου οὐ προσέσχον — «словам Моим не внимали» (προσέχω — внимать); τὸν νόμον μου ἀπώσαντο — «закон Мой отвергли» (ἀπωθέω — отталкивать, 退ける)."
  20: "ἵνα τί μοι λίβανον ἐκ Σαβα φέρετε — «к чему Мне ладан из Савы приносите» (λίβανος — ладан, 乳香); κιννάμωμον ἐκ γῆς μακρόθεν — «корицу из земли дальней» (κιννάμωμον — корица, 肉桂). τὰ ὁλοκαυτώματα ὑμῶν οὔκ εἰσιν δεκτά — «всесожжения ваши не приемлемы» (δεκτός — приемлемый); αἱ θυσίαι ὑμῶν οὐχ ἥδυνάν μοι — «жертвы ваши не усладили Меня» (ἡδύνω — услаждать); слав. «не усладиша мя»."
  21: "ἰδοὺ ἐγὼ δίδωμι ἐπὶ τὸν λαὸν τοῦτον ἀσθένειαν — «вот, Я даю на народ сей болезнь» (ἀσθένεια — немощь, болезнь); слав. «дам на люди сия болезнь». ἀσθενήσουσιν ἐν αὐτῇ — «изнемогут в ней»; πατέρες καὶ υἱοὶ ἅμα — «отцы и сыны вместе»; γείτων καὶ ὁ πλησίον αὐτοῦ ἀπολοῦνται — «сосед и ближний его погибнут» (γείτων — сосед)."
  22: "Ἰδοὺ λαὸς ἔρχεται ἀπὸ βορρᾶ — «вот, народ идёт от севера»; ἔθνη ἐξεγερθήσεται ἀπ᾽ ἐσχάτου τῆς γῆς — «народы поднимутся от конца земли» (ἐξεγείρω — поднимать; ἔσχατον — конец, 果て); слав. «язык велик востанет от конец земли» (ед. ч. — «народ»); в тексте 民, как в слав."
  23: "τόξον καὶ ζιβύνην κρατήσουσιν — «лук и копьё (дротик) будут держать» (ζιβύνη — метательное копьё); слав. «лук и щит возмут» — иное чтение, отмечено. ἰταμός ἐστιν καὶ οὐκ ἐλεήσει — «дерзок (жесток) он и не помилует» (ἰταμός — дерзкий, необузданный; ἐλεέω — миловать). φωνὴ αὐτοῦ ὡς θάλασσα κυμαίνουσα — «голос его как море волнующееся» (κυμαίνω — волноваться). ἐφ᾽ ἵπποις καὶ ἅρμασιν παρατάξεται — «на конях и колесницах построится» (παρατάσσω — выстраивать в боевой порядок); ὡς πῦρ εἰς πόλεμον πρὸς σέ — «как огонь на войну против тебя»."
  24: "ἠκούσαμεν τὴν ἀκοὴν αὐτῶν — «услышали мы слух о них» (ἀκοή — слух, молва); παρελύθησαν αἱ χεῖρες ἡμῶν — «ослабели руки наши» (παραλύω — расслаблять). θλῖψις κατέσχεν ἡμᾶς — «скорбь объяла нас» (κατέχω — охватывать); ὠδῖνες ὡς τικτούσης — «боли как у рождающей» (ὠδίν — родовые схватки). Голос города в устах пророка, без кавычек (ср. 1:9); 6:25 — предостережение."
  25: "μὴ ἐκπορεύεσθε εἰς ἀγρόν — «не выходите в поле»; ἐν ταῖς ὁδοῖς μὴ βαδίζετε — «по дорогам не ходите». ῥομφαία τῶν ἐχθρῶν παροικεῖ κυκλόθεν — «меч врагов обитает окрест» (ῥομφαία — меч; παροικέω — обитать рядом; κυκλόθεν — кругом); слав. «мечь вражий обитает окрест»."
  26: "περίζωσαι σάκκον — «препояшься вретищем» (σάκκος — вретище, 粗布); κατάπασαι ἐν σποδῷ — «посыпься пеплом» (καταπάσσω — посыпать; σποδός — пепел); πένθος ἀγαπητοῦ ποίησαι σεαυτῇ — «сделай себе плач о возлюбленном» (πένθος — траур, 喪); κοπετὸν οἰκτρόν — «рыдание жалостное» (κοπετός — рыдание; οἰκτρός — жалостный, 痛ましい). ἐξαίφνης ἥξει ταλαιπωρία ἐφ᾽ ὑμᾶς — «внезапно придёт бедствие на вас»; слав. «внезапу приидет запустение на вас», ru «губитель»."
  27: "δοκιμαστὴν δέδωκά σε ἐν λαοῖς δεδοκιμασμένοις — «испытателем дал Я тебя в народе испытанном» (δοκιμαστής — испытывающий; δοκιμάζω — испытывать, пробовать металл); слав. «искусителя дах тя в людех искусных». γνώσῃ με ἐν τῷ δοκιμάσαι με τὴν ὁδὸν αὐτῶν — «узнаешь Меня, когда Я испытаю путь их»; слав. «увеси мя, внегда искусити ми путь их». У ru (МТ) «башнею поставил Я тебя» — иное чтение, не внесено."
  28: "πάντες ἀνήκοοι — «все непослушные» (ἀνήκοος — неслушающий); πορευόμενοι σκολιῶς — «ходящие криво» (σκολιός — кривой, лукавый); χαλκὸς καὶ σίδηρος — «медь и железо» (χαλκός — медь, бронза; 青銅); πάντες διεφθαρμένοι εἰσίν — «все развращены» (διαφθείρω — портить). Образ: негодный металл для плавки."
  29: "ἐξέλιπεν φυσητὴρ ἀπὸ πυρός — «иссяк мех от огня» (φυσητήρ — кузнечный мех, ふいご); ἐξέλιπεν μόλιβος — «иссяк свинец» (μόλιβος — свинец, 鉛); слав. «оскуде мех от огня, истле олово» (олово вместо свинца). εἰς κενὸν ἀργυροκόπος ἀργυροκοπεῖ — «всуе серебряных дел мастер серебро куёт» (ἀργυροκόπος — серебряных дел мастер; ἀργυροκοπέω — ковать серебро); πονηρία αὐτῶν οὐκ ἐτάκη — «злоба их не расплавилась» (τήκω — плавить)."
  30: "ἀργύριον ἀποδεδοκιμασμένον καλέσατε αὐτούς — «серебром отверженным назовите их» (ἀποδοκιμάζω — отвергать при испытании); ὅτι ἀπεδοκίμασεν αὐτοὺς κύριος — «ибо отверг их Господь». Кавычки закрываются; глава кончается."
