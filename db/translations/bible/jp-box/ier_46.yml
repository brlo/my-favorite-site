verses:
  1: "ユダの王[おう]ゼデキヤの第九年[だいきゅうねん]、第十[だいじゅう]の月[つき]に、バビロンの王[おう]ネブカドネツァルとその全軍[ぜんぐん]がエルサレムに来[き]て、これに向[む]かって陣[じん]を取[と]り、包囲[ほうい]した。"
  2: "ゼデキヤの第十一年[だいじゅういちねん]、第四[だいよん]の月の九日[ここのか]に、町[まち]は破[やぶ]られた。"
  3: "バビロンの王[おう]の高官[こうかん]たちはみな入[はい]って来[き]て、中[なか]の門[もん]に座[すわ]った。すなわち、ナルガラサル、サマゴト、ナブサハル、ナブサリス、ナガルガスナセル、ラバマグ、およびバビロンの王[おう]の残[のこ]りの高官[こうかん]たちである。"
  4: "ユダの王[おう]ゼデキヤと戦[いくさ]の男[おとこ]たちはみな、彼らを見[み]ると逃[に]げ、夜[よる]のうちに町[まち]を出[で]て、王[おう]の園[その]の道[みち]を通[とお]り、城壁[じょうへき]と城壁の間[あいだ]にある門[もん]を抜[ぬ]けて、荒[あ]れ野[の]の道[みち]へ出[で]た。"
  5: "カルデアの軍[ぐん]は彼[かれ]らの後[あと]を追[お]い、エリコの荒[あ]れ野[の]でゼデキヤに追[お]いつき、捕[と]らえてバビロンの王[おう]ネブカドネツァルのもとへ連[つ]れて行[い]った。ハマテの地[ち]のリブラにおいてである。王は彼に判決[はんけつ]を告[つ]げた。"
  6: "バビロンの王[おう]はリブラで、ゼデキヤの目[め]の前[まえ]で彼の子[こ]らを殺[ころ]し、ユダの貴族[きぞく]たちもみな打[う]ち殺[ころ]した。"
  7: "そしてゼデキヤの目[め]をえぐり、鎖[くさり]で縛[しば]って、彼をバビロンへ連[つ]れて行[い]った。"
  8: "王[おう]の家[いえ]と民[たみ]のすべての家[いえ]をカルデア人[じん]たちは火[ひ]で焼[や]き、エルサレムの城壁[じょうへき]を打[う]ち壊[こわ]した。"
  9: "町[まち]に残[のこ]った民[たみ]の残[のこ]り、およびバビロンの王[おう]の側[がわ]に逃[に]げた者[もの]たちを、親衛隊[しんえいたい]の長[ちょう]ネブザルアダンはバビロンへ移[うつ]した。"
  10: "民[たみ]のうち、何[なに]も持[も]たない貧[まず]しい者[もの]たちは、親衛隊[しんえいたい]の長[ちょう]ネブザルアダンがユダの地[ち]に残[のこ]し、その日[ひ]、彼らにぶどう畑[ばたけ]と畑[はたけ]を与[あた]えた。"
  11: "バビロンの王[おう]ネブカドネツァルは、預言者[よげんしゃ]エレミヤについて、親衛隊[しんえいたい]の長[ちょう]ネブザルアダンに命[めい]じて言[い]った。"
  12: "「彼[かれ]を連[つ]れて行[い]け。彼に目[め]をかけよ。悪[わる]いことを何[なに]もするな。彼が望[のぞ]むとおりに、彼にしてやれ。」"
  13: "そこで親衛隊[しんえいたい]の長[ちょう]ネブザルアダンは、ナブゼズバン、ラプサリス、ネルガル、サラサル、ファブマン、およびバビロンの王[おう]のすべての長[かしら]たちを遣[つか]わし、"
  14: "彼らはエレミヤを牢[ろう]の庭[にわ]から連[つ]れ出[だ]して、アヒカムの子[こ]、シャファンの孫[まご]ゲダルヤに引[ひ]き渡[わた]した。そして彼を連[つ]れ出[だ]し、彼は民[たみ]のただ中[なか]に住[す]んだ。"
  15: "エレミヤに、彼がまだ牢[ろう]の庭[にわ]にいたとき、主[しゅ]の言葉[ことば]があった。"
  16: "「行[い]って、エチオピア人[じん]エベデメレクにこう言[い]え。イスラエルの神[かみ]、主[しゅ]はこう言[い]われる。見[み]よ、わたしはこの町[まち]にわたしの言葉[ことば]を及[およ]ぼす。災[わざわ]いであって、良[よ]いことではない。それはその日[ひ]、あなたの目[め]の前[まえ]に起[お]こる。"
  17: "その日[ひ]、わたしはあなたを救[すく]い、あなたがその顔[かお]を恐[おそ]れている人[ひと]々[びと]の手[て]にあなたを渡[わた]さない。"
  18: "わたしは必[かなら]ずあなたを救[すく]う。あなたは剣[つるぎ]で倒[たお]れることがない。あなたの魂[たましい]は分捕[ぶんど]り物[もの]としてあなたのものとなる。あなたがわたしに依[よ]り頼[たの]んだからである、と主[しゅ]は言[い]われる。」"

notes:
  1: "Καὶ ἐγένετο ἐν τῷ ἔτει τῷ ἐνάτῳ τοῦ Σεδεκια βασιλέως Ιουδα — «и было в девятый год Седекии, царя Иудейского»: ἐνιαυτός/ἔτος — год; слав. «в девятое лето седекии царя иудина». ἐν τῷ μηνὶ τῷ δεκάτῳ — «в десятый месяц» (день в LXX не назван, в слав. тоже). παρεγένετο — «прибыл, пришёл»; πᾶσα ἡ δύναμις αὐτοῦ — «вся сила его» (слав.); ἐπολιόρκουν αὐτήν — «осаждали её» (имперфект, длительное действие), в тексте 包囲した. Параллель: 4 Цар 25:1; Иер 52:4."
  2: "ἐν τῷ ἑνδεκάτῳ ἔτει — «в одиннадцатый год»; ἐνάτῃ τοῦ μηνός — «в девятый день месяца» (ἐνάτη — девятая, порядковое при «дне»); ἐρράγη ἡ πόλις — «раскололся (был взят) город» (ῥήγνυμι — разрывать, раскалывать; слав. «разседеся град»). В тексте 破られた, без добавления «взяли»."
  3: "εἰσῆλθον πάντες οἱ ἡγεμόνες βασιλέως Βαβυλῶνος — «вошли все вожди (князья) царя Вавилонского»: ἡγεμών — вождь, начальник (в 47:8 то же слово при «силах» — 軍の長); в тексте 高官. ἐκάθισαν ἐν πύλῃ τῇ μέσῃ — «сели в средних воротах», т. е. в воротах, ведших в город (ср. 4 Цар 25:4). Имена — транслитерация греч.: Ναργαλασαρ — ナルガラサル, Σαμαγωθ — サマゴト, Ναβουσαχαρ — ナブサハル, Ναβουσαρις — ナブサリス, Ναγαργασνασερ — ナガルガスナセル, Ραβαμαγ — ラバマグ (слав. «ниргелсарасар… нагаргас, насерравамаг»; у swete: Ναγαργασνασέρ, Ῥαβαμάθ)."
  4: "**Лакуна модуля**: в gr-lxx-byz на месте стиха стоит «.», в gr-lxx-swete стиха нет вовсе, хотя нумерация ст. 14 совпадает со слав. — счёт стихов не сдвинут. Переведено по слав. 39:4 (текст в выгрузке), без 〔…〕. Слав.: «И бысть егда узре я седекиа царь иудин и вси мужие ратнии, и избегоша, и изыдоша в нощи от града по пути вертограда царева и сквозе врата, яже беша между стеною и предстением: и изыдоша в путь пустыни» — «когда увидел их Седекия, царь Иудейский, и все ратные мужи, они побежали и вышли ночью из города по дороге царского сада и через ворота, что были между стеной и предстением (внешним укреплением), и вышли на дорогу пустыни». Параллель: 4 Цар 25:4; Иер 52:7."
  5: "Лакуна модуля (см. 4); по слав. 39:5: «И гнаша вслед их воинство халдейско, и постигоша седекию и поли пустыни иерихонския, и емше приведоша к навуходоносору царю вавилонску во ревлаф, иже в земли емаф, и глагола к нему с судом». Ревлаф = LXX Δεβλαθα (ср. 52:9), обычное русское «Ривла»; в тексте リブラ, как в 4 Цар 25:6. «Глагола к нему с судом» — «произвёл над ним суд» (ср. 4 Цар 25:6), в тексте 判決を告げた. «Поли» — равнины (Ἀραβώθ)."
  6: "Лакуна модуля (см. 4); по слав. 39:6: «И изби царь вавилонский сыны седекиины во ревлафе пред очима его, и вся вельможы иудины поби царь вавилонский». Вельможи — 貴族. Порядок слав. сохранён: сначала сыновья, потом вельможи; в 52:10 и 4 Цар 25:7 порядок тот же."
  7: "Лакуна модуля (см. 4); по слав. 39:7: «И очи седекии изят, и окова его путы, и отведе его в вавилон». «Путы» — 鎖 (в 4 Цар 25:7 πέδαι — 足枷). Страдательность слав. («изят», «окова») передана активным оборотом без названного подлежащего, как и в соседних стихах."
  8: "Лакуна модуля (см. 4); по слав. 39:8: «Дом же царев и домы всех людий пожгоша халдее огнем и стену Иерусалимску превратиша». «Превратиша» — разрушили, сокрушили (в тексте 打ち壊した). Параллель: 4 Цар 25:9–10; Иер 52:13–14."
  9: "Лакуна модуля (см. 4); по слав. 39:9: «…и останок людий, и оставших во граде, и убегшыя, иже утекоша ко царю вавилонску, и останок людий, и оставших пресели навузардан воевода в вавилон». В слав. оборот «остаток людей, и оставших» стоит дважды (диттография списка); в тексте он передан один раз, без дословного удвоения — отмечено здесь. Навузардан — Ναβουζαρδαν, в 4 Цар 25:8 ネブザルアダン (ἀρχιμάγειρος), в тексте 親衛隊の長; слав. «воевода»."
  10: "Лакуна модуля (см. 4); по слав. 39:10: «А от людий убогих, ничтоже имущих, остави навузардан воевода воинств в земли иудине, и даде им винограды и нивы в той день». «Ничтоже имущих» — ничего не имеющих (в тексте 何も持たない); «винограды и нивы» — ぶどう畑と畑."
  11: "Лакуна модуля (см. 4); по слав. 39:11: «И заповеда навуходоносор царь вавилонский о иеремии пророце навузарданови воеводе воинств и рече». Стих — авторская формула, вводит прямую речь царя в 12; в тексте 「…」 открывается в 12."
  12: "Лакуна модуля (см. 4); по слав. 39:12: «возми его и положи нань очи твои и ничтоже ему сотвори зла: но якоже восхощет, тако сотвори ему». «Положить очи на кого» — обратить на него внимание, печься о нём (ср. 39:12; 4 Цар 8:29), в тексте 「目をかけよ」. Императивы слав. переданы формами 連れて行け・目をかけよ・してやれ; кавычки закрываются в конце стиха."
  13: "Лакуна модуля (см. 4); по слав. 39:13: «Посла убо навузардан воевода воинства и навузезван, и рапсарис и ниргел, и сарасар и фавман, и вси воеводы царя вавилонска». Имена переданы с слав. форм (греч. текста стиха в базе нет): ナブゼズバン (Навузезван), ラプサリス (Рапсарис), ネルガル (Ниргел — Нергал), サラサル (Сарасар), ファブマン (Фавман). Слав. стих кончается двоеточием: перечень посланных переходит в ст. 14 «и послаша, и пояша иеремию». Стих переведён с запятой в конце (как и слав. двоеточие), чтобы не удваивать «послал», — граница стихов держится по нумерации."
  14: "καὶ ἀπέστειλαν καὶ ἔλαβον τὸν Ιερεμιαν ἐξ αὐλῆς τῆς φυλακῆς — «и послали, и взяли Иеремию из двора темницы» (αὐλή — двор, ср. 32:2; 39:14); ἔδωκαν αὐτὸν πρὸς τὸν Γοδολιαν υἱὸν Αχικαμ υἱοῦ Σαφαν — «отдали его Годолии, сыну Ахикама, сына Сафана» (в тексте シャファン, как в 33:24, ср. シャファン в 36:10); ἐξήγαγον αὐτόν, καὶ ἐκάθισεν ἐν μέσῳ τοῦ λαοῦ — «и вывели его, и он сел (остался жить) среди народа». ru (МТ) добавляет «отвести его домой» — ни в LXX, ни в слав. этого нет, не внесено."
  15: "Καὶ πρὸς Ιερεμιαν ἐγένετο λόγος Κυρίου ἐν τῇ αὐλῇ τῆς φυλακῆς λέγων — «и к Иеремии было слово Господне во дворе темницы, говоря»: вводная формула вне кавычек, её содержание — с 16 (λέγων переходит в речь). Слав. «ко дворе темничнем глаголя»."
  16: "Πορεύου καὶ εἰπὸν πρὸς Αβδεμελεχ τὸν Αἰθίοπα — «иди и скажи Авдемелеху Ефиоплянину» (Αἰθίοψ — эфиоп; имя в тексте エベデメレク). Οὕτως εἶπεν κύριος ὁ θεὸς Ισραηλ — «так говорит Господь Бог Израилев»: формула внутри речи, кавычки не разрывает; с этих слов адресат — Авдемелех. Ἰδοὺ ἐγὼ φέρω τοὺς λόγους μου ἐπὶ τὴν πόλιν ταύτην εἰς κακὰ καὶ οὐκ εἰς ἀγαθά — «вот, Я привожу слова Мои на город сей во зло, а не во благо». Слав. добавляет «и будут пред лицем твоим в той день» (по МТ) — нет в LXX; по паритету внесено в текст без скобок (それはその日、あなたの目の前に起こる)."
  17: "καὶ σώσω σε ἐν τῇ ἡμέρᾳ ἐκείνῃ — «и спасу тебя в тот день»; οὐ μὴ δώσω σε εἰς χεῖρας τῶν ἀνθρώπων, ὧν σὺ φοβῇ ἀπὸ προσώπου αὐτῶν — «не предам тебя в руки людей, которых ты боишься лица их» (букв.). Слав. «ихже ты боишися от лица их»; в тексте その顔を恐れている人々."
  18: "ὅτι σῴζων σώσω σε — «ибо спасая спасу тебя» (гебраизм усиления: «непременно спасу»); ἐν ῥομφαίᾳ οὐ μὴ πέσῃς — «и мечом не падёшь» (ῥομφαία — меч, в тексте 剣); ἔσται ἡ ψυχή σου εἰς εὕρεμα — «будет душа твоя в находку (в добычу)»: εὕρεμα — находка, добыча; слав. «на обретение», в тексте 分捕り物. ὅτι ἐπεποίθεις ἐπ᾿ ἐμοί — «ибо ты уповал (положился) на Меня» (πείθω, перфект); φησὶν κύριος — «говорит Господь». Здесь закрывается слово Господа, начатое в 16."
