# jp-box, Иеремия, глава 46. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc этой главы не имеет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 46 = слав./ru 39: падение Иерусалима. План: 1 осада в девятый год Седекии;
# 2 одиннадцатый год, четвёртый месяц, девятый день — город взят; 3 вожди Вавилона
# сели в средних воротах; 4–13 **лакуна модуля** (в gr-lxx-byz на месте стихов стоит
# «.», в gr-lxx-swete их нет вовсе): бегство Седекии, погоня, Ривла, казнь сыновей,
# ослепление, сожжение города и стены, переселение, бедные оставлены, повеление
# Навуходоносора о Иеремии, посланные сановники; 14 Иеремия выведен из двора темницы
# и отдан Годолии; 15–18 слово Господа к Авдемелеху (эфиопу).
# Голоса: 1–11 — авторский текст; 12 — 「…」 (слова Навуходоносора, одна фраза);
# 13–15 — авторский текст; 16–18 — одно слово Господа в 「…」 (повеление «иди и скажи»
# и весть Авдемелеху; «と主は言われる» в 18 внутри речи). Вводные формулы («и было»,
# «и сказал», «было слово Господне») — вне кавычек.
# Нумерация: gr 18 стихов = слав. 39:1–18, номер в номер. Стихи 4–13 — «точки»
# модуля; переведены по слав. 39 тех же номеров, без 〔…〕, лакуна отмечена в notes.
# 〔…〕 нет. Сносок ⟨…⟩ нет: 高官, 城壁, 親衛隊, 預言者, エチオピア人, 分捕り物 уже
# в корпусе; ナガルガスナセル и подобные — транслитерация, оговорены в notes.
# Имена — транслитерация греческого (LXX): ゼデキヤ, ネブカドネツァル, バビロン,
# カルデア人, エルサレム, リブラ (Δεβλαθα), ハマテ, ネブザルアダン (Ναβουζαρδαν),
# ゲダルヤ, アヒカム, シャファン, エベデメレク (Αβδεμελεχ), エレミヤ.

