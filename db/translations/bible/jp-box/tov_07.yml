# jp-box, Товит, глава 7. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc в книге нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 7: приход в Екбатаны и встреча у Рагуила (1), Рагуил узнаёт Товита в юноше (2),
# расспросы о происхождении и о Товите (3–5), объятия и плач (6–7), угощение (8),
# Товия просит Рафаила начать дело (9), договор о браке (10–13), брачная запись
# и начало пира (14), приготовление брачной комнаты (15–17).
# Прямая речь — 「…」: 2–6, 9–13, 15, 17; красного и синего нет.
# Нумерация по gr: 17 стихов. Слав. дробит и сливает стихи: 7:6 разделён на 6–7,
# 7:7–7:8 сдвинуты на 7:8–7:9 (7:8+7:9 слиты), 7:11+7:12 слиты в 7:11,
# 7:13 = слав. 7:12, 7:14 = слав. 7:13–14; с 7:15 совпадает. В тексте — по gr.
# 〔…〕 нет: все стихи есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 婚礼, 律法, 祝福 и имена уже в корпусе.
# Имена — транслитерация греческого (LXX).

