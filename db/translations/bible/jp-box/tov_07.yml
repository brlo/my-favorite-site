verses:
  1: "彼[かれ]らはエクバタナに来[き]て、ラグエルの家[いえ]に着[つ]いた。サラは彼らを迎[むか]えて喜[よろこ]んで挨拶[あいさつ]し、彼らも彼女[かのじょ]に挨拶した。そして彼女は彼らを家の中へ導[みちび]き入[い]れた。"
  2: "ラグエルは妻[つま]エドナに言[い]った。「この若者[わかもの]は、わたしの兄弟[きょうだい]の子[こ]トビトによく似[に]ている。」"
  3: "ラグエルは彼らに尋[たず]ねた。「あなたがたはどこから来[き]たのか、兄弟[きょうだい]たちよ。」彼らは言った。「ニネベに捕囚[ほしゅう]となっているナフタリの子[こ]らの中[なか]からである。」"
  4: "彼は彼らに言った。「あなたがたは、わたしたちの兄弟[きょうだい]トビトを知[し]っているか。」彼らは言った。「知っている。」"
  5: "彼は言った。「彼は元気[げんき]でいるか。」彼らは言った。「生[い]きていて、元気でいる。」そこでトビアが言った。「わたしの父[ちち]だ。」"
  6: "ラグエルは跳[と]び上[あ]がって彼に口[くち]づけし、泣[な]いて彼を祝福[しゅくふく]して言った。「良[よ]い、また立派[りっぱ]な人[ひと]の子[こ]よ。」そして、トビトが目[め]を失[うしな]ったと聞[き]いて、悲[かな]しみ、泣いた。"
  7: "彼の妻[つま]エドナと娘[むすめ]サラも泣き、彼らを心[こころ]から迎[むか]え入[い]れた。"
  8: "そして羊[ひつじ]の群[む]れから雄羊[おひつじ]を屠[ほふ]り、多[おお]くの料理[りょうり]を並[なら]べた。"
  9: "トビアはラファエルに言った。「アザルヤ、兄弟[きょうだい]よ、道[みち]で話[はな]していたことを語[かた]って、この事[こと]が成就[じょうじゅ]するようにしてくれ。」"
  10: "彼はその話[はなし]をラグエルに伝[つた]えた。ラグエルはトビアに言った。「食[た]べて飲[の]み、喜[よろこ]んでいなさい。わたしの娘[むすめ]を娶[めと]るのは、あなたの当然[とうぜん]の務[つと]めだからである。もっとも、わたしはあなたに真実[しんじつ]を告[つ]げよう。"
  11: "わたしは娘を七人[ななにん]の男[おとこ]に与[あた]えたが、彼らは彼女[かのじょ]のところに入[はい]るたびに、夜[よる]のうちに死[し]んだ。だが、今[いま]は喜[よろこ]んでいなさい。」"
  12: "そこでトビアが言った。「あなたがたが事[こと]を取り決[き]め、わたしと固[かた]く定[さだ]めるまでは、ここで何[なに]も口[くち]にしない。」ラグエルは言った。「今から、慣習[かんしゅう]に従[したが]って彼女を娶れ。あなたは彼女の兄弟[きょうだい]であり、彼女はあなたのものだからである。あわれみ深[ぶか]い神[かみ]が、あなたがたの道[みち]を最善[さいぜん]に導[みちび]いてくださる。」"
  13: "ラグエルは娘[むすめ]サラを呼[よ]び、彼女の手[て]を取って、トビアに妻[つま]として与[あた]えて言った。「見[み]よ、モーセの律法[りっぽう]に従[したが]って彼女を娶って、あなたの父[ちち]のもとへ連[つ]れて行[い]け。」そして彼らを祝福[しゅくふく]した。"
  14: "また、妻[つま]エドナを呼び、巻物[まきもの]を取って契約[けいやく]を書[か]き記[しる]し、それに印[いん]を押[お]した。そして彼らは食[た]べ始[はじ]めた。"
  15: "ラグエルは妻[つま]エドナを呼んで言った。「妻よ、もう一つの部屋[へや]を整[ととの]えて、彼女をそこへ連[つ]れて行[い]きなさい。」"
  16: "彼女は言[い]われたとおりにして、サラをそこへ連[つ]れて行[い]き、泣[な]いた。そして娘[むすめ]の涙[なみだ]を受[う]け止[と]めて、言った。"
  17: "「勇気[ゆうき]を出[だ]しなさい、子[こ]よ。天[てん]と地[ち]の主[しゅ]が、あなたのこの悲[かな]しみの代[か]わりに喜[よろこ]びを与[あた]えてくださるように。勇気を出しなさい、娘[むすめ]よ。」"

notes:
  1: "ἦλθον εἰς Ἐκβάτανα — пришли в Екбатаны (Ἐκβάτανα, エクバタナ); παρεγένοντο εἰς τὴν οἰκίαν Ραγουηλ — прибыли в дом Рагуила (παραγίνομαι). ὑπήντησεν αὐτοῖς — вышла им навстречу (ὑπαντάω), ἐχαιρέτισεν — приветствовала (χαιρετίζω); взаимность «и они её» передана оборотом 彼らも彼女に挨拶した. εἰσήγαγεν — ввела (εἰσάγω). Слав. «приидоста» — двойственное число: Товия и Рафаил; слав. добавляет «радостно» при приветствии — передано 喜んで."
  2: "Ὡς ὅμοιος ὁ νεανίσκος — как похож юноша (νεανίσκος, 若者). τῷ ἀνεψιῷ μου — двоюродному брату моему (ἀνεψιός — племянник, кузен); слав. «сыну брата моего» и ru поняли как «сын брата», поэтому 兄弟の子. Прямая речь Рагуила, обращённая к жене, — 「」."
  3: "Πόθεν ἐστέ, ἀδελφοί — откуда вы, братья (ἀδελφοί, зват. мн.). Ἐκ τῶν υἱῶν Νεφθαλι τῶν αἰχμαλώτων ἐν Νινευη — из сыновей Неффалима, пленённых в Ниневии (αἰχμάλωτος — пленный; Νεφθαλι — ナフタリ). Слав. «от сынов неффалимлих плененных в ниневию»."
  4: "Γινώσκετε Τωβιτ τὸν ἀδελφὸν ἡμῶν — знаете ли Товита, брата нашего. οἱ δὲ εἶπαν Γινώσκομεν — они сказали: знаем. Слав. уже добавляет в конце «здравствует ли?» — это начало греч. 7:5, поэтому в 7:4 не переведено."
  5: "Ὑγιαίνει — здоров ли (ὑγιαίνω). Καὶ ζῇ καὶ ὑγιαίνει — и жив, и здоров. Τωβιας Πατήρ μού ἐστιν — Товия: это отец мой. Слав. начинает стих ответом «и жив есть и здравствует» — это конец греч. 7:4."
  6: "ἀνεπήδησεν — вскочил (ἀναπηδάω); κατεφίλησεν — поцеловал (καταφιλέω); εὐλόγησεν — благословил. Ὁ τοῦ καλοῦ καὶ ἀγαθοῦ ἀνθρώπου — «[сын] доброго и благого человека»: эллипсис без сказуемого, καλός — добрый, прекрасный, ἀγαθός — благой. ἀπώλεσεν τοὺς ὀφθαλμούς — потерял глаза (ἀπόλλυμι). Слав. делит стих на 6–7, у LXX всё в 7:6."
  7: "ἔκλαυσαν — заплакали; ὑπεδέξαντο — приняли (ὑποδέχομαι); προθύμως — усердно, радушно. Слав. относит плач Едны и Сарры к 7:8 («и една… плакастеся»), у LXX — 7:7."
  8: "ἔθυσαν κριὸν προβάτων — закололи овна из овец (θύω; κριός — баран). παρέθηκαν ὄψα πλείονα — поставили множество кушаний (ὄψον — кушанье, приправа). Слав. 7:9 соединяет этот стих со следующим («и заклаша овна… Рече же товиа…»); у LXX 7:8 — только трапеза."
  9: "Εἶπεν δὲ Τωβιας τῷ Ραφαηλ — сказал же Товия Рафаилу. Αζαρια ἄδελφε — Азария, брат (зват.; 兄弟よ). λάλησον ὑπὲρ ὧν ἔλεγες ἐν τῇ πορείᾳ — скажи о том, о чём говорил в пути. τελεσθήτω τὸ πρᾶγμα — да совершится дело (τελέω; πρᾶγμα — дело). Слав. «рцы, о нихже глаголал еси на пути»."
  10: "μετέδωκεν τὸν λόγον — передал слово, сообщил (μεταδίδωμι). Φάγε καὶ πίε καὶ ἡδέως γίνου — ешь, пей и будь в радости (ἡδέως — охотно, приятно). σοὶ γὰρ καθῆκει τὸ παιδίον μου λαβεῖν — тебе ведь подобает взять дитя моё (καθήκει — подобает; παιδίον — дитя, здесь о дочери). πλὴν ὑποδείξω σοι τὴν ἀλήθειαν — впрочем, покажу тебе истину (ὑποδείκνυμι)."
  11: "ἔδωκα τὸ παιδίον μου ἑπτὰ ἀνδράσιν — отдал дитя моё семи мужам. ὁπότε ἐὰν εἰσεπορεύοντο πρὸς αὐτήν — всякий раз, когда входили к ней (εἰσπορεύομαι). ἀπεθνῄσκοσαν ὑπὸ τὴν νύκτα — умирали под ночь, к ночи (ἀποθνῄσκω; ὑπὸ τὴν νύκτα). Слав. «умираху под нощь»; в тексте 夜のうちに. Слав. 7:11 соединяет греч. 7:11 и 7:12."
  12: "Οὐ γεύσομαι οὐδὲν ὧδε — не вкушу ничего здесь (γεύομαι). ἕως ἂν στήσητε καὶ σταθῆτε πρός με — пока не установите и не утвердите со мною (ἵστημι); тёмное место, слав. «дондеже поставите и совещаетеся со мною». Κομίζου αὐτὴν ἀπὸ τοῦ νῦν κατὰ τὴν κρίσιν — возьми её отныне по суду, по праву (κομίζω — уносить; κρίσις — суд, право); в тексте слав. «по обычаю» (慣習). ὁ ἐλεήμων θεὸς εὐοδώσει ὑμῖν τὰ κάλλιστα — милосердный Бог устроит вам наилучшее (εὐοδόω — давать успех). В слав. этот стих — вторая половина 7:11."
  13: "ἐκάλεσεν Σαρραν τὴν θυγατέρα αὐτοῦ — позвал Сарру, дочь свою. λαβὼν τῆς χειρὸς αὐτῆς — взяв её за руку (род. падеж). παρέδωκεν αὐτὴν τῷ Τωβια γυναῖκα — отдал её Товии в жёны. Ἰδοὺ κατὰ τὸν νόμον Μωυσέως — вот, по закону Моисея (νόμος, 律法). ἄπαγε πρὸς τὸν πατέρα σου — веди к отцу твоему. Слав. этот стих = 7:12: с этого места слав. нумерация отстаёт на стих."
  14: "ἐκάλεσεν Εδναν τὴν γυναῖκα αὐτοῦ — позвал Едну, жену свою. λαβὼν βιβλίον — взяв книгу, свиток (βιβλίον). ἔγραψεν συγγραφήν — написал брачную запись, договор (συγγραφή). ἐσφραγίσαντο — запечатали (σφραγίζω). ἤρξαντο ἐσθίειν — начали есть. Слав. делит стих на 7:13–14 («И призва едну… написа писание» и «И начаша ясти»)."
  15: "Ἀδελφή — «сестра» (зват. к жене); буквальное 姉妹よ по-японски невозможно (означает пару сестёр), поэтому 妻よ — то же решение, что в 5:21. τὸ ἕτερον ταμίειον — другая комната, кладовая (ταμίειον; слав. «ин чертог»). εἰσάγαγε αὐτήν — введи её."
  16: "ἐποίησεν ὡς εἶπεν — сделала, как он сказал. εἰσήγαγεν αὐτὴν ἐκεῖ — ввела её туда. ἔκλαυσεν — заплакала. ἀπεδέξατο τὰ δάκρυα τῆς θυγατρὸς αὐτῆς — приняла слёзы дочери своей (ἀποδέχομαι — принимать): мать плачет вместе с дочерью."
  17: "Θάρσει — дерзай, мужайся (θαρσέω). τέκνον — дитя (зват.); θύγατερ — дочь (зват.). ὁ κύριος τοῦ οὐρανοῦ καὶ τῆς γῆς — Господь неба и земли. δῴη σοι χάριν ἀντὶ τῆς λύπης σου ταύτης — да даст тебе благодать вместо этой печали твоей (χάρις, λύπη). Слав. «радость вместо печали» передаёт χάρις как «радость»; в тексте церковное чтение 喜び."
