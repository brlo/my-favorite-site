chapter: 18
draft: true

verses:
  1: "イスラエルの子[こ]らの全会衆[ぜんかいしゅう]はシロに集[あつ]まった。そしてそこに証[あかし]の幕屋[まくや]を立[た]てた。地[ち]は彼[かれ]らによって征服[せいふく]されていた。"
  2: "イスラエルの子[こ]らのうち、まだ嗣業[しぎょう]を受[う]け取[と]っていない七[なな]つの部族[ぶぞく]が残[のこ]っていた。"
  3: "ヨシュアはイスラエルの子[こ]らに言[い]った。「いつまであなたがたは、私たちの主[しゅ]なる神[かみ]が与[あた]えられた地[ち]を嗣業[しぎょう]として受[う]け継[つ]ぐことを怠[おこた]るのか。"
  4: "あなたがたのうちから、部族[ぶぞく]ごとに三人[さんにん]の者[もの]を出[だ]しなさい。彼[かれ]らは立[た]って地[ち]を巡[めぐ]り、それを分[わ]けるのに必要[ひつよう]なとおりに、私[わたし]の前[まえ]で書[か]き記[しる]しなさい。彼らが私のところへ来[き]たら、私はそれを七[なな]つに分けよう。"
  5: "ユダは南[みなみ]から彼[かれ]らの境[さかい]として立ち、ヨセフの子[こ]らは北[きた]から彼らの境として立つ。"
  6: "あなたがたは地[ち]を七[なな]つに分[わ]け、それをここへ、私[わたし]のところへ持[も]って来[き]なさい。私はあなたがたのために、私たちの主[しゅ]なる神[かみ]の前[まえ]でくじを引[ひ]こう。"
  7: "レビの子[こ]らはあなたがたの間[あいだ]に割[わ]り当[あ]てがない。主[しゅ]の祭司[さいし]の務[つと]めが彼[かれ]らの割り当てだからである。ガドとルベン、およびマナセの部族[ぶぞく]の半分[はんぶん]は、ヨルダン川[がわ]の向[む]こう側[がわ]、東[ひがし]で、主の僕[しもべ]モーセが彼らに与[あた]えた嗣業[しぎょう]を受[う]け取[と]った。」"
  8: "そこでその人[ひと]たちは立[た]って出[で]かけた。ヨシュアは、地[ち]を測[はか]りに赴[おもむ]くその人たちに命[めい]じて言[い]った。「行[い]って地を巡[めぐ]り、それを書[か]き記[しる]して、私[わたし]のところへ戻[もど]って来[き]なさい。私はここシロで、主[しゅ]の前[まえ]であなたがたのためにくじを引[ひ]こう。」"
  9: "彼[かれ]らは行[い]って地[ち]を巡[めぐ]り、それを見[み]て、町[まち]ごとに七[なな]つに分[わ]けて書[か]き物[もの]に記[しる]し、ヨシュアのもとへ持[も]って来[き]た。"
  10: "ヨシュアはシロで、主[しゅ]の前[まえ]で彼[かれ]らのためにくじを引[ひ]いた。"
  11: "ベニヤミンの部族[ぶぞく]のくじが、その氏族[しぞく]ごとに最初[さいしょ]に出[で]た。そのくじの境界[きょうかい]は、ユダの間[あいだ]とヨセフの子[こ]らの間に及[およ]んだ。"
  12: "彼[かれ]らの境界[きょうかい]は北[きた]の側[がわ]で、ヨルダン川[がわ]から始[はじ]まった。境界はエリコの背[せ]の北から上[のぼ]り、山[やま]を上って海[うみ]へ向[む]かい、その果[は]ては荒野[こうや]のベトンとなった。"
  13: "そこから境界[きょうかい]はルザへ、すなわちルザの南[みなみ]の背[せ]へと進[すす]む。ルザはベテルである。境界はアタロト・アダルへ下[くだ]り、下[しも]のベテ・ホロンの南にある山[やま]へと下る。"
  14: "境界[きょうかい]はそこから曲[ま]がり、南[みなみ]の側[がわ]から海[うみ]に面[めん]する地方[ちほう]へ巡[めぐ]る。それはベテ・ホロンの前にあって南にある山[やま]からである。その果[は]てはキルヤト・バアル、すなわちユダの子[こ]らの町[まち]キルヤト・ヤリムである。これが海に面する地方である。"
  15: "南[みなみ]の側[がわ]はキルヤト・バアルの端[はし]から出[で]て、境界[きょうかい]はガシンへ、ナフトの水[みず]の泉[いずみ]へと進[すす]む。"
  16: "境界[きょうかい]は、オノムの谷[たに]の前[まえ]にあり、エメク・ラファインの北[きた]の側[がわ]にある山[やま]の麓[ふもと]へ下[くだ]る。それはエブス人[じん]の南[みなみ]の背[せ]、ガイエンナへ下り、ロゲルの泉[いずみ]へ下る。"
  17: "それは北[きた]からベト・サムスの泉[いずみ]へ向[む]かい、ガリロトを通[とお]る。ガリロトはアイタミンの上[のぼ]り口[ぐち]の前[まえ]にある。境界[きょうかい]はルベンの子[こ]らのベオンの石[いし]へ下[くだ]る。"
  18: "境界[きょうかい]はベト・アラバの背[せ]、北[きた]の側[がわ]を通[とお]り、下[くだ]る。"
  19: "そして北[きた]からベト・アグラの背[せ]の境[さかい]に及[およ]ぶ。境界[きょうかい]の果[は]ては、塩[しお]の海[うみ]の北の入[い]り江[え]、ヨルダン川[がわ]の南[みなみ]の端[はし]である。これが南の境界である。"
  20: "またヨルダン川[がわ]が、東[ひがし]の側[がわ]で境界[きょうかい]を定[さだ]める。これがベニヤミンの子[こ]らの嗣業[しぎょう]であり、その境界は氏族[しぞく]ごとに周[まわ]りにある。"
  21: "ベニヤミンの子[こ]らの町[まち]は、その氏族[しぞく]ごとに次[つぎ]のとおりであった。エリコ、ベト・アグラ、アメカシス、"
  22: "ベト・アラバ、サラ、ベサナ、"
  23: "アイン、ファラ、エフラタ、"
  24: "カラファ、ケフィラ、モニ、ガバア。これらは十二[じゅうに]の町[まち]とその村々[むらむら]である。"
  25: "ガバオン、ラマ、ベエロタ、"
  26: "マッシマ、ミロン、アモケ、"
  27: "フィラ、カファン、ナカン、セリカン、ファレエラ、"
  28: "エブス、すなわちエルサレム、および町々[まちまち]、ガバオト・ヤリム。これらは十三[じゅうさん]の町とその村々[むらむら]である。これがベニヤミンの子[こ]らの嗣業[しぎょう]、その氏族[しぞく]ごとのものである。"

notes:
  1: "ἐξεκκλησιάσθη — «собралось» (ἐκκλησιάζω). ἔπηξαν — «поставили, водрузили» (πήγνυμι); σκηνὴ τοῦ μαρτυρίου — 証の幕屋. ἐκρατήθη — «была покорена» (κρατέω)."
  2: "κατελείφθησαν — «остались» (καταλείπω). ἑπτὰ φυλαί — семь племён."
  3: "Ἕως τίνος — «доколе». ἐκλυθήσεσθε — «расслабитесь, замедлите» (ἐκλύω). κύριος ὁ θεὸς ἡμῶν — «Господь Бог наш» (слав. добавляет «отец ваших»)."
  4: "δότε … τρεῖς ἄνδρας ἐκ φυλῆς — по три мужа от племени. διαγραψάτωσαν — «опишут» (διαγράφω). καθὰ δεήσει διελεῖν — «как надлежит разделить». Вторая половина стиха в гр. стоит в издательских скобках; аористы ἤλθοσαν и διεῖλεν переданы как часть распоряжения («когда придут… разделю»), ср. слав. «и приидоша к нему»."
  5: "Ιουδας στήσεται — «Иуда станет». ὅριον — предел. Слав. «да поставит предел своим от лива»."
  6: "μερίς — часть, участок. ἐξοίσω ὑμῖν κλῆρον — «вынесу вам жребий» (ἐκφέρω). ἔναντι κυρίου — пред Господом."
  7: "μερίς — здесь «часть, удел» (не 嗣業). ἱερατεία κυρίου — «священство Господне». Гад, Рувим и половина Манассии — за Иорданом. παῖς κυρίου — «раб Господень» (Моисей)."
  8: "χωροβατῆσαι — «измерить, обойти» (χωροβατέω). ἐξοίσω … ἐν Σηλω — «вынесу… в Силоме». Речь — 「…」."
  9: "ἐχωροβάτησαν — «обошли»; εἴδοσαν — «увидели» (аорист от ὁράω); κατὰ πόλεις αὐτῆς — по городам её; εἰς βιβλίον — в книгу."
  10: "ἐνέβαλεν κλῆρον — «бросил жребий» (ἐμβάλλω). Слав. добавляет «и раздели тамо землю… по разделению их», в гр. только бросание жребия."
  11: "ἐξῆλθεν ὁ κλῆρος … πρῶτος — «вышел жребий… первым». ἀνὰ μέσον Ιουδα καὶ … Ιωσηφ — между Иудой и Иосифом."
  12: "προσαναβήσεται — «поднимется». κατὰ νώτου — «позади, по задней стороне» (背). ἡ Μαδβαρῖτις Βαιθων — «пустыня Бефавен» (слав. «мавдарит вефавн», ru «пустыня Бефавен»)."
  13: "Λουζα — Луз, он же Вефиль. Μααταρωθορεχ — тёмная форма, слав. «атароф-аддар» (Атароф-Адар). Βαιθωρων ἡ κάτω — нижний Беф-Орон."
  14: "τὸ μέρος τὸ βλέπον παρὰ θάλασσαν — «сторона, смотрящая к морю». Καριαθβααλ — Кириаф-Ваал (キルヤト・バアル), Καριαθιαριν — Кириаф-Иарим (キルヤト・ヤリム, как в 15:9,60). В гр. пояснение в скобках: «это Кириаф-Иарим, город сынов Иуды»."
  15: "Γασιν — Гасин (слав. «гаин», ru «Нефтоах»). πηγὴ ὕδατος Ναφθω — источник воды Нафто."
  16: "νάπη Ονναμ — долина Оннам, она же долина Еннома (オノム, как в 15:8). Εμεκραφαιν — долина Рефаимов. Γαιεννα — Геенна (долина Еннома). Ρωγηλ — Рогиль (Ен-Рогел)."
  17: "πηγὴ Βαιθσαμυς — источник Беф-Самс (Ен-Шемеш). Γαλιλωθ — Галилоф. ἀνάβασις Αιθαμιν — возвышенность Адуммим. λίθος Βαιων υἱῶν Ρουβην — камень Ваон сынов Рувима."
  18: "κατὰ νώτου Βαιθαραβα — «позади Беф-Аравы». Стих обрывается на καταβήσεται («сойдёт»), продолжение — в ст. 19; слав. добавляет «ко араве»."
  19: "λογιὰ τῆς θαλάσσης τῶν ἁλῶν — «гребень (залив) Солёного моря»; слав. «на холм моря сланаго». Βαιθαγλα — Беф-Хогла (ベト・アグラ, как в 15:6). ταῦτα τὰ ὅρια … ἀπὸ λιβός — «сии пределы от юга»."
  20: "ὁ Ιορδάνης ὁριεῖ — «Иордан определит границу» (ὁρίζω). κύκλῳ — вокруг."
  21: "Βαιθεγλιω — Беф-Эглио; вероятно, тот же город, что Βαιθαγλα в ст. 19 (Беф-Хогла, 15:6), поэтому передан тем же ベト・アグラ. Αμεκασις — Амекасис (ru «Емек-Кециц»)."
  22: "Βαιθαβαρα — Беф-Араба; Σαρα — Сара; Βησανα — Бесана (слав. «семрим и вифил», ru «Цемараим и Вефиль»)."
  23: "Αιιν — Аин; Φαρα — Фара; Εφραθα — Ефрафа (ru «Офра»)."
  24: "Καραφα — Карафа; Κεφιρα — Кефира; Μονι — Мони; Γαβαα — Гаваа. πόλεις δώδεκα — двенадцать городов; по перечню ст. 21–24 выходит тринадцать, счёт в LXX не сходится (в слав. также «дванадесять»)."
  25: "Γαβαων — Гаваон; Ραμα — Рама; Βεηρωθα — Беэрота."
  26: "Μασσημα — Массима; Μιρων — Мирон; Αμωκη — Амоке."
  27: "Φιρα — Фира; Καφαν — Кафан; Νακαν — Накан; Σεληκαν — Селикан; Θαρεηλα — Фареэла."
  28: "Ιεβους — Иевус, он же Иерусалим; Γαβαωθιαριμ — Гаваафиарим. В гр. «и города» (καὶ πόλεις) без имён — вероятно, лишнее слово: «тринадцать» получается, если считать одиннадцать городов ст. 25–27 плюс Иевус и Гаваафиарим (слав. «тринадесять»)."
