# jp-box, Иисус Навин, глава 18. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в этой главе нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 18: собрание в Силоме (1), семь оставшихся колен и опись земли (2–10),
# граница Вениамина (11–20), города Вениамина (21–28).
# Речь Иисуса — 「…」 (3–7, 8); красного нет.
# 〔…〕 нет: все слова есть в gr-lxx-byz; слав. добавления (18:10 «и раздели тамо
# землю», 18:28 «и силалеф») не внесены.
# Сносок ⟨…⟩ нет: 嗣業, 幕屋, 部族, 氏族, くじ уже в корпусе.
# Отличия LXX: 18:4–5 часть текста стоит в издательских квадратных скобках;
# 18:12 ἡ Μαδβαρῖτις Βαιθων — «пустыня Бефавен»; 18:13 Μααταρωθορεχ — тёмная
# форма (слав. «атароф-аддар»), передана アタロト・アダル; 18:21 Βαιθεγλιω и
# 18:19 Βαιθαγλα — вероятно, один город (Беф-Хогла), передан одним именем
# ベト・アグラ (как в 15:6); счёт «тринадцать городов» в 18:28 с перечнем не сходится.
# jp-ni не использовался.

