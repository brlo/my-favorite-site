verses:
  1: "これらのことの後[のち]、アルタシャスタ王[おう]はアマダトの子[こ]、ブガイ人[じん]アマンを重[おも]んじ、彼[かれ]を高[たか]く掲[かか]げた。アマンは王のすべての友[とも]たちの上座[かみざ]に着[つ]いた。"
  2: "王[おう]の宮廷[きゅうてい]にいる者[もの]たちはみな、アマンにひれ伏[ふ]して拝[おが]んだ。王がそうするよう命[めい]じていたからである。しかし、モルデカイは彼[かれ]にひれ伏して拝まなかった。"
  3: "王[おう]の宮廷[きゅうてい]にいる者[もの]たちはモルデカイに言[い]った。「モルデカイ、なぜ王が言われることに従[したが]わないのか。」"
  4: "彼[かれ]らは毎日[まいにち]モルデカイに語[かた]りかけたが、彼はそれに従[したが]わなかった。そして彼らは、モルデカイが王[おう]の言葉[ことば]に逆[さか]らっていることをアマンに告[つ]げた。モルデカイは、自分[じぶん]がユダヤ人[じん]であることを彼らに告げていた。"
  5: "アマンは、モルデカイが自分[じぶん]にひれ伏[ふ]して拝[おが]まないのを知[し]って、激[はげ]しく怒[いか]った。"
  6: "そして、アルタシャスタ王[おう]の支配[しはい]の下[もと]にあるすべてのユダヤ人[じん]を滅[ほろ]ぼそうと企[たくら]んだ。"
  7: "アルタシャスタの治世[ちせい]の第十二年[だいじゅうにねん]に、アマンは決議[けつぎ]を定[さだ]め、一日[いちにち]ごと、一[いっ]か月[げつ]ごとに、くじを投[な]げて、モルデカイの一族[いちぞく]を一日のうちに滅[ほろ]ぼそうとした。くじは、アダルという月[つき]の十四日[じゅうよっか]に落[お]ちた。"
  8: "アマンはアルタシャスタ王[おう]に語[かた]りかけて言[い]った。「あなたの王国[おうこく]のいたるところで、諸国民[しょこくみん]の間[あいだ]に散[ち]らされた一[ひと]つの民族[みんぞく]がある。彼[かれ]らの掟[おきて]はすべての国民[こくみん]の掟とは異[こと]なっており、王の掟には従[したが]わない。彼らをそのままにしておくことは、王のためにならない。"
  9: "もし王[おう]によしと思[おも]われるなら、彼[かれ]らを滅[ほろ]ぼすよう勅令[ちょくれい]をお出[だ]しください。わたしは銀[ぎん]一万[いちまん]タラントを王の宝物庫[たからものこ]に納[おさ]める。」"
  10: "王[おう]は自分[じぶん]の手[て]から指輪[ゆびわ]を外[はず]してアマンの手に与[あた]え、ユダヤ人[じん]に対して書[か]かれた文書[ぶんしょ]に印[いん]を押[お]させることにした。"
  11: "王[おう]はアマンに言[い]った。「その銀[ぎん]はあなたのものにせよ。その民族[みんぞく]には、あなたの好[この]むままにせよ。」"
  12: "第一[だいいち]の月[つき]の十三日[じゅうさんにち]、王[おう]の書記[しょき]たちが呼[よ]ばれ、アマンが命[めい]じたとおりに、インドからエチオピアに至[いた]るまでの百二十七[ひゃくにじゅうなな]の地方[ちほう]の太守[たいしゅ]たちと長[おさ]たちに、また各民族[みんぞく]の長たちに、それぞれの言葉[ことば]に従[したが]って、アルタシャスタ王の名[な]によって書[か]いた。"
  13: "そして、書簡[しょかん]を運[はこ]ぶ者[もの]たちによって、アルタシャスタの王国[おうこく]に、ユダヤ人[じん]の一族[いちぞく]を、アダルという第十二[だいじゅうに]の月[つき]の一日[いちにち]に滅[ほろ]ぼし、彼[かれ]らの財産[ざいさん]を奪[うば]い取[と]るために送[おく]り出[だ]された。その書簡の写[うつ]しは次[つぎ]のとおりである。「大王[だいおう]アルタシャスタは、インドからエチオピアに至[いた]るまでの百二十七[ひゃくにじゅうなな]の地方[ちほう]の長[おさ]たち、およびその下[した]に服[ふく]する太守[たいしゅ]たちに、次のように書[か]く。わたしは多[おお]くの国民を治[おさ]め、全世界[ぜんせかい]を支配[しはい]するに至ったが、権力[けんりょく]の傲慢[ごうまん]によって高[たか]ぶることなく、むしろいつも寛大[かんだい]と柔和[にゅうわ]をもって事[こと]を進[すす]め、服属[ふくぞく]する者たちの生活[せいかつ]をいつも波[なみ]立[だ]たないものとし、王国を穏[おだ]やかで果[は]てまで歩[あゆ]み行[ゆ]けるものとし、すべての人[ひと]が願[ねが]う平和[へいわ]を新[あら]たにしたいと願った。そこで、これをいかにして成[な]し遂[と]げるかを顧問[こもん]たちに尋[たず]ねたところ、わたしたちの間[あいだ]で思慮[しりょ]にすぐれ、善意[ぜんい]において変[か]わることなく、固[かた]い忠実[ちゅうじつ]を示[しめ]し、王国の第二[だいに]の栄誉[えいよ]を受[う]けているアマンが、わたしに次のことを示した。すなわち、全世界のすべての部族[ぶぞく]の間に、敵意[てきい]ある一[ひと]つの民族[みんぞく]が混[ま]じり込[こ]んでおり、その掟[おきて]はほかのすべての国民に反[はん]し、王たちの勅令[ちょくれい]をいつも無視[むし]して、わたしたちが非[ひ]のないものとして治めている共同[きょうどう]の統治[とうち]を成り立たせないようにしている、と。そこでわたしは、この民族だけがいつもすべての人に逆[さから]って立ち、掟の慣[なら]わしを異[こと]なったものに変え、わたしたちの事柄[ことがら]に悪意[あくい]を抱[いだ]いて最[もっと]も悪[わる]い災[わざわ]いを成し遂げ、王国が安定[あんてい]を得[え]ないようにしていることを悟[さと]ったので、わたしたちの事柄を司[つかさど]り、わたしたちの第二の父[ちち]とされたアマンが記[しる]した文書[ぶんしょ]にあなたがたに示されている者たちを、妻[つま]と子[こ]どもとともに、今年[ことし]の第十二の月アダルの十四日[じゅうよっか]に、敵[てき]の剣[つるぎ]によって、いささかの哀[あわ]れみも容赦[ようしゃ]もなく根[ね]こそぎ滅ぼすよう命[めい]じた。そうすれば、以前[いぜん]も今[いま]も敵意を抱く者たちが一日のうちに力[ちから]ずくでよみに下[くだ]り、その後[のち]の時代[じだい]には、わたしたちの事柄を終[お]わりまで安定した乱[みだ]れのないものとするであろう。」"
  14: "書簡[しょかん]の写[うつ]しは地方[ちほう]ごとに送[おく]られ、すべての国民[こくみん]に、この日[ひ]に備[そな]えるよう命[めい]じられた。"
  15: "この事[こと]は急[いそ]がれ、スサにも及[およ]んだ。王[おう]とアマンは酒宴[しゅえん]にふけっていたが、都[みやこ]スサは騒[さわ]い立[た]っていた。"

notes:
  1: "ἐδόξασεν — «прославил, почтил» (δοξάζω); Αμαν Αμαδαθου Βουγαῖον — «Амана, [сына] Амадата, Бугайца»; Βουγαῖος — прозвище, в евр. тексте «агагитянин» (в корпусе アガグ); ἐπρωτοβάθρει — «сидел на первом месте» (πρωτοβαθρέω); τῶν φίλων — «друзей», т. е. придворных."
  2: "προσεκύνουν — «падали ниц, поклонялись» (προσκυνέω); οὕτως γὰρ προσέταξεν — «так повелел» (προστάσσω); οὐ προσεκύνει — имперфект: «не поклонялся» постоянно. Отказ Мардохея не смягчён; причина названа в 3:4."
  3: "παρακούεις — «ослушиваешься» (παρακούω с родительным); τὰ ὑπὸ τοῦ βασιλέως λεγόμενα — «то, что говорится царём». Вопрос придворных — 「…」."
  4: "καθ᾽ ἑκάστην ἡμέραν — «каждый день»; οὐχ ὑπήκουεν — «не слушался» (ὑπακούω); ὑπέδειξαν — «донесли, показали» (ὑποδείκνυμι); ἀντιτασσόμενον — «противящегося» (ἀντιτάσσομαι); ὅτι Ιουδαῖός ἐστιν — «что он иудей»: это и есть объяснение отказа. ru добавляет «чтобы посмотреть, устоит ли в слове своем» — в LXX нет."
  5: "ἐπιγνοὺς — «узнав» (ἐπιγινώσκω); ἐθυμώθη σφόδρα — «воспылал гневом весьма» (θυμόω). В греч. стих без точки — продолжается в 3:6."
  6: "ἐβουλεύσατο — «замыслил» (βουλεύομαι); ἀφανίσαι — «истребить, сделать невидимым» (ἀφανίζω); πάντας τοὺς ὑπὸ τὴν Ἀρταξέρξου βασιλείαν Ιουδαίους — «всех иудеев под властью Артаксеркса». ru добавляет мотив «показалось ничтожным…» — в LXX нет."
  7: "ἐποίησεν ψήφισμα — «сделал постановление» (ψήφισμα; слав. «совет»); ἔβαλεν κλήρους — «бросал жребии» (κλῆρος — くじ); ἡμέραν ἐξ ἡμέρας καὶ μῆνα ἐκ μηνός — «день за днём и месяц за месяцем»; ἔπεσεν ὁ κλῆρος εἰς τὴν τεσσαρεσκαιδεκάτην — «жребий пал на четырнадцатый [день]». ru (МТ) добавляет «в первый месяц, Нисан» — в LXX/csl нет."
  8: "ὑπάρχει ἔθνος — «есть народ» (ὑπάρχω); διεσπαρμένον ἐν τοῖς ἔθνεσιν — «рассеянный среди народов» (διασπείρω); οἱ νόμοι αὐτῶν ἔξαλλοι — «законы их чужды, странны» (ἔξαλλος); παρακούουσιν — «не слушают»; οὐ συμφέρει — «не полезно» (συμφέρω). Речь Амана — 「…」, продолжается в 3:9."
  9: "εἰ δοκεῖ τῷ βασιλεῖ — «если угодно царю»; δογματισάτω — импер. «да будет постановлено» (δογματίζω); διαγράψω — «запишу, переведу [в казну]» (διαγράφω); γαζοφυλάκιον — 宝物庫; ἀργυρίου τάλαντα μύρια — «десять тысяч талантов серебра». Здесь закрывается речь, начатая в 3:8; ответ царя — 3:11."
  10: "περιελόμενος — «сняв» (περιαιρέω); δακτύλιος — «перстень»; σφραγίσαι — «запечатать» (σφραγίζω); κατὰ τῶν γεγραμμένων κατὰ τῶν Ιουδαίων — «написанное против иудеев». Слав. добавляет «с руки своея» — в LXX нет, внесено без скобок."
  11: "τὸ μὲν ἀργύριον ἔχε — «серебро держи [у себя]» (ἔχω); τῷ δὲ ἔθνει χρῶ ὡς βούλει — «с народом поступай, как хочешь» (χράομαι с дативом; βούλομαι). Речь царя — 「…」."
  12: "ἐκλήθησαν οἱ γραμματεῖς — «призваны писцы» (γραμματεύς — 書記); μηνὶ πρώτῳ τῇ τρισκαιδεκάτῃ — «в первый месяц, в тринадцатый день»; στρατηγοῖς — «воеводам» (στρατηγός); ἄρχουσιν — «начальникам»; ἀπὸ Ἰνδικῆς ἕως τῆς Αἰθιοπίας — «от Индии до Эфиопии»; ἑκατὸν εἴκοσι ἑπτὰ χώραις — «ста двадцати семи областям»; κατὰ τὴν αὐτῶν λέξιν — «по их наречию» (λέξις); δι᾽ Ἀρταξέρξου — «от имени Артаксеркса»."
  13: "Стих = основной LXX 3:13 + Добавление B (письмо царя, подстихи 13a–13g Rahlfs); всё переведено внутри ст. 13, подстихи не выводятся. Основной текст: ἀπεστάλη διὰ βιβλιαφόρων — «послано через письмоносцев» (βιβλιαφόρος); ἀφανίσαι — «истребить» (ἀφανίζω); διαρπάσαι τὰ ὑπάρχοντα — «разграбить имущество» (διαρπάζω). 13a — надпись: τῆς ἐπιστολῆς τὸ ἀντίγραφον — «список письма»; τοπάρχαις — «топархам, областеначальникам». 13b — преамбула: θράσει τῆς ἐξουσίας — «дерзостью власти» (θράσος); ἐπιεικέστερον — «кротче» (ἐπιεικής); ἠπιότης — «мягкость»; ἀκυμάτους — «безволненными» (ἀκύματος; слав. «безмятежно»); πορευτήν — «проходимым» (πορευτός); слав. «безмолвно» вместо ἥμερον «кротко». 13c — Аман: σωφροσύνῃ — «рассудительностью»; ἀπαραλλάκτως — «неизменно»; γέρας — «честь, награда»; слав. «вторую честь по цари» — иное понимание δεύτερον τῶν βασιλειῶν. 13d–13e — обвинение: δυσμενῆ — «враждебный» (δυσμενής); παραπέμποντας — «пренебрегающих» (παραπέμπω); συναρχία — «совместное правление»; ἀντιπαραγωγῇ — «противостоянии»; ξενίζουσαν — «чуждую» (ξενίζω). 13f — приказ: σημαινομένους — «обозначенных» (σημαίνω); ὁλορριζεί — «с корнем»; οἴκτου — «жалости» (οἶκτος); φειδοῦς — «пощады» (φειδώ); 14-й день Адара. 13g — цель: βιαίως — «насильственно» (слав. «горько»); ᾅδην — よみ; ἀτάραχα — «невозмутимо»; слав. «житие… проходити» вместо τὰ πράγματα «дела» — в тексте по LXX. Письмо оформлено 「…」, вложенной речи в нём нет; ориентир — греческий текст (csl тоже вбирает письмо)."
  14: "ἀντίγραφα τῶν ἐπιστολῶν — «списки писем»; ἐξετίθετο κατὰ χώραν — «выставлялись по областям» (ἐκτίθημι); προσετάγη — «было повелено» (προστάσσω); ἑτοίμους εἶναι — «быть готовыми» (ἕτοιμος). Слав. «посылахуся» (посылались) — иное понимание ἐξετίθετο; в тексте csl; в LXX — «выставлялись, обнародовались»."
  15: "ἐσπεύδετο τὸ πρᾶγμα — «дело ускорялось» (σπεύδω); ἐκωθωνίζοντο — «пировали» (κωθωνίζομαι); ἐταράσσετο — «был в смятении» (ταράσσω). Слав. добавляет в скобках «сусы» — в LXX нет, внесено без скобок."
