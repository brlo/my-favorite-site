# jp-box, Есфирь, глава 3. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для Есфири нет; jp-ni (под авторским правом) не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 3: возвышение Амана и отказ Мардохея поклониться (1–6), жребий и указ (7–12),
# указ об истреблении и письмо царя (13 = основной ст. 13 + Добавление B), рассылка
# (14–15). Прямая речь — речь Амана 3:8–3:9 (одна цитата), ответ царя 3:11, письмо
# царя в 3:13; красного и синего нет.
# Нумерация по gr: 15 стихов; деление совпадает с csl-ru.
# Особенность модуля: в ст. 13 влито Добавление B (письмо царя, подстихи 13a–13g
# Rahlfs); переведено внутри ст. 13, подстихи не выводятся, скобки Rahlfs не идут
# в текст. csl 3:13 тоже вбирает всё письмо; ориентир — греческий текст.
# Слав. добавления внесены в основной текст без скобок по паритету: 3:2 «цареве»,
# 3:10 «с руки своея», 3:15 «сусы». В 3:14 csl «посылахуся» (посылались) — в тексте
# csl, LXX ἐξετίθετο «выставлялись» — в notes.
# 〔…〕 нет: все 15 стихов есть в gr-lxx-byz. Сносок ⟨…⟩ нет: 宦官, 太守, 勅令,
# 書簡, 印, タラント, 宝物庫 — по брифу сносок в книге нет.
# Имена — транслитерация греческого (LXX): アルタシャスタ, アマン, アマダト,
# モルデカイ, エステル, アミナダブ, スサ, アダル. Βουγαῖος — ブガイ人 (в notes:
# евр. «агагитянин», в корпусе アガグ).

