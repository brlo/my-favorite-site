# jp-box, Деяния апостолов, глава 6. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 6: ропот еллинистов и поставление семи (1–7), Стефан перед синедрионом (8–15).
# Красного в главе нет. 〔…〕 в главе нет: 6:8 — замена (χάριτος → πίστεως), дана
# в церковной форме без скобок, как принято для замен (ср. Ин 1:18).
# Сноска: 給食 (6:1) — первое место о служении семи, будущих диаконов.
# jp-ni не использовался.

tr_code: jp-box
book: act
chapter: 6
draft: true

verses:
  1: "そのころ、弟子[でし]の数[かず]が増[ふ]えるにつれて、ギリシア語[ご]を話[はな]すユダヤ人[じん]たちが、ヘブライ語[ご]を話[はな]すユダヤ人[じん]たちに対[たい]して不満[ふまん]を言[い]い始[はじ]めた。毎日[まいにち]の給食[きゅうしょく]⟨食[た]べ物[もの]を配[くば]る奉仕[ほうし]。のちに執事[しつじ]の務[つと]めと呼[よ]ばれる。⟩で、彼[かれ]らのやもめたちが軽[かろ]んじられていたからである。"
  2: "そこで、十二人[じゅうににん]は弟子[でし]たちを大勢[おおぜい]集[あつ]めて言[い]った。「わたしたちが神[かみ]の言葉[ことば]を放[はな]ちやって、食卓[しょくたく]の給仕[きゅうじ]をするのは、ふさわしくない。"
  3: "兄弟[きょうだい]たちよ、あなたがたの中[なか]から、評判[ひょうばん]のよい人[ひと]、{聖霊[せいれい]|聖神[せいしん]}と知恵[ちえ]とに満[み]ちた人[ひと]を七人[しちにん]選[えら]びなさい。わたしたちはその務[つと]めに彼[かれ]らを当[あ]たらせよう。"
  4: "わたしたちは祈[いの]りと言葉[ことば]の奉仕[ほうし]に専念[せんねん]する。」"
  5: "この提案[ていあん]は、集[あつ]まった人[ひと]すべてに喜[よろこ]ばれた。そこで彼[かれ]らは、信[しん]じる心[こころ]と{聖霊[せいれい]|聖神[せいしん]}とに満[み]ちた人[ひと]ステファノ、そしてピリポ、プロコロ、ニカノル、ティモン、パルメナ、およびアンティオキアの改宗者[かいしゅうしゃ]ニコラオを選[えら]んだ。"
  6: "彼[かれ]らを使徒[しと]たちの前[まえ]に立[た]たせ、使徒[しと]たちは祈[いの]ってから、彼[かれ]らの上[うえ]に手[て]を置[お]いた。"
  7: "こうして神[かみ]の言葉[ことば]はますます広[ひろ]がり、エルサレムで弟子[でし]の数[かず]は非常[ひじょう]に多[おお]く増[ふ]えた。祭司[さいし]たちも大勢[おおぜい]、信仰[しんこう]に従[したが]うようになった。"
  8: "信[しん]と力[ちから]とに満[み]ちたステファノは、民[たみ]の中[なか]で大[おお]きな奇跡[きせき]としるしを行[おこな]った。"
  9: "ところが、いわゆるリベルティノイの会堂[かいどう]、またキレネ人[じん]、アレクサンドリア人[じん]、キリキアとアシア出身[しゅっしん]の人々[ひとびと]の会堂[かいどう]から、何人[なんにん]かが立[た]ち上[あ]がってステファノと論争[ろんそう]した。"
  10: "しかし、彼[かれ]らは、ステファノの知恵[ちえ]と、彼[かれ]が語[かた]るときの霊[れい]とに、逆[さか]らうことができなかった。"
  11: "そこで彼[かれ]らは、ある者[もの]たちをそそのかして、「わたしたちは、あの人[ひと]がモーセと神[かみ]をののしる言葉[ことば]を語[かた]るのを聞[き]いた」と言[い]わせた。"
  12: "そして、民[たみ]、長老[ちょうろう]たち、律法学者[りっぽうがくしゃ]たちを扇動[せんどう]し、押[お]しかかって彼[かれ]を捕[と]らえ、最高法院[さいこうほういん]に引[ひ]きたてた。"
  13: "そして、偽[いつわ]りの証人[しょうにん]たちを立[た]てて、「この人[ひと]は、この聖[せい]なる所[ところ]と律法[りっぽう]に逆[さから]う言葉[ことば]を語[かた]るのをやめません。"
  14: "わたしたちは、彼[かれ]が『あのナザレ人[びと]イエスがこの所[ところ]を壊[こわ]し、モーセがわたしたちに伝[つた]えた慣習[かんしゅう]を変[か]える』と言[い]うのを聞[き]きました」と言[い]った。"
  15: "最高法院[さいこうほういん]に座[すわ]っていた者[もの]たちは皆[みな]、ステファノに目[め]を注[そそ]いで、その顔[かお]が天使[てんし]の顔[かお]のようであるのを見[み]た。"

notes:
  1: "Ἑλληνισταί / Ἑβραῖοι — «еллинисты» и «евреи», то есть говорящие по-гречески и по-еврейски; ギリシア語を話すユダヤ人 / ヘブライ語を話すユダヤ人 (у jp-joc エリニスト / エウレイ人). διακονία καθημερινή — ежедневное служение; 給食. Сноска на 給食 — первое место о служении семи; слово 執事 в Деяниях не встречается, поэтому оно только в сноске."
  2: "τραπέζαις διακονεῖν — «служить столам»; 食卓の給仕."
  3: "καταστήσομεν ἐπὶ τῆς χρείας ταύτης — «поставим на эту нужду»; その務めに当たらせよう."
  5: "προσήλυτος Ἀντιοχεύς — «прозелит, обращённый из язычников, антиохиец»; アンティオキアの改宗者."
  6: "ἐπέθηκαν αὐτοῖς τὰς χεῖρας — 手を置いた, поставление."
  8: "В критической базе χάριτος καὶ δυνάμεως («благодати и силы»); Церковь (Елизаветинская «исполнь веры и силы», jp-joc 信と能) читает πίστεως — 信と力, без 〔〕: замена, а не добавка (ср. Ин 1:18)."
  9: "Λιβερτῖνοι — リベルティノイ, вольноотпущенники; оставлено транслитерацией, как у jp-joc."
  10: "τῷ πνεύματι ᾧ ἐλάλει — «Духу, Которым он говорил»; 彼が語るときの霊."
  13: "В критической базе τοῦ ἁγίου [τούτου] — слово стоит в квадратных скобках, то есть в базе есть, поэтому 〔〕 не ставится."
  14: "ὁ Ναζωραῖος — ナザレ人; ἔθη — 慣習."
