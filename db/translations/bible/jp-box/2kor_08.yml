verses:
  1: "兄弟[きょうだい]たちよ、わたしたちは、マケドニアの諸教会[しょきょうかい]に与[あた]えられた神[かみ]の恵[めぐ]みを、あなたがたに知[し]らせたい。"
  2: "彼[かれ]らは大[おお]きな苦難[くなん]の試[こころ]みのうちにありながら、その喜[よろこ]びの溢[あふ]れと、底深[そこぶか]い貧[まず]しさとが、彼[かれ]らの惜[お]しみない心[こころ]の富[とみ]へと溢[あふ]れ出[で]たのである。"
  3: "わたしは証[しょう]しする。彼[かれ]らは力[ちから]の及[およ]ぶかぎり、いや、力[ちから]を超[こ]えて、自[みずか]ら進[すす]んで、"
  4: "聖[せい]なる者[もの]たちへの務[つと]めに与[あずか]る恵[めぐ]みと交[まじ]わりとを、自分[じぶん]たちに与[あた]えてほしいと、わたしたちに熱心[ねっしん]に願[ねが]ったのである。"
  5: "そして、彼[かれ]らは、わたしたちが期待[きたい]したとおりにはせず、むしろ、まず自分[じぶん]自身[じしん]を主[しゅ]に、また神[かみ]の御心[みこころ]によってわたしたちに献[ささ]げたのである。"
  6: "そこで、わたしたちはテトスに、あなたがたの間[あいだ]でこの恵[めぐ]みの業[わざ]を始[はじ]めたように、それを完成[かんせい]するようにと勧[すす]めた。"
  7: "しかし、あなたがたは、信仰[しんこう]、言葉[ことば]、知識[ちしき]、あらゆる熱意[ねつい]、また、あなたがたのわたしたちへの愛[あい]において、すべてのことに富[と]んでいる。そのように、この恵[めぐ]みの業[わざ]においても富[と]むようにしなさい。"
  8: "わたしは命[めい]じて言[い]っているのではなく、ほかの人々[ひとびと]の熱意[ねつい]によって、あなたがたの愛[あい]が本物[ほんもの]であるかどうかを試[ため]しているのである。"
  9: "なぜなら、あなたがたは、わたしたちの主[しゅ]イエス・キリストの恵[めぐ]みを知[し]っているからである。この方[かた]は富[と]んでおられたのに、あなたがたのために貧[まず]しくなられた。それは、あなたがたがこの方[かた]の貧[まず]しさによって富[と]む者[もの]となるためである。"
  10: "わたしはこのことについて意見[いけん]を述[の]べる。これがあなたがたの益[えき]となるからである。あなたがたは、行[おこな]うことだけでなく、願[ねが]うことにおいても、昨年[さくねん]から先[さき]に始[はじ]めていたのである。"
  11: "今[いま]、それを成[な]し遂[と]げなさい。あなたがたが願うことを始めたのと同じように、持[も]っているものに応[おう]じて、それを完成[かんせい]させなさい。"
  12: "なぜなら、もし願[ねが]う心[こころ]があるなら、その人[ひと]は持[も]っているものに応[おう]じて受[う]け入[い]れられ、持っていないものに応じてではないからである。"
  13: "それは、ほかの人々[ひとびと]が楽[らく]になり、あなたがたが苦[くる]しむためではなく、"
  14: "今[いま]の時[とき]、あなたがたの余[あま]りが彼[かれ]らの足[た]りないところを補[おぎな]い、後[のち]には彼[かれ]らの余りがあなたがたの足りないところを補うためである。そうして、釣[つ]り合[あ]いが取[と]れるのである。"
  15: "「多[おお]く集[あつ]めた者[もの]も余[あま]らず、少[すく]なく集めた者[もの]も足[た]りなかった」と書[か]かれているとおりである。"
  16: "神[かみ]に感謝[かんしゃ]する。神は、あなたがたに対する同[おな]じ熱意[ねつい]をテトスの心[こころ]に与[あた]えてくださった。"
  17: "彼[かれ]はわたしたちの勧[すす]めを受[う]け入[い]れ、さらに熱心[ねっしん]であったので、自[みずか]ら進[すす]んであなたがたのところへ出[で]かけたのである。"
  18: "わたしたちは彼[かれ]とともに、兄弟[きょうだい]を一人[ひとり]遣[つか]わした。この兄弟は、福音[ふくいん]によってすべての教会[きょうかい]の間[あいだ]でほめたたえられている者[もの]である。"
  19: "そして、彼[かれ]はそれだけにとどまらず、諸教会[しょきょうかい]によって選[えら]ばれ、わたしたちが果[は]たすこの恵[めぐ]みの業[わざ]に同行[どうこう]する者[もの]となった。それは、主[しゅ]ご自身[じしん]の栄光[えいこう]のため、またあなたがたの熱意[ねつい]のためである。"
  20: "わたしたちは、この豊[ゆたか]な恵[めぐ]みの務[つと]めについて、だれからも非難[ひなん]されないように気[き]をつけている。"
  21: "なぜなら、わたしたちは、主[しゅ]の前[まえ]だけでなく、人[ひと]の前[まえ]にも、善[よ]いことを心[こころ]がけるからである。"
  22: "わたしたちは彼[かれ]らとともに、もう一人[ひとり]の兄弟[きょうだい]を遣[つか]わした。この兄弟は、多[おお]くのことにおいて何度[なんど]も熱心[ねっしん]であることが確[たし]かめられた者[もの]であり、今[いま]はあなたがたへの大[おお]きな信頼[しんらい]によって、さらに熱心になっている。"
  23: "テトスについて言[い]えば、彼[かれ]はわたしの仲間[なかま]であり、あなたがたに対するわたしの同労者[どうろうしゃ]である。わたしたちの兄弟[きょうだい]たちについて言えば、彼[かれ]らは諸教会[しょきょうかい]の使徒[しと]であり、キリストの栄光[えいこう]である。"
  24: "だから、あなたがたの愛[あい]と、わたしたちがあなたがたについて誇[ほこ]っていることの証[あかし]を、諸教会[しょきょうかい]の前[まえ]で彼[かれ]らに示[しめ]しなさい。"

notes:
  1: "χάρις τοῦ θεοῦ — 神の恵み. ἐκκλησίαι τῆς Μακεδονίας — マケドニアの諸教会."
  2: "δοκιμὴ θλίψεως — 苦難の試み. κατὰ βάθους πτωχεία — 底深い貧しさ. ἁπλότης — «простота, щедрость»; 惜しみない心."
  3: "κατὰ δύναμιν… παρὰ δύναμιν — 力の及ぶかぎり、いや、力を超えて. αὐθαίρετοι — 自ら進んで."
  4: "δεόμενοι ἡμῶν — わたしたちに願って. χάρις καὶ κοινωνία τῆς διακονίας — 務めに与る恵みと交わり. Слав. и Синодальный добавляют «принять» (δεξασθαι); следуем базе."
  5: "ἑαυτοὺς ἔδωκαν — 自分自身を献げた. διὰ θελήματος θεοῦ — 神の御心によって."
  6: "προενήρξατο — 始めた. ἐπιτελέσῃ — 完成する. χάρις — 恵みの業 (сбор)."
  7: "В базе ἐξ ἡμῶν ἐν ὑμῖν («наша к вам»); церковный текст (слав., Синодальный, jp-joc) читает ἐξ ὑμῶν ἐν ἡμῖν — あなたがたのわたしたちへの愛. Замена, поэтому без 〔〕."
  8: "κατ᾿ ἐπιταγήν — 命じて. γνήσιον — 本物."
  9: "ἐπτώχευσεν πλούσιος ὤν — 富んでおられたのに貧しくなられた. τῇ ἐκείνου πτωχείᾳ — この方の貧しさによって."
  10: "γνώμη — 意見. ἀπὸ πέρυσι — 昨年から."
  11: "ἐπιτελέσατε — 成し遂げなさい. ἐκ τοῦ ἔχειν — 持っているものに応じて."
  12: "προθυμία — 願う心. εὐπρόσδεκτος — 受け入れられる."
  13: "ἄνεσις — 楽; θλῖψις — 苦しみ. ἰσότης — 釣り合い."
  14: "περίσσευμα — 余り; ὑστέρημα — 足りないところ."
  15: "Исх 16:18. ἐπλεόνασεν — 余る; ἠλαττόνησεν — 足りなくなる."
  16: "σπουδή — 熱意. χάρις τῷ θεῷ — 神に感謝する."
  17: "παράκλησις — 勧め. αὐθαίρετος — 自ら進んで."
  18: "ἔπαινος ἐν τῷ εὐαγγελίῳ — 福音によってほめたたえられている."
  19: "χειροτονηθείς — 選ばれた. συνέκδημος — 同行する者. В базе [αὐτοῦ] есть — 主ご自身の栄光. προθυμίαν ἡμῶν в базе, церковный текст (слав., Синодальный, jp-joc) читает ὑμῶν — あなたがたの熱意 (замена, без 〔〕)."
  20: "στελλόμενοι — 気をつけている. ἁδρότης — 豊かな (о собранном). μωμήσηται — 非難する."
  21: "προνοοῦμεν — 心がける. ἐνώπιον κυρίου… ἀνθρώπων — 主の前…人の前."
  22: "ἐδοκιμάσαμεν — 確かめた. πεποίθησις — 信頼."
  23: "κοινωνός — 仲間; συνεργός — 同労者. ἀπόστολοι ἐκκλησιῶν — 諸教会の使徒. δόξα Χριστοῦ — キリストの栄光."
  24: "ἔνδειξις — 証し. καύχησις — 誇り. εἰς πρόσωπον τῶν ἐκκλησιῶν — 諸教会の前で."
