# jp-box, Второе послание к Коринфянам, глава 8. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в notes.
# Глава 8: щедрость македонян (1–8), обнищание Христа (9), сбор и равенство (10–15),
# Тит и братья (16–24).
# Красного и синего нет: прямой речи Христа в главе нет, <j>/<mo> не ставятся.
# 〔…〕 в главе нет: 8:19 [αὐτοῦ] в базе есть (в квадратных скобках) — не оборачивается.
# Церковные чтения 8:7 (ἐξ ὑμῶν ἐν ἡμῖν — «ваша к нам») и 8:19 (προθυμίαν ὑμῶν) приняты;
# в базе иначе — это замена, не добавка, см. notes.
# Цитата: 8:15 (Исх 16:18) — 「…」. Сносок ⟨…⟩ нет. jp-ni не использовался.

