verses:
  1: "イエスは{聖霊[せいれい]|聖神[せいしん]}に満[み]ちてヨルダン川[がわ]から帰[かえ]り、霊[れい]に導[みちび]かれて荒[あ]れ野[の]へ行[い]かれた。"
  2: "四十日[しじゅうにち]の間[あいだ]、悪魔[あくま]に試[こころ]みを受[う]けられた。その間[あいだ]は何[なに]も食[た]べず、その日々[ひび]が終[お]わると飢[う]えを覚[おぼ]えられた。"
  3: "悪魔[あくま]は言[い]った。「あなたが神[かみ]の子[こ]なら、この石[いし]に命[めい]じて、パンにならせてみなさい。」"
  4: "イエスは答[こた]えて言[い]われた。「<j>人[ひと]はパンだけによって生[い]きるのではなく、〔神[かみ]のすべての言葉[ことば]によって生[い]きる〕と書[か]いてある。</j>」"
  5: "悪魔[あくま]は〔イエスを高[たか]い山[やま]へ連[つ]れて行[い]き、〕一瞬[いっしゅん]のうちに世界[せかい]のすべての国々[くにぐに]をお見[み]せして、"
  6: "言[い]った。「このすべての権威[けんい]と栄光[えいこう]をあなたに与[あた]えよう。それはわたしに委[ゆだ]ねられており、わたしが望[のぞ]む者[もの]に与[あた]えるのだ。"
  7: "だから、あなたがわたしの前[まえ]でひれ伏[ふ]すなら、すべてものであろう。」"
  8: "イエスは答[こた]えて言[い]われた。「<j>〔サタン、わたしの後[うし]ろに退[しりぞ]け。〕『あなたの主[しゅ]である神[かみ]を拝[おが]み、この方[かた]にだけ仕[つか]えよ』と書[か]いてある。</j>」"
  9: "悪魔[あくま]はイエスをエルサレムへ連[つ]れて行[い]き、神殿[しんでん]の屋根[やね]の端[はし]に立[た]たせて言[い]った。「あなたが神[かみ]の子[こ]なら、ここから下[した]へ飛[と]び降[お]りてみなさい。"
  10: "『神[かみ]はあなたのために天使[てんし]たちに命[めい]じて、あなたを守[まも]らせる。』"
  11: "『彼[かれ]らはその手[て]であなたを抱[かか]え上[あ]げ、あなたが石[いし]に足[あし]をぶつけないようにする』と書[か]いてあるからだ。」"
  12: "イエスは答[こた]えて言[い]われた。「<j>『あなたの主[しゅ]である神[かみ]を試[こころ]みてはならない』と言[い]われている。</j>」"
  13: "悪魔[あくま]はあらゆる誘惑[ゆうわく]を尽[つ]くすと、しばらくの間[あいだ]、イエスから離[はな]れた。"
  14: "イエスは霊[れい]の力[ちから]に満[み]ちてガリラヤへ帰[かえ]られた。その評判[ひょうばん]は周辺[しゅうへん]一帯[いったい]に広[ひろ]まった。"
  15: "イエスは彼[かれ]らの会堂[かいどう]で教[おし]え、すべての人[ひと]から讃[たた]えられた。"
  16: "イエスは育[そだ]ったナザレへ行[い]き、いつものように安息日[あんそくび]に会堂[かいどう]へ入[はい]って、書[しょ]を読[よ]むために立[た]たれた。"
  17: "預言者[よげんしゃ]イザヤの書[しょ]が手渡[てわた]されたので、それを開[ひら]くと、次[つぎ]のように書[か]かれている所[ところ]があった。「"
  18: "主[しゅ]の霊[れい]がわたしの上[うえ]にある。それゆえ、主[しゅ]はわたしに油[あぶら]を注[そそ]いで、貧[まず]しい人々[ひとびと]に福音[ふくいん]を告[つ]げ知[し]らせ、〔心[こころ]の傷[いた]む人[ひと]を癒[いや]し、〕わたしを遣[つか]わして、捕[とら]われた者[もの]に釈放[しゃくほう]を、目[め]の見[み]えない者[もの]に目[め]の開[ひら]かれることを告[つ]げ知[し]らせ、"
  19: "押[お]しつぶされた者[もの]を自由[じゆう]の身[み]にして、主[しゅ]の喜[よろこ]ばしい年[とし]を告[つ]げ知[し]らせるために。」"
  20: "イエスは書[しょ]を巻[ま]いて係[かかり]の人[ひと]に返[かえ]し、座[すわ]られた。会堂[かいどう]にいた者[もの]は皆[みな]、イエスに目[め]を注[そそ]いでいた。"
  21: "イエスは彼[かれ]らに話[はな]し始[はじ]められた。「<j>この聖書[せいしょ]の言葉[ことば]は、今日[きょう]、あなたがたの耳[みみ]で実現[じつげん]した。</j>」"
  22: "人々[ひとびと]は皆[みな]イエスを証[しょう]し、その口[くち]から出[で]る恵[めぐ]みの言葉[ことば]に驚[おどろ]いて言[い]った。「この人[ひと]はヨセフの子[こ]ではないか。」"
  23: "「<j>きっとあなたがたは、『医者[いしゃ]よ、自分[じぶん]を癒[いや]せ。カファルナウムで行[おこな]われたと聞[き]いたことを、ここ、故郷[こきょう]でも行[おこな]ってみせよ』というこのたとえを、わたしに引[ひ]き合[あ]いに出すだろう。</j>"
  24: "<j>はっきり言[い]っておく。預言者[よげんしゃ]は故郷[こきょう]では受[う]け入[い]れられない。</j>」"
  25: "「<j>わたしは真実[しんじつ]をあなたがたに言[い]う。エリヤの時代[じだい]、三年[さんねん]六か月[かげつ]の間[あいだ]天[てん]が閉[と]ざされて、国中[くにじゅう]に大[だい]きな飢[き]饉[きん]が起[こ]こったとき、イスラエルには多[おお]くのやもめがいた。</j>"
  26: "<j>だが、エリヤはその誰[だれ]のもとにも遣[つか]わされず、シドンのサレプタにいる一人[ひとり]のやもめのもとへ遣[つか]わされた。</j>"
  27: "<j>また、預言者[よげんしゃ]エリシャの時代[じだい]にも、イスラエルには多[おお]くの重[おも]い皮膚病[ひふびょう]の人[ひと]がいたが、その誰[だれ]も清[きよ]められず、シリアのナアマンだけが清[きよ]められた。</j>」"
  28: "会堂[かいどう]にいた者[もの]は皆[みな]、これを聞[き]いて怒[いか]りに満[み]ちた。"
  29: "そして立[た]ち上[あ]がってイエスを町[まち]の外[そと]へ追[お]い出[だ]し、町[まち]が建[た]てられている山[やま]の崖[がけ]まで連[つ]れて行[い]って、突[つ]き落[お]とそうとした。"
  30: "しかしイエスは、彼[かれ]らの中[なか]を通[とお]り抜[ぬ]けて行[い]かれた。"
  31: "イエスはガリラヤの町[まち]カファルナウムへ下[くだ]り、安息日[あんそくび]ごとに彼[かれ]らを教[おし]えておられた。"
  32: "人々[ひとびと]はその教[おし]えに驚[おどろ]いた。その言葉[ことば]に権威[けんい]があったからである。"
  33: "会堂[かいどう]には、汚[けが]れた悪霊[あくりょう]に憑[つ]かれた人[ひと]がいて、大[おお]きな声[こえ]で叫[さけ]んだ。"
  34: "「ああ、ナザレのイエス。わたしたちとあなたに何[なん]の関[かか]わりがあるのか。わたしたちを滅[ほろ]ぼしに来[き]たのか。あなたが誰[だれ]かは分[わ]かっている。神[かみ]の聖[せい]なる者[もの]だ。」"
  35: "イエスはその霊[れい]をお叱[しか]りになり、「<j>黙[だま]れ。この人[ひと]から出[で]て行[い]け</j>」と言[い]われた。悪霊[あくりょう]はその人[ひと]を人々[ひとびと]の中[なか]へ投[な]げ倒[たお]してから、何[なん]の傷[きず]も負[お]わせずに出[で]て行[い]った。"
  36: "人[ひと]は皆[みな]驚[おどろ]き、互[たが]いに言[い]い合[あ]った。「いったいこれは何[なん]という言葉[ことば]か。権威[けんい]と力[ちから]をもって汚[けが]れた霊[れい]どもに命[めい]じると、確[たし]かに出[で]て行[い]く。」"
  37: "イエスのうわさは、周辺[しゅうへん]の至[いた]るところへ広[ひろ]がって行[い]った。"
  38: "イエスは会堂[かいどう]を出[で]て、シモンの家[いえ]へ入[はい]られた。シモンのしゅうとめが高[たか]い熱[ねつ]を出[だ]して苦[くる]しんでいたので、人々[ひとびと]はそのことでイエスに頼[たの]んだ。"
  39: "イエスはそばに立[た]って熱[ねつ]をお叱[しか]りになると、熱[ねつ]は引[ひ]いた。彼女[かのじょ]はすぐに起[お]きて、彼[かれ]らに仕[つか]えた。"
  40: "日[ひ]が沈[しず]むと、さまざまな病[やまい]に苦[くる]しむ者[もの]を抱[かか]える人々[ひとびと]は皆[みな]、その人[ひと]たちをイエスのもとへ連[つ]れて来[き]た。イエスは一人[ひとり]ひとりに手[て]を置[お]いて、癒[いや]された。"
  41: "悪霊[あくりょう]たちも多[おお]くの人[ひと]から出[で]て、「あなたは神[かみ]の子[こ]だ」と叫[さけ]んだ。イエスは彼[かれ]らをお叱[しか]りになり、口[くち]をきくことをお許[ゆる]しにならなかった。彼[かれ]らがイエスをキリストと知[し]っていたからである。"
  42: "朝[あさ]になると、イエスは出[で]て人気[ひとけ]のない所[ところ]へ行[い]かれた。群衆[ぐんしゅう]はイエスを捜[さが]し回[まわ]り、そばまで来[き]ると、自分[じぶん]たちから離[はな]れないように引[ひ]き止[と]めた。"
  43: "イエスは言[い]われた。「<j>わたしはほかの町々[まちまち]にも神[かみ]の国[くに]の福音[ふくいん]を告[つ]げ知[し]らせなければならない。そのために遣[つか]わされたのだ。</j>」"
  44: "イエスは〔ガリラヤ〕の諸[しょ]会堂[かいどう]を巡[めぐ]って宣[の]べ伝[つた]えられた。"

notes:
  4: "В критической базе только οὐκ ἐπ᾽ ἄρτῳ μόνῳ ζήσεται ὁ ἄνθρωπος; Церковь (Елизаветинская, jp-joc 凡の神の言葉をもてす) добавляет «но всяким словом Божиим» — добавление в 〔〕."
  5: "εἰς ὄρος ὑψηλόν («на высокую гору») есть у Церкви (jp-joc 高き山に登り), в критической базе нет — добавление в 〔〕."
  8: "ὕπαγε ὀπίσω μου, σατανᾶ («отойди от Меня, сатана») — церковное чтение (jp-joc サタナ、我より退け), в критической базе нет — добавление в 〔〕."
  18: "ἰάσασθαι τοὺς συντετριμμένους τὴν καρδίαν («исцелять сокрушённых сердцем») — чтение Церкви из Ис 61:1 (jp-joc 心の傷める者を医し), в критической базе нет — добавление в 〔〕. πνεῦμα κυρίου — 主の霊; у jp-joc опечатка 主の神."
  23: "παραβολή здесь — «пословица, поговорка», а не притча; отсюда たとえ."
  44: "В критической базе τῆς Ἰουδαίας («в синагогах Иудеи»); Церковь (Елизаветинская «по синагогам Галилейским», jp-joc ガリレヤ) читает τῆς Γαλιλαίας — чтение Церкви в 〔〕."
