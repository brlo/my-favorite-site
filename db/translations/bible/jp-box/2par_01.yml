# jp-box, 2-я Паралипоменон, глава 1. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); церковнославянский (csl-ru) — второй
# свидетель церковного текста: слав. чтения и добавки входят в основной текст
# без 〔…〕, вариант LXX — в notes. ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге нет; jp-ni (под авторским правом) не использовался.
# Язык — современный 常体 (речь тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 1: Соломон укрепляется (1), собрание в Гаваоне (2–6), явление Бога
# и просьба о мудрости (7–12), возвращение в Иерусалим (13), богатство
# и конница (14–17), решение строить храм (18).
# Нумерация по gr: 18 стихов. У csl в гл. 1 — 17, а gr 1:18 стоит в csl 2:1
# («И повеле соломон созидати дом...»); поэтому вся гл. 2 сдвинута на стих
# (gr 2:N = csl 2:N+1). Соответствие указано в notes.
# Речь Бога и Соломона — 「…」; красного нет.
# 〔…〕 нет. Слав. добавления внесены в текст: 1:4 «на место, еже уготова
# ему давид», 1:6 «свидения»; расхождения отмечены в notes.
# Сносок ⟨…⟩ нет: 幕屋, 契約の箱, 祭壇, 燔祭, 高き所 уже в корпусе.

tr_code: jp-box
book: 2par
chapter: 1
draft: true

verses:
  1: "ソロモンは自分[じぶん]の王国[おうこく]を強[つよ]めた。主[しゅ]なる彼[かれ]の神[かみ]が彼とともにいて、彼を高[たか]く上[あ]げられた。"
  2: "ソロモンはイスラエル全[ぜん]体[たい]、すなわち千[せん]人[にん]の長[かしら]、百[ひゃく]人[にん]の長、裁[さば]き人[びと]たち、およびイスラエルの前[まえ]にいるすべての長[かしら]、氏族[しぞく]の長[かしら]たちに言[い]った。"
  3: "ソロモンと、彼[かれ]とともにいたすべての会衆[かいしゅう]は、ギブオンにある高[たか]き所[ところ]へ行[い]った。そこには神[かみ]の証[あかし]の幕屋[まくや]があり、それは主[しゅ]のしもべモーセが荒野[こうや]で造[つく]ったものである。"
  4: "しかし、神[かみ]の契約[けいやく]の箱[はこ]は、ダビデがキリアテ・ヤリムの町[まち]から、箱[はこ]のために用意[ようい]した場所[ばしょ]へ上[あ]げた。ダビデがエルサレムにそのための天幕[てんまく]を張[は]っていたからである。"
  5: "また、ウリの子[こ]、フルの子[こ]であるベツァルエルが造[つく]った青銅[せいどう]の祭壇[さいだん]が、主[しゅ]の幕屋[まくや]の前[まえ]にそこにあった。ソロモンと会衆[かいしゅう]はそれを求[もと]めた。"
  6: "ソロモンはそこで、主[しゅ]の前[まえ]にある青銅[せいどう]の祭壇[さいだん]、すなわち幕屋[まくや]にある祭壇の上[うえ]に、千[せん]の燔祭[はんさい]をささげた。"
  7: "その夜[よる]、神[かみ]がソロモンに現[あらわ]れて言[い]われた。「求[もと]めなさい。わたしがあなたに何[なに]を与[あた]えるべきか。」"
  8: "ソロモンは神[かみ]に言[い]った。「あなたは、わたしの父[ちち]ダビデに大[おお]きな慈[いつく]しみを施[ほどこ]し、わたしを彼[かれ]の代[か]わりに王[おう]とされた。"
  9: "今[いま]、主[しゅ]なる神[かみ]よ、あなたの言葉[ことば]が、わたしの父[ちち]ダビデの上[うえ]に確[かた]かなものとなるように。あなたはわたしを、地[ち]の塵[ちり]のような多[おお]くの民[たみ]の上[うえ]に王[おう]とされたのだから。"
  10: "今[いま]、わたしに知恵[ちえ]と分別[ふんべつ]を与[あた]えてほしい。そうすれば、わたしはこの民[たみ]の前[まえ]を出[で]て、また入[はい]ることができる。このあなたの大[おお]きな民を、だれが裁[さば]くことができようか。」"
  11: "神[かみ]はソロモンに言[い]った。「あなたの心[こころ]にこのことがあったので、あなたは富[とみ]や財産[ざいさん]、栄光[えいこう]、また敵[てき]の命[いのち]を求[もと]めず、長[なが]い日々[ひび]も求めず、むしろ、わたしの民[たみ]を裁[さば]くための知恵[ちえ]と分別[ふんべつ]を自分[じぶん]のために求めたので、"
  12: "知恵[ちえ]と分別[ふんべつ]はあなたに与[あた]える。また富[とみ]と財産[ざいさん]と栄光[えいこう]も、あなたの前[まえ]の王[おう]たちの中にあなたに似[に]た者[もの]がなかったほどに、あなたに与[あた]えよう。あなたの後[あと]にも、このようにはならない。」"
  13: "ソロモンは、ギブオンにある高[たか]き所[ところ]から、証[あかし]の幕屋[まくや]の前[まえ]から、エルサレムへ来[き]て、イスラエルを治[おさ]めた。"
  14: "ソロモンは戦車[せんしゃ]と騎兵[きへい]を集[あつ]めた。彼[かれ]には千四百[せんよんひゃく]の戦車と一万二千[いちまんにせん]の騎兵がいた。彼はそれらを戦車[せんしゃ]の町[まち]々[まち]に置[お]き、民[たみ]は王[おう]とともにエルサレムにいた。"
  15: "王[おう]はエルサレムで金[きん]と銀[ぎん]を石[いし]のように、またユダの杉[すぎ]を低地[ていち]のいちじく桑[ぐわ]のように多[おお]くした。"
  16: "ソロモンの馬[うま]はエジプトから連[つ]れて来[こ]られ、王[おう]の商人[しょうにん]たちの値段[ねだん]で取引[とりひき]された。彼[かれ]らは買[か]い付[つ]けて商[あきな]いをした。"
  17: "彼[かれ]らは上[のぼ]って、エジプトから戦車[せんしゃ]一[いち]台[だい]を銀[ぎん]六百[ろっぴゃく]、馬[うま]一頭[いっとう]を百五十[ひゃくごじゅう]で連[つ]れ出[だ]した。同[おな]じようにして、彼らはそれを、すべてのヘト人[じん]の王[おう]たちとシリアの王[おう]たちの手[て]に運[はこ]んだ。"
  18: "ソロモンは、主[しゅ]の名[な]のために家[いえ]を、また自分[じぶん]の王国[おうこく]のために家を建[た]てようと言[い]った。"

notes:
  1: "ἐνίσχυσεν ... ἐπὶ τὴν βασιλείαν αὐτοῦ — «укрепился над царством своим» (ἐνισχύω); ἐμεγάλυνεν αὐτὸν εἰς ὕψος — возвеличил его в высоту (μεγαλύνω). Слав. «укрепися... и возвеличи его в высоту»; добавлено «(бе)» — «был с ним»."
  2: "τοῖς χιλιάρχοις — тысяченачальникам (千人の長); ἑκατοντάρχοις — стоначальникам; κριταῖς — судьям (裁き人); πᾶσιν τοῖς ἄρχουσιν ἐναντίον Ισραηλ — всем начальствующим пред Израилем; τοῖς ἄρχουσι τῶν πατριῶν — начальникам отцов, т. е. родов (氏族の長). В csl последней клаузы нет («и всем началником пред израилем») — внесена по gr."
  3: "τὴν ὑψηλὴν τὴν ἐν Γαβαων — высоту в Гаваоне (高き所; слав. «вышний гаваон»). σκηνὴ τοῦ μαρτυρίου τοῦ θεοῦ — скиния свидетельства Божия (証の幕屋). παῖς κυρίου — раб Господень; в csl «раб Божий» — вариант отмечен."
  4: "κιβωτὸν τοῦ θεοῦ — ковчег Божий; в csl «Кивот Господень» — вариант. ἀνήνεγκεν ... ἐκ πόλεως Καριαθιαριμ — вынес из города Кириафиарима (キリアテ・ヤリム; слав. «кариафиарим»). Слав. добавление «на место, еже уготова ему давид» внесено в текст (用意した場所へ); ὅτι ἡτοίμασεν αὐτῇ σκηνήν — ибо приготовил ему скинию."
  5: "θυσιαστήριον τὸ χαλκοῦν — медный (бронзовый) жертвенник; Βεσελεηλ υἱὸς Ουριου υἱοῦ Ωρ — Веселеил, сын Урии, сына Ора (ベツァルエル; ウリ; フル). ἐξεζήτησεν αὐτό — «взыскал его», обратился к нему (ἐκζητέω); слав. «взыска его... и вся церковь» — 会衆."
  6: "ἀνήνεγκεν ... ὁλοκαύτωσιν χιλίαν — вознёс тысячу всесожжений (燔祭). Слав. добавляет «свидения» (в скинии свидения) — внесено как 幕屋; в gr только ἡ σκηνή."
  7: "ὤφθη ὁ θεὸς τῷ Σαλωμων — явился Бог Соломону; в csl «явися Господь» — вариант. Αἴτησαι τί σοι δῶ — «проси, что тебе дать» (αἰτέω; δῶ — аорист от δίδωμι). Слав. добавление «(что хощеши)» — пояснение переводчика, в текст не внесено."
  8: "ἐποίησας ... ἔλεος μέγα — сотворил великую милость (ἔλεος); ἐβασίλευσάς με ἀντ᾽ αὐτοῦ — воцарил меня вместо него. Слав. «поставил мя еси царя вместо его»."
  9: "πιστωθήτω τὸ ὄνομά σου ἐπὶ Δαυιδ — «да будет верно имя Твоё над Давидом» (πιστόω — утверждать); в csl «да исполнится слово твое к давиду» — «слово» вместо «имя»; чтение csl принято в тексте, LXX-вариант отмечен. ὡς ὁ χοῦς τῆς γῆς — как прах земной (χοῦς)."
  10: "σοφίαν καὶ σύνεσιν — премудрость и разум (知恵と分別); ἐξελεύσομαι ... καὶ εἰσελεύσομαι — «выйду и войду», т. е. буду предводительствовать (слав. «да вниду и изыду»); τίς κρινεῖ — кто будет судить (裁く)."
  11: "Ἀνθ᾽ ὧν — «за то, что» (слав. «понеже»); πλοῦτον χρημάτων — богатство имений (富と財産); τὴν ψυχὴν τῶν ὑπεναντίων — душу противящихся, т. е. жизнь врагов (敵の命); ἡμέρας πολλάς — многие дни, долгую жизнь; ἐφ᾽ ὃν ἐβασίλευσά σε ἐπ᾽ αὐτόν — «над которым Я воцарил тебя» (плеоназм gr)."
  12: "δίδωμι ... δώσω — даю / дам; ὡς οὐκ ἐγενήθη ὅμοιός σοι ἐν τοῖς βασιλεῦσι τοῖς ἔμπροσθέν σου — как не было подобного тебе у царей прежде тебя; μετὰ σὲ οὐκ ἔσται οὕτως — после тебя не будет так."
  13: "ἐκ βαμα τῆς ἐν Γαβαων — с высоты, что в Гаваоне (βαμα — высота, 高き所); ἀπὸ προσώπου σκηνῆς μαρτυρίου — от лица скинии свидетельства, т. е. от скинии; ἐβασίλευσεν ἐπὶ Ισραηλ — царствовал над Израилем. В csl «пред скинию свидения» — предлог иной."
  14: "συνήγαγεν ἅρματα καὶ ἱππεῖς — собрал колесницы и всадников (戦車と騎兵); χίλια καὶ τετρακόσια ἅρματα — 1400 колесниц; δώδεκα χιλιάδες ἱππέων — 12 000 всадников; κατέλιπεν αὐτὰ ἐν πόλεσιν τῶν ἁρμάτων — оставил их в городах колесниц."
  15: "ἔθηκεν ... τὸ χρυσίον καὶ τὸ ἀργύριον ... ὡς λίθους — сделал золото и серебро как камни; κέδρους ... ὡς συκαμίνους τὰς ἐν τῇ πεδινῇ — кедры как сикоморы в низменности (いちじく桑); εἰς πλῆθος — во множестве."
  16: "ἡ ἔξοδος τῶν ἵππων τῶν Σαλωμων ἐξ Αἰγύπτου — «выход коней Соломона из Египта», т. е. их вывоз/привод; ἡ τιμὴ τῶν ἐμπόρων τοῦ βασιλέως — цена царских торговцев; ἐμπορεύεσθαι ἠγόραζον — «торговать покупали» (испорченный gr; слав. «иже хождаху и куповаху»). В ru/МТ добавлена «Кува» (Кеве) — в gr её нет."
  17: "ἀνέβαινον καὶ ἐξῆγον — восходили и выводили; ἅρμα ἓν ἑξακοσίων ἀργυρίου — колесница за 600 серебра; ἵππον ἑκατὸν καὶ πεντήκοντα — конь за 150; ἐν χερσὶν αὐτῶν ἔφερον — «в руках их приносили», через их руки; Χετταῖοι — хеттеи (ヘト人)."
  18: "εἶπεν ... τοῦ οἰκοδομῆσαι — сказал построить (слав. «повеле созидати»); οἶκον τῷ ὀνόματι κυρίου — дом имени Господню; οἶκον τῇ βασιλείᾳ αὐτοῦ — дом царству своему, т. е. дворец. В csl это 2:1, поэтому вся гл. 2 сдвинута на один стих."
