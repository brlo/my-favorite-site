# jp-box, 2-я Паралипоменон, глава 19. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); церковнославянский (csl-ru) — второй
# свидетель церковного текста (новый паритет, docs/japanese-bible.md):
# слав. чтения входят в основной текст без 〔…〕, вариант LXX — в notes.
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет;
# jp-ni (под авторским правом) не использовался.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление
# на клаузы — по греческому.
# Глава 19: возвращение Иосафата (1), обличение пророка Иуя (2–3),
# объезд народа и судьи по городам (4–7), суд в Иерусалиме и наставление
# судьям (8–11).
# Нумерация по gr: 11 стихов, совпадает с csl и ru.
# Речь — 「…」: Иуй (2), Иосафат к судьям (6–7, 9–11).
# Красного нет.
# 〔…〕 нет: текст всех стихов есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 預言者, 裁[さば]き人[びと], 祭司, レビ人, 賄賂[わいろ],
# 嗣業[しぎょう], アシェラ уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: 2par
chapter: 19
draft: true

verses:
  1: "ユダの王[おう]ヨシャファトは何事[なにごと]もなく、エルサレムの自分[じぶん]の家[いえ]へ帰[かえ]った。"
  2: "ハナニの子[こ]である預言者[よげんしゃ]イエフが彼[かれ]を迎[むか]えに出[で]て言[い]った。「ヨシャファト王[おう]よ、あなたは悪[わる]い者[もの]を助[たす]け、主[しゅ]に憎[にく]まれる者[もの]と親[した]しくしているのか。」イエフは彼[かれ]に言[い]った。「それゆえ、主[しゅ]からの怒[いか]りがあなたの上[うえ]に臨[のぞ]んだ。"
  3: "しかし、あなたのうちに良[よ]いことが見[み]いだされた。あなたがユダの地[ち]からアシェラの木立[こだち]を取[と]り除[のぞ]き、主[しゅ]を求[もと]めるために心[こころ]を定[さだ]めたからである。」"
  4: "ヨシャファトはエルサレムに住[す]み、再[ふたた]び民[たみ]の間[あいだ]へ出[で]て行[い]き、ベエル・シェバからエフライムの山[やま]まで巡[めぐ]って、彼[かれ]らを父[ちち]たちの神[かみ]である主[しゅ]のもとへ立[た]ち返[かえ]らせた。"
  5: "彼[かれ]はユダのすべての堅[かた]い町[まち]に、町[まち]ごとに裁[さば]き人[びと]を置[お]いた。"
  6: "彼[かれ]は裁[さば]き人[びと]たちに言[い]った。「あなたがたは何[なに]をしているか、よく見[み]なさい。あなたがたが行[おこな]うのは人[ひと]の裁[さば]きではなく、主[しゅ]の裁[さば]きである。裁[さば]きの言葉[ことば]はあなたがたとともにある。"
  7: "そして今[いま]、主[しゅ]への恐[おそ]れがあなたがたの上[うえ]にあるように。そして、守[まも]って行[おこな]いなさい。われらの神[かみ]である主[しゅ]には不義[ふぎ]もなく、人[ひと]の顔色[かおいろ]を見[み]ることも、賄賂[わいろ]を取[と]ることもないからである。」"
  8: "また、ヨシャファトはエルサレムに、祭司[さいし]とレビ人[びと]、イスラエルの氏族[しぞく]の長[ちょう]たちを、主[しゅ]の裁[さば]きと、エルサレムに住[す]む者[もの]たちを裁[さば]くために置[お]いた。"
  9: "彼[かれ]は彼[かれ]らに命[めい]じて言[い]った。「あなたがたは主[しゅ]への恐[おそ]れをもって、真実[しんじつ]と、全[まった]き心[こころ]とをもって、こう行[おこな]いなさい。"
  10: "あなたがたの兄弟[きょうだい]たち、すなわち自分[じぶん]の町々[まちまち]に住[す]む者[もの]たちから、あなたがたのもとへ持[も]ち込[こ]まれるすべての争[あらそ]い、血[ち]と血[ち]の間[あいだ]のこと、定[さだ]めと戒[いまし]め、掟[おきて]と裁[さば]きのことについては、彼[かれ]らに教[おし]えなさい。そうすれば、彼[かれ]らは主[しゅ]に罪[つみ]を犯[おか]さない。あなたがたの上[うえ]にも、兄弟[きょうだい]たちの上[うえ]にも怒[いか]りが臨[のぞ]まない。そうすれば、あなたがたは罪[つみ]を犯[おか]さない。"
  11: "見[み]よ、祭司[さいし]アマリヤは主[しゅ]のすべての事[こと]についてあなたがたの上[うえ]に立[た]つ者[もの]、イシュマエルの子[こ]ゼバデヤは王[おう]のすべての事[こと]についてユダの家[いえ]に立[た]つ者[もの]である。書記[しょき]たちとレビ人[びと]もあなたがたの前[まえ]にいる。強[つよ]くあって行[おこな]いなさい。そうすれば、主[しゅ]は良[よ]い者[もの]とともにいる。」"

notes:
  1: "ἀπέστρεψεν — возвратился (ἀποστρέφω; слав. «возвратися»). ἐν εἰρήνῃ — с миром, невредимо (何事もなく). εἰς τὸν οἶκον αὐτοῦ — в дом свой."
  2: "Ἰου ὁ τοῦ Ἀνανι — Иуй, сын Анании (イエフ、ハナニの子; слав. «ииуй сын ананиин»). προφήτης — пророк (預言者[よげんしゃ]; в ru «прозорливец»). εἰ ἁμαρτωλῷ βοηθεῖς — «нечестивому ли помогаешь». μισουμένῳ ὑπὸ κυρίου — ненавидимому Господом. φιλιάζεις — «дружишь, любишь» (φιλιάζω). ὀργὴ παρὰ κυρίου — гнев от Господа. Слав. повторяет ввод «И рече ему ииуй» перед вторым вопросом; в гр одно предложение — повтор внесён по паритету."
  3: "ἀλλ᾿ ἤ — «впрочем, лишь». ηὑρέθησαν — нашлись (εὐρίσκω). ἐξῆρας — удалил (ἐξαίρω; слав. «отял еси кумиры» — идолов). ἄλση — священные рощи Ашеры (アシェラの木立[こだち]). κατηύθυνας τὴν καρδίαν — направил, расположил сердце (κατευθύνω). ἐκζητῆσαι — взыскать."
  4: "κατῴκησεν — поселился, жил (κατοικέω). πάλιν — снова. ἀπὸ Βηρσαβεε ἕως ὄρους Εφραιμ — от Вирсавии до горы Ефремовой (ベエル・シェバ, エフライムの山[やま]). ἐπέστρεψεν — обратил (ἐπιστρέφω): объезжал и возвращал народ к Господу."
  5: "κατέστησεν — поставил (καθίστημι). κριτάς — судей (裁[さば]き人[びと]). ἐν πόλει καὶ πόλει — «в городе и городе», т.е. в каждом городе (повтор по-еврейски, слав. «во всяцем граде»)."
  6: "Ἴδετε — «смотрите» (ὁράω). οὐκ ἀνθρώπῳ ... κρίνετε, ἀλλ᾿ ἢ τῷ κυρίῳ — «не человеку вы судите, но Господу» (слав. «не человеческий бо вы суд творите, но Господень»), отсюда 人[ひと]の裁[さば]きではなく、主[しゅ]の裁[さば]き. ἀλλ᾿ ἢ τῷ κυρίῳ — но Господу. μεθ᾿ ὑμῶν λόγοι τῆς κρίσεως — «с вами слова суда», т.е. суд совершается при вас."
  7: "γενέσθω — да будет (императив). φυλάσσετε καὶ ποιήσετε — «храните и делайте». ἀδικία — неправда (不義[ふぎ]). θαυμάσαι πρόσωπον — «дивиться лицу», т.е. лицеприятствовать (顔色[かおいろ]を見[み]る). λαβεῖν δῶρα — принимать дары, мзду (賄賂[わいろ])."
  8: "πατριάρχαι — главы отцов, родов (氏族[しぞく]の長[ちょう]; слав. «отценачалники»). εἰς κρίσιν κυρίου — для суда Господня. κρίνειν τοὺς κατοικοῦντας — судить жителей. В ru добавлено «И возвратились в Иерусалим» — в гр и слав. этого нет."
  9: "ἐνετείλατο — заповедал (ἐντέλλομαι). ἐν ἀληθείᾳ — в истине (真実[しんじつ]). ἐν πλήρει καρδίᾳ — всем полным сердцем (全[まった]き心[こころ]; слав. «сердцем совершенным»). Речь продолжается в ст. 10–11."
  10: "κρίσιν τὴν ἐλθοῦσαν ἐφ᾿ ὑμᾶς — «суд [дело], приходящий на вас», т.е. спорное дело (слав. «всякую распрю»). ἀνὰ μέσον αἵματος αἷμα — «между кровью кровь», т.е. о кровопролитии. πρόσταγμα — повеление (定[さだ]め); ἐντολή — заповедь (戒[いまし]め); δικαίωμα — устав, оправдание (掟[おきて]); κρίμα — суд, решение (裁[さば]き). διαστελεῖσθε αὐτοῖς — «различите, разъясните им» (διαστελλόμαι; слав. «разсудите им»). οὐχ ἁμαρτήσονται τῷ κυρίῳ — не согрешат Господу."
  11: "ἡγούμενος ἐφ᾿ ὑμᾶς — «начальствующий над вами». εἰς πᾶν λόγον κυρίου — по всякому делу Господню. εἰς οἶκον Ιουδα — по дому Иудину. γραμματεῖς — книжники, писцы (書記[しょき]). ἰσχύσατε — «укрепитесь» (слав. «укрепитеся»). μετὰ τοῦ ἀγαθοῦ — «с добрым», т.е. с делающим добро (слав. «со благим»). Здесь закрывается речь Иосафата."
