chapter: 1
draft: true

verses:
  1: "パウロとテモテ、キリスト・イエスの僕[しもべ]たちは、フィリピにいる、キリスト・イエスにある聖徒[せいと]たちすべてに、監督[かんとく]たちと執事[しつじ]たちとともに。"
  2: "{恵[めぐ]み|恩寵[おんちょう]}と平和[へいわ]が、わたしたちの父[ちち]である神[かみ]と主[しゅ]イエス・キリストから、あなたがたにありますように。"
  3: "わたしは、あなたがたを思[おも]い起[お]こすたびごとに、わたしの神[かみ]に感謝[かんしゃ]している。"
  4: "いつも、あなたがたすべてのために祈[いの]るとき、喜[よろこ]びをもって祈[いの]っている。"
  5: "あなたがたが、初[はじ]めの日[ひ]から今[いま]に至[いた]るまで、福音[ふくいん]にあずかっているからである。"
  6: "あなたがたのうちに良[よ]い働[はたら]きを始[はじ]めた方[かた]が、キリスト・イエスの日[ひ]までに、それを完成[かんせい]してくださると、わたしは確信[かくしん]している。"
  7: "わたしがあなたがたすべてについてこのように思[おも]うのは、当然[とうぜん]である。あなたがたがわたしの心[こころ]にあり、わたしの投獄[とうごく]のうちでも、福音[ふくいん]を弁護[べんご]し確証[かくしょう]するうちでも、あなたがたすべてがわたしとともに{恵[めぐ]み|恩寵[おんちょう]}にあずかっているからである。"
  8: "というのは、わたしがどれほど、キリスト・イエスの深[ふか]い慈[いつく]しみをもって、あなたがたすべてを慕[した]っているか、神[かみ]がわたしの証人[しょうにん]である。"
  9: "そして、わたしはこう祈[いの]っている。あなたがたの愛[あい]が、知識[ちしき]とあらゆる識別[しきべつ]力[りょく]とにおいて、さらにますます豊[ゆた]かになり、"
  10: "あなたがたが最善[さいぜん]のものを選[えら]び分[わ]かち、キリストの日[ひ]に向[む]けて、純粋[じゅんすい]で、つまずきのない者[もの]となり、"
  11: "イエス・キリストによって、義[ぎ]の実[み]に満[み]たされ、神[かみ]の栄光[えいこう]と賛美[さんび]となるためである。"
  12: "兄弟[きょうだい]たち、あなたがたに知[し]ってもらいたい。わたしの身[み]に起[お]こった事柄[ことがら]は、むしろ福音[ふくいん]の前進[ぜんしん]に役立[やくだ]った。"
  13: "そのため、わたしの投獄[とうごく]が、キリストにあって、親衛隊[しんえいたい]の全体[ぜんたい]と、そのほかのすべての人[ひと]に明[あき]らかになった。"
  14: "そして、兄弟[きょうだい]たちの大多数[だいたすう]が、主[しゅ]にあって、わたしの投獄[とうごく]によって確信[かくしん]を強[つよ]め、恐[おそ]れることなく、ますます大胆[だいたん]にみ言葉[ことば]を語[かた]るようになっている。"
  15: "ある者[もの]たちは嫉[ねた]みと争[あらそ]いからキリストを宣[の]べ伝[つた]え、ある者[もの]たちは善意[ぜんい]から宣[の]べ伝[つた]えている。"
  16: "彼[かれ]らは、利己的[りこてき]な野心[やしん]からキリストを宣[の]べ伝[つた]えているが、純粋[じゅんすい]ではなく、わたしの投獄[とうごく]に苦[くる]しみを加[くわ]えようと考えている。"
  17: "しかし、ほかの者[もの]たちは愛[あい]から宣[の]べ伝[つた]えている。わたしが福音[ふくいん]を弁護[べんご]するために立[た]てられていることを知[し]っているからである。"
  18: "しかし、それでどうだというのか。見[み]せかけであれ真実[しんじつ]であれ、あらゆる仕方[しかた]でキリストが宣[の]べ伝[つた]えられている。そのことをわたしは喜[よろこ]び、そればかりか、これからも喜[よろこ]ぶ。"
  19: "というのは、あなたがたの祈[いの]りと、イエス・キリストの霊[れい]の助[たす]けとによって、「このことがわたしの救[すく]いとなる」と、わたしは知[し]っているからである。"
  20: "わたしは、何[なに]ひとつ恥[は]じることなく、かえって、いつものように今[いま]も、大胆[だいたん]に、生[いのち]によってであれ死[し]によってであれ、キリストがわたしの身[み]において大[おお]いなる者[もの]とされることを、切[せつ]に待[ま]ち望[のぞ]み、希望[きぼう]している。"
  21: "というのは、わたしにとって、生[い]きることはキリストであり、死[し]ぬことは益[えき]だからである。"
  22: "しかし、もし肉[にく]において生[い]きるなら、それはわたしにとって働[はたら]きの実[み]である。どちらを選[えら]ぶべきか、わたしには分[わ]からない。"
  23: "わたしは二[ふた]つのものの間[あいだ]に挟[はさ]まれている。わたしは、解[と]かれてキリストとともにいることを願[ねが]っている。そのほうがはるかに良[よ]いからである。"
  24: "しかし、肉[にく]にとどまることは、あなたがたのためには、なおさら必要[ひつよう]である。"
  25: "わたしは、あなたがたの前進[ぜんしん]と信仰[しんこう]の喜[よろこ]びとのために、あなたがたすべてのもとに留[とど]まり、とどまることを確信[かくしん]している。"
  26: "それは、わたしが再[ふたた]びあなたがたのところに行[い]くとき、あなたがたの誇[ほこ]りが、キリスト・イエスにあって、わたしのゆえに豊[ゆた]かになるためである。"
  27: "ただ、キリストの福音[ふくいん]にふさわしく生活[せいかつ]しなさい。そうすれば、わたしが行[い]ってあなたがたに会[あ]うにせよ、離[はな]れているにせよ、あなたがたが一[ひと]つの霊[れい]に立[た]って、一[ひと]つの心[こころ]で、福音[ふくいん]の信仰[しんこう]のためにともに戦[たたか]い、"
  28: "何[なに]ひとつ敵対[てきたい]する者[もの]たちに恐[おそ]れることなく、そのことを聞[き]くことができる。これは彼[かれ]らには滅[ほろ]びのしるし、あなたがたには救[すく]いのしるしであり、これも神[かみ]によるのである。"
  29: "というのは、あなたがたには、キリストのゆえに、ただ彼[かれ]を信[しん]じることだけでなく、彼[かれ]のために苦[くる]しむことも、恵[めぐ]みとして与[あた]えられているからである。"
  30: "あなたがたも、かつてわたしにおいて見[み]たとおりの、また今[いま]わたしについて聞[き]いているとおりの、同[おな]じ戦[たたか]いをしているのである。"

notes:
  1: "Παῦλος καὶ Τιμόθεος δοῦλοι Χριστοῦ Ἰησοῦ — без глагола, как в Гал 1:1. Порядок Χριστοῦ Ἰησοῦ сохранён: キリスト・イエス (у jp-joc イイススハリストス). ἐπίσκοποι — 監督, διάκονοι — 執事 (у jp-joc 監督・役事). σὺν — とともに, не «и»."
  2: "χάρις καὶ εἰρήνη — формула приветствия (ср. Гал 1:3). ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ — 父である神と主イエス・キリストから."
  3: "εὐχαριστῶ — 感謝している. ἐπὶ πάσῃ τῇ μνείᾳ ὑμῶν — «при всяком воспоминании о вас»; 思い起こすたびごとに."
  4: "πάντοτε ἐν πάσῃ δεήσει μου — いつも、…祈るとき. μετὰ χαρᾶς τὴν δέησιν ποιούμενος — 喜びをもって祈っている; причастие передано сказуемым."
  5: "ἐπὶ τῇ κοινωνίᾳ ὑμῶν εἰς τὸ εὐαγγέλιον — «за ваше участие в Евангелии»; 福音にあずかっている. ἀπὸ τῆς πρώτης ἡμέρας ἄχρι τοῦ νῦν — 初めの日から今に至るまで."
  6: "πεποιθὼς αὐτὸ τοῦτο — 確信している. ὁ ἐναρξάμενος — 始めた方. ἐπιτελέσει — 完成してくださる. ἄχρι ἡμέρας Χριστοῦ Ἰησοῦ — キリスト・イエスの日までに."
  7: "καθώς ἐστιν δίκαιον — 当然である. ἔχειν με ἐν τῇ καρδίᾳ ὑμᾶς — あなたがたがわたしの心にあり. δεσμοί — 投獄. ἀπολογία καὶ βεβαίωσις — 弁護し確証すること. συγκοινωνούς — ともに…あずかっている."
  8: "μάρτυς γάρ μου ὁ θεός — 神がわたしの証人である; γάρ передан というのは. σπλάγχνοις Χριστοῦ Ἰησοῦ — «глубокой любовью Христа Иисуса»; 深い慈しみ."
  9: "ἀγάπη…περισσεύῃ — 愛が…豊かになり. ἐπίγνωσις — 知識. αἴσθησις — 識別力, «чувство, различение»."
  10: "δοκιμάζειν τὰ διαφέροντα — «испытывать, что важнее»; 最善のものを選び分け. εἰλικρινεῖς — 純粋. ἀπρόσκοποι — つまずきのない. εἰς ἡμέραν Χριστοῦ — キリストの日に向けて."
  11: "καρπὸς δικαιοσύνης ὁ διὰ Ἰησοῦ Χριστοῦ — 義の実. πεπληρωμένοι — 満たされ. εἰς δόξαν καὶ ἔπαινον θεοῦ — 神の栄光と賛美となる."
  12: "Γινώσκειν…βούλομαι — 知ってもらいたい. τὰ κατ᾽ ἐμέ — わたしの身に起こった事柄. προκοπή — 前進."
  13: "δεσμοί — 投獄. πραιτώριον — 親衛隊 (императорская гвардия; у jp-joc 公廨). ἐν Χριστῷ — キリストにあって; 明らかになった."
  14: "τοὺς πλείονας τῶν ἀδελφῶν ἐν κυρίῳ πεποιθότας — 兄弟たちの大多数が主にあって確信を強め. τὸν λόγον — み言葉; τοῦ θεοῦ в базе нет (у jp-joc и Синодального «слово Божие» — переводческое пояснение), 〔〕 не ставятся."
  15: "φθόνος καὶ ἔρις — 嫉みと争い. εὐδοκία — 善意. μέν…δέ сохранено."
  16: "Церковный порядок: в византийском тексте (и у jp-joc) сначала ἐριθεία, потом ἀγάπη; в базе сайта стихи 16–17 переставлены. ἐριθεία — 利己的な野心 (у jp-joc 分爭). οὐχ ἁγνῶς — 純粋ではなく. θλῖψιν ἐγείρειν — 苦しみを加える."
  17: "οἱ δὲ ἐξ ἀγάπης — しかし、ほかの者たちは愛から. εἰς ἀπολογίαν τοῦ εὐαγγελίου κεῖμαι — 福音を弁護するために立てられている."
  18: "τί γάρ; — それでどうだというのか (риторический вопрос). πλὴν ὅτι — しかし… . πρόφασις — 見せかけ. ἀλήθεια — 真実. χαρήσομαι — これからも喜ぶ."
  19: "Иов 13:16 (LXX) — 「このことがわたしの救いとなる」. ἐπιχορηγία — 助け, «подаяние». τοῦ πνεύματος Ἰησοῦ Χριστοῦ — イエス・キリストの霊."
  20: "ἀποκαραδοκία — 切なる期待. ἐν οὐδενὶ αἰσχυνθήσομαι — 何ひとつ恥じることなく. παρρησία — 大胆. μεγαλυνθήσεται — 大いなる者とされる. εἴτε διὰ ζωῆς εἴτε διὰ θανάτου — 生によってであれ死によってであれ."
  21: "ἐμοὶ γάρ — というのは、わたしにとって. τὸ ζῆν Χριστός — 生きることはキリスト. κέρδος — 益."
  22: "εἰ δὲ τὸ ζῆν ἐν σαρκί — しかし、もし肉において生きるなら. καρπὸς ἔργου — 働きの実. τί αἱρήσομαι — どちらを選ぶべきか."
  23: "συνέχομαι ἐκ τῶν δύο — 二つのものの間に挟まれている. ἀναλῦσαι — 解かれて (умереть). σὺν Χριστῷ εἶναι — キリストとともにいる. [γάρ] в базе — слово есть, 〔〕 не ставятся."
  24: "ἐπιμένειν ἐν τῇ σαρκί — 肉にとどまる. ἀναγκαιότερον — なおさら必要. [ἐν] в базе — слово есть, 〔〕 не ставятся."
  25: "πεποιθὼς οἶδα — 確信している. μενῶ καὶ παραμενῶ — 留まり、とどまる. προκοπή — 前進. χαρὰ τῆς πίστεως — 信仰の喜び."
  26: "καύχημα — 誇り. ἐν ἐμοὶ διὰ τῆς ἐμῆς παρουσίας — わたしのゆえに、わたしが行くことで."
  27: "ἀξίως τοῦ εὐαγγελίου πολιτεύεσθε — 福音にふさわしく生活しなさい. στήκετε — 立ち. συναθλοῦντες — ともに戦い. ἐν ἑνὶ πνεύματι, μιᾷ ψυχῇ — 一つの霊に、一つの心で."
  28: "πτυρόμενοι — 恐れる. ἀντικείμενοι — 敵対する者たち. ἔνδειξις — しるし. ἀπώλεια — 滅び. καὶ τοῦτο ἀπὸ θεοῦ — これも神による."
  29: "ἐχαρίσθη — 恵みとして与えられている. τὸ ὑπὲρ Χριστοῦ — キリストのために. οὐ μόνον…ἀλλὰ καί — だけでなく…も."
  30: "ἀγών — 戦い. οἷον εἴδετε…καὶ νῦν ἀκούετε — かつて見たとおりの、また今聞いているとおりの."
