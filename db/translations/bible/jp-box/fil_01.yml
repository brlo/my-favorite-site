# jp-box, Послание к Филиппийцам, глава 1. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 1: надписание и приветствие (1–2), благодарение и молитва (3–11),
# узы послужили успеху Евангелия (12–18a), «для меня жизнь — Христос» (18b–26),
# призыв жить достойно Евангелия и страдать за Христа (27–30).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет, <j>/<mo> не ставятся.
# 〔…〕 в главе нет: 1:14 — τὸν λόγον без τοῦ θεοῦ (у jp-joc и Синодального «слово Божие»
# как переводческое пояснение, не чтение базы), 1:23 [γάρ] и 1:24 [ἐν] стоят в базе — не оборачиваются.
# 1:16–17 — церковный порядок (сначала ἐριθεία, потом ἀγάπη, как у jp-joc и в Синодальном);
# в критической базе стихи стоят наоборот — это перестановка, а не добавление, без 〔〕.
# Цитата 1:19 (Иов 13:16) — 「…」. Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

tr_code: jp-box
