# jp-box, Иеремия, глава 18. Черновик для приёмки.
#
# Нумерация — по славянской и Синодальной Библии (масоретский порядок глав):
# так привычнее читателю. В Септуагинте (gr-lxx-byz) эта глава — 18.
# База: Септуагинта; контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# --- прежние заметки (написаны при нумерации по гр.; номера в них — греческие) ---
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный, с МТ) — только для понимания,
# не источник. jp-joc по Иеремии — только фрагменты (гл. 11, 12, 31), для главы 18 его
# нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 18: 1–4 дом горшечника и испорченный сосуд; 5–10 слово о глине и о перемене
# суда Божия; 11 призыв к обращению; 12 ответ народа; 13–17 обличение и угроза;
# 18 заговор против пророка; 19–23 его молитва о суде.
# Голоса: 18:1 — надписание вне кавычек; 18:2 — 「…」 (слово Господа); 18:3–4 —
# авторское повествование; 18:5 — формула; 18:6–17 — 「…」 (слово Господа), внутри
# него 18:11 『…』 (что должен сказать пророк) и 18:12 『…』 (ответ народа); 18:18 —
# 「…」 (слова заговорщиков); 18:19–23 — 「…」 (молитва пророка). Вводные формулы —
# вне кавычек.
# Нумерация по gr: 23 стиха; слав. и ru — тоже 23. Слав. внутри главы местами
# сливает и добавляет (18:6 «рече Господь», 18:7 «и разорю и расточу», 18:11
# «исправите пути вашя», 18:18 отрицание «не вонмем») — оговорено в notes.
# 〔…〕 нет: все 23 стиха есть в gr-lxx-byz. Сносок ⟨…⟩ нет: 陶工, 粘土, 器, 律法,
# 祭司, 預言者, 高き所, 嗣業 уже в корпусе или пояснены в notes.
# Имена — транслитерация греческого (LXX): エレミヤ, ユダ, イスラエル, レバノン.
# 
