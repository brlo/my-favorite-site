draft: true

verses:
  1: "主[しゅ]からエレミヤに臨[のぞ]んだ言葉[ことば]は、こうである。"
  2: "「立[た]って、陶工[とうこう]の家[いえ]に下[お]りなさい。そこであなたはわたしの言葉[ことば]を聞[き]くであろう。」"
  3: "そこでわたしは陶工[とうこう]の家[いえ]に下[お]りた。見[み]ると、彼[かれ]は石[いし]の上[うえ]で仕事[しごと]をしていた。"
  4: "陶工[とうこう]が粘土[ねんど]で造[つく]っていた器[うつわ]が、その手[て]の中[なか]で崩[くず]れた。そこで彼[かれ]はもう一度[いちど]、自分[じぶん]の目[め]にかなう別[べつ]の器[うつわ]をそれから造[つく]った。"
  5: "すると、主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  6: "「イスラエルの家[いえ]よ、この陶工[とうこう]のように、わたしがあなたがたを造[つく]ることができないだろうか、と主[しゅ]は言[い]われる。見[み]よ、陶工の手[て]の中の粘土[ねんど]のように、あなたがたもわたしの手[て]の中[なか]にある、イスラエルの家[いえ]よ。"
  7: "わたしがある民[たみ]や王国[おうこく]について、それを抜[ぬ]き取[と]り、壊[こわ]し、散[ち]らすと語[かた]るなら、"
  8: "その民[たみ]が、わたしが語ったすべての悪[わる]から立[た]ち返[かえ]るなら、わたしは彼らに行[おこな]おうと考[かんが]えた災[わざわ]いを悔[く]いる。"
  9: "また、わたしがある民[たみ]や王国[おうこく]について、それを建[た]て直[なお]し、植[う]えると語[かた]るなら、"
  10: "しかし、その民[たみ]がわたしの声[こえ]に聞[き]き従[したが]わず、わたしの目[め]に悪[わる]いことをするなら、わたしは彼らに善[よ]いことをしようと語ったことを悔[く]いる。"
  11: "そこで今、ユダの人[ひと]々[びと]とエルサレムの住民[じゅうみん]に言[い]え。『主[しゅ]はこう言[い]われる。見[み]よ、わたしはあなたがたの上[うえ]に災[わざわ]いを形[かた]づくり、あなたがたに対して計[はかり]ごとを思[おも]いめぐらしている。どうか、おのおの自分[じぶん]の悪[わる]い道[みち]から立[かえ]り、あなたがたの道と行[おこな]いを良[よ]くせよ。』"
  12: "しかし、彼[かれ]らは言[い]った。『われわれは強[つよ]くあろう。自分[じぶん]たちの背[そむ]きの後[あと]について行[い]くのだから。おのおの、自分[じぶん]の悪[わる]い心[こころ]の望[のぞ]むままを行[おこな]おう。』"
  13: "それゆえ、主[しゅ]はこう言[い]われる。国[くに]々[ぐに]に問[と]え。だれがこのような恐[おそ]ろしいことを聞[き]いたか。イスラエルの乙女[おとめ]が、あまりにもひどいことをした。"
  14: "岩[いわ]から乳[ちち]が、レバノンから雪[ゆき]が尽[つ]きるだろうか。風[かぜ]に激[はげ]しく運[はこ]ばれる水[みず]が、その流[なが]れを変[か]えるだろうか。"
  15: "わたしの民[たみ]はわたしを忘[わす]れ、むなしいものに香[こう]をたいた。彼らは自分[じぶん]の道[みち]で弱[よわ]り、昔[むかし]からの小道[こみち]から外[はず]れて、通[とお]れない道[みち]を歩[あゆ]もうとする。"
  16: "彼らは自分[じぶん]の地[ち]を荒廃[こうはい]に、永遠[えいえん]の口笛[くちぶえ]の的[まと]とした。そこを通[とお]る者[もの]はすべて驚[おどろ]き、頭[あたま]を振[ふ]る。"
  17: "わたしは彼らを、敵[てき]の前[まえ]で焼[や]けつくす風[かぜ]のように散[ち]らす。彼らの滅[ほろ]びの日[ひ]に、わたしは彼らに背[せ]を向[む]け、顔[かお]を見[み]せない。」"
  18: "彼らは言[い]った。「さあ、エレミヤに対して計[はかり]ごとをしよう。祭司[さいし]から律法[りっぽう]が、賢[かしこ]い者[もの]から助言[じょげん]が、預言者[よげんしゃ]から言葉[ことば]が滅[ほろ]びることはないからだ。さあ、彼を舌[した]で打[う]ち、彼のすべての言葉[ことば]には耳[みみ]を貸[か]すまい。」"
  19: "「主[しゅ]よ、わたしに耳[みみ]を傾[かたむ]け、わたしの弁明[べんめい]の声[こえ]を聞[き]いてください。"
  20: "善[よ]いことに対して悪[わる]いことで報[むく]いることがあるだろうか。彼らはわたしの命[いのち]に反[はん]する言葉[ことば]を語[かた]り、自分[じぶん]たちの苦[くる]しめをわたしに隠[かく]した。わたしがあなたの前[まえ]に立[た]って彼らのために良[よ]いことを語[かた]り、あなたの怒[いか]りを彼らから遠[とお]ざけようとしたことを思[おも]い出[だ]してください。"
  21: "それゆえ、彼[かれ]らの息子[むすこ]たちを飢[うえ]に渡[わた]し、彼らを剣[つるぎ]の手[て]に集[あつ]めてください。彼らの妻[つま]は子[こ]を失[うしな]ってやもめとなり、彼らの夫[おっと]は死[し]に殺[ころ]され、彼らの若者[わかもの]は戦[たたか]いの場[ば]で剣[つるぎ]に倒[たお]れるように。"
  22: "彼[かれ]らの家[いえ]に叫[さけ]び声[ごえ]が起こるように。あなたが突然[とつぜん]、彼らの上[うえ]に強盗[ごうとう]たちを導[みちび]いてくださるように。彼らはわたしを捕[と]らえようと企[くわだ]て、わたしの上[うえ]に罠[わな]を隠[かく]したからである。"
  23: "主[しゅ]よ、あなたは彼[かれ]らがわたしを死[し]に渡[わた]そうとするすべての計[はかり]ごとをご存[ぞん]じである。彼らの不法[ふほう]を許[ゆる]さず、彼らの罪[つみ]をあなたの前[まえ]から消[け]し去[さ]らないでください。彼らの衰[おとろ]えがあなたの前にあるように。あなたの怒[いか]りの時[とき]に、彼らに報[むく]いてください。」"

notes:
  1: "Ὁ λόγος ὁ γενόμενος παρὰ κυρίου πρὸς Ιερεμιαν λέγων — «слово, бывшее от Господа к Иеремии, говоря»; слав. «Слово, еже бысть ко иеремии от Господа, рекущее». Надписание — вне кавычек; слово Господа начинается в 18:2."
  2: "Ἀνάστηθι καὶ κατάβηθι εἰς οἶκον τοῦ κεραμέως — «встань и сойди в дом горшечника» (κεραμεύς — горшечник, 陶工); καὶ ἐκεῖ ἀκούσῃ τοὺς λόγους μου — «и там услышишь слова Мои»; слав. «тамо услышиши словеса моя». У ru по МТ «там Я возвещу тебе слова Мои» (иное подлежащее) — не внесено."
  3: "ἐπὶ τῶν λίθων — «на камнях» (греч. буквально; слав. «на каменех»): так названы каменные диски гончарного круга, нижний неподвижный и верхний вращающийся; ru читает «на кружале». В тексте 石の上で (ろくろ — в notes, не в тексте). Иеремия сходит в дом горшечника — 18:3 исполнил повеление."
  4: "διέπεσεν τὸ ἀγγεῖον — «развалился сосуд» (διαπίπτω); ὃ αὐτὸς ἐποίει — «который он делал»; ἐν ταῖς χερσὶν αὐτοῦ — «в руках его». Слав. добавляет «от глины рукама своима» — в LXX только «в руках его»; внесено без 〔…〕 (粘土で…その手の中で). καθὼς ἤρεσεν ἐνώπιον αὐτοῦ τοῦ ποιῆσαι — «как угодно было в очах его сделать»; слав. «якоже угодно во очию его творити». Образ глины в руке — ср. Ис 29:16; 45:9; Рим 9:20–21."
  5: "Вводная формула «И было слово Господне ко мне» — вне кавычек, открывает новое слово (18:6–17)."
  6: "Εἰ καθὼς ὁ κεραμεὺς οὗτος οὐ δυνήσομαι τοῦ ποιῆσαι ὑμᾶς, οἶκος Ισραηλ; — «разве, как этот горшечник, не смогу сделать вас, дом Израилев?»; ἰδοὺ ὡς ὁ πηλὸς τοῦ κεραμέως ὑμεῖς ἐστε ἐν ταῖς χερσίν μου — «вот, как глина горшечника, вы в руках Моих» (πηλός — глина, 粘土). Слав. добавляет «рече Господь» и повтор «доме израилев, в руку моею» — в LXX формулы нет; внесено (と主は言われる), повтор сохранён."
  7: "πέρας λαλήσω — «однажды (в конце) скажу» (πέρας — конец, предел); ἐπὶ ἔθνος ἢ ἐπὶ βασιλείαν — «о народе или царстве»; τοῦ ἐξᾶραι αὐτοὺς καὶ τοῦ ἀπολλύειν — «чтобы исторгнуть их и погубить» (ἐξαίρω — исторгать; ἀπόλλυμι — губить). Слав. даёт три глагола: «да искореню их и разорю и расточу я» — «разорю» и «расточу» в LXX нет; внесено без 〔…〕. Стих — протасис, аподосис в 18:8, поэтому в тексте кончается на なら、."
  8: "ἐπιστραφῇ τὸ ἔθνος ἐκεῖνο ἀπὸ πάντων τῶν κακῶν αὐτῶν — «обратится народ тот от всех зол своих»; μετανοήσω περὶ τῶν κακῶν — «раскаюсь о зле» (μετανοέω); ὧν ἐλογισάμην τοῦ ποιῆσαι αὐτοῖς — «которое помыслил сделать им» (λογίζομαι — замышлять). Слав. «раскаюся о озлоблениих, яже помыслих сотворити им»."
  9: "πέρας λαλήσω ἐπὶ ἔθνος καὶ ἐπὶ βασιλείαν — «однажды скажу о народе и царстве»; τοῦ ἀνοικοδομεῖσθαι καὶ τοῦ καταφυτεύεσθαι — «чтобы созидаться и насаждаться» (ἀνοικοδομέω — отстраивать; καταφυτεύω — насаждать). Слав. «да возсозижду и насажду я». Стих — протасис к 18:10, в тексте кончается на なら、."
  10: "ποιήσωσιν τὰ πονηρὰ ἐναντίον μου — «сделают злое пред очами Моими»; τοῦ μὴ ἀκούειν τῆς φωνῆς μου — «не слушая гласа Моего»; μετανοήσω περὶ τῶν ἀγαθῶν — «раскаюсь о благах»; ὧν ἐλάλησα τοῦ ποιῆσαι αὐτοῖς — «которые Я сказал сделать им». Слав. «раскаюся о благих, яже глаголах сотворити им». Свобода Бога в суде и милости — ср. 18:7–10 и Ион 3:10."
  11: "πλάσσω ἐφ᾽ ὑμᾶς κακά — «образую (замышляю) на вас злое» (πλάσσω — лепить, образовывать; тот же глагол, что о глине в 18:4, 6); λογίζομαι ἐφ᾽ ὑμᾶς λογισμόν — «замышляю на вас замысел»; ἀποστραφήτω δὴ ἕκαστος ἀπὸ ὁδοῦ αὐτοῦ τῆς πονηρᾶς — «да обратится каждый от пути своего злого»; καλλίονα ποιήσετε τὰ ἐπιτηδεύματα ὑμῶν — «лучшими сделайте дела ваши» (καλλίων — лучший). Слав. добавляет «исправите пути вашя» — «пути» в LXX нет (передано словом 道); слова, которые пророк должен сказать, — 『…』."
  12: "Ἀνδριούμεθα — «укрепимся, будем мужами» (ἀνδρίζομαι, от ἀνήρ); слав. «укрепимся»; у ru (МТ) «не надейся» — иное чтение (евр. נואש), не внесено. ὀπίσω τῶν ἀποστροφῶν ἡμῶν πορευσόμεθα — «пойдём вслед отступлений наших» (ἀποστροφή — совращение); τὰ ἀρεστὰ τῆς καρδίας αὐτοῦ τῆς πονηρᾶς ποιήσομεν — «сделаем угодное сердцу своему злому». Ответ народа — 『…』 внутри слова Господа."
  13: "Ἐρωτήσατε δὴ ἐν ἔθνεσιν — «спросите же у народов»; Τίς ἤκουσεν τοιαῦτα φρικτά; — «кто слышал подобное страшное?» (φρικτός — страшный, ужасный); ἃ ἐποίησεν σφόδρα παρθένος Ισραηλ — «что сделала весьма дева Израилева» (σφόδρα — весьма; παρθένος — дева). Слав. «вопросите ныне языков, кто слыша сицевая страшная, яже сотвори зело дева израилева?»"
  14: "μὴ ἐκλείψουσιν ἀπὸ πέτρας μαστοί — «разве иссякнут от скалы сосцы (потоки)?» (ἐκλείπω — иссякать; μαστός — грудь, сосец; образ родников и росы); ἢ χιὼν ἀπὸ τοῦ Λιβάνου — «или снег с Ливана»; μὴ ἐκκλινεῖ ὕδωρ βιαίως ἀνέμῳ φερόμενον — «разве уклонится вода, бурно ветром несомая?» (βιαίως — бурно). Слав. «еда оскудеют от камене сосцы, или снег от ливана? еда уклонится вода зелно ветром носимая?»"
  15: "ἐπελάθοντό μου ὁ λαός μου — «забыли Меня люди Мои»; εἰς κενὸν ἐθυμίασαν — «всуе кадили» (θυμιάω — кадить); ἀσθενήσουσιν ἐν ταῖς ὁδοῖς αὐτῶν — «ослабеют на путях своих»; σχοίνους αἰωνίους — тёмное место (σχοῖνος — тростник, верёвка, мера длины; возможно, «вехи»), слав. «на стезях вечных»; τοῦ ἐπιβῆναι τρίβους οὐκ ἔχοντας ὁδὸν εἰς πορείαν — «чтобы взойти на стези, не имеющие пути для хождения»."
  16: "τοῦ τάξαι τὴν γῆν αὐτῶν εἰς ἀφανισμόν — «чтобы поставить землю их в опустошение»; σύριγμα αἰώνιον — «вечный посвист» (σύριγμα — свист, 口笛); πάντες οἱ διαπορευόμενοι δι᾽ αὐτῆς ἐκστήσονται — «все проходящие по ней изумятся» (ἐξίστημι); κινήσουσιν τὴν κεφαλὴν αὐτῶν — «покачают головами своими». Ср. 3 Цар 9:8."
  17: "ὡς ἄνεμον καύσωνα διασπερῶ αὐτούς — «как палящим ветром развею их» (καύσων — знойный ветер; διασπείρω — рассеивать); κατὰ πρόσωπον ἐχθρῶν αὐτῶν — «пред лицом врагов их»; δείξω αὐτοῖς ἡμέραν ἀπωλείας αὐτῶν — «покажу им день погибели их». Слав. добавляет «хребет, а не лице покажу им» — в LXX нет (чтение МТ); внесено без 〔…〕 (背を向け、顔を見せない)."
  18: "Δεῦτε λογισώμεθα ἐπὶ Ιερεμιαν λογισμόν — «придите, замыслим на Иеремию замысел»; οὐκ ἀπολεῖται νόμος ἀπὸ ἱερέως — «не погибнет закон от священника»; βουλὴ ἀπὸ συνετοῦ — «совет от разумного» (συνετός); λόγος ἀπὸ προφήτου — «слово от пророка»; πατάξωμεν αὐτὸν ἐν γλώσσῃ — «поразим его языком»; καὶ ἀκουσόμεθα πάντας τοὺς λόγους αὐτοῦ — «и услышим все слова его». Слав. читает с отрицанием «и не вонмем всем словесем его» (по МТ) — держим csl. Слова заговорщиков — 「…」, не речь Бога."
  19: "εἰσάκουσόν μου, κύριε — «услышь меня, Господи»; εἰσάκουσον τῆς φωνῆς τοῦ δικαιώματός μου — «услышь голос оправдания (правого дела) моего» (δικαίωμα — оправдание, правда); слав. «услыши глас оправдания моего»; у ru (МТ) «голос моих противников». Начало молитвы пророка (19–23)."
  20: "εἰ ἀνταποδίδοται ἀντὶ ἀγαθῶν κακά; — «разве воздаётся за доброе злым?» (ἀνταποδίδωμι — воздавать); συνελάλησαν ῥήματα κατὰ τῆς ψυχῆς μου — «сговорились (говорили) слова против души моей»; τὴν κόλασιν αὐτῶν ἔκρυψάν μοι — «мучение (кару) своё скрыли от меня» (κόλασις); μνήσθητι ἑστηκότος μου κατὰ πρόσωπόν σου — «вспомни, как я стоял пред лицом Твоим»; τοῦ λαλῆσαι ὑπὲρ αὐτῶν ἀγαθά — «чтобы говорить за них доброе»; τοῦ ἀποστρέψαι τὸν θυμόν σου ἀπ᾽ αὐτῶν — «чтобы отвратить гнев Твой от них». У ru «роют яму душе моей» (МТ) — в LXX/csl этого нет, не внесено."
  21: "δὸς τοὺς υἱοὺς αὐτῶν εἰς λιμόν — «отдай сыновей их в голод»; ἄθροισον αὐτοὺς εἰς χεῖρας μαχαίρας — «собери их в руки меча»; γενέσθωσαν αἱ γυναῖκες αὐτῶν ἄτεκνοι καὶ χῆραι — «да будут жёны их бездетны и вдовы»; ἀνῃρημένοι θανάτῳ — «умерщвлённые смертью» (ἀναιρέω); πεπτωκότες μαχαίρᾳ ἐν πολέμῳ — «павшие мечом на войне»."
  22: "γενηθήτω κραυγὴ ἐν ταῖς οἰκίαις αὐτῶν — «да будет вопль в домах их»; ἐπάξεις ἐπ᾽ αὐτοὺς λῃστὰς ἄφνω — «наведёшь на них разбойников внезапно» (λῃστής — разбойник; ἄφνω — внезапно); ἐνεχείρησαν λόγον εἰς σύλλημψίν μου — «замыслили слово, чтобы схватить меня» (σύλλημψις — поимка); παγίδας ἔκρυψαν ἐπ᾽ ἐμέ — «сети скрыли на меня» (παγίς — сеть, петля). Слав. «да будет вопль в домех их: наведи на них разбойники внезапу… и сети скрыша на мя»."
  23: "ἔγνως ἅπασαν τὴν βουλὴν αὐτῶν ἐπ᾽ ἐμὲ εἰς θάνατον — «Ты знаешь весь замысел их против меня на смерть»; μὴ ἀθῳώσῃς τὰς ἀδικίας αὐτῶν — «не очисти (не объяви невиновными) неправд их» (ἀθῳόω — признавать невиновным); μὴ ἐξαλείψῃς — «не изгладь» (ἐξαλείφω); γενέσθω ἡ ἀσθένεια αὐτῶν ἐναντίον σου — «да будет немощь их пред Тобою» (ἀσθένεια — немощь, падение), слав. «да будет болезнь их пред тобою», ru «да будут они низвержены» — место спорное; ἐν καιρῷ θυμοῦ σου ποίησον ἐν αὐτοῖς — «во время гнева Твоего сделай с ними»."
