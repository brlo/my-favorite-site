verses:
  1: "「見[み]よ、わたしがユダとエルサレムの捕囚[ほしゅう]を帰[かえ]す、その日[ひ]、その時[とき]のことである。"
  2: "わたしはすべての国民[こくみん]を集[あつ]め、ヨシャファトの谷[たに]に下[くだ]らせ、そこで、わたしの民[たみ]、わたしの嗣業[しぎょう]であるイスラエルのために、彼らと裁[さば]きを行[おこな]う。彼らはイスラエルを諸国民の間[あいだ]に散[ち]らし、わたしの地[ち]を分[わ]け合[あ]ったからである。"
  3: "彼らはわたしの民についてくじを投[な]げ、少年[しょうねん]たちを娼婦[しょうふ]に与[あた]え、少女[しょうじょ]たちをぶどう酒[しゅ]と引[ひ]き換[か]えに売[う]って、それを飲[の]んだ。"
  4: "ツロとシドン、またペリシテのすべての地方[ちほう]よ、あなたがたはわたしと何[なん]の関係[かんけい]があるのか。あなたがたはわたしに報復[ほうふく]しようというのか。もしあなたがたがわたしに報復するなら、わたしはすみやかに、あなたがたの報復をあなたがたの頭[あたま]に返[かえ]す。"
  5: "あなたがたはわたしの銀[ぎん]と金[きん]を取[と]り、わたしの最[もっと]も良[よ]い宝物[たからもの]をあなたがたの社[やしろ]に持[も]ち込[こ]んだからである。"
  6: "あなたがたはユダの子[こ]らとエルサレムの子らを、ギリシア人[じん]の子らに売[う]り、彼らをその国境[こっきょう]から追[お]い出[だ]した。"
  7: "見[み]よ、わたしは、あなたがたが彼らを売[う]ったその場所[ばしょ]から彼らを起[お]こし、あなたがたの報復をあなたがたの頭[あたま]に返[かえ]す。"
  8: "わたしはあなたがたの息子[むすこ]たちと娘[むすめ]たちをユダの子[こ]らの手に渡[わた]し、彼らはそれを遠[とお]く離[はな]れた民[たみ]のところへ捕囚[ほしゅう]として売[う]る。主[しゅ]が言[い]われたからである。"
  9: "諸国民[しょこくみん]の間[あいだ]にこう告[つ]げ知[し]らせよ。戦[いくさ]を聖別[せいべつ]せよ。勇者[ゆうしゃ]たちを起[お]こせ。近[ちか]づいて上[のぼ]れ、すべての戦[いくさ]人[びと]よ。"
  10: "あなたがたの鋤[すき]を剣[つるぎ]に、鎌[かま]を槍[やり]に打[う]ち替[か]えよ。弱[よわ]い者[もの]は『わたしは強[つよ]い』と言[い]え。"
  11: "すべての国民[こくみん]よ、周囲[しゅうい]から集[あつ]まって来[こ]い。そこに集[あつ]まれ。穏[おだ]やかな者[もの]も戦士[せんし]となれ。"
  12: "諸国民[しょこくみん]は起[お]こり、ヨシャファトの谷[たに]に上[のぼ]って来[こ]い。わたしはそこに座[すわ]して、周囲[しゅうい]のすべての国民を裁[さば]くからである。"
  13: "鎌[かま]を送[おく]り出[だ]せ。取[と]り入[い]れの時[とき]が来[き]たからである。来[き]て、踏[ふ]みつけよ。ぶどう搾[しぼ]り場[ば]は満[み]ち、その下[した]の槽[ふね]からあふれている。彼らの悪[あく]が大[おお]きくなったからである。"
  14: "裁[さば]きの谷[たに]に叫[さけ]び声[ごえ]が響[ひび]き渡[わた]る。主[しゅ]の日[ひ]が裁きの谷に近[ちか]いからである。"
  15: "太陽[たいよう]と月[つき]は暗[くら]くなり、星[ほし]はその光[ひかり]を隠[かく]す。"
  16: "主[しゅ]はシオンからとどろき、エルサレムから声[こえ]を出[だ]される。天[てん]と地[ち]は震[ふる]える。しかし主はご自分[じぶん]の民[たみ]を惜[お]しみ、イスラエルの子[こ]らを強[つよ]くされる。"
  17: "あなたがたは、わたしがあなたがたの神[かみ]である主[しゅ]、シオンのわたしの聖[せい]なる山[やま]に住[す]む者[もの]であることを知[し]る。エルサレムは聖[せい]なる都[みやこ]となり、異邦人[いほうじん]はもはやそこを通[とお]らない。"
  18: "その日[ひ]、山[やま]々[やま]は甘[あま]いぶどう酒[しゅ]を滴[したた]らせ、丘[おか]は乳[ちち]を流[なが]し、ユダのすべての流[なが]れは水[みず]を流[なが]す。主[しゅ]の家[いえ]から泉[いずみ]が湧[わ]き出[で]て、葦[あし]の谷[たに]を潤[うるお]す。"
  19: "エジプトは荒[あ]れ果[は]てた地[ち]となり、エドムは荒[あ]れた野[の]となる。ユダの子[こ]らを虐[しいた]げたゆえ、すなわち彼らの地[ち]で正[ただ]しい血[ち]を流[なが]したゆえである。"
  20: "しかしユダヤは永遠[えいえん]に人[ひと]が住[す]み、エルサレムは代々[だいだい]にわたって続[つづ]く。"
  21: "わたしは彼らの血[ち]の報[むく]いを求[もと]め、決[けっ]して罰[ばつ]を免[まぬか]れさせない。主[しゅ]はシオンに住[す]まわれる。」"

notes:
  1: "В gr-lxx-byz это 4:1 (глава 3 там — наш 2:28–32); нумерация и число стихов — по слав.-синод. Διότι ἰδοὺ ἐγὼ ἐν ταῖς ἡμέραις ἐκείναις καὶ ἐν τῷ καιρῷ ἐκείνῳ — «ибо вот, Я в те дни и в то время»; ὅταν ἐπιστρέψω τὴν αἰχμαλωσίαν Ιουδα καὶ Ιερουσαλημ — «когда возвращу плен Иуды и Иерусалима» (ἐπιστρέφω — возвращать, 帰す; αἰχμαλωσία — 捕囚). Стих открывает речь Господа; продолжение 2:28–32, кавычки по главе сбалансированы."
  2: "συνάξω πάντα τὰ ἔθνη — «соберу все народы»; κατάξω αὐτὰ εἰς τὴν κοιλάδα Ιωσαφατ — «приведу их в долину Иосафата» (κοιλάς — 谷, ヨシャファト); διακριθήσομαι πρὸς αὐτοὺς ἐκεῖ — «буду судиться с ними там» (διακρίνω — разбирать, судить, 裁きを行う); ὑπὲρ τοῦ λαοῦ μου καὶ τῆς κληρονομίας μου Ισραηλ — «за народ Мой и наследие Моё, Израиля» (κληρονομία — 嗣業); οἳ διεσπάρησαν ἐν τοῖς ἔθνεσιν — «которые рассеяны среди народов»; τὴν γῆν μου καταδιείλαντο — «землю Мою разделили» (καταδιαιρέω)."
  3: "ἐπὶ τὸν λαόν μου ἔβαλον κλήρους — «на народ Мой бросили жребии» (κλῆρος — жребий, くじ); ἔδωκαν τὰ παιδάρια πόρναις — «отдали мальчиков блудницам» (παιδάριον — мальчик, 少年; πόρνη — 娼婦); τὰ κοράσια ἐπώλουν ἀντὶ οἴνου — «девочек продавали за вино» (κοράσιον — девочка, 少女); καὶ ἔπινον — «и пили»."
  4: "καὶ τί καὶ ὑμεῖς ἐμοί, Τύρος καὶ Σιδών — «и что вы Мне, Тир и Сидон» (оборот «что мне до вас»); πᾶσα Γαλιλαία ἀλλοφύλων — «вся Галилея иноплеменников» (т.е. область филистимлян; ペリシテのすべての地方); μὴ ἀνταπόδομα ὑμεῖς ἀνταποδίδωτέ μοι — «разве воздаяние вы воздаёте Мне» (ἀνταπόδομα — возмездие, 報復); ἢ μνησικακεῖτε ὑμεῖς ἐπ' ἐμοὶ ὀξέως — «или злопамятствуете на Меня остро» (μνησικακέω — злопамятствовать); καὶ ταχέως ἀνταποδώσω τὸ ἀνταπόδομα ὑμῶν εἰς κεφαλὰς ὑμῶν — «и скоро воздам воздаяние ваше на головы ваши» (csl «остро и быстро»)."
  5: "τὸ ἀργύριόν μου καὶ τὸ χρυσίον μου ἐλάβετε — «серебро Моё и золото Моё взяли»; τὰ ἐπίλεκτά μου καὶ τὰ καλά εἰσηνέγκατε εἰς τοὺς ναοὺς ὑμῶν — «избранное Моё и доброе внесли в храмы (капища) ваши» (ἐπίλεκτος — отборный, 最も良い; ναός — храм, здесь языческий, 社; csl «требища»)."
  6: "τοὺς υἱοὺς Ιουδα καὶ τοὺς υἱοὺς Ιερουσαλημ ἀπέδοσθε τοῖς υἱοῖς τῶν Ἑλλήνων — «сынов Иуды и сынов Иерусалима продали сынам Еллинов» (ἀποδίδωμι — продавать); ὅπως ἐξώσητε αὐτοὺς ἐκ τῶν ὁρίων αὐτῶν — «чтобы изгнать их из пределов их» (ἐξωθέω — выталкивать, 追い出す; ὅρια — 国境). Стих продолжает обвинение 5-го."
  7: "ἰδοὺ ἐγὼ ἐξεγείρω αὐτοὺς ἐκ τοῦ τόπου, οὗ ἀπέδοσθε αὐτοὺς ἐκεῖ — «вот, Я воздвигну (подниму) их из места, куда вы продали их» (ἐξεγείρω — поднимать, 起こす); ἀνταποδώσω τὸ ἀνταπόδομα ὑμῶν εἰς κεφαλὰς ὑμῶν — «воздам воздаяние ваше на головы ваши»."
  8: "ἀποδώσομαι τοὺς υἱοὺς ὑμῶν καὶ τὰς θυγατέρας ὑμῶν εἰς χεῖρας υἱῶν Ιουδα — «отдам сыновей ваших и дочерей ваших в руки сынов Иуды»; ἀποδώσονται αὐτοὺς εἰς αἰχμαλωσίαν εἰς ἔθνος μακρὰν ἀπέχον — «продадут их в плен народу далеко отстоящему» (αἰχμαλωσία — 捕囚; μακρὰν ἀπέχω — быть далеко); ὅτι κύριος ἐλάλησεν — «ибо Господь сказал» (формула внутри речи). В ru (МТ) «Савеям» — добавка МТ, не внесена."
  9: "Κηρύξατε ταῦτα ἐν τοῖς ἔθνεσιν — «провозгласите это среди народов» (κηρύσσω — 告げ知らせる); ἁγιάσατε πόλεμον — «освятите войну» (ἁγιάζω — 聖別する); ἐξεγείρατε τοὺς μαχητάς — «воздвигните борцов» (μαχητής — 勇者); προσαγάγετε καὶ ἀναβαίνετε — «приведите и восходите»; πάντες ἄνδρες πολεμισταί — «все мужи воины»."
  10: "συγκόψατε τὰ ἄροτρα ὑμῶν εἰς ῥομφαίας — «перекуйте орала ваши в мечи» (ἄροτρον — плуг, 鋤; ῥομφαία — меч); τὰ δρέπανα ὑμῶν εἰς σειρομάστας — «серпы ваши в копья» (δρέπανον — 鎌; σειρομάστης — копьё/остриё, 槍); ὁ ἀδύνατος λεγέτω ὅτι Ἰσχύω ἐγώ — «немощный да говорит: я силён» (слова слабого — 『…』)."
  11: "συναθροίζεσθε καὶ εἰσπορεύεσθε, πάντα τὰ ἔθνη κυκλόθεν — «собирайтесь и входите, все народы окрест» (συναθροίζω — собирать); συνάχθητε ἐκεῖ — «соберитесь там»; ὁ πραῢς ἔστω μαχητής — «кроткий да будет воином» (πραΰς — кроткий, 穏やかな). В ru (МТ) «туда, Господи, веди Твоих героев» — нет в LXX/csl, не внесено."
  12: "ἐξεγειρέσθωσαν καὶ ἀναβαινέτωσαν πάντα τὰ ἔθνη — «да возбудятся и да взойдут все народы»; εἰς τὴν κοιλάδα Ιωσαφατ — «в долину Иосафата»; ἐκεῖ καθιῶ τοῦ διακρῖναι πάντα τὰ ἔθνη κυκλόθεν — «там сяду, чтобы судить все народы окрест» (καθίζω — садиться, 座る; διακρίνω — судить)."
  13: "ἐξαποστείλατε δρέπανα — «пошлите серпы» (ἐξαποστέλλω — высылать); ὅτι παρέστηκεν τρύγητος — «ибо наступил сбор винограда» (τρύγητος — 取り入れ); εἰσπορεύεσθε πατεῖτε — «входите, топчите» (πατέω — топтать); πλήρης ἡ ληνός — «полно точило» (ληνός — ぶどう搾り場); ὑπερεκχεῖται τὰ ὑπολήνια — «переливаются подточилия» (ὑπολήνιον — 槽); ὅτι πεπλήθυνται τὰ κακὰ αὐτῶν — «ибо умножились злобы их» (κακά — 悪)."
  14: "ἦχοι ἐξήχησαν ἐν τῇ κοιλάδι τῆς δίκης — «звуки (шумы) раздались в долине суда» (ἦχος — звук/шум; ἐξηχέω — раздаваться; δίκη — суд, 裁き); ὅτι ἐγγὺς ἡμέρα κυρίου ἐν τῇ κοιλάδι τῆς δίκης — «ибо близок день Господень в долине суда». В ru (МТ) «толпы, толпы» — иное чтение, не внесено."
  15: "ὁ ἥλιος καὶ ἡ σελήνη συσκοτάσουσιν — «солнце и луна померкнут»; οἱ ἀστέρες δύσουσιν φέγγος αὐτῶν — «звёзды зайдут (потеряют) свет свой» (δύω — заходить, 隠す)."
  16: "ὁ κύριος ἐκ Σιων ἀνακεκράξεται — «Господь с Сиона воззовёт (возгремит)» (ἀνακράζω — вскричать); ἐξ Ιερουσαλημ δώσει φωνὴν αὐτοῦ — «из Иерусалима даст голос Свой»; σεισθήσεται ὁ οὐρανὸς καὶ ἡ γῆ — «потрясутся небо и земля»; φείσεται τοῦ λαοῦ αὐτοῦ — «пощадит народ Свой» (φείδομαι — щадить, 惜しむ); ἐνισχύσει τοὺς υἱοὺς Ισραηλ — «укрепит сынов Израилевых» (ἐνισχύω — укреплять). В ru (МТ) «будет защитою/обороною» — иное чтение, не внесено."
  17: "ἐπιγνώσεσθε διότι ἐγὼ κύριος ὁ θεὸς ὑμῶν — «узнаете, что Я Господь Бог ваш»; ὁ κατασκηνῶν ἐν Σιων ἐν ὄρει ἁγίῳ μου — «обитающий на Сионе, на святой горе Моей» (κατασκηνόω — обитать, 住む); ἔσται Ιερουσαλημ πόλις ἁγία — «будет Иерусалим городом святым»; ἀλλογενεῖς οὐ διελεύσονται δι' αὐτῆς οὐκέτι — «иноплеменники не пройдут через него более» (ἀλλογενής — иноплеменник/чужой, 異邦人)."
  18: "ἀποσταλάξει τὰ ὄρη γλυκασμόν — «источат горы сладость» (ἀποστάζω — капать; γλυκασμός — сладость, 甘いぶどう酒); οἱ βουνοὶ ῥυήσονται γάλα — «холмы потекут молоком» (ῥέω — течь); πᾶσαι αἱ ἀφέσεις Ιουδα ῥυήσονται ὕδατα — «все потоки Иуды потекут водами» (ἄφεσις — поток/источник); πηγὴ ἐξ οἴκου κυρίου ἐξελεύσεται — «источник из дома Господня выйдет» (πηγή — 泉); ποτιεῖ τὸν χειμάρρουν τῶν σχοίνων — «напоит поток тростников (акаций)» (χείμαρρος — 流れ; σχοῖνος — тростник/акация; csl «ситий» — Ситтим; ru «долину Ситтим»)."
  19: "Αἴγυπτος εἰς ἀφανισμὸν ἔσται — «Египет в опустошение будет» (ἀφανισμός — 荒れ果てた地); ἡ Ιδουμαία εἰς πεδίον ἀφανισμοῦ — «Идумея в поле опустошения» (πεδίον — 野); ἐξ ἀδικιῶν υἱῶν Ιουδα — «за неправды (притеснения) сынов Иуды» (ἀδικία — 虐げ); ἀνθ' ὧν ἐξέχεαν αἷμα δίκαιον ἐν τῇ γῇ αὐτῶν — «за то, что пролили кровь праведную (невинную) в земле их» (ἐκχέω — проливать; αἷμα δίκαιον — 正しい血, ru «невинную»)."
  20: "ἡ δὲ Ιουδαία εἰς τὸν αἰῶνα κατοικηθήσεται — «Иудея в век будет населена» (κατοικέω — населять, 住む; εἰς τὸν αἰῶνα — 永遠に); Ιερουσαλημ εἰς γενεὰς γενεῶν — «Иерусалим в роды родов» (代々)."
  21: "καὶ ἐκδικήσω τὸ αἷμα αὐτῶν — «и взыщу кровь их» (ἐκδικέω — взыскивать, мстить, 報いを求める); καὶ οὐ μὴ ἀθῳώσω — «и не оставлю без наказания» (ἀθῳόω — признавать невинным, 罰を免れさせる); καὶ κύριος κατασκηνώσει ἐν Σιων — «и Господь будет обитать на Сионе» (κατασκηνόω). В ru (МТ) «Я смою кровь их, которую не смыл ещё» — иное чтение (נקה), не внесено. Здесь речь Господа закрывается."
