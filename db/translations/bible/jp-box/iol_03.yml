# jp-box, Иоиль, глава 3. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной. ВАЖНО: в gr-lxx-byz это глава 4 (глава 3 там —
# излияние Духа, наш 2:28–32); содержание и число стихов совпадают (21).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: суд над народами и спасение Сиона. 1–8 Господь возвращает плен Иуды,
# собирает народы в долину Иосафата за рассеяние Израиля и раздел земли, за продажу
# сынов Иуды и дочерей; 9–13 призыв к народам готовиться к войне, «перекуйте орала
# на мечи», долина суда, серпы и точило; 14–16 день Господень, тьма, глас с Сиона,
# Господь — прибежище народа; 17–21 святой Иерусалим, источник из дома Господня,
# Египет и Едом опустеют, Иудея населена вовек, «взыщу кровь их».
# Голоса: вся глава — одно слово Господа в 「…」 (открывается в 1, закрывается в 21;
# продолжение речи 2:28–32, кавычки по главе сбалансированы). В 10 слова слабого —
# 『…』 (вложенная речь). Формулы «говорит Господь» внутри речи.
# Термины: 捕囚 (αἰχμαλωσία), 嗣業 (κληρονομία), 異邦人 (ἀλλογενής), 裁き (κρίμα),
# 正しさ (δικαιοσύνη), 主の日 (ἡμέρα κυρίου), 聖別 (ἁγιάζω), ぶどう搾り場 (ληνός).
# Имена: ユダ, エルサレム, シオン, ツロ, シドン, ペリシテ, ギリシア人, ヨシャファト,
# エジプト, エドム, ユダヤ.
#
