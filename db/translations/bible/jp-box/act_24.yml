# jp-box, Деяния апостолов, глава 24. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 24: обвинение Тертулла (1–9), защита Павла (10–21), Феликс откладывает
# дело (22–23), беседа с Друзиллой, страх и ожидание взятки (24–26), два года
# и преемник Фест (27).
# Красное: в главе нет (речи Тертулла, Павла, Феликса — не красные).
# Скобки 24:6–8 — по базе: 24:7 в критическом тексте отсутствует («.»),
# добавления церковного текста в 24:6 и 24:8 — в 〔…〕.
# jp-ni не использовался.

