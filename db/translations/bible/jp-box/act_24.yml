verses:
  1: "五日[いつか]の後[のち]、大祭司[だいさいし]アナニアが、長老[ちょうろう]たちの何人[なんにん]かと、テルトゥロスという弁護人[べんごにん]と一緒[いっしょ]に下[くだ]って来[き]て、パウロを総督[そうとく]に訴[うった]えた。"
  2: "パウロが呼[よ]ばれたとき、テルトゥロスは訴[うった]え始[はじ]めて言[い]った。「あなたのおかげでわたしたちは大[おお]きな平和[へいわ]を保[たも]ち、またあなたの先見[せんけん]によってこの民[たみ]に改革[かいかく]が行[おこな]われておりますので、"
  3: "わたしたちは、どこでも、またあらゆる面[めん]で、尊[とうと]いフェリクス閣下[かっか]、深[ふか]く感謝[かんしゃ]しております。"
  4: "しかし、これ以上[いじょう]あなたを煩[わずら]わせてはなりませんので、どうか、あなたの寛容[かんよう]によって、わたしたちの話[はなし]を手短[てみじか]にお聞[き]きください。"
  5: "わたしたちがこの人[ひと]を見[み]つけたところ、彼[かれ]は疫病[えきびょう]のような者[もの]、世界中[せかいじゅう]のすべてのユダヤ人[じん]の間[あいだ]に騒乱[そうらん]を起[お]こす者[もの]であり、ナザレ人[じん]の異端[いたん]の首領[しゅりょう]であり、"
  6: "しかも、神殿[しんでん]を汚[けが]そうとした者[もの]です。わたしたちは彼[かれ]を捕[つか]まえ、〔わたしたちの律法[りっぽう]に従[したが]って裁[さば]こうとしました。〕"
  7: "〔ところが、千人隊長[せんにんたいちょう]リシアが来[き]て、大[おお]いに力[ちから]ずくで彼[かれ]をわたしたちの手[て]から引[ひ]き離[はな]し、〕"
  8: "〔また、彼[かれ]を訴[うった]える者[もの]たちに、あなたのところへ来[く]るように命[めい]じました。〕あなたが彼[かれ]から自[みずか]ら取[と]り調[しら]べれば、わたしたちが彼[かれ]を訴[うった]えているすべてのことを知[し]ることができるでしょう。」"
  9: "ユダヤ人[じん]たちもこれに同調[どうちょう]して、そのとおりだと認[みと]めた。"
  10: "総督[そうとく]がパウロに話[はな]すようにうなずいたので、パウロは答[こた]えて言[い]った。「あなたが長年[ながねん]、この民[たみ]の裁判官[さいばんかん]を務[つと]めておられることを知[し]っておりますので、わたしは落[お]ち着[つ]いて自分[じぶん]のことを弁明[べんめい]いたします。"
  11: "あなたはお分[わ]かりいただけるでしょう。わたしが礼拝[れいはい]のためにエルサレムに上[のぼ]ってから、まだ十二日[じゅうににち]しかたっていません。"
  12: "そして、彼[かれ]らは、わたしが神殿[しんでん]でだれかと論[ろん]じ合[あ]ったり、会堂[かいどう]でも都[みやこ]でも群衆[ぐんしゅう]をかき集[あつ]めて騒[さわ]ぎを起[お]こしたりするのを、見[み]たことがありません。"
  13: "また、彼[かれ]らは今[いま]、わたしを訴[うった]えていることを、あなたの前[まえ]で証明[しょうめい]することもできません。"
  14: "しかし、わたしはあなたにこのことを告白[こくはく]します。わたしは、彼[かれ]らが異端[いたん]と呼[よ]ぶこの道[みち]に従[したが]って、先祖[せんぞ]の神[かみ]に仕[つか]えております。また、律法[りっぽう]に書[か]かれていること、預言者[よげんしゃ]たちに書[か]かれていることを、すべて信[しん]じております。"
  15: "そして、神[かみ]に対[たい]する希望[きぼう]を抱[いだ]いています。それは、彼[かれ]ら自身[じしん]も待[ま]ち望[のぞ]んでいる希望[きぼう]、すなわち、正[ただ]しい者[もの]も不正[ふせい]な者[もの]も復活[ふっかつ]するという希望[きぼう]です。"
  16: "ですから、わたしは、神[かみ]に対[たい]しても人[ひと]に対[たい]しても、いつも責[せ]められることのない良心[りょうしん]を保[たも]つよう、努[つと]めております。"
  17: "さて、わたしは長年[ながねん]を経[へ]て、同胞[どうほう]に施[ほどこ]しをするため、また供[そな]え物[もの]を献[ささ]げるために来[き]ました。"
  18: "その最中[さいちゅう]、わたしが身[み]を清[きよ]めて神殿[しんでん]におり、群衆[ぐんしゅう]を伴[ともな]わず、騒[さわ]ぎもなくいたところを、彼[かれ]らは見[み]つけたのです。"
  19: "アジアから来[き]たユダヤ人[じん]たちです。彼[かれ]らは、もしわたしに何[なに]か言[い]うことがあれば、あなたの前[まえ]に出[で]て訴[うった]えるべきでした。"
  20: "あるいは、ここにいる者[もの]たち自身[じしん]が、わたしが最高法院[さいこうほういん]の前[まえ]に立[た]ったとき、わたしにどんな不正[ふせい]を見[み]つけたのか、言[い]うべきです。"
  21: "あるいは、わたしが彼[かれ]らの間[あいだ]に立[た]って叫[さけ]んだこの一言[ひとこと]、すなわち『わたしは死[し]者[しゃ]の復活[ふっかつ]のゆえに、今日[こんにち]、あなたがたの前[まえ]で裁[さば]きを受[う]けている』ということのほかに、わたしに何[なに]の不正[ふせい]があるというのですか。」"
  22: "フェリクスはこの道[みち]のことをよく知[し]っていたので、彼[かれ]らの話[はなし]を延[の]ばして言[い]った。「千人隊長[せんにんたいちょう]リシアが下[くだ]って来[き]たら、あなたがたのことを裁[さば]こう。」"
  23: "そして、百人隊長[ひゃくにんたいちょう]に、パウロを監視[かんし]しながらも自由[じゆう]を与[あた]え、彼[かれ]の身内[みうち]の者[もの]が彼[かれ]に仕[つか]えることを妨[さまた]げないように命[めい]じた。"
  24: "数日[すうじつ]の後[のち]、フェリクスは、ユダヤ人[じん]である妻[つま]ドルシラと一緒[いっしょ]に来[き]て、パウロを呼[よ]び寄[よ]せ、キリスト・イエスに対[たい]する信仰[しんこう]について話[はなし]を聞[き]いた。"
  25: "パウロが、正義[せいぎ]と自制[じせい]とやがて来[く]る裁[さば]きについて論[ろん]じると、フェリクスは恐[おそ]ろしくなり、答[こた]えて言[い]った。「今[いま]はもう帰[かえ]ってくれ。機会[きかい]があったら、また呼[よ]ぶことにしよう。」"
  26: "同時[どうじ]に、フェリクスは、パウロが金[かね]を渡[わた]すだろうと期待[きたい]していたので、たびたび彼[かれ]を呼[よ]び寄[よ]せては話[はな]していた。"
  27: "二年[にねん]が過[す]ぎると、フェリクスは後任[こうにん]にポルキオ・フェストを迎[むか]えた。フェリクスはユダヤ人[じん]たちの機嫌[きげん]を取[と]ろうとして、パウロを縛[しば]ったまま残[のこ]した。"

notes:
  1: "ῥήτωρ — «ритор, защитник»; 弁護人. Ἁνανίας — アナニア; Τέρτυλλος — テルトゥロス."
  2: "Похвала наместнику — обычный зачин обвинительной речи. διορθώματα — «улучшения, преобразования»; 改革."
  3: "κράτιστε Φῆλιξ — почётное обращение; 尊いフェリクス閣下. ἀποδεχόμεθα … μετὰ πάσης εὐχαριστίας — 深く感謝しております."
  4: "ἐπιείκεια — «снисходительность»; 寛容. συντόμως — 手短に."
  5: "λοιμός — «чума, зараза»; 疫病のような者. αἵρεσις — «толк, секта»; 異端. πρωτοστάτης — 首領."
  6: "В критической базе стих кончается на ἐκρατήσαμεν; церковный текст (Елизаветинская, jp-joc) добавляет καὶ κατὰ τὸν ἡμέτερον νόμον ἠθελήσαμεν κρῖναι — 〔わたしたちの律法に従って裁こうとしました。〕."
  7: "В критической базе стиха нет («.»); церковный текст (Елизаветинская, jp-joc) читает о Лисии — стих целиком в 〔…〕."
  8: "В критической базе стих начинается с παρ' οὗ; церковный текст добавляет κελεύσας τοὺς κατηγόρους αὐτοῦ ἔρχεσθαι ἐπὶ σέ — 〔また、彼を訴える者たちに、あなたのところへ来るように命じました。〕."
  10: "εὐθύμως — «бодро, охотно»; 落ち着いて."
  14: "ἡ ὁδός — «путь»; この道, как в 22:4 (там сноска)."
  15: "ἀνάστασις δικαίων καὶ ἀδίκων — 正しい者も不正な者も復活する."
  16: "ἀπρόσκοπος συνείδησις — «непорочная совесть»; 責められることのない良心."
  17: "ἐλεημοσύναι καὶ προσφοραί — 施しと供え物."
  25: "δικαιοσύνη, ἐγκράτεια, τὸ κρίμα τὸ μέλλον — 正義、自制、やがて来る裁き. Речь Феликса — не красная."
  26: "χρήματα δοθήσεται αὐτῷ ὑπὸ τοῦ Παύλου — Феликс надеялся, что Павел даст ему денег (взятку); パウロが金を渡すだろうと期待して."
  27: "διετία — два года. Πόρκιος Φῆστος — ポルキオ・フェスト. χάριτα καταθέσθαι — «оказать услугу»; 機嫌を取ろうとして."
