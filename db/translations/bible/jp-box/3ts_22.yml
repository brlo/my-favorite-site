verses:
  1: "こうして三年[さんねん]が過[す]ぎ、シリアとイスラエルの間[あいだ]には戦[たたか]いがなかった。"
  2: "三年目[さんねんめ]に、ユダの王[おう]ヨシャファトはイスラエルの王[おう]のもとへ下[くだ]った。"
  3: "イスラエルの王[おう]は自分[じぶん]の家来[けらい]たちに言[い]った。「あなたがたは知[し]っているか。ギレアデのラモトはわたしたちのものだ。それなのに、わたしたちはそれをシリアの王[おう]の手[て]から取[と]り戻[もど]そうともせず、黙[だま]っている。」"
  4: "イスラエルの王[おう]はヨシャファトに言[い]った。「わたしと一緒[いっしょ]にギレアデのラモトへ戦[たたか]いに出[で]るか。」ヨシャファトは言[い]った。「わたしはあなたと同[おな]じだ。わたしの民[たみ]はあなたの民[たみ]と同[おな]じであり、わたしの馬[うま]はあなたの馬[うま]と同[おな]じだ。」"
  5: "ヨシャファトはイスラエルの王[おう]に言[い]った。「今日[きょう]、まず主[しゅ]に問[と]うてみてほしい。」"
  6: "イスラエルの王[おう]は預言者[よげんしゃ]をすべて、およそ四百人[よんひゃくにん]集[あつ]め、彼らに言[い]った。「わたしはギレアデのラモトへ戦[たたか]いに出[で]るべきか、それとも控[ひか]えるべきか。」彼らは言[い]った。「上[のぼ]って行[い]け。主[しゅ]は必[かなら]ずそれを王[おう]の手[て]に渡[わた]される。」"
  7: "ヨシャファトは言[い]った。「ここには、彼を通[とお]して主[しゅ]に問[と]うことのできる主[しゅ]の預言者[よげんしゃ]が、ほかにいないのか。」"
  8: "イスラエルの王[おう]はヨシャファトに言[い]った。「まだ一人[ひとり]いる。彼を通[とお]して主[しゅ]に問[と]うことができる。だが、わたしは彼を憎[にく]んでいる。彼はわたしについて良[よ]いことを語[かた]らず、悪[わる]いことばかり語[かた]るからだ。ミカヤ、イムラの子[こ]だ。」ヨシャファトは言[い]った。「王[おう]よ、そのようには言[い]わないでほしい。」"
  9: "イスラエルの王[おう]は一人[ひとり]の宦官[かんがん]を呼[よ]んで言[い]った。「すぐにミカヤ、イムラの子[こ]を連[つ]れて来[こ]い。」"
  10: "イスラエルの王[おう]とユダの王[おう]ヨシャファトは、それぞれ自分[じぶん]の王座[おうざ]に座[すわ]り、武具[ぶぐ]を身[み]につけてサマリアの門[もん]のところにいた。預言者[よげんしゃ]たちはすべて、彼らの前[まえ]で預言[よげん]していた。"
  11: "ケナアナの子[こ]ゼデキヤは自分[じぶん]のために鉄[てつ]の角[つの]を作[つく]り、言[い]った。「主[しゅ]はこう言[い]われる。『あなたはこれらの角[つの]でシリアを突[つ]き倒[たお]し、滅[ほろ]ぼし尽[つ]くすまでにする。』」"
  12: "預言者[よげんしゃ]たちはすべて同[おな]じように預言[よげん]して言[い]った。「ギレアデのラモトへ上[のぼ]って行[い]け。そうすれば成功[せいこう]し、主[しゅ]はシリアの王[おう]もあなたの手[て]に渡[わた]される。」"
  13: "ミカヤを呼[よ]びに来[き]た使者[ししゃ]は彼に言[い]った。「見[み]よ、預言者[よげんしゃ]たちは皆[みな]、一[ひと]つの口[くち]で王[おう]について良[よ]いことを語[かた]っている。どうか、あなたも彼らの一人[ひとり]と同[おな]じように語[かた]り、良[よ]いことを言[い]ってほしい。」"
  14: "ミカヤは言[い]った。「主[しゅ]は生[い]きておられる。主[しゅ]がわたしに語[かた]られることを、わたしは語[かた]る。」"
  15: "彼は王[おう]のもとへ来[き]た。王[おう]は彼に言[い]った。「ミカヤ、わたしはギレアデのラモトへ戦[たたか]いに出[で]るべきか、それとも控[ひか]えるべきか。」彼は言[い]った。「上[のぼ]って行[い]け。そうすれば成功[せいこう]し、主[しゅ]はそれを王[おう]の手[て]に渡[わた]される。」"
  16: "王[おう]は彼に言[い]った。「わたしは何度[なんど]もあなたに誓[ちか]いを立[た]てさせているではないか。主[しゅ]の名[な]によって、わたしに真実[しんじつ]を語[かた]れ。」"
  17: "ミカヤは言[い]った。「そうではない。わたしはイスラエルがすべて、羊飼[ひつじか]いのいない羊[ひつじ]の群[む]れのように山[やま]々[やま]に散[ち]らされているのを見[み]た。主[しゅ]は言[い]われた。『この者[もの]たちには主人[あるじ]がいない。それぞれ、自分[じぶん]の家[いえ]へ無事[ぶじ]に帰[かえ]れ。』」"
  18: "イスラエルの王[おう]はヨシャファトに言[い]った。「わたしはあなたに言[い]わなかったか。この者[もの]はわたしについて良[よ]いことを預言[よげん]せず、悪[わる]いことばかり預言[よげん]すると。」"
  19: "ミカヤは言[い]った。「そうではない。わたしではない。主[しゅ]の言葉[ことば]を聞[き]け。そうではない。わたしはイスラエルの神[かみ]である主[しゅ]が王座[おうざ]に座[すわ]り、天[てん]の軍勢[ぐんせい]がすべて、その周[まわ]りに、右[みぎ]と左[ひだり]に立[た]っているのを見[み]た。"
  20: "主[しゅ]は言[い]われた。『だれがイスラエルの王[おう]アハブを誘[さそ]い込[こ]んで、彼が上[のぼ]って行[い]き、ギレアデのラモトで倒[たお]れるようにするのか。』すると、ある者[もの]はこう言[い]い、ある者[もの]はこう言[い]った。"
  21: "一[ひと]つの霊[れい]が進[すす]み出[で]て、主[しゅ]の前[まえ]に立[た]ち、言[い]った。「わたしが彼を誘[さそ]い込[こ]む。」主[しゅ]は彼に言[い]われた。『何[なに]によってか。』"
  22: "彼は言[い]った。「わたしは出[で]て行[い]き、彼の預言者[よげんしゃ]たちすべての口[くち]のうちに偽[いつわ]りの霊[れい]となる。」主[しゅ]は言[い]われた。『あなたは彼を誘[さそ]い込[こ]み、それを成[な]し遂[と]げる。出[で]て行[い]け、そうしなさい。』"
  23: "そして今[いま]、見[み]よ、主[しゅ]はあなたのこれらすべての預言者[よげんしゃ]の口[くち]に偽[いつわ]りの霊[れい]を置[お]かれた。主[しゅ]はあなたについて災[わざわ]いを告[つ]げられたのだ。」"
  24: "ケナアナの子[こ]ゼデキヤは近[ちか]づいてミカヤの頬[ほお]を打[う]ち、言[い]った。「主[しゅ]の霊[れい]が、どのようにしてわたしから離[はな]れて、あなたに語[かた]ったというのか。」"
  25: "ミカヤは言[い]った。「見[み]よ、あなたはその日[ひ]、身[み]を隠[かく]そうと自分[じぶん]の宝物[たからもの]の奥[おく]の部屋[へや]に入[はい]るとき、それを目[め]の当[あ]たりにするだろう。」"
  26: "イスラエルの王[おう]は言[い]った。「ミカヤを捕[つか]まえ、彼を町[まち]の長[おさ]アモンと、王[おう]の子[こ]ヨアシュのもとへ連[つ]れて行[い]け。"
  27: "そして言[い]え。『王[おう]はこう言[い]われる。この者[もの]を牢[ろう]に入[い]れ、わたしが無事[ぶじ]に帰[かえ]って来[く]るまで、苦[くる]しみのパンと苦[くる]しみの水[みず]だけを与[あた]えておけ。』」"
  28: "ミカヤは言[い]った。「もしあなたが無事[ぶじ]に帰[かえ]って来[く]るなら、主[しゅ]はわたしによって語[かた]られなかったのだ。」そして言[い]った。「すべての民[たみ]よ、聞[き]け。」"
  29: "イスラエルの王[おう]は、ユダの王[おう]ヨシャファトとともにギレアデのラモトへ上[のぼ]って行[い]った。"
  30: "イスラエルの王[おう]はヨシャファトに言[い]った。「わたしは姿[すがた]を変[か]えて戦[たたか]いに入[はい]る。あなたはわたしの衣[ころも]を着[き]ていなさい。」イスラエルの王[おう]は姿[すがた]を変[か]えて戦[たたか]いに入[はい]った。"
  31: "シリアの王[おう]は自分[じぶん]の戦車[せんしゃ]の長[かしら]たち、三十二人[さんじゅうににん]に命[めい]じて言[い]った。「小[ちい]さな者[もの]とも大[おお]きな者[もの]とも戦[たたか]ってはならない。ただイスラエルの王[おう]、それ一人[ひとり]とだけ戦[たたか]え。」"
  32: "戦車[せんしゃ]の長[かしら]たちはヨシャファトを見[み]ると、彼らは言[い]った。「これはイスラエルの王[おう]だ。」そして彼を囲[かこ]んで戦[たたか]おうとした。ヨシャファトは叫[さけ]んだ。"
  33: "戦車[せんしゃ]の長[かしら]たちは、この者[もの]がイスラエルの王[おう]ではないと見[み]て取[と]ると、彼から離[はな]れて引[ひ]き返[かえ]した。"
  34: "一人[ひとり]の者[もの]が弓[ゆみ]を引[ひ]いて巧[たく]みに狙[ねら]い、イスラエルの王[おう]を肺[はい]と胸当[むねあ]ての間[あいだ]に射当[いあ]てた。王[おう]は自分[じぶん]の御者[ぎょしゃ]に言[い]った。「手[て]を返[かえ]して、わたしを戦[たたか]いの場[ば]から連[つ]れ出[だ]せ。わたしは傷[きず]を負[お]った。」"
  35: "その日[ひ]、戦[たたか]いは激[はげ]しくなり、王[おう]はシリアの向[む]かい側[がわ]で、朝[あさ]から夕方[ゆうがた]まで戦車[せんしゃ]の上[うえ]に立[た]っていた。傷口[きずぐち]から血[ち]が戦車[せんしゃ]の底[そこ]へ流[なが]れ出[で]た。彼は夕方[ゆうがた]に死[し]に、傷[きず]の血[ち]は戦車[せんしゃ]の底[そこ]まで流[なが]れ続[つづ]けた。"
  36: "日[ひ]が沈[しず]むころ、陣[じん]の触[ふ]れ役[やく]が立[た]って言[い]った。「おのおの、自分[じぶん]の町[まち]へ、自分[じぶん]の地[ち]へ帰[かえ]れ、"
  37: "王[おう]が死[し]んだからだ。」人々[ひとびと]はサマリアへ来[き]て、王[おう]をサマリアに葬[ほうむ]った。"
  38: "彼らは戦車[せんしゃ]をサマリアの泉[いずみ]のほとりで洗[あら]った。豚[ぶた]と犬[いぬ]がその血[ち]をなめ、遊女[ゆうじょ]たちがその血[ち]で身[み]を洗[あら]った。主[しゅ]が語[かた]られた言葉[ことば]のとおりであった。"
  39: "アハブの残[のこ]りの事[こと]ども、彼が行[おこな]ったすべてのこと、彼が建[た]てた象牙[ぞうげ]の家[いえ]、彼が建[た]てたすべての町[まち]は、イスラエルの王[おう]たちの日誌[にっし]の書[しょ]に記[しる]されているではないか。"
  40: "アハブは先祖[せんぞ]たちとともに眠[ねむ]り、その子[こ]アハズヤが彼に代[か]わって王[おう]となった。"
  41: "アサの子[こ]ヨシャファトはユダの王[おう]となった。彼が王[おう]となったのは、イスラエルの王[おう]アハブの第四年[だいよねん]であった。"
  42: "ヨシャファトは王[おう]となったとき三十五歳[さんじゅうごさい]で、エルサレムで二十五年[にじゅうごねん]治[おさ]めた。母[はは]の名[な]はアズバ、セレイの娘[むすめ]であった。"
  43: "彼は父[ちち]アサの道[みち]をすべて歩[あゆ]み、そこから離[はな]れなかった。主[しゅ]の目[め]に正[ただ]しいことを行[おこな]った。ただ、高[たか]い所[ところ]は取[と]り除[のぞ]かなかった。民[たみ]はなお、高[たか]い所[ところ]で犠牲[ぎせい]をささげ、香[こう]をたいた。"
  44: "ヨシャファトはイスラエルの王[おう]と平和[へいわ]を結[むす]んだ。"
  45: "ヨシャファトの残[のこ]りの事[こと]ども、彼の力[ちから]ある行[おこな]いのすべて、すなわち彼が行[おこな]ったすべてのことは、ユダの王[おう]たちの日誌[にっし]の書[しょ]に記[しる]されているではないか。"
  46: "彼は、父[ちち]アサの時代[じだい]に残[のこ]っていた忌[い]まわしい者[もの]たちを、地[ち]から取[と]り除[のぞ]いた。"
  47: "エドムには、王[おう]として立[た]てられた者[もの]がいなかった。"
  48: "ヨシャファトはタルシシュの船[ふね]を造[つく]り、金[きん]を求[もと]めてオフィルへ行[い]こうとした。しかし、船[ふね]はエツヨン・ゲベルで壊[こわ]れたので、行[い]くことができなかった。"
  49: "そのとき、アハブの子[こ]アハズヤはヨシャファトに言[い]った。「わたしのしもべたちを、あなたのしもべたちと一緒[いっしょ]に船[ふね]に乗[の]せて行[い]かせてほしい。」しかしヨシャファトは応[おう]じなかった。"
  50: "ヨシャファトは先祖[せんぞ]たちとともに眠[ねむ]り、先祖[せんぞ]たちのそば、父[ちち]ダビデの町[まち]に葬[ほうむ]られた。その子[こ]ヨラムが彼に代[か]わって王[おう]となった。"
  51: "アハブの子[こ]アハズヤは、ヨシャファトの第十七年[だいじゅうななねん]にサマリアでイスラエルの王[おう]となり、イスラエルを二年[にねん]治[おさ]めた。"
  52: "彼は主[しゅ]の目[め]に悪[わる]いことを行[おこな]い、父[ちち]アハブの道[みち]、母[はは]イゼベルの道[みち]、またイスラエルに罪[つみ]を犯[おか]させたネバトの子[こ]ヤロブアムの家[いえ]の罪[つみ]の道[みち]を歩[あゆ]んだ。"
  53: "彼はバアルに仕[つか]え、それを拝[おが]み、イスラエルの神[かみ]である主[しゅ]を怒[いか]らせた。すべて、彼より前[まえ]の者[もの]たちが行[おこな]ったとおりであった。"

notes:
  1: "ἐκάθισεν — «сидел», т. е. пребывал в покое (καθίζω); подлежащее не выражено. τρία ἔτη — три года. ἀνὰ μέσον — «между». Речь о перемирии после войн с Сирией."
  2: "ἐγενήθη ἐν τῷ ἐνιαυτῷ τῷ τρίτῳ — «было в третий год». κατέβη — «сошёл»: из Иудеи в Самарию путь идёт вниз. πρὸς βασιλέα Ισραηλ — «к царю Израиля»."
  3: "Ρεμμαθ Γαλααδ — Рамоф Галаадский (ギレアデのラモト; в слав. «Реммаф Галаадский»; ср. Нав 20:5). Εἰ οἴδατε — «знаете ли». σιωπῶμεν — «молчим», т. е. бездействуем. ἐκ χειρὸς βασιλέως Συρίας — «из руки царя Сирии»."
  4: "Ἀναβήσῃ μεθ᾿ ἡμῶν... εἰς πόλεμον — «взойдёшь ли с нами на войну». Καθὼς ἐγὼ οὕτως καὶ σύ — «как я, так и ты»: формула союза; далее народ и кони. В гр именно ἵπποι — кони, не колесницы."
  5: "Ἐπερωτήσατε δή — императив мн. ч. «спросите же»; обращение, возможно, к царю и его людям. σήμερον — «сегодня»; в слав. «днесь»."
  6: "συνήθροισεν — «собрал» (συναθροίζω). ὡς τετρακοσίους — «около четырёхсот». ἐπίσχω — «удержусь, воздержусь». διδοὺς δώσει — усиленная форма: «непременно предаст» (букв. «дая даст»). εἰς χεῖρας τοῦ βασιλέως — «в руки царя»."
  7: "Οὐκ ἔστιν ὧδε — «нет ли здесь». ἐπερωτήσομεν — будущее в значении намерения: «чтобы нам вопросить». δι᾿ αὐτοῦ — «через него»."
  8: "Ἔτι ἔστιν ἀνὴρ εἷς — «ещё есть один человек». μεμίσηκα — перфект «возненавидел» (μισέω). ἀλλ᾿ ἢ κακά — «но только худое». Μιχαιας υἱὸς Ιεμλα — Михей, сын Иемлы (ミカヤ、イムラの子; в слав. «Михеа сын Иемвлаань»). Μὴ λεγέτω ὁ βασιλεὺς οὕτως — «пусть царь так не говорит»: вежливое 3-е лицо в обращении."
  9: "εὐνοῦχος — «евнух», придворный (宦官); в гр не сказано, какой именно чин. Τάχος — наречие «быстро»."
  10: "ἐκάθηντο — имперфект «сидели». ἔνοπλοι — «вооружённые» (ἔνοπλος). ἐν ταῖς πύλαις Σαμαρείας — «у ворот Самарии»; ru добавляет «на площади» и «в царских одеждах» — в гр этого нет. ἐπροφήτευον — «пророчествовали»."
  11: "Σεδεκιας υἱὸς Χανανα — Седекия, сын Ханаана (ゼデキヤ、ケナアナの子; в слав. «Ханаань»). κέρατα σιδηρᾶ — «железные рога», символ силы. κερατιεῖς — «избодаешь» (κερατίζω). ἕως συντελεσθῇ — «доколе не истребится, не завершится»."
  12: "εὐοδώσει — «даст успех, будет успех» (εὐοδόω). εἰς χεῖράς σου — мн. ч. «в руки твои»; ср. 22:15 «в руку царя». καὶ τὸν βασιλέα Συρίας — «и царя Сирии»."
  13: "ἄγγελος — здесь «посланник», не «ангел». ἐν στόματι ἑνί — «одними устами». γίνου... εἰς λόγους σου κατὰ τοὺς λόγους ἑνός — «будь в словах твоих как слова одного из них»."
  14: "Ζῇ κύριος — клятвенная формула «жив Господь». ἃ ἂν εἴπῃ... ταῦτα λαλήσω — «что скажет... то и скажу»."
  15: "ἦλθεν πρὸς τὸν βασιλέα — «пришёл к царю». εἰ ἀναβῶ — «взойти ли мне» (1-е л. ед. ч.). εἰς χεῖρα τοῦ βασιλέως — ед. ч., «в руку царя» (не «твою»); в слав. так же."
  16: "Ποσάκις — «сколько раз». ὁρκίζω σε — «заклинаю тебя» (ὁρκίζω). ἐν ὀνόματι κυρίου — «именем Господа». В слав. «ещё дважды заклинаю» — иное понимание (дважды)."
  17: "Οὐχ οὕτως — «не так». ἑώρακα — перфект «я увидел». διεσπαρμένον — «рассеянного» (διασπείρω). Οὐ κύριος τούτοις — «нет господина у них»; слав. «не Господь ли сим в Бога?» — сбивчивое чтение, принято LXX/МТ. ἀναστρεφέτω... ἐν εἰρήνῃ — «пусть возвращается... с миром»."
  18: "Οὐκ εἶπα πρὸς σέ — «не сказал ли я тебе». ἀλλ᾿ ἢ κακά — «но только худое». διότι — «ибо, что»."
  19: "В гр-тексте: οὐχ οὕτως, οὐκ ἐγώ, ἄκουε ῥῆμα κυρίου, οὐχ οὕτως — повтор и «не я»; передано буквально. στρατιὰ τοῦ οὐρανοῦ — «воинство небесное» (天の軍勢). εἱστήκει — плюсквамперфект «стояло»."
  20: "ἀπατήσει — «обманет, склонит» (ἀπατάω); в ru «склонил бы» — передано описательно. ἀναβήσεται καὶ πεσεῖται — «взойдёт и падёт». οὗτος οὕτως καὶ οὗτος οὕτως — «этот так и этот так»."
  21: "πνεῦμα — «дух» (без артикля). ἔστη ἐνώπιον κυρίου — «стал пред Господом». Ἐν τίνι; — «чем?» (творительный средства)."
  22: "Ἐξελεύσομαι — «выйду». πνεῦμα ψευδές — «дух лживый». Ἀπατήσεις καί γε δυνήσει — «обманешь и сможешь» (γε — усиление). ἔξελθε καὶ ποίησον οὕτως — «выйди и сделай так»."
  23: "ἔδωκεν — «дал» (аорист). ἐλάλησεν ἐπὶ σὲ κακά — «изрёк о тебе (против тебя) злое»; слав. «глагола на тя злая»."
  24: "σιαγών — «щека» (頬). Ποῖον πνεῦμα κυρίου τὸ λαλῆσαν ἐν σοί — «какой дух Господень говорил в тебе»; слав. и ru добавляют «от меня» (по МТ), это чтение принято в тексте."
  25: "ὄψῃ — «увидишь». ταμίειον τοῦ ταμιείου — букв. «комната комнаты», т. е. потайная внутренняя комната; слав. «ложница сокровища твоего», ru «из одной комнаты в другую». ὅταν εἰσέλθῃς... τοῦ κρυβῆναι — «когда войдёшь... чтобы скрыться»."
  26: "Λάβετε — императив мн. ч. «возьмите». ἄρχων τῆς πόλεως — «начальник города» (町の長). Εμηρ — Емер; в слав. «Аммон», в ru «Амон»; принята форма アモン. Синтаксис продолжается в ст. 27 (к Иоасу, сыну царя)."
  27: "εἰπών — деепричастие, продолжает повеление ст. 26: «сказав [передать]». ἄρτος θλίψεως καὶ ὕδωρ θλίψεως — «хлеб скорби и вода скорби», т. е. скудная пища (слав. «хлеб печальный»). ἕως τοῦ ἐπιστρέψαι με ἐν εἰρήνῃ — «доколе я не возвращусь в мире»."
  28: "Ἐὰν ἐπιστρέφων ἐπιστρέψῃς — усилительный оборот «если возвращаясь возвратишься». οὐκ ἐλάλησεν κύριος ἐν ἐμοί — «не говорил Господь во мне, мною». Слав. добавляет «И рече: слышите, людие вси» — в гр этого нет, но по паритету включено в текст."
  29: "ἀνέβη — «взошёл». μετ᾿ αὐτοῦ — «с ним»: Иосафат пошёл вместе с Ахавом."
  30: "Συγκαλύψομαι — «прикроюсь, переоденусь» (συγκαλύπτομαι); слав. «прикрый мя» (2-е л. ед. ч.) — иное понимание. ἔνδυσαι τὸν ἱματισμόν μου — «надень одежду мою»; в ru/МТ «твои», но в гр и слав. «мою». συνεκαλύψατο — «прикрылся, переоделся»."
  31: "τριάκοντα καὶ δυσίν — «тридцати двум» (32). μικρὸν καὶ μέγαν — «малого и великого». μονώτατον — «единственного» (превосходная степень)."
  32: "Φαίνεται — «кажется, видится». ἐκύκλωσαν — «окружили» (κυκλόω). ἀνέκραξεν — «возопил» (ἀνακράζω); в гр не сказано, к кому обращён крик."
  33: "ὅτι οὐκ ἔστιν βασιλεὺς Ισραηλ οὗτος — «что это не царь Израилев». ἀπέστρεψαν ἀπ᾿ αὐτοῦ — «отступили от него»."
  34: "ἐνέτεινεν τὸ τόξον — «натянул лук». εὐστόχως — «метко» (слав. «приметно»; ru «случайно» — по МТ). ἀνὰ μέσον τοῦ πνεύμονος καὶ τοῦ θώρακος — «между лёгким и грудью, бронёй» (θώραξ); в ru «сквозь швы лат». Ἐπίστρεψον τὰς χεῖράς σου — «поверни руки», т. е. вожжи. ἡνίοχος — «возница» (御者)."
  35: "ἐτροπώθη ὁ πόλεμος — букв. «война была обращена»; слав. «умножися брань», ru «усилилось» — передано по смыслу. ἀπέχυννε — «выливалась» (ἀποχέω). κόλπος τοῦ ἅρματος — «лоно, углубление колесницы». Повтор о крови (ἐξεπορεύετο... ἕως τοῦ κόλπου) сохранён."
  36: "στρατοκῆρυξ — «военный глашатай» (陣の触れ役). δύνοντος τοῦ ἡλίου — «при заходе солнца». Стих кончается запятой: речь продолжается в ст. 37 (ὅτι τέθνηκεν ὁ βασιλεύς). В слав. «яко умре царь» отнесено к ст. 36."
  37: "ὅτι τέθνηκεν ὁ βασιλεύς — «ибо умер царь»: продолжение речи глашатая из ст. 36. ἦλθον... ἔθαψαν — «пришли... погребли»."
  38: "ἀπένιψαν — «обмыли» (ἀπονίπτω). κρήνη — «источник» (泉; в ru «пруд» — иное). ὕες — «свиньи», κύνες — «псы»; порядок в гр: свиньи и псы. πόρναι — «блудницы». κατὰ τὸ ῥῆμα κυρίου — «по слову Господа» (исполнение пророчества 21:19)."
  39: "τὰ λοιπὰ τῶν λόγων — «прочее слов». οἶκος ἐλεφάντινος — «дом из слоновой кости», т. е. украшенный слоновой костью. βιβλίον λόγων τῶν ἡμερῶν — «книга слов дней», летопись (日誌の書). οὐκ ἰδού — «не вот ли»."
  40: "ἐκοιμήθη — «почил, уснул» (формула смерти). Οχοζιας — Охозия (アハズヤ; в Синодальном Охозия). ἀντ αὐτοῦ — «вместо него»."
  41: "ἔτει τετάρτῳ τῷ Αχααβ — «в четвёртый год Ахава» (датив). ἐπὶ Ιουδα — «над Иудой»."
  42: "τριάκοντα καὶ πέντε ἐτῶν — «тридцати пяти лет». Αζουβα — Азува (アズバ). Σελει — Сели (セレイ; в слав. «Салаил», в ru «Салаиль»). θυγάτηρ — «дочь»."
  43: "ἐξέκλινεν — «уклонился» (ἐκκλίνω); ἀπ᾿ αὐτῆς — «от него», от пути. τὸ εὐθὲς ἐν ὀφθαλμοῖς κυρίου — «правое в очах Господних». Стих кончается двоеточием, продолжение в ст. 44. ἐξῆρεν — «удалил, снял» (ἐξαίρω). ἔτι — «ещё». ἐθυμίων — «кадили» (θυμιάω). В слав. этот стих соединён с 43."
  44: "εἰρήνευσεν — «жил в мире, примирился» (εἰρηνεύω); слав. «умирися»."
  45: "αἱ δυναστεῖαι αὐτοῦ — «могущества, силы его» (слав. «силы»). γεγραμμένα — «записаны». ru добавляет «как он воевал» — в гр этого нет (по МТ)."
  46: "В gr-lxx-byz на месте стиха стоит «.» — текста нет; переведено по csl 46 (слав. нумерация на один меньше). «Мерзости» — служители культа, названные так в слав.; отсюда 忌まわしい者たち. В основной текст входит без 〔…〕 по новому паритету."
  47: "В gr-lxx-byz — «.», текста нет; переведено по csl 47. «Царя не бе... поставленнаго» — «не было поставленного царя». В ru/МТ добавлено «был наместник», в слав. этого нет."
  48: "В gr-lxx-byz — «.», текста нет; переведено по csl 48. «Корабли фарсийския» — тарсийские (Θαρσις), タルシシュ. «Асеон-Гавер» — Ецион-Гавер (エツヨン・ゲベル). «Не поидоша» — не пошли, не достигли."
  49: "В gr-lxx-byz — «.», текста нет; переведено по csl 49. «Да идут раби мои...» — 3-е л. мн. ч. императива, передано просьбой. «Не восхоте» — не пожелал, отказался."
  50: "Гр 51 = слав. 50: сдвиг из-за стихов csl 47–50, отсутствующих в LXX. ἐτάφη παρὰ τοῖς πατράσιν — «погребён у отцов». πόλις Δαυιδ — город Давида (エルサレム)."
  51: "Гр 52 = слав. 51. ἐν ἔτει ἑπτακαιδεκάτῳ — «в семнадцатый год»; датив Ιωσαφατ βασιλεῖ Ιουδα — «Иосафату, царю Иуде». ἔτη δύο — «два года»."
  52: "Гр 53 = слав. 52. ἐξήμαρτεν — «ввёл в грех» (каузативное значение). οἶκος Ιεροβοαμ — «дом Иеровоама». Перечисление трёх путей (отца, матери, Иеровоама) сохранено."
  53: "Гр 54 = слав. 53. τοῖς Βααλιμ — датив мн. ч., «ваалам» (идолам); в слав. «ваалу» ед. ч. παρώργισεν — «разгневал» (παροργίζω). κατὰ πάντα τὰ γενόμενα ἔμπροσθεν αὐτοῦ — «по всему, что было прежде него»."
