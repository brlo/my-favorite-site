# jp-box, 3-я Царств, глава 22. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc для книги нет.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 22: совет Ахава с Иосафатом (1–4), вопрос о пророке Господнем (5–9),
# пророчество четырёхсот и рога Седекии (10–12), посланник и первый ответ
# Михея (13–18), видение небесного совета (19–23), удар и темница (24–28),
# поход и битва при Рамофе Галаадском (29–33), рана, смерть Ахава и
# исполнение слова Господня (34–38), итог его царствования (39–40),
# царствование Иосафата (41–49), воцарение Охозии и его нечестие (50–53).
# Нумерация — славяно-синодальная (по csl-ru): 53 стиха. Гр 43–44 слав.
# соединяет в одном 22:43, поэтому наш 43 = гр 43 + гр 44, а с 44 наш = гр 45
# (сдвиг −1). Гр 47–50 стоят как «.» (в LXX этих стихов нет), они переведены
# по csl 46–49 и входят в основной текст без 〔…〕 (новый паритет);
# слав. 50–53 = гр 51–54. Отличия отмечены в notes.
# Речь — 「…」 первого уровня, вложенная — 『…』; в видении 19–23 третий
# уровень (слова духа внутри слов Господа) снова 「…» (как Исх 3:16; Нав 9:11).
# Красного и синего нет.
# 〔…〕 нет: на месте всех стихов есть текст, кроме 46–49, где в гр стоит «.»;
# эти четыре стиха — церковное чтение csl по новому паритету, без скобок,
# отсутствие в LXX оговорено в notes.
# Сносок ⟨…⟩ нет: имена и реалии (預言者, 王座, 戦車, 宦官, 泉) уже в корпусе.
# jp-ni не использовался.
