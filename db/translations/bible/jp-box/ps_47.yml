# Псалом 47: слава Сиона (1–2), Бог — твердыня города (3), смятение царей (4–7),
# «как слышали, так и увидели» (8–9), похвала имени Божию (10), радость Сиона (11),
# обход города и память о нём (12–14).
# Красного и синего нет. Кавычек нет: прямой речи в псалме нет.
# 〔…〕 нет: все слова в gr-lxx-byz есть (проверено tmp/bracket_check.rb).
# セラ (διάψαλμα, в конце ст. 8) не передаётся — по решению пользователя, как у jp-joc.
