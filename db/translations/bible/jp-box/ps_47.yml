verses:
  0: "賛歌[さんか]。コラの子[こ]らのために。週[しゅう]の第二[だい]の日[ひ]に。"
  1: "主[しゅ]は大[おお]いなる方[かた]、わたしたちの神[かみ]の都[みやこ]、その聖[せい]なる山[やま]で、限[かぎ]りなく賛美[さんび]される。"
  2: "根[ね]を深[ふか]く下[お]ろしたシオンの山[やま]は、北[きた]の側[がわ]にそびえる美[うつく]しい高[たか]み、全[ぜん]地[ち]の喜[よろこ]びである。そこに大[だい]いなる王[おう]の都[みやこ]がある。"
  3: "神[かみ]はこの都[みやこ]の砦[とりで]のうちに、守[まも]る者[もの]として知[し]られる。"
  4: "見[み]よ、王[おう]たちは集[つど]い、そろって攻[せ]め上[のぼ]って来[き]た。"
  5: "彼[かれ]らはこれを見[み]て驚[おどろ]き、うろたえ、震[ふる]え上[あ]がった。"
  6: "恐[おそ]れが彼[かれ]らを捕[と]らえ、子[こ]を産[う]む女[おんな]の苦[くる]しみのような痛[いた]みが、そこで彼[かれ]らを襲[おそ]った。"
  7: "あなたは激[はげ]しい風[かぜ]でタルシシの船[ふね]を砕[くだ]かれる。"
  8: "わたしたちが聞[き]いたとおりに、万軍[ばんぐん]の主[しゅ]の都[みやこ]、わたしたちの神[かみ]の都[みやこ]で、わたしたちはそれを見[み]た。神[かみ]はこの都[みやこ]をとこしえに据[す]えられた。"
  9: "神[かみ]よ、わたしたちはあなたの聖所[せいしょ]のただ中[なか]で、あなたの恵[めぐ]みを思[おも]い巡[めぐ]らした。"
  10: "神[かみ]よ、あなたの名[な]がとこしえに及[およ]ぶように、あなたへの賛美[さんび]も地[ち]の果[は]てまで及[およ]ぶ。あなたの右[みぎ]の手[て]は義[ぎ]に満[み]ちている。"
  11: "主[しゅ]よ、あなたの裁[さば]きのゆえに、シオンの山[やま]は喜[よろこ]び、ユダの娘[むすめ]たちは喜[よろこ]び歌[うた]え。"
  12: "シオンを巡[めぐ]り、その周[まわ]りを取[と]り囲[かこ]め。その塔[とう]のことを語[かた]り伝[つた]えよ。"
  13: "その城[しろ]の堅[かた]さに心[こころ]を留[と]め、その館[やかた]を一[ひと]つ一[ひと]つ見[み]よ。そうして、次[つぎ]の世代[せだい]に語[かた]り伝[つた]えるためである。"
  14: "この方[かた]こそ、世々[よよ]にとこしえにわたしたちの神[かみ]である。この方[かた]がとこしえにわたしたちを牧[ぼく]してくださる。"

notes:
  0: "Ψαλμὸς ᾠδῆς τοῖς υἱοῖς Κορε· δευτέρᾳ σαββάτου — 賛歌。コラの子らのために。週の第二の日に (ψαλμὸς ᾠδῆς — «псалом песни», отсюда 賛歌; δευτέρᾳ σαββάτου — «во второй день субботы», т. е. в понедельник, день церковного чтения псалма; передано буквально 週の第二の日に). Надписание — стих 0, скобками не маркируется."
  1: "Μέγας κύριος καὶ αἰνετὸς σφόδρα — 主は大いなる方、限りなく賛美される (αἰνετός — «достохвальный»). ἐν πόλει τοῦ θεοῦ ἡμῶν, ὄρει ἁγίῳ αὐτοῦ — わたしたちの神の都、その聖なる山で (два места одной похвалы, оба сохранены)."
  2: "εὖ ῥιζῶν ἀγαλλιάματι πάσης τῆς γῆς — 根を深く下ろした…全地の喜び (εὖ ῥιζῶν — «хорошо укоренённый»; тёмное место, в церковнослав. «основания его»; передано 根を深く下ろした, без домысла). ὄρη Σιων, τὰ πλευρὰ τοῦ βορρᾶ — シオンの山は、北の側にそびえる (πλευρά — «стороны, склоны»; βορρᾶς — север, в евр. «пределы севера», образ царского города). ἡ πόλις τοῦ βασιλέως τοῦ μεγάλου — 大いなる王の都."
  3: "ὁ θεὸς ἐν ταῖς βάρεσιν αὐτῆς γινώσκεται — 神はこの都の砦のうちに…知られる (βάρις — «твердыня, башня»). ὅταν ἀντιλαμβάνηται αὐτῆς — 守る者として (ἀντιλαμβάνομαι — «защищать, поддерживать»; ср. Пс 3:5)."
  4: "ὅτι ἰδοὺ οἱ βασιλεῖς συνήχθησαν — 見よ、王たちは集い (ἰδού — 見よ, как в корпусе). ἤλθοσαν ἐπὶ τὸ αὐτό — そろって攻め上って来た (ἐπὶ τὸ αὐτό — «вместе»)."
  5: "αὐτοὶ ἰδόντες οὕτως ἐθαύμασαν — 彼らはこれを見て驚き (θαυμάζω — «дивиться»). ἐταράχθησαν, ἐσαλεύθησαν — うろたえ、震え上がった (ταράσσω / σαλεύω — два глагола смятения сохранены)."
  6: "τρόμος ἐπελάβετο αὐτῶν — 恐れが彼らを捕らえ (τρόμος — «трепет»; ἐπιλαμβάνομαι — «охватывать»). ἐκεῖ ὠδῖνες ὡς τικτούσης — 子を産む女の苦しみのような痛みがそこで彼らを襲った (ὠδίν — «родовые муки»; τίκτω — «рождать»; образ родовых схваток)."
  7: "ἐν πνεύματι βιαίῳ συντρίψεις πλοῖα Θαρσις — あなたは激しい風でタルシシの船を砕かれる (πνεῦμα βίαιον — «сильный ветер»; Θαρσις — タルシシ, далёкий западный порт; πλοῖα — 船)."
  8: "καθάπερ ἠκούσαμεν, οὕτως εἴδομεν — わたしたちが聞いたとおりに…見た (соответствие «слышали — увидели» сохранено). ἐν πόλει κυρίου τῶν δυνάμεων — 万軍の主の都で. ὁ θεὸς ἐθεμελίωσεν αὐτὴν εἰς τὸν αἰῶνα — 神はこの都をとこしえに据えられた (θεμελιόω — «полагать основание»). διάψαλμα не передаётся."
  9: "ὑπελάβομεν, ὁ θεός, τὸ ἔλεός σου — 神よ、わたしたちは…あなたの恵みを思い巡らした (ὑπολαμβάνω — «принимать, разуметь»; у jp-joc «念へり» — «помянули»; передано 思い巡らした). ἐν μέσῳ τοῦ ναοῦ σου — あなたの聖所のただ中で (ναός — 聖所)."
  10: "κατὰ τὸ ὄνομά σου, ὁ θεός, οὕτως καὶ ἡ αἴνεσίς σου ἐπὶ τὰ πέρατα τῆς γῆς — あなたの名がとこしえに及ぶように、あなたへの賛美も地の果てまで及ぶ (соответствие имени и хвалы). δικαιοσύνης πλήρης ἡ δεξιά σου — あなたの右の手は義に満ちている (πλήρης + род. — «полный чего»)."
  11: "εὐφρανθήτω τὸ ὄρος Σιων — シオンの山は喜び (εὐφραίνω — «веселить»; оптатив передан 〜び). ἀγαλλιάσθωσαν αἱ θυγατέρες τῆς Ιουδαίας — ユダの娘たちは喜び歌え (θυγατέρες Ιουδαίας — «дочери Иудеи», т. е. города Иудеи). ἕνεκεν τῶν κριμάτων σου, κύριε — 主よ、あなたの裁きのゆえに (κρίματα — «суды»)."
  12: "κυκλώσατε Σιων καὶ περιλάβετε αὐτήν — シオンを巡り、その周りを取り囲め (κυκλόω — «обходить кругом»). διηγήσασθε ἐν τοῖς πύργοις αὐτῆς — その塔のことを語り伝えよ (πύργος — 塔; διηγέομαι — «повествовать»)."
  13: "θέσθε τὰς καρδίας ὑμῶν εἰς τὴν δύναμιν αὐτῆς — その城の堅さに心を留め (δύναμις — «крепость, сила»). καταδιέλεσθε τὰς βάρεις αὐτῆς — その館を一つ一つ見よ (καταδιαιρέω — «распределять, разбирать по частям», отсюда 一つ一つ; βάρις — «чертог»). ὅπως ἂν διηγήσησθε εἰς γενεὰν ἑτέραν — 次の世代に語り伝えるためである."
  14: "οὗτός ἐστιν ὁ θεὸς ὁ θεὸς ἡμῶν εἰς τὸν αἰῶνα καὶ εἰς τὸν αἰῶνα τοῦ αἰῶνος — この方こそ、世々にとこしえにわたしたちの神である (повтор ὁ θεός не переведён дважды, чтобы не звучало как заикание). αὐτὸς ποιμανεῖ ἡμᾶς εἰς τοὺς αἰῶνας — この方がとこしえにわたしたちを牧してくださる (ποιμαίνω — «пасти»; ср. Пс 22:1)."
