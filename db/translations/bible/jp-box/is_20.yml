verses:
  1: "タナタンがアゾトに来[き]た年[とし]、アッシリアの王[おう]アルナに遣[つか]わされてアゾトと戦[たたか]い、それを取[と]ったとき、"
  2: "そのとき、主[しゅ]はアモツの子[こ]イザヤに語[かた]って言[い]われた。「行[い]って、腰[こし]から粗布[あらぬの]を取[と]り、足[あし]からサンダルを脱[ぬ]げ。」彼はそうして、裸[はだか]と裸足[はだし]で歩[あゆ]んだ。"
  3: "主[しゅ]は言[い]われた。「わたしのしもべイザヤが裸[はだか]と裸足[はだし]で三[さん]年[ねん]歩[あゆ]んだように、三[さん]年[ねん]の間[あいだ]、エジプト人[じん]とエチオピア人[じん]にとってしるしと不思議[ふしぎ]がある。"
  4: "アッシリアの王[おう]が、エジプトの捕虜[ほりょ]とエチオピアの捕虜[ほりょ]を、若[わか]い者[もの]も年[とし]寄[よ]りも、裸[はだか]と裸足[はだし]で、エジプトの恥[はじ]を現[あら]わにして連[つ]れて行[い]くからである。」"
  5: "エジプト人[じん]は、自分[じぶん]たちが信頼[しんらい]していたエチオピア人[じん]のゆえに、打[う]ち負[ま]かされて恥[は]じる。彼らはエジプト人にとって栄光[えいこう]であったからである。"
  6: "この島[しま]に住[す]む者[もの]たちは、その日[ひ]、こう言[い]う。「見[み]よ、わたしたちが助[たす]けを求[もと]めて逃[に]げ込[こ]もうとした者[もの]たち、アッシリアの王[おう]から救[すく]われることのできなかった者[もの]たちが、これである。わたしたちはどうして救[すく]われるのか。」"

notes:
  1: "Τοῦ ἔτους οὗ εἰσῆλθεν Ταναθαν εἰς Ἄζωτον — «в год, когда вошёл Танатан в Азот»: Ταναθαν — форма LXX (слав. «танафан», Син. «Тартан», ассирийский военачальник). Ἄζωτος — Азот (Ашдод). ἀπεστάλη ὑπὸ Αρνα βασιλέως Ἀσσυρίων — «послан от Арны, царя ассирийцев»: LXX Ἄρνα (слав. «арна»), у МТ и Синодального Саргон; форма LXX оставлена как есть. κατελάβετο αὐτήν — «овладел им» (καταλαμβάνω)."
  2: "ἄφελε τὸν σάκκον ἀπὸ τῆς ὀσφύος σου — «сними вретище с чресл твоих» (σάκκος — «вретище, мешковина»; ὀσφύς — «чресла, поясница»), передано 粗布. τὰ σανδάλιά σου ὑπόλυσαι ἀπὸ τῶν ποδῶν σου — «сандалии твои развяжи с ног твоих» (ὑπολύω — «развязывать»). γυμνὸς καὶ ἀνυπόδετος — «нагой и босой»: буквально, без смягчения (слав. «наг и бос»). Слав. добавляет «сыну амосову», чего в LXX нет (πρὸς Ησαιαν); по паритету внесено в текст."
  3: "Ὃν τρόπον πεπόρευται … τρία ἔτη — «как ходил… три года»; слав. повторяет «три лета» дважды («ходил… три лета, три лета будут знамения»), в LXX τρία ἔτη один раз; повтор внесён по паритету. σημεῖα καὶ τέρατα — «знамения и чудеса» (σημεῖον, τέρας). τοῖς Αἰγυπτίοις καὶ Αἰθίοψιν — «египтянам и ефиоплянам» (Αἰθίοψ — ефиоплянин)."
  4: "οὕτως ἄξει βασιλεὺς Ἀσσυρίων τὴν αἰχμαλωσίαν — «так поведёт царь ассирийский плен» (ἄγω — «вести»; αἰχμαλωσία — «плен, пленные»). νεανίσκους καὶ πρεσβύτας — «юношей и старцев». ἀνακεκαλυμμένους τὴν αἰσχύνην Αἰγύπτου — «с обнажённым срамом Египта» (ἀνακαλύπτω — «открывать»; αἰσχύνη — «стыд, срам»); буквально, без эвфемизма (слав. «откровены во стыдение египту»)."
  5: "αἰσχυνθήσονται ἡττηθέντες — «постыдятся, будучи побеждены» (ἡττάομαι). ἐπὶ τοῖς Αἰθίοψιν, ἐφ᾿ οἷς ἦσαν πεποιθότες — «из-за ефиоплян, на которых надеялись» (πεποίθασιν — перфект от πείθω). ἦσαν γὰρ αὐτοῖς δόξα — «ибо они были им слава» (слав. «бяху бо им слава»)."
  6: "οἱ κατοικοῦντες ἐν τῇ νήσῳ ταύτῃ — «живущие на острове этом» (νῆσος — «остров», здесь о приморской земле; слав. «на острове сем»). Ἰδοὺ ἡμεῖς ἦμεν πεποιθότες τοῦ φυγεῖν εἰς αὐτοὺς εἰς βοήθειαν — «вот, мы надеялись убежать к ним за помощью». οἳ οὐκ ἐδύναντο σωθῆναι ἀπὸ βασιλέως Ασσυρίων — «которые не могли спастись от царя ассирийского». καὶ πῶς ἡμεῖς σωθησόμεθα — «и как мы спасёмся?» — вопрос без ответа, сохранён. Слав. добавляет «в день оный», чего в LXX нет; внесено в текст по паритету."
