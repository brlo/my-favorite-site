#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для гл. 20 нет: в его фрагменты книги
# (3, 5–10, 13–14, 19, 25–29, 37–38, 40–43, 45, 48–50, 52, 54, 58, 60, 62–66) она не
# входит; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 20: 1–2 взятие Азота Тартаном, повеление Исаии ходить нагим и босым;
# 3–4 знамение о Египте и Ефиопии — плен нагой; 5–6 стыд уповавших на Ефиопию
# и вопрос «как спасёмся?».
# Прямая речь: 20:2 (повеление Господа), 20:3–4 (одна речь Господа), 20:6 (слова
# жителей острова). Вводные формулы вне кавычек.
# Нумерация по gr: 6 стихов, как в csl и ru. Слав. в 20:2 добавляет «сыну амосову»,
# в 20:3 повторяет «три лета», в 20:6 добавляет «в день оный» — всё внесено
# в основной текст по паритету, отмечено в notes.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).

