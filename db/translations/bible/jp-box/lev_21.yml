verses:
  1: "主[しゅ]はモーセに言[い]われた。「アロンの子[こ]らである祭司[さいし]たちに告[つ]げ、彼[かれ]らに言[い]いなさい。祭司は、自分[じぶん]の民[たみ]のうちで、死[し]んだ者[もの]のゆえに身[み]を汚[けが]してはならない。"
  2: "ただ、自分[じぶん]に最[もっと]も近[ちか]い肉親[にくしん]のため、すなわち父[ちち]、母[はは]、息子[むすこ]、娘[むすめ]、兄弟[きょうだい]のためには、"
  3: "また、近[ちか]くにいる、まだ男[おとこ]に嫁[とつ]いでいない処女[しょじょ]の姉妹[しまい]のためには、身[み]を汚[けが]すことができる。"
  4: "彼[かれ]は自分[じぶん]の民[たみ]のうちで、にわかに身[み]を汚[けが]して、自分を汚れた者[もの]としてはならない。」"
  5: "「彼[かれ]らは死[し]んだ者[もの]のために頭[あたま]を剃[そ]り上[あ]げてはならない。ひげの端[はし]をそってはならない。からだに切[き]り傷[きず]をつけてはならない。"
  6: "彼[かれ]らは自分[じぶん]の神[かみ]にとって聖[せい]なる者[もの]でなければならない。自分の神の名[な]を汚[けが]してはならない。彼らは主[しゅ]の犠牲[ぎせい]、すなわち自分の神への捧[ささ]げ物[もの]を献[ささ]げる者[もの]であり、聖なる者でなければならない。」"
  7: "「彼[かれ]らは淫[みだ]らな女[おんな]、汚[けが]された女を妻[つま]に迎[むか]えてはならない。夫[おっと]から追[お]い出[だ]された女を迎えてはならない。彼は自分[じぶん]の神[かみ]である主[しゅ]にとって聖[せい]なる者[もの]だからである。"
  8: "あなたは彼[かれ]を聖[せい]なる者[もの]としなければならない。彼はあなたがたの神[かみ]である主[しゅ]への捧[ささ]げ物[もの]を献[ささ]げる者[もの]だからである。彼は聖なる者でなければならない。わたしは聖なる者、彼[かれ]らを聖別[せいべつ]する主[しゅ]だからである。」"
  9: "「祭司[さいし]の娘[むすめ]が淫行[いんこう]によって身[み]を汚[けが]すなら、彼女[かのじょ]は父[ちち]の名[な]を汚すのである。彼女は火[ひ]で焼[や]かなければならない。」"
  10: "「兄弟[きょうだい]たちのうちから出[で]た大祭司[だいさいし]、すなわち頭[あたま]に注[そそ]がれた塗油[とゆ]の油[あぶら]を受[う]け、衣[ころも]を着[き]るために任[にん]じられた者[もの]は、頭の覆[おお]いを取[と]ってはならない。衣を裂[さ]いてはならない。"
  11: "彼[かれ]は死[し]んだ者[もの]のところへは、だれのところへも入[はい]ってはならない。父[ちち]のためにも母[はは]のためにも、身[み]を汚[けが]してはならない。"
  12: "また、聖所[せいしょ]から出[で]てはならない。自分[じぶん]の神[かみ]の聖[せい]なるものを汚[けが]してはならない。神[かみ]の塗油[とゆ]の聖なる油[あぶら]が彼[かれ]の上[うえ]にあるからである。わたしは主[しゅ]である。」"
  13: "「彼[かれ]は自分[じぶん]の一族[いちぞく]のうちから処女[しょじょ]を妻[つま]に迎[むか]えなければならない。"
  14: "寡婦[かふ]や、夫[おっと]から追[お]い出[だ]された女[おんな]、汚[けが]された女、淫[みだ]らな女を迎[むか]えてはならない。ただ、自分[じぶん]の一族[いちぞく]のうちから処女[しょじょ]を妻[つま]に迎えなければならない。"
  15: "彼[かれ]は自分[じぶん]の民[たみ]のうちで、自分の子孫[しそん]を汚[けが]してはならない。わたしは彼を聖別[せいべつ]する主[しゅ]である。」"
  16: "主[しゅ]はモーセに語[かた]って言[い]われた。"
  17: "「アロンに告[つ]げなさい。あなたの一族[いちぞく]のうち、あなたがたの代[よ]々[よ]の者[もの]で、からだに傷[きず]のある者[もの]は、だれも近[ちか]づいて自分[じぶん]の神[かみ]への捧[ささ]げ物[もの]を献[ささ]げてはならない。"
  18: "からだに傷[きず]のある者[もの]は、だれも近[ちか]づいてはならない。足[あし]の不自由[ふじゆう]な者[もの]、目[め]の見[み]えない者、鼻[はな]の欠[か]けた者、耳[みみ]の欠けた者、"
  19: "また、手[て]の折[お]れた者[もの]、足[あし]の折れた者、"
  20: "背[せ]の曲[ま]がった者[もの]、目[め]に病[やまい]のある者、目に白[しろ]い濁[にご]りのある者、ひどい皮膚病[ひふびょう]や湿疹[しっしん]のある者、陰嚢[いんのう]の片方[かたほう]のない者、"
  21: "アロン祭司[さいし]の子孫[しそん]のうち、からだに傷[きず]のある者[もの]は、だれもあなたの神[かみ]に犠牲[ぎせい]を献[ささ]げるために近[ちか]づいてはならない。彼[かれ]には傷があるからである。神[かみ]への捧[ささ]げ物[もの]を献げるために近づいてはならない。」"
  22: "「彼[かれ]は神[かみ]への捧[ささ]げ物[もの]のうち、最[もっと]も聖[せい]なるものも、聖なるものも食[た]べることができる。"
  23: "ただ、垂[た]れ幕[まく]には近[ちか]づいてはならない。祭壇[さいだん]にも近づいてはならない。彼[かれ]は傷[きず]を持[も]っているからである。自分[じぶん]の神[かみ]の聖[せい]なるものを汚[けが]してはならない。わたしは彼[かれ]らを聖別[せいべつ]する主[しゅ]だからである。」"
  24: "モーセはアロンとその子[こ]ら、およびすべてのイスラエルの子らに告[つ]げた。"

notes:
  1: "Εἰπὸν τοῖς ἱερεῦσιν — скажи священникам (εἰπόν — повелит. от εἶπον). Ἐν ταῖς ψυχαῖς οὐ μιανθήσονται — «при душах не осквернятся», т. е. от прикосновения к умершему (ψυχή здесь — умерший; слав. «над душами да не осквернятся»). μιαίνω — осквернять."
  2: "ἐν τῷ οἰκείῳ τῷ ἔγγιστα — у ближайшего родственника (οἰκεῖος «свой, домашний»; ἔγγιστα «ближе всего»). ἐπὶ πατρὶ καὶ μητρί — за отца и мать (ἐπί + дат. — «ради, по случаю»). Стих обрывается на перечислении, как в греческом; продолжение в 3-м."
  3: "παρθένος — девица. τῇ μὴ ἐκδεδομένῃ ἀνδρί — не выданной за мужа (ἐκδίδομαι «выдавать замуж»). ἐπὶ τούτοις μιανθήσεται — за этих осквернится, т. е. может оскверниться (разрешённый траур)."
  4: "ἐξάπινα — внезапно, вдруг; место тёмное: слав. «да не осквернится внезапно в людех своих, во осквернение свое», Синодальный передаёт иначе («прикосновением к кому бы то ни было»). εἰς βεβήλωσιν αὐτοῦ — в осквернение его."
  5: "φαλάκρωμα — обритие, плешь (φαλάκρωμα); οὐ ξυρηθήσεσθε τὴν κεφαλήν — не обреете голову (ξυράω). ἐπὶ νεκρῷ — по умершем. κατατεμοῦσιν ἐντομίδας — сделают нарезы (κατατέμνω)."
  6: "ἅγιοι ἔσονται τῷ θεῷ αὐτῶν — святы будут Богу своему. τὰς θυσίας κυρίου δῶρα τοῦ θεοῦ αὐτῶν — жертвы Господни, дары Бога их: два слова (θυσία, δῶρον) сохранены, как и в слав."
  7: "πόρνην — блудницу (πόρνη). βεβηλωμένην — осквернённую (βεβηλόω). ἐκβεβλημένην ἀπὸ ἀνδρός — изгнанную от мужа, т. е. разведённую. ἅγιός ἐστιν τῷ κυρίῳ θεῷ αὐτοῦ — свят он Господу Богу своему."
  8: "ἁγιάσει αὐτόν — освяти его (2 л. ед.). τὰ δῶρα κυρίου τοῦ θεοῦ ὑμῶν — дары Господа Бога вашего: в греческом «вашего», а далее «их» — лица смешаны, как и в слав. ἅγιος ἐγὼ κύριος ὁ ἁγιάζων αὐτούς — свят Я, Господь, освящающий их."
  9: "θυγάτηρ ἀνθρώπου ἱερέως — дочь человека-священника (евр. оборот). βεβηλωθῇ τοῦ ἐκπορνεῦσαι — осквернится, чтобы блудодействовать (инфинитив с τοῦ). τὸ ὄνομα τοῦ πατρὸς αὐτῆς βεβηλοῖ — имя отца своего оскверняет. ἐπὶ πυρὸς κατακαυθήσεται — огнём сожжена будет."
  10: "ὁ ἱερεὺς ὁ μέγας — священник великий, т. е. первосвященник (大祭司). τοῦ ἐπικεχυμένου ἐπὶ τὴν κεφαλὴν τοῦ ἐλαίου τοῦ χριστοῦ — на которого возлит елей помазания (gen. abs.; χριστός здесь — «помазание», не имя). τετελειωμένου ἐνδύσασθαι τὰ ἱμάτια — посвящённого облачаться в одежды (τελειόω). ἀποκιδαρώσει — снимет кидар, головную повязку (ἀποκιδαρόω, редкое слово). διαρρήξει — раздерёт (διαρρήγνυμι)."
  11: "ἐπὶ πάσῃ ψυχῇ τετελευτηκυίᾳ — к всякой умершей душе, т. е. к умершему (τελευτάω). ἐπὶ πατρὶ … οὐ μιανθήσεται — и за отца не осквернится: первосвященнику запрещено и это."
  12: "ἐκ τῶν ἁγίων οὐκ ἐξελεύσεται — из святилища не выйдет (τὰ ἅγια — святилище). τὸ ἡγιασμένον — освящённое. τὸ ἅγιον ἔλαιον τὸ χριστὸν τοῦ θεοῦ — святой елей помазания Бога его."
  13: "οὗτος — сей (подлежащее). γυναῖκα παρθένον ἐκ τοῦ γένους αὐτοῦ — жену девицу из рода его."
  14: "χήραν — вдову (χήρα). ἐκβεβλημένην, βεβηλωμένην, πόρνην — изгнанную, осквернённую, блудницу (четыре термина сохранены). ἀλλ᾽ ἢ — но только (ἀλλ᾽ ἤ)."
  15: "οὐ βεβηλώσει τὸ σπέρμα αὐτοῦ — не осквернит семени своего (σπέρμα — потомство). ὁ ἁγιάζων αὐτόν — освящающий его (ед. ч.; слав. добавляет «Бог» — колебание формулы)."
  16: "Формула введения: καὶ ἐλάλησεν κύριος πρὸς Μωυσῆν λέγων; слав. «И рече Господь к моисею, глаголя»."
  17: "Ἄνθρωπος ἐκ τοῦ γένους σου — человек из рода твоего. εἰς τὰς γενεὰς ὑμῶν — в роды ваши. μῶμος — порок, телесный недостаток; то же слово, что «порок» жертвы в 22:20, поэтому в переводе один и тот же 傷. οὐ προσελεύσεται προσφέρειν — не приступит приносить."
  18: "χωλός — хромой. τυφλός — слепой. κολοβόρριν — с укороченным носом (κολοβός + ῥίς; слав. «корносый»). ὠτότμητος — с отрезанными ушами (οὖς + τέμνω; слав. «ухорезан»). Перечисление продолжается в 19–21."
  19: "σύντριμμα χειρός / ποδός — сокрушение руки или ноги, т. е. перелом (σύντριμμα)."
  20: "κυρτός — сгорбленный. ἔφηλος — редкое слово, точное значение спорно (слав. «гноеточив очима»). πτίλος τοὺς ὀφθαλμούς — с изъяном глаз (слав. «бельмоочен»). ψώρα ἀγρία — дикая короста (ψώρα). λιχήν — лишай (λιχήν; 湿疹). μόνορχις — с одним яичком (μόνορχις; слав. «единоятрный»)."
  21: "πᾶς, ᾧ ἐστιν ἐν αὐτῷ μῶμος — всякий, у кого порок. ἐκ τοῦ σπέρματος Ααρων τοῦ ἱερέως — из семени Аарона священника. οὐκ ἐγγιεῖ τοῦ προσενεγκεῖν — не приблизится принести. τὰ δῶρα τοῦ θεοῦ οὐ προσελεύσεται προσενεγκεῖν — повтор в греческом сохранён."
  22: "τὰ δῶρα τοῦ θεοῦ τὰ ἅγια τῶν ἁγίων καὶ ἀπὸ τῶν ἁγίων — дары Бога: святое святых и из святынь (два разряда: 最も聖なるもの и 聖なるもの). φάγεται — будет есть (это ему разрешено)."
  23: "πρὸς τὸ καταπέτασμα — к завесе (καταπέτασμα; 垂れ幕). πρὸς τὸ θυσιαστήριον — к жертвеннику (祭壇). μῶμον ἔχει — порок имеет. ὁ ἁγιάζων αὐτούς — освящающий их (мн. ч. после ед., как в греческом)."
  24: "ἐλάλησεν Μωϋσῆς πρὸς Ααρων καὶ τοὺς υἱοὺς αὐτοῦ — сказал Моисей Аарону и сынам его: при втором члене предлог опущен (анаколуф, как и в слав.)."
