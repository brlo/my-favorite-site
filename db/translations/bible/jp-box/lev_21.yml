# ru (Синодальный) — только для понимания, не источник. jp-joc в Левите отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 21: святость священников — траур по родным (1–4), знаки скорби (5–6),
# брак священника (7–8), дочь священника (9), первосвященник: траур и брак
# (10–15); телесные недостатки священников (16–23), заключение (24).
# Речь Бога — 「…」 (1–15, 17–23); 16 и 24 — слова повествования.
# Красного и синего нет.
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено по базе).
# Сносок ⟨…⟩ нет: 大祭司, 垂れ幕, 祭壇, 聖所, 皮膚病 уже в корпусе или пояснены
# в предыдущих главах; 塗油 (елей помазания) понятно по контексту.
# Отличия LXX: 21:2 порядок «отец и мать» (в Синодальном наоборот, по МТ);
# 21:4 тёмное место (ἐξάπινα «внезапно»), Синодальный передаёт иначе;
# 21:24 анаколуф (второй член без предлога); 21:8 и 21:23 лица смешаны (ед./мн.).
