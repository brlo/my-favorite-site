# jp-box, Послание к Римлянам, глава 1. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 1: надписание и приветствие (1–7), благодарение и желание прийти (8–15),
# тезис о силе Евангелия (16–17), гнев Божий на язычников (18–32).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет, <j>/<mo> не ставятся.
# 〔…〕: 1:16 — церковное τοῦ Χριστοῦ; 1:29 — πορνεία; 1:31 — ἀσπόνδους.
# Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

tr_code: jp-box
book: rim
chapter: 1
draft: true

verses:
  1: "パウロ、キリスト・イエスの僕[しもべ]、召[め]された使徒[しと]、神[かみ]の福音[ふくいん]のために取[と]り分[わ]けられた者[もの]。"
  2: "この福音[ふくいん]は、神[かみ]が昔[むかし]、ご自分[じぶん]の預言者[よげんしゃ]たちを通[とお]して聖[せい]なる書[しょ]の中[なか]で約束[やくそく]されたものであり、"
  3: "その御子[みこ]についてのものである。御子[みこ]は肉[にく]に従[したが]ってダビデの子孫[しそん]から生[う]まれ、"
  4: "聖[せい]なる霊[れい]に従[したが]っては、死者[ししゃ]の復活[ふっかつ]によって、力[ちから]をもって神[かみ]の子[こ]と定[さだ]められた方[かた]、わたしたちの主[しゅ]イエス・キリストである。"
  5: "この方[かた]によって、わたしたちは{恵[めぐ]み|恩寵[おんちょう]}と使徒[しと]職[しょく]とを受[う]けた。それは、その御名[みな]のために、すべての異邦人[いほうじん]の間[あいだ]で信仰[しんこう]の従順[じゅうじゅん]が生[しょう]じるためである。"
  6: "あなたがたもまた、その中[なか]にあって、イエス・キリストに召[め]された者[もの]である。"
  7: "ローマにいるすべての者[もの]、神[かみ]に愛[あい]され、聖[せい]なる者[もの]として召[め]された者[もの]たちへ。わたしたちの父[ちち]である神[かみ]と主[しゅ]イエス・キリストから、{恵[めぐ]み|恩寵[おんちょう]}と平和[へいわ]があなたがたにありますように。"
  8: "まず第一[だいいち]に、わたしは、あなたがたすべてのために、イエス・キリストを通[とお]してわたしの神[かみ]に感謝[かんしゃ]している。あなたがたの信仰[しんこう]が全世界[ぜんせかい]に告[つ]げ知[し]らされているからである。"
  9: "なぜなら、わたしの霊[れい]をもって、その御子[みこ]の福音[ふくいん]において仕[つか]えている神[かみ]が、わたしの証人[しょうにん]である。わたしはあなたがたのことを絶[た]えず思[おも]い起[おこ]こし、"
  10: "祈[いの]りの中[なか]でいつも、何[なん]とかして今[いま]こそ、神[かみ]の御心[みこころ]によってあなたがたのもとへ行[い]く道[みち]が開[ひら]かれるようにと願[ねが]っている。"
  11: "わたしはあなたがたに会[あ]いたいと切[せつ]に願[ねが]っているからである。それは、あなたがたに何[なに]か霊[れい]の賜物[たまもの]を分[わ]け与[あた]えて、あなたがたを堅[けん]固[ご]にするためである。"
  12: "すなわち、あなたがたとわたしとが互[たが]いの信仰[しんこう]によって、あなたがたの中[なか]で共[とも]に慰[なぐさ]められるためである。"
  13: "兄弟[きょうだい]たちよ、あなたがたに知[し]ってもらいたい。わたしはこれまで何度[なんど]も、あなたがたのところへ行[い]こうと決意[けつい]したが、今[いま]に至[いた]るまで妨[さまた]げられてきた。ほかの異邦人[いほうじん]たちの間[あいだ]でそうであるように、あなたがたの間[あいだ]でも何[なに]か実[み]を結[むす]ぶためである。"
  14: "わたしは、ギリシア人[じん]にも未開[みかい]の民[たみ]にも、賢[かしこ]い者[もの]にも愚[おろ]かな者[もの]にも、負[お]い目[め]がある。"
  15: "こういうわけで、わたしとしては、ローマにいるあなたがたにも福音[ふくいん]を宣[の]べ伝[つた]える用意[ようい]がある。"
  16: "わたしは〔キリストの〕福音[ふくいん]を恥[は]じない。福音[ふくいん]は、信[しん]じるすべての者[もの]、まずユダヤ人[じん]、次[つぎ]にギリシア人[じん]を救[すく]いへと導[みちび]く神[かみ]の力[ちから]だからである。"
  17: "福音[ふくいん]の中[なか]に神[かみ]の義[ぎ]が信仰[しんこう]から信仰[しんこう]へと現[あらわ]されているからである。「義[ぎ]なる者[もの]は信仰[しんこう]によって生[い]きる」と書[か]かれているとおりである。"
  18: "なぜなら、真理[しんり]を不義[ふぎ]の中[なか]に押[お]さえている人々[ひとびと]の、あらゆる不敬虔[ふけいげん]と不義[ふぎ]の上[うえ]に、神[かみ]の怒[いか]りが天[てん]から現[あらわ]されるからである。"
  19: "神[かみ]について知[し]りうることは、彼[かれ]らの間[あいだ]に明[あき]らかなのである。神[かみ]が彼[かれ]らにそれを示[しめ]されたからである。"
  20: "世界[せかい]の創造[そうぞう]以来[いらい]、神[かみ]の見[み]えないもの、すなわち、その永遠[えいえん]の力[ちから]と神性[しんせい]は、造[つく]られたものによって知[し]られて見[み]えているからである。そのため、彼[かれ]らに弁解[べんかい]の余地[よち]はない。"
  21: "なぜなら、彼[かれ]らは神[かみ]を知[し]りながら、神[かみ]として神[かみ]を崇[あが]めず、感謝[かんしゃ]もしなかったからである。しかし、その考[かんが]えは空[むな]しくなり、愚[おろ]かな心[こころ]は暗[くら]くなった。"
  22: "自[みずか]ら賢[かしこ]いと称[しょう]しながら、愚[おろ]かになったのである。"
  23: "朽[く]ちない神[かみ]の栄光[えいこう]を、朽[く]ちる人間[にんげん]、鳥[とり]、四[よ]つ足[あし]の獣[けもの]、這[は]うものの像[ぞう]に似[に]たものに変[か]えてしまったのである。"
  24: "それゆえ、神[かみ]は彼[かれ]らを、その心[こころ]の欲[よく]のままに汚[けが]れへと渡[わた]された。彼[かれ]らが互[たが]いに自分[じぶん]の体[からだ]を辱[はずかし]めるようになるためである。"
  25: "彼[かれ]らは神[かみ]の真理[しんり]を偽[いつわ]りに変[か]え、造[つく]り主[ぬし]ではなく被造物[ひぞうぶつ]を拝[おが]み、仕[つか]えたのである。造[つく]り主[ぬし]はとこしえにほめたたえられる方[かた]である。アーメン。"
  26: "こういうわけで、神[かみ]は彼[かれ]らを恥[は]ずべき情欲[じょうよく]に渡[わた]された。彼[かれ]らの女[おんな]たちは自然[しぜん]な関係[かんけい]を自然[しぜん]に反[はん]する関係[かんけい]に変[か]えたからである。"
  27: "同[おな]じように、男[おとこ]たちも女[おんな]との自然[しぜん]な関係[かんけい]を捨[す]てて、互[たが]いへの欲[よく]に燃[も]え上[あ]がり、男[おとこ]が男[おとこ]と恥[は]ずべきことを行[おこな]い、その迷[まよ]いに対する当然[とうぜん]の報[むく]いを自分[じぶん]の身[み]に受[う]けているのである。"
  28: "また、彼[かれ]らは神[かみ]を認[みと]めて知[し]ることを良[よ]しとしなかったので、神[かみ]は彼[かれ]らを、ふさわしくないことを行[おこな]う、よこしまな心[こころ]に渡[わた]された。"
  29: "彼[かれ]らは、あらゆる不義[ふぎ]、〔淫行[いんこう]〕、悪[あく]、貪欲[どんよく]、悪意[あくい]に満[み]ち、妬[ねた]み、殺意[さつい]、争[あらそ]い、欺[あざむ]き、悪[わる]だくみに満[み]ち、陰口[かげぐち]をたたき、"
  30: "人[ひと]を侮[あなど]る者[もの]、高慢[こうまん]な者[もの]、大言[たいげん]を吐[は]く者[もの]、悪[あく]を企[たくら]む者[もの]、親[おや]に従[したが]わない者[もの]、"
  31: "分別[ふんべつ]のない者[もの]、約束[やくそく]を破[やぶ]る者[もの]、情[じょう]のない者[もの]、〔恨[うら]みを抱[いだ]く者[もの]〕、憐[あわ]れみのない者[もの]である。"
  32: "彼[かれ]らは、このようなことを行[おこな]う者[もの]は死[し]に値[あたい]するという神[かみ]の定[さだ]めを知[し]りながら、それを自分[じぶん]で行[おこな]うだけでなく、行[おこな]う者[もの]たちに同調[どうちょう]しているのである。"

notes:
  1: "Χριστοῦ Ἰησοῦ — порядок «Христос Иисус», как в греч. δοῦλος — 僕 (раб). κλητὸς ἀπόστολος — 召された使徒."
  3: "γενομένου ἐκ σπέρματος Δαυὶδ κατὰ σάρκα — «родившегося от семени Давида по плоти»; 肉に従って. κατά с винит. — «со стороны, по»."
  4: "πνεῦμα ἁγιωσύνης — «Дух святости», не τὸ πνεῦμα τὸ ἅγιον; поэтому 聖なる霊, без кальки {聖霊|聖神}. ὁρισθέντος — «поставленного, определённого»; 定められた."
  5: "εἰς ὑπακοὴν πίστεως — «в послушание веры»; 信仰の従順. ἀποστολή — 使徒職."
  7: "ἀγαπητοῖς θεοῦ — «возлюбленным Бога»; 神に愛され. κλητοῖς ἁγίοις — 聖なる者として召された者."
  9: "λατρεύω ἐν τῷ πνεύματί μου — «служу в духе моём»; 霊をもって仕えている. ᾧ — дат. от ὅς, «которому»."
  11: "χάρισμα πνευματικόν — 霊の賜物. στηριχθῆναι — «быть утверждёнными»; 堅固にする."
  14: "βάρβαροι — «варвары», то есть не-греки; 未開の民 (異邦人 оставлено для ἔθνη). ὀφειλέτης — «должник»; 負い目がある."
  16: "В критической базе τὸ εὐαγγέλιον без τοῦ Χριστοῦ; церковный текст (Елизаветинская «Евангелие Христово», jp-joc「ハリストスの福音」) читает с ним — 〔キリストの〕."
  17: "ἐκ πίστεως εἰς πίστιν — «от веры в веру»; 信仰から信仰へ. Цитата Авв 2:4. δικαιοσύνη θεοῦ — 神の義 (ключевой термин, ср. 3:21–26)."
  18: "κατεχόντων — «удерживающих, подавляющих»; 押さえている. ὀργὴ θεοῦ — 神の怒り."
  20: "ἀναπολογήτους — «безответных»; 弁解の余地がない. θειότης — 神性."
  24: "παρέδωκεν — «предал»; 渡された (1:24, 26, 28; ср. 4:25). διό — それゆえ."
  26: "φυσικὴ χρῆσις — «естественное употребление»; 自然な関係."
  29: "В критической базе нет πορνεία; церковный текст (Елизаветинская «блуда», jp-joc「淫行」) читает с ним — 〔淫行〕."
  31: "ἀσπόνδους — «непримиримых»; в критической базе нет, церковный текст (Елизаветинская «непримирительни», jp-joc「怨みを構ふる者」) читает — 〔恨みを抱く者〕. ἀσύνθετος — 約束を破る者."
  32: "δικαίωμα — «постановление, правда»; 定め. συνευδοκοῦσιν — 同調している."
