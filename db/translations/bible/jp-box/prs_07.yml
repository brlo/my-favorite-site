# jp-box, Премудрость Соломона, глава 7. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для 7–9 есть выборочно: его стихи не
# совпадают с делением gr, использован только для сверки; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 7: 1–6 Соломон о своём рождении; 7–14 его молитва и её плод (изложены
# авторским текстом, без кавычек); 15–21 природа премудрости; 22–30 двадцать два
# свойства премудрости — анафора, длинный период 22–23.
# Прямой речи нет; красного и синего нет.
# Нумерация по gr: 30 стихов. Слав. 7:1 относит «и во чреве матерни изобразихся
# плоть» (конец гр. 7:1) к 7:2; держимся деления gr. Слав. 7:22 включает два слова
# из гр. 7:23 (ἀκώλυτον, εὐεργετικόν); числа стихов это не меняет.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 知恵, 霊, 不死, 全能者 и пр. уже в корпусе.
# Имена — транслитерация греческого (LXX).

