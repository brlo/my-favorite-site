verses:
  1: "わたしもまた、すべての人[ひと]と同[おな]じ死[し]すべき人間[にんげん]であり、土[つち]から生[う]まれた最初[さいしょ]に造[つく]られた者[もの]の子孫[しそん]である。母[はは]の胎[たい]の中[なか]で肉[にく]として形[かたち]づくられた。"
  2: "十[じゅう]か月[げつ]の時[とき]をかけて、男[おとこ]の種[たね]と、眠[ねむ]りとともに交[まじ]わった快楽[かいらく]とによる血[ち]の中[なか]で固[かた]められた。"
  3: "わたしもまた、生[う]まれると、すべての者[もの]に共通[きょうつう]の空気[くうき]を吸[す]い、同[おな]じ苦[くる]しみを負[お]う地[ち]に落[お]ちて、すべての者と同じように、最初[さいしょ]の声[こえ]をあげて泣[な]いた。"
  4: "むつきに包[つつ]まれ、心[こころ]づかいとともに育[そだ]てられた。"
  5: "王[おう]たちのうちで、生[う]まれの始[はじ]まりをほかに持[も]った者[もの]は一人[ひとり]もいない。"
  6: "すべての者にとって、生[い]きる世界[せかい]への入[はい]り口[ぐち]は一[ひと]つであり、出[で]口[ぐち]も等[ひと]しい。"
  7: "それゆえ、わたしは祈[いの]った。すると、悟[さと]りがわたしに与[あた]えられた。わたしが呼[よ]び求[もと]めると、知恵[ちえ]の霊[れい]がわたしに来[き]た。"
  8: "わたしは知恵[ちえ]を王笏[おうしゃく]や王座[おうざ]よりも選[えら]び、富[とみ]は知恵と比[くら]べれば無[む]に等[ひと]しいとした。"
  9: "また、高価[こうか]な石[いし]を知恵[ちえ]に似[に]せることもしなかった。知恵の前[まえ]では、すべての金[きん]は少[すこ]しの砂[すな]であり、銀[ぎん]も知恵の前では泥[どろ]と見[み]なされるからである。"
  10: "わたしは健康[けんこう]や美[うつく]しさよりも知恵[ちえ]を愛[あい]し、光[ひかり]の代[か]わりに知恵を持つことを選[えら]んだ。知恵から出[で]る輝[かがや]きは眠[ねむ]ることがないからである。"
  11: "知恵[ちえ]とともに、すべての良[よ]いものがわたしに一度[いちど]に来[き]た。数[かぞ]えきれない富[とみ]もまた、知恵の手[て]のうちにある。"
  12: "わたしはそのすべてを喜[よろこ]んだ。知恵[ちえ]がそれらを導[みちび]くからである。しかし、知恵がそれらの母[はは]であることは知[し]らなかった。"
  13: "わたしは偽[いつわ]りなく学[まな]び、ねたみなく分[わ]け与[あた]える。知恵[ちえ]の富[とみ]を隠[かく]すことはしない。"
  14: "知恵[ちえ]は人々[ひとびと]にとって尽[つ]きることのない宝[たから]である。これを用[もち]いた者[もの]たちは、教[おし]えによる贈[おく]り物[もの]によって整[ととの]えられ、神[かみ]との友情[ゆうじょう]へと向[む]かう。"
  15: "神[かみ]がわたしに、みこころにかなって語[かた]り、与[あた]えられたものについてふさわしく思[おも]いめぐらすことをお与[あた]えくださるように。神ご自身が知恵[ちえ]の導[みちび]き手[て]であり、知恵ある者[もの]たちを正[ただ]す方[かた]であるからである。"
  16: "わたしたちも、わたしたちの言葉[ことば]も、すべての悟[さと]りも、仕事[しごと]の技[わざ]も、神[かみ]の手[て]のうちにあるからである。"
  17: "神ご自身がわたしに、存在[そんざい]するものについて偽[いつわ]りのない知識[ちしき]を与[あた]え、世界[せかい]の仕組[しく]みと元素[げんそ]の働[はたら]きを知[し]らせてくださった。"
  18: "時[とき]の始[はじ]まりと終[お]わりと中[なか]ほど、巡[めぐ]りの移[うつ]り変[か]わりと季節[きせつ]の変[か]わり、"
  19: "年[とし]の巡[めぐ]りと星[ほし]の配置[はいち]、"
  20: "生[い]き物[もの]の性質[せいしつ]と獣[けもの]の怒[いか]り、風[かぜ]の激[はげ]しさと人[ひと]の思[おも]い、植物[しょくぶつ]の違[ちが]いと根[ね]の力[ちから]、"
  21: "隠[かく]されたこと、明[あき]らかなこと、そのすべてを知[し]った。すべてのものの作り手[つくりて]である知恵[ちえ]が、わたしを教[おし]えたからである。"
  22: "知恵[ちえ]のうちには、知性[ちせい]があり、聖[せい]で、唯一[ゆいいつ]で、多[おお]くに分[わ]かれ、細[こま]やかで、動[うご]きやすく、澄[す]んでいて、汚[けが]れがなく、明[あき]らかで、害[がい]がなく、善[よ]を愛[あい]し、鋭[するど]い霊[れい]がある。"
  23: "その霊[れい]は妨[さまた]げられることがなく、善[よ]い働[はたら]きをし、人間[にんげん]への愛[あい]があり、揺[ゆ]るぎなく、堅固[けんご]で、思[おも]い煩[わずら]わず、全能[ぜんのう]で、すべてを見[み]渡[わた]し、すべての知性[ちせい]ある清[きよ]い最[もっと]も細[こま]やかな霊[れい]たちの間[あいだ]を通[とお]り抜[ぬ]ける。"
  24: "知恵[ちえ]はどの動[うご]きよりも動[うご]きやすく、その純粋[じゅんすい]さのゆえに、すべてのものを通[とお]り抜[ぬ]けて行[い]き渡[わた]る。"
  25: "知恵[ちえ]は神[かみ]の力[ちから]の蒸気[じょうき]であり、全能者[ぜんのうしゃ]の栄光[えいこう]から清[きよ]らかに流[なが]れ出[で]るものである。それゆえ、汚[けが]れたものが知恵のうちに忍[しの]び込[こ]むことはない。"
  26: "知恵[ちえ]は永遠[えいえん]の光[ひかり]の輝[かがや]きであり、神[かみ]の働[はたら]きを映[うつ]す傷[きず]のない鏡[かがみ]であり、神の善[よ]さの像[かたち]である。"
  27: "知恵[ちえ]は一[ひと]つでありながら、すべてのことをなし得[え]る。自分[じぶん]のうちにとどまりながら、すべてのものを新[あら]たにする。代[よ]々にわたって聖[せい]なる魂[たましい]のうちへ移[うつ]り、神[かみ]の友[とも]や預言者[よげんしゃ]を造[つく]り出[だ]す。"
  28: "神[かみ]は、知恵[ちえ]とともに住[す]む者[もの]のほかには、何[なに]をも愛[あい]されないからである。"
  29: "知恵[ちえ]は太陽[たいよう]よりも美[うつく]しく、星[ほし]のどの並[なら]びよりも勝[まさ]っている。光[ひかり]と比[くら]べると、知恵のほうが先[さき]である。"
  30: "光[ひかり]には夜[よる]が続[つづ]くが、知恵[ちえ]には悪[あく]も打[う]ち勝[か]てない。"

notes:
  1: "Εἰμὶ μὲν κἀγὼ θνητὸς ἄνθρωπος ἴσος ἅπασιν — «и я человек смертный, равный всем»; θνητός — смертный (слав. «смертен»). γηγενοῦς ἀπόγονος πρωτοπλάστου — «потомок земнородного первозданного»: γηγενής — рождённый от земли, πρωτόπλαστος — первосозданный (Адам); слав. «земнороднаго внук первозданнаго». καὶ ἐν κοιλίᾳ μητρὸς ἐγλύφην σάρξ — «и во чреве матери отлит в плоть»: γλύφω — вырезать, ваять (слав. «изобразихся плоть»). Слав. относит эту часть к 7:2; по gr — конец 7:1."
  2: "δεκαμηνιαίῳ χρόνῳ — «в десятимесячное время», т. е. в течение десяти месяцев; παγείς — «сгустившись, застыв» (πήγνυμι; слав. «согустився»). ἐκ σπέρματος ἀνδρὸς καὶ ἡδονῆς ὕπνῳ συνελθούσης — «от семени мужа и наслаждения, сошедшегося со сном»: родительный при παγείς, «сгущён в крови» из этих двух начал. Слав. «услаждения сном сошедшагося»."
  3: "ἔσπασα τὸν κοινὸν ἀέρα — «вдохнул общий воздух» (σπάω — втягивать, тянуть; слав. «восприях общаго аера»). ἐπὶ τὴν ὁμοιοπαθῆ κατέπεσον γῆν — «упал на землю, подверженную тому же» (ὁμοιοπαθής — слав. «подобострастную»), т. е. на ту же смертную землю. πρώτην φωνὴν ... ἴσα κλαίων — «первый голос, одинаково [со всеми] плача»: плач новорождённого у всех один."
  4: "ἐν σπαργάνοις ἀνετράφην καὶ φροντίσιν — «в пеленах вскормлен и в заботах»; σπάργανα — пелёнки, φροντίς — забота, попечение (слав. «с прилежанием»). Сжатость греческого сохранена: два дополнения при одном сказуемом."
  5: "οὐδεὶς γὰρ βασιλέων ἑτέραν ἔσχεν γενέσεως ἀρχήν — «ибо ни один из царей не имел иного начала рождения» (слав. «ни един бо царь ино име рождения начало»). Мысль: царь рождается так же, как все; она продолжается в 7:6."
  6: "μία δὲ πάντων εἴσοδος εἰς τὸν βίον ἔξοδός τε ἴση — «один у всех вход в жизнь и равный исход»; εἴσοδος — вход (рождение), ἔξοδος — выход (смерть), βίος — жизнь (слав. «в житие»). Антитеза входа и исхода сохранена."
  7: "διὰ τοῦτο εὐξάμην — «потому я помолился»; ἐπεκαλεσάμην — «призвал» (ἐπικαλέομαι). φρόνησις — разумение, рассудительность (слав. «разум»), передано 悟り. πνεῦμα σοφίας — «дух премудрости»: здесь это дар, а не лицо; в японском 知恵の霊."
  8: "προέκρινα αὐτὴν σκήπτρων καὶ θρόνων — «предпочёл её скипетрам и престолам» (προκρίνω — предпочитать); слав. «предсудих ю паче скиптров и престолов». πλοῦτον οὐδὲν ἡγησάμην ἐν συγκρίσει αὐτῆς — «богатство ничем счёл в сравнении с нею» (ἡγέομαι — считать)."
  9: "οὐδὲ ὡμοίωσα αὐτῇ λίθον ἀτίμητον — «и не уподобил ей камня драгоценного»; ἀτίμητος здесь «драгоценный, бесценный» (букв. «без цены»), слав. «каменю драгоценному»; слав. «уподобих ея каменю» меняет порядок сравнения («уподобил её камню»), смысл тот же. ψάμμος ὀλίγη — «малый песок»; πηλός — глина, грязь (слав. «брение»). Сравнения «золото — песок», «серебро — грязь» сохранены."
  10: "ὑπὲρ ὑγίειαν καὶ εὐμορφίαν — «более здоровья и красоты»; ὑγίεια — здоровье (слав. «здравия»), εὐμορφία — благообразие. προειλόμην αὐτὴν ἀντὶ φωτὸς ἔχειν — «предпочёл иметь её вместо света». ἀκοίμητον τὸ ἐκ ταύτης φέγγος — «неусыпный от неё свет»: ἀκοίμητος — не знающий сна, незаходящий (слав. «неугасаемо»), φέγγος — сияние."
  11: "ἦλθεν δέ μοι τὰ ἀγαθὰ ὁμοῦ πάντα μετ᾿ αὐτῆς — «пришли же мне все блага вместе с нею»; ὁμοῦ — вместе, сразу (слав. «вкупе»). ἀναρίθμητος πλοῦτος ἐν χερσὶν αὐτῆς — «неисчислимое богатство в руках её» (слав. «рукама ея», двойственное число)."
  12: "εὐφράνθην δὲ ἐπὶ πᾶσιν — «я возрадовался о всём»; ὅτι αὐτῶν ἡγεῖται σοφία — «ибо ими предводительствует премудрость» (ἡγέομαι — вести, предводительствовать; слав. «обладает»). γενέτις — родительница, мать (слав. «родителницу»); ἀγνοέω — не знать."
  13: "ἀδόλως — «без лукавства» (δόλος — коварство; слав. «нелестне»); ἀφθόνως — «без зависти» (φθόνος; слав. «без зависти»). μεταδίδωμι — «уделяю, передаю» (слав. «преподаю»); ἀποκρύπτομαι — скрывать."
  14: "ἀνεκλιπὴς θησαυρός — «неоскудевающее сокровище» (ἀνεκλιπής — не иссякающий; слав. «неоскудно»). οἱ κτησάμενοι — «приобретшие» (κτάομαι); слав. читает «употребившии» («употребившие»), поэтому в тексте 用いた者, а вариант LXX — в этой заметке. πρὸς θεὸν ἐστεῖλαντο φιλίαν — «направили к Богу дружбу» (στέλλω — посылать, направлять); συσταθέντες — «будучи утверждены, устроены»; παιδεία — наставление, учение (слав. «наказание»)."
  15: "δῴη — оптатив «да даст» (слав. «даде», прошедшее время, иное наклонение). κατὰ γνώμην — «по мысли, согласно разумению» (слав. «по разумению»), передано みこころにかなって. ἐνθυμηθῆναι ἀξίως τῶν δεδομένων — «помыслить достойно дарованного». ὁδηγός — вожатый, руководитель (слав. «предводитель»); διορθωτής — исправитель, наставник (слав. «исправитель»)."
  16: "ἐν γὰρ χειρὶ αὐτοῦ καὶ ἡμεῖς καὶ οἱ λόγοι ἡμῶν — «ибо в руке Его и мы, и слова наши». πᾶσα φρόνησις — «всякое разумение»; ἐργατειῶν ἐπιστήμη — «знание ремёсел, дел» (ἐργατεία — занятие, ремесло; слав. «дел художество»)."
  17: "γνῶσιν ἀψευδῆ — «неложное знание» (ἀψευδής — нелживый); σύστασις κόσμου — «устроение мира» (слав. «составление мира»); ἐνέργεια στοιχείων — «действие стихий» (στοιχεῖα — первоначала, стихии; слав. «стихий»)."
  18: "ἀρχὴν καὶ τέλος καὶ μεσότητα χρόνων — «начало, конец и середину времён» (слав. «начало и конец и средину времен»). τροπῶν ἀλλαγάς — «смены поворотов» (τροπή — поворот, солнцеворот; слав. «возвратов премены»); μεταβολὰς καιρῶν — «перемены сроков»."
  19: "ἐνιαυτοῦ κύκλους — «круги года» (ἐνιαυτός — годовой круг; слав. «лет круги»); ἄστρων θέσεις — «расположения звёзд» (θέσις — положение; слав. «звезд расположения»)."
  20: "φύσεις ζῴων — «природы животных» (φύσις; слав. «естество»); θυμοὺς θηρίων — «ярость зверей»; πνευμάτων βίας — «силы ветров» (βία — насилие, порыв; слав. «ветров усилие»). διαλογισμοὺς ἀνθρώπων — «помышления людей»; διαφορὰς φυτῶν — «различия растений» (слав. «разнство летораслем», леторасль — побег); δυνάμεις ῥιζῶν — «силы корней»."
  21: "ὅσα τέ ἐστιν κρυπτὰ καὶ ἐμφανῆ ἔγνων — «что есть скрытого и явного, я познал». ἡ πάντων τεχνῖτις ... σοφία — «всего художница премудрость» (τεχνῖτις — мастерица, художница; слав. «художница»); ἐδίδαξέν με — «научила меня». Стих — переход к описанию премудрости в 7:22–23."
  22: "Ἔστιν γὰρ ἐν αὐτῇ πνεῦμα νοερόν, ἅγιον, μονογενές ... — «ибо в ней дух разумный, святой, единородный…»: далее 22 признака при одном подлежащем πνεῦμα, без повторения слова; анафора сохранена цепью определений. νοερός — разумный, мыслящий; μονογενής — единственный в своём роде, единородный (слав. «единородный»), передано 唯一; πολυμερής — многочастный; λεπτός — тонкий. Слав. 7:22 включает также ἀκώλυτον и εὐεργετικόν — они по gr начинают 7:23; деление держим по gr."
  23: "ἀκώλυτον — «невозбранный, беспрепятственный» (κωλύω — препятствовать; слав. «невозбранен»); εὐεργετικόν — «благодетельный» (слав. «благоделателен»); φιλάνθρωπον — «человеколюбивый» (слав. «человеколюбив»). βέβαιον — твёрдый; ἀσφαλές — надёжный, безопасный (слав. «крепкий»); ἀμέριμνον — беспечальный, беззаботный (слав. «безпечальный»). παντοδύναμον — всесильный; πανεπίσκοπον — всевидящий, всё обозревающий; διὰ πάντων χωροῦν πνευμάτων νοερῶν καθαρῶν λεπτοτάτων — «проходящий через все духи разумные, чистые, тончайшие» (слав. «сквозе вся проходяй духи разумичныя, чистыя, тончайшыя»)."
  24: "πάσης κινήσεως κινητικώτερον — «подвижнее всякого движения» (сравнительная степень от κινητικός; слав. «всякаго движения подвижнейша»). διήκει ... καὶ χωρεῖ διὰ πάντων — «проникает и проходит через всё»; διὰ τὴν καθαρότητα — «по причине чистоты» (слав. «ради чистоты»)."
  25: "ἀτμίς — «пар, испарение» (слав. «пара»), передано 蒸気; ἀπόρροια — «истечение» (слав. «излияние»); εἰλικρινής — чистый, беспримесный. παντοκράτωρ — Вседержитель (全能者); μεμιαμμένον — осквернённое (μιαίνω); παρεμπίπτει — «впадает, проникает» (слав. «нападает»)."
  26: "ἀπαύγασμα — «сияние, отблеск» (ср. Евр 1:3; слав. «сияние»); φῶς ἀίδιον — «вечный свет» (ἀίδιος; слав. «присносущнаго»). ἔσοπτρον ἀκηλίδωτον — «зеркало незапятнанное» (ἀκηλίδωτος — без пятна; слав. «зерцало непорочно»); εἰκὼν τῆς ἀγαθότητος — «образ благости» (ἀγαθότης — слав. «благостыни»)."
  27: "μία δὲ οὖσα πάντα δύναται — «будучи одна, всё может» (слав. «едина же сущи всяческая может»). μένουσα ἐν αὑτῇ — «пребывая в себе»; καινίζει — «обновляет» (καινός — новый). κατὰ γενεὰς εἰς ψυχὰς ὁσίας μεταβαίνουσα — «переходя по родам в души святые» (ὅσιος — святой, преподобный; слав. «в душы преподобных»); φίλους θεοῦ καὶ προφήτας κατασκευάζει — «делает друзьями Божиими и пророками»."
  28: "οὐθὲν ... εἰ μὴ τὸν σοφίᾳ συνοικοῦντα — «ничего, кроме живущего с премудростью» (συνοικέω — жить вместе; слав. «со премудростию пребывает»). Оборот с двойным отрицанием сохранён."
  29: "εὐπρεπεστέρα ἡλίου — «благолепнее солнца» (εὐπρεπής — благовидный, прекрасный; слав. «благолепнее»); ὑπὲρ πᾶσαν ἄστρων θέσιν — «превыше всякого расположения звёзд». φωτὶ συγκρινομένη εὑρίσκεται προτέρα — «сравниваемая со светом оказывается первою» (πρότερος — первый, более ранний; слав. «обретается первая»)."
  30: "τοῦτο μὲν γὰρ διαδέχεται νύξ — «это [свет] сменяет ночь» (διαδέχομαι — принимать по наследству, сменять; слав. «преемлет»); τοῦτο относится к свету из 7:29. σοφίας δὲ οὐ κατισχύει κακία — «премудрости же не одолевает злоба» (κατισχύω — осиливать; слав. «не одолеет»)."
