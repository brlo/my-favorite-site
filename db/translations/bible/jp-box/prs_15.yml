chapter: 15
draft: true

verses:
  1: "しかし、あなたは、わたしたちの神[かみ]よ、善[ぜん]なる方[かた]、真実[しんじつ]なる方、寛容[かんよう]な方であり、あわれみによってすべてを治[おさ]めておられる。"
  2: "たとえわたしたちが罪[つみ]を犯[おか]しても、わたしたちはあなたのものである。あなたの力[ちから]を知[し]っているからである。しかし、わたしたちは罪を犯さない。あなたに数[かぞ]えられていることを知っているからである。"
  3: "あなたを知[し]ることは完全[かんぜん]な正義[せいぎ]であり、あなたの力[ちから]を知ることは不死[ふし]の根[ね]である。"
  4: "というのは、人[ひと]の悪巧[わるだく]みな思[おも]いつきも、影[かげ]を描[えが]く者[もの]たちの実[み]のらない労苦[ろうく]も、さまざまな色[いろ]で汚[よご]された姿[すがた]も、わたしたちを迷[まよ]わせなかったからである。"
  5: "その姿[すがた]は愚[おろ]かな者[もの]に欲[よく]を起[お]こさせ、息[いき]のない死[し]んだ像[ぞう]の姿を恋[こ]い慕[した]わせる。"
  6: "悪[あく]を愛[あい]する者[もの]たちは、それを行[おこな]う者も、それを恋[こい]い慕[した]う者も、それを崇[あが]める者も、そのような希望[きぼう]にふさわしい。"
  7: "というのは、陶工[とうこう]が柔[やわ]らかい土[つち]をこね、骨[ほね]の折[お]れる仕事[しごと]で、わたしたちの用[よう]に供[きょう]する一つ一つの器[うつわ]を形作[かたちづく]るからである。しかし、同じ粘土[ねんど]から、清[きよ]いわざに仕[つか]える器も、それに反[はん]する器も、すべて同[おな]じように造[つく]った。そして、これらのそれぞれの用途[ようと]は異[こと]なっており、それを裁[さば]くのは陶工である。"
  8: "また、悪[あく]に骨[ほね]を折[お]る者[もの]は、同じ粘土[ねんど]から空[むな]しい神[かみ]を造[つく]る。彼は少[すこ]し前[まえ]に土[つち]から生[う]まれ、少[すこ]し後[のち]には、魂[たましい]の負[お]い目[め]を求[もと]められて、取[と]られたその土へと去[さ]って行[い]く。"
  9: "しかし、彼[かれ]の関心[かんしん]は、自分[じぶん]がやがて疲[つか]れ果[は]てることにも、命[いのち]が短[みじか]いことにもなく、金細工師[きんざいくし]たちと張[は]り合[あ]い、銀[ぎん]を鋳[い]る者[もの]たちに倣[なら]い、青銅[せいどう]を打[う]つ者たちをまねて、偽[にせ]物[もの]を造[つく]っていることを誇[ほこ]りに思[おも]うことにある。"
  10: "彼[かれ]の心[こころ]は灰[はい]であり、その希望[きぼう]は土[つち]よりも卑[いや]しく、その命[いのち]は粘土[ねんど]よりも軽[かろ]んじられている。"
  11: "彼[かれ]は、自分[じぶん]を造[つく]った方[かた]、自分に働[はたら]く魂[たましい]を吹[ふ]き入[い]れ、命[いのち]の息[いき]を吹き込[こ]んだ方[かた]を知[し]らなかったからである。"
  12: "彼[かれ]らは、わたしたちの命[いのち]を戯[たわむ]れとみなし、暮[く]らしを利[り]益[えき]になる祝祭[しゅくさい]とみなした。どんなことからであれ、悪[あく]からでも、もうけるべきだと言[い]うのである。"
  13: "というのは、この者[もの]は、土[つち]の素材[そざい]から砕[くだ]けやすい器[うつわ]と彫像[ちょうぞう]を造[つく]りながら、自分[じぶん]が罪[つみ]を犯[おか]していることを、すべての人[ひと]よりもよく知[し]っているからである。"
  14: "しかし、あなたの民[たみ]の敵[てき]であり、民を虐[しいた]げた者[もの]たちは、みな最も愚[おろ]かで、幼[おさな]子[ご]の魂[たましい]よりも惨[みじ]めである。"
  15: "彼[かれ]らは諸国[しょこく]のすべての偶像[ぐうぞう]を神々[かみがみ]とみなしたからである。偶像には、見[み]るために目[め]を用[もち]いることも、空気[くうき]を吸[す]うために鼻[はな]を用いることも、聞[き]くために耳[みみ]を用いることも、触[さわ]るために手[て]の指[ゆび]を用いることもできず、その足[あし]は歩[あゆ]むのに役立[やくだ]たない。"
  16: "人間[にんげん]がそれらを造[つく]ったのであり、霊[れい]を借[か]り受[う]けた者[もの]がそれらを形作[かたちづく]ったのである。自分[じぶん]に似[に]た神[かみ]を造る力[ちから]のある人間は、一人[ひとり]もいないからである。"
  17: "死[し]ぬべき者[もの]でありながら、彼[かれ]は不法[ふほう]な手[て]で死んだものを造[つく]る。彼は自分[じぶん]が崇[あが]めるものよりも優[すぐ]れている。自分は生[い]きたが、それらは決[けっ]して生きたことがないからである。"
  18: "さらに、彼[かれ]らは最も憎[にく]むべき獣[けもの]を崇[あが]めている。それらは、愚[おろ]かさにおいて、他[ほか]の獣と比[くら]べて劣[おと]っているからである。"
  19: "それらは、獣[けもの]のうちで見[み]た目[め]に美[うつく]しいものとして恋[こい]い慕[した]われるほどでさえなく、神[かみ]の称賛[しょうさん]と祝福[しゅくふく]からも外[はず]れている。"

notes:
  1: "χρηστὸς καὶ ἀληθής — «благой и истинный» (χρηστός — «добрый, кроткий»); μακρόθυμος — «долготерпеливый»; ἐλέει διοικῶν τὰ πάντα — «милостью управляющий всем» (διοικέω — «вести, управлять»). csl «в милости управляяй вся»."
  2: "καὶ γὰρ ἐὰν ἁμάρτωμεν, σοί ἐσμεν — «ибо если и согрешим, мы Твои»; τὸ κράτος — «держава, сила»; οὐχ ἁμαρτησόμεθα δέ — «но не согрешим» (буд. вр. с отрицанием, уверенность); σοὶ λελογίσμεθα — «мы причтены к Тебе» (λογίζομαι — «считать, вменять»). В csl иначе: «и аще не согрешим, вемы, яко тебе вменихомся» — чтение, где отрицание относится к другому члену; держимся гр."
  3: "τὸ ἐπίστασθαί σε — «знать Тебя» (ἐπίσταμαι — «ведать, понимать»); ὁλόκληρος δικαιοσύνη — «полная, совершенная правда» (ὁλόκληρος — «цельный»); ῥίζα ἀθανασίας — «корень бессмертия» (ἀθανασία — 不死, как в 3:4; 8:13)."
  4: "κακότεχνος ἐπίνοια — «злоискусный помысел» (κακότεχνος — «лукаво искусный»); σκιαγράφων πόνος ἄκαρπος — «бесплодный труд рисующих тени» (σκιαγράφος — «живописец теней, набросок»); εἶδος σπιλωθὲν χρώμασιν διηλλαγμένοις — «образ, запятнанный разными красками» (σπιλόω — «пятнать»; διηλλαγμένοις — «различными»)."
  5: "ὧν ὄψις … εἰς ὄρεξιν ἔρχεται — «вид которых приходит к вожделению» (ὄρεξις — «желание, похоть»); ἄφροσιν — «глупым»; ποθεῖ — «жаждет, любит»; νεκρᾶς εἰκόνος εἶδος ἄπνουν — «бездыханный вид мёртвого образа» (ἄπνους — «без дыхания»)."
  6: "κακῶν ἐρασταί — «любители зла» (ἐραστής — «возлюбивший»); ἄξιοι τοιούτων ἐλπίδων — «достойные таких надежд»; οἱ δρῶντες, οἱ ποθοῦντες, οἱ σεβόμενοι — «делающие, желающие, чтящие»: три разряда, как в гр."
  7: "κεραμεύς — «горшечник» (陶工); ἁπαλὴν γῆν θλίβων — «мнущий мягкую землю»; ἐπίμοχθον — «с трудом, трудолюбиво»; ἓν ἕκαστον — «каждый [сосуд]»; τῶν καθαρῶν ἔργων δοῦλα σκεύη — «сосуды, служащие чистым делам»; τὰ ἐναντία — «противные [сосуды]»; τούτων δὲ ἑτέρου … ἡ χρῆσις — «употребление каждого из них иное»; κριτὴς ὁ πηλουργός — «судья — горшечник» (πηλουργός — «работающий с глиной»). В csl «сих же обоих коегождо есть употребление» — «у каждого из обоих своё употребление»; держимся гр."
  8: "κακόμοχθος — «злотрудящийся, трудящийся над злом»; θεὸν μάταιον — «суетного бога»; ὃς πρὸ μικροῦ ἐκ γῆς γενηθεὶς — «который незадолго до того родился из земли»; μετ᾿ ὀλίγον πορεύεται ἐξ ἧς ἐλήμφθη — «вскоре уходит туда, откуда взят»; τὸ τῆς ψυχῆς ἀπαιτηθεὶς χρέος — «с него взыщется долг души» (ἀπαιτέω — «требовать назад»); csl «истязан о душевнем долзе»."
  9: "ἔστιν αὐτῷ φροντίς — «у него забота»; κάμνειν — «трудиться до усталости»; βραχυτελῆ βίον — «кратко завершающуюся жизнь»; ἀντερείδεται χρυσουργοῖς — «соревнуется с золотых дел мастерами» (ἀντερείδω — «противодействовать, соперничать»); ἀργυροχόοις — «серебролитейщиками»; χαλκοπλάστας — «медниками, ваятелями меди»; δόξαν ἡγεῖται — «вменяет в славу»; κίβδηλα πλάσσει — «лепит поддельное»."
  10: "σποδὸς ἡ καρδία αὐτοῦ — «пепел — сердце его»; γῆς εὐτελεστέρα — «ничтожнее земли» (εὐτελής — «дешёвый, ничтожный»); πηλοῦ ἀτιμότερος — «бесчестнее глины»; ὁ βίος — «жизнь». Стих — цепь именных предложений без глагола-связки; в переводе сохранено であり…である."
  11: "ἠγνόησεν — «не познал»; τὸν πλάσαντα — «Создавшего»; ἐμπνεύσαντα … ψυχὴν ἐνεργοῦσαν — «вдохнувшего деятельную душу» (ἐνεργής — «действующий»); ἐμφυσήσαντα πνεῦμα ζωτικόν — «вдунувшего животворный дух» (πνεῦμα ζωτικόν — «дух жизни»)."
  12: "ἐλογίσαντο παίγνιον εἶναι τὴν ζωὴν ἡμῶν — «сочли жизнь нашу игрушкой» (παίγνιον — «забава»); πανηγυρισμὸν ἐπικερδῆ — «прибыльное празднество/ярмарку» (πανηγυρισμός — «всенародное празднество»); δεῖν γάρ φησιν ὅθεν δή, κἂν ἐκ κακοῦ, πορίζειν — «ибо, говорит, должно откуда бы то ни было, хотя бы из зла, добывать прибыль»: φησιν (ед. ч.) вводит слова идолослужителя, переданные косвенной речью."
  13: "οὗτος παρὰ πάντας οἶδεν — «этот более всех знает»; ὕλης γεώδους — «из земного вещества» (ὕλη — «материал»); εὔθραυστα σκεύη — «хрупкие сосуды» (εὔθραυστος — «легко ломкий»); γλυπτά — «изваяния»; δημιουργῶν — «изготовляя»."
  14: "ἀφρονέστατοι καὶ τάλανες — «глупейшие и жалкие»; ὑπὲρ ψυχὴν νηπίου — «более, чем душа младенца», т. е. хуже младенцев по разуму; οἱ ἐχθροὶ τοῦ λαοῦ σου — «враги народа Твоего»; καταδυναστεύσαντες αὐτόν — «поработившие/угнетавшие его» (καταδυναστεύω — «господствовать с насилием»)."
  15: "πάντα τὰ εἴδωλα τῶν ἐθνῶν — «все идолы язычников»; ὀμμάτων χρῆσις εἰς ὅρασιν — «употребление глаз для зрения»; ῥῖνες εἰς συνολκὴν ἀέρος — «ноздри для втягивания воздуха» (συνολκή — «втягивание»); ὦτα ἀκούειν — «уши — слышать»; δάκτυλοι χειρῶν εἰς ψηλάφησιν — «персты рук для осязания» (ψηλάφησις); οἱ πόδες … ἀργοὶ πρὸς ἐπίβασιν — «ноги праздны для шага»."
  16: "ἄνθρωπος γὰρ ἐποίησεν αὐτούς — «ибо человек сделал их»; τὸ πνεῦμα δεδανεισμένος — «заняв дух» (δανείζω — «одалживать»), т. е. получив дух взаймы; ἔπλασεν — «вылепил»; οὐδεὶς … ὅμοιον … ἰσχύει πλάσαι θεόν — «никто не может вылепить подобного себе бога»."
  17: "θνητὸς ὢν — «будучи смертным»; νεκρὸν ἐργάζεται — «делает мёртвое»; χερσὶν ἀνόμοις — «беззаконными руками»; κρείττων … τῶν σεβασμάτων αὐτοῦ — «лучше своих святынь/предметов почитания» (σέβασμα); ὧν αὐτὸς μὲν ἔζησεν, ἐκεῖνα δὲ οὐδέποτε — «из них он жил, а те никогда»: сравнительная конструкция сохранена."
  18: "τὰ ζῷα τὰ ἔχθιστα — «самых ненавистных животных» (ἔχθιστος — превосх. от ἐχθρός); σέβονται — «чтят»; ἀνοίᾳ συγκρινόμενα — «сравниваемые по безумию»; τῶν ἄλλων ἐστὶ χείρονα — «хуже других»."
  19: "οὐδ᾿ ὅσον ἐπιποθῆσαι — «даже не настолько, чтобы быть желанными» (ἐπιποθέω — «жаждать»); ὡς ἐν ζῴων ὄψει καλὰ τυγχάνει — «как бывает красиво на вид у животных»; ἐκπέφευγεν δὲ καὶ τὸν τοῦ θεοῦ ἔπαινον — «но избегли/лишились и похвалы Божией» (ἐκφεύγω — «убегать, ускользать»); τὴν εὐλογίαν αὐτοῦ — «благословения Его»."
