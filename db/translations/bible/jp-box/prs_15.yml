# jp-box, Премудрость Соломона, глава 15. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для Премудрости нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 15: утешение праведных (1–6): Бог благ и истинен, знание Его — полнота правды
# и корень бессмертия; идолы не обольстили нас. Глиняные идолы и их бессилие (7–19):
# горшечник из одной глины делает сосуды для чистого и нечистого, но лепит и суетного
# бога; сам он прах и хуже своих изделий; безумие идолослужителей, которые чтят
# и зверей; человек не может создать бога.
# Прямой речи нет; слова идолослужителя в 15:12 переданы косвенно (φησιν).
# Красного и синего нет.
# Нумерация по gr: 19 стихов; деление совпадает с csl-ru и ru.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 陶工, 粘土, 不死 и пр. уже в корпусе.
# Имена — транслитерация греческого (LXX).

