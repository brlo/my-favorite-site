# не источник. jp-joc для гл. 26 нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 26: глупец и честь (1); незаслуженное проклятие (2); бич и жезл (3);
# не отвечай и отвечай глупцу (4–5); посол-глупец (6); притча в устах глупца (7–9);
# глупость не отделить (10–12); ленивый (13–16); чужая ссора (17); обман и шутка
