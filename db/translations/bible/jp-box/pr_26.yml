verses:
  1: "刈[か]り入[い]れのときの露[つゆ]、夏[なつ]の雨[あめ]のように、愚[おろ]かな者[もの]には名誉[めいよ]がふさわしくない。"
  2: "鳥[とり]が飛[と]び去[さ]り、すずめが飛[と]び去[さ]るように、むだな呪[のろ]いは誰[だれ]にも届[とど]かない。"
  3: "馬[うま]には鞭[むち]、ろばには突[つ]き棒[ぼう]、不法[ふほう]な民[たみ]には杖[つえ]がある。"
  4: "愚[おろ]かな者[もの]の愚[おろ]かさに合[あ]わせて答[こた]えるな。あなたが彼[かれ]と同[おな]じ者[もの]にならないように。"
  5: "愚[おろ]かな者[もの]の愚[おろ]かさに合[あ]わせて答[こた]えよ。彼[かれ]が自分[じぶん]を賢[かしこ]いと思[おも]い込[こ]まないように。"
  6: "愚[おろ]かな者[もの]を遣[つか]いにして言葉[ことば]を送[おく]る者[もの]は、自分[じぶん]の足[あし]で辱[はずかし]めを飲[の]む。"
  7: "足[あし]から歩[あゆ]みを奪[うば]い去[さ]れ。愚[おろ]かな者[もの]の口[くち]からも、たとえ話[ばなし]を奪い去れ。"
  8: "石[いし]を投[な]げる紐[ひも]に結[ゆ]わえる者[もの]のように、愚[おろ]かな者[もの]に名誉[めいよ]を与[あた]える者[もの]もそうである。"
  9: "棘[とげ]が酔[よ]った者[もの]の手[て]に生[は]えるように、隷属[れいぞく]は愚[おろ]かな者[もの]の手[て]に生える。"
  10: "愚[おろ]かな者[もの]の肉[にく]はすべて、多[おお]くの嵐[あらし]にもまれる。彼[かれ]らの陶酔[とうすい]は砕[くだ]かれるからである。"
  11: "犬[いぬ]が自分[じぶん]の吐[は]いた物[もの]のところへ戻[もど]って憎[にく]まれるように、愚[おろ]かな者[もの]は自分[じぶん]の悪[あく]に返[かえ]って自分[じぶん]の罪[つみ]に戻[もど]る。罪[つみ]を招[まね]く恥[はじ]もあれば、栄光[えいこう]と恵[めぐ]みとなる恥もある。"
  12: "自分[じぶん]を賢[かしこ]いと思[おも]っている者[もの]を見[み]た。その者[もの]よりは、愚[おろ]かな者[もの]のほうがまだ希望[きぼう]がある。"
  13: "怠[なま]け者[もの]は言[い]う。「道[みち]に獅子[しし]がいる。広場[ひろば]には強盗[ごうとう]がいる。」"
  14: "戸[と]が蝶番[ちょうつがい]の上[うえ]で回[まわ]るように、怠[なま]け者[もの]は自分[じぶん]の寝床[ねどこ]の上[うえ]で回る。"
  15: "怠[なま]け者[もの]は手[て]を胸[むね]の内[うち]に隠[かく]して、それを口[くち]に持[も]って行[ゆ]くこともできない。"
  16: "怠[なま]け者[もの]は、知[し]らせを十分[じゅうぶん]に運[はこ]ぶ者[もの]よりも、自分[じぶん]には賢[かしこ]く見[み]える。"
  17: "犬[いぬ]の尾[お]をつかむ者[もの]のように、他人[たにん]の争[あらそ]いの裁[さば]きに立[た]つ者[もの]はそうである。"
  18: "人[ひと]に言葉[ことば]を投[な]げかける者[もの]は、傷[きず]を癒[いや]す者[もの]のようであり、その言葉[ことば]に出会[であ]った者[もの]がまずつまずく。"
  19: "同[おな]じように、自分[じぶん]の友[とも]を待[ま]ち伏[ぶ]せする者[もの]はすべて、見[み]つかると、「遊[あそ]びでやったのだ」と言[い]う。"
  20: "多[おお]くの薪[まき]があれば火[ひ]は燃[も]え盛[さか]る。中傷[ちゅうしょう]する者[もの]がいなければ、争[あらそ]いは静[しず]まる。"
  21: "炭[すみ]には火[ひ]皿[ざら]、火[ひ]には薪[まき]、争[あらそ]いには口[くち]うるさい者[もの]がいる。"
  22: "中傷[ちゅうしょう]する者[もの]の言葉[ことば]は柔[やわ]らかく、それは腹[はら]の奥[おく]深[ふか]くまで突[つ]き刺[さ]さる。"
  23: "欺[あざむ]きとともに与[あた]えられる銀[ぎん]は、土器[どき]のように思[おも]われるべきである。滑[なめ]らかな唇[くちびる]は悲[かな]しみに満[み]ちた心[こころ]を覆[おお]う。"
  24: "敵[てき]は泣[な]きながら唇[くちびる]ですべてにうなずき、心[こころ]のうちでは欺[あざむ]きを企[たくら]む。"
  25: "敵[てき]が大[おお]きな声[こえ]であなたに頼[たの]んでも、信[しん]じるな。彼[かれ]の魂[たましい]のうちには七[なな]つの悪[わる]があるからである。"
  26: "憎[にく]しみを隠[かく]す者[もの]は欺[あざむ]きをたくらむ。しかし、思慮[しりょ]ある者[もの]は会合[かいごう]の場[ば]で自分[じぶん]の罪[つみ]を明[あき]らかにする。"
  27: "穴[あな]を掘[ほ]る者[もの]はその穴[あな]に落[お]ち、石[いし]を転[ころ]がす者[もの]にはその石が戻[もど]ってくる。"
  28: "偽[いつわ]りの舌[した]は真理[しんり]を憎[にく]み、覆[おお]いのない口[くち]は混乱[こんらん]を生[う]む。"

notes:
  1: "ὥσπερ δρόσος ἐν ἀμήτῳ — «как роса в жатву» (δρόσος — «роса»); ὥσπερ ὑετὸς ἐν θέρει — «и как дождь летом»; οὕτως οὐκ ἔστιν ἄφρονι τιμή — «так нет глупому чести». Синодальный «снег летом» (по масоретскому тексту), в LXX — роса."
  2: "ὥσπερ ὄρνεα πέταται καὶ στρουθοί — «как птицы летают и воробьи» (στρουθός — «воробей»); ἀρὰ ματαία οὐκ ἐπελεύσεται οὐδενί — «клятва (проклятие) суетная не найдёт ни на кого» (ἀρά — «проклятие»; ματαιός — «тщетный»)."
  3: "ὥσπερ μάστιξ ἵππῳ καὶ κέντρον ὄνῳ — «как бич коню и стрекало ослу» (μάστιξ — «бич»; κέντρον — «жало, стрекало»); ῥάβδος ἔθνει παρανόμῳ — «жезл народу беззаконному» (ῥάβδος — «палка, жезл»); ἔθνος здесь — «род, порода». Синодальный «палка для глупых» (по масоретскому тексту)."
  4: "μὴ ἀποκρίνου ἄφρονι πρὸς τὴν ἐκείνου ἀφροσύνην — «не отвечай глупому по его глупости»; ἵνα μὴ ὅμοιος γένῃ αὐτῷ — «чтобы не стать тебе подобным ему». Ст. 4–5 противоположны по форме: и молчание, и ответ служат обличению глупости."
  5: "ἀλλὰ ἀποκρίνου ἄφρονι κατὰ τὴν ἀφροσύνην αὐτοῦ — «но отвечай глупому по глупости его»; ἵνα μὴ φαίνηται σοφὸς παρ᾽ ἑαυτῷ — «чтобы он не показался мудрым у себя», т. е. чтобы не остался в убеждении, что он мудр."
  6: "ἐκ τῶν ἑαυτοῦ ποδῶν ὄνειδος πίεται — «от своих собственных ног поношение пьёт», т. е. сам себе вредит (слав. «от путий своих поношение творит»); ὁ ἀποστείλας δι᾽ ἀγγέλου ἄφρονος λόγον — «пославший через глупого посла слово». Синодальный «подрезывает себе ноги»."
  7: "ἀφελοῦ πορείαν σκελῶν — «устрани (отними) хождение у ног» (πορεία — «ход, шествие»; σκέλος — «нога»); παροιμίαν ἐκ στόματος ἀφρόνων — «притчу (поговорку) из уст глупых». Слав. вместо παροιμία читает «законопреступление» («отими… законопреступление от уст безумных») — иное чтение; в тексте по gr — たとえ話."
  8: "ὃς ἀποδεσμεύει λίθον ἐν σφενδόνῃ — «кто привязывает камень в праще» (σφενδόνη — «праща»; ἀποδεσμεύω — «привязывать»); ὅμοιός ἐστιν τῷ διδόντι ἄφρονι δόξαν — «подобен дающему глупому славу (честь)». Смысл: честь глупцу бесполезна и опасна, как камень в праще."
  9: "ἄκανθαι φύονται ἐν χειρὶ τοῦ μεθύσου — «тернии произрастают в руке пьяницы» (ἄκανθα — «терние, колючка»; μέθυσος — «пьяница»); δουλεία δὲ ἐν χειρὶ τῶν ἀφρόνων — «и рабство (неволя) в руке глупых». Синодальный иной (по масоретскому тексту: «притча в устах глупцов»)."
  10: "πολλὰ χειμάζεται πᾶσα σὰρξ ἀφρόνων — «много волнуется (терпит бурю) всякая плоть безумных» (χειμάζομαι — «быть гонимому бурей»); συντρίβεται γὰρ ἡ ἔκστασις αὐτῶν — «сокрушается ибо исступление их» (ἔκστασις — «исступление, безумие»). Тёмное место; Синодальный иной («сильный делает всё произвольно», по масоретскому тексту)."
  11: "ὥσπερ κύων ὅταν ἐπέλθῃ ἐπὶ τὸν ἑαυτοῦ ἔμετον — «как пёс, когда возвращается на свою блевотину» (ἔμετος — «блевотина»); καὶ μισητὸς γένηται — «и бывает ненавистен»; ἀναστρέψας ἐπὶ τὴν ἑαυτοῦ ἁμαρτίαν — «возвратившись на свой грех». Подстих 11a: ἔστιν αἰσχύνη ἐπάγουσα ἁμαρτίαν, καὶ ἔστιν αἰσχύνη δόξα καὶ χάρις — «есть стыд, наводящий грех, и есть стыд — слава и благодать»; в gr и csl он в том же стихе, отдельного стиха нет."
  12: "εἶδον ἄνδρα δόξαντα παρ᾽ ἑαυτῷ σοφὸν εἶναι — «я увидел мужа, который показался себе мудрым»; ἐλπίδα μέντοι ἔσχεν μᾶλλον ἄφρων αὐτοῦ — «надежду однако имел более глупый, чем он», т. е. на глупца больше надежды."
  13: "λέγει ὀκνηρὸς ἀποστελλόμενος εἰς ὁδόν — «говорит ленивый, посылаемый в путь» (ὀκνηρός — «ленивый, медлительный»); Λέων ἐν ταῖς ὁδοῖς — «лев на дорогах»: слова ленивого — 「…」. Слав. добавляет «на стогнах же разбойницы», чего в gr нет, — по паритету внесено в основной текст без 〔…〕 (広場には強盗がいる). Синодальный «лев на площадях»."
  14: "ὥσπερ θύρα στρέφεται ἐπὶ τοῦ στρόφιγγος — «как дверь вращается на крюке (петле)» (στρόφιγξ — «петля, вертлюг»); ὀκνηρὸς ἐπὶ τῆς κλίνης αὐτοῦ — «ленивый на постели своей» (κλίνη — «ложе»)."
  15: "κρύψας ὀκνηρὸς τὴν χεῖρα ἐν τῷ κόλπῳ αὐτοῦ — «скрыв ленивый руку в недре своём» (κόλπος — «лоно, пазуха»); οὐ δυνήσεται ἐπενεγκεῖν ἐπὶ τὸ στόμα — «не сможет принести ко рту». Синодальный «опускает руку в чашу»."
  16: "σοφώτερος ἑαυτῷ ὀκνηρὸς φαίνεται — «мудрее себя ленивый кажется»; τοῦ ἐν πλησμονῇ ἀποκομίζοντος ἀγγελίαν — тёмное: «чем (тот), кто в полноте (изобилии) доставляет весть» (πλησμονή — «полнота»; ἀποκομίζω — «уносить, доставлять»); слав. «паче во изюбилии износящаго весть», Син. «семерых, отвечающих обдуманно» (по масоретскому тексту). Держимся греческого."
  17: "ὥσπερ ὁ κρατῶν κέρκου κυνός — «как держащий пса за хвост» (κέρκος — «хвост»); ὁ προεστὼς ἀλλοτρίας κρίσεως — «предстоящий чужому суду (спору)» (προΐστημι — «становиться впереди»); слав. «председателствуяй чуждему суду»."
  18: "οἱ ἰώμενοι προβάλλουσιν λόγους εἰς ἀνθρώπους — «исцеляющие (или исцеляемые) бросают слова в людей»: ἰάομαι в среднем и страдательном залоге допускает оба понимания, слав. «врачуемии» (исцеляемые); в японском взято действительное «исцеляющие», потому что страдательное даёт бессмыслицу; ὁ ἀπαντήσας τῷ λόγῳ πρῶτος ὑποσκελισθήσεται — «встретивший слово первый запнётся» (ὑποσκελίζω — «подставлять ногу»). Синодальный иной (по масоретскому тексту: «притворяющийся помешанным»)."
  19: "οὕτως πάντες οἱ ἐνεδρεύοντες τοὺς ἑαυτῶν φίλους — «так все, подстерегающие своих друзей» (ἐνεδρεύω — «устраивать засаду»); ὅταν δὲ φωραθῶσιν — «когда же будут пойманы (изобличены)» (φωράω — «ловить, изобличать»); λέγουσιν ὅτι Παίζων ἔπραξα — «говорят: играя сделал»; слова пойманного — 「…」."
  20: "ἐν πολλοῖς ξύλοις θάλλει πῦρ — «при многих дровах расцветает (разгорается) огонь» (θάλλω — «цвести, разрастаться»); ὅπου δὲ οὐκ ἔστιν δίθυμος — «где же нет двоедушного» (δίθυμος — «двоедушный», здесь «наушник, разжигатель»); ἡσυχάζει μάχη — «умолкает ссора». Синодальный «где нет наушника»."
  21: "ἐσχάρα ἄνθραξιν — «жаровня (очаг) для углей» (ἐσχάρα — «очаг, жаровня»); ξύλα πυρί — «дрова огню»; ἀνὴρ λοίδορος εἰς ταραχὴν μάχης — «муж ругатель — на возмущение ссоры» (λοίδορος — «ругатель»; ταραχή — «смятение»)."
  22: "λόγοι κερκώπων μαλακοί — «слова керкопов (льстецов, хитрецов) мягки» (κέρκωψ — «лукавый, льстец»); οὗτοι δὲ τύπτουσιν εἰς ταμίεια σπλάγχνων — «они же ударяют в сокровищницы внутренностей» (σπλάγχνα — «внутренности»), т. е. проникают до глубины."
  23: "ἀργύριον διδόμενον μετὰ δόλου ὥσπερ ὄστρακον ἡγητέον — «серебро, даваемое с обманом, должно считать как черепок (глиняный)» (ὄστρακον — «черепок»; ἡγητέον — «должно считать»); χείλη λεῖα καρδίαν καλύπτει λυπηράν — «уста гладкие покрывают сердце печальное» (λεῖος — «гладкий»)."
  24: "χείλεσιν πάντα ἐπινεύει ἀποκλαιόμενος ἐχθρός — «устами на всё кивает плачущий враг» (ἐπινεύω — «кивать в знак согласия»; ἀποκλαίομαι — «плакать»); ἐν δὲ τῇ καρδίᾳ τεκταίνεται δόλους — «в сердце же замышляет козни» (τεκταίνομαι — «строить, замышлять»)."
  25: "ἐάν σου δέηται ὁ ἐχθρὸς μεγάλῃ τῇ φωνῇ — «если умоляет тебя враг громким голосом» (δέομαι — «просить, умолять»); ἑπτὰ γάρ εἰσιν πονηρίαι ἐν τῇ ψυχῇ αὐτοῦ — «ибо семь злоб в душе его» (πονηρία — «злоба»): семь — число полноты зла."
  26: "ὁ κρύπτων ἔχθραν συνίστησιν δόλον — «скрывающий вражду составляет обман» (συνίστημι — «составлять, устраивать»); ἐκκαλύπτει δὲ τὰς ἑαυτοῦ ἁμαρτίας εὔγνωστος ἐν συνεδρίοις — «открывает же свои грехи благоразумный (узнаваемый) в собраниях» (εὔγνωστος — «легко узнаваемый, рассудительный»; ἐκκαλύπτω — «открывать»)."
  27: "ὁ ὀρύσσων βόθρον τῷ πλησίον ἐμπεσεῖται εἰς αὐτόν — «роющий яму ближнему упадёт в неё» (ὀρύσσω — «копать»; βόθρος — «яма»); ὁ κυλίων λίθον ἐφ᾽ ἑαυτὸν κυλίει — «катящий камень на себя катит» (κυλίω — «катить»)."
  28: "γλῶσσα ψευδὴς μισεῖ ἀλήθειαν — «язык лживый ненавидит истину»; στόμα δὲ ἄστεγον ποιεῖ ἀκαταστασίας — «уста же непокрытые (невоздержанные) делают нестроения» (ἄστεγος — «без крыши, невоздержанный»; ἀκαταστασία — «беспорядок»). Синодальный иной («ненавидит уязвляемых им»)."
