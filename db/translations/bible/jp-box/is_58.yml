verses:
  1: "「力[ちから]を尽[つ]くして叫[さけ]べ、惜[お]しむな。角笛[つのぶえ]のように声[こえ]を高[たか]く上[あ]げ、わたしの民[たみ]にその罪[つみ]を、ヤコブの家[いえ]にその不法[ふほう]を告[つ]げよ。"
  2: "彼[かれ]らは日[ひ]ごとにわたしを求[もと]め、わたしの道[みち]を知[し]ることを望[のぞ]む。義[ぎ]を行[おこな]い、自分[じぶん]の神[かみ]の裁[さば]きを捨[す]てなかった民[たみ]のように、彼らは今[いま]、わたしに正[ただ]しい裁[さば]きを求[もと]め、神[かみ]に近[ちか]づくことを望[のぞ]む。"
  3: "『なぜ、わたしたちは断食[だんじき]したのに、あなたは見[み]られなかったのか。わたしたちは魂[たましい]を低[ひく]くしたのに、あなたは知[し]られなかったのか』と言[い]う。見[み]よ、あなたがたの断食[だんじき]の日[ひ]に、あなたがたは自分[じぶん]の望[のぞ]みを求[もと]め、自分[じぶん]の下[した]にいる者[もの]をすべて苦[くる]しめる。"
  4: "あなたがたは裁[さば]きと争[あらそ]いのために断食[だんじき]し、拳[こぶし]でへりくだる者[もの]を打[う]つ。なぜ、今日[きょう]のように、叫[さけ]び声[ごえ]で自分[じぶん]の声[こえ]が聞[き]かれるために、わたしに断食[だんじき]するのか。"
  5: "わたしが選[えら]んだ断食[だんじき]は、人[ひと]が自分[じぶん]の魂[たましい]を低[ひく]くする日[ひ]のようなものではない。あなたが鎌[かま]のように首[くび]をかがめ、粗布[あらぬの]と灰[はい]を敷[し]いても、あなたがたはそれを、受[う]け入[い]れられる断食[だんじき]と呼[よ]ぶことはない。"
  6: "わたしが選[えら]んだ断食[だんじき]とは、こういうものではないか」——主[しゅ]は言[い]われる——「不法[ふほう]のすべての束縛[そくばく]を解[と]き、強引[ごういん]な契約[けいやく]の縄目[なわめ]をほどき、打[う]ち砕[くだ]かれた者[もの]を自由[じゆう]に送[おく]り出[だ]し、すべての不正[ふせい]な証書[しょうしょ]を引[ひ]き裂[さ]け。"
  7: "飢[う]えた者[もの]にあなたのパンを裂[さ]いて与[あた]え、宿[やど]のない貧[まず]しい者[もの]をあなたの家[いえ]に迎[むか]え入[い]れよ。裸[はだか]の者を見[み]たら着[き]せかけ、あなたの血縁[けつえん]の者[もの]から顔[かお]を背[そむ]けるな。"
  8: "そうすれば、あなたの光[ひかり]は暁[あかつき]のように破[やぶ]れて輝[かがや]き、あなたのいやしは速[すみ]やかに芽生[めば]え、あなたの義[ぎ]はあなたの前[まえ]を先立[さきだ]って進[すす]み、神[かみ]の栄光[えいこう]があなたを包[つつ]む。"
  9: "そうすれば、あなたが呼[よ]ぶとき、神[かみ]はあなたに答[こた]え、あなたがまだ語[かた]っているうちに、『見[み]よ、わたしはここにいる』と言[い]われる。あなたが自分[じぶん]のもとから束縛[そくばく]と手[て]で打[う]つことと不満[ふまん]の言葉[ことば]を除[のぞ]き、"
  10: "飢[う]えた者[もの]にあなたの魂[たましい]からパンを与[あた]え、低[ひく]くされた魂[たましい]を満[み]たすならば、あなたの光[ひかり]は暗[くら]い中[なか]に輝[かがや]き、あなたの暗[くら]さは真昼[まひる]のようになる。"
  11: "あなたの神[かみ]はいつもあなたとともにおり、あなたは自分[じぶん]の魂[たましい]が望[のぞ]むように満[み]ち足[た]り、あなたの骨[ほね]は肥[こ]え、あなたは水[みず]の満[み]ちた園[その]のように、水[みず]の絶[た]えない泉[いずみ]のようになる。あなたの骨[ほね]は草[くさ]のように芽生[めば]えて肥[こ]え、彼[かれ]らは代々[よよ]にわたって受[う]け継[つ]ぐ。"
  12: "あなたの永遠[えいえん]の荒[あ]れ野[の]は建[た]て直[なお]され、あなたの基[もとい]は代々[よよ]に永遠[えいえん]に保[たも]たれる。あなたは『囲[かこ]いを築[きず]く者[もの]』と呼[よ]ばれ、その間[あいだ]の小道[こみち]を静[しず]める。"
  13: "あなたが安息日[あんそくび]にあなたの足[あし]を引[ひ]いて、聖[せい]なる日[ひ]に自分[じぶん]の望[のぞ]みを行[おこな]わず、安息日[あんそくび]を喜[よろこ]びと呼[よ]び、あなたの神[かみ]に聖[せい]なるものとして尊[とうと]び、仕事[しごと]のためにあなたの足[あし]を上[あ]げず、怒[いか]って口[くち]から言葉[ことば]を出[だ]さないなら、"
  14: "そのとき、あなたは主[しゅ]に信頼[しんらい]する者[もの]となり、主[しゅ]はあなたを地[ち]の良[よ]い所[ところ]へ上[のぼ]らせ、あなたの父[ちち]ヤコブの嗣業[しぎょう]をあなたに食[た]べさせられる。」主[しゅ]の口[くち]がこれを語[かた]ったからである。"

notes:
  1: "Ἀναβόησον ἐν ἰσχύι — «возопи крепостью» (ἀναβοάω, ἰσχύς); μὴ φείσῃ — «не пощади» (φείδομαι); ὡς σάλπιγγα ὕψωσον τὴν φωνήν — «как трубу возвысь голос» (σάλπιγξ — труба, 角笛[つのぶえ]); ἀνάγγειλον — «возвести» (ἀναγγέλλω); ἁμαρτήματα / ἀνομίας — «грехи / беззакония» (параллелизм сохранён)."
  2: "ἐμὲ ἡμέραν ἐξ ἡμέρας ζητοῦσιν — «Меня день ото дня ищут» (ζητέω); γνῶναί μου τὰς ὁδούς — «познать пути Мои» (γινώσκω); ὡς λαὸς δικαιοσύνην πεποιηκώς — «как народ, сотворивший правду»; κρίσιν θεοῦ αὐτοῦ μὴ ἐγκαταλελοιπώς — «не оставивший суда Бога своего» (ἐγκαταλείπω); αἰτοῦσίν με κρίσιν δικαίαν — «просят у Меня суда праведного» (αἰτέω). Слав. добавляет в конце «глаголюще» — вводит речь 58:3."
  3: "λέγοντες — «говоря» (вводит слова народа — 『…』); Τί ὅτι ἐνηστεύσαμεν — «почему мы постились» (νηστεύω); ἐταπεινώσαμεν τὰς ψυχάς — «смирили души» (ταπεινόω); εὑρίσκετε τὰ θελήματα ὑμῶν — «находите хотения ваши»; ὑποχείριοι — «подручные» (подвластные); ὑπονύσσετε — «колете, мучите» (ὑπονύσσω)."
  4: "εἰς κρίσεις καὶ μάχας νηστεύετε — «для судов и ссор поститесь» (μάχη — битва, распря); τύπτετε πυγμαῖς ταπεινόν — «бьёте кулаками смиренного» (πυγμή — кулак); ἵνα τί — «для чего»; ἀκουσθῆναι ἐν κραυγῇ τὴν φωνήν — «чтобы услышан был с воплем голос» (κραυγή — вопль)."
  5: "ἐξελεξάμην — «избрал» (ἐκλέγομαι); ταπεινοῦν ἄνθρωπον τὴν ψυχήν — «смирять человеку душу»; κάμψῃς ὡς κρίκον τὸν τράχηλόν σου — «согнёшь, как кольцо (крюк), шею твою» (κρίκος — кольцо, петля); в слав. «яко серп» (鎌[かま]) — иное понимание, по паритету взято слав., вариант LXX — кольцо. σάκκος — рубище (粗布[あらぬの]), σποδός — пепел (灰[はい]); ὑποστρώσῃ — «подстелешь»; δεκτός — «приятный, угодный»."
  6: "οὐχὶ τοιαύτην νηστείαν ἐγὼ ἐξελεξάμην — «не такой ли пост Я избрал»; λῦε πάντα σύνδεσμον ἀδικίας — «разреши всякий узел неправды» (σύνδεσμος); διάλυε στραγγαλιὰς βιαίων συναλλαγμάτων — «развяжи петли насильственных сделок» (στραγγαλιά — петля, узел; βίαιος — насильственный; συνάλλαγμα — сделка, договор); ἀπόστελλε τεθραυσμένους ἐν ἀφέσει — «отпускай сокрушённых на свободу» (θραύω — сокрушать; ἄφεσις — отпущение); συγγραφή — рукописание, документ (証書[しょうしょ]); διάσπα — «разорви» (διασπάω)."
  7: "διάθρυπτε πεινῶντι τὸν ἄρτον σου — «преломляй алчущему хлеб твой» (διαθρύπτω); πτωχοὺς ἀστέγους εἴσαγε εἰς τὸν οἶκον — «нищих безкровных вводи в дом» (ἄστεγος — без крова); γυμνόν, περίβαλε — «нагого одень» (περιβάλλω); ἀπὸ τῶν οἰκείων τοῦ σπέρματός σου οὐχ ὑπερόψῃ — «от родных по плоти твоей не отвратись» (οἰκεῖος; ὑπεροράω — презирать)."
  8: "ῥαγήσεται πρώιμον τὸ φῶς σου — «разверзется рано свет твой» (ῥήγνυμι; πρώιμος — ранний, утренний); ἰάματα — «исцеления» (ἴαμα); ταχὺ ἀνατελεῖ — «скоро взойдёт» (ἀνατέλλω); προπορεύσεται — «предыдет» (προπορεύομαι); περιστελεῖ σε — «облечёт тебя» (περιστέλλω — покрывать, облекать)."
  9: "βοήσῃ … εἰσακούσεταί σου — «воззовёшь — услышит тебя» (εἰσακούω); Ἰδοὺ πάρειμι — «вот Я» (πάρεμι; слав. «се, приидох» — «пришёл»); ἀφέλῃς ἀπὸ σοῦ σύνδεσμον — «удалишь от себя узы»; χειροτονία — «указание рукой, рукоположение» (слав. «рукобиение» — удар рукой, передано «手[て]で打[う]つこと»); ῥῆμα γογγυσμοῦ — «слово ропота» (γογγυσμός)."
  10: "τὸν ἄρτον ἐκ ψυχῆς σου — «хлеб от души твоей»; ψυχὴν τεταπεινωμένην ἐμπλήσῃς — «душу смиренную (угнетённую) насытишь» (ἐμπίπλημι); ἀνατελεῖ ἐν τῷ σκότει τὸ φῶς — «взойдёт во тьме свет»; ὡς μεσημβρία — «как полдень» (μεσημβρία)."
  11: "ἔσται ὁ θεός σου μετὰ σοῦ διὰ παντός — «будет Бог твой с тобою всегда» (διά παντός); ἐμπλησθήσῃ — «насытишься»; τὰ ὀστᾶ σου πιανθήσεται — «кости твои утучнеют» (πιαίνω); κῆπος μεθύων — «сад напоенный» (букв. «пьяный», т. е. обильно орошённый; слав. «вертоград напоен»); πηγὴ ἣν μὴ ἐξέλιπεν ὕδωρ — «источник, которого не оставила вода» (ἐκλείπω); βοτάνη — «трава, зелень»; κληρονομήσουσι γενεὰς γενεῶν — «наследуют роды родов» (винительный вместо указания длительности; передано «代々[よよ]にわたって受[う]け継[つ]ぐ»). В ru/МТ «вождь твой… во время засухи» — иное."
  12: "οἰκοδομηθήσονταί σου αἱ ἔρημοι αἰώνιοι — «созиждутся пустыни твои вечные» (ἔρημος); θεμέλια — «основания» (θεμέλιος); Οἰκοδόμος φραγμῶν — «строитель оград» (φραγμός — ограда, забор; 囲[かこ]い); τρίβους — «тропы» (τρίβος); παύσεις — «успокоишь, прекратишь» (παύω). В ru/МТ «восстановитель развалин» — иное."
  13: "ἀποστρέψῃς τὸν πόδα σου ἀπὸ τῶν σαββάτων — «отвратишь ногу твою от суббот»; τοῦ μὴ ποιεῖν τὰ θελήματά σου — «чтобы не делать хотений твоих»; καλέσεις τὰ σάββατα τρυφερά — «назовёшь субботы сладостными, отрадными» (τρυφερός); ἅγια τῷ θεῷ σου — «святыми Богу твоему»; οὐκ ἀρεῖς τὸν πόδα σου ἐπ᾽ ἔργῳ — «не поднимешь ноги твоей на дело» (αἴρω); λαλήσεις λόγον ἐν ὀργῇ — «не скажешь слова в гневе» (в LXX «в гневе», у МТ «пустословить»)."
  14: "ἔσῃ πεποιθὼς ἐπὶ κύριον — «будешь уповать на Господа» (πείθω, perfect); ἀναβιβάσει σε ἐπὶ τὰ ἀγαθὰ τῆς γῆς — «возведёт тебя на блага земли» (ἀναβιβάζω); ψωμιεῖ σε τὴν κληρονομίαν Ιακωβ — «накормит тебя наследием Иакова» (ψωμίζω); τὸ στόμα κυρίου ἐλάλησεν ταῦτα — «уста Господни изрекли это». В ru/МТ «будешь иметь радость в Господе» — иное."
