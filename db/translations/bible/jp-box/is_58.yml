# jp-box, Исаия, глава 58. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный, с МТ) — только для понимания,
# не источник. jp-joc для главы есть (фрагмент), в работе не использовался;
# jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 58: 1–2 глас трубы: объяви народу грехи; 3–5 ложный пост и жалоба народа;
# 6–9 истинный пост и свет; 9–12 условия и обетования, сад и источник; 13–14 суббота
# и наследие Иакова.
# Голоса: вся глава — речь Господа в 「…」 (открывается в 1, закрывается в 14 перед
# формулой «уста Господни изрекли это»); слова народа в 3 и ответ Господа «вот Я»
# в 9 — 『…』; формула «говорит Господь» в 6 вынесена из кавычек через ——.
# Нумерация по gr: 14 стихов; у csl и ru тоже 14, сдвигов нет.
# Слав. добавлений, которых нет в LXX, в главе нет, кроме «глаголюще» в конце 58:2
# (вводит речь 58:3); расхождения чтений — в notes (58:5 «серп», 58:9 «рукобиение»).
# 〔…〕 нет; сносок ⟨…⟩ нет: 断食, 粗布, 灰, 証書, 嗣業 уже в корпусе.
# Имена — транслитерация греческого (LXX).

