verses:
  0: "ダビデの詩[うた]。"
  1: "主[しゅ]よ、わたしは心[こころ]を尽[つ]くしてあなたに感謝[かんしゃ]をささげます。あなたがわたしの口[くち]の言葉[ことば]を聞[き]かれたからです。天使[てんし]たちの前[まえ]で、わたしはあなたに歌[うた]います。"
  2: "わたしはあなたの聖[せい]なる宮[みや]に向[む]かって伏[ふ]し拝[おが]み、あなたのあわれみとあなたの真実[しんじつ]のゆえに、あなたの名[な]に感謝[かんしゃ]をささげます。あなたは、あなたの言葉[ことば]をすべての名[な]の上[うえ]に高[たか]くされたからです。"
  3: "わたしがあなたを呼[よ]ぶ日[ひ]には、すぐにわたしに答[こた]えてください。あなたはわたしの魂[たましい]を力[ちから]で強[つよ]くされます。"
  4: "主[しゅ]よ、地[ち]の王[おう]たちは皆[みな]、あなたの口[くち]の言葉[ことば]を聞[き]いて、あなたに感謝[かんしゃ]をささげる。"
  5: "そして、主[しゅ]の道[みち]を歌[うた]う。主[しゅ]の栄光[えいこう]は大[おお]きいからである。"
  6: "主[しゅ]は高[たか]く、しかも低[ひく]い者[もの]に目[め]を留[と]め、高[たか]ぶる者[もの]は遠[とお]くから知[し]っておられる。"
  7: "わたしが苦難[くなん]の中[なか]を歩[あゆ]むとき、あなたはわたしを生[い]かしてくださる。あなたは手[て]を伸[の]べて、わたしの敵[てき]の怒[いか]りを押[お]さえ、あなたの右[みぎ]の手[て]でわたしを救[すく]ってくださる。"
  8: "主[しゅ]はわたしのために報[むく]いてくださる。主[しゅ]よ、あなたのあわれみはとこしえにある。あなたの手[て]のわざを捨[す]てないでください。"

notes:
  0: "Τῷ Δαυιδ — ダビデの詩. Надписание — стих 0."
  1: "Ἐξομολογήσομαί σοι, κύριε, ἐν ὅλῃ καρδίᾳ μου — 心を尽くしてあなたに感謝をささげます (ἐξομολογέομαι — «славить, благодарить», по корпусу 感謝をささげる). ὅτι ἤκουσας τὰ ῥήματα τοῦ στόματός μου — あなたがわたしの口の言葉を聞かれたからです. ἐναντίον ἀγγέλων ψαλῶ σοι — 天使たちの前で、あなたに歌います (ἐναντίον — «пред лицом»; ψάλλω — «петь под струны»)."
  2: "προσκυνήσω πρὸς ναὸν ἅγιόν σου — あなたの聖なる宮に向かって伏し拝み (προσκυνέω — «поклоняться»; ναός — 宮). ἐξομολογήσομαι τῷ ὀνόματί σου ἐπὶ τῷ ἐλέει σου καὶ τῇ ἀληθείᾳ σου — あわれみと真実のゆえに、あなたの名に感謝をささげます. ἐμεγάλυνας ἐπὶ πᾶν ὄνομα τὸ λόγιόν σου — あなたの言葉をすべての名の上に高くされた (μεγαλύνω — «возвеличивать»; λόγιον — «изречение, слово»)."
  3: "ἐν ᾗ ἂν ἡμέρᾳ ἐπικαλέσωμαί σε — あなたを呼ぶ日には (ἐπικαλέομαι — «призывать»). ταχὺ ἐπάκουσόν μου — すぐに答えてください (ἐπακούω — «услышать»). πολυωρήσεις με ἐν ψυχῇ μου ἐν δυνάμει — 魂を力で強くされます (πολυωρέω — «обильно давать»; тёмное место, передано по смыслу «укрепишь»; слав. «умножиши мя»)."
  4: "ἐξομολογησάσθωσάν σοι… πάντες οἱ βασιλεῖς τῆς γῆς — 地の王たちは皆、あなたに感謝をささげる (повелительное 3 л. передано изъявительным, как естественно по-японски). ὅτι ἤκουσαν πάντα τὰ ῥήματα τοῦ στόματός σου — あなたの口の言葉を聞いて."
  5: "καὶ ᾀσάτωσαν ἐν ταῖς ὁδοῖς κυρίου — 主の道を歌う (ὁδός — 道; повтор 道 в 6 сохранён). ὅτι μεγάλη ἡ δόξα κυρίου — 主の栄光は大きいからである."
  6: "ὅτι ὑψηλὸς κύριος καὶ τὰ ταπεινὰ ἐφορᾷ — 主は高く、低い者に目を留め (ἐφοράω — «призирать, видеть»). καὶ τὰ ὑψηλὰ ἀπὸ μακρόθεν γινώσκει — 高ぶる者は遠くから知っておられる (γινώσκω — «знать», здесь «знать о них издали, не приближая»)."
  7: "ἐὰν πορευθῶ ἐν μέσῳ θλίψεως, ζήσεις με — 苦難の中を歩むとき、わたしを生かしてくださる (ζάω — «жить»; ζήσεις — «оживишь»). ἐπ᾽ ὀργὴν ἐχθρῶν μου ἐξέτεινας χεῖρά σου — 敵の怒りに対して手を伸べて (ἐκτείνω — «простирать»). ἔσωσέν με ἡ δεξιά σου — 右の手で救ってくださる."
  8: "κύριος ἀνταποδώσει ὑπὲρ ἐμοῦ — 主はわたしのために報いてくださる. τὸ ἔλεός σου εἰς τὸν αἰῶνα — あなたのあわれみはとこしえにある. τὰ ἔργα τῶν χειρῶν σου μὴ παρῇς — あなたの手のわざを捨てないでください (παρίημι — «презирать, оставлять без внимания»)."
