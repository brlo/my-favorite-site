# jp-box, Псалтирь, псалом 117. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0,
# стихи 1..29 (ровно по номерам gr-lxx-byz).
# Псалом 117: призыв благодарить — четыре ступени (1–4), Господь помощник
# и упование (5–9), окружение народов и победа именем Господним (10–14),
# глас радости и десница Господня (15–18), врата правды и камень краеугольный
# (19–23), день Господень (24), «осанна» и благословение Грядущего (25–27),
# исповедание и заключительный призыв (28–29).
# Красного и синего нет. Кавычки: слова, которые должны произнести дом Израиля,
# дом Аарона и боящиеся Господа (2–4), — 「…」 (введены глаголом 言え).
# 24–25 — возгласы самого псалмопевца, обращённые к Богу и к собранию, а не
# переданная чужая речь, поэтому без кавычек (как Пс 3:7).
# 〔…〕 нет: все слова в gr-lxx-byz есть.
# セラ (διάψαλμα) в этой главе нет.
# Сносок ⟨…⟩ нет: 隅の親石 уже в корпусе (Мф 21:42), остальное понятно.
# jp-ni не использовался.

