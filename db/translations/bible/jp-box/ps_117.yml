verses:
  0: "アレルヤ。"
  1: "主[しゅ]をほめたたえよ。主[しゅ]は善[よ]く、そのあわれみはとこしえに絶[た]えないからである。"
  2: "イスラエルの家[いえ]は、今[いま]、言[い]え。「主[しゅ]は善[よ]く、そのあわれみはとこしえに絶[た]えない」と。"
  3: "アロンの家[いえ]は、今[いま]、言[い]え。「主[しゅ]は善[よ]く、そのあわれみはとこしえに絶[た]えない」と。"
  4: "主[しゅ]を畏[おそ]れる者[もの]たちは、みな、今[いま]、言[い]え。「主[しゅ]は善[よ]く、そのあわれみはとこしえに絶[た]えない」と。"
  5: "わたしは狭[せま]い所[ところ]で主[しゅ]を呼[よ]び求[もと]め、主[しゅ]はわたしに答[こた]えて、広[ひろ]い所[ところ]へ導[みちび]き出[だ]してくださった。"
  6: "主[しゅ]はわたしの助[たす]けである。わたしは恐[おそ]れない。人[ひと]がわたしに何[なに]をなしえようか。"
  7: "主[しゅ]はわたしの助[たす]けである。わたしは敵[てき]を目[め]の当[あ]たりにする。"
  8: "主[しゅ]に寄[よ]り頼[たの]むのは、人[ひと]に寄[よ]り頼[たの]むより善[よ]い。"
  9: "主[しゅ]に寄[よ]り頼[たの]むのは、支配者[しはいしゃ]たちに寄[よ]り頼[たの]むより善[よ]い。"
  10: "もろもろの民[たみ]はわたしを囲[かこ]んだが、わたしは主[しゅ]の名[な]によって彼[かれ]らを撃[う]ち退[しりぞ]けた。"
  11: "彼[かれ]らはわたしを囲[かこ]み、取[と]り囲[かこ]んだが、わたしは主[しゅ]の名[な]によって彼[かれ]らを撃[う]ち退[しりぞ]けた。"
  12: "彼[かれ]らは蜂[はち]のようにわたしを囲[かこ]み、茨[いばら]の火[ひ]のように燃[も]え上[あ]がったが、わたしは主[しゅ]の名[な]によって彼[かれ]らを撃[う]ち退[しりぞ]けた。"
  13: "わたしは押[お]されて倒[たお]れそうになったが、主[しゅ]はわたしを支[ささ]えてくださった。"
  14: "主[しゅ]はわたしの力[ちから]、わたしの歌[うた]。主[しゅ]はわたしの救[すく]いとなられた。"
  15: "正[ただ]しい者[もの]たちの住[す]まいに、喜[よろこ]びと救[すく]いの声[こえ]がある。主[しゅ]の右[みぎ]の手[て]は力[ちから]を現[あらわ]す。"
  16: "主[しゅ]の右[みぎ]の手[て]はわたしを高[たか]く上[あ]げ、主[しゅ]の右[みぎ]の手[て]は力[ちから]を現[あらわ]す。"
  17: "わたしは死[し]なず、生[い]きて、主[しゅ]のわざを告[つ]げ知[し]らせる。"
  18: "主[しゅ]はわたしを厳[きび]しく懲[こら]しめられたが、死[し]に渡[わた]されはしなかった。"
  19: "わたしのために義[ぎ]の門[もん]を開[ひら]け。わたしはそこに入[はい]り、主[しゅ]をほめたたえる。"
  20: "これが主[しゅ]の門[もん]である。正[ただ]しい者[もの]たちがそこに入[はい]る。"
  21: "わたしはあなたをほめたたえる。あなたはわたしに答[こた]え、わたしの救[すく]いとなられたからである。"
  22: "建[た]てる者[もの]たちが捨[す]てた石[いし]が、隅[すみ]の親石[おやいし]となった。"
  23: "これは主[しゅ]のなされたことであり、わたしたちの目[め]には驚[おどろ]くべきことである。"
  24: "これは主[しゅ]が造[つく]られた日[ひ]である。わたしたちはこの日[ひ]を喜[よろこ]び、楽[たの]しもう。"
  25: "主[しゅ]よ、どうか救[すく]ってください。主[しゅ]よ、どうか助[たす]けてください。"
  26: "主[しゅ]の名[な]によって来[く]る者[もの]は祝福[しゅくふく]されている。わたしたちは主[しゅ]の家[いえ]からあなたがたを祝福[しゅくふく]する。"
  27: "主[しゅ]は神[かみ]であり、わたしたちを照[て]らされた。茂[しげ]った枝[えだ]をもって祭[まつ]りを営[いとな]め、祭壇[さいだん]の角[つの]に至[いた]るまで。"
  28: "あなたはわたしの神[かみ]である。わたしはあなたをほめたたえる。あなたはわたしの神[かみ]である。わたしはあなたを高[たか]く掲[かか]げる。わたしはあなたをほめたたえる。あなたはわたしに答[こた]え、わたしの救[すく]いとなられたからである。"
  29: "主[しゅ]をほめたたえよ。主[しゅ]は善[よ]く、そのあわれみはとこしえに絶[た]えないからである。"

notes:
  0: "Αλληλουια — アレルヤ (Откр 19:1). В ру-базе надписание — стих 0."
  1: "Ἐξομολογεῖσθε τῷ κυρίῳ, ὅτι ἀγαθός — 主をほめたたえよ、主は善く (ἐξομολογέομαι — «славить, благодарить»; по корпусу ほめたたえる). ὅτι εἰς τὸν αἰῶνα τὸ ἔλεος αὐτοῦ — そのあわれみはとこしえに絶えないからである (εἰς τὸν αἰῶνα — «во век»); формула повторяется в 2–4 и 29."
  2: "εἰπάτω δὴ οἶκος Ισραηλ — イスラエルの家は、今、言え (εἰπάτω — императив 3 л.; δή — «же, ну»). ὅτι ἀγαθός, ὅτι εἰς τὸν αἰῶνα τὸ ἔλεος αὐτοῦ — «[Он благ,] ибо вовек милость Его»; в ру-базе эти слова не выделены кавычками, здесь они взяты в 「…」 как речь, которую произносят, с と."
  3: "εἰπάτω δὴ οἶκος Ααρων — アロンの家は、今、言え; вторая ступень формулы, повтор 2-го стиха сохранён."
  4: "εἰπάτωσαν δὴ πάντες οἱ φοβούμενοι τὸν κύριον — 主を畏れる者たちは、みな、今、言え (εἰπάτωσαν — 3 л. мн. ч., поэтому 者たち…みな). Третья ступень: дом Израиля, дом Аарона, боящиеся Господа."
  5: "ἐν θλίψει ἐπεκαλεσάμην τὸν κύριον — わたしは狭い所で主を呼び求め (θλῖψις — «теснота», отсюда 狭い所). καὶ ἐπήκουσέν μου εἰς πλατυσμόν — 主はわたしに答えて、広い所へ導き出してくださった (πλατυσμός — «пространство, широта»); противопоставление тесноты и простора сохранено."
  6: "κύριος ἐμοὶ βοηθός — 主はわたしの助けである (βοηθός — «помощник»). οὐ φοβηθήσομαι τί ποιήσει μοι ἄνθρωπος — わたしは恐れない。人がわたしに何をなしえようか (риторический вопрос; ср. Евр 13:6)."
  7: "κύριος ἐμοὶ βοηθός, κἀγὼ ἐπόψομαι τοὺς ἐχθρούς μου — 主はわたしの助けである。わたしは敵を目の当たりにする (ἐπόψομαι — «увижу, посмотрю на»; предмет видения в греч. не назван, добавления нет). Повтор формулы 6-го стиха сохранён."
  8: "ἀγαθὸν πεποιθέναι ἐπὶ κύριον ἢ πεποιθέναι ἐπ᾽ ἄνθρωπον — 主に寄り頼むのは、人に寄り頼むより善い (πεποίθα — perfect от πείθω, «положиться»); сравнение сохранено дословно."
  9: "ἀγαθὸν ἐλπίζειν ἐπὶ κύριον ἢ ἐλπίζειν ἐπ᾽ ἄρχοντας — 主に寄り頼むのは、支配者たちに寄り頼むより善い (ἐλπίζω — «уповать»; ἄρχοντες — 支配者[しはいしゃ], как в Пс 2:2)."
  10: "πάντα τὰ ἔθνη ἐκύκλωσάν με — もろもろの民はわたしを囲んだ (κυκλόω — «окружать»). καὶ τῷ ὀνόματι κυρίου ἠμυνάμην αὐτούς — わたしは主の名によって彼らを撃ち退けた (ἀμύνω — «отражать, отбивать»); одна и та же формула в 10–12."
  11: "κυκλώσαντες ἐκύκλωσάν με — 彼らはわたしを囲み、取り囲んだ (причастие и глагол от одного корня; повтор передан 囲み、取り囲んだ). καὶ τῷ ὀνόματι κυρίου ἠμυνάμην αὐτούς — 主の名によって…撃ち退けた, повтор."
  12: "ἐκύκλωσάν με ὡσεὶ μέλισσαι κηρίον — 彼らは蜂のようにわたしを囲み (μέλισσα — «пчела»; κηρίον — «соты»). καὶ ἐξεκαύθησαν ὡσεὶ πῦρ ἐν ἀκάνθαις — 茨の火のように燃え上がった (ἐκκαίω — «зажигать, воспламенять»; 茨[いばら] — ἄκανθα); в Синодальном «угасли», но в греч. стоит «возгорелись» — оставлено горение, исход показан следующей клаузой."
  13: "ὠσθεὶς ἀνετράπην τοῦ πεσεῖν — わたしは押されて倒れそうになった (ὠθέω — «толкать»; ἀνατρέπω — «опрокидывать»). καὶ ὁ κύριος ἀντελάβετό μου — 主はわたしを支えてくださった (ἀντιλαμβάνω — «поддерживать»)."
  14: "ἰσχύς μου καὶ ὕμνησίς μου ὁ κύριος — 主はわたしの力、わたしの歌 (ὕμνησις — «песнь, хвала»). καὶ ἐγένετό μοι εἰς σωτηρίαν — 主はわたしの救いとなられた; ср. Исх 15:2."
  15: "φωνὴ ἀγαλλιάσεως καὶ σωτηρίας ἐν σκηναῖς δικαίων — 正しい者たちの住まいに、喜びと救いの声がある (ἀγαλλίασις — «ликование»; σκηνή — «шатёр, жилище»). δεξιὰ κυρίου ἐποίησεν δύναμιν — 主の右の手は力を現す (δεξιά — «десница»; δύναμις — «сила»)."
  16: "δεξιὰ κυρίου ὕψωσέν με — 主の右の手はわたしを高く上げ (ὑψόω — «возвышать»; в Синодальном «высока», без «меня», — με сохранено). δεξιὰ κυρίου ἐποίησεν δύναμιν — 主の右の手は力を現す, повтор 15-го стиха."
  17: "οὐκ ἀποθανοῦμαι, ἀλλὰ ζήσομαι — わたしは死なず、生きて. καὶ ἐκδιηγήσομαι τὰ ἔργα κυρίου — 主のわざを告げ知らせる (ἐκδιηγέομαι — «возвещать подробно»)."
  18: "παιδεύων ἐπαίδευσέν με ὁ κύριος — 主はわたしを厳しく懲らしめられた (παιδεύω — «наставлять, наказывать»; усилительное сочетание причастия с глаголом передано 厳しく). καὶ τῷ θανάτῳ οὐ παρέδωκέν με — 死に渡されはしなかった (παραδίδωμι — «предавать»)."
  19: "ἀνοίξατέ μοι πύλας δικαιοσύνης — わたしのために義の門を開け (πύλη — «врата»). εἰσελθὼν ἐν αὐταῖς ἐξομολογήσομαι τῷ κυρίῳ — わたしはそこに入り、主をほめたたえる (ἐξομολογέομαι, как в 1)."
  20: "αὕτη ἡ πύλη τοῦ κυρίου — これが主の門である. δίκαιοι εἰσελεύσονται ἐν αὐτῇ — 正しい者たちがそこに入る; ср. Ин 10:9."
  21: "ἐξομολογήσομαί σοι — わたしはあなたをほめたたえる. ὅτι ἐπήκουσάς μου — あなたはわたしに答えてくださったからである (ἐπακούω — «услышать, внять»). καὶ ἐγένου μοι εἰς σωτηρίαν — わたしの救いとなられた; формула как в 14."
  22: "λίθον, ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες — 建てる者たちが捨てた石 (ἀποδοκιμάζω — «отвергать после испытания»). οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας — 隅の親石となった (κεφαλὴ γωνίας — «глава угла»); цитируется в Мф 21:42 и par."
  23: "παρὰ κυρίου ἐγένετο αὕτη — これは主のなされたことであり. καὶ ἔστιν θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν — わたしたちの目には驚くべきことである (θαυμαστός — «дивный»)."
  24: "αὕτη ἡ ἡμέρα, ἣν ἐποίησεν ὁ κύριος — これは主が造られた日である. ἀγαλλιασώμεθα καὶ εὐφρανθῶμεν ἐν αὐτῇ — わたしたちはこの日を喜び、楽しもう (гортатив; ἀγαλλιάομαι — «ликовать», εὐφραίνομαι — «веселиться»); возглас, не чужая речь — без кавычек."
  25: "ὦ κύριε, σῶσον δή — 主よ、どうか救ってください (σῴζω — «спасать»; δή — «же»; это «осанна» евр. происхождения). ὦ κύριε, εὐόδωσον δή — 主よ、どうか助けてください (εὐοδόω — «даровать успех, благопоспешествовать»; в литургическом употреблении «поспеши», у jp-joc тоже 助け給へ); возглас — без кавычек."
  26: "εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου — 主の名によって来る者は祝福されている (причастие наст. вр.; ср. Мф 21:9). εὐλογήκαμεν ὑμᾶς ἐξ οἴκου κυρίου — わたしたちは主の家からあなたがたを祝福する (perfect с настоящим значением)."
  27: "θεὸς κύριος καὶ ἐπέφανεν ἡμῖν — 主は神であり、わたしたちを照らされた (ἐπιφαίνω — «являть свет, озарять»). συστήσασθε ἑορτὴν ἐν τοῖς πυκάζουσιν — 茂った枝をもって祭りを営め (πυκάζω — «делать густым, ветвистым»; ἐν τοῖς πυκάζουσιν — «в густых ветвях», т. е. с ветвями; в Синодальном по евр. «вяжите вервями жертву», у jp-joc то же — здесь оставлен греч. образ). ἕως τῶν κεράτων τοῦ θυσιαστηρίου — 祭壇の角に至るまで (κέρας — «рог» алтаря)."
  28: "θεός μου εἶ σύ, καὶ ἐξομολογήσομαί σοι — あなたはわたしの神である。わたしはあなたをほめたたえる; повтор θεός μου εἶ σύ сохранён. καὶ ὑψώσω σε — わたしはあなたを高く掲げる (ὑψόω). ἐξομολογήσομαί σοι, ὅτι ἐπήκουσάς μου — わたしはあなたをほめたたえる。あなたはわたしに答えて…; третий член с ὅτι, как в 21."
  29: "ἐξομολογεῖσθε τῷ κυρίῳ, ὅτι ἀγαθός — 主をほめたたえよ、主は善く; заключительный повтор 1-го стиха сохранён дословно (в евр. это рамка псалма)."
