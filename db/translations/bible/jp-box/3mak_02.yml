# jp-box, 3-я Маккавейская, глава 2. Черновик для приёмки.
#
# Нумерация — по Синодальному (ru, 24 стиха); текст — с греческого (gr-lxx-byz,
# 33 стиха); карта книги — в шапке гл. 1. В этой главе соединены:
# 2:7 (gr 7+8), 2:10 (gr 11+12), 2:13 (gr 15+16), 2:14 (gr 17+18),
# 2:15 (gr 19+20), 2:16 (gr 21+22), 2:19 (gr 25+26), 2:20 (gr 27+28),
# 2:24 (gr 32+33). Остальные — один к одному.
#
# Содержание: молитва первосвященника Симона (1–15): Бог — Владыка творения,
# погубивший древних нечестивцев, фараона, Содом, Сеннахирима, избавивший
# трёх отроков, Даниила и Иону; просьба не отдать святыню на поругание.
# 16–18 — Бог поражает царя, но тот не раскаивается. 19–22 — в Египте он
# замышляет истребление, велит вырезать на столбе указ о переписи и клеймении.
# 23–24 — одни отступают, большинство остаётся твёрдым.
# Прямая речь: 2:2–15 — молитва Симона в 「…」 (в 14 слова врагов — 『…』).
# 2:20–22 — указ царя в 「…」 (в 22 новая реплика указа — снова 「…」 после
# авторской ремарки). Остальное — повествование без кавычек.
# 〔…〕 нет; сносок ⟨…⟩ нет. ru — только нумерация и понимание, его чтения
# в текст не вносятся (расхождения отмечены в notes).

