verses:
  1: "そこで大祭司[だいさいし]シモンは聖所[せいしょ]の前[まえ]で膝[ひざ]をかがめ、両手[りょうて]を差[さ]し伸[の]べて、謹[つつし]んでこう祈[いの]った。"
  2: "「主[しゅ]よ、主[しゅ]よ、天[てん]の王[おう]、すべての造[つく]られたものの支配者[しはいしゃ]、聖[せい]なる者[もの]のうちの聖[せい]なる者[もの]、ただ一人[ひとり]の君王[くんのう]、全能者[ぜんのうしゃ]よ。不敬[ふけい]で汚[けが]れた者[もの]が、その厚[あつ]かましさと力[ちから]によって哮[たけ]り立[た]ち、わたしたちを苦[くる]しめています。どうか、わたしたちに目[め]を留[と]めてください。"
  3: "あなたはすべてを造[つく]り、すべてを治[おさ]める力[ちから]ある方[かた]、正[ただ]しい方[かた]であり、傲慢[ごうまん]と高慢[こうまん]によって何事[なにごと]かを行[おこな]う者[もの]たちを裁[さば]かれます。"
  4: "あなたは昔[むかし]、不法[ふほう]を行[おこな]った者[もの]たちを滅[ほろ]ぼしました。その中[なか]には力[ちから]と厚[あつ]かましさに頼[たよ]った巨人[きょじん]たちもいました。あなたは彼[かれ]らの上[うえ]に測[はか]り知[し]れない水[みず]を注[そそ]いで滅[ほろ]ぼしました。"
  5: "あなたは高慢[こうまん]にふるまい、悪[あく]を明[あき]らかに行[おこな]ったソドムの人[ひと]々[びと]を火[ひ]と硫黄[いおう]で焼[や]き尽[つ]くし、後[のち]の世[よ]の者[もの]たちへの見[み]せしめとされました。"
  6: "あなたは、あなたの聖[せい]なる民[たみ]イスラエルを奴隷[どれい]とした厚[あつ]かましいファラオを、さまざまな多[おお]くの罰[ばつ]で懲[こら]らし、あなたの力[ちから]を明[あき]らかにされました。それによってあなたの大[おお]いなる支配[しはい]の力[ちから]を示[しめ]されたのです。"
  7: "彼[かれ]が戦車[せんしゃ]と多[おお]くの兵[へい]を率[ひき]いて追[お]って来[き]たとき、あなたは彼[かれ]を海[うみ]の深[ふか]みに沈[しず]めました。しかし、すべての造[つく]られたものを治[おさ]めるあなたに信頼[しんらい]した者[もの]たちは、無事[ぶじ]に導[みちび]き通[とお]されました。彼[かれ]らはあなたの御手[みて]の業[わざ]を見[み]て、全能者[ぜんのうしゃ]であるあなたを賛美[さんび]しました。"
  8: "王[おう]よ、あなたは果[は]てしなく広[ひろ]く測[はか]り知[し]れない地[ち]を造[つく]り、この都[みやこ]を選[えら]び、何[なに]一つ足[た]りないところのないあなたの名[な]のためにこの場所[ばしょ]を聖[せい]としました。そして壮大[そうだい]な顕現[けんげん]によって、あなたの大[おお]いなる尊[とうと]い名[な]の栄光[えいこう]のために、この場所[ばしょ]を輝[かがや]かせ、確[たし]かなものとされました。"
  9: "あなたはイスラエルの家[いえ]を愛[あい]し、こう約束[やくそく]されました。もしわたしたちが背[そむ]き、苦難[くなん]がわたしたちを捉[とら]え、この場所[ばしょ]に来[き]て祈[いの]るなら、あなたはわたしたちの祈[いの]りを聞[き]き入[い]れてくださると。"
  10: "まことにあなたは信[しん]実[じつ]で真実[しんじつ]な方[かた]です。あなたはかつて、わたしたちの父祖[ふそ]たちがしばしば苦[くる]しんだとき、その虐[しいた]げられた身[み]を助[たす]け、大[おお]きな災[わざわ]いから彼[かれ]らを救[すく]い出[だ]されました。"
  11: "見[み]てください、聖[せい]なる王[おう]よ。今[いま]、わたしたちは多[おお]くの大[おお]きな罪[つみ]のゆえに苦[くる]しみ、敵[てき]に服[ふく]し、弱[よわ]さの中[なか]に捨[す]て置[お]かれています。"
  12: "わたしたちがこのように倒[たお]れているとき、この厚[あつ]かましく汚[けが]れた者[もの]が、地上[ちじょう]であなたの栄[えい]ある名[な]のために現[あらわ]されたこの聖[せい]なる場所[ばしょ]を辱[はずかし]めようとしています。"
  13: "まことに、あなたの住[す]まいである天[てん]の天[てん]は、人[ひと]には近[ちか]づき難[がた]いものです。しかしあなたは、あなたの民[たみ]イスラエルの中[なか]にあなたの栄光[えいこう]を現[あらわ]すことを喜[よろこ]び、この場所[ばしょ]を聖[せい]とされました。"
  14: "彼[かれ]らの汚[けが]れのゆえにわたしたちに報[むく]いをお返[かえ]しにならず、その冒瀆[ぼうとく]のゆえにわたしたちを罰[ばっ]しないでください。不法[ふほう]な者[もの]たちが怒[いか]りの中[なか]で誇[ほこ]り、その舌[した]の高慢[こうまん]によって喜[よろこ]び叫[さけ]んで、『わたしたちは、忌[い]まわしい者[もの]の家[いえ]が踏[ふ]みにじられるのと同[おな]じように、聖[せい]なる家[いえ]を踏[ふ]みにじった』と言[い]うことのないように。"
  15: "わたしたちの罪[つみ]を拭[ぬぐ]い去[さ]り、わたしたちの過[あやま]ちを散[ち]らし、この時[とき]にあなたの憐[あわ]れみを現[あらわ]してください。あなたの慈[いつく]しみが速[すみ]やかにわたしたちに先立[さきだ]ち、倒[たお]れ、心[こころ]の砕[くだ]けた者[もの]の口[くち]に賛美[さんび]を与[あた]え、わたしたちに平和[へいわ]を築[きず]いてくださいますように。」"
  16: "そのとき、すべてを見[み]ておられる神[かみ]、父[ちち]なる方[かた]、聖[せい]なる者[もの]のうちの聖[せい]なる方[かた]は、定[さだ]めにかなった願[ねが]いを聞[き]き入[い]れ、傲慢[ごうまん]と厚[あつ]かましさによって大[おお]いに高[たか]ぶっていた彼[かれ]を鞭[むち]打[う]たれました。神[かみ]は彼[かれ]を風[かぜ]に揺[ゆ]れる葦[あし]のように前後[ぜんご]に揺[ゆ]さぶり、地[ち]に伏[ふ]して何[なに]もできなくさせ、さらに手足[てあし]を麻痺[まひ]させて、もはや声[こえ]を出[だ]すことさえできなくされました。これが正[ただ]しい裁[さば]きに打[う]たれた彼[かれ]の姿[すがた]でした。"
  17: "そこで友人[ゆうじん]たちと護衛[ごえい]たちは、彼[かれ]を襲[おそ]った急[きゅう]な罰[ばつ]を見[み]て、命[いのち]さえ失[うしな]われるのではないかと恐[おそ]れ、非常[ひじょう]な恐怖[きょうふ]に打[う]たれながら、急[いそ]いで彼[かれ]を引[ひ]き出[だ]しました。"
  18: "しばらくして気[き]がつくと、彼[かれ]は戒[いまし]められても少[すこ]しも悔[く]い改[あらた]めず、激[はげ]しい脅[おど]しを残[のこ]して去[さ]りました。"
  19: "エジプトに帰[かえ]ると、彼[かれ]は邪悪[じゃあく]をさらに増[ふ]し加[くわ]えていきました。以前[いぜん]から示[しめ]されていた酒宴[しゅえん]の仲間[なかま]や、あらゆる正[ただ]しさから遠[とお]ざかった仲間[なかま]たちとともに、彼[かれ]は数[かぞ]え切[き]れない放縦[ほうじゅう]にふけるだけでは満[み]ち足[た]りず、ついには大胆[だいたん]にも、その地方[ちほう]に悪[わる]いうわさを広[ひろ]め、多[おお]くの友人[ゆうじん]たちが王[おう]の意図[いと]をじっと見[み]つめ、彼[かれ]の望[のぞ]みに従[したが]うまでになりました。"
  20: "彼[かれ]は公[おおやけ]にこの民[たみ]への中傷[ちゅうしょう]を広[ひろ]めることを企[くわだ]てました。宮殿[きゅうでん]の庭[にわ]の塔[とう]の上[うえ]に石柱[せきちゅう]を立[た]て、そこに次[つぎ]のような布告[ふこく]を刻[きざ]ませたのです。「いけにえを捧[ささ]げない者[もの]は誰[だれ]も彼[かれ]らの聖所[せいしょ]に入[はい]ってはならない。すべてのユダヤ人[じん]は住民登録[じゅうみんとうろく]を受[う]けて奴隷[どれい]の身分[みぶん]に置[お]かれ、逆[さから]う者[もの]は力[ちから]ずくで引[ひ]き立[た]てられて殺[ころ]されるべきである。"
  21: "登録[とうろく]された者[もの]には、ディオニュソスの印[しるし]である蔦[つた]の葉[は]を体[からだ]に焼[や]き付[つ]け、定[さだ]められた従属[じゅうぞく]の身分[みぶん]に置[お]く。」"
  22: "しかし、すべての者[もの]から憎[にく]まれていると思[おも]われないために、彼[かれ]は書[か]き添[そ]えました。「もし彼[かれ]らのうち、秘儀[ひぎ]を受[う]けた者[もの]たちの慣[なら]わしに従[したが]って暮[く]らすことを選[えら]ぶ者[もの]があれば、その者[もの]たちにはアレクサンドリアの市民[しみん]と同[おな]じ権利[けんり]を与[あた]える。」"
  23: "そこで、この都[みやこ]の敬虔[けいけん]の道[みち]を軽[かろ]んじた者[もの]たちは、やがて王[おう]と交[まじ]わることによって大[おお]きな名誉[めいよ]にあずかれると思[おも]い、安易[あんい]に身[み]を委[ゆだ]ねました。"
  24: "しかし、多[おお]くの者[もの]たちは雄々[おお]しい心[こころ]で強[つよ]く立[た]ち、敬虔[けいけん]から離[はな]れませんでした。彼[かれ]らは命[いのち]のために財産[ざいさん]を引[ひ]き換[か]えにし、恐[おそ]れることなく登録[とうろく]から逃[のが]れようと努[つと]めました。そして、助[たす]けを得[え]られるという良[よ]い希望[きぼう]を抱[いだ]き、彼[かれ]らから離[はな]れて行[い]く者[もの]を忌[い]み嫌[きら]い、民[たみ]の敵[てき]と見[み]なし、ともにする交[まじ]わりと助[たす]け合[あ]いから遠[とお]ざけました。"

notes:
  1: "Ὁ μὲν οὖν ἀρχιερεὺς Σιμων — первосвященник Симон (シモン; в LXX Σιμων, ср. Сирах 50:1); ἐξ ἐναντίας τοῦ ναοῦ — «напротив святилища»; κάμψας τὰ γόνατα — «преклонив колени»."
  2: "Κύριε κύριε — двойное обращение; ἅγιε ἐν ἁγίοις — «Святый во святых»; μόναρχε — единодержец (君王); πεφρυαγμένου — «разъярённого, кичащегося»."
  3: "δυνάστης — владыка (力ある方); ὕβρις — надменность, дерзость; ἀγερωχία — высокомерие."
  4: "ἐν οἷς καὶ γίγαντες ἦσαν — «среди которых были и исполины» (Быт 6:4); ἀμέτρητον ὕδωρ — «безмерная вода» (потоп)."
  5: "Σοδομῖται — содомляне; πυρὶ καὶ θείῳ — огнём и серою (Быт 19:24); παράδειγμα — пример, образец."
  6: "Φαραω — фараон; ποικίλαις καὶ πολλαῖς τιμωρίαις — «различными и многими казнями»; κράτος — сила, держава."
  7: "СТИХ СОЕДИНЁН: gr 2:7+8. Потопление фараона с колесницами (7) и хвала спасённых, увидевших дела руки Божией (8). δοριαλώτους нет; ἐμπιστεύσαντας ἐπὶ σοί — «доверившихся Тебе»; συνιδόντες — «уразумев»."
  8: "κτίσας τὴν ἀπέραντον καὶ ἀμέτρητον γῆν — «создав беспредельную и неизмеримую землю»; ἀπροσδεής — ни в чём не нуждающийся; σύστασις — устроение, основание; μεγαλοπρεπὴς ἐπιφάνεια — величественное явление."
  9: "ἀγαπῶν τὸν οἶκον τοῦ Ισραηλ — «любя дом Израилев»; ἀποστροφή — «отпадение, обращение вспять»; στενοχωρία — стеснение; εἰσακούῃ — «услышишь»."
  10: "СТИХ СОЕДИНЁН: gr 2:11+12. «Ты верен и истинен» (11) и повторение помощи отцам (12). πιστὸς καὶ ἀληθινός — формула; ταπείνωσις — унижение; ἐρρύσω — «избавил»."
  11: "ἰδοὺ δὲ νῦν — «вот и ныне»; καταπονούμεθα — «угнетаемся»; ὑπετάγημεν — «подчинены»; παρείμεθα ἐν ἀδυναμίαις — «оставлены в бессилии»."
  12: "καταπτῶσις — падение; καθυβρίσαι — «оскорбить, надругаться»; ἀναδεδειγμένον — «явленный, поставленный»; ἐπὶ τῆς γῆς — «на земле»."
  13: "СТИХ СОЕДИНЁН: gr 2:15+16. Небо небес недостижимо (15), но Бог освятил место (16). οὐρανὸς τοῦ οὐρανοῦ — «небо небес»; ἀνέφικτος — недоступный; εὐδοκήσας — «благоволив»."
  14: "СТИХ СОЕДИНЁН: gr 2:17+18. Просьба не отмстить (17) и слова врагов «мы попрали дом святыни» (18; в 『…』). ἐκδικέω — мстить; εὐθύνω — «выпрямлять, взыскивать»; οἶκος τοῦ ἁγιασμοῦ — дом святыни; προσοχθίσματα — мерзости."
  15: "СТИХ СОЕДИНЁН: gr 2:19+20. Окончание молитвы: отпущение грехов (19), предваряющая милость и мир (20). ἀπάλειψον — «изгладь»; ἀμβλακίαι — «погрешности»; οἰκτιρμοί — «щедроты»; καταπεπτωκότες — «павшие»."
  16: "СТИХ СОЕДИНЁН: gr 2:21+22. Бог слышит молитву и поражает царя (21), трясёт его, как тростник, и расслабляет члены (22). ἐπόπτης — «всевидящий»; προπάτωρ — «праотец»; ἐνθέσμος λιτανεία — «законная молитва»; κραδάνας — «потрясши»."
  17: "gr 2:23. σωματοφύλακες — телохранители (護衛); εὔθυνα — «наказание, взыскание»; ἐξείλκυσαν — «вытащили»."
  18: "gr 2:24. ἀναλεξάμενος αὑτόν — «придя в себя»; μετάμελον — раскаяние; ἀπειλὰς πικράς — «горькие угрозы»."
  19: "СТИХ СОЕДИНЁН: gr 2:25+26. Возвращение в Египет и рост злобы (25), необузданность и дурной пример для друзей (26). συμπόται — собутыльники; ἀσέλγεια — распущенность; δυσφημία — хула, дурная молва."
  20: "СТИХ СОЕДИНЁН: gr 2:27+28. Решение опозорить народ (27) и текст указа: никому не входить в святилище, всех иудеев — в перепись и рабство, сопротивляющихся убивать (28). στήλη — столб (石柱); λαογραφία — перепись населения (住民登録); οἰκετικὴ διάθεσις — рабское состояние."
  21: "gr 2:29. χαράσσεσθαι — «выжигаться, клеймиться»; Διονύσου κισσόφυλλον — лист плюща Диониса (蔦の葉); προσυνεσταλμένη αὐθεντία — «предписанное подчинение»."
  22: "gr 2:30. ἵνα μὴ τοῖς πᾶσιν ἀπεχθόμενος φαίνηται — «чтобы не показаться ненавистным всем»; τελεταί — таинства, обряды (秘儀); ἰσοπολῖται Ἀλεξανδρεῦσιν — «равные в правах александрийским гражданам»."
  23: "gr 2:31. ἐπιπολαίως — «поверхностно, легкомысленно»; τὰς τῆς πόλεως εὐσεβείας ἐπιβάθρας — тёмное место: «устои городского благочестия»; εὐκλεια — добрая слава."
  24: "СТИХ СОЕДИНЁН: gr 2:32+33. Большинство осталось твёрдым, выкупало себя от переписи (32) и чуждалось отступников (33). ἀντικαταλλάσσομαι — «обменивать»; ἀπογραφή — перепись (登録); ἐβδελύσσοντο — «гнушались»; κοινὴ συναναστροφή — общение."
