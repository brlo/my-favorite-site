verses:
  1: "ダビデの時代[じだい]に、年[とし]に次[つ]ぐ年、三年[さんねん]の間[あいだ]、飢饉[ききん]があった。ダビデは主[しゅ]の顔[かお]を尋[たず]ね求[もと]めた。主[しゅ]は言[い]われた。「サウルとその家[いえ]に不法[ふほう]がある。彼[かれ]がガバオン人[じん]を殺[ころ]した、その血[ち]の死[し]のゆえである。」"
  2: "ダビデ王[おう]はガバオン人[じん]を呼[よ]んで彼[かれ]らに言[い]った。ガバオン人はイスラエルの子[こ]らではなく、アモリ人[じん]の残[のこ]りから出[で]た者[もの]であった。イスラエルの子らは彼らに誓[ちか]っていた。しかしサウルは、イスラエルとユダの子らへの熱心[ねっしん]のゆえに、彼らを打[う]ち殺[ころ]そうとした。"
  3: "ダビデはガバオン人[じん]に言[い]った。「あなたがたのために何[なに]をしようか。何[なに]によって償[つぐな]えば、あなたがたは主[しゅ]の嗣業[しぎょう]を祝福[しゅくふく]してくれるのか。」"
  4: "ガバオン人[じん]は彼[かれ]に言[い]った。「わたしたちには、サウルやその家[いえ]との間に銀[ぎん]も金[きん]もない。また、イスラエルの中で人[ひと]を死[し]なせてくれる者[もの]もいらない。」彼[かれ]は言[い]った。「では、あなたがたは何[なに]を望[のぞ]むのか。わたしはそのとおりにしよう。」"
  5: "彼らは王[おう]に言[い]った。「わたしたちを滅[ほろ]ぼし尽[つ]くし、追[お]い払[はら]った人[ひと]がいる。彼[かれ]はわたしたちを根絶[こんぜつ]しようと考えたのだ。わたしたちはその者[もの]を消[け]し去[さ]り、イスラエルのすべての境[さかい]のうちに彼が立[た]つことのないようにする。"
  6: "彼[かれ]の子[こ]らから七人[ななにん]の者[もの]をわたしたちに与[あた]えてください。わたしたちは主[しゅ]のために、サウルのガバオンで、主に選[えら]ばれた者[もの]として彼らを日[ひ]にさらす。」王[おう]は言[い]った。「わたしが与えよう。」"
  7: "王[おう]は、主[しゅ]の誓[ちか]い、すなわちダビデとサウルの子[こ]ヨナタンとの間[あいだ]の誓いのゆえに、サウルの子ヨナタンの子[こ]メフィボシェトを惜[お]しんだ。"
  8: "王[おう]は、アイの娘[むすめ]レスファがサウルに産[う]んだ二人[ふたり]の子[こ]、エルモニとメフィボシェト、またサウルの娘[むすめ]ミカルがメホラ人[じん]ベルゼリの子[こ]エスリエルに産んだ五人[ごにん]の子を取[と]った。"
  9: "彼[かれ]は彼らをガバオン人[じん]の手[て]に渡[わた]した。彼らは主[しゅ]の前[まえ]の山[やま]で彼らを日[ひ]にさらした。七人[ななにん]はともに倒[たお]れた。彼らは刈[か]り入[い]れの日[ひ]々の初[はじ]め、大麦[おおむぎ]の刈り入れの始[はじ]めに殺[ころ]された。"
  10: "アイの娘[むすめ]レスファは粗布[あらぬの]を取[と]り、大麦[おおむぎ]の刈[か]り入れの始[はじ]めから、天[てん]から彼[かれ]らの上[うえ]に水[みず]がしたたるまで、それを岩[いわ]のそばに自分[じぶん]のために張[は]った。そして昼[ひる]は空[そら]の鳥[とり]が、夜[よる]は野[の]の獣[けもの]が彼らの上で休[やす]むことを許[ゆる]さなかった。"
  11: "サウルのそばめ、アイの娘[むすめ]レスファがしたすべてのことはダビデに告[つ]げられた。そして彼らは解[ほど]かれた。巨人[きょじん]の子孫[しそん]の一人[ひとり]、イオアの子[こ]ダンが彼らを捕[と]らえた。"
  12: "ダビデは行[い]って、サウルの骨[ほね]とその子[こ]ヨナタンの骨を、ヤベシュ・ギルアデの人[ひと]たちから取[と]った。彼らは、ペリシテ人[じん]がギルボアでサウルを打[う]ち殺[ころ]した日[ひ]に、ペリシテ人が彼らをさらしたベトシャンの広場[ひろば]から、彼らを盗[ぬす]み出[だ]していたのである。"
  13: "彼[かれ]はそこからサウルの骨[ほね]とその子[こ]ヨナタンの骨を運[はこ]び上[のぼ]り、日にさらされた者[もの]たちの骨を集[あつ]めた。"
  14: "彼らはサウルの骨[ほね]とその子[こ]ヨナタンの骨、また日にさらされた者[もの]たちの骨を、ベニヤミンの地[ち]、キスの墓[はか]のそばの斜面[しゃめん]に葬[ほうむ]った。彼らは王[おう]が命[めい]じたすべてを行[おこな]った。その後[あと]、神[かみ]は地[ち]の声[こえ]を聞[き]き入[い]れた。"
  15: "ペリシテ人[じん]とイスラエルの間に再[ふたた]び戦[いくさ]が起[おこ]った。ダビデは自分[じぶん]のしもべたちとともに下[くだ]ってペリシテ人と戦[たたか]ったが、ダビデは疲[つか]れ果[は]てた。"
  16: "ラファの子孫[しそん]の一人[ひとり]イエスビがいた。彼[かれ]の槍[やり]の重[おも]さは青銅[せいどう]三百[さんびゃく]シケルで、彼[かれ]はこん棒を腰[こし]に帯[おび]びていた。彼[かれ]はダビデを打[う]とうと企[くわだ]てていた。"
  17: "ツルヤの子[こ]アベシャが彼[かれ]を助[たす]け、ペリシテ人[じん]を打[う]って殺[ころ]した。そのとき、ダビデの者[もの]たちは誓[ちか]って言[い]った。「あなたはもう、わたしたちとともに戦[いくさ]に出[で]てはならない。イスラエルの灯[ともしび]を消[け]してはならないのだ。」"
  18: "その後[あと]、ペリシテ人[じん]との間にゲトで再[ふたた]び戦[いくさ]があった。そのとき、アスタロト人[じん]セボハが、ラファの子孫[しそん]の一人[ひとり]セフを打[う]った。"
  19: "ペリシテ人[じん]との間にゴブで戦[いくさ]があった。ベツレヘム人[じん]アリオルギムの子[こ]エレアナンが、ガテ人[じん]ゴリアトを打[う]った。その槍[やり]の柄[え]は織[お]る者[もの]の巻[ま]き棒[ぼう]のようであった。"
  20: "ゲトでまた戦[いくさ]があった。そこにマドンから来[き]た人[ひと]がいた。その手[て]の指[ゆび]と足[あし]の指は六本[ろっぽん]ずつで、数[かず]は二十四本[にじゅうよんほん]あった。彼[かれ]もまたラファに生[う]まれた者[もの]であった。"
  21: "彼[かれ]はイスラエルをののしった。ダビデの兄弟[きょうだい]シメイの子[こ]ヨナタンが彼[かれ]を打[う]った。"
  22: "この四人[よにん]は、ゲトのラファに生[う]まれた巨人[きょじん]の子孫[しそん]であり、ダビデの手[て]とそのしもべたちの手によって倒[たお]れた。"

notes:
  1: "λιμός — голод (λιμός). ἐνιαυτὸς ἐχόμενος ἐνιαυτοῦ — «год, следующий за годом». ἐζήτησεν τὸ πρόσωπον κυρίου — взыскал лицо Господне (ζητέω), т. е. вопросил Господа. ἐπὶ Σαυλ… ἀδικία — «на Сауле… неправда». θανάτῳ αἱμάτων — «смертью кровей», кровавой смертью. Γαβαωνῖται — гаваонитяне (ガバオン人). В csl добавлено «на земли» — внесено."
  2: "λεῖμμα τοῦ Αμορραίου — остаток Аморрея, аморреев (λεῖμμα). ὤμοσαν αὐτοῖς — клялись им. ἐζήτησεν Σαυλ πατάξαι — искал Саул поразить. ἐν τῷ ζηλῶσαι αὐτὸν — в ревности его (ζηλόω); ru «по ревности своей о потомках Израиля и Иуды»."
  3: "ἐξιλάσομαι — умилостивлю, примирю (ἐξιλάσκομαι). εὐλογήσετε τὴν κληρονομίαν — благословите наследие."
  4: "ἀργύριον καὶ χρυσίον — серебро и золото. οὐκ ἔστιν ἡμῖν ἀνὴρ θανατῶσαι — «нет нам человека умертвить», т. е. не нужно нам, чтобы умерщвляли."
  5: "συνετέλεσεν ἐφ᾽ ἡμᾶς — сокрушил, погубил нас (συντελέω). ἐδίωξεν — погнал. παρελογίσατο — замыслил (παραλογίζομαι). ἐξολεθρεῦσαι — истребить (ἐξολεθρεύω). ἀφανίσωμεν — истребим, изгладим (ἀφανίζω; слав. «потребим»)."
  6: "ἑπτὰ ἄνδρας — семь мужей. ἐξηλιάσωμεν — «выставим на солнце», т. е. повесим публично (ἐξηλιάζω). ἐκλεκτοὺς κυρίου — избранных Господом. ἐν Γαβαων Σαουλ — в Гаваоне Саула (ギバオン)."
  7: "ἐφείσατο — пощадил (φείδομαι). διὰ τὸν ὅρκον κυρίου — ради клятвы Господней."
  8: "Ρεσφα θυγάτηρ Αια — Рицпа, дочь Айя (レスファ). ἔτεκεν τῷ Σαυλ — родила Саулу. Ερμωνι — Армон(и) (エルモニ). Μιχολ θυγατρὸς Σαουλ — Мелхола, дочь Саула (ミカル); в евр. здесь Мерав, LXX и слав. читают Мелхола. Εσριηλ — Адриэл (エスリエル). Βερζελλι τῷ Μοουλαθι — Верзеллий Мехолатянин (メホラ人ベルゼリ)."
  9: "ἐν τῷ ὄρει ἔναντι κυρίου — на горе пред Господом. ἐπὶ τὸ αὐτό — вместе. θερισμός — жатва. ἐν ἀρχῇ θερισμοῦ κριθῶν — в начале жатвы ячменя."
  10: "σάκκος — вретище, дерюга (粗布). ἔπηξεν αὑτῇ πρὸς τὴν πέτραν — «водрузила себе у скалы», разостлала при скале (πήγνυμι). ἕως ἔσταξεν ὕδωρ ἐκ τοῦ οὐρανοῦ — пока не закапала вода с неба (στάζω). καταπαῦσαι — дать покой, сесть (καταπαύω). В csl «воды Божия» — уточнение, в гр. просто ὕδωρ."
  11: "ἀπηγγέλη τῷ Δαυιδ — возвещено было Давиду. ἐξελύθησαν — разрешились, были сняты (ἐκλύω). κατέλαβεν αὐτοὺς Δαν υἱὸς Ιωα — «постиг их Дан, сын Иои»; место тёмное, в ru отсутствует. ἀπόγονοι τῶν γιγάντων — потомки исполинов (γίγαντες)."
  12: "τὰ ὀστᾶ — кости. Ιαβις Γαλααδ — Иавис Галаадский (ヤベシュ・ギルアデ). ἔκλεψαν — украли. πλατεῖα Βαιθσαν — площадь Беф-Сана (ベトシャン). ἔστησαν — поставили (слав. «повесиша»). ἐν Γελβουε — на Гелвуе (ギルボア)."
  13: "ἀνήνεγκεν — поднял, перенёс (ἀναφέρω). συνήγαγεν — собрал. τῶν ἐξηλιασμένων — выставленных на солнце, повешенных."
  14: "ἐν τῇ πλευρᾷ — «в боку», на склоне (πλευρά). ἐν τῷ τάφῳ Κις — в гробе Киса. ἐπήκουσεν ὁ θεὸς τῇ γῇ — «услышал Бог землю», внял земле (ἐπακούω; слав. «послуша Бог земли»). В ru добавлено «в Цела» (по евр.), в LXX этого нет."
  15: "πόλεμος τοῖς ἀλλοφύλοις μετὰ Ισραηλ — война у иноплеменников с Израилем. ἐξελύθη Δαυιδ — Давид изнемог, утомился (ἐκλύω)."
  16: "Ιεσβι — Иесвий (イエスビ). ἔκγονοι τοῦ Ραφα — потомки Рафы (ラファ), т. е. рефаимов. σταθμὸς τοῦ δόρατος — вес копья (σταθμός). τριακοσίων σίκλων ὁλκὴ χαλκοῦ — триста сиклей весом меди. περιεζωσμένος κορύνην — препоясанный палицей (κορύνη); в ru «новым мечом» — по евр. διενοεῖτο — замышлял (διανοέομαι)."
  17: "ἐβοήθησεν — помог (βοηθέω). τὸν λύχνον Ισραηλ — светильник Израиля. οὐ μὴ σβέσῃς — не угасишь (σβέννυμι)."
  18: "ἐν Γεθ — в Гефе (ゲト). Σεβοχα ὁ Αστατωθι — Совохай Астатофитянин (アスタロト人; в ru «Хушатянин» — по евр.). τὸν Σεφ — Сафа (セフ)."
  19: "ἐν Γοβ — в Гобе (ゴブ; в ru «в Гобе»). Ελεαναν υἱὸς Αριωργιμ ὁ Βαιθλεεμίτης — Елханан, сын Ягаре-Оргима, вифлеемлянин. τὸν Γολιαθ τὸν Γεθθαῖον — Голиафа Гефянина. ἀντίον ὑφαινόντων — навой ткачей (ἀντίον)."
  20: "ἀνὴρ μαδων — «муж мадон» (тёмное место; слав. «муж от мадона»), передан как пришедший из Мадона. ἓξ καὶ ἕξ — по шести. εἴκοσι τέσσαρες ἀριθμῷ — числом двадцать четыре. ἐτέχθη τῷ Ραφα — родился от Рафы."
  21: "ὠνείδισεν — поносил, укорял (ὀνειδίζω). Ιωναθαν υἱὸς Σεμει ἀδελφοῦ Δαυιδ — Ионафан, сын Сафая (Σεμει), брата Давидова."
  22: "οἱ τέσσαρες — эти четыре. ἀπόγονοι τῶν γιγάντων — потомки исполинов. ἐν χειρὶ Δαυιδ — от руки Давида."
