verses:
  1: "朝[あさ]になると、祭司長[さいしちょう]たちと民[たみ]の長老[ちょうろう]たちはこぞって集[あつ]まり、イエスを殺[ころ]すために協議[きょうぎ]した。"
  2: "そして、イエスを縛[しば]り上[あ]げて連[つ]れ去[さ]り、総督[そうとく]ピラトのもとへ引[ひ]き渡[わた]した。"
  3: "そのとき、イエスを裏切[うらぎ]ったユダは、イエスが死刑[しけい]の判決[はんけつ]を受[う]けたのを知[し]って後悔[こうかい]し、銀[ぎん]三十枚[さんじゅうまい]を祭司長[さいしちょう]たちと長老[ちょうろう]たちに返[かえ]した。"
  4: "「わたしは罪[つみ]のない血[ち]を引[ひ]き渡[わた]して、罪[つみ]を犯[おか]した」と言[い]った。彼[かれ]らは言[い]った。「わたしたちに関[かか]わりはない。自分[じぶん]で見[み]るがよい。」"
  5: "ユダは銀[ぎん]を神殿[しんでん]の中[なか]に投[な]げ入[い]れて立[た]ち去[さ]り、行[い]って首[くび]を吊[つ]った。"
  6: "祭司長[さいしちょう]たちは銀[ぎん]を取[と]り上[あ]げて言[い]った。「これは血[ち]の代価[だいか]だから、神殿[しんでん]の庫[くら]に入[い]れるのは許[ゆる]されない。」"
  7: "彼[かれ]らは相談[そうだん]のうえ、その銀[ぎん]で陶工[とうこう]の畑[はたけ]を買[か]い、旅人[たびびと]を葬[ほうむ]る地[ち]とした。"
  8: "それゆえ、その畑[はたけ]は今日[こんにち]まで血[ち]の田[た]⟨アラム語[ご]で「血[ち]の地[ち]」の意[い]。アケルダマと呼[よ]ばれる。⟩と呼[よ]ばれている。"
  9: "すると、預言者[よげんしゃ]エレミヤによって語[かた]られた言葉[ことば]が成就[じょうじゅ]した。「彼[かれ]らは銀[ぎん]三十枚[さんじゅうまい]、すなわち値[ね]を付[つ]けられた者[もの]の値[ね]、イスラエルの子[こ]らが値[ね]を付[つ]けたその値[ね]を取[と]り、"
  10: "それを陶工[とうこう]の畑[はたけ]の代価[だいか]として与[あた]えた。主[しゅ]がわたしに命[めい]じられたとおりである。」"
  11: "イエスは総督[そうとく]の前[まえ]に立[た]たされた。総督[そうとく]が「お前[まえ]はユダヤ人[じん]の王[おう]なのか」と問[と]いただすと、イエスは「<j>あなたが言[い]っているとおりです</j>」とお答[こた]えになった。"
  12: "祭司長[さいしちょう]たちや長老[ちょうろう]たちが次々[つぎつぎ]と訴[うった]えても、イエスは何[なに]もお答[こた]えにならなかった。"
  13: "そこでピラトが言[い]った。「彼[かれ]らがお前[まえ]にどれほど多[おお]くの罪[つみ]を着[き]せているか、聞[き]こえないのか。」"
  14: "しかし、イエスは一言[ひとこと]もお答[こた]えにならなかった。総督[そうとく]はたいそう不思議[ふしぎ]に思[おも]った。"
  15: "ところで、祭[まつ]りごとに、総督[そうとく]は群衆[ぐんしゅう]が望[のぞ]む囚人[しゅうじん]を一人[ひとり]だけ釈放[しゃくほう]するのが慣[なら]わしであった。"
  16: "そのころ、バラバという、よく知[し]られた囚人[しゅうじん]がいた。"
  17: "それで、人々[ひとびと]が集[あつ]まったところで、ピラトは言[い]った。「どちらを釈放[しゃくほう]してほしいのか。バラバか、それともキリストと呼[よ]ばれているイエスか。」"
  18: "ピラトは、彼[かれ]らがねたみからイエスを引[ひ]き渡[わた]したのだと知[し]っていたからである。"
  19: "ピラトが裁[さば]きの座[ざ]に着[つ]いていると、妻[つま]が人[ひと]を遣[つか]わして、「あの正[ただ]しい人[ひと]には手[て]を出[だ]さないでください。わたしは今日[きょう]、夢[ゆめ]であの人のためにずいぶん苦[くる]しみました」と言[い]わせた。"
  20: "しかし、祭司長[さいしちょう]たちと長老[ちょうろう]たちは、群衆[ぐんしゅう]を説[と]き伏[ふ]せて、バラバの釈放[しゃくほう]を求[もと]めさせ、イエスを殺[ころ]してしまおうとした。"
  21: "総督[そうとく]は彼[かれ]らに言[い]った。「二人[ふたり]のうち、どちらを釈放[しゃくほう]してほしいのか。」彼[かれ]らは「バラバだ」と言[い]った。"
  22: "ピラトが言[い]った。「では、キリストと呼[よ]ばれているイエスはどうすればよいのか。」一同[いちどう]は言[い]った。「十字架[じゅうじか]につけよ。」"
  23: "ピラトは言[い]った。「いったい、どんな悪事[あくじ]を働[はたら]いたのか。」しかし、彼[かれ]らはますます激[はげ]しく叫[さけ]んだ。「十字架[じゅうじか]につけよ。」"
  24: "ピラトは、何[なに]をしても役[やく]に立[た]たず、かえって騒[さわ]ぎが大[おお]きくなるのを見[み]て、群衆[ぐんしゅう]の前[まえ]で水[みず]を取[と]り、手[て]を洗[あら]って言[い]った。「わたしはこの人[ひと]の血[ち]について潔白[けっぱく]である。あなたがたが見[み]るがよい。」"
  25: "民[たみ]は皆[みな]、答[こた]えて言[い]った。「その血[ち]は、わたしたちとわたしたちの子孫[しそん]の上[うえ]に。」"
  26: "ピラトはバラバを釈放[しゃくほう]し、イエスは鞭打[むちう]たれたうえで、十字架[じゅうじか]につけるために引[ひ]き渡[わた]された。"
  27: "イエスは総督[そうとく]の兵士[へいし]たちに総督官邸[そうとくかんてい]へ連[つ]れて行[い]かれ、部隊[ぶたい]の全員[ぜんいん]がイエスのもとに集[あつ]められた。"
  28: "そして、イエスの服[ふく]を脱[ぬ]がせて、緋色[ひいろ]の外套[がいとう]を着[き]せた。"
  29: "また、茨[いばら]を編[あ]んで冠[かんむり]を作[つく]り、頭[あたま]にかぶらせ、右手[みぎて]に葦[あし]の棒[ぼう]を持[も]たせ、イエスの前[まえ]にひざまずいて嘲[あざけ]りながら言[い]った。「ユダヤ人[じん]の王[おう]、万歳[ばんざい]。」"
  30: "そして、イエスに唾[つば]を吐[は]きかけ、葦[あし]の棒[ぼう]を取[と]っては頭[あたま]を打[う]ちつけた。"
  31: "彼[かれ]らはさんざん嘲[あざけ]ったあげく、外套[がいとう]を脱[ぬ]がせて元[もと]の服[ふく]を着[き]せ、十字架[じゅうじか]につけるために引[ひ]いて行[い]った。"
  32: "外[そと]へ出[で]ると、彼[かれ]らはシモンという名[な]のクレネ人[じん]に出会[であ]った。そこで、この人[ひと]にイエスの十字架[じゅうじか]を無理[むり]に負[お]わせた。"
  33: "ゴルゴタ⟨アラム語[ご]で「されこうべ」の意[い]。⟩という所[ところ]、すなわち「されこうべの場所[ばしょ]」と呼[よ]ばれる所[ところ]に来[き]て、"
  34: "イエスに、胆汁[たんじゅう]を混[ま]ぜたぶどう酒[さけ]を飲[の]ませようとした。しかし、イエスは味[あじ]を見[み]てから、お飲[の]みにならなかった。"
  35: "十字架[じゅうじか]につけたうえで、彼[かれ]らはくじを引[ひ]き、イエスの衣[ころも]を分[わ]けた。"
  36: "そして、そこに座[すわ]って見張[みは]っていた。"
  37: "また、イエスの頭[あたま]の上[うえ]には、罪状[ざいじょう]を書[か]いた板[いた]を置[お]いた。「これはユダヤ人[じん]の王[おう]、イエスである。」"
  38: "そのとき、二人[ふたり]の強盗[ごうとう]が、一人[ひとり]は右[みぎ]、一人[ひとり]は左[ひだり]に、イエスと一緒[いっしょ]に十字架[じゅうじか]につけられた。"
  39: "通[とお]りかかった人たちは、頭[あたま]を振[ふ]ってイエスをののしりながら"
  40: "言[い]った。「神殿[しんでん]を壊[こわ]しておいて、三日[みっか]で建[た]てる者[もの]よ。神[かみ]の子[こ]なら、自分[じぶん]を救[すく]え。さあ、十字架[じゅうじか]から降[お]りて来[こ]るがいい。」"
  41: "同[おな]じように、祭司長[さいしちょう]たちも律法学者[りっぽうがくしゃ]たちや長老[ちょうろう]たちと一緒[いっしょ]に、嘲[あざけ]りながら言[い]った。"
  42: "「他人[たにん]は救[すく]ったが、自分[じぶん]は救[すく]えない。イスラエルの王[おう]なら、今[いま]すぐ十字架[じゅうじか]から降[お]りてみろ。そうしたら信[しん]じてやる。」"
  43: "「神[かみ]に頼[たよ]っているのだから、神[かみ]がお望[のぞ]みなら今[いま]助[たす]け出[だ]してもらうがよい。『わたしは神[かみ]の子[こ]だ』と言[い]ったのだから。」"
  44: "二人[ふたり]の強盗[ごうとう]も、十字架[じゅうじか]の上[うえ]でイエスをののしった。彼[かれ]らはイエスの左右[さゆう]につけられていたのである。"
  45: "十二時[じゅうにじ]から、地[ち]は全土[ぜんど]にわたって暗[くら]くなり、三時[さんじ]までそのままだった。"
  46: "三時[さんじ]ごろ、イエスは大声[おおごえ]を上[あ]げて、「<j>エリ、エリ、レマ、サバクタニ。</j>」と叫[さけ]ばれた。その言葉[ことば]は、「わが神[かみ]、わが神[かみ]、どうしてわたしを見捨[みす]てられたのですか」という意[い]である。"
  47: "その叫[さけ]びを聞[き]いて「この人[ひと]はエリヤを呼[よ]んでいる」と言[い]う者[もの]も、そこに立[た]つ人々[ひとびと]の中[なか]にいた。"
  48: "すると、すぐに一人[ひとり]が走[はし]り寄[よ]り、海綿[かいめん]に酸[す]いぶどう酒[さけ]を含[ふく]ませ、葦[あし]の棒[ぼう]に付[つ]けてイエスに飲[の]ませようとした。"
  49: "ほかの者[もの]たちは、「やめろ。エリヤが来[き]てこの人[ひと]を助[たす]けるかどうか、見[み]てみよう」と言[い]った。"
  50: "イエスは再[ふたた]び、大声[おおごえ]を張[は]り上[あ]げて叫[さけ]び、息[いき]を引[ひ]き取[と]られた。"
  51: "すると、見[み]よ、神殿[しんでん]の幕[まく]が上[うえ]から下[した]まで真[ま]っ二[ぷた]つに裂[さ]け、地[ち]が震[ふる]え、岩[いわ]が割[わ]れた。"
  52: "また、墓[はか]が開[ひら]き、眠[ねむ]りについていた多[おお]くの聖[せい]なる人々[ひとびと]の体[からだ]が起[お]き上[あ]がった。"
  53: "イエスが復活[ふっかつ]された後[あと]、彼[かれ]らは墓[はか]から出[で]て聖[せい]なる都[みやこ]へ入[はい]り、大勢[おおぜい]の人[ひと]に姿[すがた]を見[み]せた。"
  54: "百人隊長[ひゃくにんたいちょう]と、彼[かれ]と共[とも]にイエスを見張[みは]っていた者[もの]たちは、地震[じしん]と起[お]こったことを見[み]て、ひどく恐[おそ]れ、「本当[ほんとう]に、この人[ひと]は神[かみ]の子[こ]であった」と言[い]った。"
  55: "また、そこには多[おお]くの婦人[ふじん]たちが遠[とお]くから見守[みまも]っていた。彼女[かのじょ]たちは、イエスに従[したが]ってガリラヤから来[き]て、イエスに仕[つか]えていた人々[ひとびと]である。"
  56: "そこにいたのは、マグダラのマリア、ヤコブとヨセフの母[はは]マリア、それにゼベダイの子[こ]たちの母[はは]であった。"
  57: "夕方[ゆうがた]になって、アリマタヤ出身[しゅっしん]の金持[かねも]ち、ヨセフという名[な]の人[ひと]がやって来[き]た。彼[かれ]もイエスの弟子[でし]であった。"
  58: "彼[かれ]はピラトのもとへ行[い]って、イエスの遺体[いたい]を求[もと]めた。そこで、ピラトはそれを渡[わた]すように命[めい]じた。"
  59: "ヨセフは遺体[いたい]を受[う]け取[と]ると、きれいな亜麻布[あまぬの]で包[つつ]んだ。"
  60: "そして、自分[じぶん]のために岩[いわ]を掘[ほ]って造[つく]った新[あたら]しい墓[はか]の中[なか]に納[おさ]め、墓[はか]の入[い]り口[ぐち]に大[おお]きな石[いし]を転[ころ]がしてふさぐと、そこを去[さ]った。"
  61: "そこには、マグダラのマリアと、もう一人[ひとり]のマリアが、墓[はか]の向[む]かいに座[すわ]っていた。"
  62: "その翌日[よくじつ]、すなわち準備[じゅんび]の日[ひ]の次[つぎ]の日[ひ]に、祭司長[さいしちょう]たちとファリサイ派[は]の人々[ひとびと]がピラトのもとに集[あつ]まった。"
  63: "そして言[い]った。「閣下[かっか]、あの惑[まど]わし屋[や]がまだ生[い]きていたとき、『三日[みっか]の後[あと]にわたしは復活[ふっか]する』と言[い]ったのを思[おも]い出[だ]しました。"
  64: "ですから、三日[みっか]目[め]まで墓[はか]を警備[けいび]するようにお命[めい]じください。弟子[でし]たちが来[き]て遺体[いたい]を盗[ぬす]み、民[たみ]に『あの者[もの]は死者[ししゃ]の中[なか]から復活[ふっかつ]した』と言[い]いふらすといけません。そうなれば、最初[さいしょ]の惑[まど]わしより、この最後[さいご]の惑[まど]わしの方[ほう]がひどくなります。」"
  65: "ピラトは言[い]った。「番兵[ばんぺい]がいる。行[い]って、自分[じぶん]たちの思[おも]うとおりに墓[はか]を固[かた]めておくがよい。」"
  66: "彼[かれ]らは行[い]って、番兵[ばんぺい]と共[とも]に石[いし]に封印[ふういん]をして墓[はか]を固[かた]めた。"

notes:
  1: "συμβούλιον ἔλαβον — «держали совет»; у Матфея здесь только первосвященники и старейшины народа, без книжников (ср. Мк 15:1, где добавлены γραμματεῖς и «весь синедрион»). Первосвященники и старейшины уже собирались вечером (26:3–5), теперь решение принимается утром."
  2: "ἡγεμών — «правитель»; в японской традиции 総督 (у jp-joc архаичное 方伯). 総督官邸 (πραιτώριον) — в 27:27."
  3: "μεταμεληθείς — «раскаявшись, пожалев» (не μετανοήσας, «переменив ум»); передано 後悔して, без сглаживания в «уверовал». κατεκρίθη — «был осуждён», т. е. приговор уже вынесен."
  4: "αἷμα ἀθῷον — «кровь невинную» (ср. 27:24, 27:25); σύ ὄψῃ — букв. «ты увидишь», передано 自分で見るがよい; в 27:24 то же ὑμεῖς ὄψεσθε — あなたがたが見るがよい, повтор сохранён."
  5: "ἀπήγξατο — «удавился»; оставлено прямо, без смягчений. Матфей — единственный евангелист, рассказывающий о смерти Иуды."
  6: "κορβανᾶς — храмовая сокровищница (ср. Мк 12:41); 神殿の庫. Сноску не ставил: слово понятно по контексту, а сносок на главу нужно мало."
  7: "Ἀγρὸς τοῦ Κεραμέως — «земля горшечника»; 陶工の畑 (у jp-joc архаичное 陶人). ξένοι — «странники, пришельцы»; 旅人."
  8: "ἕως τῆς σήμερον — «до сего дня»; 今日まで. Сноска: арамейское название «земля крови» (Деян 1:19 — Ἀκελδαμά); в самом стихе Матфей имени не приводит, оно дано только в сноске."
  9: "Матфей называет Иеремию, но цитата (9–10) ближе всего к Зах 11:12–13, с отголосками Иер 18:2–3; 19:1–2; 32:6–9. Евангелиста не «исправлял»: в тексте стоит エレミヤ, как в греческом; объяснение — здесь, для ревьюера."
  10: "καθὰ συνέταξέν μοι κύριος — «как повелел мне Господь»; слова Господа внутри пророческой цитаты, поэтому не красные (это не прямая речь Христа)."
  11: "Σὺ λέγεις — «ты говоришь»; あなたが言っているとおりです, как в 26:25 и 26:64. ἡγεμών в прямой речи Пилата не называется — только 総督 в повествовании."
  12: "οὐδὲν ἀπεκρίνατο — «ничего не отвечал»; 何もお答えにならなかった. Ср. Мк 15:3–5, где добавлено «Пилат опять спрашивал»."
  13: "καταμαρτυροῦσιν — «свидетельствуют против тебя»; передано 罪を着せている, чтобы не путать с судебным 証言 из 26:59–62."
  14: "πρὸς οὐδὲ ἓν ῥῆμα — «ни на одно слово»; 一言も. θαυμάζειν λίαν — «сильно удивляться»; たいそう不思議に思った."
  15: "κατὰ ἑορτήν — «на праздник» (Пасхи); εἰώθει — «имел обыкновение»; 慣わしであった. У Марка 15:6 добавлено «кого просили»; у Матфея — ὃν ἤθελον, «кого хотели»."
  16: "В критическом тексте колеблется Ἰησοῦν перед Βαραββᾶν («Иисус Варавва», ср. 27:17 в некоторых изданиях); византийский текст даёт только Βαραββᾶν — バラバ. Основания для 〔〕 нет."
  17: "Ἰησοῦν τὸν λεγόμενον Χριστόν — «Иисуса, называемого Христом»; キリスト, не メシア (калька ハリストス)."
  18: "διὰ φθόνον — «из зависти»; ねたみから. Причина названа евангелистом, а не Пилатом."
  19: "κατ᾽ ὄναρ — «во сне»; 夢で. Жена Пилата говорит от себя; её слова не красные. ἐπὶ τοῦ βήματος — «на судейском месте»; 裁きの座."
  20: "ἔπεισαν τοὺς ὄχλους — «убедили народ»; 群衆を説き伏せて. ἀπολέσωσιν — «погубили»; передано 殺してしまおうとした, без смягчения."
  21: "ἀποκριθεὶς δὲ ὁ ἡγεμών — «отвечая, правитель сказал»; в начале стиха 総督, чтобы не повторять ピラト из 27:19–20 подряд."
  22: "Σταυρωθήτω — «да будет распят»; 十字架につけよ (императив толпы, не красный)."
  23: "Τί γὰρ κακὸν ἐποίησεν — «какое же зло сделал?»; いったい、どんな悪事を働いたのか. περισσῶς — «чрезмерно, ещё сильнее»; ますます激しく."
  24: "ἀθῷός εἰμι ἀπὸ τοῦ αἵματος τούτου — «невиновен в крови этой»; 潔白である. Умывание рук — знак снятия с себя ответственности (ср. Втор 21:6–7); в тексте не поясняется. ὑμεῖς ὄψεσθε — «вы увидите»; あなたがたが見るがよい, как в 27:4."
  25: "Τὸ αἷμα αὐτοῦ ἐφ᾽ ἡμᾶς καὶ ἐπὶ τὰ τέκνα ἡμῶν — «кровь Его на нас и на детях наших»; 子孫. Ответ всего народа (πᾶς ὁ λαός), не только толпы; не сглажено."
  26: "φραγελλώσας — «бичевав» (римское бичевание перед распятием); 鞭打たれたうえで. Страдательный залог сдвигает подлежащее (Пилат остаётся действующим лицом в повествовании), но смысл сохранён. У Матфея нет упоминания «воинов», как у Марка 15:16."
  27: "πραιτώριον — 総督官邸 (как в Мк 15:16); σπεῖρα — 部隊, когорта (римское подразделение, ок. 600 человек)."
  28: "χλαμὺς κοκκίνη — «багряный плащ»; у Марка 15:17 πορφύρα («порфира»); у Матфея цвет назван иначе — 緋色の外套, различие сохранено."
  29: "Χαῖρε — приветствие «радуйся»; здесь издевательское, передано 万歳. κάλαμος — «тростник»; 葦の棒, как в Мк 15:19."
  30: "ἐμπτύσαντες εἰς αὐτόν — «плюнув на Него»; 唾を吐きかけ. У Матфея нет «преклоняли колени» в этом стихе — только в 27:29."
  31: "ἐνέπαιξαν — «издевались»; さんざん嘲ったあげく. ἀπήγαγον εἰς τὸ σταυρῶσαι — «повели на распятие»; 十字架につけるために引いて行った."
  32: "Киринеянин Симон; у Матфея нет «шедшего с поля» и имён сыновей (ср. Мк 15:21). ἠγγάρευσαν — «принудили» (персидское по происхождению слово, означавшее принудительную повинность); 無理に負わせた."
  33: "Γολγοθᾶ — арамейское название; евангелист сам переводит его (ὅ ἐστιν Κρανίου Τόπος), поэтому пояснение стоит и в тексте, и в сноске (сноска — о языке)."
  34: "χολή — «желчь»; у Марка 15:23 — σμύρνα («смирна»); у Матфея иное вещество, 胆汁. γευσάμενος — «отведав»; 味を見てから. οὐκ ἠθέλησεν — «не захотел»; お飲みにならなかった."
  35: "βάλλοντες κλῆρον — «бросая жребий»; くじを引いて. В византийском тексте здесь нет цитаты Пс 21:19, которая есть в некоторых рукописях и в Синодальном; 〔〕 не ставил."
  36: "ἐτήρουν — «стерегли» (имперфект, длительное действие); 見張っていた."
  37: "τὴν αἰτίαν — «вину» (надпись с указанием вины); 罪状. Надпись приводится в кавычках, но это не слова Христа — не красная."
  38: "λῃσταί — «разбойники»; 強盗. У Матфея, в отличие от Марка, они названы сразу, до насмешек проходящих."
  39: "κινοῦντες τὰς κεφαλάς — «кивая головами»; Пс 21:8; 頭を振って. Речь проходящих начинается в 27:40."
  40: "Ὁ καταλύων τὸν ναὸν… — «Разрушающий храм…»; отсылка к обвинению на суде (26:61), но здесь — насмешка. 壊しておいて передаёт «разрушил и (теперь) созидаешь». εἰ υἱὸς εἶ τοῦ θεοῦ — «если Ты Сын Божий»; 神の子なら."
  41: "ὁμοίως — «подобно»; 同じように. В византийском тексте только ἀρχιερεῖς, γραμματεῖς, πρεσβύτεροι; «фарисеи» у jp-joc — гармонизация, в текст не беру."
  42: "βασιλεὺς Ἰσραήλ — «Царь Израилев», не «Иудейский» (в надписи — 27:37); イスラエルの王. καταβάτω νῦν — «пусть сойдёт теперь»; 今すぐ降りてみろ."
  43: "Пс 21:9; πέποιθεν ἐπὶ τὸν θεόν — «уповал на Бога»; 神に頼っている. εἶπεν γὰρ ὅτι Θεοῦ εἰμι υἱός — вложенная цитата, поэтому 『』; слова первосвященников не красные."
  44: "τὸ δ᾽ αὐτὸ καί — «то же самое и»; 二人の強盗も…ののしった. ὠνείδιζον — «поносили». Второе предложение (イエスの左右につけられていた) повторяет 27:38, чтобы стих читался самостоятельно; «оба» у Матфея и Марка, у Луки — раскаявшийся разбойник."
  45: "ἀπὸ ἕκτης ὥρας… ἕως ἐνάτης — с 12-го до 15-го часа; 十二時…三時, как в Мк 15:33. σκότος ἐπὶ πᾶσαν τὴν γῆν — «тьма по всей земле»; 全土にわたって暗くなり."
  46: "Предсмертный вопль по Матфею: Ηλι ηλι λεμα σαβαχθανι (форма Матфея, с еврейским Ηλι); в Мк 15:34 — エロイ、エロイ… (арамейская форма). Передано エリ、エリ、レマ、サバクタニ. Перевод — Пс 21:2; слова Христа красные, перевод — вне <j>, как в Мк 15:34."
  47: "Ἠλίαν φωνεῖ — «Илию зовёт»; созвучие Ηλι/Ἠλίας, непонятое стоявшими; エリヤを呼んでいる. Порядок частей переставлен (сначала чужая реплика, потом «были там»), чтобы стих не повторял строй 27:39."
  48: "σπόγγος — «губка»; 海綿. ὄξος — «кислое вино, уксус»; 酸いぶどう酒 (по́ска). καλάμῳ — «на тростник»; 葦の棒."
  49: "Ἄφες ἴδωμεν — «оставь, посмотрим»; やめろ…見てみよう. В критическом тексте некоторые издания добавляют здесь рассказ о копье (Ин 19:34); в византийском тексте его нет — не добавляю."
  50: "κράξας φωνῇ μεγάλῃ — «возопив громким голосом»; 大声を張り上げて叫び. ἀφῆκεν τὸ πνεῦμα — «испустил дух»; 息を引き取られた, как в Мк 15:37."
  51: "καταπέτασμα — завеса храма; 幕 (в Мк 15:38 — 垂れ幕; здесь короче, по слову задания). εἰς δύο — «надвое»; 真っ二つに. Землетрясение и рассевшиеся камни — буквально, без сглаживания."
  52: "μνημεῖα — «гробницы»; 墓. κεκοιμημένων ἁγίων — «почивших святых»; 眠りについていた聖なる人々. σώματα — «тела»; 体. Не сглаживать: сказано именно о телах, которые восстали."
  53: "μετὰ τὴν ἔγερσιν αὐτοῦ — «после Его воскресения»; イエスが復活された後. ἐνεφανίσθησαν πολλοῖς — «явились многим»; 大勢の人に姿を見せた. Порядок событий у Матфея: гробы открылись при смерти, вышли святые после воскресения."
  54: "ἑκατόνταρχος — 百人隊長; σεισμόν — 地震 (только у Матфея). Ἀληθῶς θεοῦ υἱὸς ἦν οὗτος — «истинно Сей был Сын Божий»; без артикля, как в Мк 15:39."
  55: "ἀπὸ μακρόθεν — «издали»; 遠くから. διακονοῦσαι — «служили»; 仕えていた. У Матфея нет имён, кроме перечисленных в 27:56."
  56: "ἡ τοῦ Ἰακώβου καὶ Ἰωσὴφ μήτηρ — «мать Иакова и Иосии»; ヤコブとヨセフの母 (в Мк 15:40 — «мать Иакова меньшего и Иосии»). ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου — «мать сыновей Зеведеевых»; ゼベダイの子たちの母, без имён (в Мк 15:40 — Саломия)."
  57: "ἄνθρωπος πλούσιος — «человек богатый»; 金持ち. ἐμαθητεύθη τῷ Ἰησοῦ — «стал учеником Иисуса»; 弟子であった (у Марка — «ожидавший Царства Божия»)."
  58: "ᾐτήσατο τὸ σῶμα — «просил тело»; 遺体を求めた. ἐκέλευσεν ἀποδοθῆναι — «повелел отдать»; 渡すように命じた. У Матфея нет удивления Пилата, что Иисус уже умер (ср. Мк 15:44)."
  59: "σινδών — «полотно, плащаница»; 亜麻布. καθαρά — «чистое»; きれいな."
  60: "καινὸν μνημεῖον — «новый гроб»; 新しい墓. ἐλατόμησεν ἐν τῇ πέτρᾳ — «высек в скале»; 岩を掘って造った. προσκυλίσας λίθον μέγαν — «привалив большой камень»; 大きな石を転がしてふさいだ."
  61: "ἡ ἄλλη Μαρία — «другая Мария»; もう一人のマリア, как в 28:1. καθήμεναι ἀπέναντι — «сидели напротив»; 向かいに座っていた."
  62: "τῇ ἐπαύριον, ἥτις ἐστὶν μετὰ τὴν παρασκευήν — «на следующий день, который после приготовления (пятницы)», т. е. в субботу; 準備の日の次の日に, без разъяснения в тексте. οἱ Φαρισαῖοι — ファリサイ派 (в Мк здесь только первосвященники и книжники)."
  63: "κύριε — обращение к Пилату, «господин»; 閣下, не 主よ (это не обращение к Христу). ὁ πλάνος — «обманщик, смутьян»; 惑わし屋, без смягчения. Μετὰ τρεῖς ἡμέρας ἐγείρομαι — «через три дня восстану»; 復活する, как в 26:61."
  64: "ἀσφαλισθῆναι — «охранить, обеспечить безопасность»; 警備する. μήποτε… κλέψωσιν — «как бы не украли»; 盗み…といけません. ἡ ἐσχάτη πλάνη χείρων τῆς πρώτης — «последний обман хуже первого»; 最後の惑わしの方がひどく, порядок сохранён."
  65: "Ἔχετε κουστωδίαν — «у вас есть стража» (римская когорта); 番兵がある. ὡς οἴδατε — «как знаете (умеете)»; 自分たちの思うとおりに."
  66: "σφραγίσαντες τὸν λίθον — «запечатав камень»; 石に封印をして. μετὰ τῆς κουστωδίας — «со стражей»; 番兵と共に. Печать и стража — детали только у Матфея."
