# jp-box, 1-я Царств, глава 23. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc для книги нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 23: Кеиль и спасение города (1–5), ефод Авиафара (6), Саул идёт
# на Кеиль (7–8), молитва Давида и уход из города (9–13), пустыня Зиф и
# Маон (14–15), Ионатан в Каине (16–18), зифеи (19–23), погоня у Маона
# и вестник о филистимлянах (24–28).
# Речи — 「…」: вестник (1), Давид (2, 9, 10–11, 22–23), Господь (2, 4, 11,
# 12), люди Давида (3), Саул (7, 21–23), Ионатан (17), зифеи (19–20),
# вестник (27).
# Нумерация по gr совпадает со слав. (28 стихов).
# 〔…〕 одно: 23:12 целиком — в gr-lxx-byz на месте стиха стоит «.»,
# стих восстановлен по csl-ru («предадят ли мя иже в кеиле… И рече Господь:
# предадят») и целиком стоит в 〔…〕 (дефект модуля, как в Нав 6:4 и др.).
# Сносок ⟨…⟩ нет: 要害, エフォド, ジフ人, 祭司 уже понятны по корпусу.
# jp-ni не использовался.

tr_code: jp-box
book: 1ts
chapter: 23
draft: true

verses:
  1: "ダビデに告[つ]げる者[もの]があって言[い]った。「見[み]よ、ペリシテ人[じん]がケイラで戦[たたか]い、脱穀場[だっこくじょう]を奪[うば]い、踏[ふ]みにじっている。」"
  2: "ダビデは主[しゅ]に問[と]うて言[い]った。「わたしは行[い]って、このペリシテ人[じん]たちを撃[う]つべきだろうか。」主[しゅ]は言[い]われた。「行[い]け。あなたはこのペリシテ人たちを撃[う]ち、ケイラを救[すく]う。」"
  3: "ダビデの者[もの]たちは彼に言[い]った。「見[み]よ、わたしたちはここユダでさえ恐[おそ]れている。ましてケイラへ行[い]くなら、どうなることか。わたしたちはペリシテ人[じん]の分捕[ぶんど]り物[もの]の中[なか]へ入[はい]って行[い]くことになる。」"
  4: "ダビデはさらに主[しゅ]に問[と]うた。主[しゅ]は彼に答えて言[い]われた。「立[た]って、ケイラへ下[くだ]れ。わたしがペリシテ人[じん]たちをあなたの手[て]に渡[わた]すからだ。」"
  5: "ダビデは自分[じぶん]とともにいる者[もの]たちとともにケイラへ行[い]き、ペリシテ人[じん]たちと戦[たたか]った。彼らは彼の前[まえ]から逃[に]げ、彼は彼らの家畜[かちく]を連[つ]れ去[さ]り、彼らに大[おお]きな打撃[だげき]を与[あた]えた。こうしてダビデはケイラの住[す]む者[もの]たちを救[すく]った。"
  6: "アヒメレクの子[こ]アビアタルがダビデのもとへ逃[に]げたとき、彼もダビデとともにケイラへ下[くだ]り、エフォドを手[て]に持[も]っていた。"
  7: "サウルに、ダビデがケイラに来[き]たと告[つ]げる者[もの]があった。サウルは言[い]った。「神[かみ]は彼をわたしの手[て]に渡[わた]された。彼は門[もん]とかんぬきのある町[まち]に入[はい]って、閉[と]じ込[こ]められたからだ。」"
  8: "サウルはすべての民[たみ]に、ケイラへ下[くだ]って戦[たたか]い、ダビデとその者[もの]たちを包囲[ほうい]するよう命[めい]じた。"
  9: "ダビデは、サウルが自分[じぶん]についての悪[あく]を隠[かく]さなくなったのを知[し]って、祭司[さいし]アビアタルに言[い]った。「主[しゅ]のエフォドを持[も]って来[き]なさい。」"
  10: "ダビデは言[い]った。「主[しゅ]、イスラエルの神[かみ]よ。あなたの僕[しもべ]は、サウルがケイラに来[き]て、わたしのゆえにこの町[まち]を滅[ほろ]ぼそうとしていると、確[たし]かに聞[き]いた。"
  11: "わたしは閉[と]じ込[こ]められるのか。サウルは、あなたの僕[しもべ]が聞[き]いたとおりに下[くだ]って来[く]るのか。主[しゅ]、イスラエルの神[かみ]よ、あなたの僕[しもべ]に告[つ]げてください。」主[しゅ]は言[い]われた。「閉[と]じ込[こ]められる。」"
  12: "ダビデは言[い]った。「ケイラの人々[ひとびと]は、わたしとわたしの者[もの]たちをサウルの手[て]に渡[わた]すのか。」主[しゅ]は言[い]われた。「渡[わた]す。」"
  13: "ダビデは自分[じぶん]とともにいる者[もの]たち、およそ四百人[にん]とともに立[た]ち、ケイラから出[で]て、行[い]けるところへ行[い]った。サウルには、ダビデがケイラから逃[に]げたと告[つ]げられたので、彼は出発[しゅっぱつ]をやめた。"
  14: "ダビデは荒野[こうや]のマセレムの要害[ようがい]に住[す]み、また荒野[こうや]のジフの山[やま]、乾[かわ]いた地[ち]に住[す]んだ。サウルは毎日[まいにち]彼を求[もと]めたが、主[しゅ]は彼をサウルの手[て]に渡[わた]されなかった。"
  15: "ダビデは、サウルが自分[じぶん]を求[もと]めに出[で]て来[き]たのを見[み]た。ダビデはジフの荒野[こうや]のカイネの、乾[かわ]いた山[やま]にいた。"
  16: "サウルの子[こ]ヨナタンは立[た]って、カイネのダビデのもとへ行[い]き、主[しゅ]によって彼の手[て]を強[つよ]くした。"
  17: "彼は言[い]った。「恐[おそ]れることはない。わたしの父[ちち]サウルの手[て]はあなたを見[み]つけない。あなたはイスラエルの王[おう]となる。わたしはあなたに次[つ]ぐ者[もの]となる。父[ちち]サウルもそう知[し]っている。」"
  18: "二人[ふたり]は主[しゅ]の前[まえ]で契約[けいやく]を結[むす]んだ。ダビデはカイネに留[とど]まり、ヨナタンは自分[じぶん]の家[いえ]へ帰[かえ]った。"
  19: "ジフ人[じん]たちは荒野[こうや]からサウルのもとへ上[のぼ]って来[き]て言[い]った。「ダビデはわたしたちのところに隠[かく]れているではないか。メサラの要害[ようがい]、カイネのエヘラの丘[おか]、エサイモンの右[みぎ]にある所[ところ]に。"
  20: "今[いま]、王[おう]の心[こころ]にかなうことは何[なん]でも、下[くだ]ってわたしたちのところへおいでください。わたしたちは彼を王[おう]の手[て]に渡[わた]す。」"
  21: "サウルは彼らに言[い]った。「主[しゅ]に祝福[しゅくふく]された者[もの]たちよ。わたしのために心[こころ]を痛[いた]めてくれたのだから。"
  22: "行[い]って、さらに備[そな]えをし、彼の足[あし]がどこにあるか、あなたがたが言[い]ったその場所[ばしょ]をすぐに知[し]れ。彼が何[なに]か計略[けいりゃく]をめぐらさないように。"
  23: "そして、よく見[み]て知[し]れ。あなたがたとともにわたしも行[い]こう。もし彼がこの地[ち]にいるなら、わたしはユダのすべての千[せん]の中[なか]から彼を探[さが]し出[だ]す。」"
  24: "ジフ人[じん]たちは立[た]って、サウルに先立[さきだ]って行[い]った。ダビデとその者[もの]たちは、エサイモンの右[みぎ]、すなわち西[にし]にある荒野[こうや]マオンにいた。"
  25: "サウルとその者[もの]たちは彼を求[もと]めに行[い]った。ダビデに告[つ]げる者[もの]があり、彼は荒野[こうや]マオンの岩[いわ]へ下[くだ]った。サウルはそれを聞[き]いて、荒野[こうや]マオンへダビデの後[あと]を追[お]って行[い]った。"
  26: "サウルとその者[もの]たちは山[やま]の一方[いっぽう]の側[がわ]を歩[あゆ]み、ダビデとその者[もの]たちは山[やま]のもう一方[いっぽう]の側[がわ]にいた。ダビデはサウルの前[まえ]から逃[に]げようと、身[み]を隠[かく]して急[いそ]いでいた。サウルとその者[もの]たちは、ダビデとその者たちを捕[つか]まえようとして、彼らに向[む]かって陣[じん]を敷[し]いた。"
  27: "そのとき、サウルに使[つか]いが来[き]て言[い]った。「急[いそ]げ、そして来[こ]い。ペリシテ人[じん]がこの地[ち]に攻[せ]め上[のぼ]って来[き]たからだ。」"
  28: "サウルはダビデの後[あと]を追[お]うのをやめて引[ひ]き返[かえ]し、ペリシテ人[じん]たちに向[む]かって行[い]った。それゆえ、その場所[ばしょ]は分[わ]かれた岩[いわ]と呼[よ]ばれた。"

notes:
  1: "ἀπηγγέλη — было возвещено. ἀλλόφυλοι — иноплеменники (ペリシテ人). πολεμοῦσιν ἐν τῇ Κειλα — воюют в Кеиле. διαρπάζουσιν — расхищают. καταπατοῦσιν τοὺς ἅλω — попирают гумна (ἅλων; 脱穀場)."
  2: "ἐπηρώτησεν διὰ τοῦ κυρίου — вопросил через Господа. Εἰ πορευθῶ — идти ли мне. σώσεις τὴν Κειλα — спасёшь Кеиль."
  3: "ἐν τῇ Ιουδαίᾳ — в Иудее. εἰς τὰ σκῦλα τῶν ἀλλοφύλων — в добычу иноплеменников (σκῦλον; слав. «в плен»). εἰσπορευσόμεθα — входим."
  4: "προσέθετο ἐρωτῆσαι — приложил [ещё] вопросить. Ἀνάστηθι καὶ κατάβηθι — встань и сойди. παραδίδωμι — предаю."
  5: "ἐπολέμησεν ἐν τοῖς ἀλλοφύλοις — воевал с иноплеменниками. ἀπήγαγεν τὰ κτήνη — угнал скот. πληγὴν μεγάλην — великое поражение. ἔσωσεν — спас."
  6: "ἐν τῷ φυγεῖν Αβιαθαρ — когда бежал Авиафар. ἔχων εφουδ ἐν τῇ χειρί — имея ефод в руке. В слав. и ru порядок иной, смысл тот же."
  7: "ἥκει — пришёл (ἥκω). Πέπρακεν — предал, продал (πιπράσκω). ἀποκέκλεισται — заперт (ἀποκλείω). πόλις θυρῶν καὶ μοχλῶν — город ворот и засовов (μοχλός)."
  8: "παρήγγειλεν — приказал (παραγγέλλω). συνέχειν — стеснить, осадить (συνέχω)."
  9: "οὐ παρασιωπᾷ — не молчит, не скрывает (παρασιωπάω). Προσάγαγε τὸ εφουδ — принеси ефод."
  10: "ἀκούων ἀκήκοεν — «слыша услышал» (усиление). διαφθεῖραι — погубить, разорить. δι᾿ ἐμέ — ради меня."
  11: "εἰ ἀποκλεισθήσεται — «будет ли заперто» (о городе, о нём). ἀπάγγειλον — возвести. Ἀποκλεισθήσεται — будет заперто."
  12: "В gr-lxx-byz на месте стиха стоит «.»; стих восстановлен по csl-ru и целиком стоит в …. Слав.: «И рече давид: аще предадят мя иже в кеиле, и мужы моя в руки саули? И рече Господь: предадят». Дефект модуля (вторая часть вопроса и ответа)."
  13: "ὡς τετρακόσιοι — около четырёхсот (в ru 600 — масоретское чтение). οὗ ἐὰν ἐπορεύθησαν — куда бы ни пошли. διασέσωται — спасся. ἀνῆκεν τοῦ ἐξελθεῖν — оставил [намерение] выступить."
  14: "ἐν τοῖς στενοῖς — в теснинах, в неприступных местах (στενά; 要害). ἐν τῇ γῇ τῇ αὐχμώδει — в земле сухой (αὐχμώδης). ἐζήτει — искал. οὐ παρέδωκεν — не предал."
  15: "ἐξέρχεται — выходит. ἐν τῷ ὄρει τῷ αὐχμώδει — на сухой горе. ἐν τῇ Καινῇ Ζιφ — «в Новой [местности] Зиф» (Καινή, букв. «новая»); слав. «в дубраве зиф», ru «в лесу» — иное понимание. Передано как название カイネ."
  16: "ἀνέστη — встал. ἐκραταίωσεν τὰς χεῖρας αὐτοῦ ἐν κυρίῳ — укрепил руки его в Господе, т. е. ободрил."
  17: "οὐ μὴ εὕρῃ σε — не найдёт тебя (усиленное отрицание). ἔσομαί σοι εἰς δεύτερον — буду тебе вторым. οἶδεν οὕτως — знает так."
  18: "διέθεντο… διαθήκην — заключили завет (διατίθημι). ἐνώπιον κυρίου — пред Господом."
  19: "οἱ Ζιφαῖοι — зифеи (ジフ人). ἐν Μεσσαρα — в Мессаре (メサラ). ἐν τοῖς στενοῖς — в теснинах. ἐν τῷ βουνῷ τοῦ Εχελα — на холме Ехела (エヘラ); ru «Гахила» — иное чтение. ἐκ δεξιῶν τοῦ Ιεσσαιμουν — по правую руку от Иессимона (エサイモン; евр. «Иешимон», пустыня; слав. «Иесемон»)."
  20: "πᾶν τὸ πρὸς ψυχὴν τοῦ βασιλέως — всё, что по душе царю. εἰς κατάβασιν καταβαινέτω — пусть сойдёт для сошествия. κεκλεῖκασιν — заперли (κλείω)."
  21: "Εὐλογημένοι ὑμεῖς τῷ κυρίῳ — благословенны вы Господом. ἐπονέσατε περὶ ἐμοῦ — поболели обо мне (πονέω)."
  22: "ἑτοιμάσατε ἔτι — приготовьте ещё. ὁ ποὺς αὐτοῦ — нога его. ἐν τάχει — быстро. μήποτε πανουργεύσηται — как бы не схитрил (πανουργεύομαι)."
  23: "ἴδετε καὶ γνῶτε — смотрите и знайте. ἐξερευνήσω — разыщу (ἐξερευνάω). ἐν πάσαις χιλιάσιν Ιουδα — во всех тысячах Иуды. Слав. добавляет «о всех местех, идеже той крыется, и возвратитеся ко мне на готово» — в gr нет, в текст не внесено."
  24: "ἔμπροσθεν Σαυλ — пред Саулом. ἐν τῇ ἐρήμῳ τῇ Μααν — в пустыне Маон (マオン). καθ᾿ ἑσπέραν — к западу (слав. «к западу»); ru «на равнине» — иное."
  25: "κατέβη εἰς τὴν πέτραν — сошёл к скале. κατεδίωξεν — погнался (καταδιώκω)."
  26: "ἐκ μέρους τοῦ ὄρους — с одной стороны горы. σκεπαζόμενος — укрываясь (σκεπάζω). παρενέβαλον — расположились станом (παρεμβάλλω). συλλαβεῖν — схватить."
  27: "ἄγγελος — вестник. Σπεῦδε καὶ δεῦρο — поспеши и приди. ἐπέθεντο — напали (ἐπιτίθημι). Слав. добавляет «на землю твою» — в gr нет."
  28: "ἀνέστρεψεν — возвратился. μὴ καταδιώκειν — не преследовать. Πέτρα ἡ μερισθεῖσα — «камень разделённый» (в ru Села-Гаммахлекоф; 分かれ岩)."
