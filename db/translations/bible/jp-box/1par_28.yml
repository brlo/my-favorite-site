verses:
  1: "ダビデはイスラエルのすべての長[かしら]たち、すなわち裁[さば]き人[びと]たちの長、部族[ぶぞく]の長、王[おう]の身辺[しんぺん]を代[か]わる代[が]わる警護[けいご]する組[くみ]の長たち、千人隊長[せんにんたいちょう]と百人隊長[ひゃくにんたいちょう]、宝物[たからもの]の番人[ばんにん]、王の財産[ざいさん]とすべての蓄[たくわ]えを管理[かんり]する者[もの]たち、自分の息子[むすこ]たちと宦官[かんがん]たち、力[ちから]ある者たち、軍[ぐん]の勇士[ゆうし]たちをエルサレムに集[あつ]めた。"
  2: "ダビデ王[おう]は会衆[かいしゅう]の真[ま]ん中[なか]に立[た]ち、言[い]った。「わたしの兄弟[きょうだい]たち、わたしの民[たみ]よ、わたしに聞[き]きなさい。主[しゅ]の契約[けいやく]の箱[はこ]のための安息[あんそく]の家[いえ]、わたしたちの神[かみ]の足台[あしだい]を建[た]てることがわたしの心[こころ]にあり、わたしは建造[けんぞう]に必要[ひつよう]なものを準備[じゅんび]した。"
  3: "しかし、神[かみ]はわたしに言[い]われた。『わたしの名[な]をその上[うえ]に置[お]くために、わたしのために家[いえ]を建[た]ててはならない。あなたは戦[いくさ]の人[ひと]であり、血[ち]を流[なが]してきたからである。』"
  4: "しかし、イスラエルの神[かみ]である主[しゅ]は、父[ちち]の家[いえ]のすべてのうちからわたしを選[えら]び、とこしえにイスラエルの王[おう]とされた。主はユダを選んで王国[おうこく]とし、ユダの家から父の家を選び、父の息子[むすこ]たちのうちからわたしを喜[よろこ]んで、すべてのイスラエルの王とされたのである。"
  5: "主[しゅ]がわたしに多[おお]くの息子[むすこ]を与[あた]えられたので、そのすべての息子のうちから、主はわたしの子[こ]ソロモンを選[えら]び、主の王国[おうこく]の王座[おうざ]に、イスラエルの上[うえ]に座[すわ]らせようとされた。"
  6: "神[かみ]はわたしに言[い]われた。『あなたの子[こ]ソロモンが、わたしの家[いえ]とわたしの庭[にわ]を建[た]てる。わたしは彼[かれ]をわたしの子として選[えら]んだからである。わたしは彼の父[ちち]となる。"
  7: "もし彼[かれ]が、今日[きょう]のように、わたしの戒[いまし]めと定[さだ]めを守[まも]ることに強[つよ]くあるなら、わたしは彼の王国[おうこく]をとこしえに堅[かた]くする。』"
  8: "今[いま]、主[しゅ]の会衆[かいしゅう]すべての面前[めんぜん]で、わたしたちの神[かみ]の耳[みみ]の前[まえ]で言[い]う。わたしたちの神である主のすべての戒[いまし]めを守[まも]り、求[もと]めなさい。そうすれば、あなたがたは良[よ]い地[ち]を嗣業[しぎょう]として受[う]け、あなたがたの後[あと]の子[こ]らに、とこしえに嗣業として残[のこ]すことができる。"
  9: "そして今[いま]、わが子[こ]ソロモンよ、あなたの父[ちち]たちの神[かみ]を知[し]り、全[まった]き心[こころ]と願[ねが]う魂[たましい]で神に仕[つか]えなさい。主[しゅ]はすべての心を探[さぐ]り、すべての思[おも]いを知[し]っておられるからである。もし神を求[もと]めるなら、あなたは神を見[み]いだし、もし神を捨[す]てるなら、神はあなたを最後[さいご]まで捨てられる。"
  10: "よく見[み]なさい。主[しゅ]はあなたを選[えら]び、ご自分[じぶん]のために聖所[せいしょ]となる家[いえ]を建[た]てさせようとしている。強[つよ]くあって、行[おこな]いなさい。」"
  11: "ダビデはその子[こ]ソロモンに、神殿[しんでん]とその家[いえ]々[いえ]、その庫[くら]、高殿[たかどの]、内部[ないぶ]の倉[くら]、清[きよ]めの家の設計図[せっけいず]を与[あた]えた。"
  12: "また、彼[かれ]が霊[れい]のうちに思[おも]い描[えが]いていたすべての型[かた]、すなわち主[しゅ]の家[いえ]の庭[にわ]々[にわ]、周囲[しゅうい]のすべての部屋[へや]、主の家の宝物庫[ほうもつこ]と聖[せい]なるものの宝物庫の型も与[あた]えた。"
  13: "また、祭司[さいし]たちとレビ人[びと]たちの組[くみ]の住[す]まい、主[しゅ]の家[いえ]の奉仕[ほうし]のすべての仕事[しごと]、主の家の礼拝[れいはい]に用[もち]いる奉仕の器[うつわ]の倉[くら]の型も与[あた]えた。"
  14: "また、金[きん]のものと銀[ぎん]のものの、その重[おも]さを定[さだ]めた。"
  15: "また、ともしび台[だい]とそのともしびの重[おも]さを与[あた]えた。"
  16: "また、供[そな]えのパンの机[つくえ]の重[おも]さを、金[きん]の机ごとに、同[おな]じように銀[ぎん]の机の分[ぶん]も与[あた]えた。"
  17: "また、肉[にく]を刺[さ]す鉤[かぎ]、注[そそ]ぎの器[うつわ]、金[きん]の鉢[はち]、および金のものと銀[ぎん]のものの重[おも]さ、金の香炉[こうろ]の一[ひと]つ一[ひと]つについての重さを与[あた]えた。"
  18: "また、香[こう]の祭壇[さいだん]の純金[じゅんきん]の重[おも]さを示[しめ]し、また、翼[つばさ]を広[ひろ]げて主[しゅ]の契約[けいやく]の箱[はこ]を覆[おお]うケルビムの車[くるま]の型[かた]を示[しめ]した。"
  19: "このすべては、主[しゅ]の手[て]による書[か]かれたものとして、ダビデがソロモンに与[あた]えた。すなわち、その型[かた]を作[つく]るために彼[かれ]に与えられた理解[りかい]のすべてである。"
  20: "ダビデはその子[こ]ソロモンに言[い]った。「強[つよ]くあれ、雄々[おお]しくあれ、行[おこな]いなさい。恐[おそ]れてはならない、おののいてはならない。わたしの神[かみ]である主[しゅ]があなたとともにいて、主の家[いえ]の奉仕[ほうし]のすべての仕事[しごと]を成[な]し終[お]えるまで、あなたを離[はな]れず、見捨[みす]てないからである。見[み]よ、神殿[しんでん]とその家[いえ]々[いえ]、その庫[くら]、高殿[たかどの]、内部[ないぶ]の倉[くら]、清[きよ]めの家、主の家の型[かた]がある。"
  21: "そして見[み]よ、祭司[さいし]たちとレビ人[びと]たちの組[くみ]は、神[かみ]の家[いえ]のすべての奉仕[ほうし]のためにあり、すべての仕事[しごと]であなたとともにいる。また、あらゆる技術[ぎじゅつ]に通[つう]じた熟練[じゅくれん]した者[もの]も、長[かしら]たちも、民[たみ]すべても、あなたのすべての言葉[ことば]に従[したが]う。」"

notes:
  1: "ἐξεκκλησίασεν — созвал собрание (ἐκκλησιάζω); ἄρχοντας τῶν κριτῶν — начальников судей (裁き人); слав. добавляет «и колен» — внесено (部族の長). τοὺς ἄρχοντας τῶν ἐφημεριῶν τῶν περὶ τὸ σῶμα τοῦ βασιλέως — начальников чред при теле царя, т.е. поочерёдно служащих при особе царя. γαζοφύλακας — хранителей сокровищ (宝物の番人). ἐπὶ τῶν ὑπαρχόντων αὐτοῦ — над имением его; слав. «над имениями своими и над всем стяжанием царевым» — передано в тексте (王の財産とすべての蓄え). Слав. добавляет «и сынов своих со евнухами» (по МТ) — внесено (息子たちと宦官). δυνάστας — властелинов; μαχητὰς τῆς στρατιᾶς — воинов войска (軍の勇士)."
  2: "ἔστη — встал; ἐν μέσῳ τῆς ἐκκλησίας — посреди собрания; Ἀκούσατέ μου, ἀδελφοὶ καὶ λαός μου — послушайте меня, братья и народ мой; οἶκον ἀναπαύσεως — дом покоя (安息の家); στάσιν ποδῶν — подножие ног (足台); εἰς τὴν κατασκήνωσιν ἐπιτήδεια — нужное для построения. Слав. «воста давид царь» — добавлено «царь» (ダビデ王)."
  3: "Οὐκ οἰκοδομήσεις ἐμοὶ οἶκον τοῦ ἐπονομάσαι τὸ ὄνομά μου ἐπ᾽ αὐτῷ — не построишь Мне дом, чтобы наречь имя Моё на нём; ἄνθρωπος πολεμιστὴς — человек воинственный (戦の人); αἵματα ἐξέχεας — пролил кровь (血を流してきた). Слова Бога внутри речи Давида — 『…』."
  4: "ἐξελέξατο... ἐν ἐμοὶ ἀπὸ παντὸς οἴκου πατρός μου — избрал... во мне из всего дома отца моего; ᾑρέτικεν τὸ βασίλειον — избрал царство (王国); ἐν τοῖς υἱοῖς τοῦ πατρός μου ἐν ἐμοὶ ἠθέλησεν — из сыновей отца моего во мне благоволил."
  5: "[ὅτι πολλοὺς υἱοὺς ἔδωκέν μοι κύριος] — в LXX в квадратных скобках, в базе есть, поэтому без 〔…〕. καθίσαι αὐτὸν ἐπὶ θρόνου βασιλείας κυρίου — посадить его на престоле царства Господня (主の王国の王座)."
  6: "Σαλωμων ὁ υἱός σου οἰκοδομήσει τὸν οἶκόν μου καὶ τὴν αὐλήν μου — Соломон, сын твой, построит дом Мой и двор Мой; ᾑρέτικα ἐν αὐτῷ εἶναί μου υἱόν — избрал его быть Мне сыном; κἀγὼ ἔσομαι αὐτῷ εἰς πατέρα — и Я буду ему Отцом."
  7: "κατορθώσω — утвержу, устрою; ἐὰν ἰσχύσῃ τοῦ φυλάξασθαι — если укрепится хранить (守ることに強くある); ὡς ἡ ἡμέρα αὕτη — как день сей."
  8: "κατὰ πρόσωπον πάσης ἐκκλησίας κυρίου καὶ ἐν ὠσὶν θεοῦ ἡμῶν — пред лицом всего собрания Господня и в ушах Бога нашего; φυλάξασθε καὶ ζητήσατε — храните и ищите; κληρονομήσητε... κατακληρονομήσητε — наследуете... оставите в наследие (嗣業として受ける、残す)."
  9: "γνῶθι τὸν θεὸν τῶν πατρῶν σου — знай Бога отцов твоих; ἐν καρδίᾳ τελείᾳ καὶ ψυχῇ θελούσῃ — всем сердцем и душою хотящей (全き心と願う魂); ἐτάζει — испытывает (探る); πᾶν ἐνθύμημα γιγνώσκει — всякое помышление знает; εἰς τέλος — до конца (最後まで)."
  10: "ἰδὲ τοίνυν — смотри же; εἰς ἁγίασμα — в святилище (聖所); ἴσχυε καὶ ποίει — будь твёрд и делай (強くあって、行いなさい)."
  11: "τὸ παράδειγμα τοῦ ναοῦ — образец, чертёж храма (設計図); ζακχω — тёмное слово, слав. «камары» (клети, 庫); ὑπερῴων — горниц (高殿); ἀποθηκῶν τῶν ἐσωτέρων — внутренних хранилищ (内部の倉); οἴκου τοῦ ἐξιλασμοῦ — дома очищения (清めの家)."
  12: "ὃ εἶχεν ἐν πνεύματι αὐτοῦ — что имел в духе своём; παστοφορίων — пастофориев, комнат (部屋); τῶν κύκλῳ — вокруг; ἀποθηκῶν τῶν ἁγίων — сокровищниц святынь."
  13: "καταλυμάτων τῶν ἐφημεριῶν — жилищ чред; εἰς πᾶσαν ἐργασίαν λειτουργίας — на всякое дело служения; σκευῶν τῆς λατρείας — сосудов служения (礼拝の器)."
  14: "τὸν σταθμὸν τῆς ὁλκῆς — вес; τῶν τε χρυσῶν καὶ ἀργυρῶν — золотых и серебряных. У csl стих такой же краткий; в ru он пространнее (по МТ), не вносим."
  15: "λυχνιῶν τὴν ὁλκὴν... καὶ τῶν λύχνων — вес светильников и лампад (ともしび台とともしび). В ru добавлено о серебряных светильниках — в LXX и csl этого нет."
  16: "τραπεζῶν τῆς προθέσεως — столов предложения (供えのパン); ἑκάστης τραπέζης χρυσῆς — каждого стола золотого; ὡσαύτως τῶν ἀργυρῶν — так же и серебряных."
  17: "κρεαγρῶν — мясных крюков (肉を刺す鉤); σπονδείων — возливниц (注ぎの器); φιαλῶν — фиалов (鉢); κεφφουρε — тёмное слово, слав. «кадилниц» (香炉); ἑκάστου σταθμοῦ — каждого веса."
  18: "θυσιαστηρίου τῶν θυμιαμάτων — жертвенника курений (香の祭壇); ἐκ χρυσίου δοκίμου — из золота чистого (純金); ἅρματος τῶν χερουβιν — колесницы херувимов (ケルビムの車); διαπεπετασμένων ταῖς πτέρυξιν — распростёрших крылья; σκιαζόντων — осеняющих."
  19: "ἐν γραφῇ χειρὸς κυρίου — в писании руки Господней; κατὰ τὴν περιγενηθεῖσαν αὐτῷ σύνεσιν — по постигшему его разумению (περιγίνομαι — «доставаться», редкое); τῆς κατεργασίας τοῦ παραδείγματος — изготовления образца."
  20: "Ἴσχυε καὶ ἀνδρίζου — будь твёрд и мужайся (強くあれ、雄々しくあれ); μὴ φοβοῦ μηδὲ πτοηθῇς — не бойся и не ужасайся; οὐκ ἀνήσει σε — не ослабит, не отступит; ἕως τοῦ συντελέσαι — доколе не совершишь. Слав. добавляет в конце «и се, подобие храма и дому его... и подобие дому Господня» (повтор 28:11–12 по МТ) — внесено."
  21: "ἐφημερίαι — чреды (組); εἰς πᾶσαν λειτουργίαν — на всякое служение; ἐν πάσῃ πραγματείᾳ — во всяком деле; πᾶς πρόθυμος ἐν σοφίᾳ κατὰ πᾶσαν τέχνην — всякий усердный в мудрости по всякому искусству (技術に通じた熟練した者); εἰς πάντας τοὺς λόγους σου — на все слова твои."
