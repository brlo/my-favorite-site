# jp-box, 1-я Паралипоменон, глава 28. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); церковнославянский (csl-ru) — второй
# свидетель церковного текста (новый паритет, docs/japanese-bible.md):
# слав. чтения и добавки входят в основной текст без 〔…〕, вариант LXX — в notes.
# ru (Синодальный) — только для понимания, не источник. jp-joc нет;
# jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 28: собрание начальников и речь Давида (1–10), передача чертежа храма
# (11–19), наставление Соломону (20–21).
# Речи: Давид — 「…」 (2–10, 20–21); слова Бога внутри его речи — 『…』 (3, 6–7).
# Слав. добавления внесены в основной текст: 28:1 «и колен», «и сынов своих со
# евнухами»; 28:2 «царь»; 28:20 «и се, подобие храма... и подобие дому Господня»
# (повтор 28:11–12 по МТ). Расхождения имён и чтений — в notes.
# 〔…〕 нет: все стихи есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 神殿, 契約の箱, 至聖所, 祭壇, ケルビム, 燔祭 уже в корпусе.
# Красного нет.

