# jp-box, Амос, глава 8. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 8 (совпадает).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: видение сосуда птицелова и «конец народу Моему»; обличение
# торговцев: «когда пройдёт новолуние», малая мера, большой вес, неверные весы,
# продажа бедных; клятва Господа; потрясение земли; тьма в полдень; плач вместо
# праздника; голод слышания слова Господня; жажда у девиц и юношей; клятва
# «жив Бог твой, Дан» и «путь в Вирсавию».
# Голоса: 1 — повествование; 2 — вопрос Господа, ответ пророка, слово Господа
# (три цитаты); 3 — слово Господа (формула в конце); 4–6 — речь пророка, слова
# торговцев в 5 — 「…」; 7 — клятва и слово Господа в 「…»; 8 — речь пророка;
# 9–10 — слово Господа в 「…»; 11–12 — слово Господа в 「…»; 13 — слово Господа
# (продолжение 11–12); 14 — речь пророка, клятвы в 「…».
# Трудное место: 1–2 LXX «сосуд птицелова» вместо МТ «корзина летних плодов»
# (игра слов קַיִץ/קֵץ «конец»); 14 ἱλασμός «умилостивление» вместо «грех».
# Термины: 鳥を捕る者の器 (ἄγγος ἰξευτοῦ), 終わり (πέρας), 飢え (λιμός),
# 粗布 (σάκκος), 剃り跡 (φαλάκρωμα), 誓う (ὀμνύω).
# Имена: アモス, イスラエル, ヤコブ, サマリア, エジプト, ダン, ベエルシェバ.
#
tr_code: jp-box
book: am
chapter: 8
draft: true

verses:
  1: "主[しゅ]である神[かみ]はわたしにこう示[しめ]された。見[み]よ、鳥[とり]を捕[と]る者[もの]の器[うつわ]である。"
  2: "主[しゅ]は言[い]われた。「アモスよ、何[なに]を見[み]るか。」わたしは答[こた]えた。「鳥[とり]を捕[と]る者[もの]の器[うつわ]です。」主[しゅ]はわたしに言[い]われた。「わたしの民[たみ]イスラエルに終[おわ]りが来[き]た。もはや彼らを見過[みす]ごさない。」"
  3: "その日[ひ]、神殿[しんでん]の天井[てんじょう]は泣[な]き叫[さけ]ぶ、と主[しゅ]である神[かみ]は言[い]われる。死[し]んだ者[もの]が至[いた]る所[ところ]に多[おお]く積[つ]まれ、人[ひと]々[びと]は黙[だま]ってそれを投[な]げ捨[す]てる。"
  4: "朝[あさ]から貧[まず]しい者[もの]をすり減[へ]らし、この地[ち]の乏[とぼ]しい者を虐[しいた]げる者[もの]たちよ、これを聞[き]け。"
  5: "あなたがたは言[い]う。「新月[しんげつ]はいつ過[す]ぎるのか。早[はや]く穀物[こくもつ]を売[う]りたい。安息日[あんそくび]はいつ終[お]わるのか。早く倉[くら]を開[ひら]きたい」と。あなたがたは量[はか]りを小[ちい]さくし、目方[めかた]を重[おも]くし、偽[いつわ]りの秤[はかり]を用[もち]いる。"
  6: "あなたがたは銀[ぎん]で貧しい者[もの]を買[か]い、一足[いっそく]の履物[はきもの]で乏しい者を買い、あらゆる穀物[こくもつ]を商[あきな]う。"
  7: "主[しゅ]はヤコブの高[たか]ぶりにかけて誓[ちか]われた。「わたしはあなたがたのすべての行[おこな]いを決[けっ]して忘[わす]れない。」"
  8: "このことのゆえに、地[ち]は震[ふる]え動[うご]かないだろうか。そこに住[す]む者[もの]はみな嘆[なげ]かないだろうか。地[ち]はナイル川[がわ]のように沸[わ]き上[あ]がり、エジプトの川のように沈[しず]み、また上[のぼ]る。"
  9: "その日[ひ]、と主[しゅ]である神[かみ]は言[い]われる。「わたしは真昼[まひる]に太陽[たいよう]を沈[しず]ませ、明[あか]るい昼[ひる]に地[ち]を暗[くら]くする。」"
  10: "わたしはあなたがたの祭[まつ]りを喪[も]に、すべての歌[うた]を弔[とむら]いの歌に変[か]え、すべての腰[こし]に粗布[あらぬの]を、すべての頭[あたま]に剃[そ]り跡[あと]を着[つ]けさせる。わたしはそれを、ひとり子[ご]を失[うしな]った者の喪のようにし、その終[お]わりを苦[にが]い日[ひ]とする。"
  11: "「見[み]よ、日[ひ]が来[く]る、と主[しゅ]である神[かみ]は言[い]われる。わたしはこの地[ち]に飢[う]えを送[おく]る。パンの飢えでも水[みず]の渇[かわ]きでもなく、主[しゅ]の言葉[ことば]を聞[き]くことへの飢えである。」"
  12: "人[ひと]々[びと]は海[うみ]から海へと揺[ゆ]れ動[うご]き、北[きた]から東[ひがし]へと走[はし]り回[まわ]って、主[しゅ]の言葉[ことば]を求[もと]めるが、見[み]つからない。"
  13: "その日[ひ]、美[うつく]しい処女[おとめ]たちも若者[わかもの]たちも、渇[かわ]きで衰[おとろ]える。"
  14: "サマリアの罪[つみ]の贖[あがな]いにかけて誓[ちか]い、「ダンよ、あなたの神[かみ]は生[い]きている」、「ベエルシェバよ、あなたの神[かみ]は生きている」と言[い]う者[もの]たちは、倒[たお]れて、もはや起[お]き上[あ]がらない。"

notes:
  1: "Οὕτως ἔδειξέν μοι κύριος — «так показал мне Господь»; ἰδοὺ ἄγγος ἰξευτοῦ — «вот сосуд птицелова» (ἄγγος — сосуд, 器; ἰξευτής — птицелов, 鳥を捕る者). В МТ/ru «корзина со спелыми плодами» — игра слов קַיִץ «летние плоды» — קֵץ «конец», LXX понял иначе (сосуд птицелова); не внесено."
  2: "Τί σὺ βλέπεις, Αμως — «что ты видишь, Амос» (βλέπω — 見る); Ἄγγος ἰξευτοῦ — «сосуд птицелова» (ответ пророка); Ἥκει τὸ πέρας ἐπὶ τὸν λαόν μου Ισραηλ — «пришёл конец на народ Мой Израиля» (ἥκω — приходить; πέρας — конец, 終わり); οὐκέτι μὴ προσθῶ τοῦ παρελθεῖν αὐτόν — «более не приложу пройти его» (παρέρχομαι — проходить мимо, 見過ごす). Три цитаты: вопрос, ответ, слово Господа."
  3: "ὀλολύξει τὰ φατνώματα τοῦ ναοῦ — «завопят (зарыдают) потолки (кессоны) храма» (ὀλολύζω — вопить, 泣き叫ぶ; φάτνωμα — кессон/потолок, 天井; ναός — 神殿); ἐν ἐκείνῃ τῇ ἡμέρᾳ, λέγει κύριος — «в тот день, говорит Господь»; πολὺς ὁ πεπτωκὼς ἐν παντὶ τόπῳ — «много падших на всяком месте» (πίπτω — падать, 死んだ者); ἐπιρρίψω σιωπήν — «навергну молчание» (ἐπιρρίπτω — набрасывать; σιωπή — 黙)."
  4: "Ἀκούσατε δὴ ταῦτα — «услышьте же это» (δή — усиление); οἱ ἐκτρίβοντες εἰς τὸ πρωῒ πένητα — «истребляющие (стирающие) с утра бедного» (ἐκτρίβω — стирать, すり減らす; πένης — 貧しい者); καταδυναστεύοντες πτωχοὺς ἀπὸ τῆς γῆς — «притесняющие нищих от земли» (καταδυναστεύω — 虐げる)."
  5: "Πότε διελεύσεται ὁ μήν — «когда пройдёт месяц (новолуние)» (μήν — месяц, 新月; διέρχομαι — проходить); ἐμπολήσομεν — «будем продавать» (ἐμπολάω — торговать); τὰ σάββατα καὶ ἀνοίξομεν θησαυρούς — «субботы, и откроем сокровищницы» (σάββατον — 安息日; θησαυρός — 倉); ποιῆσαι μικρὸν μέτρον — «сделать меру малой» (μέτρον — 量り); μεγαλῦναι στάθμια — «увеличить вес» (στάθμιον — гиря/вес, 目方); ποιῆσαι ζυγὸν ἄδικον — «сделать весы неправедные» (ζυγός — 秤; ἄδικος — 偽り). Слова торговцев — 「…»."
  6: "τοῦ κτᾶσθαι ἐν ἀργυρίῳ πτωχούς — «чтобы приобретать за серебро нищих» (κτάομαι — приобретать, 買う; ἀργύριον — 銀); ταπεινὸν ἀντὶ ὑποδημάτων — «бедного за сандалии» (ταπεινός — 乏しい; ὑπόδημα — обувь, 履物); ἀπὸ παντὸς γενήματος ἐμπορευσόμεθα — «от всякого урожая будем торговать» (γένημα — урожай/плод, 穀物; ἐμπορεύομαι — 商う). В ru (МТ) «высевки из хлеба продавать» — иное чтение, не внесено."
  7: "ὀμνύει κύριος καθ' ὑπερηφανίας Ιακωβ — «клянётся Господь высокомерием (славою) Иакова» (ὀμνύω — 誓う; ὑπερηφανία — высокомерие, 高ぶり; в ru «славою» — МТ); Εἰ ἐπιλησθήσεται εἰς νεῖκος πάντα τὰ ἔργα ὑμῶν — «если забудет в конец все дела ваши» (ἐπιλανθάνομαι — забывать, 忘れる; εἰς νεῖκος — «до конца/в вражду», клятвенная формула = не забуду); передано 「決して忘れない」."
  8: "ἐπὶ τούτοις οὐ ταραχθήσεται ἡ γῆ — «от этого не поколеблется ли земля» (ταράσσω — колебать, 震え動く); πενθήσει πᾶς ὁ κατοικῶν ἐν αὐτῇ — «восплачет всякий живущий на ней» (πενθέω — 嘆く); ἀναβήσεται ὡς ποταμὸς συντέλεια — «поднимется, как река, конец её» (ποταμός — 川; συντέλεια — конец/потоп); καταβήσεται ὡς ποταμὸς Αἰγύπτου — «опустится, как река Египетская» (т.е. Нил, ナイル川)."
  9: "καὶ ἔσται ἐν ἐκείνῃ τῇ ἡμέρᾳ, λέγει κύριος ὁ θεός — «и будет в тот день, говорит Господь Бог»; δύσεται ὁ ἥλιος μεσημβρίας — «зайдёт солнце в полдень» (δύω — заходить, 沈む; μεσημβρία — полдень, 真昼); συσκοτάσει ἐπὶ τῆς γῆς ἐν ἡμέρᾳ τὸ φῶς — «помрачит на земле среди дня свет» (συσκοτάζω — 暗くする)."
  10: "μεταστρέψω τὰς ἑορτὰς ὑμῶν εἰς πένθος — «обращу праздники ваши в плач» (μεταστρέφω — превращать; ἑορτή — 祭り; πένθος — траур, 喪); πάσας τὰς ᾠδὰς ὑμῶν εἰς θρῆνον — «все песни ваши в плач» (ᾠδή — 歌; θρῆνος — 弔いの歌); ἀναβιβῶ ἐπὶ πᾶσαν ὀσφὺν σάκκον — «возложу на все чресла вретище» (ἀναβιβάζω — возводить/налагать, 着けさせる; ὀσφύς — чресла, 腰; σάκκος — 粗布); ἐπὶ πᾶσαν κεφαλὴν φαλάκρωμα — «на всякую голову плешь» (φαλάκρωμα — облысение, 剃り跡); θήσομαι αὐτὸν ὡς πένθος ἀγαπητοῦ — «сделаю его как плач о возлюбленном (единственном)» (ἀγαπητός — любимый, ひとり子); τοὺς μετ' αὐτοῦ ὡς ἡμέραν ὀδύνης — «и бывших с ним как день боли» (ὀδύνη — 苦い日)."
  11: "ἰδοὺ ἡμέραι ἔρχονται, λέγει κύριος — «вот, дни идут, говорит Господь»; ἐξαποστελῶ λιμὸν ἐπὶ τὴν γῆν — «пошлю голод на землю» (λιμός — 飢え); οὐ λιμὸν ἄρτου οὐδὲ δίψαν ὕδατος — «не голод хлеба и не жажду воды» (ἄρτος — パン; δίψα — 渇き); ἀλλὰ λιμὸν τοῦ ἀκοῦσαι λόγον κυρίου — «но голод слышания слова Господня» (ἀκούω — 聞く)."
  12: "σαλευθήσονται ὕδατα ἕως θαλάσσης — «поколеблются воды (люди?) до моря» (σαλεύω — колебать, 揺れ動く; ὕδωρ — 水; θάλασσα — 海); ἀπὸ βορρᾶ ἕως ἀνατολῶν περιδραμοῦνται — «от севера до востока обтекут» (περιτρέχω — оббегать, 走り回る); ζητοῦντες τὸν λόγον κυρίου καὶ οὐ μὴ εὕρωσιν — «ища слово Господне и не найдут» (ζητέω — 求める; εὑρίσκω — 見つける)."
  13: "ἐν τῇ ἡμέρᾳ ἐκείνῃ ἐκλείψουσιν αἱ παρθένοι αἱ καλαὶ καὶ οἱ νεανίσκοι ἐν δίψει — «в тот день оскудеют девы прекрасные и юноши в жажде» (ἐκλείπω — оскудевать, 衰える; παρθένος — 処女; νεανίσκος — 若者; δίψος — 渇き)."
  14: "οἱ ὀμνύοντες κατὰ τοῦ ἱλασμοῦ Σαμαρείας — «клянущиеся умилостивлением (очищением) Самарии» (ὀμνύω — 誓う; ἱλασμός — умилостивление/очищение, csl «очищение»; в ru «грех» — МТ; передано 罪の贖い); Ζῇ ὁ θεός σου, Δαν — «жив Бог твой, Дан» (ζάω — 生きる; Δαν — ダン); ζῇ ὁ θεός σου, Βηρσαβεε — «жив Бог твой, Вирсавия» (Βηρσαβεε — ベエルシェバ); πεσοῦνται καὶ οὐ μὴ ἀναστῶσιν ἔτι — «падут и не восстанут более» (πίπτω — 倒れる; ἀνίστημι — 起き上がる). Клятвы — 「…」."
