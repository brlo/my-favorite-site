verses:
  1: "その日[ひ]、デボラとアビネエムの子[こ]バラクは歌[うた]って言[い]った。"
  2: "「イスラエルで指導者[しどうしゃ]たちが立[た]ったとき、民[たみ]が自[みずか]ら進[すす]み出[で]たとき、主[しゅ]をほめたたえよ。"
  3: "聞[き]け、王[おう]たちよ。耳[みみ]を傾[かたむ]けよ、力[ちから]ある君主[くんしゅ]たちよ。わたしは主[しゅ]に歌[うた]い、イスラエルの神[かみ]にほめ歌う。"
  4: "主[しゅ]よ、あなたがセイルから出[で]て行[い]かれるとき、エドムの野[の]から旅立[たびだ]たれるとき、地[ち]は震[ふる]え、天[てん]は揺[ゆ]れ動[うご]き、雲[くも]は水[みず]を滴[したた]らせた。"
  5: "山々[やまやま]は主[しゅ]の前[まえ]で揺[ゆ]れ動[うご]いた。このシナイも、イスラエルの神[かみ]である主[しゅ]の前[まえ]で。"
  6: "サメガルの子[こ]アナトの日[ひ]に、ヤエルの日に、王[おう]たちは絶[た]え、小径[こみち]を歩[ある]み、曲[ま]がった道[みち]を歩んだ。"
  7: "イスラエルでは告[つ]げる者[もの]が絶[た]えた。絶えた。デボラが立[た]ち上[あ]がるまで、イスラエルに母[はは]が立ったからである。"
  8: "彼[かれ]らは新[あたら]しい神々[かみがみ]を選[えら]んだ。まるで大麦[おおむぎ]のパンのように。四万[よんまん]のうちに、盾[たて]を一[ひと]つでも見[み]るだろうか。"
  9: "わたしの心[こころ]は、イスラエルで定[さだ]められた者[もの]たちにある。民[たみ]の力[ちから]ある者たちよ、主[しゅ]をほめたたえよ。"
  10: "荷[に]を負[お]うろばに乗[の]る者[もの]たちよ、車[くるま]に座[すわ]る者たちよ。"
  11: "喜[よろこ]ぶ者[もの]たちの間[あいだ]で、楽[がく]を奏[かな]でる者たちの声[こえ]を上[あ]げよ。そこでは主[しゅ]に正[ただ]しさをささげる。イスラエルでは正しい者[もの]たちが力[ちから]を強[つよ]めた。そのとき、主[しゅ]の民[たみ]はその町々[まちまち]へ下[くだ]って行[い]った。"
  12: "目[め]を覚[さ]ませ、目を覚ませ、デボラ。民[たみ]とともに幾万[いくまん]の群[む]れを呼[よ]び起[お]こせ。目を覚ませ、目を覚ませ、歌[うた]い始[はじ]めよ。力[ちから]を強[つよ]めて立[た]ち上[あ]がれ、バラク。デボラよ、バラクを強くせよ。あなたの捕虜[ほりょ]を引[ひ]き連[つ]れて行[い]け、アビネエムの子[こ]よ。"
  13: "いつ、彼[かれ]の力[ちから]は大[おお]きくなったのか。主[しゅ]よ、わたしの前[まえ]で、わたしより強[つよ]い者[もの]たちを低[ひく]くしてください。"
  14: "エフライムの民[たみ]は彼[かれ]らを谷[たに]で罰[ばっ]した。あなたの兄弟[きょうだい]ベニヤミンはあなたの民[たみ]のうちに。わたしのうちからマキルが、探[さぐ]る者[もの]たちとともに下[くだ]って来[き]た。ゼブルンからは、主[しゅ]がわたしのために、強[つよ]い者たちとともに戦[たたか]われた。そこから、導[みちび]きを強める者[もの]の杖[つえ]をもって。"
  15: "イッサカルでは、デボラとともに彼[かれ]はその歩兵[ほへい]を谷[たに]へ送[おく]った。なぜ、あなたは唇[くちびる]の間[あいだ]に住[す]むのか。彼はその足[あし]もとに手[て]を伸[の]べた。ルベンの分[わ]かれた所[ところ]には、心[こころ]の大[おお]きな探[さぐ]り求[もと]めがある。"
  16: "なぜ、あなたは羊[ひつじ]の囲[かこ]いの間[あいだ]に座[すわ]って、立[た]ち上[あ]がる者[もの]たちの笛[ふえ]の音[ね]を聞[き]くのか。ルベンのところへ渡[わた]るために。心[こころ]の大きな探り求[もと]めがある。"
  17: "ギレアドはヨルダンの向[む]こう側[がわ]に住[す]んだ。ダンはなぜ舟[ふね]のそばに住むのか。アシェルは海[うみ]の岸辺[きしべ]に住み、その入[い]り江[え]のほとりに住んだ。"
  18: "ゼブルンは、その命[いのち]を死[し]にまで軽[かろ]んじた民[たみ]、ネフタリも野[の]の高[たか]みの上[うえ]で。"
  19: "王[おう]たちは来[き]て、陣[じん]を構[かま]えた。そのとき、カナンの王たちはタナクで、メギドの水[みず]のほとりで戦[たたか]った。彼[かれ]らは銀[ぎん]の利[り]を得[え]なかった。"
  20: "天[てん]から星[ほし]たちが戦[たたか]った。その定[さだ]められた位置[いち]から、彼[かれ]らはシセラと戦った。"
  21: "キションの流[なが]れが彼[かれ]らを押[お]し流[なが]した。カディミムの流れ、キションの流れ。わたしの強[つよ]い魂[たましい]が彼らを踏[ふ]みにじる。"
  22: "そのとき、馬[うま]のひづめは切[き]り落[お]とされた。強[つよ]い者[もの]たちの激[はげ]しい駆[か]け足[あし]によって。"
  23: "メロズを呪[のろ]え、と主[しゅ]の使[つか]いは言[い]った。その住[す]む者[もの]たちを呪いで呪え。彼[かれ]らは主[しゅ]の助[たす]けに来[こ]なかったからである。わたしたちの助けである主は、戦士[せんし]たちのうちで強[つよ]い。"
  24: "女[おんな]たちのうちで、ケニ人[じん]ヘベルの妻[つま]ヤエルがほめたたえられるように。天幕[てんまく]にいる女たちのうちで、ほめたたえられるように。"
  25: "彼[かれ]は水[みず]を求[もと]めた。彼女[かのじょ]は乳[ちち]を与[あた]え、力[ちから]ある者[もの]の鉢[はち]にバターを盛[も]って差[さ]し出[だ]した。"
  26: "彼女[かのじょ]は左[ひだり]の手[て]を杭[くい]に伸[の]べ、右[みぎ]の手を、働[はたら]く者[もの]たちの槌[つち]へ伸べた。そしてシセラを切[き]り倒[たお]し、その頭[あたま]を打[う]ち砕[くだ]き、砕いて、その顎骨[がっこつ]を刺[さ]し通[とお]した。"
  27: "彼[かれ]は彼女[かのじょ]の足[あし]の間[あいだ]で身[み]をかがめて倒[たお]れ、彼女の足の間で眠[ねむ]った。かがんだところに、哀[あわ]れな者[もの]は倒れた。"
  28: "シセラの母[はは]は窓[まど]から身[み]を乗[の]り出[だ]し、格子[こうし]越[ご]しに、シセラとともに帰[かえ]る者[もの]たちを眺[なが]めて言[い]った。『なぜ、彼[かれ]の戦車[せんしゃ]は来[く]るのが遅[おそ]いのか。なぜ、彼の戦車の跡[あと]は遅[おそ]れているのか。』"
  29: "彼女[かのじょ]の女[おんな]たちのうちの賢[かしこ]い者[もの]たちが彼女に答[こた]え、彼女もまた、自分[じぶん]の言葉[ことば]で答えた。"
  30: "『彼[かれ]らは彼[かれ]を見[み]つけて、分捕[ぶんど]り物[もの]を分[わ]けているのではないか。友[とも]たちを愛[あい]し、強[つよ]い者[もの]の頭[あたま]に分[わ]け前[まえ]を与[あた]えているのではないか。シセラの分捕り物、色[いろ]とりどりに染[そ]められた分捕り物、色とりどりに染められた布[ぬの]。彼の首[くび]の周[まわ]りには、分捕り物の色とりどりの布がある。』"
  31: "主[しゅ]よ、あなたの敵[てき]はみな、そう滅[ほろ]びるように。あなたを愛[あい]する者[もの]たちは、力[ちから]のうちに昇[のぼ]る太陽[たいよう]のようでありますように。」"
  32: "そして、地[ち]は四十[よんじゅう]年[ねん]の間[あいだ]、平穏[へいおん]であった。"

notes:
  1: "ᾖσεν — воспела (ᾄδω; слав. «воспе»). καὶ εἶπεν — «и сказал(а)»; сама песнь начинается со ст. 2, поэтому здесь только зачин. υἱὸς Αβινεεμ — сын Авинеема (в LXX Варак назван сыном Авинеема, слав. «сын авинеемов»). ἐν τῇ ἡμέρᾳ ἐκείνῃ — в тот день."
  2: "Ἐν τῷ ἄρξασθαι ἀρχηγούς — «когда начали вожди» (ἄρχω; слав. «внегда начати вождом»). ἐν προαιρέσει λαοῦ — «в добровольном расположении народа» (προαίρεσις — «выбор, намерение»), передано 民が自ら進み出た. εὐλογεῖτε τὸν κύριον — благословите Господа (императив)."
  3: "ἀκούσατε — услышьте; ἐνωτίζεσθε — внимайте, склоняйте ухо (ἐνωτίζομαι). σατράπαι δυνατοί — «сатрапы сильные» (σατράπης — персидский наместник), 君主. ᾄσομαι — воспою; ψαλῶ — «пою с игрой» (ψάλλω — бряцать, петь), ほめ歌う."
  4: "ἐν τῇ ἐξόδῳ σου ἐκ Σηιρ — при выходе Твоём из Сеира (Σηιρ). ἀπαίρειν — сниматься со стана, уходить. γῆ ἐσείσθη — земля потряслась (σείω). ὁ οὐρανὸς ἐξεστάθη — небо поколебалось (ἐξίστημι). αἱ νεφέλαι ἔσταξαν ὕδωρ — облака закапали воду (στάζω)."
  5: "ὄρη ἐσαλεύθησαν — горы поколебались (σαλεύω). ἀπὸ προσώπου κυρίου — от лица Господа. τοῦτο Σινα — «этот Синай» (указание; слав. «тая сина»; ср. «елои» в слав. — иное чтение). ἀπὸ προσώπου κυρίου θεοῦ Ισραηλ — от лица Господа Бога Израилева."
  6: "Σαμεγαρ υἱὸς Αναθ — Самегар, сын Анафа. ἐν ἡμέραις Ιαηλ — во дни Иаили (так в LXX). ἐξέλιπον βασιλεῖς — «оскудели цари» (ἐκλείπω); слав. и Синод. читают «пути оскудеша» (ὁδοί) — в базе βασιλεῖς, отсюда 王たちは絶え. τρίβους — тропы; ὁδοὺς διεστραμμένας — пути кривые (διαστρέφω)."
  7: "ἐξέλιπεν φράζων — «оскудел вещающий» (φράζω — говорить, объявлять); слав. «оскудеша живущии» — иное чтение. ἕως οὗ ἐξανέστη Δεββωρα — доколе не восстала Девора (ἐξανίστημι). ὅτι ἀνέστη μήτηρ — «ибо восстала мать»; слав. передаёт вторым «дондеже», по-японски сохранён причинный смысл."
  8: "ᾑρέτισαν θεοὺς καινούς — избрали новых богов (αἱρετίζω). ὡς ἄρτον κρίθινον — как хлеб ячменный (κρίθινος), 大麦のパン. σκέπην ἐὰν ἴδω — «щит если увижу» (σκέπη — покров, щит; ἐάν с сослагательным). σιρομαστῶν — тёмное слово (hapax, вероятно «щитоносцев/воинов»), отдельно не передано. ἐν τεσσαράκοντα χιλιάσιν — в сорока тысячах. Слав. добавляет «тогда воеваша грады князей» и «копие» — в базе этого нет, 〔…〕 не ставились."
  9: "ἡ καρδία μου ἐπὶ τὰ διατεταγμένα — «сердце моё к установленному» (διατάσσω; слав. «на учиненная»). οἱ δυνάσται τοῦ λαοῦ — владыки народа (δυνάστης). εὐλογεῖτε — благословите."
  10: "ἐπιβεβηκότες ἐπὶ ὑποζυγίων — сидящие на вьючных животных (ὑποζύγιον — осёл, вьючный скот). λαμπηνῶν — род. мн. от λαμπήνη «крытая повозка, носилки»; слав. «на судищи» — иное чтение, Синод. «на коврах». В базе стих без императива: «возвещайте» (слав.) и «пойте» (Синод.) относятся к ст. 11 (φθέγξασθε), поэтому здесь только обращение."
  11: "φθέγξασθε φωνήν — возвысьте голос (φθέγγομαι). ἀνακρουομένων — играющих, ударяющих по струнам (ἀνακρούω); слав. «плещущих». ἀνὰ μέσον εὐφραινομένων — среди веселящихся. δώσουσιν δικαιοσύνην κυρίῳ — «воздадут правду Господу». δίκαιοι ἐνίσχυσαν — праведники укрепились (ἐνισχύω). κατέβη εἰς τὰς πόλεις αὐτοῦ ὁ λαὸς κυρίου — сошёл в города свои народ Господень."
  12: "ἐξεγείρου — пробудись (ἐγείρω; трижды повторено, повтор сохранён). ἐξέγειρον μυριάδας μετὰ λαοῦ — подними мириады с народом. λάλει μετ᾽ ᾠδῆς — «говори с песнью», т.е. запевай; передано 歌い始めよ (в брифе эта формула для ἐξάρχετε, которого в гл. 5 нет; ср. Исх 15:21 ἐξῆρχεν). ἐνισχύων ἐξανίστασο — «укрепляясь, восставай». αἰχμαλώτιζε αἰχμαλωσίαν σου — «плени плен твой» (внутренний объект, как в слав.), передано 捕虜を引き連れて行け; сын Авинеема."
  13: "πότε ἐμεγαλύνθη ἡ ἰσχὺς αὐτοῦ; — «когда возвеличилась сила его?» (πότε — когда; в издании с вопросительным знаком). Слав. «тогда возвеличися» — иное чтение (τότε). ταπείνωσόν μοι — «смири мне», т.е. предо мной (ταπεινόω). ἰσχυροτέρους μου — сильнейших меня."
  14: "ἐτιμωρήσατο αὐτούς — наказал их (τιμωρέω); слав. «утомиша». ἐν κοιλάδι ἀδελφοῦ σου Βενιαμιν — в долине брата твоего Вениамина. ἐξ ἐμοῦ Μαχιρ κατέβησαν ἐξερευνῶντες — тёмное место: «из меня (от меня) Махир сошли разыскивающие» (ἐξερευνάω), передано わたしのうちから; слав. «от мене махир снидоша взыскующии». ἐν σκήπτρῳ ἐνισχύοντος ἡγήσεως — «с жезлом укрепляющего вождения» (σκῆπτρον, ἡγήσις); смысл темен."
  15: "ἐξαπέστειλεν πεζοὺς αὐτοῦ — послал пеших своих. ἵνα τί σὺ κατοικεῖς ἐν μέσῳ χειλέων; — «зачем ты живёшь среди губ?» (χεῖλος — губа); евр. מִשְׁפְּתַיִם означает «овчарни, водопои», LXX понял как «уста». ἐξέτεινεν ἐν τοῖς ποσὶν αὐτοῦ — «простёр в ногах своих» (дополнение «руку» подразумевается; тёмно). ἀκριβασμοὶ καρδίας — «изыскания сердца» (ἀκριβασμός; слав. «испытания сердца»)."
  16: "μοσφαθαιμ — транслитерация евр. «мишпатаим» (загоны, водопои), передано 羊の囲い. ἵνα τί μοι κάθησαι — «зачем ты сидишь у меня» (μοι — этический датив, отдельно не передан). συρισμοί — свист, свирель (συρισμός); слав. «звиздание», Синод. «блеяние». ἐξιχνιασμοί — разыскания (ἐξιχνιασμός; ср. ἀκριβασμοί в 15). τοῦ διελθεῖν εἰς τὰ τοῦ Ρουβην — «чтобы перейти к Рувиму»."
  17: "Γαλααδ ἐν τῷ πέραν τοῦ Ιορδάνου — Галаад за Иорданом. Δαν … πλοίοις — Дан при кораблях (παροικέω — жить пришельцем). αἰγιαλός — берег. διακοπάς — проломы, заливы (διακοπή); слав. «в разделениих», передано 入り江."
  18: "ὀνειδίσας ψυχὴν αὐτοῦ εἰς θάνατον — «укоривший душу свою до смерти» (ὀνειδίζω), т.е. презревший жизнь; 命を死にまで軽んじた. ἐπὶ ὕψη ἀγροῦ — на высотах поля (ὕψος)."
  19: "παρετάξαντο — построились (παρατάσσω). βασιλεῖς Χανααν — цари Ханаана. ἐν Θενναχ — в Феннахе (タナク по корпусу; слав. «во фанаахе»). ἐπὶ ὕδατος Μαγεδδω — при водах Мегиддо (メギド). πλεονεξίαν ἀργυρίου οὐκ ἔλαβον — «корысти серебра не взяли» (πλεονεξία — стяжание)."
  20: "ἐκ τοῦ οὐρανοῦ ἐπολέμησαν ἀστέρες — с неба воевали звёзды (ἀστήρ). ἐκ τῆς τάξεως αὐτῶν — «из строя (чина) своего» (τάξις), 定められた位置. μετὰ Σισαρα — с Сисарой."
  21: "χειμάρρους — зимний поток, 谷川 (χείμαρρος). ἐξέβαλεν — выбросил, увлёк (ἐκβάλλω). καδημιμ — транслитерация евр. «Кедумим» (древний поток), カディミム; слав. «кадимин». καταπατήσει — будущее «попрёт» (καταπατέω); слав. «поперет», Синод. «попирай» (иное понимание формы). ψυχὴ δυνατή — душа сильная."
  22: "ἀπεκόπησαν πτέρναι ἵππου — «отсеклись пятки коня» (πτέρνα — пятка; в поэтическом языке здесь о копыте, ひづめ). αμαδαρωθ — транслитерация евр. «галоп, стремительный бег»; передано 激しい駆け足 (слав. «от топтания»). δυνατῶν αὐτοῦ — сильных его."
  23: "καταράσασθε — прокляните (καταράομαι). Μαρωζ — Мероз (слав. «мазора», Синод. «Мероз»), メロズ. καταράσει καταράσασθε — «проклятием прокляните» (усиление). βοηθὸς ἡμῶν κύριος ἐν μαχηταῖς δυνατός — «помощник наш Господь, в воинах сильный»; в слав. этой части нет (там «в помощь (Господню) в сильных»)."
  24: "εὐλογηθείη — да будет благословенна (оптатив). ἐκ γυναικῶν — между жёнами. Ιαηλ γυνὴ Χαβερ τοῦ Κιναίου — Иаиль, жена Хевера Кенеянина (ケニ人). ἐν σκηνῇ — в шатре (слав. «в кущи»)."
  25: "ᾔτησεν αὐτήν — «просил её» (αἰτέω; винительный при глаголе просьбы). ἐν λακάνῃ ἰσχυρῶν — «в лохани сильных» (λακάνη — блюдо, лохань; ἰσχυρῶν — знатных, слав. «преимущих»). βούτυρον — масло, сливки (слав. «масло кравие»); евр. «густое молоко». προσήγγισεν — поднесла (προσάγω)."
  26: "τὴν ἀριστερὰν … τὴν δεξιάν — левую… правую руку (ἀριστερά, δεξιά). πάσσαλος — кол. εἰς ἀποτομὰς κατακόπων — «к отсечениям рубящих» (ἀποτομή, κατακόπτω); слав. «ко млату работающих», передано 槌. ἀπέτεμεν — отсекла (ἀποτέμνω). ἀπέτριψεν — размозжила (ἀποτρίβω). συνέθλασεν — сокрушила (συνθλάω). διήλασεν τὴν γνάθον — пронзила челюсть (διελαύνω), 顎骨."
  27: "συγκάμψας — согнувшись (συγκάμπτω). ἐκοιμήθη — уснул (κοιμάω). ἐν ᾧ ἔκαμψεν — «где согнулся» (κάμπτω). ταλαίπωρος — несчастный, жалкий (哀れな者). Повтор «между ног её» сохранён."
  28: "θυρίς — оконце; δικτυωτή — решётка (δικτυωτός). μεταστρέφοντας — возвращающихся (μεταστρέφω). ἠσχάτισεν — замедлил (ἀσχατίζω, редк.). ἴχνη ἁρμάτων — следы колесниц (ἴχνος, ἅρμα). Слова матери — 『…』 внутри песни."
  29: "σοφαὶ ἀρχουσῶν αὐτῆς — «мудрые из начальствующих её» (ἄρχουσα — знатная женщина). ἀνταπεκρίναντο — отвечали (ἀνταποκρίνομαι). ἀπεκρίνατο ἐν ῥήμασιν αὐτῆς — отвечала словами своими."
  30: "Οὐχὶ εὑρήσουσιν — «не найдут ли» (вопрос-предположение). διαμερίζοντα σκῦλα — делящего добычу (σκῦλον). φιλιάζων φίλοις — «лаская друзей» (φιλιάζω — целовать, ласкать); место тёмное. εἰς κεφαλὴν δυνατοῦ — «на голову сильного», т.е. каждому воину; Синод. «по девице, по две девицы» (иное чтение евр.). βαμμάτων / βαφὴ ποικίλων — крашеные и пёстрые ткани (βάμμα, βαφή, ποικίλος). περὶ τράχηλον — вокруг шеи."
  31: "ἀπόλοιντο — да погибнут (оптатив ἀπόλλυμι). οἱ ἀγαπῶντες αὐτόν — любящие Его. καθὼς ἡ ἀνατολὴ τοῦ ἡλίου — как восход солнца (ἀνατολή). ἐν δυναστείαις αὐτοῦ — «в силах его» (δυναστεία), т.е. в силе своей; слав. «в силе своей»."
  32: "ἡσύχασεν ἡ γῆ — земля покоилась (ἡσυχάζω). τεσσαράκοντα ἔτη — сорок лет. В LXX это отдельный стих 32; в Синодальном те же слова стоят в конце 31-го (нумерация расходится, в базе — 32 стиха)."
