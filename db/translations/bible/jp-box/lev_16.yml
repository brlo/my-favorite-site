verses:
  1: "主[しゅ]はモーセに言[い]われた。アロンの二人[ふたり]の子[こ]が主[しゅ]の前[まえ]に異[こと]なる火[ひ]を献[ささ]げて死[し]んだ後[あと]のことである。"
  2: "「あなたの兄弟[きょうだい]アロンに語[かた]って言[い]いなさい。彼[かれ]はいつでも、垂[た]れ幕[まく]の内側[うちがわ]の至[し]聖所[せいしょ]、証[あかし]の箱[はこ]の上[うえ]にある贖[あがな]いの座[ざ]の前[まえ]に入[はい]ってはならない。死[し]ぬことのないためである。わたしは雲[くも]のうちにあって、その贖いの座の上に現[あらわ]れるからである。"
  3: "アロンはこうして聖所[せいしょ]に入[はい]る。牛[うし]の群[む]れからの子牛[こうし]を贖罪祭[しょくざいさい]として、雄羊[おすひつじ]を燔祭[はんさい]として携[たずさ]えて入る。"
  4: "彼[かれ]は聖[せい]なる亜麻布[あさぬの]の長衣[ながぎぬ]を着[き]、亜麻布の下着[したぎ]を体[からだ]に着け、亜麻[あさ]の帯[おび]を締[し]め、亜麻布の頭巾[ずきん]をかぶる。これらは聖なる衣服[いふく]である。彼は水[みず]で全身[ぜんしん]を洗[あら]ってから、それらを着る。"
  5: "また、イスラエルの子[こ]らの会衆[かいしゅう]から、山羊[やぎ]の群[む]れから雄山羊[おすやぎ]二匹[にひき]を贖罪祭[しょくざいさい]として、雄羊[おすひつじ]一匹[いっぴき]を燔祭[はんさい]として取[と]る。"
  6: "アロンは自分[じぶん]のための贖罪祭[しょくざいさい]の子牛[こうし]を献[ささ]げ、自分と自分の家[いえ]のために贖[あがな]いをする。"
  7: "彼[かれ]は二匹[にひき]の雄山羊[おすやぎ]を取[と]り、主[しゅ]の前[まえ]、証[あかし]の幕屋[まくや]の入口[いりぐち]に立[た]たせる。"
  8: "アロンは二匹[にひき]の雄山羊[おすやぎ]の上[うえ]にくじを置[お]き、一[ひと]つのくじを主[しゅ]に、もう一つのくじをアザゼル⟨荒野[こうや]へ送[おく]り出[だ]される山羊[やぎ]に結[むす]びつけられた名[な]で、その山羊は民[たみ]の罪[つみ]を負[お]う。⟩に帰[き]する。"
  9: "アロンは、主[しゅ]のためのくじが当[あ]たった雄山羊[おすやぎ]を引[ひ]き寄[よ]せ、それを贖罪祭[しょくざいさい]として献[ささ]げる。"
  10: "アザゼルのくじが当[あ]たった雄山羊[おすやぎ]は、主[しゅ]の前[まえ]に生[い]きたまま立[た]たせ、その上[うえ]で贖[あがな]いをして、追放[ついほう]として荒野[こうや]へ送[おく]り出[だ]すためである。彼[かれ]はそれを荒野へ放[はな]つ。"
  11: "アロンは自分[じぶん]のための贖罪祭[しょくざいさい]の子牛[こうし]を、すなわち自分と自分の家[いえ]のための子牛を献[ささ]げ、自分と自分の家のために贖[あがな]いをして、その贖罪祭の子牛を屠[ほふ]る。"
  12: "彼[かれ]は主[しゅ]の前[まえ]にある祭壇[さいだん]から、火[ひ]の付[つ]いた炭[すみ]を満[み]たした火皿[ひざら]を取[と]り、細[こま]かく調[ととの]えた香[こう]を両手[りょうて]に満たし、垂[た]れ幕[まく]の内側[うちがわ]に持[も]って入[はい]る。"
  13: "彼[かれ]は香[こう]を主[しゅ]の前[まえ]の火[ひ]の上[うえ]に置[お]く。香の煙[けむり]が証[あかし]の上にある贖[あがな]いの座[ざ]を覆[おお]う。彼は死[し]なない。"
  14: "彼[かれ]は子牛[こうし]の血[ち]を取[と]って、指[ゆび]で東[ひがし]の方[ほう]へ贖[あがな]いの座[ざ]に振[ふ]りかける。すなわち、贖いの座の前[まえ]に、その血を指で七[なな]度[ど]振りかける。"
  15: "彼[かれ]は民[たみ]のための贖罪祭[しょくざいさい]の雄山羊[おすやぎ]を主[しゅ]の前[まえ]で屠[ほふ]り、その血[ち]を垂[た]れ幕[まく]の内側[うちがわ]に持[も]って入[はい]って、子牛[こうし]の血でしたようにその血で行[おこな]い、贖[あがな]いの座[ざ]の上[うえ]とその前に振[ふ]りかける。"
  16: "こうして彼[かれ]は、イスラエルの子[こ]らの汚[けが]れとその背[そむ]き、すなわちそのすべての罪[つみ]から、聖所[せいしょ]のために贖[あがな]いをする。彼はまた、彼らの汚れの真[ま]ん中[なか]にある証[あかし]の幕屋[まくや]についても、同[おな]じようにする。"
  17: "彼[かれ]が聖所[せいしょ]のために贖[あがな]いをするために入[はい]っている間[あいだ]、証[あかし]の幕屋[まくや]にはだれもいてはならない。彼が出[で]るまでである。彼は自分[じぶん]と自分の家[いえ]、イスラエルの子[こ]らの全会衆[ぜんかいしゅう]のために贖いをする。"
  18: "彼[かれ]は主[しゅ]の前[まえ]にある祭壇[さいだん]へ出[で]て行[い]き、そのために贖[あがな]いをする。彼は子牛[こうし]の血[ち]と雄山羊[おすやぎ]の血を取[と]って、祭壇の四[よ]方[ほう]の角[つの]に塗[ぬ]る。"
  19: "彼[かれ]は指[ゆび]でその血[ち]を祭壇[さいだん]の上[うえ]に七[なな]度[ど]振[ふ]りかけ、それを清[きよ]め、イスラエルの子[こ]らの汚[けが]れからそれを聖別[せいべつ]する。"
  20: "彼[かれ]は聖所[せいしょ]と証[あかし]の幕屋[まくや]と祭壇[さいだん]の贖[あがな]いを終[お]え、祭司[さいし]たちを清[きよ]める。そして、生[い]きた雄山羊[おすやぎ]を引[ひ]き寄[よ]せる。"
  21: "アロンは生[い]きた雄山羊[おすやぎ]の頭[あたま]に両手[りょうて]を置[お]き、その上[うえ]で、イスラエルの子[こ]らのすべての不法[ふほう]、すべての背[そむ]き、すべての罪[つみ]を告白[こくはく]して、それらを雄山羊の頭に載[の]せ、用意[ようい]された人[ひと]の手[て]に託[たく]して荒野[こうや]へ送[おく]り出[だ]す。"
  22: "雄山羊[おすやぎ]は、彼[かれ]らの背[そむ]きをすべて自分[じぶん]に負[お]って、人[ひと]の住[す]まない地[ち]へ行[い]く。彼はその雄山羊を荒野[こうや]へ放[はな]つ。"
  23: "アロンは証[あかし]の幕屋[まくや]に入[はい]り、聖所[せいしょ]に入るときに着[き]ていた亜麻布[あさぬの]の衣服[いふく]を脱[ぬ]ぎ、そこに置[お]く。"
  24: "彼[かれ]は聖[せい]なる場所[ばしょ]で水[みず]で全身[ぜんしん]を洗[あら]い、自分[じぶん]の衣服[いふく]を着[き]て外[そと]へ出[で]、自分のための燔祭[はんさい]と民[たみ]のための燔祭を献[ささ]げ、自分と自分の家[いえ]と民のために、祭司[さいし]たちのためにも贖[あがな]いをする。"
  25: "彼[かれ]は贖罪祭[しょくざいさい]の脂肪[しぼう]を祭壇[さいだん]の上[うえ]で焼[や]く。"
  26: "追放[ついほう]のために選[えら]び分[わ]けられた雄山羊[おすやぎ]を送[おく]り出[だ]した者[もの]は、衣服[いふく]を洗[あら]い、水[みず]で体[からだ]を洗ってから、宿営[しゅくえい]に入[はい]る。"
  27: "贖罪祭[しょくざいさい]の子牛[こうし]と贖罪祭の雄山羊[おすやぎ]は、その血[ち]が聖所[せいしょ]に持[も]ち込[こ]まれて贖[あがな]いに用[もち]いられたものである。それらは宿営[しゅくえい]の外[そと]へ運[はこ]び出[だ]され、その皮[かわ]も肉[にく]も汚物[おぶつ]も火[ひ]で焼[や]かれる。"
  28: "それらを焼[や]く者[もの]は、衣服[いふく]を洗[あら]い、水[みず]で体[からだ]を洗ってから、宿営[しゅくえい]に入[はい]る。"
  29: "これがあなたがたの永遠[えいえん]の定[さだ]めとなる。第七[だいしち]の月[つき]の十日[とおか]、あなたがたは断食[だんじつ]して身[み]を低[ひく]くし、何[なに]の仕事[しごと]もしてはならない。その地[ち]の生[う]まれの者[もの]も、あなたがたの間[あいだ]にいる寄留者[きりゅうしゃ]も同[おな]じである。"
  30: "この日[ひ]、あなたがたのために贖[あがな]いが行[おこな]われ、あなたがたはすべての罪[つみ]から清[きよ]められる。主[しゅ]の前[まえ]で清くされるのである。"
  31: "これはあなたがたにとって、安息[あんそく]の安息、すなわち休[やす]みとなる。あなたがたは断食[だんじつ]して身[み]を低[ひく]くしなければならない。これは永遠[えいえん]の定[さだ]めである。"
  32: "油[あぶら]を注[そそ]がれ、父[ちち]に代[か]わって祭司[さいし]として仕[つと]えるために任[にん]じられた祭司が贖[あがな]いをする。彼[かれ]は聖[せい]なる亜麻布[あさぬの]の衣服[いふく]を着[き]る。"
  33: "彼[かれ]は至[し]聖所[せいしょ]のために贖[あがな]いをし、証[あかし]の幕屋[まくや]と祭壇[さいだん]のために贖いをし、祭司[さいし]たちのため、また全会衆[ぜんかいしゅう]のために贖いをする。"
  34: "これがあなたがたの永遠[えいえん]の定[さだ]めとなる。イスラエルの子[こ]らのすべての罪[つみ]のために、年[とし]に一度[いちど]、贖[あがな]いをするのである。」主[しゅ]がモーセに命[めい]じられたとおりである。"

notes:
  1: "μετὰ τὸ τελευτῆσαι — «после того как умерли» (τελευτάω); πῦρ ἀλλότριον — чуждый огонь (ср. 10:1); в конце LXX повторяет καὶ ἐτελεύτησαν («и умерли»), слав. «и скончастася»."
  2: "πᾶσαν ὥραν — «во всякое время», постоянно. τὸ ἅγιον ἐσώτερον τοῦ καταπετάσματος — внутреннее святилище за завесой, т. е. 至聖所; ἱλαστήριον — 贖いの座 (крышка ковчега); κιβωτὸς τοῦ μαρτυρίου — «ковчег свидетельства» (в корпусе обычно 契約の箱). ἐν νεφέλῃ ὀφθήσομαι — «в облаке явлюсь»."
  3: "ἐν μόσχῳ ἐκ βοῶν — «с тельцом из крупного скота» (ἐν о жертвенном животном); περὶ ἁμαρτίας — «за грех», т. е. 贖罪祭; κριός — овен."
  4: "χιτὼν λινοῦς — льняной хитон (χιτών); περισκελές — «надраги», нижняя одежда (περισκελής «облегающий голени»); ζώνη λινῆ — льняной пояс; κίδαρις — головной убор (кидар); ἱμάτια ἅγια — священные одежды."
  5: "παρὰ τῆς συναγωγῆς — «от общества»; χίμαρος ἐξ αἰγῶν — козёл из коз; δύο … περὶ ἁμαρτίας — двух в жертву за грех."
  6: "προσάξει — приведёт (προσάγω); ἐξιλάσεται περὶ αὐτοῦ καὶ τοῦ οἴκου αὐτοῦ — совершит очищение за себя и дом свой."
  7: "στήσει — поставит (ἵστημι); παρὰ τὴν θύραν — у входа."
  8: "κλῆρον ἕνα τῷ κυρίῳ καὶ κλῆρον ἕνα τῷ ἀποπομπαίῳ — «жребий один Господу и жребий один отсылаемому»: LXX передаёт имя Азазель описательно, ὁ ἀποπομπαῖος — «тот, кого отсылают» (ἀποπομπή «отсылка»). В тексте — アザゼル со сноской."
  9: "ἐφ᾽ ὃν ἐπῆλθεν ὁ κλῆρος — «на которого вышел жребий»; προσοίσει περὶ ἁμαρτίας — принесёт как жертву за грех."
  10: "στήσει αὐτὸν ζῶντα — поставит его живым; τοῦ ἐξιλάσασθαι ἐπ᾽ αὐτοῦ — «чтобы совершить над ним очищение»; εἰς τὴν ἀποπομπήν — «в отсылку»; ἀφήσει εἰς τὴν ἔρημον — отпустит в пустыню. Слав. здесь добавляет фразу из ст. 22 («возмет козел на ся беззакония их»)."
  11: "τὸν μόσχον … τὸν αὐτοῦ — тельца за грех его; μόνον — «только» (в слав. опущено, вероятно дублет); σφάξει — заколет."
  12: "πυρεῖον — кадильница, угольница (火皿); ἄνθρακες πυρός — угли огня; θυμίαμα συνθέσεως λεπτῆς — благовоние мелкого состава, т. е. мелко истолчённая смесь; ἐσώτερον τοῦ καταπετάσματος — за завесу."
  13: "ἀτμίς — пар, дым; καλύψει — покроет; τὸ ἱλαστήριον τὸ ἐπὶ τῶν μαρτυρίων — крышка над скрижалями свидетельства; οὐκ ἀποθανεῖται — не умрёт."
  14: "ῥανεῖ τῷ δακτύλῳ — покропит перстом (ῥαίνω); κατὰ ἀνατολάς — «к востоку»; κατὰ πρόσωπον τοῦ ἱλαστηρίου — «пред лицом крышки»; ἑπτάκις — семь раз."
  15: "τὸν χίμαρον τὸν περὶ τῆς ἁμαρτίας τὸν περὶ τοῦ λαοῦ — козла за грех за народ; ὃν τρόπον — «как»; ῥανεῖ ἐπὶ τὸ ἱλαστήριον — покропит на крышку."
  16: "ἐξιλάσεται τὸ ἅγιον ἀπὸ τῶν ἀκαθαρσιῶν — «совершит очищение святилища от нечистот» (ἐξιλάσκομαι с ἀπό); ἀδίκημα — преступление, неправда; τῇ ἐκτισμένῃ ἐν αὐτοῖς — «устроенной среди них» (κτίζω)."
  17: "πᾶς ἄνθρωπος οὐκ ἔσται — «ни один человек не будет»; εἰσπορευομένου αὐτοῦ — «когда он входит» (род. абс.); ἕως ἂν ἐξέλθῃ — «доколе не выйдет»."
  18: "ἐξελεύσεται ἐπὶ τὸ θυσιαστήριον — выйдет к жертвеннику; τὸ ὂν ἀπέναντι κυρίου — который пред Господом; κέρατα — рога; κύκλῳ — вокруг."
  19: "ῥανεῖ … ἑπτάκις — покропит семь раз; καθαριεῖ … καὶ ἁγιάσει — очистит и освятит (два разных глагола не сведены)."
  20: "συντελέσει ἐξιλασκόμενος — «закончит совершать очищение» (συντελέω + прич.); περὶ τῶν ἱερέων καθαριεῖ — «и священников очистит»; προσάξει τὸν χίμαρον τὸν ζῶντα — приведёт живого козла."
  21: "ἐξαγορεύσει — исповедует, выскажет (ἐξαγορεύω; слав. «исповесть»); ἀνομίαι, ἀδικίαι, ἁμαρτίαι — беззакония, неправды, грехи (три слова сохранены); ἐν χειρὶ ἀνθρώπου ἑτοίμου — «рукою человека приготовленного», т. е. нарочного."
  22: "λήμψεται ὁ χίμαρος ἐφ᾽ ἑαυτῷ τὰς ἀδικίας — «возьмёт козёл на себя неправды»; γῆ ἄβατος — земля непроходимая; ἐξαποστελεῖ — отошлёт."
  23: "ἐκδύσεται τὴν στολὴν τὴν λινῆν — снимет льняную одежду; ἣν ἐνεδεδύκει — которую надел (плюсквамперфект); ἀποθήσει ἐκεῖ — положит там."
  24: "λούσεται τὸ σῶμα ὕδατι ἐν τόπῳ ἁγίῳ — омоет тело водою на месте святом; ὁλοκάρπωμα — всесожжение (иное слово, чем ὁλοκαύτωμα; в яп. сведено к 燔祭); ὡς περὶ τῶν ἱερέων — «как о священниках»."
  25: "τὸ στέαρ τὸ περὶ τῶν ἁμαρτιῶν — тук жертв за грех; ἀνοίσει — вознесёт (ἀναφέρω)."
  26: "ὁ ἐξαποστέλλων — отпускающий; τὸν διεσταλμένον εἰς ἄφεσιν — «отделённого, назначенного для отпущения» (διαστέλλω); μετὰ ταῦτα — после этого."
  27: "ὧν τὸ αἷμα εἰσηνέχθη — «кровь которых внесена» (εἰσφέρω); ἐξοίσουσιν ἔξω τῆς παρεμβολῆς — вынесут вон из стана; κόπρος — навоз, нечистоты (слав. «мотыла»); κατακαύσουσιν — сожгут."
  28: "ὁ κατακαίων — сжигающий; μετὰ ταῦτα εἰσελεύσεται εἰς τὴν παρεμβολήν — после этого войдёт в стан."
  29: "νόμιμον αἰώνιον — вечный устав; μὴν ἕβδομος — седьмой месяц; δεκάτῃ τοῦ μηνός — десятый день месяца; ταπεινώσατε τὰς ψυχὰς ὑμῶν — «смирите души ваши», церковное обозначение поста (слав. «покорите душы вашя»); αὐτόχθων — туземец; προσήλυτος ὁ προσκείμενος — пришелец, живущий среди вас."
  30: "ἐξιλάσεται περὶ ὑμῶν καθαρίσαι ὑμᾶς — «совершит за вас очищение, чтобы очистить вас» (оба глагола сохранены); καθαρισθήσεσθε — будете очищены."
  31: "σάββατα σαββάτων — «суббота суббот», т. е. полнейший покой (ср. 23:32); ἀνάπαυσις — покой; ταπεινώσετε τὰς ψυχάς — смирите души."
  32: "ὃν ἂν χρίσωσιν — которого помажут (χρίω); ὃν ἂν τελειώσουσιν τὰς χεῖρας αὐτοῦ — «которого посвятят, наполнив руки его» (τελειόω + χεῖρας, обряд посвящения); ἱερατεύειν μετὰ τὸν πατέρα — священнодействовать после отца."
  33: "τὸ ἅγιον τοῦ ἁγίου — «святое святых» (в яп. 至聖所); ἐξιλάσεται повторён трижды, как в LXX."
  34: "ἅπαξ τοῦ ἐνιαυτοῦ — «однажды в году»; ποιηθήσεται — будет совершаемо (пассив); καθάπερ συνέταξεν κύριος τῷ Μωυσῇ — «как повелел Господь Моисею»: в LXX стоит внутри речи Бога, в яп. вынесено за кавычки как заключительная ремарка."
