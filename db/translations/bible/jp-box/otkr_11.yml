verses:
  1: "わたしに杖[つえ]のような葦[あし]が与[あた]えられた。そして、こう言[い]われた。「立[た]ち上[あ]がって、神[かみ]の神殿[しんでん]と祭壇[さいだん]と、そこに拝[はい]んでいる者[もの]たちを測[はか]りなさい。"
  2: "しかし、神殿[しんでん]の外[そと]の庭[にわ]は除[のぞ]いて、測[はか]ってはならない。それは異邦人[いほうじん]に与[あた]えられており、彼[かれ]らは聖[せい]なる都[みやこ]を四十二[よんじゅうに]か月[げつ]の間[あいだ]、踏[ふ]みにじるからである。"
  3: "そして、わたしは、わたしの二[ふた]人[り]の証人[しょうにん]に与[あた]える。彼[かれ]らは粗布[あらぬの]をまとって、千二百六十日[せんにひゃくろくじゅうにち]の間[あいだ]、預言[よげん]する。」"
  4: "この二人[ふたり]は、地[ち]の主[しゅ]の御前[みまえ]に立[た]っている二本[にほん]のオリーブの木[き]と、二[ふた]つの燭台[しょくだい]である。"
  5: "もし、だれかが彼[かれ]らを害[がい]しようとすれば、彼[かれ]らの口[くち]から火[ひ]が出[で]て、敵[てき]を焼[や]き尽[つ]くす。もし、だれかが彼[かれ]らを害[がい]しようとすれば、その者[もの]はこのようにして殺[ころ]されなければならない。"
  6: "彼[かれ]らには、自分[じぶん]の預言[よげん]している日[ひ]の間[あいだ]、天[てん]を閉[と]ざして雨[あめ]を降[ふ]らせない力[ちから]があり、また、水[みず]を血[ち]に変[か]える力[ちから]と、望[のぞ]むたびに、あらゆる災[わざわ]いで地[ち]を打[う]つ力[ちから]がある。"
  7: "彼[かれ]らが証[あかし]を終[お]えると、底知[そこし]れない穴[あな]から上[のぼ]ってくる獣[けもの]が彼[かれ]らと戦[たたか]い、彼[かれ]らに勝[か]って、彼[かれ]らを殺[ころ]す。"
  8: "彼[かれ]らの死体[したい]は、大[おお]きな都[みやこ]の広場[ひろば]に横[よこ]たわる。その都[みやこ]は、霊的[れいてき]にソドム、またエジプトと呼[よ]ばれ、彼[かれ]らの主[しゅ]もそこで十字架[じゅうじか]につけられた。"
  9: "人[ひと]々[びと]は、諸[しょ]民族[みんぞく]、諸[しょ]部族[ぶぞく]、諸[しょ]言語[げんご]、諸[しょ]国民[こくみん]の中[なか]から、三日半[みっかはん]の間[あいだ]、彼[かれ]らの死体[したい]を見[み]る。そして、その死体[したい]を墓[はか]に納[おさ]めることを許[ゆる]さない。"
  10: "地[ち]に住[す]む者[もの]たちは、彼[かれ]らのことで喜[よろこ]び、楽[たの]しみ、互[たが]いに贈[おく]り物[もの]を送[おく]る。この二[ふた]人[り]の預言者[よげんしゃ]が、地[ち]に住[す]む者[もの]たちを苦[くる]しめたからである。"
  11: "三日半[みっかはん]が過[す]ぎると、命[いのち]の霊[れい]が神[かみ]から出[で]て彼[かれ]らの中[なか]に入[はい]り、彼[かれ]らは足[あし]で立[た]ち上[あ]がった。すると、彼[かれ]らを見[み]ていた者[もの]たちに大[おお]きな恐[おそ]れが襲[おそ]いかかった。"
  12: "そして、彼[かれ]らは、天[てん]から自分[じぶん]たちに語[かた]りかける大[おお]きな声[こえ]を聞[き]いた。「ここに上[のぼ]れ。」彼[かれ]らは雲[くも]に乗[の]って天[てん]に上[のぼ]り、敵[てき]たちがそれを見[み]た。"
  13: "その時[とき]、大[おお]きな地震[じしん]が起[お]こり、都[みやこ]の十分[じゅうぶん]の一[いち]が倒[たお]れた。地震[じしん]で死[し]んだ者[もの]は七千[ななせん]人[にん]で、残[のこ]りの者[もの]たちは恐[おそ]れを抱[いだ]き、天[てん]の神[かみ]に栄光[えいこう]を帰[き]した。"
  14: "第二[だいに]の災[わざわ]いは過[す]ぎ去[さ]った。見[み]よ、第三[だいさん]の災[わざわ]いが間[ま]もなく来[く]る。"
  15: "第七[だいしち]の天使[てんし]がラッパを吹[ふ]いた。すると、天[てん]に大[おお]きな声[こえ]が起[お]こって言[い]った。「この世[よ]の国[くに]は、わたしたちの主[しゅ]と、そのキリストの国[くに]となった。主[しゅ]は永遠[えいえん]に王[おう]として治[おさ]められる。」"
  16: "神[かみ]の御前[みまえ]に自分[じぶん]の座[ざ]に座[すわ]っている二十四[にじゅうよん]人[にん]の長老[ちょうろう]たちは、顔[かお]を伏[ふ]せて神[かみ]を拝[はい]み、"
  17: "言[い]った。「主[しゅ]なる神[かみ]、全能者[ぜんのうしゃ]よ。今[いま]おられ、かつておられた方[かた]よ。あなたは大[おお]いなる力[ちから]を取[と]って、王[おう]として治[おさ]められたことを、わたしたちは感謝[かんしゃ]します。"
  18: "諸国[しょこく]の民[たみ]は怒[いか]り、あなたの怒[いか]りが来[き]て、死者[ししゃ]を裁[さば]き、あなたの僕[しもべ]である預言者[よげんしゃ]たち、聖[せい]なる者[もの]たち、また、小[ちい]さい者[もの]も大[おお]きい者[もの]も、あなたの名[な]を畏[おそ]れる者[もの]たちに報[むく]いを与[あた]え、地[ち]を滅[ほろ]ぼす者[もの]たちを滅[ほろ]ぼす時[とき]が来[き]ました。」"
  19: "すると、天[てん]にある神[かみ]の神殿[しんでん]が開[ひら]かれ、その神殿[しんでん]の中[なか]に、神[かみ]の契約[けいやく]の箱[はこ]が見[み]えた。そして、稲妻[いなずま]、声[こえ]、雷[かみなり]、地震[じしん]、大[おお]きな雹[ひょう]が起[お]こった。"

notes:
  1: "κάλαμος ὅμοιος ῥάβδῳ — 杖のような葦 (κάλαμος — «тростник», здесь измерительная палочка). λέγων — «говоря» (согласование не строгое; передано безличным こう言われた). Ἔγειρε καὶ μέτρησον — 立ち上がって測りなさい. ναός — 神殿 (не ἱερόν)."
  2: "τὴν αὐλὴν τὴν ἔξωθεν — 外の庭. ἔκβαλε ἔξωθεν — 除いて (букв. «выбрось вон»): не измерять. ἔθνεσιν — 異邦人. μῆνας τεσσαράκοντα δύο — 四十二か月."
  3: "δύο μάρτυρες — 二人の証人. σάκκους — 粗布. ἡμέρας χιλίας διακοσίας ἑξήκοντα — 千二百六十日. «И дам» продолжает речь 11:1–3 (одна цитата); говорящий не назван, поэтому не красное — отмечено в шапке."
  4: "αἱ δύο ἐλαῖαι — 二本のオリーブの木; αἱ δύο λυχνίαι — 二つの燭台. τοῦ κυρίου τῆς γῆς — 地の主 (в jp-joc здесь «地の神», в базе κύριος — 主)."
  5: "πῦρ ἐκπορεύεται ἐκ τοῦ στόματος — 口から火が出る. οὕτως δεῖ αὐτὸν ἀποκτανθῆναι — このようにして殺されなければならない."
  6: "κλεῖσαι τὸν οὐρανόν — 天を閉ざす. ἵνα μὴ ὑετὸς βρέχῃ — 雨を降らせない. στρέφειν εἰς αἷμα — 血に変える. πατάξαι … ἐν πάσῃ πληγῇ — あらゆる災いで打つ."
  7: "τὸ θηρίον τὸ ἀναβαῖνον ἐκ τῆς ἀβύσσου — 底知れない穴から上ってくる獣. ποιήσει … πόλεμον — 戦い; νικήσει — 勝つ; ἀποκτενεῖ — 殺す."
  8: "πτῶμα — 死体. πλατεῖα — 広場. πνευματικῶς — 霊的に. Σόδομα καὶ Αἴγυπτος — ソドム、エジプト. ὁ κύριος αὐτῶν — 彼らの主 (в jp-joc «我らの主», в базе αὐτῶν)."
  9: "ἐκ τῶν λαῶν καὶ φυλῶν καὶ γλωσσῶν καὶ ἐθνῶν — 諸民族、諸部族、諸言語、諸国民. ἡμέρας τρεῖς καὶ ἥμισυ — 三日半. μνῆμα — 墓."
  10: "χαίρουσιν … εὐφραίνονται — 喜び、楽しみ. δῶρα πέμψουσιν ἀλλήλοις — 互いに贈り物を送る. ἐβασάνισαν — 苦しめた."
  11: "πνεῦμα ζωῆς ἐκ τοῦ θεοῦ — 命の霊 (πνεῦμα без ἅγιον — 霊, не 聖霊). ἔστησαν ἐπὶ τοὺς πόδας — 足で立ち上がった. φόβος μέγας — 大きな恐れ."
  12: "φωνῆς μεγάλης ἐκ τοῦ οὐρανοῦ — 天からの大きな声; Ἀνάβατε ὧδε — ここに上れ. ἐν τῇ νεφέλῃ — 雲に乗って. Голос с неба — не красный."
  13: "σεισμὸς μέγας — 大きな地震. τὸ δέκατον τῆς πόλεως — 都の十分の一. ὀνόματα ἀνθρώπων χιλιάδες ἑπτά — 七千人 (букв. «имена людей — семь тысяч»). ἔδωκαν δόξαν τῷ θεῷ — 神に栄光を帰した."
  14: "ἡ οὐαὶ ἡ δευτέρα — 第二の災い; ἡ οὐαὶ ἡ τρίτη — 第三の災い. ταχύ — 間もなく."
  15: "ἐγένοντο φωναὶ μεγάλαι … λέγοντες — 大きな声が起こって言った. ἡ βασιλεία τοῦ κόσμου — この世の国. εἰς τοὺς αἰῶνας τῶν αἰώνων — 永遠に. Славословие — в 「」, не красное."
  16: "οἱ εἴκοσι τέσσαρες πρεσβύτεροι — 二十四人の長老. ἐπὶ τοὺς θρόνους αὐτῶν — 自分の座に. ἔπεσαν ἐπὶ τὰ πρόσωπα — 顔を伏せて."
  17: "ὁ ὢν καὶ ὁ ἦν — 今おられ、かつておられた方; «и грядущий» (ὁ ἐρχόμενος) в gr-lxx-byz нет, у jp-joc добавлено — не вставлено. εἴληφας τὴν δύναμιν — 力を取って. ἐβασίλευσας — 王として治められた."
  18: "τὰ ἔθνη ὠργίσθησαν — 諸国の民は怒り. ὁ καιρὸς τῶν νεκρῶν κριθῆναι — 死者を裁く時. μισθός — 報い. τοῖς φοβουμένοις τὸ ὄνομά σου — 名を畏れる者たち. διαφθεῖραι τοὺς διαφθείροντας — 地を滅ぼす者たちを滅ぼす."
  19: "ὁ ναὸς τοῦ θεοῦ ὁ ἐν οὐρανῷ — 天にある神の神殿. κιβωτὸς τῆς διαθήκης — 契約の箱. ἀστραπαὶ καὶ φωναὶ καὶ βρονταὶ — 稲妻、声、雷. χάλαζα μεγάλη — 大きな雹. [ὁ] в базе есть — 〔…〕 не ставятся."
