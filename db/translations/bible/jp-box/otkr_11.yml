# jp-box, Откровение Иоанна, глава 11. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Греческий сайта (критический) — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 11: измерение храма и два свидетеля (1–14); седьмая труба и царство Божие (15–19).
# Красного нет: 11:1–3 — одна речь (λέγων в 11:1, в 11:3 продолжение «и дам»), говорящий
# в тексте явно не отождествлён (не «Христос говорит»), поэтому не красное; голос в небе
# (11:12, 15) и славословие старцев (11:17–18) — не красные. Песни и славословия — в 「」.
# Прямая речь: 11:1–3, 11:12, 11:15, 11:17–18 — в 「」, но не красные.
# 〔…〕 нет: все слова в gr-lxx-byz есть ([ὁ] в 11:19 стоит в базе, скобки не ставятся).
# Сносок ⟨…⟩ нет: 神殿, 燭台, オリーブ, 証人, 獣 уже в корпусе или обычные слова.
# jp-ni не использовался.

