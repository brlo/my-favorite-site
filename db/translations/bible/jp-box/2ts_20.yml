verses:
  1: "そこに、ベニヤミン人[じん]ボホリの子[こ]で、サベエという名[な]の不法[ふほう]な者[もの]がいた。彼[かれ]は角笛[つのぶえ]を吹[ふ]き鳴[な]らして言[い]った。「わたしたちにはダビデのうちに分[ぶん]がなく、エッサイの子[こ]のうちに嗣業[しぎょう]もない。イスラエルよ、それぞれ自分[じぶん]の天幕[てんまく]へ帰[かえ]れ。」"
  2: "イスラエルの人[ひと]はすべて、ダビデのもとを離[はな]れてボホリの子[こ]サベエの後[あと]についた。ユダの人[ひと]は、ヨルダンからエルサレムまで、自分[じぶん]たちの王[おう]に付[つ]き従[したが]った。"
  3: "ダビデはエルサレムの自分[じぶん]の家[いえ]に入[はい]った。王[おう]は、家[いえ]を守[まも]らせるために残[のこ]しておいた十人[じゅうにん]の妻[つま]、すなわちそばめたちを取[と]って、見張[みは]りの家[いえ]に置[お]き、彼女[かのじょ]たちを養[やしな]った。しかし彼女たちのところへは入[はい]らなかった。彼女たちは死[し]ぬ日[ひ]まで、生[い]きたやもめとして閉[と]じ込[こ]められていた。"
  4: "王[おう]はアマサに言[い]った。「三日[みっか]のうちにユダの人[ひと]たちをわたしのところへ呼[よ]び集[あつ]めなさい。あなたはそこで待[ま]ちなさい。」"
  5: "アマサはユダを呼[よ]び集[あつ]めに出[で]かけたが、ダビデが定[さだ]めた時[とき]より遅[おく]れた。"
  6: "ダビデはアベシャに言[い]った。「今、ボホリの子[こ]サベエはアブサロムよりもひどくわたしたちを害[そこな]うだろう。今、あなたはあなたの主[しゅ]のしもべたちを伴[ともな]って、彼[かれ]の後[あと]を追[お]いなさい。彼が自分[じぶん]のために堅[かた]い町々[まちまち]を見[み]つけ、わたしたちの目[め]を覆[おお]い隠[かく]すことのないように。」"
  7: "アベシャとヨアブの者[もの]たち、ケレティ人[じん]、ペレティ人、力[ちから]ある者[もの]すべてが彼[かれ]の後[あと]に出[で]た。彼らはボホリの子[こ]サベエの後を追[お]うためにエルサレムを出[で]た。"
  8: "彼らはギバオンの大[おお]きな石[いし]のそばにいた。アマサは彼らの前[まえ]に進[すす]んで来[き]た。ヨアブは自分[じぶん]の衣[ころも]の上[うえ]に帯[おび]を締[し]め、その上に剣[つるぎ]を、腰[こし]にそのさやごと結[むす]び付[つ]けていた。剣は抜[ぬ]け出[で]て、落[お]ちた。"
  9: "ヨアブはアマサに言[い]った。「兄弟[きょうだい]よ、元気[げんき]か。」そしてヨアブの右手[みぎて]は、アマサに口[くち]づけしようとして、彼[かれ]のあごひげをつかんだ。"
  10: "アマサはヨアブの手[て]にある剣[つるぎ]に気[き]づかなかった。ヨアブはそれで彼[かれ]の腹[はら]を突[つ]き、その内臓[ないぞう]が地[ち]に流[なが]れ出[で]た。二度目[にどめ]の一撃[いちげき]はなかった。こうして彼[かれ]は死[し]んだ。ヨアブとその兄弟[きょうだい]アベシャは、ボホリの子[こ]サベエの後[あと]を追[お]った。"
  11: "ヨアブの若者[わかもの]の一人[ひとり]が彼[かれ]のそばに立[た]って言[い]った。「ヨアブを望[のぞ]む者[もの]はだれか。ダビデに属[ぞく]する者はだれか。ヨアブの後[あと]につけ。」"
  12: "アマサは道[みち]のただ中[なか]で血[ち]にまみれて倒[たお]れていた。その人[ひと]は、民[たみ]がみな彼[かれ]のそばに立[た]ち止[ど]まるのを見[み]ると、アマサを道から畑[はたけ]へ引[ひ]き出[だ]し、彼の上[うえ]に衣[ころも]を投[な]げかけた。彼のところへ来[く]る者[もの]がみな立ち止まるのを見たからである。"
  13: "彼[かれ]が道から遠[とお]ざけられると、イスラエルの人[ひと]はすべて、ボホリの子[こ]サベエの後[あと]を追[お]うため、ヨアブの後[あと]に進[すす]んだ。"
  14: "彼[かれ]はイスラエルの全部族[ぶぞく]を通[とお]って、アベルとベト・マアカ、またハリのすべての者[もの]のところへ行[い]った。彼らは集[あつ]められて、彼[かれ]の後[あと]に従[したが]った。"
  15: "彼らは来[き]て、アベルとベト・マアカを彼[かれ]に対して包囲[ほうい]した。そして町[まち]に向[む]かって土塁[どるい]を築[きず]き、前壁[まえかべ]のそばに立[た]った。ヨアブとともにいる民[たみ]はすべて、城壁[じょうへき]を倒[たお]そうと考[かんが]えていた。"
  16: "一人[ひとり]の賢[かしこ]い女[おんな]が城壁[じょうへき]から叫[さけ]んで言[い]った。「聞[き]いてください、聞いてください。ヨアブに『こちらへ近[ちか]づいてください。お話[はなし]したいことがある』と言[い]ってください。」"
  17: "彼[かれ]が彼女[かのじょ]に近[ちか]づくと、女[おんな]は言[い]った。「あなたがヨアブか。」彼[かれ]は言った。「わたしだ。」彼女は言った。「はしための言葉[ことば]を聞[き]いてください。」ヨアブは言った。「聞[き]こう。」"
  18: "彼女[かのじょ]は言[い]った。「昔[むかし]、人々[ひとびと]はこう言[い]った。『アベルでもダンでも、尋[たず]ねて問[と]え。イスラエルの忠実[ちゅうじつ]な者[もの]たちが定[さだ]めたことが尽[つ]きたかどうかを。』こうして人々はアベルで尋ね求め、尽きたかどうかを知[し]った。"
  19: "わたしはイスラエルの支[ささ]えのうちの平和[へいわ]な者[もの]だ。あなたはイスラエルの町[まち]、それも母[はは]なる都[みやこ]を殺[ころ]そうとしている。なぜ、あなたは主[しゅ]の嗣業[しぎょう]を沈[しず]めてしまうのか。」"
  20: "ヨアブは答[こた]えて言[い]った。「とんでもない、とんでもない。わたしが町[まち]を沈[しず]め、滅[ほろ]ぼすことなどない。"
  21: "話[はなし]はそうではない。エフライムの山[やま]から来[き]た人[ひと]、名[な]をサベエといい、ボホリの子[こ]である者[もの]が、ダビデ王[おう]に手[て]を上[あ]げたのだ。彼[かれ]だけをわたしに渡[わた]しなさい。そうすればわたしはこの町[まち]から退[しりぞ]こう。」女[おんな]はヨアブに言[い]った。「見[み]よ、彼[かれ]の頭[あたま]は城壁[じょうへき]の向[む]こうからあなたのところへ投[な]げ落[お]とされる。」"
  22: "女[おんな]は民[たみ]すべてのところへ行[い]き、自分[じぶん]の知恵[ちえ]によって町[まち]のすべてに語[かた]った。そしてボホリの子[こ]サベエの頭[あたま]を切[き]り落[お]とし、ヨアブのところへ投[な]げた。ヨアブは角笛[つのぶえ]を吹[ふ]き鳴[な]らし、人々[ひとびと]は町からそれぞれ自分[じぶん]の天幕[てんまく]へ散[ち]って行[い]った。ヨアブはエルサレムの王[おう]のもとへ帰[かえ]った。"
  23: "ヨアブはイスラエルの全[ぜん]軍勢[ぐんぜい]の上[うえ]にいた。ヨダエの子[こ]バナヤはケレティ人[じん]とペレティ人の上[うえ]にいた。"
  24: "アドニラムは賦役[ふえき]の上[うえ]に、アヒルドの子[こ]ヨシャファトは記録[きろく]係[がかり]であった。"
  25: "スサは書記[しょき]であった。サドクとアビアタルは祭司[さいし]であった。"
  26: "また、ヤリ人[じん]のイラはダビデの祭司[さいし]であった。"

notes:
  1: "ἐπικαλούμενος υἱὸς παράνομος — «названный сын беззаконный» (ἐπικαλέω здесь — именуемый). Σαβεε υἱὸς Βοχορι — Савей, сын Бихри (ボホリ). ἀνὴρ ὁ Ιεμενι — вениамитянин (слав. «муж иеминиов»). ἐσάλπισεν ἐν τῇ κερατίνῃ — затрубил в рог (κερατίνη). μερὶς ἐν Δαυιδ — часть в Давиде. εἰς τὰ σκηνώματά σου — по шатрам твоим. В csl добавлено «возвратитеся» — внесено в текст."
  2: "ἀνέβη ἀπὸ ὄπισθεν Δαυιδ — «поднялся из-за спины Давида», т. е. отступил от него (ἀναβαίνω). ἐκολλήθη — прилепился (κολλάω). ἀπὸ τοῦ Ιορδάνου καὶ ἕως Ιερουσαλημ — от Иордана до Иерусалима."
  3: "παλλακαί — наложницы (παλλακή). ἃς ἀφῆκεν φυλάσσειν τὸν οἶκον — которых оставил стеречь дом. ἐν οἴκῳ φυλακῆς — в доме стражи, под надзором. διέθρεψεν — содержал, кормил. συνεχόμεναι — содержимые под стражей (συνέχω). χῆραι ζῶσαι — живые вдовы."
  4: "Βόησόν μοι τὸν ἄνδρα Ιουδα — созови мне мужей Иуды (βοάω — звать, созывать). τρεῖς ἡμέρας — в три дня. αὐτοῦ στῆθι — там стань, жди."
  5: "ἐχρόνισεν ἀπὸ τοῦ καιροῦ — замедлил против срока (χρονίζω). οὗ ἐτάξατο αὐτῷ — который назначил ему (τάσσω)."
  6: "κακοποιήσει — сделает зло (κακοποιέω). τοὺς παῖδας τοῦ κυρίου σου — слуг господина твоего (Давид говорит о себе в третьем лице). μήποτε — как бы не. πόλεις ὀχυράς — укреплённые города. σκιάσει τοὺς ὀφθαλμοὺς ἡμῶν — «затенит глаза наши», т. е. скроется от нас (σκιάζω)."
  7: "ὁ χερεθθι καὶ ὁ φελεθθι — Херефи и Фелефи, т. е. керети и пелети, царская стража (ケレティ人、ペレティ人). οἱ δυνατοί — сильные, храбрые. В csl добавлено «Авесса» — внесено в текст."
  8: "ἐν Γαβαων — в Гаваоне (ギバオン). περιεζωσμένος μανδύαν τὸ ἔνδυμα αὐτοῦ — опоясанный плащом, одеждой своей (μανδύας — плащ). ἐζευγμένην ἐπὶ τῆς ὀσφύος — прикреплённый при чреслах (ζεύγνυμι). ἐν κολεῷ αὐτῆς — в ножнах своих. ἡ μάχαιρα ἐξῆλθεν καὶ ἔπεσεν — меч вышел и упал."
  9: "Εἰ ὑγιαίνεις σύ, ἀδελφέ — «здоров ли ты, брат?» ἐκράτησεν τοῦ πώγωνος — схватил за бороду (πώγων). τοῦ καταφιλῆσαι — чтобы поцеловать (καταφιλέω)."
  10: "οὐκ ἐφυλάξατο τὴν μάχαιραν — не поберёгся меча, не остерёгся. εἰς τὴν ψόαν — в живот, в чресла (ψόα). ἐξεχύθη ἡ κοιλία — излилось чрево (ἐκχέω). οὐκ ἐδευτέρωσεν αὐτῷ — не повторил ему удара (δευτερόω)."
  11: "τῶν παιδαρίων Ιωαβ — из отроков Иоава. ὁ βουλόμενος Ιωαβ — желающий Иоава, преданный ему. ὀπίσω Ιωαβ — за Иоавом."
  12: "πεφυρμένος ἐν τῷ αἵματι — обвалянный в крови (φύρω). τρίβος — дорога, тропа. ἀπέστρεψεν ἐκ τῆς τρίβου εἰς ἀγρόν — своротил с дороги в поле. ἐπέρριψεν ἱμάτιον — бросил одежду (ἐπιρρίπτω)."
  13: "ἡνίκα δὲ ἔφθασεν ἐκ τῆς τρίβου — когда он был убран с дороги (φθάνω). παρῆλθεν — прошёл."
  14: "διῆλθεν ἐν πάσαις φυλαῖς Ισραηλ — прошёл по всем коленам Израиля. Αβελ καὶ Βαιθμαχα — Авел и Беф-Мааха (アベル、ベト・マアカ). ἐν Χαρρι — в Харри (ru «Берим» — по евр.). ἐξεκκλησιάσθησαν — собрались (ἐκκλησιάζω)."
  15: "ἐπολιόρκουν ἐπ᾽ αὐτόν — осаждали его (πολιορκέω). ἐξέχεαν πρόσχωμα — насыпали вал (πρόσχωμα). προτειχίσμα — передняя стена, предстение. ἐνοοῦσαν καταβαλεῖν — замышляли сокрушить (ἐνοάω, καταβάλλω)."
  16: "γυνὴ σοφή — женщина мудрая. Ἀκούσατε ἀκούσατε — «слушайте, слушайте» (усиленное повторение). εἴπατε δὴ πρὸς Ιωαβ — скажите же Иоаву. Ἔγγισον ἕως ὧδε — подойди сюда."
  17: "Εἰ σὺ εἶ Ιωαβ — «ты ли Иоав?» Ἐγώ — «я». τῆς δούλης σου — рабы твоей. Ἀκούω ἐγώ εἰμι — «слушаю, это я» (слав. «послушаю, аз есмь»)."
  18: "Λόγον ἐλάλησαν ἐν πρώτοις — «слово говорили в первых», т. е. так говаривали встарь. Ἠρωτημένος ἠρωτήθη — «вопрошаемый был вопрошен» (усиленная форма). ἐξέλιπον ἃ ἔθεντο οἱ πιστοὶ τοῦ Ισραηλ — оскудело ли то, что положили верные Израиля. Место тёмное, передано по смыслу; ср. слав. «вопрошаемь вопрошен бысть во авели и в дане»."
  19: "εἰρηνικὰ τῶν στηριγμάτων Ισραηλ — «мирное из утверждений Израиля», т. е. я из мирных, верных городов (στήριγμα — опора, твердыня). μητρόπολις — мать городов, столица. καταποντίζεις — потопляешь, губишь (καταποντίζω). κληρονομία κυρίου — наследие Господне."
  20: "Ἵλεώς μοι ἵλεώς μοι — «милостив мне, милостив мне» (формула отвращения, «да не будет»). εἰ καταποντιῶ — если потоплю (условная форма вместо отрицания)."
  21: "οὐχ οὗτος ὁ λόγος — «не таково слово», не в этом дело. ἀνὴρ ἐξ ὄρους Εφραιμ — человек с горы Ефремовой. ἐπῆρεν τὴν χεῖρα — поднял руку. δότε αὐτόν μοι μόνον — дайте мне только его. ῥιφήσεται — будет брошена (ῥίπτω)."
  22: "ἐν τῇ σοφίᾳ αὐτῆς — в мудрости своей. ἀφεῖλεν — отняла, сняла (ἀφαιρέω; в csl «отсекоша» — отсекли). διεσπάρησαν — рассеялись (διασπείρω)."
  23: "ἐπὶ πάσῃ τῇ δυνάμει — над всем войском. ὁ χερεθθι, ὁ φελεθθι — керети и пелети, царская стража."
  24: "ἐπὶ τοῦ φόρου — над податью, оброком (φόρος), т. е. над сбором податей. ἀναμιμνῄσκων — «напоминающий», дееписатель, летописец (ἀναμιμνῄσκω)."
  25: "γραμματεύς — писец, книжник (書記). ἱερεῖς — священники."
  26: "Ιρας ὁ Ιαριν — Ира Иаритянин (Ιαριν; ru «Ира Иаритянин»). ἦν ἱερεὺς τοῦ Δαυιδ — был священником у Давида; последний стих главы есть и в LXX, и в csl."
