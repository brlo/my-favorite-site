chapter: 16
draft: true

verses:
  1: "「あなたは新[あたら]しい実[みの]りの月[つき]を守[まも]り、あなたの神[かみ]である主[しゅ]に過越[すぎこし]を行[おこな]いなさい。あなたがエジプトから夜[よる]に出[で]たのは、新しい実りの月であったからである。"
  2: "あなたは、あなたの神[かみ]である主[しゅ]が、そこに御名[みな]が呼[よ]ばれるために選[えら]ばれる所[ところ]で、羊[ひつじ]と牛[うし]を過越[すぎこし]として、あなたの神である主に屠[ほふ]りなさい。"
  3: "あなたはそれとともにパン種[ぱんだね]を入[い]れたものを食[た]べてはならない。七日[なぬか]の間[あいだ]、それとともに種[たね]なしパンを、すなわち苦難[くなん]のパンを食[た]べなさい。あなたがたがエジプトから急[いそ]いで出[で]たのは、あなたがたがエジプトの地[ち]からの出発[しゅっぱつ]の日[ひ]を、あなたがたの生涯[しょうがい]のすべての日[ひ]に覚[おぼ]えているためである。"
  4: "七日[なぬか]の間[あいだ]、あなたのすべての領域[りょういき]にパン種[ぱんだね]が一[ひと]つも見[み]られてはならない。また、初[はじ]めの日[ひ]の夕[ゆう]べにあなたが屠[ほふ]る肉[にく]のうち、何[なに]も朝[あさ]まで残[のこ]してはならない。"
  5: "あなたは、あなたの神[かみ]である主[しゅ]があなたに与[あた]える町々[まちまち]のうち、どこででも過越[すぎこし]を屠[ほふ]ることはできない。"
  6: "ただ、あなたの神[かみ]である主[しゅ]が、そこに御名[みな]が呼[よ]ばれるために選[えら]ばれる所[ところ]で、夕[ゆう]べ、日[ひ]の沈[しず]むころに、あなたがエジプトから出[で]たその時[とき]に、過越[すぎこし]を屠[ほふ]りなさい。"
  7: "あなたはそれを煮[に]て、また焼[や]いて、あなたの神[かみ]である主[しゅ]が選[えら]ばれる所[ところ]で食[た]べなさい。そして朝[あさ]になったら引[ひ]き返[かえ]し、あなたの家[いえ]へ帰[かえ]りなさい。"
  8: "六日[むいか]の間[あいだ]は種[たね]なしパンを食[た]べなさい。第七[だいしち]の日[ひ]は閉会[へいかい]の日[ひ]、あなたの神[かみ]である主[しゅ]への祭[まつ]りである。その日には、魂[たましい]のために行[おこな]われることのほかは、どのような仕事[しごと]もしてはならない。"
  9: "あなたは七[なな]つの週[しゅう]を、満[み]ちるまで数[かぞ]えなさい。あなたが刈[か]り入[い]れに鎌[かま]を入[い]れ始[はじ]めたときから、七つの週を数え始[はじ]めなさい。"
  10: "あなたは、あなたの神[かみ]である主[しゅ]に七週[しちしゅう]の祭[まつ]りを行[おこな]いなさい。あなたの手[て]の及[およ]ぶかぎり、あなたの神である主があなたに与[あた]えてくださるだけのものを、あなたの神である主があなたを祝福[しゅくふく]してくださったとおりに、ささげなさい。"
  11: "あなたは、あなたの神[かみ]である主[しゅ]が、そこに御名[みな]が呼[よ]ばれるために選[えら]ばれる所[ところ]で、あなたも、あなたの息子[むすこ]も娘[むすめ]も、あなたの奴隷[どれい]も女奴隷[おんなどれい]も、あなたの町々[まちまち]にいるレビ人[びと]も、あなたがたの間[あいだ]にいる寄留者[きりゅうしゃ]も孤児[みなしご]も寡婦[やもめ]も、ともにあなたの神である主の前[まえ]で喜[よろこ]びなさい。"
  12: "あなたは、自分[じぶん]がエジプトの地[ち]で奴隷[どれい]であったことを覚[おぼ]え、これらの戒[いまし]めを守[まも]って行[おこな]いなさい。"
  13: "あなたは、自分[じぶん]の打[う]ち場[ば]とぶどうの搾[しぼ]り場[ば]から取[と]り入[い]れたとき、七日[なぬか]の間[あいだ]、仮庵[かりいお]の祭[まつ]りを行[おこな]いなさい。"
  14: "あなたは、あなたも、あなたの息子[むすこ]も娘[むすめ]も、あなたの奴隷[どれい]も女奴隷[おんなどれい]も、レビ人[びと]も、寄留者[きりゅうしゃ]も、孤児[みなしご]も、あなたの町々[まちまち]にいる寡婦[やもめ]も、ともに祭[まつ]りで喜[よろこ]びなさい。"
  15: "あなたは七日[なぬか]の間[あいだ]、あなたの神[かみ]である主[しゅ]が選[えら]ばれる所[ところ]で、あなたの神である主に祭[まつ]りを行[おこな]いなさい。あなたの神である主が、あなたのすべての実[みの]りと、あなたの手[て]のすべてのわざにおいてあなたを祝福[しゅくふく]してくださるなら、あなたは喜[よろこ]びに満[み]ちるであろう。"
  16: "あなたのうちの男子[だんし]はすべて、年[とし]に三度[さんど]、あなたの神[かみ]である主[しゅ]の前[まえ]に、主[しゅ]が選[えら]ばれる所[ところ]で現[あらわ]れなければならない。すなわち、種[たね]なしパンの祭[まつ]り、七週[しちしゅう]の祭り、仮庵[かりいお]の祭りである。あなたはあなたの神である主の前に、空[から]の手[て]で現れてはならない。"
  17: "それぞれが、自分[じぶん]の手[て]の力[ちから]に応[おう]じて、あなたの神[かみ]である主[しゅ]があなたに与[あた]えた祝福[しゅくふく]に応じて、ささげなさい。"
  18: "あなたは、あなたの神[かみ]である主[しゅ]があなたに与[あた]えるすべての町[まち]に、部族[ぶぞく]ごとに、自分[じぶん]のために裁[さば]き人[びと]と監督[かんとく]を立[た]てなさい。彼らは民[たみ]を正[ただ]しい裁きで裁かなければならない。"
  19: "彼らは裁[さば]きを曲[ま]げてはならず、人[ひと]の顔[かお]を見[み]て判決[はんけつ]を下[くだ]してはならず、贈[おく]り物[もの]を受[う]けてはならない。贈り物は賢[かしこ]い者[もの]の目[め]をくらませ、正[ただ]しい者[もの]の言葉[ことば]をゆがめるからである。"
  20: "あなたは正[ただ]しいことを正しく追[お]い求[もと]めなさい。そうすれば、あなたがたは生[い]き、あなたの神[かみ]である主[しゅ]が与[あた]える地[ち]に入[はい]って、それを嗣業[しぎょう]として受[う]け継[つ]ぐであろう。"
  21: "あなたは、あなたが自分[じぶん]のために造[つく]る、あなたの神[かみ]である主[しゅ]の祭壇[さいだん]のそばに、どのような木[き]であれ、聖[せい]なる木立[こだち]を植[う]えてはならない。"
  22: "また、あなたの神[かみ]である主[しゅ]が憎[にく]まれた石柱[せきちゅう]を、自分[じぶん]のために立[た]ててはならない。」"

notes:
  1: "μὴν τῶν νέων — месяц новых [плодов] (Авив; слав. «месяц новых»). ποιήσεις τὸ πασχα — совершишь Пасху (過越). ἐξῆλθες ἐξ Αἰγύπτου νυκτός — вышел из Египта ночью."
  2: "θύσεις τὸ πασχα — заколешь Пасху. πρόβατα καὶ βόας — овец и волов (в Син. «из мелкого и крупного скота»). ἐπικληθῆναι τὸ ὄνομα — чтобы имя Его было призвано (御名が呼ばれる)."
  3: "οὐ φάγῃ ἐπ᾽ αὐτοῦ ζύμην — не ешь с ним квасного. ἄζυμα — опресноки (種なしパン). ἄρτον κακώσεως — хлеб бедствия, озлобления (苦難のパン). ἐν σπουδῇ — с поспешностью. ἵνα μνησθῆτε — чтобы помнили."
  4: "οὐκ ὀφθήσεταί σοι ζύμη — не появится у тебя квасное. ἐν πᾶσι τοῖς ὁρίοις — во всех пределах. οὐ κοιμηθήσεται — не переночует, не останется до утра."
  5: "οὐ δυνήσῃ θῦσαι — не сможешь заколоть. ἐν οὐδεμιᾷ τῶν πόλεων — ни в одном из городов."
  6: "ἀλλ᾽ ἢ εἰς τὸν τόπον — но только на место. ἑσπέρας πρὸς δυσμὰς ἡλίου — вечером при заходе солнца. ἐν τῷ καιρῷ, ᾧ ἐξῆλθες — в то время, когда вышел."
  7: "ἑψήσεις καὶ ὀπτήσεις — сваришь и испечёшь. ἀποστραφήσῃ τὸ πρωί — повернёшь утром, вернёшься. εἰς τοὺς οἴκους σου — в дома твои."
  8: "ἓξ ἡμέρας ἄζυμα — шесть дней опресноки. ἐξόδιον — отдание, заключительное собрание (閉会の日; ср. Лев 23:36). οὐ ποιήσεις πᾶν ἔργον — никакого дела. πλὴν ὅσα ποιηθήσεται ψυχῇ — кроме того, что будет сделано для души, т.е. необходимо для жизни."
  9: "ἑπτὰ ἑβδομάδας ὁλοκλήρους — семь седмиц полных. ἐξαριθμήσεις σεαυτῷ — отсчитаешь себе. ἀρξαμένου σου δρέπανον ἐπ᾽ ἀμητόν — когда начнёшь серп на жатве (δρέπανον — серп)."
  10: "ἑορτὴν ἑβδομάδων — праздник седмиц (七週の祭り), т.е. Пятидесятница. καθότι ἡ χείρ σου ἰσχύει — по мере силы руки твоей. ὅσα ἂν δῷ σοι — сколько Он даст тебе. καθότι ηὐλόγησέν σε — как благословил тебя."
  11: "εὐφρανθήσῃ — возвеселишься. σὺ καὶ ὁ υἱός σου… — ты и сын твой… παῖς и παιδίσκη — раб и рабыня. Λευίτης, προσήλυτος, ὀρφανός, χήρα — левит, пришелец, сирота, вдова. ἐπικληθῆναι τὸ ὄνομα — чтобы имя Его было призвано (御名が呼ばれる)."
  12: "μνησθήσῃ ὅτι οἰκέτης ἦσθα — помни, что ты был рабом. φυλάξῃ καὶ ποιήσεις — соблюдёшь и исполнишь."
  13: "ἑορτὴν σκηνῶν — праздник кущей (仮庵の祭り). ἐν τῷ συναγαγεῖν σε — когда соберёшь. ἅλων — гумно (打ち場). ληνός — точило (ぶどうの搾り場)."
  14: "εὐφρανθήσῃ ἐν τῇ ἑορτῇ σου — возвеселишься в празднике твоём. Перечисление участников то же, что в ст. 11, но без указания места."
  15: "ἑπτὰ ἡμέρας ἑορτάσεις — семь дней праздновать будешь. ἐὰν δὲ εὐλογήσῃ σε — если благословит тебя (слав. «аще», Син. «ибо»). ἔσῃ εὐφραινόμενος — будешь веселящимся."
  16: "τρεῖς καιροὺς τοῦ ἐνιαυτοῦ — три раза в году. πᾶν ἀρσενικόν σου — всё мужское у тебя. ὀφθήσεται — явится. ἑορτὴ τῶν ἀζύμων, ἑβδομάδων, σκηνοπηγίας — опресноки, седмицы, кущи. οὐκ ὀφθήσῃ κενός — не явишься с пустыми руками."
  17: "ἕκαστος κατὰ δύναμιν τῶν χειρῶν ὑμῶν — каждый по силе рук ваших. κατὰ τὴν εὐλογίαν — по благословению. ἣν ἔδωκέν σοι — которое дал тебе."
  18: "κριτάς — судьи (裁き人). γραμματοεισαγωγεῖς — законоведы, надзиратели (監督; слав. «книгочии»). καταστήσεις σεαυτῷ — поставишь себе. κατὰ φυλάς — по племенам, коленам (部族ごと). κρίσιν δικαίαν — суд праведный."
  19: "οὐκ ἐκκλινοῦσιν κρίσιν — не уклонят суда. οὐκ ἐπιγνώσονται πρόσωπον — не будут лицеприятствовать (букв. «не познают лица»). λήμψονται δῶρον — не возьмут дара. ἐκτυφλοῖ ὀφθαλμούς — ослепляет глаза. ἐξαίρει λόγους δικαίων — извращает слова праведных."
  20: "δικαίως τὸ δίκαιον διώξῃ — праведно праведное гони (усиление). ἵνα ζῆτε — чтобы вы жили. κληρονομήσητε τὴν γῆν — наследуете землю."
  21: "οὐ φυτεύσεις ἄλσος — не насадишь рощи (ἄλσος — священная роща, 聖なる木立). πᾶν ξύλον — всякое дерево. παρὰ τὸ θυσιαστήριον — при жертвеннике (祭壇). ὃ ποιήσεις σεαυτῷ — который сделаешь себе."
  22: "στήλη — столб, стела (石柱). ἃ ἐμίσησεν κύριος — которые возненавидел Господь (ἅ — мн. ср., согласование по смыслу)."
