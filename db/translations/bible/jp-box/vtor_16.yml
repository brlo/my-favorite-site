# jp-box, Второзаконие, глава 16. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в главе отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 16: Пасха и опресноки (1–8), семь недель / Пятидесятница (9–12),
# кущи (13–15), три годовых праздника (16–17), судьи и правосудие (18–20),
# запрет рощи и столба (21–22).
# Нумерация совпадает с csl-ru и ru: 22 стиха. Речь Моисея — 「…」 (вся глава).
# Красного и синего нет. Вложенных цитат в главе нет.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (проверено).
# Сносок ⟨…⟩ нет: 過越, 種なしパン, 仮庵の祭り, 祭壇 уже в корпусе или понятны;
# 七週の祭り (Пятидесятница) прозрачно и разобрано в notes 16:10.
# LXX: 16:1 μὴν τῶν νέων — «месяц новых [плодов]» (Авив); 16:8 ἐξόδιον — «отдание»;
# 16:15 ἐὰν δὲ εὐλογήσῃ — «если благословит» (Син. «ибо»); 16:18 γραμματοεισαγωγεῖς —
# «законоведы/надзиратели» (監督), не просто «писцы».
# jp-ni не использовался.

tr_code: jp-box
