verses:
  1: "これらのことの後[あと]、ペルシアの王[おう]アルタシャスタが治[おさ]めていたとき、エズラが進[すす]み出[で]た。彼[かれ]はサライアの子[こ]、エゼリヤの子[こ]、ヒルキヤの子[こ]、サリムの子[こ]、"
  2: "サドクの子[こ]、アヒトブの子[こ]、アマリヤの子[こ]、オジヤの子[こ]、メライオトの子[こ]、ザラヤの子[こ]、オジの子[こ]、ボカイの子[こ]、アビシュアの子[こ]、ピネハスの子[こ]、エレアザルの子[こ]、最初[さいしょ]の祭司[さいし]アロンの子[こ]である。"
  3: "このエズラは、イスラエルの神[かみ]から与[あた]えられたモーセの律法[りっぽう]に通[つう]じた、優[すぐ]れた学者[がくしゃ]として、バビロンから上[のぼ]って来[き]た。"
  4: "王[おう]は彼[かれ]に栄光[えいこう]を与[あた]えた。彼[かれ]が、そのすべての願[ねが]い事[ごと]について、王[おう]の前[まえ]に恵[めぐ]みを得[え]たからである。"
  5: "そこで、イスラエルの子[こ]ら、祭司[さいし]たち、レビ人[びと]たち、歌[うた]い手[て]たち、門衛[もんえい]たち、神殿[しんでん]のしもべたちのうちから、人[ひと]々[びと]が彼[かれ]とともにエルサレムへ上[のぼ]った。アルタシャスタの治世[ちせい]の第七年[だいななねん]、第五[だいご]の月[つき]であり、これが王[おう]の第七年であった。"
  6: "彼[かれ]らはバビロンを出[で]て、第一[だいいち]の月[つき]の新月[しんげつ]に、第五[だいご]の月[つき]の新月[しんげつ]にエルサレムに着[つ]いた。主[しゅ]がこのことのために彼[かれ]らに与[あた]えられた旅路[たびじ]の幸[さいわ]いによるものであった。"
  7: "エズラは多[おお]くの知識[ちしき]を備[そな]えていた。それは、主[しゅ]の律法[りっぽう]と戒[いまし]めから出[で]たもののうち、何[なに]一つとして見落[みおと]すことなく、イスラエルすべてにすべての定[さだ]めと裁[さば]きを教[おし]えるためであった。"
  8: "また、アルタシャスタ王[おう]から、祭司[さいし]であり主[しゅ]の律法[りっぽう]の読[よ]み手[て]であるエズラに、書[か]かれた命令[めいれい]が届[とど]いた。その写[うつ]しは次[つぎ]のとおりである。"
  9: "「アルタシャスタ王[おう]から、祭司[さいし]であり主[しゅ]の律法[りっぽう]の読[よ]み手[て]であるエズラへ。挨拶[あいさつ]を送[おく]る。"
  10: "そして、わたしは人[ひと]を愛[あい]する心[こころ]をもって裁[さば]き、ユダヤの民[たみ]のうちで志[こころざ]しを抱[いだ]く者[もの]たち、また祭司[さいし]たちとレビ人[びと]たちのうち、わたしの王国[おうこく]にいる者[もの]たちが、あなたとともにエルサレムへ行[い]くことを命[めい]じた。"
  11: "だから、心[こころ]に決[き]めた者[もの]はすべて、わたしと、わたしの七人[しちにん]の友[とも]である顧問[こもん]たちが決めたとおりに、一緒[いっしょ]に出発[しゅっぱつ]するがよい。"
  12: "それは、ユダヤとエルサレムで行[おこな]われていることが、主[しゅ]の律法[りっぽう]にあるとおりであるかを見[み]るためである。"
  13: "また、わたしとわたしの友[とも]たちがエルサレムにささげると誓[ちか]った、イスラエルの主[しゅ]への贈[おく]り物[もの]を運[はこ]び、またバビロンの地[ち]で見[み]つかるすべての金[きん]と銀[ぎん]を、民[たみ]がエルサレムにある彼[かれ]らの主[しゅ]の神殿[しんでん]にささげたものとともに、主[しゅ]に、エルサレムへ携[たずさ]えて行[い]くためである。"
  14: "その金[きん]と銀[ぎん]を、雄牛[おうし]と雄羊[おひつじ]と子羊[こひつじ]、およびそれらに伴[ともな]うもののために集[あつ]め、"
  15: "エルサレムにある彼[かれ]らの主[しゅ]の祭壇[さいだん]に犠牲[ぎせい]をささげるためである。"
  16: "また、金[きん]と銀[ぎん]をもってあなたの兄弟[きょうだい]たちとともに行[おこな]いたいことは何[なん]であれ、あなたの神[かみ]の御心[みこころ]に従[したが]ってすべてを成[な]し遂[と]げよ。"
  17: "また、エルサレムにある、あなたの神[かみ]の神殿[しんでん]の務[つと]めのためにあなたに与[あた]えられた主[しゅ]の聖[せい]なる器[うつわ]を、あなたの神[かみ]である主[しゅ]の前[まえ]に納[おさ]めよ。"
  18: "また、あなたの神[かみ]の神殿[しんでん]の務[つと]めのためにあなたに必要[ひつよう]となる残[のこ]りのものは、王[おう]の宝物庫[たからものぐら]から出[だ]しなさい。"
  19: "また、わたしアルタシャスタ王[おう]は、シリアとフェニキアの宝物[たからもの]の守[まも]りたちに命[めい]じた。祭司[さいし]であり、いと高[たか]き神[かみ]の律法[りっぽう]の読[よ]み手[て]であるエズラが書[か]き送[おく]るものは何[なん]であれ、銀[ぎん]百[ひゃく]タラントに至[いた]るまで、怠[おこた]りなく彼[かれ]に与[あた]えるように、と。"
  20: "同様[どうよう]に、小麦[こむぎ]は百[ひゃく]コルまで、ぶどう酒[しゅ]は百[ひゃく]バトまで、塩[しお]は限[かぎ]りなく。"
  21: "神[かみ]の律法[りっぽう]にかなうこと、またそのほか多[おお]くのことも、すべてはいと高[たか]き神[かみ]のために怠[おこた]りなく成[な]し遂[と]げられよ。王[おう]の王国[おうこく]とその子[こ]らたちの上[うえ]に怒[いか]りが起[お]こらないためである。"
  22: "また、あなたがたに言[い]う。祭司[さいし]たち、レビ人[びと]たち、歌[うた]い手[て]たち、門衛[もんえい]たち、神殿[しんでん]のしもべたち、およびこの神殿[しんでん]の務[つと]めをする者[もの]たちには、いかなる貢[みつ]ぎ物[もの]も、ほかの負担[ふたん]も課[か]されてはならない。また、だれも彼[かれ]らに何[なに]かを課[か]す権限[けんげん]を持[も]ってはならない。"
  23: "あなたは、エズラよ、神[かみ]の知恵[ちえ]に従[したが]って、さばき人[びと]たちと裁判官[さいばんかん]たちを立[た]て、シリアとフェニキアの全[ぜん]域[いき]で、あなたの神[かみ]の律法[りっぽう]を知[し]る者[もの]すべてをさばかせよ。知[し]らない者[もの]には教[おし]えよ。"
  24: "また、あなたの神[かみ]の律法[りっぽう]と王[おう]の律法[りっぽう]に背[そむ]く者[もの]はすべて、怠[おこた]りなく罰[ばっ]せられる。死[し]をもってか、罰[ばつ]をもってか、銀[ぎん]の没収[ぼっしゅう]をもってか、追放[ついほう]をもってかである。」"
  25: "そこでエズラは言[い]った。「わたしの父祖[ふそ]の神[かみ]である主[しゅ]は、ただひとり、ほむべきかな。主[しゅ]はこれらのことを王[おう]の心[こころ]に置[お]き、エルサレムにある主[しゅ]の家[いえ]を崇[あが]めさせられた。"
  26: "また、王[おう]と顧問[こもん]たち、および王[おう]のすべての友[とも]と高官[こうかん]たちの前[まえ]で、わたしに栄誉[えいよ]を与[あた]えられた。"
  27: "そこでわたしは、わたしの神[かみ]である主[しゅ]の支[ささ]えによって勇気[ゆうき]を出[だ]し、イスラエルから男[おとこ]たちを集[あつ]めて、わたしとともに上[のぼ]らせた。」"
  28: "また、次[つぎ]の者[もの]たちは、その氏族[しぞく]と組[くみ]分[わ]けごとの指導者[しどうしゃ]たちであり、アルタシャスタ王[おう]の治世[ちせい]に、わたしとともにバビロンから上[のぼ]って来[き]た者[もの]たちである。"
  29: "ピネハスの子[こ]らからはギルション。イタマルの子[こ]らからはガマリエル。ダビデの子[こ]らからはハトス、すなわちセヘニヤの子[こ]である。"
  30: "フォロスの子[こ]らからはザカリヤ、および彼[かれ]とともに登録[とうろく]された男[おとこ]百五十人[ひゃくごじゅうにん]。"
  31: "パハト・モアブの子[こ]らからはエリアオニア、すなわちザラヤの子[こ]、および彼[かれ]とともに男[おとこ]二百人[にひゃくにん]。"
  32: "ザトエスの子[こ]らからはセヘニヤ、すなわちイエジルの子[こ]、および彼[かれ]とともに男[おとこ]三百人[さんびゃくにん]。アディンの子[こ]らからはオビフ、すなわちヨナタンの子[こ]、および彼[かれ]とともに男[おとこ]二百五十人[にひゃくごじゅうにん]。"
  33: "エラムの子[こ]らからはイエシヤ、すなわちゴトリヤの子[こ]、および彼[かれ]とともに男[おとこ]七十人[ななじゅうにん]。"
  34: "サファテヤの子[こ]らからはザラヤ、すなわちミカエルの子[こ]、および彼[かれ]とともに男[おとこ]七十人[ななじゅうにん]。"
  35: "ヨアブの子[こ]らからはアバデヤ、すなわちイエジルの子[こ]、および彼[かれ]とともに男[おとこ]二百十二人[にひゃくじゅうににん]。"
  36: "バニの子[こ]らからはアサリモト、すなわちヨサフィヤの子[こ]、および彼[かれ]とともに男[おとこ]百六十人[ひゃくろくじゅうにん]。"
  37: "バビの子[こ]らからはザカリヤ、すなわちビバイの子[こ]、および彼[かれ]とともに男[おとこ]二十八人[にじゅうはちにん]。"
  38: "アスガドの子[こ]らからはヨハナン、すなわちアカタンの子[こ]、および彼[かれ]とともに男[おとこ]百十人[ひゃくじゅうにん]。"
  39: "アドニカムの子[こ]らからは最後[さいご]の者[もの]たちで、その名[な]は次[つぎ]のとおりである。エリファラト、イエウエル、サマヤ、および彼[かれ]らとともに男[おとこ]七十人[ななじゅうにん]。"
  40: "バゴの子[こ]らからはウタイ、すなわちイスタルクロスの子[こ]、および彼[かれ]とともに男[おとこ]七十人[ななじゅうにん]。"
  41: "わたしは彼[かれ]らを、フェランと呼[よ]ばれる川[かわ]のほとりに集[あつ]めた。そこに三日間[みっかかん]宿営[しゅくえい]し、彼[かれ]らをよく調[しら]べた。"
  42: "祭司[さいし]の子[こ]らとレビ人[びと]のうちには、そこにだれも見[み]つからなかったので、"
  43: "わたしは、指導者[しどうしゃ]で学識[がくしき]のある者[もの]たち、すなわちエレアザル、イドエル、マアスマン、エルナタン、マメヤ、サマヤ、ヨリボン、ナタン、エンナタン、ザカリヤ、メソラムのもとへ人[ひと]を遣[つか]わした。"
  44: "そして彼[かれ]らに言[い]った。宝物庫[たからものぐら]の場所[ばしょ]にいる指導者[しどうしゃ]アダイのもとへ行[い]き、"
  45: "アダイとその兄弟[きょうだい]たち、およびその場所[ばしょ]にいる宝物[たからもの]の守[まも]りたちに語[かた]って、わたしたちの主[しゅ]の家[いえ]で祭司[さいし]の務[つと]めをする者[もの]たちを、わたしたちのもとへ遣[つか]わすように、と命[めい]じた。"
  46: "彼[かれ]らは、わたしたちの主[しゅ]の強[つよ]い手[て]によって、イスラエルのレビの子[こ]、マフリの子[こ]らから、学識[がくしき]のある男[おとこ]たちを連[つ]れて来[き]た。すなわちアセベビヤとその子[こ]らおよび兄弟[きょうだい]たち、十八人[じゅうはちにん]である。"
  47: "また、アセビヤ、アンヌン、およびハヌネヤの子[こ]らから出[で]た兄弟[きょうだい]オシヤと、彼[かれ]らの子[こ]ら、すなわち男[おとこ]二十人[にじゅうにん]。"
  48: "また、ダビデと指導者[しどうしゃ]たちがレビ人[びと]の務[つと]めのために与[あた]えた神殿[しんでん]のしもべたちのうちから、二百二十人[にひゃくにじゅうにん]のしもべたちがいた。彼[かれ]らすべての名[な]は、名簿[めいぼ]に記[しる]された。"
  49: "そこでわたしは、若者[わかもの]たちに断食[だんじき]を課[か]すことを、わたしたちの主[しゅ]の前[まえ]で誓[ちか]った。"
  50: "それは、わたしたちと、わたしたちとともにいる者[もの]たち、またわたしたちの子[こ]どもと家畜[かちく]のために、主[しゅ]から良[よ]い道[みち]を求[もと]めるためであった。"
  51: "というのも、わたしは、わたしたちに敵対[てきたい]する者[もの]たちに対する安全[あんぜん]のために、王[おう]に歩兵[ほへい]や騎兵[きへい]、護衛[ごえい]を求[もと]めるのを恥[は]じたからである。"
  52: "わたしたちは王[おう]にこう言[い]っていたからである。「わたしたちの主[しゅ]の力[ちから]は、すべての立[た]て直[なお]しのために主[しゅ]を求[もと]める者[もの]たちとともにある。」"
  53: "そして再[ふたた]び、これらのことについてわたしたちの主[しゅ]に願[ねが]い、主[しゅ]の憐[あわ]れみを得[え]た。"
  54: "わたしは祭司[さいし]たちの氏族[しぞく]の長[かしら]たちから十二人[じゅうににん]を選[えら]び分[わ]けた。すなわちシェレビヤとアサビヤ、および彼[かれ]らとともにその兄弟[きょうだい]たちのうちから十人[じゅうにん]である。"
  55: "そして、王[おう]ご自身[じしん]とその顧問[こもん]たち、高官[こうかん]たち、およびイスラエルすべてがささげた、わたしたちの主[しゅ]の家[いえ]の銀[ぎん]、金[きん]、聖[せい]なる器[うつわ]を、彼[かれ]らのために量[はか]って渡[わた]した。"
  56: "すなわち、量[はか]って彼[かれ]らに渡[わた]したのは、銀[ぎん]六百五十[ろっぴゃくごじゅう]タラント、銀[ぎん]の器[うつわ]百[ひゃく]タラント、金[きん]百[ひゃく]タラント、金[きん]の飾[かざ]り二十[にじゅう]、および良質[りょうしつ]の青銅[せいどう]でできた、金[きん]のように輝[かがや]く青銅の器[うつわ]十二[じゅうに]であった。"
  57: "そして彼[かれ]らに言[い]った。「あなたがたも主[しゅ]に聖[せい]なる者[もの]であり、器[うつわ]も聖[せい]なるものである。銀[ぎん]と金[きん]は、わたしたちの父祖[ふそ]の主[しゅ]への誓[ちか]いの捧[ささ]げ物[もの]である。"
  58: "目[め]を覚[さ]まして守[まも]りなさい。エルサレムで、祭司[さいし]たちとレビ人[びと]たちの氏族[しぞく]の長[かしら]たち、およびイスラエルの父祖[ふそ]の家[いえ]の長[かしら]たちに、わたしたちの主[しゅ]の家[いえ]の器[うつわ]の納[おさ]め所[どころ]で、それらを渡[わた]すまで。」"
  59: "祭司[さいし]たちとレビ人[びと]たちは、銀[ぎん]と金[きん]と、エルサレムへ運[はこ]ぶ器[うつわ]を受[う]け取[と]り、主[しゅ]の神殿[しんでん]に運[はこ]び入[い]れた。"
  60: "わたしたちはフェランの川[かわ]から立[た]ち出[で]て、第一[だいいち]の月[つき]の十二日[じゅうににち]にエルサレムに入[はい]った。わたしたちの上[うえ]にある、わたしたちの主[しゅ]の強[つよ]い手[て]によってであった。主[しゅ]は出発[しゅっぱつ]のときから、すべての敵[てき]からわたしたちを救[すく]い出[だ]し、わたしたちはエルサレムへ来[き]たのである。"
  61: "そこに着[つ]いて三日が過[す]ぎたころ、四日目[よっかめ]に、量[はか]られた銀[ぎん]と金[きん]が、わたしたちの主[しゅ]の家[いえ]で祭司[さいし]マルモテ、すなわちウリヤの子[こ]に渡[わた]された。"
  62: "彼[かれ]とともにピネハスの子[こ]エレアザルがいた。また彼[かれ]らとともに、レビ人[びと]であるイエシュアの子[こ]ヨザバドと、サバンノスの子[こ]モエトがいた。すべては数[かず]と重[おも]さによって確[たし]かめられ、その重[おも]さはすべてその時[とき]に書[か]き記[しる]された。"
  63: "捕囚[ほしゅう]から戻[もど]って来[き]た者[もの]たちは、イスラエルの神[かみ]である主[しゅ]に犠牲[ぎせい]をささげた。すなわち、イスラエルすべてのために雄牛[おうし]十二頭[じゅうにとう]、雄羊[おひつじ]九十六頭[きゅうじゅうろくとう]、子羊[こひつじ]七十二頭[ななじゅうにとう]、救[すく]いのために雄山羊[おやぎ]十二頭[じゅうにとう]で、そのすべては主[しゅ]への犠牲[ぎせい]であった。"
  64: "彼[かれ]らは王[おう]の命令[めいれい]を、王の管理[かんり]者[しゃ]たちとコイレ・シリアおよびフェニキアの知事[ちじ]たちに渡[わた]した。そこで彼[かれ]らは民[たみ]と主[しゅ]の神殿[しんでん]を尊[とうと]んだ。"
  65: "これらのことが成[な]し遂[と]げられたとき、指導者[しどうしゃ]たちがわたしのもとに来[き]て言[い]った。"
  66: "「イスラエルの民[たみ]、またその長[かしら]たち、祭司[さいし]たち、レビ人[びと]たちは、この地[ち]の異[い]邦[ほう]の民[たみ]々[びと]と、その汚[けが]れから離[はな]れなかった。すなわち、カナン人[じん]、ヘテ人[じん]、ペレジ人[じん]、エブス人[じん]、モアブ人[じん]、エジプト人[じん]、エドム人[じん]である。"
  67: "彼[かれ]らもその子[こ]らも、異[い]邦[ほう]の民[たみ]の娘[むすめ]たちと結婚[けっこん]したからである。こうして聖[せい]なる種族[しゅぞく]がこの地[ち]の異邦の民[たみ]々[びと]と混[ま]じ合[あ]った。しかも、指導者[しどうしゃ]たちと高官[こうかん]たちが、この不法[ふほう]の始[はじ]めから、それに関[かか]わっていた。」"
  68: "わたしはこれを聞[き]くとすぐに、自分[じぶん]の衣[ころも]と聖[せい]なる祭服[さいふく]を裂[さ]き、頭[あたま]の毛[け]とひげを引[ひ]きむしり、悲[かな]しみに沈[しず]んで座[すわ]った。"
  69: "わたしがこの不法[ふほう]のために嘆[なげ]いていると、主[しゅ]の言葉[ことば]によって動[うご]かされた者[もの]たちが、すべてわたしのもとに集[あつ]まって来[き]た。わたしは夕[ゆう]べの犠牲[ぎせい]のときまで、悲[かな]しみに沈[しず]んで座[すわ]っていた。"
  70: "わたしは断食[だんじき]から立[た]ち上[あ]がった。衣[ころも]と聖[せい]なる祭服[さいふく]は裂[さ]けたままで、ひざをかがめ、主[しゅ]に向[む]かって両手[りょうて]を広[ひろ]げて言[い]った。"
  71: "「主[しゅ]よ、わたしはあなたの御前[みまえ]で恥[は]じ入[い]り、面目[めんぼく]を失[うしな]った。"
  72: "わたしたちの罪[つみ]は頭[あたま]の上[うえ]にまで増[ふ]え広[ひろ]がり、わたしたちの無知[むち]は天[てん]にまで及[およ]んだ。"
  73: "わたしたちの父祖[ふそ]の時代[じだい]から今日[こんにち]に至[いた]るまで、わたしたちは大[おお]きな罪[つみ]のうちにある。"
  74: "わたしたちの罪[つみ]と父祖[ふそ]の罪[つみ]のゆえに、わたしたちは兄弟[きょうだい]たち、王[おう]たち、祭司[さいし]たちとともに、この地[ち]の王[おう]たちに渡[わた]され、剣[つるぎ]にかかり、捕囚[ほしゅう]され、略奪[りゃくだつ]されて、今日[こんにち]まで恥[はじ]を負[お]っている。"
  75: "しかし今、主[しゅ]よ、あなたからわたしたちにどれほど大[おお]きな憐[あわ]れみが与[あた]えられたことか。あなたの聖所[せいしょ]の場所[ばしょ]に、わたしたちに根[ね]と名[な]を残[のこ]してくださった。"
  76: "また、わたしたちの主[しゅ]の家[いえ]にわたしたちの灯[あかり]をともし、わたしたちの奴隷[どれい]のときには食物[しょくもつ]をお与[あた]えくださった。"
  77: "わたしたちが奴隷[どれい]として仕[つか]えていたときも、わたしたちの主[しゅ]に見捨[みす]てられることはなかった。かえって主[しゅ]は、ペルシアの王[おう]たちの前[まえ]でわたしたちを恵[めぐ]みのうちに置[お]き、"
  78: "わたしたちに食物[しょくもつ]を与[あた]え、わたしたちの主[しゅ]の神殿[しんでん]を崇[あが]めさせ、荒[あ]れ果[は]てたシオンを起[お]こさせ、ユダヤとエルサレムにわたしたちの拠[よ]り所[どころ]を与[あた]えてくださった。"
  79: "しかし今、主[しゅ]よ、これらのことを受[う]けていながら、わたしたちは何[なに]を言[い]えようか。わたしたちは、あなたがしもべである預言者[よげんしゃ]たちの手[て]によって、こう言[い]って与[あた]えられたあなたの定[さだ]めに背[そむ]いた。"
  80: "『あなたがたが嗣業[しぎょう]として受[う]け継[つ]ごうと入[はい]って行[い]く地[ち]は、その地[ち]の異[い]邦[ほう]の民[たみ]の汚[けが]れによって汚[けが]れた地[ち]であり、彼[かれ]らは自分[じぶん]たちの汚[けが]れでそれを満[み]たした。"
  81: "そして今、あなたがたの娘[むすめ]たちを彼[かれ]らの子[こ]らに嫁[とつ]がせてはならず、彼[かれ]らの娘[むすめ]たちをあなたがたの子[こ]らに娶[めと]ってはならない。"
  82: "また、彼[かれ]らと和[やわ]らぐことを、いつの時代[じだい]にも求[もと]めてはならない。それは、あなたがたが強[つよ]くなってこの地[ち]の良[よ]いもの食[た]べ、それをあなたがたの子[こ]らに嗣業[しぎょう]として永遠[えいえん]に伝[つた]えるためである。』"
  83: "わたしたちに起[お]こることはすべて、わたしたちの悪[わる]い行[おこな]いと大[おお]きな罪[つみ]のゆえに起[お]こっている。"
  84: "あなたは、主[しゅ]よ、わたしたちの罪[つみ]を軽[かる]くし、このような根[ね]をお与[あた]えくださった。ところがわたしたちは再[ふたた]び心[こころ]を翻[ひるがえ]して、この地[ち]の民[たみ]の汚[けが]れに混[ま]じるために、あなたの律法[りっぽう]に背[そむ]いたのだ。"
  85: "あなたは、わたしたちに怒[いか]って、根[ね]も種[たね]も名[な]も残[のこ]らないほどにわたしたちを滅[ほろ]ぼそうとされたのではないか。"
  86: "イスラエルの主[しゅ]よ、あなたは真実[しんじつ]なお方[かた]である。わたしたちは今日[こんにち]まで根[ね]として残[のこ]されている。"
  87: "見[み]よ、今わたしたちは、自分[じぶん]たちの不法[ふほう]のうちにあなたの御前[みまえ]にいる。これらのことのゆえに、もはやあなたの前[まえ]に立[た]つことはできない。」"
  88: "エズラが祈[いの]りながら告白[こくはく]し、泣[な]きながら神殿[しんでん]の前[まえ]に地[ち]に伏[ふ]しているとき、エルサレムから非常[ひじょう]に多[おお]くの群衆[ぐんしゅう]が、男[おとこ]も女[おんな]も若者[わかもの]も、彼[かれ]のもとに集[あつ]まって来[き]た。その多[おお]くの人[ひと]々[びと]の間[あいだ]に大[おお]きな嘆[なげ]きがあったからである。"
  89: "そのとき、イスラエルの子[こ]らであるイエヒエルの子[こ]エホニヤが声[こえ]を上[あ]げて、エズラに言[い]った。「エズラよ、わたしたちは主[しゅ]に対して罪[つみ]を犯[おか]し、この地[ち]の民[たみ]のうちから異[い]邦[ほう]の女[おんな]たちを妻[つま]に迎[むか]えた。しかし今、イスラエルには希望[きぼう]がある。"
  90: "このことについて、わたしたちは主[しゅ]に誓[ちか]いを立[た]てよう。すなわち、異[い]邦[ほう]の女[おんな]たちから迎[むか]えた妻[つま]をすべて、その子[こ]どもたちとともに追[お]い出[だ]すことだ。あなたが裁[さば]いたとおりに、また主[しゅ]の律法[りっぽう]に従[したが]う者[もの]たちすべてがそうするように。"
  91: "立[た]って、それを成[な]し遂[と]げてください。この事[こと]はあなたに属[ぞく]しているのですから。わたしたちもあなたとともに、力[ちから]を尽[く]して行[おこな]う。」"
  92: "そこでエズラは立[た]ち上[あ]がり、祭司[さいし]たちとレビ人[びと]たちの氏族[しぞく]の長[ちょう]たち、すなわちイスラエル全体[ぜんたい]の長[ちょう]たちに、このとおりに行[おこな]うよう誓[ちか]わせた。そして彼[かれ]らは誓[ちか]った。"

notes:
  1: "μεταγενέστερος τούτων — «позже этих [событий]» (μεταγενής); βασιλεύοντος Ἀρταξέρξου — при царствовании Артаксеркса; προσέβη — «приступил, предстал» (προσβαίνω), слав. «приступи». Родословие: Σαραιου, Εζεριου, Χελκιου, Σαλημου — サライア, エゼリヤ, ヒルキヤ, サリム; слав. «сариин, езериев, хелкиев, салумов»; Син. даёт иные имена (Азария, Зехрия) по МТ."
  2: "Σαδδουκ — サドク, Αχιτωβ — アヒトブ, Αμαρι — アマリヤ, Οζι — オジヤ, Βοκκα — ボカイ, Αβισουε — アビシュア, Φινεες — ピネハス, Ελεαζαρ — エレアザル, Ααρων — アロン; τοῦ πρώτου ἱερέως — «первого священника», т. е. первосвященника. Слав. между Озией и Воккой добавляет три имени — Мераиоф, Зерахия, Уззи (メライオト, ザラヤ, オジ), которых в LXX нет; они внесены в текст по паритету (ср. 1 Пар 6:6–8; Езд 7:3–4)."
  3: "γραμματεὺς εὐφυής — «даровитый книжник» (εὐφυής — способный; слав. «благоразумен»); ἐν τῷ νόμῳ Μωυσέως τῷ ἐκδεδομένῳ ὑπὸ τοῦ θεοῦ — в законе Моисея, данном Богом (ἐκδίδωμι — передавать). Слав. «книгочий» — 学者."
  4: "ἔδωκεν αὐτῷ δόξαν — дал ему славу, честь; εὑρόντος χάριν ἐναντίον αὐτοῦ — так как он обрёл благодать пред ним (gen. absolutus); ἐπὶ πάντα τὰ ἀξιώματα αὐτοῦ — «во всех его прошениях» (ἀξίωμα — просьба; слав. «достоинство»)."
  5: "συνανέβησαν — взошли вместе (συναναβαίνω); ἱεροψάλται — храмовые певцы (歌い手); θυρωροί — 門衛; ἱερόδουλοι — храмовые рабы (神殿のしもべ). ἔτους ἑβδόμου … ἐν τῷ πέμπτῳ μηνί — в седьмой год, в пятый месяц; [οὗτος ἐνιαυτὸς ἕβδομος τῷ βασιλεῖ] — пояснение в скобках критического издания, есть в gr-lxx-byz, поэтому без 〔…〕."
  6: "τῇ νουμηνίᾳ τοῦ πρώτου μηνός … τοῦ πέμπτου μηνός — в новолуние первого и пятого месяца (νουμηνία, 新月); слав. пропускает второе «в новолуние пятого месяца», в тексте по LXX. κατὰ τὴν δοθεῖσαν … εὐοδίαν παρὰ τοῦ κυρίου ἐπ᾿ αὐτῷ — по данной им Господом благопоспешности в этом деле (εὐοδία)."
  7: "πολλὴν ἐπιστήμην περιεῖχεν — обладал большим знанием (ἐπιστήμη); εἰς τὸ μηδὲν παραλιπεῖν — чтобы ничего не опустить (παραλείπω); δικαιώματα καὶ κρίματα — постановления и суды, 定めと裁き."
  8: "γραφὲν πρόσταγμα — написанное повеление (πρόσταγμα); ἀναγνώστης τοῦ νόμου — чтец закона (読み手); ἀντίγραφον τὸ ὑποκείμενον — нижеследующая копия."
  9: "Βασιλεὺς Ἀρταξέρξης … χαίρειν — царь Артаксеркс … радоваться, т. е. приветствие (χαίρειν); с этого стиха начинается письмо, кавычки до 8:24."
  10: "τὰ φιλάνθρωπα κρίνας — рассудив человеколюбиво (φιλάνθρωπος); τοὺς βουλομένους … αἱρετίζοντας — желающих, избирающих (αἱρετίζω; слав. «с волею благою»); συμπορεύεσθαι — идти вместе."
  11: "ἐνθυμοῦνται — замышляют, желают (ἐνθυμέομαι); συνεξορμάτωσαν — пусть вместе выступят (συνεξορμάω); τοῖς ἑπτὰ φίλοις συμβουλευταῖς — семи друзьям-советникам (顧問)."
  12: "ἐπισκέψωνται τὰ κατὰ τὴν Ιουδαίαν — посмотрят, что в Иудее (ἐπισκέπτομαι); ἀκολούθως ᾧ ἔχει ἐν τῷ νόμῳ — согласно с тем, что в законе."
  13: "ἀπενεγκεῖν δῶρα — принести дары (ἀποφέρω); ηὐξάμην — дал обет (εὔχομαι); τὸ δεδωρημένον ὑπὸ τοῦ ἔθνους — дарованное народом (δωρέομαι); ἱερόν — 神殿."
  14: "συναχθῆναι τὸ χρυσίον καὶ ἀργύριον εἰς ταύρους … — чтобы золото и серебро собрано было на волов, овнов и агнцев; τὰ τούτοις ἀκόλουθα — сопутствующее им."
  15: "προσενεγκεῖν θυσίας ἐπὶ τὸ θυσιαστήριον — принести жертвы на жертвенник (θυσιαστήριον, 祭壇); слав. добавляет «Господу» (жертвы Господу на алтарь Господа); в тексте отдельно не выражено."
  16: "χρυσίῳ καὶ ἀργυρίῳ — золотом и серебром (дат. средства); ἐπιτέλει — соверши (ἐπιτελέω); κατὰ τὸ θέλημα — по воле."
  17: "τὰ ἱερὰ σκεύη τοῦ κυρίου — священные сосуды Господа (σκεῦος, 器); εἰς τὴν χρείαν τοῦ ἱεροῦ — на нужды храма. Слав. добавляет «да положиши пред Господем Богом твоим» — глагол, которого в LXX нет; внесён в текст как 納めよ."
  18: "ὑποπίπτῃ σοι — потребуется тебе (ὑποπίπτω); ἐκ τοῦ βασιλικοῦ γαζοφυλακίου — из царского казнохранилища (γαζοφυλάκιον, 宝物庫)."
  19: "γαζοφύλακες — хранители сокровищ; ἀποστείλῃ — пошлёт (слав. «напишет» — 書き送る); ἕως ἀργυρίου ταλάντων ἑκατόν — до ста талантов серебра; ἐπιμελῶς — тщательно."
  20: "πυροῦ κόροι — коры пшеницы (κόρος, コル); οἴνου μετρηταί — меры вина (μετρητής; バト по Син.); ἅλα ἐκ πλήθους — соли в изобилии. Слав. и Син. соли не упоминают; в тексте по LXX."
  21: "πάντα τὰ κατὰ τὸν νόμον — всё по закону; ἐπιτελεσθώτω — да будет совершено; ἕνεκα τοῦ μὴ γενέσθαι ὀργήν — чтобы не возник гнев. Слав. добавляет «ина премнога» (и иное многое) — внесено в текст."
  22: "φορολογία — подать, 貢ぎ物; ἐπιβολή — наложение, 負担; πραγματικοί — делопроизводители храма (слав. «писцы церкви»); ἐξουσίαν … ἐπιβαλεῖν — власть налагать."
  23: "ἀνάδειξον κριτὰς καὶ δικαστάς — поставь судей и судебных исполнителей (ἀναδείκνυμι, δικαστής); τοὺς μὴ ἐπισταμένους διδάξεις — незнающих научишь."
  24: "κολασθήσονται — будут наказаны (κολάζω); θανάτῳ, τιμωρίᾳ, ἀργυρικῇ ζημίᾳ, ἀπαγωγῇ — смертью, телесным наказанием, денежным штрафом, изгнанием. Здесь кончается письмо; кавычки закрываются."
  25: "Εὐλογητὸς … ὁ κύριος — благословен Господь; μόνως — «един» (слав. «един»); δοὺς ταῦτα εἰς τὴν καρδίαν τοῦ βασιλέως — вложивший это в сердце царя. Слав. добавляет «И рече ездра книгочий» и «Бог отец моих» — внесено в текст (そこでエズラは言った; 父祖の神)."
  26: "ἐτίμησεν — почтил, 栄誉を与えた; ἔναντι τοῦ βασιλέως καὶ τῶν συμβουλευόντων — пред царём и советниками; φίλοι καὶ μεγιστᾶνες — друзья и вельможи."
  27: "εὐθαρσὴς ἐγενόμην — ободрился (εὔθαρσος); κατὰ τὴν ἀντίλημψιν — по поддержке (ἀντίλημψις); συνήγαγον … ὥστε συναναβῆναί μοι — собрал, чтобы взошли со мной. Здесь кончается речь Ездры."
  28: "οἱ προηγούμενοι — предводители (προηγέομαι); κατὰ τὰς πατριάς — по родам (πατριά); μεριδαρχίαι — «части», отряды (μεριδαρχία; слав. «началство»); ἐν τῇ βασιλείᾳ Ἀρταξέρξου — в царствование Артаксеркса."
  29: "Φινεες — ピネハス; Γαρσομος — ギルション (слав. «гирсон»); Ιεταμαρ — イタマル; Γαμηλος — ガマリエル (слав. «гамалиил»); Δαυιδ — ダビデ; Αττους — ハトス (слав. «латтус»); ὁ Σεχενιου — сын Сехении (セヘニヤ)."
  30: "Φορος — フォロス; Ζαχαριας — ザカリヤ; ἀπὸ γραφῆς — по списку, записанные (γραφή); ἑκατὸν πεντήκοντα — 150."
  31: "Φααθμωαβ — パハト・モアブ; Ελιαωνιας — エリアオニア; Ζαραιου — сын Зараии (ザラヤ); διακόσιοι — 200."
  32: "Ζαθοης — ザトエス; Σεχενιας — セヘニヤ; Ιεζηλος — イエジル; Αδιν — アディン; Βην — тёмное имя, слав. и Син. «Овиф» (オビフ), в тексте по csl; Ιωναθας — ヨナタン. 300 и 250."
  33: "Ηλαμ — エラム; Ιεσιας — イエシヤ; Γοθολιος — ゴトリヤ (слав. «гофолиев»); ἑβδομήκοντα — 70."
  34: "Σαφατιου — サファテヤ; Ζαραιας — ザラヤ; Μιχαηλ — ミカエル; ἑβδομήκοντα — 70."
  35: "Ιωαβ — ヨアブ; Αβαδιας — アバデヤ; Ιεζηλος — イエジル; διακόσιοι δέκα δύο — 212."
  36: "Βανι — バニ (в параллели Езд 8:10 — バアニ); Ασσαλιμωθ — アサリモト; Ιωσαφιας — ヨサフィヤ; ἑκατὸν ἑξήκοντα — 160."
  37: "Βαβι — バビ; Ζαχαριας — ザカリヤ; Βηβαι — ビバイ; εἴκοσι ὀκτώ — 28."
  38: "Ασγαθ — アスガド (форма корпуса); Ιωανης — ヨハナン; Ακαταν — アカタン; ἑκατὸν δέκα — 110."
  39: "Αδωνικαμ — アドニカム; οἱ ἔσχατοι — последние (в роде); Ελιφαλατος, Ιεουηλ, Σαμαιας — エリファラト, イエウエル, サマヤ. Слав. читает «елифала сын иеуилев и самеа», т. е. два имени; в LXX три, в тексте по LXX (ср. Езд 8:13). ἑβδομήκοντα — 70."
  40: "Βαγο — バゴ; Ουθι — ウタイ (форма корпуса); Ισταλκουρος — イスタルクロス (слав. «истакур»); ἑβδομήκοντα — 70."
  41: "Θεραν ποταμός — река Феран (в канонической Ездре — Агава/アウエ); παρενεβάλομεν — расположились станом (παρεμβάλλω); κατέμαθον — рассмотрел, пересчитал (καταμανθάνω)."
  42: "ἐκ τῶν υἱῶν τῶν ἱερέων καὶ ἐκ τῶν Λευιτῶν οὐχ εὑρών — не найдя там никого из священников и левитов; предложение продолжается в ст. 43."
  43: "ἀπέστειλα πρός — послал к (ἀποστέλλω); Μαασμαν — マアスマン; Ελναταν — エルナタン; Σαμαιας — サマヤ; Ιωριβον — ヨリボン; Μεσολαμος — メソラム; ἡγούμενοι καὶ ἐπιστήμονες — вожди и знающие. Слав. добавляет имя «Мамея» (マメヤ) между Елнафаном и Самеей, которого в LXX нет; внесено по паритету."
  44: "Αδδαιος — アダイ (слав. «доддей», Син. «Доддей»); ὁ ἡγούμενος ὁ ἐν τῷ τόπῳ τοῦ γαζοφυλακίου — начальствующий в месте сокровищницы; Син. понял τόπος как «Касифья»."
  45: "ἐντειλάμενος — заповедав (ἐντέλλομαι); διαλεγῆναι — переговорить (διαλέγομαι); τοὺς ἱερατεύσοντας — тех, кто будет священствовать (ἱερατεύω); ἐν τῷ οἴκῳ — в доме."
  46: "κατὰ τὴν κραταιὰν χεῖρα — по крепкой руке (κραταιός); Μοολι — Махли (マフリ, форма корпуса); Ασεβηβιας — アセベビヤ; δέκα ὀκτώ — 18."
  47: "Ασεβιας — アセビヤ; Αννουν — アンヌン; Ωσαιας — オシヤ; ἀδελφὸν ἐκ τῶν υἱῶν Χανουναιου — брата из сыновей Ханунея (ハヌネヤ); εἴκοσι — 20."
  48: "ἱερόδουλοι — храмовые рабы (神殿のしもべ); οὓς ἔδωκεν Δαυιδ — которых дал Давид; εἰς τὴν ἐργασίαν τῶν Λευιτῶν — на работу левитам; ὀνοματογραφία — список имён, 名簿."
  49: "εὐξάμην … νηστείαν — дал обет поста (εὔχομαι, νηστεία); τοῖς νεανίσκοις — юношам (νεανίσκος); ἔναντι τοῦ κυρίου — пред Господом."
  50: "ζητῆσαι παρ᾿ αὐτοῦ εὐοδίαν — испросить у Него благополучный путь (εὐοδία); τοῖς συνοῦσιν ἡμῖν — тем, кто с нами; κτήνη — скот, 家畜."
  51: "ἐνετράπην — устыдился (ἐντρέπω); πεζούς, ἱππεῖς, προπομπήν — пеших, всадников, провожатых (護衛); ἕνεκεν ἀσφαλείας — ради безопасности."
  52: "εἴπαμεν … ὅτι — мы сказали, что; Ἰσχὺς τοῦ κυρίου — сила Господа; εἰς πᾶσαν ἐπανόρθωσιν — «во всякое исправление», т. е. во всякое доброе дело (ἐπανόρθωσις; слав. «на всякое управление»). Слова, сказанные царю, — в кавычках."
  53: "ἐδεήθημεν — умолили (δέομαι); εὐιλάτου ἐτύχομεν — «получили [Его] милостивым» (εὐίλατος, τυγχάνω), т. е. обрели милость."
  54: "ἐχώρισα — отделил (χωρίζω); φύλαρχοι τῶν ἱερέων — начальники священников (φύλαρχος); Σερεβιας — シェレビヤ (форма корпуса; слав. «есеврия»); Ασαβιας — アサビヤ. Слав. читает «от племеноначалников и священников», т. е. две группы; в LXX — «начальники священников», в тексте по LXX."
  55: "ἔστησα — взвесил, вверил (ἵστημι); ἃ αὐτὸς ἐδωρήσατο ὁ βασιλεύς — которые даровал сам царь (δωρέομαι); σύμβουλοι καὶ μεγιστᾶνες — советники и вельможи."
  56: "τάλαντα ἑξακόσια πεντήκοντα — 650 талантов; σκεύη ἀργυρᾶ ταλάντων ἑκατόν — серебряных сосудов на 100 талантов; χρυσώματα εἴκοσι — двадцать золотых украшений (χρύσωμα; слав. «позлащенных»); χαλκὸς χρηστός — хорошая медь; στίλβοντα χρυσοειδῆ — блестящие, золотовидные."
  57: "ἅγιοι τῷ κυρίῳ — святы Господу; σκεύη ἅγια — сосуды святы; εὐχή — обет, дар по обету (слав. «обещанное»); κυρίῳ κυρίῳ τῶν πατέρων — «Господу Господу отцов наших», двойное κύριος."
  58: "ἀγρυπνεῖτε καὶ φυλάσσετε — бодрствуйте и храните (ἀγρυπνέω); φύλαρχοι — начальники; παστοφόρια — хранилища при доме (παστοφόριον, 器の納め所); ἕως τοῦ παραδοῦναι — до передачи. Здесь кончается речь Ездры."
  59: "παραλαβόντες — приняв (παραλαμβάνω); τὰ ἐν Ιερουσαλημ — «то, что в Иерусалиме», т. е. сосуды, предназначенные для Иерусалима; εἰσήνεγκαν εἰς τὸ ἱερόν — внесли в храм (εἰσφέρω; ἱερόν — 神殿)."
  60: "ἀναζεύξαντες — отправившись (ἀναζεύγνυμι); τῇ δωδεκάτῃ τοῦ πρώτου μηνός — в двенадцатый день первого месяца; κατὰ τὴν κραταιὰν χεῖρα — по крепкой руке; ἐπὶ τῆς εἰσόδου — «при входе», т. е. с самого начала пути (слав. «от исхода пути»)."
  61: "σταθέν — взвешенное (ἵστημι); Μαρμωθι Ουρια — マルモテ, сын Урии (ウリヤ; слав. «мармофе»); ἐν τῷ οἴκῳ — в доме. Слав. добавляет «в четвертый день» — внесено в текст; в LXX только «на третий день»."
  62: "Ιωσαβδος Ἰησοῦ — ヨザバド, сын Иешуа (イエシュア); Μωεθ Σαβαννου — モエト, сын Саванна (サバンノス); οἱ Λευῖται — левиты; πρὸς ἀριθμὸν καὶ ὁλκήν — по числу и весу (ὁλκή); ἐγράφη … αὐτῇ τῇ ὥρᾳ — записано в тот же час."
  63: "οἱ παραγενόμενοι ἐκ τῆς αἰχμαλωσίας — пришедшие из плена (αἰχμαλωσία); ταῦροι δώδεκα, κριοὶ ἐνενήκοντα ἕξ, ἄρνες ἑβδομήκοντα δύο, τράγοι δώδεκα — 12, 96, 72, 12; ὑπὲρ σωτηρίου — за спасение (σωτήριον); ἅπαντα θυσίαν — всё — жертва."
  64: "ἀπέδωκαν τὰ προστάγματα — отдали повеления; οἰκονόμοι — управляющие (οἰκονόμος); ἔπαρχοι — начальники, 知事 (ἔπαρχος); Κοίλη Συρία — Келе-Сирия (コイレ・シリア; слав. «килисирия» — смешение с Киликией); ἐδόξασαν — почтили."
  65: "τελεσθέντων — когда было совершено (τελέω); προσήλθοσαν — приступили (προσέρχομαι); λέγοντες — говоря; речь начинается в ст. 66."
  66: "οὐκ ἐχώρισαν — не отделились (χωρίζω); ἀλλογενῆ ἔθνη — иноплеменные народы (ἀλλογενής); ἀκαθαρσίαι — нечистоты (汚れ); перечень: Χαναναῖοι, Χετταῖοι, Φερεζαῖοι, Ιεβουσαῖοι, Μωαβῖται, Αἰγύπτιοι, Ιδουμαῖοι — カナン人, ヘテ人, ペレジ人, エブス人, モアブ人, エジプト人, エドム人."
  67: "συνῴκησαν — вступили в сожительство, брак (συνοικέω); ἐπεμίγη τὸ σπέρμα τὸ ἅγιον — смешалось семя святое (ἐπιμίγνυμι, σπέρμα); μετεῖχον … τῆς ἀνομίας — участвовали в беззаконии (μετέχω); ἀπὸ τῆς ἀρχῆς — с начала."
  68: "διέρρηξα τὰ ἱμάτια — разодрал одежды (διαρρήγνυμι); ἱερὰ ἐσθῆτα — священная одежда (祭服); κατέτιλα τοῦ τριχώματος — рвал волосы (τίλλω, τρίχωμα); πώγων — борода; σύννους καὶ περίλυπος — удручённый и печальный."
  69: "ἐπεκινοῦντο τῷ ῥήματι — были движимы словом (ἐπικινέω); πενθῶν ἐπὶ τῇ ἀνομίᾳ — плача о беззаконии; ἕως τῆς δειλινῆς θυσίας — до вечерней жертвы (δειλινός, θυσία)."
  70: "ἐξεγερθείς — поднявшись (ἐξεγείρω); διερρηγμένα ἔχων — имея разодранное; κάμψας τὰ γόνατα — преклонив колени; ἐκτείνας τὰς χεῖρας — простерев руки; ἔλεγον — говорил (вводит молитву)."
  71: "ᾔσχυμμαι, ἐντέτραμμαι — устыдился и посрамлён (αἰσχύνομαι, ἐντρέπω); κατὰ πρόσωπόν σου — пред лицом Твоим. С этого стиха молитва Ездры, кавычки до 8:87."
  72: "ἐπλεόνασαν ὑπὲρ τὰς κεφαλάς — умножились выше голов (πλεονάζω); ἄγνοιαι — неведения, безумия (ἄγνοια); ὑπερήνεγκαν ἕως τοῦ οὐρανοῦ — поднялись до неба (ὑπερφέρω)."
  73: "ἀπὸ τῶν χρόνων τῶν πατέρων — со времён отцов; ἐν μεγάλῃ ἁμαρτίᾳ — в великом грехе; ἕως τῆς ἡμέρας ταύτης — до сего дня."
  74: "παρεδόθημεν — преданы (παραδίδωμι); εἰς ῥομφαίαν καὶ αἰχμαλωσίαν καὶ προνομήν — под меч, в плен и на разграбление (ῥομφαία, αἰχμαλωσία, προνομή); μετὰ αἰσχύνης — с посрамлением; βασιλεῦσιν τῆς γῆς — царям земли."
  75: "κατὰ πόσον τι — сколь велико (πόσος); ἔλεος — милость; καταλειφθῆναι ἡμῖν ῥίζαν καὶ ὄνομα — оставить нам корень и имя (ῥίζα, ὄνομα); ἐν τῷ τόπῳ τοῦ ἁγιάσματός σου — на месте святыни Твоей (ἁγίασμα)."
  76: "ἀνακαλύψαι φωστῆρα — возжечь светильник (ἀνακαλύπτω, φωστήρ); ἐν τῷ καιρῷ τῆς δουλείας — во время рабства (δουλεία); τροφή — пища. Слав. относит к этому стиху начало гр. 8:77 («и когда мы служили…»); держимся деления gr."
  77: "ἐν τῷ δουλεύειν ἡμᾶς — когда мы служили (δουλεύω); οὐκ ἐγκατελείφθημεν — не были оставлены (ἐγκαταλείπω); ἐν χάριτι ἐνώπιον τῶν βασιλέων Περσῶν — в благодати пред царями персидскими."
  78: "δοῦναι ἡμῖν τροφήν — дать нам пищу; δοξάσαι τὸ ἱερόν — прославить храм; ἐγεῖραι τὴν ἔρημον Σιων — восставить опустошённый Сион (ἔρημος); στερέωμα — утверждение, опора (στερέωμα). Слав. относит «дать пищу» к ст. 77, а «прославить храм» начинает ст. 78; держимся gr."
  79: "τί ἐροῦμεν — что скажем; παρέβημεν — преступили (παραβαίνω); ἐν χειρὶ τῶν παίδων σου τῶν προφητῶν — рукою рабов Твоих пророков; λέγων ὅτι — говоря, что (вводит цитату в ст. 80)."
  80: "ἡ γῆ, εἰς ἣν εἰσέρχεσθε κληρονομῆσαι — земля, в которую вы входите наследовать (κληρονομέω); μεμολυσμένη μολυσμῷ — осквернённая скверной (μολύνω, μολυσμός); ἀλλογενεῖς — иноплеменные; ἐνέπλησαν — наполнили. Слова Бога через пророков — 『…』 до 8:82."
  81: "μὴ συνοικίσητε — не отдавайте в брак (συνοικίζω); μὴ λάβητε — не берите; τοῖς υἱοῖς ὑμῶν — за сыновей ваших."
  82: "ζητῆσαι εἰρηνεῦσαι — искать мира (εἰρηνεύω); ἵνα ἰσχύσαντες φάγητε — чтобы, укрепившись, ели (ἰσχύω); κατακληρονομήσητε — дадите в наследие (κατακληρονομέω); ἕως αἰῶνος — до века. Здесь закрываются 『』."
  83: "τὰ συμβαίνοντα — случающееся (συμβαίνω); διὰ τὰ ἔργα ἡμῶν τὰ πονηρά — из-за дел наших злых; μεγάλαι ἁμαρτίαι — великие грехи. Слав. относит к этому стиху начало гр. 8:84 («Ты бо, Господи, облегчил еси…»); держимся gr."
  84: "ἐκούφισας — облегчил (κουφίζω); τοιαύτην ῥίζαν — такой корень; ἀνεκάμψαμεν — снова обратились (ἀνακάμπτω); ἐπιμιγῆναι τῇ ἀκαθαρσίᾳ — смешаться с нечистотой (ἐπιμίγνυμι)."
  85: "οὐχὶ ὠργίσθης — не прогневался ли Ты (ὀργίζομαι); ἀπολέσαι — погубить (ἀπόλλυμι); ἕως τοῦ μὴ καταλιπεῖν — так что не осталось (καταλείπω); ῥίζα, σπέρμα, ὄνομα — корень, семя, имя."
  86: "ἀληθινὸς εἶ — Ты истинен (ἀληθινός); κατελείφθημεν … ῥίζα — мы остались корнем; ἐν τῇ σήμερον — в сей день."
  87: "ἐν ταῖς ἀνομίαις ἡμῶν — в беззакониях наших; οὐκ ἔστιν στῆναι — невозможно стоять (ἵστημι); ἐπὶ τούτοις — при этом. Здесь кончается молитва."
  88: "ἀνθωμολογεῖτο — исповедовался (ἀνθομολογέομαι); χαμαιπετής — павший на землю (χαμαιπετής); ὄχλος πολὺς σφόδρα — весьма большая толпа; κλαυθμός — плач. Слав. добавляет «и юноты» (юноши/дети) — в тексте по LXX (νεανίαι, 若者); слав. добавление оставлено в notes, смысл спорен."
  89: "Ιεχονιας Ιεηλου — エホニヤ, сын Иехиила (イエヒエル; слав. «иехониа иеилев»; в параллели Езд 10:2 — Шехания); ἡμάρτομεν — согрешили; συνῳκίσαμεν γυναῖκας ἀλλογενεῖς — взяли жён иноплеменных; ἐλπὶς τῷ Ισραηλ — надежда Израилю. Слав. «есть пред тобою весь израиль» — иное чтение, возможно испорченное; в тексте по LXX. Начало речи Ехонии, кавычки до 8:91."
  90: "ὁρκωμοσία — клятва (ὁρκωμοσία); ἐκβαλεῖν — изгнать (ἐκβάλλω); ὡς ἐκρίθη σοι — как рассудилось тебе (κρίνω); πειθαρχοῦσιν τῷ νόμῳ — повинующиеся закону (πειθαρχέω)."
  91: "ἀναστάς — встав; ἐπιτέλει — соверши (ἐπιτελέω); πρὸς σὲ τὸ πρᾶγμα — к тебе дело; ἰσχὺν ποιεῖν — «делать силу», т. е. крепко помогать (ἰσχύς). Конец речи."
  92: "ὥρκισεν — заклял (ὁρκίζω); φύλαρχοι — начальники родов (φύλαρχος); ποιῆσαι κατὰ ταῦτα — поступить по сему; ὤμοσαν — поклялись (ὄμνυμι)."
