#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге нет; jp-ni (под авторским правом) не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 8: родословие Ездры (1–2), его приход и грамота (3–7), письмо Артаксеркса
# (8–24), благодарение Ездры (25–27), список шедших с ним (28–40), сбор у реки
# Феран и левиты (41–48), пост и молитва о пути (49–53), сдача сосудов (54–60),
# прибытие и жертвы (61–64), весть о смешанных браках (65–67), скорбь Ездры (68–70),
# молитва о грехах народа (71–87), собрание и речь Ехонии (88–91), клятва (92).
# Речи: письмо Артаксеркса — 「…」 (9–24); слова Ездры (52, 57–58); благодарение
# (25–27); молитва — 「…」 (71–87), в ней слова Бога через пророков — 『…』 (80–82);
# речь Ехонии — 「…」 (89–91). Красного и синего нет.
# Нумерация по gr: 92 стиха; csl совпадает по числу, но в 8:76–78 и 83–84 делит иначе
# (начало гр. 8:77 отнесено к csl 8:76, начало гр. 8:84 — к csl 8:83); держимся gr.
# Слав. добавления внесены в текст без скобок: 8:2 три имени родословия (Мераиоф,
# Зерахия, Уззи), 8:17 «положи перед Господом», 8:21 «и иное многое», 8:25 «И сказал
# Ездра книжник» и «Бог отцов моих», 8:43 «Мамея», 8:61 «в четвертый день»,
# 8:88 «и юноты» оставлено в notes (смысл спорен). Слав. чтение 8:32 «Овиф» (в LXX Βην)
# — в тексте. В 8:89 держимся LXX «надежда Израилю» (слав. «весь Израиль перед тобою»).
# 〔…〕 нет: все 92 стиха есть в gr-lxx-byz. Сносок ⟨…⟩ нет: 神殿, 祭壇, 器,
# 律法, 断食, 捕囚, 嗣業, 祭司, レビ人, 宝物庫, 聖所 уже в корпусе.
# Имена — транслитерация греческого (LXX); в параллельных списках — формы корпуса
