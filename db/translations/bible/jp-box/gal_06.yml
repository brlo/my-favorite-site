# jp-box, Послание к Галатам, глава 6. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 6: восстановление падшего и закон Христов (1–5), сеяние и жатва (6–10),
# крупными буквами, хвала только крестом (11–18).
# Красного (<j>) и синего (<mo>) нет: прямой речи Христа и Богородицы в главе нет.
# 〔…〕 два: 6:15 — церковное ἐν Χριστῷ Ἰησοῦ (в базе только οὔτε… κτίσις);
# 6:17 — церковное κυρίου (в базе τοῦ Ἰησοῦ).
# Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

tr_code: jp-box
book: gal
chapter: 6
draft: true

verses:
  1: "兄弟[きょうだい]たちよ、もし人[ひと]が何[なに]かの過[あやま]ちに捕[と]らえられたとしても、霊[れい]に属[ぞく]するあなたがたは、柔和[じゅうわ]の霊[れい]をもって、そのような人[ひと]を立[た]て直[なお]しなさい。自分[じぶん]自身[じしん]に目[め]を注[そそ]ぎながら。あなたも試[こころ]みに遭[あ]わないように。"
  2: "互[たが]いに重荷[おもに]を負[お]い合[あ]いなさい。そうすれば、キリストの律法[りっぽう]を全[まっと]うするであろう。"
  3: "というのは、何[なに]でもない者[もの]が、自分[じぶん]を何[なに]かであると思[おも]うなら、その人[ひと]は自分[じぶん]を欺[あざむ]いているからである。"
  4: "めいめい、自分[じぶん]の行[おこな]いを吟味[ぎんみ]しなさい。そうすれば、誇[ほこ]りは他[た]人[にん]ではなく、自分[じぶん]自身[じしん]に対して持[も]つことになる。"
  5: "というのは、めいめいが自分[じぶん]の荷[に]を負[お]うからである。"
  6: "御言葉[みことば]を教[おし]えられている者[もの]は、教[おし]える者[もの]と、すべての善[ぜん]いものを分[わ]かち合[あ]いなさい。"
  7: "欺[あざむ]かれてはならない。神[かみ]は侮[あなど]られない。人[ひと]が蒔[ま]くものは、そのまま刈[か]り取[と]るからである。"
  8: "なぜなら、自分[じぶん]の肉[にく]に蒔[ま]く者[もの]は、肉[にく]から滅[ほろ]びを刈[か]り取[と]り、霊[れい]に蒔[ま]く者[もの]は、霊[れい]から永遠[えいえん]の命[いのち]を刈[か]り取[と]るからである。"
  9: "善[よ]いことを行[おこな]うことに倦[う]んではならない。くじけさえしなければ、時[とき]が来[き]れば刈[か]り取[と]るからである。"
  10: "だから、機会[きかい]があるうちに、すべての人[ひと]に、特[とく]に信仰[しんこう]の家族[かぞく]に善[ぜん]いことを行[おこな]おうではないか。"
  11: "見[み]よ、わたしが自分[じぶん]の手[て]で、どれほど大[おお]きな文字[もじ]であなたがたに書[か]いたかを。"
  12: "肉[にく]において見栄[みえ]を張[は]りたい者[もの]たちが、あなたがたに割礼[かつれい]を受[う]けさせようと強[し]いるのは、キリストの十字架[じゅうじか]のために迫害[はくがい]されないようにするためだけである。"
  13: "というのは、割礼[かつれい]を受[う]けている者[もの]たち自身[じしん]が律法[りっぽう]を守[まも]っているわけではないからである。あなたがたの肉[にく]を誇[ほこ]るために、あなたがたに割礼[かつれい]を受けさせたいと願[ねが]っているのである。"
  14: "しかし、わたしはわたしたちの主[しゅ]イエス・キリストの十字架[じゅうじか]のほかには、決[けっ]して誇[ほこ]りたくない。この十字架[じゅうじか]によって、世[よ]はわたしに対して十字架[じゅうじか]につけられ、わたしも世[よ]に対して十字架[じゅうじか]につけられたのである。"
  15: "というのは、〔キリスト・イエスにあっては〕、割礼[かつれい]も無割礼[むかつれい]も何[なに]でもなく、ただ新[あたら]しい創造[そうぞう]があるのみだからである。"
  16: "この規[のり]に従[したが]って歩[あゆ]むすべての者[もの]の上[うえ]に、平和[へいわ]と憐[あわ]れみがあるように。神[かみ]のイスラエルの上[うえ]にも。"
  17: "これからは、だれもわたしを煩[わずら]わせないでほしい。わたしは、〔主[しゅ]〕イエスの焼[や]き印[いん]をこの身[み]に負[お]っているのだから。"
  18: "兄弟[きょうだい]たちよ、わたしたちの主[しゅ]イエス・キリストの{恵[めぐ]み|恩寵[おんちょう]}が、あなたがたの霊[れい]とともにありますように。アーメン。"

notes:
  1: "προλημφθῇ — «будет захвачен, застигнут»; 捕らえられた. οἱ πνευματικοί — 霊に属するあなたがた; καταρτίζετε — 立て直しなさい; σκοπῶν σεαυτόν — единственное число сохранено (あなたも)."
  2: "βάρη — 重荷; βαστάζετε — 負い合いなさい; ἀναπληρώσετε — 全うする; νόμος τοῦ Χριστοῦ — キリストの律法."
  3: "δοκεῖ τις εἶναί τι μηδὲν ὤν — 何でもない者が何かであると思う; φρεναπατᾷ ἑαυτόν — 自分を欺いている."
  4: "δοκιμαζέτω — 吟味しなさい; καύχημα — 誇り; εἰς ἑαυτὸν μόνον — 自分自身に対して."
  5: "φορτίον — 荷 (не βάρος 6:2, 重荷); βαστάσει — 負う."
  6: "ὁ κατηχούμενος τὸν λόγον — 御言葉を教えられている者; κοινωνείτω — 分かち合いなさい; ἐν πᾶσιν ἀγαθοῖς — すべての善いもの."
  7: "μὴ πλανᾶσθε — 欺かれてはならない; μυκτηρίζεται — «осмеивается»; 侮られる; ὃ ἐὰν σπείρῃ… θερίαει — 蒔くものは刈り取る."
  8: "φθορά — 滅び; ζωὴ αἰώνιος — 永遠の命; противопоставление плоть/дух сохранено повтором."
  9: "ἐγκακῶμεν — 倦む; μὴ ἐκλυόμενοι — くじけさえしなければ; καιρῷ ἰδίῳ — 時が来れば."
  10: "ἄρα οὖν — だから; ὡς καιρὸν ἔχομεν — 機会があるうちに; τοὺς οἰκείους τῆς πίστεως — 信仰の家族."
  11: "πηλίκοις γράμμασιν — どれほど大きな文字で; ἔγραψα τῇ ἐμῇ χειρί — 自分の手で書いた. Размер букв не сглажен."
  12: "εὐπροσωπῆσαι — «показать себя с хорошей стороны»; 見栄を張る; ἀναγκάζουσιν — 強いる; μόνον ἵνα… μὴ διώκωνται — 迫害されないようにするためだけ."
  13: "οἱ περιτεμνόμενοι — 割礼を受けている者たち; φυλάσσουσιν — 守っている; ἐν τῇ ὑμετέρᾳ σαρκὶ καυχήσωνται — あなたがたの肉を誇る."
  14: "μὴ γένοιτο καυχᾶσθαι — 決して誇りたくない; ἐμοὶ κόσμος ἐσταύρωται κἀγὼ κόσμῳ — 世はわたしに対して、わたしは世に対して十字架につけられた."
  15: "В базе οὔτε γὰρ περιτομή τί ἐστιν οὔτε ἀκροβυστία; церковный текст (слав. «О Христе бо Иисусе ни обрезание что может», jp-joc) добавляет ἐν Χριστῷ Ἰησοῦ — 〔キリスト・イエスにあっては〕. Проверено: ἐν Χριστῷ Ἰησοῦ в стихе — 0. καινὴ κτίσις — 新しい創造; τὸ τί ἐστιν («ничего не значит») передано 何でもなく."
  16: "κανών — 規; στοιχήσουσιν — 従って歩む; Ἰσραὴλ τοῦ θεοῦ — 神のイスラエル, без смягчения."
  17: "В базе τοῦ Ἰησοῦ; церковный текст (слав. «Господа Иисуса», jp-joc) читает κυρίου — 〔主〕. Проверено: κυρίου в стихе — 0. στίγματα — 焼き印 (клеймо раба); τοῦ λοιποῦ — これからは; κόπους παρεχέτω — 煩わせないでほしい."
  18: "πνεῦμα ὑμῶν — あなたがたの霊; ἀμήν — アーメン."
