# jp-box, Послание к Титу, глава 2. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 2: наставления по возрастам и состояниям (1–10), затем ключевое место
# 2:11–14 — явление спасительной благодати, воспитание, блаженное упование
# и самоотдача Христа. 2:15 — итог поручения Титу.
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет.
# 〔…〕 в главе нет: все слова в базе gr-lxx-byz есть (проверено, в т. ч. οἰκουργούς
# в 2:5 — не [οἰκουρούς]).
# Список наставлений 2:2–5, 9–10 висит на λάλει (ст. 1) и παρακάλει (ст. 6):
# по-японски «…ように», без добавления новых глаголов.
# Термины выровнены по 1 Тим: νηφάλιος — 節制 (3:2,11), σεμνός/σεμνότης — 品位 (3:8,11; 2:2),
# οἶνος — ぶどう酒 (3:3,8), διάβολος «клеветник» — 中傷する (3:11), ἐπιεικής — 寛容 (3:3).
# Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

tr_code: jp-box
book: tit
chapter: 2
draft: true

verses:
  1: "しかし、あなたは、健全[けんぜん]な教[きょう]えにふさわしいことを語[かた]りなさい。"
  2: "すなわち、年[とし]を取[と]った男[おとこ]たちは、節制[せっせい]し、品位[ひんい]があり、慎[つつし]み深く、信仰[しんこう]と愛[あい]と忍耐[にんたい]において健全[けんぜん]であるように。"
  3: "同[おな]じく、年[とし]を取[と]った女[おんな]たちは、その振[ふ]る舞[まい]が聖[せい]にふさわしく、中傷[ちゅうしょう]する者[もの]でなく、多[おお]くのぶどう酒[さけ]の奴隷[どれい]とならず、善[よ]いことを教[おし]える者[もの]であるように。"
  4: "そうして、若[わか]い女[おんな]たちに、夫[おっと]を愛[あい]し、子[こ]どもを愛[あい]し、"
  5: "慎[つつし]み深く、純潔[じゅんけつ]で、家[いえ]を守[まも]り、善[よ]い者[もの]で、自分[じぶん]の夫[おっと]に従[したが]う者[もの]となるように教[おし]え導[みちび]く者[もの]であるように。それは、神[かみ]の言葉[ことば]が冒涜[ぼうとく]されないためである。"
  6: "同[おな]じく、若[わか]い男[おとこ]たちにも、慎[つつし]み深くあるように勧[すす]めなさい。"
  7: "すべてのことにおいて、あなた自身[じしん]が善[よ]い行[おこな]いの模範[もはん]となり、教[きょう]えにおいては、朽[く]ちないことと品位[ひんい]を保[たも]ち、"
  8: "非[ひ]の打[う]ちどころのない健全[けんぜん]な言葉[ことば]を用[もち]いなさい。そうすれば、反[はん]対[たい]する者[もの]は、わたしたちについて悪[わる]く言[い]うことが何[なに]もないまま、恥[は]じ入[い]るであろう。"
  9: "奴隷[どれい]たちは、すべてのことにおいて自分[じぶん]の主人[しゅじん]に従[したが]い、喜[よろこ]ばれ、口[くち]ごたえをせず、"
  10: "何[なに]も盗[ぬす]まず、かえってあらゆる点[てん]で善[よ]い忠実[ちゅうじつ]を示[しめ]すように。それは、すべてのことにおいて、わたしたちの救[すく]い主[ぬし]である神[かみ]の教[きょう]えを飾[かざ]るためである。"
  11: "というのは、すべての人[ひと]を救[すく]う神[かみ]の{恵[めぐ]み|恩寵[おんちょう]}が現[あらわ]れたからである。"
  12: "その恵[めぐ]みは、わたしたちに、不[ふ]敬虔[けいけん]と世[よ]の欲[よく]とを捨[す]て去[さ]り、慎[つつし]み深く、正[ただ]しく、敬虔[けいけん]に、今[いま]の世[よ]を生[い]きることを教[おし]え、"
  13: "祝福[しゅくふく]された希望[きぼう]、すなわち、大[おお]いなる神[かみ]、わたしたちの救[すく]い主[ぬし]イエス・キリストの栄光[えいこう]の現[あらわ]れを待[ま]ち望[のぞ]みつつ、"
  14: "この方[かた]は、わたしたちのためにご自身[じしん]をお与[あた]えになった。わたしたちをすべての不[ふ]法[ほう]から贖[あがな]い出[だ]し、ご自身[じしん]のものとなる、善[よ]い行[おこな]いに熱心[ねっしん]な民[たみ]を清[きよ]めるためである。"
  15: "これらのことを語[かた]り、勧[すす]め、あらゆる権威[けんい]をもって戒[いまし]めなさい。だれにも、あなたを軽[かろ]んじさせてはならない。"

notes:
  1: "Σὺ δὲ λάλει — しかし、あなたは…語りなさい (противопоставление лжеучителям гл. 1). ἃ πρέπει τῇ ὑγιαινούσῃ διδασκαλίᾳ — 健全な教えにふさわしいこと (πρέπει — подобает)."
  2: "πρεσβύτας — 年を取った男たち (здесь возраст, а не «пресвитеры»). νηφάλιος — 節制し (трезвый, воздержанный; как в 1 Тим 3:2,11 — 節制する者); σεμνός — 品位があり (σεμνός в 1 Тим 3:8,11 — 品位のある者); σώφρων — 慎み深く; ὑγιαίνοντας τῇ πίστει, τῇ ἀγάπῃ, τῇ ὑπομονῇ — 信仰と愛と忍耐において健全. Три дательных сохранены как три члена."
  3: "πρεσβύτιδας ὡσαύτως — 同じく年を取った女たち. ἐν καταστήματι ἱεροπρεπεῖς — その振る舞いが聖にふさわしく (ἱεροπρεπής — «священно-подобающий»; καταστήμα — поведение, осанка). μὴ διαβόλους — 中傷する者でなく (διάβολος здесь «клеветник», не «дьявол»; как в 1 Тим 3:11). μηδὲ οἴνῳ πολλῷ δεδουλωμένας — 多くのぶどう酒の奴隷とならず (perfect δουλόω — порабощённые; οἶνος — ぶどう酒, как в 1 Тим 3:3,8). καλοδιδάσκαλοι — 善いことを教える者."
  4: "ἵνα σωφρονίζωσιν τὰς νέας — 若い女たちを…教え導く (σωφρονίζω — вразумлять, приводить к целомудрию; ср. σώφρων в ст. 2,5). φιλάνδρους — 夫を愛し (ἁπ. λεγ.); φιλότεκνους — 子どもを愛し (ἁπ. λεγ.)."
  5: "σώφρονας, ἁγνάς — 慎み深く、純潔で; οἰκουργούς — 家を守り (букв. «работающая по дому»; в базе οἰκουργούς, не οἰκουρούς, поэтому 〔…〕 не нужны); ἀγαθάς — 善い者; ὑποτασσομένας τοῖς ἰδίοις ἀνδράσιν — 自分の夫に従う. ἵνα μὴ ὁ λόγος τοῦ θεοῦ βλασφημῆται — 神の言葉が冒涜されないため."
  6: "τοὺς νεωτέρους ὡσαύτως παρακάλει σωφρονεῖν — 若い男たちにも…慎み深くあるように勧めなさい (здесь прямой императив παρακάλει, в отличие от ст. 2–5)."
  7: "περὶ πάντα σεαυτὸν παρεχόμενος τύπον καλῶν ἔργων — すべてのことにおいて、あなた自身が善い行いの模範となり (παρέχω — являть себя). ἐν τῇ διδασκαλίᾳ ἀφθορίαν, σεμνότητα — 教えにおいては、朽ちないことと威厳 (ἀφθορία — нетленность, неповреждённость учения; σεμνότης — 品位, как в 1 Тим 2:2; 3:4). Причастие продолжается в ст. 8, поэтому «…保ち、» без точки."
  8: "λόγον ὑγιῆ ἀκατάγνωστον — 非の打ちどころのない健全な言葉 (ἀκατάγνωστος — не подлежащий осуждению). ὁ ἐξ ἐναντίας — 反対する者. ἐντραπῇ — 恥じ入る (ἐντρέπω — устыжать). μηδὲν ἔχων λέγειν περὶ ἡμῶν φαῦλον — わたしたちについて悪く言うところが何もない."
  9: "δούλους — 奴隷たち. ἰδίοις δεσπόταις ὑποτάσσεσθαι ἐν πᾶσιν — すべてのことにおいて自分の主人に従い (δεσπότης — господин, хозяин). εὐαρέστους εἶναι — 喜ばれ. μὴ ἀντιλέγοντας — 口ごたえをせず."
  10: "μὴ νοσφιζομένους — 何も盗まず (νοσφίζομαι — утаивать, присваивать). πᾶσαν πίστιν ἐνδεικνυμένους ἀγαθήν — あらゆる点で善い忠実を示す (πίστις здесь «верность»). ἵνα τὴν διδασκαλίαν τοῦ σωτῆρος ἡμῶν θεοῦ κοσμῶσιν — 救い主である神の教えを飾るため (κοσμέω — украшать)."
  11: "Ἐπεφάνη γὰρ ἡ χάρις τοῦ θεοῦ σωτήριος πᾶσιν ἀνθρώποις — すべての人を救う神の恵みが現れた (σωτήριος — спасительная; «всех людей» не сужено до «избранных»). Начало ключевого места 2:11–14."
  12: "παιδεύουσα ἡμᾶς — その恵みは…教え (παιδεύω — воспитывать, наставлять, не «наказывать»). ἀρνησάμενοι τὴν ἀσέβειαν καὶ τὰς κοσμικὰς ἐπιθυμίας — 不敬虔と世の欲とを捨て去り. σωφρόνως καὶ δικαίως καὶ εὐσεβῶς — 慎み深く、正しく、敬虔に (три наречия сохранены). ἐν τῷ νῦν αἰῶνι — 今の世を."
  13: "προσδεχόμενοι τὴν μακαρίαν ἐλπίδα — 祝福された希望を待ち望みつつ. ἐπιφάνειαν τῆς δόξης τοῦ μεγάλου θεοῦ καὶ σωτῆρος ἡμῶν Ἰησοῦ Χριστοῦ — 大いなる神、わたしたちの救い主イエス・キリストの栄光の現れ. По-гречески «великого Бога и Спасителя нашего» — один субъект (Христос); двусмысленность не сглажена, 大いなる神 отнесено ко Христу, как в церковном чтении."
  14: "ὃς ἔδωκεν ἑαυτὸν ὑπὲρ ἡμῶν — わたしたちのためにご自身をお与えになった. λυτρώσηται — 贖い出し (λύτρον — выкуп; λυτρόω — выкупать). λαὸν περιούσιον — ご自身のものとなる民 (περιούσιος — «приобретённый, собственный»; ср. Исх 19:5). ζηλωτὴν καλῶν ἔργων — 善い行いに熱心な (ζηλωτής — ревнитель; формула 善い行い в пастырских)."
  15: "Ταῦτα λάλει καὶ παρακάλει καὶ ἔλεγχε — これらのことを語り、勧め、戒め. μετὰ πάσης ἐπιταγῆς — あらゆる権威をもって (ἐπιταγή — повеление, власть повелевать). μηδείς σου περιφρονείτω — だれにも、あなたを軽んじさせてはならない (περιφρονέω — презирать)."
