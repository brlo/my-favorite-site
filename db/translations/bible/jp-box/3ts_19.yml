# jp-box, 3-я Царств, глава 19. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 19: Илия бежит от Иезавели в Вирсавию и пустыню (1–8), на Хориве —
# ветер, землетрясение, огонь и тихий голос (9–14), повеление помазать
# Азаила, Ииуя и Елисея (15–18), призвание Елисея (19–21).
# Нумерация совпадает с csl/ru (19:1–21).
# Речь — 「…」, вложенная — 『…』. Красного нет.
# Паритет: слав. добавления внесены в текст без скобок (5 и 7 «и пей»,
# 8 «Божия», 20 «и матерь мою»), вариант LXX — в notes.
# 〔…〕 нет. Сносок ⟨…⟩ нет: 主, 神, 預言者, 祭壇 уже в корпусе.
# jp-ni не использовался.

