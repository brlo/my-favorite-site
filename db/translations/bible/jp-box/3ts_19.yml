verses:
  1: "アハブは、エリヤが行[おこな]ったすべてのこと、また彼[かれ]が預言者[よげんしゃ]たちを剣[つるぎ]で殺[ころ]したことを、妻[つま]イゼベルに告[つ]げた。"
  2: "イゼベルはエリヤのもとへ使者[ししゃ]を送[おく]って言[い]った。「もしあなたがエリヤで、私[わたし]がイゼベルなら、神々[かみがみ]が私にこうし、さらにこう加[くわ]えるように。明日[あした]のこの時刻[じこく]までに、私[わたし]はあなたの命[いのち]を、あの人々の一人[ひとり]の命のようにする。」"
  3: "エリヤは恐[おそ]れて立[た]ち上[あ]がり、自分[じぶん]の命[いのち]のために逃[に]げた。そしてユダのベエル・シェバに来[き]て、若[わか]い者[もの]をそこに残[のこ]した。"
  4: "彼[かれ]は荒野[こうや]へ一日[いちにち]の道[みち]を進[すす]み、来[き]てエニシダの木[き]の下[した]に座[すわ]った。そして自分[じぶん]が死[し]ぬことを願[ねが]い、言[い]った。「もう十分[じゅうぶん]だ。主[しゅ]よ、今[いま]、私[わたし]から命を取[と]ってください。私[わたし]は父祖[ふそ]たちに勝[まさ]る者[もの]ではないからだ。」"
  5: "彼[かれ]はそこに横[よこ]になって眠[ねむ]った。見[み]ると、主[しゅ]の使[つか]いが彼[かれ]に触[ふ]れて言[い]った。「起[お]きて食[た]べ、飲[の]みなさい。」"
  6: "彼[かれ]が見上[みあ]げると、頭[あたま]のそばに、大麦[おおむぎ]の焼[や]きパンと水[みず]の入[はい]った器[うつわ]があった。彼[かれ]は食[た]べて飲[の]み、また横[よこ]になった。"
  7: "主[しゅ]の使[つか]いは再[ふたた]び戻[もど]って来[き]て彼[かれ]に触[ふ]れ、言[い]った。「起[お]きて食[た]べ、飲[の]みなさい。あなたの道[みち]はまだ遠[とお]いからだ。」"
  8: "彼[かれ]は立[た]って食[た]べ、飲[の]み、その食[た]べ物[もの]の力[ちから]によって四十日[よんじゅうにち]四十夜[よんじゅうや]を歩[ある]き、神[かみ]の山[やま]ホレブに着[つ]いた。"
  9: "彼[かれ]は洞穴[ほらあな]に入[はい]り、そこに宿[やど]った。すると、主[しゅ]の言葉[ことば]が彼[かれ]に臨[のぞ]み、言[い]われた。「エリヤよ、あなたはここで何[なに]をしているのか。」"
  10: "エリヤは言[い]った。「私[わたし]は万軍[ばんぐん]の主[しゅ]なる神[かみ]に熱心[ねっしん]だ。イスラエルの子[こ]らはあなたを捨[す]て、あなたの祭壇[さいだん]を打[う]ち壊[こわ]し、あなたの預言者[よげんしゃ]たちを剣[つるぎ]で殺[ころ]したからだ。私[わたし]だけが残[のこ]り、彼[かれ]らは私[わたし]の命[いのち]さえも取[と]ろうとしている。」"
  11: "主[しゅ]は言[い]われた。「出[で]て、明日[あした]、山[やま]の上[うえ]で主[しゅ]の前[まえ]に立[た]ちなさい。見[み]よ、主[しゅ]が通[とお]り過[す]ぎられる。主[しゅ]の前[まえ]には、山[やま]を裂[さ]き、岩[いわ]を砕[くだ]く大[おお]きく強[つよ]い風[かぜ]が吹[ふ]き荒[あ]れる。しかし、主[しゅ]はその風[かぜ]の中[なか]にはおられない。風[かぜ]の後[あと]に地震[じしん]がある。しかし、主[しゅ]はその地震[じしん]の中[なか]にはおられない。"
  12: "地震[じしん]の後[あと]に火[ひ]があった。しかし、主[しゅ]はその火[ひ]の中[なか]にはおられない。火[ひ]の後[あと]に、静[しず]かな細[ほそ]い声[こえ]があり、そこに主[しゅ]がおられた。」"
  13: "エリヤはそれを聞[き]くと、自分[じぶん]の外套[がいとう]で顔[かお]を覆[おお]い、出[で]て行[い]って洞穴[ほらあな]の入口[いりぐち]に立[た]った。すると、彼[かれ]に声[こえ]があって言[い]った。「エリヤよ、あなたはここで何[なに]をしているのか。」"
  14: "エリヤは言[い]った。「私[わたし]は万軍[ばんぐん]の主[しゅ]なる神[かみ]に熱心[ねっしん]だ。イスラエルの子[こ]らはあなたの契約[けいやく]を捨[す]て、あなたの祭壇[さいだん]を倒[たお]し、あなたの預言者[よげんしゃ]たちを剣[つるぎ]で殺[ころ]したからだ。私[わたし]だけが残[のこ]り、彼[かれ]らは私[わたし]の命[いのち]さえも取[と]ろうとしている。」"
  15: "主[しゅ]は彼[かれ]に言[い]われた。「自分[じぶん]の道[みち]を引[ひ]き返[かえ]し、ダマスコの荒野[こうや]の道[みち]へ進[すす]みなさい。そして、ハザエルに油[あぶら]を注[そそ]いでシリアの王[おう]としなさい。」"
  16: "「また、ニムシの子[こ]イエフに油[あぶら]を注[そそ]いでイスラエルの王[おう]とし、アベル・メホラのシャファトの子[こ]エリシャに油[あぶら]を注[そそ]いで、あなたに代[か]わる預言者[よげんしゃ]としなさい。」"
  17: "そして、ハザエルの剣[つるぎ]から逃[のが]れた者[もの]をイエフが殺[ころ]し、イエフの剣[つるぎ]から逃[のが]れた者[もの]をエリシャが殺[ころ]すであろう。"
  18: "しかし、私[わたし]はイスラエルの中[なか]に七千[しちせん]人[にん]を残[のこ]す。バアルにひざまずかなかったすべてのひざ、またバアルを拝[おが]まなかったすべての口[くち]である。"
  19: "エリヤはそこを立[た]ち去[さ]り、シャファトの子[こ]エリシャを見[み]つけた。彼[かれ]は十二組[じゅうにくみ]の牛[うし]を使って耕[たがや]しており、自分[じぶん]は十二組目[じゅうにくみめ]のそばにいた。エリヤは彼[かれ]のそばを通[とお]り過[す]ぎるとき、自分[じぶん]の外套[がいとう]を彼[かれ]の上[うえ]に投[な]げかけた。"
  20: "エリシャは牛[うし]を残[のこ]してエリヤの後[あと]を追[お]いかけ、言[い]った。「父[ちち]と母[はは]に口[くち]づけさせてください。そうしてから、あなたに従[したが]う。」エリヤは言[い]った。「行[い]って、戻[もど]りなさい。私[わたし]があなたに何[なに]をしたというのか。」"
  21: "エリシャは彼[かれ]の後[あと]から戻[もど]って来[き]て、一対[いっつい]の牛[うし]を取[と]り、それをほふり、牛[うし]の道具[どうぐ]でその肉[にく]を煮[に]て、民[たみ]に与[あた]えた。民は食[た]べた。そして彼[かれ]は立[た]ってエリヤに従[したが]い、彼[かれ]に仕[つか]えた。"

notes:
  1: "ἀνήγγειλεν — возвестил (ἀναγγέλλω). ῥομφαία — меч (в слав. «оружие»). Речь о событиях гл. 18: избиении пророков Ваала; жена Ахава названа «его женой»."
  2: "Εἰ σὺ εἶ Ηλιου καὶ ἐγὼ Ιεζαβελ — «если ты Илия, а я Иезавель»: формула клятвы-самоотождествления (слав. «аще ты еси илиа, аз же иезавель»). τάδε ποιήσαι μοι ὁ θεὸς καὶ τάδε προσθείη — «так да сделают мне боги и так да приложат». ταύτην τὴν ὥραν αὔριον — «в этот час завтра». θήσομαι τὴν ψυχήν σου — «положу душу твою», т. е. сделаю с тобой то же, что с ними."
  3: "ἐφοβήθη — испугался; ἀνέστη — встал. κατὰ τὴν ψυχὴν ἑαυτοῦ — «ради души своей», т. е. спасая жизнь (слав. «души ради своея»). Βηρσαβεε τὴν Ιουδα — Вирсавия Иудина (ベエル・シェバ). παιδάριον — слуга, отрок."
  4: "ραθμ — транслитерация евр. רֹתֶם (дрок, «можжевельник»); слав. «смерчие», передано エニシダ. Ἱκανούσθω νῦν — «довольно теперь». λαβὲ δὴ τὴν ψυχήν μου — «возьми же душу мою». οὐ κρείσσων ἐγώ εἰμι ὑπὲρ τοὺς πατέρας μου — «я не лучше отцов моих»."
  5: "ἐκοιμήθη καὶ ὕπνωσεν — «лёг и уснул» (плеоназм). ὑπὸ φυτόν — под растением (слав. «под садом»). В LXX коснулся «некто» (τις); слав. называет его «ангел Господень» — по паритету в тексте 主の使い. В LXX только φάγε («ешь»), слав. добавляет «и пий» («и пей») — внесено."
  6: "ἐπέβλεψεν — взглянул (ἐπιβλέπω). ἐγκρυφίας ὀλυρίτης — ячменная лепёшка, печённая в золе (ὀλύρα — полба, ячмень). καψάκης — кувшин, сосуд. ἐπιστρέψας — обратившись, снова."
  7: "ἐπέστρεψεν ὁ ἄγγελος κυρίου ἐκ δευτέρου — ангел Господень возвратился во второй раз. Ἀνάστα φάγε — «встань, ешь»; слав. снова добавляет «и пий» — внесено. πολλὴ ἀπὸ σοῦ ἡ ὁδός — «велик от тебя путь», т. е. дорога ещё далека."
  8: "ἐν τῇ ἰσχύι τῆς βρώσεως ἐκείνης — «в крепости пищи той». τεσσαράκοντα ἡμέρας καὶ τεσσαράκοντα νύκτας — сорок дней и ночей. ὄρους Χωρηβ — гора Хорив (ホレブ); слав. добавляет «Божия» — внесено (神の山)."
  9: "σπήλαιον — пещера, 洞穴. κατέλυσεν — остановился, заночевал (καταλύω). ῥῆμα κυρίου — слово Господне. Τί σὺ ἐνταῦθα — «что ты здесь»."
  10: "Ζηλῶν ἐζήλωκα — «ревнуя возревновал» (усиление). τῷ κυρίῳ παντοκράτορι — Господу Вседержителю; передано 万軍の主なる神, как в корпусе. ἐγκατέλιπόν σε — оставили Тебя (в ст. 14 — «завет Твой»). κατέσκαψαν — раскопали, разрушили. ὑπολέλειμμαι ἐγὼ μονώτατος — «остался я один-единственный»."
  11: "Ἐξελεύσῃ αὔριον — «выйдешь завтра». παρελεύσεται κύριος — «пройдёт Господь». πνεῦμα μέγα κραταιόν — великий и сильный ветер. διαλῦον ὄρη — разоряющий, разрывающий горы. συσσεισμός — землетрясение. οὐκ ἐν τῷ πνεύματι κύριος — «не в ветре Господь»."
  12: "φωνὴ αὔρας λεπτῆς — «звук тонкого, нежного веяния», голос тихого ветра; передано 静かな細い声 (ключевое место). κακεῖ κύριος — «и там Господь». Слав. «глас хлада тонка, и тамо Господь»."
  13: "ἐπεκάλυψεν τὸ πρόσωπον — покрыл лицо. μηλωτή — милоть, овчинная накидка, 外套. ὑπὸ τὸ σπήλαιον — у пещеры (слав. «пред вертепом»). φωνὴ πρὸς αὐτόν — голос к нему."
  14: "ἐγκατέλιπον τὴν διαθήκην σου — оставили завет Твой (в ст. 10 — «Тебя»). καθεῖλαν — низвергли (καθαιρέω). Прочее как в ст. 10: повтор ответа — особенность текста."
  15: "Πορεύου ἀνάστρεφε — «иди, возвратись». ὁδὸν ἐρήμου Δαμασκοῦ — путь пустыни Дамаска. χρίσεις — помажешь (χρίω). Αζαηλ — Азаил (ハザエル). βασιλέα τῆς Συρίας — царя Сирии."
  16: "Ιου υἱὸν Ναμεσσι — Ииуй, сын Намессии (イエフ, ニムシ). Ελισαιε υἱὸν Σαφατ — Елисей, сын Сафата (エリシャ, シャファト). ἀπὸ Αβελμαουλα — из Авел-Мехолы (アベル・メホラ). εἰς προφήτην ἀντὶ σοῦ — в пророка вместо тебя."
  17: "τὸν σῳζόμενον ἐκ ῥομφαίας — спасающегося от меча. θανατώσει — умертвит (θανατόω). Троекратное орудие суда: Азаил, Ииуй, Елисей."
  18: "καταλείψεις — оставишь. ἑπτὰ χιλιάδας — семь тысяч. ὤκλασαν γόνυ — преклонили колено (κλάω). πᾶν στόμα, ὃ οὐ προσεκύνησεν — всякие уста, которые не поклонились; слав. «не молишася», в ru «не лобызали» (по МТ). В тексте 拝まなかった по LXX и слав."
  19: "ἠροτρία — пахал (ἀροτριάω). δώδεκα ζεύγη βοῶν — двенадцать пар волов (ζεῦγος — упряжка); αὐτὸς ἐν τοῖς δώδεκα — «сам при двенадцатой». ἐπέρριψε τὴν μηλωτήν — бросил милоть (ἐπιρρίπτω), знак призвания."
  20: "κατέλιπεν τὰς βόας — оставил волов. κατέδραμεν — побежал (κατατρέχω). Καταφιλήσω — «поцелую»; слав. добавляет «и матерь мою» — внесено (母). Ἀνάστρεφε, ὅτι πεποίηκά σοι — «возвратись, ибо сделал я тебе»; понято как «что сделал я тебе?»."
  21: "ἀνέστρεψεν ἐξόπισθεν αὐτοῦ — вернулся от него, т. е. пошёл назад. ἔθυσεν — заколол. ἥψησεν — сварил. ἐν τοῖς σκεύεσι τῶν βοῶν — «в орудиях волов» (плуг, упряжь; слав. «сосудех»). ἐλειτούργει — служил (λειτουργέω)."
