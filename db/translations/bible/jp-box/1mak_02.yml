# jp-box, 1 Маккавейская, глава 2. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz и csl-ru глава 2 имеет 70 стихов (совпадает).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: 1–5 Маттафия, священник из рода Иоарива, и его пять сыновей; 6–14 плач
# о разорённом городе и святилище; 15–22 царские посланники в Модине, исповедание
# Маттафии; 23–26 убийство отступника и царского мужа на жертвеннике, ревность Финееса;
# 27–28 воззвание и бегство в горы; 29–38 избиение пустынников в субботу; 39–41
# решение сражаться и в субботу; 42–48 восстание, собрание Асидеев, очищение пределов;
# 49–70 завещание Маттафии (похвала отцам) и его смерть.
# Голоса: 7–13 — плач Маттафии в 「…」 (7 начинается с «увы мне»); 17–18 — речь
# царских посланников в 「…」; 19–22 — ответ Маттафии в 「…」; 27 — воззвание в 「…」;
# 33–34 — переговоры в 「…」; 37 — слова пустынников в 「…」; 40 — речь друзей в 「…」;
# 41 — решение в 「…」; 49–68 — завещание Маттафии в 「…」 (в 52–60 риторические
# вопросы и примеры отцов внутри той же речи, кавычки не меняются).
# Термины: 律法[りっぽう] — νόμος; 契約[けいやく] — διαθήκη; 礼拝[れいはい]/奉[ほう]仕[し] — λατρεία;
# 燔祭[はんさい] — ὁλοκαύτωμα; 安息日[あんそくび] — σάββατον; 祭壇[さいだん] — θυσιαστήριον/βωμός;
# 聖所[せいしょ] — ἁγίασμα; 神殿[しんでん] — ναός; 祭司[さいし] — ἱερεύς; 大祭司[だいさいし] — ἀρχιερεύς;
# 割礼[かつれい] — περιτομή; 異邦人[いほうじん] — ἔθνη; 嗣業[しぎょう] — κληρονομία; 栄光[えいこう] — δόξα.
#
