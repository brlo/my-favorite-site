verses:
  1: "その日[ひ]々[び]、ヨハネの子[こ]、シメオンの孫[まご]であるマタティアが立[た]った。ヨアリブの子[こ]らの中[なか]の祭司[さいし]で、エルサレムから来[き]てモディンに住[す]んでいた。"
  2: "彼には五[いつ]人[にん]の子[こ]がいた。ガッディと呼[よ]ばれるヨハネ、"
  3: "タッシと呼[よ]ばれるシモン、"
  4: "マッカバイオスと呼[よ]ばれるユダ、"
  5: "アバランと呼[よ]ばれるエレアザル、アプフスと呼[よ]ばれるヨナタンである。"
  6: "彼はユダとエルサレムで起[お]こっている冒瀆[ぼうとく]を見[み]た。"
  7: "そして言[い]った。「ああ、わたしはなぜ、自分[じぶん]の民[たみ]の破[やぶ]れと聖[せい]なる都[みやこ]の破[やぶ]れを見[み]、都[みやこ]が敵[てき]の手[て]に渡[わた]され、聖所[せいしょ]が他[た]の者[もの]の手[て]に渡[わた]されるのに、ここに座[すわ]っているために生[う]まれたのか。"
  8: "都[みやこ]の神殿[しんでん]は、誉[ほま]れのない人[ひと]のようになった。"
  9: "その栄[えい]光[こう]の器[うつわ]は捕[と]らわれて運[はこ]び去[さ]られ、その幼[おさな]い者[もの]たちはその広場[ひろば]で殺[ころ]され、その若者[わかもの]たちは敵[てき]の剣[つるぎ]にかかった。"
  10: "その王国[おうこく]を自分[じぶん]のものとせず、その戦利品[せんりひん]を手[て]に入[い]れなかった民[たみ]が、どこにあるというのか。"
  11: "そのすべての飾[かざ]りは奪[うば]い去[さ]られ、自由[じゆう]な者[もの]から奴隷[どれい]になった。"
  12: "見[み]よ、わたしたちの聖[せい]なるもの、わたしたちの美[うつく]しさ、わたしたちの栄[えい]光[こう]は荒[あ]れ果[は]て、異邦人[いほうじん]がそれらを汚[けが]した。"
  13: "なぜ、わたしたちはまだ生[い]きているのか。」"
  14: "マタティアとその子[こ]らは自分[じぶん]たちの衣[ころも]を引[ひ]き裂[さ]き、粗布[あらぬの]をまとって、ひどく嘆[なげ]いた。"
  15: "王[おう]のもとから来[き]た者[もの]たちが、背[そむ]きを強[し]いるためにモディンの町[まち]へ来[き]て、犠牲[ぎせい]をささげさせようとした。"
  16: "イスラエルから多[おお]くの者[もの]が彼らのもとへ近[ちか]づき、マタティアとその子[こ]らも集[あつ]まった。"
  17: "王[おう]のもとから来[き]た者[もの]たちは答[こた]えてマタティアに言[い]った。「あなたはこの町[まち]の君[きみ]であり、誉[ほま]れある大[おお]きな者[もの]で、子[こ]らと兄弟[きょうだい]たちによって固[かた]く立[た]っている。"
  18: "今[いま]、進[すす]んでまず王[おう]の定[さだ]めを行[おこな]いなさい。すべての異邦人[いほうじん]も、ユダの男[おとこ]たちも、エルサレムに残[のこ]った者[もの]たちもそうした。そうすれば、あなたとあなたの子[こ]らは王[おう]の友[とも]の一人[ひとり]となり、あなたとあなたの子[こ]らは銀[ぎん]と金[きん]、多[おお]くの贈[おく]り物[もの]によって栄[えい]誉[よ]を受[う]けるだろう。」"
  19: "マタティアは答[こた]えて大[おお]きな声[こえ]で言[い]った。「たとえ王[おう]の王国[おうこく]の家[いえ]にいるすべての異邦人[いほうじん]が王[おう]に従[したが]い、それぞれ父[ちち]たちの礼拝[れいはい]から離[はな]れ、王[おう]の戒[いまし]めを喜[よろこ]んで受[う]け入[い]れても、"
  20: "わたしとわたしの子[こ]らとわたしの兄弟[きょうだい]たちは、父[ちち]たちの契約[けいやく]のうちを歩[あゆ]む。"
  21: "律法[りっぽう]と定[さだ]めを捨[す]てることなど、わたしたちには決[けっ]してありえない。"
  22: "わたしたちは王[おう]の言葉[ことば]に従[したが]わない。わたしたちの礼拝[れいはい]から右[みぎ]にも左[ひだり]にも外[はず]れることはない。」"
  23: "彼がこれらの言葉[ことば]を語[かた]り終[お]えると、すべての人の目[め]の前[まえ]で、一[ひと]人[り]のユダヤ人[じん]が進[すす]み出[で]て、王[おう]の定[さだ]めに従[したが]ってモディンの祭壇[さいだん]で犠牲[ぎせい]をささげようとした。"
  24: "マタティアはこれを見[み]て熱[ねっ]心[しん]に燃[も]え、内臓[ないぞう]が震[ふる]えた。彼は裁[さば]きに従[したが]って怒[いか]りを上[あ]げ、駆[か]け寄[よ]ってその者[もの]を祭壇[さいだん]の上[うえ]で刺[さ]し殺[ころ]した。"
  25: "その時[とき]、犠牲[ぎせい]をささげるよう強[し]いていた王[おう]の男[おとこ]も殺[ころ]し、祭壇[さいだん]を打[う]ち壊[こわ]した。"
  26: "彼は律法[りっぽう]に熱[ねっ]心[しん]を燃[も]やした。ちょうど、ピネハスがサロムの子[こ]ジムリにしたとおりである。"
  27: "マタティアは町[まち]の中[なか]で大[おお]きな声[こえ]を上[あ]げて言[い]った。「律法[りっぽう]に熱[ねっ]心[しん]を燃[も]やし、契約[けいやく]を堅[かた]く守[まも]る者[もの]は皆[みな]、わたしの後[あと]に従[したが]って出[で]よ。」"
  28: "彼とその子[こ]らは山[やま]へ逃[に]げ、町[まち]に持[も]っていた物[もの]はすべて捨[す]てた。"
  29: "その時[とき]、義[ぎ]と裁[さば]きを求[もと]める多[おお]くの者[もの]が、そこに住[す]もうとして荒[あ]れ野[の]へ下[くだ]った。"
  30: "そこには彼らもその子[こ]らも、妻[つま]たちも家畜[かちく]もいた。彼らの上[うえ]に災[わざわ]いが増[ふ]えていたからである。"
  31: "王[おう]の男[おとこ]たちと、ダビデの町[まち]エルサレムにいた軍[ぐん]に告[つ]げられた。「王[おう]の命令[めいれい]を破[やぶ]った者[もの]たちが、荒[あ]れ野[の]の隠[かく]れ場[ば]へ下[くだ]った。」"
  32: "多[おお]くの者[もの]が彼らの後[あと]を追[お]って駆[か]け、彼らに追[お]いつくと、その前[まえ]に陣[じん]を敷[し]き、安息日[あんそくび]の日[ひ]に彼らと戦[たたか]いを始[はじ]めた。"
  33: "そして彼らに言[い]った。「今[いま]ならまだ間[ま]に合[あ]う。出[で]て来[き]て王[おう]の言葉[ことば]どおりに行[おこな]え。そうすれば生[い]きる。」"
  34: "彼らは言[い]った。「わたしたちは出[で]て行[い]かず、王[おう]の言葉[ことば]どおりには行[おこな]わない。安息日[あんそくび]の日[ひ]を汚[けが]すことはしない。」"
  35: "彼らは速[すみ]やかに彼らへの戦[たたか]いを進[すす]めた。"
  36: "しかし彼らは答[こた]えず、石[いし]ひとつ投[な]げず、隠[かく]れ場[ば]をふさぎもしなかった。"
  37: "彼らは言[い]った。「わたしたちは皆[みな]、自分[じぶん]の誠実[せいじつ]のうちに死[し]のう。天[てん]と地[ち]が、あなたがたが不当[ふとう]にわたしたちを滅[ほろ]ぼすことの証人[しょうにん]である。」"
  38: "安息日[あんそくび]に彼らは襲[おそ]いかかり、彼らもその妻[つま]たちも子[こ]どもたちも家畜[かちく]も死[し]んだ。千[せん]人[にん]の命[いのち]に及[およ]んだ。"
  39: "マタティアとその友[とも]たちはこれを知[し]って、彼らのためひどく嘆[なげ]いた。"
  40: "そしておのおの隣人[りんじん]に言[い]った。「もしわたしたちが皆[みな]、わたしたちの兄弟[きょうだい]たちがしたようにして、わたしたちの命[いのち]と定[さだ]めのために異邦人[いほうじん]と戦[たたか]わなければ、彼らは今[いま]にもわたしたちを地[ち]から根[ね]こそぎ滅[ほろ]ぼすだろう。」"
  41: "その日[ひ]、彼らは相談[そうだん]して言[い]った。「安息日[あんそくび]の日[ひ]に、だれかがわたしたちに戦[たたか]いを仕掛[しか]けて来[く]るなら、その前[まえ]で戦[たたか]おう。隠[かく]れ場[ば]で死[し]んだ兄弟[きょうだい]たちのように、わたしたちが皆[みな]死[し]ぬことがないために。」"
  42: "その時[とき]、ハシディムの集[あつ]まりが彼らのもとに集[あつ]まった。イスラエルから出[で]た力[ちから]ある者[もの]たち、すなわち律法[りっぽう]に自[みずか]ら進[すす]んで従[したが]うすべての者[もの]である。"
  43: "また、災[わざわ]いから逃[に]げてきた者[もの]たちも皆[みな]、彼らに加[くわ]わり、彼らの支[ささ]えとなった。"
  44: "彼らは軍勢[ぐんぜい]を組織[そしき]し、怒[いか]りをもって罪[つみ]の者[もの]たちを、憤[いきどお]りをもって不法[ふほう]な男[おとこ]たちを打[う]った。残[のこ]った者[もの]たちは救[すく]われるために異邦人[いほうじん]のもとへ逃[に]げた。"
  45: "マタティアとその友[とも]たちは巡[めぐ]り歩[ある]いて祭壇[さいだん]を打[う]ち壊[こわ]し、"
  46: "イスラエルの地[ち]の内[うち]で見[み]つけた無割礼[むかつれい]の少[しょう]年[ねん]たちに、力[ちから]ずくで割礼[かつれい]を施[ほどこ]した。"
  47: "また、高[たか]ぶりの子[こ]らを追[お]い払[はら]い、その手[て]のわざは成功[せいこう]した。"
  48: "彼らは律法[りっぽう]を異邦人[いほうじん]と王[おう]たちの手[て]から守[まも]り、罪[つみ]の者[もの]に角[つの]を上[あ]げさせなかった。"
  49: "マタティアの死[し]ぬ日[ひ]が近[ちか]づくと、彼はその子[こ]らに言[い]った。「今[いま]、高[たか]ぶりと非難[ひなん]が強[つよ]まり、滅[ほろ]びの時[とき]と怒[いか]りの激[はげ]しさが来[き]ている。"
  50: "子[こ]らよ、今[いま]、律法[りっぽう]に熱[ねっ]心[しん]を燃[も]やし、父[ちち]たちの契約[けいやく]のために自分[じぶん]の命[いのち]を差[さ]し出[だ]せ。"
  51: "父[ちち]たちのわざ、彼らがその代[よ]々[よ]に行[おこな]ったことを思[おも]い起[おこ]せ。そうすれば、あなたがたは大[おお]きな栄[えい]光[こう]と永遠[えいえん]の名[な]を受[う]ける。"
  52: "アブラハムは試[し]みの中[なか]で信[しん]実[じつ]な者[もの]と見[み]いだされたではないか。そしてそれが彼の義[ぎ]と認[みと]められた。"
  53: "ヨセフはその苦[くる]しみの時[とき]に戒[いまし]めを守[まも]り、エジプトの主[あるじ]となった。"
  54: "わたしたちの父[ちち]ピネハスは熱[ねっ]心[しん]を燃[も]やしたことで、永遠[えいえん]の祭司[さいし]職[しょく]の契約[けいやく]を受[う]けた。"
  55: "ヨシュアは言葉[ことば]を果[は]たしたことで、イスラエルの裁[さば]き手[て]となった。"
  56: "カレブは集会[しゅうかい]で証[あかし]したことで、地[ち]を嗣業[しぎょう]として受[う]けた。"
  57: "ダビデはその慈[じ]しみによって、世[よ]々[よ]に至[いた]る王国[おうこく]の王座[おうざ]を嗣業[しぎょう]として受[う]けた。"
  58: "エリヤは律法[りっぽう]への熱[ねっ]心[しん]を燃[も]やしたことで、天[てん]へ上[あ]げられた。"
  59: "アナニア、アザリヤ、ミサエルは信[しん]じて、炎[ほのお]から救[すく]われた。"
  60: "ダニエルはその誠実[せいじつ]によって、獅子[しし]の口[くち]から救[すく]い出[だ]された。"
  61: "こうして、代[よ]々[よ]によく考[かんが]えなさい。彼[かれ]に望[のぞ]みを置[お]く者[もの]は、だれひとり力[ちから]を失[うしな]わない。"
  62: "罪[つみ]の者[もの]の言葉[ことば]を恐[おそ]れてはならない。その栄[えい]光[こう]は糞[ふん]となり虫[むし]となるからである。"
  63: "今日[きょう]は高[たか]く上[あ]げられても、明日[あす]には見[み]つからなくなる。彼は土[つち]に戻[もど]り、その計[はかり]ごとは滅[ほろ]びるからである。"
  64: "子[こ]らよ、雄々[おお]しくあれ。律法[りっぽう]によって強[つよ]くあれ。それによってあなたがたは栄[えい]光[こう]を受[う]けるからである。"
  65: "見[み]よ、あなたがたの兄弟[きょうだい]シモン。彼は良[よ]い助言[じょげん]の人[ひと]であるとわたしは知[し]っている。彼の言葉[ことば]をいつも聞[き]け。彼があなたがたの父[ちち]となる。"
  66: "ユダ・マッカバイオスは若[わか]い時[とき]から力[ちから]ある者[もの]である。彼があなたがたの軍[ぐん]の長[おさ]となり、多[おお]くの民[たみ]との戦[たたか]いを戦[たたか]う。"
  67: "あなたがたは、律法[りっぽう]を行[おこな]う者[もの]たちを皆[みな]、自分[じぶん]たちのもとに集[あつ]め、あなたがたの民[たみ]の復讐[ふくしゅう]を果[は]たせ。"
  68: "異邦人[いほうじん]に報[むく]いを返[かえ]し、律法[りっぽう]の定[さだ]めに心[こころ]を留[と]めよ。」"
  69: "そして彼らを祝福[しゅくふく]し、父[ちち]たちのもとに加[くわ]えられた。"
  70: "彼は第[だい]百四十六[ひゃくよんじゅうろく]年[ねん]に死[し]んだ。モディンで父[ちち]たちの墓[はか]に、その子[こ]らによって葬[ほうむ]られた。イスラエルは皆[みな]、彼のために大[おお]きな嘆[なげ]きの歌[うた]を歌[うた]った。"

notes:
  1: "Ματταθιας υἱὸς Ιωαννου τοῦ Συμεων — «Маттафия, сын Иоанна, сына Симеона» (マタティア, ヨハネ, シメオン — по брифу); ἱερεὺς τῶν υἱῶν Ιωαριβ — «священник из сынов Иоарива» (ヨアリブ); ἀπὸ Ιερουσαλημ καὶ ἐκάθισεν ἐν Μωδειν — «из Иерусалима и поселился в Модине» (モディン)."
  2: "Ιωαννης ὁ ἐπικαλούμενος Γαδδι — «Иоанн, прозываемый Гадди» (ガッディ); слав. «гаддис»."
  3: "Σιμων ὁ καλούμενος Θασσι — «Симон, называемый Фасси» (タッシ); слав. «фассис»."
  4: "Ιουδας ὁ καλούμενος Μακκαβαῖος — «Иуда, называемый Маккавей» (ユダ・マッカバイオス). Прозвище стало именем рода; в тексте マッカバイオス, в заголовках マッカバイオス."
  5: "Ελεαζαρ ὁ καλούμενος Αυαραν — «Елеазар, называемый Аваран» (アバラン; слав. «аваран»); Ιωναθης ὁ καλούμενος Απφους — «Ионафан, называемый Апфус» (アプフス; слав. «апфус»)."
  6: "τὰς βλασφημίας τὰς γινομένας — «богохульства происходящие» (βλασφημία — 冒瀆[ぼうとく]); ἐν Ιουδα καὶ ἐν Ιερουσαλημ — «в Иудее и Иерусалиме»."
  7: "Οἴμμοι — «увы мне» (междометие); ἵνα τί τοῦτο ἐγεννήθην — «для чего я на это родился»; τὸ σύντριμμα τοῦ λαοῦ μου — «сокрушение народа моего» (σύντριμμα — 破[やぶ]れ); καθίσαι ἐκεῖ — «сидеть там»; ἐν τῷ δοθῆναι αὐτὴν ἐν χειρὶ ἐχθρῶν — «когда предан был он в руки врагов»; τὸ ἁγίασμα ἐν χειρὶ ἀλλοτρίων — «святилище в руки чужих»."
  8: "ὁ ναὸς αὐτῆς ὡς ἀνὴρ ἄδοξος — «храм его как муж бесславный» (ἄδοξος — 誉[ほま]れのない). Плач продолжается до 13."
  9: "τὰ σκεύη τῆς δόξης — «сосуды славы»; αἰχμάλωτα ἀπήχθη — «в плен отведены»; τὰ νήπια — «младенцы»; ἐν ταῖς πλατείαις — «на улицах» (πλατεῖα — 広場[ひろば]); ἐν ῥομφαίᾳ ἐχθροῦ — «мечом врага» (ῥομφαία — 剣[つるぎ])."
  10: "ποῖον ἔθνος οὐκ ἐκληρονόμησεν βασίλεια — «какой народ не наследовал царства»; τῶν σκύλων αὐτῆς — «добыч его». Риторический вопрос, речь продолжается."
  11: "πᾶς ὁ κόσμος αὐτῆς ἀφῃρέθη — «всё украшение его отнято» (κόσμος здесь — убранство); ἀντὶ ἐλευθέρας ἐγένετο εἰς δούλην — «вместо свободной стала рабой» (δοῦλη — 奴隷[どれい])."
  12: "τὰ ἅγια ἡμῶν — «святыни наши»; ἡ καλλονὴ ἡμῶν — «красота наша» (καλλονή); ἠρημώθη — «опустели»; ἐβεβήλωσαν αὐτὰ τὰ ἔθνη — «осквернили их язычники»."
  13: "ἵνα τί ἡμῖν ἔτι ζωή — «для чего нам ещё жизнь». Здесь плач Маттафии (7–13) закрывается."
  14: "διέρρηξεν… τὰ ἱμάτια — «разодрал одежды» (διαρρήγνυμι); περιεβάλοντο σάκκους — «облеклись во вретища» (σάκκος — 粗布[あらぬの]); ἐπένθησαν σφόδρα — «плакали весьма»."
  15: "οἱ παρὰ τοῦ βασιλέως — «пришедшие от царя»; οἱ καταναγκάζοντες τὴν ἀποστασίαν — «принуждающие к отступничеству» (ἀποστασία); εἰς Μωδειν τὴν πόλιν — «в город Модин»; ἵνα θυσιάσωσιν — «чтобы принести жертвы»."
  16: "πολλοὶ ἀπὸ Ισραηλ πρὸς αὐτοὺς προσῆλθον — «многие из Израиля к ним присоединились» (προσέρχομαι); Ματταθιας καὶ οἱ υἱοὶ αὐτοῦ συνήχθησαν — «Маттафия и сыны его собрались». В ru иначе «устояли» — это масоретское понимание, не внесено."
  17: "Ἄρχων καὶ ἔνδοξος καὶ μέγας εἶ — «начальник и славный и великий ты»; ἐστηρισμένος υἱοῖς καὶ ἀδελφοῖς — «утверждён сынами и братьями» (στηρίζω). Речь посланников — 「…」, продолжается в 18."
  18: "πρόσελθε πρῶτος — «приступи первым»; ποίησον τὸ πρόσταγμα — «исполни повеление»; ὡς ἐποίησαν πάντα τὰ ἔθνη — «как сделали все народы»; τῶν φίλων τοῦ βασιλέως — «из друзей царя» (φίλοι — придворный титул); δοξασθήσεσθε ἀργυρίῳ καὶ χρυσίῳ — «прославитесь серебром и золотом»; ἀποστολαῖς πολλαῖς — «многими посылками (дарами)». Слав. «в дарех мнозех»."
  19: "φωνῇ μεγάλῃ — «голосом великим»; τὰ ἐν οἴκῳ τῆς βασιλείας τοῦ βασιλέως — «сущие в доме царства царя»; ἀκούουσιν αὐτοῦ — «слушают его»; ἀποστῆναι ἕκαστον ἀπὸ λατρείας πατέρων — «отступить каждому от служения отцов»; ᾑρετίσαντο ἐν ταῖς ἐντολαῖς αὐτοῦ — «предпочли (согласились) заповеди его» (αἱρετίζω)."
  20: "κἀγὼ καὶ οἱ υἱοί μου καὶ οἱ ἀδελφοί μου — «и я, и сыны мои, и братья мои»; πορευσόμεθα ἐν διαθήκῃ πατέρων ἡμῶν — «будем ходить в завете отцов наших». Слав. «повинуемся закону отец наших» — иное, но по смыслу; в тексте по LXX 契約[けいやく]のうちを歩[あゆ]む."
  21: "ἵλεως ἡμῖν καταλιπεῖν νόμον — идиома: «милостив будь нам (т. е. не допусти), чтобы оставить закон» (ἵλεως — милостив); слав. «милостив нам (буди, Боже), еже оставити закон». Передано утвердительно: 決[けっ]してありえない."
  22: "τῶν λόγων τοῦ βασιλέως οὐκ ἀκουσόμεθα — «слов царя не послушаем»; παρελθεῖν τὴν λατρείαν ἡμῶν δεξιὰν ἢ ἀριστεράν — «преступить служение наше направо или налево» (παράρχομαι — проходить мимо, преступать). Здесь ответ Маттафии закрывается."
  23: "προσῆλθεν ἀνὴρ Ιουδαῖος ἐν ὀφθαλμοῖς πάντων — «приступил муж Иудеянин пред очами всех»; θυσιάσαι ἐπὶ τοῦ βωμοῦ — «принести жертву на жертвеннике»; κατὰ τὸ πρόσταγμα τοῦ βασιλέως — «по повелению царя». Слав. «в капищи» — βωμός понят как капище."
  24: "ἐζήλωσεν — «возревновал» (ζηλόω); ἐτρόμησαν οἱ νεφροὶ αὐτοῦ — «затрепетали внутренности (почки) его» (νεφρός — 内臓[ないぞう]); ἀνήνεγκεν θυμὸν κατὰ τὸ κρίμα — «поднял (возжёг) ярость по суду (закону)»; δραμὼν ἔσφαξεν — «прибежав, заколол»."
  25: "τὸν ἄνδρα τοῦ βασιλέως τὸν ἀναγκάζοντα θύειν — «мужа царского, принуждавшего приносить жертву»; ἀπέκτεινεν ἐν τῷ καιρῷ ἐκείνῳ — «убил в то время»; τὸν βωμὸν καθεῖλεν — «жертвенник низверг» (καθαιρέω)."
  26: "ἐζήλωσεν τῷ νόμῳ — «возревновал по закону»; καθὼς ἐποίησεν Φινεες τῷ Ζαμβρι υἱῷ Σαλωμ — «как сделал Финеес Замврию, сыну Салома» (Числ 25:7–8; ピネハス, ジムリ)."
  27: "ἀνέκραξεν… φωνῇ μεγάλῃ — «возопил голосом великим»; Πᾶς ὁ ζηλῶν τῷ νόμῳ — «всякий, ревнующий по закону»; ἱστῶν διαθήκην — «стоящий (утверждающий) завет»; ἐξελθέτω ὀπίσω μου — «да выйдет вслед за мной»."
  28: "ἔφυγεν… εἰς τὰ ὄρη — «убежал… в горы»; ἐγκατέλιπον ὅσα εἶχον ἐν τῇ πόλει — «оставили всё, что имели в городе»."
  29: "κατέβησαν πολλοὶ ζητοῦντες δικαιοσύνην καὶ κρίμα — «сошли многие, ищущие правды и суда»; εἰς τὴν ἔρημον καθίσαι ἐκεῖ — «в пустыню, чтобы сидеть (жить) там»."
  30: "αὐτοὶ καὶ οἱ υἱοὶ αὐτῶν — «сами и сыны их»; ὅτι ἐσκληρύνθη ἐπ' αὐτοὺς τὰ κακά — «ибо отяготели на них беды» (σκληρύνω — делать жёстким)."
  31: "ἀνηγγέλη τοῖς ἀνδράσιν τοῦ βασιλέως — «возвещено было мужам царским»; ταῖς δυνάμεσιν — «силам (войску)»; πόλει Δαυιδ — «городе Давидовом»; διεσκέδασαν τὴν ἐντολὴν — «рассеяли (нарушили) заповедь» (διασκεδάζω); εἰς τοὺς κρύφους ἐν τῇ ἐρήμῳ — «в потаённые места в пустыне»."
  32: "ἔδραμον ὀπίσω αὐτῶν — «побежали за ними»; κατελάβοντο — «настигли»; παρενέβαλον ἐπ' αὐτούς — «расположились (встали лагерем) против них» (παρεμβάλλω); συνεστήσαντο… πόλεμον — «составили войну»; ἐν τῇ ἡμέρᾳ τῶν σαββάτων — «в день суббот»."
  33: "Ἕως τοῦ νῦν — «до сих пор (ещё можно)»; ἐξελθόντες ποιήσατε — «выйдя, сделайте»; κατὰ τὸν λόγον τοῦ βασιλέως — «по слову царя»; ζήσεσθε — «будете жить»."
  34: "Οὐκ ἐξελευσόμεθα — «не выйдем»; οὐδὲ ποιήσομεν τὸν λόγον τοῦ βασιλέως — «и не сделаем по слову царя»; βεβηλῶσαι τὴν ἡμέραν τῶν σαββάτων — «осквернить день суббот»."
  35: "ἐτάχυναν ἐπ' αὐτοὺς πόλεμον — «ускорили против них войну» (ταχύνω)."
  36: "οὐκ ἀπεκρίθησαν — «не ответили»; οὐδὲ λίθον ἐνετίναξαν — «и камня не бросили» (ἐντινάσσω); οὐδὲ ἐνέφραξαν τοὺς κρύφους — «и не заградили потаённых мест» (φράσσω)."
  37: "Ἀποθάνωμεν πάντες ἐν τῇ ἁπλότητι ἡμῶν — «умрём все в простоте (невинности) нашей» (ἁπλότης — 誠実[せいじつ]); μαρτυρεῖ ἐφ' ἡμᾶς ὁ οὐρανὸς καὶ ἡ γῆ — «свидетельствуют против нас (за нас) небо и земля»; ἀκρίτως ἀπόλλυτε — «без суда (несправедливо) губите» (ἀκρίτως — 不当[ふとう]に)."
  38: "ἀνέστησαν ἐπ' αὐτοὺς ἐν πολέμῳ — «восстали на них войной»; ἀπέθανον αὐτοὶ καὶ αἱ γυναῖκες… — «умерли сами и жёны…»; ἕως χιλίων ψυχῶν ἀνθρώπων — «до тысячи душ человеческих»."
  39: "ἔγνω Ματταθιας καὶ οἱ φίλοι αὐτοῦ — «узнал Маттафия и друзья его»; ἐπένθησαν ἐπ' αὐτοὺς σφόδρα — «оплакали их весьма»."
  40: "ἀνὴρ τῷ πλησίον αὐτοῦ — «муж ближнему своему»; ἐὰν πάντες ποιήσωμεν ὡς οἱ ἀδελφοὶ ἡμῶν — «если все сделаем, как братья наши»; μὴ πολεμήσωμεν πρὸς τὰ ἔθνη — «не будем воевать с язычниками»; ὑπὲρ τῆς ψυχῆς ἡμῶν καὶ τῶν δικαιωμάτων — «за душу (жизнь) нашу и оправдания наши»; τάχιον ὀλεθρεύσουσιν — «скорее истребят» (ὀλεθρεύω)."
  41: "ἐβουλεύσαντο — «решили (совещались)»; ὃς ἐὰν ἔλθῃ ἐφ' ἡμᾶς εἰς πόλεμον — «кто бы ни пришёл на нас войной»; πολεμήσωμεν κατέναντι αὐτοῦ — «будем воевать против него»; οὐ μὴ ἀποθάνωμεν πάντες — «не умрём все»; ἐν τοῖς κρύφοις — «в потаённых местах»."
  42: "συναγωγὴ Ασιδαίων — «собрание Асидеев» (ハシディム; слав. «сонмище иудейское» — иное чтение); ἰσχυροὶ δυνάμει — «крепкие силою»; πᾶς ὁ ἑκουσιαζόμενος τῷ νόμῳ — «всякий, добровольно преданный закону» (ἑκουσιάζομαι)."
  43: "οἱ φυγαδεύοντες ἀπὸ τῶν κακῶν — «бегущие от бед» (φυγαδεύω); προσετέθησαν αὐτοῖς — «присоединились к ним» (προστίθημι); ἐγένοντο αὐτοῖς εἰς στήριγμα — «стали им в подкрепление» (στήριγμα — 支[ささ]え)."
  44: "συνεστήσαντο δύναμιν — «составили силу (войско)»; ἐπάταξαν ἁμαρτωλοὺς ἐν ὀργῇ — «поразили грешников в гневе»; ἄνδρας ἀνόμους ἐν θυμῷ — «мужей беззаконных в ярости»; οἱ λοιποὶ ἔφυγον εἰς τὰ ἔθνη σωθῆναι — «прочие убежали к язычникам, чтобы спастись»."
  45: "ἐκύκλωσεν — «обошёл кругом» (κυκλόω); καθεῖλον τοὺς βωμούς — «низвергли жертвенники»."
  46: "περιέτεμον τὰ παιδάρια τὰ ἀπερίτμητα — «обрезали детей необрезанных»; ὅσα εὗρον ἐν ὁρίοις Ισραηλ — «сколько нашли в пределах Израиля»; ἐν ἰσχύι — «в силе», т. е. действуя смело и властно; слав. «в силе»."
  47: "ἐδίωξαν τοὺς υἱοὺς τῆς ὑπερηφανίας — «погнали сынов гордыни»; κατευοδώθη τὸ ἔργον ἐν χειρὶ αὐτῶν — «успешно пошло дело в руке их» (κατευοδόω)."
  48: "ἀντελάβοντο τοῦ νόμου — «взялись (встали) за закон» (ἀντιλαμβάνομαι); ἐκ χειρὸς τῶν ἐθνῶν καὶ τῶν βασιλέων — «из руки язычников и царей»; οὐκ ἔδωκαν κέρας τῷ ἁμαρτωλῷ — «не дали рога грешнику», т. е. не дали поднять силу (κέρας — 角[つの])."
  49: "ἤγγισαν αἱ ἡμέραι Ματταθιου ἀποθανεῖν — «приблизились дни Маттафии умереть»; ἐστηρίσθη ὑπερηφανία — «утвердилась гордыня»; ἐλεγμὸς — «обличение (испытание)»; καιρὸς καταστροφῆς — «время низвращения» (καταστροφή — 滅[ほろ]び); ὀργὴ θυμοῦ — «гнев ярости»."
  50: "ζηλώσατε τῷ νόμῳ — «возревнуйте закону»; δότε τὰς ψυχὰς ὑμῶν — «отдайте души ваши»; ὑπὲρ διαθήκης πατέρων ἡμῶν — «за завет отцов наших»."
  51: "μνήσθητε τὰ ἔργα τῶν πατέρων — «вспомните дела отцов»; ἐν ταῖς γενεαῖς αὐτῶν — «в родах их»; δέξασθε δόξαν μεγάλην καὶ ὄνομα αἰώνιον — «примите славу великую и имя вечное»."
  52: "Αβρααμ οὐχὶ ἐν πειρασμῷ εὑρέθη πιστός — «Авраам не в искушении ли найден верным»; ἐλογίσθη αὐτῷ εἰς δικαιοσύνην — «вменилось ему в правду» (Быт 15:6)."
  53: "Ιωσηφ ἐν καιρῷ στενοχωρίας αὐτοῦ — «Иосиф во время тесноты (страдания) своей» (στενοχωρία — 苦[くる]しみ); ἐφύλαξεν ἐντολήν — «сохранил заповедь»; κύριος Αἰγύπτου — «господин Египта»."
  54: "Φινεες ὁ πατὴρ ἡμῶν — «Финеес, отец наш»; ἐν τῷ ζηλῶσαι ζῆλον — «когда возревновал ревностью» (cognatus accusativus); ἔλαβεν διαθήκην ἱερωσύνης αἰωνίας — «принял завет священства вечного» (Числ 25:12–13)."
  55: "Ἰησοῦς ἐν τῷ πληρῶσαι λόγον — «Иисус (Навин) за исполнение слова»; ἐγένετο κριτὴς ἐν Ισραηλ — «был судьёй в Израиле» (ヨシュア)."
  56: "Χαλεβ ἐν τῷ μαρτύρασθαι ἐν τῇ ἐκκλησίᾳ — «Халев за свидетельство в собрании» (Числ 14:6–9; カレブ); ἔλαβεν γῆς κληρονομίαν — «получил землю в наследие»."
  57: "Δαυιδ ἐν τῷ ἐλέει αὐτοῦ — «Давид в милости своей» (ἔλεος); ἐκληρονόμησεν θρόνον βασιλείας εἰς αἰῶνας — «наследовал престол царства навеки»."
  58: "Ηλιας ἐν τῷ ζηλῶσαι ζῆλον νόμου — «Илия, когда возревновал ревностью по законе» (3 Цар 19:10, 14); ἀνελήμφθη εἰς τὸν οὐρανόν — «был взят на небо» (4 Цар 2:11)."
  59: "Ανανιας, Αζαριας, Μισαηλ — Анания, Азария, Мисаил (Дан 3; アナニア, アザリヤ, ミサエル); πιστεύσαντες ἐσώθησαν ἐκ φλογός — «уверовав, спаслись от пламени»."
  60: "Δανιηλ ἐν τῇ ἁπλότητι αὐτοῦ — «Даниил в простоте (невинности) своей»; ἐρρύσθη ἐκ στόματος λεόντων — «избавлен от уст львов» (Дан 6:22)."
  61: "ἐννοήθητε κατὰ γενεὰν καὶ γενεάν — «уразумейте в род и род» (ἐννοέομαι); οἱ ἐλπίζοντες ἐπ' αὐτὸν οὐκ ἀσθενήσουσιν — «надеющиеся на Него не изнемогут»."
  62: "ἀπὸ λόγων ἀνδρὸς ἁμαρτωλοῦ μὴ φοβηθῆτε — «слов мужа грешного не убойтесь»; ἡ δόξα αὐτοῦ εἰς κόπρια καὶ εἰς σκώληκας — «слава его в навоз и в червей» (κόπρια — 糞[ふん]; σκώληξ — 虫[むし])."
  63: "σήμερον ἐπαρθήσεται καὶ αὔριον οὐ μὴ εὑρεθῇ — «сегодня вознесётся, а завтра не найдётся»; ἐπέστρεψεν εἰς τὸν χοῦν αὐτοῦ — «обратился в прах свой»; ὁ διαλογισμὸς αὐτοῦ ἀπολεῖται — «помышление его погибнет»."
  64: "ἀνδρίζεσθε καὶ ἰσχύσατε — «мужайтесь и крепитесь»; ἐν τῷ νόμῳ — «в законе»; ἐν αὐτῷ δοξασθήσεσθε — «в нём прославитесь»."
  65: "Συμεων ὁ ἀδελφὸς ὑμῶν — «Симеон, брат ваш»; ἀνὴρ βουλῆς — «муж совета»; αὐτοῦ ἀκούετε πάσας τὰς ἡμέρας — «его слушайте во все дни»; αὐτὸς ἔσται ὑμῶν πατήρ — «он будет вам отцом»."
  66: "Ιουδας Μακκαβαῖος ἰσχυρὸς δυνάμει — «Иуда Маккавей, крепкий силою»; ἐκ νεότητος αὐτοῦ — «от юности его»; ἄρχων στρατιᾶς — «начальник войска»; πολεμήσει πόλεμον λαῶν — «будет воевать войну народов»."
  67: "προσάξετε πρὸς ὑμᾶς — «привлечёте (соберёте) к себе» (προσάγω); τοὺς ποιητὰς τοῦ νόμου — «исполнителей закона» (ποιητής); ἐκδικῆσαι ἐκδίκησιν τοῦ λαοῦ ὑμῶν — «отмстить отмщение народа вашего» (cognatus)."
  68: "ἀνταπόδοτε ἀνταπόδομα — «воздайте воздаяние» (ἀνταπόδομα — 報[むく]い); προσέχετε εἰς πρόσταγμα τοῦ νόμου — «внимайте повелению закона». В конце стиха в модуле стоит тире — конец завещания."
  69: "εὐλόγησεν αὐτούς — «благословил их»; προσετέθη πρὸς τοὺς πατέρας αὐτοῦ — «приложился к отцам своим», т. е. умер."
  70: "ἐν τῷ ἕκτῳ καὶ τεσσαρακοστῷ καὶ ἑκατοστῷ ἔτει — «в год сто сорок шестой» (146 г.); ἐτάφη ἐν τάφοις πατέρων αὐτοῦ ἐν Μωδειν — «погребён в гробницах отцов своих в Модине»; ἐκόψαντο… κοπετὸν μέγαν — «оплакали… плачем великим» (κόπτομαι — бить себя в грудь, плакать). Слав. «погребоша его сынове его» — добавляет «сыны его», в LXX без уточнения; по паритету внесено (その子[こ]らによって), отмечено."
