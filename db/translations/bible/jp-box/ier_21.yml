# jp-box, Иеремия, глава 21. Черновик для приёмки.
#
# Нумерация — по славянской и Синодальной Библии (масоретский порядок глав):
# так привычнее читателю. В Септуагинте (gr-lxx-byz) эта глава — 21.
# База: Септуагинта; контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# --- прежние заметки (написаны при нумерации по гр.; номера в них — греческие) ---
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc по Иеремии почти отсутствует (гл. 11, 12, 31), в выгрузку не
# входил; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 21: 1–2 посольство Седекии к Иеремии (Пасхор и Софония); 3–7 ответ через
# послов — слово Господа Седекии (мор, меч, плен, «не пощажу»); 8–10 слово к народу:
# «вот, Я предлагаю вам путь жизни и путь смерти»; 11–14 слово к дому царя Иудина
# (суд с утра, пожар в лесу). Нумерация по gr: 14 стихов, совпадает со слав. и ru,
# деление внутри главы то же.
# Голоса: 1 — авторское повествование; 2 — 「…」 (речь послов); 3 — 「…」 речь
# Иеремии с вложенным 『…』 (послание Седекии, 4–7, закрывается в конце 7);
# 8 — рамка вне кавычек, слово Господа 8б–10 в 「…」; 11 — воззвание без кавычек;
# 12–14 — 「…」 слово Господа.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX) по корпусу:
# パスクル (как в 1 Пар 9:12 и гл. 20), ゼパニヤ (как в 4 Цар 25:18 и гл. 36); メルキア, マアセヤ (1 Езд 10:22), ネブカドネツァル,
# カルデア人, セデキヤ, エレミヤ, ダビデ.
# 
tr_code: jp-box
book: ier
chapter: 21
draft: true

verses:
  1: "主[しゅ]からエレミヤに臨[のぞ]んだ言葉[ことば]。それは、ゼデキヤ王[おう]が、メルキアの子[こ]パスクルと、マアセヤの子[こ]である祭司[さいし]ゼパニヤを、彼[かれ]のもとへ遣[つか]わして次[つぎ]のように言[い]わせたときのことである。"
  2: "「わたしたちのために主[しゅ]に尋[たず]ねてください。バビロンの王[おう]ネブカドネツァルがわたしたちに迫[せま]っているからだ。主[しゅ]がご自分[じぶん]のすべてもろもろの奇[くす]しいわざに等[ひと]しく事[こと]をなさり、彼[かれ]がわたしたちから退[しりぞ]いてくれるかどうか。」"
  3: "エレミヤは彼[かれ]らに言[い]った。「ユダの王[おう]ゼデキヤにこう言[い]いなさい。『"
  4: "主[しゅ]はこう言[い]われる。見[み]よ、わたしは、あなたがたが手[て]に持[も]って、城壁[へき]の外[そと]であなたがたを囲[かこ]むカルデア人[じん]およびバビロンの王[おう]と戦[たたか]うために用[もち]いている戦[いくさ]の武器[ぶき]を覆[くつがえ]し、この都[みやこ]の真[ま]ん中[なか]に集[あつ]める。"
  5: "わたしは手[て]を伸[の]べ、強[つよ]い腕[うで]をもって、怒[いか]りと憤[いきどお]りと大[おお]きな激怒[げきど]をもって、あなたがたと戦[たたか]う。"
  6: "わたしはこの都[みやこ]に住[す]むすべての者[もの]、人[ひと]も家畜[かちく]も、大[おお]いなる死[し]をもって打[う]ち、彼[かれ]らは死[し]ぬ。"
  7: "その後[のち]、主[しゅ]はこう言[い]われる。わたしはユダの王[おう]ゼデキヤと、そのしもべたちと、この都[みやこ]に残[のこ]った民[たみ]のうち、死[し]と飢[う]えと剣[つるぎ]から逃[のが]れた者[もの]たちを、バビロンの王[おう]ネブカドネツァルの手[て]に、彼[かれ]らの敵[てき]の手[て]に、すなわち彼らの命[いのち]を求[もと]める者[もの]の手[て]に渡[わた]す。敵[てき]は彼[かれ]らを剣[つるぎ]の刃[やいば]にかけて殺[ころ]す。わたしは彼らを惜[お]しまず、彼らをあわれまない。』」"
  8: "また、この民[たみ]にはこう言[い]いなさい。主[しゅ]はこう言[い]われる。「見[み]よ、わたしはあなたがたの前[まえ]に命[いのち]の道[みち]と死[し]の道[みち]を置[お]いた。"
  9: "この都[みやこ]にとどまる者[もの]は、剣[つるぎ]と飢[う]えと疫病[えきびょう]によって死[し]ぬ。外[そと]に出[で]て、あなたがたを囲[かこ]むカルデア人[じん]のもとへ逃[に]げ込[こ]む者[もの]は生[い]き残[のこ]り、その命[いのち]は獲物[えもの]のようになって、彼[かれ]は生[い]きる。"
  10: "わたしはこの都[みやこ]に、良[よ]いためではなく災[わざわ]いのために、顔[かお]を向[む]けて固[かた]く定[さだ]めたからである、と主[しゅ]は言[い]われる。この都はバビロンの王[おう]の手[て]に渡[わた]され、彼[かれ]はこれを火[ひ]で焼[や]き払[はら]う。」"
  11: "ユダの王[おう]の家[いえ]よ、主[しゅ]の言葉[ことば]を聞[き]け。"
  12: "ダビデの家[いえ]よ、主[しゅ]はこう言[い]われる。「朝[あさ]ごとに裁[さば]きを行[おこな]い、正[ただ]しくせよ。奪[うば]われている者[もの]を、これを虐[しいた]げる者[もの]の手[て]から救[すく]い出[だ]せ。そうしなければ、わたしの怒[いか]りは火[ひ]のように燃[も]え上[あ]がって焼[や]き尽[つ]くし、消[け]す者[もの]がなくなる。それは、あなたがたの悪[わる]い企[くわだ]てのゆえである。"
  13: "見[み]よ、わたしは、谷[たに]の平[ひら]たい地[ち]、岩[いわ]の上[うえ]に住[す]むあなたに立[た]ち向[む]かう、と主[しゅ]は言[い]われる。あなたがたは『だれがわたしたちを攻[せ]め倒[たお]せるのか。だれがわたしたちの住[す]まいに入[はい]って来[こ]られるのか』と言[い]う。"
  14: "わたしはあなたがたの悪[わる]い企[くわだ]てに応[おう]じてあなたがたを罰[ばっ]する、と主[しゅ]は言[い]われる。わたしはその森[もり]に火[ひ]を放[はな]ち、それは周[まわ]りすべてを食[く]い尽[つ]くす。」"

notes:
  1: "Ὁ λόγος ὁ γενόμενος παρὰ κυρίου πρὸς Ιερεμιαν — «слово, бывшее от Господа к Иеремии» (παρά с род. — «от»); слав. «Слово, еже бысть от Господа ко иеремии». ὅτε ἀπέστειλεν — «когда послал»: придаточное времени, по-японски оформлено как «…ときのことである». Πασχωρ υἱὸν Μελχιου — Пасхор, сын Мелхии: パスクル, как в брифе и в гл. 20 (в 1 Пар 9:12 то же греч. имя передано как パスクル — расхождение отмечено). Σοφονιαν υἱὸν Μαασαιου τὸν ἱερέα — Софония, сын Маасеи, священник: ゼパニヤ, как в брифе и в гл. 36 (в 4 Цар 25:18 тот же первосвященник — ゼパニヤ; расхождение отмечено). Μαασαιου — マアセヤ (1 Езд 10:22)."
  2: "Ἐπερώτησον περὶ ἡμῶν τὸν κύριον — «вопроси о нас Господа» (ἐπερωτάω — вопрошать). ἐφέστηκεν ἐφ᾽ ἡμᾶς — «встал на нас, наступил»; слав. «воста на нас». εἰ ποιήσει κύριος κατὰ πάντα τὰ θαυμάσια αὐτοῦ — «сделает ли Господь по всем чудесам Своим»: εἰ в косвенном вопросе, сохранено «…かどうか». Слав. «навуходоносор царь вавилонский» — имя царя есть в слав. (и в МТ), в gr только βασιλεὺς Βαβυλῶνος; по паритету имя внесено в текст без скобок."
  3: "Οὕτως ἐρεῖτε πρὸς Σεδεκιαν — «так скажите Седекии»: речь Иеремии послам, внутри неё вложенное послание царю (『…』). Слав. уже в этом стихе даёт «сия глаголет Господь Бог израилев», но по gr эта формула открывает ст. 4 (Τάδε λέγει κύριος); деление держим по gr."
  4: "μεταστρέφω τὰ ὅπλα τὰ πολεμικά — «обращаю оружия бранные» (μεταστρέφω — поворачивать, обращать); слав. добавляет «яже суть в руках ваших» — нет в gr, внесено без скобок. τοὺς συγκεκλεικότας ὑμᾶς ἔξωθεν τοῦ τείχους — «заключивших вас вне стены», т. е. осаждающих. εἰς τὸ μέσον τῆς πόλεως ταύτης — «в середину города сего»; слав. «и соберу та посреде града сего» добавляет глагол «соберу» (в gr его нет), в тексте сохранены оба оттенка. Слав. «на царя вавилонска» также нет в gr (там только халдеи) — внесено без скобок."
  5: "πολεμήσω ἐγὼ ὑμᾶς — «Я буду воевать против вас» (винитив при πολεμέω). χειρὶ ἐκτεταμένῃ καὶ βραχίονι κραταιῷ — «рукою простёртою и мышцею крепкою»; слав. «поборю аз по вас». Три члена θυμός, ὀργή, παροργισμός переданы тремя словами (怒り・憤り・激怒); слав. сводит к двум («с яростию и гневом великим»)."
  6: "πατάξω — «поражу» (πατάσσω). ἐν θανάτῳ μεγάλῳ — букв. «великою смертью»; слав. «губителством великим», ru «от великой язвы» — понято как мор; оставлено буквально, чтобы не сглаживать. ἄνθρωποι καὶ κτήνη — «люди и скот» (人も家畜も)."
  7: "μετὰ ταῦτα — οὕτως λέγει κύριος — «после того, — так говорит Господь, —»: формула внутри стиха, вынесена в отдельное предложение. ἀπὸ τοῦ θανάτου καὶ ἀπὸ τοῦ λιμοῦ καὶ ἀπὸ τῆς μαχαίρας — «от смерти, голода и меча». εἰς χεῖρας ἐχθρῶν… τῶν ζητούντων τὰς ψυχὰς αὐτῶν — «в руки врагов их, ищущих души их»; слав. добавляет «в руку навуходоносора царя вавилонска» (нет в gr) — внесено без скобок, поэтому три «в руки» сохранены. οὐ φείσομαι… οὐ μὴ οἰκτιρήσω — «не пощажу и не помилую» (φείδομαι, οἰκτιρέω)."
  8: "πρὸς τὸν λαὸν τοῦτον ἐρεῖς — «этому народу скажи»: обращение Господа к Иеремии, рамка вне кавычек. δέδωκα πρὸ προσώπου ὑμῶν — «дал пред лицом вашим» (перфект); слав. «даю». τὴν ὁδὸν τῆς ζωῆς καὶ τὴν ὁδὸν τοῦ θανάτου — «путь жизни и путь смерти»; ключевое место, оба члена сохранены без пояснений."
  9: "ὁ καθήμενος ἐν τῇ πόλει ταύτῃ — «сидящий (остающийся) в городе сем». ἀποθανεῖται ἐν μαχαίρᾳ καὶ ἐν λιμῷ — «умрёт мечом и голодом»; слав. добавляет «и губителством» (мор), внесено без скобок. ὁ ἐκπορευόμενος προσχωρῆσαι πρὸς τοὺς Χαλδαίους — «выходящий, чтобы перейти к халдеям» (προσχωρέω — переходить, сдаваться); слав. «прибежит». ἔσται ἡ ψυχὴ αὐτοῦ εἰς σκῦλα — «душа его будет в добычу» (σκῦλα — добыча); слав. «в плен». Двойное ζήσεται сохранено («и жив будет» — 生き残り…生きる)."
  10: "ἐστήρικα τὸ πρόσωπόν μου ἐπὶ τὴν πόλιν ταύτην — «утвердил лицо Моё на город сей» (στηρίζω — утверждать); слав. «утвердих лице мое». εἰς κακὰ καὶ οὐκ εἰς ἀγαθά — «во зло, а не во благо». Слав. «рече Господь» в середине стиха нет в gr — внесено без скобок («と主は言われる»). κατακαύσει ἐν πυρί — «сожжёт огнём»."
  11: "ὁ οἶκος βασιλέως Ιουδα, ἀκούσατε — обращение к дому царя (собирательно), слав. «доме царя иудина». Воззвание пророка, без кавычек; в ru добавлено «скажи» (МТ), в gr его нет."
  12: "οἶκος Δαυιδ — «дом Давидов» (звательная форма). Κρίνατε τὸ πρωῒ κρίμα — «судите с утра суд», т. е. каждое утро; слав. «судите заутра суд». κατευθύνατε — «направьте, исправьте»; слав. «исправите» без дополнения, поэтому 正しくせよ. ἐξέλεσθε διηρπασμένον ἐκ χειρὸς ἀδικοῦντος — «избавьте ограбленного из руки обижающего». ὅπως μὴ ἀναφθῇ ὡς πῦρ ἡ ὀργή μου — «чтобы не возгорелась, как огонь, ярость Моя». Слав. в конце добавляет «ради лукавых умышлений ваших» — нет в gr, внесено без скобок."
  13: "κοιλάδα Σορ τὴν πεδινήν — «долину Сор, равнинную»: Σορ передаёт евр. צור «скала»; слав. «во крепце и польне удолии» понял как «крепость». В тексте 谷の平たい地、岩の上に住む者 — по смыслу обоих. τοὺς λέγοντας — мн. ч. при ед. обращении («житель… которые говорят»): смена числа сохранена. Слав. «рече Господь» нет в gr — внесено как と主は言われる."
  14: "δρυμός — «лес, чаща»; αὐτῆς — ж. р. (город, дочь). Слав. в начале стиха добавляет «И посещу на вас по лукавым начинанием вашым, рече Господь» — нет в gr (это чтение МТ), внесено без скобок. ἔδεται πάντα τὰ κύκλῳ αὐτῆς — «пожрёт всё вокруг неё»."
