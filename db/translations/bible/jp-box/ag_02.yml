verses:
  1: "第六[だいろく]の月[つき]の二十四日[にじゅうよっか]、ダリウス王[おう]の第二年[だいにねん]であった。"
  2: "第七[だいしち]の月[つき]の二十一日[にじゅういちにち]に、主[しゅ]の言葉[ことば]が預言者[よげんしゃ]ハガイの手[て]によって臨[のぞ]んで言[い]った。"
  3: "「ユダの部族[ぶぞく]のサラティエルの子[こ]ゼルバベル、大祭司[だいさいし]ヨセデクの子[こ]イエシュア、および民[たみ]の残[のこ]りすべてに告[つ]げよ。"
  4: "あなたがたのうち、この家[いえ]が以前[いぜん]の栄光[えいこう]のうちにあったのを見[み]た者[もの]がだれかいるか。今[いま]、あなたがたはそれをどう見[み]ているのか。あなたがたの目[め]には、それが何[なに]もないもののように見[み]えないのか。"
  5: "しかし今[いま]、ゼルバベルよ、強[つよ]くあれ、と主[しゅ]は言[い]われる。大祭司[だいさいし]ヨセデクの子[こ]イエシュアよ、強[つよ]くあれ。この地[ち]の民[たみ]もすべて、強[つよ]くあれ、と主[しゅ]は言[い]われる。そして仕事[しごと]をせよ。わたしはあなたがたと共[とも]にいる、と万軍[ばんぐん]の主[しゅ]は言[い]われる。"
  6: "あなたがたがエジプトの地[ち]から出[で]たとき、わたしがあなたがたと結[むす]んだ言葉[ことば]がある。わたしの霊[れい]はあなたがたの間[あいだ]に立[た]っている。恐[おそ]れるな。万軍[ばんぐん]の主[しゅ]はこう言[い]われる。"
  7: "もう一度[いちど]、わたしは天[てん]と地[ち]、海[うみ]と乾[かわ]いた地[ち]を揺[ゆ]り動[うご]かす。"
  8: "そして、すべての国民[こくみん]を揺[ゆ]り動[うご]かす。すべての国民[こくみん]の選[えら]ばれた物[もの]が来[き]て、わたしはこの家[いえ]を栄光[えいこう]で満[み]たす、と万軍[ばんぐん]の主[しゅ]は言[い]われる。"
  9: "銀[ぎん]はわたしのもの、金[きん]もわたしのものである、と万軍[ばんぐん]の主[しゅ]は言[い]われる。"
  10: "この家[いえ]の最後[さいご]の栄光[えいこう]は、前[まえ]の栄光[えいこう]よりも大[おお]きくなる、と万軍[ばんぐん]の主[しゅ]は言[い]われる。この場所[ばしょ]でわたしは平和[へいわ]を与[あた]える、と万軍[ばんぐん]の主[しゅ]は言[い]われる。すなわち、この神殿[しんでん]を建[た]て起[お]こすすべての者[もの]に、魂[たましい]の平和[へいわ]を所有[しょゆう]として与[あた]える」。"
  11: "第九[だいきゅう]の月[つき]の二十四日[にじゅうよっか]、ダリウス王[おう]の第二年[だいにねん]に、主[しゅ]の言葉[ことば]が預言者[よげんしゃ]ハガイに臨[のぞ]んで言[い]った。"
  12: "「万軍[ばんぐん]の主[しゅ]はこう言[い]われる。祭司[さいし]たちに律法[りっぽう]について問[と]え」。"
  13: "「人[ひと]が衣[ころも]の裾[すそ]に聖[せい]なる肉[にく]を包[つつ]み、その裾[すそ]がパン、煮物[にもの]、ぶどう酒[しゅ]、油[あぶら]、そのほかどんな食物[しょくもつ]に触[ふ]れたなら、それは聖[せい]になるか」。祭司[さいし]たちは答[こた]えて言[い]った。「ならない」。"
  14: "ハガイは言[い]った。「死[し]んだ者[もの]に触[ふ]れて汚[けが]れた者[もの]が、これらのどれかに触[ふ]れたなら、それは汚[けが]れるか」。祭司[さいし]たちは答[こた]えて言[い]った。「汚[けが]れる」。"
  15: "ハガイは答[こた]えて言[い]った。「この民[たみ]も、この国民[こくみん]も、わたしの前[まえ]ではそのとおりであり、彼らの手[て]のわざもすべてそのとおりである、と主[しゅ]は言[い]われる。彼らがそこでささげる物[もの]は汚[けが]れている。彼らの朝[あさ]のささげ物[もの]のゆえに、そこに近[ちか]づく者[もの]は汚[けが]れる。彼らは自分[じぶん]の悪[わる]いわざのゆえに苦[くる]しむ。あなたがたは門[もん]で戒[いまし]める者[もの]を憎[にく]んだ。"
  16: "今[いま]、あなたがたの心[こころ]を、この日[ひ]から前[まえ]に、すなわち主[しゅ]の神殿[しんでん]に石[いし]を石[いし]の上[うえ]に置[お]く前[まえ]に、よく思[おも]い返[かえ]せ。"
  17: "あなたがたはどうであったか。二十[にじゅう]サタの麦[むぎ]を袋[ふくろ]に入[い]れても、十[じゅう]サタになった。五十[ごじゅう]升[ます]を汲[く]み出[だ]そうと踏[ふ]み場[ば]の下[した]の溜[た]め桝[ます]に入[はい]っても、二十[にじゅう]升[ます]になった。"
  18: "わたしはあなたがたを、不作[ふさく]と、風枯[かぜが]れと、雹[ひょう]とで打[う]った。あなたがたの手[て]のわざはすべて打[う]たれた。それでも、あなたがたはわたしに帰[かえ]らなかった、と主[しゅ]は言[い]われる。"
  19: "この日[ひ]から後[のち]、すなわち第九[だいきゅう]の月[つき]の二十四日[にじゅうよっか]、主[しゅ]の神殿[しんでん]の基[もとい]が据[す]えられた日[ひ]から後[のち]、あなたがたの心[こころ]に思[おも]い巡[めぐ]らせよ。"
  20: "まだ打[う]ち場[ば]に何[なに]か見[み]られるか。ぶどうの木[き]、いちじくの木[き]、りんごの木[き]、実[み]を結[むす]ばないオリーブの木[き]が、まだあるか。この日[ひ]から、わたしはあなたがたを祝福[しゅくふく]する」。"
  21: "その月[つき]の二十四日[にじゅうよっか]に、主[しゅ]の言葉[ことば]が再[ふたた]び預言者[よげんしゃ]ハガイに臨[のぞ]んで言[い]った。"
  22: "「ユダの部族[ぶぞく]のサラティエルの子[こ]ゼルバベルに告[つ]げよ。わたしは天[てん]と地[ち]、海[うみ]と乾[かわ]いた地[ち]を揺[ゆ]り動[うご]かす。"
  23: "わたしは王[おう]たちの王座[おうざ]を覆[くつがえ]し、異邦[いほう]の国々[くにぐに]の王[おう]たちの力[ちから]を滅[ほろ]ぼす。わたしは戦車[せんしゃ]とそれに乗[の]る者[もの]を覆[くつがえ]す。馬[うま]と騎手[きしゅ]は倒[たお]れ、それぞれ自分[じぶん]の兄弟[きょうだい]の剣[つるぎ]によって倒[たお]れる。"
  24: "その日[ひ]、万軍[ばんぐん]の主[しゅ]は言[い]われる、わたしはあなたを取[と]る、サラティエルの子[こ]ゼルバベル、わたしのしもべよ、と主[しゅ]は言[い]われる。わたしはあなたを印章[いんしょう]のようにする。わたしがあなたを選[えら]んだからである、と万軍[ばんぐん]の主[しゅ]は言[い]われる」。"

notes:
  1: "Карта: слав. 2:1 = gr 1:15. Τετράδι καὶ εἰκάδι τοῦ μηνὸς τοῦ ἕκτου τῷ δευτέρῳ ἔτει ἐπὶ Δαρείου τοῦ βασιλέως — «в двадцать четвёртый день шестого месяца, во второй год при Дарии царе». В gr-lxx-byz и ru это 1:15, и дата завершает предложение 1:14 («делали работы в доме Господа… в двадцать четвёртый день…»); слав. ставит её отдельным стихом в начале 2-й главы. Далее слав. 2:N соответствует gr 2:(N−1); в 2:6 слав. соединяет gr 2:5 с началом gr 2:6 (см. notes 2:6)."
  2: "Слав. 2:2 = gr 2:1: Τῷ ἑβδόμῳ μηνὶ μιᾷ καὶ εἰκάδι τοῦ μηνός — «в седьмой месяц, в двадцать первый день месяца»; ἐλάλησεν κύριος ἐν χειρὶ Αγγαιου τοῦ προφήτου λέγων — «сказал Господь рукою Аггея пророка, говоря». Слав. «в седмый месяц, в двадесять первый месяца, глагола Господь рукою аггеа пророка»."
  3: "Слав. 2:3 = gr 2:2: Εἰπὸν δὴ πρὸς Ζοροβαβελ… καὶ πρὸς Ἰησοῦν… καὶ πρὸς πάντας τοὺς καταλοίπους τοῦ λαοῦ λέγων — «скажи Зоровавелю… и Иисусу… и всем остаткам народа, говоря». Это продолжение повеления 2:2, а не отдельная речь."
  4: "Слав. 2:4 = gr 2:3: Τίς ἐξ ὑμῶν ὃς εἶδεν τὸν οἶκον τοῦτον ἐν τῇ δόξῃ αὐτοῦ τῇ ἔμπροσθεν — «кто из вас видел дом сей в славе его прежней»; πῶς ὑμεῖς βλέπετε αὐτὸν νῦν — «как вы видите его ныне»; καθὼς οὐχ ὑπάρχοντα ἐνώπιον ὑμῶν — «как не существующий перед вами» (ὑπάρχω — быть в наличии)."
  5: "Слав. 2:5 = gr 2:4: κατίσχυε, Ζοροβαβελ… κατίσχυε, Ἰησοῦ… καὶ κατισχυέτω πᾶς ὁ λαὸς τῆς γῆς — «укрепляйся, Зоровавель… укрепляйся, Иисус… и да укрепляется весь народ земли» (κατισχύω — укрепляться, одолевать; слав. «укрепляйся»); καὶ ποιεῖτε — «и делайте»; διότι μεθ᾽ ὑμῶν ἐγώ εἰμι — «ибо Я с вами»."
  6: "Слав. 2:6 = gr 2:5 + начало gr 2:6. καὶ τὸ πνεῦμά μου ἐφέστηκεν ἐν μέσῳ ὑμῶν — «и Дух Мой стоит среди вас» (ἐφίστημι); θαρσεῖτε — «дерзайте». Слав. добавляет в начале «слово, еже завещах с вами, егда исходисте из земли египетския» — этого нет в LXX (ср. МТ: завет при исходе), внесено в основной текст без 〔…〕 по паритету (церковное чтение). Формула «зане сице глаголет Господь вседержитель» (διότι τάδε λέγει κύριος παντοκράτωρ) в слав. отнесена к концу этого стиха, а содержание gr 2:6 — к 2:7."
  7: "Слав. 2:7 = gr 2:6: Ἔτι ἅπαξ ἐγὼ σείσω τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ τὴν ξηράν — «ещё однажды Я потрясу небо и землю, море и сушу» (σείω — трясти; ἅπαξ — однажды)."
  8: "Слав. 2:8 = gr 2:7: καὶ συσσείσω πάντα τὰ ἔθνη — «и потрясу все народы»; ἥξει τὰ ἐκλεκτὰ πάντων τῶν ἐθνῶν — «придёт избранное всех народов» (ἐκλεκτός — избранный; слав. «избранная всех языков»); καὶ πλήσω τὸν οἶκον τοῦτον δόξης — «и наполню дом сей славою»."
  9: "Слав. 2:9 = gr 2:8: ἐμὸν τὸ ἀργύριον καὶ ἐμὸν τὸ χρυσίον — «Моё серебро и Моё золото»; λέγει κύριος παντοκράτωρ — «говорит Господь Вседержитель»."
  10: "Слав. 2:10 = gr 2:9: μεγάλη ἔσται ἡ δόξα τοῦ οἴκου τούτου ἡ ἐσχάτη ὑπὲρ τὴν πρώτην — «велика будет слава дома сего последняя больше первой»; δώσω εἰρήνην — «дам мир»; εἰρήνην ψυχῆς εἰς περιποίησιν παντὶ τῷ κτίζοντι τοῦ ἀναστῆσαι τὸν ναὸν τοῦτον — «мир души в приобретение всякому созидающему, чтобы воздвигнуть храм сей» (περιποίησις — приобретение, собственность; тёмное место, передано «所有として»). Здесь слово Господа 2:3–10 закрывается."
  11: "Слав. 2:11 = gr 2:10: Τετράδι καὶ εἰκάδι τοῦ ἐνάτου μηνὸς ἔτους δευτέρου ἐπὶ Δαρείου — «в двадцать четвёртый день девятого месяца, во второй год при Дарии»; ἐγένετο λόγος κυρίου πρὸς Αγγαιον τὸν προφήτην — «было слово Господне к Аггею пророку»."
  12: "Слав. 2:12 = gr 2:11: Τάδε λέγει κύριος παντοκράτωρ Ἐπερώτησον τοὺς ἱερεῖς νόμον λέγων — «так говорит Господь Вседержитель: спроси священников о законе, говоря». Вопрос 2:13 — содержание этого повеления."
  13: "Слав. 2:13 = gr 2:12: Ἐὰν λάβῃ ἄνθρωπος κρέας ἅγιον ἐν τῷ ἄκρῳ τοῦ ἱματίου αὐτοῦ — «если возьмёт человек мясо святое в краю одежды своей» (κρέας — мясо; ἄκρον — край, пола); ἅψηται… ἄρτου ἢ ἑψέματος ἢ οἴνου ἢ ἐλαίου ἢ παντὸς βρώματος — «коснётся хлеба, или варёного, или вина, или елея, или всякой пищи» (ἕψημα — варёное); εἰ ἁγιασθήσεται — «освятится ли»; ответ священников Οὔ — «нет»."
  14: "Слав. 2:14 = gr 2:13: Ἐὰν ἅψηται μεμιαμμένος ἐπὶ ψυχῇ ἀπὸ παντὸς τούτων — «если коснётся осквернённый о душе (о мертвеце) из всего этого» (μιαίνω — осквернять; ἐπὶ ψυχῇ — при мёртвом теле); εἰ μιανθήσεται — «осквернится ли»; ответ Μιανθήσεται — «осквернится». Слав. «аще прикоснется оскверненый или нечистый душею»."
  15: "Слав. 2:15 = gr 2:14: Οὕτως ὁ λαὸς οὗτος καὶ οὕτως τὸ ἔθνος τοῦτο ἐνώπιον ἐμοῦ — «таков народ сей и таково племя сие предо Мною»; πάντα τὰ ἔργα τῶν χειρῶν αὐτῶν — «все дела рук их»; ὃς ἐὰν ἐγγίσῃ ἐκεῖ, μιανθήσεται ἕνεκεν τῶν λημμάτων αὐτῶν τῶν ὀρθρινῶν — «кто приблизится туда, осквернится ради утренних приношений их» (λῆμμα — приношение, дар); ὀδυνηθήσονται ἀπὸ προσώπου πόνων αὐτῶν — «будут болеть от лица (из-за) трудов своих»; ἐμισεῖτε ἐν πύλαις ἐλέγχοντας — «вы ненавидели обличающих в воротах». Здесь начинается ответ Аггея; он продолжается до 2:20."
  16: "Слав. 2:16 = gr 2:15: θέσθε δὴ εἰς τὰς καρδίας ὑμῶν ἀπὸ τῆς ἡμέρας ταύτης καὶ ὑπεράνω — «положите на сердца ваши от дня сего и выше (назад)»; πρὸ τοῦ θεῖναι λίθον ἐπὶ λίθον ἐν τῷ ναῷ κυρίου — «прежде чем положен камень на камень в храме Господнем». ναός — храм (神殿), ср. οἶκος — дом."
  17: "Слав. 2:17 = gr 2:16: τίνες ἦτε — «каковы вы были (как было)»; ἐνεβάλλετε εἰς κυψέλην κριθῆς εἴκοσι σάτα, καὶ ἐγένετο κριθῆς δέκα σάτα — «вы бросали в мешок ячменя двадцать сат, и стало ячменя десять сат» (κυψέλη — ящик, мешок; σάτον — сата, мера); εἰσεπορεύεσθε εἰς τὸ ὑπολήνιον ἐξαντλῆσαι πεντήκοντα μετρητάς, καὶ ἐγένοντο εἴκοσι — «входили в подточилие (нижний чан) черпать пятьдесят мер, и стало двадцать» (ὑπολήνιον — чан под точилом; μετρητής — мера). Сата и метретес оставлены как サタ / 升."
  18: "Слав. 2:18 = gr 2:17: ἐπάταξα ὑμᾶς ἐν ἀφορίᾳ καὶ ἐν ἀνεμοφθορία καὶ ἐν χαλάζῃ — «Я поразил вас неплодием, ветротлением и градом» (ἀφορία — бесплодие, неурожай; ἀνεμοφθορία — повреждение ветром; χάλαζα — град); πάντα τὰ ἔργα τῶν χειρῶν ὑμῶν — «все дела рук ваших»; οὐκ ἐπεστρέψατε πρός με — «вы не обратились ко Мне»."
  19: "Слав. 2:19 = gr 2:18: ὑποτάξατε δὴ τὰς καρδίας ὑμῶν ἀπὸ τῆς ἡμέρας ταύτης καὶ ἐπέκεινα — «положите сердца ваши от дня сего и далее» (ὑποτάσσω — подчинять, располагать); ἀπὸ τῆς τετράδος καὶ εἰκάδος τοῦ ἐνάτου μηνός — «от двадцать четвёртого дня девятого месяца»; ἧς ἐθεμελιώθη ὁ ναὸς κυρίου — «когда основан храм Господень» (θεμελιόω — полагать основание); θέσθε ἐν ταῖς καρδίαις ὑμῶν — «положите в сердцах ваших» (в синтаксисе продолжается вопросом 2:20)."
  20: "Слав. 2:20 = gr 2:19: εἰ ἔτι ἐπιγνωσθήσεται ἐπὶ τῆς ἅλω — «узнается ли ещё на гумне» (ἅλων — гумно, ток); εἰ ἔτι ἡ ἄμπελος καὶ ἡ συκῆ καὶ ἡ ῥόα καὶ τὰ ξύλα τῆς ἐλαίας τὰ οὐ φέροντα καρπόν — «есть ли ещё виноград, смоковница, гранат и масличные деревья, не приносящие плода» (ῥόα — гранат; слав. «яблонь» — яблоня, в тексте りんごの木[き] по csl); ἀπὸ τῆς ἡμέρας ταύτης εὐλογήσω — «от дня сего благословлю». Здесь слово 2:15–20 закрывается."
  21: "Слав. 2:21 = gr 2:20: Καὶ ἐγένετο λόγος κυρίου ἐκ δευτέρου πρὸς Αγγαιον τὸν προφήτην τετράδι καὶ εἰκάδι τοῦ μηνός — «и было слово Господне во второй раз к Аггею пророку в двадцать четвёртый день месяца»; месяц не назван (тот же девятый)."
  22: "Слав. 2:22 = gr 2:21: Εἰπὸν πρὸς Ζοροβαβελ… Ἐγὼ σείω τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ τὴν ξηράν — «скажи Зоровавелю…: Я потрясаю небо и землю, море и сушу»."
  23: "Слав. 2:23 = gr 2:22: καταστρέψω θρόνους βασιλέων — «ниспровергну престолы царей»; ὀλεθρεύσω δύναμιν βασιλέων τῶν ἐθνῶν — «истреблю силу царей языческих»; καταστρέψω ἅρματα καὶ ἀναβάτας — «ниспровергну колесницы и всадников»; ἕκαστος ἐν ῥομφαίᾳ πρὸς τὸν ἀδελφὸν αὐτοῦ — «каждый мечом против брата своего»."
  24: "Слав. 2:24 = gr 2:23: ἐν τῇ ἡμέρᾳ ἐκείνῃ… λήμψομαί σε, Ζοροβαβελ… τὸν δοῦλόν μου — «в тот день… возьму тебя, Зоровавель… раба Моего»; θήσομαί σε ὡς σφραγῖδα — «положу тебя как печать» (σφραγίς — печать, перстень-печатка); διότι σὲ ᾑρέτισα — «ибо Я избрал тебя». Здесь слово Господа закрывается; последний стих книги."
