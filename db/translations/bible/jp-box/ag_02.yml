# jp-box, Аггей, глава 2. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной (csl-ru): в этой главе 24 стиха; в gr-lxx-byz
# и ru — 23. Карта границ: слав. 2:1 = gr 1:15 (дата 24-го дня 6-го месяца; в gr/ru
# это конец 1-й главы, и дата завершает предложение 1:14); слав. 2:2–2:24 = gr 2:1–2:23,
# то есть слав. 2:N соответствует gr 2:(N−1) при N ≥ 2 (в 2:6 слав. соединяет
# gr 2:5 с началом gr 2:6, см. notes). Всего в книге 38 стихов (14 + 24).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1 дата; 2–3 слово в 7-й месяц: сказать Зоровавелю, Иисусу и остатку;
# 4 кто видел дом в прежней славе; 5–6 «укрепись… Я с вами», завет при исходе из Египта;
# 7–10 ещё раз потрясу небо и землю, придёт избранное народов, слава сего дома больше
# прежней, мир; 11–15 дата 9-го месяца и вопрос о святом и нечистом; 16–20 «положите
# на сердца», бесплодие до сего дня, «от сего дня благословлю»; 21–24 второе слово
# в тот же день: потрясение царств, Зоровавель как печать.
# Голоса: 1 — повествование (дата); 2 — формула; 3–10 — 「…» (в 5 и 10 «говорит
# Господь» внутри); 11 — повествование (дата); 12 — 「…» (повеление спросить);
# 13, 14 — вопрос пророка и ответ священников в 「…»; 15–20 — 「…» (ответ Аггея,
# внутри «говорит Господь»); 21 — повествование; 22–24 — 「…».
# 2:6: слав. «слово, еже завещах с вами…» — добавление, которого нет в LXX (ср. МТ),
# внесено в основной текст без 〔…〕.
# 2:10: «мир души в снабдение» — тёмное место LXX (εἰρήνην ψυχῆς εἰς περιποίησιν),
# передано «魂の平和を所有として».
#
