verses:
  1: "フィロパトルは、自分[じぶん]の支配[しはい]していた地方[ちほう]がアンティオコスによって奪[うば]われたことを、もとへ帰[かえ]って来[き]た者[もの]たちから聞[き]くと、歩兵[ほへい]と騎兵[きへい]の全軍[ぜんぐん]に命令[めいれい]を下[くだ]し、妹[いもうと]のアルシノエを伴[ともな]って、アンティオコスの軍[ぐん]が陣[じん]を敷[し]いていたラフィアの地方[ちほう]まで進[すす]んだ。"
  2: "そのとき、テオドトスという者[もの]がその企[くわだ]てを果[は]たそうと思[おも]い、プトレマイオスから託[たく]されていた軍勢[ぐんぜい]のうち最[もっと]も優[すぐ]れた者[もの]たちを連[つ]れて、夜[よる]のうちにプトレマイオスの天幕[てんまく]に忍[しの]び込[こ]み、ひとりで彼[かれ]を殺[ころ]し、それによって戦[いくさ]を終[お]わらせようとした。"
  3: "しかし、ドリミロスの子[こ]と言[い]われるドシテオスが彼[かれ]を連[つ]れ去[さ]った。彼[かれ]はユダヤ人[じん]でありながら、のちに律法[りっぽう]を変[か]え、父祖[ふそ]の教[おし]えから遠[とお]ざかっていた。ドシテオスは天幕[てんまく]の中[なか]に、名[な]も知[し]れぬ一人[ひとり]の者[もの]を寝[ね]かせた。その者[もの]が、彼[かれ]の受[う]けるはずだった罰[ばつ]を受[う]けることになったのである。"
  4: "激[はげ]しい戦[たたか]いが起[お]こり、形勢[けいせい]がアンティオコスに有利[ゆうり]になると、アルシノエは髪[かみ]を解[と]き、涙[なみだ]を流[なが]しながら兵[へい]たちの間[あいだ]を巡[めぐ]り、自分[じぶん]たちと子[こ]ども、妻[つま]のために勇敢[ゆうかん]に戦[たたか]うよう強[し]く促[うなが]し、勝[か]った者[もの]には一人[ひとり]につき金[きん]二[に]ムナを与[あた]えると約束[やくそく]した。"
  5: "こうして相手側[あいてがわ]の者[もの]たちは組[く]み打[う]ちで倒[たお]され、多[おお]くの者[もの]が生[い]けどりにされた。"
  6: "企[くわだ]てを果[は]たしたフィロパトルは、近[ちか]くの町[まち]々[まち]を訪[おとず]れて人[ひと]々[びと]を励[はげ]ますことにした。"
  7: "そうして、聖域[せいいき]に贈[おく]り物[もの]を配[くば]り、支配下[しはいか]の者[もの]たちに勇気[ゆうき]を与[あた]えた。"
  8: "ユダヤ人[じん]たちが長老会[ちょうろうかい]と長老[ちょうろう]たちの中[なか]から使者[ししゃ]を遣[つか]わし、彼[かれ]に挨拶[あいさつ]し、贈[おく]り物[もの]を持[も]たせ、起[お]こったことを喜[よろこ]ぶ意[い]を表[あらわ]そうとすると、彼[かれ]はできるだけ早[はや]く彼[かれ]らのもとへ行[い]きたいと願[ねが]った。"
  9: "エルサレムに着[つ]くと、彼[かれ]は大[おお]いなる神[かみ]に犠牲[ぎせい]を捧[ささ]げ、感謝[かんしゃ]をささげ、聖[せい]なる場所[ばしょ]にふさわしいことをすべて行[おこな]った。"
  10: "また神殿[しんでん]の整[ととの]った様子[ようす]に驚[おどろ]き、聖所[せいしょ]に入[はい]ることを考[かんが]えた。"
  11: "人[ひと]々[びと]は、それはふさわしいことではないと言[い]った。自分[じぶん]の民[たみ]の者[もの]でさえ、いや祭司[さいし]たちでさえも、そこに入[はい]ることは許[ゆる]されず、すべての者[もの]の上[うえ]に立[た]つ大祭司[だいさいし]だけが、しかも年[とし]に一度[いちど]だけ入[はい]ることができるからである。しかし、彼[かれ]は全[まった]く聞[き]き入[い]れなかった。"
  12: "律法[りっぽう]が読[よ]み聞[き]かされても、彼[かれ]は考[かんが]えを捨[す]てなかった。自分[じぶん]は入[はい]るべきだと言[い]い、「彼[かれ]らがこの誉[ほま]れを奪[うば]われているとしても、わたしは奪[うば]われるべきではない」と言[い]った。また、なぜ自分[じぶん]がどの聖域[せいいき]に入[はい]る時[とき]も、そこに居[い]合[あ]わせた者[もの]が誰[だれ]一人[ひとり]として妨[さまた]げなかったのか、と尋[たず]ねた。"
  13: "ある者[もの]が軽率[けいそつ]にも、それは悪[わる]いことだと言[い]うと、彼[かれ]は答[こた]えた。「それがどんな理由[りゆう]で行[おこな]われたにせよ、もう済[す]んだことなら、彼[かれ]らが望[のぞ]もうと望[のぞ]むまいと、わたしは必[かなら]ず入[はい]るべきではないか。」"
  14: "祭司[さいし]たちは聖[せい]なる衣[ころも]をまとったまま地[ち]に伏[ふ]し、大[おお]いなる神[かみ]に、この危機[きき]を助[たす]け、悪[わる]くも押[お]し進[すす]もうとする者[もの]の勢[いきお]いをそらしてくださるよう願[ねが]った。神殿[しんでん]は叫[さけ]びと涙[なみだ]で満[み]ち、町[まち]に残[のこ]っていた者[もの]たちは、何[なに]か異常[いじょう]なことが起[お]こったと思[おも]い、慌[あわ]てて駆[か]け出[だ]した。"
  15: "部屋[へや]に閉[と]じこもっていた処女[おとめ]たちは母[はは]たちとともに飛[と]び出[だ]し、髪[かみ]に塵[ちり]をかぶせ、泣[な]き叫[さけ]んで街路[がいろ]を満[み]たした。"
  16: "また、婚礼[こんれい]の支度[したく]を整[ととの]えたばかりの者[もの]たちも、迎[むか]えのために用意[ようい]された新婦[しんぷ]の部屋[へや]と、ふさわしい慎[つつし]みを捨[す]てて、町[まち]の中[なか]を乱[みだ]りに駆[か]け回[まわ]った。"
  17: "そのうえ、母[はは]たちや乳母[うば]たちは、家[いえ]の中[なか]であれ通[とお]りであれ、生[う]まれたばかりの子[こ]どもをあちこちに置[お]き去[さ]りにして、夢中[むちゅう]で最[もっと]も聖[せい]なる神殿[しんでん]へと集[あつ]まってきた。"
  18: "そこに集[あつ]まった者[もの]たちの祈[いの]りは、彼[かれ]が不敬[ふけい]にも手[て]を下[くだ]そうとしていることのゆえに、さまざまであった。"
  19: "また、町[まち]の者[もの]たちのうちのある者[もの]たちは勇[いさ]み、彼[かれ]が押[お]し入[い]って企[くわだ]てを遂[と]げようとするのを、もはや我慢[がまん]できなかった。彼[かれ]らは「武器[ぶき]を取[と]って父祖[ふそ]の律法[りっぽう]のために勇敢[ゆうかん]に死[し]のう」と叫[さけ]び、その場所[ばしょ]に大[おお]きな騒[さわ]ぎを引[ひ]き起[お]こした。しかし、年老[としお]いた者[もの]たちと長老[ちょうろう]たちにようやく制[せい]されて、彼[かれ]らは再[ふたた]び祈[いの]りの態[たい]勢[せい]に戻[もど]った。"
  20: "民[たみ]の群[む]れは、これまでと同[おな]じように祈[いの]り続[つづ]けた。"
  21: "王[おう]のそばにいた長老[ちょうろう]たちは、さまざまな仕方[しかた]で、高慢[こうまん]な彼[かれ]の心[こころ]を、思[おも]い定[さだ]めた企[くわだ]てから遠[とお]ざけようと努[つと]めた。"
  22: "しかし彼[かれ]は厚[あつ]かましくもすべていっさいを退[しりぞ]け、すでに一歩[いっぽ]を踏[ふ]み出[だ]して、先[さき]に言[い]ったことを成[な]し遂[と]げようとした。"
  23: "これを見[み]て、彼[かれ]のそばにいた者[もの]たちもまた、わたしたちの同胞[どうほう]とともに、全[すべ]ての力[ちから]を握[にぎ]る方[かた]を呼[よ]び求[もと]め、目[め]の前[まえ]の窮地[きゅうち]を助[たす]け、この不法[ふほう]で高慢[こうまん]な行[おこな]いを顧[かえり]みずに見過[みす]ごすことのないようにと願[ねが]い始[はじ]めた。"
  24: "群衆[ぐんしゅう]が激[はげ]しく苦[くる]しげに叫[さけ]ぶ声[こえ]が重[かさ]なり合[あ]い、たとえようのない響[ひび]きとなった。"
  25: "人[ひと]々[びと]だけでなく、城壁[じょうへき]も地[じ]の全[すべ]ても、この場所[ばしょ]が汚[けが]されることの代[か]わりに、今[いま]にも死[し]のうとしているかのように響[ひび]いていると思[おも]われた。"

notes:
  1: "Ὁ δὲ Φιλοπάτωρ — «Филопатор» (Птолемей IV Филопатор); τῶν ἀνακομισθέντων — «вернувшихся (к нему)»; ἀφαίρεσις — «отнятие»; Ῥαφία — Рафия (на юге Палестины). ru: «в страну Рафию»."
  2: "Θεόδοτος — Феодот (テオドトス); ἐπιβουλή — замысел (против царя); ὡς μόνος κτεῖναι — «чтобы одному убить»; διαλῦσαι τὸν πόλεμον — «прекратить войну»."
  3: "Δοσίθεος ὁ Δριμύλου — Досифей, сын Дримила (ドシテオス, ドリミロス); τὸ γένος Ιουδαῖος — «родом иудей»; μεταβαλὼν τὰ νόμιμα — «изменивший закон»; ἄσημόν τινα — «какого-то незначительного»; διαγαγών — «отведя» (в русс. «обманул»)."
  4: "Ἀρσινόη — Арсиноя, сестра Птолемея; μνᾶ — мина (ムナ); ἐπαγγελλομένη — «обещая»; τοὺς πλοκάμους λελυμένη — «распустив волосы» (знак скорби)."
  5: "χειρονομίαι — рукопашная схватка; δοριαλώτους — «взятые копьём», т. е. пленные."
  6: "κατακρατήσας τῆς ἐπιβουλῆς — «одолев замысел» (заговор Феодота); ἐπελθὼν παρακαλέσαι — «пройдя (города), ободрить»."
  7: "τεμένη — святилища (языческие, не иерусалимский храм); δωρεάς — дары; εὐθαρσεῖς — «бодрыми»."
  8: "γερουσία — совет старейшин (長老会); ξένια — дары-подношения; χαρισομένους — «радующихся (случившемуся)»."
  9: "τῶν ἑξῆς τι τῷ τόπῳ — «кое-что из подобающего месту»; σπουδαιότης καὶ εὐπρέπεια — благоговейность и благолепие. ru сливает 1:9–10 и добавляет «величием и благолепием» (это gr 1:9)."
  10: "εὐταξία — благоустройство; ναός — святилище (聖所). В LXX стих только об удивлении устроением храма."
  11: "καθῆκον — подобающее; ἀρχιερεύς — первосвященник (大祭司); κατ᾽ ἐνιαυτὸν ἅπαξ — «раз в год» (ср. Исх 30:10; Евр 9:7)."
  12: "СТИХ СОЕДИНЁН: gr 1:12+13. Сначала слова царя «пусть они лишены… но не я» (gr 1:12), затем его вопрос, почему никто не воспрепятствовал (gr 1:13). τοῦ νόμου παραναγνωσθέντος — «когда закон был прочитан вслух»; ἐστέρηνται — «лишены»."
  13: "СТИХ СОЕДИНЁН: gr 1:14+15. Замечание кого-то, что это худо (gr 1:14), и ответ царя «если это уже сделано…» (gr 1:15). ἀπρονοήτως — «неосмотрительно»; τερατεύεσθαι — «представлять странным/чудесным»."
  14: "СТИХ СОЕДИНЁН: gr 1:16+17. Молитва священников в одеждах (gr 1:16) и смятение в городе (gr 1:17). ἐν ἐσθῆσιν — «в (священных) одеждах»; ὁρμή — порыв; ἐνεστῶτα — «настоящие (обстоятельства)»."
  15: "gr 1:18. κατάκλειστοι παρθένοι — «запертые девы»; ἀπέδωκαν κόνει τὰς κόμας — «отдали волосы праху» (посыпали голову пеплом)."
  16: "gr 1:19. προσαρτίως ἐσταλμέναι — «только что убранные»; παστοί — брачный чертог; αἰδώς — стыд."
  17: "gr 1:20. νεογνά — новорождённые; τιθηνοί — кормилицы; πανυπέρτατον ἱερόν — «всесвятейший храм»."
  18: "gr 1:21. ποικίλη — «разнообразная»; ἀνοσίως — нечестиво; κατεγχειρουμένοις — «над кем покушаются»."
  19: "СТИХ СОЕДИНЁН: gr 1:22+23. Граждане не терпят (gr 1:22) и призывают взяться за оружие (gr 1:23). θρασυνθέντες — «осмелев»; τραχύτης — смятение; γεραιοί — старцы."
  20: "gr 1:24. ἀνεστρέφετο — «пребывал, держался»."
  21: "gr 1:25. ἀγέρωχος νοῦς — надменный ум; ἐξιστάνειν — «отвлекать, выводить из себя»."
  22: "gr 1:26. παραπέμψας — «отстранив»; πρόσβασις — «приступ»."
  23: "gr 1:27. ἐπαμῦναι — помочь; μὴ παριδόντα — «не пренебрегши»."
  24: "gr 1:28. ἀνείκαστος βοή — «невыразимый гул»."
  25: "gr 1:29. ἠχεῖν — звучать; ἀλλασσομένων — «обменивающих (жизнь на смерть)»; βεβήλωσις — осквернение."
