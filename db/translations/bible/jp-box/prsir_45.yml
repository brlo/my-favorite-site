verses:
  1: "主[しゅ]は彼[かれ]から、すべての肉[にく]の目[め]に恵[めぐ]みを受[う]け、神[かみ]と人[ひと]とに愛[あい]されたあわれみの人、モーセを導[みちび]き出[だ]された。その思[おも]い出[で]は祝福[しゅくふく]のうちにある。"
  2: "主[しゅ]は彼[かれ]を聖[せい]なる者[もの]たちの栄光[えいこう]に似[に]たものとし、敵[てき]を恐[おそ]れさせて彼を大[おお]きくされた。"
  3: "主[しゅ]は彼[かれ]の言葉[ことば]によってしるしを止[と]め、王[おう]たちの前[まえ]で彼に栄光[えいこう]を与[あた]えた。彼に民[たみ]への戒[いまし]めを命[めい]じ、ご自[じ]分[ぶん]の栄光の一部[いちぶ]を彼に示[しめ]された。"
  4: "主[しゅ]はその信[しん]と柔和[にゅうわ]さによって彼[かれ]を聖[せい]とし、すべての肉[にく]のうちから彼を選[えら]ばれた。"
  5: "主[しゅ]は彼[かれ]にご自[じ]分[ぶん]の声[こえ]を聞[き]かせ、暗[くら]やみのうちへ導[みちび]き入[い]れ、顔[かお]と顔を合[あ]わせて戒[いまし]めを与[あた]えられた。すなわち、命[いのち]と知[ち]識[しき]の律法[りっぽう]である。それは、彼がヤコブに契[けい]約[やく]を、イスラエルに主の裁[さば]きを教[おし]えるためであった。"
  6: "主[しゅ]は、彼[かれ]に似[に]た聖[せい]なる者[もの]、レビの部[ぶ]族[ぞく]から出[で]たその兄[あに]アロンを高[たか]くされた。"
  7: "主[しゅ]は彼[かれ]と永遠[えいえん]の契[けい]約[やく]を結[むす]び、民[たみ]の祭[さい]司[し]職[しょく]を彼に与[あた]えられた。主は美[うつく]しい装[そう]いをもって彼を祝福[しゅくふく]し、栄光[えいこう]の衣[ころも]を彼に帯[お]びさせられた。"
  8: "主[しゅ]は彼[かれ]に誉[ほま]れの極[きわ]みを着[き]せ、力[ちから]の器[うつわ]で彼を固[かた]められた。すなわち、腿[もも]を覆[おお]うものと足[あし]まで届[とど]く衣[ころも]とエフォドである。"
  9: "主[しゅ]は彼[かれ]の周[まわ]りをざくろで、また多[おお]くの金[きん]の鈴[すず]で囲[かこ]み、彼が歩[あゆ]むたびに音[おと]を鳴[ら]らし、神殿[しんでん]のうちにその響[ひび]きを聞[き]かせて、民[たみ]の子[こ]らへの記[き]念[ねん]とした。"
  10: "聖[せい]なる衣[ころも]、金[きん]と青[あお]と紫[むらさき]、織[お]り手[て]のわざ、裁[さば]きの胸[むね]当[あ]て、真[しん]理[り]のしるし、撚[よ]り合[あ]わせた緋[ひ]の糸[いと]、工[こう]芸[げい]のわざである。"
  11: "貴[き]石[せき]には封[ふう]印[いん]の彫[ほ]りが施[ほどこ]され、金[きん]の台[だい]に嵌[は]め込[こ]まれている。それは石細工[いしざいく]のわざであり、イスラエルの部[ぶ]族[ぞく]の数[かず]に応[おう]じて記[しる]された記[き]念[ねん]である。"
  12: "頭巾[ずきん]の上[うえ]には金[きん]の冠[かんむり]があり、聖[せい]なるものの封[ふう]印[いん]の型[かた]が押[お]されている。それは誉[ほま]れの誇[ほこ]り、力[ちから]のわざであり、目[め]の慕[した]うものを飾[かざ]っている。"
  13: "これほど美[うつく]しいものが、彼[かれ]より前[まえ]にあったことはない。世[よ]の終[お]わりまで、他[た]国[こく]の者[もの]がこれを着[き]ることはなく、ただ彼の子[こ]らとその子孫[しそん]だけが、いつまでも着る。"
  14: "彼[かれ]の犠[ぎ]牲[せい]は、毎日[まいにち]絶[た]えず二[に]度[ど]、全[ぜん]焼[しょう]の犠牲としてささげられる。"
  15: "モーセは彼[かれ]の手[て]を満[み]たし、聖[せい]なる油[あぶら]を注[そそ]いで彼を油注ぎした。それは彼とその子孫[しそん]にとって永遠[えいえん]の契[けい]約[やく]となった。天[てん]の日[ひ]の続[つづ]くかぎり、彼らは主[しゅ]に仕[つか]え、ともに祭[さい]司[し]として仕え、主の名[な]によって主の民[たみ]を祝福[しゅくふく]する。"
  16: "主[しゅ]はすべていきとし生[い]ける者[もの]のうちから彼[かれ]を選[えら]び、主に献[ささ]げ物[もの]をささげ、香[こう]と香[かおり]を記[き]念[ねん]としてたき、あなたの民[たみ]のために贖[あがな]いをする者とされた。"
  17: "主[しゅ]はその戒[いまし]めのうちで彼[かれ]に権[けん]威[い]を与[あた]え、裁[さば]きの定[さだ]めのうちで、ヤコブに主の証[あかし]を教[おし]え、その律法[りっぽう]によってイスラエルを照[て]らす者[もの]とされた。"
  18: "しかし、よそ者[もの]たちは彼[かれ]に逆[さか]らい、荒[あ]れ野[の]で彼をねたんだ。ダタンとアビロンを中心[ちゅうしん]とする者たち、およびコラの一[いち]党[とう]が、激[げき]しい怒[いか]りをもって立[た]ち向[む]かった。"
  19: "主[しゅ]はこれを見[み]て喜[よろこ]ばず、彼[かれ]らは怒[いか]りの激[げき]しさのうちに滅[ほろ]ぼされた。主は彼らに対して驚[おどろ]くべきことを行[おこな]い、ご自[じ]分[ぶん]の炎[ほのお]の火[ひ]で彼らを焼[や]き尽[つ]くされた。"
  20: "主[しゅ]はアロンにさらに栄光[えいこう]を加[くわ]え、遺[い]産[さん]を彼[かれ]に与[あた]えられた。すなわち、初[はつ]物[もの]のうちの初[はつ]穂[ほ]を彼に分[わ]け与え、まずパンを、飽[あ]き足[た]りるほどに備[そな]えられた。"
  21: "彼[かれ]らは主[しゅ]の犠[ぎ]牲[せい]を食[た]べるからである。それは主が彼とその子孫[しそん]に与[あた]えたものである。"
  22: "ただ、彼[かれ]は民[たみ]の地[ち]を継[つ]ぐことはなく、民のうちに分[ぶん]け前[まえ]を持[も]たない。主[しゅ]ご自[じ]身[しん]があなたの分け前、あなたの遺[い]産[さん]であるからである。"
  23: "また、エレアザルの子[こ]ピネハスは栄光[えいこう]において第[だい]三[さん]の者[もの]となった。彼[かれ]は主[しゅ]を恐[おそ]れる熱[ねつ]意[い]によって、民[たみ]が背[そむ]き去[さ]る時[とき]に、その魂[たましい]の進[すす]んでの良[よ]き心[こころ]をもって立[た]ち、イスラエルのために贖[あがな]いをした。"
  24: "それゆえ、彼[かれ]との間に平[へい]和[わ]の契[けい]約[やく]が立[た]てられ、彼は聖[せい]なる者[もの]たちと主[しゅ]の民[たみ]の先[せん]導[どう]者[しゃ]となった。それは、彼とその子孫[しそん]に祭[さい]司[し]職[しょく]の偉[い]大[だい]さが永遠[えいえん]に属[ぞく]するためであった。"
  25: "また、ユダの部[ぶ]族[ぞく]から出[で]たエッサイの子[こ]ダビデとの契[けい]約[やく]がある。王[おう]の遺[い]産[さん]は、一[ひと]人[り]の子[こ]からその子[こ]へと受[う]け継[つ]がれる。アロンの遺産も、その子孫[しそん]に受け継がれる。"
  26: "主[しゅ]があなたがたの心[こころ]に知恵[ちえ]を与[あた]え、正[せい]義[ぎ]をもって主の民[たみ]を裁[さば]かせてくださるように。あなたがたの善[ぜん]が消[き]え失[う]せず、その栄光[えいこう]が代々[よよ]に及[およ]ぶように。"

notes:
  1: "Καὶ ἐξήγαγεν ἐξ αὐτοῦ ἄνδρα ἐλέους — «и вывел из него мужа милости» (ἐξάγω — выводить). εὑρίσκοντα χάριν ἐν ὀφθαλμοῖς πάσης σαρκός — «обретающего благодать в очах всякой плоти» (χάρις — благодать). ἠγαπημένον ὑπὸ θεοῦ καὶ ἀνθρώπων — «возлюбленного Богом и людьми». οὗ τὸ μνημόσυνον ἐν εὐλογίαις — «его память в благословениях». Начало стиха слав. относит к 44:27."
  2: "ὡμοίωσεν αὐτὸν δόξῃ ἁγίων — «уподобил его славе святых» (ὁμοιόω — уподоблять). ἐμεγάλυνεν αὐτὸν ἐν φόβοις ἐχθρῶν — «возвеличил его в страхах врагов», т. е. сделал грозным для врагов (μεγαλύνω — возвеличивать)."
  3: "ἐν λόγοις αὐτοῦ σημεῖα κατέπαυσεν — «словами его знамения Он прекратил» (καταπαύω — прекращать); слав. «знамения устави» понято как «установил». ἐδόξασεν αὐτὸν κατὰ πρόσωπον βασιλέων — «прославил его пред лицом царей». ἐνετείλατο αὐτῷ πρὸς λαὸν αὐτοῦ — «заповедал ему к народу Своему»; ἔδειξεν αὐτῷ τῆς δόξης αὐτοῦ — «показал ему славу Свою»."
  4: "ἐν πίστει καὶ πραΰτητι αὐτὸν ἡγίασεν — «в вере и кротости его освятил» (πίστις — вера; πραΰτης — кротость; ἁγιάζω — освящать). ἐξελέξατο αὐτὸν ἐκ πάσης σαρκός — «избрал его из всякой плоти»."
  5: "ἠκούτισεν αὐτὸν τῆς φωνῆς αὐτοῦ — «дал ему услышать голос Свой» (ἀκουτίζω — давать слышать). εἰσήγαγεν αὐτὸν εἰς τὸν γνόφον — «ввёл его во мрак» (γνόφος — мрак, тьма). ἔδωκεν αὐτῷ κατὰ πρόσωπον ἐντολάς — «дал ему лицом к лицу заповеди». νόμον ζωῆς καὶ ἐπιστήμης — «закон жизни и знания» (ἐπιστήμη — знание). διδάξαι τὸν Ιακωβ διαθήκην — «чтобы научить Иакова завету»."
  6: "Ααρων ὕψωσεν ἅγιον ὅμοιον αὐτῷ — «Аарона возвысил, святого, подобного ему» (ὑψόω — возвышать). ἀδελφὸν αὐτοῦ ἐκ φυλῆς Λευι — «брата его из племени Левия» (φυλή — племя, колено)."
  7: "ἔστησεν αὐτὸν διαθήκην αἰῶνος — «поставил с ним завет века»; ἔδωκεν αὐτῷ ἱερατείαν λαοῦ — «дал ему священство народа» (ἱερατεία — священство). ἐμακάρισεν αὐτὸν ἐν εὐκοσμίᾳ — «ублажил его в благолепии» (μακαρίζω — ублажать; εὐκοσμία — благолепие). περιέζωσεν αὐτὸν περιστολὴν δόξης — «опоясал его одеждою славы» (περιζώννυμι — опоясывать; περιστολή — одеяние)."
  8: "ἐνέδυσεν αὐτὸν συντέλειαν καυχήματος — «облёк его в совершенство похвалы» (ἐνδύω — облекать; καύχημα — похвала). ἐστερέωσεν αὐτὸν σκεύεσιν ἰσχύος — «утвердил его сосудами силы» (σκεῦος — сосуд, принадлежность). περισκελῆ καὶ ποδήρη καὶ ἐπωμίδα — «набедренник, подир и ефод»: περισκελής — наколенник, ποδήρης — длинная до ног одежда, ἐπωμίς — ефод."
  9: "ἐκύκλωσεν αὐτὸν ῥοίσκοις — «окружил его гранатами» (ῥοΐσκος — украшение в виде граната). χρυσοῖς κώδωσιν πλείστοις κυκλόθεν — «многими золотыми колокольчиками вокруг» (κώδων — колокольчик). ἠχῆσαι φωνὴν ἐν βήμασιν αὐτοῦ — «чтобы звучал голос при шагах его» (βῆμα — шаг). ἀκουστὸν ποιῆσαι ἦχον ἐν ναῷ — «сделать слышным звон в храме»; εἰς μνημόσυνον υἱοῖς λαοῦ αὐτοῦ — «в память сынам народа его»."
  10: "στολῇ ἁγίᾳ — «в святой одежде» (στολή — облачение). χρυσῷ καὶ ὑακίνθῳ καὶ πορφύρᾳ — «золотом, гиацинтом и порфирою» (ὑάκινθος — сине-фиолетовая шерсть; πορφύρα — порфира). ἔργῳ ποικιλτοῦ — «делом ткача-узорешника» (ποικιλτής — вышивальщик). λογείῳ κρίσεως — «наперснике суда» (λογεῖον — наперсник). δήλοις ἀληθείας — «явлениях истины» (δῆλος — явный; речь об уриме и туммиме). κεκλωσμένῃ κόκκῳ — «кручёной багряницей» (κλώθω — прясть). ἔργῳ τεχνίτου — «делом художника»."
  11: "λίθοις πολυτελέσιν γλύμματος σφραγῖδος — «драгоценными камнями с резьбой печати» (πολυτελής — драгоценный; γλύμμα — резьба). ἐν δέσει χρυσίου — «в золотой оправе» (δέσις — оправа). ἔργῳ λιθουργοῦ — «делом камнереза» (λιθουργός). εἰς μνημόσυνον ἐν γραφῇ κεκολαμμένη — «в память, начертанную письмом» (κολάπτω — вырезать); κατ᾽ ἀριθμὸν φυλῶν Ισραηλ — «по числу племён Израиля»."
  12: "στέφανον χρυσοῦν ἐπάνω κιδάρεως — «золотой венец над кидаром» (κίδαρις — головной убор). ἐκτύπωμα σφραγῖδος ἁγιάσματος — «оттиск печати святыни» (ἐκτύπωμα — оттиск). καύχημα τιμῆς, ἔργον ἰσχύος — «похвала чести, дело силы». ἐπιθυμήματα ὀφθαλμῶν κοσμούμενα — «вожделения глаз украшаемые» (ἐπιθύμημα — предмет желания)."
  13: "ὡραῖα πρὸ αὐτοῦ οὐ γέγονεν τοιαῦτα — «прекрасного прежде него не было такого» (ὡραῖος — прекрасный). ἕως αἰῶνος οὐκ ἐνεδύσατο ἀλλογενής — «до века не надевал иноплеменник» (ἐνδύομαι — надевать; ἀλλογενής — чужеродный). πλὴν τῶν υἱῶν αὐτοῦ μόνον καὶ τὰ ἔκγονα αὐτοῦ διὰ παντός — «кроме только сынов его и потомков его — всегда»."
  14: "θυσίαι αὐτοῦ ὁλοκαρπωθήσονται — «жертвы его будут всесожигаемы» (ὁλοκαρπόω — сожигать целиком). καθ᾽ ἡμέραν ἐνδελεχῶς δίς — «каждый день непрестанно дважды» (ἐνδελεχῶς — непрерывно; δίς — дважды)."
  15: "ἐπλήρωσεν Μωϋσῆς τὰς χεῖρας — «Моисей наполнил руки», обряд поставления (πληρόω — наполнять). ἔχρισεν αὐτὸν ἐν ἐλαίῳ ἁγίῳ — «помазал его святым елеем» (χρίω — помазывать). ἐγενήθη αὐτῷ εἰς διαθήκην αἰῶνος — «стало ему в завет века»; τῷ σπέρματι αὐτοῦ ἐν ἡμέραις οὐρανοῦ — «и семени его в дни неба». λειτουργεῖν αὐτῷ ἅμα καὶ ἱερατεύειν — «служить Ему вместе и священствовать» (λειτουργέω — служить)."
  16: "ἐξελέξατο αὐτὸν ἀπὸ παντὸς ζῶντος — «избрал его из всякого живущего». προσαγαγεῖν κάρπωσιν κυρίῳ — «приносить Господу приношение» (κάρπωσις — приношение). θυμίαμα καὶ εὐωδίαν εἰς μνημόσυνον — «курение и благоухание в память» (θυμίαμα — курение; εὐωδία — благоухание). ἐξιλάσκεσθαι περὶ τοῦ λαοῦ σου — «умилостивлять о народе Твоём» (ἐξιλάσκομαι — умилостивлять)."
  17: "ἔδωκεν αὐτῷ ἐν ἐντολαῖς αὐτοῦ ἐξουσίαν — «дал ему в заповедях Своих власть» (ἐξουσία — власть). ἐν διαθήκαις κριμάτων — «в заветах судов» (κρίμα — суд, постановление). διδάξαι τὸν Ιακωβ τὰ μαρτύρια — «научить Иакова свидетельствам» (μαρτύριον — свидетельство). ἐν νόμῳ αὐτοῦ φωτίσαι Ισραηλ — «в законе Его просветить Израиля» (φωτίζω — просвещать)."
  18: "ἐπισυνέστησαν αὐτῷ ἀλλότριοι — «восстали против него чужие» (ἐπισυνίστημι — восставать). ἐζήλωσαν αὐτὸν ἐν τῇ ἐρήμῳ — «позавидовали ему в пустыне» (ζηλόω — ревновать, завидовать). ἄνδρες οἱ περὶ Δαθαν καὶ Αβιρων — «мужи вокруг Дафана и Авирона». ἡ συναγωγὴ Κορε ἐν θυμῷ καὶ ὀργῇ — «сборище Корея в ярости и гневе» (συναγωγή — сборище)."
  19: "εἶδεν κύριος καὶ οὐκ εὐδόκησεν — «увидел Господь и не благоволил» (εὐδοκέω — благоволить). συνετελέσθησαν ἐν θυμῷ ὀργῆς — «они были истреблены в ярости гнева» (συντελέω — завершать, истреблять). ἐποίησεν αὐτοῖς τέρατα καταναλῶσαι — «сотворил им знамения, чтобы пожрать» (τέρας — знамение; καταναλίσκω — пожирать). ἐν πυρὶ φλογὸς αὐτοῦ — «огнём пламени Его»."
  20: "προσέθηκεν Ααρων δόξαν — «приложил Аарону славу» (προστίθημι — прибавлять). ἀπαρχὰς πρωτογενημάτων ἐμέρισεν αὐτῷ — «начатки перворождённых разделил ему» (ἀπαρχή — начаток; πρωτογένημα — перворождённое). ἄρτον πρώτοις ἡτοίμασεν πλησμονήν — «хлеб первым приготовил в насыщение» (πλησμονή — насыщение)."
  21: "καὶ γὰρ θυσίας κυρίου φάγονται — «ибо жертвы Господни они будут есть». ἃς ἔδωκεν αὐτῷ τε καὶ τῷ σπέρματι αὐτοῦ — «которые Он дал ему и семени его»."
  22: "πλὴν ἐν γῇ λαοῦ οὐ κληρονομήσει — «но в земле народа не получит наследия» (κληρονομέω — наследовать). μερὶς οὐκ ἔστιν αὐτῷ ἐν λαῷ — «и части нет ему в народе» (μερίς — часть, удел). αὐτὸς γὰρ μερίς σου καὶ κληρονομία — «ибо Он Сам — часть твоя и наследие»."
  23: "Καὶ Φινεες υἱὸς Ελεαζαρ τρίτος εἰς δόξαν — «и Финеес, сын Елеазара, третий в славе». ἐν τῷ ζηλῶσαι αὐτὸν ἐν φόβῳ κυρίου — «когда он возревновал в страхе Господнем». στῆναι αὐτὸν ἐν τροπῇ λαοῦ — «стать при отпадении народа» (τροπή — поворот, отпадение). ἐν ἀγαθότητι προθυμίας ψυχῆς αὐτοῦ — «в благости усердия души своей» (ἀγαθότης — благость; προθυμία — усердие). ἐξιλάσατο περὶ τοῦ Ισραηλ — «умилостивил за Израиля»."
  24: "ἐστάθη αὐτῷ διαθήκη εἰρήνης — «поставлен ему завет мира». προστατεῖν ἁγίων καὶ λαοῦ αὐτοῦ — «предстоятельствовать святым и народу Его» (προστατέω — предстоятельствовать). ἵνα αὐτῷ ᾖ καὶ τῷ σπέρματι αὐτοῦ ἱερωσύνης μεγαλεῖον — «чтобы ему и семени его было величие священства» (ἱερωσύνη — священство; μεγαλεῖον — величие). εἰς τοὺς αἰῶνας — «вовеки»."
  25: "καὶ διαθήκη τῷ Δαυιδ υἱῷ Ιεσσαι ἐκ φυλῆς Ιουδα — «и завет с Давидом, сыном Иессея, из племени Иуды». κληρονομία βασιλέως υἱοῦ ἐξ υἱοῦ μόνου — «наследие царя, сына от сына единственного», т. е. престол переходит от отца к одному сыну. κληρονομία Ααρων καὶ τῷ σπέρματι αὐτοῦ — «наследие Аарона и семени его»."
  26: "δῴη ὑμῖν σοφίαν ἐν καρδίᾳ ὑμῶν — «да даст вам мудрость в сердце вашем» (δίδωμι в оптативе). κρίνειν τὸν λαὸν αὐτοῦ ἐν δικαιοσύνῃ — «судить народ Его в правде». ἵνα μὴ ἀφανισθῇ τὰ ἀγαθὰ αὐτῶν — «чтобы не исчезли блага их» (ἀφανίζω — истреблять). τὴν δόξαν αὐτῶν εἰς γενεὰς αὐτῶν — «и слава их в роды их»."
