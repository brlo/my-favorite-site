verses:
  1: "彼[かれ]に代[か]わって、その子[こ]であるマッカバイオスと呼[よ]ばれるユダが立[た]った。"
  2: "彼の兄弟[きょうだい]たちは皆[みな]、また父[ちち]に従[したが]っていた者[もの]たちも皆[みな]、彼を助[たす]け、喜[よろこ]びをもってイスラエルの戦[たたか]いを戦[たたか]った。"
  3: "彼は自分[じぶん]の民[たみ]の栄[えい]光[こう]を広[ひろ]げ、巨人[きょじん]のように鎧[よろい]を着[き]、自分[じぶん]の武具[ぶぐ]を身[み]に帯[お]び、剣[つるぎ]をもって陣[じん]を守[まも]りながら戦[たたか]いを繰[く]り広[ひろ]げた。"
  4: "彼はそのわざにおいて獅子[しし]に似[に]ており、獲物[えもの]に向[む]かって吼[ほ]える子[こ]獅子[しし]のようであった。"
  5: "彼は不法[ふほう]な者[もの]たちを捜[さが]し求[もと]めて追[お]い、自分[じぶん]の民[たみ]を乱[みだ]す者[もの]たちを炎[ほのお]で焼[や]き払[はら]った。"
  6: "不法[ふほう]な者[もの]たちは彼を恐[おそ]れて縮[ちぢ]み上[あ]がり、不法[ふほう]を行[おこな]う者[もの]は皆[みな]動揺[どうよう]した。彼の手[て]によって救[すく]いは成功[せいこう]した。"
  7: "彼は多[おお]くの王[おう]たちを苦[くる]しめ、そのわざによってヤコブを喜[よろこ]ばせた。その記念[きねん]は世[よ]々[よ]に至[いた]るまで祝福[しゅくふく]となる。"
  8: "彼はユダの町[まち]々[まち]を通[とお]り、そこから不敬[ふけい]な者[もの]たちを根[ね]こそぎ滅[ほろ]ぼし、イスラエルから怒[いか]りを遠[とお]ざけた。"
  9: "彼は地[ち]の果[は]てまで名[な]を知[し]られ、滅[ほろ]びゆく者[もの]たちを集[あつ]めた。"
  10: "アポロニオスは異邦人[いほうじん]とサマリアからの大[おお]きな軍勢[ぐんぜい]を集[あつ]め、イスラエルと戦[たたか]おうとした。"
  11: "ユダはこれを知[し]って迎[むか]えに出[で]、彼を撃[う]って殺[ころ]した。多[おお]くの者[もの]が傷[きず]ついて倒[たお]れ、残[のこ]った者[もの]たちは逃[に]げた。"
  12: "彼らは彼らの戦利品[せんりひん]を取[と]り、ユダはアポロニオスの剣[つるぎ]を取[と]って、いつもそれで戦[たたか]った。"
  13: "シリアの軍勢[ぐんぜい]の長[おさ]セロンは、ユダが、自分[じぶん]とともにいて戦[たたか]いに出[で]る信[しん]者[しゃ]たちの集[あつ]まりを集[あつ]めたことを聞[き]いた。"
  14: "そして言[い]った。「わたしは自分[じぶん]の名[な]を上[あ]げ、王国[おうこく]の中で栄[えい]誉[よ]を受けよう。王[おう]の言葉[ことば]を蔑[さげす]むユダと、彼[かれ]とともにいる者[もの]たちを打[う]とう。」"
  15: "彼は進[すす]むことを決[けっ]めた。不敬[ふけい]な者[もの]の強[つよ]い陣[じん]が彼を助[たす]けるために、イスラエルの子[こ]らに復讐[ふくしゅう]を果[は]たそうとして、彼とともに上[のぼ]った。"
  16: "彼らがベテ・ホロンの上[のぼ]り口[ぐち]に近[ちか]づいたとき、ユダは少[すく]ない者[もの]を連[つ]れて彼らを迎[むか]えに出[で]た。"
  17: "彼らが自分[じぶん]たちを迎[むか]えに来[く]る陣[じん]を見[み]たとき、彼らはユダに言[い]った。「わたしたちは少[すく]ない者[もの]なのに、どうしてあれほど強[つよ]い多[おお]くの者[もの]と戦[たたか]えるだろうか。わたしたちは今日[きょう]、何[なに]も食[た]べずに力[ちから]を失[うしな]っているのに。」"
  18: "ユダは言[い]った。「多[おお]くの者[もの]が少[すく]ない者[もの]の手[て]に閉[と]じ込[こ]められるのはたやすい。天[てん]の前[まえ]では、多[おお]くの者[もの]で救[すく]うのも少[すく]ない者[もの]で救[すく]うのも変[か]わりがない。"
  19: "戦[たたか]いの勝利[しょうり]は軍勢[ぐんぜい]の多[おお]さによるのではなく、力[ちから]は天[てん]から来[く]るからである。"
  20: "彼らは傲慢[ごうまん]と不法[ふほう]の多[おお]さをもってわたしたちに襲[おそ]いかかり、わたしたちと妻[つま]たちと子[こ]どもたちを根[ね]こそぎ除[のぞ]き、わたしたちを略奪[りゃくだつ]しようとしている。"
  21: "しかし、わたしたちは自分[じぶん]の命[いのち]と法[ほう]のために戦[たたか]う。"
  22: "彼[かれ]ご自身[じしん]がわたしたちの前[まえ]で彼らを砕[くだ]かれる。あなたがたは彼らを恐[おそ]れてはならない。」"
  23: "彼が語[かた]り終[お]えると、彼らの中[なか]へ突然[とつぜん]に跳[と]び込[こ]み、セロンとその陣[じん]は彼の前[まえ]で砕[くだ]かれた。"
  24: "彼らはベテ・ホロンの下[くだ]り道[みち]から平野[へいや]まで彼を追[お]い、彼らのうち八百[はっぴゃく]人[にん]ほどが倒[たお]れた。残[のこ]った者[もの]たちはペリシテ人の地[ち]へ逃[に]げた。"
  25: "こうして、ユダとその兄弟[きょうだい]たちへの恐[おそ]れが始[はじ]まり、周[まわ]りの異邦人[いほうじん]たちに恐怖[きょうふ]が襲[おそ]いかかった。"
  26: "その名[な]は王[おう]のもとまで届[とど]き、すべての民[たみ]がユダの戦[たたか]いについて語[かた]り合[あ]った。"
  27: "王[おう]アンティオコスがこれらの言葉[ことば]を聞[き]くと、怒[いか]りに燃[も]え、人[ひと]を遣[つか]わして自分[じぶん]の王国[おうこく]のすべての軍勢[ぐんぜい]を、きわめて強[つよ]い陣[じん]として集[あつ]めた。"
  28: "彼は自分[じぶん]の宝物[たからもの]庫[こ]を開[ひら]き、軍勢[ぐんぜい]に一年分[いちねんぶん]の俸給[ほうきゅう]を与[あた]え、あらゆる必要[ひつよう]に備[そな]えておくように命[めい]じた。"
  29: "しかし彼は、宝物[たからもの]から銀[ぎん]が尽[つ]き、国[くに]の貢[みつ]ぎが少[すく]なくなっているのを見[み]た。それは、彼がこの地[ち]で昔[むかし]からの定[さだ]めを取[と]り去[さ]ったために生[しょう]じた内紛[ないふん]と打撃[だげき]のゆえであった。"
  30: "彼は、以前[いぜん]は惜[お]しみない手[て]で与[あた]え、代[よ]々[よ]の王[おう]たちよりも豊[ゆたか]に与[あた]えてきた出費[しゅっぴ]と贈[おく]り物[もの]が、一度[いちど]か二度[にど]で尽[つ]きるのではないかと恐[おそ]れた。"
  31: "彼は心[こころ]がひどく途方[とほう]に暮[く]れ、ペルシアへ行[い]って国[くに]々[ぐに]から貢[みつ]ぎを取[と]り、多[おお]くの銀[ぎん]を集[あつ]めようと決[けっ]めた。"
  32: "彼はリュシアスを、誉[ほま]れある王家[おうけ]の血筋[ちすじ]の者[もの]として、ユーフラテス川[がわ]からエジプトの境[さかい]までの王[おう]の政務[せいむ]に残[のこ]した。"
  33: "また、自分[じぶん]が帰[かえ]るまで、その子[こ]アンティオコスを養育[よういく]するように定[さだ]めた。"
  34: "彼は軍勢[ぐんぜい]の半[はん]分[ぶん]と象[ぞう]たちをリュシアスに渡[わた]し、自分[じぶん]の望[のぞ]むすべてのこと、またユダヤとエルサレムに住[す]む者[もの]たちについて命[めい]じた。"
  35: "すなわち、彼らに軍勢[ぐんぜい]を遣[つか]わしてイスラエルの力[ちから]とエルサレムの残[のこ]りを砕[くだ]き除[のぞ]き、彼らの記念[きねん]をその場所[ばしょ]から消[け]すこと、"
  36: "また、彼らのすべての領地[りょうち]に他[た]の民[たみ]の子[こ]らを住[す]まわせ、くじによって彼らの地[ち]を分配[ぶんぱい]することであった。"
  37: "王[おう]は残[のこ]った軍勢[ぐんぜい]の半[はん]分[ぶん]を率[ひき]い、第[だい]百四十七[ひゃくよんじゅうなな]年[ねん]に自分[じぶん]の王国[おうこく]の都[みやこ]アンティオキアを出[で]て、ユーフラテス川[がわ]を渡[わた]り、上[かみ]の地方[ちほう]を巡[めぐ]った。"
  38: "リュシアスはプトレマイオス（ドリュメノスの子[こ]）、ニカノル、ゴルギアスを、王[おう]の友[とも]の中[なか]の強[つよ]い者[もの]たちとして選[えら]び、"
  39: "彼らとともに四万[よんまん]の兵[へい]と七千[ななせん]の騎兵[きへい]を送[おく]り、ユダの地[ち]へ行[い]って王[おう]の言葉[ことば]どおりにそれを滅[ほろ]ぼさせようとした。"
  40: "彼らはそのすべての軍勢[ぐんぜい]とともに出発[しゅっぱつ]し、平野[へいや]の地[ち]のエンマウス近[ちか]くに陣[じん]を敷[し]いた。"
  41: "この地[ち]の商人[しょうにん]たちは彼らの名[な]を聞[き]いて、非常[ひじょう]に多[おお]くの銀[ぎん]と金[きん]、そして足枷[あしかせ]を取[と]り、イスラエルの子[こ]らを奴隷[どれい]として買[か]おうと陣[じん]へ来[き]た。シリアと異[い]民族[みんぞく]の地[ち]の軍勢[ぐんぜい]も彼らに加[くわ]わった。"
  42: "ユダとその兄弟[きょうだい]たちは、災[わざわ]いが増[ふ]え、軍勢[ぐんぜい]が自分[じぶん]たちの領地[りょうち]に陣[じん]を敷[し]いているのを見[み]、また王[おう]が民[たみ]を滅[ほろ]ぼし絶[た]やそうとして命[めい]じた言葉[ことば]を知[し]った。"
  43: "そしておのおの隣人[りんじん]に言[い]った。「倒[たお]されたわたしたちの民[たみ]を起[お]こそう。わたしたちの民[たみ]と聖[せい]なるもののために戦[たたか]おう。」"
  44: "会衆[かいしゅう]は集[あつ]められ、戦[たたか]いの備[そな]えをし、祈[いの]ってあわれみと慈[じ]しみを求[もと]めることになった。"
  45: "エルサレムは荒[あ]れ野[の]のように、住[す]む者[もの]がなかった。その産[う]みの者[もの]たちの中[なか]から、そこへ出入[でい]りする者[もの]もいなかった。聖所[せいしょ]は踏[ふ]みにじられ、他[た]の民[たみ]の子[こ]らがアクラにいて、異邦人[いほうじん]の宿[やど]となっていた。ヤコブから喜[よろこ]びは取[と]り去[さ]られ、笛[ふえ]と竪琴[たてごと]は絶[た]えた。"
  46: "彼らは集[あつ]まって、エルサレムの正面[しょうめん]にあるミツパへ行[い]った。むかし、イスラエルにとってミツパが祈[いの]りの場所[ばしょ]であったからである。"
  47: "その日[ひ]、彼らは断食[だんじき]し、粗布[あらぬの]をまとい、頭[あたま]に灰[はい]を載[の]せ、衣[ころも]を引[ひ]き裂[さ]いた。"
  48: "そして、異邦人[いほうじん]が自分[じぶん]たちの偶像[ぐうぞう]の像[かたち]を記[しる]そうと探[さぐ]っていた律法[りっぽう]の書[しょ]を広[ひろ]げ、"
  49: "祭司[さいし]の衣[ころも]、初[はつ]物[もの]、十分[じゅうぶん]の一[いち]を持[も]って来[き]た。また、定[さだ]められた日[ひ]を満[み]たしたナジル人[じん]たちを呼[よ]び集[あつ]めた。"
  50: "そして声[こえ]を上[あ]げて天[てん]に向[む]かい、言[い]った。「この者[もの]たちをどうしたらよいのか。どこへ彼らを連[つ]れて行[い]けばよいのか。"
  51: "あなたの聖[せい]なるものは踏[ふ]みにじられ、汚[けが]され、あなたの祭司[さいし]たちは悲[かな]しみと卑[ひ]下[げ]のうちにある。"
  52: "見[み]よ、異邦人[いほうじん]がわたしたちを根[ね]こそぎ除[のぞ]こうとして、わたしたちに集[あつ]まってきた。あなたは彼らがわたしたちに対して考[かんが]えていることを知[し]っておられる。"
  53: "もしあなたがわたしたちを助[たす]けてくださらなければ、どうしてわたしたちは彼らの面前[めんぜん]に立[た]ち向[む]かえるだろうか。」"
  54: "彼らはラッパを吹[ふ]き、大[おお]きな声[こえ]を上[あ]げた。"
  55: "その後[のち]、ユダは民[たみ]のために長[おさ]たちを、すなわち千[せん]人[にん]の長[おさ]、百人[ひゃくにん]の長[おさ]、五十人[ごじゅうにん]の長[おさ]、十人[じゅうにん]の長[おさ]を置[お]いた。"
  56: "また彼は、家[いえ]を建[た]てている者[もの]、妻[つま]を迎[むか]える約束[やくそく]をした者[もの]、ぶどう畑[はたけ]を植[う]えた者[もの]、そして恐[おそ]れている者[もの]に、律法[りっぽう]に従[したが]っておのおの自分[じぶん]の家[いえ]へ帰[かえ]るように言[い]った。"
  57: "こうして陣[じん]は進[すす]み、エンマウスの南[みなみ]に陣[じん]を敷[し]いた。"
  58: "ユダは言[い]った。「腰[こし]に帯[おび]をせよ。強[つよ]い子[こ]らとなれ。朝[あさ]早[はや]く、わたしたちを根[ね]こそぎ除[のぞ]き、わたしたちの聖[せい]なるものを奪[うば]おうとして集[あつ]まってきたこれらの異邦人[いほうじん]と戦[たたか]う備[そな]えをせよ。"
  59: "戦[たたか]いの中で死[し]ぬほうが、自分[じぶん]たちの民[たみ]と聖[せい]なるものの災[わざわ]いを見[み]ているより優[まさ]れているからである。"
  60: "しかし、天[てん]にある望[のぞ]みのとおりになるように。」"

notes:
  1: "ἀνέστη Ιουδας ὁ καλούμενος Μακκαβαῖος υἱὸς αὐτοῦ ἀντ αὐτοῦ — «восстал Иуда, называемый Маккавей, сын его, вместо него» (ἀντί — вместо). Слав. «вместо его»."
  2: "ἐβοήθουν αὐτῷ — «помогали ему»; ὅσοι ἐκολλήθησαν τῷ πατρὶ αὐτοῦ — «сколько прилепились к отцу его» (κολλάω); ἐπολέμουν τὸν πόλεμον Ισραηλ — «вели войну Израиля» (cognatus accusativus); μετ' εὐφροσύνης — «с радостью» (εὐφροσύνη)."
  3: "ἐπλάτυνεν δόξαν τῷ λαῷ αὐτοῦ — «расширил (распространил) славу народу своему» (πλατύνω); ἐνεδύσατο θώρακα ὡς γίγας — «облекся в броню, как исполин» (θώραξ — 鎧[よろい]; γίγας — 巨人[きょじん]); συνεζώσατο τὰ σκεύη τὰ πολεμικά — «препоясался оружием воинским» (συσζώννυμι); σκεπάζων παρεμβολήν — «покрывая (защищая) стан» (σκεπάζω)."
  4: "ὡμοιώθη λέοντι ἐν τοῖς ἔργοις αὐτοῦ — «уподобился льву в делах своих»; ὡς σκύμνος ἐρευγόμενος εἰς θήραν — «как скимен (львёнок), рыкающий на добычу» (ἐρεύγομαι — реветь; θήρα — 獲物[えもの])."
  5: "ἐδίωξεν ἀνόμους ἐξερευνῶν — «погнал беззаконных, разыскивая» (ἐξερευνάω); τοὺς ταράσσοντας τὸν λαόν — «возмущающих народ» (ταράσσω); ἐφλόγισεν — «сжёг пламенем» (φλογίζω)."
  6: "συνεστάλησαν ἄνομοι ἀπὸ τοῦ φόβου αὐτοῦ — «сжались (устрашились) беззаконные от страха его» (συστέλλω); οἱ ἐργάται τῆς ἀνομίας συνεταράχθησαν — «делатели беззакония смутились»; εὐοδώθη σωτηρία ἐν χειρὶ αὐτοῦ — «благоуспешно было спасение рукою его» (εὐοδόω)."
  7: "ἐπίκρανεν βασιλεῖς πολλούς — «огорчил (опечалил) многих царей» (πικραίνω); εὔφρανεν τὸν Ιακωβ — «возвеселил Иакова»; ἕως τοῦ αἰῶνος τὸ μνημόσυνον αὐτοῦ εἰς εὐλογίαν — «до века память его в благословение»."
  8: "διῆλθεν ἐν πόλεσιν Ιουδα — «прошёл по городам Иуды»; ἐξωλέθρευσεν ἀσεβεῖς ἐξ αὐτῆς — «истребил нечестивых из неё» (ἐξολεθρεύω); ἀπέστρεψεν ὀργὴν ἀπὸ Ισραηλ — «отвратил гнев от Израиля»."
  9: "ὠνομάσθη ἕως ἐσχάτου γῆς — «наречён (сделан известным) до последних земли»; συνήγαγεν ἀπολλυμένους — «собрал погибающих» (ἀπόλλυμι)."
  10: "Ἀπολλώνιος — Аполлоний (アポロニオス); ἔθνη καὶ ἀπὸ Σαμαρείας δύναμιν μεγάλην — «народы и из Самарии силу великую»; τοῦ πολεμῆσαι πρὸς τὸν Ισραηλ — «чтобы воевать против Израиля»."
  11: "ἐξῆλθεν εἰς συνάντησιν αὐτῷ — «вышел навстречу ему» (συνάντησις); ἐπάταξεν αὐτὸν καὶ ἀπέκτεινεν — «поразил его и убил»; ἔπεσον τραυματίαι πολλοί — «пали раненых многие»; οἱ ἐπίλοιποι ἔφυγον — «остальные убежали»."
  12: "ἔλαβον τὰ σκῦλα αὐτῶν — «взяли добычу их»; τὴν μάχαιραν Ἀπολλωνίου — «меч Аполлония» (μάχαιρα); ἦν πολεμῶν ἐν αὐτῇ πάσας τὰς ἡμέρας — «был воюя им все дни»."
  13: "Σήρων ὁ ἄρχων τῆς δυνάμεως Συρίας — «Сирон, начальник силы Сирии» (セロン); ἤθροισεν Ιουδας ἄθροισμα — «собрал Иуда собрание» (ἄθροισμα); ἐκκλησίαν πιστῶν — «церковь (собрание) верных» (ἐκκλησία); ἐκπορευομένων εἰς πόλεμον — «выступающих на войну»."
  14: "Ποιήσω ἐμαυτῷ ὄνομα — «сделаю себе имя»; δοξασθήσομαι ἐν τῇ βασιλείᾳ — «прославлюсь в царстве»; τοὺς ἐξουδενοῦντας τὸν λόγον τοῦ βασιλέως — «уничижающих слово царя» (ἐξουδενόω). Речь Сирона — 「…」."
  15: "προσέθετο καὶ ἀνέβη — «приложил (решился) и пошёл»; παρεμβολὴ ἀσεβῶν ἰσχυρά — «стан нечестивых сильный»; βοηθῆσαι αὐτῷ — «помочь ему»; ποιῆσαι τὴν ἐκδίκησιν ἐν υἱοῖς Ισραηλ — «сотворить отмщение в сынах Израиля». Слав. начинает «(и уготовася)» — редакционное."
  16: "ἕως ἀναβάσεως Βαιθωρων — «до восхода (подъёма) Вефорона» (Βαιθωρων — ベテ・ホロン); ἐξῆλθεν… ὀλιγοστός — «вышел… с немногими» (ὀλιγοστός)."
  17: "ὡς δὲ εἶδον τὴν παρεμβολὴν ἐρχομένην — «когда увидели идущий стан»; Τί δυνησόμεθα… πολεμῆσαι — «что сможем… воевать»; πρὸς πλῆθος τοσοῦτο ἰσχυρόν — «против множества столь сильного»; ἐκλελύμεθα ἀσιτοῦντες σήμερον — «ослабели, не евши сегодня» (ἐκλύω — расслаблять; ἄσιτος — неевший)."
  18: "Εὔκοπόν ἐστιν συγκλεισθῆναι πολλοὺς ἐν χερσὶν ὀλίγων — «легко многим быть заключёнными в руки немногих» (εὔκοπος — лёгкий); οὐκ ἔστιν διαφορὰ ἐναντίον τοῦ οὐρανοῦ — «нет различия пред небом» (διαφορά); σῴζειν ἐν πολλοῖς ἢ ἐν ὀλίγοις — «спасать многими или немногими»."
  19: "οὐκ ἐν πλήθει δυνάμεως νίκη πολέμου — «не во множестве силы победа войны»; ἐκ τοῦ οὐρανοῦ ἡ ἰσχύς — «с неба сила». Слав. «токмо от небесе крепость»."
  20: "ἐν πλήθει ὕβρεως καὶ ἀνομίας — «во множестве надменности и беззакония» (ὕβρις — 傲慢[ごうまん]); τοῦ ἐξᾶραι ἡμᾶς — «чтобы исторгнуть (истребить) нас» (ἐξαίρω); τοῦ σκυλεῦσαι — «чтобы ограбить» (σκυλεύω)."
  21: "πολεμοῦμεν περὶ τῶν ψυχῶν ἡμῶν — «воюем за души наши»; τῶν νομίμων ἡμῶν — «за установления наши»."
  22: "αὐτὸς συντρίψει αὐτοὺς — «Он Сам сокрушит их» (συντρίβω); πρὸ προσώπου ἡμῶν — «пред лицом нашим»; μὴ φοβεῖσθε ἀπ' αὐτῶν — «не бойтесь их». Слав. добавляет «Господь» — по смыслу, в тексте 彼[かれ]ご自身[じしん]."
  23: "ἐνήλατο εἰς αὐτοὺς ἄφνω — «прыгнул на них внезапно» (ἐνάλλομαι; ἄφνω — 突然[とつぜん]); συνετρίβη Σήρων καὶ ἡ παρεμβολὴ αὐτοῦ — «сокрушён был Сирон и стан его»."
  24: "ἐν τῇ καταβάσει Βαιθωρων ἕως τοῦ πεδίου — «при спуске Вефорона до равнины» (κατάβασις); εἰς ἄνδρας ὀκτακοσίους — «до восьмисот мужей»; εἰς γῆν Φυλιστιιμ — «в землю Филистимскую» (ペリシテ)."
  25: "ἤρξατο ὁ φόβος Ιουδου — «начался страх Иуды»; ἡ πτόη ἐπέπιπτεν — «ужас нападал» (πτόη — 恐怖[きょうふ]); ἐπὶ τὰ ἔθνη τὰ κύκλῳ — «на народы вокруг»."
  26: "ἤγγισεν ἕως τοῦ βασιλέως τὸ ὄνομα αὐτοῦ — «дошло до царя имя его»; ὑπὲρ τῶν παρατάξεων Ιουδου — «о построениях (битвах) Иуды» (παράταξις); ἐξηγεῖτο τὰ ἔθνη — «рассказывали народы» (ἐξηγέομαι)."
  27: "ὠργίσθη θυμῷ — «разгневался яростью»; συνήγαγεν τὰς δυνάμεις πάσας — «собрал все силы»; παρεμβολὴν ἰσχυρὰν σφόδρα — «стан весьма сильный»."
  28: "ἤνοιξεν τὸ γαζοφυλάκιον — «открыл сокровищницу» (γαζοφυλάκιον); ἔδωκεν ὀψώνια — «дал жалованье» (ὀψώνιον); εἰς ἐνιαυτόν — «на год»; εἶναι ἑτοίμους εἰς πᾶσαν χρείαν — «быть готовыми на всякую нужду»."
  29: "ἐξέλιπεν τὸ ἀργύριον ἐκ τῶν θησαυρῶν — «оскудело серебро из сокровищниц» (ἐκλείπω); οἱ φόροι τῆς χώρας ὀλίγοι — «подати страны малы»; χάριν τῆς διχοστασίας καὶ πληγῆς — «из-за раздора и поражения» (διχοστασία — 内紛[ないふん]; πληγή — 打撃[だげき]); τοῦ ἆραι τὰ νόμιμα — «чтобы отнять установления»."
  30: "εὐλαβήθη μὴ οὐκ ἔχῃ — «убоялся, что не будет иметь» (εὐλαβέομαι); ὡς ἅπαξ καὶ δίς — «как (только) раз и два»; εἰς τὰς δαπάνας καὶ τὰ δόματα — «на издержки и дары» (δαπάνη — 出費[しゅっぴ]); δαψιλῇ χειρί — «щедрою рукою» (δαψιλής); ἐπερίσσευσεν ὑπὲρ τοὺς βασιλεῖς — «превзошёл царей»."
  31: "ἠπορεῖτο τῇ ψυχῇ αὐτοῦ σφόδρα — «был в крайнем затруднении душою» (ἀπορέω); ἐβουλεύσατο τοῦ πορευθῆναι εἰς τὴν Περσίδα — «решил идти в Персиду» (ペルシア); λαβεῖν τοὺς φόρους — «взять подати»."
  32: "κατέλιπεν Λυσίαν — «оставил Лисия» (リュシアス); ἄνθρωπον ἔνδοξον καὶ ἀπὸ γένους τῆς βασιλείας — «мужа славного и из рода царского»; ἐπὶ τῶν πραγμάτων τοῦ βασιλέως — «над делами царя», т. е. правителем; ἀπὸ τοῦ ποταμοῦ Εὐφράτου ἕως ὁρίων Αἰγύπτου — «от реки Евфрата до пределов Египта»."
  33: "τρέφειν Ἀντίοχον τὸν υἱὸν αὐτοῦ — «питать (воспитывать) Антиоха, сына его»; ἕως τοῦ ἐπιστρέψαι αὐτόν — «до возвращения его»."
  34: "παρέδωκεν αὐτῷ τὰς ἡμίσεις τῶν δυνάμεων — «передал ему половины сил»; τοὺς ἐλέφαντας — «слонов»; ἐνετείλατο περὶ πάντων, ὧν ἠβούλετο — «заповедал о всём, чего хотел»; περὶ τῶν κατοικούντων τὴν Ιουδαίαν — «о живущих в Иудее»."
  35: "ἀποστεῖλαι ἐπ' αὐτοὺς δύναμιν — «послать на них силу»; ἐκτρῖψαι καὶ ἐξᾶραι — «стереть и исторгнуть» (ἐκτρίβω); τὸ κατάλειμμα Ιερουσαλημ — «остаток Иерусалима»; ἆραι τὸ μνημόσυνον αὐτῶν — «отнять память их»."
  36: "κατοικίσαι υἱοὺς ἀλλογενεῖς — «поселить сынов иноплеменных» (ἀλλογενής); κατακληροδοτῆσαι τὴν γῆν — «разделить землю по жребию» (κατακληροδοτέω)."
  37: "παρέλαβεν τὰς ἡμίσεις τῶν δυνάμεων — «взял половины сил»; ἀπῆρεν ἀπὸ Ἀντιοχείας — «отправился из Антиохии»; ἔτους ἑβδόμου καὶ τεσσαρακοστοῦ καὶ ἑκατοστοῦ — «года сто сорок седьмого» (147 г.); διεπέρασεν τὸν Εὐφράτην — «перешёл Евфрат»; τὰς ἐπάνω χώρας — «верхние страны»."
  38: "ἐπέλεξεν Λυσίας — «избрал Лисий» (ἐπιλέγω); Πτολεμαῖον τὸν Δορυμένους — «Птолемея, сына Дорименова» (ドリュメノス); Νικάνορα — ニカノル; Γοργίαν — ゴルギアス; ἄνδρας δυνατοὺς τῶν φίλων τοῦ βασιλέως — «мужей сильных из друзей царя»."
  39: "τεσσαράκοντα χιλιάδας ἀνδρῶν — «сорок тысяч мужей»; ἑπτακισχιλίαν ἵππον — «семь тысяч конницы»; καταφθεῖραι αὐτήν — «разорить её» (καταφθείρω); κατὰ τὸν λόγον τοῦ βασιλέως — «по слову царя»."
  40: "ἀπῆρεν σὺν πάσῃ τῇ δυνάμει — «отправились со всею силою»; παρενέβαλον πλησίον Αμμαους — «расположились станом близ Еммаума» (エンマウス); ἐν τῇ γῇ τῇ πεδινῇ — «в земле равнинной» (πεδινός)."
  41: "οἱ ἔμποροι τῆς χώρας — «купцы страны» (ἔμπορος — 商人[しょうにん]); ἔλαβον ἀργύριον καὶ χρυσίον πολὺ σφόδρα — «взяли серебра и золота весьма много»; πέδας — «оковы (кандалы)» (πέδη — 足枷[あしかせ]); λαβεῖν… εἰς παῖδας — «взять… в рабы»; δύναμις Συρίας καὶ γῆς ἀλλοφύλων — «сила Сирии и земли иноплеменных» (ἀλλόφυλοι — ペリシテ人)."
  42: "ἐπληθύνθη τὰ κακὰ — «умножились бедствия»; αἱ δυνάμεις παρεμβάλλουσιν ἐν τοῖς ὁρίοις αὐτῶν — «силы располагаются станом в пределах их»; ἐπέγνωσαν τοὺς λόγους τοῦ βασιλέως — «узнали слова царя»; εἰς ἀπώλειαν καὶ συντέλειαν — «на погибель и скончание» (συντέλεια — 絶[た]え果[は]てること)."
  43: "Ἀναστήσωμεν τὴν καθαίρεσιν τοῦ λαοῦ ἡμῶν — «восставим низвержение (падение) народа нашего» (καθαίρεσις); πολεμήσωμεν περὶ τοῦ λαοῦ ἡμῶν καὶ τῶν ἁγίων — «будем воевать за народ наш и святыни». Слова друг другу — 「…」."
  44: "ἠθροίσθη ἡ συναγωγή — «собралось собрание»; τοῦ εἶναι ἑτοίμους εἰς πόλεμον — «чтобы быть готовыми к войне»; προσεύξασθαι καὶ αἰτῆσαι ἔλεος καὶ οἰκτιρμούς — «помолиться и испросить милость и щедроты» (οἰκτιρμός — 慈[じ]しみ)."
  45: "ἀοίκητος ὡς ἔρημος — «необитаем, как пустыня»; ὁ εἰσπορευόμενος καὶ ἐκπορευόμενος — «входящий и выходящий»; ἐκ τῶν γενημάτων αὐτῆς — «из порождений (уроженцев) его»; καταπατούμενον — «попираемо» (καταπατέω); ἐν τῇ ἄκρα — «в акре (крепости)»; κατάλυμα τοῖς ἔθνεσιν — «жилище язычникам» (κατάλυμα — 宿[やど]); ἐξήρθη τέρψις ἐξ Ιακωβ — «отнята радость у Иакова» (τέρψις — 喜[よろこ]び); ἐξέλιπεν αὐλὸς καὶ κινύρα — «оскудела свирель и кинура» (αὐλός — 笛[ふえ]; κινύρα — 竪琴[たてごと])."
  46: "συνήχθησαν καὶ ἤλθοσαν εἰς Μασσηφα — «собрались и пришли в Массифу» (ミツパ); κατέναντι Ιερουσαλημ — «напротив Иерусалима»; τόπος προσευχῆς ἦν… τὸ πρότερον — «место молитвы было… прежде»."
  47: "ἐνήστευσαν — «постились» (νηστεύω); περιεβάλοντο σάκκους — «облеклись во вретища»; σποδὸν ἐπὶ τὴν κεφαλήν — «пепел на голову» (σποδός — 灰[はい]); διέρρηξαν τὰ ἱμάτια — «разодрали одежды»."
  48: "ἐξεπέτασαν τὸ βιβλίον τοῦ νόμου — «раскрыли (распростёрли) книгу закона» (ἐκπετάννυμι); περὶ ὧν ἐξηρεύνων τὰ ἔθνη — «о которых (на которых) разыскивали язычники»; τὰ ὁμοιώματα τῶν εἰδώλων αὐτῶν — «подобия идолов их» (ὁμοίωμα — 像[かたち]). Смысл: язычники искали место на свитке, чтобы начертать изображения идолов."
  49: "τὰ ἱμάτια τῆς ἱερωσύνης — «одежды священства»; τὰ πρωτογενήματα — «первородное (начатки)» (πρωτογένημα — 初[はつ]物[もの]); τὰς δεκάτας — «десятины»; ἤγειραν τοὺς ναζιραίους — «воздвигли (созвали) назореев» (ναζιραῖος — ナジル人[じん]); οἳ ἐπλήρωσαν τὰς ἡμέρας — «которые исполнили дни»."
  50: "ἐβόησαν φωνῇ εἰς τὸν οὐρανόν — «возопили голосом к небу»; Τί ποιήσωμεν τούτοις — «что сделаем с ними»; ποῦ αὐτοὺς ἀπαγάγωμεν — «куда их отведём» (ἀπάγω). Молитва — 「…」, продолжается до 53."
  51: "τὰ ἅγιά σου καταπεπάτηνται — «святыни Твои попраны» (καταπατέω); βεβήλωνται — «осквернены» (βεβηλόω); ἐν πένθει καὶ ταπεινώσει — «в плаче и уничижении» (ταπείνωσις — 卑[ひ]下[げ])."
  52: "τὰ ἔθνη συνῆκται ἐφ' ἡμᾶς — «язычники собрались на нас» (συνάγω); τοῦ ἐξᾶραι ἡμᾶς — «чтобы истребить нас»; σὺ οἶδας ἃ λογίζονται ἐφ' ἡμᾶς — «Ты знаешь, что они замышляют против нас» (λογίζομαι)."
  53: "πῶς δυνησόμεθα ὑποστῆναι — «как сможем устоять» (ὑφίστημι); κατὰ πρόσωπον αὐτῶν — «пред лицом их»; ἐὰν μὴ σὺ βοηθήσῃς ἡμῖν — «если Ты не поможешь нам». Здесь молитва закрывается."
  54: "ἐσάλπισαν ταῖς σάλπιγξιν — «вострубили трубами» (σαλπίζω; σάλπιγξ — ラッパ); ἐβόησαν φωνῇ μεγάλῃ — «возопили голосом великим»."
  55: "κατέστησεν ἡγουμένους τοῦ λαοῦ — «поставил вождей народа» (ἡγούμενος); χιλιάρχους καὶ ἑκατοντάρχους καὶ πεντηκοντάρχους καὶ δεκαδάρχους — «тысяченачальников, стоначальников, пятидесятиначальников и десятиначальников»."
  56: "τοῖς οἰκοδομοῦσιν οἰκίας — «строящим дома»; μνηστευομένοις γυναῖκας — «обручающимся с жёнами» (μνηστεύομαι); φυτεύουσιν ἀμπελῶνας — «насаждающим виноградники»; δειλοῖς — «робким» (δειλός); ἀποστρέφειν ἕκαστον εἰς τὸν οἶκον αὐτοῦ κατὰ τὸν νόμον — «возвратиться каждому в дом свой по закону» (Втор 20:5–8)."
  57: "ἀπῆρεν ἡ παρεμβολή — «двинулся стан»; κατὰ νότον Αμμαους — «к югу от Еммаума» (νότος — 南[みなみ])."
  58: "Περιζώσασθε — «препояшьтесь» (περιζώννυμι); γίνεσθε εἰς υἱοὺς δυνατούς — «станьте сынами сильными»; εἰς πρωΐ — «к утру» (πρωΐ — 朝[あさ]早[はや]く); τοῖς ἐπισυνηγμένοις ἐφ' ἡμᾶς — «собравшимся на нас» (ἐπισυνάγω)."
  59: "κρεῖσσον ἡμᾶς ἀποθανεῖν ἐν τῷ πολέμῳ — «лучше нам умереть на войне» (κρείσσων); ἢ ἐπιδεῖν ἐπὶ τὰ κακὰ τοῦ ἔθνους ἡμῶν — «нежели видеть бедствия народа нашего» (ἐπεῖδον — увидеть); τῶν ἁγίων — «святынь»."
  60: "ὡς δ' ἂν ᾖ θέλημα ἐν οὐρανῷ — «как будет воля на небе»; οὕτως ποιήσει — «так и сделает». Слав. «якоже воля будет на небеси, тако сотворит»."
