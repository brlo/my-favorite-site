# jp-box, Послание к Филимону, глава 1. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 1 (единственная): надписание и приветствие (1–3), благодарение и молитва (4–7),
# просьба за Онисима (8–21), надежда на приход, приветствия и благословение (22–25).
# Красного и синего нет: 1:18–19 говорит Павел («если он чем обидел тебя, считай на мне»),
# прямая речь Христа в послании не звучит — <j>/<mo> не ставятся.
# 〔…〕 в главе нет: [καὶ] (1:11) стоит в базе в квадратных скобках критического издания,
# слово в базе есть, поэтому не оборачивается (проверено запросом к gr-lxx-byz).
# 1:25 πνεῦμα без ἅγιον — «с вашим духом», поэтому 霊[れい], а не пара {聖霊|聖神}.
# Игра слов Ὀνήσιμος / ἄχρηστος / εὔχρηστος / ὀναίμην разобрана в notes (1:11, 1:20).
# Термины выровнены по корпусу: κοινωνός — 仲間 (2 Кор 8:23), συνεργός — 同労者,
# συστρατιώτης — 戦友 (Флп 2:25), παρρησία — 大胆さ (Деян 4:29), σπλάγχνα — 心 (2 Кор 7:15).
# Сносок ⟨…⟩ в главе нет: все имена уже встречались в корпусе (Кол 4, Деян). jp-ni не использовался.

tr_code: jp-box
book: fm
chapter: 1
draft: true

verses:
  1: "キリスト・イエスの囚人[しゅうじん]であるパウロと、兄弟[きょうだい]テモテから、愛[あい]する者[もの]、わたしたちの同労[どうろう]者[しゃ]ピレモンへ。"
  2: "また、姉妹[しまい]アピア、わたしたちの戦友[せんゆう]アルキポ、そしてあなたの家[いえ]にある教会[きょうかい]へ。"
  3: "{恵[めぐ]み|恩寵[おんちょう]}と平和[へいわ]が、わたしたちの父[ちち]である神[かみ]と主[しゅ]イエス・キリストから、あなたがたにありますように。"
  4: "わたしは、わたしの神[かみ]にいつも感謝[かんしゃ]している。祈[いの]りのうちにあなたを思[おも]い起[おこ]しつつ、"
  5: "あなたの愛[あい]と、主[しゅ]イエスに対[たい]し、またすべての聖[せい]なる者[もの]たちに対[たい]する信仰[しんこう]とを聞[き]いているからである。"
  6: "あなたの信仰[しんこう]の交[かか]わりが、わたしたちのうちにあり、キリストに向[む]かうすべての善[よ]いものの認識[にんしき]において、生[い]きて働[はたら]くものとなりますように。"
  7: "兄弟[きょうだい]よ、わたしは、あなたの愛[あい]によって大[おお]きな喜[よろこ]びと慰[なぐさ]めを受[う]けた。あなたによって、聖[せい]なる者[もの]たちの心[こころ]が安[やす]められたからである。"
  8: "だから、キリストにあって、あなたにふさわしいことを命[めい]じる大[おお]きな大胆[だいたん]さを持[も]っているが、"
  9: "愛[あい]のゆえに、むしろお願[ねが]いする。老[お]いた者[もの]パウロ、今[いま]はキリスト・イエスの囚人[しゅうじん]となった者が、"
  10: "わたしの子[こ]オネシモのことを、あなたにお願[ねが]いする。彼[かれ]は、わたしが囚[とら]われの身[み]にある間に生[う]んだ子[こ]である。"
  11: "彼[かれ]は、かつてはあなたにとって役[やく]に立[た]たない者[もの]であったが、今[いま]はあなたにもわたしにも役[やく]に立[た]つ者[もの]である。"
  12: "彼[かれ]を、すなわち、わたしの心[こころ]そのものを、あなたのもとへ送[おく]り返[かえ]す。"
  13: "わたしは、彼[かれ]をわたしのそばに置[お]いて、福音[ふくいん]のための囚[とら]われの身[み]にあるわたしに、あなたに代[か]わって仕[つか]えさせたいと望[のぞ]んだ。"
  14: "しかし、あなたの同意[どうい]なしには、何[なに]一つしたくなかった。それは、あなたの善[よ]い行[おこな]いが、強[し]いられたものではなく、自[し]発的[はつてき]なものとなるためである。"
  15: "というのは、彼[かれ]がしばらくあなたから離[はな]れたのは、あなたが彼[かれ]を永遠[えいえん]に受[う]け入[い]れるためであったのかもしれない。"
  16: "もはや奴隷[どれい]としてではなく、奴隷[どれい]以上の者[もの]、愛[あい]する兄弟[きょうだい]として。わたしにとっては特[とく]にそうであり、あなたにとってはなおさら、肉[にく]においても主[しゅ]においても、そうである。"
  17: "そこで、もしあなたがわたしを仲間[なかま]として認[みと]めるなら、わたしを迎[むか]えるのと同じように、彼[かれ]を迎[むか]え入[い]れなさい。"
  18: "もし彼[かれ]があなたに何[なに]か害[がい]を加[くわ]え、あるいは負[お]い目[め]があるなら、それはわたしの負[お]い目[め]にしてください。"
  19: "わたし、パウロが、自分[じぶん]の手[て]で書[か]いた。わたしが返[かえ]す。あなたがわたしに、自分[じぶん]自身[じしん]さえも負[お]っていることは、言[い]わないでおく。"
  20: "兄弟[きょうだい]よ、主[しゅ]にあって、わたしにあなたから益[えき]を受[う]けさせてほしい。キリストにあって、わたしの心[こころ]を安[やす]らかにしてほしい。"
  21: "わたしは、あなたの従順[じゅうじゅん]を確[かく]信[しん]して、あなたにこれを書[か]いた。わたしが言[い]うこと以上[いじょう]のことを、あなたはしてくれると知[し]っている。"
  22: "同時[どうじ]に、わたしのために宿[やど]を用意[ようい]しておいてほしい。わたしは、あなたがたの祈[いの]りによって、あなたがたに与[あた]えられることを望[のぞ]んでいるからである。"
  23: "キリスト・イエスにあって、わたしとともに囚人[しゅうじん]となっているエパフラスが、あなたによろしくと言[い]っている。"
  24: "わたしの同労[どうろう]者[しゃ]であるマルコ、アリスタルコ、デマス、ルカも、よろしくと言[い]っている。"
  25: "主[しゅ]イエス・キリストの{恵[めぐ]み|恩寵[おんちょう]}が、あなたがたの霊[れい]とともにありますように。"

notes:
  1: "Παῦλος δέσμιος Χριστοῦ Ἰησοῦ — キリスト・イエスの囚人であるパウロ (δέσμιος — «узник»; в Флм Павел не называет себя апостолом). Τιμόθεος ὁ ἀδελφός — 兄弟テモテ. Φιλήμονι τῷ ἀγαπητῷ καὶ συνεργῷ ἡμῶν — 愛する者、わたしたちの同労者ピレモン (συνεργός — 同労者, как в Кол 4:17)."
  2: "Ἀπφίᾳ τῇ ἀδελφῇ — 姉妹アピア (ἀδελφή о женщине-христианке; в корпусе 姉妹[しまい]). Ἀρχίππῳ τῷ συστρατιώτῃ — 戦友アルキポ (συστρατιώτης; ср. Кол 4:17). τῇ κατ᾽ οἶκόν σου ἐκκλησίᾳ — あなたの家にある教会: σου — ед. ч., как в греч."
  3: "χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ — 恵みと平和が…から、あなたがたに (формула приветствия в пастырских)."
  4: "Εὐχαριστῶ τῷ θεῷ μου πάντοτε — わたしの神にいつも感謝している. μνείαν σου ποιούμενος ἐπὶ τῶν προσευχῶν μου — 祈りのうちにあなたを思い起こしつつ (μνεία — память, упоминание; ср. 1 Сол 1:2)."
  5: "ἀκούων σου τὴν ἀγάπην καὶ τὴν πίστιν — あなたの愛と…信仰とを聞いている (ἀκούων — причинное деепричастие). ἣν ἔχεις πρὸς τὸν κύριον Ἰησοῦν καὶ εἰς πάντας τοὺς ἁγίους — 主イエスに対し、またすべての聖なる者たちに対する: два разных предлога (πρός и εἰς) сохранены."
  6: "ὅπως ἡ κοινωνία τῆς πίστεώς σου ἐνεργὴς γένηται — あなたの信仰の交わりが…生きて働くものとなりますように (κοινωνία — общение, общность; ἐνεργής — действенный). ἐν ἐπιγνώσει παντὸς ἀγαθοῦ τοῦ ἐν ἡμῖν εἰς Χριστόν — …すべての善いものの認識において (εἰς Χριστόν — «ко Христу», не «во Христе»; двусмысленность не разрешена)."
  7: "χαρὰν γὰρ πολλὴν ἔσχον καὶ παράκλησιν — 大きな喜びと慰めを受けた. ἐπὶ τῇ ἀγάπῃ σου — あなたの愛によって (ἐπί — основание). τὰ σπλάγχνα τῶν ἁγίων ἀναπέπαυται διὰ σοῦ — 聖なる者たちの心が安められた (σπλάγχνα — сердце, внутренности; perfect — достигнутое состояние). ἀδελφέ — 兄弟よ, обращение перенесено в начало, где по-японски его место."
  8: "πολλὴν ἐν Χριστῷ παρρησίαν ἔχων — キリストにあって大きな大胆さを持っている (παρρησία — смелость, право говорить свободно; в корпусе 大胆/勇気, ср. Деян 4:29). ἐπιτάσσειν σοι τὸ ἀνῆκον — あなたにふさわしいことを命じる (τὸ ἀνῆκον — должное)."
  9: "διὰ τὴν ἀγάπην μᾶλλον παρακαλῶ — 愛のゆえに、むしろお願いする. τοιοῦτος ὢν ὡς Παῦλος πρεσβύτης — 老いた者パウロ (πρεσβύτης — «старец» по возрасту, не «пресвитер»). νυνὶ δὲ καὶ δέσμιος Χριστοῦ Ἰησοῦ — 今はキリスト・イエスの囚人."
  10: "παρακαλῶ σε περὶ τοῦ ἐμοῦ τέκνου — わたしの子のことを、あなたにお願いする. ὃν ἐγέννησα ἐν τοῖς δεσμοῖς — 囚われの身にある間に生んだ (γεννάω — «родил», о духовном рождении; ср. 1 Кор 4:15). Ὀνήσιμος — オネシモ (ср. Кол 4:9)."
  11: "τὸν ποτέ σοι ἄχρηστον — かつてはあなたにとって役に立たない者 (ἄχρηστος). νυνὶ δὲ [καὶ] σοὶ καὶ ἐμοὶ εὔχρηστον — 今はあなたにもわたしにも役に立つ者 (εὔχρηστος); [καὶ] в базе есть, 〔…〕 не ставятся. Игра слов: Ὀνήσιμος — «полезный»; по-японски передана 役に立つ / 益 (ср. ст. 20)."
  12: "ὃν ἀνέπεμψά σοι — 彼を…送り返す (ἀναπέμπω — отослать обратно). αὐτὸν τοῦτ᾽ ἔστιν τὰ ἐμὰ σπλάγχνα — すなわち、わたしの心そのもの (σπλάγχνα — здесь о самом дорогом, «моё сердце»)."
  13: "ὃν ἐγὼ ἐβουλόμην πρὸς ἐμαυτὸν κατέχειν — わたしのそばに置いておきたいと望んだ (κατέχω — удерживать при себе). ἵνα ὑπὲρ σοῦ μοι διακονῇ — あなたに代わって仕えさせ. ἐν τοῖς δεσμοῖς τοῦ εὐαγγελίου — 福音のための囚われの身 (узы — за Евангелие)."
  14: "χωρὶς δὲ τῆς σῆς γνώμης — あなたの同意なしに (γνώμη — мнение, согласие). ἵνα μὴ ὡς κατ᾽ ἀνάγκην τὸ ἀγαθόν σου ᾖ — 強いられたものではなく (ἀνάγκη — принуждение). ἀλλὰ κατὰ ἑκούσιον — 自発的なもの (ἑκούσιος — добровольный; ср. 2 Кор 9:7)."
  15: "τάχα — かもしれない («может быть»). ἐχωρίσθη πρὸς ὥραν — しばらく離れた (πρὸς ὥραν — «на час»). ἵνα αἰώνιον αὐτὸν ἀπέχῃς — 永遠に受け入れるため (ἀπέχω — получать обратно, иметь у себя; ср. 1 Кор 7:29)."
  16: "οὐκέτι ὡς δοῦλον ἀλλὰ ὑπὲρ δοῦλον — もはや奴隷としてではなく、奴隷以上の者として. ἀδελφὸν ἀγαπητόν — 愛する兄弟. μάλιστα ἐμοί — わたしにとっては特に. πόσῳ δὲ μᾶλλον σοί — あなたにとってはなおさら. ἐν σαρκὶ καὶ ἐν κυρίῳ — 肉においても主においても."
  17: "εἰ οὖν με ἔχεις κοινωνόν — もしあなたがわたしを仲間として認めるなら (κοινωνός — общник, товарищ; ср. ст. 6 κοινωνία). προσλαβοῦ αὐτὸν ὡς ἐμέ — わたしを迎えるのと同じように、彼を迎え入れなさい (προσλαμβάνω — принимать к себе)."
  18: "εἰ δέ τι ἠδίκησέν σε ἢ ὀφείλει — もし何か害を加え、あるいは負い目があるなら (ὀφείλω — быть должным). τοῦτο ἐμοὶ ἐλλόγα — それはわたしの負い目にしてください (ἐλλογάω — вменить в счёт, записать на счёт; коммерческий образ сохранён, ср. ст. 19). Говорит Павел, не Христос: красного нет."
  19: "ἐγὼ Παῦλος ἔγραψα τῇ ἐμῇ χειρί — わたし、パウロが、自分の手で書いた (собственноручная подпись-обязательство, ср. 1 Кор 16:21; Кол 4:18). ἐγὼ ἀποτίσω — わたしが返す (ἀποτίνω — выплатить). ἵνα μὴ λέγω σοι — …言わないでおく. καὶ σεαυτόν μοι προσοφείλεις — 自分自身さえも負っている (προσοφείλω — быть должным сверх того; «ты и самим собою мне должен»)."
  20: "ναί, ἀδελφέ — 兄弟よ、そう (ναί — подтверждение просьбы). ἐγώ σου ὀναίμην ἐν κυρίῳ — 主にあって、わたしにあなたから益を受けさせてほしい (ὀνίναμαι — получать пользу; optative; снова игра с Ὀνήσιμος). ἀνάπαυσόν μου τὰ σπλάγχνα ἐν Χριστῷ — キリストにあって、わたしの心を安らかにしてほしい (ἀναπαύω — дать покой)."
  21: "Πεποιθὼς τῇ ὑπακοῇ σου — あなたの従順を確信して (perfect πεποίθα). ἔγραψά σοι — あなたにこれを書いた. ὑπὲρ ἃ λέγω ποιήσεις — わたしが言うこと以上のことをしてくれる."
  22: "ἅμα δὲ καί — 同時に. ἑτοίμαζέ μοι ξενίαν — わたしのために宿を用意しておいてほしい (ξενία — гостевой покой, комната для гостя). ἐλπίζω γὰρ ὅτι — 望んでいるからである. διὰ τῶν προσευχῶν ὑμῶν χαρισθήσομαι ὑμῖν — あなたがたの祈りによって、あなたがたに与えられる (χαρίζομαι — даровать; мн. ч. «вас», хотя адресат один)."
  23: "Ἀσπάζεταί σε Ἐπαφρᾶς — エパフラスがあなたによろしくと言っている (ср. Кол 1:7; 4:12). ὁ συναιχμάλωτός μου ἐν Χριστῷ Ἰησοῦ — キリスト・イエスにあって、わたしとともに囚人となっている者 (συναιχμάλωτος)."
  24: "Μᾶρκος, Ἀρίσταρχος, Δημᾶς, Λουκᾶς — マルコ、アリスタルコ、デマス、ルカ (ср. Кол 4:10,14). οἱ συνεργοί μου — わたしの同労者たち. У jp-joc ст. 24 слит со ст. 23; в базе это отдельный стих — разделено."
  25: "ἡ χάρις τοῦ κυρίου Ἰησοῦ Χριστοῦ μετὰ τοῦ πνεύματος ὑμῶν — 主イエス・キリストの恵みが、あなたがたの霊とともに. πνεῦμα без ἅγιον — 霊[れい], не пара {聖霊|聖神}. ἀμήν в базе нет — не добавлено."
