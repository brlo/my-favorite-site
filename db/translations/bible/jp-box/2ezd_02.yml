# jp-box, 2-я Ездры, глава 2. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге нет; jp-ni (под авторским правом) не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 2: указ Кира (1–11: указ 2–4, возвращение и помощь 5–6, сосуды 7–11);
# письмо самарян Артаксерксу (12–18), ответ царя (19–24), остановка стройки (25–26).
# Указ (2:2–4) и оба письма (2:13–18; 2:20–24) — 「…」; красного и синего нет.
# Нумерация по gr: 26 стихов; у csl 31, деление иное. Выравнивание по содержанию:
# gr 2:1 = csl 2:1–2; 2:2 = 3–4; 2:3 = 5; 2:4 = 6–7; 2:5 = 8; 2:6 = 9; 2:7 = 10;
# 2:8 = 11–12; 2:9–10 = 13; 2:11 = 14–15; 2:12 = 16; 2:13 = 17; 2:14 = 18;
# 2:15 = 19; 2:16 = 20–21; 2:17 = 22–23; 2:18 = 24; 2:19 = 25; 2:20 = 26a;
# 2:21 = 26b–27a; 2:22 = 27b; 2:23 = 28a; 2:24 = 28b–29; 2:25 = 30; 2:26 = 31.
# 〔…〕 нет: все 26 стихов есть в gr-lxx-byz; слова в квадратных скобках издания
# (2:3 οὗτος ὁ κύριος...) есть и в csl, поэтому без скобок.
# Сносок ⟨…⟩ нет: 神殿, 祭壇, 祭司, レビ人, 宝物, 太守, 貢ぎ уже в корпусе.

