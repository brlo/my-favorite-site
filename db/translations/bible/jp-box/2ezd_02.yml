verses:
  1: "ペルシアの王[おう]クロスの第一年[だいいちねん]、主[しゅ]がエレミヤの口[くち]を通[とお]して語[かた]られた言葉[ことば]が成就[じょうじゅ]するために、"
  2: "主[しゅ]はペルシアの王[おう]クロスの霊[れい]を奮[ふる]い起[お]こされた。クロスは自分の王国[おうこく]のすべてに、口[くち]づてにもまた書[しょ]をもって告[つ]げ知[し]らせ、こう言[い]った。"
  3: "「ペルシアの王[おう]クロスはこう言[い]う。イスラエルの主[しゅ]、いと高[たか]き主[しゅ]は、わたしを全世界[ぜんせかい]の王[おう]とされた。"
  4: "そして、ユダにあるエルサレムに、ご自分[じぶん]のために家[いえ]を建[た]てるよう、わたしに命[めい]じられた。"
  5: "だから、あなたがたのうち、その民[たみ]に属[ぞく]する者[もの]がいるなら、その人[ひと]の主[しゅ]がその人とともにおられるように。その人[ひと]は、ユダにあるエルサレムに上[のぼ]って行[い]き、イスラエルの主[しゅ]の家[いえ]を建[た]てよ。この方[かた]こそ、エルサレムに住[す]まわれる主[しゅ]である。"
  6: "また、各地[かくち]に住[す]む者[もの]のうち、その人[ひと]の土地[とち]にいる者[もの]たちは、金[きん]や銀[ぎん]、"
  7: "贈[おく]り物[もの]、馬[うま]や家畜[かちく]、またエルサレムにある主[しゅ]の聖所[せいしょ]のために誓願[せいがん]に従[したが]って加[くわ]えられるほかの物[もの]をもって、その人[ひと]を助[たす]けよ。」"
  8: "そこで、ユダとベニヤミンの部族[ぶぞく]の氏族[しぞく]の長[かしら]たち、祭司[さいし]たち、レビ人[びと]たち、また、エルサレムにある主[しゅ]の家[いえ]を建[た]てるために上[のぼ]って行[い]くよう、主[しゅ]がその霊[れい]を奮[ふる]い起[お]こしたすべての者[もの]が立[た]ち上[あ]がった。"
  9: "また、彼[かれ]らの周[まわ]りにいた者[もの]たちはすべて、銀[ぎん]と金[きん]、馬[うま]や家畜[かちく]、および非常[ひじょう]に多[おお]くの誓願[せいがん]の捧[ささ]げ物[もの]によって彼[かれ]らを助[たす]けた。それらは、心[こころ]を奮[ふる]い起[お]こされた多[おお]くの者[もの]たちのものであった。"
  10: "また、クロス王[おう]は主[しゅ]の聖[せい]なる器[うつわ]を出[だ]した。それは、バビロンの王[おう]ネブカドネツァルがエルサレムから運[はこ]び去[さ]り、自分[じぶん]の偶像[ぐうぞう]の宮[みや]に据[す]えたものである。"
  11: "クロス王[おう]はそれらを出[だ]して、自分[じぶん]の宝物[たからもの]を管理[かんり]する者[もの]ミトラダテスに渡[わた]した。"
  12: "そして、この人[ひと]を通[とお]して、ユダヤの統治者[とうちしゃ]サナバサルに渡[わた]された。"
  13: "その数[かず]は次[つぎ]のとおりである。金[きん]の注[そそ]ぎの器[うつわ]千[せん]、銀[ぎん]の注ぎの器千、銀[ぎん]の香炉[こうろ]二十九[にじゅうきゅう]、金[きん]の鉢[はち]三十[さんじゅう]、銀[ぎん]の鉢二千四百十[にせんよんひゃくじゅう]、そのほかの器[うつわ]千。"
  14: "金[きん]と銀[ぎん]のすべての器[うつわ]は、合[あ]わせて五千四百六十九[ごせんよんひゃくろくじゅうきゅう]であった。"
  15: "それらはサナバサルによって、バビロンからの捕囚[ほしゅう]の者[もの]たちとともにエルサレムへ運[はこ]び上[あ]げられた。"
  16: "ペルシアの王[おう]アルタシャスタの時代[じだい]に、ベスレモス、ミトラダテス、タベリオス、ラウモス、ベエルテモス、書記官[しょきかん]サムサイオス、および彼[かれ]らに連[つら]なる残[のこ]りの者[もの]たちで、サマリアやほかの場所[ばしょ]に住[す]む者[もの]たちが、ユダヤとエルサレムに住む者[もの]たちに逆[さか]らって、次[つぎ]のように書[か]かれた書簡[しょかん]を彼[かれ]に書[か]き送[おく]った。"
  17: "「アルタシャスタ王[おう]、主[しゅ]よ。あなたのしもべたち、すなわち出来事[できごと]を記[しる]す者[もの]ラウモス、書記官[しょきかん]サムサイオス、および彼[かれ]らの議会[ぎかい]の残[のこ]りの者[もの]たち、コイレ・シリアとフェニキアにいる裁[さば]き手[て]たちより。"
  18: "今[いま]、主[しゅ]である王[おう]に知[し]らせる。あなたがたのもとからわたしたちのところへ上[のぼ]って来[き]たユダヤ人[じん]たちは、エルサレムに来[き]て、背[そむ]いた悪[わる]い町[まち]を建[た]てており、その市場[いちば]を整[ととの]え、城壁[じょうへき]を修復[しゅうふく]し、神殿[しんでん]の基[もとい]を据[す]えている。"
  19: "それゆえ、もしこの町[まち]が建[た]てられ、城壁[じょうへき]が完成[かんせい]するなら、彼らは貢[みつ]ぎを納[おさ]めることを甘[あま]んじず、王[おう]たちにさえ逆[さか]らうであろう。"
  20: "また、神殿[しんでん]のことが進[すす]められているので、わたしたちはこのことを見過[みす]ごすべきではなく、"
  21: "わたしたちの主[しゅ]である王[おう]に申[もう]し上[あ]げるのがよいと考[かんが]える。もし王[おう]に良[よ]いと思[おも]われるなら、あなたの父祖[ふそ]たちの書[しょ]を調[しら]べさせてほしい。"
  22: "そうすれば、あなたは記録[きろく]の書[しょ]の中に、これらのことについて書[か]かれたものを見[み]いだし、"
  23: "あの町[まち]が背[そむ]いた町であり、王[おう]たちや町[まち]々[まち]を乱[みだ]したこと、またユダヤ人[じん]が背[そむ]きの者[もの]であり、昔[むかし]からその中[なか]で軍勢[ぐんぜい]を集[あつ]めていたことを知[し]るであろう。そのために、この町も荒[あ]らされたのである。"
  24: "それゆえ今[いま]、主[しゅ]である王[おう]よ、わたしたちはあなたに知[し]らせる。もしこの町[まち]が建[た]てられ、その城壁[じょうへき]が築[きず]き上[あ]げられるなら、あなたがコイレ・シリアとフェニキアへ下[くだ]ることは、もはやできなくなるであろう。」"
  25: "そこで王[おう]は、出来事[できごと]を記[しる]す者[もの]ラウモス、ベエルテモス、書記官[しょきかん]サムサイオス、および彼らに連[つら]なり、サマリアとシリアとフェニキアに住[す]む残[のこ]りの者[もの]たちに、次[つぎ]のように書[か]き返[かえ]した。"
  26: "「わたしは、あなたがたがわたしに送[おく]った書簡[しょかん]を読[よ]んだ。そこで、わたしは調[しら]べるように命[めい]じた。すると、あの町[まち]は昔[むかし]から王[おう]たちに逆[さか]らって陣[じん]を構[かま]え、"
  27: "その中[なか]で人[ひと]々[びと]が背[そむ]きと戦[いくさ]を起[お]こしてきたことが見[み]いだされた。また、エルサレムには強[つよ]く激[はげ]しい王[おう]たちがいて、コイレ・シリアとフェニキアを支配[しはい]し、貢[みつ]ぎを課[か]していた。"
  28: "それゆえ今[いま]、わたしはあの人[ひと]々[びと]がこの町[まち]を建[た]てることを禁[きん]じるように命[めい]じた。また、これらに反[はん]する何[なに]も起[お]こらないように、"
  29: "また悪[わる]いことが進[すす]んで王[おう]たちを煩[わずら]わせることがないように、見張[みは]るように命じた。」"
  30: "そこで、アルタシャスタ王[おう]から書[か]かれたものが読[よ]まれると、ラウモスと書記官[しょきかん]サムサイオス、および彼らに連[つら]なる者[もの]たちは、騎兵[きへい]と民[たみ]の軍勢[ぐんぜい]を率[ひき]いて急[いそ]ぎエルサレムへ出発[しゅっぱつ]し、建[た]てている者[もの]たちを妨[さまた]げ始[はじ]めた。"
  31: "こうして、エルサレムにある神殿[しんでん]の建設[けんせつ]は、ペルシアの王[おう]ダリウスの治世[ちせい]の第二年[だいにねん]まで止[や]んだ。"

notes:
  1: "Βασιλεύοντος Κύρου Περσῶν ἔτους πρώτου — «когда царствовал Кир Персидский, в первый год» (родительный абсолютный). εἰς συντέλειαν ῥήματος κυρίου ἐν στόματι Ιερεμιου — «к исполнению слова Господня устами Иеремии» (συντέλεια, ῥῆμα, στόμα). ἤγειρεν κύριος τὸ πνεῦμα Κύρου — возбудил Господь дух Кира; ἐκήρυξεν ἐν ὅλῃ τῇ βασιλείᾳ αὐτοῦ — объявил по всему царству своему; ἅμα διὰ γραπτῶν λέγων — «вместе и через письма, говоря». csl 2:1–2 = gr 2:1. Наш ст. 1 = csl 2:1 (первая половина gr 2:1)."
  2: "Продолжение gr 2:1 (= csl 2:2): ἤγειρεν κύριος τὸ πνεῦμα Κύρου βασιλέως Περσῶν — «воздвиг Господь дух Кира, царя Персидского»; ἐκήρυξεν ἐν ὅλῃ τῇ βασιλείᾳ αὐτοῦ καὶ ἅμα διὰ γραπτῶν λέγων — «объявил по всему царству своему и вместе через письма, говоря»; слав. «воздвиже Господь дух кира царя персскаго, и проповеда во всем царстве своем, и купно писаньми, глаголя»."
  3: "Τάδε λέγει — так говорит. Ἐμὲ ἀνέδειξεν βασιλέα τῆς οἰκουμένης — меня поставил царём вселенной (ἀναδείκνυμι, οἰκουμένη); κύριος τοῦ Ισραηλ, κύριος ὁ ὕψιστος — Господь Израиля, Господь Всевышний. ἐσήμηνέν μοι οἰκοδομῆσαι — «дал мне знамение» (σημαίνω), т. е. повелел; слав. «назнамена мне создати». csl 2:3–4 = gr 2:2."
  4: "Продолжение gr 2:2 (= csl 2:4): ἐσήμηνέν μοι οἰκοδομῆσαι αὐτῷ οἶκον ἐν Ιερουσαλημ τῇ ἐν τῇ Ιουδαίᾳ — «дал мне знамение построить Ему дом в Иерусалиме, что в Иудее»; слав. «назнамена мне создати ему дом во Иерусалиме, иже во иудеи»."
  5: "εἴ τίς ἐστιν οὖν ὑμῶν ἐκ τοῦ ἔθνους αὐτοῦ — если кто из вас из народа Его. ἔστω ὁ κύριος αὐτοῦ μετ᾿ αὐτοῦ — да будет Господь его с ним. ἀναβὰς … οἰκοδομείτω — взойдя, пусть строит (императив). [οὗτος ὁ κύριος ὁ κατασκηνώσας ἐν Ιερουσαλημ] — «это Господь, поселившийся в Иерусалиме»: в квадратных скобках издания, но есть и в csl («сей Господь, иже вселися во Иерусалиме»), поэтому без 〔…〕. csl 2:5 = gr 2:3."
  6: "ὅσοι κατὰ τόπους οἰκοῦσιν — все, живущие по местам. βοηθείτωσαν αὐτῷ οἱ ἐν τῷ τόπῳ αὐτοῦ — пусть помогают ему живущие в месте его. ἐν χρυσίῳ καὶ ἀργυρίῳ ἐν δόσεσιν — золотом и серебром, дарами (δόσις); μεθ᾿ ἵππων καὶ κτηνῶν — с конями и скотом. κατ᾿ εὐχὰς προστεθειμένοις — приложенными по обетам (εὐχή); εἰς τὸ ἱερόν — в святилище (ἱερόν). csl 2:6–7 = gr 2:4."
  7: "Продолжение gr 2:4 (= csl 2:7): μεθ᾽ ἵππων καὶ κτηνῶν — с конями и скотом; σὺν τοῖς ἄλλοις τοῖς κατ᾽ εὐχὰς προστεθειμένοις εἰς τὸ ἱερὸν τοῦ κυρίου τὸ ἐν Ιερουσαλημ — «с прочим, по обетам приложенным в святилище Господне, что в Иерусалиме»; слав. «даянием с конми и скоты и иными по обещанию предлагаемыми во святилище Господне, еже во Иерусалиме»."
  8: "καταστάντες οἱ ἀρχίφυλοι τῶν πατριῶν — представшие главы родов (ἀρχίφυλος, πατριά). τῆς Ιουδα καὶ Βενιαμιν φυλῆς — колена Иуды и Вениамина (φυλή). ὧν ἤγειρεν κύριος τὸ πνεῦμα — кому Господь возбудил дух. ἀναβῆναι οἰκοδομῆσαι — взойти, чтобы строить. csl 2:8 = gr 2:5."
  9: "οἱ περικύκλῳ αὐτῶν — окружающие их (περικύκλῳ). ἐβοήθησαν ἐν πᾶσιν — помогли во всём. εὐχαῖς ὡς πλείσταις πολλῶν — «обетами, сколь можно многими, многих» (εὐχή — обет; слав. «обетами многими зело»). ὧν ὁ νοῦς ἠγέρθη — у которых ум был возбуждён (νοῦς; слав. «ихже чувство воздвижено бысть»). csl 2:9 = gr 2:6."
  10: "τὰ ἱερὰ σκεύη τοῦ κυρίου — священные сосуды Господни (σκεῦος). ἃ μετήγαγεν Ναβουχοδονοσορ — которые перенёс Навуходоносор (μετάγω). ἀπηρείσατο αὐτὰ ἐν τῷ ἑαυτοῦ εἰδωλίῳ — поставил их в своём идольском храме (ἀπερείδω, εἰδώλιον); слав. «постави их во идолнице своей». Слав. глосса «(царь вавилонский)» внесена в текст без скобок как церковное пояснение («バビロンの王ネブカドネツァル»). csl 2:10 = gr 2:7."
  11: "γαζοφύλαξ — хранитель сокровищ (γαζοφύλαξ); слав. «сокровищехранителю». παρέδωκεν … Μιθριδάτῃ — передал Митрадату. διὰ δὲ τούτου παρεδόθησαν Σαναβασσάρῳ προστάτῃ τῆς Ιουδαίας — через него переданы Санабассару, правителю Иудеи (προστάτης); в тексте サナバサル (в Ездре — ササバサル). csl 2:11–12 = gr 2:8."
  12: "Продолжение gr 2:8 (= csl 2:12): διὰ δὲ τούτου παρεδόθησαν Σαναβασσάρῳ προστάτῃ τῆς Ιουδαίας — «через него переданы Санабассару, правителю Иудеи» (προστάτης); слав. «той же предаде сасавассару властителю иудейскому»."
  13: "ὁ δὲ τούτων ἀριθμὸς ἦν — число их было. σπονδεῖα χρυσᾶ χίλια — золотых возливниц тысяча (σπονδεῖον; 注ぎの器, как в 1 Пар 28:17); σπονδεῖα ἀργυρᾶ χίλια — серебряных тысяча. θυίσκαι ἀργυραῖ εἴκοσι ἐννέα — серебряных кадильниц 29 (θυίσκα; 香炉); слав. «кадилниц сребряных двадесять девять». csl 2:13a = gr 2:9. φιάλαι χρυσαῖ τριάκοντα — золотых чаш 30 (φιάλη; 鉢, как в 1 Пар 28:17). ἀργυραῖ δισχίλιαι τετρακόσιαι δέκα — серебряных 2410. ἄλλα σκεύη χίλια — других сосудов тысяча. csl 2:13b = gr 2:10; в csl оба стиха (gr 2:9–10) слиты в один (2:13)."
  14: "τὰ πάντα σκεύη … πεντακισχίλια τετρακόσια ἑξήκοντα ἐννέα — всех сосудов 5469; сумма чисел в ст. 13 даёт иное число — известная особенность списка (ср. Езд 1:11). ἀνηνέχθη ὑπὸ Σαναβασσάρου — принесены Санабассаром. ἅμα τοῖς ἐκ τῆς αἰχμαλωσίας ἐκ Βαβυλῶνος — вместе с [возвращающимися] из плена из Вавилона. csl 2:14–15 = gr 2:11."
  15: "Продолжение gr 2:11 (= csl 2:15): ἀνηνέχθη δὲ ὑπὸ Σαναβασσάρου ἅμα τοῖς ἐκ τῆς αἰχμαλωσίας ἐκ Βαβυλῶνος εἰς Ιεροσόλυμα — «принесены же Санабассаром вместе с [возвращающимися] из плена из Вавилона в Иерусалим»; слав. «принесени же сасавассаром вкупе с теми, иже от пленения из вавилона во Иерусалим»."
  16: "ἐν δὲ τοῖς ἐπὶ Ἀρταξέρξου … χρόνοις — во времена Артаксеркса (Ἀρταξέρξης, アルタシャスタ). κατέγραψεν αὐτῷ κατὰ τῶν κατοικούντων — написал ему против живущих (καταγράφω, κατά + gen. — против). Βεσλεμος, Μιθραδάτης, Ταβελλιος, Ραουμος, Βεελτέεμος, Σαμσαῖος ὁ γραμματεύς — ベスレモス, ミトラダテス, タベリオス, ラウモス, ベエルテモス, サムサイオス. τὴν ὑπογεγραμμένην ἐπιστολήν — нижеписанное письмо (ὑπογράφω). csl 2:16 = gr 2:12."
  17: "Βασιλεῖ Ἀρταξέρξῃ κυρίῳ — царю Артаксерксу, господину (κύριος). οἱ παῖδές σου — рабы твои (παῖς). ὁ τὰ προσπίπτοντα — «[записывающий] происходящее», титул писца (προσπίπτω); слав. «писец случаев». οἱ ἐπίλοιποι τῆς βουλῆς αὐτῶν — остальные из совета их (βουλή). κριταὶ οἱ ἐν Κοίλῃ Συρίᾳ καὶ Φοινίκῃ — судьи в Келесирии и Финикии. csl 2:17 = gr 2:13."
  18: "γνωστὸν ἔστω τῷ κυρίῳ βασιλεῖ — да будет известно господину царю. οἱ Ιουδαῖοι ἀναβάντες παρ᾿ ὑμῶν πρὸς ἡμᾶς — Иудеи, вышедшие от вас к нам. τὴν πόλιν τὴν ἀποστάτιν καὶ πονηράν — город отступнический и злой (ἀποστάτις). τὰς ἀγορὰς αὐτῆς … τὰ τείχη θεραπεύουσιν — площади его и стены чинят, приводят в порядок (ἀγορά, τεῖχος, θεραπεύω). ναὸν ὑποβάλλονται — полагают основание храма (ὑποβάλλω). csl 2:18 = gr 2:14."
  19: "ἐὰν … οἰκοδομηθῇ … συντελεσθῇ — если будет построен и завершён (συντελέω). φορολογίαν οὐ μὴ ὑπομείνωσιν δοῦναι — не потерпят дать подать (φορολογία, ὑπομένω); слав. «не токмо дани не потерпят даяти». βασιλεῦσιν ἀντιστήσονται — восстанут против царей (ἀνθίστημι). csl 2:19 = gr 2:15."
  20: "ἐπεὶ ἐνεργεῖται τὰ κατὰ τὸν ναόν — поскольку дело о храме приводится в действие (ἐνεργέω). μὴ ὑπεριδεῖν τὸ τοιοῦτο — не презреть такое (ὑπεροράω). προσφωνῆσαι τῷ κυρίῳ βασιλεῖ — возвестить господину царю (προσφωνέω); слав. «господину нашему царю». ἐπισκεφθῇ ἐν τοῖς ἀπὸ τῶν πατέρων σου βιβλίοις — пусть будет рассмотрено в книгах отцов твоих (ἐπισκέπτομαι, βιβλίον). csl 2:20–21 = gr 2:16."
  21: "Продолжение gr 2:16 (= csl 2:21): ἀλλὰ προσφωνῆσαι τῷ κυρίῳ βασιλεῖ — «но возвестить господину царю» (προσφωνέω); ὅπως, ἂν φαίνηταί σοι, ἐπισκεφθῇ ἐν τοῖς ἀπὸ τῶν πατέρων σου βιβλίοις — «чтобы, если тебе угодно, рассмотрено было в книгах отцов твоих»; слав. «но знаемо сотворити господину нашему царю, да аще возмнится тебе, да взыщется в книгах отец твоих»."
  22: "εὑρήσεις ἐν τοῖς ὑπομνηματισμοῖς — найдёшь в памятных записях (ὑπομνηματισμός). ἀποστάτις καὶ βασιλεῖς καὶ πόλεις ἐνοχλοῦσα — отступница, беспокоящая царей и города (ἐνοχλέω). πολιορκίας συνιστάμενοι ἐν αὐτῇ — «устраивающие в нём осады» (πολιορκία); слав. «ополчение сотворяюще» — войско, в тексте 軍勢. δι᾿ ἣν αἰτίαν … ἠρημώθη — по этой причине и опустошён (ἐρημόω). csl 2:22–23 = gr 2:17."
  23: "Продолжение gr 2:17 (= csl 2:23): καὶ οἱ Ιουδαῖοι ἀποστάται καὶ πολιορκίας συνιστάμενοι ἐν αὐτῇ ἔτι ἐξ αἰῶνος, δι᾽ ἣν αἰτίαν καὶ ἡ πόλις αὕτη ἠρημώθη — «и Иудеи отступники, и осады устраивающие в ней издревле, по этой причине и город этот опустошён»; слав. «и иудее отступницы, и ополчение сотворяюще в нем от века, еяже ради вины и град той опустошен бысть»."
  24: "ὑποδείκνυμέν σοι — показываем, извещаем (ὑποδείκνυμι). κύριε βασιλεῦ — господин царь (звательный). τὰ ταύτης τείχη ἀνασταθῇ — стены его будут восстановлены (ἀνίστημι). κάθοδός σοι οὐκέτι ἔσται — «нисхождения тебе больше не будет» (κάθοδος); слав. «исходу тебе ктому не будет». εἰς Κοίλην Συρίαν καὶ Φοινίκην — в Келесирию и Финикию. csl 2:24 = gr 2:18."
  25: "ἀντέγραψεν ὁ βασιλεύς — царь написал в ответ (ἀντιγράφω). τῷ γράφοντι τὰ προσπίπτοντα — пишущему происходящее. Βεελτεέμῳ — Веелтеему (в тексте ベエルテモス). τοῖς λοιποῖς τοῖς συντασσομένοις — остальным, причисленным к ним (συντάσσω). οἰκοῦσιν ἐν τῇ Σαμαρείᾳ καὶ Συρίᾳ καὶ Φοινίκῃ — живущим в Самарии, Сирии и Финикии. csl 2:25 = gr 2:19."
  26: "Ἀνέγνων τὴν ἐπιστολήν — я прочитал письмо. ἣν πεπόμφατε πρός με — которое вы послали мне (πέμπω). ἐπέταξα … ἐπισκέψασθαι — я повелел рассмотреть (ἐπιτάσσω, ἐπισκέπτομαι). ἐξ αἰῶνος βασιλεῦσιν ἀντιπαρατάσσουσα — издавна выстраивающаяся против царей (ἀντιπαρατάσσω). В csl gr 2:20 и начало gr 2:21 соединены в один стих 2:26 («чтох послание… повелех убо взыскати…»); наш стих соединён так же."
  27: "Продолжение gr 2:21 (= csl 2:27): ἀποστάσεις καὶ πολέμους … συντελοῦντες — производящие мятежи и войны (ἀπόστασις, πόλεμος, συντελέω). βασιλεῖς ἰσχυροὶ καὶ σκληροὶ — цари сильные и жестокие (σκληρός). κυριεύοντες — господствующие (κυριεύω). φορολογοῦντες — облагающие податью (φορολογέω). csl 2:27b = gr 2:22. В csl конец gr 2:21 соединён с gr 2:22 в стихе 2:27; наш стих соединён так же."
  28: "ἀποκωλῦσαι τοὺς ἀνθρώπους ἐκείνους τοῦ οἰκοδομῆσαι — воспрепятствовать тем людям строить (ἀποκωλύω, инфинитив с τοῦ). προνοηθῆναι — позаботиться, предусмотреть (προνοέω). ὅπως μηθὲν παρὰ ταῦτα γένηται — чтобы ничего вопреки этому не произошло (παρά + acc.). В csl начало gr 2:24 соединено с gr 2:23 в стихе 2:28; наш стих соединён так же."
  29: "Продолжение gr 2:24 (= csl 2:29): μὴ προβῇ ἐπὶ πλεῖον τὰ τῆς κακίας — чтобы зло не пошло дальше (προβαίνω, κακία). εἰς τὸ βασιλεῖς ἐνοχλῆσαι — к беспокойству царей (ἐνοχλέω)."
  30: "ἀναγνωσθέντων τῶν … γραφέντων — когда прочитано было написанное (ἀναγινώσκω, γράφω). ἀναζεύξαντες κατὰ σπουδὴν — отправившись в путь поспешно (ἀναζεύγνυμι, σπουδή). μεθ᾿ ἵππου καὶ ὄχλου παρατάξεως — с конём и толпой войска (ὄχλος, παράταξις); слав. «с конники и народным ополчением» — в тексте 騎兵と民の軍勢. ἤρξαντο κωλύειν — начали препятствовать (κωλύω). csl 2:30 = gr 2:25."
  31: "ἤργει ἡ οἰκοδομή — строительство бездействовало, остановилось (ἀργέω). τοῦ ἱεροῦ τοῦ ἐν Ιερουσαλημ — храма в Иерусалиме (ἱερόν). μέχρι τοῦ δευτέρου ἔτους — до второго года (ἔτος). Δαρείου τοῦ Περσῶν βασιλέως — Дария, царя Персидского. csl 2:31 = gr 2:26."
