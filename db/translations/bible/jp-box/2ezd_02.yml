# jp-box, 2-я Ездры, глава 2. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге нет; jp-ni (под авторским правом) не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Нумерация — славяно-синодальная (как в csl-ru): в главе 31 стих.
# Выравнивание по содержанию (csl ← gr): 2:1–2 ← gr 2:1; 3–4 ← 2:2; 5 ← 2:3; 6–7 ← 2:4;
# 8 ← 2:5; 9 ← 2:6; 10 ← 2:7; 11–12 ← 2:8; 13 ← 2:9–10 (слиты); 14–15 ← 2:11; 16 ← 2:12;
# 17 ← 2:13; 18 ← 2:14; 19 ← 2:15; 20–21 ← 2:16; 22–23 ← 2:17; 24 ← 2:18; 25 ← 2:19;
# 26 ← 2:20 + 2:21а; 27 ← 2:21б + 2:22; 28 ← 2:23 + 2:24а; 29 ← 2:24б; 30 ← 2:25; 31 ← 2:26.
# Где csl сливает стихи gr, наш текст соединён (2:13, 2:26–28); где делит — разделён
# (gr 2:1 → 1+2; 2:2 → 3+4; 2:4 → 6+7; 2:8 → 11+12; 2:11 → 14+15; 2:16 → 20+21;
# 2:17 → 22+23; 2:24 → 28+29); границы отмечены в notes.
# Содержание: указ Кира (1–15: указ 3–7, возвращение и помощь 8–9, сосуды 10–15);
# письмо самарян Артаксерксу (16–24), ответ царя (25–29), остановка стройки (30–31).
# Указ (2:3–7) и оба письма (2:17–24; 2:26–29) — 「…」; красного и синего нет.
# 〔…〕 нет: все стихи есть в gr-lxx-byz; слова в квадратных скобках издания
# (gr 2:3 οὗτος ὁ κύριος...) есть и в csl, поэтому без скобок.
# Сносок ⟨…⟩ нет: 神殿, 祭壇, 祭司, レビ人, 宝物, 太守, 貢ぎ уже в корпусе.

