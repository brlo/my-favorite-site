verses:
  1: "わたしがあなたがたのために、またラオディキアにいる者[もの]たちのため、さらに、まだわたしの顔[かお]を肉[にく]において見[み]たことのないすべての者[もの]のために、どれほど大[おお]きな苦闘[くとう]をしているかを、あなたがたに知[し]ってもらいたいのである。"
  2: "それは、彼[かれ]らが心[こころ]に慰[なぐさ]めを受け、愛[あい]のうちに結[むす]び合[あ]わされて、確[かた]かな理解[りかい]のあらゆる富[とみ]に至[いた]り、神[かみ]の奥義[おうぎ]、すなわちキリストを知[し]るに至[いた]るためである。"
  3: "この方[かた]のうちにこそ、知恵[ちえ]と知識[ちしき]とのすべての宝[たから]が隠[かく]されているのである。"
  4: "わたしがこう言[い]うのは、だれも巧[たくみ]な言葉[ことば]で、あなたがたを惑[まど]わすことのないためである。"
  5: "というのは、わたしは体[からだ]では離[はな]れていても、霊[れい]ではあなたがたとともにいて、あなたがたの秩序[ちつじょ]と、キリストに対[たい]するあなたがたの信仰[しんこう]の固[かた]さとを見[み]て、喜[よろこ]んでいるからである。"
  6: "だから、あなたがたが主[しゅ]であるキリスト・イエスを受[う]け入[い]れたように、この方[かた]にあって歩[あゆ]みなさい。"
  7: "この方[かた]に根[ね]を下[おろ]し、建[た]てられ、教[おし]えられたとおりに信仰[しんこう]に堅[かた]く据[す]えられ、感謝[かんしゃ]にあふれていなさい。"
  8: "よく注意[ちゅうい]しなさい。だれも、哲学[てつがく]や空[むな]しい欺[あざむ]きによって、あなたがたを捕[とら]えてしまわないように。それは人[ひと]の言[い]い伝[つた]えによるもので、この世[よ]の諸[しょ]元素[げんそ]⟨世[よ]を成[な]り立[た]たせている、根源[こんげん]的[てき]な諸[しょ]力[ちから]。⟩によるものであって、キリストによるものではない。"
  9: "というのは、神性[しんせい]のすべての満[み]ち満[み]ちたものが、体[からだ]をもってこの方[かた]のうちに宿[やど]っているからである。"
  10: "あなたがたも、すべての支配[しはい]と権威[けんい]との頭[かしら]であるこの方[かた]にあって、満[み]たされているのである。"
  11: "この方[かた]にあって、あなたがたも手[て]によらない割礼[かつれい]を受[う]けたのである。すなわち、肉[にく]の体[からだ]の〔罪[つみ]〕を脱[ぬ]ぎ捨[す]てることであり、それはキリストの割礼[かつれい]である。"
  12: "あなたがたは洗礼[せんれい]によってこの方[かた]とともに葬[ほうむ]られ、また、この方[かた]を死者[ししゃ]の中[なか]から復活[ふっかつ]させた神[かみ]の働[はたら]きを信[しん]じることによって、この方[かた]とともに復活[ふっかつ]したのである。"
  13: "あなたがたは、罪[つみ]と、肉[にく]の無割礼[むかつれい]とによって死[し]んだ者[もの]であったが、神[かみ]はあなたがたを、この方[かた]とともに生[い]かしてくださった。わたしたちのすべての罪[つみ]を赦[ゆる]して、"
  14: "わたしたちに不利[ふり]な、掟[おきて]による証書[しょうしょ]⟨わたしたちを責[せ]め立[た]てることを書[か]き記[しる]した、負債[ふさい]の証文[しょうもん]。⟩を消[け]し去[さ]り、それを中[なか]から取[と]り除[の]けて、十字架[じゅうじか]に釘[くぎ]づけにされたのである。"
  15: "支配[しはい]たちと権威[けんい]たちを無力[むりょく]にして、彼[かれ]らを公然[こうぜん]と辱[はずか]しめ、十字架[じゅうじか]によって彼[かれ]らに勝利[しょうり]を収[おさ]められたのである。"
  16: "だから、あなたがたを食物[しょくもつ]や飲[の]み物[もの]のことで、また祭[まつ]りや新月[しんげつ]や安息日[あんそくび]のことで、だれにも裁[さば]かせてはならない。"
  17: "これらは来[きた]るべきものの影[かげ]であり、その実体[じったい]はキリストにある。"
  18: "だれも、好[この]んで謙遜[けんそん]と天使[てんし]礼拝[れいはい]とにふけり、見[み]たことのあるところに分[わ]け入[い]り、肉[にく]の思[おも]いによってむなしく膨[ふく]れ上[あ]がって、あなたがたの賞[しょう]を奪[うば]おうとする者[もの]があってはならない。"
  19: "頭[かしら]である方[かた]を堅[かた]く持[も]たないのである。その方[かた]から、体[からだ]の全体[ぜんたい]がもろもろの節[ふし]と筋[すじ]とによって助[たす]けられ、結[むす]び合[あ]わされて、神[かみ]による育[そだ]ちを遂[と]げるのである。"
  20: "もしあなたがたがキリストとともに死[し]んで、この世[よ]の諸[しょ]元素[げんそ]から離[はな]れたのなら、なぜ、世[よ]に生[い]きている者[もの]のように、"
  21: "手[て]を触[ふ]れるな、味[あじ]わうな、触[さわ]るな、という掟[おきて]に従[したが]い、"
  22: "用[もち]いるにつれて朽[く]ちていくものを、人[ひと]の教[おし]えと掟[おきて]とに従[したが]って重[おも]んじるのか。"
  23: "これらは、自分[じぶん]で選[えら]んだ礼拝[れいはい]と謙遜[けんそん]と体[からだ]を惜[お]しまないこととに、知恵[ちえ]があるかのような見[み]かけを備[そな]えているが、肉[にく]の満足[まんぞく]のためには何[なん]の価値[かち]もないのである。"

notes:
  1: "Θέλω γὰρ ὑμᾶς εἰδῆναι — 知ってもらいたいのである (γάρ при желании). ἡλίκον ἀγῶνα — どれほど大きな苦闘. οἱ ἐν Λαοδικείᾳ — ラオディキアにいる者たち. ὅσοι οὐχ ἑόρακαν τὸ πρόσωπόν μου ἐν σαρκί — まだわたしの顔を肉において見たことのないすべての者."
  2: "παρακληθῶσιν αἱ καρδίαι — 心に慰めを受ける. συμβιβασθέντες ἐν ἀγάπῃ — 愛のうちに結び合わされて. πληροφορία τῆς συνέσεως — 確かな理解. τοῦ μυστηρίου τοῦ θεοῦ, Χριστοῦ — 神の奥義、すなわちキリスト (Χριστοῦ — приложение)."
  3: "θησαυροὶ τῆς σοφίας καὶ γνώσεως ἀπόκρυφοι — 知恵と知識とのすべての宝が隠されている; ἐν ᾧ — この方のうちにこそ."
  4: "παραλογίζηται ἐν πιθανολογίᾳ — 巧みな言葉で惑わす. τοῦτο λέγω ἵνα — こう言うのは…ためである."
  5: "εἰ γὰρ καὶ τῇ σαρκὶ ἄπειμι, ἀλλὰ τῷ πνεύματι σὺν ὑμῖν εἰμι — 体では離れていても、霊ではともにいる (ἀλλά передано явно: 〜ていても). τάξις — 秩序; στερέωμα — 固さ."
  6: "Ὡς οὖν παρελάβετε — だから…受け入れたように. τὸν Χριστὸν Ἰησοῦν τὸν κύριον — 主であるキリスト・イエス."
  7: "ἐρριζωμένοι, ἐποικοδομούμενοι, βεβαιούμενοι — 根を下し、建てられ、堅く据えられ. [ἐν] стоит в базе в квадратных скобках — слово есть, 〔〕 не ставится. περισσεύοντες ἐν εὐχαριστίᾳ — 感謝にあふれて."
  8: "βλέπετε μή τις ὑμᾶς ἔσται ὁ συλαγωγῶν — よく注意しなさい…捕らえてしまわないように. φιλοσοφία καὶ κενὴ ἀπάτη — 哲学と空しい欺き. παράδοσις τῶν ἀνθρώπων — 人の言い伝え. στοιχεῖα τοῦ κόσμου — この世の諸元素; сноска при первом месте (2:8), в 2:20 без сноски. οὐ κατὰ Χριστόν — キリストによるものではない."
  9: "πᾶν τὸ πλήρωμα τῆς θεότητος σωματικῶς — 神性のすべての満ち満ちたものが体をもって宿る (σῶμα не «тело Христово», а «телесно»)."
  10: "πεπληρωμένοι — 満たされている. κεφαλὴ πάσης ἀρχῆς καὶ ἐξουσίας — すべての支配と権威の頭."
  11: "περιτομὴ ἀχειροποίητος — 手によらない割礼. В базе ἀπέκδυσις τοῦ σώματος τῆς σαρκός без τῶν ἁμαρτιῶν (проверено: ἁμαρτ- в стихе — 0); церковный текст (Елизаветинская «греховнаго телесе», jp-joc「肉身の罪の體」) читает с ним — 〔罪〕. ἐν τῇ περιτομῇ τοῦ Χριστοῦ — キリストの割礼."
  12: "συνταφέντες αὐτῷ ἐν τῷ βαπτισμῷ — 洗礼によってこの方とともに葬られ. συνηγέρθητε διὰ τῆς πίστεως τῆς ἐνεργείας τοῦ θεοῦ — 神の働きを信じることによって復活した. τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν — この方を死者の中から復活させた."
  13: "νεκροὺς ὄντας τοῖς παραπτώμασιν — 罪によって死んだ者. ἀκροβυστία τῆς σαρκός — 肉の無割礼. συνεζωοποίησεν ὑμᾶς σὺν αὐτῷ — この方とともに生かしてくださった. χαρισάμενος ἡμῖν — わたしたちのすべての罪を赦して."
  14: "χειρόγραφον τοῖς δόγμασιν — 掟による証書 (долговая расписка; сноска). ὃ ἦν ὑπεναντίον ἡμῖν — わたしたちに不利な. ἦρκεν ἐκ τοῦ μέσου — 中から取り除けて. προσηλώσας αὐτὸ τῷ σταυρῷ — 十字架に釘づけにした."
  15: "ἀπεκδυσάμενος τὰς ἀρχὰς καὶ τὰς ἐξουσίας — 支配たちと権威たちを無力にして (букв. «совлекши с них доспехи»). ἐδειγμάτισεν ἐν παρρησίᾳ — 公然と辱め. θριαμβεύσας αὐτοὺς ἐν αὐτῷ — 彼らに勝利を収めた. ἐν αὐτῷ — вероятно, о кресте (ср. jp-joc「十字架を用て」), поэтому 十字架によって."
  16: "Μὴ οὖν τις ὑμᾶς κρινέτω — だから…だれにも裁かせてはならない. βρῶσις, πόσις, ἑορτή, νεομηνία, σάββατα — 食物・飲み物・祭り・新月・安息日 (新月 — месячный праздник новолуния, понятен из ряда). ἐν μέρει ἑορτῆς — 祭りのことで."
  17: "σκιὰ τῶν μελλόντων — 来るべきものの影. τὸ δὲ σῶμα τοῦ Χριστοῦ — その実体はキリストにある (σῶμα — «тело», здесь против «тени»)."
  18: "καταβραβευέτω — 賞を奪う. θέλων ἐν ταπεινοφροσύνῃ καὶ θρησκείᾳ τῶν ἀγγέλων — 好んで謙遜と天使礼拝にふける. ἃ ἑόρακεν ἐμβατεύων — в базе без μή; церковный текст (Елизаветинская «не видев», jp-joc「未だ見ざる事を窺ひ」) читает μή. Оставлено по базе: 見たことのあるところに分け入り. εἰκῇ φυσιούμενος ὑπὸ τοῦ νοὸς τῆς σαρκὸς αὐτοῦ — 肉の思いによってむなしく膨れ上がる."
  19: "οὐ κρατῶν τὴν κεφαλήν — 頭を堅く持たない. ἁφαί, σύνδεσμοι — もろもろの節と筋. ἐπιχορηγούμενον καὶ συμβιβαζόμενον — 助けられ、結び合わされて. αὔξει τὴν αὔξησιν τοῦ θεοῦ — 神による育ちを遂げる."
  20: "στοιχεῖα τοῦ κόσμου — この世の諸元素 (второе место, без сноски). τί ὡς ζῶντες ἐν κόσμῳ δογματίζεσθε — なぜ…掟に従わされるのか; риторический вопрос охватывает 20–22."
  21: "Μὴ ἅψῃ μηδὲ γεύσῃ μηδὲ θίγῃς — 手を触れるな、味わうな、触るな. Это лозунги учителей, а не Писание, поэтому без кавычек; 2:22 подхватывает их как «人の教えと掟»."
  22: "ἅ ἐστιν πάντα εἰς φθορὰν τῇ ἀποχρήσει — 用いるにつれて朽ちていく. κατὰ τὰ ἐντάλματα καὶ διδασκαλίας τῶν ἀνθρώπων — 人の教えと掟に従って (ср. Ис 29:13; кавычки не ставятся)."
  23: "ἐθελοθρησκεία — 自分で選んだ礼拝. ἀφειδία σώματος — 体を惜しまないこと. λόγον μὲν ἔχοντα σοφίας — 知恵があるかのような見かけ. οὐκ ἐν τιμῇ τινι — 何の価値もない. πρὸς πλησμονὴν τῆς σαρκός — 肉の満足のためには."
