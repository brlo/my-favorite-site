# jp-box, Послание к Колоссянам, глава 2. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 2: труд Павла о колоссянах и лаодикийцах (1–3), предостережение от
# обольщения (4–8), полнота в Христе и обрезание Христово (9–15),
# тень и тело, суд о пище и праздниках (16–19), «зачем вы подчиняетесь уставам» (20–23).
# Красного и синего нет: прямой речи Христа в послании нет, <j>/<mo> не ставятся.
# 〔…〕: 2:11 — церковное τῶν ἁμαρτιῶν (в базе слова нет; проверено запросом).
# Сноски ⟨…⟩: 2:8 諸元素 (στοιχεῖα τοῦ κόσμου, первое место), 2:14 証書 (χειρόγραφον).
# 2:18 — в базе ἃ ἑόρακεν без μή; церковное чтение с μή (см. notes), оставлено по базе.
# jp-ni не использовался.

