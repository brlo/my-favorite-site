# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 39: посольство Меродаха и показ сокровищ (1–2), вопросы Исаии и ответы
# Езекии (3–4), пророчество о вавилонском плене (5–7), ответ Езекии (8).
# Речи: Исаия — 「…」 (3, 4, 5), слово Господа внутри — 『…』 (5–7); Езекия — 「…」
# (3, 4, 8). Вводные формулы — вне кавычек.
# Нумерация по gr: 8 стихов; у csl и ru тоже 8. В 39:6 gr заканчивается словами
# «εἶπεν δὲ ὁ θεός», а csl ставит «рече Господь» в начало 39:7 — держим деление gr.
# Паритет: csl-добавка 39:2 «и во всей области своей» внесена в основной текст
# без 〔…〕, оговорена в notes.
# 〔…〕 нет. Сносок ⟨…⟩ нет: 宦官, 香料, 没薬, 香油, 倉, 宝 уже в корпусе.
# Имена — транслитерация греческого (LXX); сверены с 4 Цар 20.

