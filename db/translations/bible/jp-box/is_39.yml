verses:
  1: "そのころ、バビロンの王[おう]、ラアダンの子[こ]メロダクが、ヒゼキヤに書[しょ]き物[もの]と使者[ししゃ]たちと贈[おく]り物[もの]を送[おく]った。ヒゼキヤが死[し]に至[いた]る病[やまい]にかかって、生[い]き返[かえ]ったことを聞[き]いたからである。"
  2: "ヒゼキヤはそれらを喜[よろこ]んで迎[むか]え、彼[かれ]らに自分[じぶん]の家[いえ]、すなわち香料[こうりょう]の家[いえ]、没薬[もつやく]の油[あぶら]、香[こう]、香油[こうゆ]、銀[ぎん]、金[きん]、すべての器[うつわ]の蔵[くら]、および宝[たから]のうちにあるすべてのものを示[しめ]した。ヒゼキヤが自分[じぶん]の家[いえ]で、また自分[じぶん]の全[すべ]ての領地[りょうち]で彼[かれ]らに見[み]せなかったものは、何[なに]一[ひと]つなかった。"
  3: "預言者[よげんしゃ]イザヤはヒゼキヤ王[おう]のもとへ来[き]て言[い]った。「あの人[ひと]たちは何[なに]を言[い]ったのか。どこからあなたのもとへ来[き]たのか。」ヒゼキヤは言[い]った。「遠[とお]い地[ち]から、バビロンから、わたしのもとへ来[き]ました。」"
  4: "イザヤは言[い]った。「彼[かれ]らはあなたの家[いえ]で何[なに]を見[み]たのか。」ヒゼキヤは言[い]った。「わたしの家[いえ]にあるものはすべて見[み]ました。わたしの宝[たから]のうちにも、彼[かれ]らに見[み]せなかったものは何[なに]一[ひと]つありません。」"
  5: "イザヤは彼[かれ]に言[い]った。「万軍[ばんぐん]の主[しゅ]の言葉[ことば]を聞[き]きなさい。『"
  6: "見[み]よ、日[ひ]が来[く]る、と主[しゅ]は言[い]われる。あなたの家[いえ]にあるすべてのもの、あなたの父祖[ふそ]たちが今日[きょう]までに蓄[たくわ]えたすべてのものはバビロンへ運[はこ]ばれ、何[なに]も残[のこ]されない。神[かみ]は言[い]われた。"
  7: "あなたが生[う]んだ子[こ]らの中[なか]からも、人[ひと]は取[と]って行[い]き、バビロンの王[おう]の家[いえ]で宦官[かんがん]にする。』」"
  8: "ヒゼキヤはイザヤに言[い]った。「あなたが語[かた]られた主[しゅ]の言葉[ことば]は良[よ]い。今[いま]、わたしの日[ひ]々[び]に平和[へいわ]と義[ぎ]があるように。」"

notes:
  1: "Ἐν τῷ καιρῷ ἐκείνῳ — «в то время»; Μαρωδαχ υἱὸς τοῦ Λααδαν — Меродах, сын Лаадана (в 4 Цар 20:12 — Μαρωδαχβαλαδαν υἱὸς Βαλαδαν, メロダク・バラダン; LXX Исаии даёт иное отчество); ὁ βασιλεὺς τῆς Βαβυλωνίας — «царь Вавилонии»; ἐπιστολὰς καὶ πρέσβεις καὶ δῶρα — «письма, и послов, и дары»; ἤκουσεν γὰρ ὅτι ἐμαλακίσθη ἕως θανάτου καὶ ἀνέστη — «ибо услышал, что он заболел до смерти и встал»."
  2: "ἐχάρη ἐπ᾿ αὐτοῖς χαρὰν μεγάλην — «обрадовался о них радостью великою»; οἶκος τοῦ νεχωθα — «дом нехофа» (евр. נְכֹת — сокровищница; слав. «дом ароматов»), передан как 香料の家; τῆς στακτῆς — стакти, благовонная смола (передано 没薬の油); τῶν θυμιαμάτων — фимиамов (香); τοῦ μύρου — мира, благовония (香油); οἴκους τῶν σκευῶν τῆς γάζης — «домы сосудов сокровищницы» (γάζα — сокровищница); csl добавляет в конце «и во всей области своей» — внесено."
  3: "Τί λέγουσιν οἱ ἄνθρωποι οὗτοι — «что говорят эти люди»; πόθεν ἥκασιν — «откуда пришли» (ἥκω); ἐκ γῆς πόρρωθεν — «из земли издалека» (πόρρωθεν). Вопрос Исаии и ответ Езекии — в 「…」."
  4: "Τί εἴδοσαν — «что видели» (εἶδον); πάντα τὰ ἐν τῷ οἴκῳ μου — «всё, что в доме моём»; οὐκ ἔστιν … ὃ οὐκ εἴδοσαν — «нет того, чего бы они не видели»; ἀλλὰ καὶ τὰ ἐν τοῖς θησαυροῖς μου — «но и то, что в сокровищницах моих»."
  5: "Ἄκουσον τὸν λόγον κυρίου σαβαωθ — «выслушай слово Господа Саваофа» (万軍の主). Здесь открывается слово Господа (『…』), оно идёт до конца ст. 7; кавычка не закрывается, так как речь непрерывна."
  6: "Ἰδοὺ ἡμέραι ἔρχονται — «вот, дни приходят»; λήμψονται πάντα — «возьмут всё»; ὅσα συνήγαγον οἱ πατέρες σου — «что собрали отцы твои»; εἰς Βαβυλῶνα ἥξει — «в Вавилон придёт»; οὐδὲν οὐ μὴ καταλίπωσιν — «ничего не оставят» (усиленное отрицание); εἶπεν δὲ ὁ θεός — «сказал же Бог» (в слав. «рече Господь» стоит в начале ст. 7 — деление иное, держим gr)."
  7: "ἀπὸ τῶν τέκνων σου, ὧν ἐγέννησας — «из детей твоих, которых ты родил»; λήμψονται — «возьмут»; ποιήσουσιν σπάδοντας — «сделают евнухами» (σπάδων — скопец; 宦官); ἐν τῷ οἴκῳ τοῦ βασιλέως τῶν Βαβυλωνίων — «в доме царя вавилонян». Здесь закрываются слово Господа и речь Исаии."
  8: "Ἀγαθὸς ὁ λόγος κυρίου — «благо слово Господне»; ὃν ἐλάλησεν — «которое он изрёк»; γενέσθω δὴ εἰρήνη καὶ δικαιοσύνη ἐν ταῖς ἡμέραις μου — «да будет же мир и правда во дни мои» (δικαιοσύνη — 義; в 4 Цар 20:19 только εἰρήνη). В ru добавлено «присовокупил он» — в гр этого нет."
