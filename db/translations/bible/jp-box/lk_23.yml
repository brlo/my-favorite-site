# jp-box, Евангелие от Луки, глава 23. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий (gr-lxx-byz) — свидетель; расхождения — в 〔…〕 и notes.
# jp-ni не использовался.
#
# Глава Распятия: суд у Пилата (1–7), у Ирода (8–12), приговор (13–25),
# путь на Голгофу (26–32), распятие и смерть (33–49), погребение (50–56).
# Слова Христа — в <j>…</j> (3, 28–31, 34, 43, 46); слова Пилата, Ирода,
# первосвященников, толпы, разбойников, сотника — вне тегов.
# 23:17 в критическом тексте отсутствует, 23:34а стоит под скобками — Церковь
# читает оба места, поэтому они целиком в 〔…〕; 23:23, 23:38, 23:42 —
# церковные добавления, отмеченные 〔…〕.

