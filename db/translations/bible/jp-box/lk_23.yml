verses:
  1: "そこで、彼[かれ]らは全員[ぜんいん]立[た]ち上[あ]がり、イエスをピラトのもとへ引[ひ]いて行[い]った。"
  2: "そして、彼[かれ]を訴[うった]え始[はじ]めた。「この人[ひと]は、わたしたちの民[たみ]を惑[まど]わし、カエサルに税金[ぜいきん]を納[おさ]めるのを禁[きん]じ、自分[じぶん]がキリスト、王[おう]であると言[い]っているのを、わたしたちは見[み]つけたのです。」"
  3: "ピラトはイエスに問[と]いただした。「お前[まえ]はユダヤ人[じん]の王[おう]なのか。」イエスはお答[こた]えになった。「<j>あなたが言[い]っているとおりだ。</j>」"
  4: "ピラトは祭司長[さいしちょう]たちと群衆[ぐんしゅう]に言[い]った。「わたしはこの人[ひと]に何[なに]の罪[つみ]も見[み]つけない。」"
  5: "しかし、彼[かれ]らはますます激[はげ]しく主張[しゅちょう]して言[い]った。「この人[ひと]は民[たみ]を煽[あお]り、ユダヤ全土[ぜんど]で教[おし]えながら、ガリラヤから始[はじ]めて、ここまで来[き]ているのです。」"
  6: "ピラトはこれを聞[き]いて、この人[ひと]がガリラヤ人[じん]かどうかを問[と]いただした。"
  7: "そして、イエスがヘロデの支配下[しはいか]にあることを知[し]ると、そのころエルサレムにもいたヘロデのもとへ送[おく]った。"
  8: "ヘロデはイエスを見[み]て、非常[ひじょう]に喜[よろこ]んだ。ずっと前[まえ]からイエスのことを聞[き]いて会[あ]いたいと思[おも]っており、イエスが何[なに]かしるしを行[おこな]われるのを見[み]ることを期待[きたい]していたからである。"
  9: "そこで、多[おお]くの言葉[ことば]で問[と]いただしたが、イエスは何[なに]もお答[こた]えにならなかった。"
  10: "祭司長[さいしちょう]たちと律法学者[りっぽうがくしゃ]たちは立[た]って、激[はげ]しくイエスを訴[うった]えていた。"
  11: "ヘロデは自分[じぶん]の兵士[へいし]たちとともにイエスを侮[あなど]り、嘲[あざけ]って、あざやかな衣[ころも]を着[き]せ、ピラトのもとへ送[おく]り返[かえ]した。"
  12: "その日[ひ]、ピラトとヘロデは互[たが]いに親[した]しくなった。それまでは、互[たが]いに敵意[てきい]を抱[いだ]いていたのである。"
  13: "ピラトは祭司長[さいしちょう]たち、指導者[しどうしゃ]たち、民[たみ]を呼[よ]び集[あつ]めて、"
  14: "こう言[い]った。「あなたがたは、この人[ひと]を、民[たみ]を惑[まど]わす者[もの]として、わたしのところへ引[ひ]いて来[き]た。しかし、ご覧[らん]のとおり、あなたがたの前[まえ]で取[と]り調[しら]べたが、あなたがたが訴[うった]えているような罪[つみ]は、この人[ひと]に何[なに]ひとつ見[み]つからなかった。"
  15: "ヘロデも同[おな]じである。彼[かれ]はこの人[ひと]をわたしたちのもとへ送[おく]り返[かえ]したのだから。見[み]なさい、この人[ひと]には死[し]に値[あたい]するようなことは何[なに]も行[おこな]われていない。"
  16: "だから、この人[ひと]を懲[こ]らしめてから、釈放[しゃくほう]しよう。」"
  17: "〔祭[まつ]りごとには、ピラトは彼[かれ]らに一人[ひとり]の囚人[しゅうじん]を釈放[しゃくほう]しなければならなかった。〕"
  18: "しかし、彼[かれ]らは一斉[いっせい]に叫[さけ]んで言[い]った。「この人[ひと]を消[け]せ。バラバをわたしたちに釈放[しゃくほう]しろ。」"
  19: "バラバは、町[まち]で起[お]こった暴動[ぼうどう]と殺人[さつじん]のために、牢[ろう]に入[はい]れられていた者[もの]であった。"
  20: "ピラトはイエスを釈放[しゃくほう]したいと思[おも]い、もう一度[いちど]彼[かれ]らに呼[よ]びかけた。"
  21: "しかし、彼[かれ]らは叫[さけ]んだ。「十字架[じゅうじか]につけろ、十字架[じゅうじか]につけろ。」"
  22: "ピラトは三度目[さんどめ]に彼[かれ]らに言[い]った。「この人[ひと]はどんな悪[わる]いことをしたというのか。わたしはこの人[ひと]に死[し]に値[あたい]する罪[つみ]を何[なに]も見[み]つけなかった。だから、懲[こ]らしめてから釈放[しゃくほう]しよう。」"
  23: "しかし、彼[かれ]らは大[おお]きな声[こえ]で、イエスを十字架[じゅうじか]につけることを求[もと]め続[つづ]け、ついに彼[かれ]らの声[こえ]〔と祭司長[さいしちょう]たちの声[こえ]〕が勝[か]った。"
  24: "そこで、ピラトは彼[かれ]らの求[もと]めどおりにすることを決[き]めた。"
  25: "そして、暴動[ぼうどう]と殺人[さつじん]のために牢[ろう]に入[はい]れられていた者[もの]、すなわち彼[かれ]らが求[もと]めていた者[もの]を釈放[しゃくほう]し、イエスは彼[かれ]らの意[い]のままに引[ひ]き渡[わた]した。"
  26: "彼[かれ]らがイエスを引[ひ]いて行[い]くとき、畑[はたけ]から来[き]ていたクレネ人[じん]シモンをつかまえ、十字架[じゅうじか]を負[お]わせ、イエスの後[うし]ろについて運[はこ]ばせた。"
  27: "大勢[おおぜい]の民[たみ]と、イエスのために泣[な]き悲[かな]しむ女[おんな]たちが、イエスに従[したが]っていた。"
  28: "イエスは彼女[かのじょ]たちの方[ほう]を振[ふ]り向[む]いて言[い]われた。「<j>エルサレムの娘[むすめ]たちよ、わたしのために泣[な]くのをやめなさい。むしろ、自分[じぶん]たちと自分[じぶん]たちの子[こ]どもたちのために泣[な]きなさい。</j>"
  29: "<j>見[み]よ、『不妊[ふにん]の女[おんな]たち、産[う]むことのなかった胎[たい]、乳[ちち]を飲[の]ませたことのない乳房[ちぶさ]は幸[さいわ]いだ』と言[い]う日[ひ]が来[く]る。</j>"
  30: "<j>そのとき、人々[ひとびと]は山[やま]に向[む]かって『わたしたちの上[うえ]に倒[たお]れよ』と言[い]い、丘[おか]に向[む]かって『わたしたちを覆[おお]え』と言[い]い始[はじ]める。</j>"
  31: "<j>生木[なまき]にこういうことが行[おこな]われるのなら、枯[か]れ木[き]はどうなるだろうか。</j>」"
  32: "ほかにも、二人[ふたり]の犯罪者[はんざいしゃ]が、イエスと一緒[いっしょ]に処刑[しょけい]されるために引[ひ]いて行[い]かれた。"
  33: "「されこうべ」と呼[よ]ばれる所[ところ]に来[き]て、彼[かれ]らはイエスと二人[ふたり]の犯罪者[はんざいしゃ]を十字架[じゅうじか]につけた。一人[ひとり]は右[みぎ]に、一人[ひとり]は左[ひだり]に。"
  34: "〔イエスは言[い]われた。「<j>父[ちち]よ、彼[かれ]らをお赦[ゆる]しください。彼[かれ]らは、自分[じぶん]が何[なに]をしているのか分[わ]かっていないからです。</j>」〕彼[かれ]らはイエスの衣[ころも]を分[わ]け、くじを引[ひ]いた。"
  35: "民[たみ]は立[た]って見[み]ていた。指導者[しどうしゃ]たちも〔民[たみ]とともに〕嘲[あざけ]って言[い]った。「他人[たにん]は救[すく]ったのだ。この人[ひと]が神[かみ]のキリスト、選[えら]ばれた者[もの]なら、自分[じぶん]を救[すく]うがよい。」"
  36: "兵士[へいし]たちもイエスを嘲[あざけ]り、近[ちか]づいて酸[す]いぶどう酒[さけ]を差[さ]し出[だ]して、"
  37: "言[い]った。「お前[まえ]がユダヤ人[じん]の王[おう]なら、自分[じぶん]を救[すく]え。」"
  38: "また、イエスの上[うえ]には罪状[ざいじょう]の書[か]きもあり、〔ギリシア語[ご]、ラテン語[ご]、ヘブライ語[ご]の文字[もじ]で〕「これはユダヤ人[じん]の王[おう]である」と書[か]かれていた。"
  39: "十字架[じゅうじか]にかけられた犯罪者[はんざいしゃ]の一人[ひとり]は、イエスをののしって言[い]った。「お前[まえ]はキリストではないのか。自分[じぶん]とわたしたちを救[すく]え。」"
  40: "もう一人[ひとり]は彼[かれ]をたしなめて言[い]った。「お前[まえ]は神[かみ]を恐[おそ]れないのか。同[おな]じ裁[さば]きを受[う]けているのに。"
  41: "わたしたちは当然[とうぜん]だ。自分[じぶん]のしたことにふさわしい報[むく]いを受[う]けているのだから。しかし、この人[ひと]は何[なに]も悪[わる]いことをしていない。」"
  42: "そして言[い]った。「〔主[しゅ]よ、〕あなたが御国[みくに]に来[こ]られるとき、わたしを思[おも]い出[だ]してください。」"
  43: "イエスは言[い]われた。「<j>はっきり言[い]っておく。今日[きょう]、あなたはわたしとともに楽園[らくえん]にいる。</j>」"
  44: "すでに第六時[だいろくじ]ごろになっていた。暗闇[くらやみ]が全地[ぜんち]を覆[おお]い、第九時[だいきゅうじ]まで続[つづ]いた。"
  45: "日[ひ]は光[ひかり]を失[うしな]い、神殿[しんでん]の幕[まく]が真[ま]ん中[なか]から裂[さ]けた。"
  46: "イエスは大[おお]きな声[こえ]を上[あ]げて言[い]われた。「<j>父[ちち]よ、わたしの霊[れい]をあなたの手[て]に委[ゆだ]ねます。</j>」こう言[い]って、息[いき]を引[ひ]き取[と]られた。"
  47: "百人隊長[ひゃくにんたいちょう]は、起[お]こったことを見[み]て神[かみ]をほめたたえ、言[い]った。「本当[ほんとう]に、この人[ひと]は正[ただ]しい人[ひと]であった。」"
  48: "この光景[こうけい]を見[み]ようと集[あつ]まっていた群衆[ぐんしゅう]はみな、起[お]こったことを見[み]て、胸[むね]を打[う]ちながら帰[かえ]って行[い]った。"
  49: "イエスと知[し]り合[あ]いの者[もの]たちはみな、またガリラヤからイエスに従[したが]って来[き]た女[おんな]たちも、遠[とお]くに立[た]って、これらのことを見[み]ていた。"
  50: "そこに、ヨセフという名[な]の議員[ぎいん]がいた。善[よ]い人[ひと]で、正[ただ]しい人[ひと]であり、"
  51: "— 彼[かれ]らの評議[ひょうぎ]と行[おこな]いとに同意[どうい]していなかった — ユダヤ人[じん]の町[まち]アリマタヤの出[で]で、神[かみ]の国[くに]を待[ま]ち望[のぞ]んでいた者[もの]である。"
  52: "この人[ひと]はピラトのもとへ行[い]って、イエスの遺体[いたい]を求[もと]めた。"
  53: "そして、遺体[いたい]を下[お]ろして亜麻布[あまぬの]に包[つつ]み、だれもまだ葬[ほうむ]られたことのない、岩[いわ]を掘[ほ]って造[つく]った墓[はか]に納[おさ]めた。"
  54: "その日[ひ]は準備[じゅんび]の日[ひ]で、安息日[あんそくび]が間近[まぢか]に迫[せま]っていた。"
  55: "ガリラヤからイエスと一緒[いっしょ]に来[き]ていた女[おんな]たちも後[あと]を追[お]って行[い]き、墓[はか]と、遺体[いたい]がどのように納[おさ]められたかを見[み]た。"
  56: "そして帰[かえ]って、香料[こうりょう]と香油[こうゆ]を用意[ようい]した。安息日[あんそくび]には、掟[おきて]に従[したが]って休[やす]んだ。"

notes:
  1: "ἅπαν τὸ πλῆθος αὐτῶν — «всё множество их» (синедрион); 全員が立ち上がり. ἤγαγον — «повели»; 引いていった."
  2: "κατηγορεῖν — «обвинять»; 訴え始めた. Три пункта обвинения в порядке греческого: совращает народ, запрещает платить подать кесарю (φόρος — 税金, как в 20:22), называет себя Христом-царём. Χριστὸν βασιλέα — キリスト、王 (не メシア, иначе не сработает калька ハリストス)."
  3: "Σὺ λέγεις — あなたが言っているとおりだ, как в Мк 15:2 и Мф 27:11. Вопрос Пилата — не красный."
  4: "πρὸς τοὺς ἀρχιερεῖς καὶ τοὺς ὄχλους — 祭司長たちと群衆に (у Марка 15:2 — только первосвященники). οὐδὲν αἴτιον — 何の罪も見つけない."
  5: "Ἀνασείει τὸν λαόν — «возмущает, будоражит народ»; 煽る. ἀρξάμενος ἀπὸ τῆς Γαλιλαίας ἕως ὧδε — «начав от Галилеи до сего места»; порядок греческого сохранён."
  7: "ἐκ τῆς ἐξουσίας Ἡρῴδου — «из власти Ирода», т.е. подвластен ему; 支配下. Галилея была под властью Ирода Антипы; он был в те дни в Иерусалиме."
  8: "ἤλπιζεν … σημεῖον ἰδεῖν ὑπ᾽ αὐτοῦ γινόμενον — «надеялся увидеть от Него бываемое знамение»; しるしが行われるのを見ることを期待していた."
  9: "ἐν λόγοις ἱκανοῖς — «во многих словах»; 多くの言葉で. οὐδὲν ἀπεκρίνατο — 何もお答えにならなかった."
  10: "εὐτόνως — «усиленно, с силой»; 激しく."
  11: "ἐσθῆτα λαμπράν — «светлую, пышную одежду»; あざやかな衣 (ср. Мк 15:17 — порфира, иное слово). σὺν τοῖς στρατεύμασιν — 兵士たちとともに."
  12: "προϋπῆρχον γὰρ ἐν ἔχθρᾳ ὄντες πρὸς αὑτούς — «ибо прежде были во вражде друг с другом»; 敵意を抱いていた."
  13: "τοὺς ἄρχοντας — 指導者たち (не 祭司長); ср. 23:35; 24:20."
  14: "ἀνακρίνας — «исследовав на допросе»; 取り調べた. οὐθὲν … αἴτιον — 何ひとつ見つからなかった."
  15: "ἀνέπεμψεν γὰρ αὐτὸν πρὸς ἡμᾶς — «ибо он отослал его к нам»; оставлено «к нам», как в греческом."
  16: "παιδεύσας — «наказав (бичеванием)»; 懲らしめて; ср. 23:22. Речь Пилата начата в 23:14 и кончается здесь."
  17: "Стиха нет в критическом тексте (в базе пустая строка); Церковь читает (Елизаветинская, jp-joc 節期のために一人の囚を釋ゆすべき事ありき) — весь стих в 〔…〕."
  18: "Αἶρε τοῦτον — букв. «убери этого»; передано 消せ (ср. Синод. «смерть Ему!»), так как в 23:21 требуют уже распятия. ἀπόλυσον — 釈放しろ."
  19: "στάσις — «возмущение, мятеж»; 暴動. βληθεὶς ἐν τῇ φυλακῇ — 牢に入れられていた."
  20: "προσεφώνησεν — «воззвал, обратился»; 呼びかけた. θέλων ἀπολῦσαι — 釈放したいと思い."
  22: "τρίτον — «в третий раз»; 三度目に."
  23: "В критическом только κατίαχυον αἱ φωναὶ αὐτῶν; Церковь (Синод., jp-joc 彼等と祭司諸長との聲は勝てり) читает καὶ τῶν ἀρχιερέων — 〔と祭司長たちの声〕."
  24: "ἐπέκρινεν γενέσθαι τὸ αἴτημα αὐτῶν — «решил, чтобы было по прошению их»; 求めどおりにすることを決めた."
  25: "τῷ θελήματι αὐτῶν — «воле их»; 意のままに. ὃν ᾐτοῦντο — 彼らが求めていた者."
  26: "ὄπισθεν τοῦ Ἰησοῦ — «позади Иисуса»; イエスの後ろについて運ばせた. ἐπιλαβόμενοι — «схватив»; つかまえ."
  27: "ἐκόπτοντο καὶ ἐθρήνουν — «били себя (в грудь) и рыдали»; 泣き悲しむ."
  28: "Θυγατέρες Ἰερουσαλήμ — エルサレムの娘たち. πλὴν — «но, напротив»; むしろ. Слова Христа красные, речь продолжается в 23:29–31."
  29: "Μακάριαι — «блаженны»; 幸いだ. Три члена сохранены: бесплодные, утробы неродившие, сосцы непитавшие. Цитата внутри — 『』."
  30: "Ос 10:8. ἄρξονται λέγειν — 言い始める; цитаты внутри — 『』."
  31: "ὑγρὸν ξύλον / ξηρὸν ξύλον — «дерево сырое / сухое»; 生木／枯れ木."
  33: "Κρανίον — «Лобное (место)»; されこうべと呼ばれる所, как у jp-joc (髑髏). Арамейского Γολγοθᾶ у Луки нет (только Мк 15:22, Мф 27:33), поэтому ゴルゴタ не вставляю."
  34: "В критическом тексте молитва под скобками; Церковь читает (Елизаветинская, jp-joc) — 〔…〕, слова Христа внутри красные. διαμεριζόμενοι … ἔβαλον κλῆρον — 衣を分け、くじを引いた (без 〔〕, это не спорное чтение)."
  35: "σὺν αὐτοῖς в критической базе нет, Церковь читает (jp-joc 有司等も衆と與に嘲りて) — 〔民とともに〕. Ἄλλους ἔσωσεν, σωσάτω ἑαυτόν — сначала «других спас», потом условие и «себя пусть спасёт» (порядок, как у jp-joc: 若し彼ハリストス…ならば、己を救ふべし). εἰ … ὁ Χριστὸς τοῦ θεοῦ ὁ ἐκλεκτός — 神のキリスト、選ばれた者."
  36: "ὄξος — «уксус», кислое вино; 酸いぶどう酒, как в Мк 15:36. Стих обрывается на деепричастии προσφέροντες, продолжение — 23:37."
  37: "Слова воинов — не красные."
  38: "ἐπιγραφή — «надпись»; 罪状の書き (ср. Мф 27:37). В критическом нет «написанная греческими, римскими и еврейскими (буквами)»; Церковь читает (Елизаветинская, jp-joc エㇽリン、ロマ、エウレイの文字) — 〔ギリシア語、ラテン語、ヘブライ語の文字で〕."
  39: "Οὐχὶ σὺ εἶ ὁ Χριστός; — вопрос с оттенком насмешки; キリストではないのか. Слова разбойника — не красные."
  40: "ἐν τῷ αὐτῷ κρίματι εἶ — «в том же осуждении»; 同じ裁きを受けているのに. Речь второго разбойника продолжается в 23:41."
  41: "ἄξια … ἀπολαμβάνομεν — «получаем достойное»; ふさわしい報い. οὐδὲν ἄτοπον — «ничего несообразного»; 何も悪いことをしていない."
  42: "В критическом только Ἰησοῦ, μνήσθητί μου…; Церковь (TR, jp-joc 主よ) читает κύριε — 〔主よ〕. ἐν τῇ βασιλείᾳ σου — дательный места («в Царстве Твоём»), не εἰς; отсюда 御国に来られるとき."
  43: "Ἀμήν σοι λέγω — はっきり言っておく (формула книги, ср. Мф 5:18). παράδεισος — 楽園. σήμερον — 今日, без ослабления в «скоро»."
  44: "ὡσεὶ ὥρα ἕκτη — «около шестого часа»; 第六時ごろ, церковный счёт часов сохранён (ср. Мк 15:33). σκότος … ἐφ᾽ ὅλην τὴν γῆν — 暗闇が全地を覆い."
  45: "τοῦ ἡλίου ἐκλιπόντος — «солнце померкло»; 日は光を失い. ἐσχίσθη … μέσον — «разодралась посередине»; 真ん中から裂けた."
  46: "Пс 30:6. παρατίθεμαι — «предаю, вверяю»; 委ねます. ἐξέπνευσεν — 息を引き取られた."
  47: "ἑκατοντάρχης — 百人隊長. δίκαιος — «праведный»; 正しい人 (у Марка 15:39 — «Сын Божий», различие сохранено). ἐδόξαζεν τὸν θεόν — 神をほめたたえ."
  48: "συμπαραγενόμενοι … ἐπὶ τὴν θεωρίαν — «сошедшиеся на это зрелище»; 光景を見ようと集まっていた. τύπτοντες τὰ στήθη — 胸を打ちながら."
  49: "γνωστοί — «знакомые»; 知り合い. Жёны, пришедшие из Галилеи, — те же, что в 23:55; Богородица здесь не названа и не говорит (тег <mo> не нужен)."
  50: "βουλευτής — член синедриона; 議員 (как Мк 15:43). ἀνὴρ ἀγαθὸς καὶ δίκαιος — 善い人で、正しい人. Стих кончается на «и», продолжение — 23:51."
  51: "Тире критического текста сохранены: вставное пояснение о несогласии с советом и делом (評議と行いに同意していなかった). Ἁριμαθαία — アリマタヤ. προσεδέχετο τὴν βασιλείαν τοῦ θεοῦ — 神の国を待ち望んでいた."
  52: "ᾐτήσατο τὸ σῶμα — 遺体を求めた."
  53: "σινδών — 亜麻布. λαξευτός — «высеченный в скале»; 岩を掘って造った. οὗ οὐκ ἦν οὐδεὶς οὔπω κείμενος — だれもまだ葬られたことのない."
  54: "παρασκευή — 準備の日 (пятница). σάββατον ἐπέφωσκεν — «суббота светало», т.е. приближалась; 安息日が間近に迫っていた (明ける здесь сбивало бы: суббота начиналась с вечера)."
  55: "κατακολουθήσασαι — «последовав»; 後を追って行き. ὡς ἐτέθη τὸ σῶμα — 遺体がどのように納められたか."
  56: "ἀρώματα καὶ μύρα — 香料と香油. κατὰ τὴν ἐντολήν — 掟に従って (Исх 20:10)."
