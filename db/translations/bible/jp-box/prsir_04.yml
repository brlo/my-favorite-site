# jp-box, Сирах, глава 4. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для книги нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 4: милостыня и защита бедных (1–10); премудрость, её плоды и её водительство
# (11–19); хранение себя, речь и ложный стыд (20–31).
# Прямой речи нет; всё — авторское поучение, без кавычек. Красного и синего нет.
# Нумерация по gr: 31 стих. У csl 35 стихов: он дробит gr 4:10 (csl 10–11), 4:17
# (18–19), 4:18 (20–21), 4:20 (23–24), а начиная с csl 4:32 идёт чистый сдвиг
# (csl 4:32–35 = gr 4:28–31). Лишние слав. стихи влиты в соседние греческие:
# csl 4:11 → 4:10, csl 4:19 → 4:17, csl 4:21 → 4:18, csl 4:24 → 4:20; сдвиг
# 4:32–35 учтён, стихи не добавлены и не разделены.
# 〔…〕 нет: все 31 стих есть в gr-lxx-byz. Сносок ⟨…⟩ нет: 施し, 知恵, 孤児,
# 柔和, 相続 уже в корпусе. Имён и топонимов в главе нет.

