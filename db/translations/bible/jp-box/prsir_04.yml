verses:
  1: "子[こ]よ、貧[まず]しい者[もの]の命[いのち]を奪[うば]うな。乏[とぼ]しい者[もの]から目[め]をそらすな。"
  2: "飢[う]えている魂[たましい]を悲[かな]しませるな。乏[とぼ]しい中[なか]にある人[ひと]を怒[いか]らせるな。"
  3: "怒[いか]りを抱[かか]えた心[こころ]をかき乱[みだ]すな。助[たす]けを必要[ひつよう]とする者[もの]への施[ほどこ]しを先延[さきの]ばしにするな。"
  4: "苦[くる]しむ者[もの]の願[ねが]いを退[しりぞ]けるな。貧[まず]しい者[もの]から顔[かお]を背[そむ]けるな。"
  5: "求[もと]める者[もの]から目[め]をそらすな。人[ひと]があなたを呪[のろ]う機会[きかい]を、その人に与[あた]えてはならない。"
  6: "その人[ひと]が魂[たましい]の苦[にが]さのゆえにあなたを呪[のろ]うとき、その人を造[つく]った方[かた]がその願[ねが]いを聞[き]き入[い]れられるからである。"
  7: "集[あつ]まりの間[あいだ]では自分[じぶん]を親[した]しみ深[ぶか]く振[ふ]るまえ、身分[みぶん]の高[たか]い者[もの]の前[まえ]では頭[あたま]を低[ひく]くせよ。"
  8: "貧[まず]しい者[もの]に耳[みみ]を傾[かたむ]け、柔和[にゅうわ]さをもって平和[へいわ]な言葉[ことば]で答[こた]えよ。"
  9: "虐[しいた]げられている者[もの]を、虐げる者[もの]の手から救[すく]い出[だ]せ。裁[さば]くときに、心[こころ]を弱[よわ]らせるな。"
  10: "孤児[こじ]たちには父[ちち]のように、その母[はは]には夫[おっと]に代[か]わる者[もの]となれ。そうすれば、あなたはいと高[たか]き方[かた]の子[こ]のようになり、その方はあなたの母[はは]にもましてあなたを愛[あい]される。"
  11: "知恵[ちえ]は自分[じぶん]の子[こ]らを高[たか]くし、自分を求[もと]める者[もの]たちに手を差[さ]し伸[の]べる。"
  12: "知恵[ちえ]を愛[あい]する者[もの]は命[いのち]を愛する。朝[あさ]早[はや]くから知恵に尋[たず]ねる者[もの]たちは喜[よろこ]びに満[み]たされる。"
  13: "知恵[ちえ]をしっかりとらえる者[もの]は栄光[えいこう]を受け継[つ]ぐ。知恵が入[はい]るところを、主[しゅ]は祝福[しゅくふく]される。"
  14: "知恵[ちえ]に仕[つか]える者[もの]たちは聖[せい]なる方[かた]に仕える。知恵を愛する者たちを、主は愛される。"
  15: "知恵[ちえ]に聞[き]き従[したが]う者[もの]は諸国[しょこく]の民[たみ]を裁[さば]き、知恵に心[こころ]を向[む]ける者[もの]は安[あん]心[しん]して住[す]まう。"
  16: "知恵[ちえ]を信[しん]じるなら、あなたは知恵を受け継[つ]ぎ、あなたの子孫[しそん]も知恵を所有[しょゆう]する。"
  17: "ただし、初[はじ]めのうちは知恵[ちえ]はその人[ひと]と曲[ま]がりくねった道[みち]を行[い]き、恐[おそ]れと臆病[おくびょう]をその人に臨[のぞ]ませ、自分の戒[いまし]めによってその人を苦[くる]しめる。その人[ひと]が魂[たましい]のうちに信[しん]じるようになるまで、知恵[ちえ]は自分[じぶん]の定[さだ]めによってその人を試[ため]す。"
  18: "そしてまた、まっすぐな道[みち]をたどってその人[ひと]のところへ戻[もど]り、その人を喜[よろこ]ばせ、自分[じぶん]の秘密[ひみつ]を明[あき]らかにする。"
  19: "しかし、その人[ひと]が迷[まよ]い出[で]るなら、知恵[ちえ]はその人を見捨[みす]て、その人の堕落[だらく]の手に渡[わた]す。"
  20: "時[とき]をわきまえ、悪[あく]から身[み]を守[まも]れ。あなたの魂[たましい]のことでは、恥[は]じるな。"
  21: "罪[つみ]を招[まね]く恥[はじ]もあれば、栄光[えいこう]と恵[めぐ]みとなる恥もあるからである。"
  22: "あなたの魂[たましい]に逆[さか]らって人[ひと]の顔色[かおいろ]をうかがうな。自分[じぶん]の倒[たお]れたことを恥[は]じるな。"
  23: "必要[ひつよう]な時[とき]に言葉[ことば]を差[さ]し控[ひか]えるな。"
  24: "言葉[ことば]によって知恵[ちえ]が知[し]られ、舌[した]の言葉によって教[おし]えが知られるからである。"
  25: "真理[しんり]に逆[さか]らうな。自分[じぶん]の無知[むち]を恥[は]じよ。"
  26: "自分[じぶん]の罪[つみ]を告白[こくはく]することを恥[は]じるな。川[かわ]の流[なが]れを押[お]し止[と]めるな。"
  27: "愚[おろ]かな人[ひと]の足[あし]の下[した]に身[み]を横[よこ]たえるな。力[ちから]ある者[もの]の顔色[かおいろ]をうかがうな。"
  28: "死[し]に至[いた]るまで真理[しんり]のために戦[たたか]え。そうすれば、主[しゅ]なる神[かみ]があなたのために戦ってくださる。"
  29: "舌[した]で性急[せいきゅう]な者[もの]となり、あなたの業[わざ]に怠[なま]けて力[ちから]のない者[もの]となってはならない。"
  30: "自分[じぶん]の家[いえ]で獅子[しし]のようであってはならない。家[いえ]の者[もの]たちに荒[あら]々[あら]しく振[ふ]るまってはならない。"
  31: "あなたの手が、受[う]け取[と]るときに伸[の]び、返[かえ]すときに引[ひ]っ込[こ]んでいてはならない。"

notes:
  1: "Τέκνον — «чадо»; τὴν ζωὴν τοῦ πτωχοῦ μὴ ἀποστερήσῃς — «жизни нищего не лиши» (ἀποστερέω — лишать); μὴ παρελκύσῃς ὀφθαλμοὺς ἐπιδεεῖς — «не затягивай, не томи ожиданием глаза нуждающихся» (παρελκύω; ἐπιδεής — нуждающийся). ζωή здесь — жизнь и средства к жизни (слав. «живота не лиши», ru «не отказывай в пропитании»); сглаживания нет. Слав. «не отвращай очес от просящаго» — иное чтение, взято по паритету: 目をそらすな."
  2: "ψυχὴν πεινῶσαν — «душу алчущую»; μὴ λυπήσῃς — «не оскорби, не опечаль» (λυπέω); ἄνδρα ἐν ἀπορίᾳ αὐτοῦ — «мужа в скудости его» (ἀπορία — нужда, безвыходность)."
  3: "καρδίαν παρωργισμένην μὴ προσταράξῃς — «сердце раздражённое не возмути» (προσταράσσω — смущать, колебать); μὴ παρελκύσῃς δόσιν — «не откладывай даяния» (δόσις — дар, подаяние); προσδεομένου — «нуждающегося» (προσδέομαι)."
  4: "ἱκέτην θλιβόμενον μὴ ἀπαναίνου — «умоляющего угнетённого не отвергай» (ἱκέτης — проситель; ἀπαναίνομαι — отказывать); слав. «раба скорбяща» иначе передаёт ἱκέτης; μὴ ἀποστρέψῃς τὸ πρόσωπόν σου — «не отврати лица твоего»."
  5: "ἀπὸ δεομένου μὴ ἀποστρέψῃς ὀφθαλμόν — «от просящего не отврати око» (ἀποστρέφω); μὴ δῷς τόπον ἀνθρώπῳ καταράσασθαί σε — «не дай места человеку проклясть тебя» (τόπος — место; καταράομαι)."
  6: "ἐν πικρίᾳ ψυχῆς αὐτοῦ — «в горечи души своей» (πικρία — горечь); τῆς δεήσεως αὐτοῦ ἐπακούσεται — «услышит моление его» (δέησις, ἐπακούω); ὁ ποιήσας αὐτόν — «Сотворивший его»."
  7: "προσφιλῆ συναγωγῇ σεαυτὸν ποίει — «делай себя приятным собранию» (προσφιλής — любезный, приятный; συναγωγή — собрание); μεγιστᾶνι ταπείνου τὴν κεφαλήν σου — «вельможе смиряй главу твою» (μεγιστάν — вельможа), слав. «князю»."
  8: "κλῖνον πτωχῷ τὸ οὖς σου — «приклони нищему ухо твоё» (κλίνω); ἀποκρίθητι αὐτῷ εἰρηνικά — «ответь ему мирное» (εἰρηνικά — мирное, примирительное); ἐν πραΰτητι — «в кротости»."
  9: "ἐξελοῦ ἀδικούμενον ἐκ χειρὸς ἀδικοῦντος — «избавь обижаемого из руки обижающего» (ἐξαιρέω); μὴ ὀλιγοψυχήσῃς ἐν τῷ κρίνειν σε — «не малодушествуй, когда судишь» (ὀλιγοψυχέω — падать духом)."
  10: "γίνου ὀρφανοῖς ὡς πατήρ — «будь сиротам как отец» (ὀρφανός); ἀντὶ ἀνδρὸς τῇ μητρὶ αὐτῶν — «вместо мужа матери их»; ἔσῃ ὡς υἱὸς ὑψίστου — «будешь как сын Вышнего» (ὕψιστος); ἀγαπήσει σε μᾶλλον ἢ μήτηρ σου — «возлюбит тебя более, чем мать твоя». Слав. делит стих на csl 4:10–11; держимся деления гр."
  11: "Ἡ σοφία υἱοὺς αὐτῆς ἀνύψωσεν — «премудрость сынов своих возвысила» (ἀνυψόω); ἐπιλαμβάνεται τῶν ζητούντων αὐτήν — «берёт, поддерживает ищущих её» (ἐπιλαμβάνομαι)."
  12: "ὁ ἀγαπῶν αὐτὴν ἀγαπᾷ ζωήν — «любящий её любит жизнь»; οἱ ὀρθρίζοντες πρὸς αὐτήν — «встающие рано к ней» (ὀρθρίζω — вставать на заре); ἐμπλησθήσονται εὐφροσύνης — «исполнятся веселия» (ἐμπίπλημι)."
  13: "ὁ κρατῶν αὐτῆς κληρονομήσει δόξαν — «держащий её наследует славу» (κρατέω — держать, владеть; κληρονομέω); οὗ εἰσπορεύεται, εὐλογεῖ κύριος — «куда входит, Господь благословляет» (εἰσπορεύομαι)."
  14: "οἱ λατρεύοντες αὐτῇ — «служащие ей» (λατρεύω); λειτουργήσουσιν ἁγίῳ — «послужат Святому» (λειτουργέω — священнослужение, служение; ἅγιος — Святой), слав. «святому»."
  15: "ὁ ὑπακούων αὐτῆς κρινεῖ ἔθνη — «слушающий её будет судить народы» (ὑπακούω; κρίνω); ὁ προσέχων αὐτῇ — «внимающий ей» (προσέχω); κατασκηνώσει πεποιθώς — «поселится с доверием» (κατασκηνόω — поселяться; πείθω — доверять)."
  16: "ἐὰν ἐμπιστεύσῃ — «если доверишься» (ἐμπιστεύω); κατακληρονομήσει αὐτήν — «наследуешь её» (κατακληρονομέω); ἐν κατασχέσει ἔσονται αἱ γενεαὶ αὐτοῦ — «во владении будут роды его» (κατάσχεσις — владение, обладание)."
  17: "διεστραμμένως πορεύσεται μετ᾽ αὐτοῦ ἐν πρώτοις — «извращённо (криво) пойдёт с ним вначале» (διαστρέφω — искривлять); φόβον καὶ δειλίαν ἐπάξει ἐπ᾽ αὐτόν — «наведёт на него страх и робость» (δειλία); βασανίσει αὐτὸν ἐν παιδείᾳ αὐτῆς — «будет мучить его в наказании своём» (βασανίζω, παιδεία); ἕως οὗ ἐμπιστεύσῃ τῇ ψυχῇ αὐτοῦ — «доколе не уверит душу его»; πειράσει ἐν τοῖς δικαιώμασιν — «искусит в оправданиях (уставах) своих» (δικαίωμα)."
  18: "ἐπανήξει κατ᾽ εὐθεῖαν πρὸς αὐτόν — «вернётся прямо к нему» (ἐπάνειμι); εὐφρανεῖ αὐτόν — «возвеселит его»; ἀποκαλύψει αὐτῷ τὰ κρυπτὰ αὐτῆς — «откроет ему сокрытое своё» (ἀποκαλύπτω)."
  19: "ἐὰν ἀποπλανηθῇ — «если заблудится» (ἀποπλανάομαι); ἐγκαταλείψει αὐτόν — «оставит его» (ἐγκαταλείπω); παραδώσει αὐτὸν εἰς χεῖρας πτώσεως αὐτοῦ — «предаст его в руки падения его» (πτῶσις — падение)."
  20: "συντήρησον καιρόν — «соблюди время» (συντηρέω; καιρός — время, срок); φύλαξαι ἀπὸ πονηροῦ — «храни себя от лукавого (злого)» (φυλάσσω); περὶ τῆς ψυχῆς σου μὴ αἰσχυνθῇς — «о душе твоей не постыдись» (αἰσχύνομαι)."
  21: "ἔστιν αἰσχύνη ἐπάγουσα ἁμαρτίαν — «есть стыд, наводящий грех» (αἰσχύνη, ἐπάγω); ἔστιν αἰσχύνη δόξα καὶ χάρις — «есть стыд — слава и благодать» (χάρις — 恵み). Антитеза двух стыдов сохранена."
  22: "μὴ λάβῃς πρόσωπον κατὰ τῆς ψυχῆς σου — «не прими лица против души твоей» (λαμβάνω πρόσωπον — лицеприятствовать); μὴ ἐντραπῇς εἰς πτῶσίν σου — «не устыдись в падение своё» (ἐντρέπομαι), слав. «о падении твоем»."
  23: "μὴ κωλύσῃς λόγον ἐν καιρῷ χρείας — «не возбрани слова во время нужды» (κωλύω — препятствовать; χρεία — нужда), слав. «во время спасения»."
  24: "ἐν γὰρ λόγῳ γνωσθήσεται σοφία — «ибо в слове познается премудрость» (γινώσκω); παιδεία ἐν ῥήματι γλώσσης — «научение в слове языка» (παιδεία — наставление, учение; ῥῆμα — слово), передано 教え."
  25: "μὴ ἀντίλεγε τῇ ἀληθείᾳ — «не пререкай истине» (ἀντιλέγω — противоречить); περὶ τῆς ἀπαιδευσίας σου ἐντράπηθι — «о невежестве твоём устыдись» (ἀπαιδευσία — невоспитанность, невежество)."
  26: "μὴ αἰσχυνθῇς ὁμολογῆσαι ἐφ᾽ ἁμαρτίαις σου — «не постыдись исповедать грехи твои» (ὁμολογέω — исповедовать, открыто признавать); μὴ βιάζου ῥοῦν ποταμοῦ — «не принуждай, не задерживай течение реки» (βιάζομαι — принуждать; ῥοῦς — поток, течение)."
  27: "μὴ ὑποστρώσῃς ἀνθρώπῳ μωρῷ σεαυτόν — «не подстели себя человеку глупому» (ὑποστρώννυμι — подстилать; μωρός — глупый); μὴ λάβῃς πρόσωπον δυνάστου — «не прими лица властелина» (δυνάστης — властитель, силач)."
  28: "ἕως θανάτου ἀγώνισαι περὶ τῆς ἀληθείας — «до смерти подвизайся об истине» (ἀγωνίζομαι — подвизаться, бороться); κύριος ὁ θεὸς πολεμήσει ὑπὲρ σοῦ — «Господь Бог будет воевать за тебя» (πολεμέω)."
  29: "μὴ γίνου θρασὺς ἐν γλώσσῃ σου — «не будь дерзок языком» (θρασύς — дерзкий, наглый); слав. «не буди скор языком» — «не будь скор», иное чтение, взято по паритету; νωθρὸς καὶ παρειμένος ἐν τοῖς ἔργοις σου — «вялый и расслабленный в делах твоих» (νωθρός — вялый; παρίημι — ослаблять)."
  30: "μὴ ἴσθι ὡς λέων ἐν τῷ οἴκῳ σου — «не будь как лев в доме твоём»; φαντασιοκοπῶν ἐν τοῖς οἰκέταις σου — «мечтая (капризничая, подозревая) на домочадцев твоих» (φαντασιοκοπέω; οἰκέτης — домочадец, слуга); слав. «жестоконеистов» — «яростен», передано 荒々しく振る舞う."
  31: "μὴ ἔστω ἡ χείρ σου ἐκτεταμένη εἰς τὸ λαβεῖν — «да не будет рука твоя простёрта на взятие» (ἐκτείνω — простирать); ἐν τῷ ἀποδιδόναι συνεσταλμένη — «при отдаянии сжата» (συστέλλω — сжимать, сокращать)."
