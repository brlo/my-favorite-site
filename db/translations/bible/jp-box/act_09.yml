verses:
  1: "サウロはなおも主[しゅ]の弟子[でし]たちに対[たい]して脅[おど]しと殺意[さつい]に燃[も]えながら、祭司長[さいしちょう]のところへ行[い]って、"
  2: "ダマスコの諸会堂[しょかいどう]にあてた手紙[てがみ]を彼[かれ]から受[う]け取[と]り、この道[みち]の者[もの]が男[おとこ]でも女[おんな]でも見[み]つかれば、縛[しば]ってエルサレムへ引[ひ]き立[た]てるためであった。"
  3: "道[みち]を進[すす]んでダマスコに近[ちか]づいたとき、突然[とつぜん]、天[てん]から光[ひかり]が彼[かれ]の周[まわ]りを照[て]らした。"
  4: "彼[かれ]は地[ち]に倒[たお]れて、自分[じぶん]に語[かた]りかける声[こえ]を聞[き]いた。「<j>サウロ、サウロ、なぜわたしを迫害[はくがい]するのか。</j>」"
  5: "彼[かれ]は言[い]った。「主[しゅ]よ、あなたはどなたですか。」「<j>わたしは、あなたが迫害[はくがい]しているイエスである。〔とげの付[つ]いた棒[ぼう]を蹴[け]るのは、あなたにとって難[むずか]しい。〕</j>"
  6: "〔彼[かれ]は震[ふる]えおののいて言[い]った。「主[しゅ]よ、わたしに何[なに]をしてほしいのですか。」〕<j>立[た]ち上[あ]がって町[まち]に入[はい]りなさい。そうすれば、あなたのすべきことを告[つ]げられる。</j>」"
  7: "彼[かれ]と同行[どうこう]していた人々[ひとびと]は、声[こえ]は聞[き]こえるのにだれも見[み]えず、物[もの]も言[え]ずに立[た]ち尽[つ]くしていた。"
  8: "サウロは地[ち]から起[お]き上[あ]がったが、目[め]は開[ひら]いているのに何[なに]も見[み]えなかった。人々[ひとびと]は彼[かれ]の手[て]を引[ひ]いて、ダマスコへ連[つ]れて行[い]った。"
  9: "彼[かれ]は三日[みっか]の間[あいだ]、目[め]が見[み]えず、食[た]べることも飲[の]むこともなかった。"
  10: "ダマスコにアナニアという名[な]の弟子[でし]がいた。主[しゅ]は幻[まぼろし]の中[なか]で彼[かれ]に言[い]われた。「<j>アナニア。</j>」彼[かれ]は言[い]った。「主[しゅ]よ、わたしはここにいます。」"
  11: "主[しゅ]は彼[かれ]に言[い]われた。「<j>立[た]ち上[あ]がって、『まっすぐな道[みち]』と呼[よ]ばれる通[とお]りへ行[い]き、ユダの家[いえ]で、タルソの人[ひと]サウロという名[な]の者[もの]を捜[さが]しなさい。見[み]よ、彼[かれ]は今[いま]、祈[いの]っている。</j>」"
  12: "そして、アナニアという名[な]の人[ひと]が入[はい]って来[き]て、彼[かれ]に手[て]を置[お]き、目[め]が見[み]えるようにするのを、幻[まぼろし]の中[なか]で見[み]たのである。"
  13: "アナニアは答[こた]えた。「主[しゅ]よ、わたしはこの人[ひと]について多[おお]くの人[ひと]から聞[き]きました。彼[かれ]がエルサレムで、あなたの聖[せい]なる者[もの]たちにどれほど悪[わる]いことをしたか、"
  14: "また、ここでも、あなたの名[な]を呼[よ]び求[もと]める者[もの]をすべて縛[しば]る権限[けんげん]を、祭司長[さいしちょう]たちから受[う]けているのです。」"
  15: "しかし、主[しゅ]は彼[かれ]に言[い]われた。「<j>行[い]きなさい。この人[ひと]は、異邦人[いほうじん]にも王[おう]たちにもイスラエルの子[こ]らにも、わたしの名[な]を運[はこ]ぶために、わたしが選[えら]んだ器[うつわ]である。</j>"
  16: "<j>わたしは彼[かれ]に、わたしの名[な]のためにどれほど苦[くる]しみを受[う]けなければならないかを示[しめ]そう。</j>」"
  17: "そこでアナニアは出[で]かけて行[い]き、その家[いえ]に入[はい]って、サウロに手[て]を置[お]き、言[い]った。「兄弟[きょうだい]サウロ、あなたが来[き]た道[みち]で、あなたに現[あらわ]れた主[しゅ]イエスが、わたしを遣[つか]わされた。あなたが目[め]が見[み]えるようになり、{聖霊[せいれい]|聖神[せいしん]}に満[み]たされるためである。」"
  18: "するとたちまち、鱗[うろこ]のようなものが彼[かれ]の目[め]から落[お]ち、目[め]が見[み]えるようになった。彼[かれ]は立[た]ち上[あ]がって洗礼[せんれい]を受[う]け、"
  19: "食[しょく]べ物[もの]を取[と]って力[ちから]を得[え]た。彼[かれ]はダマスコの弟子[でし]たちと数日[すうじつ]を過[す]ごした。"
  20: "そしてすぐに、会堂[かいどう]でイエスこそ神[かみ]の子[こ]であると宣[の]べ伝[つた]えた。"
  21: "これを聞[き]いた者[もの]は皆[みな]、驚[おどろ]いて言[い]った。「この人[ひと]は、エルサレムでこの名[な]を呼[よ]び求[もと]める者[もの]たちを荒[あ]らした者[もの]ではないか。ここへ来[き]たのも、彼[かれ]らを縛[しば]って祭司長[さいしちょう]たちのところへ引[ひ]き立[た]てるためではなかったか。」"
  22: "サウロはますます力[ちから]を増[ま]し、ダマスコに住[す]むユダヤ人[じん]たちに、この方[かた]こそキリストであると証明[しょうめい]して、論破[ろんぱ]した。"
  23: "かなりの日[ひ]がたつと、ユダヤ人[じん]たちはサウロを殺[ころ]そうと相談[そうだん]した。"
  24: "しかし、その陰謀[いんぼう]はサウロに知[し]れた。彼[かれ]らは彼[かれ]を殺[ころ]そうと、昼[ひる]も夜[よる]も町[まち]の門[もん]を見張[みは]っていた。"
  25: "そこで弟子[でし]たちは夜[よる]、彼[かれ]をかごに入[い]れて城壁[じょうへき]からつり下[お]ろした。"
  26: "サウロはエルサレムに着[つ]くと、弟子[でし]たちに交[まじ]わろうとしたが、彼[かれ]らは皆[みな]、彼[かれ]が弟子[でし]であることを信[しん]じられず、彼[かれ]を恐[おそ]れた。"
  27: "しかし、バルナバは彼[かれ]を引[ひ]き合[あ]わせて使徒[しと]たちのもとへ連[つ]れて行[い]き、道[みち]で主[しゅ]を見[み]たこと、主[しゅ]が彼[かれ]に語[かた]られたこと、またダマスコでイエスの名[な]によって大胆[だいたん]に語[かた]ったことを話[はな]して聞[き]かせた。"
  28: "それから彼[かれ]は、彼[かれ]らとともにエルサレムで自由[じゆう]に出入[でい]りし、主[しゅ]の名[な]によって大胆[だいたん]に語[かた]った。"
  29: "また、ギリシア語[ご]を話[はな]すユダヤ人[じん]たちと語[かた]り合[あ]い、論[ろん]じ合[あ]った。しかし、彼[かれ]らはサウロを殺[ころ]そうと企[たくら]んだ。"
  30: "兄弟[きょうだい]たちはそれを知[し]ると、彼[かれ]をカイサリアへ連[つ]れて下[くだ]り、タルソへ送[おく]り出[だ]した。"
  31: "こうして、ユダヤ、ガリラヤ、サマリアの全[ぜん]地方[ちほう]の諸教会[しょきょうかい]は平和[へいわ]を保[たも]ち、主[しゅ]を畏[おそ]れて歩[あゆ]みつつ建[た]てられ、{聖霊[せいれい]|聖神[せいしん]}の慰[なぐさ]めによって数[かず]を増[ま]していった。"
  32: "ペトロは方々[ほうぼう]を巡[めぐ]って、リダに住[す]む聖[せい]なる者[もの]たちのところへも下[くだ]って行[い]った。"
  33: "そこに、アイネアという名[な]の男[おとこ]がいた。八[やっ]年[つ]の間[あいだ]、体[からだ]が麻痺[まひ]して寝台[しんだい]に伏[ふ]せていたのである。"
  34: "ペトロは彼[かれ]に言[い]った。「アイネア、イエス・キリストがあなたを癒[いや]される。起[お]き上[あ]がって、自分[じぶん]で床[とこ]を整[ととの]えなさい。」すると彼[かれ]はただちに起[お]き上[あ]がった。"
  35: "リダとサロンに住[す]む者[もの]たちは皆[みな]、彼[かれ]を見[み]て、主[しゅ]に立[た]ち返[かえ]った。"
  36: "ヨッパにタビタという名[な]の女[おんな]の弟子[でし]がいた。その名[な]はギリシア語[ご]でドルカスという。彼女[かのじょ]は多[おお]くの善[ぜん]い行[おこな]いと施[ほどこ]しを行[おこな]う人[ひと]であった。"
  37: "そのころ、彼女[かのじょ]は病[や]んで死[し]んだ。人々[ひとびと]は彼女[かのじょ]を洗[あら]って、二階[にかい]の部屋[へや]に安置[あんち]した。"
  38: "リダはヨッパに近[ちか]かったので、弟子[でし]たちはペトロがそこにいると聞[き]き、二人[ふたり]の者[もの]を遣[つか]わして、「どうか、ためらわずにわたしたちのところへ来[き]てください」と頼[たの]んだ。"
  39: "そこでペトロは立[た]ち上[あ]がって、彼[かれ]らとともに行[い]った。着[つ]くと、彼[かれ]らは彼[かれ]を二階[にかい]の部屋[へや]へ案内[あんない]した。やもめたちは皆[みな]、泣[な]きながら彼[かれ]のそばに立[た]ち、ドルカスが一緒[いっしょ]にいたころに作[つく]った下着[したぎ]や上着[うわぎ]を見[み]せた。"
  40: "ペトロは皆[みな]を外[そと]に出[だ]し、ひざまずいて祈[いの]った。そして、遺体[いたい]のほうを向[む]いて言[い]った。「タビタ、起[お]きなさい。」彼女[かのじょ]は目[め]を開[ひら]き、ペトロを見[み]て起[お]き上[あ]がった。"
  41: "彼[かれ]は手[て]を貸[か]して彼女[かのじょ]を起[おこ]し、聖[せい]なる者[もの]たちとやもめたちを呼[よ]んで、生[い]きた彼女[かのじょ]を彼[かれ]らの前[まえ]に立[た]たせた。"
  42: "このことがヨッパ中[じゅう]に知[し]れわたり、多[おお]くの人[ひと]が主[しゅ]を信[しん]じた。"
  43: "ペトロは長[なが]い間[あいだ]、ヨッパで、皮[かわ]をなめす職人[しょくにん]シモンという人[ひと]の家[いえ]に滞在[たいざい]した。"

notes:
  1: "ἐμπνέων ἀπειλῆς καὶ φόνου — «дыша угрозами и убийством»; 脅しと殺意に燃えて. ἀρχιερεύς — 祭司長."
  2: "ἡ ὁδός — «Путь», самоназвание христиан (ср. 19:9, 22:4); この道. Сноска при первом упоминании в Деяниях."
  4: "Σαοὺλ Σαούλ — двойное обращение, как в греч.; サウロ、サウロ."
  5: "В критической базе ответ Господа кончается на διώκεις; σκληρόν σοι πρὸς κέντρα λακτίζειν (церковное чтение, ср. 26:14) — в 〔…〕. κέντρα — «стрекала, рожон», палка с острым наконечником, которой погоняют волов."
  6: "В критической базе стих начинается с ἀλλά; церковный текст (Елизаветинская, jp-joc「主よ、我が何を爲さんことを欲するか」) вставляет вопрос Савла τρόμων τε καὶ θαμβῶν… — в 〔…〕. Слова Христа — красным."
  10: "Слова Господа в видении — это Христос (ср. 9:17), поэтому «Анания!» красным; ответ Анании — не красным."
  12: "В критической базе [ἐν ὁράματι] и [τὰς] стоят в квадратных скобках — слова есть, 〔…〕 не ставится."
  17: "πλησθῇς πνεύματος ἁγίου — «исполнился Духа Святого»; 聖霊 дано калькой {聖霊[せいれい]|聖神[せいしん]}."
  18: "λεπίδες — «чешуйки»; 鱗."
  22: "συνέχυννεν — «приводил в замешательство, сбивал»; 論破した. Συμβιβάζων — «доказывая, сводя воедино»; 証明して."
  31: "В критической базе ἐκκλησία в единственном числе; церковный текст (Елизаветинская «Церкви же…», jp-joc 諸教會) читает αἱ ἐκκλησίαι — 諸教会, церковная форма без 〔〕: замена, а не добавка (ср. 7:37). παράκλησις — «утешение, ободрение»; 慰め."
  36: "Ταβιθά — арамейское имя, Δορκάς — греч. «газель»; перевод дан в самом греческом тексте, поэтому ギリシア語に訳せばドルカス."
  39: "χιτῶνας καὶ ἱμάτια — нижняя и верхняя одежда; 下着や上着."
  43: "βυρσεύς — кожевник; ремесло считалось нечистым, поэтому дом у моря (10:6, 32)."
