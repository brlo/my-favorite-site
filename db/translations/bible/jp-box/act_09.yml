# jp-box, Деяния апостолов, глава 9. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 9: обращение Савла (1–19а), проповедь в Дамаске и бегство (19б–25),
# Саул в Иерусалиме и в Тарсе (26–31), Пётр в Лидде (32–35), в Иоппии (36–43).
# Красное: 9:4–6 — голос Христа Савлу (включая церковное «трудно тебе идти
# против рожна»); 9:10 — только «Анания!» (говорит Господь, это Христос);
# 9:11–12 и 9:15–16 — слова Господа Анании. Ответ Анании «вот я, Господи»
# (9:10) и его слова (9:13–14, 17), речь Петра (9:34, 40) — не красным;
# 9:12 — повествование, не красным.
# 〔…〕: 9:5б «трудно тебе идти против рожна» и 9:6а вопрос Савла в критической
# базе отсутствуют (церковное чтение). 9:12: [ἐν ὁράματι], [τὰς] в базе есть.
# 9:31 — церковное «церкви» (мн. ч.) при единственном в базе: замена без 〔〕.
# Сноска: 9:2 «этот путь» — первое упоминание в Деяниях.
# jp-ni не использовался.

