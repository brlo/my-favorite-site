verses:
  1: "イスラエルの王[おう]ヤロブアムの第二十七[だいにじゅうなな]年[ねん]に、アマツヤの子[こ]アザリヤがユダの王となった。"
  2: "彼[かれ]は十六歳[じゅうろくさい]で王[おう]となり、エルサレムで五十二[ごじゅうに]年[ねん]治[おさ]めた。母[はは]の名[な]はエコルヤといい、エルサレムの出[で]であった。"
  3: "彼は主[しゅ]の目[め]に正[ただ]しいことを行[おこな]い、父[ちち]アマツヤが行ったすべてのことに従[したが]った。"
  4: "ただ、高[たか]い所[ところ]は除[のぞ]かなかった。民[たみ]はなおも高い所で犠牲[ぎせい]を献[ささ]げ、香[こう]をたいた。"
  5: "主[しゅ]は王[おう]に触[ふ]れられ、王は死[し]ぬ日[ひ]まで癩病[らいびょう]の者[もの]であった。彼は隔離[かくり]された家[いえ]で暮[く]らし、王の子[こ]ヨタムが宮[みや]の上[うえ]にいて、その地[ち]の民[たみ]を裁[さば]いた。"
  6: "アザリヤの残[のこ]りの言葉[ことば]、彼が行[おこな]ったすべてのことは、見[み]よ、ユダの王[おう]たちの日[ひ]々[び]の言葉の書[しょ]に記[しる]されているではないか。"
  7: "アザリヤは父[ちち]たちとともに眠[ねむ]り、ダビデの町[まち]で父たちとともに葬[ほうむ]られた。代[か]わってその子[こ]ヨタムが王[おう]となった。"
  8: "ユダの王アザリヤの第三十八[だいさんじゅうはち]年[ねん]に、ヤロブアムの子[こ]ゼカリヤがサマリアでイスラエルの王となり、六か月[ろっかげつ]治[おさ]めた。"
  9: "彼は主[しゅ]の目[め]に悪[わる]いことを行[おこな]い、父[ちち]たちが行ったように、ネバトの子[こ]ヤロブアムがイスラエルに犯[おか]させた罪[つみ]から離[はな]れなかった。"
  10: "ヤベシュの子[こ]シャルムとケブラアムが彼に対[たい]して謀[む]を企[くわだ]て、彼を打[う]ち殺[ころ]した。シャルムが代[か]わって王[おう]となった。"
  11: "ゼカリヤの残[のこ]りの言葉は、見[み]よ、イスラエルの王[おう]たちの日[ひ]々[び]の言葉の書[しょ]に記[しる]されている。"
  12: "これは主[しゅ]がイエフに語[かた]られた主の言葉[ことば]である。「あなたの子[こ]らは四代[よんだい]までイスラエルの王座[おうざ]に就[つ]く。」そのとおりになった。"
  13: "ヤベシュの子[こ]シャルムが王[おう]となった。ユダの王アザリヤの第三十九[だいさんじゅうきゅう]年[ねん]に、シャルムはサマリアで一か月[いっかげつ]治[おさ]めた。"
  14: "ガディの子[こ]メナヘムはティルツァから上[のぼ]って来[き]てサマリアに来[き]た。そしてサマリアでヤベシュの子シャルムを打[う]ち殺[ころ]し、代[か]わって王[おう]となった。"
  15: "シャルムの残[のこ]りの言葉と、彼が企[くわだ]てた謀[む]は、見[み]よ、イスラエルの王[おう]たちの日[ひ]々[び]の言葉の書[しょ]に記[しる]されている。"
  16: "そのとき、メナヘムはティルツァとその中[なか]のすべて、およびティルツァから続[つづ]くその領土[りょうど]を打[う]った。彼らが彼に門[もん]を開[ひら]かなかったからである。彼はそれを打ち、その中にいた妊婦[にんぷ]たちを裂[さ]いた。"
  17: "ユダの王アザリヤの第三十九[だいさんじゅうきゅう]年[ねん]に、ガディの子[こ]メナヘムがイスラエルの王となり、サマリアで十年[じゅうねん]治[おさ]めた。"
  18: "彼は主[しゅ]の目[め]に悪[わる]いことを行[おこな]い、ネバトの子[こ]ヤロブアムがイスラエルに犯[おか]させたすべての罪[つみ]から、生涯[しょうがい]離[はな]れなかった。"
  19: "彼の日[ひ]々[び]に、アッシリアの王[おう]プルがその地[ち]に上[のぼ]って来[き]た。メナヘムはプルに銀[ぎん]一千[いっせん]タラントを与[あた]え、彼の手[て]が自分[じぶん]とともにあるようにした。"
  20: "メナヘムはこの銀をイスラエルに、すなわち力[ちから]ある者[もの]すべてに課[か]して、アッシリアの王[おう]に与[あた]えた。一人[ひとり]につき五十[ごじゅう]シケルであった。アッシリアの王は帰[かえ]って行[い]き、その地[ち]に留[とど]まらなかった。"
  21: "メナヘムの残[のこ]りの言葉[ことば]、彼が行[おこな]ったすべてのことは、見[み]よ、イスラエルの王[おう]たちの日[ひ]々[び]の言葉の書[しょ]に記[しる]されている。"
  22: "メナヘムは父[ちち]たちとともに眠[ねむ]り、代[か]わってその子[こ]ペカヒヤが王[おう]となった。"
  23: "ユダの王アザリヤの第五十[だいごじゅう]年[ねん]に、メナヘムの子[こ]ペカヒヤがサマリアでイスラエルの王となり、二年[にねん]治[おさ]めた。"
  24: "彼は主[しゅ]の目[め]に悪[わる]いことを行[おこな]い、ネバトの子[こ]ヤロブアムがイスラエルに犯[おか]させた罪[つみ]から離[はな]れなかった。"
  25: "彼の副将[ふくしょう]であるレマルヤの子[こ]ペカハが彼に対[たい]して謀[む]を企[くわだ]て、サマリアで、王[おう]の家[いえ]の前[まえ]で、アルゴブとアリエとともに彼を打[う]ち殺[ころ]した。彼とともにギレアデ人[じん]五十人[ごじゅうにん]がいた。ペカハは彼を殺[ころ]し、代[か]わって王となった。"
  26: "ペカヒヤの残[のこ]りの言葉、彼が行ったすべてのことは、見[み]よ、イスラエルの王[おう]たちの日[ひ]々[び]の言葉の書[しょ]に記[しる]されている。"
  27: "ユダの王アザリヤの第五十二[だいごじゅうに]年[ねん]に、レマルヤの子[こ]ペカハがサマリアでイスラエルの王となり、二十年[にじゅうねん]治[おさ]めた。"
  28: "彼は主[しゅ]の目[め]に悪[わる]いことを行[おこな]い、ネバトの子[こ]ヤロブアムがイスラエルに犯[おか]させたすべての罪[つみ]から離[はな]れなかった。"
  29: "イスラエルの王ペカハの日[ひ]々[び]に、アッシリアの王ティグラト・ピレセルが来[き]て、アイン、アベル・ベト・マアカ、ヤノハ、ケネズ、ハツォル、ギレアデ、ガリラヤ、すなわちナフタリの全土[ぜんど]を取[と]り、彼らをアッシリアへ移[うつ]した。"
  30: "エラの子[こ]ホセアが、レマルヤの子ペカハに対[たい]して謀[む]を企[くわだ]て、彼を打[う]ち殺[ころ]し、代[か]わって王[おう]となった。それはアザリヤの子[こ]ヨタムの第二十[だいにじゅう]年[ねん]であった。"
  31: "ペカハの残[のこ]りの言葉、彼が行ったすべてのことは、見[み]よ、イスラエルの王[おう]たちの日[ひ]々[び]の言葉の書[しょ]に記[しる]されている。"
  32: "イスラエルの王、レマルヤの子[こ]ペカハの第二年[だいにねん]に、アザリヤの子ヨタムがユダの王[おう]となった。"
  33: "彼[かれ]は二十五歳[にじゅうごさい]で王[おう]となり、エルサレムで十六年[じゅうろくねん]治[おさ]めた。母[はは]の名[な]はエルシャといい、ツァドクの娘[むすめ]であった。"
  34: "彼は主[しゅ]の目[め]に正[ただ]しいことを行[おこな]い、父[ちち]アザリヤが行ったすべてのことに従[したが]った。"
  35: "ただ、高[たか]い所[ところ]は除[のぞ]かなかった。民[たみ]はなおも高い所で犠牲[ぎせい]を献[ささ]げ、香[こう]をたいた。彼は主[しゅ]の家[いえ]の上[うえ]の門[もん]を建[た]てた。"
  36: "ヨタムの残[のこ]りの言葉[ことば]、彼が行[おこな]ったすべてのことは、ユダの王[おう]たちの日[ひ]々[び]の言葉の書[しょ]に記[しる]されているではないか。"
  37: "その日[ひ]々[び]に、主[しゅ]はユダにシリアの王レツィンとレマルヤの子[こ]ペカハを遣[つか]わし始[はじ]められた。"
  38: "ヨタムは父[ちち]たちとともに眠[ねむ]り、父ダビデの町[まち]に父たちとともに葬[ほうむ]られた。代[か]わってその子[こ]アハズが王[おう]となった。"

notes:
  1: "Ἐν ἔτει εἰκοστῷ καὶ ἑβδόμῳ τῷ Ιεροβοαμ βασιλεῖ Ισραηλ — в двадцать седьмой год Иеровоама, царя Израильского. ἐβασίλευσεν Αζαριας υἱὸς Αμεσσιου βασιλέως Ιουδα — воцарился Азария, сын Амасии, царя Иудейского."
  2: "υἱὸς ἑκκαίδεκα ἐτῶν ἦν ἐν τῷ βασιλεύειν αὐτόν — был сыном шестнадцати лет, когда воцарился. πεντήκοντα καὶ δύο ἔτη ἐβασίλευσεν — пятьдесят два года царствовал. ὄνομα τῇ μητρὶ αὐτοῦ Χαλια ἐξ Ιερουσαλημ — имя матери его Халия из Иерусалима (слав. «иехелиа», ru «Иехолия»; в тексте обычная яп. форма エコルヤ)."
  3: "ἐποίησεν τὸ εὐθὲς ἐν ὀφθαλμοῖς κυρίου — делал правое в очах Господа. κατὰ πάντα, ὅσα ἐποίησεν Αμεσσιας ὁ πατὴρ αὐτοῦ — по всему, что сделал Амасия, отец его."
  4: "τῶν ὑψηλῶν οὐκ ἐξῆρεν — высот не убрал. ἔτι ὁ λαὸς ἐθυσίαζεν καὶ ἐθυμίων ἐν τοῖς ὑψηλοῖς — ещё народ приносил жертвы и кадил на высотах."
  5: "ἥψατο κύριος τοῦ βασιλέως — коснулся Господь царя, т. е. поразил. ἦν λελεπρωμένος ἕως ἡμέρας θανάτου αὐτοῦ — был поражён проказой до дня смерти своей (λεπρόω; 癩病). ἐβασίλευσεν ἐν οἴκῳ αφφουσωθ — «царствовал в доме аффусоф»: евр. бейт ха-хофшит, «дом свободы», отдельный дом (слав. «в дому апфусоф», ru «в отдельном доме»). Ιωαθαμ υἱὸς τοῦ βασιλέως ἐπὶ τῷ οἴκῳ κρίνων τὸν λαὸν τῆς γῆς — Иофам, сын царя, над домом, судя народ земли."
  6: "τὰ λοιπὰ τῶν λόγων Αζαριου — прочее слов Азарии. οὐκ ἰδοὺ ταῦτα γεγραμμένα ἐπὶ βιβλίῳ λόγων τῶν ἡμερῶν — не вот ли это написано в книге слов дней."
  7: "ἐκοιμήθη Αζαριας μετὰ τῶν πατέρων αὐτοῦ — почил Азария с отцами своими. ἔθαψαν αὐτὸν... ἐν πόλει Δαυιδ — погребли его в городе Давида. ἐβασίλευσεν Ιωαθαμ υἱὸς αὐτοῦ ἀντ αὐτοῦ — воцарился Иофам, сын его, вместо него."
  8: "Ἐν ἔτει τριακοστῷ καὶ ὀγδόῳ τῷ Αζαρια βασιλεῖ Ιουδα — в тридцать восьмой год Азарии, царя Иудейского. ἐβασίλευσεν Ζαχαριας υἱὸς Ιεροβοαμ ἐπὶ Ισραηλ ἐν Σαμαρείᾳ ἑξάμηνον — воцарился Захария, сын Иеровоама, над Израилем в Самарии на шесть месяцев."
  9: "καθὰ ἐποίησαν οἱ πατέρες αὐτοῦ — как делали отцы его. οὐκ ἀπέστη ἀπὸ ἁμαρτιῶν Ιεροβοαμ υἱοῦ Ναβατ — не отступил от грехов Иеровоама, сына Навата."
  10: "συνεστράφησαν ἐπ᾽ αὐτὸν Σελλουμ υἱὸς Ιαβις καὶ Κεβλααμ — составили против него заговор Селлум, сын Иависа, и Кевлаам. ἐπάταξαν αὐτὸν καὶ ἐθανάτωσαν αὐτόν — поразили его и умертвили его. В ru «пред народом» — иное чтение евр.; в тексте по гр. и слав."
  11: "τὰ λοιπὰ τῶν λόγων Ζαχαριου ἰδού ἐστιν γεγραμμένα — прочее слов Захарии, вот, написано."
  12: "ὁ λόγος κυρίου, ὃν ἐλάλησεν πρὸς Ιου — слово Господа, которое изрёк Ииую. Υἱοὶ τέταρτοι καθήσονταί σοι ἐπὶ θρόνου Ισραηλ — «сыны четвёртые сядут тебе на престоле Израиля», т. е. четыре поколения. καὶ ἐγένετο οὕτως — и было так."
  13: "ἐβασίλευσεν Σελλουμ μῆνα ἡμερῶν ἐν Σαμαρείᾳ — царствовал Селлум месяц дней в Самарии. Ἐν ἔτει τριακοστῷ καὶ ἐνάτῳ Αζαρια — в тридцать девятый год Азарии."
  14: "ἀνέβη Μαναημ υἱὸς Γαδδι ἐκ Θαρσιλα — поднялся Менаим, сын Гадия, из Фарсилы (Θαρσιλα; в тексте ティルツァ, т. е. Тирца). ἐπάταξεν τὸν Σελλουμ... καὶ ἐθανάτωσεν αὐτόν — поразил Селлума и умертвил его. Слав. добавляет «и воцарися вместо его» — внесено в текст (паритет); в гр. нет."
  15: "ἡ συστροφὴ αὐτοῦ, ἣν συνεστράφη — заговор его, который он составил (συστροφή). ἰδού εἰσιν γεγραμμένα — вот, написаны."
  16: "ἐπάταξεν Μαναημ τὴν Θερσα — поразил Менаим Фирцу (Θερσα; ru «Типсах»). πάντα τὰ ἐν αὐτῇ καὶ τὰ ὅρια αὐτῆς ἀπὸ Θερσα — всё в ней и пределы её от Фирцы. ὅτι οὐκ ἤνοιξαν αὐτῷ — ибо не открыли ему. τὰς ἐν γαστρὶ ἐχούσας ἀνέρηξεν — беременных рассек (ἀναρήγνυμι)."
  17: "Ἐν ἔτει τριακοστῷ καὶ ἐνάτῳ Αζαρια βασιλεῖ Ιουδα — в тридцать девятый год Азарии, царя Иудейского. ἐβασίλευσεν Μαναημ υἱὸς Γαδδι ἐπὶ Ισραηλ δέκα ἔτη ἐν Σαμαρείᾳ — царствовал Менаим, сын Гадия, над Израилем десять лет в Самарии."
  18: "οὐκ ἀπέστη ἀπὸ πασῶν ἁμαρτιῶν Ιεροβοαμ — не отступил от всех грехов Иеровоама. Слав. добавляет «(во вся дни своя)» — внесено в текст (паритет); в гр. нет."
  19: "ἐν ταῖς ἡμέραις αὐτοῦ ἀνέβη Φουλ βασιλεὺς Ἀσσυρίων ἐπὶ τὴν γῆν — в дни его поднялся Фул, царь Ассирийский, на землю (Фул — Тиглат-Пилесер III). ἔδωκεν... χίλια τάλαντα ἀργυρίου — дал тысячу талантов серебра. εἶναι τὴν χεῖρα αὐτοῦ μετ᾽ αὐτοῦ — чтобы рука его была с ним. Слав. вставки «(израилеву)» и «(еже укрепити царство в руку его)» — пояснения, в гр. нет."
  20: "ἐξήνεγκεν Μαναημ τὸ ἀργύριον ἐπὶ τὸν Ισραηλ, ἐπὶ πᾶν δυνατὸν ἰσχύι — возложил Менаим серебро на Израиля, на всякого сильного силой. πεντήκοντα σίκλους τῷ ἀνδρὶ τῷ ἑνί — пятьдесят сиклей на одного человека. ἀπέστρεψεν βασιλεὺς Ἀσσυρίων καὶ οὐκ ἔστη ἐκεῖ ἐν τῇ γῇ — возвратился царь Ассирийский и не остался там в земле."
  21: "τὰ λοιπὰ τῶν λόγων Μαναημ — прочее слов Менаима. οὐκ ἰδοὺ ταῦτα γεγραμμένα — не вот ли это написано."
  22: "ἐκοιμήθη Μαναημ μετὰ τῶν πατέρων αὐτοῦ — почил Менаим с отцами своими. ἐβασίλευσεν Φακειας υἱὸς αὐτοῦ ἀντ αὐτοῦ — воцарился Факия, сын его, вместо него."
  23: "Ἐν ἔτει πεντηκοστῷ τοῦ Αζαριου βασιλέως Ιουδα — в пятидесятый год Азарии, царя Иудейского. ἐβασίλευσεν Φακειας υἱὸς Μαναημ ἐπὶ Ισραηλ ἐν Σαμαρείᾳ δύο ἔτη — воцарился Факия, сын Менаима, над Израилем в Самарии на два года."
  24: "οὐκ ἀπέστη ἀπὸ ἁμαρτιῶν Ιεροβοαμ υἱοῦ Ναβατ — не отступил от грехов Иеровоама, сына Навата."
  25: "συνεστράφη ἐπ᾽ αὐτὸν Φακεε υἱὸς Ρομελιου ὁ τριστάτης αὐτοῦ — составил против него заговор Факей, сын Ремалии, тристат его (τριστάτης — начальник третьей части; в тексте 副将). ἐναντίον οἴκου τοῦ βασιλέως — пред домом царским. μετὰ τοῦ Αργοβ καὶ μετὰ τοῦ Αρια — с Арговом и Арием. μετ᾽ αὐτοῦ πεντήκοντα ἄνδρες ἀπὸ τῶν τετρακοσίων — с ним пятьдесят мужей из четырёхсот; слав. и ru «из Галаадитян» — внесено в текст (паритет), вариант гр. отмечен здесь."
  26: "τὰ λοιπὰ τῶν λόγων Φακειου — прочее слов Факии. ἰδού εἰσιν γεγραμμένα — вот, написаны."
  27: "Ἐν ἔτει πεντηκοστῷ καὶ δευτέρῳ τοῦ Αζαριου — в пятьдесят второй год Азарии. ἐβασίλευσεν Φακεε υἱὸς Ρομελιου ἐπὶ Ισραηλ ἐν Σαμαρείᾳ εἴκοσι ἔτη — воцарился Факей, сын Ремалии, над Израилем в Самарии на двадцать лет."
  28: "οὐκ ἀπέστη ἀπὸ πασῶν ἁμαρτιῶν Ιεροβοαμ — не отступил от всех грехов Иеровоама."
  29: "Θαγλαθφελλασαρ βασιλεὺς Ἀσσυρίων — Феглаффелласар, царь Ассирийский (ティグラト・ピレセル). ἔλαβεν τὴν Αιν καὶ τὴν Αβελβαιθαμααχα καὶ τὴν Ιανωχ καὶ τὴν Κενεζ καὶ τὴν Ασωρ καὶ τὴν Γαλααδ καὶ τὴν Γαλιλαίαν, πᾶσαν γῆν Νεφθαλι — взял Аин, Авел-Бет-Мааху, Ианох, Кенез, Асор, Галаад и Галилею, всю землю Неффалима (в ru вместо Кенеза «Кедес»). ἀπῴκισεν αὐτοὺς εἰς Ἀσσυρίους — переселил их в Ассирию."
  30: "συνέστρεψεν σύστρεμμα Ωσηε υἱὸς Ηλα ἐπὶ Φακεε — составил заговор Осия, сын Илы, против Факея. ἐπάταξεν αὐτὸν καὶ ἐθανάτωσεν — поразил и умертвил его. ἐν ἔτει εἰκοστῷ Ιωαθαμ υἱοῦ Αζαριου — в двадцатый год Иофама, сына Азарии (хронологически расходится с 15:33; в тексте по гр. и слав.)."
  31: "τὰ λοιπὰ τῶν λόγων Φακεε — прочее слов Факея. ἰδού ἐστιν γεγραμμένα — вот, написано."
  32: "Ἐν ἔτει δευτέρῳ Φακεε υἱοῦ Ρομελιου βασιλέως Ισραηλ — во второй год Факея, сына Ремалии, царя Израильского. ἐβασίλευσεν Ιωαθαμ υἱὸς Αζαριου βασιλέως Ιουδα — воцарился Иофам, сын Азарии, царя Иудейского."
  33: "υἱὸς εἴκοσι καὶ πέντε ἐτῶν ἦν — был сыном двадцати пяти лет. ἑκκαίδεκα ἔτη ἐβασίλευσεν — шестнадцать лет царствовал. ὄνομα τῆς μητρὸς αὐτοῦ Ιερουσα θυγάτηρ Σαδωκ — имя матери его Иеруса, дочь Садока (エルシャ; слав. «иеруса», ru «Иеруша»)."
  34: "ἐποίησεν τὸ εὐθὲς ἐν ὀφθαλμοῖς κυρίου — делал правое в очах Господа. κατὰ πάντα, ὅσα ἐποίησεν Οζιας ὁ πατὴρ αὐτοῦ — по всему, что сделал Озия, отец его (Οζιας — он же Азария; в тексте アザリヤ по слав.)."
  35: "τὰ ὑψηλὰ οὐκ ἐξῆρεν — высот не убрал. ἔτι ὁ λαὸς ἐθυσίαζεν καὶ ἐθυμία ἐν τοῖς ὑψηλοῖς — ещё народ приносил жертвы и кадил на высотах. αὐτὸς ᾠκοδόμησεν τὴν πύλην οἴκου κυρίου τὴν ἐπάνω — он построил верхние ворота дома Господня."
  36: "τὰ λοιπὰ τῶν λόγων Ιωαθαμ — прочее слов Иофама. οὐχὶ ταῦτα γεγραμμένα — не это ли написано."
  37: "ἤρξατο κύριος ἐξαποστέλλειν ἐν Ιουδα — начал Господь посылать на Иуду. τὸν Ραασσων βασιλέα Συρίας — Рецина, царя Сирии (Ραασσων; евр. Рецин, レツィン). τὸν Φακεε υἱὸν Ρομελιου — Факея, сына Ремалии."
  38: "ἐκοιμήθη Ιωαθαμ μετὰ τῶν πατέρων αὐτοῦ — почил Иофам с отцами своими. ἐτάφη... ἐν πόλει Δαυιδ τοῦ πατρὸς αὐτοῦ — погребён в городе Давида, отца его. ἐβασίλευσεν Αχαζ υἱὸς αὐτοῦ ἀντ αὐτοῦ — воцарился Ахаз, сын его, вместо него."
