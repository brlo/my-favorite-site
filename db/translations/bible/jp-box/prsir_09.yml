# jp-box, Сирах, глава 9. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 9: о жене и целомудрии (1–9), о старом друге и новых друзьях (10),
# о зависти к грешнику (11–12), об опасном человеке (13), о выборе собеседников
# и советников (14–16), о труде и слове (17–18). Всё — авторское поучение,
# прямой речи нет, кавычек нет.
# Нумерация по gr: 18 стихов. Слав. 23: csl 9:8–9 делят гр. 9:8; csl 9:10–11
# делят гр. 9:9; csl 9:12–13 делят гр. 9:10; csl 9:16–18 делят гр. 9:13;
# дальше сдвиг на пять номеров (csl 9:19 = гр. 9:14, csl 9:23 = гр. 9:18).
# Держимся деления gr; лишних стихов нет.
# Csl-чтения: в 9:5 csl «в красоте ея» вместо гр. ἐπιτιμίοις («наказаниях»);
# в 9:13 csl «не убоишися» вместо гр. ὑποπτεύσῃς («не заподозришь»). Оба
# чтения взяты в основной текст, греч. вариант — в notes.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имён в главе нет.

tr_code: jp-box
book: prsir
chapter: 9
draft: true

verses:
  1: "あなたのふところの妻[つま]をねたむな。あなたに逆[さか]らう悪[わる]い教[おし]えを彼女[かのじょ]に教え込[こ]むな。"
  2: "あなたの魂[たましい]を女[おんな]に与[あた]えて、あなたの力[ちから]の上[うえ]に立[た]たせるな。"
  3: "遊女[ゆうじょ]に会[あ]いに行[ゆ]くな。その罠[わな]に落[お]ちるかもしれないからである。"
  4: "歌[うた]う女[おんな]と長[なが]く過[す]ごすな。その企[くわだ]てに捕[と]らえられるかもしれないからである。"
  5: "乙女[おとめ]をじっと見[み]つめるな。その美[うつく]しさに惑[まど]わされるかもしれないからである。"
  6: "遊女[ゆうじょ]たちにあなたの魂[たましい]を与[あた]えるな。あなたの嗣業[しぎょう]を失[うしな]うからである。"
  7: "町[まち]の通[とお]りを見回[みまわ]すな。その寂[さび]れた所[ところ]をさまよってはならない。"
  8: "美[うつく]しい女[おんな]から目[め]を背[そ]けよ。他人[たにん]の美しさをじっと見[み]つめるな。多[おお]くの者[もの]が女の美しさに迷[まよ]い、そこから情欲[じょうよく]が火[ひ]のように燃[も]え上[あ]がるからである。"
  9: "夫[おっと]のある女[おんな]と決[けっ]して座[すわ]るな。その女と酒[さけ]を酌[く]み交[か]わすな。あなたの魂[たましい]がその女に傾[かたむ]き、あなたの霊[れい]が滅[ほろ]びへと滑[すべ]り落[お]ちるかもしれないからである。"
  10: "古[ふる]い友[とも]を捨[す]てるな。新[あたら]しい友は、それに及[およ]ばないからである。新しい友は新しい酒[さけ]のようなものだ。古くなれば、喜[よろこ]びをもってそれを飲[の]む。"
  11: "罪人[つみびと]の栄光[えいこう]をねたむな。その終[お]わりがどうなるか、あなたは知[し]らないからである。"
  12: "不敬[ふけい]な者[もの]の喜[よろこ]びを喜ぶな。彼[かれ]らはよみに至[いた]るまで正[ただ]しいとされないことを覚[おぼ]えておけ。"
  13: "人[ひと]を殺[ころ]す権力[けんりょく]を持つ人からは遠[とお]く離[はな]れよ。死[し]の恐怖[きょうふ]に怯[おび]えることはない。たとえ近[ちか]づいても、過[あやま]ちを犯[おか]すな。あなたのいのちを奪[うば]われるからである。あなたは罠[わな]の中[なか]を通[とお]り、町[まち]の城壁[じょうへき]の上[うえ]を歩[ある]いていることを知[し]れ。"
  14: "あなたの力[ちから]に応[おう]じて隣人[りんじん]を見定[みさだ]めよ。賢[かしこ]い者[もの]たちと相談[そうだん]せよ。"
  15: "あなたの思[おも]い巡[めぐ]らしは悟[さと]りのある者[もの]たちとともにあれ。あなたの語[かた]りはすべていと高[たか]い神[かみ]の律法[りっぽう]のうちにあれ。"
  16: "正[ただ]しい人[ひと]たちを、あなたの食卓[しょくたく]の共[とも]とせよ。あなたの誇[ほこ]りは主[しゅ]を恐[おそ]れることのうちにあれ。"
  17: "職人[しょくにん]の手[て]によって、仕事[しごと]はほめられる。民[たみ]の指導者[しどうしゃ]は、その言葉[ことば]によって賢[かしこ]いとされる。"
  18: "口[くち]の達者[たっしゃ]な人[ひと]は自分の町[まち]で恐[おそ]れられ、言葉[ことば]の軽[かる]はずみな者[もの]は憎[にく]まれる。"

notes:
  1: "μὴ ζήλου — «не ревнуй» (ζηλόω); γυναῖκα τοῦ κόλπου σου — «жену недра твоего», т. е. жену, которую ты держишь у груди (κόλπος); μηδὲ διδάξῃς ἐπὶ σεαυτὸν παιδείαν πονηράν — «и не научи против себя дурному уроку» (παιδεία), т. е. не дай ей повода обратить учение против тебя."
  2: "μὴ δῷς γυναικὶ τὴν ψυχήν σου — «не отдай женщине души твоей»; ἐπιβῆναι αὐτὴν ἐπὶ τὴν ἰσχύν σου — «чтобы она взошла на силу твою», т. е. взяла верх (ἐπιβαίνω, ἰσχύς). Слав. «еже превзыти ей над крепость твою»."
  3: "ἑταιριζομένη — «блудница, торгующая собой» (ἑταιρίζομαι); ὑπάντα — «выходи навстречу» (ὑπαντάω); παγίδες — сети, западни (слав. «сети»)."
  4: "ψάλλουσα — «поющая, играющая на струнах» (ψάλλω); μὴ ἐνδελέχιζε — «не общайся долго, не задерживайся» (ἐνδελεχίζω); ἐπιχειρήματα — «замыслы, предприятия» (слав. «начинания»)."
  5: "παρθένον μὴ καταμάνθανε — «на девицу не засматривайся» (καταμανθάνω); μήποτε σκανδαλισθῇς — «как бы не соблазниться» (σκανδαλίζω); ἐν τοῖς ἐπιτιμίοις αὐτῆς — «в наказаниях её» (ἐπιτίμια). Csl читает «в красоте ея»; по паритету взято csl, гр. вариант — в этой заметке."
  6: "μὴ δῷς πόρναις τὴν ψυχήν σου — «не отдай души твоей блудницам» (πόρνη); κληρονομία — «наследие, наследство» (слав. «наследие»); ἀπολέσῃς — «погубишь»."
  7: "μὴ περιβλέπου ἐν ῥύμαις πόλεως — «не озирайся на улицах города» (περιβλέπω, ῥύμη — улица, слав. «стогны»); ἐν ταῖς ἐρήμοις αὐτῆς μὴ πλανῶ — «по пустынным местам его не блуждай» (ἐρημόω, πλανάω)."
  8: "ἀπόστρεψον ὀφθαλμὸν ἀπὸ γυναικὸς εὐμόρφου — «отврати око от жены благообразной» (εὔμορφος); κάλλος ἀλλότριον — «чужая красота»; πολλοὶ ἐπλανήθησαν — «многие заблудились»; φιλία ὡς πῦρ ἀνακαίεται — «дружба, любовь как огонь загорается» (ἀνακαίω); слав. «похоть яко огнь разгарается» — «похоть», поэтому 情欲. Слав. 9:8–9 делят стих; здесь обе половины."
  9: "ὕπανδρος — «замужняя» (ὑπό ἀνδρός); μὴ κάθου τὸ σύνολον — «отнюдь не сиди»; συμβολοκοπήσῃς — «пируй, деля расходы» (συμβολοκοπέω), передано 酌み交わす; ἐκκλίνῃ — «склонится» (ἐκκλίνω); ὀλίσθῃς εἰς ἀπώλειαν — «скользнёшь в погибель» (ὀλισθάνω). Слав. 9:10–11 делят стих; здесь обе половины."
  10: "φίλον ἀρχαῖον — «древнего, старого друга»; πρόσφατος — «новый, недавний»; οὐκ ἔστιν ἔφισος αὐτῷ — «не равен ему» (ἔφισος = ἴσος); οἶνος νέος φίλος νέος — «вино новое — друг новый»; ἐὰν παλαιωθῇ — «когда состарится» (παλαιόω); μετ᾽ εὐφροσύνης πίεσαι — «с веселием выпьешь» (πίνω). Слав. 9:12–13 делят стих; здесь обе половины."
  11: "μὴ ζηλώσῃς δόξαν ἁμαρτωλοῦ — «не возревнуй о славе грешника» (ζηλόω); καταστροφή — «ниспровержение, конец» (слав. «превращение»); οὐ γὰρ οἶδας — «ибо не знаешь»."
  12: "μὴ εὐδοκήσῃς ἐν εὐδοκίᾳ ἀσεβῶν — «не благоволи к благоволению нечестивых», т. е. не одобряй того, что они одобряют; ἕως ᾅδου οὐ μὴ δικαιωθῶσιν — «до ада не будут оправданы» (ᾅδης — よみ; δικαιόω)."
  13: "μακρὰν ἄπεχε — «далеко держись» (ἀπέχω); ἐξουσίαν τοῦ φονεύειν — «власть убивать» (φονεύω); οὐ μὴ ὑποπτεύσῃς φόβον θανάτου — «не заподозришь страха смерти» (ὑποπτεύω), тёмное место; csl «не убоишися страха смертна» — «не убоишься», по паритету взято csl; κἂν προσέλθῃς — «если и приблизишься»; μὴ πλημμελήσῃς — «не погреши»; ἐπάλξεις — «зубцы, стены»; ἐν μέσῳ παγίδων διαβαίνεις — «проходишь среди сетей». Слав. 9:16–18 делят стих; здесь все три части."
  14: "κατὰ τὴν ἰσχύν σου — «по силе твоей»; στόχασαι τοὺς πλησίον — «замечай, разбирай ближних» (στοχάζομαι); μετὰ σοφῶν συμβουλεύου — «с мудрыми советуйся». Слав. 9:19."
  15: "μετὰ συνετῶν ἔστω ὁ διαλογισμός σου — «с разумными да будет размышление твоё» (διαλογισμός); πᾶσα διήγησίς σου — «всякая беседа твоя» (διήγησις); ἐν νόμῳ ὑψίστου — «в законе Вышнего». Слав. 9:20."
  16: "ἄνδρες δίκαιοι ἔστωσαν σύνδειπνοί σου — «мужи праведные да будут сотрапезниками твоими» (σύνδειπνος); ἐν φόβῳ κυρίου ἔστω τὸ καύχημά σου — «в страхе Господнем да будет похвала твоя» (καύχημα). Слав. 9:21."
  17: "ἐν χειρὶ τεχνιτῶν ἔργον ἐπαινεσθήσεται — «в руке художников, мастеров дело будет похвалено» (τεχνίτης, ἐπαινέω); ὁ ἡγούμενος λαοῦ σοφὸς ἐν λόγῳ αὐτοῦ — «ведущий народ мудр в слове своём» (ἡγέομαι). Слав. 9:22."
  18: "φοβερὸς ἐν πόλει αὐτοῦ ἀνὴρ γλωσσώδης — «страшен в городе своём человек языкастый» (φοβερός); ὁ προπετὴς ἐν λόγῳ αὐτοῦ — «опрометчивый в слове своём» (προπετής); μισηθήσεται — «будет ненавидим» (μισέω). Слав. 9:23."
