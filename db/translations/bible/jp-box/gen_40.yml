verses:
  1: "これらのことの後[あと]、エジプトの王[おう]の献酌官[けんしゃくかん]⟨王[おう]の飲[の]み物[もの]を注[そそ]ぐ役目[やくめ]の人[ひと]。⟩と調理官[ちょうりかん]⟨王[おう]の食[た]べ物[もの]を調[ととの]える役目[やくめ]の人[ひと]。⟩が、自分[じぶん]たちの主人[しゅじん]であるエジプトの王[おう]に罪[つみ]を犯[おか]した。"
  2: "ファラオは、自分[じぶん]の二人[ふたり]の侍従[じじゅう]、すなわち献酌官[けんしゃくかん]と調理官[ちょうりかん]に怒[いか]った。"
  3: "そして、彼[かれ]らを牢[ろう]の長[かしら]のもとの牢[ろう]に、ヨセフが閉[と]じ込[こ]められていたそこの場所[ばしょ]に入[い]れた。"
  4: "牢[ろう]の長[かしら]は彼[かれ]らにヨセフを付[つ]き添[そ]わせ、ヨセフは彼[かれ]らに仕[つか]えた。彼[かれ]らは幾日[いくにち]か牢[ろう]にいた。"
  5: "エジプトの王[おう]に仕[つか]え、牢[ろう]にいる献酌官[けんしゃくかん]と調理官[ちょうりかん]の二人[ふたり]は、同[おな]じ夜[よる]、それぞれ自分[じぶん]の夢[ゆめ]の幻[まぼろし]を見[み]た。"
  6: "ヨセフが朝[あさ]、彼[かれ]らのところへ行[い]くと、彼[かれ]らは心[こころ]を乱[みだ]していた。"
  7: "ヨセフは、自分[じぶん]の主人[しゅじん]のもとの牢[ろう]で同[とも]にいるファラオの侍従[じじゅう]たちに尋[たず]ねた。「なぜ、今日[きょう]は顔[かお]を曇[くも]らせているのですか。」"
  8: "彼[かれ]らは言[い]った。「わたしたちは夢[ゆめ]を見[み]ましたが、それを解[と]き明[あ]かす者[もの]がいません。」ヨセフは言[い]った。「その解[かい]き明[あ]かしは神[かみ]によるのではありませんか。どうか、わたしに話[はな]してください。」"
  9: "献酌官[けんしゃくかん]はヨセフに自分[じぶん]の夢[ゆめ]を話[はな]して言[い]った。「わたしの夢[ゆめ]の中[なか]で、わたしの前[まえ]にぶどうの木[き]がありました。"
  10: "そのぶどうの木[き]には三[みっ]つの枝[えだ]があり、それは芽[め]を吹[ふ]いて花[はな]が咲[さ]き、房[ふさ]にはぶどうが熟[じゅく]していました。"
  11: "ファラオの杯[さかずき]がわたしの手[て]にありました。わたしはぶどうを取[と]ってその杯[さかずき]に絞[しぼ]り入[い]れ、杯[さかずき]をファラオの手[て]に渡[わた]しました。」"
  12: "ヨセフは言[い]った。「その解[かい]き明[あ]かしはこうです。三[みっ]つの枝[えだ]は三[みっ]かの日[ひ]です。"
  13: "あと三[みっ]かの日[ひ]で、ファラオはあなたの職[しょく]を思[おも]い起[おこ]し、あなたを献酌官[けんしゃくかん]の職[しょく]に戻[もど]されるでしょう。あなたは以前[いぜん]のように、ファラオの杯[さかずき]をその手[て]に渡[わた]すようになります。"
  14: "しかし、あなたが良[よ]い目[め]に遭[あ]うとき、わたしを思[おも]い出[だ]してください。わたしに憐[あわ]れみを示[しめ]して、ファラオにわたしのことを話[はな]し、わたしをこの要塞[ようさい]から出[だ]してください。"
  15: "わたしはヘブライ人[じん]の地[ち]から盗[ぬす]み取[と]られるように連[つ]れて来[こ]られ、ここでも何[なに]ひとつ悪[わる]いことをしていないのに、この穴倉[あなぐら]に投[な]げ込[こ]まれたのです。」"
  16: "調理官[ちょうりかん]は、ヨセフが正[ただ]しく解[と]き明[あ]かしたのを見[み]て、ヨセフに言[い]った。「わたしも夢[ゆめ]を見[み]ました。わたしの頭[あたま]の上[うえ]に三[みっ]つの籠[かご]がありました。"
  17: "一番上[いちばんうえ]の籠[かご]には、ファラオ王[おう]が食[た]べるあらゆる食物[しょくもつ]、すなわちパン焼[や]きが作[つく]った品[しな]が入[はい]っていました。そして、空[そら]の鳥[とり]が、わたしの頭[あたま]の上[うえ]の籠[かご]からそれを食[た]べていました。」"
  18: "ヨセフは答[こた]えて言[い]った。「その解[かい]き明[あ]かしはこうです。三[みっ]つの籠[かご]は三[みっ]かの日[ひ]です。"
  19: "あと三[みっ]かの日[ひ]のうちに、ファラオはあなたの頭[あたま]をあなたから取[と]り去[さ]り、あなたを木[き]の上[うえ]に吊[つ]るすでしょう。空[そら]の鳥[とり]が、あなたの肉[にく]をあなたから食[た]べるでしょう。」"
  20: "三日目[みっかめ]は、ファラオの誕生[たんじょう]の日[ひ]であった。ファラオはすべての僕[しもべ]たちに酒宴[しゅえん]を催[もよお]し、その僕[しもべ]たちの間[あいだ]で、献酌官[けんしゃくかん]の職[しょく]と調理官[ちょうりかん]の職[しょく]を思[おも]い起[おこ]した。"
  21: "そして、献酌官[けんしゃくかん]をその職[しょく]に戻[もど]した。彼[かれ]は杯[さかずき]をファラオの手[て]に渡[わた]した。"
  22: "しかし、調理官[ちょうりかん]は吊[つ]るした。ヨセフが彼[かれ]らに解[と]き明[あ]かしたとおりであった。"
  23: "しかし、献酌官[けんしゃくかん]はヨセフを思[おも]い出[だ]さず、彼[かれ]を忘[わす]れてしまった。"

notes:
  1: "ἥμαρτεν — 罪を犯した (согрешили, не просто «провинились», ср. слав. «согреши»). ἀρχιοινοχόος — 献酌官 (начальник виночерпиев; ἀρχι- — «главный»). ἀρχισιτοποιός — 調理官 (начальник хлебодаров). Сноски при первом упоминании в корпусе: 献酌官, 調理官."
  2: "ὠργίσθη Φαραω ἐπὶ τοῖς δυσὶν εὐνούχοις — 二人の侍従に怒った (εὐνοῦχος — придворный, ср. 39:1; здесь 侍従, а не 宦官). Двойное ἐπί с дат. сохранено (и 献酌官, и 調理官)."
  3: "παρὰ τῷ δεσμοφύλακι — 牢の長のもとに (δεσμοφύλαξ — тюремный страж). οὗ Ιωσηφ ἀπῆκτο ἐκεῖ — ヨセフが閉じ込められていたそこの場所 (ἀπάγω, plusquamperf. pass.)."
  4: "συνέστησεν… τῷ Ιωσηφ αὐτούς — ヨセフを付け添わせた (συνίστημι — «приставлять»). παρέστη αὐτοῖς — 彼らに仕えた (παρίστημι). ἦσαν δὲ ἡμέρας — 幾日かいた (вин. времени без числа)."
  5: "ὅρασις τοῦ ἐνυπνίου αὐτοῦ — 自分の夢の幻 (букв. «видение сна его»). Двойное ἐνύπνιον («сон… сон») передано один раз. οἱ ὄντες ἐν τῷ δεσμωτηρίῳ — 牢にいる."
  6: "τὸ πρωί — 朝. ἦσαν τεταραγμένοι — 心を乱していた (perfect pass. ταράσσω)."
  7: "τοὺς εὐνούχους Φαραω, οἳ ἦσαν μετ᾽ αὐτοῦ ἐν τῇ φυλακῇ παρὰ τῷ κυρίῳ αὐτοῦ — 自分の主人のもとの牢で共にいるファラオの侍従たち. σκυθρωπά — 顔を曇らせている (мрачные)."
  8: "ὁ συγκρίνων οὐκ ἔστιν αὐτό — 解き明かす者がいない (συγκρίνω — «истолковывать»). ἡ διασάφησις — 解き明かし. οὐχὶ διὰ τοῦ θεοῦ… ἐστιν — 神によるのではありませんか (риторический вопрос, сохранён)."
  9: "ἄμπελος — ぶどうの木 (лоза). ἐναντίον μου — わたしの前に."
  10: "πυθμένες — 枝 (букв. «стебли, лозы»; ср. 41:5, где то же слово о соломе). θάλλουσα ἀνενηνοχυῖα βλαστούς — 芽を吹いて花が咲き (θάλλω — «цвести», ἀναφέρω — «выпускать»). πέπειροι οἱ βότρυες σταφυλῆς — 房にはぶどうが熟していた."
  11: "τὸ ποτήριον Φαραω — ファラオの杯. ἐξέθλιψα αὐτὴν εἰς τὸ ποτήριον — 杯に絞り入れた (ἐκθλίβω — «выжимать»). ἔδωκα… εἰς τὰς χεῖρας Φαραω — ファラオの手に渡した."
  12: "σύγκρισις — 解き明かし (истолкование). οἱ τρεῖς πυθμένες τρεῖς ἡμέραι εἰσίν — 三つの枝は三かの日."
  13: "μνησθήσεται Φαραω τῆς ἀρχῆς σου — ファラオはあなたの職を思い起す (ἀρχή — «должность, начальство»). ἀποκαταστήσει σε ἐπὶ τὴν ἀρχιοινοχοΐαν σου — 献酌官の職に戻す. ὡς ἦσθα οἰνοχοῶν — 以前のように (οἰνοχοέω — «наливать вино»)."
  14: "μνήσθητί μου διὰ σεαυτοῦ — わたしを思い出してください (букв. «через себя самого»). ποιήσεις ἐν ἐμοὶ ἔλεος — わたしに憐れみを示す. ἐξάξεις με ἐκ τοῦ ὀχυρώματος — 要塞から出す (ср. 39:20)."
  15: "κλοπῇ ἐκλάπην — 盗み取られるように連れて来られた (букв. «кражей украден»; слав. «татьбою украден бых»). λάκκος — 穴倉 (ров, темница; слав. «ров»). οὐκ ἐποίησα οὐδέν — 何ひとつ悪いことをしていない."
  16: "ὀρθῶς συνέκρινεν — 正しく解き明かした. κανᾶ χονδριτῶν — 籠 (χονδρίτης — «из крупы, крупяное»; в 17 передано как снедь). ᾤμην… αἴρειν ἐπὶ τῆς κεφαλῆς — 頭に載せていると思った."
  17: "ἀπὸ πάντων τῶν γενῶν ὧν ὁ βασιλεὺς Φαραω ἐσθίει — 王が食べるあらゆる種類の. ἔργον σιτοποιοῦ — パン焼きの作った品 (изделие пекаря). κατήσθιεν — 食べていた (имперфект: птицы ели постоянно)."
  18: "ἀποκριθεὶς δὲ Ιωσηφ — ヨセフは答えて. τὰ τρία κανᾶ τρεῖς ἡμέραι — 三つの籠は三かの日 (повтор формулы 12-го стиха)."
  19: "ἀφελεῖ τὴν κεφαλήν σου ἀπὸ σοῦ — 頭をあなたから取り去る. κρεμάσει σε ἐπὶ ξύλου — 木の上に吊るす. φάγεται… τὰς σάρκας σου ἀπὸ σοῦ — 肉をあなたから食べる (двойное ἀπό σοῦ сохранено)."
  20: "ἡμέρα γενέσεως — 誕生の日 (день рождения). πότον — 酒宴 (пир с вином). ἐμνήσθη τῆς ἀρχῆς… ἐν μέσῳ τῶν παίδων αὐτοῦ — 僕たちの間で職を思い起した."
  21: "ἀπεκατέστησεν — 戻した (ἀποκαθίστημι). ἔδωκεν τὸ ποτήριον εἰς τὴν χεῖρα Φαραω — 杯をファラオの手に渡した (исполнение сна 13-го стиха)."
  22: "ἐκρέμασεν — 吊るした. καθὰ συνέκρινεν αὐτοῖς Ιωσηφ — ヨセフが彼らに解き明かしたとおり."
  23: "οὐκ ἐμνήσθη… ἀλλὰ ἐπελάθετο — 思い出さず、忘れてしまった (усиление через два глагола, сохранено)."
