verses:
  1: "エリフが語[かた]り終[お]えると、主[しゅ]は嵐[あらし]と雲[くも]を通[とお]してヨブに言[い]われた。"
  2: "「わたしから計[はかりごと]を隠[かく]し、心[こころ]に言葉[ことば]を収[おさ]めて、わたしから身を隠せると考[かんが]える者[もの]はだれか。"
  3: "男[おとこ]のように腰[こし]に帯[おび]をせよ。わたしはあなたに問[と]う。あなたはわたしに答[こた]えよ。"
  4: "わたしが地[ち]の基[もとい]を据[す]えていたとき、あなたはどこにいたのか。告[つ]げよ、もし悟[さと]りがあるなら。"
  5: "だれがその測[はか]りを定[さだ]めたのか、もし知[し]っているなら。だれがその上[うえ]に測り縄[なわ]を張[は]ったのか。"
  6: "その柱[はしら]は何[なに]の上[うえ]に据[す]えられたのか。だれがその隅[すみ]の石[いし]を置[お]いたのか。"
  7: "そのとき、星[ほし]が造[つく]られ、わたしの天使[てんし]たちはみな、大[おお]きな声[こえ]でわたしをほめたたえた。"
  8: "わたしは、母[はは]の胎[たい]から出[で]て荒[あ]れ狂[くる]う海[うみ]を、門[もん]で閉[と]ざした。"
  9: "わたしは雲[くも]をその衣[ころも]とし、霧[きり]をその産衣[うぶぎ]とした。"
  10: "わたしはそれに境[さかい]を定[さだ]め、かんぬきと門[もん]を設[もう]けた。"
  11: "そして言[い]った。『ここまで来[く]るがよい。これより先[さき]へは越[こ]えてはならない。おまえの波[なみ]は、おまえ自身[じしん]のうちに砕[くだ]ける。』"
  12: "あなたがいたころ、わたしは朝[あさ]の光[ひかり]を定[さだ]めたのか。明[あ]けの明星[みょうじょう]はその順[じゅん]を知[し]っている。"
  13: "地[ち]の端[はし]をつかみ、不[ふ]敬[けい]な者[もの]をそこから振[ふ]り落[お]とすために。"
  14: "あなたは土[つち]を取り、粘土[ねんど]で生[い]き物[もの]を形[かた]づくり、それを語[かた]る者[もの]として地[ち]の上[うえ]に置[お]いたのか。"
  15: "あなたは不[ふ]敬[けい]な者[もの]から光[ひかり]を取[と]り去[さ]り、高[たか]ぶる者[もの]の腕[うで]を砕[くだ]いたのか。"
  16: "あなたは海[うみ]の源[みなもと]に来[き]たことがあるか。深[ふか]い淵[ふち]の跡[あと]を歩[あゆ]んだことがあるか。"
  17: "死[し]の門[もん]が恐[おそ]れをもってあなたに開[ひら]かれるのか。よみの門衛[もんえい]たちは、あなたを見[み]て震[ふる]えおののいたのか。"
  18: "天[てん]の下[した]の広[ひろ]さを、あなたは教[おし]えられたのか。告[つ]げよ、それはどれほどあるのか。"
  19: "光[ひかり]はどの地[ち]に宿[やど]るのか。闇[やみ]の場所[ばしょ]はどこにあるのか。"
  20: "あなたはわたしをその境[さかい]へ連[つ]れて行[ゆ]けるのか。その道[みち]をあなたは知[し]っているのか。"
  21: "では、あなたはそのとき生[う]まれたのだ、とわたしは知[し]っている。あなたの年[とし]の数[かず]も多[おお]い。"
  22: "あなたは雪[ゆき]の倉[くら]に来[き]たことがあるか。雹[ひょう]の倉を見[み]たことがあるか。"
  23: "それは敵[てき]の時[とき]、戦[いくさ]と戦[たたか]いの日[ひ]のために、あなたのもとに蓄[たくわ]えられているのか。"
  24: "霜[しも]はどこから出[で]て来[く]るのか。南風[みなみかぜ]はどこから天[てん]の下[した]に吹[ふ]き散[ち]らされるのか。"
  25: "だれが激[はげ]しい雨[あめ]に流[なが]れの道[みち]を備[そな]え、稲妻[いなずま]と雷[かみなり]に道を備えたのか、"
  26: "人[ひと]のいない地[ち]、そこに住[す]む者[もの]のない荒[あ]れ野[の]に雨[あめ]を降[ふ]らせ、"
  27: "人[ひと]の通[とお]らない、住[す]む者のない所[ところ]を満[み]たし、草[くさ]の芽[め]を芽生[めば]えさせるために。"
  28: "雨[あめ]の父[ちち]はだれか。露[つゆ]のしずくを生[う]んだのはだれか。"
  29: "氷[こおり]はだれの胎[たい]から出[で]て来[く]るのか。天[てん]の霜[しも]を生[う]んだのはだれか、"
  30: "それは流[なが]れ出[で]る水[みず]のように降[ふ]りて来[く]る。深[ふか]い淵[ふち]の面[おもて]を凍[こお]らせたのはだれか。"
  31: "あなたはプレアデスの束[たば]を悟[さと]ったのか。オリオンの囲[かこ]いを開[ひら]いたのか。"
  32: "あなたは天[てん]のしるしをその時[とき]に開[ひら]き、夕[ゆう]の星[ほし]を、その髪[かみ]を引[ひ]いて導[みちび]くのか。"
  33: "あなたは天[てん]の巡[めぐ]りを知[し]っているのか。天の下[した]でともに起[お]こることを知っているのか。"
  34: "あなたは声[こえ]で雲[くも]を呼[よ]ぶのか。激[はげ]しい水[みず]は震[ふる]えながらあなたに従[したが]うのか。"
  35: "あなたは稲妻[いなずま]を送[おく]って行[ゆ]かせるのか。それらはあなたに『何[なに]か』と言[い]うのか。"
  36: "だれが女[おんな]たちに織[お]りの知恵[ちえ]を与[あた]え、刺繍[ししゅう]の技[わざ]を与えたのか。"
  37: "だれが知恵[ちえ]をもって雲[くも]を数[かぞ]え、天[てん]を地[ち]へと傾[かたむ]けたのか。"
  38: "ちりは地[ち]のように注[そそ]がれ、わたしはそれを石[いし]のように、四つ角に固[かた]めた。"
  39: "あなたは獅子[しし]のために獲物[えもの]を狩[か]るのか。竜[りゅう]たちの魂[たましい]を満[み]たすのか。"
  40: "彼[かれ]らは自分[じぶん]の寝[ね]どこで恐[おそ]れ、森[もり]の中[なか]に座[すわ]って獲物[えもの]を待[ま]ち伏[ぶ]せしている。"
  41: "だれが烏[からす]のために食物[たべもの]を備[そな]えたのか。その雛[ひな]たちは、さまよいながら食物を求[もと]めて主[しゅ]に叫[さけ]ぶ」。"

notes:
  1: "Повествование. Μετὰ δὲ τὸ παύσασθαι Ελιουν τῆς λέξεως — «после того как Елиуй перестал говорить» (παύομαι — «переставать»; λέξις — «речь, слово»; csl «Преставшу же елиусу от беседы»); εἶπεν ὁ κύριος τῷ Ιωβ διὰ λαίλαπος καὶ νεφῶν — «сказал Господь Иову через бурю и облака» (λαῖλαψ — «буря, вихрь»). Формула вводит речь Господа, но сама остаётся повествованием, вне кавычек; цитата открывается в 38:2. В ru «отвечал Господь Иову из бури»."
  2: "Господь. Τίς οὗτος ὁ κρύπτων με βουλήν — «кто это, скрывающий от Меня совет?» (κρύπτω — «скрывать»; βουλή — «совет, замысел»); συνέχων δὲ ῥήματα ἐν καρδίᾳ — «держащий слова в сердце» (συνέχω — «сдерживать, держать»); ἐμὲ δὲ οἴεται κρύπτειν — «и думает скрыть от Меня» (οἴομαι — «думать, полагать»). В ru/МТ «омрачающий Провидение словами без смысла» — иное чтение, не внесено. Здесь открывается цитата (38:2–39:30)."
  3: "Господь. ζῶσαι ὥσπερ ἀνὴρ τὴν ὀσφύν σου — «препояшь, как муж, чресла твои» (ζώννυμι — «опоясывать»; ὀσφύς — «чресла, поясница»; образ борца и воина); ἐρωτήσω δέ σε, σὺ δέ μοι ἀποκρίθητι — «буду спрашивать тебя, и ты Мне отвечай» (ἐρωτάω, ἀποκρίνομαι)."
  4: "Господь. ποῦ ἦς ἐν τῷ θεμελιοῦν με τὴν γῆν — «где был ты, когда Я полагал основания земли?» (θεμελιόω — «основывать»); ἀπάγγειλον δέ μοι, εἰ ἐπίστῃ σύνεσιν — «возвести Мне, если знаешь разум» (ἀπαγγέλλω — «возвещать»; σύνεσις — «разумение»)."
  5: "Господь. τίς ἔθετο τὰ μέτρα αὐτῆς, εἰ οἶδας — «кто положил меры её, если знаешь?» (μέτρον — «мера»); ἢ τίς ὁ ἐπαγαγὼν σπαρτίον ἐπ᾽ αὐτῆς — «или кто навёл на неё вервь?» (ἐπάγω — «наводить»; σπαρτίον — «мерная вервь, шнур»; csl «вервь»)."
  6: "Господь. ἐπὶ τίνος οἱ κρίκοι αὐτῆς πεπήγασιν — «на чём утверждены кольца (связи) её?» (κρίκος — «кольцо, крюк»; πήγνυμι — «утверждать, вбивать»); слав. читает «столпи» — по паритету в тексте 柱, LXX в notes. τίς δέ ἐστιν ὁ βαλὼν λίθον γωνιαῖον ἐπ᾽ αὐτῆς — «и кто положил на ней краеугольный камень?» (λίθος γωνιαῖος — «краеугольный камень»)."
  7: "Господь. ὅτε ἐγενήθησαν ἄστρα — «когда сотворены были звёзды» (ἄστρον); ᾔνεσάν με φωνῇ μεγάλῃ πάντες ἄγγελοί μου — «восхвалили Меня гласом великим все ангелы Мои» (αἰνέω — «хвалить»). В ru/МТ «сыны Божии» — иное чтение, в тексте LXX 天使."
  8: "Господь. ἔφραξα δὲ θάλασσαν πύλαις — «Я затворил море вратами» (φράσσω — «заграждать»; πύλη — «врата»); ὅτε ἐμαίμασσεν ἐκ κοιλίας μητρὸς αὐτῆς ἐκπορευομένη — «когда оно ярилось, выходя из чрева матери своей» (μαιμάσσω — «бушевать, яриться»). В LXX первое лицо («Я затворил»), в ru/МТ вопрос «кто затворил?» — держимся LXX."
  9: "Господь. ἐθέμην δὲ αὐτῇ νέφος ἀμφίασιν — «Я положил ему облако в одеяние» (ἀμφίασις — «одеяние»); ὁμίχλῃ δὲ αὐτὴν ἐσπαργάνωσα — «мглою же повил его» (ὁμίχλη — «мгла, туман»; σπαργανόω — «пеленать»; csl «пових»)."
  10: "Господь. ἐθέμην δὲ αὐτῇ ὅρια — «Я положил ему пределы» (ὅριον — «граница»); περιθεὶς κλεῖθρα καὶ πύλας — «обложив запоры и врата» (κλεῖθρον — «засов»; περιτίθημι — «обкладывать»)."
  11: "Господь. εἶπα δὲ αὐτῇ — «и сказал ему»; Μέχρι τούτου ἐλεύσῃ καὶ οὐχ ὑπερβήσῃ — «до сего дойдёшь и не перейдёшь» (ὑπερβαίνω — «переступать»); ἀλλ᾽ ἐν σεαυτῇ συντριβήσεταί σου τὰ κύματα — «но в тебе самом сокрушатся волны твои» (συντρίβω — «сокрушать»; κῦμα — «волна»). Слова Господа к морю — вложенная речь 『…』 внутри речи Господа."
  12: "Господь. ἦ ἐπὶ σοῦ συντέταχα φέγγος πρωινόν — «разве при тебе Я устроил утренний свет?» (φέγγος — «свет»; πρωινός — «утренний»); ἑωσφόρος δὲ εἶδεν τὴν ἑαυτοῦ τάξιν — «и денница познала свой чин» (ἑωσφόρος — «утренняя звезда, денница»; τάξις — «порядок, чин»; csl «денница же весть чин свой»)."
  13: "Господь. ἐπιλαβέσθαι πτερύγων γῆς — «взяться за крылья земли» (ἐπιλαμβάνομαι — «брать, хватать»; πτέρυγες γῆς — края земли); ἐκτινάξαι ἀσεβεῖς ἐξ αὐτῆς — «отрясти нечестивых с неё» (ἐκτινάσσω — «вытрясать»; ἀσεβής — 不敬な者). Продолжает вопрос 38:12."
  14: "Господь. ἦ σὺ λαβὼν γῆν πηλὸν ἔπλασας ζῷον — «разве ты, взяв землю (глину), вылепил живое существо?» (πλάσσω — «лепить, ваять»; ζῷον — «живое существо»); λαλητὸν αὐτὸν ἔθου ἐπὶ γῆς — «и поставил его говорящим на земле» (λαλητός — «говорящий»). В ru/МТ иная картина (глина под печатью) — не внесена."
  15: "Господь. ἀφεῖλας δὲ ἀπὸ ἀσεβῶν τὸ φῶς — «разве ты отнял у нечестивых свет?» (ἀφαιρέω — «отнимать»); βραχίονα δὲ ὑπερηφάνων συνέτριψας — «и мышцу гордых сокрушил?» (βραχίων — «мышца, рука»; ὑπερήφανος — «гордый»; συντρίβω)."
  16: "Господь. ἦλθες δὲ ἐπὶ πηγὴν θαλάσσης — «пришёл ли ты к источнику моря?» (πηγή — «источник»); ἐν δὲ ἴχνεσιν ἀβύσσου περιεπάτησας — «и в следах бездны ходил?» (ἴχνος — «след»; ἄβυσσος — «бездна»)."
  17: "Господь. ἀνοίγονται δέ σοι φόβῳ πύλαι θανάτου — «разве отверзаются тебе со страхом врата смерти?» (φόβῳ — «со страхом»); πυλωροὶ δὲ ᾅδου ἰδόντες σε ἔπτηξαν — «и привратники ада, увидев тебя, устрашились?» (πυλωρός — «привратник»; ᾅδης — よみ; πτήσσω — «сжиматься от страха»)."
  18: "Господь. νενουθέτησαι δὲ τὸ εὖρος τῆς ὑπ᾽ οὐρανόν — «наставлен ли ты в широте поднебесной?» (νουθετέω — «вразумлять»; εὖρος — «ширина»); ἀνάγγειλον δή μοι πόση τίς ἐστιν — «возвести же Мне, какова она» (πόσος — «сколь великий»)."
  19: "Господь. ποίᾳ δὲ γῇ αὐλίζεται τὸ φῶς — «в какой земле водворяется свет?» (αὐλίζομαι — «жить, ночевать»); σκότους δὲ ποῖος ὁ τόπος — «и тьмы какое место?» (σκότος — «тьма»)."
  20: "Господь. εἰ ἀγάγοις με εἰς ὅρια αὐτῶν — «если бы ты повёл меня к пределам их» (ἄγω — «вести»; ὅριον — «предел»); εἰ δὲ καὶ ἐπίστασαι τρίβους αὐτῶν — «и разве знаешь тропы их?» (τρίβος — «тропа»). Ирония: знаешь ли ты, где живёт свет и тьма."
  21: "Господь. οἶδα ἄρα ὅτι τότε γεγέννησαι — «итак, знаю, что тогда ты родился» (γεννάω — «рождать»; ἄρα — «итак, следовательно»); ἀριθμὸς δὲ ἐτῶν σου πολύς — «и число лет твоих велико» (ἀριθμός). Ирония: если знаешь, значит, ты был при основании мира."
  22: "Господь. ἦλθες δὲ ἐπὶ θησαυροὺς χιόνος — «пришёл ли ты к сокровищницам снега?» (θησαυρός — «сокровищница»; χιών — «снег»); θησαυροὺς δὲ χαλάζης ἑόρακας — «сокровищницы града видел?» (χάλαζα — «град»)."
  23: "Господь. ἀπόκειται δέ σοι εἰς ὥραν ἐχθρῶν — «и хранятся ли они для тебя на время врагов?» (ἀπόκειμαι — «быть отложенным, храниться»; ὥρα — «час, время»); εἰς ἡμέραν πολέμου καὶ μάχης — «на день войны и брани» (πόλεμος, μάχη). В csl «подлежат же ли тебе» — вопрос сохранён."
  24: "Господь. πόθεν δὲ ἐκπορεύεται πάχνη — «откуда же исходит иней?» (πάχνη — «иней, мороз»); ἢ διασκεδάννυται νότος εἰς τὴν ὑπ᾽ οὐρανόν — «или рассевается юг под небесную?» (διασκεδάννυμι — «рассеивать»; νότος — «южный ветер, юг»)."
  25: "Господь. τίς δὲ ἡτοίμασεν ὑετῷ λάβρῳ ῥύσιν — «кто же уготовал сильному дождю течение?» (λάβρος — «бурный, сильный»; ῥύσις — «течение, поток»); ὁδὸν δὲ κυδοιμῶν — «и путь смятений (громов)» (κυδοιμός — «шум, смятение, грохот»). Слав. добавляет «молнии и» («путь молнии и грома») — этого нет в LXX, но по паритету внесено в текст (稲妻), отмечено здесь. Вопрос продолжается в 38:26–27."
  26: "Господь. τοῦ ὑετίσαι ἐπὶ γῆν, οὗ οὐκ ἀνήρ — «чтобы одождить землю, где нет мужа» (ὑετίζω — «орошать дождём»); ἔρημον, οὗ οὐχ ὑπάρχει ἄνθρωπος ἐν αὐτῇ — «пустыню, где нет человека в ней» (ἔρημος — «пустыня»)."
  27: "Господь. τοῦ χορτάσαι ἄβατον καὶ ἀοίκητον — «чтобы насытить непроходимую и ненаселённую» (χορτάζω — «насыщать»; ἄβατος — «непроходимый»; ἀοίκητος — «ненаселённый»); τοῦ ἐκβλαστῆσαι ἔξοδον χλόης — «и произрастить исход зелени» (ἐκβλαστάνω — «произращать»; χλόη — «молодая зелень, трава»). Стихи 26–27 продолжают вопрос 38:25."
  28: "Господь. τίς ἐστιν ὑετοῦ πατήρ — «есть ли у дождя отец?» (ὑετός — «дождь»); τίς δέ ἐστιν ὁ τετοκὼς βώλους δρόσου — «и кто родил капли росы?» (τίκτω — «рождать»; βῶλος — «ком, капля»; δρόσος — «роса»; csl «капли росныя»)."
  29: "Господь. ἐκ γαστρὸς δὲ τίνος ἐκπορεύεται ὁ κρύσταλλος — «из чьего чрева исходит лёд?» (κρύσταλλος — «лёд, хрусталь»); πάχνην δὲ ἐν οὐρανῷ τίς τέτοκεν — «и иней на небе кто родил?» (πάχνη). Стих обрывается: продолжение в 38:30."
  30: "Господь. ἣ καταβαίνει ὥσπερ ὕδωρ ῥέον — «который сходит, как текущая вода» (καταβαίνω; ῥέω — «течь»); πρόσωπον δὲ ἀβύσσου τίς ἔπηξεν — «и лицо бездны кто заморозил?» (πρόσωπον — «лицо, поверхность»; πήγνυμι — «замораживать, утверждать»). Слав. читает «лице нечестива кто устраши» — расходится и с LXX, и с контекстом; в тексте LXX, csl в notes."
  31: "Господь. συνῆκας δὲ δεσμὸν Πλειάδος — «уразумел ли ты узы Плеяды?» (δεσμός — «узы, связь»; Πλειάς — プレアデス); καὶ φραγμὸν Ὠρίωνος ἤνοιξας — «и ограду Ориона отверз?» (φραγμός — «ограда, забор»; Ὠρίων — オリオン)."
  32: "Господь. ἦ διανοίξεις μαζουρωθ ἐν καιρῷ αὐτοῦ — «разве откроешь мазурот в своё время?» (μαζουρωθ — транслитерация евр. названия созвездий; csl передаёт «знамения небесная» — в тексте 天のしるし, слово LXX в notes); καὶ Ἕσπερον ἐπὶ κόμης αὐτοῦ ἄξεις αὐτά — «и вечернюю звезду за власы её поведёшь?» (Ἕσπερος — «вечерняя звезда»; κόμη — «волосы, грива»). Тёмное место."
  33: "Господь. ἐπίστασαι δὲ τροπὰς οὐρανοῦ — «знаешь ли ты перемены (обороты) неба?» (τροπή — «поворот, перемена»; csl «пременения небесная»); ἢ τὰ ὑπ᾽ οὐρανὸν ὁμοθυμαδὸν γινόμενα — «и то, что под небом вместе бывает?» (ὁμοθυμαδόν — «единодушно, вместе»)."
  34: "Господь. καλέσεις δὲ νέφος φωνῇ — «разве призовёшь облако голосом?» (καλέω — «звать»); καὶ τρόμῳ ὕδατος λάβρῳ ὑπακούσεταί σου — «и с трепетом сильная вода послушается тебя?» (τρόμος — «трепет»; ὑπακούω — «слушаться»)."
  35: "Господь. ἀποστελεῖς δὲ κεραυνοὺς καὶ πορεύσονται — «разве пошлёшь молнии, и пойдут?» (κεραυνός — «молния, громовой удар»); ἐροῦσιν δέ σοι Τί ἐστιν — «и скажут тебе: что есть?» (в ru/МТ «вот мы» — иное чтение, не внесено). Слова молний — краткая вложенная речь 『…』."
  36: "Господь. τίς δὲ ἔδωκεν γυναιξὶν ὑφάσματος σοφίαν — «кто дал жёнам мудрость в тканье?» (ὕφασμα — «ткань, тканьё»; σοφία — 知恵); ἢ ποικιλτικὴν ἐπιστήμην — «или искусство вышивания?» (ποικιλτικός — «вышивальный»; ἐπιστήμη — «знание, умение»). В ru/МТ «кто вложил мудрость в сердце» — иное чтение, не внесено."
  37: "Господь. τίς δὲ ὁ ἀριθμῶν νέφη σοφίᾳ — «кто исчисляет облака премудростью?» (ἀριθμέω — «считать»); οὐρανὸν δὲ εἰς γῆν ἔκλινεν — «и небо к земле преклонил?» (κλίνω — «наклонять»; csl «небо на землю преклонил»)."
  38: "Господь. κέχυται δὲ ὥσπερ γῆ κονία — «излилась, как земля, пыль» (κέχυται — перфект от χέω, «лить»; κονία — «пыль, прах»); κεκόλληκα δὲ αὐτὸν ὥσπερ λίθῳ κύβον — «и Я склеил их, как камнем, в куб» (κολλάω — «склеивать»; κύβος — «куб»; csl «спаях же е, аки каменем, на четыри углы» — «на четыре угла», откуда в тексте 四つ角)."
  39: "Господь. θηρεύσεις δὲ λέουσιν βοράν — «разве ты ловишь львам добычу?» (θηρεύω — «ловить, охотиться»; βορά — «пища, добыча»); ψυχὰς δὲ δρακόντων ἐμπλήσεις — «и души драконов наполнишь?» (δράκων — «дракон, змей»; в тексте 竜, как в 4:10; ἐμπίπλημι — «наполнять»)."
  40: "Господь. δεδοίκασιν γὰρ ἐν κοίταις αὐτῶν — «ибо они боятся в логовах своих» (δείδω — «бояться»; κοίτη — «ложе, логово»); κάθηνται δὲ ἐν ὕλαις ἐνεδρεύοντες — «и сидят в лесах, подстерегая» (ὕλη — «лес»; ἐνεδρεύω — «подстерегать»). Слав. «убояшася бо на ложах своих»; место тёмное, передано буквально."
  41: "Господь. τίς δὲ ἡτοίμασεν κόρακι βοράν — «кто уготовал ворону пищу?» (κόραξ — «ворон»); νεοσσοὶ γὰρ αὐτοῦ πρὸς κύριον κεκράγασιν πλανώμενοι — «ибо птенцы его к Господу воззвали, блуждая» (νεοσσός — «птенец»; κράζω — «кричать»; πλανάω — «блуждать»); τὰ σῖτα ζητοῦντες — «ища пищи» (σῖτα — «хлебы, пища»). Здесь закрывается цитата главы; речь Господа продолжается в 39:1."
