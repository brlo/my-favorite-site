# jp-box, Иов, глава 38. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге только 1–2; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 38: 38:1 — формула Господа (повествование, вне кавычек): «после того как Елиуй
# перестал говорить, Господь сказал Иову через бурю и облака». 38:2–41 — речь Господа
# из бури, одна цитата 「…」; она продолжается в гл. 39 и закрыта в 39:30.
# Содержание: кто скрывает совет (2), препояшься, как муж (3), основание земли (4–7),
# море и его врата (8–11), утро и заря (12–15), источники моря и врата смерти (16–18),
# свет и тьма (19–21), снег, град и дождь (22–27), отец дождя и льда (28–30),
# созвездия (31–33), молнии и облака (34–36), премудрость и число облаков (37–38),
# львы и ворон (39–41).
# Голоса: 38:1 — повествование; 38:2–41 — Господь, 「…」. Слова Господа к морю в 38:11 —
# 『…』 (речь внутри речи).
# Нумерация по gr: 41 стих, как в csl-ru и ru.
# 〔…〕 нет: все стихи есть в gr-lxx-byz. Сносок ⟨…⟩ нет.
# Имена — транслитерация греческого (LXX): ヨブ, エリフ; созвездия — プレアデス, オリオン.

