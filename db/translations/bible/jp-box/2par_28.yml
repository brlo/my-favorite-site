verses:
  1: "アハズは二十歳[にじゅうさい]で王[おう]となり、エルサレムで十六年[じゅうろくねん]治[おさ]めた。彼[かれ]は父[ちち]ダビデのように、主[しゅ]の前[まえ]に正[ただ]しいことを行[おこな]わなかった。"
  2: "彼[かれ]はイスラエルの王[おう]たちの道[みち]を歩[あゆ]み、さらに彼らの偶像[ぐうぞう]のために彫[ほ]り物[もの]を造[つく]った。"
  3: "彼[かれ]はベン・ヒノムの谷[たに]で香[こう]をたき、主[しゅ]がイスラエルの子[こ]らの前[まえ]から追[お]い払[はら]われた異邦[いほう]の民[たみ]の忌[い]むべき行[おこな]いにならって、自分[じぶん]の子らを火[ひ]の中[なか]に通[とお]らせた。"
  4: "また、高[たか]い所[ところ]と丘[おか]の上[うえ]、すべての茂[しげ]った木[き]の下[した]で香[こう]をたいた。"
  5: "そこで彼[かれ]の神[かみ]である主[しゅ]は、彼をシリヤの王[おう]の手[て]に渡[わた]された。シリヤの王は彼を打[う]ち、多[おお]くの者[もの]を捕[と]らえてダマスコへ連[つ]れて行[い]った。また、彼はイスラエルの王の手にも渡され、その王は彼に大[おお]きな打撃[だげき]を与[あた]えた。"
  6: "レマルヤの子[こ]ペカは、ユダで一日[いちにち]のうちに十二万[じゅうにまん]人[にん]の勇士[ゆうし]を殺[ころ]した。彼[かれ]らが自分[じぶん]の父[ちち]たちの神[かみ]である主[しゅ]を見捨[みす]てたからである。"
  7: "エフライムの勇士[ゆうし]ジクリは、王[おう]の子[こ]マアセヤ、その家[いえ]の長[かしら]アズリカム、王に次[つぐ]者[もの]エルカナを殺[ころ]した。"
  8: "イスラエルの子[こ]らは、自分[じぶん]の兄弟[きょうだい]のうちから、女[おんな]、息子[むすこ]、娘[むすめ]を合[あ]わせて三十万[さんじゅうまん]人[にん]捕[と]らえ、また多[おお]くの分捕[ぶんど]り品[ひん]を彼[かれ]らから奪[うば]って、その分捕り品をサマリアへ運[はこ]んだ。"
  9: "そこには主[しゅ]の預言者[よげんしゃ]がいた。名[な]はオデドといった。彼[かれ]はサマリアへ来[く]る軍勢[ぐんぜい]の前[まえ]に出[で]て行[い]き、彼らに言[い]った。「見[み]よ、あなたがたの父[ちち]たちの神[かみ]である主の怒[いか]りがユダに下[くだ]ったので、主は彼らをあなたがたの手[て]に渡[わた]された。あなたがたは彼らを怒りをもって殺[ころ]し、その怒りは天[てん]にまで届[とど]いた。"
  10: "そして今[いま]、あなたがたはユダとエルサレムの子[こ]らを、自分[じぶん]の男女[だんじょ]の奴隷[どれい]にしようと言[い]っている。見[み]よ、わたしはあなたがたとともにいて、あなたがたの神[かみ]である主[しゅ]に対して証[あかし]をする者[もの]ではないか。"
  11: "今[いま]、私[わたし]の言[い]うことを聞[き]き、あなたがたの兄弟[きょうだい]から捕[と]らえた捕虜[ほりょ]を返[かえ]しなさい。主[しゅ]の激[はげ]しい怒[いか]りの炎[ほのお]があなたがたの上[うえ]にあるからである。」"
  12: "そこで、エフライムの子[こ]らのうちの長[おさ]たち、すなわちヨアナンの子アザリヤ、モソラモトの子バラキヤ、シャルムの子エゼキヤ、ホドリの子アマツヤが、戦[いくさ]から帰[かえ]って来[き]た者[もの]たちに立[た]ち向[む]かって言[い]った。"
  13: "「捕虜[ほりょ]をここへ連[つ]れて来[こ]てはならない。主[しゅ]に対[たい]して私たちが罪[つみ]を犯[おか]すことになるからである。あなたがたは、私たちの罪と過[あやま]ちの上[うえ]にさらに重[かさ]ねようとしている。私たちの罪は大[おお]きく、主の激[はげ]しい怒[いか]りの炎[ほのお]がイスラエルの上にあるからである。」"
  14: "そこで戦士[せんし]たちは、捕虜[ほりょ]と分捕[ぶんど]り品[ひん]を、長[おさ]たちと全会衆[ぜんかいしゅう]の前[まえ]に置[お]いた。"
  15: "そして、名[な]を挙[あ]げられた者[もの]たちが立[た]ち、捕虜[ほりょ]たちを引[ひ]き受[う]けて、その中[なか]の裸[はだか]の者をみな、分捕[ぶんど]り品[ひん]から衣[ころも]を取[と]って着[き]せかえ、彼[かれ]らに着物[きもの]を着せ、履[は]き物[もの]を履かせ、食[た]べ物を与[あた]えて油[あぶら]を塗[ぬ]らせ、弱[よわ]い者をみなろばに乗[の]せて、彼らの兄弟[きょうだい]のもとへ、なつめやしの町[まち]エリコへ送[おく]り届[とど]けた。こうして彼らはサマリアへ帰[かえ]った。"
  16: "その時[とき]、王[おう]アハズはアッシリアの王に、自分[じぶん]を助[たす]けてくれるよう遣[つか]わした。"
  17: "それというのも、エドム人[じん]が攻[せ]め寄[よ]せてユダを打[う]ち、捕虜[ほりょ]を取[と]ったからである。"
  18: "また、ペリシテ人[びと]は低地[ていち]の町[まち]々[まち]とユダの南[みなみ]を襲[おそ]って、ベト・シェメシュ、アヤロン、ゲデロト、ソコとその村[むら]々[むら]、ティムナとその村々、ギムゾとその村々を取[と]って、そこに住[す]んだ。"
  19: "主[しゅ]はアハズ、すなわちユダの王[おう]のゆえに、ユダを低[ひく]くされた。彼[かれ]が主から甚[はなは]だしく離[はな]れたからである。"
  20: "アッシリアの王[おう]ティグラト・ピレセルが彼[かれ]のところへ来[き]て、彼を打[う]った。"
  21: "アハズは主[しゅ]の家[いえ]、王[おう]の家、および長[おさ]たちのもとから取[と]ったものをアッシリアの王に与[あた]えたが、それは彼の助[たす]けにはならなかった。"
  22: "彼[かれ]は苦[くる]しめられると、さらに主[しゅ]から離[はな]れて行[い]った。そして王[おう]は言[い]った。"
  23: "「ダマスコの神[かみ]々[がみ]を求[もと]めよう。わたしを打[う]ったのは、あの神々だ。」そして言[い]った。「シリヤの王[おう]たちの神々は彼[かれ]らを強[つよ]くする。だから、あの神々に犠牲[ぎせい]をささげよう。そうすれば、彼らはわたしを助[たす]けてくれる。」しかし、それらは彼とすべてのイスラエルにつまずきとなった。"
  24: "アハズは主[しゅ]の家[いえ]の器[うつわ]を取[と]り除[のぞ]いて打[う]ち砕[くだ]き、主の家の扉[とびら]を閉[と]ざし、エルサレムのすべての隅[すみ]に自分[じぶん]のために祭壇[さいだん]を造[つく]った。"
  25: "また、ユダのすべての町[まち]に、ほかの神[かみ]々[がみ]に香[こう]をたくための高[たか]い所[ところ]を造[つく]り、自分[じぶん]の父[ちち]たちの神である主[しゅ]の怒[いか]りを引[ひ]き起[お]こした。"
  26: "彼[かれ]の残[のこ]りの言葉[ことば]と、最初[さいしょ]から最後[さいご]までのすべての行[おこな]いは、見[み]よ、ユダとイスラエルの王[おう]たちの書[しょ]に記[しる]されている。"
  27: "アハズは父[ちち]たちとともに眠[ねむ]り、ダビデの町[まち]に葬[ほうむ]られた。イスラエルの王[おう]たちの墓[はか]には入[い]れられなかった。代[か]わりにその子[こ]ヒゼキヤが王となった。"

notes:
  1: "Υἱὸς εἴκοσι ἐτῶν Αχαζ — сын двадцати лет Ахаз (так в гр. и ru; слав. «двадесяти и пяти лет» — порча, ср. 4 Цар 16:2 «двадцати лет»). δέκα ἓξ ἔτη — шестнадцать лет. οὐκ ἐποίησεν τὸ εὐθὲς ἐνώπιον κυρίου ὡς Δαυιδ ὁ πατὴρ αὐτοῦ — не делал правого пред Господом, как Давид, отец его."
  2: "ἐπορεύθη κατὰ τὰς ὁδοὺς βασιλέων Ισραηλ — пошёл по путям царей Израильских. γλυπτὰ ἐποίησεν τοῖς εἰδώλοις αὐτῶν — сделал изваяния для идолов их (γλυπτόν; слав. «изваянная» без дополнения, ru «литые статуи Ваалов» по МТ)."
  3: "ἔθυεν ἐν Γαιβενενομ — приносил жертвы в Га-Бен-Хинноме (Γαιβενενομ, «долина сына Еннома»; ベン・ヒノムの谷, ср. 4 Цар 23:10). διῆγεν τὰ τέκνα αὐτοῦ διὰ πυρὸς — проводил детей своих через огонь. κατὰ τὰ βδελύγματα τῶν ἐθνῶν — по мерзостям народов (βδέλυγμα). ὧν ἐξωλέθρευσεν κύριος ἀπὸ προσώπου υἱῶν Ισραηλ — которых истребил Господь от лица сынов Израилевых (ἐξολεθρεύω)."
  4: "ἐθυμία ἐπὶ τῶν ὑψηλῶν — кадил на высотах (θυμιάω). ἐπὶ τῶν δωμάτων — на кровлях (δῶμα); слав. «на холмех» и ru «на холмах» (МТ) — в тексте по слав. (ср. 4 Цар 16:4). ὑποκάτω παντὸς ξύλου ἀλσώδους — под всяким деревом рощистым (ἀλσώδης). В гр. здесь только «кадил», жертв нет."
  5: "παρέδωκεν αὐτὸν κύριος ὁ θεὸς αὐτοῦ — предал его Господь Бог его. διὰ χειρὸς βασιλέως Συρίας — в руку царя Сирии. ἐπάταξεν ἐν αὐτῷ — поразил его. ᾐχμαλώτευσεν ἐξ αὐτῶν αἰχμαλωσίαν πολλήν — пленил из них плен многих (αἰχμαλωτεύω). ἤγαγεν εἰς Δαμασκόν — отвёл в Дамаск. εἰς τὰς χεῖρας βασιλέως Ισραηλ παρέδωκεν αὐτόν — в руки царя Израильского предал его. ἐπάταξεν ἐν αὐτῷ πληγὴν μεγάλην — поразил его поражением великим."
  6: "ἀπέκτεινεν Φακεε ὁ τοῦ Ρομελια — убил Факей, сын Ремалии (ペカ, レマルヤ). ἑκατὸν εἴκοσι χιλιάδας ἀνδρῶν δυνατῶν ἰσχύι — сто двадцать тысяч мужей, сильных крепостью. ἐν τῷ αὐτοὺς καταλιπεῖν τὸν κύριον θεὸν τῶν πατέρων αὐτῶν — потому что они оставили Господа Бога отцов своих (καταλείπω)."
  7: "Εζεκρι ὁ δυνατὸς τοῦ Εφραιμ — Зихрий, силач из Ефрема (Εζεκρι; слав. «зехрий», ru «Зихрий»; ジクリ). Μαασαιαν τὸν υἱὸν τοῦ βασιλέως — Маасею, сына царя (マアセヤ). Εσδρικαμ ἡγούμενον τοῦ οἴκου αὐτοῦ — Азрикама, начальствующего над домом его (слав. «езрикама»). Ελκανα τὸν διάδοχον τοῦ βασιλέως — Елкана, преемника (второго по царе; слав. «наместника»)."
  8: "ᾐχμαλώτισαν... ἀπὸ τῶν ἀδελφῶν αὐτῶν τριακοσίας χιλιάδας, γυναῖκας, υἱοὺς καὶ θυγατέρας — взяли в плен у братьев своих триста тысяч: жён, сыновей и дочерей (в ru «двести тысяч» — иное чтение МТ; в тексте по гр. и слав.). σκῦλα πολλὰ ἐσκύλευσαν ἐξ αὐτῶν — много добычи захватили у них. ἤνεγκαν τὰ σκῦλα εἰς Σαμάρειαν — принесли добычу в Самарию."
  9: "ὁ προφήτης τοῦ κυρίου, Ωδηδ ὄνομα αὐτῷ — пророк Господень, имя ему Одед (Ωδηδ, オデド; слав. «одид»). ἐξῆλθεν εἰς ἀπάντησιν τῆς δυνάμεως — вышел навстречу силе. Ἰδοὺ ὀργὴ κυρίου θεοῦ τῶν πατρῶν ὑμῶν ἐπὶ τὸν Ιουδαν — вот, гнев Господа Бога отцов ваших на Иуду. παρέδωκεν αὐτοὺς εἰς τὰς χεῖρας ὑμῶν — предал их в руки ваши. ἀπεκτείνατε ἐν αὐτοῖς ἐν ὀργῇ — вы убивали их в ярости. ἕως τῶν οὐρανῶν ἔφθακεν — до небес достигло (о ярости; слав. добавляет в скобках «(ваше немилосердие)»)."
  10: "υἱοὺς Ιουδα καὶ Ιερουσαλημ ὑμεῖς λέγετε κατακτήσεσθαι εἰς δούλους καὶ δούλας — сынов Иуды и Иерусалима вы говорите покорить в рабов и рабынь (κατακτάομαι). οὐκ ἰδοὺ εἰμι μεθ᾿ ὑμῶν μαρτυρῆσαι κυρίῳ θεῷ ὑμῶν — не вот ли я с вами, чтобы свидетельствовать Господу Богу вашему (μαρτυρέω); ru по МТ иначе: «разве на самих вас нет вины пред Господом», в тексте гр. и слав."
  11: "ἀποστρέψατε τὴν αἰχμαλωσίαν — возвратите плен. ἣν ᾐχμαλωτεύσατε τῶν ἀδελφῶν ὑμῶν — который вы взяли у братьев ваших. ὀργὴ θυμοῦ κυρίου ἐφ᾿ ὑμῖν — гнев ярости Господней на вас."
  12: "ἀνέστησαν ἄρχοντες ἀπὸ τῶν υἱῶν Εφραιμ — встали начальники из сынов Ефрема. Ουδια ὁ τοῦ Ιωανου — Удия, сын Иоана (гр. Ουδια; слав. «азариа сын иоанан», ru «Азария, сын Иегоханана»; в тексте по слав. アザリヤ и ヨアナン). Βαραχιας ὁ τοῦ Μοσολαμωθ — Варахия, сын Мосоламофа (バラキヤ, как в 1 Пар 3:20; слав. «васаллимофов»). Εζεκιας ὁ τοῦ Σελλημ — Езекия, сын Селлума (シャルム). Αμασιας ὁ τοῦ Χοδλι — Амасия, сын Ходли (слав. «елдаев», ru «Хадлая»; ホドリ). ἐπὶ τοὺς ἐρχομένους ἀπὸ τοῦ πολέμου — против приходящих с войны."
  13: "Οὐ μὴ εἰσαγάγητε τὴν αἰχμαλωσίαν ὧδε πρὸς ἡμᾶς — не вводите сюда к нам плена. εἰς τὸ ἁμαρτάνειν τῷ κυρίῳ ἐφ᾿ ἡμᾶς — в грех нам пред Господом. προσθεῖναι ἐπὶ ταῖς ἁμαρτίαις ἡμῶν καὶ ἐπὶ τὴν ἄγνοιαν — приложить к грехам нашим и к неведению (ἄγνοια; слав. «к безумию»). πολλὴ ἡ ἁμαρτία ἡμῶν — велик грех наш. ὀργὴ θυμοῦ κυρίου ἐπὶ τὸν Ισραηλ — гнев ярости Господней на Израиля."
  14: "ἀφῆκαν οἱ πολεμισταὶ τὴν αἰχμαλωσίαν καὶ τὰ σκῦλα — оставили воины плен и добычу (πολεμιστής). ἐναντίον τῶν ἀρχόντων καὶ πάσης τῆς ἐκκλησίας — пред начальниками и всем собранием (ἐκκλησία — «собрание»; слав. «пред всем множеством»)."
  15: "ἄνδρες, οἳ ἐπεκλήθησαν ἐν ὀνόματι — мужи, названные по имени (ἐπικαλέω). ἀντελάβοντο τῆς αἰχμαλωσίας — взяли плен (ἀντιλαμβάνομαι). πάντας τοὺς γυμνοὺς περιέβαλον ἀπὸ τῶν σκύλων — всех нагих одели из добычи. ἐνέδυσαν αὐτοὺς καὶ ὑπέδησαν αὐτούς — одели их и обули их (ὑποδέω). ἔδωκαν φαγεῖν καὶ ἀλείψασθαι — дали есть и помазаться (ἀλείφω; слав. добавляет «и пити» — в гр. нет). ἀντελάβοντο ἐν ὑποζυγίοις παντὸς ἀσθενοῦντος — посадили на вьючный скот всякого немощного (ὑποζύγιον). κατέστησαν αὐτοὺς εἰς Ιεριχω πόλιν φοινίκων — отправили их в Иерихон, город пальм (φοῖνιξ). πρὸς τοὺς ἀδελφοὺς αὐτῶν — к братьям их. ἐπέστρεψαν εἰς Σαμάρειαν — возвратились в Самарию."
  16: "Ἐν τῷ καιρῷ ἐκείνῳ — в то время. ἀπέστειλεν Αχαζ πρὸς βασιλέα Ασσουρ βοηθῆσαι αὐτῷ — послал Ахаз к царю Ассирийскому, чтобы тот помог ему. Слав. добавляет «прося помощи себе и в том» — в гр. короче."
  17: "καὶ ἐν τούτῳ, ὅτι Ιδουμαῖοι ἐπέθεντο — и при этом, что идумеи напали. ἐπάταξαν ἐν Ιουδα — поразили в Иудее. ᾐχμαλώτισαν αἰχμαλωσίαν — взяли плен (стих в гр. обрывается, продолжение в 18)."
  18: "οἱ ἀλλόφυλοι ἐπέθεντο ἐπὶ τὰς πόλεις τῆς πεδινῆς καὶ ἀπὸ λιβὸς τοῦ Ιουδα — иноплеменники напали на города низменности и с юга Иуды (πεδινή, λίψ — «юг»). ἔλαβον τὴν Βαιθσαμυς — взяли Беф-Самис (ベト・シェメシュ). Αιλων — Аиалон (アヤロン; слав. «аилон»). Γαδηρωθ — Гедероф (ゲデロト). Σωχω — Сохо (ソコ). Θαμνα — Фимна (ティムナ). Γαμζω — Гимзо (ギムゾ). κατῴκησαν ἐκεῖ — поселились там. Слав. здесь испорчен (вносит «яже в дому Господни…»); в тексте по гр."
  19: "ἐταπείνωσεν κύριος τὸν Ιουδαν — унизил Господь Иуду (ταπεινόω). δι᾿ Αχαζ βασιλέα Ιουδα — за Ахаза, царя Иудейского. ὅτι ἀπέστη ἀποστάσει ἀπὸ κυρίου — ибо отступил отступлением от Господа (усилительная конструкция). Ru по МТ: «развратил Иудею и тяжко грешил»."
  20: "Θαγλαθφελλασαρ βασιλεὺς Ασσουρ — Феглаффелласар, царь Ассирийский (ティグラト・ピレセル, ср. 4 Цар 15:29; 16:7). ἦλθεν ἐπ᾿ αὐτὸν — пришёл на него. ἐπάταξεν αὐτόν — поразил его (слав. добавляет пространный глосс о переселении в Мидию — в гр. его нет)."
  21: "ἔλαβεν Αχαζ τὰ ἐν οἴκῳ κυρίου — взял Ахаз то, что в доме Господнем. τὰ ἐν οἴκῳ τοῦ βασιλέως καὶ τῶν ἀρχόντων — что в доме царя и у начальников. ἔδωκεν τῷ βασιλεῖ Ασσουρ — отдал царю Ассирийскому. οὐκ εἰς βοήθειαν αὐτῷ — не в помощь ему (слав. добавляет «но токмо к печали его»)."
  22: "τῷ θλιβῆναι αὐτὸν — в стеснении его (θλίβω). προσέθηκεν τοῦ ἀποστῆναι ἀπὸ κυρίου — приложил отступить от Господа. εἶπεν ὁ βασιλεύς — сказал царь; речь продолжается в 23, поэтому и в японском стих кончается на 言った, а кавычки открываются в 23."
  23: "Ἐκζητήσω τοὺς θεοὺς Δαμασκοῦ τοὺς τύπτοντάς με — взыщу богов Дамаска, поражающих меня. θεοὶ βασιλέως Συρίας αὐτοὶ κατισχύσουσιν αὐτούς — боги царя Сирии сами укрепляют их. αὐτοῖς τοίνυν θύσω — им и принесу жертвы (θύω). ἀντιλήμψονταί μου — и помогут мне (ἀντιλαμβάνομαι). ἐγένοντο αὐτῷ εἰς σκῶλον — стали ему в преткновение (σκῶλον; слав. «к падению»). παντὶ Ισραηλ — и всему Израилю."
  24: "ἀπέστησεν Αχαζ τὰ σκεύη οἴκου κυρίου — отставил (убрал) Ахаз сосуды дома Господня (ἀφίστημι; ru «собрал» по МТ). κατέκοψεν αὐτά — разрубил их (κατακόπτω). ἔκλεισεν τὰς θύρας — заключил двери. ἐποίησεν ἑαυτῷ θυσιαστήρια ἐν πάσῃ γωνίᾳ — сделал себе жертвенники на всяком углу."
  25: "ἐν πάσῃ πόλει καὶ πόλει ἐν Ιουδα — в каждом городе Иуды (повтор ради распределения). ἐποίησεν ὑψηλὰ θυμιᾶν θεοῖς ἀλλοτρίοις — сделал высоты, чтобы кадить богам чужим (ἀλλότριος). παρώργισαν κύριον — раздражили Господа (παροργίζω)."
  26: "οἱ λοιποὶ λόγοι αὐτοῦ καὶ αἱ πράξεις αὐτοῦ αἱ πρῶται καὶ αἱ ἔσχαται — прочие слова его и деяния его, первые и последние. ἐπὶ βιβλίῳ βασιλέων Ιουδα καὶ Ισραηλ — в книге царей Иудейских и Израильских."
  27: "ἐκοιμήθη Αχαζ μετὰ τῶν πατέρων αὐτοῦ — почил Ахаз с отцами своими. ἐτάφη ἐν πόλει Δαυιδ — погребён в городе Давида. ὅτι οὐκ εἰσήνεγκαν αὐτὸν εἰς τοὺς τάφους τῶν βασιλέων Ισραηλ — ибо не внесли его в гробницы царей Израилевых (εἰσφέρω). ἐβασίλευσεν Εζεκιας υἱὸς αὐτοῦ ἀντ αὐτοῦ — воцарился Езекия, сын его, вместо него."
