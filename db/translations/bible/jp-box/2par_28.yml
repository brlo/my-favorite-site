# jp-box, 2-я Паралипоменон, глава 28. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет,
# jp-ni (под авторским правом) источником не был.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 28: нечестие Ахаза (1–4); поражения от сирийцев и Израиля (5–8);
# слово пророка Одеда и возвращение пленных (9–15); Ахаз и ассирийцы (16–21);
# дальнейшее нечестие и смерть (22–27).
# Речь — 「…」 (9–11, 13, 23). Красного нет.
# Нумерация по gr: 27 стихов, совпадает с csl/ru.
# Паритет LXX/csl: csl-чтения в основном тексте без 〔…〕; вариант LXX — в notes.
# 28:1 — в гр. и ru «двадцати лет», в слав. «двадесяти и пяти» (порча, ср. 4 Цар 16:2).
# 28:8 — в гр. и слав. «триста тысяч», в ru «двести тысяч» (МТ).
# 〔…〕 не ставим. Сносок ⟨…⟩ нет: 祭壇, 高[たか]い所[ところ], 神殿, 預言者, 隔離 уже в корпусе.

