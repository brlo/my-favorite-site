verses:
  0: "ダビデの碑[ひ]文[ぶん]。"
  1: "主[しゅ]よ、わたしを守[まも]ってください。わたしはあなたに寄[よ]り頼[たの]んだからである。"
  2: "わたしは主[しゅ]に言[い]った。「あなたはわたしの主[ぬし]である。わたしの善[ぜん]いものは、あなたに必要[ひつよう]ではない」と。"
  3: "地[ち]にあるその聖[せい]なる者[もの]たちに、主[しゅ]はご自分[じぶん]のすべての望[のぞ]みを驚[おどろ]くべきものとして示[しめ]された。"
  4: "彼[かれ]らの病[やまい]は増[ふ]え、その後[のち]、彼[かれ]らは急[いそ]いだ。わたしは彼[かれ]らの血[ち]による集[つど]いを集[あつ]めず、その名[な]を唇[くちびる]で口[くち]にしない。"
  5: "主[しゅ]はわたしの受け継[つ]ぎの分[ぶん]、わたしの杯[さかずき]の分[ぶん]である。あなたはわたしの受け継[つ]ぎをわたしに回復[かいふく]してくださる方[かた]である。"
  6: "測[はか]り縄[なわ]はわたしに最[もっと]も良[よ]い所[ところ]に落[お]ちた。まことに、わたしの受け継[つ]ぎはすばらしい。"
  7: "わたしを悟[さと]らせてくださった主[しゅ]を、わたしはほめたたえる。夜[よる]になっても、わたしの腎[じん]がわたしを戒[いまし]めた。"
  8: "わたしはいつも、主[しゅ]を自分[じぶん]の前[まえ]に置[お]いていた。主[しゅ]がわたしの右[みぎ]におられるので、わたしは揺[ゆ]らがない。"
  9: "それゆえ、わたしの心[こころ]は喜[よろこ]び、わたしの舌[した]は喜[よろこ]び躍[おど]った。わたしの肉[にく]体[たい]もまた、希望[きぼう]のうちに住[す]まう。"
  10: "あなたはわたしの魂[たましい]を陰府[よみ]に捨[す]て置[お]かれず、あなたの聖[せい]なる者[もの]に朽[く]ちることを見[み]させられないからである。"
  11: "あなたはわたしに命[いのち]の道[みち]を知[し]らせてくださった。あなたの顔[かお]の前[まえ]で、あなたはわたしを喜[よろこ]びで満[み]たしてくださる。あなたの右[みぎ]の手[て]には、とこしえの楽[たの]しみがある。"

notes:
  0: "Στηλογραφία τῷ Δαυιδ — ダビデの碑文 (στηλογραφία — «надпись на столпе», столпописание; слово редкое, в LXX встречается только здесь; в Синодальном «Песнь Давида», в jp-joc «ダワィドの歌»). Передано 碑文, без толкования. Надписание — стих 0."
  1: "Φύλαξόν με, κύριε, ὅτι ἐπὶ σοὶ ἤλπισα — 主よ、わたしを守ってください、わたしはあなたに寄り頼んだからである (φυλάσσω — «охранять»; ἐλπίζω ἐπί — «надеяться на»). В гр. κύριε; 神 не поставлено, хотя jp-joc читает 神よ."
  2: "εἶπα τῷ κυρίῳ Κύριός μου εἶ σύ — わたしは主に言った、「あなたはわたしの主である」. ὅτι τῶν ἀγαθῶν μου οὐ χρείαν ἔχεις — わたしの善いものは、あなたに必要ではない (χρείαν ἔχω — «иметь нужду»; смысл: Бог не нуждается в благах человека, ср. Пс 49:9–12). Слова псалмопевца — 「」."
  3: "τοῖς ἁγίοις τοῖς ἐν τῇ γῇ αὐτοῦ — 地にあるその聖なる者たちに (датив, к кому обращена речь). ἐθαυμάστωσεν πάντα τὰ θελήματα αὐτοῦ ἐν αὐτοῖς — 主はご自分のすべての望みを驚くべきものとして示された (θαυμαστόω — «делать дивным»; θέλημα — «воля, желание»). Место тёмное; передано буквально, без сглаживания (ср. церковнослав. «удиви Господь вся хотения Своя в них»)."
  4: "ἐπληθύνθησαν αἱ ἀσθένειαι αὐτῶν — 彼らの病は増え (ἀσθένεια — «немощь, болезнь»). μετὰ ταῦτα ἐτάχυναν — その後、彼らは急いだ (ταχύνω — «спешить»; место тёмное, оставлено буквально). οὐ μὴ συναγάγω τὰς συναγωγὰς αὐτῶν ἐξ αἱμάτων — わたしは彼らの血による集いを集めず (συναγωγή — «собрание»; ἐξ αἱμάτων — «от кровей», т. е. кровавые жертвы). οὐδὲ μὴ μνησθῶ τῶν ὀνομάτων αὐτῶν διὰ χειλέων μου — その名を唇で口にしない (μνησθῶ — «упоминать»)."
  5: "κύριος ἡ μερὶς τῆς κληρονομίας μου καὶ τοῦ ποτηρίου μου — 主はわたしの受け継ぎの分、わたしの杯の分である (μερίς — «часть, доля»; κληρονομία — 受け継ぎ; ποτήριον — 杯, образ судьбы). σὺ εἶ ὁ ἀποκαθιστῶν τὴν κληρονομίαν μου ἐμοί — あなたはわたしの受け継ぎをわたしに回復してくださる方である (ἀποκαθίστημι — «восстанавливать, возвращать»)."
  6: "σχοινία ἐπέπεσόν μοι ἐν τοῖς κρατίστοις — 測り縄はわたしに最も良い所に落ちた (σχοινίον — «вервь, мера земли»; κράτιστα — «лучшее, крепчайшее»; 所 — подразумеваемый участок, без 〔…〕). καὶ γὰρ ἡ κληρονομία μου κρατίστη μοί ἐστιν — まことに、わたしの受け継ぎはすばらしい (κρατίστη — превосходная степень)."
  7: "εὐλογήσω τὸν κύριον τὸν συνετίσαντά με — わたしを悟らせてくださった主を、わたしはほめたたえる (συνετίζω — «вразумлять»). ἔτι δὲ καὶ ἕως νυκτὸς ἐπαίδευσάν με οἱ νεφροί μου — 夜になっても、わたしの腎がわたしを戒めた (παιδεύω — «наставлять»; νεφροί — 腎, как место чувств; ср. Пс 7:9)."
  8: "προωρώμην τὸν κύριον ἐνώπιόν μου διὰ παντός — わたしはいつも、主を自分の前に置いていた (προοράομαι — «видеть пред собою»). ὅτι ἐκ δεξιῶν μού ἐστιν, ἵνα μὴ σαλευθῶ — 主がわたしの右におられるので、わたしは揺らがない (σαλεύω — «колебать»)."
  9: "διὰ τοῦτο ηὐφράνθη ἡ καρδία μου — それゆえ、わたしの心は喜び (εὐφραίνομαι — «веселиться»). ἠγαλλιάσατο ἡ γλῶσσά μου — わたしの舌は喜び躍った (ἀγαλλιάομαι — «ликовать»; Деян 2:26 цитирует этот стих). ἔτι δὲ καὶ ἡ σάρξ μου κατασκηνώσει ἐπ᾽ ἐλπίδι — わたしの肉体もまた、希望のうちに住まう (σάρξ — 肉体; κατασκηνόω — «обитать»)."
  10: "ὅτι οὐκ ἐγκαταλείψεις τὴν ψυχήν μου εἰς ᾅδην — あなたはわたしの魂を陰府に捨て置かれず (ἐγκαταλείπω — «оставлять»; ᾅδης — 陰府). οὐδὲ δώσεις τὸν ὅσιόν σου ἰδεῖν διαφθοράν — あなたの聖なる者に朽ちることを見させられない (ὅσιος — «преподобный»; διαφθορά — «тление»; Деян 2:27.31 — ключевое место о Воскресении; красного нет)."
  11: "ἐγνώρισάς μοι ὁδοὺς ζωῆς — あなたはわたしに命の道を知らせてくださった (γνωρίζω — «открывать, давать знать»; plural ὁδούς — 道). πληρώσεις με εὐφροσύνης μετὰ τοῦ προσώπου σου — あなたの顔の前で、あなたはわたしを喜びで満たしてくださる (πληρόω — «наполнять»; μετὰ τοῦ προσώπου — «с лицом Твоим», т. е. в присутствии). τερπνότητες ἐν τῇ δεξιᾷ σου εἰς τέλος — あなたの右の手には、とこしえの楽しみがある (τερπνότης — «услада»; εἰς τέλος — «до конца, вовек»)."
