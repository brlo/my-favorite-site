# jp-box, Псалтирь, псалом 15. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0.
# Псалом 15 (LXX; евр. 16): «Храни меня, Боже» — Господь часть наследия (1–6),
# совет и наставление ночью (7), Господь всегда пред очами (8), радость плоти в надежде (9),
# неоставление души во аде и нетление святого (10), путь жизни и полнота радости (11).
# Стихи 8–11 — пророчество о Воскресении (Деян 2:25–28); красного нет: это пророчество,
# а не евангельская речь Христа. Кавычки: слова псалмопевца к Господу в 2 — 「…」.
# 〔…〕 нет: все слова в gr-lxx-byz есть.
# セラ в этом псалме нет; διάψαλμα не передаётся — по решению пользователя, как у jp-joc.
# Сносок ⟨…⟩ нет: 陰府, 幕屋, 受け継ぎ уже в корпусе.
# jp-ni не использовался.

