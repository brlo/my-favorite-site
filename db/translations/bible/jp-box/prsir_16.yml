verses:
  1: "役[やく]に立[た]たない子[こ]どもの多[おお]さを望[のぞ]んではならない。不敬[ふけい]な子[こ]らを喜[よろこ]んではならない。たとえ彼[かれ]らが増[ふ]えても、主[しゅ]を恐[おそ]れることが彼らとともにないなら、彼らを喜[よろこ]んではならない。"
  2: "彼[かれ]らの生[い]き方[かた]を信[しん]じてはならない。彼らの多[おお]さに寄[よ]りかかってはならない。"
  3: "ひとりの思慮[しりょ]のある者[もの]は千[せん]人[にん]よりも優[すぐ]れ、"
  4: "子[こ]どもを持[も]たずに死[し]ぬほうが、不敬[ふけい]な子[こ]どもを持つよりよいからである。"
  5: "思慮[しりょ]のあるひとりの者[もの]によって町[まち]は人[ひと]で満[み]たされ、不法[ふほう]な者[もの]の一族[いちぞく]は荒[あ]れ果[は]てるからである。"
  6: "このよう[よう]なことを多[おお]く、わたしの目[め]は見[み]てきた。これらよりも強[つよ]いことを、わたしの耳[みみ]は聞[き]いてきた。"
  7: "罪人[つみびと]たちの集[つど]いのうちでは火[ひ]が燃[も]え上[あ]がり、不従順[ふじゅうじゅん]な民[たみ]のうちでは怒[いか]りが燃[も]え上[あ]がった。"
  8: "神[かみ]は昔[むかし]の巨人[きょじん]たちのために宥[なだ]められることはなかった。彼らは自分[じぶん]の力[ちから]によって離[はな]れ去[さ]った者[もの]たちである。"
  9: "神[かみ]はロトの寄留[きりゅう]の地[ち]を惜[お]しまれなかった。その高慢[こうまん]のゆえに、彼[かれ]らを忌[い]み嫌[きら]われたからである。"
  10: "滅[ほろ]びに定[さだ]められた民[たみ]、すなわち自分[じぶん]の罪[つみ]のうちに高[たか]ぶられた者[もの]たちを、神[かみ]はあわれまれなかった。"
  11: "同[おな]じように、その頑[かた]くな心[こころ]のうちに集[つど]められた六十万[ろくじゅうまん]の歩兵[ほへい]たちを、あわれまれなかった。たとえひとりの頑[かた]くな首[くび]の者[もの]であっても、彼が罰[ばつ]を免[まぬか]れるなら、それは驚[おどろ]くべきことである。"
  12: "あわれみと怒[いか]りは神[かみ]のもとにあり、神は宥[なだ]めを受[う]ける力[ちから]ある方[かた]であり、怒りを注[そそ]ぎ出[だ]す方である。"
  13: "そのあわれみが大[おお]きいように、その叱責[しっせき]もまた大[おお]きい。神は人[ひと]をそのわざに従[したが]って裁[さば]かれる。"
  14: "罪人[つみびと]は奪[うば]い取[と]った物[もの]によって逃[のが]れることはない。敬虔[けいけん]な者[もの]の忍耐[にんたい]が無駄[むだ]になることはない。"
  15: "神[かみ]はすべての施[ほどこ]しのために場[ば]所[しょ]を備[そな]えられる。それぞれの者[もの]は自分[じぶん]のわざに従って報[むく]いを受[う]ける。主[しゅ]はファラオの心[こころ]を硬[かた]くして、ご自分[じぶん]を知[し]らせなかった。それは、主のわざが天[てん]の下[した]に知[し]られるためであった。"
  16: "主[しゅ]のあわれみはすべての造[つく]られたものに明[あき]らかであり、主はご自分[じぶん]の光[ひかり]と闇[やみ]を金剛石[こんごうせき]によって分[わ]けられた。「主[しゅ]から隠[かく]れよう。高[たか]みからだれがわたしを思[おも]い起[おこ]すだろうか」と言[い]ってはならない。"
  17: "「多[おお]くの民[たみ]のうちでわたしは知[し]られない。果[は]てしなく広[ひろ]い造[つく]られたもののうちで、わたしの魂[たましい]は何[なに]だろうか」と言[い]ってはならない。"
  18: "見[み]よ、天[てん]と天[てん]の天[てん]、深[ふか]い淵[ふち]と地[ち]は、主[しゅ]が訪[おとず]れられるときに揺[ゆ]れ動[うご]く。"
  19: "山々[やまやま]も地[ち]の基[もと]もともに、主[しゅ]がそれらを見[み]つめられるとき、震[ふる]えおののく。"
  20: "これらのことを心[こころ]は悟[さと]ることができず、"
  21: "だれが主[しゅ]の道[みち]を思[おも]いめぐらすことができるだろうか。また、人[ひと]が見[み]ることのできない嵐[あらし]がある。主[しゅ]のわざの多[おお]くは隠[かく]されたところにある。"
  22: "だれが義[ぎ]のわざを告[つ]げ知[し]らせるだろうか。だれがそれを持[じ]ちこたえるだろうか。契約[けいやく]は遠[とお]くにあるからである。"
  23: "心[こころ]の乏[とぼ]しい者[もの]がこれらのことを考[かんが]え、愚[おろ]かな者[もの]、迷[まよ]う者[もの]が愚かなことを考える。"
  24: "子[こ]よ、わたしの言[い]うことを聞[き]き、知識[ちしき]を学[まな]べ。わたしの言葉[ことば]に心[こころ]を向[む]けよ。"
  25: "わたしは秤[はかり]にかけて教[おし]えを示[しめ]し、正確[せいかく]に知識[ちしき]を語[かた]ろう。"
  26: "主[しゅ]のわざは初[はじ]めからその裁[さば]きのうちにあり、造[つく]られた時[とき]から、主はそれらの分[ぶん]を分[わ]けられた。"
  27: "主[しゅ]はご自分[じぶん]のわざを永遠[えいえん]に飾[かざ]り、その始[はじ]まりを代々[よよ]に及[およ]ぼされた。それらは飢[う]えることも疲[つか]れることもなく、そのわざをやめることもない。"
  28: "それぞれが隣[となり]の者[もの]を押[お]しのけることはなく、"
  29: "永遠[えいえん]に主[しゅ]の言葉[ことば]に逆[さか]らうことはない。"
  30: "その後[のち]、主[しゅ]は地[ち]をご覧[らん]になり、ご自分[じぶん]の良[よ]いものでそれを満[み]たされた。"
  31: "主[しゅ]はすべての生[い]き物[もの]の魂[たましい]で地[ち]の面[おもて]を覆[おお]い、それらはみな地に帰[かえ]る。"

notes:
  1: "μὴ ἐπιθύμει τέκνων πλῆθος ἀχρήστων — «не желай множества негодных детей»: ἀχρῆστος — бесполезный, негодный (слав. «неключимых»). μηδὲ εὐφραίνου ἐπὶ υἱοῖς ἀσεβέσιν — «и не радуйся о сыновьях нечестивых» (ἀσεβής — нечестивый). Слав. 16:1 продолжает словами гр 16:2 («егда умножатся…»), у нас они в ст. 2. ἐὰν πληθύνωσιν — «если умножатся»; εἰ μή ἐστιν φόβος κυρίου μετ᾿ αὐτῶν — «если нет страха Господня с ними». Слав. 16:1 вбирает и гр 16:2; по перенумерации принято деление слав. (наши прежние 16:1–2 соединены)."
  2: "μὴ ἐμπιστεύσῃς τῇ ζωῇ αὐτῶν — «не доверяй их жизни» (ἐμπιστεύω — вверять); μὴ ἔπεχε ἐπὶ τὸ πλῆθος αὐτῶν — «не опирайся на их множество» (ἐπέχω — держаться за). κρείσσων εἷς ἢ χίλιοι — «лучше один, чем тысяча»; ἀποθανεῖν ἄτεκνον — «умереть бездетным». Слав. делит стих на 16:2–4; по перенумерации принято деление слав."
  3: "Продолжение ст. 2 (тот же стих по-гречески)."
  4: "Продолжение ст. 2 (тот же стих по-гречески)."
  5: "ἀπὸ γὰρ ἑνὸς συνετοῦ συνοικισθήσεται πόλις — «ибо от одного разумного населится город» (συνετός — разумный, смышлёный; συνοικίζω — населять). φυλὴ δὲ ἀνόμων ἐρημωθήσεται — «а племя беззаконных опустеет» (ἄνομος — беззаконный). Слав. 16:4."
  6: "πολλὰ τοιαῦτα ἑόρακεν ὁ ὀφθαλμός μου — «много такого видел глаз мой»; ἰσχυρότερα τούτων ἀκήκοεν τὸ οὖς μου — «и более сильное слышало ухо моё». Слав. «Многа сицевая виде око мое». Вводная формула к следующим примерам."
  7: "ἐν συναγωγῇ ἁμαρτωλῶν ἐκκαυθήσεται πῦρ — «в собрании грешников возгорится огонь»; ἐν ἔθνει ἀπειθεῖ ἐξεκαύθη ὀργή — «и в народе непокорном возгорелся гнев» (ἀπειθής — непокорный). Слав. «в соборищи грешных»."
  8: "οὐκ ἐξιλάσατο περὶ τῶν ἀρχαίων γιγάντων — «не умилостивился о древних гигантах» (ἐξιλάσκομαι — умилостивлять; γίγας — гигант, исполин). οἳ ἀπέστησαν τῇ ἰσχύι αὐτῶν — «которые отступили силою своею». Речь о Быт 6:4."
  9: "οὐκ ἐφείσατο περὶ τῆς παροικίας Λωτ — «не пощадил окрестности Лота» (φείδομαι — щадить; παροικία — пришельство, окрестность). οὓς ἐβδελύξατο διὰ τὴν ὑπερηφανίαν αὐτῶν — «которых возгнушался за их гордость» (βδελύσσομαι — гнушаться). Быт 19."
  10: "οὐκ ἠλέησεν ἔθνος ἀπωλείας — «не помиловал народ погибели» (ἀπώλεια — погибель); τοὺς ἐξηρμένους ἐν ἁμαρτίαις αὐτῶν — «вознесшихся в грехах своих» (ἐξαίρω — поднимать, возносить). Слав. «не помилова языка погибельнаго»."
  11: "καὶ οὕτως ἑξακοσίας χιλιάδας πεζῶν — «и так шестьсот тысяч пеших» (πεζός — пеший, пехотинец); τοὺς ἐπισυναχθέντας ἐν σκληροκαρδίᾳ αὐτῶν — «собравшихся в жестокосердии своём» (σκληροκαρδία). Исх 12:37; Чис 11:21. Κἂν ᾖ εἷς σκληροτράχηλος — «если и один будет жестоковыйный» (σκληροτράχηλος — с крепкой шеей, упрямый); θαυμαστὸν τοῦτο εἰ ἀθῳωθήσεται — «удивительно, если он останется ненаказанным» (ἀθῳόω — признавать невинным). ἔλεος γὰρ καὶ ὀργὴ παρ᾿ αὐτῷ — «ибо милость и гнев у Него»; δυνάστης ἐξιλασμῶν — «владыка умилостивлений» (ἐξιλασμός). Слав. 16:11 вбирает также конец гр 16:10; у нас гр 10 отдельно."
  12: "Продолжение ст. 11 (тот же стих по-гречески)."
  13: "κατὰ τὸ πολὺ ἔλεος αὐτοῦ, οὕτως καὶ πολὺς ὁ ἔλεγχος αὐτοῦ — «по многой милости Его, так и велико обличение Его» (ἔλεγχος — обличение, изобличение). ἄνδρα κατὰ τὰ ἔργα αὐτοῦ κρινεῖ — «человека по делам его судит». Слав. 16:12–13."
  14: "οὐκ ἐκφεύξεται ἐν ἁρπάγματι ἁμαρτωλός — «не убежит с хищением грешник» (ἅρπαγμα — добыча, похищенное); οὐ μὴ καθυστερήσει ὑπομονὴ εὐσεβοῦς — «не замедлит терпение благочестивого» (ὑπομονή — терпение). Слав. 16:14."
  15: "πάσῃ ἐλεημοσύνῃ ποιήσει τόπον — «всякой милостыне сотворит место» (ἐλεημοσύνη — милостыня, милосердие); ἕκαστος κατὰ τὰ ἔργα αὐτοῦ εὑρήσει — «каждый по делам своим найдёт». Слав. 16:15 читает «Всяцей милостыни сотворит место» и стоит на месте этого стиха; по перенумерации стих LXX присоединён к csl 16:15 (см. ниже). В gr-lxx-byz на месте стиха стоит «.» (дефект модуля). Κύριος ἐσκλήρυνε Φαραώ — «Господь ожесточил фараона» (σκληρύνω — делать жёстким); μὴ εἰδέναι αὐτόν — «чтобы не знать Его»; ὅπως ἂν γνωσθῇ ἐνεργήματα αὐτοῦ τῇ ὑπ᾿ οὐρανόν — «дабы стали известны действия Его под небом» (ἐνέργημα — действие). Чтение по полному церковному греч. тексту (GOARCH, в скобках; Комплютензиана); в слав. и Синодальном стиха нет. Слав. краткая редакция не содержит ст. 16:15 (о фараоне); стих полного LXX сохранён здесь, при csl 16:15. 〔…〕 не ставится: это чтение LXX, а не добавка Церкви."
  16: "В gr-lxx-byz на месте стиха стоит «.» (дефект модуля). πάσῃ τῇ κτίσει τὸ ἔλεος αὐτοῦ φανερόν — «всякой твари милость Его явна» (κτίσις — творение); τὸ φῶς αὐτοῦ καὶ τὸ σκότος ἐμέρισε τῷ ἀδάμαντι — «свет Свой и тьму разделил алмазом»: ἀδάμας — несокрушимое, алмаз (KJV: «with an adamant»), т. е. незыблемой границей. В слав. и Синодальном стиха нет; чтение по полному греч. тексту (GOARCH, в скобках). Слав. краткая редакция не содержит ст. 16:16 (милость ко всякой твари, свет и тьма); стих полного LXX сохранён здесь, при csl 16:16. Прямая речь, начатая в этом стихе, продолжается в ст. 17."
  17: "μὴ εἴπῃς ὅτι Ἀπὸ κυρίου κρυβήσομαι — «не скажи: скроюсь от Господа»; ἐξ ὕψους τίς μου μνησθήσεται — «с высоты кто обо мне вспомнит». ἐν λαῷ πλείονι οὐ μὴ γνωσθῶ — «в народе множайшем не буду познан»; τίς γὰρ ἡ ψυχή μου ἐν ἀμετρήτῳ κτίσει — «ибо что душа моя в неизмеримой твари». Вся тирада — запрещённая речь нечестивых, в 「…」 (вводка «не говори»); кавычки закрываются в конце стиха. Разделение по слав. пришлось внутри цитаты: кавычки закрыты в ст. 16 и открыты заново здесь, «と言ってはならない» повторено (в прежнем тексте оно стояло одно на оба полустишия)."
  18: "ὁ οὐρανὸς καὶ ὁ οὐρανὸς τοῦ οὐρανοῦ — «небо и небо небес»; ἄβυσσος — бездна (слав. «бездна»); ἐν τῇ ἐπισκοπῇ αὐτοῦ σαλευθήσονται — «при посещении Его поколеблются» (ἐπισκοπή — посещение, попечение). Слав. добавляет «Божия» («небо небесе Божия») — нет в LXX, не внесено."
  19: "ἅμα τὰ ὄρη καὶ τὰ θεμέλια τῆς γῆς — «вместе горы и основания земли» (θεμέλια — основания); ἐν τῷ ἐπιβλέψαι εἰς αὐτὰ τρόμῳ συσσείονται — «когда Он воззрит на них, трепетом сотрясаются» (τρόμος — трепет). Слав. «трепетом стрясутся»."
  20: "ἐπ᾿ αὐτοῖς οὐ διανοηθήσεται καρδία — «о них не помыслит сердце» (διανοέομαι — размышлять, понимать); τὰς ὁδοὺς αὐτοῦ τίς ἐνθυμηθήσεται — «пути Его кто уразумеет». Слав. 16:20–21 сливает этот стих со следующим; по перенумерации стих разделён по слав.: здесь csl 16:20, в ст. 21 — csl 16:21."
  21: "Продолжение ст. 20 (тот же стих по-гречески). καταιγίς, ἣν οὐκ ὄψεται ἄνθρωπος — «буря, которой не увидит человек» (καταιγίς — вихрь, буря); τὰ δὲ πλείονα τῶν ἔργων αὐτοῦ ἐν ἀποκρύφοις — «а большее дел Его в сокровенном» (ἀπόκρυφος — скрытый). Слав. 16:21."
  22: "ἔργα δικαιοσύνης τίς ἀναγγελεῖ — «дела правды кто возвестит»; ἢ τίς ὑπομενεῖ — «или кто выдержит»; μακρὰν γὰρ ἡ διαθήκη — «ибо далёк завет» (διαθήκη). Слав. «дела правды его кто возвестит? или кто стерпит? далече бо завет»."
  23: "ἐλαττούμενος καρδίᾳ — «оскудевающий сердцем» (ἐλαττόω — уменьшать, оскудевать); ἀνὴρ ἄφρων καὶ πλανώμενος — «муж безумный и заблуждающийся»; διανοεῖται μωρά — «помышляет глупое» (μωρός). Слав. «Умаляяйся сердцем»."
  24: "Ἄκουσόν μου, τέκνον — «послушай меня, чадо»; μάθε ἐπιστήμην — «научись знанию» (ἐπιστήμη); ἐπὶ τῶν λόγων μου πρόσεχε τῇ καρδίᾳ σου — «к словам моим приложи сердце твоё». Начало учительного раздела (24–30)."
  25: "ἐκφανῶ ἐν σταθμῷ παιδείαν — «явлю в мере наставление» (σταθμός — вес, мера; παιδεία — наставление, воспитание); ἐν ἀκριβείᾳ ἀπαγγελῶ ἐπιστήμην — «с точностью возвещу знание» (ἀκρίβεια — точность). Слав. «изявляю в мериле наказание»."
  26: "Ἐν κρίσει κυρίου τὰ ἔργα αὐτοῦ ἀπ᾿ ἀρχῆς — «в суде Господнем дела Его от начала»; ἀπὸ ποιήσεως αὐτῶν διέστειλεν μερίδας αὐτῶν — «от создания их Он разделил их участи» (μερίς — часть, удел). Слав. «раздели части их»."
  27: "ἐκόσμησεν εἰς αἰῶνα τὰ ἔργα αὐτοῦ — «украсил навек дела Свои» (κοσμέω — украшать, устроять); τὰς ἀρχὰς αὐτῶν εἰς γενεὰς αὐτῶν — «начала их в роды их»; οὔτε ἐπείνασαν οὔτε ἐκοπίασαν — «не взалкали и не утрудились»; οὐκ ἐξέλιπον ἀπὸ τῶν ἔργων αὐτῶν — «не оставили дел своих» (ἐκλείπω — прекращать)."
  28: "ἕκαστος τὸν πλησίον αὐτοῦ οὐκ ἐξέθλιψεν — «каждый ближнего своего не теснил» (ἐκθλίβω — вытеснять, притеснять); ἕως αἰῶνος οὐκ ἀπειθήσουσιν τοῦ ῥήματος αὐτοῦ — «до века не ослушаются слова Его» (ἀπειθέω — не слушаться). Слав. делит 28 на 28–29; по перенумерации принято деление слав."
  29: "Продолжение ст. 28 (тот же стих по-гречески)."
  30: "μετὰ ταῦτα κύριος εἰς τὴν γῆν ἐπέβλεψεν — «после этого Господь воззрел на землю» (ἐπιβλέπω — взирать); ἐνέπλησεν αὐτὴν τῶν ἀγαθῶν αὐτοῦ — «наполнил её благами Своими». Слав. 16:30."
  31: "ψυχῇ παντὸς ζῴου ἐκάλυψεν τὸ πρόσωπον αὐτῆς — «душою всякого животного покрыл лицо её» (ψυχή — душа, жизнь; ζῷον — живое существо); εἰς αὐτὴν ἡ ἀποστροφὴ αὐτῶν — «в неё возвращение их» (ἀποστροφή — возврат). Слав. 16:31; ср. Быт 3:19."
