verses:
  1: "知恵[ちえ]は、世[よ]の最初[さいしょ]に造[つく]られた父[ちち]、ただ独[ひと]りで造られた者[もの]を守[まも]り、彼[かれ]を彼自身[じしん]の罪[つみ]から救[すく]い出[だ]した。"
  2: "また彼[かれ]に、すべてのものを治[おさ]める力[ちから]を与[あた]えた。"
  3: "しかし、不正[ふせい]な者[もの]は知恵[ちえ]から離[はな]れ、自分[じぶん]の怒[いか]りのうちに、兄弟[きょうだい]を殺[ころ]す激情[げきじょう]とともに滅[ほろ]びた。"
  4: "その者[もの]のゆえに、知恵[ちえ]は水[みず]に沈[しず]む地[ち]を再[ふたた]び救[すく]い、粗末[そまつ]な木[き]の一片[いっぺん]によって正[ただ]しい者[もの]を導[みちび]いた。"
  5: "知恵[ちえ]はまた、諸国民[しょこくみん]が悪[あく]の一致[いっち]のうちに混[ま]じ合[あ]ったとき、正[ただ]しい者[もの]を知[し]り、彼[かれ]を神[かみ]の前に咎[とが]められるところのない者として守[まも]り、子[こ]への情[じょう]にあっても彼を強[つよ]く保[たも]った。"
  6: "知恵[ちえ]は、不敬虔[ふけいけん]な者[もの]たちが滅[ほろ]びるとき、正[ただ]しい者[もの]を救[すく]い出[だ]した。彼[かれ]は、五[いつ]つの都[みやこ]の上[うえ]に降[ふ]り注[そそ]いだ火[ひ]から逃[に]げていたのである。"
  7: "その悪[あく]の証[あかし]として、今[いま]なお煙[けむ]り立[た]つ荒[あ]れ地[ち]が残[のこ]り、季節[きせつ]はずれに実[み]を結[むす]ぶ木々[きぎ]があり、不信仰[ふしんこう]な魂[たましい]の記念[きねん]として塩[しお]の柱[はしら]が立っている。"
  8: "彼[かれ]らは知恵[ちえ]を通[とお]り過[す]ぎたので、善[よ]いことを知[し]らないという害[がい]を受[う]けただけでなく、自分[じぶん]の愚[おろ]かさの記念[きねん]を世[よ]に残[のこ]した。それゆえ、彼らが誤[あやま]ったことにおいて、隠[かく]れることさえできなくなった。"
  9: "しかし、知恵[ちえ]は自分[じぶん]に仕[つか]える者[もの]たちを労苦[ろうく]から救[すく]い出[だ]した。"
  10: "知恵[ちえ]は、兄弟[きょうだい]の怒[いか]りから逃[に]げる正[ただ]しい者[もの]を、まっすぐな道[みち]に導[みちび]いた。彼[かれ]に神[かみ]の王国[おうこく]を示[しめ]し、聖[せい]なるものについての知識[ちしき]を与[あた]え、労苦[ろうく]のうちに彼を豊[ゆた]かにし、彼の苦労[くろう]を増[ふ]やした。"
  11: "貪欲[どんよく]な者[もの]たちが彼[かれ]を力[ちから]ずくで押[お]さえようとしたとき、知恵[ちえ]はそばに立[た]って彼を富[とみ]ませた。"
  12: "知恵[ちえ]は彼[かれ]を敵[てき]から守[まも]り、待[ま]ち伏[ぶ]せる者[もの]たちからも安全[あんぜん]に保[たも]った。また彼に激[はげ]しい闘[たたか]いを与[あた]えて、敬虔[けいけん]がすべてのものより強[つよ]いことを知[し]らせた。"
  13: "知恵[ちえ]は、売[う]られた正[ただ]しい者[もの]を見捨[みす]てず、彼[かれ]を罪[つみ]から救[すく]い出[だ]した。"
  14: "知恵[ちえ]は彼[かれ]とともに穴[あな]に下[くだ]り、鎖[くさり]のうちにあっても彼を放[はな]ちなかった。ついには彼に王国[おうこく]の笏[しゃく]と、彼を虐[しいた]げていた者[もの]たちの上[うえ]の権[けん]をもたらした。また、彼を非難[ひなん]した者たちを偽[いつわ]り者と示[しめ]し、彼に永遠[えいえん]の栄光[えいこう]を与えた。"
  15: "知恵[ちえ]は、聖[せい]なる民[たみ]と咎[とが]のない子孫[しそん]を、圧迫[あっぱく]する者[もの]たちの国民[こくみん]から救[すく]い出[だ]した。"
  16: "知恵[ちえ]は主[しゅ]のしもべの魂[たましい]に入[はい]り、恐[おそ]るべき王[おう]たちに、驚[おどろ]くべきわざとしるしとによって立[た]ち向[む]かった。"
  17: "知恵[ちえ]は聖[せい]なる者[もの]たちにその労苦[ろうく]の報[むく]いを返[かえ]し、彼[かれ]らを驚[おどろ]くべき道[みち]に導[みちび]いた。そして昼[ひる]は彼らの覆[おお]いとなり、夜[よる]は星[ほし]の炎[ほのお]となった。"
  18: "知恵[ちえ]は彼[かれ]らを紅海[こうかい]に渡[わた]らせ、多[おお]くの水[みず]の中[なか]を通[とお]らせた。"
  19: "そして彼[かれ]らの敵[てき]を溺[おぼ]れさせ、深[ふか]い淵[ふち]の底[そこ]から彼らを涌[わ]き上[あ]がらせた。"
  20: "それゆえ、正[ただ]しい者[もの]たちは不敬虔[ふけいけん]な者[もの]たちの物[もの]を奪[うば]い、主[しゅ]よ、あなたの聖[せい]なる名[な]を歌[うた]い、あなたの勝利[しょうり]の手[て]を心[こころ]を一[ひと]つにして賛美[さんび]した。"
  21: "知恵[ちえ]が、口[くち]のきけない者[もの]たちの口を開[ひら]き、幼[おさな]い者たちの舌[した]を明瞭[めいりょう]にしたからである。"

notes:
  1: "Αὕτη — «она», т. е. премудрость (σοφία), олицетворённая; по-гречески ж. р., в японском прямо названа 知恵. πρωτόπλαστος — «первосозданный» (Адам); μόνον κτισθέντα — «созданный один», без жены (ср. Быт 2:18). ἐξείλατο … ἐκ παραπτώματος ἰδίου — «изъял его из его собственного падения» (παράπτωμα — падение, прегрешение); слав. «от греха его»."
  2: "ἰσχὺν κρατῆσαι ἁπάντων — «силу властвовать над всем» (κρατέω — держать, владеть; ср. Быт 1:28). Слав. «крепость содержати всяческая». Сказуемого «поставил» нет: власть даётся через премудрость."
  3: "ἀποστὰς … ἄδικος — «отступив, неправедный»: Каин (Быт 4). ἀδελφοκτόνοις … θυμοῖς — «братоубийственными яростями» (θυμός — ярость, страсть); συναπώλετο — «погиб вместе с ними», т. е. погиб в этой ярости."
  4: "δι᾽ ὃν — «из-за него», из-за Каина; κατακλυζομένην γῆν — «заливаемую землю» (потоп). εὐτελοῦς ξύλου — «дешёвого, простого дерева» (ковчег); κυβερνήσασα — «управляя, ведя как кормчий» (κυβερνάω); слав. «малым древом праведника соблюдши»."
  5: "ἐν ὁμονοίᾳ πονηρίας ἐθνῶν συγχυθέντων — «когда народы смешались в единомыслии зла» (Вавилонская башня, Быт 11). ἔγνω τὸν δίκαιον — «познала праведного» (Авраам). ἐπὶ τέκνου σπλάγχνοις — «в чувствах к ребёнку» (σπλάγχνα — внутренности, отсюда «сострадание»); речь об Исааке; слав. «в поболении о чаде крепка соблюде»."
  6: "ἐξαπολλυμένων ἀσεβῶν — «когда погибали нечестивые». καταβάσιον πῦρ Πενταπόλεως — «низвергающийся огонь Пятиградия» (Содом и Гоморра); слав. «от огня низходяща на пять градов» поняло Πενταπόλεως как «на пять городов»; в тексте 五つの都."
  7: "ἧς — «которой» (Πενταπόλεως). χέρσος — «сухая, бесплодная земля». ἀτελέσιν ὥραις — «в несовершенные, неполные времена», т. е. не в свой срок. στήλη ἁλός — «столп соли» (жена Лота, Быт 19:26)."
  8: "παροδεύσαντες — «пройдя мимо» (παροδεύω); ἐβλάβησαν τοῦ μὴ γνῶναι τὰ καλά — «повредились в том, чтобы не знать доброго» (родительный разделения при βλάπτομαι). τῷ βίῳ — «жизни, миру» (слав. «житию»). μηδὲ λαθεῖν δυνηθῶσιν — «не смогли бы даже укрыться»."
  9: "ἐκ πόνων — «от трудов, тягот» (πόνος); слав. «от болезней», jp-joc «諸難» — иное понимание; в тексте 労苦, так как дальше речь о трудах."
  10: "φυγάδα ὀργῆς ἀδελφοῦ — «беглеца от гнева брата» (Иаков, Быт 27:43). τρίβοις εὐθείαις — «прямыми стезями» (τρίβος — тропа). βασιλείαν θεοῦ — «царство Божие» (видение в Вефиле, Быт 28:12–17). γνῶσις ἁγίων — «познание святых» (слав. «разум святых»). εὐπόρησεν ἐν μόχθοις — «обогатил в трудах»; слав. «почте его в трудех» — иное чтение (почтил), в тексте LXX. ἐπλήθυνεν τοὺς πόνους — «умножил труды его»."
  11: "ἐν πλεονεξίᾳ — «в корыстолюбии» (πλεονεξία). κατισχυόντων αὐτόν — «пересиливавших его» (κατισχύω); слав. «во обиде обдержащих его». ἐπλούτισεν — «обогатил» (Лаван, Быт 31)."
  12: "ἠσφαλίσατο — «обезопасил» (ἀσφαλίζω); ἀγῶνα ἰσχυρὸν ἐβράβευσεν — «наградил крепким состязанием» (βραβεύω — присуждать награду, распоряжаться состязанием); слав. «подвиг крепок на победу даде». εὐσέβεια — 敬虔."
  13: "πραθέντα — «проданного» (Иосиф, Быт 37:28). ἐξ ἁμαρτίας — «от греха». Слав. 10:13 добавляет начало гр. 10:14 («сниде с ним в ров»), поэтому граница стихов у csl иная, а счёт совпадает (21)."
  14: "συγκατέβη εἰς λάκκον — «сошёл с ним в яму» (λάκκος — ров, темница). σκῆπτρα βασιλείας — «скипетры царства»; ἐξουσίαν τυραννούντων αὐτοῦ — «власть над тиранившими его». ψευδεῖς … τοὺς μωμησαμένους — «лжецами показал порицавших его» (μωμάομαι — порицать). Слав. 10:14 — остаток гр. 10:14 после перекрытия в csl 10:13."
  15: "λαὸν ὅσιον — «народ преподобный, святой» (ὅσιος); σπέρμα ἄμεμπτον — «семя непорочное». ἐξ ἔθνους θλιβόντων — «из народа угнетающих» (ἔθνος с причастием в значении «люди»)."
  16: "θεράπων κυρίου — «слуга Господень» (Моисей). ἀντέστη βασιλεῦσιν φοβεροῖς — «встал против страшных царей» (фараон). τέρατα καὶ σημεῖα — «знамения и чудеса»."
  17: "μισθὸν κόπων — «плату трудов» (κόπος — труд, усталость). ὁδῷ θαυμαστῇ — «дивным путём». σκέπην ἡμέρας — «покров днём» (облако), φλόγα ἄστρων τὴν νύκτα — «пламя звёзд ночью» (огненный столп)."
  18: "διεβίβασεν … θάλασσαν ἐρυθράν — «провёл через Чермное море» (διαβιβάζω — переводить); διήγαγεν δι᾽ ὕδατος πολλοῦ — «провёл через многие воды»."
  19: "κατέκλυσεν — «потопил» (κατακλύζω). ἐκ βάθους ἀβύσσου — «из глубины бездны» (ἄβυσσος); ἀνέβρασεν — «вскипятил, изверг» (ἀναβράζω); слав. «изрину»."
  20: "ἐσκύλευσαν ἀσεβεῖς — «обобрали нечестивых» (σκυλεύω — снимать доспехи с убитого). ὕμνησαν … τὸ ὄνομα — «воспели имя»; ὑπέρμαχος χείρ — «рука-защитница, поборница» (ὑπέρμαχος), слав. «одолетелница»; в тексте 勝利の手. ὁμοθυμαδόν — «единодушно»."
  21: "ἤνοιξεν στόμα κωφῶν — «отверзла уста немых»; γλώσσας νηπίων ἔθηκεν τρανάς — «языки младенцев сделала ясными» (τρανός — ясный, внятный)."
