# jp-box, Премудрость Соломона, глава 10. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для главы есть фрагментами (10:9, 10, 12) —
# служил контролем чтения, архаизмы не копировались; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 10: премудрость в праотцах и исходе — Адам (1–2), Каин (3), потоп и Ной (4),
# Вавилон и Авраам (5), Содом и Лот (6–8), служащие премудрости (9), Иаков (10–12),
# Иосиф (13–14), Моисей и исход (15–17), Чермное море (18–19), песнь праведных (20–21).
# Прямой речи нет: в 20 обращение «主よ» стоит внутри повествования, без 「…」.
# Нумерация по gr: 21 стих; у csl тоже 21, но граница 10:13/14 иная — csl 10:13 вбирает
# начало гр. 10:14 («сниде с ним в ров»), поэтому счёт совпадает, а стих перекрывается
# (отмечено в notes 13–14). Держимся деления gr.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz. Сносок ⟨…⟩ нет.
# Имена — транслитерация греческого (LXX).

