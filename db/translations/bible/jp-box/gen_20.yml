verses:
  1: "アブラハムはそこを立[た]って、南[みなみ]の地[ち]へ移[うつ]った。彼[かれ]はカデシュとシュルの間[あいだ]に住[す]み、ゲラルで寄留[きりゅう]した。"
  2: "アブラハムは妻[つま]サラについて、「わたしの妹[いもうと]です」と言[い]った。「わたしの妻[つま]です」と言[い]うのを恐[おそ]れたからである。町[まち]の男[おとこ]たちが彼女[かのじょ]のゆえに自分[じぶん]を殺[ころ]さないように、というのである。ゲラルの王[おう]アビメレクは使者[ししゃ]を送[おく]ってサラを連[つ]れて来[こ]させた。"
  3: "神[かみ]は夜[よる]、夢[ゆめ]のうちにアビメレクのところへ来[き]て言[い]われた。「見[み]よ、あなたは、自分[じぶん]が取[と]った女[おんな]のゆえに死[し]ぬ。その女[おんな]には夫[おっと]がいるのだ。」"
  4: "アビメレクはまだ彼女[かのじょ]に触[ふ]れていなかった。彼[かれ]は言[い]った。「主[しゅ]よ、あなたは、何[なに]も知[し]らない正[ただ]しい民[たみ]を滅[ほろ]ぼされるのですか。"
  5: "彼[かれ]自身[じしん]がわたしに『わたしの妹[いもうと]です』と言[い]ったではありませんか。彼女[かのじょ]もわたしに『わたしの兄[あに]です』と言[い]いました。わたしは清[きよ]い心[こころ]と、正[ただ]しい手[て]で、これをしたのです。」"
  6: "神[かみ]は夢[ゆめ]のうちに彼[かれ]に言[い]われた。「わたしもまた、あなたが清[きよ]い心[こころ]でこれをしたことを知[し]っている。わたしはあなたをあわれみ、わたしに対して罪[つみ]を犯[おか]さないようにした。それゆえ、わたしはあなたが彼女[かのじょ]に触[ふ]れることを許[ゆる]さなかったのだ。"
  7: "今[いま]、その女[おんな]を夫[おっと]に返[かえ]しなさい。彼[かれ]は預言者[よげんしゃ]であり、あなたのために祈[いの]る。そうすれば、あなたは生[い]きる。もし返[かえ]さなければ、あなたも、あなたのすべてのものも、必[かなら]ず死[し]ぬことを知[し]りなさい。」"
  8: "アビメレクは朝[あさ]早[はや]く起[お]き、すべてのしもべを呼[よ]び、これらのことばをすべて彼[かれ]らの耳[みみ]に語[かた]った。人々[ひとびと]はひどく恐[おそ]れた。"
  9: "アビメレクはアブラハムを呼[よ]んで言[い]った。「あなたはわたしたちに何[なに]をしたのか。わたしがあなたにどんな罪[つみ]を犯[おか]したというので、わたしとわたしの王国[おうこく]に大[おお]きな罪[つみ]を負[お]わせたのか。誰[だれ]も行[おこな]わないようなことを、あなたはわたしにした。」"
  10: "アビメレクはアブラハムに言[い]った。「何[なに]を見[み]て、これをしたのか。」"
  11: "アブラハムは言[い]った。「わたしは思[おも]ったのです。『この場所[ばしょ]には神[かみ]を畏[おそ]れる心[こころ]がない。そして、人々[ひとびと]はわたしの妻[つま]のゆえに、わたしを殺[ころ]すだろう』と。"
  12: "彼女[かのじょ]は確[たし]かにわたしの妹[いもうと]で、父[ちち]は同[おな]じだが、母[はは]は違[ちが]う。そして、わたしの妻[つま]になったのです。"
  13: "神[かみ]がわたしを父[ちち]の家[いえ]から連[つ]れ出[だ]したとき、わたしは彼女[かのじょ]に言[い]いました。『わたしへの義[ぎ]として、どこへ行[い]っても、わたしについて、わたしの兄[あに]だと言[い]ってください』と。」"
  14: "アビメレクは銀貨[ぎんか]千枚[せんまい]と、羊[ひつじ]と牛[うし]、それに男女[だんじょ]の奴隷[どれい]を取[と]って、アブラハムに与[あた]え、妻[つま]サラを彼[かれ]に返[かえ]した。"
  15: "アビメレクは言[い]った。「見[み]よ、わたしの地[ち]はあなたの前[まえ]にある。どこでも、あなたの好[この]むところに住[す]みなさい。」"
  16: "サラには言[い]った。「見[み]よ、わたしはあなたの兄[あに]に銀貨[ぎんか]千枚[せんまい]を与[あた]えた。これは、あなたと、あなたとともにいるすべての者[もの]のために、あなたの顔[かお]の名誉[めいよ]となる。そして、すべてにおいて真実[しんじつ]でありなさい。」"
  17: "アブラハムが神[かみ]に祈[いの]ると、神[かみ]はアビメレクとその妻[つま]、またその女奴隷[おんなどれい]たちを癒[いや]し、彼女[かのじょ]らは子[こ]を産[う]むようになった。"
  18: "主[しゅ]は、アブラハムの妻[つま]サラのゆえに、アビメレクの家[いえ]のすべての胎[たい]を固[かた]く閉[と]ざしておられたからである。"

notes:
  1: "ἐκίνησεν ἐκεῖθεν — そこを立って (κινέω — «двигать»). εἰς γῆν πρὸς λίβα — 南の地へ (λίψ — «юг»). ἀνὰ μέσον Καδης καὶ ἀνὰ μέσον Σουρ — カデシュとシュルの間に. παρῴκησεν ἐν Γεραροις — ゲラルで寄留した (παροικέω — «жить пришельцем»; Γεραρα — Герар)."
  2: "Ἀδελφή μού ἐστιν — わたしの妹です (ἀδελφή — «сестра»). ἐφοβήθη γὰρ εἰπεῖν — 言うのを恐れたからである. μήποτε ἀποκτείνωσιν — 殺さないように (μήποτε — «как бы не»). ἀπέστειλεν ... καὶ ἔλαβεν — 使者を送って連れて来させた (букв. «послал и взял»)."
  3: "εἰσῆλθεν ὁ θεὸς πρὸς Αβιμελεχ ἐν ὕπνῳ — 神は夢のうちにアビメレクのところへ来た. Ἰδοὺ σὺ ἀποθνῄσκεις — 見よ、あなたは死ぬ (praesens — непреложность). συνῳκηκυῖα ἀνδρί — 夫がいる (συνοικέω — «жить с мужем»)."
  4: "οὐχ ἥψατο αὐτῆς — まだ触れていなかった (ἅπτομαι — «касаться»). ἔθνος ἀγνοοῦν καὶ δίκαιον ἀπολεῖς; — 何も知らない正しい民を滅ぼされるのですか (ἀγνοέω — «не знать»; ἔθνος — «народ»)."
  5: "οὐκ αὐτός μοι εἶπεν — 彼自身がわたしに言ったではないか. ἐν καθαρᾷ καρδίᾳ καὶ ἐν δικαιοσύνῃ χειρῶν — 清い心と正しい手で (δικαιοσύνη χειρῶν — «правота рук»)."
  6: "Κἀγὼ ἔγνων — わたしもまた…知っている (καί + ἐγώ). ἐφεισάμην ἐγώ σου — わたしはあなたを守った (φείδομαι — «щадить»). τοῦ μὴ ἁμαρτεῖν σε εἰς ἐμέ — わたしに対して罪を犯さないように. οὐκ ἀφῆκά σε ἅψασθαι — 触れることを許さなかった (ἀφίημι — «допускать»)."
  7: "ἀπόδος τὴν γυναῖκα — 女を返しなさい (ἀποδίδωμι). προφήτης ἐστίν — 預言者である. προσεύξεται περὶ σοῦ — あなたのために祈る. γνῶθι ὅτι ἀποθανῇ — 死ぬことを知りなさい."
  8: "ὤρθρισεν ... τὸ πρωΐ — 朝早く起きた. ἐλάλησεν ... εἰς τὰ ὦτα αὐτῶν — 彼らの耳に語った (семитский оборот). ἐφοβήθησαν ... σφόδρα — ひどく恐れた."
  9: "Τί τοῦτο ἐποίησας ἡμῖν; — あなたはわたしたちに何をしたのか. μή τι ἡμάρτομεν εἰς σέ; — どんな罪を犯したというのか. ἁμαρτίαν μεγάλην — 大きな罪. ἔργον, ὃ οὐδεὶς ποιήσει — 誰も行わないようなこと."
  10: "Τί ἐνιδὼν ἐποίησας τοῦτο; — 何を見て、これをしたのか (ἐνοράω — «усматривать»; буквально, без сглаживания)."
  11: "Εἶπα γάρ — わたしは思ったのです (букв. «сказал»). Ἄρα οὐκ ἔστιν θεοσέβεια — 神を畏れる心がない (θεοσέβεια — «богобоязненность»). ἐμὲ ... ἀποκτενοῦσιν — わたしを殺すだろう."
  12: "ἀληθῶς ἀδελφή μού ἐστιν ἐκ πατρός — 確かに父を同じくする妹. ἀλλ᾿ οὐκ ἐκ μητρός — 母は違う. ἐγενήθη δέ μοι εἰς γυναῖκα — わたしの妻になった."
  13: "ἐξήγαγέν με ὁ θεὸς ἐκ τοῦ οἴκου τοῦ πατρός μου — 神が父の家から連れ出したとき. Ταύτην τὴν δικαιοσύνην ποιήσεις ἐπ᾿ ἐμέ — わたしへの義として…してください (δικαιοσύνη — «милость, доброе дело»). εἰς πάντα τόπον, οὗ ἐὰν εἰσέλθωμεν — どこへ行っても."
  14: "χίλια δίδραχμα — 銀貨千枚 (δίδραχμον — «двойная драхма»). πρόβατα καὶ μόσχους — 羊と牛. παῖδας καὶ παιδίσκας — 男女の奴隷. ἀπέδωκεν ... Σαρραν — サラを返した."
  15: "ἡ γῆ μου ἐναντίον σου — わたしの地はあなたの前にある. οὗ ἐάν σοι ἀρέσκῃ, κατοίκει — 好むところに住みなさい."
  16: "εἰς τιμὴν τοῦ προσώπου σου — あなたの顔の名誉 (букв. «в честь лица твоего»; евр. здесь — «покрывало для глаз»). πάσαις ταῖς μετὰ σοῦ — ともにいるすべての者のために. πάντα ἀλήθευσον — すべてにおいて真実でありなさい (ἀληθεύω — «говорить истину»)."
  17: "προσηύξατο ... πρὸς τὸν θεόν — 神に祈った. ἰάσατο — 癒した (ἰάομαι). ἔτεκον — 子を産むようになった (букв. «рождали»)."
  18: "συγκλείων συνέκλεισεν — 固く閉ざして (датив усиления при глаголе). πᾶσαν μήτραν — すべての胎 (μήτρα — «матка»). ἕνεκεν Σαρρας — サラのゆえに."
