# jp-box, 1 Маккавейская, глава 15. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; совпадает с gr (41 стих).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: 1–9 грамота Антиоха VII Сидета Симону; 10–14 Антиох против Трифона,
# осада Доры; 15–24 письмо консула Луция к царям и странам (перечень городов);
# 25–36 Антиох отвергает помощь Симона, требует Иоппию, Газару и Акру,
# ответ Симона; 37–41 Трифон бежит в Орфосиаду, Кендевей — стратиг приморья,
# строит Кедрон.
# Голоса: 2–9 (грамота Антиоха), 16–21 (письмо Луция), 28–31 (слова Афиновия),
# 33–35 (ответ Симона) — 「…».
#
tr_code: jp-box
book: 1mak
chapter: 15
draft: true

verses:
  1: "デメトリオス王[おう]の子[こ]アンティオコスは、海[うみ]の島々[しまじま]から、祭司[さいし]シモンと、ユダヤ人[じん]の族長[ぞくちょう]と、すべての民族[みんぞく]に手紙[てがみ]を送[おく]った。"
  2: "それらは次[つぎ]のような内容[ないよう]であった。「王[おう]アンティオコス、大祭司[だいさいし]シモン、族長[ぞくちょう]、およびユダヤ人[じん]の民族[みんぞく]に挨拶[あいさつ]を送[おく]る。"
  3: "われわれの父[ちち]たちの王国[おうこく]を悪[わる]しき者[もの]たちが掌握[しょうあく]したので、われわれは王国[おうこく]を取[と]り戻[もど]し、それを以前[いぜん]のように回復[かいふく]しようと望[のぞ]んでいる。われわれは多[おお]くの軍勢[ぐんぜい]を雇[やと]い、戦船[せんせん]を造[つく]った。"
  4: "われわれはこの地方[ちほう]へ出[で]て行[い]き、われわれの地方[ちほう]を荒[あ]らし、わが王国[おうこく]の多[おお]くの町々[まちまち]を荒廃[こうはい]させた者[もの]たちを罰[ばっ]しようと望[のぞ]んでいる。"
  5: "そこで今[いま]、われわれは、われわれより前[まえ]の王[おう]たちがあなたに与[あた]えたすべての免除[めんじょ]と、その他[ほか]の贈[おく]り物[もの]を確認[かくにん]する。"
  6: "われわれはあなたに、自分[じぶん]の国[くに]で自分[じぶん]の貨幣[かへい]を鋳造[ちゅうぞう]することを許[ゆる]す。"
  7: "エルサレムと聖所[せいしょ]は自由[じゆう]とする。あなたが整[ととの]えたすべての武器[ぶき]と、あなたが建[た]てた要塞[ようさい]は、あなたが支配[しはい]するものとしてあなたのものとする。"
  8: "王[おう]に負[お]うすべての債務[さいむ]、および今[いま]から後[のち]、永遠[えいえん]に王[おう]に生[しょう]じるものは、あなたに免除[めんじょ]される。"
  9: "われわれが自分[じぶん]の王国[おうこく]を掌握[しょうあく]したなら、あなたとあなたの民族[みんぞく]と神殿[しんでん]を大[おお]きな栄光[えいこう]をもって重[おも]んじ、あなたがたの栄光[えいこう]が全地[ぜんち]に明[あき]らかになるようにする。」"
  10: "百七十四年[ひゃくななじゅうよねん]にアンティオコスは父[ちち]たちの地[ち]へ出[で]て行[い]き、すべての軍勢[ぐんぜい]が彼[かれ]のもとに集[あつ]まったので、トリュフォンとともにいる者[もの]は少[すく]なくなった。"
  11: "アンティオコスは彼[かれ]を追[お]い、彼[かれ]は海辺[うみべ]のドラへ逃[に]げて来[き]た。"
  12: "彼[かれ]は、災[わざわ]いが自分[じぶん]に降[ふ]りかかり、軍勢[ぐんぜい]が自分[じぶん]を見捨[みす]てたことを知[し]っていたからである。"
  13: "アンティオコスはドラに陣[じん]を敷[し]き、彼[かれ]とともに十二万人[じゅうにまんにん]の戦[たたか]う者[もの]と八千[はっせん]の騎兵[きへい]がいた。"
  14: "彼[かれ]は町[まち]を包囲[ほうい]し、船[ふね]が海[うみ]から近[ちか]づき、町[まち]を陸[りく]と海[うみ]から苦[くる]しめ、だれも出入[でい]りさせなかった。"
  15: "ローマからヌメニオスとその一行[いっこう]が、王[おう]たちと諸地方[しょちほう]への手紙[てがみ]を持[も]って来[き]た。そこには次[つぎ]のように書[か]かれていた。"
  16: "「ローマの執政官[しっせいかん]ルキウス、王[おう]プトレマイオスに挨拶[あいさつ]を送[おく]る。"
  17: "ユダヤ人[じん]の使節[しせつ]が、われわれの友[とも]また同盟者[どうめいしゃ]として、われわれのもとへ来[き]た。彼[かれ]らは大祭司[だいさいし]シモンとユダヤ人[じん]の民[たみ]から、昔[むかし]からの友情[ゆうじょう]と同盟[どうめい]を新[あら]たにするために送[おく]られた。"
  18: "彼[かれ]らは千[せん]ムナの金[きん]の盾[たて]を持[も]って来[き]た。"
  19: "そこでわれわれは、王[おう]たちと諸地方[しょちほう]に、彼[かれ]らに害[がい]を加[くわ]えず、彼[かれ]らやその町々[まちまち]やその地方[ちほう]と戦[たたか]わず、彼[かれ]らと戦[たたか]う者[もの]たちに味方[みかた]しないよう書[か]くことを喜[よろこ]んだ。"
  20: "われわれは彼[かれ]らから盾[たて]を受[う]け取[と]ることに決[き]めた。"
  21: "そこで、もし悪[わる]しき者[もの]たちが彼[かれ]らの地方[ちほう]からあなたがたのもとへ逃[に]げて来[き]たなら、彼[かれ]らの律法[りっぽう]に従[したが]って罰[ばっ]するため、彼[かれ]らを大祭司[だいさいし]シモンに引[ひ]き渡[わた]せ。」"
  22: "彼[かれ]は同[おな]じことを王[おう]デメトリオスにも、アッタロス、アリアラテス、アルサケスにも書[か]いた。"
  23: "またすべての地方[ちほう]、すなわちサンプサメ、スパルタ人[じん]、デロス、ミンドス、シキオン、カリア、サモス、パンフィリア、リキア、ハリカルナッソス、ロドス、ファセリス、コス、シドン、アラドス、ゴルテュン、クニドス、キプロス、キュレネにも。"
  24: "これらの写[うつ]しは大祭司[だいさいし]シモンに書[か]き送[おく]られた。"
  25: "アンティオコス王[おう]はドラに二度目[にどめ]の陣[じん]を敷[し]き、絶[た]えず手[て]を加[くわ]えて攻[せ]め、兵器[へいき]を造[つく]り、トリュフォンが出入[でい]りするのを封[ふう]じた。"
  26: "シモンは彼[かれ]に、選[えら]ばれた二千人[にせんにん]の者[もの]と、銀[ぎん]、金[きん]、多[おお]くの器[うつわ]を助[たす]けとして送[おく]った。"
  27: "しかし彼[かれ]はそれらを受[う]け取[と]ろうとせず、以前[いぜん]に彼[かれ]と取[と]り決[き]めたすべてを破[やぶ]り、彼[かれ]と疎遠[そえん]になった。"
  28: "彼[かれ]は友[とも]の一人[ひとり]アテノビオスを、次[つぎ]のように言[い]って彼[かれ]と話[はな]し合[あ]わせるために送[おく]った。「あなたがたは、わが王国[おうこく]の町[まち]であるヤッファとガザラとエルサレムのアクラを保持[ほじ]している。"
  29: "あなたがたはその境[さかい]を荒[あ]らし、地[ち]に大[おお]きな害[がい]を加[くわ]え、わが王国[おうこく]の多[おお]くの場所[ばしょ]を支配[しはい]した。"
  30: "今[いま]、あなたがたが取[と]った町々[まちまち]と、ユダヤの境[さかい]の外[そと]で支配[しはい]した場所[ばしょ]の税[ぜい]を引[ひ]き渡[わた]せ。"
  31: "もしそうでなければ、その代[か]わりに銀[ぎん]五百[ごひゃく]タラントと、あなたがたが荒[あ]らした荒廃[こうはい]に対[たい]して、また町々[まちまち]の税[ぜい]としてさらに五百[ごひゃく]タラントを払[はら]え。もしそうでなければ、われわれは来[き]て、あなたがたと戦[たたか]う。」"
  32: "王[おう]の友[とも]アテノビオスはエルサレムへ来[き]て、シモンの栄光[えいこう]と、金[きん]と銀[ぎん]の器[うつわ]のある庫[くら]、十分[じゅうぶん]な従者[じゅうしゃ]の列[れつ]を見[み]て驚[おどろ]き、王[おう]の言葉[ことば]を彼[かれ]に告[つ]げた。"
  33: "シモンは答[こた]えて彼[かれ]に言[い]った。「われわれは他人[たにん]の土地[とち]を取[と]ったことも、他人[たにん]のものを支配[しはい]したこともない。父[ちち]たちの嗣業[しぎょう]である。それは敵[てき]によって、ある時[とき]に不正[ふせい]に奪[うば]われていた。"
  34: "われわれは時[とき]を得[え]て、父[ちち]たちの嗣業[しぎょう]を取[と]り戻[もど]した。"
  35: "あなたが求[もと]めるヤッファとガザラについては、それらは民[たみ]に対[たい]して、またわれわれの地方[ちほう]に対[たい]して大[おお]きな害[がい]を加[くわ]えていた。それらのためにわれわれは百[ひゃく]タラントを払[はら]う。」"
  36: "しかしアテノビオスは一言[ひとこと]も彼[かれ]に答[こた]えず、怒[いか]りをもって王[おう]のもとへ帰[かえ]り、これらの言葉[ことば]とシモンの栄光[えいこう]、および彼[かれ]が見[み]たすべてを王[おう]に告[つ]げた。王[おう]は大[おお]いに怒[いか]った。"
  37: "トリュフォンは船[ふね]に乗[の]ってオルトシアへ逃[に]げた。"
  38: "王[おう]は海岸[かいがん]地方[ちほう]の将軍[しょうぐん]としてケンデバイオスを立[た]て、歩兵[ほへい]と騎兵[きへい]の軍勢[ぐんぜい]を彼[かれ]に与[あた]えた。"
  39: "彼[かれ]にユダヤの前方[ぜんぽう]に陣[じん]を敷[し]くよう命[めい]じ、ケドロンを建[た]て、門[もん]を堅固[けんご]にし、民[たみ]と戦[たたか]うよう命[めい]じた。王[おう]自身[じしん]はトリュフォンを追[お]った。"
  40: "ケンデバイオスはヤムニアに来[き]て、民[たみ]を挑発[ちょうはつ]し、ユダヤに入[はい]り、民[たみ]を捕[と]らえて殺[ころ]し始[はじ]めた。"
  41: "彼[かれ]はケドロンを建[た]て、そこに騎兵[きへい]と軍勢[ぐんぜい]を配置[はいち]し、王[おう]が命[めい]じたとおりに、彼[かれ]らが出[で]てユダヤの道[みち]を行[い]き巡[めぐ]るようにした。"

notes:
  1: "ἐπιστολὰς ἀπὸ τῶν νήσων τῆς θαλάσσης — «письма с островов морских»; ἐθνάρχῃ — «народу-начальнику», 族長."
  2: "περιέχουσαι τὸν τρόπον τοῦτον — «содержащие образ сей»; ἱερεῖ μεγάλῳ — «иерею великому»."
  3: "λοιμοί — «гибельные (злодеи)»; ἐξενολόγησα πλῆθος δυνάμεων — «нанял множество войск»; πλοῖα πολεμικά — 戦船."
  6: "κόμμα ἴδιον, νόμισμα τῇ χώρᾳ σου — «свою чеканку, монету стране твоей»."
  7: "ὧν κρατεῖς — «которыми владеешь»; μενέτω σοι — «да останутся тебе»."
  8: "πᾶν ὀφείλημα βασιλικὸν καὶ τὰ ἐσόμενα βασιλικά — «всякий долг царский и будущие царские (поступления)»."
  10: "174-й год; ὥστε ὀλίγους εἶναι σὺν Τρύφωνι — «так что немногие остались с Трифоном»."
  13: "δώδεκα μυριάδες ἀνδρῶν πολεμιστῶν — 十二万 воинов; ὀκτακισχιλία ἵππος — 八千 конницы."
  15: "τοῖς βασιλεῦσιν καὶ ταῖς χώραις — «царям и странам»; ἐγέγραπτο τάδε — «написано было так»."
  16: "Λεύκιος ὕπατος Ῥωμαίων — «Левкий (Лукий), консул Римский», 執政官."
  17: "ἀνανεούμενοι τὴν ἐξ ἀρχῆς φιλίαν — «возобновляя изначальную дружбу»."
  21: "λοιμοί — «злодеи»; κατὰ τὸν νόμον αὐτῶν — «по закону их»."
  22: "Ἀττάλῳ καὶ Ἀριαράθῃ καὶ Ἀρσάκῃ — アッタロス、アリアラテス、アルサケス (Аттал, Ариарат, Аршак)."
  23: "Перечень городов и областей: Σαμψάμη — サンプサメ; Δῆλος デロス; Μύνδος ミンドス; Σικυών シキオン; Καρία カリア; Σάμος サモス; Παμφυλία パンフィリア; Λυκία リキア; Ἁλικαρνασσός ハリカルナッソス; Φασηλίς ファセリス; Κῶς コス; Σίδη シドン; Ἄραδος アラドス; Γόρτυν ゴルテュン; Κνίδος クニドス; Κυρήνη キュレネ."
  25: "ἐν τῇ δευτέρᾳ — «во второй раз»; συνέκλεισεν τὸν Τρύφωνα τοῦ ἐκπορεύεσθαι — «запер Трифона, чтобы не выходил»."
  28: "Ἀθηνόβιον — アテノビオス; κοινολογησόμενον — «чтобы переговорить»; πόλεις τῆς βασιλείας μου — «города царства моего»."
  31: "πεντακόσια τάλαντα ἀργυρίου — 500 талантов; τῆς καταφθορᾶς, ἧς κατεφθάρκατε — «за опустошение, которое опустошили»."
  32: "κυλικεῖον μετὰ χρυσωμάτων καὶ ἀργυρωμάτων — «чашную (сокровищницу) с золотом и серебром»; ἐξίστατο — «изумился»."
  33: "κληρονομία τῶν πατέρων — «наследие отцов», 嗣業; ἀκρίτως — «без суда, неправедно»."
  35: "Слав. относит «и не отвеща ему афиновий словесе» к концу 35; в LXX это начало 36 — держим LXX, содержание то же (36)."
  37: "Ὀρθωσία — オルトシア."
  38: "Κενδεβαῖος — ケンデバイオス; ἐπιστράτηγον τῆς παραλίας — «военачальника приморья»; πεζικάς καὶ ἱππικάς — 歩兵と騎兵."
  39: "Κεδρων — ケドロン (город-крепость); ὀχυρῶσαι τὰς πύλας — «укрепить ворота»."
  40: "ἐρεθίζειν — «раздражать (вызывать на бой)»; ἐμβατεύειν — «вторгаться»."
  41: "ἐξοδεύωσιν τὰς ὁδοὺς τῆς Ιουδαίας — «проходили (обходили) дороги Иудеи»."
