# jp-box, Псалтирь, псалом 150. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация — славяно-синодальная (csl-ru): в слав. надписание отдельным стихом
# не стоит, поэтому наш стих 0 (надписание) влит в начало стиха 1; дальше номера 1..6.
# Псалом 150: хвала Богу в святилище и в тверди (1–2), хвала на всех инструментах (3–5),
# всякое дыхание да хвалит Господа (6).
# Красного и синего нет. Прямой речи и кавычек нет.
# 〔…〕 нет: всё переведено по gr-lxx-byz.
# セラ (διάψαλμα) в этой главе нет.
# Сносок ⟨…⟩ нет. jp-ni не использовался.

tr_code: jp-box
book: ps
chapter: 150
draft: true

verses:
  1: "アレルヤ。聖所[せいしょ]で神[かみ]をほめたたえよ。その力[ちから]の大空[おおぞら]で神[かみ]をほめたたえよ。"
  2: "その力[ちから]あるわざのゆえに神[かみ]をほめたたえよ。その大[おお]きさの豊[ゆた]かさに応[おう]じて神[かみ]をほめたたえよ。"
  3: "ラッパの響[ひび]きで神[かみ]をほめたたえよ。竪琴[たてごと]と琴[こと]で神[かみ]をほめたたえよ。"
  4: "太鼓[たいこ]と踊[おど]りで神[かみ]をほめたたえよ。弦[げん]と笛[ふえ]で神[かみ]をほめたたえよ。"
  5: "響[ひび]きのよいシンバルで神[かみ]をほめたたえよ。鳴[な]り響[ひび]くシンバルで神[かみ]をほめたたえよ。"
  6: "息[いき]のあるものすべてが主[しゅ]をほめたたえるように。アレルヤ。"

notes:
  1: "Αλληλουια — アレルヤ. Надписание — стих 0 (в csl-ru отдельного стиха нет, влито в ст. 1). Αἰνεῖτε τὸν θεὸν ἐν τοῖς ἁγίοις αὐτοῦ — 聖所で神をほめたたえよ (ἅγιοι — «святые», здесь «святилище», как в слав. «во святых Его»; ср. jp-joc 其聖所). ἐν στερεώματι δυνάμεως αὐτοῦ — その力の大空で (στερέωμα — «твердь»)."
  2: "ἐπὶ ταῖς δυναστείαις αὐτοῦ — その力あるわざのゆえに (δυναστεία — «могущество»). κατὰ τὸ πλῆθος τῆς μεγαλωσύνης αὐτοῦ — その大きさの豊かさに応じて (πλῆθος — «множество»)."
  3: "ἐν ἤχῳ σάλπιγγος — ラッパの響きで (ἦχος — «звук»; σάλπιγξ — ラッパ, как по корпусу). ἐν ψαλτηρίῳ καὶ κιθάρᾳ — 竪琴と琴で (ψαλτήριον — 竪琴; κιθάρα — 琴)."
  4: "ἐν τυμπάνῳ καὶ χορῷ — 太鼓と踊りで (τύμπανον — 太鼓; χορός — «пляска»). ἐν χορδαῖς καὶ ὀργάνῳ — 弦と笛で (χορδή — «струна»; ὄργανον — «инструмент», здесь духовой, как у jp-joc 簫)."
  5: "ἐν κυμβάλοις εὐήχοις — 響きのよいシンバルで (κύμβαλον — シンバル; εὔηχος — «благозвучный»). ἐν κυμβάλοις ἀλαλαγμοῦ — 鳴り響くシンバルで (ἀλαλαγμός — «радостный крик»)."
  6: "πᾶσα πνοὴ αἰνεσάτω τὸν κύριον — 息のあるものすべてが主をほめたたえるように (πνοή — «дыхание»). αλληλουια — アレルヤ (в гр. в конце стиха; у jp-joc опущено, здесь сохранено)."
