verses:
  1: "その時[とき]、ガリラヤ人[じん]たちのことをイエスに告[つ]げる者[もの]たちがいた。ピラトが彼[かれ]らの血[ち]を彼[かれ]らのいけにえに混[ま]ぜたのである。"
  2: "イエスは答[こた]えられた。「<j>このガリラヤ人[じん]たちがこのような苦[くる]しみを受[う]けたからといって、ほかのすべてのガリラヤ人[じん]よりも罪深[つみぶか]い者[もの]だったと、あなたがたは思[おも]うのか。</j>"
  3: "<j>そうではない、あなたがたに言[い]っておく。あなたがたも悔[く]い改[あらた]めないなら、みな同[おな]じように滅[ほろ]びる。</j>"
  4: "<j>また、シロアムの塔[とう]が倒[たお]れて死[し]んだあの十八人[じゅうはちにん]は、エルサレムに住[す]むすべての人[ひと]よりも罪深[つみぶか]い者[もの]だったと、あなたがたは思[おも]うのか。</j>"
  5: "<j>そうではない、あなたがたに言[い]っておく。あなたがたも悔[く]い改[あらた]めないなら、みな等[ひと]しく滅[ほろ]びる。</j>」"
  6: "イエスはこのたとえを語[かた]られた。「<j>ある人[ひと]が、自分[じぶん]のぶどう園[えん]にいちじくの木[き]を植[う]えてあった。実[み]を求[もと]めに来[き]たが、見[み]つからなかった。</j>"
  7: "<j>そこで、園丁[えんてい]に言[い]った。『見[み]よ、わたしがこのいちじくの木[き]に実[み]を求[もと]めに来[き]てからもう三年[さんねん]になるのに、見[み]つからない。切[き]り倒[たお]せ。なぜ土地[とち]を無駄[むだ]に占[し]めておくのか。』</j>"
  8: "<j>園丁[えんてい]は答[こた]えて言[い]った。『ご主人[しゅじん]さま、今年[ことし]もこの木[き]をそのままにしておいてください。わたしがその周[まわ]りを掘[ほ]り返して肥料[ひりょう]をやるまで、</j>"
  9: "<j>もし実[み]を結[むす]べば、それでよいのです。結[むす]ばなければ、切[き]り倒[たお]してください。』</j>」"
  10: "安息日[あんそくび]に、イエスは会堂[かいどう]の一[ひと]つで教[おし]えておられた。"
  11: "すると、十八年[じゅうはちねん]のあいだ病[やまい]の霊[れい]につかれた女[おんな]がいた。体[からだ]をかがめて、少[すこ]しも伸[の]ばすことができなかった。"
  12: "イエスは彼女[かのじょ]をご覧[らん]になると、お呼[よ]びになって言[い]われた。「<j>女[おんな]よ、あなたはその病気[びょうき]から解[と]かれた。</j>」"
  13: "イエスは彼女[かのじょ]に手[て]を置[お]かれた。すると彼女[かのじょ]はただちに体[からだ]を伸[の]ばし、神[かみ]をほめたたえた。"
  14: "会堂長[かいどうちょう]は、イエスが安息日[あんそくび]に癒[いや]されたことに腹[はら]を立[た]てて、群衆[ぐんしゅう]に言[い]った。「仕事[しごと]をすべき日[ひ]は六日[むいか]ある。だから、その間[あいだ]に来[き]て癒[いや]されるがよい。安息日[あんそくび]にしてはならない。」"
  15: "主[しゅ]は答[こた]えて言[い]われた。「<j>偽善者[ぎぜんしゃ]たちよ。あなたがたはそれぞれ、安息日[あんそくび]にも自分の牛[うし]やろばを飼[か]い葉[ば]おけから解[と]いて引[ひ]き出[だ]し、水[みず]を飲[の]ませるではないか。</j>"
  16: "<j>この女[おんな]はアブラハムの娘[むすめ]であり、見[み]よ、サタンが十八年[じゅうはちねん]のあいだ縛[しば]ってきた者[もの]ではないか。安息日[あんそくび]だからといって、この束縛[そくばく]から解[と]いてやるべきではなかったのか。</j>」"
  17: "こう言[い]われたので、イエスに敵対[てきたい]する者[もの]たちはみな恥[は]じ入[い]り、群衆[ぐんしゅう]は、イエスがなさるすべてのすばらしい業[わざ]を喜[よろこ]んだ。"
  18: "そこで、イエスは語[かた]られた。「<j>神[かみ]の国[くに]を、何[なに]に似[に]たものと言[い]えばよいだろうか。何[なに]にたとえようか。</j>"
  19: "<j>からし種[だね]に似[に]ている。人[ひと]がそれを取[と]って自分[じぶん]の庭[にわ]に蒔[ま]くと、育[そだ]って大[おお]きな木[き]となり、空[そら]の鳥[とり]がその枝[えだ]に巣[す]を作[つく]った。</j>」"
  20: "また言[い]われた。「<j>神[かみ]の国[くに]を何[なに]にたとえようか。</j>"
  21: "<j>パン種[だね]に似[に]ている。女[おんな]がそれを取[と]って、三[さん]サトンの粉[こな]に混[ま]ぜ込[こ]むと、すべてが膨[ふく]れ上[あ]がるまでになった。</j>」"
  22: "イエスは町々[まちまち]や村々[むらむら]を通[とお]って教[おし]えながら、エルサレムへ向[む]かって進[すす]んでおられた。"
  23: "ある人[ひと]がイエスに言[い]った。「主[しゅ]よ、救[すく]われる者[もの]は少[すく]ないのでしょうか。」"
  24: "イエスは彼[かれ]らに言[い]われた。「<j>力[ちから]を尽[つ]くして、狭[せま]い門[もん]から入[はい]るように努[つと]めなさい。あなたがたに言[い]っておくが、多[おお]くの者[もの]が入[はい]ろうとしても、入[はい]ることができないからである。</j>"
  25: "<j>家主[やぬし]が立[た]って戸[と]を閉[と]ざしてしまうと、あなたがたは外[そと]に立[た]って戸[と]をたたき、『主[しゅ]よ、〔主[しゅ]よ、〕開[あ]けてください』と言[い]い始[はじ]める。すると、家主[やぬし]は答[こた]えて、『わたしはあなたがたがどこから来[き]たのか知[し]らない』と言[い]うであろう。</j>"
  26: "<j>そのとき、あなたがたは言[い]い始[はじ]める。『わたしたちはあなたの前[まえ]で食[た]べ、飲[の]みました。あなたはわたしたちの大通[おおどお]りで教[おし]えてくださいました。』</j>"
  27: "<j>しかし、家主[やぬし]は言[い]うであろう。『あなたがたに言[い]っておく。わたしはあなたがたがどこから来[き]たのか知[し]らない。不正[ふせい]を働[はたら]く者[もの]たちよ、みなわたしから離[はな]れ去[さ]れ。』</j>"
  28: "<j>あなたがたが、アブラハム、イサク、ヤコブ、そしてすべての預言者[よげんしゃ]たちが神[かみ]の国[くに]にいるのを、また、自分[じぶん]たちが外[そと]へ追[お]い出[だ]されているのを見[み]るとき、そこでは泣[な]きわめきと歯[は]ぎしりとがある。</j>"
  29: "<j>人々[ひとびと]は東[ひがし]からも西[にし]からも、北[きた]からも南[みなみ]からも来[き]て、神[かみ]の国[くに]で席[せき]に着[つ]く。</j>"
  30: "<j>見[み]よ、後[あと]の者[もの]で先[さき]になる者[もの]があり、先[さき]の者[もの]で後[あと]になる者[もの]がいる。</j>」"
  31: "そのとき、ファリサイ派[は]の人[ひと]たちが数人[すうにん]、近[ちか]づいて来[き]て言[い]った。「ここを出[で]て、ほかへ行[い]きなさい。ヘロデがあなたを殺[ころ]そうとしているからだ。」"
  32: "イエスは彼[かれ]らに言[い]われた。「<j>行[い]って、あの狐[きつね]にこう告[つ]げよ。『見[み]よ、わたしは今日[きょう]も明日[あす]も悪霊[あくりょう]を追[お]い出[だ]し、癒[いや]しを行[おこな]い、三日目[みっかめ]に全[まっと]うされる。』</j>"
  33: "<j>だが、わたしは今日[きょう]も明日[あす]も、その次[つぎ]の日[ひ]も旅[たび]を続[つづ]けなければならない。預言者[よげんしゃ]がエルサレムの外[そと]で滅[ほろ]びることはありえないからである。</j>"
  34: "<j>エルサレムよ、エルサレムよ。預言者[よげんしゃ]たちを殺[ころ]し、あなたのもとへ遣[つか]わされた者[もの]たちを石[いし]で打[う]ち殺[ころ]す都[みやこ]よ。何度[なんど]、わたしはめんどりがそのひなを翼[つばさ]の下[した]に集[あつ]めるように、あなたの子[こ]らを集[あつ]めようとしたことか。しかし、あなたがたは望[のぞ]まなかった。</j>"
  35: "<j>見[み]よ、あなたがたの家[いえ]は〔荒[あ]れ果[は]てて〕あなたがたに残[のこ]される。はっきり言[い]っておく。『主[しゅ]の名[な]によって来[こ]られる方[かた]は祝福[しゅくふく]される』と言[い]う時[とき]が来[く]るまで、あなたがたは決[けっ]してわたしを見[み]ることはない。</j>」"

notes:
  1: "Παρῆσαν… ἀπαγγέλλοντες — «были, сообщая»; передал 告げる者たちがいた. ὧν τὸ αἷμα Πιλᾶτος ἔμιξεν μετὰ τῶν θυσιῶν αὐτῶν — «кровь которых Пилат смешал с жертвами их»; いけにえ = θυσίαι."
  2: "δοκεῖτε ὅτι… ἐγένοντο — «думаете ли, что… стали»; 罪深い者だった…と思うのか. ὅτι ταῦτα πεπόνθασιν — «потому что претерпели это»; このような苦しみを受けたからといって."
  3: "ὁμοίως — 同じように."
  4: "ὁ πύργος ἐν τῷ Σιλωάμ — «башня в Силоаме»; シロアムの塔. ἐφ᾿ οὓς ἔπεσεν… καὶ ἀπέκτεινεν — «на которых упала и убила их»; 倒れて死んだ."
  5: "ὡσαύτως — 等しく (в 3 ὁμοίως — 同じように), чтобы не повторять дословно."
  6: "πεφυτευμένην — perfect passive, «посажена»; 植えてあった."
  7: "ἀφ᾿ οὗ ἔρχομαι — «с тех пор как прихожу» (praesens); 来てから三年になる. ἔκκοψον [οὖν] — «сруби»; οὖν в критическом под скобками, у jp-joc без «итак» — 切り倒せ. ἱνατί καὶ τὴν γῆν καταργεῖ — «зачем и землю делает бесполезной»; なぜ土地を無駄に占めておくのか."
  8: "Κύριε — обращение к хозяину, ご主人さま. ἄφες… καὶ τοῦτο τὸ ἔτος — «оставь и этот год»; 今年もこの木をそのままに."
  9: "εἰς τὸ μέλλον — «на будущее» (то есть на следующий год); передал 来年. ἐκκόψεις — будущее, «срубишь»; 切り倒してください."
  10: "Ἦν δὲ διδάσκων — перифраза; 教えておられた."
  11: "πνεῦμα ἀσθενείας — «дух немощи»; 病の霊. συγκύπτουσα… ἀνακύψαι εἰς τὸ παντελές — «согбенная… совсем не могла выпрямиться»; 体をかがめて、少しも伸ばすことができなかった."
  12: "Γύναι — 女よ. ἀπολέλυσαι — perfect passive, «освобождена»; 解かれた."
  13: "ἀνωρθώθη — «выпрямилась»; 体を伸ばし."
  14: "ἀρχισυνάγωγος — 会堂長. θεραπεύεσθε — императив; 癒されるがよい."
  15: "ὑποκριταί — 偽善者たちよ (мн. ч.). φάτνη — 飼い葉おけ. λύει… ἀπαγαγὼν ποτίζει — «отвязывает и, отведя, поит»; 解いて引き出し、水を飲ませる."
  16: "θυγατέρα Ἀβραάμ — アブラハムの娘. ἰδού — 見よ. λυθῆναι ἀπὸ τοῦ δεσμοῦ τούτου — «разрешиться от этой связи»; この束縛から解いてやる."
  17: "κατῃσχύνοντο — имперфект, «стыдились»; 恥じ入り. ἐνδόξοις — «славных»; すばらしい業."
  18: "Ἔλεγεν οὖν — そこで…言われた."
  19: "εἰς κῆπον ἑαυτοῦ — «в свой сад»; 自分の庭. κατεσκήνωσεν — «поселились, свили гнёзда»; 巣を作った."
  20: "Повтор вопроса — как в греческом; два стиха не слиты."
  21: "σάτα τρία — три саты; сноска уже стоит в Мф 13:33, здесь не повторяется."
  22: "διεπορεύετο… πορείαν ποιούμενος — «проходил… совершая путь»; 通りながら…進んでおられた."
  23: "Вопрос человека — не красным (прямая речь вне притчи). εἰ ὀλίγοι οἱ σῳζόμενοι — «спасаемых мало ли»; 救われる者は少ないのでしょうか."
  24: "Ἀγωνίζεσθε — «подвизайтесь»; 力を尽くして…努めなさい, без смягчения. οὐκ ἰσχύσουσιν — «не будут в силах»; 入ることができない."
  25: "οἰκοδεσπότης — 家主. В критическом тексте одно κύριε, у jp-joc и Елизаветинской «Господи, Господи» (TR κύριε κύριε) — второе в 〔〕."
  26: "πλατεῖαι — «улицы, площади»; 大通り."
  27: "ἐργάται ἀδικίας — «делатели неправды»; 不正を働く者たち. ὑμᾶς в критическом в квадратных скобках — включено без 〔〕."
  28: "κλαυθμός… βρυγμός — 泣きわめきと歯ぎしり. ὑμᾶς δὲ ἐκβαλλομένους ἔξω — «вас же изгоняемых вон»; 自分たちが外へ追い出されているのを."
  29: "ἀπὸ ἀνατολῶν καὶ δυσμῶν… — 東からも西からも…; ἀνακλιθήσονται — «возлягут»; 席に着く."
  30: "ἔσχατοι… πρῶτοι — 後の者…先の者; оба оборота сохранены."
  31: "Слова фарисеев — не красным. Ἐν αὐτῇ τῇ ὥρᾳ — そのとき."
  32: "ἀλώπεκι — 狐; «той лисице» — あの狐. ἰάσεις ἀποτελῶ — «совершаю исцеления»; 癒しを成し遂げ. τελειοῦμαι — «совершаюсь» (pass.); 全うされる."
  33: "τῇ ἐχομένῃ — «в следующий [день]»; その次の日. οὐκ ἐνδέχεται — «не бывает»; ありえない."
  34: "ποσάκις ἠθέλησα — «сколько раз Я хотел»; 何度…としたことか. ὄρνις — めんどり; νοσσιά — ひな."
  35: "ἀφίεται — «оставляется»; 残される. ἔρημος «пуст» у TR/Елизаветинской/jp-joc, в критическом нет — 〔荒れ果てて〕. ἀμὴν λέγω ὑμῖν у TR/Елизаветинской, в критическом λέγω [δὲ] ὑμῖν; передано обычной формулой はっきり言っておく (ср. Мф 25:12), без 〔〕: это усилительная формула, а не смысловая добавка. Цитата Пс 117:26 — в 『』."
