verses:
  1: "シバの女王[じょおう]は、ソロモンの名[な]と主[しゅ]の名とを聞[き]いて、なぞによって彼[かれ]を試[ため]すために来[き]た。"
  2: "彼女[かのじょ]は非常[ひじょう]に大[おお]きな勢力[せいりょく]を伴[ともな]ってエルサレムに来[き]た。らくだは香[こう]と、非常に多[おお]くの金[きん]と、貴[とうと]い石[いし]を載[の]せていた。彼女はソロモンのもとに入[はい]り、自分[じぶん]の心[こころ]にあるすべてのことを彼[かれ]に語[かた]った。"
  3: "ソロモンは彼女[かのじょ]のすべての言葉[ことば]に答[こた]えた。王[おう]のもとで軽[かろ]んじられた言葉はなく、彼女に告[つ]げなかったものはなかった。"
  4: "シバの女王[じょおう]はソロモンのすべての知恵[ちえ]と、彼[かれ]が建[た]てた家[いえ]を見[み]た。"
  5: "また、ソロモンの食卓[しょくたく]の食物[しょくもつ]、その僕[しもべ]たちの座[ざ]、その奉仕者[ほうししゃ]たちの立[た]ち居[い]振[ふ]る舞[まい]、その衣装[いしょう]、その酌人[くみびと]たち、そして彼が主[しゅ]の家[いえ]で献[ささ]げる燔祭[はんさい]を見[み]て、彼女[かのじょ]は我[われ]を忘[わす]れた。"
  6: "彼女は言[い]った。「わたしが自分[じぶん]の国[くに]で、あなたの言葉[ことば]とあなたの知恵[ちえ]について聞[き]いたことは、真実[しんじつ]だった。"
  7: "しかし、わたしに語[かた]る者[もの]たちを、ここに来[き]てこの目[め]で見[み]るまで、わたしは信[しん]じなかった。そして、見なさい、わたしに告[つ]げられたことの半分[はんぶん]もなかった。あなたは知恵[ちえ]と良[よ]いものを、わたしが国[くに]で聞[き]いたすべての噂[うわさ]に加[くわ]えて増[ま]しておられる。"
  8: "幸[しあわ]せなのは、あなたの妻[つま]たちだ。幸せなのは、いつもあなたの前[まえ]に立[た]って、あなたのすべての知恵[ちえ]を聞[き]いているこれらの僕[しもべ]たちだ。"
  9: "あなたの神[かみ]である主[しゅ]がほめたたえられますように。主はあなたを喜[よろこ]んでイスラエルの王座[おうざ]に着[つ]かせ、永遠[えいえん]にイスラエルを立[た]たせるためにイスラエルを愛[あい]して、あなたを彼[かれ]らの上[うえ]に王[おう]とし、義[ぎ]によって、また彼らの裁[さば]きにおいて裁きを行[おこな]わせるようにされたのだ。」"
  10: "彼女[かのじょ]はソロモンに金[きん]百二十[ひゃくにじゅう]タラントと、非常[ひじょう]に多[おお]くの香[こう]と、貴[とうと]い石[いし]を贈[おく]った。シバの女王[じょおう]がソロモン王[おう]に贈ったほどの量[りょう]の香は、もう二度[にど]と来[こ]なかった。"
  11: "また、オフィルから金[きん]を運[はこ]ぶヒラムの船[ふね]は、非常[ひじょう]に多[おお]くの削[けず]った木[き]と貴[とうと]い石[いし]を運んできた。"
  12: "王[おう]はその削[けず]った木[き]で、主[しゅ]の家[いえ]と王の家の支柱[しちゅう]を造[つく]り、また歌[うた]い手[て]たちのために竪琴[たてごと]と琴[こと]を造った。このような木は地[ち]の上[うえ]に来[き]たことがなく、今日[こんにち]に至[いた]るまでどこにも見[み]られなかった。"
  13: "ソロモン王[おう]は、シバの女王[じょおう]が望[のぞ]んだすべてのもの、求[もと]めたすべてのものを、すでに自分[じぶん]の手[て]で彼女[かのじょ]に与[あた]えていたすべてのもののほかに、さらに与えた。彼女は自分[じぶん]の国[くに]へ帰[かえ]って行[い]った。彼女も、その僕[しもべ]たちもすべて。"
  14: "ソロモンのところに一年[いちねん]に来[き]た金[きん]の重[おも]さは、金六百六十六[ろっぴゃくろくじゅうろく]タラントであった。"
  15: "これは、服属[ふくぞく]する者[もの]たちの貢[みつ]ぎ、商人[しょうにん]たち、向[む]こう側[がわ]のすべての王[おう]たち、またその地[ち]の太守[たいしゅ]たちからのもののほかであった。"
  16: "ソロモンは金[きん]を打[う]ち延[の]ばして三百[さんびゃく]の槍[やり]を造[つく]った。一[ひと]つの槍には三百の金が用[もち]いられた。"
  17: "また、金[きん]を打[う]ち延[の]ばして三百[さんびゃく]の盾[たて]を造[つく]った。一[ひと]つの盾には三[みっ]つのミナの金が用[もち]いられた。王[おう]はそれらをレバノンの森[もり]の家[いえ]に置[お]いた。"
  18: "王[おう]は象牙[ぞうげ]の大[おお]きな王座[おうざ]を造[つく]り、純金[じゅんきん]でそれを覆[おお]った。"
  19: "王座[おうざ]には六[むっ]つの段[だん]があり、王座の後[うし]ろには子牛[こうし]の頭[あたま]の像[ぞう]があり、王座の背部[はいぶ]は丸[まる]かった。座[ざ]の場所[ばしょ]の両側[りょうがわ]には肘掛[ひじか]けがあり、その肘掛けのそばに二頭[にとう]の獅子[しし]が立[た]っていた。"
  20: "また、六[むっ]つの段[だん]の上[うえ]に、こちら側[がわ]とあちら側に十二頭[じゅうにとう]の獅子[しし]が立[た]っていた。このようなものはどの王国[おうこく]にもなかった。"
  21: "ソロモンの飲[の]み物[もの]の器[うつわ]はすべて金[きん]であり、洗[あら]い盤[ばん]も金であった。レバノンの森[もり]の家[いえ]の器はすべて金で閉[と]じられていた。銀[ぎん]はなかった。ソロモンの日[ひ]には銀は数[かぞ]えられなかったからである。"
  22: "王[おう]には、ヒラムの船[ふね]とともに海[うみ]に出[で]るタルシシュの船があった。三年[さんねん]に一度[いちど]、タルシシュの船が王のもとに来[き]て、金[きん]と銀[ぎん]、象牙[ぞうげ]、猿[さる]、孔雀[くじゃく]、そして細工[さいく]した石[いし]と削[けず]った石を運[はこ]んできた。"
  23: "ソロモンは富[とみ]と知恵[ちえ]において、地[ち]のすべての王[おう]たちをしのいで大[おお]きくなった。"
  24: "地[ち]のすべての王[おう]たちは、ソロモンの顔[かお]を見[み]、主[しゅ]が彼[かれ]の心[こころ]に与[あた]えた知恵[ちえ]を聞[き]こうとして、彼を求[もと]めた。"
  25: "彼[かれ]らはそれぞれ、金[きん]の器[うつわ]と銀[ぎん]の器、衣[ころも]、没薬[もつやく]の香油[こうゆ]と香[こう]、馬[うま]と騾馬[らば]を、年[とし]ごとに贈[おく]り物[もの]として持[も]って来[き]た。"
  26: "ソロモンは戦車[せんしゃ]と馬[うま]を集[あつ]め、四万[よんまん]の牝馬[ひんば]を戦車に、一万二千[いちまんにせん]の騎兵[きへい]を所有[しょゆう]していた。彼はそれらを戦車の町々[まちまち]に、また王[おう]とともにエルサレムに置[お]いた。彼は川[かわ]からペリシテ人[じん]の地[ち]、エジプトの境[さかい]に至[いた]るまでのすべての王たちを支配[しはい]していた。"
  27: "王[おう]はエルサレムで金[きん]と銀[ぎん]を石[いし]のように、杉[すぎ]の木[き]を低地[ていち]にあるいちじく桑[ぐわ]のように、多[おお]くした。"
  28: "ソロモンの馬[うま]の供給[きょうきゅう]はエジプトとテコエからであった。王[おう]の商人[しょうにん]たちはテコエで代価[だいか]と引[ひ]き換[か]えにそれを受[う]け取[と]った。"
  29: "エジプトから上[のぼ]って来[く]るものは、戦車[せんしゃ]一[ひと]台[だい]につき銀[ぎん]六百[ろっぴゃく]、馬[うま]一頭[いっとう]につき銀百五十[ひゃくごじゅう]であった。同じように彼らは、海沿[うみぞ]いのヘト人[じん]のすべての王[おう]たちとシリアの王たちにも、それを輸出[ゆしゅつ]した。"

notes:
  1: "βασίλισσα Σαβα — царица Савская (Σαβα, シバ; слав. «савска»). ἤκουσεν τὸ ὄνομα Σαλωμων καὶ τὸ ὄνομα κυρίου — услышала имя Соломона и имя Господне; в ru «о славе Соломона во имя Господа» — масоретское чтение. πειράσαι αὐτὸν ἐν αἰνίγμασιν — испытать его загадками (πειράζω, αἴνιγμα), なぞ."
  2: "δυνάμει βαρείᾳ σφόδρα — с весьма тяжкой силой, т. е. с большой свитой (δύναμις, βαρύς). κάμηλοι αἴρουσαι — верблюды, несущие (αἴρω). ἡδύσματα — благовония, пряности (ἡδύσμα), 香. λίθος τίμιος — драгоценный камень. ὅσα ἦν ἐν τῇ καρδίᾳ αὐτῆς — всё, что было у неё на сердце."
  3: "ἀπήγγειλεν — возвестил, изъяснил (ἀπαγγέλλω). οὐκ ἦν λόγος παρεωραμένος παρὰ τοῦ βασιλέως — не было слова, оставленного без внимания у царя (παροράω, παρεωραμένος), т. е. царь ответил на всё."
  4: "φρόνησις — разум, мудрость (φρόνησις), 知恵. οἶκος, ὃν ᾠκοδόμησεν — дом, который он построил (дворец, ср. 7:1–12)."
  5: "βρῶμα — яство (βρῶμα). καθέδρα παίδων — сидение, места слуг (καθέδρα). στάσις λειτουργῶν — предстояние служителей (στάσις, λειτουργός). οἰνοχόοι — виночерпии (οἰνοχόος). ὁλοκαύτωσις — всесожжение (ὁλοκαύτωσις), 燔祭. ἐξ ἑαυτῆς ἐγένετο — «вышла из себя», была вне себя от изумления (слав. «вне себе бысть»), 我を忘れた."
  6: "Ἀληθινὸς ὁ λόγος — истинно слово (ἀληθινός). περὶ τοῦ λόγου σου καὶ περὶ τῆς φρονήσεώς σου — о слове твоём и о мудрости твоей; в csl эта часть отнесена к ст. 7 («о словесех твоих и о смысле твоем»)."
  7: "οὐκ ἐπίστευσα τοῖς λαλοῦσίν μοι — не поверила говорившим мне. ἕως ὅτου παρεγενόμην — доколе не пришла (παραγίνομαι). οὐκ ἔστιν τὸ ἥμισυ — нет и половины. προστέθεικας ἀγαθὰ πρὸς αὐτά — приложил блага к ним (προστίθημι); в csl добавлено «премудрость и» — в LXX нет. ἐπὶ πᾶσαν τὴν ἀκοήν — сверх всякого слуха, т. е. больше молвы (ἀκοή)."
  8: "μακάριαι αἱ γυναῖκές σου — блаженны жёны твои (γυνή); в ru «блаженны люди твои» — масоретское чтение. οἱ παρεστηκότες ἐνώπιόν σου δι᾿ ὅλου — всегда предстоящие пред тобою (παρίστημι, δι᾿ ὅλου)."
  9: "γένοιτο … εὐλογημένος — да будет благословен (оптатив γίνομαι). ἠθέλησεν ἐν σοί — благоволил о тебе. στῆσαι εἰς τὸν αἰῶνα — утвердить навек (ἵστημι). ἔθετό σε βασιλέα — поставил тебя царём. ποιεῖν κρίμα ἐν δικαιοσύνῃ καὶ ἐν κρίμασιν αὐτῶν — творить суд в правде и в судах их (κρίμα, δικαιοσύνη); слав. «в судбах их»."
  10: "ἑκατὸν εἴκοσι τάλαντα — 120 талантов (τάλαντον, タラント). ἡδύσματα πολλά — много благовоний. οὐκ ἐληλύθει … ἔτι εἰς πλῆθος — не приходило уже в таком множестве (πλῆθος), т. е. никогда больше не привозили столько."
  11: "ναῦς Χιραμ — корабль Хирама (ναῦς; слав. «корабль хирамль»). ξύλα ἀπελέκητα — обтёсанные дерева (ἀπελέκητος); слав. «древа нетесана», ru «красное дерево» — иное (МТ). Σουφιρ — Офир (слав. «софира»). Весь стих в критическом издании стоит в квадратных скобках как дублет 9:26–28, но в базе сайта он есть — 〔…〕 не ставятся."
  12: "ὑποστηρίγματα — подпоры, опоры (ὑποστήριγμα). νάβλα καὶ κινύρα — набла и кинира, струнные (слав. «сопели и гусли»), 竪琴, 琴. ᾠδοί — певцы (ᾠδός). Стих тоже в квадратных скобках (дублет), в базе есть — без 〔…〕."
  13: "πάντα ὅσα ἠθέλησεν, ὅσα ᾐτήσατο — всё, что пожелала и попросила (αἰτέω). ἐκτὸς πάντων, ὧν δεδώκει — сверх всего, что уже дал (ἐκτός). διὰ χειρὸς τοῦ βασιλέως — рукою царя (слав. «рукама своима»). ἀπεστράφη — возвратилась (ἀποστρέφω)."
  14: "σταθμός — вес (σταθμός). ἑξακόσια καὶ ἑξήκοντα ἓξ τάλαντα — 666 талантов. ἐν ἐνιαυτῷ ἑνί — в один год, т. е. ежегодно."
  15: "χωρὶς τῶν φόρων — кроме податей (φόρος). οἱ ὑποτεταγμένοι — подвластные (ὑποτάσσω). ἔμποροι — торговцы. βασιλεῖς τοῦ πέραν — цари заречные. σατράπαι — сатрапы (σατράπης), 太守."
  16: "δόρατα χρυσᾶ ἐλατά — золотые кованые копья (δόρυ, ἐλατός). τριακόσιοι χρυσοῖ ἐπῆσαν ἐπὶ τὸ δόρυ — триста золотых на каждое копьё. В ru здесь 200 больших щитов по 600 сиклей — иное чтение (МТ); в LXX и csl — копья."
  17: "ὅπλα — щиты (ὅπλον). τρεῖς μναῖ — три мины (μνᾶ), ミナ. οἶκος δρυμοῦ τοῦ Λιβάνου — дом Ливанского леса (слав. «храм дубравы ливанския»), レバノンの森の家."
  18: "θρόνος ἐλεφάντινος — престол из слоновой кости (ἐλεφάντινος), 象牙. χρυσίον δόκιμον — золото испытанное, чистое (δόκιμος)."
  19: "ἀναβαθμοί — ступени (ἀναβαθμός). προτομαὶ μόσχων — изображения передней части (голов) тельцов (προτομή, μόσχος). χεῖρες — ручки, локотники. В csl добавлено «и верх престола кругл бе созади его» — нет в LXX (МТ), внесено по паритету."
  20: "ἔνθεν καὶ ἔνθεν — с той и другой стороны. οὐ γέγονεν οὕτως πάσῃ βασιλείᾳ — не было так ни в одном царстве."
  21: "σκεύη τοῦ πότου — сосуды для питья (πότος). λουτῆρες — умывальницы, тазы (λουτήρ), 洗い盤. συγκεκλεισμένα χρυσίῳ — заключённые, обложенные золотом (συγκλείω). οὐκ ἦν λογιζόμενον — не считалось (λογίζομαι)."
  22: "ναῦς Θαρσις — фарсисский (тарсийский) корабль (Θαρσις, タルシシュ). μία διὰ τριῶν ἐτῶν — раз в три года. λίθων τορευτῶν καὶ πελεκητῶν — камней резных и тёсаных (τορευτός, πελεκητός). «Зубы слоновы, пифики и павы» (слоновая кость, обезьяны, павлины) — в csl (МТ), в LXX нет, внесено по паритету. После слов о камнях в базе стоит помета «22a»: в этот стих влит отдел о постройках Соломона (храм, дом царя, стена Иерусалима, Милло, Ассур, Магедон, Газер, Беф-Орон, Иефермаф, города колесниц и коней); в csl он стоит в 9:15–19, поэтому здесь не повторён, помета не переводится."
  23: "ἐμεγαλύνθη … πλούτῳ καὶ φρονήσει — возвеличился богатством и разумом (μεγαλύνω). В gr-lxx-byz на месте этого стиха — перечень оставшихся народов (хеттеи, аморреи, ферезеи, хананеи, евеи, иевусеи, гергесеи), обложенных данью; в csl он в 9:20–21, здесь не повторён. У слав. стихи 23–24 влиты внутрь греч. ст. 24 (пометы «23», «24»)."
  24: "ἐζήτουν τὸ πρόσωπον Σαλωμων — искали лица Соломона, т. е. стремились видеть его (ζητέω). ἧς ἔδωκεν κύριος ἐν τῇ καρδίᾳ αὐτοῦ — которую дал Господь в сердце его; в ru «вложил Бог». В гр. стих включает ещё «из сынов Израиля Соломон не сделал работниками…» (слав. 9:22) и внутри помету «23» (слав. 10:23) — не повторены."
  25: "σκεύη χρυσᾶ — золотые сосуды; в csl добавлено «и сребряны» — в LXX нет, внесено по паритету. στακτή — стакти, благовонная смола (στακτή; слав. «стакти»), 没薬の香油. ἡμίονοι — мулы, лошаки (ἡμίονος). τὸ κατ᾿ ἐνιαυτὸν ἐνιαυτόν — из года в год."
  26: "θήλειαι ἵπποι — кобылицы (θῆλυς): в гр. 4000, в csl «четыредесять тысящ» (40 000) — в тексте csl, греч. число здесь. δώδεκα χιλιάδες ἱππέων — 12 000 всадников. Помета «26a» в базе — «и был он правителем всех царей от реки…»: в csl эта часть в том же ст. 26, помета не переводится. В ru 1400 колесниц — масоретское чтение."
  27: "συκάμινος — сикомор, тутовое дерево (συκάμινος), いちじく桑. πεδινή — низменность. εἰς πλῆθος — во множество."
  28: "ἡ ἔξοδος τῶν ἵππων — «выход» коней, т. е. откуда их приводили (ἔξοδος). Θεκουε — Фекое (テコエ); в ru «Кува» (МТ). ἐν ἀλλάγματι — в обмен, за плату (ἄλλαγμα)."
  29: "ἅρμα ἀντὶ ἑκατὸν ἀργυρίου — колесница за сто серебра; ἵππος ἀντὶ πεντήκοντα — конь за пятьдесят (в LXX 100 и 50; в csl «за шесть сот» и «сто пятьдесят» — в тексте csl). κατὰ θάλασσαν — по морю, вдоль моря. Χεττιιν — хеттеи (Χεττιιν), в ru «Хеттейским»."
