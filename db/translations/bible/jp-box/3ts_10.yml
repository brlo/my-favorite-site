# jp-box, 3-я Царств, глава 10. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); второй свидетель — церковнославянский
# (csl-ru); ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет,
# jp-ni не источник (только проверка tmp/sim_jp.rb).
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 10: царица Савская (1–13), богатство и престол Соломона (14–22), слава (23–25),
# колесницы и кони (26–29).
# Речи — 「…」: царица Савская (6–9, одна речь на четыре стиха). Красного нет.
# Паритет: csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes.
# Нумерация — по gr-lxx-byz, 29 стихов; но в ст. 22–24 LXX и слав. делят иначе:
# у гр. в 10:22 кроме флота стоит помета «22a» (отдел о постройках), гр. 10:23 —
# перечень покорённых народов, гр. 10:24 — «из сынов Израиля не сделал работниками»
# плюс пометы «23» и «24» (это слав. 10:23–24). В основном тексте — церковное чтение
# (слав. 22–24); те же отделы у гр. стоят внутри соседних стихов, поэтому дважды
# не переведены (см. notes 22–24). Где гр. и слав. расходятся в числах (10:26, 10:29),
# в тексте слав. (церковное чтение), греч. число — в notes.
# 〔…〕 нет. Сносок ⟨…⟩ нет: 燔祭, 王座, 香, ミナ, タラント уже в корпусе или пояснены в notes.
