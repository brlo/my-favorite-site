verses:
  1: "アステュアゲス王[おう]は父[ちち]たちのもとに加[くわ]えられた。ペルシア人[じん]のクロスがその王国[おうこく]を受[う]け継[つ]いだ。"
  2: "ダニエルは王[おう]とともに住[す]み、王[おう]の友[とも]のだれよりも名高[なだか]かった。"
  3: "バビロン人[じん]にはベルという名[な]の偶像[ぐうぞう]があった。人[ひと]々[びと]は毎日[まいにち]、そのために小麦粉[こむぎこ]十二[じゅうに]アルタバ、羊[ひつじ]四十匹[よんじゅうひき]、ぶどう酒[しゅ]六メトレテを費[つい]やしていた。"
  4: "王[おう]はベルを尊[とうと]び、毎日[まいにち]拝[おが]みに行[い]った。ダニエルは自分[じぶん]の神[かみ]を拝[おが]んだ。王[おう]は彼[かれ]に言[い]った。「なぜベルを拝[おが]まないのか。」"
  5: "「わたしは手[て]で造[つく]った偶像[ぐうぞう]を拝[おが]みません。天[てん]と地[ち]を造[つく]り、すべてを治[しはい]めておられる生[い]ける神[かみ]を拝[おが]みます。」"
  6: "「ベルは生[い]きた神[かみ]だとは思[おも]わないのか。毎日[まいにち]どれほど食[た]べ、飲[の]んでいるか、見[み]えないのか。」"
  7: "ダニエルは微笑[ほほえ]んで言[い]った。「思[おも]い違[ちが]いをしてはなりません、王[おう]よ。あれは内側[うちがわ]がただの土[つち]、外側[そとがわ]が青銅[せいどう]で、これまで一度[いちど]も食[た]べたことも飲[の]んだこともありません。」"
  8: "王[おう]は怒[おこ]って自分[じぶん]の祭司[さいし]たちを呼[よ]び、彼[かれ]らに言[い]った。「誰[だれ]がこの食物[しょくもつ]を食[た]べているのか話[はな]さなければ、お前[まえ]たちは死[し]ぬ。"
  9: "証[しょう]明[めい]できれば、ベルがそれを食[た]べているということになるので、ベルを冒涜[ぼうとく]したダニエルが死[し]ぬ。」ダニエルは王[おう]に言[い]った。「お言葉[ことば]のとおりに。」"
  10: "ベルの祭司[さいし]は、妻[つま]と子[こ]どもたちを除[のぞ]いて七十人[ななじゅうにん]いた。"
  11: "王[おう]はダニエルとともにベルの神殿[しんでん]へ行[い]った。ベルの祭司[さいし]たちは言[い]った。「わたしたちは外[そと]へ出[で]ます。王[おう]よ、あなたは食物[しょくもつ]を供[そな]え、ぶどう酒[しゅ]を注[つ]いで置[お]き、戸[と]を閉[し]めてあなたの指輪[ゆびわ]で封印[ふういん]してください。"
  12: "明日[あした]おいでになって、ベルがすべてを食[た]べ尽[つ]くしたということがお分[わ]かりにならないなら、わたしたちは死[し]にます。そうでなければ、わたしたちについて嘘[うそ]をついたダニエルが死[し]にます。」"
  13: "彼[かれ]らはそれを気[き]にも留[と]めなかった。食卓[しょくたく]の下[した]に隠[かく]し入口[いりぐち]を造[つく]り、いつもそこから入[はい]ってはそれらを食[た]べていたからである。"
  14: "彼[かれ]らが出[で]て行[い]くと、王[おう]はベルの前[まえ]に食物[しょくもつ]を供[そな]えた。ダニエルは自分[じぶん]の召使[めしつか]いたちに命[めい]じ、彼[かれ]らは灰[はい]を持[も]って来[き]て、王[おう]だけの前[まえ]で神殿[しんでん]の全体[ぜんたい]にまいた。そして外[そと]へ出[で]て戸[と]を閉[し]め、王[おう]の指輪[ゆびわ]で封印[ふういん]して立[た]ち去[さ]った。"
  15: "祭司[さいし]たちは、妻[つま]や子[こ]どもたちとともに、いつもの習慣[しゅうかん]で夜[よる]にやって来[き]て、すべてを食[た]べ尽[つ]くし、飲[の]み干[ほ]した。"
  16: "王[おう]は朝早[あさはや]く起[お]きた。ダニエルも一緒[いっしょ]だった。"
  17: "王[おう]は言[い]った。「ダニエル、封印[ふういん]は無事[ぶじ]か。」彼[かれ]は言[い]った。「無事[ぶじ]です、王[おう]よ。」"
  18: "戸[と]が開[あ]けられるとすぐ、王[おう]は食卓[しょくたく]を見[み]て大[おお]きな声[こえ]を上[あ]げた。「ベルよ、あなたは偉大[いだい]だ。あなたには何[なに]の偽[いつわ]りもない。」"
  19: "ダニエルは微笑[ほほえ]んで、王[おう]が中[なか]に入[はい]らないように引[ひ]き止[と]めて言[い]った。「床[ゆか]を見[み]て、これが誰[だれ]の足跡[あしあと]かお考[かんが]えください。」"
  20: "王[おう]は言[い]った。「男[おとこ]の足跡[あしあと]、女[おんな]の足跡[あしあと]、子[こ]どもの足跡[あしあと]が見[み]える。」"
  21: "王[おう]は怒[おこ]って祭司[さいし]たちとその妻[つま]たち、子[こ]どもたちを捕[つか]まえた。彼[かれ]らは、食卓[しょくたく]の上[うえ]の物[もの]を食[た]べるために出入[でい]りしていた隠[かく]し戸[ど]を王[おう]に見[み]せた。"
  22: "王[おう]は彼[かれ]らを殺[ころ]し、ベルをダニエルの手[て]に渡[わた]した。ダニエルはベルを砕[くだ]き、その神殿[しんでん]を破壊[はかい]した。"
  23: "その場所[ばしょ]には大[おお]きな竜[りゅう]がいて、バビロン人[じん]はこれを崇[あが]めていた。"
  24: "王[おう]はダニエルに言[い]った。「この者[もの]についても、青銅[せいどう]だと言[い]うのか。この者[もの]は生[い]きていて、食[た]べも飲[の]む。この者[もの]が生[い]きた神[かみ]ではないとは言[い]えないはずだ。だから拝[おが]みなさい。」"
  25: "「わたしは主[しゅ]であるわたしの神[かみ]を拝[おが]みます。この方[かた]こそ生[い]ける神[かみ]だからです。"
  26: "王[おう]よ、わたしに許[ゆる]しをお与[あた]えください。剣[つるぎ]も杖[つえ]も使[つか]わずに、あの竜[りゅう]を殺[ころ]します。」王[おう]は言[い]った。「許[ゆる]す。」"
  27: "ダニエルは樹脂[じゅし]と脂肪[しぼう]と羊毛[ようもう]を取[と]って一緒[いっしょ]に煮[に]て、団子[だんご]を作[つく]り、竜[りゅう]の口[くち]に投[な]げ入[い]れた。竜[りゅう]はそれを食[た]べると裂[さ]けた。ダニエルは言[い]った。「あなたがたの崇[あが]め物[もの]を見[み]よ。」"
  28: "バビロン人[じん]がそれを聞[き]くと、激[はげ]しく不平[ふへい]を言[い]い、王[おう]に逆[さか]らって言[い]った。「王[おう]はユダヤ人[じん]になった。ベルを砕[くだ]き、竜[りゅう]を殺[ころ]し、祭司[さいし]たちを殺[ころ]した。」"
  29: "彼[かれ]らは王[おう]のもとへ来[き]て言[い]った。「ダニエルをわたしたちに引[ひ]き渡[わた]せ。さもなければ、あなたとあなたの家[いえ]を殺[ころ]す。」"
  30: "王[おう]は、彼[かれ]らが自分[じぶん]に強[つよ]く迫[せま]っているのを見[み]て、やむを得[え]ずダニエルを彼[かれ]らに引[ひ]き渡[わた]した。"
  31: "彼[かれ]らはダニエルを獅子[しし]の穴[あな]に投[な]げ込[こ]んだ。彼[かれ]はそこに六日[むいか]の間[あいだ]いた。"
  32: "穴[あな]には七頭[ななとう]の獅子[しし]がいて、毎日[まいにち]二[ふた]つの死体[したい]と羊[ひつじ]二匹[にひき]が与[あた]えられていた。しかしそのときは、ダニエルを食[た]べさせるために、彼[かれ]らには何[なに]も与[あた]えられなかった。"
  33: "預言者[よげんしゃ]ハバククはユダヤの地[ち]にいた。彼[かれ]は煮込[にこ]み物[もの]を作[つく]り、パンを砕[くだ]いてかごに入[い]れ、畑[はたけ]へ刈[か]り入[い]れの人[ひと]たちに届[とど]けに行[い]くところだった。"
  34: "主[しゅ]の使[つか]いはハバククに言[い]った。「あなたが持[も]っている食事[しょくじ]を、バビロンのダニエルのもとへ、獅子[しし]の穴[あな]へ運[はこ]びなさい。」"
  35: "「主[しゅ]よ、わたしはバビロンを見[み]たことがありません。その穴[あな]がどこにあるかも知[し]りません。」"
  36: "主[しゅ]の使[つか]いは彼[かれ]の頭[あたま]のてっぺんをつかみ、髪[かみ]を握[にぎ]って、御霊[みたま]の力[ちから]によって彼[かれ]をバビロンの穴[あな]の上[うえ]に立[た]たせた。"
  37: "「ダニエル、ダニエル。神[かみ]があなたに送[おく]った食事[しょくじ]を受[う]け取[と]りなさい。」"
  38: "「神[かみ]よ、あなたはわたしを思[おも]い起[おこ]してくださった。あなたを愛[あい]する者[もの]を捨[す]てられなかったのです。」"
  39: "ダニエルは立[た]ち上[あ]がって食[た]べた。神[かみ]の使[つか]いはハバククをたちまち元[もと]の場所[ばしょ]に戻[もど]した。"
  40: "王[おう]は七日目[なのかめ]にダニエルを悲[かな]しむために来[き]て、穴[あな]のそばに立[た]ち、見下[みお]ろすと、ダニエルが座[すわ]っていた。"
  41: "「ダニエルの神[かみ]である主[しゅ]よ、あなたは偉大[いだい]です。あなたのほかに神[かみ]はありません。」"
  42: "王[おう]はダニエルを引[ひ]き上[あ]げさせ、彼[かれ]を滅[ほろ]ぼそうとした者[もの]たちを穴[あな]に投[な]げ込[こ]んだ。彼[かれ]らは王[おう]の目[め]の前[まえ]でたちまち食[た]べ尽[つ]くされた。"

notes:
  1: "csl: «И царь астиаг приложися к отцем своим: и прия кир персянин царство его»; «приложися к отцем» — эвфемизм смерти. Астиаг — アステュアゲス (Ἀστυάγης), Кир — クロス (по корпусу), «персянин» — ペルシア人. В gr-lxx-byz глав 13–14 нет вовсе."
  2: "«сожителствующь со царем» — живущий вместе с царём; «славен паче всех другов его» — славнее всех друзей его."
  3: "«кумир» — идол (偶像); «муки семидалны артавас дванадесять» — двенадцать артаб пшеничной муки; ru: «двадцать больших мер» — расхождение, держим csl 12 (ср. ἀρτάβας δώδεκα); «вина мер шесть» — шесть метрет вина."
  4: "«почиташе его» — чтил его; «хождаше по вся дни кланятися ему» — ходил каждый день поклоняться ему; «почто не покланяешися вилу?» — почему не поклоняешься Вилу."
  5: "«кумиром руками сотворенным» — идолам, сделанным руками; «живому Богу, сотворщему небо и землю и владущему всеми» — ru добавляет «над всякою плотью», в csl только «всеми», в текст не внесено."
  6: "«не мнится ли ти вил быти жив бог?» — не думаешь ли, что Вил — живой бог; «колико яст и пиет по вся дни» — сколько ест и пьёт каждый день."
  7: "«посмеявся» — усмехнувшись; «внутрьуду прах есть, а внеуду медь» — внутри прах (глина), снаружи медь (青銅); ru: «внутри глина, а снаружи медь»; «не яде, ни пи никогдаже» — никогда ни ел, ни пил."
  8: "«приза жерцы своя» — призвал своих жрецов (祭司); «аще не повесте ми, кто яст брашно сие, то умрете» — если не скажете, кто ест эту пищу, умрёте."
  9: "«аще же покажете, яко вил снедает е» — если докажете, что Вил съедает это; «умрет даниил, яко похулил есть вила» — умрёт Даниил, ибо произнёс хулу на Вила; «буди по глаголу твоему» — да будет по слову твоему."
  10: "«бяше же жерцев виловых седмьдесят, кроме жен и детей» — семьдесят жрецов, кроме жён и детей. ru так же."
  11: "«изыдем вон» — выйдем вон; «постави яди» — поставь пищу; «вино начерпав постави» — налив вина, поставь; «заключи двери и запечатай перстнем своим» — запри двери и запечатай своим перстнем."
  12: "«пришед заутра» — придя утром; «аще не обрящеши всего изядена вилом» — если не найдёшь всё съеденным Вилом; «тогда измрем, или даниил солгавый на ны» — тогда умрём мы, или Даниил, солгавший на нас."
  13: "«пренебрегаху» — пренебрегали; «под трапезою сокровен вход» — под столом тайный вход; «вхождаху тем всегда и изядаху тая» — входили им всегда и съедали то."
  14: "«постави брашно вилу» — поставил пищу Вилу; «принесоша пепел и посыпаша весь храм пред царем единым» — принесли пепел и посыпали весь храм при одном царе; «запечаташа перстнем царевым» — запечатали царским перстнем."
  15: "«нощию по обычаю своему» — ночью по своему обычаю; «и жены их и чада их» — с жёнами и детьми; «поядоща вся и испиша» — съели всё и выпили."
  16: "«урани царь заутра» — царь встал рано утром; «и даниил с ним» — и Даниил с ним."
  17: "«целы ли суть печати, данииле?» — целы ли печати, Даниил; «целы, царю» — целы, царь."
  18: "«абие» — тотчас; «воззрев царь на трапезу» — взглянув на стол; «велик еси, виле, и несть льсти в тебе ни единыя» — велик ты, Вил, и нет в тебе никакого обмана. Ирония: царь хвалит идола, не зная об обмане."
  19: "«посмеяся даниил» — усмехнулся Даниил; «удержа царя, еже бы не внити ему внутрь» — удержал царя, чтобы тот не вошёл внутрь; «виждь помост и уразумей, чия суть стопы сия» — посмотри на пол и пойми, чьи это следы."
  20: "«вижду стопы мужески и женски и детски» — вижу следы мужские, женские и детские. Перечисление сохранено."
  21: "«ят тогда жерцы и жены их и дети их» — тогда схватил жрецов, жён их и детей их; «показаша ему сокровенныя двери» — показали ему тайные двери; «поядаху яже на трапезе» — съедали то, что на столе."
  22: "«изби я царь» — царь убил их (в csl царь действует сам, в ru «повелел умертвить их»); «даде вила в руце даниилу» — отдал Вила в руки Даниилу; «разби его и храм его разори» — разбил его и храм его разрушил."
  23: "«змий великий» — большой змей/дракон (竜); «на месте том» — на том месте; «почитаху его вавилоняне» — чтили его вавилоняне."
  24: "«еда и сему речеши, яко медь есть?» — не скажешь ли и об этом, что он медь; «сей жив есть, и яст и пиет» — он жив и ест и пьёт; «убо поклонися ему» — итак, поклонись ему."
  25: "«Господу Богу моему поклонюся» — Господу Богу моему поклоняюсь; «яко той есть Бог жив» — ибо Он есть Бог живой."
  26: "«даждь ми власть» — дай мне власть (позволение); «убию змиа без меча и без жезла» — убью змея без меча и без жезла; «даю ти» — даю тебе."
  27: "«смолу и тук и волну» — смолу, жир и шерсть; ru: «смолы, жира и волос» — в csl «волна» (шерсть), в ru «волос», передано 羊毛; «возвари вкупе» — сварил вместе; «сотвори гомолу» — сделал ком; «ввеже во уста змию» — вложил в уста змея (дат. пад. «змию»); «разседеся» — расселся; «зрите чтилища ваша» — смотрите на ваши святыни."
  28: "«возропташа зело» — сильно возроптали; «обратишася на царя» — обратились против царя; «иудеанин бысть царь» — царь стал Иудеем; «вила расторже, и змиа уби, и жерцы изсече» — Вила разрушил, змея убил, жрецов изрубил."
  29: "«предаждь нам даниила» — предай нам Даниила; «аще ли ни, то убием тя и дом твой» — если же нет, убьём тебя и дом твой."
  30: "«налегают на него зело» — сильно настаивают на нём; «принужден предаде им даниила» — принуждён был предать им Даниила."
  31: "«ввергоша его в ров левск» — бросили его в львиный ров (獅子の穴); «бе тамо дний шесть» — был там шесть дней."
  32: "«бяху же в рове седмь львов» — было во рву семь львов; «даяху им на день два тела и две овцы» — давали им в день два тела и две овцы; «тогда же не даша им, да снедят даниила» — тогда не дали им, чтобы съели Даниила."
  33: "«бяше во иудеи» — был в Иудее; «свари варение» — сварил похлёбку; «вдроби хлебы в нощвы» — накрошил хлебы в корзину; «идяше на поле донести жателем» — шёл на поле отнести жнецам."
  34: "«отнеси обед, егоже имаши, в вавилон даниилу, в ров левск» — отнеси обед, который у тебя, в Вавилон Даниилу, в львиный ров."
  35: "«Господи, вавилона не видех, и рва не вем, где есть» — Господи, Вавилона я не видел и рва не знаю, где он. ru: «господин!» — обращение иное, в тексте по csl «Господи»."
  36: "«ят его ангел Господень за верх его» — взял его ангел Господень за темя; «держа за власы главы его» — держа за волосы головы его; «постави его в вавилоне верху рва»; «шумом духа своего» — шумом (дыханием) духа своего, передано 御霊の力."
  37: "«возопи аввакум глаголя» — воззвал Аввакум, говоря; «данииле, данииле! возми обед, егоже посла тебе Бог» — Даниил, Даниил, возьми обед, который послал тебе Бог."
  38: "«помянул бо мя еси, Боже» — ибо Ты вспомнил обо мне, Боже; «неси оставил любящих тя» — не оставил любящих Тебя."
  39: "«востав даниил яде» — встав, Даниил ел; «ангел же Божий паки постави аввакума внезапу на месте его» — ангел Божий опять поставил Аввакума внезапно на место его."
  40: "«прииде в седмый день жалети даниила» — пришёл в седьмой день пожалеть (оплакать) Даниила; «воззре и се, даниил седя» — взглянул, и вот, Даниил сидит."
  41: "«велик еси, Господи, Боже даниилов, и несть иного разве тебе» — велик Ты, Господи, Боже Даниилов, и нет иного кроме Тебя. Исповедание царя."
  42: "«исхити его» — выхватил (велел вынуть) его; «повинныя же пагубе его вверже в ров» — виновных в его погибели бросил в ров; «изядени быша абие пред ним» — тотчас съедены были перед ним."
