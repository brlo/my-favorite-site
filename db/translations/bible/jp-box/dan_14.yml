# Содержание: 1–2 Астиаг умер, Кир Персидский принял царство; Даниил при царе;
# 3–7 идол Вил и его ежедневная пища, Даниил смеётся: внутри глина, снаружи медь;
# 8–22 испытание: пепел, запечатанные двери, тайный ход, следы, казнь жрецов,
