# Голоса: 4–9 — царь и Даниил; 11–12 — жрецы; 17 — царь и Даниил; 18 — царь;
# 19 — Даниил; 20 — царь; 24 — царь; 25–26 — Даниил, затем царь; 27 — Даниил;
# 28–29 — народ; 34 — ангел; 35 — Аввакум; 37 — Аввакум; 38 — Даниил; 41 — царь.
