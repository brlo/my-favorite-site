# ユダヤ人. Термины: 偶像[ぐうぞう] — кумир; 祭司[さいし] — жрецы (языческие);
# 神殿[しんでん] — храм; 竜[りゅう] — δράκων/змий; 獅子[しし]の穴[あな] — ров львиный;
# 封印[ふういん] — печать; 足跡[あしあと] — следы; 御霊[みたま] — дух.
