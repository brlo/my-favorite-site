verses:
  1: "これが、主[しゅ]がシナの山[やま]でモーセに語[かた]られた日[ひ]に、アロンとモーセの系図[けいず]である。"
  2: "アロンの子[こ]らの名[な]は次[つぎ]のとおりである。長子[ちょうし]ナダブ、アビウド、エレアザル、イタマル。"
  3: "これがアロンの子[こ]らの名[な]である。彼[かれ]らは祭司[さいし]、油[あぶら]を注[そそ]がれた者[もの]たち、祭司として務[つと]めるために手[て]を満[み]たされた者たちである。"
  4: "ナダブとアビウドは、シナの荒野[こうや]で、主[しゅ]の前[まえ]で他[ほか]の火[ひ]をささげたとき、主の前で死[し]んだ。彼[かれ]らには子[こ]どもがなかった。エレアザルとイタマルは、父[ちち]アロンとともに祭司[さいし]として務[つと]めた。"
  5: "主[しゅ]はモーセに語[かた]って言[い]われた。"
  6: "「レビの部族[ぶぞく]を取[と]って、祭司[さいし]アロンの前[まえ]に立[た]たせなさい。彼[かれ]らはアロンに仕[つか]えなさい。"
  7: "彼[かれ]らはアロンの務[つと]めと、イスラエルの子[こ]らのすべての務めを、証[あかし]の幕屋[まくや]の前[まえ]で守[まも]り、幕屋の仕事[しごと]をしなさい。"
  8: "彼[かれ]らは証[あかし]の幕屋[まくや]のすべての器[うつわ]と、イスラエルの子[こ]らの務[つと]めを守[まも]り、幕屋のすべての仕事[しごと]をしなさい。"
  9: "あなたはレビ人[びと]を、祭司[さいし]アロンとその子[こ]らに与[あた]えなさい。彼[かれ]らはイスラエルの子らの中[なか]から、わたしに贈[おく]られた者[もの]たちである。"
  10: "あなたはアロンとその子[こ]らを、証[あかし]の幕屋[まくや]の上[うえ]に立[た]たせなさい。彼[かれ]らは自分[じぶん]の祭司職[さいししょく]と、祭壇[さいだん]のすべてのもの、垂[た]れ幕[まく]の内側[うちがわ]のことを守[まも]りなさい。他[ほか]の者[もの]が触[ふ]れるなら、死[し]ななければならない。」"
  11: "主[しゅ]はモーセに語[かた]って言[い]われた。"
  12: "「見[み]よ、わたしはイスラエルの子[こ]らの中[なか]からレビ人[びと]を取[と]った。イスラエルの子らのすべての初子[ういご]、すなわち胎[たい]を開[ひら]く者[もの]に代[か]えて。レビ人は彼[かれ]らの贖[あがな]いとなり、レビ人はわたしのものとなる。"
  13: "すべての初子[ういご]はわたしのものである。わたしがエジプトの地[ち]ですべての初子を打[う]った日[ひ]に、わたしはイスラエルですべての初子を、人[ひと]から家畜[かちく]に至[いた]るまで、わたしのために聖別[せいべつ]した。彼[かれ]らはわたしのものとなる。わたしは主[しゅ]である。」"
  14: "主[しゅ]はシナの荒野[こうや]でモーセに語[かた]って言[い]われた。"
  15: "「レビの子[こ]らを、その父[ちち]の家[いえ]に従[したが]って、その氏族[しぞく]に従って、その一族[いちぞく]に従って数[かぞ]えなさい。生後[せいご]一か月以上[いじょう]の男子[だんし]をみな、数[かぞ]え上[あ]げなさい。」"
  16: "モーセとアロンは、主[しゅ]の声[こえ]によって、主が命[めい]じられたとおりに彼[かれ]らを数[かぞ]え上[あ]げた。"
  17: "レビの子[こ]らは、その名[な]によれば次[つぎ]のとおりである。ゲルション、カアト、メラリ。"
  18: "ゲルションの子[こ]らの名[な]は、その氏族[しぞく]に従[したが]えば次[つぎ]のとおりである。ロベニとセメイ。"
  19: "カアトの子[こ]らは、その氏族[しぞく]に従[したが]えば次[つぎ]のとおりである。アムラム、イサアル、ヘブロン、オジエル。"
  20: "メラリの子[こ]らは、その氏族[しぞく]に従[したが]えば次[つぎ]のとおりである。モオリとオムシ。これらが、その父[ちち]の家[いえ]に従ったレビ人[びと]の氏族である。"
  21: "ゲルションには、ロベニの氏族[しぞく]とセメイの氏族がある。これらがゲルションの氏族である。"
  22: "その数[かぞ]え上[あ]げは、一か月以上[いじょう]のすべての男子[だんし]の数[かず]によれば、その数え上げは七千五百人[にん]であった。"
  23: "ゲルションの子[こ]らは、幕屋[まくや]の後[うし]ろ、海[うみ]の方[ほう]に宿営[しゅくえい]しなさい。"
  24: "ゲルションの氏族[しぞく]の父[ちち]の家[いえ]の長[かしら]はエリサフ、ラエルの子[こ]である。"
  25: "ゲルションの子[こ]らの務[つと]めは、証[あかし]の幕屋[まくや]では、幕屋とその覆[おお]い、証の幕屋の入口[いりぐち]の覆い、"
  26: "庭[にわ]の幕[まく]と、幕屋[まくや]のそばにある庭の門[もん]の垂[た]れ幕、およびそのすべての仕事[しごと]の残[のこ]りのものである。"
  27: "カアトには、アムラムの氏族[しぞく]とイサアルの氏族、ヘブロンの氏族、オジエルの氏族がある。これらがカアトの氏族である。"
  28: "一か月以上[いじょう]のすべての男子[だんし]の数[かず]によれば、八千六百人[にん]であり、聖[せい]なるものの務[つと]めを守[まも]る者[もの]たちである。"
  29: "カアトの子[こ]らの氏族[しぞく]は、幕屋[まくや]の側[そば]、南[みなみ]に宿営[しゅくえい]しなさい。"
  30: "カアトの氏族[しぞく]の父[ちち]の家[いえ]の長[かしら]はエリサファン、オジエルの子[こ]である。"
  31: "彼[かれ]らの務[つと]めは、契約[けいやく]の箱[はこ]、机[つくえ]、燭台[しょくだい]、祭壇[さいだん]、聖所[せいしょ]の器[うつわ]、すなわち彼らがその中[なか]で務めをするもの、および垂[た]れ幕[まく]と、そのすべての仕事[しごと]である。"
  32: "レビ人[びと]の長[かしら]たちの上[うえ]の長は、祭司[さいし]アロンの子[こ]エレアザルで、聖[せい]なるものの務[つと]めを守[まも]るために任[にん]じられた者[もの]である。"
  33: "メラリには、モオリの氏族[しぞく]とオムシの氏族がある。これらがメラリの氏族である。"
  34: "その数[かぞ]え上[あ]げは、一か月以上[いじょう]のすべての男子[だんし]の数[かず]によれば、六千五十人[にん]であった。"
  35: "メラリの氏族[しぞく]の父[ちち]の家[いえ]の長[かしら]はスリエル、アビハイルの子[こ]である。彼[かれ]らは幕屋[まくや]の側[そば]、北[きた]に宿営[しゅくえい]しなさい。"
  36: "メラリの子[こ]らが守[まも]る務[つと]めは、幕屋[まくや]の板[いた]、その横木[よこぎ]、その柱[はしら]、その台座[だいざ]、そのすべての器[うつわ]と、そのすべての仕事[しごと]、"
  37: "庭[にわ]の周[まわ]りの柱[はしら]とその台座[だいざ]、その杭[くい]とその綱[つな]である。"
  38: "証[あかし]の幕屋[まくや]の正面[しょうめん]、東[ひがし]に宿営[しゅくえい]する者[もの]は、モーセとアロンとその子[こ]らで、イスラエルの子らのために聖[せい]なるものの務[つと]めを守[まも]る者[もの]たちである。他[ほか]の者が触[ふ]れるなら、死[し]ななければならない。"
  39: "モーセとアロンが主[しゅ]の声[こえ]によってその氏族[しぞく]に従[したが]って数[かぞ]え上[あ]げたレビ人[びと]の数[かぞ]え上[あ]げはすべて、一か月以上[いじょう]のすべての男子[だんし]で、二万二千人[にん]であった。"
  40: "主[しゅ]はモーセに言[い]われた。「イスラエルの子[こ]らのすべての初子[ういご]、男子[だんし]を、一か月以上[いじょう]で数[かぞ]え、その名[な]の数[かず]を取[と]りなさい。"
  41: "あなたはレビ人[びと]を、わたし、主[しゅ]のために、イスラエルの子[こ]らのすべての初子[ういご]に代[か]えて取[と]り、レビ人の家畜[かちく]を、イスラエルの子らの家畜のすべての初子に代えて取りなさい。」"
  42: "モーセは、主[しゅ]が命[めい]じられたとおりに、イスラエルの子[こ]らのすべての初子[ういご]を数[かぞ]え上[あ]げた。"
  43: "初子[ういご]の男子[だんし]はすべて、その名[な]の数[かず]によれば、一か月以上[いじょう]で、その数[かぞ]え上[あ]げから二万二千二百七十三人[にん]であった。"
  44: "主[しゅ]はモーセに語[かた]って言[い]われた。"
  45: "「レビ人[びと]を、イスラエルの子[こ]らのすべての初子[ういご]に代[か]えて取[と]り、レビ人の家畜[かちく]を、彼[かれ]らの家畜に代えて取りなさい。レビ人はわたしのものとなる。わたしは主[しゅ]である。"
  46: "レビ人[びと]に代[か]わる、イスラエルの子[こ]らの初子[ういご]のうちの余[あま]りである二百七十三人[にん]の贖[あがな]いとして、"
  47: "一人[ひとり]につき五シケルを取[と]りなさい。聖[せい]なるディドラクマ、すなわち一シケルが二十[にじゅう]オボロスであるところのものに従[したが]って取りなさい。"
  48: "あなたはその銀[ぎん]を、彼[かれ]らの中[なか]の余[あま]りの者[もの]の贖[あがな]いとして、アロンとその子[こ]らに与[あた]えなさい。」"
  49: "モーセは、レビ人[びと]に代[か]わる余[あま]りの者[もの]の贖[あがな]いの銀[ぎん]、すなわち、"
  50: "イスラエルの子[こ]らの初子[ういご]から、聖[せい]なるシケルで千三百六十五シケルを受[う]け取[と]った。"
  51: "モーセは、主[しゅ]の声[こえ]によって、主がモーセに命[めい]じられたとおりに、その贖[あがな]いの銀[ぎん]をアロンとその子[こ]らに与[あた]えた。"

notes:
  1: "αἱ γενέσεις Ααρων καὶ Μωυσῆ — родословия (происхождение) Аарона и Моисея; ἐν ᾗ ἡμέρᾳ ἐλάλησεν κύριος τῷ Μωυσῇ ἐν ὄρει Σινα — в день, когда Господь говорил Моисею на горе Синае. Порядок имён — «Аарон и Моисей», как в LXX (Аарон впереди, т. к. дальше речь о его сынах)."
  2: "πρωτότοκος Ναδαβ — первенец Надав; далее Авиуд, Елеазар, Ифамар (в такой последовательности у LXX и слав.)."
  3: "οἱ ἱερεῖς οἱ ἠλειμμένοι — священники помазанные (ἀλείφω — «умащать»); οὓς ἐτελείωσαν τὰς χεῖρας αὐτῶν ἱερατεύειν — «которым совершили руки их, чтобы священнодействовать»: евр. идиома «наполнить руки» = посвятить (τελειόω — «совершать, посвящать»)."
  4: "προσφερόντων αὐτῶν πῦρ ἀλλότριον — когда они приносили огонь чуждый (ср. Лев 10:1–2); ἔναντι κυρίου — пред Господом; παιδία οὐκ ἦν αὐτοῖς — детей не было у них; ἱεράτευσεν — священствовал (аорист, ед. ч.: о каждом из двух)."
  5: "καὶ ἐλάλησεν κύριος πρὸς Μωυσῆν λέγων — обычное введение речи; λέγων относится к ст. 6."
  6: "Λαβὲ τὴν φυλὴν Λευι — возьми племя Левия (λαμβάνω, не «приведи», как в Синодальном); στήσεις αὐτοὺς ἐναντίον Ααρων τοῦ ἱερέως — поставишь их пред Аароном священником; λειτουργήσουσιν αὐτῷ — будут служить ему (λειτουργέω — «отправлять служение»)."
  7: "φυλάξουσιν τὰς φυλακὰς αὐτοῦ — будут хранить стражи его, т. е. нести его обязанности (φυλακή — «стража, служба»); φυλακὰς τῶν υἱῶν Ισραηλ — стражи сынов Израиля; ἐργάζεσθαι τὰ ἔργα τῆς σκηνῆς — делать дела скинии."
  8: "τὰ σκεύη τῆς σκηνῆς τοῦ μαρτυρίου — утварь скинии свидетельства; κατὰ πάντα τὰ ἔργα τῆς σκηνῆς — по всем делам скинии."
  9: "δώσεις τοὺς Λευίτας Ααρων καὶ τοῖς υἱοῖς αὐτοῦ — отдашь левитов Аарону и сынам его; δόμα δεδομένοι — «даром данные» (δόμα — «дар», perf. pass. δέδομαι): они Мне отданы из сынов Израиля. Слав. прибавляет «брату твоему» — в греч. нет."
  10: "καταστήσεις ἐπὶ τῆς σκηνῆς τοῦ μαρτυρίου — поставишь над скинией свидетельства; φυλάξουσιν τὴν ἱερατείαν αὐτῶν — будут хранить священство своё (ἱερατεία); πάντα τὰ κατὰ τὸν βωμόν — всё, что при жертвеннике (βωμός, не θυσιαστήριον); ἔσω τοῦ καταπετάσματος — внутри завесы (垂れ幕); ὁ ἀλλογενὴς ὁ ἁπτόμενος — посторонний прикасающийся."
  11: "Повторное введение речи Бога; ср. ст. 5."
  12: "ἐγὼ ἰδοὺ εἴληφα — «вот, Я взял» (perf. от λαμβάνω); ἀντὶ παντὸς πρωτοτόκου διανοίγοντος μήτραν — вместо всякого первенца, разверзающего утробу (διανοίγω — «открывать»); λύτρα αὐτῶν ἔσονται — будут выкупом за них (λύτρον — 贖い)."
  13: "ἐμοὶ γὰρ πᾶν πρωτότοκον — ибо Мне всякий первенец; ἐν ᾗ ἡμέρᾳ ἐπάταξα — в день, когда поразил (πατάσσω); ἡγίασα ἐμοὶ πᾶν πρωτότοκον — освятил Мне всякого первенца (ἁγιάζω); ἀπὸ ἀνθρώπου ἕως κτήνους — от человека до скота; ἐγὼ κύριος — Я Господь."
  14: "καὶ ἐλάλησεν κύριος πρὸς Μωυσῆν ἐν τῇ ἐρήμῳ Σινα λέγων — введение речи с указанием места (пустыня Синай)."
  15: "Ἐπίσκεψαι — исчисли (повеление ед. ч.); κατ᾿ οἴκους πατριῶν — 父の家, κατὰ δήμους — 氏族, κατὰ συγγενείας — 一族 (три ступени родства, как в ст. 20 гл. 1); πᾶν ἀρσενικὸν ἀπὸ μηνιαίου καὶ ἐπάνω — всё мужское от месячного возраста и выше (μηνιαῖος — «месячный»); ἐπισκέψασθε — исчислите (мн. ч., как в LXX после ед. ч.)."
  16: "ἐπεσκέψαντο αὐτοὺς Μωϋσῆς καὶ Ααρων διὰ φωνῆς κυρίου — исчислили их Моисей и Аарон по голосу (повелению) Господню; ὃν τρόπον συνέταξεν — как повелел."
  17: "ἐξ ὀνομάτων αὐτῶν — «по именам их»: Γεδσων, Κααθ, Μεραρι (LXX; в корпусе — ゲルション, カアト, メラリ, ср. Исх 6:16)."
  18: "Λοβενι καὶ Σεμει — Ловени и Семей (LXX; МТ Ливни и Шимей); κατὰ δήμους αὐτῶν — по родам их."
  19: "Αμραμ καὶ Ισσααρ, Χεβρων καὶ Οζιηλ — Амрам, Исаар, Хеврон, Озиил; формы корпуса: アムラム, イサアル, ヘブロン, オジエル (Исх 6:18)."
  20: "Μοολι καὶ Μουσι — Мооли и Муси (в Исх 6:19 LXX — Ομουσι; в корпусе モオリ, オムシ); οὗτοι δῆμοι τῶν Λευιτῶν κατ᾿ οἴκους πατριῶν — вот роды левитов по домам отцов."
  21: "Τῷ Γεδσων δῆμος τοῦ Λοβενι — у Гирсона род Ловени; οὗτοι δῆμοι τοῦ Γεδσων — это роды Гирсона."
  22: "ἡ ἐπίσκεψις αὐτῶν κατὰ ἀριθμὸν παντὸς ἀρσενικοῦ — исчисление их по числу всего мужского пола; ἀπὸ μηνιαίου καὶ ἐπάνω — от месячного и выше; ἑπτακισχίλιοι καὶ πεντακόσιοι — 7 500."
  23: "ὀπίσω τῆς σκηνῆς παρὰ θάλασσαν — позади скинии, при море, т. е. на западе (Синодальный: «на запад»); παρεμβαλοῦσιν — будут становиться станом."
  24: "ὁ ἄρχων οἴκου πατριᾶς τοῦ δήμου — начальник дома отчества рода; Ελισαφ υἱὸς Λαηλ — Елисаф, сын Лаила (LXX Λαηλ; слав. «даиль»)."
  25: "ἡ φυλακὴ υἱῶν Γεδσων — стража (обязанность) сынов Гирсона; ἡ σκηνὴ καὶ τὸ κάλυμμα — скиния и покрывало; τὸ κατακάλυμμα τῆς θύρας — покрывало входа (двойной предлог, как в LXX)."
  26: "τὰ ἱστία τῆς αὐλῆς — полотнища двора (ἱστίον — «ткань, завеса»); τὸ καταπέτασμα τῆς πύλης τῆς αὐλῆς τῆς οὔσης ἐπὶ τῆς σκηνῆς — завеса ворот двора, что при скинии; τὰ κατάλοιπα πάντων τῶν ἔργων αὐτοῦ — остатки всех дел его."
  27: "Τῷ Κααθ δῆμος ὁ Αμραμις — у Каафа род Амрама (прилагательные на -ις: Αμραμις, Σααρις, Χεβρωνις, Οζιηλις — «амрамов», «исааров» и т. д.); так в LXX, слав. «сонм амрамль»."
  28: "κατὰ ἀριθμὸν πᾶν ἀρσενικὸν — по числу всё мужское; ὀκτακισχίλιοι καὶ ἑξακόσιοι — 8 600; φυλάσσοντες τὰς φυλακὰς τῶν ἁγίων — охраняющие стражи святынь (ἅγια — святыни, священное)."
  29: "ἐκ πλαγίων τῆς σκηνῆς κατὰ λίβα — с боков скинии к югу (λίψ — «юг»); παρεμβαλοῦσιν — будут становиться станом."
  30: "ὁ ἄρχων οἴκου πατριῶν τῶν δήμων τοῦ Κααθ — начальник дома отцов родов Каафа; Ελισαφαν υἱὸς Οζιηλ — Елисафан, сын Озиила (в корпусе エリサファン, Исх 6:22)."
  31: "ἡ κιβωτὸς καὶ ἡ τράπεζα καὶ ἡ λυχνία — ковчег, стол и светильник; τὰ θυσιαστήρια — жертвенники (мн. ч.: жертвенник всесожжения и золотой); τὰ σκεύη τοῦ ἁγίου — сосуды святыни; ὅσα λειτουργοῦσιν ἐν αὐτοῖς — которыми служат при них; τὸ κατακάλυμμα — покрывало."
  32: "ὁ ἄρχων ἐπὶ τῶν ἀρχόντων τῶν Λευιτῶν — начальник над начальниками левитов; καθεσταμένος φυλάσσειν — поставленный охранять (καθίστημι, perf. pass.); τὰς φυλακὰς τῶν ἁγίων — стражи святынь."
  33: "Τῷ Μεραρι δῆμος ὁ Μοολι καὶ δῆμος ὁ Μουσι — у Мерари род Мооли и род Муси."
  34: "ἑξακισχίλιοι καὶ πεντήκοντα — 6 050 (LXX; в csl-ru и ru — 6 200, масоретское чтение; при этом итог 22 000 в ст. 39 не сходится ни там, ни там: 7 500 + 8 600 + 6 050 = 22 150)."
  35: "Σουριηλ υἱὸς Αβιχαιλ — Суриил, сын Авихаила (корпус: スリエル, アビハイル); ἐκ πλαγίων τῆς σκηνῆς … πρὸς βορρᾶν — с боков скинии к северу."
  36: "ἡ ἐπίσκεψις ἡ φυλακὴ υἱῶν Μεραρι — букв. «исчисление, стража сынов Мерари» (несогласованная формула; слав. «соглядание стражбы»); κεφαλίδες — брусья скинии (в Исх 26 переведено 板, т. к. это доски, а не столбы); μοχλοί — шесты (横木); στῦλοι — столбы; βάσεις — подножия."
  37: "τοὺς στύλους τῆς αὐλῆς κύκλῳ — столбы двора вокруг; πασσάλους — колья; κάλους — верёвки (κάλος)."
  38: "οἱ παρεμβάλλοντες κατὰ πρόσωπον τῆς σκηνῆς … ἀπ᾿ ἀνατολῆς — становящиеся перед лицом скинии, от востока; φυλάσσοντες τὰς φυλακὰς τοῦ ἁγίου εἰς τὰς φυλακὰς τῶν υἱῶν Ισραηλ — охраняющие стражи святыни вместо страж сынов Израиля (εἰς — «в счёт, вместо»); ἀλλογενής — посторонний."
  39: "Πᾶσα ἡ ἐπίσκεψις τῶν Λευιτῶν — всё исчисление левитов; οὓς ἐπεσκέψατο Μωϋσῆς καὶ Ααρων διὰ φωνῆς κυρίου — которых исчислили Моисей и Аарон по голосу Господню; δύο καὶ εἴκοσι χιλιάδες — 22 000 (см. примечание к ст. 34 о несходимости)."
  40: "Ἐπίσκεψαι πᾶν πρωτότοκον ἄρσεν — исчисли всякого первенца мужского пола; ἀπὸ μηνιαίου καὶ ἐπάνω — от месячного и выше; λαβὲ τὸν ἀριθμὸν ἐξ ὀνόματος — возьми число их по имени (поимённо)."
  41: "καὶ λήμψῃ τοὺς Λευίτας ἐμοί, ἐγὼ κύριος — и возьмёшь левитов Мне, Я Господь; ἀντὶ πάντων τῶν πρωτοτόκων — вместо всех первенцев; τὰ κτήνη τῶν Λευιτῶν ἀντὶ πάντων τῶν πρωτοτόκων ἐν τοῖς κτήνεσιν — скот левитов вместо всякого первенца из скота сынов Израиля."
  42: "ἐπεσκέψατο Μωϋσῆς, ὃν τρόπον ἐνετείλατο κύριος — исчислил Моисей, как заповедал Господь."
  43: "κατὰ ἀριθμὸν ἐξ ὀνόματος — по числу, по имени; ἀπὸ μηνιαίου καὶ ἐπάνω — от месячного и выше; ἐκ τῆς ἐπισκέψεως αὐτῶν — из исчисления их; δύο καὶ εἴκοσι χιλιάδες τρεῖς καὶ ἑβδομήκοντα καὶ διακόσιοι — 22 273."
  44: "Введение речи Бога; ср. ст. 5, 11."
  45: "Λαβὲ τοὺς Λευίτας ἀντὶ πάντων τῶν πρωτοτόκων — возьми левитов вместо всех первенцев; καὶ τὰ κτήνη τῶν Λευιτῶν ἀντὶ τῶν κτηνῶν αὐτῶν — и скот левитов вместо скота их; ἔσονται ἐμοὶ οἱ Λευῖται — будут Мне левиты."
  46: "τὰ λύτρα τριῶν καὶ ἑβδομήκοντα καὶ διακοσίων — выкуп трёх и семидесяти и двухсот, т. е. 273; οἱ πλεονάζοντες παρὰ τοὺς Λευίτας — превышающие [число] левитов (πλεονάζω — «быть в излишке»); ἀπὸ τῶν πρωτοτόκων — из первенцев."
  47: "πέντε σίκλους κατὰ κεφαλήν — по пяти сиклей на голову (с человека); κατὰ τὸ δίδραχμον τὸ ἅγιον — по священной дидрахме (δίδραχμον — двойная драхма, т. е. сикль); εἴκοσι ὀβολοὺς τοῦ σίκλου — двадцать оболов сикля (пояснение: в сикле 20 оболов)."
  48: "δώσεις τὸ ἀργύριον Ααρων καὶ τοῖς υἱοῖς αὐτοῦ — отдашь серебро Аарону и сынам его; λύτρα τῶν πλεοναζόντων ἐν αὐτοῖς — выкуп за излишних среди них (ἐν αὐτοῖς — «в них»)."
  49: "ἔλαβεν Μωϋσῆς τὸ ἀργύριον — взял Моисей серебро; τὰ λύτρα τῶν πλεοναζόντων — выкуп излишних; εἰς τὴν ἐκλύτρωσιν τῶν Λευιτῶν — на выкуп левитов (ἐκλύτρωσις — «искупление»)."
  50: "παρὰ τῶν πρωτοτόκων τῶν υἱῶν Ισραηλ — от первенцев сынов Израиля; χιλίους τριακοσίους ἑξήκοντα πέντε σίκλους — 1 365 сиклей (273 × 5); κατὰ τὸν σίκλον τὸν ἅγιον — по сиклю священному."
  51: "ἔδωκεν Μωϋσῆς τὰ λύτρα — отдал Моисей выкуп; διὰ φωνῆς κυρίου — по голосу Господню; ὃν τρόπον συνέταξεν κύριος τῷ Μωυσῇ — как повелел Господь Моисею."
