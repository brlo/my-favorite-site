verses:
  1: "民[たみ]とその妻[つま]たちの間[あいだ]に、彼[かれ]らの兄弟[きょうだい]であるユダの人[ひと]々[びと]に向[む]けた大[おお]きな叫[さけ]びがあった。"
  2: "「私[わたし]たちは息子[むすこ]や娘[むすめ]が多[おお]い。だから小麦[こむぎ]を取[と]って食[た]べ、生[い]き延[の]びよう。」と言[い]う者[もの]たちがあった。"
  3: "また、「私[わたし]たちは畑[はたけ]やぶどう畑[ばたけ]、家[いえ]を抵当[ていとう]に入[い]れて、小麦[こむぎ]を取[と]って食[た]べよう。」と言[い]う者[もの]たちがあった。"
  4: "また、「私[わたし]たちは王[おう]の税[ぜい]のために銀[ぎん]を借[か]りた。そのために畑[はたけ]やぶどう畑[ばたけ]、家[いえ]を抵当[ていとう]に入[い]れた。」と言[い]う者[もの]たちがあった。"
  5: "「そして今[いま]、私[わたし]たちの肉[にく]は兄弟[きょうだい]たちの肉[にく]と同[おな]じであり、私[わたし]たちの子[こ]らは彼[かれ]らの子[こ]らと同[おな]じである。見[み]よ、私[わたし]たちは自分[じぶん]たちの息子[むすこ]や娘[むすめ]を奴隷[どれい]として服従[ふくじゅう]させている。娘[むすめ]たちのうちには、すでに服従[ふくじゅう]させられている者[もの]たちがいる。私[わたし]たちの手[て]に力[ちから]はなく、私[わたし]たちの畑[はたけ]やぶどう畑[ばたけ]は貴人[きじん]たちのものとなっている。」"
  6: "私[わたし]は彼[かれ]らの叫[さけ]びとこれらの言葉[ことば]を聞[き]いて、非常[ひじょう]に悲[かな]しんだ。"
  7: "私[わたし]の心[こころ]は私[わたし]のうちで決[き]めた。私[わたし]は貴人[きじん]たちと長[おさ]たちを責[せ]めて言[い]った。「あなたがたは、それぞれ自分[じぶん]の兄弟[きょうだい]から利子[りし]を取[と]っているではないか。」そして私[わたし]は彼[かれ]らに対[たい]して大[おお]きな集会[しゅうかい]を開[ひら]いた。"
  8: "私[わたし]は彼[かれ]らに言[い]った。「私[わたし]たちは、諸国[しょこく]に売[う]られた兄弟[きょうだい]であるユダの人[ひと]々[びと]を、力[ちから]の及[およ]ぶかぎりで買[か]い戻[もど]してきた。ところが、あなたがたは自分[じぶん]たちの兄弟[きょうだい]を売[う]っている。そして彼[かれ]らは私[わたし]たちに売[う]られるのか。」彼[かれ]らは黙[だま]り、答[こた]える言葉[ことば]を見[み]つけられなかった。"
  9: "私[わたし]は言[い]った。「あなたがたがしていることは良[よ]くない。あなたがたは、私[わたし]たちの敵[てき]である諸国[しょこく]の恥[はじ]を避[さ]けるために、私[わたし]たちの神[かみ]を恐[おそ]れて歩[あゆ]むべきではないか。」"
  10: "私[わたし]も、私[わたし]の兄弟[きょうだい]たちも、私[わたし]の知[し]る者[もの]たちも、彼[かれ]らに銀[ぎん]と小麦[こむぎ]を貸[か]してきた。どうか、この取[と]り立[た]てをやめよう。"
  11: "どうか、今日[きょう]、彼[かれ]らの畑[はたけ]、ぶどう畑[ばたけ]、オリーブ畑[ばたけ]、家[いえ]を彼[かれ]らに返[かえ]し、銀[ぎん]から出[で]た小麦[こむぎ]、ぶどう酒[しゅ]、油[あぶら]も彼[かれ]らに返[かえ]してやってください。"
  12: "彼[かれ]らは言[い]った。「私[わたし]たちは返[かえ]し、彼[かれ]らから何[なに]も求[もと]めない。あなたが言[い]うとおりにしよう。」私[わたし]は祭司[さいし]たちを呼[よ]び、この言葉[ことば]どおりに行[おこな]うように彼[かれ]らに誓[ちか]わせた。"
  13: "私[わたし]は自分[じぶん]の衣[ころも]を振[ふ]るって言[い]った。「この言葉[ことば]を守[まも]らない者[もの]を、神[かみ]がこうして、その家[いえ]からも、その労苦[ろうく]からも振[ふ]るい出[だ]し、その者[もの]が振[ふ]るい出[だ]された空[から]の者[もの]となるように。」集会[しゅうかい]は全[ぜん]て「アーメン」と言[い]って主[しゅ]をほめたたえた。民[たみ]はこの言葉[ことば]どおりに行[おこな]った。"
  14: "アルタシャスタ王[おう]の第二十[だいにじゅう]年[ねん]から第三十二[だいさんじゅうに]年[ねん]まで、すなわち十二[じゅうに]年間[ねんかん]、私[わたし]がユダの地[ち]で彼[かれ]らの長[おさ]となったその日[ひ]から、私[わたし]も私[わたし]の兄弟[きょうだい]たちも、長[おさ]としての食[しょく]を食[た]べなかった。"
  15: "私[わたし]より前[まえ]の長[おさ]たちは、民[たみ]に重[おも]い負[お]いを負[お]わせ、彼[かれ]らから小麦[こむぎ]とぶどう酒[しゅ]のほかに、銀[ぎん]四十[しじゅう]ドラクマを取[と]っていた。彼[かれ]らの僕[しもべ]たちも民[たみ]の上[うえ]に権[けん]を振[ふ]るっていた。しかし私[わたし]は、神[かみ]への恐[おそ]れのゆえに、そのようにはしなかった。"
  16: "私[わたし]はこの城壁[じょうへき]の仕事[しごと]に加[くわ]わり、畑[はたけ]を手[て]に入[い]れることはなかった。私[わたし]の若者[わかもの]たちはみな、そこでの仕事[しごと]のために集[あつ]められていた。"
  17: "私[わたし]の食卓[しょくたく]には、ユダの人[ひと]々[びと]と長[おさ]たちが百五十人[ひゃくごじゅうにん]、また私[わたし]たちの周[まわ]りの諸国[しょこく]から来[き]た者[もの]たちが着[つ]いた。"
  18: "私[わたし]のために毎日[まいにち]、牛[うし]一頭[いっとう]、選[え]り抜[き]の羊[ひつじ]六匹[ろっぴき]、山羊[やぎ]一匹[いっぴき]が用意[ようい]され、十日[とおか]ごとに、あらゆるぶどう酒[しゅ]がふんだんに用意[ようい]された。それでも私[わたし]は、長[おさ]としての食[しょく]を求[もと]めなかった。この民[たみ]の労苦[ろうく]が重[おも]かったからである。"
  19: "私[わたし]の神[かみ]よ、この民[たみ]のために私[わたし]が行[おこな]ったすべてのことを、良[よ]いこととして覚[おぼ]えていてください。"

notes:
  1: "κραυγὴ τοῦ λαοῦ καὶ γυναικῶν αὐτῶν — «вопль народа и жён их»; 叫び. πρὸς τοὺς ἀδελφοὺς αὐτῶν τοὺς Ιουδαίους — «на братьев их, Иудеев»: ропот бедных против богатых соплеменников, а не против врагов."
  2: "Ἐν υἱοῖς ἡμῶν καὶ ἐν θυγατράσιν ἡμῶν ἡμεῖς πολλοί — «мы многие в сыновьях наших и дочерях наших»: у нас много детей, которых надо кормить; слав. «сынове наши и дщери нашя мнози суть нам». λημψόμεθα σῖτον — «возьмём хлеба» (букв. «пшеницу»); σῖτος — хлеб в зерне, 小麦. ζησόμεθα — «будем жить»."
  3: "ἀγροὶ ἡμῶν καὶ ἀμπελῶνες ἡμῶν καὶ οἰκίαι ἡμῶν, ἡμεῖς διεγγυῶμεν — «поля, виноградники и дома наши мы закладываем» (διεγγυάω — давать в залог; слав. «да дадим в залог»), 抵当. λημψόμεθα σῖτον καὶ φαγόμεθα — «возьмём хлеба и поедим»."
  4: "Ἐδανεισάμεθα ἀργύριον εἰς φόρους τοῦ βασιλέως — «заняли серебро на подати царя» (δανείζω — давать в долг, здесь med. «занимать»; φόρος — подать, 税). Перечисление заложенного продолжается из ст. 3."
  5: "ὡς σὰρξ ἀδελφῶν ἡμῶν σὰρξ ἡμῶν — «как плоть братьев наших, плоть наша»: мы одной крови с ними. καταδυναστεύομεν — «мы порабощаем» (καταδυναστεύω — господствовать силой); 服従させる. οὐκ ἔστιν δύναμις χειρῶν ἡμῶν — «нет силы в руках наших», т. е. нечем выкупить. τοῖς ἐντίμοις — «у знатных» (слав. «у вельмож»)."
  6: "ἐλυπήθην σφόδρα — «я сильно огорчился» (λυπέω); слав. «оскорбех зело», ру «очень рассердился» — ру передаёт иное чувство; выбран греч. смысл."
  7: "ἐβουλεύσατο καρδία μου ἐπ᾽ ἐμέ — «сердце моё решило во мне» (βουλεύομαι); слав. «усоветова сердце мое во мне». ἐμαχεσάμην — «я стал спорить/укорять» (μάχομαι), 責めた. Ἀπαιτήσει ἀνὴρ τὸν ἀδελφὸν αὐτοῦ ὑμεῖς ἀπαιτεῖτε — букв. «требованием требуете вы каждый с брата своего»; слав. понял как лихву: «лихвы ли кийждо от брата своего истяжет»; 利子. ἐκκλησία — собрание, 集会."
  8: "κεκτήμεθα — «мы приобрели» (κτάομαι). τοὺς πωλουμένους τοῖς ἔθνεσιν ἐν ἑκουσίῳ ἡμῶν — «продаваемых народам по воле нашей», т. е. мы выкупали их у язычников. πωλεῖτε — «вы продаёте». οὐχ εὕροσαν λόγον — «не нашли слова [для ответа]», 答える言葉を見つけられなかった."
  9: "Οὐκ ἀγαθὸς ὁ λόγος, ὃν ὑμεῖς ποιεῖτε — «нехорошо дело, которое вы делаете» (λόγος здесь — дело). ἐν φόβῳ θεοῦ ἡμῶν ἀπελεύσεσθε ἀπὸ ὀνειδισμοῦ τῶν ἐθνῶν — «в страхе Бога нашего вы отойдёте от поношения народов»; слав. передаёт вопросом: «тако не во страсе Бога нашего убежите ли от поношения языков врагов наших?»"
  10: "οἱ γνωστοί μου — «знакомые мои» (γνωστός). ἐθήκαμεν ἐν αὐτοῖς ἀργύριον καὶ σῖτον — «мы положили им [в долг] серебро и хлеб» (τίθημι). ἐγκαταλίπωμεν δὴ τὴν ἀπαίτησιν ταύτην — «оставим же это требование» (ἐγκαταλείπω; ἀπαίτησις — взыскание); слав. «оставим убо лихоимство сие»."
  11: "ἐπιστρέψατε — «возвратите» (повеление). ὡς σήμερον — «как [сегодня]», т. е. ныне же (слав. «днесь»). ἐλαίας αὐτῶν — «маслины их», オリーブ畑. ἀπὸ τοῦ ἀργυρίου τὸν σῖτον καὶ τὸν οἶνον καὶ τὸ ἔλαιον — «из серебра — хлеб, вино и масло», т. е. проценты, взятые натурой; 銀から出た…"
  12: "Ἀποδώσομεν καὶ παρ᾽ αὐτῶν οὐ ζητήσομεν — «возвратим и не будем с них требовать». ὥρκισα αὐτοὺς ποιῆσαι ὡς τὸ ῥῆμα τοῦτο — «я заставил их поклясться исполнить это слово» (ὁρκίζω). Клятва даётся перед священниками."
  13: "τὴν ἀναβολήν μου ἐξετίναξα — «я вытряхнул свою накидку/плащ» (ἀναβολή; слав. «отрясох одежду мою») — символический жест. ἐκτινάξαι ὁ θεὸς πάντα ἄνδρα… ἐκ τοῦ οἴκου αὐτοῦ καὶ ἐκ κόπου αὐτοῦ — «да вытряхнет Бог всякого мужа из дома его и из труда его» (κόπος — труд, здесь: нажитое); 労苦. ἐκτετιναγμένος καὶ κενός — «вытрясенный и пустой». Αμην — «аминь». ᾔνεσαν τὸν κύριον — «восхвалили Господа»."
  14: "ἀπὸ ἔτους εἰκοστοῦ καὶ ἕως ἔτους τριακοστοῦ καὶ δευτέρου τῷ Αρθασασθα — «от двадцатого года до тридцать второго года Артаксеркса» (слав. «от лета двадесятаго и даже до лета тридесять втораго»). ἔτη δώδεκα — «двенадцать лет». βίαν αὐτῶν οὐκ ἔφαγον — «насилия их не ел», т. е. не пользовался поборами, положенными наместнику (βία — насилие; слав. «оброку их не ядохом»); 長としての食."
  15: "τὰς βίας τὰς πρώτας — «прежние поборы» (слав. «оброков первых»). ἐβάρυναν ἐπ᾽ αὐτούς — «отягощали их» (βαρύνω). ἐν ἄρτοις καὶ ἐν οἴνῳ — «хлебом и вином». ἔσχατον ἀργύριον, δίδραχμα τεσσαράκοντα — «наконец, серебро — сорок драхм»; слав. «дидрахм четыредесять». οἱ ἐκτετιναγμένοι αὐτῶν — «отряжённые их» (слуги; слав. «служебницы их»). ἐξουσιάζονται ἐπὶ τὸν λαόν — «властвуют над народом». ἀπὸ προσώπου φόβου θεοῦ — «из страха Божия»."
  16: "ἐν ἔργῳ τοῦ τείχους τούτων οὐκ ἐκράτησα — тёмное место: «в работе этой стены я не держался [за долю]»; слав. «в деле стены сия созидах», т. е. сам участвовал в стройке. ἀγρὸν οὐκ ἐκτησάμην — «поля не приобрёл». πάντες οἱ συνηγμένοι ἐκεῖ ἐπὶ τὸ ἔργον — «все собранные там на работу»."
  17: "ἑκατὸν καὶ πεντήκοντα ἄνδρες — «сто пятьдесят мужей»; слав. «сто пятьдесят мужей» (ру «по сто пятидесяти человек»). οἱ ἐρχόμενοι πρὸς ἡμᾶς ἀπὸ τῶν ἐθνῶν τῶν κύκλῳ ἡμῶν — «приходящие к нам из народов окрестных». ἐπὶ τράπεζάν μου — «за стол мой»; предложение без глагола, продолжается в ст. 18."
  18: "εἰς ἡμέραν μίαν — «на один день». μόσχος εἷς — «один телец»; πρόβατα ἓξ ἐκλεκτά — «шесть отборных овец»; χίμαρος — козёл, 山羊. ἀνὰ μέσον δέκα ἡμερῶν — «через каждые десять дней». ἐν πᾶσιν οἶνος τῷ πλήθει — «вина во множестве»; слав. добавляет «(и птицы)» в скобках — в греч. нет, поэтому не внесено. ἄρτους τῆς βίας οὐκ ἐζήτησα — «хлеба [наместничьего] по праву силы не требовал» (слав. «хлеба господству моему не взысках»). δουλεία — служба, 労苦."
  19: "μνήσθητί μου, ὁ θεός, εἰς ἀγαθόν — «помяни меня, Боже, во благо»: обычная у Неемии «памятка» (ср. 13:14, 22, 31). ὅσα ἐποίησα τῷ λαῷ τούτῳ — «всё, что я сделал народу сему»."
