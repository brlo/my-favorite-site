# jp-box, Исход, глава 24. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — csl-ru, ru (с масоретского —
# только для понимания); jp-joc есть для ст. 12–18 (1901, public domain), по нему сверена
# структура фраз. Язык — современный 常体.
# Глава 24: повеление взойти на гору (1–2), народ обещает исполнять слова Господни (3),
# жертвенник и двенадцать камней (4), всесожжения и жертва спасения (5), кровь завета (6–8),
# семьдесят старейшин видят Бога и едят (9–11), Моисей на горе сорок дней (12–18).
# Красного и синего нет: говорит Бог, но это не прямая речь Христа во плоти; «<j>» не ставится.
# Прямая речь — в 「…」; вложенной речи нет.
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено по базе, в т. ч. 24:8 «εἶπεν»).
# Сноска ⟨…⟩: 24:12 石の板 — первое упоминание в корпусе.
# Имена: モーセ, アロン, ナダブ, アビウ, オル; Ἰησοῦς в LXX — ヨシュア (jp-joc: イイスス,
# слав.: Иисус); в тексте ヨシュア, различие в notes.
# jp-ni не использовался.

tr_code: jp-box
book: ish
chapter: 24
draft: true

verses:
  1: "モーセに言[い]われた。「あなたとアロン、ナダブとアビウ、それにイスラエルの七十人[ななじゅうにん]の長老[ちょうろう]たちは、主[しゅ]のもとへ上[のぼ]り、遠[とお]くから主[しゅ]を拝[おが]みなさい。"
  2: "モーセだけが神[かみ]に近[ちか]づく。彼[かれ]らは近[ちか]づいてはならない。民[たみ]も彼[かれ]らとともに上[のぼ]ってはならない。」"
  3: "モーセは来[き]て、神[かみ]のことばと掟[おきて]をすべて民[たみ]に告[つ]げた。民[たみ]はみな、一[ひと]つの声[こえ]で答[こた]えて言[い]った。「主[しゅ]が語[かた]られたことはすべて、わたしたちは行[おこな]い、聞[き]き従[したが]います。」"
  4: "モーセは主[しゅ]のことばをすべて書[か]き記[しる]した。朝[あさ]早[はや]く起[お]きると、山[やま]のふもとに祭壇[さいだん]を築[きず]き、イスラエルの十二[じゅうに]の部族[ぶぞく]に応[おう]じて十二[じゅうに]の石[いし]を立[た]てた。"
  5: "モーセはイスラエルの子[こ]らの中[なか]から若[わか]い者[もの]たちを遣[つか]わした。彼[かれ]らは燔祭[はんさい]を献[ささ]げ、神[かみ]に和解[わかい]のいけにえとして子牛[こうし]を屠[ほふ]った。"
  6: "モーセは血[ち]の半分[はんぶん]を取[と]って器[うつわ]に注[そそ]ぎ、残[のこ]りの血[ち]を祭壇[さいだん]に注[そそ]いだ。"
  7: "モーセは契約[けいやく]の書[しょ]を取[と]って、民[たみ]の耳[みみ]に読[よ]み聞[き]かせた。民[たみ]は言[い]った。「主[しゅ]が語[かた]られたことはすべて、わたしたちは行[おこな]い、聞[き]き従[したが]います。」"
  8: "モーセは血[ち]を取[と]って民[たみ]に振[ふ]りかけて言[い]った。「見[み]よ、これは契約[けいやく]の血[ち]である。主[しゅ]がこれらのすべてのことばについて、あなたがたと結[むす]ばれた契約[けいやく]の血[ち]である。」"
  9: "モーセとアロン、ナダブとアビウ、そしてイスラエルの七十人[ななじゅうにん]の長老[ちょうろう]たちは上[のぼ]った。"
  10: "彼[かれ]らは、イスラエルの神[かみ]が立[た]っておられる場所[ばしょ]を見[み]た。その足[あし]の下[した]には、サファイアのれんがを敷[し]いたようなものがあり、空[そら]の大空[おおぞら]のように澄[す]み切[き]っていた。"
  11: "イスラエルの選[えら]ばれた者[もの]たちのうち、一人[ひとり]も害[がい]を受[う]けなかった。彼[かれ]らは神[かみ]の場所[ばしょ]に現[あらわ]れ、食[た]べ、飲[の]んだ。"
  12: "主[しゅ]はモーセに言[い]われた。「わたしのもとへ、山[やま]に上[のぼ]って、そこにいなさい。わたしはあなたに、石[いし]の板[いた]⟨神[かみ]の掟[おきて]が記[しる]された石[いし]の板[いた]。⟩、すなわち律法[りっぽう]と戒[いまし]めを授[さず]ける。それは彼[かれ]らを教[おし]えるためにわたしが書[か]いたものである。」"
  13: "モーセと、彼[かれ]に仕[つか]えるヨシュアは立[た]ち上[あ]がり、神[かみ]の山[やま]へ登[のぼ]った。"
  14: "彼[かれ]は長老[ちょうろう]たちに言[い]った。「わたしたちがあなたがたのもとへ戻[もど]るまで、ここで静[しず]かに待[ま]っていなさい。見[み]よ、アロンとオルがあなたがたとともにいる。誰[だれ]かに争[あらそ]い事[ごと]が起[お]きたなら、彼[かれ]らのところへ行[い]きなさい。」"
  15: "モーセは山[やま]に登[のぼ]った。ヨシュアもともに登[のぼ]り、雲[くも]が山[やま]を覆[おお]った。"
  16: "神[かみ]の栄光[えいこう]がシナイ山[さん]に下[くだ]り、雲[くも]が六日[むいか]の間[あいだ]その山[やま]を覆[おお]った。七日目[なぬかめ]に、主[しゅ]は雲[くも]の中[なか]からモーセを呼[よ]ばれた。"
  17: "主[しゅ]の栄光[えいこう]の姿[すがた]は、イスラエルの子[こ]らの前[まえ]では、山[やま]の頂[いただき]に燃[も]え上[あ]がる炎[ほのお]のようであった。"
  18: "モーセは雲[くも]の中[なか]に入[はい]り、山[やま]に登[のぼ]った。彼[かれ]は山[やま]の上[うえ]に四十日[しじゅうにち]、四十夜[しじゅうや]いた。"

notes:
  1: "Ἀνάβηθι πρὸς κύριον — 主のもとへ上る. ἑβδομήκοντα τῶν πρεσβυτέρων — 七十人の長老. Ναδαβ, Αβιουδ — ナダブ、アビウ (в LXX Αβιουδ; слав. Авиуд). προσκυνήσουσιν μακρόθεν — 遠くから拝む."
  2: "ἐγγιεῖ Μωϋσῆς μόνος — モーセだけが近づく. ὁ λαὸς οὐ συναναβήσεται — 民もともに上らない (συναναβαίνω)."
  3: "φωνῇ μιᾷ — 一つの声で. ποιήσομεν καὶ ἀκουσόμεθα — 行い、聞き従う (ἀκούω здесь — «слушать, повиноваться»)."
  4: "ὀρθρίσας τὸ πρωΐ — 朝早く起きる (ὀρθρίζω). ᾠκοδόμησεν θυσιαστήριον — 祭壇を築く. δώδεκα λίθους εἰς τὰς δώδεκα φυλάς — двенадцать камней по числу колен."
  5: "νεανίσκους — 若い者たち. ὁλοκαυτώματα — 燔祭. θυσίαν σωτηρίου — 和解のいけにえ (слав. «жертва спасения»). μοσχάρια — 子牛."
  6: "κρατῆρας — 器, чаши. τὸ ἥμισυ τοῦ αἵματος — 血の半分; вторую половину возлил на жертвенник."
  7: "τὸ βιβλίον τῆς διαθήκης — 契約の書. ἀνέγνω εἰς τὰ ὦτα τοῦ λαοῦ — 民の耳に読み聞かせた (семитский оборот)."
  8: "κατεσκέδασεν τοῦ λαοῦ — 民に振りかけた (κατασκεδάννυμι). τὸ αἷμα τῆς διαθήκης — 契約の血 (ср. Мф 26:28; Евр 9:20)."
  9: "γερουσία — 長老団 (слав. «старцы»). Список тот же, что в ст. 1."
  10: "ὁ θεὸς τοῦ Ισραηλ — イスラエルの神. πλίνθος σαπφείρου — サファイアのれんが (πλίνθος — «кирпич, плита»). στερέωμα τοῦ οὐρανοῦ τῇ καθαριότητι — 空の大空のように澄み切って (καθαριότης — «чистота»)."
  11: "τῶν ἐπιλέκτων — 選ばれた者たち. οὐ διεφώνησεν οὐδὲ εἷς — 一人も害を受けなかった (διαφωνέω; слав. «не повредися ни един»). ἔφαγον καὶ ἔπιον — 食べ、飲んだ (трапеза пред Богом)."
  12: "πυξία λίθινα — 石の板 (πυξίον — «табличка»). νομοθετῆσαι — 教えるために (νομοθετέω — «законополагать, учить»). jp-joc: 石版、律法および誡命."
  13: "Ἰησοῦς ὁ παρεστηκὼς αὐτῷ — 彼に仕えるヨシュア (παρεστηκώς — «предстоящий»). В LXX здесь Ἰησοῦς; jp-joc: イイスス, слав.: Иисус — в тексте ヨシュア, чтобы не смешать с Христом."
  14: "Ἡσυχάζετε αὐτοῦ — ここで静かに待つ. Ωρ — オル. ἐάν τινι συμβῇ κρίσις — 争い事が起きたなら (κρίσις — «тяжба»)."
  15: "ἐκάλυψεν ἡ νεφέλη τὸ ὄρος — 雲が山を覆った. У LXX и здесь восходит Иисус (Навин)."
  16: "δόξα τοῦ θεοῦ — 神の栄光. ἓξ ἡμέρας — 六日の間. ἐκ μέσου τῆς νεφέλης — 雲の中から."
  17: "εἶδος τῆς δόξης — 栄光の姿. πῦρ φλέγον — 燃え上がる火. κορυφή — 頂."
  18: "τεσσαράκοντα ἡμέρας καὶ τεσσαράκοντα νύκτας — 四十日四十夜. εἰσῆλθεν εἰς τὸ μέσον τῆς νεφέλης — 雲の中に入る."
