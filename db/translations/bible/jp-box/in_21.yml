# jp-box, Евангелие от Иоанна, глава 21. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий (gr-lxx-byz) — свидетель; расхождения — в 〔…〕 и notes.
# jp-ni не использовался.
#
# Глава после Воскресения: явление на Тивериадском озере (1–14), Пётр и любимый
# ученик (15–23), свидетельство и заключение книги (24–25).
# Слова Христа — в <j>…</j> (5–6, 10, 12, 15–19, 22); слова Петра, учеников,
# любимого ученика — вне тегов; синих стихов нет.
# 21:15–17 ἀγαπάω (Христос) и φιλέω (Пётр) переданы разными глаголами —
# 愛する / 慕う; различие не выровнено, объяснено в notes.

