verses:
  1: "その後[のち]、イエスはまた、ティベリアス湖[こ]のほとりで、ご自身[じしん]を弟子[でし]たちに現[あらわ]された。現[あらわ]された次第[しだい]は、こうである。"
  2: "シモン・ペトロ、ディディモと呼[よ]ばれるトマス、ガリラヤのカナのナタナエル、ゼベダイの子[こ]たち、そしてほかの二人[ふたり]の弟子[でし]たちが、一緒[いっしょ]にいた。"
  3: "シモン・ペトロが「わたしは漁[りょう]に出[で]かける」と言[い]うと、彼[かれ]らは「わたしたちも一緒[いっしょ]に行[い]く」と言[い]った。彼[かれ]らは出[で]て、舟[ふね]に乗[の]り込[こ]んだが、その夜[よる]は何[なに]も獲[え]れなかった。"
  4: "夜[よ]が明[あ]けるころ、イエスが岸[きし]に立[た]たれたが、弟子[でし]たちはそれがイエスだとは分[わ]からなかった。"
  5: "イエスは彼[かれ]らに言[い]われた。「<j>子[こ]どもたちよ、何[なに]か食[た]べるものを持[も]っているか。</j>」彼[かれ]らは答[こた]えた。「いいえ。」"
  6: "イエスは言[い]われた。「<j>舟[ふね]の右[みぎ]側[がわ]に網[あみ]を下[お]ろしなさい。そうすれば、獲[え]れる。</j>」彼[かれ]らは網[あみ]を下[お]ろしたが、魚[さかな]が多[おお]すぎて、もはや引[ひ]き上[あ]げることができなかった。"
  7: "イエスが愛[あい]しておられたあの弟子[でし]が、ペトロに言[い]った。「主[しゅ]だ。」シモン・ペトロは、主[しゅ]だと聞[き]くと、裸[はだか]であったので上着[うわぎ]をまとって、湖[みずうみ]に飛[と]び込[こ]んだ。"
  8: "ほかの弟子[でし]たちは、魚[さかな]の満[み]ちた網[あみ]を引[ひ]きながら、小舟[こぶね]で来[き]た。陸[りく]から遠[とお]くなく、およそ二百[にひゃく]キュビトであったからである。"
  9: "陸[りく]に上[あ]がると、炭火[すみび]が起[お]こしてあり、その上[うえ]に魚[さかな]とパンが置[お]かれているのが見[み]えた。"
  10: "イエスは彼[かれ]らに言[い]われた。「<j>今[いま]獲[え]れた魚[さかな]を、いくつか持[も]って来[き]なさい。</j>」"
  11: "シモン・ペトロは舟[ふね]に上[あ]がり、網[あみ]を陸[りく]まで引[ひ]き上[あ]げた。網[あみ]には大[おお]きな魚[さかな]が百五十三匹[ひゃくごじゅうさんびき]も入[はい]っていた。それほど多[おお]くても、網[あみ]は裂[さ]けなかった。"
  12: "イエスは彼[かれ]らに言[い]われた。「<j>来[き]て、朝[あさ]の食事[しょくじ]をしなさい。</j>」弟子[でし]たちは、それが主[しゅ]だと分[わ]かっていたので、だれも「あなたはどなたですか」と問[と]うことをあえてしなかった。"
  13: "イエスはそばへ来[き]て、パンを取[と]って彼[かれ]らに渡[わた]し、魚[さかな]も同[おな]じようにされた。"
  14: "イエスが死者[ししゃ]の中[なか]から復活[ふっかつ]されてから、弟子[でし]たちに現[あらわ]れたのは、これがすでに三度目[さんどめ]であった。"
  15: "食事[しょくじ]が済[す]むと、イエスはシモン・ペトロに言[い]われた。「<j>ヨナの子[こ]シモン。あなたは、この人[ひと]たち以上[いじょう]に、わたしを愛[あい]しているか。</j>」ペトロは言[い]った。「主[しゅ]よ、はい。あなたは、わたしがあなたを慕[した]っていることをご存[ぞん]じです。」イエスは言[い]われた。「<j>わたしの小羊[こひつじ]を養[やしな]いなさい。</j>」"
  16: "イエスはまた、二度目[にどめ]に彼[かれ]に言[い]われた。「<j>ヨナの子[こ]シモン。あなたはわたしを愛[あい]しているか。</j>」ペトロは言[い]った。「主[しゅ]よ、はい。あなたは、わたしがあなたを慕[した]っていることをご存[ぞん]じです。」イエスは言[い]われた。「<j>わたしの羊[ひつじ]を牧[ぼく]しなさい。</j>」"
  17: "イエスは三度目[さんどめ]に彼[かれ]に言[い]われた。「<j>ヨナの子[こ]シモン。あなたは、わたしを慕[した]っているか。</j>」ペトロは、三度目[さんどめ]に「わたしを慕[した]っているか」と言[い]われたので、心[こころ]を痛[いた]めて言[い]った。「主[しゅ]よ、あなたはすべてをご存[ぞん]じです。あなたは、わたしがあなたを慕[した]っていることをご存[ぞん]じです。」イエスは言[い]われた。「<j>わたしの羊[ひつじ]を養[やしな]いなさい。</j>」"
  18: "「<j>よくよく言[い]っておく。あなたは若[わか]かったとき、自分[じぶん]で帯[おび]を締[し]め、思[おも]うままに歩[ある]いていた。しかし、年[とし]を取[と]ると、あなたは両手[りょうて]を伸[の]べ、他人[たにん]があなたに帯[おび]を締[し]めさせ、思[おも]わぬ所[ところ]へ連[つ]れて行[い]く。</j>」"
  19: "これを言[い]われたのは、ペトロがどのような死[し]によって神[かみ]の栄光[えいこう]を現[あらわ]すかを示[しめ]すためであった。こう言[い]ってから、彼[かれ]に言[い]われた。「<j>わたしに従[したが]いなさい。</j>」"
  20: "ペトロは振[ふ]り向[む]いて、イエスが愛[あい]しておられた弟子[でし]が後[あと]について来[く]るのを見[み]た。その弟子[でし]は、夕食[ゆうしょく]のときイエスの胸[むね]に寄[よ]りかかって、「主[しゅ]よ、あなたを裏切[うらぎ]る者[もの]はだれですか」と言[い]った者[もの]である。"
  21: "そこで、ペトロは彼[かれ]を見[み]て、イエスに言[い]った。「主[しゅ]よ、この人[ひと]はどうなるのですか。」"
  22: "イエスは彼[かれ]に言[い]われた。「<j>わたしが彼[かれ]を、わたしが来[く]るまで残[のこ]しておくことを望[のぞ]んでも、あなたに何[なん]の関[かか]わりがあるか。あなたはわたしに従[したが]いなさい。</j>」"
  23: "そこで、この言葉[ことば]が兄弟[きょうだい]たちの間[あいだ]に広[ひろ]まり、あの弟子[でし]は死[し]なない、と言[い]われるようになった。しかし、イエスは彼[かれ]に「死[し]なない」と言[い]われたのではなく、「わたしが彼[かれ]を、わたしが来[く]るまで残[のこ]しておくことを望[のぞ]んでも、あなたに何[なん]の関[かか]わりがあるか」と言[い]われたのである。"
  24: "これらのことを証[あかし]し、また書[か]き記[しる]した者[もの]は、この弟子[でし]である。わたしたちは、彼[かれ]の証[あかし]が真[まこと]であることを知[し]っている。"
  25: "イエスが行[おこな]われたことは、このほかにも多[おお]くある。それらを一[ひと]つ一[ひと]つ書[か]き記[しる]すなら、書[か]かれた書物[しょもつ]があまりに多[おお]くて、この世界[せかい]にも収[おさ]まりきらないと、わたしは思[おも]う。"

notes:
  1: "θάλασσα τῆς Τιβεριάδος — ティベリアス湖 (ср. 6:1); ἐφανέρωσεν ἑαυτόν — ご自身を現された; ἐφανέρωσεν δὲ οὕτως — 現された次第は、こうである."
  2: "Семь учеников: Симон Пётр, Фома, Нафанаил, сыновья Зеведея и ещё двое; порядок греческого сохранён. Ναθαναήλ — ナタナエル (ср. 1:45). ὁ λεγόμενος Δίδυμος — ディディモと呼ばれる."
  3: "Ὑπάγω ἁλιεύειν — 漁に出かける; ἐπίασαν οὐδέν — 何も獲れなかった. Слова Петра и учеников — не красные; исторический present в греческом передан прошедшим."
  4: "πρωΐας … γενομένης — 夜が明けるころ; οὐ μέντοι ᾔδεισαν — 分からなかった (ср. 20:14)."
  5: "Παιδία — 子どもたちよ (обращение к ученикам, не «дети» в прямом смысле); μή τι προσφάγιον ἔχετε; — 何か食べるものを持っているか; προσφάγιον — «то, что едят с хлебом», рыба. Οὔ — いいえ."
  6: "εἰς τὰ δεξιὰ μέρη — 舟の右側に; οὐκέτι … ἴσχυον — もはや…できなかった; ἀπὸ τοῦ πλήθους τῶν ἰχθύων — 魚が多すぎて."
  7: "ὁ μαθητὴς … ὃν ἠγάπα ὁ Ἰησοῦς — イエスが愛しておられた弟子; без отождествления с Иоанном (евангелист его не называет). ἐπενδύτην διεζώσατο — 上着をまとった; ἦν γὰρ γυμνός — 裸であった (в трудах, без сглаживания); ἔβαλεν ἑαυτὸν εἰς τὴν θάλασσαν — 湖に飛び込んだ."
  8: "πλοιάριον — 小舟; ἀπὸ πηχῶν διακοσίων — およそ二百キュビト (ок. 90 м; мера объяснена в Мф 6:27, сноску не повторяю); σύροντες τὸ δίκτυον — 網を引きながら."
  9: "ἀνθρακιά — 炭火; ὀψάριον — 魚; ἄρτος — パン."
  10: "Ἐνέγκατε ἀπὸ τῶν ὀψαρίων ὧν ἐπιάσατε νῦν — 今獲れた魚をいくつか持って来なさい."
  11: "ἑκατὸν πεντήκοντα τριῶν — 百五十三匹, число сохранено; καὶ τοσούτων ὄντων οὐκ ἐσχίσθη τὸ δίκτυον — それほど多くても網は裂けなかった."
  12: "Δεῦτε ἀριστήσατε — 来て、朝の食事をしなさい; οὐδεὶς … ἐτόλμα ἐξετάσαι — だれも問うことをあえてしなかった; εἰδότες ὅτι ὁ κύριός ἐστιν — それが主だと分かっていた."
  13: "λαμβάνει … δίδωσιν — исторический present; 取って渡し; ὁμοίως — 同じように (рыба и хлеб, без евхаристических обертонов в тексте)."
  14: "τοῦτο ἤδη τρίτον — これがすでに三度目 (ср. 20:19,26); ἐγερθεὶς ἐκ νεκρῶν — 死者の中から復活されて."
  15: "ἀγαπᾷς με πλέον τούτων; — この人たち以上に、わたしを愛しているか (genitivus без уточнения: «больше, чем эти люди любят» или «больше, чем этих»; двусмысленность сохранена). ἀγαπάω → 愛する, φιλέω → 慕う: Пётр отвечает другим глаголом, и это не выровнено. Βόσκε τὰ ἀρνία μου — 小羊を養いなさい (βόσκω — «пасти, кормить»)."
  16: "второй раз Христос спрашивает ἀγαπᾷς; Пётр снова отвечает φιλῶ σε — 慕っている; различие глаголов сохранено. Ποίμαινε τὰ πρόβατά μου — 羊を牧しなさい (ποιμαίνω — «пасти», иной глагол, чем βόσκω; различие с 15 и 17 сохранено)."
  17: "τὸ τρίτον … φιλεῖς με; — третий раз Христос спрашивает уже φιλέω, и Пётр огорчается (ἐλυπήθη), что вопрос понижен до «慕っているか»; 心を痛めて. πάντα σὺ οἶδας — あなたはすべてをご存じです. Βόσκε τὰ πρόβατά μου — 羊を養いなさい."
  18: "ἀμὴν ἀμὴν λέγω σοι — よくよく言っておく (формула Иоанна). ἐζώννυες σεαυτόν — 自分で帯を締め; περιεπάτεις ὅπου ἤθελες — 思うままに歩いていた; ἐκτενεῖς τὰς χεῖρας — 両手を伸べ; ἄλλος σε ζώσει — 他人が帯を締め; οἴσει ὅπου οὐ θέλεις — 思わぬ所へ連れて行く."
  19: "σημαίνων ποίῳ θανάτῳ δοξάσει τὸν θεόν — どのような死によって神の栄光を現すかを示して; Ἀκολούθει μοι — わたしに従いなさい."
  20: "Ἐπιστραφεὶς … βλέπει — 振り向いて見た; ἀνέπεσεν … ἐπὶ τὸ στῆθος — 胸に寄りかかった (ср. 13:23–25); ὁ παραδιδούς σε — あなたを裏切る者."
  21: "οὗτος δὲ τί; — この人はどうなるのですか. Слова Петра — не красные."
  22: "Ἐὰν αὐτὸν θέλω μένειν ἕως ἔρχομαι — わたしが彼を、わたしが来るまで残しておくことを望んでも; τί πρὸς σέ; — あなたに何の関わりがあるか; σύ μοι ἀκολούθει — あなたはわたしに従いなさい (второе «следуй» обращено к Петру)."
  23: "ἐξῆλθεν … ὁ λόγος — この言葉が広まった; οὐκ εἶπεν … ὅτι οὐκ ἀποθνῄσκει — 「死なない」と言われたのではなく; в критическом τί πρὸς σέ при повторе в квадратных скобках — повторено без 〔〕, как уже сказанное."
  24: "ὁ μαρτυρῶν … καὶ γράψας — 証しし、書き記した; οἴδαμεν — わたしたちは…知っている (мн. ч. — голос общины, не «я»)."
  25: "ἃ ἐὰν γράφηται καθ᾽ ἕν — 一つ一つ書き記すなら; οὐδ᾽ αὐτὸν οἶμαι τὸν κόσμον χωρῆσαι — この世界にも収まりきらないと、わたしは思う. В jp-joc в конце «アミン», в критическом тексте его нет — не добавляю."
