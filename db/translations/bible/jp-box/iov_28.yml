verses:
  1: "「銀[ぎん]には、それが産[う]まれる所[ところ]があり、金[きん]には、それが清[きよ]められる所がある。"
  2: "鉄[てつ]は土[つち]から産まれ、銅[どう]は石[いし]のように切[き]り出[だ]される。"
  3: "人[ひと]は闇[やみ]に秩[ちつ]序[じょ]を定[さだ]め、すべての果[は]てを極[きわ]める。暗[くら]い石[いし]も、死[し]の影[かげ]の石も。"
  4: "塵[ちり]から流[なが]れを断[た]ち切[き]ること。正[ただ]しい道[みち]を忘[わす]れた者[もの]たちは弱[よわ]り果[は]て、人[ひと]々[びと]から離[はな]れ去[さ]った。"
  5: "地[ち]からはパンが出[で]る。その下[した]は火[ひ]のように覆[くつがえ]っている。"
  6: "その石[いし]はサファイアの在[あ]りかであり、その塵[ちり]は金[きん]である。"
  7: "その道[みち]を鳥[とり]は知[し]らず、禿鷲[はげわし]の目[め]もそれを見[み]なかった。"
  8: "高[たか]ぶる者[もの]の子[こ]らもそこを踏[ふ]まず、獅子[しし]もそこを通[とお]らなかった。"
  9: "人[ひと]は固[かた]い岩[いわ]に手[て]を伸[の]べ、山[やま]を根[ね]こそぎ倒[たお]す。"
  10: "川[かわ]の流[なが]れを裂[さ]き、すべての貴[とうと]いものをわたしの目[め]は見[み]た。"
  11: "川の深[ふか]みを明[あ]らかにし、自分[じぶん]の力[ちから]を光[ひかり]の中[なか]に示[しめ]した。"
  12: "しかし、知恵[ちえ]はどこに見[み]いだされるのか。知識[ちしき]の場所[ばしょ]はどこにあるのか。"
  13: "人[ひと]はその道[みち]を知[し]らず、人[ひと]々[びと]の中[なか]にそれは見[み]いだされない。"
  14: "深[ふか]い淵[ふち]は言[い]う。『わたしの内[うち]にはない。』海[うみ]も言う。『わたしのもとにはない。』"
  15: "その代[か]わりに宝[たから]が与[あた]えられることはなく、銀[ぎん]もそれと引[ひ]き換[か]えに量[はか]られることはない。"
  16: "オフィルの金[きん]とも、貴[とうと]いオニキスやサファイアとも比[くら]べられない。"
  17: "金[きん]も水晶[すいしょう]もそれに等[ひと]しくなく、それと引[ひ]き換[か]えにされる金の器[うつわ]も及[およ]ばない。"
  18: "高[たか]いものもガビスも、思[おも]い起[おこ]されない。知恵[ちえ]を、最[もっと]も奥[おく]にあるものよりも、さらに引[ひ]き寄[よ]せよ。"
  19: "エチオピアのトパーズもそれに等[ひと]しくなく、純[じゅん]金[きん]とも比[くら]べられない。"
  20: "しかし、知恵[ちえ]はどこに見[み]いだされるのか。悟[さと]りの場所[ばしょ]はどこにあるのか。"
  21: "それはすべての人[ひと]に隠[かく]れ、空[そら]の鳥[とり]たちからも隠されている。"
  22: "滅[ほろ]びと死[し]は言[い]った。『わたしたちはその評判[ひょうばん]を聞[き]いた。』"
  23: "神[かみ]はその道[みち]をよく定[さだ]め、ご自身[じしん]がその場所[ばしょ]を知[し]っておられる。"
  24: "ご自身[じしん]が天[てん]の下[した]のすべてを見[み]渡[わた]し、地[ち]の上[うえ]にあるすべてをご自分[じぶん]が造[つく]られたものとして知[し]っておられるからである。"
  25: "風[かぜ]に重[おも]さを、水[みず]に量[はかり]を定[さだ]め、"
  26: "雨[あめ]を数[かぞ]え、雷[かみなり]のとどろきの中[なか]に道[みち]を与[あた]えられたとき、"
  27: "そのとき、神[かみ]は知恵[ちえ]を見[み]、それを告[つ]げ、備[そな]えて、極[きわ]め尽[つ]くされた。"
  28: "そして人[ひと]に言[い]われた。『見[み]よ、神[かみ]を畏[おそ]れること、それが知恵[ちえ]である。悪[わる]から遠[とお]ざかること、それが知識[ちしき]である。』」"

notes:
  1: "Иов (продолжение речи, начатой в 27:2; в начале главы цитата открыта снова). ἔστιν γὰρ ἀργυρίῳ τόπος, ὅθεν γίνεται — «ибо есть серебру место, откуда оно бывает»: τόπος — «место» (здесь жила, рудник). τόπος δὲ χρυσίῳ, ὅθεν διηθεῖται — «и место золоту, откуда оно процеживается»: διηθέω — «процеживать, очищать». Слав. «есть бо сребру место, отюнудуже и бывает»."
  2: "Иов. σίδηρος μὲν γὰρ ἐκ γῆς γίνεται — «ибо железо из земли бывает». χαλκὸς δὲ ἴσα λίθῳ λατομεῖται — «и медь, как камень, высекается»: λατομέω — «высекать камень». Слав. «медь же равно камению сечется»."
  3: "Иов. τάξιν ἔθετο σκότει — «чин положил тьме», т. е. установил порядок мраку: τάξις — «порядок, чин» (в тексте 秩序). πᾶν πέρας αὐτὸς ἐξακριβάζεται — «всякий предел он точно исследует»: ἐξακριβάζω — «изыскивать до конца»; подлежащее — человек-рудокоп (слав. «сам испытует» допускает и Бога). λίθος σκοτία καὶ σκιὰ θανάτου — «камень — тьма и тень смерти», тёмный оборот, предмет поиска; сохранён."
  4: "Иов. διακοπὴ χειμάρρου ἀπὸ κονίας — «прорыв потока из пыли»: χείμαρρος — «поток»; κονία — «пыль, известь». οἱ δὲ ἐπιλανθανόμενοι ὁδὸν δικαίαν ἠσθένησαν ἐκ βροτῶν — «забывающие правый путь изнемогли вдали от людей»: ἀσθενέω — «изнемогать»; ἐκ βροτῶν — «от смертных». Тёмное место, близкое к описанию рудника; слав. «пресечение потока от праха… от человек подвигошася»; в Синодальном иной образ («рудокопный колодезь») — по масоретскому тексту, не вносим."
  5: "Иов. γῆ, ἐξ αὐτῆς ἐξελεύσεται ἄρτος — «земля, из неё выйдет хлеб»: ἄρτος — «хлеб». ὑποκάτω αὐτῆς ἐστράφη ὡσεὶ πῦρ — «под ней она обратилась как огонь»: στρέφω — «поворачивать»; образ недр, выжженных как огнём. Слав. «есть земля, из неяже изыдет хлеб»."
  6: "Иов. τόπος σαπφείρου οἱ λίθοι αὐτῆς — «место сапфира — камни её»: σάπφειρος — «сапфир». χῶμα, χρυσίον αὐτῷ — «прах — золото ему (ей)»: χῶμα — «насыпь, прах»; слав. «место сапфира камение ея, и персть злато ему»."
  7: "Иов. τρίβος, οὐκ ἔγνω αὐτὴν πετεινόν — «стезя, не познала её птица»: τρίβος — «тропа»; πετεινόν — «птица». οὐ παρέβλεψεν αὐτὴν ὀφθαλμὸς γυπός — «и не увидел её глаз грифа»: παραβλέπω — «провидеть»; γύψ — «гриф, коршун» (слав. «супово»)."
  8: "Иов. οὐκ ἐπάτησαν αὐτὴν υἱοὶ ἀλαζόνων — «не ступали по ней сыны гордых»: ἀλαζών — «хвастливый, надменный». οὐ παρῆλθεν ἐπ᾿ αὐτῆς λέων — «и не прошёл по ней лев». Слав. «сынове величавых… не прейде по ней лев»."
  9: "Иов. ἐν ἀκροτόμῳ ἐξέτεινεν χεῖρα αὐτοῦ — «на граните простёр руку свою»: ἀκρότομος — «утёс, гранит». κατέστρεψεν δὲ ἐκ ῥιζῶν ὄρη — «и опрокинул горы с корнем»: καταστρέφω — «ниспровергать»; ῥίζα — «корень». Рудокоп как разрушитель гор; слав. «на несекоме камени простре руку»."
  10: "Иов. δίνας δὲ ποταμῶν ἔρρηξεν — «и русла рек прорвал»: δίνη — «водоворот, русло»; ῥήγνυμι — «прорывать». πᾶν δὲ ἔντιμον εἶδέν μου ὁ ὀφθαλμός — «всякое драгоценное увидел глаз мой»: внезапная смена лица на 1-е (слав. «виде око мое»); сохранена без сглаживания."
  11: "Иов. βάθη δὲ ποταμῶν ἀνεκάλυψεν — «глубины рек открыл»: ἀνακαλύπτω — «открывать, обнажать». ἔδειξεν δὲ ἑαυτοῦ δύναμιν εἰς φῶς — «и показал свою силу на свет», т. е. вынес сокровенное на свет. Слав. «глубины же рек откры и показа силу свою на свет»."
  12: "Иов. ἡ δὲ σοφία πόθεν εὑρέθη — «премудрость же откуда нашлась?»: σοφία — 知恵. ποῖος δὲ τόπος ἐστὶν τῆς ἐπιστήμης — «и какое место есть ведения?»: ἐπιστήμη — «знание, ведение» (в тексте 知識). Первый рефрен поэмы; второй — ст. 20."
  13: "Иов. οὐκ οἶδεν βροτὸς ὁδὸν αὐτῆς — «не знает человек пути её»: βροτός — «смертный». οὐδὲ μὴ εὑρεθῇ ἐν ἀνθρώποις — «и не найдётся она среди людей»: усиленное отрицание οὐδὲ μή. Слав. «не весть человек пути ея»."
  14: "Иов. ἄβυσσος εἶπεν Οὐκ ἔστιν ἐν ἐμοί — «бездна сказала: нет во мне»: ἄβυσσος — «бездна, пучина»; прямая речь внутри речи Иова — 『…』. θάλασσα εἶπεν Οὐκ ἔστιν μετ᾿ ἐμοῦ — «и море сказало: нет со мною». Олицетворение глубин; слав. «бездна рече: несть во мне»."
  15: "Иов. οὐ δώσει συγκλεισμὸν ἀντ᾿ αὐτῆς — «не даст сокровища за неё»: συγκλεισμός — «заключение, запор» (тёмное слово; слав. «сокровище»). οὐ σταθήσεται ἀργύριον ἀντάλλαγμα αὐτῆς — «и не станет серебро ценой её»: ἀντάλλαγμα — «обмен, выкуп». Слав. «не дастся сокровище за ню»."
  16: "Иов. οὐ συμβασταχθήσεται χρυσίῳ Ωφιρ — «не сравнится с золотом Офира»: συμβασταχθέω — «быть взвешенным вместе, сравниться»; Ωφιρ — オフィル. ἐν ὄνυχι τιμίῳ καὶ σαπφείρῳ — «с ониксом драгоценным и сапфиром»: ὄνυξ — «оникс». Слав. «не сравнится со златом софирским»."
  17: "Иов. οὐκ ἰσωθήσεται αὐτῇ χρυσίον καὶ ὕαλος — «не сравняется с нею золото и хрусталь»: ἰσόω — «уравнивать»; ὕαλος — «хрусталь, стекло» (в тексте 水晶). τὸ ἄλλαγμα αὐτῆς σκεύη χρυσᾶ — «обмен её — сосуды золотые»: ἄλλαγμα — «обмен, выкуп»; в греч. сказуемое при втором члене опущено, в тексте оно восполнено 及ばない. Слав. «не равно будет ей злато и кристаль, и изменение ея сосуди злати»."
  18: "Иов. μετέωρα καὶ γαβις οὐ μνησθήσεται — «высокое и габис не помянутся»: μετέωρα — «высоты, воздушные явления», тёмное слово; γαβις — транслитерация евр. גָּבִישׁ («кристалл, кварц»), оставлена как ガビス. ἕλκυσον σοφίαν ὑπὲρ τὰ ἐσώτατα — «привлеки премудрость более сокровенного»: ἕλκω — «влечь, привлекать»; ἐσώτατα — «самое внутреннее». Слав. «превысокая и бисерие не помянутся… притяжи премудрость паче внутреннейших»."
  19: "Иов. οὐκ ἰσωθήσεται αὐτῇ τοπάζιον Αἰθιοπίας — «не сравняется с нею топаз Эфиопии»: τοπάζιον — «топаз». χρυσίῳ καθαρῷ οὐ συμβασταχθήσεται — «с чистым золотом не сравнится». Слав. «не уравнится ей топазий ефиопский»."
  20: "Иов. ἡ δὲ σοφία πόθεν εὑρέθη — «премудрость же откуда нашлась?»: повтор рефрена ст. 12. ποῖος δὲ τόπος ἐστὶν τῆς συνέσεως — «и какое место есть разума?»: σύνεσις — «понимание, разум» (в тексте 悟り; ср. ἐπιστήμη — 知識 в ст. 12)."
  21: "Иов. λέληθεν πάντα ἄνθρωπον — «утаилась от всякого человека»: λανθάνω — «укрываться, быть скрытым». ἀπὸ πετεινῶν τοῦ οὐρανοῦ ἐκρύβη — «и от птиц небесных скрылась». Слав. «утаися от всякаго человека»."
  22: "Иов. ἡ ἀπώλεια καὶ ὁ θάνατος εἶπαν — «погибель и смерть сказали»: ἀπώλεια — «погибель» (в евр. Аваддон); прямая речь внутри речи Иова — 『…』. Ἀκηκόαμεν δὲ αὐτῆς τὸ κλέος — «слышали мы славу её»: κλέος — «молва, слава» (в тексте 評判). Слав. «пагуба и смерть рекосте: слышахом ея славу»."
  23: "Иов. ὁ θεὸς εὖ συνέστησεν αὐτῆς τὴν ὁδόν — «Бог хорошо устроил путь её»: συνίστημι — «составлять, утверждать»; εὖ — «хорошо». αὐτὸς δὲ οἶδεν τὸν τόπον αὐτῆς — «Он знает место её». Слав. «Бог благо позна ея путь»."
  24: "Иов. αὐτὸς γὰρ τὴν ὑπ᾿ οὐρανὸν πᾶσαν ἐφορᾷ — «ибо Он всю поднебесную обозревает»: ἐφοράω — «озирать, надзирать». εἰδὼς τὰ ἐν τῇ γῇ πάντα, ἃ ἐποίησεν — «зная всё на земле, что сотворил». Слав. «ибо сам поднебесную всю надзирает»."
  25: "Иов. ἀνέμων σταθμὸν ὕδατός τε μέτρα — «ветрам вес и водам меру»: σταθμός — «вес»; μέτρον — «мера». Стих — придаточное, продолжается в ст. 26; слав. «ветров вес и воде меру егда сотворил»."
  26: "Иов. ὅτε ἐποίησεν οὕτως — «когда сотворил так». ὑετὸν ἠρίθμησεν — «дождь исчислил»: ἀριθμέω — «считать»; ὑετός — «дождь». ὁδὸν ἐν τινάγματι φωνάς — «путь в потрясении голоса», т. е. путь грому: τίναγμα — «потрясение, удар». Слав. «и путь в сотрясении гласов»."
  27: "Иов. τότε εἶδεν αὐτὴν καὶ ἐξηγήσατο αὐτήν — «тогда увидел её и изъяснил её»: ἐξηγέομαι — «изъяснять, возвещать». ἑτοιμάσας ἐξιχνίασεν — «приготовив, исследовал»: ἑτοιμάζω — «готовить»; ἐξιχνιάζω — «разыскивать, исследовать». Слав. «тогда виде ю и поведа ю, уготовав изследи»."
  28: "Иов; слова Бога внутри его речи — 『…』. εἶπεν δὲ ἀνθρώπῳ — «и сказал человеку». Ἰδοὺ ἡ θεοσέβειά ἐστιν σοφία — «вот, благочестие есть премудрость»: θεοσέβεια — «богобоязненность, благочестие» (в тексте 神を畏れること). τὸ δὲ ἀπέχεσθαι ἀπὸ κακῶν ἐστιν ἐπιστήμη — «удаление от зла есть ведение». В евр. и Синодальном «страх Господень»; LXX и слав. дают θεοσέβεια / «благочестие», держимся их. Цитата закрыта."
