# jp-box, Иов, глава 28. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский
# (csl-ru) по паритету (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes);
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге только 1–2;
# jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 28: поэма о премудрости, продолжение речи Иова без новой формулы, поэтому
# в начале главы цитата открывается снова и закрыта в ст. 28. Ст. 1–11 — труд
# рудокопа, который достаёт из земли всё, кроме премудрости; 12–19 — рефрен
# «где премудрость?» и её несоизмеримость с золотом и камнями; 20–28 — премудрость
# у Бога, и слово Бога человеку (ст. 28, 『…』 внутри речи Иова).
# Красного и синего нет.
# Нумерация по gr: 28 стихов; деление совпадает с csl-ru и ru.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz. Сносок ⟨…⟩ нет.
# Имена и камни — транслитерация греческого (LXX): Ωφιρ — オフィル, γαβις — ガビス.

