verses:
  0: "指揮者[しきしゃ]に。歌[うた]をもって。ダビデの教訓[きょうくん]の歌[うた]。"
  1: "神[かみ]よ、わたしの祈[いの]りに耳[みみ]を傾[かたむ]け、わたしの願[ねが]いをないがしろにしないでください。"
  2: "わたしに目[め]を留[と]め、わたしの声[こえ]を聞[き]いてください。わたしは思[おも]い煩[わずら]いのうちに悲[かな]しみ、心[こころ]は乱[みだ]れた。"
  3: "敵[てき]の声[こえ]のため、罪[つみ]人[びと]の苦[くる]しめのためである。彼[かれ]らはわたしに不[ふ]法[ほう]を押[お]しつけ、怒[いか]りをもってわたしを憎[にく]んでいる。"
  4: "わたしの心[こころ]はうちで乱[みだ]れ、死[し]の恐[おそ]れがわたしに降[ふ]りかかった。"
  5: "恐[おそ]れと震[ふる]えがわたしに来[き]て、暗[やみ]がわたしを覆[おお]った。"
  6: "わたしは言[い]った。「だれがわたしに鳩[はと]の翼[つばさ]を与[あた]えてくれるのか。わたしは飛[と]び去[さ]って休[やす]みたい。」"
  7: "見[み]よ、わたしは遠[とお]くへ逃[に]げ、荒野[あらの]に宿[やど]った。"
  8: "わたしは、気[き]力[りょく]の尽[つ]きるときにも、嵐[あらし]の中[なか]でも、わたしを救[すく]う方[かた]を待[ま]っていた。"
  9: "主[しゅ]よ、彼[かれ]らを沈[しず]め、その舌[した]を分[わ]け散[ち]らしてください。わたしは都[みやこ]のうちに不[ふ]法[ほう]と争[あらそ]いとを見[み]たからである。"
  10: "昼[ひる]も夜[よる]も、その城壁[じょうへき]の上[うえ]を巡[めぐ]る。その中[なか]には不[ふ]法[ほう]と苦[くる]しみとがあり、不[ふ]正[せい]がある。"
  11: "その広[ひろ]場[ば]からも、利[り]子[し]と欺[あざむ]きとが絶[た]えることがない。"
  12: "もしも敵[てき]がわたしをそしったのなら、わたしは耐[た]えたであろう。もしもわたしを憎[にく]む者がわたしに向[む]かって高[たか]ぶって語[かた]ったのなら、わたしは彼[かれ]から身[み]を隠[かく]したであろう。"
  13: "しかし、あなたはわたしと同[おな]じ魂[たましい]の者[もの]、わたしの友[とも]、わたしの知[し]り合[あ]いであった。"
  14: "あなたはわたしとともに食[た]べ物[もの]を味[あじ]わい、わたしたちは神[かみ]の家[いえ]を、一[ひと]つ心[こころ]で歩[あゆ]んだ。"
  15: "彼[かれ]らに死[し]が臨[のぞ]み、彼[かれ]らが生[い]きたまま陰府[よみ]に下[くだ]るように。彼[かれ]らの住[す]まいのうちにも、彼[かれ]らの中[なか]にも、悪[わる]いことがあるからである。"
  16: "しかし、わたしは神[かみ]に呼[よ]ばわった。主[しゅ]はわたしの声[こえ]を聞[き]いてくださった。"
  17: "夕[ゆう]べにも、朝[あさ]にも、昼[ひる]にも、わたしは語[かた]り、告[つ]げ知[し]らせる。主[しゅ]はわたしの声[こえ]を聞[き]いてくださる。"
  18: "主[しゅ]は、わたしに近[ちか]づく者[もの]たちから、わたしの魂[たましい]を平和[へいわ]のうちに贖[あがな]い出[だ]される。彼[かれ]らは多[おお]く、わたしのそばにいるからである。"
  19: "神[かみ]は聞[き]いて、彼[かれ]らを低[ひく]くされる。世[よ]の始[はじ]めより前[まえ]からおられる方[かた]である。彼[かれ]らには立[た]ち返[かえ]ることがない。神[かみ]を恐[おそ]れなかったからである。"
  20: "彼[かれ]は手[て]を伸[の]ばして報[むく]いを返[かえ]そうとし、神[かみ]の契約[けいやく]を汚[けが]した。"
  21: "彼[かれ]らは神[かみ]の怒[いか]りの顔[かお]から分[わ]かれ、その心[こころ]は近[ちか]づいた。その言葉[ことば]は油[あぶら]よりも柔[やわ]らかだが、それは矢[や]である。"
  22: "あなたの思[おも]い煩[わずら]いを主[しゅ]に投[な]げかけよ。主[しゅ]があなたを養[やしな]ってくださる。主[しゅ]は正[ただ]しい者[もの]を、いつまでも揺[ゆ]るがせておかれない。"
  23: "しかし、神[かみ]よ、あなたは彼[かれ]らを滅[ほろ]びの穴[あな]に下[くだ]される。血[ち]を流[なが]す者[もの]、欺[あざむ]く者[もの]は、生[い]きながらその日[ひ]の半[なか]ばに達[たっ]することがない。わたしは主[しゅ]よ、あなたに望[のぞ]みを置[お]く。"

notes:
  0: "Εἰς τὸ τέλος, ἐν ὕμνοις· συνέσεως τῷ Δαυιδ — 指揮者に。歌をもって。ダビデの教訓の歌 (εἰς τὸ τέλος — «в конец», т. е. начальнику хора; σύνεσις — «разум, учение», у jp-joc 敎訓). Надписание — стих 0, скобками не маркируется."
  1: "Ἐνώτισαι… τὴν προσευχήν μου — 祈りに耳を傾け (ἐνωτίζομαι — «внимать», букв. «принимать в уши»). μὴ ὑπερίδῃς τὴν δέησίν μου — 願いをないがしろにしないでください (ὑπεροράω — «презирать, оставлять без внимания»)."
  2: "πρόσχες μοι καὶ εἰσάκουσόν μου — 目を留め、声を聞いてください. ἐλυπήθην ἐν τῇ ἀδολεσχίᾳ μου — 思い煩いのうちに悲しみ (ἀδολεσχία — «размышление, сетование»; у jp-joc «в печали»). ἐταράχθην — 心は乱れた."
  3: "ἀπὸ φωνῆς ἐχθροῦ — 敵の声のため. ἀπὸ θλίψεως ἁμαρτωλοῦ — 罪人の苦しめのため. ἐξέκλιναν ἐπ᾽ ἐμὲ ἀνομίαν — わたしに不法を押しつけ (ἐκκλίνω — «склонять, налагать»). ἐν ὀργῇ ἐνεκότουν μοι — 怒りをもって憎んでいる (ἐγκότω — «затаивать злобу»)."
  4: "ἡ καρδία μου ἐταράχθη ἐν ἐμοί — 心はうちで乱れ. δειλία θανάτου ἐπέπεσεν ἐπ᾽ ἐμέ — 死の恐れが降りかかった (δειλία — «робость»; слав. «боязнь смертная»)."
  5: "φόβος καὶ τρόμος ἦλθεν ἐπ᾽ ἐμέ — 恐れと震えが来て. ἐκάλυψέν με σκότος — 闇が覆った (слав. «покры мя тьма»)."
  6: "Τίς δώσει μοι πτέρυγας ὡσεὶ περιστερᾶς — だれが鳩の翼を与えてくれるのか (еврейский оборот пожелания, ср. «кто даст ми криле»). πετασθήσομαι καὶ καταπαύσω — 飛び去って休みたい (καταπαύω — «успокоиться»). Свои слова псалмопевца — 「」."
  7: "ἰδοὺ ἐμάκρυνα φυγαδεύων — 見よ、遠くへ逃げ (φυγαδεύω — «спасаться бегством»). ηὐλίσθην ἐν τῇ ἐρήμῳ — 荒野に宿った (αὐλίζομαι — «ночевать под открытым небом»). διάψαλμα не передаётся."
  8: "προσεδεχόμην τὸν σῴζοντά με — 救う方を待っていた. ἀπὸ ὀλιγοψυχίας καὶ καταιγίδος — 気力の尽きるときにも、嵐の中でも (ὀλιγοψυχία — «малодушие»; καταιγίς — «буря»)."
  9: "καταπόντισον, κύριε — 主よ、沈めて (καταποντίζω — «потопить»). καταδίελε τὰς γλώσσας αὐτῶν — その舌を分け散らして (διαιρέω; ср. Быт 11:7). εἶδον ἀνομίαν καὶ ἀντιλογίαν ἐν τῇ πόλει — 都のうちに不法と争いを見た."
  10: "ἡμέρας καὶ νυκτὸς κυκλώσει αὐτὴν ἐπὶ τὰ τείχη αὐτῆς — 昼も夜も城壁の上を巡る (подлежащее в греч. не названо; у jp-joc — враги). ἀνομία καὶ κόπος ἐν μέσῳ αὐτῆς καὶ ἀδικία — その中に不法と苦しみと不正."
  11: "οὐκ ἐξέλιπεν ἐκ τῶν πλατειῶν αὐτῆς τόκος καὶ δόλος — 広場からも利子と欺きが絶えない (τόκος — «рост, лихва»; δόλος — «коварство»)."
  12: "εἰ ἐχθρὸς ὠνείδισέν με, ὑπήνεγκα ἄν — もし敵がそしったなら耐えたであろう (ὑποφέρω — «переносить»). ἐμεγαλορρημόννησεν — 高ぶって語った (μεγαλορρημονέω). ἐκρύβην ἂν ἀπ᾽ αὐτοῦ — 身を隠したであろう."
  13: "σὺ δέ, ἄνθρωπε ἰσόψυχε — しかし、あなたは同じ魂の者 (ἰσόψυχος — «равный душой», слав. «равнодушне»). ἡγεμών μου καὶ γνωστέ μου — わたしの友、知り合い (ἡγεμών — «вождь»; γνωστός — «знакомый»)."
  14: "ὃς ἐπὶ τὸ αὐτό μοι ἐγλύκανας ἐδέσματα — ともに食べ物を味わい (γλυκαίνω — «делать сладким»). ἐν τῷ οἴκῳ τοῦ θεοῦ ἐπορεύθημεν ἐν ὁμονοίᾳ — 神の家を一つ心で歩んだ (ὁμόνοια — «единомыслие»)."
  15: "ἐλθέτω θάνατος ἐπ᾽ αὐτούς — 彼らに死が臨むように. καταβήτωσαν εἰς ᾅδου ζῶντες — 生きながら陰府に下るように (ᾅδης — 陰府, как везде в корпусе). πονηρίαι ἐν ταῖς παροικίαις αὐτῶν — 住まいのうちにも悪いことがある (παροικία — «жилище, странствие»)."
  16: "ἐγὼ δὲ πρὸς τὸν θεὸν ἐκέκραξα — しかし、わたしは神に呼ばわった (κράζω — «взывать»). ὁ κύριος εἰσήκουσέν μου — 主は声を聞いてくださった."
  17: "ἑσπέρας καὶ πρωῒ καὶ μεσημβρίας — 夕べにも、朝にも、昼にも. διηγήσομαι· ἀπαγγελῶ — 語り、告げ知らせる (два глагола сохранены). εἰσακούσεται τῆς φωνῆς μου — 主は声を聞いてくださる."
  18: "λυτρώσεται ἐν εἰρήνῃ τὴν ψυχήν μου — 魂を平和のうちに贖い出す (λυτρόω — «выкупать»). ἀπὸ τῶν ἐγγιζόντων μοι — 近づく者たちから. ὅτι ἐν πολλοῖς ἦσαν σὺν ἐμοί — 彼らは多く、わたしのそばにいる (тёмное место; у jp-joc «их много»)."
  19: "ὁ ὑπάρχων πρὸ τῶν αἰώνων — 世の始めより前からおられる方. οὐ γάρ ἐστιν αὐτοῖς ἀντάλλαγμα — 彼らには立ち返ることがない (ἀντάλλαγμα — «перемена, замена»; слав. «несть им изменения»). οὐκ ἐφοβήθησαν τὸν θεόν — 神を恐れなかった."
  20: "ἐξέτεινεν τὴν χεῖρα αὐτοῦ ἐν τῷ ἀποδιδόναι — 手を伸ばして報いを返し. ἐβεβήλωσαν τὴν διαθήκην αὐτοῦ — 契約を汚した (βεβηλόω — «осквернять»)."
  21: "διεμερίσθησαν ἀπὸ ὀργῆς τοῦ προσώπου αὐτοῦ — 怒りの顔から分かれ (тёмное место, слав. «разделишася от гнева лица его»). ἤγγισεν ἡ καρδία αὐτοῦ — 心は近づいた. ἡπαλύνθησαν οἱ λόγοι αὐτοῦ ὑπὲρ ἔλαιον — 言葉は油よりも柔らかい (παλύνω — «смягчать»). αὐτοί εἰσιν βολίδες — それは矢である (βολίς — «стрела, дротик»)."
  22: "ἐπίρριψον ἐπὶ κύριον τὴν μέριμνάν σου — 思い煩いを主に投げかけよ (знаменитое «возверзи на Господа»; в базе стих 22, не 23 — нумерация LXX без сдвига). αὐτός σε διαθρέψει — 主が養ってくださる (διατρέφω — «кормить, содержать»). οὐ δώσει εἰς τὸν αἰῶνα σάλον τῷ δικαίῳ — 正しい者をいつまでも揺るがせない (σάλος — «колебание»)."
  23: "κατάξεις αὐτοὺς εἰς φρέαρ διαφθορᾶς — 滅びの穴に下される (φρέαρ — «колодец, яма»; διαφθορά — «тление»). ἄνδρες αἱμάτων καὶ δολιότητος — 血を流す者、欺く者 (δολιότης — «коварство»). οὐ μὴ ἡμισεύσωσιν τὰς ἡμέρας αὐτῶν — 生きながらその日の半ばに達することがない (ἡμισεύω — «достигать половины»). ἐγὼ δὲ ἐλπιῶ ἐπὶ σέ — わたしはあなたに望みを置く."
