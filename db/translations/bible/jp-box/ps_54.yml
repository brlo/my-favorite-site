# jp-box, Псалтирь, псалом 54. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный 常体, без 文語.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0.
# Псалом 54: молитва гонимого (1–2), страх и желание улететь (3–8),
# беззаконие в городе (9–11), измена друга (12–15), упование на Бога (16–23).
# Красного и синего нет. Кавычки: свои слова псалмопевца в 6 — 「…」 (первый уровень).
# 〔…〕 нет: все слова в gr-lxx-byz есть (сверено с выгрузкой).
# セラ (διάψαλμα, в 7 и 19) не передаётся — по решению пользователя, как у jp-joc.
# Сносок ⟨…⟩ нет: 鳩, 翼, 荒野, 陰府 уже встречались в корпусе.
# jp-ni не использовался.

