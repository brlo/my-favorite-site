# jp-box, 1-я Паралипоменон, глава 17. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); по паритету csl-ru — второй свидетель церковного
# текста: его чтения и добавления входят в основной текст без 〔…〕, отличия LXX — в notes.
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет,
# jp-ni (943 стиха, под авторским правом) источником не был.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 17: замысел Давида построить дом (1–2), слово Господа Натану (3–14),
# пересказ пророка (15), молитва Давида (16–27). Параллель — 2 Цар 7.
# Речь: слова Господа 4–14 — 『…』; молитва Давида 16–27 — 「…」; в 24 внутри
# молитвы слова народа 『…』. Красного нет.
# 〔…〕 нет. csl-добавления внесены в основной текст: 17:19 полный текст стиха,
# 17:20 «Бога», 17:23 «и сотвори якоже глаголал еси», 17:24 «и да уверится
# и возвеличится имя твое даже до века». Помета csl в скобках (17:25
# «(дерзновение)») не внесена.
# Сносок ⟨…⟩ нет: 契約の箱, 預言者, 幕屋, 燔祭, 王座, 慈しみ уже в корпусе.
# Отличия LXX/csl: 17:9 слав. прошедшее «дах/насадих» при будущем LXX — взят LXX,
# в 17:6 слав. «чесо ради» (почему); 17:17 ὡς ὅρασις ἀνθρώπου — тёмное место;
# 17:27 слав. императив «начни благословити» при аористе LXX — принят csl.
# jp-ni не использовался.

