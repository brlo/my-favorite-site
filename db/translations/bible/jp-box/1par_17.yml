verses:
  1: "ダビデが自分[じぶん]の家[いえ]に住[す]むようになったとき、ダビデは預言者[よげんしゃ]ナタンに言[い]った。「見[み]よ、わたしは杉[すぎ]の家に住んでいるのに、主[しゅ]の契約[けいやく]の箱[はこ]は革[かわ]の覆[おお]いの下[した]にある。」"
  2: "ナタンはダビデに言[い]った。「あなたの心[こころ]にあることは何[なに]でも、行[い]ってそのとおりにしなさい。神[かみ]があなたとともにおられるからだ。」"
  3: "その夜[よる]、主[しゅ]の言葉[ことば]がナタンに臨[のぞ]んで言[い]った。"
  4: "『行[い]って、わたしのしもべダビデに言[い]いなさい。主[しゅ]はこう言[い]われる。あなたが、わたしの住[す]む家[いえ]を建[た]てるのではない。"
  5: "わたしは、イスラエルの子[こ]らをエジプトから導[みちび]き上[あ]げた日[ひ]から今日[きょう]まで、家[いえ]に住[す]んだことがない。かえって、天幕[てんまく]と仮住[かりずま]いの中[なか]にいた。"
  6: "わたしがイスラエルのすべてとともに歩[あゆ]んだすべての所[ところ]で、わたしの民[たみ]を飼[か]うように命[めい]じたイスラエルの一[ひと]つの部族[ぶぞく]にでも、なぜ、わたしに杉[すぎ]の家[いえ]を建[た]てなかったのかと言[い]ったことがあるか。"
  7: "今[いま]、わたしのしもべダビデにこう言[い]いなさい。万軍[ばんぐん]の主[しゅ]はこう言[い]われる。わたしは、羊[ひつじ]の群[む]れを追[お]って歩[ある]いていたあなたを取[と]って、わたしの民[たみ]イスラエルの上[うえ]に立[た]つ者[もの]とした。"
  8: "わたしはあなたが行[い]くすべての所[ところ]であなたとともにいた。あなたの前[まえ]からすべての敵[てき]を滅[ほろ]ぼし、あなたの名[な]を、地上[ちじょう]の大[おお]いなる者[もの]たちの名のように名高[なだか]くした。"
  9: "わたしはわたしの民[たみ]イスラエルのために場所[ばしょ]を定[さだ]め、彼[かれ]らを植[う]え付[つ]ける。彼らはそこに落[お]ち着[つ]いて住み、もはや心配[しんぱい]することもない。不正[ふせい]の子[こ]らが、初[はじ]めのときのように彼らを卑[ひく]くすることも、もはやない。"
  10: "すなわち、わたしがわたしの民イスラエルの上[うえ]に裁[さば]き人[びと]たちを立[た]てた日[ひ]からそうである。わたしはすべての敵[てき]からあなたを安[やす]らかにし、あなたを大[おお]きくする。主[しゅ]はあなたのために家[いえ]を建[た]てる。"
  11: "あなたの日[ひ]々[び]が満[み]ちて、あなたが父祖[ふそ]たちとともに眠[ねむ]るとき、わたしはあなたの後[あと]に、あなたの胎[たい]から出[で]るあなたの子孫[ししそん]を立[た]ち上[あ]がらせ、その王国[おうこく]を整[ととの]える。"
  12: "彼[かれ]がわたしのために家[いえ]を建[た]てる。わたしは彼の王座[おうざ]を永遠[えいえん]に確[かた]くする。"
  13: "わたしは彼[かれ]の父[ちち]となり、彼はわたしの子[こ]となる。わたしは彼からわたしの慈[いつく]しみを取[と]り去[さ]らない。あなたの前[まえ]にいた者[もの]たちから取り去ったようにはしない。"
  14: "わたしは彼を、わたしの家[いえ]と彼の王国[おうこく]のうちに永遠[えいえん]に確[かた]くする。彼の王座[おうざ]も永遠に堅[かた]く立[た]つ。』"
  15: "ナタンはこれらのすべての言葉[ことば]と、このすべての幻[まぼろし]のとおりに、ダビデに語[かた]った。"
  16: "ダビデ王[おう]は入[はい]って、主[しゅ]の前[まえ]に座[すわ]り、言[い]った。「わたしの主[しゅ]よ、神[かみ]よ。わたしは何者[なにもの]でしょうか。わたしの家[いえ]は何[なん]でしょうか。あなたがわたしを永遠[えいえん]に愛[あい]してくださるとは。"
  17: "神[かみ]よ、これはあなたの目[め]には小[ちい]さなことにすぎませんでした。あなたはしもべの家[いえ]について遠[とお]くから語[かた]られ、わたしを人[ひと]の幻[まぼろし]のように見[み]て、高[たか]く上[あ]げてくださいました。わたしの主[しゅ]よ、神よ。"
  18: "ダビデはこれ以上[いじょう]、あなたをほめたたえるために何[なに]を言[い]い足[た]せるでしょうか。あなたはしもべを知[し]っておられます。"
  19: "主[しゅ]よ、あなたはしもべのゆえに、このすべての大[おお]いなることを行[おこな]い、あなたの心[こころ]のままに、あなたのすべての大[おお]いなることを知[し]らせてくださいました。"
  20: "主[しゅ]よ、あなたに似[に]た者[もの]はなく、わたしたちが耳[みみ]で聞[き]いたすべてのことにおいても、あなたのほかに神[かみ]はいない。"
  21: "地上[ちじょう]には、あなたの民[たみ]イスラエルのような民はありません。神[かみ]がご自分[じぶん]のために民を贖[あがな]い、ご自分のために大[おお]いなる輝[かがや]かしい名[な]を置[お]き、あなたがエジプトから贖ったあなたの民の前[まえ]から諸国民[しょこくみん]を追[お]い出[だ]すために、ご自分でこの民を導[みちび]かれたのです。"
  22: "あなたはあなたの民[たみ]イスラエルをご自分のために、永遠[えいえん]の民として与[あた]え、主[しゅ]よ、あなたは彼[かれ]らの神[かみ]となられました。"
  23: "今[いま]、わたしの主[しゅ]よ、あなたがしもべとその家[いえ]について語[かた]られたその言葉[ことば]を、永遠[えいえん]に確[かた]くしてください。あなたが語られたとおりに行[おこな]ってください。"
  24: "あなたの名[な]が永遠[えいえん]に確[かた]くされ、大[おお]いなるものとなりますように。人[ひと]々[びと]が『万軍[ばんぐん]の主[しゅ]、イスラエルの神[かみ]』と言[い]い、あなたのしもべダビデの家[いえ]があなたの前[まえ]に確くされますように。"
  25: "わたしの主[しゅ]よ、神[かみ]よ、あなたはしもべの耳[みみ]を開[ひら]いて、彼のために家[いえ]を建[た]てることを示[しめ]し、それゆえ、しもべはあなたの前[まえ]で祈[いの]る心[こころ]を得[え]ました。"
  26: "今[いま]、主[しゅ]よ、あなたこそ神[かみ]であり、あなたはしもべにこれらの良[よ]いことを語[かた]られました。"
  27: "どうか今[いま]、あなたのしもべの家[いえ]を祝福[しゅくふく]し始[はじ]めて、それが永遠[えいえん]にあなたの前[まえ]にあるようにしてください。主[しゅ]よ、あなたが祝福されたのだから、永遠に祝福してください。」"

notes:
  1: "κατῴκησεν Δαυιδ ἐν οἴκῳ αὐτοῦ — Давид жил в доме своём. οἴκῳ κεδρίνῳ — доме кедровом (κέδρος — 杉). κιβωτὸς διαθήκης κυρίου — ковчег завета Господня (契約の箱). ὑποκάτω δέρρεων — под кожами (δέρρις — кожаный покров, палатка); отсюда 革の覆い. В 2 Цар 7:2 иное: ковчег посреди скинии."
  2: "Πᾶν τὸ ἐν τῇ ψυχῇ σου — всё, что в душе твоей; слав. «в сердцы» — 心. ποίει — делай. ὁ θεὸς μετὰ σοῦ — Бог с тобою."
  3: "ἐν τῇ νυκτὶ ἐκείνῃ — в ту ночь. ἐγένετο λόγος κυρίου πρὸς Ναθαν λέγων — было слово Господне к Нафану, говоря."
  4: "Πορεύου — иди. εἰπὸν πρὸς Δαυιδ τὸν παῖδά μου — скажи Давиду, рабу Моему (παῖς — しもべ). Οὕτως εἶπεν κύριος — так говорит Господь. Οὐ σὺ οἰκοδομήσεις μοι οἶκον — не ты построишь Мне дом. τοῦ κατοικῆσαί με ἐν αὐτῷ — чтобы Мне обитать в нём. С 4 по 14 — слова Господа: 『…』."
  5: "οὐ κατῴκησα ἐν οἴκῳ — не обитал в доме. ἀφ᾽ ἧς ἡμέρας ἀνήγαγον τὸν Ισραηλ — с того дня, как вывел Израиль. ἤμην ἐν σκηνῇ καὶ ἐν καταλύματι — был в скинии и в жилище (κατάλυμα — временное пристанище; слав. «в шатре»); передано 仮住まい."
  6: "διῆλθον ἐν παντὶ Ισραηλ — проходил по всему Израилю. εἰ λαλῶν ἐλάλησα — сказал ли Я, говоря (усиление). πρὸς μίαν φυλὴν Ισραηλ τοῦ ποιμαίνειν τὸν λαόν μου — к одному колену Израиля, которому повелел пасти народ Мой (φυλή — 部族). Οὐκ ᾠκοδομήκατέ μοι οἶκον κέδρινον — вы не построили Мне дом кедровый; в csl «чесо ради не создасте» — почему, отсюда なぜ."
  7: "Ἔλαβόν σε ἐκ τῆς μάνδρας ἐξόπισθεν τῶν ποιμνίων — взял тебя из ограды, [бывшего] позади стад (μάνδρα — загон); csl «егда последовал еси стаду» — когда ты шёл за стадом, отсюда 群れを追って歩いていた. τοῦ εἶναι εἰς ἡγούμενον — чтобы быть вождём. κύριος παντοκράτωρ — Господь Вседержитель (万軍の主)."
  8: "ἤμην μετὰ σοῦ — был с тобою. ἐξωλέθρευσα — истребил. ἐποίησά σοι ὄνομα — сделал тебе имя. κατὰ τὸ ὄνομα τῶν μεγάλων τῶν ἐπὶ τῆς γῆς — как имя великих на земле."
  9: "θήσομαι τόπον — поставлю место (в csl «дах место» — дал, прошедшее время; взят LXX). καταφυτεύσω — насажу. κατασκηνώσει καθ᾽ ἑαυτόν — поселится сам по себе; csl «обитают в нем» — внесено そこに. οὐ μεριμνήσει ἔτι — не будет более заботиться. οὐ προσθήσει ἀδικία τοῦ ταπεινῶσαι αὐτόν — не приложит неправда унизить его; csl «ни сынове беззакония» — отсюда 不正の子ら. καθὼς ἀπ᾽ ἀρχῆς — как от начала."
  10: "ἀφ᾽ ἡμερῶν, ὧν ἔταξα κριτάς — от дней, когда поставил судей (продолжение 9). ἐταπείνωσα ἅπαντας τοὺς ἐχθρούς σου — смирил всех врагов твоих. αὐξήσω σε — возвеличу, умножу тебя. οἶκον οἰκοδομήσει σοι κύριος — дом построит тебе Господь (в 2 Цар 7:11 иначе: «ты построишь дом Ему»)."
  11: "ἔσται ὅταν πληρωθῶσιν αἱ ἡμέραι σου — будет, когда исполнятся дни твои. κοιμηθήσῃ μετὰ τῶν πατέρων σου — почиешь с отцами. ἀναστήσω τὸ σπέρμα σου μετὰ σέ — восставлю семя твоё после тебя. ὃς ἔσται ἐκ τῆς κοιλίας σου — которое будет из чрева твоего (子孫). ἑτοιμάσω τὴν βασιλείαν αὐτοῦ — уготовлю царство его."
  12: "αὐτὸς οἰκοδομήσει μοι οἶκον — он построит Мне дом (в 2 Цар 7:13 добавлено «имени Моему»). ἀνορθώσω τὸν θρόνον αὐτοῦ — утвержу престол его. ἕως αἰῶνος — до века."
  13: "ἐγὼ ἔσομαι αὐτῷ εἰς πατέρα — Я буду ему отцом. τὸ ἔλεός μου οὐκ ἀποστήσω ἀπ᾽ αὐτοῦ — милости Моей не отниму от него. ὡς ἀπέστησα ἀπὸ τῶν ὄντων ἔμπροσθέν σου — как отнял у бывших прежде тебя; имени Саула нет ни в LXX, ни в csl."
  14: "πιστώσω αὐτόν — утвержу его (πιστόω). ἐν οἴκῳ μου καὶ ἐν βασιλείᾳ αὐτοῦ — в доме Моём и в царстве его (в 2 Цар 7:16 «дом его и царство его»). ἀνωρθωμένος — утверждённый, поставленный прямо. Здесь закрывается 『…』."
  15: "κατὰ πάντας τοὺς λόγους τούτους — по всем словам этим. ὅρασις — видение (幻). οὕτως ἐλάλησεν — так сказал."
  16: "ἦλθεν … ἐκάθισεν ἀπέναντι κυρίου — вошёл и сел пред Господом (ἀπέναντι — напротив). Τίς εἰμι ἐγώ — кто я. τίς ὁ οἶκός μου — что дом мой. ἠγάπησάς με ἕως αἰῶνος — возлюбил меня до века (в 2 Цар 7:18 «до сего»). С 16 по 27 — молитва Давида: 「…」."
  17: "ἐσμικρύνθη ταῦτα ἐνώπιόν σου — умалилось это пред Тобою. ἐλάλησας ἐπὶ τὸν οἶκον τοῦ παιδός σου ἐκ μακρῶν — говорил о доме раба Твоего издалека. ἐπεῖδές με ὡς ὅρασις ἀνθρώπου — призрел на меня как на видение человека; тёмное место, слав. то же, в ru «как на человека великого» (МТ). ὕψωσάς με — возвысил меня."
  18: "τί προσθήσει ἔτι Δαυιδ τοῦ δοξάσαι — что ещё прибавит Давид, чтобы прославить. σὺ τὸν δοῦλόν σου οἶδας — Ты знаешь раба Твоего."
  19: "В LXX стих короткий: καὶ κατὰ τὴν καρδίαν σου ἐποίησας τὴν πᾶσαν μεγαλωσύνην — и по сердцу Твоему сделал всё величие. csl даёт полный текст: «Господи, раба твоего ради сотворил еси все величие сие и по сердцу твоему, еже знаема сотворити вся величия твоя» — внесён в основной текст без 〔…〕 (паритет)."
  20: "οὐκ ἔστιν ὅμοιός σοι — нет подобного Тебе. οὐκ ἔστιν πλὴν σοῦ — нет кроме Тебя; csl добавляет «Бога» — внесено 神. ὅσα ἠκούσαμεν ἐν ὠσὶν ἡμῶν — что слышали ушами нашими."
  21: "οὐκ ἔστιν ὡς ὁ λαός σου Ισραηλ ἔθνος ἔτι ἐπὶ τῆς γῆς — нет как народ Твой Израиль народа ещё на земле. ὡδήγησεν αὐτὸν ὁ θεός — Бог вёл его. τοῦ λυτρώσασθαι ἑαυτῷ λαόν — чтобы искупить Себе народ (λυτρόω — 贖う). τοῦ θέσθαι ἑαυτῷ ὄνομα μέγα καὶ ἐπιφανές — чтобы положить Себе имя великое и славное (ἐπιφανής — 輝かしい). τοῦ ἐκβαλεῖν ἀπὸ προσώπου λαοῦ σου … ἔθνη — чтобы изгнать от лица народа Твоего народы."
  22: "ἔδωκας τὸν λαόν σου … σεαυτῷ λαὸν ἕως αἰῶνος — дал народ Твой Себе народом до века. σὺ … αὐτοῖς εἰς θεόν — Ты стал им Богом."
  23: "ὁ λόγος σου … πιστωθήτω ἕως αἰῶνος — слово Твоё да утвердится до века (πιστόω). csl добавляет «и сотвори якоже глаголал еси» — нет в LXX, внесено: あなたが語られたとおりに行ってください."
  24: "λεγόντων — говорящих (род. п. мн. ч.). κύριε κύριε παντοκράτωρ θεὸς Ισραηλ — Господи, Господи Вседержителю, Боже Израилев (звательный падеж, обращение; передано как исповедание «万軍の主、イスラエルの神», ср. 2 Цар 7:26). ὁ οἶκος Δαυιδ παιδός σου ἀνωρθωμένος ἐναντίον σου — дом Давида, раба Твоего, утверждённый пред Тобою. csl добавляет в начале «и да уверится и возвеличится имя твое даже до века» — внесено."
  25: "ἤνοιξας τὸ οὖς τοῦ παιδός σου — открыл ухо раба Твоего, т. е. возвестил. τοῦ οἰκοδομῆσαι αὐτῷ οἶκον — построить ему дом. εὗρεν ὁ παῖς σου τοῦ προσεύξασθαι — обрёл раб Твой [дерзновение] молиться; слав. в скобках «(дерзновение)» — не внесено, передано 祈る心."
  26: "σὺ εἶ αὐτὸς ὁ θεός — Ты Сам Бог. ἐλάλησας ἐπὶ τὸν δοῦλόν σου τὰ ἀγαθὰ ταῦτα — сказал рабу Твоему эти блага."
  27: "ἤρξω τοῦ εὐλογῆσαι — Ты начал благословлять (LXX, аорист); csl «начни благословити» — императив, принят: 祝福し始めて. τοῦ εἶναι εἰς τὸν αἰῶνα ἐναντίον σου — чтобы быть в век пред Тобою. εὐλόγησον εἰς τὸν αἰῶνα — благослови в век."
