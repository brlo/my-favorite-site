verses:
  0: "ダビデの詩[うた]。"
  1: "正[ただ]しい者[もの]たちよ、主[しゅ]にあって喜[よろこ]べ。まっすぐな者[もの]に賛美[さんび]はふさわしい。"
  2: "琴[こと]をもって主[しゅ]をたたえ、十弦[じゅうげん]の琴[こと]をもって主[しゅ]にほめ歌[うた]を歌[うた]え。"
  3: "新[あたら]しい歌[うた]を主[しゅ]に歌[うた]え。喜[よろこ]びの声[こえ]を上[あ]げて、美[うつく]しくほめ歌[うた]え。"
  4: "主[しゅ]の言葉[ことば]はまっすぐであり、その業[わざ]はすべて真実[しんじつ]である。"
  5: "主[しゅ]は義[ぎ]と裁[さば]きを愛[あい]される。主[しゅ]のあわれみは地[ち]に満[み]ちている。"
  6: "主[しゅ]の言葉[ことば]によって天[てん]は造[つく]られ、その口[くち]の息[いき]によって、天[てん]のもろもろの力[ちから]は造[つく]られた。"
  7: "主[しゅ]は海[うみ]の水[みず]を皮袋[かわぶくろ]のように集[あつ]め、海[うみ]の深[ふか]みを倉[くら]に納[おさ]められる。"
  8: "全[ぜん]地[ち]は主[しゅ]を恐[おそ]れよ。世界[せかい]に住[す]む者[もの]はすべて、主[しゅ]の前[まえ]におののけ。"
  9: "主[しゅ]が語[かた]られると、それは生[う]まれ、主[しゅ]が命[めい]じられると、それは造[つく]られたからである。"
  10: "主[しゅ]は諸国[しょこく]の民[たみ]の計[はかりごと]を散[ち]らし、もろもろの民[たみ]の思[おも]いを退[しりぞ]け、支配者[しはいしゃ]たちの計[はかりごと]を退[しりぞ]けられる。"
  11: "しかし、主[しゅ]の計[はかりごと]はとこしえに立[た]ち、その心[こころ]の思[おも]いは代[よ]から代[よ]へと続[つづ]く。"
  12: "幸[さいわ]いなのは、主[しゅ]をその神[かみ]とする国[くに]、主[しゅ]がご自身[じしん]の受[う]け継[つ]ぎとして選[えら]ばれた民[たみ]である。"
  13: "主[しゅ]は天[てん]から見下[みお]ろし、すべての人[ひと]の子[こ]らをご覧[らん]になった。"
  14: "主[しゅ]は備[そな]えられたその住[す]まいから、地[ち]に住[す]むすべての者[もの]をご覧[らん]になった。"
  15: "主[しゅ]は彼[かれ]らすべての心[こころ]を一[ひと]つ一[ひと]つ造[つく]り、そのすべての業[わざ]を悟[さと]っておられる。"
  16: "王[おう]は多[おお]き力[ちから]によって救[すく]われず、巨人[きょじん]はその力[ちから]の多[おお]さによって救[すく]われない。"
  17: "馬[うま]は救[すく]いには役立[やくだ]たない。その力[ちから]が多[おお]くても、人[ひと]を救[すく]うことはない。"
  18: "見[み]よ、主[しゅ]の目[め]は、主[しゅ]を恐[おそ]れる者[もの]、そのあわれみに望[のぞ]みを置[お]く者[もの]の上[うえ]にある。"
  19: "主[しゅ]は彼[かれ]らの魂[たましい]を死[し]から救[すく]い出[だ]し、飢[き]えのときにも彼[かれ]らを養[やしな]われる。"
  20: "わたしたちの魂[たましい]は主[しゅ]を待[ま]ち望[のぞ]む。主[しゅ]はわたしたちの助[たす]け、わたしたちの盾[たて]だからである。"
  21: "わたしたちの心[こころ]は主[しゅ]にあって喜[よろこ]ぶ。わたしたちはその聖[せい]なる名[な]に望[のぞ]みを置[お]いたからである。"
  22: "主[しゅ]よ、わたしたちがあなたに望[のぞ]みを置[お]いたように、あなたのあわれみがわたしたちの上[うえ]にありますように。"

notes:
  0: "Τῷ Δαυιδ — ダビデの詩. В славянской Псалтири надписание отмечено как «не надписан у еврей» (псалом без надписания в евр.), но в греческой и русской базе оно есть, поэтому переводим. Надписание — стих 0."
  1: "Ἀγαλλιᾶσθε, δίκαιοι, ἐν τῷ κυρίῳ — 正しい者たちよ、主にあって喜べ (ἀγαλλιάομαι — «ликовать»). τοῖς εὐθέσι πρέπει αἴνεσις — まっすぐな者に賛美はふさわしい (πρέπω — «подобать»; αἴνεσις — «хвала»)."
  2: "ἐξομολογεῖσθε τῷ κυρίῳ ἐν κιθάρᾳ — 琴をもって主をたたえ (κιθάρα — 琴[こと], как по корпусу). ἐν ψαλτηρίῳ δεκαχόρδῳ ψάλατε αὐτῷ — 十弦の琴をもって主にほめ歌を歌え (ψαλτήριον — «псалтирь»; δεκάχορδος — «десятиструнный»)."
  3: "ᾄσατε αὐτῷ ᾆσμα καινόν — 新しい歌を主に歌え (ᾆσμα — «песнь»). καλῶς ψάλατε ἐν ἀλαλαγμῷ — 喜びの声を上げて、美しくほめ歌え (ἀλαλαγμός — «восклицание, ликование»; καλῶς — «стройно»)."
  4: "εὐθὴς ὁ λόγος τοῦ κυρίου — 主の言葉はまっすぐであり (εὐθύς — «прямой, правый»). πάντα τὰ ἔργα αὐτοῦ ἐν πίστει — その業はすべて真実である (πίστις здесь — «верность»)."
  5: "ἀγαπᾷ ἐλεημοσύνην καὶ κρίσιν — 主は義と裁きを愛される (ἐλεημοσύνη — «правда, милость»; κρίσις — 裁き). τοῦ ἐλέους κυρίου πλήρης ἡ γῆ — 主のあわれみは地に満ちている."
  6: "τῷ λόγῳ τοῦ κυρίου οἱ οὐρανοὶ ἐστερεώθησαν — 主の言葉によって天は造られ (στερεόω — «утверждать»). τῷ πνεύματι τοῦ στόματος αὐτοῦ πᾶσα ἡ δύναμις αὐτῶν — その口の息によって、天のもろもろの力は造られた (πνεῦμα τοῦ στόματος — «дыхание уст»; здесь πνεῦμα не в собственном смысле «дух», потому 息[いき], а не 霊 — см. отчёт)."
  7: "συνάγων ὡς ἀσκὸν ὕδατα θαλάσσης — 海の水を皮袋のように集め (ἀσκός — «мех, кожаный мешок»; 皮袋[かわぶくろ], как Мф 9:17). τιθεὶς ἐν θησαυροῖς ἀβύσσους — 海の深みを倉に納められる (ἄβυσσος — «бездна»; θησαυρός — «сокровищница»)."
  8: "φοβηθήτω τὸν κύριον πᾶσα ἡ γῆ — 全地は主を恐れよ. ἀπ᾿ αὐτοῦ σαλευθήτωσαν πάντες οἱ κατοικοῦντες τὴν οἰκουμένην — 世界に住む者はすべて、主の前におののけ (σαλεύω — «колебать»; οἰκουμένη — «вселенная»)."
  9: "ὅτι αὐτὸς εἶπεν, καὶ ἐγενήθησαν — 主が語られると、それは生まれ (γίνομαι — «бывать»). αὐτὸς ἐνετείλατο, καὶ ἐκτίσθησαν — 主が命じられると、それは造られた (ἐντέλλομαι — «повелевать»; κτίζω — «созидать»); параллелизм сохранён."
  10: "κύριος διασκεδάζει βουλὰς ἐθνῶν — 主は諸国の民の計らいを散らし (διασκεδάζω — «рассеивать»). ἀθετεῖ λογισμοὺς λαῶν — もろもろの民の思いを退け. ἀθετεῖ βουλὰς ἀρχόντων — 支配者たちの計らいを退けられる (ἀθετέω — «отвергать»); повтор ἀθετεῖ сохранён."
  11: "ἡ δὲ βουλὴ τοῦ κυρίου εἰς τὸν αἰῶνα μένει — しかし、主の計らいはとこしえに立つ. λογισμοὶ τῆς καρδίας αὐτοῦ εἰς γενεὰν καὶ γενεάν — その心の思いは代から代へと続く (γενεά — «род»)."
  12: "μακάριον τὸ ἔθνος, οὗ ἐστιν κύριος ὁ θεὸς αὐτοῦ — 幸いなのは、主をその神とする国 (ἔθνος — 国). λαός, ὃν ἐξελέξατο εἰς κληρονομίαν ἑαυτῷ — 主がご自身の受け継ぎとして選ばれた民 (λαός — 民; κληρονομία — 受け継ぎ); различие ἔθνος/λαός передано 国/民."
  13: "ἐξ οὐρανοῦ ἐπέβλεψεν ὁ κύριος — 主は天から見下ろし (ἐπιβλέπω — «призирать»). εἶδεν πάντας τοὺς υἱοὺς τῶν ἀνθρώπων — すべての人の子らをご覧になった."
  14: "ἐξ ἑτοίμου κατοικητηρίου αὐτοῦ — 備えられたその住まいから (ἕτοιμος — «готовый»; κατοικητήριον — «жилище»). ἐπέβλεψεν ἐπὶ πάντας τοὺς κατοικοῦντας τὴν γῆν — 地に住むすべての者をご覧になった; повтор ἐπέβλεψεν сохранён."
  15: "ὁ πλάσας κατὰ μόνας τὰς καρδίας αὐτῶν — 彼らすべての心を一つ一つ造り (πλάσσω — «лепить, создавать»; κατὰ μόνας — «порознь»). ὁ συνιεὶς εἰς πάντα τὰ ἔργα αὐτῶν — そのすべての業を悟っておられる (συνίημι — «вникать»)."
  16: "οὐ σῴζεται βασιλεὺς διὰ πολλὴν δύναμιν — 王は多くの力によって救われず. γίγας οὐ σωθήσεται ἐν πλήθει ἰσχύος αὐτοῦ — 巨人はその力の多さによって救われない (γίγας — «исполин»)."
  17: "ψευδὴς ἵππος εἰς σωτηρίαν — 馬は救いには役立たない (ψευδής — «лживый, ненадёжный»). ἐν δὲ πλήθει δυνάμεως αὐτοῦ οὐ σωθήσεται — その力が多くても、人を救うことはない."
  18: "ἰδοὺ οἱ ὀφθαλμοὶ κυρίου ἐπὶ τοὺς φοβουμένους αὐτὸν — 見よ、主の目は、主を恐れる者の上にある. τοὺς ἐλπίζοντας ἐπὶ τὸ ἔλεος αὐτοῦ — そのあわれみに望みを置く者."
  19: "ῥύσασθαι ἐκ θανάτου τὰς ψυχὰς αὐτῶν — 彼らの魂を死から救い出し (ῥύομαι — «избавлять»). διαθρέψαι αὐτοὺς ἐν λιμῷ — 飢えのときにも彼らを養われる (λιμός — «голод»)."
  20: "ἡ ψυχὴ ἡμῶν ὑπομένει τῷ κυρίῳ — わたしたちの魂は主を待ち望む (ὑπομένω — «терпеливо ждать»). βοηθὸς καὶ ὑπερασπιστὴς ἡμῶν ἐστιν — 主はわたしたちの助け、わたしたちの盾 (ὑπερασπιστής — «заступник»)."
  21: "ἐν αὐτῷ εὐφρανθήσεται ἡ καρδία ἡμῶν — わたしたちの心は主にあって喜ぶ. ἐν τῷ ὀνόματι τῷ ἁγίῳ αὐτοῦ ἠλπίσαμεν — わたしたちはその聖なる名に望みを置いた (ἐλπίζω — «уповать»)."
  22: "γένοιτο τὸ ἔλεός σου, κύριε, ἐφ᾿ ἡμᾶς — 主よ、あなたのあわれみがわたしたちの上にありますように (γένοιτο — «да будет»). καθάπερ ἠλπίσαμεν ἐπὶ σέ — わたしたちがあなたに望みを置いたように."
