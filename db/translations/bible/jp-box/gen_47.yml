# jp-box, Бытие, глава 47. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru).
# jp-joc в этой главе нет; ru — только для понимания, не источник.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 47: Иаков и братья перед фараоном (1–10), поселение в Гесеме (11–12),
# Иосиф скупает землю и скот для фараона (13–26), последние годы Иакова и его
# заклятие Иосифу (27–31).
# Красного и синего нет: говорят люди, не Христос.
# Кавычки: речь первого уровня — 「…」; вложенных нет.
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено).
# Деление ст. 5–6: gr-lxx-byz соединяет в ст. 5 три части, которые csl-ru разносит
# по ст. 5 и 6 (вставка о приходе Иакова стоит у славян в скобках в ст. 6).
# Держимся греческой нумерации, поэтому в ст. 5 повтор не сглажен; см. notes.
# Сносок ⟨…⟩ нет: 祭司, 嗣業, 寄留, 銀 понятны или уже в корпусе. jp-ni не использовался.

