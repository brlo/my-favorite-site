verses:
  1: "ヨセフは来[き]て、ファラオに告[つ]げた。「父[ちち]と兄弟[きょうだい]たち、その羊[ひつじ]と牛[うし]、および彼[かれ]らのすべてのものは、カナンの地[ち]から来[き]ました。見[み]よ、彼[かれ]らはゴシェンの地[ち]にいます。」"
  2: "また兄弟[きょうだい]たちの中[なか]から五人の者[もの]を連[つ]れて来[き]て、ファラオの前[まえ]に立[た]たせた。"
  3: "ファラオはヨセフの兄弟[きょうだい]たちに言[い]った。「あなたがたの仕事[しごと]は何[なに]か。」彼[かれ]らはファラオに言[い]った。「あなたのしもべたちは羊飼[ひつじかい]でございます。わたしたちも父[ちち]たちも。」"
  4: "彼[かれ]らはファラオに言[い]った。「この地[ち]に寄留[きりゅう]するために来[き]ました。あなたのしもべたちの家畜[かちく]に牧草[ぼくそう]がないからです。カナンの地[ち]の飢饉[ききん]が激[はげ]しいからです。今[いま]、どうか、あなたのしもべたちをゴシェンの地[ち]に住[す]ませてください。」"
  5: "ファラオはヨセフに言[い]った。「彼[かれ]らをゴシェンの地[ち]に住[す]まわせよ。もしあなたが、彼[かれ]らの中[なか]に力[ちから]ある者[もの]たちがいると知[し]っているなら、わたしの家畜[かちく]の長[ちょう]とせよ。」ところで、ヤコブとその子[こ]らはエジプトへ、ヨセフのもとへ来[き]た。エジプトの王[おう]ファラオはそれを聞[き]いた。ファラオはヨセフに言[い]った。「あなたの父[ちち]と兄弟[きょうだい]たちがあなたのもとへ来[き]た。"
  6: "見[み]よ、エジプトの地[ち]はあなたの前[まえ]にある。父[ちち]と兄弟[きょうだい]たちを最[もっと]も良[よ]い地[ち]に住[す]まわせよ。」"
  7: "ヨセフは父[ちち]ヤコブを連[つ]れて来[き]て、ファラオの前[まえ]に立[た]たせた。ヤコブはファラオを祝福[しゅくふく]した。"
  8: "ファラオはヤコブに言[い]った。「あなたの生涯[しょうがい]の年[とし]はいくつか。」"
  9: "ヤコブはファラオに言[い]った。「わたしが寄留[きりゅう]している生涯[しょうがい]の年[とし]の日[ひ]は百三十年[ひゃくさんじゅうねん]です。わたしの生涯[しょうがい]の年[とし]は少[すく]なく、不幸[ふこう]でした。わたしの父[ちち]たちの生涯[しょうがい]の年[とし]、彼[かれ]らが寄留[きりゅう]した日[ひ]には及[およ]びませんでした。」"
  10: "ヤコブはファラオを祝福[しゅくふく]して、彼[かれ]のもとから出[で]て行[い]った。"
  11: "ヨセフは父[ちち]と兄弟[きょうだい]たちを住[す]まわせ、ファラオが命[めい]じたとおり、エジプトの地[ち]、最[もっと]も良[よ]い地[ち]、ラメセの地[ち]で彼[かれ]らに所有[しょゆう]を与[あた]えた。"
  12: "ヨセフは父[ちち]と兄弟[きょうだい]たち、父[ちち]の家[いえ]のすべての者[もの]に、人数[にんずう]に応[おう]じて穀物[こくもつ]を量[はか]り与[あた]えた。"
  13: "全[ぜん]地[ち]には穀物[こくもつ]がなかった。飢饉[ききん]が非常[ひじょう]に激[はげ]しくなり、エジプトの地[ち]もカナンの地[ち]も飢饉[ききん]のために衰[おとろ]えた。"
  14: "ヨセフは、エジプトの地[ち]とカナンの地[ち]で見[み]つかったすべての銀[ぎん]を、人々[ひとびと]が買[か]う穀物[こくもつ]の代金[だいきん]として集[あつ]め、彼[かれ]らに穀物[こくもつ]を量[はか]り与[あた]え、その銀[ぎん]をすべてファラオの家[いえ]に運[はこ]び入[い]れた。"
  15: "エジプトの地[ち]とカナンの地[ち]から銀[ぎん]が尽[つ]きた。エジプト人[じん]は皆[みな]ヨセフのもとへ来[き]て言[い]った。「わたしたちにパンを与[あた]えてください。銀[ぎん]が尽[つ]きたのに、なぜわたしたちはあなたの前[まえ]で死[し]ななければならないのですか。」"
  16: "ヨセフは彼[かれ]らに言[い]った。「あなたがたの家畜[かちく]を連[つ]れて来[き]なさい。銀[ぎん]が尽[つ]きたのなら、あなたがたの家畜[かちく]の代[か]わりにパンを与[あた]えよう。」"
  17: "彼[かれ]らは家畜[かちく]をヨセフのもとへ連[つ]れて来[き]た。ヨセフは馬[うま]の代[か]わりに、羊[ひつじ]の代[か]わりに、牛[うし]の代[か]わりに、ろばの代[か]わりにパンを与[あた]え、その年[とし]は彼[かれ]らのすべての家畜[かちく]の代[か]わりにパンで彼[かれ]らを養[やしな]った。"
  18: "その年[とし]が過[す]ぎ、第二年[だいにねん]に彼[かれ]らは彼[かれ]のもとへ来[き]て言[い]った。「わたしたちの主[あるじ]よ、わたしたちがあなたによって滅[ほろ]ぼされないように。銀[ぎん]も財産[ざいさん]も家畜[かちく]も、あなたのものになりました。わたしたちの主[あるじ]の前[まえ]には、わたしたちの体[からだ]と土地[とち]のほか何[なに]も残[のこ]っていません。"
  19: "どうか、わたしたちがあなたの前[まえ]で死[し]ぬことなく、土地[とち]が荒[あ]れ果[は]てないように、わたしたちと土地[とち]をパンの代[か]わりに買[か]ってください。わたしたちも土地[とち]もファラオのしもべになります。種[たね]をください。そうすれば、わたしたちは生[い]き、死[し]なず、土地[とち]も荒[あ]れ果[は]てないでしょう。」"
  20: "ヨセフはエジプト人[じん]のすべての土地[とち]をファラオのために買[か]い取[と]った。飢饉[ききん]が彼[かれ]らを圧[お]したので、エジプト人[じん]は自分[じぶん]の土地[とち]をファラオに売[う]った。こうして土地[とち]はファラオのものになった。"
  21: "また民[たみ]を、エジプトの境[さかい]の端[はし]から端[はし]まで、彼[かれ]のためにしもべとして奴隷[どれい]とした。"
  22: "ただ祭司[さいし]たちの土地[とち]だけは買[か]わなかった。ファラオは祭司[さいし]たちに分[ぶん]を与[あた]え、祭司[さいし]たちはファラオが与[あた]えた分[ぶん]を食[た]べていたからである。それゆえ、彼[かれ]らは自分[じぶん]の土地[とち]を売[う]らなかった。"
  23: "ヨセフはすべてのエジプト人[じん]に言[い]った。「見[み]よ、今日[きょう]、わたしはあなたがたとあなたがたの土地[とち]をファラオのために買[か]い取[と]った。あなたがたのために種[たね]を取[と]り、土地[とち]に蒔[ま]きなさい。"
  24: "その実[みの]りは、五分[ごぶ]の一[いち]をファラオに納[おさ]め、四分[しぶ]はあなたがたのものとなり、土地[とち]の種[たね]と、あなたがたと、あなたがたの家[いえ]にいるすべての者の食物[しょくもつ]となるであろう。」"
  25: "彼[かれ]らは言[い]った。「あなたはわたしたちを生[い]かしてくださいました。わたしたちの主[あるじ]の前[まえ]に{恵[めぐ]み|恩寵[おんちょう]}を得[え]させてください。わたしたちはファラオのしもべになります。」"
  26: "ヨセフはこれをエジプトの地[ち]について今日[きょう]に至[いた]るまで定[さだ]めとし、五分[ごぶ]の一[いち]をファラオに納[おさ]めさせた。ただ祭司[さいし]たちの土地[とち]だけはファラオのものにならなかった。"
  27: "イスラエルはエジプトの地[ち]、ゴシェンの地[ち]に住[す]み、そこを所有[しょゆう]し、増[ふ]え、非常[ひじょう]に多[おお]くなった。"
  28: "ヤコブはエジプトの地[ち]で十七年[じゅうしちねん]生[い]きた。ヤコブの生涯[しょうがい]の年[とし]の日[ひ]は百四十七年[ひゃくよんじゅうしちねん]であった。"
  29: "イスラエルの死[し]ぬ日[ひ]が近[ちか]づくと、彼[かれ]は息子[むすこ]ヨセフを呼[よ]んで言[い]った。「もしわたしがあなたの前[まえ]で{恵[めぐ]み|恩寵[おんちょう]}を得[え]ているなら、あなたの手[て]をわたしのももの下[した]に置[お]き、慈[いつく]しみと真実[しんじつ]をわたしに施[ほどこ]して、わたしをエジプトに葬[ほうむ]らないでください。"
  30: "むしろ、わたしは父[ちち]たちとともに眠[ねむ]りたいのです。わたしをエジプトから運[はこ]び出[だ]し、彼[かれ]らの墓[はか]に葬[ほうむ]ってください。」彼[かれ]は言[い]った。「あなたの言葉[ことば]どおりにいたします。」"
  31: "彼[かれ]は言[い]った。「わたしに誓[ちか]いなさい。」そこで彼[かれ]は誓[ちか]った。イスラエルは自分[じぶん]の杖[つえ]の端[はし]に伏[ふ]して礼拝[れいはい]した。"

notes:
  1: "Ὁ πατήρ μου καὶ οἱ ἀδελφοί μου… ἦλθον — 父と兄弟たち…は…来ました. τὰ κτήνη καὶ οἱ βόες — 羊と牛 (κτῆνος «скот, домашние животные»)."
  2: "ἀπὸ τῶν ἀδελφῶν… πέντε ἄνδρας — 兄弟たちの中から五人の者."
  3: "Τί τὸ ἔργον ὑμῶν; — あなたがたの仕事は何か. Ποιμένες προβάτων — 羊飼い."
  4: "Παροικεῖν… ἥκαμεν — 寄留するために来ました (παροικέω «жить пришельцем»). οὐ γάρ ἐστιν νομὴ τοῖς κτήνεσιν — 家畜に牧草がない (νομή «пастбище»). ἐνίσχυσεν ὁ λιμός — 飢饉が激しい."
  5: "По gr-lxx-byz ст. 5 соединяет три части: слова фараона к Иосифу (κατοικείτωσαν… κτηνῶν), вставку Ἦλθον δὲ εἰς Αἴγυπτον… ἤκουσεν Φαραω βασιλεὺς Αἰγύπτου и снова речь фараона (Ὁ πατήρ σου…). Славянская разбивка иная: вставка вынесена в ст. 6 в скобки, потому и нумерация расходится. Держимся греческой. ἄνδρες δυνατοί — 力ある者たち. ἄρχοντας τῶν ἐμῶν κτηνῶν — わたしの家畜の長."
  6: "ἐν τῇ βελτίστῃ γῇ — 最も良い地に (βέλτιστος, превосх. от ἀγαθός). κατοίκισον — 住まわせよ. В gr-lxx-byz ст. 6 короче слав.: «да вселятся в земли Гесем» и «если знаешь…» стоят в ст. 5, поэтому здесь они не повторены."
  7: "εὐλόγησεν Ιακωβ τὸν Φαραω — ヤコブはファラオを祝福した (εὐλογέω «благословлять», не «приветствовать»)."
  8: "Πόσα ἔτη ἡμερῶν τῆς ζωῆς σου; — あなたの生涯の年はいくつか (букв. «сколько лет дней жизни твоей»)."
  9: "αἱ ἡμέραι τῶν ἐτῶν τῆς ζωῆς μου, ἃς παροικῶ — わたしが寄留している生涯の年の日 (παροικέω «странствую»). μικραὶ καὶ πονηραί — 少なく、不幸でした (πονηρός «злой, тяжкий»). οὐκ ἀφίκοντο — 及びませんでした (ἀφικνέομαι)."
  10: "εὐλογήσας… ἐξῆλθεν ἀπ᾽ αὐτοῦ — 祝福して…出て行った."
  11: "κατάσχεσιν — 所有 (κατάσχεσις «владение»). ἐν γῇ Ραμεσση — ラメセの地 (в евр. и ru «Раамсес»; здесь LXX)."
  12: "ἐσιτομέτρει — 穀物を量り与えた (σιτομετρέω «отмерять хлеб»). κατὰ σῶμα — 人数に応じて (букв. «по телу», т. е. по числу душ; слав. «по числу лиц»)."
  13: "Σῖτος δὲ οὐκ ἦν — 穀物がなかった (σῖτος «хлеб, пшеница»). ἐξέλιπεν ἡ γῆ — 地は衰えた (ἐκλείπω «оскудевать»)."
  14: "τὸ ἀργύριον — 銀 (ἀργύριον «серебро, деньги»). τοῦ σίτου, οὗ ἠγόραζον — 買う穀物の代金として. ἐσιτομέτρει αὐτοῖς — 彼らに量り与え (σιτομετρέω «отмерять хлеб»). εἰσήνεγκεν… εἰς τὸν οἶκον Φαραω — ファラオの家に運び入れた."
  15: "Δὸς ἡμῖν ἄρτους — パンを与えてください. ἵνα τί ἀποθνῄσκομεν — なぜ…死ななければならないのか. ἐκλέλοιπεν τὸ ἀργύριον ἡμῶν — 銀が尽きた (perfect)."
  16: "Φέρετε τὰ κτήνη ὑμῶν — 家畜を連れて来なさい. ἀντὶ τῶν κτηνῶν — 家畜の代わりに."
  17: "ἀντὶ τῶν ἵππων… προβάτων… βοῶν… ὄνων — 馬・羊・牛・ろばの代わりに. ἐξέθρεψεν αὐτούς — 養った (ἐκτρέφω)."
  18: "Μήποτε ἐκτριβῶμεν ἀπὸ τοῦ κυρίου ἡμῶν — わたしたちがあなたによって滅ぼされないように (ἐκτρίβω «истреблять»; слав. «да не како погибнем от господина нашего»; в ru «не скроем» — толковательно). εἰ γὰρ ἐκλέλοιπεν τὸ ἀργύριον καὶ τὰ ὑπάρχοντα καὶ τὰ κτήνη — 銀も財産も家畜も、あなたのものになりました. τὸ ἴδιον σῶμα καὶ ἡ γῆ ἡμῶν — 体と土地のほか."
  19: "κτῆσαι ἡμᾶς καὶ τὴν γῆν ἡμῶν ἀντὶ ἄρτων — わたしたちと土地をパンの代わりに買ってください. παῖδες Φαραω — ファラオのしもべ. δὸς σπέρμα — 種をください."
  20: "ἐκτήσατο… τῷ Φαραω — ファラオのために買い取った. ἀπέδοντο… τὴν γῆν — 土地を売った. ἐπεκράτησεν… ὁ λιμός — 飢饉が圧した (ἐπικρατέω)."
  21: "κατεδουλώσατο αὐτῷ εἰς παῖδας — 彼のためにしもべとして奴隷とした (καταδουλόω). ἀπ᾽ ἄκρων ὁρίων… ἕως τῶν ἄκρων — 境の端から端まで."
  22: "χωρὶς τῆς γῆς τῶν ἱερέων — 祭司たちの土地だけは. ἐν δόσει… δόμα — 分を与え (букв. «даянием дал дар», евр. оборот). οὐκ ἀπέδοντο — 売らなかった."
  23: "κέκτημαι ὑμᾶς — 買い取った (perfect). λάβετε ἑαυτοῖς σπέρμα — 種を取り."
  24: "τὸ πέμπτον μέρος — 五分の一. τὰ τέσσαρα μέρη — 四分. εἰς βρῶσιν ὑμῖν — 食物となる. В gr нет «и детям вашим» (в ru добавлено — иное чтение)."
  25: "Σέσωκας ἡμᾶς — 生かしてくださいました (σῴζω). εὕρομεν χάριν — 恵みを得させてください (букв. «нашли благодать»)."
  26: "εἰς πρόσταγμα — 定めとした (πρόσταγμα «повеление»). ἀποπεμπτοῦν — 五分の一を納めさせる (ἀποπεμπτόω). οὐκ ἦν τῷ Φαραω — ファラオのものにならなかった."
  27: "ἐκληρονόμησαν ἐπ᾽ αὐτῆς — そこを所有し (κληρονομέω «получить в удел»). ηὐξήθησαν καὶ ἐπληθύνθησαν σφόδρα — 増え、非常に多くなった."
  28: "ἐπέζησεν… δέκα ἑπτὰ ἔτη — 十七年生きた (ἐπιζάω). ἑκατὸν τεσσαράκοντα ἑπτὰ ἔτη — 百四十七年."
  29: "ἤγγισαν αἱ ἡμέραι… τοῦ ἀποθανεῖν — 死ぬ日が近づいた. ὑπόθες τὴν χεῖρά σου ὑπὸ τὸν μηρόν μου — ももの下に手を置き (жест клятвы, ср. 24:2). ἐλεημοσύνην καὶ ἀλήθειαν — 慈しみと真実 (ἐλεημοσύνη «милость»)."
  30: "ἀλλὰ κοιμηθήσομαι μετὰ τῶν πατρῶν μου — むしろ、父たちとともに眠りたい (ἀλλά — противопоставление ст. 29). ἀρεῖς με ἐξ Αἰγύπτου — 運び出し (αἴρω). ἐν τῷ τάφῳ αὐτῶν — 彼らの墓に."
  31: "Ὄμοσόν μοι — わたしに誓いなさい. προσεκύνησεν… ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ — 杖の端に伏して礼拝した (LXX ῥάβδος; в евр. и ru «возглавие постели» — иное чтение, не источник)."
