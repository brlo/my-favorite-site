# jp-box, Даниил, глава 12. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 12 (совпадает).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: 1 Михаил, великая скорбь, книга; 2 «многие из спящих в прахе
# пробудятся» — жизнь вечная и вечное посрамление; 3 разумеющие сияют, как звёзды;
# 4 запечатать книгу до конца; 5–7 два других у реки, вопрос о конце, клятва
# «время, времена и полувремя»; 8–13 вопрос Даниила и ответ: сокрыто до конца,
# многие очистятся, 1290 и 1335 дней, «иди и почивай», жребий в конце дней.
# Голоса: 1–4 — речь ангела в 「…» (продолжение 11:45; в 7 клятва передана
# косвенно, без кавычек); 5 повествование; 6 вопрос Даниила в 「…»;
# 7 повествование; 8 вопрос Даниила в 「…»; 9–13 ответ ангела в 「…».
# Термины: 患難[かんなん] (θλῖψις), 復活[ふっかつ] (ἀνάστασις — в тексте 目を覚ます),
# 荒廃[こうはい]の憎[にく]むべきもの (βδέλυγμα ἐρημώσεως), 塵[ちり] (πλάτος/χοῦς),
# 眠[ねむ]る (καθεύδω), 星[ほし] (ἄστρα), 封印[ふういん] (σφραγίζω).
#
tr_code: jp-box
book: dan
chapter: 12
draft: true

verses:
  1: "「その時[とき]、あなたの民[たみ]の子[こ]らを守[まも]る大[おお]いなる君[きみ]ミカエルが立[た]つ。その日[ひ]は患難[かんなん]の時[とき]であり、民[たみ]が地[ち]に造[つく]られてからその日[ひ]までなかったような患難[かんなん]である。その時[とき]、あなたの民[たみ]のうち、書[しょ]に記[しる]されている者[もの]はすべて救[すく]われる。"
  2: "地[ち]の塵[ちり]の中[なか]で眠[ねむ]る者[もの]の多[おお]くが目[め]を覚[さ]ます。ある者[もの]は永遠[えいえん]の命[いのち]へ、ある者[もの]は辱[はずかし]めへ、ある者[もの]は散[ち]らされて永遠[えいえん]の恥[はじ]へと向[む]かう。"
  3: "悟[さと]りのある者[もの]たちは大空[おおぞら]の輝[かがや]きのように光[ひかり]を放[はな]ち、多[おお]くの正[ただ]しい者[もの]たちは星[ほし]のように、永遠[えいえん]に限[かぎ]りなく輝[かがや]く。"
  4: "しかし、あなた、ダニエルよ、言葉[ことば]を閉[と]ざし、この書[しょ]を封印[ふういん]せよ。終[お]わりの時[とき]まで、多[おお]くの者[もの]が学[まな]び、知識[ちしき]が増[ま]えるまで。」"
  5: "わたしダニエルは見[み]た。すると見[み]よ、ほかに二人[ふたり]の者[もの]が立[た]っていた。一人[ひとり]は川[かわ]の河口[かこう]のこちら側[がわ]、もう一人[ひとり]はあちら側[がわ]にいた。"
  6: "わたしは亜麻布[あまぬの]の衣[ころも]を着[き]て川[かわ]の水[みず]の上[うえ]に立[た]つ者[もの]に言[い]った。「これらの驚[おどろ]くべきことの終[お]わりと、これらの清[きよ]めは、いつになるのか。」"
  7: "わたしは、亜麻布[あまぬの]の衣[ころも]を着[き]て川[かわ]の水[みず]の上[うえ]に立[た]つ者[もの]の声[こえ]を聞[き]いた。彼[かれ]は右[みぎ]の手[て]と左[ひだり]の手[て]を天[てん]に上[あ]げ、永遠[えいえん]に生[い]きる方[かた]にかけて、一[ひと]つの時[とき]、幾[いく]つかの時[とき]、半[はん]の時[とき]の後[のち]、聖[せい]なる民[たみ]の手[て]が打[う]ち砕[くだ]かれるとき、すべてこれらのことが知[し]られると誓[ちか]った。"
  8: "わたしは聞[き]いたが、悟[さと]ることができなかった。そこで言[い]った。「主[しゅ]よ、これらのことの終[お]わりはどうなるのか。」"
  9: "彼は言[い]った。「行[ゆ]け、ダニエル。これらの言葉[ことば]は終[お]わりの時[とき]まで閉[と]ざされ、封印[ふういん]されているからである。"
  10: "多[おお]くの者[もの]が選[えら]ばれ、白[しろ]くされ、火[ひ]のように試[ため]されて聖[せい]なる者[もの]とされる。しかし、不法[ふほう]な者[もの]は不法[ふほう]を行[おこな]い続[つづ]け、不敬[ふけい]な者[もの]はだれも悟[さと]らない。悟[さと]りのある者[もの]たちだけが悟[さと]る。"
  11: "常[じょう]の犠牲[ぎせい]が変[か]えられ、荒廃[こうはい]の憎[にく]むべきものが置[お]かれる時[とき]から、千二百九十日[せんにひゃくきゅうじゅうにち]が過[す]ぎる。"
  12: "耐[た]え忍[しの]んで千三百三十五日[せんさんびゃくさんじゅうごにち]に達[たっ]する者[もの]は幸[さいわ]いである。"
  13: "あなたは行[ゆ]け。そして休[やす]め。終[お]わりの成就[じょうじゅ]まで、まだ日[ひ]と時[とき]が残[のこ]っている。あなたは休[やす]み、日[ひ]々[び]の終[お]わりに、あなたの分[ぶん]を受[う]けるために立[た]ち上[あ]がる。」"

notes:
  1: "κατὰ τὴν ὥραν ἐκείνην παρελεύσεται Μιχαηλ ὁ ἄγγελος ὁ μέγας — «в тот час пройдёт Михаил, ангел великий»; ὁ ἑστηκὼς ἐπὶ τοὺς υἱοὺς τοῦ λαοῦ σου — «стоящий над сынами народа твоего»; ἐκείνη ἡ ἡμέρα θλίψεως — «день тот — скорби»; οἵα οὐκ ἐγενήθη — «какой не было»; ὑψωθήσεται πᾶς ὁ λαός — «возвысится весь народ» (LXX); слав. «спасутся людие твои вси» — すべて救われる, по паритету; ἐγγεγραμμένος ἐν τῷ βιβλίῳ — «записанный в книге»."
  2: "πολλοὶ τῶν καθευδόντων ἐν τῷ πλάτει τῆς γῆς — «многие из спящих в ширине (пыли) земли»; ἀναστήσονται — «восстанут»; οἱ μὲν εἰς ζωὴν αἰώνιον — «одни в жизнь вечную»; οἱ δὲ εἰς ὀνειδισμόν — «другие в поношение»; οἱ δὲ εἰς διασπορὰν καὶ αἰσχύνην αἰώνιον — «третьи в рассеяние и вечный стыд» (LXX, три разряда); слав. объединяет последние два: «во укоризну и в стыдение вечное». В тексте сохранены три разряда по LXX, слав. слияние отмечено здесь."
  3: "οἱ συνιέντες φανοῦσιν ὡς φωστῆρες τοῦ οὐρανοῦ — «разумеющие просияют как светила неба»; οἱ κατισχύοντες τοὺς λόγους μου — «укрепляющие слова Мои» (LXX), ὡσεὶ τὰ ἄστρα — «как звёзды»; слав. «и от праведных многих» — «и из многих праведных» (следует иному чтению, близкому к МТ), по паритету 多くの正しい者たち; вариант LXX «укрепляющие слова Мои» — в примечании."
  4: "κάλυψον τὰ προστάγματα καὶ σφράγισον τὸ βιβλίον — «закрой повеления и запечатай книгу»; ἕως ἂν ἀπομανῶσιν οἱ πολλοὶ καὶ πλησθῇ ἡ γῆ ἀδικίας — «доколе не обезумеют многие и земля не наполнится беззакония» (LXX); слав. «дондеже научатся мнози, и умножится ведение» (по МТ/Феодотиону), по паритету 多くの者が学び、知識が増える."
  5: "δύο ἕτεροι εἱστήκεισαν — «двое иных стояли»; εἷς ἔνθεν τοῦ ποταμοῦ καὶ εἷς ἔνθεν — «один по эту сторону реки и один по ту»; слав. «устия реки» — «устья реки», в тексте 川のこちら側/あちら側."
  6: "καὶ εἶπα τῷ ἑνὶ τῷ περιβεβλημένῳ τὰ βύσσινα — «и я сказал одному, облечённому в виссон» (LXX); слав. «И рече к мужу…» — безличное «и сказал», по LXX говорит Даниил; ἐπάνω — «вверху (над водами)»; Πότε οὖν συντέλεια… καὶ ὁ καθαρισμὸς τούτων — «когда же конец… и очищение этих»; слав. без «очищения»."
  7: "ὤμοσε τὸν ζῶντα εἰς τὸν αἰῶνα θεόν — «поклялся живущим вовеки Богом»; εἰς καιρὸν καὶ καιροὺς καὶ ἥμισυ καιροῦ — «на время, времена и полувремя»; ἡ συντέλεια χειρῶν ἀφέσεως λαοῦ ἁγίου — «конец рук отпущения (освобождения) народа святого» (LXX; ἀφέσεως — отпущение); слав. «разсыпание руки людий освященных» — 手が打ち砕かれる; συντελεσθήσεται πάντα — «совершится всё»; слав. «уведят сия вся» — すべてが知られる."
  8: "οὐ διενοήθην — «не уразумел»; τίς ἡ λύσις τοῦ λόγου τούτου — «какое разрешение слова сего»; τίνος αἱ παραβολαὶ αὗται — «чьи эти притчи» (LXX); слав. «что последняя сих?» — これらのことの終わりはどうなるのか, по паритету."
  9: "Ἀπότρεχε, Δανιηλ — «отступи (иди), Даниил»; κατακεκαλυμμένα καὶ ἐσφραγισμένα τὰ προστάγματα — «сокрыты и запечатаны повеления»; слав. «заграждена словеса и запечатана»."
  10: "πειρασθῶσι καὶ ἁγιασθῶσι πολλοί — «искушены будут и освятятся многие»; ἁμάρτωσιν οἱ ἁμαρτωλοί — «согрешат грешники»; οὐ μὴ διανοηθῶσι πάντες οἱ ἁμαρτωλοί — «не уразумеют все грешники»; οἱ διανοούμενοι προσέξουσιν — «разумеющие уразумеют»; слав. добавляет «избранни будут» и «аки огнем» — 選ばれ…火のように, внесено."
  11: "ἀφ' οὗ ἂν ἀποσταθῇ ἡ θυσία διὰ παντός — «с того времени, как будет отнята жертва всегдашняя»; ἑτοιμασθῇ δοθῆναι τὸ βδέλυγμα τῆς ἐρημώσεως — «приготовится дать мерзость запустения»; ἡμέρας χιλίας διακοσίας ἐνενήκοντα — «дней тысяча двести девяносто»; слав. «пременения жертвы» — 犠牲が変えられる, по паритету; 荒廃の憎むべきもの — как Мк 13:14."
  12: "μακάριος ὁ ἐμμένων — «блажен пребывающий (терпящий)»; συνάξει εἰς ἡμέρας χιλίας τριακοσίας τριάκοντα πέντε — «достигнет дней тысячи трёхсот тридцати пяти»; слав. «блажен терпяй и достигнувый» — 耐え忍んで…達する者は幸い."
  13: "καὶ σὺ βάδισον ἀνάπαυε — «ты иди и почивай»; ἔτι γάρ εἰσιν ἡμέραι καὶ ὧραι εἰς ἀναπλήρωσιν συντελείας — «ибо ещё есть дни и часы к исполнению конца»; слав. «еще бодние суть и часы» — «ещё бдения и часы» (неясное), в тексте 日と時; ἀναπαύσῃ καὶ ἀναστήσῃ ἐπὶ τὴν δόξαν σου — «почиешь и восстанешь в славу твою» (LXX); слав. «востанеши в жребий твой» — あなたの分を受けるために立ち上がる, по паритету."
