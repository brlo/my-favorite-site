# jp-box, Евангелие от Иоанна, глава 13.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# jp-ni не использовался.
#
# Омовение ног (1–17), объявление о предателе (18–30), новая заповедь (31–35),
# предсказание отречения Петра (36–38). Речь Христа — красным в каждом стихе
# со своей парой тегов; слова Петра — вне тегов.
# Двойное ἀμὴν ἀμὴν — よくよく言っておく (у Иоанна всюду; в Синоптических книгах
# одиночное ἀμήν — はっきり言っておく).

