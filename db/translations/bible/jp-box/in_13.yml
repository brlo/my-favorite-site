verses:
  1: "過越祭[すぎこしまつり]の前[まえ]、イエスは、この世[よ]を離[はな]れて父[ちち]のもとへ行[い]く時[とき]が来[き]たことを知[し]っておられた。この世[よ]にいるご自分[じぶん]に属[ぞく]する者[もの]たちを愛[あい]しておられたが、終[お]わりまで彼[かれ]らを愛[あい]された。"
  2: "夕食[ゆうしょく]の最中[さいちゅう]、悪魔[あくま]はすでに、シモンの子[こ]ユダ・イスカリオテの心[こころ]に、イエスを裏切[うらぎ]る思[おも]いを入[い]れていた。"
  3: "イエスは、父[ちち]がすべてをご自分[じぶん]の手[て]に委[ゆだ]ねられたこと、また、ご自分[じぶん]が神[かみ]から出[で]て来[き]て神[かみ]のもとへ帰[かえ]って行[い]くことを知[し]っておられた。"
  4: "そして、夕食[ゆうしょく]の席[せき]から立[た]ち上[あ]がり、上着[うわぎ]を脱[ぬ]いで、手拭[てぬぐ]いを取[と]って腰[こし]に巻[ま]かれた。"
  5: "次[つぎ]に、たらいに水[みず]を入[い]れ、弟子[でし]たちの足[あし]を洗[あら]い始[はじ]め、腰[こし]に巻[ま]いた手拭[てぬぐ]いでそれを拭[ふ]き始[はじ]められた。"
  6: "シモン・ペトロのところへ来[こ]られると、彼[かれ]は言[い]った。「主[しゅ]よ、あなたがわたしの足[あし]をお洗[あら]いになるのですか。」"
  7: "イエスは答[こた]えて言[い]われた。「<j>わたしがしていることを、あなたは今[いま]は分[わ]からない。しかし、後[のち]には分[わ]かるようになる。</j>」"
  8: "ペトロは言[い]った。「いつまでも、わたしの足[あし]をお洗[あら]いにならないでください。」イエスは答[こた]えて言[い]われた。「<j>もしわたしがあなたを洗[あら]わなければ、あなたはわたしと関[かか]わりがなくなる。</j>」"
  9: "シモン・ペトロは言[い]った。「主[しゅ]よ、足[あし]だけでなく、手[て]も頭[あたま]もお洗[あら]いください。」"
  10: "イエスは言[い]われた。「<j>体[からだ]を洗[あら]った者[もの]は、足[あし]のほかは洗[あら]う必要[ひつよう]がない。全身[ぜんしん]がきれいなのである。あなたがたもきれいだが、すべてがそうではない。</j>」"
  11: "イエスは、ご自分[じぶん]を裏切[うらぎ]る者[もの]を知[し]っておられた。それで、すべてがそうではないと言[い]われたのである。"
  12: "こうして、彼[かれ]らの足[あし]を洗[あら]い、上着[うわぎ]を着[き]て席[せき]に着[つ]かれると、また言[い]われた。「<j>わたしがあなたがたにしたことが分[わ]かるか。</j>"
  13: "<j>あなたがたはわたしを『先生[せんせい]』『主[しゅ]』と呼[よ]んでいる。それは正[ただ]しい。わたしは確[たし]かにそうだからである。</j>"
  14: "<j>主[しゅ]であり先生[せんせい]であるこのわたしが、あなたがたの足[あし]を洗[あら]ったのだから、あなたがたも互[たが]いに足[あし]を洗[あら]い合[あ]うべきである。</j>"
  15: "<j>わたしがあなたがたにしたとおりに、あなたがたもするように、わたしは模範[もはん]を示[しめ]したのである。</j>"
  16: "<j>よくよく言[い]っておく。僕[しもべ]はその主人[しゅじん]より偉[えら]くなく、遣[つか]わされた者[もの]は、遣[つか]わした者[もの]より偉[えら]くない。</j>"
  17: "<j>もしあなたがたがこれを知[し]っていて、それを実行[じっこう]するなら、あなたがたは幸[さいわ]いである。</j>"
  18: "<j>わたしはあなたがた全員[ぜんいん]について言[い]っているのではない。わたしは自分[じぶん]が選[えら]んだ者[もの]たちを知[し]っている。しかし、聖書[せいしょ]に『わたしのパンを食[た]べる者[もの]が、わたしに向[む]かってかかとを上[あ]げた』と書[か]かれている言葉[ことば]が成就[じょうじゅ]するためである。</j>"
  19: "<j>今[いま]から、事[こと]が起[お]こる前[まえ]に、わたしはあなたがたに言[い]っておく。事[こと]が起[お]こったとき、あなたがたが、このわたしであると信[しん]じるためである。</j>"
  20: "<j>よくよく言[い]っておく。わたしが遣[つか]わす者[もの]をだれでも受[う]け入[い]れる者[もの]は、わたしを受[う]け入[い]れるのである。わたしを受[う]け入[い]れる者[もの]は、わたしを遣[つか]わした方[かた]を受[う]け入[い]れるのである。</j>」"
  21: "こう言[い]ってから、イエスは心[こころ]を騒[さわ]がせ、証[あか]しをして言[い]われた。「<j>よくよく言[い]っておく。あなたがたのうちの一人[ひとり]が、わたしを裏切[うらぎ]る。</j>」"
  22: "弟子[でし]たちは、だれのことを言[い]っておられるのか分[わ]からず、互[たが]いに顔[かお]を見[み]合[あ]った。"
  23: "イエスが愛[あい]しておられた弟子[でし]の一人[ひとり]が、イエスの胸[むね]にもたれて席[せき]に着[つ]いていた。"
  24: "そこで、シモン・ペトロはその弟子[でし]に合図[あいず]して、だれのことを言[い]っておられるのか尋[たず]ねさせた。"
  25: "その弟子[でし]は、そのままイエスの胸[むね]にもたれかかって言[い]った。「主[しゅ]よ、それはだれですか。」"
  26: "イエスは答[こた]えて言[い]われた。「<j>わたしがパンを浸[ひた]して渡[わた]す者[もの]が、その人[ひと]である。</j>」そして、パンを浸[ひた]して、シモンの子[こ]ユダ・イスカリオテに渡[わた]された。"
  27: "パンを受[う]け取[と]ると、そのときサタンが彼[かれ]のうちに入[はい]った。そこでイエスは言[い]われた。「<j>しようとしていることを、早[はや]くしなさい。</j>」"
  28: "席[せき]に着[つ]いていた者[もの]たちは、なぜそう言[い]われたのか、だれも分[わ]からなかった。"
  29: "ユダが金[かね]入[い]れを預[あず]かっていたので、ある人[ひと]たちは、イエスが彼[かれ]に『祭[まつ]りに必要[ひつよう]なものを買[か]いなさい』、あるいは『貧[まず]しい人[ひと]たちに何[なに]か施[ほどこ]しなさい』と言[い]われたのだと思[おも]った。"
  30: "彼[かれ]はパンを受[う]け取[と]ると、すぐに出[で]て行[い]った。すでに夜[よる]であった。"
  31: "彼[かれ]が出[で]て行[い]くと、イエスは言[い]われた。「<j>今[いま]、人[ひと]の子[こ]は栄光[えいこう]を受[う]け、神[かみ]も彼[かれ]において栄光[えいこう]を受[う]けられた。</j>"
  32: "<j>〔神[かみ]が彼[かれ]において栄光[えいこう]を受[う]けられたのなら、〕神[かみ]もご自身[じしん]において彼[かれ]に栄光[えいこう]をお与[あた]えになる。そして、すぐに彼[かれ]に栄光[えいこう]をお与[あた]えになる。</j>」"
  33: "<j>小[ちい]さな子[こ]たちよ、わたしはまだしばらくあなたがたと一緒[いっしょ]にいる。あなたがたはわたしを捜[さが]すだろう。わたしがユダヤ人[じん]たちに『わたしの行[い]く所[ところ]へは、あなたがたは来[く]ることができない』と言[い]ったように、今[いま]、あなたがたにも言[い]う。</j>"
  34: "<j>わたしはあなたがたに新[あたら]しい掟[おきて]を与[あた]える。すなわち、互[たが]いに愛[あい]し合[あ]うことである。わたしがあなたがたを愛[あい]したのと同[おな]じように、あなたがたも互[たが]いに愛[あい]し合[あ]いなさい。</j>"
  35: "<j>あなたがたが互[たが]いに愛[あい]し合[あ]うなら、すべての人[ひと]はそれによって、あなたがたがわたしの弟子[でし]であることを知[し]るであろう。</j>"
  36: "シモン・ペトロは言[い]った。「主[しゅ]よ、どこへ行[い]かれるのですか。」イエスは答[こた]えられた。「<j>わたしが行[い]く所[ところ]へ、あなたは今[いま]はついて来[く]ることができない。しかし、後[のち]にはついて来[く]るであろう。</j>」"
  37: "ペトロは言[い]った。「主[しゅ]よ、なぜ今[いま]ついて行[い]くことができないのですか。あなたのためなら、わたしの命[いのち]を捨[す]てます。」"
  38: "イエスは答[こた]えられた。「<j>あなたはわたしのために命[いのち]を捨[す]てるのか。よくよく言[い]っておく。鶏[にわとり]が鳴[な]くまでに、あなたは三度[さんど]、わたしを知[し]らないと言[い]うであろう。</j>」"

notes:
  1: "εἰς τέλος ἠγάπησεν — «возлюбил до конца»: и временно (до конца жизни), и предельно. 終わりまで彼らを愛された — оба смысла сохранены. Сноски на 過越祭 нет: она уже дана при первом упоминании в корпусе (Мф 26:2, Мк 14:1)."
  2: "ἵνα παραδοῖ αὐτὸν Ἰούδας Σίμωνος Ἰσκαριώτου — «чтобы Иуда, сын Симона Искариота, предал Его»; родительный при имени передан シモンの子ユダ・イスカリオテ. У Иоанна Пасха ещё не наступила (см. 13:1)."
  3: "πάντα ἔδωκεν αὐτῷ ὁ πατὴρ εἰς τὰς χεῖρας — «всё предал Отец в руки Его»; ἀπὸ θεοῦ ἐξῆλθεν καὶ πρὸς τὸν θεὸν ὑπάγει — «от Бога исшёл и к Богу идёт». Порядок сохранён."
  4: "τίθησιν τὰ ἱμάτια — «полагает одежды»; λέντιον — полотенце, 手拭い. У jp-joc 手巾."
  5: "νιπτήρ — таз для омовения, たらい. ἐκμάσσειν — «отирать»; 拭き始められた, как и 洗い始め (ἤρξατο)."
  6: "Σίμων Πέτρος — полное имя, как в греческом. Вопрос Петра — вне красного."
  7: "Ὃ ἐγὼ ποιῶ σὺ οὐκ οἶδας ἄρτι, γνώσῃ δὲ μετὰ ταῦτα — «что Я делаю, ты не знаешь теперь, узнаешь же после сего». ἀπεκρίθη… καὶ εἶπεν — 答えて言われた."
  8: "οὐ μὴ νίψῃς… εἰς τὸν αἰῶνα — «не омоешь… вовеки»; いつまでも…ないでください. οὐκ ἔχεις μέρος μετ᾽ ἐμοῦ — «не имеешь части со Мною»; わたしと関わりがなくなる (по заданию)."
  9: "μὴ τοὺς πόδας μου μόνον ἀλλὰ καὶ τὰς χεῖρας καὶ τὴν κεφαλήν — «не только ноги мои, но и руки и голову»; порядок «руки и голову» сохранён."
  10: "ὁ λελουμένος — «омытый [весь]»; οὐκ ἔχει χρείαν εἰ μὴ τοὺς πόδας νίψασθαι — «не имеет нужды, разве только ноги омыть»; 足のほかは洗う必要がない. ἔστιν καθαρὸς ὅλος — «весь чист»; 全身がきれい. ἀλλ᾽ οὐχὶ πάντες — «но не все»."
  11: "ᾔδει γὰρ τὸν παραδιδόντα αὐτόν — «ибо знал предающего Его». Косвенная передача слов 13:10, поэтому вне красного и без кавычек."
  12: "ἀνέπεσεν πάλιν — «возлёг опять»; 席に着かれる. Γινώσκετε τί πεποίηκα ὑμῖν; — «понимаете ли, что Я сделал вам?»"
  13: "Ὁ διδάσκαλος καὶ Ὁ κύριος — «Учитель и Господь»; вложенная цитата — 『先生』『主』. εἰμὶ γάρ — «ибо Я есмь»; わたしは確かにそうだからである."
  14: "ὀφείλετε ἀλλήλων νίπτειν τοὺς πόδας — «должны друг другу омывать ноги»; 互いに足を洗い合うべきである."
  15: "ὑπόδειγμα — «образец, пример»; 模範. ἵνα καθὼς ἐγὼ ἐποίησα ὑμῖν καὶ ὑμεῖς ποιῆτε — «чтобы, как Я сделал вам, и вы делали»."
  16: "ἀμὴν ἀμὴν λέγω ὑμῖν — двойное «аминь»; よくよく言っておく (в Синоптических книгах одиночное ἀμήν — はっきり言っておく, у Иоанна двойное — よくよく). ἀπόστολος здесь не «апостол» как сан, а «посланный»; 遣わされた者."
  17: "εἰ ταῦτα οἴδατε, μακάριοί ἐστε ἐὰν ποιῆτε αὐτά — «если это знаете, блаженны вы, если исполняете». Два условия греческого (εἰ… и ἐὰν…) сведены в 知っていて…するなら; μακάριοι — 幸いである. Знание без исполнения не делает блаженным."
  18: "Пс 40:10 (LXX 39:10), ἡ γραφή — 聖書. ὁ τρώγων μου τὸν ἄρτον — «едящий хлеб мой»; ἐπῆρεν ἐπ᾽ ἐμὲ τὴν πτέρναν αὐτοῦ — «поднял на Меня пяту свою»; かかとを上げた. Цитата — в 『』."
  19: "πρὸ τοῦ γενέσθαι — «прежде нежели быть [сему]»; ἀπ᾽ ἄρτι — «отныне». ἐγώ εἰμι без сказуемого — このわたしである (как в 8:24,28)."
  20: "ὁ λαμβάνων ἄν τινα πέμψω — «принимающий, кого Я пошлю»; λαμβάνω — 受け入れる. Порядок «принимающий вас принимает Меня, принимающий Меня принимает Пославшего Меня» сохранён."
  21: "ἐταράχθη τῷ πνεύματι — «возмутился духом»; буквально «духом», передано 心を騒がせ (как у jp-joc 心傷みて), чтобы 霊 не читалось как Святой Дух. ἐμαρτύρησεν — «засвидетельствовал»; 証しをして. Слова Христа — красным."
  22: "ἀπορούμενοι περὶ τίνος λέγει — «недоумевая, о ком говорит»; だれのことを言っておられるのか分からず."
  23: "ἐν τῷ κόλπῳ τοῦ Ἰησοῦ — «на лоне Иисуса»; 胸にもたれて. ὃν ἠγάπα ὁ Ἰησοῦς — «которого любил Иисус»; имя не названо, как у Иоанна."
  24: "νεύει — «кивает, подаёт знак»; 合図して. πυθέσθαι τίς ἂν εἴη — «спросить, кто бы это был»."
  25: "ἀναπεσὼν… ἐπὶ τὸ στῆθος — «припав… к груди»; 胸にもたれかかって. Вопрос ученика — вне красного."
  26: "ψωμίον — «кусок [хлеба]»; パン. В критическом издании [λαμβάνει καὶ] под скобками; церковное «берёт и» отдельно не выражено (浸して…渡された), поэтому 〔〕 не ставится, колебание отмечено здесь."
  27: "μετὰ τὸ ψωμίον τότε εἰσῆλθεν εἰς ἐκεῖνον ὁ Σατανᾶς — «после куска тогда вошёл в него сатана»; そのとき. Ὃ ποιεῖς ποίησον τάχιον — «что делаешь, делай скорее»."
  28: "τοῦτο… οὐδεὶς ἔγνω τῶν ἀνακειμένων πρὸς τί εἶπεν αὐτῷ — «никто из возлежавших не понял, к чему Он сказал ему»."
  29: "γλωσσόκομον — «ящичек [для денег]»; 金入れ. ἐπεὶ τὸ γλωσσόκομον εἶχεν Ἰούδας — «так как ящик был у Иуды». Две предполагаемые реплики Христа — в 『』, вне красного, так как это догадка учеников, а не прямая речь."
  30: "λαβὼν… ἐξῆλθεν εὐθύς — «приняв, тотчас вышел»; ἦν δὲ νύξ — «была же ночь»."
  31: "ἐδοξάσθη — аорист страдательный; 栄光を受けた. ὁ υἱὸς τοῦ ἀνθρώπου — 人の子."
  32: "В критическом издании начальное εἰ ὁ θεὸς ἐδοξάσθη ἐν αὐτῷ стоит под скобками (повтор 13:31); Церковь читает его, поэтому оно переведено и отмечено 〔…〕 как церковное чтение. δοξάσει — «прославит»; 栄光をお与えになる, чтобы не смешивать с 栄光を受ける в 31."
  33: "τεκνία — «детки»; 小さな子たち. καθὼς εἶπον τοῖς Ἰουδαίοις — ссылка на 7:34; ユダヤ人たちに言ったように. Цитата — в 『』."
  34: "ἐντολὴν καινὴν δίδωμι ὑμῖν — «заповедь новую даю вам»; 新しい掟. καθὼς ἠγάπησα ὑμᾶς — «как Я возлюбил вас»; мера любви, а не только образец."
  35: "ἐν τούτῳ γνώσονται πάντες — «по этому узнают все»; それによって…知るであろう."
  36: "ποῦ ὑπάγεις; — вопрос Петра, вне красного. ἀκολουθῆσαι — «следовать»; ついて来る. ὕστερον — «после»; 後には."
  37: "τὴν ψυχήν μου ὑπὲρ σοῦ θήσω — «душу мою за Тебя положу»; 命を捨てる. Ответ Петра — вне красного."
  38: "ἀμὴν ἀμὴν λέγω σοι — двойное «аминь», обращение в единственном числе; よくよく言っておく. ἕως οὗ ἀρνήσῃ με τρίς — «доколе не отречёшься Меня трижды»; 鶏が鳴くまでに…三度."
