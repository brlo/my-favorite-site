verses:
  1: "カイサリアにコルネリオという名[な]の男[おとこ]がいた。『イタリア隊[たい]』と呼[よ]ばれる部隊[ぶたい]の百人隊長[ひゃくにんたいちょう]である。"
  2: "彼[かれ]は敬虔[けいけん]な人[ひと]で、家族[かぞく]そろって神[かみ]を畏[おそ]れ、民[たみ]に多[おお]くの施[ほどこ]しをし、いつも神[かみ]に祈[いの]っていた。"
  3: "ある日[ひ]、午後[ごご]三時[さんじ]ごろ、彼[かれ]は幻[まぼろし]の中[なか]ではっきりと、神[かみ]の天使[てんし]が自分[じぶん]のところへ入[はい]って来[き]て、「コルネリオ。」と言[い]うのを見[み]た。"
  4: "彼[かれ]は天使[てんし]をじっと見[み]つめ、恐[おそ]れて言[い]った。「主[しゅ]よ、何[なん]のことでしょうか。」天使[てんし]が言[い]った。「あなたの祈[いの]りと施[ほどこ]しは、神[かみ]の前[まえ]に上[のぼ]って覚[おぼ]えられています。"
  5: "そこで今[いま]、人[ひと]をヨッパへ遣[つか]わして、ペトロと呼[よ]ばれるシモンという者[もの]を呼[よ]び寄[よ]せなさい。"
  6: "彼[かれ]は海[うみ]べりの家[いえ]に住[す]む、皮[かわ]をなめす職人[しょくにん]シモンという人[ひと]のところに滞在[たいざい]している。〔その人[ひと]は、あなたとあなたの家族[かぞく]の救[すく]いにつながる言葉[ことば]を、あなたに語[かた]るだろう。〕」"
  7: "語[かた]り終[お]えた天使[てんし]が去[さ]ると、彼[かれ]は僕[しもべ]二[に]人[にん]と、いつも自分[じぶん]に仕[つか]えている敬虔[けいけん]な兵士[へいし]一人[ひとり]を呼[よ]び、"
  8: "すべてを話[はな]して聞[き]かせ、ヨッパへ遣[つか]わした。"
  9: "翌日[よくじつ]、彼[かれ]らが道[みち]を進[すす]んで町[まち]に近[ちか]づいたころ、ペトロは昼[ひる]の十二時[じゅうにじ]ごろ、祈[いの]るために屋上[おくじょう]に上[あ]がった。"
  10: "彼[かれ]は空腹[くうふく]を覚[おぼ]え、何[なに]か食[た]べたいと思[おも]った。人々[ひとびと]が食事[しょくじ]の用意[ようい]をしていると、彼[かれ]は夢[ゆめ]うつつを抜[ぬ]かしたような状態[じょうたい]になった。"
  11: "彼[かれ]は天[てん]が開[ひら]き、大[おお]きな布[ぬの]のような器[うつわ]が四[よっ]隅[すみ]をつり下[さ]げられて地面[じめん]に降[お]りて来[く]るのを見[み]た。"
  12: "その中[なか]には、地上[ちじょう]のあらゆる四[し]足[そく]の獣[けもの]、這[は]うもの、空[そら]の鳥[とり]がいた。"
  13: "すると、彼[かれ]に語[かた]りかける声[こえ]があった。「ペトロ、起[お]きて、屠[ほふ]って食[た]べよ。」"
  14: "ペトロは言[い]った。「主[しゅ]よ、決[けっ]してできません。汚[けが]れたもの、清[きよ]くないものを、わたしはかつて食[た]べたことがないのです。」"
  15: "声[こえ]が再[ふたた]び彼[かれ]に言[い]った。「神[かみ]が清[きよ]めたものを、あなたが汚[けが]れているとしてはいけない。」"
  16: "これが三[さん]度[ど]繰[く]り返[かえ]されると、器[うつわ]はすぐに天[てん]へ引[ひ]き上[あ]げられた。"
  17: "ペトロが、見[み]た幻[まぼろし]は何[なん]の意味[いみ]だろうかと心[こころ]の中[なか]で思[おも]い惑[まど]っていると、見[み]よ、コルネリオから遣[つか]わされた人々[ひとびと]が、シモンの家[いえ]を尋[たず]ね当[あ]てて門[もん]の前[まえ]に立[た]った。"
  18: "彼[かれ]らは呼[よ]びかけながら、ペトロと呼[よ]ばれるシモンがそこに滞在[たいざい]しているかどうかを尋[たず]ねた。"
  19: "ペトロがまだその幻[まぼろし]のことを思[おも]い巡[めぐ]らしていると、{聖霊[せいれい]|聖神[せいしん]}が彼[かれ]に言[い]われた。「見[み]よ、男[おとこ]たちが〔三[さん]人[にん]〕、あなたを尋[たず]ねている。"
  20: "立[た]ち上[あ]がって下[くだ]り、何[なに]も疑[うたが]わずに彼[かれ]らと一緒[いっしょ]に行[い]きなさい。わたしが彼[かれ]らを遣[つか]わしたからである。」"
  21: "そこでペトロは、〔コルネリオから遣[つか]わされた〕人々[ひとびと]のところへ下[くだ]りて言[い]った。「わたしが、あなたがたが尋[たず]ねている者[もの]です。どういうわけで来[こ]られたのですか。」"
  22: "彼[かれ]らは言[い]った。「百人隊長[ひゃくにんたいちょう]コルネリオは、正[ただ]しい人[ひと]で神[かみ]を畏[おそ]れ、ユダヤの民[たみ]全体[ぜんたい]からも認[みと]められている者[もの]ですが、聖[せい]なる天使[てんし]から、あなたを家[いえ]に招[まね]いて言葉[ことば]を聞[き]くようにとのお告[つ]げを受[う]けました。」"
  23: "そこでペトロは彼[かれ]らを家[いえ]に入[い]れて泊[と]まらせた。翌日[よくじつ]、彼[かれ]は立[た]ち上[あ]がって彼[かれ]らと一緒[いっしょ]に出[で]かけた。ヨッパの兄弟[きょうだい]たちも数人[すうにん]、彼[かれ]とともに同行[どうこう]した。"
  24: "その次[つぎ]の日[ひ]、彼[かれ]はカイサリアに入[はい]った。コルネリオは親族[しんぞく]と親[した]しい友人[ゆうじん]たちを集[あつ]めて、彼[かれ]らを待[ま]っていた。"
  25: "ペトロが入[はい]ろうとすると、コルネリオは彼[かれ]を迎[むか]え、足[あし]もとにひれ伏[ふ]して拝[おが]んだ。"
  26: "しかし、ペトロは彼[かれ]を起[おこ]して言[い]った。「お立[た]ちなさい。わたしも人間[にんげん]です。」"
  27: "そして、彼[かれ]と語[かた]りながら中[なか]に入[はい]ると、多[おお]くの人[ひと]が集[あつ]まっていた。"
  28: "彼[かれ]は彼[かれ]らに言[い]った。「ご存[ぞん]じのように、ユダヤ人[じん]が異邦人[いほうじん]と交[まじ]わったり、その家[いえ]に入[はい]ったりするのは、許[ゆる]されないことです。ところが、神[かみ]はわたしに、だれ一人[ひとり]、汚[けが]れた者[もの]、清[きよ]くない者[もの]と呼[よ]んではならないと示[しめ]されました。"
  29: "ですから、お招[まね]きを受[う]けたとき、ためらわずに来[き]ました。そこでお尋[たず]ねします。どういうわけで、わたしをお招[まね]きになったのですか。」"
  30: "コルネリオが言[い]った。「四日[よっか]前[まえ]の今[いま]ごろ、わたしは家[いえ]で午後[ごご]三時[さんじ]の祈[いの]りをしていました。すると、見[み]よ、輝[かがや]く衣[ころも]を着[き]た人[ひと]がわたしの前[まえ]に立[た]ち、"
  31: "こう言[い]いました。『コルネリオ、あなたの祈[いの]りは聞[き]き入[い]れられ、あなたの施[ほどこ]しは神[かみ]の前[まえ]に覚[おぼ]えられています。"
  32: "だから、ヨッパへ人[ひと]を遣[つか]わして、ペトロと呼[よ]ばれるシモンを呼[よ]び寄[よ]せなさい。彼[かれ]は海[うみ]べりの、皮[かわ]をなめす職人[しょくにん]シモンの家[いえ]に滞在[たいざい]している。〔彼[かれ]は来[き]て、あなたに語[かた]るだろう。〕』"
  33: "そこで、わたしはすぐにあなたのところへ人[ひと]を遣[つか]わしました。よくぞおいでくださいました。今[いま]、わたしたちは皆[みな]、主[しゅ]があなたにお命[めい]じになったことをすべて聞[き]こうとして、神[かみ]の前[まえ]に集[あつ]まっています。」"
  34: "そこで、ペトロは口[くち]を開[ひら]いて言[い]った。「わたしは、神[かみ]が人[ひと]を分[わ]け隔[へだ]てしない方[かた]であることを、本当[ほんとう]に悟[さと]りました。"
  35: "どの民[たみ]の中[なか]でも、神[かみ]を畏[おそ]れて正[ただ]しい行[おこな]いをする人[ひと]は、神[かみ]に受[う]け入[い]れられるのです。"
  36: "神[かみ]はイスラエルの子[こ]らに御言葉[みことば]を遣[つか]わし、イエス・キリストによって平和[へいわ]の福音[ふくいん]を告[つ]げ知[し]らせました。この方[かた]はすべてのものの主[しゅ]です。"
  37: "あなたがたは、ヨハネが洗礼[せんれい]を宣[の]べ伝[つた]えた後[のち]、ガリラヤから始[はじ]まってユダヤ全土[ぜんど]で起[お]こったことを知[し]っています。"
  38: "すなわち、ナザレのイエスのことです。神[かみ]が{聖霊[せいれい]|聖神[せいしん]}と力[ちから]によってこの方[かた]に油[あぶら]を注[そそ]がれたので、この方[かた]は巡[めぐ]り歩[ある]いて善[ぜん]い行[おこな]いをし、悪魔[あくま]に虐[しいた]げられている者[もの]をすべていやされたのです。神[かみ]がこの方[かた]とともにおられたからです。"
  39: "わたしたちは、この方[かた]がユダヤの地[ち]とエルサレムで行[おこな]ったすべてのことの証人[しょうにん]です。そして、この方[かた]を木[き]につるして殺[ころ]したのです。"
  40: "神[かみ]はこの方[かた]を三日目[みっかめ]に復活[ふっかつ]させ、姿[すがた]を現[あらわ]させました。"
  41: "民[たみ]すべてにではなく、神[かみ]が前[まえ]もって選[えら]んでおかれた証人[しょうにん]、すなわち、わたしたちにです。わたしたちは、この方[かた]が死者[ししゃ]の中[なか]から復活[ふっかつ]された後[のち]、この方[かた]と一緒[いっしょ]に食[た]べたり飲[の]んだりしたのです。"
  42: "また、この方[かた]が、生[い]ける者[もの]と死[し]んだ者[もの]を裁[さば]く審判者[しんぱんしゃ]として神[かみ]によって定[さだ]められた方[かた]であることを、民[たみ]に宣[の]べ、証[しょう]するようにと、わたしたちにお命[めい]じになりました。"
  43: "すべての預言者[よげんしゃ]も、この方[かた]を信[しん]じる者[もの]がだれでも、この方[かた]の名[な]によって罪[つみ]の赦[ゆる]しを受[う]けると証[しょう]しています。」"
  44: "ペトロがまだこれらの言葉[ことば]を語[かた]っているうちに、{聖霊[せいれい]|聖神[せいしん]}が、御言葉[みことば]を聞[き]いていたすべての人[ひと]に降[くだ]った。"
  45: "ペトロと一緒[いっしょ]に来[き]ていた、割礼[かつれい]を受[う]けた信者[しんじゃ]たちは、{聖霊[せいれい]|聖神[せいしん]}の賜[たまもの]が異邦人[いほうじん]たちにも注[そそ]がれたのを見[み]て、驚[おどろ]いた。"
  46: "彼[かれ]らが異[こと]なった言語[げんご]で語[かた]り、神[かみ]をほめたたえているのを聞[き]いたからである。そこでペトロは言[い]った。"
  47: "「この人[ひと]たちは、わたしたちと同じように{聖霊[せいれい]|聖神[せいしん]}を受[う]けたのですから、水[みず]で洗礼[せんれい]を受[う]けるのを、だれが妨[さまた]げられましょうか。」"
  48: "そこで、彼[かれ]らにイエス・キリストの名[な]によって洗礼[せんれい]を受[う]けるように命[めい]じた。その後[のち]、彼[かれ]らはペトロに、しばらく滞在[たいざい]してほしいと頼[たの]んだ。"

notes:
  1: "σπεῖρα Ἰταλική — «Италийская когорта»; イタリア隊. ἑκατοντάρχης — 百人隊長."
  3: "ὥρα ἐνάτη — девятый час, около трёх часов пополудни; 午後三時ごろ. ἐν ὁράματι φανερῶς — «явно, в видении»."
  6: "Слова οὗτος λαλήσει σοι… (церковное чтение, ср. 11:14) в критической базе отсутствуют — 〔…〕."
  10: "ἔκστασις — «исступление, состояние вне себя»; 夢うつつを抜かしたような状態."
  11: "ὀθόνη — «полотно, простыня»; 布. ἀρχαί — «углы»; 四隅."
  13: "Голос с неба — не красным: это голос Божий в видении, а не прямая речь Христа в евангельском смысле (решение для корпуса)."
  19: "В критической базе [δύο] («два»), церковный текст и 11:11 читают «три» — 三人 в 〔…〕. τὸ πνεῦμα — 聖霊, говорит с Петром."
  21: "В критической базе только πρὸς τοὺς ἄνδρας; τοὺς ἀπεσταλμένους ἀπὸ τοῦ Κορνηλίου (церковное чтение, ср. jp-joc) — в 〔…〕."
  26: "Ἀνάστηθι· καὶ ἐγὼ αὐτὸς ἄνθρωπός εἰμι — «встань; и я сам человек»; お立ちなさい。わたしも人間です."
  28: "ἀθέμιτον — «непозволительно» (по обычаю, не по закону); 許されないこと. κοινὸν ἢ ἀκάθαρτον — «скверное или нечистое»; 汚れた者、清くない者."
  32: "ὃς ἐλθὼν λαλήσει σοι (церковное чтение) в базе отсутствует — 〔…〕."
  36: "Стих 36 — начало периода, продолжающегося в 37 (ὑμεῖς οἴδατε); по-японски разбито на два предложения."
  40: "ἤγειρεν — «воздвиг»; 復活させ."
  44: "ἐπέπεσεν τὸ πνεῦμα τὸ ἅγιον — «Дух Святой сошёл»; 降った."
  46: "γλώσσαις — «языками»; 異なった言語で, как в 2:4 (ほかの言葉で); в 19:6 — 異言."
  47: "Μήτι τὸ ὕδωρ δύναται κωλῦσαί τις… — риторический вопрос; だれが妨げられましょうか."
