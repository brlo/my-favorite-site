# jp-box, Деяния апостолов, глава 10. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 10: видение Корнилия (1–8), видение Петра (9–16), посланные Корнилия (17–23а),
# Пётр в Кесарии (23б–33), речь Петра (34–43), сошествие Духа на язычников (44–48).
# Красного в главе нет: 10:13–15 — голос с неба в видении, а не прямая речь Христа
# в евангельском смысле (решение для корпуса); голос, ангел, Дух — не красным.
# 〔…〕: 10:6б и 10:32б — церковное «он скажет тебе слова спасения» / «он придёт
# и скажет тебе» в критической базе отсутствуют; 10:19 «три» при [δύο] в базе;
# 10:21 «посланные от Корнилия» в базе отсутствуют.
# jp-ni не использовался.

