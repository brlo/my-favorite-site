verses:
  1: "「これらは、あなたがたの父[ちち]たちの神[かみ]である主[しゅ]が、あなたがたに嗣業[しぎょう]として与[あた]えられる地[ち]で、あなたがたが地上[ちじょう]に生[い]きているすべての日[ひ]に守[まも]って行[おこな]うべき定[さだ]めと裁[さば]きである。"
  2: "あなたがたが嗣業[しぎょう]として受[う]け継[つ]ぐもろもろの民[たみ]が、自分[じぶん]たちの神々[かみがみ]に仕[つか]えたすべての場所[ばしょ]、すなわち高[たか]い山[やま]の上[うえ]、丘[おか]の上[うえ]、葉[は]の茂[しげ]った木[き]の下[した]にある場所[ばしょ]を、あなたがたは必[かなら]ず滅[ほろ]ぼし尽[つ]くしなければならない。"
  3: "あなたがたは彼[かれ]らの祭壇[さいだん]を打[う]ち壊[こわ]し、彼[かれ]らの石柱[せきちゅう]を砕[くだ]き、彼[かれ]らの聖[せい]なる木立[こだち]を切[き]り倒[たお]し、彼[かれ]らの神々[かみがみ]の彫[ほ]り像[ぞう]を火[ひ]で焼[や]き、その名[な]をあの場所[ばしょ]から消[け]し去[さ]らなければならない。"
  4: "あなたがたはあなたがたの神[かみ]である主[しゅ]に、そのようにはしてはならない。"
  5: "ただ、あなたがたの神[かみ]である主[しゅ]が、あなたがたの部族[ぶぞく]の一[ひと]つに、ご自分[じぶん]の名[な]を置[お]き、そこに御名[みな]が呼[よ]ばれるために選[えら]ばれる場所[ばしょ]、そこをあなたがたは尋[たず]ね求[もと]め、そこへ行[ゆ]きなさい。"
  6: "そこへ、あなたがたの燔祭[はんさい]と、あなたがたの犠牲[ぎせい]と、あなたがたの十分[じゅうぶん]の一[いち]と、あなたがたの手[て]の初穂[はつほ]と、あなたがたの誓願[せいがん]の供[そな]え物[もの]と、あなたがたの自発[じはつ]の供[そな]え物[もの]と、あなたがたの牛[うし]と羊[ひつじ]の初子[ういご]を携[たずさ]えて来[き]なさい。"
  7: "あなたがたはそこで、あなたがたの神[かみ]である主[しゅ]の前[まえ]で食[た]べ、あなたがたもあなたがたの家[いえ]の者[もの]たちも、あなたがたの手[て]が触[ふ]れるすべてのもののゆえに喜[よろこ]びなさい。あなたの神[かみ]である主[しゅ]があなたを祝福[しゅくふく]されたからである。"
  8: "あなたがたは、わたしたちが今日[きょう]ここでしているすべてのこと、すなわちおのおのが自分[じぶん]の目[め]にかなうと思[おも]うことをしてはならない。"
  9: "あなたがたはまだ、あなたがたの神[かみ]である主[しゅ]があなたがたに与[あた]えられる安息[あんそく]と嗣業[しぎょう]のところに来[き]ていないからである。"
  10: "しかし、あなたがたはヨルダン川[がわ]を渡[わた]り、あなたがたの神[かみ]である主[しゅ]があなたがたに嗣業[しぎょう]として与[あた]えられる地[ち]に住[す]み、主[しゅ]があなたがたを、周囲[しゅうい]のすべての敵[てき]から休[やす]ませてくだされば、あなたがたは安心[あんしん]して住[す]むであろう。"
  11: "そのとき、あなたがたの神[かみ]である主[しゅ]が、ご自分[じぶん]の名[な]を置[お]くために選[えら]ばれる場所[ばしょ]、そこへ、わたしが今日[きょう]あなたがたに命[めい]じるすべてのもの、すなわちあなたがたの燔祭[はんさい]、あなたがたの犠牲[ぎせい]、あなたがたの十分[じゅうぶん]の一[いち]、あなたがたの手[て]の初穂[はつほ]、あなたがたの神[かみ]に誓[ちか]う供[そな]え物[もの]のうちから選[えら]び抜[ぬ]いたすべてのものを携[たずさ]えて来[き]なさい。"
  12: "あなたがたは、あなたがたの神[かみ]である主[しゅ]の前[まえ]で、あなたがたも、あなたがたの息子[むすこ]たちも娘[むすめ]たちも、男[おとこ]の奴隷[どれい]も女[おんな]の奴隷[どれい]も、あなたがたの町々[まちまち]の門[もん]の内[うち]にいるレビ人[びと]もともに喜[よろこ]びなさい。レビ人[びと]にはあなたがたの間[あいだ]に分[ぶん]も嗣業[しぎょう]もないからである。"
  13: "あなたがたは自分[じぶん]に気[き]をつけなさい。あなたが見[み]るどの場所[ばしょ]でも、あなたの燔祭[はんさい]を献[ささ]げてはならない。"
  14: "ただ、あなたの神[かみ]である主[しゅ]が、あなたの部族[ぶぞく]の一[ひと]つに選[えら]ばれる場所[ばしょ]、そこであなたの燔祭[はんさい]を献[ささ]げ、わたしが今日[きょう]あなたに命[めい]じるすべてのことを行[おこな]いなさい。"
  15: "しかし、あなたは心[こころ]の望[のぞ]むままに、あなたの神[かみ]である主[しゅ]があなたに与[あた]えられた祝福[しゅくふく]に従[したが]って、あなたのすべての町[まち]で家畜[かちく]を屠[ほふ]って肉[にく]を食[た]べることができる。汚[けが]れた者[もの]も清[きよ]い者[もの]も、かもしかや鹿[しか]の肉[にく]のように、それを食[た]べてよい。"
  16: "ただ、血[ち]は食[た]べてはならない。それを水[みず]のように地[ち]に注[そそ]ぎ出[だ]しなさい。"
  17: "あなたは自分の町々[まちまち]で、あなたの穀物[こくもつ]とぶどう酒[しゅ]と油[あぶら]の十分[じゅうぶん]の一[いち]、あなたの牛[うし]と羊[ひつじ]の初子[ういご]、あなたが誓[ちか]うすべての誓願[せいがん]、あなたがたが申[もう]し述[の]べた供[そな]え物[もの]、あなたの手[て]の初穂[はつほ]を食[た]べることはできない。"
  18: "ただ、あなたの神[かみ]である主[しゅ]の前[まえ]、あなたの神[かみ]である主[しゅ]が選[えら]ばれる場所[ばしょ]で、それを食[た]べなさい。あなたも、あなたの息子[むすこ]も娘[むすめ]も、男[おとこ]の奴隷[どれい]も女[おんな]の奴隷[どれい]も、あなたの町々[まちまち]にいる寄留者[きりゅうしゃ]も、あなたの手[て]が行[おこな]うすべてのことについて、あなたの神[かみ]である主[しゅ]の前[まえ]で喜[よろこ]びなさい。"
  19: "あなたは、あなたが地上[ちじょう]に生[い]きているすべての間[あいだ]、レビ人[びと]を見捨[みす]ててはならない。"
  20: "あなたの神[かみ]である主[しゅ]が、あなたに語[かた]られたとおりにあなたの国境[こっきょう]を広[ひろ]げられ、あなたが『肉[にく]を食[た]べたい』と言[い]い、心[こころ]が肉[にく]を食[た]べることを望[のぞ]むなら、心[こころ]の望[のぞ]むままに肉[にく]を食[た]べてよい。"
  21: "もし、あなたの神[かみ]である主[しゅ]が御名[みな]を置[お]くために選[えら]ばれる場所[ばしょ]があなたから遠[とお]く離[はな]れているなら、わたしがあなたに命[めい]じたとおりに、あなたの神[かみ]である主[しゅ]があなたに与[あた]えられた牛[うし]や羊[ひつじ]を屠[ほふ]り、あなたの町々[まちまち]で、心[こころ]の望[のぞ]むままにそれを食[た]べてよい。"
  22: "かもしかや鹿[しか]が食[た]べられるように、あなたはそれを食[た]べてよい。汚[けが]れた者[もの]も清[きよ]い者[もの]も同[おな]じようにそれを食[た]べる。"
  23: "ただ、血[ち]を食[た]べないように、十分[じゅうぶん]に気[き]をつけなさい。血[ち]はその命[いのち]だからである。あなたは命[いのち]を肉[にく]とともに食[た]べてはならない。"
  24: "あなたがたはそれを食[た]べてはならない。それを水[みず]のように地[ち]に注[そそ]ぎ出[だ]しなさい。"
  25: "それを食[た]べてはならない。あなたが、あなたの神[かみ]である主[しゅ]の前[まえ]で善[よ]いこと、かなうことを行[おこな]うなら、あなたとあなたの後[あと]の子[こ]らが幸[しあわ]せになるためである。"
  26: "ただ、あなたの聖[せい]なるものと、あなたの誓願[せいがん]は、携[たずさ]えて、あなたの神[かみ]である主[しゅ]が御名[みな]を置[く]ために選[えら]ばれる場所[ばしょ]へ持[も]って行[ゆ]きなさい。"
  27: "あなたは燔祭[はんさい]を献[ささ]げなさい。燔祭[はんさい]の肉[にく]をあなたの神[かみ]である主[しゅ]の祭壇[さいだん]に上[あ]げ、犠牲[ぎせい]の血[ち]はあなたの神[かみ]である主[しゅ]の祭壇[さいだん]の基[もとい]に注[そそ]ぎかけ、肉[にく]は食[た]べなさい。"
  28: "あなたは、わたしが今日[きょう]あなたに命[めい]じるすべての言葉[ことば]を守[まも]って聞[き]き、行[おこな]いなさい。あなたがあなたの神[かみ]である主[しゅ]の前[まえ]で善[よ]いこと、かなうことを行[おこな]うなら、あなたとあなたの後[あと]の子[こ]らが永遠[とこしえ]に幸[しあわ]せになるためである。"
  29: "あなたの神[かみ]である主[しゅ]が、あなたが入[はい]って行[ゆ]き、彼[かれ]らの地[ち]を嗣業[しぎょう]として受[う]け継[つ]ごうとしている民[たみ]をあなたの前[まえ]から滅[ほろ]ぼし尽[つ]くされ、あなたが彼[かれ]らを嗣業[しぎょう]として受[う]け継[つ]ぎ、その地[ち]に住[す]むようになるとき、"
  30: "あなたは自分[じぶん]に気[き]をつけなさい。彼[かれ]らがあなたの前[まえ]から滅[ほろ]ぼされた後[あと]で、彼[かれ]らの後[あと]を追[お]って、わなにかかってはならない。彼[かれ]らの神々[かみがみ]を尋[たず]ねて『この民[たみ]が自分[じぶん]たちの神々[かみがみ]にしているように、わたしも同[おな]じようにしよう』と言[い]ってはならない。"
  31: "あなたはあなたの神[かみ]である主[しゅ]に、そのようにはしてはならない。主[しゅ]が憎[にく]まれた忌[い]まわしいことを、彼[かれ]らは自分[じぶん]たちの神々[かみがみ]に行[おこな]ったからである。彼[かれ]らは自分[じぶん]たちの息子[むすこ]たちと娘[むすめ]たちを、自分[じぶん]たちの神々[かみがみ]のために火[ひ]で焼[や]き尽[つ]くした。」"

notes:
  1: "προστάγματα καὶ κρίσεις — постановления и суды. φυλάξετε τοῦ ποιεῖν — будете соблюдать, чтобы исполнять. κύριος ὁ θεὸς τῶν πατέρων ὑμῶν — Господь Бог отцов ваших. ἐν κλήρῳ — в удел. πάσας τὰς ἡμέρας, ἃς ὑμεῖς ζῆτε — во все дни, которые вы живёте."
  2: "ἀπωλείᾳ ἀπολεῖτε — «погибелью погубите» (усиление). τοὺς τόπους — места. ὀρέων τῶν ὑψηλῶν — высоких гор (здесь ὄρη — горы). θινῶν — песчаных холмов, дюн (θίς; слав. «холмех»). ὑποκάτω δένδρου δασέος — под деревом ветвистым."
  3: "κατασκάψετε — разрушите, раскопаете (κατασκάπτω). βωμούς — жертвенники. στήλας — столбы, стелы (石柱). ἄλση — рощи (圣なる木立; слав. «дубравы»). γλυπτά — изваяния, резные изображения. κατακαύσετε πυρί — сожжёте огнём. ἀπολεῖται τὸ ὄνομα — погибнет имя."
  4: "οὐ ποιήσετε οὕτως κυρίῳ — не делайте так Господу. Стих противопоставляет языческому служению служение единому месту."
  5: "εἰς τὸν τόπον, ὃν ἂν ἐκλέξηται — к месту, которое изберёт. ἐν μιᾷ τῶν φυλῶν ὑμῶν — в одном из колен ваших. ἐπονομάσαι τὸ ὄνομα αὐτοῦ — наречь имя Его (ἐπονομάζω). ἐπικληθῆναι — быть призванным. ἐκζητήσετε — взыщете."
  6: "οἴσετε — принесёте. ὁλοκαυτώματα — всесожжения. θυσιάσματα — жертвы. ἀπαρχάς — начатки. εὐχάς — обеты. ἑκούσια — добровольные. πρωτότοκα βοῶν καὶ προβάτων — первенцев крупного и мелкого скота. В слав. добавлены «исповедания», в базе их нет."
  7: "φάγεσθε ἐναντίον κυρίου — будете есть пред Господом. εὐφρανθήσεσθε — возвеселитесь. ἐπὶ πᾶσιν, οὗ ἂν τὴν χεῖρα ἐπιβάλητε — о всём, на что наложите руку. οἱ οἶκοι ὑμῶν — дома ваши. καθότι εὐλόγησέν σε — поскольку благословил тебя (переход на ед. ч.)."
  8: "οὐ ποιήσετε πάντα, ἃ ἡμεῖς ποιοῦμεν ὧδε σήμερον — не делайте всего, что мы делаем здесь сегодня. ἕκαστος τὸ ἀρεστὸν ἐνώπιον αὐτοῦ — каждый угодное в своих глазах."
  9: "οὐ γὰρ ἥκατε ἕως τοῦ νῦν — ибо вы не пришли доныне. κατάπαυσις — покой. κληρονομία — наследие."
  10: "διαβήσεσθε — перейдёте. κατακληρονομεῖ ὑμῖν — даёт вам в наследие. καταπαύσει ὑμᾶς — успокоит вас. τῶν κύκλῳ — окрестных. μετὰ ἀσφαλείας — в безопасности."
  11: "ἐπικληθῆναι τὸ ὄνομα αὐτοῦ — призвать имя Его. ἐπιδέκατα — десятины. ἀπαρχὰς τῶν χειρῶν — начатки рук. δόματα — дары. πᾶν ἐκλεκτὸν τῶν δώρων — всё избранное из даров. ὅσα ἐὰν εὔξησθε — что обещаете."
  12: "εὐφρανθήσεσθε — возвеселитесь. υἱοί, θυγατέρες, παῖδες, παιδίσκαι — сыны, дочери, рабы, рабыни. ὁ Λευίτης ὁ ἐπὶ τῶν πυλῶν — левит у ворот ваших. οὐκ ἔστιν αὐτῷ μερὶς οὐδὲ κλῆρος — нет ему части и удела."
  13: "πρόσεχε σεαυτῷ — внимай себе. μὴ ἀνενέγκῃς — не принеси. ἐν παντὶ τόπῳ, οὗ ἐὰν ἴδῃς — на всяком месте, которое увидишь."
  14: "ἐν μιᾷ τῶν φυλῶν σου — в одном из колен твоих (ед. ч.). ἐκεῖ ἀνοίσεις — там принесёшь. ποιήσεις πάντα — сделаешь всё."
  15: "ἐν πάσῃ ἐπιθυμίᾳ σου — по всякому желанию твоему. θύσεις καὶ φάγῃ κρέα — заколешь и съешь мясо. κατὰ τὴν εὐλογίαν — по благословению. ἐν πάσῃ πόλει — во всяком городе. ἀκάθαρτος… καὶ καθαρός — нечистый и чистый. ὡς δορκάδα ἢ ἔλαφον — как серну или оленя (т. е. как дичь, без священного заклания)."
  16: "πλὴν τὸ αἷμα οὐ φάγεσθε — только крови не ешьте. ἐπὶ τὴν γῆν ἐκχεεῖτε — на землю выльете."
  17: "οὐ δυνήσῃ φαγεῖν — не сможешь есть. ἐπιδέκατον — десятина. πρωτότοκα — первенцы. εὐχάς — обеты. ὁμολογίας — исповедания, обещания. ἀπαρχὰς τῶν χειρῶν — начатки рук."
  18: "ἐναντίον κυρίου… ἐν τῷ τόπῳ, ᾧ ἂν ἐκλέξηται — пред Господом… на месте, которое изберёт. ὁ προσήλυτος ὁ ἐν ταῖς πόλεσιν ὑμῶν — пришелец в городах ваших (в базе нет «левита», слав. добавляет). ἐπὶ πάντα, οὗ ἂν ἐπιβάλῃς τὴν χεῖρα — о всём, на что наложишь руку."
  19: "μὴ ἐγκαταλίπῃς τὸν Λευίτην — не оставь левита (ἐγκαταλείπω). πάντα τὸν χρόνον, ὅσον ἐὰν ζῇς — всё время, пока живёшь."
  20: "ἐμπλατύνῃ τὰ ὅριά σου — расширит пределы твои. ἐρεῖς Φάγομαι κρέα — скажешь: «поем мяса» (слова в 『…』). ἐν πάσῃ ἐπιθυμίᾳ τῆς ψυχῆς — по всякому желанию души."
  21: "μακρότερον ἀπέχῃ — будет дальше. ἐπικληθῆναι τὸ ὄνομα — призвать имя. θύσεις ἀπὸ τῶν βοῶν… προβάτων — заколешь из крупного и мелкого скота. ὃν τρόπον ἐνετειλάμην — как я повелел."
  22: "ὡς ἔσθεται ἡ δορκὰς καὶ ἡ ἔλαφος — как естся серна и олень. ὡσαύτως ἔδεται — так же ест."
  23: "πρόσεχε ἰσχυρῶς — строго наблюдай. τὸ αἷμα αὐτοῦ ψυχή — кровь его есть душа. οὐ βρωθήσεται ἡ ψυχή — да не съестся душа. μετὰ τῶν κρεῶν — с мясом."
  24: "οὐ φάγεσθε — не ешьте (мн. ч.). ἐκχεεῖτε ὡς ὕδωρ — выливайте, как воду."
  25: "ἵνα εὖ σοι γένηται — чтобы хорошо было тебе. τοῖς υἱοῖς σου μετὰ σέ — сынам твоим после тебя. τὸ καλὸν καὶ τὸ ἀρεστόν — доброе и угодное."
  26: "τὰ ἅγιά σου… καὶ τὰς εὐχάς — святыни твои и обеты. ἐὰν γένηταί σοι — если будут у тебя. λαβὼν ἥξεις — взяв, придёшь."
  27: "ποιήσεις τὰ ὁλοκαυτώματά σου — совершишь всесожжения твои. τὰ κρέα ἀνοίσεις — мясо вознесёшь. πρὸς τὴν βάσιν — к основанию. τὰ δὲ κρέα φάγῃ — мясо же съешь."
  28: "φυλάσσου καὶ ἄκουε — храни и слушай. πάντας τοὺς λόγους — все слова. δι᾽ αἰῶνος — в век, навсегда."
  29: "ἐξολεθρεύσῃ — истребит. εἰς οὓς σὺ εἰσπορεύῃ — к которым ты входишь. κατακληρονομήσῃς — наследуешь. κατοικήσῃς ἐν τῇ γῇ αὐτῶν — поселишься в земле их."
  30: "μὴ ἐκζητήσῃς ἐπακολουθῆσαι — не постарайся последовать. μετὰ τὸ ἐξολεθρευθῆναι — после истребления. οὐ μὴ ἐκζητήσῃς τοὺς θεοὺς αὐτῶν — не ищи богов их. Πῶς ποιοῦσιν… ποιήσω κἀγώ — «как делают… так сделаю и я» (слова в 『…』)."
  31: "τὰ βδελύγματα — мерзости. ἃ κύριος ἐμίσησεν — которые Господь возненавидел. ἐποίησαν τοῖς θεοῖς αὐτῶν — сделали богам своим. κατακαίουσιν ἐν πυρί — сожигают огнём. υἱοὺς καὶ θυγατέρας — сыновей и дочерей."
