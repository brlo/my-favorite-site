# База: Септуагинта (gr-lxx-byz); контроль — csl-ru; ru — только для понимания.
# jp-joc в этой главе отсутствует.
# Глава 12: истребление мест языческого служения (1–4), единое место поклонения
# (5–14), употребление мяса и кровь (15–25), святыни и обеты (26–28),
# предостережение от подражания народам (29–31).
# Речь Моисея — 「…」 (1–31). Внутри неё собственная речь человека (20) и слова
# народов (30) — 『…』.
# 〔…〕 нет: все стихи есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 燔祭, 誓願, 初穂, 嗣業, 寄留者 уже в корпусе или понятны.
# Нумерация: в gr 31 стих; слав. 12:32 («Всяко слово, еже аз заповедаю…») —
# это уже gr 13:1, в главу не включён. 12:18 в базе без «левита» (слав. добавляет),
# 12:6 без «исповеданий» (слав. добавляет). 12:2 θινῶν — «песчаные холмы»
# (слав. «холмех»); 12:3 ἄλση — рощи (聖なる木立).
# Речь Моисея в файле открыта 「 в начале главы и закрыта 」 в конце: она продолжается
