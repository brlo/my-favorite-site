verses:
  1: "だから、わたしたちも、これほど多[おお]くの証人[しょうにん]たちが雲[くも]のように取[と]り囲[かこ]んでいるのだから、すべての重[おも]荷[に]と、わたしたちにまとわりつく罪[つみ]とを捨[す]て去[さ]り、忍耐[にんたい]をもって、わたしたちの前[まえ]に置[お]かれた競走[きょうそう]を、信仰[しんこう]の創始者[そうししゃ]であり完成者[かんせいしゃ]であるイエスに目[め]を注[そそ]ぎながら走[はし]ろう。"
  2: "この方[かた]は、ご自身[じしん]に定[さだ]められた喜[よろこ]びのために、辱[はずかし]めを顧[かえり]みず、十字架[じゅうじか]を耐[たえ]忍[しの]び、神[かみ]の御座[みくら]の右[みぎ]に座[すわ]られたのである。"
  3: "あなたがたは、罪人[ざいにん]たちからこれほどひどい逆[ぎゃく]らいを受[う]けられた方[かた]を思[おも]い、心[こころ]が疲[つか]れ果[は]てて、気[き]力[りょく]を失[うしな]うことがないようにしなさい。"
  4: "あなたがたは、罪[つみ]と戦[たたか]って、まだ血[ち]を流[なが]すほどには抵抗[ていこう]していない。"
  5: "また、子[こ]としてあなたがたに語[かた]りかけられる勧[すす]めを、忘[わす]れてしまった。「わたしの子[こ]よ、主[しゅ]の懲[こら]しめを軽[かろ]んじるな。主[しゅ]に責[せ]められるとき、気[き]を落[おと]すな。"
  6: "主[しゅ]は愛[あい]する者[もの]を懲[こら]しめ、受[う]け入[い]れるすべての子[こ]を鞭[むち]打[う]つ。」"
  7: "あなたがたは、懲[こら]しめのために耐[たえ]忍[しの]んでいるのである。神[かみ]は、あなたがたを子[こ]として扱[あつか]っておられる。父[ちち]が懲[こら]しめない子[こ]が、どこにあろうか。"
  8: "もしあなたがたが、すべての者[もの]が受[う]ける懲[こら]しめを受けていないなら、あなたがたは子[こ]ではなく、私生児[しせいじ]である。"
  9: "さらに、わたしたちには、わたしたちを懲[こら]しめる者[もの]として肉[にく]の父[ちち]がいた。わたしたちはその人[ひと]を敬[うやま]ってきた。まして、霊[れい]の父[ちち]には、いっそう従[したが]って生[い]きるべきではないか。"
  10: "肉[にく]の父[ちち]は、自分[じぶん]の思[おも]いのままに、わずかな日[ひ]の間[あいだ]懲[こら]しめた。しかし、霊[れい]の父[ちち]は、わたしたちがその聖[きよ]さにあずかるために、わたしたちの益[えき]のために懲[こら]しめられるのである。"
  11: "すべての懲[こら]しめは、そのときは喜[よろこ]びではなく悲[かな]しみに思[おも]われるが、後[のち]には、それによって訓練[くんれん]された者[もの]たちに、平和[へいわ]の実[み]、すなわち義[ぎ]の実[み]を結[むす]ばせるのである。"
  12: "だから、衰[おとろ]えた手[て]と弱[よわ]った膝[ひざ]を起[お]こし、"
  13: "あなたがたの足[あし]のためにまっすぐな道[みち]を造[つく]りなさい。足[あし]の不自由[ふじゆう]な者[もの]が迷[まよ]い出[で]て滅[ほろ]びるのではなく、むしろ癒[いや]されるためである。"
  14: "すべての人[ひと]と平和[へいわ]を追[お]い求[もと]め、また、なしにはだれも主[しゅ]を見[み]ることができない聖[きよ]めを、追[お]い求[もと]めなさい。"
  15: "あなたがたは、神[かみ]の恵[めぐ]みに遅[おく]れを取[と]る者[もの]がだれも出[で]ないように、また、苦[にが]い根[ね]が芽[め]を出[だ]して害[がい]を及[およ]ぼし、それによって多[おお]くの者[もの]が汚[けが]されることのないように、気[き]をつけなさい。"
  16: "また、淫[いん]らな者[もの]、あるいはエサウのように聖[せい]なるものを軽[かろ]んじる者[もの]が、だれも出[で]ないようにしなさい。彼[かれ]は、一[ひと]度[ど]の食[しょく]事[じ]のために、長子[ちょうし]の権[けん]を売[う]り渡[わた]したのである。"
  17: "あなたがたが知[し]っているように、その後[あと]、彼[かれ]は祝福[しゅくふく]を相続[そうぞく]しようとしても退[しりぞ]けられ、涙[なみだ]を流[なが]して求[もと]めたにもかかわらず、悔[く]い改[あらた]めの余地[よち]を見[み]いだせなかったのである。"
  18: "あなたがたが近[ちか]づいたのは、手[て]で触[さわ]れる山[やま]、燃[も]えさかる火[ひ]、暗[くら]い雲[くも]、暗[くら]やみ、暴風[ぼうふう]、"
  19: "ラッパの音[ね]や、言葉[ことば]の響[ひび]きではなかった。その声[こえ]を聞[き]いた者[もの]たちは、これ以上[いじょう]語[かた]りかけられないようにと願[ねが]ったのである。"
  20: "彼[かれ]らは、「たとえ獣[けもの]でも山[やま]に触[ふ]れるなら、石[いし]で打[う]ち殺[ころ]され、〔あるいは矢[や]で射[い]られよ〕」という命令[めいれい]に耐[た]えられなかったのである。"
  21: "そして、その現[あらわ]れはあまりに恐[おそ]ろしかったので、モーセは「わたしは恐[おそ]れ、震[ふる]えている」と言[い]った。"
  22: "しかし、あなたがたが近[ちか]づいたのは、シオンの山[やま]、生[い]ける神[かみ]の都[みやこ]、天[てん]のエルサレム、無数[むすう]の天使[てんし]たちの集[つど]い、"
  23: "天[てん]に記[しる]されている長子[ちょうし]たちの集[あつ]まりである教会[きょうかい]、すべての者[もの]を裁[さば]く神[かみ]、完全[かんぜん]にされた義人[ぎじん]たちの霊[れい]、"
  24: "新[あたら]しい契約[けいやく]の仲介者[ちゅうかいしゃ]であるイエス、また、アベルの血[ち]よりも優[すぐ]れたことを語[かた]る、振[ふ]りかける血[ち]である。"
  25: "語[かた]っておられる方[かた]を拒[こば]まないように気[き]をつけなさい。もし、地上[ちじょう]で告[つ]げた方[かた]を拒[こば]んだ者[もの]たちが逃[のが]れられなかったのなら、まして、天[てん]から告[つ]げておられる方[かた]から背[そむ]くわたしたちは、なおさらである。"
  26: "そのとき、その声[こえ]は地[ち]を揺[ゆ]り動[うご]かした。しかし今[いま]は、「もう一度[いちど]、わたしは天[てん]だけでなく地[ち]をも揺[ゆ]り動[うご]かす」と約束[やくそく]しておられる。"
  27: "この「もう一度[いちど]」という言葉[ことば]は、作[つく]られたもの、すなわち揺[ゆ]り動[うご]かされるものが移[うつ]し去[さ]られ、揺[ゆ]り動[うご]かされないものが残[のこ]ることを示[しめ]している。"
  28: "だから、わたしたちは、揺[ゆ]り動[うご]かされない国[くに]を受[う]けているのだから、感謝[かんしゃ]の心[こころ]を持[も]ち、それによって、敬虔[けいけん]と畏[おそ]れとをもって、神[かみ]に喜[よろこ]ばれるように仕[つか]えよう。"
  29: "わたしたちの神[かみ]は、焼[や]き尽[つ]くす火[ひ]だからである。"

notes:
  1: "Τοιγαροῦν καὶ ἡμεῖς — だから、わたしたちも. τοσοῦτον ἔχοντες περικείμενον ἡμῖν νέφος μαρτύρων — これほど多くの証人たちが雲のように取り囲んでいる; νέφος μαρτύρων — 雲[くも]のような証人[しょうにん]たち (образ облака свидетелей сохранён). ὄγκον ἀποθέμενοι πάντα — すべての重荷を捨て去り; ὄγκος — «груз, тяжесть». τὴν εὐπερίστατον ἁμαρτίαν — わたしたちにまとわりつく罪; εὐπερίστατος — «легко облегающий, опутывающий». δι᾽ ὑπομονῆς τρέχωμεν τὸν προκείμενον ἡμῖν ἀγῶνα — 忍耐をもって、前に置かれた競走を走ろう; ἀγών — 競走[きょうそう] (состязание). Причастие ἀφορῶντες (12:2) отнесено к глаголу 12:1, чтобы не рвать период на границе стиха (ср. 1 Сол 1:2–3)."
  2: "ἀφορῶντες εἰς τὸν τῆς πίστεως ἀρχηγὸν καὶ τελειωτὴν Ἰησοῦν — 信仰の創始者であり完成者であるイエスに目を注ぎながら; ἀρχηγός — «вождь, начальник» (ср. 2:10), τελειωτής — «совершитель». ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς — ご自身に定められた喜びのために; ἀντί — «вместо, за цену». ὑπέμεινεν σταυρὸν αἰσχύνης καταφρονήσας — 辱めを顧みず、十字架を耐え忍び. ἐν δεξιᾷ τε τοῦ θρόνου τοῦ θεοῦ κεκάθικεν — 神の御座の右に座られた; θρόνος → 御座[みくら] (термин книги, ср. 4:16; 8:1)."
  3: "ἀναλογίσασθε γὰρ — 思い…なさい; ἀναλογίζομαι — «размышлять, соображать». τὸν τοιαύτην ὑπομεμενηκότα … ἀντιλογίαν — これほどひどい逆らいを受けられた方; ἀντιλογία — «противоречие, противление» (ср. 6:16). ἵνα μὴ κάμητε ταῖς ψυχαῖς ὑμῶν ἐκλυόμενοι — 心が疲れ果てて、気力を失うことがないように; ἐκλύω — «расслабляться, изнемогать»."
  4: "Οὔπω μέχρις αἵματος ἀντικατέστητε — まだ血を流すほどには抵抗していない; ἀντικαθίστημι — «противостоять». πρὸς τὴν ἁμαρτίαν ἀνταγωνιζόμενοι — 罪と戦って; ἀνταγωνίζομαι — «соперничать в борьбе»."
  5: "καὶ ἐκλέλησθε τῆς παρακλήσεως — また…勧めを忘れてしまった; ἐκλανθάνομαι — perfect, «вы совсем забыли». ἥτις ὑμῖν ὡς υἱοῖς διαλέγεται — 子としてあなたがたに語りかけられる; διαλέγομαι — «беседовать, обращаться». Притч 3:11–12; цитата в 「…」 до конца 6 ст. Υἱέ μου — わたしの子よ. μὴ ὀλιγώρει παιδείας κυρίου — 主の懲らしめを軽んじるな; ὀλιγωρέω — «пренебрегать», παιδεία — 懲[こら]しめ (термин главы). μηδὲ ἐκλύου ὑπ᾽ αὐτοῦ ἐλεγχόμενος — 主に責められるとき、気を落とすな; ἐλέγχω — «обличать»."
  6: "ὃν γὰρ ἀγαπᾷ κύριος παιδεύει — 主は愛する者を懲らしめ. μαστιγοῖ δὲ πάντα υἱὸν ὃν παραδέχεται — 受け入れるすべての子を鞭打つ; μαστιγόω — «бичевать», παραδέχομαι — «принимать»."
  7: "εἰς παιδείαν ὑπομένετε — 懲らしめのために耐え忍んでいる; εἰς — «для, ради». ὡς υἱοῖς ὑμῖν προσφέρεται ὁ θεός — 神は、あなたがたを子として扱っておられる; προσφέρομαι — «обходиться с кем-л.». τίς γὰρ υἱὸς ὃν οὐ παιδεύει πατήρ — 父が懲らしめない子が、どこにあろうか."
  8: "εἰ δὲ χωρίς ἐστε παιδείας ἧς μέτοχοι γεγόνασιν πάντες — もし、すべての者が受ける懲らしめを受けていないなら; μέτοχος — «причастник» (ср. 3:1,14). ἄρα νόθοι καὶ οὐχ υἱοί ἐστε — 子ではなく、私生児である; νόθος — «незаконнорождённый», передано 私生児[しせいじ]."
  9: "εἶτα τοὺς μὲν τῆς σαρκὸς ἡμῶν πατέρας εἴχομεν παιδευτάς — わたしたちには、わたしたちを懲らしめる者として肉の父がいた; παιδευτής — «наставник, наказывающий». ἐνετρεπόμεθα — 敬ってきた; ἐντρέπομαι — «стыдиться, благоговеть». οὐ πολὺ [δὲ] μᾶλλον ὑποταγησόμεθα τῷ πατρὶ τῶν πνευμάτων — まして、霊の父には、いっそう従うべきではないか; [δὲ] в базе есть, 〔…〕 не ставятся; πατὴρ τῶν πνευμάτων — 霊[れい]の父 (πνεῦμα без ἅγιον, поэтому 霊, без пары)."
  10: "οἱ μὲν γὰρ πρὸς ὀλίγας ἡμέρας … ἐπαίδευον — わずかな日の間、懲らしめた. κατὰ τὸ δοκοῦν αὐτοῖς — 自分の思いのままに; τὸ δοκοῦν — «что казалось им». ὁ δὲ ἐπὶ τὸ συμφέρον — しかし…わたしたちの益のために; ἐπὶ τὸ συμφέρον — «к пользе». εἰς τὸ μεταλαβεῖν τῆς ἁγιότητος αὐτοῦ — その聖さにあずかるために; ἁγιότης — 聖[きよ]さ (ср. 12:14 ἁγιασμός)."
  11: "πᾶσα δὲ παιδεία πρὸς μὲν τὸ παρὸν οὐ δοκεῖ χαρᾶς εἶναι ἀλλὰ λύπης — すべての懲らしめは、そのときは喜びではなく悲しみに思われる. ὕστερον δὲ καρπὸν εἰρηνικὸν … ἀποδίδωσιν δικαιοσύνης — 後には、平和の実、すなわち義の実を結ばせる; порядок греч. (εἰρηνικός … δικαιοσύνης) передан как 平和の実、すなわち義の実. τοῖς δι᾽ αὐτῆς γεγυμνασμένοις — それによって訓練された者たち; γυμνάζω — «упражнять» (ср. 5:14)."
  12: "Διὸ τὰς παρειμένας χεῖρας καὶ τὰ παραλελυμένα γόνατα ἀνορθώσατε — 衰えた手と弱った膝を起こし; παρειμένος — «опущенные, ослабевшие», παραλελυμένος — «расслабленные»; образ Ис 35:3, но без вводной формулы, поэтому 「…」 не ставятся."
  13: "καὶ τροχιὰς ὀρθὰς ποιεῖτε τοῖς ποσὶν ὑμῶν — あなたがたの足のためにまっすぐな道を造りなさい; τροχιά — «колея, путь» (Притч 4:26). ἵνα μὴ τὸ χωλὸν ἐκτραπῇ — 足の不自由な者が迷い出て…ないように; χωλός — «хромой», ἐκτρέπομαι — «сбиваться, совращаться» (ср. 1 Тим 1:6). ἰαθῇ δὲ μᾶλλον — むしろ癒されるために."
  14: "Εἰρήνην διώκετε μετὰ πάντων — すべての人と平和を追い求め; διώκω — «гнаться, стремиться». καὶ τὸν ἁγιασμόν — また、聖めを; ἁγιασμός — 聖[きよ]め (термин книги, ср. 12:10). οὗ χωρὶς οὐδεὶς ὄψεται τὸν κύριον — なしにはだれも主を見ることができない."
  15: "ἐπισκοποῦντες — 気をつけなさい; ἐπισκοπέω — «надзирать, смотреть, чтобы». μή τις ὑστερῶν ἀπὸ τῆς χάριτος τοῦ θεοῦ — 神の恵みに遅れを取る者がだれも出ないように; ὑστερέω ἀπό — «лишаться, отставать от». μή τις ῥίζα πικρίας ἄνω φύουσα ἐνοχλῇ — 苦い根が芽を出して害を及ぼし; отсылка к Втор 29:18 (LXX ῥίζα ἄνω φύουσα ἐν χολῇ καὶ πικρίᾳ), без вводной формулы — 「…」 не ставятся. δι᾽ αὐτῆς μιανθῶσιν πολλοί — それによって多くの者が汚される; μιαίνω — «осквернять»."
  16: "μή τις πόρνος ἢ βέβηλος ὡς Ἠσαῦ — 淫らな者、あるいはエサウのように聖なるものを軽んじる者がだれも…; βέβηλος — «нечестивый, попирающий святыню» (ср. 1 Тим 1:9). ἀντὶ βρώσεως μιᾶς ἀπέδοτο τὰ πρωτοτόκια αὐτοῦ — 一度の食事のために、長子の権を売り渡した (Быт 25:29–34); πρωτότοκια — 長子[ちょうし]の権[けん]."
  17: "ἴστε γὰρ ὅτι καὶ μετέπειτα — あなたがたが知っているように、その後. θέλων κληρονομῆσαι τὴν εὐλογίαν ἀπεδοκιμάσθη — 祝福を相続しようとしても退けられ; ἀποδοκιμάζω — «отвергать» (ср. 4:7). μετανοίας γὰρ τόπον οὐχ εὗρεν — 悔い改めの余地を見いだせなかった; μετανοία здесь может значить и «перемену решения» (отца), и «раскаяние» (Исава) — двусмысленность не разрешена (jp-joc поясняет: 父の志を囘す能はざりき). καίπερ μετὰ δακρύων ἐκζητήσας αὐτήν — 涙を流して求めたにもかかわらず."
  18: "Οὐ γὰρ προσεληλύθατε — あなたがたが近づいたのは…ではない; отрицание относится ко всему перечню 18–21, сказуемое — 12:19 ではなかった. ψηλαφωμένῳ [ὄρει] — 手で触れる山; [ὄρει] в базе есть. κεκαυμένῳ πυρί — 燃えさかる火. γνόφῳ καὶ ζόφῳ — 暗い雲と暗やみ (два разных слова: γνόφος — мрак облака, ζόφος — gloom). θυέλλῃ — 暴風."
  19: "σάλπιγγος ἤχῳ — ラッパの音; σάλπιγξ — ラッパ (Исх 19:16,19). φωνῇ ῥημάτων — 言葉の響き. ἧς οἱ ἀκούσαντες παρῃτήσαντο μὴ προστεθῆναι αὐτοῖς λόγον — その声を聞いた者たちは、これ以上語りかけられないようにと願った; παραιτέομαι — «просить, отказываться» (ср. 12:25)."
  20: "οὐκ ἔφερον γὰρ τὸ διαστελλόμενον — 彼らは…命令に耐えられなかった; διαστέλλομαι — «повелевать, предписывать». Исх 19:12–13; в 「…」 только сама заповедь. Κἂν θηρίον θίγῃ τοῦ ὄρους, λιθοβοληθήσεται — たとえ獣でも山に触れるなら、石で打ち殺され. В базе нет ἢ βολίδι κατατοξευθήσεται, церковный текст (Елизаветинская «или стрелою устрелен будет», jp-joc「或は矢を以て射るべし」) читает с ним — 〔あるいは矢で射られよ〕."
  21: "καί, οὕτω φοβερὸν ἦν τὸ φανταζόμενον — そして、その現れはあまりに恐ろしかったので; φανταζόμενον — «являвшееся, зрелище». Μωϋσῆς εἶπεν — モーセは…と言った. Ἔκφοβός εἰμι καὶ ἔντρομος — わたしは恐れ、震えている; слова Моисея из Втор 9:19, поэтому 「…」."
  22: "ἀλλὰ προσεληλύθατε — しかし、あなたがたが近づいたのは…; положительная часть периода 22–24. Σιὼν ὄρει — シオンの山. πόλει θεοῦ ζῶντος — 生ける神の都. Ἰερουσαλὴμ ἐπουρανίῳ — 天のエルサレム. μυριάσιν ἀγγέλων, πανηγύρει — 無数の天使たちの集い; πανήγυρις — «праздничное собрание» (слово продолжается в 23)."
  23: "ἐκκλησίᾳ πρωτοτόκων ἀπογεγραμμένων ἐν οὐρανοῖς — 天に記されている長子たちの集まりである教会; ἀπογράφω — «вписывать в список». κριτῇ θεῷ πάντων — すべての者を裁く神. πνεύμασι δικαίων τετελειωμένων — 完全にされた義人たちの霊; πνεῦμα без ἅγιον — 霊[れい]; τελειόω — ср. 11:40."
  24: "διαθήκης νέας μεσίτῃ Ἰησοῦ — 新しい契約の仲介者であるイエス; в базе νέας (не καινῆς), поэтому 新[あたら]しい (ср. 9:15 καινῆς — тоже 新しい). αἵματι ῥαντισμοῦ — 振りかける血; ῥαντισμός — «кропление» (ср. 9:13 ῥαντίζουσα). κρεῖττον λαλοῦντι παρὰ τὸν Ἅβελ — アベルの血よりも優れたことを語る (Быт 4:10)."
  25: "Βλέπετε μὴ παραιτήσησθε τὸν λαλοῦντα — 語っておられる方を拒まないように気をつけなさい; παραιτέομαι — ср. 12:19. εἰ γὰρ ἐκεῖνοι οὐκ ἐξέφυγον ἐπὶ γῆς παραιτησάμενοι τὸν χρηματίζοντα — もし、地上で告げた方を拒んだ者たちが逃れられなかったのなら; χρηματίζω — «возвещать, давать откровение» (ср. 11:7). πολὺ μᾶλλον ἡμεῖς οἱ τὸν ἀπ᾽ οὐρανῶν ἀποστρεφόμενοι — まして、天から告げておられる方から背くわたしたちは、なおさらである; ἀποστρέφομαι — «отвращаться»."
  26: "οὗ ἡ φωνὴ τὴν γῆν ἐσάλευσεν τότε — そのとき、その声は地を揺り動かした (Исх 19:18). νῦν δὲ ἐπήγγελται λέγων — しかし今は…と約束しておられる. Агг 2:6: Ἔτι ἅπαξ ἐγὼ σείσω οὐ μόνον τὴν γῆν ἀλλὰ καὶ τὸν οὐρανόν — もう一度、わたしは天だけでなく地をも揺り動かす; цитата в 「…」."
  27: "τὸ δέ, Ἔτι ἅπαξ — この「もう一度」という言葉は; слова цитаты взяты в 「」 как цитируемое выражение. δηλοῖ τὴν τῶν σαλευομένων μετάθεσιν — 揺り動かされるものが移し去られることを示している; μετάθεσις — «перемещение, устранение» (ср. 11:5 μετετέθη). ὡς πεποιημένων — 作られたものとして; ἵνα μείνῃ τὰ μὴ σαλευόμενα — 揺り動かされないものが残るために."
  28: "Διὸ βασιλείαν ἀσάλευτον παραλαμβάνοντες — 揺り動かされない国を受けているのだから; ἀσάλευτος — «непоколебимый» (ср. 12:27). ἔχωμεν χάριν — 感謝の心を持ち; χάρις здесь — «благодарение» (не «благодать», ср. 13:9). δι᾽ ἧς λατρεύωμεν εὐαρέστως τῷ θεῷ — それによって、神に喜ばれるように仕えよう. μετὰ εὐλαβείας καὶ δέους — 敬虔と畏れとをもって; εὐλάβεια — ср. 11:7, δέος — «страх благоговейный»."
  29: "καὶ γὰρ ὁ θεὸς ἡμῶν πῦρ καταναλίσκον — わたしたちの神は、焼き尽くす火だからである (Втор 4:24; 9:3); καταναλίσκω — «поедать, истреблять»."
