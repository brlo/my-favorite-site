verses:
  1: "アレルヤ。主[しゅ]に新[あたら]しい歌[うた]を歌[うた]え。その賛美[さんび]は聖[せい]なる者[もの]たちの集[つど]いにある。"
  2: "イスラエルは自分[じぶん]を造[つく]った方[かた]によって喜[よろこ]び、シオンの子[こ]らは自分[じぶん]たちの王[おう]によって喜[よろこ]べ。"
  3: "彼[かれ]らが踊[おど]りをもって主[しゅ]の名[な]をほめたたえ、太鼓[たいこ]と竪琴[たてごと]で主[しゅ]に歌[うた]うように。"
  4: "主[しゅ]はご自分[じぶん]の民[たみ]を喜[よろこ]び、救[すく]いをもって柔和[にゅうわ]な者[もの]たちを高[たか]く上[あ]げられる。"
  5: "聖[せい]なる者[もの]たちは栄光[えいこう]のうちに喜[よろこ]び、その床[とこ]の上[うえ]で喜[よろこ]び歌[うた]う。"
  6: "彼[かれ]らののどには神[かみ]への高[たか]い賛美[さんび]があり、その手[て]には両刃[もろは]の剣[つるぎ]がある。"
  7: "それは、諸[しょ]国[こく]の民[たみ]に復讐[ふくしゅう]し、もろもろの民[たみ]を戒[いまし]めるためである。"
  8: "彼[かれ]らの王[おう]たちを鎖[くさり]で縛[しば]り、彼[かれ]らの貴[とうと]い者[もの]たちを鉄[てつ]の手枷[てかせ]で縛[しば]るためである。"
  9: "彼[かれ]らに記[しる]された裁[さば]きを行[おこな]うためである。この栄光[えいこう]は、主[しゅ]のすべての聖[せい]なる者[もの]たちにある。"

notes:
  1: "Αλληλουια — アレルヤ. Надписание — стих 0 (в csl-ru отдельного стиха нет, влито в ст. 1). Ἄισατε τῷ κυρίῳ ᾆσμα καινόν — 主に新しい歌を歌え (ᾆσμα — «песнь»). ἡ αἴνεσις αὐτοῦ ἐν ἐκκλησίᾳ ὁσίων — その賛美は聖なる者たちの集いにある (ἐκκλησία — «собрание»; ὅσιος — «святой, преподобный»)."
  2: "εὐφρανθήτω Ισραηλ ἐπὶ τῷ ποιήσαντι αὐτόν — イスラエルは自分を造った方によって喜び (εὐφραίνομαι — «веселиться»). υἱοὶ Σιων ἀγαλλιάσθωσαν ἐπὶ τῷ βασιλεῖ αὐτῶν — シオンの子らは自分たちの王によって喜べ (ἀγαλλιάομαι — «ликовать»)."
  3: "αἰνεσάτωσαν τὸ ὄνομα αὐτοῦ ἐν χορῷ — 踊りをもって主の名をほめたたえ (χορός — «хоровод, пляска»). ἐν τυμπάνῳ καὶ ψαλτηρίῳ ψαλάτωσαν αὐτῷ — 太鼓と竪琴で主に歌うように (τύμπανον — 太鼓; ψαλτήριον — 竪琴)."
  4: "ὅτι εὐδοκεῖ κύριος ἐν λαῷ αὐτοῦ — 主はご自分の民を喜び (εὐδοκέω — «благоволить»). ὑψώσει πραεῖς ἐν σωτηρίᾳ — 救いをもって柔和な者たちを高く上げられる (πραΰς — «кроткий»; ὑψόω — «возвышать»)."
  5: "καυχήσονται ὅσιοι ἐν δόξῃ — 聖なる者たちは栄光のうちに喜び (καυχάομαι — «хвалиться, ликовать»; δόξα — 栄光). ἀγαλλιάσονται ἐπὶ τῶν κοιτῶν αὐτῶν — その床の上で喜び歌う (κοίτη — «ложе»)."
  6: "αἱ ὑψώσεις τοῦ θεοῦ ἐν τῷ λάρυγγι αὐτῶν — 彼らののどには神への高い賛美があり (ὕψωσις — «возвышение, величание»; λάρυγξ — «гортань»). ῥομφαῖαι δίστομοι ἐν ταῖς χερσὶν αὐτῶν — その手には両刃の剣がある (ῥομφαία — «меч»; δίστομος — «двуоострый»)."
  7: "τοῦ ποιῆσαι ἐκδίκησιν ἐν τοῖς ἔθνεσιν — 諸国の民に復讐し (ἐκδίκησις — «мщение»). ἐλεγμοὺς ἐν τοῖς λαοῖς — もろもろの民を戒める (ἐλεγμός — «обличение»)."
  8: "τοῦ δῆσαι τοὺς βασιλεῖς αὐτῶν ἐν πέδαις — 彼らの王たちを鎖で縛り (δέω — «связывать»; πέδη — «окова, кандалы»). τοὺς ἐνδόξους αὐτῶν ἐν χειροπέδαις σιδηραῖς — 彼らの貴い者たちを鉄の手枷で (ἔνδοξος — «славный, знатный»; χειροπέδη — «ручные оковы»)."
  9: "τοῦ ποιῆσαι ἐν αὐτοῖς κρίμα ἔγγραπτον — 彼らに記された裁きを行う (ἔγγραπτος — «написанный, предписанный»). δόξα αὕτη ἐστὶν πᾶσι τοῖς ὁσίοις αὐτοῦ — この栄光は、主のすべての聖なる者たちにある."
