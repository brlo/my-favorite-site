verses:
  1: "「あなたがたが地[ち]を嗣業[しぎょう]として分[わ]けるとき、主[しゅ]への初穂[はつほ]として、地[ち]から聖[せい]なるものを取[と]り分[わ]けよ。長[なが]さ二万五千[にまんごせん]キュビト、幅[はば]二万[にまん]キュビトである。そのすべての境界[きょうかい]の周[まわ]りで、それは聖[せい]となる。"
  2: "そのうちから、聖[せい]なる所[ところ]として五百[ごひゃく]キュビト四方[しほう]の四角[しかく]を取り、その周[まわ]りに五十[ごじゅう]キュビトの空地[くうち]を置[お]く。"
  3: "この測量[そくりょう]から、長[なが]さ二万五千[にまんごせん]キュビト、幅[はば]一万[いちまん]キュビトを測[はか]れ。その中[なか]に聖所[せいしょ]、すなわち至聖所[しせいしょ]がある。"
  4: "これは地[ち]から聖別[せいべつ]され、聖[せい]なる所[ところ]で仕[つか]える祭司[さいし]たち、主[しゅ]に仕えるために近[ちか]づく者[もの]たちのものとなる。それは彼らの聖別[せいべつ]のために取[と]り分[わ]けられた家[いえ]々のための場所[ばしょ]となる。"
  5: "長[なが]さ二万五千[にまんごせん]キュビト、幅[はば]一万[いちまん]キュビトは、神殿[しんでん]に仕[つか]えるレビ人[びと]のものとなり、彼らの所有[しょゆう]として、住[す]むための町[まち]々となる。"
  6: "あなたは都[みやこ]の所有[しょゆう]として、幅[はば]五千[ごせん]、長[なが]さ二万五千[にまんごせん]キュビトを与[あた]えよ。聖[せい]なる初穂[はつほ]のように、それはイスラエルの全家[ぜんか]のものとなる。"
  7: "君[きみ]には、この側[がわ]からもあの側[がわ]からも、聖[せい]なる初穂[はつほ]と都[みやこ]の所有[しょゆう]に接[せっ]して、地[ち]を与[あた]えよ。すなわち、聖なる初穂の正面[しょうめん]と都の所有の正面にあたる、海[うみ]の方[ほう]のもの、また海の方から東[ひがし]へ向[む]かうものである。その長[なが]さは、海の方の境界[きょうかい]から地[ち]の東[ひがし]の境界まで、一[ひと]つの分[わ]け前[まえ]のようである。"
  8: "これがイスラエルにおける彼の所有[しょゆう]となる。イスラエルの君[きみ]たちは、もはやわたしの民[たみ]を虐[しいた]げてはならない。イスラエルの家[いえ]は、その部族[ぶぞく]に従[したが]って地[ち]を嗣業[しぎょう]として受[う]け継[つ]ぐ。"
  9: "主[しゅ]なる神[かみ]はこう言[い]われる。イスラエルの君[きみ]たちよ、もう十分[じゅうぶん]である。不正[ふせい]と虐[しいた]げを取[と]り除[のぞ]き、裁[さば]きと正[ただ]しさを行[おこな]え。わたしの民[たみ]から圧政[あっせい]を取[と]り去[さ]れ、と主[しゅ]なる神[かみ]は言[い]われる。"
  10: "正[ただ]しい秤[はかり]と、正しい量[りょう]りと、正しいヒニクスをあなたがたは持[も]て。"
  11: "その量[りょう]りとヒニクスは、受[う]け取[と]るために一[ひと]つでなければならない。ヒニクスはホメルの十分[じゅうぶん]の一[いち]、エファもホメルの十分の一であり、ホメルに対[たい]して等[ひと]しくなる。"
  12: "重[おも]さは一[いっ]シケルにつき二十[にじゅう]オボルである。二十五[にじゅうご]シケル、二十シケル、十五[じゅうご]シケルが、あなたがたのミナとなる。"
  13: "これがあなたがたが取[と]り分[わ]ける初穂[はつほ]である。小麦[こむぎ]のホメルから量[りょう]りの六分[ろくぶん]の一[いち]、大麦[おおむぎ]のコルからエファの六分の一である。"
  14: "油[あぶら]についての定[さだ]めはこうである。十[じゅう]コテュレから一[いっ]コテュレの油を取る。十コテュレが一[ひと]つのホメルだからである。"
  15: "また、十[じゅう]匹[ひき]の羊[ひつじ]から一[いっ]匹[ぴき]を、イスラエルのすべての父[ちち]の家[いえ]から取り分け、犠牲[ぎせい]と燔祭[はんさい]、またあなたがたのために贖[あがな]う救[すく]いの犠牲[ぎせい]とする、と主[しゅ]なる神[かみ]は言[い]われる。"
  16: "地[ち]の民[たみ]はすべて、この初穂[はつほ]をイスラエルの君[きみ]に与[あた]える。"
  17: "君[きみ]によって、燔祭[はんさい]と犠牲[ぎせい]と注[そそ]ぎの供[そな]え物[もの]が、祭[まつ]り、新月[しんげつ]、安息日[あんそくび]、イスラエルの家[いえ]のすべての祭りにささげられる。彼は罪[つみ]のためのもの、犠牲、燔祭、またイスラエルの家[いえ]のために贖[あがな]う救[すく]いの犠牲をささげる。"
  18: "主[しゅ]なる神[かみ]はこう言[い]われる。第一[だいいち]の月[つき]の一[ついたち]に、あなたがたは傷[きず]のない雄牛[おうし]の子[こ]を取[と]り、聖[せい]なる所[ところ]を贖[あがな]う。"
  19: "祭司[さいし]は贖[あがな]いの血[ち]を取[と]り、神殿[しんでん]の戸口[とぐち]の柱[はしら]と、聖所[せいしょ]の四[よっ]つの隅[すみ]と、祭壇[さいだん]と、内庭[ないてい]の門[もん]の戸口の柱[はしら]に注[そそ]ぐ。"
  20: "あなたは第七[だいしち]の月[つき]の一[ついたち]にも、同[おな]じように行[おこな]え。あなたはおのおのから、無知[むち]の者[もの]と幼[おさな]い者[もの]の分[ぶん]を取[と]り、神殿[しんでん]を清[きよ]める。"
  21: "第一[だいいち]の月[つき]の十四日[じゅうよっか]に、あなたがたには過越[すぎこし]の祭[まつ]りがある。七[なな]日[か]の間、種[たね]なしパンを食[た]べよ。"
  22: "その日[ひ]、君[きみ]は自分[じぶん]と自分の家[いえ]と、地[ち]の民[たみ]すべてのために、罪[つみ]のための雄牛[おうし]の子[こ]をささげる。"
  23: "祭[まつ]りの七[なな]日[か]の間、彼は主[しゅ]への燔祭[はんさい]として、七[なな]頭[とう]の雄牛[おうし]の子[こ]と七頭の傷[きず]のない雄羊[おひつじ]を、七日の間[あいだ]日[ひ]ごとにささげ、罪[つみ]のためには山羊[やぎ]の子[こ]を日ごとにささげる。"
  24: "あなたは雄牛[おうし]の子[こ]には焼[や]いた供[そな]え物[もの]を、雄羊[おひつじ]には焼いた供え物をささげ、その焼いた供え物には一[いっ]ヒンの油[あぶら]を添[そ]えよ。"
  25: "第七[だいしち]の月[つき]の十五日[じゅうごにち]、祭[まつ]りのとき、あなたは同[おな]じように七[なな]日[か]の間[あいだ]行[おこな]う。罪[つみ]のためのものも、燔祭[はんさい]も、穀物[こくもつ]の供[そな]え物[もの]も、油[あぶら]も同[おな]じである。」"

notes:
  1: "καταμετρεῖσθαι ὑμᾶς τὴν γῆν ἐν κληρονομίᾳ — «когда вы будете размерять землю в наследие» (κληρονομία — 嗣業); ἀφοριεῖτε ἀπαρχὴν τῷ κυρίῳ — «отделите начаток Господу» (ἀπαρχή — 初穂; ἀφορίζω — отделять); ἅγιον ἀπὸ τῆς γῆς — «святое от земли»; 25 000 в длину и 20 000 в ширину (LXX); слав. «в широту десяти тысящ» (10 000, с МТ) — вариант отмечен, держим LXX: при 10 000 нарушается геометрия участка (ср. ст. 3, 5, 6)."
  2: "εἰς ἁγίασμα — «в святыню (святое)» (ἁγίασμα); πεντακόσιοι ἐπὶ πεντακοσίους — «пятьсот на пятьсот»; τετράγωνον κυκλόθεν — «четырёхугольное кругом»; πήχεις πεντήκοντα διάστημα — «пятьдесят локтей промежуток» (空地)."
  3: "ἐκ ταύτης τῆς διαμετρήσεως — «из этого измерения»; 25 000 на 10 000; τὸ ἁγίασμα — «святыня»; ἅγια τῶν ἁγίων — «святое святых» (至聖所)."
  4: "ἀπὸ τῆς γῆς — «от земли»; τοῖς ἱερεῦσιν τοῖς λειτουργοῦσιν ἐν τῷ ἁγίῳ — «священникам, служащим во святом»; τοῖς ἐγγίζουσι λειτουργεῖν τῷ κυρίῳ — «приближающимся служить Господу»; τόπος εἰς οἴκους ἀφωρισμένους τῷ ἁγιασμῷ αὐτῶν — «место для домов, отделённых для освящения их» (家々)."
  5: "25 000 в длину и 10 000 в ширину (LXX); слав. «двадесять тысящ в широту» (20 000) — вариант отмечен, держим LXX (ср. ст. 1, 6); τοῖς Λευίταις τοῖς λειτουργοῦσιν τῷ οἴκῳ — «левитам, служащим дому» (神殿に仕えるレビ人); εἰς κατάσχεσιν — «во владение» (所有); πόλεις τοῦ κατοικεῖν — «города для обитания» (町々)."
  6: "τὴν κατάσχεσιν τῆς πόλεως — «владение города»; 5 000 в ширину и 25 000 в длину; ὃν τρόπον ἡ ἀπαρχὴ τῶν ἁγίων — «как начаток святых [мест]»; παντὶ οἴκῳ Ισραηλ — «всему дому Израилеву» (全家)."
  7: "τῷ ἡγουμένῳ — «князю» (君); ἐκ τούτου καὶ ἀπὸ τούτου — «отсюда и отсюда», с обеих сторон; εἰς τὰς ἀπαρχὰς τῶν ἁγίων — «к начаткам святых»; εἰς κατάσχεσιν τῆς πόλεως — «к владению города»; τὰ πρὸς θάλασσαν — «то, что к морю», т. е. к западу; ἀπὸ τῶν πρὸς θάλασσαν πρὸς ἀνατολάς — «от западного к восточному»; ὡς μία τῶν μερίδων — «как один из уделов» (分け前); ἀπὸ τῶν ὁρίων … ἐπὶ τὰ ὅρια — «от пределов… до пределов» (境界)."
  8: "εἰς κατάσχεσιν ἐν τῷ Ισραηλ — «во владение в Израиле»; οὐ καταδυναστεύσουσιν — «не будут притеснять» (καταδυναστεύω; 虐げる); οἱ ἀφηγούμενοι — «вожди» (君たち); κατὰ φυλάς — «по племенам (коленам)» (部族); κατακληρονομήσουσιν — «получат в наследие» (嗣業として受け継ぐ)."
  9: "τάδε λέγει κύριος θεός — «так говорит Господь Бог» (внутри речи); Ἱκανούσθω ὑμῖν — «довольно вам»; ἀδικίαν καὶ ταλαιπωρίαν ἀφέλεσθε — «неправду и озлобление отложите» (ταλαιπωρία — бедствие, притеснение; 虐げ); κρίμα καὶ δικαιοσύνην ποιήσατε — «суд и правду творите» (裁きと正しさ); ἐξάρατε καταδυναστείαν — «изымите насилие (угнетение)» (καταδυναστεία; 圧政)."
  10: "ζυγὸς δίκαιος — «вес (весы) праведный» (ζυγός; 秤); μέτρον δίκαιον — «мера праведная» (量り); χοῖνιξ δικαία — «хиникс праведный» (χοῖνιξ — мера сыпучих, ヒニクス)."
  11: "τὸ μέτρον καὶ ἡ χοῖνιξ ὁμοίως μία ἔσται — «мера и хиникс одинаково будут одно»; τοῦ λαμβάνειν — «для приёма (получения)»; τὸ δέκατον τοῦ γομορ — «десятая часть гомора» (γόμορ — хомер, ホメル); слав. называет меру «ефи» (ἐφά, エファ) — так и передано; πρὸς τὸ γομορ ἔσται ἴσον — «к гомору будет равно»."
  12: "τὸ στάθμιον εἴκοσι ὀβολοί — «вес — двадцать оболов» (στάθμιον — вес, オボル); οἱ πέντε σίγλοι πέντε — «пять сиклей — пять»; οἱ δέκα σίγλοι δέκα — «десять сиклей — десять»; πεντήκοντα σίγλοι ἡ μνᾶ — «пятьдесят сиклей — мина» (μνᾶ, ミナ). Слав. и МТ дают 25 + 20 + 15 сиклей (мина в 60 сиклей); взято церковное чтение, LXX-числа (5, 10, 50) — в этом примечании."
  13: "αὕτη ἡ ἀπαρχή — «сей начаток» (初穂); ἕκτον τοῦ μέτρου ἀπὸ τοῦ γομορ τοῦ πυροῦ — «шестая часть меры от гомора пшеницы» (小麦); τὸ ἕκτον τοῦ οιφι ἀπὸ τοῦ κόρου τῶν κριθῶν — «шестая часть ефы от кора ячменя» (οιφι — ефа, エファ; κόρος — кор, コル; 大麦)."
  14: "τὸ πρόσταγμα τοῦ ἐλαίου — «постановление об елее (масле)» (ἔλαιον; 油); κοτύλην ἐλαίου ἀπὸ δέκα κοτυλῶν — «котилу елея от десяти котил» (κοτύλη — コテュレ); αἱ δέκα κοτύλαι εἰσὶν γομορ — «десять котил есть гомор»."
  15: "πρόβατον ἀπὸ τῶν δέκα προβάτων — «овцу от десяти овец» (LXX и слав.; в ru/МТ — одну от двухсот); ἀφαίρεμα — «отделение, взнос» (取り分け); ἐκ πασῶν τῶν πατριῶν — «из всех отечеств (родов)» (父の家); εἰς θυσίας — «на жертвы» (犠牲); εἰς ὁλοκαυτώματα — «на всесожжения» (燔祭); εἰς σωτηρίου — «на [жертву] спасения» (σωτήριον; 救いの犠牲); ἐξιλάσκεσθαι περὶ ὑμῶν — «умилостивлять о вас» (贖う)."
  16: "πᾶς ὁ λαὸς τῆς γῆς — «весь народ земли» (地の民); δώσει τὴν ἀπαρχὴν ταύτην — «даст сей начаток» (初穂); τῷ ἀφηγουμένῳ — «вождю (князю)» (君)."
  17: "διὰ τοῦ ἀφηγουμένου — «через князя» (君によって); αἱ σπονδαί — «возлияния» (σπονδή; 注ぎの供え物); ἐν ταῖς ἑορταῖς — «в праздники» (祭り); νουμηνίαι — «новомесячия» (新月); σάββατα — «субботы» (安息日); τὰ ὑπὲρ ἁμαρτίας — «[жертвы] за грех»; τὰ τοῦ σωτηρίου — «[жертвы] спасения» (救いの犠牲); ἐξιλάσκεσθαι ὑπὲρ τοῦ οἴκου Ισραηλ — «умилостивлять за дом Израилев»."
  18: "Ἐν τῷ πρώτῳ μηνὶ μιᾷ τοῦ μηνός — «в первом месяце, в первый день месяца» (第一の月の一日); μόσχον ἐκ βοῶν ἄμωμον — «тельца из волов непорочного» (傷のない雄牛の子); ἐξιλάσασθαι τὸ ἅγιον — «очистить святое» (聖なる所を贖う)."
  19: "ἀπὸ τοῦ αἵματος τοῦ ἐξιλασμοῦ — «от крови очищения» (ἐξιλασμός); φλιάς — «косяки (столбы) дверей» (戸口の柱); τέσσαρας γωνίας τοῦ ἱεροῦ — «четыре угла святилища» (ἱερόν; 聖所の隅); θυσιαστήριον — «жертвенник» (祭壇); πύλης τῆς αὐλῆς τῆς ἐσωτέρας — «ворот внутреннего двора» (内庭の門)."
  20: "ἐν τῷ ἑβδόμῳ μηνὶ μιᾷ τοῦ μηνός — «в седьмом месяце, в первый день»; λήμψῃ παρ᾽ ἑκάστου ἀπόμοιραν — «возьмёшь у каждого часть (долю)» (ἀπόμοιρα); слав. добавляет «от неведущаго и от младенца» (無知の者と幼い者) — нет в LXX, внесено; ἐξιλάσεσθε τὸν οἶκον — «очистите дом» (神殿を清める)."
  21: "τεσσαρεσκαιδεκάτῃ τοῦ μηνός — «в четырнадцатый день месяца» (十四日); τὸ πασχα ἑορτή — «Пасха, праздник» (過越の祭り); ἑπτὰ ἡμέρας ἄζυμα ἔδεσθε — «семь дней ешьте опресноки» (種なしパン)."
  22: "ὁ ἀφηγούμενος — «князь» (君); ὑπὲρ αὑτοῦ καὶ τοῦ οἴκου — «за себя и за дом» (自分の家); ὑπὲρ παντὸς τοῦ λαοῦ τῆς γῆς — «за весь народ земли» (地の民); μόσχον ὑπὲρ ἁμαρτίας — «тельца за грех» (罪のための雄牛の子)."
  23: "τὰς ἑπτὰ ἡμέρας τῆς ἑορτῆς — «семь дней праздника» (祭りの七日); ὁλοκαυτώματα τῷ κυρίῳ — «всесожжения Господу» (燔祭); ἑπτὰ μόσχους καὶ ἑπτὰ κριοὺς ἀμώμους — «семь тельцов и семь овнов непорочных» (七頭の雄牛の子と七頭の雄羊); καθ᾽ ἡμέραν — «каждый день» (日ごとに); ἔριφον αἰγῶν — «козла из коз» (山羊の子)."
  24: "θυσίαν πέμμα — «жертву печёную» (πέμμα — печёное, хлебное приношение; 焼いた供え物; слав. «опресноки»); τῷ μόσχῳ … τῷ κριῷ — «тельцу… овну»; ἐλαίου τὸ ιν — «елея ин (хин)» (ἴν — хин, мера жидкости; 一ヒンの油); τῷ πέμματι — «на печёное» (焼いた供え物). Слав. ставит «и жертву» в конце ст. 23 — в LXX это начало ст. 24."
  25: "ἐν τῷ ἑβδόμῳ μηνὶ πεντεκαιδεκάτῃ τοῦ μηνός — «в седьмом месяце, в пятнадцатый день» (第七の月の十五日); ἐν τῇ ἑορτῇ — «в праздник» (祭り); ποιήσεις κατὰ τὰ αὐτά — «сделаешь так же» (同じように); ἑπτὰ ἡμέρας — «семь дней»; τὰ ὑπὲρ τῆς ἁμαρτίας — «[жертвы] за грех»; ὁλοκαυτώματα — «всесожжения»; τὸ μαναα — «манаа (хлебное приношение)» (манаа — евр. מִנְחָה, 穀物の供え物; слав. «дар»); τὸ ἔλαιον — «елей (масло)» (油; слав. «масло древяное»)."
