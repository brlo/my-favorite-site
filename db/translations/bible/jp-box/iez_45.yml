# jp-box, Иезекииль, глава 45. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 45 (совпадает; см. карту 20/21).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: раздел земли и праздники. 1–8 священный участок: 25 000 на 20 000,
# святилище 500 на 500, полоса священников и левитов, владение города, удел князя;
# 9–12 обличение князей, суд и правда, верные весы, ефа и хиникс, сикль и мина;
# 13–17 начатки хлеба, елея и овец, доля князя в праздники;
# 18–20 очищение святилища в первый и седьмой месяц; 21–24 Пасха и опресноки;
# 25 праздник седьмого месяца. Много чисел и мер — держатся одинаково.
# Голоса: 1–25 — одна речь Господа в 「…」, продолжение речи 44:5–31 (новой формулы
# «и сказал мне» нет); формула «так говорит Господь Бог» в 9 и 18 — внутри речи.
# «Точка»: в этой главе нет.
# Имена и термины: 初穂[はつほ] (ἀπαρχή), 聖[せい]なる所[ところ] (ἁγίασμα), 至聖所[しせいしょ]
# (ἅγια τῶν ἁγίων), 君[きみ] (ἡγούμενος), 嗣業[しぎょう] (κληρονομία), 所有[しょゆう]
# (κατάσχεσις), 祭壇[さいだん] (θυσιαστήριον), 燔祭[はんさい] (ὁλοκαύτωμα),
# 犠牲[ぎせい] (θυσία), 救[すく]いの犠牲[ぎせい] (σωτήριον), 穀物[こくもつ]の供[そな]え物[もの]
# (μαναα), 過越[すぎこし]の祭[まつ]り (πασχα), 種[たね]なしパン (ἄζυμα),
# ヒニクス (χοῖνιξ), ホメル (γομορ), エファ (ἐφά/οιφι), コテュレ (κοτύλη), コル (κόρος),
# シケル (σίκλος), オボル (ὀβολός), ミナ (μνᾶ), ヒン (ἴν), キュビト (πῆχυς).
#
