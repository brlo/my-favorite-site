# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# jp-joc в этой главе отсутствует (в Ветхом Завете у него только фрагменты).
# ru — только для понимания, не источник. Язык — современный 常体.
# Глава 11: последняя, десятая казнь объявлена (1–8), итог знамений и ожесточение
# фараона (9–10).
# Красного и синего нет: говорит Бог, но это не прямая речь Христа во плоти; «<j>» не ставится.
# Кавычки: речь Бога — 「…」 (1–2, 9); слово Господа в устах Моисея — 『…』 (4–7);
# слова рабов фараона внутри речи Моисея — 『…』 (8).
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено по базе).
# 11:2 LXX читает «тайно в уши народа» (κρυφῇ εἰς τὰ ὦτα τοῦ λαοῦ); в масоретском тексте
# и Синодальном этого нет («внуши народу») — держимся греческого, отличие в notes.
# Сносок ⟨…⟩ нет: 初子, 災い, 石臼 понятны; 過越 поясняется в 12:11. jp-ni не использовался.

tr_code: jp-box
book: ish
chapter: 11
draft: true

verses:
  1: "主[しゅ]はモーセに言[い]われた。「わたしはもう一[ひと]つの災[わざわ]いをファラオとエジプトに下[くだ]す。その後[のち]、彼[かれ]はあなたがたをここから去[さ]らせる。去[さ]らせるときには、あなたがたをすっかり追[お]い出[だ]すであろう。"
  2: "だから、民[たみ]の耳[みみ]にひそかに語[かた]り、おのおのが隣人[りんじん]から、女[おんな]は隣[となり]の女[おんな]から、銀[ぎん]の器[うつわ]と金[きん]の器[うつわ]、それに衣[ころも]を求[もと]めさせなさい。」"
  3: "主[しゅ]は民[たみ]に、エジプト人[じん]の目[め]にかなう{恵[めぐ]み|恩寵[おんちょう]}を与[あた]えられた。エジプト人[じん]は彼[かれ]らに貸[か]し与[あた]えた。モーセという人[ひと]は、エジプト人[じん]の前[まえ]でも、ファラオの前[まえ]でも、そのすべての家来[けらい]の前[まえ]でも、非常[ひじょう]に大[おお]きな者[もの]となった。"
  4: "モーセは言[い]った。「主[しゅ]はこう言[い]われる。『真夜中[まよなか]ごろ、わたしはエジプトの中[なか]に入[はい]る。"
  5: "エジプトの地[ち]の初子[ういご]はすべて死[し]ぬ。ファラオの位[くらい]に座[すわ]る者[もの]の初子[ういご]から、石臼[いしうす]のそばにいる女奴隷[おんなどれい]の初子[ういご]に至[いた]るまで、また家畜[かちく]の初子[ういご]もすべて死[し]ぬ。"
  6: "エジプト全土[ぜんど]に大[おお]きな叫[さけ]びが起[お]こる。かつてなかったような叫[さけ]びであり、二度[にど]と起[お]こらないような叫[さけ]びである。"
  7: "しかし、イスラエルの子[こ]らのうちでは、人[ひと]から家畜[かちく]に至[いた]るまで、犬[いぬ]一匹[いっぴき]も舌[した]を動[うご]かさない。あなたは、主[しゅ]がエジプト人[じん]とイスラエルの間[あいだ]にどれほど驚[おどろ]くべきことをなさるかを知[し]るであろう。』"
  8: "あなたの家来[けらい]たちはみな、わたしのところへ下[くだ]って来[き]て、わたしにひれ伏[ふ]し、『あなたも、あなたが導[みちび]く民[たみ]もみな、出[で]て行[い]け』と言[い]うであろう。その後[のち]で、わたしは出[で]て行[い]く。」モーセは怒[いか]りを抱[いだ]いてファラオから出[で]て行[い]った。"
  9: "主[しゅ]はモーセに言[い]われた。「ファラオはあなたがたの言[こと]を聞[き]かない。それは、わたしがエジプトの地[ち]で、わたしのしるしと不思議[ふしぎ]をますます増[ふ]やすためである。」"
  10: "モーセとアロンは、これらすべてのしるしと不思議[ふしぎ]をエジプトの地[ち]でファラオの前[まえ]に行[おこな]った。しかし主[しゅ]はファラオの心[こころ]をかたくなにされたので、彼[かれ]はイスラエルの子[こ]らをエジプトの地[ち]から去[さ]らせようとしなかった。"

notes:
  1: "Ἔτι μίαν πληγήν — もう一つの災い (πληγή — «удар, язва»; ср. 十の災い). ἐπάξω — 下す (ἐπάγω). σὺν παντὶ ἐκβαλεῖ ὑμᾶς ἐκβολῇ — すっかり追い出す (ἐκβολή — «изгнание»; датив усиления: «изгнанием изгонит»; слав. «со всем изженет вас изгнанием»)."
  2: "λάλησον κρυφῇ εἰς τὰ ὦτα τοῦ λαοῦ — 民の耳にひそかに (κρυφῇ — «тайно»; масоретский текст и Синодальный этого слова не имеют: «внуши народу»; держимся LXX). σκεύη ἀργυρᾶ καὶ χρυσᾶ — 銀の器と金の器. ἱματισμός — 衣."
  3: "ἔδωκεν τὴν χάριν τῷ λαῷ αὐτοῦ — 民に…恵みを与えられた (χάρις — «милость, благоволение»). ἔχρησαν αὐτοῖς — 貸し与えた (κίχρημι — «давать в долг»; слав. «даша им»; ср. 12:36). ὁ ἄνθρωπος Μωϋσῆς — モーセという人 (LXX прибавляет ἄνθρωπος)."
  4: "Τάδε λέγει κύριος — 主はこう言われる (пророческая формула). Περὶ μέσας νύκτας — 真夜中ごろ (букв. «около середины ночи»). εἰσπορεύομαι — 入る (praesens: «Я вхожу» — действие уже совершается)."
  5: "πρωτότοκον — 初子 (πρωτότοκος). ὃς κάθηται ἐπὶ τοῦ θρόνου — 位に座る者 (престол фараона). τῆς θεραπαίνης τῆς παρὰ τὸν μύλον — 石臼のそばにいる女奴隷 (μύλος — «мельничный жёрнов»; рабыня у жерновов — самая низкая). ἕως πρωτοτόκου παντὸς κτήνους — 家畜の初子もすべて."
  6: "κραυγὴ μεγάλη — 大きな叫び (κραυγή — «вопль»). ἥτις τοιαύτη οὐ γέγονεν — かつてなかったような. οὐκέτι προστεθήσεται — 二度と起こらない (προστίθημι — «прибавлять»; здесь «не повторится»)."
  7: "οὐ γρύξει κύων τῇ γλώσσῃ αὐτοῦ — 犬一匹も舌を動かさない (γρύζω — «ворчать, издавать звук»; слав. «не поскомлет пес языком своим»). παραδοξάσει — 驚くべきことをなさる (παραδοξάζω — «делать дивное»; слав. «прославится»; Синодальный — «какое различие делает»)."
  8: "οἱ παῖδές σου οὗτοι — あなたの家来たち (обращение к фараону). προσκυνήσουσίν με — わたしにひれ伏し (προσκυνέω). οὗ σὺ ἀφηγῇ — あなたが導く (ἀφηγέομαι — «предводительствовать»). ἐξῆλθεν … μετὰ θυμοῦ — 怒りを抱いて出て行った (θυμός — «гнев»)."
  9: "Οὐκ εἰσακούσεται ὑμῶν Φαραω — ファラオはあなたがたの言を聞かない (εἰσακούω — «слушать, внимать»). ἵνα πληθύνων πληθύνω — ますます増やすため (гебраизм, абсолютный инфинитив; слав. «умножая умножу»). σημεῖα καὶ τέρατα — しるしと不思議."
  10: "ἐσκλήρυνεν κύριος τὴν καρδίαν Φαραω — 主はファラオの心をかたくなにされた (σκληρύνω — «ожесточать»; действует Господь, не сглаживаем). οὐκ ἠθέλησεν ἐξαποστεῖλαι — 去らせようとしなかった (θέλω — «хотеть»)."
