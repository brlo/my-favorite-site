verses:
  0: "ダビデの賛美[さんび]。"
  1: "わたしの神[かみ]、わたしの王[おう]よ、わたしはあなたをあがめ、あなたの名[な]をとこしえに、代[よ]々[よ]にわたってほめたたえます。"
  2: "わたしは日[ひ]ごとにあなたをほめたたえ、あなたの名[な]をとこしえに、代[よ]々[よ]にわたって賛美[さんび]します。"
  3: "主[しゅ]は大[おお]きい方[かた]であり、大[おお]いにほめたたえられるべき方[かた]。その大[おお]いなることには限[かぎ]りがない。"
  4: "代[よ]は代[よ]にあなたのわざをほめたたえ、あなたの力[ちから]あるわざを告[つ]げ知[し]らせる。"
  5: "人[ひと]々[びと]はあなたの聖[せい]なる栄光[えいこう]の輝[かがや]きを語[かた]り、あなたの奇[き]跡[せき]を物語[ものがた]る。"
  6: "彼[かれ]らはあなたの恐[おそ]るべき力[ちから]あるわざを語[かた]り、あなたの大[おお]いなることを告[つ]げ知[し]らせる。"
  7: "彼[かれ]らはあなたの豊[ゆた]かな恵[めぐ]みの記[き]念[ねん]を語[かた]り出[だ]し、あなたの義[ぎ]を喜[よろこ]び歌[うた]う。"
  8: "主[しゅ]はあわれみ深[ぶか]く、恵[めぐ]み深[ぶか]い方[かた]。怒[いか]りを遅[おそ]くし、あわれみに豊[ゆた]かな方[かた]である。"
  9: "主[しゅ]はすべての者[もの]に恵[めぐ]み深[ぶか]く、そのあわれみはすべてのわざの上[うえ]にある。"
  10: "主[しゅ]よ、あなたのすべてのわざがあなたをたたえ、あなたの聖[せい]なる者[もの]たちがあなたをほめたたえますように。"
  11: "彼[かれ]らはあなたの国[くに]の栄光[えいこう]を語[かた]り、あなたの力[ちから]を告[つ]げる。"
  12: "それは、人[ひと]の子[こ]らにあなたの力[ちから]と、あなたの国[くに]の輝[かがや]かしい栄光[えいこう]とを知[し]らせるためである。"
  13: "あなたの国[くに]はすべての世[よ]の国[くに]、あなたの支配[しはい]は代[よ]から代[よ]に及[およ]ぶ。主[しゅ]はそのすべての言葉[ことば]に忠実[ちゅうじつ]であり、そのすべてのわざに聖[せい]である。"
  14: "主[しゅ]は倒[たお]れる者[もの]をすべて支[ささ]え、押[お]し伏[ふ]せられた者[もの]をすべて起[おこ]される。"
  15: "すべての者[もの]の目[め]はあなたを待[ま]ち望[のぞ]み、あなたは時[とき]に応[おう]じて彼[かれ]らに食物[しょくもつ]を与[あた]えられる。"
  16: "あなたは手[て]を開[ひら]き、すべての生[い]き物[もの]を恵[めぐ]みで満[み]たされる。"
  17: "主[しゅ]はそのすべての道[みち]に正[ただ]しく、そのすべてのわざに聖[せい]である。"
  18: "主[しゅ]は、ご自分[じぶん]を呼[よ]ぶすべての者[もの]に近[ちか]く、真実[しんじつ]をもってご自分[じぶん]を呼[よ]ぶすべての者[もの]に近[ちか]い。"
  19: "主[しゅ]はご自分[じぶん]を恐[おそ]れる者[もの]の願[ねが]いをかなえ、彼[かれ]らの叫[さけ]びを聞[き]いて救[すく]われる。"
  20: "主[しゅ]はご自分[じぶん]を愛[あい]するすべての者[もの]を守[まも]り、すべての罪[つみ]人[びと]を滅[ほろ]ぼされる。"
  21: "わたしの口[くち]は主[しゅ]の賛美[さんび]を語[かた]る。すべての肉[にく]なる者[もの]が、その聖[せい]なる名[な]をとこしえに、代[よ]々[よ]にわたってほめたたえますように。"

notes:
  0: "Αἴνεσις τῷ Δαυιδ — ダビデの賛美 (αἴνεσις — «хвала»). Надписание — стих 0."
  1: "Ὑψώσω σε, ὁ θεός μου ὁ βασιλεύς μου — わたしの神、わたしの王よ、わたしはあなたをあがめ (ὑψόω — «возвышать, превозносить»). εὐλογήσω τὸ ὄνομά σου εἰς τὸν αἰῶνα καὶ εἰς τὸν αἰῶνα τοῦ αἰῶνος — あなたの名をとこしえに、代々にわたってほめたたえます (двойная формула вечности сохранена)."
  2: "καθ᾽ ἑκάστην ἡμέραν εὐλογήσω σε — 日ごとにあなたをほめたたえ. αἰνέσω τὸ ὄνομά σου — あなたの名を賛美します (αἰνέω — 賛美する)."
  3: "μέγας κύριος καὶ αἰνετὸς σφόδρα — 主は大きい方であり、大いにほめたたえられるべき方 (αἰνετός — «достохвальный»). τῆς μεγαλωσύνης αὐτοῦ οὐκ ἔστιν πέρας — その大いなることには限りがない (μεγαλωσύνη — «величие»; πέρας — «предел»)."
  4: "γενεὰ καὶ γενεὰ ἐπαινέσει τὰ ἔργα σου — 代は代にあなたのわざをほめたたえ (ἐπαινέω — «хвалить»). τὴν δύναμίν σου ἀπαγγελοῦσιν — あなたの力あるわざを告げ知らせる."
  5: "τὴν μεγαλοπρέπειαν τῆς δόξης τῆς ἁγιωσύνης σου λαλήσουσιν — あなたの聖なる栄光の輝きを語り (μεγαλοπρέπεια — «великолепие»; ἁγιωσύνη — «святость»). τὰ θαυμάσιά σου διηγήσονται — あなたの奇跡を物語る (διηγέομαι — «рассказывать»)."
  6: "τὴν δύναμιν τῶν φοβερῶν σου ἐροῦσιν — あなたの恐るべき力あるわざを語り (φοβερός — «страшный, грозный»). τὴν μεγαλωσύνην σου διηγήσονται — あなたの大きなることを告げ知らせる."
  7: "μνήμην τοῦ πλήθους τῆς χρηστότητός σου ἐξερεύξονται — あなたの豊かな恵みの記念を語り出し (χρηστότης — «благость»; ἐξερεύγομαι — «изливать, изрекать»). τῇ δικαιοσύνῃ σου ἀγαλλιάσονται — あなたの義を喜び歌う (ἀγαλλιάομαι — «ликовать»)."
  8: "οἰκτίρμων καὶ ἐλεήμων ὁ κύριος — 主はあわれみ深く、恵み深い方 (οἰκτίρμων — «милосердный»; ἐλεήμων — «щедрый в милости»). μακρόθυμος καὶ πολυέλεος — 怒りを遅くし、あわれみに豊かな方 (μακρόθυμος — «долготерпеливый»; πολυέλεος — «многомилостивый»)."
  9: "χρηστὸς κύριος τοῖς σύμπασιν — 主はすべての者に恵み深く (χρηστός — «благой»). οἱ οἰκτιρμοὶ αὐτοῦ ἐπὶ πάντα τὰ ἔργα αὐτοῦ — そのあわれみはすべてのわざの上にある."
  10: "ἐξομολογησάσθωσάν σοι… πάντα τὰ ἔργα σου — あなたのすべてのわざがあなたをたたえ (повелительное 3 л. передано 〜ように). οἱ ὅσιοί σου εὐλογησάτωσάν σε — あなたの聖なる者たちがあなたをほめたたえますように (ὅσιος — «святой, преподобный»)."
  11: "δόξαν τῆς βασιλείας σου ἐροῦσιν — あなたの国の栄光を語り (βασιλεία — 国). τὴν δυναστείαν σου λαλήσουσιν — あなたの力を告げる (δυναστεία — «могущество»)."
  12: "τοῦ γνωρίσαι τοῖς υἱοῖς τῶν ἀνθρώπων — 人の子らに知らせるため (γνωρίζω — «давать знать»). τὴν δυναστείαν σου καὶ τὴν δόξαν τῆς μεγαλοπρεπείας τῆς βασιλείας σου — あなたの力と、あなたの国の輝かしい栄光とを."
  13: "ἡ βασιλεία σου βασιλεία πάντων τῶν αἰώνων — あなたの国はすべての世の国 (αἰών — «век»). ἡ δεσποτεία σου ἐν πάσῃ γενεᾷ καὶ γενεᾷ — あなたの支配は代から代に及ぶ (δεσποτεία — «владычество»). 13a: πιστὸς κύριος ἐν τοῖς λόγοις αὐτοῦ — 主はそのすべての言葉に忠実であり; ὅσιος ἐν πᾶσι τοῖς ἔργοις αὐτοῦ — そのすべてのわざに聖である (в гр. вторая половина стиха идёт как 13a; в переводе — в том же стихе)."
  14: "ὑποστηρίζει κύριος πάντας τοὺς καταπίπτοντας — 主は倒れる者をすべて支え (ὑποστηρίζω — «подкреплять»). ἀνορθοῖ πάντας τοὺς κατερραγμένους — 押し伏せられた者をすべて起こされる (ἀνορθόω — «восставлять»; καταρρήγνυμι — «низвергать»)."
  15: "οἱ ὀφθαλμοὶ πάντων εἰς σὲ ἐλπίζουσιν — すべての者の目はあなたを待ち望み (ἐλπίζω εἰς — «надеяться на»). δίδως τὴν τροφὴν αὐτῶν ἐν εὐκαιρίᾳ — 時に応じて彼らに食物を与えられる (εὐκαιρία — «удобное время»)."
  16: "ἀνοίγεις σὺ τὴν χεῖρά σου — あなたは手を開き (ἀνοίγω — «открывать»). ἐμπιπλᾷς πᾶν ζῷον εὐδοκίας — すべての生き物を恵みで満たされる (ἐμπίπλημι — «наполнять»; εὐδοκία — «благоволение»)."
  17: "δίκαιος κύριος ἐν πάσαις ταῖς ὁδοῖς αὐτοῦ — 主はそのすべての道に正しく. ὅσιος ἐν πᾶσι τοῖς ἔργοις αὐτοῦ — そのすべてのわざに聖である (повтор 13a)."
  18: "ἐγγὺς κύριος πᾶσιν τοῖς ἐπικαλουμένοις αὐτόν — 主は、ご自分を呼ぶすべての者に近く (ἐγγύς — «близко»). πᾶσι τοῖς ἐπικαλουμένοις αὐτὸν ἐν ἀληθείᾳ — 真実をもってご自分を呼ぶすべての者に近い (ἐν ἀληθείᾳ — «в истине»)."
  19: "θέλημα τῶν φοβουμένων αὐτὸν ποιήσει — ご自分を恐れる者の願いをかなえ (θέλημα — «воля, желание»). τῆς δεήσεως αὐτῶν ἐπακούσεται — 彼らの叫びを聞いて (δέησις — «прошение»). σώσει αὐτούς — 救われる."
  20: "φυλάσσει κύριος πάντας τοὺς ἀγαπῶντας αὐτόν — 主はご自分を愛するすべての者を守り. πάντας τοὺς ἁμαρτωλοὺς ἐξολεθρεύσει — すべての罪人を滅ぼされる (ἐξολεθρεύω — «истреблять»)."
  21: "αἴνεσιν κυρίου λαλήσει τὸ στόμα μου — わたしの口は主の賛美を語る. εὐλογείτω πᾶσα σὰρξ τὸ ὄνομα τὸ ἅγιον αὐτοῦ — すべての肉なる者が、その聖なる名をほめたたえますように (σάρξ — «плоть», т. е. всякое живое)."
