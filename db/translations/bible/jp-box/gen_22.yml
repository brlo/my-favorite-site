verses:
  1: "これらのことがあって後[のち]、神[かみ]はアブラハムを試[こころ]みて、彼[かれ]に言[い]われた。「アブラハムよ、アブラハムよ。」彼[かれ]は言[い]った。「はい、ここにいます。」"
  2: "そして言[い]われた。「あなたの子[こ]、あなたが愛[あい]する者[もの]イサクを連[つ]れて、高[たか]い地[ち]へ行[い]き、わたしがあなたに示[しめ]す山[やま]の一[ひと]つで、彼[かれ]を燔祭[はんさい]として献[ささ]げなさい。」"
  3: "アブラハムは朝[あさ]早[はや]く起[お]きて、自分のろばに鞍[くら]を置[お]き、二人[ふたり]の若[わか]い者[もの]と、自分の子[こ]イサクを連[つ]れ、燔祭[はんさい]のための薪[たきぎ]を割[わ]って、立[た]って出[で]かけ、神[かみ]が彼[かれ]に言[い]われた場所[ばしょ]へ来[き]た。"
  4: "三日目[みっかめ]に、アブラハムは目[め]を上[あ]げて、その場所[ばしょ]を遠[とお]くに見[み]た。"
  5: "アブラハムは若[わか]い者[もの]たちに言[い]った。「あなたがたはろばとともにここに座[すわ]っていなさい。わたしとこの子[こ]はあそこまで行[い]き、礼拝[れいはい]して、あなたがたのところへ戻[もど]って来[く]る。」"
  6: "アブラハムは燔祭[はんさい]の薪[たきぎ]を取[と]って、その子[こ]イサクに負[お]わせ、火[ひ]と刀[かたな]を手[て]に取[と]った。二人[ふたり]はともに歩[ある]いて行[い]った。"
  7: "イサクは父[ちち]アブラハムに言[い]った。「父[ちち]よ。」彼[かれ]は言[い]った。「子[こ]よ、何[なに]か。」イサクは言[い]った。「火[ひ]と薪[たきぎ]はここにありますが、燔祭[はんさい]の羊[ひつじ]はどこにいるのですか。」"
  8: "アブラハムは言[い]った。「子[こ]よ、神[かみ]がご自分[じぶん]のために、燔祭[はんさい]の羊[ひつじ]を備[そな]えてくださる。」二人[ふたり]はともに歩[ある]いて行[い]った。"
  9: "彼[かれ]らは、神[かみ]が彼[かれ]に言[い]われた場所[ばしょ]に来[き]た。アブラハムはそこに祭壇[さいだん]を築[きず]き、薪[たきぎ]を並[なら]べ、その子[こ]イサクを縛[しば]って、祭壇[さいだん]の薪[たきぎ]の上[うえ]に載[の]せた。"
  10: "アブラハムは手[て]を伸[の]ばして刀[かたな]を取[と]り、自分の子[こ]を屠[ほふ]ろうとした。"
  11: "主[しゅ]の天使[てんし]が天[てん]から彼[かれ]を呼[よ]んで言[い]った。「アブラハムよ、アブラハムよ。」彼[かれ]は言[い]った。「はい、ここにいます。」"
  12: "そして言[い]った。「その子[こ]に手[て]をかけてはならない。何[なに]一つしてはならない。今[いま]、わたしは、あなたが神[かみ]を畏[おそ]れ、わたしのために、あなたの愛[あい]する子[こ]を惜[お]しまなかったことを知[し]った。」"
  13: "アブラハムは目[め]を上[あ]げて見[み]た。すると、見[み]よ、一匹[いっぴき]の雄羊[おひつじ]が、角[つの]を柴[しば]の茂[しげ]みに取[と]られていた。アブラハムは行[い]って雄羊[おひつじ]を取[と]り、自分の子[こ]イサクの代[か]わりに、それを燔祭[はんさい]として献[ささ]げた。"
  14: "アブラハムはその場所[ばしょ]を「主[しゅ]は見[み]られた」と名[な]づけた。それゆえ、今日[こんにち]でも「主[しゅ]の山[やま]に主[しゅ]は現[あらわ]れた」と言[い]われる。"
  15: "主[しゅ]の天使[てんし]は、天[てん]から再[ふたた]びアブラハムを呼[よ]んだ。"
  16: "そして言[い]った。「主[しゅ]は言[い]われる。『わたしは自分[じぶん]にかけて誓[ちか]う。あなたはこのことを行[おこな]い、わたしのために、あなたの愛[あい]する子[こ]を惜[お]しまなかった。"
  17: "わたしは必[かなら]ずあなたを祝福[しゅくふく]し、必[かなら]ずあなたの子孫[しそん]を増[ふ]やす。天[てん]の星[ほし]のように、海[うみ]の岸[きし]の砂[すな]のように。あなたの子孫[しそん]は、敵[てき]の町[まち]を嗣業[しぎょう]として受[う]け継[つ]ぐ。"
  18: "地[ち]のすべての民[たみ]は、あなたの子孫[しそん]によって祝福[しゅくふく]を受[う]ける。あなたがわたしの声[こえ]に聞[き]き従[したが]ったからである。』」"
  19: "アブラハムは若[わか]い者[もの]たちのところへ戻[もど]った。彼[かれ]らは立[た]って、ともに誓[ちか]いの井戸[いど]へ行[い]った。アブラハムは誓[ちか]いの井戸[いど]のそばに住[す]んだ。"
  20: "これらのことがあって後[のち]、アブラハムに告[つ]げる者[もの]があった。「見[み]よ、ミルカもまた、あなたの兄弟[きょうだい]ナホルに男[おとこ]の子[こ]らを産[う]んだ。"
  21: "すなわち、長男[ちょうなん]のオクス、その弟[おとうと]のバウクス、シリア人[じん]の父[ちち]カムエル、"
  22: "ハサド、アザウ、ファルダス、イエドラフ、バトエル、"
  23: "バトエルはリベカを生[う]んだ。これら八人[はちにん]は、ミルカがアブラハムの兄弟[きょうだい]ナホルに産[う]んだ子[こ]らである。」"
  24: "その側女[そばめ]で、名[な]をレエマという者[もの]も、タベク、ガアム、トホス、モハを産[う]んだ。"

notes:
  1: "ἐπείραζεν — 試みた (πειράζω — «испытывать»; евр. נִסָּה). Αβρααμ, Αβρααμ — アブラハムよ、アブラハムよ (двойное обращение, как в евр.). Ἰδοὺ ἐγώ — はい、ここにいます (букв. «вот я»)."
  2: "τὸν υἱόν σου τὸν ἀγαπητόν, ὃν ἠγάπησας — あなたの子、あなたが愛する者 (ἀγαπητός — «возлюбленный»; евр. יָחִיד, «единственный»). εἰς τὴν γῆν τὴν ὑψηλήν — 高い地へ (LXX: ὑψηλή; евр. מוֹרִיָּה, Мориа; Синодальный — «земля Мориа»; jp-joc — モリアの地; держимся греческого, поэтому в тексте нет モリヤ). ὁλοκάρπωσις — 燔祭 (всесожжение; ὁλο- «весь» + καρπός «плод»). ἐφ᾿ ἓν τῶν ὀρέων, ὧν ἄν σοι εἴπω — わたしが示す山の一つで."
  3: "ἐπέσαξεν τὴν ὄνον — ろばに鞍を置いた (ἐπισάσσω). παρέλαβεν ... δύο παῖδας — 二人の若い者を連れた. σχίσας ξύλα — 薪を割って (σχίζω — «раскалывать»). ἦλθεν ἐπὶ τὸν τόπον — その場所へ来た (LXX: «пришёл» уже в 3-м стихе; в евр. — в 4-м; не сглаживаем)."
  4: "τῇ ἡμέρᾳ τῇ τρίτῃ — 三日目に. ἀναβλέψας τοῖς ὀφθαλμοῖς — 目を上げて. μακρόθεν — 遠くに."
  5: "Καθίσατε αὐτοῦ μετὰ τῆς ὄνου — ろばとともにここに座っていなさい. ἕως ὧδε — あそこまで (букв. «до тех пор»). προσκυνήσαντες ἀναστρέψωμεν — 礼拝して戻って来る (προσκυνέω)."
  6: "τὰ ξύλα τῆς ὁλοκαρπώσεως — 燔祭の薪. ἐπέθηκεν Ισαακ — イサクに負わせた. τὸ πῦρ μετὰ χεῖρα — 火を手に (букв. «огонь с рукой»). τὴν μάχαιραν — 刀. ἐπορεύθησαν οἱ δύο ἅμα — 二人はともに歩いた."
  7: "Πάτερ — 父よ. Τί ἐστιν, τέκνον; — 子よ、何か. τὸ πρόβατον τὸ εἰς ὁλοκάρπωσιν — 燔祭の羊 (πρόβατον — «овца»)."
  8: "Ὁ θεὸς ὄψεται ἑαυτῷ πρόβατον — 神がご自分のために羊を備えてくださる (ὄψεται — «увидит», т. е. усмотрит). πορευθέντες ... ἅμα — ともに歩いて行った."
  9: "θυσιαστήριον — 祭壇 (θυσιαστήριον от θυσία «жертва»). συμποδίσας — 縛って (συμποδίζω — «связывать ноги»). ἐπάνω τῶν ξύλων — 薪の上に."
  10: "ἐξέτεινεν τὴν χεῖρα — 手を伸ばした. σφάξαι — 屠る (σφάζω — «закалывать»)."
  11: "ἄγγελος κυρίου — 主の天使. ἐκ τοῦ οὐρανοῦ — 天から. Ἰδοὺ ἐγώ — はい、ここにいます."
  12: "Μὴ ἐπιβάλῃς τὴν χεῖρά σου — 手をかけてはならない (ἐπιβάλλω). μηδὲ ποιήσῃς μηδέν — 何一つしてはならない. νῦν γὰρ ἔγνων — 今、知った (аорист, «узнал»). φοβῇ τὸν θεόν — 神を畏れる. οὐκ ἐφείσω τοῦ υἱοῦ σου τοῦ ἀγαπητοῦ — 愛する子を惜しまなかった (φείδομαι)."
  13: "κριὸς εἷς — 一匹の雄羊 (κριός — «баран»). κατεχόμενος ἐν φυτῷ σαβεκ τῶν κεράτων — 角を柴に取られていた (σαβέκ — неизвестное растение; евр. סְבַךְ, «чаща»). ἀντὶ Ισαακ — イサクの代わりに."
  14: "Κύριος εἶδεν — 主は見られた (имя места; евр. יְהוָה יִרְאֶה, Иегова-ире). ἵνα εἴπωσιν σήμερον — 今日でも…と言われる. Ἐν τῷ ὄρει κύριος ὤφθη — 主の山に主は現れた."
  15: "δεύτερον — 再び (букв. «второй раз»)."
  16: "Κατ᾿ ἐμαυτοῦ ὤμοσα — 自分にかけて誓う (κατά + род.). λέγει κύριος — 主は言われる (пророческая формула). οὐκ ἐφείσω — 惜しまなかった."
  17: "ἦ μὴν εὐλογῶν εὐλογήσω — 必ず祝福し (датив усиления). πληθύνων πληθυνῶ — 必ず増やす. ὡς τοὺς ἀστέρας τοῦ οὐρανοῦ — 天の星のように. ἄμμον τὴν παρὰ τὸ χεῖλος τῆς θαλάσσης — 海の岸の砂のように. κληρονομήσει ... τὰς πόλεις τῶν ὑπεναντίων — 敵の町を嗣業として受け継ぐ (ὑπεναντίος — «противник»)."
  18: "ἐνευλογηθήσονται ἐν τῷ σπέρματί σου — あなたの子孫によって祝福を受ける. ἀνθ᾿ ὧν ὑπήκουσας τῆς ἐμῆς φωνῆς — わたしの声に聞き従ったからである (ὑπακούω + род.)."
  19: "ἀπεστράφη ... πρὸς τοὺς παῖδας — 若い者たちのところへ戻った. ἐπὶ τὸ φρέαρ τοῦ ὅρκου — 誓いの井戸へ. κατῴκησεν — 住んだ."
  20: "ἀνηγγέλη τῷ Αβρααμ — アブラハムに告げられた (ἀναγγέλλω). τέτοκεν ... υἱούς — 男の子らを産んだ (perfect)."
  21: "Ωξ — オクス (греч.; евр. אוּץ, Уц). Βαυξ — バウクス (евр. בּוּז, Вуз). Καμουηλ πατὴρ Σύρων — シリア人の父カムエル (Σύροι — «сирийцы»; евр. אֲרָם)."
  22: "Χασαδ, Αζαυ, Φαλδας, Ιεδλαφ, Βαθουηλ — ハサド、アザウ、ファルダス、イエドラフ、バトエル (греч. формы; в евр. Кесед, Хазо, Пилдаш, Идлаф, Вафуил)."
  23: "Βαθουηλ ἐγέννησεν τὴν Ρεβεκκαν — バトエルはリベカを生んだ. ὀκτὼ οὗτοι υἱοί — これら八人は男の子ら."
  24: "παλλακή — 側女 (παλλακή — «наложница»). Ρεημα — レエマ. Ταβεκ, Γααμ, Τοχος, Μωχα — タベク、ガアム、トホス、モハ (греч. формы; в евр. Тевах, Гахам, Тахаш, Мааха)."
