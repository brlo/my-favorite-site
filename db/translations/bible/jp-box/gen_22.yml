# jp-box, Бытие, глава 22. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — csl-ru, ru (с масоретского —
# только для понимания) и jp-joc (1901, PD; ст. 1–18). Язык — современный 常体.
# Глава 22 — ключевой текст: искушение Авраама (1–2), путь на гору (3–8),
# жертвенник и связанный Исаак (9–10), слово ангела и овен (11–14),
# клятва Господа и обетование (15–19), родословие Нахора (20–24).
# Красного и синего нет: говорит Бог и ангел, но это не прямая речь Христа во плоти;
# «<j>» не ставится. Прямая речь — в 「…」; слово Господа в устах ангела — 『…』 (16–18).
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено по базе).
# LXX 22:2 читает «земля высокая» (τὴν γῆν τὴν ὑψηλήν), а не «земля Мориа» (МТ, Синодальный,
# jp-joc: モリア); поэтому в тексте 高い地, а モリヤ — только в notes. 22:14 LXX передаёт
# имя места по-гречески: 主は見られた (евр. Иегова-ире).
# Сносок ⟨…⟩ нет: 燔祭 уже пояснено при первом упоминании в корпусе (Быт 8:20); 祭壇, 雄羊 понятны по контексту.
# jp-ni не использовался.

