# jp-box, Амос, глава 5. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 5 (совпадает).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: плач о деве Израилевой; «взыщите Меня, и будете живы»; не ищите
# Вефиля и Галгала; Господь — Творец; обличение суда, взяток, ненависти к
# обличающему; «ищите добра, а не зла»; день Господень — тьма, а не свет;
# отвержение праздников и жертв; «пусть течёт суд, как вода»; сорок лет в пустыне,
# скиния Молоха и звезда Ремфана, «переселю вас за Дамаск».
# Голоса: 1–2 плач пророка; 3 — слово Господа в 「…」; 4–6 — слово Господа в 「…»;
# 7–13 — речь пророка (гимн 7–9 и обличение 10–13), без кавычек; 14–15 — призыв
# пророка; 16–17 — слово Господа в 「…»; 18–20 — речь пророка; 21–24 — слово
# Господа в 「…»; 25–27 — слово Господа в 「…».
# Рефрен 1: «裁きは水のように、正しさは…流れよ」 (5:24); 8:8 и 9:5 — образ
# разливающейся реки (повторён).
# Термины: 嘆き/弔いの歌 (θρῆνος), 処女 (παρθένος), 主の日 (ἡμέρα κυρίου),
# 全能者 (παντοκράτωρ), 裁き (κρίμα), 正しさ (δικαιοσύνη), 残りの者 (περίλοιποι).
# Имена: イスラエル, ヨセフ, ベテル, ギルガル, ダマスコ, モロク, レファン.
#
tr_code: jp-box
book: am
chapter: 5
draft: true

verses:
  1: "イスラエルの家[いえ]よ、わたしがあなたがたのために取[と]り上[あ]げるこの弔[とむら]いの歌[うた]を聞[き]け。"
  2: "イスラエルの処女[おとめ]は倒[たお]れ、もはや起[お]き上[あ]がらない。彼女[かのじょ]は自分[じぶん]の地[ち]に投[な]げ倒[たお]され、起[お]こす者[もの]もいない。"
  3: "主[しゅ]である神[かみ]はこう言[い]われる。「千人[せんにん]を送[おく]り出[だ]した町[まち]は百人[ひゃくにん]だけ残[のこ]り、百人を送り出した町は十人[じゅうにん]だけ残る、イスラエルの家[いえ]のために。」"
  4: "主[しゅ]はイスラエルの家[いえ]にこう言[い]われる。「わたしを求[もと]めよ。そうすれば、あなたがたは生[い]きる。"
  5: "ベテルを求[もと]めるな。ギルガルへ行[い]くな。誓[ちか]いの井戸[いど]へも渡[わた]るな。ギルガルは必[かなら]ず捕囚[ほしゅう]となり、ベテルは無[な]いも同然[どうぜん]となるからである。"
  6: "主[しゅ]を求[もと]めよ。そうすれば、あなたがたは生[い]きる。さもないと、主は火[ひ]のようにヨセフの家[いえ]に燃[も]え上[あ]がり、それを焼[や]き尽[つ]くして、イスラエルの家[いえ]のために消[け]す者[もの]もいなくなる。」"
  7: "主[しゅ]は裁[さば]きを高[たか]みに置[き]、正[ただ]しさを地[ち]に据[す]えられた。"
  8: "主[しゅ]はすべてを造[つく]り、変[か]え、死[し]の影[かげ]を朝[あさ]に、昼[ひる]を夜[よる]の暗[くら]さに変[か]え、海[うみ]の水[みず]を呼[よ]び寄[よ]せて地[ち]の面[おもて]に注[そそ]がれる。その名[な]は主[しゅ]である神[かみ]、全能者[ぜんのうしゃ]。"
  9: "主[しゅ]は強[つよ]い者[もの]の上[うえ]に破滅[はめつ]を放[はな]ち、砦[とりで]の上に災[わざわ]いを臨[のぞ]ませる。"
  10: "彼らは門[もん]のところで戒[いまし]める者[もの]を憎[にく]み、正[ただ]しいことを語[かた]る者[もの]を忌[い]み嫌[きら]う。"
  11: "あなたがたは貧[まず]しい者[もの]を拳[こぶし]で打[う]ち、彼から選[え]りすぐった贈[おく]り物[もの]を取[と]った。それゆえ、あなたがたは切[き]り石[いし]の家[いえ]を建[た]ててもそこに住[す]めず、美[うつく]しいぶどう畑[ばたけ]を植[う]えてもそのぶどう酒[しゅ]を飲[の]めない。"
  12: "わたしはあなたがたの多[おお]くの罪[つみ]を知[し]っている。あなたがたの罪は重[おも]い。あなたがたは正[ただ]しい者[もの]を虐[しいた]げ、賄賂[わいろ]を取[と]り、門[もん]のところで貧しい者[もの]の裁[さば]きを曲[ま]げる。"
  13: "それゆえ、その時[とき]、悟[さと]りのある者[もの]は黙[だま]っている。悪[わる]い時だからである。"
  14: "善[よ]を求[もと]め、悪[わる]を求めるな。そうすれば、あなたがたは生[い]きる。そうすれば、主[しゅ]である神[かみ]、全能者[ぜんのうしゃ]が、あなたがたが言[い]ったとおり、あなたがたとともにいる。"
  15: "悪[わる]を憎[にく]み、善[よ]を愛[あい]せ。門[もん]のところで裁[さば]きを立[た]て直[なお]せ。そうすれば、主[しゅ]である神[かみ]、全能者[ぜんのうしゃ]は、ヨセフの残[のこ]りの者[もの]をあわれまれるかもしれない。"
  16: "それゆえ、主[しゅ]である神[かみ]、全能者[ぜんのうしゃ]はこう言[い]われる。「すべての広場[ひろば]に泣[な]き声[ごえ]があり、すべての道[みち]に『ああ、ああ』という叫[さけ]びがある。農夫[のうふ]は嘆[なげ]きと泣[な]き声[ごえ]に、嘆[なげ]き歌[うた]を知[し]る者[もの]たちは弔[とむら]いの歌[うた]に呼[よ]ばれる。"
  17: "すべての道[みち]に泣[な]き声[ごえ]がある。わたしがあなたのただ中[なか]を通[とお]り過[す]ぎるからである。」と主[しゅ]は言[い]われる。"
  18: "主[しゅ]の日[ひ]を望[のぞ]む者[もの]たちは、わざわいである。あなたがたにとって主の日は何[なん]の役[やく]に立[た]つのか。それは暗[くら]やみであって、光[ひかり]ではない。"
  19: "獅子[しし]から逃[に]げた者[もの]に熊[くま]が出会[であ]い、家[いえ]に入[はい]って手[て]を壁[かべ]についたときに蛇[へび]にかまれるようなものである。"
  20: "主[しゅ]の日[ひ]は暗[くら]やみであって、光[ひかり]ではないではないか。光[ひかり]のない闇[やみ]ではないか。"
  21: "「わたしはあなたがたの祭[まつ]りを憎[にく]み、退[しりぞ]ける。あなたがたの集[つど]いの供[そな]え物[もの]を、わたしは香[かお]りとして受[う]け入[い]れない。"
  22: "たとえあなたがたが燔祭[はんさい]と供[そな]え物[もの]をわたしに携[たずさ]えて来[き]ても、わたしはそれを受[う]け取[と]らない。あなたがたの救[すく]いの捧[ささ]げ物[もの]をも顧[かえり]みない。"
  23: "あなたの歌[うた]の騒[さわ]がしさを、わたしから遠[とお]ざけよ。わたしはあなたの楽器[がっき]の奏[かな]でる音[ね]を聞[き]かない。"
  24: "裁[さば]きは水[みず]のように、正[ただ]しさは渡[わた]ることのできない流[なが]れのように流[なが]れよ。」"
  25: "「イスラエルの家[いえ]よ、あなたがたは荒[あ]れ野[の]で四十年[よんじゅうねん]の間[あいだ]、わたしに屠[ほふ]り獣[じゅう]と供[そな]え物[もの]をささげたのか。"
  26: "あなたがたはモロクの幕屋[まくや]と、あなたがたの神[かみ]レファンの星[ほし]、すなわち自分[じぶん]たちが造[つく]った像[かたち]を負[お]った。"
  27: "わたしはあなたがたをダマスコの向[む]こうへ移[うつ]す。」と主[しゅ]は言[い]われる。その名[な]は主[しゅ]である神[かみ]、全能者[ぜんのうしゃ]。"

notes:
  1: "Ἀκούσατε τὸν λόγον κυρίου τοῦτον, ὃν ἐγὼ λαμβάνω ἐφ' ὑμᾶς θρῆνον — «слушайте слово Господне сие, которое я принимаю на вас плачем» (λαμβάνω ἐπί — поднимать о ком; θρῆνος — плач/погребальная песнь, 弔いの歌); οἶκος Ισραηλ — обращение «дом Израилев» (イスラエルの家よ)."
  2: "Ἔπεσεν οὐκέτι μὴ προσθῇ τοῦ ἀναστῆναι — «упала, более не встанет» (πίπτω — падать; προστίθημι — прибавлять, «более»); παρθένος τοῦ Ισραηλ — «дева Израилева» (παρθένος — 処女[おとめ], как Иер 31:4); ἔσφαλεν ἐπὶ τῆς γῆς αὐτῆς — «повержена на земле своей» (σφάλλω — опрокидывать); οὐκ ἔστιν ὁ ἀναστήσων αὐτήν — «нет поднимающего её» (ἀνίστημι — 起こす)."
  3: "διότι τάδε λέγει κύριος κύριος — «ибо так говорит Господь Бог» (κύριος κύριος — 主である神); Ἡ πόλις, ἐξ ἧς ἐξεπορεύοντο χίλιοι, ὑπολειφθήσονται ἑκατόν — «город, из которого выходили тысяча, останутся сто» (ἐκπορεύομαι — выходить; ὑπολείπω — оставлять, 残る); ἐξ ἧς ἑκατόν… δέκα — «из которого сто… десять»; τῷ οἴκῳ Ισραηλ — «дому Израилеву» (ために)."
  4: "διότι τάδε λέγει κύριος πρὸς τὸν οἶκον Ισραηλ — «ибо так говорит Господь дому Израилеву» (формула вне кавычек); Ἐκζητήσατέ με καὶ ζήσεσθε — «взыщите Меня и будете живы» (ἐκζητέω — искать, 求める; ζάω — 生きる)."
  5: "καὶ μὴ ἐκζητεῖτε Βαιθηλ — «и не ищите Вефиля»; εἰς Γαλγαλα μὴ εἰσπορεύεσθε — «в Галгал не входите»; ἐπὶ τὸ φρέαρ τοῦ ὅρκου μὴ διαβαίνετε — «к колодцу клятвы не переходите» (φρέαρ — колодец, 井戸; ὅρκος — клятва; это Вирсавия/Беэр-Шева, в МТ/ru «Вирсавия» — не внесено, чтобы держаться LXX/csl); Γαλγαλα αἰχμαλωτευομένη αἰχμαλωτευθήσεται — «Галгал, пленяемый, будет пленён» (усиление, 必ず捕囚); Βαιθηλ ἔσται ὡς οὐχ ὑπάρχουσα — «Вефиль будет как несуществующий» (ὑπάρχω — существовать, 無いも同然)."
  6: "ἐκζητήσατε τὸν κύριον καὶ ζήσατε — «взыщите Господа и живите» (повтор 4); ὅπως μὴ ἀναλάμψῃ ὡς πῦρ ὁ οἶκος Ιωσηφ — «чтобы не воспылал, как огонь, дом Иосифа» (ἀναλάμπω — возгораться, 燃え上がる; οἶκος Ιωσηφ — ヨセフの家); καταφάγεται αὐτόν — «поест его»; οὐκ ἔσται ὁ σβέσων τῷ οἴκῳ Ισραηλ — «не будет гасящего для дома Израилева» (σβέννυμι — гасить, 消す)."
  7: "κύριος ὁ ποιῶν εἰς ὕψος κρίμα — «Господь, творящий в высоту суд» (εἰς ὕψος — в высоту, 高みに; κρίμα — 裁き); δικαιοσύνην εἰς γῆν ἔθηκεν — «правду на землю положил» (τίθημι — 据える). В ru (МТ) 5:7 — «вы, которые суд превращаете в отраву»; в LXX/csl стих начинает гимн Творцу, иное деление — не внесено."
  8: "ποιῶν πάντα καὶ μετασκευάζων — «творящий всё и преобразующий» (μετασκευάζω — изменять, 変える); ἐκτρέπων εἰς τὸ πρωῒ σκιὰν θανάτου — «обращающий в утро тень смерти» (ἐκτρέπω — обращать; σκιά — 影); ἡμέραν εἰς νύκτα συσκοτάζων — «день в ночь помрачающий» (συσκοτάζω — 暗くする); ὁ προσκαλούμενος τὸ ὕδωρ τῆς θαλάσσης — «призывающий воду моря» (προσκαλέομαι — призывать, 呼び寄せる); ἐκχέων αὐτὸ ἐπὶ προσώπου τῆς γῆς — «изливающий её на лицо земли» (ἐκχέω — 注ぐ); κύριος ὁ θεὸς ὁ παντοκράτωρ ὄνομα αὐτῷ — «Господь Бог Вседержитель имя Ему» (全能者). В ru (МТ) «семизвездие и Орион» — добавка МТ, не внесена."
  9: "ὁ διαιρῶν συντριμμὸν ἐπ' ἰσχύν — «разделяющий сокрушение на силу» (διαιρέω — разделять; συντριμμός — сокрушение, 破滅; ἰσχύς — 力); ταλαιπωρίαν ἐπὶ ὀχύρωμα ἐπάγων — «бедствие на твердыню наводящий» (ταλαιπωρία — 災い; ὀχύρωμα — крепость, 砦). В ru (МТ) «укрепляет опустошителя против сильного» — иное чтение, не внесено."
  10: "ἐμίσησαν ἐν πύλαις ἐλέγχοντα — «возненавидели в воротах обличающего» (μισέω — 憎む; πύλη — 門; ἐλέγχω — обличать, 戒める); λόγον ὅσιον ἐβδελύξαντο — «словом праведным (святым) возгнушались» (ὅσιος — святой/праведный, 正しい; βδελύσσομαι — 忌み嫌う)."
  11: "διὰ τοῦτο ἀνθ' ὧν κατεκονδυλίζετε πτωχούς — «посему за то, что вы бьёте кулаками бедных» (κατεκονδυλίζω — бить кулаком, 拳で打つ); δῶρα ἐκλεκτὰ ἐδέξασθε παρ' αὐτῶν — «дары избранные принимали от них» (δῶρον — 贈り物; ἐκλεκτός — отборный, 選りすぐった); οἴκους ξυστοὺς ᾠκοδομήσατε — «домы тёсаные построили» (ξυστός — тёсаный, 切り石); οὐ μὴ κατοικήσητε ἐν αὐτοῖς — «не будете жить в них» (κατοικέω — 住む); ἀμπελῶνας ἐπιθυμητοὺς ἐφυτεύσατε — «виноградники вожделенные насадили» (ἐπιθυμητός — желанный, 美しい); οὐ μὴ πίητε τὸν οἶνον ἐξ αὐτῶν — «не будете пить вина из них»."
  12: "ἔγνων πολλὰς ἀσεβείας ὑμῶν — «Я узнал многие нечестия ваши» (γινώσκω — знать; ἀσέβεια — нечестие, 罪); ἰσχυραὶ αἱ ἁμαρτίαι ὑμῶν — «крепки грехи ваши» (ἰσχυρός — сильный, 重い; ἁμαρτία — 罪); καταπατοῦντες δίκαιον — «попирающие праведного» (καταπατέω — 虐げる); λαμβάνοντες ἀλλάγματα — «принимающие выкуп (взятки)» (ἀλλάγμα — выкуп/перемена, 賄賂); πένητας ἐν πύλαις ἐκκλίνοντες — «бедных в воротах совращающие» (ἐκκλίνω — отклонять, 曲げる)."
  13: "ὁ συνίων ἐν τῷ καιρῷ ἐκείνῳ σιωπήσεται — «разумный в то время умолкнет» (συνίημι — понимать, 悟りのある; σιωπάω — молчать, 黙る); ὅτι καιρὸς πονηρός ἐστιν — «ибо время злое есть» (πονηρός — злой, 悪い)."
  14: "ἐκζητήσατε τὸ καλὸν καὶ μὴ τὸ πονηρόν — «ищите доброе, а не злое» (καλός — 善; πονηρός — 悪); ὅπως ζήσητε — «чтобы вам жить» (ζάω); ἔσται οὕτως μεθ' ὑμῶν κύριος ὁ θεὸς ὁ παντοκράτωρ — «будет так с вами Господь Бог Вседержитель» (παντοκράτωρ — 全能者); ὃν τρόπον εἴπατε — «как вы сказали» (εἶπον — говорить)."
  15: "Μεμισήκαμεν τὰ πονηρὰ καὶ ἠγαπήκαμεν τὰ καλά — «возненавидели злое и возлюбили доброе» (форма 1 л. мн. ч., csl «возненавидехом»; передано императивами 憎み…愛せ — призыв пророка); ἀποκαταστήσατε ἐν πύλαις κρίμα — «восстановите в воротах суд» (ἀποκαθίστημι — восстанавливать, 立て直す; κρίμα — 裁き); ὅπως ἐλεήσῃ κύριος… τοὺς περιλοίπους τοῦ Ιωσηφ — «чтобы помиловал Господь… остаток Иосифа» (ἐλεάω — あわれむ; περίλοιποι — остаток, 残りの者)."
  16: "διὰ τοῦτο τάδε λέγει κύριος ὁ θεὸς ὁ παντοκράτωρ — «посему так говорит Господь Бог Вседержитель»; Ἐν πάσαις πλατείαις κοπετός — «на всех площадях рыдание» (πλατεῖα — 広場; κοπετός — 泣き声); ἐν πάσαις ὁδοῖς ῥηθήσεται Οὐαὶ οὐαί — «на всех дорогах будет сказано: увы, увы» (οὐαί — ああ; слова народа — 『…』); κληθήσεται γεωργὸς εἰς πένθος καὶ κοπετὸν — «призван будет земледелец на плач и рыдание» (γεωργός — 農夫; πένθος — 嘆き); εἰς εἰδότας θρῆνον — «к знающим плач» (θρῆνος — 弔いの歌)."
  17: "καὶ ἐν πάσαις ὁδοῖς κοπετός — «и на всех дорогах рыдание» (в МТ/ru «во всех виноградниках» — иное чтение, не внесено); διότι διελεύσομαι διὰ μέσου σου — «ибо Я пройду среди тебя» (διέρχομαι — проходить; διὰ μέσου — ただ中); εἶπεν κύριος — «сказал Господь»."
  18: "Οὐαὶ οἱ ἐπιθυμοῦντες τὴν ἡμέραν κυρίου — «горе желающим дня Господня» (οὐαί — わざわい; ἐπιθυμέω — желать, 望む); ἵνα τί αὕτη ὑμῖν ἡ ἡμέρα τοῦ κυρίου — «для чего вам этот день Господень» (ἵνα τί — なぜ); καὶ αὐτή ἐστιν σκότος καὶ οὐ φῶς — «и он есть тьма, а не свет» (σκότος — 闇)."
  19: "ὃν τρόπον ὅταν φύγῃ ἄνθρωπος ἐκ προσώπου τοῦ λέοντος — «как когда убежит человек от лица льва» (φεύγω — 逃げる; λέων — 獅子); ἐμπέσῃ αὐτῷ ἡ ἄρκος — «нападёт на него медведица» (ἐμπίπτω — 出会う; ἄρκος — 熊); εἰσπηδήσῃ εἰς τὸν οἶκον αὐτοῦ — «вскочит в дом свой» (εἰσπηδάω — 入る); ἀπερείσηται τὰς χεῖρας αὐτοῦ ἐπὶ τὸν τοῖχον — «опрётся руками своими о стену» (ἀπερείδομαι — опираться; τοῖχος — 壁); δάκῃ αὐτὸν ὁ ὄφις — «ужалит его змея» (δάκνω — кусать, かまれる; ὄφις — 蛇)."
  20: "οὐχὶ σκότος ἡ ἡμέρα τοῦ κυρίου καὶ οὐ φῶς — «не тьма ли день Господень, а не свет» (вопрос); γνόφος οὐκ ἔχων φέγγος αὐτῇ — «мрак, не имеющий сияния в нём» (γνόφος — 闇; φέγγος — 光)."
  21: "μεμίσηκα ἀπῶσμαι ἑορτὰς ὑμῶν — «возненавидел, отверг праздники ваши» (μισέω — 憎む; ἀπωθέω — отвергать, 退ける; ἑορτή — 祭り); οὐ μὴ ὀσφρανθῶ ἐν ταῖς πανηγύρεσιν ὑμῶν — «не буду обонять в собраниях ваших» (ὀσφραίνομαι — обонять, 香りとして受け入れない; πανήγυρις — торжественное собрание, 集い)."
  22: "διότι καὶ ἐὰν ἐνέγκητέ μοι ὁλοκαυτώματα καὶ θυσίας ὑμῶν — «ибо если принесёте Мне всесожжения и жертвы ваши» (ὁλοκαύτωμα — 燔祭; θυσία — 供え物); οὐ προσδέξομαι αὐτὰ — «не приму их» (προσδέχομαι — принимать); σωτηρίου ἐπιφανείας ὑμῶν οὐκ ἐπιβλέψομαι — «на спасительные явления ваши не призрю» (σωτήριον — спасительная (мирная) жертва; ἐπιφάνεια — явление; ἐπιβλέπω — 顧みる)."
  23: "μετάστησον ἀπ' ἐμοῦ ἦχον ᾠδῶν σου — «удали от Меня шум песней твоих» (μεθίστημι — удалять, 遠ざける; ἦχος — 騒がしさ; ᾠδή — 歌); ψαλμὸν ὀργάνων σου οὐκ ἀκούσομαι — «псалма орудий твоих не услышу» (ψαλμός — пение/псалом; ὄργανον — инструмент, 楽器)."
  24: "καὶ κυλισθήσεται ὡς ὕδωρ κρίμα — «и польётся, как вода, суд» (κυλίω — катить/течь, 流れる; κρίμα — 裁き); δικαιοσύνη ὡς χειμάρρους ἄβατος — «правда, как поток непроходимый» (χείμαρρος — 流れ; ἄβατος — непроходимый, 渡ることのできない). Здесь слово Господа (21–24) закрывается."
  25: "μὴ σφάγια καὶ θυσίας προσηνέγκατέ μοι ἐν τῇ ἐρήμῳ τεσσαράκοντα ἔτη — «разве заколения и жертвы приносили Мне в пустыне сорок лет» (σφάγιον — заколотое животное, 屠り獣; θυσία — 供え物; προσφέρω — приносить); οἶκος Ισραηλ — «дом Израилев». Вопрос предполагает отрицательный ответ; начинается новое слово Господа."
  26: "ἀνελάβετε τὴν σκηνὴν τοῦ Μολοχ — «вы приняли (несли) скинию Молоха» (ἀναλαμβάνω — брать/поднимать, 負う; σκηνή — 幕屋; Μολοχ — モロク, как Деян 7:43); τὸ ἄστρον τοῦ θεοῦ ὑμῶν Ραιφαν — «звезду бога вашего Ремфана» (ἄστρον — 星; Ραιφαν — レファン, форма Деян 7:43); τοὺς τύπους αὐτῶν, οὓς ἐποιήσατε ἑαυτοῖς — «образы их, которые вы сделали себе» (τύπος — изображение, 像)."
  27: "καὶ μετοικιῶ ὑμᾶς ἐπέκεινα Δαμασκοῦ — «и переселю вас за Дамаск» (μετοικίζω — переселять, 移す; ἐπέκεινα — за, 向こう; Δαμασκός — ダマスコ; в Деян 7:43 «в Вавилон» — иное); λέγει κύριος, ὁ θεὸς ὁ παντοκράτωρ ὄνομα αὐτῷ — «говорит Господь, Бог Вседержитель имя Ему» (παντοκράτωρ — 全能者)."
