verses:
  1: "トビトは告白[こくはく]を終[お]えた。"
  2: "トビトは、視力[しりょく]を失[うしな]ったとき八十八歳であった。そして、八年後に目[め]が見[み]えるようになった。彼[かれ]は施[ほどこ]しを行[おこな]い、主[しゅ]である神[かみ]を恐[おそ]れることを続[つづ]け、神に告白[こくはく]した。"
  3: "トビトは大[おお]いに年老[としお]いた。そして、自分[じぶん]の息子[むすこ]と、その六人の息子たちを呼[よ]んで、彼[かれ]に言[い]った。「子[こ]よ、あなたの息子たちを連[つ]れて来[き]なさい。見[み]よ、わたしは年老いた。もう命[いのち]から出[で]て行[い]こうとしている。"
  4: "子[こ]よ、メディアへ行[い]きなさい。預言者[よげんしゃ]ヨナがニネベについて語[かた]ったとおり、ニネベが滅[ほろ]ぼされることを、わたしは確[たし]かに信[しん]じている。メディアでは、しばらくの間[あいだ]は、むしろ平和[へいわ]がある。わたしたちの兄弟[きょうだい]たちは、その地[ち]にいて、良[よ]い地[ち]から散[ち]らされ、エルサレムは荒[あ]れ果[は]て、その中[なか]の神[かみ]の家[いえ]は焼[や]かれて、時[とき]が来[く]るまで荒れ果てる。"
  5: "神は再[ふたた]び彼[かれ]らをあわれみ、彼らをあの地[ち]に返[かえ]される。彼らは、以前[いぜん]のものとは違[ちが]う家[いえ]を、世[よ]の時[とき]が満[み]ちるまで建[た]てる。その後[のち]、彼らは捕囚[ほしゅう]の地[ち]から帰[かえ]って来[き]て、エルサレムを尊[とうと]く建[た]て直[なお]し、その中の神の家は、預言者[よげんしゃ]たちがそれについて語ったとおり、世々[よよ]のすべての代[よ]にわたって、栄光[えいこう]ある建[たて]物[もの]として建てられる。"
  6: "すべての国民[こくみん]は、真実[しんじつ]に主[しゅ]である神を恐[おそ]れる者[もの]となり、自分[じぶん]の偶像[ぐうぞう]を埋[う]め、すべての国民は主をほめたたえる。"
  7: "神の民[たみ]は神に告白[こくはく]し、主[しゅ]はご自分[じぶん]の民を高[たか]く挙[あ]げられる。主である神を真実[しんじつ]と正義[せいぎ]のうちに愛[あい]する者[もの]はすべて、彼[かれ]らの兄弟[きょうだい]たちにあわれみを行[おこな]いながら、喜[よろこ]ぶ。"
  8: "子[こ]よ、今[いま]、ニネベから立[た]ち去[さ]りなさい。預言者[よげんしゃ]ヨナが語[かた]ったことは必[かなら]ず起[お]こるからである。"
  9: "あなたは律法[りっぽう]と戒[いまし]めを守[まも]り、あわれみ深[ぶか]く正[ただ]しい者[もの]となりなさい。そうすれば、あなたは幸[しあわ]せになる。わたしを立派[りっぱ]に葬[ほうむ]り、あなたの母[はは]もわたしとともに葬りなさい。もうこれ以上[いじょう]、ニネベに住[す]んではならない。"
  10: "子[こ]よ、見[み]よ、アマンが、彼[かれ]を養[やしな]ったアヒカルに何[なに]をしたかを。アヒカルを光[ひかり]から闇[やみ]へ連[つ]れて行[い]き、どれほど報[むく]いたかを。アヒカルは救[すく]われ、アマンには報[むく]いが返[かえ]された。アマン自身[じしん]が闇に下[くだ]ったのである。マナセは施[ほどこ]しを行[おこな]って、自分[じぶん]に仕組[しく]まれた死[し]の罠[わな]から救われた。しかし、アマンは罠に落[お]ちて滅[ほろ]びた。"
  11: "子[こ]どもたちよ、今、施[ほどこ]しが何[なに]をするか、正義[せいぎ]が何を救[すく]うかを見[み]なさい。」こう言[い]っているとき、彼[かれ]の魂[たましい]は寝床[ねどこ]の上[うえ]で消[き]え去[さ]った。彼は百五十八歳であった。そして、彼を手厚[てあつ]く葬[ほうむ]った。"
  12: "アンナが死[し]ぬと、トビアは彼女[かのじょ]を自分[じぶん]の父[ちち]とともに葬[ほうむ]った。そして、トビアは妻[つま]と息子[むすこ]たちとともに、エクバタナへ、しゅうとであるラグエルのもとへ行[い]った。"
  13: "トビアは栄誉[えいよ]のうちに年老[としお]い、しゅうととしゅうとめを手厚[てあつ]く葬[ほうむ]り、彼[かれ]らの財産[ざいさん]と、父[ちち]トビトの財産とを相続[そうぞく]した。"
  14: "トビアはメディアのエクバタナで、百二十七歳で死[し]んだ。"
  15: "彼は死[し]ぬ前[まえ]に、ネブカドネツァルとアスエルがニネベを捕囚[ほしゅう]にした、その滅[ほろ]びを聞[き]いた。彼は死ぬ前に、ニネベのゆえに喜[よろこ]んだ。"

notes:
  1: "ἐπαύσατο ἐξομολογούμενος — «перестал исповедовать(ся)», т. е. окончил славословие (παύω, ἐξομολογέομαι). Син. «окончил славословие». Молитва гл. 13 закончена, поэтому кавычки здесь не открываются."
  2: "ἦν ἐτῶν πεντήκοντα ὀκτώ — «был лет пятидесяти восьми»: в LXX 58, в слав. и Син. «осмидесяти осми» — 88. По паритету взято церковное чтение 88 (八十八歳), вариант LXX 58 отмечен здесь. ἀπώλεσεν τὰς ὄψεις — «потерял зрение» (ὄψις). ἀνέβλεψεν — «прозрел» (ἀναβλέπω). ἐποίει ἐλεημοσύνας — имперфект: «творил милостыни» постоянно. προσέθετο φοβεῖσθαι — «приложил бояться», т. е. продолжал (προστίθημι + инф.)."
  3: "μεγάλως ἐγήρασεν — «весьма состарился» (μεγάλως — сильно). ἐκάλεσεν τὸν υἱὸν αὐτοῦ καὶ τοὺς υἱοὺς αὐτοῦ — «позвал сына своего и сыновей его»; слав. добавляет «шесть» («шесть сынов его»), в LXX числа нет — по паритету взято церковное 六人 (нет в LXX). Τέκνον — 子よ. λαβὲ τοὺς υἱούς σου — «возьми сыновей твоих». γεγήρακα — perfect «я состарился». πρὸς τὸ ἀποτρέχειν ἐκ τοῦ ζῆν εἰμι — «я при исходе из жизни» (ἀποτρέχω — убегать; слав. «при исхождении от жития есмь»)."
  4: "ἄπελθε εἰς τὴν Μηδίαν — «пойди в Мидию» (Μηδία — メディア). πέπεισμαι — perfect «я убеждён» (πείθω). ὅσα ἐλάλησεν Ιωνας ὁ προφήτης — «что сказал пророк Иона» (Ιωνας — ヨナ). καταστραφήσεται — «будет разрушена» (καταστρέφω). ἐν δὲ τῇ Μηδίᾳ ἔσται εἰρήνη μᾶλλον ἕως καιροῦ — «в Мидии будет мир скорее до времени» (μᾶλλον — скорее, более); слав. «мир паче даже до времене». οἱ ἀδελφοὶ ἡμῶν ἐν τῇ γῇ σκορπισθήσονται ἀπὸ τῆς ἀγαθῆς γῆς — «братья наши в земле рассеются из земли доброй»; оба оборота сохранены. κατακαήσεται — «сожжён будет» (κατακαίω); μέχρι χρόνου — «до времени»."
  5: "ἐλεήσει — «помилует» (ἐλεέω). ἐπιστρέψει εἰς τὴν γῆν — «возвратит в землю». οἰκοδομήσουσιν τὸν οἶκον, οὐχ οἷος ὁ πρότερος — «построят дом, не такой, как прежний». ἕως πληρωθῶσιν καιροὶ τοῦ αἰῶνος — «доколе не исполнятся времена века» (πληρόω). ἐκ τῶν αἰχμαλωσιῶν — «из пленений» (αἰχμαλωσία). ἐντίμως — «с честью, достойно». οἰκοδομῇ ἐνδόξῳ — «зданием славным» (οἰκοδομή — строение). καθὼς ἐλάλησαν οἱ προφῆται — «как говорили пророки»."
  6: "ἐπιστρέψουσιν ἀληθινῶς φοβεῖσθαι — «обратятся, чтобы истинно бояться» (ἀληθινῶς — истинно). κατορύξουσιν τὰ εἴδωλα — «закопают идолов» (κατορύσσω; εἴδωλον — 偶像). εὐλογήσουσιν πάντα τὰ ἔθνη τὸν κύριον — «благословят все народы Господа». Слав. 14:6 обрывается на «опровергнут идолы своя», а «и возблагословят вси языцы Господа» отнесено к ст. 7; по делению gr эта часть — в ст. 6."
  7: "ὁ λαὸς αὐτοῦ ἐξομολογήσεται τῷ θεῷ — «народ Его исповедует Бога» (ἐξομολογέομαι). ὑψώσει κύριος τὸν λαὸν αὐτοῦ — «возвысит Господь народ Свой». χαρήσονται — «возрадуются». ἐν ἀληθείᾳ καὶ δικαιοσύνῃ — «в истине и правде». ποιοῦντες ἔλεος — «творя милость» (ἔλεος, не ἐλεημοσύνη). Слав. 14:7 начинается с «и возблагословят вси языцы Господа» — по гр. это конец ст. 6."
  8: "ἄπελθε ἀπὸ Νινευη — «уйди из Ниневии». πάντως ἔσται — «непременно будет» (πάντως — во всяком случае). ἃ ἐλάλησεν ὁ προφήτης Ιωνας — «что сказал пророк Иона»."
  9: "τήρησον τὸν νόμον καὶ τὰ προστάγματα — «сохрани закон и повеления» (πρόσταγμα — 戒め). φιλελεήμων — «милостивый, любящий милосердие» (редкое φιλελεήμων), あわれみ深い. ἵνα σοι καλῶς ᾖ — «чтобы тебе было хорошо». θάψον με καλῶς — «похорони меня хорошо». αὐλισθῆτε — «не оставайтесь, не живите» (αὐλίζομαι — проводить ночь). Слав. относит «погреби мя добре…» к ст. 10; по делению gr это ст. 9."
  10: "ἰδὲ τί ἐποίησεν Αμαν Αχιαχάρῳ τῷ θρέψαντι αὐτόν — «смотри, что сделал Аман Ахикару, вскормившему его» (Αμαν — アマン, Αχιαχαρος — アヒカル; θρέψας — прич. аор. от τρέφω). ἐκ τοῦ φωτὸς … εἰς τὸ σκότος — «из света в тьму». ὅσα ἀνταπέδωκεν — «сколько воздал» (ἀνταποδίδωμι); ἀνταπόδομα — 報い. ἧς ἔπηξεν αὐτῷ — «которую поставил ему» (πήγνυμι — водружать); подлежащее не названо, поэтому в тексте пассив. παγὶς θανάτου — 死の罠. Манассия — マナセ (как 2 Пар 33)."
  11: "παιδία — «дети» (обращение). ἴδετε — импер. «смотрите». τί ἐλεημοσύνη ποιεῖ — «что делает милостыня»; τί δικαιοσύνη ῥύεται — «что правда избавляет» (ῥύομαι — избавлять, спасать). ἐξέλιπεν ἡ ψυχὴ ἐπὶ τῆς κλίνης — «оставила душа его на ложе» (ἐκλείπω — иссякать; κλίνη — ложе). ἑτῶν ἑκατὸν πεντήκοντα ὀκτώ — 158 лет. ἔθαψεν αὐτὸν ἐνδόξως — «похоронил его славно» (ἐνδόξως — со славою, с честью), 手厚く."
  12: "ὅτε ἀπέθανεν Αννα — «когда умерла Анна» (Αννα — アンナ). ἔθαψεν αὐτὴν μετὰ τοῦ πατρὸς αὐτοῦ — «похоронил её с отцом его», т. е. рядом с Товитом. ἀπῆλθεν Τωβιας — «отошёл Товия» (Τωβιας — トビア). εἰς Ἐκβάτανα — в Екватаны (Ἐκβάτανα — エクバタナ). Ραγουηλ ὁ πενθερός — Рагуил, тесть (しゅうと)."
  13: "ἐγήρασεν ἐντίμως — «состарился в чести» (ἐντίμως — с честью, достойно). ἔθαψεν τοὺς πενθεροὺς αὐτοῦ — «похоронил тестей своих» (Рагуил и Една; πενθερός — тесть). ἐνδόξως — «славно». ἐκληρονόμησεν τὴν οὐσίαν — «унаследовал имение» (κληρονομέω; οὐσία — имущество). καὶ Τωβιτ τοῦ πατρός — «и Товита, отца своего», т. е. и его имение."
  14: "ἐτῶν ἑκατὸν εἴκοσι ἑπτά — 127 лет. ἐν Ἐκβατάνοις τῆς Μηδίας — «в Екватанах Мидийских» (Μηδία — メディア). В слав. стоит «(сый)» — вставка, не переведена."
  15: "ἤκουσεν πρὶν ἢ ἀποθανεῖν αὐτόν — «услышал прежде, чем умереть ему» (πρίν — прежде). τὴν ἀπώλειαν Νινευη — «погибель Ниневии» (ἀπώλεια). ἣν ᾐχμαλώτισεν — «которую пленил» (αἰχμαλωτίζω — брать в плен); слав. «юже плени». Ναβουχοδονοσορ — ネブカドネツァル; Ασυηρος — アスエル. ἐχάρη … ἐπὶ Νινευη — «возрадовался о Ниневии»."
