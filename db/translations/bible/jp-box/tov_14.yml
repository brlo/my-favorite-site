# jp-box, Товит, глава 14. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для Товита нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 14: конец жизни Товита — слепота и прозрение, милостыня (2), завещание сыну
# (3–11), смерть в 158 лет (11); Анна, Товия в Екватанах, смерть Товии в 127 лет
# (12–14), падение Ниневии (15). Речь Товита — 「…」 с 3-го стиха до «…を見なさい»
# в 11-м; вложенной речи нет. Красного и синего нет.
# ВАЖНО, 14:2: в LXX «пятидесяти восьми лет» (58), в csl и ru «осмидесяти осми» (88).
# По паритету взято церковное чтение 88 (八十八歳); вариант LXX 58 — в notes 2.
# Нумерация по gr: 15 стихов; номера csl совпадают с gr, но csl 14:3 добавляет
# «шесть» (нет в LXX), csl 14:9 кончается раньше (погребение отнесено к csl 14:10),
# а конец гр. 14:6 в csl отнесён к 14:7.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 施し, 偶像, 幕屋 и пр. уже в корпусе; しゅうと/しゅうとめ — по брифу
# (πενθερός/πενθερά, как в 7:1).
# Имена — транслитерация греческого (LXX): アマン, アヒカル, マナセ, アスエル.

