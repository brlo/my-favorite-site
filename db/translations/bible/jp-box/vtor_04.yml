verses:
  1: "「そして今[いま]、イスラエルよ、わたしが今日[きょう]あなたがたに教[おし]えて行[おこな]わせる定[さだ]めと裁[さば]きを聞[き]きなさい。あなたがたが生[い]き、多[おお]くされ、入[はい]って行[い]って、あなたがたの父[ちち]たちの神[かみ]である主[しゅ]があなたがたに与[あた]えられる地[ち]を嗣業[しぎょう]として受[う]け継[つ]ぐためである。"
  2: "わたしがあなたがたに命[めい]じる言葉[ことば]に付[つ]け加[くわ]えてはならない。また、それから取[と]り除[のぞ]いてもならない。あなたがたの神[かみ]である主[しゅ]の戒[いまし]めを守[まも]りなさい。すなわち、わたしが今日[きょう]あなたがたに命[めい]じるものである。"
  3: "あなたがたの目[め]は、主[しゅ]がベエル・フェゴルになさったすべてのことを見[み]た。すなわち、ベエル・フェゴルに従[したが]って行[い]った人[ひと]はすべて、あなたがたの神[かみ]である主[しゅ]があなたがたの中[なか]から滅[ほろ]ぼされた。"
  4: "しかし、あなたがたの神[かみ]である主[しゅ]に付[つ]き従[したが]ったあなたがたは、今日[きょう]、みな生[い]きている。"
  5: "見[み]なさい、わたしは主[しゅ]がわたしに命[めい]じられたとおりに、定[さだ]めと裁[さば]きをあなたがたに教[おし]えた。あなたがたが入[はい]って行[い]って嗣業[しぎょう]として受[う]け継[つ]ぐ地[ち]で、そのとおりに行[おこな]うためである。"
  6: "あなたがたはそれを守[まも]り、行[おこな]いなさい。それが、すべての民[たみ]の前[まえ]におけるあなたがたの知恵[ちえ]と悟[さと]りである。彼[かれ]らはこれらの定[さだ]めをすべて聞[き]いて、言[い]うであろう。『見[み]よ、この大[おお]きな民[たみ]は、知恵[ちえ]ある悟[さと]りある民[たみ]である。』"
  7: "わたしたちの神[かみ]である主[しゅ]が、わたしたちが呼[よ]び求[もと]めるすべてのことにおいて近[ちか]くにおられるように、近[ちか]くに神[かみ]を持つ大[おお]きな民[たみ]が、ほかにあるだろうか。"
  8: "また、わたしが今日[きょう]あなたがたの前[まえ]に与[あた]えるこの律法[りっぽう]すべてに従[したが]って、正[ただ]しい定[さだ]めと裁[さば]きを持つ大[おお]きな民[たみ]が、ほかにあるだろうか。"
  9: "ただ、あなたは自分[じぶん]に気[き]をつけ、あなたの魂[たましい]を大[おお]いに守[まも]りなさい。あなたの目[め]が見[み]たすべての言葉[ことば]を忘[わす]れず、生[い]きている間[あいだ]のすべての日[ひ]に、それをあなたの心[こころ]から離[はな]さないように。そして、あなたの子[こ]らと、子[こ]らの子[こ]らに教[おし]えなさい。"
  10: "あなたがホレブで、あなたの神[かみ]である主[しゅ]の前[まえ]に立[た]った日[ひ]、すなわち集会[しゅうかい]の日[ひ]のことである。そのとき主[しゅ]はわたしに言[い]われた。『わたしのもとに民[たみ]を集[あつ]めなさい。わたしが彼[かれ]らにわたしの言葉[ことば]を聞[き]かせ、彼[かれ]らが地[ち]に生[い]きているすべての日[ひ]、わたしを恐[おそ]れることを学[まな]び、その子[こ]らにも教[おし]えるためである。』"
  11: "あなたがたは近[ちか]づいて山[やま]のふもとに立[た]った。山[やま]は天[てん]に至[いた]るまで火[ひ]で燃[も]え、闇[やみ]、暗黒[あんこく]、嵐[あらし]、大[おお]きな声[こえ]があった。"
  12: "主[しゅ]は火[ひ]の中[なか]からあなたがたに語[かた]られた。あなたがたは言葉[ことば]の声[こえ]を聞[き]いたが、姿[すがた]は見[み]なかった。ただ声[こえ]だけであった。"
  13: "主[しゅ]はあなたがたにご自身[じしん]の契約[けいやく]を告[つ]げ、それを行[おこな]うよう命[めい]じられた。すなわち十[じゅう]の言葉[ことば]であり、主はそれを二[ふた]つの石[いし]の板[いた]に書[か]かれた。"
  14: "また主[しゅ]はその時[とき]、わたしに命[めい]じて、定[さだ]めと裁[さば]きをあなたがたに教[おし]えさせられた。あなたがたが入[はい]って行[い]って嗣業[しぎょう]として受[う]け継[つ]ぐ地[ち]で、それを行[おこな]うためである。"
  15: "あなたがたは自分[じぶん]の魂[たましい]を大[おお]いに守[まも]りなさい。主[しゅ]がホレブで、山[やま]の上[うえ]で、火[ひ]の中[なか]からあなたがたに語[かた]られた日[ひ]、あなたがたはどんな姿[すがた]も見[み]なかったのだから。"
  16: "あなたがたは不法[ふほう]を犯[おか]して、自分[じぶん]のために、刻[きざ]んだ像[ぞう]、すなわち男[おとこ]や女[おんな]の姿[すがた]をかたどった像[ぞう]を造[つく]ってはならない。"
  17: "地[ち]の上[うえ]にいるあらゆる家畜[かちく]の姿[すがた]、天[てん]の下[した]を飛[と]ぶ翼[つばさ]のあるあらゆる鳥[とり]の姿[すがた]、"
  18: "地[ち]を這[は]うあらゆる爬[は]虫[ちゅう]の姿[すがた]、地[ち]の下[した]の水[みず]の中[なか]にいるあらゆる魚[さかな]の姿[すがた]を造[つく]ってはならない。"
  19: "また、目[め]を上[あ]げて天[てん]を見[み]、太陽[たいよう]と月[つき]と星[ほし]、天[てん]のすべての飾[かざ]りを見[み]て、惑[まど]わされ、それらにひれ伏[ふ]して仕[つか]えてはならない。あなたの神[かみ]である主[しゅ]は、それらを天[てん]の下[した]のすべての民[たみ]に割[わ]り当[あ]てられたのである。"
  20: "しかし主[しゅ]はあなたがたを取[と]り、エジプトから、鉄[てつ]の炉[ろ]から連[つ]れ出[だ]して、ご自分[じぶん]の嗣業[しぎょう]の民[たみ]とされた。今日[きょう]のとおりである。"
  21: "また主[しゅ]はあなたがたの言葉[ことば]のゆえにわたしに怒[いか]りを発[はっ]し、わたしがこのヨルダン川[がわ]を渡[わた]らず、あなたの神[かみ]である主[しゅ]があなたに割[わ]り当[あ]ての地[ち]として与[あた]えられる良[よ]い地[ち]に入[はい]らないように誓[ちか]われた。"
  22: "わたしはこの地[ち]で死[し]に、このヨルダン川[がわ]を渡[わた]らない。しかし、あなたがたは渡[わた]って、あの良[よ]い地[ち]を嗣業[しぎょう]として受[う]け継[つ]ぐであろう。"
  23: "あなたがたは気[き]をつけなさい。あなたがたの神[かみ]である主[しゅ]の契約[けいやく]を忘[わす]れ、あなたの神[かみ]である主[しゅ]が禁[きん]じられたすべてのものをかたどった刻[きざ]みの像[ぞう]を、自分[じぶん]のために造[つく]ってはならない。"
  24: "あなたの神[かみ]である主[しゅ]は、焼[や]き尽[つ]くす火[ひ]であり、ねたむ神[かみ]であるからである。"
  25: "あなたが子[こ]らを生[う]み、さらにその子[こ]らを生[う]み、長[なが]く地[ち]に住[す]むようになって、不法[ふほう]を犯[おか]し、すべてのものをかたどった刻[きざ]みの像[ぞう]を造[つく]り、あなたがたの神[かみ]である主[しゅ]の目[め]に悪[わる]を行[おこな]って主[しゅ]を怒[いか]らせたなら、"
  26: "わたしは今日[きょう]、あなたがたに対して天[てん]と地[ち]を証[しょう]人[にん]として呼[よ]ぶ。あなたがたは、渡[わた]って行[い]って嗣業[しぎょう]として受[う]け継[つ]ぐあの地[ち]から、たちまち滅[ほろ]び果[は]てるであろう。その地[ち]で長[なが]く生[い]きることはない。必[かなら]ず滅[ほろ]ぼし尽[つ]くされる。"
  27: "主[しゅ]はあなたがたをすべての民[たみ]の中[なか]に散[ち]らし、主[しゅ]があなたがたを連[つ]れて行[い]かれる民[たみ]の間[あいだ]に、あなたがたは数[かず]少[すく]なく残[のこ]される。"
  28: "あなたがたはそこで、人[ひと]の手[て]のわざである木[き]や石[いし]の、見[み]ることも聞[き]くことも食[た]べることも嗅[か]ぐこともできない他[ほか]の神々[かみがみ]に仕[つか]えるであろう。"
  29: "あなたがたはそこで、あなたがたの神[かみ]である主[しゅ]を求[もと]め、心[こころ]を尽[つ]くし、魂[たましい]を尽くして主を求[もと]めるとき、主を見[み]いだすであろう。"
  30: "あなたが苦[くる]しみの中[なか]にあり、これらのすべてのことが終[お]わりの日[ひ]にあなたに臨[のぞ]むとき、あなたはあなたの神[かみ]である主[しゅ]のもとに帰[かえ]り、その声[こえ]に聞[き]き従[したが]うであろう。"
  31: "あなたの神[かみ]である主[しゅ]は憐[あわ]れみ深[ふか]い神[かみ]であり、あなたを見捨[みす]てず、あなたを滅[ほろ]ぼさず、あなたの父[ちち]たちと結[むす]ばれ、彼[かれ]らに誓[ちか]われた契約[けいやく]を忘[わす]れられないからである。"
  32: "昔[むかし]、あなたより前[まえ]にあった日々[ひび]を尋[たず]ねなさい。神[かみ]が地[ち]の上[うえ]に人[ひと]を造[つく]られた日[ひ]から、天[てん]の端[はし]から天[てん]の端[はし]まで、このように大[おお]きなことがあったかどうか、このようなことが聞[き]かれたことがあるかどうか。"
  33: "民[たみ]が火[ひ]の中[なか]から語[かた]る生[い]ける神[かみ]の声[こえ]を聞[き]いて、あなたが聞[き]いたように、なお生[い]きていたことがあるかどうか。"
  34: "神[かみ]が、ほかの民[たみ]の中[なか]から一[ひと]つの民[たみ]を取[と]ろうとして、試[ため]みと、しるしと奇[くすし]しるしと戦[たたか]いと、強[つよ]い手[て]と高[たか]く上[あ]げられた腕[うで]と大[おお]きな恐[おそ]ろしいわざとをもって行[おこな]われたことが、ほかにあるだろうか。それは、あなたの目[め]の前[まえ]で、あなたがたの神[かみ]である主[しゅ]がエジプトでなさったすべてのとおりである。"
  35: "あなたが知[し]るためである。主[しゅ]こそ神[かみ]であり、彼[かれ]のほかに神[かみ]はないことを。"
  36: "主[しゅ]は天[てん]からあなたにその声[こえ]を聞[き]かせ、あなたを教[おし]え、地[ち]の上[うえ]であなたにその大[おお]きな火[ひ]を見[み]せ、あなたは火[ひ]の中[なか]からその言葉[ことば]を聞[き]いた。"
  37: "主[しゅ]があなたの父[ちち]たちを愛[あい]されたので、その後の子孫[ししそん]であるあなたがたを選[えら]び、ご自身[じぶん]の大[おお]きな力[ちから]によって、あなたをエジプトから連[つ]れ出[だ]された。"
  38: "あなたより大[おお]きく強[つよ]い民[たみ]をあなたの前[まえ]から追[お]い払[はら]い、あなたを導[みちび]き入[はい]れて、その地[ち]をあなたに嗣業[しぎょう]として与[あた]えるためである。今日[きょう]のとおりである。"
  39: "だから、今日[きょう]、あなたは知[し]り、心[こころ]に置[お]きなさい。上[うえ]の天[てん]でも、下[した]の地[ち]でも、主[しゅ]こそ神[かみ]であり、彼[かれ]のほかに神[かみ]はないことを。"
  40: "あなたは主[しゅ]の定[さだ]めと戒[いまし]めを守[まも]りなさい。わたしが今日[きょう]あなたに命[めい]じるものである。あなたとあなたの後[のち]の子[こ]らが幸[しあわ]せになり、あなたの神[かみ]である主[しゅ]がすべての日[ひ]にわたってあなたに与[あた]えておられる地[ち]で、長[なが]く生[い]きるためである。」"
  41: "そのとき、モーセは、ヨルダン川[がわ]の向[む]こう側[がわ]、日[ひ]の昇[のぼ]る方[ほう]に三[みっ]つの町[まち]を取[と]り分[わ]けた。"
  42: "すなわち、自分[じぶん]の隣人[りんじん]を、何[なに]も知[し]らずに殺[ころ]した者[もの]が、そこへ逃[に]げるためである。彼[かれ]を前[まえ]から憎[にく]んでいた者[もの]ではなく、これらの町[まち]の一[ひと]つに逃[に]げ込[こ]めば生[い]きることができる。"
  43: "ボソルを荒野[こうや]に、平地[へいち]の地[ち]に、ルベンに。ラモトをギレアデに、ガドに。ガウロンをバシャンに、マナセに。"
  44: "これは、モーセがイスラエルの子[こ]らの前[まえ]に置[お]いた律法[りっぽう]である。"
  45: "これらは、イスラエルの子[こ]らがエジプトの地[ち]から出[で]たとき、モーセが荒野[こうや]で彼[かれ]らに語[かた]った証[あかし]と定[さだ]めと裁[さば]きである。"
  46: "ヨルダン川[がわ]の向[む]こう側[がわ]、フォゴルの家[いえ]に面[めん]した谷[たに]、エセボンに住[す]んでいたアモリ人[じん]の王[おう]シホンの地[ち]で。モーセとイスラエルの子[こ]らがエジプトの地[ち]から出[で]たとき、彼[かれ]を打[う]ったのである。"
  47: "彼[かれ]らは彼[かれ]の地[ち]と、バシャンの王[おう]オグの地[ち]、ヨルダン川[がわ]の向[む]こう側[がわ]、日[ひ]の昇[のぼ]る方[ほう]にいるアモリ人[じん]の二人[ふたり]の王[おう]の地[ち]を嗣業[しぎょう]として受[う]け継[つ]いだ。"
  48: "アルノン川[がわ]の岸[きし]にあるアロエルから、シホンという名[な]の山[やま]、すなわちヘルモンまで。"
  49: "また、ヨルダン川[がわ]の向[む]こう側[がわ]、日[ひ]の昇[のぼ]る方[ほう]のアラバすべてを、アシドトの下[した]の削[けず]られた岩[いわ]まで。"

notes:
  1: "καὶ νῦν, Ισραηλ — «и ныне, Израиль» (обращение к народу в ед. ч.). ἄκουε τῶν δικαιωμάτων καὶ τῶν κριμάτων — «слушай оправдания и суды» (定め и 裁き). ὅσα ἐγὼ διδάσκω ὑμᾶς σήμερον ποιεῖν — «чему я учу вас ныне исполнять». ἵνα ζῆτε καὶ πολυπλασιασθῆτε — «чтобы вы жили и умножились» (πολυπλασιάζω). εἰσελθόντες κληρονομήσητε — «войдя, наследуйте»."
  2: "οὐ προσθήσετε πρὸς τὸ ῥῆμα … καὶ οὐκ ἀφελεῖτε ἀπ᾿ αὐτοῦ — «не прибавите к слову … и не отнимете от него» (προστίθημι, ἀφαιρέω; слав. «не приложите… ниже да отимете»). φυλάσσεσθε τὰς ἐντολάς — «храните заповеди» (ἐντολή — 戒め)."
  3: "οἱ ὀφθαλμοὶ ὑμῶν ἑωράκασιν — «очи ваши видели» (перфект). τῷ Βεελφεγωρ — «с Ваал-Фегором» (датив при ἐποίησεν); передано ベエル・フェゴル. ὅστις ἐπορεύθη ὀπίσω Βεελφεγωρ — «кто пошёл вслед Ваал-Фегора». ἐξέτριψεν αὐτὸν … ἐξ ὑμῶν — «истребил его из вас» (ἐκτρίβω)."
  4: "οἱ προσκείμενοι κυρίῳ τῷ θεῷ ὑμῶν — «прилепившиеся к Господу, Богу вашему» (πρόσκειμαι; ср. 1:36). ζῆτε πάντες ἐν τῇ σήμερον — «живы все до сего дня» (ἐν τῇ σήμερον — «в нынешнем дне»)."
  5: "ἴδετε δέδειχα ὑμῖν — «вот, я показал вам» (δείκνυμι, перфект). καθὰ ἐνετείλατό μοι κύριος — «как заповедал мне Господь». εἰς ἣν ὑμεῖς εἰσπορεύεσθε ἐκεῖ κληρονομεῖν αὐτήν — «в которую вы входите там, чтобы наследовать её» (плеоназм ἐκεῖ в LXX сохранён по смыслу: 入って行って)."
  6: "φυλάξεσθε καὶ ποιήσετε — «сохраните и сделаете». αὕτη ἡ σοφία ὑμῶν καὶ ἡ σύνεσις — «сия премудрость ваша и разумение» (σοφία, σύνεσις). ἐναντίον πάντων τῶν ἐθνῶν — «пред всеми народами». λαὸς σοφὸς καὶ ἐπιστήμων — «народ мудрый и сведущий». Слова народов — 『…』 как вложенная речь."
  7: "ποῖον ἔθνος μέγα — «какой народ великий». ᾧ ἐστιν αὐτῷ θεὸς ἐγγίζων αὐτῷ — «у которого есть Бог приближающийся к нему» (ἐγγίζω). ἐν πᾶσιν, οἷς ἐὰν αὐτὸν ἐπικαλεσώμεθα — «во всём, в чём призовём Его» (ἐπικαλέομαι). Стих-вопрос без глагола в конце, как в LXX."
  8: "δικαιώματα καὶ κρίματα δίκαια — «оправдания и суды праведные». κατὰ πάντα τὸν νόμον τοῦτον — «по всему закону сему» (律法). ὃν ἐγὼ δίδωμι ἐνώπιον ὑμῶν σήμερον — «который я даю пред вами ныне»."
  9: "πρόσεχε σεαυτῷ — «внемли себе» (προσέχω с дативом). φύλαξον τὴν ψυχήν σου σφόδρα — «храни душу твою весьма». μὴ ἐπιλάθῃ — «не забудь» (ἐπιλανθάνομαι). μὴ ἀποστήτωσαν ἀπὸ τῆς καρδίας σου — «да не отступят от сердца твоего». συμβιβάσεις τοὺς υἱούς σου — «наставишь сынов твоих» (συμβιβάζω — «сводить вместе, научать»); стих обрывается на этом слове, продолжение — в ст. 10."
  10: "ἡμέραν, ἣν ἔστητε — «день, в который вы стояли» (винитив как продолжение ст. 9). ἐν Χωρηβ τῇ ἡμέρᾳ τῆς ἐκκλησίας — «на Хориве в день собрания» (ἐκκλησία). Ἐκκλησίασον — «собери» (ἐκκλησιάζω). ὅπως μάθωσιν φοβεῖσθαί με — «чтобы научились бояться Меня». διδάξωσιν — «научат» (διδάσκω). Слова Бога — 『…』."
  11: "προσήλθετε καὶ ἔστητε ὑπὸ τὸ ὄρος — «приступили и стали под горою». ἐκαίετο πυρὶ ἕως τοῦ οὐρανοῦ — «горела огнём до неба» (καίω). σκότος, γνόφος, θύελλα — «тьма, мрак, буря» (γνόφος — «густая тьма»). φωνὴ μεγάλη — «глас великий»: в слав. этого члена нет, в gr-lxx-byz он есть, поэтому внесён (大きな声)."
  12: "ἐκ μέσου τοῦ πυρός — «из среды огня». φωνὴν ῥημάτων ὑμεῖς ἠκούσατε — «глас слов вы слышали» (ῥῆμα). ὁμοίωμα οὐκ εἴδετε, ἀλλ᾿ ἢ φωνήν — «образа не видели, а только глас» (ἀλλ᾿ ἤ — «кроме как»; ὁμοίωμα — «подобие, образ»)."
  13: "ἀνήγγειλεν ὑμῖν τὴν διαθήκην αὐτοῦ — «возвестил вам завет Свой» (διαθήκη — 契約). τὰ δέκα ῥήματα — «десять слов» (十の言葉; сноска не нужна — прозрачно). ἔγραψεν αὐτὰ ἐπὶ δύο πλάκας λιθίνας — «написал их на двух досках каменных» (πλάξ — 板)."
  14: "ἐμοὶ ἐνετείλατο κύριος … διδάξαι ὑμᾶς — «мне заповедал Господь научить вас». ποιεῖν αὐτὰ ὑμᾶς — «исполнять их вам». εἰς ἣν ὑμεῖς εἰσπορεύεσθε ἐκεῖ — повтор из ст. 5, как в LXX."
  15: "φυλάξεσθε σφόδρα τὰς ψυχὰς ὑμῶν — «храните весьма души ваши». οὐκ εἴδετε ὁμοίωμα — «не видели образа». ἐν τῇ ἡμέρᾳ, ᾗ ἐλάλησεν κύριος πρὸς ὑμᾶς — «в день, в который говорил Господь к вам». ἐκ μέσου τοῦ πυρός — «из среды огня»."
  16: "μὴ ἀνομήσητε — «не беззаконнуйте» (ἀνομέω). γλυπτὸν ὁμοίωμα — «изваянное подобие» (γλυπτός — «резной, изваянный»). πᾶσαν εἰκόνα — «всякий образ» (εἰκών). ἀρσενικοῦ ἢ θηλυκοῦ — «мужского или женского»."
  17: "ὁμοίωμα παντὸς κτήνους τῶν ὄντων ἐπὶ τῆς γῆς — «подобие всякого скота, сущего на земле». ὀρνέου πτερωτοῦ — «птицы пернатой» (πτερωτός). ὃ πέταται ὑπὸ τὸν οὐρανόν — «которая летает под небом» (πέτομαι)."
  18: "ἑρπετοῦ, ὃ ἕρπει ἐπὶ τῆς γῆς — «пресмыкающегося, что ползает по земле» (ἕρπω). ἰχθύος, ὅσα ἐστὶν ἐν τοῖς ὕδασιν ὑποκάτω τῆς γῆς — «рыбы, сколько есть в водах под землёю»."
  19: "μὴ ἀναβλέψας εἰς τὸν οὐρανὸν καὶ ἰδών — «не воззрев на небо и увидев» (ἀναβλέπω). τὸν ἥλιον καὶ τὴν σελήνην καὶ τοὺς ἀστέρας — «солнце, луну и звёзды». πάντα τὸν κόσμον τοῦ οὐρανοῦ — «весь мир (убранство) небесный» (κόσμος здесь — «украшение, воинство»). πλανηθεὶς προσκυνήσῃς αὐτοῖς — «прельстившись, поклонишься им» (πλανάω). ἃ ἀπένειμεν κύριος — «что уделил Господь» (ἀπονέμω)."
  20: "ἐκ τῆς καμίνου τῆς σιδηρᾶς — «из печи железной» (κάμινος). ἐξ Αἰγύπτου — «из Египта». εἶναι αὐτῷ λαὸν ἔγκληρον — «быть Ему народом удела» (ἔγκληρος — «получивший удел», редкое слово LXX). ὡς ἐν τῇ ἡμέρᾳ ταύτῃ — «как в день сей»."
  21: "ἐθυμώθη μοι — «разгневался на меня» (θυμόω). περὶ τῶν λεγομένων ὑφ᾿ ὑμῶν — «из-за сказанного вами». ὤμοσεν ἵνα μὴ διαβῶ — «поклялся, что я не перейду» (ἵνα после клятвы). ἐν κλήρῳ — «в удел»."
  22: "ἀποθνῄσκω ἐν τῇ γῇ ταύτῃ — «умираю в земле сей» (настоящее время — близость смерти). οὐ διαβαίνω τὸν Ιορδάνην τοῦτον — «не перехожу Иордана сего». ὑμεῖς δὲ διαβαίνετε — «вы же переходите». κληρονομήσετε τὴν γῆν τὴν ἀγαθήν — «наследуете землю благую»."
  23: "προσέχετε ὑμεῖς — «внемлите вы» (эмфатическое ὑμεῖς). μὴ ἐπιλάθησθε τὴν διαθήκην — «не забудьте завета». ἣν διέθετο πρὸς ὑμᾶς — «который Он поставил с вами» (διατίθεμαι). ὧν συνέταξεν κύριος — «что повелел Господь» (συντάσσω)."
  24: "πῦρ καταναλίσκον — «огонь поядающий» (καταναλίσκω — «пожирать»; слав. «огнь потребляяй»). θεὸς ζηλωτής — «Бог ревнитель» (ζηλωτής); передано ねたむ神."
  25: "ἐὰν γεννήσῃς υἱοὺς καὶ υἱοὺς τῶν υἱῶν σου — «если родишь сынов и сынов сынов твоих». χρονίσητε ἐπὶ τῆς γῆς — «проживёте долго на земле» (χρονίζω). ἀνομήσητε — «беззаконнуете». παροργίσαι αὐτόν — «раздражить Его» (παροργίζω). Стих-протасис, аподосис — в ст. 26."
  26: "διαμαρτύρομαι ὑμῖν σήμερον τόν τε οὐρανὸν καὶ τὴν γῆν — «свидетельствуюсь вам ныне небом и землёю» (διαμαρτύρομαι). ἀπωλείᾳ ἀπολεῖσθε — «погибелью погибнете» (усиление через однокоренное). οὐχὶ πολυχρονιεῖτε — «не пробудете долго» (πολυχρονίζω). ἐκτριβῇ ἐκτριβήσεσθε — «истреблением истреблены будете» (ἐκτρίβω)."
  27: "διασπερεῖ κύριος ὑμᾶς — «рассеет вас Господь» (διασπείρω). καταλειφθήσεσθε ὀλίγοι ἀριθμῷ — «останетесь немногие числом» (ἀριθμός). εἰς οὓς εἰσάξει κύριος ὑμᾶς ἐκεῖ — «куда введёт вас Господь» (εἰσάγω)."
  28: "λατρεύσετε ἐκεῖ θεοῖς ἑτέροις — «будете служить там иным богам» (λατρεύω). ἔργοις χειρῶν ἀνθρώπων — «делам рук человеческих». ξύλοις καὶ λίθοις — «дереву и камню». οἳ οὐκ ὄψονται οὐδὲ μὴ ἀκούσωσιν οὔτε μὴ φάγωσιν οὔτε μὴ ὀσφρανθῶσιν — четыре отрицания: не видят, не слышат, не едят, не обоняют (ὀσφραίνομαι); сохранены все."
  29: "ζητήσετε … καὶ εὑρήσετε — «взыщете и найдёте» (ζητέω, εὑρίσκω). ὅταν ἐκζητήσητε αὐτὸν ἐξ ὅλης τῆς καρδίας σου καὶ ἐξ ὅλης τῆς ψυχῆς σου — «когда взыщете Его всем сердцем и всею душею» (ἐκζητέω). ἐν τῇ θλίψει σου — «в скорби твоей» (θλῖψις); в LXX стоит в конце стиха, как и передано."
  30: "εὑρήσουσίν σε πάντες οἱ λόγοι οὗτοι — «постигнут тебя все слова сии» (εὑρίσκω здесь «настигать»; слав. «постигнут тя»). ἐπ᾿ ἐσχάτῳ τῶν ἡμερῶν — «в последние дни». ἐπιστραφήσῃ πρὸς κύριον — «обратишься к Господу». εἰσακούσῃ τῆς φωνῆς αὐτοῦ — «послушаешь гласа Его»."
  31: "θεὸς οἰκτίρμων — «Бог милостивый» (οἰκτίρμων). οὐκ ἐγκαταλείψει … οὐδὲ μὴ ἐκτρίψει — «не оставит и не погубит» (ἐγκαταλείπω, ἐκτρίβω). οὐκ ἐπιλήσεται τὴν διαθήκην τῶν πατέρων σου — «не забудет завета отцов твоих». ἣν ὤμοσεν αὐτοῖς — «который клятвою утвердил им»."
  32: "ἐπερωτήσατε ἡμέρας προτέρας — «спросите о днях прежних» (ἐπερωτάω). ἀπὸ τῆς ἡμέρας, ἧς ἔκτισεν ὁ θεὸς ἄνθρωπον — «от дня, в который создал Бог человека» (κτίζω). ἐπὶ τὸ ἄκρον τοῦ οὐρανοῦ ἕως ἄκρου τοῦ οὐρανοῦ — «от края неба до края неба». εἰ γέγονεν κατὰ τὸ ῥῆμα τὸ μέγα τοῦτο — «бывало ли по слову великому сему»."
  33: "εἰ ἀκήκοεν ἔθνος φωνὴν θεοῦ ζῶντος — «слышал ли народ глас Бога живого» (ἀκούω, perfect). λαλοῦντος ἐκ μέσου τοῦ πυρός — «говорящего из среды огня». ὃν τρόπον ἀκήκοας σὺ καὶ ἔζησας — «как ты слышал и остался жив»."
  34: "εἰ ἐπείρασεν ὁ θεὸς εἰσελθὼν λαβεῖν ἑαυτῷ ἔθνος ἐκ μέσου ἔθνους — «покушался ли Бог, войдя, взять Себе народ из среды народа» (πειράζω). ἐν πειρασμῷ καὶ ἐν σημείοις καὶ ἐν τέρασιν — «искушениями, знамениями и чудесами» (πειρασμός, σημεῖον, τέρας). ἐν πολέμῳ — «войною». ἐν χειρὶ κραταιᾷ καὶ ἐν βραχίονι ὑψηλῷ — «рукою крепкою и мышцею высокою». ἐν ὁράμασιν μεγάλοις — «видениями великими» (ὅραμα). ἐνώπιόν σου βλέποντος — «пред очами твоими видящего»."
  35: "ὥστε εἰδῆσαί σε — «чтобы ты знал» (ὥστε с инфинитивом). οὗτος θεός ἐστιν — «Он есть Бог». οὐκ ἔστιν ἔτι πλὴν αὐτοῦ — «нет ещё кроме Него»."
  36: "ἀκουστὴ ἐγένετο ἡ φωνὴ αὐτοῦ — «слышимым стал глас Его» (ἀκουστός). παιδεῦσαί σε — «чтобы научить тебя» (παιδεύω). τὸ πῦρ αὐτοῦ τὸ μέγα — «огонь Его великий». τὰ ῥήματα αὐτοῦ ἤκουσας — «слова Его ты слышал»."
  37: "διὰ τὸ ἀγαπῆσαι αὐτὸν τοὺς πατέρας σου — «за то, что Он возлюбил отцов твоих» (артикль с инфинитивом). ἐξελέξατο τὸ σπέρμα αὐτῶν μετ᾿ αὐτοὺς ὑμᾶς — «избрал семя их после них — вас». ἐξήγαγέν σε αὐτὸς ἐν τῇ ἰσχύι αὐτοῦ τῇ μεγάλῃ — «вывел тебя Сам силою Своею великою»."
  38: "ἐξολεθρεῦσαι ἔθνη μεγάλα καὶ ἰσχυρότερά σου — «истребить народы великие и сильнейшие тебя» (ἐξολεθρεύω). εἰσαγαγεῖν σε δοῦναί σοι τὴν γῆν αὐτῶν — «ввести тебя, дать тебе землю их». καθὼς ἔχεις σήμερον — «как имеешь сегодня»."
  39: "γνώσῃ σήμερον καὶ ἐπιστραφήσῃ τῇ διανοίᾳ — «узнаешь ныне и обратишься умом» (διάνοια — «мысль, разумение»; слав. «обратишися умом»). ἐν τῷ οὐρανῷ ἄνω καὶ ἐπὶ τῆς γῆς κάτω — «на небе вверху и на земле внизу». οὐκ ἔστιν ἔτι πλὴν αὐτοῦ — «нет ещё кроме Него» (повтор из ст. 35)."
  40: "φυλάξῃ τὰ δικαιώματα αὐτοῦ καὶ τὰς ἐντολὰς αὐτοῦ — «сохранишь оправдания Его и заповеди Его». ἵνα εὖ σοι γένηται — «чтобы хорошо было тебе». μακροήμεροι γένησθε — «долголетни будете» (μακροήμερος). ἧς δίδωσίν σοι πάσας τὰς ἡμέρας — «которую даёт тебе во все дни». Конец речи Моисея."
  41: "ἀφώρισεν — «отделил» (ἀφορίζω). πέραν τοῦ Ιορδάνου ἀπὸ ἀνατολῶν ἡλίου — «за Иорданом, от востока солнца». С этого стиха — повествование о Моисее в третьем лице, кавычки закрыты в ст. 40."
  42: "φυγεῖν ἐκεῖ τὸν φονευτήν — «убегать туда убийце» (φονευτής; φεύγω). ὃς ἂν φονεύσῃ τὸν πλησίον οὐκ εἰδώς — «кто убьёт ближнего не зная» (φονεύω). οὐ μισῶν αὐτὸν πρὸ τῆς ἐχθὲς καὶ τρίτης — «не ненавидя его прежде вчера и третьего дня» (устойчивое выражение: «ни вчера, ни третьего дня», т. е. не был врагом). καταφεύξεται … καὶ ζήσεται — «прибежит и будет жить» (καταφεύγω)."
  43: "τὴν Βοσορ ἐν τῇ ἐρήμῳ ἐν τῇ γῇ τῇ πεδινῇ τῷ Ρουβην — «Босор в пустыне, в земле равнинной, Рувиму» (у Синодального «Бецер» — евр. имя). Ραμωθ ἐν Γαλααδ τῷ Γαδδι — «Рамоф в Галааде Гаду» (форма Γαδδι — «Гаддитянину»). Γαυλων ἐν Βασαν τῷ Μανασση — «Гавлон в Васане Манассии» (у Синодального «Голан»)."
  44: "Οὗτος ὁ νόμος, ὃν παρέθετο Μωϋσῆς — «сей закон, который предложил Моисей» (παρατίθημι — «предлагать»). ἐνώπιον υἱῶν Ισραηλ — «пред сынами Израиля». Новый вводный заголовок, как в 1:5."
  45: "τὰ μαρτύρια καὶ τὰ δικαιώματα καὶ τὰ κρίματα — «свидетельства, оправдания и суды» (μαρτύριον — 証). ὅσα ἐλάλησεν Μωϋσῆς — «что изрёк Моисей». ἐξελθόντων αὐτῶν ἐκ γῆς Αἰγύπτου — «по выходе их из земли Египетской» (родительный самостоятельный)."
  46: "ἐν τῷ πέραν τοῦ Ιορδάνου ἐν φάραγγι ἐγγὺς οἴκου Φογωρ — «за Иорданом, в долине близ дома Фогора» (Беф-Фегор; ср. 3:29). ὃς κατῴκει ἐν Εσεβων — «который жил в Есевоне». οὓς ἐπάταξεν Μωϋσῆς — «которых поразил Моисей» (винитив мн. ч. в LXX при одном Сигоне — согласование по смыслу с «сынами Аморрейскими»)."
  47: "ἐκληρονόμησαν τὴν γῆν αὐτοῦ — «получили в удел землю его». δύο βασιλέων τῶν Αμορραίων — «двух царей Аморрейских». οἳ ἦσαν πέραν τοῦ Ιορδάνου κατ᾿ ἀνατολὰς ἡλίου — «которые были за Иорданом к востоку солнца»."
  48: "ἀπὸ Αροηρ … ἐπὶ τοῦ ὄρους τοῦ Σηων, ὅ ἐστιν Αερμων — «от Ароера … до горы Сиона (Сихона), она же Ермон»; в LXX стоит Σηων (у Синодального «Сион», вероятно, имеется в виду Сирион, ср. 3:9), поэтому シホンという名の山 с пояснением «то есть Хермон»."
  49: "πᾶσαν τὴν Αραβα — «всю Араву». πέραν τοῦ Ιορδάνου κατ᾿ ἀνατολὰς ἡλίου — «за Иорданом к востоку солнца». ὑπὸ Ασηδωθ τὴν λαξευτήν — «под Асидофом, изсечённым» (λαξευτός — «высеченный в скале»; слав. «под асидофом тесаным», у Синодального «при подошве Фасги»); ср. 3:27, где Λελαξευμένου."
