# jp-box, Второзаконие, глава 4. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в этой главе нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 4: увещание слушать заповеди и не прибавлять к ним (1–8), Хорив,
# глас из огня и запрет изображений (9–20), гнев Господа на Моисея (21–24),
# плен, рассеяние и помилование (25–31), Господь един и нет иного (32–40),
# три города убежища (41–43), второй вводный заголовок закона (44–49).
# Нумерация совпадает с csl-ru и ru: 49 стихов.
# Кавычки: речь Моисея — 「…」 (1–40); слова Бога внутри неё — 『…』 (10).
# С 41-го стиха — повествование о Моисее в третьем лице, без кавычек.
# Красного нет.
# 〔…〕 нет: все слова есть в gr-lxx-byz. Отличия церковного чтения не внесены:
# 4:11 в слав. нет последнего члена φωνὴ μεγάλη (он есть в греч. и внесён);
# 4:43 LXX Βοσορ и Γαυλων, у Синодального «Бецер» и «Голан»; 4:48 LXX Σηων,
# у Синодального «Сион» — см. notes. Проверено bracket_check.rb.
# Сносок ⟨…⟩ нет: 十の言葉 прозрачно, 契約, 律法, 嗣業, 寄留者, 避難の町
# уже в корпусе.
# jp-ni не использовался.

