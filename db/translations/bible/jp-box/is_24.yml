# jp-box, Исаия, глава 24. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для главы отсутствует; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 24: 1–3 опустошение земли и уравнение всех сословий; 4–6 плач земли, нарушенный
# вечный завет; 7–12 вино, тимпаны и опустевший город; 13–16 остаток, песнь с края земли
# и «горе» отступникам; 17–20 ужас, яма, петля, падение земли; 21–23 суд над небесным
# воинством и царями, воцарение Господа на Сионе.
# Прямая речь: песнь остатка — 24:16; слова «скажут» — 24:16. Речи Господа нет.
# Нумерация по gr: 23 стиха; деление совпадает с csl-ru и ru по числу, но слав. 24:15/16
# иначе относит звательное «Господи, Боже Израилев» (в LXX конец 24:15).
# Слав. 24:21 добавляет «в тот день», 24:23 — «устыдится луна и посрамится солнце»
# (в LXX этих слов нет); внесено в основной текст без 〔…〕 по паритету.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).

