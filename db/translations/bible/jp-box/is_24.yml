verses:
  1: "見[み]よ、主[しゅ]は世界[せかい]を朽[く]ちさせ、これを荒[あ]らし、その面[おもて]をむき出[だ]しにし、その中[なか]に住[す]む者[もの]を散[ち]らす。"
  2: "民[たみ]は祭司[さいし]のように、僕[しもべ]は主人[しゅじん]のように、女中[じょちゅう]は女主人[おんなあるじ]のようになる。買[か]う者は売[う]る者のように、貸[か]す者は借[か]りる者のように、負[お]い目[め]のある者はその負い目を負[お]わせている者のようになる。"
  3: "地[ち]は朽[く]ちて朽ち果[は]て、地は奪[うば]われて奪い尽[つ]くされる。主[しゅ]の口[くち]がこれを語[かた]ったからである。"
  4: "地[ち]は嘆[なげ]き、世界[せかい]は朽ち、地の高[たか]い者[もの]たちは嘆いた。"
  5: "地[ち]はその上[うえ]に住[す]む者[もの]たちのゆえに不法[ふほう]を行[おこな]った。彼[かれ]らは律法[りっぽう]を犯[おか]し、掟[おきて]を変[か]え、永遠[えいえん]の契約[けいやく]を破[やぶ]ったからである。"
  6: "それゆえ、呪[のろ]いが地[ち]を食[く]らう。その上に住[す]む者[もの]たちが罪[つみ]を犯[おか]したからである。それゆえ、地に住む者たちは貧[まず]しくなり、人[ひと]は少[すく]なく残[のこ]される。"
  7: "ぶどう酒[しゅ]は嘆[なげ]き、ぶどうの木[き]は嘆く。心[こころ]を喜[よろこ]ばせる者[もの]たちはみな呻[うめ]く。"
  8: "太鼓[たいこ]の喜[よろこ]びはやみ、不遜[ふそん]と不敬虔[ふけいけん]な者[もの]の富[とみ]はやみ、琴[こと]の音[ね]はやんだ。"
  9: "彼[かれ]らは恥[は]じ、ぶどう酒を飲[の]まなかった。強[つよ]い酒[さけ]は飲む者たちにとって苦[にが]くなった。"
  10: "すべての町[まち]は荒[あ]れ果[は]て、家[いえ]は戸[と]を閉[と]ざして、だれも入[はい]れない。"
  11: "ぶどう酒[しゅ]のことを、至[いた]る所[ところ]で泣[な]き叫[さけ]べ。地[ち]のすべての喜[よろこ]びはやんだ。"
  12: "町[まち]々は荒[あ]れ果[は]てて残[のこ]され、家[いえ]々は見捨[みす]てられて滅[ほろ]びる。"
  13: "これらすべては地[ち]の上[うえ]、諸国民[しょこくみん]の中[なか]で起[お]こる。オリーブを打[う]ち落[お]とすときのように、ぶどうの収穫[しゅうかく]が終[お]わったときのように、彼[かれ]らは打ち落とされる。"
  14: "彼[かれ]らは声[こえ]を上[あ]げて叫[さけ]ぶ。地[ち]に残[のこ]された者[もの]たちは、主[しゅ]の栄光[えいこう]とともに喜[よろこ]ぶ。海[うみ]の水[みず]は騒[さわ]ぐ。"
  15: "それゆえ、主[しゅ]の栄光[えいこう]は海[うみ]の島[しま]々にあり、主の名[な]はほめたたえられる。主[しゅ]よ、イスラエルの神[かみ]よ。"
  16: "地[ち]の端[はし]から、わたしたちは不思議[ふしぎ]なことを聞[き]いた。「敬虔[けいけん]な者[もの]には希望[きぼう]がある。」そして彼[かれ]らは言[い]う。「災[わざわ]いだ、捨[す]てる者[もの]たちは。律法[りっぽう]を捨てる者たちは。」"
  17: "恐[おそ]れと落[お]とし穴[あな]と罠[わな]が、地[ち]に住[す]むあなたがたを襲[おそ]う。"
  18: "恐[おそ]れから逃[に]げる者[もの]は落[お]とし穴[あな]に落[お]ち、穴から出[で]る者は罠[わな]にかかる。天[てん]の窓[まど]が開[ひら]かれ、地[ち]の基[もとい]が揺[ゆ]れるからである。"
  19: "地[ち]は揺[ゆ]れに揺れ、地は衰[おとろ]えに衰える。"
  20: "地[ち]は傾[かたむ]き、果樹園[かじゅえん]の見張[みは]り小屋[ごや]のように、また酔[よ]ってふらつく者のように揺[ゆ]れる。その不法[ふほう]が重[おも]くのしかかり、地は倒[たお]れて、もはや起[お]き上[あ]がれない。"
  21: "その日[ひ]、主[しゅ]は天[てん]の軍勢[ぐんぜい]と地[ち]の王[おう]たちに手[て]を伸[の]べる。"
  22: "彼[かれ]らは集[あつ]められ、砦[とりで]と牢獄[ろうごく]に閉[と]じ込[こ]められる。多[おお]くの世代[せだい]の後[のち]、彼らは顧[かえり]みられる。"
  23: "れんがは溶[と]け、城壁[じょうへき]は倒[たお]れる。月[つき]は恥[は]じ、太陽[たいよう]は辱[はずかし]められる。主[しゅ]はシオンとエルサレムに王[おう]として君臨[くんりん]し、長老[ちょうろう]たちの前[まえ]で栄光[えいこう]を受[う]けられるからである。"

notes:
  1: "Ἰδοὺ κύριος καταφθείρει τὴν οἰκουμένην — «вот, Господь губит вселенную» (καταφθείρω — разорять, губить); ἐρημώσει αὐτήν — «опустошит её». ἀνακαλύψει τὸ πρόσωπον αὐτῆς — «откроет лицо её», т. е. обнажит, лишит покрова; διασπερεῖ τοὺς ἐνοικοῦντας ἐν αὐτῇ — «рассеет живущих на ней» (διασπείρω — рассеивать). Надписания у главы нет."
  2: "ὁ λαὸς ὡς ὁ ἱερεύς — «народ как священник» (ἱερεύς); ὁ παῖς ὡς ὁ κύριος — «раб как господин»; ἡ θεράπαινα ὡς ἡ κυρία — «служанка как госпожа» (θεράπαινα, κυρία). ὁ ἀγοράζων ὡς ὁ πωλῶν — «покупающий как продающий»; ὁ δανείζων ὡς ὁ δανειζόμενος — «дающий в долг как берущий»; ὁ ὀφείλων ὡς ᾧ ὀφείλει — «должник как тот, кому он должен». Шесть пар сохранены."
  3: "φθορᾷ φθαρήσεται — «тлением истлеет» (датив cognatus от φθείρω); προνομῇ προνομευθήσεται — «расхищением расхищена будет» (προνομεύω — разграблять). τὸ γὰρ στόμα κυρίου ἐλάλησεν ταῦτα — «ибо уста Господа сказали это»; слав. «уста бо Господня глаголаша сия». Фигура повторения сохранена."
  4: "ἐπένθησεν ἡ γῆ — «восплакала земля» (πενθέω — плакать, скорбеть); ἐφθάρη ἡ οἰκουμένη — «растленна вселенная»; ἐπένθησαν οἱ ὑψηλοὶ τῆς γῆς — «восплакали высокие земли»; слав. «высоцыи земли». ru/МТ говорят о «поникших возвышавшихся над народом», в LXX — «высокие земли»."
  5: "ἡ δὲ γῆ ἠνόμησεν διὰ τοὺς κατοικοῦντας αὐτήν — «земля беззаконствовала из-за живущих на ней» (ἀνομέω); παρέβησαν τὸν νόμον — «преступили закон»; ἤλλαξαν τὰ προστάγματα — «изменили заповеди» (πρόσταγμα — повеление, устав); διαθήκην αἰώνιον — «завет вечный» (винительный при том же сказуемом). Слав. добавляет «разрушиша»; в тексте «破った»."
  6: "ἀρὰ ἔδεται τὴν γῆν — «проклятие поедает землю» (ἀρά — проклятие; ἐσθίω — есть); ὅτι ἡμάρτοσαν οἱ κατοικοῦντες αὐτήν — «ибо согрешили живущие на ней». πτωχοὶ ἔσονται οἱ ἐνοικοῦντες — «нищими будут живущие» (πτωχός — нищий); ru/МТ говорят «сожжены», в LXX и слав. — «убози/нищие». καταλειφθήσονται ἄνθρωποι ὀλίγοι — «останется людей мало»."
  7: "πενθήσει οἶνος, πενθήσει ἄμπελος — «восплачет вино, восплачет виноград» (ἄμπελος — виноградная лоза); στενάξουσιν πάντες οἱ εὐφραινόμενοι τὴν ψυχήν — «возстенут все веселящиеся душою» (στενάζω — стенать; εὐφραίνω — веселить). Олицетворение вина и лозы сохранено."
  8: "πέπαυται εὐφροσύνη τυμπάνων — «прекратилось веселие тимпанов» (τύμπανον — тимпан, бубен); πέπαυται αὐθάδεια καὶ πλοῦτος ἀσεβῶν — «прекратилась дерзость и богатство нечестивых»: этих слов нет в МТ, но они есть в LXX и слав. («преста высокодерзость и богатство нечестивых»). πέπαυται φωνὴ κιθάρας — «прекратился голос кифары»."
  9: "ᾐσχύνθησαν, οὐκ ἔπιον οἶνον — «устыдились, не пили вина»; πικρὸν ἐγένετο τὸ σικερα τοῖς πίνουσιν — «горькой стала сикера пьющим» (σίκερα — хмельной напиток, сикера; слав. «сикера»); передано «強い酒», потому что слово незнакомо вне библейского контекста."
  10: "ἠρημώθη πᾶσα πόλις — «опустел всякий город» (ἐρημόω); κλείσει οἰκίαν τοῦ μὴ εἰσελθεῖν — «закроет дом, чтобы не войти» (κλείω — запирать); слав. «заключит храм, еже не внити» передаёт οἰκία как «храм» (дом)."
  11: "ὀλολύζετε περὶ τοῦ οἴνου πανταχῇ — «рыдайте о вине повсюду» (ὀλολύζω — вопить); πέπαυται πᾶσα εὐφροσύνη τῆς γῆς — «прекратилась всякая радость земли». Слав. удваивает: «престала есть радость вся земная, отиде вся радость земли»."
  12: "καταλειφθήσονται πόλεις ἔρημοι — «останутся города пустыми»; οἶκοι ἐγκαταλελειμμένοι ἀπολοῦνται — «дома оставленные погибнут» (ἐγκαταλείπω — оставлять). ru/МТ добавляют «ворота развалились», чего в LXX и слав. нет."
  13: "ὃν τρόπον ἐάν τις καλαμήσηται ἐλαίαν — «как если кто обирает маслину» (καλαμάομαι — собирать остатки, обивать); οὕτως καλαμήσονται αὐτούς — «так оберут их». ἐὰν παύσηται ὁ τρύγητος — «когда прекратится сбор винограда» (τρύγητος — виноградная жатва). Слав. текст здесь испорчен: «и (якоже) аще останет от оымания винограда»."
  14: "οὗτοι φωνῇ βοήσονται — «эти голосом воззовут»; οἱ καταλειφθέντες ἐπὶ τῆς γῆς εὐφρανθήσονται — «оставшиеся на земле возрадуются»; ἅμα τῇ δόξῃ κυρίου — «вместе со славою Господней». ταραχθήσεται τὸ ὕδωρ τῆς θαλάσσης — «взволнуется вода моря»: этого слова нет в МТ, но оно есть в LXX и слав.; сохранено на месте."
  15: "διὰ τοῦτο ἡ δόξα κυρίου ἐν ταῖς νήσοις ἔσται τῆς θαλάσσης — «посему слава Господня будет на островах моря»; τὸ ὄνομα κυρίου ἔνδοξον ἔσται — «имя Господне прославлено будет». Κύριε ὁ θεὸς Ισραηλ — звательное «Господи, Боже Израилев»: по gr это конец 24:15, слав. относит его к началу 24:16; держим gr."
  16: "ἀπὸ τῶν πτερύγων τῆς γῆς — «от краёв земли» (πτέρυξ — крыло, край); τέρατα ἠκούσαμεν — «чудеса мы слышали» (τέρας — знамение, чудо). Ἐλπὶς τῷ εὐσεβεῖ — «надежда благочестивому» (ἐλπίς, εὐσεβής); ru/МТ читают «слава Праведному», в LXX и слав. — «надежда благочестивому». καὶ ἐροῦσιν Οὐαὶ τοῖς ἀθετοῦσιν, οἱ ἀθετοῦντες τὸν νόμον — «и скажут: горе отвергающим, отвергающие закон»; слав. удваивает «горе хулящым… горе преступником». Обе реплики в 「…」."
  17: "φόβος καὶ βόθυνος καὶ παγὶς — «страх, и яма, и петля» (βόθυνος — яма; παγίς — петля, западня); ἐφ᾽ ὑμᾶς τοὺς ἐνοικοῦντας ἐπὶ τῆς γῆς — «на вас, живущих на земле». Тройная формула сохранена."
  18: "ὁ φεύγων τὸν φόβον ἐμπεσεῖται εἰς τὸν βόθυνον — «убегающий от страха упадёт в яму» (ἐμπίπτω); ὁ ἐκβαίνων ἐκ τοῦ βοθύνου ἁλώσεται ὑπὸ τῆς παγίδος — «выходящий из ямы пойман будет петлёй» (ἁλίσκομαι). θυρίδες ἐκ τοῦ οὐρανοῦ ἠνεῴχθησαν — «окна с неба открылись» (θυρίς — окно, дверца); σεισθήσεται τὰ θεμέλια τῆς γῆς — «потрясутся основания земли»."
  19: "ταραχῇ ταραχθήσεται ἡ γῆ — «смятением смятётся земля» (датив cognatus); ἀπορίᾳ ἀπορηθήσεται ἡ γῆ — «в недоумении/оскудении оскудеет земля» (ἀπορία — недоумение, нужда, безвыходность; слав. «скудостию оскудеет»). Передано «揺れに揺れ… 衰えに衰える», чтобы сохранить фигуру повторения."
  20: "ἔκλινεν καὶ σεισθήσεται ὡς ὀπωροφυλάκιον ἡ γῆ — «склонилась и потрясётся, как садовая сторожка, земля» (ὀπωροφυλάκιον — шалаш сторожа в плодовом саду; слав. «овощное хранилище»); ὡς ὁ μεθύων καὶ κραιπαλῶν — «как пьяный и качающийся» (κραιπαλάω — страдать от похмелья, качаться). κατίσχυσεν ἐπ᾽ αὐτῆς ἡ ἀνομία — «превозмогло на ней беззаконие» (κατισχύω — одолевать)."
  21: "ἐπάξει ὁ θεὸς ἐπὶ τὸν κόσμον τοῦ οὐρανοῦ τὴν χεῖρα — «наведёт Бог на убранство неба руку» (κόσμος — украшение, убранство, здесь небесное воинство; слав. «утварь небесную»); ἐπὶ τοὺς βασιλεῖς τῆς γῆς — «и на царей земли». Слав. добавляет в начале «и будет в той день» и называет действующего «Господь», тогда как в LXX ὁ θεός («Бог»); по паритету в тексте «その日» и 主."
  22: "συνάξουσιν καὶ ἀποκλείσουσιν εἰς ὀχύρωμα καὶ εἰς δεσμωτήριον — «соберут и затворят в укрепление и в темницу» (ὀχύρωμα, δεσμωτήριον); διὰ πολλῶν γενεῶν ἐπισκοπὴ ἔσται αὐτῶν — «через многие роды будет посещение их» (ἐπισκοπή — посещение, попечение); слав. «мноземи роды будет посещение их»."
  23: "τακήσεται ἡ πλίνθος — «расплавится кирпич» (τήκω — плавить, таять; πλίνθος — кирпич, слав. «плинфа»); πεσεῖται τὸ τεῖχος — «падёт стена». βασιλεύσει κύριος ἐν Σιων — «воцарится Господь в Сионе»; ἐνώπιον τῶν πρεσβυτέρων δοξασθήσεται — «пред старейшинами прославится». Слав. добавляет «и устыдится луна и посрамится солнце» (из МТ), чего в LXX нет; внесено в текст без 〔…〕. ru/МТ добавляют «Саваоф», в LXX и слав. только «Господь»."
