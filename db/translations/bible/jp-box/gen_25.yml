verses:
  1: "アブラハムはさらに妻[つま]を娶[めと]った。名[な]をケトゥラといった。"
  2: "彼女はアブラハムに、ゼムラン、イェクサン、マダン、ミディアム、イェスボク、ソエを産[う]んだ。"
  3: "イェクサンはサバ、テマン、デダンをもうけた。デダンの子[こ]らはラグエル、ナブデエル、アスリム、ラトシム、ロオミムであった。"
  4: "ミディアムの子[こ]らはガイファ、アフェル、エノク、アビラ、エルラガであった。これらはみなケトゥラの子[こ]である。"
  5: "アブラハムは自分のすべての財産[ざいさん]を、子[こ]のイサクに与[あた]えた。"
  6: "また、そばめたちの子[こ]らには贈[おく]り物[もの]を与[あた]え、自分[じぶん]がまだ生[い]きているうちに、彼らを子[こ]イサクから遠[とお]ざけ、東[ひがし]の方[ほう]、東[ひがし]の地[ち]へ送[おく]り出[だ]した。"
  7: "アブラハムの生[い]きた日々[ひび]の年[とし]は、百七十五[ひゃくななじゅうご]年[ねん]であった。"
  8: "アブラハムは衰[おとろ]えて死[し]んだ。良[よ]い老[お]いを迎[むか]え、年[とし]を重[かさ]ねて満[み]ち足[た]りた。こうして彼は自分[じぶん]の民[たみ]に加[くわ]えられた。"
  9: "子[こ]らのイサクとイシュマエルは、彼をヘト人[じん]サアルの子[こ]エフロンの畑[はたけ]にある二重[にじゅう]の洞窟[どうくつ]、マムレの向[む]かい側[がわ]にある洞窟に葬[ほうむ]った。"
  10: "その畑[はたけ]と洞窟[どうくつ]は、アブラハムがヘトの子[こ]らから買[か]い取[と]ったものである。そこにアブラハムと、その妻[つま]サラが葬[ほうむ]られた。"
  11: "アブラハムが死[し]んだ後[のち]、神[かみ]はその子[こ]イサクを祝福[しゅくふく]された。イサクは幻[まぼろし]の井戸[いど]のそばに住[す]んだ。"
  12: "これは、サラの侍女[じじょ]ハガルがアブラハムに産[う]んだ、アブラハムの子[こ]イシュマエルの系図[けいず]である。"
  13: "イシュマエルの子[こ]らの名[な]は、その世代[せだい]に従[したが]って次[つぎ]のとおりである。イシュマエルの長子[ちょうし]はナバイオト、次[つぎ]にケダル、ナブデエル、マッサム、"
  14: "マスマ、イドマ、マッセ、"
  15: "ホダド、テマン、イェトル、ナフェス、ケドマ。"
  16: "これらはイシュマエルの子[こ]らであり、これは彼らの天幕[てんまく]と宿営[しゅくえい]における名[な]である。彼らはその民[たみ]に従[したが]って十二人[じゅうににん]の首長[しゅちょう]である。"
  17: "イシュマエルの生[い]きた年[とし]は百三十七[ひゃくさんじゅうなな]年[ねん]であった。彼は衰えて死に、その一族[いちぞく]に加えられた。"
  18: "彼はエビラトから、エジプトの手前[てまえ]にあるシュルまで、アッシリアへ向[む]かう途中[とちゅう]まで住[す]んだ。彼はすべての兄弟[きょうだい]と向[む]かい合[あ]って住んだ。"
  19: "これはアブラハムの子[こ]イサクの系図[けいず]である。アブラハムはイサクをもうけた。"
  20: "イサクは四十歳[よんじゅっさい]のとき、メソポタミアのシリア人[じん]ベトエルの娘[むすめ]、シリア人[じん]ラバンの妹[いもうと]であるリベカを妻[つま]に迎[むか]えた。"
  21: "イサクは、妻[つま]リベカが子[こ]を産[う]めなかったので、彼女のために主[しゅ]に願[ねが]った。神[かみ]は彼の願いを聞[き]き入[い]れられ、妻リベカは身[み]ごもった。"
  22: "子どもたちは彼女[かのじょ]の胎内[たいない]で跳[と]び回[まわ]った。彼女は言った。「このまま続[つづ]くのなら、なぜわたしにこんなことが。」彼女は主[しゅ]に尋[たず]ねに行[い]った。"
  23: "主[しゅ]は彼女[かのじょ]に言[い]われた。「あなたの胎[はら]には二[ふた]つの民[たみ]がいる。二[ふた]つの国民[こくみん]があなたの腹[はら]から分[わ]かれ出[で]る。一[ひと]つの民は他[ほか]の民より勝[まさ]り、大[おお]きい者[もの]が小[ちい]さい者に仕[つか]える。」"
  24: "産[う]む時[とき]が満[み]ちた。すると、彼女の胎[はら]には双子[ふたご]がいた。"
  25: "先[さき]に生[う]まれた子[こ]は赤[あか]く、全身[ぜんしん]が毛皮[けがわ]のように毛深[けぶか]かった。そこで、その名[な]をエサウと名[な]づけた。"
  26: "その後[あと]で弟[おとうと]が生まれた。その手[て]はエサウのかかとを掴[つか]んでいた。そこで、その名をヤコブと名づけた。イサクは、リベカが彼らを産[う]んだとき六十歳[ろくじゅっさい]であった。"
  27: "二人[ふたり]の若者[わかもの]は育[そだ]った。エサウは狩[か]りをよくする野[の]の人[ひと]となり、ヤコブは家[いえ]に住[す]む素直[すなお]な人[ひと]であった。"
  28: "イサクはエサウを愛[あい]した。彼の狩[か]りの獲[え]物[もの]がイサクの食物[しょくもつ]だったからである。しかしリベカはヤコブを愛した。"
  29: "ヤコブは煮[に]えた食物[しょくもつ]を作[つく]った。エサウは野[の]から疲[つか]れ果[は]てて帰[かえ]って来[き]た。"
  30: "エサウはヤコブに言った。「この赤[あか]い煮[に]えた食物[しょくもつ]を、わたしに食[た]べさせてくれ。わたしは疲[つか]れ果[は]てているのだ。」それゆえ、彼の名[な]はエドム⟨「赤[あか]い」の意[い]。⟩と呼ばれた。"
  31: "ヤコブは言った。「今日[きょう]、あなたの長子[ちょうし]の権利[けんり]をわたしに売[う]りなさい。」"
  32: "エサウは言った。「見[み]ろ、わたしは死[し]のうとしている。長子[ちょうし]の権利[けんり]など、わたしに何[なん]の役[やく]に立[た]つというのか。」"
  33: "ヤコブは言った。「今日[きょう]、わたしに誓[ちか]え。」エサウは彼に誓[ちか]い、長子[ちょうし]の権利[けんり]をヤコブに売[う]り渡[わた]した。"
  34: "ヤコブはエサウにパンとレンズ豆[まめ]の煮[に]えた食物[しょくもつ]を与[あた]えた。彼は食[た]べ、飲[の]み、立[た]ち上[あ]がって去[さ]った。こうしてエサウは長子[ちょうし]の権利[けんり]を軽[かろ]んじた。"

notes:
  1: "Προσθέμενος δὲ Αβρααμ — アブラハムはさらに (προστίθεμαι — «присоединять, брать ещё»; слав. «приложив же»). Χεττουρα — ケトゥラ (слав. «хеттура», Син. «Хеттура»)."
  2: "Имена по LXX: Ζεμραν — ゼムラン, Ιεξαν — イェクサン, Μαδαν — マダン, Μαδιαμ — ミディアム, Ιεσβοκ — イェスボク, Σωυε — ソエ (в Син. иные формы: Зимран, Иокшан, Медан, Мадиан, Ишбак, Шуах; транслитерация — с греческого)."
  3: "Σαβα — サバ, Θαιμαν — テマン, Δαιδαν — デダン; сыны Дедана: Ραγουηλ — ラグエル, Ναβδεηλ — ナブデエル, Ασσουριιμ — アスリム, Λατουσιιμ — ラトシム, Λοωμιμ — ロオミム (LXX даёт больше имён, чем Син.)."
  4: "Γαιφα — ガイファ, Αφερ — アフェル, Ενωχ — エノク, Αβιρα — アビラ, Ελραγα — エルラガ (Син.: Ефа, Ефер, Ханох, Авида, Елдага). πάντες οὗτοι ἦσαν υἱοὶ Χεττουρας — これらはみなケトゥラの子 (повтор-формула сохранён)."
  5: "πάντα τὰ ὑπάρχοντα αὐτοῦ — すべての財産 (ὑπάρχοντα — «имущество»)."
  6: "τοῖς υἱοῖς τῶν παλλακῶν — そばめたちの子ら (παλλακή — «наложница»). δόματα — 贈り物. πρὸς ἀνατολὰς εἰς γῆν ἀνατολῶν — 東の方、東の地へ (двойное «восток», как в LXX; слав. «к востоку на землю восточную»). ἔτι ζῶντος αὐτοῦ — まだ生きているうちに."
  7: "ἑκατὸν ἑβδομήκοντα πέντε ἔτη — 百七十五年 (LXX и слав.; у Син. то же)."
  8: "ἐκλιπὼν ἀπέθανεν — 衰えて死んだ (ἐκλείπω — «угасать, оставлять»; слав. «ослабев умре»). ἐν γήρει καλῷ — 良い老いを迎え (слав. «в старости добрей»). πλήρης ἡμερῶν — 年を重ねて満ち足りた (букв. «полный дней»). προσετέθη πρὸς τὸν λαὸν αὐτοῦ — 民に加えられた (букв.; слав. «приложися к людем своим»)."
  9: "τὸ σπήλαιον τὸ διπλοῦν — 二重の洞窟 (LXX переводит название Махпела — マクペラ; слав. «пещера сугубая»). Εφρων τοῦ Σααρ τοῦ Χετταίου — ヘト人サアルの子エフロン (Σααρ — евр. Цохар). ἀπέναντι Μαμβρη — マムレの向かい側."
  10: "ὃ ἐκτήσατο Αβρααμ παρὰ τῶν υἱῶν Χετ — アブラハムがヘトの子らから買い取った (κτάομαι — «приобретать»). ἐκεῖ ἔθαψαν — そこに葬られた."
  11: "μετὰ τὸ ἀποθανεῖν Αβρααμ — アブラハムが死んだ後. παρὰ τὸ φρέαρ τῆς ὁράσεως — 幻の井戸のそば (см. 24:62)."
  12: "αἱ γενέσεις Ισμαηλ — イシュマエルの系図 (γένεσις — «происхождение, родословие»). ἡ παιδίσκη Σαρρας — サラの侍女 (в LXX нет «египтянка»; слав. добавляет «египтяныня» — это не греч. чтение, в 〔…〕 не берём)."
  13: "κατ᾽ ὄνομα τῶν γενεῶν αὐτοῦ — その世代に従って (букв. «по имени родов его»). Ναβαιωθ — ナバイオト, Κηδαρ — ケダル, Ναβδεηλ — ナブデエル, Μασσαμ — マッサム."
  14: "Μασμα — マスマ, Ιδουμα — イドマ, Μασση — マッセ (Син.: Мишма, Дума, Масса)."
  15: "Χοδδαδ — ホダド, Θαιμαν — テマン, Ιετουρ — イェトル, Ναφες — ナフェス, Κεδμα — ケドマ."
  16: "ἐν ταῖς σκηναῖς αὐτῶν καὶ ἐν ταῖς ἐπαύλεσιν αὐτῶν — 彼らの天幕と宿営において (σκηνή — 天幕; ἔπαυλις — «селение, кочевье»). δώδεκα ἄρχοντες κατὰ ἔθνη αὐτῶν — その民に従って十二人の首長 (ἄρχων — «князь, начальник»)."
  17: "ἑκατὸν τριάκοντα ἑπτὰ ἔτη — 百三十七年. προσετέθη πρὸς τὸ γένος αὐτοῦ — その一族に加えられた (γένος — «род»; в ст. 8 — λαός)."
  18: "ἀπὸ Ευιλατ ἕως Σουρ — エビラトからシュルまで. κατὰ πρόσωπον Αἰγύπτου — エジプトの手前 (букв. «пред лицем Египта»). ἕως ἐλθεῖν πρὸς Ἀσσυρίους — アッシリアへ向かう途中まで. κατὰ πρόσωπον πάντων τῶν ἀδελφῶν αὐτοῦ — すべての兄弟と向かい合って (букв. «пред лицем»)."
  19: "αἱ γενέσεις Ισαακ — イサクの系図. Αβρααμ ἐγέννησεν τὸν Ισαακ — アブラハムはイサクをもうけた (повтор-формула, как в LXX)."
  20: "ἐτῶν τεσσαράκοντα — 四十歳. τοῦ Σύρου ἐκ τῆς Μεσοποταμίας — メソポタミアのシリア人 (Σύρος — «сириец, арамеянин»; слав. добавляет «сирския» к Месопотамии). ἀδελφὴν Λαβαν — ラバンの妹."
  21: "ἐδεῖτο… κυρίου — 主に願った (δέομαι — «умолять»). στεῖρα ἦν — 子を産めなかった (στείρα — «бесплодная»). ἐπήκουσεν… ὁ θεός — 神は聞き入れられた. ἔλαβεν ἐν γαστρί — 身ごもった (букв. «приняла во чреве»)."
  22: "ἐσκίρτων τὰ παιδία ἐν αὐτῇ — 子どもたちは胎内で跳び回った (σκιρτάω — «прыгать, толкаться»). Εἰ οὕτως μοι μέλλει γίνεσθαι, ἵνα τί μοι τοῦτο; — このまま続くのなら、なぜわたしにこんなことが (риторический вопрос, не сглажен). ἐπορεύθη… πυθέσθαι παρὰ κυρίου — 主に尋ねに行った (πυνθάνομαι — «разузнавать»)."
  23: "Δύο ἔθνη ἐν τῇ γαστρί σού εἰσιν — あなたの胎には二つの民がいる (ἔθνος — «народ»). δύο λαοὶ ἐκ τῆς κοιλίας σου διασταλήσονται — 二つの国民があなたの腹から分かれ出る (διαστέλλω — «разделять»). λαὸς λαοῦ ὑπερέξει — 一つの民が他の民に勝り (ὑπερέχω — «превосходить»). ὁ μείζων δουλεύσει τῷ ἐλάσσονι — 大きい者が小さい者に仕える (формула об Исаве и Иакове)."
  24: "ἐπληρώθησαν αἱ ἡμέραι τοῦ τεκεῖν αὐτήν — 産む時が満ちた. τῇδε ἦν δίδυμα ἐν τῇ κοιλίᾳ αὐτῆς — 彼女の胎には双子がいた (LXX: «у ней близнецы»)."
  25: "πυρράκης — 赤く (πυρράκης — «красноватый, рыжий» — отсюда и имя Едом). ὅλος ὡσεὶ δορὰ δασύς — 全身が毛皮のように毛深かった (δορά — «кожа, шкура»; δασύς — «косматый»). ἐπωνόμασεν… Ησαυ — エサウと名づけた (подлежащее в греч. ед. ч., опущено)."
  26: "ἡ χεὶρ αὐτοῦ ἐπειλημμένη τῆς πτέρνης Ησαυ — その手はエサウのかかとを掴んでいた (πτέρνα — «пята»; отсюда имя Иаков — «держащий за пяту»). ἐτῶν ἑξήκοντα — 六十歳."
  27: "εἰδὼς κυνηγεῖν ἄγροικος — 狩りをよくする野の人 (κυνηγέω — «охотиться»; ἄγροικος — «сельский, дикий»). ἄπλαστος οἰκῶν οἰκίαν — 家に住む素直な人 (ἄπλαστος — «нелукавый, простой»; Син. «кроткий, живущий в шатрах» — масоретское чтение)."
  28: "ἡ θήρα αὐτοῦ βρῶσις αὐτῷ — 彼の狩りの獲物がイサクの食物だった (θῆρα — 狩り; βρῶσις — «пища»). ἠγάπα — имперфект: любила постоянно."
  29: "ἥψησεν… ἕψεμα — 煮えた食物を作った (ἕψεμα — «варёное, похлёбка»). ἐκλείπων — 疲れ果てて (ἐκλείπω — «изнемогать»)."
  30: "Γεῦσόν με ἀπὸ τοῦ ἑψέματος τοῦ πυρροῦ τούτου — この赤い煮えた食物を食べさせてくれ (γεύω — «дать отведать»). ὅτι ἐκλείπω — 疲れ果てているのだ. διὰ τοῦτο ἐκλήθη… Εδωμ — それゆえエドムと呼ばれた (евр. «красный»; сноска при первом упоминании)."
  31: "Ἀπόδου μοι… τὰ πρωτοτόκιά σου — 長子の権利を売りなさい (ἀποδίδωμι — «отдавать, продавать»; πρωτόκια — «первородство»)."
  32: "πορεύομαι τελευτᾶν — 死のうとしている (букв. «иду умирать»). ἵνα τί μοι ταῦτα τὰ πρωτότοκια; — 長子の権利など何の役に立つのか."
  33: "Ὄμοσόν μοι σήμερον — 今日、わたしに誓え (ὀμνύω — «клясться»). ἀπέδοτο — 売り渡した."
  34: "ἄρτον καὶ ἕψεμα φακοῦ — パンとレンズ豆の煮えた食物 (φακός — «чечевица»). ἐφαύλισεν — 軽んじた (φαυλίζω — «считать ничтожным»; слав. «нивочтоже вмени»)."
