# jp-box, 1-я Паралипоменон, глава 23. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); церковнославянский (csl-ru) — второй
# свидетель церковного текста (новый паритет, docs/japanese-bible.md):
# слав. добавления и чтения входят в основной текст без 〔…〕, вариант LXX —
# в notes. Исключение — имена в списках (как в гл. 1–9 и 24): они транслите-
# рируются с греческого, csl-вариант называется в notes; так держится
# единообразие внутри книги (イサアル, オムシ, シュバエル, レハブヤ, イエイル —
# формы уже переведённых глав и корпуса).
# ru (Синодальный) — только для понимания, не источник. jp-joc и jp-ni
# в 1 Пар отсутствуют; jp-ni (под авторским правом) не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 23: левиты, их число и служение (1–5), роды Гирсона, Каафа и Мерари
# (6–23), служение от двадцати лет (24–32).
# Особенности: 7 — LXX Παροσωμ испорчено, по csl и смыслу ゲルション;
# 9 — имена LXX (csl: азаил, арам); 19 — LXX испорчен, взяты имена параллели
# 24:23; 21 — деление стиха по gr (в csl «сынове Моолиевы» открывают ст. 22).
# Речь Давида — 「…」 (25). Нумерация по gr: 32 стиха, совпадает с csl/ru.
# 〔…〕 нет. Сносок ⟨…⟩ нет: レビ人, 祭司, 至聖所, 契約の箱, 安息日 уже в корпусе.

tr_code: jp-box
book: 1par
chapter: 23
draft: true

verses:
  1: "ダビデは年老[としお]いて、日々[ひび]に満[み]ちていた。そして、その子[こ]ソロモンを自分[じぶん]に代[か]わってイスラエルの王[おう]とした。"
  2: "ダビデはイスラエルのすべての長[おさ]たち、祭司[さいし]たち、レビ人[びと]たちを集[あつ]めた。"
  3: "レビ人[びと]は三十歳[さんじゅっさい]以上[いじょう]の者[もの]が数[かぞ]えられ、その数[かず]は頭[あたま]ごとに数えて三万八千[さんまんはっせん]人[にん]の男[おとこ]であった。"
  4: "そのうち、主[しゅ]の家[いえ]の仕事[しごと]を監督[かんとく]する者[もの]が二万四千[にまんよんせん]人、書記[しょき]と裁判[さいばん]人[にん]が六千[ろくせん]人であった。"
  5: "門衛[もんえい]が四千[よんせん]人、主[しゅ]を賛美[さんび]する者[もの]が四千人で、主を賛美するために造[つく]った楽器[がっき]を用[もち]いた。"
  6: "ダビデは彼[かれ]らを、レビの子[こ]らゲルション、カアト、メラリに従[したが]って組[くみ]分[わ]けした。"
  7: "ゲルションに属[ぞく]する者[もの]は、レアダンとシメイである。"
  8: "レアダンの子[こ]らは、長[おさ]であるイエイル、ゼトム、ヨエル、合[あ]わせて三人[さんにん]。"
  9: "シメイの子[こ]らは、サロミト、イエイル、アイダン、三人[さんにん]。これらはレアダンに属[ぞく]する父[ちち]の家[いえ]の長[おさ]たちである。"
  10: "シメイの子[こ]らは、イェト、ジザ、ヨアス、ベリア。これらがシメイの子らで、四人[よにん]である。"
  11: "イェトが長[おさ]で、ジザが次[つぎ]であった。ヨアスとベリアは多[おお]くの子[こ]をもうけなかったので、父[ちち]の家[いえ]の一[ひと]つの数[かず]となった。"
  12: "カアトの子[こ]らは、アムラム、イサアル、ヘブロン、オジエル、四人[よにん]である。"
  13: "アムラムの子[こ]らは、アロンとモーセである。アロンは、彼とその子[こ]らが永遠[えいえん]に至聖所[しせいしょ]を聖[きよ]めるために、すなわち主[しゅ]の前[まえ]で香[こう]をたき、務[つと]めを果[は]たし、永遠に主の名[な]によって祈[いの]るために、分[わ]け定[さだ]められた。"
  14: "神[かみ]の人[ひと]モーセの子[こ]らは、レビの部族[ぶぞく]に数[かぞ]えられた。"
  15: "モーセの子[こ]らは、ゲルサムとエリエゼル。"
  16: "ゲルサムの子[こ]らは、長[おさ]であるシュバエル。"
  17: "エリエゼルの子[こ]らは、長[おさ]であるレハブヤ。エリエゼルにはほかの子[こ]らはいなかった。レハブヤの子[こ]らは非常[ひじょう]に多[おお]く増[ふ]えた。"
  18: "イサアルの子[こ]らは、長[おさ]であるサロモト。"
  19: "ヘブロンの子[こ]らは、長[おさ]であるエリヤ、次[つぎ]がアマデヤ、三番目[さんばんめ]がヤジエル、四番目[よんばんめ]がヨカム。"
  20: "オジエルの子[こ]らは、長[おさ]であるミカと、次[つぎ]のイシヤ。"
  21: "メラリの子[こ]らは、モオリとオムシ。モオリの子[こ]らは、エレアザルとキス。"
  22: "エレアザルは死[し]んだ。彼[かれ]には子[こ]らがなく、ただ娘[むすめ]たちだけがいた。キスの子[こ]らである彼女[かのじょ]たちの兄弟[きょうだい]たちが、彼女たちを妻[つま]に迎[むか]えた。"
  23: "オムシの子[こ]らは、モオリ、エデル、ヤリモト、三人[さんにん]である。"
  24: "これらはレビの子[こ]らであり、父[ちち]の家[いえ]ごとの者[もの]、その父の家の長[おさ]たちである。彼[かれ]らは、その数[かぞ]えに従[したが]い、名[な]の数に従い、頭[あたま]ごとに数えられて、二十歳[はたち]以上[いじょう]で主[しゅ]の家[いえ]の務[つと]めの仕事[しごと]を行[おこな]っていた。"
  25: "ダビデは言[い]った。「主[しゅ]なるイスラエルの神[かみ]は、その民[たみ]に安[やす]らぎを与[あた]え、永遠[えいえん]にエルサレムに住[す]まわれた。」"
  26: "また、レビ人[びと]はもはや幕屋[まくや]とそのすべての器[うつわ]を、その務[つと]めのために運[はこ]ぶことはない。"
  27: "ダビデの最後[さいご]の言葉[ことば]によって、レビの子[こ]らは二十歳[はたち]以上[いじょう]とされたからである。"
  28: "彼[かれ]らをアロンの子[こ]らのもとに置[お]いて、主[しゅ]の家[いえ]で務[つと]めさせた。すなわち、庭[にわ]と部屋[へや]と、すべての聖[せい]なるものの清[きよ]めと、神[かみ]の家[いえ]の務めの仕事[しごと]のためである。"
  29: "すなわち、供[そな]えのパン、供え物[もの]の小麦粉[こむぎこ]、種[たね]なしの薄焼[うすや]きパン、焼[や]き板[いた]、こねたもの、またすべての重[おも]さと量[はか]りのために。"
  30: "また、朝[あさ]ごとに立[た]って主[しゅ]を賛美[さんび]し、感謝[かんしゃ]をささげ、夕[ゆう]べも同[おな]じようにするためである。"
  31: "また、安息日[あんそくび]、新月[しんげつ]、祭[まつ]りに主[しゅ]へ捧[ささ]げられるすべての燔祭[はんさい]のために、その定[さだ]めに従[したが]って数[かず]に応[おう]じて、絶[た]えず主にささげるためである。"
  32: "彼[かれ]らは証[あかし]の幕屋[まくや]の見張[みは]りと、聖所[せいしょ]の見張り、また兄弟[きょうだい]であるアロンの子[こ]らの見張りを守[まも]り、主[しゅ]の家[いえ]で務[つと]める。"

notes:
  1: "πρεσβύτης — старец. πλήρης ἡμερῶν — исполнен дней. ἐβασίλευσεν — воцарил (βασιλεύω); в LXX глагол в значении «сделал царём»."
  2: "ἄρχοντας — начальников (長[おさ]). ἱερεῖς — священников. Λευίτας — левитов (レビ人[びと])."
  3: "ἀπὸ τριακονταετοῦς — от тридцатилетнего возраста. κατὰ κεφαλήν — поголовно. τριάκοντα καὶ ὀκτὼ χιλιάδας — 38 000."
  4: "ἐργοδιῶκται — надсмотрщики за работами (ἐργοδιώκτης); 監督[かんとく]. γραμματεῖς — писцы (書記[しょき]). κριταί — судьи."
  5: "πυλωροί — привратники (門衛[もんえい]). αἰνοῦντες — хвалящие (αἰνέω). ὄργανα — музыкальные инструменты (楽器[がっき]); οἷς ἐποίησεν — которые сделал (Давид)."
  6: "διεῖλεν — разделил (διαιρέω). ἐφημερία — чреда, очередь служения (組[くみ]). Γεδσων — Гирсон (ゲルション; csl «гирсон»). Κααθ — Кааф (カアト). Μεραρι — Мерари."
  7: "Παροσωμ — испорченное место LXX; csl «гирсону и леадану и семею» — Гирсон, Лаедан и Шимей; по смыслу и csl в тексте ゲルション、レアダン、シメイ. Εδαν — Едан, он же Лаедан (レアダン). Σεμει — Шимей (シメイ)."
  8: "Ιιηλ — Иехиил (イエイル, как в 1par 8:29; 9:6,35; 16:5); csl «иеиил». Ζεθομ — Зефам (ゼトム); csl «зефоф». Ιωηλ — Иоиль (ヨエル); csl «иоиль». ὁ ἄρχων — начальник, первый (長[おさ])."
  9: "LXX: Σαλωμιθ, Ιιηλ, Αιδαν — サロミト、イエイル、アイダン; csl «саломиф и азаил и арам» — Саломиф, Хазиил, Арам (ближе к МТ). Имена переданы с греческого, как в гл. 1–9; csl-вариант отмечен. ἄρχοντες τῶν πατριῶν — начальники отечеств (父[ちち]の家[いえ]の長[おさ]). τῷ Εδαν — Лаедана (レアダン)."
  10: "Ιεθ — Иахаф (イェト); csl «иеф». Ζιζα — Зиза (ジザ). Ιωας — Иеуш (ヨアス, как в 1par 7:8). Βερια — Берия (ベリア)."
  11: "ὁ ἄρχων — первый. ἐπλήθυναν υἱούς — не умножили сыновей. εἰς οἶκον πατριᾶς εἰς ἐπίσκεψιν μίαν — «в один дом отечества, в одно счисление»; csl «в дому отечества в причтение едино»."
  12: "Αμβραμ — Амрам (アムラム). Ισσααρ — Ицгар (イサアル, форма корпуса). Χεβρων — Хеврон (ヘブロン). Οζιηλ — Озиил (オジエル)."
  13: "διεστάλη — отделён, выделен (διαστέλλω). ἅγια ἁγίων — святое святых (至聖所[しせいしょ]). θυμιᾶν — кадить фимиамом (θυμιάω). λειτουργεῖν — служить. ἐπεύχεσθαι — молиться, призывать (ἐπεύχομαι); csl «молится во имя его»."
  14: "ἄνθρωπος τοῦ θεοῦ — человек Божий (神の人[ひと]). ἐκλήθησαν εἰς φυλήν — причтены к колену (部族[ぶぞく])."
  15: "Γηρσαμ — Гирсам (ゲルサム); не путать с Γεδσων (ゲルション). Ελιεζερ — Елиезер (エリエゼル)."
  16: "Σουβαηλ — Шуваил (シュバエル, как в 24:20); csl «суваил». ὁ ἄρχων — начальник, первый."
  17: "Ρααβια — Рехавия (レハブヤ, как в 24:21); csl «равиа». οὐκ ἦσαν … υἱοὶ ἕτεροι — не было других сыновей. ηὐξήθησαν εἰς ὕψος — «возросли в высоту» (αὐξάνω), т. е. весьма умножились; csl «умножени суть зело»."
  18: "Σαλωμωθ — Шеломиф (サロモト); csl «саллумоф». ὁ ἄρχων — первый."
  19: "LXX этого стиха испорчен: Ιδουδ, Αμαδια, Οζιηλ, Ικεμιας; csl «иериав, амариа, иазиил, иезекиа». В параллельном списке 24:23 LXX даёт Αμαδια, Ιαζιηλ, Ιοκομ (первого имени нет), csl добавляет «иериав». Для единообразия книги взяты имена параллели (エリヤ、アマデヤ、ヤジエル、ヨカム); расхождения отмечены."
  20: "Μιχας — Миха (ミカ). Ισια — Ишшия (イシヤ, как в 24:25); csl «иессиа». ὁ δεύτερος — второй."
  21: "Μοολι — Махли (モオリ). Μουσι — Муши (オムシ, как в 6:4 и 24:30). Ελεαζαρ — Елеазар. Κις — Кис. В csl «сынове Моолиевы: Елеазар и Кис» стоят в начале ст. 22; деление по gr."
  22: "ἀλλ᾿ ἢ θυγατέρες — но только дочери. ἔλαβον αὐτάς — взяли их (в жёны). υἱοὶ Κις ἀδελφοὶ αὐτῶν — сыны Киса, братья их."
  23: "Μοολι — Махли (モオリ). Εδερ — Едер (エデル). Ιαριμωθ — Иремоф (ヤリモト); csl «иаримоф»."
  24: "κατ᾿ οἴκους πατριῶν — по домам отцов. ἐπίσκεψις — смотр, счисление. κατὰ τὸν ἀριθμὸν ὀνομάτων — по числу имён. ἀπὸ εἰκοσαετοῦς — от двадцати лет."
  25: "Κατέπαυσεν — дал покой (καταπαύω). κατεσκήνωσεν — вселился (κατασκηνόω). Речь Давида — 「…」."
  26: "αἴροντες — носящие (αἴρω). σκηνή — скиния (幕屋[まくや]). σκεύη — утварь, сосуды (器[うつわ])."
  27: "ἐν τοῖς λόγοις τοῖς ἐσχάτοις — в последних словах (повелениях). ἀπὸ εἰκοσαετοῦς — от двадцати лет."
  28: "ἐπὶ χεῖρα Ααρων — «под руку Аарона», в подчинении (χείρ). αὐλάς — дворы (庭[にわ]). παστοφόρια — хранилища, пристройки (部屋[へや]). καθαρισμός — очищение (清[きよ]め)."
  29: "ἄρτοι τῆς προθέσεως — хлебы предложения (供[そな]えのパン). σεμίδαλις — тонкая мука (小麦粉[こむぎこ]). λάγανα ἄζυμα — опресноки (種[たね]なしの薄焼[うすや]きパン). τήγανον — сковорода, противень (焼[や]き板[いた]). πεφυραμένη — замешанное тесто (こねたもの); csl «печеным» — иное понимание. μέτρον — мера; csl добавляет «весом»."
  30: "στῆναι — стоять, предстоять. ἐξομολογεῖσθαι — исповедовать, благодарить (感謝[かんしゃ]). τὸ ἑσπέρας — вечером."
  31: "ἀναφερομένων — возносимых (ἀναφέρω). σάββατα — субботы (安息日[あんそくび]). νεομηνίαι — новомесячия (新月[しんげつ]). ἑορταί — праздники (祭[まつ]り). κατὰ τὴν κρίσιν — по установлению (定[さだ]め). διὰ παντός — постоянно (絶[た]えず)."
  32: "φυλακάς — стражи, караулы (見張[みは]り). σκηνὴ τοῦ μαρτυρίου — скиния свидетельства (証[あかし]の幕屋[まくや]). В csl добавлено «стражу святилища» (聖所[せいしょ]の見張り) — нет в LXX, по паритету в тексте."
