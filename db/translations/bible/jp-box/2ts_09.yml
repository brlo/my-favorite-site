chapter: 9
draft: true

verses:
  1: "ダビデは言[い]った。「サウルの家[いえ]にまだ残[のこ]っている者[もの]がいるか。ヨナタンのゆえに、その者に慈[いつく]しみを行[おこな]いたい。」"
  2: "サウルの家[いえ]に、ツィバという名[な]のしもべがいた。人[ひと]々[びと]は彼[かれ]をダビデのところへ呼[よ]んだ。王[おう]は彼に言[い]った。「あなたがツィバか。」彼は言った。「わたしがあなたのしもべだ。」"
  3: "王[おう]は言[い]った。「サウルの家[いえ]にまだ男[おとこ]が残[のこ]っているか。その者に神[かみ]の慈[いつく]しみを行[おこな]いたい。」ツィバは王に言った。「ヨナタンにまだ息子[むすこ]がいる。足[あし]が不自由[ふじゆう]だ。」"
  4: "王[おう]は言[い]った。「彼[かれ]はどこにいるのか。」ツィバは王に言った。「見[み]よ、ロデバルのアミエルの子[こ]マキルの家[いえ]にいる。」"
  5: "ダビデ王[おう]は使者[ししゃ]を遣[つか]わし、彼[かれ]をロデバルのアミエルの子[こ]マキルの家[いえ]から連[つ]れ出[だ]させた。"
  6: "サウルの子[こ]ヨナタンの子メフィボシェトはダビデ王[おう]のもとに来[き]て、顔[かお]を地[ち]につけて伏[ふ]し、彼[かれ]に礼[れい]をした。ダビデは彼に言[い]った。「メフィボシェト。」彼は言った。「見[み]よ、あなたのしもべだ。」"
  7: "ダビデは彼[かれ]に言[い]った。「恐[おそ]れるな。あなたの父[ちち]ヨナタンのゆえに、わたしは必[かなら]ずあなたに慈[いつく]しみを行[おこな]う。あなたの祖父[そふ]サウルの畑[はたけ]をすべてあなたに返[かえ]す。あなたはいつもわたしの食卓[しょくたく]でパンを食[た]べる。」"
  8: "メフィボシェトは礼[れい]をして言[い]った。「あなたのしもべは何者[なにもの]だろうか。あなたが、死[し]んだ犬[いぬ]のようなこのわたしに目[め]を留[と]められるとは。」"
  9: "王[おう]はサウルのしもべツィバを呼[よ]んで言[い]った。「サウルとその家[いえ]のすべてのものは、わたしがあなたの主人[しゅじん]の子[こ]に与[あた]えた。"
  10: "あなたも、あなたの息子[むすこ]たちも、あなたのしもべたちも、彼[かれ]のために土地[とち]を耕[たがや]しなさい。そして、あなたの主人[しゅじん]の子[こ]にパンを持[も]って来[き]て、彼に食[た]べさせなさい。あなたの主人の子メフィボシェトは、いつもわたしの食卓[しょくたく]でパンを食べる。」ツィバには十五人[じゅうごにん]の息子と二十人[にじゅうにん]のしもべがいた。"
  11: "ツィバは王[おう]に言[い]った。「わたしの主人[しゅじん]である王がそのしもべに命[めい]じたすべてのことを、あなたのしもべはそのとおりに行[おこな]う。」メフィボシェトは、王の子[こ]の一人[ひとり]のように、ダビデの食卓[しょくたく]で食[た]べていた。"
  12: "メフィボシェトには幼[おさな]い息子[むすこ]があり、名[な]はミカといった。ツィバの家[いえ]に住[す]む者[もの]はすべて、メフィボシェトのしもべであった。"
  13: "メフィボシェトはエルサレムに住[す]んでいた。いつも王[おう]の食卓[しょくたく]で食[た]べていたからである。彼[かれ]は両足[りょうあし]とも不自由[ふじゆう]であった。"

notes:
  1: "Εἰ ἔστιν ἔτι ὑπολελειμμένος — есть ли ещё оставшийся (ὑπολείπω). τῷ οἴκῳ Σαουλ — у дома Саула. ποιήσω μετ᾽ αὐτοῦ ἔλεος — сотворю с ним милость. ἕνεκεν Ιωναθαν — ради Ионафана."
  2: "παῖς ἦν — был слуга (παῖς; слав. «отрок»). ὄνομα αὐτῷ Σιβα — имя ему Сива (ツィバ). καλοῦσιν αὐτὸν πρὸς Δαυιδ — зовут его к Давиду. Εἰ σὺ εἶ Σιβα; — ты ли Сива? Ἐγὼ δοῦλος σός — я раб твой."
  3: "Εἰ ὑπολέλειπται — остался ли. ἀνὴρ — мужчина, человек. ἔλεος θεοῦ — милость Божия. υἱὸς τῷ Ιωναθαν — сын у Ионафана. πεπληγὼς τοὺς πόδας — «поражённый в ноги», хромой (πλήσσω)."
  4: "Ποῦ οὗτος; — где он? Ἰδοὺ ἐν οἴκῳ Μαχιρ — вот, в доме Махира (マキル). υἱοῦ Αμιηλ — сына Амиила (アミエル). ἐκ τῆς Λαδαβαρ — из Ладавара (ロデバル)."
  5: "ἀπέστειλεν ὁ βασιλεὺς Δαυιδ — послал царь Давид. ἔλαβεν αὐτὸν — взял его, велел привести."
  6: "παραγίνεται — приходит, прибыл. ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ — пал на лицо своё. προσεκύνησεν — поклонился (προσκυνέω; здесь не богопочитание, а поклон подданного). Μεμφιβοσθε — Мемфивосфей. Ἰδοὺ ὁ δοῦλός σου — вот раб твой."
  7: "Μὴ φοβοῦ — не бойся. ποιῶν ποιήσω — «творя сотворю», непременно сотворю (усиление). διὰ Ιωναθαν τὸν πατέρα σου — ради Ионафана, отца твоего. ἀποκαταστήσω — возвращу, восстановлю (ἀποκαθίστημι). πάντα ἀγρὸν Σαουλ — всё поле Саула; в csl «вся села» (поля, селения). πατρὸς τοῦ πατρός σου — отца отца твоего, деда (祖父). ἄρτον ἐπὶ τῆς τραπέζης μου — хлеб за столом моим. διὰ παντός — всегда."
  8: "προσεκύνησεν — поклонился. Τίς εἰμι ὁ δοῦλός σου — кто я, раб твой. ἐπέβλεψας — призрел, обратил взор (ἐπιβλέπω). κύνα τὸν τεθνηκότα — мёртвого пса (самоуничижение). ὅμοιον ἐμοί — подобного мне."
  9: "ἐκάλεσεν … τὸ παιδάριον Σαουλ — призвал отрока, слугу Саула (παιδάριον). δέδωκα — дал, отдал. τῷ υἱῷ τοῦ κυρίου σου — сыну господина твоего."
  10: "ἐργᾷ αὐτῷ τὴν γῆν — будешь обрабатывать для него землю (ἐργάζομαι). εἰσοίσεις … ἄρτους — внесёшь хлебы, т. е. урожай. ἔδεται αὐτούς — он будет есть их. φάγεται διὰ παντός — будет есть всегда. Последнее предложение (καὶ τῷ Σιβα ἦσαν …) в gr-lxx-byz стоит в квадратных скобках критического издания, в csl и ru есть — переведено в основном тексте. πεντεκαίδεκα υἱοί — пятнадцать сыновей. εἴκοσι δοῦλοι — двадцать рабов."
  11: "Κατὰ πάντα, ὅσα ἐντέταλται — по всему, что заповедал (ἐντέλλομαι). οὕτως ποιήσει ὁ δοῦλός σου — так сделает раб твой. ἤσθιεν — ел (ἐσθίω, имперфект). καθὼς εἷς τῶν υἱῶν τοῦ βασιλέως — как один из сыновей царя."
  12: "υἱὸς μικρὸς — малый сын, малолетний. Μιχα — Миха (ミカ). πᾶσα ἡ κατοίκησις — всё обитание, все живущие (κατοίκησις). δοῦλοι τοῦ Μεμφιβοσθε — рабы Мемфивосфея."
  13: "κατῴκει ἐν Ιερουσαλημ — жил в Иерусалиме. ἐπὶ τῆς τραπέζης τοῦ βασιλέως — за столом царя. χωλὸς ἀμφοτέροις τοῖς ποσίν — хромой обеими ногами (χωλός)."
