# jp-box, 2-я Царств, глава 9. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); по новому паритету церковнославянский (csl-ru) —
# второй свидетель церковного текста: его чтения и добавления входят в основной
# текст без 〔…〕, отличия LXX — в notes. ru (Синодальный) — только для понимания.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 9: милость Давида дому Саула ради Ионафана: вопрос (1), Зива (2–5),
# Мемфивосфей (6), обетование о полях и столе (7), смирение (8), распоряжение
# Зиве (9–11), сын Миха (12), жизнь в Иерусалиме (13).
# Речь — 「…」: 9:1, 9:2, 9:3, 9:4, 9:6, 9:7, 9:8, 9:9–10, 9:11. Красного нет.
# 〔…〕 нет: последнее предложение 9:10 стоит в gr-lxx-byz в квадратных скобках
# критического издания, но есть в csl и ru — переведено в основном тексте.
# Сносок ⟨…⟩ нет: 契約の箱, 祭司, 廷臣 уже в корпусе; メフィボシェト, ツィバ
# даны в терминологии корпуса.
# Отличия LXX/csl: 9:2 παῖς — «отрок, слуга» (слав. «отрок»); 9:3 «поражённый
# в ноги» — хромой; 9:7 в csl «вся села» (поля), в LXX ἀγρός — поле.
# jp-ni не использовался.

