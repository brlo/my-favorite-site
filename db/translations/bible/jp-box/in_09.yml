# jp-box, Евангелие от Иоанна, глава 9.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 9: слепорождённый (1–12), исцеление в субботу и допрос у фарисеев (13–17),
# родители и «отлучат от синагоги» (18–23), второй допрос и изгнание (24–34),
# «веруешь ли в Сына Божия» и поклонение (35–38), суд и слепота (39–41).
# Red — только слова Христа (3–5, 7, 35, 37, 39, 41); речи учеников, соседей, фарисеев,
# родителей и слепого — не красные.
# jp-ni не использовался.

