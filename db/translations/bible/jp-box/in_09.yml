verses:
  1: "イエスは通[とお]りがけに、生[う]まれつき目[め]の見[み]えない人[ひと]をご覧[らん]になった。"
  2: "弟子[でし]たちがイエスに問[と]うて言[い]った。「ラビ、この人[ひと]が目[め]の見[み]えない者[もの]として生[う]まれたのは、だれが罪[つみ]を犯[おか]したためですか。この人[ひと]ですか、それとも両親[りょうしん]ですか。」"
  3: "イエスは答[こた]えられた。「<j>この人[ひと]も両親[りょうしん]も罪[つみ]を犯[おか]していない。この人[ひと]に神[かみ]の業[わざ]が現[あらわ]れるためである。</j>"
  4: "<j>わたしたちは、わたしを遣[つか]わした方[かた]の業[わざ]を、昼[ひる]の間[あいだ]に行[おこな]わなければならない。だれも働[はたら]くことができない夜[よる]が来[く]る。</j>"
  5: "<j>わたしが世[よ]にいる間[あいだ]は、わたしは世[よ]の光[ひかり]である。</j>」"
  6: "こう言[い]って、イエスは地面[じめん]に唾[つば]をし、その唾[つば]で泥[どろ]を作[つく]り、泥[どろ]をその人[ひと]の目[め]に塗[ぬ]って、"
  7: "言[い]われた。「<j>行[い]って、シロアム⟨エルサレムの南[みなみ]にある池[いけ]。⟩、すなわち『遣[つか]わされた者[もの]』という意味[いみ]の名[な]の池[いけ]で洗[あら]いなさい。</j>」そこで、その人[ひと]は行[い]って洗[あら]い、見[み]えるようになって帰[かえ]って来[き]た。"
  8: "近所[きんじょ]の人[ひと]たちや、以前[いぜん]に彼[かれ]が物乞[ものご]いをしていたのを見[み]ていた者[もの]たちが言[い]った。「こちらに座[すわ]って物乞[ものご]いをしていた者[もの]ではないか。」"
  9: "ある者[もの]たちは「その人[ひと]だ」と言[い]い、ほかの者[もの]たちは「いや、その人[ひと]に似[に]ているだけだ」と言[い]った。彼[かれ]自身[じしん]は「わたしがその人[ひと]だ」と言[い]っていた。"
  10: "そこで彼[かれ]らは言[い]った。「では、どうして目[め]が開[ひら]いたのですか。」"
  11: "彼[かれ]は答[こた]えた。「イエスという人[ひと]が泥[どろ]を作[つく]ってわたしの目[め]に塗[ぬ]り、『シロアムの池[いけ]へ行[い]って洗[あら]いなさい』と言[い]いました。そこで行[い]って洗[あら]うと、見[み]えるようになりました。」"
  12: "彼[かれ]らは言[い]った。「その人[ひと]はどこにいますか。」彼[かれ]は言[い]った。「知[し]りません。」"
  13: "彼[かれ]らは、かつて目[め]の見[み]えなかったその人[ひと]を、ファリサイ派[は]の人々[ひとびと]のもとへ連[つ]れて行[い]った。"
  14: "イエスが泥[どろ]を作[つく]って、その人[ひと]の目[め]を開[ひら]かれた日[ひ]は、安息日[あんそくび]であった。"
  15: "そこでファリサイ派[は]の人々[ひとびと]も、どうして見[み]えるようになったのかと、また彼[かれ]に問[と]うた。彼[かれ]は言[い]った。「あの人[ひと]がわたしの目[め]に泥[どろ]を置[お]き、わたしが洗[あら]うと、見[み]えるようになりました。」"
  16: "ファリサイ派[は]の人々[ひとびと]のうちのある者[もの]たちは言[い]った。「この人[ひと]は神[かみ]から来[き]た者[もの]ではない。安息日[あんそくび]を守[まも]っていないからだ。」ほかの者[もの]たちは言[い]った。「罪[つみ]のある人[ひと]が、どうしてこのようなしるしを行[おこな]えるだろうか。」そして、彼[かれ]らの間[あいだ]に分裂[ぶんれつ]が生[しょう]じた。"
  17: "そこで彼[かれ]らは、目[め]の見[み]えなかった人[ひと]にまた言[い]った。「あの人[ひと]があなたの目[め]を開[ひら]いたのだが、あなたはあの人[ひと]をどう思[おも]いますか。」彼[かれ]は言[い]った。「預言者[よげんしゃ]です。」"
  18: "ユダヤ人[じん]たちは、彼[かれ]が目[め]の見[み]えない者[もの]であったこと、そして見[み]えるようになったことを信[しん]じなかった。ついに、見[み]えるようになった人[ひと]の両親[りょうしん]を呼[よ]び出[だ]して、"
  19: "尋[たず]ねて言[い]った。「これはあなたがたの子[こ]ですか。目[め]の見[み]えない者[もの]として生[う]まれたと、あなたがたが言[い]う者[もの]は。今[いま]はどうして見[み]えるのですか。」"
  20: "両親[りょうしん]は答[こた]えて言[い]った。「これはわたしたちの子[こ]であること、目[め]の見[み]えない者[もの]として生[う]まれたことは、わたしたちも知[し]っています。"
  21: "しかし、今[いま]どうして見[み]えるのかは知[し]りません。だれがその目[め]を開[ひら]いたのかも知[し]りません。本人[ほんにん]に聞[き]いてください。もう大人[おとな]なのですから、自分[じぶん]のことを自分[じぶん]で話[はな]すでしょう。」"
  22: "両親[りょうしん]がこう言[い]ったのは、ユダヤ人[じん]たちを恐[おそ]れたからである。ユダヤ人[じん]たちはすでに、イエスをキリストと公[おおやけ]に言[い]い表[あらわ]す者[もの]は会堂[かいどう]から追[お]い出[だ]す、と決[き]めていた。"
  23: "それで、両親[りょうしん]は「もう大人[おとな]なのだから、本人[ほんにん]に聞[き]いてください」と言[い]ったのである。"
  24: "そこで彼[かれ]らは、もと目[め]の見[み]えなかった人[ひと]を二度目[にどめ]に呼[よ]んで言[い]った。「神[かみ]に栄光[えいこう]を帰[き]せよ。わたしたちは、あの男[おとこ]が罪人[ざいにん]であることを知[し]っている。」"
  25: "彼[かれ]は答[こた]えた。「罪人[ざいにん]かどうかは知[し]りません。ただ一[ひと]つのことを知[し]っています。わたしは目[め]が見[み]えなかったが、今[いま]は見[み]えます。」"
  26: "そこで彼[かれ]らは言[い]った。「あの人[ひと]はあなたに何[なに]をしたのですか。どうしてあなたの目[め]を開[ひら]いたのですか。」"
  27: "彼[かれ]は答[こた]えた。「もう話[はな]したのに、あなたがたは聞[き]きませんでした。なぜ、また聞[き]きたがるのですか。あなたがたも、あの人[ひと]の弟子[でし]になりたいのですか。」"
  28: "彼[かれ]らは彼[かれ]をののしって言[い]った。「あなたはあの男[おとこ]の弟子[でし]だ。わたしたちはモーセの弟子[でし]である。"
  29: "神[かみ]がモーセに語[かた]られたことは知[し]っている。だが、この人[ひと]がどこから来[き]た者[もの]かは知[し]らない。」"
  30: "その人[ひと]は答[こた]えて言[い]った。「不思議[ふしぎ]なのは、あなたがたがあの人[ひと]のどこから来[き]た者[もの]かも知[し]らないのに、あの人[ひと]がわたしの目[め]を開[ひら]いたことです。"
  31: "神[かみ]が罪人[ざいにん]の言[こと]を聞[き]かれないことは、わたしたちも知[し]っています。神[かみ]を敬[うやま]い、その御心[みこころ]を行[おこな]う者[もの]の言[こと]は聞[き]かれます。"
  32: "生[う]まれつき目[め]の見[み]えない者[もの]の目[め]を開[ひら]いた者[もの]があるとは、世[よ]の初[はじ]めから聞[き]いたことがありません。"
  33: "あの人[ひと]が神[かみ]から来[き]た者[もの]でなければ、何[なに]もできなかったはずです。」"
  34: "彼[かれ]らは答[こた]えて言[い]った。「あなたは全[まった]く罪[つみ]のうちに生[う]まれた者[もの]なのに、わたしたちを教[おし]えようというのか。」そして、彼[かれ]を外[そと]へ追[お]い出[だ]した。"
  35: "イエスは、彼[かれ]らがその人[ひと]を外[そと]へ追[お]い出[だ]したことを聞[き]かれた。そして、その人[ひと]を見[み]つけて言[い]われた。「<j>あなたは神[かみ]の子[こ]を信[しん]じるか。</j>」"
  36: "彼[かれ]は答[こた]えて言[い]った。「主[しゅ]よ、その方[かた]はどなたですか。その方[かた]を信[しん]じることができるように。」"
  37: "イエスは言[い]われた。「<j>あなたはその方[かた]を見[み]た。あなたと語[かた]っている者[もの]が、その方[かた]である。</j>」"
  38: "彼[かれ]は言[い]った。「主[しゅ]よ、わたしは信[しん]じます。」そして、イエスを拝[おが]んだ。"
  39: "イエスは言[い]われた。「<j>わたしは裁[さば]きのために、この世[よ]に来[き]た。見[み]えない者[もの]が見[み]えるようになり、見[み]える者[もの]が目[め]の見[み]えない者[もの]となるためである。</j>」"
  40: "イエスと一緒[いっしょ]にいたファリサイ派[は]の人々[ひとびと]のうちのある者[もの]たちが、これを聞[き]いて言[い]った。「わたしたちも目[め]の見[み]えない者[もの]なのですか。」"
  41: "イエスは言[い]われた。「<j>もしあなたがたが目[め]の見[み]えない者[もの]なら、罪[つみ]はなかったであろう。しかし今[いま]、『わたしたちは見[み]える』と言[い]うので、あなたがたの罪[つみ]は残[のこ]っている。</j>」"

notes:
  2: "Вопрос учеников буквально: «кто согрешил — он или родители его, что слепым родился?»; だれが罪を犯したためですか — без сглаживания."
  3: "ἀλλ' ἵνα φανερωθῇ — «но чтобы явились дела Божии»; ためである, без пояснений, как в тексте."
  4: "ἡμᾶς — «нам» (мн. ч.), как в критическом тексте; часть рукописей читает με (Мк 1:38; ср. Ин 4:34). Передано わたしたち."
  7: "Сноска на シロアム: первое упоминание в корпусе, реалия неочевидна. Толкование имени («Посланный») евангелист даёт в тексте — すなわち…という意味の名."
  11: "Речь слепого, не красная. Вложенная цитата — 『』."
  22: "ἀποσυνάγωγος γένηται — «да будет отлучён от синагоги»; 会堂から追い出す. Такое решение уже было принято — ἤδη συνετέθειντο."
  24: "δὸς δόξαν τῷ θεῷ — «воздай славу Богу», формула заклятия при допросе: признайся; 神に栄光を帰せよ."
  35: "В критической базе υἱὸν τοῦ ἀνθρώπου («Сын Человеческий»); Церковь (Елизаветинская, jp-joc «神の子») читает υἱὸν τοῦ θεοῦ — 神の子, без 〔〕 (замена, а не добавка, как Мк 1:2)."
  38: "προσεκύνησεν — «пал ниц, поклонился»; 拝んだ. В части рукописей стиха нет; Церковь читает его."
  39: "κρίμα — «суд, осуждение»; 裁き. Слепота и зрение — не только телесные; 見えない者/見える者 сохранено буквально."
  41: "ἡ ἁμαρτία ὑμῶν μένει — «грех ваш пребывает»; 罪は残っている."
