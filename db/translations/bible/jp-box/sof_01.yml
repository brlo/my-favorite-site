# jp-box, Софония, глава 1. Черновик для приёмки.
#
# Нумерация — по славяно-синодальной: наш 1:1–18 = gr 1:1–18 и csl 1:1–18, стих в стих.
# В книге 53 стиха (1: 18, 2: 15, 3: 20).
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1 надписание; 2–3 всеобщее истребление с лица земли; 4–6 суд над
# Иудой: Ваал, жрецы, воинство небесное, отступившие; 7–8 близок день Господень,
# жертва, князья и дом царский; 9–11 предвратные, вопль у ворот, «плачьте,
# живущие в посечённой»; 12–13 со светильником, «не делает Господь ни добра,
# ни зла», дома и виноградники; 14–16 день гнева, трубы и вопля; 17–18 слепые,
# серебро не спасёт, огонь ревности.
# Голоса: 1 — надписание; 2–6 — слово Господа в 「…» (в 2 и 3 «говорит Господь»
# внутри речи; во 2 двоеточие слав. не закрывает речь); 7 — речь пророка;
# 8–18 — слово Господа в 「…» (в 12 слова нерадящих — 『…』).
# 1:3: слав. добавляет «да изнемогут нечестивии, и изиму беззаконныя» — нет в LXX,
# внесено как церковное чтение (悪い者たちは弱り果て…).
# 1:4: слав. добавляет «со жерцами» (с жрецами) — нет в LXX, внесено.
# 1:5: «воинство небесное» — στρατιά τοῦ οὐρανοῦ, поклонение светилам на кровлях.
# 1:7: εὐλαβεῖσθε — «благоговейте/убоитесь»; в ru/МТ «умолкни» — не внесено.
# 1:9: слав. «предвратныя» — «привратные»; в ru/МТ «перепрыгивают через порог» —
# иное чтение, не внесено.
# 1:15: слав. «Силен день гнева день той» — «силён день гнева, день тот»; в тексте
# «その日は怒りの日」 (греч. ἡμέρα ὀργῆς ἡ ἡμέρα ἐκείνη).
#
