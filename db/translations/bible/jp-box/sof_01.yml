verses:
  1: "主[しゅ]の言葉[ことば]。これはヒゼキヤの子[こ]アマルヤの子[こ]ゲダルヤの子[こ]クシの子[こ]であるソフォニヤに臨[のぞ]んだ。ユダの王[おう]、アモンの子[こ]ヨシヤの時代[じだい]のことである。"
  2: "「乏[とぼ]しくして乏[とぼ]しくさせよ、地[ち]の面[おもて]からすべてのものを、と主[しゅ]は言[い]われる。"
  3: "人[ひと]を乏[とぼ]しくさせ、家畜[かちく]を乏[とぼ]しくさせ、空[そら]の鳥[とり]と海[うみ]の魚[さかな]を乏[とぼ]しくさせよ。悪[わる]い者[もの]たちは弱[よわ]り果[は]て、わたしは不法[ふほう]な者[もの]を地[ち]の面[おもて]から取[と]り除[のぞ]く、と主[しゅ]は言[い]われる。"
  4: "わたしは手[て]をユダとエルサレムのすべての住人[じゅうにん]に伸[の]ばし、この場所[ばしょ]からバアルの名[な]と、祭司[さいし]たちの名[な]を祭司[さいし]たちもろとも取[と]り除[のぞ]く。"
  5: "また、屋根[やね]の上[うえ]で天[てん]の軍[ぐん]勢[ぜい]を拝[はい]する者[もの]たち、主[しゅ]に誓[ちか]いながら、また自分[じぶん]の王[おう]に誓[ちか]う者[もの]たちを。"
  6: "また、主[しゅ]から離[はな]れ去[さ]り、主[しゅ]を求[もと]めず、主[しゅ]にすがらない者[もの]たちを」。"
  7: "主[しゅ]なる神[かみ]の前[まえ]に恐[おそ]れよ。主[しゅ]の日[ひ]が近[ちか]いからである。主[しゅ]はいけにえを備[そな]え、招[まね]いた者[もの]たちを聖[きよ]めた。"
  8: "「主[しゅ]のいけにえの日[ひ]に、わたしは君[きみ]たちと王[おう]の家[いえ]と、異[い]国[こく]の衣[ころも]をまとうすべての者[もの]を罰[ばつ]する。"
  9: "その日[ひ]、わたしはすべての者[もの]を、すなわち門[もん]の前[まえ]の者[もの]たち、自分[じぶん]たちの神[かみ]である主[しゅ]の家[いえ]を不法[ふほう]と欺[あざむ]きで満[み]たす者[もの]たちを罰[ばつ]する。"
  10: "その日[ひ]、と主[しゅ]は言[い]われる、叫[さけ]び声[ごえ]が突[つ]き刺[さ]す者[もの]の門[もん]から、泣[な]き声[ごえ]が第二[だいに]の門[もん]から、大[おお]きな破[やぶ]れが丘[おか]から起[お]こる。"
  11: "削[けず]られた所[ところ]に住[す]む者[もの]たちよ、泣[な]け。すべての民[たみ]はカナンに似[に]てしまい、銀[ぎん]を誇[ほこ]る者[もの]はすべて絶[た]やされる。"
  12: "その日[ひ]、わたしはともし火[び]をもってエルサレムを探[さが]し、自分[じぶん]の見張[みは]りを怠[おこた]る男[おとこ]たち、心[こころ]のうちで『主[しゅ]は良[よ]いことも悪[わる]いこともなさらない』と言[い]う者[もの]たちを罰[ばつ]する。"
  13: "彼らの力[ちから]は奪[うば]われ、その家[いえ]は荒[あ]れ果[は]てる。彼らは家[いえ]を建[た]てても住[す]まず、ぶどう畑[ばたけ]を植[う]えてもそのぶどう酒[しゅ]を飲[の]まない。"
  14: "主[しゅ]の大[おお]きな日[ひ]が近[ちか]い。近[ちか]く、しかも非常[ひじょう]に速[はや]い。主[しゅ]の日[ひ]の声[こえ]は苦[にが]く、激[はげ]しく、強[つよ]く定[さだ]められている。"
  15: "その日[ひ]は怒[いか]りの日[ひ]、苦[くる]しみと切迫[せっぱく]の日[ひ]、荒[あ]れと滅[ほろ]びの日[ひ]、闇[やみ]と暗[くら]さの日[ひ]、雲[くも]と霧[きり]の日[ひ]、"
  16: "角笛[つのぶえ]と叫[さけ]びの日[ひ]、堅[かた]い都[みやこ]と高[たか]い角[かど]に向[む]かって。"
  17: "わたしは人[ひと]を苦[くる]しめ、彼らは盲人[もうじん]のように歩[あゆ]む。彼らは主[しゅ]に罪[つみ]を犯[おか]したからである。その血[ち]は塵[ちり]のように、その肉[にく]は糞[ふん]のように注[そそ]がれる。"
  18: "彼らの銀[ぎん]も金[きん]も、主[しゅ]の怒[いか]りの日[ひ]に彼らを救[すく]い出[だ]すことはできない。主[しゅ]の妬[ねた]みの火[ひ]は全[ぜん]地[ち]を焼[や]き尽[つ]くす。主[しゅ]は地[ち]に住[す]むすべての者[もの]に完全[かんぜん]な破[やぶ]れを速[すみ]やかに臨[のぞ]ませるからである」。"

notes:
  1: "Λόγος κυρίου, ὃς ἐγενήθη πρὸς Σοφονιαν — «слово Господне, которое было к Софонии» (Σοφονιας — ソフォニヤ); τὸν τοῦ Χουσι υἱὸν Γοδολιου τοῦ Αμαριου τοῦ Εζεκιου — «сына Хусия, сына Годолии, сына Амарии, сына Езекии» (クシ, ゲダルヤ, アマルヤ, ヒゼキヤ); ἐν ἡμέραις Ιωσιου υἱοῦ Αμων βασιλέως Ιουδα — «во дни Иосии, сына Аммона, царя Иудина» (ヨシヤ, アモン). Надписание вне кавычек."
  2: "Ἐκλείψει ἐκλιπέτω πάντα ἀπὸ προσώπου τῆς γῆς — «оскудением да оскудеют все от лица земли» (ἐκλείπω — исчезать, 乏しくなる): усилительная конструкция (имя действия + императив), передана удвоением; λέγει κύριος — «говорит Господь» (внутри речи, двоеточие слав. речь не закрывает)."
  3: "ἐκλιπέτω ἄνθρωπος καὶ κτήνη — «да оскудеет человек и скот» (κτῆνος — скот, 家畜); τὰ πετεινὰ τοῦ οὐρανοῦ — «птицы небесные»; οἱ ἰχθύες τῆς θαλάσσης — «рыбы морские»; ἐξαρῶ τοὺς ἀνθρώπους ἀπὸ προσώπου τῆς γῆς — «изыму людей с лица земли». Слав. добавляет «да изнемогут нечестивии, и изиму беззаконныя» — нет в LXX, внесено как церковное чтение (悪い者たちは弱り果て…)."
  4: "ἐκτενῶ τὴν χεῖρά μου ἐπὶ Ιουδαν — «простру руку Мою на Иуду»; ἐξαρῶ ἐκ τοῦ τόπου τούτου τὰ ὀνόματα τῆς Βααλ — «изыму с места сего имена Ваала» (Βααλ — バアル); τὰ ὀνόματα τῶν ἱερέων — «имена священников»; слав. добавляет «со жерцами» (с жрецами) — нет в LXX, внесено."
  5: "τοὺς προσκυνοῦντας ἐπὶ τὰ δώματα τῇ στρατιᾷ τοῦ οὐρανοῦ — «поклоняющихся на кровлях воинству небесному» (δῶμα — кровля, 屋根; στρατιά — воинство, 軍勢); τοὺς ὀμνύοντας κατὰ τοῦ κυρίου — «клянущихся Господом» (ὀμνύω — клясться, 誓う); τοὺς ὀμνύοντας κατὰ τοῦ βασιλέως αὐτῶν — «клянущихся царём своим»."
  6: "τοὺς ἐκκλίνοντας ἀπὸ τοῦ κυρίου — «уклоняющихся от Господа» (ἐκκλίνω — уклоняться, 離れ去る); τοὺς μὴ ζητήσαντας τὸν κύριον — «не искавших Господа»; τοὺς μὴ ἀντεχομένους τοῦ κυρίου — «не держащихся Господа» (ἀντέχομαι — держаться, すがる). Здесь слово Господа закрывается."
  7: "Εὐλαβεῖσθε ἀπὸ προσώπου κυρίου τοῦ θεοῦ — «благоговейте пред лицом Господа Бога» (εὐλαβέομαι — благоговеть, 恐れる; слав. «убойтеся»; в ru/МТ «умолкни» — иное чтение, не внесено); ἐγγὺς ἡ ἡμέρα τοῦ κυρίου — «близок день Господень»; ἡτοίμακεν κύριος τὴν θυσίαν αὐτοῦ — «приготовил Господь жертву Свою»; ἡγίακεν τοὺς κλητοὺς αὐτοῦ — «освятил званых Своих» (κλητός — званый, 招いた者)."
  8: "ἐν ἡμέρᾳ θυσίας κυρίου — «в день жертвы Господней»; ἐκδικήσω ἐπὶ τοὺς ἄρχοντας — «отмщу князьям» (ἐκδικέω — мстить, 罰する); ἐπὶ τὸν οἶκον τοῦ βασιλέως — «на дом царский»; τοὺς ἐνδεδυμένους ἐνδύματα ἀλλότρια — «одетых в одежды чужие» (ἀλλότριος — чужой, 異国の)."
  9: "ἐκδικήσω ἐπὶ πάντας ἐμφανῶς ἐπὶ τὰ πρόπυλα — «отмщу явно всем при преддверии» (ἐμφανῶς — явно, 明らかに; πρόπυλον — преддверие, 門の前); τοὺς πληροῦντας τὸν οἶκον κυρίου τοῦ θεοῦ αὐτῶν — «наполняющих дом Господа Бога своего»; ἀσεβείας καὶ δόλου — «нечестием и обманом» (δόλος — коварство, 欺き). В ru/МТ «перепрыгивают через порог» — иное чтение, не внесено."
  10: "φωνὴ κραυγῆς ἀπὸ πύλης ἀποκεντούντων — «голос вопля от ворот пронзающих (избодающих)» (ἀποκεντέω — прокалывать, 突き刺す; тёмное — вероятно, название ворот); ὀλολυγμὸς ἀπὸ τῆς δευτέρας — «плач от вторых (ворот)» (ὀλολυγμός — вопль, 泣き声); συντριμμὸς μέγας ἀπὸ τῶν βουνῶν — «великое сокрушение от холмов» (συντριμμός — сокрушение, 破れ)."
  11: "θρηνήσατε, οἱ κατοικοῦντες τὴν κατακεκομμένην — «плачьте, живущие в посечённой (разрубленной)» (κατακόπτω — разрубать, 削る; вероятно, квартал города); ὡμοιώθη πᾶς ὁ λαὸς Χανααν — «уподобился весь народ Ханаану» (Χανααν — カナン); ἐξωλεθρεύθησαν οἱ ἐπηρμένοι ἀργυρίῳ — «истреблены возвышающиеся серебром» (ἐπαίρω — возвышать, 誇る)."
  12: "ἐξερευνήσω τὴν Ιερουσαλημ μετὰ λύχνου — «изыщу Иерусалим со светильником» (λύχνος — светильник, ともし火); τοὺς καταφρονοῦντας ἐπὶ τὰ φυλάγματα αὐτῶν — «небрегущих о стражах своих» (καταφρονέω — презирать/небречь, 怠る; φύλαγμα — стража, 見張り); Οὐ μὴ ἀγαθοποιήσῃ κύριος οὐδ᾿ οὐ μὴ κακώσῃ — «не сделает Господь добра и не озлобит» (ἀγαθοποιέω — благотворить, 良いこと; κακόω — озлоблять, 悪いこと): слова их в 『…』."
  13: "ἡ δύναμις αὐτῶν εἰς διαρπαγήν — «сила их в расхищение» (διαρπαγή — расхищение, 奪われる); οἱ οἶκοι αὐτῶν εἰς ἀφανισμόν — «домы их в уничтожение»; οἰκοδομήσουσιν οἰκίας καὶ οὐ μὴ κατοικήσουσιν ἐν αὐταῖς — «построят дома и не будут жить в них»; καταφυτεύσουσιν ἀμπελῶνας καὶ οὐ μὴ πίωσιν τὸν οἶνον αὐτῶν — «насадят виноградники и не будут пить вина их»."
  14: "ἐγγὺς ἡ ἡμέρα κυρίου ἡ μεγάλη — «близок день Господень великий»; ἐγγὺς καὶ ταχεῖα σφόδρα — «близок и скор весьма» (ταχύς — скорый, 速い); φωνὴ ἡμέρας κυρίου πικρὰ καὶ σκληρά — «голос дня Господня горек и жесток» (πικρός — горький, 苦い; σκληρός — жёсткий, 激しい); τέτακται δυνατή — «учинился сильным (крепким)» (τάσσω — ставить, 定める). В ru/МТ «горько возопиет тогда и самый храбрый» — иное чтение, в текст не внесено."
  15: "ἡμέρα ὀργῆς ἡ ἡμέρα ἐκείνη — «день гнева — день тот»; ἡμέρα θλίψεως καὶ ἀνάγκης — «день скорби и нужды» (ἀνάγκη — нужда, 切迫); ἀωρίας καὶ ἀφανισμοῦ — «безвременья и исчезновения» (ἀωρία — безвременье, 荒れ); σκότους καὶ γνόφου — «тьмы и мрака» (γνόφος — мрак, 暗さ); νεφέλης καὶ ὁμίχλης — «облака и мглы» (ὁμίχλη — мгла, 霧)."
  16: "ἡμέρα σάλπιγγος καὶ κραυγῆς — «день трубы и вопля» (σάλπιγξ — труба, 角笛); ἐπὶ τὰς πόλεις τὰς ὀχυρὰς — «на города укреплённые» (ὀχυρός — крепкий, 堅い); ἐπὶ τὰς γωνίας τὰς ὑψηλάς — «на углы высокие» (γωνία — угол, 角)."
  17: "ἐκθλίψω τοὺς ἀνθρώπους — «стесню людей» (ἐκθλίβω — теснить, 苦しめる); πορεύσονται ὡς τυφλοί — «пойдут как слепые» (τυφλός — слепой, 盲人); τῷ κυρίῳ ἐξήμαρτον — «Господу согрешили»; ἐκχεεῖ τὸ αἷμα αὐτῶν ὡς χοῦν — «изольёт кровь их как прах» (χοῦς — прах, 塵); τὰς σάρκας αὐτῶν ὡς βόλβιτα — «плоти их как помёт» (βόλβιτον — навоз, 糞)."
  18: "τὸ ἀργύριον αὐτῶν καὶ τὸ χρυσίον αὐτῶν οὐ μὴ δύνηται ἐξελέσθαι αὐτοὺς — «серебро их и золото их не сможет избавить их» (ἐξαιρέω — избавлять, 救い出す); ἐν πυρὶ ζήλους αὐτοῦ καταναλωθήσεται πᾶσα ἡ γῆ — «огнём ревности Его пожрана будет вся земля» (ζῆλος — ревность, 妬み); συντέλειαν καὶ σπουδὴν ποιήσει — «совершение и поспешность сотворит» (σπουδή — поспешность, 速やか); ἐπὶ πάντας τοὺς κατοικοῦντας τὴν γῆν — «на всех живущих на земле». Здесь слово Господа закрывается."
