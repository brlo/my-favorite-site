verses:
  1: "ヨブは答[こた]えて言[い]った。"
  2: "「あなたはだれに味方[みかた]しているのか。だれを助[たす]けようというのか。力[ちから]強[づよ]い者[もの]を、強[つよ]い腕[うで]を持つ者を、助けようというのか。"
  3: "あなたはだれに助言[じょげん]したのか。すべての知恵[ちえ]を持つ者[もの]ではないか。あなたはだれに従[したが]うのか。最[もっと]も大[おお]きな力[ちから]を持つ者ではないか。"
  4: "あなたはだれに言葉[ことば]を告[つ]げたのか。あなたから出[で]た息[いき]は、だれのものなのか。"
  5: "巨人[きょじん]たちは、水[みず]の下[した]で、それに隣[となり]合[あ]う者[もの]たちとともに産[う]まれるのだろうか。"
  6: "よみは彼の前[まえ]に裸[はだか]であり、滅[ほろ]びには覆[おお]いがない。"
  7: "彼は北[きた]を何[なに]の上[うえ]にも広[ひろ]げ、地[ち]を何の上にも懸[か]けている。"
  8: "彼は水[みず]をその雲[くも]の中[なか]に縛[しば]り、雲はその下[した]で裂[さ]けない。"
  9: "彼は王座[おうざ]の面[おもて]を保[たも]ち、その上[うえ]にご自分[じぶん]の雲[くも]を広[ひろ]げる。"
  10: "彼は水[みず]の面[おもて]に、光[ひかり]の終[お]わりまで、闇[やみ]とともに境[さかい]を巡[めぐ]らした。"
  11: "天[てん]の柱[はしら]は打[う]ち広[ひろ]げられ、彼の叱[しか]りによって恐[おそ]れおののく。"
  12: "彼は力[ちから]によって海[うみ]を静[しず]め、巧[たく]みによって海の巨獣[きょじゅう]を刺[さ]し貫[つらぬ]いた。"
  13: "天[てん]の門[もん]の閂[かんぬき]は彼を恐[おそ]れる。彼はその命令[めいれい]によって、背[そむ]いた龍[りゅう]を死[し]に至[いた]らせた。"
  14: "見[み]よ、これらは彼の道[みち]の一部[いちぶ]にすぎない。わたしたちは彼について、言葉[ことば]の雫[しずく]ほどのことしか聞[き]けない。彼の雷[かみなり]の力[ちから]を、それがいつなされるのか、だれが知[し]っているだろうか。」"

notes:
  1: "Повествование. Ὑπολαβὼν δὲ Ιωβ λέγει — «И отвечал Иов и сказал»: исторический презенс λέγει. Формула вне кавычек; речь Иова открывается в ст. 2 и закрыта в конце ст. 14; следующая формула — 27:1. Это ответ Иова на речь Вилдада (гл. 25)."
  2: "Иов. Τίνι πρόσκεισαι ἢ τίνι μέλλεις βοηθεῖν — «кому ты привержен, или кому собираешься помогать?»: πρόσκειμαι — «быть приверженным, прилежать». πότερον οὐχ ᾧ πολλὴ ἰσχὺς καὶ ᾧ βραχίων κραταιός ἐστιν — «не тому ли, у кого великая сила и у кого мышца крепка?»: βραχίων — «мышца, рука». Ирония: не Богу ли, у которого силы довольно, Вилдад хочет помочь. В евр. и Синодальном «как ты помог бессильному» — масоретское чтение, в LXX и слав. иное; не вносим."
  3: "Иов. τίνι συμβεβούλευσαι — «кому ты дал совет?» (συμβουλεύομαι — совещаться, подавать совет). οὐχ ᾧ πᾶσα σοφία — «не тому ли, у кого вся премудрость?» τίνι ἐπακολουθήσεις — «за кем последуешь?»: ἐπακολουθέω — «следовать». Ирония продолжена; слав. «кому совет дал еси… кого поженеши»."
  4: "Иов. τίνι ἀνήγγειλας ῥήματα — «кому ты возвестил слова?»: ἀναγγέλλω — «возвещать». πνοὴ δὲ τίνος ἐστὶν ἡ ἐξελθοῦσα ἐκ σοῦ — «и дыхание чьё — вышедшее из тебя?»: πνοή — «дыхание». Вопрос об источнике его слов; тёмное место оставлено без пояснения."
  5: "Иов. μὴ γίγαντες μαιωθήσονται ὑποκάτωθεν ὕδατος — «разве исполины будут рождены под водой?»: γίγαντες — «исполины» (в евр. рефаимы); μαιόομαι — «быть повитым, рождаться», тёмный глагол, слав. «родятся». τῶν γειτόνων αὐτοῦ — «и соседей её», т. е. соседних с водой мест; в евр. и Синодальном «трепещут» — иное чтение, не вносим."
  6: "Иов. γυμνὸς ὁ ᾅδης ἐπώπιον αὐτοῦ — «наг ад пред Ним»: ᾅδης — よみ (ср. 1 Цар 2:6; Тов 13:2). οὐκ ἔστιν περιβόλαιον τῇ ἀπωλείᾳ — «нет покрывала погибели»: περιβόλαιον — «покрывало, одеяние»; ἀπώλεια — «погибель» (в евр. Аваддон). Слав. «наг ад пред ним, и несть покрывала пагубе»."
  7: "Иов. ἐκτείνων βορέαν ἐπ᾿ οὐδέν — «простирающий север ни на чём»: βορέας — «северный ветер, север»; ἐπί с винитивом — «на». κρεμάζων γῆν ἐπὶ οὐδενός — «подвешивающий землю ни на чём». Образ мира, висящего в пустоте; слав. «простираяй север ни на чемже»."
  8: "Иов. δεσμεύων ὕδωρ ἐν νεφέλαις αὐτοῦ — «связующий воду в облаках Своих»: δεσμέω — «связывать». καὶ οὐκ ἐρράγη νέφος ὑποκάτω αὐτοῦ — «и не разорвалось облако под ним»: ῥήγνυμι — «разрывать». Чудо удержания вод в облаках; слав. «связуяй воду на облацех своих»."
  9: "Иов. ὁ κρατῶν πρόσωπον θρόνου — «держащий лицо престола», т. е. переднюю сторону престола; тёмное место, слав. «держай лице престола». ἐκπετάζων ἐπ᾿ αὐτὸν νέφος αὐτοῦ — «простирающий над ним Своё облако»: ἐκπετάζω — «распростирать». В Синодальном «поставил престол Свой» — иное понимание, не вносим."
  10: "Иов. πρόσταγμα ἐγύρωσεν ἐπὶ πρόσωπον ὕδατος — «повеление обвёл по лицу воды»: πρόσταγμα — «повеление, устав»; γυρόω — «обводить кругом». μέχρι συντελείας φωτὸς μετὰ σκότους — «до скончания света со тьмою»: граница света и тьмы на водах. В тексте 境 (граница) передаёт πρόσταγμα в этом контексте; слав. «повеление окружи на лице воды»."
  11: "Иов. στῦλοι οὐρανοῦ ἐπετάσθησαν — «столпы неба распростёрлись»: πετάννυμι — «распростирать»; слав. «столпи небеснии прострошася». ἐξέστησαν ἀπὸ τῆς ἐπιτιμήσεως αὐτοῦ — «ужаснулись от запрещения Его»: ἐπιτίμησις — «запрещение, угроза»; ἐξίστημι — «выходить из себя, ужасаться». В Синодальном «дрожат» — по масоретскому тексту."
  12: "Иов. ἰσχύι κατέπαυσεν τὴν θάλασσαν — «силою успокоил море»: καταπαύω — «утишать». ἐπιστήμῃ δὲ ἔτρωσε τὸ κῆτος — «и разумением поразил кита»: ἐπιστήμη — «знание, умение» (слав. «хитростию»); κῆτος — «морское чудовище, кит» (в евр. Рахав); ἔτρωσε — «ранил, поразил». Передано 巧み, чтобы не смешать с σοφία — 知恵."
  13: "Иов. κλεῖθρα δὲ οὐρανοῦ δεδοίκασιν αὐτόν — «засовы неба боятся Его»: κλεῖθρον — «запор, засов»; δεδοίκασιν — перфект от δείδω «бояться». προστάγματι δὲ ἐθανάτωσεν δράκοντα ἀποστάτην — «повелением умертвил дракона-отступника»: δράκων — «дракон, змей»; ἀποστάτης — «отступник» (в евр. «змей убегающий»). Тот же морской дракон, что Рахав/Левиафан; в тексте 龍, без отождествления."
  14: "Иов. ἰδοὺ ταῦτα μέρη ὁδοῦ αὐτοῦ — «вот, это части пути Его»: μέρος — «часть». ἐπὶ ἰκμάδα λόγου ἀκουσόμεθα ἐν αὐτῷ — «о капле слова услышим в Нём»: ἰκμάς — «влага, капля», т. е. лишь малая доля. σθένος δὲ βροντῆς αὐτοῦ τίς οἶδεν ὁπότε ποιήσει — «силу грома Его кто знает, когда Он сотворит?»: σθένος — «сила», βροντή — «гром». Глава завершается вопросом; цитата закрыта."
