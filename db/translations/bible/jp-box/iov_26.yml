# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc в книге только 1–2; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 26: ответ Иова Вилдаду, 2–14. Ст. 1 — формула (повествование), вне кавычек;
# речь Иова 2–14 — одна цитата 「…」, закрыта в конце главы. В ст. 2–4 ирония:
# Вилдад «помогает» всесильному Богу; ст. 5–14 — картина власти Бога над бездной,
# водами, небом и морем. Красного и синего нет.
# Нумерация по gr: 14 стихов; деление совпадает с csl-ru и ru.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz. Сносок ⟨…⟩ нет.
# Имена — транслитерация греческого (LXX).

