verses:
  1: "「あなたの神[かみ]である主[しゅ]があなたに嗣業[しぎょう]として与[あた]える地[ち]で、殺[ころ]された者[もの]が野[の]に伏[ふ]しているのが見[み]つかり、誰[だれ]が殺したのか分[わ]からないなら、"
  2: "あなたの長老[ちょうろう]たちと裁[さば]き人[びと]たちが出[で]て行[い]き、殺[ころ]された者[もの]の周[まわ]りの町々[まちまち]までの距離[きょり]を測[はか]りなさい。"
  3: "その殺[ころ]された者[もの]に最[もっと]も近[ちか]い町[まち]の長老[ちょうろう]たちは、牛[うし]の群[む]れから、まだ働[はたら]いたことがなく、くびきを引[ひ]いたこともない若[わか]い雌牛[めすうし]を取[と]りなさい。"
  4: "その町[まち]の長老[ちょうろう]たちは、その雌牛[めすうし]を、耕[たがや]されず種[たね]も蒔[ま]かれていない荒[あ]れた谷[たに]へ連[つ]れて下[お]り、その谷で雌牛の首[くび]の筋[すじ]を切[き]りなさい。"
  5: "祭司[さいし]であるレビ人[びと]たちが近[ちか]づきなさい。あなたの神[かみ]である主[しゅ]が、ご自身[じしん]の前[まえ]に立[た]ち、その名[な]によって祝福[しゅくふく]するために彼[かれ]らを選[えら]ばれたからである。すべての争[あらそ]いごとと、すべての皮膚[ひふ]の病[やまい]の判定[はんてい]は、彼らの口[くち]による。"
  6: "その町[まち]の長老[ちょうろう]たち、すなわち殺[ころ]された者[もの]に近[ちか]い者たちはみな、谷[たに]で首[くび]の筋[すじ]を切[き]られたその雌牛[めすうし]の頭[あたま]の上[うえ]で、自分[じぶん]の手[て]を洗[あら]いなさい。"
  7: "そして彼[かれ]らは答[こた]えて言[い]う。『わたしたちの手[て]はこの血[ち]を流[なが]していない。わたしたちの目[め]は見[み]ていない。』"
  8: "『主[しゅ]よ、あなたがエジプトの地[ち]から贖[あがな]い出[だ]されたあなたの民[たみ]、イスラエルに憐[あわ]れみをお与[あた]えください。あなたの民イスラエルの間[あいだ]に、罪[つみ]のない血[ち]の責[せき]が及[およ]びませんように。』そうすれば、その血は彼らのために清[きよ]められる。"
  9: "あなたは、あなたの神[かみ]である主[しゅ]の前[まえ]で良[よ]いこと、喜[よろこ]ばれることを行[おこな]うなら、あなたがたの間[あいだ]から罪[つみ]のない血[ち]を除[のぞ]き去[さ]りなさい。"
  10: "あなたが敵[てき]との戦[たたか]いに出[で]て行[い]き、あなたの神[かみ]である主[しゅ]が彼[かれ]らをあなたの手[て]に渡[わた]され、あなたが彼らの捕[ほ]り物[もの]を取[と]るなら、"
  11: "捕[ほ]り物[もの]のうちに、姿[すがた]の美[うつく]しい女[おんな]を見[み]て、彼女[かのじょ]を欲[ほ]しく思[おも]い、自分[じぶん]の妻[つま]に迎[むか]えようとするなら、"
  12: "彼女[かのじょ]をあなたの家[いえ]の内[うち]に連[つ]れて来[き]て、彼女の頭[あたま]を剃[そ]らせ、つめを切[き]らせなさい。"
  13: "そして、彼女[かのじょ]から捕囚[ほしゅう]の衣[ころも]を脱[ぬ]がし、彼女をあなたの家[いえ]に住[す]まわせなさい。彼女は一[いっ]か月[げつ]の間[あいだ]、父[ちち]と母[はは]を泣[な]いて偲[しの]ぶ。その後[あと]で、あなたは彼女のもとに入[はい]り、彼女の夫[おっと]となって、彼女はあなたの妻[つま]となる。"
  14: "もしあなたが彼女[かのじょ]を好[この]まなくなったなら、彼女を自由[じゆう]な者[もの]として去[さ]らせなさい。銀[ぎん]で売[う]ってはならない。あなたは彼女を辱[はずかし]めたのだから、彼女を粗末[そまつ]に扱[あつか]ってはならない。"
  15: "もしある人[ひと]に二人[ふたり]の妻[つま]があり、一人[ひとり]は愛[あい]され、一人は愛されず、その愛される妻も愛されない妻も彼[かれ]に子[こ]を産[う]み、その愛されない妻の子が長男[ちょうなん]であるなら、"
  16: "その日[ひ]、彼[かれ]が自分[じぶん]の財産[ざいさん]を息子[むすこ]たちに嗣業[しぎょう]として分[わ]け与[あた]えるとき、愛[あい]する妻[つま]の子[こ]を長男[ちょうなん]として扱[あつか]い、愛さない妻の長男を蔑[さげす]むことはできない。"
  17: "愛[あい]さない妻[つま]の長男[ちょうなん]を長男として認[みと]め、彼[かれ]の持[も]っているすべてのものから二[に]倍[ばい]の分[ぶん]を与[あた]えなさい。その者[もの]こそ彼の子[こ]らの初[はじ]めであり、長子[ちょうし]の権[けん]はその者にあるからである。"
  18: "もしある人[ひと]に、父[ちち]の声[こえ]にも母[はは]の声にも従[したが]わず、親[おや]を怒[いか]らせる息子[むすこ]があり、両親[りょうしん]が彼[かれ]を懲[こら]らしめても、彼が聞[き]き従わないなら、"
  19: "父[ちち]と母[はは]は彼[かれ]を捕[つか]まえ、その町[まち]の長老[ちょうろう]たちのところへ、すなわちその場所[ばしょ]の門[もん]へ連[つ]れて行[い]きなさい。"
  20: "そして、その町[まち]の人々[ひとびと]に言[い]いなさい。『このわたしたちの息子[むすこ]は親[おや]に従[したが]わず、いらだたせ、わたしたちの声[こえ]を聞[き]きません。大酒[おおざけ]を飲[の]んで遊[あそ]び暮[く]らしています。』"
  21: "その町[まち]の人々[ひとびと]は彼[かれ]を石[いし]で打[う]ち殺[ころ]しなさい。彼は死[し]ぬ。あなたはあなたがたの間[あいだ]から悪[あく]を除[のぞ]き去[さ]りなさい。残[のこ]りの者[もの]たちはこれを聞[き]いて恐[おそ]れるであろう。"
  22: "もしある人[ひと]に死[し]刑[けい]に値[あた]する罪[つみ]があり、その罪のために死に処[しょ]せられ、あなたがそれを木[き]にかけるなら、"
  23: "その死体[したい]を木[き]の上[うえ]に夜[よ]を越[こ]して置[お]いてはならない。あなたはその日[ひ]のうちに必[かなら]ずそれを葬[ほうむ]りなさい。木にかけられた者[もの]はすべて神[かみ]に呪[のろ]われているからである。あなたの神である主[しゅ]が嗣業[しぎょう]としてあなたに与[あた]える地[ち]を汚[けが]してはならない。」"

notes:
  1: "τραυματίας — «пронзённый, убитый» (τραῦμα — рана); не просто «раненый». ἐν τῷ πεδίῳ — «в поле», вне города. οὐκ οἴδασιν τὸν πατάξαντα — «не знают поразившего» (πατάσσω — ударить, убить)."
  2: "γερουσία — герусия, совет старейшин (長老たち); κριταί — судьи. ἐκμετρήσουσιν ἐπὶ τὰς πόλεις — «измерят до городов» (ἐκμετρέω), т.е. определят ближайший город."
  3: "δάμαλις ἐκ βοῶν — телица из крупного скота. ἥτις οὐκ εἴργασται — «которая не работала» (ἐργάζομαι); οὐχ εἵλκυσεν ζυγόν — «не тянула ярма»."
  4: "φάραγγα τραχεῖαν — «суровое, дикое ущелье»; в csl «дебрь суха». οὐκ εἴργασται οὐδὲ σπείρεται — не обработана и не засеяна. νευροκοπήσουσιν — «перережут жилы» (νεῦρον + κόπτω), т.е. заколют ударом в шею; в тексте 首の筋を切る."
  5: "παρεστηκέναι αὐτῷ — «предстоять Ему», служить. εὐλογεῖν ἐπὶ τῷ ὀνόματι αὐτοῦ — благословлять именем Его. ἐπὶ τῷ στόματι αὐτῶν … πᾶσα ἀντιλογία καὶ πᾶσα ἁφή — «на устах их всякое пререкание и всякое поражение»: священники решают тяжбы и дела о болезнях кожи (ἁφή — поражение, ср. ἁφὴ λέπρας)."
  6: "νίψονται τὰς χεῖρας ἐπὶ τὴν κεφαλὴν τῆς δαμάλεως — омоют руки над головой телицы, знак снятия вины. τῆς νενευροκοπημένης — «с перерезанными жилами»."
  7: "ἀποκριθέντες ἐροῦσιν — «ответив, скажут». Αἱ χεῖρες ἡμῶν οὐκ ἐξέχεαν — «руки наши не пролили» (ἐκχέω). Слова старейшин — 『…』."
  8: "ἵλεως γενοῦ — «будь милостив» (ἵλεως). οὓς ἐλυτρώσω — «которых Ты искупил» (λυτρόω). αἷμα ἀναίτιον — «кровь невинная». ἐξιλασθήσεται αὐτοῖς τὸ αἷμα — «очистится им кровь» (ἐξιλάσκομαι); в тексте вынесено за кавычки как итог."
  9: "ἐξαρεῖς — «удалишь, истребишь» (ἐξαίρω). τὸ καλὸν καὶ τὸ ἀρεστόν — «доброе и угодное»."
  10: "προνομεύσεις τὴν προνομήν — «захватишь добычу» (προνομή); далее речь о пленных. ἐξελθὼν εἰς πόλεμον — «выйдя на войну»."
  11: "γυναῖκα καλὴν τῷ εἴδει — «женщину красивую видом». ἐνθυμηθῇς αὐτῆς — «пожелаешь её» (ἐνθυμέομαι). λάβῃς αὐτὴν σαυτῷ γυναῖκα — «возьмёшь её себе в жену»."
  12: "ξυρήσεις τὴν κεφαλὴν αὐτῆς — «обреешь голову её»; περιονυχιεῖς — «обрежешь ногти» (περί + ὄνυξ). Обряд перехода пленницы в статус жены; в тексте 剃らせ, 切らせ."
  13: "περιελεῖς τὰ ἱμάτια τῆς αἰχμαλωσίας — «снимешь одежды плена». καθίεται — «сядет, поселится». κλαύσεται … μηνὸς ἡμέρας — «будет оплакивать месяц дней». εἰσελεύσῃ πρὸς αὐτήν — «войдёшь к ней», брачное сожительство; передано 彼女のもとに入る."
  14: "ἐξαποστελεῖς αὐτὴν ἐλευθέραν — «отпустишь её свободной». πράσει οὐ πραθήσεται ἀργυρίου — «продажей не будет продана за серебро». οὐκ ἀθετήσεις — «не отвергнешь, не обманешь» (ἀθετέω). ἐταπείνωσας — «смирил, унизил»."
  15: "ἠγαπημένη и μισουμένη — «любимая» и «ненавидимая»; в тексте 愛される/愛されない, без смягчения и без грубости. πρωτότοκος τῆς μισουμένης — первенец нелюбимой."
  16: "κατακληροδοτῇ — «разделит в наследство» (κατακληροδοτέω). πρωτοτοκεῦσαι — «дать первородство» (от πρωτότοκος). ὑπεριδών — «пренебрегши» (ὑπεροράω)."
  17: "ἐπιγνώσεται — «признает». διπλᾶ ἀπὸ πάντων — «двойную часть из всего». ἀρχὴ τέκνων — «начало детей его». τὰ πρωτοτόκια — «права первородства» (長子の権)."
  18: "ἀπειθὴς καὶ ἐρεθιστής — «непокорный и раздражающий»; в тексте 親を怒らせる. παιδεύσωσιν — «накажут, вразумят» (παιδεύω). εἰσακούῃ — «послушает»."
  19: "συλλαβόντες — «взяв, схватив». ἐξάξουσιν — «выведут». ἐπὶ τὴν γερουσίαν … ἐπὶ τὴν πύλην — к старейшинам, к воротам (место суда)."
  20: "ἀπειθεῖ καὶ ἐρεθίζει — «не покоряется и раздражает». οὐχ ὑπακούει τῆς φωνῆς ἡμῶν — «не слушает голоса нашего». συμβολοκοπῶν οἰνοφλυγεῖ — «кутя, пьянствует» (συμβολοκοπέω — пировать в складчину; οἰνοφλυγέω — предаваться вину); в тексте 大酒を飲んで遊び暮らす. Слова родителей — 『…』."
  21: "λιθοβολήσουσιν — «побьют камнями». ἐξαρεῖς τὸν πονηρόν — «истребишь злое». οἱ ἐπίλοιποι ἀκούσαντες φοβηθήσονται — «остальные, услышав, убоятся»."
  22: "κρίμα θανάτου — «суд смертный», т.е. преступление, достойное смерти. κρεμάσητε ἐπὶ ξύλου — «повесите на дереве»."
  23: "οὐκ ἐπικοιμηθήσεται — «не будет ночевать» (ἐπικοιμάομαι). ταφῇ θάψετε — «погребением погребёте» (усиление). κεκατηραμένος ὑπὸ θεοῦ — «проклят Богом» (καταράομαι); слав. «от Бога», Синодальный «пред Богом». πᾶς κρεμάμενος ἐπὶ ξύλου — «всякий висящий на дереве». οὐ μιανεῖτε τὴν γῆν — «не оскверните землю»."
