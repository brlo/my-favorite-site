# jp-box, Плач Иеремии, глава 4. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для Плача нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 4: 1–2 потускневшее золото и сыны Сиона как глиняные сосуды; 3–5 змеи кормят
# детёнышей, а дщерь народа жестока, язык грудного прилип, дети просят хлеба, евшим
# сладкое — навоз; 6–10 больше Содома, назореи чернее сажи, кожа к костям, убитые мечом
# счастливее убитых голодом, матери варят детей; 11–12 совершённый гнев и пожар Сиона,
# цари не верили; 13–16 за грехи пророков и священников, блуждание слепых, «отступите,
# нечистые», лице Господне как доля; 17–20 тщетное ожидание помощи, погоня быстрее
# орлов, помазанник Господень взят; 21–22 радость Едома и его чаша, конец беззакония
# Сиона.
# Акростих: в слав. перед каждым стихом стоит название евр. буквы (Алеф, Беф, Гимель,
# Далеф, Ге, Вав, Заин, Иф, Теф, Иод, Каф, Ламед, Мем, Нун, Самех, Аин, Фи, Цади, Коф,
# Реш, Шин, Фав) — по одной на стих, всего 22. Это разметка акростиха, а не слова
# текста: в перевод не включена, отмечена в notes каждого стиха; в японском акростих
# не воспроизводится. В gr-lxx-byz названий букв нет — они только в слав.
# Нумерация по gr: 22 стиха, совпадает с csl и ru; акростих ложится на те же стихи.
# 〔…〕 нет; «.» в главе нет. Слав. «(с ними)» и подобные пометы в скобках — редакционные.
# Кавычки: 4:15 — крик людей 「…」 и слова, сказанные среди народов, 「…」 (две пары
# в одном стихе); 4:20 — слова, сказанные о помазаннике, 「…」 (вложены в речь пророка,
# но вне чужой цитаты, поэтому первый уровень). Вложенной речи нет.
# Сносок ⟨…⟩ нет: ナジル人 уже в корпусе (Деян 18:18), 陶工, 煤, 糞, 鷲 понятны.
# Имена: シオン, エルサレム, ユダ, ソドム, エドム — по корпусу; ナジル人 — как в Деян 18:18.

