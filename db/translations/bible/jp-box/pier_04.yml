verses:
  1: "どうして、金[きん]は曇[くも]り、良[よ]い銀[ぎん]は変[か]わってしまうのか。聖[せい]なる石[いし]は、すべての街角[まちかど]の始[はじ]めに散[ち]らばらに投[な]げ捨[す]てられた。"
  2: "金[きん]によって高[たか]く掲[かか]げられた尊[とうと]いシオンの子[こ]らが、どうして、陶工[とうこう]の手[て]のわざである土[つち]の器[うつわ]に数[かぞ]えられるのか。"
  3: "蛇[へび]たちさえ乳房[ちぶさ]をあらわにして、その子[こ]に乳[ちち]を飲[の]ませる。わたしの民[たみ]の娘[むすめ]は、荒野[こうや]の雀[すずめ]のように、癒[いや]しえない者[もの]となった。"
  4: "乳[ちち]を飲[の]む子[こ]の舌[した]は、渇[かわ]きのために上[じょう]あごに貼[は]りついた。幼子[おさなご]たちはパンを求[もと]めたが、それを割[わ]って与[あた]える者[もの]はいない。"
  5: "ごちそうを食[た]べていた者[もの]たちは通[とお]りで消[き]え失[う]せ、紫[むらさき]の布[ぬの]に抱[だ]かれて育[そだ]った者[もの]たちは糞[ふん]を身[み]にまとった。"
  6: "わたしの民[たみ]の娘[むすめ]の不法[ふほう]は、ソドムの不法よりも大[おお]きくなった。ソドムは一瞬[いっしゅん]のうちに覆[くつがえ]され、だれも彼女[かのじょ]のために手[て]を痛[いた]めなかった。"
  7: "そのナジル人[びと]たちは雪[ゆき]よりも清[きよ]く、乳[ちち]よりも白[しろ]く輝[かがや]き、その姿[すがた]はサファイアの石[いし]よりも赤[あか]く染[そ]まっていた。"
  8: "その姿[すがた]は煤[すす]よりも黒[くろ]くなり、通[とお]りでだれにも見分[みわ]けられない。その皮膚[ひふ]は骨[ほね]に貼[は]りつき、干[ひ]からびて、木[き]のようになった。"
  9: "剣[つるぎ]で刺[さ]された者[もの]たちは、飢[うえ]えに倒[たお]れた者[もの]たちよりも幸[さいわ]いである。彼ら[かれら]は畑[はたけ]の実[み]の乏[とぼ]しさに貫[つらぬ]かれて行[い]ったからである。"
  10: "あわれみ深[ぶか]い女[おんな]たちの手[て]が、自分[じぶん]の子[こ]どもを煮[に]た。わたしの民[たみ]の娘[むすめ]の砕[くだ]かれるときに、それが彼女[かのじょ]たちの食[た]べ物[もの]となった。"
  11: "主[しゅ]はその憤[いきどお]りを成[な]し遂[と]げ、怒[いか]りの憤りを注[そそ]ぎ出[だ]し、シオンに火[ひ]を燃[も]え上[あ]がらせて、その基[もとい]を食[く]い尽[つ]くされた。"
  12: "地[ち]の王[おう]たちも、世界[せかい]に住[す]む者[もの]もみな、敵[てき]が苦[くる]しめながらエルサレムの門[もん]をくぐって入[はい]って来[く]るとは信[しん]じなかった。"
  13: "それは、その預言者[よげんしゃ]たちの罪[つみ]のゆえ、その祭司[さいし]たちの不法[ふほう]のゆえである。彼ら[かれら]はそのただ中[なか]で、正[ただ]しい者[もの]の血[ち]を流[なが]した。"
  14: "その見張[みは]りたちは通[とお]りでよろめき、血[ち]に汚[けが]れた。だれも彼ら[かれら]の衣[ころも]に触[ふ]れることができないほどであった。"
  15: "「汚[けが]れた者[もの]から離[はな]れよ。彼ら[かれら]を呼[よ]べ。離れよ、離れよ、触[ふ]れるな」と人々[ひとびと]は言[い]った。彼ら[かれら]は燃[や]け立[た]ち、よろめいたからである。そして諸国[しょこく]の民[たみ]の間[あいだ]で言[い]った。「彼らはもう寄留[きりゅう]することはない。」"
  16: "主[しゅ]の顔[かお]が彼ら[かれら]の分[ぶん]け前[まえ]となった。主はもう彼らに目[め]を留[と]められない。彼らは祭司[さいし]の顔[かお]を敬[うやま]わず、長老[ちょうろう]たちをあわれまなかった。"
  17: "まだわたしたちがいたとき、わたしたちの目[め]はむなしく助[たす]けを求[もと]めて尽[つ]きた。わたしたちは見張[みは]りをしながら、救[すく]わない民[たみ]を待[ま]ち望[のぞ]んだ。"
  18: "彼ら[かれら]はわたしたちの小[ちい]さな者[もの]たちを狙[ねら]い、わたしたちの広場[ひろば]を歩[ある]けないようにした。わたしたちの時[とき]は近[ちか]づき、日[ひ]は満[み]ち、わたしたちの終[お]わりが来[き]た。"
  19: "わたしたちを追[お]う者[もの]たちは、空[そら]の鷲[わし]よりも速[はや]かった。彼ら[かれら]は山[やま]の上[うえ]でわたしたちを追い、荒野[こうや]で待[ま]ち伏[ぶ]せした。"
  20: "わたしたちの顔[かお]の息[いき]、主[しゅ]に油[あぶら]を注[そそ]がれた者[もの]が、彼ら[かれら]の穴[あな]のうちで捕[と]らえられた。わたしたちが「その影[かげ]の下[した]で、諸国[しょこく]の民[たみ]の間[あいだ]に生[い]きよう」と言[い]った者[もの]である。"
  21: "エドムの娘[むすめ]、地[ち]に住[す]む者[もの]よ、喜[よろこ]び、楽[たの]しめ。しかし、主[しゅ]の杯[さかずき]はあなたのところにも巡[めぐ]って来[く]る。あなたは酔[よ]って、流[なが]れ出[で]る。"
  22: "シオンの娘[むすめ]よ、あなたの不法[ふほう]は終[お]わった。主[しゅ]はもはやあなたを移[うつ]されることはない。エドムの娘[むすめ]よ、主はあなたの不法を訪[おとず]れ、あなたの不敬[ふけい]を明[あ]らかにされた。"

notes:
  1: "Πῶς ἀμαυρωθήσεται χρυσίον — «как потускнеет золото» (ἀμαυρόω — помрачать): третья и последняя формула πῶς (1:1; 2:1; 4:1), передана так же — どうして…のか. ἀλλοιωθήσεται τὸ ἀργύριον τὸ ἀγαθόν — «изменится серебро доброе» (ἀλλοιόω). ἐξεχύθησαν λίθοι ἅγιοι ἐπ᾿ ἀρχῆς πασῶν ἐξόδων — «рассыпаны камни святые в начале всех исходов (улиц)» (ἐκχέω — рассыпать; ἔξοδος — улица): 街角の始め, как 2:19. Акростих: Алеф (в слав. — разметка, не слово текста; в японском не воспроизводится)."
  2: "Υἱοὶ Σιων οἱ τίμιοι οἱ ἐπηρμένοι ἐν χρυσίῳ — «сыны Сиона драгоценные, поднятые (возвеличенные) золотом» (τίμιος — 尊い; ἐπαίρω — возносить): 高く掲げられた. πῶς ἐλογίσθησαν εἰς ἀγγεῖα ὀστράκινα — «как сочтены они за сосуды глиняные» (ὀστράκινος — глиняный; λογίζομαι — считать). ἔργα χειρῶν κεραμέως — «дела рук горшечника» (κεραμεύς — 陶工; ср. Иер 18). Акростих: Беф."
  3: "Καί γε δράκοντες ἐξέδυσαν μαστούς — «даже змеи обнажили сосцы» (δράκων — змей; ἐκδύω — совлекать; μαστός — 乳房). ἐθήλασαν σκύμνοι αὐτῶν — «вскормили детёнышей своих» (θηλάζω; σκύμνος — детёныш). θυγατέρες λαοῦ μου εἰς ἀνίατον — «дщери народа моего — в неисцельное» (ἀνίατος — неисцелимый). ὡς στρουθίον ἐν ἐρήμῳ — «как птичка (страус?) в пустыне» (στρουθίον — воробей, 雀; ru «подобно страусам» по МТ): держим LXX. Акростих: Гимель."
  4: "Ἐκολλήθη ἡ γλῶσσα θηλάζοντος πρὸς τὸν φάρυγγα αὐτοῦ ἐν δίψει — «прилип язык сосущего к гортани его в жажде» (φάρυγξ — гортань, 上あご; δίψος — 渇き). νήπια ᾔτησαν ἄρτον — «младенцы просили хлеба» (αἰτέω). ὁ διακλῶν οὐκ ἔστιν αὐτοῖς — «нет разламывающего им» (διακλάω — преломлять): 割って与える者はいない. Акростих: Далеф."
  5: "Οἱ ἔσθοντες τὰς τρυφάς — «евшие роскошь (лакомства)» (τρυφή — ごちそう). ἠφανίσθησαν ἐν ταῖς ἐξόδοις — «исчезли на улицах» (ἀφανίζω). οἱ τιθηνούμενοι ἐπὶ κόκκων — «воспитанные на багрянице» (τιθηνέω — вскармливать; κόκκος — багряное, 紫の布). περιεβάλοντο κοπρίας — «облеклись в навоз» (κοπρία — 糞): буквально 糞を身にまとった. Акростих: Ге."
  6: "Καὶ ἐμεγαλύνθη ἀνομία θυγατρὸς λαοῦ μου ὑπὲρ ἀνομίας Σοδομων — «и возвеличилось беззаконие дщери народа моего более беззакония Содома». τῆς κατεστραμμένης ὥσπερ σπουδῇ — «низвергнутого как бы с поспешностью», т. е. в одно мгновение (σπουδή — 一瞬). καὶ οὐκ ἐπόνεσαν ἐν αὐτῇ χεῖρας — «и не болели о ней руки»: никто не ударил рукой, чтобы помочь; передано 手を痛めなかった. Акростих: Вав."
  7: "Ἐκαθαριώθησαν ναζιραῖοι αὐτῆς ὑπὲρ χιόνα — «очистились назореи её более снега» (ναζιραῖος — ナジル人; ср. Чис 6). ἔλαμψαν ὑπὲρ γάλα — «просияли более молока». ἐπυρρώθησαν ὑπὲρ λίθους σαπφείρου τὸ ἀπόσπασμα αὐτῶν — «покраснели более камней сапфира тела их» (πυρρόω — делать рыжим, красным; ἀπόσπασμα — отторгнутое, о теле): тёмное место, 姿…. Акростих: Заин."
  8: "Ἐσκότασεν ὑπὲρ ἀσβόλην τὸ εἶδος αὐτῶν — «потемнел более сажи вид их» (ἀσβόλη — 煤). οὐκ ἐπεγνώσθησαν ἐν ταῖς ἐξόδοις — «не были узнаны на улицах» (ἐπιγινώσκω — 見分ける). ἐπάγη δέρμα αὐτῶν ἐπὶ τὰ ὀστέα αὐτῶν — «примёрзла кожа их к костям их» (πήγνυμι — сковывать). ἐξηράνθησαν, ἐγενήθησαν ὥσπερ ξύλον — «иссохли, стали как дерево». Акростих: Иф."
  9: "Καλοὶ ἦσαν οἱ τραυματίαι ῥομφαίας ἢ οἱ τραυματίαι λιμοῦ — «лучше были поражённые мечом, нежели поражённые голодом» (τραυματίας — 刺された者; ῥομφαία — меч). ἐπορεύθησαν ἐκκεκεντημένοι ἀπὸ γενημάτων ἀγρῶν — «пошли пронзённые от произведений полей»: они истаивали, лишённые плодов поля (γένημα — 畑の実). Акростих: Теф."
  10: "Χεῖρες γυναικῶν οἰκτιρμόνων ἥψησαν τὰ παιδία αὐτῶν — «руки жён милосердных сварили детей их» (οἰκτίρμων — あわれみ深い; ἕψω — варить; ср. 2:20–21 с μάγειρος). ἐγενήθησαν εἰς βρῶσιν αὐταῖς — «стали они для них пищей». ἐν τῷ συντρίμματι τῆς θυγατρὸς λαοῦ μου — «при сокрушении дщери народа моего». Акростих: Иод."
  11: "Συνετέλεσεν κύριος θυμὸν αὐτοῦ — «исполнил Господь ярость Свою» (συντελέω — совершать). ἐξέχεεν θυμὸν ὀργῆς αὐτοῦ — «излил ярость гнева Своего»: 憤り…怒りの憤り, как в 2:6. ἀνῆψεν πῦρ ἐν Σιων — «возжёг огонь в Сионе». κατέφαγεν τὰ θεμέλια αὐτῆς — «пожрал основания её» (θεμέλια — 基). Акростих: Каф."
  12: "Οὐκ ἐπίστευσαν βασιλεῖς γῆς — «не поверили цари земли». πάντες οἱ κατοικοῦντες τὴν οἰκουμένην — «все живущие во вселенной» (οἰκουμένη — 世界). ὅτι εἰσελεύσεται ἐχθρὸς καὶ ἐκθλίβων διὰ τῶν πυλῶν Ιερουσαλημ — «что войдёт враг и теснящий вратами Иерусалима» (ἐκθλίβω — вытеснять, теснить): 苦しめながら…門をくぐって入って来る. Акростих: Ламед."
  13: "Ἐξ ἁμαρτιῶν προφητῶν αὐτῆς, ἀδικιῶν ἱερέων αὐτῆς — «за грехи пророков её, за беззакония священников её» (ἀδικία — 不法). τῶν ἐκχεόντων αἷμα δίκαιον ἐν μέσῳ αὐτῆς — «проливающих кровь праведную среди неё» (ἐκχέω). Акростих: Мем."
  14: "Ἐσαλεύθησαν ἐγρήγοροι αὐτῆς ἐν ταῖς ἐξόδοις — «поколебались (зашатались) стражи её на улицах» (σαλεύω; ἐγρήγορος — бодрствующий, страж, 見張り). ἐμολύνθησαν ἐν αἵματι — «осквернились кровью» (μολύνω — 汚れる). ἐν τῷ μὴ δύνασθαι αὐτοὺς ἥψαντο ἐνδυμάτων αὐτῶν — «так что не могли прикоснуться к одеждам их» (ἅπτω — касаться): 衣に触れることができない. Акростих: Нун."
  15: "Ἀπόστητε ἀκαθάρτων — καλέσατε αὐτούς — ἀπόστητε ἀπόστητε, μὴ ἅπτεσθε — «отступите от нечистых, позовите их: отступите, отступите, не прикасайтесь» (ἀκάθαρτος — 汚れた者; повтор ἀπόστητε сохранён): крик людей — 「…」. ὅτι ἀνήφθησαν καί γε ἐσαλεύθησαν — «ибо они возжглись и поколебались» (ἀνάπτω): 燃え立ち、よろめいた. εἴπατε ἐν τοῖς ἔθνεσιν· Οὐ μὴ προσθῶσιν τοῦ παροικεῖν — «скажите среди народов: они не приложат больше странствовать (жить)» (παροικέω — 寄留する): вторая пара 「…」. Акростих: Самех."
  16: "Πρόσωπον κυρίου μερὶς αὐτῶν — «лицо Господне — часть их» (μερίς — 分け前; слав. «лице Господне часть их»): тёмное место, сохранено буквально; в ru по МТ «лице Господне рассеет их». οὐ προσθήσει ἐπιβλέψαι αὐτοῖς — «не приложит призреть на них». πρόσωπον ἱερέων οὐκ ἔλαβον — «лица священников не приняли (не почтили)» (λαμβάνω πρόσωπον — принимать лицо, 敬う). πρεσβύτας οὐκ ἠλέησαν — «старцев не помиловали». Акростих: Аин."
  17: "Ἔτι ὄντων ἡμῶν ἐξέλιπον οἱ ὀφθαλμοὶ ἡμῶν — «когда мы ещё были, иссякли глаза наши» (ἐκλείπω). εἰς τὴν βοήθειαν ἡμῶν μάταια — «на помощь нашу — напрасно» (μάταιος). ἀποσκοπευόντων ἡμῶν ἀπεσκοπεύσαμεν εἰς ἔθνος οὐ σῷζον — «мы смотрели и высматривали народ, который не спасает» (ἀποσκοπεύω — высматривать; игра однокоренных передана 見張りをしながら…待ち望んだ). Акростих: Фи."
  18: "Ἐθηρεύσαμεν μικροὺς ἡμῶν — «мы ловили (замечали) малых наших» (θηρεύω, ср. 3:52): тёмное место; в LXX 1-е лицо мн. ч. («мы ловили»), в слав. 3-е («уловиша малых наших»), отсюда в тексте 彼らは…狙い; в ru по МТ «подстерегали шаги наши». τοῦ μὴ πορεύεσθαι ἐν ταῖς πλατείαις ἡμῶν — «чтобы не ходить по площадям нашим». ἤγγικεν ὁ καιρὸς ἡμῶν — «приблизилось время наше». ἐπληρώθησαν αἱ ἡμέραι ἡμῶν — «исполнились дни наши». πάρεστιν ὁ καιρὸς ἡμῶν — «наступил конец (время) наш» (слав. «настоит конец наш»): повтор καιρός сохранён (時…終わり). Акростих: Цади."
  19: "Κοῦφοι ἐγένοντο οἱ διώκοντες ἡμᾶς ὑπὲρ ἀετοὺς οὐρανοῦ — «быстры (легки) стали гнавшие нас более орлов небесных» (κοῦφος — лёгкий, быстрый; ἀετός — 鷲). ἐπὶ τῶν ὀρέων ἐξήφθησαν — «по горам возжглись (гнались)» (ἐξάπτω): 山の上で追い. ἐν ἐρήμῳ ἐνήδρευσαν ἡμᾶς — «в пустыне подстерегли нас» (ἐνεδρεύω): 待ち伏せした. Акростих: Коф."
  20: "Πνεῦμα προσώπου ἡμῶν — «дыхание лица нашего» (πνεῦμα — 息). χριστὸς κυρίου συνελήμφθη ἐν ταῖς διαφθοραῖς αὐτῶν — «помазанник Господень взят в растлениях (ямах, сетях) их» (χριστός — 油を注がれた者, как в псалмах; διαφθορά — гибель, яма; слав. «в растлениих их»): 彼らの穴のうちで捕らえられた. οὗ εἴπαμεν· Ἐν τῇ σκιᾷ αὐτοῦ ζησόμεθα ἐν τοῖς ἔθνεσιν — «о котором мы сказали: в тени его будем жить среди народов»: слова о нём — 「…」. Акростих: Реш."
  21: "Χαῖρε καὶ εὐφραίνου, θύγατερ Ιδουμαίας — «радуйся и веселись, дщерь Едома» (Ιδουμαία — エドム; слав. «дщи идумейска»). καί γε ἐπὶ σὲ διελεύσεται τὸ ποτήριον κυρίου — «и на тебя пройдёт чаша Господня» (ποτήριον — 杯). μεθυσθήσῃ καὶ ἀποχεεῖς — «упоишься и изольёшься» (μεθύσκω; ἀποχέω — изливать): тёмное место, сохранено буквально 流れ出る; в ru по МТ «обнажишься». Акростих: Шин."
  22: "Ἐξέλιπεν ἡ ἀνομία σου, θύγατερ Σιων — «иссякло беззаконие твоё, дщерь Сиона» (ἐκλείπω). οὐ προσθήσει ἔτι ἀποικίσαι σε — «не приложит более переселить тебя» (ἀποικίζω). ἐπεσκέψατο ἀνομίας σου, θύγατερ Εδωμ — «посетил беззакония твои, дщерь Едома» (ἐπισκέπτομαι — 訪れる). ἀπεκάλυψεν ἐπὶ τὰ ἀσεβήματά σου — «открыл нечестия твои» (ἀποκαλύπτω — 明らかにする). Акростих: Фав — последняя буква акростиха, глава закрывается."
