# jp-box, Премудрость Соломона, глава 9. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для 7–9 есть выборочно: его стихи не
# совпадают с делением gr, использован только для сверки; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 9: молитва Соломона о премудрости, 1–18. Вся глава — прямая речь, 「…」:
# открывается в 9:1, закрывается в 9:18; авторского текста внутри нет, вложенной
# речи нет. Греч. 9:1–4 — один период: звательные обороты и причастия в 1–3,
# повеление δός в 4; по-японски причастия сведены к определению перед 方よ.
# Нумерация по gr: 18 стихов. Слав. 9:18 короче: «и премудростию спасошася»
# (слав. 9:19) — стих сверх gr; он влит в наш 9:18, отдельного стиха нет.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 知恵, 不死, 幕屋, 祭壇, 律法 и пр. уже в корпусе.
# Имена — транслитерация греческого (LXX); в главе имён нет.

tr_code: jp-box
book: prs
chapter: 9
draft: true

verses:
  1: "「父[ちち]たちの神[かみ]、あわれみの主[しゅ]、あなたの言葉[ことば]によってすべてのものを造[つく]り、"
  2: "あなたの知恵[ちえ]によって人[ひと]を造[つく]って、あなたによって造[つく]られた造物[ぞうぶつ]を治[おさ]めさせ、"
  3: "世[よ]を聖[せい]さと正義[せいぎ]とをもって治[おさ]め、魂[たましい]のまっすぐさをもって裁[さば]きを行[おこな]わせるようにされた方[かた]よ。"
  4: "あなたの王座[おうざ]に並[なら]び座[すわ]る知恵[ちえ]をわたしに与[あた]え、あなたの子[こ]らの中[なか]からわたしを退[しりぞ]けないでください。"
  5: "わたしはあなたの僕[しもべ]、あなたのはしための子[こ]であり、弱[よわ]く、長[なが]くは生[い]きられず、裁[さば]きと律法[りっぽう]についての悟[さと]りに欠[か]けた人間[にんげん]である。"
  6: "たとえ人[ひと]の子[こ]らの間[あいだ]で完全[かんぜん]な者[もの]がいても、あなたから出[で]る知恵[ちえ]がなければ、その者[もの]は無[む]に等[ひと]しいと見[み]なされる。"
  7: "あなたはわたしを、あなたの民[たみ]の王[おう]、あなたの息子[むすこ]たちと娘[むすめ]たちの裁[さば]き手[て]として選[えら]ばれた。"
  8: "あなたは、あなたの聖[せい]なる山[やま]に神殿[しんでん]を建[た]て、あなたの住[す]まいの都[みやこ]に祭壇[さいだん]を、初[はじ]めから備[そな]えられた聖なる幕屋[まくや]に似[に]せて造[つく]るように言[い]われた。"
  9: "あなたとともに知恵[ちえ]がある。知恵はあなたのわざを知[し]り、あなたが世界[せかい]を造[つく]られたときにもそこにいた。また、あなたの目[め]にかなうもの、あなたの掟[おきて]のうちで正[ただ]しいものが何[なに]かを知っている。"
  10: "知恵[ちえ]を聖[せい]なる天[てん]から遣[つか]わし、あなたの栄光[えいこう]の王座[おうざ]から送[おく]ってください。知恵がわたしとともにいて働[はたら]き、わたしがあなたの喜[よろこ]ばれることを知[し]るためである。"
  11: "知恵[ちえ]はすべてを知[し]り、悟[さと]っている。知恵はわたしの行[おこな]いを分別[ふんべつ]をもって導[みちび]き、その栄光[えいこう]のうちにわたしを守[まも]る。"
  12: "そうすれば、わたしのわざは受[う]け入[い]れられ、わたしはあなたの民[たみ]を正[ただ]しく裁[さば]き、父[ちち]の王座[おうざ]にふさわしい者となる。"
  13: "だれが、人間[にんげん]のうちで神[かみ]の計画[けいかく]を知[し]り得[え]るだろうか。また、だれが主[しゅ]の望[のぞ]まれることを思[おも]いめぐらし得るだろうか。"
  14: "死[し]すべき者[もの]の思[おも]いは臆病[おくびょう]であり、わたしたちの考[かんが]えは危[あや]うい。"
  15: "朽[く]ちる体[からだ]は魂[たましい]を重[おも]くし、土[つち]でできた仮住[かりず]まいは思[おも]い煩[わずら]いの多[おお]い心[こころ]を圧[お]しつぶすからである。"
  16: "わたしたちは地上[ちじょう]のことさえ、かろうじて推[おし]し量[はか]り、手[て]の届[とど]くものでさえ苦労[くろう]して見[み]つける。天[てん]にあることを、だれが探[さぐ]り出[だ]したというのか。"
  17: "あなたが知恵[ちえ]を与[あた]え、あなたの聖[せい]なる霊[れい]を高[たか]いところから遣[つか]わしてくださらなければ、だれがあなたの計[はか]らいを知[し]り得[え]ただろうか。"
  18: "そうして、地上[ちじょう]に住[す]む者[もの]たちの道[みち]は正[ただ]しくされ、人々[ひとびと]はあなたにかなうことを教[おし]えられ、知恵[ちえ]によって救[すく]われた。」"

notes:
  1: "Θεὲ πατέρων — звательный падеж: «Боже отцов»; κύριε τοῦ ἐλέους — «Господи милости». Слав. добавляет «твоея» (милости твоея), в LXX местоимения нет. Греч. 9:1–4 — один период: причастия в 1–3, повеление δός в 4; молитва открывается здесь 「」."
  2: "τῇ σοφίᾳ σου κατασκευάσας ἄνθρωπον — «премудростию Твоею устроив человека» (κατασκευάζω — устраивать, создавать; слав. «устроивый»). ἵνα δεσπόζῃ — «чтобы владел» (δεσπόζω — господствовать); κτίσματα — творения (слав. «тварьми»)."
  3: "ὁσιότης — святость, преподобие (слав. «преподобии»); εὐθύτης ψυχῆς — правота души (слав. «в правоте души»); κρίσιν κρίνῃ — «суд да судит», усилительный оборот (слав. «суд да судит»). Причастия 9:1–3 относятся к звательному 方よ."
  4: "δός — импер. аор. «дай»; πάρεδρος — «сидящая при, сопрестольная» (слав. «приседящую»); τῶν σῶν θρόνων — «твоих престолов», мн. ч. ἀποδοκιμάσῃς — «отвергнешь, отринешь» (слав. «отрини»); παίδων — отроков, детей (слав. «отрок»)."
  5: "δοῦλος ... υἱὸς τῆς παιδίσκης — «раб и сын рабыни» (слав. «раб и сын рабыни твоея»); παιδίσκη — служанка, рабыня. ὀλιγοχρόνιος — кратковременный, недолговечный (слав. «маловременен»); ἐλάσσων ἐν συνέσει — «умаленный в разуме» (слав.), т. е. недостаточный в понимании."
  6: "κἂν γάρ — «ибо если бы даже»; τέλειος — совершенный; ἀπούσης — «отсутствующей» (gen. abs. от ἄπειμι); εἰς οὐδὲν λογισθήσεται — «в ничто вменится» (слав. «ни во чтоже вменится»)."
  7: "προείλω — «предызбрал», избрал предпочтительно (προαιρέω; слав. «избрал мя еси»); δικαστής — судья (裁き手); υἱῶν καὶ θυγατέρων — сынов и дочерей (слав. «сыном и дщерем»)."
  8: "ναός — храм (神殿); κατασκήνωσις — обитание, жилище (слав. «обитания»); θυσιαστήριον — жертвенник (祭壇); μίμημα σκηνῆς ἁγίας — «подобие скинии святыя» (слав. «подобием скинии... святыя»); προητοίμασας ἀπ᾿ ἀρχῆς — «предуготовал еси от начала». Слав. в скобках добавляет «(твоея)» — редакторское уточнение, в LXX его нет."
  9: "ἡ εἰδυῖα ... καὶ παροῦσα — «знающая и присутствовавшая» (οἶδα, πάρειμι); ἀρεστόν — угодное (слав. «угодно»); εὐθὲς ἐν ἐντολαῖς — «правое в заповедах»; ἐντολαί — заповеди (掟)."
  10: "ἐξαπόστειλον ... πέμψον — двойное повеление, оба «пошли» (усиление; слав. «посли... посли»); ἐξ ἁγίων οὐρανῶν — «от святых небес», мн. ч. ἵνα συμπαροῦσά μοι κοπιάσῃ — «чтобы, присутствуя со мною, трудилась» (συμπάρειμι, κοπιάω; слав. «да сущи со мною трудится»); εὐάρεστον — благоугодное (слав. «благоугодно»)."
  11: "ἐκείνη — «та», подлежащее 知恵 (слав. «она»); σωφρόνως — целомудренно, благоразумно (слав. «целомудренне»); φυλάξει — сохранит (слав. «сохранит»); ἐν τῇ δόξῃ αὐτῆς — «во славе своей»."
  12: "προσδεκτά — приемлемые, благоприятные (слав. «приятна»); διακρινῶ — различу, рассужу (слав. «разсужду»); θρόνων πατρός μου — «престолов отца моего», мн. ч. (слав. «престолов»); ἄξιος — достойный."
  13: "βουλή — совет, воля, замысел (слав. «совет»); γνώσεται — буд. «узнает»; ἐνθυμηθήσεται — «помыслит» (слав. «помыслит»); τί θέλει ὁ κύριος — «что хочет Господь» (слав. «что хощет Бог»)."
  14: "λογισμοί — помышления (слав. «помышления»); δειλοί — робкие, боязливые (слав. «боязлива»); ἐπισφαλεῖς — шаткие, ненадёжные (слав. «погрешителна»); ἐπίνοιαι — замыслы, измышления (слав. «умышления»)."
  15: "φθαρτόν — тленное (слав. «тленное»); γεῶδες σκῆνος — «земная храмина» (σκῆνος — шатёр, тело как временное жилище, ср. 2 Кор 5:1; слав. «земное жилище»), передано 仮住まい, чтобы отличить от σκηνή (幕屋) в 9:8. βρίθει — давит, обременяет; πολυφρόντιδα — многозаботливый (слав. «многопопечителен»)."
  16: "μόλις — едва (слав. «едва»); εἰκάζομεν — угадываем, предполагаем (слав. «разумеваем»); τὰ ἐν χερσίν — «что под руками», т. е. близкое, доступное; ἐξιχνίασεν — «исследовал, выследил» (слав. «изследи»)."
  17: "βουλή — воля, совет (слав. «волю»); εἰ μή — «если не», при риторическом вопросе; τὸ ἅγιόν σου πνεῦμα — «Дух Твой Святый»; ἀπὸ ὑψίστων — «от высот» (мн. ч.; слав. «от высоты» — ед. ч.). По-японски условие при εἰ μή стоит перед вопросом."
  18: "διωρθώθησαν αἱ τρίβοι — «исправились стези» (διορθόω — выпрямлять; слав. «исправишася»); τὰ ἀρεστά σου — «угодное Тебе»; ἐδιδάχθησαν ἄνθρωποι — «научились человеки»; τῇ σοφίᾳ ἐσώθησαν — «премудростию спасошася». В csl это отдельный стих 9:19; по gr он входит в 9:18, поэтому отдельного стиха нет, а слав. 9:19 влит сюда. Здесь молитва закрывается: 。」."
