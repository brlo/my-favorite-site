verses:
  1: "その時[とき]、主[しゅ]は言[い]われる。「ユダの王[おう]たちの骨[ほね]とその君[きみ]たちの骨、祭司[さいし]たちの骨、預言者[よげんしゃ]たちの骨、エルサレムに住[す]む者[もの]の骨を、彼らの墓[はか]から取[と]り出[だ]す。"
  2: "彼らが愛[あい]し、仕[つか]え、従[したが]い、慕[した]い、拝[おが]んだ太陽[たいよう]と月[つき]と天[てん]のすべての星[ほし]、また、天[てん]の軍勢[ぐんぜい]のすべての前[まえ]にも、それらをさらす。それらは嘆[なげ]かれもせず、葬[ほうむ]られもせず、地[ち]の面[おもて]の見[み]せ物[もの]となる。"
  3: "彼らは命[いのち]よりも死[し]を選[えら]んだ。この悪[わる]い世代[せだい]から残[のこ]された者[もの]のすべても、わたしが彼らを追[お]いやるすべての場所[ばしょ]で、死を選んだ。」と万軍[ばんぐん]の主[しゅ]は言[い]われる。"
  4: "彼らに言[い]え。主[しゅ]はこう言[い]われる。「倒[たお]れる者[もの]は起[き]上[あ]がらないのか。背[そむ]く者[もの]は戻[もど]らないのか。"
  5: "なぜ、この民[たみ]、エルサレムは、恥[はじ]しらずの背[そむ]きを重[かさ]ねるのか。彼らは自分[じぶん]の選[えら]んだことに固[かた]く立[た]ち、戻[もど]ろうとしない。"
  6: "聞[き]け、そして聞[き]取[と]れ。彼らは正[ただ]しくは語[かた]らない。自分[じぶん]の悪[あく]から悔[く]い改[あらた]めて『わたしは何[なに]をしたのか』と言[い]う者[もの]は、ひとりもいない。走[はし]る者[もの]はみな、その走りから離[はな]れ、汗[あせ]まみれの馬[うま]がいななくようになる。"
  7: "また、天[てん]のこうのとりはその時[とき]を知[し]り、やまばともつばめも野[の]のすずめも、自分[じぶん]の入[はい]るべき時[とき]を守[まも]っている。しかし、わたしの民[たみ]は主[しゅ]の裁[さば]きを知[し]らない。"
  8: "どうして、あなたがたは『われわれは知者[ちしゃ]であり、主[しゅ]の律法[りっぽう]がわれわれと共[とも]にある』と言[い]うのか。見[み]よ、律法[りっぽう]学者[がくしゃ]たちの偽[いつわ]りの葦[あし]の筆[ふで]は、むなしく偽りとなった。"
  9: "知者[ちしゃ]たちは恥[はじ]を見[み]、恐[おそ]れて捕[と]らえられた。見[み]よ、彼らは主[しゅ]の言葉[ことば]を退[しりぞ]けた。彼らに何[なん]の知恵[ちえ]があろうか。"
  10: "それゆえ、わたしは彼らの妻[つま]たちを他人[たにん]に、彼らの畑[はたけ]を相続人[そうぞくにん]たちに与[あた]える。小[ちい]さな者[もの]から大[おお]きな者[もの]まで、すべての者[もの]が利[り]をむさぼり、預言者[よげんしゃ]から祭司[さいし]に至[いた]るまで、すべての者[もの]が偽[いつわ]りを行[おこな]うからである。"
  11: "彼らはわが民[たみ]の娘[むすめ]の破[やぶ]れを軽[かろ]んじて癒[いや]し、『平和[へいわ]、平和』と言[い]う。しかし、平和はない。"
  12: "彼らは恥[は]じたか。いや、彼らは恥じることをせず、辱[はずかし]められても恥じようとしなかった。それゆえ、彼らは倒[たお]れる者[もの]とともに倒れ、彼らを訪[おとず]れる時[とき]に滅[ほろ]びる、と主[しゅ]は言[い]われる。"
  13: "わたしは彼らの実[みの]りを集[あつ]める、と主[しゅ]は言[い]われる。ぶどうの木[き]にはぶどうの房[ふさ]がなく、いちじくの木[き]にはいちじくがなく、葉[は]も散[ち]ってしまった。わたしが彼らに与[あた]えたものも、彼らから過[す]ぎ去[さ]った。」"
  14: "「われわれはなぜ座[すわ]っているのか。集[あつ]まって、堅[かた]い町々[まちまち]に入[はい]り、そこで滅[ほろ]びよう。われわれの神[かみ]である主[しゅ]がわれわれを捨[す]て、苦[にが]い水[みず]を飲[の]ませられたからである。われわれは主[しゅ]の前[まえ]に罪[つみ]を犯[おか]したからである。"
  15: "われわれは平和[へいわ]を待[ま]ち望[のぞ]んだが、良[よ]いものはなく、癒[いや]しの時[とき]を待ったが、見[み]よ、恐[おそ]れがある。"
  16: "ダンから彼[かれ]の馬[うま]の鋭[するど]いいななきが聞[き]こえ、その騎兵[きへい]の馬[うま]のいななきの声[こえ]に、地[ち]はすべて震[ふる]えた。彼は来[き]て、この地[ち]とその満[み]ちるもの、町[まち]とそこに住[す]む者[もの]を食[く]い尽[つく]す。」"
  17: "「見[み]よ、わたしはあなたがたに、人[ひと]を殺[ころ]す蛇[へび]を送[おく]る。それにはまじないが効[き]かない。彼らはあなたがたをかむ。」と主[しゅ]は言[い]われる。"
  18: "癒[いや]しがたい痛[いた]みとともに、あなたがたの心[こころ]は思[おも]い惑[まど]う。"
  19: "見[み]よ、わが民[たみ]の娘[むすめ]の叫[さけ]びの声[こえ]が遠[とお]い地[ち]から聞[き]こえる。『主[しゅ]はシオンにいないのか。シオンの王[おう]はいないのか。』彼らは自分[じぶん]の彫[ほ]り刻[こ]んだものと、異国[いこく]のむなしいものとで、なぜわたしを怒[いか]らせたのか。"
  20: "夏[なつ]は過[す]ぎ、刈[か]り入[い]れも終[お]わった。しかし、われわれは救[すく]われなかった。"
  21: "わが民[たみ]の娘[むすめ]の破[やぶ]れのゆえに、わたしは暗[くら]くなった。思[おも]い惑[まど]いのうちに、子[こ]を産[う]む女[おんな]のような痛[いた]みがわたしを捕[と]らえた。"
  22: "ギルアデに樹脂[じゅし]はないのか。そこに医者[いしゃ]はいないのか。なぜ、わが民[たみ]の娘[むすめ]の傷[きず]は癒[いや]されないのか。"
  23: "だれが、わたしの頭[あたま]に水[みず]を、わたしの目[め]に涙[なみだ]の泉[いずみ]を与[あた]えるだろうか。そうすれば、わたしはわが民[たみ]の娘[むすめ]の殺[ころ]された者[もの]たちのために、昼[ひる]も夜[よる]も泣[な]くことができるのに。"

notes:
  1: "ἐν τῷ καιρῷ ἐκείνῳ, λέγει κύριος — «в то время, говорит Господь»; формула вынесена в начало («その時、主は言われる»). ἐξοίσουσιν τὰ ὀστᾶ — «вынесут кости» (ἐκφέρω — выносить; ὀστέον — кость, 骨); τῶν βασιλέων Ιουδα — «царей Иуды» (ユダ); τῶν ἀρχόντων αὐτοῦ — «князей его» (ἄρχων — начальник, 君); ἐκ τῶν τάφων αὐτῶν — «из гробов их» (τάφος — могила, 墓)."
  2: "καὶ ψύξουσιν αὐτὰ πρὸς τὸν ἥλιον — «и выставят их к солнцу» (ψύχω — выставлять на воздух, остужать; слав. «повергут»); πρὸς πᾶσαν τὴν στρατιὰν τοῦ οὐρανοῦ — «ко всему воинству небесному» (στρατιά — войско, 軍勢), т. е. к светилам. ἃ ἠγάπησαν καὶ οἷς ἐδούλευσαν — «которых любили и которым служили» (ἀγαπάω, δουλεύω); ὧν ἐπορεύθησαν ὀπίσω αὐτῶν — «за которыми ходили»; ὧν ἀντείχοντο — «которых держались» (ἀντέχομαι); οἷς προσεκύνησαν — «которым поклонялись». οὐ κοπήσονται — «не будут оплаканы» (κόπτομαι — бить себя в грудь, плакать); οὐ ταφήσονται — «не будут погребены»; εἰς παράδειγμα ἐπὶ προσώπου τῆς γῆς — «в позор на лице земли» (παράδειγμα — выставленное на позор, 見せ物)."
  3: "ὅτι εἵλοντο τὸν θάνατον ἢ τὴν ζωήν — «ибо избрали смерть, а не жизнь» (αἱρέομαι — выбирать); καὶ πᾶσιν τοῖς καταλοίποις τοῖς καταλειφθεῖσιν ἀπὸ τῆς γενεᾶς ἐκείνης — «и всем остаткам, оставшимся от рода того» (κατάλοιπος — остаток; καταλείπω — оставлять); ἐν παντὶ τόπῳ, οὗ ἐὰν ἐξώσω αὐτοὺς ἐκεῖ — «на всяком месте, куда Я изгоню их» (ἐξωθέω — выгонять). Греч. фраза без сказуемого при дательном (анаколуф); мысль восполнена: «тоже выберут смерть». Слав. добавляет в конце «рече Господь сил» — нет в LXX, внесено как формула («と万軍の主は言われる»)."
  4: "В гр. 8:4 нет «скажи им» (И речеши к ним) — это слав. добавление (МТ); внесено без скобок, отмечено. Μὴ ὁ πίπτων οὐκ ἀνίσταται; — «разве падающий не встаёт?» (πίπτω — падать; ἀνίσταμαι — вставать); ἢ ὁ ἀποστρέφων οὐκ ἐπιστρέφει; — «разве отвращающийся не обращается?» (ἀποστρέφω, ἐπιστρέφω — игра однокоренных)."
  5: "διὰ τί ἀπέστρεψεν ὁ λαός μου οὗτος ἀποστροφὴν ἀναιδῆ — «для чего отвратился народ Мой сей отвращением бесстыдным» (ἀναιδής — бесстыдный, 恥しらず); слав. «отвращением безстудным». Слав. добавляет «во Иерусалиме» (в LXX нет; чтение МТ) — внесено без скобок (エルサレムは). κατεκρατήθησαν ἐν τῇ προαιρέσει αὐτῶν — «укрепились в своём произволении» (προαίρεσις — выбор, намерение, 選んだこと); οὐκ ἠθέλησαν τοῦ ἐπιστρέψαι — «не захотели обратиться»."
  6: "ἐνωτίασασθε δὴ καὶ ἀκούσατε — «внемлите же и слушайте» (ἐνωτίζομαι — внимать); οὐχ οὕτως λαλήσουσιν — «не так они говорят», т. е. неправо; οὐκ ἔστιν ἄνθρωπος μετανοῶν ἀπὸ τῆς κακίας αὐτοῦ — «нет человека кающегося от злобы своей» (μετανοέω — каяться, 悔い改める); λέγων Τί ἐποίησα; — «говорящего: что я сделал?» — вложенная цитата 『…』. διέλιπεν ὁ τρέχων ἀπὸ τοῦ δρόμου αὐτοῦ — «оставил бегущий бег свой» (διαλείπω — прекращать; δρόμος — бег); ὡς ἵππος κάθιδρος ἐν χρεμετισμῷ αὐτοῦ — «как конь, облитый потом, в ржании своём» (κάθιδρος — потный; χρεμετισμός — ржание); образ тёмен, не сглажен."
  7: "ἡ ἀσιδα ἐν τῷ οὐρανῷ ἔγνω τὸν καιρὸν αὐτῆς — «аист на небе знает время своё» (ἀσίδα — аист, こうのとり); τρυγὼν καὶ χελιδών — «горлица и ласточка» (τρυγών — горлица, やまばと; χελιδών — ласточка, つばめ); ἀγροῦ στρουθία — «полевые воробьи» (στρουθίον — воробей, すずめ); ἐφύλαξαν καιροὺς εἰσόδων αὐτῶν — «сохранили времена входов своих» (φυλάσσω — хранить; εἴσοδος — вход, прибытие); ὁ δὲ λαός μου οὐκ ἔγνω τὰ κρίματα κυρίου — «а народ Мой не познал судов Господних» (κρίμα — суд, 裁き)."
  8: "πῶς ἐρεῖτε ὅτι Σοφοί ἐσμεν ἡμεῖς — «как вы говорите: мы мудры» — вложенная цитата 『…』; νόμος κυρίου ἐστὶν μεθ᾽ ἡμῶν — «закон Господень с нами». εἰς μάτην ἐγενήθη σχοῖνος ψευδὴς γραμματεῦσιν — «всуе сделалась трость лживая книжникам» (σχοῖνος — тростник, тростниковая палочка для письма, 葦の筆; γραμματεύς — книжник, 律法学者); слав. «трость лживая книжником»; ru «лживая трость книжников и его превращает в ложь» — из МТ, не внесено."
  9: "ᾐσχύνθησαν σοφοὶ καὶ ἐπτοήθησαν καὶ ἑάλωσαν — «постыдились мудрые, и устрашились, и пойманы были» (πτοέω — устрашать; ἁλίσκομαι — быть пойманным); ὅτι τὸν λόγον κυρίου ἀπεδοκίμασαν — «ибо слово Господне отвергли» (ἀποδοκιμάζω); σοφία τίς ἐστιν ἐν αὐτοῖς; — «какая мудрость в них?»."
  10: "διὰ τοῦτο δώσω τὰς γυναῖκας αὐτῶν ἑτέροις — «посему отдам жён их другим»; τοὺς ἀγροὺς αὐτῶν τοῖς κληρονόμοις — «поля их наследникам» (κληρονόμος — наследник, 相続人). Дальнейшее («от мала до велика… от пророка до священника…») — слав. 8:10, в LXX этого нет (повтор 6:13), внесено без скобок; отмечено. Порядок у слав. «от пророка даже до священника», в тексте 預言者から祭司に至るまで."
  11: "В модуле стих — точка (лакуна); переведено по слав. 8:11: «и изцеляху сотрения дщере людий моих, ко безчестию глаголюще: мир, мир. И не бе мира». ἰῶνται τὸ σύντριμμα θυγατρὸς λαοῦ μου ἐξουθενοῦντες — «врачуют сокрушение дочери народа Моего, уничижая» (ἐξουθενέω — ни во что ставить); повтор 6:14. Слова лжеврачей — 『…』."
  12: "В модуле стих — точка (лакуна); по слав. 8:12: «Постыждени суть, яко гнусство сотвориша и постыдением не постыдешася и посрамитися не ведеша: сего ради падут между падающими, во время посещения своего падут, рече Господь» — повтор 6:15. αἰσχύνομαι — стыдиться; βδέλυγμα («гнусство») — мерзость; ἐπισκοπή — посещение, 訪れ."
  13: "συνάξουσιν τὰ γενήματα αὐτῶν — «соберут плоды их» (γένημα — плод, 実り); λέγει κύριος внутри речи. οὐκ ἔστιν σταφυλὴ ἐν ταῖς ἀμπέλοις — «нет грозди на лозах» (σταφυλή — гроздь, 房; ἄμπελος — лоза, ぶどうの木); οὐκ ἔστιν σῦκα ἐν ταῖς συκαῖς — «нет смокв на смоковницах» (σῦκον — смоква; συκῆ — смоковница, いちじくの木); τὰ φύλλα κατερρύηκεν — «листья опали» (καταρρέω — стекать, опадать). Слав. добавляет «и дах им, и мимоидоша их» («что Я дал им, отошло от них») — в LXX нет (МТ), внесено без скобок, отмечено. Кавычки закрываются."
  14: "Голос народа, 1-е л. мн. ч. (в гр. без вводной формулы) — 「…」. ἐπὶ τί ἡμεῖς καθήμεθα — «для чего мы сидим?»; συνάχθητε — «соберитесь»; εἰσέλθωμεν εἰς τὰς πόλεις τὰς ὀχυράς — «войдём в города укреплённые» (ὀχυρός — крепкий, 堅い); ἀπορριφῶμεν — «будем отвергнуты (погибнем)» (ἀπορρίπτω); ὁ θεὸς ἀπέρριψεν ἡμᾶς — «Бог отверг нас»; ἐπότισεν ἡμᾶς ὕδωρ χολῆς — «напоил нас водою желчи» (χολή — желчь, горечь, 苦い水); ἡμάρτομεν ἐναντίον αὐτοῦ — «мы согрешили пред Ним»."
  15: "συνήχθημεν εἰς εἰρήνην — «мы собрались [в надежде] на мир»; καὶ οὐκ ἦν ἀγαθά — «и не было благ» (ἀγαθόν — доброе); εἰς καιρὸν ἰάσεως — «на время исцеления» (ἴασις — исцеление, 癒し); καὶ ἰδοὺ σπουδή — «и вот, смятение» (σπουδή — поспешность, смятение; слав. «боязнь»)."
  16: "ἐκ Δαν ἀκουσόμεθα φωνὴν ὀξύτητος ἵππων αὐτοῦ — «от Дана услышим звук резкий коней его» (ὀξύτης — острота, резкость); слав. «ржание коней» (МТ). ἀπὸ φωνῆς χρεμετισμοῦ ἱππασίας ἵππων αὐτοῦ — «от звука ржания конницы его» (χρεμετισμός — ржание; ἱππασία — конница, 騎兵); ἐσείσθη πᾶσα ἡ γῆ — «потряслась вся земля» (σείω — трясти). καταφάγεται τὴν γῆν καὶ τὸ πλήρωμα αὐτῆς — «пожрёт землю и полноту её» (κατεσθίω; πλήρωμα — полнота, 満ちるもの)."
  17: "ἰδοὺ ἐγὼ ἐξαποστέλλω εἰς ὑμᾶς ὄφεις θανατοῦντας — «вот, Я посылаю на вас змей умерщвляющих» (ὄφις — змей, 蛇; θανατάω — умерщвлять); οἷς οὐκ ἔστιν ἐπᾷσαι — «которым нет заклинания» (ἐπᾴδω — заговаривать, まじない); δήξονται ὑμᾶς — «уязвят вас» (δάκνω — кусать). «と主は言われる» — слав. добавление «рече Господь» (в LXX нет), внесено как формула."
  18: "ἀνίατα μετ᾽ ὀδύνης καρδίας ὑμῶν ἀπορουμένης — «неисцельно, с болью сердца вашего, недоумевающего» (ἀνίατα — неисцельно; ὀδύνη — боль; ἀπορέω — недоумевать). Греч. фраза обрывочна (нет сказуемого); передана как есть, без сглаживания. Слав. «неизцельно со болезнию сердца вашего изчезающаго»."
  19: "φωνὴ κραυγῆς θυγατρὸς λαοῦ μου — «голос вопля дочери народа Моего» (κραυγή — вопль, 叫び). Μὴ κύριος οὐκ ἔστιν ἐν Σιων; — «разве нет Господа в Сионе?»; ἢ βασιλεὺς οὐκ ἔστιν ἐκεῖ; — «или царя нет там?». Вложенная цитата 『…』 — вопль народа; ответ («зачем они прогневали Меня…») — голос Бога в устах пророка, без кавычек. ἐν τοῖς γλυπτοῖς αὐτῶν — «идолами их» (γλυπτόν — изваяние, 彫り刻んだもの); ἐν ματαίοις ἀλλοτρίοις — «суетными чужими» (μάταιος — пустой, むなしいもの)."
  20: "διῆλθεν θέρος, παρῆλθεν ἄμητος — «прошло лето, прошла жатва» (θέρος — лето; ἄμητος — жатва); καὶ ἡμεῖς οὐ διεσώθημεν — «и мы не спаслись» (διασῴζω — спасать). Народная поговорка-плач; без кавычек, как голос народа в устах пророка (ср. 8:14–16)."
  21: "ἐπὶ συντρίμματι θυγατρὸς λαοῦ μου ἐσκοτώθην — «о сокрушении дочери народа Моего я помрачился» (σκοτόω — затемнять; слав. «сокрушен есмь и скорбен»); ἀπορίᾳ — «в недоумении, в ужасе» (ἀπορία; слав. «во ужасе»); κατίσχυσάν με ὠδῖνες ὡς τικτούσης — «одолели меня боли как у рождающей» (κατισχύω — одолевать; ὠδίν — боль рождения)."
  22: "μὴ ῥητίνη οὐκ ἔστιν ἐν Γαλααδ — «разве нет смолы (бальзама) в Галааде?» (ῥητίνη — смола, бальзам, 樹脂; слав. «ритина»); ἰατρός — врач (医者); ἴασις — исцеление; οὐκ ἀνέβη ἴασις θυγατρὸς λαοῦ μου — «не взошло исцеление дочери народа Моего» (ἀναβαίνω — восходить)."
  23: "τίς δώσει κεφαλῇ μου ὕδωρ καὶ ὀφθαλμοῖς μου πηγὴν δακρύων — «кто даст голове моей воду и глазам моим источник слёз» (πηγή — источник, 泉; δάκρυον — слеза, 涙); κλαύσομαι — «буду плакать» (κλαίω); τοὺς τετραυματισμένους — «поражённых, израненных» (τραυματίζω — ранить). В слав. этот стих — 9:1 (нумерация сдвинута: гр 8:23 = слав. 9:1), поэтому слав. 8:23 пуст; здесь он оставлен при 8:23 по гр. (см. шапку гл. 9)."
