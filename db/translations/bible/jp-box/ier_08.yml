# jp-box, Иеремия, глава 8. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc по Иеремии — только фрагменты (гл. 11, 12, 31); в гл. 8 его нет.
# jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 8: 1–3 кости царей и князей будут выброшены, народ выберет смерть; 4–5 вопрос
# о возвращении и упорство народа; 6–9 никто не кается, мудрецы посрамлены, «ложная
# трость книжников»; 10–13 суд, «мир, мир», виноград и смоковница; 14–16 голос народа
# в осаде; 17 змеи; 18–22 плач пророка, «разве нет бальзама в Галааде»; 23 «кто даст
# голове моей воду».
# Голоса: 8:1–3 — 「…» (слово Господа; «と主は言われる» в 8:1 и формула «と万軍の主は
# 言われる» в конце 8:3); 8:4–13 — одна цитата 「…» (после «彼らに言え» и вводной
# формулы; вложенные 『…』 в 8:6, 8:8, 8:11); 8:14–16 — 「…» (голос народа; в гр. без
# вводной формулы); 8:17 — 「…» (слово Господа, формула в конце); 8:18–23 — без кавычек
# (плач пророка, голос народа в его устах).
# Нумерация по gr: 23 стиха. Слав./ru в гл. 8 имеют 22 стиха: gr 8:23 («кто даст
# голове моей воду») — это слав. 9:1, поэтому слав. 8:23 пуст, а слав. гл. 9 сдвинута на
# один стих (см. notes к 8:23 и шапку гл. 9).
# 〔…〕 нет. Точки модуля: 8:11 и 8:12 — лакуны; переведены по слав. того же стиха
# (в LXX они есть, повтор 6:14–15). Сносок ⟨…⟩ нет: 葦の筆, 樹脂, ギルアデ, 粗布 уже
# в корпусе или пояснены в notes.
# Имена — транслитерация греческого (LXX): ユダ, シオン, エルサレム, ダン, ギルアデ
# (гр. Γαλααδ; в корпусе ギルアデ), エフライム.

