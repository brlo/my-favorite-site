chapter: 33
draft: true

verses:
  1: "主[しゅ]はモーセに言[い]われた。「さあ、あなたと、あなたがエジプトの地[ち]から導[みちび]き上[のぼ]ったあなたの民[たみ]は、ここを立[た]って上[のぼ]って行[ゆ]きなさい。わたしがアブラハム、イサク、ヤコブに、『あなたがたの子孫[しそん]に与[あた]える』と言[い]って誓[ちか]った地[ち]へ。"
  2: "わたしはあなたの前[まえ]に天使[てんし]を遣[つか]わし、アモリ人[じん]、ヘト人[じん]、フェレズ人[じん]、ゲルゲシ人[じん]、ヒビ人[じん]、エブス人[じん]を追[お]い払[はら]う。"
  3: "わたしはあなたを、乳[ちち]と蜜[みつ]の流[なが]れる地[ち]へ導[みちび]き入[い]れる。ただし、わたしはあなたがたの間[あいだ]をともに上[のぼ]って行[ゆ]かない。あなたがたはうなじの堅[かた]い民[たみ]だから、わたしは途中[とちゅう]であなたを滅[ほろ]ぼし尽[つ]くしてしまうかもしれない。」"
  4: "民[たみ]はこの悪[わる]い知[し]らせを聞[き]いて、喪[も]の衣[ころも]を着[き]て悲[かな]しんだ。"
  5: "主[しゅ]はイスラエルの子[こ]らに言[い]われた。「あなたがたはうなじの堅[かた]い民[たみ]である。気[き]をつけよ。わたしがあなたがたに別[べつ]の災[わざわ]いを下[くだ]して、あなたがたを滅[ほろ]ぼし尽[つ]くすことのないように。今[いま]、あなたがたの栄[えい]の衣[ころも]と飾[かざ]りを身[み]から外[はず]せ。わたしはあなたに対して何[なに]をするかを示[しめ]そう。」"
  6: "イスラエルの子[こ]らは、ホレブの山[やま]のふもとで、自分[じぶん]たちの飾[かざ]りと衣[ころも]を身[み]から外[はず]した。"
  7: "モーセは幕屋[まくや]を取[と]って、宿営[しゅくえい]の外[そと]、宿営[しゅくえい]から遠[とお]くに張[は]り、それを証[あかし]の幕屋[まくや]と呼[よ]んだ。主[しゅ]を求[もと]める者[もの]は皆[みな]、宿営[しゅくえい]の外[そと]にある幕屋[まくや]へ出[で]て行[ゆ]った。"
  8: "モーセが宿営[しゅくえい]の外[そと]にある幕屋[まくや]へ出[で]て行[ゆ]くときはいつも、民[たみ]は皆[みな]立[た]ち、おのおの自分の天幕[てんまく]の入口[いりぐち]で、モーセが幕屋[まくや]に入[はい]るまで、彼[かれ]の後[あと]を眺[なが]めていた。"
  9: "モーセが幕屋[まくや]に入[はい]るたびに、雲[くも]の柱[はしら]が下[お]りて来[き]て入口[いりぐち]に立[た]った。そして主[しゅ]はモーセに語[かた]りかけられた。"
  10: "民[たみ]は皆[みな]、雲[くも]の柱[はしら]が幕屋[まくや]の入口[いりぐち]に立[た]っているのを見[み]て、立[た]って、おのおの自分の天幕[てんまく]の入口[いりぐち]で礼拝[れいはい]した。"
  11: "主[しゅ]はモーセと顔[かお]を合[あ]わせて語[かた]られた。人[ひと]が友[とも]と語[かた]るように。モーセは宿営[しゅくえい]へ戻[もど]ったが、彼[かれ]の若[わか]い従者[じゅうしゃ]、ヌンの子[こ]ヨシュアは幕屋[まくや]から離[はな]れなかった。"
  12: "モーセは主[しゅ]に言[い]った。「ご覧[らん]ください。あなたはわたしに『この民[たみ]を導[みちび]き上[のぼ]れ』と言[い]われますが、わたしとともに遣[つか]わす者[もの]がだれかを、わたしにお示[しめ]しになりませんでした。あなたは『わたしはあなたを名[な]によって知[し]っており、あなたはわたしの前[まえ]に恵[めぐ]みを得[え]ている』と言[い]われました。"
  13: "もしわたしがあなたの前[まえ]に恵[めぐ]みを得[え]ているのなら、どうか、あなたご自身[じしん]をわたしに示[しめ]してください。わたしがあなたをはっきりと知[し]り、あなたの前[まえ]に恵[めぐ]みを得[え]ている者[もの]となるためです。また、この大[おお]きな民[たみ]があなたの民[たみ]であることを、わたしが知[し]るためです。」"
  14: "主[しゅ]は言[い]われた。「わたし自身[じしん]があなたの前[まえ]を行[ゆ]き、あなたを安[やす]んじさせよう。」"
  15: "モーセは言[い]った。「もしあなた自身[じしん]が行[ゆ]かれないのなら、わたしたちをここから上[のぼ]らせないでください。"
  16: "わたしとあなたの民[たみ]があなたの前[まえ]に恵[めぐ]みを得[え]ていることが、どうしてほかのことで知[し]られるでしょうか。あなたがわたしたちとともに行[ゆ]かれることによってではありませんか。そうしてこそ、わたしとあなたの民[たみ]は、地[ち]の上[うえ]のすべての民[たみ]にまさって誉[ほま]れを受[う]けるのです。」"
  17: "主[しゅ]はモーセに言[い]われた。「あなたが今[いま]言[い]ったこのことも、わたしは行[おこな]おう。あなたはわたしの前[まえ]に恵[めぐ]みを得[え]ており、わたしはあなたをすべての人[ひと]にまさって知[し]っているからである。」"
  18: "モーセは言[い]った。「どうか、あなたの栄光[えいこう]をわたしに見[み]せてください。」"
  19: "主[しゅ]は言[い]われた。「わたしはわたしの栄光[えいこう]をもって、あなたの前[まえ]を先[さき]に通[とお]り過[す]ぎ、あなたの前[まえ]で主[しゅ]という名[な]を宣[の]べよう。わたしはあわれみたい者[もの]をあわれみ、慈[いつく]しみたい者[もの]を慈[いつく]しむ。」"
  20: "そして言[い]われた。「あなたはわたしの顔[かお]を見[み]ることはできない。人[ひと]はわたしの顔[かお]を見[み]て、なお生[い]きていることはできないからである。」"
  21: "主[しゅ]は言[い]われた。「見[み]よ、わたしのそばに場所[ばしょ]がある。あなたは岩[いわ]の上[うえ]に立[た]て。"
  22: "わたしの栄光[えいこう]が通[とお]り過[す]ぎるとき、わたしはあなたを岩[いわ]の裂[さ]け目[め]に入[い]れ、わたしが通[とお]り過[す]ぎるまで、わたしの手[て]であなたを覆[おお]う。"
  23: "そしてわたしが手[て]を取[と]り除[の]くと、あなたはわたしの後[うしろ]を見[み]る。わたしの顔[かお]はあなたに見[み]えはしない。」"

notes:
  1: "Πορεύου ἀνάβηθι ἐντεῦθεν — ここを立って上って行きなさい (два императива: «иди, поднимись»). οὓς ἐξήγαγες — あなたが導き上った (LXX обращается к Моисею «ты»). ὤμοσα τῷ Αβρααμ… — アブラハム…に誓った. Τῷ σπέρματι ὑμῶν δώσω αὐτήν — 『あなたがたの子孫に与える』 (вложенная цитата)."
  2: "συναποστελῶ — 遣わし (συναποστέλλω — «послать вместе с»). ἐκβαλεῖ — 追い払う (ἐκβάλλω). Шесть народов; слав. добавляет «хананеа» (Хананеи), в базе его здесь нет — добавка не внесена (см. 34:11, где он есть)."
  3: "εἰσάξω σε — あなたを…導き入れる (εἰσάγω); γῆν ῥέουσαν γάλα καὶ μέλι — 乳と蜜の流れる地 (ῥέω — «течь»). οὐ γὰρ μὴ συναναβῶ — わたしは…ともに上って行かない (усиленное отрицание). σκληροτράχηλος — うなじの堅い (букв. «жестоковыйный»). ἵνα μὴ ἐξαναλῶσω σε — 滅ぼし尽くしてしまうかもしれない (ἵνα с оттенком опасения; ἐξαναλίσκω)."
  4: "τὸ ῥῆμα τὸ πονηρόν — 悪い知らせ (букв. «слово злое»). κατεπένθησαν ἐν πενθικοῖς — 喪の衣を着て悲しんだ (πενθικός — «траурный»; слав. «в плачевных ризах»)."
  5: "ὁρᾶτε μὴ πληγὴν ἄλλην ἐπάξω — 気をつけよ。別の災いを下さないように (ὁρᾶτε μή — предостережение; πληγή — «язва»). ἀφέλεσθε τὰς στολὰς τῶν δοξῶν ὑμῶν — 栄の衣を外せ. τὸν κόσμον — 飾り. δείξω σοι ἃ ποιήσω σοι — あなたに…示そう (ед. ч., обращено к Моисею, хотя речь к народу; слав. «вам»)."
  6: "περιείλαντο τὸν κόσμον αὐτῶν καὶ τὴν περιστολήν — 飾りと衣を外した (περιστολή — «облачение»; περιαιρέω — «снимать»). ἀπὸ τοῦ ὄρους τοῦ Χωρηβ — ホレブの山のふもとで."
  7: "τὴν σκηνὴν αὐτοῦ — 自分の幕屋 (σκηνή здесь — личный шатёр Моисея, не построенная ещё скиния; ср. 33:8 «自分の天幕»). ἔπηξεν — 張り (πήγνυμι — «водружать»). ἐκλήθη σκηνὴ μαρτυρίου — 証の幕屋と呼ばれた. ὁ ζητῶν κύριον — 主を求める者."
  8: "εἱστήκει πᾶς ὁ λαός — 民は皆立った (плюсквамперфект ἵστημι: «стояли»). σκοπεύοντες — 眺めて (σκοπεύω — «всматриваться»). παρὰ τὰς θύρας τῆς σκηνῆς αὐτοῦ — 自分の天幕の入口に (αὐτοῦ — каждый у своего шатра). ἕως τοῦ εἰσελθεῖν — 入るまで."
  9: "ὁ στῦλος τῆς νεφέλης — 雲の柱 (στῦλος — «столп», νεφέλη — «облако»). ἐλάλει Μωυσῇ — モーセと語られた (подлежащее не названо; слав. добавляет «(Господь)»)."
  10: "ἑώρα — 見て (имперфект: постоянно видели). στάντες — 立って. προσεκύνησαν — 礼拝した (προσκυνέω). ἀπὸ τῆς θύρας τῆς σκηνῆς αὐτοῦ — 自分の天幕の入口で."
  11: "ἐνώπιος ἐνωπίῳ — 顔を合わせて (букв. «лицом к лицу»). ὡς εἴ τις λαλήσει πρὸς τὸν ἑαυτοῦ φίλον — 人が友と語るように. ἀπελύετο — 戻った (ἀπολύω — «отпускать»). θεράπων — 従者 (слав. «слуга»), νέος — 若い. οὐκ ἐξεπορεύετο ἐκ τῆς σκηνῆς — 幕屋から離れなかった."
  12: "Ἰδοὺ σύ μοι λέγεις — ご覧ください、あなたは…言われます (вложенные цитаты 『…』). ὃν συναποστελεῖς μετ᾿ ἐμοῦ — わたしとともに遣わす者. Οἶδά σε παρὰ πάντας — わたしはあなたをすべての人にまさって知っている. χάριν ἔχεις παρ᾿ ἐμοί — わたしの前に恵みを得ている."
  13: "ἐμφάνισόν μοι σεαυτόν — あなたご自身をわたしに示してください (ἐμφανίζω — «являть»; слав. «яви ми тебе самаго»). γνωστῶς ἴδω σε — はっきりと知り (γνωστῶς — «познавательно»). ὅπως ἂν ὦ εὑρηκώς — 得ている者となるため. λαός σου τὸ ἔθνος τὸ μέγα — この大きな民があなたの民である. Синодальный («открой мне путь Твой») следует масоретскому тексту — иное чтение."
  14: "Αὐτὸς προπορεύσομαί σου — わたし自身があなたの前を行き (αὐτός — «Сам»). καταπαύσω σε — あなたを安んじさせよう (καταπαύω — «успокоить»; слав. «упокою тя»)."
  15: "Εἰ μὴ αὐτὸς σὺ πορεύῃ — もしあなた自身が行かれないのなら. μή με ἀναγάγῃς ἐντεῦθεν — わたしをここから上らせないでください (ἀνάγω)."
  16: "γνωστὸν ἔσται ἀληθῶς — どうして…知られるでしょうか (ἀληθῶς — «поистине»). ἀλλ᾿ ἢ συμπορευομένου σου μεθ᾿ ἡμῶν — あなたがわたしたちとともに行かれることによってではありませんか (ἀλλ᾿ ἤ — «кроме как»). ἐνδοξασθήσομαι — 誉れを受ける (ἐνδοξάζω — «прославляться»)."
  17: "Καὶ τοῦτόν σοι τὸν λόγον ποιήσω — このことも行おう. εὕρηκας γὰρ χάριν ἐνώπιόν μου — 恵みを得ている. οἶδά σε παρὰ πάντας — すべての人にまさって知っている (ср. 33:12)."
  18: "Δεῖξόν μοι τὴν σεαυτοῦ δόξαν — あなたの栄光をわたしに見せてください (δόξα — 栄光; слав. «покажи ми славу твою»)."
  19: "παρελεύσομαι πρότερός σου τῇ δόξῃ μου — わたしの栄光をもって、あなたの前を先に通り過ぎ (παρέρχομαι — «проходить мимо»; πρότερος — «прежде»; в Синодальном «всю славу Мою» — масоретский текст). καλέσω ἐπὶ τῷ ὀνόματί μου ΚΥΡΙΟΣ — 主という名を宣べよう (букв. «провозглашу именем Моим: Господь»). ἐλεήσω ὃν ἂν ἐλεῶ, καὶ οἰκτιρήσω ὃν ἂν οἰκτίρω — あわれみたい者をあわれみ、慈しみたい者を慈しむ (ἐλεέω — «миловать», οἰκτίρω — «щадить, соболезновать»; игра однокоренных форм)."
  20: "Οὐ δυνήσῃ ἰδεῖν μου τὸ πρόσωπον — わたしの顔を見ることはできない. οὐ γὰρ μὴ ἴδῃ ἄνθρωπος τὸ πρόσωπόν μου καὶ ζήσεται — 人は…見て、なお生きていることはできない (усиленное отрицание)."
  21: "Ἰδοὺ τόπος παρ᾿ ἐμοί — わたしのそばに場所がある. στήσῃ ἐπὶ τῆς πέτρας — 岩の上に立て (ἵστημι; πέτρα — «скала»)."
  22: "ὀπὴ τῆς πέτρας — 岩の裂け目 (ὀπή — «отверстие, расселина»). σκεπάσω τῇ χειρί μου ἐπὶ σέ — わたしの手であなたを覆おう (σκεπάζω — «покрывать»). ἕως ἂν παρέλθω — 通り過ぎるまで."
  23: "ἀφελῶ τὴν χεῖρα — 手を取り除く (ἀφαιρέω). ὄψῃ τὰ ὀπίσω μου — わたしの後を見る (ὀπίσω — «сзади, след»). τὸ πρόσωπόν μου οὐκ ὀφθήσεταί σοι — 顔は見えはしない."
