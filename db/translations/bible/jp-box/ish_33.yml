# jp-box, Исход, глава 33. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — csl-ru и jp-joc
# (1901, PD; в этой главе ст. 11–23). ru (с масоретского) — только для понимания.
# Язык — современный 常体, порядок членов и деление на клаузы — по греческому.
# Глава 33: повеление идти в землю и отказ Бога идти с народом (1–6),
# шатёр Моисея вне стана и столп облачный (7–11), «покажи мне славу Твою» (12–23).
# Красного и синего нет: речь Бога — в 「…」; внутри неё слова, которые Он велит
# передать (1), и слова, сказанные Моисею прежде (12), — в 『…』.
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено по базе). В 33:2 слав. добавляет
# «хананеа»; в базе здесь его нет, добавка не внесена (см. 34:11, где он есть).
# 33:7 — σκηνή здесь шатёр самого Моисея, получивший имя «скиния свидетельства»;
# он же назван 幕屋, чтобы не разрывать связь с построенной позже скинией.
# Сносок ⟨…⟩ нет: 幕屋, 天幕, 宿営, 天使, 栄光 уже в корпусе.
# jp-ni не использовался.

