verses:
  1: "イエスはまた、たとえを用[もち]いて彼[かれ]らに語[かた]り、こう言[い]われた。"
  2: "「<j>天[てん]の国[くに]は、自分[じぶん]の息子[むすこ]のために婚宴[こんえん]を催[もよお]した一人[ひとり]の王[おう]に似[に]ている。</j>"
  3: "<j>王[おう]は僕[しもべ]たちを遣[つか]わして、招[まね]かれた者[もの]たちを婚宴[こんえん]に呼[よ]びにやったが、彼[かれ]らは来[く]ることを望[のぞ]まなかった。</j>"
  4: "<j>そこでまた、別[べつ]の僕[しもべ]たちを遣[つか]わして言[い]わせた。『招[まね]かれた者[もの]たちにこう言[い]ってやれ。「見[み]よ、わたしの宴会[えんかい]の用意[ようい]ができた。牛[うし]も肥[こ]えた家畜[かちく]も屠[ほふ]られて、すべてが整[ととの]っている。婚宴[こんえん]に来[き]なさい」と。』</j>"
  5: "<j>しかし、彼[かれ]らはそれを気[き]にも留[と]めず、一人[ひとり]は自分[じぶん]の畑[はたけ]へ、一人[ひとり]は自分[じぶん]の商売[しょうばい]へと出[で]て行[い]った。</j>"
  6: "<j>ほかの者[もの]たちは、その僕[しもべ]たちを捕[つか]まえて辱[はずか]しめ、殺[ころ]してしまった。</j>"
  7: "<j>そこで、王[おう]は怒[いか]り、自分[じぶん]の軍[ぐん]を遣[つか]わして、その人殺[ひとごろ]しどもを滅[ほろ]ぼし、彼[かれ]らの町[まち]を焼[や]いた。</j>"
  8: "<j>そこで、王[おう]は僕[しもべ]たちに言[い]った。『婚宴[こんえん]の用意[ようい]はできているが、招[まね]かれた者[もの]たちはふさわしくなかった。</j>"
  9: "<j>だから、大通[おおどお]りへ出[で]て行[い]き、見[み]つけた者[もの]はだれでも婚宴[こんえん]に招[まね]きなさい。』</j>"
  10: "<j>僕[しもべ]たちは大通[おおどお]りへ出[で]て行[い]き、見[み]つけた者[もの]を、悪[わる]い者[もの]も良[よ]い者[もの]もすべて集[あつ]めた。こうして、婚宴[こんえん]の場[ば]は客[きゃく]でいっぱいになった。</j>"
  11: "<j>王[おう]が、席[せき]に着[つ]いている客[きゃく]たちを見[み]ようとして入[はい]って来[き]ると、そこに婚礼[こんれい]の衣[ころも]を着[き]ていない者[もの]が一人[ひとり]いた。</j>"
  12: "<j>王[おう]はその人[ひと]に言[い]った。『友[とも]よ、どうして婚礼[こんれい]の衣[ころも]もないのに、ここに入[はい]って来[き]たのか。』しかし、その人[ひと]は何[なに]も答[こた]えられなかった。</j>"
  13: "<j>そこで、王[おう]は召使[めしつかい]たちに言[い]った。『この者[もの]の足[あし]と手[て]を縛[しば]って、外[そと]の暗[くら]がりに投[な]げ出[だ]せ。そこでは泣[な]きわめきと歯[は]ぎしりがある。』</j>"
  14: "<j>召[め]される者[もの]は多[おお]いが、選[えら]ばれる者[もの]は少[すく]ない。</j>」"
  15: "そこで、ファリサイ派[は]の人々[ひとびと]は、イエスを言葉[ことば]じりで陥[おとしい]れようと相談[そうだん]した。"
  16: "彼[かれ]らは自分[じぶん]の弟子[でし]たちを、ヘロデ派[は]の人々[ひとびと]と一緒[いっしょ]にイエスのもとへ遣[つか]わして言[い]わせた。「先生[せんせい]、わたしたちは、あなたが真実[しんじつ]な方[かた]で、神[かみ]の道[みち]を真理[しんり]をもって教[おし]え、だれのことも顧[かえり]みず、人[ひと]の顔色[かおいろ]をうかがわないことを知[し]っています。"
  17: "それで、わたしたちに教[おし]えてください。どう思[おも]われますか。カエサルに税金[ぜいきん]を納[おさ]めるのは許[ゆる]されているでしょうか、いないでしょうか。」"
  18: "イエスは彼[かれ]らの悪[わる]だくみを見抜[みぬ]いて言[い]われた。「<j>偽善者[ぎぜんしゃ]たちよ。なぜ、わたしを試[こころ]みるのか。</j>"
  19: "<j>税金[ぜいきん]の硬貨[こうか]をわたしに見[み]せなさい。</j>」彼[かれ]らはデナリオン銀貨[ぎんか]を持[も]って来[き]た。"
  20: "イエスは言[い]われた。「<j>この肖像[しょうぞう]と銘[めい]は、だれのものか。</j>」"
  21: "彼[かれ]らは「カエサルのです」と言[い]った。そこで、イエスは言[い]われた。「<j>ならば、カエサルのものはカエサルに、神[かみ]のものは神[かみ]に返[かえ]しなさい。</j>」"
  22: "彼[かれ]らはこれを聞[き]いて驚[おどろ]き、イエスを離[はな]れて去[さ]った。"
  23: "その日[ひ]、復活[ふっかつ]はないと唱[とな]えるサドカイ派[は]の人々[ひとびと]が、イエスのところへ来[き]て問[と]いかけた。"
  24: "「先生[せんせい]、モーセは言[い]っています。『ある人[ひと]が子[こ]を残[のこ]さずに死[し]んだ場合[ばあい]、その兄弟[きょうだい]がその妻[つま]を娶[めと]り、兄弟[きょうだい]のために子孫[しそん]を起[おこ]さねばならない』と。"
  25: "ところで、わたしたちのところに七人[しちにん]の兄弟[きょうだい]がいました。最初[さいしょ]の者[もの]が妻[つま]を娶[めと]って死[し]に、子[こ]がなかったので、その妻[つま]を兄弟[きょうだい]に残[のこ]しました。"
  26: "二番目[にばんめ]も三番目[さんばんめ]も、七番目[ななばんめ]に至[いた]るまで同[おな]じでした。"
  27: "女[おんな]も、その後[のち]に死[し]にました。"
  28: "それでは、復活[ふっかつ]のとき、この女[おんな]は七人[しちにん]のうちだれの妻[つま]になるのでしょうか。皆[みな]、この女[おんな]を妻[つま]にしたのですから。」"
  29: "イエスはお答[こた]えになった。「<j>あなたがたは聖書[せいしょ]も神[かみ]の力[ちから]も知[し]らないで、迷[まよ]っている。</j>"
  30: "<j>復活[ふっかつ]のときには、めとることも嫁[とつ]ぐこともなく、天[てん]にいる〔神[かみ]の〕天使[てんし]たちのようになる。</j>"
  31: "<j>死者[ししゃ]の復活[ふっかつ]については、神[かみ]があなたがたにこう語[かた]られたのを読[よ]んだことがないのか。</j>"
  32: "<j>『わたしこそ、アブラハムの神[かみ]、イサクの神[かみ]、ヤコブの神[かみ]である。』神[かみ]は生[い]きている者[もの]の神[かみ]であって、死[し]んだ者[もの]の神[かみ]ではない。</j>」"
  33: "イエスの教[おし]えに、群衆[ぐんしゅう]はただ驚[おどろ]くばかりであった。"
  34: "サドカイ派[は]の人々[ひとびと]がイエスに言[い]い負[ま]かされたと聞[き]いて、ファリサイ派[は]の人々[ひとびと]は一堂[いちどう]に集[あつ]まった。"
  35: "そのうちの一人[ひとり]である律法学者[りっぽうがくしゃ]が、イエスを試[こころ]そうとして尋[たず]ねた。"
  36: "「先生[せんせい]、律法[りっぽう]の中[なか]で、どの掟[おきて]が大[おお]きいのですか。」"
  37: "イエスは言[い]われた。「<j>あなたの神[かみ]である主[しゅ]を、心[こころ]を尽[つ]くし、魂[たましい]を尽[つ]くし、思[おも]いを尽[つ]くして愛[あい]しなさい。</j>"
  38: "<j>これが大[おお]きくて第一[だいいち]の掟[おきて]である。</j>"
  39: "<j>『隣人[りんじん]を自分[じぶん]のように愛[あい]しなさい』というのが、これと同[おな]じ第二[だいに]の掟[おきて]である。</j>"
  40: "<j>この二[ふた]つの掟[おきて]に、律法[りっぽう]全体[ぜんたい]と預言者[よげんしゃ]がかかっている。</j>」"
  41: "ファリサイ派[は]の人々[ひとびと]が集[あつ]まっているとき、イエスは彼[かれ]らに問[と]われた。"
  42: "「<j>あなたがたはキリストについてどう思[おも]うか。彼[かれ]はだれの子[こ]か。</j>」彼[かれ]らは「ダビデの子[こ]です」と言[い]った。"
  43: "イエスは言[い]われた。「<j>それなら、どうしてダビデが{聖霊[せいれい]|聖神[せいしん]}によって彼[かれ]を主[しゅ]と呼[よ]んで、こう言[い]っているのか。</j>"
  44: "<j>『主[しゅ]は、わたしの主[しゅ]にお告[つ]げになった。「わたしがあなたの敵[てき]をあなたの足[あし]の下[した]に置[お]くときまで、わたしの右[みぎ]の座[ざ]に着[つ]きなさい」と。』</j>"
  45: "<j>ダビデが彼[かれ]を主[しゅ]と呼[よ]んでいるのなら、どうして彼[かれ]がダビデの子[こ]なのか。</j>」"
  46: "だれも一言[ひとこと]も答[こた]えることができず、その日[ひ]から後[のち]、あえてイエスに問[と]う者[もの]はいなかった。"

notes:
  2: "Ὡμοιώθη… ἀνθρώπῳ βασιλεῖ — «уподобилось человеку-царю»; 一人の王, как jp-joc 君王."
  4: "ἄριστον — «обед, пир»; передал 宴会, чтобы не смешивать с 婚宴 (γάμοι). Речь царя внутри притчи — в 『』, но остаётся красной, как в Мф 13."
  7: "ἐνέπρησεν — «сжёг»; τὴν πόλιν αὐτῶν — 彼らの町."
  13: "δήσαντες αὐτοῦ πόδας καὶ χεῖρας — порядок «ноги и руки» сохранён (足と手). σκότος τὸ ἐξώτερον — 外の暗がり, как в Мф 8:12; 25:30."
  14: "πολλοὶ γὰρ εἰσιν κλητοὶ ὀλίγοι δὲ ἐκλεκτοί — в критической базе стих есть; отдельного примечания не требует, передан буквально."
  16: "Ἡρῳδιανοί — иродиане; ヘロデ派, как в Мк 12:13. Две части — οὐ μέλει σοι περὶ οὐδενός и οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων — сохранены раздельно."
  17: "κῆνσος — подушная подать Риму; 税金. Καῖσαρ — カエサル по глоссарию (у jp-joc ケサリ)."
  19: "δηνάριον — динарий. Сноску не повторяю: в Мф он раньше в 18:28 и 20:2 (не мои главы), в корпусе объяснён в Мк 6:37."
  23: "Σαδδουκαῖοι — сноска уже стоит при первом упоминании в Мф 3:7."
  24: "ἐπιγαμβρεύσει — левиратный брак; 娶る, без пояснения, как в Мк 12:19."
  30: "В критической базе ὡς ἄγγελοι ἐν τῷ οὐρανῷ; Церковь (Елизаветинская «яко Ангели Божии», jp-joc 神の使等) читает τοῦ θεοῦ — 〔神の〕."
  32: "Исх 3:6. ἐγώ εἰμι передал わたしこそ (эмфаза). οὐκ ἔστιν ὁ θεὸς νεκρῶν ἀλλὰ ζώντων — «Бог не мертвых, но живых»; для естественности порядка поставил 神は生きている者の神であって、死んだ者の神ではない, смысл и оба члена сохранены (ср. Мк 12:27)."
  35: "νομικός в критической базе в квадратных скобках; Церковь читает, поэтому 律法学者 без 〔〕."
  37: "Втор 6:5. У Матфея три члена (心・魂・思い), у Марка 12:30 — четыре (с 力); порядок Матфея сохранён. ψυχή — 魂, как в Мф 10:28."
  40: "κρέμαται — «висит»; かかっている."
  43: "ἐν πνεύματι — «в Духе»; 聖霊 по правилу кальки. Пс 109:1."
  44: "Вложенность: речь Христа 「」 → Писание 『』 → слова Господа 「」, как в Мк 12:36. ὑποκάτω τῶν ποδῶν — 足の下に (у jp-joc 足の凳)."
  46: "οὐδὲ ἐτόλμησέν τις… ἐπερωτῆσαι αὐτὸν οὐκέτι — あえて問う者はいなかった."
