verses:
  1: "マナセは十二歳[じゅうにさい]で王[おう]となり、エルサレムで五十五[ごじゅうご]年[ねん]治[おさ]めた。"
  2: "彼[かれ]は主[しゅ]の目[め]に悪[わる]を行[おこな]い、主がイスラエルの子[こ]らの前[まえ]から滅[ほろ]ぼした国[くに]々[ぐに]のすべての忌[い]まわしい行[おこな]いにならった。"
  3: "彼[かれ]はまた、父[ちち]ヒゼキヤが壊[こわ]した高[たか]い所[ところ]を建[た]て直[なお]し、バアルのために石柱[せきちゅう]を立[た]て、アシェラの木立[こだち]を造[つく]り、天[てん]の軍勢[ぐんせい]すべてを拝[おが]み、それらに仕[つか]えた。"
  4: "また、主[しゅ]が「わたしの名[な]はエルサレムにとこしえにある」と言[い]われたその主の家[いえ]に、祭壇[さいだん]を築[きず]いた。"
  5: "主[しゅ]の家[いえ]の二[ふた]つの庭[にわ]に、天[てん]の軍勢[ぐんせい]すべてのために祭壇[さいだん]を築[きず]いた。"
  6: "彼[かれ]は自分[じぶん]の子[こ]らをベン・ヒノムの谷[たに]で火[ひ]の中[なか]に通[とお]らせ、占[うらな]いをし、兆[きざ]しを読[よ]み、呪術[じゅじゅつ]を行[おこな]い、霊媒[れいばい]と呪術師[じゅじゅつし]を置[お]いた。彼[かれ]は主[しゅ]の目[め]に悪[わる]いことを多[おお]く行[おこな]い、主を怒[いか]らせた。"
  7: "彼[かれ]は、神[かみ]がダビデと、その子[こ]ソロモンに「この家[いえ]と、わたしがイスラエルのすべての部族[ぶぞく]のうちから選[えら]んだエルサレムに、わたしの名[な]をとこしえに置[お]く」と言[い]われたその神の家[いえ]に、自分[じぶん]が造[つく]った像[ぞう]、すなわち彫[ほ]り物[もの]と鋳物[いもの]を置[お]いた。"
  8: "「わたしは、わたしが彼[かれ]らの父祖[ふそ]に与[あた]えた地[ち]からイスラエルの足[あし]を再[ふたた]び動[うご]かさない。ただし、彼らが、わたしが彼らに命[めい]じたすべてのことを、モーセの手[て]による律法[りっぽう]と掟[おきて]と定[さだ]めのすべてに従[したが]って守[まも]ろうとするならば。」"
  9: "しかし、マナセはユダとエルサレムの住民[じゅうみん]を惑[まど]わし、主[しゅ]がイスラエルの子[こ]らの前[まえ]から滅[ほろ]ぼしたすべての国[くに]々よりもひどい悪[わる]を行[おこな]わせた。"
  10: "主[しゅ]はマナセとその民[たみ]に語[かた]られたが、彼[かれ]らは聞[き]き従[したが]わなかった。"
  11: "主[しゅ]は彼[かれ]らの上[うえ]にアッシリアの王[おう]の軍[ぐん]の長[ちょう]たちを連[つ]れて来[こ]られた。彼[かれ]らはマナセを捕[と]らえて鎖[くさり]につなぎ、足枷[あしかせ]で縛[しば]って、バビロンへ連[つ]れて行[い]った。"
  12: "彼[かれ]は苦[くる]しみの中[なか]で、自分[じぶん]の神[かみ]である主[しゅ]の顔[かお]を求[もと]め、父祖[ふそ]の神[かみ]の前[まえ]で深[ふか]く身[み]を低[ひく]くした。"
  13: "彼が主[しゅ]に祈[いの]ると、主は彼[かれ]を聞[き]き入[い]れ、その叫[さけ]びを聞[き]き、彼をエルサレムの王国[おうこく]に戻[もど]された。こうしてマナセは、主こそ神[かみ]であることを知[し]った。"
  14: "この後[あと]、彼[かれ]はダビデの町[まち]の外[そと]に、ギホンの流[なが]れに沿[そ]って南側[みなみがわ]から、周[まわ]りの門[もん]を出[で]る所[ところ]を経[へ]てオフェルに至[いた]るまで城壁[じょうへき]を築[きず]き、これを非常[ひじょう]に高[たか]くした。また、ユダのすべての堅固[けんご]な町[まち]に軍[ぐん]の長[ちょう]たちを置[お]いた。"
  15: "彼[かれ]は異国[いこく]の神々[かみがみ]と、主[しゅ]の家[いえ]からその彫[ほ]り物[もの]を取[と]り除[のぞ]き、主の家の山[やま]とエルサレムに築[きず]いたすべての祭壇[さいだん]も取り除[のぞ]いて、町[まち]の外[そと]に投[な]げ出[だ]した。"
  16: "彼[かれ]は主[しゅ]の祭壇[さいだん]を整[ととの]え直[なお]し、その上[うえ]に救[すく]いと賛美[さんび]のいけにえをささげ、ユダに、イスラエルの神[かみ]である主に仕[つか]えるよう命[めい]じた。"
  17: "しかし、民[たみ]はなおも高[たか]い所[ところ]でいけにえをささげた。ただ、それは彼[かれ]らの神[かみ]である主[しゅ]にであった。"
  18: "マナセの残[のこ]りの言葉[ことば]、彼[かれ]が神[かみ]にささげた祈[いの]り、およびイスラエルの神[かみ]である主[しゅ]の名[な]によって彼に語[かた]った先見者[せんけんしゃ]たちの言葉[ことば]は、見[み]よ、"
  19: "彼[かれ]の祈[いの]りの言葉[ことば]のうちに、すなわち主[しゅ]が彼を聞[き]き入[い]れられたこと、彼のすべての罪[つみ]と背[そむ]き、彼が立[た]ち返[かえ]る前[まえ]に高[たか]い所[ところ]を築[きず]き、そこにアシェラの木立[こだち]と彫[ほ]り物[もの]を立[た]てたすべての場所[ばしょ]が、見[み]よ、先見者[せんけんしゃ]たちの言葉[ことば]の上[うえ]に書[か]かれている。"
  20: "マナセは父[ちち]たちとともに眠[ねむ]り、自分[じぶん]の家[いえ]の園[その]に葬[ほうむ]られた。その子[こ]アモンが彼[かれ]に代[か]わって王[おう]となった。"
  21: "アモンは二十二歳[にじゅうにさい]で王[おう]となり、エルサレムで二[に]年[ねん]治[おさ]めた。"
  22: "彼[かれ]は父[ちち]マナセがしたように主[しゅ]の前[まえ]に悪[あく]を行[おこな]い、父マナセが造[つく]ったすべての偶像[ぐうぞう]にいけにえをささげ、それらに仕[つか]えた。"
  23: "彼[かれ]は父[ちち]マナセが主[しゅ]の前[まえ]で身[み]を低[ひく]くしたようには、主の前で身を低くしなかった。かえって、その子[こ]アモンは罪[つみ]を重[かさ]ねた。"
  24: "彼[かれ]のしもべたちは彼に謀反[むほん]を起[お]こし、彼をその家[いえ]で殺[ころ]した。"
  25: "しかし、その地[ち]の民[たみ]は、アモン王[おう]に謀反[むほん]を起[お]こした者[もの]たちをみな打[う]ち殺[ころ]し、その地の民は彼[かれ]の子[こ]ヨシヤを彼に代[か]わって王[おう]とした。"

notes:
  1: "Ὢν δέκα δύο ἐτῶν — «сын двенадцати лет», т. е. двенадцати лет; ἐν τῷ βασιλεῦσαι αὐτόν — «когда он воцарился»; πεντήκοντα πέντε ἔτη — пятьдесят пять лет (в 4 Цар 21:1 те же числа); имя マナセ — как в 4 Цар 21."
  2: "τὸ πονηρὸν ἐναντίον κυρίου — злое пред Господом; ἀπὸ πάντων τῶν βδελυγμάτων τῶν ἐθνῶν — по всем мерзостям народов (βδέλυγμα — мерзость, 忌まわしい行い); ἐξωλέθρευσεν — истребил (ἐξολεθρεύω); ἀπὸ προσώπου τῶν υἱῶν Ισραηλ — от лица сынов Израилевых. Слав. «по всем мерзостем языческим»."
  3: "ἐπέστρεψεν — снова, обратился (ἐπιστρέφω); κατέσπασεν — низверг (κατασπάω); ἔστησεν στήλας ταῖς Βααλιμ — поставил столпы Ваалам (στήλη; слав. «кумиры ваалиму»); ἐποίησεν ἄλση — сделал дубравы, т. е. ашеры (アシェラの木立); προσεκύνησεν πάσῃ τῇ στρατιᾷ τοῦ οὐρανοῦ — поклонился всему воинству небесному (天の軍勢); ἐδούλευσεν αὐτοῖς — служил им."
  4: "ᾠκοδόμησεν θυσιαστήρια — построил жертвенники (мн. ч.; в 4 Цар 21:4 — ед. ч.); οὗ εἶπεν κύριος — «о котором сказал Господь»; Ἐν Ιερουσαλημ ἔσται τὸ ὄνομά μου — «в Иерусалиме будет имя Моё» (краткая цитата в повествовании, 「」); εἰς τὸν αἰῶνα — в век, навек."
  5: "ἐν ταῖς δυσὶν αὐλαῖς οἴκου κυρίου — на обоих дворах дома Господня (αὐλή); πάσῃ τῇ στρατιᾷ — датив «для всего воинства»; слав. «во двою дворех дому Господня»."
  6: "διήγαγεν τὰ τέκνα αὐτοῦ ἐν πυρί — провёл детей своих через огонь (διάγω); ἐν Γαι — βαναι — εννομ — транслитерация евр. גיא בן הנם, долина сына Еннома (ベン・ヒノムの谷, ср. 4 Цар 23:10); слав. «в удоли веенномли»; ἐκληδονίζετο — гадал; οἰωνίζετο — ворожил по птицам; ἐφαρμακεύετο — чародействовал; ἐγγαστρίμυθοι — вызыватели мёртвых (霊媒); ἐπαοιδοί — заклинатели (呪術師); ἐπλήθυνεν τοῦ ποιῆσαι — умножал делание. В csl скобочная вставка «(со жребии)» — не переведена."
  7: "ἔθηκεν τὸ γλυπτὸν καὶ τὸ χωνευτόν — поставил резное и литое (γλυπτός, χωνευτός); εἰκόνα ἣν ἐποίησεν — образ, который сделал (приложение); ἐν οἴκῳ θεοῦ — в доме Божием; цитата: Ἐν τῷ οἴκῳ τούτῳ καὶ Ιερουσαλημ … θήσω τὸ ὄνομά μου εἰς τὸν αἰῶνα — «в доме сем и в Иерусалиме… положу имя Моё в век»; ᾗ ἐξελεξάμην ἐκ πασῶν φυλῶν Ισραηλ — «который Я избрал из всех колен Израилевых» (об Иерусалиме)."
  8: "οὐ προσθήσω σαλεῦσαι — «не приложу поколебать», т. е. впредь не дам поколебаться (σαλεύω); πλὴν ἐὰν φυλάσσωνται — «разве если будут соблюдать» (условие); κατὰ πάντα τὸν νόμον καὶ τὰ προστάγματα καὶ τὰ κρίματα — по всему закону, повелениям и судам; ἐν χειρὶ Μωυσῆ — рукою Моисея. Слав. «токмо аще сохранят»."
  9: "ἐπλάνησεν — совратил (πλανάω); τοῦ ποιῆσαι τὸ πονηρόν — чтобы делать злое; ὑπὲρ πάντα τὰ ἔθνη — хуже всех народов; ἃ ἐξῆρεν κύριος — которых изгнал Господь (ἐξαίρω); ἀπὸ προσώπου υἱῶν Ισραηλ — от лица сынов Израилевых."
  10: "ἐλάλησεν κύριος ἐπὶ Μανασση — говорил Господь к Манассии (ἐπί с вин.); ἐπὶ τὸν λαὸν αὐτοῦ — к народу его; οὐκ ἐπήκουσαν — не послушали (ἐπακούω)."
  11: "ἤγαγεν ἐπ᾿ αὐτούς — навёл на них (ἄγω); τοὺς ἄρχοντας τῆς δυνάμεως βασιλέως Ασσουρ — военачальников царя Ассирийского; κατέλαβον ἐν δεσμοῖς — взяли в оковах (καταλαμβάνω); ἔδησαν ἐν πέδαις — связали ножными оковами (πέδη, ср. 4 Цар 25:7); ἤγαγον εἰς Βαβυλῶνα — отвели в Вавилон."
  12: "ὡς ἐθλίβη — когда был стеснён (θλίβω); ἐζήτησεν τὸ πρόσωπον κυρίου — взыскал лицо Господа; ἐταπεινώθη σφόδρα — смирился весьма (ταπεινόω); ἀπὸ προσώπου θεοῦ τῶν πατέρων αὐτοῦ — пред Богом отцов своих."
  13: "προσηύξατο — помолился (προσεύχομαι); ἐπήκουσεν αὐτοῦ — услышал его; ἐπήκουσεν τῆς βοῆς αὐτοῦ — услышал вопль его (повтор, как в слав.); ἐπέστρεψεν αὐτὸν εἰς Ιερουσαλημ ἐπὶ τὴν βασιλείαν — возвратил его в Иерусалим на царство; ἔγνω ὅτι κύριος αὐτός ἐστιν ὁ θεός — познал, что Господь есть Бог. В конце стиха в gr стоит редакторское тире."
  14: "μετὰ ταῦτα — после сего; τεῖχος ἔξω τῆς πόλεως Δαυιδ — стена вне города Давидова; ἀπὸ λιβὸς κατὰ Γιων ἐν τῷ χειμάρρῳ — с юга по Геону в потоке (λίψ — юг; Γιων — ギホン, ср. 3 Цар 1:33); ἐκπορευομένων τὴν πύλην τὴν κυκλόθεν — «выходящих через ворота окрест»; εἰς τὸ Οφλα — до Офлы (オフェル); ὕψωσεν σφόδρα — возвысил весьма; κατέστησεν ἄρχοντας τῆς δυνάμεως — поставил военачальников; ἐν πόλεσιν ταῖς τειχήρεσιν — в городах укреплённых. В csl добавлено «ко входу врат рыбных» — иное чтение, в тексте не отражено; слав. «от ливы к югу»."
  15: "περιεῖλεν — убрал (περιαιρέω); τοὺς θεοὺς τοὺς ἀλλοτρίους — чужих богов; τὸ γλυπτὸν ἐξ οἴκου κυρίου — изваяние из дома Господня (ед. ч.); πάντα τὰ θυσιαστήρια ἃ ᾠκοδόμησεν ἐν ὄρει οἴκου κυρίου — все жертвенники, которые построил на горе дома Господня; ἔξω τῆς πόλεως — вне города. В csl добавлено «изверже вся вон из града» — по паритету 投げ出した."
  16: "κατώρθωσεν τὸ θυσιαστήριον — восстановил, поставил прямо (κατορθόω); θυσία σωτηρίου καὶ αἰνέσεως — жертва спасения и хвалы (слав. «жертву спасения и хваления»), т. е. мирная; εἶπεν τῷ Ιουδα τοῦ δουλεύειν — сказал Иуде служить; κυρίῳ θεῷ Ισραηλ — Господу Богу Израилеву."
  17: "πλὴν ὁ λαὸς ἔτι ἐπὶ τῶν ὑψηλῶν — «но народ ещё на высотах»; глагол опущен, в csl добавлено «жряху» (приносили жертвы) — по паритету いけにえをささげた; πλὴν κύριος ὁ θεὸς αὐτῶν — «впрочем Господу, Богу своему» (датив подразумевается). В 4 Цар 21 этого стиха нет."
  18: "τὰ λοιπὰ τῶν λόγων — прочее слов; ἡ προσευχὴ αὐτοῦ ἡ πρὸς τὸν θεόν — молитва его к Богу; λόγοι τῶν ὁρώντων — слова прозорливцев (ὁρῶντες, слав. «провидящих»); λαλούντων πρὸς αὐτὸν ἐπ᾿ ὀνόματι κυρίου — говоривших к нему именем Господа; ἰδοὺ ἐπὶ λόγων — «вот, в словах…»: фраза обрывается, продолжение в 19 (в csl «се» перенесено в начало 19)."
  19: "προσευχῆς αὐτοῦ — молитвы его (продолжение оборота из 18); ὡς ἐπήκουσεν αὐτοῦ — и как Он услышал его; αἱ ἀποστάσεις αὐτοῦ — отступления его (ἀπόστασις); οἱ τόποι ἐφ᾿ οἷς ᾠκοδόμησεν τὰ ὑψηλά — места, где построил высоты; ἔστησεν ἄλση καὶ γλυπτά — поставил рощи и изваяния; πρὸ τοῦ ἐπιστρέψαι — прежде обращения его; γέγραπται ἐπὶ τῶν λόγων τῶν ὁρώντων — написано в словах прозорливцев."
  20: "ἐκοιμήθη μετὰ τῶν πατέρων — почил с отцами; ἐν παραδείσῳ οἴκου αὐτοῦ — в саду дома его (παράδεισος; слав. «в саду дому его»; в 4 Цар 21:18 — сад Уззы); ἐβασίλευσεν ἀντ αὐτοῦ Αμων — воцарился вместо него Амон (アモン)."
  21: "Υἱὸς εἴκοσι καὶ δύο ἐτῶν — «сын двадцати двух лет»; δύο ἔτη — два года; мать в LXX не названа (в 4 Цар 21:19 — Мешуллемеф)."
  22: "ὡς ἐποίησεν Μανασσης — как сделал Манассия; πᾶσιν τοῖς εἰδώλοις — всем идолам (εἴδωλον, 偶像); ἔθυεν — приносил жертвы (имперфект); ἐδούλευσεν αὐτοῖς — служил им."
  23: "οὐκ ἐταπεινώθη — не смирился; ὡς ἐταπεινώθη Μανασσης — как смирился Манассия; ὅτι υἱὸς αὐτοῦ Αμων ἐπλήθυνεν πλημμέλειαν — «ибо сын его Амон умножил преступление» (πλημμέλεια; слав. «зане сын его амон умножи грехи»); причинная связь в гр. темна, в ru «напротив» — передано かえって."
  24: "ἐπέθεντο αὐτῷ — составили заговор против него (ἐπιτίθημι); οἱ παῖδες αὐτοῦ — слуги его (слав. «раби его»); ἐπάταξαν — поразили (слав. «убиша»); ἐν οἴκῳ αὐτοῦ — в доме его. Ср. 4 Цар 21:23."
  25: "ἐπάταξεν ὁ λαὸς τῆς γῆς — поразил народ земли; τοὺς ἐπιθεμένους ἐπὶ τὸν βασιλέα — напавших на царя; ἐβασίλευσεν ὁ λαὸς … τὸν Ιωσιαν — народ воцарил Иосию (ヨシヤ); ἀντ αὐτοῦ — вместо него."
