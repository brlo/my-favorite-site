# jp-box, 2-я Паралипоменон, глава 33. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru), по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»); ru (Синодальный) —
# только для понимания, не источник. jp-joc в книге нет; jp-ni (под авторским правом)
# не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 33: нечестие Манассии (1–9), пленение и покаяние (10–13), восстановление
# (14–17), итог и смерть (18–20), Амон (21–25).
# Речь: слова Господа — 「…」 (4 — краткая цитата в повествовании; 7–8 — обетование
# при храме). Красного нет.
# Нумерация по gr: 25 стихов, совпадает с csl.
# 〔…〕 нет: слав. чтения и добавки внесены в основной текст без скобок (15 «изверже
# вон из града», 17 «жряху»); расхождения с LXX оговорены в notes.
# Сносок ⟨…⟩ нет: 神殿, 主の家, 祭壇, 高[たか]い所[ところ], アシェラ, バアル,
# 天の軍勢, 石柱, 霊媒, 呪術師 уже в корпусе.
# jp-ni не использовался.

