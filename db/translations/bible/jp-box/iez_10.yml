verses:
  1: "わたしは見[み]た。見[み]よ、ケルビムの頭[あたま]の上[うえ]の大空[おおぞら]の上[うえ]に、サファイアの石[いし]のようなもの、彼[かれ]らの上[うえ]に王座[おうざ]のような形[かたち]があった。"
  2: "主[しゅ]はその衣[ころも]を着[き]た者[もの]に言[い]われた。「ケルビムの下[した]の車輪[しゃりん]の間[あいだ]に進[すす]み、ケルビムの間[あいだ]から火[ひ]の炭[すみ]を両手[りょうて]に満[み]たして、都[みやこ]の上[うえ]に撒[ま]き散[ち]らせ。」彼[かれ]はわたしの目[め]の前[まえ]で入[はい]って行[い]った。"
  3: "その者[もの]が入[はい]って行[い]くとき、ケルビムは家[いえ]の右手[みぎて]に立[た]っていた。雲[くも]が内庭[ないてい]を満[み]たした。"
  4: "主[しゅ]の栄光[えいこう]はケルビムから離[はな]れて、家[いえ]の開[ひら]けた所[ところ]へ移[うつ]った。雲[くも]が家[いえ]を満[み]たし、庭[にわ]は主[しゅ]の栄光[えいこう]の輝[かがや]きで満[み]たされた。"
  5: "ケルビムの翼[つばさ]の音[おと]は外[そと]の庭[にわ]まで聞[き]こえ、全能者[ぜんのうしゃ]である神[かみ]が語[かた]るときの声[こえ]のようであった。"
  6: "主[しゅ]が、聖[せい]なる衣[ころも]を着[き]た者[もの]に命[めい]じて言[い]われたとき、「車輪[しゃりん]の間[あいだ]から、ケルビムの間[あいだ]から火[ひ]を取[と]れ。」彼[かれ]は入[はい]って行[い]き、車輪[しゃりん]のそばに立[た]った。"
  7: "ケルビムの一人[ひとり]が、ケルビムの間[あいだ]にある火[ひ]の中[なか]へ手[て]を伸[の]ばして取[と]り、聖[せい]なる衣[ころも]を着[き]た者[もの]の手[て]に渡[わた]した。彼[かれ]はそれを取[と]って出[で]て行[い]った。"
  8: "わたしはケルビムを見[み]た。見[み]よ、その翼[つばさ]の下[した]に人[ひと]の手[て]のようなものがあった。"
  9: "わたしは見[み]た。見[み]よ、四[よっ]つの車輪[しゃりん]がケルビムのそばに立[た]っていた。一[ひと]つの車輪[しゃりん]が一人[ひとり]のケルビムのそばに、一[ひと]つの車輪[しゃりん]がもう一人[ひとり]のケルビムのそばにあった。車輪[しゃりん]の様子[ようす]は、ルビーの石[いし]のような様子[ようす]であった。"
  10: "その様子[ようす]は四[よっ]つとも同[おな]じで、車輪[しゃりん]の中[なか]に車輪[しゃりん]があるかのようであった。"
  11: "彼[かれ]らが進[すす]むとき、四方[しほう]のいずれへも進[すす]み、進[すす]むときに振[ふ]り向[む]かなかった。一[ひと]つの頭[かしら]が向[む]かう場所[ばしょ]へ彼[かれ]らは進[すす]み、進[すす]むときに振[ふ]り向[む]かなかった。"
  12: "彼[かれ]らの全身[ぜんしん]、その背[せ]も、手[て]も、翼[つばさ]も、車輪[しゃりん]も、四[よっ]つの車輪[しゃりん]の周[まわ]りはすべて目[め]で満[み]ちていた。"
  13: "この車輪[しゃりん]は、わたしが聞[き]いているときに、ゲルゲルと呼[よ]ばれた。"
  14: "それぞれに四[よっ]つの顔[かお]があった。一[ひと]つはケルビムの顔[かお]、他[ほか]の一[ひと]つは人[ひと]の顔[かお]、第三[だいさん]は獅子[しし]の顔[かお]、第四[だいよん]は鷲[わし]の顔[かお]であった。"
  15: "ケルビムは上[あ]がった。これが、わたしがケバル川[がわ]のほとりで見[み]たあの生[い]き物[もの]である。"
  16: "ケルビムが進[すす]むとき、車輪[しゃりん]も進[すす]んだ。ケルビムが翼[つばさ]を上[あ]げて地[ち]から離[はな]れようとするとき、車輪[しゃりん]は振[ふ]り向[む]かわず、彼[かれ]らに付[つ]き従[したが]っていた。"
  17: "彼[かれ]らが立[た]っているとき、これらも立[た]ち、彼[かれ]らが上[あ]がるとき、これらも彼[かれ]らとともに上[あ]がった。彼[かれ]らのうちにいのちの霊[れい]があったからである。"
  18: "主[しゅ]の栄光[えいこう]は家[いえ]の開[ひら]けた所[ところ]から出[で]て、ケルビムの上[うえ]に乗[の]った。"
  19: "ケルビムは翼[つばさ]を上[あ]げ、わたしの目[め]の前[まえ]で地[ち]から上[あ]がった。彼[かれ]らが出[で]て行[い]くとき、車輪[しゃりん]も彼[かれ]らに付[つ]き従[したが]った。彼[かれ]らは主[しゅ]の家[いえ]の、東[ひがし]に面[めん]した門[もん]の入口[いりぐち]の上[うえ]に立[た]った。イスラエルの神[かみ]の栄光[えいこう]が、彼[かれ]らの上[うえ]に高[たか]くあった。"
  20: "これが、わたしがケバル川[がわ]のほとりで、イスラエルの神[かみ]の下[した]に見[み]たあの生[い]き物[もの]である。わたしは、それがケルビムであることを知[し]った。"
  21: "おのおのに四[よっ]つの顔[かお]があり、おのおのに四[よっ]つの翼[つばさ]があった。その翼[つばさ]の下[した]には、人[ひと]の手[て]のようなものがあった。"
  22: "その顔[かお]の様子[ようす]は、わたしがケバル川[がわ]のほとりで、イスラエルの神[かみ]の栄光[えいこう]の下[した]に見[み]たあの顔[かお]と同[おな]じであった。彼[かれ]らはおのおの、自分[じぶん]の顔[かお]の向[む]かう方[ほう]へ進[すす]んだ。"

notes:
  1: "ἐπάνω τοῦ στερεώματος τοῦ ὑπὲρ κεφαλῆς τῶν χερουβιν — «над твердью, которая над головою херувимов» (στερέωμα — твердь, 大空); ὡς λίθος σαπφείρου — «как камень сапфира» (σάπφειρος); ὁμοίωμα θρόνου ἐπ' αὐτῶν — «подобие престола над ними» (θρόνος — престол, 王座)."
  2: "τὸν ἄνδρα τὸν ἐνδεδυκότα τὴν στολήν — «мужа, одетого в одеяние» (στολή; слав. «во утварь» — «в одежду»); εἰς τὸ μέσον τῶν τροχῶν τῶν ὑποκάτω τῶν χερουβιν — «в середину колёс, которые под херувимами» (τροχός — колесо, 車輪); πλῆσον τὰς δράκας σου — «наполни горсти твои» (δράξ — горсть, пригоршня, 両手); ἀνθράκων πυρός — «углей огня» (ἄνθραξ — уголь, 炭); διασκόρπισον ἐπὶ τὴν πόλιν — «развей (рассыпь) на город»; εἰσῆλθεν ἐνώπιόν μου — «вошёл пред лицом моим». Здесь первое повеление; в 10:6 оно повторено."
  3: "τὰ χερουβιν εἱστήκει ἐκ δεξιῶν τοῦ οἴκου — «херувимы стояли по правую сторону дома» (δεξιός — правый); ἐν τῷ εἰσπορεύεσθαι τὸν ἄνδρα — «когда входил муж»; ἡ νεφέλη ἔπλησεν τὴν αὐλὴν τὴν ἐσωτέραν — «облако наполнило двор внутренний» (νεφέλη — облако)."
  4: "ἀπῆρεν ἡ δόξα κυρίου ἀπὸ τῶν χερουβιν — «поднялась слава Господня от херувимов» (ἀπαίρω — поднимать, удалять); εἰς τὸ αἴθριον τοῦ οἴκου — «на открытое место дома» (αἴθριον; слав. «в непокровение дому», 家の開けた所); τὸ φέγγος τῆς δόξης — «сияние славы» (φέγγος — свет, сияние)."
  5: "φωνὴ τῶν πτερύγων — «голос (шум) крыльев» (πτέρυξ — крыло); ἕως τῆς αὐλῆς τῆς ἐξωτέρας — «до двора внешнего»; ὡς φωνὴ θεοῦ Σαδδαι λαλοῦντος — «как голос Бога Саддаи, говорящего» (Σαδδαι — «Шаддай», Вседержитель; слав. «Бога саддаи»; передано 全能者である神, как в 1:24)."
  6: "ἐν τῷ ἐντέλλεσθαι αὐτὸν τῷ ἀνδρὶ τῷ ἐνδεδυκότι τὴν στολὴν τὴν ἁγίαν — «когда Он повелевал мужу, одетому в одеяние святое» (ἐντέλλομαι — заповедовать); Λαβὲ πῦρ ἐκ μέσου τῶν τροχῶν — «возьми огонь из среды колёс»; ἔστη ἐχόμενος τῶν τροχῶν — «стал близ колёс». Повторение повеления 10:2, но здесь одеяние названо «святым»."
  7: "ἐξέτεινεν τὴν χεῖρα αὐτοῦ — «простёр руку свою»; подлежащее в LXX не названо, по смыслу — один из херувимов (слав. «простре херувим руку»); ἔλαβεν καὶ ἔδωκεν εἰς τὰς χεῖρας τοῦ ἐνδεδυκότος — «взял и дал в руки одетого»; ἐξῆλθεν — «вышел»."
  8: "ὁμοίωμα χειρῶν ἀνθρώπων ὑποκάτωθεν τῶν πτερύγων αὐτῶν — «подобие рук человеческих под крыльями их»."
  9: "τροχοὶ τέσσαρες — «четыре колеса»; τροχὸς εἷς ἐχόμενος χερουβ ἑνός — «одно колесо близ одного херувима» (ἐχόμενος с родительным — держась, близ); ἡ ὄψις τῶν τροχῶν ὡς ὄψις λίθου ἄνθρακος — «вид колёс как вид камня антракса» (ἄνθραξ — карбункул, рубин; ルビー). Слав. добавляет «коло едино держашеся другаго херувима» — нет в LXX; внесено без 〔…〕."
  10: "ὁμοίωμα ἓν τοῖς τέσσαρσιν — «подобие одно у четырёх»; ὃν τρόπον ὅταν ᾖ τροχὸς ἐν μέσῳ τροχοῦ — «как если бы колесо было в середине колеса»."
  11: "εἰς τὰ τέσσαρα μέρη αὐτῶν ἐπορεύοντο — «шли на четыре стороны свои» (μέρος — часть, сторона); οὐκ ἐπέστρεφον — «не обращались»; εἰς ὃν ἂν τόπον ἐπέβλεψεν ἡ ἀρχὴ ἡ μία — «куда бы ни смотрело одно начало (голова)» (ἀρχή — начало, глава; ἐπιβλέπω — взирать). Слав. в скобках «(вслед его)» — редакционная помета, не внесена."
  12: "οἱ νῶτοι αὐτῶν — «спины их» (νῶτος); πλήρεις ὀφθαλμῶν κυκλόθεν — «полны очей кругом» (κυκλόθεν — со всех сторон); τοῖς τέσσαρσιν τροχοῖς αὐτῶν — «у четырёх колёс их». Слав. добавляет «вся же телеса их» («все тела их») — нет в LXX; внесено без 〔…〕 (全身)."
  13: "ἐπεκλήθη Γελγελ — «было названо Гелгел» (ἐπικαλέω — называть); Γελγελ — евр. גַּלְגַּל («колесо», галгал; отсюда игра слов; слав. «гелгель», ゲルゲル); ἀκούοντός μου — «в слух мой» (причастие)."
  14: "В модуле gr-lxx-byz на месте 10:14 стоит «.» — лакуна (стиха в базе нет). Переведено по слав. 10:14 без 〔…〕: «Четыри же лица коемуждо их: единому лице херувимле, лице же другому лице человечо, третие же лице львово и четвертое лице орлее». Ср. 1:10 (лица: человеческое, львиное, тельца, орлиное) и ru 10:14 («херувимово, человеческое, львиное, орлиное»). Четыре лица — 四つの顔."
  15: "ἦραν τὰ χερουβιν — «поднялись херувимы» (αἴρω — поднимать); τοῦτο τὸ ζῷον, ὃ εἶδον ἐπὶ τοῦ ποταμοῦ τοῦ Χοβαρ — «это то животное (живое существо), которое я видел при реке Ховар» (ζῷον — живое существо, 生き物; Χοβαρ — ケバル川)."
  16: "ἐν τῷ πορεύεσθαι τὰ χερουβιν ἐπορεύοντο οἱ τροχοί — «когда шли херувимы, шли и колёса»; ἐχόμενοι αὐτῶν — «держась их» (близ них); ἐν τῷ ἐξαίρειν… τοῦ μετεωρίζεσθαι ἀπὸ τῆς γῆς — «когда поднимали… чтобы возвыситься от земли» (μετεωρίζω — поднимать в воздух); οὐκ ἐπέστρεφον — «не обращались». Слав. добавляет в конце «и та держахуся их» — нет в LXX; внесено без 〔…〕."
  17: "ἐν τῷ ἑστάναι αὐτὰ εἱστήκεισαν — «когда они стояли, стояли и эти»; ἐμετεωρίζοντο μετ' αὐτῶν — «поднимались с ними»; πνεῦμα ζωῆς ἐν αὐτοῖς ἦν — «дух жизни был в них» (πνεῦμα ζωῆς, ср. 1:20–21; いのちの霊)."
  18: "ἐξῆλθεν δόξα κυρίου ἀπὸ τοῦ οἴκου — «вышла слава Господня из дома»; ἐπέβη ἐπὶ τὰ χερουβιν — «взошла (встала) на херувимов» (ἐπιβαίνω — восходить). Слав. «от непокровения дому» — от порога (αἴθριον)."
  19: "ἀνέλαβον τὰς πτέρυγας αὐτῶν — «подняли крылья свои»; ἐμετεωρίσθησαν ἀπὸ τῆς γῆς ἐνώπιον ἐμοῦ — «возвысились от земли пред лицом моим»; ἐπὶ τὰ πρόθυρα τῆς πύλης οἴκου κυρίου τῆς ἀπέναντι — «у преддверия ворот дома Господня, которые напротив» (ἀπέναντι — напротив; слав. «яже противу востоку»); δόξα θεοῦ Ισραηλ ἦν ἐπ' αὐτῶν ὑπεράνω — «слава Бога Израилева была над ними свыше». Здесь слава покидает порог и останавливается у восточных ворот."
  20: "τοῦτο τὸ ζῷόν ἐστιν, ὃ εἶδον ὑποκάτω θεοῦ Ισραηλ — «это то живое существо, которое я видел под Богом Израилевым» (ὑποκάτω — под, в подножии); ἔγνων ὅτι χερουβιν ἐστίν — «я узнал, что это херувимы»."
  21: "τέσσαρα πρόσωπα τῷ ἑνί — «четыре лица у одного»; ὀκτὼ πτέρυγες τῷ ἑνί — «восемь крыльев у одного» (ὀκτώ — восемь); слав. «четыри крила единому» — четыре крыла (как в 1:6); в тексте по слав., LXX-вариант (восемь) отмечен. ὁμοίωμα χειρῶν ἀνθρώπου — «подобие рук человеческих»."
  22: "ὁμοίωσις τῶν προσώπων αὐτῶν — «подобие лиц их»; ἃ εἶδον ὑποκάτω τῆς δόξης θεοῦ Ισραηλ — «которые я видел под славою Бога Израилева»; ἕκαστον κατὰ πρόσωπον αὐτῶν ἐπορεύοντο — «каждый шёл по лицу своему», т. е. прямо перед собой (κατὰ πρόσωπον — лицом к)."
