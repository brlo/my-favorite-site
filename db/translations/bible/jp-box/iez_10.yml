# jp-box, Иезекииль, глава 10. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 10 (совпадает), 22 стиха.
# Язык — современный 常体; порядок членов и клаузы — по греческому. Описание видения —
# буквально, без сглаживания; повторяющиеся формулы («и вот», «и видел я») держатся
# одинаково.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Глава 10: 1 престол над твердью; 2–7 огонь из среды херувимов и муж в одежде;
# 8–17 руки, колёса, очи и дух жизни; 18–22 слава уходит от дома к восточным воротам.
# Голоса: 10:1, 3–5, 7–22 — повествование без кавычек; 10:2 и 10:6 — 「…» (повеление
# Господа). Вводные формулы — вне кавычек.
# 10:14 — «точка»: в gr-lxx-byz на месте стиха стоит «.», стих переведён по слав.
# 10:14 без 〔…〕 (см. notes).
# csl-добавления (нет в LXX): 10:9 второе колесо, 10:12 «вся телеса их», 10:16
# «и та держахуся их» — в основном тексте без 〔…〕. 10:21: по слав. четыре крыла
# (LXX — восемь), вариант LXX в notes. Новые: ゲルゲル (Γελγελ), ルビー (λίθος ἄνθραξ),
# 大空 (στερέωμα), 全能者である神 (θεὸς Σαδδαι), 琥珀 (ἤλεκτρον, ср. 8:2).

