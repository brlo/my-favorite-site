# 灯, ケルビム, 高き方, 油を注がれた者.
# 〔…〕 нет: по новому паритету слав. добавки идут без скобок (перечислены в notes).
# Сносок ⟨…⟩ нет: ケルビム, 幕屋, 神殿, 祭壇 уже пояснены в корпусе.
