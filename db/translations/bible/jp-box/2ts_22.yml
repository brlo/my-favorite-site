verses:
  1: "ダビデは、主[しゅ]がすべての敵[てき]の手[て]とサウルの手から彼[かれ]を救[すく]い出[だ]された日[ひ]に、この歌[うた]の言葉[ことば]を主[しゅ]に向[む]かって語[かた]った。"
  2: "ダビデは歌[うた]って言[い]った。「主[しゅ]よ、わたしの岩[いわ]、わたしの砦[とりで]、わたしを救[すく]い出[だ]す方[かた]。"
  3: "わたしの神[かみ]はわたしの守[まも]り手[て]となる。わたしはこの方[かた]に寄[よ]り頼[たの]む。わたしの盾[たて]、わたしの救[すく]いの角[つの]、わたしの逃[に]げ場[ば]、わたしの救[すく]いの避[ひ]け所[どころ]。あなたはわたしを不法[ふほう]な者[もの]から救[すく]われる。"
  4: "わたしは賛美[さんび]すべき主[しゅ]を呼[よ]び求[もと]める。こうして、わたしは敵[てき]から救[すく]われる。"
  5: "死[し]の苦[くる]しみがわたしを取[と]り囲[かこ]み、不法[ふほう]の奔流[ほんりゅう]がわたしをかき乱[みだ]した。"
  6: "死[し]の苦[くる]しみがわたしを囲[かこ]み、死[し]の厳[きび]しさがわたしに先回[さきまわ]りした。"
  7: "わたしは苦[くる]しみの中[なか]で主[しゅ]を呼[よ]び、わたしの神[かみ]に向[む]かって叫[さけ]んだ。主[しゅ]はその聖[せい]なる神殿[しんでん]からわたしの声[こえ]を聞[き]かれた。わたしの叫[さけ]びは主[しゅ]の耳[みみ]に届[とど]く。"
  8: "地[ち]は揺[ゆ]れ動[うご]き、震[ふる]え上がった。天[てん]の基[もと]も揺[ゆ]さぶられ、震[ふる]えた。主[しゅ]が彼[かれ]らに怒[いか]りを燃[も]やされたからである。"
  9: "その怒[いか]りのうちに煙[けむり]が上[のぼ]り、その口[くち]から火[ひ]が食[く]らい尽[つ]くした。炭[すみ]がその方[かた]から燃[も]え上[あ]がった。"
  10: "主[しゅ]は天[てん]を傾[かたむ]けて降[お]り、その足[あし]の下[もと]には暗[くら]やみがあった。"
  11: "主[しゅ]はケルビムの上[うえ]に座[すわ]り、飛[と]んだ。風[かぜ]の翼[つばさ]の上[うえ]に現[あらわ]れた。"
  12: "主[しゅ]は暗[くら]やみをその隠[かく]れ場[ば]とし、その周[まわ]りの幕屋[まくや]は、空[そら]の雲[くも]の中[なか]の濃[こ]い水[みず]の暗[くら]やみであった。"
  13: "その御前[みまえ]の輝[かがや]きから、火[ひ]の炭[すみ]が燃[も]え上[あ]がった。"
  14: "主[しゅ]は天[てん]から雷[かみなり]を鳴[な]らし、いと高[たか]き方[かた]はその声[こえ]を響[ひび]かせられた。"
  15: "主[しゅ]は矢[や]を放[はな]って彼[かれ]らを散[ち]らし、稲妻[いなずま]を放って彼[かれ]らを震[ふる]えさせた。"
  16: "主[しゅ]の叱責[しっせき]により、その怒[いか]りの息[いき]が吹[ふ]くことにより、海[うみ]の源[みなもと]が現[あらわ]れ、世界[せかい]の基[もと]が露[あら]わになった。"
  17: "主[しゅ]は高[たか]みから手[て]を伸[の]べてわたしを取[と]り、多[おお]くの水[みず]からわたしを引[ひ]き上[あ]げられた。"
  18: "主[しゅ]はわたしを強[つよ]い敵[てき]から、わたしを憎[にく]む者[もの]から救[すく]い出[だ]された。彼[かれ]らはわたしより強[つよ]かったからである。"
  19: "彼[かれ]らはわたしの苦[くる]しみの日[ひ]に先[さき]に襲[おそ]ったが、主[しゅ]はわたしの支[ささ]えとなられた。"
  20: "主[しゅ]はわたしを広[ひろ]い所[ところ]へ連[つ]れ出[だ]し、わたしを救[すく]い出[だ]された。主[しゅ]がわたしを喜[よろこ]ばれたからである。"
  21: "主[しゅ]はわたしの義[ぎ]に応[おう]じて、わたしの手[て]の清[きよ]さに応[おう]じて、わたしに報[むく]いを与[あた]えられた。"
  22: "わたしは主[しゅ]の道[みち]を守[まも]り、わたしの神[かみ]から離[はな]れて悪[わる]いことをしなかったからである。"
  23: "主[しゅ]の裁[さば]きはすべてわたしの前[まえ]にあり、その定[さだ]めはわたしから離[はな]れなかった。"
  24: "わたしは主[しゅ]の前[まえ]で傷[きず]のない者[もの]となり、自分[じぶん]の不法[ふほう]から身[み]を守[まも]った。"
  25: "主[しゅ]はその目[め]の前[まえ]で、わたしの義[ぎ]に応[おう]じて、わたしの手[て]の清[きよ]さに応[おう]じて、わたしに報[むく]いを与[あた]えられる。"
  26: "あなたは恵[めぐ]み深[ふか]い者[もの]には恵[めぐ]み深[ふか]く、傷[きず]のない者[もの]には傷[きず]なく接[せっ]する。"
  27: "あなたは選[えら]ばれた者[もの]には選[えら]ばれた者として、曲[ま]がった者[もの]には、その曲[ま]がりに応[おう]じて接[せっ]する。"
  28: "あなたはへりくだる民[たみ]を救[すく]い、高[たか]ぶる者[もの]の目[め]を低[ひく]くされる。"
  29: "主[しゅ]よ、あなたはわたしの灯[ともしび]をともされる。わたしの神[かみ]はわたしの暗[くら]やみを照[て]らされる。"
  30: "あなたによって、わたしは帯[おび]を締[し]めて走[はし]り、わたしの神[かみ]によって、わたしは城壁[じょうへき]を越[こ]える。"
  31: "強[つよ]き方[かた]。その道[みち]は傷[きず]がなく、主[しゅ]の言葉[ことば]は火[ひ]で試[ため]されたものである。主[しゅ]は、すべて寄[よ]り頼[たの]む者[もの]の盾[たて]である。"
  32: "主[しゅ]のほかに、だれが強[つよ]い者[もの]であろうか。わたしたちの神[かみ]のほかに、だれが造[つく]り主[ぬし]であろうか。"
  33: "強[つよ]き方[かた]は力[ちから]をもってわたしを強[つよ]くし、わたしの道[みち]を傷[きず]のないものとされた。"
  34: "わたしの足[あし]を鹿[しか]のようにし、わたしを高[たか]い所[ところ]に立[た]たせる方[かた]。"
  35: "戦[たたか]いのためにわたしの手[て]を鍛[きた]え、わたしの腕[うで]を青銅[せいどう]の弓[ゆみ]とする方[かた]。"
  36: "あなたはわたしに救[すく]いの盾[たて]を与[あた]え、あなたの柔和[にゅうわ]さがわたしを大[おお]きくした。"
  37: "あなたはわたしの下[した]に歩[あゆ]みを広[ひろ]くし、わたしの足[あし]は弱[よわ]らなかった。"
  38: "わたしは敵[てき]を追[お]い、彼[かれ]らを消[け]し去[さ]って、滅[ほろ]ぼし尽[つ]くすまで引[ひ]き返[かえ]さない。"
  39: "わたしは彼[かれ]らを打[う]ち砕[くだ]き、彼らは立[た]つことができず、わたしの足[あし]の下[もと]に倒[たお]れる。"
  40: "あなたは力[ちから]を帯[お]びさせてわたしを戦[たたか]いに備[そな]えさせ、わたしに立[た]ち向[む]かう者[もの]をわたしの下[した]に伏[ふ]させられる。"
  41: "あなたはわたしの敵[てき]に背[せ]を向[む]けさせ、わたしを憎[にく]む者[もの]を滅[ほろ]ぼされた。"
  42: "彼[かれ]らは叫[さけ]んだが、救[すく]う者[もの]はなかった。主[しゅ]に呼[よ]び求[もと]めても、主[しゅ]は彼らに答[こた]えられなかった。"
  43: "わたしは彼[かれ]らを地[ち]の塵[ちり]のように打[う]ち砕[くだ]き、道[みち]の泥[どろ]のように彼らを細[こま]かくした。"
  44: "あなたはわたしの民[たみ]の争[あらそ]いからわたしを救[すく]い出[だ]し、わたしを諸国民[しょこくみん]の頭[かしら]とされた。わたしが知[し]らなかった民[たみ]が、わたしに仕[つか]える。"
  45: "異[い]国[こく]の者[もの]たちはわたしにへつらい、耳[みみ]にしたとたん、わたしに従[したが]う。"
  46: "異[い]国[こく]の者[もの]たちは衰[おとろ]え、自分[じぶん]たちの町[まち]で震[ふる]えおののく。"
  47: "主[しゅ]は生[い]きておられる。わたしの守[まも]り手[て]はたたえられる。わたしの神[かみ]、わたしの救[すく]いの守[まも]り手[て]は、高[たか]く上[あ]げられる。"
  48: "強[つよ]き主[しゅ]は、わたしに復讐[ふくしゅう]を与[あた]え、もろもろの民[たみ]をわたしの下[した]に従[したが]わせる方[かた]である。"
  49: "あなたはわたしを敵[てき]から連[つ]れ出[だ]し、わたしに立[た]ち向[む]かう者[もの]の上[うえ]にわたしを高[たか]く上[あ]げ、不法[ふほう]な人[ひと]からわたしを救[すく]い出[だ]される。"
  50: "それゆえ、主[しゅ]よ、わたしは諸国民[しょこくみん]の中[なか]であなたをほめたたえ、あなたの名[な]をほめ歌[うた]う。"
  51: "主[しゅ]はその王[おう]の救[すく]いを大[おお]きくし、その油[あぶら]を注[そそ]がれた者[もの]、ダビデとその子孫[ししそん]に、とこしえに恵[めぐ]みを施[ほどこ]される。」"

notes:
  1: "ἐλάλησεν — 語った (λαλέω). τοὺς λόγους τῆς ᾠδῆς ταύτης — この歌の言葉 (ᾠδή — песнь). ἐξεῖλατο — 救い出された (ἐξαιρέω). В csl: «И глагола Давид ко Господу словеса песни сея в день, в оньже избави и Господь из руки всех враг его и из руки сауловы». Стих — прозаическое введение; сама песнь (2–51) — речь Давида в 「…」. В Синодальном стих слит с началом песни."
  2: "Κύριε, πέτρα μου — 主よ、わたしの岩 (πέτρα — скала; ср. Пс 17:2). ὀχύρωμά μου — わたしの砦 (ὀχύρωμα — твердыня). ἐξαιρούμενός με — わたしを救い出す方. Заключительное ἐμοί («мне») в LXX и csl избыточно и по-японски не передано. В csl добавлено «и рече песнь» — «и сказал [песнь]»; нет в LXX, по паритету внесено: 歌って言った."
  3: "φύλαξ ἔσται μου — 守り手となる (φύλαξ — хранитель). πεποιθὼς ἔσομαι ἐπ᾽ αὐτῷ — この方に寄り頼む. ὑπερασπιστής — 盾. κέρας σωτηρίας — 救いの角 (рог — знак силы). ἀντιλήμπτωρ — 逃げ場 (заступник). καταφυγὴ σωτηρίας — 救いの避け所. ἐξ ἀδίκου σώσεις με — 不法な者から救われる (ἄδικος)."
  4: "αἰνετὸν ἐπικαλέσομαι κύριον — 賛美すべき主を呼び求める (αἰνετός — достохвальный, слав. «Хвальнаго»). σωθήσομαι — 救われる (греч. будущее; по-японски настоящее). Ср. Пс 17:4."
  5: "περιέσχον με — 取り囲んだ (περιέχω). LXX: συντριμμοὶ θανάτου — «сокрушения смерти»; в csl «болезни смертныя» (ὠδῖνες), по паритету взято csl — 苦しみ. χείμαρροι ἀνομίας — 不法の奔流 (χείμαρρος — зимний поток, паводок). ἐθάμβησάν με — かき乱した (θαμβέω — устрашать)."
  6: "ὠδῖνες θανάτου — болезни смерти (в csl тоже «болезни», поэтому 苦しみ повторено, как в слав.). σκληρότητες θανάτου — 死の厳しさ (σκληρότης — жестокость). προέφθασάν με — 先回りした. Ср. Пс 17:5–6, где иное распределение этих слов."
  7: "ἐν τῷ θλίβεσθαί με — 苦しみの中で. ἐπακούσεται — услышит (греч. будущее; по-японски настоящее). ἐκ ναοῦ αὐτοῦ — 聖なる神殿から (ναός). ἐν τοῖς ὠσὶν αὐτοῦ — в ушах Его."
  8: "ἐταράχθη καὶ ἐσείσθη — 揺れ動き、震え上がった. τὰ θεμέλια τοῦ οὐρανοῦ — 天の基 (в Пс 17:7 — «гор»). ἐθυμώθη κύριος αὐτοῖς — 彼らに怒りを燃やされた; αὐτοῖς — «на них» (на землю и горы или на врагов)."
  9: "ἀνέβη καπνός — 煙が上り. ἐκ στόματος αὐτοῦ — その口から (в Пс 17:8 — «от лица»). κατέδεται — поядает (греч. будущее). ἄνθρακες ἐξεκαύθησαν ἀπ᾽ αὐτοῦ — 炭がその方から燃え上がった."
  10: "ἔκλινεν οὐρανούς — 天を傾けて. γνόφος ὑποκάτω τῶν ποδῶν — 足の下の暗やみ. Порядок клауз — по греческому."
  11: "ἐπεκάθισεν ἐπὶ χερουβιν — ケルビムの上に座り. ἐπετάσθη — 飛んだ. ὤφθη ἐπὶ πτερύγων ἀνέμου — 風の翼の上に現れた (слав. «явися на крилу ветреню»; в Пс 17:10 оба глагола переданы как «летел»)."
  12: "ἔθετο σκότος ἀποκρυφὴν αὐτοῦ — 暗やみを隠れ場とし. κύκλῳ αὐτοῦ — その周りの. ἡ σκηνὴ αὐτοῦ σκότος ὑδάτων — 幕屋は水の暗やみ. ἐπάχυνεν ἐν νεφέλαις ἀέρος — сгустил в облаках воздуха; передано определением 濃い при «水»."
  13: "ἀπὸ τοῦ φέγγους ἐναντίον αὐτοῦ — その御前の輝きから (φέγγος — сияние). ἐξεκαύθησαν ἄνθρακες πυρός — 火の炭が燃え上がった. Ср. Пс 17:13, где добавлены град и облака."
  14: "ἐβρόντησεν ἐξ οὐρανοῦ — 天から雷を鳴らし (βροντάω). ὁ ὕψιστος — いと高き方. ἔδωκεν φωνὴν αὐτοῦ — その声を響かせられた."
  15: "ἀπέστειλεν βέλη — 矢を放って. ἐσκόρπισεν — 散らし. ἀστραπήν — 稲妻. ἐξέστησεν — 震えさせた, привёл в ужас (в Пс 17:15 — «смутил»)."
  16: "ἀφέσεις θαλάσσης — 海の源 (ἄφεσις — «отпущение, исток»; слав. «источницы морстии»). θεμέλια τῆς οἰκουμένης — 世界の基. ἐπιτίμησις — 叱責. πνοὴ πνεύματος θυμοῦ — 怒りの息の吹くこと (πνεῦμα здесь не «Дух Святой», поэтому 霊 не поставлено)."
  17: "ἀπέστειλεν ἐξ ὕψους — 高みから手を伸べて (букв. «послал с высоты»). ἔλαβέν με — 取り. εἵλκυσέν με — 引き上げられた (ἕλκω). ἐξ ὑδάτων πολλῶν — 多くの水から."
  18: "ἐρρύσατό με ἐξ ἐχθρῶν μου ἰσχύος — 強い敵から (ἰσχύς — сила). ἐκ τῶν μισούντων με — 憎む者から. ἐκραταιώθησαν ὑπὲρ ἐμέ — わたしより強かった."
  19: "προέφθασάν με — 先に襲った. ἐν ἡμέρᾳ θλίψεώς μου — 苦しみの日に. ἐπιστήριγμα — 支え (подпора, опора)."
  20: "ἐξήγαγέν με εἰς πλατυσμόν — 広い所へ連れ出し (πλατυσμός — простор). ἐξείλατό με — 救い出された. εὐδόκησεν ἐν ἐμοί — わたしを喜ばれた."
  21: "ἀνταπέδωκέν μοι — 報いを与えられた (ἀνταποδίδωμι; в греч. повторено в конце стиха, по-японски один раз). δικαιοσύνη — 義. καθαριότης τῶν χειρῶν — 手の清さ."
  22: "ἐφύλαξα ὁδοὺς κυρίου — 主の道を守り. οὐκ ἠσέβησα ἀπὸ τοῦ θεοῦ μου — 神から離れて悪いことをしなかった (ἀσεβέω)."
  23: "κρίματα — 裁き. δικαιώματα — 定め. LXX: οὐκ ἀπέστην ἀπ᾽ αὐτῶν — «я не отступил от них»; в csl «оправдания его не отступиша от мене» — «они не отступили от меня»; по паритету взято csl."
  24: "ἄμωμος — 傷のない. προφυλάξομαι ἀπὸ τῆς ἀνομίας μου — 自分の不法から身を守った."
  25: "ἐνώπιον τῶν ὀφθαλμῶν αὐτοῦ — その目の前で. ἀποδώσει — воздаст (в ст. 21 — прошедшее время)."
  26: "μετὰ ὁσίου ὁσιωθήσῃ — 恵み深い者には恵み深く (ὅσιος — верный, благочестивый). μετὰ ἀνδρὸς τελείου τελειωθήσῃ — 傷のない者には傷なく (τέλειος — совершенный; слав. «с мужем неповинным неповинен будеши»). Перевод согласован с Пс 17:25."
  27: "ἐκλεκτοῦ ἐκλεκτὸς ἔσῃ — 選ばれた者には選ばれた者として. στρεβλοῦ στρεβλωθήσῃ — 曲がった者にはその曲がりに応じて (στρεβλός — лукавый, строптивый). Антропоморфизм не сглажен."
  28: "λαὸν τὸν πτωχόν — へりくだる民 (πτωχός — нищий, угнетённый). ὀφθαλμοὺς ἐπὶ μετεώρων ταπεινώσεις — 高ぶる者の目を低くされる (μετέωρος — высоко поднятый)."
  29: "ὁ λύχνος μου — わたしの灯. ἐκλάμψει μοι τὸ σκότος — 暗やみを照らされる (ἐκλάμπω)."
  30: "ἐν σοὶ δραμοῦμαι μονόζωνος — あなたによって帯を締めて走り (μονόζωνος — «один опоясанный», т.е. налегке, без доспехов; слав. «потеку препоясан»). ὑπερβήσομαι τεῖχος — 城壁を越える."
  31: "ὁ ἰσχυρός — 強き方, т.е. Бог (в Пс 17:31 — «Бог»). ἄμωμος ἡ ὁδὸς αὐτοῦ — その道は傷がない. ῥῆμα κυρίου κραταιόν, πεπυρωμένον — 主の言葉は火で試された (πυρόω — очищать огнём). ὑπερασπιστής — 盾."
  32: "τίς ἰσχυρὸς πλὴν κυρίου — 主のほかに、だれが強い者か. κτίστης — 造り主 (в Пс 17:32 — θεός, «Бог»)."
  33: "ὁ κραταιῶν με δυνάμει — 力をもって強くし (κραταιόω). ἐξετίναξεν ἄμωμον τὴν ὁδόν μου — 道を傷のないものとされた (ἐκτινάσσω — «вытряхнул», слав. «положи»)."
  34: "τιθεὶς τοὺς πόδας ὡς ἐλάφων — 足を鹿のようにし. ἐπὶ τὰ ὕψη ἱστῶν — 高い所に立たせる (ἵστημι)."
  35: "διδάσκων χεῖρας εἰς πόλεμον — 手を戦いに鍛え. κατάξας τόξον χαλκοῦν ἐν βραχίονί μου — 腕を青銅の弓とする (κατάγω — натягивать)."
  36: "ὑπερασπισμὸν σωτηρίας — 救いの盾. LXX: ἡ ὑπακοή σου ἐπλήθυνέν με — «послушание Твоё умножило меня»; в csl «кротость твоя умножи мя» (по масоретскому); по паритету взято csl — 柔和さ."
  37: "εἰς πλατυσμὸν εἰς τὰ διαβήματά μου — 歩みを広くし (в греч. нет глагола, его даёт слав. «разширил еси»). οὐκ ἐσαλεύθησαν τὰ σκέλη μου — 足は弱らなかった (σκέλος — голень)."
  38: "διώξω — 追い. ἀφανιῶ — 消し去って (ἀφανίζω). οὐκ ἀναστρέψω — 引き返さない. ἕως συντελέσω — 滅ぼし尽くすまで."
  39: "θλάσω — 打ち砕く (θλάω). οὐκ ἀναστήσονται — 立つことができない. πεσοῦνται ὑπὸ τοὺς πόδας — 足の下に倒れる."
  40: "ἐνισχύσεις με δυνάμει εἰς πόλεμον — 力を帯びさせて戦いに備えさせ. κάμψεις — 伏させられる (κάμπτω — сгибать). ἐπανιστανομένους μοι — 立ち向かう者."
  41: "ἔδωκάς μοι νῶτον — 背を向けさせた (νῶτον — спина). ἐθανάτωσας — 滅ぼされた (θανατόω)."
  42: "βοήσονται — 叫ぶ (греч. будущее; передано прошедшим, как в Пс 17:41). οὐκ ἔστιν βοηθός — 救う者はない. οὐχ ὑπήκουσεν αὐτῶν — 答えられなかった (ὑπακούω — слушать, внимать)."
  43: "ἐλέανα — измельчил (ἐλαύνω; форма редкая). χοῦν γῆς — 地の塵. πηλὸν ἐξόδων — 道の泥 (ἔξοδοι — выходы, улицы; слав. «брение путий»). ἐλέπτυνα — 細かくした (λεπτύνω)."
  44: "ῥύσῃ με ἐκ μάχης λαῶν — 民の争いから; в csl «от пререкания людий моих» — добавлено «моих» (нет в LXX), по паритету взято csl: わたしの民. εἰς κεφαλὴν ἐθνῶν — 諸国民の頭. λαός, ὃν οὐκ ἔγνων — 知らなかった民. ἐδούλευσάν μοι — 仕える."
  45: "υἱοὶ ἀλλότριοι — 異国の者たち. ἐψεύσαντό μοι — へつらう (букв. «лгали мне»). εἰς ἀκοὴν ὠτίου ἤκουσάν μου — 耳にしたとたん、従う (букв. «в слух уха услышали меня»)."
  46: "ἀπορριφήσονται — 衰える (ἀπορρίπτω — отбрасывать). σφαλοῦσιν ἐκ τῶν συγκλεισμῶν αὐτῶν — LXX «поскользнутся из затворов своих» (συγκλεισμός); в csl «вострепещут во градех своих» — по паритету взято csl: 自分たちの町で震えおののく."
  47: "ζῇ κύριος — 主は生きておられる. εὐλογητὸς ὁ φύλαξ μου — わたしの守り手はたたえられる. ὑψωθήσεται — 高く上げられる. ὁ φύλαξ τῆς σωτηρίας μου — わたしの救いの守り手."
  48: "ἰσχυρὸς κύριος — 強き主. διδοὺς ἐκδικήσεις ἐμοί — 復讐を与え (ἐκδίκησις). παιδεύων λαοὺς ὑποκάτω μου — 民を下に従わせ (παιδεύω — наставлять, покорять; слав. «наказуяй»)."
  49: "ἐξάγων με ἐξ ἐχθρῶν — 敵から連れ出し. ἐκ τῶν ἐπεγειρομένων μοι ὑψώσεις με — 立ち向かう者の上に高く上げ. ἐξ ἀνδρὸς ἀδικημάτων — 不法な人から (букв. «от мужа неправд»)."
  50: "ἐξομολογήσομαί σοι — ほめたたえる (букв. «исповедаю Тебя»). ἐν τοῖς ἔθνεσιν — 諸国民の中で. ψαλῶ — ほめ歌う. Ср. Пс 17:49; Рим 15:9."
  51: "μεγαλύνων σωτηρίας βασιλέως αὐτοῦ — その王の救いを大きくし. ποιῶν ἔλεος τῷ χριστῷ αὐτοῦ — 油を注がれた者に恵みを施される (χριστός — титул, не имя). τῷ σπέρματι αὐτοῦ ἕως αἰῶνος — その子孫に、とこしえに. Здесь песнь кончается; ср. Пс 17:50."
