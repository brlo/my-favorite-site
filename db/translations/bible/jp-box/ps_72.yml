verses:
  1: "アサフの詩[うた]。神[かみ]はイスラエルに、心[こころ]の正[ただ]しい者[もの]に、なんと善[よ]い方[かた]であることか。"
  2: "しかし、このわたしは、足[あし]がほとんどつまずき、歩[あゆ]みがほとんど失[うしな]われた。"
  3: "というのは、わたしは不法[ふほう]の者[もの]たちをねたみ、罪[つみ]人[びと]の平安[へいわ]を見[み]ていたからである。"
  4: "彼[かれ]らは死[し]に至[いた]るまで苦[くる]しまず、その力[ちから]は健[すこや]かである。"
  5: "彼[かれ]らは人[ひと]の労苦[ろうく]の中[なか]におらず、人[ひと]と共[とも]にむち打[う]たれることもない。"
  6: "それゆえ、傲慢[ごうまん]が彼[かれ]らをとらえ、彼[かれ]らは自[みずか]らの不法[ふほう]と不敬[ふけい]とを衣[ころも]のようにまとう。"
  7: "彼[かれ]らの不法[ふほう]は脂肪[しぼう]から出[で]るように現[あらわ]れ、心[こころ]の思[おも]いの中[なか]にまで入[はい]り込[こ]む。"
  8: "彼[かれ]らは悪[わる]だくみを考[かんが]えて語[かた]り、不法[ふほう]を高[たか]みへ向[む]けて語[かた]る。"
  9: "彼[かれ]らは口[くち]を天[てん]に置[お]き、その舌[した]は地[ち]の上[うえ]を巡[めぐ]る。"
  10: "それゆえ、わたしの民[たみ]はここへと向[む]かい、満[み]ち足[た]りた日[ひ]々[び]が彼[かれ]らに与[あた]えられる。"
  11: "そして彼[かれ]らは言[い]う。「どうして神[かみ]が知[し]っていようか。至高[しこう]の神[かみ]に知識[ちしき]があるだろうか」と。"
  12: "見[み]よ、これら罪[つみ]人[びと]は栄[さか]え、富[とみ]をとこしえに手[て]に入[い]れている。"
  13: "そしてわたしは言[い]った。「むだにわたしは心[こころ]を清[きよ]め、罪[つみ]のない者[もの]のように手[て]を洗[あら]ったのだろうか」と。"
  14: "わたしは一日中[いちにちじゅう]むち打[う]たれ、朝[あさ]ごとに責[せ]められた。"
  15: "もしわたしが「このように語[かた]ろう」と言[い]うなら、見[み]よ、わたしはあなたの子[こ]らの世代[せだい]に背[そむ]いたことになる。"
  16: "わたしはこれを悟[さと]ろうとしたが、それはわたしの前[まえ]では労苦[ろうく]であった。"
  17: "わたしは神[かみ]の聖所[せいしょ]に入[はい]り、彼[かれ]らの終[おわ]りを悟[さと]った。"
  18: "まことに、あなたは彼[かれ]らの欺[あざむ]きのゆえに彼[かれ]らに報[むく]い、彼[かれ]らが高[たか]ぶるやいなや、彼[かれ]らを倒[たお]された。"
  19: "なんと、彼[かれ]らはたちまち荒[あ]れ果[は]てたことか。彼[かれ]らは消[き]え失[う]せ、自[みずか]らの不法[ふほう]のゆえに滅[ほろ]びた。"
  20: "主[しゅ]よ、目[め]を覚[さ]ます者[もの]の見[み]る夢[ゆめ]のように、あなたはご自分[じぶん]の都[みやこ]で彼[かれ]らの姿[すがた]を軽[かろ]んじられる。"
  21: "わたしの心[こころ]は燃[も]え、わたしの内[うち]なるものは変[か]わったとき、"
  22: "わたしは軽[かろ]んじられ、何[なに]も悟[さと]らず、あなたの前[まえ]では獣[けもの]のようであった。"
  23: "しかし、わたしはいつもあなたと共[とも]にあり、あなたはわたしの右[みぎ]の手[て]を取[と]ってくださる。"
  24: "あなたはその定[さだ]めによってわたしを導[みちび]き、後[のち]に栄光[えいこう]のうちにわたしを受[う]け入[い]れてくださる。"
  25: "天[てん]であなたのほかに、わたしに何[なに]があろうか。地[ち]でも、あなたのほかにわたしは何[なに]を望[のぞ]まない。"
  26: "わたしの心[こころ]も肉[にく]も尽[つ]き果[は]てた。わたしの心[こころ]の神[かみ]、わたしの分[ぶん]け前[まえ]である神[かみ]は、とこしえに。"
  27: "見[み]よ、あなたから遠[とお]ざかる者[もの]は滅[ほろ]びる。あなたから離[はな]れて淫[みだら]にふるまう者[もの]を、あなたは皆[みな]滅[ほろ]ぼされた。"
  28: "しかし、わたしにとっては、神[かみ]に寄[よ]り添[そ]うことが善[よ]いことである。主[しゅ]にわたしの望[のぞ]みを置[お]き、シオンの娘[むすめ]の門[もん]で、あなたのすべての賛美[さんび]を告[つ]げ知[し]らせるためである。"

notes:
  1: "Надписание (прежний ст. 0, влит в этот стих): В gr-lxx-byz строки 0 нет: стих 1 начинается с Ὡς ἀγαθός. Но в ru-базе и у jp-joc надписание есть («Псалом Асафа», アサフの詠), поэтому по образцу Пс 1 оно влито в ст. 1, без 〔…〕 (надписания не маркируются). Стих: Ὡς ἀγαθὸς τῷ Ισραηλ ὁ θεός — 神は…なんと善い方であることか (ὡς в восклицании). τοῖς εὐθέσι τῇ καρδίᾳ — 心の正しい者に (εὐθύς — «прямой, правый»). Датив «Израилю» сохранён."
  2: "ἐμοῦ δὲ παρὰ μικρόν — «а у меня чуть было»; ἐσαλεύθησαν οἱ πόδες — 足がよろめいた (σαλεύω — «колебать»). παρ᾽ ὀλίγον ἐξεχύθη τὰ διαβήματά μου — 歩みがほとんど失われた (ἐκχέω — «вылиться, расплескаться»)."
  3: "ἐζήλωσα ἐπὶ τοῖς ἀνόμοις — 不法の者たちをねたんだ (ζηλόω — «завидовать, ревновать»). εἰρήνην ἁμαρτωλῶν θεωρῶν — видя мир грешников (εἰρήνη — не только «мир», но и благоденствие)."
  4: "οὐκ ἔστιν ἀνάνευσις τῷ θανάτῳ αὐτῶν — нет уклонения (отсрочки) смерти их; στερέωμα ἐν τῇ μάστιγι αὐτῶν — крепость в бичевании их. Передано по смыслу церковного чтения: 死に至るまで苦しまず、力は健やか (ср. jp-joc)."
  5: "ἐν κόποις ἀνθρώπων οὐκ εἰσίν — 人の労苦の中におらず. μετὰ ἀνθρώπων οὐ μαστιγωθήσονται — 人と共にむち打たれることもない (μαστιγόω — «бичевать»)."
  6: "ἐκράτησεν αὐτοὺς ἡ ὑπερηφανία — 傲慢が彼らをとらえ. περιεβάλοντο ἀδικίαν καὶ ἀσέβειαν αὐτῶν — 不法と不敬とを衣のようにまとう (περιβάλλω — «облекать»)."
  7: "ἐξελεύσεται ὡς ἐκ στέατος ἡ ἀδικία αὐτῶν — 不法は脂肪から出るように現れる (στέαρ — «тук, жир»). διήλθοσαν εἰς διάθεσιν καρδίας — вошли в расположение сердца; 心の思いの中にまで入り込む. Евр. здесь «глаза выкатились от жира», LXX — ἀδικία; следуем LXX."
  8: "διενοήθησαν καὶ ἐλάλησαν ἐν πονηρίᾳ — 悪だくみを考えて語り. ἀδικίαν εἰς τὸ ὕψος ἐλάλησαν — 不法を高いところまで語る (εἰς τὸ ὕψος — «в высоту», т. е. надменно)."
  9: "ἔθεντο εἰς οὐρανὸν τὸ στόμα αὐτῶν — 口を天に置き (поставили уста на небо). ἡ γλῶσσα αὐτῶν διῆλθεν ἐπὶ τῆς γῆς — 舌は地の上を巡る."
  10: "ἐπιστρέψει ὁ λαός μου ἐνταῦθα — わたしの民はここへと向かう. ἡμέραι πλήρεις εὑρεθήσονται αὐτοῖς — 満ちたる日々が彼らに与えられる («дни полные» — довольство). У jp-joc иначе («пьют воду из полной чаши»), но в gr — так."
  11: "καὶ εἶπαν· Πῶς ἔγνω ὁ θεός — どうして神が知っていようか. εἰ ἔστιν γνῶσις ἐν τῷ ὑψίστῳ — 至高の神に知識があるだろうか. Слова нечестивых — 「」."
  12: "ἰδοὺ οὗτοι ἁμαρτωλοὶ καὶ εὐθηνοῦνται — 見よ、これら罪人は栄え (εὐθηνέω — «процветать»). εἰς τὸν αἰῶνα κατέσχον πλούτου — 富をとこしえに手に入れている (κατέχω — «владеть»)."
  13: "Ἄρα ματαίως ἐδικαίωσα τὴν καρδίαν μου — むだに心を清めたのだろうか (δικαιόω — «делать правым, оправдывать»). ἐνιψάμην ἐν ἀθῴοις τὰς χεῖράς μου — умыл руки в невинности (ἀθῷος — «невинный»). Своя речь — 「」."
  14: "μεμαστιγωμένος ὅλην τὴν ἡμέραν — 一日中むち打たれ. ὁ ἔλεγχός μου εἰς τὰς πρωίας — 朝ごとに責められた (ἔλεγχος — «обличение»; εἰς τὰς πρωίας — «до утр», каждое утро)."
  15: "εἰ ἔλεγον· Διηγήσομαι οὕτως — если бы я сказал: «так буду рассказывать». τῇ γενεᾷ τῶν υἱῶν σου ἠσυνθέτηκα — あなたの子らの世代に背いた (ἀσυνθετέω — «нарушать договор, изменять»)."
  16: "ὑπέλαβον τοῦ γνῶναι τοῦτο — я взялся понять это (ὑπολαμβάνω — «принимать, браться»). κόπος ἐστὶν ἐναντίον μου — это труд предо мною, わたしの前では労苦."
  17: "ἕως εἰσέλθω εἰς τὸ ἁγιαστήριον τοῦ θεοῦ — доколе не войду в святилище Божие; 聖所. συνῶ εἰς τὰ ἔσχατα αὐτῶν — уразумею конец их (συνίημι — «понимать»)."
  18: "διὰ τὰς δολιότητας ἔθου αὐτοῖς — за коварства их Ты положил им (δολιότης — «коварство»); κατέβαλες αὐτοὺς ἐν τῷ ἐπαρθῆναι — низверг их, когда они возносились (ἐπαίρομαι — «возноситься»)."
  19: "πῶς ἐγένοντο εἰς ἐρήμωσιν ἐξάπινα — как стали разорением внезапно (ἐξάπινα — «внезапно»). ἐξέλιπον, ἀπώλοντο διὰ τὴν ἀνομίαν αὐτῶν — исчезли, погибли за беззаконие своё."
  20: "ὡσεὶ ἐνύπνιον ἐξεγειρομένου — как сон пробуждающегося. ἐν τῇ πόλει σου τὴν εἰκόνα αὐτῶν ἐξουδενώσεις — ご自分の都で彼らの姿を軽んじられる (εἰκών — «образ»; ἐξουδενόω — «уничижать»)."
  21: "ἐξεκαύθη ἡ καρδία μου — 心が燃えた. οἱ νεφροί μου ἠλλοιώθησαν — «почки мои изменились»; νεφροί у евр. — средоточие чувств, передано 内なるもの."
  22: "ἐξουδενωμένος καὶ οὐκ ἔγνων — 軽んじられ、何も悟らず. κτηνώδης ἐγενόμην παρὰ σοί — あなたの前では獣のようであった (κτηνώδης — «скотоподобный»)."
  23: "διὰ παντὸς μετὰ σοῦ — いつもあなたと共に. ἐκράτησας τῆς χειρὸς τῆς δεξιᾶς μου — わたしの右手を取ってくださる (κρατέω — «держать»)."
  24: "ἐν τῇ βουλῇ σου ὡδήγησάς με — その定めによって導き (βουλή — «совет, определение»). μετὰ δόξης προσελάβου με — 後に栄光のうちに受け入れてくださる (προσλαμβάνω — «принимать к себе»)."
  25: "τί γάρ μοι ὑπάρχει ἐν τῷ οὐρανῷ — 天であなたのほかにわたしに何があろうか (ὑπάρχω — «иметься»). παρὰ σοῦ τί ἠθέλησα ἐπὶ τῆς γῆς — あなたのほかに地で何を望むか."
  26: "ἐξέλιπεν ἡ καρδία μου καὶ ἡ σάρξ μου — 心も肉も尽き果てた. ὁ θεὸς τῆς καρδίας μου καὶ ἡ μερίς μου ὁ θεὸς εἰς τὸν αἰῶνα — приложение: Бог сердца моего и часть моя — Бог вовеки; とこしえに (эллипсис сохранён)."
  27: "οἱ μακρύνοντες ἑαυτοὺς ἀπὸ σοῦ ἀπολοῦνται — あなたから遠ざかる者は滅びる. ἐξωλέθρευσας πάντα τὸν πορνεύοντα ἀπὸ σοῦ — あなたから離れて淫にふるまう者を皆滅ぼされた (πορνεύω — «блудодействовать», т. е. изменять Богу)."
  28: "τὸ προσκολλᾶσθαι τῷ θεῷ ἀγαθόν ἐστιν — 神に寄り添うことが善い (προσκολλάω — «прилепляться»). τίθεσθαι ἐν τῷ κυρίῳ τὴν ἐλπίδα μου — 主に望みを置き. ἐξαγγεῖλαι πάσας τὰς αἰνέσεις σου ἐν ταῖς πύλαις τῆς θυγατρὸς Σιων — シオンの娘の門であなたのすべての賛美を告げ知らせる (πύλη — «врата»; θυγάτηρ Σιων — «дщерь Сиона»)."
