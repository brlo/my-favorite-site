# jp-box, Исаия, глава 55. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный, с МТ) — только для понимания,
# не источник. jp-joc в гл. 55 нет; jp-ni не использовался. Разночтения сверены по
# gr-lxx-swete (Свит) — в notes.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 55: 1–5 призыв к жаждущим: вода, вино и тук без серебра, вечный завет Давида,
# свидетель народам; 6–7 «ищите Господа», оставить пути, обращение и помилование;
# 8–9 «Мои мысли — не ваши мысли»; 10–11 дождь и снег, слово Божие; 12–13 радостный
# выход, горы и деревья, кипарис и мирт.
# Голоса: 55:1–5 — 「…» (слово Господа: «придите», «Я заключу завет», «Я дал его»);
# 55:6–7 — призыв пророка, без кавычек; 55:8–9 — 「…» (слова Господа, формула
# «говорит Господь» в конце 55:8 — внутри речи, как в 1:11); 55:10–11 — 「…» (сравнение
# дождя и слова, одно предложение на два стиха); 55:12–13 — пророческая речь, без кавычек.
# Нумерация по gr: 13 стихов, как у csl и ru. Слав. 55:1 «ядите (и пийте)» — вариант
# в скобках издания; 55:6 у Свита и в слав. κύριον («Господа»), в gr-lxx-byz θεόν;
# 55:11 слав. добавляет «ко мне тощь». Всё оговорено в notes.
# 〔…〕 нет. Сносок ⟨…⟩ нет: 渇く, 脂, 糸杉, ミルトス, いらくさ уже в корпусе.
# Имена — транслитерация греческого (LXX).

