verses:
  1: "「渇[かわ]いている者[もの]たちよ、水[みず]のところへ行[い]け。銀[ぎん]を持[も]たない者[もの]もみな、行[い]って買[か]え。銀[ぎん]も代価[だいか]もなしに、ぶどう酒[ぶどうしゅ]と脂[あぶら]を買[か]って食[た]べよ。"
  2: "なぜ、あなたがたは銀[ぎん]を、パンにならないものに払[はら]い、自分[じぶん]の労苦[ろうく]を、満[み]たすことのないものに注[そそ]ぐのか。わたしに聞[き]け。そうすれば、あなたがたは良[よ]いものを食[た]べ、あなたがたの魂[たましい]は良[よ]いもののうちに喜[よろこ]びを得[え]る。"
  3: "あなたがたの耳[みみ]を傾[かたむ]けて、わたしの道[みち]に従[したが]え。わたしに聞[き]け。そうすれば、あなたがたの魂[たましい]は良[よ]いもののうちに生[い]きる。わたしはあなたがたと永遠[えいえん]の契約[けいやく]を結[むす]ぶ。ダビデの聖[せい]なるもの、確[たし]かなものを。"
  4: "見[み]よ、わたしは彼[かれ]を諸国[しょこく]の民[たみ]の間[あいだ]の証[あか]しとし、民[たみ]の支配者[しはいしゃ]、命令[めいれい]する者[もの]とした。"
  5: "あなたを知[し]らなかった諸国[しょこく]の民[たみ]があなたを呼[よ]び、あなたを知らない民[たみ]たちがあなたのもとへ逃[に]げ込[こ]む。あなたの神[かみ]である主[しゅ]、イスラエルの聖[せい]なる方[かた]のゆえである。その方[かた]があなたに栄光[えいこう]を与[あた]えたからである。」"
  6: "主[しゅ]を尋[たず]ね求[もと]めよ。主が見[み]つかるうちに、主を呼[よ]び求[もと]めよ。主があなたがたに近[ちか]づかれるときに。"
  7: "悪[わる]い者[もの]はその道[みち]を捨[す]て、不法[ふほう]な人[ひと]はその計[はかり]ごとを捨てよ。主[しゅ]に帰[かえ]れ。そうすれば、あわれみを受[う]ける。主は罪[つみ]を多[おお]く赦[ゆる]されるからである。"
  8: "「わたしの思[おも]いはあなたがたの思いとは異[こと]なり、あなたがたの道[みち]はわたしの道とは異なる、と主[しゅ]は言[い]われる。"
  9: "天[てん]が地[ち]から遠[とお]く離[はな]れているように、わたしの道もあなたがたの道から遠く離れ、わたしの思[おも]いはあなたがたの考[かんが]えから遠く離れている。」"
  10: "「雨[あめ]や雪[ゆき]が天[てん]から降[ふ]り、そこへ帰[かえ]ることなく、地[ち]を潤[うるお]して実[みの]らせ、芽[め]を出[だ]させ、種[たね]を蒔[ま]く者[もの]に種を、食[た]べる者[もの]にパンを与[あた]えるように、"
  11: "そのように、わたしの言葉[ことば]は、わたしの口[くち]から出[で]るなら、むなしくわたしに帰[かえ]らない。わたしが望[のぞ]んだことをすべて成[な]し遂[と]げ、あなたの道[みち]とわたしの戒[いまし]めを栄[さか]えさせるまで。」"
  12: "あなたがたは喜[よろこ]びのうちに出[で]て行[い]き、楽[たの]しみのうちに教[おし]えられる。山[やま]と丘[おか]は、喜[よろこ]びをもってあなたがたを迎[むか]えながら、躍[おど]り上[あ]がる。野[の]のすべての木[き]は枝[えだ]を打[う]ち鳴[な]らして喜ぶ。"
  13: "いばらの代[か]わりに糸杉[いとすぎ]が生[は]え、いらくさの代わりにミルトスが生える。主[しゅ]ご自身[じしん]が名[な]となり、永遠[えいえん]のしるしとなって、尽[つ]きることはない。"

notes:
  1: "Οἱ διψῶντες — «жаждущие», обращение. πορεύεσθε ἐφ᾿ ὕδωρ — «идите к воде». ὅσοι μὴ ἔχετε ἀργύριον — «все, у кого нет серебра». βαδίσαντες ἀγοράσατε — «пойдя, купите» (ἀγοράζω). πίετε — «пейте» в gr-lxx-byz; у Свита φάγετε «ешьте», в слав. «ядите (и пийте)» — оба глагола, второй в скобках издания; в тексте взят слав. глагол (食べよ), вариант «пейте» — здесь. οἴνου καὶ στέαρ — «вина и тук»: στέαρ — «жир, тук» (слав. «тук»), в Синодальном по МТ «молоко»."
  2: "ἵνα τί τιμᾶσθε ἀργυρίου — «зачем вы ценитесь серебром»: оборот тёмный; слав. «Вскую цените сребро не в хлебы» (по МТ «отвешиваете серебро за то, что не хлеб»), этот смысл и передан. τὸν μόχθον ὑμῶν οὐκ εἰς πλησμονήν — «труд ваш не в сытость» (μόχθος, πλησμονή). ἐντρυφήσει ἐν ἀγαθοῖς ἡ ψυχὴ ὑμῶν — «насладится во благих душа ваша» (ἐντρυφάω); в Синодальном «да насладится туком» — по МТ."
  3: "προσέχετε τοῖς ὠτίοις ὑμῶν — «приклоните уши ваши» (ὠτίον). ἐπακολουθήσατε ταῖς ὁδοῖς μου — «последуйте путям Моим» (ἐπακολουθέω). ζήσεται ἐν ἀγαθοῖς ἡ ψυχὴ ὑμῶν — «жива будет во благих душа ваша». διαθήσομαι ὑμῖν διαθήκην αἰώνιον — «завещаю вам завет вечный» (διατίθημι, διαθήκη). τὰ ὅσια Δαυιδ τὰ πιστά — «преподобная Давидова верная» (ὅσιος — «святое, благочестивое»; πιστός — «верный»); приложение к «завету» сохранено; цитируется в Деян 13:34."
  4: "ἰδοὺ μαρτύριον ἐν ἔθνεσιν δέδωκα αὐτόν — «вот, свидетельство среди народов дал Я его» (μαρτύριον — «свидетельство», не «свидетель»); в Синодальном «свидетелем для народов» — по МТ. ἄρχοντα καὶ προστάσσοντα ἔθνεσιν — «начальника и повелевающего народам» (προστάσσω)."
  5: "ἔθνη ἃ οὐκ ᾔδεισάν σε ἐπικαλέσονταί σε — «народы, которые не знали тебя, призовут тебя»; в Синодальном по МТ наоборот («ты призовёшь народ»), держим LXX. ἐπὶ σὲ καταφεύξονται — «к тебе прибегут» (καταφεύγω). ἕνεκεν τοῦ θεοῦ σου τοῦ ἁγίου Ισραηλ — «ради Бога твоего, Святого Израилева»; слав. добавляет «Господа» («ради Господа Бога твоего»), внесено по паритету (あなたの神である主), в LXX этого слова нет. ἐδόξασέν σε — «прославил тебя» (δοξάζω)."
  6: "Ζητήσατε τὸν θεόν — «ищите Бога» в gr-lxx-byz; у Свита и в слав. κύριον/«Господа» («Взыщите Господа»), по паритету взят слав. (主). ἐν τῷ εὑρίσκειν αὐτὸν ἐπικαλέσασθε — «когда находите Его, призывайте». ἡνίκα δ᾿ ἂν ἐγγίζῃ ὑμῖν — «когда Он приближается к вам»: стих обрывается на этом обороте (в слав. тоже двоеточие), продолжение — в 55:7; обрыв сохранён."
  7: "ἀπολιπέτω ὁ ἀσεβής — «да оставит нечестивый» (ἀπολείπω, ἀσεβής). ἀνὴρ ἄνομος τὰς βουλὰς αὐτοῦ — «муж беззаконный советы свои» (βουλή). ἐπιστραφήτω ἐπὶ κύριον — «да обратится к Господу» (ἐπιστρέφω). ὅτι ἐπὶ πολὺ ἀφήσει τὰς ἁμαρτίας ὑμῶν — «ибо много оставит грехи ваши» (ἀφίημι); в Синодальном «ибо Он многомилостив» и добавлено «и к Богу нашему» — по МТ, не внесено."
  8: "αἱ βουλαί μου — «советы Мои» (βουλή), передано 思い. οὐδὲ ὥσπερ αἱ ὁδοὶ ὑμῶν αἱ ὁδοί μου — «и не как пути ваши пути Мои». λέγει κύριος — формула в конце стиха, внутри речи (как в 1:11)."
  9: "ὡς ἀπέχει ὁ οὐρανὸς ἀπὸ τῆς γῆς — «как отстоит небо от земли» (ἀπέχω). τὰ διανοήματα ὑμῶν ἀπὸ τῆς διανοίας μου — «помышления ваши от мысли Моей» (διανόημα, διάνοια), передано 考え в отличие от 思い (βουλή). Порядок членов — путь, затем мысль, как в греч."
  10: "ὡς γὰρ ἐὰν καταβῇ ὑετὸς ἢ χιών — «как дождь или снег сойдёт» (ὑετός, χιών). οὐ μὴ ἀποστραφῇ — «не возвратится» (ἀποστρέφω). ἕως ἂν μεθύσῃ τὴν γῆν — «доколе не напоит землю» (μεθύσκω — «поить допьяна»). ἐκτέκῃ καὶ ἐκβλαστήσῃ — «родит и произрастит» (ἐκτίκτω, ἐκβλαστάνω). δῷ σπέρμα τῷ σπείροντι — «даст семя сеющему». Сравнение продолжается в 55:11, поэтому стих кончается на ように、 — как и греч. (запятая)."
  11: "οὕτως ἔσται τὸ ῥῆμά μου — «так будет слово Моё» (ῥῆμα). οὐ μὴ ἀποστραφῇ — «не возвратится»; слав. добавляет «ко мне тощь» («не возвратится ко мне тощь»), и это внесено в текст по паритету (むなしくわたしに帰らない), в LXX этих слов нет. ἕως ἂν συντελεσθῇ ὅσα ἠθέλησα — «доколе не совершит, что Я восхотел» (συντελέω). καὶ εὐοδώσω τὰς ὁδούς σου καὶ τὰ ἐντάλματά μου — «и поспешу пути твоя и заповеди Моя»: оборот тёмный (заповеди при «поспешу»), передан буквально; в МТ «и совершает то, для чего Я послал его»."
  12: "ἐν γὰρ εὐφροσύνῃ ἐξελεύσεσθε — «с веселием выйдете» (εὐφροσύνη). ἐν χαρᾷ διδαχθήσεσθε — «с радостью научитесь» (χαρά, διδάσκω): LXX говорит «будете научены»; в Синодальном «будете провожаемы с миром» — по МТ, держим LXX. ἐξαλοῦνται — «взыграют» (ἐξάλλομαι); ἐπικροτήσει τοῖς κλάδοις — «восплещут ветвями» (ἐπικροτέω, κλάδος)."
  13: "ἀντὶ τῆς στοιβῆς … κυπάρισσος — «вместо колючки кипарис» (στοιβή — колючее растение, слав. «драчие»); ἀντὶ δὲ τῆς κονύζης … μυρσίνη — «вместо блошницы мирт» (κόνυζα; слав. «кропива», отсюда いらくさ). ἔσται κύριος εἰς ὄνομα καὶ εἰς σημεῖον αἰώνιον — «и будет Господь в имя и в знамение вечное»: подлежащее κύριος (в Синодальном по МТ «это будет во славу Господа»), передано буквально. οὐκ ἐκλείψει — «не оскудеет» (ἐκλείπω)."
