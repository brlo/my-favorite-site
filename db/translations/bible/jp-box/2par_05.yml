# jp-box, 2-я Паралипоменон, глава 5. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); второй свидетель церковного текста —
# церковнославянский (csl-ru), по паритету (docs/japanese-bible.md); ru
# (Синодальный) — только для понимания, не источник. jp-joc в книге нет;
# jp-ni (под авторским правом) не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 5: перенесение ковчега в храм (1–10), единый хор левитов и священников
# (11–12), «один голос» и облако славы (13–14). Параллель — 3 Цар 8:1–11;
# 2 Пар местами иначе: 5:4 ковчег несут левиты, 5:9 «до сего дня», свои 5:11–12.
# Речей нет. Красного нет. 〔…〕 нет.
# Слав. 5:1 без первой половины стиха: она стоит в конце слав. 4:22
# («И совершися все дело...»); в тексте по gr. Слав. особенности (5:6
# «и боящиеся», 5:10 «когда закон дал», 5:11 «в дневную чреду») отмечены в notes.
# Сносок ⟨…⟩ нет: 神殿, 契約の箱, 幕屋, 祭司, レビ人, 燔祭 уже в корпусе.

tr_code: jp-box
book: 2par
chapter: 5
draft: true

verses:
  1: "こうして、ソロモンが主[しゅ]の神殿[しんでん]で行[おこな]ったすべての仕事[しごと]が終[お]わった。ソロモンは父[ちち]ダビデの聖[せい]なるもの、すなわち銀[ぎん]と金[きん]とすべての器[うつわ]を運[はこ]び入[い]れ、主[しゅ]の神殿[しんでん]の宝物庫[ほうもつこ]に納[おさ]めた。"
  2: "そのときソロモンは、主[しゅ]の契約[けいやく]の箱[はこ]をダビデの町[まち]、すなわちシオンから運[はこ]び上[のぼ]らせるために、イスラエルの長老[ちょうろう]たちと、すべての部族[ぶぞく]の長[おさ]たち、イスラエルの子[こ]らの父祖[ふそ]の家[いえ]の長[おさ]たちをエルサレムに集[あつ]めた。"
  3: "イスラエルの人[ひと]々[びと]はみな、祭[まつ]りのとき、すなわち第七[だいしち]の月[つき]に、王[おう]のもとへ集[あつ]まった。"
  4: "イスラエルの長老[ちょうろう]たちはみな来[き]て、レビ人[びと]たちはみな契約[けいやく]の箱[はこ]を担[かつ]いだ。"
  5: "彼[かれ]らは契約[けいやく]の箱[はこ]と証[あかし]の幕屋[まくや]と、幕屋[まくや]の中[なか]にあるすべての聖[せい]なる器[うつわ]を運[はこ]び上[のぼ]らせた。祭司[さいし]たちとレビ人[びと]がそれらを運[はこ]んだ。"
  6: "ソロモン王[おう]と、彼[かれ]のもとへ集[あつ]まったイスラエルの会衆[かいしゅう]すべて、すなわち主[しゅ]を恐[おそ]れる者[もの]たちと、彼[かれ]らのもとに集[あつ]められた者[もの]たちは、契約[けいやく]の箱[はこ]の前[まえ]で、数[かぞ]えきれないほど多[おお]くの牛[うし]と羊[ひつじ]を屠[ほふ]って犠牲[ぎせい]とした。"
  7: "祭司[さいし]たちは主[しゅ]の契約[けいやく]の箱[はこ]をその場所[ばしょ]、すなわち神殿[しんでん]の至聖所[しせいしょ]に運[はこ]び入[い]れ、ケルビムの翼[つばさ]の下[した]に置[お]いた。"
  8: "ケルビムは翼[つばさ]を広[ひろ]げて箱[はこ]の場所[ばしょ]の上[うえ]にあり、箱[はこ]とその担[かつ]ぎ棒[ぼう]の上[うえ]を覆[おお]っていた。"
  9: "担[かつ]ぎ棒[ぼう]は長[なが]く、その端[はし]は聖所[せいしょ]から至聖所[しせいしょ]の前[まえ]にまで見[み]えていたが、外[そと]からは見[み]えなかった。それらは今日[きょう]までそこにある。"
  10: "箱[はこ]の中[なか]には、モーセがホレブで置[お]いた二[ふた]つの石[いし]の板[いた]のほか何[なに]もなかった。それは主[しゅ]がイスラエルの子[こ]らをエジプトの地[ち]から導[みちび]き出[だ]したとき、彼[かれ]らと結[むす]んだ契約[けいやく]の板[いた]である。"
  11: "祭司[さいし]たちが聖所[せいしょ]から出[で]て来[き]たとき、そこにいた祭司[さいし]たちはみな聖別[せいべつ]されていて、日[ひ]ごとの組[くみ]に分[わ]けられていなかった。"
  12: "レビ人[びと]の歌[うた]い手[て]たちはみな、アサフの子[こ]ら、エマン、エドトンとその子[こ]ら、およびその兄弟[きょうだい]たちとともに、亜麻布[あまぬの]の衣[ころも]を着[き]て、シンバルと琴[こと]と竪琴[たてごと]をもって祭壇[さいだん]の前[まえ]に立[た]っていた。また彼[かれ]らとともに、百二十人[ひゃくにじゅうにん]の祭司[さいし]たちがラッパを吹[ふ]いていた。"
  13: "ラッパを吹[ふ]く者[もの]たちと歌[うた]う者[もの]たちが、声[こえ]を一[ひと]つにして主[しゅ]に感謝[かんしゃ]し、ほめたたえると、その声[こえ]は一[ひと]つになった。そして、ラッパとシンバルと歌[うた]の楽器[がっき]の音[おと]を高[たか]く上[あ]げて、「主[しゅ]に感謝[かんしゃ]せよ。主[しゅ]は良[よ]い方[かた]、その慈[いつく]しみは永遠[えいえん]に絶[た]えない」と言[い]ったとき、主[しゅ]の栄光[えいこう]の雲[くも]が神殿[しんでん]を満[み]たした。"
  14: "祭司[さいし]たちはその雲[くも]のゆえに、務[つと]めを行[おこな]うために立[た]っていることができなかった。主[しゅ]の栄光[えいこう]が神[かみ]の神殿[しんでん]を満[み]たしたからである。"

notes:
  1: "συνετελέσθη πᾶσα ἡ ἐργασία — окончилась вся работа (ἐργασία — дело, работа); τὰ ἅγια Δαυιδ τοῦ πατρὸς αὐτοῦ — посвящённое Давидом, отцом его (ἅγια — святыни); εἰς θησαυρὸν οἴκου κυρίου — в сокровищницу дома Господня (宝物庫). В слав. первая половина стиха стоит в конце 4:22 («И совершися все дело еже сотвори соломон в дому Господни»), поэтому слав. 5:1 начинается сразу с «И внесе соломон»; в тексте по gr."
  2: "ἐξεκκλησίασεν — созвал собрание (ἐκκλησιάζω); τοὺς ἄρχοντας τῶν φυλῶν — начальников колен; τοὺς ἡγουμένους πατριῶν — начальников отечеств; εἰς Ιερουσαλημ — в Иерусалим (в 3 Цар 8:1 этого нет); ἀνενέγκαι — вознести; [αὕτη Σιων] — «это Сион» (в gr-lxx-byz есть, поэтому 〔…〕 не ставим). Слав. 5:2."
  3: "ἐξεκκλησιάσθησαν πρὸς τὸν βασιλέα — собрались к царю; ἐν τῇ ἑορτῇ — на праздник; [οὗτος ὁ μὴν ἕβδομος] — «это месяц седьмой» (есть в gr); слав. «сей есть месяц седмый». В 3 Цар 8:2 месяц назван Афаним (アタニム). Слав. 5:3."
  4: "ἦλθον ... καὶ ἔλαβον πάντες οἱ Λευῖται τὴν κιβωτόν — пришли... и взяли все левиты ковчег; в 3 Цар 8:3 ковчег несут священники. Слав. 5:4 «взяша вси левити кивот» — по gr."
  5: "ἀνήνεγκαν — вознесли; σκηνὴ τοῦ μαρτυρίου — скиния свидетельства (証の幕屋); σκεύη τὰ ἅγια — священные сосуды; ἀνήνεγκαν αὐτὴν οἱ ἱερεῖς καὶ οἱ Λευῖται — понесли её священники и левиты. Слав. 5:5 «и внесоша его и скинию свидения...»."
  6: "συναγωγὴ Ισραηλ — собрание Израиля; οἱ φοβούμενοι — боящиеся [Господа]; οἱ ἐπισυνηγμένοι αὐτῶν — собравшиеся к ним (ἐπισυνάγω); θύοντες μόσχους καὶ πρόβατα — принося в жертву тельцов и овец; οὐκ ἀριθμηθήσονται ... οὐ λογισθήσονται ἀπὸ τοῦ πλήθους — не будут сочтены и исчислены от множества. Слав. 5:6 «и боящиися и собрании пред кивотом»."
  7: "δαβιρ τοῦ οἴκου — давир дома, то есть 至聖所 (слав. «молитвенник храма»); ἅγια τῶν ἁγίων — святое святых; ὑποκάτω τῶν πτερύγων τῶν χερουβιν — под крыльями херувимов. Слав. 5:7."
  8: "διαπεπετακότα τὰς πτέρυγας — распростёршие крылья (διαπετάννυμι); ἐπὶ τὸν τόπον τῆς κιβωτοῦ — над местом ковчега; ἀναφορεῖς — шесты, носилки (担ぎ棒; слав. «носила»); συνεκάλυπτεν — покрывали. Слав. 5:8."
  9: "ὑπερεῖχον — выдавались (ὑπερέχω); αἱ κεφαλαὶ τῶν ἀναφορέων — головки шестов; ἐκ τῶν ἁγίων εἰς πρόσωπον τοῦ δαβιρ — из святилища к давиру; οὐκ ἐβλέποντο ἔξω — не были видны снаружи; ἕως τῆς ἡμέρας ταύτης — до сего дня (в 3 Цар 8:8 этой формулы в LXX нет). Слав. 5:9."
  10: "πλὴν δύο πλάκες — кроме двух скрижалей; ἐν Χωρηβ — на Хориве; ἃ διέθετο κύριος μετὰ τῶν υἱῶν Ισραηλ — которые завещал Господь сынам Израиля; ἐν τῷ ἐξελθεῖν αὐτοὺς ἐκ γῆς Αἰγύπτου — при выходе их из земли Египетской. Слав. добавляет «егда закон даде Господь» (перелагает διέθετο) — не внесено как дубль. Слав. 5:10."
  11: "ἐν τῷ ἐξελθεῖν τοὺς ἱερεῖς ἐκ τῶν ἁγίων — когда священники вышли из святилища; ἡγιάσθησαν — освятились; οὐκ ἦσαν διατεταγμένοι κατ᾿ ἐφημερίαν — не были распределены по чреде (ἐφημερία — дневная чреда, 組). Слав. 5:11 «не бяху расположени в дневную чреду»."
  12: "ψαλτῳδοί — певцы (歌い手); τοῖς υἱοῖς Ασαφ, τῷ Αιμαν, τῷ Ιδιθουν — с сынами Асафа, Еманом, Идифуном (アサフ, エマン, エドトン, как в 1 Пар); στολὰς βυσσίνας — виссонные одежды (亜麻布の衣); κύμβαλα, νάβλαι, κινύραι — кимвалы, псалтири, киниры (シンバル, 琴, 竪琴); κατέναντι τοῦ θυσιαστηρίου — пред жертвенником; ἑκατὸν εἴκοσι — сто двадцать. Слав. 5:12."
  13: "μία φωνή — один голос; ἐξομολογεῖσθαι καὶ αἰνεῖν — благодарить и хвалить; ὡς ὕψωσαν φωνήν — когда возвысили голос; ἐν ὀργάνοις τῶν ᾠδῶν — на орудиях песней (歌の楽器); Ἐξομολογεῖσθε τῷ κυρίῳ... — «благодарите Господа, ибо Он благ, ибо вовек милость Его» (формула, ср. 1 Пар 16:34); νεφέλη δόξης κυρίου — облако славы Господней. Слав. 5:13."
  14: "οὐκ ἠδύναντο ... στῆναι λειτουργεῖν — не могли стоять на служении; ἀπὸ προσώπου τῆς νεφέλης — от лица облака; ἐνέπλησεν δόξα κυρίου τὸν οἶκον τοῦ θεοῦ — слава Господня наполнила дом Божий. Ср. 3 Цар 8:11. Слав. 5:14."
