# jp-box, Иезекииль, глава 37. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 37 (совпадает; см. карту 20/21).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: 1–14 — видение поля сухих костей: рука Господня и Дух выносят пророка
# в поле, полное костей; вопрос «оживут ли кости сии?»; пророчество костям — жилы,
# плоть, кожа, затем пророчество духу — «от четырёх ветров приди, дух»; кости оживают
# и встают — «весьма великое полчище»; объяснение: это весь дом Израилев, «иссохли
# кости наши, погибла надежда наша»; Господь откроет гробы и введёт в землю, вложит
# Дух Свой. 15–28 — два жезла: «Иуда» и «Иосиф, жезл Ефрема»; они слагаются в один
# жезл в руке пророка; один народ, один князь, раб Давид — пастырь, завет мира,
# святилище среди них навек.
# Голоса: 1–2 повествование без кавычек; 3 вопрос Господа — 「…」, ответ пророка —
# отдельная 「…」; 4–6 речь Господа 「…»; 7–8 повествование; 9 речь Господа 「…»;
# 10 повествование; 11–14 речь Господа 「…» (в 11 слова народа — 『…』); 15 формула
# вне кавычек; 16–28 одна речь Господа 「…» (в 16 надписи на жезлах и в 18 вопрос
# народа — 『…』). Слова, которые пророк должен произнести, остаются в той же речи,
# отдельной цитатой не выделены (ср. 30:2).
# «Точка»: в этой главе нет.
# Имена и термины: イスラエル, ユダ, ヨセフ, エフライム, ヤコブ, ダビデ, レビ;
# 霊[れい] (πνεῦμα), 骨[ほね] (ὀστέον), 墓[はか] (μνῆμα/τάφος), 杖[つえ] (ῥάβδος),
# 部族[ぶぞく] (φυλή), 君[きみ] (ἄρχων), 牧[ぼく]者[しゃ] (ποιμήν), 契約[けいやく]
# (διαθήκη), 嗣業[しぎょう] (κληρονομία), 聖[せい]なるもの (τὰ ἅγια), 住[す]まい
# (κατασκήνωσις).
#

