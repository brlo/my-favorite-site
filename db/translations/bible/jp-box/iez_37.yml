verses:
  1: "主[しゅ]の手[て]がわたしの上[うえ]にあった。主[しゅ]は霊[れい]によってわたしを連[つ]れ出[だ]し、野[の]のただ中[なか]に置[お]いた。そこは人[ひと]の骨[ほね]で満[み]ちていた。"
  2: "主はわたしをそれらの周[まわ]りに、ぐるりと巡[めぐ]らせた。見[み]よ、野[の]の面[おもて]には非常[ひじょう]に多[おお]くの骨[ほね]があり、見よ、それは非常[ひじょう]に乾[かわ]いていた。"
  3: "主はわたしに言[い]われた。「人[ひと]の子[こ]よ、これらの骨[ほね]は生[い]きるだろうか。」わたしは言[い]った。「主[しゅ]なる神[かみ]よ、あなたがご存[ぞん]じです。」"
  4: "主はわたしに言[い]われた。「人[ひと]の子[こ]よ、これらの骨[ほね]について預言[よげん]し、彼らに言[い]え。乾[かわ]いた骨[ほね]よ、主[しゅ]の言葉[ことば]を聞[き]け。"
  5: "主[しゅ]なる神[かみ]はこの骨[ほね]々[ほね]にこう言[い]われる。見[み]よ、わたしはあなたがたの内[うち]に命[いのち]の霊[れい]を入[い]れる。"
  6: "わたしはあなたがたに筋[すじ]を与[あた]え、あなたがたの上[うえ]に肉[にく]を生[は]えさせ、あなたがたの上[うえ]に皮[かわ]を張[は]り、あなたがたの内[うち]にわたしの霊[れい]を置[お]く。あなたがたは生[い]きる。あなたがたはわたしが主[しゅ]であることを知[し]る。」"
  7: "わたしは命[めい]じられたとおりに預言[よげん]した。預言[よげん]しているとき、音[おと]がした。見[み]よ、震動[しんどう]が起[お]こり、骨[ほね]がそれぞれ自分[じぶん]のつながりへと寄[よ]り集[あつ]まった。"
  8: "わたしが見[み]ると、見[み]よ、彼らの上[うえ]に筋[すじ]と肉[にく]が生[は]え、上[うえ]から皮[かわ]がかぶさった。しかし、彼らの内[うち]に霊[れい]はなかった。"
  9: "主はわたしに言[い]われた。「人[ひと]の子[こ]よ、霊[れい]について預言[よげん]せよ。預言[よげん]して、霊[れい]に言[い]え。主[しゅ]なる神[かみ]はこう言[い]われる。四方[しほう]の風[かぜ]から来[き]て、霊[れい]よ、これらの死[し]んだ者[もの]たちに吹[ふ]きかけよ。彼らは生[い]きる。」"
  10: "わたしは命[めい]じられたとおりに預言[よげん]した。霊[れい]が彼らの内[うち]に入[はい]り、彼らは生[い]きて、自分[じぶん]の足[あし]で立[た]った。それは非常[ひじょう]に大[おお]きな集[あつ]まりであった。"
  11: "主[しゅ]はわたしに言[い]われた。「人[ひと]の子[こ]よ、これらの骨[ほね]はイスラエルの全[ぜん]家[か]である。彼らは言[い]う。『わたしたちの骨[ほね]は乾[かわ]き、望[のぞ]みは失[う]せ、わたしたちは滅[ほろ]びた』と。"
  12: "それゆえ、預言[よげん]して彼らに言[い]え。主[しゅ]なる神[かみ]はこう言[い]われる。見[み]よ、わたしはあなたがたの墓[はか]を開[ひら]き、あなたがたを墓[はか]から上[あ]げる。わたしの民[たみ]よ。わたしはあなたがたをイスラエルの地[ち]に連[つ]れて行[い]く。"
  13: "わたしがあなたがたの墓[はか]を開[ひら]き、わたしの民[たみ]を墓[はか]から上[あ]げるとき、あなたがたはわたしが主[しゅ]であることを知[し]る。"
  14: "わたしはあなたがたの内[うち]にわたしの霊[れい]を置[お]き、あなたがたは生[い]きる。わたしはあなたがたをあなたがたの地[ち]に置[お]く。あなたがたは、わたしが主[しゅ]であり、語[かた]って、それを行[おこな]うことを知[し]る、と主[しゅ]は言[い]われる。」"
  15: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  16: "「人[ひと]の子[こ]よ、あなたは一本[いっぽん]の杖[つえ]を取[と]り、その上[うえ]に『ユダと、彼[かれ]に付[つ]き従[したが]うイスラエルの子[こ]ら』と書[か]け。また、別[べつ]の杖[つえ]を取[と]り、その上[うえ]に『ヨセフ』と書[か]け。エフライムの杖[つえ]と、彼に付き従うイスラエルの子[こ]らすべてである。"
  17: "あなたはそれらを互[たが]いに合[あ]わせて、自分[じぶん]のために一本[いっぽん]の杖[つえ]とし、それを結[むす]び合[あ]わせよ。それらはあなたの手[て]のうちで一つとなる。"
  18: "あなたの民[たみ]の子[こ]らがあなたに、『これがあなたにとって何[なん]なのか、わたしたちに告[つ]げないのか』と言[い]うとき、"
  19: "あなたは彼らに言[い]え。主[しゅ]なる神[かみ]はこう言[い]われる。見[み]よ、わたしはエフライムの手[て]にあるヨセフの部族[ぶぞく]と、それに付[つ]き従[したが]うイスラエルの部族[ぶぞく]を取[と]り、これをユダの部族[ぶぞく]に添[そ]える。彼らはユダの手[て]のうちで一本[いっぽん]の杖[つえ]となる。"
  20: "あなたが書[か]き記[しる]した杖[つえ]は、彼らの目[め]の前[まえ]で、あなたの手[て]のうちにある。"
  21: "あなたは彼らに言[い]え。主[しゅ]なる神[かみ]はこう言[い]われる。見[み]よ、わたしはイスラエルの全[ぜん]家[か]を、彼らが行[い]った諸国民[しょこくみん]の間[あいだ]から取[と]り、四方[しほう]から彼らを集[あつ]め、イスラエルの地[ち]に連[つ]れて行[い]く。"
  22: "わたしは彼らを、わたしの地[ち]、イスラエルの山[やま]々[やま]で一[ひと]つの国民[こくみん]とする。一人[ひとり]の君[きみ]が彼らすべての王[おう]となる。彼らはもはや二[ふた]つの国民[こくみん]とならず、もはや二[ふた]つの王国[おうこく]に分[わ]かたれることもない。"
  23: "彼らはもはや偶像[ぐうぞう]と、その忌[い]まわしいものと、すべての不敬[ふけい]とによって身[み]を汚[けが]さない。わたしは彼らを、彼らが罪[つみ]を犯[おか]したすべての不法[ふほう]から救[すく]い出[だ]し、彼らを清[きよ]める。彼らはわたしの民[たみ]となり、わたしは彼らの神[かみ]となる。"
  24: "わたしの僕[しもべ]ダビデは彼らの間[あいだ]の君[きみ]となり、すべての者[もの]のただ一人[ひとり]の牧[ぼく]者[しゃ]となる。彼らはわたしの戒[いまし]めに従[したが]って歩[あゆ]み、わたしの裁[さば]きを守[まも]って行[おこな]うからである。"
  25: "彼らは、わたしが僕[しもべ]ヤコブに与[あた]えた彼らの地[ち]に住[す]む。そこは彼らの父[ちち]たちが住[す]んだ所[ところ]である。彼らもその子[こ]らも、その子[こ]らの子[こ]らも、とこしえにそこに住[す]む。わたしの僕[しもべ]ダビデは、とこしえに彼らの君[きみ]となる。"
  26: "わたしは彼らと平和[へいわ]の契約[けいやく]を結[むす]ぶ。それは彼らとの永遠[えいえん]の契約[けいやく]となる。わたしは彼らを据[す]え、彼らを増[ふ]やし、わたしの聖[せい]なるものをとこしえに彼らの間[あいだ]に置[お]く。"
  27: "わたしの住[す]まいが彼らの間[あいだ]にあり、わたしは彼らの神[かみ]となり、彼らはわたしの民[たみ]となる。"
  28: "わたしの聖[せい]なるものがとこしえに彼らの間[あいだ]にあるとき、諸国民[しょこくみん]は、わたしが彼らを聖[せい]とする主[しゅ]であることを知[し]る。」"

notes:
  1: "Καὶ ἐγένετο ἐπ᾽ ἐμὲ χεὶρ κυρίου — «и была на мне рука Господня»; ἐξήγαγέν με ἐν πνεύματι κύριος — «вывел меня Господь в Духе» (слав. «в Дусе Господни»); ἔθηκέν με ἐν μέσῳ τοῦ πεδίου — «поставил меня среди поля» (πεδίον — 野); μεστὸν ὀστέων ἀνθρωπίνων — «полное костей человеческих». Видение без кавычек: это повествование."
  2: "περιήγαγέν με ἐπ᾽ αὐτὰ κυκλόθεν κύκλῳ — «обвёл меня вокруг них кругом» (двойной круг: κυκλόθεν κύκλῳ — ぐるりと巡らせた); πολλὰ σφόδρα — «весьма много»; ξηρὰ σφόδρα — «весьма сухи»."
  3: "εἰ ζήσεται τὰ ὄστᾶ ταῦτα — «оживут ли кости сии?»; Κύριε, σὺ ἐπίστῃ ταῦτα — «Господи, Ты знаешь это» (слав. «ты веси сия»). Вопрос Господа и ответ пророка — две отдельные 「…」 в пределах стиха."
  4: "Προφήτευσον ἐπὶ τὰ ὀστᾶ ταῦτα — «изреки пророчество на кости сии»; Τὰ ὀστᾶ τὰ ξηρά — «кости сухие» (обращение); ἀκούσατε λόγον κυρίου — «слушайте слово Господне». Здесь открывается речь Господа, она идёт до конца 6-го стиха."
  5: "Τάδε λέγει κύριος τοῖς ὀστέοις τούτοις — «так говорит Господь костям сим» (слав. «адонаи Господь»); πνεῦμα ζωῆς — «дух жизни» (слав. «дух животен») — 命の霊."
  6: "νεῦρα — «жилы» (νεῦρον); σάρκες — «плоти»; δέρμα — «кожа»; δώσω πνεῦμά μου εἰς ὑμᾶς — «дам Дух Мой в вас» (слав. «дам дух мой в вас»); γνώσεσθε ὅτι ἐγώ εἰμι κύριος — формула. Здесь речь закрывается."
  7: "ἐπροφήτευσα καθὼς ἐνετείλατό μοι — «я изрёк пророчество, как Он повелел мне»; ἰδοὺ σεισμός — «вот, потрясение» (слав. «трус» — землетрясение); προσήγαγε τὰ ὀστᾶ ἑκάτερον πρὸς τὴν ἁρμονίαν αὐτοῦ — «кости стали сближаться, каждая к своему составу» (ἁρμονία — соединение, сустав)."
  8: "νεῦρα καὶ σάρκες ἐφύοντο — «жилы и плоти вырастали» (φύω); ἀνέβαινεν ἐπ᾽ αὐτὰ δέρμα ἐπάνω — «кожа восходила на них сверху»; πνεῦμα οὐκ ἦν ἐν αὐτοῖς — «духа не было в них». Слав. в скобках «(и протяжеся)» — двойное чтение, не внесено."
  9: "Προφήτευσον ἐπὶ τὸ πνεῦμα — «изреки пророчество на духа (ветер)»: πνεῦμα здесь и «дух», и «ветер», поэтому 霊[れい] с пояснением 四方の風; Ἐκ τῶν τεσσάρων πνευμάτων — «от четырёх ветров»; ἐμφύσησον εἰς τοὺς νεκροὺς τούτους — «дохни на этих мёртвых» (ἐμφυσάω); καὶ ζησάτωσαν — «и пусть оживут»."
  10: "εἰσῆλθεν εἰς αὐτοὺς τὸ πνεῦμα — «вошёл в них дух» (слав. «дух жизни»); ἔστησαν ἐπὶ τῶν ποδῶν αὐτῶν — «встали на ноги свои»; συναγωγὴ πολλὴ σφόδρα — «собрание весьма великое» (συναγωγή — 集まり; в слав. «собор мног зело»)."
  11: "τὰ ὀστᾶ ταῦτα πᾶς οἶκος Ισραηλ ἐστίν — «кости сии — весь дом Израилев»; Ξηρὰ γέγονεν τὰ ὀστᾶ ἡμῶν — «иссохли кости наши»; ἀπώλωλεν ἡ ἐλπὶς ἡμῶν — «погибла надежда наша»; διαπεφωνήκαμεν — «мы погибли (разбиты)»; слав. «убиени быхом» — «мы убиты». Слова народа — вложенная речь 『…』."
  12: "ἀνοίγω ὑμῶν τὰ μνήματα — «открываю гробы ваши» (μνῆμα — 墓); ἀνάξω ὑμᾶς ἐκ τῶν μνημάτων — «выведу вас из гробов»; εἰσάξω ὑμᾶς εἰς τὴν γῆν τοῦ Ισραηλ — «введу вас в землю Израилеву». Слав. в скобках «(сыне человечь)» — редакционная вставка, не перенесена."
  13: "ἐν τῷ ἀνοῖξαί με τοὺς τάφους ὑμῶν — «когда открою гробы ваши» (τάφος — 墓); τοῦ ἀναγαγεῖν με ἐκ τῶν τάφων τὸν λαόν μου — «когда выведу народ Мой из гробов». Слав. добавляет в конце «и дам дух мой в вас, и живи будете» — в LXX эта клауза стоит в 14-м стихе, повтор не внесён."
  14: "δώσω τὸ πνεῦμά μου εἰς ὑμᾶς — «дам Дух Мой в вас»; θήσομαι ὑμᾶς ἐπὶ τὴν γῆν ὑμῶν — «поставлю вас на земле вашей»; ἐγὼ κύριος λελάληκα καὶ ποιήσω — «Я, Господь, сказал и сделаю»; λέγει κύριος — «говорит Господь». Здесь речь закрывается."
  15: "Καὶ ἐγένετο λόγος κυρίου πρός με λέγων — формула вне кавычек; открывает новое слово (15–28)."
  16: "ῥάβδον — «жезл» (ῥάβδος — 杖): не царский скипетр, а пастушеский посох/дощечка для надписи; γράψον ἐπ᾽ αὐτήν — «напиши на нём»; Ιουδαν καὶ τοὺς υἱοὺς Ισραηλ τοὺς προσκειμένους ἐπ᾽ αὐτόν — «Иуду и сынов Израилевых, прилежащих к нему»; ῥάβδον δευτέραν — «жезл второй»; Τῷ Ιωσηφ, ῥάβδον Εφραιμ — «Иосифу, жезл Ефрема» (слав. «иосифа, жезл ефремов»). Надписи — вложенная речь 『…』."
  17: "συνάψεις αὐτὰς πρὸς ἀλλήλας σαυτῷ εἰς ῥάβδον μίαν — «соедини их друг с другом себе в один жезл»; τοῦ δῆσαι αὐτός — «чтобы связать их» (δέω); ἔσονται ἐν τῇ χειρί σου — «будут в руке твоей»."
  18: "Οὐκ ἀναγγελεῖς ἡμῖν τί ἐστιν ταῦτά σοι; — «не возвестишь ли нам, что это у тебя?». Вопрос народа — вложенная речь 『…』; в слав. добавлено «вопрошающе» (спрашивая) — нет в LXX."
  19: "τὴν φυλὴν Ιωσηφ τὴν διὰ χειρὸς Εφραιμ — «колено Иосифово, которое в руке Ефрема»; τὰς φυλὰς Ισραηλ τὰς προσκειμένας — «колена Израилевы, прилежащие»; δώσω αὐτοὺς ἐπὶ τὴν φυλὴν Ιουδα — «дам их на колено Иуды», т. е. приложу к нему; εἰς ῥάβδον μίαν ἐν τῇ χειρὶ Ιουδα — «в один жезл в руке Иуды»."
  20: "αἱ ῥάβδοι, ἐφ᾽ αἷς σὺ ἔγραψας — «жезлы, на которых ты написал»; ἐν τῇ χειρί σου ἐνώπιον αὐτῶν — «в руке твоей пред глазами их»."
  21: "λαμβάνω πάντα οἶκον Ισραηλ ἐκ μέσου τῶν ἐθνῶν — «беру весь дом Израилев из среды народов»; συνάξω αὐτοὺς ἀπὸ πάντων τῶν περικύκλῳ αὐτῶν — «соберу их отовсюду вокруг них»; εἰσάξω εἰς τὴν γῆν τοῦ Ισραηλ — «введу в землю Израилеву»."
  22: "δώσω αὐτοὺς εἰς ἔθνος ἓν — «сделаю их одним народом»; ἄρχων εἷς ἔσται αὐτῶν — «один князь будет у них» (слав. добавляет «царем» — нет в LXX); οὐ μὴ διαιρεθῶσιν εἰς δύο βασιλείας — «не разделятся на два царства»."
  23: "ἵνα μὴ μιαίνωνται ἔτι ἐν τοῖς εἰδώλοις — «чтобы не осквернялись более идолами»; ῥύσομαι αὐτοὺς ἀπὸ πασῶν τῶν ἀνομιῶν — «избавлю их от всех беззаконий» (ῥύομαι); καθαριῶ αὐτούς — «очищу их»; ἔσονταί μοι εἰς λαόν — «будут Мне народом». Слав. добавляет «и в мерзостех своих и во всех нечестиих своих» — нет в LXX, внесено без 〔…〕."
  24: "ὁ δοῦλός μου Δαυιδ ἄρχων ἐν μέσῳ αὐτῶν — «раб Мой Давид — князь среди них»; ποιμὴν εἷς ἔσται πάντων — «один пастырь будет всех» (ποιμήν — 牧者); ἐν τοῖς προστάγμασίν μου πορεύσονται — «в повелениях Моих будут ходить» (πρόσταγμα — 戒め); τὰ κρίματά μου φυλάξονται — «суды Мои сохранят»."
  25: "κατοικήσουσιν ἐπὶ τῆς γῆς αὐτῶν, ἣν δέδωκα τῷ δούλῳ μου Ιακωβ — «будут жить на земле своей, которую дал рабу Моему Иакову»; οὗ κατῴκησαν οἱ πατέρες αὐτῶν — «где жили отцы их»; εἰς τὸν αἰῶνα — «во век» (とこしえに)."
  26: "διαθήσομαι αὐτοῖς διαθήκην εἰρήνης — «заключу с ними завет мира»; διαθήκη αἰωνία — «завет вечный»; θήσω τὰ ἅγιά μου ἐν μέσῳ αὐτῶν — «поставлю святыни Мои среди них» (τὰ ἅγια — 聖なるもの; слав. «освящение мое»). Слав. переносит эту клаузу в начало 27-го стиха — деление по LXX."
  27: "ἡ κατασκήνωσίς μου ἐν αὐτοῖς — «жилище Моё в них» (κατασκήνωσις — 住まい); ἔσομαι αὐτοῖς θεός — «буду им Богом»; αὐτοί μου ἔσονται λαός — «они будут Мне народом» (формула завета)."
  28: "γνώσονται τὰ ἔθνη ὅτι ἐγώ εἰμι κύριος ὁ ἁγιάζων αὐτούς — «узнают народы, что Я — Господь, освящающий их»; ἐν τῷ εἶναι τὰ ἅγιά μου ἐν μέσῳ αὐτῶν — «когда святыни Мои будут среди них». Здесь закрывается вторая речь главы."
