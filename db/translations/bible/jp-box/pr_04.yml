chapter: 4
draft: true

verses:
  1: "子[こ]らよ、父[ちち]の戒[いまし]めを聞[き]け。思[おも]いを悟[さと]るために心[こころ]を向[む]けよ。"
  2: "わたしはあなたがたに良[よ]い贈[おく]り物[もの]を与[あた]える。わが掟[おきて]を捨[す]てるな。"
  3: "わたしもまた、父[ちち]に従順[じゅうじゅん]な子[こ]であり、母[はは]の前[まえ]で愛[あい]される者[もの]であった。"
  4: "彼らはこう言[い]って、わたしを教[おし]えた。「わたしたちの言葉[ことば]をあなたの心[こころ]に留[とど]めよ。"
  5: "戒[いまし]めを守[まも]れ。忘[わす]れるな。わが口[くち]の告[つ]げることを蔑[ないがし]ろにするな。わが口のことばから離[はな]れるな。"
  6: "彼女[かのじょ]を見捨[みす]てるな。そうすれば、彼女はあなたを守[まも]る。彼女を愛[あい]せよ。そうすれば、彼女はあなたを保[たも]つ。"
  7: "知恵[ちえ]の始[はじ]めは、知恵を獲[え]ることだ。あなたのすべての財産[ざいさん]をもって、悟[さと]りを獲[え]れ。"
  8: "彼女[かのじょ]の周[まわ]りに垣[かき]を巡[めぐ]らせ。そうすれば、彼女はあなたを高[たか]める。彼女を尊[とうと]べ。そうすれば、彼女はあなたを抱[だ]き寄[よ]せる。"
  9: "彼女[かのじょ]はあなたの頭[あたま]に恵[めぐ]みの冠[かんむり]を与[あた]え、喜[よろこ]びの冠であなたを覆[おお]い守[まも]る。」"
  10: "わが子[こ]よ、聞[き]け、わが言葉[ことば]を受[う]け入[い]れよ。そうすれば、あなたの命[いのち]の年[とし]は増[ふ]え、あなたの生涯[しょうがい]の道[みち]が多[おお]く開[ひら]かれる。"
  11: "わたしは知恵[ちえ]の道[みち]をあなたに教[おし]え、正[ただ]しい道にあなたを歩[あゆ]ませる。"
  12: "あなたが歩[あゆ]むとき、その歩みは妨[さまた]げられない。走[はし]るときも、疲[つか]れることはない。"
  13: "わが戒[いまし]めを掴[つか]め。手放[てばな]すな。それをあなた自身[じしん]のために、あなたの命[いのち]のために守[まも]れ。"
  14: "不敬[ふけい]な者[もの]の道[みち]に入[はい]るな。不法[ふほう]の者[もの]の道を慕[した]うな。"
  15: "彼らが陣[じん]を敷[し]くどの場所[ばしょ]にも、そこへ行[い]くな。彼らから離[はな]れて、脇[わき]を通[とお]り過[す]ぎよ。"
  16: "彼らは悪[あく]を行[おこな]わないかぎり、眠[ねむ]らない。彼らから眠りは奪[うば]われ、眠ることがない。"
  17: "彼らは不敬[ふけい]のパンを食[た]べ、不法[ふほう]のぶどう酒[しゅ]に酔[よ]う。"
  18: "正[ただ]しい者[もの]の道[みち]は光[ひかり]のように輝[かがや]き、進[すす]みながら照[て]らし続[つづ]け、日[ひ]が中天[ちゅうてん]に至[いた]るまで、その光は及[およ]ぶ。"
  19: "不敬[ふけい]な者[もの]の道[みち]は暗[くら]い。彼らはどのように躓[つまず]くのかさえ知[し]らない。"
  20: "わが子[こ]よ、わが語[かた]りに心[こころ]を向[む]けよ。わが言葉[ことば]に耳[みみ]を傾[かたむ]けよ。"
  21: "あなたの泉[いずみ]が涸[か]れないように、それを心[こころ]に守[まも]れ。"
  22: "それは、見出[みいだ]す者[もの]には命[いのち]となり、すべての肉[にく]には癒[いや]しとなるからである。"
  23: "あらゆる用心[ようじん]をもって、心[こころ]を守[まも]れ。命[いのち]の源[みなもと]はそこから流[なが]れ出[で]るからである。"
  24: "曲[ま]がった口[くち]を自分[じぶん]から取[と]り除[のぞ]き、不正[ふせい]な唇[くちびる]を遠[とお]くへ退[しりぞ]けよ。"
  25: "あなたの目[め]はまっすぐに見[み]よ。まぶたは正[ただ]しいものに向[む]かってうなずけ。"
  26: "あなたの足[あし]のためにまっすぐな道[みち]を造[つく]り、あなたの道を正[ただ]しくせよ。"
  27: "右[みぎ]にも左[ひだり]にも曲[ま]がるな。悪[あく]の道[みち]からあなたの足[あし]を遠[とお]ざけよ。"
  28: "右の道は神[かみ]が知[し]っておられるが、左の道は曲がっているからである。"
  29: "神はあなたの道筋[みちすじ]をまっすぐにし、あなたの歩[あゆ]みを平穏[へいおん]のうちに進[すす]ませてくださる。"

notes:
  1: "Ἀκούσατε, παῖδες — 子らよ (παῖς — «дитя, отрок»; слав. «дети»). παιδείαν πατρός — 父の戒め (παιδεία — «наставление, научение», не только «наказание»). προσέχετε γνῶναι ἔννοιαν — 思いを悟るために心を向けよ (ἔννοια — «мысль, разумение»)."
  2: "δῶρον ἀγαθόν — 良い贈り物 (слав. «дар благий»). τὸν ἐμὸν νόμον μὴ ἐγκαταλίπητε — わが掟を捨てるな (νόμος — «закон»; ἐγκαταλείπω — «оставлять»)."
  3: "υἱὸς ἐγενόμην κἀγὼ πατρὶ ὑπήκοος — わたしも父に従順な子であった (ὑπήκοος — «послушный»). ἀγαπώμενος ἐν προσώπῳ μητρός — 母の前で愛される者 (букв. «пред лицем матери»; у jp-joc по МТ «единственный любимый сын»)."
  4: "οἳ ἔλεγον καὶ ἐδίδασκόν με — они говорили и учили меня; прямая речь деда — 「」, продолжается до 4:9. Ἐρειδέτω ὁ ἡμέτερος λόγος εἰς σὴν καρδίαν — わたしたちの言葉をあなたの心に留めよ (ἐρείδω — «утверждать, укреплять»; слав. «да утверждается»). «Храни заповеди, не забывай» стоит в слав. 4:4, в gr — начало 4:5; цитата одна."
  5: "φύλασσε ἐντολάς — 戒めを守れ; μηδὲ παρίδῃς ῥῆσιν ἐμοῦ στόματος — わが口の告げることを蔑ろにするな (ῥῆσις — «изречение»; παροράω — «пренебрегать»). Последняя клауза «わが口のことばから離れるな» — слав. добавление «ниже уклонися от глагол уст моих» (в LXX 4:5 нет), внесена без скобок по паритету. Слав. 4:5 начинается «стяжи премудрость, стяжи разум» — это содержание csl 4:7 (МТ 4:7), переведено в 4:7 и здесь не дублируется."
  6: "μηδὲ ἐγκαταλίπῃς αὐτήν — 彼女を見捨てるな (речь о премудрости; αὐτήν ж. р.). ἀνθέξεταί σου — あなたを守る (ἀντέχομαι — «держаться, защищать»). ἐράσθητι αὐτῆς — 彼女を愛せよ (ἐράω — «любить, желать»)."
  7: "В gr-lxx-byz на месте стиха стоит «.» — дефект модуля; перевод по csl 4:7: «Начало премудрости: стяжати премудрость, и во всем стяжании твоем стяжи разум». ἀρχή σοφίας — 知恵の始め; κτῆσαι σοφίαν — 知恵を獲よ; ἐν πάσῃ κτήσει σου κτῆσαι σύνεσιν — すべての財産をもって悟りを獲よ (κτῆσις — «приобретение, имение»; σύνεσις — «разумение»). В 〔…〕 не берётся: это дефект модуля, а не чтение Церкви."
  8: "περιχάρακωσον αὐτήν — 彼女の周りに垣を巡らせ (περιχαρακόω — «обносить частоколом»; LXX понял евр. глагол иначе, чем «возвысь»). ὑψώσει σε — あなたを高める. τίμησον αὐτήν — 彼女を尊べ. ἵνα σε περιλάβῃ — あなたを抱き寄せる (περιλαμβάνω — «обнимать»)."
  9: "δῷ τῇ σῇ κεφαλῇ στέφανον χαρίτων — あなたの頭に恵みの冠を与え (χάρις — «благодать, милость»). στεφάνῳ τρυφῆς ὑπερασπίσῃ σου — 喜びの冠であなたを覆い守る (τρυφή — «наслаждение, роскошь»; ὑπερασπίζω — «защищать»). Цитата деда закрывается."
  10: "Ἄκουε, υἱέ — わが子よ、聞け (обращение отца, не цитата). δέξαι ἐμοὺς λόγους — わが言葉を受け入れよ. πληθυνθήσεται ἔτη ζωῆς σου — 命の年は増える. ἵνα σοι γένωνται πολλαὶ ὁδοὶ βίου — 生涯の道が多く開かれる (букв. «многие пути жизни»; слав. «да ти будут мнози путие жития»)."
  11: "ὁδοὺς σοφίας διδάσκω σε — 知恵の道を教える. ἐμβιβάζω δέ σε τροχιαῖς ὀρθαῖς — 正しい道に歩ませる (ἐμβιβάζω — «вводить, ставить на»; τροχιά — «колея, стезя»)."
  12: "ἐὰν πορεύῃ, οὐ συγκλεισθήσεταί σου τὰ διαβήματα — 歩むとき、その歩みは妨げられない (συγκλείω — «запирать, стеснять»; διάβημα — «шаг»). ἐὰν τρέχῃς, οὐ κοπιάσεις — 走るときも疲れない (κοπιάω — «утомляться»)."
  13: "ἐπιλαβοῦ ἐμῆς παιδείας — わが戒めを掴め (ἐπιλαμβάνομαι — «брать, держать»). μὴ ἀφῇς — 手放すな. φύλαξον αὐτὴν σεαυτῷ εἰς ζωήν σου — あなたの命のために守れ (εἰς ζωήν — «в жизнь»)."
  14: "ὁδοὺς ἀσεβῶν μὴ ἐπέλθῃς — 不敬な者の道に入るな (ἀσεβής — «нечестивый»). μηδὲ ζηλώσῃς ὁδοὺς παρανόμων — 不法の者の道を慕うな (ζηλόω — «ревновать, желать»; παράνομος — «беззаконный»)."
  15: "ἐν ᾧ ἂν τόπῳ στρατοπεδεύσωσιν — в каком бы месте они ни стали лагерем (στρατοπεδεύω — «разбивать стан»; слав. «воя соберут»). ἔκκλινον ἀπ᾽ αὐτῶν καὶ παράλλαξον — 離れて脇を通り過ぎよ (παραλλάσσω — «проходить мимо»)."
  16: "οὐ μὴ ὑπνώσωσιν, ἐὰν μὴ κακοποιήσωσιν — 悪を行わないかぎり眠らない (ὑπνόω — «спать»; κακοποιέω — «делать зло»). ἀφῄρηται ὁ ὕπνος αὐτῶν — 眠りは奪われた. В ru добавлено «если не доведут кого до падения» (МТ), в LXX и csl этого нет."
  17: "σιτοῦνται σῖτα ἀσεβείας — 不敬のパンを食べる (σιτέομαι — «питаться»; σῖτος — «хлеб»). οἴνῳ παρανόμῳ μεθύσκονται — 不法のぶどう酒に酔う (μεθύσκω — «опьянять»; слав. «вином законопреступным упиваются»)."
  18: "ὁμοίως φωτὶ λάμπουσιν — 光のように輝く. προπορεύονται καὶ φωτίζουσιν — 進みながら照らす (προπορεύομαι — «идти впереди»). ἕως κατορθώσῃ ἡ ἡμέρα — 日が中天に至るまで (κατορθόω — «выпрямлять, утверждать»; слав. «дондеже исправится день»)."
  19: "αἱ ὁδοὶ τῶν ἀσεβῶν σκοτειναί — 不敬な者の道は暗い. οὐκ οἴδασιν πῶς προσκόπτουσιν — どのように躓くのかさえ知らない (προσκόπτω — «претыкаться»)."
  20: "ῥῆσις — «изречение, слово» → 語り; λόγοι — «слова» → 言葉; слав. «глагол… словесем». παράβαλε σὸν οὖς — 耳を傾けよ (παραβάλλω — «прилагать, склонять»)."
  21: "ὅπως μὴ ἐκλίπωσίν σε αἱ πηγαί σου — あなたの泉が涸れないように (ἐκλείπω — «оставлять, иссякать»; πηγή — «источник»). φύλασσε αὐτὰς ἐν σῇ καρδίᾳ — それを心に守れ. В ru «да не отходят они от глаз твоих» (МТ), в LXX и csl — «источники»."
  22: "ζωή ἐστιν τοῖς εὑρίσκουσιν αὐτὰς — 見出す者には命 (εὑρίσκω — «находить»). πάσῃ σαρκὶ ἴασις — すべての肉には癒し (ἴασις — «исцеление»; слав. «всей плоти их» — прибавка «их»)."
  23: "πάσῃ φυλακῇ τήρει σὴν καρδίαν — あらゆる用心をもって心を守れ (φυλακή — «стража, хранение»). ἐκ γὰρ τούτων ἔξοδοι ζωῆς — 命の源はそこから流れ出る (ἔξοδοι — «исходы»; слав. «исходища живота»)."
  24: "περίελε σεαυτοῦ σκολιὸν στόμα — 曲がった口を自分から取り除け (περιαιρέω — «убирать»; σκολιός — «кривой, лукавый»). ἄδικα χείλη μακρὰν ἀπὸ σοῦ ἄπωσαι — 不正な唇を遠くへ退けよ (ἀπωθέω — «отталкивать»)."
  25: "οἱ ὀφθαλμοί σου ὀρθὰ βλεπέτωσαν — 目はまっすぐに見よ. τὰ βλέφαρά σου νευέτω δίκαια — まぶたは正しいものに向かってうなずけ (βλέφαρον — «веко»; νεύω — «кивать, подавать знак»; слав. «вежди да помавают праведная»)."
  26: "ὀρθὰς τροχιὰς ποίει σοῖς ποσίν — 足のためにまっすぐな道を造れ (τροχιά — «колея»). τὰς ὁδούς σου κατεύθυνε — あなたの道を正しくせよ (κατευθύνω — «направлять прямо»)."
  27: "μὴ ἐκκλίνῃς εἰς τὰ δεξιὰ μηδὲ εἰς τὰ ἀριστερά — 右にも左にも曲がるな. ἀπόστρεψον σὸν πόδα ἀπὸ ὁδοῦ κακῆς — 悪の道から足を遠ざけよ."
  28: "ὁδοὺς γὰρ τὰς ἐκ δεξιῶν οἶδεν ὁ θεός — «ибо пути правые знает Бог» (в gr стоит в квадратных скобках; в csl — отдельный ст. 4:28 «пути бо десныя весть Господь…»). διεστραμμέναι — «извращены». В csl 4:28 «Господь», в gr ὁ θεός — переведено 神."
  29: "αὐτὸς δὲ ὀρθὰς ποιήσει τὰς τροχιάς σου — «Он же прямыми сделает пути твои»; ἐν εἰρήνῃ προάξει — 平穏のうちに進ませる (слав. «в мире поспешит»). В csl — отдельный ст. 4:29."
