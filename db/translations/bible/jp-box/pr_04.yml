# jp-box, Притчи, глава 4. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для Притчей есть (гл. 4–6) — контроль церковного чтения;
# jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 4: наставление отца сыновьям (1–2), воспоминание о наставлении деда (3–4),
# речь деда «приобретай премудрость» (4–9), путь премудрости (10–13), путь нечестивых
# (14–17), путь праведных (18–19), сердце и уста (20–24), прямота пути (25–29).
# Прямая речь: слова деда в 4:4–9 — 「…」 (одна цитата); остальное — авторское
# наставление, без кавычек.
# Нумерация — славяно-синодальная (по csl-ru): 29 стихов. 4:7 в gr-lxx-byz — «.»
# (дефект модуля): переведено по csl 4:7, без 〔…〕. Гр 4:27b/c (в gr часть в
# квадратных скобках) слав. выносит отдельными стихами 4:28–29; поэтому наш прежний
# 4:27 разрезан на 4:27 (гр 4:27a), 4:28 (гр 4:27b) и 4:29 (гр 4:27c).
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
tr_code: jp-box
