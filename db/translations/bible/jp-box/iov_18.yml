# jp-box, Иов, глава 18. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге Иов есть только для глав 1–2; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 18: первая речь Вилдада. Формула 18:1 — повествование вне кавычек; речь 18:2–21 —
# одна цитата. Содержание — участь нечестивого: свет гаснет, ноги в петле, гибель
# необычайная, память исчезает; заканчивается формулой о «домах неправедных».
# Поэзия: тёмные места сохранены (18:7 «наименьшие», 18:9 «жаждущие», 18:13 «ветви ног»,
# 18:14 «по царской причине», 18:15 «поселится в шатре», 18:17 «имя на внешнем лице»).
# Нумерация по gr: 21 стих; деление совпадает с csl-ru, кроме 18:17 (слав. вносит
# отрицание «(не) будет», которого в LXX нет; в основном тексте — по LXX, отмечено в notes).
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX): ビルダド, シュヒ人.
# Голоса: 1 — повествование, 2–21 — Вилдад (одна цитата, закрывается в конце главы).

tr_code: jp-box
book: iov
chapter: 18
draft: true

verses:
  1: "シュヒ人[じん]ビルダドは答[こた]えて言[い]った。"
  2: "「いつまで、あなたは語[かた]りやめないのか。待[ま]て。わたしたちにも語[かた]らせよ。"
  3: "なぜ、わたしたちはあなたの前[まえ]で、四[よっ]つ足[あし]の獣[けもの]のように黙[だま]っているのか。"
  4: "あなたは怒[いか]りに身を任[まか]せている。だから、どうだというのか。あなたが死ねば、天[てん]の下[した]は住む者[もの]のない所[ところ]となるのか。山々[やまやま]が基[もと]から崩[くず]れるのか。"
  5: "不[ふ]敬[けい]な者[もの]の光[ひかり]は消え、その炎[ほのお]は輝[かがや]かない。"
  6: "住[す]まいでは、彼の光[ひかり]が闇[やみ]となり、彼の上[うえ]のともし火[び]は消える。"
  7: "小[ちい]さな者[もの]たちが彼の財産[ざいさん]を獲て、彼の計[はかり]ごとがつまずくように。"
  8: "彼[かれ]の足[あし]は罠[わな]に掛かり、網[あみ]に巻かれる。"
  9: "罠[わな]が彼の上[うえ]に来る。渇[かわ]いた者[もの]たちが彼に迫[せま]る。"
  10: "地[ち]に彼の縄[なわ]は隠[かく]され、その捕[と]らえ網[あみ]は道[みち]の上[うえ]にある。"
  11: "苦[くる]しみが四方[しほう]から彼を滅[ほろ]ぼし、狭[せま]く迫[せま]る飢[う]えの中[なか]で多[おお]くの者[もの]が彼の足[あし]もとに来る。"
  12: "彼[かれ]には異常[いじょう]な滅[ほろ]びが備[そな]えられている。"
  13: "彼[かれ]の足[あし]の枝[えだ]は食い尽[つ]くされ、その美[うつく]しいものは死に食われる。"
  14: "住[す]まいから癒[いや]しが引き抜[ぬ]かれ、王[おう]の裁[さば]きのゆえに迫[せま]りが彼を捕[と]らえる。"
  15: "彼[かれ]はその夜[よる]、自分[じぶん]の天幕[てんまく]に住む。その美[うつく]しいものは硫黄[いおう]でまかれる。"
  16: "下[した]では彼の根が枯れ、上[うえ]ではその刈[か]り取[と]りが落[お]ちて来る。"
  17: "彼[かれ]の記憶[きおく]は地から消え、その名は外[そと]の面[おもて]にある。"
  18: "彼[かれ]を光[ひかり]から闇[やみ]へ追いやる。"
  19: "彼[かれ]は自分[じぶん]の民[たみ]の間[あいだ]で知[し]られることがなく、天[てん]の下[した]でその家[いえ]は保[たも]たれない。彼のものに、ほかの者[もの]たちが住む。"
  20: "彼[かれ]のことで、後[あと]に来る者[もの]たちは嘆[なげ]き、先[さき]の者[もの]たちは驚[おどろ]きに捕[と]らわれた。"
  21: "これが不[ふ]正[せい]な者[もの]の家[いえ]であり、主[しゅ]を知[し]らない者[もの]の場所[ばしょ]である。」"

notes:
  1: "Повествование: формула вводит речь Вилдада, вне кавычек. Ὑπολαβὼν δὲ Βαλδαδ ὁ Σαυχίτης λέγει — «и отвечал Вилдад Савхеянин и говорит»; Σαυχίτης — シュヒ人, по LXX. Слав. «Отвещав же валдад савхейский, рече»."
  2: "Вилдад: Μέχρι τίνος οὐ παύσῃ — «доколе не перестанешь»; ἐπίσχες, ἵνα καὶ αὐτοὶ λαλήσωμεν — «подожди, чтобы и мы сказали» (ἐπέχω — «удерживать, ждать»). Слав. «доколе не престанеши? пожди, да и мы возглаголем»."
  3: "Вилдад: διὰ τί ὥσπερ τετράποδα σεσιωπήκαμεν ἐναντίον σου — «почему мы, как четвероногие, умолкли пред тобою» (τετράπους — «четвероногий»); слав. «аки четвероножная умолчахом»."
  4: "Вилдад: κέχρηταί σοι ὀργή — «гнев пользуется тобой» (χράομαι — «пользоваться»); ἐὰν σὺ ἀποθάνῃς, ἀοίκητος ἡ ὑπ᾽ οὐρανόν — «если ты умрёшь, будет ли необитаема поднебесная» (ἀοίκητος); ἢ καταστραφήσεται ὄρη ἐκ θεμελίων — «или горы сокрушатся от оснований»."
  5: "Вилдад: φῶς ἀσεβῶν σβεσθήσεται — «свет нечестивых угаснет» (σβέννυμι); οὐκ ἀποβήσεται αὐτῶν ἡ φλόξ — «не просияет пламя их» (φλόξ)."
  6: "Вилдад: τὸ φῶς αὐτοῦ σκότος ἐν διαίτῃ — «свет его — тьма в жилище его» (διαίτα — «жилище, образ жизни»); ὁ λύχνος ἐπ᾽ αὐτῷ σβεσθήσεται — «светильник над ним угаснет»."
  7: "Вилдад: θηρεύσαισαν ἐλάχιστοι τὰ ὑπάρχοντα αὐτοῦ — «да уловят наименьшие (слабейшие) имущество его» (θηρεύω — «ловить»; ἐλάχιστοι — «малейшие»), тёмное; σφάλαι δὲ αὐτοῦ ἡ βουλή — «да преткнётся совет его» (σφάλλω — «заставить споткнуться»)."
  8: "Вилдад: ἐμβέβληται ὁ ποὺς αὐτοῦ ἐν παγίδι — «нога его ввергнута в петлю» (παγίς — «петля, силок»); ἐν δικτύῳ ἑλιχθείη — «да обовьётся сетью» (δίκτυον; ἑλίσσω — «вить, обвивать»)."
  9: "Вилдад: ἔλθοισαν ἐπ᾽ αὐτὸν παγίδες — «да придут на него петли»; κατισχύσει ἐπ᾽ αὐτὸν διψῶντας — тёмное: «одолеет его жаждущих» (διψάω — «жаждать»), вероятно разбойники, «жаждущие» добычи; сохранено 渇いた者たち."
  10: "Вилдад: κέκρυπται ἐν τῇ γῇ σχοινίον αὐτοῦ — «скрыт в земле шнур (силок) его» (σχοινίον — «верёвка»); ἡ σύλλημψις αὐτοῦ ἐπὶ τρίβων — «ловля его на тропах» (σύλλημψις — «захват»; τρίβος — «тропа»)."
  11: "Вилдад: κύκλῳ ὀλέσαισαν αὐτὸν ὀδύναι — «окрест да погубят его боли» (ὀδύνη; ὄλλυμι); πολλοὶ περὶ πόδας αὐτοῦ ἔλθοισαν ἐν λιμῷ στενῷ — «многие вокруг ног его придут в тесном голоде» (λιμός — «голод»; στενός — «тесный, тяжкий»)."
  12: "Вилдад: πτῶμα δὲ αὐτῷ ἡτοίμασται ἐξαίσιον — «падение (погибель) ему уготовано необычайное» (ἐξαίσιος — «чрезвычайный»)."
  13: "Вилдад: βρωθείησαν αὐτοῦ κλῶνες ποδῶν — «да будут съедены ветви ног его» (κλών — «ветвь, побег»), т. е. голени и стопы; κατέδεται τὰ ὡραῖα αὐτοῦ θάνατος — «прекрасное его съест смерть» (ὡραῖος — «прекрасный»)."
  14: "Вилдад: ἐκραγείη ἐκ διαίτης αὐτοῦ ἴασις — «да будет исторгнуто из жилища его исцеление» (ἐκρήγνυμι — «вырываться»; ἴασις); σχοίη αὐτὸν ἀνάγκη αἰτίᾳ βασιλικῇ — «да овладеет им нужда по царской причине»: тёмное, слав. «беда виною царскою», Син. «к царю ужасов» (по евр.)."
  15: "Вилдад: κατασκηνώσει ἐν τῇ σκηνῇ αὐτοῦ ἐν νυκτὶ αὐτοῦ — «поселится в шатре своём в ночи своей» (κατασκηνόω); κατασπαρήσονται τὰ εὐπρεπῆ αὐτοῦ θείῳ — «прекрасное его будет усыпано серой» (κατασπείρω — «усыпать»; θεῖον — «сера»). Кто «поселится» — тёмно: возможно, беда или чужой."
  16: "Вилдад: ὑποκάτωθεν αἱ ῥίζαι αὐτοῦ ξηρανθήσονται — «снизу корни его иссохнут»; ἐπάνωθεν ἐπιπεσεῖται θερισμὸς αὐτοῦ — «сверху падёт жатва его» (θερισμός — «жатва»). Слав. «пожатие его»."
  17: "Вилдад: τὸ μνημόσυνον αὐτοῦ ἀπόλοιτο ἐκ γῆς — «память его да погибнет с земли» (μνημόσυνον); ὑπάρχει ὄνομα αὐτῷ ἐπὶ πρόσωπον ἐξωτέρω — «и есть имя ему на внешнем лице»: тёмное; слав. «(не) будет имя его на лицы внешнем», отрицание стоит в скобках выгрузки, в LXX его нет; Син. «имени его не будет на площади»."
  18: "Вилдад: ἀπώσειεν αὐτὸν ἐκ φωτὸς εἰς σκότος — «да отринет его от света во тьму» (ἀπωθέω — «отталкивать»); слав. «да отринет его от света во тму»."
  19: "Вилдад: οὐκ ἔσται ἐπίγνωστος ἐν λαῷ αὐτοῦ — «не будет он узнаваем в народе своём» (ἐπίγνωστος); οὐδὲ σεσῳσμένος ἐν τῇ ὑπ᾽ οὐρανὸν ὁ οἶκος αὐτοῦ — «и не сохранён под небом дом его» (σῴζω); ἀλλ᾽ ἐν τοῖς αὐτοῦ ζήσονται ἕτεροι — «но в его [имуществе] будут жить другие»."
  20: "Вилдад: ἐπ᾽ αὐτῷ ἐστέναξαν ἔσχατοι — «о нём воздохнули последние» (στενάζω); πρώτους ἔσχεν θαῦμα — «первых объяло изумление» (θαῦμα). Слав. «над ним воздохнуша последнии…»."
  21: "Вилдад: οὗτοί εἰσιν οἶκοι ἀδίκων — «таковы дома неправедных»; οὗτος ὁ τόπος τῶν μὴ εἰδότων τὸν κύριον — «и это место не знающих Господа». Здесь речь Вилдада заканчивается."
