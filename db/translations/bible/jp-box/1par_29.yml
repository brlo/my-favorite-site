# jp-box, 1-я Паралипоменон, глава 29. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); церковнославянский (csl-ru) — второй
# свидетель церковного текста (новый паритет, docs/japanese-bible.md):
# слав. чтения и добавки входят в основной текст без 〔…〕, вариант LXX — в notes.
# ru (Синодальный) — только для понимания, не источник. jp-joc нет;
# jp-ni не использовался.
# Язык — современный 常体 (в молитве тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 29: речь Давида о приношениях (1–5), приношения начальников (6–9),
# молитва Давида (10–19), благословение народа и воцарение Соломона (20–25),
# итог царствования Давида (26–30).
# Речи: Давид — 「…」 (1–5, 10–19); призыв к собранию в 20 — 「…」.
# Слав. добавления внесены в основной текст: 29:5 «идеже дело златое...»,
# 29:11 «и тебе, Господи, Царство и великолепие...», 29:12 «милость»,
# 29:26 «четыредесять лет». Нумерация — по gr.
# 〔…〕 нет: все стихи есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 神殿, 契約の箱, 祭壇, 嗣業, 会衆 уже в корпусе. Красного нет.

