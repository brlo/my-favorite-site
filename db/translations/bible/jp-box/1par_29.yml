verses:
  1: "ダビデ王[おう]は会衆[かいしゅう]すべてに言[い]った。「わたしの子[こ]ソロモンは、主[しゅ]がただ一人[ひとり]選[えら]ばれた者[もの]であるが、まだ若[わか]く、か弱[よわ]い。しかし、その仕事[しごと]は大[おお]きい。この建物[たてもの]は人[ひと]のためではなく、主なる神[かみ]のためのものだからである。"
  2: "わたしは力[ちから]の限[かぎ]りを尽[つ]くして、わたしの神[かみ]の家[いえ]のために金[きん]、銀[ぎん]、銅[どう]、鉄[てつ]、木材[もくざい]、ソムの石[いし]と填[う]め込[こ]みの石、貴重[きちょう]でさまざまな色[いろ]の石、あらゆる尊[とうと]い石、そして多[おお]くのパロスの石を準備[じゅんび]した。"
  3: "さらに、わたしの神[かみ]の家[いえ]に対[たい]する喜[よろこ]びのゆえに、わたしには自分[じぶん]の金[きん]と銀[ぎん]があり、それをわたしの神の家に、聖[せい]なる家のために準備[じゅんび]したもののほかに、さらに積[つ]み上[あ]げてささげる。"
  4: "スフィルの金[きん]三千[さんぜん]タラント、純粋[じゅんすい]な銀[ぎん]七千[ななせん]タラントを、聖所[せいしょ]の壁[かべ]をこれらで覆[おお]うために。"
  5: "すなわち、金[きん]の細工[さいく]には金を、銀[ぎん]の細工には銀を、すべての細工を職人[しょくにん]の手[て]によって行[おこな]うためである。今日[きょう]、だれが主[しゅ]のために自分[じぶん]の手を満[み]たすことを願[ねが]うのか。」"
  6: "そこで、氏族[しぞく]の長[かしら]たち、イスラエルの子[こ]らの長たち、千人隊長[せんにんたいちょう]、百人隊長[ひゃくにんたいちょう]、仕事[しごと]の監督[かんとく]たち、王[おう]の家[いえ]の管理[かんり]者[しゃ]たちは、進[すす]んでささげた。"
  7: "彼[かれ]らは主[しゅ]の家[いえ]の仕事[しごと]のために、金[きん]五千[ごせん]タラントと金貨[きんか]一万枚[いちまんまい]、銀[ぎん]一万[いちまん]タラント、銅[どう]一万八千[いちまんはっせん]タラント、鉄[てつ]十万[じゅうまん]タラントをささげた。"
  8: "宝石[ほうせき]が見[み]つかった者[もの]は、それを主[しゅ]の家[いえ]の宝物庫[ほうもつこ]に、ゲルション人[びと]イエヒエルの手[て]によって渡[わた]した。"
  9: "民[たみ]は彼[かれ]らが進[すす]んでささげたことを喜[よろこ]んだ。彼らが全[まった]き心[こころ]で主[しゅ]に進んでささげたからである。ダビデ王[おう]も大[おお]いに喜んだ。"
  10: "ダビデ王[おう]は会衆[かいしゅう]すべての前[まえ]で主[しゅ]をほめたたえて言[い]った。「主よ、イスラエルの神[かみ]、わたしたちの父[ちち]よ、あなたはとこしえからとこしえまでほめたたえられる方[かた]である。"
  11: "主[しゅ]よ、偉大[いだい]さも力[ちから]も、誉[ほま]れも、勝利[しょうり]も、強[つよ]さもあなたのものである。あなたは天[てん]にあるものも地[ち]にあるものも、すべてを治[おさ]めておられるからである。すべての王[おう]と民[たみ]はあなたの顔[かお]の前[まえ]におののく。主よ、王国[おうこく]も栄光[えいこう]もあなたのもので、すべてのものを越[こ]え、すべての支配[しはい]の上[うえ]にある。"
  12: "富[とみ]も栄光[えいこう]もあなたから出[で]る。あなたはすべてを治[おさ]め、主[しゅ]よ、すべての始[はじ]めの始めである。あなたの手[て]に力[ちから]と権威[けんい]があり、あなたの手に、全能者[ぜんのうしゃ]よ、すべてを大[おお]いならしめ、強[つよ]くする慈[いつく]しみがある。"
  13: "今[いま]、主[しゅ]よ、わたしたちはあなたに感謝[かんしゃ]をささげ、あなたの誉[ほま]れの名[な]をほめたたえる。"
  14: "わたしは何者[なにもの]であり、わたしの民[たみ]は何者なのでしょう。このように進[すす]んでささげることができたとは。すべてはあなたのものであり、わたしたちはあなたから受[う]けたものを、あなたに返[かえ]したのです。"
  15: "わたしたちはあなたの前[まえ]にいる旅人[たびびと]であり、寄留者[きりゅうしゃ]で、父[ちち]たちも皆[みな]そうでした。地上[ちじょう]のわたしたちの日[ひ]々[び]は影[かげ]のようで、とどまることはありません。"
  16: "主[しゅ]、わたしたちの神[かみ]よ。あなたの聖[せい]なる名[な]のための家[いえ]を建[た]てるために準備[じゅんび]したこのすべてのものは、あなたの手[て]から出[で]たものであり、すべてはあなたのものです。"
  17: "主[しゅ]よ、わたしは知[し]っています。あなたが心[こころ]を探[さぐ]り、正[ただ]しさを愛[あい]されることを。わたしは心の純朴[じゅんぼく]さのうちに、これらすべてを進[すす]んでささげました。今[いま]、ここにいるあなたの民[たみ]が、喜[よろこ]びをもってあなたに進んでささげるのを、わたしは見[み]ました。"
  18: "主[しゅ]よ、アブラハム、イサク、イスラエル、わたしたちの父[ちち]たちの神[かみ]よ。このことを、あなたの民[たみ]の心[こころ]の思[おも]いのうちに、とこしえに保[たも]ち、彼[かれ]らの心をあなたに向[む]けてまっすぐにしてください。"
  19: "わたしの子[こ]ソロモンには、あなたの戒[いまし]めと証[あかし]と定[さだ]めを行[おこな]い、あなたの家[いえ]の建造[けんぞう]を最後[さいご]まで成[な]し遂[と]げるために、良[よ]い心[こころ]を与[あた]えてください。」"
  20: "ダビデは会衆[かいしゅう]すべてに言[い]った。「あなたがたの神[かみ]、主[しゅ]をほめたたえなさい。」会衆は皆[みな]、自分[じぶん]たちの父[ちち]たちの神、主をほめたたえ、ひざをかがめて主と王[おう]にひれ伏[ふ]した。"
  21: "ダビデは主[しゅ]に犠牲[ぎせい]を屠[ほふ]り、翌日[よくじつ]、神[かみ]に燔祭[はんさい]をささげた。すなわち、子牛[こうし]千頭[せんとう]、雄羊[おひつじ]千頭、小羊[こひつじ]千頭と、それらの注[そそ]ぎの献[ささ]げ物[もの]、そして全[ぜん]イスラエルのためのおびただしい犠牲である。"
  22: "彼[かれ]らはその日[ひ]、主[しゅ]の前[まえ]で喜[よろこ]びながら食[た]べ、飲[の]んだ。そしてダビデの子[こ]ソロモンを再[ふたた]び王[おう]とし、主のために王として油[あぶら]を注[そそ]ぎ、サドクを祭司職[さいししょく]に油を注いだ。"
  23: "ソロモンは父[ちち]ダビデの代[か]わりに、王[おう]として主[しゅ]の王座[おうざ]に座[すわ]った。彼[かれ]は神[かみ]に喜[よろこ]ばれ、イスラエルは皆[みな]、彼に聞[き]き従[したが]った。"
  24: "長[かしら]たちも、力[ちから]ある者[もの]たちも、王[おう]ダビデのすべての子[こ]らも、彼[かれ]に従[したが]った。"
  25: "主[しゅ]はソロモンを全[ぜん]イスラエルの上[うえ]に大[おお]いならしめ、彼[かれ]の前[まえ]にいたどの王[おう]にもなかった王国[おうこく]の栄光[えいこう]を彼に与[あた]えた。"
  26: "エッサイの子[こ]ダビデはイスラエルを治[おさ]めた。四十年[よんじゅうねん]の間[あいだ]である。"
  27: "ヘブロンで七[なな]年[ねん]、エルサレムで三十三[さんじゅうさん]年であった。"
  28: "彼[かれ]は良[よ]い老年[ろうねん]に、日[ひ]々[び]満[み]ちて、富[とみ]と栄光[えいこう]のうちに死[し]んだ。そしてその子[こ]ソロモンが彼の代[か]わりに王[おう]となった。"
  29: "ダビデ王[おう]の残[のこ]りの言葉[ことば]、初[はじ]めのものも後[のち]のものも、先見者[せんけんしゃ]サムエルの言葉、預言者[よげんしゃ]ナタンの言葉、先見者ガドの言葉のうちに書[か]かれている。"
  30: "すなわち、彼[かれ]のすべての王国[おうこく]とその力[ちから]、彼の時代[じだい]に彼とイスラエルと地[ち]のすべての王国に起[お]こった事柄[ことがら]である。"

notes:
  1: "πάσῃ τῇ ἐκκλησίᾳ — всему собранию; εἷς ὃν ᾑρέτικεν ἐν αὐτῷ κύριος — «один, которого избрал в нём Господь» (тёмное место; слав. «егоже избра себе Господь»); νέος καὶ ἁπαλός — юн и нежен (若く、か弱い); οὐκ ἀνθρώπῳ ἡ οἰκοδομή — не человеку строение (建物は人のためではなく); κυρίῳ θεῷ — Господу Богу."
  2: "κατὰ πᾶσαν τὴν δύναμιν — всей силой (力の限り); ἡτοίμακα — приготовил; λίθους σοομ καὶ πληρώσεως — камни сом и наполнения, т.е. вставные (ソムの石と填め込みの石); πολυτελεῖς καὶ ποικίλους — драгоценные и разноцветные; λίθον τίμιον — камень честный; πάριον πολύν — паросского (парийского) много (パロスの石). Слав. «камение мраморное» для σοομ."
  3: "ἐν τῷ εὐδοκῆσαί με — по благоволению моему; ὃ περιπεποίημαι — что я приобрёл (своё); εἰς ὕψος — в высоту, т.е. сверх (積み上げて); ἐκτὸς ὧν ἡτοίμακα — сверх того, что приготовил; οἶκον τῶν ἁγίων — дом святых (聖なる家)."
  4: "τρισχίλια τάλαντα χρυσίου τοῦ ἐκ Σουφιρ — 3000 талантов золота из Суфира (в ru «Офирского» по МТ); ἑπτακισχίλια τάλαντα ἀργυρίου δοκίμου — 7000 талантов серебра чистого; ἐξαλειφθῆναι — покрыть (букв. «загладить», здесь обложить); τοὺς τοίχους τοῦ ἱεροῦ — стены святилища (聖所の壁)."
  5: "διὰ χειρὸς τεχνιτῶν — рукою художников (職人の手). Слав. добавляет «идеже дело златое златом, а идеже сребряное сребром, и на всякое дело рукою художников» (по МТ) — внесено. πληρῶσαι τὰς χεῖρας — наполнить руки (посвятить, внести); προθυμούμενος — желающий."
  6: "προεθυμήθησαν — проявили усердие (進んでささげた); ἄρχοντες τῶν πατριῶν — главы отечеств (氏族の長); προστάται τῶν ἔργων — начальники работ; οἰκονόμοι τοῦ βασιλέως — домоправители царя (王の家の管理者)."
  7: "εἰς τὰ ἔργα οἴκου κυρίου — на дела дома Господня; χρυσίου τάλαντα πεντακισχίλια — 5000 талантов золота; χρυσοῦς μυρίους — 10 000 золотых (金貨一万枚); ἀργυρίου... δέκα χιλιάδας — 10 000 талантов серебра; χαλκοῦ τάλαντα μύρια ὀκτακισχίλια — 18 000 талантов меди; σιδήρου... χιλιάδας ἑκατόν — 100 000 талантов железа."
  8: "οἷς εὑρέθη παρ᾽ αὐτοῖς λίθος — у кого нашёлся камень (宝石); ἀποθήκας — хранилища (宝物庫); διὰ χειρὸς Ιιηλ τοῦ Γηρσωνι — через руку Иехиила Герсонянина (ゲルション人)."
  9: "εὐφράνθη ὁ λαός — возвеселился народ; ὑπὲρ τοῦ προθυμηθῆναι — о усердии; ἐν καρδίᾳ πλήρει — всем сердцем (全き心); εὐφράνθη μεγάλως — возвеселился весьма."
  10: "εὐλόγησεν... ἐνώπιον τῆς ἐκκλησίας — благословил пред собранием; Εὐλογητὸς εἶ — благословен Ты (ほめたたえられる方); ὁ πατὴρ ἡμῶν — Отец наш (わたしたちの父); ἀπὸ τοῦ αἰῶνος καὶ ἕως τοῦ αἰῶνος — от века и до века (とこしえからとこしえまで)."
  11: "μεγαλωσύνη, δύναμις, καύχημα, νίκη, ἰσχύς — величие, сила, похвала, победа, крепость (偉大さ、力、誉れ、勝利、強さ); δεσπόζεις — владычествуешь; ἀπὸ προσώπου σου ταράσσεται — от лица Твоего трепещет. Слав. добавляет в конце «и тебе, Господи, Царство и великолепие во всех и во всяцем начале» (по МТ) — внесено (王国も栄光も...すべての支配の上に)."
  12: "παρὰ σοῦ ὁ πλοῦτος — от Тебя богатство; ὁ ἄρχων πάσης ἀρχῆς — начальствующий над всяким начальством; слав. «начало всякаго начала» — в тексте (すべての始めの始め); ἐν χειρί σου ἰσχὺς καὶ δυναστεία — в руке Твоей крепость и власть; παντοκράτωρ — Вседержитель (全能者); μεγαλῦναι καὶ κατισχῦσαι — возвеличить и укрепить. Слав. добавляет «милость» (慈しみ) — внесено."
  13: "ἐξομολογούμεθά σοι — исповедуемся Тебе (感謝をささげる); αἰνοῦμεν τὸ ὄνομα τῆς καυχήσεώς σου — хвалим имя хваления Твоего (誉れの名)."
  14: "τίς εἰμι ἐγώ — кто я; ὅτι ἰσχύσαμεν προθυμηθῆναι — что мы смогли усердно дать; σὰ τὰ πάντα — Твоё всё; ἐκ τῶν σῶν δεδώκαμέν σοι — от Твоих мы дали Тебе (あなたから受けたものを返した)."
  15: "πάροικοι... καὶ παροικοῦντες — пришельцы и поселенцы (旅人、寄留者); ὡς σκιὰ αἱ ἡμέραι — как тень дни наши; οὐκ ἔστιν ὑπομονή — нет постоянства (とどまることはない; слав. «несть постояния»)."
  16: "πᾶν τὸ πλῆθος τοῦτο — всё это множество; ὃ ἡτοίμακα οἰκοδομηθῆναι — которое я приготовил, чтобы построить; ἐκ χειρός σού ἐστιν — от руки Твоей оно; σοὶ τὰ πάντα — Тебе всё."
  17: "ὁ ἐτάζων καρδίας — испытующий сердца (心を探る); δικαιοσύνην ἀγαπᾷς — правду любишь; ἐν ἁπλότητι καρδίας — в простоте сердца (心の純朴さ); προεθυμήθην — усердно дал; ἐν εὐφροσύνῃ — с радостью."
  18: "φύλαξον ταῦτα ἐν διανοίᾳ καρδίας — сохрани это в мысли сердца (心の思い); εἰς τὸν αἰῶνα — навек; κατεύθυνον τὰς καρδίας — направь сердца (まっすぐにしてください)."
  19: "δὸς καρδίαν ἀγαθήν — дай сердце благое (良い心); τὰ μαρτύριά σου — откровения (証); τὰ προστάγματά σου — повеления (定め); ἐπὶ τέλος ἀγαγεῖν — довести до конца; τὴν κατασκευὴν τοῦ οἴκου — построение дома (建造)."
  20: "Εὐλογήσατε κύριον — благословите Господа; κάμψαντες τὰ γόνατα — преклонив колени (ひざをかがめて); προσεκύνησαν τῷ κυρίῳ καὶ τῷ βασιλεῖ — поклонились Господу и царю."
  21: "τῇ ἐπαύριον τῆς πρώτης ἡμέρας — на другой день после первого (その翌日); μόσχους χιλίους, κριοὺς χιλίους, ἄρνας χιλίους — тельцов, овнов, агнцев по тысяче; τὰς σπονδὰς αὐτῶν — возлияния их (注ぎの献げ物); θυσίας εἰς πλῆθος — жертв во множество (おびただしい犠牲)."
  22: "ἔφαγον καὶ ἔπιον... μετὰ χαρᾶς — ели и пили с радостью; ἐβασίλευσαν ἐκ δευτέρου — воцарили во второй раз (再び王とし); ἔχρισαν αὐτὸν τῷ κυρίῳ εἰς βασιλέα — помазали его Господу в царя (主のために王として油を注ぎ); Σαδωκ εἰς ἱερωσύνην — Садока в священство; слав. «садока же во архиереа» — в тексте по csl (大祭司), вариант LXX в notes."
  23: "ἐκάθισεν... ἐπὶ θρόνου Δαυιδ τοῦ πατρὸς αὐτοῦ — сел на престоле Давида, отца своего; слав. «на престоле Господни в царя, вместо давида отца своего» — в тексте по csl (主の王座), вариант LXX в notes. εὐδοκήθη — был благоугоден (神に喜ばれ); ἐπήκουσαν — слушали (聞き従った)."
  24: "οἱ ἄρχοντες καὶ οἱ δυνάσται — начальники и властелины; πάντες υἱοὶ τοῦ βασιλέως Δαυιδ πατρὸς αὐτοῦ — все сыны царя Давида, отца его; ὑπετάγησαν — подчинились."
  25: "ἐμεγάλυνεν — возвеличил; ἐπάνωθεν ἐναντίον παντὸς Ισραηλ — превыше пред всем Израилем; δόξαν βασιλέως — славу царства (王国の栄光); οὐκ ἐγένετο ἐπὶ παντὸς βασιλέως ἔμπροσθεν αὐτοῦ — не было ни у одного царя прежде него."
  26: "ἐβασίλευσεν ἐπὶ Ισραηλ — царствовал над Израилем. Слав. 29:26 добавляет «четыредесять лет» (это начало gr 29:27) — внесено (四十年); нумерация держится gr."
  27: "ἔτη τεσσαράκοντα — сорок лет; ἐν Χεβρων ἔτη ἑπτὰ καὶ ἐν Ιερουσαλημ ἔτη τριάκοντα τρία — в Хевроне семь лет и в Иерусалиме тридцать три года. Слав. 29:27 начинается с «в хевроне...» без повторения числа лет."
  28: "ἐν γήρει καλῷ — в старости доброй (良い老年); πλήρης ἡμερῶν — исполненный дней (日々満ちて); πλούτῳ καὶ δόξῃ — в богатстве и славе; ἐβασίλευσεν Σαλωμων... ἀντ αὐτοῦ — воцарился Соломон вместо него."
  29: "οἱ λοιποὶ λόγοι — прочие слова; οἱ πρότεροι καὶ οἱ ὕστεροι — первые и последние; γεγραμμένοι — написаны; ἐν λόγοις Σαμουηλ τοῦ βλέποντος — в словах Самуила прозорливца (先見者); ἐπὶ λόγων Ναθαν τοῦ προφήτου — в словах Нафана пророка; Γαδ τοῦ βλέποντος — Гада прозорливца."
  30: "περὶ πάσης τῆς βασιλείας — о всём царстве; δυναστεία — крепость, могущество (力); οἱ καιροί — времена; οἳ ἐγένοντο ἐπ᾽ αὐτῷ — бывшие при нём; ἐπὶ πάσας βασιλείας τῆς γῆς — на все царства земные."
