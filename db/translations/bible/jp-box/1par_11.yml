# jp-box, 1-я Паралипоменон, глава 11. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет,
# jp-ni (943 стиха, под авторским правом) источником не был.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 11: Давид помазан над всем Израилем в Хевроне (1–3); взятие Сиона,
# город Давидов (4–9); перечень храбрых (10–41); добавка о Рувиме и прочих
# (42–47). Параллели — 2 Цар 5:1–10 и 2 Цар 23:8–39.
# Речь — 「…」: 11:1–2 (старейшины; слова Господа внутри — 『…』), 11:5 (жители
# Иевуса), 11:6 (Давид), 11:17 (Давид), 11:19 (Давид). Красного нет.
# 〔…〕 нет: в gr-lxx-byz на месте каждого стиха есть текст; пояснения издания
# в квадратных скобках (11:4 «это Иевус», 11:5 «это город Давида») переведены.
# Сносок ⟨…⟩ нет: 契約, 油を注ぐ, 砦, 勇士, 巨人 уже в корпусе.
# Имена сверены с 2ts_05 и 2ts_23; где LXX 1 Пар. расходится с LXX 2 Цар.,
# форма 1 Пар. сохранена, расхождение отмечено в notes.
# jp-ni не использовался.

tr_code: jp-box
book: 1par
chapter: 11
draft: true

verses:
  1: "イスラエルはすべて、ヘブロンのダビデのもとへ来[き]て言[い]った。「ごらんなさい。わたしたちはあなたの骨[ほね]と肉[にく]です。"
  2: "昨日[きのう]も一昨日[おととい]も、サウルが王[おう]であったとき、イスラエルを導[みちび]き出[だ]し、導き入[い]れていたのはあなたでした。主[しゅ]はあなたに『あなたはわたしの民[たみ]イスラエルを牧[まき]し、わたしの民イスラエルの上[うえ]の指導者[しどうしゃ]となる』と言[い]われました。」"
  3: "イスラエルの長老[ちょうろう]たちはみな、ヘブロンの王[おう]のもとへ来[き]た。王[おう]ダビデはヘブロンで、主[しゅ]の前[まえ]で彼[かれ]らと契約[けいやく]を結[む]んだ。彼[かれ]らはダビデに油[あぶら]を注[そそ]いで、イスラエルの王[おう]とした。主[しゅ]の言葉[ことば]どおり、サムエルを通[とお]して語[かた]られたとおりである。"
  4: "王[おう]とイスラエルの男[おとこ]たちはエルサレムへ、すなわちエブスへ向[む]かった。そこには、その地[ち]に住[す]むエブス人[じん]がいた。"
  5: "エブスに住[す]む者[もの]たちはダビデに言[い]った。「ここには入[はい]るな。」しかしダビデはシオンの砦[とりで]を取[と]った。これがダビデの町[まち]である。"
  6: "ダビデは言[い]った。「最初[さいしょ]にエブス人[じん]を打[う]つ者[もの]は、長[かしら]となり、将軍[しょうぐん]となる。」ヨアブ、サルヤの子[こ]が最初[さいしょ]にそこへ上[のぼ]り、長[かしら]となった。"
  7: "ダビデはその砦[とりで]に住[す]んだ。それゆえ、そこはダビデの町[まち]と呼[よ]ばれた。"
  8: "彼[かれ]は町[まち]を周[まわ]りに、ミロから周囲[しゅうい]に至[いた]るまで建[た]てた。ヨアブは町[まち]の残[のこ]りを修復[しゅうふく]した。ダビデは戦[たたか]って、その町[まち]を取[と]った。"
  9: "ダビデはますます進[すす]み、大[おお]きくなっていった。全能者[ぜんのうしゃ]である主[しゅ]が彼[かれ]とともにあった。"
  10: "ダビデの勇士[ゆうし]たちの長[かしら]たち、すなわち彼[かれ]の王国[おうこく]にあって、主[しゅ]の言葉[ことば]に従[したが]って彼[かれ]がイスラエルを治[おさ]めるために、イスラエルすべてとともに彼[かれ]を支[ささ]えた力[ちから]ある者[もの]たちは、次[つぎ]のとおりである。"
  11: "ダビデの勇士[ゆうし]たちの数[かず]は次[つぎ]のとおりである。イエセバアル、アカマニの子[こ]は三十人[さんじゅうにん]のうちの第一[だいいち]である。彼[かれ]は一度[いちど]、剣[つるぎ]を抜[ぬ]いて三百人[さんびゃくにん]の者[もの]に向[む]かい、一[ひと]時[とき]に彼らを討[う]った。"
  12: "彼[かれ]の次[つぎ]はエレアザル、ドダイの子[こ]で、アコヒ人[びと]である。彼[かれ]は三人[さんにん]の勇士[ゆうし]の一人[ひとり]であった。"
  13: "彼[かれ]はダビデとともにファソドミンにいた。そこにペリシテ人[じん]が戦[いくさ]のために集[あつ]まった。そこには大麦[おおむぎ]の満[み]ちた畑[はたけ]の一区画[ひときく]があり、民[たみ]はペリシテ人[じん]の前[まえ]から逃[に]げた。"
  14: "しかし彼[かれ]はその区画[くかく]の真[ま]ん中[なか]に立[た]ちはだかり、それを守[まも]ってペリシテ人[じん]を討[う]った。主[しゅ]は大[おお]きな救[すく]いを成[な]し遂[と]げられた。"
  15: "三十人[さんじゅうにん]の長[かしら]たちのうちの三人[さんにん]が、オドラムの洞窟[どうくつ]にいるダビデのもとへ、岩[いわ]のところへ下[くだ]った。そのとき、ペリシテ人[じん]の陣営[じんえい]は巨人[きょじん]たちの谷[たに]に陣[じん]を取[と]っていた。"
  16: "ダビデはそのとき砦[とりで]にいた。ペリシテ人[じん]の部隊[ぶたい]はそのときベツレヘムにいた。"
  17: "ダビデは望[のぞ]んで言[い]った。「だれか、ベツレヘムの門[もん]のそばの水[みず]溜[だ]めの水[みず]を飲[の]ませてくれないか。」"
  18: "その三人[さんにん]はペリシテ人[じん]の陣営[じんえい]を切[き]り抜[ぬ]け、門[もん]のそばにあるベツレヘムの水[みず]溜[だ]めから水[みず]を汲[く]んで、ダビデのもとへ持[も]って来[き]た。しかしダビデはそれを飲[の]もうとせず、主[しゅ]に注[そそ]ぎ出[だ]した。"
  19: "そして言[い]った。「神[かみ]よ、わたしがそのようなことをするなど、決[けっ]してありえない。命[いのち]をかけて行[い]ったこの者[もの]たちの血[ち]を、どうして飲[の]めようか。」彼[かれ]らは命[いのち]をかけてそれを運[はこ]んだからである。ダビデはそれを飲[の]もうとしなかった。これが、あの三人[さんにん]の勇士[ゆうし]たちがしたことである。"
  20: "アベシャ、ヨアブの兄弟[きょうだい]は、三人[さんにん]の長[かしら]であった。彼[かれ]は一度[いちど]剣[つるぎ]を抜[ぬ]いて三百人[さんびゃくにん]の者[もの]を討[う]ち、三人[さんにん]のうちで名[な]を得[え]た。"
  21: "彼[かれ]は三人[さんにん]のうちで、二人[ふたり]よりも輝[かがや]かしく、彼[かれ]らの長[かしら]となった。しかし、あの三人[さんにん]には及[およ]ばなかった。"
  22: "ヨダエの子[こ]バナイアは、力[ちから]ある男[おとこ]の子[こ]で、その業[わざ]は多[おお]く、カバサエルから出[で]た者[もの]である。彼[かれ]はモアブのアリエル二人[ふたり]を打[う]ち殺[ころ]した。彼[かれ]はまた、雪[ゆき]の日[ひ]に、水[みず]溜[だ]めの中[なか]の獅子[しし]を殺[ころ]した。"
  23: "彼[かれ]はまた、エジプト人[じん]の男[おとこ]を打[う]ち殺[ころ]した。その男[おとこ]は五[ご]キュビトの、見[み]るからに立派[りっぱ]な人[ひと]で、エジプト人[じん]の手[て]には、織[お]る者[もの]の機[はた]の横木[よこぎ]のような槍[やり]があった。バナイアは杖[つえ]を持[も]ってその男[おとこ]のところへ下[お]り、エジプト人[じん]の手[て]から槍[やり]を奪[うば]い取[と]って、その槍[やり]で彼を殺[ころ]した。"
  24: "これがヨダエの子[こ]バナイアのしたことであり、彼[かれ]は三人[さんにん]の勇士[ゆうし]のうちで名[な]を得[え]た。"
  25: "彼[かれ]は三十人[さんじゅうにん]よりも輝[かがや]かしく、あの三人[さんにん]には及[およ]ばなかった。ダビデは彼を自分[じぶん]の氏族[しぞく]の長[かしら]に任[にん]じた。"
  26: "勇士[ゆうし]たちのうちの力[ちから]ある者[もの]たちは次[つぎ]のとおりである。ヨアブの兄弟[きょうだい]アサエル、ベツレヘムのドドの子[こ]エレアナン、"
  27: "アディ人[びと]サモト、ペロニ人[びと]ケレス、"
  28: "テコア人[びと]イケシュの子[こ]オライ、アナトト人[びと]アビエゼル、"
  29: "アソト人[びと]ソボカイ、アコヒ人[びと]エリ、"
  30: "ネトファ人[びと]モライ、ネトファ人[びと]ノザの子[こ]コロド、"
  31: "ベニヤミンの丘[おか]から出[で]たリバイの子[こ]アイティ、ファラトン人[びと]バナイア、"
  32: "ナハリ・ガアスから出[で]たウリ、ガラベト人[びと]アビエル、"
  33: "ベエルミ人[びと]アズモト、サラボン人[びと]エリアバ、"
  34: "ベンナイア、ゲンヌニ人[びと]オソム、アラリ人[びと]サラの子[こ]ヨナタン、"
  35: "アラリ人[びと]サハルの子[こ]アキム、ウルの子[こ]エルファル、"
  36: "モコラト人[びと]オファル、ペロニ人[びと]アキア、"
  37: "カルメル人[びと]エセライ、アゾバイの子[こ]ナアライ、"
  38: "ナタンの兄弟[きょうだい]ヨエル、アガルの子[こ]メバアル、"
  39: "アンモン人[じん]セレク、ベロト人[びと]ナコル、すなわちヨアブ、サルヤの子[こ]の武具[ぶぐ]を担[かつ]ぐ者[もの]、"
  40: "イテル人[びと]イラ、イテル人[びと]ガレブ、"
  41: "ヘト人[びと]ウリヤ、アフライの子[こ]ザベト、"
  42: "ルビム人[じん]シツァの子[こ]アディナは、ルビム人[じん]の長[かしら]で、そのもとに三十人[さんじゅうにん]がいた。"
  43: "マアカの子[こ]アナン、ベタン人[びと]ヨサファト、"
  44: "アスタロト人[びと]オジア、アラリ人[びと]ホタンの子[こ]サマとイエイル、"
  45: "サメリの子[こ]イエディエルと、その兄弟[きょうだい]ヨアザエ、すなわちイアシ人[びと]、"
  46: "ミイ人[びと]エリエル、イアリビ、その子[こ]イオシア、エルナアム、モアブ人[じん]イエテマ、"
  47: "アリエル、オベド、ミサビア人[びと]イエシエル。"

notes:
  1: "πᾶς Ισραηλ — весь Израиль (в 2 Цар 5:1 — «все племена Израилевы», иной текст). ὀστᾶ σου καὶ σάρκες σου — кости твои и плоть твоя: формула родства (Быт 2:23; 29:14; 2 Цар 5:1). λέγοντες — говоря. Речь старейшин — в «…»."
  2: "ἐχθὲς καὶ τρίτην — «вчера и третьего дня», т.е. прежде, до сих пор. ὁ ἐξάγων καὶ εἰσάγων — выводящий и вводящий, вождь на войне и в мире. ποιμανεῖς — будешь пасти (ποιμαίνω). ἡγούμενος — вождь. Гр. ἐπὶ Ισραηλ — «над Израилем»; слав. «над людьми моими израилем» — в текст внесено «わたしの民イスラエルの上の指導者» (как 2 Цар 5:2). Слова Господа внутри речи — 『…』."
  3: "πρεσβύτεροι — старейшины. διέθετο … διαθήκην — заключил завет (διατίθημι). ἔχρισαν εἰς βασιλέα — помазали в царя (χρίω), 油を注ぐ. κατὰ τὸν λόγον κυρίου διὰ χειρὸς Σαμουηλ — по слову Господню рукою Самуила; этой клаузы в 2 Цар 5:3 нет, она есть в гр. 1 Пар."
  4: "ἐπορεύθη ὁ βασιλεὺς καὶ ἄνδρες Ισραηλ — пошёл царь и мужи Израиля; слав. «и весь израиль» — добавление. αὕτη Ιεβους — «это Иевус», пояснение издания в квадратных скобках, переведено. ἐκεῖ οἱ Ιεβουσαῖοι — там иевусеи, エブス人 (как в 2 Цар 5:6)."
  5: "Οὐκ εἰσελεύσῃ ὧδε — «не войдёшь сюда»: краткая форма насмешки; в 2 Цар 5:6 она пространнее (слепые и хромые). προκατελάβετο — взял прежде, овладел (προκαταλαμβάνω). περιοχή — укреплённое место, крепость, 砦. αὕτη ἡ πόλις Δαυιδ — «это город Давида»: пояснение издания в скобках, переведено."
  6: "πᾶς τύπτων — всякий, кто поражает (τύπτω). ἐν πρώτοις — в первых, первым. ἄρχων καὶ στρατηγός — князь и военачальник, 長 и 将軍. ἀνέβη ἐπ᾿ αὐτήν — взошёл на неё (на крепость). Ιωαβ υἱὸς Σαρουια — ヨアブ, сын Саруи (2 Цар 2:13)."
  7: "ἐκάθισεν — сел, поселился (καθίζω). διὰ τοῦτο ἐκάλεσεν αὐτήν — поэтому назвал её. Πόλις Δαυιδ — ダビデの町 (ср. 2 Цар 5:9)."
  8: "Гр. коротко: «и построил город кругом; и воевал, и взял город». Слав. добавляет «от Милло» (מִלּוֹא) и «Иоав же прочее града сострои» — по евр.; внесено в текст без скобок, как принято для csl-чтений. κύκλῳ — вокруг. ᾠκοδόμησεν — построил (οἰκοδομέω)."
  9: "ἐπορεύετο … πορευόμενος καὶ μεγαλυνόμενος — «шёл, идя и возвеличиваясь», т.е. рос и возвышался (μεγαλύνω). κύριος παντοκράτωρ — Господь Вседержитель, 全能者である主, как в 2 Цар 5:10 (стих совпадает)."
  10: "ἄρχοντες τῶν δυνατῶν — главы храбрых. οἱ κατισχύοντες μετ᾿ αὐτοῦ — укреплявшие его, поддерживавшие (κατισχύω). ἐν τῇ βασιλείᾳ αὐτοῦ — в царстве его. τοῦ βασιλεῦσαι αὐτὸν … ἐπὶ Ισραηλ — чтобы он царствовал над Израилем (инфинитив цели). κατὰ τὸν λόγον κυρίου — по слову Господню."
  11: "ἀριθμὸς τῶν δυνατῶν — число храбрых. Ιεσεβααλ υἱὸς Αχαμανι — イエセバアル, сын Акамани (евр. Яшовеам, сын Хахмони); в 2 Цар 23:8 LXX читает иначе, там イシュボシェト・ハナアン人. πρῶτος τῶν τριάκοντα — первый из тридцати. ἐσπάσατο τὴν ῥομφαίαν — обнажил меч (σπάω); Синод. «поднял копьё» — по евр. ἅπαξ … ἐν καιρῷ ἑνί — однажды, в одно время."
  12: "Ελεαζαρ υἱὸς Δωδαι ὁ Αχωχι — エレアザル, сын Додая, ахохитянин; в 2 Цар 23:9 LXX: «сын брата отца его, сын Сусита» — иная традиция. ἐν τοῖς τρισὶν δυνατοῖς — среди трёх храбрых."
  13: "Φασοδομιν — ファソドミン (в 2 Цар 23:11 — Θηρια, テリア; в Синод. «Фасдамим»). συνήχθησαν εἰς πόλεμον — собрались на войну. μερὶς τοῦ ἀγροῦ πλήρης κριθῶν — часть поля, полная ячменя (κριθή); слав. «часть нивы полна ячменя». ἔφυγεν ἀπὸ προσώπου — побежал от лица."
  14: "ἔστη ἐν μέσῳ τῆς μερίδος — стал среди участка (ἵστημι). ἔσωσεν αὐτήν — спас его, т.е. удержал поле. ἐπάταξεν — поразил. σωτηρίαν μεγάλην — великое спасение; слав. добавляет «людем своим»."
  15: "κατέβησαν τρεῖς ἐκ τῶν τριάκοντα ἀρχόντων — сошли трое из тридцати начальников. πέτρα — скала, 岩. σπήλαιον Οδολλαμ — пещера Одоллам, オドラムの洞窟 (2 Цар 23:13). κοιλὰς τῶν γιγάντων — долина гигантов (γίγας); в 2 Цар 23:13 — «долина Рефаимов» (ラファイムの谷)."
  16: "ἐν τῇ περιοχῇ — в крепости, 砦. σύστεμα τῶν ἀλλοφύλων — отряд, застава филистимлян (σύστεμα; слав. «полк»). ἐν Βαιθλεεμ — в Вифлееме."
  17: "ἐπεθύμησεν — возжаждал, сильно захотел (ἐπιθυμέω). Τίς ποτιεῖ με ὕδωρ — «кто напоит меня водой» (ποτίζω). λάκκος — яма-цистерна, 水溜め. ἐν τῇ πύλῃ — у ворот. Ср. 2 Цар 23:15."
  18: "διέρρηξαν τὴν παρεμβολήν — прорвались сквозь стан (διαρρήγνυμι). ὑδρεύσαντο — почерпнули воды (ὑδρεύω). οὐκ ἠθέλησεν τοῦ πιεῖν — не захотел пить. ἔσπεισεν αὐτὸ τῷ κυρίῳ — вылил его Господу (σπένδω, возлияние)."
  19: "Ἵλεώς μοι ὁ θεός — «милостив мне Бог» (ἵλεως); слав. «милостив ми Бог». τοῦ ποιῆσαι τὸ ῥῆμα τοῦτο — сделать это дело. εἰ αἷμα … πίομαι — «разве кровь … выпью» (риторический вопрос). ἐν ψυχαῖς αὐτῶν — с душами их, т.е. с опасностью жизни; слав. «в душах их». ἤνεγκαν — принесли."
  20: "Αβεσσα ἀδελφὸς Ιωαβ — アベシャ, брат Иоава (2 Цар 23:18). ἄρχων τῶν τριῶν — начальник трёх. ἐσπάσατο τὴν ῥομφαίαν — обнажил меч свой; Синод. «убил копьём» — по евр. ὀνομαστὸς ἐν τοῖς τρισίν — именитый среди трёх."
  21: "ὑπὲρ τοὺς δύο ἔνδοξος — славнее двоих (ἔνδοξος). εἰς ἄρχοντα — в начальника. ἕως τῶν τριῶν οὐκ ἤρχετο — «до трёх не доходил», т.е. не равнялся с теми тремя (ἔρχομαι в знач. достигать). Ср. 2 Цар 23:19."
  22: "Βαναιας υἱὸς Ιωδαε — バナイア, сын Иодая (ヨダエ). πολλὰ ἔργα αὐτοῦ ὑπὲρ Καβασαηλ — «много дел его; он из Кавасаила» (в 2 Цар 23:20 — Καβσαηλ, カブツェエル; ὑπὲρ здесь, видимо, вместо ἀπό). τοὺς δύο αριηλ Μωαβ — двух Ариилов Моавитских (слав. «двоих ариилов моавских»); разумеются два моавитских мужа. λέων ἐν τῷ λάκκῳ — лев в яме, 獅子. ἐν ἡμέρᾳ χιόνος — в день снега, 雪の日に."
  23: "ἄνδρα ὁρατὸν πεντάπηχυν — видного мужа пяти локтей (πέντε + πῆχυς), 五キュビト. δόρυ ὡς ἀντίον ὑφαινόντων — копьё, как навой ткачей (ἀντίον — поперечный брус ткацкого станка). ἐν ῥάβδῳ — с палкой, 杖. ἀφείλατο — отнял (ἀφαιρέω). ἀπέκτεινεν ἐν τῷ δόρατι αὐτοῦ — убил его же копьём."
  24: "ταῦτα ἐποίησεν — это сделал. ὄνομα ἐν τοῖς τρισὶν τοῖς δυνατοῖς — имя среди трёх храбрых, т.е. прославился. Формула повторяет ст. 20."
  25: "ὑπὲρ τοὺς τριάκοντα ἔνδοξος — славнее тридцати. πρὸς τοὺς τρεῖς οὐκ ἤρχετο — с тремя не равнялся. κατέστησεν αὐτὸν … ἐπὶ τὴν πατριὰν αὐτοῦ — поставил его над родом своим (πατριά); Синод. «ближайшим исполнителем приказаний» — по евр. «в свою стражу». Держимся гр."
  26: "δυνατοὶ τῶν δυνάμεων — «сильные из сил», т.е. главные из войска; слав. «сильнии сил». Ασαηλ — アサエル, Ελεαναν υἱὸς Δωδω — エレアナン, сын Додо (в 2 Цар 23:24 — Додай, ドダイ). ἐκ Βαιθλαεμ — из Вифлеема."
  27: "Σαμμωθ ὁ Αδι — サモト, адитянин (в 2 Цар 23:25 — Шамма Гародитянин). Χελλης ὁ Φελωνι — ケレス, пелонитянин; слав. «хелкий афелонин». Порядок и формы имён в 1 Пар. и 2 Цар. расходятся — держимся 1 Пар."
  28: "Ωραι υἱὸς Εκκης ὁ Θεκωι — オライ, сын Икеша, текоитянин (в 2 Цар 23:26 — Ира, сын Икеша, テコア人イラ). Αβιεζερ ὁ Αναθωθι — アビエゼル, анатотянин (2 Цар 23:27)."
  29: "Σοβοχαι ὁ Ασωθι — ソボカイ, асофянин (в 2 Цар 23:27 — Сивхай Хушатянин). Ηλι ὁ Αχωι — エリ, ахохитянин (в 2 Цар 23:28 — Илай Ахохиянин)."
  30: "Μοοραι ὁ Νετωφαθι — モライ, нетофафянин (в 2 Цар 23:28 — Магарай). Χολοδ υἱὸς Νοοζα — コロド, сын Нозы (в 2 Цар 23:29 — Хелед, сын Вааны). Оба нетофафяне."
  31: "Αιθι υἱὸς Ριβαι ἐκ βουνοῦ Βενιαμιν — アイティ, сын Рибая, с холма Вениаминова (в 2 Цар 23:29 — Иттай из Гивы Вениаминовой). Βαναιας ὁ Φαραθωνι — バナイア, фарафонец (Пирафонянин)."
  32: "Ουρι ἐκ Ναχαλιγαας — ウリ из Нахали-Гааса (в 2 Цар 23:30 — Хурай из Нагале-Гааша). Αβιηλ ὁ Γαραβεθθι — アビエル, гаравефитянин (Авиел из Аравы)."
  33: "Αζμωθ ὁ Βεερμι — アズモト, беэрмитянин (в 2 Цар 23:31 — Азмавеф Бахарумиянин). Ελιαβα ὁ Σαλαβωνι — エリアバ, салавонянин (Елияхба Шаалбонянин)."
  34: "Βενναιας, Οσομ ὁ Γεννουνι — ベンナイア, オソム геннунитянин; слав. «ирас гоинийский», Синод. «сыновья Гашема Гизонитянина» — текст испорчен, держимся гр. Ιωναθαν υἱὸς Σωλα ὁ Αραρι — ヨナタン, сын Салы, араритянин."
  35: "Αχιμ υἱὸς Σαχαρ — アキム, сын Сахара (Ахиам, сын Сахара). Ελφαλ υἱὸς Ουρ — エルファル, сын Ура (Елифал, сын Уры)."
  36: "Οφαρ ὁ Μοχοραθι — オファル, мохоратянин (Хефер из Махеры). Αχια ὁ Φελωνι — アキア, пелонитянин (Ахиа Пелонитянин)."
  37: "Ησεραι ὁ Χαρμαλι — エセライ, кармелитянин (Хецрой Кармилитянин). Νααραι υἱὸς Αζωβαι — ナアライ, сын Азовая (Наарай, сын Езбая)."
  38: "Ιωηλ ἀδελφὸς Ναθαν — ヨエル, брат Нафана. Μεβααρ υἱὸς Αγαρι — メバアル, сын Агара (Мивхар, сын Гагрия)."
  39: "Σεληκ ὁ Αμμωνι — セレク, аммонитянин (Целек Аммонитянин). Ναχωρ ὁ Βερθι — ナコル, веротянин (Нахарай Берофянин). αἴρων σκεύη Ιωαβ — носящий оружие Иоава, оруженосец."
  40: "Ιρα ὁ Ιεθηρι — イラ, иетериянин; Γαρηβ ὁ Ιεθηρι — ガレブ, иетериянин (Ира и Гареб Ифрияне). Имена совпадают с 2 Цар 23:38."
  41: "Ουριας ὁ Χεττι — ウリヤ, хеттеянин (2 Цар 23:39; 11:3). Ζαβετ υἱὸς Αχλια — ザベト, сын Ахлая (Завад, сын Ахлая)."
  42: "Αδινα υἱὸς Σαιζα τοῦ Ρουβην — アディナ, сын Шизы, рувимлянин (Адина, сын Шизы). ἄρχων — глава Рувима. ἐπ᾿ αὐτῷ τριάκοντα — при нём тридцать (воинов). С этого стиха начинается добавка, которой нет в 2 Цар 23."
  43: "Αναν υἱὸς Μοωχα — アナン, сын Маахи (Ханан, сын Маахи). Ιωσαφατ ὁ Βαιθανι — ヨサファト, бетанит (Иосафат Мифниянин)."
  44: "Οζια ὁ Ασταρωθι — オジア, астаротянин (Уззия Аштерофянин). Σαμμα καὶ Ιιηλ υἱοὶ Χωθαν τοῦ Αραρι — サマ и イエイル, сыновья Хотана, араритянина (Шама и Иеиел, сыновья Хофама Ароерянина)."
  45: "Ιεδιηλ υἱὸς Σαμερι — イエディエル, сын Самера (Иедиаел, сын Шимрия). Ιωαζαε ὁ ἀδελφὸς αὐτοῦ — ヨアザエ, брат его. ὁ Ιεασι — «Иеаси», вероятно этников; слав. «фосаин», Синод. «Фициянин». Передано как イアシ人, с оговоркой."
  46: "Ελιηλ ὁ Μιι — エリエル, миитянин (Елиел из Махавима; текст испорчен). Ιαριβι — イアリビ (Иеривай), Ιωσια υἱὸς αὐτοῦ — イオシア, сын его (Иошавия). Ελνααμ — エルナアム (Елнаам). Ιεθεμα ὁ Μωαβίτης — イエテマ, моавитянин (Ифма Моавитянин)."
  47: "Αλιηλ — アリエル, Ωβηδ — オベド, Ιεσιηλ ὁ Μισαβια — イエシエル, мисавитянин (Иасиел из Мецоваи). Слав. «месовиев». Итог списка: в 2 Цар 23:39 — «всех тридцать семь»."
