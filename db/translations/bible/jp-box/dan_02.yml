verses:
  1: "ネブカドネツァルの治世[ちせい]の第二年[だいにねん]、ネブカドネツァルは夢[ゆめ]と幻[まぼろし]を見[み]た。彼[かれ]の霊[れい]は惑[まど]い、眠[ねむ]りは彼[かれ]から去[さ]った。"
  2: "王[おう]は、呪術師[じゅじゅつし]たち、魔術師[まじゅつし]たち、呪詛師[じゅそし]たち、カルデア人[じん]を呼[よ]び寄[よ]せて、王[おう]に夢[ゆめ]を告[つ]げるよう命[めい]じた。彼[かれ]らは来[き]て、王[おう]の前[まえ]に立[た]った。"
  3: "王[おう]は彼[かれ]らに言[い]った。「わたしは夢[ゆめ]を見[み]た。わたしの霊[れい]は揺[ゆ]れ動[うご]いている。それゆえ、その夢[ゆめ]が何[なに]なのか知[し]りたいのだ。」"
  4: "カルデア人[じん]たちはアラム語[ご]で王[おう]に言[い]った。「王[おう]よ、永遠[えいえん]に生[い]きてください。どうか、王[おう]の夢[ゆめ]をしもべたちにお告[つ]げください。わたしたちがその解[と]き明[あ]かしを申[もう]し上[あ]げます。」"
  5: "王[おう]はカルデア人[じん]たちに答[こた]えて言[い]った。「わたしからは、その言葉[ことば]が去[さ]ってしまった。もしあなたがたが、わたしに夢[ゆめ]とその解[と]き明[あ]かしを告[つ]げなければ、あなたがたは滅[ほろ]ぼされ、あなたがたの家[いえ]は略奪[りゃくだつ]される。"
  6: "しかし、もしあなたがたがわたしに夢[ゆめ]とその解[と]き明[あ]かしを告[つ]げるなら、あなたがたはわたしからさまざまな贈[おく]り物[もの]と大[おお]きな栄誉[えいよ]を受[う]ける。だから、わたしに夢[ゆめ]とその解[と]き明[あ]かしを告[つ]げよ。」"
  7: "彼[かれ]らは二度目[にどめ]に答[こた]えて言[い]った。「王[おう]よ、どうか夢[ゆめ]をしもべたちにお告[つ]げください。わたしたちがその解[と]き明[あ]かしを申[もう]し上[あ]げます。」"
  8: "王[おう]は答[こた]えて言[い]った。「あなたがたが時間[じかん]を稼[かせ]いでいることを、わたしは確[たし]かに知[し]っている。わたしからその言葉[ことば]が去[さ]ってしまったのを、あなたがたは見[み]ているからだ。それゆえ、わたしが命[めい]じたとおりになる。"
  9: "もしあなたがたが、わたしに夢[ゆめ]とその解[と]き明[あ]かしを告[つ]げなければ、あなたがたは死[し]ぬ。あなたがたが、時[とき]が過[す]ぎるまでわたしに偽[いつわ]りの言葉[ことば]を語[かた]ろうと共[とも]に謀[はか]ったことを、わたしは知[し]っている。だから今[いま]、わたしが夜[よる]に見[み]たことを告[つ]げよ。そうすれば、あなたがたがその解[と]き明[あ]かしをも告[つ]げられることを、わたしは知[し]ろう。」"
  10: "カルデア人[じん]たちは王[おう]の前[まえ]で答[こた]えて言[い]った。「地[ち]の上[うえ]には、王[おう]が求[もと]めておられることを告[つ]げられる者[もの]は一人[ひとり]もいません。どんな大[おお]きな王[おう]や君[きみ]も、このようなことを呪術師[じゅじゅつし]や魔術師[まじゅつし]、カルデア人[じん]に求[もと]めたことはありません。"
  11: "王[おう]よ、あなたが求[もと]めておられることは重[おも]く、また難[むずか]しいことです。これを王[おう]に告[つ]げられる者[もの]は、肉[にく]なる者[もの]とともには住[す]まない神[かみ]々[がみ]のほかに、一人[ひとり]もいません。それゆえ、あなたがお考[かんが]えのようなことが起[お]こることはありえません。」"
  12: "そこで王[おう]は激[はげ]しく怒[いか]り、大[おお]いに憤[いきどお]って、バビロニアのすべての賢[かしこ]い者[もの]たちを滅[ほろ]ぼすよう命[めい]じた。"
  13: "そこで、すべての者[もの]を殺[ころ]せという布告[ふこく]が出[で]され、賢[かしこ]い者[もの]たちは殺[ころ]されていった。ダニエルとその仲間[なかま]たちも、共[とも]に滅[ほろ]ぼすために捜[さが]し求[もと]められた。"
  14: "そのとき、ダニエルは、バビロニアの賢[かしこ]い者[もの]たちを引[ひ]き出[だ]して殺[ころ]すために王[おう]が任[にん]じた王[おう]の料理人[りょうりにん]の長[かしら]アリオクに、自分[じぶん]の考[かんが]えと助言[じょげん]を告[つ]げた。"
  15: "ダニエルは彼[かれ]に尋[たず]ねて言[い]った。「なぜ、王[おう]からこれほど厳[きび]しい命令[めいれい]が出[で]たのですか。」そこでアリオクは、その命令[めいれい]のことをダニエルに告[つ]げた。"
  16: "ダニエルは急[いそ]いで王[おう]のところへ入[はい]り、王[おう]に時間[じかん]を与[あた]えてくださるよう願[ねが]い、すべての解[と]き明[あ]かしを王[おう]の前[まえ]で告[つ]げると言[い]った。"
  17: "そこでダニエルは家[いえ]に帰[かえ]り、このことを同[おな]じ仲間[なかま]であるハナニヤ、ミシャエル、アザルヤに告[つ]げた。"
  18: "この奥秘[おうぎ]について天[てん]の神[かみ]に断食[だんじき]と祈[いの]りをもって憐[あわ]れみを求[もと]め、ダニエルとその仲間[なかま]たちが、バビロンのほかの賢[かしこ]い者[もの]たちとともに滅[ほろ]びに渡[わた]されないようにと願[ねが]うよう、彼[かれ]らに言[い]った。"
  19: "そこで、その夜[よる]、夢[ゆめ]の中[なか]で、王[おう]の奥秘[おうぎ]がダニエルに明[あき]らかに示[しめ]された。そしてダニエルは、天[てん]の神[かみ]をほめたたえた。"
  20: "そして言[い]った。「大[おお]いなる主[しゅ]の名[な]が、世[よ]々[よ]にほめたたえられますように。知恵[ちえ]と悟[さと]りと力[ちから]は、主[しゅ]のものであるからです。"
  21: "主[しゅ]は時[とき]と季節[きせつ]を変[か]え、王[おう]たちを立[た]て、また退[しりぞ]けます。主[しゅ]は賢[かしこ]い者[もの]に知恵[ちえ]を、知識[ちしき]のある者[もの]に悟[さと]りを与[あた]えます。"
  22: "主[しゅ]は深[ふか]いことと隠[かく]されたことを明[あき]らかにし、暗[やみ]の中[なか]にあるものと光[ひかり]の中[なか]にあるものを知[し]っておられます。光[ひかり]は主[しゅ]とともに住[す]みます。"
  23: "わが父祖[ふそ]の神[かみ]よ、あなたに感謝[かんしゃ]し、ほめたたえます。あなたはわたしに知恵[ちえ]と力[ちから]をお与[あた]えになり、今[いま]、わたしたちがあなたに願[ねが]ったことをわたしに示[しめ]して、王[おう]の見[み]たことまでも告[つ]げさせてくださいました。」"
  24: "そこでダニエルは、王[おう]がバビロニアのすべての賢[かしこ]い者[もの]たちを殺[ころ]すために任[にん]じたアリオクのところへ行[い]き、彼[かれ]に言[い]った。「バビロニアの賢[かしこ]い者[もの]たちを滅[ほろ]ぼさないでください。わたしを王[おう]のところへ連[つ]れて行[い]ってください。わたしがすべてのことを王[おう]に告[つ]げます。」"
  25: "そこでアリオクは急[いそ]いでダニエルを王[おう]のところへ連[つ]れて行[い]き、王[おう]に言[い]った。「ユダの子[こ]らの中[なか]の捕囚[ほしゅう]の者[もの]たちの中[なか]から、すべてのことを王[おう]に告[つ]げる賢[かしこ]い人[ひと]を見[み]つけました。」"
  26: "王[おう]は答[こた]えて、カルデア人[じん]の言葉[ことば]でバルタザルと呼[よ]ばれるダニエルに言[い]った。「わたしが見[み]た夢[ゆめ]と、その解[と]き明[あ]かしを、わたしに告[つ]げることができるか。」"
  27: "ダニエルは王[おう]の前[まえ]で答[こた]えて言[い]った。「王[おう]が求[もと]めておられる奥秘[おうぎ]を、賢[かしこ]い者[もの]も、魔術師[まじゅつし]も、呪術師[じゅじゅつし]も、占[うらな]い師[し]も、王[おう]に告[つ]げることはできません。"
  28: "しかし、天[てん]には奥秘[おうぎ]を明[あき]らかにされる神[かみ]がおられ、その方[かた]は、終[お]わりの日[ひ]に起[お]こるべきことを王[おう]ネブカドネツァルに示[しめ]されました。王[おう]よ、永遠[えいえん]に生[い]きてください。あなたが寝床[ねどこ]で見[み]た夢[ゆめ]と、あなたの頭[あたま]に現[あらわ]れた幻[まぼろし]は、こういうものです。"
  29: "王[おう]よ、あなたが寝床[ねどこ]に横[よこ]たわったとき、これから後[のち]に起[お]こるべきことが、あなたの思[おも]いの中[なか]に上[のぼ]って来[き]たのです。そして、奥秘[おうぎ]を明[あき]らかにされる方[かた]が、起[お]こるべきことをあなたに示[しめ]されたのです。"
  30: "この奥秘[おうぎ]がわたしに明[あき]らかにされたのは、わたしがすべての人[ひと]々[びと]よりも知恵[ちえ]があるからではありません。ただ、王[おう]にそのことを告[つ]げ、あなたが自分[じぶん]の心[こころ]の思[おも]いを知[し]るためなのです。"
  31: "王[おう]よ、あなたは見[み]ました。すると、一[ひと]つの像[ぞう]がありました。その像[ぞう]はひどく大[おお]きく、その姿[すがた]はきわめて高[たか]く、あなたの前[まえ]に立[た]っていました。その像[ぞう]の姿[すがた]は恐[おそ]ろしいものでした。"
  32: "その像[ぞう]の頭[あたま]は純[じゅん]金[きん]、両手[りょうて]と胸[むね]と肩[かた]は銀[ぎん]、腹[はら]と腿[もも]は青銅[せいどう]でした。"
  33: "すねは鉄[てつ]、足[あし]は一部[いちぶ]が鉄[てつ]、一部[いちぶ]が粘土[ねんど]でした。"
  34: "あなたは、山[やま]から、手[て]によらずに石[いし]が切[き]り出[だ]され、その石[いし]が像[ぞう]の鉄[てつ]と粘土[ねんど]の足[あし]を打[う]ち、これらを粉[こな]々[こな]に砕[くだ]くまでを見[み]ました。"
  35: "そのとき、粘土[ねんど]と鉄[てつ]と青銅[せいどう]と銀[ぎん]と金[きん]は一[ひと]つに砕[くだ]けて、夏[なつ]の脱穀場[だっこくじょう]の籾殻[もみがら]のようになり、風[かぜ]がそれを吹[ふ]き払[はら]って、跡形[あとかた]も残[のこ]らなかった。ところが、像[ぞう]を打[う]ったその石[いし]は大[おお]きな山[やま]となり、全地[ぜんち]に満[み]ちた。"
  36: "これがその夢[ゆめ]です。わたしたちは王[おう]の前[まえ]で、その解[と]き明[あ]かしを申[もう]し上[あ]げます。"
  37: "王[おう]よ、あなたは王[おう]の王[おう]です。天[てん]の主[しゅ]はあなたに、支配[しはい]と王国[おうこく]と力[ちから]と栄誉[えいよ]と栄光[えいこう]をお与[あた]えになりました。"
  38: "人[ひと]の子[こ]らが住[す]むすべての所[ところ]、野[の]の獣[けもの]、空[そら]の鳥[とり]、海[うみ]の魚[さかな]までも、主[しゅ]はあなたの手[て]に渡[わた]して、あなたをすべてのものの上[うえ]に立[た]つ支配者[しはいしゃ]とされました。あなたが、あの金[きん]の頭[あたま]です。"
  39: "あなたの後[のち]に、あなたより小[ちい]さい別[べつ]の王国[おうこく]、すなわち銀[ぎん]が起[お]こります。さらに第三[だいさん]の王国[おうこく]、すなわち青銅[せいどう]が起[お]こり、全地[ぜんち]を支配[しはい]します。"
  40: "第四[だいし]の王国[おうこく]は鉄[てつ]のように強[つよ]く、鉄[てつ]がすべてを砕[くだ]き、すべての木[き]を切[き]り倒[たお]すように、その王国[おうこく]もすべてを砕[くだ]いて滅[ほろ]ぼします。そして、全地[ぜんち]は震[ふる]え動[うご]きます。"
  41: "あなたが、その足[あし]と指[ゆび]が一部[いちぶ]は粘土[ねんど]、一部[いちぶ]は鉄[てつ]であったのを見[み]たとおり、その王国[おうこく]は二[ふた]つに分[わ]かれます。しかし、あなたが鉄[てつ]と粘土[ねんど]が混[ま]じっているのを見[み]たように、その中[なか]に鉄[てつ]の根[ね]が残[のこ]ります。"
  42: "足[あし]の指[ゆび]が一部[いちぶ]は鉄[てつ]、一部[いちぶ]は粘土[ねんど]であったように、その王国[おうこく]の一部[いちぶ]は強[つよ]く、一部[いちぶ]は砕[くだ]かれます。"
  43: "あなたが鉄[てつ]が粘土[ねんど]と混[ま]じっているのを見[み]たように、彼[かれ]らは人[ひと]の血筋[ちすじ]によって混[ま]じり合[あ]います。しかし、鉄[てつ]と粘土[ねんど]が溶[と]け合[あ]わないように、彼[かれ]らは心[こころ]を合[あ]わせることも、互[たが]いに好意[こうい]を抱[いだ]くこともありません。"
  44: "それらの王[おう]たちの時代[じだい]に、天[てん]の神[かみ]は一[ひと]つの王国[おうこく]を起[お]こされます。それは永遠[えいえん]に滅[ほろ]びず、ほかの民[たみ]に渡[わた]されることもありません。そして、これらの王国[おうこく]をすべて打[う]ち砕[くだ]き、滅[ほろ]ぼし、それ自身[じしん]は永遠[えいえん]に立[た]ち続[つづ]けます。"
  45: "あなたが、石[いし]が手[て]によらずに山[やま]から切[き]り出[だ]され、粘土[ねんど]、鉄[てつ]、青銅[せいどう]、銀[ぎん]、金[きん]を砕[くだ]いたのを見[み]たとおりです。大[おお]いなる神[かみ]は、これから後[のち]に起[お]こるべきことを王[おう]に示[しめ]されました。この夢[ゆめ]は確[たし]かであり、その解[と]き明[あ]かしも確[たし]かです。」"
  46: "そこで、王[おう]ネブカドネツァルは地[ち]に伏[ふ]してダニエルを拝[おが]み、彼[かれ]に供[そな]え物[もの]と香[こう]をささげるよう命[めい]じた。"
  47: "王[おう]はダニエルに言[い]った。「まことに、あなたがたの神[かみ]は神[かみ]々[がみ]の神[かみ]、主[しゅ]の主[しゅ]、王[おう]の王[おう]、隠[かく]された奥秘[おうぎ]をただ一人[ひとり]で明[あき]らかにされる方[かた]である。あなたがこの奥秘[おうぎ]を明[あき]らかにできたからだ。」"
  48: "そこで王[おう]ネブカドネツァルはダニエルを大[おお]きくし、多[おお]くの大[おお]きな贈[おく]り物[もの]を与[あた]えて、バビロニアの全土[ぜんど]の事[こと]を司[つかさど]らせ、バビロニアのすべての賢[かしこ]い者[もの]たちの長[かしら]、また君[きみ]とした。"
  49: "ダニエルは王[おう]に願[ねが]って、シャデラク、メシャク、アベド・ネゴをバビロニアの事[こと]がらの上[うえ]に立[た]てさせた。ダニエルは王[おう]の宮廷[きゅうてい]にいた。"

notes:
  1: "ἐν τῷ ἔτει τῷ δευτέρῳ τῆς βασιλείας Ναβουχοδονοσορ — «во второй год царства Навуходоносора»; συνέβη εἰς ὁράματα καὶ ἐνύπνια ἐμπεσεῖν τὸν βασιλέα — «случилось царю впасть в видения и сны» (ἐμπίπτω — впадать); ταραχθῆναι ἐν τῷ ἐνυπνίῳ αὐτοῦ — «смутиться от сна своего» (ταράσσω); ὁ ὕπνος αὐτοῦ ἐγένετο ἀπ' αὐτοῦ — «сон его отошёл от него». Слав. «соние виде навуходоносор, и ужасеся дух его»."
  2: "τοὺς ἐπαοιδοὺς καὶ τοὺς μάγους καὶ τοὺς φαρμακοὺς τῶν Χαλδαίων — «заклинателей, волхвов и чародеев Халдеев»: ἐπαοιδοί — 呪術師, μάγοι — 魔術師, φάρμακοι — 呪詛師 (в Исх 7:11 у φαρμακοί стоит 呪術師; здесь список разведён, чтобы три слова читались по-разному); ἀναγγεῖλαι τῷ βασιλεῖ τὰ ἐνύπνια αὐτοῦ — «возвестить царю сны его»; παραγενόμενοι ἔστησαν παρὰ τῷ βασιλεῖ — «придя, стали перед царём»."
  3: "Ἐνύπνιον ἑώρακα — «сон я видел»; ἐκινήθη μου τὸ πνεῦμα — «подвигся дух мой» (κινέω — двигать, возмущать); ἐπιγνῶναι οὖν θέλω τὸ ἐνύπνιον — «уразуметь потому хочу сон». Слав. «видех сон, и ужасеся дух мой, еже уразумети сон»."
  4: "Συριστί — «по-сирийски», то есть по-арамейски (アラム語 — новый термин, в корпусе не встречался); Κύριε βασιλεῦ, τὸν αἰῶνα ζῆθι — «господин царь, в век живи» (придворная формула); ἀνάγγειλον τὸ ἐνύπνιόν σου τοῖς παισί σου — «возвести сон твой рабам твоим»; ἡμεῖς σοι φράσομεν τὴν σύγκρισιν αὐτοῦ — «мы тебе скажем толкование его» (σύγκρισις — сличение, толкование, 解き明かし)."
  5: "Ἐὰν μὴ ἀπαγγείλητέ μοι ἐπ' ἀληθείας — «если не возвестите мне поистине»; παραδειγματισθήσεσθε — «будете опозорены (наказаны)» (παραδειγματίζω — выставлять на позор); ἀναληφθήσεται ὑμῶν τὰ ὑπάρχοντα εἰς τὸ βασιλικόν — «взято будет имущество ваше в царскую казну»; слав. «слово отступило есть от мене... в пагубу будете, и домове ваши разграбятся» (по МТ) — внесено (言葉が去った, 滅ぼされ, 略奪)."
  6: "λήψεσθε δόματα παντοῖα — «получите дары всякие»; δοξασθησόμενοι ὑπ' ἐμοῦ — «и будете прославлены мною»; δηλώσατέ μοι τὸ ἐνύπνιον καὶ κρίνατε — «возвестите мне сон и рассудите» (κρίνατε — судите; слав. «сказание», как если бы стояло σύγκρισιν, — расхождение отмечено)."
  7: "ἀπεκρίθησαν δὲ ἐκ δευτέρου — «отвечали во второй раз»; τὸ ὅραμα εἰπόν — «скажи видение» (ὅραμα — 幻; слав. «да повесть сон»); οἱ παῖδές σου κρινοῦσι πρὸς ταῦτα — «рабы твои рассудят об этом»."
  8: "καιρὸν ὑμεῖς ἐξαγοράζετε — «вы выкупаете (тянете) время» (ἐξαγοράζω, ср. Еф 5:16); καθάπερ ἑωράκατε ὅτι ἀπέστη ἀπ' ἐμοῦ τὸ πρᾶγμα — «как видели, что отошло от меня дело» (πρᾶγμα — дело, 言葉 по слав.); καθάπερ οὖν προστέταχα, οὕτως ἔσται — «итак, как я повелел, так и будет» (есть в LXX, у слав. нет — оставлено)."
  9: "θανάτῳ περιπεσεῖσθε — «смерти подпадёте» (περιπίπτω — впадать); συνείπασθε γὰρ λόγους ψευδεῖς ποιήσασθαι ἐπ' ἐμοῦ — «ибо вы сговорились солгать предо мною» (συνεῖπον — сговориться); ἕως ἂν ὁ καιρὸς ἀλλοιωθῇ — «пока не изменится время»; ἐὰν τὸ ῥῆμα εἴπητέ μοι, ὃ τὴν νύκτα ἑώρακα — «если скажете мне слово, которое я видел ночью»; γνώσομαι ὅτι καὶ τὴν τούτου κρίσιν δηλώσετε — «узнаю, что и толкование его возвестите». Слав. «вем, яко слово ложно и растленно совещастеся рещи»."
  10: "Οὐδεὶς τῶν ἐπὶ τῆς γῆς δυνήσεται εἰπεῖν τῷ βασιλεῖ ὃ ἑώρακε — «никто из сущих на земле не сможет сказать царю, что он видел»; καθάπερ σὺ ἐρωτᾷς — «как ты спрашиваешь»; πᾶς βασιλεὺς καὶ πᾶς δυνάστης τοιοῦτο πρᾶγμα οὐκ ἐπερωτᾷ — «всякий царь и всякий властелин такого дела не требует» (δυνάστης — властелин, 君); πάντα σοφὸν καὶ μάγον καὶ Χαλδαῖον — «у всякого мудреца, волхва и Халдея»."
  11: "ὁ λόγος ... βαρύς ἐστι καὶ ἐπίδοξος — «слово... тяжело и славно (трудное и великое)» (ἐπίδοξος — славный); οὐδείς ἐστιν, ὃς δηλώσει ταῦτα τῷ βασιλεῖ, εἰ μήτι ἄγγελος, οὗ οὐκ ἔστι κατοικητήριον μετὰ πάσης σαρκός — «никто не возвестит этого царю, разве только ангел, у которого нет обитания со всякой плотью»; слав. «но точию бози, ихже несть житие со всякою плотию» (по МТ) — в тексте 神々, у LXX ἄγγελος, вариант отмечен; ὅθεν οὐκ ἐνδέχεται γενέσθαι καθάπερ οἴει — «потому невозможно быть, как ты думаешь»."
  12: "στυγνὸς γενόμενος καὶ περίλυπος — «став мрачным и весьма опечаленным» (στυγνός — мрачный; περίλυπος — сильно опечаленный); προσέταξεν ἐξαγαγεῖν πάντας τοὺς σοφοὺς τῆς Βαβυλωνίας — «повелел вывести всех мудрецов Вавилонии» (ἐξάγω — выводить, здесь на казнь); Βαβυλωνία — область, а не город, поэтому バビロニア (ср. 3:97), тогда как в 2:18 город Βαβυλών — バビロン; слав. «в ярости и во гневе мнозе рече погубити» (по МТ) — внесено (激しく怒り, 憤って)."
  13: "ἐδογματίσθη πάντας ἀποκτεῖναι — «постановлено было всех убить» (δογματίζω — постановлять); ἐζητήθη δὲ ὁ Δανιηλ καὶ πάντες οἱ μετ' αὐτοῦ χάριν τοῦ συναπολέσθαι — «искали же Даниила и всех бывших с ним, чтобы погибнуть вместе» (συναπόλλυμι). Слав. «изыде повеление, и мудрии убивахуся» — внесено."
  14: "βουλὴν καὶ γνώμην, ἣν εἶχεν — «совет и мнение, какое имел» (γνώμη — мысль, решение); τῷ ἀρχιμαγείρῳ τοῦ βασιλέως — «царскому архимагиру» (ἀρχιμάγειρος — придворный титул, букв. «начальник поваров»); ᾧ προσέταξεν ἐξαγαγεῖν — «которому повелел вывести». Слав. «ариоху архимагиру царску» — титул передан по смыслу (料理人の長), как в Быт 41."
  15: "Περὶ τίνος δογματίζεται πικρῶς παρὰ τοῦ βασιλέως — «о чём так горько (сурово) повелевается от царя» (πικρῶς — горько, сурово); слав. «о чесом изыде изречение безстудное от лица царева» (по МТ: «дерзкое») — в тексте 厳しい, слав. вариант отмечен; τὸ πρόσταγμα ἐσήμανεν ὁ Αριώχης τῷ Δανιηλ — «повеление объявил Ариох Даниилу» (σημαίνω — объявлять)."
  16: "εἰσῆλθε ταχέως πρὸς τὸν βασιλέα — «вошёл быстро к царю» (ταχέως у слав. опущено); ἠξίωσεν ἵνα δοθῇ αὐτῷ χρόνος παρὰ τοῦ βασιλέως — «просил, чтобы дан был ему срок от царя»; καὶ δηλώσῃ πάντα ἐπὶ τοῦ βασιλέως — «и объявит всё пред царём»."
  17: "ἀπελθὼν ... εἰς τὸν οἶκον αὐτοῦ — «уйдя в дом свой»; τοῖς συνεταίροις — «товарищам» (συνεταῖρος — сотоварищ, 仲間); ὑπέδειξε πάντα — «показал всё» (ὑποδείκνυμι — показывать). Слав. порядок имён: анании, азарии и мисаилу."
  18: "παρήγγειλε νηστείαν καὶ δέησιν καὶ τιμωρίαν ζητῆσαι παρὰ τοῦ κυρίου τοῦ ὑψίστου — «велел искать у Господа Всевышнего поста, моления и заступления» (τιμωρία — здесь скорее «заступление, помощь», чем «кара»); περὶ τοῦ μυστηρίου τούτου — «об этой тайне» (μυστήριον — 奥秘); ὅπως μὴ ἐκδοθῶσι ... εἰς ἀπώλειαν — «чтобы не преданы были... на погибель» (ἐκδίδωμι — выдавать); ἅμα τοῖς σοφισταῖς Βαβυλῶνος — «вместе с мудрецами Вавилона». Слав. «и щедрот прошаху у Бога небеснаго» — внесено (天の神, 憐れみ); слав. опускает пост."
  19: "ἐν ὁράματι ἐν αὐτῇ τῇ νυκτί — «в видении в ту самую ночь» (ὅραμα — 幻); τὸ μυστήριον ... ἐξεφάνθη εὐσήμως — «тайна... открылась явно» (εὐσήμως — внятно, ясно); εὐλόγησε τὸν κύριον τὸν ὕψιστον — «благословил Господа Всевышнего»; слав. «во сне нощию... Бога небеснаго» (по МТ) — в тексте 夢, 天の神, вариант LXX отмечен."
  20: "Ἔσται τὸ ὄνομα τοῦ κυρίου τοῦ μεγάλου εὐλογημένον εἰς τὸν αἰῶνα — «да будет имя Господа великого благословенно в век»; ὅτι ἡ σοφία καὶ ἡ μεγαλωσύνη αὐτοῦ ἐστι — «ибо Его премудрость и величие»; слав. «премудрость и смысл и крепость его есть» (три члена, по МТ) — внесено (知恵・悟り・力), у LXX два."
  21: "αὐτὸς ἀλλοιοῖ καιροὺς καὶ χρόνους — «Он изменяет времена и сроки» (ἀλλοιόω); μεθιστῶν βασιλεῖς καὶ καθιστῶν — «низлагая царей и поставляя» (μεθίστημι — перемещать, низлагать); διδοὺς σοφοῖς σοφίαν καὶ σύνεσιν τοῖς ἐν ἐπιστήμῃ οὖσιν — «дающий мудрым премудрость и разумение сведущим». Слав. «пременяет времена и лета... даяй премудрость мудрым и разум ведущым смышление»."
  22: "ἀνακαλύπτων τὰ βαθέα καὶ σκοτεινά — «открывающий глубокое и тёмное» (ἀνακαλύπτω — снимать покров); γινώσκων τὰ ἐν τῷ σκότει καὶ τὰ ἐν τῷ φωτί — «знающий, что во тьме и что во свете»; καὶ παρ' αὐτῷ κατάλυσις — «и у Него обитание (пристанище)» (κατάλυσις — жилище); слав. «свет с ним есть» (по МТ) — в тексте 光は主とともに住む, κατάλυσις отмечено."
  23: "σοί, κύριε τῶν πατέρων μου, ἐξομολογοῦμαι καὶ αἰνῶ — «Тебе, Господи отцов моих, исповедуюсь и хвалю» (ἐξομολογέομαι — благодарить, исповедовать); σοφίαν καὶ φρόνησιν ἔδωκάς μοι — «премудрость и разумение дал мне»; ἐσήμανάς μοι ὅσα ἠξίωσα τοῦ δηλῶσαι τῷ βασιλεῖ — «объявил мне, о чём я просил возвестить царю»; слав. «Боже отцев моих... и видение царево возвестил ми еси» — внесено (王の見たこと)."
  24: "εἰσελθὼν ... πρὸς τὸν Αριωχ τὸν κατασταθέντα ὑπὸ τοῦ βασιλέως ἀποκτεῖναι πάντας τοὺς σοφιστάς — «войдя к Ариоху, поставленному царём убить всех мудрецов»; μὴ ἀπολέσῃς — «не погуби»; εἰσάγαγε δέ με πρὸς τὸν βασιλέα, καὶ ἕκαστα τῷ βασιλεῖ δηλώσω — «введи же меня к царю, и каждое царю объявлю»."
  25: "κατὰ σπουδήν — «с поспешностью» (σπουδή — рвение, спешка); ἐκ τῆς αἰχμαλωσίας τῶν υἱῶν τῆς Ιουδαίας — «из плена сынов Иудеи» (αἰχμαλωσία — плен); ὃς τῷ βασιλεῖ δηλώσει ἕκαστα — «который царю объявит всё»."
  26: "ἐπικαλουμένῳ δὲ Χαλδαιστὶ Βαλτασαρ — «называемому по-халдейски Валтасар»; слав. «емуже имя валтасар» — без «по-халдейски»; Δυνήσῃ δηλῶσαί μοι τὸ ὅραμα, ὃ εἶδον — «можешь ли объявить мне видение, которое я видел»; в тексте 夢 по слав., у LXX ὅραμα — 幻."
  27: "Τὸ μυστήριον ... οὐκ ἔστι σοφῶν καὶ φαρμακῶν καὶ ἐπαοιδῶν καὶ γαζαρηνῶν ἡ δήλωσις — «тайны... не мудрецов, ни чародеев, ни заклинателей, ни газаринов объявление»; γαζαρηνοί — тёмное слово (передают «сокровищники», «звездочёты»), в тексте 占い師 с оговоркой; слав. «несть мудрых, волхвов, ниже обаятелей газаринов (сила)»."
  28: "ἀλλ' ἔστι θεὸς ἐν οὐρανῷ ἀνακαλύπτων μυστήρια — «но есть Бог на небе, открывающий тайны»; ὃς ἐδήλωσε τῷ βασιλεῖ ... ἃ δεῖ γενέσθαι ἐπ' ἐσχάτων τῶν ἡμερῶν — «который объявил царю, чему надлежит быть в последние дни»; βασιλεῦ, εἰς τὸν αἰῶνα ζῆθι — «царь, в век живи»; τὸ ἐνύπνιον καὶ τὸ ὅραμα τῆς κεφαλῆς σου ἐπὶ τῆς κοίτης σου — «сон и видение головы твоей на ложе твоём»."
  29: "κατακλιθεὶς ἐπὶ τῆς κοίτης σου ἑώρακας πάντα — «возлёгши на ложе твоём, видел всё»; слав. «помышления твоя на ложи твоем взыдоша» (по МТ) — в тексте 思いが上って来た, у LXX «видел»; ὁ ἀνακαλύπτων μυστήρια ἐδήλωσέ σοι ἃ δεῖ γενέσθαι — «Открывающий тайны объявил тебе, чему надлежит быть»."
  30: "κἀμοὶ δὲ οὐ παρὰ τὴν σοφίαν τὴν οὖσαν ἐν ἐμοὶ ὑπὲρ πάντας τοὺς ἀνθρώπους — «и мне не по премудрости, сущей во мне, более всех людей»; ἀλλ' ἕνεκεν τοῦ δηλωθῆναι τῷ βασιλεῖ — «но ради того, чтобы объявлено было царю»; ἐσημάνθη μοι ἃ ὑπέλαβες τῇ καρδίᾳ σου ἐν γνώσει — «объявлено мне, что ты принял в сердце твоём в знании» (ὑπολαμβάνω — принимать, думать)."
  31: "καὶ ἰδοὺ εἰκὼν μία — «и вот, образ один» (εἰκών — 像; слав. ниже называет его «тело»); ἡ πρόσοψις αὐτῆς ὑπερφερὴς ἑστήκει ἐναντίον σου — «вид его выдающийся стоял пред тобою» (πρόσοψις — вид, лицевая сторона; ὑπερφερής — превосходящий); ἡ πρόσοψις τῆς εἰκόνος φοβερά — «вид образа страшен»."
  32: "ἡ κεφαλὴ αὐτῆς ἀπὸ χρυσίου χρηστοῦ — «голова его из золота чистого» (χρηστός — хороший, чистый); τὸ στῆθος καὶ οἱ βραχίονες ἀργυροῖ — «грудь и мышцы серебряные»; ἡ κοιλία καὶ οἱ μηροὶ χαλκοῖ — «чрево и бёдра медные»; слав. добавляет «руце» (руки) — внесено (両手), у LXX только грудь и мышцы."
  33: "τὰ δὲ σκέλη σιδηρᾶ — «голени железные»; οἱ πόδες μέρος μέν τι σιδήρου, μέρος δέ τι ὀστράκινον — «ноги частью из железа, частью глиняные» (ὀστράκινον — черепковое, глиняное, 粘土)."
  34: "ἑώρακας ἕως ὅτου ἐτμήθη λίθος ἐξ ὄρους ἄνευ χειρῶν — «ты видел, доколе не отсечён был камень от горы без рук» (τέμνω — резать, отсекать); ἐπάταξε τὴν εἰκόνα ἐπὶ τοὺς πόδας — «ударил образ в ноги»; κατήλεσεν αὐτά — «размолол их» (καταλέω — размалывать, сокрушать). Слав. «и истни их до конца»."
  35: "ἐγένετο ὡσεὶ λεπτότερον ἀχύρου ἐν ἅλωνι — «стало как мельче мякины на гумне» (ἄχυρον — мякина, 籾殻; ἅλων — гумно, 脱穀場); ἐρρίπισεν αὐτὰ ὁ ἄνεμος — «развеял их ветер» (ῥιπίζω — развевать); ὥστε μηδὲν καταλειφθῆναι ἐξ αὐτῶν — «так что ничего не осталось от них»; ὁ λίθος ... ἐγένετο ὄρος μέγα καὶ ἐπάταξε πᾶσαν τὴν γῆν — «камень... стал горою великою и наполнил всю землю» (у LXX ἐπάταξε — «поразил», у слав. «наполни»)."
  36: "τοῦτο τὸ ὅραμα — «вот видение (сон)»; τὴν κρίσιν δὲ ἐροῦμεν ἐπὶ τοῦ βασιλέως — «и толкование скажем пред царём» (κρίσις — суд, здесь толкование)."
  37: "σύ, βασιλεῦ βασιλεὺς βασιλέων — «ты, царь, царь царей»; ὁ κύριος τοῦ οὐρανοῦ τὴν ἀρχὴν καὶ τὴν βασιλείαν καὶ τὴν ἰσχὺν καὶ τὴν τιμὴν καὶ τὴν δόξαν ἔδωκεν — «Господь небесный власть, царство, силу, честь и славу дал» (пять членов); слав. «царство даде крепко и державно и честно» — три определения; в тексте держим LXX."
  38: "ἐν πάσῃ τῇ οἰκουμένῃ ἀπὸ ἀνθρώπων καὶ θηρίων ἀγρίων καὶ πετεινῶν οὐρανοῦ καὶ τῶν ἰχθύων τῆς θαλάσσης — «во всей вселенной: от людей, зверей полевых, птиц небесных и рыб морских»; παρέδωκεν ὑπὸ τὰς χεῖράς σου κυριεύειν πάντων — «предал под руки твои властвовать над всеми» (κυριεύω); σὺ εἶ ἡ κεφαλὴ ἡ χρυσῆ — «ты — глава золотая»."
  39: "βασιλεία ἐλάττων σου — «царство меньше тебя»; τρίτη βασιλεία ἄλλη χαλκῆ — «третье царство иное, медное»; ἣ κυριεύσει πάσης τῆς γῆς — «которое будет властвовать над всей землёй»; слав. «другое меншее тебе, еже есть сребро... еже есть медь» — пояснение металлов внесено (銀, 青銅)."
  40: "βασιλεία τετάρτη ἰσχυρά — «царство четвёртое, крепкое»; ὁ δαμάζων πάντα καὶ πᾶν δένδρον ἐκκόπτων — «покоряющий всё и всякое дерево ссекающий» (δαμάζω — укрощать, покорять; ἐκκόπτω — вырубать); σεισθήσεται πᾶσα ἡ γῆ — «потрясётся вся земля»; слав. «якоже железо стончевает и умягчает вся... истончит и истнит вся» — внесено (砕く, 滅ぼす), чтение LXX (全地は震え動く) в тексте."
  41: "τοὺς πόδας αὐτῆς μέρος μέν τι ὀστράκου κεραμικοῦ — «ноги его частью из глины горшечной» (ὄστρακον κεραμικόν — черепок горшечный); βασιλεία ἄλλη διμερὴς ἔσται ἐν αὐτῇ — «царство иное, из двух частей будет в нём» (διμερής); слав. добавляет «и персты» и «от корене железна будет в нем» (по МТ) — внесено (指, 鉄の根)."
  42: "οἱ δάκτυλοι τῶν ποδῶν μέρος μέν τι σιδηροῦν — «пальцы ног частью железные»; μέρος τι τῆς βασιλείας ἔσται ἰσχυρὸν καὶ μέρος τι ἔσται συντετριμμένον — «часть царства будет крепка, часть будет сокрушена» (συντρίβω — сокрушать). Слав. «и от него будет сокрушена»."
  43: "συμμειγεῖς ἔσονται εἰς γένεσιν ἀνθρώπων — «смешаны будут через род человеческий» (συμμείγνυμι — смешивать; γένεσις — род, происхождение); οὐκ ἔσονται δὲ ὁμονοοῦντες οὔτε εὐνοοῦντες ἀλλήλοις — «но не будут единомысленны и не будут благоволить друг другу» (ὁμονοέω, εὐνοέω); ὥσπερ οὐδὲ ὁ σίδηρος δύναται συγκραθῆναι τῷ ὀστράκῳ — «как и железо не может смешаться с глиной» (συγκράω — сливать)."
  44: "στήσει ὁ θεὸς τοῦ οὐρανοῦ βασιλείαν ἄλλην — «поставит Бог небесный царство иное»; ἥτις ἔσται εἰς τοὺς αἰῶνας καὶ οὐ φθαρήσεται — «которое будет в век и не разрушится» (φθείρω — разрушать); ἄλλο ἔθνος οὐ μὴ ἐάσῃ — «иному народу не оставит» (ἐάω — оставлять); πατάξει δὲ καὶ ἀφανίσει τὰς βασιλείας ταύτας — «поразит и истребит царства эти» (ἀφανίζω — уничтожать)."
  45: "καθάπερ ἑώρακας ἐξ ὄρους τμηθῆναι λίθον ἄνευ χειρῶν — «как ты видел, что от горы отсечён камень без рук»; συνηλόησε τὸ ὄστρακον, τὸν σίδηρον... — «размолол глину, железо, медь, серебро, золото» (συναλοάω — размалывать); ὁ θεὸς ὁ μέγας ἐσήμανε τῷ βασιλεῖ τὰ ἐσόμενα — «Бог великий объявил царю имеющее быть»; ἀκριβὲς τὸ ὅραμα, καὶ πιστὴ ἡ τούτου κρίσις — «точно видение и верно толкование его»."
  46: "πεσὼν ἐπὶ πρόσωπον χαμαὶ προσεκύνησε τῷ Δανιηλ — «пав на лицо на землю, поклонился Даниилу» (προσκυνέω — поклоняться); ἐπέταξε θυσίας καὶ σπονδὰς ποιῆσαι αὐτῷ — «повелел жертвы и возлияния совершить ему» (θυσία — 犠牲; σπονδή — возлияние); слав. «рече дары и благовония возлияти ему» (по МТ) — в тексте 供え物と香, вариант LXX отмечен."
  47: "Ἐπ' ἀληθείας ἐστὶν ὁ θεὸς ὑμῶν θεὸς τῶν θεῶν καὶ κύριος τῶν βασιλέων — «воистину Бог ваш есть Бог богов и Господь царей»; ὁ ἐκφαίνων μυστήρια κρυπτὰ μόνος — «являющий тайны сокровенные один» (ἐκφαίνω — выявлять); слав. добавляет «Царь царей» (по МТ) — внесено (王の王); ὅτι ἐδυνάσθης δηλῶσαι — «ибо ты смог объявить»."
  48: "Δανιηλ μεγαλύνας — «Даниила возвеличив» (μεγαλύνω — возвеличивать); δοὺς δωρεὰς μεγάλας καὶ πολλάς — «дав дары великие и многие»; κατέστησεν ἐπὶ τῶν πραγμάτων τῆς Βαβυλωνίας — «поставил над делами Вавилонии»; ἀπέδειξεν αὐτὸν ἄρχοντα καὶ ἡγούμενον πάντων τῶν σοφιστῶν — «поставил его начальником и вождём всех мудрецов» (ἡγούμενος — вождь, 君). Слав. «и князя воеводам» — внесено."
  49: "ἠξίωσε τὸν βασιλέα ἵνα κατασταθῶσιν ἐπὶ τῶν πραγμάτων τῆς Βαβυλωνίας — «просил царя, чтобы поставлены были над делами Вавилонии»; Σεδραχ, Μισαχ, Αβδεναγω — シャデラク、メシャク、アベド・ネゴ; ἦν ἐν τῇ βασιλικῇ αὐλῇ — «был при царском дворе» (αὐλή — двор, 宮廷)."
