# jp-box, Даниил, глава 2. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 2; стихов 49,
# наш 2:1–49 = gr 2:1–49, стих в стих («точек» в главе нет).
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Повествование — だ・である; речь к царю, молитва и благодарение — です・ます.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX), формы — по корпусу.
#
# Содержание: 1–2 сон царя и созыв мудрецов; 3–4 требование и ответ Халдеев;
# 5–6 угроза и награда; 7–9 второе требование, «выкупаете время»; 10–11 «никто
# из людей не может»; 12–13 указ истребить мудрецов; 14–16 Даниил у Ариоха,
# просит время; 17–18 молитва с друзьями; 19–23 ночное откровение и благодарение;
# 24–25 Даниил перед царем; 26–28 «Бог на небесах открывает тайны»; 29–30 «не по
# моей мудрости»; 31–35 истукан и камень; 36–45 толкование: золото, серебро, медь,
# железо и глина, камень-гора; 46–49 царь поклоняется, «Бог богов», возвышение.
# Голоса: 2:4 「…」 (Халдеи, закрывается в стихе); 5–6 「…» (царь); 7 「…» (Халдеи);
# 8–9 「…» (царь); 10–11 「…» (Халдеи); 15 「…» (Даниил, вопрос); 20–23 「…»
# (благодарение Даниила); 24 「…» (Даниил Ариоху); 25 「…» (Ариох царю);
# 26 「…» (царь); 27–45 「…» (одна речь Даниила пред царем); 47 「…» (царь).
# Формулы «и сказал царь», «Даниил отвечал» — вне кавычек.
# Термины: μυστήριον — 奥秘[おうぎ]; σύγκρισις/κρίσις — 解[と]き明[あ]かし;
# ἐνύπνιον — 夢[ゆめ], ὅραμα — 幻[まぼろし] (у слав. часто «сон» — отмечено);
# εἰκών — 像[ぞう] (слав. «тело»); βασιλεία — 王国[おうこく]; χαλκός — 青銅[せいどう],
# как в 2 Пар 2:29; ὄστρακον/πηλός/σκεῦος — 粘土[ねんど]; ἄχυρον/ἅλων — 籾殻[もみがら]/
# 脱穀場[だっこくじょう]; ἀρχιμάγειρος — 料理人[りょうりにん]の長[かしら] (ср. Быт 41).
# Список мудрецов разведён тремя словами: ἐπαοιδοί — 呪術師[じゅじゅつし],
# μάγοι — 魔術師[まじゅつし], φάρμακοι — 呪詛師[じゅそし] (новое слово),
# γαζαρηνοί — 占[うらな]い師[し] (тёмное слово, оговорено в notes к 27).
# Новый термин: アラム語[ご] — Συριστί. Прочие имена по корпусу: ネブカドネツァル,
# ダニエル, バルタザル, ハナニヤ, ミシャエル, アザルヤ, シャデラク, メシャク,
# アベド・ネゴ, アリオク, カルデア人[じん], バビロン.
# jp-ni не использовался.
#
