chapter: 17
draft: true

verses:
  1: "「あなたの神[かみ]である主[しゅ]に、傷[きず]のある牛[うし]や羊[ひつじ]、すなわちすべて悪[わる]いことのあるものを犠牲[ぎせい]として献[ささ]げてはならない。それはあなたの神である主にとって忌[い]むべきものだからである。"
  2: "もし、あなたの神[かみ]である主[しゅ]があなたに与[あた]えるあなたの町々[まちまち]の一[ひと]つで、男[おとこ]または女[おんな]が、あなたの神である主の前[まえ]に悪[わる]を行[おこな]い、その契約[けいやく]を破[やぶ]って、"
  3: "行[い]ってほかの神々[かみがみ]に仕[つか]え、それらにひれ伏[ふ]し、主[しゅ]が命[めい]じなかった太陽[たいよう]や月[つき]、天[てん]の万象[ばんしょう]のいずれかに仕[つか]えたなら、"
  4: "その知[し]らせがあなたに届[とど]き、あなたがよく調[しら]べたとき、見[み]よ、そのことは確[たし]かに起[お]こって、この忌[い]むべきことがイスラエルで行[おこな]われているなら、"
  5: "あなたはその男[おとこ]、またはその女[おんな]を引[ひ]き出[だ]して、石[いし]で打[う]って殺[ころ]しなさい。彼[かれ]らは死[し]ぬ。"
  6: "死[し]ぬべき者[もの]は、二[ふた]人[り]の証人[しょうにん]、または三人[さんにん]の証人[しょうにん]の言葉[ことば]によって死[し]ぬ。一[ひと]人[り]の証人[しょうにん]によって死ぬことはない。"
  7: "証人[しょうにん]たちがまず彼[かれ]に手[て]を下[くだ]して殺[ころ]し、その後[のち]に民[たみ]すべてが手を下す。こうしてあなたは、あなたがたの間[あいだ]から悪[わる]い者[もの]を除[のぞ]き去[さ]らなければならない。"
  8: "もしあなたのもとで、血[ち]と血、裁[さば]きと裁き、打[う]ち傷[きず]と打ち傷、争[あらそ]いと争いの間[あいだ]の裁きの事[こと]で判断[はんだん]がつかなくなったなら、あなたは立[た]ち上[あ]がって、あなたの神[かみ]である主[しゅ]が御名[みな]を呼[よ]ばれるために選[えら]ばれた場所[ばしょ]へ上[のぼ]りなさい。"
  9: "あなたはレビ人[びと]である祭司[さいし]たちと、その日々[ひび]にいる裁[さば]き人[びと]のもとへ行[い]って尋[たず]ねなさい。彼[かれ]らはあなたに裁きを告[つ]げる。"
  10: "あなたは、あなたの神[かみ]である主[しゅ]が御名[みな]を呼[よ]ばれるために選[えら]ばれたその場所[ばしょ]から彼[かれ]らがあなたに告[つ]げるその事[こと]のとおりに行[おこな]い、彼らがあなたに定[さだ]めるすべてのことを、よく守[まも]って行わなければならない。"
  11: "彼[かれ]らがあなたに語[かた]る律法[りっぽう]と裁[さば]きに従[したが]って行[おこな]いなさい。彼らがあなたに告げるその言葉[ことば]から、右[みぎ]にも左[ひだり]にも外[はず]れてはならない。"
  12: "しかし、あなたの神[かみ]である主[しゅ]の御名[みな]によって仕[つか]えるためにそこに立[た]つ祭司[さいし]、またはその日々[ひび]にいる裁[さば]き人[びと]に聞[き]き従[したが]わず、高[たか]ぶって事[こと]を行[おこな]う者[もの]は、その人[ひと]は死[し]ななければならない。あなたはイスラエルから悪[わる]い者[もの]を除[のぞ]き去[さ]らなければならない。"
  13: "民[たみ]はすべて、それを聞[き]いて恐[おそ]れ、もはや不敬[ふけい]なことをしなくなる。"
  14: "あなたが、あなたの神[かみ]である主[しゅ]が嗣業[しぎょう]としてあなたに与[あた]える地[ち]に入[はい]り、それを継[つ]いでそこに住[す]むようになり、『私[わたし]の周[まわ]りにあるほかのすべての国民[こくみん]のように、私の上[うえ]に王[おう]を立[た]てよう』と言[い]うなら、"
  15: "あなたは、あなたの神[かみ]である主[しゅ]が選[えら]ばれる者[もの]を、必[かなら]ずあなたの上[うえ]に王[おう]として立[た]てなければならない。あなたの兄弟[きょうだい]のうちから、あなたの上に王を立てなさい。あなたの兄弟でない者[もの]を、あなたの上に王として立てることはできない。"
  16: "ただ、彼[かれ]は馬[うま]を増[ふ]やしてはならない。また、馬を増やすために民[たみ]をエジプトへ引[ひ]き返[かえ]してはならない。主[しゅ]はあなたがたに『あなたがたは二度[にど]とこの道[みち]を引き返してはならない』と言[い]われたからである。"
  17: "また、妻[つま]を多[おお]くしてはならない。心[こころ]が移[うつ]らないためである。銀[ぎん]や金[きん]も、あまり多くしてはならない。"
  18: "彼[かれ]が王[おう]の座[ざ]に着[つ]くとき、この律法[りっぽう]の書[しょ]の写[うつ]しを、レビ人[びと]である祭司[さいし]たちの手[て]もとから書物[しょもつ]に書[か]き写[うつ]さなければならない。"
  19: "それは彼[かれ]のそばに置[お]かれ、彼は一生[いっしょう]、それを読[よ]まなければならない。自分[じぶん]の神[かみ]である主[しゅ]を畏[おそ]れることを学[まな]び、このすべての戒[いまし]めと定[さだ]めを守[まも]って行[おこな]うためである。"
  20: "彼[かれ]の心[こころ]が兄弟[きょうだい]たちの上[うえ]に高[たか]ぶれることなく、戒[いまし]めから右[みぎ]にも左[ひだり]にも外[はず]れることなく、彼[かれ]とその子[こ]らが、イスラエルの子らの間[あいだ]で長[なが]く王位[おうい]にとどまるためである。」"

notes:
  1: "θύσεις — заколешь, принесёшь в жертву (θύω). μόσχον ἢ πρόβατον — телёнка/вола или овцу. μῶμος — телесный порок; πᾶν ῥῆμα πονηρόν — «всякое худое слово/дело», т.е. любой изъян (слав. «всяк глагол зол»). βδέλυγμα — мерзость (忌むべきもの)."
  2: "εὑρεθῇ ἐν σοί — найдётся у тебя; παρελθεῖν τὴν διαθήκην — преступить завет (παρέρχομαι с винительным). ὅστις ποιήσει — «кто сделает» (будущее в значении возможного). ἀνὴρ ἢ γυνή — мужчина или женщина: закон равно касается обоих."
  3: "λατρεύσωσιν — послужат (λατρεύω, о культовом служении); προσκυνήσωσιν — поклонятся (προσκυνέω). τῷ ἡλίῳ ἢ τῇ σελήνῃ — солнцу или луне; παντὶ τῶν ἐκ τοῦ κόσμου τοῦ οὐρανοῦ — «всему из украшения неба», т.е. воинству небесному (слав. «от красоты небесныя»). ἃ οὐ προσέταξεν — чего Он не повелел."
  4: "ἀναγγελῇ σοι — будет возвещено тебе; ἐκζητήσεις σφόδρα — тщательно разыщешь; ἀληθῶς γέγονεν τὸ ῥῆμα — «истинно было слово», т.е. дело подтвердилось; γεγένηται τὸ βδέλυγμα — совершилась мерзость."
  5: "ἐξάξεις — выведешь; λιθοβολήσετε — побьёте камнями (мн. ч.: приговор исполняет общество); τελευτήσουσιν — умрут. Слав. добавляет «пред двери» — в греч. этого нет (проверено: εξαξεις без «врат»), поэтому не переводим."
  6: "ἐπὶ δυσὶν μάρτυσιν — при двух свидетелях; ὁ ἀποθνῄσκων — «умирающий», т.е. тот, кто подлежит смерти; οὐκ ἀποθανεῖται ἐφ᾿ ἑνὶ μάρτυρι — не умрёт при одном свидетеле. Стих повторён в 19:15."
  7: "ἡ χεὶρ τῶν μαρτύρων — рука свидетелей: они первыми бросают камень (ср. 13:9); ἐν πρώτοις … ἐπ᾿ ἐσχάτων — в первых… в последних; ἐξαρεῖς τὸν πονηρόν — истребишь злое (ἐξαίρω); ἐξ ὑμῶν αὐτῶν — из среды вас (ед. и мн. ч. чередуются)."
  8: "ἀδυνατήσῃ ἀπὸ σοῦ ῥῆμα ἐν κρίσει — «будет не по силам тебе слово в суде», т.е. дело окажется трудным. ἀνὰ μέσον αἷμα αἵματος — между кровью и кровью (об убийстве), κρίσις κρίσεως — между судом и судом, ἁφὴ ἁφῆς — между язвой и язвой (телесное повреждение), ἀντιλογία ἀντιλογίας — между тяжбой и тяжбой. ῥήματα κρίσεως ἐν ταῖς πόλεσιν ὑμῶν — судебные дела в городах ваших (анаколуф, родительный без управления). ἐπικληθῆναι τὸ ὄνομα — «чтобы имя было призвано» (пассив; передано 御名が呼ばれる)."
  9: "τοὺς ἱερεῖς τοὺς Λευίτας — священников-левитов; κριτής, ὃς ἂν γένηται ἐν ταῖς ἡμέραις ἐκείναις — судья, который будет в те дни (т.е. действующий); ἀναγγελοῦσίν σοι τὴν κρίσιν — возвестят тебе решение (κρίσις — суд, приговор)."
  10: "κατὰ τὸ πρᾶγμα — по делу; φυλάξῃ σφόδρα ποιῆσαι — строго соблюдёшь исполнить; νομοθετηθῇ σοι — будет узаконено тебе (νομοθετέω, «законоположить»; слав. «законоположатся»)."
  11: "κατὰ τὸν νόμον καὶ κατὰ τὴν κρίσιν — по закону и по суду; οὐκ ἐκκλινεῖς — не уклонишься (ἐκκλίνω); δεξιὰ οὐδὲ ἀριστερά — ни направо, ни налево."
  12: "ἐν ὑπερηφανίᾳ — в гордости, дерзко (ὑπερηφανία); τοῦ μὴ ὑπακοῦσαι — чтобы не послушать; τοῦ παρεστηκότος λειτουργεῖν — предстоящего служить (παρίστημι, λειτουργέω; слав. «предстоящаго служити»); ἐπὶ τῷ ὀνόματι κυρίου — при имени Господнем, т.е. в Его имени."
  13: "ἀκούσας φοβηθήσεται — услышав, убоится; ἀσεβήσει — будет нечествовать, дерзать (ἀσεβέω); ἔτι — впредь."
  14: "κληρονομήσῃς — наследуешь; κατοικήσῃς ἐπ᾿ αὐτῆς — поселишься на ней. ἄρχων здесь означает царя (в 17:14–20 — 王). καθὰ καὶ τὰ λοιπὰ ἔθνη τὰ κύκλῳ μου — как и прочие народы, которые вокруг меня. Слова народа — 『…』."
  15: "καθιστῶν καταστήσεις — гебраизм «поставляя поставишь», т.е. непременно поставишь; ὃν ἂν ἐκλέξηται κύριος — кого изберёт Господь; ἐκ τῶν ἀδελφῶν σου — из братьев твоих; ἄνθρωπον ἀλλότριον — человека чужого, не брата; οὐ δυνήσῃ — не сможешь."
  16: "πληθυνεῖ ἑαυτῷ ἵππον — умножит себе коня (конницу); ἀποστρέψῃ τὸν λαὸν εἰς Αἴγυπτον — возвратит народ в Египет; ὅπως πληθύνῃ — чтобы умножить; ὁ κύριος εἶπεν — Господь сказал (слова Бога — 『…』); οὐ προσθήσετε ἀποστρέψαι — «не приложите возвратиться», т.е. больше не возвращайтесь."
  17: "πληθυνεῖ ἑαυτῷ γυναῖκας — умножит себе жён; οὐδὲ μεταστήσεται αὐτοῦ ἡ καρδία — и не уклонится сердце его (μεθίστημι); ἀργύριον καὶ χρυσίον — серебро и золото; σφόδρα — чрезмерно."
  18: "καθίσῃ ἐπὶ τῆς ἀρχῆς αὐτοῦ — сядет на престоле власти (царства) своего; γράψει ἑαυτῷ — напишет себе; τὸ δευτερονόμιον τοῦτο εἰς βιβλίον — «это Второзаконие в книгу», т.е. список этого закона (слав. «второзаконие сие в книзе»); παρὰ τῶν ἱερέων τῶν Λευιτῶν — от священников-левитов, т.е. с их списка."
  19: "ἔσται μετ᾿ αὐτοῦ — будет у него; ἀναγνώσεται ἐν αὐτῷ — будет читать в ней; πάσας τὰς ἡμέρας τῆς ζωῆς αὐτοῦ — во все дни жизни своей; ἵνα μάθῃ φοβεῖσθαι — чтобы научился бояться; φυλάσσεσθαι … ποιεῖν — соблюдать и исполнять; ἐντολαί / δικαιώματα — 戒め / 定め."
  20: "ὑψωθῇ ἡ καρδία αὐτοῦ ἀπὸ τῶν ἀδελφῶν — возвысится сердце его пред братьями; παραβῇ ἀπὸ τῶν ἐντολῶν — преступит заповеди (παραβαίνω); δεξιὰ ἢ ἀριστερά — направо или налево; μακροχρονίσῃ ἐπὶ τῆς ἀρχῆς — долгие дни пробудет на царстве (μακροχρονίζω); αὐτὸς καὶ οἱ υἱοὶ αὐτοῦ ἐν τοῖς υἱοῖς Ισραηλ — он и сыны его среди сынов Израиля."
