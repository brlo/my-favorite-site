# jp-box, Второзаконие, глава 17. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru).
# ru (Синодальный) — только для понимания, не источник. jp-joc в этой главе пуст.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 17: запрет жертвы с пороком (1); идолослужение и суд над ним (2–7);
# трудные дела — к священникам-левитам и судье (8–13); закон о царе (14–20).
# Вся глава — речь Моисея к народу: первый уровень 「…」 (1–20).
# Вложенная речь — 『…』: слова народа в 14 (поставлю царя) и слова Бога в 16
# (не возвращайтесь в Египет). Красного <j> нет.
# Нумерация: 20 стихов — как в gr-lxx-byz (совпадает с csl-ru и ru).
