verses:
  1: "ユダの部族[ぶぞく]の境界[きょうかい]は、その氏族[しぞく]ごとに、エドムの境界からシンの荒野[こうや]、カデシュに至[いた]るまで、南[みなみ]に及[およ]んだ。"
  2: "彼[かれ]らの南[みなみ]の境界[きょうかい]は、塩[しお]の海[うみ]の端[はし]から、南へと延[の]びる入[い]り江[え]に及[およ]んだ。"
  3: "それはアクラビンの上[のぼ]り坂[ざか]の前[まえ]を通[とお]り、センナを巡[めぐ]って、南[みなみ]からカデシュ・バルネアへ上り、アソロンを出[で]て、アダラへ上り、カデシュの西[にし]の側[がわ]を巡る。"
  4: "そしてアセモンへ進[すす]み、エジプトの谷[たに]にまで達[たっ]する。その境界[きょうかい]の出口[でぐち]は海[うみ]に及[およ]ぶ。これが彼[かれ]らの南[みなみ]の境界である。"
  5: "東[ひがし]の境界[きょうかい]は、塩[しお]の海[うみ]のヨルダン川[がわ]に至[いた]るまでである。北[きた]の境界は、海の入[い]り江[え]、すなわちヨルダン川の端[はし]からである。"
  6: "境界[きょうかい]はベト・アグラに上[のぼ]り、北[きた]からベト・アラバへ進[すす]み、境界はルベンの子[こ]ボアンの石[いし]へ上る。"
  7: "境界[きょうかい]はアコルの谷[たに]の四分[しぶ]の一[いち]まで上[のぼ]り、アドミンの上り口[ぐち]の向[む]かいにあるガルガルへ下[くだ]る。それは谷の南[みなみ]にあたる。そして境界は太陽[たいよう]の泉[いずみ]の水[みず]に達[たっ]し、その出口[でぐち]はロゲルの泉となる。"
  8: "境界[きょうかい]はエブス人[じん]の町[まち]の後[うし]ろ、南[みなみ]からオノムの谷[たに]へ上[のぼ]る。それはエルサレムである。境界は、オノムの谷の海[うみ]の方[ほう]、すなわち西[にし]に面[めん]した山[やま]の頂[いただき]に達[たっ]する。それはレファイムの地[ち]の北[きた]の側[がわ]にあたる。"
  9: "境界[きょうかい]は山[やま]の頂[いただき]からナフトの水[みず]の泉[いずみ]に達[たっ]し、エフロンの山に達して、バアル、すなわちキルヤト・ヤリムの町[まち]へと出[で]る。"
  10: "境界[きょうかい]はバアルから海[うみ]の方[ほう]へ巡[めぐ]り、アッサレスの山[やま]の後[うし]ろ、すなわちキルヤト・ヤリムの北[きた]へ進[すす]む。それはハスロンである。そして太陽[たいよう]の町[まち]へ下[くだ]り、南[みなみ]へ進む。"
  11: "境界[きょうかい]はエクロンの後[うし]ろ、北[きた]に達[たっ]し、境界はサッカロンに達して、バラの山[やま]を通[とお]り、ヤブネルに達する。境界の出口[でぐち]は海[うみ]に及[およ]ぶ。"
  12: "海[うみ]の側[がわ]の境界[きょうかい]はこうである。大[おお]きな海が境界を定[さだ]める。これがユダの子[こ]らの境界であり、その氏族[しぞく]ごとに、四方[しほう]にわたるものである。"
  13: "神[かみ]の命令[めいれい]によって、ユダの子[こ]らの間[あいだ]で、イェフォンネの子カレブに分[わ]け前[まえ]が与[あた]えられた。ヨシュアは彼[かれ]に、エナクの母[ぼ]都[と]であるアルボクの町[まち]、すなわちヘブロンを与えた。"
  14: "カレブはそこからエナクの三[さん]人[にん]の子[こ]ら、スシ、トルミ、アヒマを滅[ほろ]ぼし尽[つ]くした。"
  15: "カレブはそこからダビルに住[す]む者[もの]たちのところへ上[のぼ]った。ダビルの名[な]は以前[いぜん]、文字[もじ]の町[まち]であった。"
  16: "カレブは言[い]った。「文字の町[まち]を取[と]って攻[せ]め落[お]とし、それを治[おさ]める者[もの]には、わたしの娘[むすめ]アクサを妻[つま]として与[あた]えよう。」"
  17: "カレブの弟[おとうと]であるケネズの子[こ]ゴトニエルがそれを取[と]った。カレブは彼[かれ]に、その娘[むすめ]アクサを妻[つま]として与[あた]えた。"
  18: "彼女[かのじょ]が入[はい]って行[い]くとき、彼[かれ]に相談[そうだん]して言[い]った。「わたしは父[ちち]に畑[はたけ]を願[ねが]いましょう。」そして彼女はろばの上[うえ]から叫[さけ]んだ。カレブは彼女に言った。「何[なに]がほしいのか。」"
  19: "彼女[かのじょ]は彼[かれ]に言[い]った。「わたしに祝福[しゅくふく]をお与[あた]えください。あなたはわたしをネゲブの地[ち]に与えられたのですから、ゴラト・マイムをわたしにお与えください。」カレブは彼女に、上[かみ]のゴラト・マイムと下[しも]のゴラト・マイムを与えた。"
  20: "これがユダの子[こ]らの部族[ぶぞく]の嗣業[しぎょう]である。"
  21: "彼[かれ]らの町々[まちまち]は次[つぎ]のとおりである。ユダの子[こ]らの部族[ぶぞく]の最初[さいしょ]の町[まち]は、エドムの境界[きょうかい]、荒野[こうや]の側[がわ]にあるカイバイセレエル、アラ、アソル、"
  22: "イカム、レグマ、アルエル、"
  23: "カデシュ、アソリオナイン、"
  24: "マイナム、バルマイナン、およびそれらの村々[むらむら]、"
  25: "アセロンの町々[まちまち]、すなわちアソル、"
  26: "セン、サルマア、モラダ、"
  27: "セリ、ベト・ファラド、"
  28: "ホラセオラ、ベエル・シェバ、およびそれらの村々[むらむら]と、それらの集落[しゅうらく]、"
  29: "バラ、バコク、アソム、"
  30: "エルボウダド、ベテル、エルマ、"
  31: "ツィクラグ、マハリム、セテンナク、"
  32: "ラボス、サレ、エロモト。合[あ]わせて二十九[にじゅうきゅう]の町[まち]と、それらの村々[むらむら]である。"
  33: "低地[ていち]には、アスタオル、ラア、アッサ、"
  34: "ラメン、タノ、イルトト、マイアニ、"
  35: "イエルムト、オドラム、メムブラ、サオコ、アゼカ、"
  36: "サカリム、ガデラ、およびその集落[しゅうらく]。合[あ]わせて十四[じゅうよん]の町[まち]と、それらの村々[むらむら]である。"
  37: "センナ、アダサン、マガダガド、"
  38: "ダラル、マスファ、ヤカレエル、"
  39: "ラキシュ、バセドト、イデアダレア、"
  40: "ハブラ、マヘス、マアコス、"
  41: "ゲドル、バガディエル、ノマン、マケダン。合[あ]わせて十六[じゅうろく]の町[まち]と、それらの村々[むらむら]である。"
  42: "レムナ、イタク、"
  43: "アノク、ヤナ、ナシブ、"
  44: "ケイラム、アキエジ、ケジブ、バテサル、アイロン。合[あ]わせて十[とお]の町[まち]と、それらの村々[むらむら]である。"
  45: "エクロンとその村々[むらむら]、およびそれらの集落[しゅうらく]、"
  46: "エクロンから、ゲムナ、およびアシュドドの近[ちか]くにあるすべての町[まち]と、それらの村々[むらむら]、"
  47: "アシュドドとその村々[むらむら]、およびその集落[しゅうらく]、ガザとその村々、およびその集落、エジプトの谷川[たにがわ]に至[いた]るまでである。そして、大[おお]きな海[うみ]が境界[きょうかい]を定[さだ]める。"
  48: "山地[さんち]には、サミル、イエテル、ソカ、"
  49: "レンナ、文字[もじ]の町[まち]、すなわちダビル、"
  50: "アノン、エスカイマン、アイサム、"
  51: "ゴソム、ハル、ハンナ。合[あ]わせて十一[じゅういち]の町[まち]と、それらの村々[むらむら]である。"
  52: "アイレム、レムナ、ソマ、"
  53: "イエマイン、ベト・アク、ファクア、"
  54: "エウマ、アルボクの町[まち]、すなわちヘブロン、ソルト。合[あ]わせて九[ここの]つの町と、それらの集落[しゅうらく]である。"
  55: "マオル、ヘルメル、オジブ、イタン、"
  56: "ヤリエル、ヤリカム、ザカナイム、"
  57: "ギバア、タムナタ。合[あ]わせて九[ここの]つの町[まち]と、それらの村々[むらむら]である。"
  58: "アルア、ベト・スル、ゲドン、"
  59: "マガロト、ベト・アナム、テクム。合[あ]わせて六[むっ]つの町[まち]と、それらの村々[むらむら]である。また、テコ、エフラタ、すなわちベツレヘム、ファゴル、アイタン、クロン、タタム、エオベス、カレム、ガレム、テテル、マノコ。合わせて十一[じゅういち]の町と、それらの村々である。"
  60: "キルヤト・バアル、すなわちキルヤト・ヤリムの町[まち]、およびソテバ。二[ふた]つの町と、それらの集落[しゅうらく]である。"
  61: "バダルギス、タラバアム、アイノン、アイヒオザ、"
  62: "ナフラゾン、サドムの町々[まちまち]、アンカデス。合[あ]わせて七[なな]つの町[まち]と、それらの村々[むらむら]である。"
  63: "しかし、エブス人[じん]はエルサレムに住[す]んでいた。ユダの子[こ]らは彼[かれ]らを滅[ほろ]ぼすことができなかった。エブス人はその日[ひ]まで、エルサレムに住んでいた。"

notes:
  1: "τὰ ὅρια φυλῆς Ιουδα κατὰ δήμους αὐτῶν — пределы племени Иуды по родам их. ἀπὸ τῶν ὁρίων τῆς Ιδουμαίας — от пределов Идумеи (エドム, форма корпуса). ἐρήμου Σιν — пустыни Син (シン). ἕως Καδης πρὸς λίβα — до Кадеса, к югу (λίψ — юг, 南)."
  2: "θάλασσα ἁλυκή — Солёное (Мёртвое) море, 塩の海. ἀπὸ τῆς λοφιᾶς τῆς φερούσης ἐπὶ λίβα — «от возвышения (косы), ведущего к югу»: λοφιά — хребет, коса, залив; слав. «от верха клонящагося к югу», Синодальный «от залива»; передано 入り江 с оговоркой."
  3: "προσαναβάσεως Ακραβιν — восхождение (подъём) Акравим (アクラビン). ἐκπεριπορεύεται Σεννα — обходит Сенну (περιπορεύομαι с приставкой). ἀναβαίνει ἀπὸ λιβὸς ἐπὶ Καδης Βαρνη — восходит с юга к Кадес-Варни. Ασωρων — Асорон (アソロン). Αδδαρα — Аддара (アダラ). τὴν κατὰ δυσμὰς Καδης — то, что к западу от Кадеса."
  4: "Ασεμωνα — Ацемон, Асемон (アセモン). διεκβαλεῖ ἕως φάραγγος Αἰγύπτου — достигает долины (потока) Египетского (διεκβάλλω). ἡ διέξοδος τῶν ὁρίων — выход, конец пределов. τοῦτό ἐστιν αὐτῶν ὅρια ἀπὸ λιβός — «вот их пределы с юга»."
  5: "τὰ ὅρια ἀπὸ ἀνατολῶν — пределы с востока: Солёное море до Иордана. ἀπὸ βορρᾶ — с севера. ἀπὸ τῆς λοφιᾶς τῆς θαλάσσης καὶ ἀπὸ τοῦ μέρους τοῦ Ιορδάνου — от залива моря и от части Иордана, т. е. от устья Иордана."
  6: "Βαιθαγλα — Беф-Хогла (ベト・アグラ; слав. «вифагла»). παραπορεύεται ἀπὸ βορρᾶ ἐπὶ Βαιθαραβα — проходит с севера к Беф-Араве (ベト・アラバ). λίθον Βαιων υἱοῦ Ρουβην — камень Боана, сына Рувимова (Βαιων)."
  7: "τὸ τέταρτον τῆς φάραγγος Αχωρ — «четвёртая часть долины Ахор»: τέταρτον — «четверть»; слав. читает как имя («к девиру»), Синодальный — «к Давиру»; в тексте по греч. Γαλγαλ — Галгал, что против восхождения Адуммим (Αδδαμιν, アドミン); это не Галгал при Иерихоне. ὕδωρ πηγῆς ἡλίου — вода источника солнца (Ен-Шемеш, 太陽の泉). πηγὴ Ρωγηλ — источник Рогель (ロゲル)."
  8: "φάραγξ Ονομ — долина Оном (иначе Гинном, Енном; オノム). ἐπὶ νώτου Ιεβους ἀπὸ λιβός — «позади Иевуса, с юга» (νῶτον — спина, 後ろ). [αὕτη ἐστὶν Ιερουσαλημ] — вставная глосса в греч. тексте (в квадратных скобках). πρὸς θαλάσσης — к морю, т. е. к западу. ἐκ μέρους γῆς Ραφαιν ἐπὶ βορρᾶ — «со стороны земли Рефаим, на север» (レファイム, форма корпуса)."
  9: "πηγὴν ὕδατος Ναφθω — источник воды Нафто (Ен-Нефтоах, ナフト). ὄρος Εφρων — гора Ефрон (エフロン). ἐξάξει τὸ ὅριον εἰς Βααλ — выведет предел к Ваалу (バアル). [αὕτη ἐστὶν πόλις Ιαριμ] — глосса: «это Кириаф-Иарим» (キルヤト・ヤリム)."
  10: "περιελεύσεται ὅριον ἀπὸ Βααλ ἐπὶ θάλασσαν — обойдёт предел от Ваала к морю. ὄρος Ασσαρες — гора Ассарес (アッサレス; Синодальный «Сеир»). [αὕτη ἐστὶν Χασλων] — глосса: Кесалон (ハスロン). ἐπὶ Πόλιν ἡλίου — к «городу солнца», т. е. Беф-Шемеш; LXX переводит название, поэтому 太陽の町."
  11: "κατὰ νώτου Ακκαρων ἐπὶ βορρᾶν — по задней стороне Екрона, к северу (エクロン, форма брифа). Σακχαρωνα — Шикарон (サッカロン). ὄρος τῆς Βαλα — гора Ваал (バラの山). Ιαβνηλ — Иавнеил (ヤブネル). ἡ διέξοδος ἐπὶ θάλασσαν — выход к морю."
  12: "τὰ ὅρια αὐτῶν ἀπὸ θαλάσσης — пределы их от моря, т. е. западные. ἡ θάλασσα ἡ μεγάλη ὁριεῖ — великое море будет пределом. κύκλῳ — вокруг, со всех сторон (四方). В конце стиха в греч. тексте стоит разделительный знак."
  13: "μερίδα ἐν μέσῳ υἱῶν Ιουδα — часть среди сынов Иуды. διὰ προστάγματος τοῦ θεοῦ — по повелению Божию. πόλιν Αρβοκ μητρόπολιν Ενακ — город Арбок, метрополию Енака (母都). [αὕτη ἐστὶν Χεβρων] — глосса: Хеврон."
  14: "τοὺς τρεῖς υἱοὺς Ενακ — трёх сынов Енака. Σουσι, Θολμι, Αχιμα — Суси, Фолми, Ахима (スシ, トルミ, アヒマ); в Синодальном имена иные (Шешай, Ахиман, Фалмай) и порядок другой — расхождение LXX и масоретского текста."
  15: "Δαβιρ — Давир (ダビル). τὸ ὄνομα... ἦν τὸ πρότερον Πόλις γραμμάτων — прежде имя было «город письмён»: LXX переводит Кириаф-Сефер, поэтому 文字の町 (слав. «град писмен»)."
  16: "Ὃς ἐὰν λάβῃ καὶ ἐκκόψῃ — кто возьмёт и сразит (ἐκκόπτω). κυριεύσῃ αὐτῆς — овладеет им (κυριεύω). Αχσαν θυγατέρα μου εἰς γυναῖκα — Ахсу, дочь мою, в жёны (アクサ)."
  17: "Γοθονιηλ υἱὸς Κενεζ ἀδελφὸς Χαλεβ ὁ νεώτερος — Гофониил, сын Кенеза, младший брат Халева (ゴトニエル; слав. «юнейший»). ἔλαβεν αὐτήν — взял его, т. е. город."
  18: "ἐν τῷ εἰσπορεύεσθαι αὐτὴν — когда она входила (εἰσπορεύομαι). συνεβουλεύσατο αὐτῷ — «посоветовалась с ним» (συμβουλεύομαι); Синодальный «её научили». Αἰτήσομαι τὸν πατέρα μου ἀγρόν — «попрошу у отца поле» (αἰτέω, будущее). ἐβόησεν ἐκ τοῦ ὄνου — воскликнула с осла (βοάω). Τί ἐστίν σοι — «что тебе?», т. е. чего ты хочешь."
  19: "Δός μοι εὐλογίαν — дай мне благословение (εὐλογία; здесь — дар, благодеяние). εἰς γῆν Ναγεβ δέδωκάς με — ты дал меня в землю Негев, южную (ネゲブ). Γολαθμαιν — Гулот-Майим, «источники вод» (ゴラト・マイム); τὴν ἄνω καὶ τὴν κάτω — верхний и нижний."
  20: "αὕτη ἡ κληρονομία φυλῆς υἱῶν Ιουδα — вот удел племени сынов Иуды; в отличие от ст. 1, без «по родам их»."
  21: "πόλις πρώτη — первый город (слав. «гради первии»). ἐφ᾿ ὁρίων Εδωμ ἐπὶ τῆς ἐρήμου — у пределов Едома, в пустыне. Καιβαισελεηλ — Кавцеил (カイバイセレエル; слав. «кавсеил»). Αρα — Ара (アラ). Ασωρ — Асор (アソル); в слав. и Синодальном в этом месте иные имена (Едраим, Иагур)."
  22: "Ικαμ, Ρεγμα, Αρουηλ — Икам, Регма, Аруил (イカム, レグマ, アルエル); Синодальный здесь даёт другие имена (Кина, Димона, Адада) — расхождение LXX и масоретского текста."
  23: "Καδης — Кадес (カデシュ). Ασοριωναιν — Асорионаин (アソリオナイン; слав. «асор и ифнаксиф»)."
  24: "Μαιναμ, Βαλμαιναν — Маинам, Балмаинан (マイナム, バルマイナン). καὶ αἱ κῶμαι αὐτῶν — и сёла их (村々); у Синодального здесь «Зиф, Телем и Валоф»."
  25: "αἱ πόλεις Ασερων — города Асерона (アセロン). [αὕτη Ασωρ] — глосса: «это Асор» (アソル)."
  26: "Σην, Σαλμαα, Μωλαδα — Сен, Салмаа, Молада (セン, サルマア, モラダ); Синодальный: Амам, Шема, Молада."
  27: "Σερι, Βαιφαλαδ — Сери, Беф-Палад (セリ, ベト・ファラド); Синодальный: Хацар-Гадда, Хешмон, Веф-Палет."
  28: "Χολασεωλα — Холасеола (ホラセオラ). Βηρσαβεε — Вирсавия (ベエル・シェバ, форма брифа и корпуса). αἱ ἐπαύλεις αὐτῶν — дворы их (集落, ср. 13:23)."
  29: "Βαλα, Βακωκ, Ασομ — Вала, Бакок, Асом (バラ, バコク, アソム); Синодальный: Ваала, Иим, Ацем."
  30: "Ελβωυδαδ — Елфолад (エルボウダド). Βαιθηλ — Вефиль (ベテル); здесь, вероятно, Бефуил в уделе Симеона (1 Пар 4:30), но по греческой форме оставлено ベテル. Ερμα — Хорма (エルマ)."
  31: "Σεκελακ — Секелаг (ツィクラグ; слав. «сикелег»). Μαχαριμ — Мадманна (マハリム). Σεθεννακ — Сансана (セテンナク)."
  32: "Λαβως, Σαλη, Ερωμωθ — Леваоф, Шелихим, Риммон (ラボス, サレ, エロモト). πόλεις κθ — городов 29 (κθ — греческое числительное, слав. «двадесять и девять»). καὶ αἱ κῶμαι αὐτῶν — и сёла их."
  33: "Ἐν τῇ πεδινῇ — «на низменности»: πεδινή — Шефела (слав. «в напольней», 低地). Ασταωλ — Ештаол (アスタオル). Ραα — Цора (ラア). Ασσα — Ашна (アッサ)."
  34: "Ραμεν, Τανω, Ιλουθωθ, Μαιανι — Рамен, Тано, Илуфоф, Маиани (ラメン, タノ, イルトト, マイアニ); Синодальный даёт иные соответствия (Заноах, Ен-Ганним, Таппуах, Гаенам)."
  35: "Ιερμουθ — Иармуф (イエルムト). Οδολλαμ — Одоллам (オドラム, форма корпуса, ср. Быт 38:1). Μεμβρα — Мембра (メムブラ). Σαωχω — Сохо (サオコ). Αζηκα — Азека (アゼカ)."
  36: "Σακαριμ — Шаараим (サカリム). Γαδηρα — Гедера (ガデラ). αἱ ἐπαύλεις αὐτῆς — дворы её (集落). πόλεις δέκα τέσσαρες — четырнадцать городов."
  37: "Σεννα, Αδασαν, Μαγαδαγαδ — Ценан, Хадаша, Мигдал-Гад (センナ, アダサン, マガダガド)."
  38: "Δαλαλ, Μασφα, Ιακαρεηλ — Дилеан, Мицфе, Иокфеил (ダラル, マスファ, ヤカレエル)."
  39: "Λαχης — Лахис (ラキシュ, форма брифа). Βασηδωθ — Воцкаф (バセドト). Ιδεαδαλεα — Еглон (イデアダレア)."
  40: "Χαβρα, Μαχες, Μααχως — Хаббон, Лахмас, Хифлис (ハブラ, マヘス, マアコス)."
  41: "Γεδδωρ — Гедероф (ゲドル). Βαγαδιηλ — Беф-Дагон (バガディエル). Νωμαν — Наема (ノマン). Μακηδαν — Макед (マケダン). πόλεις δεκαέξ — шестнадцать городов."
  42: "Λεμνα, Ιθακ — Ливна, Ефер (レムナ, イタク); в Синодальном добавлен ещё Ашан."
  43: "Ανωχ, Ιανα, Νασιβ — Иффах, Ашна, Нецив (アノク, ヤナ, ナシブ)."
  44: "Κειλαμ — Кеила (ケイラム). Ακιεζι — Ахзив (アキエジ). Κεζιβ — Кезив (ケジブ). Βαθησαρ — (バテサル). Αιλων — Елон (アイロン). πόλεις δέκα — десять городов, но перечислено пять; в слав. — «девять»."
  45: "Ακκαρων — Екрон (エクロン, форма брифа). αἱ κῶμαι αὐτῆς καὶ αἱ ἐπαύλεις αὐτῶν — сёла и дворы (村々, 集落); в греч. смешаны αὐτῆς и αὐτῶν."
  46: "ἀπὸ Ακκαρων Γεμνα — от Екрона Гемна (ゲムナ). ὅσαι εἰσὶν πλησίον Ασηδωθ — все, что близ Азота (アシュドド, форма брифа)."
  47: "Ασιεδωθ — Азот (アシュドド). ἕως τοῦ χειμάρρου Αἰγύπτου — до потока Египетского (谷川). ἡ θάλασσα ἡ μεγάλη διορίζει — великое море разделяет (διορίζω), т. е. служит пределом."
  48: "Ἐν τῇ ὀρεινῇ — «на горах» (山地). Σαμιρ, Ιεθερ, Σωχα — Шамир, Иаттир, Сохо (サミル, イエテル, ソカ)."
  49: "Ρεννα — Данна (レンナ). Πόλις γραμμάτων [αὕτη Δαβιρ] — «город письмён», т. е. Давир (文字の町; глосса в скобках)."
  50: "Ανων, Εσκαιμαν, Αισαμ — Анаф, Ештемо, Аним (アノン, エスカイマン, アイサム)."
  51: "Γοσομ, Χαλου, Χαννα — Гошен, Холон, Гило (ゴソム, ハル, ハンナ). πόλεις ἕνδεκα — одиннадцать городов."
  52: "Αιρεμ, Ρεμνα, Σομα — Арав, Дума, Ешан (アイレム, レムナ, ソマ)."
  53: "Ιεμαιν, Βαιθαχου, Φακουα — Ианум, Беф-Таппуах, Афека (イエマイン, ベト・アク, ファクア)."
  54: "Ευμα — Хумта (エウマ). πόλις Αρβοκ [αὕτη ἐστὶν Χεβρων] — город Арбок, т. е. Хеврон (アルボクの町). Σωρθ — Цигор (ソルト). πόλεις ἐννέα — девять городов."
  55: "Μαωρ, Χερμελ, Οζιβ, Ιταν — Маон, Кармил, Зиф, Юта (マオル, ヘルメル, オジブ, イタン)."
  56: "Ιαριηλ, Ιαρικαμ, Ζακαναιμ — Изреель, Иокдам, Заноах (ヤリエル, ヤリカム, ザカナイム)."
  57: "Γαβαα, Θαμναθα — Гива, Фимна (ギバア, タムナタ). πόλεις ἐννέα — девять городов, хотя в слав. «десять»."
  58: "Αλουα, Βαιθσουρ, Γεδδων — Халхул, Беф-Цур, Гедор (アルア, ベト・スル, ゲドン)."
  59: "Стих содержит две части: Μαγαρωθ, Βαιθαναμ, Θεκουμ — «шесть городов», затем вставку, помеченную в модуле как 59a: Θεκω, Εφραθα [αὕτη ἐστὶν Βαιθλεεμ] и ещё десять имён — «одиннадцать городов». Вставка стоит в самом тексте gr-lxx-byz (в csl это тоже ст. 59), поэтому переведена в том же стихе; латинское обозначение в текст не внесено. Εφραθα — Ефрафа, т. е. Вифлеем (エフラタ, ベツレヘム)."
  60: "Καριαθβααλ [αὕτη ἡ πόλις Ιαριμ] — Кириаф-Ваал, т. е. Кириаф-Иарим (キルヤト・バアル; глосса — キルヤト・ヤリム). Σωθηβα — Аравва (ソテバ). πόλεις δύο — два города; αἱ ἐπαύλεις — дворы (集落)."
  61: "Βαδδαργις, Θαραβααμ, Αινων, Αιχιοζα — Беф-Арава, Миддин, Секаха (バダルギス, タラバアム, アイノン, アイヒオザ). В Синодальном эти города отнесены «к пустыне»; в греч. заголовка нет."
  62: "Ναφλαζων — Нившан (ナフラゾン). αἱ πόλεις Σαδωμ — «города Содома» (サドム); слав. «град соли» (евр. Ир-Мелах). Ανκαδης — Ен-Геди (アンカデス). πόλεις ἑπτὰ — семь городов."
  63: "ὁ Ιεβουσαῖος κατῴκει — иевусей жил (imperfect, длящееся состояние). οὐκ ἠδυνάσθησαν ἀπολέσαι — не смогли погубить (ἀπόλλυμι). ἕως τῆς ἡμέρας ἐκείνης — до того дня. Слав. и Синодальный добавляют «с сынами Иуды»; в греч. этого нет."
