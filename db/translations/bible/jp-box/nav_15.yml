# jp-box, Иисус Навин, глава 15. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в главах 13–15 нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 15: удел Иуды. Границы: южная (1–4), восточная и северная (5–11), западная (12).
# Халев получает Хеврон и отдаёт Ахсу Гофониилу (13–19). Перечень городов (20–62):
# юг, 29 городов (21–32); Шефела (33–36); второй ряд (37–41); третий (42–44);
# филистимские (45–47); горы (48–51); второй ряд (52–54); третий (55–57);
# четвёртый (58–59); Кириаф-Иарим (60); пустыня (61–62). Иевусеи в Иерусалиме (63).
# Нумерация совпадает с csl: 63 стиха. В ст. 59 внутри текста gr-lxx-byz стоит вставка,
# помеченная в модуле как «59a» (Θεκω καὶ Εφραθα... — Вифлеем и ещё одиннадцать городов);
# она переведена в том же стихе, латинское обозначение в текст не внесено.
# Кавычки: речь Халева — 「…」 (16), речь Ахсы и Халева — 「…」 (18–19).
# 〔…〕 нет, сносок ⟨…⟩ нет: все слова есть в gr-lxx-byz, новых терминов нет.
# Топонимы: транслитерация с греческого; известные места — по брифу (エルサレム, ヘブロン,
# ベエル・シェバ, ガザ, エクロン, アシュドド, ラキシュ, ベツレヘム, キルヤト・ヤリム);
# LXX переводит названия Кириаф-Сефер и Беф-Шемеш, поэтому в тексте 文字の町 и 太陽の町.

