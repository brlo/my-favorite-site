verses:
  1: "主[しゅ]はこう言[い]われた。「ユダの王[おう]の家[いえ]へ行[い]き、そこへ下[くだ]って、この言葉[ことば]を語[かた]れ。"
  2: "そして言[い]え。『主[しゅ]の言葉[ことば]を聞[き]け、ユダの王[おう]、ダビデの王座[おうざ]に座[すわ]る者[もの]よ。あなたも、あなたの家[いえ]も、あなたのしもべたちも、この門[もん]から入[はい]るあなたの民[たみ]も。"
  3: "主[しゅ]はこう言[い]われる。裁[さば]きと正[ただ]しさを行[おこな]い、奪[うば]われている者[もの]を虐[しいた]げる者[もの]の手[て]から救[すく]い出[だ]せ。寄留[きりゅう]の者[もの]、孤児[みなしご]、やもめを虐[しいた]げず、圧迫[あっぱく]せず、この場所[ばしょ]で無実[むじつ]の血[ち]を流[なが]すな。"
  4: "もしあなたがたがこの言葉[ことば]をよく行[おこな]うなら、ダビデの王座[おうざ]に座[すわ]る王[おう]たちが、車[くるま]と馬[うま]に乗[の]って、彼[かれ]らもそのしもべたちも民[たみ]もともに、この家[いえ]の門[もん]から入[はい]って来[く]る。"
  5: "しかし、もしあなたがたがこれらの言葉[ことば]を行[おこな]わないなら、わたしは自分[じぶん]にかけて誓[ちか]う、と主[しゅ]は言[い]われる。この家[いえ]は荒[あ]れ果[は]てる。』」"
  6: "主[しゅ]はユダの王[おう]の家[いえ]についてこう言[い]われる。「あなたはわたしにとってギレアデ、レバノンの峰[みね]のようだ。しかし、わたしはあなたを荒[あ]れ野[の]とし、人[ひと]の住[す]まない都[みやこ]々[みやこ]とする。"
  7: "わたしはあなたに、滅[ほろ]ぼす者[もの]とその斧[おの]を送[おく]る。彼[かれ]らはあなたの選[えら]ばれた杉[すぎ]を切[き]り倒[たお]し、火[ひ]の中[なか]に投[な]げ込[こ]む。」"
  8: "多[おお]くの民[たみ]がこの都[みやこ]を通[とお]り抜[ぬ]けながら、互[たが]いに言[い]う。「なぜ主[しゅ]はこの大[おお]きな都[みやこ]にこのようなことをされたのか。」"
  9: "そして答[こた]えて言[い]う。「彼[かれ]らが自分[じぶん]たちの神[かみ]、主[しゅ]の契約[けいやく]を捨[す]て、ほかの神々[かみがみ]を拝[おが]み、それらに仕[つか]えたからである。」"
  10: "死[し]んだ者[もの]のために泣[な]くな。彼[かれ]のために嘆[なげ]くな。捕[と]らわれて行[い]く者[もの]のために、大[おお]いに泣[な]け。彼[かれ]はもう帰[かえ]って来[こ]ず、自分[じぶん]の生[う]まれ故郷[こきょう]の地[ち]を見[み]ることもないからである。"
  11: "主[しゅ]は、ヨシヤの子[こ]シャルムについて、すなわち父[ちち]ヨシヤに代[か]わって王[おう]となり、この場所[ばしょ]から出[で]て行[い]った者[もの]についてこう言[い]われる。「彼[かれ]はもうここへは帰[かえ]らない。"
  12: "彼[かれ]が連[つ]れて行[い]かれた場所[ばしょ]で死[し]に、この地[ち]をもう見[み]ることはない。」"
  13: "災[わざわ]いだ、不正[ふせい]をもって自分[じぶん]の家[いえ]を建[た]て、正[ただ]しい裁[さば]きによらずに上[うえ]の部屋[へや]を建[て]る者[もの]は。自分[じぶん]の隣人[りんじん]をただで働[はたら]かせ、その賃金[ちんぎん]を払[はら]わない者[もの]は。"
  14: "彼[かれ]は言[い]う。「わたしは自分[じぶん]のために広[ひろ]い家[いえ]を建[た]て、窓[まど]を開[ひら]けた広[ひろ]い部屋[へや]を造[つく]り、杉[すぎ]で張[は]り、赤[あか]い顔料[がんりょう]で塗[ぬ]ろう。」"
  15: "あなたは王[おう]となるのか。あなたは父[ちち]アハズのことで争[あらそ]っているからか。彼[かれ]らは食[た]べもせず、飲[の]みもしない。あなたには、裁[さば]きと良[よ]い正[ただ]しさを行[おこな]うほうが良[よ]かったのだ。"
  16: "彼[かれ]らは知[し]らず、貧[まず]しい者[もの]の裁[さば]きも、乏[とぼ]しい者[もの]の裁[さば]きも行[おこな]わなかった。わたしを知[し]らないとは、そういうことではないのか、と主[しゅ]は言[い]われる。"
  17: "見[み]よ、あなたの目[め]も心[こころ]も良[よ]いものではない。ただあなたの貪[むさぼ]りと、無実[むじつ]の血[ち]を流[なが]すことと、虐[しいた]げと殺[ころ]しを行[おこな]うことへと向[む]かっている。"
  18: "それゆえ、ヨシヤの子[こ]、ユダの王[おう]ヨヤキムについて、主[しゅ]はこう言[い]われる。「この人[ひと]に災[わざわ]いあれ。彼[かれ]のために『ああ、兄弟[きょうだい]よ』と言[い]って胸[むね]を打[う]つ者[もの]も、『ああ、ご主人[しゅじん]よ』と言って泣[な]く者[もの]もない。"
  19: "彼[かれ]はろばのように葬[ほうむ]られ、引[ひ]きずられてエルサレムの門[もん]の外[そと]に投[な]げ捨[て]られる。」"
  20: "レバノンに上[のぼ]って叫[さけ]べ。バシャンでも声[こえ]を上[あ]げ、海[うみ]の向[む]こう側[がわ]に向[む]かっても叫[さけ]べ。あなたの恋人[こいびと]たちはみな砕[くだ]かれたからである。"
  21: "あなたが倒[たお]れたとき、わたしはあなたに語[かた]った。しかし、あなたは言[い]った。『聞[き]かない』と。これがあなたの若[わか]い頃[ころ]からの道[みち]であり、あなたはわたしの声[こえ]に聞[き]き従[したが]わなかった。"
  22: "風[かぜ]があなたの牧者[ぼくしゃ]たちをみな追[お]いやる。あなたの恋人[こいびと]たちも捕囚[ほしゅう]となって出[で]て行[い]く。そのとき、あなたを愛[あい]するすべての者[もの]の前[まえ]で、あなたは恥[はじ]を受[う]け、辱[はずかし]められる。"
  23: "レバノンに住[す]み、杉[すぎ]の木[き]に巣[す]をかける者[もの]よ。あなたに産[さん]の苦[くる]しみが来[く]るとき、あなたは産[さん]婦[ぷ]のようにうめく。"
  24: "主[しゅ]は言[い]われる。「わたしは生[い]きている。たとえ、ヨヤキムの子[こ]、ユダの王[おう]エホヤキンが、わたしの右[みぎ]の手[て]の指輪[ゆびわ]であったとしても、わたしはそこからあなたを引[ひ]きもぎる。"
  25: "わたしはあなたを、あなたの命[いのち]を求[もと]める者[もの]たちの手[て]に渡[わた]す。あなたがその顔[かお]を恐[おそ]れている者[もの]たちの手[て]に、すなわちバビロンの王[おう]ネブカドネツァルとカルデア人[じん]の手[て]に渡[わた]す。"
  26: "わたしはあなたと、あなたを産[う]んだ母[はは]を、あなたが生[う]まれなかった地[ち]へ投[な]げ捨[て]る。あなたがたはそこで死[し]ぬ。"
  27: "しかし、彼[かれ]らがその魂[たましい]で帰[かえ]りたいと願[ねが]っている地[ち]へは、彼らは決[けっ]して帰らない。」"
  28: "エホヤキンは用[もち]いられない器[うつわ]のように辱[はずかし]められた。彼[かれ]とその子[こ]孫[そん]は投[な]げ捨[て]られ、知[し]らない地[ち]へ追[お]い出[だ]されたからである。"
  29: "地[ち]よ、地[ち]よ、地[ち]よ、主[しゅ]の言葉[ことば]を聞[き]け。"
  30: "主[しゅ]はこう言[い]われる。「この人[ひと]を、追[お]い払[はら]われた者[もの]として書[しる]せ。彼[かれ]はその日[ひ]々[び]のうちに栄[さか]えることがないからである。彼[かれ]の子孫[ししそん]のうち、ダビデの王座[おうざ]に座[すわ]ってユダを治[おさ]める者[もの]は、もはやいないからである。」"

notes:
  1: "Τάδε λέγει κύριος Πορεύου καὶ κατάβηθι — «так говорит Господь: иди и сойди» (καταβαίνω — сходить): дом царя стоял ниже храма, отсюда «сойди». εἰς τὸν οἶκον τοῦ βασιλέως Ιουδα — «в дом царя Иудина»; слав. «вниди в дом царя иудина». Стих открывает слово Господа пророку (「…」), внутри которого в ст. 2 открывается послание царю (『…』)."
  2: "Ἄκουε λόγον κυρίου, βασιλεῦ Ιουδα — «слушай слово Господне, царь Иудейский»: обращение внутри послания. ὁ καθήμενος ἐπὶ θρόνου Δαυιδ — «сидящий на престоле Давидовом». σὺ καὶ ὁ οἶκός σου καὶ ὁ λαός σου — «ты и дом твой и народ твой»; слав. добавляет «раби твои» — внесено без скобок (しもべたちも). οἱ εἰσπορευόμενοι ταῖς πύλαις ταύταις — «входящие этими воротами»."
  3: "Ποιεῖτε κρίσιν καὶ δικαιοσύνην — «творите суд и правду». ἐξαιρεῖσθε διηρπασμένον ἐκ χειρὸς ἀδικοῦντος — «избавляйте ограбленного из руки обижающего» (ἐξαιρέω). προσήλυτον καὶ ὀρφανὸν καὶ χήραν μὴ καταδυναστεύετε — «пришельца, сироту и вдову не притесняйте» (καταδυναστεύω); слав. «не оскорбляйте, не угнетайте беззаконно» — двойной перевод одного глагола, в тексте 虐げず、圧迫せず. αἷμα ἀθῷον μὴ ἐκχέητε — «крови невинной не проливайте»."
  4: "ἐὰν ποιοῦντες ποιήσητε — «если исполняя исполните» (гебраизм, усиление): よく行うなら. εἰσελεύσονται ἐν ταῖς πύλαις τοῦ οἴκου τούτου — «войдут воротами дома сего». ἐπιβεβηκότες ἐφ᾿ ἁρμάτων καὶ ἵππων — «сидящие на колесницах и конях»; слав. «вседающии на колесницы и на кони». αὐτοὶ καὶ οἱ παῖδες αὐτῶν καὶ ὁ λαὸς αὐτῶν — «сами и слуги их и народ их»."
  5: "κατ᾿ ἐμαυτοῦ ὤμοσα — «Собою поклялся» (букв. «против Себя»); слав. «сам собою закляхся». εἰς ἐρήμωσιν ἔσται ὁ οἶκος οὗτος — «в запустение будет дом сей»: 荒れ果てる. Здесь закрываются и послание царю (『』), и слово Господа пророку (「」)."
  6: "Γαλααδ σύ μοι, ἀρχὴ τοῦ Λιβάνου — «Галаад ты Мне, начало Ливана»: Галаад и Ливан — образ славы и высоты дома царя; слав. «галаад ты мне, глава ливанская». ἐὰν μὴ θῶ σε εἰς ἔρημον — «если не сделаю тебя пустынею» (ἐὰν μή + конъюнктив в клятвенном обороте). πόλεις μὴ κατοικηθησομένας — «города необитаемые»."
  7: "ἄνδρα ὀλεθρεύοντα — «мужа истребляющего» (ὀλεθρεύω — губить); слав. «убивающа мужа». τὸν πέλεκυν αὐτοῦ — «секиру его» (πέλυξ — секира, боевой топор). ἐκκόψουσιν τὰς ἐκλεκτὰς κέδρους σου — «срубят избранные кедры твои»; ἐμβαλοῦσιν εἰς τὸ πῦρ — «бросят в огонь»."
  8: "διελεύσονται ἔθνη διὰ τῆς πόλεως ταύτης — «пройдут народы через город сей»; слав. добавляет «мнози» (многие), внесено без скобок. ἐροῦσιν ἕκαστος πρὸς τὸν πλησίον αὐτοῦ — «скажет каждый ближнему своему». Речь народов — 「…»: говорит повествователь, поэтому не 『…』."
  9: "Ἀνθ᾿ ὧν — «за то, что». ἐγκατέλιπον τὴν διαθήκην κυρίου θεοῦ αὐτῶν — «оставили завет Господа Бога своего». προσεκύνησαν θεοῖς ἀλλοτρίοις καὶ ἐδούλευσαν αὐτοῖς — «поклонились богам чужим и послужили им». Вопрос 8 и ответ 9 — две отдельные цитаты народов (обе в 「…」)."
  10: "Μὴ κλαίετε τὸν τεθνηκότα — «не плачьте об умершем» (об Иосии); κλαύσατε κλαυθμῷ τὸν ἐκπορευόμενον — «плачьте плачем об отходящем» (усиление, гебраизм); слав. «плачите плачем о исходящем». οὐκ ἐπιστρέψει ἔτι — «не возвратится более». Речь пророка (наставление), без кавычек: в LXX здесь нет формулы «так говорит Господь»."
  11: "ἐπὶ Σελλημ υἱὸν Ιωσια — «о Саллуме, сыне Иосии»: Саллум — тронное имя Иоахаза (4 Цар 23:30–34), уведённого в Египет; シャルム — форма корпуса. τὸν βασιλεύοντα ἀντὶ Ιωσια τοῦ πατρὸς αὐτοῦ — «царствующего вместо Иосии, отца своего». Οὐκ ἀναστρέψει ἐκεῖ οὐκέτι — «не возвратится туда более»."
  12: "ἀλλ᾿ ἢ ἐν τῷ τόπῳ, οὗ μετῴκισα αὐτόν — «но в месте, куда Я переселил его» (μετοικίζω — переселять); слав. «аможе преведох его». τὴν γῆν ταύτην οὐκ ὄψεται ἔτι — «земли сей не увидит более»."
  13: "Ὦ ὁ οἰκοδομῶν οἰκίαν αὐτοῦ οὐ μετὰ δικαιοσύνης — «горе строящему дом свой не с правдою»: Ὦ — восклицание, передано 災いだ. τὰ ὑπερῷα αὐτοῦ οὐκ ἐν κρίματι — «горницы его не по суду» (ὑπερῷον — верхняя комната); слав. «горницы своя не в суде». παρὰ τῷ πλησίον αὐτοῦ ἐργᾶται δωρεὰν — «у ближнего своего работает даром»; τὸν μισθὸν αὐτοῦ οὐ μὴ ἀποδώσει αὐτῷ — «платы его не отдаст ему»."
  14: "ᾠκοδόμησας σεαυτῷ οἶκον σύμμετρον — «ты построил себе дом соразмерный»: в gr 2-е л. ед. ч. (прямое обращение к царю), в слав. и МТ — речь самого строителя («иже рече: созижду себе дом пространен…»). По умолчанию взято слав. (описание с цитатой); вариант LXX отмечен здесь. ὑπερῷα ῥιπιστά — «горницы просторные»; διεσταλμένα θυρίσιν — «разделённые окнами»; ἐξυλωμένα ἐν κέδρῳ — «обшитые кедром»; κεχρισμένα ἐν μίλτῳ — «покрашенные красной краской» (μίλτος — красная краска, 顔料)."
  15: "μὴ βασιλεύσεις, ὅτι σὺ παροξύνῃ ἐν Αχαζ τῷ πατρί σου; — «не будешь ли царствовать, потому что ты раздражаешься об Ахазе, отце твоём?»: тёмное место. В byz читается Αχαζ («Ахаз»), вероятно порча вместо ἐν κέδρῳ («в кедре»); ru/МТ «потому что заключил себя в кедр?». Держим byz и слав. οὐ φάγονται καὶ οὐ πίονται — «не едят и не пьют» (слав. так же); в ru/МТ положительно: «отец твой ел и пил». βέλτιον ἦν σε ποιεῖν κρίμα καὶ δικαιοσύνην καλήν — «лучше было тебе творить суд и правду добрую»."
  16: "οὐκ ἔγνωσαν, οὐκ ἔκριναν κρίσιν ταπεινῷ — «не познали, не судили суда смиренному» (3-е л. мн. ч.); слав. так же. οὐ τοῦτό ἐστιν τὸ μὴ γνῶναί σε ἐμέ; — «не это ли — не знать тебя Меня?»: знать Бога = творить суд. В ru/МТ стих читается положительно («он разбирал дело бедного»), это чтение МТ, в текст не внесено."
  17: "οἱ ὀφθαλμοί σου οὐδὲ ἡ καρδία σου καλή — «очи твои и сердце твоё не добры»; εἰς τὴν πλεονεξίαν σου — «к корысти твоей» (πλεονεξία — любостяжание); слав. «к сребролюбию твоему» (貪り). εἰς τὸ αἷμα τὸ ἀθῷον τοῦ ἐκχέειν αὐτό — «к крови невинной, чтобы пролить её»; εἰς ἀδίκημα καὶ εἰς φόνον — «к обиде и к убийству»."
  18: "Οὐαὶ ἐπὶ τὸν ἄνδρα τοῦτον — «горе мужу сему». οὐ μὴ κόψωνται αὐτόν — «не оплачут его» (κόπτομαι — бить себя в грудь в плаче); Ὦ ἀδελφέ — «о брат!»; Οἴμμοι κύριε — «увы, господине!» (слав. «увы мне, господине»). Это возгласы плакальщиков, которых не будет, поэтому в 『…』."
  19: "ταφὴν ὄνου ταφήσεται — «ослиным погребением будет погребён»; συμψησθεὶς ῥιφήσεται — «выметенный, брошен будет» (συμψάω — сметать, выволакивать); слав. «влачимь извержен будет». ἐπέκεινα τῆς πύλης Ιερουσαλημ — «за воротами Иерусалима»."
  20: "Ἀνάβηθι εἰς τὸν Λίβανον — «взойди на Ливан» (ед. ч., обращение к дочери-городу); εἰς τὴν Βασαν δὸς τὴν φωνήν σου — «в Васан дай голос твой»; βόησον εἰς τὸ πέραν τῆς θαλάσσης — «возопи по ту сторону моря» (в ru/МТ «с Аварима»). οἱ ἐρασταί σου — «любовники твои» (ἐραστής), т. е. союзники; слав. «любовнии твои»; в тексте 恋人たち, чтобы сохранить образ."
  21: "ἐλάλησα πρὸς σὲ ἐν τῇ παραπτώσει σου — «Я говорил тебе в падении твоём» (παράπτωσις — падение, преступление); в ru/МТ «во время благоденствия твоего» (иное чтение, не внесено). αὕτη ἡ ὁδός σου ἐκ νεότητός σου — «таков путь твой от юности твоей»; οὐκ ἤκουσας τῆς φωνῆς μου — «ты не слушал голоса Моего»."
  22: "πάντας τοὺς ποιμένας σου ποιμανεῖ ἄνεμος — «всех пастырей твоих упасёт ветер»: ποιμαίνω («пасти») при ἄνεμος — горькая игра слов, в тексте 風が…追いやる. οἱ ἐρασταί σου ἐν αἰχμαλωσίᾳ ἐξελεύσονται — «любовники твои в плен пойдут»; ἀτιμωθήσῃ ἀπὸ πάντων τῶν φιλούντων σε — «будешь обесчещена всеми любящими тебя» (ἀπό — «от», причинно-агентное); слав. «от всех любящих тя»."
  23: "κατοικοῦσα ἐν τῷ Λιβάνῳ — «живущая на Ливане»; ἐννοσσεύουσα ἐν ταῖς κέδροις — «гнездящаяся в кедрах» (ἐννοσσεύω — вить гнездо); καταστενάξεις — «возстонешь» (καταστενάζω); ὠδῖνες ὡς τικτούσης — «боли, как у рождающей» (産の苦しみ…うめく)."
  24: "ζῶ ἐγώ, λέγει κύριος — «живу Я, говорит Господь»: клятвенная формула, вынесена как 主は言われる + 「わたしは生きている」. ἀποσφράγισμα ἐπὶ τῆς χειρὸς τῆς δεξιᾶς μου — «печать (перстень-печатка) на правой руке Моей»; слав. «перстень на руце десней моей», 指輪. ἐὰν γενόμενος γένηται… ἐκεῖθεν ἐκσπάσω σε — условно-клятвенный оборот: «если бы… то оттуда исторгну тебя» (ἐκσπάω — вырывать)."
  25: "εἰς χεῖρας τῶν ζητούντων τὴν ψυχήν σου — «в руки ищущих души твоей»; ὧν σὺ εὐλαβῇ ἀπὸ προσώπου αὐτῶν — «которых ты страшишься» (εὐλαβέομαι — страшиться); слав. добавляет «в руки навуходоносора царя вавилонска» (нет в gr) — внесено без скобок, поэтому названы и царь, и халдеи."
  26: "ἀπορρίψω σὲ καὶ τὴν μητέρα σου — «отвергну тебя и мать твою» (ἀπορρίπτω — отбрасывать); εἰς γῆν, οὗ οὐκ ἐτέχθης ἐκεῖ — «в землю, где ты не родился»; ἐκεῖ ἀποθανεῖσθε — «там умрёте» (мн. ч.)."
  27: "εἰς δὲ τὴν γῆν, ἣν αὐτοὶ εὔχονται ταῖς ψυχαῖς αὐτῶν — «а в землю, которой они желают душами своими» (εὔχομαι — желать); οὐ μὴ ἀποστρέψωσιν — «не возвратятся» (3-е л. мн. ч., хотя речь о царе и матери)."
  28: "ἠτιμώθη Ιεχονιας ὡς σκεῦος, οὗ οὐκ ἔστιν χρεία αὐτοῦ — «обесчещен Иехония, как сосуд, в котором нет нужды» (σκεῦος — сосуд, 器); в ru/МТ это вопрос («Неужели… отверженное?»), в LXX — утверждение, держим LXX. ἐξερρίφη καὶ ἐξεβλήθη — «выброшен и изгнан»; слав. добавляет «той и семя его» — внесено без скобок (彼とその子孫). εἰς γῆν, ἣν οὐκ ᾔδει — «в землю, которой не знал»."
  29: "γῆ γῆ, ἄκουε λόγον κυρίου — «земля, земля, слушай слово Господне»: в gr слово «земля» дважды, в слав. и МТ — трижды; по паритету взято трижды (地よ、地よ、地よ). Воззвание пророка, без кавычек."
  30: "Γράψον τὸν ἄνδρα τοῦτον ἐκκήρυκτον ἄνθρωπον — «запиши мужа сего отрешённым (отверженным) человеком» (ἐκκήρυκτος — объявленный вне закона); слав. «отвержена». οὐ μὴ αὐξηθῇ ἐκ τοῦ σπέρματος αὐτοῦ ἀνὴρ καθήμενος ἐπὶ θρόνου Δαυιδ — «не будет из семени его мужа, сидящего на престоле Давидовом»; ἄρχων ἔτι ἐν τῷ Ιουδα — «властвующий ещё в Иудее». Слав. добавляет «Сия рече Господь» в начале и «мужа, иже во днех своих не предуспеет» — в gr их нет, внесены без скобок."
