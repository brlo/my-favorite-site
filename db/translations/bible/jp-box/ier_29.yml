verses:
  1: "エレミヤがエルサレムから、捕囚[ほしゅう]の長老[ちょうろう]たち、祭司[さいし]たち、偽預言者[ぎよげんしゃ]たちに、すなわちバビロンにいる捕囚と、ネブカドネツァルがエルサレムからバビロンへ移[うつ]したすべての民[たみ]に送[おく]った書[しょ]の言葉[ことば]は、次[つぎ]のとおりである。"
  2: "ヨヤキン王[おう]と女王[じょおう]、宦官[かんがん]たち、またエルサレムから出[で]て行[い]ったすべての自由[じゆう]の者[もの]、囚[とら]われの者[もの]、職人[しょくにん]たちが去[さ]った後[のち]のことである。"
  3: "それは、シャファンの子[こ]エレアサと、ヒルキヤの子[こ]ガマリヤの手[て]によって送られた。この二人[ふたり]を、ユダの王[おう]ゼデキヤは、バビロンの王[おう]のもとへバビロンに遣[つか]わしたのである。"
  4: "イスラエルの神[かみ]である主[しゅ]は、ご自分[じぶん]がエルサレムからバビロンへ移[うつ]した捕囚[ほしゅう]の者[もの]たちについて、こう言[い]われる。「わたしがエルサレムから移した捕囚の者たちよ。"
  5: "家[いえ]を建[た]てて住[す]み、園[その]を植[う]えて、その実[み]を食[た]べよ。"
  6: "妻[つま]をめとり、息子[むすこ]や娘[むすめ]を生[う]め。息子には妻をめとり、娘は嫁[とつ]がせて、息子や娘を産[う]ませよ。そこで増[ふ]えよ。減[へ]ってはならない。"
  7: "わたしがあなたがたを移したその地[ち]の平和[へいわ]を求[もと]め、その地のために主[しゅ]に祈[いの]れ。その地が平和であるとき、あなたがたにも平和があるからである。」"
  8: "万軍[ばんぐん]の主[しゅ]、イスラエルの神[かみ]はこう言[い]われる。「あなたがたの中[なか]にいる偽預言者[ぎよげんしゃ]たちに惑[まど]わされてはならない。あなたがたの占[うらな]い師[し]たちにも。また、あなたがたが見[み]る夢[ゆめ]に聞[き]き従[したが]ってはならない。"
  9: "彼[かれ]らはわたしの名[な]において、あなたがたに偽[いつわ]りを預言[よげん]している。わたしは彼らを遣[つか]わしていない、と主[しゅ]は言[い]われる。」"
  10: "主[しゅ]はこう言[い]われる。「バビロンであなたがたに七十年[ななじゅうねん]が満[み]ちるとき、わたしはあなたがたを顧[かえり]み、あなたがたについての良[よ]い言葉[ことば]を果[は]たして、あなたがたをこの場所[ばしょ]に帰[かえ]らせる。"
  11: "わたしはあなたがたのために平和[へいわ]の計[はか]らいを計[はか]り、災[わざわ]いを計らない。これらのものをあなたがたに与[あた]えるためである。"
  12: "あなたがたはわたしに向[む]かって祈[いの]り、わたしはあなたがたの声を聞[き]く。"
  13: "あなたがたはわたしを求[もと]め、わたしを見[み]いだす。心[こころ]を尽[つ]くしてわたしを求めるなら。"
  14: "わたしはあなたがたに現[あらわ]れる。わたしはあなたがたの捕[と]らわれ人[びと]を帰[かえ]らせ、あなたがたを追[お]い出[だ]したすべての国々[くにぐに]、すべての場所[ばしょ]からあなたがたを集[あつ]める、と主[しゅ]は言[い]われる。わたしは、あなたがたを移したその場所[ばしょ]へ帰[かえ]るように、あなたがたに命[めい]じる。」"
  15: "あなたがたは言[い]った。「主[しゅ]はバビロンでも、わたしたちのために預言者[よげんしゃ]を立[た]てられた。」"
  16: "まことに主[しゅ]は、ダビデの王座[おうざ]に座[すわ]る王[おう]と、この都[みやこ]に住[す]むすべての民[たみ]、すなわちあなたがたとともに捕囚[ほしゅう]に出[で]なかったあなたがたの兄弟[きょうだい]たちについて、こう言[い]われる。"
  17: "「万軍[ばんぐん]の主[しゅ]はこう言[い]われる。見[み]よ、わたしは彼[かれ]らの上[うえ]に剣[つるぎ]と飢饉[ききん]と疫病[えきびょう]を送[おく]り、彼らを、悪[わる]くて食[た]べることのできない悪い無花果[いちじく]のようにする。あまりに悪いからである。"
  18: "わたしは彼らを剣[つるぎ]と飢饉[ききん]と疫病[えきびょう]で打[う]ち滅[ほろ]ぼし、彼らを地[ち]のすべての王国[おうこく]に、呪[のろ]いと驚[おどろ]きと嘲[あざけ]りと辱[はずかし]めとして与[あた]える。わたしが彼らを追[お]い出[だ]したすべての民[たみ]の間[あいだ]で。"
  19: "彼らがわたしの言葉[ことば]に聞[き]き従[したが]わなかったからである、と主[しゅ]は言[い]われる。わたしはしもべである預言者[よげんしゃ]たちを、朝[あさ]早[はや]く起[お]きては彼[かれ]らに遣[つか]わしたが、あなたがたは聞[き]き従[したが]わなかった、と主は言われる。"
  20: "あなたがた、すなわちわたしがエルサレムからバビロンへ遣[つか]わしたすべての捕囚[ほしゅう]の者[もの]たちは、主[しゅ]の言葉[ことば]を聞[き]け。」"
  21: "万軍[ばんぐん]の主[しゅ]、イスラエルの神[かみ]は、コリヤの子[こ]アハブと、マアセヤの子[こ]ゼデキヤについて、こう言[い]われる。「見[み]よ、わたしは彼[かれ]らをバビロンの王[おう]の手[て]に渡[わた]す。王はあなたがたの目[め]の前[まえ]で彼らを打[う]つ。"
  22: "彼らのゆえに、バビロンにいるユダの捕囚[ほしゅう]のすべての者[もの]が、彼らを呪[のろ]ってこう言[い]うようになる。『主[しゅ]があなたを、バビロンの王[おう]が火[ひ]で焼[や]いたゼデキヤとアハブのようにされるように。』"
  23: "彼[かれ]らがエルサレムで悪[あく]を行[おこな]い、隣人[りんじん]の妻[つま]と姦淫[かんいん]し、わたしが命[めい]じなかった偽[いつわ]りの言葉[ことば]を、わたしの名[な]で語[かた]ったからである。わたしはその裁[さば]き手[て]であり、証人[しょうにん]である、と主[しゅ]は言[い]われる。」"
  24: "また、ネヘラム人[じん]シェマヤには、こう言[い]いなさい。"
  25: "万軍[ばんぐん]の主[しゅ]、イスラエルの神[かみ]はこう言[い]われる。「あなたは自分[じぶん]の名[な]で、エルサレムにいるすべての民[たみ]と、祭司[さいし]マアセヤの子[こ]ゼパニヤ、およびすべての祭司たちに手紙[てがみ]を送[おく]って、こう言[い]った。"
  26: "『主[しゅ]はあなたを、祭司[さいし]イオダエの代[か]わりに祭司とされた。主[しゅ]の家[いえ]で、預言[よげん]するすべての者[もの]、狂[くる]うすべての者を監督[かんとく]するためである。あなたはそのような者を牢[ろう]に入[い]れ、足枷[あしかせ]にかける。"
  27: "なぜ、あなたはアナトト出身[しゅっしん]のエレミヤがあなたがたに預言[よげん]するのを禁[きん]じなかったのか。"
  28: "彼[かれ]がバビロンのわたしたちに送[おく]って、時[とき]は長[なが]く、家[いえ]を建[た]てて住[す]み、園[その]を植[う]えてその実[み]を食[た]べるようにと言[い]ったからである。』」"
  29: "祭司[さいし]ゼパニヤは、この書[しょ]を預言者[よげんしゃ]エレミヤの耳[みみ]に読[よ]み聞[き]かせた。"
  30: "すると、主[しゅ]の言葉[ことば]がエレミヤに臨[のぞ]んで言[い]った。"
  31: "「すべての捕囚[ほしゅう]の者[もの]たちに送[おく]って言[い]いなさい。『主[しゅ]はネヘラム人[じん]シェマヤについてこう言[い]われる。シェマヤがあなたがたに預言[よげん]したが、わたしは彼[かれ]を遣[つか]わしていない。彼はあなたがたに不正[ふせい]なことを信頼[しんらい]させた。"
  32: "それゆえ、主[しゅ]はこう言[い]われる。見[み]よ、わたしはネヘラム人シェマヤとその子孫[しそん]を罰[ばつ]する。彼のうちには、わたしがこの民[たみ]に行[おこな]う良[よ]いことを見[み]る者[もの]が一人[ひとり]もいない。彼らはそれを見ない、と主は言われる。彼が主に対する背信[はいしん]を語[かた]ったからである。』」"

notes:
  1: "Καὶ οὗτοι οἱ λόγοι τῆς βίβλου — «и вот слова книги» (βίβλος — книга, свиток; в тексте 書). ἀπέστειλεν — послал; πρεσβυτέρους τῆς ἀποικίας — «старейшинам переселения» (ἀποικία — переселение, плен; в тексте 捕囚); ἐπιστολὴν εἰς Βαβυλῶνα — «письмо в Вавилон»: приложение к предыдущему, передано через すなわち. Слав. добавляет «ихже пресели навуходоносор из Иерусалима до вавилона» («которых переселил Навуходоносор») и «до вавилона» — в LXX этого нет, по паритету внесено в основной текст без скобок. ru (МТ) «к остатку старейшин» — масоретское уточнение, не внесено."
  2: "Genitivus absolutus ὕστερον ἐξελθόντος Ιεχονιου τοῦ βασιλέως — «после того как вышел царь Иехония»; καὶ τῆς βασιλίσσης — «и царицы»; τῶν εὐνούχων — «евнухов» (εὐνοῦχος, 宦官); παντὸς ἐλευθέρου — «всякого свободного»; δεσμώτου — «узника» (δεσμώτης, 囚われの者); τεχνίτου — «ремесленника» (τεχνίτης, 職人). Слав. порядок тот же («и художнику и юзнику»). ru (МТ) добавляет «князья Иудеи и Иерусалима, и плотники и кузнецы» — масоретское чтение, в текст не внесено."
  3: "ἐν χειρὶ Ελεασα υἱοῦ Σαφαν — «рукою Елеасы, сына Сафанова» (ἐν χειρί — через посланников); Γαμαριου υἱοῦ Χελκιου — «Гамарии, сына Хелкиина». Формы имён — по корпусу: シャファン, ヒルキヤ (4 Цар 22), хотя в LXX Σαφαν/Χελκιας; エレアサ и ガマリヤ — транслитерация. Относительное ὃν — единственное число («которого послал Седекия»), хотя посланников двое; в тексте оба, в notes отмечено. λέγων — «говоря»: вводит содержание письма, отнесено к следующему стиху."
  4: "Οὕτως εἶπεν κύριος ὁ θεὸς Ισραηλ — «так говорит Господь Бог Израилев»: вводная формула вне кавычек. В ru (МТ) «Господь Саваоф» — масоретское добавление, в текст не внесено (по LXX и csl — «Бог Израилев»). ἐπὶ τὴν ἀποικίαν — «о переселении», т. е. о пленённых; ἣν ἀπῴκισα — «которое Я переселил» (ἀποικίζω). Слав. добавляет «в вавилон» — нет в LXX, внесено без скобок. Цитата открывается в конце стиха и идёт до конца 36:7."
  5: "οἰκοδομήσατε οἴκους καὶ κατοικήσατε — «постройте дома и живите» (οἰκοδομέω, κατοικέω); φυτεύσατε παραδείσους — «насадите сады» (παράδεισος — сад, парк; слав. «вертограды»); φάγετε τοὺς καρποὺς αὐτῶν — «ешьте плоды их». Это ответ на ожидание скорого возвращения: жизнь в плену будет долгой (ср. 36:10, 28)."
  6: "λάβετε γυναῖκας — «берите жён»; τεκνοποιήσατε — «рождайте детей» (τεκνοποιέω); τοῖς υἱοῖς ὑμῶν γυναῖκας — «сыновьям вашим жён»; τὰς θυγατέρας ὑμῶν ἀνδράσιν δότε — «дочерей ваших отдайте мужьям» (ἀνήρ здесь — муж); πληθύνεσθε καὶ μὴ σμικρυνθῆτε — «умножайтесь и не умаляйтесь» (σμικρύνω — уменьшать). Слав. добавляет «и да раждают сыны и дщери» — нет в LXX, внесено без скобок (в тексте 息子や娘を産ませよ)."
  7: "ζητήσατε εἰς εἰρήνην τῆς γῆς — «ищите мира земли» (εἰρήνη — мир; в тексте 平和); εἰς ἣν ἀπῴκισα ὑμᾶς ἐκεῖ — «куда Я переселил вас там»; προσεύξασθε περὶ αὐτῶν πρὸς κύριον — «молитесь о них Господу» (мн. ч. — о жителях/городах); ὅτι ἐν εἰρήνῃ αὐτῆς ἔσται εἰρήνη ὑμῖν — «ибо в мире её будет мир вам». В ru (МТ) «о благосостоянии города» — уточнение перевода, по смыслу то же. Цитата закрывается."
  8: "Μὴ ἀναπειθέτωσαν ὑμᾶς — «пусть не обольщают вас» (ἀναπείθω — склонять, обольщать); οἱ ψευδοπροφῆται οἱ ἐν ὑμῖν — «лжепророки, которые среди вас»; οἱ μάντεις ὑμῶν — «гадатели ваши» (μάντης; в тексте 占い師); μὴ ἀκούετε εἰς τὰ ἐνύπνια ὑμῶν, ἃ ὑμεῖς ἐνυπνιάζεσθε — «не слушайте снов ваших, которые вы видите» (ἐνύπνιον, ἐνυπνιάζομαι). Слав. «волсви ваши» — «волхвы» вместо «гадателей». Открывается второе слово Господа."
  9: "ἄδικα προφητεύουσιν ὑμῖν — «неправду пророчествуют вам» (ἄδικος); ἐπὶ τῷ ὀνόματί μου — «именем Моим»; οὐκ ἀπέστειλα αὐτούς — «Я не посылал их». Слав. добавляет в конце «рече Господь» — в LXX нет; внесено (と主は言われる), цитата закрывается."
  10: "Ὅταν μέλλῃ πληροῦσθαι Βαβυλῶνι ἑβδομήκοντα ἔτη — «когда исполнится в Вавилоне семьдесят лет» (πληρόω; дательный Βαβυλῶνι — «в Вавилоне»); ἐπισκέψομαι ὑμᾶς — «посещу вас» (ἐπισκέπτομαι — посетить, вспомнить о); ἐπιστήσω τοὺς λόγους μου ἐφ᾽ ὑμᾶς — «поставлю слова Мои над вами», т. е. исполню их; τοῦ ἀποστρέψαι — «чтобы возвратить». Слав. «уставлю словеса моя на вас»; ru (МТ) «исполню доброе слово Моё». Открывается третье слово Господа (36:10–14)."
  11: "λογιοῦμαι ἐφ᾽ ὑμᾶς λογισμὸν εἰρήνης — «помышлю о вас помышление мира» (λογισμός — помышление, замысел; созвучие λογιοῦμαι/λογισμός сохранено 計らいを計り); οὐ κακά — «не злая»; τοῦ δοῦναι ὑμῖν ταῦτα — «чтобы дать вам это». В ru (МТ) знаменитое «намерения во благо, а не на зло… чтобы дать вам будущность и надежду» — в LXX этого нет, в текст не внесено."
  12: "προσεύξασθε πρός με — «помолитесь ко Мне»; εἰσακούσομαι ὑμῶν — «услышу вас». В ru (МТ) добавлено «пойдете и помолитесь Мне» — в LXX нет. Краткость двух членов сохранена."
  13: "ἐκζητήσατέ με καὶ εὑρήσετέ με — «взыщите Меня и найдёте» (ἐκζητέω, εὑρίσκω); ὅτι ζητήσετέ με ἐν ὅλῃ καρδίᾳ ὑμῶν — «ибо взыщете Меня всем сердцем вашим». Условный оттенок греч. ὅτι передан условной формой (求めるなら), как и в слав."
  14: "ἐπιφανοῦμαι ὑμῖν — «явлюсь вам» (ἐπιφαίνομαι). В gr-lxx-byz стих на этом обрывается («. —»); дальнейшее — слав. 29:14: «и возвращу узники вашя и соберу вас от всех стран и от всех градов, в няже изгнах вас… и возвратитися повелю вам на место, откуду превести вас повелех» (ἀποστρέφω, συνάγω, ἐκβάλλω) — в LXX нет, по паритету внесено в основной текст без скобок; в ru (МТ) то же. Цитата закрывается."
  15: "ὅτι εἴπατε — «ибо вы сказали»; Κατέστησεν ἡμῖν κύριος προφήτας ἐν Βαβυλῶνι — «поставил нам Господь пророков в Вавилоне» (καθίστημι — ставить, назначать). Речь переселенцев, ссылающихся на своих пророков (ср. 36:21–23: Ахав и Седекия); в 「…」. Слав. «возстави нам Господь пророки в вавилоне»."
  16: "В модуле лакуна: в gr-lxx-byz на месте стиха «.», стих переведён по слав. 29:16 (в LXX стих есть, ср. Rahlfs 36:16): «Тако бо рече Господь ко царю седящу на престоле давидове и ко всем людем живущым во граде том, и братиям вашым, не изшедшым с вами в плен» — «ибо так говорит Господь о царе, сидящем на престоле Давидовом, и о всём народе, живущем в том городе, и о братьях ваших, не вышедших с вами в плен». 〔…〕 не ставим (решение для книги). Формула вне кавычек."
  17: "В модуле лакуна (в gr-lxx-byz «.»); перевод по слав. 29:17: «се, аз послю на ня мечь и глад и мор, и положу я яко смоквы худыя, ихже немощно ясти, понеже зело худы быша» — «вот, Я пошлю на них меч, голод и мор и положу их как смоквы негодные, которых нельзя есть, потому что они очень негодны» (σῦκον — смоква, 無花果; ἄχρηστος — негодный). Слав. «Господь вседержитель» — 万軍の主 (παντοκράτωρ)."
  18: "В модуле лакуна; перевод по слав. 29:18: «и сотру я мечем и гладом и мором, и дам я в погубление всем царствам земным и в проклятие, и во удивление и в посмех и в поругание всем языком, к нимже извергох я» — «истреблю их мечом, голодом и мором и отдам их на погибель всем царствам земным, в проклятие, в удивление, в посмеяние и в поругание всем народам, к которым Я изгнал их» (συντρίβω, κατάρα, θάμβος, χλεύη, ὄνειδος)."
  19: "В модуле лакуна; перевод по слав. 29:19: «занеже не послушаша словес моих… яже послах к ним рабы моими пророки, рано востая и посылая, и не послушасте» — «за то, что они не послушали слов Моих, которые Я послал к ним рабами Моими пророками, с раннего утра вставая и посылая, и вы не послушали». Переход с 3-го л. на 2-е («не послушасте») сохранён: в конце стиха あなたがたは聞き従わなかった. Формула «говорит Господь» внутри речи оставлена в кавычках."
  20: "В модуле лакуна; перевод по слав. 29:20: «Вы убо слышите слово Господне, все преселение, еже выслах из Иерусалима в вавилон» — «вы же слушайте слово Господне, всё переселение, которое Я выслал из Иерусалима в Вавилон». Стих замыкает слово о царе и оставшихся (36:16–20), цитата закрывается; следующее слово (36:21–23) открывается новой формулой."
  21: "οὕτως εἶπεν κύριος ἐπὶ Αχιαβ καὶ ἐπὶ Σεδεκιαν — «так говорит Господь об Ахаве и о Седекии»: Ахав, сын Колии, и Седекия, сын Маасеи, — лжепророки в Вавилоне (ср. 36:22–23); имена アハブ, コリヤ, マアセヤ — транслитерация. δίδωμι αὐτοὺς εἰς χεῖρας βασιλέως Βαβυλῶνος — «предаю их в руки царя Вавилонского»; πατάξει αὐτοὺς κατ᾽ ὀφθαλμοὺς ὑμῶν — «поразит их на глазах ваших». Открывается новое слово Господа."
  22: "λήμψονται ἀπ᾽ αὐτῶν κατάραν — «примут от них проклятие», т. е. их имена станут формулой проклятия (κατάρα, 呪い); ἐν πάσῃ τῇ ἀποικίᾳ Ιουδα ἐν Βαβυλῶνι — «во всём переселении Иудином в Вавилоне»; ἀπετηγάνισεν — «изжарил» (ἀποτηγανίζω, редкое; слав. «сожже» — «сжёг»), в тексте по csl 焼いた. Ποιήσαι σε κύριος ὡς… — оптатив в формуле проклятия, передан ように; проклятие внутри речи Господа — вложенная цитата 『…』."
  23: "ἀνομίαν ἐν Ισραηλ — «беззаконие в Израиле»; слав. читает «во Иерусалиме» (иное чтение, ср. МТ «в Израиле») — в тексте по csl エルサレムで. ἐμοιχῶντο τὰς γυναῖκας τῶν πολιτῶν αὐτῶν — «прелюбодействовали с жёнами сограждан своих» (μοιχάομαι; πολίτης — согражданин, 隣人); λόγον ἐχρημάτισαν ἐν τῷ ὀνόματί μου — «слово возвестили именем Моим» (χρηματίζω — возвещать, здесь о пророческом слове). ἐγὼ μάρτυς — «Я свидетель»; слав. добавляет «судия» («аз же есмь судия и послух») — нет в LXX, внесено (裁き手)."
  24: "καὶ πρὸς Σαμαιαν τὸν Νελαμίτην ἐρεῖς — «и к Шемаии Нехеламитянину скажешь» (Νελαμίτης — от Нехелама, места происхождения; слав. «еламитину» понимает как «еламитянин»). シェマヤ — транслитерация Σαμαιας. Вводная формула вне кавычек: дальше идёт слово Господа с письмом Шемаии внутри."
  25: "Οὐκ ἀπέστειλά σε τῷ ὀνόματί μου — «Я не посылал тебя именем Моим»: в gr-lxx-byz стих начинается с этого обрывочного предложения (текст LXX здесь повреждён). Полный вид — в слав. 29:25: «тако глаголет Господь вседержитель, Бог израилев: понеже послал еси во имя твое послания ко всем людем, иже во Иерусалиме, и ко софонии сыну маасеову жерцу и ко всем жерцем, глаголя»; по нему и переведено, отсутствующее в LXX внесено без скобок (в notes отмечено). καὶ πρὸς Σοφονιαν υἱὸν Μαασαιου τὸν ἱερέα εἰπέ — «и Зефании, сыну Маасеи, священнику скажи». Открывается цитата."
  26: "Κύριος ἔδωκέν σε εἰς ἱερέα ἀντὶ Ιωδαε τοῦ ἱερέως — «Господь поставил тебя священником вместо Иодая священника»; γενέσθαι ἐπιστάτην ἐν τῷ οἴκῳ κυρίου — «быть надзирателем в доме Господнем» (ἐπιστάτης, 監督); παντὶ ἀνθρώπῳ προφητεύοντι καὶ παντὶ ἀνθρώπῳ μαινομένῳ — «всякому человеку пророчествующему и всякому человеку безумствующему» (μαίνομαι — неистовствовать); εἰς τὸ ἀπόκλεισμα καὶ εἰς τὸν καταρράκτην — «в темницу и в колодку» (ἀπόκλεισμα — запертое место, 牢; καταρράκτης — колода, 足枷). Это уже слова письма Шемаии — вложенная цитата 『…』 (36:26–28)."
  27: "συνελοιδορήσατε — «вы не запретили» (λοιδορέω — бранить, здесь «прикрикнуть, запретить»; слав. «почто не запретисте»); Ιερεμιαν τὸν ἐξ Αναθωθ — «Иеремию из Анафофа» (アナトト — по корпусу и брифу); τὸν προφητεύσαντα ὑμῖν — «пророчествующего вам». Продолжение письма Шемаии."
  28: "οὐ διὰ τοῦτο ἀπέστειλεν πρὸς ὑμᾶς εἰς Βαβυλῶνα λέγων — «не для того ли он послал к нам в Вавилон, говоря»; Μακράν ἐστιν — «далеко есть», т. е. время продлится (слав. «долгое есть время»); οἰκοδομήσατε οἰκίας καὶ κατοικήσατε καὶ φυτεύσατε κήπους — «стройте дома и живите, и сажайте сады» (κήπος — сад; ср. 36:5 παράδεισος). Письмо Шемаии заканчивается, закрываются обе цитаты (『』 и 「」); цитата слов Иеремии внутри письма передана косвенной речью (…ようにと言った), чтобы не вводить третьего уровня кавычек."
  29: "καὶ ἀνέγνω Σοφονιας τὸ βιβλίον εἰς τὰ ὦτα Ιερεμιου — «и прочитал Зефания книгу в уши Иеремии», т. е. вслух ему (ἀναγινώσκω; εἰς τὰ ὦτα — «в уши»). Слав. «прочте книгу сию софониа во ушы иеремии пророка». Авторское повествование без кавычек."
  30: "καὶ ἐγένετο λόγος κυρίου πρὸς Ιερεμιαν λέγων — «и было слово Господне к Иеремии, говоря»: вводная формула вне кавычек, слово Господа начинается в 36:31. Слав. «И бысть слово Господне ко иеремии глаголя»."
  31: "Ἀπόστειλον πρὸς τὴν ἀποικίαν λέγων — «пошли к переселению, говоря»; Ἐπειδὴ ἐπροφήτευσεν ὑμῖν Σαμαιας — «так как Шемаия пророчествовал вам»; ἐγὼ οὐκ ἀπέστειλα αὐτόν — «Я не посылал его»; πεποιθέναι ἐποίησεν ὑμᾶς ἐπ᾽ ἀδίκοις — «сделал, что вы уповаете на неправду» (πείθω в perfectum — доверять; ἄδικος). Послание, которое надо передать, — вложенная цитата 『…』 (36:31–32)."
  32: "ἐπισκέψομαι ἐπὶ Σαμαιαν καὶ ἐπὶ τὸ γένος αὐτοῦ — «посещу Шемаию и род его», т. е. накажу (ἐπισκέπτομαι); οὐκ ἔσται αὐτῶν ἄνθρωπος ἐν μέσῳ ὑμῶν τοῦ ἰδεῖν τὰ ἀγαθά — «не будет у них человека среди вас, чтобы увидеть благое»; οὐκ ὄψονται — «не увидят». Слав. добавляет «зане отступление глагола на Господа» («ибо он говорил отступление на Господа») — нет в LXX, внесено без скобок (背信を語った). Обе цитаты закрываются."
