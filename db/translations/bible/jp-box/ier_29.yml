# jp-box, Иеремия, глава 29. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc в книге почти нет (фрагменты гл. 11, 12, 31),
# для этой главы нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 29: 1 надписание (по слав.); 2–7 одно слово Господа о нашествии на филистимлян:
# 2–3 воды с севера, топот коней, день погибели; 4 истребление филистимлян, Тира и Сидона;
# 5 плешь на Газе и падение Аскалона; 6–7 вопрос к мечу Господню и ответ: Господь
# повелел ему подняться на Аскалон.
# Голоса: 29:1 — надписание, вне кавычек; 29:2–7 — одна цитата 「…」 (слово Господа),
# открывается в 29:2, закрывается в конце 29:7; вложенной речи нет, 『…』 не нужны.
# Нумерация по gr: 7 стихов; у слав. (гл. 47) тоже 7, но 5/6 поделены иначе — «доколе
# сещи будеши» слав. относит к ст. 6; держим gr, см. notes 5–6.
# Глава соответствует слав./ru 47 (филистимляне), а не слав. 29 (письмо переселенцам).
# 〔…〕 нет: слав. добавления внесены в основной текст без скобок и оговорены
# (29:1 — полное надписание, 29:4 — «каппадокийских»). Сносок ⟨…⟩ нет: ペリシテ人,
# ガザ, アスカロン, ツロ, シドン, 剣, さや уже в корпусе. Имена — транслитерация
# греческого (LXX).

