verses:
  1: "友[とも]から離[はな]れようとする者[もの]は口実[こうじつ]を求[もと]め、いかなる時[とき]にも非難[ひなん]される。"
  2: "思慮[しりょ]に欠[か]ける者[もの]は知恵[ちえ]を必要[ひつよう]としない。むしろ、愚[おろ]かさに導[みちび]かれるからである。"
  3: "不敬[ふけい]な者[もの]が悪[あく]の深[ふか]みに達[たっ]すると、すべてを侮[あなど]る。しかし、不名誉[ふめいよ]と侮辱[ぶじょく]がその者に及[およ]ぶ。"
  4: "人[ひと]の心[こころ]のうちの言葉[ことば]は深[ふか]い水[みず]であり、それは湧[わ]き出[で]る川[かわ]、命[いのち]の泉[いずみ]である。"
  5: "不敬[ふけい]な者[もの]の顔[かお]を重[おも]んじるのは良[よ]くなく、裁[さば]きにおいて正[ただ]しいことを曲[ま]げるのは敬虔[けいけん]なことではない。"
  6: "愚[おろ]かな者[もの]の唇[くちびる]はその者を悪[あく]へ連[つ]れて行[い]き、その横柄[おうへい]な口[くち]は死[し]を呼[よ]び寄[よ]せる。"
  7: "愚[おろ]かな者[もの]の口[くち]はその者の破滅[はめつ]であり、その唇[くちびる]はその魂[たましい]の罠[わな]である。"
  8: "恐[こわ]さは怠[なま]ける者[もの]たちを倒[たお]し、女[おんな]のような男[おとこ]たちの魂[たましい]は飢[う]える。"
  9: "自分[じぶん]のわざによって自分を癒[いや]さない者[もの]は、自分を滅[ほろ]ぼす者の兄弟[きょうだい]である。"
  10: "主[しゅ]の名[な]は偉大[いだい]な力[ちから]のゆえにあり、正[ただ]しい者[もの]たちはそこへ走[はし]り寄[よ]って高[たか]く挙[あ]げられる。"
  11: "富[とみ]める者[もの]の財産[ざいさん]は堅[かた]い町[まち]であり、その栄光[えいこう]は大[おお]きく影[かげ]を落[お]とす。"
  12: "滅[ほろ]びの前[まえ]に人[ひと]の心[こころ]は高[たか]ぶり、栄光[えいこう]の前に低[ひく]くされる。"
  13: "聞[き]く前[まえ]に答[こた]える者[もの]には、愚[おろ]かさと恥[はじ]がある。"
  14: "思慮[しりょ]あるしもべは人[ひと]の怒[いか]りを静[しず]める。しかし、気[き]の小[ちい]さい人をだれが耐[た]えられようか。"
  15: "思慮[しりょ]ある者[もの]の心[こころ]は知識[ちしき]を得[え]、知恵[ちえ]ある者の耳[みみ]は悟[さと]りを求[もと]める。"
  16: "人[ひと]への贈[おく]り物[もの]はその人を広[ひろ]くし、支配者[しはいしゃ]たちの前[まえ]に座[すわ]らせる。"
  17: "正[ただ]しい者[もの]はまず自[みずか]らを告発[こくはつ]する。しかし、相手[あいて]が反論[はんろん]すれば、その者[もの]は問[と]いただされる。"
  18: "くじは争[あらそ]いを止[や]め、強[つよ]い者[もの]たちの間[あいだ]でも決[き]めごとをする。"
  19: "兄弟[きょうだい]に助[たす]けられる兄弟は、堅[かた]く高[たか]い町[まち]のようであり、基[きず]かれた王国[おうこく]のように強[つよ]い。"
  20: "人[ひと]は口[くち]の実[み]によって腹[はら]を満[み]たし、唇[くちびる]の実によって満たされる。"
  21: "死[し]と命[いのち]は舌[した]の手[て]のうちにあり、舌を治[おさ]める者[もの]はその実[み]を食[た]べる。"
  22: "良[よ]い妻[つま]を見[み]いだした者[もの]は恵[めぐ]みを見いだし、主[しゅ]から喜[よろこ]びを受[う]けた。"
  23: "良い妻を追[お]い出[だ]す者は良いものを追い出し、姦通[かんつう]の女[おんな]を抱[だ]く者は愚[おろ]かで不敬[ふけい]である。"
  24: "貧[まず]しい者は願[ねが]いながら語[かた]り、富[とみ]める者はきびしく答[こた]える。"
  25: "友[とも]を愛[あい]する者は友と交[まじ]わり、兄弟[きょうだい]よりも親[した]しい友もある。"

notes:
  1: "προφάσεις ζητεῖ — ищет предлогов (πρόφασις — предлог, повод). ἀνὴρ βουλόμενος χωρίζεσθαι ἀπὸ φίλων — муж, желающий отделиться от друзей (χωρίζω). ἐν παντὶ δὲ καιρῷ ἐπονείδιστος ἔσται — и во всякое время будет поносим (ἐπονείδιστος — достойный поношения)."
  2: "οὐ χρείαν ἔχει σοφίας ἐνδεὴς φρενῶν — не имеет нужды в премудрости скудоумный (ἐνδεής — нуждающийся). μᾶλλον γὰρ ἄγεται ἀφροσύνῃ — ибо более водится безумием (ἄγω — вести)."
  3: "ὅταν ἔλθῃ ἀσεβὴς εἰς βάθος κακῶν, καταφρονεῖ — когда придёт нечестивый в глубину зол, нерадит, всё презирает (καταφρονέω). ἐπέρχεται δὲ αὐτῷ ἀτιμία καὶ ὄνειδος — находит же на него бесчестие и поношение."
  4: "ὕδωρ βαθὺ λόγος ἐν καρδίᾳ ἀνδρός — вода глубокая — слово в сердце мужа. ποταμὸς δὲ ἀναπηδύει καὶ πηγὴ ζωῆς — река же вскакивает (бьёт ключом) и источник жизни (ἀναπηδάω — вскакивать)."
  5: "θαυμάσαι πρόσωπον ἀσεβοῦς οὐ καλόν — дивиться лицу нечестивого нехорошо (θαυμάζω — удивляться, быть лицеприятным). οὐδὲ ὅσιον ἐκκλίνειν τὸ δίκαιον ἐν κρίσει — и не благочестно уклонить правое на суде (ἐκκλίνω)."
  6: "χείλη ἄφρονος ἄγουσιν αὐτὸν εἰς κακά — уста глупого ведут его в зло. τὸ δὲ στόμα αὐτοῦ τὸ θρασὺ θάνατον ἐπικαλεῖται — дерзкие же уста его призывают смерть (θρασύς — дерзкий; ἐπικαλέομαι)."
  7: "στόμα ἄφρονος συντριβὴ αὐτῷ — уста глупого — сокрушение ему (συντριβή). τὰ δὲ χείλη αὐτοῦ παγὶς τῇ ψυχῇ αὐτοῦ — уста же его — сеть душе его (παγίς)."
  8: "ὀκνηροὺς καταβάλλει φόβος — ленивых низлагает страх (ὀκνηρός — ленивый). ψυχαὶ δὲ ἀνδρογύνων πεινάσουσιν — души же женоподобных (мужежен) будут голодать (ἀνδρόγυνος; csl «мужей женам подобных»)."
  9: "ὁ μὴ ἰώμενος ἑαυτὸν ἐν τοῖς ἔργοις αὐτοῦ — не исцеляющий себя в делах своих (ἰάομαι). ἀδελφός ἐστιν τοῦ λυμαινομένου ἑαυτόν — брат есть погубляющему себя самого (λυμαίνομαι — губить, разорять)."
  10: "ἐκ μεγαλωσύνης ἰσχύος ὄνομα κυρίου — от величия крепости имя Господне (μεγαλωσύνη). αὐτῷ δὲ προσδραμόντες δίκαιοι ὑψοῦνται — к Нему прибежавшие праведники возвышаются (προστρέχω)."
  11: "ὕπαρξις πλουσίου ἀνδρὸς πόλις ὀχυρά — имение богатого мужа — город крепкий (ὕπαρξις — имущество; ὀχυρός; ср. 10:15). ἡ δὲ δόξα αὐτῆς μέγα ἐπισκιάζει — слава же его велико осеняет (ἐπισκιάζω)."
  12: "πρὸ συντριβῆς ὑψοῦται καρδία ἀνδρός — прежде сокрушения возносится сердце мужа. καὶ πρὸ δόξης ταπεινοῦται — и прежде славы смиряется (ср. 15:33; 16:18)."
  13: "ὃς ἀποκρίνεται λόγον πρὶν ἀκοῦσαι — кто отвечает слово прежде слышания. ἀφροσύνη αὐτῷ ἐστιν καὶ ὄνειδος — безумие ему есть и поношение."
  14: "θυμὸν ἀνδρὸς πραΰνει θεράπων φρόνιμος — гнев мужа укрощает слуга разумный (πραΰνω; θεράπων). ὀλιγόψυχον δὲ ἄνδρα τίς ὑποίσει — малодушного же мужа кто понесёт; риторический вопрос сохранён (ὑποφέρω — выносить)."
  15: "καρδία φρονίμου κτᾶται αἴσθησιν — сердце разумного приобретает разумение (αἴσθησις — чувство, понимание). ὦτα δὲ σοφῶν ζητεῖ ἔννοιαν — уши же мудрых ищут смысла (ἔννοια)."
  16: "δόμα ἀνθρώπου ἐμπλατύνει αὐτόν — дар человека расширяет его (δόμα; ἐμπλατύνω). καὶ παρὰ δυνάσταις καθιζάνει αὐτόν — и с владыками сажает его (καθιζάνω)."
  17: "δίκαιος ἑαυτοῦ κατήγορος ἐν πρωτολογίᾳ — праведный сам себе обвинитель в первом слове (πρωτολογία — первая речь). ὡς δ᾽ ἂν ἐπιβάλῃ ὁ ἀντίδικος, ἐλέγχεται — когда же наложит (возразит) противник, обличается (ἐπιβάλλω; ἐλέγχω). Место тёмное; ru/МТ читают о тяжбе («первый в тяжбе своей прав»)."
  18: "ἀντιλογίας παύει κλῆρος — прекословия прекращает жребий (κλῆρος). ἐν δὲ δυνάσταις ὁρίζει — и между владыками определяет (ὁρίζω). csl читает «молчаливый» вместо «жребий» — иное чтение, отмечено."
  19: "ἀδελφὸς ὑπὸ ἀδελφοῦ βοηθούμενος — брат, братом помогаемый (βοηθέω). ὡς πόλις ὀχυρὰ καὶ ὑψηλή — как город крепкий и высокий. ἰσχύει ὥσπερ τεθεμελιωμένον βασίλειον — крепок, как основанное царство (θεμελιόω)."
  20: "ἀπὸ καρπῶν στόματος ἀνὴρ πίμπλησιν κοιλίαν αὐτοῦ — от плодов уст муж наполняет чрево своё (πίμπλημι). ἀπὸ δὲ καρπῶν χειλέων αὐτοῦ ἐμπλησθήσεται — от плодов же устен своих насытится (ср. 12:14; 18:21)."
  21: "θάνατος καὶ ζωὴ ἐν χειρὶ γλώσσης — смерть и жизнь в руке языка. οἱ δὲ κρατοῦντες αὐτῆς ἔδονται τοὺς καρποὺς αὐτῆς — владеющие же им (языком) будут есть плоды его (κρατέω)."
  22: "ὃς εὗρεν γυναῖκα ἀγαθήν, εὗρεν χάριτας — кто нашёл жену добрую, нашёл благодати (χάρις). ἔλαβεν δὲ παρὰ θεοῦ ἱλαρότητα — получил же от Бога радость (ἱλαρότης — весёлость, благосклонность; csl «тишину» — иное чтение). Стих кончается здесь, как у csl 18:22; подстих 22a из модуля вынесен в отдельный 18:23."
  23: "Подстих gr 18:22a (в модуле внутри стиха 22), по csl — отдельный ст. 23: ὃς ἐκβάλλει γυναῖκα ἀγαθήν, ἐκβάλλει τὰ ἀγαθά — изгоняющий жену добрую изгоняет благое; ὁ δὲ κατέχων μοιχαλίδα ἄφρων καὶ ἀσεβής — держащий прелюбодейку глуп и нечестив (μοιχαλίς). В ру/МТ этого полустишия нет; чтение только LXX + csl."
  24: "Стиха нет в LXX: csl 18:24 «С молении глаголет убогий, богатый же отвещает жестоко» (МТ 18:23; ср. ру «Бедный говорит с мольбою, а богатый отвечает грубо»). Переведено с csl без 〔…〕 (паритет, п. 3): церковное чтение принято как основное. «С молении» — с молением, прошением (δέησις); «отвещает жестоко» — отвечает жёстко, грубо."
  25: "Стиха нет в LXX: csl 18:25 «Муж любовен к дружбе, и есть друг прилепивыйся паче брата» (МТ 18:24; ср. ру «Кто хочет иметь друзей, тот и сам должен быть дружелюбным; и бывает друг, более привязанный, нежели брат»). Переведено с csl без 〔…〕. Масоретское «должен быть дружелюбным» в csl отсутствует, поэтому в текст не внесено."
