# jp-box, Притчи, глава 18. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный, с масоретского) — только
# для понимания, не источник. jp-joc (1901) есть только для 18:1–5 — контроль
# церковного чтения, архаизмы не копировались. jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 18: своенравный (1), глупый (2), нечестивый (3), слово и источник (4),
# лицеприятие (5), уста глупого (6–8), ленивый (9), имя Господне (10), богатство (11),
# падение и слава (12), ответ (13), гнев (14), сердце разумного (15), дар (16),
# тяжба (17–19), плод уст (20–21), добрая жена (22), злая жена (23), бедный и богатый
# (24), дружба (25).
# Прямой речи нет — авторские изречения, внешних кавычек нет; параллелизм сохранён.
# Нумерация — славяно-синодальная (csl-ru), как и во всей книге: 25 стихов.
# В gr-lxx-byz глава короче — 22 стиха, потому что:
#   • gr 18:22 несёт двойку: 22 + подстих 22a («ὃς ἐκβάλλει γυναῖκα ἀγαθήν…»);
#     по csl 22a — отдельный стих 18:23 («Иже изгоняет жену добрую…»), наш 18:23;
#   • csl 18:24–25 («С молении глаголет убогий, богатый же отвещает жестоко»; «Муж
#     любовен к дружбе, и есть друг прилепивыйся паче брата») в LXX отсутствуют —
#     это масоретские стихи, взятые только по csl, без 〔…〕, см. notes 24–25.
# Сдвиг: наш N = gr N при N ≤ 22; наш 18:23 = gr 18:22a; наш 24–25 — стихи без LXX.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).

