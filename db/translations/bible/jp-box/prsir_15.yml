chapter: 15
draft: true

verses:
  1: "主[しゅ]を恐[おそ]れる者[もの]はこれを行[おこな]う。律法[りっぽう]に堅[かた]く立[た]つ者は知恵[ちえ]を得[え]る。"
  2: "知恵[ちえ]は母[はは]のように彼[かれ]を迎[むか]え、おとめの妻[つま]のように彼を受け入[い]れる。"
  3: "悟[さと]りのパンを彼[かれ]に食[た]べさせ、知恵[ちえ]の水[みず]を飲[の]ませる。"
  4: "彼[かれ]は知恵[ちえ]に支[ささ]えられて傾[かたむ]くことがなく、知恵にすがって恥[は]じることがない。"
  5: "知恵[ちえ]は彼[かれ]を隣人[りんじん]たちの上[うえ]に高[たか]め、集会[しゅうかい]のただ中[なか]で彼の口[くち]を開[ひら]かせる。"
  6: "彼[かれ]は喜[よろこ]びと歓喜[かんき]の冠[かんむり]を得[え]、永遠[えいえん]の名[な]を受[う]け継[つ]ぐ。"
  7: "悟[さと]りのない人々[ひとびと]は知恵[ちえ]を得[え]ることがなく、罪人[つみびと]たちは知恵を見[み]ることがない。"
  8: "知恵[ちえ]は高[たか]ぶりから遠[とお]く離[はな]れており、偽[いつわ]る者[もの]たちは知恵を思[おも]い出[だ]すことがない。"
  9: "罪人[つみびと]の口[くち]にある賛美[さんび]は美[うつく]しくない。それは主[しゅ]から遣[つか]わされたものではないからである。"
  10: "賛美[さんび]は知恵[ちえ]によって語[かた]られ、主[しゅ]がそれを栄[さか]えさせられる。"
  11: "「主[しゅ]のゆえにわたしは離[はな]れた」と言[い]うな。主が憎[にく]まれたことを、あなたは行[おこな]ってはならないからである。"
  12: "「主[しゅ]がわたしを惑[まど]わした」と言[い]うな。主は罪人[つみびと]を必要[ひつよう]としないからである。"
  13: "主[しゅ]はすべての忌[い]むべきものを憎[にく]まれた。それは主を恐[おそ]れる者[もの]たちに愛[あい]されるものではない。"
  14: "主[しゅ]は初[はじ]めから人[ひと]を造[つく]り、その者[もの]を自分[じぶん]の思慮[しりょ]の手[て]に委[ゆだ]ねられた。"
  15: "あなたが望[のぞ]むなら、戒[いまし]めを守[まも]り、みこころにかなう誠実[せいじつ]を果[は]たすことができる。"
  16: "主[しゅ]はあなたの前[まえ]に火[ひ]と水[みず]を置[お]かれた。あなたが望[のぞ]む方[ほう]に手[て]を伸[の]べる。"
  17: "人[ひと]の前[まえ]には生[いのち]と死[し]がある。その者[もの]が望[のぞ]むものがその者に与[あた]えられる。"
  18: "主[しゅ]の知恵[ちえ]は大[おお]きく、主は力[ちから]において強[つよ]く、すべてを見[み]ておられる。"
  19: "その目[め]は主[しゅ]を恐[おそ]れる者[もの]たちの上[うえ]にあり、主は人[ひと]のすべてのわざを知[し]っておられる。"
  20: "主[しゅ]はだれにも不敬虔[ふけいけん]を行[おこな]うよう命[めい]じたことはなく、だれにも罪[つみ]を犯[おか]すゆとりを与[あた]えたことはない。"

notes:
  1: "Ὁ φοβούμενος κύριον ποιήσει αὐτό — «боящийся Господа сделает это» (φοβέομαι — бояться; αὐτό — «это», т. е. сказанное выше, ср. 14:27); ὁ ἐγκρατὴς τοῦ νόμου καταλήμψεται αὐτήν — «держащийся закона обретёт её» (ἐγκρατής — твёрдо держащий; νόμος — закон; καταλαμβάνω — постигать); αὐτήν — премудрость."
  2: "καὶ ὑπαντήσεται αὐτῷ ὡς μήτηρ — «и встретит его, как мать» (ὑπαντάω — встречать); ὡς γυνὴ παρθενίας προσδέξεται αὐτόν — «как жена девства примет его» (παρθενία — девство; προσδέχομαι — принимать). Слав. «яко жена девства приимет и»."
  3: "ψωμιεῖ αὐτὸν ἄρτον συνέσεως — «напитает его хлебом разумения» (ψωμίζω — кормить кусками; σύνεσις — разумение); ὕδωρ σοφίας ποτίσει αὐτόν — «водою премудрости напоит его» (ποτίζω — поить)."
  4: "στηριχθήσεται ἐπ᾽ αὐτὴν καὶ οὐ μὴ κλιθῇ — «утвердится на ней и не склонится» (στηρίζω — утверждать; κλίνω — наклонять); ἐπ᾽ αὐτῆς ἐφέξει — «на ней будет держаться» (ἐπέχω); οὐ μὴ καταισχυνθῇ — «не постыдится» (καταισχύνω)."
  5: "καὶ ὑψώσει αὐτὸν παρὰ τοὺς πλησίον αὐτοῦ — «и возвысит его над ближними его» (ὑψόω; πλησίον — ближний); ἐν μέσῳ ἐκκλησίας ἀνοίξει τὸ στόμα αὐτοῦ — «среди собрания откроет уста его» (ἐκκλησία — собрание, церковь; ἀνοίγω — открывать)."
  6: "εὐφροσύνην καὶ στέφανον ἀγαλλιάματος εὑρήσει — «радость и венец ликования найдёт» (εὐφροσύνη — веселье; στέφανος — венец; ἀγαλλίαμα — ликование); ὄνομα αἰῶνος κατακληρονομήσει — «имя вечное наследует» (κατακληρονομέω — получать в наследие)."
  7: "οὐ μὴ καταλήμψονται αὐτὴν ἄνθρωποι ἀσύνετοι — «не постигнут её люди неразумные» (ἀσύνετος — неразумный); ἄνδρες ἁμαρτωλοὶ οὐ μὴ ἴδωσιν αὐτήν — «мужи грешные не увидят её»."
  8: "μακράν ἐστιν ὑπερηφανίας — «далека она от гордости» (ὑπερηφανία — надменность); ἄνδρες ψεῦσται οὐ μὴ μνησθύσονται αὐτῆς — «мужи лживые не помянут её» (ψεύστης — лживый; μιμνήσκομαι)."
  9: "Οὐχ ὡραῖος αἶνος ἐν στόματι ἁμαρτωλοῦ — «не прекрасна хвала в устах грешника» (ὡραῖος — красивый, прекрасный; αἶνος — хвала); ὅτι οὐ παρὰ κυρίου ἀπεστάλη — «ибо не от Господа послана она» (ἀποστέλλω — посылать)."
  10: "ἐν γὰρ σοφίᾳ ῥηθήσεται αἶνος — «ибо в премудрости будет сказана хвала» (ῥηθήσεται — будет сказано, от λέγω); ὁ κύριος εὐοδώσει αὐτόν — «Господь даст ей успех» (εὐοδόω — давать успех). Слав. «Господь благопоспешит ей»."
  11: "μὴ εἴπῃς ὅτι Διὰ κύριον ἀπέστην — «не говори: ради Господа я отступил» (ἀφίστημι — отступать); ἃ γὰρ ἐμίσησεν, οὐ ποιήσει — «ибо что Он возненавидел, того не сделает» (LXX: οὐ ποιήσει — «Он не сделает»); слав. читает «да не сотвориши» — «не делай», и по паритету это чтение взято в текст; вариант LXX — в этой заметке. Возражение в 「…」."
  12: "μὴ εἴπῃς ὅτι Αὐτός με ἐπλάνησεν — «не говори: Он меня ввёл в заблуждение» (πλανάω — вводить в заблуждение); οὐ γὰρ χρείαν ἔχει ἀνδρὸς ἁμαρτωλοῦ — «ибо Он не имеет нужды в муже грешном» (χρεία — нужда). Возражение в 「…」."
  13: "πᾶν βδέλυγμα ἐμίσησεν ὁ κύριος — «всякую мерзость возненавидел Господь» (βδέλυγμα — мерзость); οὐκ ἔστιν ἀγαπητὸν τοῖς φοβουμένοις αὐτόν — «и нет ничего любимого боящимся Его», т. е. мерзость не может быть любима боящимися Его (ἀγαπητός — любимый)."
  14: "αὐτὸς ἐξ ἀρχῆς ἐποίησεν ἄνθρωπον — «Он от начала сотворил человека» (ἀρχή — начало; ποιέω — творить); ἀφῆκεν αὐτὸν ἐν χειρὶ διαβουλίου αὐτοῦ — «оставил его в руке произволения его» (διαβούλιον — размышление, произволение; слав. «произволение»). Учение о свободной воле."
  15: "ἐὰν θέλῃς, συντηρήσεις ἐντολάς — «если захочешь, соблюдёшь заповеди» (συντηρέω — соблюдать; ἐντολή — заповедь); πίστιν ποιῆσαι εὐδοκίας — «сотворить веру благоволения» (πίστις здесь — верность, преданность; εὐδοκία — благоволение; слав. «веру сотвориши благоволения»). В тексте 誠実 — верность, чтобы не смешивать с догматической «верой»."
  16: "παρέθηκέν σοι πῦρ καὶ ὕδωρ — «положил пред тобой огонь и воду» (παρατίθημι — предлагать, ставить перед); οὗ ἐὰν θέλῃς, ἐκτενεῖς τὴν χεῖρά σου — «к чему захочешь, прострёшь руку твою» (ἐκτείνω). Образ выбора из двух."
  17: "ἔναντι ἀνθρώπων ἡ ζωὴ καὶ ὁ θάνατος — «пред людьми жизнь и смерть» (ἔναντι — перед); ὃ ἐὰν εὐδοκήσῃ, δοθήσεται αὐτῷ — «чего он пожелает, будет дано ему» (εὐδοκέω — желать, соизволять)."
  18: "ὅτι πολλὴ ἡ σοφία τοῦ κυρίου — «велика премудрость Господа» (πολύς — многий, великий); ἰσχυρὸς ἐν δυναστείᾳ — «сильный в могуществе» (ἰσχυρός; δυναστεία); βλέπων τὰ πάντα — «видящий всё» (βλέπω)."
  19: "οἱ ὀφθαλμοὶ αὐτοῦ ἐπὶ τοὺς φοβουμένους αὐτόν — «очи Его на боящихся Его»; αὐτὸς ἐπιγνώσεται πᾶν ἔργον ἀνθρώπου — «Он познает всякое дело человека» (ἐπιγινώσκω — узнавать, знать)."
  20: "οὐκ ἐνετείλατο οὐδενὶ ἀσεβεῖν — «не заповедал никому нечествовать» (ἐντέλλομαι — заповедовать; ἀσεβέω — нечествовать); οὐκ ἔδωκεν ἄνεσιν οὐδενὶ ἁμαρτάνειν — «не дал послабления никому грешить» (ἄνεσις — ослабление, послабление; слав. «ослаба»). Итог учения о свободе: Бог не повелевает зла."
