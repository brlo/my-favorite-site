# jp-box, Сирах, глава 15. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для книги нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 15: 1–6 блаженство боящегося Господа и плоды премудрости; 7–10 премудрость
# недоступна неразумным и грешникам, хвала Богу; 11–20 свобода воли: Бог не виновник
# зла, человеку предложены жизнь и смерть.
# Прямая речь: 15:11 и 15:12 — возражения, которые автор запрещает приводить;
# они даны в 「…」 (прямая речь первого уровня в авторском тексте); прочее — авторский текст.
# Нумерация: 20 стихов; в этой главе деление гр. и csl совпадает стих в стих.
# 15:11: LXX читает οὐ ποιήσει («Он не сделает»), csl — «да не сотвориши» («не делай»);
# по паритету в тексте csl-чтение, вариант LXX — в notes.
# 15:15: πίστις здесь — верность, а не догматическая «вера» (см. notes).
# 〔…〕 нет: все стихи есть в gr-lxx-byz. Сносок ⟨…⟩ нет: 知恵, 主を恐れる, 戒め,
# よみ, わざ и пр. уже в корпусе.
# Имён и топонимов в главе нет.

