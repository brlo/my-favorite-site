# jp-box, Иезекииль, глава 30. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 30 (совпадает; см. карту 20/21).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: плач о Египте и фараоне. 1–19 — слово о «дне Господнем» над Египтом:
# «о, о день!», меч на Египет, смятение в Ефиопии, перечень союзников (персы, критяне,
# лидяне, ливийцы, смешанные, сыны завета), падение подпор, огонь, вестники
# в Ефиопию, Навуходоносор и губители, реки в пустыню, Мемфис, Пафрос, Танис, Но
# (Диосполь), Саин, Илиополь, Бубаст, Тафнес; 20–26 — новое слово (одиннадцатый год,
# первый месяц, седьмой день): сокрушённые мышцы фараона, которые не перевязаны;
# две мышцы будут сокрушены, Египет рассеян, мышцы царя Вавилонского укреплены.
# Голоса: 1 — формула вне кавычек; 2–19 — слово Господа в 「…」 (формулы «так говорит
# Господь» в 2, 6, 10, 13 внутри речи; в 6-м, как и в слав., формула стоит и в начале,
# и в конце стиха); 20 — формула; 21–26 — слово Господа в 「…」.
# «Точка»: в этой главе нет.
# Имена и термины: エジプト, ファラオ, エチオピア, バビロン, ネブカドネツァル, イスラエル;
# ペルシア人[じん] (Πέρσαι), クレタ人[じん] (Κρῆτες), リュディア人[じん] (Λυδοί),
# リビア人[じん] (Λίβυες), ムーリ人[じん] (слав. «мурини», нет в LXX);
# マグドル, シエネ, パトゥレス, タニス (Τάνις/Танис), ディオスポリス (Διόσπολις),
# サイン (Σάιν), サイス (слав. «саис» = LXX Συήνη), ヘリオポリス (Ἡλίου πόλις),
# ブバストス (Βούβαστος), タフナヘス (Ταφνας, форма корпуса), メンフィス.
# 力[ちから]の傲慢[ごうまん] — ἡ ὕβρις τῆς ἰσχύος (30:6, 18); 支[ささ]え — ἀντιστήριγμα.
#
