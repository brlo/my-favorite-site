verses:
  1: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  2: "「人[ひと]の子[こ]よ、預言[よげん]して言[い]え。主[しゅ]なる神[かみ]はこう言[い]われる。ああ、あの日[ひ]よ。"
  3: "泣[な]き叫[さけ]べ。あの日[ひ]が近[ちか]いからである。主[しゅ]の日[ひ]が近[ちか]く、雲[くも]の日[ひ]が近[ちか]づき、諸国民[しょこくみん]の終[お]わりの時[とき]が来[く]る。"
  4: "剣[つるぎ]はエジプトに来[く]る。エチオピアには恐[おそ]れがある。エジプトで傷[きず]ついた者[もの]たちが倒[たお]れ、その多[おお]くの者[もの]が取[と]り去[さ]られ、その基[き]が崩[くず]れるからである。"
  5: "ペルシア人[じん]、クレタ人[じん]、リュディア人[じん]、リビア人[じん]、ムーリ人[じん]、すべて混[ま]じり合[あ]った者[もの]たち、わたしの契約[けいやく]の子[こ]らは、その中[なか]で剣[つるぎ]によって倒[たお]れる。"
  6: "主[しゅ]はこう言[い]われる。エジプトの支[ささ]えは倒[たお]れ、その力[ちから]の傲慢[ごうまん]は下[くだ]る。マグドルからシエネまで、その中[なか]で剣[つるぎ]によって倒[たお]れる、と主[しゅ]なる神[かみ]は言[い]われる。"
  7: "それらは荒[あ]れ果[は]てた国々[くにぐに]の真[ま]ん中[なか]で荒[あ]れ果[は]て、その町[まち]々は荒[あ]れ果[は]てた町[まち]々の真[ま]ん中[なか]にある。"
  8: "わたしがエジプトに火[ひ]をかけ、これを助[たす]ける者[もの]たちがみな砕[くだ]かれる時[とき]、彼らはわたしが主[しゅ]であることを知[し]る。"
  9: "その日[ひ]、わたしの前[まえ]から使者[ししゃ]たちが出[で]て、シエイムへ急[いそ]ぎ、ムーリの地[ち]の望[のぞ]みを滅[ほろ]ぼす。彼らのうちに恐[おそ]れがあり、エジプトの日[ひ]が彼らに臨[のぞ]む。見[み]よ、それは来[き]た。"
  10: "主[しゅ]なる神[かみ]はこう言[い]われる。わたしはバビロンの王[おう]ネブカドネツァルの手[て]によって、エジプト人[じん]の多[おお]くの者[もの]を滅[ほろ]ぼす。"
  11: "彼と彼の民[たみ]は、諸国民[しょこくみん]から遣[つか]わされた滅[ほろ]ぼす者[もの]たちである。彼らはこの地[ち]を滅[ほろ]ぼすために来[く]る。彼らはみな剣[つるぎ]を抜[ぬ]いてエジプトに向[む]かい、傷[きず]ついた者[もの]で地[ち]を満[み]たす。"
  12: "わたしはその川[かわ]々を荒[あ]れ果[は]てさせ、地[ち]とその満[み]ちるものとを悪[わる]い者[もの]たちの手[て]に渡[わた]す。わたしは見知[みし]らぬ者[もの]たちの手[て]で地[ち]を、そのすべてもろもろのものとともに荒[あ]れ果[は]てさせる。わたしは主[しゅ]、語[かた]ったのである。"
  13: "主[しゅ]なる神[かみ]はこう言[い]われる。わたしはメンフィスから偶像[ぐうぞう]を滅[ほろ]ぼし、エジプトの地[ち]から貴族[きぞく]たちを追[お]い出[だ]す。君[きみ]たちはもはやいなくなる。わたしはエジプトの地[ち]に恐[おそ]れを置[お]く。"
  14: "わたしはパトゥレスの地[ち]を荒[あ]れ果[は]てさせ、タニスに火[ひ]をかけ、ディオスポリスで報[むく]いを行[おこな]う。"
  15: "わたしはエジプトの力[ちから]であるサインに怒[いか]りを注[そそ]ぎ、メンフィスの多[おお]くの者[もの]を滅[ほろ]ぼす。"
  16: "わたしはエジプトに火[ひ]をかけ、サイスは騒[さわ]ぎに騒[さわ]ぐ。ディオスポリスには破[やぶ]れが生[しょう]じ、水[みず]があふれ出[で]る。"
  17: "ヘリオポリスの若者[わかもの]たちとブバストスの者[もの]たちは剣[つるぎ]で倒[たお]れ、女[おんな]たちは捕囚[ほしゅう]となって行[い]く。"
  18: "タフナヘスでは、わたしがそこでエジプトの王杖[おうじょう]を砕[くだ]く時[とき]、日[ひ]が暗[くら]くなる。そこではその力[ちから]の傲慢[ごうまん]が滅[ほろ]び、雲[くも]がそれを覆[おお]い、その娘[むすめ]たちは捕囚[ほしゅう]となって連[つ]れ去[さ]られる。"
  19: "わたしはエジプトにさばきを行[おこな]い、彼らはわたしが主[しゅ]であることを知[し]る。」"
  20: "第十一年[だいじゅういちねん]の第一[だいいち]の月[つき]の七日[なのか]に、主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  21: "「人[ひと]の子[こ]よ、わたしはエジプトの王[おう]ファラオの腕[うで]を砕[くだ]いた。見[み]よ、それは癒[いや]すために包[つつ]まれず、力[ちから]を得[え]て剣[つるぎ]を取[と]るための膏薬[こうやく]も塗[ぬ]られていない。"
  22: "それゆえ、主[しゅ]なる神[かみ]はこう言[い]われる。見[み]よ、わたしはエジプトの王[おう]ファラオに対[たい]し、その強[つよ]い腕[うで]と伸[の]びた腕[うで]と砕[くだ]かれた腕[うで]を砕[くだ]き、その手[て]から剣[つるぎ]を落[お]とす。"
  23: "わたしはエジプトを諸国民[しょこくみん]の間[あいだ]に散[ち]らし、国々[くにぐに]にまき散[ち]らす。"
  24: "わたしはバビロンの王[おう]の腕[うで]を強[つよ]くし、わたしの剣[つるぎ]をその手[て]に与[あた]える。彼はそれをエジプトに向[む]けて導[みちび]き、その獲物[えもの]を奪[うば]い、その戦利品[せんりひん]を取[と]る。"
  25: "わたしはバビロンの王[おう]の腕[うで]を強[つよ]くするが、ファラオの腕[うで]は倒[たお]れる。わたしがわたしの剣[つるぎ]をバビロンの王[おう]の手[て]に与[あた]え、彼がそれをエジプトの地[ち]に伸[の]べる時[とき]、彼らはわたしが主[しゅ]であることを知[し]る。"
  26: "わたしはエジプトを諸国民[しょこくみん]の間[あいだ]に散[ち]らし、国々[くにぐに]にまき散[ち]らす。彼らはみな、わたしが主[しゅ]であることを知[し]る。」"

notes:
  1: "Καὶ ἐγένετο λόγος κυρίου πρός με λέγων — формула вне кавычек; ср. 20:2; 21:1. Даты нет, в отличие от 30:20."
  2: "Υἱὲ ἀνθρώπου, προφήτευσον καὶ εἰπὸν — «сын человеческий, изреки пророчество и скажи»; Τάδε λέγει κύριος — «так говорит Господь» (слав. «адонаи Господь»); Ὦ ὦ ἡ ἡμέρα — «о, о день!»: двойное восклицание, передано ああ、あの日[ひ]よ. В слав. это восклицание отнесено к началу 3-го стиха («возрыдайте: оле, оле день!»), в LXX оно стоит в конце 2-го — деление по LXX."
  3: "ὅτι ἐγγὺς ἡ ἡμέρα τοῦ κυρίου — «ибо близок день Господень»; ἡμέρα πέρας ἐθνῶν ἔσται — «день кончины народов будет» (πέρας — конец, 終[お]わり). Слав. добавляет в начале «возрыдайте» (泣[な]き叫[さけ]べ) и в середине «и приближается день облака» (雲[くも]の日[ひ]) — в LXX их нет (МТ), внесено без 〔…〕."
  4: "ἥξει μάχαιρα ἐπ᾽ Αἰγυπτίους — «придёт меч на Египтян»; ἔσται ταραχὴ ἐν τῇ Αἰθιοπίᾳ — «будет смятение в Ефиопии» (ταραχή — 恐[おそ]れ); πεσοῦνται τετραυματισμένοι — «падут уязвлённые»; συμπεσεῖται αὐτῆς τὰ θεμέλια — «падут основания его» (θεμέλια — 基[き]). Слав. добавляет «и взято будет множество их» — нет в LXX, внесено без 〔…〕."
  5: "Πέρσαι καὶ Κρῆτες καὶ Λυδοὶ καὶ Λίβυες — «персы, критяне, лидяне, ливийцы» (ペルシア人[じん]、クレタ人[じん]、リュディア人[じん]、リビア人[じん]); πάντες οἱ ἐπίμικτοι — «все смешанные [народы]» (ἐπίμικτος, 混[ま]じり合[あ]った者[もの]); τῶν υἱῶν τῆς διαθήκης μου — «из сынов завета Моего» (διαθήκη — 契約[けいやく]). Слав. добавляет «мурини» (ムーリ人[じん]) — нет в LXX, внесено без 〔…〕; стоящее при нём в слав. в скобках «(и вся аравиа)» — редакционная скобка, не перенесена. В Синодальном иной список (Ефиопия, Ливия, Лидия, Хуб — МТ)."
  6: "πεσοῦνται τὰ ἀντιστηρίγματα Αἰγύπτου — «падут подпоры Египта» (ἀντιστήριγμα — подпора, 支[ささ]え); καταβήσεται ἡ ὕβρις τῆς ἰσχύος αὐτῆς — «сойдёт гордыня силы его» (ὕβρις — 傲慢[ごうまん]); ἀπὸ Μαγδώλου ἕως Συήνης — «от Магдола до Сиены» (マグドル、シエネ). Слав. ставит формулу «сия глаголет Господь» в начале стиха (в LXX её там нет) и добавляет «адонаи» в конце — сохранено, как в слав."
  7: "ἐρημωθήσεται ἐν μέσῳ χωρῶν ἠρημωμένων — «опустеет среди опустошённых стран»; αἱ πόλεις αὐτῶν ἐν μέσῳ πόλεων ἠρημωμένων ἔσονται — «города их среди опустошённых городов будут». Формула 29:12; 30:7."
  8: "ὅταν δῶ πῦρ ἐπ᾽ Αἴγυπτον — «когда дам огонь на Египет»; συντριβῶσι πάντες οἱ βοηθοῦντες αὐτῇ — «сокрушатся все помогающие ей» (βοηθέω — помогать); γνώσονται ὅτι ἐγὼ κύριος — формула."
  9: "ἐν τῇ ἡμέρᾳ ἐκείνῃ ἐξελεύσονται ἄγγελοι σπεύδοντες — «в тот день выйдут ангелы (посланники), спешащие» (σπεύδω — спешить, 急[いそ]ぐ; 使者[ししゃ]); ἀφανίσαι τὴν Αἰθιοπίαν — «истребить Ефиопию»; ἔσται ταραχὴ ἐν αὐτοῖς ἐν τῇ ἡμέρᾳ Αἰγύπτου — «будет смятение в них в день Египта»; ὅτι ἰδοὺ ἥκει — «ибо вот, пришёл». Слав. добавляет «от лица моего», «в сиеим» (シエイム — тёмное место, вероятно Сиена) и вместо Ефиопии — «надежду муринския земли» (ムーリの地[ち]の望[のぞ]み); всё внесено без 〔…〕. В Синодальном «на кораблях» (МТ) — не внесено."
  10: "τάδε λέγει κύριος κύριος — «так говорит Господь Бог» (слав. «адонаи Господь»); ἀπολῶ πλῆθος Αἰγυπτίων — «погублю множество Египтян» (πλῆθος — 多[おお]くの者[もの]); διὰ χειρὸς Ναβουχοδονοσορ βασιλέως Βαβυλῶνος — «рукою Навуходоносора, царя Вавилонского» (ネブカドネツァル)."
  11: "αὐτοῦ καὶ τοῦ λαοῦ αὐτοῦ — «его и народа его»: в LXX эта клауза продолжает 10-й стих («рукою… его и народа его»), в слав. начинает 11-й — деление по LXX, смысл един. λοιμοὶ ἀπὸ ἐθνῶν ἀπεσταλμένοι — «губители от народов посланные» (λοιμός — чума, губитель; 滅[ほろ]ぼす者[もの]); ἐκκενώσουσιν τὰς μαχαίρας αὐτῶν — «обнажат мечи свои»; πλησθήσεται ἡ γῆ τραυματιῶν — «наполнится земля уязвлёнными»."
  12: "δώσω τοὺς ποταμοὺς αὐτῶν ἐρήμους — «дам реки их пустыми» (川[かわ]々); ἀπολῶ τὴν γῆν καὶ τὸ πλήρωμα αὐτῆς ἐν χερσὶν ἀλλοτρίων — «погублю землю и полноту её в руках чужих» (πλήρωμα — 満[み]ちるもの); ἐγὼ κύριος λελάληκα — «Я, Господь, сказал» (порядок слов: 主[しゅ]なるわたしが語[かた]った)."
  13: "ἀπολῶ μεγιστᾶνας ἀπὸ Μέμφεως — «погублю вельмож от Мемфиса» (μεγιστάν — вельможа, 貴族[きぞく]; メンフィス); ἄρχοντας ἐκ γῆς Αἰγύπτου — «князей из земли Египетской» (君[きみ]たち); οὐκ ἔσονται ἔτι — «не будут более». Слав. добавляет «кумиры» (偶像[ぐうぞう]) и «дам страх во земли египетстей» (恐[おそ]れを置[お]く) — нет в LXX, внесено без 〔…〕 (в Синодальном сходно с слав. — МТ)."
  14: "ἀπολῶ γῆν Παθουρης — «погублю землю Пафроса» (パトゥレス); δώσω πῦρ ἐπὶ Τάνιν — «дам огонь на Танис» (Τάνις, タニス; в Синодальном Цоан); ποιήσω ἐκδίκησιν ἐν Διοσπόλει — «сотворю отмщение в Диосполе» (Διόσπολις — Но/Фивы, ディオスポリス; слав. «диосполь»)."
  15: "ἐκχεῶ τὸν θυμόν μου ἐπὶ Σάιν — «изолью ярость Мою на Саин» (Σάιν, サイン; в Синодальном Син); τὴν ἰσχὺν Αἰγύπτου — «силу Египта»; ἀπολῶ τὸ πλῆθος Μέμφεως — «погублю множество Мемфиса»."
  16: "ταραχὴν ταραχθήσεται Συήνη — «смятением смятётся Сиена» (cognatus: 騒[さわ]ぎに騒[さわ]ぐ); слав. вместо Συήνη читает «саис» (サイス) — церковное чтение оставлено в тексте, вариант LXX — в notes. ἐν Διοσπόλει ἔσται ἔκρηγμα — «в Диосполе будет прорыв (разлом)» (ἔκρηγμα, 破[やぶ]れ); διαχυθήσεται ὕδατα — «разольются воды»."
  17: "νεανίσκοι Ἡλίου πόλεως καὶ Βουβάστου — «юноши Илиополя и Бубаста» (Ἡλίου πόλις — ヘリオポリス, слав. «илиуполь»; Βούβαστος — ブバストス, слав. «вуваст»); ἐν μαχαίρᾳ πεσοῦνται — «мечом падут»; αἱ γυναῖκες ἐν αἰχμαλωσίᾳ πορεύσονται — «жёны в плен пойдут» (αἰχμαλωσία — 捕囚[ほしゅう])."
  18: "ἐν Ταφνας συσκοτάσει ἡ ἡμέρα — «в Тафнесе померкнет день» (Ταφνας, タフナヘス — форма корпуса, слав. «тафнес»); ἐν τῷ συντρῖψαι με ἐκεῖ τὰ σκῆπτρα Αἰγύπτου — «когда сокрушу там скипетры Египта» (σκῆπτρον — 王杖[おうじょう]); ἀπολεῖται ἡ ὕβρις τῆς ἰσχύος αὐτῆς — «погибнет гордыня силы его» (та же формула, что в 6-м); νεφέλη καλύψει — «облако покроет» (νεφέλη); θυγατέρες αἰχμάλωτοι ἀχθήσονται — «дочери в плен отведены будут»."
  19: "καὶ ποιήσω κρίμα ἐν Αἰγύπτῳ — «и сотворю суд в Египте» (κρίμα — さばき); γνώσονται ὅτι ἐγὼ κύριος — формула. Здесь первое слово главы закрывается."
  20: "Καὶ ἐγένετο ἐν τῷ ἑνδεκάτῳ ἔτει ἐν τῷ πρώτῳ μηνὶ ἑβδόμῃ τοῦ μηνός — «и было в одиннадцатый год, в первый месяц, в седьмой день месяца» (第十一年[だいじゅういちねん]…七日[なのか]); формула вне кавычек."
  21: "τοὺς βραχίονας Φαραω συνέτριψα — «мышцы фараона сокрушил Я» (βραχίων — 腕[うで]; слав. «мышцы»); οὐ κατεδέθη τοῦ δοθῆναι ἴασιν — «не была перевязана, чтобы дать исцеление» (καταδέω — перевязывать); μάλαγμα — «припарка, пластырь» (膏薬[こうやく]); δοθῆναι ἰσχὺν ἐπιλαβέσθαι μαχαίρας — «дать силу взяться за меч». Слав. «(обязати)» в скобках — редакционная скобка, не перенесена."
  22: "συντρίψω τοὺς βραχίονας αὐτοῦ τοὺς ἰσχυροὺς καὶ τοὺς τεταμένους — «сокрушу мышцы его крепкие и протянутые (напряжённые)» (τεταμένος — 伸[の]びた); καταβαλῶ τὴν μάχαιραν αὐτοῦ ἐκ τῆς χειρὸς αὐτοῦ — «повергну меч его из руки его». Слав. добавляет третье определение «и сотреныя» (砕[くだ]かれた) — нет в LXX, внесено без 〔…〕; в Синодальном «здоровую и переломленную» (МТ)."
  23: "διασπερῶ Αἴγυπτον εἰς τὰ ἔθνη — «рассею Египет по народам» (διασπείρω); λικμήσω αὐτοὺς εἰς τὰς χώρας — «развею их по странам» (λικμάω — веять). Формула 29:12; 30:26."
  24: "κατισχύσω τοὺς βραχίονας βασιλέως Βαβυλῶνος — «укреплю мышцы царя Вавилонского» (κατισχύω); δώσω τὴν ῥομφαίαν μου εἰς τὴν χεῖρα αὐτοῦ — «дам меч Мой в руку его»; ἐπάξει αὐτὴν ἐπ᾽ Αἴγυπτον — «наведёт его на Египет»; προνομεύσει τὴν προνομὴν αὐτῆς καὶ σκυλεύσει τὰ σκῦλα αὐτῆς — «расхитит добычу её и ограбит добычу её». В Синодальном добавлено «мышцы же фараона сокрушу… будет сильно стонать» (МТ) — не внесено."
  25: "ἐνισχύσω τοὺς βραχίονας βασιλέως Βαβυλῶνος — «укреплю мышцы царя Вавилонского»; οἱ δὲ βραχίονες Φαραω πεσοῦνται — «мышцы же фараона падут»; ἐν τῷ δοῦναι τὴν ῥομφαίαν μου εἰς χεῖρας βασιλέως Βαβυλῶνος — «когда дам меч Мой в руки царя Вавилонского»; ἐκτενεῖ αὐτὴν ἐπὶ γῆν Αἰγύπτου — «прострет его на землю Египетскую» (ἐκτείνω — простирать, 伸[の]べる)."
  26: "διασπερῶ Αἴγυπτον εἰς τὰ ἔθνη καὶ λικμήσω αὐτοὺς εἰς τὰς χώρας — «рассею Египет по народам и развею их по странам» (повтор 30:23); γνώσονται πάντες ὅτι ἐγὼ κύριος — «узнают все, что Я Господь»: формула с πάντες, как в слав. («уведят вси»). Здесь слово Господа и глава закрываются."
