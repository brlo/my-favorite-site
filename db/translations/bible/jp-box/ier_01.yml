chapter: 1
draft: true

verses:
  1: "エレミヤに臨[のぞ]んだ神[かみ]の言葉[ことば]。彼[かれ]はベニヤミンの地[ち]、アナトトに住[す]んでいた祭司[さいし]の一人[ひとり]、ヒルキヤの子[こ]であった。"
  2: "ヨシヤ、すなわちアモスの子[こ]であるユダの王[おう]の時代[じだい]、その治世[ちせい]の第十三年[だいじゅうさんねん]に、主[しゅ]の言葉[ことば]が彼[かれ]に臨[のぞ]んだ。"
  3: "また、ヨシヤの子[こ]であるユダの王[おう]ヨヤキムの時代[じだい]から、同じくヨシヤの子[こ]であるユダの王[おう]ゼデキヤの第十一年[だいじゅういちねん]まで、エルサレムが捕囚[ほしゅう]となった五月[ごがつ]まで、その言葉[ことば]は続[つづ]いた。"
  4: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  5: "「わたしがあなたを胎[たい]の内[うち]に形[かたち]づくる前[まえ]から、わたしはあなたを知[し]っていた。あなたが母[はは]の胎[たい]から出[で]る前[まえ]から、わたしはあなたを聖別[せいべつ]し、もろもろの民[たみ]への預言者[よげんしゃ]とした。」"
  6: "わたしは言[い]った。「ああ、主[しゅ]なる神[かみ]よ。見[み]よ、わたしは語[かた]るすべを知[し]らない。わたしはまだ若[わか]いからだ。」"
  7: "主[しゅ]はわたしに言[い]われた。「『わたしはまだ若[わか]い』と言[い]ってはならない。わたしがあなたを遣[つか]わす者[もの]のところへはどこへでも行[い]き、わたしが命[めい]じることは何[なに]でも語[かた]らなければならない。"
  8: "彼[かれ]らの顔[かお]を恐[おそ]れてはならない。わたしはあなたとともにいて、あなたを救[すく]い出[だ]すからだ、と主[しゅ]は言[い]われる。」"
  9: "主[しゅ]は御手[みて]を伸[の]べてわたしの口[くち]に触[ふ]れ、わたしに言[い]われた。「見[み]よ、わたしはわたしの言葉[ことば]をあなたの口[くち]に入[い]れた。"
  10: "今日[きょう]、わたしはあなたを諸国民[しょこくみん]と王国[おうこく]の上[うえ]に立[た]てた。根[ね]を抜[ぬ]き、打[う]ち壊[こわ]し、散[ち]らし、滅[ほろ]ぼし、また建[た]て直[なお]し、植[う]えるためである。」"
  11: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。「エレミヤよ、何[なに]を見[み]ているのか」。わたしは答[こた]えた。「アーモンドの枝[えだ]を見[み]ている」。"
  12: "主[しゅ]はわたしに言[い]われた。「よく見[み]た。わたしは、わたしの言葉[ことば]を成[な]し遂[と]げるために、目[め]を覚[さ]ましているからである。」"
  13: "主[しゅ]の言葉[ことば]が二度目[にどめ]にわたしに臨[のぞ]んで言[い]った。「何[なに]を見[み]ているのか」。わたしは答[こた]えた。「沸[わ]きたぎる釜[かま]を見[み]ている。その口[くち]は北[きた]の側[がわ]を向[む]いている」。"
  14: "主[しゅ]はわたしに言[い]われた。「災[わざわ]いは北[きた]の側[がわ]から燃[も]え起[お]こり、この地[ち]に住[す]むすべての者[もの]の上[うえ]に及[およ]ぶ。"
  15: "見[み]よ、わたしは北[きた]の地[ち]のすべての王国[おうこく]を呼[よ]び集[あつ]める、と主[しゅ]は言[い]われる。彼[かれ]らは来[き]て、おのおのその王座[おうざ]をエルサレムの門[もん]の入口[いりぐち]に、その周[まわ]りのすべての城壁[じょうへき]の上[うえ]に、ユダのすべての町々[まちまち]に据[す]える。"
  16: "わたしは彼[かれ]らに対して、そのすべての悪[あく]のゆえに裁[さば]きをもって語[かた]る。彼[かれ]らがわたしを捨[す]て、ほかの神々[かみがみ]に犠牲[ぎせい]をささげ、自分[じぶん]の手[て]の業[わざ]を拝[おが]んだからである。"
  17: "あなたは腰[こし]に帯[おび]を結[むす]び、立[た]ち上[あ]がって、わたしが命[めい]じることをすべても彼[かれ]らに語[かた]れ。彼[かれ]らの顔[かお]を恐[おそ]れず、彼らの前[まえ]でおじけてはならない。わたしはあなたとともにいて、あなたを救[すく]い出[だ]すからだ、と主[しゅ]は言[い]われる。"
  18: "見[み]よ、今日[きょう]、わたしはあなたを堅[かた]い都[みやこ]、鉄[てつ]の柱[はしら]、青銅[せいどう]の堅い城壁[じょうへき]とした。ユダの王[おう]たち、その君[きみ]たち、その祭司[さいし]たち、この地[ち]の民[たみ]に対して。"
  19: "彼[かれ]らはあなたと戦[たたか]うが、あなたに勝[か]つことはできない。わたしはあなたとともにいて、あなたを救[すく]い出[だ]すからだ、と主[しゅ]は言[い]われた。」"

notes:
  1: "Τὸ ῥῆμα τοῦ θεοῦ — «слово Божие» (не «слово Господне»); слав. «Слово Божие». ὃ ἐγένετο ἐπὶ Ιερεμιαν — «которое было к Иеремии» (ἐπί с винитивом — «к», «на»). τὸν τοῦ Χελκιου ἐκ τῶν ἱερέων — «сына Хелкии, из священников»; Хелкия — ヒルキヤ (по корпусу, ср. 4 Цар 22:4). ὃς κατῴκει ἐν Αναθωθ ἐν γῇ Βενιαμιν — «который жил в Анафофе, в земле Вениаминовой» (κατοικέω — обитать); слав. «иже обиташе во анафофе». Надписание — не речь, кавычек нет."
  2: "ὃς ἐγενήθη λόγος τοῦ θεοῦ πρὸς αὐτόν — «к которому было слово Божие»; слав. читает «слово Господне» (κυρίου), в LXX θεοῦ — по паритету в тексте «主の言葉», вариант отмечен здесь. ἐν ταῖς ἡμέραις Ιωσια υἱοῦ Αμως — «во дни Иосии, сына Амосова»: имя отца — アモス, как в корпусе (в брифе «アモツ»). ἔτους τρισκαιδεκάτου ἐν τῇ βασιλείᾳ αὐτοῦ — «в тринадцатый год царствования его»."
  3: "καὶ ἐγένετο ἐν ταῖς ἡμέραις Ιωακιμ … ἕως ἑνδεκάτου ἔτους Σεδεκια — «и было во дни Иоакима… до одиннадцатого года Седекии»: обе даты — годы царствования, отсюда «から…まで». ἕως τῆς αἰχμαλωσίας Ιερουσαλημ ἐν τῷ πέμπτῳ μηνί — «до пленения Иерусалима в пятый месяц» (αἰχμαλωσία — пленение, 捕囚); слав. «даже до пленения Иерусалимскаго в месяц пятый». Сказуемое («слово было») в греч. не повторено, взято из 1:2."
  4: "Вводная формула вне кавычек: καὶ ἐγένετο λόγος κυρίου πρός με λέγων — «и было слово Господне ко мне, говоря». Ею открывается рассказ о призвании (1:4–10)."
  5: "Πρὸ τοῦ με πλάσαι σε ἐν κοιλίᾳ — «прежде нежели Я образовал тебя во чреве» (πλάσσω — лепить, образовать; κοιλία — чрево, 胎). ἐπίσταμαί σε — «Я знаю тебя» (предвечное знание, не «узнал»). ἡγίακά σε — «Я освятил тебя» (ἁγιάζω — освящать; слав. «освятих тя»). προφήτην εἰς ἔθνη τέθεικά σε — «пророком для народов поставил тебя» (τίθημι — поставлять). Кавычки закрываются в конце стиха: ответ пророка в 1:6 — отдельная реплика."
  6: "Ответ пророка — тоже прямая речь, 「…». Ὦ δέσποτα κύριε — «о Владыко Господи» (δεσπότης — владыка, ср. 1:24); в тексте «主なる神よ», как в ru. οὐκ ἐπίσταμαι λαλεῖν — «не умею говорить». νεώτερος ἐγώ εἰμι — «я молод» (νεώτερος — младший, юный); слав. «отрок аз есмь». Дерзновение пророка не сглажено."
  7: "Μὴ λέγε ὅτι Νεώτερος ἐγώ εἰμι — «не говори: я молод»: слова «я молод» — вложенная цитата 『…』. πρὸς πάντας, οὓς ἐὰν ἐξαποστείλω σε, πορεύσῃ — «ко всем, кого Я пошлю тебя, пойдёшь» (ἐξαποστέλλω — посылать). κατὰ πάντα, ὅσα ἐὰν ἐντείλωμαί σοι, λαλήσεις — «и всё, что Я заповедаю тебе, скажешь» (ἐντέλλομαι — заповедовать). Цитата продолжается в 1:8."
  8: "μὴ φοβηθῇς ἀπὸ προσώπου αὐτῶν — «не бойся от лица их» (ἀπὸ προσώπου — «от лица», т. е. перед ними). μετὰ σοῦ ἐγώ εἰμι τοῦ ἐξαιρεῖσθαί σε — «Я с тобою, чтобы избавлять тебя» (ἐξαιρέω — вынимать, избавлять; τοῦ + инфинитив — цель). λέγει κύριος — «говорит Господь» оставлено в конце внутри кавычек."
  9: "Действие — вне кавычек, слово Господа — в кавычках. ἐξέτεινεν κύριος τὴν χεῖρα αὐτοῦ — «простёр Господь руку Свою»; ἥψατο τοῦ στόματός μου — «коснулся уст моих» (ἅπτομαι — касаться). Ἰδοὺ δέδωκα τοὺς λόγους μου εἰς τὸ στόμα σου — «вот, Я вложил слова Мои в уста твои»; перфект δέδωκα — совершённое действие, в японском прошедшее."
  10: "ἰδοὺ κατέστακά σε σήμερον ἐπὶ ἔθνη καὶ βασιλείας — «вот, Я поставил тебя в сей день над народами и царствами» (καθίστημι — ставить, назначать). Пять инфинитивов: ἐκριζοῦν (искоренять), κατασκάπτειν (срывать, разорять), ἀπολλύειν (губить), ἀνοικοδομεῖν (созидать), καταφυτεύειν (насаждать); порядок и число сохранены. Слав. даёт четыре глагола разрушения (искоренить, разорить, расточить, разрушить) против трёх в LXX; лишнее «расточиши» внесено без скобок (散らし), порядок сохранён. Кавычки закрываются в конце стиха."
  11: "Вводная формула — вне кавычек; вопрос и ответ — в кавычках. Τί σὺ ὁρᾷς, Ιερεμια — «что ты видишь, Иеремия?». Βακτηρίαν καρυΐνην — «жезл ореховый» (κάρυον — орех; слав. «жезл ореховый»). В евр. здесь игра слов שָׁקֵד (миндаль) — שֹׁקֵד (бодрствующий), в греч. она утрачена; в тексте «アーモンドの枝» по смыслу образа и по ru, буквальное «ореховый» — в notes."
  12: "Καλῶς ἑώρακας — «хорошо ты видел». ἐγρήγορα ἐγὼ ἐπὶ τοὺς λόγους μου τοῦ ποιῆσαι αὐτούς — «Я бодрствую над словами Моими, чтобы исполнить их» (γρηγορέω — бодрствовать; слав. «бдех аз над словесы моими, еже сотворити я»). Игра слов с «миндалём» (1:11) в греч. не передаётся; в японском она тоже не воспроизводится — смысл дан прямо («目を覚ましている»)."
  13: "ἐκ δευτέρου — «во второй раз» (слав. «вторицею»). Λέβητα ὑποκαιόμενον — «котёл поджигаемый, кипящий» (λέβης — котёл; ὑποκαίω — поджигать снизу); слав. «коноб поджигаемый». τὸ πρόσωπον αὐτοῦ ἀπὸ προσώπου βορρᾶ — «лицо его [обращено] от лица севера», т. е. открытая сторона котла — с севера; в тексте «口», в notes отмечено буквальное «лицо»."
  14: "Ἀπὸ προσώπου βορρᾶ ἐκκαυθήσεται τὰ κακά — «от лица севера возгорятся злые [бедствия]» (ἐκκαίω — выжигать, разжигать); слав. «от лица севера возгорятся злая». ἐπὶ πάντας τοὺς κατοικοῦντας τὴν γῆν — «на всех обитателей земли»; в тексте «この地», т. к. речь об Иудее (ср. 1:15)."
  15: "διότι ἰδοὺ ἐγὼ συγκαλῶ πάσας τὰς βασιλείας ἀπὸ βορρᾶ τῆς γῆς — «ибо вот, Я созываю все царства от севера земли» (συγκαλέω — созывать). θήσουσιν ἕκαστος τὸν θρόνον αὐτοῦ — «поставят каждый престол свой» (τίθημι). ἐπὶ τὰ πρόθυρα τῶν πυλῶν — «у преддверия ворот» (πρόθυρον — преддверие); слав. «в преддвериих врат Иерусалимских». «Говорит Господь» внутри речи оставлено в кавычках, чтобы не разрывать слово Господа."
  16: "λαλήσω πρὸς αὐτοὺς μετὰ κρίσεως — «буду говорить с ними с судом», т. е. произнесу суд (κρίσις). περὶ πάσης τῆς κακίας αὐτῶν — «о всяком зле их». ὡς ἐγκατέλιπόν με — «что они оставили Меня» (ἐγκαταλείπω). ἔθυσαν θεοῖς ἀλλοτρίοις — «принесли жертвы чужим богам» (θύω — приносить в жертву); προσεκύνησαν τοῖς ἔργοις τῶν χειρῶν αὐτῶν — «поклонились делам рук своих» (προσκυνέω)."
  17: "σὺ περίζωσαι τὴν ὀσφύν σου — «препояшь чресла твои» (περιζώννυμι; ὀσφύς — чресла, поясница): образ готовности к делу. ἀνάστηθι — «встань». μηδὲ πτοηθῇς ἐναντίον αὐτῶν — «и не устрашись пред ними» (πτοέω — устрашать); слав. «ниже устрашися пред ними». У ru (МТ) иначе: «чтобы Я не поразил тебя в глазах их» — не внесено."
  18: "τέθεικά σε … ὡς πόλιν ὀχυρὰν καὶ ὡς τεῖχος χαλκοῦν ὀχυρόν — «поставил тебя как город укреплённый и как стену медную крепкую» (χαλκοῦς — медный, бронзовый). Слав. добавляет «и в столп железный» и «и священником его» — этого нет в LXX (чтения МТ), внесено в основной текст без скобок: 鉄の柱, 祭司たち. ἅπασιν τοῖς βασιλεῦσιν Ιουδα — «всем царям Иуды»."
  19: "καὶ πολεμήσουσίν σε καὶ οὐ μὴ δύνωνται πρὸς σέ — «и будут воевать против тебя, но не смогут [против] тебя» (πολεμέω; οὐ μή с конъюнктивом — сильное отрицание). διότι μετὰ σοῦ ἐγώ εἰμι τοῦ ἐξαιρεῖσθαί σε — повтор формулы 1:8; εἶπεν κύριος — «сказал Господь». Кавычки закрываются в конце стиха, глава кончается."
