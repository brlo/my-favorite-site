# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc по Иеремии — только фрагменты (гл. 11, 12, 31); в гл. 1 его нет.
# jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 1: 1–3 надписание и даты; 4–10 призвание (предвечное знание, освящение,
# поставление пророком народов, рука у уст, полномочия над царствами); 11–12 видение
# миндальной ветви и слово о бодрствовании; 13–19 видение кипящего котла с севера,
# нашествие царств, суд за идолослужение, обетование защиты пророку.
# Голоса: 1–3 авторский текст, кавычек нет; 1:4 вводная формула вне кавычек; 1:5 「…」
# (слово Господа, закрывается в конце стиха); 1:6 「…» (ответ пророка); 1:7–8 одна
# цитата; 1:9–10 одна цитата (действие вне кавычек, слово Господа внутри); 1:11 вопрос
# и ответ — двумя короткими 「…»; 1:12 「…」; 1:13 вопрос и ответ — двумя короткими 「…»;
# 1:14–19 одна цитата (слова Господа; «と主は言われる» внутри в 1:15, 1:17, 1:19).
# Нумерация по gr: 19 стихов; в гл. 1–24 номера совпадают со слав. и ru. Внутри стихов
# слав. местами сливает (1:11 и 1:13 «(аз вижду)») — держим gr.
# 〔…〕 нет. Сносок ⟨…⟩ нет: 胎, 青銅, アナトト, アーモンド уже в корпусе или пояснены
# в notes. Имена — транслитерация греческого (LXX).
