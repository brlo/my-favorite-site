verses:
  1: "「イスラエルはよく枝[えだ]を伸[の]ばすぶどうの木[き]で、その実[み]は豊[ゆた]かである。その実[み]が増[ふ]えるにつれて祭壇[さいだん]を増[ふ]やし、その地[ち]の良[よ]いものに応[おう]じて石柱[せきちゅう]を建[た]てた。"
  2: "彼らは心[こころ]を分[わ]けた。今[いま]、彼らは滅[ほろ]ぼされる。主[しゅ]は彼らの祭壇[さいだん]を掘[ほ]り崩[くず]し、その石柱[せきちゅう]もみじめになる。"
  3: "今[いま]、彼らは言[い]う。『わたしたちには王[おう]がない。主[しゅ]を恐[おそ]れなかったからである。王[おう]がわたしたちに何[なに]をしてくれるというのか』と。"
  4: "彼らはむなしい言葉[ことば]を語[かた]り、偽[いつわ]りの口実[こうじつ]をもって契約[けいやく]を結[むす]ぶ。裁[さば]きは畑[はたけ]の荒[あ]れ地[ち]に生[は]える雑草[ざっそう]のように芽[め]を出[だ]す。"
  5: "サマリアに住[す]む者[もの]たちは、オンの家[いえ]の子牛[こうし]のゆえに寄留[きりゅう]の者[もの]となる。その民[たみ]は子牛[こうし]のために嘆[なげ]き、それを怒[いか]らせた者[もの]たちはその栄光[えいこう]を喜[よろこ]ぶ。栄光[えいこう]が彼から移[うつ]り去[さ]ったからである。"
  6: "子牛[こうし]は縛[しば]られてアッシリアへ運[はこ]ばれ、王[おう]ヤリムへの贈[おく]り物[もの]となる。エフライムは贈[おく]り物[もの]として受[う]け取[と]られ、イスラエルは自分[じぶん]の計[はかり]ごとを恥[は]じる。"
  7: "サマリアはその王[おう]を捨[す]てた。水[みず]の面[おもて]に浮[う]かぶ枯[か]れ枝[えだ]のように。"
  8: "オンの高[たか]き所[ところ]、イスラエルの罪[つみ]は取[と]り除[のぞ]かれる。茨[いばら]とあざみがその祭壇[さいだん]の上[うえ]に生[は]え、人[ひと]々[びと]は山[やま]に向[む]かって『わたしたちを覆[おお]え』と言[い]い、丘[おか]に向[む]かって『わたしたちの上[うえ]に崩[くず]れ落[お]ちよ』と言[い]う。"
  9: "丘[おか]の日[ひ]から、イスラエルは罪[つみ]を犯[おか]した。彼らはそこで立[た]ち止[と]まった。不法[ふほう]の子[こ]らに、かの丘[おか]で戦[たたか]いが及[およ]ばないはずがあるだろうか。"
  10: "わたしは彼らを懲[こら]らすために来[き]た。彼らが二[ふた]つの不法[ふほう]によって懲[こら]らされるとき、もろもろの民[たみ]が彼らに向[む]かって集[あつ]まる。"
  11: "エフライムは争[あらそ]いを愛[あい]するように仕込[しこ]まれた雌牛[めうし]である。わたしはその首[くび]の最も良[よ]い所[ところ]に臨[のぞ]み、エフライムに乗[の]り、ユダについては黙[だま]り、ヤコブは彼を強[つよ]くする。"
  12: "あなたがたは義[ぎ]のために種[たね]を蒔[ま]き、命[いのち]の実[み]のために収穫[しゅうかく]せよ。あなたがたのために知識[ちしき]の光[ひかり]をともせ。主[しゅ]を求[もと]めよ。あなたがたに義[ぎ]の実[み]が来[く]るまで。"
  13: "なぜ、あなたがたは不敬[ふけい]を黙[だま]って見過[みす]ごし、その不法[ふほう]を収穫[しゅうかく]し、偽[いつわ]りの実[み]を食[た]べたのか。あなたは自分[じぶん]の戦車[せんしゃ]と、多[おお]い兵力[へいりょく]に頼[たよ]ったからである。"
  14: "あなたの民[たみ]の中[なか]に滅[ほろ]びが起[お]こり、あなたのすべての城壁[じょうへき]は破[やぶ]られる。戦[たたか]いの日[ひ]に、サラマンがエロバアルの家[いえ]を破[やぶ]ったときのように、母[はは]は子[こ]どもたちの上[うえ]に投[な]げ落[お]とされて砕[くだ]かれる。"
  15: "イスラエルの家[いえ]よ、あなたがたの悪[あく]のゆえに、わたしはあなたがたにこうする。夜明[よあ]けと共[とも]に彼らは捨[す]てられ、イスラエルの王[おう]は捨[す]てられる」。"

notes:
  1: "Ἄμπελος εὐκληματοῦσα Ισραηλ — «Израиль — виноград, хорошо ветвящийся» (εὐκληματέω — давать хорошие ветви; слав. «виноград благолозен»); ὁ καρπὸς αὐτῆς εὐθηνῶν — «плод его обильный» (εὐθηνέω — процветать); κατὰ τὸ πλῆθος τῶν καρπῶν αὐτοῦ ἐπλήθυνεν τὰ θυσιαστήρια — «по множеству плодов его умножил жертвенники»; κατὰ τὰ ἀγαθὰ τῆς γῆς αὐτοῦ ᾠκοδόμησεν στήλας — «по благу земли его построил столбы» (στήλη — столб, стела, 石柱)."
  2: "ἐμέρισαν καρδίας αὐτῶν — «разделили сердца свои» (μερίζω — делить); νῦν ἀφανισθήσονται — «ныне истребятся» (ἀφανίζω); αὐτὸς κατασκάψει τὰ θυσιαστήρια αὐτῶν — «Он раскопает жертвенники их» (κατασκάπτω — раскапывать); ταλαιπωρήσουσιν αἱ στῆλαι αὐτῶν — «будут жалкими столбы их» (ταλαιπωρέω — бедствовать)."
  3: "νῦν ἐροῦσιν Οὐκ ἔστιν βασιλεὺς ἡμῖν — «ныне скажут: нет у нас царя»; ὅτι οὐκ ἐφοβήθημεν τὸν κύριον — «ибо не убоялись мы Господа»; ὁ βασιλεὺς τί ποιήσει ἡμῖν — «царь что сделает нам?». Слова народа — 『…』."
  4: "λαλῶν ῥήματα προφάσεις ψευδεῖς — «говорящий слова — оправдания ложные» (πρόφασις — предлог, 口実); διαθήσεται διαθήκην — «заключит завет»; ἀνατελεῖ ὡς ἄγρωστις κρίμα ἐπὶ χέρσον ἀγροῦ — «взойдёт, как сорная трава, суд на невозделанной земле поля» (ἄγρωστις — пырей; χέρσος — сухая, необработанная земля, 荒れ地)."
  5: "τῷ μόσχῳ τοῦ οἴκου Ων παροικήσουσιν οἱ κατοικοῦντες Σαμάρειαν — «у тельца дома Он будут жить пришельцами живущие в Самарии» (παροικέω — жить пришельцем; слав. «возобитают»; в ru «вострепещут»); ἐπένθησεν ὁ λαὸς αὐτοῦ ἐπ᾿ αὐτόν — «восплакал народ его о нём» (πενθέω); καθὼς παρεπίκραναν αὐτόν, ἐπιχαροῦνται ἐπὶ τὴν δόξαν αὐτοῦ — «как раздражали его, так будут радоваться о славе его» (παραπικραίνω, ἐπιχαίρω); ὅτι μετῳκίσθη ἀπ᾿ αὐτοῦ — «ибо переселилась от него» (μετοικίζω)."
  6: "αὐτὸν εἰς Ἀσσυρίους δήσαντες ἀπήνεγκαν — «его, связав, отнесли к Ассирийцам» (δέω — вязать); ξένια τῷ βασιλεῖ Ιαριμ — «дары царю Яриму» (ξένιον — дар гостя); ἐν δόματι Εφραιμ δέξεται — «в дар Ефрем будет принят» (δόμα); αἰσχυνθήσεται Ισραηλ ἐν τῇ βουλῇ αὐτοῦ — «посрамится Израиль в замысле своём» (βουλή — замысел, 計らい)."
  7: "ἀπέρριψεν Σαμάρεια βασιλέα αὐτῆς — «отринула Самария царя своего» (ἀπορρίπτω); ὡς φρύγανον ἐπὶ προσώπου ὕδατος — «как хворостина на поверхности воды» (φρύγανον — сухая ветка; слав. «аки хврастие на лицы воды»)."
  8: "ἐξαρθήσονται βωμοὶ Ων, ἁμαρτήματα τοῦ Ισραηλ — «истребятся высоты Он, грехи Израиля» (βωμός — возвышение, жертвенник; ἐξαίρω — убирать); ἄκανθαι καὶ τρίβολοι ἀναβήσονται ἐπὶ τὰ θυσιαστήρια αὐτῶν — «тернии и волчцы взойдут на жертвенниках их» (τρίβολος — волчец, あざみ); ἐροῦσιν τοῖς ὄρεσιν Καλύψατε ἡμᾶς — «скажут горам: покройте нас» (καλύπτω); τοῖς βουνοῖς Πέσατε ἐφ᾿ ἡμᾶς — «и холмам: падите на нас». Слова народа — 『…』."
  9: "Ἀφ οὗ οἱ βουνοί, ἥμαρτεν Ισραηλ — «с тех пор как (есть) холмы, грешил Израиль» (ἀφ᾿ οὗ — с того времени; слав. «отнележе холми»); ἐκεῖ ἔστησαν — «там они стали (устояли)» (ἵστημι); οὐ μὴ καταλάβῃ αὐτοὺς ἐν τῷ βουνῷ πόλεμος ἐπὶ τὰ τέκνα ἀδικίας — «не постигнет ли их на холме война против детей беззакония?» (καταλαμβάνω — застигать)."
  10: "ἦλθεν παιδεῦσαι αὐτούς — «пришёл наказать их» (παιδεύω — наказывать, 懲らす); συναχθήσονται ἐπ᾿ αὐτοὺς λαοί — «соберутся на них народы»; ἐν τῷ παιδεύεσθαι αὐτοὺς ἐν ταῖς δυσὶν ἀδικίαις αὐτῶν — «когда они будут наказаны в двух беззакониях своих» (δύο — два)."
  11: "Εφραιμ δάμαλις δεδιδαγμένη ἀγαπᾶν νεῖκος — «Ефрем — телица, обученная любить распрю» (νεῖκος — спор, 争い); ἐγὼ ἐπελεύσομαι ἐπὶ τὸ κάλλιστον τοῦ τραχήλου αὐτῆς — «Я приду на прекраснейшее шеи её» (τράχηλος — шея, 首); ἐπιβιβῶ Εφραιμ — «посажу (наложу) на Ефрема» (ἐπιβιβάζω); παρασιωπήσομαι Ιουδαν — «умолчу об Иуде» (παρασιωπάω — обходить молчанием; т.е. пощажу); ἐνισχύσει αὐτῷ Ιακωβ — «укрепит ему Иаков» (ἐνισχύω)."
  12: "σπείρατε ἑαυτοῖς εἰς δικαιοσύνην — «сейте себе в правду»; τρυγήσατε εἰς καρπὸν ζωῆς — «собирайте в плод жизни» (τρυγάω — собирать виноград); φωτίσατε ἑαυτοῖς φῶς γνώσεως — «просветите себе свет ведения» (φωτίζω); ἐκζητήσατε τὸν κύριον ἕως τοῦ ἐλθεῖν γενήματα δικαιοσύνης ὑμῖν — «взыщите Господа, доколе не придут вам плоды правды» (γένημα — плод; слав. «дондеже приидут вам жита правды»)."
  13: "ἵνα τί παρεσιωπήσατε ἀσέβειαν — «зачем вы умолчали (попустили) нечестие» (παρασιωπάω; слав. «вскую премолчасте нечестие»); τὰς ἀδικίας αὐτῆς ἐτρυγήσατε — «беззакония её собрали»; ἐφάγετε καρπὸν ψευδῆ — «съели плод ложный»; ἤλπισας ἐν τοῖς ἅρμασίν σου — «надеялся на колесницы твои» (ἐλπίζω); ἐν πλήθει δυνάμεώς σου — «на множество силы твоей»."
  14: "ἐξαναστήσεται ἀπώλεια ἐν τῷ λαῷ σου — «восстанет погибель в народе твоём» (ἀπώλεια; ἐξανίστημι); πάντα τὰ περιτετειχισμένα σου οἰχήσεται — «все обнесённые стенами у тебя погибнут» (περιτειχίζω — обносить стеной; οἴχομαι — гибнуть); ὡς ἄρχων Σαλαμαν ἐκ τοῦ οἴκου Ιεροβααλ — «как князь Саламан из дома Иероваала» (LXX Ιεροβααλ — Иероваал, он же Гедеон; エロバアル; в ru/МТ «Бет-Арбел»); ἐν ἡμέραις πολέμου μητέρα ἐπὶ τέκνοις ἠδάφισαν — «в дни войны мать с детьми повергли на землю» (ἐδαφίζω — повергать на землю, разбивать; слав. «матерь о чада разбиша»)."
  15: "οὕτως ποιήσω ὑμῖν, οἶκος τοῦ Ισραηλ — «так сделаю вам, дом Израилев»; ἀπὸ προσώπου κακιῶν ὑμῶν — «от лица зол ваших»; ὄρθρου ἀπερρίφησαν, ἀπερρίφη βασιλεὺς Ισραηλ — «на рассвете отринуты, отринут царь Израиля» (ὄρθρος — рассвет, 夜明け; ἀπορρίπτω — отбрасывать). Слав. обрывается на «от лица неправды злоб ваших» — конец стиха по LXX."
