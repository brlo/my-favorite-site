# jp-box, Осия, глава 10. Черновик для приёмки.
#
# Нумерация — по славяно-синодальной (решение автора): главы 1–2 и 11–12
# переразбиты относительно гр. модуля (слав. 1:10–11 = прежние 2:1–2;
# слав. 11:12 = прежний 12:1). Текст — с Септуагинты, слав. контроль.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# --- прежние заметки (нумерация по гр.) ---
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по gr-lxx-byz (= jp-ni); в этой главе совпадает со славяно-синодальной.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: 1–2 виноград Израиля, множество плодов — множество жертвенников, разделённое
# сердце, раскопанные жертвенники; 3–4 «нет у нас царя», слова оправдания, ложный завет,
# суд как сорняк; 5–7 телец дома Он, Самария и царь её, пленение в Ассирию, царь как
# щепка на воде; 8 высоты Он, тернии на жертвенниках, «покройте нас»; 9–10 дни холма,
# двойное беззаконие; 11 телица наученная, ярмо на шею, «умолчу об Иуде»; 12–13 сейте
# в правду, свет ведения, «зачем умолчали нечестие»; 14–15 погибель в народе, Саламан,
# мать с детьми, «на рассвете отринут царь Израиля».
# Голоса: 1–15 — одно слово Господа в 「…」 (в 3 слова народа — 『…』; в 8 слова народа
# к горам и холмам — 『…』; закрывается в 15).
# 10:5: «παροικήσουσιν» — «будут жить пришельцами» (слав. «возобитают»; в ru «вострепещут»).
# 10:11: «παρασιωπήσομαι Ιουδαν» — «умолчу об Иуде», т.е. пощажу; передано буквально.
# 10:14: LXX «ἐκ τοῦ οἴκου Ιεροβααλ» — «из дома Иероваала» (в ru/МТ «Бет-Арбел»).
#
