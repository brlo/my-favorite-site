# jp-box, Иезекииль, глава 9. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 9 (совпадает), 11 стихов.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Глава 9: 1–2 шесть мужей с орудиями истребления и муж в подире с поясом; 3–4 знак
# на челах стенающих; 5–7 избиение, начиная от святилища; 8 молитва пророка;
# 9–10 ответ Господа; 11 отчёт мужа в подире.
# Голоса: 9:1 「…」 (глас Господа); 9:2–3 повествование; 9:4 「…」; 9:5–6 одна цитата;
# 9:7 「…」; 9:8 молитва пророка 「…」; 9:9–10 одна речь Господа 「…」 (в 9 слова народа —
# 『…』); 9:11 「…». Вводные формулы — вне кавычек.
# csl-добавление (нет в LXX): 9:10 «И аз есмь» — в основном тексте без 〔…〕. Слав.
# редакционные скобки (9:2 «(погубления)», 9:7 «(сущих во граде)», 9:8 «(горе,)»)
# не внесены. ποδήρης — 足もとまで届く衣; αἴθριον (слав. «непокровенное дому») —
# 家の開けた所; σημεῖον — 印.

tr_code: jp-box
book: iez
chapter: 9
draft: true

verses:
  1: "大[おお]きな声[こえ]がわたしの耳[みみ]に叫[さけ]んだ。「都[みやこ]の報復[ほうふく]が近[ちか]づいた。」そして、おのおのの手[て]に滅[ほろ]ぼす器[うつわ]があった。"
  2: "見[み]よ、六人[ろくにん]の者[もの]が、北[きた]に面[めん]した高[たか]い門[もん]の道[みち]から来[き]た。おのおのの手[て]に斧[おの]があった。彼[かれ]らの中[なか]に一人[ひとり]の者[もの]がいて、足[あし]もとまで届[とど]く衣[ころも]を着[き]、腰[こし]にサファイアの帯[おび]をしていた。彼[かれ]らは入[はい]って来[き]て、青銅[せいどう]の祭壇[さいだん]のそばに立[た]った。"
  3: "イスラエルの神[かみ]の栄光[えいこう]は、その上[うえ]にあったケルビムから離[はな]れて、家[いえ]の開[ひら]けた所[ところ]へ上[のぼ]った。主[しゅ]は、足[あし]もとまで届[とど]く衣[ころも]を着[き]、腰[こし]に帯[おび]をした者[もの]を呼[よ]んだ。"
  4: "主[しゅ]は彼[かれ]に言[い]われた。「エルサレムのただ中[なか]を通[とお]り、その中[なか]で行[おこな]われているすべての不法[ふほう]のゆえに嘆[なげ]き、苦[くる]しむ男[おとこ]たちの額[ひたい]に印[しるし]を付[つ]けよ。」"
  5: "また、わたしが聞[き]いているときに、彼[かれ]らに言[い]われた。「彼[かれ]の後[あと]について都[みやこ]へ行[い]き、打[う]ち殺[ころ]せ。あなたがたの目[め]で惜[お]しむな、あわれむな。"
  6: "老[お]いた者[もの]も若[わか]い者[もの]も、処女[おとめ]も幼子[おさなご]も女[おんな]たちも、滅[ほろ]ぼし尽[つ]くすまで打[う]ち殺[ころ]せ。しかし、印[しるし]のある者[もの]にはだれにも近[ちか]づくな。わたしの聖[せい]なる者[もの]たちから始[はじ]めよ。」そこで彼[かれ]らは、家[いえ]の内[うち]にいた老[お]いた者[もの]たちから始[はじ]めた。"
  7: "彼[かれ]らに言[い]われた。「家[いえ]を汚[けが]し、死人[しにん]で道[みち]を満[み]たせ。出[で]て行[い]って打[う]ち殺[ころ]せ。」"
  8: "彼[かれ]らが打[う]ち殺[ころ]しているとき、わたしは残[のこ]されて、顔[かお]を地[ち]に伏[ふ]し、叫[さけ]んで言[い]った。「ああ、主[しゅ]なる神[かみ]よ。あなたがエルサレムに怒[いか]りを注[そそ]がれるとき、イスラエルの残[のこ]りの者[もの]を滅[ほろ]ぼし尽[つ]くされるのですか。」"
  9: "主[しゅ]はわたしに言[い]われた。「イスラエルの家[いえ]とユダの不法[ふほう]は、甚[はなは]だしく甚[はなは]だしく大[おお]きくなった。地[ち]は多[おお]くの民[たみ]で満[み]ち、都[みやこ]は不法[ふほう]と汚[けが]れで満[み]ちている。彼[かれ]らは言[い]った。『主[しゅ]は地[ち]を捨[す]てた。主[しゅ]は見[み]ていない』と。"
  10: "わたしは惜[お]しまない。わたしの目[め]は惜[お]しまず、あわれまない。わたしは彼[かれ]らの道[みち]を彼[かれ]らの頭[あたま]に返[かえ]した。」"
  11: "見[み]よ、足[あし]もとまで届[とど]く衣[ころも]を着[き]、腰[こし]に帯[おび]をした者[もの]が答[こた]えて言[い]った。「わたしは、あなたが命[めい]じられたとおりに行[おこな]いました。」"

notes:
  1: "καὶ ἀνέκραγεν εἰς τὰ ὦτά μου φωνῇ μεγάλῃ λέγων — «и воззвал в уши мои гласом великим, говоря» (ἀνακράζω — вскричать); Ἤγγικεν ἡ ἐκδίκησις τῆς πόλεως — «приблизилось отмщение города» (ἐκδίκησις — возмездие, 報復); ἕκαστος εἶχεν τὰ σκεύη τῆς ἐξολεθρεύσεως ἐν χειρὶ αὐτοῦ — «каждый имел сосуды (орудия) истребления в руке своей» (σκεῦος — сосуд, орудие). Подлежащее в LXX не названо; по контексту — Господь, поэтому 大[おお]きな声[こえ]が…叫んだ."
  2: "ἓξ ἄνδρες — «шесть мужей»; ἀπὸ τῆς ὁδοῦ τῆς πύλης τῆς ὑψηλῆς τῆς βλεπούσης πρὸς βορρᾶν — «от пути ворот высоких, обращённых к северу»; πέλυξ — «боевой топор» (斧); ἐνδεδυκὼς ποδήρη — «одетый в подир», длинную до ног одежду (ποδήρης, 足もとまで届く衣); ζώνη σαπφείρου — «пояс из сапфира» (σάπφειρος); ἐχόμενοι τοῦ θυσιαστηρίου τοῦ χαλκοῦ — «близ жертвенника медного» (χαλκοῦς — медный, 青銅). Слав. в скобках «(погубления)» — редакционная помета, не внесена."
  3: "δόξα θεοῦ τοῦ Ισραηλ ἀνέβη ἀπὸ τῶν χερουβιν — «слава Бога Израилева поднялась с херувимов»; εἰς τὸ αἴθριον τοῦ οἴκου — «на открытое место дома» (αἴθριον — открытое, непокрытое место, порог; слав. «в непокровенное дому», отсюда 家の開けた所). ἐκάλεσεν τὸν ἄνδρα — «призвал мужа» (подлежащее — Господь); ὃς εἶχεν ἐπὶ τῆς ὀσφύος αὐτοῦ τὴν ζώνην — «который имел на чреслах своих пояс»; в LXX здесь пояс без «сапфировый»."
  4: "Δίελθε μέσην τὴν Ιερουσαλημ — «пройди посреди Иерусалима»; δὸς τὸ σημεῖον ἐπὶ τὰ μέτωπα — «дай знак на чела» (σημεῖον — знак, 印; μέτωπον — лоб, 額); τῶν καταστεναζόντων καὶ τῶν κατωδυνωμένων — «стенающих и болезнующих» (καταστενάζω — тяжко вздыхать; κατοδυνάω — страдать); ἐπὶ πάσαις ταῖς ἀνομίαις — «о всех беззакониях»."
  5: "εἶπεν ἀκούοντός μου — «сказал в слух мой» (причастие абсолютное); Πορεύεσθε ὀπίσω αὐτοῦ εἰς τὴν πόλιν — «идите за ним в город»; καὶ κόπτετε — «и убивайте» (κόπτω — рубить, убивать); μὴ φείδεσθε τοῖς ὀφθαλμοῖς ὑμῶν — «не щадите очами вашими»; μὴ ἐλεήσητε — «не помилуйте»."
  6: "πρεσβύτερον καὶ νεανίσκον καὶ παρθένον καὶ νήπια καὶ γυναῖκας — «старца и юношу, и деву, и младенцев, и жён»; ἀποκτείνατε εἰς ἐξάλειψιν — «убейте в истребление» (ἐξάλειψις — уничтожение, 滅ぼし尽くす); ἐφ' οὕς ἐστιν τὸ σημεῖον, μὴ ἐγγίσητε — «к тем, на ком знак, не приближайтесь» (ἐγγίζω); ἀπὸ τῶν ἁγίων μου ἄρξασθε — «от святых Моих начните» (ἅγιοι — святые/святыни; слав. «от освященных моих»); ἀπὸ τῶν ἀνδρῶν τῶν πρεσβυτέρων, οἳ ἦσαν ἔσω ἐν τῷ οἴκῳ — «с мужей старейшин, которые были внутри дома». Стих продолжает повеление 9:5 (одна цитата)."
  7: "Μιάνατε τὸν οἶκον — «оскверните дом» (μιαίνω); πλήσατε τὰς ὁδοὺς νεκρῶν — «наполните пути мёртвыми» (νεκρός); ἐκπορευόμενοι — «выходя»; καὶ κόπτετε — «и убивайте». Слав. в скобках «(сущих во граде)» — редакционная помета, не внесена."
  8: "ἐν τῷ κόπτειν αὐτοὺς — «когда они убивали»; πίπτω ἐπὶ πρόσωπόν μου — «падаю на лицо моё» (исторический презенс); Οἴμμοι, κύριε — «о, горе мне, Господи» (οἴμμοι — возглас скорби); ἐξαλείφεις σὺ τοὺς καταλοίπους τοῦ Ισραηλ — «неужели Ты истребляешь остаток Израиля» (κατάλοιπος — остаток); ἐν τῷ ἐκχέαι σε τὸν θυμόν σου — «когда изливаешь ярость Твою». Молитва пророка — 「…」. Слав. в скобках «(горе,)» — двойное чтение, не внесено."
  9: "Ἀδικία τοῦ οἴκου Ισραηλ καὶ Ιουδα μεμεγάλυνται σφόδρα σφόδρα — «неправда дома Израилева и Иудина возвеличилась весьма, весьма» (μεγαλύνω); ἐπλήσθη ἡ γῆ λαῶν πολλῶν — «земля наполнилась многими народами»; ἀδικίας καὶ ἀκαθαρσίας — «неправды и нечистоты»; Ἐγκαταλέλοιπεν κύριος τὴν γῆν, οὐκ ἐφορᾷ ὁ κύριος — «оставил Господь землю, не видит Господь» (ἐφοράω — наблюдать). Слова народа — 『…』. Стих вместе с 9:10 — одна речь Господа."
  10: "οὐ φείσεταί μου ὁ ὀφθαλμός — «не пощадит око Моё»; τὰς ὁδοὺς αὐτῶν εἰς κεφαλὰς αὐτῶν δέδωκα — «пути их на головы их Я отдал» (слав. «пути их на главы их дах»). Слав. начинает «И аз есмь» — тёмное добавление, которого нет в LXX (передано わたしは)."
  11: "ὁ ἀνὴρ ὁ ἐνδεδυκὼς τὸν ποδήρη καὶ ἐζωσμένος τῇ ζώνῃ — «муж, одетый в подир и опоясанный поясом»; ἀπεκρίνατο λέγων — «отвечал, говоря»; Πεποίηκα καθὼς ἐνετείλω μοι — «я сделал, как Ты повелел мне» (совершённое время). Слав. «отвещаваше» — имперфект."
