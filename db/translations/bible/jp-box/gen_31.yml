verses:
  1: "ヤコブは、ラバンの子[こ]らが「ヤコブはわたしたちの父[ちち]のものをすべて取[と]り、わたしたちの父[ちち]のものからこのすべての富[とみ]を作[つく]り上[あ]げた」と言[い]うのを聞[き]いた。"
  2: "またヤコブは、ラバンの顔色[かおいろ]が、昨日[きのう]や一昨日[おととい]のようには自分[じぶん]に対[たい]していないのを見[み]た。"
  3: "主[しゅ]はヤコブに言[い]われた。「あなたの父[ちち]の地[ち]へ、あなたの一族[いちぞく]のところへ帰[かえ]りなさい。わたしはあなたとともにいる。」"
  4: "ヤコブは人[ひと]を遣[つか]わして、ラケルとレアを、群[む]れのいる野[の]へ呼[よ]んだ。"
  5: "そして彼女[かのじょ]らに言[い]った。「わたしは、あなたがたの父[ちち]の顔色[かおいろ]が、昨日[きのう]や一昨日[おととい]のようにはわたしに対[たい]していないのを見[み]ている。しかし、わたしの父[ちち]の神[かみ]がわたしとともにいてくださった。"
  6: "あなたがた自身[じしん]も知[し]っているとおり、わたしは力[ちから]の及[およ]ぶかぎり、あなたがたの父[ちち]に仕[つか]えてきた。"
  7: "しかし、あなたがたの父[ちち]はわたしを欺[あざむ]き、わたしの報酬[ほうしゅう]を十匹[じゅっぴき]の子羊[こひつじ]と取[と]り替[か]えた。それでも神[かみ]は、彼[かれ]がわたしに害[がい]を加[くわ]えることをお許[ゆる]しにならなかった。"
  8: "彼[かれ]が『ぶちのものがあなたの報酬[ほうしゅう]となる』と言[い]えば、羊[ひつじ]はすべてぶちのものを産[う]んだ。また『白[しろ]いものがあなたの報酬[ほうしゅう]となる』と言[い]えば、羊[ひつじ]はすべて白[しろ]いものを産[う]んだ。"
  9: "こうして神[かみ]は、あなたがたの父[ちち]の家畜[かちく]をすべて取[と]り上[あ]げて、わたしに与[あた]えられたのだ。"
  10: "羊[ひつじ]が身[み]ごもる時[とき]になると、わたしは夢[ゆめ]のうちに目[め]で見[み]た。見[み]よ、羊[ひつじ]と山羊[やぎ]の上[うえ]に上[のぼ]る雄山羊[おやぎ]や雄羊[おひつじ]は、白[しろ]みのあるもの、ぶちのもの、灰[はい]色[いろ]の斑点[はんてん]のあるものだった。"
  11: "神[かみ]の天使[てんし]が夢[ゆめ]のうちにわたしに言[い]った。『ヤコブよ。』わたしは何[なに]かと答[こた]えた。"
  12: "そして言[い]った。『目[め]を上[あ]げて、羊[ひつじ]と山羊[やぎ]の上[うえ]に上[のぼ]る雄山羊[おやぎ]と雄羊[おひつじ]が、白[しろ]みのあるもの、ぶちのもの、灰[はい]色[いろ]の斑点[はんてん]のあるものであるのを見[み]よ。わたしは、ラバンがあなたにしているすべてのことを見[み]たからである。"
  13: "わたしは、あなたがわたしに油[あぶら]を注[そそ]いで石柱[いしばしら]を立[た]て、誓[ちか]いを立[た]てた神[かみ]の場所[ばしょ]、すなわちベテルで、あなたに現[あらわ]れた神[かみ]である。今[いま]、立[た]って、この地[ち]を出[で]て、あなたの生[う]まれた地[ち]へ帰[かえ]りなさい。わたしはあなたとともにいる。』」"
  14: "ラケルとレアは答[こた]えて彼[かれ]に言[い]った。「わたしたちには、もはや父[ちち]の家[いえ]に分[わ]け前[まえ]も嗣業[しぎょう]もないのでしょうか。"
  15: "わたしたちは彼[かれ]にとって、よそ者[もの]のように見[み]なされているではありませんか。彼[かれ]はわたしたちを売[う]り、わたしたちの銀[ぎん]を食[く]い尽[つ]くしてしまいました。"
  16: "神[かみ]がわたしたちの父[ちち]から取[と]り上[あ]げたすべての富[とみ]と栄[さか]えは、わたしたちとわたしたちの子[こ]どもたちのものとなります。だから今[いま]、神[かみ]があなたに言[い]われたことをすべて行[おこな]ってください。」"
  17: "ヤコブは立[た]ち上[あ]がり、自分[じぶん]の妻[つま]たちと子[こ]どもたちをらくだに乗[の]せ、"
  18: "自分[じぶん]のすべての財産[ざいさん]、メソポタミアで手[て]に入[い]れたすべての家財[かざい]、自分[じぶん]のすべてのものを連[つ]れて行[い]き、父[ちち]イサクのもと、カナンの地[ち]へ向[む]かおうとした。"
  19: "ラバンは羊[ひつじ]の毛[け]を刈[か]りに出[で]かけた。その間[あいだ]に、ラケルは父[ちち]のテラフィム⟨家[いえ]の守[まも]り神[がみ]として祀[まつ]られた小[ちい]さな像[ぞう]。⟩を盗[ぬす]んだ。"
  20: "ヤコブは、自分[じぶん]が逃[に]げ去[さ]ることをシリア人[じん]ラバンに告[つ]げないまま、彼[かれ]から身[み]を隠[かく]した。"
  21: "彼[かれ]は自分[じぶん]と自分のすべてのものとともに逃[に]げ、川[かわ]を渡[わた]って、ギレアデの山[やま]へ向[む]かった。"
  22: "三日目[みっかめ]になって、ヤコブが逃[に]げたことがシリア人[じん]ラバンに告[つ]げられた。"
  23: "彼[かれ]は自分[じぶん]の一族[いちぞく]をすべて連[つ]れて、七日[なのか]の道[みち]を彼[かれ]の後[あと]を追[お]って行[い]き、ギレアデの山[やま]で彼[かれ]に追[お]いついた。"
  24: "神[かみ]は夜[よる]、夢[ゆめ]のうちにシリア人[じん]ラバンのもとへ来[き]て言[い]われた。「自分[じぶん]を慎[つつし]みなさい。ヤコブに対して、悪[わる]いことを何[なに]ひとつ語[かた]ってはならない。」"
  25: "ラバンはヤコブに追[お]いついた。ヤコブは山[やま]に自分[じぶん]の天幕[てんまく]を張[は]っていた。ラバンもギレアデの山[やま]に自分[じぶん]の一族[いちぞく]を配置[はいち]した。"
  26: "ラバンはヤコブに言[い]った。「あなたは何[なに]をしたのか。なぜ、ひそかに逃[に]げ、わたしを盗[ぬす]み、わたしの娘[むすめ]たちを剣[つるぎ]で奪[うば]われた捕虜[ほりょ]のように連[つ]れて行[い]ったのか。"
  27: "もしわたしに告[つ]げていたなら、わたしは喜[よろこ]びと音楽[おんがく]、太鼓[たいこ]と竪琴[たてごと]をもってあなたを送[おく]り出[だ]したものを。"
  28: "わたしは自分[じぶん]の子[こ]どもたちや娘[むすめ]たちに口[くち]づけすることも許[ゆる]されなかった。今[いま]、あなたは愚[おろ]かなことをした。"
  29: "今[いま]、わたしの手[て]はあなたに害[がい]を加[くわ]える力[ちから]を持[も]っている。しかし、あなたの父[ちち]の神[かみ]が昨日[きのう]、わたしに言[い]われた。『自分[じぶん]を慎[つつし]みなさい。ヤコブに対して、悪[わる]いことを何[なに]ひとつ語[かた]ってはならない。』"
  30: "今[いま]、あなたは去[さ]って行[い]った。あなたは父[ちち]の家[いえ]へ帰[かえ]ることを切[せつ]に望[のぞ]んでいたからである。しかし、なぜわたしの神々[かみがみ]を盗[ぬす]んだのか。」"
  31: "ヤコブは答[こた]えてラバンに言[い]った。「わたしは、あなたが娘[むすめ]たちを、またわたしのすべてのものを、わたしから奪[うば]うのではないかと思[おも]ったからです。"
  32: "あなたのものがわたしのところにあれば、それを見分[みわ]けて取[と]りなさい。」ラバンは彼[かれ]のところに何[なに]ひとつ見[み]つけられなかった。ヤコブは言[い]った。「あなたの神々[かみがみ]が見[み]つかった者[もの]は、わたしたちの一族[いちぞく]の前[まえ]で生[い]きてはいられない。」ヤコブは、自分[じぶん]の妻[つま]ラケルがそれらを盗[ぬす]んだことを知[し]らなかった。"
  33: "ラバンは入[はい]ってレアの天幕[てんまく]を探[さが]したが、見[み]つからなかった。レアの天幕[てんまく]を出[で]て、ヤコブの天幕[てんまく]、二[ふた]人[り]の女奴隷[おんなどれい]の天幕[てんまく]を探[さが]したが、見[み]つからなかった。彼[かれ]はラケルの天幕[てんまく]にも入[はい]った。"
  34: "ラケルはテラフィムを取[と]って、らくだの荷物[にもつ]の中[なか]に入[い]れ、その上[うえ]に座[すわ]っていた。"
  35: "彼女[かのじょ]は父[ちち]に言[い]った。「わたしの主人[しゅじん]よ、怒[いか]らないでください。あなたの前[まえ]に立[た]つことができないのです。女[おんな]の習[なら]いのことが、わたしにあるからです。」ラバンは家[いえ]じゅうを探[さが]したが、テラフィムは見[み]つからなかった。"
  36: "ヤコブは怒[いか]ってラバンと争[あらそ]った。ヤコブは答[こた]えてラバンに言[い]った。「わたしの不正[ふせい]は何[なに]か、わたしの罪[つみ]は何[なに]か。あなたはなぜ、わたしの後[あと]を追[お]って来[き]たのか。"
  37: "また、なぜわたしのすべての器[うつわ]を探[さが]したのか。あなたの家[いえ]のすべての器[うつわ]の中[なか]から、何[なに]を見[み]つけたのか。ここに、わたしの一族[いちぞく]とあなたの一族[いちぞく]の前[まえ]に置[お]きなさい。彼[かれ]らがわたしたち二人[ふたり]の間[あいだ]を裁[さば]くであろう。"
  38: "この二十年[にじゅうねん]、わたしはあなたとともにいた。あなたの羊[ひつじ]も山羊[やぎ]も子[こ]を産[う]めないことはなかった。あなたの羊[ひつじ]の雄羊[おひつじ]をわたしが食[た]べたこともない。"
  39: "獣[けもの]に引[ひ]き裂[さ]かれたものを、わたしはあなたに持[も]って行[い]かなかった。その損[そん]はわたしが自分[じぶん]で償[つぐな]った。昼[ひる]に盗[ぬす]まれたものも、夜[よる]に盗[ぬす]まれたものも。"
  40: "わたしは昼[ひる]は暑[あつ]さに焼[や]かれ、夜[よる]は霜[しも]に凍[こご]え、眠[ねむ]りはわたしの目[め]から離[はな]れ去[さ]った。"
  41: "この二十年[にじゅうねん]、わたしはあなたの家[いえ]にいた。あなたの二[ふた]人[り]の娘[むすめ]のために十四年[じゅうよねん]、あなたの羊[ひつじ]のために六[ろく]年[ねん]、わたしはあなたに仕[つか]えた。それなのに、あなたはわたしの報酬[ほうしゅう]を十匹[じゅっぴき]の子羊[こひつじ]でだました。"
  42: "わたしの父[ちち]アブラハムの神[かみ]と、イサクの恐[おそ]れとが、わたしとともにいてくださらなかったなら、あなたは今[いま]、わたしを空[から]の手[て]で送[おく]り出[だ]していただろう。神[かみ]はわたしの身[み]の低[ひく]さと、わたしの手[て]の労苦[ろうく]をご覧[らん]になり、昨日[きのう]、あなたを責[せ]められた。」"
  43: "ラバンは答[こた]えてヤコブに言[い]った。「娘[むすめ]たちはわたしの娘[むすめ]、子[こ]らはわたしの子[こ]、家畜[かちく]はわたしの家畜[かちく]、あなたが見[み]るすべてのものは、わたしのもの、わたしの娘[むすめ]たちのものである。今日[きょう]、この娘[むすめ]たちや、彼女[かのじょ]らが産[う]んだ子[こ]らに、わたしは何[なに]ができようか。"
  44: "さあ、わたしとあなたとで契約[けいやく]を結[むす]ぼう。それが、わたしとあなたの間[あいだ]の証[あかし]となるように。」ヤコブは彼[かれ]に言[い]った。「見[み]よ、わたしたちの間[あいだ]にはだれもいない。見[み]よ、神[かみ]がわたしとあなたの間[あいだ]の証人[しょうにん]である。」"
  45: "ヤコブは石[いし]を取[と]って、それを石柱[いしばしら]として立[た]てた。"
  46: "ヤコブは自分[じぶん]の一族[いちぞく]に言[い]った。「石[いし]を集[あつ]めなさい。」人々[ひとびと]は石[いし]を集[あつ]めて石塚[いしづか]を築[きず]き、その石塚[いしづか]の上[うえ]で食[た]べ、飲[の]んだ。ラバンは彼[かれ]に言[い]った。「この石塚[いしづか]は、今日[きょう]、わたしとあなたの間[あいだ]の証[あかし]である。」"
  47: "ラバンはそれを「証[あかし]の石塚[いしづか]」と呼[よ]び、ヤコブはそれを「証人[しょうにん]の石塚[いしづか]」と呼[よ]んだ。"
  48: "ラバンは言[い]った。「見[み]よ、この石塚[いしづか]と、わたしとあなたの間[あいだ]に立[た]てたこの石柱[いしばしら]を。この石塚[いしづか]は証[あかし]し、この石柱[いしばしら]も証[あかし]する。それゆえ、その名[な]は『証[あかし]の石塚[いしづか]』と呼[よ]ばれた。"
  49: "また『幻[まぼろし]』とも呼[よ]ばれた。わたしたちが互[たが]いに離[はな]れるとき、神[かみ]がわたしとあなたの間[あいだ]を顧[かえり]みられる、というのである。"
  50: "もしあなたがわたしの娘[むすめ]たちを苦[くる]しめ、わたしの娘[むすめ]たちのほかにも妻[つま]を迎[むか]えるなら、見[み]よ、わたしたちの間[あいだ]にはだれもいない。」"
  51: "ラバンはヤコブに言[い]った。「見[み]よ、この石塚[いしづか]は証人[しょうにん]、この石柱[いしばしら]も証人[しょうにん]である。」"
  52: "「もしわたしが、あるいはあなたが、この石塚[いしづか]とこの石柱[いしばしら]を越[こ]えて、悪[あく]のために行[ゆ]き来[き]することがあれば、"
  53: "アブラハムの神[かみ]、ナホルの神[かみ]が、わたしたちの間[あいだ]を裁[さば]かれるように。」ヤコブは父[ちち]イサクの恐[おそ]れによって誓[ちか]った。"
  54: "ヤコブは山[やま]でいけにえをささげ、自分[じぶん]の一族[いちぞく]を呼[よ]んだ。人々[ひとびと]は食[た]べ、飲[の]み、山[やま]で眠[ねむ]った。"
  55: "ラバンは朝[あさ]早[はや]く起[お]き、自分[じぶん]の息子[むすこ]たちと娘[むすめ]たちに口[くち]づけし、彼[かれ]らを祝福[しゅくふく]して、引[ひ]き返[かえ]し、自分[じぶん]の場所[ばしょ]へ帰[かえ]って行[い]った。"

notes:
  1: "Ἤκουσεν — 聞いた (ἀκούω). τὰ ῥήματα τῶν υἱῶν Λαβαν λεγόντων — ラバンの子らが…と言うのを (родительный при причастии). Εἴληφεν — 取った (perfect, «уже взял»). δόξαν — 富 (δόξα здесь «богатство, слава»; слав. «славу»)."
  2: "τὸ πρόσωπον τοῦ Λαβαν — ラバンの顔色 (букв. «лицо»). οὐκ ἦν πρὸς αὐτὸν ὡς ἐχθὲς καὶ τρίτην ἡμέραν — 昨日や一昨日のようには自分に対していない (ἐχθές — «вчера»; τρίτην ἡμέραν — «третьего дня»)."
  3: "Ἀποστρέφου — 帰りなさい (императив настоящего времени, «поворачивай»). εἰς τὴν γενεάν σου — あなたの一族のところへ (γενεά — «род»; слав. «в род твой»). ἔσομαι μετὰ σοῦ — わたしはあなたとともにいる."
  4: "ἀποστεῖλας…ἐκάλεσεν — 人を遣わして呼んだ (ἀποστέλλω, καλέω). εἰς τὸ πεδίον οὗ τὰ ποίμνια — 群れのいる野へ (πεδίον — «поле, равнина»)."
  5: "Ὁρῶ ἐγὼ τὸ πρόσωπον — わたしは顔色を見ている. ἦν μετ᾿ ἐμοῦ — ともにいてくださった (несовершенный вид — постоянное попечение)."
  6: "ἐν πάσῃ τῇ ἰσχύι μου — 力の及ぶかぎり (букв. «всей крепостью моею»). δεδούλευκα — perfect: «служил и служу» (слав. «работах»)."
  7: "παρεκρούσατό με — 欺いた (παρακρούομαι — «обмануть, отвести»). ἤλλαξεν τὸν μισθόν μου τῶν δέκα ἀμνῶν — 報酬を十匹の子羊と取り替えた (ἀλλάσσω; родительный «десяти агнцев» — в масоретском «десять раз», ср. 31:41; буквальное чтение сохранено). οὐκ ἔδωκεν αὐτῷ ὁ θεὸς κακοποιῆσαί με — 神は彼がわたしに害を加えることをお許しにならなかった."
  8: "ἐὰν οὕτως εἴπῃ — 彼が…と言えば. τὰ ποικίλα / τὰ λευκά — ぶちのもの / 白いもの (слова Лавана внутри речи Иакова — 『…』). τέξεται πάντα τὰ πρόβατα — 羊はすべて…を産んだ (будущее в значении следствия)."
  9: "ἀφείλατο — 取り上げた (ἀφαιρέομαι). πάντα τὰ κτήνη — 家畜をすべて."
  10: "ἐνεκίσσων — 身ごもる (несовершенный вид от ἐγκισσάω). ἀναβαίνοντες ἦσαν ἐπὶ τὰ πρόβατα καὶ τὰς αἶγας — 羊と山羊の上に上る (οἱ τράγοι καὶ οἱ κριοί — козлы и бараны). σποδοειδεῖς ῥαντοί — 灰色の斑点のあるもの (σποδοειδής — «пепеловидный»)."
  11: "καθ᾿ ὕπνον — 夢のうちに. Ιακωβ — ヤコブよ (обращение). Τί ἐστιν — 何か (LXX передаёт евр. «вот я» буквально как τί ἐστιν; слав. «что есть?»)."
  12: "Ἀνάβλεψον τοῖς ὀφθαλμοῖς σου — 目を上げて見よ. ἑώρακα γὰρ ὅσα σοι Λαβαν ποιεῖ — ラバンがあなたにしているすべてを見たからである (perfect)."
  13: "ἐγώ εἰμι ὁ θεὸς ὁ ὀφθείς σοι ἐν τόπῳ θεοῦ — 神の場所、すなわちベテルで現れた神 (LXX переводит имя Вефиль: τόπος θεοῦ; ср. 28:19; jp-joc здесь даёт ワェフィリ). οὗ ἤλειψας…στήλην καὶ ηὔξω…εὐχήν — 油を注いで石柱を立て、誓いを立てた所 (οὗ — «где»). ἀνάστηθι καὶ ἔξελθε — 立ちて出でよ (императивы)."
  14: "ἀποκριθεῖσα Ραχηλ καὶ Λεια εἶπαν — 答えて言った (причастие в ед. ч. при двух подлежащих — как в греч.). μερὶς ἢ κληρονομία — 分け前や嗣業 (μερὶς — «доля»)."
  15: "ὡς αἱ ἀλλότριαι — よそ者のように (ἀλλότριος — «чужой»). λελογίσμεθα — 見なされている (perfect от λογίζομαι). κατέφαγεν καταβρώσει τὸ ἀργύριον ἡμῶν — 銀を食い尽くした (усилительный оборот: глагол и существительное одного корня; слав. «снеде снедию»)."
  16: "ὁ πλοῦτος καὶ ἡ δόξα — 富と栄え. ὅσα εἴρηκέν σοι ὁ θεός, ποίει — 神が言われたことをすべて行え (императив)."
  17: "ἐπὶ τὰς καμήλους — らくだに乗せ (ἐπί с винительным — «на»). Стих обрывается по греч. (продолжение — 18)."
  18: "τὴν ἀποσκευήν — 家財 (ἀποσκευή — «поклажа, обоз»). ἣν περιεποιήσατο — 手に入れた (περιποιέομαι — «приобретать»). ἀπελθεῖν πρὸς Ισαακ — イサクのもとへ向かうため (инфинитив цели)."
  19: "ᾤχετο κεῖραι — 毛を刈りに出かけた (κείρω — «стричь»). τὰ εἴδωλα — テラフィム (греч. «идолы»; евр. תְּרָפִים — домашние божки, ср. 31:30,32,34,35; пояснение при первом упоминании в корпусе)."
  20: "ἔκρυψεν…Λαβαν τὸν Σύρον — ラバンから身を隠した (букв. «скрыл от Лавана»; слав. «утаи от Лавана»). τοῦ μὴ ἀναγγεῖλαι — 告げないために (τοῦ + инфинитив)."
  21: "διέβη τὸν ποταμόν — 川を渡った (поток — Евфрат). ὥρμησεν εἰς τὸ ὄρος Γαλααδ — ギレアデの山へ向かった (ὁρμάω — «устремиться»; Γαλααδ — ギレアデ)."
  22: "τῇ τρίτῃ ἡμέρᾳ — 三日目に. ἀνηγγέλη — 告げられた (страдательный от ἀναγγέλλω)."
  23: "τοὺς ἀδελφοὺς αὐτοῦ — 一族 (ἀδελφοί здесь «родственники»). ὁδὸν ἡμερῶν ἑπτά — 七日のかかる道. κατέλαβεν — 追いついた (καταλαμβάνω)."
  24: "καθ᾿ ὕπνον τὴν νύκτα — 夜、夢のうちに. Φύλαξαι σεαυτόν — 自分を慎みなさい (φυλάσσω — «стеречь, беречься»). μήποτε λαλήσῃς…πονηρά — 悪いことを何ひとつ語ってはならない (μήποτε — «как бы не»)."
  25: "ἔπηξεν τὴν σκηνήν — 天幕を張った (πήγνυμι — «водружать»). ἔστησεν τοὺς ἀδελφοὺς αὐτοῦ — 一族を配置した (ἵστημι — «поставить»)."
  26: "Τί ἐποίησας — 何をしたのか. ἐκλοποφόρησάς με — わたしを盗んだ (κλοποφορέω — «обокрасть»). ὡς αἰχμαλώτιδας μαχαίρᾳ — 剣で奪われた捕虜のように (αἰχμαλωτίς — «пленница»; μαχαίρᾳ — дательный орудия)."
  27: "μετ᾿ εὐφροσύνης καὶ μετὰ μουσικῶν — 喜びと音楽をもって (μουσικά — «музыка, певцы и инструменты»). τυμπάνων καὶ κιθάρας — 太鼓と竪琴 (τύμπανον — «бубен, тимпан»; κιθάρα — «кифара»)."
  28: "οὐκ ἠξιώθην καταφιλῆσαι — 口づけすることも許されなかった (ἀξιόω — «удостоить»). ἀφρόνως ἔπραξας — 愚かなことをした (ἀφρόνως — «неразумно»)."
  29: "ἰσχύει ἡ χείρ μου κακοποιῆσαί σε — わたしの手はあなたに害を加える力を持っている (ἰσχύω — «быть в силах»). ἐχθές — 昨日 (то есть прошлой ночью, ср. 31:24)."
  30: "πεπόρευσαι — 去って行った (perfect). ἐπιθυμίᾳ ἐπεθύμησας — 切に望んでいた (усилительный оборот: глагол и существительное одного корня). τοὺς θεούς μου — わたしの神々 (о терафимах, ср. 31:19)."
  31: "Εἶπα γάρ — わたしは思ったからです (γάρ; слав. «рех бо»: «сказал [себе]»). Μήποτε ἀφέλῃς — 奪うのではないかと (μήποτε + сослагательное)."
  32: "ἐπίγνωθι — 見分けなさい (ἐπιγινώσκω — «узнать»). οὐ ζήσεται ἐναντίον τῶν ἀδελφῶν ἡμῶν — 一族の前で生きてはいられない (формула смертного приговора; Иаков не знает о краже — так в греч.). οὐκ ἐπέγνω παρ᾿ αὐτῷ οὐθέν — 彼のところに何ひとつ見つけられなかった."
  33: "ἠρεύνησεν — 探した (ἐρευνάω). εἰς τὸν οἶκον Λειας — レアの天幕へ (οἶκος здесь «шатёр»; ср. jp-joc クシ). εἰσῆλθεν καὶ εἰς τὸν οἶκον Ραχηλ — ラケルの天幕にも入った."
  34: "τὰ σάγματα τῆς καμήλου — らくだの荷袋 (σάγμα — «вьюк, седельный мешок»). ἐνέβαλεν…ἐπεκάθισεν αὐτοῖς — 入れて、その上に座った (ἐπικαθίζω — «садиться на»)."
  35: "Μὴ βαρέως φέρε, κύριε — 怒らないでください、主人よ (букв. «не неси тяжело»; κύριε — почтительное обращение к отцу). τὸ κατ᾿ ἐθισμὸν τῶν γυναικῶν μοί ἐστιν — 女の習いのことが、わたしにある (о месячных; слав. «обычная женская ми суть»). ἠρεύνησεν…ἐν ὅλῳ τῷ οἴκῳ — 家じゅうを探した."
  36: "ὠργίσθη — 怒った (ὀργίζομαι). ἐμαχέσατο — 争った (μάχομαι). τὸ ἀδίκημα…τὸ ἁμάρτημα — 不正…罪 (ἀδίκημα — «неправда, обида»). κατεδίωξας ὀπίσω μου — わたしの後を追って来た (καταδιώκω — «преследовать»)."
  37: "τὰ σκεύη μου — わたしの器 (σκεῦος — «сосуд, вещь, утварь»). θὲς ὧδε — ここに置きなさい. ἐλεγξάτωσαν — 裁くがよい (ἐλέγχω — «обличать, судить»). ἀνὰ μέσον τῶν δύο ἡμῶν — わたしたち二人の間を."
  38: "οὐκ ἠτεκνώθησαν — 子を産めないことはなかった (ἀτεκνόω — «лишать детей»; о выкидышах). κριοὺς τῶν προβάτων σου οὐ κατέφαγον — 雄羊を食べたこともない (κριός — «баран»)."
  39: "θηριάλωτον — 獣に引き裂かれたもの (θηριάλωτος — «растерзанный зверем»). ἀπετίννυον παρ᾿ ἐμαυτοῦ — 自分で償った (ἀποτίνω — «возмещать»). κλέμματα ἡμέρας καὶ κλέμματα νυκτός — 昼に盗まれたもの、夜に盗まれたもの (повтор сохранён)."
  40: "συγκαιόμενος τῷ καύματι — 暑さに焼かれ (καῦμα — «зной»). παγετῷ τῆς νυκτός — 夜の霜に (παγετός — «мороз»). ἀφίστατο ὁ ὕπνος ἀπὸ τῶν ὀφθαλμῶν μου — 眠りはわたしの目から離れ去った."
  41: "ἐν τῇ οἰκίᾳ σου — あなたの家に. δέκα τέσσαρα ἔτη ἀντὶ τῶν δύο θυγατέρων — 二人の娘のために十四年. ἓξ ἔτη ἐν τοῖς προβάτοις — 羊のために六年. παρελογίσω τὸν μισθόν μου δέκα ἀμνάσιν — 報酬を十匹の子羊でだました (дательный орудия; ср. 31:7)."
  42: "ὁ φόβος Ισαακ — イサクの恐れ (титул Бога: «Ужас Исаака»; слав. «страх Исаака»; не о чувстве Исаака). κενόν με ἐξαπέστειλας — 空の手で送り出していた (κενός — «пустой»). τὴν ταπείνωσίν μου καὶ τὸν κόπον τῶν χειρῶν μου — わたしの卑しさと手の労苦 (ταπείνωσις — «унижение»; κόπος — «труд»). ἤλεγξέν σε ἐχθές — 昨日あなたを責められた."
  43: "Αἱ θυγατέρες θυγατέρες μου, καὶ οἱ υἱοὶ υἱοί μου — 娘たちはわたしの娘、子らはわたしの子 (троекратный повтор сохранён). τί ποιήσω ταύταις σήμερον — 今日、この娘たちに何ができようか (риторический вопрос)."
  44: "διαθώμεθα διαθήκην — 契約を結ぼう (διατίθημι διαθήκην — «заключить завет»). εἰς μαρτύριον — 証として. εἶπεν δὲ αὐτῷ — 彼は言った (в греч. без имени; слав. «Рече же ему иаков» — отнесено к Иакову, так и переведено). ἰδὲ ὁ θεὸς μάρτυς — 神が証人である."
  45: "λαβὼν…λίθον ἔστησεν αὐτὸν στήλην — 石を取って石柱として立てた (στήλη; ср. 28:18)."
  46: "Συλλέγετε λίθους — 石を集めなさい. βουνόν — 石塚 (βουνός — «холм»; здесь насыпь из камней, евр. גַּל). ἔφαγον καὶ ἔπιον ἐκεῖ ἐπὶ τοῦ βουνοῦ — その石塚の上で食べ、飲んだ (трапеза завета)."
  47: "Βουνὸς τῆς μαρτυρίας — 証の石塚; Βουνὸς μάρτυς — 証人の石塚 (LXX переводит арам. יְגַר שָׂהֲדוּתָא и евр. גַּלְעֵד; в Синодальном — Иегар-Сагадуфа и Галаад)."
  48: "μαρτυρεῖ ὁ βουνὸς οὗτος — この石塚は証する (μαρτυρέω). ἐκλήθη τὸ ὄνομα αὐτοῦ — その名は呼ばれた. Стих обрывается по греч. (продолжение — 49)."
  49: "Ἡ ὅρασις — 幻 (LXX переводит евр. מִצְפָּה — «сторожевая башня, наблюдение», Мицпа; слав. «видение»; в Синодальном «Мицпа»). Ἐπίδοι ὁ θεός — 神が顧みられるように (ἐφοράω — «наблюдать»). ἀποστησόμεθα ἕτερος ἀπὸ τοῦ ἑτέρου — 互いに離れる."
  50: "εἰ ταπεινώσεις — もし苦しめるなら (ταπεινόω — «унижать»). εἰ λήμψῃ γυναῖκας ἐπὶ ταῖς θυγατράσιν — 娘たちのほかに妻を迎えるなら (ἐπί с дательным — «сверх»). ὅρα οὐθεὶς μεθ᾽ ἡμῶν ἐστιν — 見よ、わたしたちの間にはだれもいない (букв.; в слав. здесь добавлено «Бог свидетель» и «видяй», которых в греч. нет; «Бог свидетель» в греч. стоит в 44-м — не дублируем)."
  51: "В gr-lxx-byz на месте стиха `.` — его нет в базе; весь стих в 〔…〕 по csl-ru: Лаван продолжает речь, указывая на холм и столп (ср. 31:48,50)."
  52: "ἐάν τε γὰρ ἐγὼ μὴ διαβῶ πρὸς σὲ μηδὲ σὺ διαβῇς πρός με — もしわたしが、あるいはあなたが越えて行かないなら (условная конструкция, главное предложение — в 53-м). ἐπὶ κακίᾳ — 悪のために."
  53: "ὁ θεὸς Αβρααμ καὶ ὁ θεὸς Ναχωρ — アブラハムの神、ナホルの神 (в масоретском добавлено «Бог отца их»; в греч. нет — не добавляем). κρινεῖ — да судит. ὤμοσεν κατὰ τοῦ φόβου τοῦ πατρὸς αὐτοῦ Ισαακ — 父イサクの恐れによって誓った (ср. 31:42)."
  54: "ἔθυσεν θυσίαν — いけにえをささげた (θύω — «заклать в жертву»). ἐκάλεσεν τοὺς ἀδελφούς — 一族を呼んだ. ἐκοιμήθησαν ἐν τῷ ὄρει — 山で眠った."
  55: "В gr-lxx-byz это 32:1, в славяно-синодальной нумерации — 31:55: стих перенесён в конец 31-й главы, поэтому нумерация главы совпадает с csl. ἀναστὰς…τὸ πρωί — 朝早く起きて (ἀνίστημι). κατεφίλησεν — 口づけした (καταφιλέω, «горячо целовать»). ἀποστραφεὶς — 引き返して (ἀποστρέφομαι)."
