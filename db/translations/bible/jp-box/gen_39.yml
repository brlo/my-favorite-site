verses:
  1: "ヨセフはエジプトへ連[つ]れて行[い]かれた。ファラオの侍従[じじゅう]で料理人[りょうりにん]の長[かしら]であるエジプト人[じん]ポティファルが、彼[かれ]をそこへ連[つ]れて来[き]たイシュマエル人[じん]たちの手[て]からヨセフを買[か]い取[と]った。"
  2: "主[しゅ]がヨセフとともにおられた。彼[かれ]は成功[せいこう]する人[ひと]となり、エジプト人[じん]の主人[しゅじん]の家[いえ]にいた。"
  3: "主人[しゅじん]は、主[しゅ]が彼[かれ]とともにおられ、彼[かれ]が行[おこな]うことは何[なに]であれ、主[しゅ]が彼[かれ]の手[て]のうちで成功[せいこう]させておられるのを知[し]った。"
  4: "ヨセフは主人[しゅじん]の目[め]に{恵[めぐ]み|恩寵[おんちょう]}を得[え]て、彼[かれ]に仕[つか]えた。主人[しゅじん]は彼[かれ]を自分[じぶん]の家[いえ]の上[うえ]に立[た]て、持[も]っているものすべてをヨセフの手[て]にゆだねた。"
  5: "彼[かれ]を家[いえ]の上[うえ]に、また彼[かれ]の持[も]つすべてのものの上[うえ]に立[た]ててから、主[しゅ]はヨセフのゆえにエジプト人[じん]の家[いえ]を祝福[しゅくふく]された。主[しゅ]の祝福[しゅくふく]は、家[いえ]にも畑[はたけ]にも、彼[かれ]の持[も]つすべてのものの上[うえ]に及[およ]んだ。"
  6: "主人[しゅじん]は持[も]つすべてをヨセフの手[て]に任[まか]せ、自分[じぶん]が食[た]べるパンのほかは、何[なに]ひとつ知[し]らなかった。ヨセフは容姿[ようし]が美[うつく]しく、顔[かお]だちも非常[ひじょう]に整[ととの]っていた。"
  7: "これらのことの後[あと]、主人[しゅじん]の妻[つま]がヨセフに目[め]を向[む]けて言[い]った。「わたしと寝[ね]なさい。」"
  8: "しかし、彼[かれ]は応[おう]じなかった。そして主人[しゅじん]の妻[つま]に言[い]った。「ご覧[らん]ください。わたしの主人[しゅじん]は、わたしのゆえにこの家[いえ]のことを何[なに]ひとつ知[し]らず、持[も]つすべてをわたしの手[て]にゆだねています。"
  9: "この家[いえ]でわたしより上[うえ]の者[もの]はなく、あなたのほかは、わたしから取[と]り除[の]かれたものは何[なに]ひとつありません。あなたが主人[しゅじん]の妻[つま]だからです。それなのに、どうしてわたしがこの悪[わる]いことをして、神[かみ]の前[まえ]に罪[つみ]を犯[おか]せましょうか。」"
  10: "彼女[かのじょ]は日[ひ]ごとにヨセフに語[かた]りかけたが、ヨセフは彼女[かのじょ]と寝[ね]て交[まじ]わろうとはしなかった。"
  11: "ある日[ひ]のこと、ヨセフが仕事[しごと]をするために家[いえ]に入[はい]ると、家[いえ]の中[なか]には誰[だれ]もいなかった。"
  12: "彼女[かのじょ]は彼[かれ]の衣[ころも]をつかんで言[い]った。「わたしと寝[ね]なさい。」しかし、彼[かれ]は衣[ころも]を彼女[かのじょ]の手[て]に残[のこ]して逃[に]げ、外[そと]へ出[で]て行[い]った。"
  13: "彼女[かのじょ]は、彼[かれ]が衣[ころも]を自分[じぶん]の手[て]に残[のこ]して逃[に]げ、外[そと]へ出[で]て行[い]ったのを見[み]ると、"
  14: "家[いえ]にいる者[もの]たちを呼[よ]んで言[い]った。「ご覧[らん]なさい。あの者[もの]は、わたしたちを嘲[あざけ]るために、ヘブライ人[じん]の若[わか]い男[おとこ]をわたしたちのところへ引[ひ]き入[い]れたのです。あの者[もの]はわたしのところへ来[き]て『わたしと寝[ね]なさい』と言[い]いました。そこで、わたしは大[おお]きな声[こえ]を上[あ]げたのです。"
  15: "あの者[もの]は、わたしが声[こえ]を上[あ]げて叫[さけ]んだのを聞[き]くと、衣[ころも]をわたしのところに残[のこ]して逃[に]げ、外[そと]へ出[で]て行[い]ったのです。」"
  16: "彼女[かのじょ]は、主人[しゅじん]が家[いえ]に帰[かえ]るまで、その衣[ころも]を自分[じぶん]のそばに置[お]いておいた。"
  17: "そして、このような言葉[ことば]を彼[かれ]に語[かた]った。「あなたがわたしたちのところへ連[つ]れて来[き]たあのヘブライ人[じん]の僕[しもべ]が、わたしを嘲[あざけ]ろうとして、わたしのところへ来[き]ました。そして、わたしに『あなたと寝[ね]よう』と言[い]ったのです。"
  18: "しかし、わたしが声[こえ]を上[あ]げて叫[さけ]んだと聞[き]くと、あの者[もの]は衣[ころも]をわたしのところに残[のこ]して逃[に]げ、外[そと]へ出[で]て行[い]ったのです。」"
  19: "主人[しゅじん]は、妻[つま]が自分[じぶん]に語[かた]った言葉[ことば]、すなわち「あなたの僕[しもべ]がわたしにこのようなことをしました」という言葉[ことば]を聞[き]くと、激[はげ]しく怒[いか]った。"
  20: "主人[しゅじん]はヨセフを捕[と]らえて、王[おう]の囚人[しゅうじん]たちが閉[と]じ込[こ]められている要塞[ようさい]の牢[ろう]に彼[かれ]を入[い]れた。"
  21: "主[しゅ]がヨセフとともにおられた。主[しゅ]は彼[かれ]に憐[あわ]れみを注[そそ]ぎ、牢[ろう]の長[かしら]の目[め]に{恵[めぐ]み|恩寵[おんちょう]}を得[え]させられた。"
  22: "牢[ろう]の長[かしら]は牢[ろう]のことをヨセフの手[て]にゆだね、そこにいる囚人[しゅうじん]たちも、そこでなされるすべてのことも、彼[かれ]に任[まか]せた。"
  23: "牢[ろう]の長[かしら]は、ヨセフのゆえに何[なに]ひとつ気[き]にかけなかった。すべてがヨセフの手[て]を通[とお]してなされ、主[しゅ]が彼[かれ]とともにおられたからである。彼[かれ]が行[おこな]うことは何[なに]であれ、主[しゅ]が彼[かれ]の手[て]のうちで成功[せいこう]させられた。"

notes:
  1: "Ἰωσηφ δὲ κατήχθη — ヨセフは連れて行かれた (κατάγω, pass.; слав. «приведен бысть»). ἐκτήσατο αὐτὸν Πετεφρης — ポティファルが彼を買い取った (κτάομαι — «приобретать»). ὁ εὐνοῦχος Φαραω — ファラオの侍従 (εὐνοῦχος букв. «евнух», в LXX — придворный; у Потифара есть жена, 39:7, поэтому 侍従, а не 宦官). ἀρχιμάγειρος — 料理人の長 (букв. «начальник поваров»; евр. «начальник телохранителей», слав. «архимагир»). ἐκ χειρὸς Ισμαηλιτῶν — イシュマエル人たちの手から."
  2: "καὶ ἦν κύριος μετὰ Ιωσηφ — 主がヨセフとともにおられた (формула, ср. 21, 23; Деян 7:9). ἀνὴρ ἐπιτυγχάνων — 成功する人 (ἐπιτυγχάνω — «достигать, преуспевать»). ἐγένετο ἐν τῷ οἴκῳ παρὰ τῷ κυρίῳ τῷ Αἰγυπτίῳ — エジプト人の主人の家にいた."
  3: "ᾔδει — 知った. ὅσα ἂν ποιῇ — 行うことは何であれ. κύριος εὐοδοῖ ἐν ταῖς χερσὶν αὐτοῦ — 主が彼の手のうちで成功させておられる (εὐοδόω — «давать успех»)."
  4: "εὗρεν χάριν ἐναντίον τοῦ κυρίου αὐτοῦ — 主人の目に恵みを得た. εὐηρέστει δὲ αὐτῷ — 彼に仕えた (εὐαρεστέω — «быть угодным»). κατέστησεν αὐτὸν ἐπὶ τοῦ οἴκου — 家の上に立てた. ἔδωκεν διὰ χειρὸς Ιωσηφ — ヨセフの手にゆだねた."
  5: "μετὰ τὸ κατασταθῆναι — после того как он поставил его. ηὐλόγησεν κύριος τὸν οἶκον τοῦ Αἰγυπτίου διὰ Ιωσηφ — 主はヨセフのゆえにエジプト人の家を祝福された (διά + gen. — «ради»). ἐγενήθη εὐλογία κυρίου ἐν πᾶσιν τοῖς ὑπάρχουσιν — 主の祝福がすべての所有物に及んだ."
  6: "ἐπέτρεψεν — 任せた (ἐπιτρέπω). οὐκ ᾔδει τῶν καθ᾽ ἑαυτὸν οὐδὲν πλὴν τοῦ ἄρτου — 自分に属することを何ひとつ知らなかった、自分の食べるパンのほかは. καλὸς τῷ εἴδει καὶ ὡραῖος τῇ ὄψει σφόδρα — 容姿が美しく、顔だちも非常に整っていた (εἶδος — «вид», ὄψις — «лицо»; оба слова сохранены)."
  7: "ἐπέβαλεν τοὺς ὀφθαλμοὺς αὐτῆς ἐπὶ Ιωσηφ — ヨセフに目を向けた (букв. «возложила глаза»). Κοιμήθητι μετ᾽ ἐμοῦ — わたしと寝なさい (аор. императив)."
  8: "ὁ δὲ οὐκ ἤθελεν — 応じなかった (букв. «не хотел»). εἰ ὁ κύριός μου οὐ γινώσκει — LXX с εἰ («если»), смысл утвердительный: «вот, господин мой не знает»; передано утверждением, без сглаживания. δι᾿ ἐμέ — わたしのゆえに."
  9: "οὐχ ὑπερέχει ἐν τῇ οἰκίᾳ ταύτῃ οὐθὲν ἐμοῦ — この家でわたしより上の者はない (ὑπερέχω). ὑπεξῄρηται ἀπ᾽ ἐμοῦ οὐδέν — わたしから取り除かれたものは何もない (ὑπεξαιρέω). πλὴν σοῦ — あなたのほかは. τὸ ῥῆμα τὸ πονηρὸν τοῦτο — この悪いこと (букв. «слово злое»). ἁμαρτήσομαι ἐναντίον τοῦ θεοῦ — 神の前に罪を犯す."
  10: "ἡμέραν ἐξ ἡμέρας — 日ごとに. οὐχ ὑπήκουσεν — 従わなかった. καθεύδειν μετ᾽ αὐτῆς τοῦ συγγενέσθαι αὐτῇ — 寝て交わる (συγγίνομαι — «сходиться»); два глагола сохранены."
  11: "τοιαύτη τις ἡμέρα — ある日. εἰσῆλθεν… ποιεῖν τὰ ἔργα αὐτοῦ — 自分の仕事をするために入った. οὐθεὶς ἦν τῶν ἐν τῇ οἰκίᾳ ἔσω — 家の中に誰もいなかった."
  12: "ἐπεσπάσατο αὐτὸν τῶν ἱματίων — 衣をつかんだ (ἐπισπάομαι + gen.). καταλιπὼν τὰ ἱμάτια — 衣を残して. ἔφυγεν καὶ ἐξῆλθεν ἔξω — 逃げて外へ出た (оба глагола, как в греч.)."
  13: "ὡς εἶδεν ὅτι κατέλιπεν… — 見ると. Повтор «оставил одежду и убежал» (12, 13, 15, 18) сохранён, как в LXX и слав."
  14: "Ἴδετε — ご覧なさい. παῖδα Εβραῖον — ヘブライ人の若い男 (παῖς — «отрок, раб»). ἐμπαίζειν ἡμῖν — わたしたちを嘲るために. ἐβόησα φωνῇ μεγάλῃ — 大きな声を上げた. Вложенная речь жены — 『…』 внутри 「…」."
  15: "ἐν δὲ τῷ ἀκοῦσαι αὐτόν — 聞くと. παρ᾽ ἐμοί — わたしのところに."
  16: "καταλιμπάνει — настоящее время в греч. («оставляет»), в японском прошедшее по ходу рассказа. ἕως ἦλθεν ὁ κύριος — 主人が帰るまで."
  17: "κατὰ τὰ ῥήματα ταῦτα — このような言葉を. ὃν εἰσήγαγες πρὸς ἡμᾶς — あなたがわたしたちのところへ連れて来た. Κοιμηθήσομαι μετὰ σοῦ — あなたと寝よう (буд. время; в отличие от императива 39:7,14 различие сохранено, ср. слав. «да буду с тобою»)."
  18: "Повтор 15-го стиха почти дословно (LXX), сохранён."
  19: "ἐθυμώθη ὀργῇ — 激しく怒った (букв. «воспылал гневом»). Речь жены в 19 передана в 「…» внутри повествования — это первый уровень, не 『…』."
  20: "ὀχύρωμα — 要塞 (укрепление, темница-крепость; слав. «темница», «твердыня»). δεσμῶται τοῦ βασιλέως — 王の囚人たち. κατέχονται — 閉じ込められている."
  21: "κατέχεεν αὐτοῦ ἔλεος — 憐れみを注いだ (καταχέω — «изливать»). ἔδωκεν αὐτῷ χάριν ἐναντίον τοῦ ἀρχιδεσμοφύλακος — 牢の長の目に恵みを得させた. ἀρχιδεσμοφύλαξ — 牢の長."
  22: "ἔδωκεν τὸ δεσμωτήριον διὰ χειρὸς Ιωσηφ — 牢をヨセフの手にゆだねた. τοὺς ἀπηγμένους — 連れて来られた者たち (ἀπάγω). Греч. кончает стих без глагола («и всё, что делают там»); глагол повторён по смыслу (ср. слав. «той бе творяй»)."
  23: "γινώσκων δι᾽ αὐτὸν οὐθέν — 彼のゆえに何も知らなかった (не следил ни за чем). πάντα ἦν διὰ χειρὸς Ιωσηφ — всё шло через руку Иосифа. εὐώδου — имперфект εὐοδόω («давал успех»); в LXX формы εὐώδου / εὐόδωσεν."
