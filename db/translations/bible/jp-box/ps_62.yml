verses:
  0: "ダビデの詩[うた]。ユダヤの荒野[あらの]にいたときのもの。"
  1: "神[かみ]よ、あなたはわたしの神[かみ]。わたしはあなたを求[もと]めて夜明[よあ]けを待[ま]つ。わたしの魂[たましい]はあなたに渇[かわ]いている。わたしの肉[にく]は、水[みず]のない、荒[あ]れ果[は]てた、人[ひと]の踏[ふ]み入[い]らない荒野[あらの]で、どれほどあなたを慕[した]っていることか。"
  2: "そのように、わたしは聖所[せいしょ]であなたの前に立[た]ち、あなたの力[ちから]と栄光[えいこう]とを見[み]た。"
  3: "あなたの恵[めぐ]みは命[いのち]にもまさる。わたしの唇[くちびる]はあなたをほめたたえる。"
  4: "こうして、わたしは生[い]きているかぎりあなたをほめたたえ、あなたの名[な]によって手[て]を上[あ]げる。"
  5: "わたしの魂[たましい]は、脂[あぶら]と豊[ゆた]かさで満[み]たされるかのようであり、わたしの唇[くちびる]は喜[よろこ]びをもって、わたしの口[くち]はあなたをほめたたえる。"
  6: "わたしは寝床[ねどこ]であなたを思[おも]い起[おこ]し、夜明[よあ]けの時[とき]にはあなたを思[おも]い巡[めぐ]らした。"
  7: "あなたはわたしの助[たす]けとなってくださったからである。わたしはあなたの翼[つばさ]の陰[かげ]で喜[よろこ]ぶ。"
  8: "わたしの魂[たましい]はあなたに寄[よ]り添[そ]い、あなたの右[みぎ]の手[て]がわたしを支[ささ]えてくださる。"
  9: "しかし、彼[かれ]らは空[むな]しくわたしの魂[たましい]を求[もと]めた。彼[かれ]らは地[ち]の最[もっと]も低[ひく]い所[ところ]に入[はい]る。"
  10: "彼[かれ]らは剣[つるぎ]の手[て]に渡[わた]され、狐[きつね]のえじきとなる。"
  11: "しかし、王[おう]は神[かみ]によって喜[よろこ]ぶ。神[かみ]によって誓[ちか]う者[もの]は、すべてほめたたえられる。不[ふ]正[せい]を語[かた]る者[もの]の口[くち]はふさがれるからである。"

notes:
  0: "Ψαλμὸς τῷ Δαυιδ ἐν τῷ εἶναι αὐτὸν ἐν τῇ ἐρήμῳ τῆς Ιουδαίας — ダビデの詩。ユダヤの荒野にいたときのもの (ἔρημος — 荒野; ср. 1 Цар 22–24). Надписание — стих 0."
  1: "Ὁ θεὸς ὁ θεός μου — 神よ、あなたはわたしの神 (обращение с повторением, как в евр.). πρὸς σὲ ὀρθρίζω — あなたを求めて夜明けを待つ (ὀρθρίζω — «вставать до зари, искать с рассвета»). ἐδίψησέν σοι ἡ ψυχή μου — 魂はあなたに渇いている (διψάω — «жаждать»). ποσαπλῶς σοι ἡ σάρξ μου — 肉はどれほどあなたを慕っていることか (ποσαπλῶς — «сколь кратно», место тёмное; передано риторическим «どれほど»). ἐν γῇ ἐρήμῳ καὶ ἀβάτῳ καὶ ἀνύδρῳ — 水のない、荒れ果てた、人の住まない荒野で (ἄβατος — «непроходимый»; ἄνυδρος — «безводный»)."
  2: "οὕτως ἐν τῷ ἁγίῳ ὤφθην σοι — そのように、聖所であなたの前に立ち (ἅγιον — 聖所; ὤφθην — «явился»). τοῦ ἰδεῖν τὴν δύναμίν σου καὶ τὴν δόξαν σου — 力と栄光とを見た (цель: чтобы увидеть)."
  3: "κρεῖσσον τὸ ἔλεός σου ὑπὲρ ζωάς — 恵みは命にもまさる (κρείσσων — «лучший, больший»; ζωαί мн. ч. — «жизни»). τὰ χείλη μου ἐπαινέσουσίν σε — 唇はあなたをほめたたえる (χείλη — 唇)."
  4: "οὕτως εὐλογήσω σε ἐν τῇ ζωῇ μου — こうして、生きているかぎりあなたをほめたたえ (εὐλογέω — «благословлять»). ἐν τῷ ὀνόματί σου ἀρῶ τὰς χεῖράς μου — あなたの名によって手を上げる (αἴρω — «поднимать», жест молитвы)."
  5: "ὡσεὶ στέατος καὶ πιότητος ἐμπλησθείη ἡ ψυχή μου — 魂は脂と豊かさで満ち足りたように満たされ (στέαρ — «тук»; πιότης — «тучность»). χείλη ἀγαλλιάσεως αἰνέσει τὸ στόμα μου — 唇は喜びをもって、口はあなたをほめたたえる (ἀγαλλίασις — «ликование»)."
  6: "εἰ ἐμνημόνευόν σου ἐπὶ τῆς στρωμνῆς μου — 寝床であなたを思い起こし (στρωμνή — «постель»; εἰ здесь в значении «когда»). ἐν τοῖς ὄρθροις ἐμελέτων εἰς σέ — 夜明けの時にはあなたを思い巡らした (ὄρθρος — «рассвет»; μελετάω — «размышлять»)."
  7: "ἐγενήθης βοηθός μου — わたしの助けとなってくださった (βοηθός — «помощник»). ἐν τῇ σκέπῃ τῶν πτερύγων σου ἀγαλλιάσομαι — 翼の陰で喜ぶ (σκέπη — «покров»; ср. 56:1; 60:4)."
  8: "ἐκολλήθη ἡ ψυχή μου ὀπίσω σου — 魂はあなたに寄り添い (κολλάω — «прилепляться»; ὀπίσω — «вслед»). ἐμοῦ ἀντελάβετο ἡ δεξιά σου — 右の手がわたしを支えてくださる (ἀντιλαμβάνω — «поддерживать»)."
  9: "αὐτοὶ δὲ εἰς μάτην ἐζήτησαν τὴν ψυχήν μου — しかし、彼らは空しくわたしの魂を求めた (εἰς μάτην — «напрасно»). εἰσελεύσονται εἰς τὰ κατώτατα τῆς γῆς — 地の最も低い所に入る (κατώτατα — «преисподние»)."
  10: "παραδοθήσονται εἰς χεῖρας ῥομφαίας — 剣の手に渡され (ῥομφαία — «меч»). μερίδες ἀλωπέκων ἔσονται — 狐のえじきとなる (μερίς — «доля, часть»; ἀλώπηξ — «лисица»)."
  11: "ὁ δὲ βασιλεὺς εὐφρανθήσεται ἐπὶ τῷ θεῷ — しかし、王は神によって喜ぶ (εὐφραίνομαι — «радоваться»). ἐπαινεσθήσεται πᾶς ὁ ὀμνύων ἐν αὐτῷ — 神によって誓う者は、すべてほめたたえられる (ὀμνύω — «клясться»). ἐνεφράγη στόμα λαλούντων ἄδικα — 不正を語る者の口はふさがれる (ἐμφράσσω — «заграждать»)."
