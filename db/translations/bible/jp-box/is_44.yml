# jp-box, Исаия, глава 44. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для гл. 44 нет (фрагменты книги — 3, 5–10,
# 13–14, 19, 25–29, 37–38, 40–43, 45, 48–50, 52, 54, 58, 60, 62–66); jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 44: 1–5 излияние Духа на потомство Иакова; 6–8 «Я первый и после этого Я»,
# нет Бога кроме Меня; 9–20 безумие идолослужения (ирония сохранена: полено греет,
# печёт хлеб и становится богом); 21–23 «помни это, Израиль» и радость небес;
# 24–28 Господь, сотворивший всё, — слово о Иерусалиме, бездне и Кире.
# Речи: слова Господа — 「…」 (1; 2–5; 6–8; 21–22; 24–28). 9–20 — пророческое обличение
# (авторский голос, без кавычек), внутри него слова идолослужителя — 「…」 (16; 17; 20).
# 23 — призыв к хвале (авторский голос, без кавычек). Внутри речи Господа его же слова,
# обращённые к людям, бездне, Иерусалиму, — 『…』 (5; 26–28). Вводные формулы (2; 6; 24)
# — вне кавычек.
# Нумерация по gr: 28 стихов; у csl и ru тоже 28. Внутри главы слав. делит иначе:
#   • 44:9/10 — gr кончает 9 словом ἀλλὰ αἰσχυνθήσονται, а 10 начинается с подлежащего
#     (πάντες οἱ πλάσσοντες θεόν); слав. переносит «но посрамятся» в начало 10. Держим
#     слав., иначе 10-й стих остаётся без сказуемого (notes 9–10).
#   • 44:12/13 — gr кончает 12 словом ἐκλεξάμενος («выбрав»), а 13 начинает «дерево…»;
#     слав. переносит «И избрав» в начало 13. Держим слав. (notes 12–13).
#   • 44:24/25 — gr кончает 24 словами τίς ἕτερος («кто иной»), слав. переносит их
#     в начало 25 («Кто ин»). Держим слав. (notes 24–25).
# Паритет: слав. добавления внесены без 〔…〕 — 44:14 «сосну»; 44:15 «сотвори е изваянное,
# и прекланяется им» (удвоение, нет в LXX). 44:6 «Я первый и после этого Я» — по LXX
# и слав.; в МТ и ru «Я первый и Я последний» (ср. Откр 1:17; 2:8; 22:13) — notes.
# 44:28 Кир: в LXX «говорящий Киру: разуметь», в МТ «пастырь Мой» — держим LXX (notes).
# 〔…〕 нет; сносок ⟨…⟩ нет: 陶工, 粘土, 灰, 膠, 錐, のみ, 松 уже в корпусе или пояснены
# в notes.
# Имена — транслитерация греческого (LXX): ヤコブ, イスラエル, エルサレム, ユダ, クロス.

