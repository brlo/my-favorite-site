verses:
  1: "「今[いま]、聞[き]け、わたしのしもべ、ヤコブよ。わたしが選[えら]んだイスラエルよ。」"
  2: "あなたを造[つく]り、母[はは]の胎[たい]からあなたを形[かたち]づくった主[しゅ]である神[かみ]はこう言[い]われる。「なお、あなたは助[たす]けられる。恐[おそ]れるな、わたしのしもべヤコブ、わたしが選[えら]んだ愛[あい]するイスラエルよ。"
  3: "わたしは水[みず]のない所[ところ]を歩[あゆ]む者[もの]に、渇[かわ]きの中[なか]で水を、川[かわ]を与[あた]えるからである。わたしはわたしの霊[れい]をあなたの子孫[しそん]の上[うえ]に、わたしの祝福[しゅくふく]をあなたの子[こ]らに注[そそ]ぐ。"
  4: "彼らは水[みず]の間[あいだ]の草[くさ]のように、流[なが]れる水のほとりの柳[やなぎ]のように芽生[めば]える。"
  5: "この者[もの]は『わたしは神[かみ]のものだ』と言[い]い、あの者[もの]はヤコブの名[な]によって呼[よ]ばれ、ほかの者[もの]は手[て]に『わたしは神のものだ』と書[か]き、イスラエルの名によって呼ばれる。」"
  6: "イスラエルの王[おう]である神[かみ]、これを救[すく]い出[だ]した者[もの]、万軍[ばんぐん]の神[かみ]はこう言[い]われる。「わたしは初[はじ]めであり、これらの後[のち]もわたしである。わたしのほかに神[かみ]はいない。"
  7: "だれがわたしに似[に]ているのか。その者[もの]は立[た]ち、わたしに呼[よ]びかけ、わたしのために備[そな]えよ。わたしが人[ひと]を永遠[えいえん]に造[つく]って以来[いらい]のこと、また来[きた]るべきことを、それが来[く]る前[まえ]に、あなたがたに告[つ]げさせよ。"
  8: "身[み]を隠[かく]すな。惑[まど]わされるな。わたしは初[はじ]めからあなたがたに聞[き]かせ、告[つ]げてきたではないか。あなたがたはわたしの証人[しょうにん]である。わたしのほかに神[かみ]があるか。わたしのほかに岩[いわ]はない。そのようなものは、そのときにはなかった。」"
  9: "刻[きざ]み物[もの]を造[つく]る者[もの]たちは、みな空[むな]しい。彼らは自分[じぶん]の望[のぞ]むものを作[つく]るが、それは彼らを助[たす]けることがない。"
  10: "しかし、神[かみ]を造[つく]り、無益[むえき]なものを刻[きざ]む者[もの]たちは、みな恥[は]じる。"
  11: "彼らが出[で]てきたところのものは、みな枯[か]れ果[は]てた。人[ひと]の中[なか]の耳[みみ]の聞[き]こえない者[もの]たちは、みな集[あつ]められ、ともに立[た]ち、ともに恥[は]じ、辱[はずかし]められよ。"
  12: "鉄[てつ]を研[と]ぐ鍛冶[かじ]は、手斧[ておの]でこれを仕上[しあ]げ、錐[きり]で穴[あな]をあけ、のみでこれをえぐる。彼は腕[うで]の力[ちから]でこれを造[つく]る。そして飢[う]え、弱[よわ]り、水[みず]を飲[の]まない。"
  13: "木[き]を選[えら]んだ職人[しょくにん]は、それを寸法[すんぽう]に合[あ]わせ、膠[にかわ]で組[く]み立[た]て、男[おとこ]の形[かたち]と人[ひと]の美[うつく]しさのように造[つく]り、家[いえ]の中[なか]に据[す]える。"
  14: "彼は森[もり]から木[き]を切[き]る。主[しゅ]が植[う]え、雨[あめ]が育[そだ]てた松[まつ]である。"
  15: "人[ひと]がこれを燃[も]やすために。その一部[いちぶ]を取[と]って暖[あたた]まり、またこれを燃[も]やしてパンを焼[や]く。残[のこ]りの部分[ぶぶん]で神[かみ]々[がみ]を造[つく]り、それらにひれ伏[ふ]す。刻[きざ]んだ像[ぞう]を造[つく]り、これにひれ伏すのである。"
  16: "その半[なか]ばを火[ひ]で燃[も]やし、その半ばを炭[すみ]にしてパンを焼[や]く。その上[うえ]で肉[にく]を焼[や]いて食[た]べ、満[み]ち足[た]りる。そして暖[あたた]まって言[い]う。「ああ、暖[あたた]かい。火[ひ]を見[み]た。」"
  17: "残[のこ]りで刻[きざ]んだ神[かみ]を造[つく]り、これにひれ伏[ふ]し、祈[いの]って言[い]う。「わたしを救[すく]い出[だ]せ。あなたはわたしの神[かみ]だ。」"
  18: "彼らは悟[さと]ることを知[し]らない。自分[じぶん]の目[め]で見[み]ること、自分の心[こころ]で理解[りかい]することが、暗[くら]くされているからである。"
  19: "だれも心[こころ]に思[おも]いめぐらさず、考[かんが]えもせず、知[し]りもしない。その半[なか]ばを火[ひ]で燃[も]やし、炭[すみ]の上[うえ]でパンを焼[や]き、肉[にく]を焼[や]いて食[た]べ、残[のこ]りを忌[いま]わしいものに造[つく]って、それにひれ伏[ふ]すということを。"
  20: "知[し]れ。彼らの心[こころ]は灰[はい]である。彼らは惑[まど]わされ、だれも自分[じぶん]の魂[たましい]を救[すく]い出[だ]せない。見[み]よ、あなたがたは「わたしの右[みぎ]の手[て]にあるものは偽[いつわ]りだ」と言[い]うのではないか。"
  21: "「思[おも]い起[おこ]せ、これを、ヤコブよ、イスラエルよ。あなたはわたしのしもべである。わたしはあなたを形[かたち]づくった、わたしのしもべ。あなたは、イスラエルよ、わたしを忘[わす]れるな。"
  22: "見[み]よ、わたしはあなたの不法[ふほう]を雲[くも]のように、あなたの罪[つみ]を霧[きり]のようにぬぐい去[さ]った。わたしに立[た]ち返[かえ]れ。わたしはあなたを贖[あがな]うからである。」"
  23: "天[てん]よ、喜[よろこ]べ。神[かみ]がイスラエルをあわれまれたからである。地[ち]の基[もとい]よ、角笛[つのぶえ]を吹[ふ]け。山[やま]よ、喜[よろこ]びの声[こえ]を上[あ]げよ。丘[おか]とその上[うえ]のすべての木[き]も。神[かみ]がヤコブを贖[あがな]い、イスラエルが栄光[えいこう]を受[う]けるからである。"
  24: "あなたを贖[あがな]い、母[はは]の胎[たい]からあなたを形[かたち]づくった主[しゅ]はこう言[い]われる。「わたしは主[しゅ]、すべてを成[な]し遂[と]げる者[もの]。ただ一人[ひとり]で天[てん]を広[ひろ]げ、地[ち]を堅[かた]くした。"
  25: "わたしは口寄[くちよ]せ師[し]たちのしるしを散[ち]らし、心[こころ]から出[で]る占[うらな]いを無[む]にし、知恵[ちえ]ある者[もの]たちを後[うし]ろへ退[しりぞ]け、その知識[ちしき]を愚[おろ]かにする。"
  26: "しもべの言葉[ことば]を確[たし]かなものとし、その使者[ししゃ]たちの助言[じょげん]を真実[しんじつ]にする。エルサレムに『住[す]まわれるようになる』と言[い]い、ユダの町[まち]々[まち]に『建[た]てられる』と言[い]い、その荒[あ]れ跡[あと]が芽生[めば]える。"
  27: "淵[ふち]に『荒[あ]れ果[は]てよ』と言[い]い、『わたしはあなたの川[かわ]を干[ひ]からびさせる』と言[い]い、"
  28: "クロスに『悟[さと]れ』と言[い]い、『彼はわたしの願[ねが]いをすべて行[おこな]う』と言[い]い、エルサレムに『建[た]てられる』と言[い]い、『わたしの聖[せい]なる家[いえ]の基[もとい]を据[す]える』と言[い]う者[もの]である。」"

notes:
  1: "νῦν δὲ ἄκουσον, παῖς μου Ιακωβ — «ныне же слыши, рабе мой Иакове»; καὶ Ισραηλ, ὃν ἐξελεξάμην — «и Израилю, егоже избрах». Стих — короткое обращение, открывающее новую речь (продолжение утешения после 43:28)."
  2: "ὁ ποιήσας σε καὶ ὁ πλάσας σε ἐκ κοιλίας — «сотворивый тя и создавый тя из утробы» (πλάσσω — лепить, 形づくる); ἔτι βοηθηθήσῃ — «еще поможет ти»: будущее страдательное, «ты ещё получишь помощь» (なお、あなたは助けられる). ὁ ἠγαπημένος Ισραηλ — «возлюбленный Израилю»; ὃν ἐξελεξάμην — «егоже избрах»."
  3: "δώσω ὕδωρ ἐν δίψει — «дам воду в жажду»; τοῖς πορευομένοις ἐν ἀνύδρῳ — «ходящым в безводней» (ἄνυδρος — безводный); ἐπιθήσω τὸ πνεῦμά μου ἐπὶ τὸ σπέρμα σου — «наложу дух мой на семя твое»; τὰς εὐλογίας μου ἐπὶ τὰ τέκνα σου — «благословения моя на чада твоя». В ru «изолью воды на жаждущее» — по МТ, в гр. и слав. «дам воду в жажде»."
  4: "ὡσεὶ χόρτος ἀνὰ μέσον ὕδατος — «аки трава посреде воды»; ὡς ἰτέα ἐπὶ παραρρέον ὕδωρ — «яко верба при воде текущей» (ἰτέα — ива, верба; 柳; παραρρέω — течь мимо)."
  5: "οὗτος ἐρεῖ Τοῦ θεοῦ εἰμι — «сей речет: Божий есмь»; ἕτερος ἐπιγράψει Τοῦ θεοῦ εἰμι — «другий напишет рукою своею: Божий есмь» (ἐπιγράφω — надписывать). Слова людей внутри речи Господа — в 『…』. Слав. добавляет в конце «и о имени израилеве возопиет» — в LXX этой клаузы нет (по МТ), не внесена, чтобы не удваивать イスラエルの名によって呼ばれる. Здесь закрывается речь 44:2–5."
  6: "ὁ θεὸς ὁ βασιλεὺς τοῦ Ισραηλ ὁ ῥυσάμενος αὐτόν — «Бог Царь Израилев, и избавлей его» (ῥύομαι — избавлять); θεὸς σαβαωθ — «Бог Саваоф», передано 万軍の神 (ср. 万軍の主 для κυριος σαβαωθ). ἐγὼ πρῶτος καὶ ἐγὼ μετὰ ταῦτα — «Аз первый и Аз по сих»: в МТ и ru «Я первый и Я последний» (ср. Откр 1:17; 2:8; 22:13), держим LXX и слав. πλὴν ἐμοῦ οὐκ ἔστιν θεός — «кроме мене несть Бога»."
  7: "τίς ὥσπερ ἐγώ — «кто якоже Аз»; στήτω καλεσάτω καὶ ἑτοιμασάτω μοι — «да станет и да призовет, и да возвестит и да уготовит ми» (ἑτοιμάζω — готовить, 備える); ἀφ᾽ οὗ ἐποίησα ἄνθρωπον εἰς τὸν αἰῶνα — «отнележе сотворих человека во век»; τὰ ἐπερχόμενα πρὸ τοῦ ἐλθεῖν ἀναγγειλάτωσαν ὑμῖν — «грядущая прежде неже приити им, да возвестят вам»."
  8: "μὴ παρακαλύπτεσθε — «не укрывайтеся» (παρακαλύπτομαι — скрываться, прятаться); слав. добавляет «ниже заблуждайте» — в LXX нет, по паритету внесено (惑わされるな). οὐκ ἀπ᾽ ἀρχῆς ἠνωτίσασθε — «не исперва ли внушисте» (ἐνωτίζομαι — внимать); μάρτυρες ὑμεῖς ἐστε, εἰ ἔστιν θεὸς πλὴν ἐμοῦ — «свидетелие вы есте, аще есть Бог разве мене»; καὶ οὐκ ἦσαν τότε — «и не было [их] тогда»: слав. этой клаузы не имеет, в тексте она есть (по LXX). Здесь закрывается речь 44:6–8."
  9: "οἱ πλάσσοντες καὶ γλύφοντες πάντες μάταιοι — «созидающии и ваяющии вси тщетни» (πλάσσω — лепить, γλύφω — резать, высекать); οἱ ποιοῦντες τὰ καταθύμια αὐτῶν — «творящии желания своя» (καταθύμιος — по сердцу, желанный); ἃ οὐκ ὠφελήσει αὐτούς — «яже не упользуют их» (ὠφελέω — помогать, приносить пользу). Гр. кончает стих словом ἀλλὰ αἰσχυνθήσονται («но постыдятся»); слав. переносит его в начало 44:10 — держим слав. (notes 10)."
  10: "πάντες οἱ πλάσσοντες θεὸν καὶ γλύφοντες ἀνωφελῆ — «вси созидающии бога и ваяющии вси неполезная» (ἀνωφελής — бесполезный): подлежащее, к которому слав. относит «но посрамятся» из 44:9. Здесь ирония начинается с анафоры πάντες."
  11: "πάντες ὅθεν ἐγένοντο ἐξηράνθησαν — «вси, отнюдуже быша, изсхоша»: место тёмное, вероятно «все, от кого они произошли, иссохли» (о мастерах и их роде). κωφοὶ ἀπὸ ἀνθρώπων — «глусии от человек»: LXX прочитала евр. חָרָשִׁים («художники, резчики») как «глухие»; в ru «художники сами из людей же» — по МТ, не внесено. συναχθήτωσαν… στήτωσαν… ἐντραπήτωσαν καὶ αἰσχυνθήτωσαν — четыре императива, сохранены."
  12: "ὤξυνεν τέκτων σίδηρον — «наостри древоделатель сечиво» (ὀξύνω — точить, острить); σκεπάρνῳ εἰργάσατο αὐτό — «теслою содела оное» (σκέπαρνον — тесло, 手斧); ἐν τερέτρῳ ἔτρησεν — «свердлом состави е» (τέρετρον — сверло, 錐); слав. добавляет «и длатом издолбе е» (долото, のみ) — в LXX нет, по паритету внесено. ἐν τῷ βραχίονι τῆς ἰσχύος αὐτοῦ — «крепостию мышцы своея»; πεινάσει καὶ ἀσθενήσει καὶ οὐ μὴ πίῃ ὕδωρ — «взалчет, и изнеможет, и не напиется воды». Гр. кончает стих словом ἐκλεξάμενος («выбрав»), слав. переносит его в 44:13 (notes 13)."
  13: "τέκτων ξύλον ἔστησεν αὐτὸ ἐν μέτρῳ — «древоделя древо, постави в меру»: по слав. «избрав дерево, поставил в меру» (ἐκλεξάμενος из 44:12). ἐν κόλλῃ ἐρρύθμισεν αὐτό — «клеем сострои е» (κόλλα — клей, 膠; ῥυθμίζω — устраивать, придавать вид); ὡς μορφὴν ἀνδρὸς καὶ ὡς ὡραιότητα ἀνθρώπου — «аки образ мужеск и аки красоту человечу» (ὡραιότης — красота); στῆσαι αὐτὸ ἐν οἴκῳ — «поставити е в дому»."
  14: "ὃ ἔκοψεν ξύλον ἐκ τοῦ δρυμοῦ — «посече древо в дубраве» (δρυμός — дубрава, лес); ὃ ἐφύτευσεν κύριος καὶ ὑετὸς ἐμήκυνεν — «еже насади Господь, и дождь возрасти» (ὑετός — дождь; μηκύνω — выращивать, удлинять). Слав. добавляет «сосну» — в LXX нет, по паритету внесено (松)."
  15: "ἵνα ᾖ ἀνθρώποις εἰς καῦσιν — «да будет человеком на жжение»; λαβὼν ἀπ᾽ αὐτοῦ ἐθερμάνθη — «взяв от него, согреся»; καύσαντες ἔπεψαν ἄρτους ἐπ᾽ αὐτῶν — «изжегше я, испекоша ими хлебы» (πέσσω — печь); τὸ δὲ λοιπὸν εἰργάσαντο εἰς θεούς — «из оставшаго же сотвориша боги». Слав. добавляет в конце «сотвори е изваянное, и прекланяется им» — удвоение, которого в LXX нет; по паритету внесено (刻んだ像を造り、これにひれ伏す)."
  16: "οὗ τὸ ἥμισυ αὐτοῦ κατέκαυσαν ἐν πυρί — «пол его сожже огнем»; ἐπ᾽ αὐτοῦ κρέας ὀπτήσας ἔφαγεν — «на них испече мясо, и яде» (ὀπτάω — жарить); ἐνεπλήσθη — «насытися»; θερμανθεὶς εἶπεν Ἡδύ μοι ὅτι ἐθερμάνθην — «согревся рече: сладко мне, яко согрехся» (ἡδύ — приятно, сладко). Слав. удваивает «пол его сожже… на углие» — отсюда その半ばを…その半ばを. Слова идолослужителя — в 「…」."
  17: "τὸ λοιπὸν ἐποίησεν εἰς θεὸν γλυπτόν — «из оставшаго же сотвори бога изваянна»; προσκυνεῖ αὐτῷ — «прекланяется ему»; προσεύχεται λέγων Ἐξελοῦ με — «молится глаголя: избави мя» (ἐξαιρέω — избавлять, вырывать); ὅτι θεός μου εἶ σύ — «яко бог мой еси ты». Молитва идолослужителя — в 「…」."
  18: "οὐκ ἔγνωσαν φρονῆσαι — «не уведаша смыслити» (φρονέω — разуметь, мыслить); ὅτι ἀπημαυρώθησαν τοῦ βλέπειν — «яко отемнеша еже видети» (ἀπαμαυρόω — помрачать, отнимать); τοῦ νοῆσαι τῇ καρδίᾳ αὐτῶν — «разумети сердцем своим»."
  19: "οὐκ ἐλογίσατο τῇ καρδίᾳ αὐτοῦ — «не помысли в души своей» (λογίζομαι — взвешивать, обдумывать); οὐδὲ ἀνελογίσατο ἐν τῇ ψυχῇ αὐτοῦ — «ни уведе смышлением» (ἀναλογίζομαι — соображать); τὸ ἥμισυ αὐτοῦ κατέκαυσεν ἐν πυρί — «пол его сожже огнем»; ἔπεψεν ἐπὶ τῶν ἀνθράκων αὐτοῦ ἄρτους — «испече на углиех его хлебы» (ἄνθραξ — уголь, 炭); εἰς βδέλυγμα ἐποίησεν — «в мерзость сотвори» (βδέλυγμα — мерзость, 忌まわしいもの)."
  20: "γνῶτε ὅτι σποδὸς ἡ καρδία αὐτῶν — «увеждь, яко пепел есть сердце их» (σποδός — пепел, 灰); πλανῶνται — «прельщаются»; οὐδεὶς δύναται ἐξελέσθαι τὴν ψυχὴν αὐτοῦ — «ни един может души своея избавити»; ἴδετε, οὐκ ἐρεῖτε ὅτι Ψεῦδος ἐν τῇ δεξιᾷ μου — «видите, не рцыте, яко лжа в деснице моей»: слова самих идолослужителей — в 「…」, как и в слав. обращение «не рцыте»."
  21: "Μνήσθητι ταῦτα, Ιακωβ καὶ Ισραηλ — «помяни сия, Иакове и Израилю»; ὅτι παῖς μου εἶ σύ — «яко раб мой еси ты»; ἔπλασά σε παῖδά μου — «сотворих тя раба моего» (πλάσσω — лепить, 形づくる); μὴ ἐπιλανθάνου μου — «не забывай мене». Здесь открывается речь 44:21–22."
  22: "ἀπήλειψα ὡς νεφέλην τὰς ἀνομίας σου — «отях яко облак беззакония твоя» (ἀπαλείφω — стирать, смахивать); ὡς γνόφον τὰς ἁμαρτίας σου — «яко примрак грехи твоя» (γνόφος — мрак, туман); ἐπιστράφητι πρός με, καὶ λυτρώσομαί σε — «обратися ко мне, и избавлю тя». Здесь закрывается речь."
  23: "εὐφράνθητε, οὐρανοί — «возвеселитеся, небеса»; σαλπίσατε, θεμέλια τῆς γῆς — «вострубите, основания земная» (σαλπίζω — трубить; 角笛を吹く); βοήσατε, ὄρη, εὐφροσύνην — «возопийте, горы, веселие» (внутренний объект, сохранён); ἐλυτρώσατο ὁ θεὸς τὸν Ιακωβ — «избави Бог Иакова»; Ισραηλ δοξασθήσεται — «Израиль прославится». Призыв к хвале — авторский голос, без кавычек, как 42:10–12."
  24: "ὁ λυτρούμενός σε καὶ ὁ πλάσσων σε ἐκ κοιλίας — «избавляяй тя и создавый тя от чрева»; ἐγὼ κύριος ὁ συντελῶν πάντα — «Аз Господь совершаяй вся» (συντελέω — совершать, завершать); ἐξέτεινα τὸν οὐρανὸν μόνος — «распрострох небо един»; ἐστερέωσα τὴν γῆν — «утвердих землю». Гр. кончает стих словами τίς ἕτερος («кто иной»); слав. переносит их в начало 44:25 («Кто ин»), держим слав. (notes 25)."
  25: "διασκεδάσει σημεῖα ἐγγαστριμύθων — «разсыплет знамения чревоволшебников» (διασκεδάζω — рассеивать; ἐγγαστρίμυθος — чревовещатель, 口寄せ師); μαντείας ἀπὸ καρδίας — «волшбы от сердца» (μαντεία — гадание, 占い); ἀποστρέφων φρονίμους εἰς τὰ ὀπίσω — «отвращаяй мудрыя вспять»; τὴν βουλὴν αὐτῶν μωρεύων — «советы их обуяяй» (μωρεύω — делать глупым). Начало — слав. «Кто ин» из 44:24."
  26: "ἱστῶν ῥήματα παιδὸς αὐτοῦ — «уставляя глагол раба своего» (ἵστημι — ставить, утверждать); τὴν βουλὴν τῶν ἀγγέλων αὐτοῦ ἀληθεύων — «совет вестников своих истинен творяй» (ἀγγελος — вестник, 使者; ἀληθεύω — делать истинным). ὁ λέγων Ιερουσαλημ Κατοικηθήσῃ — «глаголяй Иерусалиму: населишися»; ταῖς πόλεσιν τῆς Ιουδαίας Οἰκοδομηθήσεσθε — «градом иудейским: возградитеся»; τὰ ἔρημα αὐτῆς ἀνατελεῖ — «пустыни его просияют» (ἀνατέλλω — произрастать). Слова, сказанные Иерусалиму и городам, — в 『…』."
  27: "ὁ λέγων τῇ ἀβύσσῳ Ἐρημωθήσῃ — «глаголяй бездне: опустееши» (ἄβυσσος — бездна, 淵); τοὺς ποταμούς σου ξηρανῶ — «реки твоя изсушу». Слова к бездне — в 『…』."
  28: "ὁ λέγων Κύρῳ φρονεῖν — «глаголяй Киру смыслити»: φρονέω — «разуметь, быть разумным»; в МТ здесь «пастырь Мой» (ro‘i), и так в ru «Который говорит о Кире: пастырь Мой»; LXX και слав. дают «разуметь» — держим LXX (悟れ), расхождение отмечено. πάντα τὰ θελήματά μου ποιήσει — «вся воли моя сотворит»; ὁ λέγων Ιερουσαλημ Οἰκοδομηθήσῃ — «глаголяй Иерусалиму: возградишися»; τὸν οἶκον τὸν ἅγιόν μου θεμελιώσω — «храм святый мой осную». Кир назван по имени (クロス); в 45:1 он же — «помазанник». Здесь закрывается речь 44:24–28."
