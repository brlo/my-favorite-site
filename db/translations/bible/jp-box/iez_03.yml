verses:
  1: "わたしに言[い]われた。「人[ひと]の子[こ]よ、この巻[まき]物[もの]を食[た]べ、行[い]ってイスラエルの子[こ]らに語[かた]れ。」"
  2: "わたしが口[くち]を開[ひら]くと、その方[かた]はわたしにその巻[まき]物[もの]を食[た]べさせた。"
  3: "そして、わたしに言[い]われた。「人[ひと]の子[こ]よ、あなたの口[くち]が食[た]べ、あなたの腹[はら]が、あなたに与[あた]えられたこの巻[まき]物[もの]で満[み]たされるように。」わたしがそれを食[た]べると、わたしの口[くち]のうちで蜜[みつ]のように甘[あま]かった。"
  4: "わたしに言[い]われた。「人[ひと]の子[こ]よ、行[い]け。イスラエルの家[いえ]に入[はい]り、わたしの言葉[ことば]を彼[かれ]らに語[かた]れ。"
  5: "あなたは、言葉[ことば]の深[ふか]い、舌[した]の重[おも]い民[たみ]に遣[つか]わされるのではない。イスラエルの家[いえ]に遣[つか]わされるのだ。"
  6: "多[おお]くの異[こと]なる言語[げんご]の民[たみ]、あなたがその言葉[ことば]を理解[りかい]できないほど舌[した]の重[おも]い民[たみ]にではない。もしわたしがあなたをそのような者[もの]たちへ遣[つか]わしたなら、彼[かれ]らはあなたの言[い]うことを聞[き]いたであろう。"
  7: "しかし、イスラエルの家[いえ]はあなたの言[い]うことを聞[き]こうとしない。彼[かれ]らはわたしの言[い]うことを聞[き]こうとしないからである。イスラエルの家[いえ]はすべて、かたくなで、心[こころ]の強[こわ]い者[もの]たちだからである。"
  8: "見[み]よ、わたしはあなたの顔[かお]を、彼[かれ]らの顔[かお]に向[む]かって強[つよ]くした。あなたの争[あらそ]いを、彼[かれ]らの争[あらそ]いに向[む]かって強[つよ]くする。"
  9: "わたしはあなたの争[あらそ]いを、いつも石[いし]よりも強[つよ]くした。彼[かれ]らを恐[おそ]れてはならない。彼[かれ]らの顔[かお]に驚[おどろ]いてはならない。彼[かれ]らは反逆[はんぎゃく]の家[いえ]だからである。」"
  10: "わたしに言[い]われた。「人[ひと]の子[こ]よ、わたしがあなたと語[かた]ったすべての言葉[ことば]を心[こころ]に取[と]り、耳[みみ]で聞[き]け。"
  11: "行[い]って、捕囚[ほしゅう]の者[もの]たちの中[なか]へ、あなたの民[たみ]の子[こ]らへ入[はい]り、彼[かれ]らに語[かた]れ。彼[かれ]らにこう言[い]え。『主[しゅ]なる神[かみ]はこう言[い]われる』と。彼[かれ]らが聞[き]くにせよ、従[したが]うにせよ。」"
  12: "霊[れい]がわたしを取[と]り上[あ]げた。わたしは背後[はいご]で、大[おお]きな地震[じしん]の音[おと]とともに、「主[しゅ]の栄光[えいこう]は、その場所[ばしょ]からほめたたえられる」と言[い]う声[こえ]を聞[き]いた。"
  13: "また、生[い]き物[もの]たちの翼[つばさ]が互[たが]いに羽[はね]を打[う]ち合[あ]う音[おと]、それに沿[そ]う車輪[しゃりん]の音[おと]、大[おお]きな地震[じしん]の音[おと]が聞[こ]えた。"
  14: "霊[れい]がわたしを上[あ]げ、取[と]り上[あ]げた。わたしは自分[じぶん]の霊[れい]の激[はげ]しさに駆[か]られて行[い]った。主[しゅ]の手[て]がわたしの上[うえ]に強[つよ]くあった。"
  15: "わたしは捕囚[ほしゅう]の者[もの]たちのところへ、上[あ]げられたまま入[はい]って行[い]き、ケバル川[がわ]のほとりに住[す]む者[もの]たちを巡[めぐ]り、そこに七[なの]日[か]の間[あいだ]、彼[かれ]らのただ中[なか]にいて座[すわ]っていた。"
  16: "七[なの]日[か]が過[す]ぎてから、主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んだ。"
  17: "「人[ひと]の子[こ]よ、わたしはあなたをイスラエルの家[いえ]への見張[みは]り人[びと]とした。あなたはわたしの口[くち]から言葉[ことば]を聞[き]き、わたしに代[か]わって彼[かれ]らを戒[いまし]めなければならない。"
  18: "わたしが不法[ふほう]の者[もの]に『あなたは必[かなら]ず死[し]ぬ』と言[い]うとき、あなたが彼[かれ]に告[つ]げず、不法[ふほう]の者[もの]に、その道[みち]から離[はな]れて生[い]きるようにと語[かた]って戒[いまし]めないなら、その不法[ふほう]の者[もの]は自分[じぶん]の不法[ふほう]のゆえに死[し]ぬ。わたしは彼[かれ]の血[ち]をあなたの手[て]から求[もと]める。"
  19: "しかし、あなたが不法[ふほう]の者[もの]に告[つ]げても、彼[かれ]がその不法[ふほう]とその道[みち]から離[はな]れないなら、その不法[ふほう]の者[もの]は自分[じぶん]の不法[ふほう]のゆえに死[し]ぬ。あなたは自分[じぶん]の魂[たましい]を救[すく]う。"
  20: "また、正[ただ]しい者[もの]がその正[ただ]しさから離[はな]れて罪[つみ]を犯[おか]すとき、わたしが彼[かれ]の前[まえ]に苦[くる]しみを置[お]けば、彼[かれ]は死[し]ぬ。あなたが彼[かれ]を戒[いまし]めなかったからである。彼[かれ]は自分[じぶん]の罪[つみ]のゆえに死[し]に、その行[おこな]った正[ただ]しさは思[おも]い起[こ]こされない。わたしは彼[かれ]の血[ち]をあなたの手[て]から求[もと]める。"
  21: "しかし、あなたが正[ただ]しい者[もの]に、罪[つみ]を犯[おか]さないようにと告[つ]げ、彼[かれ]が罪[つみ]を犯[おか]さないなら、その正[ただ]しい者[もの]は生[い]きる。あなたが彼[かれ]を戒[いまし]めたからである。あなたは自分[じぶん]の魂[たましい]を救[すく]う。」"
  22: "主[しゅ]の手[て]がわたしの上[うえ]にあった。そして、わたしに言[い]われた。「立[た]って、野[の]へ出[で]よ。そこで、あなたに語[かた]られるであろう。」"
  23: "わたしは立[た]って野[の]へ出[で]た。見[み]よ、そこに主[しゅ]の栄光[えいこう]が立[た]っていた。ケバル川[がわ]で見[み]た幻[まぼろし]のとおり、主[しゅ]の栄光[えいこう]のとおりであった。わたしは顔[かお]を地[ち]につけて伏[ふ]した。"
  24: "霊[れい]がわたしの上[うえ]に来[き]て、わたしを自分[じぶん]の足[あし]の上[うえ]に立[た]たせた。その方[かた]はわたしに語[かた]り、言[い]われた。「入[はい]って、自分[じぶん]の家[いえ]の中[なか]に閉[と]じこもれ。"
  25: "人[ひと]の子[こ]よ、見[み]よ、あなたには縄[なわ]が与[あた]えられ、それであなたを縛[しば]る。あなたは彼[かれ]らの間[あいだ]から出[で]て行[い]くことはできない。"
  26: "わたしはあなたの舌[した]をあなたの喉[のど]に結[むす]びつける。あなたは口[くち]がきけなくなり、彼[かれ]らを責[せ]める者[もの]ではなくなる。彼[かれ]らは反逆[はんぎゃく]の家[いえ]だからである。"
  27: "しかし、わたしがあなたに語[かた]るとき、あなたの口[くち]を開[ひら]く。あなたは彼[かれ]らに言[い]わなければならない。『主[しゅ]なる神[かみ]はこう言[い]われる。聞[き]く者[もの]は聞[き]け。聞[き]き従[したが]わぬ者[もの]は聞[き]き従[したが]わなくてよい』と。彼[かれ]らは反逆[はんぎゃく]の家[いえ]だからである。」"

notes:
  1: "κατάφαγε τὴν κεφαλίδα ταύτην — «съешь свиток этот» (καταφάγω — съесть; κεφαλίς — свиток, 巻物); πορεύθητι — «иди»; λάλησον τοῖς υἱοῖς Ισραηλ — «говори сынам Израилевым». Здесь начинается речь Бога, закрывается в конце стиха."
  2: "διήνοιξα τὸ στόμα μου — «открыл уста мои» (διανοίγω — открывать); ἐψώμισέν με τὴν κεφαλίδα — «напитал меня свитком» (ψωμίζω — кормить куском, 食べさせる)."
  3: "τὸ στόμα σου φάγεται — «уста твои съедят»; ἡ κοιλία σου πλησθήσεται — «чрево твоё насытится» (κοιλία — чрево, 腹); ὡς μέλι γλυκάζον — «как мёд сладящий» (γλυκάζω — быть сладким, 甘い). Речь Бога — до конца стиха."
  4: "βάδιζε εἴσελθε — «иди, войди»; λάλησον τοὺς λόγους μου — «говори слова Мои». Речь Бога идёт непрерывно до конца 3:9."
  5: "λαὸν βαθύχειλον καὶ βαρύγλωσσον — «народ глубокоустый и тяжелоязычный» (βαθύχειλος — с глубокими, т.е. непонятными устами; βαρύγλωσσος — тяжёлый на язык); слав. «глубокоречивым и косноязычным» — по нему и переведено (言葉の深い、舌の重い)."
  6: "ἀλλοφύλους ἢ ἀλλογλώσσους — «иноплеменных или иноязычных»; στιβαροὺς τῇ γλώσσῃ — «крепких (тяжёлых) языком»; ὧν οὐκ ἀκούσῃ τοὺς λόγους αὐτῶν — «которых слов ты не поймёшь»; εἰσήκουσάν σου — «послушали бы тебя». Условное «если бы» с нереальным следствием сохранено."
  7: "οὐ μὴ θελήσωσιν εἰσακοῦσαί σου — «не захотят послушать тебя»; οὐ βούλονται εἰσακούειν μου — «не хотят слушать Меня»; φιλόνεικοι — «спорливые, любящие пререкания» (φιλόνεικος); σκληροκάρδιοι — «жестокосердые». Слав. «непокориви суть и жестокосерди» — оба члена сохранены (かたくなで、心の強い)."
  8: "δέδωκα τὸ πρόσωπόν σου δυνατόν — «дал лицо твоё сильным»; τὸ νεῖκός σου κατισχύσω — «вражду (распрю) твою укреплю» (νεῖκος — распря, спор; слав. «прю»); κατέναντι τοῦ νείκους αὐτῶν — «против распри их». ru и МТ читают здесь «чело … лоб» (מֵצַח) — иное чтение, в LXX и слав. нет, не внесено."
  9: "κραταιότερον πέτρας — «крепче камня»; слав. повторяет «дах прю твою» (из 3:8), поэтому и здесь 争[あらそ]い; μὴ φοβηθῇς ἀπ᾽ αὐτῶν — «не убойся их»; μηδὲ πτοηθῇς — «не ужасайся». ru «как алмаз» — масоретское чтение, не внесено."
  10: "λαβὲ εἰς τὴν καρδίαν σου — «возьми в сердце твоё»; τοῖς ὠσίν σου ἄκουε — «ушами твоими слушай». Новое вводное «и сказал мне» — речь Бога прерывается и начинается снова (до конца 3:11)."
  11: "εἰς τὴν αἰχμαλωσίαν — «в плен» (к переселенным); πρὸς τοὺς υἱοὺς τοῦ λαοῦ σου — «к сынам народа твоего»; ἐὰν ἄρα ἀκούσωσιν, ἐὰν ἄρα ἐνδῶσιν — «будут ли слушать, уступят ли» (ἐνδίδωμι — уступать); слав. «аще убо послушают и аще убо повинутся» — формула передана как 聞くにせよ、従うにせよ. Слова пророка к народу — 『…』."
  12: "ἀνέλαβέν με πνεῦμα — «взял меня дух»; φωνὴν σεισμοῦ μεγάλου — «голос великого сотрясения» (σεισμός — землетрясение, гром); Εὐλογημένη ἡ δόξα κυρίου ἐκ τοῦ τόπου αὐτοῦ — «благословенна слава Господня от места Его». Слав. добавляет «глаголющих» («говорящих») — в LXX нет, внесено. Славословие — 「…」, т.к. это не речь Бога к пророку."
  13: "φωνὴν πτερύγων τῶν ζῴων πτερυσσομένων ἑτέρα πρὸς τὴν ἑτέραν — «голос крыльев животных, веющих друг к другу»; φωνὴ τῶν τροχῶν ἐχομένη αὐτῶν — «голос колёс при них»; φωνὴ τοῦ σεισμοῦ — «голос сотрясения». Слав. «и видех глас» — буквально «увидел голос»: тёмное место, передано как 聞[き]こえた."
  14: "τὸ πνεῦμα ἐξῆρέν με καὶ ἀνέλαβέν με — «дух поднял меня и взял меня»; ἐπορεύθην ἐν ὁρμῇ τοῦ πνεύματός μου — «пошёл в устремлении духа моего» (ὁρμή — порыв, натиск); χεὶρ κυρίου ἐγένετο ἐπ᾽ ἐμὲ κραταιά — «рука Господня была на мне крепка»."
  15: "μετέωρος — «вознесённый, поднятый»; περιῆλθον τοὺς κατοικοῦντας ἐπὶ τοῦ ποταμοῦ τοῦ Χοβαρ — «обошёл живущих при реке Ховар»; ἑπτὰ ἡμέρας ἀναστρεφόμενος ἐν μέσῳ αὐτῶν — «семь дней обращаясь (пребывая) среди них». ru «в изумлении» — иное понимание (МТ), не внесено."
  16: "μετὰ τὰς ἑπτὰ ἡμέρας — «по семи днях»; λόγος κυρίου πρός με λέγων — «слово Господне ко мне, говоря». Вводная формула — вне кавычек, речь Бога начинается в 3:17."
  17: "σκοπὸν δέδωκά σε τῷ οἴκῳ Ισραηλ — «стражем дал тебя дому Израилеву» (σκοπός — страж, 見張り人); ἀκούσῃ ἐκ στόματός μου λόγον — «услышишь из уст Моих слово»; διαπειλήσῃ αὐτοῖς παρ᾽ ἐμοῦ — «пригрозишь (возвестишь) им от Меня» (διαπειλέω — грозить, возвещать с угрозой)."
  18: "Θανάτῳ θανατωθήσῃ — «смертью умрёшь» (усилительное сочетание; слав. «смертию умреши»), передано 必[かなら]ず死[し]ぬ, как Быт 2:17; οὐ διεστείλω αὐτῷ — «не возвестил (не вразумил) ему» (διαστέλλω — различать, заповедовать); τοῦ ἀποστρέψαι ἀπὸ τῶν ὁδῶν αὐτοῦ — «чтобы обратиться от путей своих»; τὸ αἷμα αὐτοῦ ἐκ χειρός σου ἐκζητήσω — «кровь его от руки твоей взыщу»."
  19: "ἐὰν διαστείλῃ τῷ ἀνόμῳ — «если возвестишь беззаконнику»; μὴ ἀποστρέψῃ ἀπὸ τῆς ἀνομίας αὐτοῦ — «не обратится от беззакония своего»; τὴν ψυχήν σου ῥύσῃ — «душу твою избавишь» (ῥύομαι — избавлять, 救う)."
  20: "ἐν τῷ ἀποστρέφειν δίκαιον ἀπὸ τῶν δικαιοσυνῶν αὐτοῦ — «когда совращается праведник от правд своих»; παράπτωμα — «прегрешение»; δώσω τὴν βάσανον εἰς πρόσωπον αὐτοῦ — «дам мучение пред лицом его» (βάσανος — мучение; ru «преткновение» — МТ); οὐ μὴ μνησθῶσιν αἱ δικαιοσύναι αὐτοῦ — «не вспомнятся правды его»."
  21: "ζωῇ ζήσεται — «жизнью поживёт» (усиление); ὅτι διεστείλω αὐτῷ — «ибо ты возвестил ему»; τὴν σεαυτοῦ ψυχὴν ῥύσῃ — «душу твою избавишь». Здесь речь Бога закрывается."
  22: "Ἀνάστηθι καὶ ἔξελθε εἰς τὸ πεδίον — «встань и выйди в поле» (πεδίον — поле, равнина); λαληθήσεται πρός σε — «будет говорено тебе» (безличный пассив; слав. «возглаголется к тебе»)."
  23: "δόξα κυρίου εἱστήκει — «слава Господня стояла»; καθὼς ἡ ὅρασις καὶ καθὼς ἡ δόξα — «как видение и как слава»; πίπτω ἐπὶ πρόσωπόν μου — «падаю на лицо моё»."
  24: "ἦλθεν ἐπ᾽ ἐμὲ πνεῦμα — «пришёл на меня дух»; ἔστησέν με ἐπὶ πόδας μου — «поставил меня на ноги мои»; ἐγκλείσθητι ἐν μέσῳ τοῦ οἴκου σου — «запрись внутри дома твоего» (ἐγκλείω — затворять). Речь Бога продолжается до конца 3:27."
  25: "δέδονται ἐπὶ σὲ δεσμοί — «возложены на тебя узы» (δεσμός — узы, 縄); δήσουσίν σε ἐν αὐτοῖς — «свяжут тебя ими»; οὐ μὴ ἐξέλθῃς ἐκ μέσου αὐτῶν — «не выйдешь из среды их»."
  26: "τὴν γλῶσσάν σου συνδήσω — «свяжу язык твой» (συνδέω — связывать); слав. добавляет «к гортани твоему» — в LXX нет (ср. МТ), внесено; ἀποκωφωθήσῃ — «онемеешь» (ἀποκωφόω — делать глухим, немым); ἄνδρα ἐλέγχοντα — «мужа обличающего» (ἐλέγχω — обличать, 責める)."
  27: "ἀνοίξω τὸ στόμα σου — «открою уста твои»; Ὁ ἀκούων ἀκουέτω — «слушающий да слушает»; ὁ ἀπειθῶν ἀπειθείτω — «непокорный да не покоряется» (ἀπειθέω — не покоряться). Слова пророка к народу — 『…』 внутри речи Бога; здесь и речь Бога, и глава закрываются."
