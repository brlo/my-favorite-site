# jp-box, Иезекииль, глава 3. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для главы есть частично (3:1–3), сверен как свидетель
# церковного чтения, в текст не копировался; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 3: 1–3 пророк съедает свиток, «сладко, как мёд»; 4–9 послание к дому
# Израилеву: не к иноязычным народам, а к дому мятежному, лицо и «вражда» пророка
# крепче камня; 10–11 слова в сердце и послание к переселенным; 12–15 дух поднимает
# пророка, глас великого сотрясения, «благословенна слава Господня», семь дней
# среди переселенцев при Ховаре; 16–21 страж дому Израилеву: кровь беззаконника и
# праведника взыщется с пророка, если он не вразумил; 22–27 рука Господня, поле,
# слава Господня, дух ставит на ноги, повеление запереться в доме, узы, немота и
# отверзение уст: «слушающий да слушает».
# Нумерация по gr: 27 стихов, совпадает с csl и ru.
# Голоса: 3:1, 3:3, 3:4–3:9, 3:10–3:11, 3:17–3:21, 3:22, 3:24–3:27 — речь Бога в 「…」
# (в 3:11 и 3:27 вложенные слова пророка к народу — 『…』, в 3:18 слова Бога к
# беззаконнику — 『…』); 3:12 — славословие в 「…」 внутри повествования; 3:13–3:16,
# 3:23 — повествование без кавычек. Вводные формулы («И сказал мне», «И было слово
# Господне ко мне») — вне кавычек.
# 〔…〕 нет. Слав. добавления внесены в основной текст без скобок и оговорены:
# 3:12 «глаголющих», 3:26 «к гортани твоему».
# Сносок ⟨…⟩ нет: 巻物, 見張り人, 反逆, 魂, 霊 уже в корпусе или понятны.
# Имена — транслитерация греческого (LXX): エゼキエル, イスラエル, ケバル川 (Χοβαρ).
# Повторяющиеся формулы: οἶκος παραπικραίνων — 反逆[はんぎゃく]の家[いえ];
# Υἱὲ ἀνθρώπου — 人[ひと]の子[こ]; Τάδε λέγει κύριος — 主[しゅ]なる神[かみ]はこう
# 言[い]われる; ἀκούσῃ ἐκ στόματός μου — わたしの口[くち]から聞[き]く.

