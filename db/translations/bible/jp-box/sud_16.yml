verses:
  1: "サムソンはそこからガザへ行[い]き、そこで一人[ひとり]の娼婦[しょうふ]を見[み]て、彼女[かのじょ]のところに入[はい]った。"
  2: "ガザの人々[ひとびと]に告[つ]げる者[もの]があって言[い]った。「サムソンがここへ来[き]た。」そこで彼[かれ]らは彼[かれ]を取[と]り囲[かこ]み、町[まち]の門[もん]のところで一晩中[ひとばんじゅう]彼[かれ]を待[ま]ち伏[ぶ]せた。そして一晩中[ひとばんじゅう]、声[こえ]を潜[ひそ]めて言[い]った。「夜[よ]が明[あ]けるまで待[ま]って、彼[かれ]を殺[ころ]そう。」"
  3: "サムソンは真夜中[まよなか]まで眠[ねむ]り、真夜中[まよなか]ごろ起[お]き上[あ]がって、町[まち]の門[もん]の扉[とびら]と二[ふた]つの門柱[もんちゅう]を掴[つか]み、かんぬきごとそれらを引[ひ]き抜[ぬ]いて肩[かた]に載[の]せ、ヘブロンに面[めん]した山[やま]の頂[いただき]まで運[はこ]んで、そこに置[お]いた。"
  4: "その後[あと]、彼[かれ]はソレクの谷川[たにがわ]の女[おんな]を愛[あい]した。その名[な]はデリラといった。"
  5: "ペリシテ人[じん]の領主[りょうしゅ]たちが彼女[かのじょ]のところへ上[のぼ]って来[き]て言[い]った。「彼[かれ]をだまして、彼[かれ]の大[おお]きな力[ちから]がどこにあるのか、また、どうすればわたしたちが彼[かれ]に勝[か]って、彼[かれ]を縛[しば]り、弱[よわ]らせることができるかを探[さぐ]り出[だ]してくれ。わたしたちは一人[ひとり]につき銀[ぎん]千百[せんひゃく]シケルをあなたに与[あた]えよう。」"
  6: "デリラはサムソンに言[い]った。「あなたの大[おお]きな力[ちから]がどこにあるのか、何[なに]で縛[しば]ればあなたを弱[よわ]らせることができるのか、教[おし]えてください。」"
  7: "サムソンは彼女[かのじょ]に言[い]った。「もし人[ひと]がわたしを、まだ乾[かわ]いていない七本[ななほん]の弦[つる]で縛[しば]るなら、わたしは弱[よわ]くなって、一人[ひとり]の人間[にんげん]のようになる。」"
  8: "ペリシテ人[じん]の領主[りょうしゅ]たちは、まだ乾[かわ]いていない七本[ななほん]の弦[つる]を彼女[かのじょ]に持[も]って来[き]た。彼女[かのじょ]はそれで彼[かれ]を縛[しば]った。"
  9: "しかも、待[ま]ち伏[ぶ]せの者[もの]が彼女[かのじょ]の奥[おく]の部屋[へや]に座[すわ]っていた。彼女[かのじょ]は彼[かれ]に言[い]った。「サムソン、ペリシテ人[じん]があなたに迫[せま]っています。」すると彼[かれ]は、火[ひ]が触[ふ]れると切[き]れる麻[あさ]くずの糸[いと]のように、その弦[つる]を断[た]ち切[き]った。それでも、彼[かれ]の力[ちから]は知[し]られなかった。"
  10: "デリラはサムソンに言[い]った。「見[み]てください。あなたはわたしを欺[あざむ]いて、偽[いつわ]りを言[い]いました。今[いま]、何[なに]で縛[しば]ればよいのか教[おし]えてください。」"
  11: "彼[かれ]は彼女[かのじょ]に言[い]った。「もし人[ひと]が、まだ何[なに]にも使[つか]われていない新[あたら]しい七本[ななほん]の縄[なわ]でわたしをしっかと縛[しば]るなら、わたしは弱[よわ]くなって、一人[ひとり]の人間[にんげん]のようになる。」"
  12: "デリラは新[あたら]しい縄[なわ]を取[と]って彼[かれ]を縛[しば]り、彼[かれ]に言[い]った。「サムソン、ペリシテ人[じん]があなたに迫[せま]っています。」待[ま]ち伏[ぶ]せの者[もの]は奥[おく]の部屋[へや]に座[すわ]っていた。しかし彼[かれ]は、その縄[なわ]を糸[いと]のように腕[うで]から引[ひ]きちぎった。"
  13: "デリラはサムソンに言[い]った。「今[いま]まであなたはわたしを欺[あざむ]いて、偽[いつわ]りを言[い]ってきました。何[なに]で縛[しば]ればよいのか教[おし]えてください。」彼[かれ]は彼女[かのじょ]に言[い]った。「もしあなたがわたしの頭[あたま]の七[なな]つの髪[かみ]の房[ふさ]を織[お]り物[もの]の縦糸[たていと]とともに織[お]り込み、杭[くい]を壁[かべ]に打[う]ち込[こ]めば、わたしは一人[ひとり]の人間[にんげん]のように弱[よわ]くなる。」"
  14: "デリラは彼[かれ]を眠[ねむ]らせ、頭[あたま]の七[なな]つの髪[かみ]の房[ふさ]を織[お]り物[もの]の縦糸[たていと]とともに織[お]り込[こ]んで、杭[くい]を壁[かべ]に打[う]ち込[こ]んだ。そして彼[かれ]に言[い]った。「サムソン、ペリシテ人[じん]があなたに迫[せま]っています。」彼[かれ]は眠[ねむ]りから目[め]を覚[さ]まし、杭[くい]と織[お]り物[もの]と縦糸[たていと]を壁[かべ]から引[ひ]き抜[ぬ]いた。それでも、彼[かれ]の力[ちから]は知[し]られなかった。"
  15: "デリラは彼[かれ]に言[い]った。「どうして『あなたを愛[あい]している』と言[い]えるのですか。あなたの心[こころ]はわたしとともにありません。もう三度[さんど]もあなたはわたしを欺[あざむ]いて、大[おお]きな力[ちから]がどこにあるのか教[おし]えてくれませんでした。」"
  16: "彼女[かのじょ]が一晩中[ひとばんじゅう]、その言葉[ことば]で彼[かれ]を責[せ]め立[た]てて悩[なや]ませたので、彼[かれ]の心[こころ]は死[し]ぬほどに折[お]れた。"
  17: "彼[かれ]は心[こころ]のすべてを彼女[かのじょ]に明[あ]かし、言[い]った。「剃刀[かみそり]はわたしの頭[あたま]に上[のぼ]ったことがない。わたしは母[はは]の胎内[たいない]から神[かみ]のナジル人[じん]だからである。もしわたしが剃[そ]られたら、わたしの力[ちから]はわたしから去[さ]り、わたしは弱[よわ]くなって、すべての人[ひと]のようになる。」"
  18: "デリラは、彼[かれ]が心[こころ]のすべてを自分[じぶん]に明[あ]かしたのを見[み]て、人[ひと]を遣[つか]わしてペリシテ人[じん]の領主[りょうしゅ]たちをみな呼[よ]び、言[い]った。「今度[こんど]こそ上[のぼ]って来[き]てください。彼[かれ]は心[こころ]のすべてをわたしに明[あ]かしました。」ペリシテ人[じん]の領主[りょうしゅ]たちはみな彼女[かのじょ]のところへ上[のぼ]って来[き]て、銀[ぎん]を手[て]に携[たずさ]えて来[き]た。"
  19: "デリラは彼[かれ]を自分[じぶん]の膝[ひざ]の間[あいだ]で眠[ねむ]らせ、髪[かみ]を刈[か]る者[もの]を呼[よ]んで、彼[かれ]の頭[あたま]の七[なな]つの髪[かみ]の房[ふさ]を剃[そ]らせた。すると彼[かれ]は弱[よわ]り始[はじ]め、力[ちから]は彼[かれ]から去[さ]った。"
  20: "デリラは言[い]った。「サムソン、ペリシテ人[じん]があなたに迫[せま]っています。」彼[かれ]は眠[ねむ]りから目[め]を覚[さ]まして言[い]った。「いつものように出[で]て行[ゆ]き、身[み]を振[ふ]り払[はら]おう。」主[しゅ]が自分[じぶん]から去[さ]られたことを知[し]らなかったのである。"
  21: "ペリシテ人[じん]は彼[かれ]を捕[つか]まえ、目[め]をえぐり出[だ]し、ガザに引[ひ]き下[お]ろして、青銅[せいどう]の足枷[あしかせ]で縛[しば]った。彼[かれ]は牢[ろう]の家[いえ]で臼[うす]をひいていた。"
  22: "彼[かれ]の頭[あたま]の髪[かみ]は、剃[そ]られた後[のち]、再[ふたた]び伸[の]び始[はじ]めた。"
  23: "ペリシテ人[じん]の領主[りょうしゅ]たちは、自分[じぶん]たちの神[かみ]ダゴンに大[おお]きな犠牲[ぎせい]を捧[ささ]げ、喜[よろこ]び楽[たの]しむために集[あつ]まった。そして言[い]った。「わたしたちの神[かみ]は、わたしたちの敵[てき]サムソンをわたしたちの手[て]に渡[わた]した。」"
  24: "民[たみ]も彼[かれ]を見[み]て、自分[じぶん]たちの神[かみ]を賛美[さんび]して言[い]った。「わたしたちの神[かみ]は、わたしたちの敵[てき]と、わたしたちの地[ち]を荒[あ]らし、わたしたちの傷[きず]ついた者[もの]を多[おお]くした者[もの]とを、わたしたちの手[て]に渡[わた]した。」"
  25: "彼[かれ]らの心[こころ]が浮[う]かれると、彼[かれ]らは言[い]った。「牢[ろう]の家[いえ]からサムソンを呼[よ]んで来[こ]させ、わたしたちの前[まえ]で戯[たわむ]れさせよ。」彼[かれ]らは牢[ろう]の家[いえ]からサムソンを呼[よ]び、彼[かれ]は彼[かれ]らの前[まえ]で戯[たわむ]れた。彼[かれ]らは彼[かれ]を嘲[あざけ]り、二本[にほん]の柱[はしら]の間[あいだ]に立[た]たせた。"
  26: "サムソンは、彼[かれ]の手[て]を引[ひ]く若[わか]い者[もの]に言[い]った。「わたしを休[やす]ませ、家[いえ]がその上[うえ]に支[ささ]えられている柱[はしら]に手[て]を触[ふ]れさせてくれ。そこに寄[よ]りかかりたいのだ。」若[わか]い者[もの]はそのとおりにした。"
  27: "家[いえ]は男[おとこ]と女[おんな]で満[み]ちていた。そこにはペリシテ人[じん]の領主[りょうしゅ]たちがみなおり、屋上[おくじょう]にも、嘲[あざけ]られるサムソンを見[み]ている男[おとこ]と女[おんな]が三千人[さんぜんにん]ほどいた。"
  28: "サムソンは主[しゅ]に叫[さけ]んで言[い]った。「主[しゅ]よ、主[しゅ]よ、わたしを思[おも]い起[お]こしてください。どうか、もう一度[いちど]だけ、わたしを強[つよ]くしてください。そうすれば、わたしはペリシテ人[じん]に、この二[ふた]つの目[め]のための一[ひと]つの復讐[ふくしゅう]を果[は]たします。」"
  29: "サムソンは、家[いえ]がその上[うえ]に支[ささ]えられている二本[にほん]の真[ま]ん中[なか]の柱[はしら]を抱[だ]き、右[みぎ]の手[て]に一[ひと]つ、左[ひだり]の手[て]に一[ひと]つを当[あ]てて寄[よ]りかかった。"
  30: "サムソンは言[い]った。「わたしの魂[たましい]が、ペリシテ人[じん]とともに死[し]にますように。」彼[かれ]は力[ちから]の限[かぎ]りを尽[つ]くして身[み]を傾[かたむ]けた。家[いえ]は領主[りょうしゅ]たちと、その中[なか]にいたすべての民[たみ]の上[うえ]に崩[くず]れ落[お]ちた。彼[かれ]が死[し]ぬとき殺[ころ]した者[もの]は、生[い]きている間[あいだ]に殺[ころ]した者[もの]よりも多[おお]かった。"
  31: "彼[かれ]の兄弟[きょうだい]たちと父[ちち]の家[いえ]のすべての者[もの]が下[くだ]って来[き]て、彼[かれ]を引[ひ]き取[と]り、上[のぼ]って行[い]き、ツォルアとエシュタオルの間[あいだ]、父[ちち]マノアの墓[はか]に葬[ほうむ]った。彼[かれ]は二十年[にじゅうねん]の間[あいだ]、イスラエルを裁[さば]いた。"

notes:
  1: "πόρνην — «блудницу» (πόρνη; 娼婦 — как в Нав 2:1). εἰσῆλθεν πρὸς αὐτήν — «вошёл к ней» (эвфемизм)."
  2: "ἀπηγγέλη ... λέγοντες — «донесено было, говоря» (безличная конструкция, как в Нав 2:2). Ἥκει — plusquamperfect от ἥκω: «пришёл». ἐκύκλωσαν — «окружили» (κυκλόω). ἐνήδρευσαν — «устроили засаду» (ἐνεδρεύω). ἐκώφευσαν — «молчали, затаились» (κωφεύω — немотствовать; слав. «утаишася»). Ἕως φωτὸς πρωΐ — «до утреннего света»."
  3: "ἕως τοῦ μεσονυκτίου — «до полуночи». σταθμῶν — «косяков, стояков» (σταθμός). ἀνεβάστασεν σὺν τῷ μοχλῷ — «поднял вместе с засовом» (μοχλός). ἐπὶ πρόσωπον Χεβρων — «напротив Хеврона, лицом к Хеврону»."
  4: "ἐπὶ τοῦ χειμάρρου Σωρηχ — «при потоке Сорек» (χείμαρρος — 谷川, ср. 15:8); ソレク. ἠγάπησεν — «полюбил». Δαλιλα — Далида."
  5: "οἱ σατράπαι τῶν ἀλλοφύλων — «сатрапы филистимские» (σατράπης — правитель области; в русской традиции «владельцы», передано как 領主). Ἀπάτησον — «обмани» (ἀπατάω). ἐν τίνι ἡ ἰσχὺς αὐτοῦ — «в чём сила его». ταπεινῶσαι — «смирить» (передано как 弱らせる). ἀνὴρ χιλίους καὶ ἑκατὸν ἀργυρίου — «человек по тысяче ста серебра», т.е. по 1100 сиклей с каждого (слав. «кийждо тысящу и сто сребреников»); シケル уже пояснён в корпусе."
  6: "Ἀνάγγειλόν μοι — «возвести мне». δεθῆσῃ τοῦ ταπεινωθῆναί σε — «ты будешь связан, чтобы смирить тебя» (τοῦ с инфинитивом — цель)."
  7: "ἑπτὰ νευραῖς ὑγραῖς μὴ ἠρημωμέναις — «семью тетивами влажными, не высохшими» (νευρά — тетива, сухожилие, 弦; ὑγρός — влажный; ἐρημόω — опустошать, здесь «высохнуть»); слав. «седмию тятивами сырыми неистлевшими». ὡς εἷς τῶν ἀνθρώπων — «как один из людей»."
  8: "ἀνήνεγκαν — «принесли» (ἀναφέρω). ἔδησεν αὐτὸν ἐν αὐταῖς — «связала его ими»."
  9: "τὸ ἔνεδρον — «засада» (ἔνεδρον; 待ち伏せ). ταμιείῳ — «внутренней комнате, кладовой» (ταμιεῖον). κλῶσμα τοῦ ἀποτινάγματος — «пряжа, клочок отрясённого», т.е. пакля (κλῶσμα — нить; ἀποτίναγμα — вычески); слав. «соскание изгребий». ἐν τῷ ὀσφρανθῆναι πυρός — «когда понюхает огня». οὐκ ἐγνώσθη — «не была узнана»."
  10: "παρελογίσω με — «обманул меня» (παραλογίζομαι — обманывать, вводить в счёт). ἐλάλησας ... ψευδῆ — «говорил ложь»."
  11: "δεσμῷ δήσωσίν με — «связав свяжут меня» (усиление, ср. 15:13). ἐν οἷς οὐκ ἐγενήθη ἔργον — «на которых не было работы», т.е. не были в деле."
  12: "ἔλαβεν ... καλώδια καινά — «взяла новые верёвки». διέσπασεν — «сорвал» (διασπάω). ὡς ῥάμμα — «как нитку» (ῥάμμα — шов, нить)."
  13: "Ἕως νῦν παρελογίσω με — «до сих пор ты обманывал меня». σειρὰς τῆς κεφαλῆς — «косы, ряды головы» (σειρά — цепь, ряд; 髪の房). διάσματος — «ткани, основы» (δίασμα — основа ткани). πασσάλῳ — «колом» (πάσσαλος). ἐγκρούσῃς — «вобьёшь» (ἐγκρούω)."
  14: "ἐκοίμισεν — «усыпила» (κοιμίζω). ἐδιάσατο — форма тёмная (возможно, от διαίνω или διάζομαι); по смыслу «разделила, расплела», слав. «и сплете спрядением». ἐκτάσεως — «основы ткацкого станка» (ἔκτασις — протяжение). κατέκρουσεν ἐν τοῖς πασσάλοις — «прибила кольями». ἐξέσπασεν — «вырвал» (ἐκσπάω)."
  15: "Πῶς ἐρεῖς Ἠγάπηκά σε — «как ты говоришь: я возлюбил тебя» (цитата слов Самсона — 『…』). τοῦτο τρίτον — «это третий раз» (слав. «се, третие»)."
  16: "κατειργάσατο αὐτὸν τοῖς λόγοις αὐτῆς — «обработала его словами своими» (κατεργάζομαι — воздействовать). ὅλην τὴν νύκτα — «всю ночь» (LXX; у Синодального «всякий день», слав. «по вся дни» — масоретское чтение). ὠλιγοψύχησεν ἕως εἰς θάνατον — «пал духом до смерти» (ὀλιγοψυχέω — малодушествовать)."
  17: "Ξυρὸν οὐκ ἀναβήσεται — «бритва не взойдёт» (ξυρόν; ср. Числ 6:5, 剃刀). ναζιραῖος θεοῦ ἐγώ εἰμι ἐκ κοιλίας μητρός — «я назорей Божий от чрева матери» (κοιλία — чрево; 母の胎内). ἀποστήσεται ἀπ᾿ ἐμοῦ ἡ ἰσχύς — «отступит от меня сила». κατὰ πάντας τοὺς ἀνθρώπους — «как все люди»."
  18: "Ἀνάβητε τὸ ἅπαξ — «взойдите на этот раз» (τὸ ἅπαξ — «однажды, теперь»). ἀνέβησαν ... πᾶσαι αἱ σατραπίαι — «взошли все сатрапии» (σατραπία — область; слав. «вси князи»). ἤνεγκαν τὸ ἀργύριον ἐν ταῖς χερσὶν αὐτῶν — «принесли серебро в руках своих»."
  19: "ἀνὰ μέσον τῶν γονάτων αὐτῆς — «между колен её». κουρέα — «брадобрея, стригаля» (κουρεύς; 髪を刈る者). ἐξύρησεν — «обрил» (ξυράω). ἤρξατο ταπεινοῦσθαι — «начал смиряться, слабеть»."
  20: "Ἐξελεύσομαι καὶ ποιήσω καθὼς ἀεὶ καὶ ἀποτινάξομαι — «выйду, как всегда, и отрясусь» (ἀποτινάσσω — стряхивать). οὐκ ἔγνω ὅτι κύριος ἀπέστη ἀπ᾿ αὐτοῦ — «не знал, что Господь отступил от него»."
  21: "ἐξώρυξαν τοὺς ὀφθαλμούς — «выкопали, вырвали глаза» (ἐξορύσσω). πέδαις χαλκαῖς — «оковами медными» (πέδη — колодка, путы; χαλκός — медь, 青銅). ἀλήθων — «молол» (ἀλήθω); ἐν οἴκῳ τῆς φυλακῆς — «в доме темницы» (牢)."
  22: "θρὶξ τῆς κεφαλῆς — «волос головы» (θρίξ). ἀνατεῖλαι — «отрасти» (ἀνατέλλω). ἡνίκα ἐξυρήθη — «когда был обрит»."
  23: "συνήχθησαν — «собрались» (συνάγω). θῦσαι θυσίαν μεγάλην Δαγων — «принести великую жертву Дагону» (Δαγών — филистимский бог; сноски нет, потому что в самом стихе сказано 自分たちの神). εὐφρανθῆναι — «возвеселиться» (εὐφραίνω)."
  24: "ᾔνεσαν — «хвалили» (αἰνέω). ἐξερημοῦντα τὴν γῆν — «опустошающего землю» (ἐξερημόω). ἐπλήθυνεν τοὺς τραυματίας — «умножил поражённых, раненых» (τραυματίας; слав. «язвенных»)."
  25: "ἠγαθύνθη ἡ καρδία αὐτῶν — «развеселилось сердце их» (ἀγαθύνω; слав. «возблажа сердце их»). παιξάτω — «пусть играет» (παίζω). ἐνέπαιζον αὐτῷ — «издевались, тешились над ним» (ἐμπαίζω). στύλων — 柱."
  26: "χειραγωγοῦντα — «ведущего за руку» (χειραγωγέω). Ἐπανάπαυσον — «успокой, останови» (ἐπαναπαύω). ψηλαφῆσαι — «ощупать» (ψηλαφάω). ἐπεστήρικται — «утверждён, опирается» (ἐπιστηρίζω). ὁ δὲ παῖς ἐποίησεν οὕτως — «отрок сделал так» (слав. добавляет «сноша же сотвори тако»)."
  27: "πλήρης ἀνδρῶν καὶ γυναικῶν — «полон мужчин и женщин». ἐπὶ τοῦ δώματος — «на кровле» (δῶμα; 屋上). ὡσεὶ τρισχίλιοι — «около трёх тысяч». ἐμπαιζόμενον — «осмеиваемого» (пассив ἐμπαίζω)."
  28: "Молитва стоит в 「…」 как прямая речь первого уровня. Κύριε κύριε — «Господи, Господи» (двойное обращение; слав. «адонаи Господи, Господи сил» — внесено из масоретского). μνήσθητί μου — «вспомни меня» (μιμνήσκομαι). ἐνίσχυσόν με — «укрепи меня» (ἐνισχύω). πλὴν ἔτι τὸ ἅπαξ τοῦτο — «только ещё на этот раз». ἐκδικήσω ἐκδίκησιν μίαν ἀντὶ τῶν δύο ὀφθαλμῶν — «отмщу одно отмщение за два глаза моих» (ἐκδίκησις — 復讐)."
  29: "περιέλαβεν — «обхватил» (περιλαμβάνω). τοὺς δύο στύλους τοὺς μέσους — «два средних столба». ἐπεστηρίσατο — «опёрся» (ἐπιστηρίζω, ср. ст. 26). ἕνα ἐν τῇ δεξιᾷ ... καὶ ἕνα ἐν τῇ ἀριστερᾷ — «один правой, другой левой»."
  30: "Ἀποθανέτω ἡ ψυχή μου μετὰ τῶν ἀλλοφύλων — «да умрёт душа моя с филистимлянами» (ψυχή — 魂). ἔκλινεν ἐν ἰσχύι — «склонился, напрягшись в силе» (κλίνω). ἐπὶ τοὺς σατράπας — «на сатрапов». πλείους ὑπὲρ οὓς ἐθανάτωσεν ἐν τῇ ζωῇ — «больше, чем умертвил в жизни своей» (πλείους с ὑπέρ)."
  31: "κατέβησαν οἱ ἀδελφοὶ αὐτοῦ — «сошли братья его». τάφῳ Μανωε — «гробе Маноя». ἔκρινεν τὸν Ισραηλ εἴκοσι ἔτη — «судил Израиля двадцать лет». Слав. в конце добавляет в скобках стих о Емегаре (ср. 3:31) — в греч. его здесь нет, в текст не внесено."
