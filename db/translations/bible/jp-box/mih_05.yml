# Нумерация — по славяно-синодальной. ГРАНИЦА ГЛАВ 4/5 (карта): в gr-lxx-byz у гл. 4
# 14 стихов, у слав. — 13; стих gr 4:14 («νῦν ἐμφραχθήσεται θυγάτηρ Εφραιμ…»)
# открывает слав. гл. 5 и стоит здесь стихом 1 (в гл. 4 он не дублируется).
# Далее слав. 5:N = gr 5:(N−1): 5:2 = gr 5:1 (Вифлеем), 5:3 = gr 5:2, …, 5:14 = gr 5:13,
# 5:15 = gr 5:14 (отмщение народам; 5:15 в гр. гл. 5 нет — она кончается 14-м стихом).
# Гл. 6–7 снова совпадают с gr. Всего в книге 105 стихов — столько же в gr и в слав.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1 (gr 4:14) дочь Ефрема заграждена, осада, удары жезлом по щеке;
# 2 (gr 5:1) **Вифлеем-Ефрафа**: «из тебя произойдёт Мне Владыка в Израиле»,
# исходы от дней века; 3–4 рождающая родит, остаток братьев вернётся, Он пасёт
# в силе Господней, возвеличится до краёв земли; 5–6 **Он — мир**, Ассирия,
# семь пастырей и восемь князей, меч на Ассура и Неврода; 7–8 остаток Иакова —
# роса от Господа и лев среди народов; 9–15 в тот день: истребление коней,
# колесниц, городов, чар, идолов и рощ, отмщение непокорным народам.
# Голоса: 1–15 — одна цитата 「…» (пророческое слово; в 1 голос «мы» —
# «わたしたちに包囲が敷かれた», в 2–15 слово Господа к дочери Сиона); внутри
# кавычек второго уровня нет.
# ニムロデ — по корпусу (Быт 10:8–10); в LXX здесь Νεβρωδ.
#
