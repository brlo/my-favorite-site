verses:
  1: "「今[いま]、エフライムの娘[むすめ]は垣[かき]で囲[かこ]まれる。わたしたちに包囲[ほうい]が敷[し]かれた。彼らは杖[つえ]でイスラエルの部族[ぶぞく]の頬[ほお]を打[う]つ。"
  2: "ベツレヘム、エフラタの家[いえ]よ。あなたはユダの千[せん]人[にん]のうちで小[ちい]さい者[もの]である。しかし、イスラエルを治[おさ]める者[もの]となるべき者[もの]が、あなたからわたしのために出[で]る。その出[で]た所[ところ]は昔[むかし]から、永遠[えいえん]の日[ひ]々[び]からである。"
  3: "それゆえ、産[さん]婦[ぷ]が産[う]む時[とき]まで、彼らは引[ひ]き渡[わた]される。そして、彼らの兄弟[きょうだい]の残[のこ]りの者[もの]たちが、イスラエルの子[こ]らに帰[かえ]って来[く]る。"
  4: "彼は立[た]って、主[しゅ]の力[ちから]と、その神[かみ]、主[しゅ]の名[な]の栄[えい]光[こう]のうちに、その群[む]れを養[やしな]う。彼らは安[あん]らかに住[す]む。今[いま]、彼は地[ち]の果[は]てにまで大[おお]きくなるからである。"
  5: "彼こそ平和[へいわ]である。アッシリアがわたしたちの地[ち]に来[き]、わたしたちの国[くに]に踏[ふ]み込[こ]むとき、わたしたちは彼に対して七人の牧[ぼく]者[しゃ]と八人の民[たみ]の長[おさ]を起[お]こす。"
  6: "彼らは剣[つるぎ]をもってアッシリアを、その槍[やり]をもってニムロデの地[ち]を養[やしな]う。アッシリアがわたしたちの地[ち]に来[き]、わたしたちの国[くに]に踏[ふ]み込[こ]むとき、彼はわたしたちをアッシリアから救[すく]い出[だ]す。"
  7: "ヤコブの残[のこ]りの者[もの]は、多[おお]くの民[たみ]の間[あいだ]の、多[おお]くの国民[こくみん]のうちで、主[しゅ]から下[くだ]る露[つゆ]、草[くさ]の上[うえ]の小[こ]羊[ひつじ]のようになる。それは、人[ひと]の子[こ]らのうちに、これを集[あつ]め尽[つ]くす者[もの]も、これに立[た]ち向[か]う者[もの]もいないためである。"
  8: "ヤコブの残[のこ]りの者[もの]は、多[おお]くの民[たみ]の間[あいだ]の、多[おお]くの国民[こくみん]のうちで、林[はやし]の獣[けもの]の中[なか]の獅子[しし]、羊[ひつじ]の群[む]れの中[なか]の若[わか]い獅子[しし]のようになる。それは通[とお]り過[す]ぎるときに踏[ふ]みにじり、引[ひ]き裂[さ]いて、救[すく]い出[だ]す者[もの]がない。"
  9: "あなたの手[て]はあなたを苦[くる]しめる者[もの]の上[うえ]に上[あ]がり、あなたの敵[てき]はすべて断[た]たれる。"
  10: "その日[ひ]、と主[しゅ]は言[い]われる、わたしはあなたのうちから馬[うま]を断[た]ち、あなたの戦車[せんしゃ]を滅[ほろ]ぼす。"
  11: "わたしはあなたの地[ち]の町[まち]々[まち]を断[た]ち、あなたのすべてもろもろの要塞[ようさい]を壊[こわ]す。"
  12: "わたしはあなたの手[て]から呪[じゅ]術[じゅつ]を断[た]ち、あなたのうちに占[うらな]い師[し]はいなくなる。"
  13: "わたしはあなたのうちから刻[こく]像[ぞう]と石[いし]の柱[はしら]を断[た]ち、あなたはもはや自分[じぶん]の手[て]の業[わざ]を拝[おが]まない。"
  14: "わたしはあなたのうちから聖[せい]なる森[もり]を切[き]り倒[た]おし、あなたの町[まち]々[まち]を滅[ほろ]ぼす。"
  15: "わたしは怒[いか]りと憤[いきどお]りをもって、聞[き]き従[したが]わなかった国民[こくみん]たちに復讐[ふくしゅう]を行[おこな]う。」"

notes:
  1: "Это gr 4:14; у слав. — 5:1 (граница глав, см. шапку): в gr гл. 4 имеет 14 стихов, у слав. — 13. νῦν ἐμφραχθήσεται θυγάτηρ Εφραιμ ἐν φραγμῷ — «ныне заградится дочь Ефрема в ограде» (ἐμφράσσω — заграждать; φραγμός — ограда, забор; слав. «оградится дщи ефремова ограждением»); συνοχὴν ἔταξεν ἐφ᾽ ἡμᾶς — «стеснение (осаду) назначил на нас» (συνοχή — стеснение, осада; τάσσω — назначать); ἐν ῥάβδῳ πατάξουσιν ἐπὶ σιαγόνα τὰς φυλὰς τοῦ Ισραηλ — «жезлом ударят по щеке племена Израиля» (ῥάβδος — жезл; σιαγών — щека)."
  2: "Это gr 5:1 (слав. 5:2). Καὶ σύ, Βηθλεεμ οἶκος τοῦ Εφραθα — «и ты, Вифлеем, дом Ефрафы» (слав. «вифлееме, доме ефрафов»); ὀλιγοστὸς εἶ τοῦ εἶναι ἐν χιλιάσιν Ιουδα — «мал ты, чтобы быть в тысячах Иуды» (χιλιάς — тысяча, род; слав. «еда мал еси, еже быти в тысящах иудиных»); ἐκ σοῦ μοι ἐξελεύσεται τοῦ εἶναι εἰς ἄρχοντα ἐν τῷ Ισραηλ — «из тебя Мне выйдет (Тот), чтобы быть начальствующим в Израиле» (ἄρχων — начальник, князь; слав. «из тебе бо мне изыдет старейшина, еже быти в князя во израили»); αἱ ἔξοδοι αὐτοῦ ἀπ᾿ ἀρχῆς ἐξ ἡμερῶν αἰῶνος — «исходы его от начала, от дней века» (ἔξοδος — выход, происхождение; слав. «исходи же его из начала от дний века»)."
  3: "Это gr 5:2. διὰ τοῦτο δώσει αὐτοὺς ἕως καιροῦ τικτοῦσης τέξεται — «посему даст их до времени, пока рождающая не родит» (в тексте страдательный оборот 「彼らは引き渡される」 — подлежащее в греческом не названо, добавления нет) (слав. «сего ради даст я, до времене раждающия породит»); οἱ ἐπίλοιποι τῶν ἀδελφῶν αὐτῶν ἐπιστρέψουσιν ἐπὶ τοὺς υἱοὺς Ισραηλ — «остальные братья их обратятся к сынам Израиля»."
  4: "Это gr 5:3. στήσεται καὶ ὄψεται — «станет и увидит» (слав. «станет, и узрит»); ποιμανεῖ τὸ ποίμνιον αὐτοῦ ἐν ἰσχύι κυρίου — «упасёт стадо своё в крепости Господней» (ποιμαίνω — пасти); ἐν τῇ δόξῃ τοῦ ὀνόματος κυρίου τοῦ θεοῦ αὐτῶν — «в славе имени Господа Бога их»; ὑπάρξουσιν — «пребудут» (ὑπάρχω — быть, существовать); μεγαλυνθήσεται ἕως ἄκρων τῆς γῆς — «возвеличится до краёв земли»."
  5: "Это gr 5:4. καὶ ἔσται αὕτη εἰρήνη — «и будет это мир» (слав. «и будет сей мир»), т. е. Он Сам — мир; ὅταν Ἀσσύριος ἐπέλθῃ ἐπὶ τὴν γῆν ὑμῶν — «когда Ассириец придёт на землю вашу»; ἐπεγερθήσονται ἐπ᾽ αὐτὸν ἑπτὰ ποιμένες καὶ ὀκτὼ δήγματα ἀνθρώπων — «восстанут на него семь пастырей и восемь укусов (князей) человеческих» (δῆγμα — укус; слав. «осмь язв человеческих»)."
  6: "Это gr 5:5. ποιμανοῦσιν τὸν Ασσουρ ἐν ῥομφαίᾳ — «упасут Ассура мечом» (ῥομφαία — меч); τὴν γῆν τοῦ Νεβρωδ ἐν τῇ τάφρῳ αὐτῆς — «землю Неврода в рве её» (τάφρος — ров; слав. «землю невродову копиями ея» — «копьями»; по паритету в тексте 槍, вариант LXX здесь); ῥύσεται ἐκ τοῦ Ασσουρ — «избавит от Ассура» (ῥύομαι — избавлять)."
  7: "Это gr 5:6. ἔσται τὸ ὑπόλειμμα τοῦ Ιακωβ ἐν τοῖς ἔθνεσιν — «будет остаток Иакова между народами»; ὡς δρόσος παρὰ κυρίου πίπτουσα — «как роса от Господа падающая» (δρόσος — роса); ὡς ἄρνες ἐπὶ ἄγρωστιν — «как агнцы на злак» (ἄγρωστις — трава, злак); ὅπως μὴ συναχθῇ μηδεὶς μηδὲ ὑποστῇ ἐν υἱοῖς ἀνθρώπων — «чтобы никто не собрал и не устоял между сынами человеческими» — тёмное место LXX (в МТ «который не ждёт человека и не полагается на сынов Адама»); в тексте 「これを集め尽くす者も、これに立ち向かう者もいないためである」, буквальность оговорена здесь."
  8: "Это gr 5:7. ὡς λέων ἐν κτήνεσιν ἐν τῷ δρυμῷ — «как лев между скотами в дубраве» (κτῆνος — скот; δρυμός — дубрава); ὡς σκύμνος ἐν ποιμνίοις προβάτων — «как львёнок в стадах овец» (σκύμνος — львёнок); ὃν τρόπον ὅταν διέλθῃ — «как когда пройдёт»; διαστείλας ἁρπάσῃ — «отделив (разорвав), похитит» (διαστέλλω — разделять, разрывать; ἁρπάζω — хватать); μὴ ᾖ ὁ ἐξαιρούμενος — «не будет избавляющего» (ἐξαιρέω — изымать, спасать)."
  9: "Это gr 5:8. ὑψωθήσεται ἡ χείρ σου ἐπὶ τοὺς θλίβοντάς σε — «возвысится рука твоя на притесняющих тебя» (θλίβω — теснить, угнетать); πάντες οἱ ἐχθροί σου ἐξολεθρευθήσονται — «все враги твои истребятся» (ἐξολεθρεύω — истреблять)."
  10: "Это gr 5:9. ἐξολεθρεύσω τοὺς ἵππους σου ἐκ μέσου σου — «истреблю коней твоих из среды твоей»; ἀπολῶ τὰ ἅρματά σου — «погублю колесницы твои» (ἅρμα — колесница)."
  11: "Это gr 5:10. ἐξολεθρεύσω τὰς πόλεις τῆς γῆς σου — «истреблю города земли твоей»; ἐξαρῶ πάντα τὰ ὀχυρώματά σου — «удалю все укрепления твои» (ἐξαίρω — удалять; ὀχύρωμα — твердыня, крепость)."
  12: "Это gr 5:11. ἐξαρῶ τὰ φάρμακά σου ἐκ τῶν χειρῶν σου — «удалю чары (волшебства) твои из рук твоих» (φάρμακον — снадобье, чары); ἀποφθεγγόμενοι οὐκ ἔσονται ἐν σοί — «прорицающие не будут в тебе» (ἀποφθέγγομαι — вещать, прорицать)."
  13: "Это gr 5:12. ἐξολεθρεύσω τὰ γλυπτὰ σου καὶ τὰς στήλας σου — «истреблю изваяния твои и столпы твои» (γλυπτόν — изваяние; στήλη — столп, стела); οὐκέτι μὴ προσκυνήσῃς τοῖς ἔργοις τῶν χειρῶν σου — «и не будешь более поклоняться делам рук твоих» (προσκυνέω — поклоняться)."
  14: "Это gr 5:13. ἐκκόψω τὰ ἄλση σου — «срублю рощи твои» (ἄλσος — священная роща; слав. «дубравы»); ἀφανιῶ τὰς πόλεις σου — «уничтожу города твои» (ἀφανίζω — истреблять)."
  15: "Это gr 5:14 и соответствует слав. 5:15, поэтому дубля нет (5:15 в гр. гл. 5 отсутствует — гл. 5 кончается 14-м стихом). ποιήσω ἐν ὀργῇ καὶ ἐν θυμῷ ἐκδίκησιν — «сделаю в гневе и ярости отмщение» (ἐκδίκησις — мщение); ἐν τοῖς ἔθνεσιν, ἀνθ᾿ ὧν οὐκ εἰσήκουσαν — «над народами, за то что не послушали»."
