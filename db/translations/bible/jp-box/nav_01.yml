# jp-box, Иисус Навин, глава 1. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в этой главе нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 1: смерть Моисея и повеление Иисусу (1), «будь твёрд и мужествен» (2–9),
# распоряжение о переправе через три дня (10–11), напоминание Рувиму, Гаду и половине
# Манассии (12–15), ответ народа (16–18).
# Речь Бога — 「…」: 2–9 (непрерывно, открывается в ст. 2 и закрывается в ст. 9).
# Речь Иисуса — 「…」: 11, 13–15; слова Моисея внутри неё — 『…』 (11, 13).
# Речь народа — 「…」: 16–18.
# Красного и синего нет.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (проверено по базе).
# Сносок ⟨…⟩ нет: 嗣業 уже пояснено в корпусе, новых терминов глава не вводит.
# jp-ni не использовался.

