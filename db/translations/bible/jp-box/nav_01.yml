verses:
  1: "モーセが死[し]んでから、主[しゅ]はモーセに仕[つか]えていたヌンの子[こ]ヨシュアに語[かた]って言[い]われた。"
  2: "「わたしの僕[しもべ]モーセは死[し]んだ。今[いま]、立[た]ち上[あ]がり、あなたもこの民[たみ]すべても、このヨルダン川[がわ]を渡[わた]って、わたしが彼[かれ]らに与[あた]える地[ち]へ行[い]け。"
  3: "あなたがたが足[あし]の裏[うら]で踏[ふ]む場所[ばしょ]は、どこでもあなたがたに与[あた]える。わたしがモーセに語[かた]ったとおりである。"
  4: "荒野[こうや]とアンティレバノンから、大[おお]きな川[かわ]、すなわちユーフラテス川まで、また日[ひ]の沈[しず]む方[ほう]の果[は]ての海[うみ]までが、あなたがたの境界[きょうかい]となる。"
  5: "あなたがたの前[まえ]に立[た]ち向[む]かう者[もの]は、あなたが生[い]きる日[ひ]のすべてにわたって、ひとりもいない。わたしがモーセとともにいたように、あなたとともにいる。あなたを見捨[みす]てることも、見放[みはな]すこともない。"
  6: "強[つよ]くあれ、雄々[おお]しくあれ。この民[たみ]に、わたしがあなたがたの父祖[ふそ]たちに与[あた]えると誓[ちか]った地[ち]を、あなたが分[わ]け与えるからである。"
  7: "だから、強[つよ]くあれ、雄々[おお]しくあれ。わたしの僕[しもべ]モーセがあなたに命[めい]じたとおりに守[まも]り行[おこな]うためである。あなたはそれらから右[みぎ]にも左[ひだり]にも曲[ま]がってはならない。あなたが行うすべてのことにおいて、悟[さと]るためである。"
  8: "この律法[りっぽう]の書[しょ]があなたの口[くち]から離[はな]れてはならない。昼[ひる]も夜[よる]も、その中[なか]で思[おも]い巡[めぐ]らしなさい。書[か]かれているすべてを行[おこな]うために、悟[さと]るためである。そのとき、あなたは栄[さか]え、あなたの道[みち]も栄える。そのとき、あなたは悟る。"
  9: "見[み]よ、わたしはあなたに命[めい]じた。強[つよ]くあれ、雄々[おお]しくあれ。怯[ひる]んではならない、恐[おそ]れてはならない。あなたがどこへ行[ゆ]くにも、あなたの神[かみ]である主[しゅ]が、すべてにおいてあなたとともにいるからである。」"
  10: "ヨシュアは民[たみ]の書記[しょき]たちに命[めい]じて言[い]った。"
  11: "「民[たみ]の陣営[じんえい]の真[ま]ん中[なか]を通[とお]り、民に命[めい]じて言[い]いなさい。『旅[たび]のための食[た]べ物[もの]を用[よう]意[い]しなさい。あと三日[みっか]で、あなたがたはこのヨルダン川[がわ]を渡[わた]り、あなたがたの父祖[ふそ]たちの神[かみ]である主[しゅ]があなたがたに与[あた]える地[ち]に入[はい]って、それを手[て]に入[い]れるからである。』」"
  12: "ヨシュアはルベンとガドと、マナセの部族[ぶぞく]の半分[はんぶん]とに言[い]った。"
  13: "「主[しゅ]の言葉[ことば]を思[おも]い起[お]こしなさい。主の僕[しもべ]モーセが、あなたがたに命[めい]じて言[い]った。『あなたがたの神[かみ]である主は、あなたがたを安[やす]んじさせ、あなたがたにこの地[ち]を与[あた]えられた。』"
  14: "あなたがたの妻[つま]と子[こ]どもと家畜[かちく]は、あなたがたに与[あた]えられた地[ち]に住[す]まわせなさい。あなたがたのうち力[ちから]ある者[もの]はみな、武具[ぶぐ]を身[み]につけ、兄弟[きょうだい]たちに先立[さきだ]って渡[わた]り、彼[かれ]らとともに戦[たたか]いなさい。"
  15: "それは、主[しゅ]なるあなたがたの神[かみ]が、あなたがたを安[やす]んじさせたように、あなたがたの兄弟[きょうだい]たちをも安んじさせ、彼[かれ]らも、主なるわたしたちの神が彼らに与[あた]える地[ち]を嗣業[しぎょう]として受[う]け継[つ]ぐまでのことである。そして、あなたがたはそれぞれ、モーセが日[ひ]の昇[のぼ]る方[ほう]、ヨルダン川[がわ]の向[む]こうであなたがたに与えた自分[じぶん]の嗣業へ帰[かえ]りなさい。」"
  16: "彼[かれ]らはヨシュアに答[こた]えて言[い]った。「あなたがわたしたちに命[めい]じることはすべて行[おこな]い、あなたがわたしたちを遣[つか]わす場所[ばしょ]にはどこへでも行[ゆ]きます。"
  17: "わたしたちは、モーセに聞[き]き従[したが]ったすべてのことにおいて、あなたにも聞き従います。ただ、わたしたちの神[かみ]である主[しゅ]が、モーセとともにいたように、あなたとともにいてくださいますように。"
  18: "あなたに逆[さから]い、あなたが彼[かれ]に命[めい]じるあなたの言葉[ことば]を聞[き]かない者[もの]は、死[し]ななければならない。ただ、強[つよ]くあれ、雄々[おお]しくあれ。」"

notes:
  1: "ἐγένετο μετὰ τὴν τελευτήν — «было после кончины» (τελευτή — кончина; слав. «по скончании»). ὁ θεράπων — служитель, приближённый (слав. «раб»); в ст. 2 то же слово, а с ст. 6 — ὁ παῖς «раб». τῷ ὑπουργῷ Μωυσῆ — «служителю Моисееву» (ὑπουργός — помощник, слуга). λέγων — «говоря»: вводит речь ст. 2 и отдельно по-японски не передаётся."
  2: "Μωϋσῆς ὁ θεράπων μου — «Моисей, служитель Мой». νῦν οὖν ἀναστὰς διάβηθι — «итак, встав, перейди». εἰς τὴν γῆν, ἣν ἐγὼ δίδωμι αὐτοῖς — «в землю, которую Я даю им»: в LXX «им» (αὐτοῖς), у Синодального добавлено «сынам Израилевым»."
  3: "ἐφ᾿ ὃν ἂν ἐπιβῆτε τῷ ἴχνει τῶν ποδῶν — «на который наступите следом ног ваших» (ἴχνος — след; слав. «стопою ног»). ὑμῖν δώσω αὐτόν — «вам дам его»: местоимение повторено, как в LXX и слав. ὃν τρόπον εἴρηκα — «как Я сказал»."
  4: "τὴν ἔρημον καὶ τὸν Ἀντιλίβανον — «пустыню и Антиливан»: в LXX нет добавки «всю землю Хеттеев», которая есть в слав. и у Синодального (масоретский текст). ποταμοῦ τοῦ μεγάλου, ποταμοῦ Εὐφράτου — «реки великой, реки Евфрата». τῆς θαλάσσης τῆς ἐσχάτης ἀφ᾿ ἡλίου δυσμῶν — «моря последнего от захода солнца», т. е. Средиземного."
  5: "οὐκ ἀντιστήσεται ἄνθρωπος κατενώπιον ὑμῶν — «не восстанет человек против вас» (ἀνθίστημι). πάσας τὰς ἡμέρας τῆς ζωῆς σου — «во все дни жизни твоей»: после ὑμῶν (вас) LXX переходит на единственное число. οὐκ ἐγκαταλείψω σε οὐδὲ ὑπερόψομαί σε — «не оставлю тебя и не презрю тебя» (ὑπεροράω; слав. «ниже презрю тя»)."
  6: "ἴσχυε καὶ ἀνδρίζου — «крепись и мужайся» (ἀνδρίζομαι — держаться мужественно); формула повторяется в 7, 9 и 18. ἀποδιαστελεῖς — «разделишь, распределишь» (ἀποδιαστέλλω; слав. «разделиши»). ὤμοσα τοῖς πατράσιν ὑμῶν — «поклялся отцам вашим»: снова переход с ед. на мн. число."
  7: "ἴσχυε οὖν — «итак крепись»: οὖν связывает с обетованием ст. 6. φυλάσσεσθαι καὶ ποιεῖν — «хранить и исполнять» (слав. «хранити и творити»); в LXX нет слова «закон», которое есть у Синодального. οὐκ ἐκκλινεῖς ἀπ᾿ αὐτῶν — «не уклонишься от них» (ἐκκλίνω). ἵνα συνῇς — «чтобы ты был разумен» (συνίημι)."
  8: "ἡ βίβλος τοῦ νόμου τούτου — «книга закона сего». μελετήσεις ἐν αὐτῷ — «будешь поучаться в ней» (μελετάω — размышлять, повторять). εὐοδωθήσῃ καὶ εὐοδώσεις τὰς ὁδούς σου — «будешь успешен и сделаешь пути твои успешными» (εὐοδόω; слав. «благоуспееши и исправиши пути твоя»). В конце LXX повторяет τότε συνήσεις — «тогда уразумеешь»."
  9: "ἰδοὺ ἐντέταλμαί σοι — «вот, Я повелел тебе» (perfect от ἐντέλλομαι). μὴ δειλιάσῃς μηδὲ φοβηθῇς — «не робей и не бойся» (δειλιάω — трусить; слав. «ни ужасайся, ниже убойся»). εἰς πάντα, οὗ ἐὰν πορεύῃ — «во всём, куда бы ты ни пошёл» (слав. «во всех, аможе аще пойдеши»). Здесь речь Бога кончается."
  10: "ἐνετείλατο — «заповедал, приказал». γραμματεῦσιν τοῦ λαοῦ — «книжникам народа» (γραμματεύς; слав. «книгочиям людским», у Синодального «надзирателям»); в LXX это должностные лица при стане, ср. 3:2."
  11: "κατὰ μέσον τῆς παρεμβολῆς — «по средине стана» (παρεμβολή — стан). ἐπισιτισμόν — «съестные припасы» (слав. «брашно»): запас на дорогу. ἔτι τρεῖς ἡμέραι — «ещё три дня» (слав. «яко еще три дни»). κατασχεῖν — «овладеть, взять» (κατέχω); слав. добавляет «в причастие», в греч. этого нет."
  12: "τῷ Ρουβην καὶ τῷ Γαδ — дательный при εἶπεν: «Рувиму и Гаду» (имена племён в ед. ч., как в LXX). τῷ ἡμίσει φυλῆς Μανασση — «половине племени Манассии»."
  13: "Μνήσθητε τὸ ῥῆμα κυρίου — «вспомните слово Господне» (μιμνῄσκομαι). κατέπαυσεν ὑμᾶς — «успокоил вас» (καταπαύω — дать покой; слав. «упокои»). Слова Моисея внутри речи Иисуса — 『…』."
  14: "κατοικείτωσαν — повелительное 3-го л. мн. ч.: «пусть живут». εὔζωνοι — «препоясанные, в полном вооружении» (εὔζωνος; слав. «вооружени»). πρότεροι τῶν ἀδελφῶν ὑμῶν — «прежде братьев ваших». πᾶς ὁ ἰσχύων — «всякий, кто в силах». συμμαχήσετε — «будете сражаться вместе» (συμμαχέω)."
  15: "ἕως ἂν καταπαύσῃ — «доколе не успокоит»: стих продолжает предложение ст. 14, поэтому по-японски оформлен как «…までのことである». В LXX здесь смена лица: κύριος ὁ θεὸς ὑμῶν (ваш Бог) в начале и κύριος ὁ θεὸς ἡμῶν (наш Бог) в середине — смена сохранена (слав. в конце «Господь Бог ваш»). κληρονομήσωσιν — «наследуют»; κληρονομία — 嗣業. εἰς τὸ πέραν τοῦ Ιορδάνου ἀπ᾿ ἀνατολῶν ἡλίου — «за Иорданом к востоку солнца»."
  16: "ἀποκριθέντες — «ответив» (обычная формула; слав. «отвещавше»). ὅσα ἂν ἐντείλῃ — «что бы ни повелел». εἰς πάντα τόπον, οὗ ἐὰν ἀποστείλῃς — «во всякое место, куда пошлёшь»."
  17: "καθὰ ἠκούσαμεν Μωυσῆ — «как слушали Моисея» (ἀκούω с род. — слушаться). πλὴν ἔστω — «только да будет» (πλήν — впрочем, только; слав. «токмо»). ὃν τρόπον ἦν μετὰ Μωυσῆ — «как был с Моисеем»."
  18: "ἀπειθήσῃ — «ослушается» (ἀπειθέω). μὴ ἀκούσῃ τῶν ῥημάτων σου — «не послушает слов твоих». ἀποθανέτω — «да умрёт» (повеление; слав. «да умрет»). ἀλλὰ ἴσχυε καὶ ἀνδρίζου — «но крепись и мужайся»: слав. «точию крепися и мужайся», у Синодального «только будь тверд». Здесь речь народа кончается."
