# Содержание: 1–8 очищение храма, новый жертвенник и огонь, восьмидневное
# торжество, установление праздника; 9 конец истории Антиоха Епифана;
# 10–13 Евпатор и Лисий, Птолемей Макрон; 14–23 Горгий и идумеи, взятие
# крепостей, предательство людей Симона и казнь их; 24–31 Тимофей, молитва,
# явление пяти всадников, победа; 32–38 Газара, гибель Тимофея.
# Голоса: прямой речи нет, всё повествование.
