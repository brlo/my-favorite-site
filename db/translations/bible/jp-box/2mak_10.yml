verses:
  1: "マッカバイオスとその仲間[なかま]たちは、主[しゅ]が彼らを導[みちび]いておられたので、神殿[しんでん]と都[みやこ]を取り戻[とりもど]した。"
  2: "そして、異民族[いみんぞく]が広場[ひろば]に造[つく]った祭壇[さいだん]や聖所[せいしょ]を取[と]り壊[こわ]した。"
  3: "神殿[しんでん]を清[きよ]めてから別[べつ]の祭壇[さいだん]を造[つく]り、石[いし]を焼[や]いてその石から火[ひ]を取[と]り、二年[にねん]ぶりに犠牲[ぎせい]を捧[ささ]げ、香[こう]とともし火[び]と供[そな]えのパンを整[ととの]えた。"
  4: "これを行[おこな]ったうえで、彼らはひれ伏[ふ]して主[しゅ]に願[ねが]った。もはやこのような災[わざわ]いに陥[おちい]ることなく、たとえ罪[つみ]を犯[おか]すことがあっても、異邦人[いほうじん]の侮辱[ぶじょく]に引[ひ]き渡[わた]されず、寛[かん]大[だい]に罰[ばつ]してくださるようにと。"
  5: "異民族[いみんぞく]によって神殿[しんでん]が汚[けが]されたその日[ひ]に、同じ日[ひ]に神殿[しんでん]の清[きよ]めが行[おこな]われた。それはその月[つき]の二十五日[にじゅういつか]、すなわちハスレウの月[つき]であった。"
  6: "彼らは喜[よろこ]びのうちに八日間[ようかかん]を、仮庵[かりいお]の祭[まつ]りのように過[す]ごした。つい先[さき]まで、彼らは山[やま]や洞窟[どうくつ]で獣[けもの]のように暮[く]らしながら仮庵[かりいお]の祭[まつ]りを過[す]ごしていたことを思[おも]い起[おこ]しつつ。"
  7: "それで彼らは、蔦[つた]を巻[ま]いた杖[つえ]や美[うつく]しい枝[えだ]、それに椰子[やし]の枝[えだ]を持[も]ち、自分[じぶん]の場所[ばしょ]を清[きよ]めさせてくださった方[かた]に賛美[さんび]の歌[うた]をささげた。"
  8: "そして、公[おおやけ]の命令[めいれい]と決議[けつぎ]によって、ユダヤ人[じん]の民[たみ]全体[ぜんたい]が毎年[まいとし]この日[ひ]々を祝[いわ]うことを定[さだ]めた。"
  9: "アンティオコス・エピファネスの最期[さいご]は、このようであった。"
  10: "さて、ここからは、不敬[ふけい]な者[もの]の子[こ]であるアンティオコス・エウパトルのもとで起[お]こったことを、戦[いくさ]の主[おも]な災[わざわ]いを省[はぶ]きながら記[しる]そう。"
  11: "彼[かれ]は王位[おうい]を受[う]け継[つ]ぐと、政務[せいむ]をあるリュシアスに任[まか]せ、ケレ・シリアとフェニキアの将軍[しょうぐん]の第一人者[だいいちにんしゃ]とした。"
  12: "というのは、マクロンと呼[よ]ばれるプトレマイオスは、ユダヤ人[じん]に対して正[ただ]しいことを守[まも]ろうとして、彼らに対する不正[ふせい]のゆえに、物事[ものごと]を穏[おだ]やかに進[すす]めようと努[つと]めていた。"
  13: "そのため彼[かれ]は、友[とも]たちによってエウパトルの前[まえ]で訴[うった]えられ、いたるところで裏切[うらぎ]り者[もの]と呼[よ]ばれた。それは、フィロメトルから任[まか]されたキプロスを捨[す]てて、アンティオコス・エピファネスのもとへ去[さ]ったからである。彼[かれ]はもはや名誉[めいよ]ある地位[ちい]も保[たも]てず、毒[どく]を飲[の]んで命[いのち]を絶[た]った。"
  14: "ゴルギアスはその地方[ちほう]の将軍[しょうぐん]となると、外国[がいこく]の兵[へい]を雇[やと]い、いたるところでユダヤ人[じん]に対して戦[いくさ]を仕掛[しか]けた。"
  15: "彼[かれ]とともに、よい機会[きかい]の砦[とりで]を手[て]にしていたイドメア人[じん]たちも、ユダヤ人[じん]を苦[くる]しめ、エルサレムから逃[に]げ出[だ]した者[もの]たちを引[ひ]き受[う]けて戦[いくさ]を起[お]こそうとした。"
  16: "そこでマッカバイオスとその仲間[なかま]たちは祈[いの]りをささげ、神[かみ]が自分[じぶん]たちの味方[みかた]となってくださるようにと願[ねが]ってから、イドメア人[じん]の砦[とりで]に攻[せ]めかかった。"
  17: "彼らは力強[ちからづよ]く突[つ]きかかって、その場所[ばしょ]を手[て]に入[い]れ、城壁[じょうへき]で戦[たたか]う者[もの]をことごとく追[お]い払[はら]い、行[い]き会[あ]う者[もの]を切[き]り捨[す]てて、二万[にまん]人[にん]を下[くだ]らない者[もの]を殺[ころ]した。"
  18: "九千人[きゅうせんにん]を下[くだ]らない者[もの]たちが、二[ふた]つの、たいそう堅固[けんご]で、包囲[ほうい]に必要[ひつよう]なものをすべて備[そな]えたやぐらに逃[に]げ込[こ]むと、"
  19: "マッカバイオスはシモンとヨセフ、さらにザクカイオスとその仲間[なかま]を、彼らを包囲[ほうい]するのに足[た]りるだけの人数[にんずう]とともに残[のこ]し、自分[じぶん]は急[いそ]ぎの用[よう]のある場所[ばしょ]へ向[む]かった。"
  20: "ところが、シモンとその仲間[なかま]たちは金銭[きんせん]に目[め]がくらみ、やぐらの中[なか]のある者[もの]たちに銀[ぎん]で買収[ばいしゅう]されて、七万[しちまん]ドラクメを受[う]け取[と]り、いくらかを逃[に]がしてしまった。"
  21: "このことがマッカバイオスに伝[つた]えられると、彼[かれ]は民[たみ]の指導者[しどうしゃ]たちを集[あつ]めて、銀[ぎん]のために兄弟[きょうだい]を売[う]り、敵[てき]を彼らに放[はな]ったと責[せ]めた。"
  22: "そして、裏切[うらぎ]り者[もの]となったこの者[もの]たちを殺[ころ]し、ただちに二[ふた]つのやぐらを攻[せ]め取[と]った。"
  23: "武具[ぶぐ]を手[て]にしてすべてに成功[せいこう]し、二[ふた]つの要塞[ようさい]で二万[にまん]人[にん]を超[こ]える者[もの]を滅[ほろ]ぼした。"
  24: "さて、かつてユダヤ人[じん]に敗[やぶ]れたティモテオスは、おびただしい外国[がいこく]の軍[ぐん]とアジアの騎兵[きへい]を多[おお]く集[あつ]め、ユダヤを力[ちから]ずくで取[と]ろうとしてやって来[き]た。"
  25: "彼[かれ]が近[ちか]づくと、マッカバイオスとその仲間[なかま]たちは神[かみ]に祈[いの]り、頭[あたま]に土[つち]をかけて、粗布[あらぬの]を腰[こし]にまとって、"
  26: "祭壇[さいだん]の前[まえ]の階段[かいだん]にひれ伏[ふ]し、自分[じぶん]たちに憐[あわ]れみを示[しめ]して、律法[りっぽう]が告[つ]げているとおりに彼らの敵[てき]と敵[てき]となり、敵対[てきたい]する者[もの]と敵対[てきたい]してくださるようにと願[ねが]った。"
  27: "祈[いの]りを終[お]えると、彼らは武器[ぶき]を取[と]って都[みやこ]から遠[とお]く出[で]て行[い]った。そして敵[てき]に近[ちか]づくと、そこに身[み]を構[かま]えた。"
  28: "日[ひ]が昇[のぼ]り始[はじ]めたころ、両軍[りょうぐん]は戦[たたか]いを始[はじ]めた。一方[いっぽう]には、勇気[ゆうき]とともに主[しゅ]への逃[に]げ込[こ]み所[じょ]があり、それが成功[せいこう]と勝利[しょうり]の保証[ほしょう]であった。他方[たほう]は、戦[いくさ]の先[さき]頭[がしら]として怒[いか]りを置[お]いていた。"
  29: "激[はげ]しい戦[たたか]いのなか、敵[てき]の前[まえ]に、天[てん]から金[きん]の手綱[たづな]をつけた五人の立派[りっぱ]な騎手[きしゅ]が現[あら]われ、ユダヤ人[じん]たちを先導[せんどう]した。"
  30: "彼らはマッカバイオスを中[なか]に置[お]いて自分[じぶん]たちの武具[ぶぐ]で覆[おお]い、妨[さまた]げられないように守[まも]った。そして敵[てき]に向[む]かって矢[や]と雷[かみなり]を放[はな]ったので、敵[てき]は目[め]が見[み]えなくて混[こん]乱[らん]し、すっかり恐[おそ]れに包[つつ]まれて切[き]り倒[たお]された。"
  31: "二万五百[にまんごひゃく]の者[もの]が殺[ころ]され、騎兵[きへい]は六百[ろっぴゃく]であった。"
  32: "ティモテオス自身[じしん]は、ガザラと呼[よ]ばれる要塞[ようさい]に逃[に]げた。それはたいそう堅固[けんご]な砦[とりで]で、そこではハイレオスが指揮[しき]していた。"
  33: "マッカバイオスとその仲間[なかま]たちは喜[よろこ]んでこの砦[とりで]を四日間[よっかかん]包囲[ほうい]した。"
  34: "しかし、中[なか]にいる者[もの]たちはその場所[ばしょ]の堅固[けんご]さに頼[たよ]って、ひどく冒瀆[ぼうとく]の言葉[ことば]を吐[は]き、許[ゆる]されないことを口[くち]にした。"
  35: "五日目[いつかめ]の明[あ]け方[がた]、マッカバイオスとともにいた二十人[にじゅうにん]の若者[わかもの]たちが、この冒瀆[ぼうとく]のゆえに怒[いか]りに燃[も]え、勇敢[ゆうかん]に、そして獣[けもの]のような激[はげ]しさで城壁[じょうへき]に取[と]りつき、行[い]き会[あ]う者[もの]を切[き]り捨[す]てた。"
  36: "ほかの者[もの]たちも同[おな]じように上[のぼ]って、混戦[こんせん]のなかで中[なか]の者[もの]たちに火[ひ]を放[はな]ち、やぐらを焼[や]き、かがり火[び]をたいて冒瀆[ぼうとく]する者[もの]を生[い]きながら焼[や]き、また門[もん]を打[う]ち壊[こわ]して、残[のこ]りの部隊[ぶたい]を引[ひ]き入[い]れ、都[みやこ]を手[て]に入[い]れた。"
  37: "そして、ある穴[あな]の中[なか]に隠[かく]れていたティモテオスと、その兄弟[きょうだい]ハイレオスとアポロファネスを殺[ころ]した。"
  38: "これを行[おこな]ったうえで、彼らは賛美[さんび]と告白[こくはく]の歌[うた]をもって、イスラエルを大[おお]いに恵[めぐ]み、勝利[しょうり]を与[あた]えてくださった主[しゅ]をほめたたえた。"

notes:
  1: "τοῦ κυρίου προάγοντος αὐτούς — «Господу ведущу (предводительствующу) их»; τὸ ἱερὸν ἐκομίσαντο καὶ τὴν πόλιν — «храм и город вернули (получили обратно)» (κομίζω)."
  2: "τοὺς κατὰ τὴν ἀγορὰν βωμούς — «жертвенники на площади» (ἀγορά — 広場[ひろば]); τεμένη καθεῖλαν — «святилища низвергли» (τέμενος, καθαιρέω)."
  3: "πυρώσαντες λίθους — «раскалив камни»; πῦρ ἐκ τούτων λαβόντες — «взяв из них огонь»; θυμίαμα καὶ λύχνους — «фимиам и светильники»; τῶν ἄρτων τὴν πρόθεσιν — «предложение хлебов». Слав. добавляет «по двою лету и шести месяцех»; в gr только μετὰ διετῆ χρόνον («через два года») — держим gr, добавка отмечена."
  4: "πεσόντες ἐπὶ κοιλίαν — «пав на живот (ниц)»; μηκέτι περιπεσεῖν τοιούτοις κακοῖς — «не впасть более в такие беды»; μετὰ ἐπιεικείας παιδεύεσθαι — «наказываться со снисхождением»; μὴ… παραδίδοσθαι — «не предаваться»."
  5: "ἐν ᾗ… ἡμέρᾳ ὁ νεὼς… ἐβεβηλώθη — «в день, в который храм осквернён был»; τῇ πέμπτῃ καὶ εἰκάδι τοῦ αὐτοῦ μηνός — «в двадцать пятый день того же месяца»."
  6: "μετ᾽ εὐφροσύνης ἦγον ἡμέρας ὀκτώ — «с веселием проводили восемь дней»; σκηνωμάτων τρόπον — «подобно кущам (празднику кущей)»; θηρίων τρόπον ἦσαν νεμόμενοι — «по-звериному жили (паслись)» (νέμομαι)."
  7: "θύρσους — «тирсы (жезлы, обвитые плющом)» (θύρσος); κλάδους ὡραίους — «прекрасные ветви»; φοίνικας — «пальмы»; τῷ εὐοδώσαντι — «даровавшему успех» (εὐοδόω)."
  8: "ἐδογμάτισαν μετὰ κοινοῦ προστάγματος καὶ ψηφίσματος — «постановили общим повелением и решением»; κατ᾽ ἐνιαυτὸν ἄγειν τάσδε τὰς ἡμέρας — «каждый год праздновать эти дни»."
  9: "τῆς… Ἐπιφανοῦς τελευτῆς — «кончины Епифана»; οὕτως εἶχεν — «так имела» — заключительная формула. Здесь кончается история Антиоха."
  10: "τὰ κατὰ τὸν Εὐπάτορα Ἀντίοχον — «дела при Антиохе Евпаторе» (エウパトル); υἱὸν… τοῦ ἀσεβοῦς — «сына нечестивого»; συντέμνοντες τὰ συνέχοντα τῶν πολέμων κακά — «сокращая главные (непрерывные) бедствия войн» (συνέχω — держать вместе, главный)."
  11: "ἀνέδειξεν ἐπὶ τῶν πραγμάτων Λυσίαν τινά — «поставил над делами некоего Лисия»; Κοίλης δὲ Συρίας καὶ Φοινίκης στρατηγὸν πρώταρχον — «первого военачальника Келе-Сирии и Финикии» (πρώταρχος)."
  12: "Πτολεμαῖος… ὁ καλούμενος Μάκρων — «Птолемей, называемый Макроном» (マクロン); τὸ δίκαιον συντηρεῖν προηγούμενος — «предпочитая соблюдать правду» (προηγέομαι); διὰ τὴν γεγονυῖαν εἰς αὐτοὺς ἀδικίαν — «из-за бывшей к ним несправедливости»; εἰρηνικῶς διεξάγειν — «мирно вести (дела)»."
  13: "κατηγορούμενος ὑπὸ τῶν φίλων — «обвиняемый друзьями»; προδότης παρ᾽ ἕκαστα ἀκούων — «повсюду слыша имя предателя»; τὴν Κύπρον ἐμπιστευθέντα ὑπὸ τοῦ Φιλομήτορος ἐκλιπεῖν — «оставить вверенный Филометором Кипр» (ἐκλείπω); μήτε εὐγενῆ τὴν ἐξουσίαν εὐγενίσας — «не сохранив благородства власти»; φαρμακεύσας ἑαυτὸν ἐξέλιπεν τὸν βίον — «отравив себя, окончил жизнь»."
  14: "γενόμενος στρατηγὸς τῶν τόπων — «став военачальником тех мест»; ἐξενοτρόφει — «содержал наёмников» (ξενοτροφέω); ἐπολεμοτρόφει — «войну питал (поддерживал)»."
  15: "οἱ Ιδουμαῖοι — «идумеи» (イドメア人[じん]); ἐγκρατεῖς ἐπικαίρων ὀχυρωμάτων — «владеющие удобными крепостями»; ἐγύμναζον — «упражняли (тревожили)»; τοὺς φυγαδεύσαντας… προσλαβόμενοι — «принимая изгнанных»."
  16: "ποιησάμενοι λιτανείαν — «совершив моление»; σύμμαχον αὐτοῖς γενέσθαι — «быть их союзником»; ὥρμησαν — «устремились»."
  17: "προσβαλόντες εὐρώστως — «напав крепко (сильно)» (εὐρώστως); ἠμύναντο — «отразили» (ἀμύνω); κατέσφαζόν… τοὺς ἐμπίπτοντας — «закалывали попадавшихся»; οὐχ ἧττον τῶν δισμυρίων — «не менее двадцати тысяч»."
  18: "συμφυγόντων… εἰς δύο πύργους ὀχυρούς — «когда сбежались в две крепкие башни»; πάντα τὰ πρὸς πολιορκίαν ἔχοντας — «имеющие всё для осады» (πολιορκία, 包囲[ほうい])."
  19: "εἰς ἐπείγοντας τόπους — «в спешные (неотложные) места»; ἀπολιπὼν Σιμωνα καὶ Ιωσηπον, ἔτι δὲ καὶ Ζακχαῖον — «оставив Симона, Иосифа и Закхея» (ザクカイオス); ἱκανοὺς πρὸς τὴν τούτων πολιορκίαν — «достаточных для осады их»."
  20: "φιλαργυρήσαντες — «сребролюбствовав» (φιλαργυρέω); ἐπείσθησαν ἀργυρίῳ — «были убеждены серебром (подкуплены)»; ἑπτάκις δὲ μυρίας δραχμάς — «семьдесят тысяч драхм» (ἑπτάκις μύριαι); εἴασάν τινας διαρρυῆναι — «позволили некоторым ускользнуть» (διαρρέω)."
  21: "προσαγγελέντος… περὶ τοῦ γεγονότος — «когда донесено было о происшедшем»; τοὺς ἡγουμένους τοῦ λαοῦ — «начальников народа»; ὡς ἀργυρίου πέπρακαν τοὺς ἀδελφούς — «что за серебро продали братьев»; τοὺς πολεμίους κατ᾽ αὐτῶν ἀπολύσαντες — «отпустив врагов на них»."
  22: "προδότας γενομένους ἀπέκτεινεν — «ставших предателями убил»; παραχρῆμα τοὺς δύο πύργους κατελάβετο — «тотчас две башни взял»."
  23: "τοῖς ὅπλοις… εὐοδούμενος — «в оружии успевая»; ἀπώλεσεν ἐν τοῖς δυσὶν ὀχυρώμασιν — «погубил в двух крепостях»."
  24: "ὁ πρότερον ἡττηθεὶς ὑπὸ τῶν Ιουδαίων — «прежде побеждённый иудеями»; ξένας δυνάμεις παμπληθεῖς — «весьма многочисленные чужие силы» (παμπληθής); τοὺς τῆς Ἀσίας… ἵππους — «конницу Азии»; δοριάλωτον λημψόμενος τὴν Ιουδαίαν — «чтобы взять Иудею копьём» (δοριάλωτος)."
  25: "συνεγγίζοντος αὐτοῦ — «когда он приближался»; πρὸς ἱκετείαν τοῦ θεοῦ — «к молению Богу»; γῇ τὰς κεφαλὰς καταπάσαντες — «посыпав головы землёй»; τὰς ὀσφύας σάκκοις ζώσαντες — «опоясав чресла вретищами»."
  26: "ἐπὶ τὴν ἀπέναντι τοῦ θυσιαστηρίου κρηπῖδα — «к подножию (основанию) жертвенника напротив» (κρηπίς, 階段[かいだん]); ἐχθρεῦσαι τοῖς ἐχθροῖς — «враждовать с врагами»; ἀντικεῖσθαι τοῖς ἀντικειμένοις — «противиться противящимся»; καθὼς ὁ νόμος διασαφεῖ — «как закон изъясняет»."
  27: "ἀναλαβόντες τὰ ὅπλα προῆγον ἀπὸ τῆς πόλεως ἐπὶ πλεῖον — «взяв оружие, выступили из города дальше»; ἐφ᾽ ἑαυτῶν ἦσαν — «были на своих (остановились)»."
  28: "ἄρτι… τῆς ἀνατολῆς διαχεομ ένης — «едва занялась заря» (ἀνατολή); ἔγγυον ἔχοντες εὐημερίας καὶ νίκης — «имея залог успеха и победы» (ἔγγυος); τὴν ἐπὶ τὸν κύριον καταφυγήν — «прибежище к Господу»; καθηγεμόνα τῶν ἀγώνων… τὸν θυμόν — «вождём браней… ярость»."
  29: "καρτερᾶς μάχης — «упорной битвы»; ἐφ᾽ ἵππων χρυσοχαλίνων — «на конях с золотыми уздами» (χρυσοχάλινος); ἄνδρες πέντε διαπρεπεῖς — «пять видных мужей»."
  30: "μέσον λαβόντες — «взяв в середину»; σκεπάζοντες ταῖς ἑαυτῶν πανοπλίαις — «покрывая своими всеоружиями»; ἄτρωτον διεφύλαττον — «невредимым сохраняли»; τοξεύματα καὶ κεραυνούς — «стрелы и молнии»; ἀορασίᾳ διεκόπτοντο — «от ослепления поражаемы были» (ἀορασία)."
  31: "δισμύριοι πρὸς τοῖς πεντακοσίοις — «двадцать тысяч пятьсот»; ἱππεῖς ἑξακόσιοι — «всадников шестьсот». Слав. «пятсот сот» — порча; по gr."
  32: "Γαζαρα λεγόμενον ὀχύρωμα — «крепость, называемая Газара» (ガザラ); φρούριον — «сторожевая крепость»; στρατηγοῦντος ἐκεῖ Χαιρεου — «когда там начальствовал Херей» (ハイレオス)."
  33: "ἄσμενοι περιεκάθισαν — «радостно обложили» (περι καθίζω); ἡμέρας τέσσαρας — «четыре дня»."
  34: "τῇ ἐρυμνότητι τοῦ τόπου πεποιθότες — «понадеявшись на неприступность места» (ἐρυμνότης); ὑπεράγαν ἐβλασφήμουν — «чрезмерно хулили»; λόγους ἀθεμίτους — «слова беззаконные»."
  35: "ὑποφαινούσης τῆς πέμπτης ἡμέρας — «когда занимался пятый день»; πυρωθέντες τοῖς θυμοῖς — «воспламенившись яростью»; ἀρρενωδῶς — «мужественно» (ἀρρενωδῶς); θηριώδει θυμῷ — «звериной яростью»; τὸν ἐμπίπτοντα ἔκοπτον — «попадавшегося рубили»."
  36: "ἐν τῷ περισπασμῷ — «в смятении (отвлечении)» (περισπασμός); ἐνεπίμπρων τοὺς πύργους — «зажигали башни»; πυρὰς ἀνάπτοντες — «разжигая костры» (πυρά); τοὺς βλασφήμους κατέκαιον — «хулителей сжигали»; τὴν λοιπὴν τάξιν — «остальной отряд» (τάξις)."
  37: "ἀποκεκρυμμένον ἔν τινι λάκκῳ — «скрывавшегося в некоем рву (цистерне)»; Χαιρέαν — «Херея»; Ἀπολλοφάνην — «Аполлофана» (アポロファネス)."
  38: "μεθ᾽ ὕμνων καὶ ἐξομολογήσεων — «с гимнами и исповеданиями»; τῷ μεγάλως εὐεργετοῦντι τὸν Ισραηλ — «велико благодетельствующему Израилю»; τὸ νῖκος αὐτοῖς διδόντι — «дающему им победу»."
