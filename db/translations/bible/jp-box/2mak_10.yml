# ハイレオス, アポロファネス, ガザラ — новое; ユダ, シモン, ヨセフ,
# エレアザル, イスラエル, エルサレム, イドメア人.
# Термины: 神殿[しんでん], 祭壇[さいだん], 犠牲[ぎせい], 燔祭[はんさい] (нет),
# 仮庵[かりいお]の祭り, 奉献[ほうけん], 再奉献[さいほうけん], 安息日[あんそくび].

