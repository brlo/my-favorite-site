# jp-box, Левит, глава 20. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в Левите отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 20: наказания за нарушение святости — Молох (2–5), вызывающие мёртвых (6),
# призыв к святости (7–8), злословие родителей (9), прелюбодеяние (10),
# кровосмешение и скотоложство (11–21), заключение: отделённость от народов
# (22–26), вызывающие мёртвых (27).
# Речь Бога — 「…」 (2–27), по абзацам-законам; красного и синего нет.
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено по базе). В 20:2–5 греческий
# вместо имени Молоха ставит ἄρχων/ἄρχοντες («князь») — это эвфемизм евр. מֹלֶךְ;
# передан референт (モロク), как в 18:21 и Деян 7:43; сносок нет.
# 霊媒, 呪術師 взяты из 19:31 без новой сноски.
# jp-ni не использовался.

