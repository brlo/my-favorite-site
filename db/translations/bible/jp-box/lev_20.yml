verses:
  1: "主[しゅ]はモーセに語[かた]って言[い]われた。"
  2: "「イスラエルの子[こ]らに言[い]いなさい。イスラエルの子らのうちの者[もの]であれ、イスラエルの中[なか]に加[くわ]わった寄留者[きりゅうしゃ]であれ、その子[こ]どものうちの者をモロクに与[あた]える者は、必[かなら]ず死[し]に処[しょ]せられなければならない。その地[ち]の民[たみ]は彼[かれ]を石[いし]で打[う]ち殺[ころ]さなければならない。"
  3: "わたしはその者[もの]にわたしの顔[かお]を向[む]け、その者を民[たみ]のうちから滅[ほろ]ぼす。その者が自分[じぶん]の子[こ]どもをモロクに与[あた]え、わたしの聖[せい]なるものを汚[けが]し、わたしに聖別[せいべつ]された者[もの]の名[な]を汚したからである。"
  4: "もしその地[ち]の土着[どちゃく]の者[もの]たちが、その者が自分[じぶん]の子[こ]どもをモロクに与[あた]えるのに目[め]を閉[と]ざして彼[かれ]を殺[ころ]さないなら、"
  5: "わたしはその者[もの]とその一族[いちぞく]にわたしの顔[かお]を向[む]け、その者と、それにならってモロクのうしろに淫行[いんこう]して歩[あゆ]む者[もの]を、その民[たみ]のうちから滅[ほろ]ぼす。」"
  6: "「霊媒[れいばい]や呪術師[じゅじゅつし]に従[したが]って、そのうしろに淫行[いんこう]する者[もの]には、わたしは顔[かお]を向[む]け、その者をその民[たみ]のうちから滅[ほろ]ぼす。」"
  7: "「あなたがたは聖[せい]なる者[もの]となりなさい。わたしは聖なる者、あなたがたの神[かみ]、主[しゅ]だからである。"
  8: "あなたがたはわたしの定[さだ]めを守[まも]り、それを行[おこな]わなければならない。わたしはあなたがたを聖別[せいべつ]する主[しゅ]である。」"
  9: "「だれでも、父[ちち]または母[はは]をののしる者[もの]は、必[かなら]ず死[し]に処[しょ]せられなければならない。その者は父または母をののしったのだから、罪[つみ]に問[と]われる。」"
  10: "「人[ひと]の妻[つま]と姦淫[かんいん]する者[もの]、隣人[りんじん]の妻と姦淫する者も、姦淫する男[おとこ]も姦淫される女[おんな]も、必[かなら]ず死[し]に処[しょ]せられなければならない。」"
  11: "「父[ちち]の妻[つま]と寝[ね]る者[もの]は、父の恥[は]ずかしいところをさらしたのである。二人[ふたり]とも必[かなら]ず死[し]に処[しょ]せられなければならない。彼[かれ]らは罪[つみ]に問[と]われる。"
  12: "嫁[よめ]と寝[ね]る者[もの]は、二人[ふたり]とも必[かなら]ず死[し]に処[しょ]せられなければならない。彼[かれ]らは不敬[ふけい]を行[おこな]ったからである。彼らは罪[つみ]に問[と]われる。」"
  13: "「女[おんな]と寝[ね]るように男[おとこ]と寝[ね]る者[もの]は、二人[ふたり]とも忌[いま]むべきことを行[おこな]った。彼[かれ]らは死[し]に処[しょ]せられなければならない。彼らは罪[つみ]に問[と]われる。"
  14: "女[おんな]を、その母[はは]とともに妻[つま]として迎[むか]える者[もの]は、不法[ふほう]を犯[おか]すのである。彼[かれ]も彼女[かのじょ]たちも火[ひ]で焼[や]かなければならない。そうすれば、あなたがたの間[あいだ]に不法はなくなる。」"
  15: "「獣[けもの]と交[まじ]わる者[もの]は、必[かなら]ず死[し]に処[しょ]せられなければならない。その獣も殺[ころ]さなければならない。"
  16: "女[おんな]が、どの家畜[かちく]であれ、それに身[み]を任[まか]せて交[まじ]わるなら、その女とその家畜を殺[ころ]さなければならない。彼[かれ]らは必[かなら]ず死[し]に処[しょ]せられなければならない。彼らは罪[つみ]に問[と]われる。」"
  17: "「父[ちち]の娘[むすめ]であれ母[はは]の娘であれ、自分[じぶん]の姉妹[しまい]を妻[つま]として迎[むか]え、その恥[は]ずかしいところを見[み]、相手[あいて]もまた自分の恥ずかしいところを見るなら、それは恥辱[ちじょく]である。彼[かれ]らは自分[じぶん]の一族[いちぞく]の子[こ]らの中[なか]で断[た]たれる。その者[もの]は姉妹の恥ずかしいところをさらしたのであり、その罪[つみ]を負[お]うのである。"
  18: "月経[げっけい]の間[あいだ]にある女[おんな]と寝[ね]て、その恥[は]ずかしいところをさらす男[おとこ]は、その女の源[みなもと]をさらしたのであり、女もまた自分[じぶん]の血[ち]の流[なが]れをさらしたのである。二人[ふたり]とも自分の一族[いちぞく]から断[た]たれる。」"
  19: "「父[ちち]の姉妹[しまい]、母[はは]の姉妹の恥[は]ずかしいところをさらしてはならない。その者[もの]は自分[じぶん]の近[ちか]しい血族[けつぞく]の恥ずかしいところをさらしたのであり、その罪[つみ]を負[お]うのである。"
  20: "自分[じぶん]の近親[きんしん]の女[おんな]と寝[ね]る者[もの]は、自分の親族[しんぞく]の恥[は]ずかしいところをさらしたのである。彼[かれ]らは子[こ]を残[のこ]さずに死[し]ぬ。」"
  21: "「兄弟[きょうだい]の妻[つま]を迎[むか]える者[もの]は、汚[けが]れを行[おこな]うのである。その者[もの]は兄弟の恥[は]ずかしいところをさらしたのであり、彼[かれ]らは子[こ]を残[のこ]さずに死[し]ぬ。」"
  22: "「あなたがたはわたしの定[さだ]めとわたしの裁[さば]きをすべて守[まも]り、それを行[おこな]わなければならない。そうすれば、わたしがあなたがたを住[す]まわせるために導[みちび]き入[い]れる土地[とち]が、あなたがたを忌[い]み嫌[きら]うことはない。"
  23: "あなたがたは、わたしがあなたがたの前[まえ]から追[お]い払[はら]う諸国民[しょこくみん]の定[さだ]めに従[したが]って歩[ある]んではならない。彼[かれ]らはこれらのことをすべて行[おこな]ったので、わたしは彼らを忌[い]み嫌[きら]った。」"
  24: "「わたしはあなたがたに言[い]った。『あなたがたは彼[かれ]らの土地[とち]を受[う]け継[つ]ぎなさい。わたしはそれをあなたがたの所有[しょゆう]として与[あた]える。乳[ちち]と蜜[みつ]の流[なが]れる土地である。』わたしはあなたがたの神[かみ]、主[しゅ]であり、あなたがたをすべての国民[こくみん]から分[わ]け離[はな]した者[もの]である。"
  25: "あなたがたは、清[きよ]い家畜[かちく]と汚[けが]れた家畜、清い鳥[とり]と汚れた鳥を分[わ]けなければならない。あなたがたは、わたしがあなたがたのために不浄[ふじょう]なものとして分けた家畜、鳥、および地[ち]を這[は]うすべてのものによって、自分[じぶん]の魂[たましい]を忌[いま]むべきものとしてはならない。"
  26: "あなたがたはわたしにとって聖[せい]なる者[もの]となりなさい。わたしは聖なる者、あなたがたの神[かみ]、主[しゅ]であり、あなたがたをすべての国民[こくみん]から分[わ]け離[はな]して、わたしのものとしたからである。」"
  27: "「男[おとこ]であれ女[おんな]であれ、霊媒[れいばい]や呪術師[じゅじゅつし]となる者[もの]は、二人[ふたり]とも必[かなら]ず死[し]に処[しょ]せられなければならない。石[いし]で打[う]ち殺[ころ]さなければならない。彼[かれ]らは罪[つみ]に問[と]われる者[もの]である。」"

notes:
  1: "Καὶ ἐλάλησεν κύριος πρὸς Μωυσῆν λέγων — формула введения; слав. «И рече Господь к моисею, глаголя»."
  2: "ἄρχοντι — «князю»: LXX в 20:2–5 вместо имени Молоха ставит ἄρχων (буквальный перевод евр. מֹלֶךְ «царь»); церковное чтение (слав. «молоху») и Синодальный дают имя. モロク передаёт референт; сноска — при первом месте в корпусе (18:21), 〔…〕 не ставим. θανάτῳ θανατούσθω — смертью да умрёт (усиление, евр. оборот). τὸ ἔθνος τὸ ἐπὶ τῆς γῆς — народ земли, т. е. местные жители. λιθοβολήσουσιν ἐν λίθοις — побьют камнями (λιθοβολέω)."
  3: "ἐπιστήσω τὸ πρόσωπόν μου ἐπί — обращу лицо Моё на (знак суда; слав. «утвержу лице мое»). ἀπολῶ — истреблю (ἀπόλλυμι). ἵνα μιάνῃ τὰ ἅγιά μου — чтобы осквернить святыни Мои (μιαίνω). τὸ ὄνομα τῶν ἡγιασμένων μοι — имя освящённых Мне: у LXX не «имя Моё», как в Синодальном (по масоретскому), а «имя посвящённых Мне»."
  4: "ὑπερόψει ὑπερίδωσιν — презрением презрят (усиление; ὑπεροράω «пренебрегать»). τοῖς ὀφθαλμοῖς αὐτῶν ἀπὸ τοῦ ἀνθρώπου — очами своими от человека, т. е. закроют глаза. τοῦ μὴ ἀποκτεῖναι — чтобы не убить."
  5: "τὴν συγγένειαν αὐτοῦ — родство его (συγγένεια). τοὺς ὁμονοοῦντας αὐτῷ — единомыслящих с ним (ὁμονοέω). εἰς τοὺς ἄρχοντας — «к князьям» (мн.), т. е. вслед Молоха; слав. «со идолы», Синодальный «вслед Молоха»."
  6: "ψυχή, ἣ ἐὰν ἐπακολουθήσῃ — душа, которая последует (ψυχή = человек, потому 者). ἐκπορνεῦσαι ὀπίσω αὐτῶν — блудодействовать вслед их. ἐκ τοῦ λαοῦ αὐτῆς — из народа её (ж. р., как в греческом)."
  7: "ἔσεσθε ἅγιοι — будете святы (буд. вр. в значении повеления; слав. «будете святи»)."
  8: "φυλάξεσθε τὰ προστάγματά μου — сохраните повеления Мои (πρόσταγμα; 定め). ὁ ἁγιάζων ὑμᾶς — освящающий вас (聖別する)."
  9: "ἄνθρωπος ἄνθρωπος — человек человек, т. е. всякий человек (евр. распределительное удвоение; в переводе — だれでも). κακῶς εἴπῃ — скажет худо, злословит (κακῶς λέγω). ἔνοχος ἔσται — повинен будет (ἔνοχος; слав. «повинен будет»), передано как 罪に問われる."
  10: "ὃς ἂν μοιχεύσηται γυναῖκα ἀνδρός — кто прелюбодействует с женою мужа; далее почти то же: γυναῖκα τοῦ πλησίον — жену ближнего (два оборота сохранены). θανάτῳ θανατούσθωσαν — смертью да умрут."
  11: "μετὰ γυναικὸς τοῦ πατρός — с женою отца (т. е. мачехой). ἀσχημοσύνην τοῦ πατρὸς ἀπεκάλυψεν — открыл наготу отца (ἀσχημοσύνη; 恥ずかしいところ — как в Исх 20:26). ἔνοχοί εἰσιν — повинны суть."
  12: "νύμφη — невестка, жена сына (νύμφη; 嫁). ἠσεβήκασιν — нечествовали (ἀσεβέω; слав. «нечествоваша»); Синодальный «мерзость сделали» — по масоретскому."
  13: "μετὰ ἄρσενος κοίτην γυναικός — с мужчиной ложе женщины, т. е. как с женщиной (оборот сохранён, ср. 18:22). βδέλυγμα — мерзость (忌むべきこと). ἔνοχοί εἰσιν — повинны."
  14: "λάβῃ γυναῖκα καὶ τὴν μητέρα αὐτῆς — возьмёт жену и мать её. ἀνόμημά ἐστιν — беззаконие есть (ἀνόμημα). ἐν πυρὶ κατακαύσουσιν — огнём сожгут. οὐκ ἔσται ἀνομία ἐν ὑμῖν — не будет беззакония в вас."
  15: "δῷ κοιτασίαν αὐτοῦ ἐν τετράποδι — даст ложе своё четвероногому (κοιτασία «соитие»; τετράπους). ἀποκτενεῖτε — убейте."
  16: "προσελεύσεται πρὸς πᾶν κτῆνος — подойдёт ко всякому скоту. βιβασθῆναι αὐτὴν ὑπ᾽ αὐτοῦ — быть покрытой им (βιβάζω, pass.; слав. «еже быти с ним»)."
  17: "ἐκ πατρὸς ἢ ἐκ μητρός — от отца или от матери, т. е. единокровная или единоутробная. ὄνειδός ἐστιν — позор есть (ὄνειδος). ἐξολεθρευθήσονται ἐνώπιον υἱῶν γένους αὐτῶν — истребятся пред сынами рода их. ἁμαρτίαν κομιοῦνται — грех понесут (κομίζω)."
  18: "ἀποκαθημένη — «сидящая отдельно», т. е. в менструации (слав. «женою сквернавою»; Синодальный «во время болезни кровоочищения»). πηγὴ αὐτῆς — источник её (πηγή). ῥύσις τοῦ αἵματος — течение крови (ῥύσις). ἐκ τοῦ γένους αὐτῶν — из рода их."
  19: "ἀδελφῆς πατρός / ἀδελφῆς μητρός — сестры отца / сестры матери (тётки). οἰκειότης — близость, родство (слав. «ужичество»). ἁμαρτίαν ἀποίσονται — грех понесут (ἀποφέρω)."
  20: "συγγενοῦς — родственницы (συγγενής); Синодальный «с тёткою» — по масоретскому. ἄτεκνοι ἀποθανοῦνται — бездетными умрут (ἄτεκνος)."
  21: "τὴν γυναῖκα τοῦ ἀδελφοῦ — жену брата. ἀκαθαρσία — нечистота: здесь иной термин, чем ἀνόμημα (14) и βδέλυγμα (13); различие сохранено (汚れ / 不法 / 忌むべきこと)."
  22: "προσοχθίσῃ — возгнушается, разгневается (προσοχθίζω; слав. «не вознегодует на вас земля»). εἰσάγω ὑμᾶς ἐκεῖ κατοικεῖν — ввожу вас туда жить (плеоназм ἐκεῖ сохранён)."
  23: "νομίμοις τῶν ἐθνῶν — уставам народов (νόμιμον). ἐξαποστέλλω ἀφ᾽ ὑμῶν — изгоняю от вас (ἐξαποστέλλω). ἐβδελυξάμην — возгнушался (βδελύσσομαι)."
  24: "κληρονομήσατε — наследуйте (κληρονομέω). ἐν κτήσει — во владение (κτῆσις). γῆν ῥέουσαν γάλα καὶ μέλι — землю, текущую молоком и мёдом. διώρισα — отделил (διορίζω; слав. «отлучивый»)."
  25: "ἀφοριεῖτε — отделите (ἀφορίζω). οὐ βδελύξετε τὰς ψυχὰς ὑμῶν — не сделаете души ваши мерзкими (βδελύσσομαι в значении «делать мерзким»; слав. «не оскверните душ ваших»). ἑρπετά — пресмыкающиеся."
  26: "ἔσεσθέ μοι ἅγιοι — будете Мне святы. ὁ ἀφορίσας ὑμᾶς … εἶναι ἐμοί — отделивший вас, чтобы быть Моими."
  27: "ἀνὴρ ἢ γυνή — мужчина или женщина. ἐγγαστρίμυθος ἢ ἐπαοιδός — вызывающий мёртвых или волхв. λίθοις λιθοβολήσατε — камнями побейте (усиление)."
