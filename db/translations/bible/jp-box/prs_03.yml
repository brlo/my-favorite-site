# jp-box, Премудрость Соломона, глава 3. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для главы есть частично (1–9), архаизмы не копировались;
# jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 3: души праведных в руке Божией (1), их смерть в глазах неразумных (2–3),
# надежда бессмертия и испытание как золото (4–6), явление их во время посещения
# (7–8), уразумение истины и награда избранным (9); с 10 — участь нечестивых:
# наказание по их помыслам (10), суетность их надежд (11–12), блаженство неплодной
# и евнуха (13–14), плод добрых трудов (15), гибель детей прелюбодеев (16–19).
# Прямой речи нет, вложенной речи нет; всё — авторский текст.
# Красного и синего нет.
# Нумерация по gr: 19 стихов, как у csl-ru и ru, сдвигов нет.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz. Слав. добавление в 3:9
# («и посещение во избранных его») внесено в основной текст без скобок, как положено
# по паритету; в notes отмечено «нет в LXX».
# Сносок ⟨…⟩ нет: 訪れ, 不死, 犠牲, 宦官, 神殿 и пр. уже в корпусе.
# Имён в главе нет; ᾅδης не встречается, ἀθανασία — 不死, ἀφθαρσία в главе нет.

tr_code: jp-box
book: prs
chapter: 3
draft: true

verses:
  1: "正[ただ]しい者[もの]たちの魂[たましい]は神[かみ]の手[て]のうちにあり、責[せめ]め苦[くる]しみが彼らに触[ふ]れることはない。"
  2: "彼らは愚[おろ]かな者[もの]たちの目[め]には死[し]んだように映[うつ]り、その旅立[たびだ]ちは災[わざわ]いと見[み]なされた。"
  3: "わたしたちから離[はな]れて行[ゆ]くことは破滅[はめつ]と見[み]られた。しかし彼らは平和[へいわ]のうちにある。"
  4: "たとえ人[ひと]の目[め]の前[まえ]で罰[ばっ]せられても、彼らの望[のぞ]みは不死[ふし]に満[み]ちているからである。"
  5: "少[すこ]し教[おし]えを受[う]けたのち、大[おお]きな恵[めぐ]みを受[う]ける。神[かみ]が彼らを試[ため]し、ご自身[じしん]にふさわしい者[もの]として見[み]出[いだ]されたからである。"
  6: "神[かみ]は彼らを炉[ろ]のうちの金[きん]のように試[ため]し、犠牲[ぎせい]の全[ぜん]き果[か]実[じつ]の捧[ささ]げ物[もの]のように彼らを受[う]け入[い]れられた。"
  7: "彼らへの訪[おとず]れの時[とき]に、彼らは輝[かがや]き出[だ]し、藁[わら]の間[あいだ]の火花[ひばな]のように走[はし]り抜[ぬ]ける。"
  8: "彼らは諸国民[しょこくみん]を裁[さば]き、もろもろの民[たみ]を治[おさ]める。主[しゅ]が彼らの上[うえ]に世々[よよ]とこしえに王[おう]として君臨[くんりん]される。"
  9: "主[しゅ]に寄[よ]り頼[たの]む者[もの]は真理[しんり]を悟[さと]る。愛[あい]のうちに忠実[ちゅうじつ]な者[もの]たちは主のもとに留[とど]まる。恵[めぐ]みとあわれみは主の選[えら]ばれた者[もの]たちにあり、訪[おとず]れはその選ばれた者たちのうちにあるからである。"
  10: "しかし不敬虔[ふけいけん]な者[もの]たちは、考[かんが]えたとおりの罰[ばつ]を受[う]ける。彼らは正[ただ]しい者[もの]を軽[かろ]んじ、主[しゅ]から離[はな]れ去[さ]った者[もの]たちである。"
  11: "知恵[ちえ]と教[きょう]えを侮[あなど]る者[もの]は不幸[ふこう]である。彼らの望[のぞ]みは空[むな]しく、労苦[ろうく]は実[み]を結[むす]ばず、そのわざは無益[むえき]である。"
  12: "彼らの妻[つま]たちは愚[おろ]かで、その子[こ]どもたちは悪[あく]であり、その生[う]まれは呪[のろ]われている。"
  13: "汚[けが]れのない不妊[ふにん]の女[おんな]は幸[さいわ]いである。彼女[かのじょ]は罪[つみ]のうちに床[とこ]を知[し]らなかった。魂[たましい]への訪[おとず]れのとき、彼女は実[み]を得[え]る。"
  14: "手[て]に不法[ふほう]を行[おこな]わず、主[しゅ]に逆[さか]らって悪[あく]を思[おも]い描[えが]かなかった宦官[かんがん]も幸[さいわ]いである。彼には信仰[しんこう]の選[えら]ばれた恵[めぐ]みが与[あた]えられ、主の神殿[しんでん]のうちで最も願[ねが]わしい受[う]け持[も]ちが与えられるからである。"
  15: "良[よ]い労苦[ろうく]の実[み]は誉[ほま]れがあり、悟[さと]りの根[ね]は朽[く]ちることがない。"
  16: "姦淫[かんいん]する者[もの]たちの子[こ]どもは成[な]り立[た]たず、不法[ふほう]な床[とこ]から出[で]た種[たね]は消[き]え去[さ]る。"
  17: "たとえ長生[ながい]きしても、彼らは無[む]と見[み]なされ、末[すえ]にはその老後[ろうご]が辱[はずかし]めとなる。"
  18: "たとえ速[はや]く死[し]んでも、望[のぞ]みを持[も]たず、裁[さば]きの日[ひ]にも慰[なぐさ]めを得[え]ない。"
  19: "不義[ふぎ]の一族[いちぞく]の終[お]わりは恐[おそ]るべきものである。"

notes:
  1: "Δικαίων δὲ ψυχαὶ ἐν χειρὶ θεοῦ — 正しい者たちの魂は神の手のうちにあり: ψυχή — 魂; «в руке Божией» — образ попечения (ср. Иов 12:10); δέ противопоставляет ст. 1 предыдущей главе, поэтому は. οὐ μὴ ἅψηται αὐτῶν βάσανος — 責め苦しみが彼らに触れることはない: οὐ μή с аор. конъюнктивом — усиленное отрицание; ἅπτομαι с род. — «касаться»; βάσανος — «мучение, пытка» (слав. «мука»)."
  2: "ἔδοξαν ἐν ὀφθαλμοῖς ἀφρόνων τεθνάναι — 愚かな者たちの目には死んだように映った: δοκέω — «казаться»; ἀφρών — «неразумный, безумный»; τεθνάναι — перфект от θνῄσκω, «быть мёртвым». ἐλογίσθη κάκωσις ἡ ἔξοδος αὐτῶν — その旅立ちは災いと見なされた: λογίζομαι — «быть вменяемым»; κάκωσις — «бедствие, мучение» (слав. «озлобление»); ἔξοδος — «исход, уход» (ср. 2 Пет 1:15)."
  3: "ἡ ἀφ᾽ ἡμῶν πορεία σύντριμμα — わたしたちから離れて行くことは破滅: πορεία — «уход, путешествие»; σύντριμμα — «сокрушение, разрушение» (слав. «сокрушение»). οἱ δέ εἰσιν ἐν εἰρήνῃ — しかし彼らは平和のうちにある: резкая антитеза, сохранена しかし; εἰρήνη — 平和."
  4: "καὶ γὰρ ἐν ὄψει ἀνθρώπων ἐὰν κολασθῶσιν — たとえ人の目の前で罰せられても: κολάζω — «наказывать, карать»; ὄψις — «вид, лицо»; ἐάν с конъюнктивом — «если и». ἡ ἐλπὶς αὐτῶν ἀθανασίας πλήρης — 彼らの望みは不死に満ちている: ἀθανασία — 不死 (ср. 1 Кор 15:53); πλήρης с род. — «полный чего» (слав. «упование их безсмертия исполнено»)."
  5: "ὀλίγα παιδευθέντες — 少し教えを受けたのち: παιδεύω — «наставлять, воспитывать» (слав. «наказани бывше»); ὀλίγα — наречие «мало». μεγάλα εὐεργετηθήσονται — 大きな恵みを受ける: εὐεργετέω — «благодетельствовать» (пассив); наречия ὀλίγα/μεγάλα образуют антитезу, сохранённую. ὁ θεὸς ἐπείρασεν αὐτοὺς καὶ εὗρεν ἀξίους ἑαυτοῦ — 神が彼らを試し、ご自身にふさわしい者として見出された: πειράζω — «испытывать»; ἄξιος — «достойный»."
  6: "ὡς χρυσὸν ἐν χωνευτηρίῳ ἐδοκίμασεν αὐτούς — 炉のうちの金のように試した: χωνευτήριον — «плавильня, горнило» (слав. «горнило»); δοκιμάζω — «испытывать, проверять». ὡς ὁλοκάρπωμα θυσίας προσεδέξατο αὐτούς — 犠牲の全き果実の捧げ物のように受け入れられた: ὁλοκάρπωμα — «всеплодие, цельная плодовая жертва», не ὁλοκαύτωμα «всесожжение»; θυσία — 犠牲; слав. «яко всеплодие жертвенное»."
  7: "ἐν καιρῷ ἐπισκοπῆς αὐτῶν — 彼らへの訪れの時に: ἐπισκοπή — «посещение» (ср. 2:20; 3:13), здесь время воздаяния и попечения. ἀναλάμψουσιν — 輝き出す: ἀναλάμπω — «воссиять». ὡς σπινθῆρες ἐν καλάμῃ διαδραμοῦνται — 藁の間の火花のように走り抜ける: σπινθήρ — «искра» (ср. 2:2); καλάμη — «солома, стебель» (слав. «по стеблию»); διατρέχω — «пробегать»."
  8: "κρινοῦσιν ἔθνη καὶ κρατήσουσιν λαῶν — 諸国民を裁き、もろもろの民を治める: κρατέω с род. — «владеть, господствовать»; ср. Дан 7:22; Мф 19:28. βασιλεύσει αὐτῶν κύριος εἰς τοὺς αἰῶνας — 主が彼らの上に世々とこしえに王として君臨される: βασιλεύω с род. — «царствовать над»; εἰς τοὺς αἰῶνας — «в векы»."
  9: "οἱ πεποιθότες ἐπ᾽ αὐτῷ — 主に寄り頼む者: πείθω в перфекте — «полагаться, доверять». συνήσουσιν ἀλήθειαν — 真理を悟る: συνίημι — «уразумевать»; ἀλήθεια — 真理. οἱ πιστοὶ ἐν ἀγάπῃ προσμενοῦσιν αὐτῷ — 愛のうちに忠実な者たちは主のもとに留まる: πιστός — «верный»; προσμένω — «пребывать при» (слав. «пребудут ему»). χάρις καὶ ἔλεος τοῖς ἐκλεκτοῖς αὐτοῦ — 恵みとあわれみは主の選ばれた者たちに: ἐκλεκτός — 選ばれた者. Слав. добавляет «и посещение во избранных его» (訪れはその選ばれた者たちのうちにある) — этого нет в gr-lxx-byz; по паритету внесено без 〔…〕, отмечено «нет в LXX»; те же слова стоят в слав. 4:15, где они есть и в LXX 4:15 (χάρις καὶ ἔλεος … καὶ ἐπισκοπή)."
  10: "Οἱ δὲ ἀσεβεῖς — しかし不敬虔な者たちは: с 10 — участь нечестивых. καθὰ ἐλογίσαντο ἕξουσιν ἐπιτιμίαν — 考えたとおりの罰を受ける: καθά — «как, сообразно»; ἐπιτιμία — «наказание, взыскание» (слав. «запрещение»). οἱ ἀμελήσαντες τοῦ δικαίου καὶ τοῦ κυρίου ἀποστάντες — 正しい者を軽んじ、主から離れ去った者たち: ἀμελέω с род. — «пренебрегать»; ἀφίστημι — «отступать»; τοῦ δικαίου — «праведника» (слав. «о праведнем»)."
  11: "σοφίαν καὶ παιδείαν ὁ ἐξουθενῶν — 知恵と教えを侮る者: ἐξουθενέω — «презирать, ни во что ставить» (слав. «уничижаяй»); παιδεία — «наставление» (ср. 1:5). ταλαίπωρος — 不幸 «жалкий, бедствующий». κενὴ ἡ ἐλπὶς αὐτῶν — 望みは空しく: κενός — «пустой». οἱ κόποι ἀνόνητοι — 労苦は実を結ばず: ἀνόνητος — «бесполезный, не приносящий пользы»; ἄχρηστος — «негодный» (слав. «неключима»)."
  12: "αἱ γυναῖκες αὐτῶν ἄφρονες — 彼らの妻たちは愚か: ἄφρων — «неразумный» (ср. 3:2). πονηρὰ τὰ τέκνα αὐτῶν — その子どもたちは悪. ἐπικατάρατος ἡ γένεσις αὐτῶν — その生まれは呪われている: ἐπικατάρατος — «проклятый» (усиленное от κατάρατος); γένεσις — «род, рождение» (слав. «рождение»)."
  13: "μακαρία στεῖρα ἡ ἀμίαντος — 汚れのない不妊の女は幸い: μακάριος — 幸い; στεῖρα — «бесплодная»; ἀμίαντος — «неосквернённая». ἥτις οὐκ ἔγνω κοίτην ἐν παραπτώματι — 罪のうちに床を知らなかった: γινώσκω — «познавать» в смысле супружеского общения (ср. Быт 4:1); κοίτη — «ложе» (слав. «ложа»); παράπτωμα — «преступление, падение». ἕξει καρπὸν ἐν ἐπισκοπῇ ψυχῶν — 魂への訪れのとき、彼女は実を得る: ἐπισκοπή — ср. 3:7."
  14: "εὐνοῦχος ὁ μὴ ἐργασάμενος ἐν χειρὶ ἀνόμημα — 手に不法を行わなかった宦官: ἐργάζομαι — «делать, совершать»; ἀνόμημα — «беззаконие»; εὐνοῦχος — 宦官 (ср. Ис 56:3–5). μηδὲ ἐνθυμηθεὶς κατὰ τοῦ κυρίου πονηρά — 主に逆らって悪を思い描かなかった: ἐνθυμέομαι — «замышлять». δοθήσεται αὐτῷ τῆς πίστεως χάρις ἐκλεκτή — 彼には信仰の選ばれた恵みが与えられる: χάρις — 恵み; ἐκλεκτός здесь «избранная, особая». κλῆρος ἐν ναῷ κυρίου θυμηρέστερος — 主の神殿のうちで最も願わしい受ける持ち: κλῆρος — «жребий, удел»; ναός — 神殿; θυμηρής — «вожделенный, приятный» (слав. «угоднейший»)."
  15: "ἀγαθῶν πόνων καρπὸς εὐκλεής — 良い労苦の実は誉れがあり: πόνος — «труд, усилие»; εὐκλεής — «славный, достохвальный» (слав. «благославен»). ἀδιάπτωτος ἡ ῥίζα τῆς φρονήσεως — 悟りの根は朽ちることがない: ἀδιάπτωτος — «непреткновенный, негибнущий» (слав. «не отпадающь»); φρόνησις — 悟り «благоразумие, разумение», отлично от σοφία 知恵; ῥίζα — 根."
  16: "τέκνα μοιχῶν ἀτέλεστα ἔσται — 姦淫する者たちの子どもは成り立たない: μοιχός — «прелюбодей»; ἀτελής — «незавершённый, несовершенный» (слав. «несовершена»). ἐκ παρανόμου κοίτης σπέρμα ἀφανισθήσεται — 不法な床から出た種は消え去る: παράνομος — «беззаконный»; σπέρμα — «семя, потомство»; ἀφανίζω — «истреблять, делать невидимым» (слав. «изчезнет»)."
  17: "ἐάν τε γὰρ μακρόβιοι γένωνται — たとえ長生きしても: μακρόβιος — «долговечный» (слав. «долгоживотни»). εἰς οὐθὲν λογισθήσονται — 無と見なされる: λογίζομαι — «быть вменяемым»; εἰς οὐθέν — «в ничто». ἄτιμον ἐπ᾽ ἐσχάτων τὸ γῆρας αὐτῶν — 末にはその老後が辱めとなる: ἄτιμος — «бесчестный»; ἐπ᾽ ἐσχάτων — «в конце, напоследок» (слав. «на последок»); γῆρας — «старость»."
  18: "ἐάν τε ὀξέως τελευτήσωσιν — たとえ速く死んでも: ὀξέως — «быстро, скоро»; τελευτάω — «умирать, оканчивать». οὐχ ἕξουσιν ἐλπίδα — 望みを持たない. οὐδὲ ἐν ἡμέρᾳ διαγνώσεως παραμύθιον — 裁きの日にも慰めを得ない: διάγνωσις — «разбирательство, судебное решение» (слав. «день суда»); παραμύθιον — «утешение» (слав. «утешение»)."
  19: "γενεᾶς ἀδίκου χαλεπὰ τὰ τέλη — 不義の一族の終わりは恐るべきものである: γενεά — «род, поколение»; χαλεπός — «тяжкий, лютый» (слав. «лютая»); τέλη — мн. ч., «концы, исходы». Именное предложение без глагола; в японском である."
