# jp-box, Исаия, глава 29. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для Исаии есть фрагментами (гл. 25–29), использован только для
# сверки; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 29: 1–4 горе Ариэлю (Иерусалиму) и его унижение; 5–8 внезапное посещение и
# сон врагов; 9–12 ослепление и запечатанная книга; 13–14 лицемерие народа (цит.
# Мф 15:8–9) и погибель мудрости; 15–16 тайные замыслы и глина горшечника;
# 17–21 перемена и суд; 22–24 обетование дому Иакова.
# Голоса: 1–12 без кавычек (возглас и обличение; реплики при чтении книги — 「…»);
# 13–14 слова Господа после «И сказал Господь» — 「…」; 15–16 слова замышляющих и
# глины — 「…」; 22–24 слова Господа после формулы «так говорит Господь» — 「…».
# Нумерация по gr: 24 стиха (совпадает с csl/ru). Границы стихов 5/6 иные:
# «от Господа Саваофа» по gr открывает 29:6, у csl стоит в конце 29:5 — держимся gr.
# 〔…〕 нет: все 24 стиха есть в gr-lxx-byz. csl-добавления 29:5 «множество утесняющих
# тя» и 29:13 «и устнами своими» внесены без скобок.
# Сносок ⟨…⟩ нет: 陶工, 粘土, 幻, シケラ, アリエル уже в корпусе или пояснены в notes.
# Имена — транслитерация греческого (LXX).

