verses:
  1: "ああ、アリエルという都[みやこ]よ、ダビデが攻[せ]めた都[みやこ]よ。年[とし]から年へと実[みの]りを集[あつ]めよ。あなたがたはモアブとともに食[た]べるからだ。"
  2: "わたしはアリエルを苦[くる]しめる。その力[ちから]と富[とみ]はわたしのものとなる。"
  3: "わたしはダビデのようにあなたを包囲[ほうい]し、あなたの周[まわ]りに柵[さく]を巡[めぐ]らし、あなたの周りに塔[とう]を設[もう]ける。"
  4: "あなたの言葉[ことば]は低[ひく]くされて地[ち]に至[いた]り、あなたの言葉は地に沈[しず]む。あなたの声[こえ]は地から語[かた]る者[もの]のようになり、あなたの声は地面[じめん]に向[む]かって弱[よわ]まる。"
  5: "不敬虔[ふけいけん]な者[もの]の富[とみ]は車輪[しゃりん]から飛[と]ぶほこりのようになり、あなたを苦[くる]しめる者[もの]の群[む]れは吹[ふ]き飛[と]ばされるもみがらのようになる。そして、それはたちまち、一瞬[いっしゅん]のようになる。"
  6: "万軍[ばんぐん]の主[しゅ]による。訪[おとず]れは雷[かみなり]と地震[じしん]と大[おお]きな声[こえ]、押[お]し寄[よ]せる嵐[あらし]と焼[や]き尽[つ]くす火[ひ]の炎[ほのお]とともに来[く]るからだ。"
  7: "アリエルを攻[せ]めたすべての国々[くにぐに]の富[とみ]も、エルサレムを攻めたすべての者[もの]も、それに集[あつ]まりそれを苦[くる]しめるすべての者も、夢[ゆめ]のうちに見[み]る者[もの]のようになる。"
  8: "夢[ゆめ]のうちに飲[の]み食[く]いする者[もの]のようになり、目[め]を覚[さ]ますとその夢はむだである。渇[かわ]いた者[もの]が夢のうちに飲むように見[み]え、目を覚ますとまだ渇いていて、その魂[たましい]はむだに望[のぞ]みを置[お]いた、というとおりである。シオンの山[やま]を攻[せ]めたすべての国々[くにぐに]の富[とみ]も、そのようになる。"
  9: "気[き]を失[うしな]い、驚[おどろ]き、酔[よ]え。シケラによるのでも、ぶどう酒[ぶどうしゅ]によるのでもない。"
  10: "主[しゅ]があなたがたに、深[ふか]い眠[ねむ]りの霊[れい]を飲[の]ませ、彼[かれ]らの目[め]を閉[と]ざされたからだ。彼[かれ]らの預言者[よげんしゃ]たちの目、彼[かれ]らの支配者[しはいしゃ]たちの目、隠[かく]れたことを見[み]る者[もの]たちの目を。"
  11: "これらすべての言葉[ことば]はあなたがたにとって、封[ふう]をされたこの書[ほん]の言葉のようになる。それを文字[もじ]を知[し]る人[ひと]に渡[わた]して「これを読[よ]め」と言[い]うと、その人[ひと]は言[い]う。「読むことはできない。封[ふう]がされているからだ。」"
  12: "またこの書[ほん]は、文字[もじ]を知[し]らない人[ひと]の手[て]に渡[わた]され、「これを読[よ]め」と言[い]われる。するとその人[ひと]は言[い]う。「わたしは文字[もじ]を知[し]らない。」"
  13: "主[しゅ]は言[い]われた。「この民[たみ]は口[くち]で、唇[くちびる]でわたしに近[ちか]づき、わたしを敬[うやま]うが、その心[こころ]はわたしから遠[とお]く離[はな]れている。人[ひと]の戒[いまし]めと教[おし]えを教[おし]えて、わたしをむだに敬[うやま]っている。"
  14: "それゆえ、見[み]よ、わたしはこの民[たみ]を移[うつ]すことを続[つづ]け、彼[かれ]らを移[うつ]す。わたしは知恵[ちえ]ある者[もの]たちの知恵[ちえ]を滅[ほろ]ぼし、悟[さと]りある者[もの]たちの悟[さと]りを隠[かく]す。」"
  15: "ああ、深[ふか]い計画[けいかく]をめぐらし、主[しゅ]によらずにめぐらす者[もの]たちよ。ああ、隠[かく]れて計画をめぐらす者[もの]たちよ。彼[かれ]らの業[わざ]は暗[くら]がりの中[なか]にあり、彼[かれ]らは言[い]う。「だれがわたしたちを見[み]たのか。だれがわたしたちを、わたしたちがしていることを知[し]るのか。」"
  16: "あなたがたは陶工[とうこう]の粘土[ねんど]のように考[かんが]えられるのではないか。造[つく]られたものは造[つく]った者[もの]に「あなたはわたしを造[つく]らなかった」と言[い]うのか。作品[さくひん]は作者[さくしゃ]に「あなたはわたしを巧[たくみ]に造[つく]らなかった」と言[い]うのか。"
  17: "もはや少[すこ]しの間[あいだ]もなく、レバノンはカルメルの山[やま]のように変[か]えられ、カルメルの山は森[もり]と見[み]なされるのではないか。"
  18: "その日[ひ]、耳[みみ]の聞[き]こえない者[もの]たちは書[ほん]の言葉[ことば]を聞[き]き、暗[くら]がりと霧[きり]の中[なか]にいる盲[もう]の目[め]は見[み]えるようになる。"
  19: "貧[まず]しい者[もの]たちは主[しゅ]のゆえに喜[よろこ]び躍[おど]り、人[ひと]のうちで絶望[ぜつぼう]した者[もの]たちは喜[よろこ]びで満[み]たされる。"
  20: "不法[ふほう]な者[もの]は消[き]え去[さ]り、高[たか]ぶる者[もの]は滅[ほろ]び、悪[あく]を行[おこな]う不法な者[もの]たちは断[た]ち滅[ほろ]ぼされた。"
  21: "人[ひと]を言葉[ことば]によって罪[つみ]に陥[おとしい]れる者[もの]たち、門[もん]で責[せ]める者[もの]すべてに罠[わな]を仕掛[しか]け、不正[ふせい]をもって正[ただ]しい者[もの]を曲[ま]げる者[もの]たちも。"
  22: "それゆえ、主[しゅ]はヤコブの家[いえ]についてこう言[い]う。主[しゅ]はアブラハムからこれを分[わ]け離[はな]された。「今[いま]、ヤコブは恥[は]じず、イスラエルはもはや顔色[かおいろ]を変[か]えない。"
  23: "しかし、彼[かれ]らの子[こ]らがわたしの業[わざ]を見[み]るとき、彼[かれ]らはわたしのゆえにわたしの名[な]を聖[せい]とし、ヤコブの聖なる方[かた]を聖とし、イスラエルの神[かみ]を恐[おそ]れる。"
  24: "霊[れい]によって迷[まよ]う者[もの]たちは悟[さと]りを知[し]り、つぶやく者[もの]たちは従[したが]うことを学[まな]び、どもる舌[した]は平和[へいわ]を語[かた]ることを学[まな]ぶ。」"

notes:
  1: "Αριηλ — Ариэль, символическое имя Иерусалима (ср. 29:1–2, 7); транслитерация アリエル. ἣν Δαυιδ ἐπολέμησεν — «который Давид осаждал, воевал» (πολεμέω). συναγάγετε γενήματα ἐνιαυτὸν ἐπ᾿ ἐνιαυτόν — «собирайте плоды из года в год» (γένημα — плод, слав. «жита»). φάγεσθε γὰρ σὺν Μωαβ — «ибо будете есть с Моавом»: тёмное место LXX; у Син. «пусть заколают жертвы» (МТ), в текст не вносится."
  2: "ἐκθλίψω γὰρ Αριηλ — «ибо Я стесню Ариэль» (ἐκθλίβω — сжимать, теснить); ἔσται αὐτῆς ἡ ἰσχὺς καὶ τὸ πλοῦτος ἐμοί — «сила её и богатство будут Моими». У Син. «будет плач и сетование» — МТ, LXX иное, держим LXX."
  3: "κυκλώσω ὡς Δαυιδ ἐπὶ σέ — «обойду, как Давид, против тебя» (κυκλόω — окружать). χάραξ — «осадный вал, частокол» (слав. «острог»); πύργους — «башни» (слав. «столпы»)."
  4: "ταπεινωθήσονται οἱ λόγοι σου εἰς τὴν γῆν — «унизятся слова твои до земли» (ταπεινόω); εἰς τὴν γῆν … δύσονται — «в землю войдут» (δύω). ὡς οἱ φωνοῦντες ἐκ τῆς γῆς — «как вещающие из земли» (φωνέω), т. е. как чревовещатели; ἡ φωνή σου ἀσθενήσει — «голос твой ослабеет» (ἀσθενέω)."
  5: "κονιορτὸς ἀπὸ τροχοῦ — «пыль от колеса» (κονιορτός; слав. «персть от колесе»); χνοῦς φερόμενος — «мякина, носимая ветром» (χνοῦς; слав. «прах летяй»). ὡς στιγμὴ παραχρῆμα — «как мгновение внезапно» (στιγμή — мгновение, точка). Слав. добавляет «множество утесняющих тя» (в LXX нет — внесено без 〔…〕) и «от Господа саваофа», которое по gr открывает ст. 6."
  6: "παρὰ κυρίου σαβαωθ — «от Господа Саваофа»: по gr начало ст. 6, у csl конец ст. 5; держимся gr. ἐπισκοπὴ … μετὰ βροντῆς καὶ σεισμοῦ καὶ φωνῆς μεγάλης — «посещение с громом, землетрясением и гласом великим» (ἐπισκοπή — посещение, слав. «присещение»); καταιγὶς φερομένη καὶ φλὸξ πυρὸς κατεσθίουσα — «буря несущаяся и пламень огня поедающего»."
  7: "ὡς ὁ ἐνυπνιαζόμενος ἐν ὕπνῳ — «как видящий сон во сне» (ἐνυπνιάζομαι). ὁ πλοῦτος τῶν ἐθνῶν — «богатство народов» (πλοῦτος). οἱ συνηγμένοι ἐπ᾿ αὐτὴν καὶ θλίβοντες αὐτήν — «собравшиеся на неё и теснящие её». Сравнение сном продолжается в ст. 8."
  8: "ὡς οἱ ἐν ὕπνῳ πίνοντες καὶ ἔσθοντες — «как во сне пьющие и едящие»; ἐξαναστάντων μάταιον αὐτῶν τὸ ἐνύπνιον — «когда встанут, сон их тщетен» (ἐνύπνιον — сновидение). ὁ διψῶν ὡς πίνων — «жаждущий, как пьющий»; εἰς κενὸν ἤλπισεν — «в пустое надеялся». Сравнение относится к народам, воевавшим против Сиона."
  9: "ἐκλύθητε καὶ ἔκστητε καὶ κραιπαλήσατε — «ослабейте, изумитесь и опьянейте» (ἐκλύω — расслаблять, ἐξίστημι — изумляться, κραιπαλάω — быть в опьянении). οὐκ ἀπὸ σικερα οὐδὲ ἀπὸ οἴνου — «не от сикеры и не от вина» (σικερα — крепкий напиток, транслитерация シケラ). Повелительное наклонение мн. ч. сохранено."
  10: "πεπότικεν ὑμᾶς κύριος πνεύματι κατανύξεως — «Господь напоил вас духом сокрушения, оцепенения» (κατάνυξις; слав. «духом умиления»); передано 深い眠りの霊, так как речь о помрачении и сне. καμμύσει τοὺς ὀφθαλμοὺς αὐτῶν — «закроет глаза их» (καμμύω — смыкать). οἱ ὁρῶντες τὰ κρυπτά — «видящие сокровенное», т. е. прозорливцы."
  11: "τὰ ῥήματα ταῦτα — «слова сии» (ῥῆμα); βιβλίον ἐσφραγισμένον — «запечатанная книга» (σφραγίζω — запечатывать). ἐπισταμένῳ γράμματα — «умеющему [читать] письмена» (γράμματα — буквы, письмо). Речь внутри повествования — 「…」 (две цитаты)."
  12: "μὴ ἐπισταμένου γράμματα — «не умеющего [читать] письмена»: повтор ситуации ст. 11, но с неграмотным. Ответ «не знаю письмён» — в 「…」."
  13: "Ἐγγίζει μοι ὁ λαὸς οὗτος τοῖς χείλεσιν αὐτῶν — «приближается ко Мне народ сей устами своими» (χείλη — губы, уста). ἡ δὲ καρδία αὐτῶν πόρρω ἀπέχει ἀπ᾿ ἐμοῦ — «сердце же их далеко отстоит от Меня» (πόρρω — далеко). μάτην δὲ σέβονταί με — «напрасно почитают Меня» (σέβομαι — чтить); διδάσκοντες ἐντάλματα ἀνθρώπων — «уча заповедям человеческим» (ἔνταλμα). Место цитируется в Мф 15:8–9; слав. удваивает «усты своими и устнами своими» — в LXX этого удвоения нет, внесено без 〔…〕."
  14: "προσθήσω τοῦ μεταθεῖναι τὸν λαὸν τοῦτον — «приложу переселить народ сей» (προστίθημι, μετατίθημι — перемещать). ἀπολῶ τὴν σοφίαν τῶν σοφῶν — «погублю премудрость премудрых» (ἀπόλλυμι); τὴν σύνεσιν τῶν συνετῶν κρύψω — «разум разумных скрою» (κρύπτω)."
  15: "οἱ βαθέως βουλὴν ποιοῦντες — «делающие совет глубоко» (βαθέως — глубоко); οὐ διὰ κυρίου — «не через Господа». ἐν κρυφῇ — «втайне» (κρυφή); ἐν σκότει τὰ ἔργα αὐτῶν — «во тьме дела их». Их слова «кто нас видел?» — в 「…」."
  16: "οὐχ ὡς ὁ πηλὸς τοῦ κεραμέως λογισθήσεσθε — «не как глина горшечника будете сочтены?» (πηλός — глина, κεραμεύς — горшечник, λογίζομαι — считаться). τὸ πλάσμα τῷ πλάσαντι — «изделие — создавшему» (πλάσμα, πλάσσω); τὸ ποίημα τῷ ποιήσαντι — «произведение — сделавшему» (ποίημα). Обе реплики — в 「…」."
  17: "οὐκέτι μικρὸν — «ещё немного»; μετατεθήσεται ὁ Λίβανος ὡς τὸ ὄρος τὸ Χερμελ — «изменится Ливан, как гора Хермел» (μετατίθημι; Χερμελ — Кармил, カルメル). εἰς δρυμὸν λογισθήσεται — «будет сочтён лесом, дубравою» (δρυμός)."
  18: "κωφοὶ λόγους βιβλίου — «глухие слова книги» (κωφός — глухой); οἱ ἐν τῷ σκότει καὶ οἱ ἐν τῇ ὁμίχλῃ — «сущие во тьме и во мгле» (ὁμίχλη — туман, мгла); ὀφθαλμοὶ τυφλῶν βλέψονται — «глаза слепых увидят» (τυφλός)."
  19: "ἀγαλλιάσονται πτωχοὶ διὰ κύριον — «возрадуются нищие ради Господа» (ἀγαλλιάω — ликовать; πτωχός — нищий); οἱ ἀπηλπισμένοι τῶν ἀνθρώπων — «отчаявшиеся из людей» (ἀπελπίζω — отчаиваться). ἐν εὐφροσύνῃ / ἐμπλησθήσονται εὐφροσύνης — «в веселии / исполнятся веселия» (εὐφροσύνη)."
  20: "ἐξέλιπεν ἄνομος — «исчез беззаконник» (ἐκλείπω); ἀπώλετο ὑπερήφανος — «погиб гордый» (ὑπερήφανος); ἐξωλεθρεύθησαν οἱ ἀνομοῦντες ἐπὶ κακίᾳ — «истреблены беззаконнующие во зле» (ἐξολεθρεύω)."
  21: "οἱ ποιοῦντες ἁμαρτεῖν ἀνθρώπους ἐν λόγῳ — «делающие, чтобы люди грешили словом» (ἁμαρτάνω); τοὺς ἐλέγχοντας ἐν πύλαις — «обличающих у ворот» (ἐλέγχω — обличать; πύλη — ворота, где был суд). πρόσκομμα θήσουσιν — «положат преткновение» (πρόσκομμα — соблазн, преткновение); ἐπλαγίασαν ἐν ἀδίκοις δίκαιον — «совратили в неправдах праведного» (πλαγιάζω — совращать)."
  22: "ὃν ἀφώρισεν ἐξ Αβρααμ — «которого Он отделил от Авраама» (ἀφορίζω — отделять), т. е. дом Иакова. Οὐ νῦν αἰσχυνθήσεται Ιακωβ — «не теперь постыдится Иаков»; τὸ πρόσωπον μεταβαλεῖ — «изменит лицо, побледнеет» (μεταβάλλω)."
  23: "ὅταν ἴδωσιν τὰ τέκνα αὐτῶν τὰ ἔργα μου — «когда увидят дети их дела Мои» (слав. «егда увидят чада их дела моя»). ἁγιάσουσιν τὸ ὄνομά μου — «освятят имя Моё» (ἁγιάζω); τὸν ἅγιον Ιακωβ — «Святого Иакова»; τὸν θεὸν τοῦ Ισραηλ φοβηθήσονται — «Бога Израилева убоятся»."
  24: "οἱ τῷ πνεύματι πλανώμενοι — «духом заблуждающие» (πλανάω); οἱ γογγύζοντες — «ропщущие» (γογγύζω); αἱ γλῶσσαι αἱ ψελλίζουσαι — «косноязычные языки» (ψελλίζω — лепетать, слав. «немотствующии»); μαθήσονται λαλεῖν εἰρήνην — «научатся говорить мир»."
