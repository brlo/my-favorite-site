# jp-box, Аввакум, глава 3. Черновик для приёмки.
#
# Нумерация — по славяно-синодальной: наш 3:1–19 = gr 3:1–19, но слав. 3:1 включает
# начало gr 3:2 («Господи, услышах слух твой и убояхся»), поэтому наш 3:1 = надписание
# + это восклицание, а наш 3:2 начинается с «Господи, разумех дела твоя». Дальше
# номера совпадают. Всего в книге 56 стихов (1: 17, 2: 20, 3: 19).
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1 надписание, «услышал — убоялся»; 2 «среди двух животных познаешься»,
# в гневе помянешь милость; 3–7 Богоявление от Фемана, шествие, шатры Ефиопии;
# 8–15 Господь на конях, лук, солнце и луна, спасение помазанников; 16 трепет
# пророка; 17–19 «смоковница не принесёт плода… я же о Господе возрадуюсь».
# Это молитва пророка — внешних кавычек нет по всей главе; 9 «говорит Господь» —
# формула внутри молитвы, не отдельная речь. διάψαλμα (3:3, 3:9, 3:13) не передаётся
# (решение по корпусу), в notes указано.
# 3:3: Θαιμαν — Феман; слав. «от юга» понял имя как наречие.
# 3:5: ἐν πεδίλοις οἱ πόδες αὐτοῦ — «в сандалиях ноги Его» (слав. «при ногу его»);
# в ru/МТ «язва… жгучий ветер» — иное чтение, не внесено.
# 3:14: тёмное место («откроют узды свои, как едящий бедный тайно») передано
# буквально, без сглаживания.
# 3:19: τάξει τοὺς πόδας μου εἰς συντέλειαν — «устроит ноги мои к совершению»;
# «победить в песни Его» — τοῦ νικῆσαι ἐν τῇ ᾠδῇ αὐτοῦ.
#
