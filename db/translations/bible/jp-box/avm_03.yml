verses:
  1: "預言者[よげんしゃ]ハバククの祈[いの]り、歌[うた]をもって。主[しゅ]よ、わたしはあなたのうわさを聞[き]いて恐[おそ]れた。"
  2: "主[しゅ]よ、わたしはあなたのみわざを悟[さと]って驚[おどろ]いた。二[ふた]つの生[い]き物[もの]の間[あいだ]で、あなたは知[し]られる。年[とし]が近[ちか]づくとき、あなたは知[し]られ、時[とき]が来[く]るとき、あなたは現[あらわ]れ、わたしの魂[たましい]が怒[いか]りのうちに乱[みだ]れるとき、あなたはあわれみを思[おも]い起[おこ]される。"
  3: "神[かみ]はテマンから来[こ]られ、聖[せい]なる方[かた]は日[ひ]陰[かげ]深[ふか]い山[やま]から来[こ]られる。その徳[とく]は天[てん]を覆[おお]い、その賛美[さんび]は地[ち]に満[み]ちる。"
  4: "その輝[かがや]きは光[ひかり]のようであり、光[ひかり]の角[つの]がその手[て]にあり、そこにその力[ちから]の強[つよ]い愛[あい]が置[お]かれた。"
  5: "御前[みまえ]には言葉[ことば]が先[さき]だって進[すす]み、それは外[そと]へ出[で]て行[い]く。その足[あし]は履[は]き物[もの]を履[は]いている。"
  6: "主[しゅ]は立[た]ち、地[ち]は揺[ゆ]れ動[うご]いた。主[しゅ]が見[み]つめると、国[くに]々[ぐに]は震[ふる]えた。山[やま]々[やま]は力[ちから]ずくで砕[くだ]け、永遠[えいえん]の丘[おか]は溶[と]けた。その永遠[えいえん]の道[みち]がそこにある。"
  7: "彼らは労苦[ろうく]の代[か]わりに、エチオピアの天幕[てんまく]を見[み]た。エチオピアの天幕[てんまく]は恐[おそ]れ、ミディアンの地[ち]の幕屋[まくや]も恐[おそ]れる。"
  8: "主[しゅ]よ、あなたは川[かわ]に向[む]かって怒[いか]られたのか。あなたの怒[いか]りは川[かわ]に、あなたの憤[いきどお]りは海[うみ]に向[む]かって燃[も]えたのか。あなたが馬[うま]に乗[の]り、あなたの馬[うま]の走[はし]りが救[すく]いとなるためである。"
  9: "あなたは弓[ゆみ]を引[ひ]き、権杖[けんじょう]に向[む]けて引[ひ]き絞[しぼ]る、と主[しゅ]は言[い]われる。あなたは川[かわ]々[がわ]によって地[ち]を裂[さ]く。"
  10: "国[くに]々[ぐに]はあなたを見[み]て産[さん]みの苦[くる]しみを味[あじ]わう。あなたは水[みず]をその道[みち]に散[ち]らし、深[ふか]い淵[ふち]はその声[こえ]を出[だ]し、その幻[まぼろし]の高[たか]みを現[あらわ]す。"
  11: "太陽[たいよう]は上[あ]げられ、月[つき]はその順[じゅん]に立[た]ち止[と]まる。あなたの矢[や]は光[ひかり]の中[なか]へ進[すす]み、あなたの武具[ぶぐ]の閃[ひらめ]きは輝[かがや]きの中[なか]へ進[すす]む。"
  12: "あなたは叱[しか]りによって地[ち]を少[すく]なくし、怒[いか]りによって国[くに]々[ぐに]を倒[たお]す。"
  13: "あなたはご自分[じぶん]の民[たみ]を救[すく]うために、ご自分[じぶん]の油[あぶら]を注[そそ]がれた者[もの]たちを救[すく]うために出[で]て行[い]かれた。あなたは不法[ふほう]な者[もの]たちの頭[かしら]に死[し]を投[な]げ、縛[しば]りを首[くび]に至[いた]るまで上[あ]げられた。"
  14: "あなたは激[はげ]しい勢[いきお]いのうちに、支配[しはい]者[しゃ]たちの頭[かしら]を断[た]ち切[き]られた。彼らはその中[なか]で震[ふる]える。彼らは、ひそかに食[く]らう貧[まず]しい者[もの]のように、自分[じぶん]たちの手綱[たづな]を開[ひら]く。"
  15: "あなたはあなたの馬[うま]を海[うみ]に、多[おお]くの水[みず]をかき乱[みだ]す馬[うま]を海[うみ]に導[みちび]き入[い]れられた。"
  16: "わたしは聞[き]いて、わたしの心[こころ]は恐[おそ]れた。わたしの唇[くちびる]の祈[いの]りの声[こえ]によって、わたしの骨[ほね]のうちに震[ふる]えが入[はい]り、わたしの内[うち]で力[ちから]が乱[みだ]れた。わたしは苦[くる]しみの日[ひ]に休[やす]もう。わたしの寄留[きりゅう]の民[たみ]のところへ上[のぼ]るために。"
  17: "いちじくの木[き]は実[み]を結[むす]ばず、ぶどうの木[き]には実[み]がなく、オリーブの実[み]はだまされ、畑[はたけ]は食[た]べ物[もの]を生[う]み出[だ]さない。羊[ひつじ]は餌[えさ]から絶[た]え、牛[うし]は飼[か]い葉[ば]桶[おけ]のそばにいない。"
  18: "しかし、わたしは主[しゅ]にあって喜[よろこ]び、わたしの救[すく]い主[ぬし]である神[かみ]にあって楽[たの]しむ。"
  19: "主[しゅ]なる神[かみ]はわたしの力[ちから]、わたしの足[あし]を整[ととの]えて完成[かんせい]へと向[む]かわせ、高[たか]い所[ところ]へわたしを上[のぼ]らせ、その歌[うた]のうちでわたしに勝[か]たせる。"

notes:
  1: "Προσευχὴ Αμβακουμ τοῦ προφήτου μετὰ ᾠδῆς — «молитва Аввакума пророка с песнью» (ᾠδή — песнь, 歌). Слав. 3:1 включает начало gr 3:2: Κύριε, εἰσακήκοα τὴν ἀκοήν σου καὶ ἐφοβήθην — «Господи, услышал я слух (весть) Твой и убоялся» (ἀκοή — слух/весть, うわさ); поэтому наш 3:2 начинается с «разумех дела твоя»."
  2: "κατενόησα τὰ ἔργα σου καὶ ἐξέστην — «уразумел дела Твои и изумился» (κατανοέω — постигать, 悟る; ἐξίστημι — изумляться, 驚く); ἐν μέσῳ δύο ζῴων γνωσθήσῃ — «среди двух животных (живых существ) познаешься» (ζῷον — живое существо, 生き物): тёмное место; ἐν τῷ ἐγγίζειν τὰ ἔτη ἐπιγνωσθήσῃ — «когда приблизятся годы, познаешься»; ἐν τῷ παρεῖναι τὸν καιρὸν ἀναδειχθήσῃ — «когда наступит время, явишься» (ἀναδείκνυμι — показывать, 現れる); ἐν τῷ ταραχθῆναι τὴν ψυχήν μου ἐν ὀργῇ ἐλέους μνησθήσῃ — «когда смутится душа моя, в гневе помянешь милость» (ἔλεος — милость, あわれみ)."
  3: "ὁ θεὸς ἐκ Θαιμαν ἥξει — «Бог от Фемана придёт» (Θαιμαν — テマン; слав. «от юга» — имя понято как наречие); ὁ ἅγιος ἐξ ὄρους κατασκίου δασέος — «Святый из горы осенённой, лесистой» (κατάσκιος — осенённый, 日陰深い; δασύς — густой, 深い); ἐκάλυψεν οὐρανοὺς ἡ ἀρετὴ αὐτοῦ — «покрыло небеса величие (добродетель) Его» (ἀρετή — доблесть, 徳); αἰνέσεως αὐτοῦ πλήρης ἡ γῆ — «хвалы Его полна земля». διάψαλμα (セラ) не передаётся — решение по корпусу."
  4: "φέγγος αὐτοῦ ὡς φῶς ἔσται — «сияние Его как свет будет» (φέγγος — сияние, 輝き); κέρατα ἐν χερσὶν αὐτοῦ — «рога (лучи) в руках Его» (κέρας — рог, 角); ἔθετο ἀγάπησιν κραταιὰν ἰσχύος αὐτοῦ — «положил любовь крепкую силы Своей» (ἀγάπησις — любовь, 愛; κραταιός — крепкий, 強い)."
  5: "πρὸ προσώπου αὐτοῦ πορεύσεται λόγος — «пред лицом Его пойдёт слово»; ἐξελεύσεται — «выйдет»; ἐν πεδίλοις οἱ πόδες αὐτοῦ — «в сандалиях ноги Его» (πέδιλον — сандалия, 履き物; слав. «при ногу его» — тёмно). В ru/МТ «язва… жгучий ветер» — иное чтение, не внесено."
  6: "ἔστη, καὶ ἐσαλεύθη ἡ γῆ — «стал, и поколебалась земля»; ἐπέβλεψεν, καὶ διετάκη ἔθνη — «воззрел, и растаяли народы» (διατήκω — растапливать, 溶ける); διεθρύβη τὰ ὄρη βίᾳ — «сокрушились горы силой» (βία — сила, 力ずく); ἐτάκησαν βουνοὶ αἰώνιοι — «растаяли холмы вечные»; πορείας αἰωνίας αὐτοῦ — «шествия вечные Его» (слав. относит к этому стиху)."
  7: "πορείας αἰωνίας αὐτοῦ ἀντὶ κόπων εἶδον — «вечные шествия Его вместо трудов увидели» (ἀντί — вместо, 代わり; κόπος — труд, 労苦); σκηνώματα Αἰθιόπων πτοηθήσονται — «шатры Ефиоплян устрашатся» (σκήνωμα — шатёр, 天幕; πτοέω — пугать, 恐れる); αἱ σκηναὶ γῆς Μαδιαμ — «кущи земли Мадиамской» (Μαδιαμ — ミディアン)."
  8: "μὴ ἐν ποταμοῖς ὠργίσθης, κύριε — «разве на реки прогневался, Господи»; ἢ ἐν θαλάσσῃ τὸ ὅρμημά σου — «или на море стремление Твоё» (ὅρμημα — порыв, 憤り); ὅτι ἐπιβήσῃ ἐπὶ τοὺς ἵππους σου — «ибо взойдёшь на коней Твоих»; ἡ ἱππασία σου σωτηρία — «наезд (конница) Твой — спасение» (ἱππασία — езда/конница, 馬の走り)."
  9: "ἐντείνων ἐντενεῖς τὸ τόξον σου — «напрягая, напряжёшь лук Твой» (ἐντείνω — натягивать, 引く); ἐπὶ τὰ σκῆπτρα — «на скипетры» (σκῆπτρον — скипетр, 権杖); λέγει κύριος — «говорит Господь» (формула внутри молитвы); ποταμῶν ῥαγήσεται γῆ — «реками разсядется (расколется) земля» (ῥήγνυμι — разрывать, 裂く). διάψαλμα не передаётся."
  10: "ὄψονταί σε καὶ ὠδινήσουσιν λαοί — «увидят Тебя и воскорбят (родят) народы» (ὠδίνω — мучиться родами, 産みの苦しみ); σκορπίζων ὕδατα πορείας αὐτοῦ — «развевая воды пути Его» (σκορπίζω — рассеивать, 散らす); ἔδωκεν ἡ ἄβυσσος φωνὴν αὐτῆς — «дала бездна голос свой» (ἄβυσσος — бездна, 淵); ὕψος φαντασίας αὐτῆς — «высоту видения (призрака) своего» (φαντασία — видение, 幻)."
  11: "ἐπήρθη ὁ ἥλιος — «поднялось солнце» (ἐπαίρω — поднимать, 上げる); ἡ σελήνη ἔστη ἐν τῇ τάξει αὐτῆς — «луна стала в чине своём» (τάξις — порядок, 順); εἰς φῶς βολίδες σου πορεύσονται — «в свет стрелы Твои пойдут» (βολίς — стрела, 矢); εἰς φέγγος ἀστραπῆς ὅπλων σου — «в сияние блистания оружий Твоих» (ἀστραπή — блистание, 閃き)."
  12: "ἐν ἀπειλῇ ὀλιγώσεις γῆν — «угрозой умалишь землю» (ἀπειλή — угроза, 叱り; ὀλιγόω — уменьшать, 少なくする); ἐν θυμῷ κατάξεις ἔθνη — «яростью низложишь народы» (κατάγω — низводить, 倒す)."
  13: "ἐξῆλθες εἰς σωτηρίαν λαοῦ σου — «вышел на спасение народа Твоего»; τοῦ σῶσαι τοὺς χριστούς σου — «чтобы спасти помазанников Твоих» (χριστός — помазанный, 油を注がれた者); ἔβαλες εἰς κεφαλὰς ἀνόμων θάνατον — «бросил в головы беззаконных смерть»; ἐξήγειρας δεσμοὺς ἕως τραχήλου — «воздвиг узы до шеи» (δεσμός — узы, 縛り; τράχηλος — шея, 首). διάψαλμα не передаётся (слав. «в конец» — его передача, в текст не внесено)."
  14: "διέκοψας ἐν ἐκστάσει κεφαλὰς δυναστῶν — «рассек в исступлении головы владык» (ἔκστασις — исступление, 激しい勢い; δυνάστης — владыка, 支配者; слав. «во изступлении»); σεισθήσονται ἐν αὐτῇ — «потрясутся в ней»; διανοίξουσιν χαλινοὺς αὐτῶν — «откроют узды свои» (χαλινός — узда, 手綱); ὡς ἔσθων πτωχὸς λάθρᾳ — «как едящий бедный тайно» (λάθρᾳ — тайно, ひそかに): тёмное место, передано буквально."
  15: "ἐπεβίβασας εἰς θάλασσαν τοὺς ἵππους σου — «навёл на море коней Твоих» (ἐπιβιβάζω — вводить, 導き入れる); ταράσσοντας ὕδωρ πολύ — «возмущающих воду многую» (ταράσσω — возмущать, かき乱す)."
  16: "ἐφυλαξάμην — «я сохранился (уберегся)» (φυλάσσω — хранить, 身を慎む); ἐπτοήθη ἡ κοιλία μου — «устрашилась утроба моя» (κοιλία — чрево, 腹; слав. «сердце» — в тексте по слав.); ἀπὸ φωνῆς προσευχῆς χειλέων μου — «от голоса молитвы уст моих» (χεῖλος — уста, 唇); εἰσῆλθεν τρόμος εἰς τὰ ὀστᾶ μου — «вошёл трепет в кости мои»; ὑποκάτωθέν μου ἐταράχθη ἡ ἕξις μου — «подо мной смутилось состояние моё» (ἕξις — состояние, 力); ἀναπαύσομαι ἐν ἡμέρᾳ θλίψεως — «упокоюсь в день скорби»; τοῦ ἀναβῆναι εἰς λαὸν παροικίας μου — «чтобы взойти к народу странствия моего» (παροικία — странствие, 寄留)."
  17: "συκῆ οὐ καρποφορήσει — «смоковница не принесёт плода» (καρποφορέω — плодоносить, 実を結ぶ); οὐκ ἔσται γενήματα ἐν ταῖς ἀμπέλοις — «не будет произведений в лозах» (γένημα — произведение, 実); ψεύσεται ἔργον ἐλαίας — «солжёт дело масличное» (ψεύδομαι — лгать, だます); τὰ πεδία οὐ ποιήσει βρῶσιν — «поля не сотворят пищи» (πεδίον — поле, 畑); ἐξέλιπον ἀπὸ βρώσεως πρόβατα — «оскудели от пищи овцы»; οὐχ ὑπάρχουσιν βόες ἐπὶ φάτναις — «нет волов при яслях» (φάτνη — ясли, 飼い葉桶)."
  18: "ἐγὼ δὲ ἐν τῷ κυρίῳ ἀγαλλιάσομαι — «я же о Господе возрадуюсь» (ἀγαλλιάομαι — ликовать, 喜ぶ); χαρήσομαι ἐπὶ τῷ θεῷ τῷ σωτῆρί μου — «возвеселюсь о Боге, Спасителе моём» (σωτήρ — спаситель, 救い主)."
  19: "κύριος ὁ θεὸς δύναμίς μου — «Господь Бог — сила моя»; τάξει τοὺς πόδας μου εἰς συντέλειαν — «устроит ноги мои к совершению» (τάσσω — ставить, 整える; συντέλεια — совершение, 完成); ἐπὶ τὰ ὑψηλὰ ἐπιβιβᾷ με — «на высоты возводит меня» (ὑψηλός — высокий, 高い所); τοῦ νικῆσαι ἐν τῇ ᾠδῇ αὐτοῦ — «чтобы победить в песни Его» (νικάω — побеждать, 勝つ). Надписание μετὰ ᾠδῆς — «для пения» (слав. «с песнию»)."
