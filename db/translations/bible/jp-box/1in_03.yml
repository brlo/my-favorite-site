chapter: 3
draft: true

verses:
  1: "見[み]よ、父[ちち]がわたしたちに与[あた]えてくださった愛[あい]は、どれほど大[おお]きいものだろうか。わたしたちが神[かみ]の子[こ]と呼ばれる者[もの]とされ、しかも事実[じじつ]そうなのである。世[よ]がわたしたちを知[し]らないのは、父[ちち]を知[し]らないからである。"
  2: "愛[あい]する者[もの]たちよ、わたしたちは今[いま]すでに神[かみ]の子[こ]である。これからわたしたちがどうなるかは、まだ現[あらわ]れていない。この方[かた]が現[あらわ]れるとき、わたしたちはこの方[かた]に似[に]た者[もの]となることを知[し]っている。この方[かた]を、あるがままに見[み]るからである。"
  3: "この方[かた]にこの希望[きぼう]を置[お]く者[もの]はすべて、この方[かた]が清[きよ]いのと同[おな]じように、自分[じぶん]を清[きよ]くする。"
  4: "罪[つみ]を犯[おか]す者[もの]はすべて、不法[ふほう]を行[おこな]っている。罪[つみ]とは不法[ふほう]である。"
  5: "あなたがたも知[し]っているとおり、この方[かた]が現[あらわ]れたのは、罪[つみ]を取[と]り除[のぞ]くためであり、この方[かた]のうちには罪[つみ]がない。"
  6: "この方[かた]のうちにとどまる者[もの]は、罪[つみ]を犯[おか]さない。罪[つみ]を犯[おか]す者[もの]は、この方[かた]を見[み]たこともなく、知[し]ったこともない。"
  7: "子[こ]どもたちよ、だれにも惑[まど]わされてはならない。義[ぎ]を行[おこな]う者[もの]は、この方[かた]が義[ただ]しいのと同[おな]じく、義[ただ]しい者[もの]である。"
  8: "罪[つみ]を犯[おか]す者[もの]は悪魔[あくま]から出[で]ている。悪魔[あくま]は初[はじ]めから罪[つみ]を犯[おか]しているからである。神[かみ]の御子[みこ]が現[あらわ]れたのは、悪魔[あくま]のわざを打[う]ち壊[こわ]すためである。"
  9: "神[かみ]から生[う]まれた者[もの]はだれも罪[つみ]を犯[おか]さない。神[かみ]の種[たね]がその人[ひと]のうちにとどまっているからである。その人[ひと]は罪[つみ]を犯[おか]すことができない。神[かみ]から生[う]まれたからである。"
  10: "これによって、神[かみ]の子[こ]と悪魔[あくま]の子[こ]とが明[あき]らかになる。義[ぎ]を行[おこな]わない者[もの]は、すべて神[かみ]から出[で]た者[もの]ではない。自分[じぶん]の兄弟[きょうだい]を愛[あい]さない者[もの]も同[おな]じである。"
  11: "互[たが]いに愛[あい]し合[あ]うこと、これがあなたがたが初[はじ]めから聞[き]いた知[し]らせである。"
  12: "カインのようであってはならない。カインは悪[あく]しき者[もの]に属[ぞく]し、自分[じぶん]の弟[おとうと]を殺[ころ]した。なぜ殺[ころ]したのか。自分[じぶん]の行[おこな]いが悪[わる]く、弟[おとうと]の行[おこな]いが正[ただ]しかったからである。"
  13: "兄弟[きょうだい]たちよ、世[よ]があなたがたを憎[にく]んでも、驚[おどろ]いてはならない。"
  14: "わたしたちは、死[し]から命[いのち]へ移[うつ]ったことを知[し]っている。兄弟[きょうだい]たちを愛[あい]しているからである。愛[あい]さない者[もの]は死[し]にとどまっている。"
  15: "自分[じぶん]の兄弟[きょうだい]を憎[にく]む者[もの]は、だれも人殺[ひとごろ]しである。人殺[ひとごろ]しには永遠[えいえん]の命[いのち]がそのうちにとどまっていないことを、あなたがたは知[し]っている。"
  16: "わたしたちはこれによって愛[あい]を知[し]った。この方[かた]がわたしたちのために命[いのち]を捨[す]てられたのである。だから、わたしたちも兄弟[きょうだい]たちのために命[いのち]を捨[す]てるべきである。"
  17: "世[よ]の暮[く]らしの資[し]力[りょく]を持[も]ちながら、兄弟[きょうだい]が乏[とぼ]しいのを見[み]て、心[こころ]を閉[と]ざす者[もの]のうちに、どうして神[かみ]の愛[あい]がとどまっていようか。"
  18: "子[こ]どもたちよ、わたしたちは言葉[ことば]や舌[した]で愛[あい]するのではなく、行[おこな]いと真理[しんり]によって愛[あい]しよう。"
  19: "これによって、わたしたちが真理[しんり]に属[ぞく]していることが分[わ]かり、この方[かた]の御前[みまえ]で心[こころ]を安[やす]んじることができる。"
  20: "たとえ心[こころ]がわたしたちを責[せ]めても、神[かみ]はわたしたちの心[こころ]よりも大[おお]きな方[かた]であり、すべてをご存[ぞん]じである。"
  21: "愛[あい]する者[もの]たちよ、心[こころ]がわたしたちを責[せ]めないなら、わたしたちは神[かみ]に対[たい]して大胆[だいたん]さを持[も]つ。"
  22: "また、求[もと]めるものは何[なん]でもこの方[かた]から受[う]け取[と]る。その戒[いまし]めを守[まも]り、その御前[みまえ]で喜[よろこ]ばれることを行[おこな]っているからである。"
  23: "その戒[いまし]めとは、御子[みこ]イエス・キリストの名[な]を信[しん]じ、わたしたちが戒[いまし]めを受[う]けたとおりに互[たが]いに愛[あい]し合[あ]うことである。"
  24: "その戒[いまし]めを守[まも]る者[もの]はこの方[かた]のうちにとどまり、この方[かた]もその人[ひと]のうちにとどまられる。わたしたちのうちにこの方[かた]がとどまっておられることは、この方[かた]がわたしたちに与[あた]えてくださった霊[れい]によって知[し]る。"

notes:
  1: "ἴδετε ποταπήν — 見よ、どれほど大きい…だろうか (ποταπός — какой, сколь великий; восклицание, не вопрос). ἵνα τέκνα θεοῦ κληθῶμεν — 神の子と呼ばれる者とされ. καὶ ἐσμέν — しかも事実そうなのである (не «и мы будем»; утверждение действительности). οὐκ ἔγνω αὐτόν — 父を知らない (αὐτόν — Христос или Отец; в контексте — Отец)."
  2: "οὔπω ἐφανερώθη τί ἐσόμεθα — まだ現れていない. ὅμοιοι αὐτῷ ἐσόμεθα — この方に似た者となる. ὀψόμεθα αὐτὸν καθώς ἐστιν — あるがままに見る (καθώς — как, в каком виде)."
  3: "ἁγνίζει ἑαυτόν — 自分を清くする (ἁγνίζω — очищать, хранить в чистоте). ἁγνός — 清い."
  4: "ἀνομία — 不法 (беззаконие, не «безнравственность»). ἡ ἁμαρτία ἐστὶν ἡ ἀνομία — 罪とは不法である (отождествление сохранено, без смягчения)."
  5: "ἐφανερώθη ἵνα…ἄρῃ — 現れたのは…取り除くため (αἴρω — поднять, унести). ἁμαρτία ἐν αὐτῷ οὐκ ἔστιν — この方のうちには罪がない. Учение, не речь Христа: красного и кавычек нет."
  6: "ὁ ἐν αὐτῷ μένων — この方のうちにとどまる者. οὐχ ἑώρακεν…οὐδὲ ἔγνωκεν — 見たこともなく、知ったこともない (perfect, отрицание факта в прошлом с результатом в настоящем)."
  7: "μηδεὶς πλανάτω ὑμᾶς — だれにも惑わされてはならない. ποιῶν τὴν δικαιοσύνην — 義を行う (δικαιοσύνη — правда, праведность). καθὼς ἐκεῖνος δίκαιός ἐστιν — この方が義しいのと同じく."
  8: "ἐκ τοῦ διαβόλου ἐστίν — 悪魔から出ている. ἀπ᾽ ἀρχῆς ὁ διάβολος ἁμαρτάνει — 悪魔は初めから罪を犯している (настоящее время). λύσῃ τὰ ἔργα — わざを打ち壊す (λύω — разрушать, освобождать)."
  9: "σπέρμα αὐτοῦ ἐν αὐτῷ μένει — 神の種がその人のうちにとどまっている (σπέρμα — семя; родительный «Его» — Бога). οὐ δύναται ἁμαρτάνειν — 罪を犯すことができない (невозможность, не «не хочет»)."
  10: "φανερά ἐστιν — 明らかになる. τὰ τέκνα τοῦ θεοῦ καὶ τὰ τέκνα τοῦ διαβόλου — 神の子と悪魔の子. ὁ μὴ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ — 自分の兄弟を愛さない者 (стих обрывается на этом придаточном, как и в греческом)."
  11: "ἀγγελία — 知らせ (то же слово, что в 1:5). ἵνα ἀγαπῶμεν ἀλλήλους — 互いに愛し合うこと (ἵνα раскрывает содержание «知らせ»)."
  12: "οὐ καθὼς Κάϊν — カインのようであってはならない (эллипсис с 3:11: «не так, как Каин»). ἐκ τοῦ πονηροῦ ἦν — 悪しき者に属し (ὁ πονηρός — дьявол, как в 2:13,14). ἔσφαξεν — 殺した (σφάζω — закалывать, убивать). χάριν τίνος — なぜ (ради чего). Пересказ, не цитата: кавычек нет."
  13: "μὴ θαυμάζετε — 驚いてはならない. εἰ μισεῖ ὑμᾶς ὁ κόσμος — 世があなたがたを憎んでも (εἰ — условие, не «если» сомнения). [καὶ] в базе есть — без 〔…〕."
  14: "μεταβεβήκαμεν ἐκ τοῦ θανάτου εἰς τὴν ζωήν — 死から命へ移った (perfect, свершившийся переход). ὅτι ἀγαπῶμεν — 愛しているからである (признак перехода). ὁ μὴ ἀγαπῶν μένει ἐν τῷ θανάτῳ — 愛さない者は死にとどまっている."
  15: "ἀνθρωποκτόνος — 人殺し (букв. «человекоубийца»). ζωὴν αἰώνιον…ἐν αὐτῷ μένουσαν — 永遠の命がそのうちにとどまっている (μένουσαν — причастие, «пребывающую»)."
  16: "ἐν τούτῳ ἐγνώκαμεν τὴν ἀγάπην — わたしたちはこれによって愛を知った (ἐν τούτῳ — «тем, что»; дополнение «что такое любовь» не добавлено). ἐκεῖνος ὑπὲρ ἡμῶν τὴν ψυχὴν αὐτοῦ ἔθηκεν — この方がわたしたちのために命を捨てられた (τίθημι τὴν ψυχήν — положить душу; ψυχή — 命). ὀφείλομεν — 〜べきである."
  17: "τὸν βίον τοῦ κόσμου — 世の暮らしの資力 (βίος — средства к жизни, ср. 2:16). κλείσῃ τὰ σπλάγχνα αὐτοῦ ἀπ᾽ αὐτοῦ — 心を閉ざす (σπλάγχνα — внутренности, «милосердие»; передано 心). πῶς…μένει; — どうして…とどまっていようか (риторический вопрос без ответа)."
  18: "μὴ ἀγαπῶμεν λόγῳ μηδὲ τῇ γλώσσῃ — 言葉や舌で愛するのではなく (λόγος и γλῶσσα — два разных слова, оба сохранены). ἐν ἔργῳ καὶ ἀληθεία — 行いと真理によって. ἀγαπῶμεν — сослагательное увещания: 愛しよう."
  19: "ἐκ τῆς ἀληθείας ἐσμέν — 真理に属している (ἐκ — из, от; «от истины»). πείσομεν τὴν καρδίαν ἡμῶν — 心を安んじる (πείθω — убеждать, успокаивать; у jp-joc 安心す). Сказуемое 3:20 в греческом продолжает этот стих."
  20: "καταγινώσκῃ ἡμῶν ἡ καρδία — 心がわたしたちを責める (καταγινώσκω — осуждать, обвинять). μείζων ἐστὶν ὁ θεὸς τῆς καρδίας ἡμῶν — 神はわたしたちの心よりも大きな方. γινώσκει πάντα — すべてをご存じである. Два ὅτι в греческом; второе передано главным предложением."
  21: "παρρησίαν ἔχομεν πρὸς τὸν θεόν — 神に対して大胆さを持つ (παρρησία — дерзновение в молитве, ср. 2:28; 4:17; 5:14). Условное ἐὰν ἡ καρδία μὴ καταγινώσκῃ — 責めないなら."
  22: "ὃ ἐὰν αἰτῶμεν — 求めるものは何でも. λαμβάνομεν — настоящее время: 受け取る (постоянно). τὰ ἀρεστὰ ἐνώπιον αὐτοῦ — その御前で喜ばれること (ἀρεστός — угодный)."
  23: "ἡ ἐντολὴ αὐτοῦ — その戒め (одна, в двух членах). ἵνα πιστεύσωμεν τῷ ὀνόματι — 名を信じ (πιστεύω + датив — верить имени, доверять). καθὼς ἔδωκεν ἐντολὴν ἡμῖν — 戒めを受けたとおりに."
  24: "ὁ τηρῶν τὰς ἐντολὰς αὐτοῦ — その戒めを守る者. ἐν αὐτῷ μένει καὶ αὐτὸς ἐν αὐτῷ — この方のうちにとどまり、この方もその人のうちにとどまられる (второе ἐν αὐτῷ в базе — «в нём», то есть в соблюдающем). ἐκ τοῦ πνεύματος οὗ ἡμῖν ἔδωκεν — 与えてくださった霊によって: πνεῦμα без ἅγιον, поэтому 霊[れい], а не пара {聖霊｜聖神}."
