# jp-box, 1-е Послание Иоанна, глава 3. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 3: дети Божии и надежда увидеть Его (1–3), грех и беззаконие (4–10),
# Каин и любовь к братьям (11–18), уверенность перед Богом (19–24).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет.
# 〔…〕 в главе нет: [καὶ] в 3:13 и [Καὶ] в 3:19 стоят в базе (слова есть), поэтому не оборачиваются.
# Сносок ⟨…⟩ в главе нет: 悪魔, 人殺し, 偶像 уже встречались в корпусе.
# 3:5 и 3:12 — учение и пересказ, а не речь Христа и не цитата: кавычек и красного нет.
# πνεῦμα в 3:24 без ἅγιον — 霊[れい], пара {聖霊｜聖神} не ставится. jp-ni не использовался.

tr_code: jp-box
