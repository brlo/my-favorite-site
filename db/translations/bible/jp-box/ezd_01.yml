# jp-box, Ездра, глава 1. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»); ru (Синодальный) —
# только для понимания, не источник. jp-joc в книге нет; jp-ni (под авторским правом)
# не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 1: указ Кира (1–4), возвращение и пожертвования (5–6), сосуды дома Господня
# (7–11). Речь Кира — 「…」 (2–4); красного нет.
# Нумерация по gr: 11 стихов. 〔…〕 нет: слав. чтения (1:2 «повеле ми», 1:9 «ножей»,
# 1:10 «сребряных двойных четыреста десять») внесены в основной текст без скобок,
# расхождения с LXX — в notes.
# Сносок ⟨…⟩ нет: 神殿, 祭壇, 燔祭, 祭司, レビ人, 宝物 уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: ezd
chapter: 1
draft: true

verses:
  1: "ペルシアの王[おう]クロスの第一年[だいいちねん]、主[しゅ]がエレミヤの口[くち]によって語[かた]られた言葉[ことば]が成就[じょうじゅ]するために、主[しゅ]はペルシアの王[おう]クロスの霊[れい]を奮[ふる]い起[おこ]こし、その王国[おうこく]のすべてに、口[くち]づてにもまた書[しょ]をもって告[つ]げ知[し]らせるように命[めい]じて、こう言[い]った。"
  2: "「ペルシアの王[おう]クロスはこう言[い]う。天[てん]の神[かみ]である主[しゅ]は、地[ち]のすべての王国[おうこく]をわたしに与[あた]え、ご自分[じぶん]がわたしを顧[かえり]み、ユダにあるエルサレムに、ご自分[じぶん]のために家[いえ]を建[た]てるようわたしに命[めい]じられた。」"
  3: "「あなたがたのうち、その民[たみ]のすべてから、だれでも、その神[かみ]がその人[ひと]とともにおられるように。その人[ひと]はユダにあるエルサレムに上[のぼ]って行[い]き、イスラエルの神[かみ]の家[いえ]を建[た]てよ。この方[かた]こそ、エルサレムにおられる神[かみ]である。」"
  4: "「その地[ち]のすべての場所[ばしょ]のうち、その人[ひと]が寄留[きりゅう]している所[ところ]に残[のこ]される者[もの]はだれでも、その所[ところ]の人[ひと]々[びと]が、銀[ぎん]と金[きん]、財産[ざいさん]、家畜[かちく]をもって、エルサレムにある神[かみ]の家[いえ]への自発[じはつ]の捧[ささ]げ物[もの]とともに、その人[ひと]を助[たす]けよ。」"
  5: "そこで、ユダとベニヤミンの氏族[しぞく]の長[かしら]たち、祭司[さいし]たち、レビ人[びと]たち、すなわち、神[かみ]がその霊[れい]を奮[ふる]い起[おこ]こされたすべての者[もの]が立[た]ち上[あ]がり、エルサレムにある主[しゅ]の家[いえ]を建[た]てるために上[のぼ]って行[い]こうとした。"
  6: "その周[まわ]りにいたすべての者[もの]たちは、銀[ぎん]の器[うつわ]、金[きん]、財産[ざいさん]、家畜[かちく]、貴重[きちょう]な品[しな]々[しな]で彼[かれ]らの手[て]を強[つよ]めた。これはすべて、自発[じはつ]の捧[ささ]げ物[もの]のほかであった。"
  7: "また、クロス王[おう]は主[しゅ]の家[いえ]の器[うつわ]を出[だ]した。それは、ネブカドネツァルがエルサレムから取[と]って、自分[じぶん]の神[かみ]の家[いえ]に置[お]いたものである。"
  8: "クロス王[おう]は、宝物[たからもの]を管理[かんり]する者[もの]ミトラダテスの手[て]によってそれらを出[だ]し、数[かぞ]えて、ユダの長[かしら]ササバサルに渡[わた]した。"
  9: "その数[かず]は次[つぎ]のとおりである。金[きん]の洗[あら]い鉢[ばち]三十[さんじゅう]、銀[ぎん]の洗[あら]い鉢[ばち]千[せん]、小刀[こがたな]二十九[にじゅうきゅう]、"
  10: "金[きん]の杯[さかずき]三十[さんじゅう]、銀[ぎん]の二重[にじゅう]の杯[さかずき]四百十[よんひゃくじゅう]、ほかの器[うつわ]千[せん]。"
  11: "金[きん]と銀[ぎん]の器[うつわ]は全部[ぜんぶ]で五千四百[ごせんよんひゃく]であった。ササバサルは、バビロンからの捕囚[ほしゅう]の移住[いじゅう]の者[もの]たちとともにエルサレムへ上[のぼ]るとき、これらすべてを携[たずさ]えて上[のぼ]った。"

notes:
  1: "ἐν τῷ πρώτῳ ἔτει Κύρου — в первый год Кира (Κῦρος, クロス). τοῦ τελεσθῆναι λόγον κυρίου ἀπὸ στόματος Ιερεμιου — чтобы исполнилось слово Господне из уст Иеремии (τελέω; слав. «да исполнится»). ἐξήγειρεν κύριος τὸ πνεῦμα — возбудил Господь дух (ἐξεγείρω). παρήγγειλεν φωνὴν … καί γε ἐν γραπτῷ λέγων — повелел объявить голосом и даже письменно, говоря (παραγγέλλω, γραπτός). Та же формула в 2 Пар 36:22, но там нет φωνή."
  2: "Οὕτως εἶπεν Κῦρος — так сказал Кир. Πάσας τὰς βασιλείας τῆς γῆς — все царства земли. κύριος ὁ θεὸς τοῦ οὐρανοῦ — Господь Бог небесный. ἐπεσκέψατο ἐπ᾿ ἐμὲ τοῦ οἰκοδομῆσαι — «посетил меня, чтобы построить» (ἐπισκέπτομαι); слав. «той повеле ми, да созижду» — в тексте соединены оба чтения. οἶκος — 家 (дом), не 神殿."
  3: "τίς ἐν ὑμῖν ἀπὸ παντὸς τοῦ λαοῦ αὐτοῦ — кто из вас из всего народа Его. ἔσται ὁ θεὸς αὐτοῦ μετ᾿ αὐτοῦ — да будет Бог его с ним. ἀναβήσεται … οἰκοδομησάτω — пусть взойдёт и построит (ἀναβαίνω, οἰκοδομέω). [αὐτὸς ὁ θεὸς ὁ ἐν Ιερουσαλημ] — «Сам Бог, Который в Иерусалиме»: в квадратных скобках критического издания, но есть и в слав. («той есть Бог, иже во Иерусалиме»), поэтому без 〔…〕."
  4: "πᾶς ὁ καταλειπόμενος — всякий остающийся (καταλείπω). οὗ αὐτὸς παροικεῖ — где он странствует, живёт (παροικέω, 寄留). λήμψονται αὐτὸν ἄνδρες τοῦ τόπου — «возьмут его» мужи места того, т. е. поддержат. ἐν ἀργυρίῳ καὶ χρυσίῳ καὶ ἀποσκευῇ καὶ κτήνεσιν — серебром, золотом, имуществом и скотом. μετὰ τοῦ ἑκουσίου — с добровольным [приношением] (ἑκούσιος)."
  5: "ἀνέστησαν ἄρχοντες τῶν πατριῶν — поднялись главы отцов (ἄρχων, πατριά). τῷ Ιουδα καὶ Βενιαμιν — Иуды и Вениамина. πάντων ὧν ἐξήγειρεν ὁ θεὸς τὸ πνεῦμα αὐτῶν — всех, кому Бог возбудил дух их. τοῦ ἀναβῆναι οἰκοδομῆσαι — чтобы взойти и построить. Слав. «князи отечеств»."
  6: "οἱ κυκλόθεν — окружающие (κυκλόθεν). ἐνίσχυσαν ἐν χερσὶν αὐτῶν — укрепили руки их (ἐνισχύω). ἐν σκεύεσιν ἀργυρίου — серебряными сосудами. ἐν ξενίοις — «гостинцами», дорогими вещами (ξένιον; слав. «драгими вещми»). πάρεξ τῶν ἐν ἑκουσίοις — кроме добровольных [приношений] (πάρεξ)."
  7: "ἐξήνεγκεν τὰ σκεύη οἴκου κυρίου — вынес сосуды дома Господня (σκεῦος). ἃ ἔλαβεν Ναβουχοδονοσορ — которые взял Навуходоносор. ἔδωκεν αὐτὰ ἐν οἴκῳ θεοῦ αὐτοῦ — положил их в доме бога своего. В 2 Пар 36:7 стоит ναός (神殿), здесь οἶκος (家)."
  8: "ἐπὶ χεῖρα Μιθραδάτου γασβαρηνου — через (букв. «на руку») Митрадата, хранителя сокровищ; γασβαρηνός — персидский титул, слав. «гасваринов» как прозвище, ru «сокровищехранителя». ἠρίθμησεν αὐτὰ τῷ Σασαβασαρ — счётом передал их Сасабасару (ἀριθμέω). ἄρχων τοῦ Ιουδα — князь Иудин. Σασαβασαρ = Шешбацар (слав. сасавассар)."
  9: "ψυκτῆρες — сосуды для охлаждения вина (ψυκτήρ); слав. «умывалницы», ru «блюда». παρηλλαγμένα ἐννέα καὶ εἴκοσι — «иных [образцов] двадцать девять» (παραλλάσσω); слав. «ножей двадесять девять» следует евр. מַחֲלָפִים; в тексте церковное чтение 小刀. Слав. «умывалниц сребряных тысяща» — 1000."
  10: "κεφφουρη — чаши (арамейское заимствование; слав. «чаши»). χρυσοῖ τριάκοντα — золотых тридцать. ἀργυροῖ διακόσιοι — серебряных двести; слав. «сребряных двойных четыреста десять» — иное чтение, в тексте церковное. σκεύη ἕτερα χίλια — других сосудов тысяча."
  11: "πάντα τὰ σκεύη τῷ χρυσῷ καὶ τῷ ἀργύρῳ — все сосуды золотом и серебром. πεντακισχίλια καὶ τετρακόσια — 5400; сумма стихов 9–10 не даёт этого числа ни в LXX, ни в слав. — известная особенность списка. ἀπὸ τῆς ἀποικίας ἐκ Βαβυλῶνος — из переселения из Вавилона (ἀποικία); слав. «от преселения вавилонскаго»."
