# jp-box, 2-е Послание к Фессалоникийцам, глава 1. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 1: надписание и приветствие (1–2), благодарение за веру и любовь (3–4),
# страдание как знак праведного суда (5), грядущий суд и слава Христа (6–10),
# молитва о достойной жизни (11–12).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет, <j>/<mo> не ставятся.
# 〔…〕 в главе нет: в базе стихи 1–12 стоят без квадратных скобок, добавлений Церкви нет.
# 1:6–10 в греческом — одно длинное предложение; по стихам разделено, связь держат
# また (7) и そのとき (8), решения — в notes. Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

tr_code: jp-box
book: 2sol
chapter: 1
draft: true

verses:
  1: "パウロとシルワノとテモテ、わたしたちの父[ちち]である神[かみ]と主[しゅ]イエス・キリストのうちにあるテサロニケの教会[きょうかい]へ。"
  2: "{恵[めぐ]み|恩寵[おんちょう]}と平和[へいわ]が、わたしたちの父[ちち]である神[かみ]と主[しゅ]イエス・キリストから、あなたがたにありますように。"
  3: "兄弟[きょうだい]たち、わたしたちは、あなたがたのためにいつも神[かみ]に感謝[かんしゃ]すべきである。そうするのがふさわしい。あなたがたの信仰[しんこう]が大[おお]いに増[ま]し、あなたがたすべてのうちで、互[たが]いに対する一人[ひとり]一人[ひとり]の愛[あい]が満[み]ちあふれているからである。"
  4: "そのため、わたしたち自身[じしん]が、あなたがたのことを、神[かみ]の諸[しょ]教会[きょうかい]の間[あいだ]で誇[ほこ]っている。あなたがたが、あらゆる迫害[はくがい]と患難[かんなん]のうちで、忍耐[にんたい]と信仰[しんこう]をもって耐[た]え忍[しの]んでいるからである。"
  5: "これは、神[かみ]の正[ただ]しい裁[さば]きの証[あかし]しである。あなたがたが神[かみ]の国[くに]にふさわしい者[もの]とされるためであり、あなたがたはその国[くに]のために苦[くる]しんでいるのである。"
  6: "あなたがたを苦[くる]しめる者[もの]たちに苦[くる]しみを返[かえ]すことは、神[かみ]の前[まえ]で正[ただ]しいことである。"
  7: "また、苦[くる]しめられているあなたがたには、わたしたちとともに安[やす]らぎが与[あた]えられる。それは、主[しゅ]イエスが、ご自分[じぶん]の力[ちから]ある天使[てんし]たちとともに天[てん]から現[あらわ]れるときのことである。"
  8: "そのとき、主[しゅ]は炎[ほのお]の火[ひ]のうちに現[あらわ]れ、神[かみ]を知[し]らない者[もの]たちと、わたしたちの主[しゅ]イエスの福音[ふくいん]に従[したが]わない者[もの]たちとに、報復[ほうふく]を与[あた]えられる。"
  9: "この者[もの]たちは、主[しゅ]の御顔[みかお]から、またその力[ちから]の栄光[えいこう]から遠[とお]ざけられて、永遠[えいえん]の滅[ほろ]びの罰[ばつ]を受[う]ける。"
  10: "それは、主[しゅ]が来[こ]られ、ご自分[じぶん]の聖徒[せいと]たちのうちに栄光[えいこう]を受[う]け、信[しん]じた者[もの]たちすべてのうちに驚嘆[きょうたん]される、その日[ひ]のことである。あなたがたの間[あいだ]でも、わたしたちの証[あかし]しが信[しん]じられたからである。"
  11: "このために、わたしたちはいつもあなたがたのために祈[いの]っている。わたしたちの神[かみ]があなたがたを召[め]しにふさわしい者[もの]とし、善[ぜん]へのあらゆる願[ねが]いと、信仰[しんこう]の働[はたら]きとを、力[ちから]をもって満[み]たしてくださるように。"
  12: "それは、わたしたちの主[しゅ]イエスの名[な]があなたがたのうちで栄光[えいこう]を受[う]け、あなたがたも彼[かれ]のうちで栄光[えいこう]を受[う]けるためであり、わたしたちの神[かみ]と主[しゅ]イエス・キリストの{恵[めぐ]み|恩寵[おんちょう]}に応[おう]じてのことである。"

notes:
  1: "Παῦλος καὶ Σιλουανὸς καὶ Τιμόθεος — без глагола, как в Гал 1:1; Флп 1:1. Σιλουανός — シルワノ (латинская форма имени; в Деяниях тот же спутник Павла — Сила). ἐν θεῷ πατρὶ ἡμῶν καὶ κυρίῳ Ἰησοῦ Χριστῷ — わたしたちの父である神と主イエス・キリストのうちにある; «в» относится к обоим членам."
  2: "χάρις ὑμῖν καὶ εἰρήνη — формула приветствия (ср. Гал 1:3). ἀπὸ θεοῦ πατρὸς καὶ κυρίου Ἰησοῦ Χριστοῦ — 父である神と主イエス・キリストから."
  3: "εὐχαριστεῖν ὀφείλομεν — 感謝すべきである («должны»). καθὼς ἄξιόν ἐστιν — そうするのがふさわしい. ὑπεραυξάνει — «чрезвычайно возрастает»; 大いに増し. πλεονάζει — 満ちあふれている. ἑνὸς ἑκάστου πάντων ὑμῶν — 一人ひとり; букв. «каждого из всех вас», родительный при ἀγάπη."
  4: "ἐγκαυχᾶσθαι ἐν ὑμῖν — あなたがたのことを誇る. ἐν ταῖς ἐκκλησίαις τοῦ θεοῦ — 神の諸教会の間で. ὑπομονή — 忍耐. ἀνέχεσθε — 耐え忍んでいる (praes., «держитесь»). διωγμός — 迫害, θλῖψις — 患難."
  5: "ἔνδειγμα — «доказательство, явный знак»; 証し. τῆς δικαίας κρίσεως τοῦ θεοῦ — 神の正しい裁き. εἰς τὸ καταξιωθῆναι — ふさわしい者とされる. ὑπὲρ ἧς καὶ πάσχετε — «за которое вы и страдаете»."
  6: "εἴπερ — «если только» (риторическое утверждение: у Бога праведно). ἀνταποδοῦναι — «воздать»; 返す. Стих открывает предложение, которое в греческом тянется до 10-го; в японском разделено по стихам, связь держат また (7) и そのとき (8)."
  7: "ἄνεσις — 安らぎ («отдых, облегчение»; ср. 2 Кор 2:13). ἐν τῇ ἀποκαλύψει — 現れるとき (ἀποκάλυψις, не παρουσία). μετ᾿ ἀγγέλων δυνάμεως αὐτοῦ — 力ある天使たち; родительный качества."
  8: "ἐν πυρὶ φλογός — 炎の火のうちに; семитский гендиадис, не сглажен. διδόντος ἐκδίκησιν — 報復を与える (ἐκδίκησις — «возмездие»; у jp-joc 報い). τοῖς μὴ εἰδόσιν θεόν — 神を知らない者たち."
  9: "δίκην τίσουσιν ὄλεθρον αἰώνιον — «понесут наказание — вечную погибель»; 永遠の滅びの罰. ἀπὸ προσώπου τοῦ κυρίου — «от лица Господа», то есть в удалении от него: 遠ざけられて передаёт ἀπό, не добавляя новой мысли. τῆς ἰσχύος αὐτοῦ — その力."
  10: "ἐνδοξασθῆναι — 栄光を受ける (pass.). θαυμασθῆναι — 驚嘆される (pass.). ὅτι ἐπιστεύθη τὸ μαρτύριον ἡμῶν ἐφ᾿ ὑμᾶς — あなたがたの間でも、わたしたちの証しが信じられた (ἐπί с acc. — «к, у»). ἐν τῇ ἡμέρᾳ ἐκείνῃ относится к ὅταν: その日のことである."
  11: "εἰς ὃ καί — このために. ἀξιώσῃ τῆς κλήσεως — 召しにふさわしい者とする. πληρώσῃ — 満たす. πᾶσαν εὐδοκίαν ἀγαθωσύνης — 善へのあらゆる願い (εὐδοκία — «благоволение, доброе намерение»; ἀγαθωσύνη — «благость»). ἔργον πίστεως — 信仰の働き. ἐν δυνάμει — 力をもって."
  12: "ὅπως ἐνδοξασθῇ — 栄光を受けるため. τὸ ὄνομα τοῦ κυρίου ἡμῶν Ἰησοῦ — わたしたちの主イエスの名. καὶ ὑμεῖς ἐν αὐτῷ — あなたがたも彼のうちで. κατὰ τὴν χάριν — 恵みに応じて."
