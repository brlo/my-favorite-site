verses:
  1: "主[しゅ]はモーセに言[い]われた。「ファラオのところへ行[い]き、彼[かれ]に言[い]いなさい。『ヘブライ人[じん]の神[かみ]である主[しゅ]がこう言[い]われる。わたしの民[たみ]を去[さ]らせて、わたしに仕[つか]えさせよ。"
  2: "もし、あなたが彼[かれ]らを去[さ]らせるのを拒[こば]み、なおも引[ひ]き止[と]めているなら、"
  3: "見[み]よ、主[しゅ]の手[て]が、野[の]にいるあなたの家畜[かちく]、すなわち馬[うま]、ろば、らくだ、牛[うし]、羊[ひつじ]の上[うえ]に下[くだ]り、非常[ひじょう]に激[はげ]しい疫病[えきびょう]が起[こ]る。"
  4: "主[しゅ]はその時[とき]、エジプトの家畜[かちく]とイスラエルの子[こ]らの家畜[かちく]を分[わ]け、イスラエルの子[こ]らの家畜[かちく]は一頭[いっとう]も死[し]なない。』」"
  5: "神[かみ]は期限[きげん]を定[さだ]めて言[い]われた。「明日[あした]、主[しゅ]はこのことをこの地[ち]で行[おこな]う。」"
  6: "主[しゅ]は翌日[よくじつ]、このことを行[おこな]われた。エジプトの家畜[かちく]はすべて死[し]に、イスラエルの子[こ]らの家畜[かちく]は一頭[いっとう]も死[し]ななかった。"
  7: "ファラオは、イスラエルの子[こ]らの家畜[かちく]が一頭[いっとう]も死[し]ななかったのを見[み]て、その心[こころ]は重[おも]くなり、民[たみ]を去[さ]らせなかった。"
  8: "主[しゅ]はモーセとアロンに言[い]われた。「あなたがたはかまどのすすを両手[りょうて]いっぱいに取[と]り、モーセはファラオの前[まえ]でそれを天[てん]に向[む]かってまき散[ち]らしなさい。"
  9: "それはエジプトの全土[ぜんど]で細[こま]かなほこりとなり、人[ひと]にも家畜[かちく]にも、エジプトの全土[ぜんど]でうみの出[で]る腫[は]れ物[もの]となる。」"
  10: "彼[かれ]らはかまどのすすを取[と]ってファラオの前[まえ]に立[た]ち、モーセはそれを天[てん]に向[む]かってまき散[ち]らした。すると、人[ひと]にも家畜[かちく]にも、うみの出[で]る腫[は]れ物[もの]ができた。"
  11: "呪術師[じゅじゅつし]たちは腫[は]れ物[もの]のためにモーセの前[まえ]に立[た]つことができなかった。腫[は]れ物[もの]は呪術師[じゅじゅつし]たちにも、エジプトの全土[ぜんど]にも及[およ]んだからである。"
  12: "主[しゅ]はファラオの心[こころ]を頑[かたくな]にされ、ファラオは彼[かれ]らに聞[き]き従[したが]わなかった。主[しゅ]がモーセに言[い]われたとおりである。"
  13: "主[しゅ]はモーセに言[い]われた。「明日[あした]の朝[あさ]、早[はや]く起[き]て、ファラオの前[まえ]に立[た]ち、彼[かれ]に言[い]いなさい。『ヘブライ人[じん]の神[かみ]である主[しゅ]がこう言[い]われる。わたしの民[たみ]を去[さ]らせて、わたしに仕[つか]えさせよ。"
  14: "わたしは今[いま]この時[とき]、わたしの災[わざわ]いをことごとく、あなたの心[こころ]と、あなたの家来[けらい]たちと民[たみ]の心[こころ]に送[おく]る。それは、全[ぜん]地[ち]にわたしに似[に]た者[もの]はほかにいないことを、あなたが知[し]るためである。"
  15: "わたしが今[いま]、手[て]を伸[の]ばしてあなたとあなたの民[たみ]を疫病[えきびょう]で打[う]てば、あなたは地[ち]から断[た]ち滅[ほろ]ぼされる。"
  16: "しかし、あなたを生[い]かしておいたのは、わたしの力[ちから]をあなたの上[うえ]に示[しめ]し、わたしの名[な]が全[ぜん]地[ち]に告[つ]げ知[し]らされるためである。"
  17: "あなたはなおも、わたしの民[たみ]を去[さ]らせまいとして、彼[かれ]らに立[た]ち向[む]かっている。"
  18: "見[み]よ、わたしは明日[あした]のこの時刻[じこく]に、非常[ひじょう]に激[はげ]しい雹[ひょう]を降[ふ]らせる。エジプトが建[た]てられてから今日[こんにち]まで、このような雹[ひょう]はなかった。"
  19: "今[いま]、すぐに人[ひと]を遣[つか]わして、あなたの家畜[かちく]と、野[の]にあるすべてのものを集[あつ]めなさい。人[ひと]でも家畜[かちく]でも、野[の]に残[のこ]って家[いえ]に入[はい]らない者[もの]の上[うえ]には、雹[ひょう]が降[ふ]りかかって死[し]ぬ。』」"
  20: "ファラオの家来[けらい]たちのうち、主[しゅ]の言葉[ことば]を恐[おそ]れた者[もの]は、自分[じぶん]の家畜[かちく]を家[いえ]に集[あつ]めた。"
  21: "しかし、主[しゅ]の言葉[ことば]に心[こころ]を留[と]めない者[もの]は、自分[じぶん]の家畜[かちく]を野[の]に残[のこ]した。"
  22: "主[しゅ]はモーセに言[い]われた。「あなたの手[て]を天[てん]に向[む]かって伸[の]ばしなさい。すると、雹[ひょう]がエジプトの全土[ぜんど]に降[ふ]り、人[ひと]にも家畜[かちく]にも、地[ち]のすべての草[くさ]にも降[ふ]りかかる。」"
  23: "モーセは手[て]を天[てん]に向[む]かって伸[の]ばした。すると、主[しゅ]は雷[かみなり]をとどろかせ、雹[ひょう]を降[ふ]らせ、火[ひ]が地[ち]の上[うえ]を走[はし]った。主[しゅ]はエジプトの全土[ぜんど]に雹[ひょう]を降[ふ]らせた。"
  24: "雹[ひょう]の中[なか]には火[ひ]があり、激[はげ]しく燃[も]えていた。その雹[ひょう]は非常[ひじょう]に激[はげ]しく、エジプトに民[たみ]が住[す]むようになってから、このようなものはなかった。"
  25: "雹[ひょう]はエジプトの全土[ぜんど]で、人[ひと]から家畜[かちく]に至[いた]るまですべてを打[う]ち、野[の]のすべての草[くさ]を打[う]ち、野[の]のすべての木[き]を折[お]った。"
  26: "ただ、イスラエルの子[こ]らがいるゴシェンの地[ち]には、雹[ひょう]は降[ふ]らなかった。"
  27: "ファラオは人[ひと]を遣[つか]わしてモーセとアロンを呼[よ]び、彼[かれ]らに言[い]った。「今[いま]この度[たび]は、わたしが罪[つみ]を犯[おか]した。主[しゅ]は正[ただ]しく、わたしとわたしの民[たみ]は悪[わる]い。"
  28: "主[しゅ]に祈[いの]ってくれ。神[かみ]の雷[かみなり]と雹[ひょう]と火[ひ]が、もうやむように。わたしはあなたがたを去[さ]らせる。もう長[なが]く引[ひ]き止[と]めはしない。」"
  29: "モーセは彼[かれ]に言[い]った。「わたしがこの町[まち]を出[で]たら、主[しゅ]に向[む]かって手[て]を広[ひろ]げます。雷[かみなり]はやみ、雹[ひょう]も雨[あめ]も、もう降[ふ]らないでしょう。あなたは、地[ち]が主[しゅ]のものであることを知[し]るでしょう。"
  30: "ただし、あなたとあなたの家来[けらい]たちが、まだ主[しゅ]を恐[おそ]れていないことは、わたしが知[し]っています。」"
  31: "亜麻[あま]と大麦[おおむぎ]は打[う]たれた。大麦[おおむぎ]は穂[ほ]を出[だ]し、亜麻[あま]は実[み]を結[むす]んでいたからである。"
  32: "小麦[こむぎ]と二粒小麦[ふたつぶこむぎ]⟨小麦[こむぎ]の一種[いっしゅ]で、熟[じゅく]すのが遅[おそ]い穀物[こくもつ]。⟩は打[う]たれなかった。これらは遅[おそ]い作物[さくもつ]であったからである。"
  33: "モーセはファラオのところを離[はな]れ、町[まち]の外[そと]へ出[で]て、主[しゅ]に向[む]かって手[て]を広[ひろ]げた。すると、雷[かみなり]と雹[ひょう]はやみ、雨[あめ]はもう地[ち]に降[ふ]らなかった。"
  34: "ファラオは、雨[あめ]と雹[ひょう]と雷[かみなり]がやんだのを見[み]て、またも罪[つみ]を犯[おか]し、自分[じぶん]の心[こころ]を重[おも]くした。彼[かれ]もその家来[けらい]たちも同[おな]じだった。"
  35: "ファラオの心[こころ]は頑[かたくな]になり、彼[かれ]はイスラエルの子[こ]らを去[さ]らせなかった。主[しゅ]がモーセに言[い]われたとおりである。"

notes:
  1: "Τάδε λέγει κύριος — так говорит Господь. ἵνα μοι λατρεύσωσιν — чтобы послужили Мне."
  2: "εἰ μὲν οὖν μὴ βούλει — если не хочешь. ἐγκρατεῖς αὐτοῦ — удерживаешь его (ἐγκρατής)."
  3: "χεὶρ κυρίου ἐπέσται — рука Господня будет (ἐφίημι). ἵπποι, ὑποζύγια, κάμηλοι, βόες, πρόβατα — кони, ослы, верблюды, волы, овцы. θάνατος μέγας σφόδρα — весьма великая смерть; передано 疫病[えきびょう]."
  4: "παραδοξάσω — сотворю дивное, отделю. ῥητόν — букв. «определённое, названное», здесь в смысле «ни одного»."
  5: "ὅρον — предел, срок (ὅρος). τὸ ῥῆμα — слово, дело."
  6: "τῇ ἐπαύριον — на следующий день. ἐτελεύτησεν — вымер."
  7: "ἐβαρύνθη — отягчилось. οὐκ ἐξαπέστειλεν — не отпустил. В МТ и Синодальном фараон сначала «послал узнать»; в LXX этого нет."
  8: "αἰθάλη καμιναίας — сажа, пепел печи (καμινία — печь). πλήρεις τὰς χεῖρας — полные горсти. πασάτω — пусть рассыплет (πάσσω)."
  9: "κονιορτός — пыль. ἕλκη — язвы. φλυκτίδες ἀναζέουσαι — вскипающие пузыри, нарывы; отсюда うみの出[で]る腫[は]れ物[もの]."
  10: "ἔπασεν — рассыпал. ἐγένετο ἕλκη — появились язвы."
  11: "οἱ φαρμακοί — чародеи, зельевары (呪術師[じゅじゅつし]; здесь не ἐπαοιδοί). στῆναι — устоять."
  12: "ἐσκλήρυνεν κύριος — Господь ожесточил (актив, субъект — Бог). καθὰ συνέταξεν — как повелел."
  13: "Ὄρθρισον τὸ πρωί — встань рано утром."
  14: "συναντήματα — встречи, бедствия (слав. «казни»). ἵν εἰδῇς — чтобы ты узнал (ἵνα с элизией). οὐκ ἔστιν ὡς ἐγὼ ἄλλος — нет подобного Мне."
  15: "ἀποστείλας τὴν χεῖρα — простёрши руку. ἐκτριβήσῃ — будешь истреблён. Греч. форма — причастие с будущим; по смыслу несостоявшееся, ср. ст. 16."
  16: "διετηρήθης — был сохранён (διατηρέω). ἐνδείξωμαι — покажу. διαγγελῇ — будет возвещено."
  17: "ἐμποιῇ — упорствуешь, противишься (ἐμποιέω)."
  18: "ὕω — лью дождём. χάλαζα — град. ἀφ᾿ ἧς ἡμέρας ἔκτισται — с того дня, как основан."
  19: "κατάσπευσον — поспеши. ἐν τῷ πεδίῳ — в поле. πέσῃ — упадёт."
  20: "ὁ φοβούμενος τὸ ῥῆμα — убоявшийся слова. συνήγαγεν — собрал."
  21: "μὴ προσέσχεν τῇ διανοίᾳ — не обратил внимания (προσέχω). ἀφῆκεν — оставил."
  22: "Ἔκτεινον τὴν χεῖρα — простри руку. βοτάνη — трава, зелень."
  23: "φωνάς — голоса, т. е. громы. διέτρεχεν τὸ πῦρ — огонь бежал, разливался."
  24: "φλογίζον — пылающий. σφόδρα σφόδρα — весьма, весьма. ἀφ᾿ οὗ γεγένηται ἔθνος — с тех пор, как появился народ."
  25: "ἀπὸ ἀνθρώπου ἕως κτήνους — от человека до скота. συνέτριψεν — сокрушил."
  26: "Γεσεμ — ゴシェン. πλὴν — только."
  27: "Ἡμάρτηκα τὸ νῦν — согрешил я в этот раз. δίκαιος — праведен. ἀσεβεῖς — нечестивы, виновны."
  28: "παυσάσθω — пусть прекратится. φωνὰς θεοῦ — громы Божии. οὐκέτι προσθήσεσθε μένειν — больше не будете медлить."
  29: "ἐκπετάσω τὰς χεῖρας — простру руки. τοῦ κυρίου ἡ γῆ — Господня земля."
  30: "ἐπίσταμαι — знаю. οὐδέπω πεφόβησθε — ещё не убоялись."
  31: "τὸ λίνον — лён. κριθή — ячмень. ἐπλήγη — поражён. παρεστηκυῖα — стоящий с колосом (о ячмене). σπερματίζον — дающий семя (о льне)."
  32: "ὁ πυρός — пшеница. ὄλυρα — эммер, двузернянка (二粒小麦[ふたつぶこむぎ]). ὄψιμα — поздние."
  33: "ἐξεπέτασεν — простёр. ἐπαύσαντο — прекратились. οὐκ ἔσταξεν — не капал."
  34: "προσέθετο τοῦ ἁμαρτάνειν — продолжал грешить (προστίθημι). ἐβάρυνεν — отягчил."
  35: "ἐσκληρύνθη — ожесточилось (пассив). καθάπερ ἐλάλησεν κύριος τῷ Μωυσῇ — как говорил Господь Моисею."
