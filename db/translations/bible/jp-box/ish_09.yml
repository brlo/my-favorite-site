# jp-box, Исход, глава 9. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru).
# jp-joc в этой главе отсутствует; ru (с масоретского) — только для понимания, не источник.
# Язык — современный 常体, порядок членов и деление на клаузы — по греческому.
# Глава 9: пятая казнь — мор на скот (1–7), шестая — воспаление с нарывами (8–12),
# седьмая — град (13–35).
# Красного и синего нет: говорит Бог, но это не прямая речь Христа во плоти; «<j>» не ставится.
# Кавычки: речь Бога — 「…」 (1–4, 5, 8–9, 13–19, 22); слово Господа в устах Моисея —
# 『…』 (1–4, 13–19); речь фараона — 「…」 (27–28); речь Моисея — 「…」 (29–30).
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено по базе); отличия csl/МТ — в notes.
# 9:3 — θάνατος μέγας, «великая смерть»; передано 疫病[えきびょう] (пятая казнь).
# 9:7 — в МТ и Синодальном фараон «послал узнать»; в LXX этого нет, не вносим.
# 9:15 — в греч. причастие с будущим (ἀποστείλας… πατάξω… ἐκτριβήσῃ); по смыслу —
# несостоявшееся, ср. 9:16; в переводе условная форма.
# 9:23 — φωνάς, букв. «голоса», т. е. громы.
# Сноска ⟨…⟩ одна: 9:32 二粒小麦[ふたつぶこむぎ] — первое место в корпусе.
# jp-ni не использовался.

