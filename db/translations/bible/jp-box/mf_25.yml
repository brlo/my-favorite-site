verses:
  1: "「<j>そのとき、天[てん]の国[くに]は、ともし火[び]を手[て]に取[と]って、花婿[はなむこ]を迎[むか]えに出[で]て行[い]く十人[じゅうにん]の処女[しょじょ]に似[に]ている。</j>"
  2: "<j>彼[かれ]らのうち、愚[おろ]かな者[もの]と賢[かしこ]い者[もの]が五[ご]人[にん]ずついた。</j>"
  3: "<j>愚[おろ]かな者[もの]たちは、ともし火[び]を手[て]に取[と]ったものの、自分[じぶん]たちと一緒[いっしょ]に油[あぶら]を持[も]って行[い]かなかった。</j>"
  4: "<j>賢[かしこ]い者[もの]たちは、油[あぶら]を器[うつわ]に入[い]れて、ともし火[び]と一緒[いっしょ]に持[も]って行[い]った。</j>"
  5: "<j>花婿[はなむこ]が遅[おそ]れているうちに、処女[しょじょ]たちはみなうとうとし、そのまま眠[ねむ]ってしまった。</j>"
  6: "<j>夜中[よなか]に、『見[み]よ、花婿[はなむこ]だ。迎[むか]えに出[で]なさい』という叫[さけ]びが起[こ]こった。</j>"
  7: "<j>そのとき、あの処女[しょじょ]たちはみな起[お]き上[あ]がり、自分[じぶん]たちのともし火[び]を整[ととの]えた。</j>"
  8: "<j>愚[おろ]かな者[もの]たちが賢[かしこ]い者[もの]たちに言[い]った。『あなたがたの油[あぶら]を、わたしたちに少[すこ]し分[わ]けてほしい。わたしたちのともし火[び]が消[き]えかかっているのだ。』</j>"
  9: "<j>賢[かしこ]い者[もの]たちは答[こた]えて言[い]った。『わたしたちとあなたがたの分[ぶん]を合[あ]わせると、足[た]りなくなるかもしれない。売[う]る者[もの]たちのところへ行[い]って、自分[じぶん]たちのために買[か]って来[き]なさい。』</j>"
  10: "<j>買[か]いに出[で]かけて行[い]く途中[とちゅう]で、花婿[はなむこ]が来[き]た。支度[したく]のできていた者[もの]たちは彼[かれ]と一緒[いっしょ]に婚宴[こんえん]の席[せき]へ入[はい]り、戸[と]は閉[と]ざされた。</j>"
  11: "<j>遅[おく]れて、残[のこ]りの処女[しょじょ]たちも来[き]て、『主[しゅ]よ、主[しゅ]よ、わたしたちに開[あ]けてください』と言[い]った。</j>"
  12: "<j>彼[かれ]は答[こた]えた。『はっきり言[い]っておく。わたしはあなたがたを知[し]らない。』</j>"
  13: "<j>だから、目[め]を覚[さ]ましていなさい。あなたがたは、人[ひと]の子[こ]が来[く]るその日[ひ]もその時[とき]も、知[し]るよしもないのだから。</j>」"
  14: "「<j>天[てん]の国[くに]は、旅[たび]に出[で]る人[ひと]が、自分[じぶん]の僕[しもべ]たちを呼[よ]んで、自分[じぶん]の財産[ざいさん]を彼[かれ]らに託[たく]したのに似[に]ている。</j>"
  15: "<j>ある者[もの]には五[ご]タラント、ある者[もの]には二[に]タラント、ある者[もの]には一[いち]タラントを、それぞれの力[ちから]に応[おう]じて与[あた]え、そしてすぐに旅[たび]立[だ]った。</j>"
  16: "<j>五[ご]タラントを受[う]け取[と]った者[もの]は、行[い]ってそれで商[あきな]いをし、ほかに五[ご]タラントをもうけた。</j>"
  17: "<j>二[に]タラントを受[う]け取[と]った者[もの]も、同[おな]じように、さらに二[に]タラントを増[ふ]やした。</j>"
  18: "<j>ところが、一[いち]タラントを受[う]け取[と]った者[もの]は、出[で]て行[い]って地面[じめん]を掘[ほ]り、主人[しゅじん]の銀[ぎん]を隠[かく]してしまった。</j>"
  19: "<j>長[なが]い時[とき]がたって、その僕[しもべ]たちの主人[しゅじん]が帰[かえ]って来[き]て、彼[かれ]らと清算[せいさん]をした。</j>"
  20: "<j>五[ご]タラントを受[う]け取[と]った者[もの]が近[ちか]づいて来[き]て、ほかに五[ご]タラントを差[さ]し出[だ]して言[い]った。『主[しゅ]よ、あなたはわたしに五[ご]タラントを託[たく]されました。ご覧[らん]ください、わたしはほかに五[ご]タラントをもうけました。』</j>"
  21: "<j>主人[しゅじん]は彼[かれ]に言[い]った。『よくやった、良[よ]い忠実[ちゅうじつ]な僕[しもべ]よ。あなたは小[ちい]さいことによく忠実[ちゅうじつ]だった。わたしはあなたに多[おお]くのことを任[まか]せよう。主人[しゅじん]の喜[よろこ]びに入[はい]りなさい。』</j>"
  22: "<j>二[に]タラントを受[う]け取[と]った者[もの]も近[ちか]づいて来[き]て言[い]った。『主[しゅ]よ、あなたはわたしに二[に]タラントを託[たく]されました。ご覧[らん]ください、わたしはほかに二[に]タラントをもうけました。』</j>"
  23: "<j>主人[しゅじん]は彼[かれ]に言[い]った。『よくやった、良[よ]い忠実[ちゅうじつ]な僕[しもべ]よ。あなたは小[ちい]さいことによく忠実[ちゅうじつ]だった。わたしはあなたに多[おお]くのことを任[まか]せよう。主人[しゅじん]の喜[よろこ]びに入[はい]りなさい。』</j>"
  24: "<j>一[いち]タラントを受[う]け取[と]った者[もの]も近[ちか]づいて来[き]て言[い]った。『主[しゅ]よ、あなたが厳[きび]しい人[ひと]であり、蒔[ま]かなかった所[ところ]で刈[か]り取[と]り、散[ち]らさなかった所[ところ]で集[あつ]めることを、わたしは知[し]っております。</j>"
  25: "<j>それで恐[おそ]れて、出[で]て行[い]って、あなたのタラントを地[ち]の中[なか]に隠[かく]しました。ご覧[らん]ください、あなたのものはここにあります。』</j>"
  26: "<j>主人[しゅじん]は答[こた]えて言[い]った。『悪[わる]い怠[なま]け者[もの]の僕[しもべ]よ。あなたは、わたしが蒔[ま]かなかった所[ところ]で刈[か]り取[と]り、散[ち]らさなかった所[ところ]で集[あつ]めることを知[し]っていたのだな。</j>"
  27: "<j>それなら、わたしの銀[ぎん]を両替商[りょうがえしょう]に預[あず]けておくべきだった。そうすれば、わたしが帰[かえ]って来[き]たときに、利息[りそく]をつけて、わたしのものを受[う]け取[と]れたのに。</j>"
  28: "<j>だから、そのタラントを彼[かれ]から取[と]り上[あ]げ、十[じゅう]タラントを持[も]っている者[もの]に渡[わた]しなさい。</j>"
  29: "<j>だれでも、持[も]っている者[もの]には、さらに与[あた]えられてありあまるようになる。しかし、持[も]たない者[もの]は、持[も]っているものさえも奪[うば]い取[と]られる。</j>"
  30: "<j>そして、役[やく]に立[た]たない僕[しもべ]を外[そと]の暗[くら]がりに放[ほう]り出[だ]しなさい。そこでは泣[な]きわめきと歯[は]ぎしりがある。』</j>」"
  31: "「<j>人[ひと]の子[こ]が、その栄光[えいこう]のうちに、すべての天使[てんし]たちとともに来[く]るとき、そのとき、その栄光[えいこう]の座[ざ]に着[つ]く。</j>"
  32: "<j>すべての民[たみ]が彼[かれ]の前[まえ]に集[あつ]められ、彼[かれ]は、羊飼[ひつじか]いが羊[ひつじ]とやぎを分[わ]けるように、彼[かれ]らを互[たがい]に分[わ]ける。</j>"
  33: "<j>そして、羊[ひつじ]を自分[じぶん]の右[みぎ]に、やぎを左[ひだり]に置[お]く。</j>"
  34: "<j>そのとき、王[おう]は右[みぎ]にいる者[もの]たちに言[い]う。『さあ、わたしの父[ちち]によって祝福[しゅくふく]された者[もの]たちよ、世[よ]の創[はじ]めからあなたがたのために備[そな]えられた国[くに]を受[う]け継[つ]ぎなさい。</j>"
  35: "<j>わたしは飢[う]えていたのに、あなたがたは食[た]べさせてくれ、渇[かわ]いていたのに、飲[の]ませてくれ、旅人[たびびと]だったのに、宿[やど]らせてくれ、</j>"
  36: "<j>裸[はだか]だったのに、着[き]せてくれ、病[や]んでいたのに、見舞[みま]ってくれ、牢[ろう]にいたのに、わたしのところへ来[き]てくれた。』</j>"
  37: "<j>そのとき、正[ただ]しい人[ひと]たちが彼[かれ]に答[こた]えて言[い]う。『主[しゅ]よ、わたしたちはいつ、あなたが飢[う]えているのを見[み]て食[た]べさせ、渇[かわ]いているのを見[み]て飲[の]ませましたか。</j>"
  38: "<j>いつ、あなたが旅人[たびびと]であるのを見[み]て宿[やど]らせ、裸[はだか]であるのを見[み]て着[き]せましたか。</j>"
  39: "<j>いつ、あなたが病[や]んでいるのを、また牢[ろう]にいるのを見[み]て、あなたのところへ行[い]きましたか。』</j>"
  40: "<j>王[おう]は答[こた]えて言[い]う。『はっきり言[い]っておく。わたしの兄弟[きょうだい]であるこの最[もっと]も小[ちい]さい者[もの]たちの一人[ひとり]にしたことは、このわたしにしたことにほかならない。』</j>"
  41: "<j>そのとき、王[おう]はまた、左[ひだり]にいる者[もの]たちに言[い]う。『呪[のろ]われた者[もの]たちよ、わたしから離[はな]れて、悪魔[あくま]とその使[つか]いたちのために備[そな]えられた永遠[えいえん]の火[ひ]に入[はい]りなさい。</j>"
  42: "<j>わたしは飢[う]えていたのに、あなたがたは食[た]べさせてくれず、渇[かわ]いていたのに、飲[の]ませてくれず、</j>"
  43: "<j>旅人[たびびと]だったのに、宿[やど]らせてくれず、裸[はだか]だったのに、着[き]せてくれず、病[や]んでいるのにも、牢[ろう]にいるのにも、見舞[みま]ってくれなかった。』</j>"
  44: "<j>そのとき、彼[かれ]らも答[こた]えて言[い]う。『主[しゅ]よ、わたしたちはいつ、あなたが飢[う]えたり渇[かわ]いたり、旅人[たびびと]であったり、裸[はだか]であったり、病[や]んだり、牢[ろう]にいたりするのを見[み]て、お仕[つか]えしなかったでしょうか。』</j>"
  45: "<j>そのとき、王[おう]は彼[かれ]らに答[こた]えて言[い]う。『はっきり言[い]っておく。これらの最[もっと]も小[ちい]さい者[もの]たちの一人[ひとり]にしなかったことは、わたしにしなかったことにほかならない。』</j>"
  46: "<j>こうして、彼[かれ]らは永遠[えいえん]の罰[ばつ]へ、正[ただ]しい人[ひと]たちは永遠[えいえん]の命[いのち]へ去[さ]って行[い]く。</j>」"

notes:
  1: "ὁμοιωθήσεται — «уподобится»; передал 似ている, как в притчах гл. 13. ἐξῆλθον εἰς ὑπάντησιν — «вышли навстречу»; 迎えに出て行く."
  2: "μωραί / φρόνιμοι — «глупые» / «разумные»; 愚か／賢い, без смягчения. ἐξ αὐτῶν — «из них»; 彼らのうち. Перечисление «пять… и пять…» передано как 五人ずつ: по-японски не повторяется 五人 дважды подряд."
  3: "γάρ — связка с 2; передана оборотом «…たものの» (причина, почему их назвали глупыми)."
  5: "χρονίζοντος — genitive absolutus «пока жених медлил»; ἐνύσταξαν (задремали) и ἐκάθευδον (спали, имперфект) переданы двумя глаголами."
  6: "В византийском тексте сайта при ὁ νυμφίος нет ἔρχεται (в RP/TR, Елизаветинской и jp-joc — «вот жених идёт»); передал восклицание без глагола: 見よ、花婿だ. Возглас — в 『』."
  8: "σβέννυνται — настоящее «гаснут»; 消えかかっている. Просьба дев — в 『』."
  9: "μήποτε — «как бы не»; сохранил как опасение 足りなくなるかもしれない, не сглаживал до прямого отказа."
  10: "εἰς τοὺς γάμους — «на брачный пир»; 婚宴, как в 9:15. αἱ ἕτοιμοι — «готовые»; 支度のできていた者たち. ἐκλείσθη — страдательный, 戸は閉ざされた."
  11: "ὕστερον — «после»; 遅れて. ἔρχονται — исторический презенс, передан прошедшим."
  12: "Спорное место: «аминь» в устах жениха. Жених в притче — Христос, поэтому оставил формулу はっきり言っておく, как у Христа (5:18; 13:17). οὐκ οἶδα ὑμᾶς — 知らない, без смягчений (ср. Лк 13:25)."
  13: "В критическом тексте сайта нет «ἐν ᾗ ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεται»; в RP/TR, Елизаветинской и jp-joc есть. Включил по церковному чтению, без 〔〕: это разночтение, а не смысловая добавка (ср. 13:35)."
  14: "Ὥσπερ γάρ продолжает 13; βασιλεία прямо не названа. Подлежащее 天の国 добавлено для японского синтаксиса, иначе притча повисает без темы."
  15: "εὐθέως в византийском стоит в конце 15 (в критическом — в начале 16), поэтому «すぐに» отнесено к уходу хозяина. τὰ ὑπάρχοντα — 財産. κατὰ τὴν ἰδίαν δύναμιν — それぞれの力に応じて. Здесь первое место タラント в книге — сноска; в 18-й главе (10 000 талантов) повторно ставить не нужно."
  16: "ἠργάσατο ἐν αὐτοῖς — «поработал ими / пустил их в оборот»; 商いをして."
  18: "ὤρυξεν γῆν — «выкопал землю»; 地面を掘り. ἀργύριον — «серебро, деньги»; 銀."
  19: "συναίρει λόγον — «сводит счёт»; 清算. Исторический презенс ἔρχεται/συναίρει передан прошедшим, как в остальных главах."
  21: "ἐπὶ ὀλίγα ἦς πιστός — «в малом был верен»; 小さいことによく忠実. εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου — 主人の喜びに入りなさい, буквально."
  24: "σκληρός — «жёсткий, суровый»; 厳しい. Причастия θερίζων… συνάγων переданы как описание постоянного поведения."
  26: "ὀκνηρέ — «ленивый»; 怠け者. ᾔδεις — «ты знал»; вопрос в греческом (ᾔδεις…;) передан утверждением с な, без сглаживания."
  27: "τραπεζίταις — «менялам, банкирам»; 両替商 (сноску не ставил: слово понятно). ἐκομισάμην ἂν σὺν τόκῳ — «получил бы своё с процентами»; 利息."
  29: "περισσευθήσεται — «будет в избытке»; ありあまるようになる, чтобы не повторять 13:12 дословно."
  30: "Вложенность с 26: речь Христа 「」 → речь господина 『』 (26–30); парность проверена. ἀχρεῖον — «негодный»; 役に立たない. σκότος ἐξώτερον — 外の暗がり, как в 8:12."
  31: "δόξα дважды (ἐν τῇ δόξῃ αὐτοῦ, θρόνου δόξης αὐτοῦ) — сохранены оба раза. καθίσει — 座に着く."
  32: "πάντα τὰ ἔθνη — «все народы»; すべての民, не «язычники». ἀφοριεῖ ἀπ' ἀλλήλων — 互いに分ける; πρόβατα/ἔριφια — 羊／やぎ."
  34: "εὐλογημένοι τοῦ πατρός μου — «благословенные Отца Моего»; 父によって祝福された者たち. ἀπὸ καταβολῆς κόσμου — 世の創めから, как в 13:35."
  36: "ἐπεσκέψασθέ με — «посетили Меня»; 見舞ってくれ. φυλακή — 牢 (не «тюрьма» как учреждение)."
  40: "τῶν ἀδελφῶν μου τῶν ἐλαχίστων — «меньших братьев Моих»; множественное сохранено: 最も小さい者たちの一人. ἐμοὶ ἐποιήσατε — このわたしにしたことにほかならない (чтобы не совпасть с привычной формулой)."
  41: "В критическом тексте οἱ при κατηραμένοι в квадратных скобках — это разночтение, не церковная добавка, поэтому 〔〕 не ставил. τοῖς ἀγγέλοις αὐτοῦ — その使いたち (ангелы дьявола), чтобы не смешивать с 天使 Божиими."
  44: "διακονήσαμεν — «послужили»; お仕えする. Перечисление в вопросе сохранено без сокращения."
  45: "Здесь, в отличие от 40, нет μου τῶν ἀδελφῶν — просто «этих меньших»; これらの最も小さい者たち, без добавления «братьев»."
  46: "κόλασιν αἰώνιον / ζωὴν αἰώνιον — 永遠の罰 / 永遠の命; симметрия и порядок сохранены. ἀπελεύσονται — 去って行く."
