# jp-box, Соборное послание Иакова, глава 2. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 2: лицеприятие в собрании (1–4), Бог избрал бедных (5–7), царский закон
# любви и вина перед всем законом (8–13), вера и дела (14–26).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет.
# Цитаты Писания в 「…」: 2:8 (Лев 19:18), 2:11 (Исх 20:14.13), 2:23 (Быт 15:6);
# продолжение 2:23 «и назван другом Божиим» — не из Быт 15:6 (ср. Ис 41:8; 2 Пар 20:7),
# поэтому стоит вне 「」.
# 〔…〕 в главе нет: все слова в базе gr-lxx-byz есть (проверено по базе).
# Сносок ⟨…⟩ нет: 会堂, 律法, 遊女 уже встречались в корпусе. jp-ni не использовался.

tr_code: jp-box
