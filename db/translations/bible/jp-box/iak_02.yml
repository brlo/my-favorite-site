chapter: 2
draft: true

verses:
  1: "わたしの兄弟[きょうだい]たちよ。栄光[えいこう]の主[しゅ]イエス・キリストに対[たい]する信仰[しんこう]を、人[ひと]を分[わ]け隔[へだ]てして持[も]ってはならない。"
  2: "というのは、あなたがたの会堂[かいどう]に、金[きん]の指輪[ゆびわ]をはめ、立派[りっぱ]な服[ふく]を着[き]た人[ひと]が入[はい]って来[き]て、また、汚[きたな]い服[ふく]を着[き]た貧[まず]しい人[ひと]も入[はい]って来[き]たとき、"
  3: "立派[りっぱ]な服[ふく]を着[き]ている人[ひと]に目[め]を留[と]めて、「あなたはここに、よい所[ところ]に座[すわ]りなさい」と言[い]い、貧[まず]しい人[ひと]には、「あなたはそこに立[た]っていなさい。そうでなければ、わたしの足台[あしだい]の下[した]に座[すわ]りなさい」と言[い]うなら、"
  4: "あなたがたは自分[じぶん]たちの間[あいだ]で分[わ]け隔[へだ]てをし、悪[あく]い思[おも]いを抱[いだ]く審判者[しんぱんしゃ]となったのではないか。"
  5: "わたしの愛[あい]する兄弟[きょうだい]たちよ、聞[き]きなさい。神[かみ]は、この世[よ]で貧[まず]しい者[もの]たちを選[えら]んで、信仰[しんこう]に富[と]む者[もの]とし、ご自身[じしん]を愛[あい]する者[もの]たちに約束[やくそく]された御国[みくに]の相続者[そうぞくしゃ]とされたのではないか。"
  6: "しかし、あなたがたは貧[まず]しい人[ひと]を辱[はずかし]めた。富[とみ]む者[もの]たちこそ、あなたがたを虐[しいた]げ、あなたがたを法廷[ほうてい]に引[ひ]きずり込[こ]んでいるではないか。"
  7: "その人[ひと]たちは、あなたがたの上[うえ]に唱[とな]えられた良[よ]い名[な]を冒涜[ぼうとく]しているではないか。"
  8: "とはいえ、あなたがたが聖書[せいしょ]に従[したが]って、「あなたの隣人[となりびと]を自分[じぶん]のように愛[あい]せよ」という王[おう]の律法[りっぽう]を守[まも]っているなら、よくしているのである。"
  9: "しかし、人[ひと]を分[わ]け隔[へだ]てするなら、あなたがたは罪[つみ]を行[おこな]い、律法[りっぽう]によって、違反者[いはんしゃ]として責[せ]められるのである。"
  10: "というのは、律法[りっぽう]を全[すべ]て守[まも]っても、一[ひと]つでもつまずくなら、その人[ひと]はすべての点[てん]で責[せ]めを負[お]う者[もの]となったからである。"
  11: "というのは、「姦淫[かんいん]するな」と言[い]われた方[かた]は、「殺[ころ]すな」とも言[い]われたからである。しかし、あなたがたが姦淫[かんいん]をしなくても、人[ひと]を殺[ころ]すなら、あなたがたは律法[りっぽう]の違反者[いはんしゃ]となったのである。"
  12: "自由[じゆう]の律法[りっぽう]によって裁[さば]かれる者[もの]として、そのように語[かた]り、そのように行[おこな]いなさい。"
  13: "というのは、あわれみを行[おこな]わなかった者[もの]には、あわれみのない裁[さば]きがあるからである。あわれみは、裁[さば]きに打[う]ち勝[か]つ。"
  14: "わたしの兄弟[きょうだい]たちよ、自分[じぶん]には信仰[しんこう]があると言[い]いながら、行[おこな]いがなければ、何[なん]の益[えき]があるだろうか。その信仰[しんこう]は、その人[ひと]を救[すく]えるだろうか。"
  15: "もし、兄弟[きょうだい]や姉妹[しまい]が着[き]る物[もの]もなく、その日[ひ]の食[た]べ物[もの]にも事欠[ことか]いているのに、"
  16: "あなたがたのうちの何人[なんぴと]かが、「平安[へいわ]のうちに行[い]きなさい。暖[あたた]かくし、腹[はら]を満[み]たしなさい」と言[い]っても、体[からだ]に必要[ひつよう]なものは与[あた]えないなら、何[なん]の益[えき]があるだろうか。"
  17: "このように、信仰[しんこう]も、行[おこな]いがなければ、それだけでは死[し]んだものである。"
  18: "しかし、だれかが言[い]うだろう。「あなたには信仰[しんこう]があり、わたしには行[おこな]いがある。行[おこな]いのないあなたの信仰[しんこう]を、わたしに見[み]せてほしい。わたしは、自分[じぶん]の行[おこな]いによって、自分[じぶん]の信仰[しんこう]をあなたに見[み]せよう」と。"
  19: "あなたは、神[かみ]が一[ひと]つであると信[しん]じている。それでよい。悪霊[あくりょう]たちも信[しん]じて、震[ふる]えているのである。"
  20: "空[むな]しい人[ひと]よ、行[おこな]いのない信仰[しんこう]が役[やく]に立[た]たないことを、あなたは知[し]りたいのか。"
  21: "わたしたちの父[ちち]アブラハムは、その子[こ]イサクを祭壇[さいだん]にささげたとき、行[おこな]いによって義[ぎ]とされたのではないか。"
  22: "あなたに見[み]えているとおり、信仰[しんこう]は彼[かれ]の行[おこな]いとともに働[はたら]き、行[おこな]いによって信仰[しんこう]が全[まっと]うされたのである。"
  23: "こうして、「アブラハムは神[かみ]を信[しん]じた。そのことが彼[かれ]の義[ぎ]と認[みと]められた」という聖書[せいしょ]の言葉[ことば]が成就[じょうじゅ]したのである。そして、彼[かれ]は神[かみ]の友[とも]と呼[よ]ばれた。"
  24: "よくわきまえなさい。人[ひと]は行[おこな]いによって義[ぎ]とされるのであって、信仰[しんこう]だけによるのではない。"
  25: "同じように、遊女[ゆうじょ]ラハブも、使者[ししゃ]たちを迎[むか]え入[い]れ、別[べつ]の道[みち]から送[おく]り出[だ]したとき、行[おこな]いによって義[ぎ]とされたのではないか。"
  26: "というのは、霊[れい]のない体[からだ]が死[し]んでいるように、行[おこな]いのない信仰[しんこう]も死[し]んでいるからである。"

notes:
  1: "μὴ ἐν προσωπολημψίαις ἔχετε τὴν πίστιν — 人を分け隔てして信仰を持ってはならない (προσωπολημψία — лицеприятие, букв. «принятие лица», ср. Рим 2:11; Еф 6:9). τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τῆς δόξης — 栄光の主イエス・キリスト (род. качества: «Господа славы»; порядок имён как в базе)."
  2: "συναγωγὴν ὑμῶν — 会堂 (συναγωγή — собрание; в корпусе переводится 会堂). χρυσοδακτύλιος — 金の指輪をはめた (букв. «златоперстный»). ἐν ἐσθῆτι λαμπρᾷ — 立派な服 (λαμπρός — светлый, блестящий, нарядный). πτωχὸς ἐν ῥυπαρᾷ ἐσθῆτι — 汚い服を着た貧しい人 (ῥυπαρός — грязный, ср. 1:21 ῥυπαρία)."
  3: "Σὺ κάθου ὧδε καλῶς — 「あなたはここに、よい所に座りなさい」 (καλῶς — хорошо, удобно; jp-joc 善き處に坐れ). στῆθι ἢ κάθου ἐκεῖ ὑπὸ τὸ ὑποπόδιόν μου — 「そこに立っていなさい。そうでなければ、わたしの足台の下に座りなさい」 (ὑποπόδιον — подножие, ср. Мф 5:35). Речь людей — 「」."
  4: "οὐ διεκρίθητε ἐν ἑαυτοῖς — 自分たちの間で分け隔てをし…のではないか (διακρίνω — различать, проводить различие, ср. 1:6). κριταὶ διαλογισμῶν πονηρῶν — 悪い思いを抱く審判者 (букв. «судьи с худыми помыслами»)."
  5: "Ἀκούσατε — 聞きなさい. τοὺς πτωχοὺς τῷ κόσμῳ — この世で貧しい者たち (дат. отношения). πλουσίους ἐν πίστει — 信仰に富む者. κληρονόμους τῆς βασιλείας — 御国の相続者 (βασιλεία — 御国, как в корпусе). ἧς ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν — ご自身を愛する者たちに約束された (подлежащее подразумевается — Бог)."
  6: "ἠτιμάσατε τὸν πτωχόν — 貧しい人を辱めた (ἀτιμάζω — бесчестить). καταδυναστεύουσιν ὑμῶν — あなたがたを虐げ (καταδυναστεύω — притеснять, угнетать). ἕλκουσιν ὑμᾶς εἰς κριτήρια — 法廷に引きずり込む (κριτήριον — судилище)."
  7: "βλασφημοῦσιν τὸ καλὸν ὄνομα — 良い名を冒涜する (βλασφημέω — хулить). τὸ ἐπικληθὲν ἐφ' ὑμᾶς — あなたがたの上に唱えられた (ἐπικαλέω — называть, призывать; речь об имени Христа, ср. Деян 15:17)."
  8: "νόμον τελεῖτε βασιλικόν — 王の律法を守る (τελέω — исполнять; βασιλικός — царский). κατὰ τὴν γραφήν — 聖書に従って. Цитата Лев 19:18: Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν — 「あなたの隣人を自分のように愛せよ」. καλῶς ποιεῖτε — よくしている."
  9: "προσωπολημπτεῖτε — 分け隔てをする (глагол от προσωπολημψία, 2:1). ἁμαρτίαν ἐργάζεσθε — 罪を行う. ἐλεγχόμενοι ὑπὸ τοῦ νόμου ὡς παραβάται — 律法によって違反者として責められる (ἐλέγχω — обличать; παραβάτης — преступник закона)."
  10: "ὅλον τὸν νόμον τηρήσῃ — 律法をすべて守る. πταίσῃ δὲ ἐν ἑνί — 一つでもつまずく (πταίω — спотыкаться, ср. 3:2). γέγονεν πάντων ἔνοχος — すべての点で責めを負う者となった (ἔνοχος — повинный, подлежащий суду)."
  11: "ὁ γὰρ εἰπών, Μὴ μοιχεύσῃς — 「姦淫するな」と言われた方 (Исх 20:14; Втор 5:18). εἶπεν καί, Μὴ φονεύσῃς — 「殺すな」とも言われた (Исх 20:13; Втор 5:17). γέγονας παραβάτης νόμου — 律法の違反者となった (ср. 2:9)."
  12: "οὕτως λαλεῖτε καὶ οὕτως ποιεῖτε — そのように語り、そのように行いなさい. διὰ νόμου ἐλευθερίας μέλλοντες κρίνεσθαι — 自由の律法によって裁かれる者として (ср. 1:25)."
  13: "ἡ γὰρ κρίσις ἀνέλεος τῷ μὴ ποιήσαντι ἔλεος — あわれみを行わなかった者には、あわれみのない裁き (ἀνέλεος — немилостивый; дат. «для того, кто»). κατακαυχᾶται ἔλεος κρίσεως — あわれみは裁きに打ち勝つ (κατακαυχάομαι — торжествовать над, хвалиться против)."
  14: "Τί τὸ ὄφελος — 何の益があるか (ὄφελος — польза). ἐὰν πίστιν λέγῃ τις ἔχειν — 自分には信仰があると言いながら. μὴ δύναται ἡ πίστις σῶσαι αὐτόν — その信仰はその人を救えるだろうか (вопрос, ожидающий отрицания)."
  15: "γυμνοὶ ὑπάρχωσιν — 着る物もなく (γυμνός — раздетый, нагой). λειπόμενοι τῆς ἐφημέρου τροφῆς — その日の食べ物にも事欠いている (ἐφήμερος — насущный, «на день»; τροφή — пища, ср. 1:4 λειπόμενοι)."
  16: "Ὑπάγετε ἐν εἰρήνῃ — 「平安のうちに行きなさい」. θερμαίνεσθε καὶ χορτάζεσθε — 「暖かくし、腹を満たしなさい」 (θερμαίνω — согревать; χορτάζω — насыщать, ср. Мф 15:33). τὰ ἐπιτήδεια τοῦ σώματος — 体に必要なもの (ἐπιτήδειος — потребный)."
  17: "οὕτως καὶ ἡ πίστις… νεκρά ἐστιν καθ' ἑαυτήν — 信仰も…それだけでは死んだものである (καθ' ἑαυτήν — «сама по себе»; νεκρός — мёртвый, ср. 2:26)."
  18: "Ἀλλ' ἐρεῖ τις — しかし、だれかが言うだろう. Σὺ πίστιν ἔχεις κἀγὼ ἔργα ἔχω — 「あなたには信仰があり、わたしには行いがある」 (возражение воображаемого собеседника). δεῖξόν μοι τὴν πίστιν σου χωρὶς τῶν ἔργων — 行いのないあなたの信仰を、わたしに見せてほしい. κἀγώ σοι δείξω ἐκ τῶν ἔργων μου τὴν πίστιν — わたしは自分の行いによって…見せよう."
  19: "σὺ πιστεύεις ὅτι εἷς θεός ἐστιν — あなたは神が一つであると信じている (Шема, Втор 6:4). καλῶς ποιεῖς — それでよい. τὰ δαιμόνια πιστεύουσιν καὶ φρίσσουσιν — 悪霊たちも信じて震えている (φρίσσω — трепетать, содрогаться)."
  20: "θέλεις δὲ γνῶναι — あなたは知りたいのか. ὦ ἄνθρωπε κενέ — 空しい人よ (κενός — пустой; jp-joc 虚誕の人). ἡ πίστις χωρὶς τῶν ἔργων ἀργή ἐστιν — 行いのない信仰が役に立たない (ἀργός — праздный, бездельный; в критическом тексте νεκρά, в базе ἀργή)."
  21: "Ἀβραὰμ ὁ πατὴρ ἡμῶν — わたしたちの父アブラハム. οὐκ ἐξ ἔργων ἐδικαιώθη — 行いによって義とされたのではないか (δικαιόω — оправдывать). ἀνενέγκας Ἰσαὰκ τὸν υἱὸν αὐτοῦ ἐπὶ τὸ θυσιαστήριον — その子イサクを祭壇にささげたとき (ἀναφέρω — возносить, приносить в жертву; Быт 22)."
  22: "βλέπεις ὅτι — あなたに見えているとおり. ἡ πίστις συνήργει τοῖς ἔργοις αὐτοῦ — 信仰は彼の行いとともに働き (συνεργέω — содействовать; imperfect — «содействовала»). ἐκ τῶν ἔργων ἡ πίστις ἐτελειώθη — 行いによって信仰が全うされた (τελειόω — доводить до конца, ср. 1:4)."
  23: "ἐπληρώθη ἡ γραφή — 聖書の言葉が成就した. Цитата Быт 15:6: Ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην — 「アブラハムは神を信じた。そのことが彼の義と認められた」 (λογίζομαι — вменять, засчитывать). καὶ φίλος θεοῦ ἐκλήθη — そして、彼は神の友と呼ばれた: этого нет в Быт 15:6 (ср. Ис 41:8; 2 Пар 20:7), поэтому вне 「」."
  24: "ὁρᾶτε ὅτι — よくわきまえなさい (императив). ἐξ ἔργων δικαιοῦται ἄνθρωπος — 人は行いによって義とされる. καὶ οὐκ ἐκ πίστεως μόνον — 信仰だけによってではない."
  25: "Ῥαὰβ ἡ πόρνη — 遊女ラハブ (Нав 2; Евр 11:31). ὑποδεξαμένη τοὺς ἀγγέλους — 使者たちを迎え入れ (ὑποδέχομαι — принимать; ἄγγελος здесь — посланные, соглядатаи). ἑτέρᾳ ὁδῷ ἐκβαλοῦσα — 別の道から送り出した (ἐκβάλλω — выводить)."
  26: "τὸ σῶμα χωρὶς πνεύματος νεκρόν ἐστιν — 霊のない体が死んでいる (πνεῦμα здесь — дыхание, дух человека, не Святой Дух, поэтому 霊[れい], а не 聖霊). οὕτως καὶ ἡ πίστις χωρὶς ἔργων νεκρά — 行いのない信仰も死んでいる."
