verses:
  1: "周[まわ]りの異邦人[いほうじん]たちは、祭壇[さいだん]が建[た]てられ、聖所[せいしょ]が前[まえ]のように新[あら]たにされたことを聞[き]いて、ひどく怒[いか]った。"
  2: "そして、自分[じぶん]たちの中[なか]にいるヤコブの一族[いちぞく]を滅[ほろ]ぼそうと相談[そうだん]し、民[たみ]の中[なか]で殺[ころ]し、根[ね]こそぎ除[のぞ]き始[はじ]めた。"
  3: "ユダはイドマヤのアクラバテネでエサウの子[こ]らと戦[たたか]った。彼らがイスラエルを包囲[ほうい]していたからである。彼は彼らに大[おお]きな打撃[だげき]を与[あた]えて押[お]さえ込[こ]み、その戦利品[せんりひん]を取[と]った。"
  4: "また彼はベアンの子[こ]らの悪[あく]を思[おも]い起[おこ]した。彼らは民[たみ]にとって罠[わな]とつまずきとなり、道[みち]で待[ま]ち伏[ぶ]せしていたからである。"
  5: "彼らは彼[かれ]によって塔[とう]の中[なか]に閉[と]じ込[こ]められたが、彼は彼らに迫[せま]り、彼らを呪[のろ]い滅[ほろ]ぼして、その塔[とう]を中[なか]のすべての者[もの]もろとも火[ひ]で焼[や]いた。"
  6: "彼はアンモンの子[こ]らへ渡[わた]り、強[つよ]い軍[ぐん]と多[おお]くの民[たみ]、そして彼らの指導者[しどうしゃ]ティモテオスを見[み]つけた。"
  7: "彼は彼らと幾度[いくど]も戦[たたか]い、彼らは彼の前[まえ]で砕[くだ]かれ、彼は彼らを打[う]った。"
  8: "そしてヤゼルとその村[むら]々[むら]を先[さき]に取[と]って、ユダヤへ帰[かえ]った。"
  9: "ギレアドにいる異邦人[いほうじん]たちは、自分[じぶん]たちの領地[りょうち]にいるイスラエルの者[もの]たちを根[ね]こそぎ除[のぞ]こうとして集[あつ]まった。イスラエルの者[もの]たちは砦[とりで]ダテマへ逃[に]げ、"
  10: "ユダとその兄弟[きょうだい]たちに手紙[てがみ]を送[おく]って言[い]った。「わたしたちの周[まわ]りの異邦人[いほうじん]が、わたしたちを根[ね]こそぎ除[のぞ]こうとして集[あつ]まって来[き]た。"
  11: "彼らは、わたしたちが逃[に]げ込[こ]んだ砦[とりで]を襲[おそ]おうと準備[じゅんび]しており、ティモテオスがその軍勢[ぐんぜい]の長[おさ]である。"
  12: "今[いま]、来[き]てわたしたちを彼らの手[て]から救[すく]い出[だ]してほしい。わたしたちのうち多[おお]くの者[もの]が倒[たお]れた。"
  13: "また、トブの地方[ちほう]にいた兄弟[きょうだい]たちは皆[みな]殺[ころ]され、その妻[つま]たちも子[こ]どもたちも家財[かざい]も捕[と]らわれて行[い]き、そこでは千[せん]人[にん]ほどの者[もの]が滅[ほろ]ぼされた。」"
  14: "この手紙[てがみ]がまだ読[よ]まれているうちに、見[み]よ、ガリラヤからほかの使者[ししゃ]たちが衣[ころも]を引[ひ]き裂[さ]いて来[き]て、"
  15: "プトレマイス、ティルス、シドン、そしてガリラヤ中の異邦人[いほうじん]が、わたしたちを根[ね]こそぎ滅[ほろ]ぼそうとして集[あつ]まって来[き]たと告[つ]げた。"
  16: "ユダと民[たみ]がこれらの言葉[ことば]を聞[き]くと、大[おお]きな会衆[かいしゅう]が集[あつ]まり、苦[くる]しみの中[なか]にあり、彼らに攻[せ]められている兄弟[きょうだい]たちのために何[なに]をすべきかを相談[そうだん]した。"
  17: "ユダはその兄弟[きょうだい]シモンに言[い]った。「あなたは自分[じぶん]のために人[ひと]々[びと]を選[えら]んで行[い]き、ガリラヤにいるあなたの兄弟[きょうだい]たちを救[すく]え。わたしとわたしの兄弟[きょうだい]ヨナタンはギレアドへ行[い]く。」"
  18: "彼は民[たみ]の指導者[しどうしゃ]としてヨセフ（ザカリヤの子[こ]）とアザリヤを、残[のこ]った軍勢[ぐんぜい]とともにユダヤに残[のこ]して守[まも]らせ、"
  19: "彼らに命[めい]じて言[い]った。「この民[たみ]を治[おさ]めよ。わたしたちが帰[かえ]るまで、異邦人[いほうじん]と戦[たたか]いを起[お]こしてはならない。」"
  20: "シモンにはガリラヤへ行[い]くために三千[さんぜん]の者[もの]が、ユダにはギレアドへ行[い]くために八千[はっせん]の者[もの]が割[わ]り当[あ]てられた。"
  21: "シモンはガリラヤへ行[い]き、異邦人[いほうじん]と幾度[いくど]も戦[たたか]った。異邦人[いほうじん]は彼の前[まえ]で砕[くだ]かれ、"
  22: "彼はプトレマイスの門[もん]まで彼らを追[お]った。異邦人[いほうじん]のうち三千[さんぜん]人[にん]ほどが倒[たお]れ、彼はその戦利品[せんりひん]を取[と]った。"
  23: "彼はガリラヤとアルバタにいる者[もの]たちを、妻[つま]たち、子[こ]どもたち、そして彼らの持[も]ち物[もの]すべてとともに連[つ]れ、大[おお]きな喜[よろこ]びとともにユダヤへ導[みちび]いた。"
  24: "ユダ・マッカバイオスとその兄弟[きょうだい]ヨナタンはヨルダン川[がわ]を渡[わた]り、荒[あ]れ野[の]を三日[みっか]の道[みち]ほど行[い]った。"
  25: "彼らはナバテア人[じん]に出会[であ]い、ナバテア人[じん]は彼らを平和[へいわ]に迎[むか]えて、ギレアドで兄弟[きょうだい]たちに起[お]こったことをすべて語[かた]った。"
  26: "また、彼らのうち多[おお]くの者[もの]がボソラとアレマのボソル、ハスフォ、マケド、カルナインに閉[と]じ込[こ]められていること、"
  27: "そしてギレアドの残[のこ]りの町[まち]々[まち]にも閉[と]じ込[こ]められている者[もの]たちがいて、翌日[よくじつ]には要害[ようがい]を襲[おそ]ってこれを取[と]り、一日[いちにち]のうちに彼らを皆[みな]根[ね]こそぎ除[のぞ]くことが定[さだ]められていると告[つ]げた。"
  28: "そこでユダとその陣[じん]は、荒[あ]れ野[の]道[みち]をボソラへと突然[とつぜん]引[ひ]き返[かえ]した。彼は町[まち]を取[と]り、男[おとこ]という男[おとこ]を皆[みな]剣[つるぎ]の刃[やいば]にかけて殺[ころ]し、その戦利品[せんりひん]をすべて取[と]って、町[まち]を火[ひ]で焼[や]いた。"
  29: "彼はそこを夜[よる]のうちに出発[しゅっぱつ]し、砦[とりで]のところまで進[すす]んだ。"
  30: "夜[よ]が明[あ]けるころ、彼らは目[め]を上[あ]げた。見[み]よ、数[かず]も知[し]れない多[おお]くの民[たみ]が、梯子[はしご]と攻城兵器[こうじょうへいき]を運[はこ]んで要害[ようがい]を取[と]ろうとし、砦[とりで]の者[もの]たちを攻[せ]めていた。"
  31: "ユダは戦[たたか]いが始[はじ]まったのを見[み]、町[まち]の叫[さけ]びがラッパと大[おお]きな声[こえ]によって天[てん]まで上[のぼ]るのを聞[き]いた。"
  32: "彼は軍[ぐん]の者[もの]たちに言[い]った。「今日[きょう]、わたしたちの兄弟[きょうだい]たちのために戦[たたか]え。」"
  33: "彼は三[みっ]つの組[くみ]に分[わ]かれて彼らの後[うし]ろから出[で]て、ラッパを吹[ふ]き、祈[いの]りの中で叫[さけ]んだ。"
  34: "ティモテオスの陣[じん]は、それがマッカバイオスであることを知[し]って彼の前[まえ]から逃[に]げ、彼は彼らに大[おお]きな打撃[だげき]を与[あた]えた。その日[ひ]、彼らのうち八千[はっせん]人[にん]ほどが倒[たお]れた。"
  35: "彼はアレマへ向[む]きを変[か]えてこれを攻[せ]め、これを取[と]り、その男[おとこ]という男[おとこ]を皆[みな]殺[ころ]し、その戦利品[せんりひん]を取[と]って、これを火[ひ]で焼[や]いた。"
  36: "そこから彼は進[すす]んで、ハスフォ、マケド、ボソル、およびギレアドの残[のこ]りの町[まち]々[まち]を先[さき]に取[と]った。"
  37: "これらのことの後[のち]、ティモテオスは別[べつ]の陣[じん]を集[あつ]め、川[かわ]の向[む]こう側[がわ]、ラフォンの前[まえ]に陣[じん]を敷[し]いた。"
  38: "ユダはその陣[じん]を偵察[ていさつ]させるために人[ひと]を遣[つか]わした。彼らは彼に告[つ]げて言[い]った。「わたしたちの周[まわ]りの異邦人[いほうじん]は皆[みな]、彼[かれ]のもとに集[あつ]まっており、その軍勢[ぐんぜい]はきわめて大[おお]きい。"
  39: "彼らは助[たす]けとしてアラビア人[じん]を雇[やと]い、川[かわ]の向[む]こう側[がわ]に陣[じん]を敷[し]いて、あなたと戦[たたか]うために来[く]る備[そな]えをしている。」そこでユダは彼らを迎[むか]えに出[で]た。"
  40: "ユダとその陣[じん]が水[みず]の川[かわ]に近[ちか]づくと、ティモテオスは自分[じぶん]の軍[ぐん]の長[おさ]たちに言[い]った。「もし彼が先[さき]にわたしたちのところへ渡[わた]って来[く]るなら、わたしたちは彼に立[た]ち向[む]かえない。彼は力[ちから]をもってわたしたちに勝[か]つからである。"
  41: "しかし、もし彼が恐[おそ]れて川[かわ]の向[む]こう側[がわ]に陣[じん]を敷[し]くなら、わたしたちが彼のところへ渡[わた]って行[い]き、彼に勝[か]つことができる。」"
  42: "ユダが水[みず]の川[かわ]に近[ちか]づくと、彼は民[たみ]の書記[しょき]たちを川[かわ]のそばに立[た]たせ、彼らに命[めい]じて言[い]った。「だれひとり陣[じん]に残[のこ]らせてはならない。すべての者[もの]が戦[たたか]いに出[で]よ。」"
  43: "そして彼は先[さき]に彼らのところへ渡[わた]り、民[たみ]は皆[みな]その後に続[つづ]いた。異邦人[いほうじん]は皆[みな]彼らの前[まえ]で砕[くだ]かれ、武器[ぶき]を捨[す]ててカルナインの聖域[せいいき]へ逃[に]げた。"
  44: "彼らはその町[まち]を取[と]り、聖域[せいいき]をその中[なか]のすべての者[もの]もろとも火[ひ]で焼[や]いた。カルナインは打[う]ち負[ま]かされ、もはやユダの前[まえ]に立[た]ち向[む]かうことはできなかった。"
  45: "ユダはギレアドにいるイスラエルの者[もの]を、小[ちい]さな者[もの]から大[おお]きな者[もの]まで、その妻[つま]たち、子[こ]どもたち、家財[かざい]とともに集[あつ]め、非常[ひじょう]に大[おお]きな陣[じん]としてユダの地[ち]へ来[こ]させた。"
  46: "彼らはエフロンまで来[き]た。それは道[みち]の上[うえ]にある大[おお]きな町[まち]で、きわめて堅固[けんご]であり、そこから右[みぎ]にも左[ひだり]にもそれることはできず、ただその中[なか]を通[とお]るしかなかった。"
  47: "町[まち]の者[もの]たちは彼らを閉[と]じ込[こ]め、門[もん]を石[いし]でふさいだ。"
  48: "ユダは平和[へいわ]の言葉[ことば]をもって彼らのもとへ遣[つか]わし、言[い]った。「わたしたちはあなたがたの地[ち]を通[とお]って、自分[じぶん]たちの地[ち]へ帰[かえ]る。だれもあなたがたを害[がい]さない。ただ足[あし]で通[とお]るだけである。」しかし彼らは彼に開[あ]けようとしなかった。"
  49: "ユダは陣[じん]の中で、おのおのが自分[じぶん]の場所[ばしょ]に陣[じん]を取[と]るように触[ふ]れ回[まわ]らせた。"
  50: "軍[ぐん]の者[もの]たちは陣[じん]を敷[し]き、彼らはその日[ひ]一日[いちにち]と夜[よ]通[どお]し町[まち]を攻[せ]め、町[まち]は彼の手[て]に渡[わた]された。"
  51: "彼は男[おとこ]という男[おとこ]を皆[みな]剣[つるぎ]の刃[やいば]にかけて殺[ころ]し、町[まち]を根[ね]こそぎにし、その戦利品[せんりひん]を取[と]って、殺[ころ]された者[もの]の上[うえ]を踏[ふ]んで町[まち]を通[とお]った。"
  52: "彼らはヨルダン川[がわ]を渡[わた]って、ベテシャンの前[まえ]の大[おお]きな平野[へいや]へ出[で]た。"
  53: "ユダは遅[おく]れている者[もの]たちを集[あつ]め、ユダの地[ち]に来[く]るまで、道[みち]の途中[とちゅう]ずっと民[たみ]を励[はげ]ました。"
  54: "彼らは喜[よろこ]びと楽しみをもってシオンの山[やま]に上[のぼ]り、燔祭[はんさい]をささげた。彼らの中[なか]から一人[ひとり]も倒[たお]れずに、平和[へいわ]のうちに帰[かえ]って来[き]たからである。"
  55: "ユダとヨナタンがギレアドの地[ち]に、その兄弟[きょうだい]シモンがプトレマイスの前[まえ]のガリラヤにいた日[ひ]々[び]、"
  56: "軍[ぐん]の長[おさ]であるヨセフ（ザカリヤの子[こ]）とアザリヤは、彼らが成[な]し遂[と]げた武勇[ぶゆう]と戦[たたか]いのことを聞[き]いた。"
  57: "そして言[い]った。「わたしたちも自分[じぶん]たちの名[な]を上[あ]げよう。周[まわ]りの異邦人[いほうじん]と戦[たたか]いに行[い]こう。」"
  58: "彼らは自分[じぶん]たちとともにいる軍[ぐん]の者[もの]たちに命[めい]じ、ヤムニアへ向[む]かった。"
  59: "ゴルギアスは町[まち]からその者[もの]たちとともに出[で]て、戦[たたか]いのために彼らを迎[むか]えた。"
  60: "ヨセフとアザリヤは敗走[はいそう]し、ユダヤの境[さかい]まで追[お]われた。その日[ひ]、イスラエルの民[たみ]のうち二千[にせん]人[にん]ほどが倒[たお]れた。"
  61: "民[たみ]の中[なか]に大[おお]きな敗走[はいそう]が起[お]こった。彼らは武勇[ぶゆう]を示[しめ]そうと思[おも]って、ユダとその兄弟[きょうだい]たちの言葉[ことば]を聞[き]かなかったからである。"
  62: "しかし、彼らはあの者[もの]たちの血筋[ちすじ]の者[もの]ではなかった。イスラエルの救[すく]いがその手[て]によって与[あた]えられた者[もの]たちである。"
  63: "ユダという人[ひと]とその兄弟[きょうだい]たちは、イスラエル全体[ぜんたい]と、彼らの名[な]が聞[き]こえるすべての民[たみ]の前[まえ]で、大[おお]いに栄[えい]誉[よ]を受[う]けた。"
  64: "人[ひと]々[びと]は彼らをほめたたえながら、彼らのもとに集[あつ]まって来[き]た。"
  65: "その後[のち]、ユダとその兄弟[きょうだい]たちは出[で]て、南[みなみ]の地[ち]でエサウの子[こ]らと戦[たたか]い、ヘブロンとその村[むら]々[むら]を打[う]ち、その要害[ようがい]を壊[こわ]し、その塔[とう]を周[まわ]りから火[ひ]で焼[や]いた。"
  66: "彼は異邦人[いほうじん]の地[ち]へ行[い]こうとして進[すす]み、マリサを通[とお]った。"
  67: "その日[ひ]、祭司[さいし]たちが戦[たたか]いで倒[たお]れた。彼らは武勇[ぶゆう]を示[しめ]そうとして、無謀[むぼう]にも戦[たたか]いに出[で]て行[い]ったのである。"
  68: "ユダはそれて、異邦人[いほうじん]の地[ち]アゾトスへ向[む]かい、彼らの祭壇[さいだん]を壊[こわ]し、彼らの神[かみ]々[がみ]の彫[ほ]り像[ぞう]を火[ひ]で焼[や]き、町[まち]々[まち]の戦利品[せんりひん]を奪[うば]って、ユダの地[ち]へ帰[かえ]った。"

notes:
  1: "τὰ ἔθνη κυκλόθεν — «народы вокруг»; ᾠκοδομήθη τὸ θυσιαστήριον — «построен жертвенник»; ἐνεκαινίσθη τὸ ἁγίασμα ὡς τὸ πρότερον — «обновлено святилище, как прежде»; ὠργίσθησαν σφόδρα — «разгневались весьма»."
  2: "ἐβουλεύσαντο τοῦ ἆραι τὸ γένος Ιακωβ — «решили отнять (истребить) род Иакова» (αἴρω); τοὺς ὄντας ἐν μέσῳ αὐτῶν — «сущих среди них»; ἤρξαντο τοῦ θανατοῦν — «начали умерщвлять»; ἐξαίρειν — «истреблять»."
  3: "ἐπολέμει Ιουδας πρὸς τοὺς υἱοὺς Ησαυ — «воевал Иуда с сынами Исава» (エサウ); ἐν τῇ Ιδουμαίᾳ, τὴν Ακραβαττήνην — «в Идумее, Акрабаттину» (ἡ Ακραβαττίνη — область; アクラバテネ); ὅτι περιεκάθηντο τὸν Ισραηλ — «ибо обложили (осадили) Израиля» (περιεκάθηντο, от περικάθημαι); ἐπάταξεν πληγὴν μεγάλην — «поразил поражением великим»; συνέστειλεν αὐτούς — «сжал (смирил) их» (συστέλλω)."
  4: "ἐμνήσθη τῆς κακίας υἱῶν Βαιαν — «вспомнил злобу сынов Веана» (ベアン); οἳ ἦσαν τῷ λαῷ εἰς παγίδα καὶ σκάνδαλον — «которые были народу в сеть и соблазн» (παγίς — 罠[わな]; σκάνδαλον — つまずき); ἐν τῷ ἐνεδρεύειν — «когда подстерегали (устраивали засады)» (ἐνεδρεύω)."
  5: "συνεκλείσθησαν ὑπ' αὐτοῦ εἰς τοὺς πύργους — «заключены были им в башни» (συγκλείω); παρενέβαλεν ἐπ' αὐτούς — «расположился против них»; ἀνεθεμάτισεν αὐτούς — «предал их заклятию (анафеме)» (ἀναθεματίζω) — передано 呪[のろ]い滅[ほろ]ぼす; ἐνεπύρισε τοὺς πύργους σὺν πᾶσιν τοῖς ἐνοῦσιν — «сжёг башни со всеми бывшими в них» (ἐνοῦσι — от ἔνειμι)."
  6: "διεπέρασεν ἐπὶ τοὺς υἱοὺς Αμμων — «перешёл к сынам Аммона» (διαπεράω; アンモン); εὗρεν χεῖρα κραταιὰν — «нашёл руку крепкую (сильное войско)»; λαὸν πολὺν καὶ Τιμόθεον ἡγούμενον αὐτῶν — «народ мног и Тимофея, вождя их» (ティモテオス)."
  7: "συνῆψεν πρὸς αὐτοὺς πολέμους πολλούς — «свёл с ними многие войны»; συνετρίβησαν πρὸ προσώπου αὐτοῦ — «сокрушены были пред лицом его»; ἐπάταξεν αὐτούς — «поразил их»."
  8: "προκατελάβετο τὴν Ιαζηρ — «взял прежде Иазер» (ヤゼル); τὰς θυγατέρας αὐτῆς — «дочерей его», т. е. окрестные селения — 村[むら]々[むら]; ἀνέστρεψεν εἰς τὴν Ιουδαίαν — «возвратился в Иудею»."
  9: "ἐπισυνήχθησαν τὰ ἔθνη τὰ ἐν τῇ Γαλααδ — «собрались народы в Галааде» (ギレアド); τοὺς ὄντας ἐπὶ τοῖς ὁρίοις αὐτῶν — «сущих в пределах их»; τοῦ ἐξᾶραι αὐτούς — «чтобы истребить их»; ἔφυγον εἰς Δαθεμα τὸ ὀχύρωμα — «убежали в Дафему, крепость» (ダテマ; 砦[とりで])."
  10: "ἀπέστειλαν γράμματα — «послали письма» (γράμματα); Ἐπισυνηγμένα ἐστὶν ἐφ' ἡμᾶς τὰ ἔθνη κύκλῳ ἡμῶν — «собрались на нас народы вокруг нас». Письмо — 「…」, продолжается до 13."
  11: "ἑτοιμάζονται ἐλθεῖν καὶ προκαταλαβέσθαι τὸ ὀχύρωμα — «готовятся прийти и захватить крепость» (προκαταλαμβάνομαι); εἰς ὃ κατεφύγομεν — «в которую мы убежали» (καταφεύγω); Τιμόθεος ἡγεῖται — «Тимофей предводительствует» (ἡγέομαι)."
  12: "ἐλθὼν ἐξελοῦ ἡμᾶς — «придя, избавь нас» (ἐξαιρέω); ἐκ χειρὸς αὐτῶν — «из руки их»; πέπτωκεν ἐξ ἡμῶν πλῆθος — «пало из нас множество»."
  13: "οἱ ὄντες ἐν τοῖς Τουβίου — «сущие в (местах) Товии» (トブ); τεθανάτωνται — «умерщвлены» (θανατόω); ᾐχμαλωτίκασιν — «взяли в плен»; τὴν ἀποσκευήν — «имущество» (ἀποσκευή — 家財[かざい]); ὡσεὶ μίαν χιλιαρχίαν ἀνδρῶν — «как одну тысячу (отряд) мужей» (χιλιαρχία — 千[せん]人[にん]の一隊[いったい]). Здесь письмо закрывается."
  14: "ἔτι αἱ ἐπιστολαὶ ἀνεγιγνώσκοντο — «ещё письма читались»; ἄγγελοι ἕτεροι — «иные вестники»; διερρηχότες τὰ ἱμάτια — «разодравшие одежды»; ἀπαγγέλλοντες κατὰ τὰ ῥήματα ταῦτα — «возвещающие по словам сим»."
  15: "ἐπισυνῆχθαι ἐπ' αὐτοὺς ἐκ Πτολεμαΐδος καὶ Τύρου καὶ Σιδῶνος — «собрались на них из Птолемаиды, Тира и Сидона» (プトレマイス, ティルス, シドン); πᾶσαν Γαλιλαίαν ἀλλοφύλων — «всю Галилею иноплеменников» (ガリラヤ); τοῦ ἐξαναλῶσαι ἡμᾶς — «чтобы истребить нас» (ἐξαναλίσκω). В греч. acc. cum inf. — косвенная речь, кавычек нет."
  16: "ἐπισυνήχθη ἐκκλησία μεγάλη — «собралось собрание великое»; βουλεύσασθαι τί ποιήσωσιν — «чтобы совещаться, что сделать»; ἐν θλίψει — «в скорби» (θλῖψις); πολεμουμένοις ὑπ' αὐτῶν — «воюемым ими»."
  17: "Ἐπίλεξον σεαυτῷ ἄνδρας — «избери себе мужей» (ἐπιλέγω); ῥῦσαι τοὺς ἀδελφούς σου — «избавь братьев твоих» (ῥύομαι); ἐγὼ δὲ καὶ Ιωναθαν — «я же и Ионафан» (ヨナタン); εἰς τὴν Γαλααδῖτιν — «в Галаадитиду» (ギレアド地方)."
  18: "κατέλιπεν Ιωσηπον τὸν τοῦ Ζαχαριου — «оставил Иосифа, сына Захарии» (ヨセフ, ザカリヤ); Αζαριαν — アザリヤ; ἡγούμενον τοῦ λαοῦ — «вождя народа»; μετὰ τῶν ἐπιλοίπων τῆς δυνάμεως — «с остальными силы»; εἰς τήρησιν — «для охранения» (τήρησις)."
  19: "Πρόστητε τοῦ λαοῦ τούτου — «предстательствуйте (управляйте) народом сим» (προΐστημι); μὴ συνάψητε πόλεμον πρὸς τὰ ἔθνη — «не начинайте войны с народами»; ἕως τοῦ ἐπιστρέψαι ἡμᾶς — «до возвращения нашего»."
  20: "ἐμερίσθησαν Σιμωνι ἄνδρες τρισχίλιοι — «выделены Симону мужей три тысячи» (μερίζω); Ιουδα δὲ ἄνδρες ὀκτακισχίλιοι — «Иуде же мужей восемь тысяч»; εἰς τὴν Γαλααδῖτιν — «в Галаадитиду»."
  21: "ἐπορεύθη Σιμων εἰς τὴν Γαλιλαίαν — «пошёл Симон в Галилею»; συνῆψεν πολέμους πολλούς — «свёл многие войны»; συνετρίβη τὰ ἔθνη ἀπὸ προσώπου αὐτοῦ — «сокрушены народы от лица его»."
  22: "ἐδίωξεν αὐτοὺς ἕως τῆς πύλης Πτολεμαΐδος — «гнал их до ворот Птолемаиды»; ἔπεσον ἐκ τῶν ἐθνῶν εἰς τρισχιλίους — «пало из народов до трёх тысяч»; ἔλαβεν τὰ σκῦλα — «взял добычу»."
  23: "παρέλαβεν τοὺς ἐκ τῆς Γαλιλαίας — «взял (с собой) сущих из Галилеи»; ἐν Αρβαττοις — «в Арваттах» (アルバタ); σὺν ταῖς γυναιξὶν καὶ τοῖς τέκνοις — «с жёнами и детьми»; πάντα, ὅσα ἦν αὐτοῖς — «всё, что было у них»; μετ' εὐφροσύνης μεγάλης — «с великою радостью»."
  24: "διέβησαν τὸν Ιορδάνην — «перешли Иордан» (ヨルダン); ὁδὸν τριῶν ἡμερῶν — «путь трёх дней»; ἐν τῇ ἐρήμῳ — «в пустыне»."
  25: "συνήντησαν τοῖς Ναβαταίοις — «встретили Наватеев» (ナバテア人[じん]); ἀπήντησαν αὐτοῖς εἰρηνικῶς — «приняли их мирно» (ἀπαντάω); διηγήσαντο — «рассказали» (διηγέομαι); τὰ συμβάντα — «происшедшее»."
  26: "συνειλημμένοι — «заключены» (συλλαμβάνω); εἰς Βοσορρα καὶ Βοσορ ἐν Αλεμοις — «в Босору и Босор в Алемах» (ボソラ, ボソル, アレマ); Χασφω, Μακεδ καὶ Καρναιν — ハスフォ, マケド, カルナイン; πᾶσαι αἱ πόλεις αὗται ὀχυραὶ καὶ μεγάλαι — «все эти города укреплены и велики»."
  27: "ἐν ταῖς λοιπαῖς πόλεσιν τῆς Γαλααδίτιδος — «в остальных городах Галаадитиды»; εἰς αὔριον τάσσονται παρεμβαλεῖν — «на завтра назначено (расположено) напасть» (τάσσω); καταλαβέσθαι καὶ ἐξᾶραι — «взять и истребить»; ἐν ἡμέρᾳ μιᾷ — «в один день»."
  28: "ἀπέστρεψεν… ὁδὸν εἰς τὴν ἔρημον Βοσορρα ἄφνω — «обратился… путём в пустыню Босорра внезапно» (ἄφνω — 突然[とつぜん]); κατελάβετο τὴν πόλιν — «взял город»; πᾶν ἀρσενικὸν ἐν στόματι ῥομφαίας — «всё мужское (мужеского пола) остриём меча» (ἀρσενικός — мужского пола); ἐνέπρησεν αὐτὴν πυρί — «сжёг его огнём»."
  29: "ἀπῆρεν ἐκεῖθεν νυκτός — «отправился оттуда ночью»; ἐπορεύοντο ἕως ἐπὶ τὸ ὀχύρωμα — «шли до крепости (укрепления)»."
  30: "ἑωθινῇ — «рано утром» (ἑωθινός); λαὸς πολύς, οὗ οὐκ ἦν ἀριθμός — «народ мног, которому не было числа»; αἴροντες κλίμακας καὶ μηχανάς — «несущие лестницы и машины» (κλίμαξ — 梯子[はしご]; μηχανή — 攻城兵器[こうじょうへいき]); ἐπολέμουν αὐτούς — «воевали (осаждали) их»."
  31: "ἦρκται ὁ πόλεμος — «началась война» (ἄρχομαι); ἡ κραυγὴ τῆς πόλεως ἀνέβη ἕως οὐρανοῦ — «вопль города взошёл до неба» (κραυγή); σάλπιγξιν καὶ κραυγῇ μεγάλῃ — «трубами и криком великим»."
  32: "Πολεμήσατε σήμερον ὑπὲρ τῶν ἀδελφῶν ἡμῶν — «сражайтесь сегодня за братьев наших». Слова Иуды — 「…」."
  33: "ἐξῆλθεν ἐν τρισὶν ἀρχαῖς ἐξόπισθεν αὐτῶν — «вышел тремя началами (отрядами) сзади них» (ἀρχή — отряд); ἐσάλπισαν ταῖς σάλπιγξιν — «вострубили трубами»; ἐβόησαν ἐν προσευχῇ — «возопили в молитве»."
  34: "ἐπέγνω ἡ παρεμβολὴ Τιμοθέου ὅτι Μακκαβαῖός ἐστιν — «узнал стан Тимофея, что это Маккавей»; ἔφυγον ἀπὸ προσώπου αὐτοῦ — «побежали от лица его»; ἐπάταξεν πληγὴν μεγάλην — «поразил поражением великим»; εἰς ὀκτακισχιλίους — «до восьми тысяч»."
  35: "ἀπέκλινεν εἰς Αλεμα — «повернул в Алему» (ἀποκλίνω; アレマ); ἐπολέμησεν αὐτὴν καὶ κατελάβετο — «воевал против неё и взял её»; πᾶν ἀρσενικὸν αὐτῆς — «всё мужское в ней»; ἐνέπρησεν ἐν πυρί — «сжёг огнём». Слав. вм. Алемы «в масфу» — иное чтение, отмечено."
  36: "ἐκεῖθεν ἀπῆρεν — «оттуда отправился»; προκατελάβετο τὴν Χασφω, Μακεδ καὶ Βοσορ — «взял Хасфо, Макед и Босор» (ハスフォ, マケド, ボソル); τὰς λοιπὰς πόλεις τῆς Γαλααδίτιδος — «остальные города Галаадитиды»."
  37: "μετὰ δὲ τὰ ῥήματα ταῦτα — «после этих слов (событий)»; συνήγαγεν παρεμβολὴν ἄλλην — «собрал другой стан»; κατὰ πρόσωπον Ραφων — «пред Рафоном» (ラフォン); ἐκ πέραν τοῦ χειμάρρου — «по ту сторону потока» (χείμαρρος — 川[かわ])."
  38: "ἀπέστειλεν… κατασκοπεῦσαι — «послал осмотреть» (κατασκοπεύω); Ἐπισυνηγμένα εἰσὶν πρὸς αὐτὸν πάντα τὰ ἔθνη — «собрались к нему все народы»; δύναμις πολλὴ σφόδρα — «сила весьма большая»."
  39: "Ἄραβας μεμίσθωνται εἰς βοήθειαν — «Аравитян наняли в помощь» (μισθόω — 雇[やと]う); παρεμβάλλουσιν πέραν τοῦ χειμάρρου — «располагаются станом по ту сторону потока»; ἕτοιμοι τοῦ ἐλθεῖν ἐπὶ σὲ εἰς πόλεμον — «готовые прийти на тебя войной»."
  40: "ἐν τῷ ἐγγίζειν Ιουδαν… ἐπὶ τὸν χειμάρρουν τοῦ ὕδατος — «когда приближался Иуда к потоку воды»; Ἐὰν διαβῇ πρὸς ἡμᾶς πρότερος — «если перейдёт к нам первым»; οὐ δυνησόμεθα ὑποστῆναι αὐτόν — «не сможем устоять против него»; δυνάμενος δυνήσεται πρὸς ἡμᾶς — «могущий возможет против нас» (cognatus, усиление). Речь Тимофея — 「…」."
  41: "ἐὰν δὲ δειλανθῇ — «если же устрашится» (δειλαίνομαι); παρεμβάλῃ πέραν τοῦ ποταμοῦ — «расположится станом за рекой»; διαπεράσομεν πρὸς αὐτὸν καὶ δυνησόμεθα — «перейдём к нему и одолеем». Здесь речь закрывается."
  42: "ἔστησεν τοὺς γραμματεῖς τοῦ λαοῦ ἐπὶ τοῦ χειμάρρου — «поставил писцов народа при потоке» (γραμματεύς — 書記[しょき]); Μὴ ἀφῆτε πάντα ἄνθρωπον παρεμβαλεῖν — «не оставляйте ни одного человека расположиться станом (в тылу)»; ἐρχέσθωσαν πάντες εἰς τὸν πόλεμον — «пусть все идут на войну»."
  43: "διεπέρασεν ἐπ' αὐτοὺς πρότερος — «перешёл к ним первым»; πᾶς ὁ λαὸς ὄπισθεν αὐτοῦ — «весь народ за ним»; ἔρριψαν τὰ ὅπλα — «бросили оружие»; εἰς τὸ τέμενος Καρναιν — «в святилище Карнаина» (τέμενος — 聖域[せいいき])."
  44: "προκατελάβοντο τὴν πόλιν — «взяли город»; τὸ τέμενος ἐνεπύρισαν σὺν πᾶσιν — «святилище сожгли со всеми»; ἐτροπώθη Καρναιν — «обращён в бегство Карнаин» (τροπόω); οὐκ ἠδύναντο ἔτι ὑποστῆναι — «не могли более устоять»."
  45: "συνήγαγεν… πάντα Ισραηλ — «собрал… всего Израиля»; ἀπὸ μικροῦ ἕως μεγάλου — «от малого до великого»; τὴν ἀποσκευήν — «имущество»; παρεμβολὴν μεγάλην σφόδρα — «стан весьма великий»."
  46: "ἦλθον ἕως Εφρων — «пришли до Ефрона» (エフロン); πόλις μεγάλη ἐπὶ τῆς ὁδοῦ ὀχυρὰ σφόδρα — «город великий на пути, весьма укреплённый»; οὐκ ἦν ἐκκλῖναι… δεξιὰν ἢ ἀριστεράν — «не было уклониться… направо или налево» (ἐκκλίνω); διὰ μέσου αὐτῆς πορεύεσθαι — «пройти посреди него»."
  47: "ἀπέκλεισαν αὐτοὺς οἱ ἐκ τῆς πόλεως — «заперлись от них бывшие в городе» (ἀποκλείω); ἐνέφραξαν τὰς πύλας λίθοις — «заградили ворота камнями» (φράσσω)."
  48: "ἀπέστειλεν… λόγοις εἰρηνικοῖς — «послал… со словами мирными»; Διελευσόμεθα διὰ τῆς γῆς σου — «пройдём по земле твоей» (διέρχομαι); οὐδεὶς κακοποιήσει ὑμᾶς — «никто не сделает вам зла» (κακοποιέω); πλὴν τοῖς ποσὶν παρελευσόμεθα — «только ногами пройдём» (παρέρχομαι); οὐκ ἠβούλοντο ἀνοῖξαι — «не хотели открыть»."
  49: "ἐπέταξεν… κηρύξαι ἐν τῇ παρεμβολῇ — «повелел объявить в стане» (κηρύσσω); τοῦ παρεμβαλεῖν ἕκαστον ἐν ᾧ ἐστιν τόπῳ — «чтобы расположился каждый на своём месте»."
  50: "παρενέβαλον οἱ ἄνδρες τῆς δυνάμεως — «расположились мужи силы»; ἐπολέμησεν τὴν πόλιν ὅλην τὴν ἡμέραν — «воевал против города весь день»; παρεδόθη ἡ πόλις ἐν χειρὶ αὐτοῦ — «предан был город в руку его»."
  51: "ἀπώλεσεν πᾶν ἀρσενικόν — «погубил всё мужское»; ἐξερρίζωσεν αὐτήν — «искоренил его» (ἐκριζόω); διῆλθεν διὰ τῆς πόλεως ἐπάνω τῶν ἀπεκταμμένων — «прошёл через город по убитым» (κατατέμνω — закалывать)."
  52: "διέβησαν τὸν Ιορδάνην — «перешли Иордан»; εἰς τὸ πεδίον τὸ μέγα — «на равнину великую»; κατὰ πρόσωπον Βαιθσαν — «пред Вефсаном» (ベテシャン)."
  53: "ἦν… ἐπισυνάγων τοὺς ἐσχατίζοντας — «собирал отстающих (последних)» (ἐσχατίζω — быть позади); παρακαλῶν τὸν λαὸν κατὰ πᾶσαν τὴν ὁδόν — «ободрял народ по всей дороге»."
  54: "ἀνέβησαν εἰς ὄρος Σιων ἐν εὐφροσύνῃ καὶ χαρᾷ — «взошли на гору Сион с весельем и радостью»; προσήγαγον ὁλοκαυτώματα — «принесли всесожжения»; οὐκ ἔπεσεν ἐξ αὐτῶν οὐθείς — «никто из них не пал»; ἕως τοῦ ἐπιστρέψαι ἐν εἰρήνῃ — «до возвращения в мире»."
  55: "ἐν ταῖς ἡμέραις, ἐν αἷς ἦν Ιουδας καὶ Ιωναθαν ἐν γῇ Γαλααδ — «в те дни, когда Иуда и Ионатан были в земле Галаад»; κατὰ πρόσωπον Πτολεμαΐδος — «пред Птолемаидой»."
  56: "ἤκουσεν Ιωσηφ ὁ τοῦ Ζαχαριου καὶ Αζαριας — «услышали Иосиф, сын Захарии, и Азария»; ἄρχοντες τῆς δυνάμεως — «начальники силы»; τῶν ἀνδραγαθιῶν καὶ τοῦ πολέμου, οἷα ἐποίησαν — «о подвигах и войне, что они совершили» (ἀνδραγαθία — 武勇[ぶゆう])."
  57: "Ποιήσωμεν καὶ αὐτοὶ ἑαυτοῖς ὄνομα — «сделаем и мы себе имя»; πορευθῶμεν πολεμῆσαι — «пойдём воевать»; πρὸς τὰ ἔθνη τὰ κύκλῳ ἡμῶν — «с народами вокруг нас». Слова — 「…」."
  58: "παρήγγειλεν τοῖς ἀπὸ τῆς δυνάμεως — «объявил (приказал) бывшим из войска» (παραγγέλλω); ἐπορεύθησαν ἐπὶ Ιάμνειαν — «пошли на Иамнию» (ヤムニア)."
  59: "ἐξῆλθεν Γοργίας ἐκ τῆς πόλεως — «вышел Горгий из города» (ゴルギアス); εἰς συνάντησιν αὐτοῖς εἰς πόλεμον — «навстречу им на войну»."
  60: "ἐτροπώθη Ιωσηπος καὶ Αζαριας — «обращены в бегство Иосиф и Азария»; ἐδιώχθησαν ἕως τῶν ὁρίων τῆς Ιουδαίας — «гнаны были до пределов Иудеи»; εἰς δισχιλίους ἄνδρας — «до двух тысяч мужей»."
  61: "ἐγενήθη τροπὴ μεγάλη ἐν τῷ λαῷ — «произошло великое поражение (бегство) в народе» (τροπή); ὅτι οὐκ ἤκουσαν Ιουδου — «ибо не послушали Иуды»; οἰόμενοι ἀνδραγαθῆσαι — «думая показать мужество» (οἴομαι — 思[おも]う)."
  62: "αὐτοὶ δὲ οὐκ ἦσαν ἐκ τοῦ σπέρματος τῶν ἀνδρῶν ἐκείνων — «они же не были от семени мужей тех» (σπέρμα — 血筋[ちすじ]); οἷς ἐδόθη σωτηρία Ισραηλ διὰ χειρὸς αὐτῶν — «которым дано было спасение Израиля рукою их»."
  63: "ὁ ἀνὴρ Ιουδας — «муж Иуда»; ἐδοξάσθησαν σφόδρα ἔναντι παντὸς Ισραηλ — «прославились весьма пред всем Израилем»; τῶν ἐθνῶν πάντων, οὗ ἠκούετο τὸ ὄνομα αὐτῶν — «всех народов, где слышалось имя их»."
  64: "ἐπισυνήγοντο πρὸς αὐτοὺς εὐφημοῦντες — «собирались к ним, благословляя (возглашая доброе)» (εὐφημέω)."
  65: "ἐπολέμουν τοὺς υἱοὺς Ησαυ ἐν τῇ γῇ τῇ πρὸς νότον — «воевали с сынами Исава в земле, что к югу»; ἐπάταξεν τὴν Χεβρων καὶ τὰς θυγατέρας αὐτῆς — «поразил Хеврон и дочерей его» (ヘブロン; 村[むら]々[むら]); καθεῖλεν τὰ ὀχυρώματα — «низверг укрепления»; τοὺς πύργους… ἐνεπύρισεν κυκλόθεν — «башни… сжёг вокруг»."
  66: "ἀπῆρεν τοῦ πορευθῆναι εἰς γῆν ἀλλοφύλων — «отправился идти в землю иноплеменников»; διεπορεύετο τὴν Μαρισαν — «проходил Марису» (マリサ). Слав. «прохождаше самарию» — вероятно, чтение Μαρεισα как «Самария»; в тексте по LXX マリサ, отмечено."
  67: "ἐν τῇ ἡμέρᾳ ἐκείνῃ ἔπεσον ἱερεῖς ἐν πολέμῳ — «в тот день пали священники на войне»; βουλόμενοι ἀνδραγαθῆσαι — «желая показать мужество»; ἐξελθεῖν εἰς πόλεμον ἀβουλεύτως — «выйти на войну необдуманно» (ἀβουλεύτως — 無謀[むぼう]にも)."
  68: "ἐξέκλινεν εἰς Ἄζωτον — «уклонился в Азот» (Ἀζωτος — アゾトス); καθεῖλεν τοὺς βωμούς — «низверг жертвенники»; τὰ γλυπτὰ τῶν θεῶν κατέκαυσεν πυρί — «резные изображения богов сжёг огнём» (γλυπτόν — 彫[ほ]り像[ぞう]); ἐσκύλευσεν τὰ σκῦλα τῶν πόλεων — «захватил добычу городов» (σκυλεύω); ἐπέστρεψεν εἰς γῆν Ιουδα — «возвратился в землю Иуды»."
