# jp-box, Откровение Иоанна, глава 5. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий (gr-lxx-byz) — свидетель; чего в нём нет, то в 〔…〕.
# Глава 5: запечатанный свиток и Агнец (1–7); песнь Агнцу и славословие (8–14).
# Красного <j> в главе нет: прямой речи Христа нет. Песни 5:9–10, 5:12, 5:13 — в «…»,
# не красные; «アーメン» в 5:14 — тоже в «…». Слова старца (5:5) и ангела (5:2) — не красные.
# 5:10 — замена чтения, а не добавление (в базе βασιλείαν «царство», Церковь читает βασιλεῖς
# «цари»; проверено: βασιλεις — НЕТ, βασιλειαν — ЕСТЬ), поэтому без 〔…〕, как 1:6 в otkr_01.
# 〔…〕: 5:14 — 〔二十四の〕 и 〔世々限りなく生きておられる方を〕 (в базе только
# «старцы пали и поклонились»; проверено: εικοσι, ζωντι — НЕТ).
# 5:6 — ἑστηκός в базе есть (проверено), 〔…〕 нет. πνεῦμα без ἅγιον — 霊[れい].
# Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

tr_code: jp-box
book: otkr
chapter: 5
draft: true

verses:
  1: "わたしは、御座[みくら]に座[すわ]っておられる方[かた]の右手[みぎて]に、内[うち]にも外[そと]にも書[か]き記[しる]された巻物[まきもの]が、七[なな]つの封印[ふういん]で封[ふう]じられているのを見[み]た。"
  2: "また、力[ちから]ある天使[てんし]が大[おお]きな声[こえ]で宣[の]べるのを見[み]た。「この巻物[まきもの]を開[ひら]き、その封印[ふういん]を解[と]くにふさわしい者[もの]は、だれか。」"
  3: "しかし、天[てん]にも、地[ち]にも、地[ち]の下[した]にも、この巻物[まきもの]を開[ひら]くことのできる者[もの]も、それを眺[なが]めることのできる者[もの]も、だれもいなかった。"
  4: "巻物[まきもの]を開[ひら]くにも眺[なが]めるにもふさわしい者[もの]が、だれも見[み]つからなかったので、わたしは激[はげ]しく泣[な]いた。"
  5: "すると、長老[ちょうろう]の一人[ひとり]がわたしに言[い]う。「泣[な]いてはならない。見[み]よ、ユダ族[ぞく]から出[で]た獅子[しし]、ダビデの根[ね]が勝[か]ちを得[え]て、この巻物[まきもの]と、その七[なな]つの封印[ふういん]を開[ひら]くことができる。」"
  6: "わたしは、御座[みくら]と四[よっ]つの生[い]き物[もの]の真[ま]ん中[なか]、また長老[ちょうろう]たちの真[ま]ん中[なか]に、屠[ほふ]られたかのように立[た]っている小羊[こひつじ]を見[み]た。それには七[なな]つの角[つの]と七[なな]つの目[め]があり、これは全地[ぜんち]に遣[つか]わされた神[かみ]の七[なな]つの霊[れい]である。"
  7: "小羊[こひつじ]は近[ちか]づいて、座[すわ]っておられる方[かた]の右手[みぎて]からその巻物[まきもの]を受[う]け取[と]った。"
  8: "巻物[まきもの]を受[う]け取[と]ると、四[よっ]つの生[い]き物[もの]と二十四[にじゅうし]人[にん]の長老[ちょうろう]たちは、小羊[こひつじ]の前[まえ]にひれ伏[ふ]した。それぞれが琴[こと]と、香[こう]が満[み]ちた金[きん]の鉢[はち]を持[も]っていた。この香[こう]は聖[せい]なる者[もの]たちの祈[いの]りである。"
  9: "彼[かれ]らは新[あたら]しい歌[うた]を歌[うた]って、こう言[い]う。「あなたは巻物[まきもの]を受[う]け取[と]り、その封印[ふういん]を開[ひら]くにふさわしい方[かた]である。あなたは屠[ほふ]られ、その血[ち]によって、あらゆる部族[ぶぞく]と言葉[ことば]と民[たみ]と国民[こくみん]の中[なか]から、神[かみ]のために贖[あがな]い出[だ]されたからである。"
  10: "あなたは彼[かれ]らを、わたしたちの神[かみ]のために王[おう]たちとし、祭司[さいし]とした。彼[かれ]らは地[ち]の上[うえ]で王[おう]として治[おさ]める。」"
  11: "また、わたしは見[み]て、聞[き]いた。御座[みくら]と生[い]き物[もの]たちと長老[ちょうろう]たちの周[まわ]りに、多[おお]くの天使[てんし]たちの声[こえ]があった。その数[かず]は万[まん]の万倍[まんばい]、千[せん]の千倍[せんばい]であった。"
  12: "彼[かれ]らは大[おお]きな声[こえ]で言[い]った。「屠[ほふ]られた小羊[こひつじ]こそ、力[ちから]と富[とみ]と知恵[ちえ]と強[つよ]さ、尊[そん]敬[けい]と栄光[えいこう]と賛美[さんび]とを受[う]けるにふさわしい。」"
  13: "また、天[てん]にあり、地[ち]にあり、地[ち]の下[した]にあり、海[うみ]にあるすべての造[つく]られたもの、およびそれらの中[なか]にあるすべてのものが、こう言[い]うのを聞[き]いた。「御座[みくら]に座[すわ]っておられる方[かた]と小羊[こひつじ]とに、賛美[さんび]と尊[そん]敬[けい]と栄光[えいこう]と権能[けんのう]とが、世々[よよ]限[かぎ]りなくあるように。」"
  14: "四[よっ]つの生[い]き物[もの]は「アーメン」と言[い]った。そして、〔二十四[にじゅうし]人[にん]の〕長老[ちょうろう]たちはひれ伏[ふ]し、〔世々[よよ]限[かぎ]りなく生[い]きておられる方[かた]を〕拝[はい]した。"

notes:
  1: "βιβλίον — 巻物. γεγραμμένον ἔσωθεν καὶ ὄπισθεν — 内にも外にも書き記された. κατεσφραγισμένον σφραγῖσιν ἑπτά — 七つの封印で封じられている."
  2: "ἰσχυρός — 力ある. κηρύσσοντα — 宣べる. Слова ангела — в «…», не красные: это не Христос."
  3: "οὐδεὶς ἐδύνατο — だれも…いなかった. ἀνοῖξαι… οὔτε βλέπειν — 開くことも眺めることも."
  4: "ἔκλαιον πολύ — 激しく泣いた (imperfect, длительное). Причина — в предыдущем стихе."
  5: "ὁ λέων ὁ ἐκ τῆς φυλῆς Ἰούδα — ユダ族から出た獅子 (мессианский титул, Быт 49:9). ἡ ῥίζα Δαυίδ — ダビデの根. Слова одного из старцев — «…», не красные."
  6: "ἀρνίον ἑστηκὸς ὡς ἐσφαγμένον — 屠られたかのように立っている小羊; ἑστηκός в базе есть (проверено), 〔…〕 нет. κέρατα ἑπτά — 七つの角. τὰ [ἑπτὰ] πνεύματα τοῦ θεοῦ — 七つの霊 (без ἅγιον)."
  7: "ἦλθεν καὶ εἴληφεν — 近づいて…受け取った (два аориста). ἐκ τῆς δεξιᾶς τοῦ καθημένου — 座っておられる方の右手から."
  8: "κιθάρα — 琴. φιάλαι χρυσαῖ — 金の鉢. θυμιάματα — 香. αἵ εἰσιν αἱ προσευχαὶ τῶν ἁγίων — この香は聖なる者たちの祈り."
  9: "ᾠδὴν καινήν — 新しい歌. ἐσφάγης — 屠られた. ἠγόρασας τῷ θεῷ — 神のために贖い出した; дополнения в базе нет, объект не добавлен. ἐκ πάσης φυλῆς… — あらゆる部族…の中から."
  10: "В базе βασιλείαν («царство») и αὐτούς; Церковь читает βασιλεῖς («цари») и ἡμᾶς. Это замена чтения, а не добавление (ср. 1:6 в otkr_01, 1 Кор 2:1), поэтому 〔…〕 не ставятся: 王たちとし、祭司とした. βασιλεύσουσιν ἐπὶ τῆς γῆς — 地の上で王として治める."
  11: "μυριάδες μυριάδων καὶ χιλιάδες χιλιάδων — 万の万倍、千の千倍. κύκλῳ τοῦ θρόνου — 御座の周りに."
  12: "Семь славословий: δύναμις, πλοῦτος, σοφία, ἰσχύς, τιμή, δόξα, εὐλογία — 力、富、知恵、強さ、尊敬、栄光、賛美. τὸ ἀρνίον τὸ ἐσφαγμένον — 屠られた小羊."
  13: "πᾶν κτίσμα — すべての造られたもの. Четыре области: небо, земля, под землёй, море. κράτος — 権能 (не δύναμις). Славословие в «…», не красное."
  14: "В базе: «и старцы пали и поклонились»; Церковь читает «двадцать четыре старца… поклонились Живущему во веки веков». Слов εἴκοσι τέσσαρες и ζῶντι в базе нет (проверено) — 〔二十四の〕 и 〔世々限りなく生きておられる方を〕. ἀμήν — アーメン, в «…»."
