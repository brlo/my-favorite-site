verses:
  1: "安息日[あんそくび]が過[す]ぎると、マグダラのマリア、ヤコブの母[はは]マリア、そしてサロメは、イエスに塗[ぬ]るための香料[こうりょう]を買[か]った。"
  2: "週[しゅう]の初[はじ]めの日[ひ]の朝早[あさはや]く、日[ひ]が昇[のぼ]るころ、彼女[かのじょ]たちは墓[はか]へ行[い]った。"
  3: "そして、互[たが]いに話[はな]し合[あ]った。「だれがわたしたちのために、墓[はか]の入[い]り口[ぐち]からあの石[いし]を転[ころ]がしてくれるのだろう。」"
  4: "ところが、目[め]を上[あ]げると、あの石[いし]はすでに転[ころ]がされているのが見[み]えた。石[いし]はたいそう大[おお]きかったからである。"
  5: "墓[はか]の中[なか]に入[はい]ると、右側[みぎがわ]に白[しろ]い衣[ころも]を着[き]た若者[わかもの]が座[すわ]っているのが見[み]え、彼女[かのじょ]たちはひどく驚[おどろ]いた。"
  6: "若者[わかもの]は言[い]った。「驚[おどろ]くことはない。あなたがたは、十字架[じゅうじか]につけられたナザレのイエスを捜[さが]している。あの方[かた]は復活[ふっかつ]された。ここにはおられない。ご覧[らん]なさい、お納[おさ]めしてあった場所[ばしょ]だ。"
  7: "さあ、行[い]って、弟子[でし]たちとペトロに告[つ]げなさい。『あの方[かた]はあなたがたより先[さき]にガリラヤへ行[い]かれる。あなたがたはそこで、あの方にお会[あ]いする。あの方があなたがたに言[い]われたとおりだ。』」"
  8: "彼女[かのじょ]たちは墓[はか]から出[で]て逃[に]げた。震[ふる]えと驚[おどろ]きに捕[と]らわれて、だれにも何[なに]も言[い]わなかった。恐[おそ]ろしかったからである。"
  9: "〔週[しゅう]の初[はじ]めの日[ひ]の朝早[あさはや]く、イエスは復活[ふっかつ]して、まずマグダラのマリアに現[あらわ]れた。このマリアから、イエスはかつて七[なな]つの悪霊[あくりょう]を追[お]い出[だ]しておられた。〕"
  10: "〔マリアは行[い]って、イエスと一緒[いっしょ]にいた者[もの]たちが悲[かな]しんで泣[な]いているところへ告[つ]げた。〕"
  11: "〔彼[かれ]らは、イエスが生[い]きておられ、マリアがそれを見[み]たと聞[き]いても、信[しん]じなかった。〕"
  12: "〔その後[あと]、イエスは姿[すがた]を変[か]えて、畑[はたけ]の方[ほう]へ向[む]かう二人[ふたり]の者[もの]に現[あらわ]れた。〕"
  13: "〔二人[ふたり]は帰[かえ]って、ほかの者[もの]たちに告[つ]げたが、彼[かれ]らもそれを信[しん]じなかった。〕"
  14: "〔やがて、イエスは十一人[じゅういちにん]が食卓[しょくたく]に着[つ]いているところに現[あらわ]れ、彼[かれ]らの不信仰[ふしんこう]と心[こころ]の頑[かたくな]さをお責[せ]めになった。復活[ふっかつ]したイエスを見[み]た者[もの]たちの言[い]うことを信[しん]じなかったからである。〕"
  15: "〔イエスは彼[かれ]らに言[い]われた。「<j>あなたがたは全世界[ぜんせかい]に出[で]て行[い]き、すべての被造物[ひぞうぶつ]に福音[ふくいん]を宣[の]べ伝[つた]えなさい。</j>」〕"
  16: "〔<j>信[しん]じて洗礼[せんれい]を受[う]けた者[もの]は救[すく]われ、信[しん]じない者[もの]は罪[つみ]に定[さだ]められる。</j>〕"
  17: "〔<j>信[しん]じた者[もの]には、次[つぎ]のようなしるしが伴[とも]う。わたしの名[な]によって悪霊[あくりょう]を追[お]い出[だ]し、新[あたら]しい異言[いげん]を語[かた]り、</j>〕"
  18: "〔<j>手[て]で蛇[へび]を取[と]り上[あ]げ、死[し]に至[いた]る毒[どく]を飲[の]んでも害[がい]を受[う]けず、病人[びょうにん]に手[て]を置[お]けば、その人[ひと]は癒[いや]される。</j>〕"
  19: "〔主[しゅ]イエスは、彼[かれ]らに語[かた]り終[お]えると天[てん]に上[のぼ]られ、神[かみ]の右[みぎ]に座[すわ]られた。〕"
  20: "〔弟子[でし]たちは出[で]て行[い]き、至[いた]るところで福音[ふくいん]を宣[の]べ伝[つた]えた。主[しゅ]は彼[かれ]らとともに働[はたら]き、伴[とも]うしるしによって、その言葉[ことば]を確[たし]かなものとされた。〕"

notes:
  1: "ἠγόρασαν ἀρώματα — «купили благовония»; 香料. ἵνα ἐλθοῦσαι ἀλείψωσιν — «чтобы, придя, помазать»; イエスに塗るための. Жёны — те же, что в 15:40–41."
  2: "λίαν πρωΐ — «очень рано»; ἀνατείλαντος τοῦ ἡλίου — «когда взошло солнце»; 日が昇るころ, как в Мф 28:1 (週の初めの日が明けかけたころ)."
  3: "ἀποκυλίσει — «отвалит»; 転がしてくれる. Жёны ещё не знают о страже и печати (ср. Мф 27:62–66)."
  4: "ἀναβλέψασαι — «подняв взор»; 目を上げると. ἀποκεκύλισται — перфект, «уже отвален»; すでに転がされている."
  5: "νεανίσκος — «юноша»; 若者 (в тексте не назван ангелом, ср. Мф 28:2–5). ἐν τοῖς δεξιοῖς — «по правую сторону»; 右側に. ἐξεθαμβήθησαν — «пришли в ужас»; ひどく驚いた."
  6: "Слова юноши (ангела) — не красные. ἠγέρθη — «восстал»; 復活された. ἴδε ὁ τόπος — «вот место»; ご覧なさい、お納めしてあった場所だ. Речь продолжается в 16:7."
  7: "Слова ангела — не красные (в отличие от 16:15–18). τῷ Πέτρῳ — ペトロ (отдельно, как в греческом). προάγει ὑμᾶς — «идёт перед вами»; あなたがたより先に. καθὼς εἶπεν ὑμῖν — 言われたとおりだ; ср. 14:28."
  8: "εἶχεν γὰρ αὐτὰς τρόμος καὶ ἔκστασις — «ибо объял их трепет и изумление»; 震えと驚きに捕らわれて. ἐφοβοῦντο γάρ — «ибо боялись»; 恐ろしかったからである — стих кончается этим, без сглаживания."
  9: "Длинное окончание (16:9–20) отсутствует в древнейших списках; Церковь читает его как часть Евангелия — по решению для книги каждый стих 9–20 целиком в 〔…〕. ἐφάνη πρῶτον — «явился сначала»; まず…に現れた. ἑπτὰ δαιμόνια — 七つの悪霊."
  11: "ἠπίστησαν — «не поверили»; 信じなかった, без сглаживания."
  12: "ἐν ἑτέρᾳ μορφῇ — «в ином образе»; 姿を変えて. εἰς ἀγρόν — «в поле, за город»; 畑の方へ."
  14: "ὠνείδισεν — «укорил»; お責めになった. ἀπιστίαν καὶ σκληροκαρδίαν — 不信仰と心の頑なさ, оба слова сохранены. τοῖς θεασαμένοις… ἐγηγερμένον — «видевшим Его воскресшим»; 復活したイエスを見た者たち."
  15: "Слова Христа красные (16:15–18). εἰς τὸν κόσμον ἅπαντα — 全世界に. πάσῃ τῇ κτίσει — «всей твари»; すべての被造物に, без сглаживания в «людям»."
  16: "ὁ πιστεύσας καὶ βαπτισθείς — «уверовавший и крестившийся»; σωθήσεται — 救われる. κατακριθήσεται — «будет осуждён»; 罪に定められる (не «погибнет»)."
  17: "σημεῖα — しるし. δαιμόνια ἐκβαλοῦσιν — 悪霊を追い出し. γλώσσαις… καιναῖς — «новыми языками»; 新しい異言. Слова Христа красные."
  18: "ὄφεις ἀροῦσιν — «будут брать змей»; 手で蛇を取り上げ. θανάσιμόν τι — «что-либо смертоносное»; 死に至る毒. ἐπὶ ἀρρώστους χεῖρας ἐπιθήσουσιν — «возложат руки на больных»; 病人に手を置けば. καλῶς ἕξουσιν — «будут здоровы»; 癒される."
  19: "Ὁ μὲν οὖν κύριος Ἰησοῦς — 主イエス. ἀνελήμφθη — «был вознесён»; 天に上られ. ἐκάθισεν ἐκ δεξιῶν τοῦ θεοῦ — 神の右に座られた. Повествование, не красное."
  20: "ἐξελθόντες ἐκήρυξαν πανταχοῦ — 出て行き、至るところで宣べ伝えた. τοῦ κυρίου συνεργοῦντος — «Господь содействовал»; 主は彼らとともに働き. βεβαιοῦντος — «подтверждая»; 確かなものとされた. В jp-joc добавлено «アミン»; в критическом тексте его нет — не добавляю."
