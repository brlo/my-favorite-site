# jp-box, Евангелие от Марка, глава 16. Переписано по новому конвейеру.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# jp-ni не использовался.
#
# Глава Воскресения: жёны у гроба (1–8), длинное окончание (9–20).
# Слова Христа — в <j>…</j> (15–18); слова ангела (6–7) и Марии — вне тегов.
# 16:9–20 нет в критическом тексте: по решению для книги каждый стих 9–20
# целиком обёрнут в 〔…〕 (внутри — обычная разметка, слова Христа в <j>).

