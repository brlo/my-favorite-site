verses:
  1: "律法[りっぽう]は、来[きた]るべき善[よ]きものの影[かげ]であって、そのものの姿[すがた]そのものではない。それゆえ、年[とし]ごとに絶[た]えずささげられる同[おな]じいけにえによっても、近[ちか]づく者[もの]たちを決[けっ]して完全[かんぜん]にすることはできない。"
  2: "もしそうでなければ、ささげることはやんでいたはずではないか。礼拝[れいはい]する者[もの]たちは、一度[いちど]清[きよ]められたなら、もはや罪[つみ]の意識[いしき]を持[も]たなかったからである。"
  3: "しかし、それらのいけにえによって、年[とし]ごとに罪[つみ]が思[おも]い起[おこ]されるのである。"
  4: "雄牛[おうし]や雄山羊[おやぎ]の血[ち]が、罪[つみ]を取[と]り除[のぞ]くことはできないからである。"
  5: "それゆえ、キリストは世[よ]に来[こ]られるにあたって、こう言[い]われる。「いけにえとささげ物[もの]とを、あなたはお望[のぞ]みにならなかったが、わたしのためにからだを備[そな]えてくださった。"
  6: "焼[や]き尽[つ]くすいけにえも、罪[つみ]のためのいけにえも、あなたは喜[よろこ]ばれなかった。"
  7: "そのとき、わたしは言[い]った。『見[み]よ、わたしは来[き]ました。巻物[まきもの]の書[しょ]に、わたしについて記[しる]されています。神[かみ]よ、あなたの御心[みこころ]を行[おこな]うために。』」"
  8: "上[うえ]には、「いけにえとささげ物[もの]と、焼[や]き尽[つ]くすいけにえと、罪[つみ]のためのいけにえとを、あなたは望[のぞ]まず、喜[よろこ]ばれなかった」と言[い]い、これらは律法[りっぽう]に従[したが]ってささげられるものであり、"
  9: "次[つぎ]に、「見[み]よ、わたしは来[き]ました。あなたの御心[みこころ]を行[おこな]うために」と言[い]われた。第二[だい]のものを立[た]てるために、第一[だい]のものを取[と]り除[のぞ]かれるのである。"
  10: "この御心[みこころ]によって、わたしたちは、イエス・キリストの体[からだ]がただ一度[いちど]ささげられたことによって、聖[きよ]められたのである。"
  11: "どの祭司[さいし]も、日[ひ]ごとに務[つと]めに立[た]ち、同[おな]じいけにえを何度[なんど]もささげているが、それらは決[けっ]して罪[つみ]を取[と]り除[のぞ]くことができない。"
  12: "しかし、この方[かた]は、罪[つみ]のために一[ひと]つのいけにえをささげて後[のち]、永遠[えいえん]に神[かみ]の右[みぎ]に座[すわ]り、"
  13: "それから後[あと]は、敵[てき]がご自身[じしん]の足台[あしだい]とされるまで、待[ま]っておられるのである。"
  14: "というのは、この方[かた]は、一[ひと]つのささげ物[もの]によって、聖[きよ]められる者[もの]たちを、永遠[えいえん]に完全[かんぜん]な者[もの]とされたからである。"
  15: "{聖霊[せいれい]|聖神[せいしん]}も、わたしたちに証[あかし]して、こう言[い]われる。"
  16: "「これが、あの日[ひ]々[び]の後[のち]に、わたしが彼[かれ]らと結[むす]ぶ契約[けいやく]である、と主[しゅ]は言[い]われる。わたしはわたしの律法[りっぽう]を彼[かれ]らの心[こころ]に置[お]き、それを彼[かれ]らの思[おも]いに記[しる]す。」"
  17: "「そして、彼[かれ]らの罪[つみ]と不法[ふほう]とを、もはや思[おも]い出[だ]さない。」"
  18: "これらのものが赦[ゆる]されているところでは、もはや罪[つみ]のためのいけにえはない。"
  19: "兄弟[きょうだい]たちよ。わたしたちは、イエスの血[ち]によって聖所[せいしょ]に入[はい]る大胆[だいたん]さを持[も]ち、"
  20: "この方[かた]がわたしたちのために開[ひら]いてくださった、垂[た]れ幕[まく]なるご自身[じしん]の肉[にく]を通[とお]る、新[あたら]しく生[い]きた道[みち]によって、"
  21: "また、神[かみ]の家[いえ]を治[おさ]める偉大[いだい]な祭司[さいし]を持[も]っているのだから、"
  22: "心[こころ]を悪[わる]い良心[りょうしん]から振[ふ]りかけられて清[きよ]められ、体[からだ]を清[きよ]い水[みず]で洗[あら]われた者[もの]として、誠実[せいじつ]な心[こころ]と、信仰[しんこう]の十分[じゅうぶん]な確信[かくしん]とをもって、神[かみ]に近[ちか]づこう。"
  23: "約束[やくそく]してくださった方[かた]は真実[しんじつ]であるから、わたしたちの希望[きぼう]の告白[こくはく]を、揺[ゆ]るがないように固[かた]く保[たも]とう。"
  24: "また、互[たがい]に心[こころ]を配[くば]り、愛[あい]と善[よ]い業[わざ]へと励[はげ]まし合[あ]おう。"
  25: "ある人[ひと]たちのように、集[あつ]まりをやめてしまわず、むしろ、その日[ひ]が近[ちか]づいているのを見[み]て、ますます互[たがい]に勧[すす]め合[あ]おう。"
  26: "というのは、わたしたちが真理[しんり]の知識[ちしき]を受[う]けた後[のち]、自[みずか]ら進[すす]んで罪[つみ]を犯[おか]すなら、もはや罪[つみ]のためのいけにえは残[のこ]っていない。"
  27: "残[のこ]っているのは、裁[さば]きを恐[おそ]れつつ待[ま]つことと、敵[てき]を焼[や]き尽[つ]くそうとする激[はげ]しい火[ひ]だけである。"
  28: "モーセの律法[りっぽう]を捨[す]てる者[もの]は、二[に]人[にん]、三[さん]人[にん]の証人[しょうにん]の証言[しょうげん]によって、あわれみを受[う]けることなく死[し]ぬ。"
  29: "まして、神[かみ]の御子[みこ]を踏[ふ]みつけ、自分[じぶん]が聖[きよ]められた契約[けいやく]の血[ち]を聖[せい]でないものと見[み]なし、{恵[めぐ]み|恩寵[おんちょう]}の霊[れい]を侮[あなど]る者[もの]は、どれほど重[おも]い罰[ばつ]を受[う]けるにふさわしいと思[おも]われるであろうか。"
  30: "わたしたちは、「復讐[ふくしゅう]はわたしのもの、わたしが報[むく]いる」と言[い]われた方[かた]を知[し]っている。また、「主[しゅ]はご自身[じしん]の民[たみ]を裁[さば]かれる」。"
  31: "生[い]ける神[かみ]の手[て]に落[お]ちることは、恐[おそ]るべきことである。"
  32: "あなたがたは、光[ひかり]に照[て]らされた後[のち]、多[おお]くの苦[くる]しみの戦[たたか]いを耐[た]え忍[しの]んだ、初[はじ]めの日[ひ]々[び]を思[おも]い起[おこ]してほしい。"
  33: "あなたがたは、あるときは、ののしりや苦[くる]しみの中[なか]で見[み]せ物[もの]にされ、あるときは、そのような目[め]に遭[あ]っている人[ひと]たちの仲間[なかま]となった。"
  34: "あなたがたは、囚[とら]われている者[もの]たちにも心[こころ]を寄[よ]せ、自分[じぶん]の財産[ざいさん]が奪[うば]われても、それを喜[よろこ]んで受[う]け入[い]れた。自分[じぶん]たちには、〔天[てん]に、〕さらにまさった、いつまでも残[のこ]る所有[しょゆう]があることを知[し]っていたからである。"
  35: "だから、あなたがたの大胆[だいたん]さを捨[す]ててはならない。そこには大[おお]きな報[むく]いが伴[ともな]っているからである。"
  36: "あなたがたには忍耐[にんたい]が必要[ひつよう]である。それは、神[かみ]の御心[みこころ]を行[おこな]って、約束[やくそく]のものを受[う]けるためである。"
  37: "「もう少[すこ]し、ほんの少[すこ]しすれば、来[きた]るべき方[かた]が来[こ]られ、遅[おそ]くはならない。"
  38: "わたしの義人[ぎじん]は信仰[しんこう]によって生[い]きる。もし退[しりぞ]くなら、わたしの心[こころ]はその者[もの]を喜[よろこ]ばない。」"
  39: "しかし、わたしたちは退[しりぞ]いて滅[ほろ]びに至[いた]る者[もの]ではなく、信仰[しんこう]によって魂[たましい]を保[たも]つ者[もの]である。"

notes:
  1: "Σκιὰν γὰρ ἔχων ὁ νόμος — 律法は…影であって (закон «имеет тень», а не есть тень; родительный отношения). οὐκ αὐτὴν τὴν εἰκόνα τῶν πραγμάτων — そのものの姿そのものではない (εἰκών — образ, в отличие от σκιά). κατ᾽ ἐνιαυτόν — 年ごとに. εἰς τὸ διηνεκές — 絶えず (постоянно, «до конца»). τελειῶσαι — 完全にする (термин книги: τελειόω, ср. 9:9; 10:14)."
  2: "ἐπεὶ οὐκ ἂν ἐπαύσαντο προσφερόμεναι — ささげることはやんでいたはずではないか; греч. вопрос с отрицанием, ответ подразумевается положительный, поэтому не «не перестали бы». διὰ τὸ μηδεμίαν ἔχειν ἔτι συνείδησιν ἁμαρτιῶν — もはや罪の意識を持たなかった; συνείδησις — 良心/意識, здесь сознание вины."
  3: "ἀλλ᾿ ἐν αὐταῖς ἀνάμνησις ἁμαρτιῶν κατ᾿ ἐνιαυτόν — それらのいけにえによって、年ごとに罪が思い起こされる; ἀνάμνησις — 思い起こし, не «память» как способность."
  4: "ἀδύνατον γὰρ αἷμα ταύρων καὶ τράγων ἀφαιρεῖν ἁμαρτίας — 雄牛や雄山羊の血が罪を取り除くことはできない; ἀφαιρέω — «уносить, устранять», не «омывать»."
  5: "Διὸ εἰσερχόμενος εἰς τὸν κόσμον λέγει — それゆえ、キリストは世に来られるにあたって、こう言われる. Пс 40:6–8 (LXX 39:7–9) — цитата Писания, поэтому 「…」 без <j>: это слова Христа, но красное по книге не ставится (ср. Рим 10; Евр 2). σῶμα δὲ κατηρτίσω μοι — わたしのためにからだを備えてくださった; в евр. тексте Пс 40 стоит «уши Ты открыл мне», а LXX и Евр читают σῶμα — совпадение с LXX сохранено."
  6: "ὁλοκαυτώματα καὶ περὶ ἁμαρτίας — 焼き尽くすいけにえも、罪のためのいけにえも; ὁλοκαύτωμα передано 焼[や]き尽[つ]くすいけにえ (первое место в книге), περὶ ἁμαρτίας — 罪のためのいけにえ (жертва за грех, ср. 10:8)."
  7: "τότε εἶπον — そのとき、わたしは言った (аорист от лица Христа). Ἰδοὺ ἥκω — 見よ、わたしは来ました; вложенная речь внутри цитаты — 『…』, как вложенная речь в Деян 2:34. ἐν κεφαλίδι βιβλίου γέγραπται περὶ ἐμοῦ — 巻物の書に、わたしについて記されています; κεφαλίς — «свиток, глава». τοῦ ποιῆσαι … τὸ θέλημά σου — あなたの御心を行うために."
  8: "ἀνώτερον λέγων — 上には…と言い; повтор тех же слов, что в 5–6, поэтому снова 「…」. αἵτινες κατὰ νόμον προσφέρονται — これらは律法に従ってささげられるものであり."
  9: "τότε εἴρηκεν — 次に…と言われた (perfect: сказано и остаётся). Ἰδοὺ ἥκω τοῦ ποιῆσαι τὸ θέλημά σου — 見よ、わたしは来ました。あなたの御心を行うために; слова «神よ» в базе нет, не добавлено. ἀναιρεῖ τὸ πρῶτον ἵνα τὸ δεύτερον στήσῃ — 第二のものを立てるために、第一のものを取り除かれる; ἀναιρέω — «устранять», στήσῃ — «поставить, утвердить»."
  10: "ἐν ᾧ θελήματι — この御心によって. ἡγιασμένοι ἐσμὲν — 聖められた (perfect: состояние). διὰ τῆς προσφορᾶς τοῦ σώματος Ἰησοῦ Χριστοῦ ἐφάπαξ — イエス・キリストの体がただ一度ささげられたことによって."
  11: "πᾶς μὲν ἱερεὺς ἕστηκεν καθ᾿ ἡμέραν λειτουργῶν — どの祭司も、日ごとに務めに立ち…ている; ἕστηκεν — perfect от ἵστημι, «стоит» (поза служащего, в отличие от «сел» в 12 ст.). οὐδέποτε δύνανται περιελεῖν ἁμαρτίας — 決して罪を取り除くことができない."
  12: "οὗτος δὲ … ἐκάθισεν ἐν δεξιᾷ τοῦ θεοῦ — この方は…神の右に座り; ἐκάθισεν — аорист, совершённое действие, противопоставлено ἕστηκεν (11). εἰς τὸ διηνεκές — 永遠に."
  13: "τὸ λοιπὸν ἐκδεχόμενος — それから後は…待っておられる; ἐκδέχομαι — «ожидать», ср. 10:13; 11:10. ἕως τεθῶσιν οἱ ἐχθροὶ αὐτοῦ ὑποπόδιον τῶν ποδῶν αὐτοῦ — 敵がご自身の足台とされるまで (Пс 109:1)."
  14: "μιᾷ γὰρ προσφορᾷ τετελείωκεν εἰς τὸ διηνεκὲς τοὺς ἁγιαζομένους — 一つのささげ物によって、聖められる者たちを永遠に完全な者とされた; настоящее причастие ἁγιαζομένους — «освящаемых», процесс не отменён."
  15: "Μαρτυρεῖ δὲ ἡμῖν καὶ τὸ πνεῦμα τὸ ἅγιον — 聖霊も、わたしたちに証して…言われる; πνεῦμα ἅγιον → пара {聖霊|聖神}. Стих обрывается на «μετὰ γὰρ τὸ εἰρηκέναι», продолжение — в 16."
  16: "Иер 31:33–34; продолжение цитаты после «сказав прежде». Αὕτη ἡ διαθήκη ἣν διαθήσομαι πρὸς αὐτούς — これが、わたしが彼らと結ぶ契約である. μετὰ τὰς ἡμέρας ἐκείνας — あの日々の後に. λέγει κύριος — と主は言われる (в середине цитаты, как в греч.). διδοὺς νόμους μου ἐπὶ καρδίας αὐτῶν — わたしの律法を彼らの心に置き; ἐπιγράψω — 記す."
  17: "καὶ τῶν ἁμαρτιῶν αὐτῶν καὶ τῶν ἀνομιῶν αὐτῶν οὐ μὴ μνησθήσομαι ἔτι — 彼らの罪と不法とを、もはや思い出さない; οὐ μή + conj. — сильное отрицание, передано もはや…ない."
  18: "ὅπου δὲ ἄφεσις τούτων — これらのものが赦されているところでは. οὐκέτι προσφορὰ περὶ ἁμαρτίας — もはや罪のためのいけにえはない. Вывод из 16–17, а не новый аргумент."
  19: "Ἔχοντες οὖν, ἀδελφοί, παρρησίαν — 兄弟たちよ、わたしたちは…大胆さを持ち; παρρησία — 大胆さ (свобода, дерзновение), ср. 10:35. εἰς τὴν εἴσοδον τῶν ἁγίων — 聖所に入ること (вход в святилище). ἐν τῷ αἵματι Ἰησοῦ — イエスの血によって. Период 19–22 не дробится: причастия ἔχοντες (19) и ἔχοντες (21) ведут к императиву προσερχώμεθα (22)."
  20: "ἣν ἐνεκαίνισεν ἡμῖν ὁδὸν πρόσφατον καὶ ζῶσαν — わたしたちのために開いてくださった、新しい生きた道; ἐγκαινίζω — «открывать, вводить в употребление» (ср. 9:18), πρόσφατος — «новый, недавно явленный». διὰ τοῦ καταπετάσματος, τοῦτ᾽ ἔστιν τῆς σαρκὸς αὐτοῦ — 垂れ幕なるご自身の肉を通る; καταπέτασμα — 垂[た]れ幕[まく], как 9:3."
  21: "καὶ ἱερέα μέγαν ἐπὶ τὸν οἶκον τοῦ θεοῦ — 神の家を治める偉大な祭司; ἐπί + acc. — «над домом», не «в доме»."
  22: "προσερχώμεθα — 近づこう (увещательное, 1 л. мн. ч.). μετὰ ἀληθινῆς καρδίας — 誠実な心で. ἐν πληροφορίᾳ πίστεως — 信仰の十分な確信をもって (πληροφορία — полная уверенность, ср. 1 Сол 1:5). ῥεραντισμένοι τὰς καρδίας ἀπὸ συνειδήσεως πονηρᾶς — 心を悪い良心から振りかけられて清められ. λελουσμένοι τὸ σῶμα ὕδατι καθαρῷ — 体を清い水で洗われて; оба причастия — perfect, состояние."
  23: "κατέχωμεν τὴν ὁμολογίαν τῆς ἐλπίδος ἀκλινῆ — 希望の告白を、揺るがないように固く保とう; ἀκλινής — «неколебимый». πιστὸς γὰρ ὁ ἐπαγγειλάμενος — 約束してくださった方は真実である; основание надежды — верность Обещавшего."
  24: "καὶ κατανοῶμεν ἀλλήλους — 互いに心を配り; κατανοέω — «всматриваться, обращать внимание». εἰς παροξυσμὸν ἀγάπης καὶ καλῶν ἔργων — 愛と善い業へと励まし合うために; παροξυσμός — «побуждение, раздражение», здесь положительно."
  25: "μὴ ἐγκαταλείποντες τὴν ἐπισυναγωγὴν ἑαυτῶν — 集まりをやめてしまわず; ἐπισυναγωγή — собрание верных. καθὼς ἔθος τισίν — ある人たちのように. παρακαλοῦντες — 勧め合おう. τοσοῦτῳ μᾶλλον ὅσῳ βλέπετε ἐγγίζουσαν τὴν ἡμέραν — その日が近づいているのを見て、ますます."
  26: "Ἑκουσίως γὰρ ἁμαρτανόντων ἡμῶν — 自ら進んで罪を犯すなら; ἑκουσίως — «добровольно, сознательно», не «по немощи». μετὰ τὸ λαβεῖν τὴν ἐπίγνωσιν τῆς ἀληθείας — 真理の知識を受けた後に. οὐκέτι … ἀπολείπεται θυσία — もはやいけにえは残っていない."
  27: "φοβερά δέ τις ἐκδοχὴ κρίσεως — 裁きを恐れつつ待つこと; ἐκδοχή — «ожидание». πυρὸς ζῆλος ἐσθίειν μέλλοντος τοὺς ὑπεναντίους — 敵を焼き尽くそうとする激しい火; ζῆλος — «пыл, ярость», не «ревность»."
  28: "ἀθετήσας τις νόμον Μωϋσέως — モーセの律法を捨てる者; ἀθετέω — «отвергать, отменять» (ср. 9:26 ἀθέτησις). χωρὶς οἰκτιρμῶν — あわれみを受けることなく. ἐπὶ δυσὶν ἢ τρισὶν μάρτυσιν — 二人、三人の証人の証言によって (Втор 17:6)."
  29: "πόσῳ δοκεῖτε χείρονος ἀξιωθήσεται τιμωρίας — どれほど重い罰を受けるにふさわしいと思われるか; вопрос, как в 13–14 ст. (в 29 — риторический). ὁ τὸν υἱὸν τοῦ θεοῦ καταπατήσας — 神の御子を踏みつけ. τὸ αἷμα τῆς διαθήκης κοινὸν ἡγησάμενος ἐν ᾧ ἡγιάσθη — 自分が聖められた契約の血を聖でないものと見なし; κοινός — «обычный, нечистый», противоположность ἅγιος. τὸ πνεῦμα τῆς χάριτος ἐνυβρίσας — 恵みの霊を侮る; в греч. πνεῦμα без ἅγιον, поэтому 霊[れい] без кальки — правило корпуса (как 4:12? ср. 1 Тим 4:1); пара {聖霊|聖神} здесь не ставится."
  30: "οἴδαμεν γὰρ τὸν εἰπόντα — わたしたちは…言われた方を知っている. Втор 32:35–36; две цитаты подряд, каждая в 「…」. Ἐμοὶ ἐκδίκησις, ἐγὼ ἀνταποδώσω — 復讐はわたしのもの、わたしが報いる (Рим 12:19). Κρινεῖ κύριος τὸν λαὸν αὐτοῦ — 主はご自身の民を裁かれる."
  31: "φοβερὸν τὸ ἐμπεσεῖν εἰς χεῖρας θεοῦ ζῶντος — 生ける神の手に落ちることは恐るべきことである; «страшно», не «ужасно»; ср. 10:27 φοβερά."
  32: "Ἀναμιμνῄσκεσθε δὲ τὰς πρότερον ἡμέρας — 初めの日々を思い起こしてほしい. ἐν αἷς φωτισθέντες — 光に照らされた後; φωτίζω — «просвещать», о крещении/научении. πολλὴν ἄθλησιν ὑπεμείνατε παθημάτων — 多くの苦しみの戦いを耐え忍んだ; ἄθλησις — «состязание, борьба» (атлетический образ)."
  33: "τοῦτο μὲν ὀνειδισμοῖς τε καὶ θλίψεσιν θεατριζόμενοι — あるときは、ののしりや苦しみの中で見せ物にされ; θεατρίζω — «выставлять на позор, как в театре». τοῦτο δὲ κοινωνοὶ τῶν οὕτως ἀναστρεφομένων γενηθέντες — あるときは、そのような目に遭っている人たちの仲間となった."
  34: "καὶ γὰρ τοῖς δεσμίοις συνεπαθήσατε — 囚われている者たちにも心を寄せ; в базе δεσμίοις («узникам»), церковный текст (Елизаветинская «узам моим», jp-joc「我が縲絏」) читает δεσμοῖς μου — оставлено по базе. τὴν ἁρπαγὴν τῶν ὑπαρχόντων ὑμῶν μετὰ χαρᾶς προσεδέξασθε — 財産が奪われても、それを喜んで受け入れた. κρείττονα ὕπαρξιν καὶ μένουσαν — さらにまさった、いつまでも残る所有. В базе нет ἐν οὐρανοῖς, церковный текст (Елизаветинская «на небесех», jp-joc「天に在る」) читает с ним — 〔天に〕."
  35: "μὴ ἀποβάλητε οὖν τὴν παρρησίαν ὑμῶν — あなたがたの大胆さを捨ててはならない; παρρησία — ср. 10:19. ἥτις ἔχει μεγάλην μισθαποδοσίαν — そこには大きな報いが伴っている; μισθαποδοσία — «воздаяние» (ср. 11:26)."
  36: "ὑπομονῆς γὰρ ἔχετε χρείαν — あなたがたには忍耐が必要である. ἵνα τὸ θέλημα τοῦ θεοῦ ποιήσαντες κομίσησθε τὴν ἐπαγγελίαν — 神の御心を行って、約束のものを受けるため; κομίζω — «получать, уносить с собой» (ср. 11:13,39)."
  37: "Авв 2:3–4; цитата без вводной формулы, но продолжает речь Бога, поэтому 「…」. ἔτι γὰρ μικρὸν ὅσον ὅσον — もう少し、ほんの少しすれば; удвоение ὅσον передано повтором ほんの. ὁ ἐρχόμενος ἥξει καὶ οὐ χρονίσει — 来るべき方が来られ、遅くはならない."
  38: "ὁ δὲ δίκαιός μου ἐκ πίστεως ζήσεται — わたしの義人は信仰によって生きる; μου относится к «праведнику» (так в базе), не сглажено. ἐὰν ὑποστείληται — もし退くなら; ὑποστέλλω — «отступать, уклоняться». οὐκ εὐδοκεῖ ἡ ψυχή μου ἐν αὐτῷ — わたしの心はその者を喜ばない."
  39: "ἡμεῖς δὲ οὐκ ἐσμὲν ὑποστολῆς εἰς ἀπώλειαν — わたしたちは退いて滅びに至る者ではなく; ὑποστολή — «отступление» (слово, однокоренное ὑποστείληται в 38). πίστεως εἰς περιποίησιν ψυχῆς — 信仰によって魂を保つ者; περιποίησις — «приобретение, сохранение» (ср. Еф 1:14)."
