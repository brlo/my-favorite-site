# jp-box, Послание к Евреям, глава 10. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 10: тень и образ (1–4), слова Христа при входе в мир (5–10),
# единая жертва и седение одесную (11–18), увещание о дерзновении (19–25),
# произвольный грех и суд (26–31), память прежних дней и вера (32–39).
# Красного нет: 10:5–7 — слова Христа, но это цитата Писания, поэтому 「…」 без <j>
# (решение по книге: так в корпусе — Рим 10, Евр 2). Синего <mo> тоже нет.
# 〔…〕: 10:34 — церковное ἐν οὐρανοῖς (Елизаветинская «на небесех», jp-joc「天に在る」);
# в базе его нет (проверено bracket_check). 10:5–7, 10:8–9, 10:16–17, 10:30, 10:37–38 —
# цитаты Писания в 「…」; атрибуция — в notes.
# Сносок ⟨…⟩ в главе нет: все слова уже встречались в корпусе. jp-ni не использовался.

