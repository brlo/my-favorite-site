# jp-box, Псалтирь, псалом 2. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация — славяно-синодальная (csl-ru): в слав. надписание отдельным стихом
# не стоит, поэтому наш стих 0 (надписание) влит в начало стиха 1; дальше номера 1..N.
# Псалом 2: мятеж народов (1–3), смех Божий и поставление Царя на Сионе (4–6),
# определение Отца о Сыне (7–9), увещание царям (10–12).
# Красного и синего нет: это пророчество, а не прямая речь Христа в Евангелии
# (слова Отца о Сыне в 7 и слова Сына в 7–9 — не красные; см. журнал решений).
# Кавычки: речь народов (3), слова Бога (6) и слова Господа в 7–9 — 「…」
# (речь самого псалмопевца в кавычки не берётся, поэтому это первый уровень).
# 〔…〕 нет: все слова в gr-lxx-byz есть.
# セラ (διάψαλμα, в конце ст. 2) не передаётся — по решению пользователя, как у jp-joc.
# Сносок ⟨…⟩ нет. jp-ni не использовался.

tr_code: jp-box
book: ps
chapter: 2
draft: true

verses:
  1: "ダビデの詩[うた]。なぜ、諸国[しょこく]の民[たみ]は騒[さわ]ぎ立[た]ち、もろもろの民[たみ]はむなしいことを企[くわだ]てるのか。"
  2: "地[ち]の王[おう]たちは立[た]ち並[なら]び、支配者[しはいしゃ]たちはそろって、主[しゅ]と、その油[あぶら]を注[そそ]がれた者[もの]とに逆[さから]う。"
  3: "「彼[かれ]らの縄[なわ]を断[た]ち切[き]り、彼[かれ]らの鎖[くさり]をわたしたちから投[な]げ捨[す]てよう」と。"
  4: "天[てん]に座[すわ]る方[かた]は彼[かれ]らを笑[わら]い、主[しゅ]は彼[かれ]らを嘲[あざけ]られる。"
  5: "そして、怒[いか]りのうちに彼[かれ]らに告[つ]げ、激[はげ]しい憤[いきどお]りのうちに彼[かれ]らを恐[おそ]れさせられる。"
  6: "「わたしは、わたしの聖[せい]なる山[やま]シオンに、わたしの王[おう]を立[た]てた」と。"
  7: "わたしは主[しゅ]の定[さだ]めを語[かた]ろう。主[しゅ]はわたしに言[い]われた。「あなたはわたしの子[こ]である。わたしは今日[きょう]、あなたを生[う]んだ。"
  8: "わたしに求[もと]めよ。そうすれば、あなたの受[う]け継[ぎ]として諸国[しょこく]の民[たみ]を、あなたの所有[しょゆう]として地[ち]の果[は]てまで与[あた]えよう。"
  9: "あなたは鉄[てつ]の杖[つえ]で彼[かれ]らを牧[ぼく]し、陶器[とうき]の器[うつわ]のように彼[かれ]らを砕[くだ]く。」"
  10: "それゆえ、王[おう]たちよ、悟[さと]れ。地[ち]の裁[さば]き人[びと]たちよ、戒[いまし]めを受[う]けよ。"
  11: "恐[おそ]れをもって主[しゅ]に仕[つか]え、震[ふる]えながら喜[よろこ]べ。"
  12: "子[こ]に口[くち]づけせよ。そうしなければ、主[しゅ]は怒[いか]り、あなたがたは道[みち]の途[と]中[ちゅう]で滅[ほろ]びる。その怒[いか]りは、まもなく燃[も]え上[あ]がるからである。幸[さいわ]いなのは、すべて主[しゅ]に寄[よ]り頼[たの]む者[もの]である。"

notes:
  1: "Ψαλμὸς τῷ Δαυιδ — ダビデの詩 (ψαλμός — «псалом», т. е. песнь под струнный инструмент). Надписание — стих 0 (в csl-ru отдельного стиха нет, влито в ст. 1), как в русской базе сайта. Ἵνα τί ἐφρύαξαν ἔθνη — なぜ諸国の民は騒ぎ立つのか (φρυάσσω — «фыркать, бушевать», образ коней). λαοὶ ἐμελέτησαν κενά — もろもろの民はむなしいことを企てる (μελετάω — «замышлять»; κενά — «пустое»)."
  2: "παρέστησαν οἱ βασιλεῖς τῆς γῆς — 地の王たちは立ち並び. ἄρχοντες συνήχθησαν ἐπὶ τὸ αὐτό — 支配者たちはそろって. κατὰ τοῦ κυρίου καὶ κατὰ τοῦ χριστοῦ αὐτοῦ — 主と、その油を注がれた者とに逆らう. χριστός здесь — «помазанник» (в церковном чтении ハリストス); キリスト не поставлено, потому что в псалме это ещё не имя, а титул. διάψαλμα в конце стиха не передаётся."
  3: "Διαρρήξωμεν τοὺς δεσμοὺς αὐτῶν — 彼らの縄を断ち切ろう. ἀπορρίψωμεν ἀφ᾽ ἡμῶν τὸν ζυγόν — 彼らの鎖をわたしたちから投げ捨てよう (ζυγός — «ярмо»; 鎖 — по параллелизму, как jp-joc и Синодальный «иго»). Речь народов — в 「」."
  4: "ὁ κατοικῶν ἐν οὐρανοῖς ἐκγελάσεται αὐτούς — 天に座る方は彼らを笑い (ἐκγελάω — «осмеять»; 座る — κατοικέω, «обитать»). ὁ κύριος ἐκμυκτηριεῖ — 主は彼らを嘲られる (ἐκμυκτηρίζω — «издеваться»)."
  5: "τότε λαλήσει πρὸς αὐτοὺς ἐν ὀργῇ — そして怒りのうちに彼らに告げ. ἐν τῷ θυμῷ αὐτοῦ ταράξει αὐτούς — 激しい憤りのうちに彼らを恐れさせられる (ταράσσω — «приводить в смятение»)."
  6: "Ἐγὼ δὲ κατεστάθην βασιλεὺς ὑπ᾽ αὐτοῦ ἐπὶ Σιων ὄρος τὸ ἅγιον αὐτοῦ — わたしは…シオンに、わたしの王を立てた. Греч. κατεστάθην — «я поставлен», но в церковном чтении и по смыслу это слова Отца о Сыне; по-японски прямая речь Отца — 「」. ἔθνος/Σιών — シオン."
  7: "διαγγέλλων τὸ πρόσταγμα κυρίου — わたしは主の定めを語ろう (πρόσταγμα — «повеление, определение»). Κύριος εἶπεν πρός με — 主はわたしに言われた. Υἱός μου εἶ σύ — あなたはわたしの子である. ἐγὼ σήμερον γεγέννηκά σε — わたしは今日、あなたを生んだ. Слова Господа — 「…」 (речь псалмопевца не в кавычках, поэтому первый уровень); красного нет: это пророчество, а не евангельская речь Христа."
  8: "αἴτησαι παρ᾽ ἐμοῦ — わたしに求めよ. δώσω σοι ἔθνη τὴν κληρονομίαν σου — あなたの受け継ぎとして諸国の民を与えよう (κληρονομία — 受け継ぎ). τὴν κατάσχεσίν σου τὰ πέρατα τῆς γῆς — あなたの所有として地の果てまで (κατάσχεσις — «владение»)."
  9: "ποιμανεῖς ἐν ῥάβδῳ σιδηρᾷ — 鉄の杖で彼らを牧し (ποιμαίνω — «пасти»; ῥάβδος — «жезл»). σκεύη κεραμικά συντρίψεις — 陶器の器のように彼らを砕く."
  10: "νῦν οὖν βασιλεῖς σύνετε — それゆえ、王たちよ、悟れ. παιδεύθητε πάντες οἱ κρίνοντες τὴν γήν — 地の裁き人たちよ、戒めを受けよ (παιδεύω — «наставлять, вразумлять»)."
  11: "δουλεύσατε τῷ κυρίῳ ἐν φόβῳ — 恐れをもって主に仕え. ἀγαλλιᾶσθε αὐτῷ ἐν τρόμῳ — 震えながら喜べ (ἀγαλλιάομαι — «ликовать»)."
  12: "δράξασθε παιδείας — 子に口づけせよ (букв. «примите наставление»; в LXX и у jp-joc — целуйте Сына, ср. Пс 2:12 в церковном чтении). μήποτε ὀργισθῇ κύριος — そうしなければ主は怒り. ἀπολεῖσθε ἐξ ὁδοῦ δικαίας — あなたがたは道の途中で滅びる. ὅταν ἐκκαυθῇ ἐν τάχει ὁ θυμὸς αὐτοῦ — その怒りはまもなく燃え上がる. μακάριοι πάντες οἱ πεποιθότες ἐπ᾽ αὐτῷ — 幸いなのは、すべて主に寄り頼む者である (πεποίθασιν — perfect, «положились и полагаются»)."
