# jp-box, Иов, глава 34. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге только 1–2; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 34: вторая речь Елиуя — призыв к мудрым слушать (2–4), пересказ слов Иова (5–9),
# Бог не неправеден: воздаёт каждому (10–12), Творец и Владыка (13–15), нелицеприятие
# и суд над нечестивыми (16–30), слово к Иову (31–37).
# Голоса: 34:1 — вводная формула Елиуя, повествование, вне кавычек; 34:2–37 — его речь,
# одна цитата 「…」. Слова Иова внутри речи — 『…』: 5–6, 9; общая речь «кто говорит
# царю» — 『…』: 18; слова человека к Богу — 『…』: 31–32.
# Нумерация по gr: 37 стихов, как в csl-ru и ru. Расхождение: слав. относит
# «Господь бо всех видит» (LXX 34:23b) к началу 34:24, а «иже сотвори землю»
# (LXX 34:13a) — к концу 34:12; держимся деления LXX (см. notes 12, 13, 23).
# 〔…〕 нет: все стихи есть в gr-lxx-byz. Сносок ⟨…⟩ нет.
# Имена — транслитерация греческого (LXX): ヨブ, エリフ.

