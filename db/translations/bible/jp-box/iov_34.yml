verses:
  1: "エリフは答[こた]えて言[い]った。"
  2: "「知恵[ちえ]ある者[もの]たちよ、わたしの言[い]うことを聞[き]け。悟[さと]りある者[もの]たちよ、良[よ]い事[こと]に耳[みみ]を傾[かたむ]けよ。"
  3: "耳[みみ]は言葉[ことば]を試[ため]し、喉[のど]は食[た]べ物[もの]を味[あじ]わうからである。"
  4: "わたしたちは互[たが]いの間[あいだ]で裁[さば]きを選[えら]び、何[なに]が良[よ]いかを見分[みわ]けよう。"
  5: "ヨブはこう言[い]った。『わたしは正[ただ]しい。しかし、主[しゅ]はわたしの裁[さば]きを取[と]り上[あ]げられた。"
  6: "わたしの裁[さば]きには偽[いつわ]りが語[かた]られ、わたしの矢[や]は、不法[ふほう]がないのに激[はげ]しい』。"
  7: "水[みず]のように嘲[あざけ]りを飲[の]む者[もの]、ヨブのような人[ひと]が、ほかにいるだろうか。"
  8: "彼[かれ]は罪[つみ]を犯[おか]したのでも、不敬[ふけい]を行[おこな]ったのでもなく、不法[ふほう]を働[はたら]く者[もの]たちと道[みち]を共[とも]にし、不敬[ふけい]な者[もの]たちとともに歩[あゆ]んだ者[もの]ではないか。"
  9: "だから、あなたは『人[ひと]には訪[おとず]れがない』と言[い]ってはならない。人[ひと]への訪れは主[しゅ]からあるのだから。"
  10: "だから、心[こころ]の悟[さと]った者[もの]たちよ、わたしの言[い]うことを聞[き]け。わたしには、主[しゅ]の前[まえ]で不敬[ふけい]を行[おこな]うこと、全能者[ぜんのうしゃ]の前[まえ]で正[ただ]しいことを乱[みだ]すことは、決[けっ]してあってはならない。"
  11: "まことに、神[かみ]は人[ひと]に、その人[ひと]が行[おこな]うとおりに報[むく]い、人[ひと]の道[みち]に応[おう]じて彼[かれ]に報[むく]いられる。"
  12: "あなたは、主[しゅ]が不合理[ふごうり]なことをされると思[おも]うのか。全能者[ぜんのうしゃ]が裁[さば]きを乱[みだ]されるだろうか。"
  13: "地[ち]を造[つく]られた方[かた]、天[てん]の下[した]と、そこにあるすべてのものを造[つく]る方[かた]は、ほかにだれがいるだろうか。"
  14: "もし神[かみ]が霊[れい]を閉[と]じ込[こ]めて、ご自分[じぶん]のもとに引[ひ]き留[と]めようと望[のぞ]まれるなら、"
  15: "すべての肉[にく]はともどもに終[お]わり、すべての人[ひと]は土[つち]に帰[かえ]る。それは、人[ひと]が造[つく]られたその場所[ばしょ]である。"
  16: "もし、あなたが戒[いまし]めを受[う]けないのなら、これを聞[き]け。わたしの言葉[ことば]の声[こえ]に耳[みみ]を傾[かたむ]けよ。"
  17: "見[み]よ。不法[ふほう]を憎[にく]み、悪[あく]を行[おこな]う者[もの]を滅[ほろ]ぼす方[かた]は、永遠[えいえん]に正[ただ]しい方[かた]である。"
  18: "王[おう]に向[む]かって『おまえは法[のり]を破[やぶ]っている』と言[い]い、支配者[しはいしゃ]たちに向かって『最も不敬[ふけい]な者[もの]よ』と言[い]う者[もの]は、不敬[ふけい]な者[もの]である。"
  19: "この方[かた]は尊[とうと]い者[もの]の顔[かお]を恥[は]じず、力[ちから]ある者[もの]に敬[うやま]いを置[お]いて、その顔[かお]を尊[とうと]ぶことを知[し]られない。"
  20: "彼[かれ]らが叫[さけ]び、人[ひと]に願[ねが]っても、それは空[むな]しく終[お]わる。彼[かれ]らは不法[ふほう]にふるまい、弱[よわ]い者[もの]たちを辱[はずかし]めたからである。"
  21: "神[かみ]は人[ひと]のわざを見[み]ておられ、彼[かれ]らのすることを何[なに]一つ見落[みおと]されない。"
  22: "不法[ふほう]を働[はたら]く者[もの]たちが隠[かく]れる場所[ばしょ]はない。"
  23: "神[かみ]はもはや人[ひと]の上[うえ]に、これ以上[いじょう]何[なに]も課[か]されない。主[しゅ]はすべての者[もの]をみな見[み]ておられるからである。"
  24: "神[かみ]は測[はか]り知[し]れないこと、数[かず]えきれないほど輝[かがや]かしく驚[おどろ]くべきことを成[な]し遂[と]げられる。"
  25: "神[かみ]は彼[かれ]らのわざを知[し]らせ、夜[よる]を巡[めぐ]らされる。彼[かれ]らは低[ひく]くされる。"
  26: "神[かみ]は不敬[ふけい]な者[もの]たちを消[け]してしまわれる。彼[かれ]らは神[かみ]の前[まえ]で目[め]に見[み]える者[もの]である。"
  27: "彼[かれ]らが神[かみ]の法[のり]から離[はな]れ、その掟[おきて]を知[し]らなかったからである。"
  28: "こうして、貧[まず]しい者[もの]の叫[さけ]びが神[かみ]のもとへ上[のぼ]り、乏[とぼ]しい者[もの]たちの叫びを聞[き]かれるのである。"
  29: "神[かみ]が静[しず]けさをお与えになれば、だれが騒[さわ]がすことができよう。神が御顔[みかお]を隠[かく]されれば、だれが神を見[み]ることができよう。それは、民[たみ]に対しても、人[ひと]に対しても、同[おな]じである。"
  30: "すなわち、民[たみ]の頑[かたくな]さのゆえに、偽[いつわ]り者[もの]を王[おう]とされる、ということである。"
  31: "まことに、力[ちから]ある方[かた]に向[む]かって『わたしは受[う]け取[と]った。もはや質[しち]を取[と]ることはしない。"
  32: "わたしには見[み]えないことを、あなたがわたしに示[しめ]してください。もしわたしが不正[ふせい]を行[おこな]ったのなら、もはや重[かさ]ねることはしない』と言[い]う者[もの]がいる。"
  33: "あなたによって、神がそれを取[と]り立[た]てられるのだろうか。あなたが拒[こば]み、あなたが選[えら]ぶのであって、わたしではないからである。あなたが知[し]っていることを語[かた]れ。"
  34: "心[こころ]の悟[さと]った人[ひと]たちは、このことをわたしに言[い]うだろう。知恵[ちえ]ある人[ひと]は、わたしの言葉[ことば]を聞[き]くだろう。"
  35: "しかし、ヨブは悟[さと]りをもって語[かた]らず、その言葉[ことば]には知識[ちしき]がない。"
  36: "しかし、ヨブよ、よく学[まな]べ。愚[おろ]かな者[もの]たちのように、これ以上[いじょう]答[こた]えを返[かえ]してはならない。"
  37: "そうしなければ、わたしたちは自分[じぶん]の罪[つみ]にさらに罪[つみ]を加[くわ]え、主[しゅ]に向[む]かって多[おお]くの言葉[ことば]を語[かた]る者[もの]として、不法[ふほう]がわたしたちに数[かぞ]えられることになる。」"

notes:
  1: "Повествование (вводная формула): Ὑπολαβὼν δὲ Ελιους λέγει — «и отвечал Елиус и говорит» (csl «Отвещав же елиус, рече»). Вне кавычек; с 34:2 начинается новая цитата (речь Елиуя), закрывается в 34:37."
  2: "Елиуй. Ἀκούσατέ μου, σοφοί — «послушайте меня, мудрые» (σοφός); ἐπιστάμενοι, ἐνωτίζεσθε τὸ καλόν — «сведущие, внимайте доброму» (ἐπιστάμενος — «знающий»; τὸ καλόν — «доброе, прекрасное»; csl «внушите (доброе)»). Начало речи."
  3: "Елиуй. ὅτι οὖς λόγους δοκιμάζει — «ибо ухо слова испытывает» (δοκιμάζω — «испытывать, разбирать»); λάρυγξ γεὺεται βρῶσιν — «гортань вкушает пищу» (λάρυγξ — «гортань, горло»; csl «гортань же вкушает брашна»)."
  4: "Елиуй. κρίσιν ἑλώμεθα ἑαυτοῖς — «суд изберём себе» (κρίσις — «суд, решение»); γνῶμεν ἀνὰ μέσον ἑαυτῶν ὅ τι καλόν — «уразумеем между собою, что добро» (csl «уразумеем посреде себе, что лучшее»)."
  5: "Елиуй. ὅτι εἴρηκεν Ιωβ — «ибо сказал Иов»; Δίκαιός εἰμι — «я прав»; ὁ κύριος ἀπήλλαξέν μου τὸ κρίμα — «Господь отнял у меня суд» (ἀπαλλάσσω — «отнимать, удалять»; κρίμα — «суд, приговор»; csl «отят ми суд»). Начало цитаты слов Иова — 『…』, продолжается в 34:6."
  6: "Елиуй. ἐψεύσατο δὲ τῷ κρίματί μου — «солгал же суду моему» (ψεύδομαι — «лгать»); βίαιον τὸ βέλος μου ἄνευ ἀδικίας — «насильственна стрела моя без неправды» (βίαιος — «сильный, насильственный»; βέλος — «стрела»; ἄνευ ἀδικίας — «без неправды»; csl «насильна стрела моя без неправды»). Тёмное место, передано буквально; здесь закрывается цитата слов Иова."
  7: "Елиуй. τίς ἀνὴρ ὥσπερ Ιωβ — «кто человек, как Иов»; πίνων μυκτηρισμὸν ὥσπερ ὕδωρ — «пьющий поругание, как воду» (μυκτηρισμός — «осмеяние, поругание»). Сказуемого нет — вопрос-восклицание; образ сохранён."
  8: "Елиуй. οὐχ ἁμαρτὼν οὐδὲ ἀσεβήσας — «не согрешив и не нечествовав»; ἢ ὁδοῦ κοινωνήσας μετὰ ποιούντων τὰ ἄνομα — «или приобщившись пути делающих беззаконие» (κοινωνέω — «быть общником»); τοῦ πορευθῆναι μετὰ ἀσεβῶν — «чтобы ходить с нечестивыми». Тёмное место LXX (отрицания при обвинении); csl держит те же формы, ru/МТ иначе — передано буквально, без сглаживания. Вопросительная конструкция 34:7 продолжается здесь («…ではないか»), как и в греч."
  9: "Елиуй. μὴ γὰρ εἴπῃς — «ибо не говори» (обращение к Иову); Οὐκ ἔσται ἐπισκοπὴ ἀνδρός — «не будет посещения человеку» (ἐπισκοπή — «посещение, надзор, взыскание»); καὶ ἐπισκοπὴ αὐτῷ παρὰ κυρίου — «и посещение ему от Господа» (csl «несть посещения мужеви, и посещения ему от Господа»). Слова Иова, которые Елиуй отвергает, — 『…』."
  10: "Елиуй. διό, συνετοὶ καρδίας, ἀκούσατέ μου — «итак, разумные сердцем, послушайте меня»; Μή μοι εἴη ἔναντι κυρίου ἀσεβῆσαι — «да не будет мне пред Господом нечествовать» (ἀσεβέω); καὶ ἔναντι παντοκράτορος ταράξαι τὸ δίκαιον — «и пред Вседержителем поколебать правое» (ταράσσω — «возмущать»; csl «возмутити правду»). Важно: в LXX и csl это слово о самом Елиуе («да не будет мне»), а в МТ/ru — «не может быть у Бога неправда»; переведено по LXX."
  11: "Елиуй. ἀποδιδοῖ ἀνθρώπῳ καθὰ ποιεῖ ἕκαστος αὐτῶν — «воздаёт человеку, как делает каждый из них» (ἀποδίδωμι); ἐν τρίβῳ ἀνδρὸς εὑρήσει αὐτόν — «на тропе мужа найдёт его» (τρίβος — «тропа, путь»; εὑρίσκω — «находить», т. е. постигнет; csl «на стези мужестей обрящет и»)."
  12: "Елиуй. οἴῃ δὲ τὸν κύριον ἄτοπα ποιήσειν — «думаешь же, что Господь сделает неуместное» (οἴομαι — «думать»; ἄτοπος — «неуместный, нелепый»); ἢ ὁ παντοκράτωρ ταράξει κρίσιν — «или Вседержитель поколеблет суд?» Слав. добавляет в конце «иже сотвори землю» — это начало LXX 34:13, держимся деления LXX."
  13: "Елиуй. ὃς ἐποίησεν τὴν γῆν — «Который сотворил землю» (слав. относит это к 34:12); τίς δέ ἐστιν ὁ ποιῶν τὴν ὑπ᾽ οὐρανὸν καὶ τὰ ἐνόντα πάντα — «кто же есть творящий поднебесную и всё, что в ней?» (τὰ ἐνόντα — «находящееся в ней»; csl «яже в ней всяческая»)."
  14: "Елиуй. εἰ γὰρ βούλοιτο συνέχειν — «ибо если бы захотел сдерживать» (συνέχω — «сдерживать, запирать»; csl «запретити»); καὶ τὸ πνεῦμα παρ᾽ αὐτῷ κατασχεῖν — «и дух при Себе удержать» (κατέχω — «удерживать»). Двойной оборот сохранён; πνεῦμα — «дух, дыхание», передано 霊[れい]."
  15: "Елиуй. τελευτήσει πᾶσα σὰρξ ὁμοθυμαδόν — «умрёт всякая плоть вместе» (ὁμοθυμαδόν — «единодушно, все вместе»; csl «умрет всяка плоть вкупе»); πᾶς δὲ βροτὸς εἰς γῆν ἀπελεύσεται, ὅθεν καὶ ἐπλάσθη — «и всякий смертный в землю пойдёт, откуда и создан был» (βροτός; πλάσσω — «лепить, создавать»)."
  16: "Елиуй. εἰ δὲ μὴ νουθετῇ — «если же не вразумляешься» (νουθετέω — «вразумлять, увещевать»; csl «аще же не увещаешися»); ἄκουε ταῦτα — «слушай это»; ἐνωτίζου φωνὴν ῥημάτων — «внимай голосу слов» (ῥήματα — «слова»; csl «внуши глас глагол»)."
  17: "Елиуй. ἰδὲ σύ — «смотри же ты»; τὸν μισοῦντα ἄνομα — «ненавидящего беззакония» (μισέω); τὸν ὀλλύντα τοὺς πονηρούς — «губящего лукавых» (ὄλλυμι — «губить»); ὄντα αἰώνιον δίκαιον — «сущего вечного праведного» (предикат при опущенной связке; csl «суща, вечна, праведна»). Тёмное место, передано буквально."
  18: "Елиуй. ἀσεβὴς ὁ λέγων βασιλεῖ Παρανομεῖς — «нечестив говорящий царю: преступаешь» (παρανομέω — «преступать закон»); ἀσεβέστατε τοῖς ἄρχουσιν — «нечестивейший» — князьям (превосходная степень в звательном падеже). Двойное обращение — к царю и к правителям; общая речь в 『…』."
  19: "Елиуй. ὃς οὐκ ἐπῃσχύνθη πρόσωπον ἐντίμου — «который не устыдился лица почтенного» (ἐπαισχύνομαι — «стыдиться»; πρόσωπον — «лицо», т. е. нелицеприятие); οὐδὲ οἶδεν τιμὴν θέσθαι ἁδροῖς — «и не знает, как возложить честь на сильных» (ἁδρός — «крепкий, знатный»; csl «ниже весть честь возложити сильным»); θαυμασθῆναι πρόσωπα αὐτῶν — «чтобы удивляться их лицам» (тёмное добавление, передано буквально)."
  20: "Елиуй. κενὰ δὲ αὐτοῖς ἀποβήσεται τὸ κεκραγέναι καὶ δεῖσθαι ἀνδρός — «тщетным для них выйдет вопить и просить человека» (κενά — «тщетно»; ἀποβαίνω — «выходить, оборачиваться»); ἐχρήσαντο γὰρ παρανόμως — «ибо поступили беззаконно» (χράομαι); ἐκκλινομένων ἀδυνάτων — «когда немощные уклонялись» (род. самост.; csl «безчестяще немощных»); тёмный оборот, передан по csl."
  21: "Елиуй. αὐτὸς γὰρ ὁρατής ἐστιν ἔργων ἀνθρώπων — «ибо Он — зритель дел человеческих» (ὁρατής — редкое слово, «видящий»); λέληθεν δὲ αὐτὸν οὐδὲν ὧν πράσσουσιν — «и не утаилось от Него ничто из того, что они делают» (λανθάνω — «утаиваться»; csl «утаися же от него ничтоже»)."
  22: "Елиуй. οὐδὲ ἔσται τόπος τοῦ κρυβῆναι — «и не будет места, чтобы укрыться»; τοὺς ποιοῦντας τὰ ἄνομα — «делающим беззакония» (csl «творящым беззаконная»)."
  23: "Елиуй. ὅτι οὐκ ἐπ᾽ ἄνδρα θήσει ἔτι — «ибо не на человека положит ещё» (τίθημι — «полагать, возлагать»; тёмное: не возложит больше на человека); ὁ γὰρ κύριος πάντας ἐφορᾷ — «ибо Господь всех надзирает» (ἐφοράω — «обозревать»). Слав. относит вторую половину к началу 34:24 («Господь бо всех видит») — держимся LXX."
  24: "Елиуй. ὁ καταλαμβάνων ἀνεξιχνίαστα — «постигающий неисследимое» (καταλαμβάνω — «охватывать, постигать»; ἀνεξιχνίαστος — «неисследимый»); ἔνδοξά τε καὶ ἐξαίσια, ὧν οὐκ ἔστιν ἀριθμός — «славное и дивное, чему нет числа» (ἐξαίσιος — «необычайный»; csl «славная же и изрядная, имже несть числа»)."
  25: "Елиуй. ὁ γνωρίζων αὐτῶν τὰ ἔργα — «делающий известными их дела» (γνωρίζω); καὶ στρέψει νύκτα — «и обратит ночь» (στρέφω — «поворачивать»; тёмное: обернёт их в ночь); ταπεινωθήσονται — «будут низложены» (ταπεινόω; csl «смирятся»)."
  26: "Елиуй. ἔσβεσεν δὲ ἀσεβεῖς — «угасил же нечестивых» (σβέννυμι — «гасить»; csl «угаси»); ὁρατοὶ δὲ ἐναντίον αὐτοῦ — «видимы же пред Ним» (ὁρατός — «видимый», т. е. казнь у всех на виду; csl «видими же пред ним»)."
  27: "Елиуй. ὅτι ἐξέκλιναν ἐκ νόμου θεοῦ — «ибо уклонились от закона Божия» (ἐκκλίνω); δικαιώματα δὲ αὐτοῦ οὐκ ἐπέγνωσαν — «и оправданий Его не познали» (δικαίωμα — «устав, оправдание»; в Псалтири — 掟[おきて])."
  28: "Елиуй. τοῦ ἐπαγαγεῖν ἐπ᾽ αὐτὸν κραυγὴν πένητος — «чтобы вознести к Нему вопль бедного» (ἐπάγω — «наводить, возносить»; κραυγή — «вопль»; πένης — «бедный»); κραυγὴν πτωχῶν εἰσακούσεται — «вопль нищих услышит» (πτωχός — «нищий»; csl «вопль убогих услышит»). Два разных слова переданы 貧しい者 / 乏しい者."
  29: "Елиуй. καὶ αὐτὸς ἡσυχίαν παρέξει — «и Он тишину подаст» (ἡσυχία — «тишина, покой»; παρέχω — «подавать»); τίς καταδικάσεται — «кто осудит?» (καταδικάζω); κρύψει πρόσωπον — «сокроет лицо»; κατὰ ἔθνους καὶ κατὰ ἀνθρώπου ὁμοῦ — «и на народ, и на человека вместе» (ὁμοῦ — «вместе», т. е. одинаково). Стих обрывается: продолжение в 34:30."
  30: "Елиуй. βασιλεύων ἄνθρωπον ὑποκριτήν — «делая человека лицемера царём» (βασιλεύω — «царствовать, ставить царём»; ὑποκριτής — «лицемер»); ἀπὸ δυσκολίας λαοῦ — «из-за строптивости народа» (δυσκολία — «тяжёлый нрав, строптивость»; csl «за строптивость людий»)."
  31: "Елиуй. πρὸς τὸν ἰσχυρὸν ὁ λέγων — «к Крепкому говорящий» (ὁ ἰσχυρός — о Боге); Εἴληφα — «я взял, получил» (λαμβάνω); οὐκ ἐνεχυράσω — «не буду брать залога» (ἐνεχυράζω — «брать залог»; csl «не отиму вместо залога»). Тёмное место; слова человека к Богу — 『…』, продолжаются в 34:32."
  32: "Елиуй. ἄνευ ἐμαυτοῦ ὄψομαι — «без себя увижу» (тёмное: помимо себя, т. е. чего сам не вижу); σὺ δεῖξόν μοι — «Ты покажи мне»; εἰ ἀδικίαν ἠργασάμην, οὐ μὴ προσθήσω — «если неправду сделал, не приложу» (προστίθημι — «прибавлять», т. е. больше не буду; csl «не имам приложити»). Здесь закрывается цитата."
  33: "Елиуй. μὴ παρὰ σοῦ ἀποτείσει αὐτήν — «разве от тебя взыщет её?» (ἀποτίνω — «взыскивать, воздавать»; παρά с род. — «от, по», передано «あなたによって»); ὅτι ἀπώσῃ — «ибо ты отринешь» (ἀπωθέω); ὅτι σὺ ἐκλέξῃ καὶ οὐκ ἐγώ — «ибо ты изберёшь, а не я» (ἐκλέγω; csl «еда от тебе истяжет ю… яко ты избереши, а не аз ли?»). Тёмное место о том, что суд — Божий, а не человеческий; вопрос сохранён."
  34: "Елиуй. διὸ συνετοὶ καρδίας ἐροῦσιν ταῦτα — «потому разумные сердцем скажут это»; ἀνὴρ δὲ σοφὸς ἀκήκοέν μου τὸ ῥῆμα — «и муж мудрый услышал слово моё» (перфект: уже услышал; csl «услыша глагол мой»)."
  35: "Елиуй. Ιωβ δὲ οὐκ ἐν συνέσει ἐλάλησεν — «Иов же не в разумении говорил» (σύνεσις — «разумение»); τὰ δὲ ῥήματα αὐτοῦ οὐκ ἐν ἐπιστήμῃ — «и слова его не в знании» (ἐπιστήμη — «знание»; csl «не в хитрости» — в смысле «не с искусством»)."
  36: "Елиуй. οὐ μὴν δὲ ἀλλά — «однако же» (усиленный переход); μάθε, Ιωβ — «научись, Иов» (μανθάνω); μὴ δῷς ἔτι ἀνταπόκρισιν — «не давай больше ответа» (ἀνταπόκρισις — «ответ, возражение»); ὥσπερ οἱ ἄφρονες — «как неразумные» (ἄφρων; csl «якоже немудрии»)."
  37: "Елиуй. ἵνα μὴ προσθῶμεν ἐφ᾽ ἁμαρτίαις ἡμῶν — «чтобы не приложить нам к грехам нашим» (προστίθημι; csl «да не приложим на грехи нашя»); ἀνομία δὲ ἐφ᾽ ἡμῖν λογισθήσεται — «и беззаконие на нас вменится» (λογίζομαι — «вменять»); πολλὰ λαλούντων ῥήματα ἐναντίον τοῦ κυρίου — род. самост. «когда говорят многие слова против Господа» (csl «многая глаголющих словеса на Господа»). В ru/МТ добавлено «рукоплескать», чего в LXX нет. Здесь закрывается цитата (34:2–37)."
