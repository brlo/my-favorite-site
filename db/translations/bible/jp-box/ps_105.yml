verses:
  0: "アレルヤ。"
  1: "主[しゅ]に感謝[かんしゃ]せよ。主[しゅ]はいつくしみ深[ぶか]く、そのあわれみはとこしえに絶[た]えないからである。"
  2: "だれが主[しゅ]の力強[ちからづよ]いわざを語[かた]り、そのすべての賛美[さんび]を告[つ]げ知[し]らせることができようか。"
  3: "幸[さいわ]いなのは、裁[さば]きを守[まも]り、いつも義[ぎ]を行[おこな]う者[もの]である。"
  4: "主[しゅ]よ、あなたが民[たみ]を恵[めぐ]まれるとき、わたしたちを思[おも]い起[おこ]してください。あなたの救[すく]いによって、わたしたちを訪[おとず]れてください。"
  5: "あなたの選[えら]ばれた者[もの]たちの幸[さいわ]いを見[み]、あなたの民[たみ]の喜[よろこ]びをもって喜[よろこ]び、あなたの嗣業[しぎょう]とともに誇[ほこ]るために。"
  6: "わたしたちは父[ちち]たちとともに罪[つみ]を犯[おか]し、法[ほう]を破[やぶ]り、悪[わる]を行[おこな]った。"
  7: "わたしたちの父[ちち]たちはエジプトで、あなたの奇[き]跡[せき]を悟[さと]らず、あなたの豊[ゆた]かなあわれみを思[おも]い起[おこ]さず、紅海[こうかい]に上[のぼ]るときにあなたを怒[いか]らせた。"
  8: "しかし、主[しゅ]はご自分[じぶん]の名[な]のゆえに彼[かれ]らを救[すく]われた。それは、ご自分[じぶん]の力[ちから]を知[し]らせるためであった。"
  9: "主[しゅ]が紅海[こうかい]を叱[しか]ると、海[うみ]は干[ひ]あがった。主[しゅ]は彼[かれ]らを、荒野[こうや]を行[ゆ]くように、深[ふか]い淵[ふち]の中[なか]へ導[みちび]かれた。"
  10: "主[しゅ]は彼[かれ]らを憎[にく]む者[もの]の手[て]から救[すく]い、敵[てき]の手[て]から贖[あがな]い出[だ]された。"
  11: "水[みず]は彼[かれ]らを苦[くる]しめる者[もの]を覆[おお]い、そのうちの一人[ひとり]も残[のこ]らなかった。"
  12: "そして彼[かれ]らは主[しゅ]の言葉[ことば]を信[しん]じ、主[しゅ]を賛美[さんび]して歌[うた]った。"
  13: "しかし、彼[かれ]らはすぐに主[しゅ]のわざを忘[わす]れ、その定[さだ]めを待[ま]ち望[のぞ]まなかった。"
  14: "彼[かれ]らは荒野[こうや]で強[つよ]い欲[よく]を抱[いだ]き、水[みず]のない地[ち]で神[かみ]を試[こころ]みた。"
  15: "神[かみ]は彼[かれ]らの求[もと]めをかなえ、その魂[たましい]に飽[あ]き足[た]りるほどのものを送[おく]られた。"
  16: "彼[かれ]らは陣営[じんえい]のうちでモーセを怒[いか]らせ、主[しゅ]の聖[せい]なる者[もの]アロンを怒[いか]らせた。"
  17: "地[ち]は開[ひら]いてダタンとアビロンを飲[の]み込[こ]み、その仲間[なかま]の集[つど]いを覆[おお]った。"
  18: "火[ひ]は彼[かれ]らの集[つど]いのうちに燃[も]え上[あ]がり、炎[ほのお]は罪[つみ]人[びと]たちを焼[や]き尽[つ]くした。"
  19: "彼[かれ]らはホレブ⟨シナイ山[やま]の別名[べつめい]。⟩で子[こ]牛[うし]を作[つく]り、その彫[ほ]り物[もの]を拝[おが]んだ。"
  20: "彼[かれ]らは自分[じぶん]たちの栄光[えいこう]を、草[くさ]を食[く]う牛[うし]の像[ぞう]と取[と]り替[か]えた。"
  21: "彼[かれ]らは、自分[じぶん]たちを救[すく]う神[かみ]、エジプトで大[おお]きなわざを行[おこな]われた神[かみ]を忘[わす]れた。"
  22: "ハムの地[ち]で驚[おどろ]くべきわざを、紅海[こうかい]で恐[おそ]るべきわざを。"
  23: "主[しゅ]は彼[かれ]らを滅[ほろ]ぼそうと言[い]われた。しかし、主[しゅ]の選[えら]ばれた者[もの]モーセが、主[しゅ]の怒[いか]りをそらして滅[ほろ]びを免[まぬか]れさせようと、裂[さ]け目[め]に立[た]って主[しゅ]の前[まえ]に立[た]ちはだかったので、主[しゅ]は滅[ほろ]ぼされなかった。"
  24: "彼[かれ]らは望[のぞ]ましい地[ち]を軽[かろ]んじ、神[かみ]の言葉[ことば]を信[しん]じなかった。"
  25: "彼[かれ]らは自分[じぶん]たちの幕屋[まくや]のうちでつぶやき、主[しゅ]の声[こえ]に聞[き]き従[したが]わなかった。"
  26: "そして主[しゅ]は、彼[かれ]らを荒野[こうや]で倒[たお]そうと、彼[かれ]らに向[む]けて手[て]を上[あ]げられた。"
  27: "彼[かれ]らの子孫[しそん]を諸国[しょこく]の民[たみ]の間[あいだ]に倒[たお]し、彼[かれ]らをもろもろの地[ち]に散[ち]らそうとされた。"
  28: "彼[かれ]らはベエルフェゴル⟨モアブの人々[ひとびと]が拝[おが]んだ神[かみ]。⟩に結[むす]びつき、死[し]んだ者[もの]へのいけにえを食[た]べた。"
  29: "彼[かれ]らはその行[おこな]いで主[しゅ]を怒[いか]らせ、倒[たお]れる者[もの]が彼[かれ]らの間[あいだ]に増[ふ]えた。"
  30: "そこでフィネエスが立[た]ち上[あ]がって償[つぐな]いをささげると、災[わざわ]いは止[や]んだ。"
  31: "それが彼[かれ]の義[ぎ]と認[みと]められ、代[よ]々[よ]、とこしえに至[いた]るまで続[つづ]いた。"
  32: "彼[かれ]らはメリバの水[みず]のほとりで主[しゅ]を怒[いか]らせ、そのためにモーセは苦[くる]しんだ。"
  33: "彼[かれ]らが主[しゅ]の霊[れい]を苦[くる]しめたので、モーセはその唇[くちびる]で軽[かろ]はずみなことを言[い]った。"
  34: "彼[かれ]らは、主[しゅ]が命[めい]じた諸国[しょこく]の民[たみ]を滅[ほろ]ぼさず、"
  35: "これらの民[たみ]と交[まじ]わり、そのわざを学[まな]んだ。"
  36: "彼[かれ]らはその彫[ほ]り物[もの]に仕[つか]え、それが彼[かれ]らにとってつまずきとなった。"
  37: "彼[かれ]らは自分[じぶん]たちの息子[むすこ]や娘[むすめ]を悪霊[あくりょう]たちにいけにえとしてささげた。"
  38: "彼[かれ]らは罪[つみ]のない血[ち]、すなわちカナンの彫[ほ]り物[もの]にささげた自分[じぶん]たちの息子[むすこ]や娘[むすめ]の血[ち]を流[なが]した。それゆえ、地[ち]は血[ち]によって汚[けが]された。"
  39: "彼[かれ]らは自分[じぶん]たちのわざによって汚[けが]れ、その行[おこな]いによって淫[いん]行[こう]を重[かさ]ねた。"
  40: "それゆえ、主[しゅ]は激[はげ]しく怒[いか]ってご自分[じぶん]の民[たみ]を憎[にく]み、ご自分[じぶん]の嗣業[しぎょう]を忌[い]み嫌[きら]われた。"
  41: "主[しゅ]は彼[かれ]らを諸国[しょこく]の民[たみ]の手[て]に渡[わた]し、彼[かれ]らを憎[にく]む者[もの]が彼[かれ]らを支配[しはい]した。"
  42: "敵[てき]は彼[かれ]らを苦[くる]しめ、彼[かれ]らは敵[てき]の手[て]の下[した]に低[ひく]くされた。"
  43: "主[しゅ]は幾度[いくど]も彼[かれ]らを救[すく]い出[だ]された。しかし、彼[かれ]らはその計[はかりごと]によって主[しゅ]を怒[いか]らせ、その不法[ふほう]のゆえに低[ひく]くされた。"
  44: "しかし、主[しゅ]は彼[かれ]らが苦[くる]しむのを見[み]、その願[ねが]いを聞[き]き入[い]れられた。"
  45: "主[しゅ]はご自分[じぶん]の契約[けいやく]を思[おも]い起[おこ]し、その豊[ゆた]かなあわれみのゆえに悔[く]いられた。"
  46: "主[しゅ]は、彼[かれ]らを虜[とりこ]にしたすべての者[もの]が彼[かれ]らをあわれむようにされた。"
  47: "わたしたちの神[かみ]である主[しゅ]よ、わたしたちを救[すく]い、諸国[しょこく]の民[たみ]の間[あいだ]から集[あつ]めてください。あなたの聖[せい]なる名[な]に感謝[かんしゃ]し、あなたの賛美[さんび]を誇[ほこ]るために。"
  48: "イスラエルの神[かみ]である主[しゅ]は、とこしえからとこしえまでほめたたえられる。民[たみ]はみな「アーメン、アーメン」と言[い]う。"

notes:
  0: "Αλληλουια — アレルヤ, «хвалите Господа»; в LXX это надписание-возглас. Надписание — стих 0, скобками не маркируется. Форма アレルヤ — как в Откр 19:1 (там слово пояснено сноской)."
  1: "Ἐξομολογεῖσθε τῷ κυρίῳ — 主に感謝せよ (ἐξομολογέομαι — «славить, исповедовать»; в псалмах — благодарственная хвала). ὅτι χρηστός — いつくしみ深く (χρηστός — «благ, добр»). εἰς τὸν αἰῶνα τὸ ἔλεος αὐτοῦ — あわれみはとこしえに絶えない (ἔλεος — あわれみ). Формула дословно та же, что в 106:1 и 117:1, поэтому и по-японски та же."
  2: "τίς λαλήσει τὰς δυναστείας τοῦ κυρίου — だれが主の力強いわざを語り (δυναστεία — «могущество, великие дела»). ἀκουστὰς ποιήσει πάσας τὰς αἰνέσεις αὐτοῦ — すべての賛美を告げ知らせる (ἀκουστὰς ποιέω — «делать слышимым»; αἴνεσις — 賛美)."
  3: "μακάριοι οἱ φυλάσσοντες κρίσιν — 幸いなのは、裁きを守り (κρίσις — 裁き, здесь «правда, суд»; φυλάσσω — «хранить»). ποιοῦντες δικαιοσύνην ἐν παντὶ καιρῷ — いつも義を行う (δικαιοσύνη — 義)."
  4: "μνήσθητι ἡμῶν, κύριε, ἐν τῇ εὐδοκίᾳ τοῦ λαοῦ σου — あなたが民を恵まれるとき、わたしたちを思い起してください (εὐδοκία — «благоволение»). ἐπίσκεψαι ἡμᾶς ἐν τῷ σωτηρίῳ σου — あなたの救いによって訪れてください (ἐπισκέπτομαι — «посещать, призирать»; σωτήριον — «спасение»)."
  5: "τοῦ ἰδεῖν ἐν τῇ χρηστότητι τῶν ἐκλεκτῶν σου — 選ばれた者たちの幸いを見 (χρηστότης — «благость»). τοῦ εὐφρανθῆναι ἐν τῇ εὐφροσύνῃ τοῦ ἔθνους σου — 民の喜びをもって喜び. τοῦ ἐπαινεῖσθαι μετὰ τῆς κληρονομίας σου — 嗣業とともに誇る (ἐπαινέομαι — «хвалиться»; κληρονομία — 嗣業). Стих продолжает ст. 4: это цель молитвы."
  6: "ἡμάρτομεν… ἠνομήσαμεν, ἠδικήσαμεν — 罪を犯し、法を破り、悪を行った. Три глагола сохранены (ἁμαρτάνω, ἀνομέω, ἀδικέω). μετὰ τῶν πατέρων ἡμῶν — 父たちとともに, т. е. исповедание за весь народ."
  7: "οἱ πατέρες ἡμῶν ἐν Αἰγύπτῳ οὐ συνῆκαν τὰ θαυμάσιά σου — 父たちはエジプトで奇跡を悟らず (συνίημι — «понимать»). οὐκ ἐμνήσθησαν τοῦ πλήθους τοῦ ἐλέους σου — 豊かなあわれみを思い起さず (πλῆθος — «множество»). παρεπίκραναν ἀναβαίνοντες ἐν τῇ ἐρυθρᾷ θαλάσσῃ — 紅海に上るときに怒らせた (παραπικραίνω — «огорчать, раздражать»; ἀναβαίνω — о выходе из Египта)."
  8: "ἔσωσεν αὐτοὺς ἕνεκεν τοῦ ὀνόματος αὐτοῦ — ご自分の名のゆえに救われた. τοῦ γνωρίσαι τὴν δυναστείαν αὐτοῦ — 力を知らせるため (γνωρίζω — «являть»)."
  9: "ἐπετίμησεν τῇ ἐρυθρᾷ θαλάσσῃ — 紅海を叱ると (ἐπιτιμάω — «запрещать, укрощать»). ἐξηράνθη — 海は干あがった (ξηραίνω — «сушить»). ὡδήγησεν αὐτοὺς ἐν ἀβύσσῳ ὡς ἐν ἐρήμῳ — 荒野を行くように深い淵の中へ導かれた (ἄβυσσος — «бездна»)."
  10: "ἔσωσεν… ἐκ χειρὸς μισούντων — 憎む者の手から救い. ἐλυτρώσατο… ἐκ χειρὸς ἐχθροῦ — 敵の手から贖い出された (λυτρόω — 贖う). Повтор «из руки» сохранён."
  11: "ἐκάλυψεν ὕδωρ τοὺς θλίβοντας αὐτούς — 水は苦しめる者を覆い (καλύπτω — «покрывать»; θλίβω — «теснить»). εἷς ἐξ αὐτῶν οὐχ ὑπελείφθη — そのうちの一人も残らなかった (ὑπολείπω — «оставаться»)."
  12: "ἐπίστευσαν ἐν τοῖς λόγοις αὐτοῦ — 主の言葉を信じ (πιστεύω ἐν). ᾖσαν τὴν αἴνεσιν αὐτοῦ — 主を賛美して歌った (ᾄδω — «петь»)."
  13: "ἐτάχυναν — すぐに (ταχύνω — «спешить»). ἐπελάθοντο τῶν ἔργων αὐτοῦ — わざを忘れ (ἐπιλανθάνομαι). οὐχ ὑπέμειναν τὴν βουλὴν αὐτοῦ — その定めを待ち望まなかった (ὑπομένω — «выжидать, терпеть»; βουλή — «замысел, решение»)."
  14: "ἐπεθύμησαν ἐπιθυμίαν — 強い欲を抱き (внутренний объект при ἐπιθυμέω, букв. «возжелали желания»). ἐπείρασαν τὸν θεὸν ἐν ἀνύδρῳ — 水のない地で神を試みた (πειράζω; ἄνυδρος — «безводный»)."
  15: "ἔδωκεν αὐτοῖς τὸ αἴτημα αὐτῶν — 求めをかなえ (αἴτημα — «прошение»). ἐξαπέστειλεν πλησμονὴν εἰς τὰς ψυχὰς αὐτῶν — 魂に飽き足りるほどのものを送られた (πλησμονή — «пресыщение, полнота»). У jp-joc и в Синодальном по евр. «болезнь» (疫病); в gr-lxx-byz πλησμονή, поэтому переведено по греч., 〔…〕 не ставятся."
  16: "παρώργισαν Μωυσῆν ἐν τῇ παρεμβολῇ — 陣営のうちでモーセを怒らせ (παροργίζω — «раздражать»; παρεμβολή — 陣営). Ααρων τὸν ἅγιον κυρίου — 主の聖なる者アロン (ἅγιος — «святой, посвящённый»)."
  17: "ἠνοίχθη ἡ γῆ καὶ κατέπιεν Δαθαν — 地は開いてダタンを飲み込み (καταπίνω — «поглощать»; Дафан — ダタン, у jp-joc ダファン). ἐκάλυψεν ἐπὶ τὴν συναγωγὴν Αβιρων — アビロンの仲間の集いを覆った (συναγωγή — «собрание, сборище»; у jp-joc アワィロン)."
  18: "ἐξεκαύθη πῦρ ἐν τῇ συναγωγῇ αὐτῶν — 彼らの集いのうちに火が燃え上がり (ἐκκαίω — «возжигать»). φλὸξ κατέφλεξεν ἁμαρτωλούς — 炎は罪人たちを焼き尽くした (καταφλέγω — «сожигать»)."
  19: "ἐποίησαν μόσχον ἐν Χωρηβ — ホレブで子牛を作り (μόσχος — «телец»; Хорив = Синай, ホレブ; у jp-joc ホリウ). προσεκύνησαν τῷ γλυπτῷ — その彫り物を拝んだ (γλυπτόν — «изваяние, идол»; 偶像 уже в корпусе)."
  20: "ἠλλάξαντο τὴν δόξαν αὐτῶν — 自分たちの栄光を取り替えた (ἀλλάσσω — «менять»; δόξα — 栄光). ἐν ὁμοιώματι μόσχου ἔσθοντος χόρτον — 草を食う牛の像と (ὁμοίωμα — «подобие»)."
  21: "ἐπελάθοντο τοῦ θεοῦ τοῦ σῴζοντος αὐτούς — 自分たちを救う神を忘れた (σῴζω — 救う). τοῦ ποιήσαντος μεγάλα ἐν Αἰγύπτῳ — エジプトで大きなわざを行われた方."
  22: "θαυμαστὰ ἐν γῇ Χαμ — ハムの地で驚くべきわざを (Χαμ — Хам, сын Ноя; его земля — Египет). φοβερὰ ἐπὶ θαλάσσης ἐρυθρᾶς — 紅海で恐るべきわざを. Стих продолжает ст. 21 (в греч. родительные причастия при ἐπελάθοντο); по-японски оставлено назывным продолжением, чтобы не разрывать нумерацию."
  23: "εἶπεν τοῦ ἐξολεθρεῦσαι αὐτούς — 彼らを滅ぼそうと言われた (ἐξολοθρεύω — «истреблять»). εἰ μὴ Μωϋσῆς ὁ ἐκλεκτὸς αὐτοῦ ἔστη ἐν τῇ θραύσει — 選ばれた者モーセが裂け目に立って (θραῦσις — «пролом»). ἀποστρέψαι τὴν ὀργὴν αὐτοῦ — 怒りをそらし. τοῦ μὴ ἐξολεθρεῦσαι — 滅ぼさないために."
  24: "ἐξουδένωσαν γῆν ἐπιθυμητήν — 望ましい地を軽んじ (ἐξουδενόω — «уничижать»; γῆ ἐπιθυμητή — «земля вожделенная»). οὐκ ἐπίστευσαν τῷ λόγῳ αὐτοῦ — 神の言葉を信じなかった."
  25: "ἐγόγγυσαν ἐν τοῖς σκηνώμασιν αὐτῶν — 幕屋のうちでつぶやき (γογγύζω — «роптать»; σκήνωμα — «шатёр, жилище»). οὐκ εἰσήκουσαν τῆς φωνῆς κυρίου — 主の声に聞き従わなかった (εἰσακούω — «слушать, внимать»)."
  26: "ἐπῆρεν τὴν χεῖρα αὐτοῦ αὐτοῖς — 彼らに向けて手を上げられた (ἐπαίρω — «поднимать»; жест клятвы, ср. Исх 6:8). τοῦ καταβαλεῖν αὐτοὺς ἐν τῇ ἐρήμῳ — 荒野で倒そうと (καταβάλλω — «низвергать»)."
  27: "τοῦ καταβαλεῖν τὸ σπέρμα αὐτῶν ἐν τοῖς ἔθνεσιν — 子孫を諸国の民の間に倒し (σπέρμα — «семя, потомство»). διασκορπίσαι αὐτοὺς ἐν ταῖς χώραις — もろもろの地に散らそうと (διασκορπίζω; χώρα — «страна»)."
  28: "ἐτελέσθησαν τῷ Βεελφεγωρ — ベエルフェゴルに結びつき (τελέω — «посвящать, приобщать»; слав. «причастишася»). ἔφαγον θυσίας νεκρῶν — 死んだ者へのいけにえを食べた (θυσία — いけにえ; «мёртвые» — идолы, ср. Пс 95:5)."
  29: "παρώξυναν αὐτὸν ἐν τοῖς ἐπιτηδεύμασιν αὐτῶν — その行いで主を怒らせ (παροξύνω — «раздражать»). ἐπληθύνθη ἐν αὐτοῖς ἡ πτῶσις — 倒れる者が彼らの間に増えた (πτῶσις — «падение»; у jp-joc и в Синодальном «поражение»)."
  30: "ἔστη Φινεες καὶ ἐξιλάσατο — フィネエスが立ち上がって償いをささげると (ἐξιλάσκομαι — «умилостивлять, совершать очищение»; Числ 25:7-8). ἐκόπασεν ἡ θραῦσις — 災いは止んだ (κοπάζω — «утихать»; θραῦσις, как в ст. 23)."
  31: "ἐλογίσθη αὐτῷ εἰς δικαιοσύνην — 彼の義と認められ (λογίζομαι — «вменять»; ср. Быт 15:6). εἰς γενεὰν καὶ γενεὰν ἕως τοῦ αἰῶνος — 代々、とこしえに至るまで."
  32: "παρώργισαν αὐτὸν ἐφ᾽ ὕδατος ἀντιλογίας — メリバの水のほとりで主を怒らせ (ἀντιλογία — «пререкание»; евр. Мерива, у jp-joc メリワ). ἐκακώθη Μωϋσῆς δι᾽ αὐτούς — そのためにモーセは苦しんだ (κακόω — «озлоблять, причинять зло»)."
  33: "παρεπίκραναν τὸ πνεῦμα αὐτοῦ — 主の霊を苦しめた (παραπικραίνω, как в ст. 7; πνεῦμα здесь — Дух Божий, поэтому 霊, а не 聖霊). διέστειλεν ἐν τοῖς χείλεσιν αὐτοῦ — モーセはその唇で軽はずみなことを言った (διαστέλλω — «разделять, разграничивать»; смысл тёмен, ср. Числ 20:10)."
  34: "οὐκ ἐξωλέθρευσαν τὰ ἔθνη — 諸国の民を滅ぼさず (ἐξολοθρεύω, как в ст. 23). ἃ εἶπεν κύριος αὐτοῖς — 主が命じた (εἶπεν — «сказал», т. е. повелел)."
  35: "ἐμίγησαν ἐν τοῖς ἔθνεσιν — これらの民と交わり (μίγνυμι — «смешиваться»). ἔμαθον τὰ ἔργα αὐτῶν — そのわざを学んだ."
  36: "ἐδούλευσαν τοῖς γλυπτοῖς αὐτῶν — その彫り物に仕え (δουλεύω — «служить как раб»). ἐγενήθη αὐτοῖς εἰς σκάνδαλον — それが彼らにとってつまずきとなった (σκάνδαλον — «соблазн, ловушка»)."
  37: "ἔθυσαν τοὺς υἱοὺς αὐτῶν καὶ τὰς θυγατέρας αὐτῶν τοῖς δαιμονίοις — 息子や娘を悪霊たちにいけにえとしてささげた (θύω — «приносить в жертву»; δαιμόνιον — 悪霊 по корпусу)."
  38: "ἐξέχεαν αἷμα ἀθῷον — 罪のない血を流した (ἐκχέω — «проливать»; ἀθῷος — «невинный»). ὧν ἔθυσαν τοῖς γλυπτοῖς Χανααν — カナンの彫り物にささげた者たちの血. ἐφονοκτονήθη ἡ γῆ ἐν τοῖς αἵμασιν — 地は血によって汚された (φονοκτονέω — «обагрять кровью, осквернять убийством»)."
  39: "ἐμιάνθη ἐν τοῖς ἔργοις αὐτῶν — 自分たちのわざによって汚れ (μιαίνω — «осквернять»). ἐπόρνευσαν ἐν τοῖς ἐπιτηδεύμασιν αὐτῶν — その行いによって淫行を重ねた (πορνεύω — «блудодействовать», о неверности Богу)."
  40: "ὠργίσθη θυμῷ κύριος ἐπὶ τὸν λαὸν αὐτοῦ — 主は激しく怒ってご自分の民を憎み (θυμός — «ярость»). ἐβδελύξατο τὴν κληρονομίαν αὐτοῦ — 嗣業を忌み嫌われた (βδελύσσομαι — «гнушаться»)."
  41: "παρέδωκεν αὐτοὺς εἰς χεῖρας ἐθνῶν — 諸国の民の手に渡し (παραδίδωμι). ἐκυρίευσαν αὐτῶν οἱ μισοῦντες αὐτούς — 憎む者が彼らを支配した (κυριεύω — «господствовать»)."
  42: "ἔθλιψαν αὐτοὺς οἱ ἐχθροὶ αὐτῶν — 敵は彼らを苦しめ (θλίβω — «теснить»). ἐταπεινώθησαν ὑπὸ τὰς χεῖρας αὐτῶν — 敵の手の下に低くされた (ταπεινόω — «смирять»)."
  43: "πλεονάκις ἐρρύσατο αὐτούς — 幾度も彼らを救い出された (πλεονάκις — «многократно»; ῥύομαι — «избавлять»). παρεπίκραναν αὐτὸν ἐν τῇ βουλῇ αὐτῶν — その計らいによって主を怒らせ (βουλή — «замысел, упорство»). ἐταπεινώθησαν ἐν ταῖς ἀνομίαις αὐτῶν — その不法のゆえに低くされた (ἀνομία — 不法)."
  44: "εἶδεν ἐν τῷ θλίβεσθαι αὐτούς — 彼らが苦しむのを見 (ὁράω). ἐν τῷ αὐτὸν εἰσακοῦσαι τῆς δεήσεως αὐτῶν — その願いを聞き入れられた (εἰσακούω; δέησις — «прошение»)."
  45: "ἐμνήσθη τῆς διαθήκης αὐτοῦ — ご自分の契約を思い起し (διαθήκη — 契約). μετεμελήθη κατὰ τὸ πλῆθος τοῦ ἐλέους αὐτοῦ — 豊かなあわれみのゆえに悔いられた (μεταμέλομαι — «раскаиваться, сожалеть»; о Боге — «пожалел»)."
  46: "ἔδωκεν αὐτοὺς εἰς οἰκτιρμούς — 彼らをあわれみのうちに渡された (οἰκτιρμός — «милосердие»; евр. «возбудил к ним сострадание»). ἐναντίον πάντων τῶν αἰχμαλωτισάντων αὐτούς — 虜にしたすべての者の前で (αἰχμαλωτίζω — «брать в плен»)."
  47: "σῶσον ἡμᾶς… καὶ ἐπισυνάγαγε ἡμᾶς ἐκ τῶν ἐθνῶν — 諸国の民の間から集めてください (ἐπισυνάγω — «собирать»). τοῦ ἐξομολογήσασθαι τῷ ὀνόματι τῷ ἁγίῳ σου — 聖なる名に感謝し. τοῦ ἐγκαυχᾶσθαι ἐν τῇ αἰνέσει σου — あなたの賛美を誇るために (ἐγκαυχάομαι — «хвалиться»)."
  48: "Εὐλογητὸς κύριος ὁ θεὸς Ισραηλ — イスラエルの神である主はほめたたえられる. ἀπὸ τοῦ αἰῶνος καὶ ἕως τοῦ αἰῶνος — とこしえからとこしえまで. καὶ ἐρεῖ πᾶς ὁ λαός· Γένοιτο γένοιτο — 民はみな「アーメン、アーメン」と言う (ἐρεῖ — будущее, «скажет»; γένοιτο — «да будет», удвоение сохранено). Стих завершает четвёртую книгу Псалтири (ср. 1 Пар 16:36)."
