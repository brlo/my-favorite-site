verses:
  0: "指揮者[しきしゃ]に。ぶどう搾[しぼ]り場[ば]について。ダビデの詩[うた]。"
  1: "主[しゅ]、わたしたちの主[ぬし]よ、あなたの名[な]は全[ぜん]地[ち]でなんと驚[おどろ]くべきものか。あなたの威[い]厳[げん]は天[てん]の上[うえ]に高[たか]く上[あ]げられている。"
  2: "あなたは幼[おさな]子[ご]と乳[ち]飲[の]み子[ご]の口[くち]から、賛美[さんび]を備[そな]えられた。あなたの敵[てき]のゆえに、敵[てき]と復讐[ふくしゅう]する者[もの]とを打[う]ち消[け]すためである。"
  3: "わたしは、あなたの指[ゆび]のわざである天[てん]を、あなたが据[す]えられた月[つき]と星[ほし]とを見[み]る。"
  4: "人[ひと]とは何[なに]ものか、あなたがこれを心[こころ]に留[と]められるとは。人[ひと]の子[こ]とは何[なに]ものか、あなたがこれを顧[かえり]みられるとは。"
  5: "あなたは彼[かれ]を、天使[てんし]たちよりわずかばかり低[ひく]くし、栄[えい]光[こう]と尊[そん]厳[げん]とで彼[かれ]を冠[かんむり]のように飾[かざ]られた。"
  6: "あなたは彼[かれ]を、ご自分の手[て]のわざの上[うえ]に立[た]たせ、すべてのものをその足[あし]の下[した]に従[したが]わせられた。"
  7: "すなわち、すべての羊[ひつじ]と牛[うし]、また野[の]の獣[けもの]、"
  8: "天[そら]の鳥[とり]、海[うみ]の魚[さかな]、海[うみ]の道[みち]を泳[およ]ぎ巡[めぐ]るもの。"
  9: "主[しゅ]、わたしたちの主[ぬし]よ、あなたの名[な]は全[ぜん]地[ち]でなんと驚[おどろ]くべきものか。"

notes:
  0: "Εἰς τὸ τέλος, ὑπὲρ τῶν ληνῶν· ψαλμὸς τῷ Δαυιδ — 指揮者に。ぶどう搾り場について。ダビデの詩 (ληνός — «точило, давильня»; в церковнослав. «о точилех»; Синодальный передаёт по евр. «на Гефском орудии»). Надписание — стих 0."
  1: "Κύριε ὁ κύριος ἡμῶν — 主、わたしたちの主よ (двойное обращение: κύριε — звательная форма, ὁ κύριος ἡμῶν — «Господь наш»). ὡς θαυμαστὸν τὸ ὄνομά σου ἐν πάσῃ τῇ γῇ — あなたの名は全地でなんと驚くべきものか (θαυμαστός — «дивный»). ὅτι ἐπήρθη ἡ μεγαλοπρέπειά σου ὑπεράνω τῶν οὐρανῶν — あなたの威厳は天の上に高く上げられている (μεγαλοπρέπεια — «величие, великолепие»; ἐπαίρω — «поднимать»)."
  2: "ἐκ στόματος νηπίων καὶ θηλαζόντων κατηρτίσω αἶνον — あなたは幼子と乳飲み子の口から、賛美を備えられた (νήπιος — «младенец»; θηλάζων — «сосущий»; καταρτίζω — «устроять, совершать»; αἶνος — 賛美). ἕνεκα τῶν ἐχθρῶν σου — あなたの敵のゆえに. τοῦ καταλῦσαι ἐχθρὸν καὶ ἐκδικητήν — 敵と復讐する者とを打ち消すためである (καταλύω — «разрушать, упразднять»; ἐκδικητής — «мститель»)."
  3: "ὅτι ὄψομαι τοὺς οὐρανούς, ἔργα τῶν δακτύλων σου — あなたの指のわざである天を見る (δάκτυλος — «перст»; множественное «небеса» передано 天). σελήνην καὶ ἀστέρας, ἃ σὺ ἐθεμελίωσας — あなたが据えられた月と星と (θεμελιόω — «основывать, утверждать»)."
  4: "τί ἐστιν ἄνθρωπος, ὅτι μιμνῄσκῃ αὐτοῦ — 人とは何ものか、あなたがこれを心に留められるとは (μιμνῄσκομαι — «помнить, вспоминать»). ἢ υἱὸς ἀνθρώπου, ὅτι ἐπισκέπτῃ αὐτόν — 人の子とは何ものか、あなたがこれを顧みられるとは (ἐπισκέπτομαι — «посещать, призирать»). Два «человек» переданы различно: 人 и 人の子."
  5: "ἠλάττωσας αὐτὸν βραχύ τι παρ᾽ ἀγγέλους — あなたは彼を、天使たちよりわずかばかり低くし (ἐλαττόω — «умалять»; ἀγγέλους — 天使, как по всему корпусу). δόξῃ καὶ τιμῇ ἐστεφάνωσας αὐτόν — 栄光と尊厳とで彼を冠のように飾られた (τιμή — «честь»; στεφανόω — «венчать»)."
  6: "καὶ κατέστησας αὐτὸν ἐπὶ τὰ ἔργα τῶν χειρῶν σου — あなたは彼を、ご自分の手のわざの上に立たせ (καθίστημι — «поставлять»). πάντα ὑπέταξας ὑποκάτω τῶν ποδῶν αὐτοῦ — すべてのものをその足の下に従わせられた (ὑποτάσσω — «подчинять»)."
  7: "πρόβατα καὶ βόας πάσας — すべての羊と牛 (πρόβατον — 羊; βοῦς — «вол, бык»). ἔτι δὲ καὶ τὰ κτήνη τοῦ πεδίου — また野の獣 (κτῆνος — «скот, зверь»; πεδίον — «поле, равнина»)."
  8: "τὰ πετεινὰ τοῦ οὐρανοῦ — 天の鳥 (πετεινόν — «птица»). τοὺς ἰχθύας τῆς θαλάσσης — 海の魚. τὰ διαπορευόμενα τρίβους θαλασσῶν — 海の道を泳ぎ巡るもの (τρίβος — «тропа, путь»)."
  9: "κύριε ὁ κύριος ἡμῶν, ὡς θαυμαστὸν τὸ ὄνομά σου ἐν πάσῃ τῇ γῇ — стих повторяет ст. 1 дословно, кроме «на небесах»; повтор сохранён."
