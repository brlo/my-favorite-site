# jp-box, Осия, глава 4. Черновик для приёмки.
#
# Нумерация — по славяно-синодальной (решение автора): главы 1–2 и 11–12
# переразбиты относительно гр. модуля (слав. 1:10–11 = прежние 2:1–2;
# слав. 11:12 = прежний 12:1). Текст — с Септуагинты, слав. контроль.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# --- прежние заметки (нумерация по гр.) ---
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по gr-lxx-byz (= jp-ni); в этой главе совпадает со славяно-синодальной.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: 1–3 призыв и обвинение: нет истины, милости и ведения Божия; клятва,
# ложь, убийство, воровство, прелюбодеяние; плач земли, гибель зверей и рыб; 4–6 народ
# как пререкаемый священник, погибель за недостаток ведения, «забыл закон — забуду
# детей»; 7–11 чем больше умножались, тем больше грешили; священники едят грех народа;
# блуд и вино отняли сердце; 12–14 гадание на знамениях и жезле, дух блуда, жертвы
# на высотах, «не взыщу с дочерей ваших»; 15–19 увещание Израилю и Иуде: Галгал
# и дом Он, упрямая телица, Ефрем прилепился к идолам, вихрь.
# Голоса: 1–19 — одно слово Господа в 「…」 (в 15 слова клятвы — 『生ける主にかけて』).
# 4:10: при инфинитиве «τοῦ φυλάξαι» нет объекта (слав. «еже снабдети») — передано
# «守るべきことを守らなかった», отмечено в notes.
#
tr_code: jp-box
book: os
chapter: 4
draft: true

verses:
  1: "「イスラエルの子[こ]らよ、主[しゅ]の言葉[ことば]を聞[き]け。主[しゅ]はこの地[ち]に住[す]む者[もの]たちと争[あらそ]い、裁[さば]きを行[おこな]われる。この地[ち]には真実[しんじつ]もなく、あわれみもなく、神[かみ]を知[し]ることもないからである。"
  2: "呪[のろ]いと偽[いつわ]りと殺人[さつじん]と盗[ぬす]みと姦淫[かんいん]がこの地[ち]に溢[あふ]れ、血[ち]に血[ち]を混[ま]ぜている。"
  3: "それゆえ、この地[ち]は嘆[なげ]き、そこに住[す]むすべてのものは、野[の]の獣[けもの]、地[ち]を這[は]うもの、空[そら]の鳥[とり]と共[とも]に衰[おとろ]える。海[うみ]の魚[さかな]も絶[た]える。"
  4: "しかも、だれも争[あらそ]わず、だれも責[せ]めない。わたしの民[たみ]は、言[い]い争[あらそ]われる祭司[さいし]のようである。"
  5: "あなたは昼[ひる]、力[ちから]を失[うしな]い、預言者[よげんしゃ]もあなたと共[とも]に夜[よる]に力[ちから]を失[うしな]う。わたしはあなたの母[はは]を夜[よる]に似[に]たものとした。"
  6: "わたしの民[たみ]は知[し]ることのない者[もの]のようになった。あなたは知[し]ることを退[しりぞ]けたので、わたしもあなたを退[しりぞ]けて、わたしに仕[つか]える祭司[さいし]としない。あなたは自分の神[かみ]の律法[りっぽう]を忘[わす]れたので、わたしもあなたの子[こ]どもを忘[わす]れる。"
  7: "彼らは多[おお]くなるにつれて、わたしに対して罪[つみ]を重[かさ]ねた。わたしは彼らの栄光[えいこう]を恥辱[ちじょく]に変[か]える。"
  8: "彼らはわたしの民[たみ]の罪[つみ]を食[た]べ、その不法[ふほう]によって民[たみ]の魂[たましい]を奪[うば]い取[と]る。"
  9: "民[たみ]も祭司[さいし]も同[おな]じようになる。わたしは彼の道[みち]を罰[ばっ]し、その企[たくら]みを彼に返[かえ]す。"
  10: "彼らは食[た]べても満[み]ちず、淫行[いんこう]をしても改[あらた]まらない。彼らは主[しゅ]を捨[す]てて、守[まも]るべきことを守[まも]らなかったからである。"
  11: "淫行[いんこう]とぶどう酒[しゅ]と酔[よ]いが、わたしの民[たみ]の心[こころ]をとらえた。"
  12: "彼らは徴[しるし]をもって問[と]い、自分の杖[つえ]が彼らに告[つ]げる。淫行[いんこう]の霊[れい]に迷[まよ]わされ、淫行[いんこう]によって自分[じぶん]の神[かみ]から離[はな]れた。"
  13: "彼らは山[やま]の頂[いただき]でいけにえをささげ、丘[おか]の上[うえ]でいけにえをささげ、樫[かし]の木[き]、ポプラ、茂[しげ]った木[き]の下[した]でささげた。良[よ]い陰[かげ]があるからである。それゆえ、あなたがたの娘[むすめ]たちは淫行[いんこう]をし、嫁[よめ]たちは姦淫[かんいん]する。"
  14: "わたしはあなたがたの娘[むすめ]たちが淫行[いんこう]をしても、嫁[よめ]たちが姦淫[かんいん]しても、それを罰[ばっ]さない。男[おとこ]たち自身[じしん]が遊女[ゆうじょ]たちと交[まじ]わり、聖別[せいべつ]された者[もの]たちと共[とも]にいけにえをささげているからである。悟[さと]りのある民[たみ]も遊女[ゆうじょ]と絡[から]み合[あ]う。"
  15: "イスラエルよ、あなたは知[し]らずにいてはならない。ユダよ、ギルガルへ入[はい]ってはならない。オンの家[いえ]に上[のぼ]ってはならない。『生[い]ける主[しゅ]にかけて』と誓[ちか]ってはならない。"
  16: "イスラエルは、発情[はつじょう]した若[わか]い雌牛[めうし]のように反抗[はんこう]した。今[いま]、主[しゅ]は彼らを広[ひろ]い牧[まき]場[ば]の小羊[こひつじ]のように飼[か]われる。"
  17: "エフライムは偶像[ぐうぞう]と結[むす]びつき、自分[じぶん]のために躓[つまず]きの石[いし]を置[お]いた。"
  18: "彼らはカナン人[じん]を選[えら]んだ。淫行[いんこう]に淫行[いんこう]を重[かさ]ね、そのいななきから恥辱[ちじょく]を愛[あい]した。"
  19: "風[かぜ]の渦[うず]がその翼[つばさ]の中[なか]でうなりをあげる。彼らは自分[じぶん]の祭壇[さいだん]のゆえに恥[は]じる」。"

notes:
  1: "Ἀκούσατε λόγον κυρίου, υἱοὶ Ισραηλ — «слушайте слово Господне, сыны Израилевы»; κρίσις τῷ κυρίῳ πρὸς τοὺς κατοικοῦντας τὴν γῆν — «суд (тяжба) у Господа с живущими на земле» (κρίσις — суд, спор); οὐκ ἔστιν ἀλήθεια οὐδὲ ἔλεος οὐδὲ ἐπίγνωσις θεοῦ ἐπὶ τῆς γῆς — «нет ни истины, ни милости, ни ведения Божия на земле» (слав. «ни ведения Божия»; ἐπίγνωσις — познание, 知ること)."
  2: "ἀρὰ καὶ ψεῦδος καὶ φόνος καὶ κλοπὴ καὶ μοιχεία — «клятва (проклятие) и ложь, убийство и воровство и прелюбодейство» (ἀρά — проклятие, заклятие); κέχυται ἐπὶ τῆς γῆς — «разлились по земле» (χέω — лить, изливать); αἵματα ἐφ᾿ αἵμασιν μίσγουσιν — «кровь с кровью смешивают» (слав. «кровь с кровьми мешают»)."
  3: "πενθήσει ἡ γῆ — «восплачет земля» (πενθέω — плакать, скорбеть); σμικρυνθήσεται σὺν πᾶσιν τοῖς κατοικοῦσιν αὐτήν — «умалится со всеми живущими на ней» (σμικρύνω — уменьшать, изнемогать); σὺν τοῖς θηρίοις τοῦ ἀγροῦ καὶ σὺν τοῖς ἑρπετοῖς τῆς γῆς καὶ σὺν τοῖς πετεινοῖς τοῦ οὐρανοῦ — «со зверями полевыми, и с пресмыкающимися земными, и с птицами небесными»; οἱ ἰχθύες τῆς θαλάσσης ἐκλείψουσιν — «рыбы морские исчезнут» (ἐκλείπω)."
  4: "ὅπως μηδεὶς μήτε δικάζηται μήτε ἐλέγχῃ μηδείς — «так что никто ни судится, ни обличает» (δικάζομαι, ἐλέγχω); ὁ δὲ λαός μου ὡς ἀντιλεγόμενος ἱερεύς — «но народ Мой — как пререкаемый священник» (ἀντιλέγομαι — пререкаться; слав. «аки пререкаемый жрец»)."
  5: "καὶ ἀσθενήσεις ἡμέρας — «и изнеможешь днём» (ἀσθενέω — быть слабым, терять силу); ἀσθενήσει καὶ προφήτης μετὰ σοῦ — «изнеможет и пророк с тобою»; νυκτὶ ὡμοίωσα τὴν μητέρα σου — «ночи уподобил Я матерь твою» (слав. «нощи уподобих матерь твою»). День и ночь — параллель суда."
  6: "ὡμοιώθη ὁ λαός μου ὡς οὐκ ἔχων γνῶσιν — «уподобился народ Мой не имеющему ведения»; ὅτι σὺ ἐπίγνωσιν ἀπώσω — «ибо ты ведение отверг» (ἀπωθέω — отталкивать); κἀγὼ ἀπώσομαι σὲ τοῦ μὴ ἱερατεύειν μοι — «и Я отвергну тебя, чтобы не священствовать Мне» (ἱερατεύω — священнодействовать); ἐπελάθου νόμον θεοῦ σου — «забыл ты закон Бога твоего»; κἀγὼ ἐπιλήσομαι τέκνων σου — «и Я забуду детей твоих»."
  7: "κατὰ τὸ πλῆθος αὐτῶν οὕτως ἥμαρτόν μοι — «по множеству их так согрешили Мне» (слав. «по множеству их тако согрешиша мне»); τὴν δόξαν αὐτῶν εἰς ἀτιμίαν θήσομαι — «славу их обращу в бесчестие» (ἀτιμία — бесчестие, 恥辱)."
  8: "ἁμαρτίας λαοῦ μου φάγονται — «грехи народа Моего будут есть» (священники едят жертвы за грех, ср. Лев 6:26); ἐν ταῖς ἀδικίαις αὐτῶν λήμψονται τὰς ψυχὰς αὐτῶν — «и в беззакониях их возьмут души их» (слав. «возмут душы их»); смысл тёмный, оставлен как в греческом."
  9: "καὶ ἔσται καθὼς ὁ λαὸς οὕτως καὶ ὁ ἱερεύς — «и будет: как народ, так и священник»; ἐκδικήσω ἐπ᾿ αὐτὸν τὰς ὁδοὺς αὐτοῦ — «взыщу с него пути его»; τὰ διαβούλια αὐτοῦ ἀνταποδώσω αὐτῷ — «умыслы его воздам ему» (διαβούλιον — замысел, 企み)."
  10: "φάγονται καὶ οὐ μὴ ἐμπλησθῶσιν — «будут есть и не насытятся»; ἐπόρνευσαν καὶ οὐ μὴ κατευθύνωσιν — «блудили и не исправились» (κατευθύνω — направлять, исправлять; слав. «не исправятся»); ὅτι τὸν κύριον ἐγκατέλιπον τοῦ φυλάξαι — «ибо оставили Господа, чтобы хранить»: при инфинитиве нет объекта (слав. «оставиша еже снабдети»), передано «守るべきことを守らなかった»."
  11: "Πορνείαν καὶ οἶνον καὶ μέθυσμα ἐδέξατο καρδία λαοῦ μου — «блуд и вино и пьянство приняло сердце народа Моего» (δέχομαι — принимать; слав. «прият сердце людий моих»; μέθυσμα — пьянящий напиток)."
  12: "ἐν συμβόλοις ἐπηρώτων — «по знамениям вопрошали» (σύμβολον — знак, примета; слав. «в знамениих вопрошаху»); ἐν ῥάβδοις αὐτοῦ ἀπήγγελλον αὐτῷ — «в жезлах своих возвещали ему» (гадание на жезле); πνεύματι πορνείας ἐπλανήθησαν — «духом блуда прельстились» (πλανάω — вводить в заблуждение); ἐξεπόρνευσαν ἀπὸ τοῦ θεοῦ αὐτῶν — «отступили блудом от Бога своего» (слав. «соблудиша от Бога своего»)."
  13: "ἐπὶ τὰς κορυφὰς τῶν ὀρέων ἐθυσίαζον — «на вершинах гор приносили жертвы»; ἐπὶ τοὺς βουνοὺς ἔθυον — «на холмах закалали»; ὑποκάτω δρυὸς καὶ λεύκης καὶ δένδρου συσκιάζοντος — «под дубом, и белым тополем, и деревом тенистым» (λεύκη — белый тополь, ポプラ); ὅτι καλὸν σκέπη — «ибо хороша сень»; ἐκπορνεύσουσιν αἱ θυγατέρες ὑμῶν — «будут блудить дочери ваши»; αἱ νύμφαι ὑμῶν μοιχεύσουσιν — «и невестки ваши будут прелюбодействовать» (νύμφη — невеста, сноха, 嫁)."
  14: "οὐ μὴ ἐπισκέψωμαι ἐπὶ τὰς θυγατέρας ὑμῶν — «не взыщу с дочерей ваших» (ἐπισκέπτομαι — посещать, взыскивать); μετὰ τῶν πορνῶν συνεφύροντο — «с блудницами смешивались» (συμφύρομαι — смешиваться); μετὰ τῶν τετελεσμένων ἔθυον — «с посвящёнными приносили жертвы» (τετελεσμένοι — прошедшие посвящение, 聖別された者; слав. «со блудниками»); ὁ λαὸς ὁ συνίων συνεπλέκετο μετὰ πόρνης — «народ разумеющий сплетался с блудницей» (συνίων — понимающий; слав. «людие смыслящии»; в ru «невежественный народ» — иное чтение, в текст не внесено)."
  15: "Σὺ δέ, Ισραηλ, μὴ ἀγνόει — «ты же, Израиль, не будь неведущим» (ἀγνοέω; слав. «не не разумевай»); μὴ εἰσπορεύεσθε εἰς Γαλγαλα — «не входите в Галгал»; μὴ ἀναβαίνετε εἰς τὸν οἶκον Ων — «не восходите в дом Он» (= Вефиль, презрительно «дом ничтожества»; オンの家); μὴ ὀμνύετε ζῶντα κύριον — «не клянитесь живым Господом» (слова клятвы — 『…』)."
  16: "ὡς δάμαλις παροιστρῶσα παροίστρησεν Ισραηλ — «как телица, пришедшая в течку, обезумел Израиль» (παροιστράω — приходить в течку, беситься; слав. «юница стрекалом стречема разсвирепе»); νῦν νεμήσει αὐτοὺς κύριος — «ныне упасёт их Господь» (νέμω — пасти; форма изъявительная, не вопрос); ὡς ἀμνὸν ἐν εὐρυχώρῳ — «как агнца на просторе» (εὐρύχωρος — пространный, 広い牧場)."
  17: "μέτοχος εἰδώλων Εφραιμ — «причастник (сообщник) идолов Ефрем» (μέτοχος — участник); ἔθηκεν ἑαυτῷ σκάνδαλα — «положил себе соблазны (преткновения)» (σκάνδαλον — 躓きの石)."
  18: "ᾑρέτισεν Χαναναίους — «избрал Хананеев» (αἱρετίζω — выбирать; слав. «избра хананеов»); πορνεύοντες ἐξεπόρνευσαν — «блудя, блудили» (усиление); ἠγάπησαν ἀτιμίαν ἐκ φρυάγματος αὐτῶν — «возлюбили бесчестие от ржания (надменности) своего» (φρύαγμα — ржание, наглость; слав. «от хрепетания своего»)."
  19: "συστροφὴ πνεύματος σὺ εἶ ἐν ταῖς πτέρυξιν αὐτῆς — «вихрь духа ты в крыльях её» (συστροφή — кружение, вихрь; слав. «вихр духа возсвищет в крилех своих»); καταισχυνθήσονται ἐκ τῶν θυσιαστηρίων αὐτῶν — «посрамятся от жертвенников своих». Здесь слово Господа закрывается."
