chapter: 5
draft: true

verses:
  1: "一行[いっこう]は湖[みずうみ]の向[む]こう岸[ぎし]、ゲラサ人[びと]の地方[ちほう]に着[つ]いた。"
  2: "イエスが舟[ふね]から降[お]りられると、〔すぐに〕墓場[はかば]から出[で]て来[き]た汚[けが]れた霊[れい]に憑[つ]かれた人[ひと]が、イエスを迎[むか]えた。"
  3: "この人[ひと]は墓場[はかば]を住[す]みかとしていた。もはやだれも、鎖[くさり]でさえ彼[かれ]を縛[しば]っておくことができなかった。"
  4: "これまでも何度[なんど]も足枷[あしかせ]や鎖[くさり]で縛[しば]られたが、そのたびに鎖[くさり]を引[ひ]きちぎり、足枷[あしかせ]を砕[くだ]いてしまった。だれも彼[かれ]を押[お]さえつけることができなかったのである。"
  5: "彼[かれ]は昼[ひる]も夜[よる]も墓場[はかば]や山[やま]の中[なか]で叫[さけ]び続[つづ]け、石[いし]で自分[じぶん]の体[からだ]を傷[きず]つけていた。"
  6: "その人[ひと]は遠[とお]くにイエスを見[み]ると、走[はし]り寄[よ]って来[き]て、ひれ伏[ふ]した。"
  7: "そして大[おお]きな声[こえ]で叫[さけ]んだ。「いと高[たか]い神[かみ]の子[こ]イエス、あなたはわたしと何[なん]の関[かか]わりがあるのか。神[かみ]にかけて願[ねが]う。わたしを苦[くる]しめないでくれ。」"
  8: "イエスはその霊[れい]に、「<j>汚[けが]れた霊[れい]よ、この人[ひと]から出[で]て行[い]け</j>」と言[い]われたのである。"
  9: "イエスが「<j>名[な]は何[なん]というのか</j>」とお尋[たず]ねになると、その霊[れい]は答[こた]えた。「レギオン⟨軍団[ぐんたん]という意味[いみ]。ローマの一軍団[いちぐんたん]は数千人[すうせんにん]の兵[へい]からなっていた。⟩という名[な]です。わたしたちは多[おお]いからです。」"
  10: "そして、この地方[ちほう]の外[そと]へ追[お]い出[だ]さないでほしいと、しきりに願[ねが]った。"
  11: "そこには、山[やま]のふもとで大[おお]きな豚[ぶた]の群[む]れが飼[か]われていた。"
  12: "霊[れい]たちはイエスに願[ねが]った。「その豚[ぶた]の中[なか]へ送[おく]って、入[はい]らせてください。」"
  13: "イエスがお許[ゆる]しになると、汚[けが]れた霊[れい]たちは出[で]て豚[ぶた]の中[なか]に入[はい]った。すると、豚[ぶた]の群[む]れは二千匹[にせんびき]ほどもあって、崖[がけ]から湖[みずうみ]へなだれ落[お]ち、おぼれ死[し]んだ。"
  14: "豚[ぶた]を飼[か]っていた者[もの]たちは逃[に]げ出[だ]し、町[まち]や村里[そんり]に知[し]らせた。人々[ひとびと]は、何[なに]が起[お]こったのかを見[み]ようとやって来[き]た。"
  15: "そしてイエスのところへ来[き]て、あのレギオンに憑[つ]かれていた者[もの]が、服[ふく]を着[き]、正気[しょうき]になって座[すわ]っているのを見[み]た。人々[ひとびと]は恐[おそ]れた。"
  16: "目撃[もくげき]した者[もの]たちが、悪霊[あくりょう]に憑[つ]かれていた人[ひと]に起[お]こったことと、豚[ぶた]のことを話[はな]して聞[き]かせた。"
  17: "そこで人々[ひとびと]は、この地方[ちほう]から離[はな]れてほしいとイエスに頼[たの]み始[はじ]めた。"
  18: "イエスが舟[ふね]に乗[の]ろうとされると、悪霊[あくりょう]に憑[つ]かれていた人[ひと]が、一緒[いっしょ]に行[い]かせてほしいと願[ねが]った。"
  19: "しかしイエスはお許[ゆる]しにならず、こう言[い]われた。「<j>家[いえ]へ帰[かえ]って、身内[みうち]の者[もの]たちに、主[しゅ]があなたにどれほど大[おお]きなことをしてくださったか、どんなに憐[あわ]れんでくださったかを話[はな]して聞[き]かせなさい。</j>」"
  20: "その人[ひと]は出[で]て行[い]き、イエスが自分[じぶん]にしてくださったことを、デカポリス中[じゅう]に宣[の]べ伝[つた]え始[はじ]めた。人々[ひとびと]は皆[みな]、驚[おどろ]いた。"
  21: "イエスが舟[ふね]で再[ふたた]び向[む]こう岸[ぎし]へ渡[わた]られると、大勢[おおぜい]の群衆[ぐんしゅう]がイエスのもとに集[あつ]まった。イエスは湖[みずうみ]の岸[きし]にいておられた。"
  22: "そこへ、会堂長[かいどうちょう]⟨会堂[かいどう]の管理[かんり]と礼拝[れいはい]の取[と]り仕切[しき]りを司[つかさど]る人[ひと]。⟩の一人[ひとり]でヤイロという名[な]の者[もの]が来[き]た。イエスを見[み]ると、その足[あし]もとにひれ伏[ふ]して、"
  23: "しきりに願[ねが]って言[い]った。「小[ちい]さい娘[むすめ]が死[し]にかかっています。どうか来[き]て手[て]を置[お]き、癒[いや]して生[い]き返[かえ]らせてください。」"
  24: "イエスはヤイロと一緒[いっしょ]に出[で]かけた。大勢[おおぜい]の群衆[ぐんしゅう]が後[あと]について来[き]て、イエスに押[お]し迫[せま]った。"
  25: "そこに、十二年間[じゅうにねんかん]も血[ち]の止[と]まらない女[おんな]がいた。"
  26: "この女[おんな]は多[おお]くの医者[いしゃ]にかかってさんざん苦[くる]しみ、持[も]ち物[もの]をすっかり使[つか]い果[は]てたのに、少[すこ]しも良[よ]くならず、かえって悪[わる]くなっていった。"
  27: "イエスのうわさを聞[き]いて、群衆[ぐんしゅう]の中[なか]にまぎれ、後[うしろ]からイエスの衣[ころも]に触[さわ]った。"
  28: "「あの方[かた]の衣[ころも]にでも触[さわ]れば、癒[いや]していただける」と思[おも]っていたからである。"
  29: "すると、すぐに血[ち]の流[なが]れが止[と]まり、女[おんな]は体[からだ]の病[やまい]が癒[いや]されたのを感[かん]じた。"
  30: "イエスはすぐに、ご自分[じぶん]から力[ちから]が出[で]て行[い]ったのを覚[おぼ]え、群衆[ぐんしゅう]の中[なか]で振[ふ]り向[む]いて言[い]われた。「<j>だれがわたしの衣[ころも]に触[さわ]ったのか。</j>」"
  31: "弟子[でし]たちが言[い]った。「ご覧[らん]なさい。群衆[ぐんしゅう]があなたに押[お]し寄[よ]せているのに、『だれがわたしに触[さわ]ったのか』とおっしゃるのですか。」"
  32: "イエスは、それを行[おこな]った女[おんな]を見[み]つけようとして、周[まわ]りを見回[みまわ]された。"
  33: "女[おんな]は、自分[じぶん]に起[お]こったことを知[し]って恐[おそ]れおののき、イエスの前[まえ]にひれ伏[ふ]して、一部始終[いちぶしじゅう]を話[はな]した。"
  34: "イエスは言[い]われた。「<j>娘[むすめ]よ、あなたの信仰[しんこう]があなたを癒[いや]した。安心[あんしん]して行[い]きなさい。あなたの病[やまい]から癒[いや]されて、健[すこ]やかでいなさい。</j>」"
  35: "イエスがまだ話[はな]しておられると、会堂長[かいどうちょう]の家[いえ]から人[ひと]が来[き]て言[い]った。「お嬢[じょう]さんは亡[な]くなりました。もう先生[せんせい]を煩[わずら]わせることはありません。」"
  36: "イエスはその言[ことば]を聞[き]き、会堂長[かいどうちょう]に言[い]われた。「<j>恐[おそ]れることはない。ただ信[しん]じなさい。</j>」"
  37: "イエスは、ペトロとヤコブ、それにヤコブの兄弟[きょうだい]ヨハネのほかは、だれにも同行[どうこう]を許[ゆる]されなかった。"
  38: "会堂長[かいどうちょう]の家[いえ]に着[つ]くと、イエスは、人々[ひとびと]が取[と]り乱[みだ]して、泣[な]きわめき、大[おお]きく叫[さけ]んでいるのをご覧[らん]になった。"
  39: "中[なか]に入[はい]って言[い]われた。「<j>なぜ騒[さわ]いで泣[な]くのか。この子[こ]は死[し]んだのではない。眠[ねむ]っているのだ。</j>」"
  40: "人々[ひとびと]はイエスをあざ笑[わら]った。イエスは皆[みな]を外[そと]へ出[だ]し、子[こ]どもの父[ちち]と母[はは]、そして一緒[いっしょ]にいた者[もの]たちを連[つ]れて、子[こ]どものいる所[ところ]へ入[はい]られた。"
  41: "そして、子[こ]どもの手[て]を取[と]って言[い]われた。「<j>タリタ、クム。</j>」これは、「少女[しょうじょ]よ、あなたに言[い]う。起[お]きなさい」という意味[いみ]である。"
  42: "少女[しょうじょ]はすぐに起[お]き上[あ]がって歩[ある]き出[だ]した。十二歳[じゅうにさい]になっていた。人々[ひとびと]は、激[はげ]しい驚[おどろ]きに包[つつ]まれた。"
  43: "イエスは、このことをだれにも知[し]らせないようにと、彼[かれ]らに厳[きび]しく言[い]い含[ふく]め、また、少女[しょうじょ]に何[なに]か食[た]べさせてやるように言[い]われた。"

notes:
  1: "Γερασηνῶν — ゲラサ人; имя взято из критической базы, как и в Мф 8:28 (ガダラ人), где это оговорено. У jp-joc ガダラ, в Елизаветинской «Гадаринская»; разночтение Γαδαρηνῶν/Γεργεσηνῶν не маркирую — это имя места, а не добавка по смыслу."
  2: "В критическом тексте εὐθύς стоит в квадратных скобках; Церковь читает (jp-joc 直ちに) — 〔すぐに〕. ἐν πνεύματι ἀκαθάρτῳ — 汚れた霊に憑かれた."
  3: "κατοίκησιν — «жилище»; 住みか. οὐδὲ ἁλύσει — «даже цепью»; 鎖でさえ."
  4: "πέδαι — 足枷, ἁλύσεις — 鎖 (различение сохранено). διασπᾶσθαι — «разрывались»; 引きちぎり. δαμάσαι — «укротить»; 押さえつける."
  5: "κατακόπτων ἑαυτὸν λίθοις — «бил себя камнями»; 石で自分の体を傷つけていた."
  7: "Слова бесноватого — не красным. Τί ἐμοὶ καὶ σοί — 何の関わりがあるのか (как в 1:24). ὁρκίζω σε τὸν θεόν — 神にかけて願う."
  8: "ἔλεγεν γὰρ — «ибо говорил»: пояснение, почему тот закричал; поэтому прошедшее 言われたのである."
  9: "Λεγιών — латинское legio; сноска о римском легионе (первое упоминание в книге). Слова беса — не красным."
  12: "Слова бесов — не красным. Πέμψον ἡμᾶς — 送って."
  13: "ὡς δισχίλιοι — «около двух тысяч»; 二千匹ほど. κατὰ τοῦ κρημνοῦ — 崖から."
  14: "ἀγρούς — «по деревням»; 村里."
  15: "σωφρονοῦντα — «в здравом уме»; 正気になって. ἱματισμένον — 服を着."
  19: "τοὺς σούς — «твоих близких»; 身内の者たち. ὁ κύριός σοι πεποίηκεν — 主があなたにしてくださった."
  22: "ἀρχισυναγώγων — 会堂長; сноска при первом упоминании в книге. ὀνόματι Ἰάϊρος — ヤイロ."
  23: "ἐσχάτως ἔχει — «при последнем издыхании»; 死にかかっています. ἵνα σωθῇ καὶ ζήσῃ — 癒して生き返らせてください. Слова Яира — не красным."
  26: "δαπανήσασα τὰ παρ᾽ αὐτῆς πάντα — «издержав всё своё»; 持ち物をすっかり使い果てた."
  28: "ἔλεγεν γάρ — «ибо говорила»: её собственные слова, поэтому в 「」 и вне красного."
  30: "τὴν ἐξ αὐτοῦ δύναμιν ἐξελθοῦσαν — «силу, вышедшую из Него»; ご自分から力が出て行った (не «изнутри»)."
  31: "Слова учеников — не красным; повтор слов Христа во вложенной цитате — 『』."
  33: "πᾶσαν τὴν ἀλήθειαν — «всю истину»; 一部始終."
  34: "σέσωκέν σε — перфект, «спасла тебя»; 癒した. ὕπαγε εἰς εἰρήνην — 安心して行きなさい. ἴσθι ὑγιὴς ἀπὸ τῆς μάστιγός σου — あなたの病から癒されて、健やかでいなさい."
  36: "παρακούσας — «услышав (мимоходом)»; その言葉を聞き."
  37: "συνακολουθῆσαι — «последовать вместе»; 同行. Трое названы поимённо, «далее никого» — だれにも…許されなかった."
  39: "τὸ παιδίον — この子. οὐκ ἀπέθανεν ἀλλὰ καθεύδει — 死んだのではない。眠っているのだ."
  41: "Ταλιθα κουμ — арамейское «девочка, встань»; транслитерация タリタ、クム, перевод в тексте, оба — красным (это слова Христа). У jp-joc 「タリファ、クミ」."
  42: "ἐξέστησαν ἐκστάσει μεγάλῃ — «изумились изумлением великим»; 激しい驚きに包まれた."
  43: "διεστείλατο … ἵνα μηδεὶς γνοῖ — «строго запретил, чтобы никто не узнал»; だれにも知らせないようにと言い含め."
