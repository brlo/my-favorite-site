# jp-box, 2-я Паралипоменон, глава 17. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); церковнославянский (csl-ru) — второй
# свидетель церковного текста (новый паритет, docs/japanese-bible.md):
# слав. чтения входят в основной текст без 〔…〕, вариант LXX — в notes.
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет;
# jp-ni (под авторским правом) не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 17: воцарение Иосафата (1), войско и укреплённые города (2, 12–19),
# благочестие и удаление высот (3–6), посольство учителей закона (7–9),
# страх Божий на окрестных царях и дары (10–11), итог могущества (12–13).
# Нумерация по gr: 19 стихов, совпадает с csl и ru.
# Особенности паритета: 3 — слав. добавляет имя «Давида»; 8 — слав. добавляет
# «Тов-Адония»; 11 — слав. добавляет козлов, в гр только овны.
# 〔…〕 нет: текст всех стихов есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 主, 王, 祭司, レビ人, 律法, 高[たか]い所[ところ], アシェラ,
# 勇士, 宦官, 戦車 уже пояснены в корпусе.
# Речь — 「…」 в этой главе не встречается: повествование.

tr_code: jp-box
book: 2par
chapter: 17
draft: true

verses:
  1: "彼[かれ]の子[こ]ヨシャファトが彼[かれ]に代[か]わって王[おう]となり、ヨシャファトはイスラエルに対[たい]して強[つよ]くなった。"
  2: "彼[かれ]はユダのすべての堅[かた]い町[まち]に軍[ぐん]を置[お]き、ユダのすべての町[まち]、また父[ちち]アサが先[さき]に取[と]り戻[もど]したエフライムの町々[まちまち]に指揮官[しきかん]を置[お]いた。"
  3: "主[しゅ]はヨシャファトとともにおられた。彼[かれ]が父[ちち]ダビデの初[はじ]めの道[みち]を歩[あゆ]み、偶像[ぐうぞう]を求[もと]めなかったからである。"
  4: "かえって、父[ちち]の神[かみ]である主[しゅ]を求[もと]め、父[ちち]の戒[いまし]めに従[したが]って歩[あゆ]み、イスラエルのわざのようにはしなかった。"
  5: "主[しゅ]は彼[かれ]の手[て]によって王国[おうこく]を堅[かた]くされた。ユダの人[ひと]々[びと]はみなヨシャファトに贈[おく]り物[もの]をしたので、彼[かれ]には多[おお]くの富[とみ]と栄光[えいこう]があった。"
  6: "彼[かれ]の心[こころ]は主[しゅ]の道[みち]にあって高[たか]められ、さらにユダの地[ち]から高[たか]い所[ところ]とアシェラの木立[こだち]を取[と]り除[のぞ]いた。"
  7: "彼[かれ]の治世[ちせい]の第三年[だいさんねん]に、彼[かれ]は自分[じぶん]の指揮官[しきかん]たちと力[ちから]ある者[もの]の子[こ]ら、すなわちアブディヤ、ゼカリヤ、ナタナエル、ミカヤをユダの町々[まちまち]へ遣[つか]わして教[おし]えさせた。"
  8: "彼[かれ]らとともにレビ人[びと]、すなわちサムイヤ、ナタニヤ、ゼバデヤ、アシエル、セミラモト、ヨナタン、アダニヤ、トビヤ、またトブ・アダニヤというレビ人がおり、彼[かれ]らとともに祭司[さいし]エリシャマとヨラムがいた。"
  9: "彼[かれ]らはユダで教[おし]え、主[しゅ]の律法[りっぽう]の書[しょ]を携[たずさ]えていた。彼らはユダの町々[まちまち]を巡[めぐ]って民[たみ]を教[おし]えた。"
  10: "主[しゅ]への恐[おそ]れが、ユダの周[まわ]りのすべての王国[おうこく]の上[うえ]に臨[のぞ]んだ。それで彼[かれ]らはヨシャファトと戦[たたか]わなかった。"
  11: "またペリシテ人[じん]のうちからも、ヨシャファトに贈[おく]り物[もの]と銀[ぎん]、そして品々[しなじな]が届[とど]けられた。アラビア人[じん]は彼[かれ]に雄羊[おひつじ]七千七百[ななせんななひゃく]と、雄山羊[おやぎ]七千七百[ななせんななひゃく]を連[つ]れて来[き]た。"
  12: "ヨシャファトはますます大[おお]きくなり、高[たか]みに達[たっ]するまでになった。彼[かれ]はユダに建物[たてもの]を建[た]て、堅[かた]い町々[まちまち]を築[きず]いた。"
  13: "彼[かれ]にはユダで多[おお]くの事業[じぎょう]があり、エルサレムには強[つよ]く力[ちから]ある戦[いくさ]人[びと]たちがいた。"
  14: "彼[かれ]らの数[かず]は、その父[ちち]の家[いえ]ごとに次[つぎ]のとおりである。ユダでは千人[せんにん]の長[ちょう]たち、すなわち長[おさ]エドナスと、彼[かれ]とともにいる勇士[ゆうし]三十万[さんじゅうまん]人[にん]。"
  15: "彼[かれ]に次[つ]ぐのは指揮官[しきかん]ヨハナンで、彼[かれ]とともに二十八万[にじゅうはちまん]人[にん]がいた。"
  16: "その次[つぎ]はゼカリヤの子[こ]アマツヤで、主[しゅ]に熱心[ねっしん]な者[もの]であり、彼[かれ]とともに勇士[ゆうし]二十万[にじゅうまん]人[にん]がいた。"
  17: "ベニヤミンからは勇士[ゆうし]エリアダで、彼[かれ]とともに弓[ゆみ]を射[い]る者[もの]と小盾[こだて]を持[も]つ者[もの]が二十万[にじゅうまん]人[にん]いた。"
  18: "その次[つぎ]はヨザバドで、彼[かれ]とともに戦[いくさ]に強[つよ]い者[もの]が十八万[じゅうはちまん]人[にん]いた。"
  19: "これらは王[おう]に仕[つか]える者[もの]たちであり、このほかに王[おう]がユダ全土[ぜんど]の堅[かた]い町々[まちまち]に置[お]いた者[もの]たちがいた。"

notes:
  1: "ἐβασίλευσεν ... ἀντ αὐτοῦ — воцарился вместо него (ἀντί + gen.). κατίσχυσεν ἐπὶ τὸν Ισραηλ — «укрепился над Израилем», т.е. стал силён против северного царства; слав. «укрепися над израилем»."
  2: "ἔδωκεν δύναμιν — «дал силу», т.е. поставил войско (δύναμις — воинская сила). ὀχυραί — укреплённые (堅い). ἡγουμένους — начальников (指挥官; слав. «воеводы»). προκατελάβετο — заранее овладел (καταλαμβάνω с προ-): города Ефраима, отнятые Асой."
  3: "ὅτι — потому что. ὁδοῖς τοῦ πατρὸς αὐτοῦ ταῖς πρώταις — «первыми путями отца своего»; слав. вносит имя «давида отца своего», отсюда в тексте 父ダビデ. εἴδωλα — идолы (偶像); в ru «Ваалов»."
  4: "ἀλλά — но, напротив. ἐξεζήτησεν — взыскал (ἐκζητέω). ἐντολαί — заповеди (戒め). οὐχ ὡς τοῦ Ισραηλ τὰ ἔργα — «не как у Израиля дела», т.е. не по делам северного царства (слав. «а не по делом израилевым»)."
  5: "κατηύθυνεν — направил, утвердил (κατευθύνω); слав. «укрепи». ἐν χειρὶ αὐτοῦ — в руке его, т.е. его руками. πλοῦτος καὶ δόξα πολλή — богатство и слава многая (多[おお]くの富[とみ]と栄光[えいこう])."
  6: "ὑψώθη καρδία αὐτοῦ — возвысилось сердце его (ὑψόω); слав. «вознесеся сердце его». ἄλση — священные рощи, здесь Ашеры (アシェラの木立[こだち], ср. 4 Цар 13:6). ἐξῆρεν — удалил (ἐξαίρω). ἔτι — ещё, сверх того."
  7: "τρίτῳ ἔτει τῆς βασιλείας — третий год царствования. ἡγουμένοι — начальники (指挥官); υἱοὶ τῶν δυνατῶν — сыны сильных, знатных. Имена: Αβδιας (アブディヤ), Ζαχαριας (ゼカリヤ), Ναθαναηλ (ナタナエル), Μιχαιας (ミカヤ); в ru добавлен «Бенхаил», в гр его нет. διδάσκειν — учить."
  8: "Λευῖται: Σαμουιας (サムイヤ; слав. «Самеа»), Ναθανιας (ナタニヤ), Ζαβδιας (ゼバデヤ), Ασιηλ (アシエル), Σεμιραμωθ (セミラモト, ср. 1 Пар 16:5), Ιωναθαν (ヨナタン), Αδωνιας (アダニヤ), Τωβιας (トビヤ). Слав. добавляет «товадониа» (Тов-Адония, по МТ) — в гр нет; по паритету внесено (トブ・アダニヤ). Затем Ελισαμα (エリシャマ) и Ιωραμ (ヨラム) — священники."
  9: "βύβλος νόμου κυρίου — «книга закона Господня» (βύβλος — свиток, книга; слав. «имеюще книгу»). διῆλθον — прошли, обошли (διέρχομαι). Учили по книге закона — ср. Втор 17:18–19."
  10: "ἔκστασις κυρίου — «ужас, исступление Господне» (ἔκστασις), т.е. страх Божий; слав. «страх Господень». κύκλῳ — вокруг. οὐκ ἐπολέμουν — имперфект: не воевали."
  11: "ἀλλόφυλοι — иноплеменники, филистимляне (ペリシテ人). δόματα — даяния, подарки. κριοὶ προβάτων — бараны из овец (雄羊[おひつじ]). Слав. добавляет «и козлов седмь тысящ седмь сот» — в гр только овны; по паритету внесено (雄山羊[おやぎ])."
  12: "πορευόμενος μείζων ἕως εἰς ὕψος — «идя всё большим, до высоты», т.е. возвышался непрестанно. οἰκήσεις — жилища, постройки (建物[たてもの]; слав. «домы»); в ru «крепости» — по МТ. πόλεις ὀχυράς — города укреплённые (堅い町々)."
  13: "ἔργα πολλά — многие дела, работы (事業[じぎょう]; слав. «дела»). ἄνδρες πολεμισταί — мужи воинственные (戦人[びと]). ἰσχύοντες — сильные; в ru «запасы» в городах — по МТ, в гр этого нет."
  14: "ἀριθμὸς αὐτῶν κατ᾿ οἴκους πατριῶν — число их по домам отцов. χιλίαρχοι — тысячники (千人[せんにん]の長[ちょう]). Εδνας — Една (エドナス; слав. «Еднас», ru «Адна»). υἱοὶ δυνατοὶ δυνάμεως — сыны сильные силою, т.е. храбрые воины (勇士[ゆうし])."
  15: "μετ᾿ αὐτόν — после него, за ним. Ιωαναν — Иоханан (ヨハナン). διακόσιαι ὀγδοήκοντα χιλιάδες — 280 000."
  16: "ὁ τοῦ Ζαχρι — сын Захрии (Ζαχρι); слав. «сын Захариин», отсюда в тексте ゼカリヤの子[こ]. προθυμούμενος τῷ κυρίῳ — усердствующий Господу, ревностный (слав. «усердствуяй»)."
  17: "Βενιαμιν — Вениамин (ベニヤミン). δυνατὸς δυνάμεως — сильный силою. τοξόται — стрелки из лука (弓[ゆみ]を射[い]る者[もの]). πελτασταί — щитоносцы, легковооружённые (πελταστής; слав. «держащих щиты»), отсюда 小盾[こだて]."
  18: "Ιωζαβαδ — Иозавад (ヨザバド; ср. 1 Пар 12:20). ἑκατὸν ὀγδοήκοντα χιλιάδες — 180 000. δυνατοὶ πολέμου — сильные на войне (戦[いくさ]に強[つよ]い者[もの])."
  19: "λειτουργοῦντες — служащие (λειτουργέω; слав. «служащии»). ἐκτὸς ὧν — кроме тех, которых. ἔδωκεν — поставил, дал (слав. «постави»). Речь о регулярном войске при царе, не считая гарнизонов по крепостям."
