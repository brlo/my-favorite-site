verses:
  1: "人[ひと]の心[こころ]の計画[けいかく]はその人にあり、舌[した]の答[こた]えは主[しゅ]から出[で]る。"
  2: "へりくだる者[もの]のわざはすべて神[かみ]の前[まえ]に明[あき]らかであり、主[しゅ]は霊[れい]を堅[かた]くされる。"
  3: "あなたのわざを主[しゅ]にゆだねよ。そうすれば、あなたの思[おも]いは確[かた]くされる。"
  4: "主[しゅ]はすべてのものをご自分[じぶん]のために造[つく]られた。不敬[ふけい]な者[もの]は災[わざわ]いの日[ひ]に滅[ほろ]びる。"
  5: "高[たか]ぶる心[こころ]の者[もの]はすべて神[かみ]の前[まえ]に汚[けが]れている。不正[ふせい]に手[て]を貸[か]す者も罰[ばつ]を免[まぬか]れない。"
  6: "良[よ]い道[みち]の始[はじ]めは正[ただ]しいことを行[おこな]うことにあり、それは神[かみ]に犠牲[ぎせい]をささげるよりも喜[よろこ]ばれる。"
  7: "主[しゅ]を求[もと]める者[もの]は、正[ただ]しさとともに悟[さと]りを得[え]る。"
  8: "まっすぐに主[しゅ]を求[もと]める者[もの]は平和[へいわ]を見[み]いだす。"
  9: "主[しゅ]のわざはすべて正[ただ]しさとともにあり、不敬[ふけい]な者[もの]は災[わざわ]いの日[ひ]のために取[と]っておかれる。"
  10: "王[おう]の唇[くちびる]には託宣[たくせん]がある。その口[くち]は裁[さば]きにおいて誤[あやま]らない。"
  11: "秤[はかり]の針[はり]は主[しゅ]のもとで正[ただ]しく、その分銅[ふんどう]も正しい。"
  12: "悪[あく]を行[おこな]う者[もの]は王[おう]に忌[い]むべき者である。王座[おうざ]は正[ただ]しさによって堅[かた]くされるからである。"
  13: "正[ただ]しい唇[くちびる]は王[おう]に喜[よろこ]ばれ、王はまっすぐな言葉[ことば]を愛[あい]する。"
  14: "王[おう]の怒[いか]りは死[し]の使者[ししゃ]である。しかし、知恵[ちえ]ある人[ひと]はそれをなだめる。"
  15: "命[いのち]の光[ひかり]のうちに王[おう]の子[こ]がいる。王に喜[よろこ]ばれる者[もの]は、遅[おそ]く降[ふ]る雨[あめ]の雲[くも]のようである。"
  16: "知恵[ちえ]の巣[す]は金[きん]よりも望[のぞ]ましく、分別[ふんべつ]の巣は銀[ぎん]よりも望ましい。"
  17: "命[いのち]の小道[こみち]は悪[あく]から離[はな]れ、正[ただ]しさの道[みち]は命の長[なが]さである。戒[いまし]めを受[う]け入[い]れる者[もの]は幸[さいわ]いのうちにあり、叱[しか]る言葉[ことば]を守る者は知恵[ちえ]を得[え]る。自分の道を守る者は自分の魂[たましい]を保[たも]ち、自分の命を愛[あい]する者はその口[くち]を慎[つつし]む。"
  18: "滅[ほろ]びに先立[さきだ]つのは高[たか]ぶりであり、倒[たお]れる前[まえ]に来[く]るのは悪[あく]しき思[おも]いである。"
  19: "へりくだって柔和[にゅうわ]であることは、高[たか]ぶる者[もの]たちと戦利品[せんりひん]を分[わか]けるよりも良[よ]い。"
  20: "事[こと]柄[がら]に通[つう]じた者[もの]は良[よ]いものを見[み]いだし、神[かみ]に信頼[しんらい]する者は幸[さいわ]いである。"
  21: "知恵[ちえ]ある者[もの]も賢[かしこ]い者も、つまらない者と呼ばれ、言葉[ことば]の甘[あま]い者はさらに多[おお]くを聞[き]く。"
  22: "悟[さと]りはそれを持[も]つ者[もの]にとって命[いのち]の泉[いずみ]であり、愚[おろ]かな者の戒[いまし]めは悪[あく]である。"
  23: "知恵[ちえ]ある者[もの]の心[こころ]は自分[じぶん]の口[くち]から出[で]ることを悟[さと]り、その唇[くちびる]に思慮[しりょ]を載[の]せる。"
  24: "良[よ]い言葉[ことば]は蜜[みつ]の巣[す]であり、その甘[あま]さは魂[たましい]の癒[いや]しである。"
  25: "人[ひと]にはまっすぐに見[み]える道[みち]があっても、その終[お]わりは死[し]の世界[せかい]の底[そこ]を見つめる。"
  26: "人[ひと]は苦[くる]しみのうちに自分[じぶん]のために働[はたら]き、自分の滅[ほろ]びを迫[せま]られる。しかし、曲[ま]がった者[もの]はその口[くち]に滅びを載[の]せている。"
  27: "愚[おろ]かな者[もの]は自分[じぶん]のために悪[あく]を掘[ほ]り、その唇[くちびる]に火[ひ]を蓄[たくわ]える。"
  28: "曲[ま]がった者[もの]は悪[あく]を送[おく]り広[ひろ]め、欺[あざむ]きの火[ひ]を悪にともし、友[とも]を引[ひ]き離[はな]す。"
  29: "不法[ふほう]な者[もの]は友[とも]を誘[さそ]い、良[よ]くない道[みち]へ引[ひ]き去[さ]る。"
  30: "自分[じぶん]の目[め]を据[す]えて曲[ま]がったことを考[かんが]え、唇[くちびる]ですべての悪[あく]を決[き]める者[もの]は、悪の炉[ろ]である。"
  31: "老[お]いることは誇[ほこ]りの冠[かんむり]であり、それは正[ただ]しさの道[みち]のうちに見[み]いだされる。"
  32: "怒[いか]りを遅[おそ]くする人[ひと]は強[つよ]い者[もの]にまさり、自分の怒りを治[おさ]める者は町[まち]を攻[せ]め取[と]る者にまさる。（思慮[しりょ]ある人は大[おお]いなる農夫[のうふ]にまさる。）"
  33: "すべてのことは不正[ふせい]な者[もの]のふところに入[はい]り込み、正[ただ]しいことはすべて主[しゅ]から出[で]る。"

notes:
  1: "В gr-lxx-byz 16:1 стоит «.» — стиха нет (дефект модуля). Переведён по csl 16:1 (единственный свидетель; ср. jp-joc 16:1), без скобок: «Человеку предложение сердца: и от Господа ответ языка» — замысел (предложение) сердца у человека, а ответ языка от Господа. В греческом этого стиха нет ни в каком виде; в 15:30 стоит другой стих («καρδία ἀνδρὸς λογιζέσθω δίκαια…»), поэтому скобки не ставятся."
  2: "πάντα τὰ ἔργα τοῦ ταπεινοῦ φανερὰ παρὰ τῷ θεῷ — все дела смиренного явны пред Богом (ταπεινός — смиренный, низкий; csl «смиреннаго»). Вторая половина gr 16:2 «οἱ δὲ ἀσεβεῖς ἐν ἡμέρᾳ κακῇ ὀλοῦνται» («нечестивые в день злой погибнут») в модуле дописана сюда, но по csl это конец ст. 4 — переведена в 16:4. Слав. добавляет «и укрепляяй духи Господь» (Господь утверждает духи) — в LXX нет, внесено в основной текст по паритету."
  3: "В gr 16:3 стоит «.» — дефект модуля; переведён по csl 16:3 (ср. jp-joc), без скобок: «Приближи ко Господу дела твоя, и утвердятся помышления твоя» — приблизь (принеси) к Господу дела твои, и утвердятся помыслы твои."
  4: "В gr 16:4 стоит «.» — дефект модуля; переведён по csl 16:4 (ср. jp-joc), без скобок: «Вся содела Господь себе ради: нечестивии же в день зол погибнут». Вторая половина в модуле есть — как конец gr 16:2 (см. notes 2)."
  5: "ἀκάθαρτος παρὰ θεῷ πᾶς ὑψηλοκάρδιος — нечист пред Богом всякий надменный сердцем (ὑψηλοκάρδιος). χειρὶ δὲ χεῖρας ἐμβαλὼν ἀδίκως — «вложив руку в руку» неправедно, жест поручительства и соучастия (ср. 11:21); передано 不正に手を貸す. οὐκ ἀθῳωθήσεται — не останется без наказания (ἀθῳόω — оправдывать)."
  6: "В gr 16:6 стоит «.» — дефект модуля; переведён по csl 16:6 (= jp-joc 16:6), без скобок: «Начало пути блага, еже творити праведная, приятна же пред Богом паче, нежели жрети жертвы». Этот же стих в модуле записан как gr 16:7, поэтому он стоит на церковном месте (16:6), а деление 6–8 дано по csl/jp-joc (см. шапку); с 16:9 нумерация совпадает с gr."
  7: "ὁ ζητῶν τὸν κύριον εὑρήσει γνῶσιν μετὰ δικαιοσύνης — ищущий Господа обретёт знание с правдой (γνῶσις — знание, разумение). В модуле это первая половина gr 16:8; csl делит этот стих на 16:7 и 16:8."
  8: "οἱ δὲ ὀρθῶς ζητοῦντες αὐτὸν εὑρήσουσιν εἰρήνην — право ищущие Его обретут мир (ὀρθῶς — прямо, правильно). Вторая половина gr 16:8; csl даёт её отдельным стихом 16:8."
  9: "πάντα τὰ ἔργα τοῦ κυρίου μετὰ δικαιοσύνης — все дела Господни с правдой. φυλάσσεται δὲ ὁ ἀσεβὴς εἰς ἡμέραν κακήν — нечестивый сберегается (хранится) на день злой (φυλάσσω; ср. 16:4)."
  10: "μαντεῖον ἐπὶ χείλεσιν βασιλέως — оракул (изречение) на устах царя; μαντεῖον передано 託宣 (слово в корпусе новое — кандидат в сноски). ἐν δὲ κρίσει οὐ μὴ πλανηθῇ τὸ στόμα αὐτοῦ — и на суде не ошибётся устами своими (πλανάω — вводить в заблуждение)."
  11: "ῥοπὴ ζυγοῦ — стрелка (наклон) весов, csl «превеса мерила»; στάθμια δίκαια — верные гири (στάθμιον — гиря; ср. 11:1). Смысл: мера и вес — от Господа."
  12: "βδέλυγμα βασιλεῖ ὁ ποιῶν κακά — мерзость царю делающий злое. μετὰ γὰρ δικαιοσύνης ἑτοιμάζεται θρόνος ἀρχῆς — ибо правдой уготовляется престол начальства (ἑτοιμάζω — готовить, утверждать)."
  13: "δεκτὰ βασιλεῖ χείλη δίκαια — угодны царю уста праведные. λόγους δὲ ὀρθοὺς ἀγαπᾷ — и слова прямые любит; подлежащее — царь. csl во второй половине читает «Господь» («словеса же правая любит Господь»); по контексту и LXX подлежащее царь, слав. чтение отмечено здесь."
  14: "θυμὸς βασιλέως ἄγγελος θανάτου — гнев царя — вестник смерти. ἀνὴρ δὲ σοφὸς ἐξιλάσεται αὐτόν — муж же мудрый умилостивит его (ἐξιλάσκομαι — умилостивлять, утолять)."
  15: "ἐν φωτὶ ζωῆς υἱὸς βασιλέως — в свете жизни сын царя (буквально по LXX; в МТ «в свете лица царя»). οἱ δὲ προσδεκτοὶ αὐτῷ ὥσπερ νέφος ὄψιμον — угодные ему — как облако позднее (ὄψιμος — поздний, о дожде)."
  16: "νοσσιαὶ σοφίας — гнёзда (выводки) премудрости (νοσσιά — гнездо; csl «угнеждения»); αἱρετώτεραι χρυσίου — предпочтительнее золота. Смысл: обретение мудрости дороже золота и серебра."
  17: "τρίβοι ζωῆς — тропы жизни; μῆκος βίου — долгота жизни. 17a–17c — подстихи внутри gr 16:17 (в csl они в том же стихе): «принимающий наказание во благих будет», «хранящий обличения умудрится», «хранящий свои пути соблюдает свою душу», «любящий жизнь свою щадит уста свои». Отдельных стихов не делаем."
  18: "πρὸ συντριβῆς ἡγεῖται ὕβρις — прежде сокрушения предшествует надменность (ὕβρις — гордыня, дерзость). πρὸ δὲ πτώματος κακοφροσύνη — прежде падения зломыслие (κακοφροσύνη — превратное мудрование). Параллелизм сохранён."
  19: "κρείσσων πραΰθυμος μετὰ ταπεινώσεως — лучше кроткий с уничижением (πραΰθυμος — тихий, кроткий; ταπείνωσις — смирение). ἢ ὃς διαιρεῖται σκῦλα μετὰ ὑβριστῶν — нежели тот, кто делит добычу с надменными (σκῦλον — добыча)."
  20: "συνετὸς ἐν πράγμασιν — разумный в делах; εὑρετὴς ἀγαθῶν — обретатель благ. πεποιθὼς δὲ ἐπὶ θεῷ μακαριστός — надеющийся на Бога блажен (μακαριστός — блаженный, счастливый)."
  21: "τοὺς σοφοὺς καὶ συνετοὺς φαύλους καλοῦσιν — мудрых и разумных называют ничтожными (φαῦλος — дурной, пустой; csl «злыми наричут»); место тёмное, ru/МТ иначе («мудрый сердцем прозовётся благоразумным»). οἱ δὲ γλυκεῖς ἐν λόγῳ πλείονα ἀκούσονται — сладкие в слове услышат больше."
  22: "πηγὴ ζωῆς ἔννοια — разумение — источник жизни (ἔννοια — мысль, разумение). παιδεία δὲ ἀφρόνων κακή — наставление (наказание) глупых зло."
  23: "καρδία σοφοῦ νοήσει τὰ ἀπὸ τοῦ ἰδίου στόματος — сердце мудрого уразумеет исходящее из его собственных уст. ἐπὶ δὲ χείλεσιν φορέσει ἐπιγνωμοσύνην — и на устах будет носить рассудительность (ἐπιγνωμοσύνη)."
  24: "κηρία μέλιτος λόγοι καλοί — соты мёда — слова добрые (κηρίον — сот; ср. Пс 18:11). γλύκασμα δὲ αὐτῶν ἴασις ψυχῆς — сладость их — исцеление души."
  25: "εἰσὶν ὁδοὶ δοκοῦσαι εἶναι ὀρθαί — есть пути, кажущиеся прямыми. τὰ τελευταῖα αὐτῶν βλέπει εἰς πυθμένα ᾅδου — конец их смотрит в дно ада (πυθμήν — дно; ᾅδης — преисподняя, よみ); ср. 14:12."
  26: "ἀνὴρ ἐν πόνοις πονεῖ ἑαυτῷ — человек в трудах трудится себе. ἐκβιάζεται ἑαυτοῦ τὴν ἀπώλειαν — понуждает (вынуждает) свою погибель (ἐκβιάζομαι); место тёмное, ru/МТ иначе. ὁ σκολιὸς ἐπὶ τῷ ἑαυτοῦ στόματι φορεῖ τὴν ἀπώλειαν — кривой на своих устах носит погибель."
  27: "ἀνὴρ ἄφρων ὀρύσσει ἑαυτῷ κακά — глупый копает себе злое (ὀρύσσω — копать). ἐπὶ τῶν ἑαυτοῦ χειλέων θησαυρίζει πῦρ — на устах своих сокровиществует огонь (θησαυρίζω)."
  28: "ἀνὴρ σκολιὸς διαπέμπεται κακά — человек кривой рассылает злое (διαπέμπω — рассылать). λαμπτῆρα δόλου πυρσεύει κακοῖς — светильник коварства зажигает для злых (πυρσεύω — зажигать). διαχωρίζει φίλους — разлучает друзей."
  29: "ἀνὴρ παράνομος ἀποπειρᾶται φίλων — беззаконный испытывает (соблазняет) друзей (ἀποπειράομαι). ἀπάγει αὐτοὺς ὁδοὺς οὐκ ἀγαθάς — уводит их на пути недобрые."
  30: "στηρίζων ὀφθαλμοὺς αὐτοῦ — уставивший (утвердивший) глаза свои; λογίζεται διεστραμμένα — замышляет превратное. ὁρίζει τοῖς χείλεσιν αὐτοῦ πάντα τὰ κακά — определяет устами своими всё злое. οὗτος κάμινός ἐστιν κακίας — это печь злобы (κάμινος). ru/МТ иначе («прищуривает глаза»)."
  31: "στέφανος καυχήσεως γῆρας — венец похвалы — старость (γῆρας; καύχησις — похвала). ἐν ὁδοῖς δικαιοσύνης εὑρίσκεται — на путях правды обретается; ср. 20:29."
  32: "κρείσσων ἀνὴρ μακρόθυμος ἰσχυροῦ — лучше муж долготерпеливый сильного (μακρόθυμος — долготерпеливый). ὁ κρατῶν ὀργῆς — владеющий гневом; καταλαμβανομένου πόλιν — берущего город. csl добавляет в скобках «и муж разум имеяй паче земледелца великаго» — в LXX нет, внесено в текст по паритету как слав. глосса."
  33: "εἰς κόλπους ἐπέρχεται πάντα τοῖς ἀδίκοις — «в недра входит всё неправедным» (εἰς κόλπους — в пазуху, за пазуху); παρὰ δὲ κυρίου πάντα τὰ δίκαια — от Господа же всё праведное. Место тёмное: ru/МТ читают о жребии («в полу бросается жребий, но всё решение его — от Господа»), в LXX и csl иное — держимся греческого."
