# jp-box, Притчи, глава 16. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный, с масоретского) — только
# для понимания, не источник. jp-joc (1901) есть для всей главы — контроль церковного
# чтения, архаизмы не копировались. jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 16: человек и Господь (1–9), царь (10–15), мудрость и слово (16–24),
# пути и погибель (25–30), старость и гнев (31–32), жребий (33). Прямой речи нет —
# авторские изречения, внешних кавычек нет; двустишия с параллелизмом сохранены.
# Нумерация: 33 стиха, как в gr.
# ВНИМАНИЕ (дефект модуля): 16:1, 16:3, 16:4, 16:6 в gr-lxx-byz стоят как «.».
# Переведены по csl (единственный свидетель; ср. jp-joc), без скобок, см. notes.
# В модуле сдвинуто деление в начале главы: стих «Начало пути блага» (csl 16:6,
# jp-joc 16:6) записан как gr 16:7, а gr 16:8 склеивает csl 16:7–8. Чтобы не
# дублировать стих, ст. 6–8 даны по церковному делению (csl/jp-joc): 6 — «Начало
# пути блага», 7 — «Ищущий Господа обретает знание», 8 — «право ищущие — мир»;
# с 16:9 нумерация совпадает с gr. Стихов 33, не добавлялись и не дробились.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).

