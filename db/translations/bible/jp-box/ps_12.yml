verses:
  0: "指揮者[しきしゃ]に。ダビデの詩[うた]。"
  1: "主[しゅ]よ、いつまでわたしを忘[わす]れておられるのか。いつまで、あなたの顔[かお]をわたしから隠[かく]しておられるのか。"
  2: "いつまで、わたしは魂[たましい]のうちに思[おも]いを巡[めぐ]らし、心[こころ]に悲[かな]しみを抱[かか]いて日[ひ]を過[す]ごすのか。いつまで、わたしの敵[てき]はわたしの上[うえ]に高[たか]ぶるのか。"
  3: "主[しゅ]、わたしの神[かみ]よ、目[め]を留[と]めて、わたしの声[こえ]を聞[き]いてください。わたしの目[め]を明[あき]らかにしてください。死[し]の眠[ねむ]りに眠[ねむ]ることがないように。"
  4: "わたしの敵[てき]が「わたしは彼[かれ]に勝[か]った」と言[い]わないように。わたしが揺[ゆ]らぐとき、わたしを苦[くる]しめる者[もの]たちが喜[よろこ]ばないように。"
  5: "しかし、わたしはあなたのあわれみに寄[よ]り頼[たの]んだ。わたしの心[こころ]はあなたの救[すく]いによって喜[よろこ]び踊[おど]る。"
  6: "わたしは、わたしに良[よ]くしてくださった主[しゅ]に歌[うた]い、いと高[たか]い主[しゅ]の名[な]をほめ歌[うた]う。"

notes:
  0: "Εἰς τὸ τέλος· ψαλμὸς τῷ Δαυιδ — 指揮者に。ダビデの詩. Надписание — стих 0."
  1: "Ἕως πότε, κύριε, ἐπιλήσῃ μου εἰς τέλος — 主よ、いつまでわたしを忘れておられるのか (ἐπιλανθάνομαι — «забывать»; εἰς τέλος — «совершенно, до конца»). ἕως πότε ἀποστρέψεις τὸ πρόσωπόν σου ἀπ᾽ ἐμοῦ — いつまで、あなたの顔をわたしから隠しておられるのか (ἀποστρέφω τὸ πρόσωπον — «отвращать лицо», образ гнева). Повтор ἕως πότε сохранён дважды."
  2: "ἕως τίνος θήσομαι βουλὰς ἐν ψυχῇ μου — いつまで、わたしは魂のうちに思いを巡らすのか (βουλή — «совет, помысел»). ὀδύνας ἐν καρδίᾳ μου ἡμέρας — 心に悲しみを抱いて日を過ごす (ὀδύνη — «боль, печаль»; ἡμέρας — «днями, весь день»). ἕως πότε ὑψωθήσεται ὁ ἐχθρός μου ἐπ᾽ ἐμέ — いつまで、わたしの敵はわたしの上に高ぶるのか (ὑψόω — «возвышаться»)."
  3: "ἐπίβλεψον, εἰσάκουσόν μου, κύριε ὁ θεός μου — 主わたしの神よ、目を留めて、わたしの声を聞いてください (ἐπιβλέπω — «призреть»). φώτισον τοὺς ὀφθαλμούς μου — わたしの目を明らかにしてください (φωτίζω — «просвещать»; образ жизни, а не зрения). μήποτε ὑπνώσω εἰς θάνατον — 死の眠りに眠ることがないように (ὑπνόω — «засыпать»; εἰς θάνατον — «в смерть»)."
  4: "μήποτε εἴπῃ ὁ ἐχθρός μου Ἴσχυσα πρὸς αὐτόν — わたしの敵が「わたしは彼に勝った」と言わないように (ἰσχύω πρός τινα — «одолеть кого»). οἱ θλίβοντές με ἀγαλλιάσονται, ἐὰν σαλευθῶ — わたしが揺らぐとき、わたしを苦しめる者たちが喜ばないように (θλίβω — «теснить»; σαλεύω — «колебать»)."
  5: "ἐγὼ δὲ ἐπὶ τῷ ἐλέει σου ἤλπισα — しかし、わたしはあなたのあわれみに寄り頼んだ (ἔλεος — あわれみ). ἀγαλλιάσεται ἡ καρδία μου ἐπὶ τῷ σωτηρίῳ σου — わたしの心はあなたの救いによって喜び踊る (σωτήριον — «спасение»)."
  6: "ᾄσω τῷ κυρίῳ τῷ εὐεργετήσαντί με — わたしは、わたしに良くしてくださった主に歌い (ᾄδω — «петь»; εὐεργετέω — «благодетельствовать»). ψαλῶ τῷ ὀνόματι κυρίου τοῦ ὑψίστου — いと高い主の名をほめ歌う (ψάλλω — «петь под струны»)."
