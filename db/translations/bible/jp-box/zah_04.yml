# jp-box, Захария, глава 4. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной (совпадает с gr: 14 стихов).
# Язык — современный 常体; 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1–3 пробуждение и видение золотого светильника с чашечкой, семью лампадами
# и двумя маслинами; 4–5 вопрос и ответ Ангела; 6–7 «не силою, но Духом Моим», великая
# гора перед Зоровавелем, камень наследия; 8–10 слово Господне: руки Зоровавеля,
# «день малый», оловянный камень, семь очей; 11–14 две маслины и две ветви, «сыны
# тучности» пред Господом всей земли.
# Голоса: 1–3 рассказ и ответ пророка в 「…»; 4–5 диалог; 6–7 речь Ангела в 「…»
# со словом Господа в 『…』; 8–10 слово Господне в 「…»; 11–12 вопрос пророка в 「…»;
# 13–14 диалог.
# Термины: 燭台[しょくだい] — λυχνία; 受[う]け皿[ざら] — λαμπάδιον; 灯[ともしび] —
# λύχνος; 管[くだ] — ἐπαρυστρίς; 嗣業[しぎょう]の石[いし] — λίθος τῆς κληρονομίας;
# 錫[すず]の石[いし] — λίθος κασσιτέρινος (отвес).
#
tr_code: jp-box
book: zah
chapter: 4
draft: true

verses:
  1: "わたしと語[かた]っていた天使[てんし]が戻[もど]って来[き]て、人[ひと]を眠[ねむ]りから起[お]こすように、わたしを起[お]こした。"
  2: "彼はわたしに言[い]った。「何[なに]が見[み]えるか。」わたしは言[い]った。「見[み]ますと、すべて金[きん]でできた燭台[しょくだい]があり、その上[うえ]に油[あぶら]の受[う]け皿[ざら]があり、その上[うえ]に七[なな]つの灯[ともしび]があり、その上[うえ]の灯[ともしび]には七[なな]本[ほん]の管[くだ]があります。"
  3: "また、その上[うえ]に二[ふた]本[ほん]のオリーブの木[き]があり、一[ひと]つは受[う]け皿[ざら]の右[みぎ]に、一[ひと]つはその左[ひだり]にあります。」"
  4: "わたしは、わたしと語[かた]る天使[てんし]に答[こた]えて言[い]った。「主[しゅ]よ、これらは何[なん]ですか。」"
  5: "わたしと語[かた]る天使[てんし]は答[こた]えて言[い]った。「これらが何[なん]であるか、あなたは知[し]らないのか。」わたしは言[い]った。「いいえ、主[しゅ]よ。」"
  6: "彼は答[こた]えて言[い]った。「これはゼルバベルへの主[しゅ]の言葉[ことば]である。『大[おお]きな力[ちから]によってでもなく、強[つよ]さによってでもなく、わたしの霊[れい]によって、と万軍[ばんぐん]の主[しゅ]は言[い]われる。"
  7: "大[おお]きな山[やま]よ、おまえは何者[なにもの]か。ゼルバベルの前[まえ]では平地[へいち]となる。彼は嗣業[しぎょう]の石[いし]を運[はこ]び出[だ]し、恵[めぐ]みの等[ひと]しさ、その恵[めぐ]みを与[あた]えるであろう。』」"
  8: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  9: "「ゼルバベルの手[て]がこの家[いえ]の基[いしずえ]を据[す]え、彼の手[て]がこれを完成[かんせい]する。あなたは、万軍[ばんぐん]の主[しゅ]がわたしをあなたがたに遣[つか]わしたことを知[し]るであろう。"
  10: "小[ちい]さな日[ひ]々[び]をだれが蔑[さげす]んだか。人[ひと]々[びと]は喜[よろこ]び、ゼルバベルの手[て]にある錫[すず]の石[いし]を見[み]るであろう。この七[なな]つは主[しゅ]の目[め]であり、全[ぜん]地[ち]を見[み]渡[わた]っている。」"
  11: "わたしは答[こた]えて彼に言[い]った。「燭台[しょくだい]の右[みぎ]と左[ひだり]にある、あの二[ふた]本[ほん]のオリーブの木[き]は何[なん]ですか。」"
  12: "わたしは二[ふた]たび尋[たず]ねて彼に言[い]った。「金[きん]の管[くだ]の手[て]もとから金[きん]を注[そそ]ぎ出[だ]している、あの二[ふた]本[ほん]のオリーブの枝[えだ]は何[なん]ですか。」"
  13: "彼はわたしに言[い]った。「これらが何[なん]であるか、あなたは知[し]らないのか。」わたしは言[い]った。「いいえ、主[しゅ]よ。」"
  14: "彼は言[い]った。「これらは、全[ぜん]地[ち]の主[しゅ]の前[まえ]に立[た]つ、油[あぶら]に満[み]ちた二[ふた]人[り]の者[もの]である。」"

notes:
  1: "ἐπέστρεψεν… ἐξήγειρέν με — «возвратился… разбудил меня»; ὃν τρόπον… ἐξ ὕπνου — «как пробуждают от сна»."
  2: "λυχνία χρυσῆ ὅλη — «светильник весь золотой»; λαμπάδιον — «чашечка (для елея)»; ἑπτὰ λύχνοι — «семь лампад»; ἑπτὰ ἐπαρυστρίδες — «семь трубочек (воронок)»."
  3: "δύο ἐλαῖαι — «две маслины»; ἐκ δεξιῶν / ἐξ εὐωνύμων — «справа / слева»."
  4: "κύριε — «господин мой» (обращение к Ангелу), 主よ."
  5: "Οὐ γινώσκεις… — «не знаешь ли?»; Οὐχί, κύριε — «нет, господи»."
  6: "Οὐκ ἐν δυνάμει μεγάλῃ οὐδὲ ἐν ἰσχύι — «не силою великою и не крепостию»; ἀλλ' ἢ ἐν πνεύματί μου — «но Духом Моим»."
  7: "τίς εἶ σύ, τὸ ὄρος τὸ μέγα — «кто ты, гора великая»; ἰσότης χάριτος — «равенство благодати» (слав. «равенство благодати»; тёмное); в ru «при шумных восклицаниях: благодать, благодать на нем» — иное чтение, не внесено."
  8: "ἐγένετο λόγος κυρίου πρός με — «было слово Господне ко мне»."
  9: "ἐθεμελίωσαν τὸν οἶκον — «положили основание дому»; ἐπιτελέσουσιν — «окончат»."
  10: "ἐξουδένωσεν εἰς ἡμέρας μικράς — «уничижил в дни малые»; λίθον τὸν κασσιτέρινον — «оловянный камень» (отвес); ἑπτὰ ὀφθαλμοὶ κυρίου — «семь очей Господних»."
  11: "αἱ δύο ἐλαῖαι αὗται — «две маслины сии»."
  12: "ἐκ δευτέρου — «во второй раз»; κλάδοι — «ветви»; μυξωτῆρες χρυσοῖ — «золотые трубочки»; ἐπιχεόντων… τὰς ἐπαρυστρίδας — «изливающих… чашечки»; «золото» — золотистое масло, оставлено как в тексте."
  13: "Οὐκ οἶδας… — «не знаешь ли?»"
  14: "υἱοὶ τῆς πιότητος — «сыны тучности (елея)», т. е. помазанные; 油に満ちた."
