verses:
  1: "エッサイの根[ね]から若枝[わかえだ]が出[で]、その根[ね]から花[はな]が咲[さ]き上[のぼ]る。"
  2: "その上[うえ]に神[かみ]の霊[れい]がとどまる。知恵[ちえ]と悟[さと]りの霊[れい]、助言[じょげん]と力[ちから]の霊[れい]、知識[ちしき]と敬虔[けいけん]の霊[れい]である。"
  3: "神[かみ]を恐[おそ]れる霊[れい]が彼[かれ]を満[み]たす。彼はその栄光[えいこう]によって裁[さば]くことなく、その語[かた]ることによって責[せ]めることもない。"
  4: "しかし、へりくだる者[もの]には義[ぎ]をもって裁[さば]きを行[おこな]い、地[ち]のへりくだる者[もの]たちを正[ただ]しさをもって責[せ]める。彼はその口[くち]の言葉[ことば]で地[ち]を打[う]ち、その唇[くちびる]の霊[れい]で悪[あく]しき者[もの]を滅[ほろ]ぼす。"
  5: "義[ぎ]がその腰[こし]の帯[おび]となり、真理[しんり]がその脇腹[わきばら]を包[つつ]む。"
  6: "狼[おおかみ]は子羊[こひつじ]とともに草[くさ]を食[た]べ、豹[ひょう]は子山羊[こやぎ]とともに伏[ふ]し、子牛[こうし]と雄牛[おうし]と獅子[しし]はともに草[くさ]を食[た]べ、幼[おさな]い子[こ]が彼[かれ]らを導[みちび]く。"
  7: "雄牛[おうし]と熊[くま]はともに草[くさ]を食[た]べ、その子[こ]どもたちもともにいる。獅子[しし]も雄牛[おうし]のように藁[わら]を食[た]べる。"
  8: "乳飲[ちの]み子[ご]が蝮[まむし]の穴[あな]の上[うえ]に手[て]を置[お]き、毒蛇[どくへび]の子[こ]らの寝床[ねどこ]に手[て]を伸[の]べる。"
  9: "わたしの聖[せい]なる山[やま]では、だれも悪[わる]を行[おこな]わず、だれも滅[ほろ]ぼすことができない。地[ち]は主[しゅ]を知[し]る知識[ちしき]で満[み]ち、水[みず]が海[うみ]を覆[おお]うようになるからである。"
  10: "その日[ひ]、エッサイの根[ね]が立[た]ち、諸国[しょこく]の民[たみ]を治[おさ]めるために起[お]こる。諸国[しょこく]の民[たみ]は彼[かれ]に望[のぞ]みを置[お]き、彼の安[やす]らぎは栄誉[えいよ]となる。"
  11: "その日[ひ]、主[しゅ]は再[ふたた]びその手[て]を伸[の]べ、アッシリア人[じん]、エジプト、バビロニア、エチオピア、エラム人[じん]、日[ひ]の昇[のぼ]る東[ひがし]の方[ほう]、アラビア、また海[うみ]の島々[しまじま]から、残[のこ]された民[たみ]の残[のこ]りを熱心[ねっしん]に求[もと]められる。"
  12: "主[しゅ]は諸国[しょこく]の民[たみ]に向[む]けてしるしを上[あ]げ、滅[ほろ]びたイスラエルを集[あつ]め、散[ち]らされたユダの人々[ひとびと]を地[ち]の四方[しほう]の端[はし]から集[あつ]められる。"
  13: "エフライムの妬[ねた]みは取[と]り去[さ]られ、ユダに敵[てき]する者[もの]は滅[ほろ]びる。エフライムはユダを妬[ねた]まず、ユダはエフライムを苦[くる]しめない。"
  14: "彼[かれ]らはペリシテ人[じん]の船[ふね]に乗[の]って海[うみ]を飛[と]び、ともに東[ひがし]の人々[ひとびと]とエドムとを奪[うば]い、モアブにまず手[て]をかける。アンモンの子[こ]らはまず従[したが]う。"
  15: "主[しゅ]はエジプトの海[うみ]を荒[あ]らし、強[つよ]い風[かぜ]の霊[れい]をもってその手[て]を川[かわ]の上[うえ]に置[お]かれる。主[しゅ]はそれを七[なな]つの谷[たに]に打[う]ち分[わ]け、履物[はきもの]のまま渡[わた]れるようにされる。"
  16: "エジプトに残[のこ]されたわたしの民[たみ]には通[とお]り道[みち]ができる。イスラエルにとって、それはエジプトの地[ち]から出[で]た日[ひ]のようになる。"

notes:
  1: "ἐξελεύσεται ῥάβδος ἐκ τῆς ῥίζης Ιεσσαι — «выйдет жезл из корня Иессея»: ῥάβδος — «жезл, побег», здесь «побег, отрасль» (слав. «жезл»). ἄνθος ἐκ τῆς ῥίζης ἀναβήσεται — «и цвет от корня его взойдёт»: ἄνθος — «цветок» (花), слав. «цвет»; у МТ «ветвь», но LXX и слав. дают «цвет». ῥίζα — 根."
  2: "ἀναπαύσεται ἐπ᾽ αὐτόν — «почиет на нём», «опустится на него». πνεῦμα τοῦ θεοῦ — «Дух Божий» (слав.; ru «Дух Господень» — по МТ). Перечислены шесть пар: σοφία — 知恵, σύνεσις — 悟り, βουλή — 助言, ἰσχύς — 力, γνῶσις — 知識, εὐσέβεια — 敬虔; седьмой дар — πνεῦμα φόβου θεοῦ в 11:3. Перечисление не сглажено, повтор πνεῦμα сохранён."
  3: "ἐμπλήσει αὐτὸν πνεῦμα φόβου θεοῦ — «исполнит его Дух страха Божия». οὐ κατὰ τὴν δόξαν κρινεῖ — «не по славе будет судить»: δόξα здесь «внешний вид, видимость» (слав. «по славе»), поэтому その栄光によって; οὐδὲ κατὰ τὴν λαλιὰν ἐλέγξει — «и не по речи обличит»: λαλιά — «разговор, речь» (слав. «глаголание»)."
  4: "κρινεῖ ταπεινῷ κρίσιν — «судит смиренному суд», т. е. будет судить по правде бедного; ταπεινός — «смиренный, угнетённый» (へりくだる者). ἐλέγξει τοὺς ταπεινοὺς τῆς γῆς — «обличит смиренных земли». Слав. добавляет «правдою» и «правостию» — в LXX этих слов нет; по паритету внесены в основной текст без скобок (義をもって、正しさをもって). πατάξει γῆν τῷ λόγῳ τοῦ στόματος — «поразит землю словом уст»; ἐν πνεύματι διὰ χειλέων — «духом через уста» (слав. «духом устен»)."
  5: "ἔσται δικαιοσύνῃ ἐζωσμένος τὴν ὀσφύν — «будет препоясан правдою по чреслам»: ζώννυμι — «опоясывать», ὀσφύς — «поясница, чресла» (腰). ἀληθείᾳ εἰλημμένος τὰς πλευράς — «истиною обвит по рёбрам»: λαμβάνω здесь «обхватывать, обвивать», πλευρά — «бок, ребро» (脇腹). δικαιοσύνη — 義, ἀλήθεια — 真理."
  6: "συμβοσκηθήσεται — «будет пастись вместе» (σύν + βόσκω); συναναπαύσεται — «будет покоиться вместе». Перечислены μοσχάριον, ταῦρος, λέων — «телец, бык и лев»; у МТ и в ru иначе («теленок, молодой лев и вол»), держим греческий. παιδίον μικρόν — «малое дитя» (幼い子); ἄξει — «поведёт»."
  7: "βοῦς — «вол, бык» (雄牛); ἄρκος — «медведь» (熊). ἅμα τὰ παιδία αὐτῶν ἔσονται — «вместе будут дети их» (сказуемое не повторено, отсюда ともにいる). καὶ λέων καὶ βοῦς ἅμα φάγονται ἄχυρα — «и лев и бык вместе будут есть солому»; слав. «лев аки вол» — сравнение, по паритету взято слав. чтение (獅子も雄牛のように), вариант LXX — «и лев и вол». ἄχυρα — «солома, мякина» (藁)."
  8: "παιδίον νήπιον — «грудной младенец» (乳飲み子); τρώγλη — «нора, пещера» (穴); κοίτη — «ложе» (寝床); ἀσπίς — «аспид, кобра» (蝮). τὴν χεῖρα ἐπιβαλεῖ — «возложит руку» (手を伸べる); сказуемое одно, второго подлежащего в греч. нет."
  9: "οὐ μὴ κακοποιήσωσιν — «не сделают зла»; οὐδὲ μὴ δύνωνται ἀπολέσαι οὐδένα — «и не смогут погубить никого». ἐπὶ τὸ ὄρος τὸ ἅγιόν μου — «на святой горе Моей»: первое лицо — голос Господа в пророчестве, кавычки не ставились (в LXX границы речи не отмечены). ἐνεπλήσθη ἡ σύμπασα — «наполнилась вся» (σύμπασα без существительного; слав. «вся земля»). ὡς ὕδωρ πολὺ κατακαλύψαι θαλάσσας — «как много воды покрыть моря» (инфинитив цели)."
  10: "ἡ ῥίζα τοῦ Ιεσσαι καὶ ὁ ἀνιστάμενος ἄρχειν ἐθνῶν — «корень Иессея и восстающий владеть народами»; ἀνίστημι — «вставать, восставать» (立つ、起こる). ἐπ᾽ αὐτῷ ἔθνη ἐλπιοῦσιν — «на него народы будут уповать». ἀνάπαυσις αὐτοῦ τιμή — «покой его — честь» (слав. «честь»; ru «слава» по МТ), передано 安らぎは栄誉."
  11: "προσθήσει κύριος τοῦ δεῖξαι τὴν χεῖρα — «приложит Господь показать руку», т. е. снова прострет (再び伸べる). τοῦ ζηλῶσαι τὸ καταλειφθὲν ὑπόλοιπον — «чтобы возревновать об оставленном остатке»: ζηλόω — «проявлять ревность, горячо искать» (熱心に求める). Перечень: Ассирия, Египет, Вавилония (LXX Βαβυλωνία; слав. «вавилона» — иное имя, в тексте форма LXX), Эфиопия, еламиты, восток, Аравия; слав. добавляет «и от островов морских» — в LXX нет, по паритету внесено (海の島々). ru даёт иные топонимы по МТ (Патроса, Хус, Сеннаар, Емаф) — не внесены."
  12: "ἀρεῖ σημεῖον εἰς τὰ ἔθνη — «поднимет знак для народов» (σημεῖον — しるし, в контексте знамя). τοὺς ἀπολομένους Ισραηλ — «погибших Израиля»; τοὺς διεσπαρμένους τοῦ Ιουδα — «рассеянных Иуды». ἐκ τῶν τεσσάρων πτερύγων τῆς γῆς — «от четырёх крыльев земли», т. е. от четырёх краёв (四方の端); πτέρυξ — «крыло»."
  13: "ἀφαιρεθήσεται ὁ ζῆλος Εφραιμ — «отнимется ревность Ефрема»: ζῆλος — «ревность, зависть» (妬み). οἱ ἐχθροὶ Ιουδα ἀπολοῦνται — «враги Иуды погибнут». οὐ ζηλώσει — «не будет ревновать»; οὐ θλίψει — «не будет теснить, оскорблять» (слав. «оскорбит»; 苦しめない)."
  14: "πετασθήσονται ἐν πλοίοις ἀλλοφύλων θάλασσαν — «полетят на кораблях иноплеменников по морю»: ἀλλόφυλοι в корпусе передаётся ペリシテ人 (филистимляне). προνομεύσουσιν — «разграбят»; τοὺς ἀφ᾽ ἡλίου ἀνατολῶν — «тех, что от восхода солнца» (東の人々); Ιδουμαία — エドム. ἐπὶ Μωαβ πρῶτον — «на Моава прежде»; οἱ υἱοὶ Αμμων πρῶτοι ὑπακούσονται — «сыны Аммона первыми покорятся» (слав. «первии покорятся»)."
  15: "ἐρημώσει τὴν θάλασσαν Αἰγύπτου — «опустошит море Египетское»; ἐπιβαλεῖ τὴν χεῖρα ἐπὶ τὸν ποταμόν — «возложит руку на реку»; πνεύματι βιαίῳ — «духом бурным, сильным» (слав. «духом пресильным»). πατάξει ἑπτὰ φάραγγας — «поразит семь ущелий» (七つの谷); ὥστε διαπορεύεσθαι αὐτὸν ἐν ὑποδήμασιν — «так что пройдёт по нему в обуви» (履物のまま); ὑπόδημα — «сандалия»."
  16: "ἔσται δίοδος τῷ καταλειφθέντι μου λαῷ ἐν Αἰγύπτῳ — «будет проход оставленному народу Моему в Египте»: δίοδος — «проход» (通り道); ru «у Ассура» — по МТ, в LXX и слав. «в Египте». ὡς ἡ ἡμέρα ὅτε ἐξῆλθεν ἐκ γῆς Αἰγύπτου — «как день, когда вышел из земли Египетской» (образ исхода)."
