# jp-box, Исаия, глава 11. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для гл. 11 нет (фрагменты книги — 3, 5–10,
# 13–14, 19, 25–29, 37–38, 40–43, 45, 48–50, 52, 54, 58, 60, 62–66); jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 11: 1–2 отрасль от корня Иессея и семь даров Духа; 3–5 праведный суд;
# 6–9 мир в творении; 10–12 корень Иессея — знамя народов, возвращение остатка;
# 13–16 единство Ефрема и Иуды, путь из Египта.
# Прямой речи нет: пророчество о Грядущем идёт от третьего лица; «Моей» в 11:9 —
# голос Господа внутри пророчества, кавычки не ставились. Красного и синего нет.
# Нумерация по gr: 16 стихов; деление совпадает с csl-ru и ru.
# 〔…〕 нет. Слав. добавления внесены в основной текст без скобок: 11:4 «правдою»,
# «правостию» (義をもって、正しさをもって), 11:11 «и от островов морских» (海の島々).
# Сносок ⟨…⟩ нет: 若枝, 根, 花, 腰, 帯, 蝮, 藁, 島々 уже в корпусе.
# Имена — транслитерация греческого (LXX): エッサイ (Ιεσσαι), アモツ (Αμως),
# エラム人 (Αιλαμιτῶν), バビロニア (Βαβυλωνία).

