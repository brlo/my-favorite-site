# Глава 49 — Иоханан и начальники вопрошают Господа (в слав./ru это глава 42).
# План: 1–2 начальники войска и весь народ приходят к Иеремии; 2–3 просьба: «да
# падёт моление наше пред лицем твоим», «возвести нам путь, по которому идти»;
# 4 ответ пророка: «помолюсь, не скрою ни слова»; 5–6 клятва народа: «как пошлёт
# Господь, так и сделаем», «хорошо ли, худо ли — послушаем»; 7 через десять дней
# слово Господне; 8 пророк призывает Иоханана, начальников и народ; 9–12 слово
# Господа: «если останетесь на земле сей — устрою и не разрушу», «не бойтесь царя
# Вавилонского», «дам милость и возвращу вас»; 13–14 их слова: «не сядем на земле
# сей», «пойдём в Египет, там войны не увидим»; 15–18 «если обратите лица ваши в
# Египет» — меч и голод найдут их, место станет проклятием; 19 «не входите в
# Египет» — пророк напоминает слово Господа; 20–22 «вы погрешили против душ ваших»,
# «умрёте в том месте, куда хотите идти».
# Голоса: 1 — авторский текст; 2–3 — 「…」 (речь начальников); 4 — 「…」 (ответ
# Иеремии); 5–6 — 「…」 (клятва народа, одна речь); 7–8 — авторский текст; 9–18 —
# 「…」 (слово Господа; 13–14 внутри — слова народа в 『…』); 19–22 — 「…」 (речь
# пророка; в 19 внутри 『…』 — «не входите в Египет»). Вводные формулы («так говорит
# Господь», «и сказал им») кавычек не разрывают.
# Нумерация по gr: 22 стиха; слав. это глава 42, номер в номер; «точек» нет.
# 〔…〕 нет; сносок ⟨…⟩ нет: 剣, 飢饉, 残りの者, 証人, 異邦人 уже в корпусе,
# пояснения — в notes.
# Имена — транслитерация греческого (LXX): エレミヤ, ヨハナン, カレア, アザルヤ
# (Αζαριας; в ru «Иезания»), マアセヤ (Μαασαιος), バビロン.
