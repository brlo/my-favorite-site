verses:
  1: "軍[ぐん]のすべての長[ちょう]たち、すなわちカレアの子[こ]ヨハナンと、マアセヤの子[こ]アザルヤ、また小[ちい]さい者[もの]から大[おお]きい者[もの]に至[いた]るまで民[たみ]はみな、近[ちか]づいて来[き]た。"
  2: "そして預言者[よげんしゃ]エレミヤのもとへ来[き]て言[い]った。「わたしたちの祈[いの]りがあなたの前[まえ]に落[お]ちますように。どうか、この残[のこ]りの者[もの]たちのために、あなたの神[かみ]である主[しゅ]に祈[いの]ってください。多[おお]くの者[もの]のうちからわたしたちは少[すこ]ししか残[のこ]っておらず、あなたの目[め]がごらんのとおりです。"
  3: "あなたの神[かみ]である主[しゅ]が、わたしたちの歩[あゆ]むべき道[みち]と、わたしたちのなすべきことを告[つ]げてくださいますように。」"
  4: "エレミヤは彼らに言[い]った。「聞[き]きました。見[み]よ、わたしはあなたがたの言葉[ことば]のとおりに、あなたがたの神[かみ]である主[しゅ]に祈[いの]ります。主[しゅ]が答[こた]えられる言葉[ことば]は、何[なん]であれあなたがたに告[つ]げます。あなたがたに一言[ひとこと]も隠[かく]しはしません。」"
  5: "そこで彼らはエレミヤに言[い]った。「主[しゅ]が、あなたを遣[つか]わしてわたしたちに語[かた]らせられるすべての言葉[ことば]に、わたしたちがそのとおりに行[おこな]うことについて、主[しゅ]がわたしたちの間[あいだ]で正[ただ]しく真実[しんじつ]な証人[しょうにん]となられますように。"
  6: "良[よ]くても悪[わる]くても、わたしたちは、あなたを遣[つか]わす先[さき]であるわたしたちの神[かみ]である主[しゅ]の声[こえ]に聞[き]き従[したが]います。そうすれば、わたしたちは幸[しあわ]せになります。わたしたちの神[かみ]である主[しゅ]の声[こえ]に聞[き]き従[したが]うのですから。」"
  7: "十[とお]かの日[ひ]が過[す]ぎた後[のち]、主[しゅ]の言葉[ことば]がエレミヤに臨[のぞ]んだ。"
  8: "彼は、カレアの子[こ]ヨハナンと、彼とともにいた軍[ぐん]のすべての長[ちょう]たち、また小[ちい]さい者[もの]から大[おお]きい者[もの]に至[いた]るまで民[たみ]もすべて呼[よ]び寄[よ]せて言[い]った。"
  9: "「あなたがたが、わたしを遣[つか]わして、あなたがたの祈[いの]りをその御前[みまえ]に注[そそ]ぎ出[だ]そうとした、イスラエルの神[かみ]である主[しゅ]はこう言[い]われる。"
  10: "もしあなたがたがこの地[ち]にとどまるなら、わたしはあなたがたを建[た]てて壊[こわ]さず、あなたがたを植[う]えて抜[ぬ]き去[さ]らない。わたしはあなたがたに下[くだ]した災[わざわ]いについて、もはや怒[いか]りを静[しず]めているからである。"
  11: "バビロンの王[おう]の顔[かお]を、あなたがたが恐[おそ]れているその王[おう]の顔[かお]を恐[おそ]れてはならない。恐[おそ]れてはならない、と主[しゅ]は言[い]われる。わたしはあなたがたとともにいて、あなたがたを彼の手[て]から救[すく]い出[だ]し、救[すく]うからである。"
  12: "わたしはあなたがたにあわれみを与[あた]え、あなたがたをあわれみ、あなたがたを自分[じぶん]たちの地[ち]に帰[かえ]らせる。"
  13: "しかし、もしあなたがたが、『わたしたちはこの地[ち]には住[す]まない』と言[い]い、あなたがたの神[かみ]である主[しゅ]の声[こえ]に聞[き]き従[したが]おうとせず、"
  14: "『いや、わたしたちはエジプトの地[ち]へ行[い]こう。そこでは戦[いくさ]を見[み]ず、ラッパの声[こえ]も聞[き]かず、パンに飢[う]えることもなく、そこに住[す]もう』と言[い]うのなら、"
  15: "ユダの残[のこ]りの者[もの]たちよ、それゆえ主[しゅ]の言葉[ことば]を聞[き]け。万軍[ばんぐん]の主[しゅ]、イスラエルの神[かみ]はこう言[い]われる。もしあなたがたが顔[かお]をエジプトに向[む]けて、そこへ行[い]って住[す]もうとするなら、"
  16: "あなたがたが恐[おそ]れている剣[つるぎ]がエジプトの地[ち]であなたがたを見[み]つけ、あなたがたが恐[おそ]れている飢[き]饉[きん]がエジプトであなたがたの後[あと]を追[お]ってあなたがたを捕[つか]まえ、あなたがたはそこで死[し]ぬ。"
  17: "エジプトの地[ち]へ行[い]ってそこに住[す]もうと顔[かお]を向[む]けた者[もの]は、人[ひと]でも異邦人[いほうじん]でもみな、剣[つるぎ]と飢[き]饉[きん]によって尽[つ]き果[は]てる。わたしが彼らの上[うえ]に下[くだ]す災[わざわ]いから逃[のが]れる者[もの]は、彼らのうちに一人[ひとり]もいない。"
  18: "まことに、万軍[ばんぐん]の主[しゅ]、イスラエルの神[かみ]はこう言[い]われる。わたしの憤[いか]りがエルサレムの住[す]む者[もの]たちの上[うえ]に滴[したた]り落[お]ちたように、あなたがたがエジプトへ入[はい]るとき、わたしの憤[いか]りはあなたがたの上[うえ]にも滴[したた]り落[お]ちる。あなたがたは荒[あ]れ果[は]てた所[ところ]、人[ひと]の支配[しはい]の下[もと]にある者[もの]、呪[のろ]い、そしりとなる。あなたがたはもはやこの場所[ばしょ]を見[み]ることはない。」"
  19: "「主[しゅ]があなたがた、ユダの残[のこ]りの者[もの]たちに告[つ]げられたのは、『エジプトへ入[はい]ってはならない』ということである。そして今[いま]、あなたがたは、わたしが今日[きょう]あなたがたに証[あかし]したことを知[し]って悟[さと]るがよい。"
  20: "あなたがたは自分[じぶん]たちの魂[たましい]に悪[わる]いことをした。わたしを遣[つか]わして、『わたしたちのために主[しゅ]に祈[いの]ってください。主[しゅ]があなたに語[かた]られることは何[なん]であれ、わたしたちに告[つ]げてください。そうすれば、わたしたちはそのとおりに行[おこな]います』と言[い]ったからである。"
  21: "わたしは今日[きょう]、あなたがたに告[つ]げた。だが、あなたがたは、主[しゅ]がわたしを遣[つか]わして告[つ]げさせたすべてのことにおいて、主[しゅ]の声[こえ]に聞[き]き従[したが]わなかった。"
  22: "そして今[いま]、あなたがたが行[い]って住[す]もうと望[のぞ]んでいるその場所[ばしょ]で、あなたがたは剣[つるぎ]と飢[き]饉[きん]と疫病[えきびょう]によって滅[ほろ]びる。」"

notes:
  1: "Καὶ προσῆλθον πάντες οἱ ἡγεμόνες τῆς δυνάμεως — «и подошли (προσέρχομαι) все начальники войска»; ἡγεμών — вождь, начальник. καὶ Ιωαναν καὶ Αζαριας υἱὸς Μαασαιου — Иоханан и Азария, сын Маасея; слав. добавляет при Иоханане «сын кариев» (カレアの子) — нет в LXX, внесено в текст без 〔…〕. В ru здесь «Иезания, сын Гошаии» (МТ), а не Азария: чтение МТ в текст не внесено. πᾶς ὁ λαὸς ἀπὸ μικροῦ ἕως μεγάλου — «весь народ от малого до большого»."
  2: "πρὸς Ιερεμιαν τὸν προφήτην καὶ εἶπαν αὐτῷ — «к Иеремии пророку и сказали ему». Πεσέτω δὴ τὸ ἔλεος ἡμῶν κατὰ πρόσωπόν σου — «да падёт милость наша пред лицем твоим» (ἔλεος — милость, сострадание); слав. «да падет молитва наша» — церковное чтение, в тексте 祈り по слав.; вариант LXX («милость») — здесь. πρόσευξαι περὶ τῶν καταλοίπων τούτων — «помолись об оставшихся сих» (κατάλοιπος — остаток). ὅτι κατελείφθημεν ὀλίγοι ἀπὸ πολλῶν, καθὼς οἱ ὀφθαλμοί σου βλέπουσιν — «ибо осталось нас мало от многих, как глаза твои видят»."
  3: "ἀναγγειλάτω ἡμῖν κύριος ὁ θεός σου τὴν ὁδόν, ᾗ πορευσόμεθα ἐν αὐτῇ — «пусть возвестит нам Господь Бог твой путь, по которому пойдём в нём»; καὶ λόγον, ὃν ποιήσομεν — «и слово, которое сделаем», т. е. что нам делать. Здесь закрывается речь начальников (2–3)."
  4: "Ἤκουσα — «услышал» (церковное «слышах»), т. е. «слушаю, согласен». ἰδοὺ ἐγὼ προσεύξομαι πρὸς κύριον τὸν θεὸν ἡμῶν κατὰ τοὺς λόγους ὑμῶν — «вот, я помолюсь Господу Богу вашему по словам вашим». οὐ μὴ κρύψω ἀφ' ὑμῶν ῥῆμα — «не скрою от вас слова» (усиленное οὐ μή). Слав. «Господеви Богу нашему» — по греч. Начало ответной речи пророка."
  5: "Ἔστω κύριος ἐν ἡμῖν εἰς μάρτυρα δίκαιον καὶ πιστόν — «да будет Господь между нами свидетелем праведным и верным» (μάρτυς — свидетель); εἰ μὴ κατὰ πάντα τὸν λόγον... οὕτως ποιήσομεν — «если не по всякому слову... так сделаем», клятвенная формула с опущенным проклятием. Слав. «буди Господь в нас послух правдив и верен» (послух — свидетель)."
  6: "καὶ ἐὰν ἀγαθὸν καὶ ἐὰν κακόν — «хорошо ли, худо ли»; τὴν φωνὴν κυρίου τοῦ θεοῦ ἡμῶν... ἀκουσόμεθα — «глас Господа Бога нашего послушаем»; ἵνα βέλτιον ἡμῖν γένηται — «чтобы лучше нам было» (βελτίων — лучше). Двойное «послушаем» (ἀκουσόμεθα... ἀκουσόμεθα) сохранено. Слав. в первом случае «Господа нашего» — по греч. «Бога нашего»."
  7: "καὶ ἐγενήθη μετὰ δέκα ἡμέρας ἐγενήθη λόγος κυρίου πρὸς Ιερεμιαν — «и было через десять дней, было слово Господне к Иеремии» (двойное ἐγενήθη, слав. сглаживает: «егда скончашася десять дний»). Авторский текст, кавычек нет."
  8: "ἐκάλεσεν τὸν Ιωαναν καὶ τοὺς ἡγεμόνας τῆς δυνάμεως — «позвал Иоханана и начальников войска»; слав. добавляет «иже с ним быша» (彼とともにいた) — нет в LXX, в тексте без скобок; πάντα τὸν λαὸν ἀπὸ μικροῦ ἕως μεγάλου — «весь народ от малого до большого»."
  9: "Οὕτως εἶπεν κύριος — «так сказал Господь»; слав. добавляет «Бог израилев, к немуже посыласте мя, да простру молитвы вашя пред ним» (あなたがたがわたしを遣わして祈りを注ぎ出そうとした、イスラエルの神) — нет в LXX, внесено в текст без скобок. Формула «так говорит Господь» в тексте внутри 「…」 (ср. 33:2). Отсюда до 18 — слово Господа."
  10: "Ἐὰν καθίσαντες καθίσητε ἐν τῇ γῇ ταύτῃ — «если сидя сядете (останетесь) на земле сей», гебраизм усиления; οἰκοδομήσω ὑμᾶς καὶ οὐ μὴ καθέλω — «устрою вас и не разрушу» (καθαιρέω — сносить); φυτεύσω ὑμᾶς καὶ οὐ μὴ ἐκτίλω — «насажду вас и не искореню» (ἐκτίλλω — вырывать). ὅτι ἀναπέπαυμαι ἐπὶ τοῖς κακοῖς, οἷς ἐποίησα ὑμῖν — «ибо Я успокоился (перестал) о бедствиях, которые сделал вам»; слав. «яко престах от зол»."
  11: "μὴ φοβηθῆτε ἀπὸ προσώπου βασιλέως Βαβυλῶνος, οὗ ὑμεῖς φοβεῖσθε — «не убойтесь лица царя Вавилонского, которого вы боитесь» (повтор в греч.); φησὶν κύριος — «говорит Господь»; μεθ' ὑμῶν ἐγώ εἰμι τοῦ ἐξαιρεῖσθαι ὑμᾶς καὶ σῴζειν ὑμᾶς ἐκ χειρὸς αὐτοῦ — «Я с вами, чтобы избавлять вас и спасать вас от руки его» (ἐξαιρέω — изымать, избавлять)."
  12: "δώσω ὑμῖν ἔλεος καὶ ἐλεήσω ὑμᾶς — «дам вам милость и помилую вас»; ἐπιστρέψω ὑμᾶς εἰς τὴν γῆν ὑμῶν — «возвращу вас в землю вашу». В ru «он умилостивится к вам» — чтение МТ, не внесено."
  13: "καὶ εἰ λέγετε ὑμεῖς Οὐ μὴ καθίσωμεν ἐν τῇ γῇ ταύτῃ — «если же вы скажете: не сядем на земле сей»; πρὸς τὸ μὴ ἀκοῦσαι φωνῆς κυρίου — «чтобы не слушать гласа Господа». Слова народа — вложенная речь 『…』; стих обрывается на условии, продолжение в 14, поэтому в конце «、»."
  14: "ὅτι εἰς γῆν Αἰγύπτου εἰσελευσόμεθα — «ибо в землю Египетскую войдём»; οὐ μὴ ἴδωμεν πόλεμον — «не увидим войны»; φωνὴν σάλπιγγος οὐ μὴ ἀκούσωμεν — «голоса трубы не услышим» (σάλπιγξ — труба); ἐν ἄρτοις οὐ μὴ πεινάσωμεν — «хлебом не проголодаемся»; ἐκεῖ οἰκήσομεν — «там поселимся». Слав. «глаголюще: никако, но...» — «нет, но»; в тексте 『いや、…』. Условие 13–14 продолжается, главное предложение — в 15."
  15: "διὰ τοῦτο ἀκούσατε λόγον κυρίου — «посему слушайте слово Господне»; слав. добавляет «оставшии иудины» (ユダの残りの者) и «вседержитель, Бог израилев» — нет в LXX (там только κύριος), в тексте без скобок. Ἐὰν ὑμεῖς δῶτε τὸ πρόσωπον ὑμῶν εἰς Αἴγυπτον — «если вы дадите лицо ваше в Египет», т. е. обратите лица."
  16: "ἡ ῥομφαία, ἣν ὑμεῖς φοβεῖσθε... εὑρήσει ὑμᾶς — «меч, которого вы боитесь... найдёт вас» (ῥομφαία — меч); ὁ λιμός, οὗ ὑμεῖς λόγον ἔχετε — «голод, о котором вы имеете слово (опасение)»; καταλήμψεται ὑμᾶς ὀπίσω ὑμῶν — «постигнет вас вслед вас»; ἐκεῖ ἀποθανεῖσθε — «там умрёте»."
  17: "πάντες οἱ ἄνθρωποι καὶ πάντες οἱ ἀλλογενεῖς — «все люди и все иноплеменники» (ἀλλογενής — чужого рода); οἱ θέντες τὸ πρόσωπον αὐτῶν εἰς γῆν Αἰγύπτου ἐνοικεῖν — «положившие лицо своё [идти] в землю Египетскую жить»; ἐκλείψουσιν ἐν τῇ ῥομφαίᾳ καὶ ἐν τῷ λιμῷ — «исчезнут от меча и голода»; слав. меняет порядок — «гладо́м и мечем». οὐκ ἔσται αὐτῶν οὐθεὶς σῳζόμενος — «не будет из них ни один спасаемый»."
  18: "καθὼς ἔσταξεν ὁ θυμός μου ἐπὶ τοὺς κατοικοῦντας Ιερουσαλημ — «как источилась (каплями пала) ярость Моя на жителей Иерусалима» (στάζω — капать, источать); οὕτως στάξει ὁ θυμός μου ἐφ' ὑμᾶς — «так источится на вас»; εἰς ἄβατον — «в непроходимое» (ἄβατος); ὑποχείριοι — «подручные», под властью (ὑποχείριος); εἰς ἀρὰν καὶ εἰς ὀνειδισμόν — «в проклятие и поношение»; οὐ μὴ ἴδητε οὐκέτι τὸν τόπον τοῦτον — «не увидите более места сего». Слав. добавляет «Господь сил, Бог израилев» — нет в LXX, в тексте без скобок."
  19: "ἃ ἐλάλησεν κύριος ἐφ' ὑμᾶς τοὺς καταλοίπους Ιουδα — «что изрёк Господь на вас, остаток Иуды»; Μὴ εἰσέλθητε εἰς Αἴγυπτον — «не входите в Египет»: слово Господа внутри речи пророка, дано вложенной речью 『…』; καὶ νῦν γνόντες γνώσεσθε — «и ныне, зная, узнаете» (усиление, «твёрдо знайте»); слав. добавляет «яко засвидетелствовах вам днесь» (わたしが今日あなたがたに証しした) — нет в LXX, внесено. Отсюда до 22 — речь Иеремии, кавычки закрываются в 22."
  20: "ὅτι ἐπονηρεύσασθε ἐν ψυχαῖς ὑμῶν — «ибо вы лукаво поступили в душах ваших» (πονηρεύομαι — делать зло); ἀποστείλαντές με λέγοντες — «послав меня, говоря»; Πρόσευξαι περὶ ἡμῶν πρὸς κύριον — «помолись о нас Господу»; καὶ κατὰ πάντα, ἃ ἐὰν λαλήσῃ σοι κύριος, ποιήσομεν — «и по всему, что скажет тебе Господь, сделаем». Их прежние слова — 『…』. Слав. «ко Господу Богу вашему» — по греч. только κύριος."
  21: "καὶ οὐκ ἠκούσατε τῆς φωνῆς κυρίου, ἧς ἀπέστειλέν με πρὸς ὑμᾶς — «и не послушали гласа Господа, с которым (через который) Он послал меня к вам»; слав. начинает «И возвестих вам днесь» (わたしは今日告げた) — нет в LXX, внесено в текст; слав. также «Господа Бога вашего» — по греч. только κύριος."
  22: "καὶ νῦν ἐν ῥομφαίᾳ καὶ ἐν λιμῷ ἐκλείψετε — «и ныне мечом и голодом исчезнете»; ἐν τῷ τόπῳ, οὗ ὑμεῖς βούλεσθε εἰσελθεῖν κατοικεῖν ἐκεῖ — «на месте, куда вы хотите войти жить там». Слав. добавляет «и мором» (и смертью) — нет в LXX, внесено в текст без скобок; здесь закрывается речь пророка."
