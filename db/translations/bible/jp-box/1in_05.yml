# jp-box, 1-е Послание Иоанна, глава 5. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 5: вера, побеждающая мир (1–5), три свидетеля (6–8), свидетельство Божие (9–12),
# дерзновение в молитве (13–17), исходящий от Бога хранит (18–21).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет.
#
# 5:7–8 (Comma Johanneum). В базе gr-lxx-byz 5:7 — только «ὅτι τρεῖς εἰσιν οἱ
# μαρτυροῦντες,» (без небесных свидетелей), 5:8 — «τὸ πνεῦμα καὶ τὸ ὕδωρ καὶ τὸ αἷμα…».
# Слова «ἐν τῷ οὐρανῷ, ὁ πατήρ, ὁ λόγος καὶ τὸ ἅγιον πνεῦμα…» (церковное чтение,
# есть у jp-joc и в Елизаветинской) в базе отсутствуют — проверено запросом
# к gr-lxx-byz: πατηρ — НЕТ, τρεῖς (μαρτυροῦντες) — ЕСТЬ. Поэтому они целиком в 〔…〕
# внутри ст. 7; ст. 8 переведён по базе и в скобки не берётся: «ἐν τῇ γῇ» в базе нет,
# поэтому «地において」 не добавлено.
# Сносок ⟨…⟩ в главе нет: 偶像, 水, 血, 証し уже в корпусе.
# 5:7 — единственное место в послании, где πνεῦμα ἅγιον: пара {聖霊｜聖神}; в 3:24; 4:13
# πνεῦμα без ἅγιον — 霊[れい]. jp-ni не использовался.

tr_code: jp-box
book: 1in
chapter: 5
draft: true

verses:
  1: "イエスがキリストであると信[しん]じる者[もの]は、すべて神[かみ]から生[う]まれた者[もの]である。生[う]ませた方[かた]を愛[あい]する者[もの]は、その方[かた]から生[う]まれた者[もの]も愛[あい]する。"
  2: "神[かみ]を愛[あい]し、その戒[いまし]めを行[おこな]うとき、わたしたちは神[かみ]の子[こ]どもを愛[あい]していることを知[し]る。"
  3: "神[かみ]を愛[あい]するとは、その戒[いまし]めを守[まも]ることである。その戒[いまし]めは重[おも]くない。"
  4: "神[かみ]から生[う]まれた者[もの]は、すべて世[よ]に勝[か]つからである。世[よ]に勝[か]ったその勝利[しょうり]とは、わたしたちの信仰[しんこう]である。"
  5: "世[よ]に勝[か]つ者[もの]とはだれか。イエスが神[かみ]の子[こ]であると信[しん]じる者[もの]ではないか。"
  6: "水[みず]と血[ち]によって来[こ]られた方[かた]、すなわちイエス・キリストである。水[みず]だけによらず、水[みず]と血[ち]によって来[こ]られたのである。証[あか]しをするのは霊[れい]であり、霊[れい]は真理[しんり]である。"
  7: "証[あか]しをする者[もの]は三[みっ]つある。〔すなわち、天[てん]において証[あか]しをする者[もの]は三[みっ]つ、父[ちち]と言葉[ことば]と{聖霊[せいれい]|聖神[せいしん]}であり、この三[みっ]つは一[ひと]つである。〕"
  8: "〔地[ち]において証[あかし]する者[もの]は三[みっ]つ、すなわち、〕霊[れい]と水[みず]と血[ち]であり、この三[みっ]つは一[ひと]つに帰[き]する。"
  9: "人[ひと]の証[あか]しを受[う]け入[い]れるなら、神[かみ]の証[あか]しはそれよりも大[おお]きい。神[かみ]が御子[みこ]について証[あか]しされたこと、これが神[かみ]の証[あか]しだからである。"
  10: "神[かみ]の御子[みこ]を信[しん]じる者[もの]は、その証[あか]しを自分[じぶん]のうちに持[も]っている。神[かみ]を信[しん]じない者[もの]は、神[かみ]を偽[いつわ]り者[もの]としたのである。神[かみ]が御子[みこ]について証[あか]しされたその証[あか]しを信[しん]じなかったからである。"
  11: "その証[あか]しとは、神[かみ]がわたしたちに永遠[えいえん]の命[いのち]を与[あた]えてくださり、この命[いのち]が御子[みこ]のうちにあるということである。"
  12: "御子[みこ]を持[も]つ者[もの]は命[いのち]を持[も]ち、神[かみ]の御子[みこ]を持[も]たない者[もの]は命[いのち]を持[も]たない。"
  13: "わたしがこのことをあなたがたに書[か]いたのは、神[かみ]の御子[みこ]の名[な]を信[しん]じるあなたがたが、永遠[えいえん]の命[いのち]を持[も]っていることを知[し]るためである。"
  14: "わたしたちがこの方[かた]に対[たい]して持[も]つ大胆[だいたん]さとは、これである。すなわち、わたしたちがその御心[みこころ]に従[したが]って求[もと]めるなら、この方[かた]は聞[き]いてくださる。"
  15: "わたしたちが求[もと]めることをこの方[かた]が聞[き]いてくださると知[し]っているなら、わたしたちがこの方[かた]に求[もと]めたものを得[え]ていることも知[し]っている。"
  16: "だれかが、死[し]に至[いた]らない罪[つみ]を兄弟[きょうだい]が犯[おか]しているのを見[み]たら、その人[ひと]は求[もと]めるであろう。そうすれば、死[し]に至[いた]らない罪[つみ]を犯[おか]す者[もの]に命[いのち]が与[あた]えられる。死[し]に至[いた]る罪[つみ]がある。その罪[つみ]については、求[もと]めるようにとはわたしは言[い]わない。"
  17: "すべての不義[ふぎ]は罪[つみ]である。しかし、死[し]に至[いた]らない罪[つみ]もある。"
  18: "神[かみ]から生[う]まれた者[もの]はだれも罪[つみ]を犯[おか]さないことを、わたしたちは知[し]っている。神[かみ]から生[う]まれた方[かた]がその人[ひと]を守[まも]ってくださるので、悪[あく]しき者[もの]はその人[ひと]に手[て]を触[ふ]れない。"
  19: "わたしたちは神[かみ]から出[で]た者[もの]であること、また、世[よ]のすべてが悪[あく]しき者[もの]のうちに横[よこ]たわっていることを知[し]っている。"
  20: "また、神[かみ]の御子[みこ]が来[こ]られ、わたしたちが真[まこと]の神[かみ]を知[し]るために、わたしたちに悟[さと]りを与[あた]えてくださったことを知[し]っている。わたしたちは真[まこと]の神[かみ]、すなわちその御子[みこ]イエス・キリストのうちにいる。この方[かた]こそ真[まこと]の神[かみ]であり、永遠[えいえん]の命[いのち]である。"
  21: "子[こ]どもたちよ、自分[じぶん]を偶像[ぐうぞう]から守[まも]りなさい。"

notes:
  1: "ὁ πιστεύων ὅτι Ἰησοῦς ἐστιν ὁ Χριστός — イエスがキリストであると信じる者. γεγέννηται — 生まれた (perfect). τὸν γεννήσαντα — 生ませた方 (Бог; причастие аориста, «Родивший»). ἀγαπᾷ τὸν γεγεννημένον ἐξ αὐτοῦ — その方から生まれた者も愛する (любящий Отца любит и рождённых от Него; «καὶ» в базе есть — 〔…〕 не ставится)."
  2: "ἐν τούτῳ γινώσκομεν — これによって知る. ὅταν τὸν θεὸν ἀγαπῶμεν καὶ τὰς ἐντολὰς αὐτοῦ ποιῶμεν — 神を愛し、その戒めを行うとき (ὅταν с сослагательным — обобщённое время). ποιῶμεν — делать (в базе ποιέω, не τηρέω, поэтому 行う, а не 守る)."
  3: "αὕτη γάρ ἐστιν ἡ ἀγάπη τοῦ θεοῦ — 神を愛するとは…ことである (родительный объекта: любовь к Богу раскрывается как соблюдение заповедей). βαρεῖαι οὐκ εἰσίν — 重くない."
  4: "πᾶν τὸ γεγεννημένον ἐκ τοῦ θεοῦ — 神から生まれた者 (средний род, «всё рождённое»; передано 者). νικᾷ — настоящее время: 勝つ. ἡ νίκη ἡ νικήσασα — 勝ったその勝利 (однокоренные слова сохранены). ἡ πίστις ἡμῶν — わたしたちの信仰."
  5: "τίς [δὲ] ἐστιν ὁ νικῶν — 勝つ者とはだれか (в базе [δὲ] есть — без 〔…〕). εἰ μὴ ὁ πιστεύων — 信じる者ではないか (εἰ μή после вопроса — «как не…»)."
  6: "ὁ ἐλθὼν δι᾽ ὕδατος καὶ αἵματος — 水と血によって来られた方 (διό — через; крещение и крест). οὐκ ἐν τῷ ὕδατι μόνον — 水だけによらず (ἐν — в, при; передано よらず). τὸ πνεῦμά ἐστιν τὸ μαρτυροῦν — 証しをするのは霊. τὸ πνεῦμά ἐστιν ἡ ἀλήθεια — 霊は真理である (предикат без артикля не сглажен)."
  7: "В базе стих — только ὅτι τρεῖς εἰσιν οἱ μαρτυροῦντες (証しをする者は三つある). Небесные свидетели — церковное чтение (Елизаветинская, jp-joc), в базе их нет (πατηρ — НЕТ), поэтому целиком в 〔…〕: 天において…一つの者である. ὁ λόγος в тринитарной формуле — 言葉 (как ὁ λόγος в 1:1 и Ин 1:1); 御言葉 не взято, чтобы не смешивать с «словом Божиим» (ὁ λόγος τοῦ θεοῦ). πνεῦμα ἅγιον — единственное место в послании, пара {聖霊｜聖神}."
  8: "τὸ πνεῦμα καὶ τὸ ὕδωρ καὶ τὸ αἷμα — 霊と水と血. εἰς τὸ ἕν εἰσιν — 一つに帰する (в 5:7 ἕν εἰσιν — 一つである; разница εἰς τὸ ἕν / ἕν сохранена). «ἐν τῇ γῇ» и «τρεῖς εἰσιν οἱ μαρτυροῦντες» (земные свидетели) — церковное чтение, в базе их нет, поэтому 〔地において証しする者は三つ、すなわち、〕."
  9: "εἰ τὴν μαρτυρίαν τῶν ἀνθρώπων λαμβάνομεν — 人の証しを受け入れるなら. μεμαρτύρηκεν περὶ τοῦ υἱοῦ — 御子について証しされた (perfect). Порядок греческого: сначала «больше», потом «ибо это свидетельство Божие» — сохранён, второе ὅτι передано главным предложением."
  10: "ὁ πιστεύων εἰς τὸν υἱὸν τοῦ θεοῦ — 御子を信じる者 (εἰς — в, с винительным). ἔχει τὴν μαρτυρίαν ἐν αὑτῷ — その証しを自分のうちに持っている. ψεύστην πεποίηκεν αὐτόν — 神を偽り者とした (perfect; αὐτόν — Бога). οὐ πεπίστευκεν εἰς τὴν μαρτυρίαν — 証しを信じなかった."
  11: "αὕτη ἐστὶν ἡ μαρτυρία — その証しとは. ζωὴν αἰώνιον ἔδωκεν ἡμῖν ὁ θεός — 神が…永遠の命を与えてくださり. αὕτη ἡ ζωὴ ἐν τῷ υἱῷ αὐτοῦ ἐστιν — この命が御子のうちにある."
  12: "ὁ ἔχων τὸν υἱόν — 御子を持つ者 (в 5:12 «Сын» без «Божий» в первом члене, во втором — ὁ υἱὸς τοῦ θεοῦ; разница сохранена). ζωή — 命 без артикля во втором члене."
  13: "ἔγραψα — аорист. ἵνα εἰδῆτε ὅτι ζωὴν ἔχετε αἰώνιον — 永遠の命を持っていることを知るため. τοῖς πιστεύουσιν εἰς τὸ ὄνομα — 名を信じるあなたがた (датив как приложение-адресат). «καὶ ἵνα πιστεύητε» в базе нет (проверено: πιστευητε — НЕТ), поэтому «また信じるため» не добавлено."
  14: "παρρησία — 大胆さ (ср. 2:28; 3:21; 4:17). ἐάν τι αἰτώμεθα κατὰ τὸ θέλημα αὐτοῦ — その御心に従って求めるなら. ἀκούει ἡμῶν — 聞いてくださる (ἀκούω + родительный — слушать, внимать)."
  15: "ἐὰν οἴδαμεν — 知っているなら (ἐάν с изъявительным, редкое). ὃ ἐὰν αἰτώμεθα — 求めること. τὰ αἰτήματα ἃ ᾐτήκαμεν — 求めたもの (однокоренные αἴτημα/αἰτέω сохранены)."
  16: "ἁμαρτίαν μὴ πρὸς θάνατον — 死に至らない罪. αἰτήσει — будущее: 求めるであろう. δώσει αὐτῷ ζωήν — 命が与えられる (Бог даёт; подлежащее не названо, как и в греческом). ἔστιν ἁμαρτία πρὸς θάνατον — 死に至る罪がある. οὐ περὶ ἐκείνης λέγω ἵνα ἐρωτήσῃ — その罪については、求めるようにとは言わない (ἐρωτάω — просить, спрашивать)."
  17: "πᾶσα ἀδικία ἁμαρτία ἐστίν — すべての不義は罪である. ἔστιν ἁμαρτία οὐ πρὸς θάνατον — 死に至らない罪もある."
  18: "ὁ γεγεννημένος ἐκ τοῦ θεοῦ οὐχ ἁμαρτάνει — 神から生まれた者は罪を犯さない (perfect). ὁ γεννηθεὶς ἐκ τοῦ θεοῦ τηρεῖ αὐτόν — 神から生まれた方がその人を守る (аорист причастия; в святоотеческом чтении — Христос, отсюда 方). ὁ πονηρὸς οὐχ ἅπτεται αὐτοῦ — 悪しき者は手を触れない."
  19: "ἐκ τοῦ θεοῦ ἐσμεν — 神から出た者. ὁ κόσμος ὅλος ἐν τῷ πονηρῷ κεῖται — 世のすべてが悪しき者のうちに横たわっている (κεῖμαι — лежать; ὁ πονηρός — дьявол, как 2:13,14; 3:12; 5:18)."
  20: "δέδωκεν ἡμῖν διάνοιαν — 悟りを与えてくださった (διάνοια — разумение, мысль). ἵνα γινώσκομεν τὸν ἀληθινόν — 真の神を知るために. ἐν τῷ ἀληθινῷ — 真の神のうちに (то же слово, что τὸν ἀληθινόν). οὗτός ἐστιν ὁ ἀληθινὸς θεὸς καὶ ζωὴ αἰώνιος — この方こそ真の神であり、永遠の命である (без «Сын» и без смягчения)."
  21: "φυλάξατε ἑαυτὰ ἀπὸ τῶν εἰδώλων — 自分を偶像から守りなさい (φυλάσσω — хранить, беречь; ἑαυτά — средний род мн., «себя»). «Ἀμήν» в базе нет (проверено: αμην — НЕТ), поэтому アミン не добавлено."
