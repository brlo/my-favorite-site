# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 15: бегство ассирийцев (1–3), Озия рассылает весть и Израиль преследует (4–5),
# добыча (6–7), приход первосвященника Иоакима и старейшин, благословение Иудифи
# (8–10), тридцать дней добычи (11), женщины Израиля с хорами и венками (12–13),
# Иудифь запевает песнь (14; сама песнь — гл. 16). Прямая речь — 「…」: благословение
# старейшин 9–10a, ответ народа 10b; красного и синего нет.
# Нумерация по gr: 14 стихов; деление совпадает с csl.
# 〔…〕 нет: все стихи есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 天幕, 陣営, 長老会, 大祭司, 洗い鉢 и пр. уже в корпусе.
# Имена — транслитерация греческого (LXX).

