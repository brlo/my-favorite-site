verses:
  1: "天幕[てんまく]にいた者[もの]たちはそれを聞[き]くと、起[お]こったことに驚[おどろ]き慌[あわ]てた。"
  2: "彼[かれ]らの上[うえ]に震[ふる]えと恐[おそ]れが降[ふ]りかかり、もはや隣人[りんじん]の前[まえ]に立[た]ち止[と]まる者[もの]はなく、皆[みな]が一[いっ]致[ち]して散[ち]り、平野[へいや]と山地[さんち]のすべての道[みち]へ逃[に]げて行[い]った。"
  3: "ベトリアの周[まわ]りでは、山地[さんち]に陣[じん]を張[は]っていた者[もの]たちもまた、逃[に]げ走[はし]った。そのとき、イスラエルの子[こ]ら、すなわち彼[かれ]らのうちのすべていさましい男[おとこ]たちが、彼らに殺到[さっとう]した。"
  4: "オジヤは、ベトメスタイム、ベバイ、ホバイ、コラ、またイスラエルの全[ぜん]領土[りょうど]に、成[な]し遂[と]げられたことを告[つ]げ知[し]らせる者[もの]たちを送[おく]り、すべての者が敵[てき]に殺到[さっとう]してこれを滅[ほろ]ぼすようにさせた。"
  5: "イスラエルの子[こ]らはこれを聞くと、皆が一[いっ]致[ち]して彼[かれ]らに襲[おそ]いかかり、ホバに至[いた]るまで彼らを打[う]ち殺[ころ]した。同[おな]じく、エルサレムからも、山地[さんち]のすべてからも、者[もの]たちが来[き]た。彼らは敵[てき]の陣営[じんえい]に起[お]こったことを知[し]らされていたからである。ギレアデとガリラヤにいた者たちも、彼らがダマスコとその領土[りょうど]を通[とお]り過[す]ぎるまで、大[おお]きな打撃[だげき]をもって彼らを撃[う]ち破[やぶ]った。"
  6: "ベトリアに住[す]む残[のこ]りの者[もの]たちは、アッシリアの陣営[じんえい]に襲[おそ]いかかり、彼らを略奪[りゃくだつ]して、非常[ひじょう]に富[とみ]んだ。"
  7: "イスラエルの子[こ]らは、虐殺[ぎゃくさつ]から引[ひ]き返[かえ]して残[のこ]りの者[もの]たちを支配[しはい]し、山地[さんち]と平野[へいや]の村々[むらむら]や農家[のうか]は多[おお]くの戦利品[せんりひん]を得[え]た。その数[かず]は非常[ひじょう]に多[おお]かったからである。"
  8: "大祭司[だいさいし]ヨヤキムと、エルサレムに住[す]むイスラエルの子[こ]らの長老会[ちょうろうかい]は、主[しゅ]がイスラエルに行[おこな]われた良[よ]いことを見[み]ようと、またユディトを見て、彼女[かのじょ]と平和[へいわ]について語[かた]ろうとやって来[き]た。"
  9: "彼[かれ]らが彼女[かのじょ]のところへ入[はい]ると、皆[みな]が一[いっ]致[ち]して彼女を祝福[しゅくふく]し、彼女に言[い]った。「あなたはイスラエルの高[たか]み、あなたはイスラエルの大[おお]いなる喜[よろこ]び、あなたはわたしたちの一族[いちぞく]の大[おお]いなる誇[ほこ]りである。"
  10: "あなたはこれらすべてをあなたの手[て]で行[おこな]い、イスラエルに良[よ]いことを行なった。神[かみ]はそれらを喜[よろこ]ばれた。全能者[ぜんのうしゃ]である主[しゅ]のもとで、永遠[えいえん]の時[とき]にわたって祝福[しゅくふく]された者[もの]となりなさい。」そして民[たみ]は皆[みな]言[い]った。「そのとおりになるように。」"
  11: "民[たみ]は皆[みな]、三十日[さんじゅうにち]の間[あいだ]、陣営[じんえい]を略奪[りゃくだつ]した。そして人[ひと]々[びと]はユディトに、ホロフェルネスの天幕[てんまく]と、すべての銀[ぎん]の器[うつわ]、寝台[しんだい]、洗[あら]い鉢[ばち]、および彼[かれ]のすべての調度品[ちょうどひん]を与[あた]えた。彼女[かのじょ]はそれらを受[う]け取[と]って自分のラバに載[の]せ、自分の車[くるま]をつなぎ、それらを車の上[うえ]に積[つ]み上[あ]げた。"
  12: "イスラエルの女[おんな]たちは皆[みな]、彼女[かのじょ]を見[み]ようと駆[か]け寄[よ]り、彼女を祝福[しゅくふく]して、自分[じぶん]たちの中[なか]から彼女のために踊[おど]りの輪[わ]を作[つく]った。彼女は手[て]に花[はな]で飾[かざ]った杖[つえ]を取[と]り、ともにいた女たちに与[あた]えた。"
  13: "彼女[かのじょ]も、ともにいた女[おんな]たちも、オリーブで冠[かんむり]を編[あ]んでかぶった。彼女は踊[おど]りの輪[わ]のうちにすべての民[たみ]の前[まえ]を進[すす]み、すべての女たちを導[みちび]いた。イスラエルの男[おとこ]たちは皆[みな]、武具[ぶぐ]を身につけ、冠をかぶって彼女に従[したが]い、口[くち]で賛歌[さんか]を歌[うた]った。"
  14: "ユディトはこの告白[こくはく]をイスラエル中[じゅう]で歌[うた]い始[はじ]め、民[たみ]は皆[みな]、この賛美[さんび]を声[こえ]を張[は]り上[あ]げて唱[とな]えた。"

notes:
  1: "καὶ ὡς ἤκουσαν — «и когда услышали»; οἱ ἐν τοῖς σκηνώμασιν ὄντες — «находившиеся в шатрах» (σκήνωμα, мн. ч.; слав. «в шатрех»). ἐξέστησαν ἐπὶ τὸ γεγονός — «пришли в изумление от происшедшего» (ἐξίστημι — выходить из себя, ужасаться; γεγονός — совершившееся). Речь об ассирийцах, стоявших лагерем у Ветилуи."
  2: "ἐπέπεσεν ἐπ᾿ αὐτοὺς τρόμος καὶ φόβος — «напал на них трепет и страх» (τρόμος, φόβος). οὐκ ἦν ἄνθρωπος μένων κατὰ πρόσωπον τοῦ πλησίον — «не было человека, остающегося пред лицом ближнего»: никто не держался рядом. ἐκχυθέντες — «излившись, рассыпавшись» (ἐκχέω), ὁμοθυμαδόν — «единодушно», 一[いっ]致[ち]して. ἔφευγον ἐπὶ πᾶσαν ὁδὸν τοῦ πεδίου καὶ τῆς ὀρεινῆς — «бежали по всякой дороге равнины и нагорной страны»."
  3: "οἱ παρεμβεβληκότες ἐν τῇ ὀρεινῇ κύκλῳ Βαιτυλουα — «расположившиеся лагерем в нагорной стране вокруг Ветилуи» (παρεμβάλλω — раскидывать стан; ср. παρεμβολή — 陣営). ἐτράπησαν εἰς φυγήν — «обратились в бегство» (τρέπω). πᾶς ἀνὴρ πολεμιστὴς ἐξ αὐτῶν — «всякий муж воинственный из них» (πολεμιστής); ἐξεχύθησαν ἐπ᾿ αὐτούς — «устремились на них» (ἐκχέω, тот же глагол, что в ст. 2)."
  4: "Βαιτομασθαιμ — ベトメスタイム (в 4:6 Βαιτομεσθαιμ); Βηβαι — ベバイ, Χωβαι — ホバイ, Κωλα — コラ: транслитерация греческих топонимов, отождествление спорно. τοὺς ἀπαγγέλλοντας ὑπὲρ τῶν συντετελεσμένων — «возвещающих о совершившемся» (ἀπαγγέλλω; συντελέω — завершать). ἵνα πάντες ἐπεκχυθῶσιν τοῖς πολεμίοις εἰς τὴν ἀναίρεσιν αὐτῶν — «чтобы все устремились на врагов на истребление их» (ἐπεκχέω, ἀναίρεσις — уничтожение); слав. «да вси потекут вслед врагов»."
  5: "ἔκοπτον αὐτοὺς ἕως Χωβα — «поражали их до Ховы» (κόπτω — рубить; Χωβα — ホバ). οἱ ἐξ Ιερουσαλημ παρεγενήθησαν — «пришли из Иерусалима» (παραγίνομαι). ἀνήγγειλαν γὰρ αὐτοῖς τὰ γεγονότα τῇ παρεμβολῇ τῶν ἐχθρῶν — «ибо возвестили им о случившемся в стане врагов их» (ἀναγγέλλω; παρεμβολή — стан). ὑπερεκέρασαν αὐτοὺς πληγῇ μεγάλῃ — «поразили их великим поражением»: редкий глагол ὑπερκεράω, слав. «бодоша их язвою великою»; ἕως οὗ παρῆλθον Δαμασκόν — «доколе не прошли Дамаск»."
  6: "οἱ λοιποὶ οἱ κατοικοῦντες Βαιτυλουα — «остальные жители Ветилуи». ἐπέπεσαν τῇ παρεμβολῇ Ασσουρ — «напали на стан Ассирии» (ἐπιπίπτω + датив; Ασσουρ — アッシリア). ἐπρονόμευσαν — «разграбили» (προνομεύω — брать добычу); слав. «плениша их» передаёт тот же смысл. ἐπλούτησαν σφόδρα — «весьма обогатились»."
  7: "ἀναστρέψαντες ἀπὸ τῆς κοπῆς — «возвратившись от избиения» (κοπή — резня, от κόπτω). ἐκυρίευσαν τῶν λοιπῶν — «овладели остальным» (κυριεύω + генитив). αἱ κῶμαι καὶ ἐπαύλεις — «деревни и усадьбы» (ἔπαυλις — хутор, загородный дом; слав. «села»). ἐκράτησαν πολλῶν λαφύρων — «получили много добычи» (λάφυρον); ἦν γὰρ πλῆθος πολὺ σφόδρα — «ибо [её] было весьма многое множество»."
  8: "Ιωακιμ ὁ ἱερεὺς ὁ μέγας — «Иоаким, великий священник» (大祭司; ср. 4:6). ἡ γερουσία τῶν υἱῶν Ισραηλ — «старейшины сынов Израиля» (γερουσία — 長老会). ἦλθον τοῦ θεάσασθαι τὰ ἀγαθά — «пришли посмотреть блага» (θεάομαι — созерцать; ἀγαθά — благодеяния). λαλῆσαι μετ᾿ αὐτῆς εἰρήνην — «поговорить с нею мир», т. е. приветствовать её (слав. «глаголати с нею мир»)."
  9: "ὡς δὲ εἰσῆλθον πρὸς αὐτήν — «когда вошли к ней»; εὐλόγησαν αὐτὴν πάντες ὁμοθυμαδόν — «все единодушно благословили её» и «сказали ей» (εἶπαν πρὸς αὐτήν). ὕψωμα Ιερουσαλημ — «высота Иерусалима» (LXX); слав. читает «возвышение израилево», и это церковное чтение взято в текст. γαυρίαμα μέγα τοῦ Ισραηλ — «великая радость/гордость Израиля» (γαυρίαμα — предмет ликования). καύχημα μέγα τοῦ γένους ἡμῶν — «великая похвала рода нашего» (καύχημα; γένος — род)."
  10: "ἐποίησας ταῦτα πάντα ἐν χειρί σου — «ты сделала всё это рукою твоею» (ἐν χειρί — орудием). ἐποίησας τὰ ἀγαθὰ μετὰ Ισραηλ — «ты сделала доброе с Израилем», т. е. Израилю (μετά — по отношению к). εὐδόκησεν ἐπ᾿ αὐτοῖς ὁ θεός — «Бог благоволил о них»: аорист LXX; слав. «да благоволит о них Бог» (оптатив), в тексте — изъявительное чтение LXX. εὐλογημένη γίνου — «будь благословенна» (императив γίνου); παρὰ τῷ παντοκράτορι κυρίῳ — «у Вседержителя Господа». Γένοιτο — «да будет» (слав. «буди»)."
  11: "ἐλαφύρευσεν πᾶς ὁ λαὸς τὴν παρεμβολήν — «весь народ разграбил стан» (λαφυρεύω). ἐφ᾿ ἡμέρας τριάκοντα — «в течение тридцати дней». ἀργυρώματα — «серебряные сосуды» (銀器); κλῖναι — «ложа, постели»; ὁλκεῖα — «умывальницы, тазы» (ὁλκεῖον); κατασκευάσματα — «утварь, убранство». ἡμίονος — «мул» (ラバ); ἔζευξεν τὰς ἁμάξας — «запрягла колесницы» (ζεύγνυμι); ἐσώρευσεν — «сложила в кучу» (σωρεύω)."
  12: "συνέδραμεν πᾶσα γυνὴ Ισραηλ — «сбежались все женщины Израиля» (συντρέχω). ἐποίησαν αὐτῇ χορὸν ἐξ αὐτῶν — «составили ей хор из себя» (χορός — хоровод). θύρσους — «тирсы», жезлы, увитые зеленью и цветами (θύρσος; слав. «копия цветами украшенная», ru «обвитые виноградными листьями жезлы»); в тексте — 花で飾った杖. ἔδωκεν ταῖς γυναιξὶν ταῖς μετ᾿ αὐτῆς — «дала женщинам, бывшим с нею»."
  13: "ἐστεφανώσαντο τὴν ἐλαίαν — «увенчали себя маслиной», т. е. венками из масличных ветвей (στεφανόω; ἐλαία — маслина). προῆλθεν παντὸς τοῦ λαοῦ ἐν χορεία — «пошла впереди всего народа в хороводе» (χορεία). ἡγουμένη πασῶν τῶν γυναικῶν — «ведя всех женщин» (ἡγέομαι). ἠκολούθει πᾶς ἀνὴρ Ισραηλ ἐνωπλισμένοι — «следовал всякий муж Израиля, вооружённые»: согласование в греч. нарушено (ед. πᾶς ἀνήρ при мн. ἐνωπλισμένοι). ὕμνουν ἐν τῷ στόματι αὐτῶν — «пели устами своими» (ὑμνέω; 賛歌)."
  14: "ἐξῆρχεν — «начала» (ἐξάρχω — запевать, начинать). ἐξομολόγησις — «исповедание», здесь славословие, благодарственная хвала (слав. «исповедание», ru «благодарственная песнь»); в тексте 告白. ὑπερεφώνει — «громко возглашал, перекрывая» (ὑπερφωνέω); αἴνεσις — «хвала» (слав. «хваление»). Стих вводит песнь, которая идёт в гл. 16."
