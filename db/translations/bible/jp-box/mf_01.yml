# jp-box, Евангелие от Матфея, глава 1. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, «ru», jp-joc).
# Греческий сайта (критический) — свидетель; расхождения с ним — в 〔…〕.
# Глава 1: родословие (1–17) и рождество (18–25). Слов Христа в главе нет — красного нет.
# Родословие набрано формулой «AからBが生まれた» (ἐγέννησεν); см. notes к ст. 2.

tr_code: jp-box
book: mf
chapter: 1
draft: true

verses:
  1: "イエス・キリストの系図[けいず]。この方[かた]はダビデの子[こ]、アブラハムの子[こ]である。"
  2: "アブラハムからイサクが生[う]まれ、イサクからヤコブが、ヤコブからユダとその兄弟[きょうだい]たちが生[う]まれた。"
  3: "ユダとタマルの間にペレツとゼラが生[う]まれ、ペレツからヘツロンが、ヘツロンからアラムが生[う]まれた。"
  4: "アラムからアミナダブが、アミナダブからナフションが、ナフションからサルモンが生[う]まれた。"
  5: "サルモンとラハブの間にボアズが生[う]まれ、ボアズとルツの間にオベドが、オベドからエッサイが生[う]まれた。"
  6: "エッサイからダビデ王[おう]が生[う]まれた。ダビデとウリヤの妻[つま]の間にソロモンが生[う]まれた。"
  7: "ソロモンからレハブアムが、レハブアムからアビヤが、アビヤからアサが生[う]まれた。"
  8: "アサからヨシャファトが、ヨシャファトからヨラムが、ヨラムからウジヤが生[う]まれた。"
  9: "ウジヤからヨタムが、ヨタムからアハズが、アハズからエゼキヤが生[う]まれた。"
  10: "エゼキヤからマナセが、マナセからアモンが、アモンからヨシヤが生[う]まれた。"
  11: "ヨシヤから〔イオアキムが、イオアキムから〕エコンヤとその兄弟[きょうだい]たちが、バビロンへ移[うつ]されるころに生[う]まれた。"
  12: "バビロンへ移[うつ]された後[のち]、エコンヤからシャルティエルが、シャルティエルからゼルバベルが生[う]まれた。"
  13: "ゼルバベルからアビウドが、アビウドからエリアキムが、エリアキムからアゾルが生[う]まれた。"
  14: "アゾルからサドクが、サドクからアキムが、アキムからエリウドが生[う]まれた。"
  15: "エリウドからエレアザルが、エレアザルからマタンが、マタンからヤコブが生[う]まれた。"
  16: "ヤコブからマリアの夫[おっと]ヨセフが生[う]まれた。このマリアから、イエスがお生[う]まれになった。この方[かた]が、キリストと呼[よ]ばれる方[かた]である。"
  17: "そこで、アブラハムからダビデまで、ダビデからバビロンへの移住[いじゅう]まで、バビロンへの移住[いじゅう]からキリストまでが、それぞれ十四代[じゅうよだい]である。"
  18: "イエス・キリストがお生[う]まれになった次第[しだい]は、こうである。母[はは]マリアはヨセフと婚約[こんやく]していたが、二人[ふたり]がまだ一緒[いっしょ]にならないうちに、{聖霊[せいれい]|聖神[せいしん]}によって身[み]ごもっていることが分[わ]かった。"
  19: "マリアの夫[おっと]ヨセフは正[ただ]しい人[ひと]で、マリアを公[おおやけ]の場[ば]にさらしたくはなかった。そこで、ひそかに離縁[りえん]しようと考えた。"
  20: "彼[かれ]がそのことを思[おも]い巡[めぐ]らしていると、見[み]よ、主[しゅ]の天使[てんし]が夢[ゆめ]のうちに現[あらわ]れて言[い]った。「ダビデの子[こ]ヨセフよ、妻[つま]マリアを迎[むか]えることを恐[おそ]れるな。マリアの内[うち]に生[う]まれたものは、{聖霊[せいれい]|聖神[せいしん]}から出[で]たものだからである。"
  21: "彼女[かのじょ]は男[おとこ]の子[こ]を産[う]む。その子[こ]にはイエスという名[な]を付[つ]けなさい。この子[こ]は、自分[じぶん]の民[たみ]をその罪[つみ]から救[すく]い出[だ]すからである。」"
  22: "それは、主[しゅ]が預言者[よげんしゃ]を通[とお]して語[かた]られた言葉[ことば]が成就[じょうじゅ]するためであった。"
  23: "「見[み]よ、おとめが身[み]ごもり、男[おとこ]の子[こ]を産[う]む。人々[ひとびと]はその子[こ]をインマヌエルと呼[よ]ぶ。」この名[な]は、「神[かみ]がわたしたちと共[とも]におられる」という意味[いみ]である。"
  24: "眠[ねむ]りから覚[さ]めたヨセフは、主[しゅ]の天使[てんし]の命[めい]じたとおり、マリアを妻[つま]に迎[むか]え入[い]れた。"
  25: "マリアが〔長子[ちょうし]である〕男[おとこ]の子[こ]を産[う]むまで、ヨセフが彼女[かのじょ]と夫婦[ふうふ]として交[まじ]わることはなかった。こうして、その子[こ]をイエスと名付[なづ]けた。"

notes:
  1: "Βίβλος γενέσεως — «книга происхождения (родословия)». Порядок греческого сохранён: Иисус Христос → Давид → Авраам; у jp-ni он обратный, поэтому фраза разбита на два предложения."
  2: "Родословие набрано страдательной формулой «AからBが生まれた» при ἐγέννησεν, чтобы не повторять дословно jp-ni («AはBをもうけ…»); цепь и порядок имён не менял."
  3: "ἐκ τῆς Θαμάρ — родительный матери: «ユダとタマルの間に», чтобы мать была названа прямо, а не обстоятельством."
  5: "Трижды ἐκ τῆς… (Рахав, Руфь) — те же «との間に生まれた»: в тексте названы матери, а не только отцы."
  6: "Мать Соломона в греч. не названа — «ウリヤの妻», как и в тексте (Вирсавия не появляется)."
  7: "Критическая база читает Ἀσάφ (Асаф), церковный текст — Ἀσά (Аса, jp-joc「アサ」). Взято церковное чтение; 〔〕 не ставил: это разночтение имени, а не добавка."
  10: "Критическая база — Ἀμώς (Амос), церковный текст — Ἀμών (Амон, jp-joc「アモン」). Взято церковное чтение, как в ст. 7."
  11: "В церковном тексте (Елизаветинская, jp-joc「イヲシヤはイヲアキムを生み…」) между Иосией и Иехонией стоит Ἰωακείμ; в критической базе его нет — добавка в 〔〕."
  14: "Ἀχίμ → アキム (χ = к), у jp-joc「アヒム». Для единообразия с エリアキム (Ἐλιακίμ) оставил キ."
  15: "Ματθάν → マタン (θ = т), у jp-joc「マトファン」."
  16: "ἐξ ἧς — женский род: «от неё», то есть от Марии, а не от Иосифа. Поэтому разбито на три предложения: Иаков родил Иосифа, мужа Марии; от Марии родился Иисус; Он и есть называемый Христос. Место спорное — прошу сверить."
  17: "πᾶσαι οὖν αἱ γενεαί — «итак, всех родов…»; счёт троекратно по четырнадцать, как в тексте; общий итог не подводил."
  19: "δειγματίσαι — «выставить на позор»; ἐβουλήθη λάθρᾳ ἀπολῦσαι — «решил тайно отпустить (дать развод)», отсюда 離縁."
  20: "ἰδού — «се», 見よ сохраняю по всей книге. τὸ ἐν αὐτῇ γεννηθέν — «рождённое в ней», а не «её сын»: оставлено «内に生まれたもの»."
  21: "Подлежащее τέξεται — Мария, в jp-ni она названа; поставил 彼女, чтобы не повторять имя. σώσει — «спасёт»: 救い出す (совершенный вид)."
  22: "ἵνα πληρωθῇ — придаточное цели, формула книги «それは…成就するためであった». Пророк в тексте не назван (Исаия у Матфея здесь не упомянут), имя не добавлял."
  23: "Ис 7:14. καλέσουσιν — 3-е л. мн. ч. («нарекут»), поэтому 人々は…と呼ぶ, а не страдательный залог. インマヌエル — известный термин, сноски нет, толкование дано в самом стихе."
  24: "ἐποίησεν ὡς προσέταξεν — «сделал, как повелел»; ὡς передано «…の命じたとおり»."
  25: "ἕως οὗ ἔτεκεν υἱόν: в критической базе без πρωτότοκον, церковный текст (Елизаветинская, jp-joc「冢子」) читает «первенца» — 〔長子である〕. οὐκ ἐγίνωσκεν — «не знал её» (эвфемизм), передано 夫婦として交わる."
