# jp-box, Исаия, глава 64. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный, с МТ) — только для понимания,
# не источник. jp-joc в гл. 64 — 5 стихов из 11, в выгрузку не входил;
# jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 64: 1–2 «как воск тает от огня»: огонь на супостатов, имя Господне,
# трепет гор; 3–4 «от века не слышали»: Бог кроме Тебя, встречающий творящих
# правду, «вот, Ты разгневался, и мы согрешили»; 5–6 нечистота и рубище, листья
# и ветер, нет призывающего имя; 7 глина и горшечник; 8 «не гневайся без меры»;
# 9–10 город святыни опустел, дом сожжён; 11 «Ты терпел и молчал».
# Голоса: вся глава — продолжение молитвы 63:7–64:11, одна цитата 「…»,
# открытая в 63:7 и закрытая в конце 64:11; в 64:1 кавычка открывается снова
# (парность по главам), см. notes 1.
# Нумерация: в gr 11 стихов, у csl 12 — слав. на один стих впереди:
#   • слав. 64:1 = конец нашего 63:19 («аще отверзеши небо, трепет приимут
#     от тебе горы, и растаются»);
#   • наш 64:1 = слав. 64:2 («яко тает воск от лица огня…»);
#   • далее csl N = наш N−1: наш 64:2 = слав. 64:3, … наш 64:11 = слав. 64:12.
# Держим gr; карта — в notes каждого стиха. Наш 64:1 по смыслу продолжает 63:19
# («и растают»), поэтому начинается с оборота «火から蝋が溶けるように。».
# Паритет: csl-добавок в главе нет; 64:2 в гр. повторяет конец 63:19 (двойка
# византийского текста) — сохранено. 〔…〕 нет.
# Сносок ⟨…⟩ нет: 蝋, 粘土, 聖所, 月経 уже в корпусе; ῥάκος ἀποκαθημένης
# объяснено в notes 5, слово не сглажено.
# Имена — транслитерация греческого (LXX): シオン, エルサレム.

tr_code: jp-box
