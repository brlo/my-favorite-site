verses:
  1: "「火[ひ]から蝋[ろう]が溶[と]けるように。火は敵対[てきたい]する者[もの]たちを焼[や]き尽[つ]くし、主[しゅ]の名[な]は敵対する者たちの間[あいだ]で明[あき]らかになる。あなたの前[まえ]で国[くに]々[ぐに]は慌[あわ]てる。"
  2: "あなたが栄光[えいこう]のわざを行[おこな]われるとき、山[やま]々[やま]はあなたの前[まえ]に震[ふる]える。"
  3: "わたしたちは昔[むかし]から聞[き]いたことがなく、わたしたちの目[め]も見[み]たことがない——あなた以外[いがい]の神[かみ]を。あなたが、あわれみを待[ま]ち望[のぞ]む者[もの]たちのために行[おこな]うわざを。"
  4: "あわれみは義[ぎ]を行[おこな]う者[もの]たちに会[あ]い、あなたの道[みち]はそこに思[おも]い起[おこ]される。見[み]よ、あなたは怒[いか]られたのに、わたしたちは罪[つみ]を犯[おか]した。それゆえ、わたしたちは迷[まよ]い出[で]た。"
  5: "わたしたちは皆[みな]、汚[けが]れた者[もの]のようになった。わたしたちの義[ぎ]はすべて、月経[げっけい]の女[おんな]の汚れた布[ぬの]のようである。わたしたちは自分[じぶん]の不法[ふほう]のゆえに、葉[は]のように散[ち]り、風[かぜ]がわたしたちを運[はこ]び去[さ]る。"
  6: "わたしたちには、あなたの名[な]を呼[よ]ぶ者[もの]も、あなたをしっかりとらえようと思[おも]い起[おこ]す者もいない。あなたはわたしたちから御顔[みかお]を背[そむ]け、わたしたちの罪[つみ]のゆえにわたしたちを渡[わた]されたからである。"
  7: "しかし、主[しゅ]よ、あなたはわたしたちの父[ちち]である。わたしたちは粘土[ねんど]であり、わたしたちは皆[みな]、あなたの手[て]のわざである。"
  8: "わたしたちに激[はげ]しく怒[いか]らず、時[とき]が来てもわたしたちの罪[つみ]を思[おも]い起[おこ]さないでください。見[み]てください。わたしたちは皆、あなたの民[たみ]です。"
  9: "あなたの聖所[せいしょ]の都[みやこ]は荒[あ]れ野[の]となり、シオンは荒れ野のように、エルサレムは呪[のろ]いとなった。"
  10: "わたしたちの聖[せい]なる家[いえ]、わたしたちの栄光[えいこう]、父[ちち]たちが祝福[しゅくふく]した家は火[ひ]で焼[や]かれ、わたしたちのすべての麗[うるわ]しいものは倒[たお]れた。"
  11: "主[しゅ]よ、あなたはこれらすべてのことを耐[た]え忍[しの]び、黙[だま]って、わたしたちをひどく低[ひく]くされた。」"

notes:
  1: "Ὡς κηρὸς ἀπὸ πυρὸς τήκεται — «как воск от огня тает» (κηρός — воск; τήκω — плавить, растапливать). В гр. это начало главы, но по смыслу — продолжение 63:19 («καὶ τακήσονται»): слав. относит эти слова к своему 64:2, а слав. 64:1 — конец нашего 63:19. Отсюда сдвиг: csl N = наш N−1. καὶ κατακαύσει πῦρ τοὺς ὑπεναντίους — «и попалит огонь супостатов» (κατακαίω — сжигать дотла; ὑπεναντίος — противник); φανερὸν ἔσται τὸ ὄνομα κυρίου ἐν τοῖς ὑπεναντίοις — «явлено будет имя Господне между супостатами» (φανερός — явный); ἀπὸ προσώπου σου ἔθνη ταραχθήσονται — «от лица Твоего народы смятятся» (ταράσσω — приводить в смятение)."
  2: "ὅταν ποιῇς τὰ ἔνδοξα — «когда творишь славное» (ἔνδοξος — славный); τρόμος λήμψεται ἀπὸ σοῦ ὄρη — «трепет объимет от Тебя горы». В византийском тексте стих почти дословно повторяет конец 63:19 — двойка сохранена, не сглажена. У слав. это 64:3; сдвиг см. notes 1."
  3: "ἀπὸ τοῦ αἰῶνος — «от века»; οὐκ ἠκούσαμεν — «мы не слышали»; οἱ ὀφθαλμοὶ ἡμῶν εἶδον — «глаза наши видели»; θεὸν πλὴν σοῦ — «Бога, кроме Тебя»; ἃ ποιήσεις τοῖς ὑπομένουσιν ἔλεον — «что сотворишь ожидающим милости» (ὑπομένω — ожидать, терпеть; ἔλεος — милость). Стих цитируется в 1 Кор 2:9, но там иное, масоретское чтение; здесь держим LXX. Слав. это 64:4."
  4: "συναντήσεται γὰρ τοῖς ποιοῦσιν τὸ δίκαιον — «ибо встретит творящих правду» (συναντάω — встречать; подлежащее подразумевается, в слав. «милость срящет»); τῶν ὁδῶν σου μνησθήσονται — «пути Твои вспомнятся» (в слав. страдательно). ἰδοὺ σὺ ὠργίσθης, καὶ ἡμεῖς ἡμάρτομεν — «вот, Ты разгневался, и мы согрешили»; διὰ τοῦτο ἐπλανήθημεν — «потому мы заблудились» (πλανάω): в гр. это конец стиха, а у слав. «Сего ради заблудихом» открывает слав. 64:6 (наш 64:5) — деление иное, держим gr. Слав. это 64:5."
  5: "ἐγενήθημεν ὡς ἀκάθαρτοι — «мы стали как нечистые» (ἀκάθαρτος — нечистый); ὡς ῥάκος ἀποκαθημένης — «как рубище женщины в очищении» (ῥάκος — рубище, лоскут; ἀποκάθημαι — сидеть отдельно, о менструации; слав. «порт нечистыя» смягчает, в тексте 月経の女の汚れた布 — не сглажено). πᾶσα ἡ δικαιοσύνη ἡμῶν — «вся правда наша»; ἐξερρύημεν ὡς φύλλα — «мы опали, как листья» (ἐκρέω — вытекать, спадать); οὕτως ἄνεμος οἴσει ἡμᾶς — «так ветер унесёт нас» (οἴσω — понесу). Слав. это 64:6."
  6: "ὁ ἐπικαλούμενος τὸ ὄνομά σου — «призывающий имя Твоё» (ἐπικαλέω); ὁ μνησθεὶς ἀντιλαβέσθαι σου — «вспомнивший, чтобы удержать Тебя» (ἀντιλαμβάνω — держать, поддерживать); ἀπέστρεψας τὸ πρόσωπόν σου ἀφ᾽ ἡμῶν — «Ты отвратил лицо Твоё от нас»; παρέδωκας ἡμᾶς διὰ τὰς ἁμαρτίας ἡμῶν — «предал нас за грехи наши». В конце стиха в гр. стоит знак «—» (редакторская помета), в текст не перенесён. Слав. это 64:7."
  7: "καὶ νῦν, κύριε, πατὴρ ἡμῶν σύ — «и ныне, Господи, Ты Отец наш»; ἡμεῖς δὲ πηλός — «мы же глина» (πηλός; слав. «брение»); ἔργον τῶν χειρῶν σου πάντες — «дело рук Твоих все». У Син. «Ты образователь наш» — по МТ (יֹצֵר), в LXX этого слова нет, в текст не внесено. Слав. это 64:8."
  8: "μὴ ὀργίζου ἡμῖν σφόδρα — «не гневайся на нас сильно» (ὀργίζω — гневаться); μὴ ἐν καιρῷ μνησθῇς ἁμαρτιῶν ἡμῶν — «не вспомни во время грехов наших» (καιρός — время); ἐπίβλεψον — «воззри» (ἐπιβλέπω); ὅτι λαός σου πάντες ἡμεῖς — «ибо все мы народ Твой». Слав. это 64:9."
  9: "πόλις τοῦ ἁγίου σου — «город святыни Твоей» (τὸ ἅγιον — святыня, святилище); ἐγενήθη ἔρημος — «стал пустынею» (ἔρημος — пустыня); Σιων ὡς ἔρημος ἐγενήθη — «Сион стал как пустыня»; Ιερουσαλημ εἰς κατάραν — «Иерусалим — в проклятие» (κατάρα — проклятие). Слав. это 64:10."
  10: "ὁ οἶκος, τὸ ἅγιον ἡμῶν, καὶ ἡ δόξα — «дом, святыня наша, и слава»; ἣν ηὐλόγησαν οἱ πατέρες ἡμῶν — «которую благословили отцы наши»; ἐγενήθη πυρίκαυστος — «стал сожжённым огнём» (πυρίκαυστος — сожжённый); πάντα τὰ ἔνδοξα συνέπεσεν — «всё славное пало» (συμπίπτω — падать вместе). Слав. это 64:11."
  11: "ἐπὶ πᾶσι τούτοις ἀνέσχου — «при всём этом Ты терпел» (ἀνέχω — терпеть, сносить); ἐσιώπησας — «Ты молчал» (σιωπάω); ἐταπείνωσας ἡμᾶς σφόδρα — «Ты смирил нас весьма» (ταπεινόω). Здесь молитва, начатая в 63:7, заканчивается; кавычка закрывается. У слав. это 64:12; в ру его продолжение («будешь ли ещё удерживаться…») — по МТ, в LXX этого нет, в текст не внесено."
