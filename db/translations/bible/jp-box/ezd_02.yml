verses:
  1: "これらの者[もの]は、その地方[ちほう]の人[ひと]々[びと]、捕囚[ほしゅう]の移住[いじゅう]から上[のぼ]って来[き]た者[もの]たちである。バビロンの王[おう]ネブカドネツァルがバビロンへ移[うつ]した者[もの]たちで、彼[かれ]らはそれぞれ自分[じぶん]の町[まち]へ、ユダとエルサレムへ帰[かえ]った。"
  2: "ゼルバベルとともに来[き]た者[もの]たちは、イエシュア、ネヘミヤ、サライア、レエリア、モルデカイ、バラサン、マスファル、バグイ、レウム、バアナであった。イスラエルの民[たみ]の男[おとこ]の数[かず]は次[つぎ]のとおりである。"
  3: "フォロスの子[こ]らは二千百七十二人[にん]。"
  4: "サファティアの子[こ]らは三百七十二人[にん]。"
  5: "エラの子[こ]らは七百七十五人[にん]。"
  6: "ファアトモアブの子[こ]ら、すなわちイエシュアとヨアブの子[こ]らのうちの者[もの]たちは二千八百十二人[にん]。"
  7: "アイラムの子[こ]らは千二百五十四人[にん]。"
  8: "ザトゥアの子[こ]らは九百四十五人[にん]。"
  9: "ザクフの子[こ]らは七百六十人[にん]。"
  10: "バヌイの子[こ]らは六百四十二人[にん]。"
  11: "バビの子[こ]らは六百二十三人[にん]。"
  12: "アスガドの子[こ]らは千二百二十二人[にん]。"
  13: "アドニカムの子[こ]らは六百六十六人[にん]。"
  14: "バゴイの子[こ]らは二千五十六人[にん]。"
  15: "アディンの子[こ]らは四百五十四人[にん]。"
  16: "アテルの子[こ]ら、すなわちエゼキヤの家[いえ]の者[もの]たちは九十八人[にん]。"
  17: "バスの子[こ]らは三百二十三人[にん]。"
  18: "イオラの子[こ]らは百十二人[にん]。"
  19: "アセムの子[こ]らは二百二十三人[にん]。"
  20: "ガベルの子[こ]らは九十五人[にん]。"
  21: "ベツレヘムの子[こ]らは百二十三人[にん]。"
  22: "ネトファの子[こ]らは五十六人[にん]。"
  23: "アナトトの子[こ]らは百二十八人[にん]。"
  24: "アスモトの子[こ]らは四十三人[にん]。"
  25: "キリアテアリム、カフィラ、ベロトの子[こ]らは七百四十三人[にん]。"
  26: "アラマとガバアの子[こ]らは六百二十一人[にん]。"
  27: "マクマスの男[おとこ]たちは百二十二人[にん]。"
  28: "ベテルとアイの男[おとこ]たちは四百二十三人[にん]。"
  29: "ナブの子[こ]らは五十二人[にん]。"
  30: "マゲボスの子[こ]らは百五十六人[にん]。"
  31: "エラムの子[こ]らは千二百五十四人[にん]。"
  32: "ヘラムの子[こ]らは三百二十人[にん]。"
  33: "ロド、アロト、オノの子[こ]らは七百二十五人[にん]。"
  34: "エリコの子[こ]らは三百四十五人[にん]。"
  35: "サナアの子[こ]らは三千六百三十人[にん]。"
  36: "祭司[さいし]たちは次[つぎ]のとおりである。イエドゥアの子[こ]ら、すなわちイエシュアの家[いえ]の者[もの]たちは九百七十三人[にん]。"
  37: "エンメルの子[こ]らは千五十二人[にん]。"
  38: "ファスルの子[こ]らは千二百四十七人[にん]。"
  39: "エレムの子[こ]らは千十七人[にん]。"
  40: "レビ人[びと]は次[つぎ]のとおりである。イエシュアとカドミエルの子[こ]ら、すなわちオドゥイアの子[こ]らのうちの者[もの]たちは七十四人[にん]。"
  41: "歌[うた]い手[て]は次[つぎ]のとおりである。アサフの子[こ]らは百二十八人[にん]。"
  42: "門衛[もんえい]の子[こ]らは次[つぎ]のとおりである。サルムの子[こ]ら、アテルの子[こ]ら、テルモンの子[こ]ら、アクブの子[こ]ら、アティタの子[こ]ら、サバウの子[こ]ら。全部[ぜんぶ]で百三十九人[にん]。"
  43: "神殿[しんでん]のしもべたちは次[つぎ]のとおりである。スイアの子[こ]ら、アスフェの子[こ]ら、タバオトの子[こ]ら、"
  44: "ケラオスの子[こ]ら、ソエアの子[こ]ら、ファドンの子[こ]ら、"
  45: "ラバノの子[こ]ら、アガバの子[こ]ら、アカボトの子[こ]ら、"
  46: "アガブの子[こ]ら、サマライの子[こ]ら、アナンの子[こ]ら、"
  47: "ケデルの子[こ]ら、ガエルの子[こ]ら、レエアの子[こ]ら、"
  48: "ラソンの子[こ]ら、ネコダの子[こ]ら、ガゼムの子[こ]ら、"
  49: "ウサの子[こ]ら、ファセの子[こ]ら、バシの子[こ]ら、"
  50: "アセナの子[こ]ら、マオニムの子[こ]ら、ナフィソンの子[こ]ら、"
  51: "バクブクの子[こ]ら、アキファの子[こ]ら、アルルの子[こ]ら、"
  52: "バサロトの子[こ]ら、マウダの子[こ]ら、アレサの子[こ]ら、"
  53: "バルクスの子[こ]ら、シサラの子[こ]ら、テマの子[こ]ら、"
  54: "ナスエの子[こ]ら、アトファの子[こ]ら。"
  55: "ソロモンのしもべたちの子[こ]らは次[つぎ]のとおりである。サティの子[こ]ら、アセフェラトの子[こ]ら、ファドゥラの子[こ]ら、"
  56: "イエエラの子[こ]ら、ダルコンの子[こ]ら、ゲデルの子[こ]ら、"
  57: "サファティアの子[こ]ら、アティルの子[こ]ら、ファケラト・アセボインの子[こ]ら、エミの子[こ]ら。"
  58: "神殿[しんでん]のしもべたちと、ソロモンのしもべたちの子[こ]らは、全部[ぜんぶ]で三百九十二人[にん]であった。"
  59: "テルメレト、テラリサ、ハルブ、エダン、エンメルから上[のぼ]って来[き]た者[もの]たちは次[つぎ]のとおりである。彼[かれ]らは自分[じぶん]の父[ちち]の家[いえ]と自分[じぶん]の種[たね]がイスラエルに属[ぞく]するかどうかを告[つ]げることができなかった。"
  60: "ダライアの子[こ]ら、ブアの子[こ]ら、トビヤの子[こ]ら、ネコダの子[こ]らは六百五十二人[にん]。"
  61: "祭司[さいし]の子[こ]らのうちでは、ハビアの子[こ]ら、アクスの子[こ]ら、ベルゼライの子[こ]ら。ベルゼライはギレアデ人[じん]ベルゼライの娘[むすめ]たちから妻[つま]を迎[むか]え、その名[な]で呼[よ]ばれた者[もの]である。"
  62: "これらの者[もの]たちは自分[じぶん]の系図[けいず]の記録[きろく]を求[もと]めたが、見[み]つからなかった。そこで、彼[かれ]らは祭司[さいし]の職[しょく]から除[のぞ]かれた。"
  63: "アテルサタは彼[かれ]らに、明[あき]らかにする者[もの]たちと完全[かんぜん]な者[もの]たちのための祭司[さいし]が立[た]つまで、最[もっと]も聖[せい]なる捧[ささ]げ物[もの]を食[た]べてはならない、と言[い]った。"
  64: "会衆[かいしゅう]は一[ひと]つに合[あ]わさって、四万二千三百六十人[にん]であった。"
  65: "そのほかに、彼[かれ]らの男[おとこ]女[おんな]の奴隷[どれい]が七千三百三十七人[にん]、また彼[かれ]らの歌[うた]い手[て]で、男[おとこ]も女[おんな]も二百人[にん]いた。"
  66: "彼[かれ]らの馬[うま]は七百三十六頭[とう]、ラバは二百四十五頭[とう]、"
  67: "ラクダは四百三十五頭[とう]、ロバは六千七百二十頭[とう]。"
  68: "氏族[しぞく]の長[かしら]たちのうちのある者[もの]たちは、エルサレムにある主[しゅ]の家[いえ]に来[き]たとき、神[かみ]の家[いえ]をその基[もとい]の上[うえ]に据[す]えるために、自発[じはつ]の捧[ささ]げ物[もの]をした。"
  69: "彼[かれ]らは力[ちから]に応[おう]じて、金[きん]六万一千ドラクマ、銀[ぎん]五千ミナ、祭司[さいし]の衣[ころも]百着[ひゃくちゃく]を、その工事[こうじ]のための宝物庫[たからものぐら]に納[おさ]めた。"
  70: "祭司[さいし]たち、レビ人[びと]たち、民[たみ]のうちの者[もの]たち、歌[うた]い手[て]たち、門衛[もんえい]たち、神殿[しんでん]のしもべたちは、それぞれ自分[じぶん]の町[まち]々[まち]に住[す]み、イスラエルはすべて自分[じぶん]の町[まち]々[まち]に住[す]んだ。"

notes:
  1: "οἱ υἱοὶ τῆς χώρας — «сыны страны», т. е. жители области (χώρα); ἀπὸ τῆς αἰχμαλωσίας τῆς ἀποικίας — из плена переселения (αἰχμαλωσία, ἀποικία; слав. «от плена преселения»); ἧς ἀπῴκισεν Ναβουχοδονοσορ — которым переселил Навуходоносор (ἀποικίζω); ἀνὴρ εἰς πόλιν αὐτοῦ — каждый в свой город."
