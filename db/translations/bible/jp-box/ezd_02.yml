  43: "οἱ ναθιναῖοι — нефинеи, храмовые служители (ναθιναῖος; слав. «нафинее»); υἱοὶ Σουια, Ασουφε, Ταβαωθ — スイア, アスフェ, タバオト (слав. «суавли, суфатовы, тавваофли»)."
  44: "υἱοὶ Κηραος, Σωηα, Φαδων — сыны Кераоса, Соэи, Фадона (слав. «кирасовы, сирсавли, фадонины»)."
  45: "υἱοὶ Λαβανω, Αγαβα, Ακαβωθ — сыны Лавано, Агавы, Акавота (слав. «лавановы, агавовы, акувовы»)."
  46: "υἱοὶ Αγαβ, Σαμαλαι, Αναν — сыны Агава, Самалая, Анана (слав. «агавовы, селамиины, анановы»)."
  47: "υἱοὶ Κεδελ, Γαερ, Ρεηα — сыны Кедела, Гаера, Реэи (слав. «геддилины, гааровы, раиаевы»)."
  48: "υἱοὶ Ρασων, Νεκωδα, Γαζεμ — сыны Расона, Некоды, Газема (слав. «расоновы, некодовы, газемли»)."
  49: "υἱοὶ Ουσα, Φαση, Βασι — сыны Усы, Фасе, Баси (слав. «азоковы, фасиевы, расиины»)."
  50: "υἱοὶ Ασενα, Μαωνιμ, Ναφισων — сыны Асены, Маонина, Нафисона (слав. «асенаевы, мунниновы, нефусимли»)."
  51: "υἱοὶ Βακβουκ, Ακιφα, Αρουρ — сыны Бакбука, Акифы, Арура (слав. «ваквуковы, акуфаевы, ануровы»)."
  52: "υἱοὶ Βασαλωθ, Μαουδα, Αρησα — сыны Басалофа, Мауды, Аресы (слав. «васалофовы, мидановы, арсановы»)."
  53: "υἱοὶ Βαρκους, Σισαρα, Θεμα — сыны Баркуса, Сисары, Фемы (слав. «варкосовы, сисарины, фемавли»)."
  54: "υἱοὶ Νασουε, υἱοὶ Ατουφα — сыны Насуе и Атуфы (слав. «нафиевы, атифовы»)."
  55: "В LXX стих начинается υἱοὶ Αβδησελμα (сыны Абдесельмы — вероятно, искажённое «рабы Соломона»); слав. даёт заголовок «Сынове слуг соломоновых», он и внесён в текст. υἱοὶ Σατι, Ασεφηραθ, Φαδουρα — サティ, アセフェラト, ファドゥラ (слав. «сотаевы, сефирины, фадуровы»)."
  56: "υἱοὶ Ιεηλα, Δαρκων, Γεδηλ — сыны Иеила, Даркона, Гедела (слав. «иеалаевы, дерконовы, геддилины»)."
  57: "υἱοὶ Σαφατια, Ατιλ, Φαχεραθ-ασεβωιν, Ημι — сыны Сафатии, Атила, Фахераф-Асебоина, Еми (слав. «сафатиевы, аттилевы, фахерафовы, асевоимли, имеевы»)."
  58: "πάντες οἱ ναθινιν καὶ υἱοὶ Αβδησελμα — все нефинеи и сыны Абдесельмы, т. е. рабы Соломоновы (слав. «вси нафанимовы и сынове слуг соломоновых»); τριακόσιοι ἐνενήκοντα δύο — 392."
  59: "οἱ ἀναβάντες ἀπὸ Θελμελεθ, Θελαρησα, Χαρουβ, Ηδαν, Εμμηρ — вышедшие из Тель-Мелаха, Тель-Харши, Херуб-Аддан-Иммера (слав. «фелмелеха, фелариса, херув, идан, еммир»); οὐκ ἠδυνάσθησαν ἀναγγεῖλαι οἶκον πατριᾶς καὶ σπέρμα — не могли объявить дом отца и семя, т. е. родословие; εἰ ἐξ Ισραηλ εἰσίν — от Израиля ли они."
  60: "υἱοὶ Δαλαια, Βουα, Τωβια, Νεκωδα — сыны Делаии, Буи, Товии, Некоды (слав. «далаиевы, товиевы, некодаевы»); ἑξακόσιοι πεντήκοντα δύο — 652."
  61: "καὶ ἀπὸ τῶν υἱῶν τῶν ἱερέων — и из сынов священнических; Χαβια, Ακους, Βερζελλαι — Хавия, Аккус, Верзеллий (слав. «оваиевы, аккусовы, верзеллаевы»); ὃς ἔλαβεν ἀπὸ θυγατέρων Βερζελλαι τοῦ Γαλααδίτου γυναῖκα — который взял жену из дочерей Верзеллия Галаадитянина; ἐκλήθη ἐπὶ τῷ ὀνόματι αὐτῶν — был назван их именем."
  62: "οὗτοι ἐζήτησαν γραφὴν αὐτῶν οἱ μεθωεσιμ — они искали своей записи; μεθωεσιμ — гапакс, вероятно «родословие»; οὐχ εὑρέθησαν — не нашлись; ἠγχιστεύθησαν ἀπὸ τῆς ἱερατείας — были отстранены от священства (слав. «изгнани суть от священства»)."
  63: "Αθερσαθα — Аферсафа (слав.), титул персидского наместника (тиршата); в тексте アテルサタ. τοῦ μὴ φαγεῖν ἀπὸ τοῦ ἁγίου τῶν ἁγίων — не есть от святого святых; ἕως ἀναστῇ ἱερεὺς τοῖς φωτίζουσιν καὶ τοῖς τελείοις — пока не восстанет священник «просвещающим и совершенным»: LXX передаёт урим и туммим как φωτίζοντες и τέλειοι; слав. «со изявлением и истиною», ru «с уримом и туммимом»."
  64: "πᾶσα ἡ ἐκκλησία ὡς εἷς — всё собрание как один (ἐκκλησία, 会衆); τέσσαρες μυριάδες δισχίλιοι τριακόσιοι ἑξήκοντα — 42 360; слав. «яко четыри тмы» (тьма — мириада)."
  65: "χωρὶς δούλων αὐτῶν καὶ παιδισκῶν — кроме рабов их и рабынь; οὗτοι ἑπτακισχίλιοι τριακόσιοι τριάκοντα ἑπτά — 7337; ᾄδοντες καὶ ᾄδουσαι — поющие мужчины и женщины, 200."
  66: "ἵπποι αὐτῶν ἑπτακόσιοι τριάκοντα ἕξ — коней 736; ἡμίονοι διακόσιοι τεσσαράκοντα πέντε — лошаков (ラバ) 245."
  67: "κάμηλοι τετρακόσιοι τριάκοντα πέντε — верблюдов 435; ὄνοι ἑξακισχίλιοι ἑπτακόσιοι εἴκοσι — ослов 6720."
  68: "ἀπὸ ἀρχόντων πατριῶν — из глав отцов (слав. «от князей отечеств»); εἰς οἶκον κυρίου — в дом Господень; ἡκουσιάσαντο — добровольно принесли (ἑκουσιάζομαι); τοῦ στῆσαι αὐτὸν ἐπὶ τὴν ἑτοιμασίαν αὐτοῦ — чтобы поставить его на его приготовление (ἑτοιμασία); слав. «на основании его» (θεμέλιος)."
  69: "ὡς ἡ δύναμις αὐτῶν — по силе их; εἰς θησαυρὸν τοῦ ἔργου — в сокровищницу дела; χρυσίον καθαρόν — чистое золото; μναῖ ἓξ μυριάδες καὶ χίλιαι — 61 000 мин (LXX); слав. «злата драхм шестьдесят тысящ и тысящу» — драхмы, как в МТ, в тексте драхмы; ἀργύριον μναῖ πεντακισχίλιαι — 5000 мин серебра; κοθωνοι τῶν ἱερέων ἑκατόν — 100 священнических одежд (κοθων)."
  70: "ἐκάθισαν — сели, поселились (καθίζω); οἱ ἱερεῖς καὶ οἱ Λευῖται καὶ οἱ ἀπὸ τοῦ λαοῦ — священники, левиты и [прочие] из народа; οἱ ᾄδοντες καὶ οἱ πυλωροὶ καὶ οἱ ναθινιμ — певцы, привратники и нефинеи; ἐν πόλεσιν αὐτῶν — в городах своих; πᾶς Ισραηλ — весь Израиль."
