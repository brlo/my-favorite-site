verses:
  1: "しゅうとめであるナオミは彼女[かのじょ]に言[い]った。「娘[むすめ]よ、あなたが幸[しあわ]せになるように、あなたに安[やす]らぎの場[ば]を探[さが]してやろうではないか。"
  2: "今[いま]、あなたが女中[じょちゅう]たちと一緒[いっしょ]にいたボアズは、わたしたちの親族[しんぞく]ではないか。見[み]なさい。彼は今夜[こんや]、大麦[おおむぎ]の脱穀場[だっこくじょう]で麦[むぎ]を風[かぜ]にさらしている。"
  3: "あなたは身[み]を洗[あら]い、油[あぶら]を塗[ぬ]り、衣[ころも]を着[き]て、脱穀場[だっこくじょう]へ上[のぼ]りなさい。彼が食[た]べて飲[の]み終[お]えるまでは、その男[おとこ]に姿[すがた]を見[み]せてはならない。"
  4: "彼が寝[ね]ると、どこで寝ているかを知[し]って、そこへ行[い]き、彼の足[あし]もとの覆[おお]いをはがして、そこに寝なさい。そうすれば、彼があなたのすべきことを告[つ]げてくれる。」"
  5: "ルツは彼女[かのじょ]に言[い]った。「あなたが言[い]うことは何[なん]でもする。」"
  6: "彼女[かのじょ]は脱穀場[だっこくじょう]へ下[お]りて行[い]き、しゅうとめが命[めい]じたすべてのことをそのとおりに行[おこな]った。"
  7: "ボアズは食[た]べて飲[の]み、心[こころ]が楽[たの]しくなると、麦[むぎ]わらの山[やま]のそばに行って寝[ね]た。彼女[かのじょ]はそっと来[き]て、彼の足[あし]もとの覆[おお]いをはがした。"
  8: "真夜中[まよなか]になって、その男[おとこ]は驚[おどろ]き、心[こころ]が乱[みだ]れた。見[み]ると、女[おんな]が彼の足[あし]もとに寝[ね]ている。"
  9: "彼[かれ]は言[い]った。「あなたはだれか。」彼女[かのじょ]は言った。「わたしはあなたの婢[はしため]ルツだ。どうか、衣[ころも]の裾[すそ]を婢の上[うえ]に広[ひろ]げてほしい。あなたは親族[しんぞく]の買[か]い戻[もど]し人[びと]だから。」"
  10: "ボアズは言[い]った。「娘[むすめ]よ、あなたは主[しゅ]なる神[かみ]に祝福[しゅくふく]されている。あなたは最初[さいしょ]の恵[めぐ]みよりも、この最後[さいご]の恵みを大[おお]きくした。貧[まず]しい者[もの]にも富[とみ]ある者にも、若[わか]い男[おとこ]たちの後[あと]を追[お]わなかったからだ。"
  11: "今[いま]、娘[むすめ]よ、恐[おそ]れるな。あなたが言[い]うことは何[なん]でもしてあげよう。わたしの民[たみ]のすべての部族[ぶぞく]が、あなたが力[ちから]ある女[おんな]であることを知[し]っているからだ。"
  12: "確[たし]かに、わたしは親族[しんぞく]の買[か]い戻[もど]し人[びと]だ。しかし、わたしよりも近[ちか]い買い戻し人がいる。"
  13: "今夜[こんや]はここに泊[と]まりなさい。朝[あさ]になったら、彼があなたを買い戻すなら、それでよい。買い戻してもらうがよい。もし彼があなたを買い戻すことを望[のぞ]まないなら、わたしが買い戻そう。主[しゅ]は生[い]きておられる。朝まで寝なさい。」"
  14: "彼女[かのじょ]は朝[あさ]まで彼の足[あし]もとに寝[ね]ていた。まだ人[ひと]が互[たが]いに見分[みわ]けられないうちに、彼女は起[お]きた。ボアズは言った。「女[おんな]が脱穀場[だっこくじょう]に来[き]たことが知[し]られてはならない。」"
  15: "彼[かれ]は彼女[かのじょ]に言[い]った。「身[み]に着[き]けている上着[うわぎ]を持[も]って来[き]なさい。」彼女がそれを持[も]つと、彼は大麦[おおむぎ]を六[むっ]つ分[ぶん]量[はか]って、彼女の上[うえ]に載[の]せた。そして、町[まち]へ入[はい]って行[い]った。"
  16: "ルツがしゅうとめのところへ入[はい]って行[い]くと、しゅうとめは言[い]った。「どうしたのか、娘[むすめ]よ。」ルツは、あの人[ひと]が自分[じぶん]にしてくれたすべてを話[はな]した。"
  17: "そして言[い]った。「この六[むっ]つの大麦[おおむぎ]をわたしに下[くだ]さった。『しゅうとめのところへ、空[から]の手[て]で帰[かえ]ってはならない』とおっしゃったからだ。」"
  18: "ナオミは言[い]った。「娘[むすめ]よ、ことがどう決着[けっちゃく]するか分[わ]かるまで、ここに座[すわ]っていなさい。あの人[ひと]は、今日[きょう]のうちにことを片付[かたづ]けるまでは、きっと落[お]ち着[つ]かないから。」"

notes:
  1: "οὐ μὴ ζητήσω σοι ἀνάπαυσιν — «не поищу ли я тебе покоя» (οὐ μή + conj. — решительное утверждение). εὖ γένηταί σοι — чтобы тебе было хорошо."
  2: "οὐχὶ Βοος γνώριμος ἡμῶν — «не Боаз ли знакомый наш»; γνώριμος здесь уже о родственнике (ср. 2:1; 2:20). λικμᾷ τὸν ἅλωνα — веет гумно (λικμάω), т. е. провеивает ячмень."
  3: "λούσῃ καὶ ἀλείψῃ — омоешься и умастишься. περιθήσεις τὸν ἱματισμόν — наденешь одежду (в csl «ризы светлыя»). ἕως οὗ συντελέσαι … πιεῖν καὶ φαγεῖν — пока он не кончит есть и пить."
  4: "ἀποκαλύψεις τὰ πρὸς ποδῶν αὐτοῦ — откроешь то, что у ног его (снимешь покрывало). ἀπαγγελεῖ σοι ἃ ποιήσεις — он скажет тебе, что делать."
  5: "Πάντα, ὅσα ἐὰν εἴπῃς, ποιήσω — «всё, что скажешь, сделаю»; речь — 常体, как по всему корпусу."
  6: "κατέβη εἰς τὸν ἅλω — сошла на гумно (гумно обычно ниже города). ἐνετείλατο — заповедала."
  7: "ἠγαθύνθη ἡ καρδία αὐτοῦ — «сердце его стало благим», т. е. развеселилось. ἐν μερίδι τῆς στοιβῆς — у части соломы, т. е. подле скирда. κρυφῇ — тайно. В csl добавлено «и легла» — в греческом этого нет."
  8: "μεσονύκτιον — полночь. ἐξέστη — пришёл в изумление; ἐταράχθη — смутился, пришёл в смятение."
  9: "πτερύγιον τοῦ ἱματίου — «крыло одежды», край, пола; простереть её над рабыней — символ брачного покрова (ср. Иез 16:8). ἀγχιστεύς — 親族の買い戻し人."
  10: "ἠγάθυνας τὸ ἔλεός σου τὸ ἔσχατον ὑπὲρ τὸ πρῶτον — «сделала последнюю милость лучше первой» (ἀγαθύνω). νεανίαι — юноши; εἴτοι … εἴτοι — «будь то… будь то…»."
  11: "γυνὴ δυνάμεως — «жена силы», т. е. женщина твёрдого, достойного нрава (слав. «жена силы»). πᾶσα φυλὴ λαοῦ μου — всё племя народа моего."
  12: "ἀγχιστεὺς ἐγγίων ὑπὲρ ἐμέ — выкупающий ближе меня (ἐγγίων — сравн. от ἐγγύς)."
  13: "αὐλίσθητι τὴν νύκτα — переночуй ночь. ἐὰν ἀγχιστεύσῃ σε — если он выкупит тебя (возьмёт в жёны). ζῇ κύριος — жив Господь (клятва)."
  14: "πρὸ τοῦ ἐπιγνῶναι ἄνδρα τὸν πλησίον αὐτοῦ — прежде чем один человек узнает другого, т. е. в темноте. Μὴ γνωσθήτω — да не будет известно."
  15: "περίζωμα — верхняя одежда, передник. ἐμέτρησεν ἓξ κριθῶν — отмерил шесть [мер] ячменя (мера не названа). εἰσῆλθεν εἰς τὴν πόλιν — подлежащее не названо: вошёл Боаз или Руфь; оставлено без подлежащего."
  16: "Τίς εἶ, θύγατερ; — букв. «кто ты, дочь?», идиоматически «что [с тобой]?» (слав. «что есть, дщи?»)."
  17: "Τὰ ἓξ τῶν κριθῶν ταῦτα — «эти шесть [мер] ячменя». Μὴ εἰσέλθῃς κενή — не войди с пустыми руками (κενός)."
  18: "Κάθου — сиди, оставайся. ἕως τοῦ ἐπιγνῶναί σε πῶς οὐ πεσεῖται ῥῆμα — пока не узнаешь, как не падёт слово, т. е. чем кончится дело. οὐ μὴ ἡσυχάσῃ — не успокоится (ἡσυχάζω)."
