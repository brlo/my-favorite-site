# jp-box, Деяния апостолов, глава 8. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 8: гонение и рассеяние (1–4), проповедь в Самарии (5–13),
# Пётр и Иоанн в Самарии, Симон (14–24), возвращение (25),
# Филипп и эфиопский евнух (26–40).
# Красного в главе нет: Христос здесь не говорит; слова ангела (8:26),
# Духа (8:29), Петра, Симона и евнуха — не красные.
# 〔…〕: 8:37 — стиха нет в критической базе ('.'), он целиком в 〔…〕;
# 8:39 — в 〔…〕 церковное добавление о сошествии Духа на евнуха.
# jp-ni не использовался.

