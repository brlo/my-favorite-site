verses:
  1: "サウロは、彼[かれ]が殺[ころ]されることに賛成[さんせい]していた。その日[ひ]、エルサレムの教会[きょうかい]に大[おお]きな迫害[はくがい]が起[おこ]り、使徒[しと]たちのほかは皆[みな]、ユダヤとサマリアの各地[かくち]に散[ち]って行[い]った。"
  2: "敬虔[けいけん]な人々[ひとびと]がステファノを葬[ほうむ]り、彼[かれ]のために大[おお]きな嘆[なげ]きの声[こえ]をあげた。"
  3: "サウロは教会[きょうかい]を荒[あら]し回[まわ]り、家[いえ]から家[いえ]へと入[はい]って行[い]き、男[おとこ]も女[おんな]も引[ひ]きずり出[だ]して牢[ろう]に引[ひ]き渡[わた]した。"
  4: "散[ち]って行[い]った人々[ひとびと]は、各地[かくち]を巡[めぐ]って言葉[ことば]を福音[ふくいん]として告[つ]げ知[し]らせた。"
  5: "ピリポはサマリアの町[まち]に下[くだ]って行[い]き、人々[ひとびと]にキリストを宣[の]べ伝[つた]えた。"
  6: "群衆[ぐんしゅう]は、ピリポが語[かた]ることを聞[き]き、また彼[かれ]が行[おこな]うしるしを見[み]て、心[こころ]を一[ひと]つにして彼[かれ]の話[はなし]に聞[き]き入[い]った。"
  7: "汚[けが]れた霊[れい]に取[と]りつかれた多[おお]くの人[ひと]から、その霊[れい]が大声[おおごえ]をあげて出[で]て行[い]き、体[からだ]の麻痺[まひ]した人[ひと]や足[あし]の不自由[ふじゆう]な人[ひと]も多[おお]くいやされたからである。"
  8: "その町[まち]には大[おお]きな喜[よろこ]びがあった。"
  9: "その町[まち]には前[まえ]から、サマリア人[びと]シモンという名[な]の男[おとこ]がいて、魔術[まじゅつ]を行[おこな]ってサマリアの民[たみ]を驚[おどろ]かせ、自分[じぶん]は大[おお]きな者[もの]であると言[い]っていた。"
  10: "小[ちい]さな者[もの]から大[おお]きな者[もの]まで、皆[みな]が彼[かれ]に聞[き]き入[い]って言[い]った。「この人[ひと]こそ、いわゆる『神[かみ]の大[おお]いなる力[ちから]』である。」"
  11: "彼[かれ]らが聞[き]き入[い]ったのは、彼[かれ]が長[なが]い間[あいだ]、魔術[まじゅつ]で彼[かれ]らを驚[おどろ]かせていたからである。"
  12: "しかし、ピリポが神[かみ]の国[くに]とイエス・キリストの名[な]について福音[ふくいん]を告[つ]げ知[し]らせると、彼[かれ]らはこれを信[しん]じ、男[おとこ]も女[おんな]も洗礼[せんれい]を受[う]けた。"
  13: "シモン自身[じしん]も信[しん]じて洗礼[せんれい]を受[う]け、いつもピリポとともにいた。そして、行[おこな]われる大[おお]きなしるしと力[ちから]あるわざを見[み]て驚[おどろ]いていた。"
  14: "エルサレムにいる使徒[しと]たちは、サマリアが神[かみ]の言葉[ことば]を受[う]け入[い]れたと聞[き]いて、ペトロとヨハネを彼[かれ]らのもとへ遣[つか]わした。"
  15: "二人[ふたり]は下[くだ]って行[い]き、彼[かれ]らが{聖霊[せいれい]|聖神[せいしん]}を受[う]けるようにと祈[いの]った。"
  16: "まだ{聖霊[せいれい]|聖神[せいしん]}が彼[かれ]らのだれにも下[くだ]っていなかったからである。彼[かれ]らはただ、主[しゅ]イエスの名[な]によって洗礼[せんれい]を受[う]けていただけだった。"
  17: "そこで二人[ふたり]が彼[かれ]らの上[うえ]に手[て]を置[お]くと、彼[かれ]らは{聖霊[せいれい]|聖神[せいしん]}を受[う]けた。"
  18: "シモンは、使徒[しと]たちが手[て]を置[お]くことによって{聖霊[せいれい]|聖神[せいしん]}が授[さず]けられるのを見[み]て、彼[かれ]らに金[かね]を差[さ]し出[だ]し、"
  19: "言[い]った。「わたしにもその権[けん]をください。わたしが手[て]を置[お]いた人[ひと]が{聖霊[せいれい]|聖神[せいしん]}を受[う]けられるように。」"
  20: "ペトロは彼[かれ]に言[い]った。「あなたの銀[ぎん]は、あなたとともに滅[ほろ]びるがよい。あなたは神[かみ]の賜[たま]い物[もの]を金[かね]で手[て]に入[い]れられると考[かんが]えたからである。"
  21: "あなたには、この事[こと]に何[なん]の分[ぶん]も、何[なん]の受[う]け持[も]ち分[ぶん]もない。あなたの心[こころ]は神[かみ]の前[まえ]に正[ただ]しくないからである。"
  22: "だから、この悪[あく]を悔[く]い改[あらた]めて主[しゅ]に祈[いの]りなさい。もしかすると、あなたの心[こころ]に抱[いだ]いた思[おも]いは赦[ゆる]されるかもしれない。"
  23: "あなたが苦[にが]い胆汁[たんじゅう]の中[なか]にあり、不義[ふぎ]の縄[なわ]に縛[しば]られているのを、わたしは見[み]ている。」"
  24: "シモンは答[こた]えて言[い]った。「わたしのために主[しゅ]に祈[いの]ってください。あなたがたが言[い]ったことのどれも、わたしに降[ふ]りかかりませんように。」"
  25: "彼[かれ]らは主[しゅ]の言葉[ことば]を証[あかし]し、これを告[つ]げ知[し]らせてから、エルサレムへ帰[かえ]って行[い]った。その途中[とちゅう]、サマリアの多[おお]くの村[むら]で福音[ふくいん]を告[つ]げ知[し]らせた。"
  26: "さて、主[しゅ]の天使[てんし]がピリポに語[かた]って言[い]った。「立[た]ち上[あ]がって南[みなみ]へ行[い]き、エルサレムからガザへ下[くだ]る道[みち]に出[で]なさい。」その道[みち]は荒野[こうや]であった。"
  27: "彼[かれ]は立[た]ち上[あ]がって出[で]かけた。すると、エチオピアの宦官[かんがん]で、女王[じょおう]カンダケの全財産[ぜんざいさん]を預[あず]かる高官[こうかん]が、礼拝[れいはい]のためにエルサレムへ来[き]て、"
  28: "帰[かえ]る途中[とちゅう]、自分[じぶん]の車[くるま]に座[すわ]って預言者[よげんしゃ]イザヤの書[しょ]を読[よ]んでいた。"
  29: "霊[れい]がピリポに言[い]った。「近[ちか]づいて、あの車[くるま]に並[なら]んで歩[ある]きなさい。」"
  30: "ピリポは駆[か]け寄[よ]って、彼[かれ]が預言者[よげんしゃ]イザヤの書[しょ]を読[よ]んでいるのを聞[き]き、言[い]った。「あなたは読[よ]んでいることが分[わ]かりますか。」"
  31: "彼[かれ]は言[い]った。「だれかが導[みちび]いてくれなければ、どうして分[わ]かるでしょうか。」そして、ピリポに車[くるま]に上[のぼ]って一緒[いっしょ]に座[すわ]るように頼[たの]んだ。"
  32: "彼[かれ]が読[よ]んでいた聖書[せいしょ]の箇所[かしょ]は、次[つぎ]のとおりであった。『彼[かれ]は羊[ひつじ]のように屠[ほふ]り場[じょう]へ引[ひ]かれて行[い]き、毛[け]を刈[か]る者[もの]の前[まえ]の子羊[こひつじ]のように、声[こえ]も立[た]てず、口[くち]を開[ひら]かなかった。"
  33: "へりくだりの中[なか]で、彼[かれ]の裁[さば]きは取[と]り去[さ]られた。だれが彼[かれ]の世代[せだい]を語[かた]り明[あ]かすだろうか。彼[かれ]のいのちは地[ち]から取[と]り去[さ]られるからである。』"
  34: "宦官[かんがん]はピリポに言[い]った。「お願[ねが]いします。預言者[よげんしゃ]はだれのことを言[い]っているのですか。自分[じぶん]のことですか、それともほかの人[ひと]のことですか。」"
  35: "ピリポは口[くち]を開[ひら]き、この聖書[せいしょ]の箇所[かしょ]から始[はじ]めて、イエスのことを彼[かれ]に告[つ]げ知[し]らせた。"
  36: "道[みち]を進[すす]むうちに、水[みず]のある所[ところ]に来[き]た。宦官[かんがん]が言[い]った。「見[み]てください。水[みず]があります。わたしが洗礼[せんれい]を受[う]けるのに、何[なに]の妨[さまた]げがあるでしょうか。」"
  37: "〔ピリポが言[い]った。「もし心[こころ]から信[しん]じるなら、受[う]けられます。」宦官[かんがん]は答[こた]えて言[い]った。「わたしは、イエス・キリストが神[かみ]の子[こ]であると信[しん]じます。」〕"
  38: "そして、車[くるま]を止[と]めるように命[めい]じた。ピリポも宦官[かんがん]も二人[ふたり]とも水[みず]の中[なか]に下[くだ]り、ピリポは彼[かれ]に洗礼[せんれい]を授[さず]けた。"
  39: "二人[ふたり]が水[みず]から上[あ]がると、〔{聖霊[せいれい]|聖神[せいしん]}が宦官[かんがん]の上[うえ]に降[くだ]り、〕主[しゅ]の天使[てんし]がピリポを捕[と]らえて連[つ]れ去[さ]った。宦官[かんがん]はもはや彼[かれ]を見[み]ることができず、喜[よろこ]びながら自分[じぶん]の道[みち]を進[すす]んだ。"
  40: "ピリポはアゾトに現[あらわ]れ、そこからすべての町[まち]を巡[めぐ]って福音[ふくいん]を告[つ]げ知[し]らせ、ついにカイサリアに至[いた]った。"

notes:
  1: "συνευδοκῶν — «одобряя»; 賛成していた. ἐκκλησία — 教会; далее в книге это слово встречается в 8:3, 9:31 и т. д."
  2: "κοπετὸν μέγαν — 大きな嘆きの声."
  3: "ἐλυμαίνετο — «терзал, опустошал»; 荒し回り. σύρων — 引きずり出して."
  5: "В критической базе [τὴν] πόλιν τῆς Σαμαρείας — サマリアの町."
  9: "προϋπῆρχεν — «был прежде»; 前から. μαγεύων — 魔術を行って."
  10: "ἡ δύναμις τοῦ θεοῦ ἡ καλουμένη Μεγάλη — «сила Божия, называемая Великою»; いわゆる「神の大いなる力」."
  12: "εὐαγγελιζομένῳ περὶ τῆς βασιλείας τοῦ θεοῦ — 神の国…について福音を告げ知らせると."
  16: "βεβαπτισμένοι… εἰς τὸ ὄνομα τοῦ κυρίου Ἰησοῦ — 主イエスの名によって洗礼を受けていた."
  23: "χολὴν πικρίας καὶ σύνδεσμον ἀδικίας — 苦い胆汁と不義の縄."
  26: "κατὰ μεσημβρίαν — «на полдень», то есть на юг; 南へ. Αὕτη ἐστὶν ἔρημος — その道は荒野であった."
  27: "εὐνοῦχος δυνάστης Κανδάκης — 宦官・高官; γάζα — сокровищница, 全財産. Кандаке — титул цариц, передан именем, как в греч."
  31: "ὁδηγήσει — «наставит»; 導いてくれなければ."
  37: "В критической базе стиха нет ('.'); церковный текст (Елизаветинская «если веруешь от всего сердца…», jp-joc) его читает, поэтому стих целиком в 〔…〕. Ст. 38 не присоединён. Это слова Филиппа и евнуха — не красные."
  39: "В критической базе только πνεῦμα κυρίου ἥρπασεν τὸν Φίλιππον («Дух Господень восхитил Филиппа»); церковный текст (Елизаветинская «Дух Святый нападе на каженика, Ангел же Господень восхити Филиппа», jp-joc) добавляет сошествие Духа на евнуха — 〔聖霊が宦官の上に降り、〕; вместо πνεῦμα κυρίου церковный текст читает ἄγγελος κυρίου — 主の天使, замена без 〔〕 (ср. 6:8)."
  40: "Ἄζωτος — アゾト; Καισάρεια — カイサリア."
