# jp-box, Откровение Иоанна, глава 2. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 2: четыре письма Христа — Ефесу (1–7), Смирне (8–11), Пергаму (12–17),
# Фиатире (18–29).
# Красное <j> — вся прямая речь Христа, 2:1–29, включая «знаю дела твои»,
# обетования и «имеющий ухо да слышит». Каждое письмо — своя цитата 「…」.
# Вложенные цитаты Писания — 『…』: 2:23 (Иер 17:10), 2:27 (Пс 2:9).
# 〔…〕: 2:9 и 2:13 — церковное τὰ ἔργα σου (в базе «знаю, где ты живёшь», без «дел»);
# 2:15 — церковное ὃ μισῶ. Проверено запросом к gr-lxx-byz: ἔργα и μισῶ в этих стихах — НЕТ.
# Сносок ⟨…⟩ нет: 燭台, 命の木, ニコライ派 уже встречались в корпусе. jp-ni не использовался.

