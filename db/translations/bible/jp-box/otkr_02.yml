verses:
  1: "「<j>エフェソにある教会[きょうかい]の天使[てんし]に書[か]きなさい。右手[みぎて]に七[なな]つの星[ほし]を持[も]ち、七[なな]つの金[きん]の燭台[しょくだい]の間[あいだ]を歩[あゆ]む者[もの]が、こう言[い]われる。</j>"
  2: "<j>わたしは、あなたの行[おこな]いと労苦[ろうく]と忍耐[にんたい]を知[し]っている。また、あなたが悪[わる]い者[もの]たちを我慢[がまん]できず、自分[じぶん]を使徒[しと]と名乗[なの]る者[もの]たちを試[ため]して、彼[かれ]らが偽[にせ]であることを見[み]いだしたことも知っている。</j>"
  3: "<j>あなたは忍耐[にんたい]を持[も]ち、わたしの名[な]のために耐[た]え忍[しの]んで、疲[つか]れ果[は]てなかった。</j>"
  4: "<j>しかし、あなたに対[たい]して言[い]うべきことがある。あなたが初[はじめ]の愛[あい]を捨[す]てたことである。</j>"
  5: "<j>だから、どこから落[お]ちたかを思[おも]い起[おこ]し、悔[く]い改[あらた]めて、初[はじめ]の行[おこな]いをしなさい。そうしなければ、わたしはあなたのところへ行[い]き、あなたが悔い改めないなら、あなたの燭台[しょくだい]をその場所[ばしょ]から移[うつ]す。</j>"
  6: "<j>しかし、あなたには取[と]り柄[え]がある。あなたがニコライ派[は]の行[おこな]いを憎[にく]んでいることである。わたしもそれを憎んでいる。</j>"
  7: "<j>耳[みみ]のある者[もの]は、霊[れい]が教会[きょうかい]たちに言[い]うことを聞[き]くがよい。勝[か]つ者[もの]には、わたしは神[かみ]の楽園[らくえん]にある命[いのち]の木[き]から食[た]べさせよう。</j>」"
  8: "「<j>スミルナにある教会[きょうかい]の天使[てんし]に書[か]きなさい。最初[さいしょ]の者[もの]であり、最後[さいご]の者[もの]である方[かた]、死[し]んだことがあり、また生[い]き返[かえ]った方[かた]が、こう言[い]われる。</j>"
  9: "<j>わたしはあなたの〔働[はたら]きと〕患難[かんなん]と貧[まず]しさを知[し]っている。しかし、あなたは富[とみ]んでいる。また、自分[じぶん]をユダヤ人[じん]と言[い]いながら、実[じつ]はそうではなく、サタンの会堂[かいどう]に属[ぞく]する者[もの]たちによる冒涜[ぼうとく]をも知っている。</j>"
  10: "<j>あなたが受[う]けることになっている苦[くる]しみを、何[なに]も恐[おそ]れるな。見[み]よ、悪魔[あくま]はあなたがたのうちの何人[なんにん]かを獄[ひとや]に入[い]れて、あなたがたを試[ため]そうとしている。あなたがたは十[とお]日[か]の間[あいだ]、患難[かんなん]を受[う]ける。死[し]に至[いた]るまで忠実[ちゅうじつ]でありなさい。そうすれば、わたしはあなたに命[いのち]の冠[かんむり]を与[あた]える。</j>"
  11: "<j>耳[みみ]のある者[もの]は、霊[れい]が教会[きょうかい]たちに言[い]うことを聞[き]くがよい。勝[か]つ者[もの]は、第二[だいに]の死[し]によって害[がい]を受[う]けることがない。</j>」"
  12: "「<j>ペルガモンにある教会[きょうかい]の天使[てんし]に書[か]きなさい。両刃[もりは]の鋭[するど]い剣[つるぎ]を持[も]つ方[かた]が、こう言[い]われる。</j>"
  13: "<j>わたしはあなたの〔働[はたら]きと〕、あなたがどこに住[す]んでいるかを知[し]っている。そこにはサタンの御座[みくら]がある。そして、あなたはわたしの名[な]を堅[かた]く保[たも]ち、わたしの忠実[ちゅうじつ]な証人[しょうにん]アンティパスが、あなたがたの間[あいだ]、サタンが住[す]む所[ところ]で殺[ころ]された日[ひ]にも、わたしへの信仰[しんこう]を否[いな]まなかった。</j>"
  14: "<j>しかし、あなたに対[たい]して少[すこ]しばかり言[い]うべきことがある。あなたのところに、バラムの教[おし]えを堅[かた]く保[たも]つ者[もの]たちがいる。バラムは、バラクに教[おし]えて、イスラエルの子[こ]らの前[まえ]に躓[つまず]きの石[いし]を置[お]き、偶像[ぐうぞう]に供[そな]えた物[もの]を食[た]べさせ、淫行[いんこう]を行[おこな]わせた者である。</j>"
  15: "<j>同じように、あなたにも、ニコライ派[は]の教[おし]えを堅[かた]く保[たも]つ者[もの]たちがいる。〔わたしはそれを憎[にく]む。〕</j>"
  16: "<j>だから、悔[く]い改[あらた]めなさい。そうしなければ、わたしはすぐにあなたのところへ行[い]き、わたしの口[くち]の剣[つるぎ]で彼[かれ]らと戦[たたか]う。</j>"
  17: "<j>耳[みみ]のある者[もの]は、霊[れい]が教会[きょうかい]たちに言[い]うことを聞[き]くがよい。勝[か]つ者[もの]には、わたしは隠[かく]されたマナを与[あた]え、また白[しろ]い石[いし]を与[あた]える。その石の上[うえ]には、新[あたら]しい名[な]が書[か]かれていて、それを受[う]け取[と]る者[もの]のほかには、だれもその名を知[し]らない。</j>」"
  18: "「<j>ティアティラにある教会[きょうかい]の天使[てんし]に書[か]きなさい。目[め]が火[ひ]の炎[ほのお]のようであり、足[あし]が真鍮[しんちゅう]のような神[かみ]の子[こ]が、こう言[い]われる。</j>"
  19: "<j>わたしは、あなたの行[おこな]いと愛[あい]と信仰[しんこう]と奉仕[ほうし]と忍耐[にんたい]とを知[し]っている。また、あなたの後[のち]の行[おこな]いが初[はじめ]の行[おこな]いよりも多[おお]いことを知っている。</j>"
  20: "<j>しかし、あなたに対[たい]して言[い]うべきことがある。あなたは、自分[じぶん]を預言者[よげんしゃ]と名乗[なの]る女[おんな]イゼベルをそのままにしている。彼女[かのじょ]は、わたしの僕[しもべ]たちを教[おし]え、惑[まど]わして、淫行[いんこう]を行[おこな]わせ、偶像[ぐうぞう]に供[そな]えた物[もの]を食[た]べさせている。</j>"
  21: "<j>わたしは彼女[かのじょ]に悔[く]い改[あらた]める時[とき]を与[あた]えたが、彼女はその淫行[いんこう]から悔い改めようとしない。</j>"
  22: "<j>見[み]よ、わたしは彼女[かのじょ]を病[やまい]の床[とこ]に投[な]げ、彼女と姦淫[かんいん]を犯[おか]す者[もの]たちも、彼女の行[おこな]いから悔い改めないなら、大[おお]きな患難[かんなん]に投げる。</j>"
  23: "<j>また、彼女[かのじょ]の子[こ]どもたちを死[し]に打[う]ち殺[ころ]す。すると、すべての教会[きょうかい]は、わたしが心[こころ]と内臓[ないぞう]を探[さぐ]る者[もの]であると知[し]るようになる。そして、わたしはあなたがた一人[ひとり]一人[ひとり]に、その行[おこな]いに応[おう]じて報[むく]いる。</j>"
  24: "<j>しかし、ティアティラにいるほかの者[もの]たち、この教[おし]えを受[う]け入[い]れず、いわゆるサタンの深[ふか]い事[こと]がらを知[し]らないあなたがたに言[い]う。わたしはあなたがたに、ほかの荷[に]を負[お]わせない。</j>"
  25: "<j>ただ、あなたがたが持[も]っているものを、わたしが来[く]るまで堅[かた]く保[たも]ちなさい。</j>"
  26: "<j>勝[か]ち得[え]て、終[おわ]りまでわたしの行[おこな]いを守[まも]る者[もの]には、わたしは諸国民[しょこくみん]の上[うえ]に権威[けんい]を与[あた]える。</j>"
  27: "<j>彼[かれ]は鉄[てつ]の杖[つえ]で彼[かれ]らを牧[ぼく]し、彼らは陶器[とうき]のように砕[くだ]かれる。</j>"
  28: "<j>わたしが父[ちち]から受[う]け取[と]ったとおりに、わたしは彼[かれ]に曙[あけぼの]の星[ほし]を与[あた]える。</j>"
  29: "<j>耳[みみ]のある者[もの]は、霊[れい]が教会[きょうかい]たちに言[い]うことを聞[き]くがよい。</j>」"

notes:
  1: "Τῷ ἀγγέλῳ τῆς ἐν Ἐφέσῳ ἐκκλησίας γράψον — エフェソにある教会の天使に書きなさい. Τάδε λέγει — こう言われる (формула пророческой речи). ὁ κρατῶν τοὺς ἑπτὰ ἀστέρας — 七つの星を持つ者. ὁ περιπατῶν ἐν μέσῳ τῶν ἑπτὰ λυχνιῶν — 七つの燭台の間を歩む者."
  2: "Οἶδα — 知っている. τὸν κόπον — 労苦. τὴν ὑπομονήν — 忍耐. οὐ δύνῃ βαστάσαι κακούς — 悪い者たちを我慢できず. ἐπείρασας — 試して. ψευδεῖς — 偽."
  3: "ἐβάστασας — 耐え忍んで. διὰ τὸ ὄνομά μου — わたしの名のために. οὐ κεκοπίακες — 疲れ果てなかった."
  4: "ἔχω κατὰ σοῦ — あなたに対して言うべきことがある. τὴν ἀγάπην σου τὴν πρώτην ἀφῆκες — 初めの愛を捨てた."
  5: "μνημόνευε — 思い起こし. πόθεν πέπτωκας — どこから落ちたか. μετανόησον — 悔い改めて. τὰ πρῶτα ἔργα ποίησον — 初めの行いをしなさい. κινήσω τὴν λυχνίαν σου — 燭台を移す."
  6: "τοῦτο ἔχεις — 取り柄がある. μισεῖς — 憎んでいる. τὰ ἔργα τῶν Νικολαϊτῶν — ニコライ派の行い. ἃ κἀγὼ μισῶ — わたしもそれを憎む."
  7: "ὁ ἔχων οὖς ἀκουσάτω — 耳のある者は聞くがよい. τὸ πνεῦμα — 霊 (без ἅγιον, поэтому 霊[れい], без пары). τῷ νικῶντι — 勝つ者に. ξύλον τῆς ζωῆς — 命の木. παράδεισος τοῦ θεοῦ — 神の楽園."
  8: "ὁ πρῶτος καὶ ὁ ἔσχατος — 最初の者であり、最後の者である. ὃς ἐγένετο νεκρὸς καὶ ἔζησεν — 死んだことがあり、また生き返った方."
  9: "В базе Οἶδά σου τὴν θλῖψιν, без «дел»; церковный текст (Синодальный «вем твоя дела», jp-joc 「爾の所為」) добавляет τὰ ἔργα σου — 〔働きと〕. Проверено: ἔργα в стихе — НЕТ. πτωχεία — 貧しさ. πλούσιος εἶ — 富んでいる. βλασφημία — 冒涜. συναγωγὴ τοῦ Σατανᾶ — サタンの会堂."
  10: "μηδὲν φοβοῦ — 何も恐れるな. βάλλειν εἰς φυλακήν — 獄に入れる. ἵνα πειρασθῆτε — 試されるため. ἡμερῶν δέκα — 十日間. γίνου πιστὸς ἄχρι θανάτου — 死に至るまで忠実でありなさい. στέφανος τῆς ζωῆς — 命の冠."
  11: "ὁ νικῶν — 勝つ者. οὐ μὴ ἀδικηθῇ ἐκ τοῦ θανάτου τοῦ δευτέρου — 第二の死によって害を受けることがない (усиленное отрицание сохранено)."
  12: "ῥομφαία δίστομος ὀξεῖα — 両刃の鋭い剣."
  13: "В базе Οἶδα ποῦ κατοικεῖς, без «дел»; церковный текст (Синодальный «вем твоя дела», jp-joc 「爾の所為」) добавляет τὰ ἔργα σου — 〔働きと〕. Проверено: ἔργα — НЕТ. θρόνος τοῦ Σατανᾶ — サタンの御座. Ἀντιπᾶς — アンティパス. οὐκ ἠρνήσω τὴν πίστιν μου — わたしへの信仰を否まなかった."
  14: "ἔχω κατὰ σοῦ ὀλίγα — 少しばかり言うべきことがある. διδαχὴ Βαλαάμ — バラムの教え. Βαλάκ — バラク. βαλεῖν σκάνδαλον — 躓きの石を置く. εἰδωλόθυτα — 偶像に供えた物. πορνεῦσαι — 淫行を行う."
  15: "В базе οὕτως ἔχεις… Νικολαϊτῶν ὁμοίως, без ὃ μισῶ; церковный текст (Синодальный «еже ненавижду», jp-joc 「我が惡む所の者」) добавляет — 〔わたしはそれを憎む〕. Проверено: μισῶ в стихе — НЕТ."
  16: "μετανόησον — 悔い改めなさい. πολεμήσω μετ᾽ αὐτῶν — 彼らと戦う. ἐν τῇ ῥομφαίᾳ τοῦ στόματός μου — わたしの口の剣で."
  17: "μάννα τοῦ κεκρυμμένου — 隠されたマナ. ψῆφον λευκήν — 白い石. ὄνομα καινὸν γεγραμμένον — 新しい名が書かれている. ὃ οὐδεὶς οἶδεν εἰ μὴ ὁ λαμβάνων — 受け取る者のほかには、だれも知らない."
  18: "ὁ υἱὸς τοῦ θεοῦ — 神の子. ὀφθαλμοὺς ὡς φλόγα πυρός — 目が火の炎のよう. χαλκολίβανον — 真鍮."
  19: "τὴν διακονίαν — 奉仕. τὰ ἔργα σου τὰ ἔσχατα πλείονά τῶν πρώτων — 後の行いが初めの行いよりも多い."
  20: "ἀφεῖς τὴν γυναῖκα Ἰεζάβελ — 女イゼベルをそのままにしている. ἑαυτὴν προφῆτιν — 自分を預言者と名乗る. πλανᾷ — 惑わす. τοὺς ἐμοὺς δούλους — わたしの僕たち."
  21: "ἔδωκα αὐτῇ χρόνον — 悔い改める時を与えた. οὐ θέλει μετανοῆσαι — 悔い改めようとしない."
  22: "βάλλω αὐτὴν εἰς κλίνην — 病の床に投げる (κλίνη — ложе; здесь, вероятно, ложе болезни). μοιχεύοντας μετ᾽ αὐτῆς — 彼女と姦淫を犯す者たち. ἐὰν μὴ μετανοήσωσιν — 悔い改めないなら."
  23: "ἀποκτενῶ ἐν θανάτῳ — 死に打ち殺す. ἐραυνῶν νεφροὺς καὶ καρδίας — 心と内臓を探る者 (Иер 17:10 — аллюзия в речи Христа, без кавычек, как 1:17). δώσω ἑκάστῳ κατὰ τὰ ἔργα — 一人一人に、その行いに応じて報いる."
  24: "τοῖς λοιποῖς τοῖς ἐν Θυατίροις — ティアティラにいるほかの者たち. τὰ βαθέα τοῦ Σατανᾶ — サタンの深い事がら. ὡς λέγουσιν — いわゆる. ἄλλο βάρος — ほかの荷."
  25: "ὃ ἔχετε κρατήσατε — 持っているものを堅く保ちなさい. ἄχρις οὗ ἂν ἥξω — わたしが来るまで."
  26: "ὁ νικῶν καὶ ὁ τηρῶν ἄχρι τέλους τὰ ἔργα μου — 勝ち得て、終わりまでわたしの行いを守る者. ἐξουσίαν ἐπὶ τῶν ἐθνῶν — 諸国民の上に権威."
  27: "ποιμανεῖ ἐν ῥάβδῳ σιδηρᾷ — 鉄の杖で牧する (Пс 2:9 — аллюзия в речи Христа, без кавычек, как 1:17). σκεύη κεραμικά — 陶器. συντρίβεται — 砕かれる (страдательный залог сохранён). ὡς κἀγὼ εἴληφα — «как и Я получил»: в базе это начало 2:28, поэтому わたしが父から受け取ったとおりに отнесено к 28 ст."
  28: "ὡς κἀγὼ εἴληφα παρὰ τοῦ πατρός μου — わたしが父から受け取ったとおりに. ἀστὴρ ὁ πρωϊνός — 曙の星 (ср. 22:16)."
  29: "ὁ ἔχων οὖς ἀκουσάτω — 耳のある者は聞くがよい. τὸ πνεῦμα — 霊 (без ἅγιον)."
