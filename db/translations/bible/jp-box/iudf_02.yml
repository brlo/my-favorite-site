verses:
  1: "第十八年[だいじゅうはちねん]の第一月[だいいちがつ]の二十二日[にじゅうににち]、アッシリアの王[おう]ネブカドネツァルの家[いえ]で、彼が語[かた]ったとおりに全[すべ]ての地[ち]に復讐[ふくしゅう]するという言葉[ことば]が起[お]こった。"
  2: "彼は自分のすべての僕[しもべ]とすべての貴人[きじん]を呼[よ]び集[あつ]め、自分の計[はか]りの秘密[ひみつ]を彼らと分[わ]かち、自分の口[くち]から、その地[ち]に対するすべての悪[あく]を言[い]い終[お]えた。"
  3: "そして彼らは、彼の口[くち]の言葉[ことば]に従[したが]わなかったすべての肉[にく]を滅[ほろ]ぼすことを決[けっ]した。"
  4: "彼が自分の計[はか]りを終えると、アッシリアの王[おう]ネブカドネツァルは、自分の軍勢[ぐんぜい]の総大将[そうだいしょう]で、自分[じぶん]に次[つ]ぐ者[もの]であるホロフェルネスを呼[よ]び、彼に言[い]った。"
  5: "「大[だい]いなる王[おう]、全地[ぜんち]の主[しゅ]はこう言[い]う。見[み]よ、あなたはわたしの前[まえ]から出[で]て行[ゆ]き、自分[じぶん]の力[ちから]に信頼[しんらい]する者[もの]たち、すなわち歩兵[ほへい]十二万[じゅうにまん]と、騎手[きしゅ]を伴[ともな]う馬[うま]の群[む]れ一万二千[いちまんにせん]を連[つ]れて行く。"
  6: "あなたは西[にし]の方[ほう]の全[すべ]ての地[ち]に会[あ]いに出[で]て行[ゆ]く。彼らがわたしの口[くち]の言葉[ことば]に従[したが]わなかったからである。"
  7: "あなたは彼らに、土[つち]と水[みず]を用意[ようい]せよと告[つ]げ知[し]らせる。わたしが怒[いか]りをもって彼らに向[む]かって出[で]て行[ゆ]き、わたしの軍勢[ぐんぜい]の足[あし]で地[ち]の全面[ぜんめん]を覆[おお]い、彼らを彼らの略奪[りゃくだつ]に渡[わた]すからである。"
  8: "彼らの傷[きず]ついた者[もの]たちが彼らの谷[たに]々[たに]を満[み]たし、すべての谷川[たにがわ]も、溢[あふ]れ流[なが]れる川[かわ]も、彼らの死体[したい]で満ちる。"
  9: "わたしは彼らの捕囚[ほしゅう]の者[もの]たちを、地[ち]のすべての果[は]てに連[つ]れて行[ゆ]く。"
  10: "あなたは出[で]て行[ゆ]き、彼らのすべての境[さかい]をわたしのために先[さき]に取[と]り押[お]さえよ。彼らは自分[じぶん]たちをあなたに引[ひ]き渡[わた]す。あなたは彼らを、彼らの糾明[きゅうめい]の日[ひ]までわたしのために取っておく。"
  11: "しかし、従[したが]わない者[もの]たちには、あなたの目[め]は彼らを殺[ころ]しと略奪[りゃくだつ]に渡[わた]すことを容赦[ようしゃ]しない。"
  12: "このわたしが生[い]きている限[かぎ]り、わたしの王国[おうこく]の威力[いりょく]にかけて、わたしは語[かた]った。このことをわたしの手[て]で成[な]し遂[と]げる。"
  13: "あなたは自分の主[しゅ]の言葉[ことば]の一[ひと]つたりとも違反[いはん]してはならない。わたしがあなたに命[めい]じたとおりに、必[かなら]ず成し遂げよ。それを行うのに遅[おく]れてはならない。」"
  14: "ホロフェルネスは自分の主[しゅ]の前[まえ]から出[で]て行[ゆ]き、アッシリアの軍勢[ぐんぜい]のすべてもろもろの権力者[けんりょくしゃ]、将軍[しょうぐん]たち、監督[かんとく]たちを呼[よ]び集[あつ]めた。"
  15: "彼は自分の主[しゅ]が命[めい]じたとおりに、戦列[せんれつ]のために選[えら]ばれた者[もの]たちを十二万[じゅうにまん]人[にん]まで数[かぞ]え、また弓[ゆみ]を射[い]る騎兵[きへい]一万二千[いちまんにせん]人を数えた。"
  16: "そして、戦[いくさ]のために大軍[たいぐん]が整列[せいれつ]するそのように、彼らを配置[はいち]した。"
  17: "彼は彼らの荷[に]のために、らくだ、ろば、騾馬[らば]を非常[ひじょう]に多[おお]く取[と]り、彼らの食糧[しょくりょう]の備[そな]えとして、羊[ひつじ]、牛[うし]、山羊[やぎ]を、数[かぞ]えきれないほど取った。"
  18: "また、すべての者[もの]のために十[じゅう]分[ぶん]な食糧[しょくりょう]と、王[おう]の家[いえ]からの金[きん]と銀[ぎん]を非常に多[おお]く取った。"
  19: "彼とその全軍[ぜんぐん]は、王[おう]ネブカドネツァルに先立[さきだ]って進[すす]み、西[にし]の方[ほう]の地[ち]の全面[ぜんめん]を、自分[じぶん]たちの戦車[せんしゃ]、騎兵[きへい]、選[えら]ばれた歩兵[ほへい]で覆[おお]うために、道[みち]へ出[で]た。"
  20: "多[おお]くの混[ま]じり合[あ]った者[もの]たちも、いなごのように、地[ち]の砂[すな]のように彼らとともに出[で]て行[ゆ]った。その数[かず]は多さのゆえに数[かぞ]えることができなかったからである。"
  21: "彼らはニネベを出[で]て三日[みっか]の道[みち]を行[ゆ]き、ベクティレトの平原[へいげん]の面[おもて]に至[いた]り、ベクティレトから、上[かみ]キリキアの左[ひだり]手[て]にある山[やま]の近[ちか]くに陣営[じんえい]を張[は]った。"
  22: "そして彼は自分の全軍[ぜんぐん]、すなわち歩兵[ほへい]、騎兵[きへい]、戦車[せんしゃ]のすべてを率[ひき]い、そこから山[やま]の地方[ちほう]へ進[すす]んだ。"
  23: "彼はフドとルドを切[き]り倒[たお]し、ラシスの子[こ]らのすべてと、ヘレオンの南[みなみ]にあって荒[あ]れ野[の]の面[おもて]にいるイシュマエルの子らを略奪[りゃくだつ]した。"
  24: "彼はユーフラテスを渡[わた]り、メソポタミアを通[とお]り過[す]ぎ、アブロナの川[かわ]沿[ぞ]いにあるすべての高[たか]い都[みやこ]を破壊[はかい]して、海[うみ]にまで達[たっ]した。"
  25: "彼はキリキアの境[さかい]を占領[せんりょう]し、自分に逆[さか]らうすべての者を切[き]り倒[たお]し、アラビアの面[おもて]の南[みなみ]に当[あ]たるヤフェトの境にまで至[いた]った。"
  26: "彼はミディアンの子[こ]らをすべても包囲[ほうい]し、彼らの天幕[てんまく]を焼[や]き、その家畜[かちく]の囲[かこ]いを略奪[りゃくだつ]した。"
  27: "彼は小麦[こむぎ]の刈[か]り入[い]れの日[ひ]にダマスコの平野[へいげん]へ下[くだ]り、彼らのすべての畑[はたけ]を焼[や]き、羊[ひつじ]の群[む]れも牛[うし]の群れも滅[ほろ]びに渡[わた]し、彼らの都[みやこ]々[みやこ]を略奪[りゃくだつ]し、彼らの平野を空[むな]しくし、彼らの若者[わかもの]をすべても剣[つるぎ]の刃[は]にかけた。"
  28: "彼への恐[おそ]れと震[ふる]えが、海辺[うみべ]の地[ち]に住[す]む者[もの]たち、すなわちシドンとティルスにいる者、スルとオキナに住む者、イェムナアンに住むすべての者に襲[おそ]いかかった。アゾトとアスカロンに住む者たちは、彼を非常[ひじょう]に恐れた。"

notes:
  1: "ἐν τῷ ἔτει τῷ ὀκτωκαιδεκάτῳ — «в восемнадцатый год». δευτέρᾳ καὶ εἰκάδι τοῦ πρώτου μηνός — «в двадцать второй [день] первого месяца»: датив порядкового при опущенном ἡμέρᾳ, слав. «в двадесять вторый день». ἐγένετο λόγος — «было слово», т. е. состоялось решение, приказ (λόγος здесь «дело, распоряжение»; слав. «бысть слово»). ἐκδικῆσαι πᾶσαν τὴν γῆν — «отомстить всей земле» (ἐκδικέω); καθὼς ἐλάλησεν — «как он сказал»."
  2: "συνεκάλεσεν — «созвал» (συγκαλέω). τοὺς θεράποντας … τοὺς μεγιστᾶνας — «прислужников и вельмож» (θεράπων — «слуга»; μεγιστάν — «сановник, знатный»). ἔθετο μετ᾽ αὐτῶν τὸ μυστήριον τῆς βουλῆς αὐτοῦ — «положил с ними тайну совета своего», т. е. открыл им замысел (τίθημι μετά — «совещаться»). συνετέλεσεν πᾶσαν τὴν κακίαν τῆς γῆς ἐκ τοῦ στόματος αὐτοῦ — «довершил всё зло [на] землю из уст своих»: изрёк приговор до конца; слав. «от яст своих»."
  3: "ἔκριναν — «решили, постановили» (κρίνω). ὀλεθρεῦσαι πᾶσαν σάρκα — «истребить всякую плоть» (ὀλεθρεύω; σάρξ — «плоть», здесь «всё живое»). οἳ οὐκ ἠκολούθησαν τῷ λόγῳ τοῦ στόματος αὐτοῦ — «которые не последовали слову уст его» (ἀκολουθέω с дативом)."
  4: "ἐγένετο ὡς συνετέλεσεν τὴν βουλὴν αὐτοῦ — «когда он завершил совет свой» (ὡς с аористом — «когда»). ἀρχιστράτηγον τῆς δυνάμεως — «главного воеводу войска» (ἀρχιστράτηγος — 総大将). δεύτερον ὄντα μετ᾽ αὐτόν — «бывшего вторым после него»; слав. «втораго суща по нем». εἶπεν πρὸς αὐτόν — «сказал ему»: речь начинается в ст. 5 и идёт до ст. 13."
  5: "Τάδε λέγει ὁ βασιλεὺς ὁ μέγας — «так говорит царь великий», формула царского указа (ср. 4 Цар 18:19). ὁ κύριος πάσης τῆς γῆς — «господин всей земли» (全地の主). ἐξελεύσῃ ἐκ τοῦ προσώπου μου — «выйдешь от лица моего», т. е. из моей ставки. ἄνδρας πεποιθότας ἐν ἰσχύι αὐτῶν — «мужей, надеющихся на силу свою» (πείθω в перфекте — «доверять»). πεζῶν εἰς χιλιάδας ἑκατὸν εἴκοσι — «пеших до ста двадцати тысяч» (十二万). πλῆθος ἵππων σὺν ἀναβάταις χιλιάδας δέκα δύο — «множество коней с всадниками, двенадцать тысяч» (一万二千; ἀναβάτης — «всадник»)."
  6: "εἰς συνάντησιν πάσῃ τῇ γῇ ἐπὶ δυσμάς — «навстречу всей земле на запад» (συνάντησις — «встреча»; слав. «сретение»). ὅτι ἠπείθησαν τῷ ῥήματι — «потому что не покорились слову» (ἀπειθέω с дативом)."
  7: "ἀπαγγελεῖς αὐτοῖς ἑτοιμάζειν γῆν καὶ ὕδωρ — «возвестишь им готовить землю и воду»: формула покорности, сдать землю и воду; слав. «уготовляти землю и воду». ἐξελεύσομαι ἐν θυμῷ μου — «выйду в ярости моей» (θυμός). καλύψω πᾶν τὸ πρόσωπον τῆς γῆς ἐν τοῖς ποσὶν τῆς δυνάμεώς μου — «покрою всё лицо земли ногами силы моей», т. е. воинами. δώσω αὐτοὺς εἰς διαρπαγὴν αὐτοῖς — «отдам их на разграбление им»: тёмное αὐτοῖς при διαρπαγή (возможно, «вам»), сохранено буквально."
  8: "οἱ τραυματίαι αὐτῶν — «раненые их» (τραυματίας), т. е. поражённые. πληρώσουσιν τὰς φάραγγας αὐτῶν — «наполнят ущелья их» (φάραγξ — «ущелье, дол»). πᾶς χειμάρρους καὶ ποταμὸς ἐπικλύζων — «всякий поток и река, выходящие из берегов» (χειμάρρους — «зимний поток»; ἐπικλύζω — «заливать»). τοῖς νεκροῖς αὐτῶν πληρωθήσεται — «наполнится мёртвыми их»."
  9: "ἄξω τὴν αἰχμαλωσίαν αὐτῶν — «приведу плен их» (αἰχμαλωσία — «плен, пленные»; ἄγω — «вести»). ἐπὶ τὰ ἄκρα πάσης τῆς γῆς — «до концов всей земли» (ἄκρον — «край, оконечность»)."
  10: "προκαταλήμψῃ μοι πᾶν ὅριον αὐτῶν — «предварительно займёшь мне всякий предел их» (προκαταλαμβάνω — «занимать заранее»; слав. «приодержиши»). ἐκδώσουσίν σοι ἑαυτούς — «предадут тебе самих себя», сдадутся (ἐκδίδωμι). διατηρήσεις ἐμοὶ αὐτοὺς εἰς ἡμέραν ἐλεγμοῦ αὐτῶν — «сохранишь их мне до дня обличения их» (διατηρέω — «сберегать»; ἐλεγμός — «изобличение», 糾明)."
  11: "τοὺς ἀπειθοῦντας — «непокорных» (ἀπειθέω). οὐ φείσεται ὁ ὀφθαλμός σου — «не пощадит глаз твой»: семитизм, «не будешь щадить» (φείδομαι). τοῦ δοῦναι αὐτοὺς εἰς φόνον καὶ ἁρπαγήν — «предать их на убиение и разграбление» (φόνος — «убийство»; ἁρπαγή — «грабёж»). ἐν πάσῃ τῇ γῇ σου — «во всей земле твоей»."
  12: "ζῶν ἐγώ — «жив я», клятвенная формула (ср. Чис 14:21; слав. «жив аз»), передана このわたしが生きている限り. καὶ τὸ κράτος τῆς βασιλείας μου — «и мощь царства моего» (κράτος — «сила, держава»), вторая часть клятвы. λελάληκα καὶ ποιήσω ταῦτα — «сказал — и сделаю это» (перфект с будущим: слово непреложно). ἐν χειρί μου — «рукою моею»."
  13: "οὐ παραβήσῃ ἕν τι τῶν ῥημάτων τοῦ κυρίου σου — «не преступишь ни одного из слов господина твоего» (παραβαίνω — «переступать»; ὁ κύριος здесь «господин», 主). ἐπιτελῶν ἐπιτελέσεις — «исполняя исполнишь», усиление (ἐπιτελέω). καθότι προστέταχά σοι — «как я приказал тебе» (προστάσσω). οὐ μακρυνεῖς τοῦ ποιῆσαι αὐτά — «не замедлишь сделать их» (μακρύνω — «отдалять, медлить»)."
  14: "ἐξῆλθεν … ἀπὸ προσώπου τοῦ κυρίου αὐτοῦ — «вышел от лица господина своего». τοὺς δυνάστας καὶ τοὺς στρατηγοὺς καὶ ἐπιστάτας — «властителей, воевод и надзирателей» (δυνάστης — «властитель»; στρατηγός — 将軍; ἐπιστάτης — «надзиратель, начальник»). τῆς δυνάμεως Ασσουρ — «войска Ассура», т. е. ассирийского."
  15: "ἠρίθμησεν ἐκλεκτοὺς ἄνδρας εἰς παράταξιν — «отсчитал избранных мужей для боевого строя» (ἀριθμέω). εἰς μυριάδας δέκα δύο — «до двенадцати мириад», т. е. 120 000 (μυριάς — «десять тысяч»); слав. «до дванадесять тем». ἱππεῖς τοξότας μυρίους δισχιλίους — «конных стрелков десять тысяч и две тысячи», т. е. 12 000; слав. «конников стрелцев дванадесять тысящей» — то же число, выраженное иначе."
  16: "διέταξεν αὐτοὺς ὃν τρόπον πολέμου πλῆθος συντάσσεται — «устроил их так, как строится множество [войска] для войны» (διατάσσω — «расставлять»; ὃν τρόπον — «каким образом»; συντάσσω — «строить в порядок»)."
  17: "ἔλαβεν καμήλους καὶ ὄνους καὶ ἡμιόνους — «взял верблюдов, ослов и мулов» (ἡμίονος — «мул», 騾馬). εἰς τὴν ἀπαρτίαν αὐτῶν — «для обоза их» (ἀπαρτία — «снаряжение, обоз»; слав. «припасов ради»). πρόβατα καὶ βόας καὶ αἶγας εἰς τὴν παρασκευὴν αὐτῶν — «овец, волов и коз на приготовление их», т. е. в продовольствие. ὧν οὐκ ἦν ἀριθμός — «которым не было числа»."
  18: "ἐπισιτισμὸν παντὶ ἀνδρὶ εἰς πλῆθος — «продовольствие всякому мужу в изобилии» (ἐπισιτισμός — «провизия»; εἰς πλῆθος — «во множестве»). χρυσίον καὶ ἀργύριον ἐξ οἴκου βασιλέως πολὺ σφόδρα — «золото и серебро из дома царского, весьма много». Стих продолжает сказуемое ст. 17 (ἔλαβεν), поэтому в переводе повторено 取った."
  19: "ἐξῆλθεν … εἰς πορείαν — «выступил в путь» (πορεία — «поход»). τοῦ προελθεῖν βασιλέως Ναβουχοδονοσορ — «чтобы предшествовать царю Навуходоносору» (προέρχομαι — «идти впереди»; родительный при инфинитиве). καλύψαι πᾶν τὸ πρόσωπον τῆς γῆς πρὸς δυσμαῖς — «покрыть всё лицо земли к западу». ἐν ἅρμασι καὶ ἱππεῦσι καὶ πεζοῖς ἐπιλέκτοις — «колесницами, конницей и отборной пехотой» (ἐπίλεκτος — «избранный»)."
  20: "ὁ ἐπίμικτος — «смешанный люд», сброд, шедший с войском (ἐπίμικτος — «смешанный»; ср. Исх 12:38). ὡς ἀκρὶς … ὡς ἡ ἄμμος τῆς γῆς — «как саранча… как песок земной». οὐ γὰρ ἦν ἀριθμὸς ἀπὸ πλήθους αὐτῶν — «ибо не было числа от множества их»."
  21: "ὁδὸν τριῶν ἡμερῶν — «путь трёх дней» (винитив меры). ἐπὶ πρόσωπον τοῦ πεδίου Βεκτιλεθ — «к передней стороне равнины Вектилеф» (κατὰ πρόσωπον — семитизм «напротив, перед»). ἐπεστρατοπέδευσαν ἀπὸ Βεκτιλεθ — «стали лагерем от Вектилефа» (στρατοπεδεύω — «разбивать лагерь»). ἐπ᾽ ἀριστερᾷ τῆς ἄνω Κιλικίας — «по левую сторону верхней Киликии» (ἀριστερά — «левая рука»)."
  22: "ἔλαβεν πᾶσαν τὴν δύναμιν αὐτοῦ — «взял всё войско своё», т. е. двинул его. τοὺς πεζοὺς καὶ τοὺς ἱππεῖς καὶ τὰ ἅρματα — «пеших, конных и колесницы». ἀπῆλθεν ἐκεῖθεν εἰς τὴν ὀρεινήν — «ушёл оттуда в нагорную страну»."
  23: "διέκοψεν τὸ Φουδ καὶ Λουδ — «изрубил Фуда и Луда» (διακόπτω — «разрубать»); слав. «изсече фуда и луда». ἐπρονόμευσεν υἱοὺς πάντας Ρασσις — «разграбил всех сынов Рассиса» (προνομεύω). τοὺς κατὰ πρόσωπον τῆς ἐρήμου πρὸς νότον τῆς Χελεων — «тех, что напротив пустыни, к югу от Хелеона»; слав. «хеллеонския» — прилагательное, Син. «к земле Хеллеонской». Имена даны по LXX."
  24: "παρῆλθεν τὸν Εὐφράτην — «перешёл Евфрат» (παρέρχομαι с винитивом). διῆλθεν τὴν Μεσοποταμίαν — «прошёл Месопотамию». κατέσκαψεν — «разорил, срыл» (κατασκάπτω; слав. «раскопа»). τὰς πόλεις τὰς ὑψηλάς — «города высокие» (может значить «укреплённые»). τὰς ἐπὶ τοῦ χειμάρρου Αβρωνα — «те, что при потоке Аврона» (χειμάρρους — «поток»); ἕως τοῦ ἐλθεῖν ἐπὶ θάλασσαν — «до выхода к морю»."
  25: "κατελάβετο τὰ ὅρια τῆς Κιλικίας — «занял пределы Киликии» (καταλαμβάνω). κατέκοψε πάντας τοὺς ἀντιστάντας αὐτῷ — «изрубил всех, восставших против него» (κατακόπτω; ἀνθίστημι). ἕως ὁρίων Ιαφεθ — «до пределов Иафета». τὰ πρὸς νότον κατὰ πρόσωπον τῆς Ἀραβίας — «обращённые к югу, напротив Аравии»."
  26: "ἐκύκλωσεν — «обошёл кругом, окружил» (κυκλόω). τοὺς υἱοὺς Μαδιαμ — «сынов Мадиама», мадианитян. ἐνέπρησεν τὰ σκηνώματα αὐτῶν — «сжёг жилища их» (ἐμπίπρημι; σκήνωμα — «жилище, шатёр»; слав. «селения»). ἐπρονόμευσεν τὰς μάνδρας αὐτῶν — «разграбил загоны их» (μάνδρα — «овечий загон»)."
  27: "κατέβη εἰς πεδίον Δαμασκοῦ — «сошёл на равнину Дамаска». ἐν ἡμέραις θερισμοῦ πυρῶν — «во дни жатвы пшеницы» (θερισμός — «жатва»). ἐνέπρησεν πάντας τοὺς ἀγρούς — «сжёг все поля». τὰ ποίμνια καὶ τὰ βουκόλια ἔδωκεν εἰς ἀφανισμόν — «стада овец и волов предал уничтожению» (ποίμνιον, βουκόλιον; ἀφανισμός — «истребление»). ἐσκύλευσεν — «обобрал, разграбил» (σκυλεύω). ἐξελικμήσεν — «вывеял, опустошил» (λικμάω — «веять»). ἐν στόματι ῥομφαίας — «устами меча», т. е. остриём (слав. «острием меча»)."
  28: "ἐπέπεσεν φόβος καὶ τρόμος αὐτοῦ — «пал страх и трепет его», т. е. страх перед ним (φόβος, τρόμος). τοὺς κατοικοῦντας τὴν παραλίαν — «живущих в приморье». Σιδῶνι καὶ Τύρῳ — Сидон и Тир; Σουρ καὶ Οκινα — Сур и Окина; Ιεμνααν — Иамния; Ἀζωτῳ καὶ Ἀσκαλῶνι — Азот и Аскалон, филистимские города. ἐφοβήθησαν αὐτὸν σφόδρα — «убоялись его весьма»."
