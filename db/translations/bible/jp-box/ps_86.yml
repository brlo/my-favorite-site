# jp-box, Псалтирь, псалом 86. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0.
# Псалом 86: Сион — город Божий, матерь всех народов (0–7).
# Внимание: в gr-lxx-byz 8 строк (0–7), а в ru-базе 7 (0–6): русская база слила
# ст. 6 и 7 в один. Нумерация здесь — строго по gr-lxx-byz, как требует задание:
# стихи 1 и 2 не слиты, ст. 7 отдельный.
# Красного и синего нет. Прямой речи нет (слова людей в 5 переданы косвенно).
# 〔…〕 нет: всё переведено по gr-lxx-byz, добавлений Церкви не вносилось.
# セラ (διάψαλμα, в конце ст. 3 и 6) не передаётся — по решению пользователя, как у jp-joc.
# Сноска ⟨…⟩ одна: 4 ラハブ — здесь имя Египта, а не блудницы из Нав 2 (первое такое
# употребление в корпусе). jp-ni не использовался.

tr_code: jp-box
book: ps
chapter: 86
draft: true

verses:
  0: "コラの子[こ]らの詩[うた]、歌[うた]。"
  1: "その基[もと]は聖[せい]なる山[やま]々[やま]にある。"
  2: "主[しゅ]はシオンの門[もん]を、ヤコブのすべての住[す]まいにもまして愛[あい]される。"
  3: "神[かみ]の都[みやこ]よ、あなたについて栄光[えいこう]に満[み]ちたことが語[かた]られた。"
  4: "わたしは、わたしを知[し]る者[もの]たちに、ラハブ⟨ここではエジプトを指[さ]す。⟩とバビロンのことを思[おも]い起[おこ]す。見[み]よ、ペリシテ人[じん]とティルス、エチオピアの民[たみ]も、これらはそこに生[う]まれた。"
  5: "シオンは母[はは]である、と人[ひと]は言[い]い、人[ひと]がその中[なか]に生[う]まれた。いと高[たか]き方[かた]ご自身[じしん]がそれを据[す]えられた。"
  6: "主[しゅ]は民[たみ]々[びと]と首[しゅ]領[りょう]たちの記[き]録[ろく]に、その中[なか]に生[う]まれたこれらを記[しる]される。"
  7: "喜[よろこ]ぶ者[もの]はみな、あなたのうちに住[す]まいを持[も]つ。"

notes:
  0: "Τοῖς υἱοῖς Κορε ψαλμὸς ᾠδῆς — コラの子らの詩、歌 (υἱοὶ Κορε — コラの子ら; ψαλμός — 詩; ᾠδή — 歌). Надписание — стих 0."
  1: "Οἱ θεμέλιοι αὐτοῦ ἐν τοῖς ὄρεσιν τοῖς ἁγίοις — その基は聖なる山々にある (θεμέλιος — «основание»; αὐτοῦ — «его», т. е. города; подлежащее не названо, как и в греч.)."
  2: "ἀγαπᾷ κύριος τὰς πύλας Σιων — 主はシオンの門を愛される (πύλη — 門). ὑπὲρ πάντα τὰ σκηνώματα Ιακωβ — ヤコブのすべての住まいにもまして (σκήνωμα — 住まい; ὑπέρ + вин. — «более чем»). В ru-базе ст. 1 и 2 слиты; здесь раздельно, по gr-lxx-byz."
  3: "δεδοξασμένα ἐλαλήθη περὶ σοῦ, ἡ πόλις τοῦ θεοῦ — 神の都よ、あなたについて栄光に満ちたことが語られた (δοξάζω — «прославлять»; слав. «преславная глаголашася о тебе, граде Божий» — звательный падеж, как и здесь). διάψαλμα не передаётся."
  4: "μνησθήσομαι Ρααβ καὶ Βαβυλῶνος τοῖς γινώσκουσίν με — わたしは、わたしを知る者たちに、ラハブとバビロンのことを思い起こす (μιμνήσκομαι — «вспоминать»; Ρααβ — здесь poetic имя Египта, ср. Ис 51:9; ラハブ в остальном корпусе — блудница из Нав 2, отсюда сноска). ἀλλόφυλοι καὶ Τύρος καὶ λαὸς Αἰθιόπων — ペリシテ人とティルス、エチオピアの民 (ἀλλόφυλοι — ペリシテ人, как в Пс 55:1). οὗτοι ἐγενήθησαν ἐκεῖ — これらはそこに生まれた."
  5: "Μήτηρ Σιων, ἐρεῖ ἄνθρωπος — シオンは母である、と人は言い (μήτηρ — 母). καὶ ἄνθρωπος ἐγενήθη ἐν αὐτῇ — 人がその中に生まれた (повтор ἄνθρωπος — «человек и человек», т. е. всякий человек; передан один раз). αὐτὸς ἐθεμελίωσεν αὐτὴν ὁ ὕψιστος — いと高き方ご自身がそれを据えられた (θεμελιόω — «основывать»; ὕψιστος — いと高き方)."
  6: "κύριος διηγήσεται ἐν γραφῇ λαῶν καὶ ἀρχόντων — 主は民々と首領たちの記録に記される (διηγέομαι — «поведать, описать»; γραφή — «писание, запись»; ἄρχων — 首領). τούτων τῶν γεγενημένων ἐν αὐτῇ — その中に生まれたこれらを (γίνομαι — «рождаться, бывать»). διάψαλμα не передаётся."
  7: "ὡς εὐφραινομένων πάντων ἡ κατοικία ἐν σοί — 喜ぶ者はみな、あなたのうちに住まいを持つ (εὐφραίνομαι — «веселиться»; κατοικία — «жилище»; ὡς в греч. затемняет смысл, слав. «яко веселящихся всех жилище в Тебе»). У Синодального иначе («все источники мои в тебе») — по евр.; здесь по греч. и слав. В ru-базе этот стих слит со ст. 6."
