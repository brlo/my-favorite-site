verses:
  1: "フェストは属州[ぞくしゅう]に着任[ちゃくにん]してから三[みっ]日[か]後[のち]、カイサリアからエルサレムへ上[のぼ]った。"
  2: "祭司長[さいしちょう]たちとユダヤ人[じん]の有力者[ゆうりょくしゃ]たちは、パウロを訴[うった]えて、フェストに願[ねが]い出[で]た。"
  3: "それは、パウロをエルサレムへ呼[よ]び寄[よ]せてもらいたいという願[ねが]いであった。彼[かれ]らは道中[どうちゅう]でパウロを殺[ころ]そうと、待[ま]ち伏[ぶ]せを企[たくら]んでいた。"
  4: "しかし、フェストは、「パウロはカイサリアで留置[りゅうち]しておく。自分[じぶん]も間[ま]もなくそこへ向[む]かう」と答[こた]えた。"
  5: "「あなたがたのうちの有力者[ゆうりょくしゃ]たちが、わたしと一緒[いっしょ]に下[くだ]って行[い]って、この者[もの]に何[なに]か不当[ふとう]な点[てん]があれば、それを訴[うった]えればよい」と言[い]った。"
  6: "フェストは、彼[かれ]らのところに八日[ようか]か十日[とおか]ほどとどまってから、カイサリアへ下[くだ]った。そして、翌日[よくじつ]、法廷[ほうてい]の席[せき]に着[つ]き、パウロを連[つ]れて来[く]るように命[めい]じた。"
  7: "パウロが来[く]ると、エルサレムから下[くだ]って来[き]たユダヤ人[じん]たちが彼[かれ]の周[まわ]りに立[た]ち、多[おお]くの重[おも]い罪状[ざいじょう]を申[もう]し立[た]てたが、それを証明[しょうめい]することはできなかった。"
  8: "パウロは、「わたしは、ユダヤ人[じん]の律法[りっぽう]にも、神殿[しんでん]にも、カエサルにも、何[なに]一[ひと]つ罪[つみ]を犯[おか]してはいない」と弁明[べんめい]した。"
  9: "しかし、フェストはユダヤ人[じん]に恩[おん]を売[う]ろうとして、パウロに答[こた]えて言[い]った。「エルサレムへ上[のぼ]り、そこでこれらのことについて、わたしの前[まえ]で裁判[さいばん]を受[う]けたいのか。」"
  10: "パウロは言[い]った。「わたしはカエサルの法廷[ほうてい]に立[た]っている。ここで裁判[さいばん]を受[う]けるのが当然[とうぜん]である。あなたもよく知[し]っておられるように、わたしはユダヤ人[じん]に何[なに]の不正[ふせい]もしていない。"
  11: "もしわたしが不正[ふせい]を行[おこな]い、死[し]に値[あたい]することをしたのなら、死[し]を辞[じ]さない。しかし、彼[かれ]らがわたしを訴[うった]えている事柄[ことがら]に何[なに]の根拠[こんきょ]もないのなら、だれもわたしを彼[かれ]らに引[ひ]き渡[わた]すことはできない。わたしはカエサルに上訴[じょうそ]する。」"
  12: "そこで、フェストは顧問[こもん]たちと協議[きょうぎ]してから答[こた]えた。「カエサルに上訴[じょうそ]したのだから、カエサルのもとへ行[ゆ]くことになる。」"
  13: "数日[すうじつ]が過[す]ぎて、アグリッパ王[おう]とベルニケが、フェストに挨拶[あいさつ]するためにカイサリアへ来[き]た。"
  14: "二人[ふたり]がそこに幾日[いくにち]もとどまっていたので、フェストはパウロのことを王[おう]に話[はな]して言[い]った。「フェリクスが残[のこ]して行[い]った囚人[しゅうじん]が一人[ひとり]いる。"
  15: "わたしがエルサレムにいたとき、祭司長[さいしちょう]たちとユダヤ人[じん]の長老[ちょうろう]たちがその者[もの]を訴[うった]え、有罪[ゆうざい]の判決[はんけつ]を求[もと]めた。"
  16: "わたしは彼[かれ]らに答[こた]えて、『ローマ人[じん]には、訴[うった]えられている者[もの]が訴[うった]える者[もの]たちと顔[かお]を合[あ]わせ、その罪状[ざいじょう]について弁明[べんめい]の機会[きかい]を得[え]る前[まえ]に、だれかを〔死刑[しけい]に〕引[ひ]き渡[わた]す慣[なら]わしはない』と言[い]った。"
  17: "そこで、彼[かれ]らがここに集[あつ]まったとき、わたしは何[なに]も先延[さきの]ばしにせず、翌日[よくじつ]、法廷[ほうてい]の席[せき]に着[つ]いて、その男[おとこ]を連[つ]れて来[く]るように命[めい]じた。"
  18: "しかし、訴[うった]える者[もの]たちは立[た]ち上[あ]がっても、わたしが予想[よそう]していたような悪[わる]い事柄[ことがら]を何[なに]一[ひと]つ挙[あ]げなかった。"
  19: "ただ、彼[かれ]らは、自分[じぶん]たちの宗教[しゅうきょう]について、また、パウロが生[い]きていると言[い]っている、死[し]んだイエスという者[もの]について、彼[かれ]に対[たい]して幾[いく]つかの論争[ろんそう]を抱[かか]えていただけだった。"
  20: "わたしはその論争[ろんそう]の決着[けっちゃく]がつかずに困[こま]り、『エルサレムへ行[い]って、そこでこれらのことについて裁判[さいばん]を受[う]けたいか』と尋[たず]ねた。"
  21: "しかし、パウロが、皇帝[こうてい]の裁[さば]きを受[う]けるまで自分[じぶん]を留置[りゅうち]してほしいと上訴[じょうそ]したので、わたしは、彼[かれ]をカエサルのもとへ送[おく]り出[だ]すまで留置[りゅうち]するように命[めい]じた。」"
  22: "アグリッパはフェストに言[い]った。「わたしも、その人[ひと]の話[はなし]を聞[き]いてみたいものだ。」フェストは言[い]った。「明日[あす]、あなたはその人[ひと]の話[はなし]を聞[き]くことになる。」"
  23: "そこで翌日[よくじつ]、アグリッパとベルニケが大[おお]いに威儀[いぎ]を整[ととの]えて来[き]て、千人隊長[せんにんたいちょう]たちや町[まち]の有力者[ゆうりょくしゃ]たちとともに審問[しんもん]の広間[ひろま]に入[はい]った。フェストが命[めい]じると、パウロが連[つ]れて来[こ]られた。"
  24: "フェストは言[い]った。「アグリッパ王[おう]、また、わたしたちとともにここに居合[いあ]わせているすべての皆[みな]さん、この人[ひと]をご覧[らん]ください。ユダヤ人[じん]の民[たみ]全体[ぜんたい]が、エルサレムでもここでも、この者[もの]はもう生[い]きているべきではないと叫[さけ]んで、わたしに訴[うった]え出[で]た者[もの]である。"
  25: "わたしは調[しら]べたところ、この人[ひと]が死[し]に値[あたい]することを何[なに]もしていないと分[わ]かった。しかし、この者自身[じしん]が皇帝[こうてい]に上訴[じょうそ]したので、わたしは彼[かれ]を送[おく]ることに決[き]めた。"
  26: "しかし、この者[もの]について、皇帝[こうてい]に書[か]き送[おく]るべき確[たし]かなことを、わたしは持[も]っていない。そこで、彼[かれ]をあなたがたの前[まえ]、とりわけアグリッパ王[おう]よ、あなたの前[まえ]に引[ひ]き出[だ]した。それは、予備審問[よびしんもん]を行[おこな]った後[のち]に、書[か]き送[おく]るべき事柄[ことがら]を得[え]るためである。"
  27: "囚人[しゅうじん]を送[おく]りながら、その者[もの]に対[たい]する罪状[ざいじょう]を明[あき]らかにしないのは、不合理[ふごうり]だとわたしには思[おも]われるからである。」"

notes:
  1: "ἐπαρχεία — «провинция, наместничество»; 属州. ἐπιβὰς τῇ ἐπαρχείᾳ — «вступив в управление провинцией»."
  4: "ἀπεκρίθη … τηρεῖσθαι — «отвечал, что Павел должен оставаться под стражей»; 留置, как в 24:23."
  6: "«не более восьми или десяти дней» — 八日か十日."
  11: "Καίσαρα ἐπικαλοῦμαι — формула апелляции римского гражданина к императору; カエサルに上訴する."
  12: "συμβούλιον — совещательный совет при наместнике (не синедрион); 顧問たち."
  14: "ἀνέθετο — «изложил, передал дело»; 話して. δέσμιος — «узник», оставленный Феликсом (ср. 24:27)."
  16: "В критическом тексте χαρίζεσθαί τινα ἄνθρωπον без εἰς ἀπώλειαν; церковный текст (Елизаветинская «выдати человека коего на погибель», jp-joc「之を死に付す」) читает εἰς ἀπώλειαν — 〔死刑に〕."
  19: "δεισιδαιμονία — букв. «суеверие, богопочитание»; передал 宗教 (у jp-joc 宗教)."
  21: "Σεβαστός — официальный титул императора («Август»); 皇帝, ср. 25:25."
  23: "ἀκροατήριον — зал для слушаний; 審問の広間. φαντασία — «внешний блеск, помпа»; 威儀."
  26: "κύριος здесь — обращение к императору; 皇帝. ἀνάκρισις — предварительное расследование; 予備審問."
