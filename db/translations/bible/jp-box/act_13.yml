# jp-box, Деяния апостолов, глава 13. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный 常体, без 文語.
# Критический греческий (gr-lxx-byz) — свидетель; расхождения — в 〔…〕 и notes.
# jp-ni не использовался.
#
# Глава 13: послание Варнавы и Савла (1–3), Кипр и Елима (4–12), Антиохия
# Писидийская и речь Павла (13–41), обращение к язычникам и гонение (42–52).
# Красного в главе нет: Христос здесь не говорит. Слова Духа (13:2) и речь
# Павла (16–41) — не красные.
# 〔…〕 в главе нет: все чтения церковного текста в базе есть, включая слова
# в квадратных скобках (13:10 τοῦ, 13:20 τοῦ, 13:31 νῦν, 13:38 καὶ) — они
# в базе присутствуют, поэтому не оборачиваются.
# Сносок в главе нет. Савл до 13:9 — サウロ (Σαῦλος), с 13:9 — パウロ.

