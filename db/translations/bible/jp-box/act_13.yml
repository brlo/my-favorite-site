verses:
  1: "アンティオキアにあった教会[きょうかい]には、預言者[よげんしゃ]と教師[きょうし]たちがいた。バルナバ、ニゲルと呼[よ]ばれるシメオン、キレネ人[じん]のルキオ、領主[りょうしゅ]ヘロデとともに育[そだ]ったマナエン、そしてサウロである。"
  2: "彼[かれ]らが主[しゅ]に仕[つか]えて断食[だんじき]していたとき、{聖霊[せいれい]|聖神[せいしん]}が言[い]われた。「わたしのためにバルナバとサウロを取[と]り分[わ]けなさい。わたしが彼[かれ]らを召[よ]し出[だ]した働[はたら]きのために。」"
  3: "そこで彼[かれ]らは断食[だんじき]して祈[いの]り、二人[ふたり]の上[うえ]に手[て]を置[お]いてから、彼[かれ]らを送[おく]り出[だ]した。"
  4: "こうして、{聖霊[せいれい]|聖神[せいしん]}に送[おく]り出[だ]された彼[かれ]らは、セレウキアへ下[くだ]り、そこからキプロスへ船[ふね]で渡[わた]った。"
  5: "サラミスに着[つ]くと、彼[かれ]らはユダヤ人[じん]の会堂[かいどう]で神[かみ]の言葉[ことば]を宣[の]べ伝[つた]えた。ヨハネも彼[かれ]らを助[たす]ける者[もの]として、そこにいた。"
  6: "島[しま]をすべて巡[めぐ]ってパフォスに着[つ]くと、ユダヤ人[じん]の魔術師[まじゅつし]で偽[にせ]預言者[よげんしゃ]である一人[ひとり]の男[おとこ]に出会[であ]った。名[な]はバリイエスといった。"
  7: "この男[おとこ]は、思慮[しりょ]深[ぶか]い人[ひと]である総督[そうとく]セルギオ・パウロのそばにいた。総督[そうとく]はバルナバとサウロを呼[よ]び寄[よ]せて、神[かみ]の言葉[ことば]を聞[き]きたいと願[ねが]った。"
  8: "しかし、魔術師[まじゅつし]エリマ（これが彼[かれ]の名[な]の訳[やく]である）が二人[ふたり]に敵[てき]して、総督[そうとく]を信仰[しんこう]から遠[とお]ざけようとした。"
  9: "サウロ、すなわちパウロは、{聖霊[せいれい]|聖神[せいしん]}に満[み]たされて彼[かれ]をじっと見[み]つめ、"
  10: "言[い]った。「ああ、あらゆる欺[あざむ]きと悪[わる]だくみに満[み]ちた者[もの]、悪魔[あくま]の子[こ]、すべての義[ぎ]の敵[てき]よ。あなたは主[しゅ]のまっすぐな道[みち]を曲[ま]げるのをやめないのか。"
  11: "今[いま]、見[み]よ、主[しゅ]の手[て]があなたの上[うえ]にある。あなたは目[め]が見[み]えなくなり、しばらくの間[あいだ]、日[ひ]の光[ひかり]を見[み]ることもできなくなる。」するとたちまち、彼[かれ]の目[め]に霧[きり]と闇[やみ]が覆[おお]いかぶさり、彼[かれ]は手[て]を引[ひ]いてくれる人[ひと]を求[もと]めて歩[ある]き回[まわ]った。"
  12: "総督[そうとく]は起[お]こったことを見[み]て、主[しゅ]の教[おし]えに驚[おどろ]きながら、信[しん]じた。"
  13: "パウロとその一行[いっこう]はパフォスから船出[ふなで]して、パンフィリアのペルゲに着[つ]いた。しかし、ヨハネは彼[かれ]らから離[はな]れて、エルサレムへ帰[かえ]って行[い]った。"
  14: "彼[かれ]らはペルゲから進[すす]んで、ピシディアのアンティオキアに着[つ]いた。そして安息日[あんそくび]の日[ひ]に会堂[かいどう]に入[はい]り、席[せき]に着[つ]いた。"
  15: "律法[りっぽう]と預言者[よげんしゃ]の書[しょ]が読[よ]まれた後[のち]、会堂長[かいどうちょう]たちは彼[かれ]らのところに人[ひと]を遣[つか]わして言[い]った。「兄弟[きょうだい]たちよ、あなたがたの中[なか]に、この民[たみ]に向[む]けて励[はげ]ましの言葉[ことば]があるなら、話[はな]してください。」"
  16: "パウロは立[た]ち上[あ]がり、手[て]を振[ふ]ってから言[い]った。「イスラエルの人々[ひとびと]、また神[かみ]を畏[おそ]れる人々[ひとびと]よ、聞[き]いてください。"
  17: "この民[たみ]イスラエルの神[かみ]は、わたしたちの先祖[せんぞ]たちを選[えら]び、民[たみ]がエジプトの地[ち]に寄留[きりゅう]していた間[あいだ]、これを大[おお]きくし、高[たか]く上[あ]げた腕[うで]をもって彼[かれ]らをそこから導[みちび]き出[だ]し、"
  18: "そして、四十[よんじゅう]年[ねん]ほどの間[あいだ]、荒[あ]れ野[の]で彼[かれ]らの行[おこな]いを耐[こら]え忍[しの]び、"
  19: "カナンの地[ち]で七[なな]つの民族[みんぞく]を打[う]ち倒[たお]し、その地[ち]を彼[かれ]らに嗣業[しぎょう]として与[あた]えられた。"
  20: "その後[のち]、四百五十[よんひゃくごじゅう]年[ねん]の間[あいだ]、預言者[よげんしゃ]サムエルに至[いた]るまで、裁[さば]き人[びと]たちをお与[あた]えになった。"
  21: "それから彼[かれ]らは王[おう]を求[もと]めた。すると神[かみ]は、ベニヤミン族[ぞく]の者[もの]であるキシュの子[こ]サウロを彼[かれ]らに与[あた]えられた。四十[よんじゅう]年[ねん]の間[あいだ]のことである。"
  22: "神[かみ]は彼[かれ]を退[しりぞ]け、代[か]わりにダビデを彼[かれ]らの王[おう]として立[た]て、ダビデについてこう証[あか]しされた。『わたしはエッサイの子[こ]ダビデ、わたしの心[こころ]にかなう人[ひと]を見[み]いだした。彼[かれ]はわたしの望[のぞ]みをすべて成[な]し遂[と]げる。』"
  23: "神[かみ]は、この人[ひと]の子孫[しそん]から、約束[やくそく]に従[したが]って、イスラエルに救[すく]い主[ぬし]イエスを興[おこ]された。"
  24: "そのお方[かた]が来[こ]られる前[まえ]に、ヨハネはイスラエルの民[たみ]すべてに悔[く]い改[あらた]めの洗礼[せんれい]を宣[の]べ伝[つた]えた。"
  25: "ヨハネがその務[つと]めを終[お]えようとしたとき、こう言[い]った。『わたしを何者[なにもの]だと思[おも]っているのか。わたしはその者[もの]ではない。見[み]よ、わたしの後[あと]に来[く]る方[かた]がいる。わたしはその方[かた]の足[あし]の履物[はきもの]を解[と]く資格[しかく]もない。』"
  26: "兄弟[きょうだい]たち、アブラハムの一族[いちぞく]の子[こ]ら、またあなたがたの中[なか]の神[かみ]を畏[おそ]れる人々[ひとびと]よ。この救[すく]いの言葉[ことば]は、わたしたちに送[おく]られたのだ。"
  27: "エルサレムに住[す]む人々[ひとびと]とその指導者[しどうしゃ]たちは、この方[かた]を知[し]らず、安息日[あんそくび]ごとに読[よ]まれる預言者[よげんしゃ]の言葉[ことば]も理解[りかい]しないまま、この方[かた]を罪[つみ]に定[さだ]めたことによって、その預言[よげん]を成就[じょうじゅ]してしまった。"
  28: "そして、死[し]に当[あた]る罪[つみ]が何[なに]一つ見[み]つからなかったのに、ピラトに彼[かれ]を殺[ころ]すことを求[もと]めた。"
  29: "彼[かれ]について書[か]かれているすべてのことが終[お]わると、彼[かれ]を木[き]から降[お]ろして墓[はか]に納[おさ]めた。"
  30: "しかし、神[かみ]は彼[かれ]を死者[ししゃ]の中[なか]から復活[ふっかつ]させられた。"
  31: "彼[かれ]は、ガリラヤからエルサレムへともに上[のぼ]ってきた人々[ひとびと]に、幾日[いくにち]もの間[あいだ]現[あらわ]れた。その人々[ひとびと]は今[いま]、民[たみ]に対する彼[かれ]の証人[しょうにん]である。"
  32: "わたしたちも、あなたがたに福音[ふくいん]を告[つ]げ知[し]らせる。先祖[せんぞ]たちに与[あた]えられた約束[やくそく]が、"
  33: "神[かみ]がイエスを復活[ふっかつ]させて、わたしたち子[こ]らに成就[じょうじゅ]してくださったということである。第二[だいに]の詩篇[しへん]にもこう書[か]かれている。『あなたはわたしの子[こ]。わたしは今日[きょう]、あなたを生[う]んだ。』"
  34: "神[かみ]が彼[かれ]を死者[ししゃ]の中[なか]から復活[ふっかつ]させ、もはや朽[く]ちることに戻[もど]らないようにされたことについては、こう言[い]われている。『わたしはダビデに約束[やくそく]した聖[せい]なる恵[めぐ]みを、あなたがたに与[あた]える。』"
  35: "それゆえ、ほかの箇所[かしょ]でも言[い]われている。『あなたはその聖[せい]なる者[もの]に朽[く]ちるを見[み]させない。』"
  36: "ダビデは、自分[じぶん]の時代[じだい]に神[かみ]の御心[みこころ]に仕[つか]えて後[のち]、眠[ねむ]りにつき、先祖[せんぞ]たちのところに加[くわ]えられて、朽[く]ちるのを見[み]た。"
  37: "しかし、神[かみ]が復活[ふっかつ]させたお方[かた]は、朽[く]ちるのを見[み]なかった。"
  38: "だから、兄弟[きょうだい]たち、あなたがたは知[し]っておくがよい。この方[かた]によって罪[つみ]の赦[ゆる]しがあなたがたに告[つ]げ知[し]らされている。そして、モーセの律法[りっぽう]ではあなたがたが義[ぎ]とされることのできなかったすべての事[こと]から、"
  39: "この方[かた]を信[しん]じる者[もの]は、すべて義[ぎ]とされるのである。"
  40: "だから、預言者[よげんしゃ]たちによって言[い]われていることが、あなたがたに降[くだ]りかからないように気[き]をつけなさい。"
  41: "『見[み]よ、見下[みくだ]す者[もの]たちよ。驚[おどろ]き、消[き]えうせよ。わたしはあなたがたの時代[じだい]に一[ひとつ]の働[はたら]きを行[おこな]う。それは、人[ひと]があなたがたに告[つ]げても、あなたがたがとうてい信[しん]じないような働[はたら]きである。』」"
  42: "彼[かれ]らが会堂[かいどう]から出[で]て行[い]くとき、人々[ひとびと]は、次[つぎ]の安息日[あんそくび]にもこの言葉[ことば]を話[はな]してほしいと願[ねが]った。"
  43: "会堂[かいどう]が解散[かいさん]すると、多[おお]くのユダヤ人[じん]と、神[かみ]を敬[うやま]う改宗者[かいしゅうしゃ]たちがパウロとバルナバに従[したが]った。二人[ふたり]は彼[かれ]らに語[かた]りかけ、神[かみ]の恵[めぐ]みにとどまるように勧[すす]めた。"
  44: "次[つぎ]の安息日[あんそくび]には、町[まち]の人[ひと]がほぼ全員[ぜんいん]集[あつ]まって、主[しゅ]の言葉[ことば]を聞[き]こうとした。"
  45: "ユダヤ人[じん]たちは群衆[ぐんしゅう]を見[み]てねたみに満[み]ち、パウロの話[はな]すことを冒涜[ぼうとく]しながら反論[はんろん]した。"
  46: "そこでパウロとバルナバは大胆[だいたん]に言[い]った。「神[かみ]の言葉[ことば]は、まずあなたがたに語[かた]られるべきであった。しかし、あなたがたがそれを退[しりぞ]け、自分[じぶん]たちを永遠[えいえん]の命[いのち]にふさわしくない者[もの]としているのだから、見[み]よ、わたしたちは異邦人[いほうじん]のほうへ向[む]かう。"
  47: "主[しゅ]はこう命[めい]じておられるからである。『わたしはあなたを異邦人[いほうじん]の光[ひかり]とし、地[ち]の果[は]てに至[いた]るまで救[すく]いをもたらす者[もの]とした。』」"
  48: "異邦人[いほうじん]たちはこれを聞[き]いて喜[よろこ]び、主[しゅ]の言葉[ことば]をほめたたえた。そして、永遠[えいえん]の命[いのち]に定[さだ]められていた者[もの]は皆[みな]、信[しん]じた。"
  49: "こうして、主[しゅ]の言葉[ことば]はその地方[ちほう]一帯[いったい]に広[ひろ]まって行[い]った。"
  50: "しかし、ユダヤ人[じん]たちは、神[かみ]を敬[うやま]う身分[みぶん]の高[たか]い女[おんな]たちや町[まち]の有力者[ゆうりょくしゃ]たちをそそのかし、パウロとバルナバに対する迫害[はくがい]を起[お]こして、二人[ふたり]をその地方[ちほう]の境[さかい]から追[お]い出[だ]した。"
  51: "二人[ふたり]は彼[かれ]らに向[む]かって足[あし]の塵[ちり]を払[はら]い落[お]として、イコニオンへ行[い]った。"
  52: "弟子[でし]たちは喜[よろこ]びと{聖霊[せいれい]|聖神[せいしん]}とに満[み]たされていた。"

notes:
  1: "Ἡρῴδου τοῦ τετραάρχου — Ирод-тетрарх (Антипа); 領主 передаёт τετράρχης, не «царь». σύντροφος — «воспитанный вместе», ともに育った. Савл до 13:9 — サウロ, как в греч. Σαῦλος."
  2: "Слова Духа Святого — прямая речь, но не красная: красное только для слов Христа. ἀφορίσατε — «отделите, выделите»; 取り分けなさい."
  6: "Βαριησοῦ — «сын Иисуса» (арам.); в ст. 8 назван Ἐλύμας, エリマ. μάγος — 魔術師, не «волхв»."
  7: "ἀνθύπατος — проконсул, правитель сенатской провинции; 総督, как и для Пилата (13:28)."
  9: "Σαῦλος ὁ καὶ Παῦλος — двойное имя; サウロ、すなわちパウロ. С этого стиха в тексте パウロ."
  10: "В критической базе τοῦ κυρίου в квадратных скобках — слово в базе есть, 〔…〕 не ставится."
  11: "ἀχλὺς καὶ σκότος — «мгла и тьма»; 霧と闇."
  16: "Речь в Антиохии Писидийской (16–41) — прямая речь Павла, не красная."
  17: "ὕψωσεν — «возвысил» народ в Египте; μετὰ βραχίονος ὑψηλοῦ — «мышцею высокою»; 高く上げた腕."
  18: "ἐτροποφόρησεν — «снисходил к их нравам, терпел их»; 行いを耐え忍び. В критическом тексте стоит в квадратных скобках, в базе слово есть."
  20: "ὡς ἔτεσιν τετρακοσίοις καὶ πεντήκοντα — 450 лет; в критическом тексте τοῦ при Σαμουήλ в скобках, в базе есть."
  22: "Цитата 1 Цар 13:14 / Пс 88:21; внутри речи Павла — 『…』, не красная."
  25: "Не «я — Христос»: οὐκ εἰμὶ ἐγώ — «я не тот»; わたしはその者ではない."
  27: "κρίναντες ἐπλήρωσαν — «осудив, исполнили» (предсказания пророков); 罪に定めたことによって…成就してしまった."
  33: "Пс 2:7; вторая часть стиха — цитата, 『…』."
  34: "Ис 55:3; τὰ ὅσια Δαυὶδ τὰ πιστά — «верные милости Давида»; ダビデに約束した聖なる恵み."
  35: "Пс 15:10; 朽ちる — διαφθορά, как в ст. 34–37."
  38: "В критическом тексте καὶ при καταγγέλλεται в квадратных скобках — слово в базе есть, 〔…〕 не ставится. Стих обрывается на «…から», продолжение — в 13:39 (как в греч.)."
  41: "Авв (ハバクク) 1:5 (LXX); внутри речи Павла — 『…』. καταφρονηταί — «презирающие»; 見下す者たち."
  42: "В базе стих без ἐκ τῆς συναγωγῆς и без τὰ ἔθνη (у jp-joc «язычники»); добавления не вносим."
  43: "σεβόμενοι προσήλυτοι — «чтущие [Бога] прозелиты»; 神を敬う改宗者."
  46: "στρεφόμεθα εἰς τὰ ἔθνη — «обращаемся к язычникам»."
  47: "Ис 49:6; внутри речи — 『…』."
  52: "πνεύματος ἁγίου — {聖霊|聖神}, как во всём корпусе."
