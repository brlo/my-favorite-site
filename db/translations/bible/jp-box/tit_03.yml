# jp-box, Послание к Титу, глава 3. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 3: покорность властям и кротость ко всем (1–2), «и мы были некогда…» (3),
# ключевое место 3:4–7 — явление благости, баня возрождения и обновление Святым
# Духом, оправдание и наследие; затем добрые дела (8, 14), еретик (9–11),
# поручения, приветствия и заключение (12–15).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет.
# 〔…〕 в главе нет: все слова в базе gr-lxx-byz есть (проверено запросом к базе).
# 3:5 πνεύματος ἁγίου — с ἅγιον, поэтому пара {聖霊|聖神}; 3:6 «этот Дух» —
# повтор подлежащего по-японски, в греч. относительное οὗ (разбор в notes).
# Термины выровнены по 1–2 Тим: πιστὸς ὁ λόγος — この言葉は真実である (1 Тим 4:9),
# ἄμαχος — 争いを好まず (1 Тим 3:3), ἐπιεικής — 寛容 (там же), σωφρόνως — 慎み深く.
# Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

tr_code: jp-box
book: tit
chapter: 3
draft: true

verses:
  1: "あなたは彼[かれ]らに、支配者[しはいしゃ]や権力者[けんりょくしゃ]に従[したが]い、従順[じゅうじゅん]で、すべての善[よ]い行[おこな]いに対[たい]して用意[ようい]ができているように、思[おも]い起[おこ]させなさい。"
  2: "だれも冒涜[ぼうとく]せず、争[あらそ]いを好[この]まず、寛容[かんよう]で、すべての人[ひと]に対[たい]してすべての柔和[じゅうわ]を示[しめ]すように。"
  3: "というのは、わたしたちもかつては、愚[おろ]かで、不[ふ]従[じゅう]で、迷[まよ]い、さまざまな欲[よく]と快楽[かいらく]の奴隷[どれい]となり、悪意[あくい]とねたみのうちに日[ひ]を過[す]ごし、憎[にく]まれ、互[たが]いに憎[にく]み合[あ]っていたからである。"
  4: "しかし、わたしたちの救[すく]い主[ぬし]である神[かみ]の慈[いつく]しみと人[ひと]への愛[あい]が現[あらわ]れたとき、"
  5: "神[かみ]は、わたしたちが行[おこな]った義[ぎ]の行[おこな]いによってではなく、ご自身[じしん]のあわれみによって、わたしたちを救[すく]われた。再生[さいせい]の洗[あら]いと{聖霊[せいれい]|聖神[せいしん]}による更新[こうしん]によってである。"
  6: "この{聖霊[せいれい]|聖神[せいしん]}を、神[かみ]は、わたしたちの救[すく]い主[ぬし]であるイエス・キリストによって、わたしたちに豊[ゆたか]に注[そそ]いでくださった。"
  7: "それは、わたしたちが、その方[かた]の{恵[めぐ]み|恩寵[おんちょう]}によって義[ぎ]とされ、永遠[えいえん]の命[いのち]の希望[きぼう]に従[したが]って相続人[そうぞくにん]となるためである。"
  8: "この言葉[ことば]は真実[しんじつ]である。わたしは、あなたがこれらのことをはっきりと主張[しゅちょう]することを望[のぞ]んでいる。神[かみ]を信[しん]じた者[もの]たちが善[よ]い行[おこな]いを心[こころ]がけ、それに励[はげ]むようにするためである。これらのことは善[よ]く、人[ひと]々[びと]に益[えき]となる。"
  9: "しかし、愚[おろ]かな議[ぎ]論[ろん]と系図[けいず]と争[あらそ]いと律法[りっぽう]についての論争[ろんそう]とは、避[さ]けなさい。それは無益[むえき]で、空[むな]しいことだからである。"
  10: "異端[いたん]の者[もの]には、一度[いちど]、二度[にど]と戒[いまし]めた後[のち]、手[て]を引[ひ]きなさい。"
  11: "そのような者[もの]は道[みち]から外[はず]れ、罪[つみ]を犯[おか]しており、自[みずか]ら自分[じぶん]を断罪[だんざい]していることを知[し]っているからである。"
  12: "わたしがアルテマスかテキコをあなたに遣[つか]わすときには、急[いそ]いでニコポリスにいるわたしのところへ来[き]なさい。わたしはそこで冬[ふゆ]を過[す]ごすことに決[き]めたからである。"
  13: "律法[りっぽう]の専門家[せんもんか]ゼナスとアポロを、十分[じゅうぶん]に支度[したく]を整[ととの]えて送[おく]り出[だ]し、彼[かれ]らに何[なに]も足[た]りないことがないようにしなさい。"
  14: "わたしたちの仲間[なかま]たちにも、必要[ひつよう]なことに備[そな]えて善[よ]い行[おこな]いに励[はげ]むことを学[まな]ばせなさい。それは、彼[かれ]らが実[みの]りを結[むす]ばない者[もの]とならないためである。"
  15: "わたしとともにいる者[もの]たちが、みな、あなたによろしくと言[い]っている。信仰[しんこう]のうちにわたしたちを愛[あい]する人[ひと]々[びと]に、よろしくと言[い]いなさい。{恵[めぐ]み|恩寵[おんちょう]}が、あなたがたすべてとともにありますように。"

notes:
  1: "Ὑπομίμνῃσκε αὐτοὺς — 彼らに…思い起こさせなさい. ἀρχαῖς ἐξουσίαις ὑποτάσσεσθαι — 支配者や権力者に従い (дательный при ὑποτάσσομαι; два разных слова: ἀρχή и ἐξουσία). πειθαρχεῖν — 従順で (πειθαρχέω — слушаться). πρὸς πᾶν ἔργον ἀγαθὸν ἑτοίμους εἶναι — すべての善い行いに対して用意ができている."
  2: "μηδένα βλασφημεῖν — だれも冒涜せず (βλασφημέω о людях — «злословить»). ἀμάχους — 争いを好まず (ἄμαχος, ἁπ. λεγ.; как в 1 Тим 3:3). ἐπιεικεῖς — 寛容で (ἐπιεικής — снисходительный, уступчивый). πᾶσαν ἐνδεικνυμένους πραΰτητα — すべての柔和を示す (πραΰτης — 柔和[じゅうわ], как в корпусе)."
  3: "Ἦμεν γάρ ποτε καὶ ἡμεῖς — わたしたちもかつては. ἀνόητοι, ἀπειθεῖς, πλανώμενοι — 愚かで、不従で、迷い. δουλεύοντες ἐπιθυμίαις καὶ ἡδοναῖς ποικίλαις — さまざまな欲と快楽の奴隷となり. ἐν κακίᾳ καὶ φθόνῳ διάγοντες — 悪意とねたみのうちに日を過ごし. στυγητοί, μισοῦντες ἀλλήλους — 憎まれ、互いに憎み合っていた (страдательное и действительное сохранены)."
  4: "ὅτε δὲ ἡ χρηστότης καὶ ἡ φιλανθρωπία ἐπεφάνη τοῦ σωτῆρος ἡμῶν θεοῦ — わたしたちの救い主である神の慈しみと人への愛が現れたとき (χρηστότης — благость; φιλανθρωπία — человеколюбие, ἁπ. λεγ. в НЗ). Начало ключевого места 3:4–7; стих обрывается на «когда» — сказуемое в ст. 5."
  5: "οὐκ ἐξ ἔργων τῶν ἐν δικαιοσύνῃ ἃ ἐποιήσαμεν ἡμεῖς — わたしたちが行った義の行いによってではなく (отрицание дел не смягчено). κατὰ τὸ αὐτοῦ ἔλεος — ご自身のあわれみによって. λουτρὸν παλιγγενεσίας — 再生の洗い (λουτρόν — баня, омовение; не βάπτισμα, поэтому не 洗礼). ἀνακαίνωσις — 更新 (ἁπ. λεγ.). πνεύματος ἁγίου — πνεῦμα с ἅγιον, поэтому пара {聖霊|聖神}."
  6: "οὗ ἐξέχεεν ἐφ᾽ ἡμᾶς πλουσίως — この聖霊を…豊かに注いでくださった (οὗ — род. от πνεύματος; по-японски подлежащее повторено, иначе связь теряется). διὰ Ἰησοῦ Χριστοῦ τοῦ σωτῆρος ἡμῶν — 救い主であるイエス・キリストによって (посредничество Христа в излиянии Духа)."
  7: "ἵνα δικαιωθέντες τῇ ἐκείνου χάριτι — その方の恵みによって義とされ (δικαιόω — оправдывать). κληρονόμοι γενηθῶμεν — 相続人となる (κληρονομία — 相続[そうぞく]; ср. Рим 8:17). κατ᾽ ἐλπίδα ζωῆς αἰωνίου — 永遠の命の希望に従って."
  8: "Πιστὸς ὁ λόγος — この言葉は真実である (формула пастырских, ср. 1 Тим 1:15). διαβεβαιοῦσθαι — はっきりと主張する (διαβεβαιόομαι — настойчиво утверждать). φροντίζωσιν καλῶν ἔργων προΐστασθαι — 善い行いを心がけ、それに励む (προΐσταμαι — ревностно браться, стоять во главе дела). καλὰ καὶ ὠφέλιμα — 善く、人々に益となる."
  9: "μωρὰς ζητήσεις — 愚かな議論 (ζήτησις — исследование, спор). γενεαλογίας — 系図. ἔριν καὶ μάχας νομικάς — 争いと律法についての論争 (νομικός — связанный с законом). περιΐστασο — 避けなさい (περιΐστημι — обходить стороной). ἀνωφελεῖς καὶ μάταιοι — 無益で空しい."
  10: "αἱρετικὸν ἄνθρωπον — 異端の者 (αἱρετικός — «производящий разделение»; в корпусе 異端[いたん] в Деян 24:5; 28:22). μετὰ μίαν καὶ δευτέραν νουθεσίαν — 一度、二度と戒めた後に (νουθεσία — вразумление). παραιτοῦ — 手を引きなさい (παραιτέομαι — отказываться, уклоняться)."
  11: "ἐξέστραπται — 道から外れ (ἐκστρέφω — совратиться, вывернуться; perfect — состояние). ἁμαρτάνει — 罪を犯しており. ὢν αὐτοκατάκριτος — 自ら自分を断罪している (ἁπ. λεγ., «самоосуждённый»)."
  12: "Ἀρτεμᾶς — アルテマス; Τυχικός — テキコ (ср. Кол 4:7). σπούδασον ἐλθεῖν — 急いで…来なさい. Νικόπολις — ニコポリス. κέκρικα παραχειμάσαι — 冬を過ごすことに決めた (perfect κρίνω — решение принято и остаётся в силе)."
  13: "Ζηνᾶν τὸν νομικόν — 律法の専門家ゼナス (νομικός — знаток закона). Ἀπολλῶν — アポロ (вин. от Ἀπολλώς; в корпусе アポロ). σπουδαίως πρόπεμψον — 十分に支度を整えて送り出し (προπέμπω — снабдить на дорогу). ἵνα μηδὲν αὐτοῖς λείπῃ — 何も足りないことがないように."
  14: "οἱ ἡμέτεροι — わたしたちの仲間たち. καλῶν ἔργων προΐστασθαι εἰς τὰς ἀναγκαίας χρείας — 必要なことに備えて善い行いに励む (те же слова, что в ст. 8). ἵνα μὴ ὦσιν ἄκαρποι — 実りを結ばない者とならないため (ἄκαρπος — бесплодный)."
  15: "Ἀσπάζονταί σε οἱ μετ᾽ ἐμοῦ πάντες — わたしとともにいる者たちが、みな、よろしくと言っている. τοὺς φιλοῦντας ἡμᾶς ἐν πίστει — 信仰のうちにわたしたちを愛する人々. ἡ χάρις μετὰ πάντων ὑμῶν — 恵みが、あなたがたすべてとともに: множественное число, хотя письмо к Титу; ἀμήν в базе нет — не добавлено."
