verses:
  1: "大祭司[だいさいし]が言[い]った。「このことは、そうなのか。」"
  2: "ステファノが言[い]った。「兄弟[きょうだい]たち、父[ちち]たちよ、聞[き]いてください。栄光[えいこう]の神[かみ]は、わたしたちの父[ちち]アブラハムがまだメソポタミアにいて、ハランに移[うつ]る前[まえ]に、彼[かれ]に現[あらわ]れて、"
  3: "言[い]われた。『あなたの地[ち]と親族[しんぞく]から出[で]て、〔父[ちち]の家[いえ]を離[はな]れて、〕わたしが示[しめ]す地[ち]へ来[き]なさい。』"
  4: "そこで、彼[かれ]はカルデアの地[ち]を出[で]て、ハランに住[す]んだ。父[ちち]が死[し]んだ後[のち]、神[かみ]は彼[かれ]をそこから、あなたがたが今[いま]住[す]んでいるこの地[ち]へ移[うつ]された。"
  5: "しかし、この地[ち]で彼[かれ]に嗣業[しぎょう]を、足[あし]を置[お]くほどのものさえも与[あた]えず、ただ、彼[かれ]に子[こ]がまだなかったとき、この地[ち]を彼[かれ]とその子孫[しそん]とに与[あた]えることを約束[やくそく]された。"
  6: "神[かみ]はこう言[い]われた。『彼[かれ]の子孫[しそん]は他[た]の地[ち]に寄留[きりゅう]し、そこで奴隷[どれい]にされ、四百年[よんひゃくねん]の間[あいだ]苦[くる]しめられる。"
  7: "しかし、わたしは、彼[かれ]らを奴隷[どれい]にするその民[たみ]を裁[さば]く、と神[かみ]は言[い]われた。その後[あと]、彼[かれ]らは出[で]て来[き]て、この所[ところ]でわたしに仕[つか]える。』"
  8: "そして、神[かみ]は彼[かれ]に割礼[かつれい]⟨男子[だんし]の包皮[ほうひ]を切[き]り取[と]る、神[かみ]との契約[けいやく]のしるし。⟩の契約[けいやく]を与[あた]えられた。こうして彼[かれ]はイサクをもうけ、八日目[ようかめ]に割礼[かつれい]を行[おこな]った。イサクはヤコブを、ヤコブは十二人[じゅうににん]の族長[ぞくちょう]たちをもうけた。"
  9: "族長[ぞくちょう]たちはヨセフを妬[ねた]んで、彼[かれ]をエジプトに売[う]った。しかし、神[かみ]は彼[かれ]とともにおられ、"
  10: "彼[かれ]をすべての苦難[くなん]から救[すく]い出[だ]し、エジプトの王[おう]ファラオの前[まえ]で彼[かれ]に恵[めぐ]みと知恵[ちえ]とを与[あた]えられた。ファラオは彼[かれ]を立[た]てて、エジプトとその家[いえ]全体[ぜんたい]の支配[しはい]者[しゃ]とした。"
  11: "やがて、エジプトとカナンの全土[ぜんど]に飢饉[ききん]と大[おお]きな苦難[くなん]が来[き]て、わたしたちの先祖[せんぞ]たちは食[た]べ物[もの]を得[え]ることができなかった。"
  12: "ヤコブは、エジプトに穀物[こくもつ]があると聞[き]いて、まずわたしたちの先祖[せんぞ]たちを遣[つか]わした。"
  13: "二度目[にどめ]に彼[かれ]らが行[い]ったとき、ヨセフは兄弟[きょうだい]たちに自分[じぶん]を明[あ]かし、ヨセフの一族[いちぞく]のことがファラオに知[し]られるようになった。"
  14: "ヨセフは人[ひと]を遣[つか]わして、父[ちち]ヤコブと全[ぜん]一族[いちぞく]、七十[ななじゅう]五人[にん]を呼[よ]び寄[よ]せた。"
  15: "ヤコブはエジプトに下[くだ]り、彼[かれ]もわたしたちの先祖[せんぞ]たちも死[し]んだ。"
  16: "そして、シケムに運[はこ]ばれ、アブラハムがシケムのエモルの子[こ]らから銀[ぎん]で買[か]った墓[はか]に葬[ほうむ]られた。"
  17: "神[かみ]がアブラハムに誓[ちか]われた約束[やくそく]の時[とき]が近[ちか]づくにつれ、民[たみ]はエジプトで増[ふ]え、多[おお]くなった。"
  18: "ついに、ヨセフを知[し]らない別[べつ]の王[おう]がエジプトに立[た]った。"
  19: "この王[おう]はわたしたちの民族[みんぞく]に対[たい]して悪[わる]だくみをめぐらし、先祖[せんぞ]たちを苦[くる]しめ、その乳[ち]飲[の]み子[ご]たちを捨[す]てさせて、生[い]き残[のこ]らせないようにした。"
  20: "そのころ、モーセが生[う]まれた。彼[かれ]は神[かみ]の前[まえ]に美[うつく]しい子[こ]であった。三[さん]か月[げつ]の間[あいだ]、父[ちち]の家[いえ]で育[そだ]てられた。"
  21: "そして、捨[す]てられたとき、ファラオの娘[むすめ]が彼[かれ]を拾[ひろ]い上[あ]げ、自分[じぶん]の子[こ]として育[そだ]てた。"
  22: "モーセはエジプトのすべての学問[がくもん]を教[おし]え込[こ]まれ、言葉[ことば]にもわざにも力[ちから]があった。"
  23: "四十歳[よんじゅっさい]になったとき、彼[かれ]は兄弟[きょうだい]であるイスラエルの子[こ]らを訪[たず]ねようと思[おも]いたった。"
  24: "そして、彼[かれ]らの一人[ひとり]が虐[しいた]げられているのを見[み]て、彼[かれ]をかばい、虐[しいた]げられている者[もの]のために仇[あだ]を討[う]って、エジプト人[じん]を打[う]ち殺[ころ]した。"
  25: "彼[かれ]は、神[かみ]が自分[じぶん]の手[て]によって彼[かれ]らに救[すく]いを与[あた]えようとしていることを兄弟[きょうだい]たちが悟[さと]るはずだと思[おも]っていたが、彼[かれ]らは悟[さと]らなかった。"
  26: "翌日[よくじつ]、彼[かれ]らが争[あらそ]っているところに出[で]会[あ]い、仲直[なかなお]りさせようとして言[い]った。『あなたがたは兄弟[きょうだい]ではないか。なぜ互[たがい]に傷[きず]つけ合[あ]うのか。』"
  27: "すると、隣人[りんじん]に傷[きず]つけている者[もの]が彼[かれ]を押[お]しのけて言[い]った。『だれがあなたを、わたしたちの支配[しはい]者[しゃ]や裁判官[さいばんかん]にしたのか。"
  28: "きのうエジプト人[じん]を殺[ころ]したのと同[おな]じように、わたしも殺[ころ]そうというのか。』"
  29: "この言葉[ことば]を聞[き]いて、モーセは逃[に]げ出[だ]し、マディアムの地[ち]に寄留[きりゅう]した。そこで二人[ふたり]の子[こ]をもうけた。"
  30: "四十年[よんじゅうねん]が過[す]ぎて、シナイ山[さん]の荒野[こうや]で、柴[しば]の炎[ほのお]の中[なか]に天使[てんし]が彼[かれ]に現[あらわ]れた。"
  31: "モーセはこれを見[み]て、その幻[まぼろし]に驚[おどろ]いた。そして、よく見[み]ようと近[ちか]づいたとき、主[しゅ]の声[こえ]がした。"
  32: "『わたしはあなたの先祖[せんぞ]の神[かみ]、アブラハムの神[かみ]、イサクの神[かみ]、ヤコブの神[かみ]である。』モーセは震[ふる]えおののいて、見[み]ることをあえてしなかった。"
  33: "主[しゅ]は彼[かれ]に言[い]われた。『あなたの足[あし]の履物[はきもの]を脱[ぬ]ぎなさい。あなたが立[た]っている所[ところ]は聖[せい]なる地[ち]だからである。"
  34: "わたしは、エジプトにいるわたしの民[たみ]の苦[くる]しみを確[たし]かに見[み]、そのうめき声[ごえ]を聞[き]いた。彼[かれ]らを救[すく]い出[だ]すために下[くだ]って来[き]たのである。さあ、行[い]きなさい。わたしはあなたをエジプトへ遣[つか]わす。』"
  35: "このモーセは、『だれがあなたを支配[しはい]者[しゃ]や裁判官[さいばんかん]にしたのか』と言[い]って人々[ひとびと]が拒[こば]んだ者[もの]である。この人[ひと]を神[かみ]は、柴[しば]の中[なか]で彼[かれ]に現[あらわ]れた天使[てんし]の手[て]によって、支配[しはい]者[しゃ]また救[すく]い主[ぬし]として遣[つか]わされた。"
  36: "この人[ひと]は彼[かれ]らを連[つ]れ出[だ]し、エジプトの地[ち]と紅海[こうかい]と荒野[こうや]で、四十年[よんじゅうねん]の間[あいだ]、しるしと奇跡[きせき]を行[おこな]った。"
  37: "このモーセは、イスラエルの子[こ]らに『あなたがたの〔主[しゅ]である〕神[かみ]は、あなたがたの兄弟[きょうだい]の中[なか]から、わたしのような預言者[よげんしゃ]を立[た]てられる。彼[かれ]の言[ことば]を聞[き]きなさい』と言[い]った者[もの]である。"
  38: "この人[ひと]は、荒野[こうや]の集会[しゅうかい]の中[なか]で、シナイ山[さん]で彼[かれ]に語[かた]った天使[てんし]およびわたしたちの先祖[せんぞ]たちとともにいて、わたしたちに伝[つた]えるための生[い]ける言葉[ことば]を受[う]け取[と]った者[もの]である。"
  39: "わたしたちの先祖[せんぞ]たちは彼[かれ]に従[したが]おうとせず、かえって彼[かれ]を拒[こば]み、心[こころ]をエジプトに向[む]けて、"
  40: "アロンに言[い]った。『わたしたちに先立[さきだ]って行[い]く神々[かみがみ]をわたしたちのために造[つく]ってくれ。わたしたちをエジプトの地[ち]から導[みちび]き出[だ]したあのモーセがどうなったのか、わたしたちには分[わ]からないからである。』"
  41: "そのころ彼[かれ]らは子牛[こうし]の像[ぞう]を造[つく]り、その像[ぞう]にいけにえをささげ、自分[じぶん]の手[て]のわざを喜[よろこ]んだ。"
  42: "そこで神[かみ]は彼[かれ]らから顔[かお]を背[そむ]け、彼[かれ]らが天[てん]の軍勢[ぐんぜい]に仕[つか]えるままにされた。預言者[よげんしゃ]たちの書[しょ]に書[か]かれているとおりである。『イスラエルの家[いえ]よ、あなたがたは荒野[こうや]で四十年[よんじゅうねん]の間[あいだ]、わたしにいけにえや供[そな]え物[もの]をささげたことがあったか。"
  43: "あなたがたはモロクの幕屋[まくや]と、あなたがたの神[かみ]レファンの星[ほし]、すなわちあなたがたが拝[おが]むために造[つく]った像[かたち]を担[かつ]いだ。だから、わたしはあなたがたをバビロンの向[む]こうへ移[うつ]す。』"
  44: "わたしたちの先祖[せんぞ]たちには、荒野[こうや]で証[あかし]の幕屋[まくや]があった。これは、モーセに語[かた]った方[かた]が、彼[かれ]が見[み]た型[かた]に従[したが]って造[つく]るように命[めい]じられたものである。"
  45: "わたしたちの先祖[せんぞ]たちは、それを引[ひ]き継[つ]いで、ヨシュアとともに、神[かみ]がわたしたちの先祖[せんぞ]たちの前[まえ]から追[お]い出[だ]された異邦[いほう]の民[たみ]の地[ち]に持[も]ち込[こ]み、ダビデの時代[じだい]まで持[も]ち伝[つた]えた。"
  46: "ダビデは神[かみ]の前[まえ]に恵[めぐ]みを見[み]いだし、ヤコブの神[かみ]のために住[す]まいを求[もと]めた。"
  47: "しかし、家[いえ]を建[た]てたのはソロモンであった。"
  48: "だが、いと高[たか]き方[かた]は手[て]で造[つく]った神殿[しんでん]には住[す]まない。預言者[よげんしゃ]が言[い]うとおりである。"
  49: "『天[てん]はわたしの王座[おうざ]、地[ち]はわたしの足台[あしだい]である。あなたがたはわたしのためにどんな家[いえ]を建[た]てるのか、と主[しゅ]は言[い]われる。わたしの安[やす]まる場所[ばしょ]はどこにあるのか。"
  50: "これらのすべてを造[つく]ったのは、わたしの手[て]ではないか。』"
  51: "かたくなで、心[こころ]にも耳[みみ]にも割礼[かつれい]を受[う]けていない者[もの]たちよ。あなたがたはいつも{聖霊[せいれい]|聖神[せいしん]}に逆[さか]らっている。先祖[せんぞ]たちと同[おな]じである。"
  52: "あなたがたの先祖[せんぞ]たちが迫害[はくがい]しなかった預言者[よげんしゃ]が、一人[ひとり]でもあったか。彼[かれ]らは、あの正[ただ]しい方[かた]が来[く]ることを前[まえ]もって告[つ]げた者[もの]たちを殺[ころ]した。あなたがたは今[いま]、その正[ただ]しい方[かた]を裏切[うらぎ]り、殺[ころ]す者[もの]となった。"
  53: "あなたがたは、天使[てんし]たちの取[と]り次[つ]ぎによって律法[りっぽう]を受[う]け取[と]りながら、それを守[まも]らなかった。」"
  54: "これを聞[き]いて、彼[かれ]らは心[こころ]を切[き]り裂[さ]かれるように怒[いか]り、ステファノに向[む]かって歯[は]を噛[か]み鳴[な]らした。"
  55: "しかし、ステファノは{聖霊[せいれい]|聖神[せいしん]}に満[み]ちて、天[てん]を見[み]つめ、神[かみ]の栄光[えいこう]と、神[かみ]の右[みぎ]に立[た]っておられるイエスを見[み]て、"
  56: "言[い]った。「見[み]なさい。わたしは天[てん]が開[ひら]き、人[ひと]の子[こ]が神[かみ]の右[みぎ]に立[た]っておられるのを見[み]ます。」"
  57: "しかし、彼[かれ]らは大声[おおごえ]で叫[さけ]んで耳[みみ]をふさぎ、一斉[いっせい]に彼[かれ]に押[お]し寄[よ]せた。"
  58: "そして、町[まち]の外[そと]に引[ひ]き出[だ]して石[いし]を投[な]げつけた。証人[しょうにん]たちは自分[じぶん]の上着[うわぎ]を、サウロという名[な]の若者[わかもの]の足元[あしもと]に置[お]いた。"
  59: "彼[かれ]らがステファノに石[いし]を投[な]げつける間[あいだ]、ステファノは祈[いの]って言[い]った。「主[しゅ]イエスよ、わたしの霊[れい]を受[う]け入[い]れてください。」"
  60: "そして、ひざまずいて大声[おおごえ]で叫[さけ]んだ。「主[しゅ]よ、この罪[つみ]を彼[かれ]らに負[お]わせないでください。」こう言[い]って、彼[かれ]は眠[ねむ]りについた。"

notes:
  1: "ἀρχιερεύς — 大祭司; вопрос первосвященника, не красный."
  2: "ὁ θεὸς τῆς δόξης — «Бог славы»; 栄光の神. Речь Стефана идёт от 7:2 до 7:53 и не красная."
  3: "В критической базе нет ἐκ τοῦ οἴκου τοῦ πατρός σου; церковный текст (Елизаветинская «и из дома отца твоего», jp-joc 父の家を離れて) добавляет — 〔父の家を離れて、〕."
  5: "κληρονομία — 嗣業; βῆμα ποδός — 足を置くほど."
  6: "ἔτη τετρακόσια — 四百年."
  8: "Сноска на 割礼 — первое упоминание в Деяниях (в Лк 1:59, 2:21 осталось без пояснения). πατριάρχαι — 族長."
  9: "ζηλώσαντες — 妬んで."
  14: "ψυχαῖς ἑβδομήκοντα πέντε — 七十五人."
  16: "Συχέμ — シケム; Ἐμμώρ — エモル."
  19: "ἔκθετα ποιεῖν — «выбрасывать»; 捨てさせて."
  22: "ἐπαιδεύθη… πάσῃ σοφίᾳ Αἰγυπτίων — エジプトのすべての学問を教え込まれ."
  23: "τεσσαρακονταετὴς χρόνος — «сорокалетнее время»; 四十歳."
  30: "ἄγγελος ἐν φλογὶ πυρὸς βάτου — «ангел в пламени огня терновника»; 柴の炎の中に天使 (у jp-joc 主の使; в базе ἄγγελος без κυρίου)."
  37: "В критической базе ὁ θεός; церковный текст (Елизаветинская «Господь Бог ваш», jp-joc 主なる神) читает κύριος ὁ θεός — 〔主である〕 при 神 (так же 20:28)."
  45: "Ἰησοῦς здесь — Иисус Навин; ヨシュア, чтобы не смешивать с Иисусом Христом (у jp-joc イイスス)."
  46: "В критической базе τῷ οἴκῳ Ἰακώβ («дому Иакова»); церковный текст (Елизаветинская «Богу Иакова», jp-joc イアコフの神) читает τῷ θεῷ Ἰακώβ — ヤコブの神, без 〔〕: замена."
  51: "ἀπερίτμητοι καρδίαις καὶ τοῖς ὠσίν — «необрезанные сердцем и ушами»; 心にも耳にも割礼を受けていない."
  56: "Слова Стефана, не красные: красное — только слова Христа, а здесь Он не говорит."
  60: "θεὶς δὲ τὰ γόνατα — ひざまずいて; ἐκοιμήθη — 眠りについた."
