# jp-box, Деяния апостолов, глава 7. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 7: речь Стефана перед синедрионом (1–53): Авраам (2–8), Иосиф (9–16),
# Моисей (17–43), скиния и храм (44–50), обличение (51–53);
# убиение Стефана (54–60).
# Красного в главе нет: вся речь 7:2–53 — слова Стефана, а не Христа;
# 7:56 («вижу Сына Человеческого») — тоже слова Стефана, не красные.
# 〔…〕: 7:3 — церковное «и из дома отца твоего»; 7:37 — церковное κύριος при ὁ θεός
# (в базе только ὁ θεός). Замена 7:46 (家 → 神) дана в церковной форме без 〔…〕.
# Сноска: 割礼 (7:8) — первое упоминание в Деяниях.
# jp-ni не использовался.

