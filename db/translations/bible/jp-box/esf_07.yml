# jp-box, Есфирь, глава 7. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для Есфири нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 7: второй пир (1–2), просьба Есфири и обвинение Амана (3–6), смятение царя
# и Амана (7–8), слово Бугана о столбе (9), казнь Амана (10).
# Прямая речь: царь (2, 5, 8, 9), Есфирь (3–4, 6), Буган (9). Красного и синего нет.
# Нумерация по gr: 10 стихов; деление совпадает с csl-ru и ru.
# 〔…〕 нет: все стихи есть в gr-lxx-byz. Слав. добавления («со гневом» в 7,
# пояснение о Бугане в 9) внесены в основной текст без скобок.
# Сносок ⟨…⟩ нет: 宦官, 王妃, 酒宴, 寝台, 宮廷, 王笏, キュビト уже в корпусе.
# Имена — транслитерация греческого (LXX): アルタシャスタ, エステル, モルデカイ,
# アマン, ブガタン (Βουγαθαν; в ru «Харбона», в евр. חַרְבוֹנָא).

