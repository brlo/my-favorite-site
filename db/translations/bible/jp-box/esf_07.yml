verses:
  1: "王[おう]とアマンは、王妃[おうひ]のもとに入[はい]り、ともに酒[さか]を酌[く]み交[か]わした。"
  2: "二日目[ふつかめ]の酒宴[しゅえん]の席[せき]で、王[おう]はエステルに言[い]った。「エステル王妃[おうひ]、何[なに]を望[のぞ]むのか。あなたの願[ねが]いとは何[なん]か、あなたの求[もと]めとは何[なん]か。わたしの王国[おうこく]の半[なか]ばに至[いた]るまででも、それはあなたに与[あた]えられる。」"
  3: "エステルは答[こた]えて言[い]った。「もしわたしが王[おう]の前[まえ]に恵[めぐ]みを見出[みいだ]したのなら、王[おう]よ、わたしの願[ねが]いによってわたしの命[いのち]を、わたしの求[もと]めによってわたしの民[たみ]をお与[あた]えください。"
  4: "わたしたちは、わたしも民[たみ]も、滅[ほろ]びと略奪[りゃくだつ]と奴隷[どれい]とに売[う]られた。わたしたちも、わたしたちの子[こ]どもたちも、男[おとこ]奴隷と女[おんな]奴隷となるために。わたしは黙[だま]っていた。この中傷[ちゅうしょう]する者[もの]は、王[おう]の宮廷[きゅうてい]に値[あたい]しないからである。」"
  5: "王[おう]は言[い]った。「その者[もの]はだれか。この事[こと]を敢[あ]えて行[おこな]ったのは。」"
  6: "エステルは言[い]った。「その人[ひと]は敵[てき]であり、この悪[あ]しきアマンである。」アマンは、王[おう]と王妃[おうひ]とによって、かき乱された。"
  7: "王[おう]は怒[いか]りをもって酒宴[しゅえん]の席[せき]を立[た]ち、庭[にわ]へ出[で]て行[い]った。アマンは王妃[おうひ]に助[たす]けを求[もと]めていた。自分[じぶん]が災[わざわ]いの中[なか]にいるのを見[み]ていたからである。"
  8: "王[おう]が庭[にわ]から戻[もど]ったとき、アマンは、エステルが身[み]を横[よこ]たえている寝台[しんだい]に伏[ふ]して、王妃[おうひ]に願[ねが]っていた。王[おう]は言[い]った。「わたしの家[いえ]で、その女[おんな]を力[ちから]ずくで辱[はずかし]めようというのか。」アマンはこれを聞[き]いて、顔[かお]を変[か]えた。"
  9: "宦官[かんがん]の一人[ひとり]ブガタンが王[おう]に言[い]った。「見[み]よ、アマンが、王[おう]のためによいことを告[つ]げたモルデカイのために用意[ようい]した柱[はしら]が、アマンの家[いえ]に立[た]ててある。その高[たか]さは五十[ごじゅう]キュビトである。」このブガタンは、アマンが彼[かれ]を王の食卓[しょくたく]に招[まね]いたとき、その柱をアマンの家で見て、これを知[し]っていた。また、これについて若[わか]い者[もの]の一人に問[と]いただし、その企[くわだ]てを悟[さと]っていた。王[おう]は言った。「彼をその柱にかけよ。」"
  10: "アマンは、自分[じぶん]がモルデカイのために用意[ようい]した柱[はしら]に掛[か]けられた。そのとき、王[おう]の怒[いか]りは静[しず]まった。"

notes:
  1: "συμπιεῖν τῇ βασιλίσσῃ — «пить вместе с царицей» (συμπίνω; датив при глаголе — «у царицы, с царицей»). εἰσῆλθεν — «вошёл»; в тексте соединено: вошли и пили вместе, без добавления «в дом». Слав. «вниде же царь и аман пировати со царицею»; ru добавляет имя («у Есфири царицы»), в LXX его нет."
  2: "τῇ δευτέρᾳ ἡμέρᾳ — «во второй день» (второго дня пира). Τί ἐστιν — «что [такое]?», краткий вопрос, передан 何を望むのか. αἴτημα — «прошение», ἀξίωμα — «ходатайство, просьба» (в тексте 願い / 求め, чтобы различать два греч. слова); слав. «прошение… моление». ἕως τοῦ ἡμίσους τῆς βασιλείας μου — «до половины царства моего», обычная формула царской щедрости (ср. Мк 6:23)."
  3: "ἀποκριθεῖσα εἶπεν — «ответив, сказала». εὗρον χάριν ἐνώπιον τοῦ βασιλέως — «обрела благодать пред царём». δοθήτω ἡ ψυχή μου τῷ αἰτήματί μου — «да будет дана душа моя по прошению моему»: датив основания; слав. «да дастся душа моя прошению моему». Обращение βασιλεῦ («царю») есть в слав. («пред очима твоима, царю»), в LXX нет — по паритету внесено в текст без скобок. Речь продолжается в ст. 4."
  4: "ἐπράθημεν — «мы проданы» (πιπράσκω). εἰς ἀπώλειαν καὶ διαρπαγὴν καὶ δουλείαν — «на погибель, расхищение и рабство»; εἰς παῖδας καὶ παιδίσκας — «в рабов и рабынь». καὶ παρήκουσα — «и я промолчала» (παρακούω букв. «ослышаться, не слушать»; слав. «небрегох»), отсюда 黙っていた. οὐ γὰρ ἄξιος ὁ διάβολος τῆς αὐλῆς τοῦ βασιλέως — «ибо не достоин клеветник двора царя»: διάβολος здесь «клеветник», не 悪魔. ru перестраивает стих по МТ («если бы проданы были в рабы… я молчала бы»); в тексте LXX и слав."
  5: "τίς οὗτος, ὅστις ἐτόλμησεν ποιῆσαι τὸ πρᾶγμα τοῦτο — «кто это, кто дерзнул сделать это дело» (τολμάω, πρᾶγμα). Слав. «кто есть сей, иже дерзну сотворити вещь сию?». ru добавляет «и где тот» и «в сердце своем» — масоретское, в текст не внесено."
  6: "ἄνθρωπος ἐχθρὸς Αμαν ὁ πονηρὸς οὗτος — букв. «человек враг — Аман, этот злой»: аппозиция без глагола, передана двумя сказуемыми (敵であり…である). ἐταράχθη ἀπὸ τοῦ βασιλέως καὶ τῆς βασιλίσσης — «приведён в смятение царём и царицей» (ταράσσω; ἀπό с род. — причина). Слав. «смятеся от царя и царицы»."
  7: "ἐξανέστη ἐκ τοῦ συμποσίου εἰς τὸν κῆπον — «встал с пира [и пошёл] в сад» (ἐξανίστημι, συμπόσιον, κῆπος). παρῃτεῖτο τὴν βασίλισσαν — «умолял царицу» (παραιτέομαι, имперфект — длительное действие). ἑώρα γὰρ ἑαυτὸν ἐν κακοῖς ὄντα — «ибо видел себя в бедах». Слав. «воста со гневом от пира (и иде) в вертоград»: «со гневом» в LXX нет, по паритету внесено в текст без скобок; «(и иде)» в слав. в скобках."
  8: "ἐπιπεπτώκει ἐπὶ τὴν κλίνην — «припал к ложу» (ἐπιπίπτω, κλίνη; плюсквамперфект). ἀξιῶν τὴν βασίλισσαν — «умоляя царицу». Ὥστε καὶ τὴν γυναῖκα βιάζῃ ἐν τῇ οἰκίᾳ μου — «так что и женщину насилуешь в доме моём?» (βιάζω): в греч. γυναῖκα — «женщину», без «царицу»; Син. уточняет по МТ, у нас その女. διετράπη τῷ προσώπῳ — «изменился лицом» (διατρέπω), в тексте 顔を変えた."
  9: "εἶπεν δὲ Βουγαθαν εἷς τῶν εὐνούχων — «сказал Буган, один из евнухов» (Βουγαθαν; в ru «Харбона», в евр. חַרְבוֹנָא). ξύλον — «дерево, столб» (в тексте 柱, как в 5:14 и 6:4). ὤρθωται ἐν τοῖς Αμαν — тёмное место: «поставлено у Амана [в доме]»; слав. «стоит в дому аманове возвышено»; πηχῶν πεντήκοντα — «пятидесяти локтей». Слав. добавляет пояснение, что Буган знал о столбе, видел его в доме Амана, когда тот звал его на царский обед, и, расспросив одного из отроков, уразумел замысел; в LXX этого нет — по паритету внесено в текст без скобок (после прямой речи). Σταυρωθήτω ἐπ᾽ αὐτοῦ — «да будет повешен на нём»."
  10: "ἐκρεμάσθη ἐπὶ τοῦ ξύλου — «был повешен на дереве» (κρεμάννυμι). ὃ ἡτοίμασεν Μαρδοχαίῳ — «которое приготовил Мардохею». ἐκόπασεν τοῦ θυμοῦ — «утих от ярости» (κόπτω с род. — «перестать»); слав. «утолися от ярости». Син. «и гнев царя утих» — то же чтение."
