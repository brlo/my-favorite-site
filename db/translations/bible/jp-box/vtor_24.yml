# jp-box, Второзаконие, глава 24. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — csl-ru; ru — только для понимания.
# jp-joc в этой главе отсутствует. Язык — современный 常体; порядок членов и
# деление на клаузы — по греческому.
# Глава 24: жатва и виноградник ближнего (1–2), развод (3–6), новобрачный (7),
# залог жёрнова (8), похищение человека (9), проказа и Мариам (10–11),
# залог и плата (12–17), ответственность каждого (18), суд для пришельца,
# сироты и вдовы (19), остатки жатвы, маслин и винограда (20–24).
# Вся глава — речь Моисея: 「…」 (1–24). Вложенной речи нет. Красного нет.
# Нумерация: 24 стиха, как в gr-lxx-byz; у csl-ru и ru 22 стиха. Их 23:24–25
# («жатва» и «виноградник») в gr-lxx-byz стоят как 24:1–2, поэтому gr 24:3–24 =
# csl 24:1–22. Держимся gr.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (проверено по выгрузке и базе).
# Сносок ⟨…⟩ нет: 離縁状, 寄留者, 孤児, やもめ понятны по контексту и корпусу.
# jp-ni не использовался.

