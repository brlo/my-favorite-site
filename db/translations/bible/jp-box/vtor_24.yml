chapter: 24
draft: true

verses:
  1: "「あなたが隣人[りんじん]の刈[か]り入[い]れの畑[はたけ]に入[はい]るときは、手[て]で穂[ほ]を摘[つ]み取[と]ってよいが、隣人の刈り入れに鎌[かま]を入れてはならない。"
  2: "隣人[りんじん]のぶどう畑[ばたけ]に入[はい]ったなら、心[こころ]の満[み]ちるまでぶどうを食[た]べてよいが、器[うつわ]に入[い]れてはならない。"
  3: "もしある人[ひと]が女[おんな]を妻[つま]に迎[むか]え、彼女[かのじょ]と暮[く]らすようになったのち、彼女が彼の目[め]にかなわず、彼女のうちに恥[は]ずべき事[こと]を見[み]つけたので、離縁[りえん]状[じょう]を書[か]いて彼女の手[て]に渡[わた]し、彼女を自分の家[いえ]から去[さ]らせるなら、"
  4: "彼女[かのじょ]が去[さ]って行[い]き、ほかの男[おとこ]の妻[つま]となったなら、"
  5: "そのあとの夫[おっと]が彼女[かのじょ]を憎[にく]んで離縁[りえん]状[じょう]を書[か]き、彼女の手[て]に渡[わた]して自分の家[いえ]から去[さ]らせるか、あるいは、彼女を妻[つま]に迎[むか]えたそのあとの夫が死[し]ぬなら、"
  6: "彼女[かのじょ]を去[さ]らせた先[さき]の夫[おっと]は、彼女が汚[けが]れたのち、再[ふたた]び彼女を自分[じぶん]の妻[つま]に迎[むか]えることはできない。それはあなたの神[かみ]である主[しゅ]の前[まえ]に忌[い]み嫌[きら]われることだからである。あなたの神である主が嗣業[しぎょう]としてあなたがたに与[あた]える地[ち]を汚してはならない。"
  7: "もしある人[ひと]が新[あら]たに妻[つま]を迎[むか]えたなら、戦[いくさ]に出[で]てはならない。彼にどんな務[つと]めも負[お]わせてはならない。彼は一年[いちねん]の間[あいだ]、自分[じぶん]の家[いえ]で自由[じゆう]に過[す]ごし、自分が迎えた妻を喜[よろこ]ばせなさい。"
  8: "挽[ひ]き臼[うす]も上臼[うわうす]も、質[しち]に取[と]ってはならない。それは命[いのち]そのものを質に取ることだからである。"
  9: "人[ひと]が、自分の兄弟[きょうだい]であるイスラエルの子[こ]らの一人[ひとり]をさらって奴隷[どれい]とし、売[う]り飛[と]ばしたのが見[み]つかったなら、その盗人[ぬすびと]は死[し]ななければならない。あなたはあなたがたの間[あいだ]から悪[あく]を除[のぞ]き去[さ]りなさい。"
  10: "重[おも]い皮膚病[ひふびょう]の患部[かんぶ]については、自分[じぶん]をよく注意[ちゅうい]しなさい。祭司[さいし]であるレビ人[びと]たちがあなたがたに告[つ]げるすべての律法[りっぽう]に従[したが]って、細[こま]やかに行[おこな]いなさい。わたしがあなたがたに命[めい]じたとおりに、守[まも]って行いなさい。"
  11: "あなたがたがエジプトから出[で]て来[く]るとき、道[みち]で、あなたの神[かみ]である主[しゅ]がミリアムに行[おこな]われたことを思[おも]い起[おこ]しなさい。"
  12: "あなたの隣人[りんじん]に、どんな借金[しゃっきん]があっても、あなたは彼[かれ]の家[いえ]に入[はい]って、その質[しち]を取[と]ってはならない。"
  13: "外[そと]に立[た]っていなさい。借[か]りがある人[ひと]が、その質[しち]をあなたのところへ外に持[も]って来[く]るであろう。"
  14: "もしその人[ひと]が貧[まず]しいなら、その質[しち]を手[て]もとに置[お]いたまま眠[ねむ]ってはならない。"
  15: "日[ひ]の沈[しず]むころ、必[かなら]ずその質[しち]を彼[かれ]に返[かえ]しなさい。彼は自分の衣[ころも]を着[き]て眠り、あなたを祝福[しゅくふく]するであろう。それはあなたの神[かみ]である主[しゅ]の前[まえ]で、あなたの施[ほどこ]しと認[みと]められる。"
  16: "あなたの兄弟[きょうだい]のうちの貧[まず]しい者[もの]や乏[とぼ]しい者、またあなたの町々[まちまち]にいる寄留者[きりゅうしゃ]のうちの貧しい者や乏しい者の賃金[ちんぎん]を、不当[ふとう]に扱[あつか]ってはならない。"
  17: "その日[ひ]のうちに彼の賃金[ちんぎん]を払[はら]いなさい。太陽[たいよう]が彼の上[うえ]に沈[しず]む前に払うのである。彼は貧[まず]しく、その賃金に望[のぞ]みを置[お]いているからである。彼があなたのことを主[しゅ]に訴[うった]えて、あなたに罪[つみ]が帰[き]さないためである。"
  18: "父[ちち]たちが子[こ]どものために死[し]ぬことはなく、子どもが父たちのために死ぬこともない。それぞれが自分[じぶん]の罪[つみ]のために死ぬのである。"
  19: "寄留者[きりゅうしゃ]、孤児[こじ]、やもめの裁[さば]きを曲[ま]げてはならない。やもめの衣[ころも]を質[しち]に取[と]ってはならない。"
  20: "あなたはエジプトの地[ち]で奴隷[どれい]であったこと、そしてあなたの神[かみ]である主[しゅ]がそこからあなたを贖[あがな]い出[だ]されたことを思[おも]い起[おこ]しなさい。だからこそ、わたしはあなたにこのことを命[めい]じるのである。"
  21: "あなたの畑[はたけ]で刈[か]り入[い]れをして、束[たば]を一[ひと]つ畑に忘[わす]れたなら、それを取[と]りに戻[もど]ってはならない。それは貧[まず]しい者[もの]、寄留者[きりゅうしゃ]、孤児[こじ]、やもめのものとなる。あなたの神[かみ]である主[しゅ]が、あなたの手[て]のすべての業[わざ]を祝福[しゅくふく]してくださるためである。"
  22: "あなたがオリーブを打[う]ち落[お]として集[あつ]めるとき、後[あと]に残[のこ]った実[み]を拾[ひろ]い直[なお]しに戻[もど]ってはならない。それは寄留者[きりゅうしゃ]、孤児[こじ]、やもめのものとなる。あなたはエジプトの地[ち]で奴隷[どれい]であったことを思[おも]い起[おこ]しなさい。だからこそ、わたしはあなたにこのことを命[めい]じるのである。"
  23: "あなたがぶどう畑[ばたけ]のぶどうを摘[つ]み取[と]るとき、後[あと]に残[のこ]った房[ふさ]を摘み直[なお]しに戻[もど]ってはならない。それは寄留者[きりゅうしゃ]、孤児[こじ]、やもめのものとなる。"
  24: "あなたはエジプトの地[ち]で奴隷[どれい]であったこと、そしてあなたの神[かみ]である主[しゅ]がそこからあなたを贖[あがな]い出[だ]されたことを思[おも]い起[おこ]しなさい。だからこそ、わたしはあなたにこのことを命[めい]じるのである。」"

notes:
  1: "ἀμητός — жатва; στάχυς — колос. συλλέξεις ἐν ταῖς χερσίν — «соберёшь руками». δρέπανον οὐ μὴ ἐπιβάλῃς — «серпа не наложишь» (усиленное отрицание)."
  2: "ἀμπελών — виноградник; σταφυλή — виноградная гроздь. ὅσον ψυχὴν ἐμπλησθῆναι — «сколько душа насытится». ἄγγος — сосуд."
  3: "βιβλίον ἀποστασίου — «книга развода» (離縁状). ἄσχημον πρᾶγμα — «срамное дело»; в тексте 恥ずべきこと, без смягчения. οὐχ εὕρῃ χάριν — «не найдёт благодати», т.е. не будет угодна."
  4: "ἀπελθοῦσα — «уйдя»; γένηται ἀνδρὶ ἑτέρῳ — «станет женой другого»."
  5: "ὁ ἀνὴρ ὁ ἔσχατος — «последний муж»; βιβλίον ἀποστασίου — разводное письмо. ἢ ἀποθάνῃ — «или умрёт»."
  6: "ὁ ἀνὴρ ὁ πρότερος — «первый муж». μετὰ τὸ μιανθῆναι αὐτήν — «после осквернения её»; в тексте 汚れたのち. βδέλυγμα — мерзость. οὐ μιανεῖτε τὴν γῆν — «не оскверните землю»."
  7: "προσφάτως — «недавно». οὐκ ἐπιβληθήσεται αὐτῷ οὐδὲν πρᾶγμα — «не будет возложено на него никакое дело». ἀθῷος — «свободный, невиновный». εὐφρανεῖ — «будет веселить»."
  8: "μύλος — жёрнов; ἐπιμύλιον — верхний жёрнов. ἐνεχυράσεις — «возьмёшь в залог» (ἐνεχυράζω). ψυχήν — «душу», т.е. жизнь: без жёрнова нельзя молоть и жить."
  9: "ἁλῷ — «будет пойман» (ἁλίσκομαι). κλέπτων ψυχήν — «крадущий душу», т.е. похищающий человека. καταδυναστεύσας — «поработив» (καταδυναστεύω). ἀποδῶται — «продаст»."
  10: "ἁφὴ τῆς λέπρας — «поражение проказы»; в тексте 重い皮膚病の患部. φυλάξῃ σφόδρα ποιεῖν — «тщательно соблюдай делать». ἀναγγείλωσιν — «объявят»."
  11: "μνήσθητι — «помни». Μαριαμ — Мариам (в тексте ミリアム); речь о наказании за ропот (Числ 12)."
  12: "ὀφείλημα — долг; ἐνέχυρον — залог. οὐκ εἰσελεύσῃ εἰς τὴν οἰκίαν — «не войдёшь в дом»."
  13: "ἔξω στήσῃ — «стань вне». ἐξοίσει σοι τὸ ἐνέχυρον — «вынесет тебе залог»."
  14: "πένηται — «беден» (πένωμαι). οὐ κοιμηθήσῃ ἐν τῷ ἐνεχύρῳ — «не будешь спать в залоге его», т.е. не оставишь у себя его одежду."
  15: "ἀποδόσει ἀποδώσεις — «отдавая отдашь», усиление. περὶ δυσμὰς ἡλίου — «при захождении солнца». ἐλεημοσύνη — «милостыня, милость»; в тексте 施し."
  16: "ἀπαδικήσεις — «обидишь, обойдёшь несправедливо» (ἀδικέω); μισθός — плата. πένης καὶ ἐνδεής — бедный и нуждающийся. προσήλυτοι — пришельцы (寄留者)."
  17: "αὐθημερόν — «в тот же день». οὐκ ἐπιδύσεται ὁ ἥλιος ἐπ᾽ αὐτῷ — «не зайдёт солнце над ним». ἐν αὐτῷ ἔχει τὴν ἐλπίδα — «в ней имеет надежду». καταβοήσεται — «возопит против» (καταβοάω)."
  18: "οὐκ ἀποθανοῦνται πατέρες ὑπὲρ τέκνων — «не умрут отцы за детей». ἕκαστος τῇ ἑαυτοῦ ἁμαρτίᾳ — «каждый в своём грехе»."
  19: "ἐκκλινεῖς κρίσιν — «уклонишь суд» (ἐκκλίνω); προσηλύτου, ὀρφανοῦ, χήρας — пришельца, сироты, вдовы. ἐνεχυράσεις ἱμάτιον χήρας — «возьмёшь в залог одежду вдовы»."
  20: "οἰκέτης — раб, слуга (奴隷). ἐλυτρώσατό σε — «искупил тебя» (λυτρόω). ἐντέλλομαι — «заповедую»."
  21: "ἀμήσῃς ἀμητόν — «пожнёшь жатву». ἐπιλάθῃ δράγμα — «забудешь сноп» (δράγμα). ἐπαναστραφήσῃ — «возвратишься». πτωχός — бедный."
  22: "ἐλαιαλογήσῃς — «соберёшь маслины» (ἐλαιαλογέω). καλαμήσασθαι — «подобрать остатки» (καλαμάομαι). τὰ ὀπίσω σου — «оставшееся за тобой»."
  23: "τρυγήσῃς — «соберёшь виноград» (τρυγάω). οὐκ ἐπανατρυγήσεις — «не будешь вторично обирать». τὰ ὀπίσω σου — остатки за тобой."
  24: "Повтор 24:20: καὶ μνησθήσῃ ὅτι οἰκέτης ἦσθα… — «и помни, что рабом был ты». ἐντέλλομαι — заповедую. Повтор формулы в LXX сохранён."
