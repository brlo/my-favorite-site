# jp-box, 3-я Царств, глава 11. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); второй свидетель — церковнославянский
# (csl-ru); ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет,
# jp-ni не источник (только проверка tmp/sim_jp.rb).
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 11: отступление Соломона (1–13), противники Адер (14–22) и Разон (23–25),
# Иеровоам и пророчество Ахии (26–39), бегство в Египет и смерть Соломона (40–43).
# Речи — 「…」: Господь (11–13), Адер (21, 22), фараон (22), Ахия (31–39, слова Господа
# внутри — 『…』, они продолжаются до ст. 39, где закрываются обе кавычки). Красного нет.
# Паритет: csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes.
# Нумерация — по gr-lxx-byz, 43 стиха; в LXX и слав. содержание ст. 3–8 и 14, 23–24, 39
# разложено по-разному при том же материале: у гр. ст. 3, 23, 24, 39 пусты («.»), их текст
# (число жён, Разон, «озлоблю род Давидов») в LXX стоит в соседних стихах или сжат —
# перевод по csl, повторять один и тот же отдел дважды не стали (notes).
# 〔…〕 нет. Сносок ⟨…⟩ нет: 偶像, 高い所, 王杖, 預言者, 衣 уже в корпусе или пояснены в notes.
