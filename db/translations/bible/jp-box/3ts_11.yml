verses:
  1: "ソロモン王[おう]は女[おんな]を愛[あい]する者[もの]であった。彼は異国[いこく]の女たち、すなわちファラオの娘[むすめ]、モアブの女たち、アンモンの女たち、シリアの女たち、エドムの女たち、ヘトの女たち、アモリの女たちを娶[めと]った。"
  2: "主[しゅ]がイスラエルの子[こ]らに、「あなたがたは彼[かれ]らのところに入[はい]ってはならない。彼らもあなたがたのところに入ってはならない。彼らがあなたがたの心[こころ]をその偶像[ぐうぞう]の後[あと]にそらせないためである」と言[い]われたそれらの民[たみ]のうちから、ソロモンは愛[あい]するために彼らに結[むす]びついた。"
  3: "彼[かれ]には七百人[ななひゃくにん]の王妃[おうひ]と三百人[さんびゃくにん]の側女[そばめ]があった。"
  4: "ソロモンが老[お]いたころ、その心[こころ]は父[ちち]ダビデの心のように、彼[かれ]の神[かみ]である主[しゅ]とともに全[まった]きものではなかった。異国[いこく]の女[おんな]たちは彼の心を自分[じぶん]たちの神々[かみがみ]の後[あと]にそらせた。"
  5: "ソロモンはシドン人[じん]の憎[にく]むべきものアスタルテに、また彼[かれ]らの王[おう]、アンモンの子[こ]らの偶像[ぐうぞう]に従[したが]って歩[あゆ]んだ。"
  6: "ソロモンは主[しゅ]の目[め]に悪[あく]を行[おこな]い、父[ちち]ダビデのように主に従[したが]って歩[あゆ]まなかった。"
  7: "そこでソロモンは、モアブの偶像[ぐうぞう]であるハモスに、またアンモンの子[こ]らの偶像である彼[かれ]らの王[おう]に、またシドン人[じん]の憎[にく]むべきものアスタルテに、エルサレムの前[まえ]の山[やま]に高[たか]い所[ところ]を建[た]てた。"
  8: "彼[かれ]は異国[いこく]の妻[つま]たちすべてのために、このようにした。彼女[かのじょ]たちは自分[じぶん]の偶像[ぐうぞう]に香[こう]を焚[た]き、いけにえを献[ささ]げていた。"
  9: "主[しゅ]はソロモンに怒[いか]った。彼[かれ]が心[こころ]を、二度[にど]彼に現[あらわ]れたイスラエルの神[かみ]である主からそらせたからである。"
  10: "しかも、主[しゅ]は二度[にど]彼[かれ]に命[めい]じて、ほかの神々[かみがみ]に従[したが]って歩[あゆ]むことを一切[いっさい]禁[きん]じ、自分[じぶん]が命じたことを守[まも]って行[おこな]うようにと言[い]われたのである。"
  11: "主[しゅ]はソロモンに言[い]われた。「これらのことがあなたとともに起[お]こり、あなたが、わたしが命[めい]じたわたしの戒[いまし]めとわたしの掟[おきて]を守[まも]らなかったので、わたしはあなたの王国[おうこく]をあなたの手[て]から引[ひ]き裂[さ]き、それをあなたの僕[しもべ]に与[あた]える。"
  12: "しかし、あなたの日[ひ]にはそれをしない。あなたの父[ちち]ダビデのゆえに。わたしはそれをあなたの子[こ]の手[て]から取[と]り上[あ]げる。"
  13: "ただし、その王国[おうこく]の全部[ぜんぶ]を取[と]るのではない。わたしの僕[しもべ]ダビデのゆえに、またわたしが選[えら]んだ町[まち]エルサレムのゆえに、あなたの子[こ]に一[ひと]つの王杖[おうじょう]を与[あた]える。」"
  14: "主[しゅ]はソロモンに敵対[てきたい]する者[もの]を起[お]こした。エドム人[じん]のアデル、すなわちエドムの王[おう]の血筋[ちすじ]の者である。"
  15: "ダビデがエドムを滅[ほろ]ぼしたときのこと、軍[ぐん]の長[ちょう]ヨアブが殺[ころ]された者[もの]たちを葬[ほうむ]るために行[い]ったとき、彼[かれ]らはエドムの地[ち]ですべての男[おとこ]を打[う]ち殺した。"
  16: "ヨアブとイスラエルはすべて、六[むっ]か月[げつ]そこに、エドムの地[ち]にとどまった。エドムのすべての男[おとこ]を滅[ほろ]ぼし尽[つ]くすまで。"
  17: "アデルは、父[ちち]の僕[しもべ]たちのうちのエドム人[じん]の男[おとこ]たちすべてとともに逃[に]げ、エジプトに入[はい]った。アデルはまだ小[ちい]さな子[こ]どもであった。"
  18: "彼[かれ]らはマディアムの町[まち]から立[た]ち、パランに来[き]て、自分[じぶん]たちとともに男[おとこ]たちを連[つ]れ、エジプトの王[おう]ファラオのもとへ来た。アデルはファラオのもとに入[はい]り、ファラオは彼に家[いえ]を与[あた]え、食物[しょくもつ]を定[さだ]め、土地[とち]も与えた。"
  19: "アデルはファラオの前[まえ]で非常[ひじょう]に大[おお]きな恵[めぐ]みを得[え]た。ファラオは彼[かれ]に、自分の妻[つま]の姉妹[しまい]、すなわちテケミナの姉[あね]を妻として与えた。"
  20: "テケミナの姉妹[しまい]は彼[かれ]にその子[こ]ガニバトを産[う]んだ。テケミナは彼をファラオの子らの中[なか]で育[そだ]てた。ガニバトはファラオの子らの中にいた。"
  21: "アデルはエジプトで、ダビデが父[ちち]たちとともに眠[ねむ]ったこと、また軍[ぐん]の長[ちょう]ヨアブが死[し]んだことを聞[き]いて、ファラオに言[い]った。「わたしを送[おく]り出[だ]してください。わたしの国[くに]へ帰[かえ]る。」"
  22: "ファラオはアデルに言[い]った。「わたしのもとで何[なに]が足[た]りないのか。なぜ自分の国[くに]へ行[い]こうとするのか。」アデルは言った。「いいえ。ただ、どうかわたしを送[おく]り出[だ]してください。」そしてアデルは自分の国へ帰[かえ]った。"
  23: "主[しゅ]はソロモンにまた敵対[てきたい]する者[もの]を起[お]こした。エリアダの子[こ]ラゾンである。彼[かれ]は自分[じぶん]の主[あるじ]、スバの王[おう]アダデゼルから逃[に]げた者であった。"
  24: "男[おとこ]たちが彼[かれ]のもとに集[あつ]まり、彼は反乱[はんらん]の一団[いちだん]の長[ちょう]となった。ダビデが彼らを殺[ころ]したときのことである。彼らはダマスコに行[い]ってそこに住[す]み、ダマスコで王[おう]となった。"
  25: "ソロモンのすべても日[ひ]の間[あいだ]、イスラエルには悩[なや]ましがあった。これがアデルが行[おこな]った悪[あく]である。彼[かれ]はイスラエルを苦[くる]しめ、エドムの地[ち]で王[おう]となった。"
  26: "エフライム人[じん]イエロボアム、ナバトの子[こ]、サリラの出[で]の者[もの]、やもめの子が、ソロモンの僕[しもべ]であった。"
  27: "彼[かれ]がソロモン王[おう]に手[て]を上[あ]げた次第[しだい]はこうである。ソロモンはミロを建[た]て、父[ちち]ダビデの町[まち]の城壁[じょうへき]の破[やぶ]れを閉[と]じた。"
  28: "イエロボアムは力[ちから]の強[つよ]い男[おとこ]であった。ソロモンはこの若者[わかもの]が仕事[しごと]のできる者[もの]であるのを見[み]て、彼[かれ]をヨセフの家[いえ]の労役[ろうえき]の監督[かんとく]に任[まか]せた。"
  29: "そのころ、イエロボアムはエルサレムから出[で]た。預言者[よげんしゃ]アヒヤ、シロ人[じん]が道[みち]で彼[かれ]に出会[であ]い、彼を道から引[ひ]き離[はな]した。アヒヤは新[あたら]しい衣[ころも]をまとっており、二人[ふたり]は野[の]にいた。"
  30: "アヒヤは自分[じぶん]が着[き]ている新[あたら]しい衣[ころも]を取[と]って、それを十二[じゅうに]に裂[さ]き、"
  31: "そして言[い]った。「あなたは自分[じぶん]のために十[じゅう]の切[き]れを取[と]りなさい。イスラエルの神[かみ]である主[しゅ]はこう言われる。『見[み]よ、わたしはソロモンの手[て]から王国[おうこく]を裂[さ]き取り、あなたに十の王杖[おうじょう]を与[あた]える。"
  32: "しかし、わたしの僕[しもべ]ダビデのゆえに、またわたしがイスラエルのすべての部族[ぶぞく]の中[なか]から、そこに選[えら]んだ町[まち]エルサレムのゆえに、彼[かれ]には二[ふた]つの王杖[おうじょう]がある。"
  33: "なぜなら、彼[かれ]らはわたしを捨[す]て、シドン人[じん]の憎[にく]むべきものアスタルテに、またモアブの偶像[ぐうぞう]ハモスに、アンモンの子[こ]らの偶像である彼らの王[おう]に仕[つか]え、わたしの道[みち]に歩[あゆ]んで、わたしの目[め]に正[ただ]しいことを行[おこな]わず、彼の父[ちち]ダビデのようにならなかったからである。"
  34: "しかし、わたしは彼[かれ]の手[て]からその王国[おうこく]の全部[ぜんぶ]を取[と]らない。わたしは彼をその一生[いっしょう]のすべても日[ひ]、守[まも]り続[つづ]ける。わたしが選[えら]んだ僕[しもべ]ダビデのゆえである。彼はわたしの戒[いまし]めと掟[おきて]を守った。"
  35: "わたしは彼の子[こ]の手[て]から王国[おうこく]を取[と]り、その十[じゅう]の王杖[おうじょう]をあなたに与[あた]える。"
  36: "彼の子[こ]には二[ふた]つの王杖[おうじょう]を与[あた]える。それは、わたしの僕[しもべ]ダビデが、わたしの前[まえ]で、すべても日[ひ]、エルサレムの町[まち]に王座[おうざ]を持つためである。わたしが自分の名[な]を置[お]くために自分[じぶん]に選[えら]んだ町である。"
  37: "わたしはあなたを取[と]り、あなたは自分の心[こころ]が望[のぞ]むところを治[おさ]め、イスラエルの上[うえ]に王[おう]となる。"
  38: "もしあなたが、わたしが命[めい]じるすべてを守[まも]り、わたしの道[みち]に歩[あゆ]み、わたしの目[め]に正[ただ]しいことを行[おこな]って、わたしの戒[いまし]めと掟[おきて]を守るなら、わたしの僕[しもべ]ダビデが行ったように、わたしはあなたとともにいて、ダビデに建[た]てたように、あなたに確[かた]い家[いえ]を建て、イスラエルをあなたに与[あた]える。"
  39: "わたしはこれらのことのゆえにダビデの家[いえ]を苦[くる]しめる。しかし、すべても日[ひ]ではない。』」"
  40: "ソロモンはイエロボアムを殺[ころ]そうとした。イエロボアムは立[た]って、エジプトの王[おう]スサキムのもとへエジプトに逃[に]げ、ソロモンが死[し]ぬまでエジプトにいた。"
  41: "ソロモンの残[のこ]りの言葉[ことば]と、彼[かれ]が行[おこな]ったすべてのことと、そのすべての知恵[ちえ]は、ソロモンの言葉の書[しょ]に書[か]かれているではないか。"
  42: "ソロモンがエルサレムでイスラエルのすべての上[うえ]に王[おう]として治[おさ]めた日[ひ]は、四十[よんじゅう]年[ねん]であった。"
  43: "ソロモンは父[ちち]たちとともに眠[ねむ]り、父ダビデの町[まち]に葬[ほうむ]られた。その子[こ]ロボアムが彼[かれ]に代[か]わって王[おう]となった。"

notes:
  1: "φιλογύναιος — «женолюбивый» (φιλογύναιος). В гр. при этом стоит и число жён («ἄρχουσαι ἑπτακόσιαι καὶ παλλακαὶ τριακόσιαι» — 700 жён и 300 наложниц), но в csl оно отнесено к ст. 3, туда и поставлено, чтобы не повторять. Список народов по гр. полнее, чем в csl (там Моав, Аммон, Аморрей): Σύρους καὶ Ιδουμαίας — сирийцы и идумеи, Χετταίους — хеттеи; в ru ещё Сидон."
  2: "ἐκ τῶν ἐθνῶν — из народов (ἔθνος). ἀπεῖπεν — запретил (ἀπεῖπον). Οὐκ εἰσελεύσεσθε εἰς αὐτούς — не войдёте к ним. μὴ ἐκκλίνωσιν τὰς καρδίας ὑμῶν ὀπίσω εἰδώλων — да не совратят сердец ваших вслед идолов (ἐκκλίνω, εἴδωλον). εἰς αὐτοὺς ἐκολλήθη — прилепился к ним (κολλάω)."
  3: "В gr-lxx-byz на месте стиха «.» — в LXX его нет (число жён стоит в ст. 1). Перевод по csl. ἄρχουσαι — «владычествующие», знатные жёны (ἄρχουσα); παλλακαί — наложницы (παλλακή), 側女."
  4: "γῆρας — старость (γῆρας). τελεία — совершенная, полная (τέλειος). ἐξέκλιναν … ὀπίσω θεῶν αὐτῶν — совратили вслед богов своих. В csl порядок частей обратный: сначала о жёнах, потом «не бе сердце его совершенно»."
  5: "ᾠκοδόμησεν ὑψηλόν — построил высоту, капище на высоте (ὑψηλός), 高い所; в LXX эта часть стоит в ст. 7 (Χαμως — Хамос, идол Моава). Ἀστάρτη βδέλυγμα Σιδωνίων — Астарта, мерзость сидонская (βδέλυγμα, 憎むべきもの); в LXX — в ст. 6. τῷ βασιλεῖ αὐτῶν — «царю их», т. е. Молоху/Милхому (в ru «Милхому»)."
  6: "ἐποίησεν τὸ πονηρόν — сотворил злое. οὐκ ἐπορεύθη ὀπίσω κυρίου — не пошёл вслед Господа. В LXX на этом месте только «καὶ τῇ Ἀστάρτῃ βδελύγματι Σιδωνίων»; порядок ст. 5–8 в LXX и csl разный, содержание то же."
  7: "ὑψηλόν — высота, капище (ὑψηλός). Χαμως — Хамос (Моав), ハモス. Ἀστάρτη — Астарта. ἐν τῷ ὄρει τῷ πρὸ Ιερουσαλημ — на горе, что пред Иерусалимом (Масличная). В гр. эта часть — ст. 5."
  8: "ἐθυμίων καὶ ἔθυον — кадили и приносили жертвы (θυμιάω, θύω). ταῖς γυναιξὶν αὐτοῦ ταῖς ἀλλοτρίαις — жёнам его иноплеменным. В гр. на этом месте ст. 6 (о злом пред Господом)."
  9: "ὠργίσθη — разгневался (ὀργίζομαι). τοῦ ὀφθέντος αὐτῷ δίς — явившегося ему дважды (ὁράω, δίς); ср. 3:5; 9:2."
  10: "ἐντειλαμένου αὐτῷ … τὸ παράπαν μὴ πορευθῆναι — повелевшего ему совершенно не ходить (ἐντέλλομαι, τὸ παράπαν). φυλάξασθαι ποιῆσαι — хранить, чтобы исполнять. «Дважды» — в csl, в LXX здесь нет (оно в ст. 9)."
  11: "Ἀνθ᾿ ὧν — за то, что. διαρρήσσων διαρρήξω — «раздирая раздеру», усиленное сочетание (διαρρήσσω). προστάγματα — повеления (πρόσταγμα). τῷ δούλῳ σου — рабу твоему (Иеровоаму)."
  12: "πλὴν — однако. διὰ Δαυιδ τὸν πατέρα σου — ради Давида, отца твоего. ἐκ χειρὸς υἱοῦ σου λήμψομαι — из руки сына твоего возьму."
  13: "οὐ μὴ λάβω — не возьму (усиленное отрицание). σκῆπτρον ἓν — один скипетр, т. е. одно колено (σκῆπτρον, 王杖; в ru «одно колено»). ἣν ἐξελεξάμην — который избрал."
  14: "ἤγειρεν σαταν — воздвиг противника (σατάν здесь «противник», не имя). Αδερ — Адер (Hadad). ἐκ τοῦ σπέρματος τῆς βασιλείας — из царского семени. В гр. в этот стих влит рассказ о Разоне (Εσρωμ сын Елиады, Адраазар царь Сувы, сборище, Дамаск); в csl он стоит отдельными ст. 23–24, поэтому здесь не повторён."
  15: "ἐξολεθρεῦσαι — истребить (ἐξολεθρεύω). ἄρχων τῆς στρατιᾶς — начальник войска (Иоав). θάπτειν τοὺς τραυματίας — погребать павших (τραυματίας). ἔκοψαν πᾶν ἀρσενικόν — избили всё мужское (κόπτω, ἀρσενικός)."
  16: "ἐνεκάθητο — оставался, сидел (ἐγκαθέζομαι). ἕως ὅτου ἐξωλέθρευσεν — доколе не истребил. В базе ст. 15 и 16 кончаются тире (стих 16 — придаточное времени к 15)."
  17: "ἀπέδρα — убежал (ἀποδιδράσκω). παιδάριον μικρόν — маленький ребёнок (παιδάριον)."
  18: "ἀνίστανται … ἔρχονται — встают, приходят (историческое настоящее). Μαδιαμ — Мадиам (マディアム); Φαραν — Фаран (パラン). ἄρτους διέταξεν — назначил хлеб, содержание (διατάσσω). «И землю дал ему» — в csl, в LXX нет (МТ), внесено по паритету."
  19: "εὗρεν χάριν ἐναντίον Φαραω — обрёл благодать пред фараоном (χάρις). ἀδελφὴν τῆς γυναικὸς αὐτοῦ — сестру жены своей; Θεκεμινα — Текемина (в ru «Тахпенеса» — МТ). τὴν μείζω — старшую."
  20: "ἔτεκεν — родила (τίκτω). Γανηβαθ — Ганниват (в ru «Генуват»). ἐξέθρεψεν — вскормила, воспитала (ἐκτρέφω). ἐν μέσῳ υἱῶν Φαραω — среди сынов фараона."
  21: "κεκοίμηται — почил (κοιμάω, перфект). Ἐξαποστείλον με — отошли меня (ἐξαποστέλλω)."
  22: "Τίνι σὺ ἐλαττονῇ μετ᾿ ἐμοῦ; — «в чём ты терпишь недостаток у меня?» (ἐλαττονάω), т. е. чего тебе недостаёт. Ὅτι ἐξαποστέλλων ἐξαποστελεῖς με — «ибо отпуская отпустишь меня», усиленная просьба (в ru «нет, но отпусти меня»)."
  23: "В gr-lxx-byz на месте стиха «.» — в LXX его нет: рассказ о Разоне сжат в ст. 14. Ῥαζων (слав. «разон») — Разон, ラゾン. υἱὸς Ελιαδαε — сын Елиады. Ἀδρααζαρ (слав. «ададезер») — Адраазар, царь Сувы (Σουβα, スバ)."
  24: "συνηθροίσθησαν — собрались (συναθροίζω). ἄρχων συστρέμματος — начальник шайки, сборища (σύστρεμμα). «Идоша в Дамаск… воцаришася в Дамасце» — в csl; в LXX соответствие — προκατελάβετο τὴν Δαμασεκ (занял Дамаск). В gr-lxx-byz на месте стиха «.» — в LXX его нет."
  25: "ἐβαρυθύμησεν ἐν Ισραηλ — «отяготил Израиль», был тяжек для Израиля (βαρυθυμέω). ἐβασίλευσεν ἐν γῇ Εδωμ — воцарился в земле Едом; в ru «сделался царем Сирии» — масоретское чтение. «Во вся дни Соломона» — в csl, в LXX нет."
  26: "Εφραθι — ефрафянин (в ru «Ефремлянин»), エフライム人. Σαριρα — Сарира (サリラ). υἱὸς γυναικὸς χήρας — сын женщины-вдовы (χήρα). Слав. здесь добавляет «и воздвиже руце на царя соломона»; в LXX эта часть в ст. 27, поэтому не повторена."
  27: "τοῦτο τὸ πρᾶγμα ὡς ἐπήρατο χεῖρας — «это дело, когда он поднял руки» (ἐπαίρω); в LXX подлежащее не названо, в csl — «царь соломон созидаше краеградие» (строил Милло Соломон, ср. 9:24), поэтому подлежащее названо. ἄκρα — крепость, Милло (ἄκρα). συνέκλεισεν τὸν φραγμόν — заделал пролом (φραγμός; слав. «ограждаше стеною»)."
  28: "ἰσχυρὸς δυνάμει — сильный силой (ἰσχυρός, δύναμις). ἀνὴρ ἔργων — муж дел, делец (ἔργον). κατέστησεν ἐπὶ τὰς ἄρσεις οἴκου Ιωσηφ — поставил над ношами, повинностями дома Иосифа (ἄρσις — поднятие, ноша)."
  29: "ἐξῆλθεν ἐξ Ιερουσαλημ — вышел из Иерусалима. Αχιας ὁ Σηλωνίτης ὁ προφήτης — Ахия Силомлянин, пророк (Σηλωνίτης), シロ人. ἀπέστησεν αὐτὸν ἐκ τῆς ὁδοῦ — отвёл его с дороги (ἀφίστημι). περιβεβλημένος ἱματίῳ καινῷ — облечён в новую одежду (περιβάλλω). ἀμφότεροι ἐν τῷ πεδίῳ — оба в поле."
  30: "ἐπελάβετο τοῦ ἱματίου — взялся за одежду (ἐπιλαμβάνομαι). διέρρηξεν αὐτὸ δώδεκα ῥήγματα — разодрал на двенадцать частей (ῥῆγμα); слав. «на дванадесять жребий» («жребиев»)."
  31: "Λαβὲ σεαυτῷ δέκα ῥήγματα — возьми себе десять кусков. τάδε λέγει κύριος — так говорит Господь. ῥήσσω τὴν βασιλείαν — разрываю царство (ῥήσσω). δέκα σκῆπτρα — десять скипетров, т. е. колен."
  32: "δύο σκῆπτρα — два скипетра (Иуда и Вениамин); в ru «одно колено» (МТ). ἣν ἐξελεξάμην ἐν αὐτῇ ἐκ πασῶν φυλῶν Ισραηλ — который Я избрал в нём из всех колен Израиля."
  33: "ἀνθ᾿ ὧν — за то, что. κατέλιπέν με — оставил Меня (καταλείπω); в csl «и поклонися» (поклонился). βδέλυγμα Σιδωνίων — мерзость сидонская. τοῖς εἰδώλοις Μωαβ — идолам Моава. πρόσοχθισμα — «досаждение», мерзость (πρόσοχθισμα; слав. «претыкание»). οὐκ ἐπορεύθη ἐν ταῖς ὁδοῖς μου — не пошёл путями Моими. В ru добавлено «и соблюдать уставы Мои и заповеди Мои» — в LXX и csl этого нет."
  34: "ἀντιτασσόμενος ἀντιτάξομαι αὐτῷ — букв. «противясь воспротивлюсь ему» (ἀντιτάσσω); в csl «защищая защищу его» (буду защищать), по смыслу и по ru («оставлю его владыкою») принято csl. ὃν ἐξελεξάμην — которого избрал. В csl добавлено «иже сохрани заповеди моя и оправдания» — в LXX нет, внесено по паритету."
  35: "λήμψομαι … ἐκ χειρὸς τοῦ υἱοῦ — возьму из руки сына. τὰ δέκα σκῆπτρα — десять скипетров."
  36: "θέσις — «поставление, место» (θέσις); в csl «престол», в ru «светильник» (МТ). ὅπως ᾖ θέσις τῷ δούλῳ μου Δαυιδ — чтобы было место рабу Моему Давиду. τοῦ θέσθαι ὄνομά μου ἐκεῖ — чтобы положить имя Моё там."
  37: "σὲ λήμψομαι — тебя возьму, приму (λαμβάνω). ἐν οἷς ἐπιθυμεῖ ἡ ψυχή σου — в чём желает душа твоя. σὺ ἔσῃ βασιλεὺς ἐπὶ τὸν Ισραηλ — ты будешь царём над Израилем."
  38: "καὶ ἔσται ἐὰν φυλάξῃς — и будет, если сохранишь. οἰκοδομήσω σοι οἶκον πιστόν — устрою тебе дом верный (πιστός). В csl добавлено «и дам ти израиля» — в LXX нет, внесено по паритету."
  39: "В gr-lxx-byz на месте стиха «.» — в LXX его нет. Перевод по csl: «и озлоблю род давидов за сия, но не во вся дни» (в ru «смирю Я род Давидов за сие, но не на все дни»). Стих продолжает речь Господа из ст. 31–38, поэтому кавычки закрываются здесь."
  40: "ἐζήτησεν θανατῶσαι — искал умертвить (θανατόω). Σουσακιμ — Сусаким (Шешонк). ἕως οὗ ἀπέθανεν Σαλωμων — доколе не умер Соломон."
  41: "τὰ λοιπὰ τῶν ῥημάτων — остальные слова (ῥῆμα). ἐν βιβλίῳ ῥημάτων Σαλωμων — в книге слов Соломона. οὐκ ἰδοὺ … γέγραπται; — не вот ли написано? риторический вопрос."
  42: "αἱ ἡμέραι, ἃς ἐβασίλευσεν — дни, в которые царствовал. τεσσαράκοντα ἔτη — сорок лет. «Над всем Израилем» — в csl, в LXX нет."
  43: "ἐκοιμήθη — почил (κοιμάω). ἔθαψαν αὐτὸν ἐν πόλει Δαυιδ — погребли его в городе Давида. ἐβασίλευσεν Ροβοαμ … ἀντ αὐτοῦ — воцарился Ровоам вместо него. Вторая половина стиха в LXX (καὶ ἐγενήθη ὡς ἤκουσεν Ιεροβοαμ… εἰς γῆν Σαριρα) — двойное чтение, повтор 12:2; в csl её нет, здесь не повторена."
