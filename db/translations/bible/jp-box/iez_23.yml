# jp-box, Иезекииль, глава 23. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в этой главе gr, csl и ru совпадают: 49 стихов.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
# Содержание: 1–4 притча о двух сёстрах, Ооле и Ооливе (Самария и Иерусалим);
# 5–10 Оола и Ассирийцы, её казнь; 11–21 Оолива, ещё более развратная: Ассирийцы,
# Халдеи, изображения на стене, Египет; 22–35 суд над Ооливой: любовники со всех
# сторон, отсечение носа и ушей, чаша сестры, «праздники и новомесячия отвращу»;
# 36–49 Господь велит судить обеих: прелюбодеяние, кровь, дети через огонь,
# осквернение святыни, суд праведных, камни и мечи, очищение земли.
# Речи: 1 — формула вне кавычек; 2–35 — 「…»; 36 — формула «и сказал мне Господь»
# вне кавычек; 37–49 — 「…». Вложенной речи нет.
# Паритет: 23:6 слав. «в червленицы» (紫) при греч. ὑακίνθινα «гиацинтового цвета»;
# 23:24 слав. добавляет «шлемы» (兜) при греч. «большие и малые щиты»; 23:29–30
# греч. фраза переходит границу стиха («καὶ ἡ πορνεία σου» без сказуемого), в 30
# подлежащее — «блуд твой»; 23:34 «праздники и новомесячия» стоят в этом же стихе;
# 23:43 LXX/csl — вопрос, ru/МТ — «одряхлевшая». Образность и грубость не сглажены.
# Имена: エルサレム, サマリア, イスラエル, アッシリア人, カルデア人, バビロン,
# エジプト; オオラ (Οολα, евр. Огола), オオリバ (Οολιβα, евр. Оголива) —
# транслитерация греческого; ファクド, スエ, クエ (Φακουδ, Σουε, Κουε).

