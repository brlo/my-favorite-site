verses:
  1: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]われた。"
  2: "「人[ひと]の子[こ]よ、二人[ふたり]の女[おんな]がいた。彼女[かのじょ]たちは一[ひと]つの母[はは]の娘[むすめ]であった。"
  3: "彼女[かのじょ]たちはエジプトで、その若[わか]い頃[ころ]に淫行[いんこう]をした。そこでは彼女たちの乳房[ちぶさ]が揉[も]まれ、そこでは彼女たちの処女[しょじょ]が奪[うば]われた。"
  4: "その名[な]は、姉[あね]がオオラ、妹[いもうと]がオオリバといった。彼女たちはわたしのものとなり、男[おとこ]の子[こ]と女[おんな]の子[こ]を産[う]んだ。その名は、オオラがサマリア、オオリバがエルサレムである。"
  5: "オオラはわたしから離[はな]れて淫行[いんこう]をし、自分[じぶん]の恋人[こいびと]たち、自分[じぶん]に近[ちか]づくアッシリア人[じん]たちに身[み]を寄[よ]せた。"
  6: "紫[むらさき]の衣[ころも]をまとった者[もの]たち、総督[そうとく]と将軍[しょうぐん]、すべて選[え]り抜[ぬ]かれた若者[わかもの]、馬[うま]に乗[の]る騎兵[きへい]たちである。"
  7: "彼女はその淫行[いんこう]を彼らに与[あた]えた。彼らはみなアッシリア人[じん]の選[え]り抜[ぬ]かれた者[もの]たちであり、彼女は心[こころ]を寄[よ]せたすべての者[もの]によって、そのすべての偶像[ぐうぞう]のゆえに汚[けが]れた。"
  8: "彼女はエジプトからの淫行[いんこう]を捨[す]てなかった。彼らは彼女の若[わか]い頃[ころ]に彼女と寝[ね]、彼女の処女[しょじょ]を奪[うば]い、その淫行を彼女の上[うえ]に注[そそ]いだからである。"
  9: "それゆえ、わたしは彼女を、彼女が心[こころ]を寄[よ]せた恋人[こいびと]たちの手[て]に、アッシリア人[じん]の子[こ]らたちの手に渡[わた]した。"
  10: "彼らは彼女の恥[はじ]をあらわにし、その息子[むすこ]たちと娘[むすめ]たちを取[と]り、彼女自身[じしん]を剣[つるぎ]で殺[ころ]した。彼女は女[おんな]たちの間[あいだ]で語[かた]り草[ぐさ]となり、彼女の娘[むすめ]たちの上[うえ]に報[むく]いを果[は]たした。"
  11: "彼女の姉妹[しまい]オオリバはこれを見[み]て、さらに身[み]を腐[くさ]らせた。その心[こころ]を寄[よ]せることは姉[あね]よりも甚[はなは]だしく、その淫行[いんこう]は姉の淫行よりも甚だしかった。"
  12: "彼女はアッシリア人[じん]の子[こ]らに身[み]を寄[よ]せた。総督[そうとく]と将軍[しょうぐん]、近[ちか]くにいる者[もの]で豪華[ごうか]な衣[ころも]をまとった者たち、馬[うま]に乗る騎兵[きへい]、すべて選[え]り抜[ぬ]かれた若者[わかもの]たちである。"
  13: "わたしは、彼女が汚[けが]れたのを見[み]た。二人[ふたり]は同[おな]じ道[みち]を行[ゆ]く。"
  14: "彼女はその淫行[いんこう]をさらに重[かさ]ねた。壁[かべ]に描[えが]かれた男[おとこ]たち、絵の具[えのぐ]で描[えが]かれたカルデア人[じん]の像[ぞう]を、彼女は見[み]たのである。"
  15: "腰[こし]に帯[おび]を結[むす]び、頭[あたま]に染[そ]めた冠[かんむり]をかぶり、すべて三[み]つ組[ぐみ]の長[ちょう]の姿[すがた]をし、その故郷[こきょう]がカルデアの地[ち]であるバビロンの子[こ]らに似[に]ていた。"
  16: "彼女はその目[め]の眺[なが]めによって彼らに身[み]を寄[よ]せ、カルデアの地[ち]へ彼らのもとに使者[ししゃ]を送[おく]った。"
  17: "バビロンの子[こ]らは彼女のもとに来[き]て、宿[やど]る者[もの]たちの寝床[ねどこ]に上[のぼ]り、その淫行[いんこう]をもって彼女を汚[けが]した。彼女は彼らによって汚[けが]れ、その魂[たましい]は彼らから離[はな]れた。"
  18: "彼女はその淫行[いんこう]をあらわにし、その恥[はじ]をあらわにした。わたしの魂[たましい]は彼女から離[はな]れ、姉[あね]から離れたときと同じようになった。"
  19: "彼女はその淫行[いんこう]を重[かさ]ね、自分[じぶん]の若[わか]い日[ひ]々[び]を思[おも]い起[おこ]した。エジプトの地[ち]で淫行をした日々である。"
  20: "彼女はカルデア人[じん]たちに身[み]を寄[よ]せた。彼らの肉[にく]はロバの肉のようであり、その陰部[いんぶ]は馬[うま]の陰部のようであった。"
  21: "あなたは自分の若[わか]い頃[ころ]の不法[ふほう]を顧[かえり]みた。エジプトで、あなたの宿[やど]りで行[おこな]ったこと、あなたの若い頃の乳房[ちぶさ]が揉[も]まれたことを。"
  22: "それゆえ、オオリバよ、主[しゅ]なる神[かみ]はこう言[い]われる。見[み]よ、わたしはあなたの恋人[こいびと]たちを、あなたから魂[たましい]の離[はな]れた者[もの]たちを、あなたに逆[さか]らって起[お]こし、四方[しほう]から彼らをあなたの上[うえ]に連[つ]れて来[く]る。"
  23: "バビロンの子[こ]ら、すべてのカルデア人[じん]、ファクド、スエ、クエの人々[ひとびと]、すべてのアッシリア人[じん]の子ら、彼らとともにいる選[え]り抜[ぬ]かれた若者[わかもの]たち、総督[そうとく]と将軍[しょうぐん]、すべて三[み]つ組[ぐみ]の長[ちょう]、名[な]の高[たか]い騎兵[きへい]たちを。"
  24: "彼らは北[きた]から、戦車[せんしゃ]と車輪[しゃりん]と多[おお]くの民[たみ]の群[む]れを携[たずさ]えて、あなたの上[うえ]に来[く]る。彼らは大[だい]盾[じゅん]と槍[やり]、兜[かぶと]をもって、あなたの周[まわ]りに警戒[けいかい]を置[お]く。わたしは彼らの前[まえ]に裁[さば]きを置き、彼らはその裁きをもってあなたを裁[さば]く。"
  25: "わたしの妬[ねた]みをあなたのうちに置[お]く。彼らは怒[いか]りをもってあなたを扱[あつか]い、あなたの鼻[はな]と耳[みみ]を切[き]り取[と]り、あなたの残[のこ]りの者[もの]を剣[つるぎ]で倒[たお]す。彼らはあなたの息子[むすこ]たちと娘[むすめ]たちを取[と]り、あなたの残りの者は火[ひ]に食[く]われる。"
  26: "彼らはあなたの衣[ころも]を脱[ぬ]がせ、あなたの誇[ほこ]りの飾[かざ]りを取[と]る。"
  27: "わたしはあなたの不敬[ふけい]をあなたから、またエジプトの地[ち]からの淫行[いんこう]をあなたから取[と]り去[さ]る。あなたはもはや彼らに目[め]を上[あ]げず、エジプトを思[おも]い出[だ]さない。"
  28: "まことに、主[しゅ]なる神[かみ]はこう言[い]われる。見[み]よ、わたしはあなたを、あなたが憎[にく]む者[もの]たちの手[て]に、あなたから魂[たましい]の離れた者たちの手に渡[わた]す。"
  29: "彼らは憎[にく]しみをもってあなたを扱[あつか]い、あなたのすべての労苦[ろうく]と勤[つと]めの実[み]を取[と]り、あなたを裸[はだか]にして恥[はじ]をさらす。あなたの淫行[いんこう]の恥と、あなたの不敬[ふけい]と、あなたの淫行[いんこう]が。"
  30: "あなたの淫行[いんこう]が、あなたにこれらのことをした。あなたが諸国[しょこく]の後[あと]を追[お]って淫行をし、その偶像[ぐうぞう]によって汚[けが]れたからである。"
  31: "あなたは姉[あね]の道[みち]を歩[あゆ]んだ。それゆえ、わたしは彼女の杯[さかずき]をあなたの手[て]に与[あた]える。"
  32: "主[しゅ]なる神[かみ]はこう言[い]われる。あなたは姉[あね]の杯[さかずき]、深[ふか]く広[ひろ]い杯を飲[の]む。それは嘲[あざけ]りと物笑[ものわら]いの的[まと]となり、多[おお]くを容[い]れ、酔[よ]いを全[まっと]うさせる。"
  33: "あなたは酔[よ]いと力[ちから]の抜[ぬ]けることに満[み]ちる。それは荒廃[こうはい]と滅亡[めつぼう]の杯、あなたの姉妹[しまい]サマリアの杯である。"
  34: "あなたはそれを飲[の]み、飲[の]み干[ほ]し、その陶器[とうき]のかけらをかじり、自分の乳房[ちぶさ]を引[ひ]き裂[さ]く。わたしはあなたの祭[まつ]りと新月[しんげつ]を退[しりぞ]ける。わたしが語[かた]ったからである、と主[しゅ]なる神[かみ]は言[い]われる。"
  35: "それゆえ、主[しゅ]なる神[かみ]はこう言[い]われる。あなたがわたしを忘[わす]れ、わたしをあなたの身[み]の後[うし]ろに投[な]げ捨[す]てたからである。あなたもまた、自分の不敬[ふけい]と淫行[いんこう]を負[お]え。」"
  36: "主[しゅ]はわたしに言[い]われた。人[ひと]の子[こ]よ、あなたはオオラとオオリバを裁[さば]くのか。彼女[かのじょ]たちの不法[ふほう]を彼女たちに告[つ]げよ。"
  37: "「彼女たちは姦淫[かんいん]をし、その手[て]に血[ち]がある。彼女たちはその偶像[ぐうぞう]と姦淫をし、わたしに産[う]んだ子[こ]どもたちを、彼らに食[く]わせるために火[ひ]の中を通[とお]らせた。"
  38: "彼女たちはさらに、わたしに対してこれらのことをした。その同[おな]じ日[ひ]にわたしの聖[せい]なるもの[もの]を汚[けが]し、わたしの安息日[あんそくび]を汚[けが]した。"
  39: "彼女たちが自分の子[こ]どもを偶像[ぐうぞう]に屠[ほふ]ったその日[ひ]に、彼女たちはわたしの聖所[せいしょ]に入[はい]ってこれを汚[けが]した。見[み]よ、彼女たちはわたしの家[いえ]のただ中[なか]でこのように行[おこな]った。"
  40: "あなたは遠[とお]くから来[く]る男[おとこ]たちに使者[ししゃ]を送[おく]った。彼らが来[き]たとき、あなたは洗[あら]い、目[め]を塗[ぬ]り、装[よそお]いを整[ととの]えた。"
  41: "あなたは飾[かざ]られた寝床[ねどこ]に座[すわ]り、その前[まえ]に整[ととの]えられた食卓[しょくたく]を置[お]き、わたしの香[こう]と油[あぶら]を彼らの前[まえ]に供[そな]えた。彼らはそれらによって喜[よろこ]んだ。"
  42: "彼女のところに和[わ]やかな調[しら]べが奏[かな]でられた。荒野[こうや]から来[き]た民[たみ]の群[む]れの男[おとこ]たちに、彼らは腕輪[うでわ]をその手[て]に、誇[ほこ]りの冠[かんむり]をその頭[あたま]に与[あた]えた。"
  43: "わたしは言[い]った。これは、これらの者[もの]たちと姦淫[かんいん]をするのではないのか。これは娼婦[しょうふ]のわざであり、彼女自身[じしん]も淫行[いんこう]をした。"
  44: "人[ひと]は娼婦[しょうふ]のところへ入[はい]るように彼女のところへ入[はい]り、そのようにオオラとオオリバ、不法[ふほう]の女[おんな]たちのところへ入[はい]って不法[ふほう]を行[おこな]った。"
  45: "しかし、正[ただ]しい男[おとこ]たちは、姦淫[かんいん]の女[おんな]に対する裁[さば]きと血[ち]を流[なが]す者[もの]に対する裁きとをもって彼女たちを裁[さば]く。彼女たちは姦淫の女であり、その手[て]に血があるからである。"
  46: "主[しゅ]なる神[かみ]はこう言[い]われる。彼女たちの上[うえ]に群[む]れを上[あ]げ、彼女たちを混乱[こんらん]と略奪[りゃくだつ]に渡[わた]せ。"
  47: "群[む]れは彼女たちを石[いし]で打[う]ち、彼らの剣[つるぎ]で彼女たちを刺[さ]し通[とお]す。彼らはその息子[むすこ]たちと娘[むすめ]たちを殺[ころ]し、その家[いえ]を火[ひ]で焼[や]く。"
  48: "わたしはこの地[ち]から不敬[ふけい]を取[と]り去[さ]る。すべての女[おんな]は懲[こ]らしめられ、あなたがたの不敬[ふけい]のように行[おこな]わない。"
  49: "あなたがたの不敬[ふけい]はあなたがたの上[うえ]に返[かえ]され、あなたがたは自分の偶像[ぐうぞう]の罪[つみ]を負[お]う。あなたがたは、わたしが主[しゅ]なる神[かみ]であることを知[し]る。」"

notes:
  1: "Καὶ ἐγένετο λόγος κυρίου πρός με λέγων — вводная формула; в этой главе gr, csl и ru дают 49 стихов, номер в номер."
  2: "Δύο γυναῖκες ἦσαν θυγατέρες μητρὸς μιᾶς — «две женщины были дочери одной матери»: притча о двух сёстрах, ср. гл. 16."
  3: "ἐξεπόρνευσαν ἐν Αἰγύπτῳ ἐν τῇ νεότητι αὐτῶν — «блудили в Египте в юности своей»; ἐκεῖ ἔπεσον οἱ μαστοὶ αὐτῶν — «там пали груди их» (образ растления); διεπαρθενεύθησαν — «лишились девства»."
  4: "Οολα ἡ πρεσβυτέρα καὶ Οολιβα ἡ ἀδελφὴ αὐτῆς — «Оола старшая и Оолива сестра её»; евр. Огола и Оголива, オオラ и オオリバ — транслитерация греческого. Σαμάρεια ἡ Οολα, καὶ Ιερουσαλημ ἡ Οολιβα — Самария и Иерусалим; ἔτεκον υἱοὺς καὶ θυγατέρας — «родили Мне сыновей и дочерей»."
  5: "ἐξεπόρνευσεν ἡ Οολα ἀπ᾿ ἐμοῦ — «отступила от Меня блудом Оола»; ἐπέθετο ἐπὶ τοὺς ἐραστὰς αὐτῆς — «прилегла (устремилась) к любовникам своим»; Ἀσσυρίους τοὺς ἐγγίζοντας αὐτῇ — «к Ассирийцам, близким к ней»."
  6: "ἐνδεδυκότας ὑακίνθινα — «одетых в гиацинтовые (тёмно-синие/пурпурные) одежды»; слав. «в червленицы» (紫), в тексте слав.; ἡγουμένους καὶ στρατηγούς — «областеначальников и воевод»; ἱππεῖς ἱππαζόμενοι ἐφ᾿ ἵππων — «всадники, ездящие на конях»."
  7: "ἔδωκεν τὴν πορνείαν αὐτῆς ἐπ᾿ αὐτούς — «отдала блуд свой на них»; ἐπὶ πάντας, οὓς ἐπέθετο — «на всех, к кому прилегла»; ἐν πᾶσι τοῖς ἐνθυμήμασιν αὐτῆς ἐμιαίνετο — «всеми идолами (помышлениями) своими осквернялась»."
  8: "τὴν πορνείαν αὐτῆς ἐξ Αἰγύπτου οὐκ ἐγκατέλιπεν — «блуда своего из Египта не оставила»; μετ᾿ αὐτῆς ἐκοιμῶντο ἐν νεότητι αὐτῆς — «с нею спали в юности её»; ἐξέχεαν τὴν πορνείαν αὐτῶν ἐπ᾿ αὐτήν — «излили блуд свой на неё»."
  9: "παρέδωκα αὐτὴν εἰς χεῖρας τῶν ἐραστῶν αὐτῆς — «предал её в руки любовников её»; εἰς χεῖρας υἱῶν Ἀσσυρίων — «в руки сынов Ассирийских»."
  10: "ἀπεκάλυψαν τὴν αἰσχύνην αὐτῆς — «открыли срам её»; ἐν ῥομφαίᾳ ἀπέκτειναν — «мечом убили»; ἐγένετο λάλημα εἰς γυναῖκας — «стала притчей (молвой) между женщинами»; ἐποίησαν ἐκδικήσεις ἐν αὐτῇ εἰς τὰς θυγατέρας — «совершили над ней отмщения дочерям её» (тёмное место)."
  11: "εἶδεν ἡ ἀδελφὴ αὐτῆς Οολιβα — «увидела сестра её Оолива»; διέφθειρε τὴν ἐπίθεσιν αὐτῆς ὑπὲρ αὐτήν — «растлила стремление своё более неё» (ἐπίθεσις — наложение, устремление); τὴν πορνείαν αὐτῆς ὑπὲρ τὴν πορνείαν τῆς ἀδελφῆς — «блуд её более блуда сестры её»."
  12: "ἐπὶ τοὺς υἱοὺς τῶν Ἀσσυρίων ἐπέθετο — «к сынам Ассирийским прилегла»; ἐνδεδυκότας εὐπάρυφα — «одетых в роскошные ткани» (εὐπάρυφος); νεανίσκοι ἐπίλεκτοι — «юноши избранные»."
  13: "μεμίανται — «осквернилась»; ὁδὸς μία τῶν δύο — «дорога одна у обеих»: обе сестры пошли одним путём."
  14: "προσέθετο πρὸς τὴν πορνείαν αὐτῆς — «приложила к блуду своему»; ἄνδρας ἐζωγραφημένους ἐπὶ τοῦ τοίχου — «мужчин, нарисованных на стене»; εἰκόνας Χαλδαίων ἐζωγραφημένους ἐν γραφίδι — «изображения Халдеев, нарисованные кистью (красками)»."
  15: "ἐζωσμένους ποικίλματα ἐπὶ τὰς ὀσφύας — «опоясанных узорами по чреслам»; τιάραι βαπταὶ ἐπὶ τῶν κεφαλῶν — «тиары крашеные на головах»; ὄψις τρισσὴ πάντων — тёмное: букв. «вид тройной всех», вероятно «вид тристатов (военачальников)», ср. 23:23; слав. «вид троякий», ru «вид военачальников»."
  16: "ἐπέθετο ἐπ᾿ αὐτοὺς τῇ ὁράσει ὀφθαλμῶν αὐτῆς — «прилегла к ним взглядом очей своих»; ἐξαπέστειλεν ἀγγέλους — «послала послов»."
  17: "ἤλθοσαν... εἰς κοίτην καταλυόντων — «пришли на ложе тех, кто останавливается (живёт)»; ἐμίαινον αὐτὴν ἐν τῇ πορνείᾳ αὐτῆς — «осквернили её блудом её»; ἀπέστη ἡ ψυχὴ αὐτῆς ἀπ᾿ αὐτῶν — «отступила душа её от них»."
  18: "ἀπεκάλυψεν τὴν πορνείαν αὐτῆς — «открыла блуд свой»; ἀπέστη ἡ ψυχή μου ἀπ᾿ αὐτῆς — «отступила душа Моя от неё»; ὃν τρόπον... ἀπὸ τῆς ἀδελφῆς αὐτῆς — «как от сестры её»."
  19: "ἐπλήθυνας τὴν πορνείαν σου — «умножила блуд твой»; τοῦ ἀναμνῆσαι ἡμέρας νεότητός σου — «чтобы вспомнить дни юности твоей»."
  20: "ἐπέθου ἐπὶ τοὺς Χαλδαίους — «прилегла к Халдеям»; ὡς ὄνων αἱ σάρκες αὐτῶν — «как у ослов плоть их» (ὄνος — осёл, ロバ); αἰδοῖα ἵππων — «срамные части коней». Образ не смягчён."
  21: "ἐπεσκέψω τὴν ἀνομίαν νεότητός σου — «ты вспомнила (посетила) беззаконие юности твоей»; ἐν τῷ καταλύματί σου — «в жилище (шатре) твоём»; οὗ οἱ μαστοὶ νεότητός σου — «где груди юности твоей»."
  22: "ἐξεγείρω τοὺς ἐραστάς σου ἐπὶ σέ — «воздвигну любовников твоих на тебя»; ἀφ᾿ ὧν ἀπέστη ἡ ψυχή σου — «от которых отступила душа твоя»; ἐπάξω αὐτοὺς... κυκλόθεν — «приведу их... со всех сторон»."
  23: "υἱοὺς Βαβυλῶνος καὶ πάντας τοὺς Χαλδαίους, Φακουδ καὶ Σουε καὶ Κουε — «сынов Вавилона и всех Халдеев, Факуд, Суе и Куе»: ファクド、スエ、クエ (греч. формы; ru «Пеход, Шоа, Коа», слав. «факуда и суда и куда»). τρισσοὺς καὶ ὀνομαστούς — «тристатов и именитых» (三つ組の長); ἱππεύοντας ἐφ᾿ ἵππων — «всадников на конях»."
  24: "ἀπὸ βορρᾶ — «с севера»; ἅρματα καὶ τροχοὶ μετ᾿ ὄχλου λαῶν — «колесницы и колёса со множеством народа»; θυρεοὶ καὶ πέλται — «большие и малые щиты»; слав. «щиты и сулицы и шлемы» (兜), в тексте слав.; βαλοῦσιν φυλακὴν ἐπὶ σὲ κύκλῳ — «поставят стражу вокруг тебя»; δώσω... κρίμα — «дам... суд»."
  25: "δώσω τὸν ζῆλόν μου ἐν σοί — «дам ревность Мою в тебя»; μυκτῆρά σου καὶ ὦτά σου ἀφελοῦσιν — «нос твой и уши твои отнимут»; τοὺς καταλοίπους σου ἐν ῥομφαίᾳ καταβαλοῦσιν — «остатки твои мечом низложат»; πῦρ καταφάγεται — «огонь пожрёт»."
  26: "ἐκδύσουσίν σε τὸν ἱματισμόν σου — «снимут с тебя одежду твою»; σκεύη τῆς καυχήσεώς σου — «сосуды (наряды) похвалы твоей»."
  27: "ἀποστρέψω τὰς ἀσεβείας σου ἐκ σοῦ — «отвращу нечестия твои от тебя»; τὴν πορνείαν σου ἐκ γῆς Αἰγύπτου — «блуд твой из земли Египетской»; οὐ μὴ ἄρῃς τοὺς ὀφθαλμούς σου ἐπ᾿ αὐτούς — «не поднимешь глаз твоих на них»."
  28: "παραδίδωμί σε εἰς χεῖρας ὧν μισεῖς — «предаю тебя в руки тех, кого ты ненавидишь»; ἀφ᾿ ὧν ἀπέστη ἡ ψυχή σου — «от которых отступила душа твоя»."
  29: "ποιήσουσιν ἐν σοὶ ἐν μίσει — «поступят с тобой в ненависти»; λήμψονται πάντας τοὺς πόνους σου — «возьмут все труды твои»; ἔσῃ γυμνὴ καὶ ἀσχημονοῦσα — «будешь нага и посрамлена»; ἀποκαλυφθήσεται αἰσχύνη πορνείας σου — «откроется срам блуда твоего». Греч. строка обрывается на «καὶ ἡ πορνεία σου» — продолжение в ст. 30."
  30: "ἐποίησεν ταῦτά σοι — «сделало тебе это»: подлежащее — блуд твой (ἡ πορνεία σου), ср. конец ст. 29; слав. «И блужение твое сотвори сия тебе». ἐν τῷ ἐκπορνεῦσαί σε ὀπίσω ἐθνῶν — «когда ты блудила вслед народов»; ἐμιαίνου ἐν τοῖς ἐνθυμήμασιν αὐτῶν — «осквернялась идолами их»."
  31: "ἐν τῇ ὁδῷ τῆς ἀδελφῆς σου ἐπορεύθης — «путём сестры твоей ты пошла»; δώσω τὸ ποτήριον αὐτῆς εἰς χεῖράς σου — «дам чашу её в руки твои»."
  32: "τὸ ποτήριον τῆς ἀδελφῆς σου πίεσαι — «чашу сестры твоей будешь пить»; τὸ βαθὺ καὶ τὸ πλατύ — «глубокую и широкую»; τὸ πλεονάζον τοῦ συντελέσαι — «преизобилующую, чтобы совершить»; слав. «изюбилную ко совершению пиянства»."
  33: "μέθην καὶ ἐκλύσεως πλησθήσῃ — «опьянения и расслабления исполнишься»; ποτήριον ἀφανισμοῦ — «чаша исчезновения (опустошения)»; ποτήριον ἀδελφῆς σου Σαμαρείας — «чаша сестры твоей Самарии»."
  34: "καὶ πίεσαι αὐτό — «и выпьешь её»; τὰς ἑορτὰς καὶ τὰς νεομηνίας αὐτῆς ἀποστρέψω — «праздники и новомесячия её отвращу» (в этом же стихе, не в 35); слав. «чреп ея ядущи потребиши» — «черепки её, съедая, истребишь»; сосца твоя отторгнеши — «груди твои отторгнешь»."
  35: "ἐπελάθου μου καὶ ἀπέρριψάς με ὀπίσω τοῦ σώματός σου — «забыла Меня и отвергла Меня за тело твоё» (образ блуда); λαβὲ τὴν ἀσέβειάν σου καὶ τὴν πορνείαν σου — «возьми нечестие твоё и блуд твой»."
  36: "Вводная формула «καὶ εἶπεν κύριος πρός με» — вне кавычек; οὐ κρινεῖς τὴν Οολαν καὶ τὴν Οολιβαν; — «будешь ли судить Оолу и Ооливу?»; ἀπαγγελεῖς αὐταῖς τὰς ἀνομίας αὐτῶν — «возвестишь им беззакония их»."
  37: "ἐμοιχῶντο — «прелюбодействовали»; αἷμα ἐν χερσὶν αὐτῶν — «кровь в руках их»; τὰ τέκνα αὐτῶν... διήγαγον αὐτοῖς δι᾿ ἐμπύρων — «детей своих провели им через огонь» (через огонь Молоху, ср. 16:20–21; 20:26,31)."
  38: "ἕως καὶ ταῦτα ἐποίησάν μοι — «и это ещё сделали Мне»; τὰ ἅγιά μου ἐμίαινον — «святыни Мои оскверняли»; τὰ σάββατά μου ἐβεβήλουν — «субботы Мои оскверняли»."
  39: "ἐν τῷ σφάζειν αὐτοὺς τὰ τέκνα αὐτῶν τοῖς εἰδώλοις — «когда закалали детей своих идолам»; εἰσεπορεύοντο εἰς τὰ ἅγιά μου τοῦ βεβηλοῦν — «входили в святыни Мои, чтобы осквернить их»; ἐν μέσῳ τοῦ οἴκου μου — «в середине дома Моего»."
  40: "τοῖς ἀνδράσιν τοῖς ἐρχομένοις μακρόθεν — «к мужам, приходящим издалека»; ἀγγέλους ἐξαπεστέλλοσαν — «посылали послов»; ἐλούου καὶ ἐστιβίζου τοὺς ὀφθαλμούς σου — «ты мылась и сурьмила глаза твои» (στιβίζω — красить глаза); ἐκόσμου κόσμῳ — «украшалась украшением»."
  41: "ἐκάθου ἐπὶ κλίνης ἐστρωμένης — «сидела на ложе постланном»; τράπεζα κεκοσμημένη — «стол украшенный»; τὸ θυμίαμά μου καὶ τὸ ἔλαιόν μου εὐφραίνοντο ἐν αὐτοῖς — «фимиам Мой и елей Мой — они веселились в них» (слав. «веселяхуся в них»)."
  42: "φωνὴν ἁρμονίας ἀνεκρούοντο — «голос стройности (музыки) ударяли»; ἄνδρας ἐκ πλήθους ἀνθρώπων ἥκοντας ἐκ τῆς ἐρήμου — «мужей из множества людей, пришедших из пустыни»; ἐδίδοσαν ψέλια — «давали запястья» (ψέλιον); στέφανον καυχήσεως — «венец похвалы»."
  43: "Οὐκ ἐν τούτοις μοιχεύουσιν; — «не с этими ли прелюбодействуют?»: так LXX и слав.; ru/МТ читает «об одряхлевшей в прелюбодействе» — иное чтение, в текст не внесено. ἔργα πόρνης — «дела блудницы»."
  44: "ὃν τρόπον εἰσπορεύονται πρὸς γυναῖκα πόρνην — «как входят к жене блуднице»; πρὸς Οολαν καὶ πρὸς Οολιβαν — «к Ооле и к Ооливе»; τοῦ ποιῆσαι ἀνομίαν — «чтобы совершить беззаконие»."
  45: "ἄνδρες δίκαιοι ἐκδικήσουσιν αὐτάς — «мужи праведные отомстят им»; ἐκδικήσει μοιχαλίδος — «отмщением прелюбодейцы»; ἐκδικήσει αἵματος — «отмщением крови»."
  46: "Ἀνάγαγε ἐπ᾿ αὐτὰς ὄχλον — «приведи на них множество (толпу)»; δὸς ἐν αὐταῖς ταραχὴν καὶ διαρπαγήν — «дай на них смятение и разграбление»."
  47: "λιθοβόλησον ἐπ᾿ αὐτὰς λίθοις ὄχλων — «побей их камнями толпы»; κατακέντει αὐτὰς ἐν τοῖς ξίφεσιν αὐτῶν — «избодай (изруби) их мечами их»; οἴκους ἐμπρήσουσιν — «домы сожгут»."
  48: "ἀποστρέψω ἀσέβειαν ἐκ τῆς γῆς — «отвращу нечестие от земли»; παιδευθήσονται πᾶσαι αἱ γυναῖκες — «наказаны (научены) будут все женщины»; οὐ μὴ ποιήσουσιν κατὰ τὰς ἀσεβείας αὐτῶν — «не будут делать по нечестиям их»."
  49: "δοθήσεται ἡ ἀσέβεια ὑμῶν ἐφ᾿ ὑμᾶς — «дано будет нечестие ваше на вас»; τὰς ἁμαρτίας τῶν ἐνθυμημάτων ὑμῶν λήμψεσθε — «грехи идолов (помышлений) ваших примете»; слав. «грехи кумир ваших»; γνώσεσθε διότι ἐγὼ κύριος — «узнаете, что Я Господь»."
