verses:
  1: "彼の治世[ちせい]の第九年[だいきゅうねん]、第十[だいじゅう]の月[つき]に、バビロンの王[おう]ネブカドネツァルは全[ぜん]軍[ぐん]を率[ひき]いてエルサレムに来[き]て、町[まち]に向[む]かって陣[じん]を取[と]り、周[まわ]りに包囲[ほうい]の壁[かべ]を築[きず]いた。"
  2: "町[まち]はセデキヤ王[おう]の第十一年[だいじゅういちねん]まで包囲[ほうい]された。"
  3: "その月[つき]の九日[ここのか]に、町[まち]の飢[き]饉[きん]が激[はげ]しくなり、その地[ち]の民[たみ]にはパンがなかった。"
  4: "町[まち]は破[やぶ]られ、戦[いくさ]の男[おとこ]たちはすべて夜[よる]のうちに、二[ふた]つの城壁[じょうへき]の間[あいだ]にある門[もん]、すなわち王[おう]の園[その]の門の道[みち]から出[で]て行[い]った。カルデア人[じん]たちは町の周[まわ]りにいた。王はアラバの道[みち]へ向[む]かった。"
  5: "カルデアの軍[ぐん]は王[おう]の後[あと]を追[お]い、エリコのアラボトで彼を捕[と]らえた。彼の軍[ぐん]はすべて彼から散[ち]り散[ぢ]りになった。"
  6: "彼らは王[おう]を捕[と]らえ、バビロンの王のもと、リブラへ連[つ]れて行[い]って、彼に判決[はんけつ]を告[つ]げた。"
  7: "彼はセデキヤの子[こ]らを彼の目の前[まなまえ]で殺[ころ]し、セデキヤの目[め]をつぶし、青銅[せいどう]の足枷[あしかせ]で彼を縛[しば]ってバビロンへ連[つ]れて行[い]った。"
  8: "第五[だいご]の月[つき]、その月の七日[なのか]に、すなわちバビロンの王[おう]ネブカドネツァルの第十九年[だいじゅうきゅうねん]に、バビロンの王の前に立[た]つ親衛隊[しんえいたい]の長[ちょう]ネブザルアダンがエルサレムに来[き]た。"
  9: "彼は主[しゅ]の家[いえ]と王[おう]の家[いえ]を焼[や]き、エルサレムのすべての家[いえ]を焼[や]き、すべての大[おお]きな家を火[ひ]で焼[や]いた。"
  10: "カルデアの軍[ぐん]は、エルサレムの周[まわ]りの城壁[じょうへき]を打[う]ち壊[こわ]した。"
  11: "ネブザルアダン親衛隊[しんえいたい]の長[ちょう]は、町[まち]に残[のこ]った民[たみ]の余[あま]り、バビロンの王[おう]の側[がわ]に落[お]ちた者[もの]たち、および残された民の群[む]れを捕囚[ほしゅう]として移[うつ]した。"
  12: "親衛隊[しんえいたい]の長[ちょう]は、その地[ち]の貧[まず]しい者[もの]たちのうちから、ぶどう園[えん]を耕[たがや]す者[もの]と農夫[のうふ]を残[のこ]した。"
  13: "カルデア人[じん]たちは、主[しゅ]の家[いえ]にある青銅[せいどう]の柱[はしら]、台座[だいざ]、主の家にある青銅の海[うみ]を砕[くだ]き、その青銅をバビロンへ運[はこ]んだ。"
  14: "また、大鍋[おおなべ]、十能[じゅうのう]、鉢[はち]、香炉[こうろ]、および奉仕[ほうし]に用[もち]いるすべての青銅[せいどう]の用具[ようぐ]を彼は取[と]った。"
  15: "親衛隊[しんえいたい]の長[ちょう]は、火[ひ]を入[い]れる器[うつわ]、金[きん]の鉢[はち]と銀[ぎん]の鉢を取った。"
  16: "ソロモンが主[しゅ]の家[いえ]のために造[つく]った二[ふた]つの柱[はしら]、一[ひと]つの海[うみ]、台座[だいざ]については、それらすべての青銅[せいどう]の用具[ようぐ]の重[おも]さは量[はか]ることができなかった。"
  17: "一[ひと]つの柱[はしら]の高[たか]さは十八[じゅうはち]キュビトで、その上[うえ]に青銅[せいどう]の柱頭[ちゅうとう]があり、柱頭の高さは三[みっ]キュビト、柱頭の周[まわ]りには網細工[あみざいく]とざくろがあった。すべて青銅であった。二[ふた]つ目の柱[はしら]も同じで、網細工[あみざいく]があった。"
  18: "親衛隊[しんえいたい]の長[ちょう]は、第一[だいいち]の祭司[さいし]セラヤ、第二[だいに]の祭司[さいし]ゼパニヤ、門[もん]を守[まも]る三人[さんにん]を取[と]った。"
  19: "また彼は町[まち]から、戦[いくさ]の男[おとこ]たちの上[うえ]に立[た]つ一人[ひとり]の宦官[かんがん]、町で見[み]つかった王[おう]の顔[かお]を見[み]る五人[ごにん]の者[もの]、その地[ち]の民を徴兵[ちょうへい]する軍[ぐん]の長[ちょう]の書記[しょき]、および町で見つかったその地の民六十人[ろくじゅうにん]を取った。"
  20: "親衛隊[しんえいたい]の長[ちょう]ネブザルアダンは彼らを捕[と]らえ、リブラのバビロンの王[おう]のもとへ連[つ]れて行[い]った。"
  21: "バビロンの王[おう]は彼らを打[う]ち、ハマテの地[ち]のリブラで彼らを殺[ころ]した。こうしてユダはその地[ち]から移[うつ]された。"
  22: "ユダの地[ち]に残[のこ]った民[たみ]、すなわちバビロンの王[おう]ネブカドネツァルが残した者[もの]たちの上[うえ]に、彼はシャファンの子[こ]アヒカムの子[こ]ゲダルヤを立[た]てた。"
  23: "軍[ぐん]の長[ちょう]たちはすべて、自分[じぶん]たちとその部下[ぶか]たちとともに、バビロンの王[おう]がゲダルヤを立[た]てたことを聞[き]いて、ミツパのゲダルヤのもとへ来[き]た。すなわち、ネタニヤの子[こ]イシュマエル、カレアの子ヨハナン、タネマトの子[こ]でネトファ人[じん]のセラヤ、マカティの子[こ]イエゾニア、彼らとその部下[ぶか]たちである。"
  24: "ゲダルヤは彼らとその部下[ぶか]たちに誓[ちか]って言[い]った。「カルデア人[じん]の来[く]ることを恐[おそ]れてはならない。この地[ち]に住[す]み、バビロンの王[おう]に仕[つか]えなさい。そうすれば、あなたがたは幸[しあわ]せになる。」"
  25: "第七[だいしち]の月[つき]に、王[おう]の血筋[ちすじ]に連[つら]なるエリシャマの子[こ]、ネタニヤの子イシュマエルが十人[じゅうにん]の者[もの]とともに来[き]て、ゲダルヤを打[う]ち、彼は死[し]んだ。ミツパで彼とともにいたユダ人[じん]たちとカルデア人[じん]たちも打たれた。"
  26: "民[たみ]はすべて、小[ちい]さい者[もの]から大[おお]きい者[もの]まで、軍[ぐん]の長[ちょう]たちも立[た]ち上[あ]がり、カルデア人[じん]を恐[おそ]れてエジプトへ入[はい]った。"
  27: "ユダの王[おう]ヨヤキンの捕囚[ほしゅう]の第三十七年[だいさんじゅうななねん]、第十二[だいじゅうに]の月[つき]の二十七日[にじゅうしちにち]に、バビロンの王[おう]エビル・メロダクは、その治世[ちせい]の年[とし]に、ユダの王ヨヤキンの頭[あたま]を上[あ]げて、彼を牢[ろう]の家[いえ]から出[だ]した。"
  28: "彼は彼と親[した]しく語[かた]り、バビロンで彼とともにいた王[おう]たちの王座[おうざ]よりも、彼の王座を高[たか]くした。"
  29: "彼はその囚[とら]われの衣[ころも]を着替[きが]えさせ、彼は一生[いっしょう]、彼の前[まえ]でいつもパンを食[た]べた。"
  30: "彼の扶養[ふよう]は、日[ひ]ごとの分[ぶん]として、いつも王[おう]の家[いえ]から彼に与[あた]えられた。すべての豊[ゆた]かさも彼の日[ひ]の間[あいだ]に与えられ、彼の一生[いっしょう]のすべての日[ひ]に及[およ]んだ。"

notes:
  1: "ἐν τῷ ἔτει τῷ ἐνάτῳ τῆς βασιλείας αὐτοῦ — в девятый год его царствования. ἐν τῷ μηνὶ τῷ δεκάτῳ — в десятый месяц (дня месяца LXX здесь не указывает, слав. тоже; в Синодальном — десятый день). παρενέβαλεν — расположился станом (слав. «обступи»). περύτειχος κύκλῳ — осадная стена вокруг."
  2: "ἐν περιοχῇ — в осаде (περιοχή). ἕως τοῦ ἑνδεκάτου ἔτους — до одиннадцатого года. В csl сюда же отнесено «девятаго дне месяца» (см. 3)."
  3: "ἐνάτῃ τοῦ μηνός — в девятый день месяца; в csl эти слова стоят в конце ст. 2, в LXX — в начале ст. 3 (в тексте по LXX). ἐνίσχυσεν ὁ λιμός — усилился голод. οὐκ ἦσαν ἄρτοι — не было хлебов."
  4: "ἐρράγη ἡ πόλις — «раскололся», город был взят. ὁδὸν πύλης τῆς ἀνὰ μέσον τῶν τειχέων — дорогою ворот между стенами. τοῦ κήπου τοῦ βασιλέως — царского сада. ἐπορεύθη ὁδὸν τὴν Αραβα — пошёл дорогою Аравы (пустыни). В csl скобочные вставки «(беша)» и «(царь седекиа)» — не переведены."
  5: "ἐδίωξεν — погнался. κατέλαβον — настигли, взяли. ἐν Αραβωθ Ιεριχω — на равнинах Иерихона. διεσπάρη — рассеялось."
  6: "συνέλαβον — взяли. ἤγαγον — привели. εἰς Δεβλαθα — в Деблафу (слав. «в ревлафу»; обычное русское «Ривла», в тексте リブラ). ἐλάλησεν μετ᾿ αὐτοῦ κρίσιν — букв. «говорил с ним суд», т.е. произвёл суд; передано «возвестил ему приговор»."
  7: "ἔσφαξεν — заклал. κατ᾿ ὀφθαλμοὺς αὐτοῦ — пред глазами его. ἐξετύφλωσεν — ослепил. ἐν πέδαις — в оковах (слав. «узами»)."
  8: "ἀρχιμάγειρος — букв. «начальник поваров», титул начальника телохранителей (слав. «архимагир»). В квадратных скобках LXX даёт дату: αὐτὸς ἐνιαυτὸς ἐννεακαιδέκατος τῷ Ναβουχοδονοσορ — «это девятнадцатый год Навуходоносора»; в csl та же дата — в тексте без скобок. ἑστὼς ἐνώπιον βασιλέως — стоящий пред царём; в csl «раб царя вавилонскаго»."
  9: "ἐνέπρησεν — сжёг. πᾶν οἶκον — всякий дом; в csl добавлено «великия» (большие) — по паритету в тексте 大きな家. Фраза LXX обрывается, её хвост («начальник телохранителей») — в ст. 10."
  10: "LXX ст. 10 — только ὁ ἀρχιμάγειρος («начальник телохранителей»), хвост фразы ст. 9; рассказ о разрушении стены в LXX отсутствует, он есть в csl («и стены Иерусалимли окрест раскопа сила халдейская») и в ru; по паритету в тексте."
  11: "τὸ περισσὸν τοῦ λαοῦ — остаток народа. τοὺς ἐμπεπτωκότας — перебежчиков (букв. «павших»). τὸ λοιπὸν τοῦ στηρίγματος — остаток опоры, простой народ (слав. «прочее и утверждение»). μετῆρεν — выселил."
  12: "ἀπὸ τῶν πτωχῶν τῆς γῆς — из бедных земли. ὑπέλιπεν — оставил. εἰς ἀμπελουργούς — в виноградари. εἰς γαβιν — «в земледельцы» (слав. «винограды блюсти и вертограды»; γαβιν — тёмное слово)."
  13: "στύλους — столпы. μεχωνωθ — подставы, bases (слав. «подставы»). τὴν θάλασσαν τὴν χαλκῆν — медное море, умывальница. συνέτριψαν — разбили. ἦραν — унесли."
  14: "λέβητας — котлы. ιαμιν — тёмное слово, вероятно «лопатки, совки» (слав. «конобы»). φιάλας — чаши, фиалы. θυίσκας — кадильницы. ἐν οἷς λειτουργοῦσιν — в которых служат."
  15: "πυρεῖα — сосуды для огня, кадильницы (слав. «кадилницы»). φιάλας τὰς χρυσᾶς καὶ τὰς ἀργυρᾶς — чаши золотые и серебряные."
  16: "σταθμὸς τοῦ χαλκοῦ — вес меди. οὐκ ἦν — не было. ἃ ἐποίησεν Σαλωμων — которые сделал Соломон."
  17: "χωθαρ — капитель, венец (слав. «глава»). σαβαχα — сетка, плетение (слав. «мрежи»). ῥοαί — гранатовые яблоки. κατὰ τὰ αὐτὰ τῷ στύλῳ τῷ δευτέρῳ — то же и со вторым столпом."
  18: "τὸν Σαραιαν ἱερέα τὸν πρῶτον — Сераию, первого священника (первосвященника). τὸν Σοφονιαν υἱὸν τῆς δευτερώσεως — Софонию, сына второго [священника] (слав. «софонию жерца втораго»). τοὺς φυλάσσοντας τὸν σταθμόν — стражей порога."
  19: "εὐνοῦχος — евнух. ἐπιστάτης ἐπὶ τῶν ἀνδρῶν τῶν πολεμιστῶν — надзиратель над военными. τῶν ὁρώντων τὸ πρόσωπον τοῦ βασιλέως — «видящих лицо царя», придворные. γραμματεύς — писец. ἐκτάσσων — ставящий в строй, записывающий."
  20: "ἀπήγαγεν — отвёл. εἰς Δεβλαθα — в Деблафу (Ривлу)."
  21: "ἔπαισεν — поразил. ἐθανάτωσεν — умертвил. ἀπῳκίσθη — был переселен. ἐπάνωθεν τῆς γῆς αὐτοῦ — «свыше земли своей»."
  22: "κατέστησεν ἐπ᾿ αὐτῶν — поставил над ними. Γοδολιαν υἱὸν Αχικαμ υἱοῦ Σαφαν — Годолию, сына Ахикама, сына Шафана."
  23: "ἄρχοντες τῆς δυνάμεως — князья силы, военачальники. εἰς Μασσηφαθ — в Массифу. Ισμαηλ υἱὸς Ναθανιου; Ιωαναν υἱὸς Καρηε; Σαραιας υἱὸς Θανεμαθ ὁ Νετωφαθίτης; Ιεζονιας υἱὸς τοῦ Μαχαθι. В csl в скобках добавлено «(приидоша)» — вставка, не переведена."
  24: "ὤμοσεν — поклялся. πάροδον τῶν Χαλδαίων — «приход халдеев» (слав. «пришествия»). καθίσατε — садитесь, живите. καλῶς ἔσται ὑμῖν — хорошо будет вам."
  25: "ἐκ τοῦ σπέρματος τῶν βασιλέων — из семени царей. ἐπάταξεν — поразил. ἀπέθανεν — умер. τοὺς Ιουδαίους καὶ τοὺς Χαλδαίους — иудеев и халдеев."
  26: "ἀνέστη — встал. ἀπὸ μικροῦ καὶ ἕως μεγάλου — от малого до великого. ἄρχοντες τῶν δυνάμεων — начальники сил. εἰσῆλθον εἰς Αἴγυπτον — вошли в Египет. ἐφοβήθησαν ἀπὸ προσώπου — убоялись лица."
  27: "τῆς ἀποικεσίας τοῦ Ιωακιμ — в LXX снова «Иоаким»; в csl «иоахина» (Иехония); в тексте ヨヤキン (см. 24:6). ὕψωσεν τὴν κεφαλήν — вознёс главу (освободил, возвысил). ἐξήγαγεν ἐξ οἴκου φυλακῆς — вывел из дома темницы."
  28: "ἐλάλησεν μετ᾿ αὐτοῦ ἀγαθά — говорил с ним благое. ἔδωκεν τὸν θρόνον αὐτοῦ ἐπάνωθεν τῶν θρόνων — поставил престол его выше престолов."
  29: "ἠλλοίωσεν τὰ ἱμάτια τῆς φυλακῆς — переменил одежды темницы. ἤσθιεν ἄρτον διὰ παντός — ел хлеб постоянно. πάσας τὰς ἡμέρας τῆς ζωῆς αὐτοῦ — во все дни жизни его."
  30: "ἡ ἑστιατορία — содержание, пища (слав. «пища»). διὰ παντός — постоянно. λόγον ἡμέρας ἐν τῇ ἡμέρᾳ αὐτοῦ — «слово дня в день его», дневная доля. В csl добавлено «и все изобилие во дни его» — нет в LXX; по паритету в тексте."
