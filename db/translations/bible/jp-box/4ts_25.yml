# jp-box, 4-я Царств, глава 25. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); церковнославянский (csl-ru) — второй
# свидетель церковного текста: слав. чтения и добавки входят в основной текст
# без 〔…〕, вариант LXX — в notes.
# ru (Синодальный) — только для понимания, не источник.
# Глава 25: падение Иерусалима (1–12), разграбление храма (13–17), казни
# (18–21), Годолия (22–26), освобождение Иехонии (27–30).
# Речь — 常体; слова людей — 「…」.
# Особенности паритета: 6, 20 — «Ривла» при LXX Δεβλαθα и слав. «ревлаф»;
# 8 — дата в квадратных скобках LXX есть и в csl, в тексте без скобок;
