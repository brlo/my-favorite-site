verses:
  1: "あなたの裁[さば]きは大[おお]きく、語[かた]り尽[つ]くせない。それゆえ、教[おし]えられぬ魂[たましい]は迷[まよ]った。"
  2: "聖[せい]なる民[たみ]を虐[しいた]げようと考[かんが]えた不法[ふほう]な者[もの]たちは、闇[やみ]と長[なが]い夜[よる]の囚人[しゅうじん]となり、屋根[やね]の下[した]に閉[と]じ込[こ]められて、永遠[えいえん]の摂理[せつり]からの逃亡者[とうぼうしゃ]として横[よこ]たわっていた。"
  3: "隠[かく]れた罪[つみ]の上[うえ]で身[み]を隠せると考[かんが]えていた彼[かれ]らは、忘却[ぼうきゃく]の光[ひかり]なき覆[おお]いのもとで散[ち]らされ、ひどく怯[おび]え、幻[まぼろし]に激[はげ]しくかき乱[みだ]された。"
  4: "彼[かれ]らを抱[だ]く奥[おく]まった所[ところ]も、彼らを恐[おそ]れなく保[たも]つことはなかった。彼らをかき乱す響[ひび]きが周[まわ]りを巡[めぐ]り、笑[え]みなき陰気[いんき]な顔[かお]の幻[まぼろし]が現[あらわ]れた。"
  5: "火[ひ]の力[ちから]もまったく照[て]らすことができず、星[ほし]の輝[かがや]く炎[ほのお]も、あの陰鬱[いんうつ]な夜[よる]を照[て]らし出[だ]すことはできなかった。"
  6: "ただ、恐[おそ]れに満[み]ちた火[ひ]がひとりでに燃[も]えて彼[かれ]らの前[まえ]に現[あらわ]れた。彼らは見[み]えないあの姿[すがた]に怯[おび]え、見えるものをさらに悪[わる]いものと思[おも]った。"
  7: "魔術[まじゅつ]の技[わざ]の戯[たわむ]れは倒[たお]れ伏[ふ]し、知恵[ちえ]による傲慢[ごうまん]は、辱[はずかし]めのうちに論破[ろんぱ]された。"
  8: "病[や]む魂[たましい]から恐[おそ]れと不安[ふあん]を追[お]い払[はら]うと約束[やくそく]した者[もの]たちは、笑[わら]うべき怯[おび]えに罹[かか]っていた。"
  9: "彼[かれ]らをかき乱[みだ]すものが何[なに]も恐[おそ]れさせなくても、獣[けもの]の行[ゆ]き来[き]と蛇[へび]のうなり声[ごえ]に追[お]い立[た]てられて、震[ふる]えながら滅[ほろ]び、どこへも逃[のが]れられない空気[くうき]を見[み]ることさえ拒[こば]んだ。"
  10: "悪[あく]は臆病[おくびょう]である。自分[じぶん]の証言[しょうげん]によって裁[さば]かれる悪は、良心[りょうしん]に捕[と]らえられて、いつも厳[きび]しいことを思[おも]い込[こ]む。"
  11: "恐[おそ]れとは、理性[りせい]から来[く]る助[たす]けを裏切[うらぎ]ること以外[いがい]の何[なに]ものでもない。"
  12: "内[うち]なる期待[きたい]は、弱[よわ]ければ弱いほど、苦[くる]しみを与[あた]える原因[げんいん]を知[し]らないことを、いっそう大[おお]きく見積[みつ]もる。"
  13: "そして彼[かれ]らは、まことに力[ちから]なき夜[よる]、力なきよみの奥[おく]から来[き]た夜に、いつもの眠[ねむ]りにつきながら、"
  14: "あるときは幻[まぼろし]の恐[おそ]ろしい姿[すがた]に追[お]われ、あるときは魂[たましい]の裏切[うらぎ]りによって力[ちから]を失[うしな]った。突然[とつぜん]の、予期[よき]せぬ恐[おそ]れが彼[かれ]らの上[うえ]に注[そそ]がれたからである。"
  15: "こうして、そこにいた者[もの]はだれであれ倒[たお]れ伏[ふ]し、鉄[てつ]のない牢[ろう]に閉[と]じ込[こ]められて見張[みは]られていた。"
  16: "農夫[のうふ]であれ、羊飼[ひつじか]いであれ、荒野[こうや]の労苦[ろうく]に携[たずさ]わる者[もの]であれ、捕[と]らえられれば逃[のが]れ難[がた]い必然[ひつぜん]を待[ま]った。すべての者が闇[やみ]という一[ひと]つの鎖[くさり]で縛[しば]られたからである。"
  17: "笛[ふえ]のように吹[ふ]く風[かぜ]であれ、広[ひろ]く茂[しげ]る枝[えだ]の間[あいだ]の鳥[とり]の美[うつく]しい声[こえ]であれ、激[はげ]しく流[なが]れる水[みず]の調[しら]べであれ、岩[いわ]の落[お]ちる無慈悲[むじひ]な響[ひび]きであれ、"
  18: "跳[は]ね回[まわ]る獣[けもの]の見[み]えない走[はし]りであれ、最も無慈悲[むじひ]な獣たちの吼[ほ]え声[ごえ]であれ、山[やま]の洞[ほら]から反響[はんきょう]するこだまであれ、これらのものは彼[かれ]らを恐[おそ]れさせ、力[ちから]を奪[うば]った。"
  19: "全世界[ぜんせかい]は明[あか]るい光[ひかり]に照[て]らされ、妨[さまた]げなく業[わざ]を続[つづ]けていたからである。"
  20: "ただ彼[かれ]らにだけ、重[おも]い夜[よる]が覆[おお]いかぶさっていた。それはやがて彼らを迎[むか]える闇[やみ]の像[かたち]であった。しかし彼らは自分[じぶん]たちにとって、闇よりも重かった。"

notes:
  1: "Μεγάλαι … αἱ κρίσεις — «велики суды Твои» (κρίσις); δυσδιήγητοι — «трудноизреченны, неописуемы» (δυσδιήγητος); слав. «неизглаголанни». ἀπαίδευτοι ψυχαί — «необученные, невоспитанные души» (ἀπαίδευτος); ἐπλανήθησαν — «заблудились» (πλανάω). Слав. добавляет обращение «(Господи)» в скобках — в LXX его нет, в текст не внесено."
  2: "ὑπειληφότες καταδυναστεύειν — «возмнив, что будут насильствовать» (ὑπολαμβάνω — «полагать»; καταδυναστεύω). ἔθνος ἅγιον — «народ святой». δέσμιοι σκότους καὶ μακρᾶς πεδῆται νυκτός — «узники тьмы и долгой ночи пленники» (δέσμιος, πεδήτης); слав. «узницы тмы и долгою нощию связани». κατακλεισθέντες ὀρόφοις — «заключённые под кровлями» (ὄροφος — «кровля»). φυγάδες τῆς αἰωνίου προνοίας — «беглецы вечного Промысла» (φυγάς, πρόνοια); ἔκειντο — «лежали»."
  3: "λανθάνειν νομίζοντες ἐπὶ κρυφαίοις ἁμαρτήμασιν — «думая укрыться в тайных грехах» (λανθάνω — «оставаться скрытым»). ἀφεγγεῖ λήθης παρακαλύμματι — «безсветным покровом забвения» (ἀφεγγής, λήθη, παρακάλυμμα). ἐσκορπίσθησαν — «рассеялись» (σκορπίζω). θαμβούμενοι δεινῶς — «страшно поражаемые» (θαμβέω); ἰνδάλμασιν ἐκταρασσόμενοι — «призраками возмущаемые» (ἴνδαλμα — «образ, призрак»)."
  4: "ὁ κατέχων αὐτοὺς μυχός — «охватывающий их тайник» (μυχός — «глубина, закоулок»; κατέχω — «держать»). ἀφόβους διεφύλαττεν — «сохранял бесстрашными». ἦχοι … περιεκέμπουν — «звуки обходили кругом» (редкий глагол со значением «обходить, кружить»). φάσματα ἀμειδήτοις κατηφῆ προσώποις ἐνεφανίζετο — «призраки являлись с неулыбчивыми, мрачными лицами» (ἀμειδής — «без улыбки»; κατηφής — «понурый, мрачный»); слав. «привидения дряхлая печальными лицами» передаёт ἀμειδής иначе (дряхлая)."
  5: "πυρὸς οὐδεμία βία κατίσχυεν φωτίζειν — «никакая сила огня не могла светить» (βία, κατισχύω). ἄστρων ἔκλαμπροι φλόγες — «яркие пламени звёзд» (ἔκλαμπρος). καταυγάζειν ὑπέμενον — «выносили освещать», т. е. были в силах. τὴν στυγνὴν ἐκείνην νύκτα — «ту мрачную ночь» (στυγνός)."
  6: "αὐτομάτη πυρά, φόβου πλήρης — «сам собою [зажжённый] костёр, полный страха» (αὐτόματος — «самодействующий»; πυρά — «костёр»); слав. «внезапный огнь страха исполнь» передаёт αὐτόματος иначе. ἐκδειματούμενοι — «приходя в ужас» (ἐκδειματόω). τῆς μὴ θεωρουμένης ἐκείνης ὄψεως — «того невидимого видения» (ὄψις). ἡγοῦντο χείρω τὰ βλεπόμενα — «считали видимое худшим» (ἡγέομαι — «считать»)."
  7: "μαγικῆς ἐμπαίγματα τέχνης — «обманы, издевательства магического искусства» (ἐμπαίγμα; слав. «волшебнаго художества… посмеяния»). κατέκειτο — «лежали поверженными». τῆς ἐπὶ φρονήσει ἀλαζονείας ἔλεγχος ἐφύβριστος — «обличение кичливости о разуме — поругательное» (ἀλαζονεία — «хвастовство»; ἔλεγχος — «обличение»; ἐφύβριστος — «издевательский»); слав. «о премудрости величания обличение укоризненно». В тексте 辱めのうちに論破された, чтобы передать ἔλεγχος."
  8: "οἱ ὑπισχνούμενοι — «обещавшие» (ὑπισχνέομαι). δείματα καὶ ταραχὰς ἀπελαύνειν — «отгонять ужасы и смятения» (δεῖμα, ταραχή, ἀπελαύνω). ψυχῆς νοσούσης — «болящей души». καταγέλαστον εὐλάβειαν ἐνόσουν — «болели смешным страхом» (εὐλάβεια здесь «страх»; νοσέω — «болеть»); слав. «посмеятелным страхом боляху»."
  9: "εἰ μηδὲν αὐτοὺς ταραχῶδες ἐφόβει — «если ничто смятенное не устрашало их». κνωδάλων παρόδοις — «проходами зверей» (πάροδος); ἑρπετῶν συριγμοῖς — «шипением пресмыкающихся» (συριγμός). ἐκσεσοβημένοι — «вспугнутые, согнанные» (σεσοβημένος). διώλλυντο ἔντρομοι — «погибали трепещущие». τὸν μηδαμόθεν φευκτὸν ἀέρα — «воздух, ниоткуда не избежный»: от воздуха не убежать; προσιδεῖν ἀρνούμενοι — «отказываясь взглянуть»."
  10: "δειλὸν γὰρ ἰδίῳ πονηρίᾳ μάρτυρι καταδικαζομένη — «робка бо злоба, своим свидетелем осуждаемая»: сказуемое δειλόν (ср. род) при подлежащем πονηρία (жен.), отсюда 悪は臆病. μάρτυρι — «свидетелем» (μάρτυς). ἀεὶ προσεΐληφεν τὰ χαλεπά — «всегда принимает в себя тяжкое» (χαλεπός); συνεχομένη τῇ συνειδήσει — «держимая совестью» (συνείδησις); слав. «выну приемлет во ум лютая, содержима совестию»."
  11: "οὐθὲν … εἰ μή — «ничто, кроме». προδοσία τῶν ἀπὸ λογισμοῦ βοηθημάτων — «предательство помощи от рассуждения» (προδοσία — «измена, предательство»; βοήθημα — «помощь»); слав. «лишение помощей сущих от помышления» передаёт иначе (лишение, а не измена); в тексте по LXX — 裏切り."
  12: "ἔνδοθεν οὖσα ἥττων ἡ προσδοκία — «ожидание, будучи внутри слабее» (προσδοκία — «ожидание»; ἥττων — «слабее»). πλείονα λογίζεται τὴν ἄγνοιαν — «большим считает неведение» (λογίζομαι). τῆς παρεχούσης τὴν βάσανον αἰτίας — «причины, дающей мучение» (βάσανος); слав. «болшее мнит неведение вины подающия муку»."
  13: "τὴν ἀδύνατον ὄντως νύκτα — «воистину немощную ночь» (ἀδύνατος — «бессильный, невозможный»); слав. «немощную поистинне нощь», Син. «невыносимую» — иное понимание. ἐξ ἀδυνάτου ᾅδου μυχῶν — «из немощного ада, из глубин»: повтор ἀδύνατος сохранён (力なき夜／力なきよみ); ᾅδης — よみ. τὸν αὐτὸν ὕπνον κοιμώμενοι — «тем же сном спящие»; стих продолжается в 17:14 (τὰ μὲν … τὰ δέ), поэтому кончается на ながら."
  14: "τὰ μὲν … τὰ δέ — «одно… другое», антитеза. τέρασιν ἠλαύνοντο φαντασμάτων — «ужасами призраков гонимы» (τέρας — «знамение, чудо», здесь «ужас»; φάντασμα — «призрак»). τῆς ψυχῆς παρελύοντο προδοσίᾳ — «расслабляемы предательством души» (παραλύω — «расслаблять»); слав. «души изчезаху преданием». αἰφνίδιος καὶ ἀπροσδόκητος φόβος ἐπεχύθη — «внезапный и неожиданный страх излился»."
  15: "εἶθ᾽ οὕτως — «затем так». ὃς δή ποτ᾽ οὖν ἦν ἐκεῖ καταπίπτων — «кто бы там ни был, падая» (καταπίπτω). ἐφρουρεῖτο — «охраняем был» (φρουρέω). εἰς τὴν ἀσίδηρον εἱρκτὴν κατακλεισθείς — «заключённый в темницу без железа» (ἀσίδηρος — «безжелезный»; εἱρκτή — «темница»); слав. «в темнице без железа заключен»: темница без оков, но неодолимая."
  16: "εἴ τε γάρ — «ибо если». γεωργός, ποιμήν, τῶν κατ᾽ ἐρημίαν ἐργάτης μόχθων — «земледелец, пастух или работник трудов в пустыне» (μόχθος — «труд»). προλημφθείς — «захваченный» (προλαμβάνω). τὴν δυσάλυκτον ἔμενεν ἀνάγκην — «ожидал трудноразрешимую нужду» (δυσάλυκτος). μιᾷ ἁλύσει σκότους πάντες ἐδέθησαν — «одной цепью тьмы все были связаны» (ἅλυσις); у csl эта фраза открывает 17:17 — держимся gr."
  17: "πνεῦμα συρίζον — «дух свистящий», т. е. свистящий ветер (συρίζω). περὶ ἀμφιλαφεῖς κλάδους — «вокруг раскидистых ветвей» (ἀμφιλαφής — «широко раскинувшийся»). ἦχος εὐμελής — «звук сладкозвучный» (εὐμελής). ῥυθμὸς ὕδατος πορευομένου βίᾳ — «ритм воды, идущей силою». κτύπος ἀπηνής — «стук суровый» (κτύπος, ἀπηνής); καταρριπτομένων πετρῶν — «обрушивающихся камней». Стих — перечень без сказуемого, сказуемое в 17:18; у csl слова о камнях отнесены к 17:18."
  18: "σκιρτώντων ζῴων δρόμος ἀθεώρητος — «бег скачущих животных невидимый» (σκιρτάω — «прыгать»). ὠρυομένων ἀπηνεστάτων θηρίων φωνή — «голос ревущих свирепейших зверей» (ὀρύομαι — «реветь»; превосходная степень от ἀπηνής, ср. 17:17, поэтому 最も無慈悲). ἀντανακλωμένη ἐκ κοιλότητος ὀρέων ἠχώ — «отражающееся из горной впадины эхо» (ἀντανακλάω, κοιλότης). παρέλυεν αὐτοὺς ἐκφοβοῦντα — «расслабляло их, устрашая» (παραλύω, ἐκφοβέω)."
  19: "ὅλος ὁ κόσμος — «весь мир». λαμπρῷ κατελάμπετο φωτί — «светлым светом озарялся» (καταλάμπω). ἀνεμποδίστοις συνεῖχετο ἔργοις — «беспрепятственными делами держался», т. е. всё шло своим чередом (ἀνεμπόδιστος — «беспрепятственный»; συνέχω — «держать вместе»); слав. «невозбранными делы содержашеся»."
  20: "μόνοις δὲ ἐκείνοις ἐπετέτατο — «только над ними одними простёрта была» (ἐπιτείνω — «простирать»). βαρεῖα νύξ — «тяжкая ночь». εἰκὼν τοῦ μέλλοντος αὐτοὺς διαδέχεσθαι σκότους — «образ имеющей принять их тьмы» (εἰκών; διαδέχομαι — «принимать, наследовать»); слав. «образ будущаго их восприятия тмы». ἑαυτοῖς ἦσαν βαρύτεροι σκότους — «сами себе были тяжелее тьмы»."
