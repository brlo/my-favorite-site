# jp-box, Премудрость Соломона, глава 17. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для 16–17 нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 17: тьма египетская и свет (1–20): суды Божии непостижимы (1), узники тьмы
# и долгой ночи (2), тайные грехи и призраки (3–4), ни огонь, ни звёзды не светят
# (5–6), посрамление магии (7–8), страх, совесть и ожидание (9–14), темница без
# железа (15–16), звуки ночи и всеобщее расслабление (17–18), мир в свете и тьма
# только для них (19–20).
# Прямой речи нет: всё авторский текст, 「…」 в главе нет.
# Нумерация по gr: 20 стихов, счёт совпадает с csl-ru. Две границы сдвинуты:
# csl 17:17 начинается словами «единым бо ужем тмы вси бяху связани» (по gr это конец
# 17:16), а csl 17:18 начинается словами «или шум зелный низпадающих камений» (по gr
# это конец 17:17). Держимся деления gr.
# 〔…〕 нет: все 20 стихов и все их слова есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: よみ, 魔術, 良心 и пр. уже в корпусе.
# Имена — транслитерация греческого (LXX); в главе имён нет.

