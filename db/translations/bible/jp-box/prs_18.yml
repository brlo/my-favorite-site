verses:
  1: "しかし、あなたの聖[せい]なる者[もの]たちには、最[もっと]も大[おお]きな光[ひかり]があった。声[こえ]を聞[き]いても姿[すがた]を見[み]ない者たちは、聖[せい]なる者[もの]たちもまた苦[くる]しみを受[う]けなかったので、彼[かれ]らを幸[さいわ]いだとたたえた。"
  2: "聖[せい]なる者[もの]たちは、前[まえ]もって害[がい]を受[う]けていながら害を加[くわ]えない。それゆえ、彼らを害した者[もの]たちは彼らに感謝[かんしゃ]し、和解[わかい]の恵[めぐ]みを求[もと]めた。"
  3: "それゆえ、あなたは彼[かれ]らに火[ひ]に燃[も]える柱[はしら]を与えて知[し]らない旅路[たびじ]の導[みちび]き手とし、名誉[めいよ]ある異郷[いきょう]の旅[たび]には害[がい]のない太陽[たいよう]を与[あた]えられた。"
  4: "あの者[もの]たちは光[ひかり]を奪[うば]われ、闇[やみ]に閉[と]じ込[こ]められるにふさわしかった。あなたの子[こ]らを監禁[かんきん]した者[もの]たちであり、その子らを通[とお]して、律法[りっぽう]の不滅[ふめつ]の光が世[よ]に与[あた]えられることになっていたからである。"
  5: "彼[かれ]らが聖[せい]なる者[もの]たちの幼[おさな]い子[こ]どもを殺[ころ]そうと決[き]めたとき、一人[ひとり]の子[こ]が捨[す]てられて助[たす]かった。あなたは彼らを咎[とが]めるために、彼らの多[おお]くの子どもを取[と]り去[さ]り、彼らを皆[みな]ひとまとめに激[はげ]しい水[みず]の中[なか]で滅[ほろ]ぼした。"
  6: "その夜[よる]はわたしたちの父[ちち]たちに前[まえ]もって知[し]らされていた。彼[かれ]らが信[しん]じた誓[ちか]いを確[たし]かに知って、勇[いさ]み立[た]つためであった。"
  7: "あなたの民[たみ]は、正[ただ]しい者[もの]の救[すく]いと、敵[てき]の滅[ほろ]びとを待[ま]ち望[のぞ]んだ。"
  8: "あなたが敵対[てきたい]する者[もの]たちを罰[ばっ]したその働[はたら]きによって、あなたはわたしたちを召[め]し寄[よ]せ、栄光[えいこう]をお与[あた]えになった。"
  9: "善[よ]い者[もの]たちの子[こ]どもである聖[せい]なる者たちは、父[ちち]たちの賛美[さんび]を先[さき]に歌[うた]いながら、密[ひそ]かに犠牲[ぎせい]を献[ささ]げ、神性[しんせい]の律法[りっぽう]を一致[いっち]して定[さだ]めた。すなわち、聖なる者たちが同[おな]じ善[よ]いものと危険[きけん]とを等[ひと]しく受[う]けるということである。"
  10: "敵[てき]の調和[ちょうわ]のない叫[さけ]びが響[ひび]き、悼[いた]まれる子[こ]どもたちの哀[あわ]れな声[こえ]が漂[ただよ]った。"
  11: "同[おな]じ裁[さば]きによって、奴隷[どれい]は主人[しゅじん]とともに罰[ばっ]せられ、平民[へいみん]は王[おう]と同[おな]じことを受[う]け、"
  12: "すべての者[もの]が一[ひと]つになって、一[ひと]つの死[し]の名[な]のもとに数[かぞ]えきれない死者[ししゃ]を抱[かか]えた。生[い]きている者たちは葬[ほうむ]るのに足[た]りず、彼[かれ]らの最[もっと]も尊[とうと]い世代[せだい]は一瞬[いっしゅん]のうちに滅[ほろ]ぼされたからである。"
  13: "彼[かれ]らは魔術[まじゅつ]のゆえに何[なに]ひとつ信[しん]じなかったが、長子[ちょうし]たちの滅[ほろ]びに際[さい]して、この民[たみ]が神[かみ]の子[こ]であることを認[みと]めた。"
  14: "静[しず]かな沈黙[ちんもく]がすべてを包[つつ]み、夜[よる]が自[みずか]らの速[はや]さのうちに中[なか]ほどに達[たっ]していたとき、"
  15: "あなたの全能[ぜんのう]の言葉[ことば]が、天[てん]から、王座[おうざ]から、容赦[ようしゃ]ない戦士[せんし]として、滅[ほろ]びの地[ち]のただ中[なか]へ、鋭[するど]い剣[つるぎ]、すなわち偽[いつわ]りのないあなたの命令[めいれい]を携[たずさ]えて跳[と]び込[こ]んだ。"
  16: "そして立[た]ち止[ど]まると、すべてを死[し]で満[み]たした。天[てん]に触[ふ]れながら、地[ち]の上[うえ]に立[た]っていた。"
  17: "そのとき、恐[おそ]ろしい夢[ゆめ]の幻[まぼろし]がたちまち彼[かれ]らをかき乱[みだ]し、思[おも]いがけない恐怖[きょうふ]が襲[おそ]いかかった。"
  18: "一人[ひとり]はここに、一人はかしこに投[な]げ出[だ]された半[はん]死[し]の者[もの]が、自分[じぶん]が死[し]ぬ原因[げんいん]を明[あき]らかにした。"
  19: "彼[かれ]らをかき乱[みだ]した夢[ゆめ]が、このことを前[まえ]もって告[つ]げたからである。彼らが、なぜ苦[くる]しみを受[う]けているかを知[し]らないまま滅[ほろ]びないためであった。"
  20: "かつて、死[し]の試練[しれん]は正[ただ]しい者[もの]たちにも及[およ]び、荒[あ]れ野[の]で多[おお]くの者[もの]が打[う]ち倒[たお]された。しかし、怒[いか]りは長[なが]くは続[つづ]かなかった。"
  21: "非[ひ]の打[う]ち所[どころ]のない人[ひと]が急[いそ]いで彼[かれ]らのために先陣[せんじん]を切[き]り、自分[じぶん]の務[つと]めの武器[ぶき]である祈[いの]りと、香[こう]による宥[なだ]めとを携[たずさ]えて、激[はげ]しい怒[いか]りに立[た]ち向[む]かい、災[わざわ]いに終止符[しゅうしふ]を打[う]ち、自分があなたのしもべであることを示[しめ]した。"
  22: "彼[かれ]は怒[いか]りに勝[か]った。それは体[からだ]の力[ちから]によるのではなく、武器[ぶき]の働[はたら]きによるのでもなく、言葉[ことば]によって、父[ちち]たちへの誓[ちか]いと契約[けいやく]と思[おも]い起[おこ]させつつ、罰[ばっ]する者[もの]を従[したが]わせたのである。"
  23: "すでに死者[ししゃ]が重[かさ]なり合[あ]って山[やま]をなしていたとき、彼[かれ]は真[ま]ん中[なか]に立[た]って怒[いか]りをせき止[と]め、生[い]きている者[もの]たちへの道[みち]を断[た]ち切[き]った。"
  24: "長衣[ながころも]の上[うえ]には全世界[ぜんせかい]があり、父[ちち]たちの栄光[えいこう]は四列[よれつ]の石[いし]の彫[ほ]り物[もの]の上[うえ]に、あなたの偉大[いだい]さは彼[かれ]の頭[あたま]の冠[かんむり]の上[うえ]にあった。"
  25: "滅[ほろ]ぼす者[もの]はこれらに屈[くっ]し、これらを恐[おそ]れた。怒[いか]りの試練[しれん]はそれだけで十分[じゅうぶん]であったからである。"

notes:
  1: "Τοῖς δὲ ὁσίοις σου — «Твоим святым/преподобным» (ὅσιος — святой, благочестивый; слав. «преподобным»). ὧν φωνὴν μὲν ἀκούοντες μορφὴν δὲ οὐχ ὁρῶντες — «слыша их голос, но не видя их образа»: подлежащее — египтяне, поэтому в тексте 声を聞いても姿を見ない者たち. ὅτι μὲν οὐ κἀκεῖνοι ἐπεπόνθεισαν — «потому что и они не пострадали»: «они» — святые, а не египтяне; слав. «занеже убо и они (тогожде) не страдаху» с глоссой (тогожде), которая в текст не внесена. ἐμακάριζον — «ублажали, называли блаженными»."
  2: "ὅτι δ᾽ οὐ βλάπτουσιν προηδικημένοι — «ибо, будучи прежде обижены, они не вредят»: подлежащее — святые. ηὐχαρίστουν — «благодарили» (εὐχαριστέω). τοῦ διενεχθῆναι χάριν ἐδέοντο — «просили благодати примирения»: διαφέρομαι — «быть в раздоре», χάριν с род. — «ради»; слав. «еже пронестися, благодати моляху» тёмно, Син. «просили прощения». В тексте 和解の恵みを求めた."
  3: "ἀνθ᾽ ὧν — «вместо того, за то» (ἀντί с род.). πυριφλεγῆ στῦλον — «огнепламенный столп» (πῦρ + φλέγω). ὁδηγὸν ἀγνώστου ὁδοιπορίας — «вожатого неведомого пути». ἥλιον ἀβλαβῆ φιλοτίμου ξενιτείας — «безвредное солнце честного/славного странствования»: φιλότιμος — «любящий честь, честный, славный»; ξενιτεία — «жизнь на чужбине». Слав. «любочестнаго странствования»; в тексте 名誉ある異郷の旅."
  4: "ἄξιοι ... στερηθῆναι φωτὸς καὶ φυλακισθῆναι σκότει — «достойны лишиться света и быть заключёнными во тьме» (φυλακίζω — «сажать в тюрьму»). οἱ κατακλείστους φυλάξαντες τοὺς υἱούς σου — «те, кто держал в заключении Твоих сынов» (κατάκλειστος — «запертый»). δι᾽ ὧν ἤμελλεν τὸ ἄφθαρτον νόμου φῶς τῷ αἰῶνι δίδοσθαι — «через которых имел быть дан веку/миру нетленный свет закона» (ἄφθαρτος — 不滅; αἰών — «век, мир»). В тексте 不滅の光."
  5: "Βουλευσαμένους ... ἀποκτεῖναι νήπια — «когда они замыслили убить младенцев святых» (βουλεύομαι — «совещаться, замышлять»). ἑνὸς ἐκτεθέντος τέκνου καὶ σωθέντος — «когда одно дитя было выставлено и спасено»: ἐκτίθημι — «выставлять» (о младенце; речь о Моисее, Исх 2:3). εἰς ἔλεγχον — «в обличение, для уличения». ἀφεῖλο — «отнял» (ἀφαιρέω). ἐν ὕδατι σφοδρῷ — «в сильной воде» (о Красном море). Слав. «во обличение их отял еси множество чад»."
  6: "ἐκείνη ἡ νὺξ προεγνώσθη πατράσιν ἡμῶν — «та ночь была предузнана отцами нашими» (προγινώσκω). ἵνα ἀσφαλῶς εἰδότες οἷς ἐπίστευσαν ὅρκοις ἐπευθυμήσωσιν — «чтобы, твёрдо зная обеты, в которые поверили, они воспрянули духом»: ἐπευθυμέω — редкий глагол, «ободряться, быть бодрым»; слав. «возблагодушествуют». Смысл: ночь исхода была предвозвещена, чтобы отцы укрепились в вере обетам."
  7: "προσεδέχθη ὑπὸ λαοῦ σου σωτηρία μὲν δικαίων, ἐχθρῶν δὲ ἀπώλεια — «ожидаемо было народом Твоим спасение праведных и погибель врагов»: προσδέχομαι — «ожидать, принимать»; слав. «восприято же бысть» понял глагол как «принято», поэтому в тексте 待ち望んだ по LXX, слав. вариант в notes. Двойное μέν/δέ сохранено."
  8: "ᾧ γὰρ ἐτιμωρήσω τοὺς ὑπεναντίους, τούτῳ ἡμᾶς προσκαλεσάμενος ἐδόξασας — «ибо тем, чем Ты наказал противников, тем, призвав нас, прославил»: относительное ᾧ... τούτῳ — «тем... тем»; τιμωρέω — «наказывать»; προσκαλέομαι — «призывать». Слав. «имже бо наказал еси супостаты нашя, сим нас призвав прославил еси»."
  9: "κρυφῇ ... ἐθυσίαζον ὅσιοι παῖδες ἀγαθῶν — «тайно приносили жертвы святые дети благих»: ἀγαθῶν можно понять и как «благих [людей]», и как «благ»; в тексте 善い者たちの子ら. τὸν τῆς θειότητος νόμον — «закон Божества/божественности» (θειότης), слав. «закон Божественный»; в тексте 神性の律法. ἐν ὁμονοίᾳ διέθεντο — «единодушно положили/установили» (διατίθημι). τῶν αὐτῶν ... καὶ ἀγαθῶν καὶ κινδύνων μεταλήμψεσθαι — «приобщиться тем же благам и опасностям» (μεταλαμβάνω). πατέρων ἤδη προαναμέλποντες αἴνους — «уже воспевая хвалы отцов» (προαναμέλπω)."
  10: "ἀντήχει ... ἡ βοή — «отзывался крик» (ἀντηχέω). ἀσύμφωνος — «несогласный, нестройный». οἰκτρὰ ... φωνὴ θρηνουμένων παίδων — «жалобный голос оплакиваемых детей»: θρηνέω — «оплакивать»; слав. «глас плачущих младенцев» смещает: у LXX дети — оплакиваемые, а не плачущие. В тексте 悼まれる子どもたち."
  11: "ὁμοίᾳ δὲ δίκῃ — «одинаковым судом/приговором» (δίκη). δοῦλος ἅμα δεσπότῃ κολασθείς — «раб, наказанный вместе с господином» (κολάζω). δημότης βασιλεῖ τὰ αὐτὰ πάσχων — «простолюдин, терпящий то же, что царь» (δημότης — «человек из народа»). Стих продолжается в 12; в тексте 11 оканчивается на 受け、."
  12: "ὁμοθυμαδὸν ... πάντες — «все единодушно». ἐν ἑνὶ ὀνόματι θανάτου — «под одним именем смерти», т. е. одной и той же смертью; слав. «во единем имени смертнем». ἀναριθμήτους — «неисчислимых». οὐδὲ ... πρὸς τὸ θάψαι οἱ ζῶντες ἦσαν ἱκανοί — «и живые не были в силах похоронить». πρὸς μίαν ῥοπήν — «в одно мгновение» (ῥοπή — «поворот весов, миг»). ἐντιμοτέρα γένεσις — «более почётное поколение», т. е. первенцы."
  13: "πάντα ... ἀπιστοῦντες διὰ τὰς φαρμακείας — «не веря ничему из-за чародейств» (φαρμακεία — «колдовство»); слав. «о всех бо не верующе ради чародеяний». ἐπὶ τῷ τῶν πρωτοτόκων ὀλέθρῳ — «при погибели первенцев» (ὄλεθρος). ὡμολόγησαν θεοῦ υἱὸν λαὸν εἶναι — «признали, что народ есть Сын Божий» (ὁμολογέω); слав. «исповедаша людий сынов Божиих быти» — мн. ч., но в LXX υἱόν ед. ч., в тексте 神の子 (ед. ч.)."
  14: "ἡσύχου ... σιγῆς περιεχούσης τὰ πάντα — «когда тихое молчание объяло всё» (περιέχω). νυκτὸς ἐν ἰδίῳ τάχει μεσαζούσης — «когда ночь в своём быстром течении была посреди» (μεσάζω — «быть в середине»; τάχος — «скорость»); слав. «нощи во своем течении преполовляющейся». Стихи 14–16 в LXX — одно предложение; 14 оканчивается на とき、."
  15: "ὁ παντοδύναμός σου λόγος — «всесильное слово Твоё» (παντοδύναμος). ἀπ᾽ οὐρανῶν ἐκ θρόνων βασιλείων — «с небес, от престолов царских». ἀπότομος πολεμιστής — «суровый/неумолимый воин» (ἀπότομος — «резкий, жёсткий»). εἰς μέσον τῆς ὀλεθρίας ... γῆς — «в середину погибельной земли». ξίφος ὀξὺ τὴν ἀνυπόκριτον ἐπιταγήν σου φέρων — «неся острый меч — нелицемерное повеление Твоё» (ἀνυπόκριτος — «нелицемерный»). Слав. в скобках добавляет обращение «(Господи)», которого нет в LXX; как в 17:1, в текст не внесено. Слова о мече слав. переносит в начало 18:16, в нашем тексте они в 15 по gr."
  16: "στὰς ἐπλήρωσεν τὰ πάντα θανάτου — «став, наполнил всё смертью» (πίμπλημι). οὐρανοῦ μὲν ἥπτετο, βεβήκει δ᾽ ἐπὶ γῆς — «неба касалось, но стояло на земле» (βέβηκα — perfect от βαίνω, «стоять, шествовать»). Слав. 18:16 начинается словами о мече, взятыми из gr 15; деление отмечено в шапке."
  17: "τότε παραχρῆμα — «тогда тотчас» (παραχρῆμα). φαντασίαι ὀνείρων δεινῶν ἐξετάραξαν — «видения страшных снов сильно потрясли» (φαντασία — «видение, призрак»; ἐκταράσσω). φόβοι ... ἀδόκητοι — «неожиданные страхи» (ἀδόκητος)."
  18: "ἄλλος ἀλλαχῇ ῥιφεὶς ἡμίθνητος — «один здесь, другой там брошенный, полумёртвый» (ῥίπτω — «бросать»; ἡμίθνητος). δι᾽ ἣν ἔθνῃσκον αἰτίαν ἐνεφάνιζεν — «объявлял причину, по которой умирал» (ἐμφανίζω — «являть»). Слав. «ин инамо вержен еле жив»."
  19: "οἱ γὰρ ὄνειροι θορυβήσαντες αὐτοὺς τοῦτο προεμήνυσαν — «ибо сны, приведя их в смятение, предвозвестили это» (θορυβέω; προμηνύω). ἵνα μὴ ἀγνοοῦντες δι᾽ ὃ κακῶς πάσχουσιν ἀπόλωνται — «чтобы они не погибли, не зная, за что терпят зло» (ἀγνοέω). Слав. «сония бо, смутивше их, сие предвозвестиша»."
  20: "Ἥψατο δὲ καὶ δικαίων πεῖρα θανάτου — «испытание смерти коснулось и праведных» (πεῖρα — «испытание, опыт»; ἅπτομαι — «касаться»). θραῦσις ἐν ἐρήμῳ ἐγένετο πλήθους — «в пустыне произошло поражение множества» (θραῦσις — «сокрушение»). οὐκ ἐπὶ πολὺ ἔμεινεν ἡ ὀργή — «гнев оставался недолго». Слав. добавляет «некогда», чего в LXX нет; внесено в текст (かつて)."
  21: "σπεύσας ... ἀνὴρ ἄμεμπτος προεμάχησεν — «поспешив, непорочный муж стал сражаться впереди/защищать» (προμαχέω). τὸ τῆς ἰδίας λειτουργίας ὅπλον — «оружие собственного служения» (λειτουργία — «служба, священнодействие»). προσευχὴν καὶ θυμιάματος ἐξιλασμὸν κομίσας — «принеся молитву и умилостивление фимиама» (ἐξιλασμός — «умилостивление, искупление»); в тексте 香による宥め. ἀντέστη τῷ θυμῷ καὶ πέρας ἐπέθηκε τῇ συμφορᾷ — «противостал ярости и положил конец бедствию» (συμφορά). δεικνὺς ὅτι σός ἐστιν θεράπων — «показывая, что он Твой служитель» (θεράπων — «слуга, служитель»). Речь об Аароне (ср. Чис 16:46–48)."
  22: "ἐνίκησεν ... τὸν χόλον — «победил ярость» (χόλος). οὐκ ἰσχύι τοῦ σώματος, οὐχ ὅπλων ἐνεργείᾳ — «не силой тела и не действием оружия». ἀλλὰ λόγῳ τὸν κολάζοντα ὑπέταξεν — «но словом подчинил наказывающего» (κολάζω; ὑποτάσσω). ὅρκους πατέρων καὶ διαθήκας ὑπομνήσας — «напомнив клятвы отцов и заветы» (ὑπομιμνῄσκω). Слав. «клятвы отцев и заветы воспомянув»."
  23: "σωρηδὸν ... πεπτωκότων ἐπ᾽ ἀλλήλων νεκρῶν — «когда мёртвые уже падали кучами друг на друга» (σωρηδόν — «кучами»). μεταξὺ στὰς ἀνέκοψε τὴν ὀργήν — «став посреди, остановил гнев» (ἀνακόπτω — «сдерживать»). διέσχισεν τὴν πρὸς τοὺς ζῶντας ὁδόν — «разделил/преградил путь к живым» (διασχίζω — «раскалывать, разделять»). Слав. «пресече гнев и раздели к живым путь»."
  24: "ἐπὶ ποδήρους ἐνδύματος — «на длинной до пят одежде» (ποδήρης — «до пят»); слав. «подир». ὅλος ὁ κόσμος — «весь мир» (κόσμος здесь — «украшение, вселенная»). πατέρων δόξαι — «славы отцов», т. е. имена двенадцати колен. ἐπὶ τετραστίχου λίθων γλυφῆς — «на четырёхрядной резьбе камней» (τετράστιχος — «в четыре ряда»; γλυφή — «резьба»); речь о наперснике (Исх 28:15–21). μεγαλωσύνη σου ἐπὶ διαδήματος κεφαλῆς αὐτοῦ — «величие Твоё на диадиме головы его» (διάδημα — «венец, диадима»); в тексте 冠."
  25: "τούτοις εἶξεν ὁ ὀλεθρεύων — «этому уступил губитель» (εἴκω — «уступать»; ὀλεθρεύων — «истребляющий», ангел-губитель). ταῦτα δὲ ἐφοβήθη — «и этого убоялся». ἦν γὰρ μόνη ἡ πεῖρα τῆς ὀργῆς ἱκανή — «ибо одного испытания гнева было достаточно» (πεῖρα — «испытание»). Слав. «сим уступил искореняяй и сих устрашися»."
