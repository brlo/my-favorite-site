# jp-box, Премудрость Соломона, глава 18. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для 18–19 нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 18: свет святым и тьма египтянам (1–4), гибель первенцев и ночь исхода
# (5–19), Аарон и первосвященническое служение (20–25). Прямой речи нет: вся глава —
# авторское повествование; красного и синего нет.
# Нумерация по gr: 25 стихов. Слав. делит так же, но 18:15–16 иначе: csl 18:15
# оканчивается на «сниде», а слова «мечь остр... носяй» открывают csl 18:16
# (в LXX они внутри 18:15); в нашем тексте — по gr. Слав. 18:15 в скобках добавляет
# «(Господи)», а 18:20 — «некогда». Обращение, как и в 17:1, в текст не внесено (его
# нет в LXX); «некогда» внесено в основной текст и отмечено в notes.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz. Сносок ⟨…⟩ нет: глава не вводит
# новых терминов; アロン, 祭壇, 香, 長衣 уже в корпусе (Исх 28).
# Имена — транслитерация греческого (LXX); в тексте главы имён нет.

