verses:
  1: "酒[さけ]にふける働[はたら]き手[て]は富[とみ]を得[え]ない。小[ちい]さなものを侮[あなど]る者[もの]は、少[すこ]しずつ落[お]ちて行[い]く。"
  2: "酒[さけ]と女[おんな]は悟[さと]りのある者[もの]を迷[まよ]わせ、遊女[ゆうじょ]に身[み]を寄[よ]せる者[もの]は、さらに大胆[だいたん]になる。"
  3: "腐[くさ]りと虫[むし]が彼[かれ]を嗣業[しぎょう]として受[う]け継[つ]ぎ、大胆[だいたん]な魂[たましい]は取[と]り去[さ]られる。"
  4: "すぐに信[しん]じる者[もの]は心[こころ]が軽[かる]い。自分[じぶん]の魂[たましい]に対して罪[つみ]を犯[おか]す者[もの]は、自[みずか]ら罪[つみ]を負[お]う。"
  5: "心[こころ]で喜[よろこ]びにふける者[もの]は罪[つみ]に定[さだ]められる。しかし欲望[よくぼう]に逆[さか]らう者[もの]は、自分[じぶん]の命[いのち]に冠[かんむり]を戴[いただ]く。"
  6: "舌[した]を制[せい]する者[もの]は争[あらそ]いなく生[い]き、むだ話[ばなし]を憎[にく]む者[もの]は悪[あく]を減[へ]らす。"
  7: "決[けっ]して言葉[ことば]を二度[にど]繰[く]り返[かえ]すな。そうすれば、あなたは何[なに]も失[うしな]わない。"
  8: "友[とも]にも敵[てき]にも語[かた]り明[あ]かすな。もしそれがあなたの罪[つみ]でないなら、明[あ]かすな。"
  9: "彼[かれ]はあなたの話[はなし]を聞[き]いて身[み]を守[まも]ったが、時[とき]が来[く]ればあなたを憎[にく]むからである。"
  10: "言葉[ことば]を聞[き]いたか。その言葉[ことば]はあなたとともに死[し]ぬがよい。勇[いさ]めよ、それはあなたを裂[さ]くことはない。"
  11: "愚[おろ]かな者[もの]は言葉[ことば]のゆえに、子[こ]を産[う]む女[おんな]が幼[おさな]子[ご]のゆえに苦[くる]しむように苦しむ。"
  12: "肉[にく]の腿[もも]に突[つ]き刺[さ]さった矢[や]のように、愚[おろ]かな者[もの]の腹[はら]の内[うち]に言葉[ことば]がある。"
  13: "友[とも]を戒[いまし]めよ。彼[かれ]がそれをしなかったかもしれないからである。もし何[なに]かをしたのなら、重[かさ]ねてしないようにさせよ。"
  14: "隣人[りんじん]を戒[いまし]めよ。彼[かれ]がそれを言[い]わなかったかもしれないからである。もし言ったのなら、二度[にど]繰[く]り返[かえ]さないようにさせよ。"
  15: "友[とも]を戒[いまし]めよ。しばしば中傷[ちゅうしょう]があるからである。"
  16: "すべての言葉[ことば]を信[しん]じてはならない。"
  17: "心[こころ]からではなく、言葉[ことば]で滑[すべ]る者[もの]がある。だれが自分[じぶん]の舌[した]で罪[つみ]を犯[おか]さなかっただろうか。"
  18: "脅[おど]す前[まえ]に隣人[りんじん]を戒[いまし]めよ。怒[いか]らずに、いと高[たか]い方[かた]の律法[りっぽう]に場[ば]所[しょ]を与[あた]えよ。<br><br>主[しゅ]を恐[おそ]れることは受[う]け入[い]れられる始[はじ]めであり、知恵[ちえ]は主から愛[あい]を得[え]させる。主[しゅ]の戒[いまし]めを知[し]ることは命[いのち]の教[おし]えであり、主の喜[よろこ]ばれることを行[おこな]う者[もの]は不死[ふし]の木[き]の実[み]を食[た]べる。すべての知恵[ちえ]は主[しゅ]を恐[おそ]れることであり、すべての知恵のうちに律法[りっぽう]の行[おこな]いがある。また、主[しゅ]の全能[ぜんのう]についての知識[ちしき]がある。"
  19: "僕[しもべ]が主人[しゅじん]に「お気[き]に召[め]すようにはいたしません」と言[い]い、その後[のち]でそうしたなら、その僕は自分[じぶん]を養[やしな]う者[もの]を怒[いか]らせる。悪[あく]の知識[ちしき]は知恵[ちえ]ではなく、罪人[つみびと]たちの計[はかり]ごとがあるところに悟[さと]りはない。"
  20: "悪賢[わるがしこ]さがあり、それも忌[い]むべきものである。また、知恵[ちえ]に乏[とぼ]しい愚[おろ]かな者[もの]がある。"
  21: "悟[さと]りに乏[とぼ]しくとも主[しゅ]を恐[おそ]れる者[もの]は、思慮[しりょ]に富[と]みながら律法[りっぽう]を犯[おか]す者[もの]よりも優[すぐ]れている。"
  22: "鋭[するど]い悪賢[わるがしこ]さがあり、それも不正[ふせい]である。また、裁[さば]きを明[あき]らかにするために事[こと]を曲[ま]げる者[もの]がある。"
  23: "暗[くら]さに身[み]を屈[かが]めて悪[あく]を働[はたら]く者[もの]があり、その内[うち]は欺[あざむ]きで満[み]ちている。"
  24: "顔[かお]を隠[かく]し、聞[き]こえないふりをして、知[し]られていないところであなたを先回[さきまわ]りする。"
  25: "力[ちから]の乏[とぼ]しさのゆえに罪[つみ]を犯[おか]すことを妨[さまた]げられても、機会[きかい]を見[み]つければ悪[あく]を働[はたら]く。"
  26: "人[ひと]はその姿[すがた]から知[し]られ、悟[さと]りのある者[もの]は顔[かお]の出会[であ]いから知られる。"
  27: "人[ひと]の装[よそお]いと歯[は]の笑[わら]いと歩[あゆ]みが、その人についてのことを告[つ]げる。"
  28: "見苦[みぐる]しい叱責[しっせき]がある。また、黙[だま]っている者[もの]がいて、その者こそ思慮[しりょ]深[ぶか]い。"

notes:
  1: "ἐργάτης μέθυσος — «работник пьяница» (μέθυσος — пьяный); ὁ ἐξουθενῶν τὰ ὀλίγα — «уничижающий малое» (ἐξουθενέω — презирать); κατὰ μικρὸν πεσεῖται — «понемногу упадёт». Слав. «Делатель пиянивый»."
  2: "οἶνος καὶ γυναῖκες ἀποστήσουσιν συνετούς — «вино и женщины отвратят разумных» (ἀφίστημι — отвращать, уводить); ὁ κολλώμενος πόρναις — «прилепляющийся к блудницам» (κολλάω — прилепляться; πόρνη — блудница). Слав. «прилагаяйся любодейцам»."
  3: "σῆπες (σήπη) καὶ σκώληκες κληρονομήσουσιν αὐτόν — «гниль и черви наследуют его» (σήψ — гниение; σκώληξ — червь); ψυχὴ τολμηρὰ ἐξαρθήσεται — «дерзкая душа будет исторгнута» (ἐξαίρω). Слав. «молие и червие наследят его»."
  4: "ὁ ταχὺ ἐμπιστεύων κοῦφος καρδίᾳ — «скоро верящий легкомыслен сердцем» (κοῦφος — лёгкий); ὁ ἁμαρτάνων εἰς ψυχὴν αὐτοῦ πλημμελήσει — «согрешающий против души своей потерпит урон» (πλημμελέω — погрешать). Слав. «Емляй скоро веру легок сердцем»."
  5: "ὁ εὐφραινόμενος καρδίᾳ καταγνωσθήσεται — «веселящийся сердцем будет осуждён» (καταγινώσκω — осуждать). Слав. добавляет «противляяйся же похотем венчает живот свой» — этого нет в LXX-модуле, но есть в полном тексте (KJV: «he that resisteth pleasures crowneth his life»); внесено без 〔…〕."
  6: "καὶ ὁ μισῶν λαλιὰν ἐλαττονοῦται κακίᾳ — «и ненавидящий болтливость умаляется злом». Слав. 19:6 добавляет «Обуздаваяй язык тихомирно поживет» — чтение полного текста (KJV: «He that can rule his tongue shall live without strife»), в LXX-модуле отсутствует; внесено без 〔…〕, отмечено здесь."
  7: "μηδέποτε δευτερώσῃς λόγον — «никогда не повторяй слова» (δευτερόω — повторять); οὐθέν σοι οὐ μὴ ἐλαττωθῇ — «ничто у тебя не убавится». Слав. «Словесе никогдаже повтори»."
  8: "ἐν φίλῳ καὶ ἐχθρῷ μὴ διηγοῦ — «при друге и враге не рассказывай»; εἰ μή ἐστίν σοι ἁμαρτία, μὴ ἀποκάλυπτε — «если нет тебе греха, не открывай». Слав. «На друга и на врага не поведай»."
  9: "ἀκήκοεν γάρ σου — «ибо он услышал от тебя»; ἐφυλάξατό σε — «и остерёгся тебя» (φυλάσσω); ἐν καιρῷ μισήσει σε — «во время возненавидит тебя». Слав. «слыша бо у тебе, и соблюдет тя»."
  10: "ἀκήκοας λόγον; συναποθανέτω σοι — «услышал слово? пусть умрёт с тобою» (συναποθνήσκω); θάρσει, οὐ μή σε ῥήξει — «дерзай, оно не разорвёт тебя» (ῥήγνυμι — разрывать). Слав. «не расторгнет тебе»."
  11: "ἀπὸ προσώπου λόγου ὠδινήσει μωρός — «от лица слова будет мучиться глупый» (ὠδίνω — мучиться родами); ὡς ἀπὸ προσώπου βρέφους ἡ τίκτουσα — «как рождающая от лица младенца». Слав. «поболит буй»."
  12: "βέλος πεπηγὸς ἐν μηρῷ σαρκός — «стрела, вонзённая в бедро плоти» (πήγνυμι — вонзать); λόγος ἐν κοιλίᾳ μωροῦ — «слово во чреве глупого». Слав. «Стрела вонзена в стегно плоти»."
  13: "Ἔλεγξον φίλον, μήποτε οὐκ ἐποίησεν — «обличи друга: может быть, он не сделал»; εἴ τι ἐποίησεν, μήποτε προσθῇ — «если же сделал, чтобы не прибавил (не повторил)» (προστίθημι). Слав. «Обличи друга, егда еще не сотворил»."
  14: "ἔλεγξον τὸν πλησίον, μήποτε οὐκ εἶπεν — «обличи ближнего: может быть, он не сказал»; εἰ εἴρηκεν, ἵνα μὴ δευτερώσῃ — «если сказал, чтобы не повторял». Слав. 19:14."
  15: "ἔλεγξον φίλον, πολλάκις γὰρ γίνεται διαβολή — «обличи друга, ибо часто бывает клевета» (διαβολή — навет, клевета); μὴ παντὶ λόγῳ πίστευε — «не всякому слову верь». Слав. делит 15 на 15–16; по перенумерации принято деление слав."
  16: "Продолжение ст. 15 (тот же стих по-гречески)."
  17: "ἔστιν ὀλισθάνων καὶ οὐκ ἀπὸ ψυχῆς — «есть скользящий (ошибающийся) и не от души» (ὀλισθάνω — скользить); τίς οὐχ ἥμαρτεν ἐν τῇ γλώσσῃ αὐτοῦ — «кто не согрешил языком своим». Слав. 19:17."
  18: "ἔλεγξον τὸν πλησίον σου πρὶν ἢ ἀπειλῆσαι — «обличи ближнего твоего прежде, чем угрожать» (ἀπειλέω — угрожать); δὸς τόπον νόμῳ ὑψίστου — «дай место закону Всевышнего». По полному тексту добавлено «γινόμενος ἄμηνις» — «будучи без гнева» (KJV: «and not being angry»); в LXX-модуле этой клаузы нет. Слав. 19:18 вбирает также гр 20. В gr-lxx-byz на месте стиха стоит «.» (дефект модуля). φόβος Κυρίου ἀρχὴ προσλήψεως — «страх Господень — начало принятия» (πρόσληψις — принятие); σοφία δὲ παρ᾿ αὐτοῦ ἀγάπησιν περιποιεῖ — «премудрость же от Него приобретает любовь» (περιποιέω — приобретать). Чтение полного церковного греч. текста (GOARCH, в скобках); в слав. стиха нет (csl 19:18 = гр 17 + 20). В gr-lxx-byz на месте стиха стоит «.» (дефект модуля). γνῶσις ἐντολῶν Κυρίου παιδεία ζωῆς — «знание заповедей Господних — наставление жизни» (παιδεία); οἱ ποιοῦντες τὰ ἀρεστὰ αὐτῷ — «делающие угодное Ему»; ἀθανασίας δένδρον καρποῦνται — «вкушают плод древа бессмертия» (ἀθανασία). Чтение полного текста (GOARCH, в скобках); в слав. стиха нет. Πᾶσα σοφία φόβος κυρίου — «всякая премудрость — страх Господень»; ἐν πάσῃ σοφίᾳ ποίησις νόμου — «во всякой премудрости — исполнение закона». По полному тексту (GOARCH) добавлено «καὶ γνῶσις τῆς παντοδυναμίας αὐτοῦ» — «и знание всемогущества Его» (παντοδυναμία); в LXX-модуле нет, в слав. 19:20 стоит гр 23. Слав. 19:19 = гр 22, 19:21 = гр 24. Слав. 19:18 объединяет гр 19:17 и 19:20; стихи полного LXX 19:18–19 (страх Господень — начало принятия; знание заповедей — научение жизни), отсутствующие в слав. краткой редакции, сохранены здесь."
  19: "В gr-lxx-byz на месте стиха стоит «.» (дефект модуля). οἰκέτης λέγων τῷ δεσπότῃ· ὡς ἀρέσκει οὐ ποιήσω — «слуга, говорящий господину: как угодно, не сделаю» (οἰκέτης — слуга; δεσπότης — господин); ἐὰν μετὰ ταῦτα ποιήσῃ, παροργίζει τὸν τρέφοντα αὐτόν — «если после этого сделает, прогневляет питающего его» (παροργίζω — раздражать). Чтение полного текста (GOARCH, в скобках; KJV 19:21); в слав. стиха нет. οὐκ ἔστιν σοφία πονηρίας ἐπιστήμη — «не есть премудрость — знание злобы»; ὅπου βουλὴ ἁμαρτωλῶν φρόνησις — «где совет грешников, там нет разума» (φρόνησις). Слав. 19:19. Слав. краткая редакция не содержит ст. 19:21 (раб, обещающий и не исполняющий); стих полного LXX сохранён здесь, при csl 19:19."
  20: "ἔστιν πανουργία καὶ αὕτη βδέλυγμα — «есть лукавство, и оно мерзость» (πανουργία — лукавство, хитрость); ἄφρων ἐλαττούμενος σοφίᾳ — «глупый, оскудевающий премудростью». Слав. 19:20."
  21: "κρείττων ἡττώμενος ἐν συνέσει ἔμφοβος — «лучше умалённый в разумении, но боящийся» (ἡττάομαι — быть ниже, умаляться; ἔμφοβος — боязливый); ἢ περισσεύων ἐν φρονήσει καὶ παραβαίνων νόμον — «чем изобилующий разумом и преступающий закон». Слав. 19:21."
  22: "ἔστιν πανουργία ἀκριβὴς καὶ αὕτη ἄδικος — «есть хитрость изощрённая, и она неправедна» (ἀκριβής — точный, изощрённый); διαστρέφων χάριν τοῦ ἐκφᾶναι κρίμα — «извращающий, чтобы вынести суд» (διαστρέφω — извращать). Слав. 19:22."
  23: "ἔστιν πονηρευόμενος συγκεκυφὼς μελανίᾳ — «есть лукавствующий, согбенный чернотою» (συγκύπτω — сгибаться; μελανία — чернота); τὰ ἐντὸς αὐτοῦ πλήρη δόλου — «внутреннее его полно коварства» (δόλος). Слав. 19:23."
  24: "συγκρύφων πρόσωπον — «скрывающий лицо» (συγκρύπτω — скрывать); ἐθελοκωφῶν — «притворяющийся глухим» (ἑθελόκωφος); ὅπου οὐκ ἐπεγνώσθη, προφθάσει σε — «где не был узнан, предупредит тебя» (προφθάνω). Слав. 19:24."
  25: "ἐὰν ὑπὸ ἐλαττώματος ἰσχύος κωλυθῇ ἁμαρτεῖν — «если по недостатку силы удержан от греха» (ἐλάττωμα — недостаток); ἐὰν εὕρῃ καιρόν, κακοποιήσει — «если найдёт время, сделает зло». Слав. 19:25."
  26: "ἀπὸ ὁράσεως ἐπιγνωσθήσεται ἀνήρ — «по виду узнаётся человек» (ὅρασις — вид); ἀπὸ ἀπαντήσεως προσώπου ἐπιγνωσθήσεται νοήμων — «по встрече лица узнаётся разумный» (ἀπάντησις). Слав. 19:26."
  27: "στολισμὸς ἀνδρὸς καὶ γέλως ὀδόντων — «одеяние человека и смех зубов» (στολισμός — одежда); βήματα ἀνθρώπου ἀναγγελεῖ τὰ περὶ αὐτοῦ — «шаги человека возвестят о нём» (ἀναγγέλλω — возвещать). Слав. 19:27."
  28: "Ἔστιν ἔλεγχος ὃς οὐκ ἔστιν ὡραῖος — «есть обличение, которое не прекрасно» (ὡραῖος — прекрасный, благовременный); ἔστιν σιωπῶν καὶ αὐτὸς φρόνιμος — «есть молчащий — и он разумен» (φρόνιμος — благоразумный). По слав. этот стих (гр 20:1) стоит в конце гл. 19 — csl 19:28, а csl 20:1 начинается с гр 20:2; поэтому он перенесён сюда из нашего прежнего 20:1."
