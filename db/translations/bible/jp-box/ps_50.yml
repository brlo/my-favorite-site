verses:
  0: "指揮者[しきしゃ]に。ダビデの詩[うた]。預言者[よげんしゃ]ナタンが彼[かれ]のもとに来[き]たとき、ダビデがバテシバのところに入[はい]った後のこと。"
  1: "神[かみ]よ、あなたの大[おお]きなあわれみによってわたしをあわれみ、あなたの慈[いつく]しみの多[おお]さによって、わたしの背[そむ]きをぬぐい去[さ]ってください。"
  2: "わたしの不法[ふほう]からわたしをよく洗[あら]い、わたしの罪[つみ]からわたしを清[きよ]めてください。"
  3: "わたしは自分[じぶん]の不法[ふほう]を知[し]っている。わたしの罪[つみ]はいつもわたしの前[まえ]にある。"
  4: "わたしはあなたにだけ罪[つみ]を犯[おか]し、あなたの目[め]の前[まえ]に悪[あく]を行[おこな]った。あなたが語[かた]られるときに正[ただ]しいとされ、裁[さば]かれるときに勝[か]たれるためである。"
  5: "見[み]よ、わたしは不法[ふほう]のうちに宿[やど]され、母[はは]は罪[つみ]のうちにわたしを宿[やど]した。"
  6: "見[み]よ、あなたは真実[しんじつ]を愛[あい]された。あなたは、隠[かく]れた知恵[ちえ]の秘[ひ]め事[ごと]をわたしに示[しめ]された。"
  7: "ヒソプでわたしにふりかけてください。そうすればわたしは清[きよ]くなる。わたしを洗[あら]ってください。そうすればわたしは雪[ゆき]よりも白[しろ]くなる。"
  8: "わたしに喜[よろこ]びと楽[たの]しみとを聞[き]かせてください。そうすれば、低[ひく]くされた骨[ほね]が喜[よろこ]ぶだろう。"
  9: "あなたの顔[かお]をわたしの罪[つみ]からそむけ、わたしの不法[ふほう]をすべてぬぐい去[さ]ってください。"
  10: "神[かみ]よ、わたしのうちに清[きよ]い心[こころ]を造[つく]り、わたしの内[うち]に正[ただ]しい霊[れい]を新[あら]たにしてください。"
  11: "わたしをあなたの顔[かお]から投[な]げ捨[す]てないでください。あなたの{聖霊[せいれい]|聖神[せいしん]}をわたしから取[と]り去[さ]らないでください。"
  12: "あなたの救[すく]いの喜[よろこ]びをわたしに返[かえ]し、主導[しゅどう]の霊[れい]でわたしを支[ささ]えてください。"
  13: "わたしは不法[ふほう]の者[もの]たちにあなたの道[みち]を教[おし]え、悪[わる]い者[もの]たちがあなたに帰[かえ]るようにする。"
  14: "わたしの救[すく]いの神[かみ]よ、血[ち]の罪[つみ]からわたしを救[すく]い出[だ]してください。そうすれば、わたしの舌[した]はあなたの義[ぎ]を喜[よろこ]び歌[うた]う。"
  15: "主[しゅ]よ、あなたがわたしの唇[くちびる]を開[ひら]いてくださると、わたしの口[くち]はあなたへの賛美[さんび]を告[つ]げる。"
  16: "あなたがいけにえを望[のぞ]まれたなら、わたしはささげただろう。全焼[ぜんしょう]のいけにえを、あなたは喜[よろこ]ばない。"
  17: "神[かみ]へのいけにえは、砕[くだ]けた霊[れい]である。神[かみ]よ、砕[くだ]けて低[ひく]くされた心[こころ]を、あなたは見[み]捨[す]てられない。"
  18: "主[しゅ]よ、あなたの恵[めぐ]みによってシオンを良[よ]くしてください。エルサレムの城壁[じょうへき]が建[た]てられますように。"
  19: "そのとき、あなたは義[ぎ]のいけにえ、ささげ物[もの]と全焼[ぜんしょう]のいけにえとを喜[よろこ]ばれる。そのとき、人[ひと]々[びと]はあなたの祭壇[さいだん]に雄牛[おうし]をささげる。"

notes:
  0: "Εἰς τὸ τέλος· ψαλμὸς τῷ Δαυιδ, ἐν τῷ ἐλθεῖν πρὸς αὐτὸν Ναθαν τὸν προφήτην, ἡνίκα εἰσῆλθεν πρὸς Βηρσαβεε — 指揮者に。ダビデの詩。預言者ナタンが彼のもとに来たとき、ダビデがバテシバのところに入った後のこと (Ναθαν — ナタン, современная форма, у jp-joc ナファン; Βηρσαβεε — バテシバ, по евр. Бат-Шева, в Синодальном Вирсавия. Надписание — стих 0, скобками не маркируется.)"
  1: "Ἐλέησόν με, ὁ θεός — 神よ、わたしをあわれみ (ἐλεέω — «миловать»). κατὰ τὸ μέγα ἔλεός σου — あなたの大きなあわれみによって (κατά + вин. — «по, сообразно»). κατὰ τὸ πλῆθος τῶν οἰκτιρμῶν σου — あなたの慈しみの多さによって (οἰκτιρμός — «щедрота, сострадание», слав. «щедроты»). ἐξάλειψον τὸ ἀνόμημά μου — わたしの背きをぬぐい去ってください (ἐξαλείφω — «стирать, изглаживать»; ἀνόμημα — «беззаконие»). Два разных слова ἔλεος и οἰκτιρμοί переданы あわれみ и 慈しみ, чтобы сохранить параллелизм."
  2: "ἐπὶ πλεῖον πλῦνόν με ἀπὸ τῆς ἀνομίας μου — わたしの不法からわたしをよく洗い (ἐπὶ πλεῖον — «более, усиленно»; πλύνω — «омывать», ср. 罪を洗う). ἀπὸ τῆς ἁμαρτίας μου καθάρισόν με — わたしの罪からわたしを清めてください (καθαρίζω — «очищать»; ἀνομία и ἁμαρτία оба сохранены)."
  3: "ὅτι τὴν ἀνομίαν μου ἐγὼ γινώσκω — わたしは自分の不法を知っている (γινώσκω — «знать», с оттенком «признавать»). ἡ ἁμαρτία μου ἐνώπιόν μού ἐστιν διὰ παντός — わたしの罪はいつもわたしの前にある (διὰ παντός — «всегда»)."
  4: "σοὶ μόνῳ ἥμαρτον — わたしはあなたにだけ罪を犯し (μόνος — «один, единственный»). τὸ πονηρὸν ἐνώπιόν σου ἐποίησα — あなたの目の前に悪を行った. ὅπως ἂν δικαιωθῇς ἐν τοῖς λόγοις σου — あなたが語られるときに正しいとされ (δικαιόω — «оправдывать»; ὅπως ἄν — «дабы»). νικήσῃς ἐν τῷ κρίνεσθαί σε — 裁かれるときに勝たれるためである (νικάω — «побеждать»; слав. «и победиши внегда судити Ти»)."
  5: "ἐν ἀνομίαις συνελήμφθην — わたしは不法のうちに宿され (συλλαμβάνω — «зачинать»; мн. ч. ἀνομίαις сохранено собирательно). ἐν ἁμαρτίαις ἐκίσσησέν με ἡ μήτηρ μου — 母は罪のうちにわたしを宿した (κισσάω — «зачинать»; редкий глагол, передан 宿す)."
  6: "ἀλήθειαν ἠγάπησας — あなたは真実を愛された (ἀλήθεια — 真実). τὰ ἄδηλα καὶ τὰ κρύφια τῆς σοφίας σου ἐδήλωσάς μοι — 隠れた知恵の秘め事をわたしに示された (ἄδηλος — «неявленный»; κρύφιος — «сокровенный»; δηλόω — «являть»)."
  7: "ῥαντιεῖς με ὑσσώπῳ — ヒソプでわたしにふりかけてください (ῥαντίζω — «кропить»; ὕσσωπος — ヒソプ, как в Ин 19:29 и Евр 9:19, сноска не нужна). καθαρισθήσομαι — そうすればわたしは清くなる. πλυνεῖς με — わたしを洗ってください (πλύνω, как в ст. 2). ὑπὲρ χιόνα λευκανθήσομαι — 雪よりも白くなる (χιών — 雪)."
  8: "ἀκουτιεῖς με ἀγαλλίασιν καὶ εὐφροσύνην — わたしに喜びと楽しみとを聞かせてください (ἀκουτίζω — «давать услышать»; два слова радости сохранены). ἀγαλλιάσονται ὀστᾶ τεταπεινωμένα — 低くされた骨が喜ぶだろう (ταπεινόω — «смирять»; 低くされた, чтобы не путать с 砕けた в ст. 17)."
  9: "ἀπόστρεψον τὸ πρόσωπόν σου ἀπὸ τῶν ἁμαρτιῶν μου — あなたの顔をわたしの罪からそむけ (ἀποστρέφω). πάσας τὰς ἀνομίας μου ἐξάλειψον — わたしの不法をすべてぬぐい去ってください (ἐξαλείφω, как в ст. 1)."
  10: "καρδίαν καθαρὰν κτίσον ἐν ἐμοί — わたしのうちに清い心を造り (κτίζω — «творить», образ творения). πνεῦμα εὐθὲς ἐγκαίνισον ἐν τοῖς ἐγκάτοις μου — わたしの内に正しい霊を新たにしてください (εὐθύς — «правый»; ἐγκαινίζω — «обновлять»; ἐγκάτα — «внутренности», передано 内). πνεῦμα здесь без ἅγιον — 霊, как по правилу корпуса."
  11: "μὴ ἀπορρίψῃς με ἀπὸ τοῦ προσώπου σου — わたしをあなたの顔から投げ捨てないでください (ἀπορρίπτω — «отвергать»). τὸ πνεῦμα τὸ ἅγιόν σου μὴ ἀντανέλῃς ἀπ᾿ ἐμοῦ — あなたの聖霊をわたしから取り去らないでください (ἀνταναιρέω — «отнимать»). ἅγιον при πνεῦμα — поэтому пара {聖霊｜聖神}, как по всему корпусу."
  12: "ἀπόδος μοι τὴν ἀγαλλίασιν τοῦ σωτηρίου σου — あなたの救いの喜びをわたしに返し (ἀποδίδωμι — «возвращать»). πνεύματι ἡγεμονικῷ στήρισόν με — 主導の霊でわたしを支えてください (ἡγεμονικός — «владычественный, ведущий»; слав. «Духом владычним»; евр. «дух охотный, готовый»; передано 主導の霊, без домысла)."
  13: "διδάξω ἀνόμους τὰς ὁδούς σου — わたしは不法の者たちにあなたの道を教え (διδάσκω — «учить»). ἀσεβεῖς ἐπὶ σὲ ἐπιστρέψουσιν — 悪い者たちがあなたに帰る (ἐπιστρέφω — «обращать»; ἀσεβής — 悪い者, как в Пс 1)."
  14: "ῥῦσαί με ἐξ αἱμάτων — 血の罪からわたしを救い出してください (αἷμα мн. — «кровей», т. е. вины за кровь, ср. 2 Цар 12:9). ὁ θεὸς ὁ θεὸς τῆς σωτηρίας μου — わたしの救いの神よ. ἀγαλλιάσεται ἡ γλῶσσά μου τὴν δικαιοσύνην σου — わたしの舌はあなたの義を喜び歌う (ἀγαλλιάομαι + вин. — «ликовать о»)."
  15: "κύριε, τὰ χείλη μου ἀνοίξεις — 主よ、あなたがわたしの唇を開いてくださると (ἀνοίγω — «открывать»; будущее в знач. «Ты откроешь»). τὸ στόμα μου ἀναγγελεῖ τὴν αἴνεσίν σου — わたしの口はあなたへの賛美を告げる (αἴνεσις — 賛美)."
  16: "εἰ ἠθέλησας θυσίαν, ἔδωκα ἄν — あなたがいけにえを望まれたなら、わたしはささげただろう (нереальное условие; θυσία — いけにえ). ὁλοκαυτώματα οὐκ εὐδοκήσεις — 全焼のいけにえを、あなたは喜ばない (εὐδοκέω — «благоволить»)."
  17: "θυσία τῷ θεῷ πνεῦμα συντετριμμένον — 神へのいけにえは、砕けた霊である (συντρίβω в perfect — «сокрушённый»). καρδίαν συντετριμμένην καὶ τεταπεινωμένην ὁ θεὸς οὐκ ἐξουθενώσει — 砕けて低くされた心を、あなたは見捨てられない (ἐξουθενέω — «уничижать, отвергать»)."
  18: "ἀγάθυνον, κύριε, ἐν τῇ εὐδοκίᾳ σου τὴν Σιων — 主よ、あなたの恵みによってシオンを良くしてください (ἀγαθύνω — «благотворить»; εὐδοκία — «благоволение»). οἰκοδομηθήτω τὰ τείχη Ιερουσαλημ — エルサレムの城壁が建てられますように (τεῖχος — 城壁; оптатив передан 〜ように)."
  19: "τότε εὐδοκήσεις θυσίαν δικαιοσύνης — そのとき、あなたは義のいけにえを喜ばれる (θυσία δικαιοσύνης — «жертва правды»). ἀναφορὰν καὶ ὁλοκαυτώματα — ささげ物と全焼のいけにえ (ἀναφορά — «возношение», слав. «возношение»). τότε ἀνοίσουσιν ἐπὶ τὸ θυσιαστήριόν σου μόσχους — そのとき、人々はあなたの祭壇に雄牛をささげる (ἀναφέρω — «возносить»; θυσιαστήριον — 祭壇)."
