verses:
  1: "主[しゅ]の使[つか]いがギルガルから上[のぼ]って、ボキムとベテル、イスラエルの家[いえ]へ来[き]て言[い]った。「主[しゅ]はこう言[い]われる。『わたしはあなたがたをエジプトから上らせ、あなたがたの父祖[ふそ]たちに授[さず]けると誓[ちか]った地[ち]へ連[つ]れて来[き]た。そして、あなたがたに告[つ]げた。わたしはあなたがたと結[むす]んだわたしの契約[けいやく]を、とこしえに破[やぶ]らない、と。"
  2: "あなたがたは、この地[ち]に住[す]む者[もの]たちと契約[けいやく]を結[むす]んではならない。彼[かれ]らの神[かみ]々[がみ]を拝[おが]んではならない。彼[かれ]らの彫像[ちょうぞう]を砕[くだ]き、彼[かれ]らの祭壇[さいだん]を打[う]ち壊[こわ]しなさい。しかし、あなたがたは、そうしたときに、わたしの声[こえ]に聞[き]き従[したが]わなかった。"
  3: "そしてわたしは言[い]った。わたしは、あなたがたの前[まえ]から追[お]い払[はら]うと言[い]ったその民[たみ]を、もはや移[うつ]し去[さ]ることはしない。彼[かれ]らはあなたがたの罠[わな]となり、彼[かれ]らの神[かみ]々[がみ]はあなたがたのつまずきとなる。』」"
  4: "主[しゅ]の使[つか]いがこれらの言葉[ことば]をすべてのイスラエルに語[かた]ったとき、民[たみ]は声[こえ]を上[あ]げて泣[な]いた。"
  5: "それゆえ、その場所[ばしょ]の名[な]はボキムと呼[よ]ばれた。彼[かれ]らはそこで主[しゅ]にいけにえを献[ささ]げた。"
  6: "ヨシュアが民[たみ]を送[おく]り出[だ]すと、イスラエルの子[こ]らは、その地[ち]を受[う]け継[つ]ぐために、おのおの自分[じぶん]の家[いえ]へ、自分[じぶん]の嗣業[しぎょう]へ帰[かえ]った。"
  7: "民[たみ]は、ヨシュアのすべての日[ひ]々[び]、またヨシュアの後[のち]まで長[なが]く生[い]き延[の]びて、主[しゅ]がイスラエルになさったすべての大[おお]きな業[わざ]を知[し]った長老[ちょうろう]たちのすべての日[ひ]々[び]、主[しゅ]に仕[つか]えた。"
  8: "主[しゅ]の僕[しもべ]であるヌンの子[こ]ヨシュアは、百十歳[ひゃくじゅっさい]で死[し]んだ。"
  9: "彼[かれ]をその嗣業[しぎょう]の境[さかい]のうち、エフライムの山地[さんち]のタムナタ・アレス、ガアスの山[やま]の北[きた]に葬[ほうむ]った。"
  10: "その世代[せだい]はすべて、父祖[ふそ]たちのもとへ加[くわ]えられた。そして、主[しゅ]も、主[しゅ]がイスラエルになさった業[わざ]も知[し]らない別[べつ]の世代[せだい]が、彼[かれ]らの後[のち]に起[お]こった。"
  11: "イスラエルの子[こ]らは主[しゅ]の目[め]に悪[あく]を行[おこな]い、バアル神[がみ]々[がみ]に仕[つか]えた。"
  12: "彼[かれ]らは、自分[じぶん]の父祖[ふそ]たちの神[かみ]である主[しゅ]、彼[かれ]らをエジプトの地[ち]から導[みちび]き出[だ]された主[しゅ]を捨[す]てて、周[まわ]りにいる民[たみ]の神[かみ]々[がみ]のうち、ほかの神[かみ]々[がみ]に従[したが]い、それらを拝[おが]んで、主[しゅ]を怒[いか]らせた。"
  13: "彼[かれ]らは主[しゅ]を捨[す]てて、バアルとアシュタロテに仕[つか]えた。"
  14: "主[しゅ]はイスラエルに激[はげ]しく怒[いか]り、彼[かれ]らを略奪[りゃくだつ]する者[もの]たちの手[て]に渡[わた]されたので、彼[かれ]らは略奪[りゃくだつ]された。主[しゅ]は彼[かれ]らを周囲[しゅうい]の敵[てき]の手[て]に売[う]り渡[わた]されたので、彼[かれ]らは敵[てき]の前[まえ]に立[た]ち向[む]かうことができなかった。"
  15: "彼[かれ]らが淫[みだら]に歩[あゆ]むすべてのことにおいて、主[しゅ]の手[て]は彼[かれ]らに災[わざわ]いを加[くわ]えるものとなった。主[しゅ]が語[かた]り、主[しゅ]が誓[ちか]われたとおりである。彼[かれ]らはひどく苦[くる]しめられた。"
  16: "主[しゅ]は彼[かれ]らのために裁[さば]き人[びと]たちを起[お]こし、略奪[りゃくだつ]する者[もの]たちの手[て]から彼[かれ]らを救[すく]われた。"
  17: "しかし、彼[かれ]らは自分[じぶん]たちの裁[さば]き人[びと]たちの言[こと]を聞[き]かなかった。ほかの神[かみ]々[がみ]に従[したが]って淫[みだら]なことを行[おこな]い、それらを拝[おが]んで主[しゅ]を怒[いか]らせたからである。彼[かれ]らは、父祖[ふそ]たちが主[しゅ]の戒[いまし]めに聞[き]き従[したが]うために歩[あゆ]んだ道[みち]から、ただちに外[そ]れた。彼[かれ]らはそのようにはしなかった。"
  18: "主[しゅ]が彼[かれ]らのために裁[さば]き人[びと]を起[お]こされたとき、主[しゅ]はその裁[さば]き人[びと]とともにいて、その裁[さば]き人[びと]のすべての日[ひ]々[び]に、敵[てき]の手[て]から彼[かれ]らを救[すく]われた。彼[かれ]らを囲[かこ]み、苦[くる]しめる者[もの]たちの前[まえ]での彼[かれ]らのうめきによって、主[しゅ]は心[こころ]を動[うご]かされたからである。"
  19: "裁[さば]き人[びと]が死[し]ぬと、彼[かれ]らはまた引[ひ]き返[かえ]し、父祖[ふそ]たちよりもひどく堕落[だらく]して、ほかの神[かみ]々[がみ]に従[したが]い、それらに仕[つか]え、それらを拝[おが]んだ。彼[かれ]らは自分[じぶん]たちの行[おこな]いを投[な]げ捨[す]てず、自分[じぶん]たちの頑[かた]くな道[みち]から離[はな]れなかった。"
  20: "主[しゅ]はイスラエルに激[はげ]しく怒[いか]って言[い]われた。「この民[たみ]が、わたしが彼[かれ]らの父祖[ふそ]たちに命[めい]じたわたしの契約[けいやく]を捨[す]て、わたしの声[こえ]に聞[き]き従[したが]わなかったからである。"
  21: "わたしは、ヨシュアが残[のこ]して去[さ]った諸国民[しょこくみん]のうちから、彼[かれ]らの前[まえ]からもはやひとりも追[お]い出[だ]さない。"
  22: "それは、イスラエルを彼[かれ]らによって試[ため]し、彼[かれ]らが、父祖[ふそ]たちが守[まも]ったように、主[しゅ]の道[みち]を守[まも]って歩[あゆ]むかどうかを知[し]るためである。」"
  23: "主[しゅ]はこれらの諸国民[しょこくみん]を、すぐには追[お]い出[だ]さないまま残[のこ]された。ヨシュアの手[て]に彼[かれ]らを渡[わた]されなかったのである。"

notes:
  1: "ἀνέβη... ἀπὸ Γαλγαλ ἐπὶ τὸν Κλαυθμῶνα καὶ ἐπὶ Βαιθηλ καὶ ἐπὶ τὸν οἶκον Ισραηλ — «взошёл из Галгала к Плачу (Бохим), и к Вефилю, и к дому Израилеву». Κλαυθμών — «плач» (слав. «место плача»; ru «Бохим»), отсюда ボキム. Κύριος κύριος — двойное «Господь»; слав. передаёт как прямую речь Бога («сия глаголет Господь»), чему следуем. διασκεδάσω — «разрушу, расторгну»."
  2: "διαθήσεσθε διαθήκην — «заключите завет» (внутренний винительный). οὐδὲ... οὐ μὴ προσκυνήσητε — сильный запрет с двойным отрицанием. γλυπτά — «изваяния, идолы» (слав. «изваянная»). κατασκάψετε — «раскопаете, разрушите» (слав. «раскопайте»). οὐκ εἰσηκούσατε... ὅτε ταῦτα ἐποιήσατε — «не послушали... когда это сделали»; слав. «яко сия сотвористе» (потому что), ru «Что вы это сделали?»."
  3: "Οὐ προσθήσω τοῦ μετοικίσαι — «не продолжу переселять», т. е. не стану больше изгонять (μετοικίζω — переселять). συνοχή — «узда, петля, стеснение» (слав. «терние»); σκάνδαλον — «соблазн, сеть» (слав. «соблазн»). Здесь речь ангела (со словом Господа) кончается."
  4: "ἐπῆρεν τὴν φωνήν — «поднял голос» (слав. «воздвигоша глас»). ἔκλαυσαν — «заплакали». πρὸς πάντα Ισραηλ — «ко всему Израилю»."
  5: "ἐκλήθη τὸ ὄνομα τοῦ τόπου — «названо имя места». ἔθυσαν — «принесли жертву» (θύω), いけにえを献げた. Бохим = Κλαυθμών («плач»)."
  6: "ἐξαπέστειλεν — «отпустил». τοῦ κατακληρονομῆσαι τὴν γῆν — «чтобы наследовать землю» (цель), отсюда 受け継ぐために."
  7: "ἐδούλευσεν — «служил» (о служении Господу). ὅσοι ἐμακροημέρευσαν μετὰ Ἰησοῦν — «которые прожили долго после Иисуса» (μακροημερεύω). τὸ ἔργον... τὸ μέγα — «дело великое»."
  8: "ἐτελεύτησεν — «скончался». υἱὸς ἑκατὸν δέκα ἐτῶν — «сын ста десяти лет», т. е. ста десяти лет от роду (слав. «сын ста и десяти лет»)."
  9: "Θαμναθαρες — Фамнаф-Арес (слав. «фамнафарес»). ἀπὸ βορρᾶ τοῦ ὄρους Γαας — «к северу от горы Гаас». ἐν ὁρίῳ τῆς κληρονομίας — «в пределе удела»."
  10: "προσετέθησαν πρὸς τοὺς πατέρας αὐτῶν — «приложились к отцам своим» (формула смерти). ἀνέστη γενεὰ ἑτέρα — «восстал другой род». ὅσοι οὐκ ἔγνωσαν — «которые не знали»."
  11: "τὸ πονηρὸν ἐναντίον κυρίου — «злое пред Господом». ἐλάτρευον τοῖς Βααλιμ — «служили Ваалам» (мн. ч.; слав. «ваалу»)."
  12: "ἐγκατέλιπον — «оставили» (ἐγκαταλείπω). τὸν ἐξαγαγόντα — «выведшего» (определительное причастие). ἀπὸ τῶν θεῶν τῶν λαῶν τῶν περικύκλῳ — «из богов народов окрестных». παρώργισαν — «раздражили, прогневали»."
  13: "τῇ Βααλ καὶ ταῖς Ἀστάρταις — «Ваалу и Астартам» (ед. Βααλ, мн. Ἀστάρται); слав. «ваалу и астартом»."
  14: "ὠργίσθη θυμῷ — «воспылал гневом» (внутренний датив). παρέδωκεν ἐν χειρὶ προνομευόντων — «предал в руки грабителей» (προνομεύω — грабить). ἀπέδοτο — «продал» (ἀποδίδωμι). κυκλόθεν — «отовсюду, вокруг». ἀντιστῆναι κατὰ πρόσωπον — «встать против лица»."
  15: "ἐν πᾶσιν, οἷς ἐπόρνευον — «во всём, в чём блудодействовали»; слав. «во всех, в нихже прохождаху» (куда ни ходили). χεὶρ κυρίου ἦν αὐτοῖς εἰς κακά — «рука Господня была на них во зло». ἐξέθλιψεν σφόδρα — «сильно стеснил»."
  16: "ἤγειρεν — «воздвиг» (ἐγείρω; ср. 2:18, 3:9). σωτήρ — «спаситель» (слав. «спасителя»), в тексте 救い手. ἐκ χειρὸς τῶν προνομευόντων — «из руки грабителей»."
  17: "οὐκ ἐπήκουσαν — «не послушали» (ἐπακούω + род.). ἐξεπόρνευσαν ὀπίσω θεῶν ἑτέρων — «блудно пошли за иными богами». ἐξέκλιναν ταχὺ — «скоро уклонились». οὐκ ἐποίησαν οὕτως — «не сделали так»."
  18: "καὶ ὅτι ἤγειρεν — «и когда воздвигал». ἦν κύριος μετὰ τοῦ κριτοῦ — «Господь был с судьёю». παρεκλήθη — «сжалился, был тронут» (παρακαλέω в пассиве; слав. «умилися»). ἀπὸ τοῦ στεναγμοῦ — «от стенания». πολιορκούντων — «осаждающих, теснящих»."
  19: "ὡς ἀπέθνῃσκεν — «когда умирал». ἀπέστρεψαν — «обратились назад». διέφθειραν — «развращались, портились» (διαφθείρω). ἐπιτηδεύματα — «дела, занятия» (слав. «начинания»). σκληρά — «жёсткая» (о пути)."
  20: "ὠργίσθη θυμῷ — см. 2:14. Ἀνθ ὧν ὅσα — «за то, что» (отягощённый оборот). ἐγκατέλιπαν — «оставили». ἐνετειλάμην — «заповедал»."
  21: "οὐ προσθήσω τοῦ ἐξᾶραι — «не продолжу изгонять». ἄνδρα ἐκ προσώπου αὐτῶν — «мужа от лица их», т. е. ни одного."
  22: "τοῦ πειράσαι — «чтобы испытать» (πειράζω). εἰ φυλάσσονται — «сохранят ли». ὃν τρόπον — «как». ἢ οὔ — «или нет»."
  23: "ἀφῆκεν — «оставил». τὸ τάχος — «быстро» (наречие). οὐ παρέδωκεν ἐν χειρὶ Ἰησοῦ — «не предал в руку Иисуса»."
