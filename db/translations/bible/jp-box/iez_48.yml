verses:
  1: "「これが部族[ぶぞく]の名[な]である。北[きた]の端[はし]から、ハマトの入口[いりぐち]へ下[くだ]って行[い]く分[わ]かれ目[め]に沿[そ]って、エナンの庭[にわ]、北[きた]のダマスコの境界[きょうかい]、ハマトの庭[にわ]の側[がわ]に沿[そ]って。東[ひがし]から海[うみ]までがダンに与[あた]えられる。一[ひと]つの区画[くかく]である。"
  2: "ダンの境界[きょうかい]から、東[ひがし]から海[うみ]まで、アシェルに一[ひと]つの区画[くかく]。"
  3: "アシェルの境界[きょうかい]から、東[ひがし]から海[うみ]まで、ナフタリに一[ひと]つの区画[くかく]。"
  4: "ナフタリの境界[きょうかい]から、東[ひがし]から海[うみ]まで、マナセに一[ひと]つの区画[くかく]。"
  5: "マナセの境界[きょうかい]から、東[ひがし]から海[うみ]まで、エフライムに一[ひと]つの区画[くかく]。"
  6: "エフライムの境界[きょうかい]から、東[ひがし]から海[うみ]まで、ルベンに一[ひと]つの区画[くかく]。"
  7: "ルベンの境界[きょうかい]から、東[ひがし]から海[うみ]まで、ユダに一[ひと]つの区画[くかく]。"
  8: "ユダの境界[きょうかい]から、東[ひがし]から海[うみ]までが、取[と]り分[わ]けてささげる初穂[はつほ]の区画[くかく]である。幅[はば]は二万五千[にまんごせん]キュビト、長[なが]さは、東[ひがし]から海[うみ]までのある一[ひと]つの分[わ]け前[まえ]と同[おな]じである。聖[せい]なる所[ところ]はその真[ま]ん中[なか]にある。"
  9: "主[しゅ]に取[と]り分[わ]けてささげる初穂[はつほ]は、長[なが]さ二万五千[にまんごせん]キュビト、幅[はば]二万五千[にまんごせん]キュビトである。"
  10: "これらのうちから、聖[せい]なる初穂[はつほ]は祭司[さいし]たちのものとなる。北[きた]には二万五千[にまんごせん]キュビト、海[うみ]の側[がわ]には幅[はば]一万[いちまん]キュビト、東[ひがし]の側[がわ]には幅[はば]一万[いちまん]キュビト、南[みなみ]には長[なが]さ二万五千[にまんごせん]キュビトである。聖[せい]なる者[もの]たちの山[やま]はその真[ま]ん中[なか]にある。"
  11: "すなわち、聖別[せいべつ]されたサドクの子[こ]らである祭司[さいし]たちに与[あた]えられる。彼らは家[いえ]の務[つと]めを守[まも]り、イスラエルの子[こ]らが迷[まよ]ったとき、レビ人[びと]たちが迷ったようには迷[まよ]わなかった者[もの]たちである。"
  12: "彼らには、土地[とち]の初穂[はつほ]のうちから初穂[はつほ]が与[あた]えられる。レビ人[びと]たちの境界[きょうかい]から、それは聖[せい]なるもののうちの聖[せい]なるものである。"
  13: "レビ人[びと]たちには、祭司[さいし]たちの境界[きょうかい]に続[つづ]く所[ところ]がある。長[なが]さ二万五千[にまんごせん]キュビト、幅[はば]一万[いちまん]キュビトである。その全[ぜん]長[ちょう]は二万五千[にまんごせん]キュビト、幅[はば]は一万[いちまん]キュビトである。"
  14: "そのうちから売[う]ってはならない。また交換[こうかん]してはならない。土地[とち]の初[はつ]なりの産物[さんぶつ]を取[と]り去[さ]ってもならない。それは主[しゅ]に聖[せい]なるものであるからである。"
  15: "幅[はば]のうち、二万五千[にまんごせん]に対して余[あま]る五千[ごせん]キュビトは、都[みやこ]のための前[まえ]の囲[かこ]いとなり、住[す]まいとその周[まわ]りの空地[あきち]となる。都[みやこ]はその真[ま]ん中[なか]にある。"
  16: "これが都[みやこ]の寸法[すんぽう]である。北[きた]の側[がわ]は四千五百[よんせんごひゃく]キュビト、南[みなみ]の側[がわ]は四千五百[よんせんごひゃく]キュビト、東[ひがし]の側[がわ]は四千五百[よんせんごひゃく]キュビト、海[うみ]の側[がわ]は四千五百[よんせんごひゃく]キュビトである。"
  17: "都[みやこ]の周[まわ]りの空地[あきち]は、北[きた]に二百五十[にひゃくごじゅう]キュビト、南[みなみ]に二百五十[にひゃくごじゅう]キュビト、東[ひがし]に二百五十[にひゃくごじゅう]キュビト、海[うみ]の側[がわ]に二百五十[にひゃくごじゅう]キュビトである。"
  18: "長[なが]さの余[あま]りで、聖[せい]なる初穂[はつほ]に続[つづ]く所[ところ]は、東[ひがし]に一万[いちまん]キュビト、海[うみ]の側[がわ]に一万[いちまん]キュビトである。これらは聖[せい]なるものの初穂[はつほ]であり、その産物[さんぶつ]は都[みやこ]で働[はたら]く者[もの]たちのパンとなる。"
  19: "都[みやこ]で働[はたら]く者[もの]たちは、イスラエルのすべての部族[ぶぞく]のうちから出[で]て、そこで働[はたら]く。"
  20: "初穂[はつほ]の全体[ぜんたい]は、二万五千[にまんごせん]キュビトに二万五千[にまんごせん]キュビトを掛[か]けた正方形[せいほうけい]である。都[みやこ]の所有[しょゆう]から、聖[せい]なるものの初穂[はつほ]を四角[しかく]に取[と]り分[わ]けなさい。"
  21: "残[のこ]りは君[きみ]のものである。聖[せい]なる初穂[はつほ]と都[みやこ]の所有[しょゆう]のこちら側[がわ]とあちら側[がわ]に、すなわち東[ひがし]の境界[きょうかい]に至[いた]るまで長[なが]さ二万五千[にまんごせん]キュビト、海[うみ]の境界[きょうかい]に至[いた]るまで二万五千[にまんごせん]キュビトが、君[きみ]の分[わ]け前[まえ]に続[つづ]いている。聖[せい]なるものの初穂[はつほ]と神殿[しんでん]の聖所[せいしょ]は、その真[ま]ん中[なか]にある。"
  22: "レビ人[びと]たちの所有[しょゆう]と都[みやこ]の所有[しょゆう]は、君[きみ]たちの間[あいだ]にある。ユダの境界[きょうかい]とベニヤミンの境界[きょうかい]の間[あいだ]は、君[きみ]のものである。"
  23: "残[のこ]りの部族[ぶぞく]のうち、東[ひがし]から海[うみ]までがベニヤミンに一[ひと]つの区画[くかく]。"
  24: "ベニヤミンの境界[きょうかい]から、東[ひがし]から海[うみ]まで、シメオンに一[ひと]つの区画[くかく]。"
  25: "シメオンの境界[きょうかい]から、東[ひがし]から海[うみ]まで、イッサカルに一[ひと]つの区画[くかく]。"
  26: "イッサカルの境界[きょうかい]から、東[ひがし]から海[うみ]まで、ゼブルンに一[ひと]つの区画[くかく]。"
  27: "ゼブルンの境界[きょうかい]から、東[ひがし]から海[うみ]まで、ガドに一[ひと]つの区画[くかく]。"
  28: "ガドの境界[きょうかい]から、東[ひがし]から南西[なんせい]まで。その境界[きょうかい]はテマンから、マリモト・カデスの水[みず]、すなわち嗣業[しぎょう]の境[さかい]から、大[おお]きな海[うみ]に至[いた]るまでである。"
  29: "これが、あなたがたがくじでイスラエルの部族[ぶぞく]たちに分[わ]け与[あた]える土地[とち]であり、これが彼らの割[わ]り当[あ]てである、と主[しゅ]なる神[かみ]は言[い]われる。」"
  30: "これが都[みやこ]の出口[でぐち]である。北[きた]の側[がわ]は、測[はか]って四千五百[よんせんごひゃく]キュビトである。"
  31: "都[みやこ]の門[もん]は、イスラエルの部族[ぶぞく]の名[な]によって名[な]づけられる。北[きた]に三[みっ]つの門[もん]がある。ルベンの門[もん]が一[ひと]つ、ユダの門[もん]が一[ひと]つ、レビの門[もん]が一[ひと]つである。"
  32: "東[ひがし]の側[がわ]は四千五百[よんせんごひゃく]。門[もん]は三[みっ]つある。ヨセフの門[もん]が一[ひと]つ、ベニヤミンの門[もん]が一[ひと]つ、ダンの門[もん]が一[ひと]つである。"
  33: "南[みなみ]の側[がわ]は、測[はか]って四千五百[よんせんごひゃく]。門[もん]は三[みっ]つある。シメオンの門[もん]が一[ひと]つ、イッサカルの門[もん]が一[ひと]つ、ゼブルンの門[もん]が一[ひと]つである。"
  34: "海[うみ]の側[がわ]は、測[はか]って四千五百[よんせんごひゃく]。門[もん]は三[みっ]つある。ガドの門[もん]が一[ひと]つ、アシェルの門[もん]が一[ひと]つ、ナフタリの門[もん]が一[ひと]つである。"
  35: "周[しゅう]囲[い]は一万八千[いちまんはっせん]キュビトである。都[みやこ]の名[な]は、それが生[しょう]じるその日[ひ]から、「主[しゅ]はそこにいる」となる。"

notes:
  1: "τὰ ὀνόματα τῶν φυλῶν — «имена колен» (部族[ぶぞく]の名[な]); ἀπὸ τῆς ἀρχῆς τῆς πρὸς βορρᾶν — «от начала, что к северу»; κατὰ τὸ μέρος τῆς καταβάσεως τοῦ περισχίζοντος — «по части спуска разделяющего», т. е. по линии границы, спускающейся вниз (тёмное место; слав. «по стране схождения разделяющаго»); ἐπὶ τὴν εἴσοδον τῆς Ημαθ αὐλῆς τοῦ Αιναν — «ко входу Емафа, двора Енана» (ハマトの入口[いりぐち], エナンの庭[にわ]); ὅριον Δαμασκοῦ πρὸς βορρᾶν — «предел Дамаска к северу»; Δαν, μία — «Дан, одна» (一[ひと]つの区画[くかく]): формула «одна [часть]» повторяется в 2–7 и 23–27."
  2: "ἀπὸ τῶν ὁρίων τοῦ Δαν — «от пределов Дана» (ダンの境界[きょうかい]); τὰ πρὸς ἀνατολὰς ἕως τῶν πρὸς θάλασσαν — «то, что к востоку, до того, что к морю»: формула «от востока до моря» = от восточного края до западного (Средиземное море); Ασηρ, μία — «Асир, одна» (アシェルに一[ひと]つの区画[くかく])."
  3: "ἀπὸ τῶν ὁρίων Ασηρ — «от пределов Асира»; Νεφθαλιμ, μία — «Неффалим, одна» (ナフタリ)."
  4: "Μανασση, μία — «Манассия, одна» (マナセ)."
  5: "Εφραιμ, μία — «Ефраим, одна» (エフライム)."
  6: "Ρουβην, μία — «Рувим, одна» (ルベン)."
  7: "Ιουδα, μία — «Иуда, одна» (ユダ). Здесь кончается ряд колен к северу от священного участка."
  8: "ἡ ἀπαρχὴ τοῦ ἀφορισμοῦ — «начаток отделения» (取[と]り分[わ]けてささげる初穂[はつほ]); πέντε καὶ εἴκοσι χιλιάδες εὖρος — «двадцать пять тысяч ширины» (二万五千[にまんごせん]); μῆκος καθὼς μία τῶν μερίδων — «длина, как одна из частей» (他[ほか]の部分[ぶぶん]と同[おな]じ); τὸ ἅγιον ἐν μέσῳ αὐτῶν — «святое посреди них» (聖[せい]なる所[ところ])."
  9: "ἀπαρχή, ἣν ἀφοριοῦσι τῷ κυρίῳ — «начаток, который отделят Господу» (主[しゅ]に取[と]り分[わ]けてささげる); μῆκος εἴκοσι καὶ πέντε χιλιάδες καὶ εὖρος εἴκοσι καὶ πέντε χιλιάδες — «длина 25 000 и ширина 25 000»; ru (МТ) даёт ширину 10 000 — в текст не внесено."
  10: "τούτων ἔσται ἡ ἀπαρχὴ τῶν ἁγίων — «из них будет начаток святых» (これらのうちから聖[せい]なる初穂[はつほ]); τοῖς ἱερεῦσιν — «священникам» (祭司[さいし]); πρὸς βορρᾶν 25 000, πρὸς θάλασσαν πλάτος 10 000, πρὸς ἀνατολὰς πλάτος 10 000, πρὸς νότον μῆκος 25 000 — размеры участка; τὸ ὄρος τῶν ἁγίων — «гора святых» (聖[せい]なる者[もの]たちの山[やま])."
  11: "τοῖς ἡγιασμένοις υἱοῖς Σαδδουκ — «освящённым сынам Садока» (サドク); τοῖς φυλάσσουσι τὰς φυλακὰς τοῦ οἴκου — «хранящим стражи дома» (家[いえ]の務[つと]めを守[まも]る); οἵτινες οὐκ ἐπλανήθησαν ἐν τῇ πλανήσει υἱῶν Ισραηλ — «которые не заблудились в заблуждении сынов Израилевых»; ὃν τρόπον ἐπλανήθησαν οἱ Λευῖται — «как заблудились левиты» (レビ人[びと])."
  12: "ἀπαρχὴ δεδομένη ἐκ τῶν ἀπαρχῶν τῆς γῆς — «начаток, данный из начатков земли»; ἅγιον ἁγίων — «святое святых» (聖[せい]なるもののうちの聖[せい]なるもの; не 至聖所[しせいしょ], так как речь о земле); ἀπὸ τῶν ὁρίων τῶν Λευιτῶν — «от пределов левитов»."
  13: "τοῖς Λευίταις τὰ ἐχόμενα τῶν ὁρίων τῶν ἱερέων — «левитам прилежащее к пределам священников» (祭司[さいし]たちの境界[きょうかい]に続[つづ]く所[ところ]); μῆκος 25 000, εὖρος 10 000; πᾶν τὸ μῆκος 25 000 καὶ εὖρος 20 000 — в конце греч. «ширина двадцать тысяч»; слав. везде «десять тысяч»; принято слав. (ср. ru), LXX-чтение отмечено."
  14: "οὐ πραθήσεται ἐξ αὐτοῦ — «не продастся из него»; οὐδὲ καταμετρηθήσεται — «и не будет отмерено»; слав. «ни заменится» (по евр. «обменять»), в тексте 交換[こうかん]; οὐδὲ ἀφαιρεθήσεται τὰ πρωτογενήματα τῆς γῆς — «и не будут отняты первые плоды земли» (初[はつ]なりの産物[さんぶつ]); ἅγιόν ἐστιν τῷ κυρίῳ — «свято оно Господу»."
  15: "τὰς πέντε χιλιάδας τὰς περισσάς — «пять тысяч остальных» (余[あま]る五千[ごせん]); προτείχισμα ἔσται τῇ πόλει — «будет предградием (передовой стеной) городу» (都[みやこ]のための前[まえ]の囲[かこ]い); εἰς τὴν κατοικίαν καὶ εἰς διάστημα αὐτοῦ — «для жительства и для пространства его» (住[す]まいと周[まわ]りの空地[あきち]); ἡ πόλις ἐν μέσῳ αὐτοῦ — «город посреди него»."
  16: "ταῦτα τὰ μέτρα αὐτῆς — «сии меры его» (都[みやこ]の寸法[すんぽう]); с четырёх сторон по 4 500 (πεντακόσιοι καὶ τετρακισχίλιοι — порядок «500 и 4000» варьируется, слав. везде «4000 и 500»; в тексте единообразно 四千五百[よんせんごひゃく])."
  17: "διάστημα τῇ πόλει — «пространство городу» (周[まわ]りの空地[あきち]); с четырёх сторон по 250 (二百五十[にひゃくごじゅう])."
  18: "τὸ περισσὸν τοῦ μήκους τὸ ἐχόμενον τῶν ἀπαρχῶν τῶν ἁγίων — «остаток длины, прилежащий к начаткам святых» (聖[せい]なる初穂[はつほ]に続[つづ]く所[ところ]); 10 000 к востоку и 10 000 к морю; αἱ ἀπαρχαὶ τοῦ ἁγίου — «начатки святого»; τὰ γενήματα αὐτῆς εἰς ἄρτους τοῖς ἐργαζομένοις τὴν πόλιν — «произведения её в хлебы работающим город» (都[みやこ]で働[はたら]く者[もの]たちのパン)."
  19: "οἱ ἐργαζόμενοι τὴν πόλιν — «работающие город» (都[みやこ]で働[はたら]く者[もの]たち); ἐργῶνται αὐτὴν ἐκ πασῶν τῶν φυλῶν τοῦ Ισραηλ — «пусть работают его из всех колен Израилевых» (イスラエルのすべての部族[ぶぞく]のうちから)."
  20: "πᾶσα ἡ ἀπαρχὴ 25 000 ἐπὶ 25 000 — «весь начаток 25 000 на 25 000»; τετράγωνον — «четырёхугольный» (正方形[せいほうけい]); ἀφοριεῖτε αὐτοῦ τὴν ἀπαρχὴν τοῦ ἁγίου — «отделите из него начаток святого» (四角[しかく]に取[と]り分[わ]ける); ἀπὸ τῆς κατασχέσεως τῆς πόλεως — «от владения города» (都[みやこ]の所有[しょゆう])."
  21: "τὸ περισσὸν τῷ ἀφηγουμένῳ — «остальное князю» (残[のこ]りは君[きみ]); ἐκ τούτου καὶ ἐκ τούτου — «с той и с другой стороны» (こちら側[がわ]とあちら側[がわ]); ἐπὶ 25 000 μῆκος ἕως τῶν ὁρίων τῶν πρὸς ἀνατολάς — «на 25 000 длины до пределов, что к востоку»; καὶ πρὸς θάλασσαν ἐπὶ 25 000 ἕως τῶν ὁρίων τῶν πρὸς θάλασσαν — «и к морю на 25 000 до пределов морских»; ἐχόμενα τῶν μερίδων τοῦ ἀφηγουμένου — «прилежащее к частям князя» (君[きみ]の部分[ぶぶん]に続[つづ]く); τὸ ἁγίασμα τοῦ οἴκου — «святыня дома» (神殿[しんでん]の聖所[せいしょ])."
  22: "ἀπὸ τῆς κατασχέσεως τῶν Λευιτῶν καὶ ἀπὸ τῆς κατασχέσεως τῆς πόλεως — «от владения левитов и от владения города»; ἐν μέσῳ τῶν ἀφηγουμένων — «посреди князей» (君[きみ]たちの間[あいだ]; греч. мн. ч., слав. «среде старейшин»); ἀνὰ μέσον τῶν ὁρίων Ιουδα καὶ ἀνὰ μέσον τῶν ὁρίων Βενιαμιν — «между пределами Иуды и между пределами Вениамина» (ユダ, ベニヤミン); τῶν ἀφηγουμένων ἔσται — «князю будет» (君[きみ]のもの)."
  23: "τὸ περισσὸν τῶν φυλῶν — «остаток колен» (残[のこ]りの部族[ぶぞく]); ἀπὸ τῶν πρὸς ἀνατολὰς ἕως τῶν πρὸς θάλασσαν Βενιαμιν, μία — «от востока до моря Вениамин, одна» (ベニヤミンに一[ひと]つの区画[くかく])."
  24: "ἀπὸ τῶν ὁρίων τῶν Βενιαμιν … Συμεων, μία — «от пределов Вениамина… Симеон, одна» (シメオン)."
  25: "ἀπὸ τῶν ὁρίων τῶν Συμεων … Ισσαχαρ, μία — «от пределов Симеона… Иссахар, одна» (イッサカル)."
  26: "ἀπὸ τῶν ὁρίων τῶν Ισσαχαρ … Ζαβουλων, μία — «от пределов Иссахара… Завулон, одна» (ゼブルン)."
  27: "ἀπὸ τῶν ὁρίων τῶν Ζαβουλων … Γαδ, μία — «от пределов Завулона… Гад, одна» (ガド)."
  28: "ἀπὸ τῶν ὁρίων τῶν Γαδ ἕως τῶν πρὸς λίβα — «от пределов Гада до того, что к юго-западу» (南西[なんせい]); слав. добавляет «от востока» — внесено; ἔσται τὰ ὅρια αὐτοῦ ἀπὸ Θαιμαν — «будут пределы его от Фемана» (テマン); ὕδατος Μαριμωθ Καδης κληρονομίας — «воды Меривот-Кадес, наследия» (マリモト・カデス; 嗣業[しぎょう]の境[さかい]); ἕως τῆς θαλάσσης τῆς μεγάλης — «до великого моря»."
  29: "αὕτη ἡ γῆ, ἣν βαλεῖτε ἐν κλήρῳ — «сия земля, которую бросите в жребий» (くじで分[わ]け与[あた]える); οἱ διαμερισμοὶ αὐτῶν — «разделы их» (割[わ]り当[あ]て); λέγει κύριος θεός — «говорит Господь Бог», конец речи. Далее 30–35 — описание города вне кавычек."
  30: "αἱ διεκβολαὶ τῆς πόλεως — «выходы города» (都[みやこ]の出口[でぐち]; в 30–34 — стороны и ворота города); τετρακισχίλιοι καὶ πεντακόσιοι μέτρῳ — «четыре тысячи пятьсот мерою» (測[はか]って四千五百[よんせんごひゃく]キュビト)."
  31: "αἱ πύλαι τῆς πόλεως ἐπ' ὀνόμασιν φυλῶν τοῦ Ισραηλ — «ворота города по именам колен Израилевых» (部族[ぶぞく]の名[な]); πύλαι τρεῖς πρὸς βορρᾶν — «трое ворот к северу» (三[みっ]つ); πύλη Ρουβην μία καὶ πύλη Ιουδα μία καὶ πύλη Λευι μία — «ворота Рувима одни, Иуды одни, Левия одни» (ルベン, ユダ, レビ)."
  32: "τὰ πρὸς ἀνατολὰς 4 500 — «то, что к востоку, 4 500»; πύλη Ιωσηφ μία καὶ πύλη Βενιαμιν μία καὶ πύλη Δαν μία — «ворота Иосифа, Вениамина, Дана» (ヨセフ, ベニヤミン, ダン)."
  33: "τὰ πρὸς νότον 4 500 μέτρῳ — «то, что к югу, 4 500 мерою»; πύλη Συμεων, Ισσαχαρ, Ζαβουλων — «ворота Симеона, Иссахара, Завулона» (シメオン, イッサカル, ゼブルン)."
  34: "τὰ πρὸς θάλασσαν 4 500 μέτρῳ — «то, что к морю, 4 500 мерою»; πύλη Γαδ, Ασηρ, Νεφθαλιμ — «ворота Гада, Асира, Неффалима» (ガド, アシェル, ナフタリ)."
  35: "κύκλωμα δέκα καὶ ὀκτὼ χιλιάδες — «обвод (окружность) восемнадцать тысяч» (周[しゅう]囲[い] 一万八千[いちまんはっせん]); τὸ ὄνομα τῆς πόλεως, ἀφ' ἧς ἂν ἡμέρας γένηται, ἔσται τὸ ὄνομα αὐτῆς — «имя города: с того дня, как он возникнет, будет имя его»; в LXX имя не названо, слав. добавляет «Господь тамо будет имя ему» (евр. יְהוָה שָׁמָּה, «Яхве там»); в тексте 「主[しゅ]はそこにいる」 — буквально, без сглаживания."
