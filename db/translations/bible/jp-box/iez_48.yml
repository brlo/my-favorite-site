# jp-box, Иезекииль, глава 48. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 48 (совпадает; см. карту 20/21).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: последняя глава книги. 1–29 — раздел земли по коленам: от севера Дан,
# Асир, Неффалим, Манассия, Ефраим, Рувим, Иуда; священный участок (25 000 на 25 000):
# часть священников, сынов Садока, с «горой святых», часть левитов, город с предместьями,
# участок князя; остальные колена: Вениамин, Симеон, Иссахар, Завулон, Гад; 30–35 —
# город: выходы на четыре стороны по 4 500 локтей, двенадцать ворот по именам колен,
# обвод 18 000 локтей, имя города «Господь там».
# Голоса: 1–29 — продолжение речи Господа, начатой в 47:13; на границе главы кавычки
# закрыты и открыты заново (баланс по главе); формула «говорит Господь Бог» в 29
# закрывает речь. 30–35 — описание города вне кавычек (после формулы 29).
# «Точек» (лакун) в главе нет.
# Термины: 部族[ぶぞく] — φυλή; 境界[きょうかい] — ὅριον; 区画[くかく] — μία (одна часть);
# 初穂[はつほ] — ἀπαρχή; 嗣業[しぎょう] — κληρονομία; 所有[しょゆう] — κατάσχεσις;
# 君[きみ] — ὁ ἀφηγούμενος (слав. «старейшина»); 祭司[さいし] — ἱερεύς; レビ人[びと] —
# Λευῖται; 至聖所[しせいしょ] не употребляется о земле: ἅγιον ἁγίων передано
# 聖[せい]なるもののうちの聖[せい]なるもの; 出口[でぐち] — διεκβολή (выходы/стороны города);
# キュビト — πῆχυς. Формула «東[ひがし]から海[うみ]まで» — τὰ πρὸς ἀνατολὰς ἕως τῶν
# πρὸς θάλασσαν (море = Средиземное, западный предел), повторяется единообразно.
# Меры 48:8–21 — локти (πῆχυς при числах в греч. опущен, как в 45:1); в тексте キュビト.
# Имена: ダン, アシェル, ナフタリ, マナセ, エフライム, ルベン, ユダ, ベニヤミン,
# シメオン, イッサカル, ゼブルン, ガド, ヨセフ, レビ; サドク; ハマト, エナン, ダマスコ,
# テマン, マリモト・カデス.
