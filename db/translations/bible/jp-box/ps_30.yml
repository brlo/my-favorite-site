verses:
  0: "指揮者[しきしゃ]のために。ダビデの詩[うた]。心[こころ]の乱[みだ]れのときのもの。"
  1: "主[しゅ]よ、わたしはあなたに寄[よ]り頼[たの]む。とこしえに恥[は]じを受[う]けないようにしてください。あなたの義[ぎ]によって、わたしを救[すく]い、わたしを引[ひ]き出[だ]してください。"
  2: "あなたの耳[みみ]をわたしに傾[かたむ]け、急[いそ]いでわたしを救[すく]い出[だ]してください。わたしを救[すく]うため、わたしの守[まも]りの神[かみ]、逃[に]げ込[こ]む家[いえ]となってください。"
  3: "あなたこそ、わたしの砦[とりで]、わたしの逃[に]げ場[ば]だからである。あなたの名[な]のゆえに、あなたはわたしを導[みちび]き、養[やしな]ってくださる。"
  4: "あなたは、わたしのために隠[かく]された網[あみ]からわたしを引[ひ]き出[だ]してくださる。あなたこそ、わたしを守[まも]る方[かた]だからである。"
  5: "わたしの霊[れい]をあなたの手[て]にゆだねる。あなたはわたしを贖[あがな]い出[だ]された。主[しゅ]、真実[しんじつ]の神[かみ]よ。"
  6: "あなたは、むなしいものに心[こころ]を寄[よ]せる者[もの]らを憎[にく]まれる。しかし、わたしは主[しゅ]に寄[よ]り頼[たの]む。"
  7: "わたしはあなたのあわれみを喜[よろこ]び、楽[たの]しむ。あなたはわたしの卑[ひく]さに目[め]を留[と]め、苦[くる]しみのうちからわたしの魂[たましい]を救[すく]われたからである。"
  8: "あなたはわたしを敵[てき]の手[て]に閉[と]じ込[こ]めず、わたしの足[あし]を広[ひろ]い所[ところ]に立[た]てられた。"
  9: "主[しゅ]よ、わたしをあわれんでください。わたしは苦[くる]しんでいるからである。憤[いきどお]りのうちに、わたしの目[め]は乱[みだ]れ、わたしの魂[たましい]も腹[はら]も乱[みだ]れた。"
  10: "わたしの命[いのち]は苦[くる]しみのうちに尽[つ]き、わたしの年[とし]は嘆[なげ]きのうちに過[す]ぎた。わたしの力[ちから]は貧[まず]しさのうちに弱[よわ]り、わたしの骨[ほね]は乱[みだ]れた。"
  11: "わたしはすべての敵[てき]にまさって恥[は]じとなり、隣[となり]人[びと]にはとりわけ、知[し]る者[もの]には恐[おそ]れとなった。外[そと]でわたしを見[み]る者[もの]は、わたしから逃[に]げ去[さ]った。"
  12: "わたしは死[し]んだ者[もの]のように、心[こころ]から忘[わす]れられた。わたしは壊[こわ]れた器[うつわ]のようになった。"
  13: "わたしは多[おお]くの者[もの]の悪口[わるくち]を聞[き]いた。周[まわ]りに住[す]む者[もの]らが、わたしの魂[たましい]を奪[うば]おうと、共[とも]にわたしに集[あつ]まって謀[はか]ったときのことである。"
  14: "しかし、わたしはあなたに寄[よ]り頼[たの]んだ、主[しゅ]よ。「あなたはわたしの神[かみ]である」と、わたしは言[い]った。"
  15: "わたしの時[とき]はあなたの手[て]のうちにある。わたしの敵[てき]の手[て]から、わたしを追[お]う者[もの]らから、わたしを救[すく]い出[だ]してください。"
  16: "あなたの顔[かお]をあなたの僕[しもべ]の上[うえ]に照[て]らし、あなたのあわれみによってわたしを救[すく]ってください。"
  17: "主[しゅ]よ、わたしはあなたを呼[よ]び求[もと]めた。恥[は]じを受[う]けないようにしてください。悪[わる]い者[もの]らが恥[は]じを受け、陰府[よみ]に下[くだ]されるように。"
  18: "偽[いつわ]りの唇[くちびる]は黙[だま]ってしまうように。その唇[くちびる]は、高[たか]ぶりと侮[あなど]りのうちに、正[ただ]しい者[もの]に逆[さか]らって不法[ふほう]を語[かた]る。"
  19: "主[しゅ]よ、あなたの恵[めぐ]みはなんと多[おお]いことか。あなたはそれを、あなたを恐[おそ]れる者[もの]のために蓄[たくわ]え、あなたに寄[よ]り頼[たの]む者[もの]のために、人[ひと]の子[こ]らの前[まえ]で成[な]し遂[と]げられた。"
  20: "あなたは彼[かれ]らを、あなたの御顔[みかお]の隠[かく]れ場[ば]に、人[ひと]の騒[さわ]ぎから隠[かく]し、幕屋[まくや]のうちに、舌[した]の争[あらそ]いからおおってくださる。"
  21: "主[しゅ]はほめたたえられる方[かた]である。主[しゅ]はご自身[じしん]のあわれみを、堅[かた]く囲[かこ]まれた都[みやこ]のうちに、驚[おどろ]くべきほどに示[しめ]された。"
  22: "しかし、わたしは心[こころ]の乱[みだ]れのうちに、「わたしはあなたの目[め]から見放[みはな]された」と言[い]った。それでも、あなたはわたしがあなたに呼[よ]んだとき、わたしの願[ねが]いの声[こえ]を聞[き]かれた。"
  23: "主[しゅ]の聖[せい]なる者[もの]らよ、すべて主[しゅ]を愛[あい]せよ。主[しゅ]は真実[しんじつ]を求[もと]め、高[たか]ぶりを過[す]ぎるほどに行[おこな]う者[もの]には、その報[むく]いを返[かえ]されるからである。"
  24: "すべて主[しゅ]に望[のぞ]みを置[お]く者[もの]よ、雄々[おお]しくあれ。あなたがたの心[こころ]が強[つよ]くなるように。"

notes:
  0: "Εἰς τὸ τέλος· ψαλμὸς τῷ Δαυιδ· ἐκστάσεως — 指揮者のために。ダビデの詩。心の乱れのときのもの (εἰς τὸ τέλος — «в конец», т. е. для начальника хора; ἔκστασις — «исступление, смятение»; Синодальный «во время смятения»)."
  1: "Ἐπὶ σοί, κύριε, ἤλπισα — 主よ、わたしはあなたに寄り頼む (ἐλπίζω — «уповать»; 寄り頼む — термин корпуса). μὴ καταισχυνθείην εἰς τὸν αἰῶνα — とこしえに恥じを受けないようにしてください (καταισχύνω — «посрамлять»). ἐν τῇ δικαιοσύνῃ σου ῥῦσαί με καὶ ἐξελοῦ με — あなたの義によって、わたしを救い、わたしを引き出してください; два глагола (ῥύομαι — «избавлять», ἐξαιρέω — «исхищать») переданы двумя."
  2: "κλῖνον πρός με τὸ οὖς σου — あなたの耳をわたしに傾け. τάχυνον τοῦ ἐξελέσθαι με — 急いでわたしを救い出してください (ταχύνω — «спешить»). γενοῦ μοι εἰς θεὸν ὑπερασπιστὴν καὶ εἰς οἶκον καταφυγῆς τοῦ σῶσαί με — わたしを救うため、わたしの守りの神、逃げ込む家となってください (καταφυγή — «прибежище»)."
  3: "κραταίωμά μου καὶ καταφυγή μου εἶ σύ — あなたこそ、わたしの砦、わたしの逃げ場 (κραταίωμα — «твердыня»). ἕνεκεν τοῦ ὀνόματός σου ὁδηγήσεις με καὶ διαθρέψεις με — あなたの名のゆえに、あなたはわたしを導き、養ってくださる (διατρέφω — «прокармливать»); будущее время сохранено."
  4: "ἐξάξεις με ἐκ παγίδος ταύτης, ἧς ἔκρυψάν μοι — あなたは、わたしのために隠された網からわたしを引き出してくださる (παγίς — «сеть, ловушка»). ὅτι σὺ εἶ ὁ ὑπερασπιστής μου — あなたこそ、わたしを守る方だからである."
  5: "εἰς χεῖράς σου παραθήσομαι τὸ πνεῦμά μου — わたしの霊をあなたの手にゆだねる (πνεῦμα без ἅγιον — 霊[れい], по правилу корпуса). ἐλυτρώσω με, κύριε ὁ θεὸς τῆς ἀληθείας — あなたはわたしを贖い出された、主、真実の神よ (λυτρόω — «искупать, освобождать»). Этот стих приводит Христос на кресте (Лк 23:46); красного в псалме нет, как и во всей Псалтири."
  6: "ἐμίσησας τοὺς διαφυλάσσοντας ματαιότητας διὰ κενῆς — Ты возненавидел хранящих суету всуе (ματαταιότης — «суета»; διαφυλάσσω — «держаться, соблюдать»); второе лицо, как в греческом и славянском «возненавидел еси» (jp-joc и Синодальный читают «я ненавижу»). ἐγὼ δὲ ἐπὶ τῷ κυρίῳ ἤλπισα — しかし、わたしは主に寄り頼む."
  7: "ἀγαλλιάσομαι καὶ εὐφρανθήσομαι ἐπὶ τῷ ἐλέει σου — わたしはあなたのあわれみを喜び、楽しむ (ἀγαλλιάομαι — «ликовать»). ἐπεῖδες τὴν ταπείνωσίν μου — あなたはわたしの卑しさに目を留め (ταπείνωσις — «унижение, бедствие»). ἔσωσας ἐκ τῶν ἀναγκῶν τὴν ψυχήν μου — 苦しみのうちからわたしの魂を救われた (ἀνάγκη — «теснота, нужда»)."
  8: "οὐ συνέκλεισάς με εἰς χεῖρας ἐχθροῦ — あなたはわたしを敵の手に閉じ込めず (συγκλείω — «заключать»). ἔστησας ἐν εὐρυχώρῳ τοὺς πόδας μου — わたしの足を広い所に立てられた (εὐρύχωρος — «пространное место»)."
  9: "ἐλέησόν με, κύριε, ὅτι θλίβομαι — 主よ、わたしをあわれんでください、わたしは苦しんでいるからです (θλίβω — «теснить»). ἐταράχθη ἐν θυμῷ ὁ ὀφθαλμός μου — 憤りのうちに、わたしの目は乱れ、わたしの魂も腹も乱れた (ταράσσω — «смущать»; ἐν θυμῷ — «в ярости», ср. Синодальный «иссохло от горести»). ἡ ψυχή μου καὶ ἡ γαστήρ μου — わたしの魂も腹も."
  10: "ἐξέλιπεν ἐν ὀδύνῃ ἡ ζωή μου — わたしの命は苦しみのうちに尽き (ὀδύνη — «боль, печаль»). τὰ ἔτη μου ἐν στεναγμοῖς — わたしの年は嘆きのうちに過ぎた (στεναγμός — «стенание»). ἠσθένησεν ἐν πτωχείᾳ ἡ ἰσχύς μου — わたしの力は貧しさのうちに弱り (πτωχεία — «нищета»; Синодальный по иному чтению «от грехов моих»). τὰ ὀστᾶ μου ἐταράχθησαν — わたしの骨は乱れた."
  11: "παρὰ πάντας τοὺς ἐχθρούς μου ἐγενήθην ὄνειδος — わたしはすべての敵にまさって恥じとなった (ὄνειδος — «поношение»). τοῖς γείτοσίν μου σφόδρα — 隣人にはとりわけ. φόβος τοῖς γνωστοῖς μου — 知る者には恐れとなった. οἱ θεωροῦντές με ἔξω ἔφυγον ἀπ᾿ ἐμοῦ — 外でわたしを見る者は、わたしから逃げ去った."
  12: "ἐπελήσθην ὡσεὶ νεκρὸς ἀπὸ καρδίας — わたしは死んだ者のように、心から忘れられた (ἐπιλανθάνομαι — «забывать»; ἀπὸ καρδίας — «из сердца»). ἐγενήθην ὡσεὶ σκεῦος ἀπολωλός — わたしは壊れた器のようになった (σκεῦος — «сосуд»)."
  13: "ἤκουσα ψόγον πολλῶν παροικούντων κυκλόθεν — わたしは多くの者の悪口を聞いた、周りに住む者らの (ψόγος — «порицание, злословие»; παροικέω — «жить рядом»). ἐν τῷ ἐπισυναχθῆναι αὐτοὺς ἅμα ἐπ᾿ ἐμὲ τοῦ λαβεῖν τὴν ψυχήν μου ἐβουλεύσαντο — 彼らが共にわたしに集まって、わたしの魂を奪おうと謀ったときのこと. В греческом и славянском нет «ужаса отвсюду» (он есть в Синодальном по евр.), поэтому не добавлен."
  14: "ἐγὼ δὲ ἐπὶ σὲ ἤλπισα, κύριε — しかし、わたしはあなたに寄り頼んだ、主よ. εἶπα Σὺ εἶ ὁ θεός μου — 「あなたはわたしの神である」と言った; слова псалмопевца — 「」."
  15: "ἐν ταῖς χερσίν σου οἱ καιροί μου — わたしの時はあなたの手のうちにある (καιρός — «время»; слав. «в руку Твоєю лета моя»). ῥῦσαί με ἐκ χειρὸς ἐχθρῶν μου καὶ ἐκ τῶν καταδιωκόντων με — 敵の手から、わたしを追う者らから、わたしを救い出してください."
  16: "ἐπίφανον τὸ πρόσωπόν σου ἐπὶ τὸν δοῦλόν σου — あなたの顔をあなたの僕の上に照らし (ἐπιφαίνω — «осиять»). σῶσόν με ἐν τῷ ἐλέει σου — あなたのあわれみによってわたしを救ってください."
  17: "κύριε, μὴ καταισχυνθείην, ὅτι ἐπεκαλεσάμην σε — 主よ、わたしはあなたを呼び求めた、恥じを受けないようにしてください. αἰσχυνθείησαν οἱ ἀσεβεῖς — 悪い者らが恥じを受け. καταχθείησαν εἰς ᾅδου — 陰府に下されるように (κατάγω — «низводить»)."
  18: "ἄλαλα γενηθήτω τὰ χείλη τὰ δόλια — 偽りの唇は黙ってしまうように (ἄλαλος — «немой»). τὰ λαλοῦντα κατὰ τοῦ δικαίου ἀνομίαν — 正しい者に逆らって不法を語る. ἐν ὑπερηφανίᾳ καὶ ἐξουδενώσει — 高ぶりと侮りのうちに (ἐξουδένωσις — «презрение»)."
  19: "ὡς πολὺ τὸ πλῆθος τῆς χρηστότητός σου, κύριε — 主よ、あなたの恵みはなんと多いことか (χρηστότης — «благость»). ἧς ἔκρυψας τοῖς φοβουμένοις σε — あなたはそれを、あなたを恐れる者のために蓄え (κρύπτω — «сберегать»). ἐξειργάσω τοῖς ἐλπίζουσιν ἐπὶ σὲ ἐναντίον τῶν υἱῶν τῶν ἀνθρώπων — あなたに寄り頼む者のために、人の子らの前で成し遂げられた (ἐξεργάζομαι — «совершать»)."
  20: "κατακρύψεις αὐτοὺς ἐν ἀποκρύφῳ τοῦ προσώπου σου — あなたは彼らを、あなたの御顔の隠れ場に隠し. ἀπὸ ταραχῆς ἀνθρώπων — 人の騒ぎから (ταραχή — «смятение»). σκεπάσεις αὐτοὺς ἐν σκηνῇ — 幕屋のうちにおおってくださる. ἀπὸ ἀντιλογίας γλωσσῶν — 舌の争いから (ἀντιλογία — «пререкание»)."
  21: "εὐλογητὸς κύριος — 主はほめたたえられる方である. ἐθαυμάστωσεν τὸ ἔλεος αὐτοῦ — 主はご自身のあわれみを驚くべきほどに示された (θαυμαστόω — «делать дивным»). ἐν πόλει περιοχῆς — 堅く囲まれた都のうちに (περιοχή — «ограда, укрепление»)."
  22: "ἐγὼ δὲ εἶπα ἐν τῇ ἐκστάσει μου — しかし、わたしは心の乱れのうちに…と言った (ἔκστασις — «исступление»). Ἀπέρριμμαι ἄρα ἀπὸ προσώπου τῶν ὀφθαλμῶν σου — 「わたしはあなたの目から見放された」 (ἀπορρίπτω — «отвергать»); слова псалмопевца — 「」. διὰ τοῦτο εἰσήκουσας τῆς φωνῆς τῆς δεήσεώς μου — それでも、あなたは…わたしの願いの声を聞かれた."
  23: "ἀγαπήσατε τὸν κύριον, πάντες οἱ ὅσιοι αὐτοῦ — 主の聖なる者らよ、すべて主を愛せよ. ὅτι ἀληθείας ἐκζητεῖ κύριος — 主は真実を求めるからである (ἐκζητέω — «взыскивать»; слав. «истины взыскует»). ἀνταποδίδωσιν τοῖς περισσῶς ποιοῦσιν ὑπερηφανίαν — 高ぶりを過ぎるほどに行う者には、その報いを返される (περισσῶς — «сверх меры»)."
  24: "ἀνδρίζεσθε — 雄々しくあれ (мн. ч.). κραταιούσθω ἡ καρδία ὑμῶν — あなたがたの心が強くなるように. πάντες οἱ ἐλπίζοντες ἐπὶ κύριον — すべて主に望みを置く者よ."
