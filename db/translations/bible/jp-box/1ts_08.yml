# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в 1 Царств нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 8: сыновья Самуила — судьи (1–3), просьба о царе (4–5), недовольство
# Самуила и ответ Бога (6–9), изложение прав царя (10–18), народ настаивает
# (19–20), Бог велит поставить царя (21–22).
# Речь — 「…」: 8:5 (народ), 8:6 (цитата в речи автора), 8:7–9 (Бог),
# 8:11–18 (Самуил, непрерывно), 8:19–20 (народ, одна речь на два стиха),
# 8:22 (Бог, затем Самуил — две отдельные речи в одном стихе). Вложенной речи нет.
# Красного и синего нет: <j>/<mo> не ставятся.
# 〔…〕 нет: церковных добавлений, которых нет в gr-lxx-byz, в главе не переводим;
# расхождения с слав./Синод. отмечены в notes (8:12 порядок сотников и тысячников,
# 8:16 «юношей ваших» у Синод. вместо «стад»).
# Сносок ⟨…⟩ нет: 王, 預言者, 裁く, 賄賂 уже понятны; новых терминов глава не вводит.
