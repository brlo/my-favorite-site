verses:
  1: "サムエルが年老[としお]いたとき、息子[むすこ]たちをイスラエルの裁[さば]き手[て]に立[た]てた。"
  2: "長男[ちょうなん]の名[な]はヨエル、次男[じなん]の名はアビヤといった。彼らはベエル・シェバで裁[さば]き手[て]であった。"
  3: "しかし、彼の息子[むすこ]たちは彼の道[みち]を歩[あゆ]まず、不正[ふせい]の利[り]を追[お]い求[もと]めて賄賂[わいろ]を受[う]け、裁[さば]きを曲[ま]げた。"
  4: "イスラエルの人[ひと]たちは集[あつ]まって、ラマのサムエルのところへ来[き]た。"
  5: "そして言[い]った。「見[み]よ、あなたは年老[としお]い、あなたの息子[むすこ]たちはあなたの道[みち]を歩[あゆ]んでいない。今[いま]、他[ほか]のすべての民[たみ]と同[おな]じようにわたしたちを裁[さば]く王[おう]を、わたしたちの上[うえ]に立[た]ててほしい。」"
  6: "「わたしたちを裁[さば]く王[おう]を与[あた]えてほしい」と言[い]ったこのことばは、サムエルの目[め]に悪[あく]と映[うつ]った。サムエルは主[しゅ]に祈[いの]った。"
  7: "主[しゅ]はサムエルに言[い]われた。「民[たみ]があなたに語[かた]るすべての声[こえ]に聞[き]きなさい。彼[かれ]らが退[しりぞ]けたのはあなたではなく、わたしである。わたしが彼らの上[うえ]に王[おう]として治[おさ]めることを、彼らは退けたのだ。"
  8: "わたしが彼らをエジプトから導[みちび]き上[のぼ]らせた日[ひ]から今日[きょう]に至[いた]るまで、彼らがわたしに対して行[おこな]ってきたすべてのことのとおり、彼らはわたしを捨[す]てて他[た]の神々[かみがみ]に仕[つか]えた。彼らはあなたにも同じようにする。"
  9: "今[いま]、彼らの声[こえ]に聞[き]きなさい。ただ、彼らに王[おう]の権利[けんり]を証[あかし]し、彼らの上[うえ]に王として治める者の権利を彼らに告[つ]げなさい。」"
  10: "サムエルは、王[おう]を求[もと]める民[たみ]に、主[しゅ]のことばをすべて告[つ]げた。"
  11: "そして言[い]った。「あなたがたの上[うえ]に王[おう]として治める者の権利[けんり]はこうである。彼はあなたがたの息子[むすこ]たちを取[と]り、自分[じぶん]の戦車[せんしゃ]と騎兵[きへい]に付[つ]けて、自分の戦車の前[まえ]を走[はし]らせる。"
  12: "また、彼らを自分[じぶん]の千人[せんにん]の長[ちょう]、百人[ひゃくにん]の長に任[まか]せ、自分の畑[はたけ]を耕[たがや]させ、自分の収穫[しゅうかく]を刈[か]らせ、自分の武具[ぶぐ]と戦車[せんしゃ]の用具[ようぐ]を作[つく]らせる。"
  13: "また、あなたがたの娘[むすめ]たちを取[と]って、香油[こうゆ]を作[つく]る者[もの]、料理[りょうり]をする者、パンを焼[や]く者にする。"
  14: "あなたがたの畑[はたけ]とぶどう畑[ばたけ]と最[もっと]も良[よ]いオリーブ畑を取[と]って、自分[じぶん]の僕[しもべ]たちに与[あた]える。"
  15: "あなたがたの種[たね]とぶどう畑[ばたけ]の十分[じゅうぶん]の一[いち]を取[と]って、自分[じぶん]の宦官[かんがん]たちと僕[しもべ]たちに与[あた]える。"
  16: "あなたがたの奴隷[どれい]と女奴隷[おんなどれい]、あなたがたの最[もっと]も良[よ]い牛[うし]の群[む]れとろばを取[と]って、自分[じぶん]の仕事[しごと]に使[つか]う。"
  17: "あなたがたの羊[ひつじ]の群[む]れの十分[じゅうぶん]の一を取[と]る。あなたがた自身[じしん]も彼の奴隷[どれい]になる。"
  18: "その日[ひ]、あなたがたは自分[じぶん]たちが選[えら]んだ王[おう]のゆえに叫[さけ]ぶが、主[しゅ]はその日、あなたがたに答[こた]えない。」"
  19: "民[たみ]はサムエルの声[こえ]に聞[き]くことを好[この]まず、言[い]った。「いや、王[おう]がわたしたちの上[うえ]にいなければならない。"
  20: "わたしたちも他[ほか]のすべての民[たみ]と同[おな]じになり、わたしたちの王[おう]がわたしたちを裁[さば]き、わたしたちの前[まえ]を進[すす]んで、わたしたちの戦[たたか]いを戦うのだ。」"
  21: "サムエルは民[たみ]のことばをすべて聞[き]いて、それを主[しゅ]の耳[みみ]に語[かた]った。"
  22: "主[しゅ]はサムエルに言[い]われた。「彼[かれ]らの声[こえ]に聞[き]き、彼らの上[うえ]に王[おう]を立[た]てなさい。」サムエルはイスラエルの人[ひと]たちに言った。「あなたがたはそれぞれ、自分[じぶん]の町[まち]へ帰[かえ]りなさい。」"

notes:
  1: "ἐγήρασεν — состарился (γηράσκω). κατέστησεν τοὺς υἱοὺς αὐτοῦ δικαστάς — поставил сыновей своих судьями (καθίστημι, δικαστής), 裁き手."
  2: "πρωτότοκος Ιωηλ — первенец Иоиль (ヨエル). ὄνομα τοῦ δευτέρου Αβια — имя второго Авия (アビヤ). δικασταὶ ἐν Βηρσαβεε — судьи в Вирсавии (Βηρσαβεε, ベエル・シェバ)."
  3: "οὐκ ἐπορεύθησαν ἐν ὁδῷ αὐτοῦ — не пошли путём его. ἐξέκλιναν ὀπίσω τῆς συντελείας — «уклонились вслед прибыли» (ἐκκλίνω, συντέλεια — выгода, корысть; слав. «вслед лихоимания»), 不正の利. ἐλάμβανον δῶρα — брали дары, 賄賂. ἐξέκλινον δικαιώματα — превращали суды (δικαίωμα), 裁きを曲げる."
  4: "συναθροίζονται — собираются (συναθροίζω). παραγίνονται εἰς Αρμαθαιμ — приходят в Армафем, т.е. Раму (ラマ). В гр. «мужи Израиля» (ἄνδρες Ισραηλ); Синод. (МТ) «старейшины» — иное чтение, по базе 人々."
  5: "Ἰδοὺ σὺ γεγήρακας — вот, ты состарился (γηράσκω, перфект). κατάστησον ἐφ᾽ ἡμᾶς βασιλέα — поставь над нами царя (καθίστημι). δικάζειν ἡμᾶς — чтобы судил нас. καθὰ καὶ τὰ λοιπὰ ἔθνη — как и прочие народы (ἔθνος)."
  6: "πονηρὸν τὸ ῥῆμα ἐν ὀφθαλμοῖς Σαμουηλ — «зло слово в глазах Самуила» (πονηρός, ῥῆμα), 目に悪と映った. ὡς εἶπαν — когда сказали (ὡς с аористом). προσηύξατο — помолился (προσεύχομαι)."
  7: "Ἄκουε τῆς φωνῆς τοῦ λαοῦ — послушай голоса народа (ἀκούω с род.). καθὰ ἂν λαλήσωσίν σοι — как бы они ни говорили тебе. οὐ σὲ ἐξουθενήκασιν, ἀλλ᾿ ἢ ἐμὲ ἐξουδενώκασιν — «не тебя уничижили, но Меня уничижили» (ἐξουθενέω, ἐξουθενόω — двойная форма одного глагола). τοῦ μὴ βασιλεύειν ἐπ᾿ αὐτῶν — чтобы не царствовать над ними (инфинитив с τοῦ)."
  8: "κατὰ πάντα τὰ ποιήματα — по всем делам (ποίημα). ἀφ᾽ ἧς ἡμέρας ἀνήγαγον — с того дня, как Я вывел (ἀνάγω). ἐγκατέλιπόν με — оставили Меня (ἐγκαταλείπω). ἐδούλευον θεοῖς ἑτέροις — служили иным богам. οὕτως αὐτοὶ ποιοῦσιν καὶ σοί — так они делают и с тобой."
  9: "ἄκουε τῆς φωνῆς αὐτῶν — послушай голоса их. διαμαρτυρόμενος διαμαρτύρῃ — «свидетельствуя засвидетельствуй», т.е. со всей настойчивостью объяви (διαμαρτύρομαι). τὸ δικαίωμα τοῦ βασιλέως — права царя (δικαίωμα), 王の権利. ὃς βασιλεύσει ἐπ᾽ αὐτούς — который будет царствовать над ними."
  10: "πᾶν τὸ ῥῆμα κυρίου — всё слово Господне. τοὺς αἰτοῦντας παρ᾽ αὐτοῦ βασιλέα — просящим у него царя (αἰτέω)."
  11: "Τοῦτο ἔσται τὸ δικαίωμα — «это будет право» (δικαίωμα). λήμψεται — возьмёт. θήσεται αὐτοὺς ἐν ἅρμασιν … καὶ ἱππεῦσιν — поставит их при колесницах и всадниках (ἅρμα, ἱππεύς), 戦車, 騎兵. προτρέχοντας τῶν ἁρμάτων — бегущими перед колесницами (προτρέχω)."
  12: "χιλιάρχους καὶ ἑκατοντάρχους — тысяченачальниками и сотниками (χιλίαρχος, ἑκατόνταρχος); слав. порядок обратный («сотники и тысящники»). θερίζειν θερισμὸν αὐτοῦ — жать жатву его. τρυγᾶν τρυγητὸν αὐτοῦ — собирать виноград его (τρυγάω, τρυγητός). σκεύη πολεμικά — воинские орудия (σκεῦος), 武具. σκεύη ἁρμάτων — колесничный прибор."
  13: "θυγατέρας ὑμῶν λήμψεται — дочерей ваших возьмёт. εἰς μυρεψούς — в составительницы мастей (μυρεψός), 香油を作る者. μαγειρίσσας — поварихи (μαγείρισσα). πεσσούσας — «пекущие» (πέσσω), хлебопёки."
  14: "τοὺς ἀγροὺς … ἀμπελῶνας … ἐλαιῶνας τοὺς ἀγαθοὺς — поля, виноградники, масличные сады лучшие (ἀγρός, ἀμπελών, ἐλαιών). δώσει τοῖς δούλοις αὐτοῦ — отдаст рабам своим."
  15: "τὰ σπέρματα — посевы, семена (σπέρμα). ἀποδεκατώσει — обложит десятиной (ἀποδεκατόω). τοῖς εὐνούχοις — евнухам, царедворцам (εὐνοῦχος), 宦官; слав. «скопцем»."
  16: "τοὺς δούλους … τὰς δούλας — рабов и рабынь. τὰ βουκόλια ὑμῶν τὰ ἀγαθά — лучшие стада крупного скота (βουκόλιον), 牛の群れ; Синод. (МТ) «юношей ваших лучших» — иное чтение, по базе 牛の群れ. τοὺς ὄνους — ослов. ἀποδεκατώσει εἰς τὰ ἔργα αὐτοῦ — «обложит на дела свои»."
  17: "τὰ ποίμνια — стада мелкого скота (ποίμνιον), 羊の群れ. ἀποδεκατώσει — возьмёт десятину. ὑμεῖς ἔσεσθε αὐτῷ δοῦλοι — сами будете ему рабами."
  18: "βοήσεσθε — возопите (βοάω). ἐκ προσώπου βασιλέως ὑμῶν — от лица царя вашего (ἀπό προσώπου — «из-за»). οὗ ἐξελέξασθε ἑαυτοῖς — которого избрали себе (ἐκλέγω). οὐκ ἐπακούσεται κύριος ὑμῶν — не услышит вас Господь (ἐπακούω). ὅτι ὑμεῖς ἐξελέξασθε ἑαυτοῖς βασιλέα — потому что вы сами избрали себе царя."
  19: "οὐκ ἠβούλετο … ἀκοῦσαι — не хотел слушать (βούλομαι). Οὐχί, ἀλλ᾿ ἢ βασιλεὺς ἔσται ἐφ᾽ ἡμᾶς — «нет, но царь будет над нами» (ἀλλ᾿ ἤ — «но»). Речь народа продолжается в ст. 20."
  20: "ἐσόμεθα καὶ ἡμεῖς κατὰ πάντα τὰ ἔθνη — и мы будем как все народы. δικάσει ἡμᾶς — будет судить нас. ἐξελεύσεται ἔμπροσθεν ἡμῶν — выйдет перед нами (ἐξέρχομαι). πολεμήσει τὸν πόλεμον ἡμῶν — будет вести войну нашу (плеоназм сохранён: 戦いを戦う)."
  21: "ἤκουσεν … πάντας τοὺς λόγους — выслушал все слова. ἐλάλησεν αὐτοὺς εἰς τὰ ὦτα κυρίου — «сказал их в уши Господа», т.е. пересказал вслух Господа (οὖς, 耳)."
  22: "Ἄκουε τῆς φωνῆς αὐτῶν — послушай голоса их. βασίλευσον αὐτοῖς βασιλέα — «воцари им царя», поставь им царя (βασιλεύω). Ἀποτρεχέτω ἕκαστος εἰς τὴν πόλιν αὐτοῦ — «пусть отбежит каждый в город свой» (ἀποτρέχω), 帰りなさい."
