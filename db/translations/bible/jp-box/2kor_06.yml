# jp-box, Второе послание к Коринфянам, глава 6. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в notes.
# Глава 6: соработники Божии и перечень скорбей (1–10), теснота в сердцах (11–13),
# иго с неверными и цитаты о выходе из среды их (14–18).
# Красного и синего нет: прямой речи Христа в главе нет, <j>/<mo> не ставятся.
# 〔…〕 в главе нет: весь текст в базе на месте. 6:16 — в базе ἡμεῖς, церковный текст
# (слав., Синодальный, jp-joc) читает ὑμεῖς — принято «あなたがたは», это замена, не добавка.
# Цитаты: 6:2 (Ис 49:8), 6:16 (Лев 26:12), 6:17 (Ис 52:11), 6:18 (2 Цар 7:14) — 「…」.
# Сноска ⟨…⟩ одна: 6:15 ベリアル — имя, неочевидное нехристианину, первое место в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: 2kor
chapter: 6
draft: true

verses:
  1: "わたしたちは神[かみ]とともに働[はたら]く者[もの]として、あなたがたに勧[すす]める。神[かみ]の恵[めぐ]みをむなしく受[う]けないようにしなさい。"
  2: "神[かみ]が言[い]っておられるからである。「受[う]け入[い]れられる時[とき]に、わたしはあなたに答[こた]え、救[すく]いの日[ひ]に、わたしはあなたを助[たす]けた。」見[み]よ、今[いま]こそ、受け入れられる時[とき]である。見[み]よ、今[いま]こそ、救[すく]いの日[ひ]である。"
  3: "わたしたちは、どんなことにおいても、だれにもつまずきの石[いし]を置[お]かず、わたしたちの務[つと]めが非難[ひなん]されないようにしている。"
  4: "むしろ、わたしたちはすべてのことにおいて、神[かみ]の奉仕者[ほうししゃ]として自分[じぶん]を明[あき]らかにしている。すなわち、大[おお]きな忍耐[にんたい]において、苦難[くなん]において、窮乏[きゅうぼう]において、圧迫[あっぱく]において、"
  5: "打[う]たれることにおいて、投獄[とうごく]において、騒乱[そうらん]において、労苦[ろうく]において、不眠[ふみん]において、断食[だんじつ]において、"
  6: "純潔[じゅんけつ]において、知識[ちしき]において、寛容[かんよう]において、慈愛[じあい]において、{聖霊[せいれい]|聖神[せいしん]}において、偽[いつわ]りのない愛[あい]において、"
  7: "真理[しんり]の言葉[ことば]において、神[かみ]の力[ちから]において、右[みぎ]と左[ひだり]の手[て]に義[ぎ]の武具[ぶぐ]を携[たずさ]えて、"
  8: "栄光[えいこう]と不名誉[ふめいよ]を通[とお]して、悪評[あくひょう]と好評[こうひょう]を通して、人[ひと]を欺[あざむ]く者[もの]のようでいて真実[しんじつ]であり、"
  9: "知[し]られていないようでいて、よく知[し]られており、死[し]にかけているようでいて、見[み]よ、生[い]きており、罰[ばつ]を受[う]けているようでいて、殺[ころ]されず、"
  10: "悲[かな]しんでいるようでいて、いつも喜[よろこ]んでおり、貧[まず]しいようでいて、多[おお]くの人[ひと]を富[と]ませ、何[なに]も持[も]っていないようでいて、すべてを持[も]っているのである。"
  11: "コリントの人[ひと]たちよ、わたしたちの口[くち]はあなたがたに向[む]かって開[ひら]かれ、わたしたちの心[こころ]は広[ひろ]くされている。"
  12: "あなたがたは、わたしたちのうちにあって狭[せま]くされているのではなく、あなたがたの心[こころ]の内[うち]で狭くされているのである。"
  13: "その同[おな]じ報[むく]いとして、わたしは子[こ]どもたちに言[い]うように言うが、あなたがたも、心[こころ]を広[ひろ]くしなさい。"
  14: "あなたがたは、信[しん]じていない者[もの]たちと、異[こと]なるくびきを負[お]ってはならない。なぜなら、義[ぎ]と不[ふ]法[ほう]とに、何[なん]の交[まじ]わりがあろうか。光[ひかり]と闇[やみ]とに、何の交わりがあろうか。"
  15: "キリストと、ベリアル⟨ユダヤの言[い]い方[かた]で「役[やく]に立[た]たない者[もの]」の意[い]。悪魔[あくま]を指[さ]す。⟩との間[あいだ]に、何[なん]の調和[ちょうわ]があろうか。信[しん]じる者[もの]と信[しん]じない者[もの]とに、何[なん]の分[わ]け前[まえ]があろうか。"
  16: "神[かみ]の神殿[しんでん]と偶像[ぐうぞう]とに、何[なん]の一致[いっち]があろうか。あなたがたは生[い]ける神[かみ]の神殿[しんでん]だからである。神[かみ]が言[い]われたとおりである。「わたしは彼[かれ]らのうちに住[す]み、彼[かれ]らの間[あいだ]を歩[あゆ]み、わたしは彼[かれ]らの神[かみ]となり、彼[かれ]らはわたしの民[たみ]となる。」"
  17: "「だから、彼[かれ]らの間[あいだ]から出[で]て、離[はな]れなさい、と主[しゅ]は言[い]われる。汚[けが]れたものに触[ふ]れてはならない。そうすれば、わたしはあなたがたを受[う]け入[い]れる。」"
  18: "「わたしはあなたがたの父[ちち]となり、あなたがたはわたしの息子[むすこ]たち、娘[むすめ]たちとなる、と全能者[ぜんのうしゃ]である主[しゅ]は言[い]われる。」"

notes:
  1: "Συνεργοῦντες — «соработники»; 神とともに働く者. εἰς κενὸν τὴν χάριν δέξασθαι — 恵みをむなしく受ける."
  2: "Ис 49:8. καιρὸς εὐπρόσδεκτος — 受け入れられる時. ἐπήκουσά σου — あなたに答えた. καὶ ἰδοὺ νῦν дважды — 見よ、今こそ."
  3: "προσκοπή — «преткновение»; つまずきの石. μωμηθῇ — 非難される."
  4: "συνιστάνοντες ἑαυτούς — 自分を明らかにしている. διάκονοι θεοῦ — 神の奉仕者. θλῖψις, ἀνάγκη, στενοχωρία — 苦難、窮乏、圧迫."
  5: "πληγαί — 打たれること; φυλακαί — 投獄; ἀκαταστασίαι — 騒乱; κόποι — 労苦; ἀγρυπνίαι — 不眠; νηστεῖαι — 断食."
  6: "ἁγνότης — 純潔; γνῶσις — 知識; μακροθυμία — 寛容; χρηστότης — 慈愛; πνεῦμα ἅγιον — {聖霊|聖神}; ἀνυπόκριτος — 偽りのない."
  7: "ὅπλα τῆς δικαιοσύνης — 義の武具; δεξιῶν καὶ ἀριστερῶν — 右と左の手に."
  8: "δόξα καὶ ἀτιμία — 栄光と不名誉; δυσφημία καὶ εὐφημία — 悪評と好評; ὡς πλάνοι καὶ ἀληθεῖς — 欺く者のようでいて真実."
  9: "ὡς ἀγνοούμενοι — 知られていないようで; παιδευόμενοι — 罰を受けている; οὐ θανατούμενοι — 殺されず."
  10: "πτωχοί — 貧しい; πλουτίζοντες — 富ませる; μηδὲν ἔχοντες καὶ πάντα κατέχοντες — 何も持っていないようでいて、すべてを持っている."
  11: "Τὸ στόμα ἡμῶν ἀνέῳγεν — 口は開かれ; ἡ καρδία πεπλάτυνται — 心は広くされている."
  12: "οὐ στενοχωρεῖσθε ἐν ἡμῖν — わたしたちのうちで狭くされていない; σπλάγχνα — 心の内."
  13: "ἀντιμισθία — 報い; ὡς τέκνοις λέγω — 子どもたちに言うように; πλατύνθητε — 心を広くしなさい."
  14: "ἑτεροζυγοῦντες — «неравно впряжённые»; 異なるくびきを負う. μετοχή — 交わり. ἀνομία — 不法. γάρ передан «なぜなら»."
  15: "Βελιάρ — ベリアル; συμφώνησις — 調和; μερίς — 分け前. Сноска: имя неочевидно нехристианину; первое место в корпусе."
  16: "συγκατάθεσις — 一致. В базе ἡμεῖς («мы»), церковный текст (слав., Синодальный, jp-joc) читает ὑμεῖς («вы») — あなたがたは; замена, поэтому без 〔〕. Цитата Лев 26:12 — 「…」."
  17: "Ис 52:11. ἐξέλθατε ἐκ μέσου αὐτῶν — 彼らの間から出て; ἀφορίσθητε — 離れなさい; λέγει κύριος — と主は言われる."
  18: "2 Цар 7:14. παντοκράτωρ — 全能者."
