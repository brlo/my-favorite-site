# jp-box, Псалтирь, псалом 36. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный 常体, без 文語.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0.
# Псалом 36: увещание не завидовать злодеям (1–11), Господь хранит праведных (12–26),
# путь праведника и конец нечестивого (27–40). В евр. это алфавитный акростих.
# Красного и синего нет: псалом — увещание и размышление, прямой речи нет.
# 〔…〕 нет: все слова в gr-lxx-byz есть. Чтение Синодального и jp-joc в 20
# (ὡσεὶ στέαρ ἀμνῶν) в базе отсутствует и не добавлено — отмечено в notes.
# セラ (διάψαλμα) в псалме не встречается.
# Сносок ⟨…⟩ нет: 杉, 柔和, 無垢 понятны, 盾 и 地 уже в корпусе.
# jp-ni не использовался.

