verses:
  0: "ダビデの詩[うた]。"
  1: "悪[わる]い者[もの]たちを妬[ねた]んではならない。不[ふ]法[ほう]を行[おこな]う者[もの]をうらやんではならない。"
  2: "彼[かれ]らは草[くさ]のように間[ま]もなく枯[か]れ、若草[わかくさ]のように間[ま]もなくしぼむからである。"
  3: "主[しゅ]に寄[よ]り頼[たの]み、善[ぜん]を行[おこな]え。この地[ち]に住[す]み、その豊[ゆた]かさに養[やしな]われよ。"
  4: "主[しゅ]を楽[たの]しみとせよ。そうすれば、主[しゅ]はあなたの心[こころ]の願[ねが]いをかなえてくださる。"
  5: "あなたの道[みち]を主[しゅ]にゆだね、主[しゅ]に寄[よ]り頼[たの]め。主[しゅ]が成[な]し遂[と]げてくださる。"
  6: "主[しゅ]はあなたの義[ぎ]を光[ひかり]のように、あなたの裁[さば]きを真昼[まひる]のように引[ひ]き出[だ]される。"
  7: "主[しゅ]に従[したが]い、主[しゅ]に願[ねが]え。自分[じぶん]の道[みち]で成功[せいこう]する者[もの]、不[ふ]法[ほう]を行[おこな]う人[ひと]を妬[ねた]んではならない。"
  8: "怒[いか]りをやめ、憤[いきどお]りを捨[す]てよ。妬[ねた]んで悪[わる]いことをしてはならない。"
  9: "悪[わる]いことをする者[もの]は断[た]ち絶[た]やされ、主[しゅ]を待[ま]ち望[のぞ]む者[もの]がこの地[ち]を受[う]け継[つ]ぐからである。"
  10: "もう少[すこ]しで、罪[つみ]人[びと]はいなくなる。あなたがその場所[ばしょ]を探[さが]しても、見[み]つからない。"
  11: "しかし、柔和[にゅうわ]な者[もの]はこの地[ち]を受[う]け継[つ]ぎ、豊[ゆた]かな平和[へいわ]を楽[たの]しむ。"
  12: "罪[つみ]人[びと]は正[ただ]しい者[もの]をうかがい、その者[もの]に向[む]かって歯[は]を鳴[な]らす。"
  13: "しかし、主[しゅ]はその者[もの]を笑[わら]われる。その日[ひ]が来[く]るのを、主[しゅ]は見[み]ておられるからである。"
  14: "罪[つみ]人[びと]は剣[つるぎ]を抜[ぬ]き、弓[ゆみ]を張[は]って、貧[まず]しい者[もの]と乏[とぼ]しい者[もの]を倒[たお]し、心[こころ]の直[す]ぐな者[もの]を殺[ころ]そうとする。"
  15: "彼[かれ]らの剣[つるぎ]は彼[かれ]ら自身[じしん]の心[こころ]に刺[さ]さり、彼[かれ]らの弓[ゆみ]は折[お]られるように。"
  16: "正[ただ]しい者[もの]のわずかなものは、罪[つみ]人[びと]の多[おお]くの富[とみ]にまさる。"
  17: "罪[つみ]人[びと]の腕[うで]は折[お]られ、主[しゅ]は正[ただ]しい者[もの]を支[ささ]えられるからである。"
  18: "主[しゅ]は傷[きず]のない者[もの]の道[みち]を知[し]っておられ、その受[う]け継[ぎ]は永遠[えいえん]に続[つづ]く。"
  19: "彼[かれ]らは災[わざわ]いの時[とき]にも恥[は]じず、飢[う]えの日[ひ]にも満[み]たされる。"
  20: "罪[つみ]人[びと]は滅[ほろ]びる。主[しゅ]の敵[てき]は、ほめたたえられて高[たか]く上[あ]げられたとしても、煙[けむり]のように消[き]えてなくなる。"
  21: "罪[つみ]人[びと]は借[か]りては返[かえ]さず、正[ただ]しい者[もの]はあわれんで与[あた]える。"
  22: "主[しゅ]に祝福[しゅくふく]される者[もの]はこの地[ち]を受[う]け継[つ]ぎ、主[しゅ]に呪[のろ]われる者[もの]は断[た]ち絶[た]やされる。"
  23: "人[ひと]の歩[あゆ]みは主[しゅ]によって定[さだ]められ、主[しゅ]はその道[みち]を喜[よろこ]ばれる。"
  24: "その人[ひと]が倒[たお]れても、打[う]ち砕[くだ]かれない。主[しゅ]がその手[て]を支[ささ]えておられるからである。"
  25: "わたしは若[わか]かったが、今[いま]は老[お]いた。それでも、正[ただ]しい者[もの]が捨[す]てられ、その子[こ]孫[そん]がパンを乞[こ]うのを見[み]たことがない。"
  26: "その人[ひと]はいつもあわれみ、貸[か]し与[あた]え、その子[こ]孫[そん]は祝福[しゅくふく]を受[う]ける。"
  27: "悪[あく]を避[さ]けて善[ぜん]を行[おこな]え。そうすれば、いつまでも住[す]み続[つづ]ける。"
  28: "主[しゅ]は裁[さば]きを愛[あい]し、その聖[せい]なる者[もの]たちを捨[す]てない。彼[かれ]らは永遠[えいえん]に守[まも]られ、不[ふ]法[ほう]の者[もの]は追[お]い払[はら]われ、悪[わる]い者[もの]の子[こ]孫[そん]は断[た]ち絶[た]やされる。"
  29: "正[ただ]しい者[もの]はこの地[ち]を受[う]け継[つ]ぎ、そこに永遠[えいえん]に住[す]む。"
  30: "正[ただ]しい者[もの]の口[くち]は知恵[ちえ]を語[かた]り、その舌[した]は裁[さば]きを告[つ]げる。"
  31: "その人[ひと]の心[こころ]には、その神[かみ]の律法[りっぽう]があり、その歩[あゆ]みはよろめかない。"
  32: "罪[つみ]人[びと]は正[ただ]しい者[もの]をじっと見[み]つめ、殺[ころ]そうとしてねらう。"
  33: "しかし、主[しゅ]はその者[もの]を罪[つみ]人[びと]の手[て]に渡[わた]さない。裁[さば]きを受[う]けるときも、罪[つみ]に定[さだ]められない。"
  34: "主[しゅ]を待[ま]ち望[のぞ]み、その道[みち]を守[まも]れ。そうすれば、主[しゅ]はあなたを高[たか]く上[あ]げて、この地[ち]を受[う]け継[つ]がせてくださる。罪[つみ]人[びと]が断[た]ち絶[た]やされるのを、あなたは見[み]る。"
  35: "わたしは、悪[わる]い者[もの]が高[たか]ぶり、レバノンの杉[すぎ]のようにそびえ立[た]つのを見[み]た。"
  36: "しかし、そこを通[とお]り過[す]ぎてみると、もういない。探[さが]しても、その場所[ばしょ]は見[み]つからない。"
  37: "無[む]垢[く]を保[たも]ち、直[す]ぐな者[もの]を見[み]よ。平和[へいわ]な人[ひと]には末[すえ]があるからである。"
  38: "しかし、不[ふ]法[ほう]の者[もの]はともに断[た]ち絶[た]やされ、悪[わる]い者[もの]の末[すえ]は消[き]え失[う]せる。"
  39: "正[ただ]しい者[もの]の救[すく]いは主[しゅ]から来[く]る。主[しゅ]は苦難[くなん]の時[とき]の彼[かれ]らの盾[たて]である。"
  40: "主[しゅ]は彼[かれ]らを助[たす]け、救[すく]い出[だ]す。罪[つみ]人[びと]から連[つ]れ出[だ]して救[すく]う。彼[かれ]らが主[しゅ]に寄[よ]り頼[たの]んだからである。"

notes:
  0: "Τοῦ Δαυιδ — ダビデの詩. В гр. только «Давидов»; 詩 добавлено по церковному надписанию (Синодальный «Псалом Давида», jp-joc ダワィドの詠). Надписание — стих 0, скобками не маркируется."
  1: "Μὴ παραζήλου ἐν πονηρευομένοις — не ревнуй о лукавнующих (παραζηλόω «ревновать, завидовать»). μηδὲ ζήλου τοὺς ποιοῦντας τὴν ἀνομίαν — ниже завидуй творящим беззаконие (ζηλόω — второй синоним; оба глагола сохранены). Псалом — увещание, обращение к одному, отсюда 〜てはならない."
  2: "ὡσεὶ χόρτος ταχὺ ἀποξηρανθήσονται — как трава скоро иссохнут (χόρτος «трава»). ὡσεὶ λάχανα χλόης — как зелень травная (λάχανον «овощ, зелень»; χλόη «молодая трава»). ταχύ повторено дважды — 間もなく сохранено в обеих частях."
  3: "ἔλπισον ἐπὶ κύριον καὶ ποίει χρηστότητα — уповай на Господа и делай добро (χρηστότης «благость»). κατασκήνου τὴν γῆν — населяй землю (κατασκηνόω «обитать»). ποιμανθήσῃ ἐπὶ τῷ πλούτῳ αὐτῆς — будешь пастись на богатстве её (ποιμαίνω в pass. «пастись»); 養われる передаёт образ пастьбы."
  4: "κατατρύφησον τοῦ κυρίου — наслаждайся Господом (κατατρυφάω «находить усладу»). δώσει σοι τὰ αἰτήματα τῆς καρδίας σου — даст тебе прошения сердца твоего."
  5: "ἀποκάλυψον πρὸς κύριον τὴν ὁδόν σου — открой Господу путь твой (ἀποκαλύπτω «открывать»); ゆだねる — церковное понимание (jp-joc 託して, Синодальный «предай»). ἔλπισον ἐπ᾽ αὐτόν, καὶ αὐτὸς ποιήσει — уповай на Него, и Он сотворит."
  6: "ἐξοίσει ὡς φῶς τὴν δικαιοσύνην σου — изведёт как свет правду твою (ἐκφέρω «выносить, выводить»). τὸ κρίμα σου ὡς μεσημβρίαν — суд твой как полдень (μεσημβρία «полдень»)."
  7: "ὑποτάγηθι τῷ κυρίῳ — повинись Господу (ὑποτάσσομαι «подчиняться»). ἱκέτευσον αὐτόν — умоли Его (ἱκετεύω «умолять»). μὴ παραζήλου ἐν τῷ κατευοδουμένῳ — не ревнуй преуспевающему (κατευοδόομαι «иметь успех»). ἐν ἀνθρώπῳ ποιοῦντι παρανομίας — человеку, творящему беззакония."
  8: "παῦσαι ἀπὸ ὀργῆς — престани от гнева (παύω «прекращать»). ἐγκατάλιπε θυμόν — оставь ярость (θυμός «ярость, пыл»). μὴ παραζήλου ὥστε πονηρεύεσθαι — не ревнуй, чтобы лукавствовать; 妬んで悪いことをしてはならない передаёт ὥστε цели."
  9: "οἱ πονηρευόμενοι ἐξολεθρευθήσονται — лукавнующие потребятся (ἐξολεθρεύω «истреблять»). οἱ ὑπομένοντες τὸν κύριον — терпящие Господа; 待ち望む — ὑπομένω «терпеливо ждать». κληρονομήσουσιν γῆν — наследуют землю; この地 — земля обетования."
  10: "ἔτι ὀλίγον — ещё немного. οὐ μὴ ὑπάρξῃ ὁ ἁμαρτωλός — не будет грешника (ὑπάρχω «существовать»). ζητήσεις τὸν τόπον αὐτοῦ καὶ οὐ μὴ εὕρῃς — взыщешь место его и не обрящешь."
  11: "οἱ πραεῖς — кроткие (πραΰς «кроткий»). κληρονομήσουσιν γῆν — наследуют землю (ср. Мф 5:5). κατατρυφήσουσιν ἐπὶ πλήθει εἰρήνης — насладятся множеством мира."
  12: "παρατηρήσεται — назирает, подстерегает (παρατηρέω «наблюдать, следить»). βρύξει... τοὺς ὀδόντας αὐτοῦ — скрежещет зубами (βρύχω «скрежетать»)."
  13: "ἐκγελάσεται αὐτόν — посмеётся ему (ἐκγελάω «осмеять»). προβλέπει — прозирает (προβλέπω «предвидеть»). ἥξει ἡ ἡμέρα αὐτοῦ — придёт день его."
  14: "ῥομφαίαν ἐσπάσαντο — меч извлекли (σπάω «вытаскивать»; ῥομφαία «меч»). ἐνέτειναν τόξον αὐτῶν — напрягли лук свой (ἐντείνω). καταβαλεῖν πτωχὸν καὶ πένητα — низложить нищего и убогого; оба слова сохранены. σφάξαι τοὺς εὐθεῖς τῇ καρδίᾳ — заклать правых сердцем."
  15: "εἰσέλθοι... συντριβείησαν — оптатив: да войдёт, да сокрушатся; по-японски 〜ように. ἡ ῥομφαία αὐτῶν εἰς τὴν καρδίαν αὐτῶν — их меч в их сердце."
  16: "κρεῖσσον ὀλίγον τῷ δικαίῳ ὑπὲρ πλοῦτον ἁμαρτωλῶν πολύν — лучше малое праведнику, нежели богатство грешных многое (ὑπέρ в сравнении)."
  17: "βραχίονες ἁμαρτωλῶν συντριβήσονται — мышцы грешных сокрушатся (βραχίων «мышца, рука»). ὑποστηρίζει τοὺς δικαίους κύριος — подкрепляет праведных Господь (ὑποστηρίζω «поддерживать»)."
  18: "γινώσκει κύριος τὰς ὁδοὺς τῶν ἀμώμων — знает Господь пути непорочных (ἄμωμος «непорочный, без порока»); 傷のない者 — по корпусу. ἡ κληρονομία αὐτῶν εἰς τὸν αἰῶνα — наследие их в век."
  19: "οὐ καταισχυνθήσονται ἐν καιρῷ πονηρῷ — не постыдятся во время лютое. ἐν ἡμέραις λιμοῦ χορτασθήσονται — во дни глада насытятся (λιμός «голод»; χορτάζω «насыщать»)."
  20: "οἱ ἁμαρτωλοὶ ἀπολοῦνται — грешники погибнут. οἱ ἐχθροὶ τοῦ κυρίου ἅμα τῷ δοξασθῆναι αὐτοὺς καὶ ὑψωθῆναι — враги Господни, как только прославятся и возвысятся (ἅμα τῷ + inf. «как только»). ἐκλιπόντες ὡσεὶ καπνὸς ἐξέλιπον — исчезая, как дым, исчезли; двойной глагол сохранён. В Синодальном и jp-joc иное чтение ὡσεὶ στέαρ ἀμνῶν («как тук агнцев»), но в gr-lxx-byz его нет, поэтому оно не добавлено и 〔…〕 не ставится."
  21: "δανείζεται ὁ ἁμαρτωλὸς καὶ οὐκ ἀποτείσει — занимает грешник и не отдаст (δανείζομαι «брать взаймы»; ἀποτίνω «возвращать»). ὁ δίκαιος οἰκτίρει καὶ διδοῖ — праведный милует и даёт (οἰκτίρω «миловать»)."
  22: "οἱ εὐλογοῦντες αὐτὸν — благословляющие Его; по церковному пониманию (Синодальный «благословляемые Им», jp-joc 主に降福せられし者) передано страдательно: 主に祝福される者. οἱ καταρώμενοι αὐτὸν — проклинающие Его; там же страдательно — 主に呪われる者. В гр. действительная форма, амфиболия не сглажена, решение отмечено."
  23: "παρὰ κυρίου τὰ διαβήματα ἀνθρώπου κατευθύνεται — от Господа стопы человеку исправляются (κατευθύνω «направлять»). τὴν ὁδὸν αὐτοῦ θελήσει — и путь его восхощет, т. е. Господь благоволит к пути человека."
  24: "ὅταν πέσῃ, οὐ καταραχθήσεται — когда упадёт, не разобьётся (καταράσσω «разбивать»). κύριος ἀντιστηρίζει χεῖρα αὐτοῦ — Господь подкрепляет руку его (ἀντιστηρίζω «подпирать»)."
  25: "νεώτερος ἐγενόμην καὶ γὰρ ἐγήρασα — молод был я, ибо и состарился. οὐκ εἶδον δίκαιον ἐγκαταλελειμμένον — не видел праведника оставленным. τὸ σπέρμα αὐτοῦ ζητοῦν ἄρτους — семени его, просящего хлебы."
  26: "ὅλην τὴν ἡμέραν ἐλεᾷ καὶ δανείζει — весь день милует и взаим даёт. τὸ σπέρμα αὐτοῦ εἰς εὐλογίαν ἔσται — семя его во благословение будет."
  27: "ἔκκλινον ἀπὸ κακοῦ καὶ ποίησον ἀγαθόν — уклонися от зла и сотвори благо (ἐκκλίνω «уклоняться»). κατασκήνου εἰς αἰῶνα αἰῶνος — вселися в век века."
  28: "κύριος ἀγαπᾷ κρίσιν — Господь любит суд. οὐκ ἐγκαταλείψει τοὺς ὁσίους αὐτοῦ — не оставит преподобных Своих (ὅσιος «святой, благочестивый»). εἰς τὸν αἰῶνα φυλαχθήσονται — в век сохранятся. ἄνομοι ἐκδιωχθήσονται — беззаконники изгонятся. σπέρμα ἀσεβῶν ἐξολεθρευθήσεται — семя нечестивых потребится."
  29: "δίκαιοι κληρονομήσουσι γῆν — праведники наследуют землю. κατασκηνώσουσιν εἰς αἰῶνα αἰῶνος ἐπ᾽ αὐτῆς — вселятся в век века на ней."
  30: "στόμα δικαίου μελετήσει σοφίαν — уста праведного поучатся премудрости (μελετάω «размышлять, произносить»). ἡ γλῶσσα αὐτοῦ λαλήσει κρίσιν — язык его возглаголет суд."
  31: "ὁ νόμος τοῦ θεοῦ αὐτοῦ ἐν καρδίᾳ αὐτοῦ — закон Бога его в сердце его. οὐχ ὑποσκελισθήσεται τὰ διαβήματα αὐτοῦ — не запнутся стопы его (ὑποσκελίζω «подставлять ногу, запинать»)."
  32: "κατανοεῖ ὁ ἁμαρτωλὸς τὸν δίκαιον — всматривается грешник в праведника (κατανοέω «всматриваться, подстерегать»). ζητεῖ τοῦ θανατῶσαι αὐτόν — ищет умертвить его."
  33: "οὐ μὴ ἐγκαταλίπῃ αὐτὸν εἰς τὰς χεῖρας αὐτοῦ — не оставит его в руках его. οὐδὲ μὴ καταδικάσηται αὐτόν, ὅταν κρίνηται αὐτῷ — и не осудит его, когда он судится (καταδικάζω «осуждать»)."
  34: "ὑπόμεινον τὸν κύριον — потерпи Господа. φύλαξον τὴν ὁδὸν αὐτοῦ — сохрани путь Его. ὑψώσει σε τοῦ κατακληρονομῆσαι γῆν — вознесёт тебя наследовать землю. ἐν τῷ ἐξολεθρεύεσθαι ἁμαρτωλοὺς ὄψῃ — при истреблении грешников увидишь."
  35: "εἶδον ἀσεβῆ ὑπερυψούμενον — видел нечестивого превозносящегося (ὑπερυψόω «превозносить»). ἐπαιρόμενον ὡς τὰς κέδρους τοῦ Λιβάνου — высящегося, как кедры Ливанские (κέδρος «кедр»; Λίβανος «Ливан»)."
  36: "παρῆλθον, καὶ ἰδοὺ οὐκ ἦν — прошёл, и вот его нет. ἐζήτησα αὐτόν, καὶ οὐχ εὑρέθη ὁ τόπος αὐτοῦ — взыскал его, и не нашлось место его."
  37: "φύλασσε ἀκακίαν — храни незлобие (ἀκακία «незлобие, простота»); 無垢を保つ — по смыслу. ἰδὲ εὐθύτητα — виждь правоту (εὐθύτης «прямота»). ἔστιν ἐγκατάλειμμα ἀνθρώπῳ εἰρηνικῷ — есть остаток человеку мирному, т. е. у мирного есть будущее (ἐγκατάλειμμα «остаток»)."
  38: "οἱ παράνομοι ἐξολεθρευθήσονται ἐπὶ τὸ αὐτό — беззаконники потребятся вместе. τὰ ἐγκαταλείμματα τῶν ἀσεβῶν — остатки нечестивых."
  39: "σωτηρία τῶν δικαίων παρὰ κυρίου — спасение праведных от Господа. ὑπερασπιστὴς αὐτῶν — защититель их (ὑπερασπιστής «заступник»); 盾[たて] — по корпусу. ἐν καιρῷ θλίψεως — во время скорби."
  40: "βοηθήσει... ῥύσεται... ἐξελεῖται... σώσει — поможет, избавит, изымет, спасёт; все четыре глагола сохранены. ἐξ ἁμαρτωλῶν — от грешников. ὅτι ἤλπισαν ἐπ᾽ αὐτόν — ибо уповали на Него."
