verses:
  1: "イエスは舟[ふね]に乗[の]り、湖[みずうみ]を渡[わた]って自分[じぶん]の町[まち]へ帰[かえ]って行[い]かれた。"
  2: "そこへ人々[ひとびと]が、中風[ちゅうふう]の男[おとこ]を床[とこ]ごとイエスのもとへ運[はこ]んで来[き]た。イエスは彼[かれ]らの信仰[しんこう]をご覧[ごらん]になり、中風[ちゅうふう]の人[ひと]に言[い]われた。「<j>子[こ]よ、安心[あんしん]しなさい。あなたの罪[つみ]は赦[ゆる]された。</j>」"
  3: "すると、律法学者[りっぽうがくしゃ]の中[なか]の何人[なんにん]かが心[こころ]の中[なか]で言[い]った。「この男[おとこ]は神[かみ]を冒涜[ぼうとく]している。」"
  4: "イエスは彼[かれ]らが胸[むね]の内[うち]で何[なに]を考[かんが]えているかを見[み]通[とお]し、言[い]われた。「<j>なぜ、そんな悪[わる]い考[かんが]えを心[こころ]に抱[いだ]くのか。</j>"
  5: "<j>『あなたの罪[つみ]は赦[ゆる]される』と言[い]うのと、『立[た]って歩[ある]き出[だ]せ』と言[い]うのとでは、どちらがたやすいか。</j>"
  6: "<j>だが、あなたがたに分[わ]からせてやろう。人[ひと]の子[こ]は地上[ちじょう]で罪[つみ]を赦[ゆる]す権威[けんい]を持[も]っているのだ。</j>」そして、中風[ちゅうふう]の人[ひと]に向[む]かって言[い]われた。「<j>さあ、床[とこ]を担[かつ]いで家[いえ]へ帰[かえ]りなさい。</j>」"
  7: "男[おとこ]は立[た]ち上[あ]がると、自分[じぶん]の家[いえ]へ向[む]かった。"
  8: "これを見[み]た群衆[ぐんしゅう]は怖[こわ]さに打[う]たれ、これほど大[おお]きな権威[けんい]を人[ひと]に授[さず]けられた神[かみ]をほめたたえた。"
  9: "イエスはそこから通[とお]りかかり、収税所[しゅうぜいしょ]に座[すわ]っているマタイという人[ひと]を見[み]て、言[い]われた。「<j>わたしに従[したが]いなさい。</j>」彼[かれ]は立[た]ち上[あ]がってイエスに従[したが]った。"
  10: "イエスが家[いえ]で食卓[しょくたく]に着[つ]いておられると、そこへ徴税人[ちょうぜいにん]や罪人[ざいにん]が大勢[おおぜい]入[はい]って来[き]て、イエスや弟子[でし]たちと同[おな]じ卓[たく]を囲[かこ]んだ。"
  11: "ファリサイ派[は]の人々[ひとびと]はそれを見[み]ると、弟子[でし]たちにこう問[と]いかけた。「あなたがたの先生[せんせい]は、なぜ徴税人[ちょうぜいにん]や罪人[ざいにん]と食事[しょくじ]を共[とも]にするのか。」"
  12: "イエスはこれを聞[き]くと、言[い]われた。「<j>医者[いしゃ]が要[い]るのは、元気[げんき]な者[もの]ではなく、病[やまい]を患[わずら]う者[もの]である。</j>"
  13: "<j>『わたしが望[のぞ]むのは憐[あわ]れみであって、いけにえではない』。この言葉[ことば]が何[なに]を意味[いみ]するのか、行[い]って学[まな]べ。わたしが来[き]たのは、正[ただ]しい者[もの]を招[まね]くためではなく、罪人[ざいにん]を〔悔[く]い改[あらた]めへ〕招[まね]くためである。</j>」"
  14: "そこへヨハネの弟子[でし]たちが来[き]て、イエスに尋[たず]ねた。「わたしたちもファリサイ派[は]の人々[ひとびと]も、よく断食[だんじつ]をいたしております。それなのに、あなたの弟子[でし]たちはなぜ断食[だんじつ]をなさらないのですか。」"
  15: "イエスは言[い]われた。「<j>花婿[はなむこ]がそばにいる間[あいだ]、婚宴[こんえん]の客[きゃく]が悲[かな]しみに暮[く]れることなどありえようか。だが、花婿[はなむこ]が彼[かれ]らから引[ひ]き離[はな]される日[ひ]は来[く]る。その日[ひ]こそ、彼[かれ]らは断食[だんじつ]する。</j>」"
  16: "「<j>織[お]りたての布[ぬの]を古[ふる]い着物[きもの]の継[つ]ぎにはしない。その継[つ]ぎは着物[きもの]からはがれ、破[やぶ]れはかえって大[おお]きくなるからだ。</j>"
  17: "<j>新[あたら]しいぶどう酒[さけ]を古[ふる]い革袋[かわぶくろ]に注[そそ]ぐ者[もの]はいない。注[そそ]げば革袋[かわぶくろ]が裂[さ]け、ぶどう酒[さけ]はこぼれ、革袋[かわぶくろ]も使[つか]い物[もの]にならなくなる。新[あたら]しいぶどう酒[さけ]は新[あたら]しい革袋[かわぶくろ]に注[そそ]ぐ。そうしてこそ、どちらも無事[ぶじ]に保[たも]たれる。</j>」"
  18: "イエスがまだ話[はな]しておられるうちに、一人[ひとり]の指導者[しどうしゃ]が近[ちか]づき、イエスの足[あし]もとにひざまずいて言[い]った。「娘[むすめ]が今[いま]、息[いき]を引[ひ]き取[と]りました。どうか来[き]て、この子[こ]に手[て]を置[お]いてください。娘[むすめ]は生[い]き返[かえ]るでしょう。」"
  19: "イエスは立[た]ち上[あ]がってその指導者[しどうしゃ]のあとを追[お]い、弟子[でし]たちもそれに従[したが]った。"
  20: "そこへ、十二年間[じゅうにねんかん]も血[ち]の止[と]まらない女[おんな]が後[うし]ろから近[ちか]づき、イエスの着物[きもの]の房[ふさ]に触[ふ]れた。"
  21: "「あの方[かた]の着物[きもの]に触[ふ]れるだけで、自分[じぶん]は癒[いや]される」と、彼女[かのじょ]は信[しん]じていたのである。"
  22: "イエスは振[ふ]り向[む]き、その女[おんな]を見[み]つめて言[い]われた。「<j>娘[むすめ]よ、安心[あんしん]しなさい。あなたの信仰[しんこう]があなたを救[すく]ったのだ。</j>」女[おんな]はその場[ば]で癒[いや]された。"
  23: "イエスが指導者[しどうしゃ]の家[いえ]に着[つ]くと、笛[ふえ]を吹[ふ]く者[もの]たちや、どよめく群衆[ぐんしゅう]の姿[すがた]が目[め]に入[はい]った。"
  24: "こう言[い]われた。「<j>ここから出[で]て行[い]きなさい。この子[こ]は死[し]んだのではない。眠[ねむ]っているだけだ。</j>」人々[ひとびと]はイエスを嘲笑[ちょうしょう]した。"
  25: "群衆[ぐんしゅう]を外[そと]へ出[だ]したあと、イエスは家[いえ]に入[はい]って少女[しょうじょ]の手[て]を握[にぎ]ると、少女[しょうじょ]は身[み]を起[お]こした。"
  26: "この評判[ひょうばん]は、その地方[ちほう]の隅々[すみずみ]まで届[とど]いた。"
  27: "イエスがそこを通[とお]りかかると、二人[ふたり]の盲人[もうじん]が「ダビデの子[こ]よ、わたしたちをお憐[あわ]れみください」と叫[さけ]びながら、後[あと]を追[お]って来[き]た。"
  28: "イエスが家[いえ]に入[はい]ると、盲人[もうじん]たちがそばに寄[よ]って来[き]た。イエスは彼[かれ]らに言[い]われた。「<j>わたしにできると信[しん]じるのか。</j>」二人[ふたり]は言[い]った。「はい、主[しゅ]よ。」"
  29: "イエスは二人[ふたり]の目[め]に触[ふ]れながら、「<j>あなたがたの信[しん]じたとおり、そのとおりにしてやろう。</j>」と言[い]われた。"
  30: "すると、二人[ふたり]の目[め]が見[み]えるようになった。イエスは彼[かれ]らを厳[きび]しく戒[いまし]めて言[い]われた。「<j>このことは、だれにも知[し]らせてはいけない。</j>」"
  31: "ところが、二人[ふたり]は外[そと]へ出[で]るなり、その地方[ちほう]じゅうにイエスの評判[ひょうばん]を言[い]いふらした。"
  32: "二人[ふたり]が去[さ]ったあと、悪霊[あくりょう]に憑[つ]かれて口[くち]が利[き]けない男[おとこ]が、イエスのもとへ連[つ]れて来[こ]られた。"
  33: "悪霊[あくりょう]が追[お]い払[はら]われると、口[くち]の利[き]けなかった男[おとこ]が口[くち]をきいた。群衆[ぐんしゅう]は驚[おどろ]いて、「イスラエルでこれほどのことは、かつて見[み]たことがない」と言[い]った。"
  34: "しかし、ファリサイ派[は]の人々[ひとびと]はこう言[い]った。「あの男[おとこ]が悪霊[あくりょう]を追[お]い出[だ]せるのは、悪霊[あくりょう]の頭[かしら]の力[ちから]があるからだ。」"
  35: "イエスはすべての町[まち]と村[むら]を巡[めぐ]り歩[ある]き、会堂[かいどう]で教[おし]え、御国[みくに]の福音[ふくいん]を告[つ]げ知[し]らせ、あらゆる病[やまい]と弱[よわ]りを癒[いや]された。"
  36: "また、群衆[ぐんしゅう]が羊飼[ひつじか]いのいない羊[ひつじ]のように、疲[つか]れ果[は]てて倒[たお]れ伏[ふ]しているのをご覧[ごらん]になり、深[ふか]い哀[あわ]れみを抱[いだ]かれた。"
  37: "そこで、弟子[でし]たちに言[い]われた。「<j>畑[はたけ]の取[と]り入[い]れは大[おお]いにあるのに、働[はたら]く者[もの]はわずかしかいない。</j>"
  38: "<j>だから、取[と]り入[い]れの主[ぬし]に、その取[と]り入[い]れへ働[はたら]く者[もの]を送[おく]り込[こ]んでくださるよう願[ねが]いなさい。</j>」"

notes:
  2: "παραλυτικός — 中風[ちゅうふう], как в Мк 2:3; в Мф 4:24 в перечне болезней было 麻痺 — там речь о разных больных, здесь тот же рассказ, что в Мк 2."
  13: "В критической базе только ἀλλὰ ἁμαρτωλούς; Церковь (Елизаветинская, jp-joc 悔改めせしめん爲) читает εἰς μετάνοιαν — добавление в 〔悔い改めへ〕."
  16: "ἄγναφος — «небелёная, новая ткань»; передано 織りたての布 (как jp-ni)."
  18: "ἄρχων — просто «начальник»; Матфей, в отличие от Мк 5:22 (会堂長), не уточняет, поэтому 指導者."
  20: "κράσπεδον — кисть/бахрома на краю одежды (евр. цицит); передано 房, как jp-ni. Сноску не ставил."
  32: "κωφός может значить «глухой» и «немой»; здесь немой — после изгнания беса он заговорил, поэтому 口の利けない."
  36: "ἐσκυλμένοι καὶ ἐρριμμένοι — «изнурённые и брошенные/рассеянные»; передано 疲れ果てて倒れ伏している."
