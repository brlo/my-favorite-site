verses:
  0: "指揮者[しきしゃ]のために。イディトゥンのために。アサフの詩[うた]。"
  1: "わたしは声[こえ]を上[あ]げて主[しゅ]に呼[よ]び、声[こえ]を上[あ]げて神[かみ]に呼[よ]んだ。すると、神[かみ]はわたしに耳[みみ]を傾[かたむ]けられた。"
  2: "わたしの苦難[くなん]の日[ひ]に、わたしは神[かみ]を求[もと]めた。夜[よる]、神[かみ]の前[まえ]に手[て]を上[あ]げた。それはむだではなかった。しかし、わたしの魂[たましい]は慰[なぐさ]めを拒[こば]んだ。"
  3: "わたしは神[かみ]を思[おも]い起[おこ]して喜[よろこ]んだ。しかし、思[おも]い巡[めぐ]らすうちに、わたしの霊[れい]は弱[よわ]った。"
  4: "わたしの目[め]は夜[よる]の見張[みは]りより早[はや]く覚[さ]めた。わたしは動揺[どうよう]し、語[かた]ることもできなかった。"
  5: "わたしは古[むかし]の日[ひ]々[び]を考[かんが]え、とこしえの年[とし]々[とし]を思[おも]い起[おこ]し、思[おも]い巡[めぐ]らした。"
  6: "夜[よる]、わたしは心[こころ]と共[とも]に語[かた]り合[あ]い、わたしの霊[れい]は尋[たず]ね求[もと]めた。"
  7: "主[しゅ]はとこしえに退[しりぞ]け、もはや恵[めぐ]みを示[しめ]されないのだろうか。"
  8: "それとも、そのあわれみはとこしえに断[た]たれ、代[よ]々[よ]に及[およ]ばないのだろうか。"
  9: "神[かみ]はあわれむことを忘[わす]れ、怒[いか]りのうちにそのあわれみを閉[と]じ込[こ]められたのだろうか。"
  10: "わたしは言[い]った。「今[いま]、始[はじ]まった。これが至高[しこう]の神[かみ]の右[みぎ]の手[て]の変[か]わりである」と。"
  11: "わたしは主[しゅ]のわざを思[おも]い起[おこ]した。昔[むかし]からのあなたの奇[き]跡[せき]を、わたしは思[おも]い起[おこ]そう。"
  12: "わたしはあなたのすべてのわざを思[おも]い巡[めぐ]らし、あなたのなさったことについて語[かた]り合[あ]う。"
  13: "神[かみ]よ、あなたの道[みち]は聖[せい]なる所[ところ]にある。わたしたちの神[かみ]ほど大[おお]きな神[かみ]が、ほかにあるだろうか。"
  14: "あなたは奇[き]跡[せき]を行[おこな]う神[かみ]であり、諸[しょ]民[みん]の中[なか]にご自分[じぶん]の力[ちから]を示[しめ]された。"
  15: "あなたは御腕[みうで]によってあなたの民[たみ]、ヤコブとヨセフの子[こ]らを贖[あがな]われた。"
  16: "神[かみ]よ、水[みず]はあなたを見[み]、水[みず]はあなたを見[み]て恐[おそ]れた。淵[ふち]も動揺[どうよう]し、"
  17: "大水[おおみず]のとどろきが響[ひび]き渡[わた]った。雲[くも]は声[こえ]を上[あ]げ、あなたの矢[や]は飛[と]び交[か]う。"
  18: "あなたの雷[かみなり]の声[こえ]は車輪[しゃりん]のうちにあり、あなたの稲妻[いなずま]は世界[せかい]を照[て]らした。地[ち]は揺[ゆ]れ動[うご]き、震[ふる]えおののいた。"
  19: "あなたの道[みち]は海[うみ]にあり、あなたの道筋[みちすじ]は大水[おおみず]のうちにあり、あなたの足跡[あしあと]は知[し]られない。"
  20: "あなたはモーセとアロンの手[て]によって、あなたの民[たみ]を羊[ひつじ]の群[む]れのように導[みちび]かれた。"

notes:
  0: "Εἰς τὸ τέλος, ὑπὲρ Ιδιθουν· τῷ Ασαφ ψαλμός — «в конец, об Идифуме, псалом Асафа»; ὑπέρ — «для, по [назначению]» (Идифун — левит-певец). Надписание — стих 0."
  1: "Φωνῇ μου πρὸς κύριον ἐκέκραξα — 声を上げて主に呼んだ (κράζω — «взывать»). φωνῇ μου πρὸς τὸν θεόν — 声を上げて神に. καὶ προσέσχεν μοι — и Он внял мне (προσέχω — «внимать»)."
  2: "ἐν ἡμέρᾳ θλίψεώς μου τὸν θεὸν ἐξεζήτησα — 苦難の日に神を求めた (ἐκζητέω — «искать усердно»). ταῖς χερσίν μου νυκτὸς ἐναντίον αὐτοῦ — 夜、神の前に手を上げて (датив средства). καὶ οὐκ ἠπατήθην — и не обманулся, むだではなかった. ἀπηνήνατο παρακληθῆναι ἡ ψυχή μου — 魂は慰めを拒んだ (παρακαλέω — «утешать»)."
  3: "ἐμνήσθην τοῦ θεοῦ καὶ εὐφράνθην — 神を思い起して喜んだ (εὐφραίνομαι — «радоваться»). ἠδολέσχησα, καὶ ὠλιγοψύχησεν τὸ πνεῦμά μου — 思い巡らすうちに霊は弱った (ἀδολεσχέω — «беседовать, размышлять»; ὀλιγοψυχέω — «падать духом»)."
  4: "προκατελάβοντο φυλακὰς οἱ ὀφθαλμοί μου — 目は夜の見張りより早く覚めた (προκαταλαμβάνω — «предварять»; φυλακή — «стража»). ἐταράχθην καὶ οὐκ ἐλάλησα — 動揺し、語ることもできなかった."
  5: "διελογισάμην ἡμέρας ἀρχαίας — 古の日々を考えた (διαλογίζομαι — «размышлять»). ἔτη αἰώνια ἐμνήσθην καὶ ἐμελέτησα — とこしえの年々を思い起し、思い巡らした."
  6: "νυκτὸς μετὰ τῆς καρδίας μου ἠδολέσχουν — 夜、心と共に語り合った. ἔσκαλλεν τὸ πνεῦμά μου — «дух мой рыл» (σκάλλω — «копать, доискиваться»); 尋ね求めた."
  7: "μὴ εἰς τοὺς αἰῶνας ἀπώσεται κύριος — 主はとこしえに退けるのか. οὐ προσθήσει τοῦ εὐδοκῆσαι ἔτι — не приложит благоволить ещё (εὐδοκέω — «благоволить»); 恵みを示す."
  8: "εἰς τέλος τὸ ἔλεος αὐτοῦ ἀποκόψει — до конца отсечёт милость Свою (ἀποκόπτω — «отсекать»). ἀπὸ γενεᾶς εἰς γενεάν — 代々に."
  9: "ἐπιλήσεται τοῦ οἰκτιρῆσαι ὁ θεός — 神はあわれむことを忘れるのか (οἰκτίρω — «миловать»). συνέξει ἐν τῇ ὀργῇ αὐτοῦ τοὺς οἰκτιρμοὺς αὐτοῦ — 怒りのうちにそのあわれみを閉じ込める (συνέχω — «удерживать, заключать»)."
  10: "καὶ εἶπα· Νῦν ἠρξάμην — わたしは言った、「今、始まった」 (тёмное место, букв. «ныне начал»). αὕτη ἡ ἀλλοίωσις τῆς δεξιᾶς τοῦ ὑψίστου — これが至高の神の右手の変わり (ἀλλοίωσις — «изменение»)."
  11: "ἐμνήσθην τῶν ἔργων κυρίου — 主のわざを思い起した. μνησθήσομαι ἀπὸ τῆς ἀρχῆς τῶν θαυμασίων σου — 昔からのあなたの奇跡を思い起そう."
  12: "μελετήσω ἐν πᾶσιν τοῖς ἔργοις σου — すべてのわざを思い巡らす. ἐν τοῖς ἐπιτηδεύμασίν σου ἀδολεσχήσω — なさったことについて語り合う (ἐπιτήδευμα — «дело, занятие»)."
  13: "ἐν τῷ ἁγίῳ ἡ ὁδός σου — あなたの道は聖なる所にある (ἅγιον — «святое, святыня»). τίς θεὸς μέγας ὡς ὁ θεὸς ἡμῶν — わたしたちの神ほど大きな神がほかにあるか."
  14: "σὺ εἶ ὁ θεὸς ὁ ποιῶν θαυμάσια — あなたは奇跡を行う神. ἐγνώρισας ἐν τοῖς λαοῖς τὴν δύναμίν σου — 諸民の中に力を示した (γνωρίζω — «являть»)."
  15: "ἐλυτρώσω ἐν τῷ βραχίονί σου τὸν λαόν σου — 御腕によって民を贖った (βραχίων — «мышца»). τοὺς υἱοὺς Ιακωβ καὶ Ιωσηφ — ヤコブとヨセフの子ら."
  16: "εἴδοσάν σε ὕδατα... καὶ ἐφοβήθησαν — 水はあなたを見て恐れた; повтор сохранён. ἐταράχθησαν ἄβυσσοι — 淵も動揺した. Часть стиха по делению слав. — в ст. 17."
  17: "Перенесено из ст. 16 (по делению слав.): πλῆθος ἤχους ὑδάτων — множество шума вод; 大水のとどろき. φωνὴν ἔδωκαν αἱ νεφέλαι — 雲は声を上げた (букв. «дали голос»). τὰ βέλη σου διαπορεύονται — あなたの矢は飛び交う."
  18: "φωνὴ τῆς βροντῆς σου ἐν τῷ τροχῷ — 雷の声は車輪のうちに (τροχός — «колесо»). ἔφαναν αἱ ἀστραπαί σου τῇ οἰκουμένῃ — 稲妻は世界を照らした (ἀστραπή — «молния»; οἰκουμένη — «вселенная»). ἐσαλεύθη καὶ ἔντρομος ἐγενήθη ἡ γῆ — 地は揺れ動き、震えおののいた."
  19: "ἐν τῇ θαλάσσῃ ἡ ὁδός σου — あなたの道は海に. αἱ τρίβοι σου ἐν ὕδασι πολλοῖς — 道筋は大水のうちに (τρίβος — «тропа»). τὰ ἴχνη σου οὐ γνωσθήσονται — 足跡は知られない (ἴχνος — «след»)."
  20: "ὡδήγησας ὡς πρόβατα τὸν λαόν σου — 民を羊の群れのように導いた. ἐν χειρὶ Μωυσῆ καὶ Ααρων — モーセとアロンの手によって."
