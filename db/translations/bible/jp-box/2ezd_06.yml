verses:
  1: "ダリウスの治世[ちせい]の第二年[だいにねん]、預言者[よげんしゃ]ハガイと、アドの子[こ]である預言者[よげんしゃ]ザカリヤは、ユダとエルサレムにいるユダヤ人[じん]たちに対して、イスラエルの神[かみ]である主[しゅ]の名[な]によって預言[よげん]した。"
  2: "そのとき、サラティエルの子[こ]ゾロバベルと、ヨセデクの子[こ]イエシュアが立[た]ち上[あ]がり、エルサレムにある主[しゅ]の家[いえ]を建[た]て始[はじ]めた。主[しゅ]の預言者[よげんしゃ]たちが彼[かれ]らとともにいて、彼らを助[たす]けた。"
  3: "そのころ、シリアとフェニキアの知事[ちじ]シシンネス、サトラブザネス、およびその同僚[どうりょう]たちが彼[かれ]らのもとに来[き]て、彼らに言[い]った。"
  4: "「だれの命[めい]じによって、あなたがたはこの家[いえ]とこの屋根[やね]を建[た]て、ほかのすべてを成[な]し遂[と]げているのか。また、これらのことを成し遂げている建[けん]築[ちく]者[しゃ]とは、だれか。」"
  5: "しかし、ユダヤ人[じん]の長老[ちょうろう]たちは、主[しゅ]が捕囚[ほしゅう]の者[もの]たちを顧[かえり]みられたことにより、恵[めぐ]みを受[う]けた。"
  6: "そして、彼[かれ]らについてダリウスに報告[ほうこく]され、返答[へんとう]があるまで、建[けん]設[せつ]は妨[さまた]げられなかった。"
  7: "ダリウスに書き送った手紙[てがみ]の写[うつ]しは、次[つぎ]のとおりである。差出人[さしだしにん]は、シリアとフェニキアの知事[ちじ]シシンネス、サトラブザネス、その同僚[どうりょう]たち、およびシリアとフェニキアにいる太守[たいしゅ]たちである。"
  8: "「ダリウス王[おう]に、あいさつを送[おく]る。すべてのことが、われらが主[しゅ]である王[おう]に知[し]られますように。われらはユダヤの地方[ちほう]に行[い]き、都[みやこ]エルサレムに着[つ]いて、捕囚[ほしゅう]から帰[かえ]ったユダヤ人[じん]の長老[ちょうろう]たちが、エルサレムの都で、主[しゅ]のために、新[あたら]しく大[おお]きな家[いえ]を、貴重[きちょう]な切[き]り石[いし]と、壁[かべ]に据[す]えられた木[き]とによって建[た]てているのを見出[みいだ]した。"
  9: "そして、それらの工事[こうじ]は熱心[ねっしん]に行[おこな]われ、その仕事[しごと]は彼[かれ]らの手[て]のうちで順調[じゅんちょう]に進[すす]み、すべての栄光[えいこう]と入念[にゅうねん]さをもって全[まった]うされていた。"
  10: "そこで、われらはこれらの長老[ちょうろう]たちに、こう尋[たず]ねた。『だれの命[めい]じによって、あなたがたはこの家[いえ]を建[た]て、これらの工事[こうじ]の基[きそ]を据[す]えているのか。』"
  11: "そこでわれらは、あなたに知[し]らせ、あなたに書[か]き送[おく]るために、彼[かれ]らを導[みちび]いている者[もの]たちについて彼らに尋[たず]ね、また、彼らを司[つかさど]る者たちの名[な]の記録[きろく]を彼らに求[もと]めた。"
  12: "彼[かれ]らはわれらに答[こた]えて言[い]った。『われらは、天[てん]と地[ち]を造[つく]られた主[しゅ]のしもべである。"
  13: "この家[いえ]は、多[おお]くの年[とし]の昔[むかし]に、イスラエルの偉大[いだい]で強[つよ]い王[おう]によって建[た]てられ、完成[かんせい]した。"
  14: "しかし、われらの父祖[ふそ]たちが背[そむ]いて、天[てん]におられるイスラエルの主[しゅ]に対して罪[つみ]を犯[おか]したとき、主は彼[かれ]らを、バビロンの王[おう]、カルデア人[じん]の王であるネブカドネツァルの手[て]に渡[わた]された。"
  15: "彼[かれ]はこの家[いえ]を壊[こわ]して焼[や]き、民[たみ]をバビロンへ捕囚[ほしゅう]として連[つ]れて行[い]った。"
  16: "しかし、バビロニアの地[ち]を治[おさ]めていたクロスの第一年[だいいちねん]に、クロス王[おう]はこの家[いえ]を建[た]てるように書[か]き定[さだ]めた。"
  17: "また、ネブカドネツァルがエルサレムの家[いえ]から持[も]ち出[だ]して自分[じぶん]の神殿[しんでん]に据[す]えた、金[きん]と銀[ぎん]の聖[せい]なる器[うつわ]を、クロス王[おう]はバビロンの神殿から再[ふたた]び持ち出し、ゾロバベルと知事[ちじ]サナバサルに渡[わた]した。"
  18: "そして彼[かれ]には、これらの器[うつわ]をすべて運[はこ]んでエルサレムの神殿[しんでん]に納[おさ]め、主[しゅ]のこの神殿をその場所[ばしょ]に建[た]てるように命[めい]じられた。"
  19: "そこで、かのサナバサルが来[き]て、エルサレムにある主[しゅ]の家[いえ]の礎[いしずえ]を据[す]えた。そして、そのときから今[いま]に至[いた]るまで建[た]てられてきたが、まだ完成[かんせい]を迎[むか]えていない。』"
  20: "それゆえ今[いま]、王[おう]よ、もしよろしければ、バビロンにあるクロス王[おう]の書庫[しょこ]をお調[しら]べください。"
  21: "そして、もしエルサレムにある主[しゅ]の家[いえ]の建[けん]設[せつ]がクロス王[おう]の意向[いこう]によって行[おこな]われたことが見出[みいだ]され、われらが主[しゅ]である王[おう]にもよしと認[みと]められるなら、このことについてわれらに返答[へんとう]をお与[あた]えください。」"
  22: "そこで、ダリウス王[おう]は、バビロンに置[お]かれている王[おう]の書庫[しょこ]を調[しら]べるように命[めい]じた。すると、メディアの地方[ちほう]にあるエクバタナの城[しろ]で、一[ひと]つの巻物[まきもの]が見[み]つかり、そこには次[つぎ]のように記[しる]されていた。"
  23: "「クロスの治世[ちせい]の第一年[だいいちねん]に、クロス王[おう]は、エルサレムにある主[しゅ]の家[いえ]を建[た]てるように命[めい]じた。それは、絶[た]えず火[ひ]によって犠牲[ぎせい]をささげる場所[ばしょ]である。"
  24: "その高[たか]さは六十[ろくじゅう]キュビト、その幅[はば]も六十[ろくじゅう]キュビトとし、切[き]り石[いし]の段[だん]を三[みっ]つ、その地[ち]の新[あたら]しい木[き]の段を一[ひと]つとし、その費用[ひよう]はクロス王[おう]の家[いえ]から出[だ]すように。"
  25: "また、ネブカドネツァルがエルサレムの家[いえ]から持[も]ち出[だ]してバビロンへ運[はこ]んだ、主[しゅ]の家[いえ]の聖[せい]なる器[うつわ]、すなわち金[きん]と銀[ぎん]の器は、もと置[お]かれていたエルサレムの家に返[かえ]し、そこに置[お]くように。"
  26: "また、シリアとフェニキアの知事[ちじ]シシンネス、サトラブザネス、その同僚[どうりょう]たち、およびシリアとフェニキアに任[にん]ぜられた太守[たいしゅ]たちに、その場所[ばしょ]から手[て]を引[ひ]き、主[しゅ]のしもべであるゾロバベル、すなわちユダヤの知事[ちじ]と、ユダヤ人[じん]の長老[ちょうろう]たちが、その場所で主[しゅ]のあの家[いえ]を建[た]てるのを妨[さまた]げないように命[めい]じた。"
  27: "また、わたしは、これを完全[かんぜん]に建[た]て上[あ]げ、ユダヤの捕囚[ほしゅう]から来[き]た者[もの]たちが主[しゅ]の家[いえ]の完成[かんせい]まで互[たが]いに力[ちから]を合[あ]わせるよう、怠[おこた]らず見守[みまも]ることを命[めい]じた。"
  28: "また、コイレ・シリアとフェニキアの貢[みつ]ぎ物[もの]から、この人[ひと]々[びと]、すなわちゾロバベル知事[ちじ]に、主[しゅ]への犠牲[ぎせい]のため、雄牛[おうし]、雄羊[おひつじ]、子羊[こひつじ]のために、定[さだ]められた分[ぶん]を怠[おこた]りなく与[あた]えるように。"
  29: "同様[どうよう]に、小麦[こむぎ]、塩[しお]、ぶどう酒[しゅ]、油[あぶら]も、年[とし]ごとに絶[た]えず、エルサレムにいる祭司[さいし]たちが告[つ]げるままに、毎日[まいにち]疑[うたが]いなく費[つい]やされるように。"
  30: "それは、王[おう]とその子[こ]らたちのために、注[そそ]ぎ物[もの]が最[さい]高[こう]の神[かみ]にささげられ、彼[かれ]らの命[いのち]のために祈[いの]るためである。"
  31: "また、先[さき]に述[の]べられたこと、また書き加[くわ]えられたことのうち、何[なに]かを破[やぶ]り、あるいは無効[むこう]にする者[もの]があれば、その者[もの]の持[も]ち物[もの]から木[き]を取[と]ってその木に吊[つ]るし、その財産[ざいさん]は王[おう]のものとするように命[めい]じた。"
  32: "それゆえ、その名[な]がそこで呼[よ]ばれている主[しゅ]は、エルサレムにあるあの主[しゅ]の家[いえ]を妨[さまた]げ、あるいは損[そこ]なおうとして手[て]を伸[の]べるすべての王[おう]と国民[こくみん]を滅[ほろ]ぼされるように。"
  33: "わたし、ダリウス王[おう]は、これらのことが怠[おこた]りなく行[おこな]われることを定[さだ]めた。」"

notes:
  1: "ἐν τῷ δευτέρῳ ἔτει τῆς τοῦ Δαρείου βασιλείας — во второй год царства Дария (Δαρεῖος, ダリウス). ἐπροφήτευσεν Αγγαιος καὶ Ζαχαριας ὁ τοῦ Εδδι οἱ προφῆται — пророчествовали Аггей и Захария, сын Едди (Αγγαιος — ハガイ, как в Ездре 5:1 и 6:14; Εδδι — то же лицо, что Αδδω в Ездре, слав. «аддов», поэтому アド). ἐπὶ τοὺς Ιουδαίους … ἐπὶ τῷ ὀνόματι κυρίου θεοῦ Ισραηλ ἐπ᾿ αὐτούς — на иудеев… именем Господа Бога Израилева, на них: конечное ἐπί отдельно не передано."
  2: "τότε στὰς Ζοροβαβελ ὁ τοῦ Σαλαθιηλ — тогда, встав, Зоровавель, сын Салафииля (Ζοροβαβελ — ゾロバベル, греческая форма; в Ездре и Неемии — ゼルバベル). Ἰησοῦς ὁ τοῦ Ιωσεδεκ — Иисус, сын Иоседека (イエシュア; первосвященник, не ヨシュア). ἤρξαντο οἰκοδομεῖν — начали строить. συνόντων τῶν προφητῶν τοῦ κυρίου βοηθούντων αὐτοῖς — при присутствующих пророках Господних, помогающих им (σύνειμι, βοηθέω)."
  3: "ἐν αὐτῷ τῷ χρόνῳ παρῆν πρὸς αὐτούς — в то самое время пришёл к ним (πάρειμι). Σισίννης ὁ ἔπαρχος Συρίας καὶ Φοινίκης — Сисинни, начальник Сирии и Финикии (ἔπαρχος, 知事; слав. «воевода»). Σαθραβουζάνης — Сатрабузан (サトラブザネス; слав. «сафравузан»). οἱ συνέταιροι — товарищи, сослуживцы (συνέταιρος, 同僚)."
  4: "Τίνος ὑμῖν συντάξαντος — кто вам повелел (συντάσσω), родительный абсолютный. στέγη — кров, крыша (στέγη); слав. «кров сей». οἱ οἰκοδόμοι — строители (οἰκοδόμος). Вопрос дан прямой речью, поэтому 「…」."
  5: "ἔσχοσαν χάριν ἐπισκοπῆς γενομένης ἐπὶ τὴν αἰχμαλωσίαν παρὰ τοῦ κυρίου — «обрели благодать посещения, бывшего над пленением от Господа» (ἐπισκοπή — посещение, ср. Лк 19:44; слав. «имеша благодать посещения»). οἱ πρεσβύτεροι τῶν Ιουδαίων — старейшины Иудейские (長老), они и подлежащее."
  6: "οὐκ ἐκωλύθησαν τῆς οἰκοδομῆς — не были удержаны от стройки (κωλύω, пассив). μέχρι τοῦ ὑποσημανθῆναι Δαρείῳ περὶ αὐτῶν — до того, как о них было доложено Дарию (ὑποσημαίνω — подавать знак, доносить). προσφωνηθῆναι — и дан ответ (προσφωνέω; слав. «отвещано будет»)."
  7: "Ἀντίγραφον ἐπιστολῆς — список, копия письма (ἀντίγραφον). ἧς ἔγραψεν Δαρείῳ καὶ ἀπέστειλεν — которое написал Дарию и послал; далее перечислены отправители. οἱ ἐν Συρίᾳ καὶ Φοινίκῃ ἡγεμόνες — начальники в Сирии и Финикии (ἡγεμών, 太守; слав. «воеводы»). Приветствие χαίρειν csl относит к этому стиху («царю дарию радоватися»), LXX — к началу ст. 8; текст тот же, деление держим по LXX."
  8: "Βασιλεῖ Δαρείῳ χαίρειν — царю Дарию радоваться: обычная формула приветствия в письме. πάντα γνωστὰ ἔστω τῷ κυρίῳ ἡμῶν τῷ βασιλεῖ — всё да будет известно господину нашему царю (γνωστός). κατελάβομεν τῆς αἰχμαλωσίας τοὺς πρεσβυτέρους — «застали старейшин из плена» (καταλαμβάνω). οἶκον μέγαν καινὸν διὰ λίθων ξυστῶν — дом большой, новый, из тёсаных камней (ξυστός), πολυτελῶν ξύλων τιθεμένων ἐν τοῖς τοίχοις — дорогого дерева, полагаемого в стенах. Слав. здесь дробит стих: csl 6:8 кончается на «драгих», csl 6:9 — «полагающе древа в стенах»."
  9: "τὰ ἔργα ἐκεῖνα ἐπὶ σπουδῆς γιγνόμενα — те работы с усердием производятся (σπουδή). εὐοδούμενον τὸ ἔργον ἐν ταῖς χερσὶν αὐτῶν — дело успешно идёт в руках их (εὐοδόω). ἐν πάσῃ δόξῃ καὶ ἐπιμελείᾳ συντελούμενα — совершается со всякой славой и тщанием (δόξα, ἐπιμέλεια). Стих продолжает причастный оборот ст. 8."
  10: "ἐπυνθανόμεθα τῶν πρεσβυτέρων — мы спрашивали старейшин (πυνθάνομαι). Τίνος ὑμῖν προστάξαντος — по чьему приказу (προστάσσω). θεμελιοῦτε — «полагаете основание» (θεμελιόω, от θεμέλιος; слав. «основаете»). Вопрос повторяет ст. 4, но уже внутри письма, поэтому 『…』."
  11: "ἐπηρωτήσαμεν … εἵνεκεν τοῦ γνωρίσαι σοι — спросили, чтобы известить тебе (γνωρίζω). τοὺς ἀνθρώπους τοὺς ἀφηγουμένους — людей, которые предводительствуют (ἀφηγέομαι). ὀνοματογραφία — именная запись, список имён (ὀνοματογραφία, гапакс). τῶν προκαθηγουμένων — стоящих во главе (προκαθηγέομαι)."
  12: "ἀπεκρίθησαν ἡμῖν λέγοντες — ответили нам, говоря; отсюда до ст. 19 — прямая речь старейшин внутри письма, 『…』. παῖδες τοῦ κυρίου — рабы, слуги Господа (παῖς; слав. «раби»). τοῦ κτίσαντος τὸν οὐρανὸν καὶ τὴν γῆν — создавшего небо и землю (κτίζω)."
  13: "ᾠκοδόμητο ὁ οἶκος — дом был построен (плюсквамперфект от οἰκοδομέω). ἔμπροσθεν ἐτῶν πλειόνων — «прежде многих лет», за много лет до сего (ἔμπροσθεν с род.). διὰ βασιλέως τοῦ Ισραηλ μεγάλου καὶ ἰσχυροῦ — через царя Израильского, великого и сильного. ἐπετελέσθη — был завершён (ἐπιτελέω)."
  14: "ἐπεὶ οἱ πατέρες ἡμῶν παραπικράναντες ἥμαρτον — когда отцы наши, прогневав, согрешили (παραπικραίνω — горько огорчать). εἰς τὸν κύριον τοῦ Ισραηλ τὸν οὐράνιον — против Господа Израилева, небесного. παρέδωκεν αὐτοὺς εἰς χεῖρας Ναβουχοδονοσορ — предал их в руки Навуходоносора (ネブカドネツァル), βασιλέως τῶν Χαλδαίων — царя Халдеев (カルデア人)."
  15: "τὸν οἶκον καθελόντες ἐνεπύρισαν — разрушив дом, сожгли (καθαιρέω, ἐμπυρίζω). τὸν λαὸν ᾐχμαλώτευσαν εἰς Βαβυλῶνα — народ увели в плен в Вавилон (αἰχμαλωτεύω). Подлежащее — Навуходоносор, названный в ст. 14."
  16: "ἐν δὲ τῷ πρώτῳ ἔτει βασιλεύοντος Κύρου χώρας Βαβυλωνίας — в первый год, когда Кир царствовал над страной Вавилонской (Κῦρος, クロス). ἔγραψεν ὁ βασιλεὺς Κῦρος οἰκοδομῆσαι — царь Кир написал, чтобы построить (γράφω в значении «предписать»; слав. «писа… созидати»)."
  17: "τὰ ἱερὰ σκεύη τὰ χρυσᾶ καὶ τὰ ἀργυρᾶ — священные сосуды, золотые и серебряные. ἃ ἐξήνεγκεν Ναβουχοδονοσορ … καὶ ἀπηρείσατο αὐτὰ ἐν τῷ ἑαυτοῦ ναῷ — которые вынес Навуходоносор и поставил в своём храме (ἀπερείδω — водружать; ναός — 神殿). παρεδόθη Ζοροβαβελ καὶ Σαναβασσάρῳ τῷ ἐπάρχῳ — были переданы Зоровавелю и Санабассару-начальнику (サナバサル; в Ездре — ササバサル)."
  18: "ἐπετάγη αὐτῷ — ему было повелено (ἐπιτάσσω, пассив). ἀπενέγκαντι πάντα τὰ σκεύη ταῦτα ἀποθεῖναι — отнеся все эти сосуды, положить (ἀποφέρω, ἀποτίθημι). τὸν ναὸν … οἰκοδομηθῆναι ἐπὶ τοῦ τόπου — и храм построить на месте его (ἐπί с род. — «на»)."
  19: "ὁ Σαναβάσσαρος ἐκεῖνος — тот Санабассар (ἐκεῖνος — указательное). ἐνεβάλετο τοὺς θεμελίους — положил основания (ἐμβάλλω, θεμέλιος). ἀπ᾽ ἐκείνου μέχρι τοῦ νῦν οἰκοδομούμενος — с тех пор доныне строящийся. οὐκ ἔλαβεν συντέλειαν — не получил завершения (συντέλεια; слав. «не прия совершения»). Здесь закрывается речь старейшин."
  20: "νῦν οὖν, εἰ κρίνεται, βασιλεῦ — итак, если угодно, царь (κρίνω — «признавать, находить»). ἐπισκεπήτω ἐν τοῖς βασιλικοῖς βιβλιοφυλακίοις — пусть будет осмотрено в царских книгохранилищах (ἐπισκέπτομαι, βιβλιοφυλάκιον). Слав. добавляет «кировых» — «в царских книгохранилницах кировых»; в LXX имени нет: τοῦ κυρίου βασιλέως — «господина царя»."
  21: "καὶ ἐὰν εὑρίσκηται μετὰ τῆς γνώμης Κύρου … γενομένην τὴν οἰκοδομήν — и если найдётся, что стройка шла по воле Кира (γνώμη — решение, воля). κρίνηται τῷ κυρίῳ βασιλεῖ ἡμῶν — и будет признано господином нашим царём. προσφωνησάτω ἡμῖν — пусть будет возвещено нам (προσφωνέω)."
  22: "προσέταξεν ἐπισκέψασθαι — повелел осмотреть (ἐπισκέπτομαι). ἐν Ἐκβατάνοις τῇ βάρει τῇ ἐν Μηδίᾳ χώρᾳ — в Екбатанах, крепости в области Мидийской (βάρις — крепость; エクバタナ, как в Иудифи 1:2). τόμος εἷς — одна книга, свиток (τόμος). ὑπεμνημάτιστο τάδε — было записано так (ὑπομιμνῄσκω — вносить в памятную запись)."
  23: "Ἔτους πρώτου βασιλεύοντος Κύρου — «года первого царствования Кира»: родительный времени без сказуемого (ср. Иудифь 1:1). ὅπου ἐπιθύουσιν διὰ πυρὸς ἐνδελεχοῦς — где приносят жертвы при непрестанном огне (ἐπιθύω, ἐνδελεχής — непрерывный; слав. «идеже жряху огнем непрестанным»). С этого стиха идёт цитата найденной записи, введённая в ст. 22 («ὑπεμνημάτιστο τάδε»)."
  24: "οὗ τὸ ὕψος πήχεων ἑξήκοντα — высота его шестьдесят локтей (πῆχυς — キュビト). διὰ δόμων λιθίνων ξυστῶν τριῶν — «через три ряда тёсаных камней» (δόμος — ряд кладки, ср. 3 Цар 6:36; слав. «с домами каменей тесаных треми»). δόμου ξυλίνου ἐγχωρίου καινοῦ ἑνός — одного ряда дерева местного, нового (ἐγχώριος). τὸ δαπάνημα — издержки (δαπάνημα)."
  25: "ἀποκατασταθῆναι εἰς τὸν οἶκον … ὅπως τεθῇ ἐκεῖ — быть возвращёнными в дом … чтобы быть поставленными там (ἀποκαθίστημι, τίθημι). οὗ ἦν κείμενα — где они лежали (κεῖμαι). τὰ ἱερὰ σκεύη … τά τε χρυσᾶ καὶ τὰ ἀργυρᾶ — священные сосуды, золотые и серебряные."
  26: "προσέταξεν δὲ ἐπιμεληθῆναι Σισίννῃ … — повелел позаботиться Сисинни (ἐπιμελέομαι). ἀπέχεσθαι τοῦ τόπου — держаться в стороне от места (ἀπέχω). ἐᾶσαι δὲ τὸν παῖδα τοῦ κυρίου Ζοροβαβελ — и оставить раба Господня Зоровавеля (ἐάω). ἔπαρχον δὲ τῆς Ιουδαίας — начальника Иудеи (知事). ἡγεμόσιν — начальникам (太守)."
  27: "κἀγὼ δὲ ἐπέταξα — и я повелел (κρασις ἐγώ); первое лицо в указе, как и в ст. 33. ὁλοσχερῶς οἰκοδομῆσαι — построить всецело (ὁλοσχερής). ἀτενίσαι — неуклонно смотреть, наблюдать (ἀτενίζω). ἵνα συμποιῶσιν — чтобы содействовали (συμποιέω, гапакс). μέχρι τοῦ ἐπιτελεσθῆναι — до завершения (ἐπιτελέω)."
  28: "ἀπὸ τῆς φορολογίας — из подати, налога (φορολογία; слав. «от дани»). Κοίλης Συρίας — Келе-Сирии («полой Сирии», コイレ・シリア). σύνταξις — установленное содержание, сумма (σύνταξις; слав. «собрание»). εἰς θυσίας τῷ κυρίῳ, Ζοροβαβελ ἐπάρχῳ — на жертвы Господу, Зоровавелю-начальнику: дательный адресата. ταῦροι, κριοί, ἄρνοι — тельцы, овны, агнцы."
  29: "πυρός, ἅλας, οἶνος, ἔλαιον — пшеница, соль, вино, елей. ἐνδελεχῶς κατ᾽ ἐνιαυτόν — постоянно, каждый год (ἐνιαυτός). καθὼς ἂν οἱ ἱερεῖς … ὑπαγορεύσωσιν — как предпишут священники (ὑπαγορεύω). ἀναλίσκεσθαι καθ᾽ ἡμέραν — издерживать на каждый день (ἀναλίσκω). ἀναμφισβητήτως — беспрекословно (ἀναμφισβήτητος)."
  30: "σπονδαί — возлияния, жертвенные излияния (σπονδή, 注ぎ物; слав. «возлияния»). τῷ θεῷ τῷ ὑψίστῳ — Всевышнему Богу. ὑπὲρ τοῦ βασιλέως καὶ τῶν παίδων — за царя и детей его (παῖς). προσεύχωνται περὶ τῆς αὐτῶν ζωῆς — и молились о жизни их."
  31: "ὅσοι ἐὰν παραβῶσίν τι τῶν προειρημένων — все, кто преступит что-нибудь из сказанного прежде (παραβαίνω, προεῖπον). τῶν προσγεγραμμένων — и приписанного (προσγράφω). ἀκυρώσωσιν — или отменит (ἀκυρόω). λημφθῆναι ξύλον ἐκ τῶν ἰδίων αὐτοῦ — взять дерево из его собственного (имущества); ἐπὶ τούτου κρεμασθῆναι — и повесить на нём (κρεμάννυμι). τὰ ὑπάρχοντα αὐτοῦ εἶναι βασιλικά — имущество его да будет царским (ὑπάρχοντα). Слав. начинает стих «и да возвестится» — вместо «и повелел» LXX (καὶ προσέταξεν), принято csl."
  32: "ὁ κύριος, οὗ τὸ ὄνομα αὐτοῦ ἐπικέκληται ἐκεῖ — Господь, чьё имя наречено (призвано) там (ἐπικαλέω, перфект). ἀφανίσαι — да истребит (ἀφανίζω, оптатив пожелания). ὃς ἐκτενεῖ τὴν χεῖρα — кто прострет руку (ἐκτείνω). κωλῦσαι ἢ κακοποιῆσαι τὸν οἶκον — воспрепятствовать или сделать зло дому (κωλύω, κακοποιέω)."
  33: "δεδογμάτικα — перфект от δογματίζω, «я постановил, определил» (слав. «повелех»). ἐπιμελῶς κατὰ ταῦτα γίγνεσθαι — чтобы это тщательно исполнялось (ἐπιμελῶς). Заключительная формула указа; ср. Езд 6:12."
