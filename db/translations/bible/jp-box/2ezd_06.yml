# jp-box, 2-я Ездры, глава 6. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для книги нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 6: пророчество Аггея и Захарии и начало стройки (1–2), вопрос Сисинни и
# Сатрабузана (3–4), старейшины и отсрочка до ответа Дария (5–6), их письмо Дарию
# (7–21), поиск в книгохранилищах и запись, найденная в Екбатанах (22), указ о храме
# (23–33).
# Речь: письмо — 「…」 (8–21); вопрос старейшин 『…』 (10) и их ответ 『…』 (12–19)
# внутри письма; указ — 「…」 (23–33). Красного и синего нет.
# Нумерация по gr: 33 стиха. Слав. дробит гр. 6:8 на два стиха (csl 6:8 «вся знаема…»
# и csl 6:9 «созидающих дом Господу…»), поэтому с csl 6:10 идёт сдвиг +1 (csl 6:10 =
# гр. 6:9 … csl 6:34 = гр. 6:33); держимся gr. Приветствие «радоватися» csl относит
# к 6:7, LXX — к началу 6:8 (текст тот же).
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz. Слав. добавление «кировых» (6:20)
# внесено в текст без скобок (クロスの); в 6:31 «да возвестится» стоит вместо «повелел»
# LXX (καὶ προσέταξεν) — принято csl.
# Сносок ⟨…⟩ нет: 神殿, 祭壇, 祭司, レビ人, 過越, 種なしパン, 太守, 知事, 書庫 уже в корпусе.
# Имена — транслитерация греческого (LXX): ハガイ (как в Ездре 5:1 и 6:14), ザカリヤ,
# シシンネス, サトラブザネス, ゾロバベル, サラティエル, ヨセデク, イエシュア, サナバサル.

