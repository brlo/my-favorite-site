# jp-box, Исаия, глава 45. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для гл. 45 есть фрагментом, но выгрузки
# по этой главе не делалось, в работе он не использовался; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 45: 1–8 помазанник Кир: двери отворяются, сокровища тьмы, «Я — Господь, и нет
# иного», свет и тьма, правда, прорастающая из земли; 9–10 глина и горшечник (в LXX —
# не «горе», а вопрос); 11–13 сыны и дело рук Моих, Кир — строитель города; 14–17
# Египет и Ефиопия приходят, «в тебе Бог», Израиль спасается вечно; 18–25 «Я — Господь,
# и нет иного», «обратитесь ко Мне и спасётесь, все концы земли», клятва и поклонение.
# Речи: слова Господа — 「…」 (1–10; 11–13; 14–17; 18–25). Внутри них чужие слова —
# в 『…』 (9; 10; 14–15; 21; 23; 24). Вводные формулы (1; 11; 14; 18) — вне кавычек;
# закрывающая формула 45:13 «сказал Господь Саваоф» — тоже вне кавычек.
# Нумерация по gr: 25 стихов; у csl и ru тоже 25. Внутри главы слав. делит иначе:
#   • 45:4/5 — gr кончает 4 словами σὺ δὲ οὐκ ἔγνως με («но ты не знал Меня»), слав.
#     переносит их в начало 5 («ты же не познал еси мене») и удваивает в конце 5;
#     держим слав. (notes 4–5).
# Паритет: слав. добавления внесены без 〔…〕 — 45:5 «укрепих тя» (нет в LXX, слав.
# идёт за МТ «препоясал тебя»); 45:5 «Бог твой» (в LXX просто «Господь Бог»).
# 45:9–10: LXX не даёт «горе тому, кто препирается с Создателем» (это МТ и ru) —
# в LXX вопрос о глине и горшечнике; держим LXX (notes 9).
# 〔…〕 нет; сносок ⟨…⟩ нет: 陶工, 粘土, 義, 救い主, 万軍 уже в корпусе или пояснены
# в notes (セボイン).
# Имена — транслитерация греческого (LXX): クロス, ヤコブ, イスラエル, エジプト,
# エチオピア, セボイン, シオン.

