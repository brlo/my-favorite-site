verses:
  1: "主[しゅ]である神[かみ]は、ご自分[じぶん]の油[あぶら]を注[そそ]がれた者[もの]、クロスにこう言[い]われる。「わたしはあなたの右[みぎ]の手[て]を握[にぎ]った。あなたの前[まえ]で諸国[しょこく]の民[たみ]が聞[き]き従[したが]うためである。わたしは王[おう]たちの力[ちから]を砕[くだ]き、あなたの前[まえ]に扉[とびら]を開[ひら]く。町[まち]々[まち]は閉[と]ざされない。"
  2: "わたしはあなたの前[まえ]を歩[あゆ]み、山[やま]を平[たい]らかにし、青銅[せいどう]の扉[とびら]を砕[くだ]き、鉄[てつ]のかんぬきを折[お]る。"
  3: "わたしはあなたに闇[やみ]の宝[たから]を、隠[かく]された見[み]えざる宝を開[ひら]いて与[あた]える。あなたの名[な]を呼[よ]ぶわたしが、あなたの主[しゅ]である神[かみ]、イスラエルの神[かみ]であることを知[し]るためである。"
  4: "わたしのしもべヤコブのため、わたしが選[えら]んだイスラエルのため、わたしはあなたの名[な]を呼[よ]び、あなたを受[う]け入[い]れる。"
  5: "あなたはわたしを知[し]らなかった。わたしが主[しゅ]である神[かみ]であり、わたしのほかに神[かみ]はない。わたしはあなたを強[つよ]くしたが、あなたはわたしを知らなかった。"
  6: "日[ひ]の昇[のぼ]る所[ところ]から沈[しず]む所[ところ]まで、わたしのほかに何[なに]もないことを知[し]るためである。わたしは主[しゅ]である神[かみ]、ほかにはいない。"
  7: "わたしは光[ひかり]を造[つく]り、闇[やみ]を造[つく]る。わたしは平和[へいわ]を造[つく]り、災[わざわ]いを造[つく]る。わたしは主[しゅ]である神[かみ]、これらすべてを行[おこな]う者[もの]である。"
  8: "天[てん]は上[うえ]から喜[よろこ]べ。雲[くも]は義[ぎ]を降[ふ]らせ。地[ち]は開[ひら]いて救[すく]いを芽生[めば]えさせ、義をもともに芽生えさせよ。わたしが主[しゅ]、あなたを造[つく]った者[もの]である。"
  9: "わたしは陶工[とうこう]の粘土[ねんど]のように、何[なに]か良[よ]いものを造[つく]っただろうか。耕[たがや]す者[もの]は一日中[いちにちじゅう]、地[ち]を耕し続[つづ]けるのか。粘土は陶工に『何[なに]をしているのか。あなたは働[はたら]かず、手[て]もないではないか』と言[い]うのか。"
  10: "父[ちち]に『何[なに]を産[う]むのか』と言[い]い、母[はは]に『何[なに]を産[う]みの苦[くる]しみに苦しむのか』と言[い]う者[もの]が、あるだろうか。」"
  11: "主[しゅ]である神[かみ]、イスラエルの聖[せい]なる方[かた]、来[きた]るべきことを造[つく]った方[かた]はこう言[い]われる。「わたしの子[こ]ら、わたしの娘[むすめ]たち、わたしの手[て]のわざについて、わたしに尋[たず]ねよ。わたしに命[めい]じよ。"
  12: "わたしは地[ち]を造[つく]り、その上[うえ]に人[ひと]を造った。わたしはこの手[て]で天[てん]を固[かた]くし、すべての星[ほし]に命[めい]じた。"
  13: "わたしは彼を義[ぎ]をもって王[おう]として起[お]こし、その道[みち]をすべてまっすぐにした。彼はわたしの都[みやこ]を建[た]て、わたしの民[たみ]の捕[と]らわれ人[びと]を、代価[だいたい]も贈[おく]り物[もの]もなく帰[かえ]す」と、万軍[ばんぐん]の主[しゅ]は言[い]われた。"
  14: "万軍[ばんぐん]の主[しゅ]はこう言[い]われる。「エジプトは労[ろう]し、エチオピアの商[あきな]いも、セボインの背[せ]の高[たか]い人[ひと]たちも、あなたのところへ渡[わた]って来[き]て、あなたのものとなり、あなたに従[したが]う。彼らは鎖[くさり]につながれて来[き]て、あなたの前[まえ]にひれ伏[ふ]し、あなたに祈[いの]る。『あなたのうちに神[かみ]がおられる。あなたのほかに神[かみ]はない。"
  15: "あなたは神[かみ]であり、わたしたちは知[し]らなかった。イスラエルの神[かみ]、救[すく]い主[ぬし]よ。』"
  16: "彼に逆[さか]らう者[もの]は、みな恥[は]じ、辱[はずかし]められ、恥のうちを歩[あゆ]む。島々[しまじま]よ、わたしのもとで新[あら]たになれ。"
  17: "イスラエルは主[しゅ]によって永遠[えいえん]の救[すく]いで救[すく]われる。あなたがたは世々[よよ]に至[いた]るまで、恥[は]じることも、辱[はずかし]められることもない。」"
  18: "天[てん]を造[つく]った主[しゅ]はこう言[い]われる。「この神[かみ]は地[ち]を示[しめ]してこれを造[つく]り、これを区切[くぎ]って定[さだ]め、むなしく造[つく]らず、住[す]むために造[つく]った。わたしがいる。ほかにはいない。"
  19: "わたしは隠[かく]れた所[ところ]で語[かた]ったのではない。地[ち]の暗[くら]い所[ところ]でもない。わたしはヤコブの子孫[しそん]に、むなしいものを求[もと]めよとは言[い]わなかった。わたし、わたしこそ主[しゅ]、義[ぎ]を語[かた]り、真理[しんり]を告[つ]げる者[もの]である。"
  20: "集[あつ]まれ、来[こ]い。ともに語[かた]り合[あ]え、諸国[しょこく]の民[たみ]から救[すく]われた者[もの]たちよ。木[き]の刻[きざ]み物[もの]を持[も]ち上[あ]げ、救[すく]わない神[かみ]々[がみ]に祈[いの]る者[もの]たちは、わかっていない。"
  21: "もし彼らが告[つ]げるなら、近[ちか]づかせよ。ともに知[し]るためである。初[はじ]めから、これらの聞[き]こえることを行[おこな]ったのはだれか。そのとき、あなたがたに告[つ]げられた。『わたしが神[かみ]であり、わたしのほかにほかはない。正[ただ]しい者[もの]、救[すく]い主[ぬし]は、わたしのほかにいない』と。"
  22: "わたしのもとへ帰[かえ]れ。そうすれば、あなたがたは救[すく]われる。地[ち]の果[は]てのすべての者[もの]たちよ。わたしが神[かみ]であり、ほかに神[かみ]はいないからである。"
  23: "わたしは自分[じぶん]にかけて誓[ちか]う。義[ぎ]はわたしの口[くち]から出[で]て、わたしの言葉[ことば]は戻[もど]らない。『すべての膝[ひざ]はわたしに屈[かが]み、すべての舌[した]は神[かみ]をほめたたえる』と。"
  24: "『義[ぎ]と栄光[えいこう]はその方[かた]のもとへ来[く]る』と言[い]い、自分[じぶん]を分[わ]け離[はな]す者[もの]は、みな恥[は]じる。"
  25: "イスラエルの子[こ]らすべての種[しゅ]は、主[しゅ]によって正[ただ]しいと認[みと]められ、神[かみ]にあって栄光[えいこう]を受[う]ける。」"

notes:
  1: "τῷ χριστῷ μου Κύρῳ — «помазанному моему Киру»: χριστός здесь титул («помазанник»), а не имя; передано 油を注がれた者, потому что речь о Кире (ср. конвенцию χριστος — 油を注がれた者). οὗ ἐκράτησα τῆς δεξιᾶς — «егоже удержах за десницу»; ἐπακοῦσαι ἔμπροσθεν αὐτοῦ ἔθνη — «повинути пред ним языки» (ἐπακούω — внимать, слушаться); ἰσχὺν βασιλέων διαρρήξω — «крепость царей разрушу» (διαρρήγνυμι — разрывать); πόλεις οὐ συγκλεισθήσονται — «гради не затворятся». В гр. внутри придаточного стоит αὐτοῦ (о Кире в 3-м лице), затем 1-е лицо; в японском обращение к Киру выдержано во 2-м лице."
  2: "Ἐγὼ ἔμπροσθέν σου πορεύσομαι — «Аз пред тобою пойду»; ὄρη ὁμαλιῶ — «горы уравню» (ὁμαλίζω — выравнивать); θύρας χαλκᾶς συντρίψω — «врата медяная сокрушу» (χαλκοῦς — медный, 青銅); μοχλοὺς σιδηροῦς συγκλάσω — «вереи железныя сломлю» (μοχλός — засов, かんぬき; συγκλάω — ломать)."
  3: "θησαυροὺς σκοτεινούς — «сокровища темная» (σκοτεινός — тёмный); ἀποκρύφους ἀοράτους ἀνοίξω σοι — «сокровенная невидимая отверзу тебе» (ἀπόκρυφος — сокрытый, ἀόρατος — невидимый). ὁ καλῶν τὸ ὄνομά σου — «прозывая имя твое»; θεὸς Ισραηλ — «Бог Израилев»."
  4: "ἕνεκεν Ιακωβ τοῦ παιδός μου — «ради раба моего Иакова»; Ισραηλ τοῦ ἐκλεκτοῦ μου — «Израиля избраннаго моего»; ἐγὼ καλέσω σε τῷ ὀνόματί σου — «Аз прозову тя именем твоим»; προσδέξομαί σε — «прииму тя», т. е. приму, признаю (受け入れる). σὺ δὲ οὐκ ἔγνως με — «ты же не познал еси мене»: в gr эти слова кончают 45:4, слав. переносит их в начало 45:5 — держим слав. (notes 5)."
  5: "ὅτι ἐγὼ κύριος ὁ θεός — «яко Аз Господь Бог»; οὐκ ἔστιν ἔτι πλὴν ἐμοῦ θεός — «несть разве мене еще Бога». Слав. начинает стих «ты же не познал еси мене» (из конца 45:4) и добавляет «укрепих тя» — в LXX этих слов нет (слав. идёт за МТ «препоясал тебя»), по паритету внесено (わたしはあなたを強くした). В слав. также «Господь Бог твой»; в LXX просто «Господь Бог» — «твой» в тексте есть."
  6: "ἀπὸ ἀνατολῶν ἡλίου καὶ ἀπὸ δυσμῶν — «от восток солнечных и от запад»; οὐκ ἔστιν πλὴν ἐμοῦ — «несть разве мене»; ἐγὼ κύριος ὁ θεός, καὶ οὐκ ἔστιν ἔτι — «Аз Господь Бог, и несть еще»."
  7: "ὁ κατασκευάσας φῶς καὶ ποιήσας σκότος — «устроивый свет и сотворивый тму»; ὁ ποιῶν εἰρήνην καὶ κτίζων κακά — «творяй мир и зиждяй злая»: κακά — «злое, бедствия» (в ru «произвожу бедствия»), передано 災い, без смягчения. κτίζω — «созидать, творить» (зиждяй)."
  8: "εὐφρανθήτω ὁ οὐρανὸς ἄνωθεν — «да возрадуется небо свыше»; αἱ νεφέλαι ῥανάτωσαν δικαιοσύνην — «облацы да кропят правду» (ῥαίνω — кропить); ἀνατειλάτω ἡ γῆ ἔλεος — «да прозябнет земля… милость»: ἔλεος — милость, あわれみ (в ru «спасение» — по МТ, где יֶשַׁע; в LXX и слав. «милость»). ἐγώ εἰμι κύριος ὁ κτίσας σε — «Аз есмь Господь создавый тя»."
  9: "Ποῖον βέλτιον κατεσκεύασα ὡς πηλὸν κεραμέως — «что лучшее устроих яко глину скудельничу»: место тёмное, дословно «какое лучшее Я устроил, как глину горшечника»; передано вопросом. Важно: LXX здесь не даёт «горе тому, кто препирается с Создателем» — это МТ и ru; в LXX — вопросы о глине и горшечнике, держим LXX. μὴ ὁ ἀροτριῶν ἀροτριάσει τὴν γῆν ὅλην τὴν ἡμέραν — «еда оряй орати будет землю весь день» (ἀροτριάω — пахать, 耕す); μὴ ἐρεῖ ὁ πηλὸς τῷ κεραμεῖ Τί ποιεῖς — «еда речет брение скудельнику: что твориши»; ὅτι οὐκ ἐργάζῃ οὐδὲ ἔχεις χεῖρας — «яко не делаеши, ниже имаши рук». Слова глины горшечнику — в 『…』."
  10: "ὁ λέγων τῷ πατρὶ Τί γεννήσεις; — «еда глаголет отцу: что родиши» (γεννάω — рождать); τῇ μητρὶ Τί ὠδινήσεις; — «и матери: что чревоболиши» (ὠδίνω — мучиться родами). Слав. добавляет «еда отвещает здание создавшему е?» — в LXX нет, не внесено. Продолжение вопроса 45:9; слова к отцу и матери — в 『…』."
  11: "ὁ ἅγιος Ισραηλ ὁ ποιήσας τὰ ἐπερχόμενα — «святый израилев, сотворивый грядущая»; ἐρωτήσατέ με περὶ τῶν υἱῶν μου — «вопросите мене о сынех моих»; περὶ τῶν θυγατέρων μου — «о дщерех моих»; περὶ τῶν ἔργων τῶν χειρῶν μου ἐντείλασθέ μοι — «о делех руку моею заповедите мне» (ἐντέλλομαι — заповедовать, 命じる). Формула вне кавычек, речь открывается с «わたしの子ら…»."
  12: "ἐγὼ ἐποίησα γῆν καὶ ἄνθρωπον ἐπ᾽ αὐτῆς — «Аз сотворих землю и человека на ней»; ἐγὼ τῇ χειρί μου ἐστερέωσα τὸν οὐρανόν — «Аз рукою моею утвердих небо»; πᾶσι τοῖς ἄστροις ἐνετειλάμην — «Аз всем звездам заповедах» (ἄστρον — звезда)."
  13: "ἐγὼ ἤγειρα αὐτὸν μετὰ δικαιοσύνης βασιλέα — «Аз возставих его со правдою царя»; πᾶσαι αἱ ὁδοὶ αὐτοῦ εὐθεῖαι — «вси путие его правы»; οἰκοδομήσει τὴν πόλιν μου — «сей созиждет град мой»; τὴν αἰχμαλωσίαν τοῦ λαοῦ μου ἐπιστρέψει — «пленение людий моих возвратит»; οὐ μετὰ λύτρων οὐδὲ μετὰ δώρων — «не по мзде, ни по даром» (λύτρον — выкуп, δῶρον — дар). Закрывающая формула «сказал Господь Саваоф» — вне кавычек."
  14: "Ἐκοπίασεν Αἴγυπτος — «утрудися Египет» (κοπιάω — трудиться); ἐμπορία Αἰθιόπων — «купли ефиопския» (ἐμπορία — торговля); οἱ Σεβωιν ἄνδρες ὑψηλοί — «саваимстии мужие высоцыи»: Σεβωιν — セボイン; в ru «Савейцы, люди рослые» — по МТ, имя иное, держим LXX. διαβήσονται καὶ σοὶ ἔσονται δοῦλοι — «к тебе прейдут и тебе будут раби»; δεδεμένοι χειροπέδαις — «связани узами ручными» (χειροπέδη — ручные оковы, 鎖). ἐν σοὶ ὁ θεός ἐστιν — «в тебе Бог есть»: исповедание народов — в 『…』, продолжается в 45:15."
  15: "σὺ γὰρ εἶ θεός, καὶ οὐκ ᾔδειμεν — «ты бо еси Бог, и не ведехом»: продолжение исповедания народов (из 45:14), поэтому внутри 『…』. ὁ θεὸς τοῦ Ισραηλ σωτήρ — «Бог Израилев спас» (σωτήρ — спаситель, 救い主). В ru «Бог сокровенный» — по МТ (מִסְתַּתֵּר), не внесено. Здесь закрываются вложенная речь и стих."
  16: "αἰσχυνθήσονται καὶ ἐντραπήσονται πάντες οἱ ἀντικείμενοι αὐτῷ — «постыдятся и посрамятся вси противящиися ему»: в гр. 3-е лицо («Ему»), хотя говорит Господь; в японском сохранено 彼に逆らう者. πορεύσονται ἐν αἰσχύνῃ — «пойдут в студе». ἐγκαινίζεσθε πρός με, νῆσοι — «обновляйтеся ко мне, острови»: в LXX эта клауза добавлена к стиху (ср. 41:1), в МТ её нет; в ru «вместе с ними со стыдом пойдут и все, делающие идолов» — по МТ."
  17: "Ισραηλ σῴζεται ὑπὸ κυρίου σωτηρίαν αἰώνιον — «Израиль спасается от Господа спасением вечным» (внутренний объект σωτηρίαν сохранён); οὐκ αἰσχυνθήσονται οὐδὲ μὴ ἐντραπῶσιν ἕως τοῦ αἰῶνος — «не постыдятся, ни посрамятся даже до века ктому». Здесь закрывается речь 45:14–17."
  18: "οὗτος ὁ θεὸς ὁ καταδείξας τὴν γῆν — «сей Бог показавый землю» (καταδείκνυμι — показывать, являть); αὐτὸς διώρισεν αὐτήν — «той раздели ю» (διορίζω — разделять, определять, 区切って定める); οὐκ εἰς κενὸν ἐποίησεν αὐτήν — «не вотще сотвори ю» (κενός — пустой, напрасный); ἀλλὰ κατοικεῖσθαι — «но на вселение созда ю». В гр. в стихе стоят редакторские тире («—»); в текст не перенесены, фраза оформлена японской пунктуацией."
  19: "οὐκ ἐν κρυφῇ λελάληκα — «не отай глаголах» (κρυφῇ — тайно); οὐδὲ ἐν τόπῳ γῆς σκοτεινῷ — «ни в темне месте земли»; οὐκ εἶπα τῷ σπέρματι Ιακωβ Μάταιον ζητήσατε — «не рекох племени иаковлю: суетнаго взыщите» (μάταιος — суетный, пустой); ἐγώ εἰμι ἐγώ εἰμι κύριος — «Аз есмь, Аз есмь Господь»: удвоение сохранено (わたし、わたしこそ); λαλῶν δικαιοσύνην καὶ ἀναγγέλλων ἀλήθειαν — «глаголяй правду и возвещаяй истину»."
  20: "συνάχθητε καὶ ἥκετε, βουλεύσασθε ἅμα — «соберитеся и приидите, совещайтеся вкупе» (βουλεύομαι — совещаться); οἱ σῳζόμενοι ἀπὸ τῶν ἐθνῶν — «спасаемии от язык»; οἱ αἴροντες τὸ ξύλον γλῦμμα αὐτῶν — «воздвижущии древо изваяние свое» (γλῦμμα — резное изображение, 刻み物); προσευχόμενοι ὡς πρὸς θεούς, οἳ οὐ σῴζουσιν — «молящеся богом, иже не спасают»; οὐκ ἔγνωσαν — «не разумеша»."
  21: "εἰ ἀναγγελοῦσιν, ἐγγισάτωσαν — «аще возвестят, да приближатся»; ἵνα γνῶσιν ἅμα τίς ἀκουστὰ ἐποίησεν ταῦτα ἀπ᾽ ἀρχῆς — «да уведят вкупе, кто слышана сотвори сия исперва» (ἀκουστά — «слышимое», т. е. возвещённое); τότε ἀνηγγέλη ὑμῖν — «тогда возвестися вам»; δίκαιος καὶ σωτὴρ οὐκ ἔστιν πάρεξ ἐμοῦ — «праведен и спаситель, несть кроме мене». Исповедание «Я Бог, и нет иного» — в 『…』 (слова, возвещённые людям)."
  22: "ἐπιστράφητε πρός με καὶ σωθήσεσθε — «обратитеся ко мне и спасетеся»; οἱ ἀπ᾽ ἐσχάτου τῆς γῆς — «иже от края земнаго»; ἐγώ εἰμι ὁ θεός, καὶ οὐκ ἔστιν ἄλλος — «Аз есмь Бог, и несть иного». Стих цитируется в Деян 13:47 по смыслу (спасение до концов земли), дословно — нет."
  23: "κατ᾽ ἐμαυτοῦ ὀμνύω — «кленуся мною самим»; ἦ μὴν ἐξελεύσεται ἐκ τοῦ στόματός μου δικαιοσύνη — «аще не изыдет изо уст моих правда» (ἦ μήν — усилительная клятвенная частица); οἱ λόγοι μου οὐκ ἀποστραφήσονται — «словеса моя не возвратятся»; ἐμοὶ κάμψει πᾶν γόνυ — «мне поклонится всяко колено» (κάμπτω — сгибать; 膝); ἐξομολογήσεται πᾶσα γλῶσσα τῷ θεῷ — «исповестся всяк язык Богови». Цитируется в Рим 14:11 и Флп 2:10–11. Слова клятвы о поклонении — в 『…』."
  24: "λέγων Δικαιοσύνη καὶ δόξα πρὸς αὐτὸν ἥξουσιν — «глаголя: правда и слава к нему приидет»: в слав. «глаголя» стоит в конце 45:23, в гр. — в начале 45:24; держим слав. (と…言い). αἰσχυνθήσονται πάντες οἱ ἀφορίζοντες ἑαυτούς — «посрамятся вси отлучающиися» (ἀφορίζω — отделять, 分け離す). Слова «правда и слава к Нему придут» — в 『…』."
  25: "ἀπὸ κυρίου δικαιωθήσονται — «от Господа оправдятся» (δικαιόω — оправдывать, 正しいと認める); ἐν τῷ θεῷ ἐνδοξασθήσονται — «о Бозе прославится» (ἐνδοξάζομαι — прославляться); πᾶν τὸ σπέρμα τῶν υἱῶν Ισραηλ — «все семя сынов израилевых». Здесь закрывается речь 45:18–25 и глава."
