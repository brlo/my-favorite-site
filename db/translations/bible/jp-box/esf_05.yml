verses:
  1: "三日目[みっかめ]、エステルが祈[いの]り終[お]えると、悲[かな]しみの衣[ころも]を脱[ぬ]ぎ、自分[じぶん]の栄光[えいこう]をまとった。そして輝[かがや]く姿[すがた]となって、すべてを見守[みまも]る神[かみ]、また救[すく]い主[ぬし]を呼[よ]び求[もと]め、二人[ふたり]の女中[じょちゅう]を伴[ともな]って来[き]た。一人[ひとり]にはいたわられるかのように寄[よ]りかかり、もう一人は彼女[かのじょ]の衣を軽[かる]くしながら後[あと]に従[したが]った。その美[うつく]しさの盛[さか]りに顔[かお]を赤[あか]らめ、顔は愛[あい]らしく晴[は]れやかであったが、心[こころ]は恐[おそ]れのゆえに狭[せば]まっていた。すべての門[もん]を通[とお]って王[おう]の前[まえ]に立[た]った。王は自分の王国[おうこく]の王座[おうざ]に座[すわ]り、その輝きの衣をすっかりまとって、全身[ぜんしん]が金[きん]と貴重[きちょう]な石[いし]で飾[かざ]られており、非常[ひじょう]に恐ろしかった。王は栄光に燃[も]える顔を上[あ]げ、怒[いか]りの激[はげ]しさのうちに彼女を見[み]た。すると王妃[おうひ]は倒[たお]れ、力[ちから]が抜[ぬ]けて顔色[かおいろ]を変[か]え、先[さき]に進[すす]む女中の頭[かしら]の上[うえ]に身[み]をかがめた。神は王の心を柔和[にゅうわ]に変えられたので、王は苦[くる]しみながら王座から跳[と]び起[お]き、彼女を自分の腕[うで]に抱[だ]き取[と]った。彼女が落[お]ち着[つ]きを取り戻[もど]すまでそうして、平和[へいわ]な言葉[ことば]で彼女を慰[なぐさ]め、彼女に言[い]った。「エステル、どうしたのか。わたしはあなたの兄弟[きょうだい]である。勇[いさ]みなさい。あなたが死[し]ぬことはない。わたしたちの命令[めいれい]はすべてに共通[きょうつう]であるから、近[ちか]づきなさい。」"
  2: "王[おう]は金[きん]の王笏[おうしゃく]を上[あ]げて彼女[かのじょ]の首[くび]に当[あ]て、彼女に口[くち]づけして言[い]った。「わたしに話[はな]しなさい。」彼女は彼[かれ]に言った。「わたしはあなたを、わが主[ぬし]よ、神[かみ]の使[つか]いのように見[み]た。あなたの栄光[えいこう]の恐[おそ]れのゆえに、わたしの心[こころ]は乱[みだ]れた。あなたは驚[おどろ]くべき方[かた]であり、わが主よ、あなたの顔[かお]は恵[めぐ]みに満[み]ちているからである。」彼女がこう語[かた]っていると、力[ちから]が尽[つ]きて倒[たお]れた。王は動揺[どうよう]し、その家臣[かしん]たちはすべて彼女を慰[なぐさ]めた。"
  3: "王[おう]は言[い]った。「エステル、何[なに]を望[のぞ]むのか。あなたの願[ねが]いは何[なん]か。わたしの王国[おうこく]の半[なか]ばに至[いた]るまででも、あなたに与[あた]えられる。」"
  4: "エステルは言[い]った。「今日[きょう]はわたしの祝[いわ]いの日[ひ]である。それで、もし王[おう]の御心[みこころ]にかなうなら、王ご自身[じしん]とアマンが、わたしが今日、設[もう]ける酒宴[しゅえん]においでくださるように。」"
  5: "王[おう]は言[い]った。「エステルの言葉[ことば]どおりに行[おこな]うために、アマンを急[いそ]がせよ。」こうして二人[ふたり]は、エステルが言った酒宴[しゅえん]へ来[き]た。"
  6: "酒宴[しゅえん]の席[せき]で、王[おう]はエステルに言[い]った。「王妃[おうひ]エステル、何[なに]かあるのか。あなたの願[ねが]いの思[おも]いは何[なん]か。わたしの王国[おうこく]の半[なか]ばに至[いた]るまででも、あなたに与[あた]える。あなたが求[もと]めるものは何であれ、あなたに与えられる。」"
  7: "エステルは言[い]った。「わたしの願[ねが]い、わたしの求[もと]めは、"
  8: "もし王[おう]の前[まえ]に恵[めぐ]みを得[え]たなら、王とアマンは明日[あした]また、わたしが二人[ふたり]のために設[もう]ける酒宴[しゅえん]においでくださるように。そして明日、わたしは同[おな]じことをする。」"
  9: "アマンは王[おう]のもとを、非常[ひじょう]に喜[よろこ]び、楽[たの]しみながら出[で]て行[い]った。しかし、王の庭[にわ]でユダヤ人[じん]モルデカイが彼[かれ]の前[まえ]で立[た]ちもせず、身[み]をかがめもしないのを見[み]ると、激[はげ]しく怒[いか]った。"
  10: "彼[かれ]は自分[じぶん]の家[いえ]に入[はい]ると、友人[ゆうじん]たちと妻[つま]のゾサラを呼[よ]んだ。"
  11: "そして、自分[じぶん]の富[とみ]と、王[おう]が自分にまとわせた栄光[えいこう]、また王が自分を第一[だいいち]の者[もの]とし、王国[おうこく]を治[おさ]めさせた次第[しだい]を彼[かれ]らに示[しめ]した。"
  12: "アマンは言[い]った。「王妃[おうひ]は王[おう]とともに酒宴[しゅえん]へ、わたしのほかにだれも招[まね]かなかった。そして明日[あした]もわたしは招かれている。"
  13: "しかし、わたしが王[おう]の庭[にわ]でユダヤ人[じん]モルデカイを見[み]るかぎり、これらはすべてわたしを満足[まんぞく]させない。」"
  14: "妻[つま]のゾサラと友人[ゆうじん]たちは彼[かれ]に言[い]った。「五十[ごじゅう]キュビトの柱[はしら]をあなたのために切[き]り出[だ]させ、夜明[よあ]けに王[おう]に申[もう]し上[あ]げて、モルデカイをその柱に掛[か]けさせなさい。あなたは王とともに酒宴[しゅえん]に行[い]って楽[たの]しみなさい。」この言葉[ことば]はアマンの心[こころ]にかなったので、柱が用意[ようい]された。"

notes:
  1: "Ст. 1 = основной ст. 1 (ἐγενήθη ἐν τῇ ἡμέρᾳ τῇ τρίτῃ) с влитым Добавлением D, подстихи 1a–1f: снятие одежд скорби, вход к царю, падение Есфири, смягчение духа царя, слова «Что тебе, Есфирь?»; подстихи и квадратные скобки добавления в текст не выведены. τὰ ἱμάτια τῆς θεραπείας — «одежды служения»: слав. «ризы прискорбныя», отсюда 悲しみの衣. ἐπόπτης — «всевидящий» (слав. «всевидец»), σωτήρ — «спаситель» (救い主); ἀπεστενωμένη ἀπὸ τοῦ φόβου — «стеснена от страха» (στενοχωρέω). κοινὸν τὸ πρόσταγμα ἡμῶν — «повеление наше общее», т. е. равно для всех."
  2: "Продолжение Добавления D: подстихи 2a (ответ Есфири) и 2c (обморок), подстиха 2b в модуле нет. ῥάβδος — «жезл, скипетр» (слав. «жезл»; то же слово в 4:11, где слав. «златый жезл»), в тексте 王笏; τράχηλος — «шея» (слав. «выя»), ἠσπάσατο — «поцеловал». κύριε — обращение к царю, «господин мой» (слав. «господине»), передано わが主, чтобы не смешивать с 主 = Господь; χαρίτων μεστόν — «полно благодати/прелести». ἀπὸ ἐκλύσεως — «от изнеможения»; θεραπεία — «прислуга, придворные» (слав. «раби»), отсюда 家臣たち."
  3: "τί θέλεις, Εσθηρ — «чего хочешь, Есфирь» (слав. «что хощеши»); Син. «что тебе, царица Есфирь» — с масоретского, с добавлением «царица». τὸ ἀξίωμα — «просьба, желание» (слав. «прошение»). ἕως τοῦ ἡμίσους τῆς βασιλείας μου — «до половины царства моего», формула царской щедрости."
  4: "ἡμέρα μου ἐπίσημος — «день мой знаменательный»; слав. «день моего празднования», отсюда 祝いの日. εἰ δοκεῖ τῷ βασιλεῖ — безличная формула вежливости «если угодно царю». δοχή — «пир, угощение» (слав. «пир»), в тексте 酒宴. ἐλθάτω — импер. 3 л.: «пусть придёт»."
  5: "κατασπεύσατε τὸν Αμαν — «поторопите Амана» (κατασπεύδω); слав. «ускорите ити по амана», т. е. поспешите за ним. ποιήσωμεν τὸν λόγον Εσθηρ — «сделаем по слову Есфири». παραγίνονται — настоящее историческое, «приходят»."
  6: "ἐν δὲ τῷ πότῳ — «за питьём, на пиру» (πότος; слав. «на пиру»), ср. δοχή в ст. 4. βασίλισσα — «царица», в тексте 王妃. Слав. в скобках добавляет «и кая есть мысль прошения твоего? дам ти и до полуцарства моего» — этого нет в LXX (повтор 5:3b), по паритету внесено в основной текст без 〔…〕. ὅσα ἀξιοῖς — «сколько ни просишь»."
  7: "Τὸ αἴτημά μου καὶ τὸ ἀξίωμά μου — «прошение моё и просьба моя»: стих обрывается, продолжение в ст. 8; речь Есфири открыта здесь и закрыта в ст. 8 (одна цитата). Слав. добавляет имя «есфирь», которого в LXX нет."
  8: "εἰ εὗρον χάριν — «если я обрела милость». ἐπὶ τὴν αὔριον — «на завтра». καὶ αὔριον ποιήσω τὰ αὐτά — «и завтра сделаю то же» (LXX буквально); слав. «и заутра сотворю сие прошение» (понято как «исполню прошение»), Син. «исполню слово царя» (с масоретского). Держимся LXX."
  9: "ὑπερχαρὴς εὐφραινόμενος — «весьма радостный, веселящийся» (ὑπέρχαρης — усилительное). αὐλή — «двор» (слав. «двор»). Слав. добавляет «не подвигнувся и не кланяющася пред ним» — этого нет в LXX (пришло из масоретского текста); по паритету внесено в основной текст без 〔…〕."
  10: "εἰσελθὼν εἰς τὰ ἴδια — «войдя к себе» (τὰ ἴδια — «свой дом»). ἐκάλεσεν τοὺς φίλους — «позвал друзей»; в LXX и в слав. имена друзей не названы (Αρκεσαιος, Σαρσαθαιος, Μαλησεαρ, Μουχαιος — приближённые царя в 1:14), поэтому перечислять нечего. Ζωσαρα — Зосара, жена Амана (ゾサラ)."
  11: "ὑπέδειξεν — «показал, изъяснил» (ὑποδείκνυμι). περιέθηκεν — «возложил, облёк» (περιτίθημι). πρωτεύειν καὶ ἡγεῖσθαι — «быть первым и начальствовать» (слав. «перваго быти и правити»). Син. добавляет «множество сыновей» — этого нет ни в LXX, ни в слав., не вносим."
  12: "Οὐ κέκληκεν … οὐδένα ἀλλ᾽ ἢ ἐμέ — «не позвала никого, кроме меня» (двойное отрицание греческого сохранено). εἰς τὴν αὔριον κέκλημαι — «и на завтра я зван». Речь Амана открыта здесь и закрыта в ст. 13."
  13: "ταῦτά μοι οὐκ ἀρέσκει — «это мне не нравится» (ἀρέσκω). ὅταν ἴδω — «когда вижу» (ὅταν с аористом в значении настоящего). Слав. добавляет «(цареве)» — уточнение, которого в LXX нет; в тексте 王の庭."
  14: "ξύλον — «дерево, столб» (слав. «древо»), орудие казни; в тексте 柱, греч. в notes. πηχῶν πεντήκοντα — «в пятьдесят локтей» (πῆχυς, キュビト). Κοπήτω σοι ξύλον — «пусть вырубят тебе дерево» (κόπτω), ὄρθρου — «на рассвете», κρεμασθήτω — «пусть будет повешен». ἤρεσεν τὸ ῥῆμα — «слово понравилось» (ἀρέσκω)."
