# jp-box, Есфирь, глава 5. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для Есфири нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 5: Есфирь перед царём (1–2), просьба и первое пиршество (3–8), радость Амана
# и его обида на Мардохея (9–13), совет Зосары и столб в пятьдесят локтей (14).
# Прямая речь: царь (1, 2, 3, 5, 6), Есфирь (2, 4, 7–8), Аман (12–13), Зосара и друзья
# (14); речь Есфири в 7–8 и речь Амана в 12–13 — одна цитата на два стиха.
# Красного и синего нет.
# Нумерация по gr: 14 стихов. Особенность модуля: в ст. 1 влито Добавление D
# (подстихи 1a–1f: Есфирь снимает одежды скорби, входит к царю, царь поднимает лицо,
# «Что тебе, Есфирь?»), в ст. 2 — его продолжение (подстихи 2a, 2c: золотой жезл,
# ответ Есфири, обморок); переведено внутри ст. 1–2, подстихи и скобки не выводились.
# 〔…〕 нет: все стихи есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 王笏, キュビト, 酒宴, 宦官, 王座, 庭, 女中 — терминология брифа, ⟨…⟩ не ставились.
# Имена — транслитерация греческого (LXX).

