# jp-box, Псалтирь, псалом 99. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0.
# Псалом 99: все земли призываются служить Господу с радостью (1–2), знать,
# что Он — Бог и Пастырь Свой (3), входить в ворота Его с благодарением (4),
# ибо милость Его вовек (5).
# Красного и синего нет: псалом — хвала, а не евангельская речь Христа.
# Прямой речи нет, кавычки не ставятся.
# 〔…〕 нет: всё переведено по gr-lxx-byz, добавлений Церкви не вносилось.
# セラ (διάψαλμα) в этой главе нет.
# Сносок ⟨…⟩ нет: 牧場, 庭, 門 понятны; いつくしみ深い уже в корпусе (1 Пет 2:3).
# jp-ni не использовался.

tr_code: jp-box
book: ps
chapter: 99
