verses:
  0: "感謝[かんしゃ]の詩[うた]。"
  1: "全[ぜん]地[ち]よ、主[しゅ]に喜[よろこ]びの声[こえ]を上[あ]げよ。"
  2: "喜[よろこ]びをもって主[しゅ]に仕[つか]え、喜[よろこ]び躍[おど]りながら主[しゅ]の前[まえ]に進[すす]め。"
  3: "主[しゅ]こそ神[かみ]であることを知[し]れ。主[しゅ]がわたしたちを造[つく]られたのであって、わたしたちではない。わたしたちは主[しゅ]の民[たみ]、その牧[まき]場[ば]の羊[ひつじ]である。"
  4: "感謝[かんしゃ]をもって主[しゅ]の門[もん]に入[はい]り、賛美[さんび]をもってその庭[にわ]に入[はい]れ。主[しゅ]に感謝[かんしゃ]し、その名[な]をほめたたえよ。"
  5: "主[しゅ]はいつくしみ深いからである。そのあわれみはとこしえに、その真実[しんじつ]は代[よ]々[よ]に至[いた]る。"

notes:
  0: "Ψαλμὸς εἰς ἐξομολόγησιν — «псалом к исповеданию»; ἐξομολόγησις в псалмах означает хвалу-благодарение (евр. תודה), поэтому 感謝の詩 (слав. «Псалом во исповедание», рус. «Псалом хвалебный»). В gr-lxx-byz имени Давида в надписании нет (у ru и jp-joc добавлено «Давида») — взято по gr, надписание скобками не маркируется."
  1: "Ἀλαλάξατε τῷ κυρίῳ, πᾶσα ἡ γῆ — 全地よ、主に喜びの声を上げよ (ἀλαλάζω — «восклицать, ликовать»; ср. Пс 97:4)."
  2: "δουλεύσατε τῷ κυρίῳ ἐν εὐφροσύνῃ — 喜びをもって主に仕え (δουλεύω — «служить»; εὐφροσύνη — «веселие, радость»). εἰσέλθατε ἐνώπιον αὐτοῦ ἐν ἀγαλλιάσει — 喜び躍りながら主の前に進め (ἀγαλλίασις — «ликование»); два разных слова на «радость» переданы 喜び / 喜び躍り."
  3: "γνῶτε ὅτι κύριος, αὐτός ἐστιν ὁ θεός — 主こそ神であることを知れ (γινώσκω — «знать»; αὐτός — усиление «Он Сам»). αὐτὸς ἐποίησεν ἡμᾶς καὶ οὐχ ἡμεῖς — 主がわたしたちを造られたのであって、わたしたちではない (в слав. и у jp-joc добавлено «и мы Его», в gr-lxx-byz этого нет — не добавлено). λαὸς αὐτοῦ καὶ πρόβατα τῆς νομῆς αὐτοῦ — 主の民、その牧場の羊 (νομή — «пастбище»)."
  4: "εἰσέλθατε εἰς τὰς πύλας αὐτοῦ ἐν ἐξομολογήσει — 感謝をもって主の門に入り (ἐξομολόγησις — хвала-благодарение, как в ст. 0). εἰς τὰς αὐλὰς αὐτοῦ ἐν ὕμνοις — 賛美をもってその庭に入れ (αὐλή — «двор»; ὕμνος — «гимн»). ἐξομολογεῖσθε αὐτῷ — 主に感謝し. αἰνεῖτε τὸ ὄνομα αὐτοῦ — その名をほめたたえよ."
  5: "ὅτι χρηστὸς κύριος — 主はいつくしみ深いからである (χρηστός — «благ, милостив»; いつくしみ深い, как в 1 Пет 2:3). εἰς τὸν αἰῶνα τὸ ἔλεος αὐτοῦ — そのあわれみはとこしえに. ἕως γενεᾶς καὶ γενεᾶς ἡ ἀλήθεια αὐτοῦ — その真実は代々に至る (ἀλήθεια — «верность, истина»); формула выровнена с Пс 102:17."
