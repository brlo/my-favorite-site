verses:
  1: "ダビデは、自分[じぶん]とともにいる民[たみ]を数[かぞ]え、彼[かれ]らの上[うえ]に千人[せんにん]の長[ちょう]と百人[ひゃくにん]の長を置[お]いた。"
  2: "ダビデは民[たみ]を三[みっ]つに分[わ]け、三分[さんぶん]の一[いち]をヨアブの手[て]に、三分の一をヨアブの兄弟[きょうだい]、ツルヤの子[こ]アベシャの手に、三分の一をガテ人[じん]イッタイの手に渡[わた]した。ダビデは民[たみ]に言[い]った。「わたしもあなたがたとともに出[で]て行[い]こう。」"
  3: "しかし彼[かれ]らは言[い]った。「出[で]て行[い]かないでください。わたしたちが逃[に]げても、彼らはわたしたちに心[こころ]を留[と]めません。わたしたちの半分[はんぶん]が死[し]んでも、心を留めません。あなたはわたしたち一万人[いちまんにん]に代[か]わる方[かた]です。今[いま]は、あなたが町[まち]にとどまってわたしたちを助[たす]けるのが良[よ]いのです。」"
  4: "王[おう]は彼[かれ]らに言[い]った。「あなたがたの目[め]に良[よ]いと思[おも]うことをしよう。」王は門[もん]のそばに立[た]ち、民[たみ]はすべて百人[ひゃくにん]ずつ、千人[せんにん]ずつ出[で]て行[い]った。"
  5: "王[おう]はヨアブとアベシャとイッタイに命[めい]じて言[い]った。「わたしのために、若者[わかもの]アブサロムを大目[おおめ]に見[み]てやってくれ。」民[たみ]はすべて、王がすべての長[おさ]たちにアブサロムのことを命[めい]じるのを聞[き]いた。"
  6: "民[たみ]はすべて、イスラエルと向[む]かい合[あ]うために森[もり]へ出[で]て行[い]った。そして戦[いくさ]はエフライムの森[もり]で起[お]こった。"
  7: "イスラエルの民[たみ]はそこでダビデの若者[わかもの]たちの前[まえ]に打[う]ち負[ま]けた。その日[ひ]の打撃[だげき]は大[おお]きく、二万人[にまんにん]の者[もの]が倒[たお]れた。"
  8: "戦[いくさ]は全地[ぜんち]に広[ひろ]がった。その日[ひ]、森[もり]が食[く]い尽[つ]くした民[たみ]は、剣[つるぎ]が倒[たお]した者[もの]よりも多[おお]かった。"
  9: "アブサロムはダビデの若者[わかもの]たちと出[で]会[あ]った。アブサロムは自分[じぶん]のらばに乗[の]っていた。らばが大[おお]きな樫[かし]の木の茂[しげ]みの中へ入[はい]ると、彼[かれ]の髪[かみ]が樫の木[き]に絡[から]みつき、頭[あたま]が天[てん]と地[ち]の間[あいだ]にぶら下[さ]がった。らばは彼[かれ]の下[した]から走[はし]り去[さ]った。"
  10: "一人[ひとり]の男[おとこ]がそれを見[み]て、ヨアブに告[つ]げて言[い]った。「アブサロムが樫[かし]の木にぶら下[さ]がっているのを見[み]ました。」"
  11: "ヨアブは告[つ]げた男[おとこ]に言[い]った。「おまえは見[み]たというのか。なぜ、その場[ば]で彼[かれ]を打[う]ち殺[ころ]さなかったのだ。そうすれば、わたしはおまえに銀[ぎん]十[じゅう]シケルと帯[おび]一本[いっぽん]をやったものを。」"
  12: "男[おとこ]はヨアブに言[い]った。「たとえ銀[ぎん]千[せん]シケルがわたしの手[て]に置[お]かれても、わたしは王[おう]の子[こ]に手[て]をかけることはしません。王[おう]があなたとアベシャとイッタイに、わたしたちの耳[みみ]の前[まえ]で『わたしのために若者[わかもの]アブサロムを守[まも]れ』と命[めい]じられたからです。"
  13: "たとえわたしが自分[じぶん]の命[いのち]を危[あや]うくして不正[ふせい]を行[おこな]っても、そのことは王[おう]から隠[かく]れません。そのとき、あなたはわたしに敵対[てきたい]して立[た]つことになるでしょう。」"
  14: "ヨアブは言[い]った。「わたしがそれを始[はじ]めよう。おまえの前[まえ]にそう長[なが]く留[とど]まってはいられない。」ヨアブは手[て]に三本[さんぼん]の矢[や]を取[と]り、まだ樫[かし]の木の真[ま]ん中[なか]で生[い]きていたアブサロムの心臓[しんぞう]に突[つ]き刺[さ]した。"
  15: "ヨアブの武具[ぶぐ]を運[はこ]ぶ十人[じゅうにん]の若者[わかもの]たちがアブサロムを取[と]り囲[かこ]み、彼[かれ]を打[う]って殺[ころ]した。"
  16: "ヨアブは角笛[つのぶえ]を吹[ふ]き鳴[な]らした。民[たみ]はイスラエルの後[あと]を追[お]うのをやめて戻[もど]った。ヨアブが民[たみ]を惜[お]しんだからである。"
  17: "彼[かれ]らはアブサロムを取[と]って、森[もり]の大[おお]きな穴[あな]、深[ふか]い穴[あな]に投[な]げ込[こ]み、その上[うえ]に非常[ひじょう]に大[おお]きな石[いし]の山[やま]を築[きず]いた。イスラエルはすべて、それぞれ自分[じぶん]の天幕[てんまく]へ逃[に]げて行[い]った。"
  18: "アブサロムはまだ生[い]きていたころ、自分[じぶん]のため石柱[せきちゅう]を立[た]てた。王[おう]の谷[たに]にある石柱である。彼[かれ]は『わたしには名[な]を覚[おぼ]えられるべき子[こ]がない』と言[い]って、この石柱を立てた。そして、その石柱を自分[じぶん]の名[な]で名[な]づけ、『アブサロムの手[て]』と呼[よ]んだ。それは今日[きょう]に至[いた]るまでそう呼ばれている。"
  19: "サドクの子[こ]アヒマアスはヨアブに言[い]った。「わたしは走[はし]って行[い]き、王[おう]に告[つ]げましょう。主[しゅ]が王を敵[てき]の手[て]から裁[さば]いてくださった、と。」"
  20: "ヨアブは彼[かれ]に言[い]った。「今日[きょう]はおまえが知[し]らせる日[ひ]ではない。別[べつ]の日[ひ]に知らせるのだ。今日は知らせてはならない。王[おう]の子[こ]が死[し]んだのだから。」"
  21: "ヨアブはフシャイに言[い]った。「行[い]って、見[み]たとおりを王[おう]に告[つ]げよ。」フシャイはヨアブに礼[れい]をして出[で]て行[い]った。"
  22: "サドクの子[こ]アヒマアスはさらに言[い]った。「何[なん]があっても、わたしもフシャイの後[あと]を走[はし]らせてください。」ヨアブは言[い]った。「なぜ走[はし]るのか、わが子[こ]よ。行[い]っても、おまえには益[えき]となる知[し]らせはないのだ。」"
  23: "アヒマアスは言[い]った。「それでも、走[はし]らせてください。」ヨアブは彼[かれ]に言[い]った。「走[はし]れ。」アヒマアスは平[たい]らな道[みち]を走[はし]り、フシャイを追[お]い越[こ]した。"
  24: "ダビデは二[ふた]つの門[もん]の間[あいだ]に座[すわ]っていた。見張[みは]りの者[もの]が門[もん]の屋上[おくじょう]に上[のぼ]り、壁[かべ]の方[ほう]へ行[い]って目[め]を上[あ]げると、一人[ひとり]の男[おとこ]が走[はし]って来[く]るのが見[み]えた。"
  25: "見張[みは]りの者[もの]は叫[さけ]んで王[おう]に告[つ]げた。王[おう]は言[い]った。「一人[ひとり]なら、その口[くち]に良[よ]い知[し]らせがある。」その者[もの]はどんどん近[ちか]づいて来[き]た。"
  26: "見張[みは]りの者[もの]は、もう一人[ひとり]の男[おとこ]が走[はし]って来[く]るのを見[み]て、門[もん]の方[ほう]へ叫[さけ]んで言[い]った。「見[み]てください。もう一人の男[おとこ]が一人で走[はし]って来ます。」王[おう]は言[い]った。「この者[もの]も知[し]らせを持[も]って来[き]たのだ。」"
  27: "見張[みは]りの者[もの]は言[い]った。「先[さき]の者[もの]の走[はし]り方[かた]は、サドクの子[こ]アヒマアスの走り方[かた]に見えます。」王[おう]は言[い]った。「あれは良[よ]い人[ひと]だ。良[よ]い知[し]らせを持って来[く]るだろう。」"
  28: "アヒマアスは叫[さけ]んで王[おう]に言[い]った。「平安[へいあん]でありますように。」彼[かれ]は王[おう]に顔[かお]を地[ち]につけて拝[おが]み、言[い]った。「あなたの神[かみ]、主[しゅ]がほめたたえられますように。主は、わが主人[しゅじん]である王[おう]に手[て]を上[あ]げた者[もの]たちを閉[と]じ込[こ]められました。」"
  29: "王[おう]は言[い]った。「若者[わかもの]アブサロムは無事[ぶじ]か。」アヒマアスは言[い]った。「わたしは大[おお]きな群[む]れが喜[よろこ]んでいるのを見[み]ました。王[おう]のしもべヨアブがあなたのしもべを遣[つか]わしたときのことです。何[なに]があったのかは知[し]りません。」"
  30: "王[おう]は言[い]った。「向[む]こうへ行[い]って、そこに立[た]っていなさい。」彼は向[む]こうへ行[い]って、後[うし]ろに立[た]った。"
  31: "すると、フシャイが来[き]て王[おう]に言[い]った。「わが主人[しゅじん]である王[おう]に知[し]らせがあります。主[しゅ]が今日[きょう]、あなたに立[た]ち向[む]かうすべての者[もの]の手[て]から、あなたを裁[さば]いてくださったのです。」"
  32: "王[おう]はフシャイに言[い]った。「若者[わかもの]アブサロムは無事[ぶじ]か。」フシャイは言[い]った。「わが主人[しゅじん]である王[おう]に敵対[てきたい]して悪[あく]を企[たくら]んだ者[もの]はすべて、あの若者[わかもの]のようになりますように。」"

notes:
  1: "ἐπεσκέψατο — «пересмотрел, собрал» (ἐπισκέπτομαι; слав. «согляда»). χιλίαρχοι καὶ ἑκατόνταρχοι — тысяченачальники и сотники."
  2: "τὸ τρίτον — третью часть. Εθθι ὁ Γεθθαῖος — Еффей (Иттай) Гефянин; в слав. «еффей геффеин». Ἐξελθὼν ἐξελεύσομαι — «выходя, выйду» (усилительная конструкция); слав. «шед изыду»."
  3: "οὐ θήσουσιν ἐφ᾽ ἡμᾶς καρδίαν — «не положат на нас сердца», т. е. не обратят внимания. σὺ ὡς ἡμεῖς δέκα χιλιάδες — «ты как мы, десять тысяч», т. е. ты стоишь десяти тысяч. ἀγαθὸν ὅτι ἔσῃ ἡμῖν ἐν τῇ πόλει βοήθεια τοῦ βοηθεῖν — «хорошо, что будешь нам в городе помощью помогать»."
  4: "Ὃ ἐὰν ἀρέσῃ ἐν ὀφθαλμοῖς ὑμῶν, ποιήσω — «что угодно в глазах ваших, сделаю». ἀνὰ χεῖρα τῆς πύλης — «при руке ворот», т. е. у ворот. εἰς ἑκατοντάδας καὶ εἰς χιλιάδας — «сотнями и тысячами»."
  5: "Φείσασθέ μοι τοῦ παιδαρίου — «пощадите мне отрока» (φείδομαι). πᾶς ὁ λαὸς ἤκουσεν ἐντελλομένου τοῦ βασιλέως — «весь народ слышал, как заповедал царь». ἄρχοντες — начальники, князья."
  6: "δρυμός — лес, дубрава. ἐξ ἐναντίας Ισραηλ — «напротив Израиля». ἐν τῷ δρυμῷ Εφραιμ — «в лесу Ефремовом»; в ru «в лесу Ефремовом», в слав. «в дубраве ефремли»."
  7: "ἔπταισεν — «споткнулся, пал» (πταίω). θραῦσις μεγάλη — великое поражение. εἴκοσι χιλιάδες ἀνδρῶν — двадцать тысяч мужей."
  8: "διεσπαρμένος — рассеянный, распространившийся (διασπείρω). ἐπλεόνασεν ὁ δρυμὸς τοῦ καταφαγεῖν — «лес умножился, чтобы поглотить» (καταφαγεῖν). ὑπὲρ οὓς κατέφαγεν ... ἡ μάχαιρα — «более, чем поглотил меч»."
  9: "ἡμίονος — мул. δρῦς — дуб. ἐκρεμάσθη ἡ κεφαλὴ αὐτοῦ ἐν τῇ δρυί — «повисла голова его на дубе»; слав. уточняет: «обвишася власы главы его на дубе» (волосы обвились) — это чтение внесено в основной текст без скобок. ὑπὸ τὸ δάσος — под чащу, под ветви. ἀνὰ μέσον τοῦ οὐρανοῦ καὶ τῆς γῆς — «между небом и землёй»."
  10: "ἀνὴρ εἷς — один человек. κρεμάμενον ἐν τῇ δρυί — «висящим на дубе» (κρεμάννυμι). ἀνήγγειλεν Ιωαβ — «возвестил Иоаву»."
  11: "Καὶ ἰδοὺ ἑόρακας — «и вот, ты видел» (перфект ὁράω). τί ὅτι οὐκ ἐπάταξας αὐτὸν εἰς τὴν γῆν — «что же ты не поразил его на землю?». δέκα ἀργυρίου — «десять серебра»; в слав. «пятьдесят сикль сребра» — уникальное слав. чтение, расходящееся и с LXX, и с МТ; взято чтение LXX/МТ (十シケル), слав. вариант оставлен здесь. παραζώνη — пояс."
  12: "Καὶ ἐγώ εἰμι ἵστημι ἐπὶ τὰς χεῖράς μου χιλίους σίκλους ἀργυρίου — тёмная конструкция: «хотя бы положили на руки мои тысячу сиклей серебра» (слав. «аще ты вложиши в руце мои и тысящу сикль сребра»). οὐ μὴ ἐπιβάλω χεῖρά μου — «не наложу руки моей». ἐν τοῖς ὠσὶν ἡμῶν — «в ушах наших», вслух. Речь продолжается в ст. 13."
  13: "μὴ ποιῆσαι ἐν τῇ ψυχῇ αὐτοῦ ἄδικον — «не сделать душе его неправды»; смысл: не поступить против него неправо, с опасностью для собственной жизни (в ru — «с опасностью жизни моей»). πᾶς ὁ λόγος οὐ λήσεται ἀπὸ τοῦ βασιλέως — «всякое слово не утаится от царя» (λανθάνω). στήσῃ ἐξ ἐναντίας — «станешь напротив», т. е. будешь против меня."
  14: "Τοῦτο ἐγὼ ἄρξομαι — «это я начну». οὐχ οὕτως μενῶ ἐνώπιόν σου — «не так останусь пред тобою», т. е. не буду медлить. τρία βέλη — три стрелы (βέλος). ἐνέπηξεν αὐτὰ ἐν τῇ καρδίᾳ — «вонзил их в сердце» (πήγνυμι). ἔτι αὐτοῦ ζῶντος ἐν τῇ καρδίᾳ τῆς δρυός — «ещё ему живущему в сердце (середине) дуба»."
  15: "ἐκύκλωσαν δέκα παιδάρια αἴροντα τὰ σκεύη Ιωαβ — «окружили десять отроков, носящие оружие (доспехи) Иоава». ἐθανάτωσαν — умертвили (θανατόω)."
  16: "ἐσάλπισεν ἐν κερατίνῃ — «затрубил в рог» (κερατίνη — роговая труба; слав. «трубою рожаною»). ἀπέστρεψεν ὁ λαὸς τοῦ μὴ διώκειν — «возвратил народ, чтобы не преследовать». ἐφείδετο τοῦ λαοῦ — «щадил народ» (φείδομαι)."
  17: "χάσμα μέγα — большая пропасть, расселина. βόθυνος — яма. ἐστήλωσεν ἐπ᾽ αὐτὸν σωρὸν λίθων — «поставил над ним кучу камней» (στηλόω). εἰς τὸ σκήνωμα αὐτοῦ — «в шатёр (жилище) свой»."
  18: "στήλη — столп, стела. ἐν ᾗ ἐλήμφθη — «в которой он был взят» (неясно: возможно, «в которой он был схвачен» или «почтён»); слав. опускает. κοιλὰς τοῦ βασιλέως — «долина царя». ἕνεκεν τοῦ ἀναμνῆσαι τὸ ὄνομα αὐτοῦ — «чтобы вспомнить (сохранить) имя его». Χεὶρ Αβεσσαλωμ — «рука Авессалома» (название столпа); слав. добавляет «нарече столп именем своим» (назвал своим именем) — в LXX этого нет, по паритету внесено в основной текст."
  19: "εὐαγγελιῶ τῷ βασιλεῖ — «возвещу царю» (εὐαγγελίζω); слав. «рече ко иоаву» — «сказал Иоаву», в LXX обращения нет, внесено в текст. ὅτι ἔκρινεν αὐτῷ κύριος ἐκ χειρὸς τῶν ἐχθρῶν — «что рассудил ему Господь от руки врагов его» (κρίνω — судить, оправдать, избавить)."
  20: "Οὐκ ἀνὴρ εὐαγγελίας σὺ ἐν τῇ ἡμέρᾳ ταύτῃ — «не человек вести ты в день этот». οὗ εἵνεκεν ὁ υἱὸς τοῦ βασιλέως ἀπέθανεν — «потому что сын царя умер»."
  21: "Χουσι — здесь не архитянин, а другой человек, вестник (в евр. тексте — кушит); в LXX и слав. то же имя Χουσι, поэтому имя передано как フシャイ, а различие отмечено здесь. Βαδίσας ἀνάγγειλον — «пойдя, возвести». προσεκύνησεν — поклонился."
  22: "προσέθετο ἔτι — «прибавил ещё». Καὶ ἔστω ὅτι δράμω — «и пусть будет, что побегу» (ἔστω — императив). Ἵνα τί τοῦτο τρέχεις — «к чему это ты бежишь?». οὐκ ἔστιν σοι εὐαγγελία εἰς ὠφέλειαν — «нет тебе вести в пользу»."
  23: "Τί γὰρ ἐὰν δραμοῦμαι — «что же, если побегу?». ὁδὸν τὴν τοῦ Κεχαρ — «дорогою Кехара» (тёмное место, вероятно имя или искажение); слав. «путем равным» — «ровной дорогой» (ср. евр. «дорога равнины»); в тексте слав. чтение, вариант LXX отмечен здесь. ὑπερέβη τὸν Χουσι — «обогнал Хусия» (ὑπερβαίνω)."
  24: "ἀνὰ μέσον τῶν δύο πυλῶν — «между двумя воротами». σκοπός — страж, наблюдатель. δῶμα τῆς πύλης — кровля ворот. τεῖχος — стена."
  25: "ἀνεβόησεν — возопил (ἀναβοάω). Εἰ μόνος ἐστίν — «если один он». εὐαγγελία ἐν τῷ στόματι αὐτοῦ — «весть в устах его». ἐγγίζων — приближаясь (ἐγγίζω)."
  26: "ἄνδρα ἕτερον τρέχοντα — другого бегущего человека. πρὸς τῇ πύλῃ — при воротах. Καί γε οὗτος εὐαγγελιζόμενος — «и этот вестник»."
  27: "τὸν δρόμον τοῦ πρώτου — «бег первого». ὡς δρόμον Αχιμαας — «как бег Ахимааса». ἀνὴρ ἀγαθός — человек добрый. εἰς εὐαγγελίαν ἀγαθὴν ἐλεύσεται — «придёт с доброю вестью»."
  28: "Εἰρήνη — «мир» (приветствие). προσεκύνησεν ... ἐπὶ τὴν γῆν — поклонился до земли. Εὐλογητὸς κύριος ὁ θεός σου — «благословен Господь Бог твой». ὃς ἀπέκλεισεν τοὺς ἄνδρας τοὺς μισοῦντας τὴν χεῖρα αὐτῶν — «который заключил мужей, ненавидящих руку их»; слав. «воздвигших руки своя» — чтение внесено в основной текст, буквальный смысл LXX отмечен здесь."
  29: "Εἰρήνη τῷ παιδαρίῳ τῷ Αβεσσαλωμ — «мир ли отроку Авессалому?», т. е. благополучен ли он. τὸ πλῆθος τὸ μέγα — великое множество. τοῦ ἀποστεῖλαι τὸν δοῦλον τοῦ βασιλέως Ιωαβ — «когда посылал раб царя Иоав». Слав. добавляет «веселящееся» (ликующее) — в LXX этого слова нет; по паритету внесено в основной текст."
  30: "Ἐπίστρεψον, στηλώθητι ὧδε — «обратись, стань здесь» (στηλόω — ставить, утверждать). ἐπεστράφη καὶ ἔστη — «обратился и стал»; слав. «шед ста созади» — «отойдя, стал позади», добавление «позади» внесено в текст."
  31: "παρεγένετο — прибыл, явился (παραγίνομαι). Εὐαγγελισθήτω — «да будет возвещено» (пассив εὐαγγελίζω). ὅτι ἔκρινέν σοι κύριος σήμερον — «что рассудил тебе Господь сегодня». ἐπεγειρομένων ἐπὶ σέ — «восстающих на тебя»."
  32: "Εἰ εἰρήνη τῷ παιδαρίῳ — «мир ли отроку?». Γένοιντο ὡς τὸ παιδάριον οἱ ἐχθροί — «да будут как отрок враги» (оптатив γίνομαι). ὅσοι ἐπανέστησαν ἐπ᾽ αὐτὸν εἰς κακά — «сколько восстали на него на злое»."
