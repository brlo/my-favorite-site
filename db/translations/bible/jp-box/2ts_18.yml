# jp-box, 2-я Царств, глава 18. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); второй свидетель церковного текста —
# церковнославянский (csl-ru), по новому паритету (docs/japanese-bible.md,
# «Паритет LXX и церковнославянского»); ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге нет; jp-ni (под авторским правом) не использовался.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 18: смотр войска и три отряда (1–2); народ не пускает царя в бой (3–4);
# приказ о пощаде Авессалома (5); сражение в лесу Ефремовом (6–8); Авессалом
# повисает на дубе, весть Иоаву (9–10); Иоав и его оруженосцы убивают его
# (11–15); труба, яма и куча камней (16–17); столп Авессалома (18); Ахимаас и
# Хусий-вестник (19–23); Давид у ворот, ожидание и весть (24–32).
# Речи — 「…」: народ (3), царь (4, 5, 25, 26, 27, 29, 30, 32), Иоав (11, 14, 20,
# 21, 22, 23), муж (12–13), Ахимаас (19, 22, 23, 28, 29), Хусий (21, 31, 32),
# страж (26, 27). Вложенная речь — 『…』: приказ царя в передаче
# мужа (12), слова Авессалома о потомстве (18).
# Нумерация по gr: 32 стиха. В csl 33: слав. 18:33 (плач Давида «сын мой,
# Авессалом») = gr 19:1, поэтому стиха 33 здесь нет; плач относится к главе 19
# (как слав. 20:43 = gr 21:1 в 1 Царств).
# 〔…〕 нет: на месте каждого стиха в gr-lxx-byz есть текст; слав. чтения, которых
# нет в LXX (волосы в ст. 9, пятьдесят сикел в ст. 11, «веселящееся» в ст. 29),
# внесены в основной текст без скобок, варианты LXX отмечены в notes.
# Сносок ⟨…⟩ нет: 石柱, 天幕, 角笛, 祭司 уже в корпусе.
# Красного нет.
# jp-ni не использовался.

