# jp-box, Иезекииль, глава 26. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 26 (совпадает; см. карту 20/21).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: пророчество о Тире. 1 дата (одиннадцатый год, первый день месяца);
# 2–6 слово о падении Тира: торжество Тира над Иерусалимом, восшествие многих народов,
# как волны моря, разрушение стен и башен, «голая скала», «сушение сетей», гибель
# дочерей в поле; 7–14 Навуходоносор с севера: кони и колесницы, осада, пыль и рокот,
# попрание улиц, разграбление богатств, умолкание песен и арф, «не будешь более
# построен»; 15–18 ужас островов и плач князей моря; 19–21 сведение в бездну,
# в глубины земли, «не будешь более в век».
# Голоса: 1 — формула вне кавычек. 2–21 — одно непрерывное слово Господа в 「…」
# (формулы «так говорит Господь» в 3, 15, 19 стоят внутри речи, как в ier_38);
# 2 — слова Тира в 『…』; 17–18 — плач князей моря в 『…』 (вложен в слово Господа).
# Имена и термины: ツロ (Σορ/Τυρος), エルサレム, バビロン, ネブカドネツァル; 島[しま]々 — νῆσοι;
# 網[あみ]を干[ほ]す所[ところ] — ψυγμὸς σαγηνῶν; 裸[はだか]の岩[いわ] — λεωπετρία (26:4, 14).
# «Точка»: в этой главе нет.
#
