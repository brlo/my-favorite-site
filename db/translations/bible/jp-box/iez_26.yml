verses:
  1: "第十一年[だいじゅういちねん]、第一[だいいち]の月[つき]の一日[ついたち]に、主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  2: "「人[ひと]の子[こ]よ。ツロがエルサレムについてこう言[い]ったからである。『ああ、よし。砕[くだ]けた。諸国民[しょこくみん]は滅[ほろ]びた。わたしのところへ向[む]き直[なお]った。満[み]ちていた者[もの]は荒[あ]れ果[は]てた』と。"
  3: "それゆえ、主[しゅ]なる神[かみ]はこう言[い]われる。見[み]よ、わたしはあなたに対[たい]する、ツロよ。わたしは多[おお]くの国民[こくみん]をあなたの上[うえ]に上[のぼ]らせる。海[うみ]がその波[なみ]を上[あ]げるように。"
  4: "彼らはツロの城壁[じょうへき]を倒[たお]し、あなたの塔[とう]を倒[たお]す。わたしはその塵[ちり]をその中[なか]から吹[ふ]き払[はら]い、これを裸[はだか]の岩[いわ]とする。"
  5: "それは海[うみ]の真[ま]ん中[なか]で網[あみ]を干[ほ]す所[ところ]となる。主[しゅ]なる神[かみ]がそう語[かた]ったからである。それは諸国民[しょこくみん]の獲物[えもの]となる。"
  6: "また、野[の]にあるその娘[むすめ]たちは剣[つるぎ]で殺[ころ]される。彼らはわたしが主[しゅ]であることを知[し]る。"
  7: "主[しゅ]なる神[かみ]はこう言[い]われる。見[み]よ、わたしは北[きた]からバビロンの王[おう]ネブカドネツァルをあなたの上[うえ]に連[つ]れて来[く]る。彼は王[おう]の王[おう]で、馬[うま]と戦車[せんしゃ]と騎兵[きへい]、それに多[おお]くの国民[こくみん]の集[あつ]まりを率[ひき]いている。"
  8: "彼は野[の]にあるあなたの娘[むすめ]たちを剣[つるぎ]で殺[ころ]し、あなたに対[たい]して包囲[ほうい]の設備[せつび]を築[きず]き、あなたを囲[かこ]む城壁[じょうへき]を建[た]て、あなたに対[たい]して盾[たて]を並[なら]べる。"
  9: "彼はその剣[つるぎ]であなたの城壁[じょうへき]と塔[とう]を倒[たお]す。"
  10: "その馬[うま]の多[おお]さのゆえに、その塵[ちり]があなたを覆[おお]う。彼があなたの門[もん]に入[はい]る時[とき]、騎兵[きへい]と戦車[せんしゃ]と車輪[しゃりん]の響[ひび]きのゆえに、あなたの城壁[じょうへき]は震[ふる]える。それは野[の]から町[まち]に入[はい]る者[もの]のようである。"
  11: "その馬[うま]のひづめで、彼はあなたのすべての広[ひろ]い通[とお]りを踏[ふ]みにじる。あなたの民[たみ]を剣[つるぎ]で殺[ころ]し、あなたの力[ちから]の基[もと]を地[ち]に倒[たお]す。"
  12: "彼はあなたの富[とみ]を奪[うば]い、あなたの商品[しょうひん]を奪[うば]い、あなたの城壁[じょうへき]を倒[たお]し、あなたの慕[した]わしい家[いえ]々を壊[こわ]す。あなたの石[いし]と木[き]と土[つち]を海[うみ]の真[ま]ん中[なか]に投[な]げ入[い]れる。"
  13: "わたしはあなたの歌[うた]の多[おお]くをやめさせる。あなたの竪琴[たてごと]の音[ね]はもはや聞[き]かれない。"
  14: "わたしはあなたを裸[はだか]の岩[いわ]とし、あなたは網[あみ]を干[ほ]す所[ところ]となる。あなたは二度[にど]と建[た]てられない。わたしが語[かた]ったからである、と主[しゅ]なる神[かみ]は言[い]われる。"
  15: "主[しゅ]なる神[かみ]はツロにこう言[い]われる。あなたが倒[たお]れる時[とき]、傷[きず]ついた者[もの]たちがうめき、あなたの真[ま]ん中[なか]で剣[つるぎ]が抜[ぬ]かれる時[とき]、その響[ひび]きによって島[しま]々は震[ふる]えないだろうか。"
  16: "海[うみ]のすべての君[きみ]たちはその王座[おうざ]から下[お]り、頭[あたま]の飾[かざ]りを取[と]り、色[いろ]とりどりの衣[ころも]を脱[ぬ]ぐ。彼らは恐[おそ]れに包[つつ]まれ、地[ち]に座[すわ]り、あなたの滅[ほろ]びに震[ふる]え、あなたについてうめく。"
  17: "彼らはあなたについて泣[な]き歌[うた]をとり、あなたに言[い]う。『どうしてあなたは海[うみ]から滅[ほろ]びたのか。ほめたたえられる町[まち]よ。海[うみ]の上[うえ]で強[つよ]かった者[もの]、あなたと、あなたの中[なか]に住[す]む者[もの]たちよ。あなたはすべての住[す]む者[もの]に恐[おそ]れを与[あた]えていたのに。"
  18: "今[いま]、あなたの倒[たお]れる日[ひ]に、島[しま]々は震[ふる]える。海[うみ]の島[しま]々はあなたの出[で]て行[い]くことによって騒[さわ]ぎ立[た]つ』と。"
  19: "主[しゅ]なる神[かみ]はこう言[い]われる。わたしがあなたを、住[す]む者[もの]のいない町[まち]々のように荒[あ]れ果[は]てた町[まち]とする時[とき]、わたしがあなたの上[うえ]に深[ふか]みを上[のぼ]らせ、多[おお]くの水[みず]があなたを覆[おお]う時[とき]、"
  20: "わたしはあなたを、穴[あな]に下[くだ]る者[もの]たちのもとへ、昔[むかし]の民[たみ]のもとへ下[くだ]らす。わたしはあなたを地[ち]の深[ふか]みに住[す]まわせる。永遠[えいえん]の荒[あ]れ野[の]のように、穴[あな]に下[くだ]る者[もの]たちとともに。あなたはもはや住[す]まれず、生[い]ける者[もの]の地[ち]に立[た]つこともない。"
  21: "わたしはあなたを滅[ほろ]びに渡[わた]す。あなたはもはやいなくなる。あなたは求[もと]められても、永遠[えいえん]に見[み]いだされない、と主[しゅ]なる神[かみ]は言[い]われる。」"

notes:
  1: "Καὶ ἐγενήθη ἐν τῷ ἑνδεκάτῳ ἔτει μιᾷ τοῦ μηνός — «и было в одиннадцатый год, в первый [день] месяца» (μιᾷ — «в [день] первом»; слав. «в первый день месяца», в ru уточнено «первого месяца»). Год считается от переселения Иехонии (ср. 1:2). ἐγένετο λόγος κυρίου πρός με λέγων — формула вне кавычек."
  2: "ἀνθ᾽ ὧν εἶπεν Σορ ἐπὶ Ιερουσαλημ — «за то, что сказал Тир на Иерусалим» (ἀνθ᾽ ὧν — «вместо того, потому что»). Слова Тира: Εὖγε — «хорошо же!» (торжествующее восклицание, слав. «благоже»); συνετρίβη — «сокрушён»; ἀπώλωνται τὰ ἔθνη — «погибли народы»; ἐπεστράφη πρός με — «обратился ко мне»; ἡ πλήρης ἠρήμωται — «полная опустела» (слав. «иже бе исполненый, опусте»). В МТ иное: «врата народов», «наполнюсь» — чтение Синодального, в текст не внесено. Слова Тира — 『…』, открывается слово Господа 2–21."
  3: "διὰ τοῦτο τάδε λέγει κύριος — «посему так говорит Господь»; слав. «адонаи Господь» — двойное именование, передано 主[しゅ]なる神[かみ] (как κύριος ὁ θεός в корпусе). ἀνάξω ἐπὶ σὲ ἔθνη πολλά — «возведу на тебя народы многие»; ὡς ἀναβαίνει ἡ θάλασσα τοῖς κύμασιν αὐτῆς — «как поднимается море волнами своими»."
  4: "καταβαλοῦσιν τὰ τείχη Σορ καὶ τοὺς πύργους σου — «обрушат стены Тира и башни твои» (πύργος — башня; слав. «столпы»). λικμήσω τὸν χοῦν αὐτῆς ἀπ᾽ αὐτῆς — «вывею прах её из неё» (λικμάω — веять, развеивать); εἰς λεωπετρίαν — «в голую скалу» (λεωπετρία; ср. 26:14)."
  5: "ψυγμὸς σαγηνῶν — «сушение сетей» (ψυγμός — сушка; место, где развешивают и сушат сети, ср. 26:14). ὅτι ἐγὼ λελάληκα, λέγει κύριος — «ибо Я сказал, говорит Господь» (слав. добавляет «адонаи»). εἰς προνομὴν τοῖς ἔθνεσιν — «в добычу (расхищение) народам» (προνομή)."
  6: "αἱ θυγατέρες αὐτῆς αἱ ἐν τῷ πεδίῳ — «дочери его, которые в поле»: зависимые от Тира города и селения на материке (ср. 26:8); μαχαίρᾳ ἀναιρεθήσονται — «мечом будут убиты». γνώσονται ὅτι ἐγὼ κύριος — формула «узнают, что Я Господь», повторяющаяся в книге."
  7: "ἐπάγω ἐπὶ σὲ τὸν Ναβουχοδονοσορ βασιλέα Βαβυλῶνος ἀπὸ τοῦ βορρᾶ — «наведу на тебя Навуходоносора, царя Вавилонского, с севера» (ネブカドネツァル — форма корпуса). βασιλεὺς βασιλέων ἐστίν — «царь царей есть»: в критическом издании стоит в квадратных скобках, но в модуле и в слав. («царь царем есть») есть, поэтому без 〔…〕. μεθ᾽ ἵππων καὶ ἁρμάτων καὶ ἱππέων καὶ συναγωγῆς ἐθνῶν πολλῶν σφόδρα — «с конями и колесницами, и всадниками, и собранием народов многих весьма»."
  8: "προφυλακή — «стража, осадное сооружение»; περιοικοδομήσει — «обстроит кругом»; χάραξ — «вал, острог» (слав. «окопает тя ровом»); περίστασις ὅπλων — «обставление оружием», т. е. щиты; τὰς λόγχας — «копья» (λόγχη)."
  9: "καταβαλεῖ ἐν ταῖς μαχαίραις αὐτοῦ — «обрушит мечами своими» (слав. «оружием своим»). В Синодальном «стенобитные машины… секирами» (МТ), в текст не внесено."
  10: "ἀπὸ τοῦ πλήθους τῶν ἵππων — «от множества коней»; ὁ κονιορτὸς αὐτῶν — «пыль их»; ἀπὸ τῆς φωνῆς τῶν ἱππέων — «от голоса (ржания) всадников» (слав. «от ржания коней»); τροχοί — «колёса»; εἰσπορευομένου αὐτοῦ τὰς πύλας σου ὡς εἰσπορευόμενος εἰς πόλιν ἐκ πεδίου — «когда он входит в ворота твои, как входящий в город с поля»."
  11: "ἐν ταῖς ὁπλαῖς τῶν ἵππων — «копытами коней» (ὁπλή — копыто); πλατεῖαι — «широкие улицы» (слав. «стогны»); τὴν ὑπόστασίν σου τῆς ἰσχύος — «основание (опору) силы твоей», слав. «состав крепости твоея»; в Синодальном «памятники могущества» (МТ)."
  12: "προνομεύσει — «расхитит»; σκυλεύσει τὰ ὑπάρχοντά σου — «ограбит имущество твоё» (σκῦλα — добыча); οἴκους ἐπιθυμητούς — «домы вожделенные»; τὸν χοῦν σου εἰς μέσον τῆς θαλάσσης ἐμβαλεῖ — «прах твой в середину моря бросит»."
  13: "καταλύσει τὸ πλῆθος τῶν μουσικῶν σου — «упразднит множество музыкантов (певцов) твоих» (μουσικός); φωνὴ τῶν ψαλτηρίων — «голос псалтирей (арф)» (ψαλτήριον — 竪琴[たてごと]), слав. «певниц»."
  14: "δώσω σε εἰς λεωπετρίαν — «дам тебя в голую скалу»; ψυγμὸς σαγηνῶν ἔσῃ — «сушением сетей будешь» (формула 26:5); οὐ μὴ οἰκοδομηθῇς ἔτι — «не будешь более построен»; ὅτι ἐγὼ ἐλάλησα, λέγει κύριος — «ибо Я сказал, говорит Господь» (слав. добавляет адонаи)."
  15: "Οὐκ ἀπὸ φωνῆς τῆς πτώσεώς σου — «не от голоса ли падения твоего»; ἐν τῷ στενάξαι τραυματίας — «когда возстонут раненые» (τραυματίας); ἐν τῷ σπάσαι μάχαιραν ἐν μέσῳ σου — «когда извлекут (вырвут) меч среди тебя» (σπάω — вытаскивать меч); σεισθήσονται αἱ νῆσοι — «потрясутся острова»."
  16: "οἱ ἄρχοντες ἐκ τῶν ἐθνῶν τῆς θαλάσσης — «князья из народов моря»; ἀφελοῦνται τὰς μίτρας — «снимут митры (головные повязки)», слав. «свергут венцы со глав своих»; ἱματισμὸς ποικίλος — «одежда испещрённая»; ἐκστάσει ἐκστήσονται — «ужасом ужаснутся» (усиление); ἐπὶ γῆν καθεδοῦνται — «на землю сядут»; φοβηθήσονται τὴν ἀπώλειαν αὐτῶν — «убоятся погибели своей»; στενάξουσιν ἐπὶ σέ — «возстонут о тебе»."
  17: "Πῶς κατελύθης ἐκ θαλάσσης — «как разрушен ты от моря» (καταλύω — разрушать, сносить); ἡ πόλις ἡ ἐπαινεστή — «город хвалимый» (ἐπαινεστός — достойный похвалы); ἡ δοῦσα τὸν φόβον αὐτῆς πᾶσι τοῖς κατοικοῦσιν αὐτήν — «давшая страх свой всем живущим в нём». Слав. добавляет «иже был еси крепок на мори, ты и живущии в тебе» — нет в LXX, внесено без 〔…〕. Здесь открывается плач князей моря — 『…』."
  18: "φοβηθήσονται αἱ νῆσοι ἀφ᾽ ἡμέρας πτώσεώς σου — «убоятся острова от дня падения твоего». Слав. добавляет «и смятутся острови в мори от исхода твоего» — нет в LXX, внесено без 〔…〕. Плач князей закрывается; с 19 продолжается слово Господа."
  19: "Ὅταν δῶ σε πόλιν ἠρημωμένην — «когда дам тебя городом опустошённым»; τὰς πόλεις τὰς μὴ κατοικηθησομένας — «города, которые не будут населены»; ἐν τῷ ἀναγαγεῖν με ἐπὶ σὲ τὴν ἄβυσσον — «когда возведу на тебя бездну» (ἄβυσσος — 深[ふか]み); κατακαλύψῃ σε ὕδωρ πολύ — «покроет тебя вода многая». Предложение продолжается в 20-м стихе."
  20: "καταβιβιβάσω σε πρὸς τοὺς καταβαίνοντας εἰς βόθρον — «низведу тебя к сходящим в яму (ров)»; πρὸς λαὸν αἰῶνος — «к народу века», т. е. древнему; εἰς βάθη τῆς γῆς — «в глубины земли»; ὡς ἔρημον αἰώνιον — «как пустыню вечную»; ὅπως μὴ κατοικηθῇς μηδὲ ἀνασταθῇς ἐπὶ γῆς ζωῆς — «чтобы ты не был населён и не восстал на земле жизни». В Синодальном в конце «и явлю славу на земле живых» (МТ) — нет в LXX и слав., не внесено."
  21: "Ἀπώλειάν σε δώσω — «в погибель отдам тебя» (ἀπώλεια; в Синодальном «ужасом сделаю тебя» — по МТ, иное чтение). οὐχ ὑπάρξεις ἔτι εἰς τὸν αἰῶνα — «не будешь более в век». Слав. добавляет «взыщешися и не обрящешися» — нет в LXX, внесено без 〔…〕. Здесь слово Господа закрывается."
