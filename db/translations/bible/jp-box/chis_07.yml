  84: "これは祭壇[さいだん]の奉献[ほうけん]である。すなわち、それが油[あぶら]を塗[ぬ]られた日[ひ]に、イスラエルの子[こ]らの長[かしら]たちがささげたもので、銀[ぎん]の皿[さら]十二[じゅうに]、銀の鉢[はち]十二、金[きん]の火皿[ひざら]十二である。"
  85: "一[ひと]つの皿[さら]は百三十[ひゃくさんじゅう]シケル、一つの鉢[はち]は七十[ななじゅう]シケルで、器[うつわ]の銀[ぎん]はすべて、聖[せい]なるシケルで二千四百[にせんよんひゃく]シケルであった。"
  86: "香[こう]を満[み]たした金[きん]の火皿[ひざら]は十二[じゅうに]で、一[ひと]つの火皿[ひざら]に十[じゅう]シケル、聖[せい]なるシケルで、火皿の金[きん]はすべて百二十[ひゃくにじゅう]シケルであった。"
  87: "燔祭[はんさい]のための牛[うし]はすべて、子牛[こうし]十二[じゅうに]頭[とう]、雄羊[おひつじ]十二頭、一歳[いっさい]の子羊[こひつじ]十二頭、およびそれらの素祭[そさい]と注[そそ]ぎの捧[ささ]げ物[もの]。贖罪祭[しょくざいさい]のための雄山羊[おやぎ]は十二[じゅうに]頭であった。"
  88: "酬恩祭[しゅうおんさい]の犠牲[ぎせい]のための牛[うし]はすべて、雌牛[めうし]二十四[にじゅうし]頭[とう]、雄羊[おひつじ]六十[ろくじゅう]頭、雄山羊[おやぎ]六十頭、傷[きず]のない一歳[いっさい]の子羊[こひつじ]六十頭であった。これが、祭壇[さいだん]が整[ととの]えられ、それに油[あぶら]が注[そそ]がれた後[あと]の、祭壇の奉献[ほうけん]である。"
  89: "モーセが証[あかし]の幕屋[まくや]に入[はい]って主[しゅ]と語[かた]るとき、彼[かれ]は自分[じぶん]に語[かた]る声[こえ]を、契約[けいやく]の箱[はこ]の上[うえ]にある贖[あがな]いの座[ざ]の上[うえ]、二[ふた]つのケルビムの間[あいだ]から聞[き]いた。主[しゅ]は彼[かれ]に語[かた]られた。"

notes:
  1: "Καὶ ἐγένετο ᾗ ἡμέρᾳ — «и было в день, когда» (семитский оборот; в японском — «…した日に»). συνετέλεσεν … ὥστε ἀναστῆσαι — «окончил, чтобы поставить», т.е. завершил поставление скинии. ἔχρισεν … ἡγίασεν — «помазал и освятил» (χρίω, ἁγιάζω); слав. в конце только «и помаза я»."
  2: "προσήνεγκαν — «принесли, представили» (προσφέρω). ἄρχοντες οἴκων πατριῶν — «начальники домов отцов» (父の家の長). οἱ παρεστηκότες ἐπὶ τῆς ἐπισκοπῆς — «предстоящие при исчислении», т.е. участники переписи (ἐπισκοπή — 数え上げ)."
  3: "ἁμάξας λαμπηνικάς — «повозки крытые, парадные» (λαμπήνη — крытая колесница). ἅμαξαν παρὰ δύο ἀρχόντων — «повозку от двух начальников» (одна на двоих); μόσχον παρὰ ἑκάστου — «тельца от каждого»."
  4: "Введение речи; ср. 5:1."
  5: "Λαβὲ παρ᾽ αὐτῶν — «возьми у них». ἔσονται πρὸς τὰ ἔργα τὰ λειτουργικά — «будут для работ служебных» (λειτουργικός). ἑκάστῳ κατὰ τὴν αὐτοῦ λειτουργίαν — «каждому по его служению»."
  6: "λαβών — «взяв» (прич. аориста); ἔδωκεν — «отдал»."
  7: "δύο ἁμάξας καὶ τέσσαρας βόας — «две повозки и четыре вола». υἱοῖς Γεδσων — «сынам Гирсоновым» (в корпусе ゲルション). κατὰ τὰς λειτουργίας αὐτῶν — «по службам их»."
  8: "Μεραρι — Мерари (メラリ). διὰ Ιθαμαρ υἱοῦ Ααρων τοῦ ἱερέως — «через Ифамара, сына Аарона, священника», т.е. под его надзором."
  9: "υἱοῖς Κααθ οὐκ ἔδωκεν — «сынам Каафовым не дал» (カアト, как в корпусе). τὰ λειτουργήματα τοῦ ἁγίου ἔχουσιν — «они имеют служения святыни»; ἐπ᾽ ὤμων ἀροῦσιν — «на плечах понесут» (αἴρω)."
  10: "εἰς τὸν ἐγκαινισμὸν τοῦ θυσιαστηρίου — «на обновление жертвенника» (ἐγκαινισμός — 奉献). ἀπέναντι τοῦ θυσιαστηρίου — «напротив жертвенника»."
  11: "Ἄρχων εἷς καθ᾽ ἡμέραν — «начальник один в день»; повтор καθ᾽ ἡμέραν сохранён (слав. «князь един на день, князь на день»)."
  12: "ἦν ὁ προσφέρων … τὸ δῶρον αὐτοῦ — «был приносящий дар свой», буквальная конструкция LXX передана оборотом «献げたのは…であった». Ναασσων υἱὸς Αμιναδαβ — Наассон, сын Аминадава. ἄρχων τῆς φυλῆς Ιουδα — «начальник племени Иуды»."
  13: "τρυβλίον ἀργυροῦν — «серебряное блюдо» (銀の皿); ὁλκὴ αὐτοῦ — «вес его»; τριάκοντα καὶ ἑκατὸν — «сто тридцать» (в греч. порядок «тридцать и сто»); φιάλη — «чаша» (銀の鉢); ἑβδομήκοντα σίκλων κατὰ τὸν σίκλον τὸν ἅγιον — «семьдесят сиклей по сиклю святому»; ἀμφότερα πλήρη σεμιδάλεως ἀναπεποιημένης ἐν ἐλαίῳ εἰς θυσίαν — «оба полны пшеничной муки, смешанной с елеем, в жертву» (θυσία здесь — хлебное приношение, 素祭)."
  14: "θυίσκη — «кадильница, фимиамник» (金の火皿); δέκα χρυσῶν — «десяти золотых» (сиклей); πλήρης θυμιάματος — «полная курения» (θυμίαμα — 香)."
  15: "μόσχος ἐκ βοῶν — «телец из крупного скота»; κριός — «овен»; ἀμνὸς ἐνιαύσιος — «агнец однолетний». εἰς ὁλοκαύτωμα — «во всесожжение»."
  16: "χίμαρος ἐξ αἰγῶν — «козёл из коз»; περὶ ἁμαρτίας — «за грех», т.е. в жертву за грех."
  17: "δαμάλεις δύο — «две телицы» (δάμαλις — молодая корова, 雌牛); слав. «юницы две»; Синодальный «два вола» неточен. τράγοι πέντε — «пять козлов». τοῦτο τὸ δῶρον Ναασσων υἱοῦ Αμιναδαβ — «вот дар Наассона, сына Аминадава» (род. принадлежности)."
  18: "Τῇ ἡμέρᾳ τῇ δευτέρᾳ προσήνεγκεν — «во второй день принёс»; здесь глагол есть, в отличие от ст. 24 и далее."
