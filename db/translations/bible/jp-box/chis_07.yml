  84: "ἐγκαινισμός — «обновление, освящение» (祭壇の奉献). ᾗ ἡμέρᾳ ἔχρισεν αὐτό — «в день, когда помазал его» (подлежащее — Моисей, ср. ст. 1; в японском пассив). παρὰ τῶν ἀρχόντων — «от начальников». τρυβλία … φιάλαι … θυίσκαι — перечисление в им. падеже без глагола."
  85: "τὸ τρυβλίον τὸ ἕν — «блюдо одно»; πᾶν τὸ ἀργύριον τῶν σκευῶν — «всё серебро сосудов»; δισχίλιοι καὶ τετρακόσιοι σίκλοι — «две тысячи четыреста сиклей»."
  86: "θυίσκαι χρυσαῖ δώδεκα πλήρεις θυμιάματος — «кадильниц золотых двенадцать, полных курения»; πᾶν τὸ χρυσίον τῶν θυισκῶν εἴκοσι καὶ ἑκατὸν χρυσοῖ — «всё золото кадильниц — сто двадцать золотых» (χρυσοῖ — золотые сикли)."
  87: "πᾶσαι αἱ βόες εἰς ὁλοκαύτωσιν — «все волы во всесожжение» (им. падеж подлежащего при перечислении); μόσχοι δώδεκα, κριοὶ δώδεκα, ἀμνοὶ ἐνιαύσιοι δώδεκα; αἱ θυσίαι αὐτῶν καὶ αἱ σπονδαὶ αὐτῶν — «их хлебные приношения и возлияния» (слав. «жертвы их и возлияния их»)."
  88: "δαμάλεις εἴκοσι τέσσαρες — «двадцать четыре телицы»; ἀμνάδες ἑξήκοντα ἐνιαύσιαι ἄμωμοι — «шестьдесят агниц однолетних непорочных». μετὰ τὸ πληρῶσαι τὰς χεῖρας αὐτοῦ — «после наполнения рук его», идиома посвящения (слав. «по исполнении рук его»); καὶ μετὰ τὸ χρῖσαι αὐτόν — «и после помазания его» (祭壇が整えられ)."
  89: "ἐν τῷ εἰσπορεύεσθαι Μωυσῆν — «когда Моисей входил» (ἐν + дат. с инфинитивом). λαλῆσαι αὐτῷ — «говорить ему»; неясно, кто с кем (слав. «глаголати ему», Синодальный «чтобы говорить с Господом»), поэтому «主と語るとき». ἄνωθεν τοῦ ἱλαστηρίου — «свыше очистилища» (ἱλαστήριον — 贖いの座); ἀνὰ μέσον τῶν δύο χερουβιμ — «между двух херувимов». ἐλάλει πρὸς αὐτόν — имперфект: «и говорил ему» (постоянно)."
