  71: "また、酬恩祭[しゅうおんさい]の犠牲[ぎせい]のために、雌牛[めうし]二[に]頭[とう]、雄羊[おひつじ]五[ご]頭[とう]、雄山羊[おやぎ]五頭、一歳[いっさい]の子羊[こひつじ]五頭。これがアミシャダイの子[こ]アヒエゼルの捧[ささ]げ物[もの]である。"
  72: "十一日目[じゅういちにちめ]に捧[ささ]げ物[もの]を献[ささ]げたのは、アシェルの部族[ぶぞく]の長[かしら]、オフランの子[こ]パギエルであった。"
  73: "その捧[ささ]げ物[もの]は、銀[ぎん]の皿[さら]一[ひと]つ、その重[おも]さは百三十[ひゃくさんじゅう]シケル、銀の鉢[はち]一つは七十[ななじゅう]シケル、聖[せい]なるシケルによる。二[ふた]つとも、油[あぶら]を混[ま]ぜた小麦粉[こむぎこ]を満[み]たしたもので、素祭[そさい]のためである。"
  74: "金[きん]の火皿[ひざら]一[ひと]つ、十[じゅう]シケルで、香[こう]を満[み]たしたもの。"
