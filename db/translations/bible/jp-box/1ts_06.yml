verses:
  1: "主[しゅ]の箱[はこ]はペリシテ人の野[の]に七[なな]か月[げつ]あった。その間[あいだ]、彼[かれ]らの地[ち]は鼠[ねずみ]で沸[わ]き立[た]った。"
  2: "ペリシテ人は祭司[さいし]たちと占[うらな]い師[し]たちと呪術師[じゅじゅつし]たちを呼[よ]んで言[い]った。「主[しゅ]の箱[はこ]をどうしたらよいか。それをどのようにして、もとの場所[ばしょ]へ送[おく]ればよいかを教[おし]えてくれ。」"
  3: "彼[かれ]らは言[い]った。「イスラエルの神[かみ]である主[しゅ]の契約[けいやく]の箱[はこ]を送[おく]り返[かえ]すなら、空[から]のままでは送り返してはならない。必[かなら]ず償[つぐな]いの供[そな]え物[もの]を添[そ]えて返しなさい。そうすれば、あなたがたは癒[い]やされ、その手[て]があなたがたから離[はな]れることもわかるだろう。」"
  4: "ペリシテ人[じん]は言[い]った。「償[つぐな]いとして何[なに]を返[かえ]せばよいのか。」祭司[さいし]たちは答[こた]えた。「ペリシテ人の領主[りょうしゅ]の数[かず]に合[あ]わせて、金[きん]の腫[は]れ物[もの]五[いつ]つと金の鼠[ねずみ]五つ。あなたがたにも、あなたがたの支配者[しはいしゃ]たちにも、民[たみ]にも、同[おな]じ一[ひと]つの災[わざわ]いが及[およ]んだからである。"
  5: "だから、あなたがたの腫[は]れ物[もの]の像[ぞう]と、あなたがたの地[ち]を荒[あ]らす鼠[ねずみ]の金[きん]の像を作[つく]り、イスラエルの神[かみ]に栄光[えいこう]を帰[かえ]しなさい。そうすれば、主はあなたがたの上[うえ]から、あなたがたの神々[かみがみ]の上から、あなたがたの地の上から、その手[て]を軽[かる]くしてくださるかもしれない。"
  6: "なぜ、エジプトとファラオが自分[じぶん]たちの心[こころ]を頑[かた]くしたように、あなたがたは心を頑くするのか。主[しゅ]が彼[かれ]らを嘲[あざけ]られたとき、彼らは民[たみ]を送[おく]り出[だ]し、民は去[さ]ったではないか。"
  7: "今[いま]、新[あたら]しい車[くるま]を一[ひと]つ作[つく]り、子[こ]を産[う]んだばかりで子牛[こうし]を連[つ]れていない雌牛[めうし]二頭[にとう]を取[と]り、まだくびきを負[お]ったことのないその雌牛を車につなぎなさい。子牛たちは雌牛の後[うし]ろから家[いえ]へ連れ帰[かえ]りなさい。"
  8: "あなたがたは主[しゅ]の箱[はこ]を取[と]って車[くるま]に載[の]せ、償[つぐな]いとして返[かえ]す金[きん]の品々[しなじな]を箱に入[い]れてそのそばに置[お]き、それを送[おく]り出[だ]して行[ゆ]かせなさい。"
  9: "そして見[み]なさい。それが自分[じぶん]の境[さかい]の道[みち]をベトサミスへ向[む]かって行[ゆ]けば、この大[おお]きな災[わざわ]いは主[しゅ]がわたしたちに下[くだ]したのだ。もしそうでなければ、わたしたちを打[う]ったのはその手[て]ではなく、このことは偶然[ぐうぜん]にわたしたちに起[お]こったのだと、わたしたちは知[し]るだろう。」"
  10: "ペリシテ人はそのとおりに行[おこな]い、子[こ]を産[う]んだばかりの雌牛[めうし]二頭[にとう]を取[と]って車[くるま]につなぎ、その子牛[こうし]たちは家[いえ]に閉[と]じ込[こ]めた。"
  11: "彼[かれ]らは主[しゅ]の箱[はこ]を車[くるま]に載[の]せ、金[きん]の鼠[ねずみ]と腫[は]れ物[もの]の像[ぞう]を入[い]れた箱を載せた。"
  12: "雌牛[めうし]たちはベトサミスへの道[みち]へまっすぐに向[む]かい、一[ひと]つの道を進[すす]んだ。疲[つか]れながらも、右[みぎ]にも左[ひだり]にもそれなかった。ペリシテ人の領主[りょうしゅ]たちはベトサミスの境[さかい]まで、そのうしろを追[お]って行[ゆ]った。"
  13: "ベトサミスの人[ひと]たちは谷[たに]で小麦[こむぎ]の刈[か]り入[い]れをしていた。彼らは目[め]を上[あ]げて主[しゅ]の箱[はこ]を見[み]ると、それを迎[むか]えて喜[よろこ]んだ。"
  14: "車[くるま]はベトサミスにあるホセアの畑[はたけ]に入[はい]って、そこで止[と]まった。そこに彼[かれ]らは大[おお]きな石[いし]をそのそばに立[た]て、車を割[わ]って薪[たきぎ]にし、雌牛[めうし]を主[しゅ]への燔祭[はんさい]としてささげた。"
  15: "レビ人[びと]は主[しゅ]の箱[はこ]と、それとともにあった箱、すなわちその中[なか]の金[きん]の品々[しなじな]を下[お]ろして、大[おお]きな石[いし]の上[うえ]に置[お]いた。ベトサミスの人[ひと]たちはその日[ひ]、主に燔祭[はんさい]と犠牲[ぎせい]をささげた。"
  16: "ペリシテ人の五[いつ]つの領主[りょうしゅ]たちはこれを見[み]て、その日[ひ]、アシュケロンへ帰[かえ]った。"
  17: "ペリシテ人が主[しゅ]への償[つぐな]いの供[そな]え物[もの]として返[かえ]した金[きん]の腫[は]れ物は次[つぎ]のとおりである。アシュドドの分[ぶん]に一[ひと]つ、ガザの分に一つ、アシュケロンの分に一つ、ガテの分に一つ、エクロンの分に一つ。"
  18: "金[きん]の鼠[ねずみ]の数[かず]は、五[いつ]つの領主[りょうしゅ]に属[ぞく]するペリシテ人のすべての町[まち]の数に合[あ]わせて、すなわち城壁[じょうへき]のある町からフェレズ人[じん]の村[むら]に至[いた]るまで、また主[しゅ]の契約[けいやく]の箱[はこ]を載[の]せた大[おお]きな石[いし]に至るまで、その数であった。その石は今日[きょう]に至るまで、ベトサミス人ホセアの野[の]にある。"
  19: "主[しゅ]はベトサミスの人[ひと]たちのうち、エコニアの子[こ]らを打[う]たれた。彼[かれ]らは主の箱[はこ]を見[み]ても喜[よろこ]ばなかったからである。主は民[たみ]のうち七十人[ななじゅうにん]と五万人[ごまんにん]を打たれた。民は嘆[なげ]いた。主が民をきわめて大[おお]きく打たれたからである。"
  20: "ベトサミスの人[ひと]たちは言[い]った。「この聖[せい]なる主[しゅ]の前[まえ]を、だれが通[とお]ることができるのか。主の箱[はこ]がわたしたちから離[はな]れて、だれのところへ上[のぼ]って行[ゆ]くのか。」"
  21: "そこで彼[かれ]らは使[つか]いをキリアト・ヤリムの人[ひと]たちのところへ遣[つか]わして言[い]った。「ペリシテ人は主[しゅ]の箱[はこ]を返[かえ]した。下[お]りて来[き]て、それをあなたがたのところへ運[はこ]び上[あ]げなさい。」"

notes:
  1: "ἦν ἡ κιβωτὸς ἐν ἀγρῷ τῶν ἀλλοφύλων — ковчег был в поле (области) филистимлян; ἀγρός — поле, здесь «земля, область». ἑπτὰ μῆνας — семь месяцев. ἐξέζεσεν ἡ γῆ αὐτῶν μύας — «вскипела земля их мышами» (ἐκζέω), отсюда 鼠で沸き立った. Слав. «кивот Господень» при гр. ἡ κιβωτός: «Господень» — церковное обозначение того же ковчега, имя передаётся постоянным 契約の箱, поэтому без ."
  2: "καλοῦσιν … τοὺς ἱερεῖς καὶ τοὺς μάντας καὶ τοὺς ἐπαοιδούς — призвали жрецов, гадателей (μάντεις, 占い師) и заклинателей (ἐπαοιδοί, 呪術師); слав. «жерцев и волхвов и обаянников». Τί ποιήσωμεν τῇ κιβωτῷ κυρίου — «что сделаем ковчегу Господню» (дат. при глаголе). γνωρίσατε — «сообщите, научите» (γνωρίζω). ἐν τίνι ἀποστελοῦμεν — «чем/как пошлём» (ἐν τίνι — способ)."
  3: "εἰ ἐξαπεστέλλετε … μὴ δὴ ἐξαποστείλητε — если отсылаете, то не отсылайте (условная конструкция с запретом). κενήν — «пустой» (κενός), т.е. без даров. ἀποδιδόντες ἀπόδοτε — «отдавая отдайте» (усилительное сочетание). τῆς βασάνου — «мучения»: так назван дар возмещения (βασανός), 償いの供え物. τότε ἰαθήσεσθε — тогда исцелитесь (ἰάομαι). ἐξιλασθήσεται ὑμῖν — умилостивится вам (ἐξιλάσκομαι). μὴ οὐκ ἀποστῇ ἡ χεὶρ αὐτοῦ — μὴ οὐ с сослагательным = решительное утверждение: «разве не отступит», передано «離れることもわかる»."
  4: "Τί τὸ τῆς βασάνου ἀποδώσομεν — «что [из] мучения отдадим»; в гр. подлежащее не названо (мн. ч.), по контексту спрашивают филистимляне, отвечают жрецы — в тексте названы прямо. Κατ᾽ ἀριθμὸν τῶν σατραπῶν — по числу сатрапов/князей (領主). πέντε ἕδρας χρυσᾶς — пять золотых «седалищ», т.е. изображений наростов (см. 5:3, 5:9). πταῖσμα ἓν ὑμῖν — «одно падение вам», одна и та же казнь (πταῖσμα). Слав. добавляет «и пять мышей златых» — в гр. 6:4 мышей нет (проверено: μυσ — НЕТ), они появляются в 6:5; поэтому добавление взято в …."
  5: "ὁμοίωμα τῶν μυῶν — подобие, изображение мышей (ὁμοίωμα). τῶν διαφθειρόντων τὴν γῆν — опустошающих землю (διαφθείρω). δώσετε τῷ κυρίῳ δόξαν — воздайте Господу славу. ὅπως κουφίσῃ — чтобы облегчил (κουφίζω). Слав. добавляет «сотворите подобие седалищ ваших» — в гр. 6:5 только мыши (проверено: εδρα — НЕТ), поэтому в …."
  6: "βαρύνετε τὰς καρδίας — отягощаете сердца (βαρύνω). ὡς ἐβάρυνεν Αἴγυπτος καὶ Φαραω — как отяготили Египет и фараон. οὐχὶ ὅτε ἐνέπαιξεν αὐτοῖς — «не тогда ли, когда Он посмеялся над ними» (ἐμπαίζω); подлежащее в гр. не названо, подразумевается Бог, отсюда 主. ἐξαπέστειλαν — отпустили; ἀπῆλθον — ушли."
  7: "ἅμαξαν καινήν — колесница новая (ἅμαξα). δύο βόας πρωτοτοκούσας ἄνευ τῶν τέκνων — двух коров первородящих, без телят (πρωτοτοκέω; ἄνευ — «без»), отсюда 子牛を連れていない. ζεύξατε — впрягите (ζεύγνυμι). ἀπαγάγετε τὰ τέκνα … εἰς οἶκον — уведите телят домой (ἀπάγω). Слав. добавляет «на нихже не бяше ярмо» — в гр. этого нет (проверено: ζυγο — НЕТ), поэтому …; ср. Синод. «на которых не было ярма»."
  8: "λήμψεσθε … θήσετε — возьмёте … положите. σκεύη τὰ χρυσᾶ — золотые сосуды/вещи, 金の品々. θήσετε ἐν θέματι βερσεχθαν ἐκ μέρους αὐτῆς — «положите в ящике берсехфан сбоку его»: θέμα — ящик, βερσεχθαν — транслитерация евр. אַרְגָּז (ящик), слово тёмное; слав. «в ковчежце от страны его». ἀπελάσατε — погоните, отправьте (ἀπελαύνω)."
  9: "εἰς ὁδὸν ὁρίων αὐτῆς πορεύσεται κατὰ Βαιθσαμυς — «пойдёт ли дорогою пределов своих к Вефсамису» (ὅρια — пределы). αὐτὸς πεποίηκεν ἡμῖν τὴν κακίαν — «он сделал нам зло». ἐὰν μή — если же нет. οὐ χεὶρ αὐτοῦ ἧπται ἡμῶν — не рука Его коснулась нас (ἅπτω). σύμπτωμα — случай, случайность (σύμπτωμα)."
  10: "ἐποίησαν οὕτως — сделали так. ἔζευξαν — впрягли. ἀπεκώλυσαν εἰς οἶκον — «заперли, удержали дома» (ἀποκωλύω); слав. «затвориша в доме»."
  11: "ἔθεντο τὴν κιβωτὸν ἐπὶ τὴν ἅμαξαν — положили ковчег на колесницу. τὸ θέμα εργαβ — ящик «ергав» (θέμα — ящик; εργαβ — транслитерация, слав. «ковчежец»). τοὺς μῦς τοὺς χρυσοῦς — золотых мышей. Слав. добавляет «и подобия седалищ своих» — в гр. 6:11 их нет (проверено: εδρα — НЕТ), поэтому … при слове 箱."
  12: "κατεύθυναν αἱ βόες ἐν τῇ ὁδῷ εἰς ὁδὸν Βαιθσαμυς — направились коровы по дороге к Вефсамису (κατευθύνω). ἐν τρίβῳ ἑνὶ ἐπορεύοντο — шли по одной тропе (τρίβος). ἐκοπίων — трудились, уставали (κοπιάω); Синод. (МТ) «мычали» — расхождение, в тексте по гр. οὐ μεθίσταντο δεξιὰ οὐδὲ ἀριστερά — не уклонялись ни вправо, ни влево (μεθίστημι). ἕως ὁρίων — до пределов."
  13: "ἐθέριζον θερισμὸν πυρῶν ἐν κοιλάδι — жали жатву пшеницы в долине (θερίζω, πυρός, κοιλάς). ἦραν ὀφθαλμούς — подняли глаза. ηὐφράνθησαν εἰς ἀπάντησιν αὐτῆς — обрадовались, [выйдя] навстречу ей (εὐφραίνω, ἀπάντησις)."
  14: "εἰσῆλθεν εἰς ἀγρὸν Ωσηε τὸν ἐν Βαιθσαμυς — вошла на поле Осии, что в Вефсамисе (Ωσηε — Осия, ホセア; Синод. «Иисуса» — масоретское чтение). ἔστησαν ἐκεῖ παρ᾽ αὐτῇ λίθον μέγαν — поставили там при ней большой камень. σχίζουσιν τὰ ξύλα τῆς ἁμάξης — раскалывают дерево колесницы (σχίζω), т.е. разбирают её на дрова (薪). ἀνήνεγκαν εἰς ὁλοκαύτωσιν — принесли во всесожжение (ἀναφέρω, ὁλοκαύτωμα)."
  15: "οἱ Λευῖται — левиты (Λευίτης). ἀνήνεγκαν τὴν κιβωτὸν — «вознесли», здесь сняли/подняли ковчег. τὸ θέμα εργαβ μετ᾽ αὐτῆς — ящик «ергав» при нём. τὰ ἐπ᾽ αὐτῆς σκεύη τὰ χρυσᾶ — золотые вещи при нём; слав. «яже в нем». ἔθεντο ἐπὶ τοῦ λίθου τοῦ μεγάλου — положили на большом камне. ὁλοκαυτώσεις καὶ θυσίας — всесожжения и жертвы (θυσία)."
  16: "οἱ πέντε σατράπαι — пять князей/владетелей. ἑώρων — смотрели (ὁράω, имперф.). ἀνέστρεψαν εἰς Ἀσκαλῶνα — возвратились в Аскалон (ἀναστρέφω); слав. и Синод. читают «в Аккарон» (это расхождение с базой, перевод по гр., アシュケロン)."
  17: "αἱ ἕδραι αἱ χρυσαῖ — золотые «седалища», изображения наростов (см. 5:3). ἃς ἀπέδωκαν … τῆς βασάνου — которые отдали в возмещение мучения. Перечень городов: Ἀζωτος (アシュドド), Γάζα (ガザ), Ἀσκαλών (アシュケロン), Γεθ (ガテ), Ακκαρων (エクロン) — по одной от каждого."
  18: "κατ᾽ ἀριθμὸν πασῶν πόλεων — по числу всех городов. ἐκ πόλεως ἐστερεωμένης — от города укреплённого (στερεόω). ἕως κώμης τοῦ Φερεζαίου — до села ферезея (Φερεζαῖος, フェレズ人). ἕως λίθου τοῦ μεγάλου, οὗ ἐπέθηκαν ἐπ᾽ αὐτοῦ τὴν κιβωτόν — до большого камня, на который положили ковчег (ἐπιτίθημι). τοῦ ἐν ἀγρῷ Ωσηε τοῦ Βαιθσαμυσίτου — что на поле Осии вефсамитянина. Синтаксис гр. обрывочен (перечень без сказуемого) — так и передано."
  19: "οὐκ ἠσμένισαν — не возрадовались (ἀσμενίζω, редк.); οἱ υἱοὶ Ιεχονιου — «сыны Иехонии» (Ιεχονιας, エコニア); слав. «сынове иехониины», Синод. (МТ) «заглядывали в ковчег» — иное чтение, перевод по гр. ὅτι εἶδαν κιβωτὸν κυρίου — потому что увидели ковчег Господень. ἑβδομήκοντα ἄνδρας καὶ πεντήκοντα χιλιάδας ἀνδρῶν — 70 мужей и 50 тысяч мужей (всего 50 070); слав. порядок обратный. ἐπένθησεν — восскорбел (πενθέω). πληγὴ μεγάλη σφόδρα — поражение весьма великое."
  20: "Τίς δυνήσεται διελθεῖν ἐνώπιον κυρίου τοῦ ἁγίου τούτου — «кто сможет пройти пред Господом, сим святым» (διέρχομαι). πρὸς τίνα ἀναβήσεται — «к кому взойдёт» (ἀναβαίνω). Слав. «кивот завета Господня»: «завета» в гр. нет (проверено: διαθηκ — НЕТ), но 契約の箱 — постоянное имя ковчега в корпусе, поэтому без ."
  21: "ἀποστέλλουσιν ἀγγέλους — посылают послов (ἄγγελος, здесь «посол», 使い). τοὺς κατοικοῦντας Καριαθιαριμ — жителей Кириаф-Иарима (Καριαθιαριμ, キリアト・ヤリム). Ἀπεστρόφασιν — «возвратили» (ἀποστρέφω, перфект с окончанием -ασιν). κατάβητε καὶ ἀναγάγετε — сойдите и вознесите (καταβαίνω, ἀνάγω)."
