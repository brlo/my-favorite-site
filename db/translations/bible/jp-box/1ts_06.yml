# jp-box, 1-я Царств, глава 6. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в 1 Царств нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 6: совет жрецов и гадателей (1–9), колесница с коровами (10–12),
# прибытие в Вефсамис и жертва (13–15), возвращение князей (16),
# золотые дары и большой камень (17–18), поражение вефсамитян (19),
# вопрос о ковчеге и посольство в Кириаф-Иарим (20–21).
# Речь — 「…」: 6:2 (филистимляне), 6:3–9 (ответ жрецов; в 6:4 внутри — вопрос
# филистимлян и начало ответа, дальше до 6:9 идёт та же речь без вложенных кавычек),
# 6:20 (вефсамитяне), 6:21 (посольство).
# Красного и синего нет: <j>/<mo> не ставятся.
# 〔…〕: 6:4 〔と金の鼠五つ〕, 6:5 〔あなたがたの腫れ物の像と〕, 6:7
# 〔まだくびきを負ったことのない〕, 6:11 〔腫れ物の像を入れた〕 — слова церковного
# чтения (csl), которых нет в gr-lxx-byz; проверено по базе (μυσ, εδρα, ζυγο — НЕТ).
# Не в 〔…〕, а в notes: слав. «кивот Господень» в 6:1 (в гр. только ἡ κιβωτός) —
# обозначение того же ковчега, имя передаётся постоянным 契約の箱.
# Сносок ⟨…⟩ нет: 契約の箱, 燔祭, レビ人, ペリシテ人 уже в корпусе.
# Отличия LXX от слав./Синод.: 6:16 в гр. возвращаются в Аскалон, у слав./Синод. —
# в Аккарон (перевод по базе); 6:19 в гр. «сыны Иехонии», у Синод. (МТ) —
# «заглядывали в ковчег»; 6:14 Ωσηε — Осия, у Синод. «Иисус».
# jp-ni не использовался.

