verses:
  1: "「また、記録[きろく]のうちに、預言者[よげんしゃ]エレミヤが移[うつ]された者[もの]たちに火[ひ]を持[も]ち運[はこ]ぶように命[めい]じたことが見[み]出[い]だされる。しるしをもって示[しめ]されたとおりである。"
  2: "すなわち、預言者が移[うつ]された者[もの]たちに律法[りっぽう]を与[あた]えて命じたのは、主[しゅ]の戒[いまし]めを忘[わす]れず、金[きん]や銀[ぎん]の像[ぞう]とその周[まわ]りの飾[かざ]りを見[み]て心[こころ]に迷[まよ]わないためであった。"
  3: "そして、これに類[るい]したことを多[おお]く語[かた]って、律法[りっぽう]が彼らの心[こころ]から離[はな]れないように勧[すす]めた。"
  4: "また、書[しょ]のうちには、預言者[よげんしゃ]が、自分[じぶん]に神[かみ]の答[こた]えがあったので、幕屋[まくや]と箱[はこ]が自分に従[したが]って来[く]るように命[めい]じたことがあった。そして、モーセが登[のぼ]って神の嗣業[しぎょう]を見[み]たその山[やま]へ出[で]て行[い]った。"
  5: "エレミヤがそこへ行[い]くと、洞窟[どうくつ]のような住[す]まいを見[み]つけ、幕屋[まくや]と箱[はこ]と香[こう]の祭壇[さいだん]をそこへ運[はこ]び入[い]れ、戸口[とぐち]をふさいだ。"
  6: "そして、あとから従[したが]って来[き]た者[もの]たちのうちの幾人[いくにん]かが道[みち]をしるそうとして近[ちか]づいたが、見[み]つけることができなかった。"
  7: "エレミヤはそれを知[し]って、彼らを責[せ]めて言[い]った。『その場所[ばしょ]は、神[かみ]が民[たみ]の集[つど]いを集[あつ]め、憐[あわ]れみ深[ふか]くならされる時[とき]まで、知[し]られないままであろう。』"
  8: "そしてそのとき、主[しゅ]はこれらのものを示[しめ]される。主の栄光[えいこう]と雲[くも]が、モーセのときに示[しめ]されたように現[あら]われる。ソロモンが、その場所[ばしょ]が大[おお]いに聖[せい]なるものとされるようにと願[ねが]ったとおりである。"
  9: "また、彼が知恵[ちえ]を備[そな]えて、神殿[しんでん]の奉献[ほうけん]と完成[かんせい]の犠牲[ぎせい]を捧[ささ]げたことも、明[あき]らかにされた。"
  10: "モーセが主[しゅ]に祈[いの]ると、天[てん]から火[ひ]が降[ふ]って犠牲[ぎせい]のためのものを焼[や]き尽[つ]くしたように、ソロモンもまた祈ると、降[ふ]って来[き]た火が燔祭[はんさい]を焼き尽くした。"
  11: "そのときモーセは言[い]った。『罪[つみ]のためのものは食[た]べられなかったので、焼[や]き尽[つ]くされたのだ。』"
  12: "同[おな]じように、ソロモンも八日間[ようかかん]を祝[いわ]った。"
  13: "また、これらのことは、ネヘミヤの時の記録[きろく]と覚[おぼ]え書[がき]の中にも語[かた]られている。彼は図書館[としょかん]を建[た]てて、王[おう]たちと預言者[よげんしゃ]たちについての書[しょ]、ダビデの書、王たちが聖[せい]なる奉納物[ほうのうもの]について書[か]いた手紙[てがみ]を集[あつ]めた。"
  14: "同[おな]じように、ユダもまた、戦[いくさ]のために散[ち]り散[ぢ]らになったものをすべて集[あつ]めた。それらはわたしたちのもとにある。"
  15: "あなたがたがそれらを必要[ひつよう]とするなら、それを持[も]って行[い]く者[もの]たちを遣[つか]わしなさい。"
  16: "わたしたちは、清[きよ]めの祭[まつ]りを祝[いわ]おうとしているので、あなたがたに書[か]き送[おく]った。あなたがたもこの日[ひ]々を祝うなら、良[よ]いことをしたことになる。"
  17: "すべての民[たみ]を救[すく]い、すべての者[もの]に嗣業[しぎょう]と王国[おうこく]と祭司[さいし]の務[つと]めと聖[せい]なることを返[かえ]される神[かみ]が、"
  18: "律法[りっぽう]によって約束[やくそく]されたとおりに。わたしたちは神[かみ]に望[のぞ]みを置[お]いている。神は間[ま]もなくわたしたちを憐[あわ]れみ、天[てん]の下[した]から聖[せい]なる場所[ばしょ]へ集[あつ]めてくださる。"
  19: "神はわたしたちを大[おお]きな災[わざわ]いから救[すく]い出[だ]し、その場所を清[きよ]められたのである。」"
  20: "さて、ユダ・マッカバイオスとその兄弟[きょうだい]たちのこと、大[だい]いなる神殿の清[きよ]めと祭壇[さいだん]の再[さい]奉献[ほうけん]、"
  21: "また、アンティオコス・エピファネスとその子[こ]エウパトルとの戦[いくさ]のこと、"
  22: "天[てん]から現[あら]われた顕現[けんげん]のこと、すなわち、ユダヤ人[じん]のために名誉[めいよ]を重[おも]んじて勇敢[ゆうかん]に戦[たたか]った者[もの]たちのこと、彼らは少数[すう]でありながら国[くに]全体[ぜんたい]を荒[あ]らし、異民族[いみんぞく]の群[む]れを追[お]い払[はら]った。"
  23: "また、全[ぜん]世[せ]界[かい]に名[な]を知[し]られた神殿[しんでん]を建[た]て直[なお]し、都[みやこ]を自由[じゆう]にし、壊[こわ]されようとしていた律法[りっぽう]を正[ただ]したこと、主[しゅ]がすっかり寛[かん]大[だい]に彼らと和[やわ]らがれたこと、"
  24: "これらのことは、キュレネのヤソンが五巻[ごかん]の書[しょ]に記[しる]したことを、わたしたちは一つの書[しょ]にまとめて短[みじか]くしようと努[つと]めている。"
  25: "というのは、わたしたちは、数[かず]の多[おお]さと、その資料[しりょう]の多さのゆえに、歴史[れきし]の物語[ものがたり]に関[かか]わろうとする者[もの]たちの難[なん]しさを考[かんが]えて、"
  26: "読[よ]もうとする者[もの]には心[こころ]の慰[なぐさ]めを、記憶[きおく]に留[とど]めようとする者には容易[ようい]さを、目[め]にするすべての者には益[えき]を与[あた]えようと心を配[くば]ったからである。"
  27: "わたしたちが要約[ようやく]の労[ろう]を負[お]うのは容易[ようい]なことではなく、汗[あせ]と眠[ねむ]らずに過[す]ごすことの仕[し]事[ごと]である。"
  28: "饗宴[きょうえん]を設[もう]け、他人[たにん]の益[えき]を求[もと]める者[もの]にとっても楽[らく]なことではない。それでも、多[おお]くの人[ひと]の感謝[かんしゃ]のために、わたしたちはその労苦[ろうく]を喜[よろこ]んで負[お]うであろう。"
  29: "それぞれの事柄[ことがら]について正確[せいかく]に述[の]べることは著者[ちょしゃ]に譲[ゆず]り、わたしたちは要約[ようやく]の筋書[すじがき]に従[したが]って進[すす]むことに力[ちから]を尽[つ]くす。"
  30: "というのは、新[あたら]しい家[いえ]の建築[けんちく]では、全体[ぜんたい]の土台[どだい]に気[き]を配[くば]らねばならないが、絵[え]を描[か]き、彩色[さいしき]しようとする者[もの]は飾[かざ]りに必要[ひつよう]なものを調[しら]べればよい。わたしたちの場合[ばあい]も同[おな]じだと思[おも]う。"
  31: "細部[さいぶ]に立[た]ち入[い]って論[ろん]じ、あれこれと事細[ことこま]かに調[しら]べることは、歴史[れきし]の著者[ちょしゃ]にふさわしい。"
  32: "しかし、言葉[ことば]の簡潔[けんけつ]さを追[お]い求[もと]め、事柄[ことがら]の細[こま]かな叙述[じょじゅつ]を避[さ]けることは、要約[ようやく]を作[つく]る者[もの]に許[ゆる]されるべきである。"
  33: "したがって、わたしたちは、これまで述[の]べてきたことにこれだけを付[け]加[くわ]えて、物語[ものがたり]を始[はじ]めよう。歴史[れきし]の前[まえ]に長々[ながなが]と語[かた]り、歴史そのものを短[みじか]くするのは愚[おろ]かなことだからである。"

notes:
  1: "Εὑρίσκεται δὲ ἐν ταῖς ἀπογραφαῖς — «обретается же в записях» (ἀπογραφή — список, запись, 記録[きろく]); ἐκέλευσεν τοῦ πυρὸς λαβεῖν τοὺς μεταγενομένους — «повелел огня взять переселяемым» (μεταγενόμενος — переселенец); ὡς σεσήμανται — «как было отмечено»."
  2: "δοὺς αὐτοῖς τὸν νόμον — «дав им закон»; ἵνα μὴ ἐπιλάθωνται τῶν προσταγμάτων τοῦ κυρίου — «чтобы не забыли повелений Господних»; ἀγάλματα χρυσᾶ καὶ ἀργυρᾶ — «изваяния золотые и серебряные» (ἄγαλμα — изваяние, 像[ぞう]); τὸν περὶ αὐτὰ κόσμον — «убранство вокруг них»."
  3: "ἕτερα τοιαῦτα λέγων παρεκάλει — «говоря и другое подобное, убеждал»; μὴ ἀποστῆναι τὸν νόμον ἀπὸ τῆς καρδίας αὐτῶν — «не отступить закону от сердца их»."
  4: "χρηματισμοῦ γενηθέντος αὐτῷ — «по бывшему ему откровению (ответу)» (χρηματισμός — божественное изречение); συνακολουθεῖν — «следовать вместе»; οὗ ὁ Μωϋσῆς ἀναβὰς ἐθεάσατο τὴν τοῦ θεοῦ κληρονομίαν — «где Моисей, взойдя, увидел наследие Божие». Слав. «по Божтвенному ответу»."
  5: "οἶκον ἀντρώδη — «жилище пещерное» (ἄντρον — пещера); τὸ θυσιαστήριον τοῦ θυμιάματος — «жертвенник кадильный» (θυμίαμα — фимиам, 香[こう]); τὴν θύραν ἐνέφραξεν — «дверь заградил»."
  6: "ἐπισημάνασθαι τὴν ὁδὸν — «сделать заметку (знак) пути», 道[みち]をしるす; οὐκ ἐδυνήθησαν εὑρεῖν — «не смогли найти»."
  7: "μεμψάμενος αὐτοῖς — «укорив их»; Καὶ ἄγνωστος ὁ τόπος ἔσται — «и неведомо будет место» (слова Иеремии, 『…』); ἕως ἂν συναγάγῃ ὁ θεὸς ἐπισυναγωγὴν τοῦ λαοῦ — «доколе Бог не соберёт собрание народа»; ἵλεως γένηται — «умилостивится»."
  8: "ἀναδείξει ταῦτα — «откроет (покажет) это»; ὀφθήσεται ἡ δόξα τοῦ κυρίου καὶ ἡ νεφέλη — «явится слава Господня и облако»; ὡς ἐπὶ Μωυσῇ ἐδηλοῦτο — «как при Моисее было явлено»; ἠξίωσεν ἵνα ὁ τόπος καθαγιασθῇ μεγάλως — «просил, чтобы место было освящено велико»."
  9: "διεσαφεῖτο — «было объясняемо»; σοφίαν ἔχων — «имея премудрость»; θυσίαν ἐγκαινισμοῦ καὶ τῆς τελειώσεως τοῦ ἱεροῦ — «жертву обновления и совершения храма» (ἐγκαινισμός — 奉献[ほうけん])."
  10: "κατέβη πῦρ ἐκ τοῦ οὐρανοῦ — «сошёл огонь с неба»; τὰ τῆς θυσίας ἐδαπάνησεν — «жертвенное истребил»; ἀνήλωσεν τὰ ὁλοκαυτώματα — «истребил всесожжения» (ὁλοκαύτωμα — 燔祭[はんさい])."
  11: "Διὰ τὸ μὴ βεβρῶσθαι τὸ περὶ τῆς ἁμαρτίας ἀνηλώθη — «за то, что не было съедено то, что за грех, было истреблено»: слова Моисея, 『…』."
  12: "τὰς ὀκτὼ ἡμέρας ἤγαγεν — «восемь дней праздновал»: ср. 1:9; восьмидневное торжество обновления (ср. 1 Езд и 2 Пар 7:9)."
  13: "ἐν ταῖς ἀναγραφαῖς καὶ ἐν τοῖς ὑπομνηματισμοῖς τοῖς κατὰ τὸν Νεεμιαν — «в записях и памятных книгах, бывших при Неемии»; καταβαλλόμενος βιβλιοθήκην — «составляя библиотеку» (καταβάλλω — класть основание, 建[た]てる); τὰ περὶ τῶν βασιλέων βιβλία καὶ προφητῶν — «книги о царях и пророках»; ἐπιστολὰς βασιλέων περὶ ἀναθεμάτων — «письма царей о приношениях (посвящённом)» (ἀνάθεμα — посвящённое, 奉納物[ほうのうもの])."
  14: "τὰ διαπεπτωκότα διὰ τὸν γεγονότα πόλεμον ἡμῖν — «растерянное из-за бывшей у нас войны»; ἐπισυνήγαγεν πάντα, καὶ ἔστιν παρ᾽ ἡμῖν — «собрал всё, и есть у нас»."
  15: "ὧν οὖν ἐὰν χρείαν ἔχητε — «в чём если имеете нужду»; τοὺς ἀποκομιοῦντας ὑμῖν ἀποστέλλετε — «доставляющих вам пошлите» (ἀποκομίζω — доставлять)."
  16: "Μέλλοντες ἄγειν τὸν καθαρισμὸν — «намереваясь праздновать очищение»; καλῶς ποιήσετε ἄγοντες τὰς ἡμέρας — «хорошо сделаете, празднуя дни»."
  17: "ὁ σώσας τὸν πάντα λαὸν αὐτοῦ — «спасший весь народ Свой»; ἀποδοὺς τὴν κληρονομίαν πᾶσιν — «воздавший наследие всем» (слав. «воздавый наследие всем»); τὸ βασίλειον καὶ τὸ ἱεράτευμα καὶ τὸν ἁγιασμόν — «царство и священство и освящение»."
  18: "καθὼς ἐπηγγείλατο διὰ τοῦ νόμου — «как обещал через закон»; ἐπισυνάξει ἐκ τῆς ὑπὸ τὸν οὐρανὸν εἰς τὸν ἅγιον τόπον — «соберёт из поднебесной в место святое». Здесь по слав. стих кончается; хвост gr («ибо Он избавил нас…») — наш 2:19."
  19: "ἐξείλετο γὰρ ἡμᾶς ἐκ μεγάλων κακῶν καὶ τὸν τόπον ἐκαθάρισεν — «ибо Он избавил нас от великих бед и место очистил»: в gr это конец ст. 18, в слав. отдельный стих (слав. 2:19); нумерация по слав. Здесь письмо закрывается."
  20: "Τὰ δὲ κατὰ τὸν Ιουδαν τὸν Μακκαβαῖον — «дела же Иуды Маккавея» (ユダ・マッカバイオス — транслитерация Μακκαβαῖος, далее ユダ); τὸν τοῦ ἱεροῦ τοῦ μεγίστου καθαρισμὸν — «очищение величайшего храма»; τὸν τοῦ βωμοῦ ἐγκαινισμόν — «обновление жертвенника» (βωμός — жертвенник, 祭壇[さいだん]). Начало предисловия сокращателя; здесь кончается письмо."
  21: "τοὺς πρὸς Ἀντίοχον τὸν Ἐπιφανῆ καὶ τὸν τούτου υἱὸν Εὐπάτορα πολέμους — «войны против Антиоха Епифана и сына его Евпатора» (Ἐπιφανής — Εпифан, エピファネス; Εὐπάτωρ — エウパトル)."
  22: "τὰς ἐξ οὐρανοῦ γενομένας ἐπιφανείας — «бывшие с неба явления» (ἐπιφάνεια — явление, 顕現[けんげん], ср. имя Епифан); τοῖς ὑπὲρ τοῦ Ιουδαισμοῦ φιλοτίμως ἀνδραγαθήσασιν — «подвизавшимся за иудейство ревностно» (ἀνδραγαθέω — доблестно действовать); λεηλατεῖν — «опустошать»; τὰ βάρβαρα πλήθη διώκειν — «варварские толпы гнать»."
  23: "τὸ περιβόητον καθ᾽ ὅλην τὴν οἰκουμένην ἱερόν — «прославленный по всей вселенной храм»; ἀνακομίσασθαι — «восстановить» (ἀνακομίζω); τοὺς μέλλοντας καταλύεσθαι νόμους ἐπανορθῶσαι — «имевшие разрушиться законы исправить»; μετὰ πάσης ἐπιεικείας ἵλεω γενομένου αὐτοῖς — «со всякой кротостью умилостивившегося к ним» (ἐπιείκεια — снисхождение)."
  24: "ὑπὸ Ἰάσωνος τοῦ Κυρηναίου δεδηλωμένα διὰ πέντε βιβλίων — «изложенное Иасоном Киренским в пяти книгах»; δι᾽ ἑνὸς συντάγματος ἐπιτεμεῖν — «одним сочинением сократить» (σύνταγμα — сочинение)."
  25: "τὸ χῦμα τῶν ἀριθμῶν — «поток чисел» (χῦμα — наводнение, масса); τὴν οὖσαν δυσχέρειαν τοῖς θέλουσιν εἰσκυκλεῖσθαι τοῖς τῆς ἱστορίας διηγήμασιν — «трудность для желающих вникать в исторические повествования» (εἰσκυκλέομαι — вкатываться, вникать); διὰ τὸ πλῆθος τῆς ὕλης — «из-за множества материала»."
  26: "ἐφροντίσαμεν — «мы позаботились»; ψυχαγωγίαν — «назидание (усладу) души»; εἰς τὸ διὰ μνήμης ἀναλαβεῖν εὐκοπίαν — «чтобы легко удержать в памяти»; πᾶσιν… ὠφέλειαν — «всем пользу»."
  27: "τὴν κακοπάθειαν ἐπιδεδεγμένοις τῆς ἐπιτομῆς — «принявшим на себя труд сокращения» (κακοπάθεια — страдание, труд); ἱδρῶτος δὲ καὶ ἀγρυπνίας τὸ πρᾶγμα — «дело пота и бдения»."
  28: "καθάπερ τῷ παρασκευάζοντι συμπόσιον — «как готовящему пир» (συμπόσιον — 饗宴[きょうえん]); ζητοῦντι τὴν ἑτέρων λυσιτέλειαν — «ищущему пользы других» (λυσιτέλεια — выгода); διὰ τὴν τῶν πολλῶν εὐχαριστίαν — «за благодарность многих»."
  29: "τὸ μὲν διακριβοῦν περὶ ἑκάστων τῷ συγγραφεῖ παραχωρήσαντες — «точное изложение о каждом предоставив писателю»; τοῖς ὑπογράμμοις τῆς ἐπιτομῆς — «начертаниям сокращения» (ὑπόγραμμος — образец, очерк, 筋書[すじがき])."
  30: "τῆς καινῆς οἰκίας ἀρχιτέκτονι τῆς ὅλης καταβολῆς φροντιστέον — «строителю нового дома надлежит заботиться о всём основании»; τῷ ἐγκαίειν καὶ ζωγραφεῖν ἐπιχειροῦντι — «приступающему к выжиганию (восковой живописи) и писанию» — тёмное место, передано 絵を描き、彩色; τὰ ἐπιτήδεια πρὸς διακόσμησιν — «потребное для украшения»."
  31: "τὸ ἐμβατεύειν καὶ περίπατον ποιεῖσθαι λόγων — «входить и совершать обход (пространно говорить)»; πολυπραγμονεῖν ἐν τοῖς κατὰ μέρος — «разбирать подробности»; τῷ τῆς ἱστορίας ἀρχηγέτῃ — «начальнику (первому писателю) истории»."
  32: "τὸ σύντομον τῆς λέξεως μεταδιώκειν — «краткости речи держаться»; τὸ ἐξεργαστικὸν τῆς πραγματείας παραιτεῖσθαι — «тщательной обработки дела избегать»; τῷ τὴν μετάφρασιν ποιουμένῳ — «делающему переложение (сокращение)»."
  33: "ἐντεῦθεν οὖν ἀρξώμεθα τῆς διηγήσεως — «отсюда начнём повествование»; τοῖς προειρημένοις τοσοῦτον ἐπιζεύξαντες — «к прежде сказанному столько присовокупив»; εὔηθες γὰρ τὸ μὲν πρὸ τῆς ἱστορίας πλεονάζειν, τὴν δὲ ἱστορίαν ἐπιτεμεῖν — «ибо неразумно пред историей многословить, а саму историю сокращать»."
