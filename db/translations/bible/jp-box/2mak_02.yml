# jp-box, 2 Маккавейская, глава 2. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной: 33 стиха (у gr — 32). Слав. делит gr 2:18
# на два стиха: наш 2:18 = «как обещал в законе… в место святое», наш 2:19 =
# «ибо Он избавил нас от великих бед и очистил место» (хвост gr 2:18);
# наш 2:20–33 = gr 2:19–32. Это и есть оговорённый добавочный стих по слав.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1–3 заповедь Иеремии переселенцам о законе; 4–8 скиния и ковчег,
# скрытые в пещере, «место будет неизвестно до собирания народа»; 9–12 жертва
# и огонь Соломона, слово Моисея, восемь дней; 13–15 библиотека Неемии и
# собрание книг Иуды; 16–19 конец письма: очищение, надежда на Бога;
# 20–33 предисловие сокращателя: пять книг Иасона Киренского, цель и приёмы.
# Голоса: письмо продолжается с 1:10: кавычки снова открыты в 2:1 и закрыты
# в конце нашего 2:19 (на границе глав закрыты по требованию проверки);
# внутри — слова Иеремии в 7 『…』, слова Моисея в 11 『…』. 20–33 — авторская
# речь сокращателя, без кавычек. Формулы «и сказал» — вне кавычек.
# Имена: エレミヤ, モーセ, ソロモン, ネヘミヤ, ダビデ, ヤソン, ユダ・マッカバイオス.

