# jp-box, Деяния апостолов, глава 17. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий (gr-lxx-byz) — свидетель; расхождения — в 〔…〕 и notes.
# jp-ni не использовался.
#
# Глава 17: Фессалоники (1–9), Верия (10–15), Афины и Ареопаг (16–34).
# Красного в главе нет: речь Павла в Ареопаге (17:22–31) — не слова Христа.
# 〔…〕: 17:5 〔信じなかった〕 (в критической базе только οἱ Ἰουδαῖοι, церковный текст
# читает οἱ ἀπειθοῦντες — «непокорные»); 17:26 〔血〕 (в критической базе ἐξ ἑνὸς,
# церковный текст — «от единыя крове»).
# Сноски: 17:18 (школы), 17:19 (Ареопаг).

