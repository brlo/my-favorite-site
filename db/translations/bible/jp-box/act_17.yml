verses:
  1: "彼[かれ]らはアンフィポリスとアポロニアを通[とお]って、テサロニケへ来[き]た。そこにはユダヤ人[じん]の会堂[かいどう]があった。"
  2: "パウロはいつものように彼[かれ]らのもとへ入[はい]って行[い]き、三[みっ]つの安息日[あんそくび]にわたって、聖書[せいしょ]に基[もと]づいて彼[かれ]らと論[ろん]じ合[あ]った。"
  3: "すなわち、キリストは受難[じゅなん]を受[う]け、死者[ししゃ]の中[なか]から復活[ふっかつ]すべきことを説[と]き明[あか]かし、「わたしがあなたがたに宣[の]べ伝[つた]えているこのイエスこそ、キリストである」と証[あかし]した。"
  4: "彼[かれ]らのうちのある者[もの]たちは納得[なっとく]して、パウロとシラスに従[したが]った。神[かみ]を崇[あが]めるギリシア人[じん]も大勢[おおぜい]、身分[みぶん]の高[たか]い女[おんな]たちも少[すく]なからず加[くわ]わった。"
  5: "しかし、〔信[しん]じなかった〕ユダヤ人[じん]たちは妬[ねた]み、市場[いちば]のならず者[もの]たちを幾人[いくにん]か引[ひ]き込[こ]んで群[むれ]を作[つく]り、町[まち]を騒[さわ]がせた。そしてイアソンの家[いえ]に押[お]し寄[よ]せ、二人[ふたり]を民[たみ]の前[まえ]に引[ひ]き出[だ]そうとした。"
  6: "見[み]つからなかったので、イアソンと兄弟[きょうだい]たち数人[すうにん]を町[まち]の役人[やくにん]たちのところへ引[ひ]きずって行[い]き、叫[さけ]んだ。「世界中[せかいじゅう]をかき乱[みだ]した者[もの]たちが、ここにも来[き]ています。"
  7: "イアソンが彼[かれ]らを泊[と]めたのです。彼[かれ]らは皆[みな]、カエサルの定[さだ]めに背[そむ]いて、イエスという別[べつ]の王[おう]がいるなどと言[い]っています。」"
  8: "これを聞[き]いて、群衆[ぐんしゅう]も町[まち]の役人[やくにん]たちも心[こころ]を騒[さわ]がせた。"
  9: "しかし、役人[やくにん]たちはイアソンたちから保証金[ほしょうきん]を取[と]って、二人[ふたり]を釈放[しゃくほう]した。"
  10: "兄弟[きょうだい]たちはすぐに、夜[よる]のうちにパウロとシラスをベレアへ送[おく]り出[だ]した。二人[ふたり]はそこに着[つ]くと、ユダヤ人[じん]の会堂[かいどう]へ行[い]った。"
  11: "ここの人々[ひとびと]は、テサロニケの人々[ひとびと]よりも、より高潔[こうけつ]な心[こころ]の持[も]ち主[ぬし]で、非常[ひじょう]に熱心[ねっしん]に御言葉[みことば]を受[う]け入[い]れ、本当[ほんとう]にそうなのかと、日[ひ]ごとに聖書[せいしょ]を調[しら]べていた。"
  12: "だから彼[かれ]らのうちの多[おお]くの者[もの]が信[しん]じ、ギリシア人[じん]の身分[みぶん]の高[たか]い女[おんな]たちや男[おとこ]たちも少[すく]なからず信[しん]じた。"
  13: "ところが、テサロニケのユダヤ人[じん]たちは、神[かみ]の御言葉[みことば]がパウロによってベレアにも宣[の]べ伝[つた]えられたことを知[し]ると、そこへもやって来[き]て、群衆[ぐんしゅう]を揺[ゆ]さぶり、かき乱[みだ]した。"
  14: "そこで兄弟[きょうだい]たちは、すぐにパウロを海[うみ]の方[かた]へ送[おく]り出[だ]した。シラスとティモテはなおもそこに残[のこ]った。"
  15: "パウロを案内[あんない]した者[もの]たちは、彼[かれ]をアテネまで連[つ]れて行[い]き、シラスとティモテに「できるだけ早[はや]くわたしのところへ来[き]てほしい」との命[めい]を受[う]けて、帰[かえ]って行[い]った。"
  16: "パウロはアテネで二人[ふたり]を待[ま]っていたが、町[まち]が偶像[ぐうぞう]で満[み]ちているのを見[み]て、心[こころ]の内[うち]に憤[いきどお]りを覚[おぼ]えた。"
  17: "そこで、会堂[かいどう]ではユダヤ人[じん]たちや神[かみ]を崇[あが]める人々[ひとびと]と、また広場[ひろば]では毎日[まいにち]、そこに居合[いあ]わせた人々[ひとびと]と論[ろん]じ合[あ]った。"
  18: "エピクロス派[は]⟨快楽[かいらく]を最高[さいこう]の善[ぜん]とした、ギリシア哲学[てつがく]の一派[いっぱ]。ストア派[は]と並[なら]ぶ二大[にだい]流派[りゅうは]の一つ。⟩やストア派[は]の哲学者[てつがくしゃ]たちも、彼[かれ]と論[ろん]争[そう]した。ある者[もの]たちは「この空言[くうげん]を並[なら]べる者[もの]は、何[なに]を言[い]いたいのか」と言[い]い、ほかの者[もの]たちは「彼[かれ]は他国[たこく]の神々[かみがみ]の宣伝者[せんでんしゃ]らしい」と言[い]った。パウロがイエスと復活[ふっかつ]を宣[の]べ伝[つた]えていたからである。"
  19: "そこで、彼[かれ]らはパウロを捕[つか]まえてアレオパゴス⟨アテネのアクロポリスの西北[せいほく]にある丘[おか]。最高[さいこう]の議会[ぎかい]もここで開[ひら]かれた。⟩へ連[つ]れて行[い]き、こう言[い]った。「あなたが語[かた]っているこの新[あたら]しい教[おし]えが何[なん]であるか、わたしたちに知[し]らせてもらえないだろうか。"
  20: "あなたはわたしたちの耳[みみ]に、聞[き]いたことのないことを入[い]れているからである。だから、それが何[なん]のことなのか知[し]りたいのだ。」"
  21: "アテネの人[ひと]たちも、そこに滞在[たいざい]している外国人[がいこくじん]たちも皆[みな]、何[なに]か新[あたら]しいことを話[はな]したり聞[き]いたりするほかには、時[とき]を過[す]ごさなかったのである。"
  22: "パウロはアレオパゴスの中央[ちゅうおう]に立[た]って言[い]った。「アテネの人々[ひとびと]よ。わたしは、あなたがたがすべてのことにおいて、いかにも宗教心[しゅうきょうしん]の厚[あつ]い人々[ひとびと]であることを見[み]ています。"
  23: "わたしは町[まち]を歩[ある]き、あなたがたが崇[あが]めているものを見[み]て回[まわ]るうちに、「知[し]られざる神[かみ]に」と記[しる]された祭壇[さいだん]も見[み]つけました。あなたがたが知[し]らないで崇[あが]めているその方[かた]を、わたしはあなたがたに告[つ]げ知[し]らせています。"
  24: "世界[せかい]とそこにあるすべてのものを造[つく]られた神[かみ]は、天[てん]と地[ち]の主[しゅ]であって、手[て]で造[つく]られた神殿[しんでん]には住[す]まれない。"
  25: "また、何[なに]か足[た]りないものでもおありかのように、人[ひと]の手[て]によって仕[つか]えられることもない。神[かみ]はご自身[じしん]で、すべての人[ひと]に命[いのち]と息[いき]とすべてのものを与[あた]えておられる。"
  26: "神[かみ]は、一[ひと]つの〔血[ち]〕からあらゆる民族[みんぞく]を造[つく]って、地[ち]の全面[ぜんめん]に住[す]まわせ、あらかじめ定[さだ]めた時[とき]と、彼[かれ]らの住[す]む地[ち]の境[さかい]とを定[さだ]められた。"
  27: "それは、人々[ひとびと]が神[かみ]を尋[たず]ね求[もと]め、もしかすると手探[てさぐ]りして神[かみ]を見[み]いだすようになるためである。神[かみ]は、わたしたち一人[ひとり]一人[ひとり]から遠[とお]く離[はな]れておられるのではない。"
  28: "わたしたちは神[かみ]によって生[い]き、動[うご]き、存在[そんざい]しているのである。あなたがたの詩人[しじん]たちのうちのある人[ひと]も、こう言[い]っている。「わたしたちはその子孫[しそん]である」と。"
  29: "わたしたちは神[かみ]の子孫[しそん]である以上[いじょう]、神性[しんせい]を、金[きん]や銀[ぎん]や石[いし]、すなわち人[ひと]の技[わざ]と考[かんが]えによって刻[きざ]まれたものに似[に]たものと考[かんが]えるべきではない。"
  30: "神[かみ]は、無知[むち]の時代[じだい]は見逃[みのが]しておられたが、今[いま]は、至[いた]るところで、すべての人[ひと]に悔[く]い改[あら]めるよう命[めい]じておられる。"
  31: "それは、ご自身[じしん]が定[さだ]めた日[ひ]に、ご自身[じしん]の定[さだ]めた一人[ひとり]の人[ひと]によって、義[ぎ]をもって世界[せかい]を裁[さば]かれるためである。神[かみ]はその人[ひと]を死者[ししゃ]の中[なか]から復活[ふっかつ]させ、すべての人[ひと]にその確[たし]かな証[あかし]をお与[あた]えになった。」"
  32: "死者[ししゃ]の復活[ふっかつ]のことを聞[き]くと、ある者[もの]たちは嘲[あざけ]り、ほかの者[もの]たちは「そのことについては、また後[あと]で聞[き]こう」と言[い]った。"
  33: "こうして、パウロは彼[かれ]らの間[あいだ]から出[で]て行[い]った。"
  34: "しかし、ある人々[ひとびと]は彼[かれ]に付[つ]き従[したが]って信[しん]じた。その中[なか]には、アレオパゴスの議員[ぎいん]ディオニシオ、ダマリスという名[な]の女[おんな]、また彼[かれ]らとともにいるほかの人々[ひとびと]がいた。"

notes:
  1: "Ἀμφίπολις, Ἀπολλωνία — города на пути из Филипп в Фессалоники; アンフィポリス, アポロニア."
  3: "διανοίγων καὶ παρατιθέμενος — «открывая и предлагая»; 説き明かし…証しした. Слова в кавычках — аргумент Павла, не речь Христа, не красные."
  4: "σεβόμενοι Ἕλληνες — «чтущие Бога эллины», язычники, близкие к синагоге; 神を崇めるギリシア人. τῶν πρώτων — «из первых (знатных)»; 身分の高い."
  5: "В критической базе только Ζηλώσαντες δὲ οἱ Ἰουδαῖοι; церковный текст (Елизаветинская «непокоршиися иудее», jp-joc 信ぜざる) читает οἱ ἀπειθοῦντες — 〔信じなかった〕. ἀγοραῖοι — рыночные бездельники; 市場のならず者."
  7: "δόγματα Καίσαρος — «уставы кесаревы»; カエサルの定め, как в корпусе (ср. Лк 2:1; 20:22–25)."
  9: "τὸ ἱκανόν — залог, гарантия; 保証金."
  11: "εὐγενέστεροι — «благороднее» (не о происхождении, о складе ума); より高潔な心の持ち主. ἀνακρίνοντες — «исследуя»; 調べていた."
  16: "κατείδωλον — «полный идолов»; 偶像で満ちている. παρωξύνετο — «раздражался, возмущался»; 憤りを覚えた."
  18: "Ἐπικούρειοι, Στωϊκοί — две главные философские школы Афин; сноска при первом упоминании. σπερμολόγος — букв. «собирающий крошки», о человеке, который подбирает чужие слова; 空言を並べる者. ξένων δαιμονίων — «чужих божеств»; 他国の神々."
  19: "Ἄρειος Πάγος — холм Ареса в Афинах, где заседал верховный совет; アレオパゴス (сноска)."
  22: "δεισιδαιμονεστέρους — «более богобоязненных» или «суеверных»; двусмысленность сохранена: 宗教心の厚い."
  23: "Ἀγνώστῳ θεῷ — надпись на алтаре; 知られざる神に. ἀγνοοῦντες εὐσεβεῖτε — «не зная, чтите»; 知らないで崇めている."
  26: "В критической базе ἐξ ἑνὸς (без αἵματος); церковный текст (Елизаветинская «от единыя крове», jp-joc 一つの血より) читает ἐξ ἑνὸς αἵματος — 〔血〕."
  27: "ψηλαφήσειαν — «ощупали бы»; 手探りして. У Елизаветинской «Господа» вместо «Бога» (θεόν в базе) — переведено 神."
  28: "Цитата из греческих поэтов (Эпименид, Арат, Клеанф): Τοῦ γὰρ καὶ γένος ἐσμέν — «ибо мы и род Его»; わたしたちはその子孫である. У jp-joc «我等は其の族なり»; ἀπὸ τῶν ποιητῶν — 詩人たち."
  30: "ὑπεριδών — «не вменив, презрев»; 見逃しておられた. πάντας πανταχου — «всех везде»; 至るところで、すべての人に."
  31: "ἐν ἀνδρὶ ᾧ ὥρισεν — «через Мужа, Которого определил»; 定めた一人の人によって. πίστιν παρασχών — «дав удостоверение»; 確かな証し."
  34: "Διονύσιος ὁ Ἀρεοπαγίτης — член Ареопага; アレオパゴスの議員ディオニシオ. Δάμαρις — ダマリス. У jp-joc «дамарь»."
