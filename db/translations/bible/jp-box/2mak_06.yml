verses:
  1: "それから間[ま]もなく、王[おう]はアテネの老[としよ]りを遣[つか]わして、ユダヤ人[じん]に父[ちち]たちの律法[りっぽう]から離[はな]れ、神[かみ]の律法[りっぽう]に従[したが]って生[い]きないように強[し]いることにした。"
  2: "また、エルサレムの神殿[しんでん]を汚[けが]し、これをゼウス・オリンピオスの神殿[しんでん]と呼[よ]ばせ、ガリジンの神殿[しんでん]を、そこに住[す]む者[もの]たちの例[れい]に倣[なら]ってゼウス・クセニオス（客[きゃく]の神[かみ]）の神殿と呼[よ]ばせた。"
  3: "悪[あく]の激[はげ]しさは、すべての者[もの]にとって耐[た]えがたく重[おも]いものであった。"
  4: "というのは、神殿[しんでん]は異邦人[いほうじん]たちの放[ほう]縦[じゅう]と騒[さわ]ぎで満[み]ち、彼らは遊[あそ]び女[おんな]とふざけ合[あ]い、聖[せい]なる境内[けいだい]で女[おんな]たちに近[ちか]づき、さらに、ふさわしくないものまで中[なか]へ持[も]ち込[こ]んだからである。"
  5: "祭壇[さいだん]は、律法[りっぽう]から離[はな]れた者[もの]たちが持[も]ち込[こ]む許[ゆる]されないもので満[み]ちあふれていた。"
  6: "人[ひと]は安息日[あんそくび]を守[まも]ることも、父[ちち]たちの祭[まつ]りを保[たも]つことも、ただ自分[じぶん]がユダヤ人[じん]であると認[みと]めることさえできなかった。"
  7: "彼らは苦[くる]しい強制[きょうせい]によって、毎月[まいつき]の王[おう]の誕生[たんじょう]日[び]に偶像[ぐうぞう]の犠牲[ぎせい]へ連[つ]れて行[い]かれ、ディオニソスの祭[まつ]りになると、蔦[つた]を持[も]ってディオニソスを讃[たた]える行列[ぎょうれつ]に加[くわ]わらされた。"
  8: "また、プトレマイオスの勧[すす]めにより、近隣[きんりん]のギリシアの町[まち]々[まち]にも、ユダヤ人[じん]に対して同[おな]じ習[なら]わしを行[おこな]わせ、偶像[ぐうぞう]の犠牲[ぎせい]をささげさせるという布告[ふこく]が出[で]た。"
  9: "そして、ギリシア風[ふう]の習[なら]わしへ移[うつ]ろうとしない者[もの]を殺[ころ]すことであった。人[ひと]は当時[とうじ]の苦[くる]しみを目の当[あ]たりにすることになった。"
  10: "というのは、子[こ]どもに割礼[かつれい]を施[ほどこ]した女[おんな]が二人[ふたり]、引[ひ]き立[た]てられたからである。彼らはその子[こ]どもを母[はは]の乳[ちち]に吊[つ]るし、人[ひと]々[びと]の前[まえ]で母[はは]たちを都[みやこ]じゅう引[ひ]き回[まわ]してから、城壁[じょうへき]から投[な]げ落[お]とした。"
  11: "また、ほかの者[もの]たちは、近[ちか]くの洞窟[どうくつ]に駆[か]け込[こ]み、ひそかに七日[なのか]の安息日[あんそくび]を過[す]ごそうとしていたところ、フィリッポスに告発[こくはつ]され、いっしょに焼[や]かれた。彼らは、この最も尊[とうと]い日[ひ]の誉[ほま]れのために、自分[じぶん]を助[たす]けることにためらいを覚[おぼ]えたのである。"
  12: "そこで、この書[しょ]を手[て]に取[と]る人[ひと]々[びと]に願[ねが]う。不幸[ふこう]に遭[あ]っても心[こころ]を縮[ちぢ]めず、これらの罰[ばつ]はわたしたちの民[たみ]を滅[ほろ]ぼすためではなく、鍛[きた]え導[みちび]くためのものだと考[かんが]えてほしい。"
  13: "というのは、不敬[ふけい]な者[もの]たちを長[なが]く放[ほう]っておかず、すぐに罰[ばつ]に遭[あ]わせることは、大[おお]きな恵[めぐ]みのしるしだからである。"
  14: "ほかの民[たみ]々[たみ]には、彼らが罪[つみ]の満[み]ちに達[たっ]するまで、耐[た]え忍[しの]ぶ主[しゅ]が、のちに罰[ばつ]を与[あた]えられるのに対[たい]して、わたしたちにはそのようにはさばかれなかった。"
  15: "それは、わたしたちの罪[つみ]が極[きわ]みに達[たっ]したのち、のちになってから罰[ばつ]をお与[あた]えにならないためである。"
  16: "だからこそ主[しゅ]は、わたしたちからあわれみを決[けっ]して取[と]り去[さ]らず、不幸[ふこう]をもって鍛[きた]えつつも、ご自分[じぶん]の民[たみ]を捨[す]てられないのである。"
  17: "ただ、このことはわたしたちへの戒[いまし]めとして語[かた]ったまでである。少[すこ]しの言葉[ことば]で物語[ものがたり]へ進[すす]むべきである。"
  18: "さて、エレアザルという者[もの]がいた。筆[ひっ]頭[とう]の一人[ひとり]で、すでに年[とし]を重[かさ]ね、顔[かお]だちもたいそう立派[りっぱ]な人[ひと]であったが、口[くち]をこじ開[あ]けられて、豚[ぶた]の肉[にく]を食[た]べるよう強[し]いられた。"
  19: "しかし彼[かれ]は、尊厳[そんげん]を保[たも]っての死[し]を、汚[けが]れに満ちた生[いき]き方[かた]よりも選[えら]び、自分[じぶん]から拷問[ごうもん]の台[だい]へ進[すす]み出[で]た。"
  20: "そして、耐[た]え忍[しの]ぶ者[もの]たちが近[ちか]づくべきように唾[つば]を吐[は]き捨[す]て、命[いのち]への愛着[あいちゃく]のゆえに味[あじ]わうことを許[ゆる]されないものを拒[こば]んだ。"
  21: "さて、この不法[ふほう]な犠牲[ぎせい]に当[あ]たっていた者[もの]たちは、昔[むかし]からのこの人[ひと]との親[した]しさから、彼[かれ]を別[べつ]の所[ところ]へ連[つ]れて行[い]き、自分[じぶん]で用意[ようい]した、食[た]べてよい肉[にく]を持[も]って来[く]るようにと勧[すす]めた。そのうえで、王[おう]が命[めい]じた犠牲[ぎせい]の肉[にく]を食[た]べているふりをするようにと言[い]った。"
  22: "そうすれば、これをして死[し]を免[まぬか]れ、昔[むかし]からの彼らとの友情[ゆうじょう]によって温情[おんじょう]を受[う]けられるというのである。"
  23: "しかし彼[かれ]は、年齢[ねんれい]にふさわしく、老[ろう]年の尊[とうと]さ、手[て]に入[い]れた輝[かがや]かしい白髪[しらが]、幼[おさな]いころからの最も良[よ]い歩[あゆ]みにふさわしく、いや、それ以上[いじょう]に、聖[せい]なる神[かみ]の定[さだ]めた律法[りっぽう]に従[したが]って、立派[りっぱ]な考[かんが]えを抱[いだ]き、すぐに冥府[めいふ]へ送[おく]るように、と答[こた]えた。"
  24: "「わたしたちの年齢[ねんれい]にふさわしくないのは、面目[めんぼく]を保[たも]つふりをすることである。それは、多[おお]くの若[わか]い者[もの]たちが、九十歳[きゅうじゅっさい]のエレアザルが外国[がいこく]風[ふう]の暮[く]らしに移[うつ]ったと受[う]け取[と]り、"
  25: "自分[じぶん]たちもまた、わたしの見[み]せかけと、わずかでつかの間[ま]の命[いのち]のために、わたしに引[ひ]きずられて迷[まよ]い、わたしが老[ろう]年に汚[けが]れと傷[きず]をもたらすことになるからである。"
  26: "たとえ今[いま]、人[ひと]からの罰[ばつ]を免[まぬか]れても、わたしは生[い]きていても死[し]んでも、全能[ぜんのう]者の手[て]から逃[のが]れることはできない。"
  27: "だから、今[いま]勇[いさ]ましく命[いのち]と別[わか]れて、老[ろう]年にふさわしい者[もの]として現[あら]われよう。"
  28: "そして、若[わか]い者[もの]たちに、尊[とうと]く聖[せい]なる律法[りっぽう]のために喜[よろこ]んで勇[いさ]ましく死[し]ぬという、立派[りっぱ]な手本[てほん]を残[のこ]そう。」こう語[かた]り終[お]えると、彼[かれ]はすぐに拷問[ごうもん]の台[だい]へ進[み]んだ。"
  29: "彼[かれ]を引[ひ]いていった者[もの]たちは、先[さき]ほどまでの彼[かれ]への好意[こうい]を、今[いま]では敵意[てきい]に変[か]えた。彼らはさきほどの言葉[ことば]を、自分[じぶん]たちの解釈[かいしゃく]では狂気[きょうき]だと思[おも]ったからである。"
  30: "むち打[う]ちの傷[きず]で死[し]のうとするとき、彼[かれ]は呻[うめ]いて言[い]った。「聖[せい]なる知識[ちしき]を持[も]つ主[しゅ]には明[あき]らかです。わたしは、死[し]から免[まぬか]れる力[ちから]がありながら、むち打たれて体[からだ]に激[はげ]しい苦痛[くつう]を受[う]けています。しかし魂[たましい]では、主[しゅ]への畏[おそ]れのゆえに、これを喜[よろこ]んで耐[た]え忍[しの]んでいます。」"
  31: "こうして彼[かれ]は世[よ]を去[さ]った。その死[し]は、若[わか]い者[もの]たちだけでなく、民[たみ]の多[おお]くの者[もの]にとっても、勇気[ゆうき]の手本[てほん]であり、徳[とく]の記念[きねん]となった。"

notes:
  1: "Μετ᾽ οὐ πολὺν… χρόνον — «спустя не много времени»; ἐξαπέστειλεν… γέροντα Ἀθηναῖον — «послал старца афинянина» (アテネの老[としよ]り); ἀναγκάζειν… μεταβαίνειν ἀπὸ τῶν πατρίων νόμων — «принуждать перейти (отступить) от отеческих законов»; μὴ πολιτεύεσθαι — «не жительствовать (не жить) по законам Божиим»."
  2: "μολῦναι… τὸν ἐν Ιεροσολύμοις νεώ — «осквернить иерусалимский храм»; προσονομάσαι Διὸς Ὀλυμπίου — «наречь Зевса Олимпийского» (ゼウス・オリンピオス); τὸν ἐν Γαριζιν… Διὸς Ξενίου — «гаризинский — Зевса Ксения» (гостеприимного, 客[きゃく]の神[かみ]), καθὼς ἐτύγχανον οἱ τὸν τόπον οἰκοῦντες — «как случилось с жителями того места» (т. е. по их положению пришельцев)."
  3: "χαλεπὴ… καὶ τοῖς ὅλοις ἦν δυσχερής — «тяжко и для всех невыносимо»; ἡ ἐπίτασις τῆς κακίας — «усиление злобы» (ἐπίτασις)."
  4: "ἀσωτίας καὶ κώμων — «распутства и буйных шествий» (κῶμος — 騒[さわ]ぎ); ῥᾳθυμούντων μεθ᾽ ἑταιρῶν — «беспечно (распущенно) бывших с блудницами»; ἐν τοῖς ἱεροῖς περιβόλοις — «в священных дворах»; τὰ μὴ καθήκοντα ἔνδον εἰσφερόντων — «неподобающее внутрь вносивших»."
  5: "τοῖς ἀποδιεσταλμένοις ἀπὸ τῶν νόμων ἀθεμίτοις — «запрещённым (беззаконным), отделённым от законов» (ἀθέμιτος — нечестивый, запрещённый)."
  6: "οὔτε σαββατίζειν — «ни субботствовать» (σαββατίζω); ἑορτὰς διαφυλάττειν — «праздники хранить»; ἁπλῶς Ιουδαῖον ὁμολογεῖν εἶναι — «просто называть себя иудеем». Слав. «ниже весьма кому себе иудеанином именовати»."
  7: "μετὰ πικρᾶς ἀνάγκης — «с горькой нуждой (принуждением)»; εἰς τὴν κατὰ μῆνα… γενέθλιον ἡμέραν — «на ежемесячный день рождения»; ἐπὶ σπλαγχνισμόν — «на идольское жертвоприношение» (σπλαγχνισμός — жертва внутренностями); Διονυσίων ἑορτῆς — «праздника Дионисий» (ディオニソス); κισσοὺς ἔχοντες πομπεύειν — «с плющом шествовать в ходе» (κισσός — плющ, 蔦[つた])."
  8: "ψήφισμα… ἐξέπεσεν — «постановление вышло» (ψήφισμα); εἰς τὰς ἀστυγείτονας Ἑλληνίδας πόλεις — «в соседние эллинские города»; Πτολεμαίου ὑποθεμένου — «по наущению Птолемея» (ὑποτίθεμαι); τὴν αὐτὴν ἀγωγὴν… ἄγειν — «то же установление вести»; σπλαγχνίζειν — «приносить жертвы»."
  9: "τοὺς μὴ προαιρουμένους μεταβαίνειν ἐπὶ τὰ Ἑλληνικά — «не желающих переходить к эллинскому»; κατασφάζειν — «закалывать»; παρῆν… ὁρᾶν τὴν ἐνεστῶσαν ταλαιπωρίαν — «можно было видеть настоящую бедственность»."
  10: "δύο γυναῖκες ἀνήχθησαν περιτετμηκυῖαι τὰ τέκνα — «две женщины приведены обрезавшими детей»; ἐκ τῶν μαστῶν κρεμάσαντες τὰ βρέφη — «привесив к сосцам младенцев»; δημοσίᾳ περιαγαγόντες — «всенародно проведя»; κατὰ τοῦ τείχους ἐκρήμνισαν — «со стены сбросили» (κρημνίζω)."
  11: "λεληθότως ἄγειν τὴν ἑβδομάδα — «тайно проводить седмицу»; μηνυθέντες τῷ Φιλίππῳ — «будучи донесены Филиппу» (μηνύω); συνεφλογίσθησαν — «сожжены вместе»; διὰ τὸ εὐλαβῶς ἔχειν βοηθῆσαι ἑαυτοῖς — «за то, что благочестно (боязненно) отнеслись помочь себе»; κατὰ τὴν δόξαν τῆς σεμνοτάτης ἡμέρας — «по славе (чести) святейшего дня»."
  12: "Παρακαλῶ οὖν τοὺς ἐντυγχάνοντας τῇδε τῇ βίβλῳ — «прошу приступающих к этой книге»; μὴ συστέλλεσθαι διὰ τὰς συμφορᾶς — «не смущаться (не сжиматься) из-за несчастий»; πρὸς παιδείαν τοῦ γένους ἡμῶν — «к наставлению (воспитанию) рода нашего» (παιδεία). Начало авторского отступления."
  13: "τὸ μὴ πολὺν χρόνον ἐᾶσθαι τοὺς δυσσεβοῦντας — «не оставлять нечестивых надолго» (ἐάω); εὐθέως περιπίπτειν ἐπιτίμοις — «тотчас подвергаться карам» (ἐπίτιμος — подлежащий наказанию); μεγάλης εὐεργεσίας σημεῖον — «знамение великого благодеяния»."
  14: "καθάπερ καὶ ἐπὶ τῶν ἄλλων ἐθνῶν — «как и на других народах»; ἀναμένει μακροθυμῶν ὁ δεσπότης — «ждёт долготерпящий Владыка»; μέχρι τοῦ… πρὸς ἐκπλήρωσιν ἁμαρτιῶν κολάσαι — «до того, чтобы наказать по исполнении грехов»; οὕτως καὶ ἐφ᾽ ἡμῶν ἔκρινεν εἶναι — «так и с нами судил быть»."
  15: "ἵνα μὴ πρὸς τέλος ἀφικομένων ἡμῶν τῶν ἁμαρτιῶν — «чтобы не тогда, когда грехи наши дойдут до конца»; ὕστερον ἡμᾶς ἐκδικᾷ — «после нас покарает» (ἐκδικέω)."
  16: "οὐδέποτε… τὸν ἔλεον ἀφ᾽ ἡμῶν ἀφίστησιν — «никогда не отставляет от нас милости»; παιδεύων δὲ μετὰ συμφορᾶς — «наказывая с несчастьем (через несчастья)»; οὐκ ἐγκαταλείπει τὸν ἑαυτοῦ λαόν — «не оставляет Своего народа»."
  17: "ἕως ὑπομνήσεως ταῦθ᾽ ἡμῖν εἰρήσθω — «пусть это сказано нам в напоминание» (ὑπόμνησις); δι᾽ ὀλίγων δ᾽ ἐλευστέον ἐπὶ τὴν διήγησιν — «с немногими [словами] должно перейти к повествованию» (ἐλευστέον, от ἐλαύνω)."
  18: "τῶν πρωτευόντων γραμματέων — «из первенствующих книжников» (γραμματεύς); τὴν πρόσοψιν τοῦ προσώπου κάλλιστος — «прекрасный видом лица» (πρόσοψις); ἀναχανὼν ἠναγκάζετο φαγεῖν ὕειον κρέας — «с раскрытым ртом принуждаем был есть свиное мясо» (ἀναχάσκω — раскрывать рот)."
  19: "τὸν μετ᾽ εὐκλείας θάνατον μᾶλλον ἢ τὸν μετὰ μύσους βίον ἀναδεξάμενος — «приняв смерть со славой скорее, чем жизнь с мерзостью» (μῦσος — мерзость, скверна); αὐθαιρέτως ἐπὶ τὸ τύμπανον προσῆγεν — «добровольно на тимпан (орудие пытки) шёл» (τύμπανον — 拷問[ごうもん]の台[だい])."
  20: "προπτύσας — «плюнув»; καθ᾽ ὃν ἔδει τρόπον προσέρχεσθαι τοὺς ὑπομένοντας — «каким образом надлежало приступать терпящим»; ἀμύνασθαι ὧν οὐ θέμις γεύσασθαι — «отвергнуть то, чего не позволено вкушать» (ἀμύνω — отражать); διὰ τὴν πρὸς τὸ ζῆν φιλοστοργίαν — «из любви к жизни» (φιλοστοργία)."
  21: "οἱ πρὸς τῷ παρανόμῳ σπλαγχνισμῷ τεταγμένοι — «приставленные к беззаконному жертвоприношению»; διὰ τὴν ἐκ τῶν παλαιῶν χρόνων… γνῶσιν — «по знанию (знакомству) с древних времён»; ἀπολαβόντες αὐτὸν κατ᾽ ἰδίαν — «отозвав его наедине»; ἐνέγκαντα κρέα, οἷς καθῆκον αὐτῷ χρᾶσθαι — «принёсши мяса, какими ему подобало пользоваться»; ὑποκριθῆναι δὲ ὡς ἐσθίοντα — «притвориться, будто ест»."
  22: "ἵνα… ἀπολυθῇ τοῦ θανάτου — «чтобы избавиться от смерти»; διὰ τὴν ἀρχαίαν πρὸς αὐτοὺς φιλίαν — «по древней с ними дружбе»; τύχῃ φιλανθρωπίας — «получит человеколюбие (снисхождение)»."
  23: "λογισμὸν ἀστεῖον ἀναλαβών — «приняв благородную мысль» (ἀστεῖος); ἄξιον τῆς ἡλικίας καὶ τῆς τοῦ γήρως ὑπεροχῆς — «достойную возраста и превосходства старости»; τῆς ἐπικτήτου καὶ ἐπιφανοῦς πολιᾶς — «приобретённой и славной седины» (πολιά — седина, 白髪[しらが]); τῆς ἐκ παιδὸς καλλίστης ἀναστροφῆς — «наилучшего с детства поведения»; ἀκολούθως ἀπεφήνατο — «соответственно ответил»; προπέμπειν εἰς τὸν ᾅδην — «отправить в ад (преисподнюю)», косвенная речь, без кавычек."
  24: "Οὐ γὰρ τῆς ἡμετέρας ἡλικίας ἄξιόν ἐστιν ὑποκριθῆναι — «недостойно нашего возраста лицемерить»; ἵνα μολλοὶ τῶν νέων ὑπολαβόντες — «чтобы многие из юных, подумав»; τὸν ἐνενηκονταετῆ — «девяностолетнего»; μεταβεβηκέναι εἰς ἀλλοφυλισμόν — «перешёл к иноплеменному образу жизни» (ἀλλοφυλισμός)."
  25: "διὰ τὴν ἐμὴν ὑπόκρισιν — «из-за моего лицемерия»; διὰ τὸ μικρὸν καὶ ἀκαριαῖον ζῆν — «из-за малой и мгновенной жизни» (ἀκαριαῖος); πλανηθῶσιν δι᾽ ἐμέ — «прельстятся через меня»; μῦσος καὶ κηλῖδα τοῦ γήρως κατακτήσωμαι — «приобрету мерзость и пятно старости» (κηλίς — пятно)."
  26: "εἰ καὶ ἐπὶ τοῦ παρόντος ἐξελοῦμαι τὴν ἐξ ἀνθρώπων τιμωρίαν — «если и ныне избавлюсь от человеческого наказания»; τὰς τοῦ παντοκράτορος χεῖρας — «рук Вседержителя»; οὔτε ζῶν οὔτε ἀποθανὼν ἐκφεύξομαι — «ни живой, ни умерший не избегу»."
  27: "ἀνδρείως… διαλλάξας τὸν βίον — «мужественно расставшись с жизнью» (διαλλάσσω); τοῦ γήρως ἄξιος φανήσομαι — «старости достойным явлюсь»."
  28: "ὑπόδειγμα γενναῖον καταλελοιπώς — «оставив доблестный пример»; εἰς τὸ… ἀπευθανατίζειν — «чтобы… умирать» (ἀπευθανατίζω — умереть добровольно); ἐπὶ τὸ τύμπανον εὐθέως ἦλθεν — «тотчас на тимпан (орудие пытки) пошёл»."
  29: "τῶν ἀγόντων πρὸς αὐτὸν τὴν… εὐμένειαν εἰς δυσμένειαν μεταβαλόντων — «ведущих его прежнюю благожелательность в неприязнь переменивших» (εὐμένεια, δυσμένεια); ὡς αὐτοὶ διελάμβανον — «как они сами полагали»; ἀπόνοιαν εἶναι — «что это безумие» (ἀπόνοια)."
  30: "μέλλων ταῖς πληγαῖς τελευτᾶν — «имея окончить жизнь под ударами»; ἀναστενάξας — «возстенав»; τῷ τὴν ἁγίαν γνῶσιν ἔχοντι — «имеющему святой разум (ведение)»; φανερόν ἐστιν — «явно есть»; δυνάμενος ἀπολυθῆναι τοῦ θανάτου — «могущий избавиться от смерти»; σκληρὰς ὑποφέρω κατὰ τὸ σῶμα ἀλγηδόνας — «жестокие терплю по телу боли»; κατὰ ψυχὴν δὲ ἡδέως διὰ τὸν αὐτοῦ φόβον — «душой же охотно из страха пред Ним». Прямая речь в 「…」, закрывается в стихе."
  31: "μετήλλαξεν — «скончался»; οὐ μόνον τοῖς νέοις, ἀλλὰ καὶ τοῖς πλείστοις τοῦ ἔθνους — «не только юным, но и весьма многим из народа»; ὑπόδειγμα γενναιότητος καὶ μνημόσυνον ἀρετῆς — «пример доблести и памятник добродетели» (μνημόσυνον)."
