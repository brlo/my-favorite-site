# jp-box, 2 Маккавейская, глава 6. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной: 31 стих, совпадает с gr.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1–2 посланный царём старец-афинянин, храм — Зевса Олимпийского,
# гаризинский — Зевса Ксения; 3–11 осквернение храма, запрет субботы и праздников,
# день рождения царя, Дионисии, две матери, сожжённые в пещерах; 12–17 авторское
# отступление: наказание — не к погибели, а к вразумлению; 18–31 мученичество
# Елеазара-книжника и его речь.
# Голоса: 6:30 — прямая речь Елеазара в 「…」 (закрывается в конце стиха);
# 6:23 его ответ передан косвенно («сказав, что…») — в gr тоже косвенно
# (ταχέως λέγων προπέμπειν), кавычек нет. 6:12–17 — речь автора, без кавычек.
# Имена: エレアザル, ゼウス, ディオニソス, アテネ人, フィリッポス, ガリジン,
# アンティオコス, プトレマイオス — ゼウス/ディオニソス новые.
# Термины: 神殿[しんでん], 祭壇[さいだん], 犠牲[ぎせい], 安息日[あんそくび],
# 割礼[かつれい], 律法[りっぽう], 偶像[ぐうぞう], 異邦人[いほうじん].

