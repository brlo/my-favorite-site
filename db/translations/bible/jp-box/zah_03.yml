# jp-box, Захария, глава 3. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной (совпадает с gr: 10 стихов).
# Язык — современный 常体; 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1–2 суд перед Ангелом: Иисус (イエシュア) и сатана, «да запретит тебе
# Господь», головня из огня; 3–5 грязные одежды сняты, чистый кидар, длинная одежда;
# 6–7 завет Ангела: ходить путями Господними, судить дом, двор, «ходить между стоящими»;
# 8–9 «раб Мой, Восток», камень с семью очами, «изглажу грех земли в один день»;
# 10 под виноградом и смоковницей.
# Голоса: 1 рассказ; 2 слово Господа сатане в 「…」; 3 рассказ; 4–5 повеления Ангела
# в 「…」 (два речения), затем рассказ; 6–10 свидетельство Ангела в 「…» со словом
# Господа («так говорит») внутри того же речения.
# Термины: 大祭司[だいさいし] — ἱερεὺς μέγας; 頭巾[ずきん] — κίδαρις; 東[ひがし] —
# Ἀνατολή («Восток»; евр./ru «Отрасль»); 七[なな]つの目[め] — ἑπτὰ ὀφθαλμοί.
#
tr_code: jp-box
book: zah
chapter: 3
draft: true

verses:
  1: "主[しゅ]はわたしに、大祭司[だいさいし]イエシュアが主[しゅ]の天使[てんし]の前[まえ]に立[た]っているのを示[しめ]された。サタンも彼[かれ]の右[みぎ]に立[た]って、彼に敵対[てきたい]しようとしていた。"
  2: "主[しゅ]はサタンに言[い]われた。「サタンよ、主[しゅ]がおまえを叱[しか]りつけるように。エルサレムを選[えら]ばれた主[しゅ]が、おまえを叱[しか]りつけるように。これは火[ひ]から引[ひ]き抜[ぬ]かれた燃[も]え木[ぎ]ではないか。」"
  3: "イエシュアは汚[けが]れた衣[ころも]を着[き]て、天使[てんし]の前[まえ]に立[た]っていた。"
  4: "天使[てんし]は、自分の前[まえ]に立[た]つ者[もの]たちに答[こた]えて言[い]った。「彼から汚[けが]れた衣[ころも]を脱[ぬ]がせ。」そして彼に言[い]った。「見[み]よ、わたしはあなたから不法[ふほう]を取[と]り去[さ]り、あなたの罪[つみ]を清[きよ]めた。彼に長[なが]い衣[ころも]を着[き]せよ。」"
  5: "そして言[い]った。「彼の頭[あたま]に清[きよ]い頭巾[ずきん]をかぶせよ。」人[ひと]々[びと]は清[きよ]い頭巾[ずきん]を彼の頭[あたま]に載[の]せ、彼に衣[ころも]を着[き]せた。主[しゅ]の天使[てんし]はそこに立[た]っていた。"
  6: "主[しゅ]の天使[てんし]はイエシュアに証[あかし]して言[い]った。「万軍[ばんぐん]の主[しゅ]はこう言[い]われる。"
  7: "もしあなたがわたしの道[みち]を歩[あゆ]み、わたしの戒[いまし]めを守[まも]るなら、あなたはわたしの家[いえ]を治[さば]き、わたしの庭[にわ]を守[まも]るであろう。わたしはあなたに、ここに立[た]っている者[もの]たちの間[あいだ]を歩[あゆ]む者[もの]たちを与[あた]える。"
  8: "聞[き]け、大祭司[だいさいし]イエシュアよ。あなたと、あなたの前[まえ]に座[すわ]っているあなたの仲間[なかま]たち、すなわちしるしとなる者[もの]たちよ。見[み]よ、わたしはわたしのしもべ、東[ひがし]を連[つ]れて来[く]る。"
  9: "見[み]よ、わたしがイエシュアの前[まえ]に置[お]いた石[いし]、この一[ひと]つの石[いし]の上[うえ]に七[なな]つの目[め]がある。見[み]よ、わたしは穴[あな]を掘[ほ]る、と万軍[ばんぐん]の主[しゅ]は言[い]われる。わたしはこの地[ち]のすべての不法[ふほう]を一日[いちにち]のうちに取[と]り除[のぞ]く。"
  10: "その日[ひ]、万軍[ばんぐん]の主[しゅ]は言[い]われる。あなたがたは互[たが]いに、ぶどうの木[き]の下[した]と、いちじくの木[き]の下[した]へ招[まね]き合[あ]うであろう。」"

notes:
  1: "ἔδειξέν μοι Ἰησοῦν τὸν ἱερέα τὸν μέγαν — «показал мне Иисуса, великого иерея»; слав. добавляет «Господь» («показа ми Господь») — нет в LXX, внесено. Сатана — ὁ διάβολος; サタン, как в корпусе."
  2: "Ἐπιτιμήσαι κύριος ἐν σοί — «да запретит тебе Господь» (оптатив); ἐκλεξάμενος τὴν Ιερουσαλημ — «избравший Иерусалим»; δαλὸς ἐξεσπασμένος ἐκ πυρός — «головня, исторгнутая из огня» (燃え木)."
  3: "ἐνδεδυμένος ἱμάτια ῥυπαρὰ — «одетый в грязные одежды»; слав. «ризы гнусны»."
  4: "Ἀφέλετε — «снимите» (мн. ч.); ἀφῄρηκα τὰς ἀνομίας σου — «Я снял беззакония твои»; ἐνδύσατε αὐτὸν ποδήρη — «облеките его в подир» (длинную одежду), повелительное мн. ч.; слав. «облецыте»."
  5: "ἐπίθετε κίδαριν καθαρὰν — «возложите чистый кидар»; κίδαρις — головная повязка, 頭巾 (как в корпусе); далее рассказ: возложили и облекли."
  6: "διεμαρτύρατο — «засвидетельствовал, торжественно объявил»; речь Ангела продолжается до 10."
  7: "διακρινεῖς τὸν οἶκόν μου — «будешь судить (управлять) дом Мой»; φυλάξῃς τὴν αὐλήν — «будешь охранять двор Мой»; ἀναστρεφομένους — «обращающихся, ходящих»."
  8: "ἄνδρες τερατοσκόποι — «мужи знамений» (слав. «дивозрителие»), т. е. прообразы; Ἀνατολή — «Восток, восход» (слав. «Восток»; евр./ru «ОТРАСЛЬ» — не внесено)."
  9: "ἐπὶ τὸν λίθον τὸν ἕνα ἑπτὰ ὀφθαλμοί — «на одном камне семь очей»; ὀρύσσω βόθρον — «вырою яму» (слав. «изрыю ров»; евр./ru «вырежу начертания» — не внесено, чтение LXX тёмное)."
  10: "συγκαλέσετε ἕκαστος τὸν πλησίον — «созовёт каждый ближнего»; ὑποκάτω ἀμπέλου καὶ συκῆς — «под виноград и смоковницу»."
