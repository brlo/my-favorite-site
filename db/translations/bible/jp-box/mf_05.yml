verses:
  1: "イエスは群衆[ぐんしゅう]をご覧[らん]になって山[やま]に登[のぼ]られた。座[すわ]られると、弟子[でし]たちが近[ちか]くに寄[よ]って来[き]た。"
  2: "イエスは口[くち]を開[ひら]いて、彼[かれ]らを教[おし]えられた。"
  3: "「<j>心[こころ]の貧[まず]しい人々[ひとびと]は幸[さいわ]いである。天[てん]の国[くに]は彼[かれ]らのものだからである。</j>"
  4: "<j>悲[かな]しむ人々[ひとびと]は幸[さいわ]いである。彼[かれ]らは慰[なぐさ]められるからである。</j>"
  5: "<j>柔和[じゅうわ]な人々[ひとびと]は幸[さいわ]いである。彼[かれ]らは地[ち]を受[う]け継[つ]ぐからである。</j>"
  6: "<j>義[ぎ]に飢[う]え渇[かわ]く人々[ひとびと]は幸[さいわ]いである。彼[かれ]らは満[み]たされるからである。</j>"
  7: "<j>憐[あわ]れみ深[ぶか]い人々[ひとびと]は幸[さいわ]いである。彼[かれ]らは憐[あわ]れみを受[う]けるからである。</j>"
  8: "<j>心[こころ]の清[きよ]い人々[ひとびと]は幸[さいわ]いである。彼[かれ]らは神[かみ]を見[み]るからである。</j>"
  9: "<j>平和[へいわ]を造[つく]り出[だ]す人々[ひとびと]は幸[さいわ]いである。彼[かれ]らは神[かみ]の子[こ]と呼[よ]ばれるからである。</j>"
  10: "<j>義[ぎ]のために迫害[はくがい]される人々[ひとびと]は幸[さいわ]いである。天[てん]の国[くに]は彼[かれ]らのものだからである。</j>"
  11: "<j>わたしのために、人々[ひとびと]があなたがたをののしり、迫害[はくがい]し、〔偽[いつわ]りを言[い]って〕あなたがたに反[はん]してあらゆる悪[わる]いことを言[い]うとき、あなたがたは幸[さいわ]いである。</j>"
  12: "<j>喜[よろこ]べ。喜[よろこ]び踊[おど]れ。天[てん]にこそ、あなたがたへの大[おお]きな報[むく]いが蓄[たくわ]えられている。あなたがたより先[さき]の預言者[よげんしゃ]たちも、同[おな]じ目[め]に遭[あ]ったのだ。</j>」"
  13: "「<j>あなたがたは地[ち]の塩[しお]である。だが、塩[しお]が塩気[しおけ]を失[うしな]ったら、何[なに]によって塩気[しおけ]を付[つ]けられるだろうか。もはや何[なに]の役[やく]にも立[た]たず、外[そと]に投[な]げ捨[す]てられて、人々[ひとびと]に踏[ふ]みつけられるだけである。</j>"
  14: "<j>あなたがたは世[よ]の光[ひかり]だ。山[やま]の上[うえ]に築[きず]かれた町[まち]は、人目[ひとめ]を避[さ]けられない。</j>"
  15: "<j>また、明[あ]かりを灯[とも]して升[ます]の下[した]へ隠[かく]す者[もの]はいない。燭台[しょくだい]の上[うえ]に据[す]える。そうすれば、家[いえ]にいるすべての者[もの]を照[て]らす。</j>"
  16: "<j>同[おな]じように、あなたがたの光[ひかり]を人々[ひとびと]の前[まえ]で輝[かがや]かせ。人々[ひとびと]があなたがたの善[よ]い行[おこな]いを見[み]て、天[てん]におられるあなたがたの父[ちち]を讃[たた]えるためである。</j>」"
  17: "「<j>わたしが来[き]たのは律法[りっぽう]や預言者[よげんしゃ]を捨[す]てるためだと、考[かんが]えてはならない。捨[す]てるためではなく、満[み]たすためである。</j>"
  18: "<j>はっきり言[い]っておく。天地[てんち]が過[す]ぎ去[さ]るまで、律法[りっぽう]から一[ひと]点[てん]一[いっ]画[かく]も過[す]ぎ去[さ]ることはなく、すべてのことが実現[じつげん]するまでである。</j>"
  19: "<j>だから、この小[ちい]さな戒[いまし]めのどれか一つでも破[やぶ]り、そのように人[ひと]に教[おし]える者[もの]は、天[てん]の国[くに]では最[さい]も小[ちい]さい者[もの]と呼[よ]ばれる。だが、それを行[おこな]い、またそのように教[おし]える者[もの]は、天[てん]の国[くに]で大[おお]いなる者[もの]と呼[よ]ばれる。</j>"
  20: "<j>あなたがたに告[つ]げる。律法学者[りっぽうがくしゃ]たちやファリサイ派[は]の人々[ひとびと]の義[ぎ]にまさる義[ぎ]があなたがたになければ、天[てん]の国[くに]へ入[はい]ることはできない。</j>」"
  21: "「<j>あなたがたは、昔[むかし]の人々[ひとびと]に『殺[ころ]すな。殺[ころ]した者[もの]は裁[さば]きを受[う]ける』と言[い]われたのを聞[き]いている。</j>"
  22: "<j>しかし、わたしはあなたがたに言[い]う。兄弟[きょうだい]に〔理由[りゆう]なく〕腹[はら]を立[た]てる者[もの]はだれでも、裁[さば]きを受[う]ける。兄弟[きょうだい]に『ラカ⟨アラム語[ご]で「愚[おろ]か者[もの]」「空[から]っぽの男[おとこ]」の意[い]。⟩』と言[い]う者[もの]は、最高法院[さいこうほういん]に引[ひ]き渡[わた]され、『愚[おろ]か者[もの]』と言[い]う者[もの]は、火[ひ]の地獄[じごく]に投[な]げ込[こ]まれる。</j>"
  23: "<j>だから、あなたが祭壇[さいだん]に供[そな]え物[もの]をささげようとして、そこであなたの兄弟[きょうだい]があなたに対して何[なに]か恨[うら]みを持[も]っているのを思[おも]い出[だ]したなら、</j>"
  24: "<j>供[そな]え物[もの]は祭壇[さいだん]の前[まえ]に置[お]き去[さ]りにして、まず兄弟[きょうだい]のところへ行[い]って仲直[なかなお]りをし、それから引[ひ]き返[かえ]して、供[そな]え物[もの]をささげなさい。</j>"
  25: "<j>あなたを訴[うった]える相手[あいて]と一緒[いっしょ]に道[みち]を行[い]く間[あいだ]に、急[いそ]いでその人[ひと]と和解[わかい]しなさい。さもないと、訴[うった]える者[もの]はあなたを裁判官[さいばんかん]に引[ひ]き渡[わた]し、裁判官[さいばんかん]は下役[したやく]に引[ひ]き渡[わた]し、あなたは牢[ろう]に投[な]げ込[こ]まれる。</j>"
  26: "<j>はっきりあなたに言[い]っておく。最後[さいご]の一[いち]クァドランス⟨ローマの最小[さいしょう]の銅貨[どうか]。⟩を返[かえ]すまで、そこから出[で]ることはできない。</j>」"
  27: "「<j>あなたがたは、『姦淫[かんいん]するな』と言[い]われたのを聞[き]いている。</j>"
  28: "<j>しかし、わたしはあなたがたに言[い]う。情[じょう]欲[よく]を抱[いだ]いて女[おんな]を見[み]る者[もの]はだれでも、心[こころ]の中[なか]ですでにその女[おんな]と姦淫[かんいん]したのである。</j>"
  29: "<j>もし、右[みぎ]の目[め]があなたをつまずかせるなら、それを抜[ぬ]き出[だ]して捨[す]てなさい。体[からだ]の一部[いちぶ]が滅[ほろ]びても、全身[ぜんしん]が地獄[じごく]に投[な]げ込[こ]まれないほうが、あなたにとって良[よ]いからである。</j>"
  30: "<j>もし、右[みぎ]の手[て]があなたをつまずかせるなら、それを切[き]り落[お]として捨[す]てなさい。体[からだ]の一部[いちぶ]が滅[ほろ]びても、全身[ぜんしん]が地獄[じごく]に落[お]ちないほうが、あなたにとって良[よ]いからである。</j>」"
  31: "「<j>また、『妻[つま]を離縁[りえん]する者[もの]は、離縁状[りえんじょう]を渡[わた]せ』と言[い]われている。</j>"
  32: "<j>しかし、わたしはあなたがたに言[い]う。淫[いん]らな行[おこな]いの理由[りゆう]がないのに妻[つま]を離縁[りえん]する者[もの]はだれでも、その女[おんな]に姦淫[かんいん]の罪[つみ]を犯[おか]させることになる。離縁[りえん]された女[おんな]を娶[めと]る者[もの]も、姦淫[かんいん]の罪[つみ]を犯[おか]すのである。</j>」"
  33: "「<j>また、あなたがたは昔[むかし]の人々[ひとびと]に『偽[いつわ]りの誓[ちか]いを立[た]てるな。主[しゅ]に対して立[た]てた誓[ちか]いは果[は]たせ』と言[い]われたのを聞[き]いている。</j>"
  34: "<j>しかし、わたしはあなたがたに言[い]う。まったく誓[ちか]いを立[た]ててはならない。天[てん]にかけて誓[ちか]ってはならない。そこは神[かみ]の王座[おうざ]だからである。</j>"
  35: "<j>地[ち]にかけてもならない。そこは神[かみ]の足台[あしだい]だからである。エルサレムにかけてもならない。そこは大[だい]王[おう]の都[みやこ]だからである。</j>"
  36: "<j>自分の頭[あたま]にかけても誓[ちか]ってはならない。あなたは髪[かみ]の毛[け]一本[いっぽん]さえ、白[しろ]くも黒[くろ]くもできないからである。</j>"
  37: "<j>あなたがたの言葉[ことば]は『然[しか]り、然[しか]り』『否[いな]、否[いな]』であればよい。それ以上[いじょう]のことは悪[あく]い者[もの]から出[で]るのである。</j>」"
  38: "「<j>あなたがたは、『目[め]には目[め]を、歯[は]には歯[は]を』と言[い]われたのを聞[き]いている。</j>"
  39: "<j>しかし、わたしはあなたがたに言[い]う。悪[あく]に抗[あらが]ってはならない。右[みぎ]の頬[ほお]を打[う]たれたら、左[ひだり]の頬[ほお]も差[さ]し出[だ]しなさい。</j>"
  40: "<j>下着[したぎ]を取[と]ろうとあなたを訴[うった]える者[もの]には、上着[うわぎ]さえも渡[わた]してやりなさい。</j>"
  41: "<j>だれかがあなたに一[いち]ミリオン⟨ローマの距離[きょり]の単位[たんい]。約[やく]一・五キロ。⟩行[い]くよう強[し]いるなら、その人[ひと]と二[に]ミリオン行[い]きなさい。</j>"
  42: "<j>求[もと]められたら与[あた]えなさい。借[か]りたがる人[ひと]を追[お]い返[かえ]してはならない。</j>」"
  43: "「<j>あなたがたは、『隣人[りんじん]を愛[あい]し、敵[てき]を憎[にく]め』と言[い]われたのを聞[き]いている。</j>"
  44: "<j>しかし、わたしはあなたがたに言[い]う。あなたがたの敵[てき]を愛[あい]し、〔あなたがたを呪[のろ]う者[もの]を祝福[しゅくふく]し、あなたがたを憎[にく]む者[もの]に善[ぜん]を行[おこな]い、〕あなたがたを迫害[はくがい]する者[もの]のために祈[いの]りなさい。</j>"
  45: "<j>そうすれば、あなたがたは天[てん]におられるあなたがたの父[ちち]の子[こ]となる。父[ちち]は悪[わる]い者[もの]にも良[よ]い者[もの]にも太陽[たいよう]を昇[のぼ]らせ、正[ただ]しい者[もの]にも正[ただ]しくない者[もの]にも雨[あめ]を降[ふ]らせてくださるからである。</j>"
  46: "<j>自分[じぶん]を愛[あい]してくれる人[ひと]を愛[あい]したところで、あなたがたに何[なん]の報[むく]いがあるだろうか。徴税人[ちょうぜいにん]⟨ローマに税金[ぜいきん]を納[おさ]める仕事[しごと]をする人[ひと]。当時[とうじ]のユダヤ人[じん]から軽蔑[けいべつ]されていた。⟩でさえ、同[おな]じことをしているではないか。</j>"
  47: "<j>あなたがたが兄弟[きょうだい]たちにだけ挨拶[あいさつ]したところで、何[なん]の取[と]り柄[え]があるだろうか。異邦人[いほうじん]でさえ、同[おな]じことをしているではないか。</j>"
  48: "<j>だから、あなたがたも、天[てん]の父[ちち]が完全[かんぜん]であられるのと同[おな]じように、完全[かんぜん]でありなさい。</j>」"

notes:
  11: "<j>В критической базе ψευδόμενοι под скобками; Церковь читает — добавление в 〔〕.</j>"
  18: "<j>ἰῶτα ἓν ἢ μία κεραία — «одна йота или одна черта»; по-японски идиома 一点一画.</j>"
  22: "<j>εἰκῇ («всуе», «без причины») есть в Церкви (jp-joc: 故なくして), в критической базе нет — 〔理由なく〕. ῥακά — арамейское бранное слово, отсюда сноска.</j>"
  26: "<j>κοδράντης — римская медная монета, самая мелкая; сноска, как у デナリオン.</j>」"
  32: "<j>У jp-ni «不法な結婚でもないのに» (передаёт παρεκτὸς λόγου πορνείας описательно); поставил «淫らな行いの理由がないのに».</j>」"
  41: "<j>ἀγγαρεύσει — принудительная повинность (персидско-римская); μίλιον — римская миля, сноска.</j>"
  44: "<j>В критической базе только «любите врагов… и молитесь за гонящих вас»; Церковь читает ещё «благословляйте проклявающих вас, благотворите ненавидящим вас» (jp-joc) — добавление в 〔〕.</j>"
  46: "<j>τελῶναι — мытари; сноска перенята из Мк 2:15, где это первое упоминание в корпусе.</j>"
