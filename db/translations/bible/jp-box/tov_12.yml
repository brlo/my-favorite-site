# jp-box, Товит, глава 12. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc в книге нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 12: Товит велит уплатить Рафаилу (1–5); Рафаил открывает себя и наставляет
# (6–15): благословение Бога и милостыня (6–10), «тайна царя» (7, 11), молитва и
# милостыня Товита (12–14), «я — Рафаил, один из семи» (15); смятение и утешение
# (16–22).
# Прямая речь — 「…」: 1 (Товит), 2–3 (Товия), 4–5 (Товит), 6–15 и 17–20 (Рафаил).
# Красного и синего нет (ВЗ).
# Нумерация по gr: 22 стиха; в csl совпадает (стих в стих).
# 〔…〕 нет: все стихи есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 施[ほどこ]し, 断食, 天使, 告白 уже в корпусе.
# Имена — транслитерация греческого (LXX).

