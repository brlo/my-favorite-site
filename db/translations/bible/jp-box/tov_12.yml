verses:
  1: "そこでトビトは自分[じぶん]の息子[むすこ]トビアを呼[よ]んで言[い]った。「子[こ]よ、あなたと一緒[いっしょ]に行[い]った人[ひと]に払[はら]う報酬[ほうしゅう]のことを、よく考[かんが]えなさい。それに、彼にはさらに加[くわ]えるべきである。」"
  2: "彼は言[い]った。「父[ちち]よ、わたしは、持[も]って帰[かえ]ったものの半分[はんぶん]を彼に与[あた]えても、損[そん]をしない。"
  3: "彼がわたしを無事[ぶじ]にあなたのもとへ連[つ]れて来[き]て、わたしの妻[つま]を癒[いや]し、わたしの銀[ぎん]を運[はこ]び、あなたをも同[おな]じように癒やしたからである。」"
  4: "そこで老人[ろうじん]は言[い]った。「彼には正当[せいとう]な報酬[ほうしゅう]が払[はら]われるべきである。」"
  5: "そこで彼は天使[てんし]を呼[よ]んで言[い]った。「あなたがたが持[も]って来[き]たすべてのものの半分[はんぶん]を取りなさい。そして、無事[ぶじ]に帰[かえ]りなさい。」"
  6: "そこで彼は二人[ふたり]をひそかに呼[よ]び寄[よ]せて言[い]った。「神[かみ]をほめたたえ、神に告白[こくはく]しなさい。神に偉大[いだい]さを帰[き]しなさい。すべて生[い]きている者[もの]の前[まえ]で、神があなたがたとともに行[おこな]われたことについて告白しなさい。神をほめたたえ、その名[な]を高[たか]くし、神の業[わざ]についての言葉[ことば]を尊[とうと]んで示[しめ]すことは善[よ]いことである。神に告白することを怠[おこた]ってはならない。"
  7: "王[おう]の秘密[ひみつ]は隠[かく]すのが善いことである。しかし、神[かみ]の業[わざ]は栄光[えいこう]のうちに現[あらわ]すべきである。善[よ]いことを行[おこな]いなさい。そうすれば、悪[あく]があなたがたを見[み]つけることはない。"
  8: "祈[いの]りは、断食[だんじき]と施[ほどこ]しと正義[せいぎ]を伴[ともな]ってこそ善い。正義を伴う少[すこ]しは、不義[ふぎ]を伴う多[おお]くにまさる。施しをすることは、金[きん]を蓄[たくわ]えることにまさる。"
  9: "施[ほどこ]しは死[し]から救[すく]い出[だ]し、それ自体[じたい]がすべての罪[つみ]を清[きよ]めるからである。施しと正義[せいぎ]を行[おこな]う者[もの]たちは、いのちに満[み]ちる。"
  10: "しかし、罪[つみ]を犯[おか]す者[もの]たちは、自分[じぶん]たちのいのちの敵[てき]である。"
  11: "わたしはあなたがたに、ひと言[と]も隠[かく]さない。王[おう]の秘密[ひみつ]は隠すのが善いこと、神[かみ]の業[わざ]は栄光[えいこう]のうちに現[あらわ]すべきことである、とわたしはすでに言[い]った。"
  12: "今[いま]、あなたとあなたの嫁[よめ]サラが祈[いの]ったとき、わたしはあなたがたの祈りの記念[きねん]を、聖[せい]なる方[かた]の前[まえ]に携[たずさ]え上[あ]げた。そして、あなたが死者[ししゃ]たちを葬[ほうむ]ったとき、わたしも同[おな]じようにあなたとともにいた。"
  13: "また、あなたが食事[しょくじ]をそのままにして立[た]ち上[あ]がり、行[い]って死者[ししゃ]を包[つつ]もうとためらわなかったとき、あなたが善[よ]い行[おこな]いをしていることは、わたしに隠[かく]れなかった。わたしはあなたとともにいた。"
  14: "そして今、神[かみ]は、あなたとあなたの嫁[よめ]サラを癒[いや]すために、わたしを遣[つか]わした。"
  15: "わたしはラファエル、聖[せい]なる七人[ななにん]の天使[てんし]の一人[ひとり]である。彼らは聖なる者[もの]たちの祈[いの]りを携[たずさ]えて上[あ]げ、聖なる方[かた]の栄光[えいこう]の前[まえ]に入[はい]る。」"
  16: "そこで二人[ふたり]は動揺[どうよう]し、恐[おそ]れて顔[かお]を伏[ふ]せて倒[たお]れた。"
  17: "そこで彼は二人に言[い]った。「恐[おそ]れてはならない。あなたがたに平和[へいわ]があるように。神[かみ]をとこしえにほめたたえなさい。"
  18: "わたしは自分[じぶん]の{恵[めぐ]み|恩寵[おんちょう]}によってではなく、わたしたちの神[かみ]の御心[みこころ]によって来[き]たからである。それゆえ、神をとこしえにほめたたえなさい。"
  19: "わたしは日々[ひび]、あなたがたに現[あらわ]れていたが、食[た]べることも飲[の]むこともなかった。あなたがたが見[み]ていたのは、ただ幻[まぼろし]であった。"
  20: "そして今、神[かみ]に告白[こくはく]しなさい。わたしは、わたしを遣[つか]わした方[かた]のもとへ上[のぼ]って行[く]からである。そして、成[な]し遂[と]げられたことをすべて書物[しょもつ]に書[か]き記[しる]しなさい。」"
  21: "そして彼らは立[た]ち上[あ]がった。もはや彼を見[み]ることはなかった。"
  22: "そして彼らは、神[かみ]の大[おお]きな、不思議[ふしぎ]な業[わざ]を言[い]い表[あらわ]し、主[しゅ]の天使[てんし]が自分[じぶん]たちに現[あらわ]れた次第[しだい]を語[かた]った。"

notes:
  1: "ἐκάλεσεν — позвал. Ὅρα — «смотри, позаботься» (ὁράω, повелит.). μισθὸν τῷ ἀνθρώπῳ — плату человеку (μισθός). τῷ συνελθόντι σοι — ходившему с тобой (συνέρχομαι). προσθεῖναι αὐτῷ δεῖ — должно прибавить ему (προστίθημι, δεῖ)."
  2: "Πάτερ — отче (зват.). οὐ βλάπτομαι — «не терплю убытка» (βλάπτω, страд.; слав. «не буду обижден»). δοὺς αὐτῷ τὸ ἥμισυ — если дам ему половину. ὧν ἐνήνοχα — из того, что принёс (φέρω, perfect)."
  3: "ἀγείοχέν σοι ὑγιῆ — «привёл меня к тебе здоровым» (ἄγω, perfect; ὑγιής). ἐθεράπευσεν — уврачевал (θεραπεύω). τὸ ἀργύριόν μου ἤνεγκεν — серебро моё принёс. σὲ ὁμοίως ἐθεράπευσεν — тебя также исцелил."
  4: "ὁ πρεσβύτης — старец, т. е. Товит (πρεσβύτης). Δικαιοῦται αὐτῷ — «ему это причитается, он прав» (δικαιόω, страд.; слав. «праведно есть ему»)."
  5: "ἐκάλεσεν τὸν ἄγγελον — позвал ангела (ἄγγελος, 天使). Λαβὲ τὸ ἥμισυ πάντων — возьми половину всего. ὧν ἐνηνόχατε — что вы принесли (мн. ч.: Товия и Рафаил). Слав. добавляет «и пойди здрав» — в LXX нет, внесено в текст по паритету."
  6: "καλέσας τοὺς δύο κρυπτῶς — отозвав обоих тайно (κρυπτῶς, ひそかに; слав. «тайно»). Εὐλογεῖτε τὸν θεόν — благословляйте Бога. ἐξομολογεῖσθε — исповедуйте, воздавайте славословие (ἐξομολογέω). μεγαλωσύνην δίδοτε — воздавайте величие (μεγαλωσύνη). ἐνώπιον πάντων τῶν ζώντων — пред всеми живущими. τοὺς λόγους τῶν ἔργων τοῦ θεοῦ ἐντίμως ὑποδεικνύοντες — «слова дел Божиих достойно показывая» (ὑποδείκνυμι, ἐντίμως). μὴ ὀκνεῖτε — не медлите, не ленитесь (ὀκνέω)."
  7: "μυστήριον βασιλέως καλὸν κρύψαι — тайну царя хорошо скрыть (μυστήριον, κρύπτω). τὰ ἔργα τοῦ θεοῦ ἀνακαλύπτειν ἐνδόξως — дела Бога открывать славно (ἀνακαλύπτω, ἐνδόξως). ἀγαθὸν ποιήσατε — делайте добро. κακὸν οὐχ εὑρήσει ὑμᾶς — зло не найдёт вас, не постигнет (εὑρίσκω)."
  8: "ἀγαθὸν προσευχὴ μετὰ νηστείας καὶ ἐλεημοσύνης καὶ δικαιοσύνης — хороша молитва с постом, милостыней и правдой (νηστεία, ἐλεημοσύνη, δικαιοσύνη; 施[ほどこ]し). ἀγαθὸν τὸ ὀλίγον μετὰ δικαιοσύνης ἢ πολὺ μετὰ ἀδικίας — лучше малое с правдой, чем многое с неправдой (ἀδικία). θησαυρίσαι χρυσίον — собирать золото (θησαυρίζω)."
  9: "ἐλεημοσύνη … ἐκ θανάτου ῥύεται — милостыня от смерти избавляет (ῥύομαι). ἀποκαθαριεῖ πᾶσαν ἁμαρτίαν — очистит всякий грех (ἀποκαθαρίζω). οἱ ποιοῦντες ἐλεημοσύνας καὶ δικαιοσύνας — творящие милостыни и правды. πλησθήσονται ζωῆς — исполнятся жизни (πίμπλημι)."
  10: "οἱ ἁμαρτάνοντες — согрешающие (ἁμαρτάνω). πολέμιοί εἰσιν τῆς ἑαυτῶν ζωῆς — враги своей собственной жизни (πολέμιος, ἑαυτῶν)."
  11: "οὐ μὴ κρύψω — усиленное отрицание: «никак не скрою» (κρύπτω). πᾶν ῥῆμα — всякое слово. εἴρηκα δή — «сказал я уже» (perfect от λέγω; δή). Повторение ст. 7 как цитата собственных слов."
  12: "ὅτε προσηύξω — когда ты молился (προσεύχομαι). ἡ νύμφη σου Σαρρα — невестка твоя Сарра (νύμφη, 嫁[よめ]). ἐγὼ προσήγαγον τὸ μνημόσυνον τῆς προσευχῆς ὑμῶν — «я приносил память молитвы вашей» (προσάγω, μνημόσυνον); слав. «аз приношах память молитвы вашея». ἐνώπιον τοῦ ἁγίου — пред Святым. ἔθαπτες τοὺς νεκρούς — ты погребал мёртвых (θάπτω). συμπαρήμην σοι — «я был при тебе» (συμπάρειμι)."
  13: "οὐκ ὤκνησας ἀναστῆναι — не поленился встать (ὀκνέω, ἀνίστημι). καταλιπεῖν τὸ ἄριστόν σου — оставить обед свой (καταλείπω; ἄριστον — утренняя, дневная трапеза). περιστείλῃς τὸν νεκρόν — обернёшь, уберёшь мёртвого (περιστέλλω). οὐκ ἔλαθές με ἀγαθοποιῶν — «не утаился ты от меня, делая добро» (λανθάνω, ἀγαθοποιέω). σὺν σοὶ ἤμην — я был с тобой."
  14: "ἀπέστειλέν με ὁ θεός — Бог послал меня (ἀποστέλλω). ἰάσασθαί σε — исцелить тебя (ἰάομαι). τὴν νύμφην σου Σαρραν — невестку твою Сарру."
  15: "ἐγώ εἰμι Ραφαηλ — «я — Рафаил» (εἰμί; ἐγώ подчёркнуто). εἷς ἐκ τῶν ἑπτὰ ἁγίων ἀγγέλων — один из семи святых ангелов. οἳ προσαναφέρουσιν τὰς προσευχὰς τῶν ἁγίων — которые возносят молитвы святых (προσαναφέρω). εἰσπορεύονται ἐνώπιον τῆς δόξης τοῦ ἁγίου — входят пред славу Святого (εἰσπορεύομαι, δόξα)."
  16: "ἐταράχθησαν οἱ δύο — оба смутились (ταράσσω). ἔπεσον ἐπὶ πρόσωπον — пали на лицо [на землю]. ὅτι ἐφοβήθησαν — потому что устрашились (φοβέομαι)."
  17: "Μὴ φοβεῖσθε — не бойтесь. εἰρήνη ὑμῖν ἔσται — «мир вам будет» (εἰρήνη, 平和; формула приветствия, в переводе передана как пожелание). τὸν δὲ θεὸν εὐλογεῖτε εἰς τὸν αἰῶνα — Бога же благословляйте в век."
  18: "οὐ τῇ ἐμαυτοῦ χάριτι — не своей благодатью, не по своему произволению (χάρις, ἐμαυτοῦ; в тексте {恵み|恩寵} по кальке). τῇ θελήσει τοῦ θεοῦ ἡμῶν — по воле Бога нашего (θέλημα). ὅθεν — поэтому. εὐλογεῖτε αὐτὸν εἰς τὸν αἰῶνα — благословляйте Его в век."
  19: "πάσας τὰς ἡμέρας — все дни. ὠπτανόμην ὑμῖν — «являлся вам» (ὀπτάνομαι). οὐκ ἔφαγον οὐδὲ ἔπιον — не ел и не пил. ὅρασιν ὑμεῖς ἐθεωρεῖτε — «вы видели видение» (ὅρασις, θεωρέω); слав. «видение вы зрясте»."
  20: "ἐξομολογεῖσθε τῷ θεῷ — исповедуйте Богу. ἀναβαίνω πρὸς τὸν ἀποστείλαντά με — восхожу к Пославшему меня (ἀναβαίνω). γράψατε πάντα τὰ συντελεσθέντα εἰς βιβλίον — напишите всё совершившееся в книгу (γράφω, συντελέω, βιβλίον)."
  21: "ἀνέστησαν — встали (ἀνίστημι). οὐκέτι εἶδον αὐτόν — уже не видели его (ὁράω)."
  22: "ἐξωμολογοῦντο — исповедовали, возвещали (imperfect). τὰ ἔργα τὰ μεγάλα καὶ θαυμαστὰ τοῦ θεοῦ — великие и чудные дела Бога (θαυμαστός). ὡς ὤφθη αὐτοῖς ὁ ἄγγελος κυρίου — как явился им ангел Господень (ὤφθη, aor. pass. от ὁράω)."
