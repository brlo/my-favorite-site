verses:
  1: "民[たみ]がすべてヨルダン川[がわ]を渡[わた]り終[お]えたとき、主[しゅ]はヨシュアに語[かた]って言[い]われた。"
  2: "「あなたは民[たみ]のうちから、部族[ぶぞく]ごとに一人[ひとり]ずつ、男[おとこ]たちを連[つ]れて来[き]なさい。"
  3: "彼[かれ]らに命[めい]じて言[い]いなさい。『ヨルダン川[がわ]の中[なか]から、用意[ようい]された十二[じゅうに]の石[いし]を取[と]り上[あ]げ、それを持[も]って行[ゆ]き、今夜[こんや]あなたがたが宿営[しゅくえい]する陣営[じんえい]に置[お]きなさい。』」"
  4: "ヨシュアはイスラエルの子[こ]らのうちから、部族[ぶぞく]ごとに一人[ひとり]ずつ、名[な]だたる者[もの]十二人[にん]を呼[よ]び集[あつ]めた。"
  5: "そして彼[かれ]らに言[い]った。「主[しゅ]の前[まえ]、ヨルダン川[がわ]の中[なか]へ、わたしの前に進[すす]みなさい。そして、そこから各自[かくじ]石[いし]を一[ひと]つずつ取[と]り上[あ]げ、イスラエルの十二[じゅうに]の部族[ぶぞく]の数[かず]に従[したが]って、それを自分[じぶん]の肩[かた]に載[の]せなさい。"
  6: "これはあなたがたの間[あいだ]に、いつまでも置[お]かれるしるしとなるためである。後[のち]の日[ひ]、あなたの子[こ]が、『この石[いし]はあなたがたにとって何[なに]なのか』とあなたに尋[たず]ねるとき、"
  7: "あなたは子[こ]に告[つ]げなさい。『ヨルダン川[がわ]は、全[ぜん]地[ち]の主[しゅ]の契約[けいやく]の箱[はこ]の前[まえ]で水[みず]が尽[つ]きた。それは、箱がヨルダン川を渡[わた]ったときのことである。』こうして、この石[いし]はイスラエルの子[こ]らにとって、永遠[えいえん]に至[いた]る記念[きねん]となる。」"
  8: "イスラエルの子[こ]らはそのとおりに行[おこな]った。主[しゅ]がヨシュアに命[めい]じたとおり、ヨルダン川[がわ]の中[なか]から十二[じゅうに]の石[いし]を取[と]り、イスラエルの子らが渡[わた]り終[お]えるときに主がヨシュアに命じたとおりに、彼[かれ]らはそれを携[たずさ]えて自分[じぶん]たちの陣営[じんえい]へ運[はこ]び、そこに置[お]いた。"
  9: "ヨシュアはまた、ほかの十二[じゅうに]の石[いし]をヨルダン川[がわ]の中[なか]、契約[けいやく]の箱[はこ]を担[かつ]ぐ祭司[さいし]たちの足[あし]の下[した]になった場所[ばしょ]に立[た]てた。それらはそこに、今日[こんにち]に至[いた]るまである。"
  10: "契約[けいやく]の箱[はこ]を担[かつ]ぐ祭司[さいし]たちは、主[しゅ]が民[たみ]に告[つ]げよと命[めい]じられたすべてをヨシュアが行[おこな]い終[お]えるまで、ヨルダン川[がわ]の中[なか]に立[た]っていた。民は急[いそ]いで渡[わた]った。"
  11: "民[たみ]がすべて渡[わた]り終[お]えると、主[しゅ]の契約[けいやく]の箱[はこ]と石[いし]が、彼[かれ]らの前[まえ]を渡った。"
  12: "ルベンの子[こ]らとガドの子らとマナセの部族[ぶぞく]の半分[はんぶん]は、モーセが彼[かれ]らに命[めい]じたとおり、武具[ぶぐ]を整[ととの]えてイスラエルの子らの前[まえ]を渡[わた]った。"
  13: "戦[いくさ]のために武具[ぶぐ]を整[ととの]えた四万[よんまん]人[にん]が、主[しゅ]の前[まえ]、エリコの町[まち]へ向[む]かう戦[たたか]いのために渡[わた]った。"
  14: "その日[ひ]、主[しゅ]はすべてのイスラエルの民[たみ]の前[まえ]でヨシュアを高[たか]くされた。彼[かれ]らは、モーセを恐[おそ]れたようにヨシュアを恐れ、それはヨシュアが生[い]きている間[あいだ]ずっと続[つづ]いた。"
  15: "主[しゅ]はヨシュアに語[かた]って言[い]われた。"
  16: "「主[しゅ]の証[あかし]の契約[けいやく]の箱[はこ]を担[かつ]ぐ祭司[さいし]たちに、ヨルダン川[がわ]から上[あ]がるよう命[めい]じなさい。」"
  17: "ヨシュアは祭司[さいし]たちに命[めい]じて言[い]った。「ヨルダン川[がわ]から上[あ]がりなさい。」"
  18: "主[しゅ]の契約[けいやく]の箱[はこ]を担[かつ]ぐ祭司[さいし]たちがヨルダン川[がわ]から上[あ]がり、足[あし]を地[ち]に置[お]くと、ヨルダン川の水[みず]は元[もと]の場所[ばしょ]へ向[む]かって流[なが]れ出[だ]し、昨日[きのう]も一昨日[おととい]もそうであったように、岸[きし]いっぱいに流れた。"
  19: "民[たみ]は第一[だいいち]の月[つき]の十日[とおか]にヨルダン川[がわ]から上[あ]がった。イスラエルの子[こ]らは、エリコから日[ひ]の昇[のぼ]る方[ほう]のガルガルに陣営[じんえい]を敷[し]いた。"
  20: "ヨシュアは、ヨルダン川[がわ]から取[と]ったあの十二[じゅうに]の石[いし]をガルガルに立[た]てた。"
  21: "そして言[い]った。「後[のち]の日[ひ]、あなたがたの子[こ]らが、『この石[いし]は何[なん]なのか』とあなたがたに尋[たず]ねるとき、"
  22: "あなたがたの子[こ]らに告[つ]げなさい。『イスラエルはこのヨルダン川[がわ]を乾[かわ]いた地[ち]で渡[わた]って来[き]たのだ。"
  23: "それは、主[しゅ]なるわたしたちの神[かみ]が、あなたがたが渡[わた]り終[お]えるまで、あなたがたの前[まえ]でヨルダン川[がわ]の水[みず]を干[ひ]からされたからである。同[おな]じように、主なるわたしたちの神は、わたしたちが過[す]ぎ去[さ]るまで、わたしたちの前で紅海[こうかい]を干からされた。"
  24: "それは、地[ち]のすべての民[たみ]が、主[しゅ]の力[ちから]が強[つよ]いことを知[し]り、あなたがたがいつもあなたがたの神[かみ]である主を敬[うやま]うためである。』」"

notes:
  1: "ἐπεὶ συνετέλεσεν πᾶς ὁ λαὸς διαβαίνων — «когда окончил весь народ переходить» (συντελέω). λέγων — вводит речь ст. 2, отдельно не передаётся."
  2: "Παραλαβὼν ἄνδρας ἀπὸ τοῦ λαοῦ — «взяв мужей из народа» (παραλαμβάνω). В LXX здесь нет числа «двенадцать»: δώδεκα появляется только в ст. 3; в слав. «дванадесять» добавлено уже здесь. ἕνα ἀφ᾿ ἑκάστης φυλῆς — «по одному от каждого племени»."
  3: "σύνταξον — «повели, распорядись» (συντάσσω). Ἀνέλεσθε — «возьмите» (ἀναιρέω). ἑτοίμους δώδεκα λίθους — «готовые двенадцать камней» (ἕτοιμος; слав. «готовых»). διακομίσαντες ἅμα ὑμῖν αὐτοῖς — «перенеся вместе с собою». στρατοπεδείᾳ — «стан» (στρατοπεδία). παρεμβάλητε — «расположитесь станом» (παρεμβάλλω)."
  4: "ἀνακαλεσάμενος — «призвав» (ἀνακαλέω). τῶν ἐνδόξων — «из знатных, именитых» (ἔνδοξος; слав. «славных»)."
  5: "Προσαγάγετε ἔμπροσθέν μου πρὸ προσώπου κυρίου — «подойдите предо мною, пред лицем Господним». ἀράτω ἐπὶ τῶν ὤμων αὐτοῦ — «пусть возложит на плечи свои» (ὦμος — плечо). κατὰ τὸν ἀριθμὸν τῶν δώδεκα φυλῶν — «по числу двенадцати племён»."
  6: "σημεῖον κείμενον διὰ παντός — «знамение, лежащее всегда» (κεῖμαι — лежать). αὔριον — букв. «завтра» (слав. «утро»); передано как 後[のち]の日[ひ], по смыслу и как у Синодального. Вопрос сына — 『…』. Стих кончается запятой: продолжение в ст. 7."
  7: "δηλώσεις — «объявишь, дашь знать» (δηλόω). ἐξέλιπεν ὁ Ιορδάνης ποταμός — «иссяк Иордан-река» (ἐκλείπω). ὡς διέβαινεν αὐτόν — «когда он переходил его». μνημόσυνον — «памятник, память» (記念; слав. «в память»). ἕως τοῦ αἰῶνος — «до века»."
  8: "καθάπερ συνέταξεν κύριος τῷ Ἰησοῖ ἐν τῇ συντελείᾳ τῆς διαβάσεως — «как повелел Господь Иисусу при окончании перехода»; повтор «как повелел» сохранён, как в LXX. διεκόμισαν ἅμα ἑαυτοῖς — «перенесли с собою». ἀπέθηκαν — «положили» (ἀποτίθημι)."
  9: "ἐν τῷ γενομένῳ τόπῳ ὑπὸ τοὺς πόδας τῶν ἱερέων — «на месте, бывшем под ногами священников». ἕως τῆς σήμερον ἡμέρας — «до сего дня»."
  10: "ἕως οὗ συνετέλεσεν Ἰησοῦς πάντα, ἃ ἐνετείλατο κύριος ἀναγγεῖλαι τῷ λαῷ — «доколе не окончил Иисус всего, что повелел Господь возвестить народу». ἔσπευσεν ὁ λαός — «народ поспешил» (σπεύδω). В слав. добавлено «по всем, елика заповеда моисей иисусу» — в греч. нет."
  11: "ἡ κιβωτὸς τῆς διαθήκης κυρίου καὶ οἱ λίθοι ἔμπροσθεν αὐτῶν — «ковчег завета Господня и камни пред ними». В слав. добавлено «(иордан)»; у Синодального «и священники пред народом» — расхождение из-за масоретского текста."
  12: "διεσκευασμένοι — «устроенные, в готовности» (διασκευάζω; слав. «устроены»), т. е. в боевом порядке. οἱ ἡμίσεις φυλῆς Μανασση — «половины племени Манассии» (мн. ч., как в LXX). καθάπερ ἐνετείλατο αὐτοῖς Μωϋσῆς — «как заповедал им Моисей»."
  13: "τετρακισμύριοι — «сорок тысяч» (слав. «четыредесять тысящ»). εὔζωνοι εἰς μάχην — «препоясанные на бой» (εὔζωνος). ἐναντίον κυρίου — «пред Господом». πρὸς τὴν Ιεριχω πόλιν — «к городу Иерихону»."
  14: "ηὔξησεν κύριος τὸν Ἰησοῦν — «возвеличил Господь Иисуса» (αὐξάνω). ἐναντίον παντὸς τοῦ γένους Ισραηλ — «пред всем родом Израиля». ἐφοβοῦντο αὐτὸν ὥσπερ Μωυσῆν — «боялись его, как Моисея». ὅσον χρόνον ἔζη — «сколько времени жил» (слав. «елико время поживе»)."
  15: "Καὶ εἶπεν κύριος τῷ Ἰησοῖ λέγων — обычное введение речи; λέγων относится к ст. 16, отдельно не передаётся."
  16: "κιβωτὸς τῆς διαθήκης τοῦ μαρτυρίου κυρίου — «ковчег завета свидетельства Господня» (μαρτύριον — свидетельство; слав. «кивот завета свидения»); 証の契約の箱 — та же формула, что 証の幕屋. ἐκβῆναι ἐκ τοῦ Ιορδάνου — «выйти из Иордана» (ἐκβαίνω)."
  17: "ἐνετείλατο — «приказал». Ἔκβητε — повелительное от ἐκβαίνω: «выйдите»."
  18: "ὥρμησεν τὸ ὕδωρ τοῦ Ιορδάνου κατὰ χώραν — «устремилась вода Иордана на своё место» (ὁρμάω; κατὰ χώραν — «на своё место»). καθὰ ἐχθὲς καὶ τρίτην ἡμέραν — «как вчера и третьего дня». δι᾿ ὅλης τῆς κρηπῖδος — «по всему основанию», т. е. по всем берегам."
  19: "δεκάτῃ τοῦ μηνὸς τοῦ πρώτου — «в десятый день первого месяца» (слав. «в десятый день перваго месяца»). κατεστρατοπέδευσαν — «расположились станом» (στρατοπεδεύω). κατὰ μέρος τὸ πρὸς ἡλίου ἀνατολάς — «на стороне к востоку солнца»."
  20: "ἔστησεν — «поставил» (ἵστημι). В слав. в конце стиха добавлено «и рече к сыном израилевым», в греч. этого нет: речь вводится в ст. 21 через λέγων."
  21: "λέγων — «говоря»: продолжает ст. 20. ἐρωτῶσιν ὑμᾶς — «спросят вас». Вопрос сыновей — 『…』. Стих кончается запятой: ответ в ст. 22–24."
  22: "ἀναγγείλατε — «возвестите» (ἀναγγέλλω). ἐπὶ ξηρᾶς διέβη Ισραηλ τὸν Ιορδάνην — «по суше перешёл Израиль Иордан»; «сей» у Синодального — добавка, в греч. нет."
  23: "ἀποξηράναντος κυρίου — genitivus absolutus: «когда иссушил Господь» (ἀποξηραίνω). ἐκ τοῦ ἔμπροσθεν αὐτῶν — «от того, что пред ними». В LXX постоянная смена лиц: ἡμῶν (нашего) — αὐτῶν (их) — ἡμῶν — ἡμῶν; в слав. «Богу вашему ... пред ними ... Бог ваш». Разночтение сохранено; японский держится греческого. ἐρυθρὰ θάλασσα — 紅海."
  24: "ὅπως γνῶσιν πάντα τὰ ἔθνη — «чтобы познали все народы» (γινώσκω). ἡ δύναμις τοῦ κυρίου ἰσχυρά — «сила Господня крепка». σέβησθε — «благоговели, чтили» (σέβομαι; слав. «да чтете», у Синодального «боялись»); 敬[うやま]う. ἐν παντὶ χρόνῳ — «во всякое время»."
