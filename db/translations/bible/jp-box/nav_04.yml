# jp-box, Иисус Навин, глава 4. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в этой главе нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 4: повеление взять двенадцать камней (1–3), исполнение (4–8), камни в Иордане (9),
# священники в реке и переход (10–14), выход из Иордана (15–18), стан в Галгале (19–20),
# объяснение камней детям (21–24).
# Речь Бога — 「…」: 2–3, 15–16. Речь Иисуса — 「…」: 5–7, 17, 21–24;
# слова, которые велят передать, и вопрос сыновей — 『…』 (3, 6, 7, 22–24).
# Красного и синего нет.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (проверено по базе).
# Сносок ⟨…⟩ нет: 契約の箱, 祭司, 記念 уже пояснены в корпусе; новых терминов нет.
# jp-ni не использовался.

