verses:
  1: "兄弟[きょうだい]たちよ、時[とき]と時期[じき]については、あなたがたに書[か]き送[おく]る必要[ひつよう]はない。"
  2: "というのは、あなたがた自身[じしん]が、主[しゅ]の日[ひ]が、盗人[ぬすびと]が夜[よる]に来[く]るように来ることを、よく知[し]っているからである。"
  3: "人[ひと]々[びと]が「平安[へいあん]と安全[あんぜん]だ」と言[い]っているとき、滅[ほろ]びが突然[とつぜん]彼[かれ]らに襲[おそ]いかかる。妊婦[にんぷ]に産[さん]の苦[くる]しみが臨[のぞ]むように。そして、彼らは決[けっ]して逃[に]げられない。"
  4: "しかし、兄弟[きょうだい]たちよ、あなたがたは暗[くら]やみのうちにいないので、かの日[ひ]が盗人[ぬすびと]のようにあなたがたを捕[と]らえることはない。"
  5: "というのは、あなたがたは皆[みな]、光[ひかり]の子[こ]、昼[ひる]の子[こ]だからである。わたしたちは、夜[よる]の者[もの]でも、暗[くら]やみの者[もの]でもない。"
  6: "だから、ほかの者[もの]たちのように眠[ねむ]っていてはならない。むしろ、目覚[めざ]めていて、油断[ゆだん]してはならない。"
  7: "というのは、眠[ねむ]る者[もの]は夜[よる]に眠り、酔[よ]う者[もの]は夜に酔うからである。"
  8: "しかし、わたしたちは昼[ひる]の者[もの]であるから、信仰[しんこう]と愛[あい]の胸当[むねあ]て、また救[すく]いの希望[きぼう]の兜[かぶと]を着[き]て、油断[ゆだん]せずにいよう。"
  9: "というのは、神[かみ]はわたしたちを怒[いか]りに定[さだ]めたのではなく、わたしたちの主[しゅ]イエス・キリストによって救[すく]いを得[え]させるために定められたからである。"
  10: "この方[かた]は、わたしたちが目覚[めざ]めていても眠[ねむ]っていても、この方とともに生[い]きるために、わたしたちのために死[し]なれたのである。"
  11: "それゆえ、あなたがたは互[たが]いに慰[なぐさ]め合[あ]い、一人[ひとり]一人[ひとり]を建[た]て上[あ]げなさい。あなたがたがそうしているとおりである。"
  12: "兄弟[きょうだい]たちよ、わたしたちはあなたがたに求[もと]める。あなたがたの間[あいだ]で労[ろう]し、主[しゅ]にあってあなたがたを導[みちび]き、あなたがたを戒[いまし]める者[もの]たちを認[みと]め、"
  13: "彼[かれ]らの働[はたら]きのゆえに、愛[あい]をもって、ひときわ尊[とうと]びなさい。そして、あなたがたは互[たが]いに平和[へいわ]に過[す]ごしなさい。"
  14: "兄弟[きょうだい]たちよ、わたしたちはあなたがたに勧[すす]める。無秩序[むちつじょ]な者[もの]たちを戒め、気[き]落[お]ちした者[もの]たちを慰[なぐさ]め、弱[よわ]い者[もの]たちを支[ささ]え、すべての人[ひと]に対[たい]して寛容[かんよう]でいなさい。"
  15: "見[み]なさい。だれも、悪[あく]をもって悪[あく]に報[むく]いることのないように。むしろ、いつも、互[たが]いに対[たい]しても、すべての人[ひと]に対しても、善[ぜん]を追[お]い求[もと]めなさい。"
  16: "いつも喜[よろこ]んでいなさい。"
  17: "絶[た]えず祈[いの]りなさい。"
  18: "すべてのことに感謝[かんしゃ]しなさい。というのは、これが、キリスト・イエスにあってあなたがたに向[む]けられた神[かみ]の御心[みこころ]だからである。"
  19: "霊[れい]を消[け]してはならない。"
  20: "預言[よげん]を軽[かろ]んじてはならない。"
  21: "しかし、すべてのことを見分[みわ]け、善[よ]いものを堅[かた]く保[たも]ちなさい。"
  22: "すべての悪[わる]い類[たぐい]から遠[とお]ざかりなさい。"
  23: "どうか、平和[へいわ]の神[かみ]ご自身[じしん]が、あなたがたを全[まった]く聖[せい]なる者[もの]としてくださり、あなたがたの霊[れい]と魂[たましい]と体[からだ]が全[まった]きものとして、わたしたちの主[しゅ]イエス・キリストの来臨[らいりん]のときに、責[せ]められるところなく保[たも]たれますように。"
  24: "あなたがたを召[め]しておられる方[かた]は真実[しんじつ]であり、その方[かた]は必[かなら]ずそうしてくださる。"
  25: "兄弟[きょうだい]たちよ、わたしたちのためにも祈[いの]りなさい。"
  26: "すべての兄弟[きょうだい]たちに、聖[せい]なる接吻[せっぷん]をもって挨拶[あいさつ]しなさい。"
  27: "わたしは主[しゅ]によってあなたがたに厳[おごそ]かに命[めい]じる。この手紙[てがみ]をすべての兄弟[きょうだい]たちに読[よ]み聞[き]かせなさい。"
  28: "わたしたちの主[しゅ]イエス・キリストの恵[めぐ]みが、あなたがたとともにありますように。"

notes:
  1: "χρόνοι καὶ καιροί — 時と時期. οὐ χρείαν ἔχετε…γράφεσθαι — 書き送る必要はない."
  2: "ἡμέρα κυρίου — 主の日. ὡς κλέπτης ἐν νυκτί — 盗人が夜に来るように; образ не сглажен."
  3: "Εἰρήνη καὶ ἀσφάλεια — 平安と安全 (прямая речь людей, в 「…」). αἰφνίδιος…ὄλεθρος — 突然の滅び. ὥσπερ ἡ ὠδὶν τῇ ἐν γαστρὶ ἐχούσῃ — 妊婦に産の苦しみが臨むように. οὐ μὴ ἐκφύγωσιν — 決して逃げられない."
  4: "οὐκ ἐστὲ ἐν σκότει — 暗やみのうちにいない. ἵνα…καταλάβῃ — …捕らえることはない."
  5: "υἱοὶ φωτός…υἱοὶ ἡμέρας — 光の子、昼の子. νυκτὸς…σκότους — 夜の者、暗やみの者."
  6: "ἄρα οὖν — だから. μὴ καθεύδωμεν — 眠っていてはならない. γρηγορῶμεν καὶ νήφωμεν — 目覚めていて、油断してはならない."
  7: "οἱ καθεύδοντες…οἱ μεθυσκόμενοι — 眠る者…酔う者."
  8: "θώραξ πίστεως καὶ ἀγάπης — 信仰と愛の胸当て. περικεφαλαία ἐλπὶς σωτηρίας — 救いの希望の兜. νήφωμεν — 油断せずにいよう."
  9: "οὐκ ἔθετο…εἰς ὀργήν — 怒りに定めたのではなく. εἰς περιποίησιν σωτηρίας — 救いを得させるために."
  10: "εἴτε γρηγορῶμεν εἴτε καθεύδωμεν — 目覚めていても眠っていても. ἅμα σὺν αὐτῷ ζήσωμεν — この方とともに生きる."
  11: "Διό — それゆえ. οἰκοδομεῖτε εἷς τὸν ἕνα — 一人一人を建て上げる."
  12: "κοπιῶντας — 労する者. προϊσταμένους — 導く者. νουθετοῦντας — 戒める者. εἰδέναι — 認める."
  13: "ἡγεῖσθαι ὑπερεκπερισσοῦ ἐν ἀγάπῃ — 愛をもって、ひときわ尊ぶ. εἰρηνεύετε ἐν ἑαυτοῖς — 互いに平和に過ごす."
  14: "ἀτάκτους — 無秩序な者. ὀλιγοψύχους — 気落ちした者. ἀντέχεσθε τῶν ἀσθενῶν — 弱い者を支える. μακροθυμεῖτε — 寛容でいる."
  15: "ὁρᾶτε μή τις — だれも…ことのないように. κακὸν ἀντὶ κακοῦ — 悪をもって悪に報いる. τὸ ἀγαθὸν διώκετε — 善を追い求める."
  16: "πάντοτε χαίρετε — いつも喜んでいなさい."
  17: "ἀδιαλείπτως προσεύχεσθε — 絶えず祈りなさい."
  18: "ἐν παντὶ εὐχαριστεῖτε — すべてのことに感謝しなさい. θέλημα θεοῦ ἐν Χριστῷ Ἰησοῦ εἰς ὑμᾶς — キリスト・イエスにあってあなたがたに向けられた神の御心."
  19: "τὸ πνεῦμα μὴ σβέννυτε — 霊を消してはならない; метафора сохранена, «火» не добавлен."
  20: "προφητείας μὴ ἐξουθενεῖτε — 預言を軽んじてはならない."
  21: "πάντα δοκιμάζετε — すべてのことを見分ける. τὸ καλὸν κατέχετε — 善いものを堅く保つ."
  22: "ἀπὸ παντὸς εἴδους πονηροῦ — すべての悪い類から."
  23: "ὁ θεὸς τῆς εἰρήνης — 平和の神. ὁλοτελεῖς — 全く聖なる者. ὁλόκληρον — 全きもの. ἀμέμπτως — 責められるところなく. ἐν τῇ παρουσίᾳ — 来臨のときに."
  24: "πιστὸς ὁ καλῶν — 召しておられる方は真実. ὃς καὶ ποιήσει — 必ずそうしてくださる."
  25: "προσεύχεσθε καὶ περὶ ἡμῶν — わたしたちのためにも祈りなさい."
  26: "ἐν φιλήματι ἁγίῳ — 聖なる接吻; сноска уже при первом упоминании (Рим 16:16), здесь ⟨…⟩ нет."
  27: "Ἐνορκίζω ὑμᾶς τὸν κύριον — 主によって厳かに命じる. ἀναγνωσθῆναι τὴν ἐπιστολήν — この手紙を読み聞かせる."
  28: "ἡ χάρις τοῦ κυρίου…μεθ᾽ ὑμῶν — 主イエス・キリストの恵みが…ともに. ἀμήν в базе нет (в отличие от jp-joc), не добавлено."
