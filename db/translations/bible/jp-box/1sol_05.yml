# jp-box, 1-е Послание к Солунянам, глава 5. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 5: день Господень, как вор ночью (1–3), сыны света (4–8), не в гнев, а во спасение (9–11),
# просьбы к труждающимся (12–13), увещания (14–15), радость, молитва, благодарение (16–18),
# не угашать Духа, не уничижать пророчеств (19–22), освящение целиком (23–24),
# просьба о молитве, приветствие, чтение послания, благословение (25–28).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет, <j>/<mo> не ставятся.
# 〔…〕 в главе нет: в gr-lxx-byz нет ни одного слова в квадратных скобках (проверено по базе).
# Прямая речь людей в 5:3 — 「平安と安全だ」; это не Писание, а слова людей.
# Сносок ⟨…⟩ нет: 聖なる接吻 пояснён при первом упоминании (Рим 16:16). jp-ni не использовался.
# ἀμήν в 5:28 в базе нет (у jp-joc 「アミン」) — не добавлен.

