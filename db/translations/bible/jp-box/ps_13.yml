# jp-box, Псалтирь, псалом 13. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация — славяно-синодальная (csl-ru): в слав. надписание отдельным стихом
# не стоит, поэтому наш стих 0 (надписание) влит в начало стиха 1; дальше номера 1..N.
# Конец псалма слав. делит иначе: ст. 7 — «Кто даст от Сиона спасение
# Израилево?», ст. 8 — «Внегда возвратит Господь пленение…» (наш ст. 7 разрезан).
# Псалом 13 (LXX; евр. 14): «сказал безумец» (1), призрение с неба (2),
# все совратились, с гортанью-гробом и ядом аспидов (3), немилосердные поедатели народа (4),
# страх без причины (5), посрамление совета нищего (6), молитва о спасении из Сиона —
# вопрос (7) и ответ-пожелание (8).
# В ст. 3 длинный ряд (Рим 3:13–18) в gr-lxx-byz стоит в квадратных скобках,
# но слова в базе есть — 〔…〕 не ставятся.
# Красного и синего нет. Кавычки: слова безумца в 1 — 「…」.
# 〔…〕 нет: все слова в gr-lxx-byz есть (в т. ч. ряд в квадратных скобках ст. 3).
# セラ в этом псалме нет; διάψαλμα не передаётся — по решению пользователя, как у jp-joc.
# Сносок ⟨…⟩ нет.
# jp-ni не использовался.

tr_code: jp-box
book: ps
chapter: 13
draft: true

verses:
  1: "指揮者[しきしゃ]に。ダビデの詩[うた]。愚[おろ]かな者[もの]は心[こころ]のうちに「神[かみ]はいない」と言[い]った。彼[かれ]らは腐[くさ]り、その行[おこな]いによって忌[い]まわしいものとなった。善[ぜん]を行[おこな]う者[もの]はなく、一人[ひとり]もいない。"
  2: "主[しゅ]は天[てん]から人[ひと]の子[こ]らをのぞき見[み]て、悟[さと]る者[もの]がいるか、神[かみ]を求[もと]める者[もの]がいるかを見[み]られた。"
  3: "すべての者[もの]が道[みち]を外[そ]れ、そろって無価値[むかち]な者[もの]となった。善[ぜん]を行[おこな]う者[もの]はいない。一人[ひとり]もいない。彼[かれ]らの喉[のど]は開[あ]いた墓[はか]であり、その舌[した]は欺[あざむ]く。その唇[くちびる]の下[した]には蝮[まむし]の毒[どく]があり、その口[くち]は呪[のろ]いと苦[にが]さに満[み]ちている。彼[かれ]らの足[あし]は血[ち]を流[なが]すのに速[はや]く、その道[みち]には破壊[はかい]と悲惨[ひさん]があり、彼[かれ]らは平和[へいわ]の道[みち]を知[し]らなかった。その目[め]の前[まえ]に神[かみ]への恐[おそ]れはない。"
  4: "不法[ふほう]を行[おこな]うすべての者[もの]、すなわち、パンを食[た]べるようにわたしの民[たみ]を食[く]らい尽[つ]くしながら、主[しゅ]を呼[よ]び求[もと]めない者[もの]たちは、悟[さと]らないのか。"
  5: "彼[かれ]らは、恐[おそ]れる所[ところ]もないのに、そこで恐[おそ]れにおののいた。神[かみ]は正[ただ]しい者[もの]の世代[せだい]のうちにおられるからである。"
  6: "あなたがたは、主[しゅ]が彼[かれ]の望[のぞ]みであるという、貧[まず]しい者[もの]の決[けつ]意[い]を辱[はずか]しめた。"
  7: "だれがシオンからイスラエルの救[すく]いを与[あた]えるのか。"
  8: "主[しゅ]がご自分の民[たみ]の捕[と]らわれを帰[かえ]らせるとき、ヤコブは喜[よろこ]び、イスラエルは楽[たの]しむ。"

notes:
  1: "Εἰς τὸ τέλος· ψαλμὸς τῷ Δαυιδ — 指揮者に。ダビデの詩. Надписание — стих 0 (в csl-ru отдельного стиха нет, влито в ст. 1). Εἶπεν ἄφρων ἐν καρδίᾳ αὐτοῦ Οὐκ ἔστιν θεός — 愚かな者は心のうちに「神はいない」と言った (ἄφρων — «безумный»; слова безумца — 「」). διέφθειραν καὶ ἐβδελύχθησαν ἐν ἐπιτηδεύμασιν — 彼らは腐り、その行いによって忌まわしいものとなった (διαφθείρω — «развращаться»; βδελύσσομαι — «гнушаться»). οὐκ ἔστιν ποιῶν χρηστότητα — 善を行う者はいない (χρηστότης — «благость»). οὐκ ἔστιν ἕως ἑνός — 一人もいない (ἕως ἑνός — «до единого»)."
  2: "κύριος ἐκ τοῦ οὐρανοῦ διέκυψεν ἐπὶ τοὺς υἱοὺς τῶν ἀνθρώπων — 主は天から人の子らをのぞき見て (διακύπτω — «выглядывать, приникать»). τοῦ ἰδεῖν εἰ ἔστιν συνίων ἢ ἐκζητῶν τὸν θεόν — 悟る者がいるか、神を求める者がいるかを見られた (συνίημι — «разуметь»; ἐκζητέω — «взыскивать»)."
  3: "πάντες ἐξέκλιναν, ἅμα ἠχρεώθησαν — すべての者が道を外れ、そろって無価値な者となった (ἐκκλίνω — «уклоняться»; ἀχρεόω — «делаться негодным»; та же формула в Рим 3:12 — 無価値, выровнено по корпусу). οὐκ ἔστιν ποιῶν χρηστότητα, οὐκ ἔστιν ἕως ἑνός — повтор ст. 1, сохранён. Далее в базе — ряд в квадратных скобках (Рим 3:13–18): τάφος ἀνεῳγμένος ὁ λάρυγξ αὐτῶν — 喉は開いた墓 (λάρυγξ — «гортань», 喉 как в Рим 3:13). ἰὸς ἀσπίδων ὑπὸ τὰ χείλη αὐτῶν — 唇の下には蝮の毒があり (ἰός — «яд»; ἀσπίς — «аспид», 蝮 как в Рим 3:13). ὧν τὸ στόμα ἀρᾶς καὶ πικρίας γέμει — 口は呪いと苦さに満ちている (ἀρά — «проклятие»; πικρία — «горечь»). ὀξεῖς οἱ πόδες αὐτῶν ἐκχέαι αἷμα — 足は血を流すのに速く (ὀξύς — «острый, быстрый»). σύντριμμα καὶ ταλαιπωρία ἐν ταῖς ὁδοῖς αὐτῶν — 道には破壊と悲惨 (σύντριμμα — «сокрушение», 破壊 как в Рим 3:16). ὁδὸν εἰρήνης οὐκ ἔγνωσαν — 平和の道を知らなかった. οὐκ ἔστιν φόβος θεοῦ ἀπέναντι τῶν ὀφθαλμῶν αὐτῶν — 目の前に神への恐れはない. Слова в базе есть (в квадратных скобках), поэтому 〔…〕 не ставятся. В слав. этого ряда (Рим 3:13–18) нет вовсе — ст. 3 там короче; текст оставлен по гр."
  4: "οὐχὶ γνώσονται πάντες οἱ ἐργαζόμενοι τὴν ἀνομίαν — 不法を行うすべての者は、悟らないのか (γινώσκω — «уразуметь»). οἱ κατεσθίοντες τὸν λαόν μου βρώσει ἄρτου — パンを食べるようにわたしの民を食らい尽くしながら (κατεσθίω — «поедать»; βρῶσις ἄρτου — «снедь хлеба», т. е. как обычный хлеб). τὸν κύριον οὐκ ἐπεκαλέσαντο — 主を呼び求めない者たち (ἐπικαλέομαι — «призывать»)."
  5: "ἐκεῖ ἐδειλίασαν φόβῳ — 彼らはそこで恐れにおののいた (δειλιάω — «робеть»; ἐκεῖ — «там»). οὗ οὐκ ἦν φόβος — 恐れる所もないのに (букв. «где не было страха»). ὅτι ὁ θεὸς ἐν γενεᾷ δικαίᾳ — 神は正しい者の世代のうちにおられるからである (γενεά — «род»)."
  6: "βουλὴν πτωχοῦ κατῃσχύνατε — あなたがたは貧しい者の決意を辱しめた (βουλή — «совет, намерение»; καταισχύνω — «посрамлять»). ὅτι κύριος ἐλπὶς αὐτοῦ ἐστιν — 主が彼の望みであるという (ἐλπίς — 望み)."
  7: "τίς δώσει ἐκ Σιων τὸ σωτήριον τοῦ Ισραηλ — だれがシオンからイスラエルの救いを与えるのか (σωτήριον — «спасение»; вопрос-пожелание). Слав. ст. 7 — только вопрос."
  8: "ἐν τῷ ἐπιστρέψαι κύριον τὴν αἰχμαλωσίαν τοῦ λαοῦ αὐτοῦ — 主がご自分の民の捕らわれを帰らせるとき (αἰχμαλωσία — «плен»). ἀγαλλιάσθω Ιακωβ καὶ εὐφρανθῆτω Ισραηλ — ヤコブは喜び、イスラエルは楽しむ (имена — ヤコブ, イスラエル, как по корпусу). Слав. ст. 8 — вторая половина гр. ст. 7 (в слав. разбивке стих разделён)."
