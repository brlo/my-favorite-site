chapter: 33
draft: true

verses:
  1: "ヤコブは目[め]を上[あ]げて見[み]た。見[み]よ、兄[あに]のエサウが、四百人[よんひゃくにん]の男[おとこ]たちとともに来[き]ている。そこでヤコブは子[こ]どもたちを、レアとラケル、そして二人[ふたり]の女[おんな]奴隷[どれい]の間[あいだ]に分[わ]けた。"
  2: "そして、二人[ふたり]の女[おんな]奴隷[どれい]とその子[こ]どもたちを先[さき]に、レアとその子[こ]どもたちを後[うし]ろに、ラケルとヨセフを最後[さいご]に置[お]いた。"
  3: "彼[かれ]は彼[かれ]らの前[まえ]を進[すす]み、兄[あに]に近[ちか]づくまで、七回[ななかい]地[ち]に伏[ふ]して拝[おが]んだ。"
  4: "エサウは彼[かれ]に会[あ]おうと走[はし]り寄[よ]り、彼[かれ]を抱[だ]きしめて口[くち]づけし、その首[くび]に伏[ふ]した。そして二人[ふたり]は泣[な]いた。"
  5: "エサウは目[め]を上[あ]げて女[おんな]たちと子[こ]どもたちを見[み]、言[い]った。「これはあなたにとって何[なん]なのか。」ヤコブは言[い]った。「神[かみ]があなたのしもべに恵[めぐ]み与[あた]えた子[こ]どもたちだ。」"
  6: "女[おんな]奴隷[どれい]たちとその子[こ]どもたちが近[ちか]づいて、ひれ伏[ふ]した。"
  7: "レアとその子[こ]どもたちも近[ちか]づいて、ひれ伏[ふ]した。その後[あと]で、ラケルとヨセフが近[ちか]づいて、ひれ伏[ふ]した。"
  8: "エサウは言[い]った。「わたしが出会[であ]ったあの陣営[じんえい]はみな、何[なん]のためなのか。」ヤコブは言[い]った。「このしもべがあなたの前[まえ]に恵[めぐ]みを見[み]いだすためだ、ご主人[しゅじん]様[さま]。」"
  9: "エサウは言[い]った。「わたしにはたくさんある。弟[おとうと]よ、あなたのものはあなたのものであれ。」"
  10: "ヤコブは言[い]った。「もしわたしがあなたの前[まえ]に恵[めぐ]みを見[み]いだしているなら、どうか、わたしの手[て]からこの贈[おく]り物[もの]を受[う]け取[と]ってください。あなたの顔[かお]を見[み]たのは、神[かみ]の顔[かお]を見[み]るようなものだったからだ。あなたはわたしを快[こころよ]く受[う]け入[い]れてくださる。"
  11: "どうか、わたしがあなたに持[も]って来[き]た祝福[しゅくふく]を受[う]け取[と]ってください。神[かみ]がわたしをあわれみ、わたしにはすべてのものがあるからだ。」ヤコブはこうして彼[かれ]を強[し]いて、ついに受[う]け取[と]らせた。"
  12: "エサウは言[い]った。「さあ、旅立[たびだ]って、まっすぐに行[ゆ]こう。」"
  13: "ヤコブは彼[かれ]に言[い]った。「ご主人[しゅじん]様[さま]もご存[ぞん]じのとおり、子[こ]どもたちは幼[おさな]く、羊[ひつじ]も牛[うし]もわたしのところで子[こ]を産[う]んでいる。もし一日[いちにち]だけでも追[お]い立[た]てれば、家畜[かちく]はみな死[し]んでしまう。"
  14: "どうか、ご主人[しゅじん]様[さま]はしもべより先[さき]にお進[すす]みください。わたしは、前[まえ]を行[ゆ]くものの歩[あゆ]みに合[あ]わせ、子[こ]どもたちの歩[あゆ]みに合[あ]わせて、道[みち]をゆっくり進[すす]み、ご主人[しゅじん]様[さま]のもと、セイルへ参[まい]る。」"
  15: "エサウは言[い]った。「わたしの者[もの]たちのうち、何人[なんにん]かをあなたとともに残[のこ]そう。」ヤコブは言[い]った。「なぜそうなさるのか。それで十分[じゅうぶん]だ、ご主人[しゅじん]様[さま]。わたしがあなたの心[こころ]にかなったのだから。」"
  16: "その日[ひ]、エサウは自分[じぶん]の道[みち]をセイルへと戻[もど]って行[い]った。"
  17: "ヤコブはスコトへ向[む]かって旅立[たびだ]った。そこで自分[じぶん]のために家[いえ]を建[た]て、家畜[かちく]のためには天幕[てんまく]を張[は]った。それゆえ、その場所[ばしょ]の名[な]をスコトと呼[よ]んだ。"
  18: "ヤコブは、カナンの地[ち]にあるシケムの町[まち]サレムへ来[き]た。シリアのメソポタミアから来[き]たときのことである。そして町[まち]の前[まえ]に陣[じん]を敷[し]いた。"
  19: "そして、自分[じぶん]が天幕[てんまく]を張[は]った畑[はたけ]の一部[いちぶ]を、シケムの父[ちち]ハモルの手[て]から百[ひゃく]匹[ひき]の子羊[こひつじ]で買[か]い取[と]った。"
  20: "そこに祭壇[さいだん]を建[た]て、イスラエルの神[かみ]を呼[よ]び求[もと]めた。"

notes:
  1: "Ἀναβλέψας δὲ Ἰακὼβ εἶδεν — ヤコブは目を上げて見た (ἀναβλέπω — «поднять глаза»). καὶ ἰδοὺ Ἠσαῦ ὁ ἀδελφὸς αὐτοῦ ἐρχόμενος — 見よ、兄のエサウが…来ている (причастие настоящего времени, действие в разгаре). τετρακόσιοι ἄνδρες — 四百人の男たち. ἐπιδιεῖλεν — 分けた (ἐπιδιαιρέω — «разделять, распределять»); ἐπὶ Λείαν καὶ Ῥαχὴλ καὶ τὰς δύο παιδίσκας — レアとラケル、二人の女奴隷の間に (ἐπί + acc. — «на», т. е. по группам). παιδίσκη — 女奴隷 (служанка-рабыня, Валла и Зелфа)."
  2: "ἐν πρώτοις — 先に (букв. «в первых»). ὀπίσω — 後ろに. ἐσχάτους — 最後に (ἔσχατος — «последний»). Порядок греческого сохранён: служанки с детьми, Лия с детьми, Рахиль и Иосиф."
  3: "αὐτὸς δὲ προῆλθεν ἔμπροσθεν αὐτῶν — 彼は彼らの前を進み (προέρχομαι). προσεκύνησεν ἐπὶ τὴν γῆν ἑπτάκις — 七回地に伏して拝んだ (προσκυνέω — «падать ниц, поклоняться»; ἑπτάκις — «семь раз»). ἕως τοῦ ἐγγίσαι τοῦ ἀδελφοῦ αὐτοῦ — 兄に近づくまで."
  4: "προσέδραμεν — 走り寄り (προστρέχω). περιλαβὼν αὐτὸν ἐφίλησεν — 抱きしめて口づけし (περιλαμβάνω, φιλέω). προσέπεσεν ἐπὶ τὸν τράχηλον αὐτοῦ — その首に伏した (προσπίπτω — «падать к»; τράχηλος — «шея»). ἔκλαυσαν ἀμφότεροι — 二人は泣いた."
  5: "Τί ταῦτά σοί ἐστιν; — これはあなたにとって何なのか (букв. «что это тебе?»). οἷς ἠλέησεν ὁ θεὸς τὸν παῖδά σου — 神があなたのしもべに恵み与えた (ἐλεέω — «миловать, оказывать милость»; παῖς — «раб, слуга»)."
  6: "προσήγγισαν — 近づいて (προσγγίζω). προσεκύνησαν — ひれ伏した."
  7: "καὶ μετὰ ταῦτα — その後で. Порядок «Рахиль и Иосиф» — как в LXX (в ru наоборот: «Иосиф и Рахиль»)."
  8: "παρεμβολαί — 陣営 (παρεμβολή — «стан, обоз, ополчение»; здесь караваны даров, шедшие впереди). αἷς ἀπήντηκα — 出会った (ἀπαντάω). Ἵνα εὕρῃ ὁ παῖς σου χάριν ἐναντίον σου, κύριε — このしもべがあなたの前に恵みを見いだすためだ、ご主人様 (χάρις ἐναντίον — «благодать пред», формула благоволения). κύριε — обращение к человеку, поэтому ご主人様, а не 主."
  9: "Ἔστιν μοι πολλά — わたしにはたくさんある. ἄδελφε — 弟よ (Исав старший, обращается к младшему). ἔστω σοι τὰ σά — あなたのものはあなたのものであれ (букв. «пусть будет тебе твоё»)."
  10: "Εἰ εὗρηκα χάριν ἐναντίον σου — もしわたしがあなたの前に恵みを見いだしているなら. δέξαι τὰ δῶρα διὰ τῶν ἐμῶν χειρῶν — わたしの手から贈り物を受け取ってください (δῶρον — «дар»; διὰ τῶν χειρῶν — «через руки», т. е. из рук). ἕνεκεν τούτου εἶδον τὸ πρόσωπόν σου, ὡς ἄν τις ἴδοι πρόσωπον θεοῦ — あなたの顔を見たのは、神の顔を見るようなものだった (намёк на Пенуэл, 32:31). καὶ εὐδοκήσεις με — あなたはわたしを快く受け入れてくださる (εὐδοκέω — «благоволить»). В ru в начале стоит «нет» — это масоретское чтение, в LXX его нет, поэтому без 〔…〕."
  11: "λαβὲ τὰς εὐλογίας μου — わたしが…祝福を受け取ってください (εὐλογία здесь — «дар, благословение-приношение», как слав. «благословение»). ἠλέησέν με ὁ θεός — 神がわたしをあわれみ. ἔστιν μοι πάντα — わたしにはすべてのものがある. ἐβιάσατο αὐτόν — 彼を強いて (βιάζομαι — «настоять, принудить»); καὶ ἔλαβεν — ついに受け取らせた (подлежащее — Исав)."
  12: "Ἀπάραντες πορευσόμεθα ἐπ᾽ εὐθεῖαν — 旅立って、まっすぐに行こう (ἀπαίρω — «сниматься со стоянки»; ἐπ᾽ εὐθεῖαν — «прямо, по прямой»). В ru добавлено «и я пойду пред тобою» — масоретское чтение, в LXX нет, без 〔…〕."
  13: "Ὁ κύριός μου γινώσκει — ご主人様もご存じのとおり. ἁπαλώτερα — 幼く (ἁπαλός — «нежный, мягкий»). λοχεύονται ἐπ᾽ ἐμέ — わたしのところで子を産んでいる (λοχεύω — «рожать»; ἐπ᾽ ἐμέ — «на меня», т. е. на моих руках). ἐὰν οὖν καταδιώξω αὐτοὺς ἡμέραν μίαν — もし一日だけでも追い立てれば (καταδιώκω — «гнать»). ἀποθανοῦνται πάντα τὰ κτήνη — 家畜はみな死んでしまう."
  14: "προελθέτω ὁ κύριός μου ἔμπροσθεν τοῦ παιδός — ご主人様はしもべより先にお進みください. ἐνισχύσω ἐν τῇ ὁδῷ — 道を…進み (ἐνισχύω — «крепиться, набираться сил»; здесь «идти неспешно»). κατὰ σχολὴν τῆς πορεύσεως τῆς ἐναντίον μου — 前を行くものの歩みに合わせて (σχολή — «досуг, медленность»; πορεία — «шествие»; ἐναντίον μου — «передо мной», т. е. скот). κατὰ πόδα τῶν παιδαρίων — 子どもたちの歩みに合わせて (κατὰ πόδα — «в ногу»). εἰς Σηιρ — セイルへ."
  15: "Καταλείψω μετὰ σοῦ ἀπὸ τοῦ λαοῦ τοῦ μετ᾽ ἐμοῦ — わたしの者たちのうち、何人かをあなたとともに残そう. Ἵνα τί τοῦτο; — なぜそうなさるのか. ἱκανὸν ὅτι εὗρον χάριν ἐναντίον σου, κύριε — それで十分だ、ご主人様。わたしがあなたの心にかなったのだから (ἱκανόν — «достаточно»)."
  16: "ἀπέστρεψεν — 戻って行った. εἰς τὴν ὁδὸν αὐτοῦ — 自分の道を. εἰς Σηιρ — セイルへ (страна Исава, юг Заиорданья)."
  17: "Σκηνάς… Σκηναί — スコト (LXX передаёт евр. имя Суккот нарицательным σκηναί, «кущи, шатры»; отсюда слав. «кущы»). ἐποίησεν ἑαυτῷ ἐκεῖ οἰκίας — そこで自分のために家を建て. τοῖς κτήνεσιν αὐτοῦ ἐποίησεν σκηνάς — 家畜のためには天幕を張った. διὰ τοῦτο ἐκάλεσεν τὸ ὄνομα τοῦ τόπου ἐκείνου — それゆえ、その場所の名を…と呼んだ."
  18: "εἰς Σαλημ πόλιν Σικιμων — シケムの町サレムへ (Σαλημ — «Салим», евр. שָׁלֵם; не Иерусалим). ἥ ἐστιν ἐν γῇ Χανααν — カナンの地にある. ὅτε ἦλθεν ἐκ τῆς Μεσοποταμίας Συρίας — シリアのメソポタミアから来たときのことである. παρενέβαλεν κατὰ πρόσωπον τῆς πόλεως — 町の前に陣を敷いた (παρεμβάλλω — «располагать стан»)."
  19: "ἐκτήσατο τὴν μερίδα τοῦ ἀγροῦ — 畑の一部を買い取った (μερίς — «часть, участок»). οὗ ἔστησεν ἐκεῖ τὴν σκηνὴν αὐτοῦ — 自分が天幕を張った. παρὰ Εμμωρ πατρὸς Συχεμ — シケムの父ハモルの手から (LXX Ἐμμώρ; принятая форма имени — ハモル). ἑκατὸν ἀμνῶν — 百匹の子羊 (ἀμνός — «ягнёнок»; LXX передаёт цену так; в евр. «сто кесит»)."
  20: "θυσιαστήριον — 祭壇. ἐπεκαλέσατο τὸν θεὸν Ισραηλ — イスラエルの神を呼び求めた (ἐπικαλέομαι — «призывать, взывать к имени»)."
