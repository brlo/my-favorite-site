# jp-box, Бытие, глава 33. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru)
# и русский Синодальный (ru). jp-joc для Быт 33–38 отсутствует: из Бытия у него есть
# лишь разрозненные главы, а глав 33–38 нет вовсе, поэтому опоры на него здесь нет.
# Язык — современный 常体, без 文語; порядок членов и деление на клаузы — по греческому.
# Глава 33: встреча Иакова с Исавом и поклон до земли (1–7), речи Исава и Иакова (8–11),
# приглашение Исава и отказ Иакова (12–15), возвращение Исава в Сеир (16),
# Иаков в Сокхофе (17), приход в Салим-Сихем и покупка поля (18–20).
# Красного и синего нет: речь людей — в 「…」; вложенной речи в главе нет.
# 〔…〕 нет: в gr-lxx-byz есть все слова. В 33:10 «нет» и в 33:12 «и я пойду пред тобою»
# есть только в ru (масоретский текст) — в 〔…〕 не берутся, отмечены в notes.
# Сносок ⟨…⟩ нет: 陣営, 祭壇, 天幕, 家畜 — понятные слова или уже встречались в корпусе.
# jp-ni не использовался.

