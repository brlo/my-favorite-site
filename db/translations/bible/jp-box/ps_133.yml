# jp-box, Псалтирь, псалом 133. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация — славяно-синодальная (csl-ru): в слав. надписание отдельным стихом
# не стоит, поэтому наш стих 0 (надписание) влит в начало стиха 1; дальше номера 1..3.
# Псалом 133: ночная стража в доме Господнем (1), воздетые руки (2),
# благословение от Сиона (3).
# Красного и синего нет. Кавычек нет: в псалме нет прямой речи.
# 〔…〕 нет: перевод сделан по gr-lxx-byz, добавлений Церкви не вносилось.
# セラ (διάψαλμα) в этой главе нет.
# Сносок ⟨…⟩ нет: 聖所, 庭 уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: ps
chapter: 133
draft: true

verses:
  1: "登[とう]上[じょう]の歌[うた]。見[み]よ、主[しゅ]の僕[しもべ]たちよ、主[しゅ]の家[いえ]に、わたしたちの神[かみ]の家[いえ]の庭[にわ]に立[た]つ者[もの]たちよ、主[しゅ]をほめたたえよ。"
  2: "夜[よる]の間[あいだ]、聖所[せいしょ]に向[む]かって手[て]を上[あ]げ、主[しゅ]をほめたたえよ。"
  3: "天[てん]と地[ち]を造[つく]られた主[しゅ]が、シオンからあなたを祝福[しゅくふく]してくださる。"

notes:
  1: "Ὠιδὴ τῶν ἀναβαθμῶν — 登[とう]上[じょう]の歌. Стих 0; совпадает в gr-lxx-byz и в ru-базе. В csl-ru отдельного стиха 0 нет — надписание влито в ст. 1. Ἰδοὺ δὴ εὐλογεῖτε τὸν κύριον — 見よ、…主をほめたたえよ (εὐλογέω здесь «благословлять, хвалить»; императив). πάντες οἱ δοῦλοι κυρίου — 主の僕たちよ (δοῦλος — 僕). οἱ ἑστῶτες ἐν οἴκῳ κυρίου — 主の家に立つ者たちよ (ἵστημι — «стоять», т. е. служащие при храме). ἐν αὐλαῖς οἴκου θεοῦ ἡμῶν — わたしたちの神の家の庭に (αὐλή — 庭, ср. 121:2). Восклицание 見よ — ἰδού."
  2: "ἐν ταῖς νυξὶν ἐπάρατε τὰς χεῖρας ὑμῶν — 夜の間、手を上げ (νύξ — 夜; ἐπαίρω — «поднимать»; мн. νυξίν — «ночами»). εἰς τὰ ἅγια — 聖所に向かって (ἅγια — «святое, святилище»; предлог εἰς — «к, в направлении»). καὶ εὐλογεῖτε τὸν κύριον — 主をほめたたえよ (повтор глагола из ст. 1 сохранён)."
  3: "εὐλογήσει σε κύριος ἐκ Σιων — 主が…シオンからあなたを祝福してくださる (εὐλογέω — «благословлять»; ответ на призыв: люди благословляют Бога, Бог благословляет человека, один глагол на оба движения). ὁ ποιήσας τὸν οὐρανὸν καὶ τὴν γῆν — 天と地を造られた方 (формула Творца, ср. 120:2; 123:8)."
