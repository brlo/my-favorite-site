chapter: 1
draft: true

verses:
  1: "主[しゅ]の言葉[ことば]の預言[よげん]。イスラエルについて、その使[つか]いの手[て]によって。これをあなたがたの心[こころ]に置[お]け。"
  2: "「わたしはあなたがたを愛[あい]した、と主[しゅ]は言[い]われる。あなたがたは言[い]う。『どのようにして、あなたはわたしたちを愛[あい]されたのか』と。エサウはヤコブの兄弟[きょうだい]ではなかったか、と主[しゅ]は言[い]われる。わたしはヤコブを愛[あい]し、エサウを憎[にく]んだ。"
  3: "わたしは彼[かれ]の境[さかい]を滅[ほろ]びに、彼[かれ]の嗣業[しぎょう]を荒野[こうや]の洞[ほら]に変[か]えた。"
  4: "エドムが『わたしたちは滅[ほろ]ぼされたが、荒[あ]れた所[ところ]を建[た]て直[なお]そう』と言[い]うなら、万軍[ばんぐん]の主[しゅ]はこう言[い]われる。彼らは建[た]てるが、わたしは壊[こわ]す。彼らは『不法[ふほう]の境[さかい]』、『主[しゅ]がとこしえに怒[いか]りを向[む]けられる民[たみ]』と呼[よ]ばれる。"
  5: "あなたがたの目[め]はそれを見[み]、あなたがたは言[い]う。『主[しゅ]はイスラエルの境[さかい]を越[こ]えて大[おお]いなる方[かた]となられた』と」。"
  6: "「子[こ]は父[ちち]を敬[うやま]い、しもべは主人[しゅじん]を恐[おそ]れる。もしわたしが父[ちち]であるなら、わたしへの敬[けい]いはどこにあるのか。もしわたしが主[しゅ]であるなら、わたしへの恐[おそ]れはどこにあるのか、と万軍[ばんぐん]の主[しゅ]は言[い]われる。わたしの名[な]を軽[かろ]んじる祭司[さいし]たちよ。あなたがたは言[い]う。『どのようにして、わたしたちはあなたの名[な]を軽[かろ]んじたのか』と。"
  7: "あなたがたはわたしの祭壇[さいだん]に汚[けが]れたパンをささげ、しかも言[い]う。『どのようにして、わたしたちはあなたを汚[けが]したのか』と。あなたがたが『主[しゅ]の卓[たく]は汚[けが]れている』と言[い]い、その上[うえ]に置[お]かれた食物[しょくもつ]は滅[ほろ]ぼされたからである。"
  8: "また、あなたがたが盲[めくら]のものを犠牲[ぎせい]にささげても、それは悪[わる]いことではないのか。足[あし]の不自由[ふじゆう]なもの、病[やまい]のあるものをささげても、悪[わる]いことではないのか。それをあなたの支配者[しはいしゃ]に持[も]って行[い]け。彼[かれ]はあなたを喜[よろこ]んで受[う]け入[い]れ、あなたの顔[かお]を上[あ]げてくれるか、と万軍[ばんぐん]の主[しゅ]は言[い]われる。"
  9: "今[いま]、あなたがたは神[かみ]の顔[かお]をなだめて、彼[かれ]に願[ねが]え。これらはあなたがたの手[て]のうちにあった。あなたがたの顔[かお]を受[う]け入[い]れるだろうか、と万軍[ばんぐん]の主[しゅ]は言[い]われる。"
  10: "あなたがたの間[あいだ]では戸[と]は閉[と]ざされる。あなたがたはわたしの祭壇[さいだん]にむだに火[ひ]を燃[も]やさない。わたしはあなたがたを喜[よろこ]ばない、と万軍[ばんぐん]の主[しゅ]は言[い]われる。わたしはあなたがたの手[て]からささげ物[もの]を受[う]け取[と]らない。"
  11: "日の出[ひので]から日[ひ]の入[い]りまで、わたしの名[な]は異邦人[いほうじん]の間[あいだ]で大[おお]いなるものとされている。どこでも、わたしの名[な]に香[こう]と清[きよ]い犠牲[ぎせい]がささげられている。わたしの名[な]は異邦人[いほうじん]の間[あいだ]で大[おお]いなるものだからである、と万軍[ばんぐん]の主[しゅ]は言[い]われる。"
  12: "しかし、あなたがたはそれを汚[けが]している。あなたがたが『主[しゅ]の卓[たく]は汚[けが]れている』と言[い]い、その上[うえ]の食物[しょくもつ]を軽[かろ]んじているからである。"
  13: "また、あなたがたは言[い]う。『見[み]よ、なんと面倒[めんどう]なことか』と。わたしはそれらを吹[ふ]き払[はら]った、と万軍[ばんぐん]の主[しゅ]は言[い]われる。あなたがたは奪[うば]い取[と]った物[もの]、足[あし]の不自由[ふじゆう]なもの、病[やまい]のあるものを連[つ]れて来[き]て、それをささげ物[もの]として持[も]って来[く]る。わたしはそれをあなたがたの手[て]から受[う]け入[い]れるだろうか、と万軍[ばんぐん]の主[しゅ]は言[い]われる。"
  14: "自分の群[む]れに雄[おす]がいて力[ちから]があり、誓[ちか]いを立[た]てながら、傷[きず]のあるものを主[しゅ]にささげる者[もの]は呪[のろ]われる。わたしは大[おお]いなる王[おう]、と万軍[ばんぐん]の主[しゅ]は言[い]われる。わたしの名[な]は異邦人[いほうじん]の間[あいだ]で恐[おそ]れられている」。"

notes:
  1: "Λῆμμα λόγου κυρίου ἐπὶ τὸν Ισραηλ — «принятие (бремя) слова Господня об Израиле» (λῆμμα — взятое, ноша, пророческое слово; слав. «пророчество словесе Господня»); ἐν χειρὶ ἀγγέλου αὐτοῦ — «рукою ангела (вестника) его»: в LXX и слав. — ангел, в ru/МТ «через Малахию»; в тексте 使[つか]い, не 天使. θέσθε δὴ ἐπὶ τὰς καρδίας ὑμῶν — «положите это на сердца ваши»: в слав. то же, вне кавычек как начальное увещание."
  2: "Ἠγάπησα ὑμᾶς — «Я возлюбил вас» (аорист); Ἐν τίνι ἠγάπησας ἡμᾶς — «в чём Ты возлюбил нас»; οὐκ ἀδελφὸς ἦν Ησαυ τοῦ Ιακωβ — «не брат ли Исав Иакову»; καὶ ἠγάπησα τὸν Ιακωβ, τὸν δὲ Ησαυ ἐμίσησα — «и возлюбил Иакова, а Исава возненавидел». Слав. 1:2 включает «исава же возненавидех»; поэтому «憎んだ» — в этом стихе, а 1:3 начинается с «учиних пределы его»."
  3: "ἔταξα τὰ ὅρια αὐτοῦ εἰς ἀφανισμὸν — «Я положил пределы его в истребление» (ὅριον — предел, граница; ἀφανισμός — уничтожение); τὴν κληρονομίαν αὐτοῦ εἰς δόματα ἐρήμου — «и наследие его в дары (жилища) пустыни» (δόμα — дар, даяние; слав. «в нырища пустынна» — в логова пустыни). В тексте 荒野[こうや]の洞[ほら] по слав."
  4: "διότι ἐρεῖ ἡ Ιδουμαία Κατέστραπται — «если скажет Идумея: мы разрушены» (καταστρέφω); ἐπιστρέψωμεν καὶ ἀνοικοδομήσωμεν τὰς ἐρήμους — «обратимся и построим пустыни»; τάδε λέγει κύριος παντοκράτωρ Αὐτοὶ οἰκοδομήσουσιν, καὶ ἐγὼ καταστρέψω — «так говорит Господь Вседержитель: они построят, а Я разрушу»; ἐπικληθήσεται αὐτοῖς ὅρια ἀνομίας — «и назовутся они пределами беззакония»; λαὸς ἐφ᾽ ὃν παρατέτακται κύριος ἕως αἰῶνος — «народ, на который Господь ополчился навек» (παρατάσσω — выстраивать против). В LXX и слав. — Идумея, в ru/МТ — Едом; в тексте エドム."
  5: "καὶ οἱ ὀφθαλμοὶ ὑμῶν ὄψονται — «и глаза ваши увидят»; Ἐμεγαλύνθη κύριος ὑπεράνω τῶν ὁρίων τοῦ Ισραηλ — «возвеличился Господь превыше пределов Израиля» (ὑπεράνω — над, выше). Здесь первое слово Господа (1:2–5) закрывается."
  6: "Υἱὸς δοξάζει πατέρα καὶ δοῦλος τὸν κύριον αὐτοῦ — «сын славит отца и раб господина своего» (δοξάζω — славить, чтить); εἰ πατήρ εἰμι ἐγώ, ποῦ ἐστιν ἡ δόξα μου — «если Я отец, где слава Моя»; εἰ κύριός εἰμι ἐγώ, ποῦ ἐστιν ὁ φόβος μου — «если Я господь, где страх Мой»; ὑμεῖς οἱ ἱερεῖς οἱ φαυλίζοντες τὸ ὄνομά μου — «вы, священники, унижающие имя Моё» (φαυλίζω — унижать, считать ничтожным); Ἐν τίνι ἐφαυλίσαμεν τὸ ὄνομά σου — «чем мы унизили имя Твоё». Здесь начинается второе слово (1:6–2:9)."
  7: "προσάγοντες πρὸς τὸ θυσιαστήριόν μου ἄρτους ἠλισγημένους — «приносящие на жертвенник Мой хлебы осквернённые» (ἀλισγέω — осквернять; ἄρτος — хлеб); Τράπεζα κυρίου ἐξουδενωμένη ἐστίν — «трапеза Господня унижена» (ἐξουδενόω — уничижать); τὰ ἐπιτιθέμενα βρώματα ἐξουδενωμένα — «положенные на ней яства унижены»."
  8: "ἐὰν προσαγάγητε τυφλὸν εἰς θυσίαν, οὐ κακόν — «если принесёте слепое в жертву, не худо ли»; χωλὸν ἢ ἄρρωστον — «хромое или больное»; προσάγαγε δὴ αὐτὸ τῷ ἡγουμένῳ σου — «принеси его твоему начальнику (князю)»; εἰ προσδέξεται αὐτό — «примет ли он это»; εἰ λήμψεται πρόσωπόν σου — «поднимет ли лицо твоё (будет ли к тебе благосклонен)»."
  9: "καὶ νῦν ἐξιλάσκεσθε τὸ πρόσωπον τοῦ θεοῦ ὑμῶν καὶ δεήθητε αὐτοῦ — «итак умилостивьте лицо Бога вашего и помолитесь Ему» (ἐξιλάσκομαι — умилостивлять; δέομαι — молить); ἐν χερσὶν ὑμῶν γέγονεν ταῦτα — «в руках ваших стало это»; εἰ λήμψομαι ἐξ ὑμῶν πρόσωπα ὑμῶν — «приму ли от вас лица ваши». Слав. содержит в скобках «(да помилует вы)» — редакционная вставка, не перенесена."
  10: "διότι καὶ ἐν ὑμῖν συγκλεισθήσονται θύραι — «ибо и у вас затворятся двери» (συγκλείω — затворять); οὐκ ἀνάψετε τὸ θυσιαστήριόν μου δωρεάν — «не возожжёте жертвенника Моего напрасно» (δωρεάν — даром, напрасно); οὐκ ἔστιν μου θέλημα ἐν ὑμῖν — «нет Моего благоволения в вас»; θυσίαν οὐ προσδέξομαι ἐκ τῶν χειρῶν ὑμῶν — «жертвы не приму из рук ваших»."
  11: "ἀπ᾽ ἀνατολῶν ἡλίου ἕως δυσμῶν — «от востока солнца до запада»; τὸ ὄνομά μου δεδόξασται ἐν τοῖς ἔθνεσιν — «имя Моё прославлено в народах»; ἐν παντὶ τόπῳ θυμίαμα προσάγεται τῷ ὀνόματί μου καὶ θυσία καθαρά — «на всяком месте приносится имени Моему фимиам и жертва чистая» (θυμίαμα — фимиам, 香); μέγα τὸ ὄνομά μου ἐν τοῖς ἔθνεσιν — «велико имя Моё в народах»."
  12: "ὑμεῖς δὲ βεβηλοῦτε αὐτὸ ἐν τῷ λέγειν ὑμᾶς — «вы же оскверняете его, говоря» (βεβηλόω — осквернять, профанировать); Τράπεζα κυρίου ἠλισγημένη ἐστίν — «трапеза Господня осквернена»; τὰ ἐπιτιθέμενα ἐξουδένωνται βρώματα αὐτοῦ — «положенные яства его унижены»."
  13: "Ταῦτα ἐκ κακοπαθείας ἐστίν — «это от злострадания (тяготы)» (κακοπάθεια — страдание, труд); ἐξεφύσησα αὐτά — «Я дунул на них (отверг)»; εἰσεφέρετε ἁρπάγματα καὶ τὰ χωλὰ καὶ τὰ ἐνοχλούμενα — «вы вносите похищенное, хромое и обеспокоенное (больное)» (ἅρπαγμα — похищенное; ἐνοχλέω — беспокоить, быть недужным); ἐὰν φέρητε τὴν θυσίαν, εἰ προσδέξομαι αὐτά — «если принесёте жертву, приму ли её»."
  14: "ἐπικατάρατος ὃς ἦν δυνατὸς καὶ ὑπῆρχεν ἐν τῷ ποιμνίῳ αὐτοῦ ἄρσεν — «проклят тот, кто силён и у кого в стаде есть самец» (ἄρσεν — самец); εὐχὴ αὐτοῦ ἐπ᾽ αὐτῷ — «обет его на нём»; θύει διεφθαρμένον τῷ κυρίῳ — «приносит в жертву Господу повреждённое»; βασιλεὺς μέγας ἐγώ εἰμι — «Я Царь великий»; τὸ ὄνομά μου ἐπιφανὲς ἐν τοῖς ἔθνεσιν — «имя Моё славно (явно) в народах». Здесь слово 1:6–14 закрывается."
