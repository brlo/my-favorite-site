# jp-box, Малахия, глава 1. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной (csl-ru): 4 главы, 55 стихов (14 + 17 + 18 + 6).
# В gr-lxx-byz 3 главы (3:24), у слав. 4-я: слав. 3:1–18 = gr 3:1–18; слав. 4:1–3 =
# gr 3:19–21; слав. 4:4 = gr 3:24; слав. 4:5–6 = gr 3:22–23 (в LXX порядок «Илия —
# закон», в слав. «закон — Илия»). Карта — в шапке 4-й главы и в notes к 4:4–6.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена: マラキ, ヤコブ, エサウ, エドム, イスラエル, ユダ,
# エルサレム, レビ, モーセ, エリヤ.
#
# Содержание: 1 надписание; 2–5 «Я возлюбил вас»: Иаков и Исав, Едом, «Господь
# возвеличен над пределами Израиля»; 6–14 обличение священников: нечистый хлеб,
# слепые и хромые жертвы, «трапеза Господня унижена», имя Господне велико у язычников,
# проклят приносящий повреждённое.
# Голоса: 1:1 — надписание вне кавычек (в конце — «положите на сердца ваших»);
# 1:2–5 — 「…» (слова народа — 『…』, слова Едома — 『…』); 1:6–14 — 「…» (слова
# священников — 『…』; «говорит Господь» внутри речи).
# 1:2–3: слав. 1:2 включает «исава же возненавидех», поэтому «憎んだ» стоит в 1:2,
# а 1:3 начинается с «учиних пределы его».
#
tr_code: jp-box
