# jp-box, 1-е Послание Иоанна, глава 1. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 1: пролог о Слове жизни (1–4), Бог есть свет (5),
# хождение во свете, исповедание и прощение грехов (6–10).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет, <j>/<mo> не ставятся.
# 〔…〕 в главе нет: греческий текст базы полон, все слова в нём есть (проверено по gr-lxx-byz).
# Сносок ⟨…⟩ в главе нет: 命, 光, 闇, 罪 уже встречались в корпусе. jp-ni не использовался.
#
# ὁ λόγος τῆς ζωῆς — 命[いのち]の言葉[ことば] (то же слово, что в Ин 1:1);
# κοινωνία — 交[まじ]わり; ἀγγελία — 知[し]らせ; σκοτία — 闇[やみ].

tr_code: jp-box
book: 1in
chapter: 1
draft: true

verses:
  1: "初[はじ]めからあったもの、わたしたちが聞[き]いたもの、わたしたちが目[め]で見[み]たもの、わたしたちがじっと見[み]つめたもの、わたしたちの手[て]で触[ふ]れたもの、すなわち、命[いのち]の言葉[ことば]について。"
  2: "その命[いのち]は現[あらわ]れ、わたしたちはそれを見[み]て証[あか]しをし、永遠[えいえん]の命[いのち]をあなたがたに告[つ]げ知[し]らせる。この命[いのち]は父[ちち]のもとにあったもので、わたしたちに現[あらわ]れたのである。"
  3: "わたしたちが見[み]たこと、聞[き]いたことを、あなたがたにも告[つ]げ知[し]らせる。それは、あなたがたもわたしたちと交[まじ]わりを持[も]つためである。わたしたちの交[まじ]わりは、父[ちち]とその御子[みこ]イエス・キリストとの交[まじ]わりである。"
  4: "わたしたちがこのことを書[か]くのは、わたしたちの喜[よろこ]びが満[み]ちあふれるためである。"
  5: "わたしたちがこの方[かた]から聞[き]いて、あなたがたに伝[つた]える知[し]らせは、これである。すなわち、神[かみ]は光[ひかり]であり、そのうちには闇[やみ]がまったくない。"
  6: "もし、わたしたちがこの方[かた]との交[まじ]わりを持[も]つと言[い]いながら闇[やみ]を歩[あゆ]むなら、わたしたちは偽[いつわ]りを言[い]い、真理[しんり]を行[おこな]っていないのである。"
  7: "しかし、この方[かた]が光[ひかり]のうちにおられるのと同[おな]じように、わたしたちが光[ひかり]のうちを歩[あゆ]むなら、わたしたちは互[たが]いに交[まじ]わりを持[も]ち、その御子[みこ]イエスの血[ち]が、すべての罪[つみ]からわたしたちを清[きよ]めてくださる。"
  8: "もし、わたしたちに罪[つみ]がないと言[い]うなら、わたしたちは自分[じぶん]を欺[あざむ]いていて、真理[しんり]はわたしたちのうちにない。"
  9: "もし、わたしたちが自分[じぶん]の罪[つみ]を告白[こくはく]するなら、この方[かた]は信[しん]実[じつ]で義[ただ]しい方[かた]であるから、わたしたちの罪[つみ]を赦[ゆる]し、すべての不義[ふぎ]からわたしたちを清[きよ]めてくださる。"
  10: "もし、わたしたちが罪[つみ]を犯[おか]したことがないと言[い]うなら、わたしたちはこの方[かた]を偽[いつわ]り者[もの]とすることになり、その御言葉[みことば]はわたしたちのうちにない。"

notes:
  1: "Ὃ ἦν ἀπ᾽ ἀρχῆς — 初めからあったもの. Четыре относительных ὃ подряд сохранены как четыре однородных оборота с もの; ἀκηκόαμεν — 聞いた, ἑωράκαμεν — 目で見た (τοῖς ὀφθαλμοῖς ἡμῶν не сглажено), ἐθεάσαμεν — じっと見つめた (созерцали), ἐψηλάφησαν — 手で触れた. ὁ λόγος τῆς ζωῆς — 命の言葉, то же слово, что ὁ λόγος в Ин 1:1 (в корпусе — 言葉). Стих обрывается на περὶ τοῦ λόγου τῆς ζωῆς, как и в греческом: сказуемое в ст. 3."
  2: "ἡ ζωὴ ἐφανερώθη — 命は現れ. ἥτις ἦν πρὸς τὸν πατέρα — 父のもとにあったもので (πρός — при, у; не «к»). ἀπαγγέλλομεν — 告げ知らせる. Порядок «увидели — свидетельствуем — возвещаем» сохранён."
  3: "κοινωνία — 交わり (в корпусе так же). ἵνα καὶ ὑμεῖς κοινωνίαν ἔχητε μεθ᾽ ἡμῶν — あなたがたもわたしたちと交わりを持つため. ἡ κοινωνία δὲ ἡ ἡμετέρα — わたしたちの交わり. μετὰ τοῦ πατρὸς καὶ μετὰ τοῦ υἱοῦ αὐτοῦ — 父とその御子…との交わり (два μετά, предлог не повторён по-японски)."
  4: "ἡ χαρὰ ἡμῶν — わたしたちの喜び: в базе ἡμῶν, поэтому не «ваша» (у jp-joc 爾等の喜び — иное чтение, за базой не идём). γράφομεν — настоящее время, 書く."
  5: "ἀγγελία — 知らせ (ἐπαγγελία в 2:25 — 約束). ἀπ᾽ αὐτοῦ — от Него, то есть от Христа: この方から. ὁ θεὸς φῶς ἐστιν — 神は光であり. οὐδεμία — まったく…ない (усиление сохранено)."
  6: "ἐὰν εἴπωμεν — もし…言うなら (сослагательное с ἐάν — условие). κοινωνίαν ἔχομεν μετ᾽ αὐτοῦ — この方との交わりを持つ. ἐν τῷ σκότει περιπατῶμεν — 闇を歩む. ψευδόμεθα — 偽りを言い; οὐ ποιοῦμεν τὴν ἀλήθειαν — 真理を行っていない (ποιέω — делать, не «говорить»)."
  7: "ἐν τῷ φωτὶ περιπατῶμεν ὡς αὐτός ἐστιν ἐν τῷ φωτί — 光のうちを歩む…光のうちにおられるのと同じように (двойное ἐν τῷ φωτί сохранено). κοινωνίαν ἔχομεν μετ᾽ ἀλλήλων — 互いに交わりを持つ. καθαρίζει — настоящее время, 清めてくださる: очищение совершается постоянно."
  8: "ἑαυτοὺς πλανῶμεν — 自分を欺いている. ἡ ἀλήθεια οὐκ ἔστιν ἐν ἡμῖν — 真理はわたしたちのうちにない. Слова Иоанна, не цитата и не речь: кавычек нет."
  9: "ὁμολογῶμεν — 告白する (не «признаём» в смысле «сознаёмся»; ὁμολογία — исповедание веры). πιστός ἐστιν καὶ δίκαιος — 信実で義しい方; ἵνα ἀφῇ — 赦し…てくださる (ἵνα после πιστός — следствие, передано причиной であるから). ἀδικία — 不義."
  10: "ψεύστην ποιοῦμεν αὐτόν — この方を偽り者とすることになり. ὁ λόγος αὐτοῦ — その御言葉. οὐχ ἡμαρτήκαμεν — perfect: 罪を犯したことがない."
