verses:
  1: "わたしはこれらすべてを心[こころ]に置[お]き、心[こころ]はこれらすべてを見[み]た。すなわち、正[ただ]しい者[もの]も知恵[ちえ]ある者[もの]も、その業[わざ]も神[かみ]の御手[みて]のうちにある。しかも人[ひと]は、愛[あい]も憎[にく]しみも知[し]らない。すべては彼[かれ]らの面前[めんぜん]にある。"
  2: "すべてにおいて空[むな]しい。正[ただ]しい者[もの]にも不敬虔[ふけいけん]な者[もの]にも、善[よ]い者[もの]にも悪[わる]い者[もの]にも、清[きよ]い者[もの]にも汚[けが]れた者[もの]にも、いけにえをささげる者[もの]にもささげない者[もの]にも、同[おな]じ一[ひと]つの巡[めぐ]り合[あ]わせがある。善[よ]い者[もの]も罪[つみ]を犯[おか]す者[もの]も同[おな]じであり、誓[ちか]う者[もの]も誓[ちか]いを畏[おそ]れる者[もの]も同[おな]じである。"
  3: "日[ひ]の下[もと]でなされたすべてのことのうちにある悪[わる]はこれである。すべての者[もの]に同[おな]じ巡[めぐ]り合[あ]わせがある。また、人[ひと]の子[こ]らの心[こころ]は悪[わる]で満[み]ち、その生涯[しょうがい]の間[あいだ]、心[こころ]には迷[まよ]いがあり、その後[あと]は死[し]者[しゃ]のもとへ行[ゆ]く。"
  4: "生[い]ける者[もの]すべてと交[まじ]わる者[もの]は、誰[だれ]であろうか。生[い]けた犬[いぬ]は死[し]んだ獅子[しし]にまさる、という望[のぞ]みがある。"
  5: "生[い]ける者[もの]たちは、自分[じぶん]が死[し]ぬことを知[し]っている。しかし死[し]んだ者[もの]たちは何[なに]も知[し]らない。彼[かれ]らにはもはや報[むく]いもなく、その記憶[きおく]さえ忘[わす]れられている。"
  6: "彼[かれ]らの愛[あい]も、憎[にく]しみも、妬[ねた]みも、すでに滅[ほろ]びた。日[ひ]の下[もと]でなされるすべてのことのうちに、彼[かれ]らの受[う]ける分[ぶん]は永遠[えいえん]にもはやない。"
  7: "さあ、喜[よろこ]びのうちにパンを食[た]べ、心[こころ]の良[よ]いままにぶどう酒[さけ]を飲[の]め。神[かみ]はすでにあなたの業[わざ]を良[よ]しとされたからである。"
  8: "いつもあなたの衣[ころも]を白[しろ]くしておき、頭[あたま]に香油[こうゆ]を絶[た]やしてはならない。"
  9: "あなたが愛[あい]した妻[つま]とともに、空[むな]しい生涯[しょうがい]のすべても、日[ひ]の下[もと]であなたに与[あた]えられた空[むな]しい日々[ひび]のすべても、生[い]きよ。それがあなたの生涯[しょうがい]の分[ぶん]、日[ひ]の下[もと]であなたが労苦[ろうく]するその労苦[ろうく]の分[ぶん]だからである。"
  10: "あなたの手[て]が見[み]いだすすべてのことを、あなたの力[ちから]の及[およ]ぶかぎり行[おこな]え。あなたが行[ゆ]く陰府[よみ]には、業[わざ]も考[かんが]えも知識[ちしき]も知恵[ちえ]もないからである。"
  11: "わたしは向[む]きを変[か]えて、日[ひ]の下[もと]を見[み]た。走[はし]ることは軽[かろ]やかな者[もの]のものではなく、戦[いくさ]は強[つよ]い者[もの]のものではない。パンも知恵[ちえ]ある者[もの]のものではなく、富[とみ]も分別[ふんべつ]ある者[もの]のものではなく、{恵[めぐ]み|恩寵[おんちょう]}も知識[ちしき]ある者[もの]のものではない。時[とき]と巡[めぐ]り合[あ]わせが、彼[かれ]らすべてに臨[のぞ]むからである。"
  12: "人[ひと]は自分[じぶん]の時[とき]を知[し]らないからである。魚[さかな]が悪[わる]い網[あみ]で捕[と]らえられ、鳥[とり]が罠[わな]にかかるように、人[ひと]の子[こ]らも、悪[わる]い時[とき]が彼[かれ]らに突然[とつぜん]降[ふ]りかかるとき、それと同じように罠[わな]にかかる。"
  13: "また、わたしは日[ひ]の下[もと]で一[ひと]つの知恵[ちえ]を見[み]た。それはわたしには大[おお]きく思[おも]えた。"
  14: "小[ちい]さな町[まち]があり、そこに人[ひと]は少[すく]なかった。そこへ大[おお]きな王[おう]が来[き]て、それを取[と]り囲[かこ]み、それに対して大[おお]きな砦[とりで]を築[きず]いた。"
  15: "その中[なか]に、貧[まず]しい知恵[ちえ]ある男[おとこ]が一人[ひとり]見[み]つかった。彼[かれ]はその知恵[ちえ]によって町[まち]を救[すく]った。しかし、その貧[まず]しい男[おとこ]のことを思[おも]い起[おこ]す者[もの]は誰[だれ]もいなかった。"
  16: "そこでわたしは言[い]った。「知恵[ちえ]は力[ちから]にまさって善[よ]い。」しかし、貧[まず]しい者[もの]の知恵[ちえ]は軽[かろ]んじられ、その言葉[ことば]は聞[き]かれない。"
  17: "知恵[ちえ]ある者[もの]たちの言葉[ことば]は、静[しず]けのうちに語[かた]られて、愚[おろ]かさのうちで支配[しはい]する者[もの]たちの叫[さけ]びよりも、よく聞[き]かれる。"
  18: "知恵[ちえ]は戦[いくさ]の道具[どうぐ]にまさって善[よ]い。しかし、一人[ひとり]が罪[つみ]を犯[おか]すと、多[おお]くの善[よ]いものを失[うしな]う。"

notes:
  1: "Ὅτι σὺν πᾶν τοῦτο ἔδωκα εἰς καρδίαν μου — «ибо всё это я отдал в сердце моё». В слав. это предложение отнесено к концу 8:17, а 9:1 начинается с «праведнии и мудрии…»; скобок нет — разница деления стихов, а не добавление. ἀγάπην καί γε μῖσος οὐκ ἔστιν εἰδὼς ὁ ἄνθρωπος — «любви и ненависти не знает человек». τὰ πάντα πρὸ προσώπου αὐτῶν — «всё пред лицом их» (стих обрывается, продолжение в 9:2)."
  2: "ματαιότης ἐν τοῖς πᾶσιν — «суета во всём» (в слав. отнесено к 9:1). συνάντημα ἕν — «одна встреча, одна участь» (συνάντημα — «случай, встреча»; по всей главе передаётся 巡り合わせ). ὡς ὁ ἀγαθός, ὧς ὁ ἁμαρτάνων — «как добрый, так и согрешающий». ὀμνύων — «клянущийся»."
  3: "τοῦτο πονηρὸν ἐν παντὶ πεποιημένῳ — «это зло во всём делаемом». περιφέρεια ἐν καρδίᾳ αὐτῶν — «блуждание, заблуждение в сердце их» (слав. «прелесть»). καὶ ὀπίσω αὐτῶν πρὸς τοὺς νεκρούς — «и после них — к мёртвым»."
  4: "τίς ὃς κοινωνεῖ πρὸς πάντας τοὺς ζῶντας; — «кто имеет общение со всеми живыми?». ὁ κύων ὁ ζῶν... ἀγαθὸς ὑπὲρ τὸν λέοντα τὸν νεκρόν — «живой пёс лучше мёртвого льва»."
  5: "οἱ νεκροὶ οὔκ εἰσιν γινώσκοντες οὐδέν — «мёртвые ничего не знают». οὐκ ἔστιν αὐτοῖς ἔτι μισθός — «нет им уже мзды». ἐπελήσθη ἡ μνήμη αὐτῶν — «забыта память их». Не сглаживать: речь о состоянии мёртвых, как в Псалтири (ср. Пс 6:6)."
  6: "ἀγάπη, μῖσος, ζῆλος — «любовь, ненависть, ревность» (ζῆλος — «рвение, зависть»). μερὶς οὐκ ἔστιν αὐτοῖς ἔτι εἰς αἰῶνα — «нет им более части вовеки»."
  7: "Δεῦρο — «иди, ну». ἐν εὐφροσύνῃ... ἐν καρδίᾳ ἀγαθῇ — «в веселии… в добром сердце». ἤδη εὐδόκησεν ὁ θεὸς τὰ ποιήματά σου — «уже благоволил Бог к делам твоим»."
  8: "ἱμάτια λευκά — «одежды белые» (знак радости). ἔλαιον ἐπὶ κεφαλήν σου μὴ ὑστερησάτω — «елей на голове твоей да не оскудеет»."
  9: "ἰδὲ ζωήν — букв. «увидь жизнь», т.е. проводи жизнь, наслаждайся ею; передано 生きよ. μετὰ γυναικὸς ἧς ἠγάπησας — «с женой, которую возлюбил» (γυνή здесь — жена). ζωῆς ματαιότητός σου — «суетной жизни твоей» (LXX дважды ματαιότης). В слав. в первом месте «живота юности твоея» (νεότης), во втором «суетствия твоего»: это замена чтения, а не добавление Церкви, поэтому 〔…〕 не ставим, отличие отмечено здесь. μερίς σου — «доля твоя»."
  10: "πάντα ὅσα ἂν εὕρῃ ἡ χείρ σου — «всё, что найдёт рука твоя». ὡς ἡ δύναμίς σου — «по силе твоей». ἐν ᾅδῃ — 陰府 (ᾅδης), как по корпусу. οὐκ ἔστιν ποίημα καὶ λογισμὸς καὶ γνῶσις καὶ σοφία — «нет ни дела, ни помышления, ни знания, ни мудрости»."
  11: "Ἐπέστρεψα — «обратился». οὐ τοῖς κούφοις ὁ δρόμος — «не лёгким достаётся бег». οὐ τοῖς συνετοῖς πλοῦτος — «не разумным богатство». καιρὸς καὶ ἀπάντημα — «время и случай» (ἀπάντημα — «встреча», сродни συνάντημα)."
  12: "οὐκ ἔγνω ὁ ἄνθρωπος τὸν καιρὸν αὐτοῦ — «не знает человек времени своего». ἐν ἀμφιβλήστρῳ κακῷ — «в злой сети». εἰς καιρὸν πονηρόν — «в злое время». ἄφνω — «внезапно»."
  13: "μεγάλη ἐστὶν πρός με — «велика есть для меня», т.е. показалась мне важной."
  14: "πόλις μικρά — «город малый». χάρακας μεγάλους — «большие частоколы, осадные укрепления» (χάραξ — «кол, частокол»); передано 砦."
  15: "ἄνδρα πένητα σοφόν — «мужа бедного мудрого». διασώσει — «спасёт». ἄνθρωπος οὐκ ἐμνήσθη — «человек не вспомнил»."
  16: "Ἀγαθὴ σοφία ὑπὲρ δύναμιν — «хороша мудрость больше силы»; слова Екклесиаста в 「」. ἐξουδενωμένη — «уничижена». λόγοι αὐτοῦ οὔκ εἰσιν ἀκουόμενοι — «слова его не слушаются»."
  17: "ἐν ἀναπαύσει — «в покое», т.е. спокойно. κραυγὴ ἐξουσιαζόντων ἐν ἀφροσύναις — «крик властвующих в безумии»."
  18: "σκεύη πολέμου — «орудия войны». ἁμαρτάνων εἷς — «один согрешающий». ἀπολέσει ἀγαθωσύνην πολλήν — «погубит много благости» (ἀγαθωσύνη — «благость», редкое слово)."
