# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 9: одна участь всем (1–6), совет жить и трудиться (7–10),
# время и случай (11–12), притча о бедном мудреце (13–18).
# Красного и синего нет: это не речь Христа. Речь Екклесиаста — от первого лица, без кавычек;
# его прямая речь в 16 — в 「…」.
# 〔…〕 нет: все слова в gr-lxx-byz есть. В слав. 9:1 начинается с «праведнии и мудрии…»,
# а начало LXX 9:1 («всё это я отдал в сердце моё…») стоит в конце 8:17; в 9:9 слав. читает
# «юности твоея» (νεότης) вместо ματαιότης — это замена чтения, а не добавление Церкви,
# поэтому скобки не ставятся; отличия отмечены в notes.
# Сносок ⟨…⟩ нет: 陰府 уже в корпусе, остальные слова понятны.
