# jp-box, Послание к Римлянам, глава 2. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 2: суд Божий и лицемерие судящего (1–11), закон и совесть у язычников (12–16),
# иудей и закон (17–24), обрезание и сердце (25–29).
# Красного и синего нет. 〔…〕 в главе нет: 2:17 — замена (Ἴδε вместо Εἰ δέ),
# дана в церковной форме без скобок. Сносок ⟨…⟩ нет: 割礼 объяснено в Деян 7:8.

tr_code: jp-box
book: rim
chapter: 2
draft: true

verses:
  1: "それゆえ、人[ひと]を裁[さば]くすべての者[もの]よ、あなたに弁解[べんかい]の余地[よち]はない。あなたが他人[たにん]を裁[さば]くそのことをもって、あなたは自分[じぶん]自身[じしん]を罪[つみ]に定[さだ]めているからである。裁[さば]く者[もの]であるあなたも、同[おな]じことを行[おこな]っているからである。"
  2: "わたしたちは、このようなことを行[おこな]う者[もの]たちに対[たい]する神[かみ]の裁[さば]きが、真理[しんり]に従[したが]って下[くだ]されることを知[し]っている。"
  3: "このようなことを行[おこな]う者[もの]たちを裁[さば]きながら、自分[じぶん]も同[おな]じことを行[おこな]っている人[ひと]よ。あなたは、自分[じぶん]が神[かみ]の裁[さば]きを逃[のが]れられると思[おも]っているのか。"
  4: "それとも、神[かみ]の豊[ゆた]かな慈[いつく]しみ、寛容[かんよう]、忍耐[にんたい]を軽[かろ]んじているのか。神[かみ]の慈[いつく]しみがあなたを悔[く]い改[あらた]めへと導[みちび]いていることを知[し]らないのか。"
  5: "しかし、あなたは頑[かた]くなな心[こころ]と悔[く]い改[あらた]めない心[こころ]によって、自分[じぶん]のために怒[いか]りを蓄[たくわ]えている。それは、怒[いか]りの日[ひ]に、神[かみ]の正[ただ]しい裁[さば]きが現[あらわ]される日[ひ]に、その怒[いか]りが下[くだ]るためである。"
  6: "神[かみ]は、一人[ひとり]一人[ひとり]に行[おこな]いによって報[むく]いられる。"
  7: "すなわち、善[ぜん]い行[おこな]いを忍耐[にんたい]して続[つづ]け、栄光[えいこう]と誉[ほま]れと朽[く]ちないことを求[もと]める者[もの]には永遠[えいえん]の命[いのち]を、"
  8: "他方[たほう]、利己心[りこしん]から真理[しんり]に従[したが]わず、不義[ふぎ]に従[したが]う者[もの]には、怒[いか]りと激[はげ]しい怒[いか]りを、"
  9: "悪[あく]を行[おこな]うすべての人[ひと]の魂[たましい]には、まずユダヤ人[じん]、次[つぎ]にギリシア人[じん]に、苦難[くなん]と苦悩[くのう]がある。"
  10: "善[ぜん]を行[おこな]うすべての人[ひと]には、まずユダヤ人[じん]、次[つぎ]にギリシア人[じん]に、栄光[えいこう]と誉[ほま]れと平和[へいわ]がある。"
  11: "神[かみ]には偏[かたよ]り見[み]がないからである。"
  12: "なぜなら、律法[りっぽう]なしに罪[つみ]を犯[おか]した者[もの]はみな、律法[りっぽう]なしに滅[ほろ]び、律法[りっぽう]のもとで罪[つみ]を犯[おか]した者[もの]はみな、律法[りっぽう]によって裁[さば]かれるからである。"
  13: "なぜなら、神[かみ]の前[まえ]で義[ぎ]とされるのは、律法[りっぽう]を聞[き]く者[もの]ではなく、律法[りっぽう]を行[おこな]う者[もの]だからである。"
  14: "なぜなら、律法[りっぽう]を持[も]たない異邦人[いほうじん]が、生[う]まれつき律法[りっぽう]のことを行[おこな]うとき、彼[かれ]らは律法[りっぽう]を持[も]たないながら、自分[じぶん]自身[じしん]が自分[じぶん]の律法[りっぽう]なのである。"
  15: "彼[かれ]らは、律法[りっぽう]の行[おこな]いが自分[じぶん]の心[こころ]に書[か]き記[しる]されていることを示[しめ]している。良心[りょうしん]もこれに共[とも]に証[しょう]し、彼[かれ]らの思[おも]いが互[たが]いに責[せ]めたり弁明[べんめい]したりしているのである。"
  16: "それは、神[かみ]が、わたしの福音[ふくいん]のとおりに、イエス・キリストによって人[ひと]の隠[かく]されたことを裁[さば]かれる日[ひ]のことである。"
  17: "見[み]よ、あなたはユダヤ人[じん]と名乗[なの]り、律法[りっぽう]に安[やす]んじ、神[かみ]を誇[ほこ]り、"
  18: "その御心[みこころ]を知[し]り、律法[りっぽう]から教[おし]えられてより優[すぐ]れたものをわきまえ、"
  19: "自分[じぶん]は盲人[もうじん]の案内者[あんないしゃ]、暗[くら]やみの中[なか]にいる者[もの]の光[ひかり]であり、"
  20: "愚[おろ]かな者[もの]の導[みちび]き手[て]、幼[おさな]い者[もの]の教師[きょうし]であって、律法[りっぽう]の中[なか]に知識[ちしき]と真理[しんり]の形[かたち]を持[も]っていると確信[かくしん]しているのに、"
  21: "では、他人[たにん]を教[おし]えながら、自分[じぶん]自身[じしん]を教[おし]えないのか。盗[ぬす]むなと宣[の]べ伝[つた]えながら、自分[じぶん]は盗[ぬす]むのか。"
  22: "姦淫[かんいん]するなと言[い]いながら、自分[じぶん]は姦淫[かんいん]するのか。偶像[ぐうぞう]を憎[にく]みながら、自分[じぶん]は神殿[しんでん]を荒[あ]らすのか。"
  23: "律法[りっぽう]を誇[ほこ]りながら、律法[りっぽう]を犯[おか]すことによって神[かみ]を侮[あなど]るのか。"
  24: "なぜなら、「神[かみ]の名[な]は、あなたがたのゆえに、異邦人[いほうじん]の間[あいだ]で冒涜[ぼうとく]されている」と書[か]かれているからである。"
  25: "なぜなら、割礼[かつれい]は、あなたが律法[りっぽう]を行[おこな]うならば確[たし]かに役[やく]に立[た]つからである。しかし、あなたが律法[りっぽう]の違反者[いはんしゃ]であるなら、あなたの割礼[かつれい]は無割礼[むかつれい]となってしまったのである。"
  26: "そこで、無割礼[むかつれい]の者[もの]が律法[りっぽう]の定[さだ]めを守[まも]るなら、その無割礼[むかつれい]は割礼[かつれい]と見[み]なされないだろうか。"
  27: "そして、生[う]まれつき無割礼[むかつれい]でありながら律法[りっぽう]を全[まっと]うする者[もの]は、文字[もじ]と割礼[かつれい]を持[も]ちながら律法[りっぽう]の違反者[いはんしゃ]であるあなたを裁[さば]くであろう。"
  28: "なぜなら、外見上[がいけんじょう]のユダヤ人[じん]がユダヤ人[じん]なのではなく、肉[にく]に現[あらわ]れた外見上[がいけんじょう]の割礼[かつれい]が割礼[かつれい]なのではないからである。"
  29: "そうではなく、内[うち]なる者[もの]がユダヤ人[じん]であり、割礼[かつれい]とは、文字[もじ]ではなく霊[れい]による心[こころ]の割礼[かつれい]である。その誉[ほま]れは人[ひと]からではなく、神[かみ]から来[く]る。"

notes:
  1: "ἀναπολόγητος — 弁解の余地がない (ср. 1:20). Оба γάρ переданы явно: からである … からである."
  2: "κρίμα — 裁き (не κρίσις). κατὰ ἀλήθειαν — 真理に従って."
  5: "δικαιοκρισία — «праведный суд»; 正しい裁き."
  7: "καθ᾿ ὑπομονὴν ἔργου ἀγαθοῦ — «в терпении доброго дела»; 善い行いを忍耐して続け."
  8: "ἐριθεία — «своекорыстие, распря» (у jp-joc「爭鬪」); 利己心. θυμός — 激しい怒り, отличается от ὀργή."
  11: "προσωπολημψία — «лицеприятие»; 偏り見."
  12: "ἀνόμως — «без закона», не «беззаконно» в смысле порока; 律法なしに."
  14: "φύσει — «по природе»; 生まれつき."
  15: "γραπτόν — «написанный»; 書き記されている. συνείδησις — 良心."
  17: "В критической базе Εἰ δὲ σύ; церковный текст (Елизаветинская «Вот, ты», jp-joc「視よ」) читает Ἴδε — 見よ. Это замена, а не добавление, поэтому без 〔〕 (ср. Деян 6:8)."
  19: "ὁδηγός — 案内者."
  20: "μόρφωσις — «образ, форма»; 形. Стихи 17–20 — одна условная конструкция; вопросы начинаются в 21, как в греч."
  22: "ἱεροσυλεῖς — «обкрадываешь храм»; 神殿を荒らす."
  24: "Цитата Ис 52:5."
  25: "περιτομή — 割礼, ἀκροβυστία — 無割礼. В корпусе 割礼 уже объяснено сноской (Деян 7:8, первое упоминание), поэтому здесь без ⟨⟩."
  26: "λογισθήσεται — «будет вменено»; 見なされる."
  27: "γράμμα — «буква»; 文字. τελοῦσα — «исполняющая»; 全うする."
  29: "ἐν πνεύματι οὐ γράμματι — 霊によって、文字ではなく. ἐν τῷ κρυπτῷ — 内なる者."
