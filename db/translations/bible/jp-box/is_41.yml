verses:
  1: "「島々[しまじま]よ、わたしのもとで新[あら]たになれ。支配者[しはいしゃ]たちは力[ちから]を新[あら]たにするからである。彼らは近[ちか]づき、ともに語[かた]れ。そのとき、裁[さば]きを告[つ]げ知[し]らせよ。"
  2: "だれが東[ひがし]から義[ぎ]を起[お]こし、これをご自分[じぶん]の足[あし]もとに呼[よ]び寄[よ]せたのか。これは進[すす]んで行[い]く。神[かみ]はこれを諸国[しょこく]の民[たみ]の前[まえ]に与[あた]え、王[おう]たちを恐[おそ]れさせ、彼らの剣[つるぎ]を地[ち]に投[な]げ、彼らの弓[ゆみ]を吹[ふ]き捨[す]てられた枯[か]れ枝[えだ]のようにされる。"
  3: "彼は彼らを追[お]い、その足[あし]の道[みち]は平和[へいわ]のうちを通[とお]る。"
  4: "だれがこれを働[はたら]かせ、成[な]し遂[と]げたのか。初[はじ]めから代々[だいだい]にわたってこれを呼[よ]び寄[よ]せる方[かた]が、これを呼[よ]んだのだ。わたしは初[はじ]めの神[かみ]であり、来[きた]るべきものの中[なか]にあっても、わたしがいる。」"
  5: "諸国[しょこく]の民[たみ]は見[み]て恐[おそ]れた。地[ち]の果[は]ては近[ちか]づいて、ともに来[き]た。"
  6: "それぞれが隣人[りんじん]を助[たす]けようと決[き]め、兄弟[きょうだい]に「強[つよ]くあれ」と言[い]う。"
  7: "職人[しょくにん]は力[ちから]を出[だ]し、鎚[つち]を打[う]つ鍛冶[かじ]もともに励[はげ]む。ときには「継[つ]ぎ目[め]は良[よ]い」と言[い]い、それを釘[くぎ]で固[かた]くし、置[お]いても動[うご]かないようにする。"
  8: "「しかし、あなたは、イスラエル、わたしのしもべヤコブ、わたしが選[えら]んだ者[もの]、わたしが愛[あい]したアブラハムの種[たね]である。"
  9: "わたしはあなたを地[ち]の果[は]てから取[と]り、その見張[みは]り場[ば]から呼[よ]んで、『あなたはわたしのしもべだ。わたしはあなたを選[えら]び、見捨[みす]てなかった』と言[い]った。"
  10: "恐[おそ]れるな。わたしはあなたとともにいる。わたしは惑[まど]わさない。わたしはあなたの神[かみ]、あなたを強[つよ]くした者[もの]である。わたしはあなたを助[たす]け、わたしの正[ただ]しい右[みぎ]の手[て]であなたを固[かた]くした。"
  11: "見[み]よ、あなたに敵[てき]する者[もの]は、みな恥[は]じ、辱[はずかし]められる。彼らは無[な]きに等[ひと]しく、あなたと争[あらそ]う者[もの]は、みな滅[ほろ]びる。"
  12: "あなたが彼らを探[さが]しても、あなたを嘲[あざけ]る人[ひと]たちを見[み]つけることはない。彼らは無[な]きに等しく、あなたと戦[たたか]う者[もの]はいなくなる。"
  13: "わたしこそ主[しゅ]、あなたの神[かみ]であり、あなたの右[みぎ]の手[て]を握[にぎ]って、『恐[おそ]れるな』と言[い]う者[もの]であるからである。"
  14: "ヤコブよ、数[かず]の少[すく]ないイスラエルよ、わたしはあなたを助[たす]けた、とあなたの神[かみ]、あなたを贖[あがな]う方[かた]、イスラエルの聖[せい]なる方[かた]は言[い]われる。"
  15: "見[み]よ、わたしはあなたを、新[あたら]しく、のこぎりの歯[は]のある脱穀[だっこく]の車輪[しゃりん]とした。あなたは山[やま]を脱穀して細[こま]かくし、丘[おか]を粉[こな]のようにする。"
  16: "あなたはそれをふるい分[わ]け、風[かぜ]がそれを奪[うば]い、つむじ風[かぜ]がそれを吹[ふ]き散[ち]らす。あなたはイスラエルの聖[せい]なる方[かた]によって喜[よろこ]ぶ。"
  17: "貧[まず]しい者[もの]たちと乏[とぼ]しい者[もの]たちは喜[よろこ]び躍[おど]る。彼らは水[みず]を求[もと]めるが、水がない。その舌[した]は渇[かわ]きで干[ひ]からびた。わたしは主[しゅ]である神[かみ]、わたしが彼らに答[こた]える。イスラエルの神[かみ]であるわたしは、彼らを見捨[みす]てない。"
  18: "わたしは山[やま]の上[うえ]に川[かわ]を開[ひら]き、野[の]の真[ま]ん中[なか]に泉[いずみ]を開く。わたしは荒野[こうや]を沼地[ぬまち]に、乾[かわ]いた地[ち]を水路[すいろ]にする。"
  19: "わたしは水[みず]のない地[ち]に杉[すぎ]、黄楊[つげ]、ミルトス、糸杉[いとすぎ]、白楊[はくよう]を置[お]く。"
  20: "彼らは見[み]、知[し]り、考[かんが]え、ともに悟[さと]るためである。主[しゅ]の手[て]がこれをすべて造[つく]り、イスラエルの聖[せい]なる方[かた]がこれを示[しめ]したことを。」"
  21: "「あなたがたの裁[さば]きは近[ちか]い、と主[しゅ]である神[かみ]は言[い]われる。あなたがたの計[はかり]ごとは近[ちか]づいた、とヤコブの王[おう]は言[い]われる。"
  22: "彼らは近[ちか]づき、起[お]こるべきことをあなたがたに告[つ]げるがよい。初[はじ]めのことが何[なに]であったか、語[かた]れ。そうすれば、わたしたちは心[こころ]を向[む]け、終[お]わりのことが何[なに]かを知[し]ろう。来[きた]るべきことを、わたしたちに告[つ]げよ。"
  23: "終[お]わりに来[く]るべきことを告[つ]げよ。そうすれば、あなたがたが神[かみ]々[がみ]であることがわかる。善[よ]いことをせよ、悪[わる]いことをせよ。わたしたちは驚[おどろ]き、ともに見[み]よう。"
  24: "あなたがたはどこから来[き]たのか。あなたがたのわざはどこから来たのか。地[ち]からである。忌[いま]わしいものがあなたがたを選[えら]んだのだ。"
  25: "わたしは北[きた]から、日[ひ]の昇[のぼ]る所[ところ]から来[く]る者[もの]を起[お]こした。彼はわたしの名[な]によって呼[よ]ばれる。支配者[しはいしゃ]たちは来[く]るがよい。あなたがたは、陶工[とうこう]の粘土[ねんど]のように、粘土を踏[ふ]む陶工のように踏[ふ]みにじられる。"
  26: "初[はじ]めからあったことをだれが告[つ]げて、わたしたちが知[し]ることができようか。前[まえ]もって告[つ]げて、『真実[しんじつ]だ』と言[い]える者[もの]がいるか。そのようなことを告[つ]げる者[もの]はなく、聞[き]く者[もの]もない。"
  27: "わたしはシオンに初[はじ]めを与[あた]え、エルサレムには、わたしが道[みち]の慰[なぐさ]めを与える。"
  28: "見[み]よ、諸国[しょこく]の民[たみ]のうちには、だれもいない。その偶像[ぐうぞう]たちの中[なか]にも、告[つ]げる者[もの]はなかった。わたしが彼らに『あなたがたはどこから来[き]たのか』と尋[たず]ねても、彼らは答[こた]えない。"
  29: "彼らはあなたがたを造[つく]る者[もの]たちであり、あなたがたを空[むな]しく惑[まど]わす者[もの]たちである。」"

notes:
  1: "Ἐγκαινίζεσθε πρός με, νῆσοι — «обновляйтесь ко Мне, острова»: ἐγκαινίζω — «обновлять, освящать заново»; слав. «обновляйтеся ко мне»; в МТ и ru «умолкните предо Мною» — иное чтение, не внесено. οἱ ἄρχοντες ἀλλάξουσιν ἰσχύν — «князи изменят крепость», т. е. обновят силы: тот же оборот в 40:31, где передан 力を新たにする. ἐγγισάτωσαν καὶ λαλησάτωσαν ἅμα — «да приблизятся и да глаголют вкупе»; τότε κρίσιν ἀναγγειλάτωσαν — «тогда суд да возвещают». Начало судебной речи Господа: она открывается здесь и идёт до 41:4."
  2: "ἐξήγειρεν ἀπὸ ἀνατολῶν δικαιοσύνην — «воздвиг от восток правду»: δικαιοσύνη здесь о «правде-победительнице», которую Господь поднимает с востока; слав. «правду». ἐκάλεσεν αὐτὴν κατὰ πόδας αὐτοῦ — «призвал её в след ног своих» (κατὰ πόδας — «по стопам, следом»); в ru «призвал его следовать за собою» — по МТ. δώσει ἐναντίον ἐθνῶν — «даст пред языки»: подлежащее — Бог (так в слав. и ru), поэтому в тексте 神は. φρύγανα ἐξωσμένα — «стеблие отвержено», сухие стебли; в 40:24 то же слово передано 枯れ枝."
  3: "διώξεται αὐτούς — «поженет их»; ἡ ὁδὸς τῶν ποδῶν αὐτοῦ — «путь ног его»: номинатив, вынесенный в конец (висячая конструкция), отсюда отдельное предложение о пути. В ru по МТ добавлено «по которой никогда не ходил ногами своими» — в LXX и слав. этого нет."
  4: "τίς ἐνήργησεν καὶ ἐποίησεν ταῦτα — «кто содела и сотвори сия»; ὁ καλῶν αὐτὴν ἀπὸ γενεῶν ἀρχῆς — «призывающий её от начала родов». ἐγὼ θεὸς πρῶτος, καὶ εἰς τὰ ἐπερχόμενα ἐγώ εἰμι — «Аз Бог первый, и в грядущая Аз есмь»: ни «Господь», ни «последний» в LXX и слав. нет; в МТ и ru «Я — Господь первый, и в последних — Я тот же» (ср. Откр 1:17; 2:8; 22:13). Держим греческий; здесь закрывается речь 41:1–4."
  5: "εἴδοσαν ἔθνη — «видеша языцы»; в ru «увидели острова» — по МТ. τὰ ἄκρα τῆς γῆς ἤγγισαν καὶ ἤλθοσαν ἅμα — «концы земнии приближишася и приидоша вкупе». С 41:5 Господня речь прерывается авторским описанием до 41:8."
  6: "κρίνων ἕκαστος τῷ πλησίον καὶ τῷ ἀδελφῷ βοηθῆσαι — «судяй кийждо ближнему и брату помощи», т. е. каждый решает помочь соседу (κρίνω здесь «решать, определять»). καὶ ἐρεῖ — «и речет»; слова, сказанные брату, — в 「…」: 強くあれ."
  7: "Ἴσχυσεν ἀνὴρ τέκτων καὶ χαλκεύς — «превозможе муж древоделатель и ковачь»: τέκτων — плотник, χαλκεύς — кузнец; слав. «превозможе», т. е. собрались с силами, ободрились. σφύρῃ ἅμα ἐλαύνων — «бияй млатом, вкупе проковаяй». Σύμβλημα καλόν ἐστιν — «спаяние добро есть», «склейка хороша». ἰσχύρωσαν αὐτὰ ἐν ἥλοις — «утвердиша я гвоздьми»; θήσουσιν αὐτὰ καὶ οὐ κινηθήσονται — «положат я, и не подвигнутся»."
  8: "Σὺ δέ, Ισραηλ, παῖς μου Ιακωβ — «Ты же, Израилю, рабе Мой, Иакове»: цепь номинативов-обращений, в японском переданная рамкой は…である. ὃν ἐξελεξάμην — «егоже избрах»; σπέρμα Αβρααμ, ὃν ἠγάπησα — «семя Авраамле, егоже возлюбих» (в ru «друг Моего» — по МТ). Здесь снова открывается речь Господа (до 41:20)."
  9: "οὗ ἀντελαβόμην ἀπ᾽ ἄκρων τῆς γῆς — «егоже поях от конец земли» (ἀντιλαμβάνομαι — «брать, поддерживать»); ἐκ τῶν σκοπιῶν αὐτῆς — «от стражб ея»: σκοπιά — сторожевой пост, вершина (見張り場). εἶπά σοι Παῖς μου εἶ — «рекох ти: раб Мой еси»: слова Господа, сказанные Израилю, внутри речи — в 『…』. οὐκ ἐγκατέλιπόν σε — «не оставих тебе»."
  10: "μὴ φοβοῦ, μετὰ σοῦ γάρ εἰμι — «не бойся, с тобою бо есмь». μὴ πλανῶ — двусмысленно: «не заблуждай» (императив) или «не обольщаю» (1-е лицо); слав. «не прельщаю» (1-е лицо), ru «не смущайся» (императив); держим слав. ὁ ἐνισχύσας σε — «укрепивый тя» (аорист, отсюда прошедшее). ἠσφαλισάμην σε τῇ δεξιᾷ τῇ δικαίᾳ μου — «утвердих тя десницею моею праведною» (ἀσφαλίζω — «утверждать, укреплять»)."
  11: "ἰδοὺ αἰσχυνθήσονται καὶ ἐντραπήσονται — «се, постыдятся и посрамятся» (αἰσχύνομαι — «стыдиться», ἐντρέπομαι — «быть пристыженным»); ἔσονται ὡς οὐκ ὄντες — «будут бо яко не сущии». ἀντίδικοι — «соперницы», противники в тяжбе."
  12: "ζητήσεις αὐτοὺς καὶ οὐ μὴ εὕρῃς — «взыщеши их, и не обрящеши»; οἳ παροινήσουσιν εἰς σέ — «иже поругаются тебе»: παροινέω — «буйствовать, издеваться». ἀντιπολεμοῦντές σε — «ратующии тебе» (ἀντιπολεμέω — «воевать против»)."
  13: "ὁ κρατῶν τῆς δεξιᾶς σου — «держай десницу твою»; ὁ λέγων σοι Μὴ φοβοῦ — «глаголяй тебе: не бойся»: слова Господа внутри его же речи — в 『…』. В слав. «не бойся» перенесено в начало 41:14; держим деление gr, потому что в 41:14 нет «не бойся»."
  14: "ὀλιγοστὸς Ισραηλ — «малый Израилю», т. е. малочисленный (ὀλιγοστός); в ru «червь Иаков» — по МТ. ἐγὼ ἐβοήθησά σοι, λέγει ὁ θεός — «Аз помогох ти, глаголет Бог»; слав. добавляет «твой» (Бог твой) и «святый израилев» — в LXX этих слов нет, по паритету внесены в текст без скобок (あなたの神、イスラエルの聖なる方). ὁ λυτρούμενός σε — «избавляяй тя» (λυτρόω — «выкупать, искупать»)."
  15: "τροχοὺς ἁμάξης ἀλοῶντας καινοὺς πριστηροειδεῖς — «колеса колесничная новая, стирающая аки пила»: πριστήριον — пила, πριστηροειδής — «пиловидный», т. е. зубчатое молотильное колесо (脱穀の車輪). ἀλοήσεις ὄρη — «сотреши горы» (ἀλοάω — «молотить»); λεπτυνεῖς βουνούς — «истончиши холмы»; ὡς χνοῦν θήσεις — «аки прах положиши» (χνοῦς — пыль, мякина)."
  16: "λικμήσεις — «извееши» (λικμάω — «веять»); ἄνεμος λήμψεται αὐτούς — «ветр возмет я»; καταιγὶς διασπερεῖ — «буря развеет» (καταιγίς — つむじ風, как в 40:24). εὐφρανθήσῃ ἐν τοῖς ἁγίοις Ισραηλ — «возвеселишися во святых израилевых». καὶ ἀγαλλιάσονται — «и возрадуются»: в gr этот глагол стоит в конце 41:16, а его подлежащее (οἱ πτωχοί) — в начале 41:17; слав. переносит «и возрадуются» в 41:17. Держим деление слав., иначе стих обрывается на глаголе без подлежащего."
  17: "οἱ πτωχοὶ καὶ οἱ ἐνδεεῖς — «убозии и неимущии»: подлежащее, вынесенное из конца 41:16 (см. выше; по-гречески стих начинается с него). ζητήσουσιν γὰρ ὕδωρ, καὶ οὐκ ἔσται — «поищут бо воды, и не будет»; ἡ γλῶσσα αὐτῶν ἀπὸ τῆς δίψης ἐξηράνθη — «язык их от жажди изсше». ἐγὼ ἐπακούσομαι — «Аз услышу»; οὐκ ἐγκαταλείψω αὐτούς — «не оставлю их»."
  18: "ἀνοίξω ἐπὶ τῶν ὀρέων ποταμούς — «отверзу на горах реки»; ἐν μέσῳ πεδίων πηγάς — «среди поля источники» (πεδίον — равнина, поле); τὴν ἔρημον εἰς ἕλη — «пустыню в луги водныя»: ἕλος — болото, заливной луг (передано 沼地); τὴν διψῶσαν γῆν ἐν ὑδραγωγοῖς — «жаждущую землю в водотечы» (ὑδραγωγός — водоток, канал; 水路)."
  19: "κέδρος — кедр (杉), πύξος — самшит (黄楊), μυρσίνη — мирт (ミルトス), κυπάρισσος — кипарис (糸杉), λεύκη — тополь, белый тополь (白楊). Порядок деревьев сохранён; в ru по МТ иной набор (ситтим, маслина, явор, бук) — не внесён. Слав. «смерчие» — вероятно, самшит (πύξος)."
  20: "ἵνα ἴδωσιν καὶ γνῶσιν καὶ ἐννοηθῶσιν καὶ ἐπιστῶνται ἅμα — «да узрят и уразумеют, и помыслят и уведят вкупе»: четыре глагола знания не сглажены. χεὶρ κυρίου ἐποίησεν ταῦτα πάντα — «рука Господня сотвори сия вся»; ὁ ἅγιος τοῦ Ισραηλ κατέδειξεν — «святый израилев показа». Здесь закрывается речь 41:8–20."
  21: "Ἐγγίζει ἡ κρίσις ὑμῶν — «приближается суд ваш»; ἤγγισαν αἱ βουλαὶ ὑμῶν — «приближишася совети ваши» (βουλή — совет, замысел; 計らい). Двойная формула «говорит Господь Бог» / «говорит Царь Иакова» — вне кавычек. Начало прений с идолами и народами (41:21–29)."
  22: "ἐγγισάτωσαν καὶ ἀναγγειλάτωσαν ὑμῖν ἃ συμβήσεται — «да приближатся и возвестят вам, яже сбудутся»; ἢ τὰ πρότερα τίνα ἦν εἴπατε — «или яже прежде быша, рцыте»; ἐπιστήσομεν τὸν νοῦν — «приставим ум», т. е. обратим внимание (心を向ける); τὰ ἔσχατα — «последняя»."
  23: "ἀναγγείλατε ἡμῖν τὰ ἐπερχόμενα ἐπ᾽ ἐσχάτου — «возвестите нам грядущая на последок»; γνωσόμεθα ὅτι θεοί ἐστε — «увемы, яко бози есте»; εὖ ποιήσατε καὶ κακώσατε — «благо сотворите и зло сотворите»: ирония, докажите божественность хоть чем-нибудь; θαυμασόμεθα καὶ ὀψόμεθα ἅμα — «почудимся и узрим вкупе»."
  24: "πόθεν ἐστὲ ὑμεῖς καὶ πόθεν ἡ ἐργασία ὑμῶν; ἐκ γῆς — «откуду есте вы, и откуду дело ваше? от земли»; βδέλυγμα ἐξελέξαντο ὑμᾶς — «мерзость избраша вас» (βδέλυγμα — мерзость, гнусность). В ru по МТ «вы ничто, и дело ваше ничтожно» — иное чтение."
  25: "ἤγειρα τὸν ἀπὸ βορρᾶ καὶ τὸν ἀφ᾽ ἡλίου ἀνατολῶν — «возставих, иже от севера и иже от восток солнечных», т. е. Кира (ср. 44:28; 45:1). κληθήσονται τῷ ὀνόματί μου — «прозовутся именем моим» (гр. мн. ч. при одном лице, в тексте 彼); ἐρχέσθωσαν ἄρχοντες — «да приидут князи»; ὡς πηλὸς κεραμέως… οὕτως καταπατηθήσεσθε — «яко брение скудельника… тако попрани будете» (πηλός — глина, брение; 粘土). Замечание: во второй половине стиха — обращение во 2-м лице мн. ч. (καταπατηθήσεσθε)."
  26: "τίς γὰρ ἀναγγελεῖ τὰ ἐξ ἀρχῆς, ἵνα γνῶμεν — «кто бо возвестит, яже исперва, да увемы»; τὰ ἔμπροσθεν — «яже напреди»; ἐροῦμεν ὅτι ἀληθῆ ἐστιν — «речем, яко истинна суть»; οὐκ ἔστιν ὁ προλέγων οὐδὲ ὁ ἀκούων ὑμῶν τοὺς λόγους — «несть предглаголющаго, ни слышащаго словес ваших». Слова «истинно» — в 『…』."
  27: "ἀρχὴν Σιων δώσω — «начало сиону дам», т. е. первое слово, начало благовестия Сиону; Ιερουσαλημ παρακαλέσω εἰς ὁδόν — «Иерусалима утешу на пути» (παρακαλέω — утешать, ободрять). В ru по МТ «дал Иерусалиму благовестника» — иное чтение, не внесено."
  28: "ἀπὸ γὰρ τῶν ἐθνῶν ἰδοὺ οὐδείς — «от язык бо, се, ни един»; ἀπὸ τῶν εἰδώλων αὐτῶν οὐκ ἦν ὁ ἀναγγέλλων — «от кумир их несть возвещаяй» (εἴδωλον — 偶像). ἐὰν ἐρωτήσω αὐτούς Πόθεν ἐστέ — «аще вопрошу их: откуду есте?»: вопрос Господа идолам внутри речи — в 『…』; οὐ μὴ ἀποκριθῶσίν μοι — «не отвещают ми»."
  29: "εἰσὶν γὰρ οἱ ποιοῦντες ὑμᾶς — «суть бо творящии вас», т. е. мастера, делающие идолов; μάτην οἱ πλανῶντες ὑμᾶς — «всуе прельщающии вас» (πλανάω — вводить в заблуждение). В ru по МТ «все они ничто… ветер и пустота истуканы их» — иное чтение, не внесено. Здесь закрывается речь 41:21–29."
