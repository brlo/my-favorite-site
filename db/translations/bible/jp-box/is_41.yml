# jp-box, Исаия, глава 41. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для гл. 41 есть фрагментами (40–43), но выгрузки
# по этой главе не делалось, в работе он не использовался; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 41: 1–4 прения — кто воздвиг от востока правду, «кто соделал это», «Я — Бог
# первый»; 5–7 народы в страхе, ремесленники укрепляют идола; 8–16 «Израиль, раб Мой»:
# не бойся, Я с тобою, ты — молотильное колесо; 17–20 вода в пустыне и деревья, чтобы
# познали руку Господню; 21–29 суд с идолами: пусть возвестят грядущее — они ничто.
# Речи: слова Господа — 「…」 (1–4; 8–20; 21–29). 5–7 — авторское описание, внутри него
# реплики ремесленников (6; 7) — тоже 「…». Внутри речи Господа чужие и собственные его
# слова — 『…』 (9; 13; 26; 28). Вводные формулы («говорит Господь Бог», «говорит Царь
# Иакова», «говорит Бог, избавляющий тебя») — вне кавычек.
# Нумерация по gr: 29 стихов; у csl и ru тоже 29. Внутри главы слав. делит иначе:
#   • 41:16/17 — gr кончает 16 глаголом καὶ ἀγαλλιάσονται, а подлежащее (οἱ πτωχοί)
#     стоит в начале 17; слав. переносит «и возрадуются» в начало 17 («И возрадуются
#     убозии»). Держим деление слав., иначе 17-й стих обрывается на подлежащем (notes 16–17).
#   • 41:13/14 — «не бойся» (в gr конец 13) слав. переносит в начало 14; держим gr,
#     потому что обе части самостоятельны (notes 13–14).
# Паритет: слав. добавления внесены в основной текст без 〔…〕 — 41:14 «Бог твой» и
# «святый израилев» (в LXX этих слов нет). 41:4 «Я — Бог первый» — по LXX и слав.;
# в МТ и ru «Я — Господь первый, и в последних — Я тот же» (notes).
# 〔…〕 нет; сносок ⟨…⟩ нет: 島々, 陶工, 粘土, 杉, 糸杉, 白楊, 荒野, 脱穀 уже в корпусе
# или пояснены в notes.
# Имена — транслитерация греческого (LXX): シオン, エルサレム, ヤコブ, イスラエル, アブラハム.

