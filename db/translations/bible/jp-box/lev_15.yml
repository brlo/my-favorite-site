tr_code: jp-box
book: lev
chapter: 15
draft: true

verses:
  1: "主[しゅ]はモーセとアロンに言[い]われた。"
  2: "「イスラエルの子[こ]らに語[かた]って言[い]いなさい。男[おとこ]はだれでも、その体[からだ]から流出[りゅうしゅつ]があれば、その流出は汚[けが]れである。"
  3: "これがその汚[けが]れについての定[さだ]めである。彼[かれ]が体[からだ]から精[せい]を流[なが]すとき、その流出[りゅうしゅつ]によって体が弱[よわ]っている間[あいだ]、これが彼の汚れである。彼の体の流出の日[ひ]はすべて、その流出によって体が弱っている間、彼の汚れである。"
  4: "流出[りゅうしゅつ]のある者[もの]が横[よこ]たわる寝床[ねどこ]はすべて汚[けが]れ、その者がその上[うえ]に座[すわ]る物[もの]もすべて汚れる。"
  5: "その寝床[ねどこ]に触[ふ]れた者[もの]は、衣服[いふく]を洗[あら]い、水[みず]で体[からだ]を洗わなければならない。その者は夕[ゆう]べまで汚[けが]れている。"
  6: "流出[りゅうしゅつ]のある者[もの]が座[すわ]った物[もの]に座った者も、衣服[いふく]を洗[あら]い、水[みず]で体[からだ]を洗わなければならない。その者は夕[ゆう]べまで汚[けが]れている。"
  7: "流出[りゅうしゅつ]のある者[もの]の肌[はだ]に触[ふ]れた者も、衣服[いふく]を洗[あら]い、水[みず]で体[からだ]を洗わなければならない。その者は夕[ゆう]べまで汚[けが]れている。"
  8: "もし流出[りゅうしゅつ]のある者[もの]が清[きよ]い者につばを吐[は]きかけたなら、その者は衣服[いふく]を洗[あら]い、水[みず]で体[からだ]を洗わなければならない。その者は夕[ゆう]べまで汚[けが]れている。"
  9: "流出[りゅうしゅつ]のある者[もの]が乗[の]ったろばの鞍[くら]は、すべて夕[ゆう]べまで汚[けが]れる。"
  10: "彼[かれ]の下[した]にあるものに触[ふ]れた者[もの]はだれでも、夕[ゆう]べまで汚[けが]れる。それらを持[も]ち運[はこ]ぶ者は、衣服[いふく]を洗[あら]い、水[みず]で体[からだ]を洗わなければならない。その者は夕べまで汚れている。"
  11: "流出[りゅうしゅつ]のある者[もの]が手[て]を洗[あら]わずに人[ひと]に触[ふ]れたなら、触れられた者は衣服[いふく]を洗い、水[みず]で体[からだ]を洗わなければならない。その者は夕[ゆう]べまで汚[けが]れている。"
  12: "流出[りゅうしゅつ]のある者[もの]が触[ふ]れた土[つち]の器[うつわ]は壊[こわ]さなければならない。木[き]の器は水[みず]で洗[あら]えば、清[きよ]くなる。"
  13: "流出[りゅうしゅつ]のある者[もの]がその流出から清[きよ]められたなら、清めのために七日[なぬか]を数[かぞ]え、衣服[いふく]を洗[あら]い、体[からだ]を〔生[い]ける〕水[みず]で洗わなければならない。そうすれば清くなる。"
  14: "八日目[ようかめ]に、彼[かれ]は自分[じぶん]のために山鳩[やまばと]二羽[にはわ]、または家鳩[いえばと]のひな二羽を取[と]り、主[しゅ]の前[まえ]、証[あかし]の幕屋[まくや]の入口[いりぐち]に持[も]って来[き]て、祭司[さいし]に渡[わた]さなければならない。"
  15: "祭司[さいし]はその一羽[いちわ]を贖罪祭[しょくざいさい]として、もう一羽を燔祭[はんさい]として献[ささ]げる。祭司は主[しゅ]の前[まえ]で、彼[かれ]の流出[りゅうしゅつ]について彼のために贖[あがな]いをする。"
  16: "男[おとこ]から精[せい]の流出[りゅうしゅつ]があったなら、その者[もの]は水[みず]で全身[ぜんしん]を洗[あら]わなければならない。その者は夕[ゆう]べまで汚[けが]れている。"
  17: "精[せい]の流出[りゅうしゅつ]が付[つ]いた衣服[いふく]はすべて、また皮[かわ]もすべて、水[みず]で洗[あら]わなければならない。それは夕[ゆう]べまで汚[けが]れている。"
  18: "女[おんな]が男[おとこ]と寝[ね]て精[せい]の流出[りゅうしゅつ]があったなら、二人[ふたり]は水[みず]で洗[あら]わなければならない。二人は夕[ゆう]べまで汚[けが]れている。"
  19: "女[おんな]が血[ち]を流[なが]しているなら、その流出[りゅうしゅつ]は体[からだ]のうちにある。彼女[かのじょ]は月経[げっけい]の汚[けが]れのうちに七日[なぬか]の間[あいだ]とどまる。彼女に触[ふ]れた者[もの]はだれでも夕[ゆう]べまで汚れる。"
  20: "月経[げっけい]の間[あいだ]、彼女[かのじょ]が横[よこ]たわる物[もの]はすべて汚[けが]れ、彼女が座[すわ]る物もすべて汚れる。"
  21: "彼女[かのじょ]の寝床[ねどこ]に触[ふ]れた者[もの]はだれでも、衣服[いふく]を洗[あら]い、水[みず]で体[からだ]を洗わなければならない。その者は夕[ゆう]べまで汚[けが]れている。"
  22: "彼女[かのじょ]が座[すわ]った物[もの]に触[ふ]れた者[もの]はだれでも、衣服[いふく]を洗[あら]い、水[みず]で体[からだ]を洗わなければならない。その者は夕[ゆう]べまで汚[けが]れている。"
  23: "それが彼女[かのじょ]の寝床[ねどこ]の上[うえ]にあれ、彼女が座[すわ]った物[もの]の上にあれ、それに触[ふ]れる者[もの]は夕[ゆう]べまで汚[けが]れる。"
  24: "もし男[おとこ]が彼女[かのじょ]と寝[ね]て、彼女の汚[けが]れが彼[かれ]に及[およ]んだなら、彼は七日[なぬか]の間[あいだ]汚れる。彼が横[よこ]たわる寝床[ねどこ]はすべて汚れる。"
  25: "女[おんな]が月経[げっけい]の時[とき]でないのに、何日[なんにち]も血[ち]の流出[りゅうしゅつ]を続[つづ]けるなら、また月経の後[あと]に流出があるなら、その汚[けが]れの流出の日[ひ]はすべて、月経の日と同[おな]じである。彼女[かのじょ]は汚れている。"
  26: "その流出[りゅうしゅつ]の日[ひ]はすべて、彼女[かのじょ]が横[よこ]たわる寝床[ねどこ]は月経[げっけい]の寝床と同[おな]じであり、彼女が座[すわ]る物[もの]もすべて、月経の汚[けが]れと同じく汚れる。"
  27: "彼女[かのじょ]に触[ふ]れた者[もの]はだれでも汚[けが]れる。その者は衣服[いふく]を洗[あら]い、水[みず]で体[からだ]を洗わなければならない。その者は夕[ゆう]べまで汚れている。"
  28: "彼女[かのじょ]がその流出[りゅうしゅつ]から清[きよ]められたなら、七日[なぬか]を数[かぞ]え、その後[あと]に清くなる。"
  29: "八日目[ようかめ]に、彼女[かのじょ]は自分[じぶん]のために山鳩[やまばと]二羽[にはわ]、または家鳩[いえばと]のひな二羽を取[と]り、祭司[さいし]のもとへ、証[あかし]の幕屋[まくや]の入口[いりぐち]に持[も]って来[こ]なければならない。"
  30: "祭司[さいし]はその一羽[いちわ]を贖罪祭[しょくざいさい]として、もう一羽を燔祭[はんさい]として献[ささ]げる。祭司は主[しゅ]の前[まえ]で、彼女[かのじょ]の汚[けが]れの流出[りゅうしゅつ]について彼女のために贖[あがな]いをする。"
  31: "あなたがたはイスラエルの子[こ]らに、その汚[けが]れを避[さ]けさせなさい。彼[かれ]らがその汚れのうちにありながら、わたしの幕屋[まくや]を汚して死[し]ぬことのないためである。"
  32: "これが、流出[りゅうしゅつ]のある者[もの]についての定[さだ]め、また精[せい]の流出があって、それによって汚[けが]れる者についての定めである。"
  33: "また、月経[げっけい]の間[あいだ]に血[ち]を流[なが]す女[おんな]について、流出[りゅうしゅつ]のある男[おとこ]について、男にも女にも、また、月経で隔[へだ]てられている女と寝[ね]る男についての定[さだ]めである。」"

notes:
  1: "ἐλάλησεν κύριος πρὸς Μωυσῆν καὶ Ααρων λέγων — 主はモーセとアロンに言われた; λέγων отдельно не передаётся (ср. 1:1)."
  2: "Λάλησον … καὶ ἐρεῖς αὐτοῖς — двойной приказ, как в LXX (ср. 1:2). Ἀνδρὶ ἀνδρί — букв. «мужу, мужу», дистрибутивный повтор: «всякий муж». ῥύσις — истечение (ῥέω «течь»); ἀκάθαρτός ἐστιν — нечисто."
  3: "ὁ νόμος τῆς ἀκαθαρσίας — устав о нечистоте (νόμος здесь не «закон», а «правило»). ῥέων γόνον — «изливающий семя» (γόνος). συνέστηκεν τὸ σῶμα αὐτοῦ διὰ τῆς ῥύσεως — букв. «тело его держится/составлено через истечение»: LXX буквально передаёт трудное евр. место; смысл — тело поражено истечением. Слав. переводит буквально («имже составлено есть тело»), Синодальный понимает иначе («задерживается в теле»). ἐν αὐτῷ — «в нём», т. е. нечистота при нём."
  4: "κοίτη — ложе, постель; σκεῦος — вещь, предмет (не только «сосуд»). ἐφ᾽ ᾗ ἐὰν κοιμηθῇ — «на котором он лежит»; ἀκάθαρτον ἔσται — будет нечисто."
  5: "πλυνεῖ τὰ ἱμάτια — вымоет одежды; λούσεται ὕδατι — омоется водой (в греч. без слова «тело», слав. прибавляет «тело свое»). ἕως ἑσπέρας — до вечера."
  6: "ὁ καθήμενος ἐπὶ τοῦ σκεύους, ἐφ᾽ ὃ ἐὰν καθίσῃ — «сидящий на предмете, на который сел [имеющий истечение]»: придаточное повторяет определение из ст. 4."
  7: "χρώς — кожа, тело (слав. «плоть»); ὁ ἁπτόμενος τοῦ χρωτός — «прикасающийся к коже»."
  8: "προσσιελίσῃ — редкий глагол (hapax в LXX), по смыслу «плюнет на» (слав. «плюнет»); вероятно, искажённое προσπτύω."
  9: "ἐπίσαγμα ὄνου — ослиное вьючное седло (ἐπίσαγμα «вьюк, седло»); Синодальный передаёт «повозка» по масоретскому тексту (מֶרְכָּב)."
  10: "ὑποκάτω αὐτοῦ — «под ним» (под тем, на чём он лежал или сидел); ὁ αἴρων — «поднимающий, несущий»."
  11: "ὅσων ἐὰν ἅψηται — «кого/чего коснётся»; καὶ τὰς χεῖρας οὐ νένιπται — «а рук не омыл»: оскверняет прикосновение немытых рук, и мыться предписано тому, к кому прикоснулись."
  12: "σκεῦος ὀστράκινον — глиняный сосуд (ὀστράκινος); συντριβήσεται — разбивается (ср. 6:28; 11:33). ξύλινον νιφήσεται — деревянный вымоется (νίπτω)."
  13: "καθαρισθῇ — очистится (καθαρίζω); ἐξαριθμήσεται αὐτῷ ἑπτὰ ἡμέρας — «отсчитает себе семь дней» (ἐξαριθμέω). Слав. читает «водою живою»; в gr-lxx-byz только ὕδατι, поэтому 〔生ける〕 взято в скобки."
  14: "δύο τρυγόνας ἢ δύο νεοσσοὺς περιστερῶν — двух горлиц или двух птенцов голубей (τρυγών, περιστερά; ср. 12:8). ἐπὶ τὰς θύρας τῆς σκηνῆς τοῦ μαρτυρίου — ко входу скинии свидетельства."
  15: "μίαν περὶ ἁμαρτίας καὶ μίαν εἰς ὁλοκαύτωμα — одну в жертву за грех, другую во всесожжение (μίαν ж. р., согласовано с τρυγόνα). ἐξιλάσεται περὶ αὐτοῦ — совершит за него очищение (ἐξιλάσκομαι)."
  16: "κοίτη σπέρματος — здесь не «ложе», а «излияние семени»; πᾶν τὸ σῶμα — всё тело."
  17: "ἱμάτιον καὶ δέρμα — одежда и кожа; πλυθήσεται — будет вымыто (пассив)."
  18: "κοιμηθῇ ἀνὴρ μετ᾽ αὐτῆς κοίτην σπέρματος — «ляжет с ней на ложе семени», т. е. совершит излияние; λούσονται — оба омоются."
  19: "ῥέουσα αἵματι — «текущая кровью» (ῥέω + датив); ἀφέδρος — месячное очищение, менструация; ἐν τῇ ἀφέδρῳ αὐτῆς — «в своём отделении»."
  20: "κοιτάζηται — «лежит» (κοιτάζομαι); ἐπικαθίσῃ — «сядет сверху» (ἐπικαθίζω)."
  21: "κοίτη αὐτῆς — её ложе; τὸ σῶμα αὐτοῦ — тело его (в греч. здесь есть σῶμα, в отличие от ст. 5)."
  22: "παντὸς σκεύους, οὗ ἐὰν καθίσῃ — «всякой вещи, на которую она сядет»."
  23: "ἐν τῇ κοίτῃ αὐτῆς οὔσης ἢ ἐπὶ τοῦ σκεύους — «если [это] на ложе её или на вещи»; ἐν τῷ ἅπτεσθαι αὐτὸν αὐτῆς — «когда он прикасается к ней»."
  24: "κοίτῃ τις κοιμηθῇ μετ᾽ αὐτῆς — «кто ляжет с ней» (датив κοίτῃ «на ложе»); γένηται ἡ ἀκαθαρσία αὐτῆς ἐπ᾽ αὐτῷ — «нечистота её будет на нём»."
  25: "ῥέῃ ῥύσει αἵματος — «течёт течением крови» (вин. внутреннего объекта); οὐκ ἐν καιρῷ τῆς ἀφέδρου — «не во время месячных»; καθάπερ αἱ ἡμέραι τῆς ἀφέδρου — «как дни месячных»."
  26: "κατὰ τὴν κοίτην τῆς ἀφέδρου — «как ложе месячных»; κατὰ τὴν ἀκαθαρσίαν — «по нечистоте»."
  27: "πᾶς ὁ ἁπτόμενος αὐτῆς — «всякий, прикасающийся к ней» (αὐτῆς ж. р.)."
  28: "ἐξαριθμήσεται αὐτῇ — «отсчитает себе»; καθαρισθήσεται — будет чиста."
  29: "πρὸς τὸν ἱερέα — к священнику; ἐπὶ τὴν θύραν — ко входу."
  30: "τὴν μίαν … τὴν μίαν — «одну… другую» (вин. ж. р.); ἀπὸ ῥύσεως ἀκαθαρσίας αὐτῆς — «от истечения нечистоты её»."
  31: "εὐλαβεῖς ποιήσετε — «сделаете осторожными, богобоязненными» (εὐλαβής «осмотрительный»); ἐν τῷ μιαίνειν αὐτοὺς τὴν σκηνήν — «когда они оскверняют скинию» (μιαίνω)."
  32: "γονορρυής — «имеющий истечение семени» (γόνος + ῥέω); ὥστε μιανθῆναι ἐν αὐτῇ — «так что осквернился в нём»."
  33: "αἱμορροούσῃ — «кровоточащей» (αἷμα + ῥέω); τῷ ἄρσενι ἢ τῇ θηλείᾳ — «мужчине или женщине»; ἀποκαθημένη — «отделённая», о женщине в месячных (ἀποκάθημαι)."
