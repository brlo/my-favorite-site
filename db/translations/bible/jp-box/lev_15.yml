# jp-box, Левит, глава 15. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в Левите отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 15: нечистота истечений — у мужчины (1–18) и у женщины (19–30),
# заключительный устав (31–33). Речь Бога — 「…」 (2–33), красного нет.
# 〔…〕 одно: 15:13 〔生[い]ける〕 — слав. «водою живою» при греч. ὕδατι без определения
# (проверено: в gr-lxx-byz этого слова нет).
# Сносок ⟨…⟩ нет: 贖罪祭 и 燔祭 уже пояснены при первом упоминании в корпусе,
# остальные слова понятны по контексту.
