# jp-box, Премудрость Соломона, глава 16. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для 16–17 нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 16: казни египтян и милость к Израилю (1–14) — звери, перепела и манна,
# змеи и исцеление; буря, град и огонь, творение на службе праведным
# (15–29). Прямой речи нет: всё авторский текст. Обращение «主よ» в 16:12 —
# молитвенное обращение автора, а не речь, поэтому 「…」 не ставятся.
# Нумерация по gr: 29 стихов, счёт совпадает с csl-ru. Граница 16:5/16:6 сдвинута:
# csl 16:6 начинается словами «но не до конца пребысть гнев твой», по gr это конец
# 16:5; держимся деления gr.
# 〔…〕 нет: все 29 стихов и все их слова есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: うずら, いなご, 雹, よみ и пр. уже в корпусе; マナ в главе не названа.
# Имена — транслитерация греческого (LXX); в главе имён нет.

