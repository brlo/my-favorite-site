verses:
  1: "それゆえ、彼[かれ]らは似[に]たものによって当然[とうぜん]の罰[ばつ]を受[う]け、多[おお]くの獣[けもの]によって苦[くる]しめられた。"
  2: "その罰[ばつ]に代[か]えて、あなたはあなたの民[たみ]に善[よ]くし、欲[ほっ]する心[こころ]のままに、珍[めずら]しい味[あじ]の食物[しょくもつ]、すなわちうずらを備[そな]えられた。"
  3: "それは、かの者[もの]たちが食物[しょくもつ]を欲[ほっ]しながら、送[おく]りつけられたものの忌[い]まわしさのゆえに、必要[ひつよう]な食欲[しょくよく]さえも退[しりぞ]け、この者たちはわずかの間[あいだ]乏[とぼ]しくなって、珍[めずら]しい味[あじ]にあずかるためであった。"
  4: "というのは、虐[しいた]げる者[もの]たちには避[さ]けられない欠乏[けつぼう]が臨[のぞ]むべきであり、この者たちには、彼[かれ]らの敵[てき]がどのように苦[くる]しめられたかがただ示[しめ]されればよかったからである。"
  5: "彼[かれ]らに獣[けもの]の激[はげ]しい怒[いか]りが臨[のぞ]み、曲[ま]がりくねった蛇[へび]の咬[か]み傷[きず]によって滅[ほろ]ぼされたときも、あなたの怒りは最後[さいご]まで続[つづ]かなかった。"
  6: "彼[かれ]らは諭[さと]しのためにしばらくの間[あいだ]かき乱[みだ]されたが、あなたの律法[りっぽう]の戒[いまし]めを思[おも]い起[お]こさせる救[すく]いのしるしを携[たずさ]えていた。"
  7: "立[た]ち返[かえ]った者[もの]が救[すく]われたのは、見[み]えるもののゆえではなく、すべての者の救[すく]い主[ぬし]であるあなたのゆえであった。"
  8: "あなたはこのことによって、すべての悪[あく]から救[すく]い出[だ]す者[もの]があなたであることを、わたしたちの敵[てき]に納得[なっとく]させた。"
  9: "いなごやハエの刺[さ]し咬[か]みが彼[かれ]らを殺[ころ]し、その魂[たましい]には癒[いや]しが見[み]いだされなかった。彼らはそのようなものによって罰[ばつ]せられるにふさわしかったからである。"
  10: "しかし、あなたの子[こ]らは毒[どく]ある蛇[へび]の歯[は]にも打[う]ち負[ま]かされなかった。あなたのあわれみが彼[かれ]らを迎[むか]え、癒[いや]したからである。"
  11: "彼らはあなたのことばを思[おも]い起[お]こさせるために刺[さ]され、すぐに癒[いや]された。深[ふか]い忘[わす]れに陥[おちい]って、あなたの恵[めぐ]みから引[ひ]き離[はな]されないためであった。"
  12: "薬草[やくそう]も膏薬[こうやく]も彼[かれ]らを癒[いや]さず、主[しゅ]よ、すべてを癒[いや]すあなたのことばが癒した。"
  13: "あなたは命[いのち]と死[し]の権[けん]を握[にぎ]り、よみの門[もん]に下[くだ]し、また上[のぼ]らせる。"
  14: "人[ひと]は自分[じぶん]の悪[あく]によって殺[ころ]すが、出[で]て行[い]った霊[れい]を引[ひ]き返[かえ]らせることも、取[と]り去[さ]られた魂[たましい]を解[と]き放[はな]つこともない。"
  15: "しかし、あなたの手[て]から逃[のが]れることはできない。"
  16: "あなたを知[し]ることを拒[こば]んだ不敬[ふけい]な者[もの]たちは、あなたの腕[うで]の力[ちから]によって鞭打[むちう]たれ、異様[いよう]な雨[あめ]と雹[ひょう]と、避[さ]け難[がた]い豪雨[ごうう]に追[お]われ、火[ひ]に焼[や]き尽[つ]くされた。"
  17: "最も不思議[ふしぎ]なのは、すべてを消[け]す水[みず]の中[なか]で、火がなおいっそう力[ちから]を働[はたら]かせたことである。世界[せかい]は正[ただ]しい者[もの]たちの味方[みかた]だからである。"
  18: "あるときは炎[ほのお]が和[やわ]らぎ、不敬[ふけい]な者[もの]たちに送[おく]られた生[い]き物[もの]を焼[や]き尽[つ]くさなかった。しかし、彼[かれ]ら自身[じしん]が、見[み]ながら、自分[じぶん]たちが神[かみ]の裁[さば]きによって追[お]われていることを知[し]るためであった。"
  19: "またあるときは、水[みず]の中[なか]にあって火[ひ]の力[ちから]を超[こ]えて燃[も]え、不正[ふせい]な地[ち]の産物[さんぶつ]を滅[ほろ]ぼした。"
  20: "それに代[か]えて、あなたは天使[てんし]の食物[しょくもつ]であなたの民[たみ]を養[やしな]い、天[てん]から用意[ようい]されたパンを、労[ろう]することなく彼[かれ]らに与[あた]えた。それはすべての快[こころよ]さに応[こた]え、すべての味[あじ]によく調和[ちょうわ]するパンであった。"
  21: "あなたの本質[ほんしつ]は、あなたの子[こ]どもらへの甘[あま]さを現[あらわ]した。そして、それは食[た]べる者[もの]の望[のぞ]みに仕[つか]え、人[ひと]が望むままに調[ととの]えられた。"
  22: "雪[ゆき]と氷[こおり]は火[ひ]に耐[た]えて溶[と]けなかった。それは、彼[かれ]らが、雹[ひょう]の中[なか]で燃[も]え、雨[あめ]の中[なか]で閃[ひらめ]く火が、敵[てき]の実[みの]りを滅[ほろ]ぼしたことを知[し]るためであった。"
  23: "しかし、この同[おな]じ火[ひ]は、正[ただ]しい者[もの]たちが養[やしな]われるために、自分[じぶん]の力[ちから]を忘[わす]れた。"
  24: "造[つく]られたものは、すべてのものを造られたあなたに仕[つか]えて、不正[ふせい]な者[もの]たちへの罰[ばつ]へと激[はげ]しくなり、あなたに信頼[しんらい]する者[もの]たちへの恵[めぐ]みのために和[やわ]らぐ。"
  25: "それゆえ、そのときも、すべてに変[か]えられて、すべてを養[やしな]うあなたの賜物[たまもの]として、必要[ひつよう]とする者[もの]たちの望[のぞ]みに仕[つか]えた。"
  26: "主[しゅ]よ、あなたが愛[あい]した子[こ]らが学[まな]ぶためである。人[ひと]を養[やしな]うのは実[みの]りの生育[せいいく]ではなく、あなたのことばがあなたを信[しん]じる者[もの]たちを保[たも]つのである。"
  27: "火[ひ]によっても損[そこ]なわれなかったものが、太陽[たいよう]のわずかな光線[こうせん]にほんの少[すこ]し温[あたた]められただけで、溶[と]けてしまった。"
  28: "それは、太陽[たいよう]に先[さき]んじてあなたに感謝[かんしゃ]し、光[ひかり]の昇[のぼ]る方[ほう]へ向[む]かってあなたに願[ねが]い求[もと]めるべきであることが、知[し]られるためであった。"
  29: "恩[おん]を知[し]らぬ者[もの]の望[のぞ]みは、冬[ふゆ]の霜[しも]のように溶[と]け、役[やく]に立[た]たない水[みず]のように流[なが]れ去[さ]る。"

notes:
  1: "Διὰ τοῦτο — «потому», вывод из рассуждения о казнях египетских (ср. 11:5–16; 15:18–19); δι᾽ ὁμοίων — «чрез подобное»: казни соответствуют греху египтян (ср. 12:23–27). ἐκολάσθησαν ἀξίως — «наказаны достойно»; κνώδαλα — «звери, гады» (слав. «зверие», Син. «чудовища»), в тексте 獣. ἐβασανίσθησαν — «были мучимы» (βασανίζω)."
  2: "ἀνθ᾽ ἧς κολάσεως — «вместо какого наказания», т. е. вместо казни египтян. εὐεργετήσας — «облаговолив» (εὐεργετέω); слав. «благо сотворил еси». εἰς ἐπιθυμίαν ὀρέξεως — «в пожелание аппетита» (ὄρεξις — «позыв, аппетит»), сохранено буквально: 欲する心のままに. ὀρτυγομήτρα — перепел, うずら (ср. Исх 16:13; Чис 11:31)."
  3: "ἵνα … ἀποστρέφωνται — «чтобы отвращались» (ἀποστρέφω). ἐπιθυμοῦντες τροφήν — «желая пищи». διὰ τὴν εἰδέχθειαν τῶν ἐπαπεσταλμένων — «из-за отвратительности насланного» (εἰδέχθεια — «мерзость»; ἐπαποστέλλω — «посылать на»). ἀναγκαίαν ὄρεξιν — «необходимый позыв [к пище]». αὐτοὶ δέ — «а эти», т. е. израильтяне; смена подлежащего сохранена. ἐπ᾽ ὀλίγον ἐνδεεῖς γενόμενοι — «на малое время став нуждающимися»."
  4: "ἔδει — «надлежало» (безличное). ἀπαραίτητον ἔνδειαν — «неотвратимый недостаток» (ἀπαραίτητος — «неизбежный, неумолимый»). τυραννοῦσιν — датив причастия: «тем, кто тиранствует», т. е. египтянам. τούτοις δὲ μόνον δειχθῆναι — «а этим только показать», без самого мучения; слав. «сим же токмо показати»."
  5: "δεινὸς θηρίων θυμός — «страшная ярость зверей» (θυμός). δήγμασιν σκολιῶν ὄφεων — «укусами извилистых змей» (σκολιός — «кривой»); слав. читает «сверепых змиев» — иное понимание σκολιός. οὐ μέχρι τέλους ἔμεινεν ἡ ὀργή σου — «не до конца пребыл гнев Твой»: у csl это уже начало 16:6 («но не до конца пребысть гнев твой»), деление gr иное — держимся gr."
  6: "εἰς νουθεσίαν — «в наставление, вразумление» (νουθεσία), 諭し. πρὸς ὀλίγον ἐταράχθησαν — «на малое время были смущены». σύμβολον ἔχοντες σωτηρίας — «имея знамение спасения»: медный змей (Чис 21:8–9). εἰς ἀνάμνησιν ἐντολῆς νόμου σου — «в напоминание заповеди закона Твоего» (ἐντολή — 戒め). Слав. начинает стих словами из 16:5; границу держим по gr."
  7: "ὁ ἐπιστραφείς — «обратившийся» (ἐπιστρέφω), т. е. взглянувший на знамение. οὐ διὰ τὸ θεωρούμενον ἐσῴζετο — «спасался не через видимое» (θεωρέω — «созерцать»); слав. «не (вещию) зримою целяшеся», скобки в слав. тексте — знак разночтения. ἀλλὰ διὰ σὲ τὸν πάντων σωτῆρα — «но через Тебя, всех Спасителя»; 救い主 по σωτήρ."
  8: "καὶ ἐν τούτῳ δέ — «и в этом же». ἔπεισας — «убедил» (πείθω); слав. «показал еси» передаёт смысл, а не лексему. τοὺς ἐχθροὺς ἡμῶν — «врагов наших», в тексте わたしたちの敵: автор говорит от лица Израиля. ὁ ῥυόμενος ἐκ παντὸς κακοῦ — «избавляющий от всякого зла» (ῥύομαι)."
  9: "οὓς μὲν γάρ — «тех именно»: противопоставление египтянам (16:10). ἀκρίδων καὶ μυιῶν δήγματα — «укусы саранчи и мух» (ἀκρίς, μυῖα); いなご, ハエ. ἴαμα τῇ ψυχῇ — «исцеление душе» (ἴαμα). ὅτι ἄξιοι ἦσαν — «ибо достойны были»; слав. «яко достойни бяху»."
  10: "τοὺς δὲ υἱούς σου — «сынов же Твоих»: Израиль. ἰοβόλων δρακόντων ὀδόντες — «зубы ядоносных драконов» (ἰοβόλος — «мечущий яд»); δράκων в LXX часто о змеях (Чис 21), поэтому 毒ある蛇, а не 竜. οὐδὲ … ἐνίκησαν — «даже не одолели»; слав. «ниже … одолеша». ἀντιπαρῆλθεν — «вышло навстречу, пришло на помощь» (ἀντιπαρέρχομαι); слав. «прихождаше»."
  11: "εἰς ὑπόμνησιν τῶν λογίων σου — «в напоминание словес Твоих» (λόγιον — «изречение»). ἐνεκεντρίζοντο — «были уязвляемы, прокалываемы» (ἐγκεντρίζω); слав. «бяху усечени». ὀξέως διεσῴζοντο — «быстро спасались». ἀπερίσπαστοι γένωνται τῆς σῆς εὐεργεσίας — «не были отторгнуты от благодеяния Твоего» (ἀπερίσπαστος — «неотвлекаемый»); εὐεργεσία — 恵み."
  12: "οὔτε βοτάνη οὔτε μάλαγμα — «ни зелень, ни пластырь» (βοτάνη — «трава, растение»; μάλαγμα — «припарка, мазь»); слав. «зелие… обязание». ὁ σός, κύριε, λόγος ὁ πάντας ἰώμενος — «слово Твоё, Господи, всех исцеляющее» (ἰάομαι). Обращение κύριε — 主よ, не речь в 「」: это молитвенное обращение автора."
  13: "ζωῆς καὶ θανάτου ἐξουσίαν ἔχεις — «власть имеешь над жизнью и смертью» (ἐξουσία). κατάγεις εἰς πύλας ᾅδου καὶ ἀνάγεις — «низводишь к вратам ада и возводишь»; ᾅδης — よみ, как в Псалтири (ср. 1 Цар 2:6). Слав. «низводиши даже до врат ада» добавляет «даже» — в LXX его нет, на смысл не влияет."
  14: "ἀποκτέννει μὲν τῇ κακίᾳ αὐτοῦ — «убивает злобою своею» (κακία). ἐξελθὸν πνεῦμα οὐκ ἀναστρέφει — «вышедший дух не возвращает» (ἀναστρέφω). ἀναλύει ψυχὴν παραλημφθεῖσαν — «не разрешает, не освобождает взятую душу» (ἀναλύω — «разрешать, освобождать»); слав. «ниже паки призывает душу взятую» добавляет «паки» — иное понимание ἀναλύω."
  15: "Τὴν δὲ σὴν χεῖρα φυγεῖν ἀδύνατόν ἐστιν — «а Твоей руки убежать невозможно»: инфинитив при ἀδύνατον. Стих короткий, служит вводкой к 16:16; слав. «Твоея же руки избежати невозможно есть». Начало новой мысли после 16:14."
  16: "ἀρνούμενοι γάρ σε εἰδῆσαι — «отвергающие знать Тебя» (ἀρνέομαι + инф.). ἐν ἰσχύι βραχίονός σου ἐμαστιγώθησαν — «силою мышцы Твоей биты» (μαστιγόω). ξένοις ὑετοῖς καὶ χαλάζαις — «чуждыми дождями и градом»; ὄμβροις ἀπαραιτήτοις — «неотвратимыми ливнями» (ὄμβρος). πυρὶ καταναλισκόμενοι — «огнём истребляемые» (καταναλίσκω)."
  17: "τὸ παραδοξότατον — «что всего необычайнее» (παράδοξος). ἐν τῷ πάντα σβεννύντι ὕδατι πλεῖον ἐνήργει τὸ πῦρ — «в воде, всё гасящей, огонь более действовал» (σβέννυμι, ἐνεργέω). ὑπέρμαχος ὁ κόσμος ἐστὶν δικαίων — «мир есть заступник праведных» (ὑπέρμαχος); слав. «споборник… о праведных», в тексте 味方."
  18: "ποτὲ μέν … ποτὲ δέ — «иногда… иногда» (16:18–19), антитеза. ἡμεροῦτο φλόξ — «пламя укрощалось» (ἡμερόω — «делать кротким»); слав. «укрощашеся пламень». τὰ ἐπ᾽ ἀσεβεῖς ἀπεσταλμένα ζῷα — «посланные на нечестивых животные». ἵνα … εἰδῶσιν ὅτι θεοῦ κρίσει ἐλαύνονται — «чтобы знали, что Божиим судом гонимы» (ἐλαύνω)."
  19: "μεταξὺ ὕδατος ὑπὲρ τὴν πυρὸς δύναμιν φλέγει — «среди воды выше силы огня пылает» (φλέγω). ἵνα ἀδίκου γῆς γενήματα διαφθείρῃ — «чтобы погубить произведения земли неправедной» (γένημα — «произведение, плод»; διαφθείρω). Слав. «между водою выше силы огненныя паляше»."
  20: "ἀνθ᾽ ὧν — «вместо того». ἀγγέλων τροφήν — «пищу ангелов»; слав. «ангелскою пищею». ἕτοιμον ἄρτον ἀπ᾽ οὐρανοῦ — «готовый хлеб с неба»: манна (Исх 16:4; Пс 77:24–25). ἀκοπιάτως — «без труда» (ἀκόπιαστος): людям не надо было трудиться. πᾶσαν ἡδονὴν ἰσχύοντα — «имеющий всякую сладость» (ἰσχύω — «быть в силах»), передано すべての快さに応え; πρὸς πᾶσαν ἁρμόνιον γεῦσιν — «ко всякому согласному вкусу» (ἁρμόνιος)."
  21: "ἡ ὑπόστασίς σου — «сущность, состав Твой» (ὑπόστασις); слав. «существо твое», в тексте 本質. πρὸς τέκνα γλυκύτητα — «к детям сладость» (γλυκύτης). τῇ τοῦ προσφερομένου ἐπιθυμίᾳ ὑπηρετῶν — «служа пожеланию приносящего»: причастие муж. рода при ὑπόστασις (жен.), подлежащее не названо (вероятно, «слово» или «пища»), в японском сохранено опущением подлежащего: それは. πρὸς ὅ τις ἐβούλετο μετεκιρνᾶτο — «смешивалось, как кто хотел» (μετακιρνάω); слав. «превращашеся»."
  22: "χιὼν καὶ κρύσταλλος — «снег и лёд» (κρύσταλλος). ὑπέμεινε πῦρ καὶ οὐκ ἐτήκετο — «выдерживали огонь и не таяли» (ὑπομένω, τήκω). ἵνα γνῶσιν ὅτι … — «чтобы знали, что…»: подлежащее снова египтяне. πῦρ φλεγόμενον ἐν τῇ χαλάζῃ καὶ ἐν τοῖς ὑετοῖς διαστράπτον — «огонь, горящий в граде и в дождях блистающий» (διαστράπτω)."
  23: "τοῦτο πάλιν δ[έ] — «это же, напротив» (в тексте δ = δέ): тот же огонь. ἵνα τραφῶσιν δίκαιοι — «чтобы напитались праведные». τῆς ἰδίας ἐπιλέλησται δυνάμεως — «забыл свою силу» (ἐπιλανθάνομαι с род.); слав. «(огнь) и свою забы силу», скобки — пояснение переводчика."
  24: "ἡ κτίσις σοὶ τῷ ποιήσαντι ὑπηρετοῦσα — «тварь, Тебе Творцу служащая» (κτίσις). Слав. добавляет «всех» («тебе творцу всех»), в LXX этого слова нет; по паритету внесено в основной текст без 〔…〕 (すべてを造られた). ἐπιτείνεται εἰς κόλασιν — «напрягается на казнь» (ἐπιτείνω), 激しくなる; ἀνίεται εἰς εὐεργεσίαν — «ослабляется в благодеяние» (ἀνίημι — «отпускать»), 和らぐ. τῶν ἐπὶ σοὶ πεποιθότων — «на Тебя уповающих»."
  25: "διὰ τοῦτο καὶ τότε — «потому и тогда». εἰς πάντα μεταλλευομένη — «во всё превращаемая» (μεταλλεύω/μεταλλάσσω — «изменять»); слав. «во вся преобразуемое». τῇ παντοτρόφῳ σου δωρεᾷ — «всепитающим даром Твоим» (παντότροφος, δωρεά); слав. «всех кормителнице благодати твоей» — иная передача, в тексте 賜物. πρὸς τὴν τῶν δεομένων θέλησιν — «по воле нуждающихся» (δέομαι — «нуждаться»)."
  26: "ἵνα μάθωσιν οἱ υἱοί σου, οὓς ἠγάπησας, κύριε — «чтобы научились сыны Твои, которых Ты возлюбил, Господи»: обращение κύριε внутри придаточного. οὐχ αἱ γενέσεις τῶν καρπῶν τρέφουσιν ἄνθρωπον — «не рождения плодов питают человека» (γένεσις — «происхождение, рождение»); слав. «рождения плодов». τὸ ῥῆμά σου τοὺς σοὶ πιστεύοντας διατηρεῖ — «слово Твоё верующих в Тебя соблюдает» (διατηρέω)."
  27: "τὸ ὑπὸ πυρὸς μὴ φθειρόμενον — «не повреждаемое огнём» (φθείρω). ἁπλῶς — «просто, лишь»: довольно было слабого солнечного луча (ἁπλῶς относится к θερμαινόμενον, поэтому ほんの少し…だけで). ὑπὸ βραχείας ἀκτῖνος ἡλίου θερμαινόμενον ἐτήκετο — «согреваемое кратким лучом солнца таяло»; слав. «скоро… греемое растаявашеся» и Син. «тотчас» передают ἁπλῶς как «быстро» — в тексте основное значение «лишь»."
  28: "ὅπως γνωστὸν ᾖ — «чтобы известно было». δεῖ φθάνειν τὸν ἥλιον ἐπ᾽ εὐχαριστίαν σου — «должно предварять солнце благодарением Тебе» (φθάνω — «предупреждать, опережать»); слав. «предварити солнце на благодарение». πρὸς ἀνατολὴν φωτὸς ἐντυγχάνειν σοι — «к востоку света обращаться к Тебе» (ἐντυγχάνω — «встречать, обращаться с просьбой»); слав. «к востоку света тебе поклонитися» — иное понимание, в тексте 願い求める. Слав. добавляет «(всем)» — в LXX нет."
  29: "ἀχαρίστου ἐλπίς — «надежда неблагодарного» (ἀχάριστος). χειμέριος πάχνη — «зимний иней» (πάχνη); слав. «зимный иней». τακήσεται — «растает» (τήκω). ῥυήσεται ὡς ὕδωρ ἄχρηστον — «изольётся, как вода негодная» (ῥέω — «течь»; ἄχρηστος — «негодный»); слав. «излиется яко вода неключима»."
