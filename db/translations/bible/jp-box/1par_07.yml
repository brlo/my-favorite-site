# jp-box, 1-я Паралипоменон, глава 7. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc и jp-ni в 1 Пар нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 7: Иссахар (1–5), Вениамин (6–12), Неффалим (13), Манассия (14–19),
# Ефрем (20–29), Асир (30–40).
# Нумерация — по gr-lxx-byz; в этой главе она совпадает с csl (40 стихов).
# Родословия транслитерированы с греческого; формы корпуса сохранены: イッサカル, トラ,
# プア, ヤシュブ, サムエル, ベニヤミン, バレ, エフライム, マナセ, マキル, ギレアデ,
# サルパアデ, アシェル, アビエゼル, エリエゼル, ヨアス, エリサマ, ベテル, シケム,
# ガゼル, メギド, ドル, ベト・シャン, タナク, ベト・ホロン, ダビル, ヨシュア.
# Паритет LXX/csl: где csl расходится с греческим (7:12, 7:16, 7:24, 7:31 и др.),
# в тексте стоит греческое чтение, csl-вариант назван в notes; в 7:24 греческий текст
# повреждён, поэтому текст следует csl.
# 〔…〕 нет. Красного и синего нет. Прямая речь — только в 7:23, в 「…」.
# Сносок ⟨…⟩ нет: 氏族, 部族, 父の家, 家畜, 側女 понятны по контексту и корпусу.
# jp-ni не использовался.

tr_code: jp-box
book: 1par
chapter: 7
draft: true

verses:
  1: "イッサカルの子[こ]らは、トラ、プア、ヤシュブ、セメロンの四人[よにん]である。"
  2: "トラの子[こ]らは、オジ、ラファヤ、イエリエル、イエム、イエバサム、サムエルである。彼[かれ]らは、その父[ちち]の家[いえ]の長[かしら]たち、トラに属[ぞく]する力[ちから]ある者[もの]たちであり、その世代[せだい]ごとに数[かぞ]えられた。ダビデの時代[じだい]のその数[かず]は二万二千六百人[にん]であった。"
  3: "オジの子[こ]はイエズリヤ。イエズリヤの子[こ]らは、ミカエル、オブデヤ、ヨエル、イエシヤの五人[ごにん]で、すべて長[かしら]たちである。"
  4: "彼[かれ]らに属[ぞく]する者[もの]で、その世代[せだい]ごと、その父[ちち]の家[いえ]ごとに、戦[たたか]いのため並[なら]ぶ力[ちから]ある者[もの]は、三万六千[さんまんろくせん]人[にん]であった。彼[かれ]らが多[おお]くの妻[つま]と子[こ]らを持[も]ったからである。"
  5: "彼[かれ]らの兄弟[きょうだい]たちは、イッサカルのすべての氏族[しぞく]にわたって、力[ちから]ある者[もの]であり、八万七千[はちまんななせん]人[にん]であった。これが彼[かれ]らすべての数[かず]である。"
  6: "ベニヤミンの子[こ]らは、バレ、バキル、ヤディエルの三人[さんにん]である。"
  7: "バレの子[こ]らは、アセボン、オジ、オジエル、イエリモト、ウリの五人[ごにん]で、父[ちち]の家[いえ]の長[かしら]たち、力[ちから]ある者[もの]たちである。その数[かず]は二万二千三十四[にまんにせんさんじゅうよん]人[にん]であった。"
  8: "バキルの子[こ]らは、ザマリヤ、ヨアス、エリエゼル、エリテナン、アマルヤ、イエリモト、アビウ、アナトト、ゲメトである。これらはすべてバキルの子[こ]らである。"
  9: "その数[かず]は、その世代[せだい]ごとに、その父[ちち]の家[いえ]の長[かしら]たち、力[ちから]ある者[もの]で、二万二百人[にまんにひゃくにん]であった。"
  10: "ヤディエルの子[こ]はバラアン。バラアンの子[こ]らは、ヤウス、ベニヤミン、アオト、ハナナ、ザイタン、ラメサイ、アヒサアルである。"
  11: "これらはすべてヤディエルの子[こ]らであり、その氏族[しぞく]の長[かしら]たち、力[ちから]ある者[もの]たちである。戦[たたか]うために力[ちから]をもって出[で]て行[い]く者[もの]は、一万七千二百人[いちまんななせんにひゃくにん]であった。"
  12: "また、サプフィンとアプフィン、およびラオムの子[こ]ら。その子[こ]はアエルである。"
  13: "ナフタリの子[こ]らは、ヤシエル、ゴニ、イシエル、サルムである。これらはビルハの子[こ]らである。"
  14: "マナセの子[こ]らは、アセリエル。彼[かれ]を産[う]んだのは、その側女[そばめ]であるシリア人[じん]の女[おんな]であった。彼女[かのじょ]はまた、ギレアデの父[ちち]マキルを産[う]んだ。"
  15: "マキルは、アムフィンとマムフィンに妻[つま]を迎[むか]えた。その姉妹[しまい]の名[な]はモハであった。次[つぎ]の者[もの]の名[な]はサルパアデで、サルパアデには娘[むすめ]たちが生[う]まれた。"
  16: "マキルの妻[つま]モハは男[おとこ]の子[こ]を産[う]み、その名[な]をファレスと名[な]づけた。その兄弟[きょうだい]の名[な]はソロス。その子[こ]はウラムである。"
  17: "ウラムの子[こ]はバダン。これらはギレアデの子[こ]らであり、ギレアデはマキルの子、マキルはマナセの子[こ]である。"
  18: "彼[かれ]の姉妹[しまい]マレヘトは、イサデク、アビエゼル、マエラを産[う]んだ。"
  19: "セミラの子[こ]らは、ヤアイム、シケム、ラケイ、アニアムであった。"
  20: "エフライムの子[こ]らは、ソタラ、その子[こ]バラド、その子[こ]タハト、その子[こ]エレアダ、その子[こ]ノメエ、"
  21: "その子[こ]ザベド、その子[こ]ソテレ、およびエゼルとエレアド。ガトの者[もの]たち、すなわちその地[ち]に生[う]まれた者[もの]たちが彼[かれ]らを殺[ころ]した。彼[かれ]らが家畜[かちく]を取[と]ろうとして下[お]って行[い]ったからである。"
  22: "彼[かれ]らの父[ちち]エフライムは多[おお]くの日[ひ]を嘆[なげ]いた。そして、彼[かれ]の兄弟[きょうだい]たちが来[き]て、彼[かれ]を慰[なぐさ]めた。"
  23: "彼[かれ]は妻[つま]のところへ入[はい]り、彼女[かのじょ]は身[み]ごもって男[おとこ]の子[こ]を産[う]んだ。彼[かれ]はその名[な]をバラガと名[な]づけて言[い]った。「わが家[いえ]に災[わざわ]いがあったからである。」"
  24: "彼[かれ]の娘[むすめ]はセエラであった。彼女[かのじょ]は下[しも]のベト・ホロンと上[かみ]のベト・ホロン、およびウゼン・セエラを建[た]てた。"
  25: "その子[こ]はラフェ、その子[こ]らはラセフとタレ、その子[こ]はタエン、"
  26: "その子[こ]ラアダン、その子[こ]アミウド、その子[こ]エリサマ、"
  27: "その子[こ]ヌム、その子[こ]ヨシュア。"
  28: "彼[かれ]らの所有[しょゆう]と住[す]まいは次[つぎ]のとおりである。ベテルとその村[むら]々[むら]、東[ひがし]はナアラン、西[にし]はガゼルとその村[むら]々[むら]、またシケムとその村[むら]々[むら]、ガイに至[いた]るまで、およびその村[むら]々[むら]である。"
  29: "また、マナセの子[こ]らの境[さかい]に至[いた]るまで、ベト・シャンとその村[むら]々[むら]、タアナクとその村[むら]々[むら]、バラドとその村[むら]々[むら]、メギドとその村[むら]々[むら]、ドルとその村[むら]々[むら]である。イスラエルの子ヨセフの子[こ]らは、これらの町[まち]に住[す]んだ。"
  30: "アシェルの子[こ]らは、イエムナ、イシュア、イシュイ、ベリガ、およびその姉妹[しまい]ソレである。"
  31: "ベリガの子[こ]らは、ハベルとメルキエルである。彼[かれ]はベルザイトの父[ちち]である。"
  32: "ハベルはヤファレト、サメル、ホタム、およびその姉妹[しまい]ソラを生[う]んだ。"
  33: "ヤファレトの子[こ]らは、フェセキ、バマエル、アシトである。これらはヤファレトの子[こ]らである。"
  34: "セメルの子[こ]らは、アヒウラオガ、オバ、アラムである。"
  35: "バネラムの兄弟[きょうだい]たちは、ソファ、イマナ、セレス、アマルである。"
  36: "ソファの子[こ]らは、フキ、アルナファル、スアル、バリ、イマレ、"
  37: "ソバル、オド、セマ、サリサ、イエトラン、ベエラである。"
  38: "イエテルの子[こ]らは、イフィナ、ファスファ、アラである。"
  39: "オラの子[こ]らは、オレク、アニエル、ラシヤである。"
  40: "これらはすべてアシェルの子[こ]らであり、すべて氏族[しぞく]の長[かしら]たち、選[えら]ばれた者[もの]たち、力[ちから]ある者[もの]たち、長[かしら]たちの指導者[しどうしゃ]である。戦[たたか]いのために並[なら]ぶ者[もの]の数[かず]は、二万六千[にまんろくせん]人[にん]であった。"

notes:
  1: "Υἱοὶ Ισσαχαρ — сыны Иссахара; Θωλα, Φουα, Ιασουβ, Σεμερων — トラ, プア, ヤシュブ (формы корпуса, Числ 26:23–24), セメロン (Шимрон; в Числ 26:24 Σαμαραν — サマラン); τέσσαρες — четверо."
  2: "υἱοὶ Θωλα — сыны Толы; Οζι, Ραφαια, Ιεριηλ, Ιεμου, Ιεβασαμ, Σαμουηλ — オジ, ラファヤ, イエリエル, イエム, イエバサム, サムエル. ἄρχοντες οἴκων πατριῶν αὐτῶν τῷ Θωλα — главы домов отцов их, у Толы (дат. принадлежности); κατὰ γενέσεις — по поколениям; 22 600. Csl: «амин» вм. Ιεμου и «иаффам» вм. Ιεβασαμ."
  3: "υἱοὶ Οζι — сын Уззия Иезрахия; καὶ υἱοὶ Ιεζρια — и сыны Иезрахии: Μιχαηλ, Οβδια, Ιωηλ, Ιεσια, πέντε — Михаил, Овадия, Иоиль, Ишшия, пятеро (пятый — сам Иезрахия, как в евр.); ἄρχοντες πάντες — все вожди."
  4: "ἐπ᾽ αὐτῶν — «при них», с ними; κατ᾽ οἴκους πατρικούς — по отчим домам; ἰσχυροὶ παρατάξασθαι εἰς πόλεμον — сильные выстроиться на войну; ἐπλήθυναν γυναῖκας καὶ υἱούς — умножили жён и сыновей (слав. «много бо имеша жен и сынов»); 36 000."
  5: "ἀδελφοὶ αὐτῶν εἰς πάσας πατριὰς Ισσαχαρ — братья их по всем отечествам Иссахара; ἰσχυροὶ δυνάμει — сильные силой; ὁ ἀριθμὸς αὐτῶν τῶν πάντων — число всех их; 87 000."
  6: "Βενιαμιν — ベニヤミン; Βαλε — バレ (Бела, ср. ст. 7; в Быт 46:21 Βαλα), Βαχιρ — バキル (Бехер), Ιαδιηλ — ヤディエル (Иедиаил); τρεῖς — трое."
  7: "υἱοὶ Βαλε — сыны Белы: Ασεβων, Οζι, Οζιηλ, Ιεριμωθ, Ουρι — アセボン, オジ, オジエル, イエリモト, ウリ; ἄρχοντες οἴκων πατρικῶν — главы отчих домов; 22 034. Csl ст. 7 читает «есевон и озиа, и озиил и иеримуф и уриа»."
  8: "Девять имён: Ζαμαριας, Ιωας, Ελιεζερ, Ελιθεναν, Αμαρια, Ιεριμωθ, Αβιου, Αναθωθ, Γεμεεθ — ザマリヤ, ヨアス, エリエゼル, エリテナン, アマルヤ, イエリモト, アビウ, アナトト, ゲメト. Csl: «замириа, иоав, елиезер, елиана, амариа, иеримуф, авиа, анафоф, елмефем»."
  9: "ὁ ἀριθμὸς αὐτῶν κατὰ γενέσεις αὐτῶν — число их по поколениям их; ἄρχοντες οἴκων πατριῶν ... ἰσχυροὶ δυνάμει — главы домов отцов, сильные силой; 20 200 (слав. «двадесять тысящ и двести»)."
  10: "υἱοὶ Ιαδιηλ — сын Иедиаила Билган (Βαλααν — バラアン); семь сыновей: Ιαους, Βενιαμιν, Αωθ, Χανανα, Ζαιθαν, Ραμεσσαι, Αχισααρ — ヤウス, ベニヤミン, アオト, ハナナ, ザイタン, ラメサイ, アヒサアル. Csl: «иеос и вениамин, и аоф и аханаан, и зифан и фарсис и асаир»."
  11: "πάντες οὗτοι υἱοὶ Ιαδιηλ — все эти сыны Иедиаила; ἄρχοντες τῶν πατριῶν — главы отечеств; ἐκπορευόμενοι δυνάμει τοῦ πολεμεῖν — выходящие с силой на войну; 17 200."
  12: "Σαπφιν καὶ Απφιν — Шупим и Хупим (слав. «сафан и ифан»); υἱοὶ Ραωμ — сыны Ира (Ραωμ — ラオム), υἱὸς αὐτοῦ Αερ — сын его Ахер (アエル). В евр. 7:12: «сыновья Ира: Хушим, сын Ахера»."
  13: "Υἱοὶ Νεφθαλι — сыны Неффалима: Ιασιηλ, Γωνι, Ισσιηρ, Σαλωμ — ヤシエル, ゴニ, イシエル, サルム (Иахцеил, Гуни, Иецер, Шиллем); υἱοὶ Βαλαα — сыны Валлы (בִּלְהָה); в тексте корпусная форма ビルハ (Быт 46:25), греч. Βαλαα."
  14: "Υἱοὶ Μανασση — сыны Манассии: Ασεριηλ — アセリエル; ὃν ἔτεκεν ἡ παλλακὴ αὐτοῦ ἡ Σύρα — которого родила наложница его, Сириянка (слав. «сира»); ἔτεκεν τὸν Μαχιρ πατέρα Γαλααδ — родила Махира, отца Галаада."
  15: "ἔλαβεν γυναῖκα τῷ Αμφιν καὶ Μαμφιν — «взял жену Хупиму и Шупиму» (дат. вм. вин.: Махир взял жену для Хупима и Шупима); Αμφιν, Μαμφιν — アムフィン, マムフィン (слав. «офирови и сафинови»); Μοωχα — モハ (Мааха); Σαλπααδ — サルパアデ (в корпусе サルパアデ); θυγατέρες — дочери (Числ 27:1)."
  16: "ἔτεκεν Μοωχα γυνὴ Μαχιρ υἱόν — родила Моха, жена Махира, сына; Φαρες — ファレス (Фарес/Кереш), Σορος — ソロス (Шереш), Ουλαμ — ウラム (Улам, в корпусе ウラム). Csl добавляет «и ракам» (Рекем) — в греч. нет."
  17: "υἱοὶ Ουλαμ — сын Улама Бедан (Βαδαν — バダン); οὗτοι υἱοὶ Γαλααδ υἱοῦ Μαχιρ υἱοῦ Μανασση — вот сыны Галаада, сына Махира, сына Манассии."
  18: "ἀδελφὴ αὐτοῦ ἡ Μαλεχεθ — сестра его Молехеф (マレヘト); Ισαδεκ — イサデク (Ишгод), Αβιεζερ — アビエゼル (в корпусе, Суд 6:11), Μαελα — マエラ (Махла)."
  19: "υἱοὶ Σεμιρα — сыны Шемиды (セミラ); Ιααιμ, Συχεμ, Λακει, Ανιαμ — ヤアイム, シケム, ラケイ, アニアム. Csl: «аим и сихем, и докиим и ениам»."
  20: "υἱοὶ Εφραιμ — сыны Ефрема: Σωθαλα — ソタラ (Шутелах; в Числ 26:35 Σουταλα — スタラ), Βαραδ — バラド (Беред), Θααθ — タハト, Ελεαδα — エレアダ, Νομεε — ノメエ; цепь продолжается в ст. 21."
  21: "Ζαβεδ — ザベド (Завад), Σωθελε — ソテレ (Шутелах), Εζερ — エゼル (в корпусе エゼル), Ελεαδ — エレアド; ἄνδρες Γεθ οἱ τεχθέντες ἐν τῇ γῇ — жители Гефа, рождённые в той земле (ガト, в корпусе); κατέβησαν λαβεῖν τὰ κτήνη — сошли взять стада."
  22: "ἐπένθησεν — оплакал (πενθέω); ἡμέρας πολλάς — много дней (вин. времени); τοῦ παρακαλέσαι αὐτόν — чтобы утешить его (παρακαλέω)."
  23: "εἰσῆλθεν πρὸς τὴν γυναῖκα αὐτοῦ — «вошёл к жене своей»; ἔλαβεν ἐν γαστρί — зачала; Βαραγα — バラガ (Берия); ὅτι Ἐν κακοῖς ἐγένετο ἐν οἴκῳ μου — «ибо в злом [он] родился в доме моём» (слав. «яко в злых дому его рожден есть»). Прямая речь — в 「…」; вводное 言った добавлено по смыслу."
  24: "Греч. текст повреждён: «καὶ ἐν ἐκείνοις τοῖς καταλοίποις καὶ ᾠκοδόμησεν Βαιθωρων τὴν κάτω καὶ τὴν ἄνω. καὶ υἱοὶ Οζαν· Σεηρα» — букв. «и в тех остатках, и построил Беф-Орон нижний и верхний; и сыны Озана: Сеера». По csl («дщи же его сараа ... и созда вефорон нижний и вышний и садру») и по смыслу (ср. Нав 16:3; евр.: Шеера, дочь его, построила) в тексте: дочь его Сеера построила Беф-Орон; «садра» csl — евр. אֻזֵּן שֶׁאֱרָה, Уззен-Шеера (ウゼン・セエラ). セエラ — по греч. Σεηρα."
  25: "Ραφη — ラフェ (Рефай), Ρασεφ — ラセフ (Решеф), Θαλε — タレ (Фелах), Θαεν — タエン (Фахан); цепь продолжается в ст. 26."
  26: "τῷ Λααδαν υἱῷ αὐτοῦ — «у Лаадана, сына его» (дат.); Αμιουδ — アミウド (Аммиуд), Ελισαμα — エリサマ (в корпусе エリサマ)."
  27: "Νουμ — ヌム (Нон), Ιησουε — Иисус (Иехошуа); в корпусе для сына Навина — ヨシュア, здесь та же форма."
  28: "κατάσχεσις — владение; κατοικία — поселение; κατ᾽ ἀνατολάς — к востоку; πρὸς δυσμαῖς — к западу; ἕως Γαιαν — до Гая (עַיָּה); καὶ αἱ κῶμαι αὐτῆς — и селения его."
  29: "ἕως ὁρίων υἱῶν Μανασση — до пределов сынов Манассии; Βαιθσααν — ベト・シャン (в корпусе ベト・シャン), Θααναχ — タアナク (в корпусе タナク), Βαλαδ — バラド, Μαγεδδω — メギド (в корпусе メギド), Δωρ — ドル; ἐν ταύταις κατῴκησαν — в них жили."
  30: "Υἱοὶ Ασηρ — сыны Асира: Ιεμνα — イエムナ (Имна), Ισουα — イシュア (Ишва), Ισουι — イシュイ (Ишви), Βεριγα — ベリガ (Берия), Σορε ἀδελφὴ αὐτῶν — сестра их Серах (ソレ)."
  31: "Χαβερ — ハベル (Хевер), Μελχιηλ — メルキエル (Малхиил); οὗτος πατὴρ Βερζαιθ — он отец Бирзаифа (ベルザイト)."
  32: "Χαβερ ἐγέννησεν — Хевер родил; Ιαφαλητ — ヤファレト (Иафлет), Σαμηρ — サメル (Шомер), Χωθαμ — ホタム (Хофам), Σωλα — ソラ (Шуя), ἀδελφὴν αὐτῶν — сестру их."
  33: "υἱοὶ Ιαφαλητ — сыны Иафлета: Φεσηχι — フェセキ (Пасах), Βαμαηλ — バマエル (Бимгал), Ασιθ — アシト (Ашваф); οὗτοι υἱοὶ Ιαφαλητ — итоговая формула."
  34: "υἱοὶ Σεμμηρ — сыны Шемера (セメル, ср. ст. 32 Σαμηρ); Αχιουραογα — アヒウラオガ (в евр. слиты три имени: Ахи, Рохга), Οβα — オバ (Ихубба), Αραμ — アラム (в корпусе アラム)."
  35: "Βανηελαμ — バネラム (Гелем); ἀδελφοὶ αὐτοῦ — братья его: Σωφα, Ιμανα, Σελλης, Αμαλ — ソファ, イマナ, セレス, アマル (Цофах, Имна, Шелеш, Амал). В евр. это «сыновья Гелема»."
  36: "υἱοὶ Σωφα — сыны Цофаха: Χουχι — フキ (Суах), Αρναφαρ — アルナファル (Харнефер), Σουαλ — スアル (Шуал), Βαρι — バリ (Бери), Ιμαρη — イマレ (Имра); перечисление продолжается в ст. 37."
  37: "Σοβαλ — ソバル (Бецер), Ωδ — オド (Год), Σεμμα — セマ (Шамма), Σαλισα — サリサ (Шилша), Ιεθραν — イエトラン (Ифран), Βεηρα — ベエラ (Беера)."
  38: "υἱοὶ Ιεθερ — сыны Иефера: Ιφινα — イフィナ (Иефунни), Φασφα — ファスファ (Фиспа), Αρα — アラ (Ара)."
  39: "υἱοὶ Ωλα — сыны Уллы (オラ): Ορεχ — オレク (Арах), Ανιηλ — アニエル (Ханниил), Ρασια — ラシヤ (Риция)."
  40: "πάντες ἄρχοντες πατριῶν — все главы отечеств; ἐκλεκτοὶ ἰσχυροὶ δυνάμει — избранные, сильные силой; ἄρχοντες ἡγούμενοι — «вожди начальствующие» (слав. «князи, воеводы»); ἀριθμὸς αὐτῶν εἰς παράταξιν τοῦ πολεμεῖν — число их для строя на войну; εἴκοσι ἓξ χιλιάδες — 26 000."
