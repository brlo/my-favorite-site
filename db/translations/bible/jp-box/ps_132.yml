verses:
  0: "登[とう]上[じょう]の歌[うた]。ダビデのもの。"
  1: "見[み]よ、なんと良[よ]いことか、なんと楽[たの]しいことか。兄弟[きょうだい]たちが一つに住[す]むことは。"
  2: "それは、頭[あたま]に注[そそ]がれ、ひげに、アロンのひげに流[なが]れ下[お]り、その衣[ころも]の端[はし]まで流[なが]れ下[お]りる、香[かおり]の油[あぶら]のようである。"
  3: "それは、シオンの山[やま]々[やま]に降[ふ]りるヘルモンの露[つゆ]のようである。主[しゅ]はそこに、祝福[しゅくふく]ととこしえの命[いのち]とを定[さだ]められたからである。"

notes:
  0: "Ὠιδὴ τῶν ἀναβαθμῶν· τῷ Δαυιδ — 登[とう]上[じょう]の歌、ダビデのもの (τῷ Δαυιδ — датив принадлежности; в ru-базе «Песнь восхождения. Давида»). Стих 0, имя стоит в базе."
  1: "Ἰδοὺ δὴ τί καλὸν ἢ τί τερπνόν — 見よ、なんと良いことか、なんと楽しいことか (καλός — «хороший, прекрасный»; τερπνός — «приятный, отрадный»; два прилагательных сохранены). ἀλλ' ἢ τὸ κατοικεῖν ἀδελφοὺς ἐπὶ τὸ αὐτό — 兄弟たちが一つに住むことは (ἐπὶ τὸ αὐτό — «вместе, в единстве», ср. 121:3; κατοικέω — «жить»). По-японски вопрос-восклицание с か и подлежащее в конце, как в греч. порядке."
  2: "ὡς μύρον ἐπὶ κεφαλῆς — 頭に…油のようである (μύρον — «миро, благовонное масло»; передано 香りの油, чтобы не вводить незнакомое ミロ). τὸ καταβαῖνον ἐπὶ πώγωνα — ひげに流れ下り (πώγων — «борода»; καταβαίνω — «сходить вниз»). τὸν πώγωνα τὸν Ααρων — アロンのひげに (повтор πώγων сохранён повтором ひげ — приём евр. поэзии). τὸ καταβαῖνον ἐπὶ τὴν ᾤαν τοῦ ἐνδύματος αὐτοῦ — その衣の端まで流れ下りる (ᾤα — «край, кайма одежды»; ἔνδυμα — «одеяние»)."
  3: "ὡς δρόσος Αερμων ἡ καταβαίνουσα ἐπὶ τὰ ὄρη Σιων — シオンの山々に降りるヘルモンの露のようである (δρόσος — «роса»; Αερμων — Ермон, ヘルモン; ἐπί + acc. — «на»). ὅτι ἐκεῖ ἐνετείλατο κύριος τὴν εὐλογίαν — 主はそこに、祝福を定められた (ἐντέλλομαι — «заповедать, назначать»; εὐλογία — 祝福). καὶ ζωὴν ἕως τοῦ αἰῶνος — とこしえの命を (ζωή — 命; ἕως τοῦ αἰῶνος — «до века», отсюда とこしえの). Два дара — благословение и жизнь — сохранены раздельно."
