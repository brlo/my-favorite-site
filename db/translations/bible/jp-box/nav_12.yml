chapter: 12
draft: true

verses:
  1: "これは、ヨルダンの向[む]こう側[がわ]、日[ひ]の昇[のぼ]る方[ほう]で、アルノンの谷[たに]からヘルモン山[やま]まで、また東[ひがし]のアラバの全[すべ]ての地[ち]にわたって、イスラエルの人[ひと]々[びと]が打[う]ち殺[ころ]し、その地[ち]を嗣業[しぎょう]として受[う]け継[つ]いだ王[おう]たちである。"
  2: "すなわち、アモリ人[じん]の王[おう]シホンである。彼[かれ]はエセボンに住[す]み、谷[たに]の中[なか]にあるアロエルから、谷[たに]の中間[ちゅうかん]にわたって、ヤボクに至[いた]るまでギレアデの半[はん]分[ぶん]を支配[しはい]した。ヤボクはアンモンの子[こ]らとの境界[きょうかい]である。"
  3: "またアラバから、東[ひがし]のキネレトの海[うみ]まで、さらに東[ひがし]のアラバの海[うみ]、すなわち塩[しお]の海[うみ]まで、アシモトへの道[みち]に沿[そ]って、テマンから、アシドト・ファスガの下[した]まで。"
  4: "また、巨人[きょじん]たちの残[のこ]りであったバシャンの王[おう]オグ。彼[かれ]はアスタロトとエドラインに住[す]み、"
  5: "ヘルモン山[やま]からセルカまで、バシャンの全[すべ]てを、ゲスリとマハティの境界[きょうかい]まで支配[しはい]し、ギレアデの半[はん]分[ぶん]を、エセボンの王[おう]シホンの境界[きょうかい]まで支配[しはい]した。"
  6: "主[しゅ]のしもべモーセとイスラエルの人[ひと]々[びと]が彼[かれ]らを打[う]ち、モーセはその地[ち]をルベン、ガド、およびマナセの部族[ぶぞく]の半[はん]分[ぶん]に嗣業[しぎょう]として与[あた]えた。"
  7: "そして、これはヨルダンの向[む]こう側[がわ]で、ヨシュアとイスラエルの人[ひと]々[びと]が、海沿[うみぞ]いのバアルガド、レバノンの平野[へいや]から、セイルへと上[のぼ]るヘルカ山[やま]までの間[あいだ]で打[う]ち殺[ころ]したアモリ人[じん]の王[おう]たちである。ヨシュアはその地[ち]をイスラエルの部族[ぶぞく]に、そのくじに従[したが]って嗣業[しぎょう]として受[う]け継[つ]がせるために与[あた]えた。"
  8: "山地[さんち]、平地[へいち]、アラバ、アシドト、荒野[こうや]、ネゲブにいる者[もの]たち、すなわちヘテ人[じん]、アモリ人[じん]、カナン人[じん]、ペリジ人[じん]、ヒビ人[じん]、エブス人[じん]である。"
  9: "エリコの王[おう]、ベテルに近[ちか]いアイの王[おう]、"
  10: "エルサレムの王[おう]、ヘブロンの王[おう]、"
  11: "イエリムトの王[おう]、ラキシュの王[おう]、"
  12: "アイラムの王[おう]、ガゼルの王[おう]、"
  13: "ダビルの王[おう]、ガデルの王[おう]、"
  14: "エルマトの王[おう]、アラトの王[おう]、"
  15: "レブナの王[おう]、オドラムの王[おう]、"
  16: "マケダの王[おう]、"
  17: "タフグの王[おう]、オフェルの王[おう]、"
  18: "サロンのアフェクの王[おう]、"
  19: "ハツォルの王[おう]、"
  20: "シモオンの王[おう]、マロンの王[おう]、アジフの王[おう]、"
  21: "カデシュの王[おう]、タナクの王[おう]、"
  22: "メギドの王[おう]、カルメルのイエコナムの王[おう]、"
  23: "ナフェドルのドルの王[おう]、ガリラヤのゴイムの王[おう]、"
  24: "タルサの王[おう]。これらはすべて、二十九[にじゅうきゅう]人[にん]の王[おう]である。"

notes:
  1: "οὗτοι οἱ βασιλεῖς τῆς γῆς, οὓς ἀνεῖλον οἱ υἱοὶ Ισραηλ — вот цари земли, которых убил Израиль (ἀναιρέω). κατεκληρονόμησαν τὴν γῆν αὐτῶν — получили в наследие землю их (κατακληρονομέω; 嗣業として受け継ぐ). πέραν τοῦ Ιορδάνου ἀφ᾿ ἡλίου ἀνατολῶν — по ту сторону Иордана, от восхода солнца, т.е. к востоку. ἀπὸ φάραγγος Αρνων ἕως τοῦ ὄρους Αερμων — от ущелья (долины) Арнона (アルノンの谷, φάραγξ — 谷, в отличие от χειμάρρους — 谷川) до горы Хермон (ヘルモン). πᾶσαν τὴν γῆν Αραβα — всю землю Арава (アラバ)."
  2: "Σηων τὸν βασιλέα τῶν Αμορραίων — Сигона, царя Аморрейского (シホン). ὃς κατῴκει ἐν Εσεβων — который жил в Есевоне (エセボン). κυριεύων ἀπὸ Αροηρ, ἥ ἐστιν ἐν τῇ φάραγγι — владея от Ароера, что в ущелье (Αροηρ — アロエル; φάραγξ — «ущелье», 谷川). κατὰ μέρος τῆς φάραγγος — по части ущелья, т.е. до середины потока (слав. «от страны дебри»). τὸ ἥμισυ τῆς Γαλααδ — половину Галаада (ギレアデ). ἕως Ιαβοκ, ὅρια υἱῶν Αμμων — до Иавока, предела сынов Аммона (ヤボク; ὅρια — 境界)."
  3: "καὶ Αραβα ἕως τῆς θαλάσσης Χενερεθ κατ᾿ ἀνατολάς — и Арава до моря Хиннереф к востоку (Χενερεθ — キネレト). ἕως τῆς θαλάσσης Αραβα, θάλασσαν τῶν ἁλῶν — до моря Арава, моря Соляного (θάλασσα τῶν ἁλῶν — 塩の海, Мёртвое море). ὁδὸν τὴν κατὰ Ασιμωθ — дорогой, что к Асимоту (Ασιμωθ — アシモト). ἀπὸ Θαιμαν τὴν ὑπὸ Ασηδωθ Φασγα — от Фемана, что под Аседоф-Фасгою (Θαιμαν — テマン; Ασηδωθ — アシドト, как в 10:40; Φασγα — ファスガ, гора Фасга; слав. читает это как одно имя «асидоф-фасга», отсюда アシドト・ファスガ)."
  4: "Ωγ βασιλεὺς Βασαν — Ог, царь Васанский (オグ, バシャン). ὑπελείφθη ἐκ τῶν γιγάντων — остался из гигантов (γίγας; слав. «от исполинов», ru «из Рефаимов» — в гр. γίγαντες, поэтому 巨人). κατοικῶν ἐν Ασταρωθ καὶ ἐν Εδραιν — живший в Астароте и Едраине (アスタロト, エドライン). Стих обрывается на причастии, продолжение в ст. 5."
  5: "ἄρχων ἀπὸ ὄρους Αερμων καὶ ἀπὸ Σελχα — владычествующий от горы Хермон и от Селхи (Σελχα — セルカ; слав. «селхи»). πᾶσαν τὴν Βασαν — весь Васан. ἕως ὁρίων Γεσουρι καὶ τὴν Μαχατι — до пределов Гесура и Махати (Γεσουρι — ゲスリ; Μαχατι — マハティ; в ru «Гессурского и Маахского»). τὸ ἥμισυ Γαλααδ, ὁρίων Σηων βασιλέως Εσεβων — половину Галаада, пределов Сигона, царя Есевонского."
  6: "Μωϋσῆς ὁ παῖς κυρίου καὶ οἱ υἱοὶ Ισραηλ ἐπάταξαν αὐτούς — Моисей, раб Господень, и сыны Израилевы поразили их. ἔδωκεν αὐτὴν … ἐν κληρονομίᾳ Ρουβην καὶ Γαδ καὶ τῷ ἡμίσει φυλῆς Μανασση — дал её в наследие Рувиму, Гаду и половине племени Манассии (Ρουβην, Γαδ, Μανασση — ルベン, ガド, マナセ; φυλή — 部族). Ед. ч. αὐτὴν относится к земле."
  7: "Καὶ οὗτοι οἱ βασιλεῖς τῶν Αμορραίων, οὓς ἀνεῖλεν Ἰησοῦς — и вот цари Аморрейские, которых убил Иисус. παρὰ θάλασσαν Βααλγαδ — при море Ваал-Гад (в слав. «при мори валгад»; Βααλγαδ — バアルガド). ἐν τῷ πεδίῳ τοῦ Λιβάνου — на равнине Ливана (レバノン). ἕως τοῦ ὄρους Χελχα ἀναβαινόντων εἰς Σηιρ — до горы Хелха, восходящих к Сеиру: здесь Χελχα (ヘルカ山), а в 11:17 та же гора названа Αχελ (アケル山) — форма разная в самом LXX, поэтому и катакана разная; евр. Халак. κληρονομεῖν κατὰ κλῆρον αὐτῶν — наследовать по жребию их (κλῆρος — くじ)."
  8: "ἐν τῷ ὄρει καὶ ἐν τῷ πεδίῳ καὶ ἐν Αραβα καὶ ἐν Ασηδωθ — на горе, на низменности, в Араве и в Аседофе (アシドト). ἐν τῇ ἐρήμῳ καὶ ἐν Ναγεβ — в пустыне и в Негеве (荒野, ネゲブ). τὸν Χετταῖον καὶ τὸν Αμορραῖον καὶ τὸν Χαναναῖον καὶ τὸν Φερεζαῖον καὶ τὸν Ευαῖον καὶ τὸν Ιεβουσαῖον — перечень народов в ед. ч. (собирательно); по-японски ヘテ人, アモリ人, カナン人, ペリジ人, ヒビ人, エブス人 (формы корпуса)."
  9: "τὸν βασιλέα Ιεριχω — царя Иерихона (エリコ). τὸν βασιλέα τῆς Γαι, ἥ ἐστιν πλησίον Βαιθηλ — царя Гая, что близ Вефиля (アイ; Βαιθηλ — ベテル). В греч. числительного «один» нет — оно есть только в масорете и ru; поэтому перечень идёт без числительных, счёт дан в ст. 24."
  10: "βασιλέα Ιερουσαλημ, βασιλέα Χεβρων — царя Иерусалима, царя Хеврона (エルサレム, ヘブロン). Формула «βασιλέα + род.» без артикля повторяется до конца главы."
  11: "βασιλέα Ιεριμουθ, βασιλέα Λαχις — царя Иаримуфа, царя Лахиса (イエリムト, ラキシュ). Форма イエリムト держится по всей книге (10:3, 5, 23)."
  12: "βασιλέα Αιλαμ, βασιλέα Γαζερ — царя Аилама, царя Газера (アイラム, ガゼル). Греч. Αιλαμ стоит здесь на месте евр. Еглон (в ru «Еглон»); то же имя Αιλαμ в 10:3 (Хохам Хевронский) и 10:33 (Горам Газерский) — транслитерируем одинаково, различие в notes."
  13: "βασιλέα Δαβιρ, βασιλέα Γαδερ — царя Давира, царя Гадера (ダビル, ガデル; в слав. «давирска, гадерска»; ср. 10:38 Δαβιρ — город Давир)."
  14: "βασιλέα Ερμαθ, βασιλέα Αραθ — царя Ермафа, царя Арада (エルマト, アラト). Ερμαθ — евр. Хорма (в ru «Хормы»), Αραθ — Арад (слав. «адерска»); держимся греческих форм."
  15: "βασιλέα Λεβνα, βασιλέα Οδολλαμ — царя Ливны, царя Одоллама (レブナ, オドラム; ср. 10:29–34)."
  16: "βασιλέα Μακηδα — царя Македа (マケダ; ср. 10:28). В слав. к этому стиху добавлено «царя вефилска» — в греч. нет (это масорет), поэтому стих короче."
  17: "βασιλέα Ταφουγ, βασιλέα Οφερ — царя Тафуга, царя Офера (タフグ, オフェル; слав. «апфуска, оферска», ru «Таппуаха, Хефера»)."
  18: "βασιλέα Αφεκ τῆς Σαρων — царя Афека Саронского, т.е. Афека, что в Сароне (アフェク; Σαρων — サロン). Родительный падеж указывает область, поэтому サロンのアフェク."
  19: "βασιλέα Ασωρ — царя Хацора (ハツォル). В слав. на этом месте «самвронска, фувска» (Мадон и...), в ru «Мадона, Асора» — слав. и масорет делят список иначе; в гр. здесь только Ασωρ, и общее число 29."
  20: "βασιλέα Συμοων, βασιλέα Μαρρων, βασιλέα Αζιφ — царя Симрона, царя Маррона, царя Ахсафа (シモオン, マロン, アジフ — те же формы, что в 11:1)."
  21: "βασιλέα Καδης, βασιλέα Ταναχ — царя Кадеса, царя Танаха (カデシュ, タナク; слав. «фанахска, магдедонска» — в слав. сдвиг имён)."
  22: "βασιλέα Μαγεδων, βασιλέα Ιεκοναμ τοῦ Χερμελ — царя Мегиддона, царя Иокнеама при Кармиле (メギド — форма по брифу; イエコナム; Χερμελ — カルメル, гора Кармил). Родительный τοῦ Χερμελ указывает место."
  23: "βασιλέα Δωρ τοῦ Ναφεδδωρ — царя Дора при Нафеддоре (ドル — форма по брифу; Ναφεδδωρ — ナフェドル, ср. 11:2). βασιλέα Γωιμ τῆς Γαλιλαίας — царя Гоима Галилейского (ゴイム; Γαλιλαία — ガリラヤ)."
  24: "βασιλέα Θαρσα — царя Фирцы (Θαρσα — タルサ; в слав. «ферска», в ru «Фирцы»). πάντες οὗτοι βασιλεῖς εἴκοσι ἐννέα — все эти цари — двадцать девять. В гр. счёт 29, и в ст. 9–24 действительно перечислено 29 имён; у ru 31 царь (масорет), у csl список иной по составу — держимся греческого."
