# jp-box, Иисус Навин, глава 12. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в главе отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 12: цари, побеждённые за Иорданом при Моисее: Сигон и Ог (1–6);
# цари, побеждённые Иисусом за Иорданом (7–8); перечень царей (9–24).
# Нумерация: 24 стиха — как в gr-lxx-byz (совпадает с csl-ru и ru).
# Перечень: в гр. все цари названы без числительного «один»; в конце
# «πάντες οὗτοι βασιλεῖς εἴκοσι ἐννέα» — двадцать девять, и в самом деле
# перечислено 29 имён (9–24). У csl и ru список иной (в слав. 12:16 добавлен
# «царь вефилский», в ru — 31 царь по масорету) — держимся греческого счёта.
# Кавычки: речей в главе нет. Красного <j> нет.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 嗣業, 部族, くじ уже в корпусе.
# Отличия LXX: 12:12 в гр. Αιλαμ — то же имя, что в 10:3 и 10:33, хотя речь о разных
# царях (Еглон, Горам, Хохам); 12:7 гора названа Χελχα, а в 11:17 — Αχελ (одна и та же
# гора Халак); 12:14 Ερμαθ = Хорма; 12:19 в гр. только Ασωρ (Мадон у ru — из масорета).
# jp-ni не использовался.

