verses:
  1: "わたしの言葉[ことば]は神[かみ]によって語[かた]られた。王[おう]への託宣[たくせん]であり、その母[はは]が彼[かれ]を戒[いまし]めたものである。"
  2: "「わが子[こ]よ、何[なに]を守[まも]るのか。何[なに]を。神[かみ]の仰[おお]せを。初子[ういご]よ、あなたに言[い]う、わが子[こ]よ。わたしの胎[はら]の子[こ]よ、何[なに]を。わたしの祈[いの]りの子[こ]よ、何[なに]を。"
  3: "あなたの富[とみ]、あなたの思[おも]い、あなたの生[い]き方[かた]を女[おんな]たちに与[あた]え、後[あと]の悔[く]いを残[のこ]してはならない。"
  4: "すべてのことを計画[けいかく]をもって行[おこな]い、計画をもってぶどう酒[ぶどうしゅ]を飲[の]め。強[つよ]い者[もの]たちは怒[いか]りっぽい。だから、彼[かれ]らにぶどう酒を飲ませてはならない。"
  5: "飲[の]んで知恵[ちえ]を忘[わす]れ、弱[よわ]い者[もの]たちを正[ただ]しく裁[さば]くことができなくならないように。"
  6: "悲[かな]しみのうちにある者[もの]には酔[よ]わせるものを、苦[くる]しみのうちにある者[もの]にはぶどう酒を飲ませよ。"
  7: "そうすれば、その者[もの]は貧[まず]しさを忘[わす]れ、苦労[くろう]をもう思[おも]い出[だ]さない。"
  8: "わが子[こ]よ、神[かみ]の言葉[ことば]のために口[くち]を開[ひら]き、すべての者[もの]を誤[あやま]りなく裁[さば]け。"
  9: "口[くち]を開[ひら]いて正[ただ]しく裁[さば]き、貧[まず]しい者[もの]と弱[よわ]い者[もの]を見分[みわ]けよ。」"
  10: "徳[とく]ある妻[つま]をだれが見[み]いだすだろうか。そのような妻[つま]は貴重[きちょう]な石[いし]よりも尊[とうと]い。"
  11: "その夫[おっと]の心[こころ]は彼女[かのじょ]に信頼[しんらい]し、良[よ]い獲[え]り物[もの]に事欠[ことか]かない。"
  12: "彼女[かのじょ]は一生[いっしょう]の間[あいだ]、夫[おっと]に良[よ]いことをして、悪[わる]いことをしない。"
  13: "羊毛[ようもう]と麻[あさ]を紡[つむ]ぎ、自分[じぶん]の手[て]で役[やく]に立[た]つものを作[つく]る。"
  14: "彼女[かのじょ]は遠[とお]くから商[あきな]いをする船[ふね]のようになり、自分[じぶん]の糧[かて]を集[あつ]める。"
  15: "夜[よる]の明[あ]けないうちに起[お]きて、家[いえ]の者[もの]たちに食[た]べ物[もの]を与[あた]え、女中[じょちゅう]たちに仕事[しごと]を定[さだ]める。"
  16: "畑[はたけ]を見[み]てそれを買[か]い、自分[じぶん]の手[て]の実[み]によって、自分[じぶん]の財産[ざいさん]となるものを植[う]える。"
  17: "力[ちから]をもって腰[こし]に帯[おび]を締[し]め、自分[じぶん]の腕[うで]を仕事[しごと]のために強[つよ]くする。"
  18: "自分[じぶん]の仕事[しごと]が良[よ]いことを味[あじ]わい知[し]り、その灯[ともしび]は夜[よる]通[どお]し消[き]えない。"
  19: "腕[うで]を役[やく]に立[た]つことに伸[の]べ、手[て]を紡錘[ぼうすい]に据[す]える。"
  20: "その手[て]を貧[まず]しい者[もの]に開[ひら]き、その掌[てのひら]を乏[とぼ]しい者[もの]に伸[の]べる。"
  21: "夫[おっと]は家[いえ]の者[もの]たちのことを心配[しんぱい]しない。家[いえ]の者[もの]はすべて彼女[かのじょ]によって着[き]せられるからである。"
  22: "彼女[かのじょ]は自分[じぶん]の夫[おっと]のために二重[にじゅう]の上着[うわぎ]を作[つく]り、自分[じぶん]には亜麻布[あまぬの]と紫[むらさき]の衣[ころも]を用意[ようい]する。"
  23: "その夫[おっと]は、地[ち]の住人[じゅうにん]である長老[ちょうろう]たちとともに議会[ぎかい]に座[すわ]るとき、門[もん]で人[ひと]の目[め]を引[ひ]く。"
  24: "彼女[かのじょ]は亜麻布[あまぬの]の衣[ころも]を作[つく]ってフィニキア人[じん]に売[う]り、帯[おび]をカナン人[じん]に売り渡[わた]す。"
  25: "彼女[かのじょ]は口[くち]を注意[ちゅうい]深[ぶか]く、律法[りっぽう]にかなって開[ひら]き、その舌[した]に秩序[ちつじょ]を定[さだ]めた。"
  26: "彼女[かのじょ]は力[ちから]と美[うつく]しさを衣[ころも]として身[み]にまとい、末[すえ]の日々[ひび]に喜[よろこ]んだ。"
  27: "その家[いえ]の歩[あゆ]みは堅[かた]く整[ととの]い、彼女[かのじょ]は怠[なま]けのパンを食[た]べない。"
  28: "彼女[かのじょ]は口[くち]を開[ひら]いて知恵[ちえ]にかなったこと、律法[りっぽう]にかなったことを語[かた]る。その施[ほどこ]しは子[こ]らを立[た]たせ、子[こ]らは富[とみ]んだ。夫[おっと]も彼女[かのじょ]をほめた。"
  29: "「多[おお]くの娘[むすめ]たちが富[とみ]を手[て]に入[い]れ、多[おお]くの者[もの]が力[ちから]あることを成[な]し遂[と]げた。しかし、あなたはそのすべてにまさり、すべてを越[こ]えている。」"
  30: "偽[いつわ]りの媚[こ]びと女[おんな]のむなしい美[うつく]しさ。しかし、思慮[しりょ]ある女[おんな]は祝福[しゅくふく]される。主[しゅ]を畏[おそ]れることを彼女[かのじょ]こそほめたたえよ。"
  31: "彼女[かのじょ]にその手[て]の実[み]から与[あた]えよ。そして、彼女[かのじょ]の夫[おっと]が町[まち]の門[もん]でほめたたえられるように。"

notes:
  1: "Οἱ ἐμοὶ λόγοι εἴρηνται ὑπὸ θεοῦ — «мои слова изречены Богом» (εἴρηνται, perfect pass. от λέγω); βασιλέως χρηματισμός — «царское прорицание (оракул)» (χρηματισμός — «божественное изречение»); ὃν ἐπαίδευσεν ἡ μήτηρ αὐτοῦ — «которому научила его мать его» (παιδεύω — «наставлять»). В LXX имени Лемуила нет (оно в масоретском надписании), в текст не внесено."
  2: "τί, τέκνον, τηρήσεις — «что, чадо, соблюдёшь?» (τηρέω — «хранить, соблюдать»); τί; ῥήσεις θεοῦ — «что? изречения Божии» (ῥῆσις — «изречение»); πρωτογενές, σοὶ λέγω, υἱέ — «первородный, тебе говорю, сын» (πρωτογενής — «перворождённый»); τέκνον ἐμῆς κοιλίας — «чадо чрева моего»; τέκνον ἐμῶν εὐχῶν — «чадо молитв моих» (εὐχή — «молитва, обет»). Начало речи матери — 「…」, одна цитата до ст. 9; обрывочность греческого (повторы τί) сохранена."
  3: "μὴ δῷς γυναιξὶ σὸν πλοῦτον — «не дай жёнам богатства твоего»; τὸν σὸν νοῦν καὶ βίον — «и ум твой, и жизнь твою» (βίος — «жизнь, средства к жизни»); εἰς ὑστεροβουλίαν — «в позднее размышление (запоздалое раскаяние)» (ὑστεροβουλία — «поздний совет»); слав. «в последний совет». Синодальный иной (по масоретскому тексту)."
  4: "μετὰ βουλῆς πάντα ποίει — «с советом всё делай» (βουλή — «совет, решение»); μετὰ βουλῆς οἰνοπότει — «с советом пей вино» (οἰνοποτέω — «пить вино»); οἱ δυνάσται θυμώδεις εἰσίν — «властители гневливы» (δυνάστης — «властитель»); οἶνον μὴ πινέτωσαν — «вина пусть не пьют». LXX здесь существенно иной, чем масоретский текст и Синодальный («не царям пить вино»); держимся греческого."
  5: "ἵνα μὴ πιόντες ἐπιλάθωνται τῆς σοφίας — «чтобы, напившись, не забыли премудрости» (ἐπιλανθάνομαι — «забывать»); ὀρθὰ κρῖναι οὐ μὴ δύνωνται τοὺς ἀσθενεῖς — «и не могли судить право немощных» (ὀρθός — «прямой, правый»; ἀσθενής — «немощный»)."
  6: "δίδοτε μέθην τοῖς ἐν λύπαις — «давайте хмельное тем, кто в печали» (μέθη — «опьянение, хмельной напиток»; λύπη — «печаль»); οἶνον πίνειν τοῖς ἐν ὀδύναις — «вино пить тем, кто в страданиях» (ὀδύνη — «боль, страдание»)."
  7: "ἵνα ἐπιλάθωνται τῆς πενίας — «чтобы забыли бедность» (πενία — «бедность»); τῶν πόνων μὴ μνησθῶσιν ἔτι — «и трудов больше не вспоминали» (πόνος — «труд, страдание»; μιμνήσκομαι — «вспоминать»)."
  8: "ἄνοιγε σὸν στόμα λόγῳ θεοῦ — «открывай уста твои для слова Божия» (ἀνοίγω — «открывать»); κρῖνε πάντας ὑγιῶς — «суди всех здраво» (ὑγιῶς — «здраво, правильно»; передано 誤りなく). Слав. добавляет «Сыне», чего в gr нет; по паритету внесено в основной текст без 〔…〕. Синодальный иной (по масоретскому тексту: «за безгласного и сирот»); jp-joc здесь следует масоретскому тексту."
  9: "ἄνοιγε σὸν στόμα καὶ κρῖνε δικαίως — «открывай уста твои и суди праведно»; διάκρινε δὲ πένητα καὶ ἀσθενῆ — «разбирай же дело бедного и немощного» (διακρίνω — «различать, разбирать тяжбу»). Здесь речь матери кончается."
  10: "Γυναῖκα ἀνδρείαν τίς εὑρήσει — «жену доблестную кто найдёт» (ἀνδρεῖος — «мужественный, доблестный»); τιμιωτέρα ἐστὶν λίθων πολυτελῶν — «драгоценнее камней многоценных» (πολυτελής — «драгоценный»). Начало поэмы о добродетельной жене; внешних кавычек нет."
  11: "θαρσεῖ ἐπ᾽ αὐτῇ ἡ καρδία τοῦ ἀνδρὸς αὐτῆς — «дерзает (доверяет) на неё сердце мужа её» (θαρσέω — «быть смелым, полагаться»); ἡ τοιαύτη καλῶν σκύλων οὐκ ἀπορήσει — «такая добрых добыч не лишится» (σκῦλα — «добыча»; ἀπορέω — «нуждаться, лишаться»)."
  12: "ἐνεργεῖ γὰρ τῷ ἀνδρὶ ἀγαθὰ πάντα τὸν βίον — «ибо делает мужу доброе всю жизнь» (ἐνεργέω — «действовать, делать»; βίος — «жизнь»)."
  13: "μηρυομένη ἔρια καὶ λίνον — «сматывая (прядя) шерсть и лён» (μηρύομαι — «наматывать, прясть»; ἔριον — «шерсть»); ἐποίησεν εὔχρηστον ταῖς χερσὶν αὐτῆς — «сделала полезное руками своими» (εὔχρηστος — «годный, полезный»)."
  14: "ἐγένετο ὡσεὶ ναῦς ἐμπορευομένη μακρόθεν — «стала как корабль, торгующий издалека» (ναῦς — «корабль»; ἐμπορεύομαι — «торговать»); συνάγει τὸν βίον — «собирает средства к жизни» (βίος — «жизнь, достаток»)."
  15: "ἀνίσταται ἐκ νυκτῶν — «встаёт с ночи (до рассвета)»; ἔδωκεν βρώματα τῷ οἴκῳ — «дала пищу дому» (βρῶμα — «пища»); ἔργα ταῖς θεραπαίναις — «и работы служанкам» (θεράπαινα — «служанка»)."
  16: "θεωρήσασα γεώργιον ἐπρίατο — «усмотрев поле, купила» (γεώργιον — «поле, пашня»; ὠνέομαι — «покупать»); ἀπὸ καρπῶν χειρῶν αὐτῆς κατεφύτευσεν κτῆμα — «от плодов рук своих насадила имение» (κτῆμα — «приобретение, имение»; καταφυτεύω — «насаждать»)."
  17: "ἀναζωσαμένη ἰσχυρῶς τὴν ὀσφὺν αὐτῆς — «крепко препоясав чресла свои» (ἀναζώννυμι — «препоясывать»; ὀσφύς — «чресла»); ἤρεισεν τοὺς βραχίονας αὐτῆς εἰς ἔργον — «утвердила мышцы свои на дело» (ἐρείδω — «утверждать»; βραχίων — «мышца, рука»)."
  18: "ἐγευσάτο ὅτι καλόν ἐστιν τὸ ἐργάζεσθαι — «вкусила, что хорошо трудиться» (γεύομαι — «вкушать»); οὐκ ἀποσβέννυται ὅλην τὴν νύκτα ὁ λύχνος αὐτῆς — «не гаснет всю ночь светильник её» (ἀποσβέννυμι — «угашать»; λύχνος — «светильник»)."
  19: "τοὺς πήχεις αὐτῆς ἐκτείνει ἐπὶ τὰ συμφέροντα — «руки свои простирает на полезное» (πῆχυς — «локоть, рука»; συμφέροντα — «полезное»); τὰς χεῖρας αὐτῆς ἐρείδει εἰς ἄτρακτον — «руки свои утверждает на веретено» (ἄτρακτος — «веретено, прялка»)."
  20: "χεῖρας αὐτῆς διήνοιξεν πένητι — «руки свои открыла бедному»; καρπὸν ἐξέτεινεν πτωχῷ — «даяние простёрла нищему» (καρπός — «плод»; ἐκτείνω — «простирать»)."
  21: "οὐ φροντίζει τῶν ἐν οἴκῳ ὁ ἀνὴρ αὐτῆς — «не заботится о домашних муж её» (φροντίζω — «заботиться»); ὅταν που χρονίζῃ — «когда где-либо замедлит» (χρονίζω — «медлить»); πάντες οἱ παρ᾽ αὐτῆς ἐνδιδύσκονται — «ибо все у неё одеты» (ἐνδιδύσκω — «одевать»)."
  22: "δισσὰς χλαίνας ἐποίησεν τῷ ἀνδρὶ αὐτῆς — «двойные плащи сделала мужу своему» (δισσός — «двойной»; χλαῖνα — «плащ»); ἐκ βύσσου καὶ πορφύρας ἑαυτῇ ἐνδύματα — «из виссона и порфиры себе одежды» (βύσσος — «виссон, тонкий лён»; πορφύρα — «порфира»)."
  23: "περίβλεπτος γίνεται ἐν πύλαις ὁ ἀνὴρ αὐτῆς — «приметен в воротах муж её» (περίβλεπτος — «видный, заметный»); ἡνίκα ἂν καθίσῃ ἐν συνεδρίῳ μετὰ τῶν γερόντων κατοίκων τῆς γῆς — «когда сядет в совете со старейшинами жителей земли» (συνέδριον — «собрание, совет»; γέρων — «старейшина»)."
  24: "σινδόνας ἐποίησεν καὶ ἀπέδοτο — «тонкие льняные одежды сделала и продала» (σινδών — «льняная ткань, плащаница»); περιζώματα τοῖς Χαναναίοις — «пояса хананеям» (περίζωμα — «опоясание»). Слав. в первой половине читает «финикианом», во второй «хананеом»; по паритету в тексте оба слова, в LXX здесь только Χαναναίοις."
  25: "στόμα αὐτῆς διήνοιξεν προσεχόντως καὶ ἐννόμως — «уста свои открыла внимательно и законно» (προσεχόντως — «внимательно»; ἔννομος — «законный»); τάξιν ἐστείλατο τῇ γλώσσῃ αὐτῆς — «чин установила языку своему» (τάξις — «порядок»; στέλλω — «устанавливать»). В jp-joc этот стих стоит на месте ст. 26: там нумерация с 25-го стиха идёт по масоретскому тексту."
  26: "ἰσχὺν καὶ εὐπρέπειαν ἐνεδύσατο — «силу и благолепие облекла» (εὐπρέπεια — «благолепие, красота»); εὐφράνθη ἐν ἡμέραις ἐσχάταις — «возвеселилась в последние дни» (ἔσχατος — «последний»)."
  27: "στεγναὶ διατριβαὶ οἴκων αὐτῆς — «плотны жилища (пути) дома её» (στεγνός — «плотный, закрытый»; διατριβή — «пребывание, образ жизни»); σῖτα ὀκνηρὰ οὐκ ἔφαγεν — «хлеба праздного не ела» (ὀκνηρός — «ленивый, праздный»)."
  28: "τὸ στόμα ἀνοίγει σοφῶς καὶ νομοθέσμως — «уста открывает премудро и законно» (νομοθέσμως — «по закону»); ἡ ἐλεημοσύνη αὐτῆς ἀνέστησεν τὰ τέκνα αὐτῆς — «милостыня её возставила детей её» (ἐλεημοσύνη — «милостыня, милосердие»; ἀνίστημι — «поднимать»); ἐπλούτησαν — «обогатились»; ὁ ἀνὴρ αὐτῆς ᾔνεσεν αὐτήν — «муж её похвалил её». Вторая половина стиха у csl вынесена в отдельный ст. 29 («Милостыня же ея возстави чада ея…») сверх греческого; здесь она уже входит в gr 31:28, отдельного стиха нет."
  29: "Πολλαὶ θυγατέρες ἐκτήσαντο πλοῦτον — «многие дочери приобрели богатство»; πολλαὶ ἐποίησαν δυνατά — «многие сделали могучее»; σὺ δὲ ὑπέρκεισαι καὶ ὑπερῆρας πάσας — «ты же превосходишь и превысила всех» (ὑπέρκειμαι — «быть выше»; ὑπεραίρω — «превозноситься»). Это похвала мужа, введённая в ст. 28 («муж её похвалил её»), поэтому слова даны в 「…」; прочая поэма 10–31 — без кавычек."
  30: "ψευδεῖς ἀρέσκειαι καὶ μάταιον κάλλος γυναικὸς — «ложны угождения и суетна красота жены» (ἀρέσκεια — «угодливость, приятность»; μάταιος — «тщетный, суетный»); γυνὴ συνετὴ εὐλογεῖται — «жена разумная благословляется» (συνετός — «разумный»); φόβον κυρίου αὕτη αἰνείτω — «страх Господень она да хвалит» (αἰνέω — «хвалить»)."
  31: "δότε αὐτῇ ἀπὸ καρπῶν χειρῶν αὐτῆς — «дайте ей от плодов рук её»; αἰνείσθω ἐν πύλαις ὁ ἀνὴρ αὐτῆς — «да будет хвалим в воротах муж её» (pass. от αἰνέω). LXX буквально говорит о муже, а не о делах (как в масоретском тексте); буквальное чтение сохранено, слав. так же («да хвалимь будет во вратех муж ея»)."
