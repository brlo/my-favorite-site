# jp-box, Притчи, глава 31. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для гл. 31 есть и использован как контроль церковного чтения;
# jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 31: наставление царю от матери (1–9), её речь — 「…」 2–9 одной цитатой;
# поэма о добродетельной жене (10–31), без внешних кавычек; похвала мужа — 「…」 29.
# В LXX имени Лемуила нет (оно в масоретском надписании), поэтому в текст не внесено.
# Нумерация по gr: 31 стих. У csl 32 стиха: слав. ст. 29 («Милостыня же ея возстави
# чада ея, и обогатишася: и муж ея похвали ю») — это вторая половина gr 31:28, она
# уже входит в наш ст. 28; отдельного стиха нет. Дальше csl сдвинут на один
# (csl 30 = gr 29, csl 31 = gr 30, csl 32 = gr 31). Стихи не добавлялись и не дробились.
# jp-joc в ст. 25–31 нумерует по масоретскому тексту (его 25 = gr 26, его 26 = gr 28a,
# его 28 = gr 28b, его 29 = gr 29); учтено как контроль чтения, не нумерации.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).

