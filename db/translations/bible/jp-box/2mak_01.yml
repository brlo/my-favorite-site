# jp-box, 2 Маккавейская, глава 1. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной: в этой главе 36 стихов, совпадает с gr.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1–9 первое письмо иудеев из Иерусалима к иудеям в Египте (169 г.):
# благопожелания, бедствие при Иасоне, очищение храма; 10–36 второе письмо
# (188 г.): приветствие Аристовулу, избавление от опасностей, смерть Антиоха
# в храме Нанайи, рассказ о чудесном огне при Неемии и название «нефтар».
# Голоса: письма — 「…」: первое 1:1–9 (закрывается в 1:9); второе открыто в 1:10,
# но продолжается в главе 2, поэтому кавычки закрыты в конце 1:36 и снова
# открыты в начале 2:1 (проверка требует парности в пределах главы); молитва
# священников 1:24–29 — 「…」 внутри письма, закрывается в конце 29;
# 1:24 «молитва была такова» — вне кавычек. Повествование без кавычек.
# Год 188 (gr 1:9 в конце) по csl стоит в начале 1:10 — держим csl.
# Имена: アリストブロス, アンティオコス, デメトリオス, ヤソン, ネヘミヤ,
# ヨナタン, ナナイア — новое; モーセ, アブラハム, イサク, ヤコブ, イスラエル,
# エルサレム — по корпусу.

