verses:
  1: "「エジプトにいる兄弟[きょうだい]であるユダヤ人[じん]たちに、エルサレムにいる兄弟であるユダヤ人たちとユダヤの国[くに]にいる者[もの]たちから挨拶[あいさつ]を送[おく]る。良[よ]い平安[へいわ]があるように。"
  2: "神[かみ]があなたがたに善[よ]いことをなさり、その契約[けいやく]を、信[しん]実[じつ]な僕[しもべ]であるアブラハム、イサク、ヤコブとの間[あいだ]に覚[おぼ]えてくださるように。"
  3: "また、あなたがたすべてに心[こころ]を与[あた]え、大[おお]きな心と願[ねが]う魂[たましい]をもって神を敬[うやま]い、その御心[みこころ]を行[おこな]うように。"
  4: "また、あなたがたの心をその律法[りっぽう]と戒[いまし]めのうちに開[ひら]き、平安[へいわ]を造[つく]ってくださるように。"
  5: "また、あなたがたの願[ねが]いを聞[き]き、あなたがたと和[やわ]らぎ、悪[あく]い時[とき]にあなたがたを見捨[みす]てないように。"
  6: "そして今[いま]、わたしたちはここで、あなたがたのために祈[いの]っている。"
  7: "デメトリオスが王[おう]となって百六十九年目[ひゃくろくじゅうきゅうねんめ]、わたしたちユダヤ人[じん]は、この年々[としつき]にわたしたちに降[ふ]りかかった苦[くる]しみと行[い]き詰[づ]まりの中[なか]で、あなたがたに書[か]き送[おく]った。それは、ヤソンと彼[かれ]に従[したが]う者[もの]たちが聖[せい]なる地[ち]と王国[おうこく]から離[はな]れた時[とき]からのことである。"
  8: "彼らは門[もん]を焼[や]き、無実[むじつ]の血[ち]を流[なが]した。そこでわたしたちは主[しゅ]に願[ねが]い、聞[き]き入[い]れられた。そして犠牲[ぎせい]と小麦粉[こむぎこ]の供[そな]えを捧[ささ]げ、ともし火[び]をともし、パンを供[そな]えた。"
  9: "そして今[いま]、あなたがたがハスレウの月[つき]に仮庵[かりいお]の祭[まつ]りの日[ひ]々を祝[いわ]うためである。」"
  10: "「第百八十八年[だいひゃくはちじゅうはちねん]、エルサレムにいる者[もの]たち、ユダヤにいる者たち、および長老[ちょうろう]たちとユダは、王[おう]プトレマイオスの師[し]であり、油[あぶら]を注[そそ]がれた祭司[さいし]たちの一族[いちぞく]に属[ぞく]するアリストブロスに、またエジプトにいるユダヤ人[じん]たちに、挨拶[あいさつ]と健康[けんこう]を祈[いの]る。"
  11: "わたしたちは、神[かみ]によって大[おお]きな危険[きけん]から救[すく]われた者[もの]として、王[おう]に立[た]ち向[む]かう者[もの]のように、神に心から感謝[かんしゃ]している。"
  12: "神[かみ]ご自身が、聖[せい]なる都[みやこ]に攻[せ]めかかった者[もの]たちを追[お]い払[はら]われたからである。"
  13: "というのは、あの将軍[しょうぐん]がペルシアに赴[おもむ]いたとき、彼[かれ]とともにあって無敵[むてき]と思[おも]われた軍[ぐん]勢[ぜい]が、ナナイアの神殿[しんでん]で切[き]り捨[す]てられたからである。ナナイアに仕[つか]える祭司[さいし]たちが欺[あざむ]きを用[もち]いたのである。"
  14: "それは、アンティオコスとその友人[ゆうじん]たちが、彼女[かのじょ]と結[むす]ばれようとしてその場所[ばしょ]へ来[き]、多[おお]くの金[かね]を婚姻[こんいん]の持参金[じさんご]として受[う]け取[と]ろうとしたからである。"
  15: "祭司[さいし]たちがそれらを差[さ]し出[だ]し、彼[かれ]が少[すこ]しの者[もの]たちとともに聖所[せいしょ]の境内[けいだい]に入[はい]ると、彼らは、アンティオコスが入[はい]るやいなや神殿[しんでん]を閉[と]ざした。"
  16: "そして天井[てんじょう]の隠[かく]し扉[とびら]を開[ひら]き、石[いし]を投[な]げつけて将軍[しょうぐん]を撃[う]ち、手足[てあし]を切[き]り分[わ]け、首[くび]を切[き]り落[お]として、外[そと]にいる者[もの]たちへ投[な]げ捨[す]てた。"
  17: "すべてにおいて、わたしたちの神[かみ]はほめたたえられる。神は不敬[ふけい]な者[もの]たちを引[ひ]き渡[わた]された。"
  18: "わたしたちは、ハスレウの月[つき]の二十五日[にじゅういつか]に神殿[しんでん]の清[きよ]めを祝[いわ]おうとしているので、あなたがたにも知[し]らせる必要[ひつよう]があると考[かんが]えた。あなたがたもまた、仮庵[かりいお]の祭[まつ]りと火[ひ]の祭りを祝うためである。あのとき、ネヘミヤは神殿と祭壇[さいだん]を建[た]て、犠牲[ぎせい]を捧[ささ]げた。"
  19: "というのは、わたしたちの父[ちち]たちがペルシアへ連[つ]れて行[い]かれたとき、その当時[とうじ]の敬虔[けいけん]な祭司[さいし]たちが祭壇の火[ひ]を取[と]って、ひそかに、水[みず]のない井戸[いど]のくぼみに隠[かく]し、そこに安全[あんぜん]に納[おさ]めたので、その場所[ばしょ]はだれにも知[し]られなかった。"
  20: "多[おお]くの年[とし]が過[す]ぎ、神[かみ]が良[よ]しとされたとき、ペルシアの王[おう]に遣[つか]わされたネヘミヤは、火[ひ]を隠[かく]した祭司[さいし]たちの子孫[しそん]たちを、その火[ひ]のところへ遣[つか]わした。彼らがわたしたちに、火[ひ]ではなく濃[こ]い水[みず]が見[み]つかったと告[つ]げたので、ネヘミヤは彼らに、それを汲[く]んで来[く]るように命[めい]じた。"
  21: "そして、犠牲[ぎせい]のためのものが運[はこ]ばれると、ネヘミヤは祭司[さいし]たちに、その水[みず]を薪[たきぎ]とその上[うえ]に載[の]せたものに振[ふ]りかけるように命[めい]じた。"
  22: "それがなされると、時[とき]が過[す]ぎ、それまで雲[くも]っていた太陽[たいよう]が輝[かがや]き出[だ]したとき、大[おお]きな炎[ほのお]が燃[も]え上[あ]がり、すべての人[ひと]が驚[おどろ]いた。"
  23: "犠牲[ぎせい]が燃[も]え尽[つ]きる間[あいだ]、祭司[さいし]たちは祈[いの]りをした。祭司たちもすべての者[もの]も、ヨナタンが唱[とな]え始[はじ]め、ほかの者たちはネヘミヤのときのように応[こた]えた。"
  24: "その祈[いの]りはこのようなものであった。「主[しゅ]よ、主よ、すべてのものの造[つく]り主[ぬし]である神[かみ]、恐[おそ]るべき強[つよ]い方[かた]、正[ただ]しく憐[あわ]れみ深[ふか]い方、ただひとりの王[おう]にして恵[めぐ]み深[ぶか]い方、"
  25: "ただひとりの供給者[きょうきゅうしゃ]、ただひとりの正[ただ]しい方、全能[ぜんのう]にして永遠[えいえん]なる方、イスラエルをすべての悪[あく]から救[すく]い出[だ]す方、父[ちち]たちを選[えら]ばれた者[もの]となし、聖[せい]なる者[もの]とされた方、"
  26: "あなたの民[たみ]イスラエルすべてのための犠牲[ぎせい]を受[う]け入[い]れ、あなたの受[う]け持[も]ちを守[まも]り、これを聖[せい]なるものとしてください。"
  27: "わたしたちの散[ち]らばりを集[あつ]め、異邦人[いほうじん]の間[あいだ]で奴隷[どれい]となっている者[もの]たちを自由[じゆう]にし、軽[かろ]んじられ憎[にく]まれている者[もの]たちに目[め]を留[と]め、異邦人が、あなたこそわたしたちの神[かみ]であることを知[し]るようにしてください。"
  28: "虐[しいた]げる者[もの]たちを罰[ばっ]し、傲慢[ごうまん]さをもって侮辱[ぶじょく]する者たちを砕[くだ]いてください。"
  29: "あなたの民[たみ]を、あなたの聖[せい]なる場所[ばしょ]に植[う]えてください。モーセが言[い]ったとおりに。」"
  30: "祭司[さいし]たちは讃美[さんび]の歌[うた]を歌[うた]っていた。"
  31: "犠牲[ぎせい]が燃[も]え尽[つ]きると、ネヘミヤは残[のこ]った水[みず]を大[おお]きな石[いし]の上[うえ]に注[そそ]ぐように命[めい]じた。"
  32: "それが行[おこな]われると、炎[ほのお]が燃[も]え上[あ]がり、祭壇[さいだん]から差[さ]し込[こ]んだ光[ひかり]によって消[き]えた。"
  33: "このことが明[あき]らかになり、火[ひ]を隠[かく]した祭司[さいし]たちが移[うつ]されたその場所[ばしょ]に水[みず]が現[あら]われ、それによってネヘミヤとその仲間[なかま]たちが犠牲[ぎせい]を清[きよ]めたことが、ペルシアの王[おう]に告[つ]げられると、"
  34: "王[おう]はその事[こと]を調[しら]べたうえで、その場所[ばしょ]を囲[かこ]み、聖[せい]なる場所とした。"
  35: "そして、王[おう]が好意[こうい]を示[しめ]した者[もの]たちには、彼[かれ]は多[おお]くのさまざまな品[しな]を受[う]け取[と]っては分[わ]け与[あた]えた。"
  36: "ネヘミヤとその仲間[なかま]たちは、この場所[ばしょ]を「ネフタル」と呼[よ]んだ。それは「清[きよ]め」と訳[やく]される。多[おお]くの人々には「ネフタイ」と呼[よ]ばれている。」"

notes:
  1: "Τοῖς ἀδελφοῖς τοῖς κατ' Αἴγυπτον Ιουδαίοις χαίρειν — «братьям Иудеям в Египте радоваться» (эпистолярное χαίρειν, передано 挨拶を送る); οἱ ἐν τῷ χώρᾳ τῆς Ιουδαίας — «сущие в стране Иудейской»; εἰρήνην ἀγαθήν — «мир благой»."
  2: "ἀγαθοποιήσαι… μνησθείη — оптативы (пожелание), в японском 〜ように; τῆς διαθήκης αὐτοῦ τῆς πρὸς Αβρααμ καὶ Ισαακ καὶ Ιακωβ τῶν δούλων αὐτοῦ τῶν πιστῶν — «завета Своего с Авраамом, Исааком и Иаковом, верными рабами Его»."
  3: "δῴη ὑμῖν καρδίαν πᾶσιν — «даст вам сердце всем»; εἰς τὸ σέβεσθαι αὐτόν — «чтобы чтить Его»; καρδίᾳ μεγάλῃ καὶ ψυχῇ βουλομένῃ — «сердцем великим и душою желающею»."
  4: "διανοίξαι τὴν καρδίαν ὑμῶν ἐν τῷ νόμῳ αὐτοῦ — «открыть сердце ваше в законе Его» (ἐν — «в»); εἰρήνην ποιήσαι — «мир да сотворит»."
  5: "ἐπακοῦσαι ὑμῶν τῶν δεήσεων — «услышать моления ваши»; καταλλαγείη ὑμῖν — «примирится с вами» (καταλλάσσω); μὴ ὑμᾶς ἐγκαταλίποι ἐν καιρῷ πονηρῷ — «не оставит вас во время злое»."
  6: "ὧδέ ἐσμεν προσευχόμενοι — «здесь мы молимся»: письмо переходит в настоящее время."
  7: "βασιλεύοντος Δημητρίου ἔτους ἑκατοστοῦ ἑξηκοστοῦ ἐνάτου — «в царствование Димитрия, в лето сто шестьдесят девятое» (датировка первого письма); ἐν τῇ ἀκμῇ τῇ ἐπελθούσῃ ἡμῖν — «в тесноте (остроте), постигшей нас» (ἀκμή — остриё, крайняя точка); ἀφ' οὗ ἀπέστη Ἰάσων — «с тех пор как отступил Иасон»."
  8: "ἐνεπύρισαν τὸν πυλῶνα — «сожгли притвор (ворота)»; ἐξέχεαν αἷμα ἀθῶον — «пролили кровь невинную»; σεμίδαλιν — «семидал» (пшеничная мука, 小麦粉[こむぎこ]の供[そな]え); ἐξήψαμεν τοὺς λύχνους — «возжгли светильники»; προεθήκαμεν τοὺς ἄρτους — «предложили хлебы»."
  9: "ἵνα ἄγητε τὰς ἡμέρας τῆς σκηνοπηγίας τοῦ Χασελευ μηνός — «чтобы вы праздновали дни кущей месяца Хаслева»; слав. «скинопигии» — то же слово. Год 188-й (ἔτους ἑκατοστοῦ ὀγδοηκοστοῦ ὀγδόου) в gr стоит в конце этого стиха, по csl перенесён в начало 1:10."
  10: "ἡ γερουσία — «старейшины» (герусия, 長老[ちょうろう]たち); Ἀριστοβούλῳ διδασκάλῳ Πτολεμαίου τοῦ βασιλέως — «Аристовулу, учителю царя Птолемея» (новое имя アリストブロス); ὄντι δὲ ἀπὸ τοῦ τῶν χριστῶν ἱερέων γένους — «происходящему из рода помазанных священников» (χριστός здесь — помазанник, не Христос); χαίρειν καὶ ὑγιαίνειν — «радоваться и здравствовать»."
  11: "ἐκ μεγάλων κινδύνων ὑπὸ τοῦ θεοῦ σεσῳσμένοι — «от великих опасностей Богом спасённые»; μεγάλως εὐχαριστοῦμεν — «весьма благодарим»; ὡς ἂν πρὸς βασιλέα παρατασσόμενοι — «как бы против царя ополчаясь»."
  12: "αὐτὸς γὰρ ἐξέβρασεν — «ибо Он изверг (выбросил)»; τοὺς παραταξαμένους ἐν τῇ ἁγίᾳ πόλει — «ополчившихся на город святой»: слав. «изведе ополчающихся на святый град»."
  13: "εἰς τὴν Περσίδα γενόμενος ὁ ἡγεμών — «придя в Персиду, вождь» (об Антиохе; 将軍[しょうぐん] — ἡγεμών); ἡ περὶ αὐτὸν ἀνυπόστατος δοκοῦσα εἶναι δύναμις — «бывшая при нём сила, казавшаяся непобедимой»; κατεκόπησαν ἐν τῷ τῆς Ναναίας ἱερῷ — «посечены в храме Нанайи (Нанеи)»; παραλογισμῷ χρησαμένων τῶν ἱερέων — «когда жрецы употребили обман» (παραλογισμός — обман, подлог)."
  14: "ὡς συνοικήσων αὐτῇ — «как бы желая сожительствовать с нею» (о богине Нанайе; в тексте 彼女[かのじょ]); χάριν τοῦ λαβεῖν τὰ χρήματα πλεῖονα εἰς φερνῆς λόγον — «чтобы взять денег больше в счёт приданого» (φερνή — приданое)."
  15: "προθέντων αὐτὰ τῶν ἱερέων — «когда жрецы выложили их (сокровища)»; εἰς τὸν περίβολον τοῦ τεμένους — «во двор святилища» (περίβολος — ограда, 境内[けいだい]); συγκλείσαντες τὸ ἱερόν, ὡς εἰσῆλθεν Ἀντίοχος — «заперев святилище, как только вошёл Антиох». Слав. «егда вниде антиох» относит эти слова к 1:16; следуем gr."
  16: "ἀνοίξαντες τὴν τοῦ φατνώματος κρυπτὴν θύραν — «открыв потаённую дверь свода» (φάτνωμα — потолок, свод); βάλλοντες πέτρους συνεκεραύνωσαν τὸν ἡγεμόνα — «бросая камни, поразили вождя»; μέλη ποιήσαντες — «рассекши на члены»; τὰς κεφαλὰς ἀφελόντες — «отрубив головы»."
  17: "κατὰ πάντα εὐλογητὸς ἡμῶν ὁ θεός — «во всём благословен Бог наш»; ὃς παρέδωκεν τοὺς ἀσεβήσαντας — «который предал нечествовавших»."
  18: "πέμπτῃ καὶ εἰκάδι τοῦ Χασελευ — «в двадцать пятый день Хаслева»; τὸν καθαρισμὸν τοῦ ἱεροῦ — «очищение храма»; σκηνοπηγίας καὶ τοῦ πυρός — «кущей и огня»: слав. «скинопигии и огня», в тексте 仮庵の祭りと火の祭り; ὅτε Νεεμιας ὁ οἰκοδομήσας τό τε ἱερὸν καὶ τὸ θυσιαστήριον ἀνήνεγκεν θυσίας — «когда Неемия, построивший храм и жертвенник, принёс жертвы»."
  19: "εἰς τὴν Περσικὴν ἤγοντο — «отведены были в Персию»; λαθραίως κατέκρυψαν ἐν κοιλώματι φρέατος τάξιν ἔχοντος ἄνυδρον — «тайно скрыли в углублении колодца, имевшего вид безводного»; κατησφαλίσαντο — «обезопасили, укрепили»."
  20: "διελθόντων ἐτῶν ἱκανῶν — «по прошествии многих лет»; ὅτε ἔδοξεν τῷ θεῷ — «когда угодно было Богу»; ὕδωρ παχύ — «вода густая»; ἀποβάψαντας φέρειν — «почерпнув, принести»: слав. относит это к 1:21 («повеле им черпати и принести»), следуем gr."
  21: "ἐπιρρᾶναι τῷ ὕδατι τά τε ξύλα καὶ τὰ ἐπικείμενα — «окропить водою дрова и лежащее на них» (ἐπιρραίνω — кропить)."
  22: "χρόνος διῆλθεν — «прошло время»; ὁ ἥλιος ἀνέλαμψεν πρότερον ἐπινεφὴς ὤν — «солнце просияло, прежде быв облачным»; ἀνήφθη πυρὰ μεγάλη — «возжёгся огонь великий» (πυρά — костёр, пламя)."
  23: "δαπανωμένης τῆς θυσίας — «пока истреблялась жертва»; καταρχομένου Ιωναθου — «при начинании Ионафана» (он запевал); τῶν δὲ λοιπῶν ἐπιφωνούντων ὡς Νεεμιου — «прочие же восклицали (отвечали), как при Неемии»."
  24: "ἦν δὲ ἡ προσευχὴ τὸν τρόπον ἔχουσα τοῦτον — «молитва же имела такой образ»; ὁ πάντων κτίστης — «всех Творец»; ὁ φοβερὸς καὶ ἰσχυρὸς καὶ δίκαιος καὶ ἐλεήμων — «страшный и сильный, и праведный и милостивый»; ὁ μόνος βασιλεὺς καὶ χρηστός — «единственный Царь и благой»."
  25: "ὁ μόνος χορηγός — «единственный податель» (χορηγός — снабдитель, 供給者[きょうきゅうしゃ]); ὁ μόνος δίκαιος καὶ παντοκράτωρ καὶ αἰώνιος — «единственный праведный и вседержитель и вечный»; ὁ διασῴζων τὸν Ισραηλ ἐκ παντὸς κακοῦ — «спасающий Израиля от всякого зла»; ποιήσας τοὺς πατέρας ἐκλεκτοὺς καὶ ἁγιάσας αὐτούς — «соделавший отцов избранными и освятивший их»."
  26: "πρόσδεξαι τὴν θυσίαν — «приими жертву»; ὑπὲρ παντὸς τοῦ λαοῦ σου Ισραηλ — «за весь народ Твой, Израиля»; διαφύλαξον τὴν μερίδα σου — «сохрани часть (удел) Твою»; καθαγίασον — «освяти» (καθαγιάζω)."
  27: "ἐπισυνάγαγε τὴν διασπορὰν ἡμῶν — «собери рассеяние наше»; ἐλευθέρωσον τοὺς δουλεύοντας ἐν τοῖς ἔθνεσιν — «освободи служащих (порабощённых) у язычников»; τοὺς ἐξουθενημένους καὶ βδελυκτοὺς ἔπιδε — «на уничиженных и мерзких призри»; γνώτωσαν τὰ ἔθνη ὅτι σὺ εἶ ὁ θεὸς ἡμῶν — «да познают язычники, что Ты Бог наш»."
  28: "βασάνισον τοὺς καταδυναστεύοντας — «помучай (покарай) угнетающих»; ἐξυβρίζοντας ἐν ὑπερηφανίᾳ — «обижающих в надмении» (ὑπερηφανία — гордость)."
  29: "καταφύτευσον τὸν λαόν σου εἰς τὸν τόπον τὸν ἅγιόν σου — «насади народ Твой на месте святом Твоём»; καθὼς εἶπεν Μωϋσῆς — «как сказал Моисей». Здесь молитва закрывается."
  30: "οἱ ἱερεῖς ἐπέψαλλον τοὺς ὕμνους — «священники воспевали гимны» (ἐπάδω/ἐπιψάλλω — петь при жертве)."
  31: "ἀνηλώθη τὰ τῆς θυσίας — «истреблено было жертвенное»; τὸ περιλειπόμενον ὕδωρ — «оставшаяся вода»; λίθους μείζονας καταχεῖν — «на большие камни вылить» (καταχέω)."
  32: "φλὸξ ἀνήφθη — «пламя возжглось»; τοῦ ἀπὸ τοῦ θυσιαστηρίου ἀντιλάμψαντος φωτὸς ἐδαπανήθη — «от воссиявшего от жертвенника света оно (пламя) истреблено»: слав. «и от олтаря облиставшу свету, сгоре»."
  33: "διηγγέλη τῷ βασιλεῖ τῶν Περσῶν — «возвещено было царю Персов»; εἰς τὸν τόπον, οὗ τὸ πῦρ ἔκρυψαν οἱ μεταχθέντες ἱερεῖς, τὸ ὕδωρ ἐφάνη — «на месте, где скрыли огонь переселенные священники, явилась вода»; ἥγνισαν τὰ τῆς θυσίας — «очистили жертвенное» (ἁγνίζω)."
  34: "περιφράξας δὲ ὁ βασιλεὺς ἱερὸν ἐποίησεν — «царь, оградив, сделал священным»; δοκιμάσας τὸ πρᾶγμα — «исследовав дело». Слав. добавляет в скобках «(место то)» — редакционное, не перенесено."
  35: "οἷς ἐχαρίζετο ὁ βασιλεύς — «кому царь даровал (благоволил)»; πολλὰ διάφορα ἐλάμβανεν καὶ μετεδίδου — «многое разное получал и раздавал» (διαφέρω τὰ — разные вещи, 品[しな])."
  36: "προσηγόρευσαν… τοῦτο νεφθαρ — «прозвали это нефтар»; ὃ διερμηνεύεται καθαρισμός — «что переводится „очищение“»; καλεῖται δὲ παρὰ τοῖς πολλοῖς νεφθαι — «у многих же называется нефтай». Имена переданы транслитерацией: ネフタル, ネフタイ."
