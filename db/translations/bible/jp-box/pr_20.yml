verses:
  1: "ぶどう酒[しゅ]は放縦[ほうじゅう]であり、酔[よ]いは乱暴[らんぼう]である。それに身[み]を任[まか]せる者[もの]は、だれも知恵[ちえ]ある者[もの]にはならない。"
  2: "王[おう]の脅[おど]しは獅子[しし]の憤[いきどお]りである。これを怒[いか]らせ、これと交[まじ]わる者[もの]は、自分[じぶん]の魂[たましい]に罪[つみ]を犯[おか]す。"
  3: "争[あらそ]いを避[さ]けるのは、人[ひと]の名誉[めいよ]である。しかし、愚[おろ]かな者[もの]はだれでも、これに巻[ま]き込[こ]まれる。"
  4: "責[せ]められても、怠[なま]ける者[もの]は恥[は]じない。刈[か]り入[い]れのとき穀物[こくもつ]を借[か]りる者[もの]も、同[おな]じである。"
  5: "人[ひと]の心[こころ]の計画[けいかく]は深[ふか]い水[みず]のようである。しかし、思慮[しりょ]ある人[ひと]はそれを汲[く]み出[だ]す。"
  6: "人[ひと]は偉大[いだい]なものであり、あわれみ深[ふか]い人[ひと]は尊[とうと]い。しかし、忠実[ちゅうじつ]な人[ひと]を見[み]つけるのは、難[むずか]しいわざである。"
  7: "正[ただ]しさのうちに傷[きず]なく生[い]きる者[もの]は、その子[こ]らを幸[さいわ]いな者[もの]として残[のこ]す。"
  8: "正[ただ]しい王[おう]が王座[おうざ]に着[つ]くと、悪[あ]しきものは何[なに]一[ひと]つ、彼[かれ]の目[め]の前[まえ]に立[た]ち向[む]かわない。"
  9: "だれが、自分[じぶん]の心[こころ]が清[きよ]いと誇[ほこ]ることができようか。だれが、自分[じぶん]は罪[つみ]から清[きよ]いと言[い]い切[き]れるだろうか。"
  10: "大[おお]きな分銅[ふんどう]と小[ちい]さな分銅[ふんどう]、二[ふた]つの升[ます]は、その両方[りょうほう]とも主[しゅ]の前[まえ]に汚[けが]れている。"
  11: "これを行[おこな]う者[もの]は、そのわざのゆえに足[あし]を取[と]られる。敬虔[けいけん]な人[ひと]とともにいる若[わか]い者[もの]の道[みち]は、まっすぐである。"
  12: "聞[き]く耳[みみ]と見[み]る目[め]、その両方[りょうほう]とも主[しゅ]のわざである。"
  13: "人[ひと]をそしることを愛[あい]してはならない。高[たか]ぶらないためである。あなたの目[め]を開[ひら]け。パンに満[み]ち足[た]りよ。"
  14: "「悪[わる]い、悪[わる]い」と買[か]う者[もの]は言[い]い、去[さ]ってから、それを誇[ほこ]る。"
  15: "金[きん]と多[おお]くの貴重[きちょう]な石[いし]がある。しかし、尊[とうと]い器[うつわ]は、思慮[しりょ]ある唇[くちびる]である。"
  16: "彼[かれ]の上着[うわぎ]を取[と]れ。彼が他人[たにん]の保証人[ほしょうにん]になったからである。他人[たにん]のために、彼から担保[たんぽ]を取[と]れ。"
  17: "人[ひと]には偽[いつわ]りのパンが甘[あま]い。しかし後[のち]には、その口[くち]が石[いし]で満[み]たされる。"
  18: "計画[けいかく]は相談[そうだん]によって整[ととの]えられる。そして、治[おさ]めのうちに戦[たたか]いをする。"
  19: "秘密[ひみつ]を明[あ]かす者[もの]は、欺[あざむ]きのうちに歩[あゆ]む。唇[くちびる]で誘[いざな]う者[もの]と交[まじ]わってはならない。"
  20: "父[ちち]や母[はは]をののしる者[もの]の灯[ともしび]は消[き]え、その目[め]の瞳[ひとみ]は闇[やみ]を見[み]る。"
  21: "初[はじ]めに急[いそ]いで得[え]た分[ぶん]け前[まえ]は、終[お]わりに祝福[しゅくふく]されない。"
  22: "「敵[てき]に仕返[しかえ]しをする」と言[い]ってはならない。主[しゅ]を待[ま]ち望[のぞ]め。主があなたを助[たす]けてくださるためである。"
  23: "二[ふた]つの分銅[ふんどう]は主[しゅ]に忌[い]むべきもの。偽[いつわ]りの秤[はかり]も、主[しゅ]の前[まえ]に良[よ]いものではない。"
  24: "人[ひと]の歩[あゆ]みは主[しゅ]によってまっすぐにされる。しかし、死[し]すべき者[もの]が、どうして自分[じぶん]の道[みち]を悟[さと]ることができようか。"
  25: "自分[じぶん]のものの一部[いちぶ]を急[いそ]いで聖[せい]なるものとするのは、人[ひと]にとって罠[わな]である。誓[ちか]いをした後[あと]で、後悔[こうかい]することになるからである。"
  26: "知恵[ちえ]ある王[おう]は不敬[ふけい]な者[もの]をふるい分[わ]け、彼[かれ]らの上[うえ]に車輪[しゃりん]を置[お]く。"
  27: "主[しゅ]の光[ひかり]は人[ひと]の息[いき]であり、それは腹[はら]の奥[おく]の部屋[へや]を探[さぐ]り調[しら]べる。"
  28: "あわれみと真理[しんり]は王[おう]を守[まも]る。そして、正[ただ]しさのうちに、その王座[おうざ]を取[と]り囲[かこ]む。"
  29: "若[わか]い者[もの]の飾[かざ]りは知恵[ちえ]であり、老人[ろうじん]の栄光[えいこう]は白髪[しらが]である。"
  30: "打[う]ち身[み]と砕[くだ]かれた傷[きず]は悪[あく]をなす者[もの]に降[ふ]りかかり、むちの打撃[だげき]は腹[はら]の奥[おく]に及[およ]ぶ。"

notes:
  1: "ἄκολαστον οἶνος καὶ ὑβριστικὸν μέθη — «вино необузданно и пьянство буйно» (ἄκολαστος — «распущенный, не знающий удержу»; ὑβριστικός — «наглый, буйный»). Слав. «Невинно вино, укоризненно же пиянство» передаёт иначе: «невинно» — вероятно, ошибка или иное чтение; в LXX вино названо необузданным. συμμειγνύμενος — «смешивающийся, общающийся с ним»; слав. «пребываяй в нем»."
  2: "ἀπειλὴ βασιλέως θυμοῦ λέοντος — «угроза царя — ярость льва»: родительный качества, без глагола; в яп. связка である. Слав. добавляет «и примешаяйся ему» (приобщающийся к нему) — этого нет в LXX, по паритету внесено в основной текст (これと交わる者), здесь отмечено. ἁμαρτάνει εἰς τὴν ἑαυτοῦ ψυχήν — «грешит против своей души»."
  3: "δόξα ἀνδρὶ ἀποστρέφεσθαι λοιδορίας — «слава человеку — уклоняться от брани/поношения» (λοιδορία — «брань, поношение»; слав. «досаждение»). συμπλέκεται — «впутывается, сплетается» (συμπλέκω); слав. «соплетается»."
  4: "ὀνειδιζόμενος ὀκνηρός — «порицаемый ленивый»: причастие с артиклем, подлежащее, сказуемое οὐκ αἰσχύνεται. δανιζόμενος σῖτον ἐν ἀμήτῳ — «занимающий пшеницу во время жатвы», т. е. просящий взаймы в самый урожай (ἀμητός — жатва); слав. «заемляй пшеницу в жатву». Синодальный (МТ) говорит о ленивце, не пашущем зимой, — иное чтение, не внесено."
  5: "ὕδωρ βαθὺ βουλὴ ἐν καρδίᾳ ἀνδρός — «глубокие воды — совет в сердце человека» (βουλή — «совет, замысел»). ἐξαντλήσει — «вычерпает» (ἐξαντλέω); слав. «изчерплет ю». Смысл: разумный делает явным скрытое."
  6: "μέγα ἄνθρωπος καὶ τίμιον ἀνὴρ ἐλεήμων — «велик человек и драгоценен муж милостивый»: оба прилагательных — именное сказуемое, без глагола; слав. «Велика вещь человек». ἄνδρα δὲ πιστὸν ἔργον εὑρεῖν — «мужа же верного — дело найти»: ἔργον («дело, труд») значит трудную задачу, отсюда 難しいわざ."
  7: "ὃς ἀναστρέφεται ἄμωμος ἐν δικαιοσύνῃ — «кто обращается непорочно в правде» (ἀναστρέφομαι — «жить, вести себя»; ἄμωμος — «непорочный»). μακαρίους τοὺς παῖδας αὐτοῦ καταλείψει — «блаженными детей своих оставит»; слав. «блажены оставит дети своя»."
  8: "ὅταν βασιλεὺς δίκαιος καθίσῃ ἐπὶ θρόνου — «когда праведный царь сядет на престоле». οὐκ ἐναντιοῦται ἐν ὀφθαλμοῖς αὐτοῦ πᾶν πονηρόν — «не противостанет пред очами его ничто злое» (ἐναντιόομαι — «противиться»); слав. «не противится пред очима его ничтоже лукаво»."
  9: "τίς καυχήσεται ἁγνὴν ἔχειν τὴν καρδίαν; ἢ τίς παρρησιάσεται καθαρὸς εἶναι ἀπὸ ἁμαρτιῶν; — «кто похвалится иметь чистое сердце? или кто дерзнёт быть чистым от грехов?» (καυχάομαι — «хвалиться»; παρρησιάζομαι — «говорить с дерзновением»). Вопрос — без кавычек, это авторское изречение. ВНИМАНИЕ: в gr-lxx-byz к стиху дописан подстих 9a (κακολογοῦντος πατέρα ἢ μητέρα σβεσθήσεται λαμπτήρ… — «злословящему отца или мать угаснет светильник…»); это текст 20:20, смещённый в 20:9, здесь он не переведён, а стоит в нашем ст. 20."
  10: "В gr-lxx-byz на месте стиха стоит «.» — дефект модуля; стих переведён по csl-ru. Греческий текст уцелел внутри ст. 22 (в модуле он дописан к 20:22 с номерами 10–13): στάθμιον μέγα καὶ μικρὸν καὶ μέτρα δισσά, ἀκάθαρτα ἐνώπιον κυρίου καὶ ἀμφότερα — «вес большой и малый и меры двоякие, нечисты пред Господом и то и другое»; по нему сверен перевод. στάθμιον — 分銅, μέτρον — 升. 〔…〕 не ставятся: это пробел модуля, а не церковное добавление."
  11: "В gr-lxx-byz «.»; переведено по csl-ru. Греческий текст (внутри 20:22): καὶ ὁ ποιῶν αὐτὰ ἐν τοῖς ἐπιτηδεύμασιν αὐτοῦ συμποδισθήσεται — «и делающий это в занятиях своих запутается» (ἐπιτήδευμα — «занятие»; συμποδίζω — «опутывать ноги»); вторая половина: νεανίσκος μετὰ ὁσίου, καὶ εὐθεῖα ἡ ὁδὸς αὐτοῦ — «юноша с преподобным, и прям путь его» (ὅσιος — «благочестивый»). Смысл второй половины тёмен, передано буквально."
  12: "В gr-lxx-byz «.»; по csl-ru; греческий (внутри 20:22): οὖς ἀκούει καὶ ὀφθαλμὸς ὁρᾷ· κυρίου ἔργα καὶ ἀμφότερα — «ухо слышит и око видит: Господни дела и то и другое»."
  13: "В gr-lxx-byz «.»; по csl-ru; греческий (внутри 20:22): μὴ ἀγάπα καταλαλεῖν, ἵνα μὴ ἐξαρθῇς· διάνοιξον τοὺς ὀφθαλμούς σου καὶ ἐμπλήσθητι ἄρτων — «не люби злословить, чтобы не возвыситься; открой глаза твои и насыться хлебов» (καταλαλέω — «злословить, клеветать»; ἐξαίρω — «поднимать, возвышать»). Синодальный (МТ) говорит о сне и лени — иное чтение, не внесено."
  14: "В gr-lxx-byz «.»; переведено по csl-ru: «Зло, зло, речет стяжаваяй, и отшед тогда похвалится». Ту же поговорку передаёт Синодальный (МТ): «Дурно, дурно», говорит покупатель…, так что смысл подтверждается и им, но источник — csl. Слова покупателя — прямая речь, 「…」. ἀνούμενος — «покупающий»; стяжаваяй — «приобретающий»."
  15: "В gr-lxx-byz «.»; по csl-ru: «Есть злато и множество камений драгих, сосуд честен устне разумны». σύνεσις — «разумение, понимание»; 思慮ある唇 — «уста разумные» (χείλη)."
  16: "В gr-lxx-byz «.»; по csl-ru: «Возми ризу его, яко испоручник бысть чуждыя, и за чуждую возми залог от него». ἔγγυος — «поручитель» (испоручник), ἐνέχυρον — «залог». Слав. «за чуждую» стоит в женском роде; в переводе оставлено нейтральное 他人のために, потому что греческого текста нет и род неясен. Синодальный (МТ) даёт «за стороннего»."
  17: "В gr-lxx-byz «.»; по csl-ru: «Сладок есть человеку хлеб лжи, но потом исполнятся уста его камения». ἄρτος ψευδής — «хлеб лжи», т. е. пища, добытая неправдой; «камение» — камешки вместо хлеба. Греческого текста в модуле нет."
  18: "В gr-lxx-byz «.»; по csl-ru: «Помышление в совете уготовится, в правлении же творит брань». Смысл тёмный: замысел созревает в совещании, а в ведении (войны) совершает брань; передано буквально. Синодальный (МТ): «предприятия получают твердость через совещание, и по совещании веди войну»."
  19: "В gr-lxx-byz «.»; по csl-ru: «Открываяй тайну ходит лестию: и прельщающему устнами своими не примешайся». δόλος — 欺き; 唇で誘う者 — «обольщающий устами» (ἀπατάω — «обманывать»)."
  20: "В gr-lxx-byz «.»; переведено по csl 20:20: «Злословящему отца или матерь угаснет светилник, зеницы же очес его узрят тму». Это тот самый текст, который в gr-lxx-byz смещён в подстих 9a при ст. 9 (см. notes 9); здесь он поставлен на своё место по нумерации csl. κακολογέω — «злословить»; λαμπτήρ — 灯; ζόφος — 闇."
  21: "μερὶς ἐπισπουδαζομένη ἐν πρώτοις — «часть, поспешно захваченная в начале» (μερίς — «доля, часть»; ἐπισπουδάζω — «торопить, усердно добиваться»). ἐν τοῖς τελευταίοις οὐκ εὐλογηθήσεται — «в последних не благословится»; слав. так же. Синодальный: «наследство, поспешно захваченное вначале, не благословится впоследствии»."
  22: "μὴ εἴπῃς Τείσομαι τὸν ἐχθρόν — «не скажи: отомщу врагу» (τείσομαι, буд. от τίνω — «воздавать»); это прямая речь, 「…」. ἀλλὰ ὑπόμεινον τὸν κύριον, ἵνα σοι βοηθήσῃ — «но потерпи Господа, чтобы Он помог тебе». ВНИМАНИЕ: в gr-lxx-byz к этому стиху дописан греческий текст ст. 10–13 (στάθμιον μέγα…, καὶ ὁ ποιῶν αὐτά…, οὖς ἀκούει…, μὴ ἀγάπα καταλαλεῖν…); он переведён в ст. 10–13 и здесь не повторяется."
  23: "βδέλυγμα κυρίῳ δισσὸν στάθμιον — «мерзость Господу двоякий вес» (βδέλυγμα — «мерзость»); ζυγὸς δόλιος — «весы лживые» (ζυγός — 秤), οὐ καλὸν ἐνώπιον αὐτοῦ — «не добро пред Ним»."
  24: "παρὰ κυρίου εὐθύνεται τὰ διαβήματα ἀνδρί — «от Господа направляются шаги человеку» (εὐθύνω — «выпрямлять, направлять»; διάβημα — «шаг»). θνητὸς δὲ πῶς ἂν νοήσαι τὰς ὁδοὺς αὐτοῦ; — «смертный же как уразумеет пути свои?» (θνητός — «смертный»; νοέω — «понимать»)."
  25: "παγὶς ἀνδρὶ ταχύ τι τῶν ἰδίων ἁγιᾶσαι — «сеть человеку — поспешно освятить нечто из своего» (παγίς — 罠; ἁγιάζω — «посвящать»). μετὰ γὰρ τὸ εὔξασθαι μετανοεῖν γίνεται — «ибо после обета бывает раскаяние» (εὔχομαι — «давать обет»; μετανοέω — «раскаиваться»)."
  26: "λικμήτωρ ἀσεβῶν βασιλεὺς σοφός — «веятель нечестивых — царь мудрый» (λικμήτωρ — «веяльщик», от λικμάω — «веять»); ἐπιβαλεῖ αὐτοῖς τροχόν — «наложит на них колесо» (τροχός — 車輪): образ молотьбы или казни, оставлен буквально."
  27: "φῶς κυρίου πνοὴ ἀνθρώπων — «свет Господень — дыхание людей» (πνοή — «дыхание»). ὃς ἐρευνᾷ ταμεῖα κοιλίας — «которое исследует хранилища чрева» (ἐρευνάω — «разыскивать»; ταμεῖον — «кладовая, хранилище»; κοιλία — «чрево»)."
  28: "ἐλεημοσύνη καὶ ἀλήθεια φυλακὴ βασιλεῖ — «милость и истина — охрана царю» (φυλακή — «стража, охрана»). περικυκλώσουσιν ἐν δικαιοσύνῃ τὸν θρόνον αὐτοῦ — «окружат в правде престол его» (περικυκλόω — «окружать»)."
  29: "κόσμος νεανίαις σοφία — «украшение юношам — мудрость» (κόσμος — «украшение, наряд»); δόξα δὲ πρεσβυτέρων πολιαί — «слава же старцев — седины» (πολιά — «седая голова»); слав. «Лепота юным премудрость»."
  30: "ὑπώπια καὶ συντρίμματα συναντᾷ κακοῖς — «подбитые глаза и сокрушения встречают злых» (ὑπώπιον — «синяк под глазом»; σύντριμμα — «сокрушение, перелом»; сказуемое в ед. ч. при средн. мн.). πληγαὶ δὲ εἰς ταμεῖα κοιλίας — «удары же — в хранилища чрева», т. е. удары доходят до внутренностей."
