# jp-box, Притчи, глава 20. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный, с МТ) — только для
# понимания, не источник. jp-joc для Притчей гл. 20 нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 20: вино и царь (1–2), раздор и лень (3–4), совет в сердце (5), верность (6),
# непорочность (7), суд царя (8), чистота сердца (9), вес и мера (10), путь юноши (11),
# ухо и око (12), клевета (13), торговля (14–17), совет и тайна (18–19), злословие
# родителей (20), поспешное наследство (21), отмщение (22), весы (23), шаги (24),
# обет (25), царь-веятель (26), свет Господень (27), милость и истина (28),
# юность и старость (29), раны (30).
# Речь: слова покупателя (14), «отомщу врагу» (22) — 「…」; остальное — авторские изречения.
# Нумерация по gr: 30 стихов.
# ВНИМАНИЕ (дефект модуля): 20:10–20 стоят в gr-lxx-byz как «.». В 20:9 после вопроса
# дописан подстих 9a («злословящему отца или мать угаснет светильник…») — это текст
# csl 20:20. Переведено так: 20:9 — только вопрос, 9a не включён; 20:10–20 — по csl-ru
# (в gr текста нет), 20:20 — по csl 20:20. Греческий текст ст. 10–13 уцелел внутри
# gr 20:22 (дописан к стиху с номерами 10–13) и использован как контроль к csl.
# 〔…〕 нет: пропуск модуля — не церковное добавление; сносок ⟨…⟩ нет.
# Имена — транслитерация греческого (LXX).

