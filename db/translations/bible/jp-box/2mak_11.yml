verses:
  1: "それからほんの少[すこ]し後[のち]、王[おう]の後見[こうけん]で親族[しんぞく]、政務[せいむ]をつかさどるリュシアスは、起[お]こったことをひどく重[おも]く受[う]け止[と]めて、"
  2: "八万[はちまん]人[にん]ほどと全[すべ]ての騎兵[きへい]を集[あつ]め、ユダヤ人[じん]に向[む]かって進[すす]んだ。都[みやこ]をギリシア人[じん]の住[す]みかとし、"
  3: "神殿[しんでん]には税[ぜい]を課[か]し、ほかの民[たみ]々[たみ]の聖所[せいしょ]と同[おな]じようにし、大祭司[だいさいし]の職[しょく]を毎年[まいとし]売[う]り物[もの]にしようと考[かんが]えていたのである。"
  4: "神[かみ]の力[ちから]をまったく顧[かえり]みず、歩兵[ほへい]の数万[すうまん]、騎兵[きへい]の数千[すうせん]、それに八十頭[はちじゅうとう]の象[ぞう]に頼[たよ]りきっていた。"
  5: "ユダヤに入[はい]り、エルサレムからおよそ五[ご]スタディオン離[はな]れた堅固[けんご]な町[まち]ベフスラに近[ちか]づくと、彼[かれ]はこれを攻[せ]め迫[せま]った。"
  6: "マッカバイオスとその仲間[なかま]たちは、彼[かれ]が要塞[ようさい]を包囲[ほうい]していることを知[し]ると、民[たみ]とともに泣[な]きながら主[しゅ]に願[ねが]い、イスラエルの救[すく]いのために良[よ]い天使[てんし]を遣[つか]わしてくださるようにと祈[いの]った。"
  7: "マッカバイオス自身[じしん]がまず武器[ぶき]を取[と]り、ほかの者[もの]たちに、自分[じぶん]とともに危険[きけん]を冒[おか]して兄弟[きょうだい]を助[たす]けるように勧[すす]めた。彼らは心[こころ]を合[あ]わせて意欲[いよく]をもって出[で]て行[い]った。"
  8: "彼らがまだエルサレムの近[ちか]くにいたとき、白[しろ]い衣[ころも]を着[き]た騎手[きしゅ]が彼らの先頭[せんとう]に立[た]ち、金[きん]の武具[ぶぐ]を振[ふ]りかざして現[あら]われた。"
  9: "彼らは皆[みな]ともに、あわれみ深[ふか]い神[かみ]をほめたたえ、魂[たましい]に力[ちから]を受[う]けた。人[ひと]だけでなく、いちばん荒々[あらあら]しい獣[けもの]や鉄[てつ]の城壁[じょうへき]さえ打[う]ち破[やぶ]る用意[ようい]ができていた。"
  10: "彼らは軍[ぐん]を整[ととの]えて進[すす]み、主[しゅ]があわれんでくださったので、天[てん]からの戦友[せんゆう]を伴[ともな]っていた。"
  11: "彼らは獅子[しし]のように敵[てき]に飛[と]びかかり、一万千[いちまんせん]の歩兵[ほへい]と千六百[せんろっぴゃく]の騎兵[きへい]を倒[たお]し、残[のこ]りの者[もの]をすべて逃[に]げ散[ち]らせた。"
  12: "その多[おお]くは傷[きず]ついて裸[はだか]のまま逃[に]げ延[の]びた。リュシアス自身[じしん]も恥[はじ]ずかしい逃[に]げ方[かた]でのがれた。"
  13: "しかし彼[かれ]は愚[おろ]かではなかった。自分[じぶん]に起[お]こった敗北[はいぼく]を思[おも]い返[かえ]し、ヘブライ人[じん]が無敵[むてき]であるのは全能[ぜんのう]の神[かみ]が彼らの味方[みかた]をしてくださるからだと悟[さと]って、"
  14: "彼らに使者[ししゃ]を遣[つか]わして、あらゆる正[ただ]しい条件[じょうけん]で和解[わかい]するようにと説[と]き、王[おう]も彼らの友人[ゆうじん]になるように説得[せっとく]すると伝[つた]えた。"
  15: "マッカバイオスは、役[やく]に立[た]つことを考[かんが]えて、リュシアスが申[もう]し出[で]たすべてに同意[どうい]した。というのは、マッカバイオスがユダヤ人[じん]についてリュシアスに書面[しょめん]で提[てい]示[じ]したことには、すべて王[おう]が同意[どうい]したからである。"
  16: "ユダヤ人[じん]に書[か]き送[おく]られた手紙[てがみ]は、リュシアスのものは次[つぎ]のようなものだった。「リュシアスからユダヤ人[じん]の民[たみ]に、挨拶[あいさつ]を送[おく]る。"
  17: "あなたがたが遣[つか]わしたヨハネとアベサロムは、以下[いか]に記[しる]す文書[ぶんしょ]を届[とど]け、その中[なか]に示[しめ]されたことについて願[ねが]い出[で]た。"
  18: "そこで、王[おう]に申[もう]し上[あ]げるべきことはすべえて伝[つた]え、認[みと]められることは認[みと]めた。"
  19: "もしあなたがたが政務[せいむ]に好意[こうい]を保[たも]つなら、これからも善[ぜん]いことをもたらす者[もの]となろうと努[つと]める。"
  20: "これらのことと細部[さいぶ]については、あなたがたのもとへ遣[つか]わす者[もの]と、わたしのもとから遣[つか]わす者[もの]とに、あなたがたと話[はな]すように命[めい]じておいた。"
  21: "健康[けんこう]を祈[いの]る。第百四十八年[だいひゃくよんじゅうはちねん]、ディオスコリンフィオスの月[つき]の二十四日[にじゅうよっか]。」"
  22: "王[おう]の手紙[てがみ]は次[つぎ]のようなものだった。「王[おう]アンティオコスから兄弟[きょうだい]リュシアスに、挨拶[あいさつ]を送[おく]る。"
  23: "父[ちち]が神[かみ]々[がみ]のもとへ移[うつ]られたので、わたしたちは、王国[おうこく]の者[もの]たちが騒[さわ]ぎなく、それぞれの事[こと]に気[き]を配[くば]ってくれることを願[ねが]っている。"
  24: "わたしたちは、ユダヤ人[じん]が父[ちち]のギリシア風[ふう]への移行[いこう]に同意[どうい]せず、むしろ自分[じぶん]たちの習慣[しゅうかん]を選[えら]び、自分[じぶん]たちの法[ほう]を許[ゆる]してくれるように願[ねが]っていると聞[き]いた。"
  25: "そこでわたしたちは、この民[たみ]もまた騒[さわ]ぎなくあることを望[のぞ]み、その神殿[しんでん]を彼らに返[かえ]し、先祖[せんぞ]たちの慣習[かんしゅう]に従[したが]って暮[く]らせるようにと決[き]めた。"
  26: "だから、あなたは彼らに使者[ししゃ]を遣[つか]わして、手[て]を差[さ]し伸[の]べ、わたしたちの考[かんが]えを知[し]った彼らが心[こころ]強[づよ]く、喜[よろこ]んで自分[じぶん]たちの事[こと]に当[あ]たるようにさせなさい。」"
  27: "民[たみ]に宛[あ]てた王[おう]の手紙[てがみ]は、次[つぎ]のようなものだった。「王[おう]アンティオコスから、ユダヤ人[じん]の長老[ちょうろう]たちとほかのユダヤ人[じん]たちに、挨拶[あいさつ]を送[おく]る。"
  28: "あなたがたが健康[けんこう]であるなら、それはわたしたちの願[ねが]いどおりである。わたしたちもまた健康[けんこう]である。"
  29: "メネラオスが、あなたがたは下[お]りて自分[じぶん]たちの者[もの]のもとへ行[い]きたいと述[の]べたと、わたしたちに知[し]らせてきた。"
  30: "そこで、向[む]こうへ下[くだ]って行[い]く者[もの]には、クサンフィコスの月[つき]の三十日[さんじゅうにち]まで、安全[あんぜん]とともに手[て]を差[さ]し伸[の]べる。"
  31: "ユダヤ人[じん]は以前[いぜん]と同[おな]じように、自分[じぶん]の食[た]べ物[もの]と律法[りっぽう]を用[もち]いることができる。そして、知[し]らずに行[おこな]ったことについては、だれもいかなる点[てん]でも煩[わずら]わされない。"
  32: "わたしはメネラオスも遣[つか]わした。彼[かれ]はあなたがたを慰[なぐさ]める者[もの]である。"
  33: "健康[けんこう]を祈[いの]る。第百四十八年[だいひゃくよんじゅうはちねん]、クサンフィコスの月[つき]の十五日[じゅうごにち]。」"
  34: "ローマ人[じん]もまた、彼らに次[つぎ]のような手紙[てがみ]を送[おく]った。「ローマ人[じん]の長老[ちょうろう]クウィントゥス・メンミウスとティトゥス・マニウスから、ユダヤ人[じん]の民[たみ]に、挨拶[あいさつ]を送[おく]る。"
  35: "王[おう]の親族[しんぞく]リュシアスがあなたがたに譲[ゆず]ったことについては、わたしたちも同意[どうい]する。"
  36: "そのうち、王[おう]に申[もう]し上[あ]げるべきと彼[かれ]が判断[はんだん]したことについては、すぐにだれかを遣[つか]わして、そのことをよく調[しら]べたうえで、わたしたちがあなたがたのために然[しか]るべきことをするようにさせなさい。わたしたちはアンティオキアへ向[む]かっている。"
  37: "だから、急[いそ]いでだれかをお遣[つか]わしなさい。わたしたちもまた、あなたがたがどういう立場[たちば]にあるのかを知[し]るためである。"
  38: "健康[けんこう]を祈[いの]る。第百四十八年[だいひゃくよんじゅうはちねん]、クサンフィコスの月[つき]の十五日[じゅうごにち]。」"

notes:
  1: "Μετ᾽ ὀλίγον… χρονίσκον — «спустя малое время»; ἐπίτροπος τοῦ βασιλέως — «опекун царя» (後見[こうけん]); συγγενὴς καὶ ἐπὶ τῶν πραγμάτων — «родственник и поставленный над делами»; λίαν βαρέως φέρων ἐπὶ τοῖς γεγονόσι — «весьма тяжело перенося происшедшее»."
  2: "περὶ τὰς ὀκτὼ μυριάδας — «около восьмидесяти тысяч»; τὴν ἵππον ἅπασαν — «всю конницу»; Ἕλλησιν οἰκητήριον ποιήσειν — «сделать жилищем эллинов»."
  3: "τὸ ἱερὸν ἀργυρολόγητον — «храм сделать собирающим серебро (обложенным налогом)» (ἀργυρολόγητος); πρατὴν κατ᾽ ἔτος τὴν ἀρχιερωσύνην — «ежегодно продажное первосвященство» (πρατός)."
  4: "οὐδαμῶς ἐπιλογιζόμενος τὸ τοῦ θεοῦ κράτος — «нисколько не размышляя о силе Божией»; πεφρενωμ ένος — «возомнив, понадеявшись»; μυριάσιν τῶν πεζῶν — «десятками тысяч пеших»; ἐλέφασιν τοῖς ὀγδοήκοντα — «восьмьюдесятью слонами» (象[ぞう])."
  5: "Βαιθσουρα — «Вефсура» (ベフスラ); ἐρυμνῷ χωρίῳ — «крепкое место»; ἀπέχοντι ὡσεὶ σταδίους πέντε — «отстоящее около пяти стадий»; τοῦτο ἔθλιβεν — «его теснил (обложил)»."
  6: "μετὰ ὀδυρμῶν καὶ δακρύων ἱκέτευον — «с плачем и слезами умоляли» (ὀδυρμός); ἀγαθὸν ἄγγελον ἀποστεῖλαι — «послать доброго ангела»; πρὸς σωτηρίαν τῷ Ισραηλ — «ко спасению Израиля»."
  7: "προετρέψατο τοὺς ἄλλους — «убедил других» (προτρέπω); ἅμα αὐτῷ διακινδυνεύοντας — «вместе с ним подвергая опасности»; ἐπιβοηθεῖν τοῖς ἀδελφοῖς — «помочь братьям»; ἐξώρμησαν — «устремились»."
  8: "ἐφάνη προηγούμενος αὐτῶν ἔφιππος — «явился предводительствующий ими всадник» (ἔφιππος); ἐν λευκῇ ἐσθῆτι — «в белой одежде»; πανοπλίαν χρυσῆν κραδαίνων — «потрясая золотым всеоружием» (κραδαίνω)."
  9: "τὸν ἐλεήμονα θεόν — «милосердого Бога»; ἐπερρώσθησαν ταῖς ψυχαῖς — «укрепились душами» (ἐπερρώννυμι); θῆρας τοὺς ἀγριωτάτους — «самых диких зверей»; σιδηρᾶ τείχη τιτρώσκειν — «железные стены сокрушать»."
  10: "ἐν διασκευῇ — «в строю (устроении)» (διασκευή); τὸν ἀπ᾽ οὐρανοῦ σύμμαχον ἔχοντες — «имея с неба союзника»; ἐλεήσαντος αὐτοὺς τοῦ κυρίου — «когда Господь их помиловал»."
  11: "λεοντηδὸν… ἐντινάξαντες — «как львы бросившись» (λεοντηδόν); κατέστρωσαν αὐτῶν χιλίους πρὸς τοῖς μυρίοις — «повергли из них одиннадцать тысяч»; ἱππεῖς δὲ ἑξακοσίους πρὸς τοῖς χιλίοις — «всадников тысячу шестьсот»."
  12: "οἱ πλείονες… τραυματίαι γυμνοὶ διεσώθησαν — «большая часть, раненые, нагими спаслись»; αἰσχρῶς φεύγων διεσώθη — «постыдно бежав, спасся»."
  13: "οὐκ ἄνους ὑπάρχων — «будучи не бессмысленным» (ἄνους); ἀντιβάλλων τὸ γεγονὸς… ἐλάττωμα — «соображая бывшее поражение» (ἐλάττωμα); ἀνικήτους εἶναι τοὺς Εβραίους — «что евреи непобедимы»."
  14: "συλλύεσθαι ἐπὶ πᾶσι τοῖς δικαίοις — «примириться на всех справедливых [условиях]» (συλλύω); τὸν βασιλέα πείσει φίλον αὐτοῖς… γενέσθαι — «убедит царя стать их другом»."
  15: "ἐπένευσεν — «согласился» (ἐπινεύω); ἐπὶ πᾶσιν, οἷς ὁ Λυσίας παρεκάλει — «на всё, о чём Лисий просил»; τοῦ συμφέροντος φροντίζων — «заботясь о полезном»; ὅσα… ἐπέδωκεν τῷ Λυσίᾳ διὰ γραπτῶν — «что представил Лисию письменно»."
  16: "αἱ γεγραμμέναι… ἐπιστολαί — «написанные письма»; παρὰ μὲν Λυσίου — «от Лисия»; τὸν τρόπον τοῦτον — «таким образом». Начало письма Лисия в 「…」."
  17: "Ιωαννης καὶ Αβεσσαλωμ — «Иоанн и Авессалом» (ヨハネ, アベサロム); οἱ πεμφθέντες παρ᾽ ὑμῶν — «посланные от вас»; ἐπιδόντες τὸν ὑπογεγραμμένον χρηματισμόν — «передав нижеписанное изъявление (документ)» (χρηματισμός)."
  18: "ὅσα… ἔδει καὶ τῷ βασιλεῖ προσενεχθῆναι — «что надлежало представить и царю»; ἃ δὲ ἦν ἐνδεχόμενα, συνεχώρησεν — «что было возможно, уступил» (ἐνδέχομαι)."
  19: "συντηρήσητε τὴν εἰς τὰ πράγματα εὔνοιαν — «сохраните благорасположение к делам»; παραίτιος ἀγαθῶν γενέσθαι — «стать виновником благ»."
  20: "τὰ κατὰ μέρος — «частности»; ἐντέταλμαι τούτοις τε καὶ τοῖς παρ᾽ ἐμοῦ — «поручил этим и моим [посланным]»; διαλεχθῆναι ὑμῖν — «переговорить с вами»."
  21: "ἔρρωσθε — «будьте здоровы»; ἔτους ἑκατοστοῦ τεσσαρακοστοῦ ὀγδόου — «сто сорок восьмого года»; Διὸς Κορινθίου τετράδι καὶ εἰκάδι — «Диоскоринфия, в четвёртый и двадцатый (день)», т. е. 24-й. Слав. «диоскоринфиа, дне двадесять четвертаго»."
  22: "ἡ τοῦ βασιλέως ἐπιστολή — «письмо царя»; Βασιλεὺς Ἀντίοχος τῷ ἀδελφῷ Λυσίᾳ χαίρειν — «царь Антиох брату Лисию радоваться»."
  23: "τοῦ πατρὸς ἡμῶν εἰς θεοὺς μεταστάντος — «когда отец наш перешёл к богам» (языческая формула, μεταστάντος); ἀταράχους — «безмятежными» (ἀτάραχος); πρὸς τὴν τῶν ἰδίων ἐπιμέλειαν — «к попечению о своём»."
  24: "μὴ συνευδοκοῦντας τῇ τοῦ πατρὸς… μεταθέσει — «не соглашающихся с перенесением (переменой) отца»; τὴν ἑαυτῶν ἀγωγὴν αἱρετίζοντας — «предпочитающих своё устройство»; συγχωρηθῆναι… τὰ νόμιμα — «чтобы им были уступлены законные [обычаи]»."
  25: "ἐκτὸς ταραχῆς εἶναι — «быть вне смятения»; τὸ ἱερὸν ἀποκατασταθῆναι — «храм восстановить»; πολιτεύεσθαι κατὰ τὰ ἐπὶ τῶν προγόνων ἔθη — «жить по обычаям предков»."
  26: "διαπεμψάμενος πρὸς αὐτούς — «послав к ним»; δοὺς δεξιάς — «дав десницу (руку)»; εὔθυμοι — «бодрые»; πρὸς τῇ τῶν ἰδίων ἀντιλήμψει — «при попечении о своём» (ἀντίλημψις). Здесь письмо закрывается."
  27: "Πρὸς δὲ τὸ ἔθνος — «к народу же»; τῇ γερουσίᾳ τῶν Ιουδαίων — «старейшинам иудейским» (γερουσία)."
  28: "εἰ ἔρρωσθε, εἴη ἂν ὡς βουλόμεθα — «если здоровы, было бы как мы хотим»; ὑγιαίνομεν — «мы здоровы»."
  29: "ἐνεφάνισεν ἡμῖν Μενέλαος — «Менелай изъявил нам»; βούλεσθαι κατελθόντας ὑμᾶς γίνεσθαι πρὸς τοῖς ἰδίοις — «что вы, сойдя, хотите быть у своих»."
  30: "τοῖς καταπορευομένοις — «нисходящим (отправляющимся)»; μέχρι τριακάδος Ξανθικοῦ — «до тридцатого дня Ксанфика»; ὑπάρξει δεξιὰ μετὰ τῆς ἀδείας — «будет десница с безопасностью» (ἄδεια — 安全[あんぜん])."
  31: "χρῆσθαι… τοῖς ἑαυτῶν δαπανήμασιν καὶ νόμοις — «пользоваться своими расходами (пищей) и законами»; καθὰ καὶ τὸ πρότερον — «как и прежде»; οὐδεὶς… παρενοχληθήσεται περὶ τῶν ἠγνοημ ένων — «никто не будет обеспокоен за неведомое (соделанное по неведению)» (παρενοχλέω)."
  32: "πέπομφα δὲ καὶ τὸν Μενέλαον παρακαλέσοντα ὑμᾶς — «послал и Менелая, имеющего утешить вас»."
  33: "ἔτους ἑκατοστοῦ τεσσαρακοστοῦ ὀγδόου — «148 г.»; Ξανθικοῦ πεντεκαιδεκάτῃ — «пятнадцатого Ксанфика». Здесь письмо закрывается."
  34: "Ἔπεμψαν δὲ καὶ οἱ Ῥωμαῖοι — «послали и римляне»; Κόιντος Μέμμιος, Τίτος Μάνιος — «Квинт Меммий и Тит Маний» (クウィントゥス, メンミウス, ティトゥス, マニウス); πρεσβῦται Ῥωμαίων — «старцы римские»."
  35: "συνεχώρησεν ὑμῖν — «уступил вам»; συνευδοκοῦμεν — «соглашаемся»."
  36: "ἃ δὲ ἔκρινεν προσανενεχθῆναι τῷ βασιλεῖ — «что он рассудил представить царю»; ἐπισκεψάμενοι — «рассмотрев»; ἵνα ἐκθῶμεν ὡς καθήκει ὑμῖν — «чтобы мы изложили, как подобает вам»; προσάγομεν πρὸς Ἀντιόχειαν — «мы идём к Антиохии»."
  37: "σπεύσατε καὶ πέμψατέ τινας — «поспешите и пошлите кого-нибудь»; ὁποίας ἐστὲ γνώμης — «какого вы мнения»."
  38: "ὑγιαίνετε — «будьте здоровы»; Ξανθικοῦ πεντεκαιδεκάτῃ — «пятнадцатого Ксанфика». Здесь письмо римлян закрывается."
