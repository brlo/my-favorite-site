# jp-box, Послание к Колоссянам, глава 4. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 4: окончание домостройства (1), молитва и слово к внешним (2–6),
# приветствия и поручения (7–18). «ルカ、愛する医者」 — 4:14.
# Красного и синего нет: прямой речи Христа в послании нет, <j>/<mo> не ставятся.
# 〔…〕 в главе нет: [περὶ οὗ ἐλάβετε ἐντολάς…] (4:10) и [Ἰησοῦ] (4:12) стоят в базе
# в квадратных скобках, слова есть, поэтому не оборачиваются.
# Сносок ⟨…⟩ в главе нет: 手紙 и 鎖 понятны без пояснений, лишних сносок не ставим.
# jp-ni не использовался.

tr_code: jp-box
book: kol
chapter: 4
draft: true

verses:
  1: "主人[しゅじん]たちよ、奴隷[どれい]たちに正[ただ]しいことと公平[こうへい]とを与[あた]えなさい。あなたがたにも天[てん]に主人[しゅじん]がおられることを知[し]っているからである。"
  2: "祈[いの]りに専心[せんしん]し、その祈[いの]りのうちに、感謝[かんしゃ]しつつ目[め]を覚[さ]ましていなさい。"
  3: "同時[どうじ]に、わたしたちのためにも、神[かみ]がわたしたちに言葉[ことば]の門[もん]を開[ひら]き、キリストの奥義[おうぎ]を語[かた]ることができるようにと祈[いの]りなさい。わたしはこの奥義[おうぎ]のために鎖[くさり]につながれているのである。"
  4: "その奥義[おうぎ]を、語[かた]るべきとおりに明[あき]らかにするためである。"
  5: "外[そと]の人[ひと]たちに対[たい]しては知恵[ちえ]をもって歩[あゆ]み、時[とき]を買[か]い取[と]りなさい。"
  6: "あなたがたの言葉[ことば]は、いつも{恵[めぐ]み|恩寵[おんちょう]}に満[み]ち、塩[しお]で味[あじ]付[つ]けされたものであるようにしなさい。一人[ひとり]一人[ひとり]にどう答[こた]えるべきかを知[し]るためである。"
  7: "わたしのことをすべてあなたがたに知[し]らせるのは、愛[あい]する兄弟[きょうだい]であり、主[しゅ]にあって忠実[ちゅうじつ]な奉仕者[ほうししゃ]、わたしの同労者[どうろうしゃ]であるティキコである。"
  8: "ちょうどそのために、わたしは彼[かれ]をあなたがたのところへ遣[つか]わした。あなたがたがわたしたちのことを知[し]り、彼[かれ]があなたがたの心[こころ]を慰[なぐさ]めるためである。"
  9: "あなたがたのところの者[もの]である、忠実[ちゅうじつ]で愛[あい]する兄弟[きょうだい]オネシモとともに、ティキコを遣[つか]わした。彼[かれ]らは、ここでのことをすべてあなたがたに知[し]らせるであろう。"
  10: "わたしとともに囚人[しゅうじん]となっているアリスタルコが、またバルナバのいとこであるマルコが、あなたがたによろしくと言[い]っている。マルコについては、あなたがたはすでに指示[しじ]を受[う]けている。もし彼[かれ]があなたがたのところへ行[い]ったなら、受[う]け入[い]れなさい。"
  11: "また、ユストと呼[よ]ばれるイエスも、よろしくと言[い]っている。割礼[かつれい]を受[う]けた者[もの]のうちで、神[かみ]の国[くに]のためにわたしとともに働[はたら]いたのは、この者[もの]たちだけであり、彼[かれ]らはわたしの慰[なぐさ]めとなってくれた。"
  12: "あなたがたのところの者[もの]である、キリスト・イエスの奴隷[どれい]エパフラスが、よろしくと言[い]っている。彼[かれ]はいつも、あなたがたが完全[かんぜん]な者[もの]として、神[かみ]のすべての御心[みこころ]に確信[かくしん]をもって立[た]つことができるように、祈[いの]りのうちであなたがたのために戦[たたか]っている。"
  13: "というのは、わたしは、彼[かれ]があなたがたのため、またラオディキアとヒエラポリスにいる者[もの]たちのために、大[おお]きな労苦[ろうく]をしていることを証[あかし]するからである。"
  14: "愛[あい]する医者[いしゃ]ルカとデマスが、あなたがたによろしくと言[い]っている。"
  15: "ラオディキアの兄弟[きょうだい]たちに、またニムファと、その家[いえ]にある教会[きょうかい]とに、よろしく伝[つた]えなさい。"
  16: "この手紙[てがみ]があなたがたの間[あいだ]で読[よ]まれたなら、ラオディキアの教会[きょうかい]でも読[よ]まれるようにしなさい。また、ラオディキアから届[とど]く手紙[てがみ]も、あなたがたが読[よ]むようにしなさい。"
  17: "また、アルキポに、『主[しゅ]にあってあなたが受[う]けた務[つと]めをよくよく考[かんが]え、それを全[まっと]うしなさい』と言[い]いなさい。"
  18: "この挨拶[あいさつ]は、わたしパウロが自分[じぶん]の手[て]で書[か]いたものである。わたしの鎖[くさり]を思[おも]い出[だ]してほしい。{恵[めぐ]み|恩寵[おんちょう]}があなたがたとともにありますように。"

notes:
  1: "Οἱ κύριοι — 主人たちよ. τὸ δίκαιον καὶ τὴν ἰσότητα — 正しいことと公平. εἰδότες ὅτι καὶ ὑμεῖς ἔχετε κύριον ἐν οὐρανῷ — あなたがたにも天に主人がおられることを知っているからである."
  2: "Τῇ προσευχῇ προσκαρτερεῖτε — 祈りに専心し. γρηγοροῦντες ἐν αὐτῇ ἐν εὐχαριστίᾳ — その祈りのうちに、感謝しつつ目を覚まして."
  3: "ἅμα καὶ περὶ ἡμῶν — 同時に、わたしたちのためにも. θύραν τοῦ λόγου — 言葉の門. λαλῆσαι τὸ μυστήριον τοῦ Χριστοῦ — キリストの奥義を語る. δι᾽ ὃ καὶ δέδεμαι — この奥義のために鎖につながれている."
  4: "ἵνα φανερώσω αὐτὸ ὡς δεῖ με λαλῆσαι — その奥義を、語るべきとおりに明らかにするためである."
  5: "Ἐν σοφίᾳ περιπατεῖτε πρὸς τοὺς ἔξω — 外の人たちに対しては知恵をもって歩み. τὸν καιρὸν ἐξαγοραζόμενοι — 時を買い取り."
  6: "ὁ λόγος ὑμῶν πάντοτε ἐν χάριτι — あなたがたの言葉はいつも恵みに満ち. ἅλατι ἠρτυμένος — 塩で味付けされた. ἑνὶ ἑκάστῳ ἀποκρίνεσθαι — 一人一人に答える."
  7: "Τυχικός — ティキコ. ἀγαπητὸς ἀδελφὸς καὶ πιστὸς διάκονος καὶ σύνδουλος ἐν κυρίῳ — 愛する兄弟であり、主にあって忠実な奉仕者、同労者 (διάκονος — не должность, ср. 1:7, Еф 6:21)."
  8: "ὃν ἔπεμψα πρὸς ὑμᾶς εἰς αὐτὸ τοῦτο — ちょうどそのために遣わした. ἵνα γνῶτε τὰ περὶ ἡμῶν — わたしたちのことを知る (в базе ἡμῶν; jp-joc читает ὑμῶν — оставлено по базе). παρακαλέσῃ τὰς καρδίας ὑμῶν — 心を慰める."
  9: "Ὀνήσιμος — オネシモ («полезный»; ср. Флм 10–16). ὅς ἐστιν ἐξ ὑμῶν — あなたがたのところの者; подлежащее — Тихик из 4:7–8, поэтому ティキコを遣わした. τὰ ὧδε — ここでのこと."
  10: "Ἀρίσταρχος ὁ συναιχμάλωτός μου — わたしとともに囚人となっているアリスタルコ (ср. Деян 19:29; 27:2). Μᾶρκος ὁ ἀνεψιὸς Βαρναβᾶ — バルナバのいとこであるマルコ. [περὶ οὗ ἐλάβετε ἐντολάς…] — в базе в квадратных скобках, слова есть, 〔〕 не ставятся."
  11: "Ἰησοῦς ὁ λεγόμενος Ἰοῦστος — ユストと呼ばれるイエス; не Христос, а иудей из сотрудников (в кальке イエス→イイスス, как в церковной традиции для этого имени). οἱ ὄντες ἐκ περιτομῆς — 割礼を受けた者. συνεργοὶ εἰς τὴν βασιλείαν τοῦ θεοῦ — 神の国のためにともに働く者. ἐγενήθησάν μοι παρηγορία — わたしの慰めとなってくれた."
  12: "Ἐπαφρᾶς ὁ ἐξ ὑμῶν, δοῦλος Χριστοῦ [Ἰησοῦ] — あなたがたのところの者、キリスト・イエスの奴隷. ἀγωνιζόμενος ὑπὲρ ὑμῶν ἐν ταῖς προσευχαῖς — 祈りのうちで戦っている. ἵνα σταθῆτε τέλειοι καὶ πεπληροφορημένοι ἐν παντὶ θελήματι τοῦ θεοῦ — 完全な者として、神のすべての御心に確信をもって立つ."
  13: "μαρτυρῶ γὰρ αὐτῷ — というのは、わたしは…証しするからである (γάρ передан). πολὺν πόνον — 大きな労苦. Λαοδίκεια, Ἱεράπολις — ラオディキア、ヒエラポリス."
  14: "Λουκᾶς ὁ ἰατρὸς ὁ ἀγαπητός — 愛する医者ルカ (ср. Флм 24; 2 Тим 4:11). Δημᾶς — デマス (позже оставил Павла, 2 Тим 4:10)."
  15: "Νύμφαν καὶ τὴν κατ᾽ οἶκον αὐτῆς ἐκκλησίαν — ニムファとその家にある教会 (αὐτῆς — женский род; отсюда ニムファ, домашняя церковь)."
  16: "ἡ ἐπιστολή — この手紙 (слово обычное, сноски нет). ἐν τῇ Λαοδικέων ἐκκλησίᾳ — ラオディキアの教会で. τὴν ἐκ Λαοδικείας — ラオディキアから届く手紙 (не сохранилась; ср. «к Лаодикийцам» в древних списках)."
  17: "Ἀρχίππῳ — アルキポ (ср. Флм 2). Βλέπε τὴν διακονίαν ἣν παρέλαβες ἐν κυρίῳ — 主にあって受けた務めをよくよく考え. ἵνα αὐτὴν πληροῖς — それを全うする. Прямая речь, вложенная в поручение, — 『…』."
  18: "Ὁ ἀσπασμὸς τῇ ἐμῇ χειρὶ Παύλου — この挨拶は、わたしパウロが自分の手で書いた (ср. 2 Фес 3:17). μνημονεύετέ μου τῶν δεσμῶν — わたしの鎖を思い出してほしい. ἡ χάρις μεθ᾽ ὑμῶν — 恵みがあなたがたとともに."
