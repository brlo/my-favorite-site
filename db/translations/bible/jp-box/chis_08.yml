# jp-box, Числа, глава 8. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 8: светильник и его лампады (1–4), очищение и посвящение левитов (5–22),
# возраст служения левитов (23–26). В gr-lxx-byz 26 стихов.
# Пасха второго месяца, облако и трубы — это главы 9–10, в гл. 8 их нет.
# Речь Бога — 「…」 (2, 6–26). Красного нет.
# jp-joc есть только в 8:15–17, и его нумерация сдвинута: японский текст при ст. 15
# передаёт содержание ст. 16 («отданы Мне из среды сынов Израилевых»). Как свидетель
# церковного чтения он сверен, но в язык не переносился.
# 〔災い〕 в ст. 19: в csl «да не будет язва на сынех израилевых», в gr-lxx-byz слова
# πληγή нет (проверено по базе: 8:19 «πληγ» — НЕТ). Больше 〔…〕 нет.
# Сносок ⟨…⟩ нет: レビ人 пояснено при первом упоминании (7:5).
# Стихов 26 — как в gr-lxx-byz (совпадает с csl/ru).
# jp-ni не использовался.

tr_code: jp-box
book: chis
chapter: 8
draft: true

verses:
  1: "主[しゅ]はモーセに言[い]われた。"
  2: "「アロンに語[かた]って言[い]いなさい。あなたが灯[ともしび]を据[す]えるとき、七[なな]つの灯は燭台[しょくだい]の正面[しょうめん]を照[て]らすようにしなさい。」"
  3: "アロンはそのとおりに行[おこな]った。彼[かれ]は燭台[しょくだい]の正面[しょうめん]の一[ひと]つの側[がわ]から、その灯[ともしび]をともした。主[しゅ]がモーセに命[めい]じられたとおりである。"
  4: "燭台[しょくだい]の作[つく]りはこうである。すなわち、金[きん]の打[う]ち物[もの]で、その茎[くき]もその花[はな]も打ち物であり、全体[ぜんたい]が一[ひと]つの打ち物であった。主[しゅ]がモーセに見[み]せられた型[かた]どおりに、彼[かれ]は燭台を作った。"
  5: "主[しゅ]はモーセに言[い]われた。"
  6: "「レビ人[びと]をイスラエルの子[こ]らの間[あいだ]から取[と]り、彼[かれ]らを清[きよ]めなさい。"
  7: "彼[かれ]らを清[きよ]めるには、こうしなさい。清めの水[みず]を彼[かれ]らの上[うえ]に振[ふ]りかけ、彼[かれ]らは全身[ぜんしん]を剃[そ]り、衣[ころも]を洗[あら]って、清[きよ]くなりなさい。"
  8: "彼[かれ]らは牛[うし]の群[む]れから子牛[こうし]一頭[いっとう]と、その素祭[そさい]、すなわち油[あぶら]を混[ま]ぜた小麦粉[こむぎこ]を取[と]りなさい。また、贖罪祭[しょくざいさい]のために、牛の群れから一歳[いっさい]の子牛を一頭取[と]りなさい。"
  9: "レビ人[びと]を証[あかし]の幕屋[まくや]の前[まえ]に近[ちか]づけ、イスラエルの子[こ]らの会衆[かいしゅう]をすべて集[あつ]めなさい。"
  10: "レビ人[びと]を主[しゅ]の前[まえ]に近[ちか]づけなさい。イスラエルの子[こ]らはレビ人の上[うえ]に手[て]を置[お]きなさい。"
  11: "アロンはレビ人[びと]を、イスラエルの子[こ]らのもとから主[しゅ]への捧[ささ]げ物[もの]として差[さ]し出[だ]しなさい。彼[かれ]らは主[しゅ]の務[つと]めを果[は]たす者[もの]となる。"
  12: "レビ人[びと]は子牛[こうし]の頭[あたま]に手[て]を置[お]きなさい。あなたは一頭[いっとう]を贖罪祭[しょくざいさい]、もう一頭を燔祭[はんさい]として主[しゅ]に献[ささ]げ、彼[かれ]らのために贖[あがな]いをしなさい。"
  13: "レビ人[びと]を主[しゅ]の前[まえ]、アロンの前[まえ]、その子[こ]らの前[まえ]に立[た]たせ、彼[かれ]らを主[しゅ]への捧[ささ]げ物[もの]として差[さ]し出[だ]しなさい。"
  14: "あなたはレビ人[びと]をイスラエルの子[こ]らから分[わ]け離[はな]しなさい。レビ人[びと]はわたしのものとなる。"
  15: "その後[のち]、レビ人[びと]は証[あかし]の幕屋[まくや]の務[つと]めを果[は]たすために入[はい]って来[き]なさい。あなたは彼[かれ]らを清[きよ]め、主[しゅ]の前[まえ]に捧[ささ]げ物[もの]として差[さ]し出[だ]しなさい。"
  16: "彼[かれ]らはイスラエルの子[こ]らの間[あいだ]から、わたしに全[まった]く差[さ]し出[だ]された者[もの]である。わたしは、イスラエルの子[こ]らのすべての初子[ういご]、すなわちすべての胎[たい]を開[ひら]く者[もの]の代[か]わりに、彼[かれ]らを自分[じぶん]のために取[と]った。"
  17: "イスラエルの子[こ]らの間[あいだ]の初子[ういご]はすべて、人[ひと]から家畜[かちく]に至[いた]るまで、わたしのものである。エジプトの地[ち]ですべての初子を打[う]った日[ひ]に、わたしは彼[かれ]らを自分[じぶん]のために聖別[せいべつ]した。"
  18: "わたしはイスラエルの子[こ]らのすべての初子[ういご]の代[か]わりに、レビ人[びと]を取[と]った。"
  19: "わたしはレビ人[びと]を、イスラエルの子[こ]らの間[あいだ]からアロンとその子[こ]らに与[あた]え、証[あかし]の幕屋[まくや]でイスラエルの子[こ]らの務[つと]めを果[は]たし、イスラエルの子[こ]らのために贖[あがな]いをする者[もの]とした。イスラエルの子[こ]らが聖[せい]なるものに近[ちか]づくときに、彼[かれ]らの間に〔災[わざわ]い〕が起[お]こらないためである。"
  20: "モーセとアロン、またイスラエルの子[こ]らの会衆[かいしゅう]はすべて、レビ人[びと]に対してそのとおりに行[おこな]った。主[しゅ]がレビ人[びと]についてモーセに命[めい]じられたとおりに、イスラエルの子[こ]らはそのとおりに彼[かれ]らに行[おこな]った。"
  21: "レビ人[びと]は身[み]を清[きよ]め、衣[ころも]を洗[あら]った。アロンは彼[かれ]らを主[しゅ]の前[まえ]に捧[ささ]げ物[もの]として差[さ]し出[だ]し、彼[かれ]らを清[きよ]めるために彼[かれ]らのために贖[あがな]いをした。"
  22: "その後[のち]、レビ人[びと]はアロンの前[まえ]、その子[こ]らの前[まえ]で、証[あかし]の幕屋[まくや]の務[つと]めを果[は]たすために入[はい]って来[き]た。主[しゅ]がレビ人[びと]についてモーセに命[めい]じられたとおりに、彼[かれ]らはそのとおりに彼[かれ]らに行[おこな]った。」"
  23: "主[しゅ]はモーセに言[い]われた。"
  24: "「レビ人[びと]についてはこうである。二十五歳[にじゅうごさい]以上[いじょう]の者[もの]はみな、証[あかし]の幕屋[まくや]の務[つと]めの働[はたら]きのために入[はい]って来[き]なさい。"
  25: "五十歳[ごじゅっさい]からは務[つと]めから退[しりぞ]き、もはや働[はたら]いてはならない。"
  26: "彼[かれ]は兄弟[きょうだい]たちとともに証[あかし]の幕屋[まくや]で務[つと]めを守[まも]るために仕[つか]えなさい。ただ、仕事[しごと]をしてはならない。レビ人[びと]には、その務[つと]めについてこうしなさい。」"

notes:
  1: "Καὶ ἐλάλησεν κύριος πρὸς Μωυσῆν λέγων — обычная формула введения речи; λέγων отдельно не передаётся."
  2: "Ὅταν ἐπιτιθῇς τοὺς λύχνους — «когда ты ставишь (возжигаешь) лампады» (ἐπιτίθημι). ἐκ μέρους κατὰ πρόσωπον τῆς λυχνίας — «с одной стороны, против лица светильника», т.е. на лицевую сторону; слав. «от страны спреди светилника». φωτιοῦσιν — «светят» (φωτίζω). Ср. Исх 25:37, где в корпусе 灯 (ともしび)."
  3: "ἐξῆψεν — «зажёг» (ἐξάπτω). ἐκ τοῦ ἑνὸς μέρους — «с одной стороны». καθὰ συνέταξεν κύριος — «как повелел Господь» (συντάσσω)."
  4: "κατασκευὴ τῆς λυχνίας — «устройство светильника» (κατασκευή). στερεὰ χρυσῆ — «цельная, кованая золотая» (στερεός — «твёрдый, цельный»); καυλός — «стебель» (茎), κρίνα — «лилии, цветы» (花). κατὰ τὸ εἶδος ὃ ἔδειξεν — «по виду, который показал» (εἶδος — 型)."
  5: "Введение речи; ср. ст. 1."
  6: "Λαβὲ τοὺς Λευίτας ἐκ μέσου υἱῶν Ισραηλ — «возьми левитов из среды сынов Израилевых»; ἀφαγνιεῖς — «очистишь» (ἀφαγνίζω, ср. 6:2)."
  7: "περιρρανεῖς — «окропишь» (περιρραίνω); ὕδωρ ἁγνισμοῦ — «вода очищения». ἐπελεύσεται ξυρὸν ἐπὶ πᾶν τὸ σῶμα — «пройдёт бритва по всему телу». πλυνοῦσιν τὰ ἱμάτια — «вымоют одежды» (πλύνω). καθαροὶ ἔσονται — «чисты будут»."
  8: "μόσχον ἕνα ἐκ βοῶν — «тельца одного из крупного скота»; θυσίαν σεμιδάλεως ἀναπεποιημένην ἐν ἐλαίῳ — «хлебное приношение из пшеничной муки, смешанной с елеем»; μόσχον ἐνιαύσιον … περὶ ἁμαρτίας — «тельца однолетнего… за грех»."
  9: "προσάξεις — «приведёшь, приблизишь» (προσάγω). συνάξεις πᾶσαν συναγωγὴν υἱῶν Ισραηλ — «соберёшь всё собрание сынов Израилевых»."
  10: "ἐπιθήσουσιν οἱ υἱοὶ Ισραηλ τὰς χεῖρας αὐτῶν ἐπὶ τοὺς Λευίτας — «возложат сыны Израилевы руки свои на левитов» (знак посвящения)."
  11: "ἀφοριεῖ — «отделит» (ἀφορίζω); ἀπόδομα — «отдание, даяние» (от ἀποδίδωμι — «отдавать»): левиты как дар, отданный Богу. ἔσονται ὥστε ἐργάζεσθαι τὰ ἔργα κυρίου — «будут, чтобы совершать работы Господни»."
  12: "ἐπιθήσουσιν τὰς χεῖρας ἐπὶ τὰς κεφαλὰς τῶν μόσχων — «возложат руки на головы тельцов». ποιήσει τὸν ἕνα περὶ ἁμαρτίας καὶ τὸν ἕνα εἰς ὁλοκαύτωμα — «совершит одного за грех и одного во всесожжение»; ἐξιλάσασθαι περὶ αὐτῶν — «чтобы умилостивить о них»."
  13: "στήσεις — «поставишь» (ἵστημι). ἀποδώσεις αὐτοὺς ἀπόδομα ἔναντι κυρίου — «отдашь их отданием пред Господом» (ср. ст. 11)."
  14: "διαστελεῖς — «отделишь» (διαστέλλω); ἔσονται ἐμοί — «будут Мне»."
  15: "εἰσελεύσονται … ἐργάζεσθαι τὰ ἔργα — «войдут совершать работы». καθαριεῖς — «очистишь» (καθαρίζω); ἀποδώσεις — «отдашь». В jp-joc при ст. 15 стоит уже начало ст. 16 (сдвиг нумерации в этом модуле)."
  16: "ἀπόδομα ἀποδεδομένοι — «отданием отданные» (тавтология LXX передана: 「まったく差し出された」). ἀντὶ τῶν διανοιγόντων πᾶσαν μήτραν — «вместо разверзающих всякую утробу» (διανοίγω — «открывать»; μήτρα — «утроба»). εἴληφα αὐτοὺς ἐμοί — «Я взял их Себе»."
  17: "πᾶν πρωτότοκον … ἀπὸ ἀνθρώπου ἕως κτήνους — «всякий первенец от человека до скота». ᾗ ἡμέρᾳ ἐπάταξα — «в день, когда Я поразил» (πατάσσω). ἡγίασα αὐτοὺς ἐμοί — «освятил их Себе»."
  18: "ἔλαβον τοὺς Λευίτας ἀντὶ παντὸς πρωτοτόκου — «взял левитов вместо всякого первенца»."
  19: "ἀπέδωκα … ἀπόδομα δεδομένους — «отдал… как отдание данными». ἐξιλάσκεσθαι περὶ τῶν υἱῶν Ισραηλ — «умилостивлять о сынах Израилевых». καὶ οὐκ ἔσται ἐν τοῖς υἱοῖς Ισραηλ προσεγγίζων πρὸς τὰ ἅγια — «и не будет среди сынов Израилевых приступающего к святыням»; слав. добавляет «язва» (из евр. נֶגַע), в греч. этого слова нет — отсюда 〔災い〕."
  20: "καθὰ ἐνετείλατο κύριος τῷ Μωυσῇ περὶ τῶν Λευιτῶν — «как заповедал Господь Моисею о левитах»; οὕτως ἐποίησαν — «так и сделали» (повтор, как в 5:4)."
  21: "ἡγνίσαντο — «очистились» (ἁγνίζω); ἐπλύναντο τὰ ἱμάτια — «омыли одежды». ἐξιλάσατο περὶ αὐτῶν … ἀφαγνίσασθαι αὐτούς — «умилостивил о них… чтобы очистить их»."
  22: "εἰσῆλθον … λειτουργεῖν τὴν λειτουργίαν αὐτῶν — «вошли служить служение своё» (λειτουργέω); καθὼς συνέταξεν κύριος — «как повелел Господь»."
  23: "Введение речи; ср. ст. 1."
  24: "ἀπὸ πεντεκαιεικοσαετοῦς καὶ ἐπάνω — «от двадцатипятилетнего и выше» (в 4:3 для переноски святыни — от тридцати). εἰσελεύσονται ἐνεργεῖν — «войдут действовать, служить» (ἐνεργέω)."
  25: "ἀπὸ πεντηκονταετοῦς — «от пятидесятилетнего»; ἀποστήσεται ἀπὸ τῆς λειτουργίας — «отступит от служения» (ἀφίστημι); οὐκ ἐργᾶται ἔτι — «не работает более»."
  26: "λειτουργήσει ὁ ἀδελφὸς αὐτοῦ — «будет служить брат его», т.е. помогать братьям; φυλάσσειν φυλακάς — «хранить стражи» (внутренний объект); ἔργα δὲ οὐκ ἐργᾶται — «работы же не работает». οὕτως ποιήσεις … ἐν ταῖς φυλακαῖς αὐτῶν — «так сделаешь левитам в стражах их»."
