verses:
  1: "彼[かれ]らが民[たみ]に語[かた]っていると、祭司[さいし]たちと神殿[しんでん]の警備[けいび]の長[ちょう]、またサドカイ派[は]の人々[ひとびと]が、彼[かれ]らのところに来[き]た。"
  2: "彼[かれ]らが民[たみ]を教[おし]え、イエスによって死者[ししゃ]の中[なか]からの復活[ふっかつ]を告[つ]げていることに、腹[はら]を立[た]てたからである。"
  3: "そこで、二人[ふたり]に手[て]をかけて捕[と]らえ、翌日[よくじつ]まで留[と]め置[お]くことにした。すでに夕方[ゆうがた]になっていたからである。"
  4: "しかし、語[かた]られた言[こと]葉[ば]を聞[き]いた多[おお]くの人[ひと]が信[しん]じ、男[おとこ]の数[かず]はおよそ五千人[ごせんにん]になった。"
  5: "翌日[よくじつ]、エルサレムで、指導者[しどうしゃ]たち、長老[ちょうろう]たち、律法学者[りっぽうがくしゃ]たちが集[あつ]まった。"
  6: "大祭司[だいさいし]アンナス、カヤパ、ヨハネ、アレクサンドロ、また大祭司[だいさいし]の家系[かけい]の者[もの]たちも、そこにいた。"
  7: "そして、二人[ふたり]を真[ま]ん中[なか]に立[た]たせて尋[たず]ねた。「あなたがたは、何[なん]の力[ちから]によって、また何[なん]の名[な]によって、このことを行[おこな]ったのか。」"
  8: "そのとき、ペトロは{聖霊[せいれい]|聖神[せいしん]}に満[み]たされて言[い]った。「民[たみ]の指導者[しどうしゃ]たち、また〔イスラエルの〕長老[ちょうろう]たちよ、"
  9: "もし、わたしたちが、病[や]んでいる人[ひと]に行[おこな]った善[よ]い業[わざ]について、その人[ひと]がどのようにして癒[いや]されたのかを、今日[きょう]尋[たず]ねられるのなら、"
  10: "あなたがた一同[いちどう]も、イスラエルの民[たみ]全体[ぜんたい]も、このことを知[し]るがよい。あなたがたが十字架[じゅうじか]につけたナザレのイエス・キリスト、すなわち神[かみ]が死者[ししゃ]の中[なか]から復活[ふっかつ]させたこの方[かた]の名[な]によって、この人[ひと]は、あなたがたの前[まえ]にこうして立[た]っている。"
  11: "この方[かた]こそ、あなたがた家[いえ]を建[た]てる者[もの]たちが軽[かろ]んじた石[いし]、隅[すみ]の親石[おやいし]となった石[いし]である。"
  12: "この方[かた]のほかに救[すく]いはない。天[てん]の下[した]で、わたしたちが救[すく]われるために人[ひと]に与[あた]えられた名[な]は、ほかにないからである。」"
  13: "彼[かれ]らは、ペトロとヨハネの大胆[だいたん]さを見[み]、二人[ふたり]が学[がく]のない、ふつうの者[もの]たちであると分[わ]かって、不思議[ふしぎ]に思[おも]い、また、二人[ふたり]がイエスとともにいた者[もの]であることも分[わ]かった。"
  14: "しかも、癒[いや]された人[ひと]が彼[かれ]らと一緒[いっしょ]に立[た]っているのを見[み]ていたので、何[なに]も言[い]い返[かえ]すことができなかった。"
  15: "そこで、二人[ふたり]に最高法院[さいこうほういん]の外[そと]へ出[で]て行[い]くよう命[めい]じた後[のち]、彼[かれ]らは互[たが]いに相談[そうだん]した。"
  16: "「この人[ひと]たちをどうしてよいだろうか。彼[かれ]らによって著[いちじる]しいしるしが行[おこな]われたことは、エルサレムに住[す]むすべての者[もの]に明[あき]らかで、わたしたちもそれを否定[ひてい]することはできない。"
  17: "しかし、このことがこれ以上[いじょう]、民[たみ]の間[あいだ]に広[ひろ]がらないように、今後[こんご]、だれにもこの名[な]によって語[かた]らないように、彼[かれ]らを脅[おど]してやろう。」"
  18: "そこで、二人[ふたり]を呼[よ]んで、イエスの名[な]によって一切[いっさい]語[かた]らないように、また教[おし]えないように命[めい]じた。"
  19: "ペトロとヨハネは答[こた]えて言[い]った。「神[かみ]の前[まえ]で、あなたがたの言[い]うことを聞[き]くよりも神[かみ]の言[い]うことを聞[き]くのが、正[ただ]しいことかどうか、あなたがた自身[じしん]で判断[はんだん]するがよい。"
  20: "わたしたちは、見[み]たこと、聞[き]いたことを語[かた]らずにはいられないのである。」"
  21: "そこで、彼[かれ]らは二人[ふたり]をさらに脅[おど]してから釈放[しゃくほう]した。どう罰[ばつ]してよいか分[わ]からず、また民[たみ]が皆[みな]、起[お]こったことのゆえに神[かみ]をほめたたえていたからである。"
  22: "この癒[いや]しのしるしが行[おこな]われた人[ひと]は、四十歳[よんじゅうさい]余[あま]りであった。"
  23: "二人[ふたり]は釈放[しゃくほう]されると、仲間[なかま]たちのところへ行[い]き、祭司長[さいしちょう]たちと長老[ちょうろう]たちが自分[じぶん]たちに言[い]ったことをすべて告[つ]げた。"
  24: "彼[かれ]らはこれを聞[き]くと、心[こころ]を一[ひと]つにして声[こえ]を上[あ]げ、神[かみ]に言[い]った。「主[しゅ]よ、あなたは天[てん]と地[ち]と海[うみ]、またその中[なか]のすべてのものを造[つく]られた方[かた]、"
  25: "あなたは{聖霊[せいれい]|聖神[せいしん]}によって、あなたの僕[しもべ]、わたしたちの父[ちち]ダビデの口[くち]を通[とお]して言[い]われた。『なぜ、異邦人[いほうじん]たちは騒[さわ]ぎ立[た]ち、民[たみ]たちはむなしいことを企[くわだ]てるのか。"
  26: "地[ち]の王[おう]たちは立[た]ち構[かま]え、支配者[しはいしゃ]たちは一[ひと]つに集[あつ]まって、主[しゅ]とそのキリストとに逆[さか]らった。』"
  27: "まことに、あなたが膏[あぶら]を注[そそ]がれた聖[せい]なる僕[しもべ]イエスに逆[さか]らって、ヘロデとポンティオ・ピラトは、異邦人[いほうじん]たちやイスラエルの民[たみ]とともに、この都[みやこ]に集[あつ]まったのである。"
  28: "あなたの手[て]とご計画[けいかく]が、あらかじめ定[さだ]められたことを行[おこな]うためであった。"
  29: "主[しゅ]よ、今[いま]も彼[かれ]らの脅[おど]しをご覧[らん]になり、あなたの僕[しもべ]たちに、大胆[だいたん]さをもってあなたの言[こと]葉[ば]を語[かた]らせてください。"
  30: "あなたの手[て]を伸[の]べて癒[いや]しを行[おこな]い、あなたの聖[せい]なる僕[しもべ]イエスの名[な]によって、しるしと奇跡[きせき]が起[お]こるようにしてください。」"
  31: "彼[かれ]らが祈[いの]り終[お]えると、集[あつ]まっていた所[ところ]が揺[ゆ]れ動[うご]き、彼[かれ]らは皆[みな]{聖霊[せいれい]|聖神[せいしん]}に満[み]たされて、大胆[だいたん]さをもって神[かみ]の言[こと]葉[ば]を語[かた]った。"
  32: "信[しん]じた人[ひと]たちの群[む]れは、心[こころ]も魂[たましい]も一[ひと]つであった。だれも、自分[じぶん]の所有[しょゆう]の物[もの]を自分[じぶん]だけのものだとは言[い]わず、すべての物[もの]を共[とも]にしていた。"
  33: "使徒[しと]たちは大[おお]きな力[ちから]をもって、主[しゅ]イエスの復活[ふっかつ]を証[あかし]した。そして、大[おお]きな{恵[めぐ]み|恩寵[おんちょう]}が、彼[かれ]らすべての上[うえ]にあった。"
  34: "彼[かれ]らの間[あいだ]には、乏[とぼ]しい者[もの]が一人[ひとり]もいなかった。土地[とち]や家[いえ]を持[も]つ者[もの]は皆[みな]、それを売[う]って、売[う]った物[もの]の代金[だいきん]を持[も]って来[き]、"
  35: "使徒[しと]たちの足元[あしもと]に置[お]き、それぞれの必要[ひつよう]に応[おう]じて、すべての人[ひと]に分[わ]け与[あた]えた。"
  36: "レビ人[びと]で、キプロス生[う]まれのヨセフという人[ひと]がいた。使徒[しと]たちは彼[かれ]をバルナバと呼[よ]んだ。バルナバとは、訳[やく]すと「慰[なぐさ]めの子[こ]」という意味[いみ]である。"
  37: "彼[かれ]は自分[じぶん]の畑[はたけ]を売[う]り、その代金[だいきん]を持[も]って来[き]て、使徒[しと]たちの足元[あしもと]に置[お]いた。"

notes:
  1: "στρατηγὸς τοῦ ἱεροῦ — «военачальник храма», начальник храмовой стражи; 神殿の警備の長."
  2: "διαπονούμενοι — «досадуя, негодуя»; 腹を立てた."
  3: "ἦν γὰρ ἑσπέρα ἤδη — すでに夕方になっていた."
  4: "[ὡς] χιλιάδες πέντε — в базе в квадратных скобках, 〔…〕 не ставится; およそ五千人."
  5: "В базе стих обрывается на «ἐν Ἰερουσαλήμ [»; 〔…〕 не ставится, так как весь материал (4:5–6) в базе есть."
  6: "Ἅννας, Καϊάφας — アンナス、カヤパ (имя выровнено по корпусу). Ἰωάννης, Ἀλέξανδρος — ヨハネ、アレクサンドロ; ἀρχιερατικοῦ γένους — 大祭司の家系."
  7: "ἐν ποίᾳ δυνάμει ἢ ἐν ποίῳ ὀνόματι — 何の力によって、何の名によって."
  8: "τοῦ Ἰσραήλ — чтение Церкви (Синодальный «старейшины Израильские», jp-joc「イズライリの長老等」); в базе Ἄρχοντες τοῦ λαοῦ καὶ πρεσβύτεροι — 〔イスラエルの〕."
  9: "εὐεργεσία — 善い業. ἀνακρινόμεθα — 尋ねられる."
  10: "ἐν τούτῳ — この方の名によって. ὑγιής — 立っている (健康な者として)."
  11: "Пс 117:22. οἰκοδόμοι — 家を建てる者たち; κεφαλὴ γωνίας — 隅の親石."
  12: "σωτηρία — 救い; ὄνομα ἕτερον — ほかの名. Стих — завершение речи Петра."
  13: "ἀγράμματοι καὶ ἰδιῶται — «неучёные и простые»; 学のない、ふつうの者."
  14: "ἀντειπεῖν — 言い返す."
  15: "συνέδριον — 最高法院."
  16: "γνωστὸν σημεῖον — 著しいしるし."
  17: "ἀπειλησώμεθα — 脅してやろう; μηκέτι λαλεῖν — 今後語らないように."
  19: "κρίνατε — 判断するがよい; εἰ δίκαιόν ἐστιν ἐνώπιον τοῦ θεοῦ — 神の前で正しいことかどうか."
  21: "προσαπειλησάμενοι — さらに脅して. ἐδόξαζον τὸν θεὸν ἐπὶ τῷ γεγονότι — 起こったことのゆえに神をほめたたえていた."
  22: "πλειόνων τεσσαράκοντα ἐτῶν — 四十歳余り."
  24: "Δέσποτα — 主 (Владыка). ὁμοθυμαδόν — 心を一つにして."
  25: "Пс 2:1–2. ἔθνη — 異邦人たち; λαοί — 民たち."
  27: "ἔχρισας — 膏を注がれた. Ἡρῴδης — ヘロデ; Πόντιος Πιλᾶτος — ポンティオ・ピラト."
  29: "ἔπιδε ἐπὶ τὰς ἀπειλάς — 脅しをご覧になり; μετὰ παρρησίας πάσης — 大胆さをもって."
  30: "ἐκτείνειν τὴν χεῖρα — 手を伸べて; ἴασις — 癒し."
  31: "ἐσαλεύθη ὁ τόπος — 所が揺れ動き; μετὰ παρρησίας — 大胆さをもって."
  32: "καρδία καὶ ψυχὴ μία — 心も魂も一つ. ἴδιον εἶναι — 自分だけのものだと言う."
  33: "τὸ μαρτύριον — 証し; χάρις μεγάλη — 大きな恵み."
  34: "κτήτορες χωρίων ἢ οἰκιῶν — 土地や家を持つ者."
  35: "ἐτίθουν παρὰ τοὺς πόδας — 足元に置き; καθότι ἄν τις χρείαν εἶχεν — それぞれの必要に応じて."
  36: "Βαρναβᾶς — バルナバ, «сын утешения»; 慰めの子. Λευίτης, Κύπριος — レビ人、キプロス生まれ."
  37: "χρῆμα — 代金. Стих продолжает 4:36; подлежащее — Иосиф-Варнава."
