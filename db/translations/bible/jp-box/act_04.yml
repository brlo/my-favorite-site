# jp-box, Деяния апостолов, глава 4. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 4: арест Петра и Иоанна (1–4), допрос в синедрионе (5–12), совещание
# и запрет (13–22), молитва общины (23–31), общее имение (32–37).
# Красного (<j>) в главе нет: Христос здесь не говорит. Слова Петра (4:8–12),
# синедриона (4:16–17, 4:18) и молитва общины (4:24–30) — не красные.
# Синего (<mo>) нет.
# 〔…〕: 4:8 — церковное «старейшины Израильские». Место базы в квадратных скобках
# (4:4 [ὡς]) не обёрнуто; 4:5 обрывается на «ἐν Ἰερουσαλήμ [», а 4:6 закрывается
# «]» — весь стих 4:6 в базе есть, поэтому 〔…〕 не ставится. jp-ni не использовался.

