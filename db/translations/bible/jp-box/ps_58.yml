verses:
  0: "指揮者[しきしゃ]に。「滅[ほろ]ぼすな」の調[しら]べで。ダビデの詩[うた]、碑[ひ]文[ぶん]として。サウルが人[ひと]を遣[つか]わし、ダビデを殺[ころ]そうとしてその家[いえ]を見張[みは]ったとき。"
  1: "神[かみ]よ、わたしを敵[てき]から救[すく]い出[だ]し、わたしに立[た]ち向[む]かう者[もの]から贖[あがな]い出[だ]してください。"
  2: "不[ふ]法[ほう]を働[はたら]く者[もの]からわたしを救[すく]い、血[ち]を流[なが]す者[もの]からわたしを助[たす]けてください。"
  3: "見[み]よ、彼[かれ]らはわたしの魂[たましい]をねらって罠[わな]をかけ、強[つよ]い者[もの]たちがわたしに襲[おそ]いかかる。主[しゅ]よ、わたしには不[ふ]法[ほう]も罪[つみ]もない。"
  4: "わたしに不[ふ]法[ほう]がないのに、彼[かれ]らは走[はし]って攻[せ]めかかってくる。わたしに会[あ]うために立[た]ち上[あ]がり、ご覧[らん]ください。"
  5: "主[しゅ]、万軍[ばんぐん]の神[かみ]、イスラエルの神[かみ]よ、目[め]を留[と]めて、すべてもろもろの民[たみ]を訪[おとず]れてください。不[ふ]法[ほう]を働[はたら]く者[もの]を、だれひとりあわれまないでください。"
  6: "彼[かれ]らは夕[ゆう]べに戻[もど]ってきて、犬[いぬ]のように飢[う]え、声[こえ]をあげて都[みやこ]を巡[めぐ]る。"
  7: "見[み]よ、彼[かれ]らは口[くち]で語[かた]り、その唇[くちびる]には剣[つるぎ]がある。「だれが聞[き]くものか」と。"
  8: "しかし、主[しゅ]よ、あなたは彼[かれ]らを笑[わら]い、すべてもろもろの民[たみ]を軽[かろ]んじられる。"
  9: "わたしの力[ちから]よ、わたしはあなたにこそ身[み]を寄[よ]せる。神[かみ]こそ、わたしを守[まも]る方[かた]である。"
  10: "わたしの神[かみ]は、その恵[めぐ]みをもってわたしに先立[さきだ]たれ、わたしの敵[てき]をわたしに見[み]せてくださる。"
  11: "彼[かれ]らを殺[ころ]さないでください。わたしの民[たみ]が、それを忘[わす]れてしまわないように。あなたの力[ちから]によって彼[かれ]らを散[ち]らし、彼[かれ]らを低[ひく]くしてください。わたしを守[まも]る主[しゅ]よ。"
  12: "その口[くち]の罪[つみ]、その唇[くちびる]の言葉[ことば]のゆえに、彼[かれ]らがその高[たか]ぶりによって捕[と]らえられるように。のろいと偽[いつわ]りとから、その終[おわ]りが告[つ]げられる。"
  13: "怒[いか]りのうちに、彼[かれ]らを終[お]わらせ、彼[かれ]らがなくなるように。人[ひと]は、神[かみ]がヤコブを、地[ち]の果[は]てまで治[おさ]めておられることを知[し]る。"
  14: "彼[かれ]らは夕[ゆう]べに戻[もど]ってきて、犬[いぬ]のように飢[う]え、声[こえ]をあげて都[みやこ]を巡[めぐ]る。"
  15: "彼[かれ]らは食[た]べ物[もの]を求[もと]めてさまよい、満[み]たされなければ、つぶやく。"
  16: "しかし、わたしはあなたの力[ちから]を歌[うた]い、朝[あさ]にはあなたの恵[めぐ]みを喜[よろこ]ぶ。あなたはわたしを守[まも]る方[かた]、わたしの苦[くる]しみの日[ひ]の逃[に]げ場[ば]となってくださったからである。"
  17: "わたしの助[たす]けよ、わたしはあなたをほめたたえる。神[かみ]よ、あなたはわたしを守[まも]る方[かた]、わたしの神[かみ]、わたしの恵[めぐ]みである。"

notes:
  0: "Εἰς τὸ τέλος· μὴ διαφθείρῃς· τῷ Δαυιδ εἰς στηλογραφίαν, ὁπότε ἀπέστειλεν Σαουλ καὶ ἐφύλαξεν τὸν οἶκον αὐτοῦ τοῦ θανατῶσαι αὐτόν — 指揮者に。「滅ぼすな」の調べで。ダビデの詩、碑文として。サウルが人を遣わし、ダビデを殺そうとしてその家を見張ったとき (φυλάσσω — «стеречь»; στηλογραφία — 碑文)."
  1: "Ἐξελοῦ με ἐκ τῶν ἐχθρῶν μου — 敵から救い出してください (ἐξαιρέω). ἐκ τῶν ἐπανιστανομένων ἐπ᾽ ἐμὲ λύτρωσαί με — 立ち向かう者から贖い出してください (ἐπανίστημι — «восставать»; λυτρόω — «выкупать»)."
  2: "ῥῦσαί με ἐκ τῶν ἐργαζομένων τὴν ἀνομίαν — 不法を働く者から救い (ῥύομαι — «избавлять»). ἐξ ἀνδρῶν αἱμάτων σῶσόν με — 血を流す者から助けてください (ἄνδρες αἱμάτων — «мужи кровей»)."
  3: "ἐθήρευσαν τὴν ψυχήν μου — 魂をねらって罠をかけ (θηρεύω — «ловить, охотиться»). ἐπέθεντο ἐπ᾽ ἐμὲ κραταιοί — 強い者たちが襲いかかる (ἐπιτίθημι — «нападать»). οὔτε ἡ ἀνομία μου οὔτε ἡ ἁμαρτία μου, κύριε — 主よ、わたしには不法も罪もない (двойное отрицание сохранено)."
  4: "ἄνευ ἀνομίας ἔδραμον καὶ κατεύθυναν — わたしに不法がないのに、彼らは走って攻めかかる (κατευθύνω — «направлять»; слав. «беззаконие… текоша и исправиша»). ἐξεγέρθητι εἰς συνάντησίν μου καὶ ἰδέ — わたしに会うために立ち上がり、ご覧ください."
  5: "κύριε ὁ θεὸς τῶν δυνάμεων — 万軍の神、主 (δυνάμεις — «силы, воинства»). ὁ θεὸς Ισραηλ — イスラエルの神. πρόσχες τοῦ ἐπισκέψασθαι πάντα τὰ ἔθνη — 目を留めて、すべてもろもろの民を訪れてください (ἐπισκέπτομαι — «посещать»). μὴ οἰκτιρήσῃς πάντας τοὺς ἐργαζομένους τὴν ἀνομίαν — 不法を働く者を、だれひとりあわれまないでください (οἰκτίρω — «миловать»)."
  6: "ἐπιστρέψουσιν εἰς ἑσπέραν — 夕べに戻ってきて. λιμώξουσιν ὡς κύων — 犬のように飢え声をあげ (λιμώσσω — «голодать, выть»). κυκλώσουσιν πόλιν — 都を巡る. Стих повторён в ст. 14 — повтор сохранён."
  7: "ἀποφθέγξονται ἐν τῷ στόματι αὐτῶν — 口で語り (ἀποφθέγγομαι — «изрекать»). ῥομφαία ἐν τοῖς χείλεσιν αὐτῶν — 唇には剣がある. ὅτι τίς ἤκουσεν — 「だれが聞くものか」 (их речь — 「」)."
  8: "καὶ σύ, κύριε, ἐκγελάσῃ αὐτούς — しかし、主よ、あなたは彼らを笑い (ἐκγελάω — «осмеивать»). ἐξουδενώσεις πάντα τὰ ἔθνη — すべてもろもろの民を軽んじられる (ἐξουδενόω — «уничижать»)."
  9: "τὸ κράτος μου, πρὸς σὲ φυλάξω — わたしの力よ、わたしはあなたにこそ身を寄せる (κράτος — «крепость, сила»; φυλάσσω πρός — «хранить себя к», т. е. обращаться). ὅτι ὁ θεὸς ἀντιλήμπτωρ μου εἶ — 神はわたしを守る方 (ἀντιλήμπτωρ — «заступник»)."
  10: "ὁ θεός μου, τὸ ἔλεος αὐτοῦ προφθάσει με — わたしの神は、その恵みをもってわたしに先立たれ (προφθάνω — «предварять»). ὁ θεὸς δείξει μοι ἐν τοῖς ἐχθροῖς μου — わたしの敵をわたしに見せてくださる (слав. «показа ми на враги моя»)."
  11: "μὴ ἀποκτείνῃς αὐτούς, μήποτε ἐπιλάθωνται τοῦ λαοῦ μου — 彼らを殺さないでください、わたしの民がそれを忘れないように (ἐπιλανθάνομαι — «забывать»). διασκόρπισον αὐτοὺς ἐν τῇ δυνάμει σου — あなたの力によって散らし. κατάγαγε αὐτούς — 彼らを低くしてください (κατάγω — «низводить»). ὁ ὑπερασπιστής μου κύριε — わたしを守る主よ (ὑπερασπιστής — «щит, защитник»)."
  12: "ἁμαρτίαν στόματος αὐτῶν, λόγον χειλέων αὐτῶν — その口の罪、その唇の言葉 (вин. падеж как восклицание). συλλημφθήτωσαν ἐν τῇ ὑπερηφανίᾳ αὐτῶν — その高ぶりによって捕らえられるように (συλλαμβάνω — «захватывать»). ἐξ ἀρᾶς καὶ ψεύδους διαγγελήσονται συντέλειαι — のろいと偽りとから、その終わりが告げられる (ἀρά — «проклятие»; συντέλεια — «конец, погибель»)."
  13: "ἐν ὀργῇ συντελείας — 怒りのうちに、終わらせ (συντέλεια — «завершение»). οὐ μὴ ὑπάρξωσιν — 彼らがなくなるように. γνώσονται ὅτι ὁ θεὸς δεσπόζει τοῦ Ιακωβ — 神がヤコブを治めておられることを知る (δεσπόζω — «владычествовать»). τῶν περάτων τῆς γῆς — 地の果てまで."
  14: "Повтор ст. 6 — враги возвращаются; текст совпадает, как в греч."
  15: "αὐτοὶ διασκορπισθήσονται τοῦ φαγεῖν — 食べ物を求めてさまよい (διασκορπίζομαι — «рассеиваться»). ἐὰν δὲ μὴ χορτασθῶσιν, καὶ γογγύσουσιν — 満たされなければつぶやく (γογγύζω — «роптать»)."
  16: "ἐγὼ δὲ ᾄσομαι τῇ δυνάμει σου — しかし、わたしはあなたの力を歌う. ἀγαλλιάσομαι τὸ πρωῒ τὸ ἔλεός σου — 朝にはあなたの恵みを喜ぶ (τὸ πρωΐ — «рано утром»). ἐγενήθης ἀντιλήμπτωρ μου καὶ καταφυγὴ ἐν ἡμέρᾳ θλίψεώς μου — 苦しみの日の逃げ場となってくださった (καταφυγή — «убежище»)."
  17: "βοηθός μου, σοὶ ψαλῶ — わたしの助けよ、わたしはあなたをほめたたえる (βοηθός — «помощник»). ὁ θεός, ἀντιλήμπτωρ μου εἶ — あなたはわたしを守る方. ὁ θεός μου, τὸ ἔλεός μου — わたしの神、わたしの恵み (последнее — как обращение, слав. «Боже мой, милость моя»)."
