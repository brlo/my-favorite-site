# jp-box, Псалтирь, псалом 58. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный 常体, без 文語.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0.
# Псалом 58: молитва о избавлении от кровожадных (1–2), они подстерегают (3–5),
# вечерний вой псов (6–7), смех Божий (8), сила и милость Божия (9–11),
# суд над клевещущими (12–13), повтор вечернего воя (14–15), хвала (16–17).
# Красного и синего нет. Кавычки: слова врагов в 7 — 「…」 (первый уровень).
# 〔…〕 нет: все слова в gr-lxx-byz есть (сверено с выгрузкой).
# セラ (διάψαλμα, в 5 и 13) не передаётся — по решению пользователя, как у jp-joc.
# Сносок ⟨…⟩ нет: 犬, 網, 塔 уже встречались в корпусе.
# jp-ni не использовался.

