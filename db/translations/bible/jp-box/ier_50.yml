verses:
  1: "エレミヤが、主[しゅ]が彼を遣[つか]わして彼らに告[つ]げさせた主[しゅ]のすべての言葉[ことば]、これらのすべての言葉[ことば]を民[たみ]に語[かた]り終[お]えたとき、"
  2: "マアセヤの子[こ]アザルヤと、カレアの子[こ]ヨハナン、およびエレミヤに『あなたは偽[いつわ]りを言[い]う』と言[い]っていた傲慢[ごうまん]な者[もの]たちはみな、エレミヤに言[い]った。「偽[いつわ]りだ。わたしたちの神[かみ]である主[しゅ]は、あなたを遣[つか]わして『エジプトへ入[はい]ってそこに住[す]むな』と言[い]わせはしなかった。"
  3: "バルク、ネリヤの子[こ]があなたをそそのかしてわたしたちに逆[さから]わせ、わたしたちをカルデア人[じん]の手[て]に渡[わた]して殺[ころ]させ、バビロンへ捕囚[ほしゅう]として移[うつ]させるのだ。」"
  4: "しかしヨハナンも、軍[ぐん]のすべての長[ちょう]たちも、民[たみ]もみな、ユダの地[ち]に住[す]むために主[しゅ]の声[こえ]に聞[き]き従[したが]わなかった。"
  5: "ヨハナンと軍[ぐん]のすべての長[ちょう]たちは、すべての国[くに]々[ぐに]から帰[かえ]って来[き]てユダの地[ち]に住[す]もうとしていたユダの残[のこ]りの者[もの]たちを、みな連[つ]れて行[い]った。"
  6: "すなわち、力[ちから]ある男[おとこ]たち、女[おんな]たち、幼[おさな]い子[こ]ら、王[おう]の娘[むすめ]たち、およびアヒカムの子[こ]ゲダルヤのもとに親衛隊[しんえいたい]の長[ちょう]ネブザルアダンが残[のこ]したすべての人[ひと]々[びと]、また預言者[よげんしゃ]エレミヤと、ネリヤの子[こ]バルクである。"
  7: "彼らはエジプトへ入[はい]った。主[しゅ]の声[こえ]に聞[き]き従[したが]わなかったからである。そしてタフナヘスに達[たっ]した。"
  8: "タフナヘスで、主[しゅ]の言葉[ことば]がエレミヤに臨[のぞ]んで言[い]った。"
  9: "「あなたは自分[じぶん]のために大[おお]きな石[いし]を取[と]り、タフナヘスにあるファラオの家[いえ]の門[もん]の入口[いりぐち]で、ユダの人[ひと]々[びと]の目[め]の前[まえ]にそれを隠[かく]せ。"
  10: "そして彼らに言[い]え。万軍[ばんぐん]の主[しゅ]、イスラエルの神[かみ]はこう言[い]われる。見[み]よ、わたしは遣[つか]わして、わたしのしもべであるバビロンの王[おう]ネブカドネツァルを連[つ]れて来[く]る。彼は自分[じぶん]の王座[おうざ]を、あなたが隠[かく]したこれらの石[いし]の上[うえ]に置[お]き、その武器[ぶき]をそれらの上[うえ]に上[あ]げる。"
  11: "彼は来[き]てエジプトの地[ち]を打[う]つ。死[し]に定[さだ]められた者[もの]は死[し]へ、死[し]へ。捕囚[ほしゅう]に定[さだ]められた者[もの]は捕囚[ほしゅう]へ、捕囚[ほしゅう]へ。剣[つるぎ]に定[さだ]められた者[もの]は剣[つるぎ]へ、剣[つるぎ]へ。"
  12: "彼は彼らの神[かみ]々[がみ]の家[いえ]に火[ひ]を放[はな]ち、それらを焼[や]いて、彼らを捕囚[ほしゅう]として移[うつ]し、羊飼[ひつじかい]が自分[じぶん]の衣[ころも]をまとうようにエジプトの地[ち]をまとう。そして彼は平安[へいわ]のうちに出[で]て行[い]く。"
  13: "彼はオンにあるヘリオポリスの柱[はしら]を砕[くだ]き、彼らの家[いえ]を火[ひ]で焼[や]き払[はら]う。」"

notes:
  1: "Καὶ ἐγενήθη ὡς ἐπαύσατο Ιερεμιας λέγων πρὸς τὸν λαόν — «и было, когда перестал Иеремия говорить народу» (παύω — прекращать); πάντας τοὺς λόγους κυρίου, οὓς ἀπέστειλεν αὐτὸν κύριος πρὸς αὐτούς — «все слова Господни, с которыми послал его Господь к ним»; πάντας τοὺς λόγους τούτους — «все эти слова»: слав. конца стиха не имеет — в тексте по греч., без скобок. Стих — начало фразы, главное предложение в 2."
  2: "καὶ εἶπεν Αζαριας υἱὸς Μαασαιου καὶ Ιωαναν υἱὸς Καρηε — Азария, сын Маасея, и Иоханан, сын Карея; πάντες οἱ ἄνδρες οἱ εἴπαντες τῷ Ιερεμια λέγοντες — «все мужи, сказавшие Иеремии, говоря» (плеоназм, в тексте описательный оборот). Слав. добавляет «презорливии» (дерзкие, надменные) — нет в LXX, в тексте 傲慢. Ψεῦδη, οὐκ ἀπέστειλέν σε κύριος πρὸς ἡμᾶς — «ложь, не послал тебя к нам Господь»; слав. добавляет «Бог наш» — по греч. только κύριος. Слова Господа, которые они отрицают, — 『…』."
  3: "ἀλλ' ἢ Βαρουχ υἱὸς Νηριου συμβάλλει σε πρὸς ἡμᾶς — «но Варух, сын Нирии, подстрекает тебя против нас» (συμβάλλω — сталкивать, наущать); ἵνα δῷς ἡμᾶς εἰς χεῖρας τῶν Χαλδαίων — «чтобы ты предал нас в руки Халдеев»; τοῦ θανατῶσαι ἡμᾶς — «чтобы умертвить нас» (θανατόω); ἀποικισθῆναι ἡμᾶς εἰς Βαβυλῶνα — «и переселить нас в Вавилон» (ἀποικίζω — выселять). Слав. «подущает тя на нас»."
  4: "καὶ οὐκ ἤκουσεν Ιωαναν καὶ πάντες οἱ ἡγεμόνες τῆς δυνάμεως καὶ πᾶς ὁ λαός — «и не послушал Иоханан, и все начальники войска, и весь народ»; τῆς φωνῆς κυρίου κατοικῆσαι ἐν γῇ Ιουδα — «гласа Господа, чтобы остаться в земле Иуды». Слав. вставляет «(не послушаша)» — повтор, не переведён."
  5: "πάντας τοὺς καταλοίπους Ιουδα — «весь остаток Иуды»; τοὺς ἀποστρέψαντας κατοικεῖν ἐν τῇ γῇ — «обратившихся, чтобы жить в земле»; слав. распространяет: «возвращеныя от всех языков, аможе разсеяни быша» (すべての国々から帰って来た者たち) — нет в LXX, внесено в текст без скобок."
  6: "τοὺς δυνατοὺς ἄνδρας — «мужей сильных»; τὰ νήπια — «младенцев» (νήπιος — дитя); τὰς θυγατέρας τοῦ βασιλέως — «дочерей царя»; τὰς ψυχάς, ἃς κατέλιπεν Ναβουζαρδαν μετὰ Γοδολιου υἱοῦ Αχικαμ — «души, которые оставил Навузардан с Годолией, сыном Ахикама»; слав. добавляет «воевода силы» (親衛隊の長) и «сына Сафанова» — нет в LXX; в тексте при имени Навузардан стоит 親衛隊の長 по слав."
  7: "καὶ εἰσῆλθον εἰς Αἴγυπτον, ὅτι οὐκ ἤκουσαν τῆς φωνῆς κυρίου — «и вошли в Египет, ибо не послушали гласа Господа»; εἰσῆλθον εἰς Ταφνας — «вошли в Тафну» (Ταφνας, евр. Тафнис, タフナヘス)."
  8: "Καὶ ἐγένετο λόγος κυρίου πρὸς Ιερεμιαν ἐν Ταφνας λέγων — «и было слово Господне к Иеремии в Тафне, говоря». Вводная формула, кавычек нет."
  9: "Λαβὲ σεαυτῷ λίθους μεγάλους — «возьми себе камни большие»; κατάκρυψον αὐτοὺς ἐν προθύροις ἐν πύλῃ τῆς οἰκίας Φαραω — «скрой их в преддверии (πρόθυρον) при воротах дома фараона»; κατ' ὀφθαλμοὺς ἀνδρῶν Ιουδα — «пред глазами мужей Иудеи». Слав. добавляет «и речеши к ним» — в греч. это начало ст. 10 (καὶ ἐρεῖς), в тексте по греч."
  10: "Οὕτως εἶπεν κύριος — «так говорит Господь»; слав. добавляет «сил, Бог израилев» и «раба моего» — нет в греч. модуля, в тексте без скобок. θήσει αὐτοῦ τὸν θρόνον ἐπάνω τῶν λίθων τούτων — «поставит престол свой на этих камнях»; ἀρεῖ τὰ ὅπλα αὐτοῦ ἐπ' αὐτούς — «поднимет оружие своё на них» (αἴρω — поднимать); в ru «раскинет шатёр» — чтение МТ, не внесено."
  11: "πατάξει γῆν Αἰγύπτου — «поразит землю Египта»; οὓς εἰς θάνατον, εἰς θάνατον — «которые на смерть, на смерть»: тройной повтор (смерть, переселение, меч) сохранён; ἀποικισμός — переселение, плен."
  12: "καύσει πῦρ ἐν οἰκίαις θεῶν αὐτῶν — «сожжёт огнём дома богов их»; ἐμπυριεῖ — сожжёт; ἀποικιεῖ αὐτοὺς — переселит их; φθειριεῖ γῆν Αἰγύπτου, ὥσπερ φθειρίζει ποιμὴν τὸ ἱμάτιον αὐτοῦ — «оберёт (букв. вычешет вшей с) землю Египетскую, как пастух вычёсывает одежду свою» (φθειρίζω — вычёсывать вшей). Слав. читает «покрыет... якоже покрывается пастух ризою своею» — церковное чтение, в тексте まとう, вариант LXX — здесь. ἐξελεύσεται ἐν εἰρήνῃ — «выйдет с миром»."
  13: "συντρίψει τοὺς στύλους Ἡλίου πόλεως τοὺς ἐν Ων — «сокрушит столпы Гелиополя (Ἡλίου πόλις), что в Оне» (Ων — Он, евр. Беф-Шемеш); слав. «столпы илиуполя, иже во египте» — имя Он заменено на «в Египте»; в тексте по LXX (オン), слав. чтение — здесь. τὰς οἰκίας αὐτῶν κατακαύσει ἐν πυρί — «дома их сожжёт огнём»; слав. «домы богов египетских»."
