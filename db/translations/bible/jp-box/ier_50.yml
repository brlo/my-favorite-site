# jp-box, Иеремия, глава 50. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc этой главы не имеет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 50 — уход в Египет (в слав./ru это глава 43).
# План: 1 Иеремия кончает речь к народу; 2–3 Азария, Иоханан и дерзкие люди
# обвиняют его: «ты лжёшь», «Варух подстрекает тебя»; 4 народ не слушает гласа
# Господа; 5–6 Иоханан уводит остаток Иуды — мужей, жён, детей, царских дочерей,
# оставленных Навузарданом, Иеремию и Варуха; 7 приходят в Египет и в Тафну; 8 там
# слово Господне; 9–13 слово Господа: взять большие камни и скрыть их при входе в
# дом фараона, «Я приведу Навуходоносора, он поставит престол на этих камнях»,
# поразит Египет, сожжёт капища богов, сокрушит столпы Гелиополя.
# Голоса: 1 — авторский текст; 2–3 — 「…」 (речь Азарии, Иоханана и дерзких; слова
# Господа, которые они отрицают, — вложенная 『…』); 4–8 — авторский текст; 9–13 —
# 「…」 (слово Господа пророку; формулы «так говорит Господь» и «и скажи им» внутри
# речи кавычек не разрывают).
# Нумерация по gr: 13 стихов; слав. это глава 43, номер в номер; «точек» нет.
# 〔…〕 нет; сносок ⟨…⟩ нет: 王座, 捕囚, ぶどう園, 農夫, 台座, 海（洗盤）, 網細工
# уже в корпусе, пояснения — в notes.
# Имена — транслитерация греческого (LXX): エレミヤ, アザルヤ, ヨハナン, バルク
# (Βαρουχ), ネリヤ (Νηριας), アヒカム, ゲダルヤ, ネブザルアダン (Ναβουζαρδαν,
# как в 4 Цар 25), ネブカドネツァル, タフナヘス (Ταφνας), ヘリオポリス / オン.

