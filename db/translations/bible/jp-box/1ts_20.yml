draft: true

verses:
  1: "ダビデはラマのナワトから逃[に]げ、ヨナタンのもとに来[き]て言[い]った。「わたしは何[なに]をしたのか。わたしの不正[ふせい]は何[なに]か。わたしはあなたの父[ちち]の前[まえ]で何[なに]の罪[つみ]を犯[おか]したのか。父[ちち]がわたしの命[いのち]を求[もと]めているというのか。」"
  2: "ヨナタンは彼[かれ]に言[い]った。「決[けっ]してそんなことはない。あなたは死[し]なない。見[み]よ、わたしの父[ちち]は、大[おお]きなことも小[ちい]さなことも、わたしの耳[みみ]に明[あ]かさずにはしない。どうして父がこのことをわたしに隠[かく]すことがあろうか。そんなことはない。」"
  3: "ダビデはヨナタンに答[こた]えて言[い]った。「あなたの父[ちち]は、わたしがあなたの目[め]に恵[めぐ]みを得[え]たことをよく知[し]っている。そしてこう言[い]っている。『ヨナタンにこのことを知[し]らせるな。彼[かれ]がそれを望[のぞ]まなくなるといけないからだ。』しかし、主[しゅ]は生[い]きておられ、あなたの命[いのち]も生[い]きている。わたしが言[い]ったとおり、わたしと死[し]との間[あいだ]は、もう満[み]ちている。」"
  4: "ヨナタンはダビデに言[い]った。「あなたの心[こころ]は何[なに]を望[のぞ]むのか。わたしはあなたに何[なに]をしてあげようか。」"
  5: "ダビデはヨナタンに言[い]った。「見[み]よ、明日[あした]は新月[しんげつ]の祭[まつ]りだ。わたしは王[おう]とともに座[すわ]って食[た]べることはしない。だから、わたしを遣[つか]わしてくれ。わたしは夕方[ゆうがた]まで野[の]に隠[かく]れている。」"
  6: "もしあなたの父[ちち]がわたしのことを尋[たず]ねたら、こう言[い]ってくれ。『ダビデはわたしに、自分の町[まち]ベツレヘムへ行[い]かせてほしいと願[ねが]い出[で]た。あそこでは部族[ぶぞく]のすべてのために、その日[ひ]のいけにえがあるからだ。』"
  7: "もし父が『よし』と言[い]えば、あなたの僕[しもべ]に平安[へいあん]がある。しかし、もし父が激[はげ]しく答[こた]えたなら、悪[あく]が父[ちち]によって決[き]められたと知[し]るがよい。"
  8: "あなたは僕[しもべ]に慈[いつく]しみを施[ほどこ]してくれ。あなたは僕[しもべ]を、あなた自身[じしん]との主[しゅ]の契約[けいやく]の中[なか]に入[い]れたのだから。もし僕[しもべ]に不正[ふせい]があるなら、あなたがわたしを殺[ころ]してくれ。なぜ、あなたはわたしをあなたの父[ちち]のもとへ連[つ]れて行[い]こうとするのか。"
  9: "ヨナタンは言[い]った。「決[けっ]してそんなことはない。もし父[ちち]によって、あなたに下[くだ]す悪[あく]が決[き]められたと確[たし]かに知[し]ったなら、たとえあなたが自分の町々[まちまち]にいなくても、わたしはあなたに告[つ]げる。」"
  10: "ダビデはヨナタンに言[い]った。「もしあなたの父[ちち]が激[はげ]しく答[こた]えたら、だれがわたしに告[つ]げるのか。」"
  11: "ヨナタンはダビデに言[い]った。「行[い]って、野[の]に留[とど]まっていてくれ。」そして二人[ふたり]は野に出[で]た。"
  12: "ヨナタンはダビデに言[い]った。「イスラエルの神[かみ]、主[しゅ]は知[し]っておられる。わたしは明日[あす]か三日目[みっかめ]に、時[とき]が来[き]れば父[ちち]を調[しら]べる。そして、見[み]よ、ダビデについて良[よ]いことであれば、わたしはあなたに野[の]へ人[ひと]を送[おく]らない。"
  13: "神[かみ]がヨナタンにこうし、さらにこう加[くわ]えられるように。わたしはあなたに悪[あく]を告[つ]げ、あなたの耳[みみ]を開[ひら]き、あなたを去[さ]らせる。あなたは平安[へいあん]のうちに行[い]くがよい。主[しゅ]があなたとともにいてくださるように。かつてわたしの父[ちち]とともにいてくださったように。"
  14: "わたしがまだ生[い]きている間[あいだ]は、わたしに主[しゅ]の慈[いつく]しみを施[ほどこ]してくれ。そして、わたしが死[し]んでしまっても、"
  15: "あなたの慈[いつく]しみを、わたしの家[いえ]から永遠[えいえん]に取[と]り去[さ]らないでくれ。主[しゅ]がダビデの敵[てき]を、一人[ひとり]ひとり地[ち]の面[おもて]から取[と]り除[のぞ]かれるときにも。"
  16: "ヨナタンの名[な]がダビデの家[いえ]から断[た]たれるなら、主[しゅ]がダビデの敵[てき]からそれを求[もと]められるように。」"
  17: "ヨナタンはさらにダビデに誓[ちか]った。自分[じぶん]を愛[あい]する者[もの]の魂[たましい]を、彼は愛していたからである。"
  18: "ヨナタンは彼に言[い]った。「明日[あす]は新月[しんげつ]の祭[まつ]りだ。あなたの席[せき]が空[あ]いているのが見[み]つかるだろう。"
  19: "三日目[みっかめ]には、あなたは下[くだ]って、身[み]を隠[かく]したあの場所[ばしょ]へ行[い]き、あのエルガブのそばに座[すわ]っているがよい。"
  20: "わたしは三度[さんど]、矢[や]をアマッタリの方[ほう]へ射[い]て送[おく]り出[だ]す。"
  21: "そして、見[み]よ、わたしは若者[わかもの]を遣[つか]わして言[い]う。『行[い]って、矢[や]を探[さが]して来[こ]い。』もしわたしがその若者に『見[み]よ、矢[や]はあなたのこちら側[がわ]にある。それを取[と]れ』と言[い]ったなら、あなたは来[き]なさい。あなたに平安[へいあん]があり、何[なに]の事[こと]もないからだ。主[しゅ]は生[い]きておられる。"
  22: "しかし、もしわたしが若者[わかもの]に『見[み]よ、矢[や]はあなたの向[む]こう側[がわ]にある』と言[い]ったなら、あなたは行[い]きなさい。主[しゅ]があなたを遣[つか]わされたのだから。"
  23: "わたしとあなたが語[かた]ったその言葉[ことば]については、見[み]よ、主[しゅ]が永遠[えいえん]に、わたしとあなたの間[あいだ]の証人[しょうにん]でいてくださる。」"
  24: "ダビデは野[の]に身を隠[かく]した。新月[しんげつ]の日[ひ]が来[き]て、王[おう]は食[た]べるために食卓[しょくたく]についた。"
  25: "王[おう]はいつものように、壁[かべ]に沿[そ]った自分の席[せき]に、ヨナタンより先[さき]に座[すわ]った。アベネルはサウルのそばに座[すわ]った。ダビデの席[せき]は空[あ]いていた。"
  26: "サウルはその日[ひ]、何[なに]も言[い]わなかった。「これは偶[ぐう]然[ぜん]のことだ。彼は汚[けが]れている。きよめられていないのだ」と思[おも]ったからである。"
  27: "翌日[よくじつ]、新月[しんげつ]の祭[まつ]りの二日目[ふつかめ]になって、ダビデの席[せき]はやはり空[あ]いていた。サウルは息子[むすこ]ヨナタンに言[い]った。「なぜエッサイの子[こ]は、昨日[きのう]も今日[きょう]も、食卓[しょくたく]に来[こ]ないのか。」"
  28: "ヨナタンはサウルに答[こた]えて言[い]った。「ダビデはわたしに、自分の町[まち]ベツレヘムへ行[い]くことを願[ねが]い出[で]た。"
  29: "そして言[い]った。『どうか、わたしを行[い]かせてほしい。わたしたちの町[まち]では部族[ぶぞく]のいけにえがあり、兄弟[きょうだい]たちがわたしに命[めい]じた。もしあなたの目[め]に恵[めぐ]みを得[え]ているなら、無事[ぶじ]に去[さ]らせて、兄弟たちに会[あ]いたい。』それで彼は王[おう]の食卓[しょくたく]に来[こ]なかったのだ。」"
  30: "サウルはヨナタンに激[はげ]しく怒[いか]り、彼に言[い]った。「逃亡[とうぼう]する女[おんな]たちの子[こ]めが。あなたはエッサイの子[こ]と組[く]んで、自分[じぶん]の恥[はじ]、母[はは]の恥[はじ]を招[まね]いていることを、わたしが知[し]らないとでも思[おも]うのか。"
  31: "エッサイの子[こ]が地[ち]の上[うえ]に生[い]きている限[かぎ]り、あなたの王国[おうこく]は成[な]り立[た]たない。今[いま]、人[ひと]を遣[つか]わして彼[かれ]をわたしのところへ連[つ]れて来[こ]させなさい。彼は死[し]の子[こ]なのだ。」"
  32: "ヨナタンは父[ちち]サウルに答[こた]えて言[い]った。「なぜ彼は死[し]ぬのか。彼が何[なに]をしたというのか。」"
  33: "サウルはヨナタンを殺[ころ]そうとして、槍[やり]を彼[かれ]に向[む]けて振[ふ]り上[あ]げた。ヨナタンは、父[ちち]がダビデを殺すことを決[き]めたのを知[し]った。"
  34: "ヨナタンは怒[いか]りに燃[も]えて食卓[しょくたく]から立[た]ち上[あ]がり、その月[つき]の二日目[ふつかめ]にはパンを食[た]べなかった。ダビデのことで心[こころ]を痛[いた]めたからであり、父[ちち]が彼に対して悪[あく]を成[な]し遂[と]げたからである。"
  35: "朝[あさ]になると、ヨナタンはダビデとの証[あかし]のために定[さだ]めたとおりに野[の]へ出[で]た。小[ちい]さな若者[わかもの]が彼とともにいた。"
  36: "彼は若者[わかもの]に言[い]った。「走[はし]って、わたしが射[い]る矢[や]を探[さが]して来[こ]い。」若者が走[はし]ると、彼はその矢[や]を射[い]て、それを越[こ]えて飛[と]ばした。"
  37: "若者[わかもの]が、ヨナタンが矢[や]を射[い]た場所[ばしょ]まで来[き]たとき、ヨナタンは若者の後[うし]ろから叫[さけ]んで言[い]った。「そこだ。矢[や]はあなたの向[む]こう側[がわ]にある。」"
  38: "ヨナタンは若者の後[うし]ろからさらに叫[さけ]んで言[い]った。「急[いそ]げ。早[はや]く行[い]け。止[と]まるな。」若者はヨナタンの矢[や]を集[あつ]めて、主人[しゅじん]のもとへ持[も]って来[き]た。"
  39: "若者[わかもの]は何[なに]も知[し]らなかった。ただヨナタンとダビデだけが、その事[こと]を知[し]っていた。"
  40: "ヨナタンは自分[じぶん]の武具[ぶぐ]を若者[わかもの]に渡[わた]して言[い]った。「行[い]って、町[まち]へ持[も]って帰[かえ]れ。」"
  41: "若者[わかもの]が入[はい]って行[い]くと、ダビデはあのエルガブのところから立[た]ち上[あ]がり、顔[かお]を地[ち]につけて三度[さんど]伏[ふ]し、彼を拝[おが]んだ。そして二人[ふたり]は互[たが]いに口[くち]づけし、互[たが]いのために大[おお]いに泣[な]いた。"
  42: "ヨナタンは言[い]った。「平安[へいあん]のうちに行[い]け。わたしたち二人[ふたり]が主[しゅ]の名[な]によって誓[ちか]って言[い]ったとおりに。『主[しゅ]が、わたしとあなたの間[あいだ]、わたしの子孫[しそん]とあなたの子孫の間の証人[しょうにん]でいてくださるように、永遠[えいえん]に。』」"

notes:
  1: "ἀπέδρα — убежал (ἀποδιδράσκω); Ναυαθ ἐν Ραμα — Наваф в Раме (слав. «наваф»; евр. Найот). ἐνώπιον Ιωναθαν — к Ионафану (букв. «пред Ионафаном»). ἐπιζητεῖ τὴν ψυχήν μου — ищет души моей, т. е. жизни."
  2: "Μηδαμῶς σοι — «да не будет тебе» (решительное отрицание). οὐ μὴ ἀποθάνῃς — «не умрёшь» (οὐ μή с сослагательным — усиленное). τὸ ὠτίον μου — ухо моё, т. е. мне; слав. «не открыет уха моего»."
  3: "Γινώσκων οἶδεν — «зная знает» (гебраизм, усиление). εὕρηκα χάριν ἐν ὀφθαλμοῖς σου — обрёл благодать в очах твоих. μὴ οὐ βούληται — «как бы не восхотел» (слав. «негли не восхощет»), т. е. чтобы не воспротивился. ἐμπέπλησται ἀνὰ μέσον μου καὶ τοῦ θανάτου — «исполнилось между мною и смертью»: мера полна, осталась смерть; слав. добавляет «и между отцем твоим» — в gr нет."
  4: "Τί ἐπιθυμεῖ ἡ ψυχή σου — чего желает душа твоя. τί ποιήσω σοι — что сделаю тебе."
  5: "νεομηνία — новомесячие (праздник новолуния). καθίσας οὐ καθίσομαι — «сев, не сяду» (гебраизм): мне не сидеть за столом. ἕως δείλης — до вечера (δείλη — время после полудня); слав. добавляет «дне третияго» — в gr нет."
  6: "Παραιτούμενος παρῃτῆσατο — «отпросившись отпросился» (усиление). θυσία τῶν ἡμερῶν — «жертва дней», вероятно годовая; в ru «годичное жертвоприношение»."
  7: "Ἀγαθῶς — «хорошо» (в тексте 『よし』). σκληρῶς — жёстко, сурово. συντετέλεσται ἡ κακία — зло решено, довершено."
  8: "εἰσήγαγες εἰς διαθήκην κυρίου — ввёл в завет Господень. εἰ ἔστιν ἀδικία — если есть неправда. ἕως τοῦ πατρός σου — «до отца твоего», т. е. к отцу твоему."
  9: "γινώσκων γνῶ — «узнав узнаю» (усиление). εἰς τὰς πόλεις σου — «в города твои»; слав. понимает иначе: «аще и не будеши во градех твоих»."
  10: "ἀπαγγελεῖ — возвестит. ἀποκριθῇ σκληρῶς — ответит сурово."
  11: "Πορεύου καὶ μένε εἰς ἀγρόν — иди и оставайся в поле; далее оба выходят в поле."
  12: "ἀνακρινῶ — допрошу, испытаю (ἀνακρίνω). ὡς ἂν ὁ καιρὸς τρισσῶς — «когда время трижды», т. е. на третий день; слав. «заутра, или третияго дне». οὐ μὴ ἀποστείλω — «не пошлю» (усиленное отрицание)."
  13: "τάδε ποιήσαι ὁ θεὸς τῷ Ιωναθαν καὶ τάδε προσθείη — формула клятвы-самопроклятия («так да сотворит Бог… и так да приложит»). ἀνοίσω τὰ κακά — возвещу зло. ἐξαποστελῶ σε — отпущу тебя. В слав. при первом глаголе стоит «аще не» — условное самопроклятие; в gr его нет, держимся греческого. Связь со ст. 12 в греческом оборвана (анаколуф)."
  14: "καὶ μὲν ἔτι μου ζῶντος — «и пока я ещё жив». ποιήσεις ἔλεος μετ᾿ ἐμοῦ — сотворишь милость со мною."
  15: "οὐκ ἐξαρεῖς ἔλεός σου — не отнимешь милости твоей (ἐξαίρω). ἕως τοῦ αἰῶνος — до века. καὶ εἰ μή — «и если нет» (аподосис опущен; слав. «аще же ни»). ἐν τῷ ἐξαίρειν κύριον — когда Господь будет истреблять."
  16: "ἐξαρθῆναι τὸ ὄνομα — «быть изъяту имени»; в слав. наоборот: «да обрящется имя ионафане в дому давидове». ἐκζητῆσαι κύριος ἐχθροὺς τοῦ Δαυιδ — да взыщет Господь с врагов Давида. Стих тёмен; держимся греческого, чтение слав. отмечено."
  17: "προσέθετο ἔτι ὀμόσαι — «приложил ещё клясться». ἠγάπησεν ψυχὴν ἀγαπῶντος αὐτόν — «возлюбил душу любящего его» (слав. так же), т. е. любил его, как самого себя."
  18: "νουμηνία — новомесячие. ἐπισκεπήσῃ — будешь посещён, вспомянут. ἐπισκεπήσεται καθέδρα σου — место твоё будет пусто (слав. «праздно усмотрено будет место твое»)."
  19: "τρισσεύσεις — «промедлишь трижды», т. е. на третий день (слав. «премедлиши три дни»). ἐργαβ — непереведённое евр. слово (евр. «камень Азель», слав. «ергав»); в тексте エルガブ."
  20: "τρισσεύσω ταῖς σχίζαις — трижды [пущу] стрелы (σχίζα — стрела). ἀματταρι — непереведённое евр. слово (слав. «амаггариа»), вероятно «в цель»; в тексте アマッタリ."
  21: "σχίζα — стрела. Ὧδε… καὶ ὧδε — «здесь… и здесь», т. е. по эту сторону, близко. παραγίνου — приходи. οὐκ ἔστιν λόγος — «нет дела», т. е. ничего не случится."
  22: "Ὧδε… καὶ ἐπέκεινα — «здесь… и дальше», т. е. по ту сторону. ἐξαπέσταλκέν σε κύριος — Господь послал тебя."
  23: "τὸ ῥῆμα, ὃ ἐλαλήσαμεν — слово, которое мы говорили. κύριος μάρτυς — Господь свидетель. Речь Ионатана кончается здесь."
  24: "κρύπτεται — скрывается. ὁ μήν — месяц, т. е. новомесячие. ἐπὶ τὴν τράπεζαν — к столу."
  25: "ὡς ἅπαξ καὶ ἅπαξ — «как раз и раз», т. е. по обычаю (слав. «якоже и всегда»). προέφθασεν τὸν Ιωναθαν — «опередил Ионатана» (προφθάνω); ru «Ионафан встал» — иное понимание. Αβεννηρ — Авенир (アベネル)."
  26: "Σύμπτωμα φαίνεται — «кажется, случайность» (σύμπτωμα). μὴ καθαρὸς εἶναι — что он нечист. οὐ κεκαθάρισται — не очистился (ритуально)."
  27: "τῇ ἐπαύριον τοῦ μηνός — на другой день месяца. υἱὸς Ιεσσαι — сын Иессея (エッサイ; в корпусе Руфь и Мф — エッサイ)."
  28: "Παρῄτηται — отпросился (παραιτέομαι). ἕως εἰς Βηθλεεμ — в Вифлеем."
  29: "θυσία τῆς φυλῆς — жертва колена, рода. ἐνετείλαντο πρός με — заповедали мне. διασωθήσομαι — «буду сохранён», т. е. отпусти меня невредимым (слав. «да пойду»). διὰ τοῦτο — поэтому."
  30: "Υἱὲ κορασίων αὐτομολούντων — «сын девиц-перебежчиц» (грубое оскорбление; αὐτομολέω — перебегать). μέτοχος — сообщник. εἰς αἰσχύνην ἀποκαλύψεως μητρός σου — на срам откровения матери твоей, т. е. на позор матери."
  31: "οὐχ ἑτοιμασθήσεται ἡ βασιλεία σου — не устоит, не утвердится царство твоё. υἱὸς θανάτου — сын смерти, т. е. обречённый на смерть."
  32: "Ἵνα τί ἀποθνῄσκει — «к чему он умирает». τί πεποίηκεν — что сделал."
  33: "ἐπῆρεν τὸ δόρυ — поднял копьё (слав. «верже копием», т. е. бросил). συντετέλεσται ἡ κακία — зло решено."
  34: "ἀνεπήδησεν — вскочил (ἀναπηδάω). ἐν ὀργῇ θυμοῦ — в гневе ярости. ἐθραύσθη ἐπὶ τὸν Δαυιδ — сокрушился о Давиде, т. е. опечалился. συνετέλεσεν ἐπ᾿ αὐτὸν ὁ πατήρ — отец довершил над ним (слав. «соверши (злобу) на него»)."
  35: "πρωΐ — рано утром. καθὼς ἐτάξατο εἰς τὸ μαρτύριον Δαυιδ — как условился «на свидетельство Давиду» (слав. «о свидении с давидом»). παιδάριον μικρόν — малый отрок."
  36: "Δράμε — беги. σχίζα — стрела. παρήγαγεν αὐτήν — провёл её дальше, т. е. пустил мимо отрока (слав. «стрели стрелою за него»)."
  37: "ὀπίσω τοῦ νεανίου — вслед за юношей. Ἐκεῖ… καὶ ἐπέκεινα — «там… и дальше»."
  38: "Ταχύνας σπεῦσον — «ускорившись поспеши» (усиление). μὴ στῇς — не останавливайся. ἀνέλεξεν — собрал (ἀναλέγω)."
  39: "πάρεξ — кроме. οὐκ ἔγνω οὐθέν — не знал ничего."
  40: "τὰ σκεύη — оружие, вещи (слав. «оружие»); в тексте 武具."
  41: "ἀπὸ τοῦ εργαβ — от [камня] ергав (см. ст. 19). ἔπεσεν ἐπὶ πρόσωπον — пал на лицо. προσεκύνησεν τρίς — поклонился трижды. κατεφίλησεν — целовал (καταφιλέω). ἕως συντελείας μεγάλης — «до великого конца», т. е. долго."
  42: "Πορεύου εἰς εἰρήνην — иди с миром. ὡς ὀμωμόκαμεν — «как мы поклялись» (без аподосиса; слав. так же). σπέρμα — семя, потомство. ἕως αἰῶνος — до века."
