# jp-box, 1-я Царств, глава 20. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc для книги нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 20: бегство Давида из Навафа и вопрос к Ионатану (1–4), план на
# новомесячие (5–11), клятва Ионатана (12–17), знак со стрелами (18–23),
# праздник и гнев Саула (24–34), прощание (35–42).
# Речи — 「…」: Давид (1, 3, 4, 5–6, 8, 10), Ионатан (2, 4, 7, 9, 11, 12–16,
# 18–23, 28–29, 32, 42), Саул (27, 30–31). Вложенная речь — 『…』: слова Саула
# в передаче Давида (3), «хорошо» (7), клятва (42).
# Нумерация по gr: 42 стиха. В csl 43: слав. 20:43 («И воста давид и отиде.
# Ионафан же вниде во град») = gr 21:1, поэтому стиха 43 здесь нет.
# 〔…〕 нет: на месте всех стихов в gr-lxx-byz стоит текст, а не «.».
# Слав. добавления (20:3 «и между отцем твоим», 20:5 «дне третияго») в текст
# не внесены, отмечены в notes (как в Суд 21).
# Сносок ⟨…⟩ нет: все термины (契約, 主, 祭司, ペリシテ人) уже в корпусе.
# jp-ni не использовался.

