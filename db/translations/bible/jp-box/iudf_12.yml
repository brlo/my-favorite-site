verses:
  1: "そして、自分の銀[ぎん]の器[うつわ]が置[お]かれている所[ところ]へ彼女[かのじょ]を連[つ]れて来[く]るように命[めい]じ、自分の料理[りょうり]から彼女のために食卓[しょくたく]を整[ととの]えさせ、自分のぶどう酒[しゅ]を飲[の]ませるように命じた。"
  2: "「わたしはその食[た]べ物[もの]からは食[た]べない。つまずきが生[しょう]じないためである。しかし、わたしが携[たずさ]えて来[き]たものから、わたしには与[あた]えられるであろう。」"
  3: "「もし、あなたとともに持[も]っているものが尽[つ]きたなら、どこからわたしたちは、あなたにこれらと同[おな]じものを与[あた]えるために持[も]って来[こ]られようか。わたしたちの間[あいだ]には、あなたの一族[いちぞく]の者[もの]が一人[ひとり]もいないからである。」"
  4: "「あなたの魂[たましい]が生[い]きているように、わが主人[しゅじん]よ。あなたの女奴隷[おんなどれい]は、主[しゅ]がわたしの手[て]によって、ご自分[じぶん]が定[さだ]められたことを成[な]し遂[と]げるまで、わたしとともに持っているものを費[つか]い果[は]たさない。」"
  5: "ホロフェルネスの従者[じゅうしゃ]たちが彼女[かのじょ]を天幕[てんまく]へ連[つ]れて行[い]き、彼女は真夜中[まよなか]まで眠[ねむ]り、朝[あさ]の見張[みは]りのころに起[お]き上[あ]がった。"
  6: "そして、ホロフェルネスに人[ひと]を遣[つか]わして言[い]った。「わが主人[しゅじん]よ、どうか、あなたの女奴隷[おんなどれい]が祈[いの]りに出[で]て行[ゆ]くことをお許[ゆる]しくださるよう、お命[めい]じください。」"
  7: "ホロフェルネスは自分の護衛[ごえい]たちに、彼女[かのじょ]を妨[さまた]げないように命[めい]じた。彼女は陣営[じんえい]に三日[みっか]の間[あいだ]とどまり、夜[よる]ごとにベトリアの谷[たに]へ出[で]て行[い]き、陣営のうちの水[みず]の泉[いずみ]のほとりで身[み]を洗[あら]った。"
  8: "そして、上[のぼ]って行[い]くとき、イスラエルの神[かみ]である主[しゅ]に祈[いの]って、ご自分の民[たみ]の子[こ]らを立[た]ち上[あ]がらせるために、自分の道[みち]をまっすぐに導[みちび]いてくださるように願[ねが]った。"
  9: "そして、戻[もど]って来[く]るときは清[きよ]く、夕方[ゆうがた]に自分の食物[しょくもつ]を持[も]ち込[こ]むまで、天幕[てんまく]のうちにとどまった。"
  10: "四日目[よっかめ]になると、ホロフェルネスは自分のしもべたちだけのために酒宴[しゅえん]を設[もう]け、自分の務[つと]めに就[つ]いている者[もの]たちを招[まね]きに一人[ひとり]も加[くわ]えなかった。"
  11: "そして、自分のすべてのものの上[うえ]に立[た]っていた宦官[かんがん]バゴアスに言った。「さあ、行[い]って、あなたのもとにいるあのヘブライ人[じん]の女[おんな]を説[と]き勧[すす]め、わたしたちのところへ来[き]て、わたしたちと一緒[いっしょ]に食[た]べ、飲[の]むようにさせよ。"
  12: "見[み]よ、このような女[おんな]を、彼女と語[かた]りもしないでそのままにしておくのは、わたしたちの顔[かお]に恥[はじ]となることである。もしこの女を引[ひ]き寄[よ]せないなら、彼女はわたしたちを笑[わら]い者[もの]にするだろう。」"
  13: "バゴアスはホロフェルネスの前[まえ]から出[で]て、彼女[かのじょ]のところへ入[はい]り、言った。「この美[うつく]しい若[わか]い女[おんな]よ、ためらってはならない。彼の前[まえ]で誉[ほま]れを受[う]け、わたしたちとともに喜[よろこ]びのうちにぶどう酒を飲[の]み、今日[きょう]、ネブカドネツァルの家[いえ]に仕[つか]えるアッシリアの人々[ひとびと]の娘[むすめ]たちの一人[ひとり]のように、あなたもなるために、わが主人[しゅじん]のもとへ来[き]なさい。」"
  14: "ユディトは彼に言[い]った。「わたしは何者[なにもの]なのか、わが主人[しゅじん]に逆[さか]らうとは。わが主人の目[め]にかなうことは何[なん]でも、わたしは急[いそ]いで行[おこな]う。それはわたしの死[し]ぬ日[ひ]まで、わたしの喜[よろこ]びとなるであろう。」"
  15: "彼女[かのじょ]は立[た]ち上[あ]がって、衣[ころも]とすべての女[おんな]の飾[かざ]りで身[み]を飾[かざ]った。彼女の女奴隷[おんなどれい]が来[き]て、ホロフェルネスの前[まえ]の地面[じめん]に、自分の日々[ひび]の用[よう]のためにバゴアスから受[う]け取[と]った敷物[しきもの]を敷[し]いた。それは、その上[うえ]に横[よこ]たわって食[た]べるためであった。"
  16: "ユディトは入[はい]って横[よこ]たわった。すると、ホロフェルネスの心[こころ]は彼女のゆえに我[われ]を失[うしな]い、彼の魂[たましい]は揺[ゆ]さぶった。彼は彼女と交[まじ]わることをひどく望[のぞ]み、彼女を見[み]た日[ひ]から、彼女を欺[あざむ]く機会[きかい]をうかがっていた。"
  17: "ホロフェルネスは彼女に言[い]った。「さあ、飲[の]んで、わたしたちとともに楽[たの]しみなさい。」"
  18: "ユディトは言[い]った。「飲[の]もう、わが主人[しゅじん]よ。今日[きょう]、わたしの命[いのち]は、わたしが生[う]まれたすべての日[ひ]よりも、わたしのうちで大[おお]きくされたからである。」"
  19: "彼女[かのじょ]はそれを受[う]け取[と]って、自分の女奴隷[おんなどれい]が用意[ようい]したものを、彼の前[まえ]で食[た]べ、飲[の]んだ。"
  20: "ホロフェルネスは彼女のゆえに喜[よろこ]び、生[う]まれてから一日[いちにち]に飲[の]んだことのないほど、実[じつ]に多[おお]くのぶどう酒を飲んだ。"

notes:
  1: "ἐκέλευσεν εἰσαγαγεῖν — повелел ввести (εἰσάγω). οὗ ἐτίθετο τὰ ἀργυρώματα αὐτοῦ — где ставились серебряные сосуды его (ἀργύρωμα — серебряная утварь; слав. «сосуди сребрянии»). καταστρῶσαι αὐτῇ — «постелить, накрыть ей [стол]» (καταστρώννυμι); слав. «уготовити», поэтому 食卓を整える. ὀψοποιήματα — кушанья, яства (ὀψοποιέω); Син. «пища от стола его»."
  2: "Οὐ φάγομαι ἐξ αὐτῶν — не буду есть из этого (буд. от ἐσθίω). ἵνα μὴ γένηται σκάνδαλον — чтобы не произошло преткновения (σκάνδαλον — ловушка, соблазн), つまずき. ἐκ τῶν ἠκολουθηκότων μοι — из того, что последовало за мною, т. е. принесённого с собою (ἀκολουθέω). χορηγηθήσεται — будет подаваемо (χορηγέω, буд. пасс.); слав. «подаваемо да будет»."
  3: "Ἐὰν ἐκλίπῃ τὰ ὄντα μετὰ σοῦ — если оскудеет то, что с тобою (ἐκλείπω; ὄντα — имущество, припасы). πόθεν ἐξοίσομέν σοι δοῦναι ὅμοια αὐτοῖς — откуда мы вынесем [и] дадим тебе подобное этому (ἐκφέρω). οὐ γάρ ἐστιν μεθ᾽ ἡμῶν ἐκ τοῦ γένους σου — ибо нет с нами из рода твоего; слав. «от рода твоего», в тексте 一族."
  4: "Ζῇ ἡ ψυχή σου — «да живёт душа твоя»: клятвенная формула (ср. 1 Цар 20:3; 25:26), передана оборотом 「…が生きているように」. οὐ δαπανήσει — не издержит, не истратит (δαπανάω); слав. «не иждивет». ἕως ἂν ποιήσῃ κύριος ἐν χειρί μου ἃ ἐβουλεύσατο — пока Господь не совершит рукою моею того, что определил (βουλεύομαι); слав. «яже устави». κύριε — звательный падеж; к Олоферну 主人, не 主 (Господь)."
  5: "ἠγάγοσαν — повели (аор. ἄγω). ὕπνωσεν μέχρι μεσούσης τῆς νυκτός — спала до середины ночи (μεσούσης — род. абс.). ἀνέστη πρὸς τὴν ἑωθινὴν φυλακήν — встала к утренней страже (ἑωθινός — утренний; φυλακή — ночная вахта); слав. «о утренней стражи»."
  6: "ἀπέστειλεν πρὸς Ολοφέρνην λέγουσα — послала к Олоферну, говоря (прич. ж. р.). Ἐπιταξάτω — импер. 3 л. от ἐπιτάσσω, «пусть прикажет»; ἐᾶσαι — позволить, пустить (ἐάω); слав. «пущати». ἐπὶ προσευχήν — на молитву. ください — допустимая вежливая просьба в 常体."
  7: "σωματοφύλαξιν — телохранителям (σωματοφύλαξ), 護衛. διακωλύειν — препятствовать (διακωλύω). παρέμεινεν ἐν τῇ παρεμβολῇ — пробыла в стане (παρεμβολή — 陣営). φάραγξ — ущелье, долина (слав. «дебрь»). ἐβαπτίζετο — омывалась (βαπτίζω здесь в собственном смысле «мыть, погружать», не «крестить»). ἐπὶ τῆς πηγῆς τοῦ ὕδατος — при источнике воды."
  8: "ὡς ἀνέβη — когда восходила (ἀναβαίνω). ἐδέετο — молился, просил (δέομαι). κατευθῦναι — направить (κατευθύνω). ἀνάστημα τῶν υἱῶν τοῦ λαοῦ αὐτοῦ — «восстание, возвышение сынов народа Его» (ἀνάστημα); слав. «ко возставлению», Син. «к избавлению»."
  9: "εἰσπορευομένη καθαρά — входя (возвращаясь) чистою (εἰσπορεύομαι). παρέμενεν ἐν τῇ σκηνῇ — оставалась в шатре (σκηνή — 天幕). μέχρι οὗ προσηνέγκατο τὴν τροφὴν αὐτῆς πρὸς ἑσπέραν — пока не приносила себе пищу к вечеру (προσφέρομαι — приносить себе; τροφή — пища); слав. «донелиже приношаше пищу свою ко вечеру»."
  10: "πότος — пиршество, попойка (ср. Есф 1:8). τοῖς δούλοις αὐτοῦ μόνοις — только рабам своим. κλῆσις — приглашение, зов; εἰς τὴν κλῆσιν — на зов, в число приглашённых (слав. «в послужение» понял как службу). οἱ πρὸς ταῖς χρείαις — те, кто при делах, при службах (χρεία — нужда, служба); слав. «сущии при службах», Син. «приставленные к службам»."
  11: "Βαγώᾳ — дат. от Βαγώας, バゴアス (в 12:13 и 14:14 — Βαγώας). εὐνοῦχος — 宦官. ἐφεστηκὼς ἐπὶ πάντων τῶν αὐτοῦ — поставленный над всем, что у него было (ἐφίστημι). Πεῖσον — импер. аор. от πείθω, «убеди, уговори»; слав. «увещай». Εβραῖα — еврейка, ヘブライ人 (ср. 14:18 τῶν Εβραίων). Речь Багоаса продолжается в ст. 12."
  12: "ἰδού — вот, усилительная частица. αἰσχρὸν τῷ προσώπῳ ἡμῶν — стыдно для лица нашего, т. е. нам стыдно (αἰσχρός); слав. «студно лицу нашему». παρήσομεν — оставим, попустим (παρίημι, буд.). ὁμιλήσαντες — поговорив (ὁμιλέω). ἐπισπασώμεθα — привлечём (ἐπισπάομαι, аор. конъюнктив). καταγελάσεται ἡμῶν — посмеётся над нами (καταγελάω). Окончание речи Багоаса."
  13: "Μὴ ὀκνησάτω — да не замедлит, не поколеблется (ὀκνέω, импер. 3 л.). ἡ παιδίσκη ἡ καλή — прекрасная молодая женщина, 若い女. δοξασθῆναι κατὰ πρόσωπον αὐτοῦ — прославиться пред лицом его. πίεσαι — буд. от πίνω. εἰς εὐφροσύνην — в веселье, 喜びのうちに. θυγάτηρ μία τῶν υἱῶν Ασσουρ — одна из дочерей сынов Ассура (слав. «дщи едина от сынов ассуровых»); アッシリア — по всему корпусу. παρεστήκασιν — предстоят (perf. παρίστημι)."
  14: "Καὶ τίς εἰμι ἐγὼ ἀντεροῦσα — «и кто я, чтобы возразить» (ἀντεῖπον, буд. прич. ж. р.); слав. «противоглаголющи». ἀρεστόν — угодное (ἀρεστός); ἐν τοῖς ὀφθαλμοῖς αὐτοῦ — в очах его. σπεύσασα ποιήσω — поспешив, сделаю (σπεύδω). ἀγαλλίαμα — ликование, радость (слав. «радование»). ἕως ἡμέρας θανάτου μου — до дня смерти моей."
  15: "διαναστᾶσα — поднявшись (διανίστημι). ἱματισμός — одежда; κόσμος γυναικεῖος — женское украшение (κόσμος). κατέναντι Ολοφέρνου — напротив Олоферна. χαμαί — на землю, долу. κώδια — овчины, ковры (κώδιον); слав. «ковры», поэтому 敷物. καθημερινὴ δίαιτα — повседневный обиход (δίαιτα — образ жизни, быт). κατακλινομένην ἐπ᾽ αὐτῶν — возлежа на них (κατακλίνομαι)."
  16: "ἀνέπεσεν — возлегла (ἀναπίπτω). ἐξέστη ἡ καρδία — вышло из себя, изумилось сердце (ἐξίστημι); слав. «изступи сердце». ἐσαλεύθη ἡ ψυχή — поколебалась душа (σαλεύω). κατεπίθυμος σφόδρα — весьма сильно желающий (κατεπίθυμος). συγγενέσθαι μετ᾽ αὐτῆς — сойтись с нею. ἐτήρει καιρόν — искал, стерёг случай (τηρέω). ἀπατῆσαι — обольстить (ἀπατάω)."
  17: "Πῖε δή — пей же (импер. πίνω, δή усиливает). γενήθητι μεθ᾽ ἡμῶν εἰς εὐφροσύνην — будь с нами в веселье (γίνομαι, импер. аор. пасс.). Слав. и Син. совпадают с греческим."
  18: "Πίομαι — буду пить (буд. πίνω). ἐμεγαλύνθη τὸ ζῆν μου ἐν ἐμοί — возвеличилась жизнь моя во мне (μεγαλύνω); слав. «возвеличися живот мой во мне». παρὰ πάσας τὰς ἡμέρας τῆς γενέσεώς μου — более всех дней рождения моего (γένεσις). Двусмысленность ответа сохранена: Иудифь говорит о замысле, Олоферн понимает по-своему."
  19: "λαβοῦσα — взяв (λαμβάνω). ἔφαγεν καὶ ἔπιεν — ела и пила. κατέναντι αὐτοῦ — пред ним. ἃ ἡτοίμασεν ἡ δούλη αὐτῆς — что приготовила рабыня её (ἑτοιμάζω); слав. «яже уготова раба ея»."
  20: "ηὐφράνθη ἀπ᾽ αὐτῆς — возвеселился о ней (εὐφραίνω, аор. пасс.). ἔπιεν οἶνον πολὺν σφόδρα — пил вина много весьма. ὅσον οὐκ ἔπιεν πώποτε ἐν ἡμέρᾳ μιᾷ — сколько не пил никогда в один день (πώποτε — когда-либо). ἀφ᾽ οὗ ἐγεννήθη — с тех пор как родился. Формула вводит следующую главу."
