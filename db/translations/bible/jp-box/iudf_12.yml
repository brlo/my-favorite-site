# jp-box, Иудифь, глава 12. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для Иудифи нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 12: Олоферн велит привести её и подавать ей свою пищу (1), она отказывается
# (2), его вопрос и её ответ (3–4), её помещают в шатёр; она спит до полуночи и встаёт
# на утреннюю стражу (5), просит разрешения выходить на молитву (6), три дня омывается
# у источника (7), молится о пути (8), остаётся чистой (9), четвёртый день — пир (10),
# Багоас послан за ней (11–13), её ответ (14), она украшается и возлегает (15–16),
# пьяный Олоферн (17–20).
# Речь — 「…」: 2, 3, 4, 6, 11–12 (Багоас, одна цитата на два стиха), 13, 14, 17, 18.
# Вложенной речи и 『…』 нет. Красного и синего нет.
# Нумерация по gr: 20 стихов; деление совпадает с csl.
# 〔…〕 нет: все стихи есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 宦官, 天幕, 酒宴, 陣営 и пр. уже в корпусе.
# Имена — транслитерация греческого (LXX): ユディト, ホロフェルネス, バゴアス.

