# jp-box, Бытие, глава 13. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru),
# русский Синодальный (ru) и, где есть, jp-joc (1901, public domain).
# Язык — современный 常体, без 文語; порядок членов — по греческому.
# Глава 13: возвращение из Египта (1–4), разлука Аврама и Лота (5–13),
# новое обетование Авраму и поселение у Мамре (14–18).
# Красного и синего нет: речь Аврама (8–9) и речь Бога (14–17) — 「…」, без <j>.
# 〔…〕 нет: все слова есть в gr-lxx-byz.
# Отличие LXX: в 13:1 «в пустыню» (масор. «на юг»), в 13:14–15 Бог говорит как ὁ θεός
# (в 13:14 — «Бог», а не «Господь»). Отличия — в notes. jp-ni не использовался.

