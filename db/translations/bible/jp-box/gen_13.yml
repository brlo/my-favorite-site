verses:
  1: "アブラムはエジプトから、自分[じぶん]も妻[つま]も、すべてのものも、ロトもともに、荒野[こうや]へ上[のぼ]った。"
  2: "アブラムは家畜[かちく]と銀[ぎん]と金[きん]に非常[ひじょう]に富[と]んでいた。"
  3: "彼[かれ]は来[き]たところから、荒野[こうや]を通[とお]ってベテルまで、初[はじ]めに天幕[てんまく]があった場所[ばしょ]、ベテルとアガイの間[あいだ]まで進[すす]んだ。"
  4: "すなわち、彼[かれ]が初[はじ]めに祭壇[さいだん]を造[つく]った場所[ばしょ]である。そこでアブラムは主[しゅ]の名[な]を呼[よ]び求[もと]めた。"
  5: "アブラムとともに歩[あゆ]んだロトにも、羊[ひつじ]と牛[うし]と天幕[てんまく]があった。"
  6: "彼[かれ]らが一緒[いっしょ]に住[す]むには地[ち]が狭[せば]すぎた。彼[かれ]らの財産[ざいさん]が多[おお]かったので、彼[かれ]らは一緒[いっしょ]に住[す]むことができなかった。"
  7: "アブラムの家畜[かちく]の羊飼[ひつじか]いたちと、ロトの家畜[かちく]の羊飼[ひつじか]いたちとの間[あいだ]に争[あらそ]いが起[お]こった。そのとき、カナン人[じん]とフェレジ人[じん]がその地[ち]に住[す]んでいた。"
  8: "アブラムはロトに言[い]った。「わたしとあなた、わたしの羊飼[ひつじか]いたちとあなたの羊飼[ひつじか]いたちとの間[あいだ]に、争[あらそ]いがあってはならない。われわれは兄弟[きょうだい]だからである。"
  9: "全[ぜん]地[ち]はあなたの前[まえ]にあるではないか。わたしから離[はな]れよ。あなたが左[ひだり]へ行[ゆ]くなら、わたしは右[みぎ]へ行[ゆ]く。あなたが右[みぎ]へ行[ゆ]くなら、わたしは左[ひだり]へ行[ゆ]く。」"
  10: "ロトは目[め]を上[あ]げて、ヨルダンの全域[ぜんいき]が、すなわち、神[かみ]がソドムとゴモラを滅[ほろ]ぼされる前[まえ]の、神[かみ]の園[その]のように、またエジプトの地[ち]のように、ツォアルに至[いた]るまで、すべて水[みず]に潤[うるお]されているのを見[み]た。"
  11: "ロトは自分[じぶん]にヨルダンの全域[ぜんいき]を選[えら]び、ロトは東[ひがし]へ移[うつ]った。こうして、彼[かれ]らは互[たが]いに離[はな]れた。"
  12: "アブラムはカナンの地[ち]に住[す]み、ロトは周辺[しゅうへん]の町[まち]の一[ひと]つに住[す]んで、ソドムに天幕[てんまく]を張[は]った。"
  13: "ソドムの人々[ひとびと]は悪[わる]く、神[かみ]の前[まえ]に非常[ひじょう]に罪深[つみぶか]かった。"
  14: "ロトがアブラムから離[はな]れた後[のち]、神[かみ]はアブラムに言[い]われた。「あなたの目[め]を上[あ]げ、あなたが今[いま]いる場所[ばしょ]から、北[きた]、南[みなみ]、東[ひがし]、海[うみ]の方[ほう]へ見[み]よ。"
  15: "あなたが見[み]るすべての地[ち]を、わたしはあなたとあなたの子孫[しそん]に永遠[えいえん]に与[あた]える。"
  16: "わたしはあなたの子孫[しそん]を地[ち]の砂[すな]のようにする。もし人[ひと]が地[ち]の砂[すな]を数[かぞ]えられるなら、あなたの子孫[しそん]も数[かぞ]えられるだろう。"
  17: "立[た]って、この地[ち]を縦[たて]にも横[よこ]にも歩[ある]き巡[めぐ]れ。わたしがこれをあなたに与[あた]えるからである。」"
  18: "アブラムは天幕[てんまく]を移[うつ]し、来[き]て、ヘブロンにあるマムレの樫[かし]の木[き]のそばに住[す]んだ。そして、そこに主[しゅ]のために祭壇[さいだん]を築[きず]いた。"

notes:
  1: "Ἀνέβη… ἐξ Αἰγύπτου — エジプトから上った. εἰς τὴν ἔρημον — 荒野へ (LXX: «в пустыню»; масор. «на юг»). καὶ πάντα τὰ αὐτοῦ — すべてのものも."
  2: "πλούσιος σφόδρα κτήνεσιν καὶ ἀργυρίῳ καὶ χρυσίῳ — 家畜と銀と金に非常に富んでいた (κτῆνος — «скот»)."
  3: "ὅθεν ἦλθεν — 来たところから. ἕως τοῦ τόπου, οὗ ἦν ἡ σκηνὴ αὐτοῦ τὸ πρότερον — 初めに天幕があった場所まで (τὸ πρότερον — «прежде»). ἀνὰ μέσον Βαιθηλ καὶ ἀνὰ μέσον Αγγαι — ベテルとアガイの間に."
  4: "εἰς τὸν τόπον τοῦ θυσιαστηρίου, οὗ ἐποίησεν ἐκεῖ τὴν ἀρχήν — 初めに祭壇を造った場所. ἐπεκαλέσατο τὸ ὄνομα κυρίου — 主の名を呼び求めた."
  5: "Λωτ τῷ συμπορευομένῳ μετὰ Αβραμ — アブラムとともに歩んだロトにも. σκηναί — 天幕."
  6: "οὐκ ἐχώρει αὐτοὺς ἡ γῆ κατοικεῖν ἅμα — 一緒に住むには地が狭すぎた (χωρέω — «вмещать»). οὐκ ἐδύναντο κατοικεῖν ἅμα — 一緒に住むことができなかった (повтор сохранён, как в LXX)."
  7: "μάχη ἀνὰ μέσον τῶν ποιμένων — 羊飼いたちの間に争い (ποιμήν). οἱ Χαναναῖοι καὶ οἱ Φερεζαῖοι τότε κατῴκουν τὴν γῆν — カナン人とフェレジ人がその地に住んでいた."
  8: "Μὴ ἔστω μάχη — 争いがあってはならない. ἄνθρωποι ἀδελφοὶ ἡμεῖς ἐσμεν — われわれは兄弟である (букв. «мы люди-братья», т. е. родня)."
  9: "οὐκ ἰδοὺ πᾶσα ἡ γῆ ἐναντίον σού ἐστιν — 全地はあなたの前にあるではないか. διαχωρίσθητι ἀπ᾽ ἐμοῦ — わたしから離れよ. εἰ σὺ εἰς ἀριστερά, ἐγὼ εἰς δεξιά — あなたが左なら、わたしは右."
  10: "ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ — 目を上げて. πᾶσαν τὴν περίχωρον τοῦ Ιορδάνου — ヨルダンの全域 (περίχωρος — «окрестность»). ποτιζομένη — 潤されていた (ποτίζω — «поить»). ὡς ὁ παράδεισος τοῦ θεοῦ — 神の園のように (παράδεισος — «сад»). ἕως ἐλθεῖν εἰς Ζογορα — ツォアルに至るまで (LXX: Ζογορα; в гл. 14 и 19 тот же город стоит как Σηγωρ, поэтому имя унифицировано по 19-й главе — ツォアル)."
  11: "ἐξελέξατο ἑαυτῷ — 自分に選んだ. ἀπῆρεν ἀπὸ ἀνατολῶν — 東へ移った. διεχωρίσθησαν ἕκαστος ἀπὸ τοῦ ἀδελφοῦ αὐτοῦ — 互いに離れた."
  12: "κατῴκησεν ἐν πόλει τῶν περιχώρων — 周辺の町の一つに住んだ. ἐσκήνωσεν ἐν Σοδομοις — ソドムに天幕を張った (σκηνόω)."
  13: "πονηροὶ καὶ ἁμαρτωλοὶ ἐναντίον τοῦ θεοῦ σφόδρα — 神の前に非常に罪深い (в слав. «пред Господом», в LXX ὁ θεός)."
  14: "μετὰ τὸ διαχωρισθῆναι τὸν Λωτ ἀπ᾽ αὐτοῦ — ロトが離れた後. Ἀναβλέψας τοῖς ὀφθαλμοῖς σου ἰδέ — 目を上げて見よ. πρὸς βορρᾶν καὶ λίβα καὶ ἀνατολὰς καὶ θάλασσαν — 北、南、東、海 (θάλασσα — «море», т. е. запад)."
  15: "ἣν σὺ ὁρᾷς — あなたが見る. σοὶ δώσω αὐτὴν καὶ τῷ σπέρματί σου — あなたとあなたの子孫に与える. ἕως τοῦ αἰῶνος — 永遠に."
  16: "ὡς τὴν ἄμμον τῆς γῆς — 地の砂のように (ἄμμος — «песок»). εἰ δύναταί τις ἐξαριθμῆσαι — もし数えられるなら."
  17: "ἀναστὰς διόδευσον — 立って歩き巡れ. εἴς τε τὸ μῆκος καὶ εἰς τὸ πλάτος — 縦にも横にも (πλάτος — «ширина»). ὅτι σοὶ δώσω αὐτήν — わたしがこれをあなたに与えるから."
  18: "ἀποσκηνώσας — 天幕を移して (ἀποσκηνόω). παρὰ τὴν δρῦν τὴν Μαμβρη, ἣ ἦν ἐν Χεβρων — ヘブロンにあるマムレの樫の木のそば. ᾠκοδόμησεν θυσιαστήριον κυρίῳ — 主のために祭壇を築いた."
