# jp-box, Псалтирь, псалом 24. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0.
# Псалом 24: молитва о прощении и наставлении; упование на Бога (1–7),
# благость Господа к смиренным (8–14), просьба о помощи в скорби (15–22).
# Красного и синего нет. Кавычек нет: молитва, а не чужая речь.
# 〔…〕 нет: все слова в gr-lxx-byz есть. Повтор в квадратных скобках (24:14)
# в церковном тексте отсутствует, поэтому не переведён (см. notes).
# セラ (διάψαλμα) в этом псалме нет.
# Сносок ⟨…⟩ нет: 契約, 証, 集い уже в корпусе.
# jp-ni не использовался.

