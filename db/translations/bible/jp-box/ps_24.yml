verses:
  0: "ダビデの詩[うた]。"
  1: "主[しゅ]よ、わたしはあなたにわたしの魂[たましい]を上[あ]げる。わたしの神[かみ]よ。"
  2: "わたしはあなたに寄[よ]り頼[たの]む。わたしが恥[はじ]をかくことのないように。敵[てき]がわたしを笑[わら]いものにすることのないように。"
  3: "あなたを待[ま]ち望[のぞ]む者[もの]は、だれも恥[はじ]をかかない。むなしく不法[ふほう]を犯[おか]す者[もの]が恥[はじ]をかくように。"
  4: "主[しゅ]よ、あなたの道[みち]をわたしに示[しめ]し、あなたの道筋[みちすじ]をわたしに教[おし]えてください。"
  5: "あなたの真理[しんり]へわたしを導[みちび]き、わたしを教[おし]えてください。あなたはわたしの救[すく]いの神[かみ]であり、わたしは一日中[いちにちじゅう]、あなたを待[ま]ち望[のぞ]んでいるからである。"
  6: "主[しゅ]よ、あなたのあわれみと恵[めぐ]みを思[おも]い起[おこ]してください。これらはとこしえからあるものである。"
  7: "わたしの若[わか]いころの罪[つみ]と、わたしの無知[むち]とを思[おも]い出[だ]さないでください。主[しゅ]よ、あなたの恵[めぐ]みにより、あなたのいつくしみのために、わたしを思[おも]い起[おこ]してください。"
  8: "主[しゅ]はいつくしみ深[ぶか]く、正[ただ]しい。それゆえ、罪[つみ]を犯[おか]す者[もの]に道[みち]を教[おし]えられる。"
  9: "主[しゅ]はへりくだる者[もの]を裁[さば]きにおいて導[みちび]き、へりくだる者[もの]にその道[みち]を教[おし]えられる。"
  10: "主[しゅ]の道[みち]はすべて、その契約[けいやく]とその証[あかし]を求[もと]める者[もの]には、恵[めぐ]みと真理[しんり]である。"
  11: "主[しゅ]よ、あなたの名[な]のために、わたしの罪[つみ]を赦[ゆる]してください。その罪[つみ]は大[おお]きいからである。"
  12: "主[しゅ]を恐[おそ]れる人[ひと]は、だれか。主[しゅ]はその人[ひと]に、選[えら]んだ道[みち]を教[おし]えられる。"
  13: "その人[ひと]の魂[たましい]は良[よ]いものの中[なか]に住[す]み、その子孫[しそん]は地[ち]を受け継[つ]ぐ。"
  14: "主[しゅ]は、主[しゅ]を恐[おそ]れる者[もの]たちの支[ささ]えであり、その契約[けいやく]を彼[かれ]らに示[しめ]される。"
  15: "わたしの目[め]はいつも主[しゅ]を仰[あお]ぐ。主[しゅ]がわたしの足[あし]を網[あみ]から引[ひ]き出[だ]されるからである。"
  16: "わたしに目[め]を向[む]け、わたしをあわれんでください。わたしはただ一[ひと]りで、貧[まず]しいからである。"
  17: "わたしの心[こころ]の苦[くる]しみは大[おお]きくなった。わたしを苦難[くなん]から引[ひ]き出[だ]してください。"
  18: "わたしの貧[まず]しさと労苦[ろうく]をご覧[らん]になり、わたしのすべての罪[つみ]を赦[ゆる]してください。"
  19: "わたしの敵[てき]をご覧[らん]ください。なんと多[おお]いことか。彼[かれ]らは不当[ふとう]な憎[にく]しみでわたしを憎[にく]んでいる。"
  20: "わたしの魂[たましい]を守[まも]り、わたしを救[すく]い出[だ]してください。わたしが恥[はじ]をかくことのないように。わたしはあなたに寄[よ]り頼[たの]んだからである。"
  21: "無垢[むく]な者[もの]と正[ただ]しい者[もの]とが、わたしに結[むす]びつくように。主[しゅ]よ、わたしはあなたを待[ま]ち望[のぞ]んでいるからである。"
  22: "神[かみ]よ、イスラエルをそのすべての苦[くる]しみから贖[あがな]い出[だ]してください。"

notes:
  0: "Ψαλμὸς τῷ Δαυιδ — ダビデの詩. Надписание — стих 0."
  1: "ἦρα τὴν ψυχήν — 魂を上げる. ὁ θεός μου — わたしの神よ (в конце стиха, как в греч.)."
  2: "πέποιθα — 寄り頼む. μὴ καταισχυνθείην — 恥をかくことのないように. καταγελασάτωσάν μου — 笑いものにすることのないように."
  3: "ὑπομένοντες — 待ち望む者. ἀνομοῦντες διὰ κενῆς — むなしく不法を犯す者."
  4: "γνώρισόν μοι — 示してください. τρίβους — 道筋. δίδαξόν — 教えてください."
  5: "ὁδήγησον — 導いてください. ἀλήθεια — 真理. ὑπέμεινα ὅλην τὴν ἡμέραν — 一日中待ち望んだ."
  6: "οἰκτιρμοί — あわれみ. ἐλέη — 恵み. ἀπὸ τοῦ αἰῶνος — とこしえから."
  7: "ἁμαρτίας νεότητος — 若いころの罪. ἄγνοια — 無知. χρηστότης — いつくしみ."
  8: "χρηστὸς καὶ εὐθύς — いつくしみ深く正しい. νομοθετήσει — 道を教える."
  9: "ὁδηγήσει πραεῖς ἐν κρίσει — 柔和な者を裁きにおいて導く. πραεῖς — へりくだる者."
  10: "διαθήκη — 契約. μαρτύρια — 証. ἔλεος καὶ ἀλήθεια — 恵みと真理."
  11: "ἕνεκα τοῦ ὀνόματος — 名のために. ἱλάσῃ — 赦す. πολλή — 大きい."
  12: "φοβούμενος τὸν κύριον — 主を恐れる人. ᾗ ᾑρετίσατο — 選んだ道."
  13: "αὐλισθήσεται — 住む. κληρονομήσει γῆν — 地を受け継ぐ."
  14: "κραταίωμα — 支え. В gr-lxx-byz в квадратных скобках повтор «καὶ τὸ ὄνομα κυρίου…»; в церковном тексте его нет, поэтому не переведён; слова в базе есть — 〔…〕 не ставятся. δηλῶσαι — 示す."
  15: "διὰ παντός — いつも. ἐκσπάσει ἐκ παγίδος — 網から引き出す."
  16: "ἐπίβλεψον — 目を向けてください. μονογενὴς καὶ πτωχός — ただ一人で貧しい."
  17: "θλίψεις ἐπλατύνθησαν — 苦しみは大きくなった. ἀναγκῶν — 苦難."
  18: "ταπείνωσις — 貧しさ. κόπος — 労苦. ἄφες — 赦してください."
  19: "ἐπληθύνθησαν — 多い. μῖσος ἄδικον — 不当な憎しみ."
  20: "φύλαξον — 守ってください. ἤλπισα — 寄り頼んだ."
  21: "ἄκακοι καὶ εὐθεῖς — 無垢な者と正しい者. ἐκολλῶντό μοι — 結びついた (прилепились). ὑπέμεινά σε — 待ち望んだ."
  22: "λύτρωσαι — 贖い出してください. ἐκ πασῶν τῶν θλίψεων — すべての苦しみから."
