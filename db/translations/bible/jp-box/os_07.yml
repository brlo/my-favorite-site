book: os
chapter: 7
draft: true

verses:
  1: "「わたしがイスラエルを癒[いや]そうとしたとき、エフライムの不法[ふほう]とサマリアの悪[あく]が現[あらわ]れた。彼らは偽[いつわ]りを行[おこな]ったからである。盗人[ぬすびと]が彼のところへ入[はい]り、強盗[ごうとう]がその道[みち]で彼を剥[は]ぎ取[と]る。"
  2: "彼らは心[こころ]を合[あ]わせて歌[うた]う者[もの]のように、わたしに歌[うた]う。わたしは彼らのすべての悪[あく]を思[おも]い起[おこ]した。今[いま]、彼らの企[たくら]みが彼らを囲[かこ]み、わたしの前[まえ]に現[あらわ]れた。"
  3: "彼らは自分[じぶん]の悪[あく]によって王[おう]たちを喜[よろこ]ばせ、その偽[いつわ]りによって君[きみ]たちを喜[よろこ]ばせた。"
  4: "彼らはみな姦淫[かんいん]する者[もの]で、焼[や]くために燃[も]え立[た]つかまどのようである。炎[ほのお]は、脂[あぶら]を混[ま]ぜた生地[きじ]が膨[ふく]らむまで、絶[た]えない。"
  5: "あなたがたの王[おう]の日[ひ]、君[きみ]たちはぶどう酒[しゅ]によって激[はげ]しく怒[いか]り、王[おう]は滅[ほろ]ぼす者[もの]たちと共[とも]に手[て]を伸[の]べた。"
  6: "彼らの心[こころ]は、彼らが策[はかり]ごとを企[たくら]むときに、かまどのように燃[も]えた。エフライムは夜[よる]通[どお]し眠[ねむ]りに満[み]ち、朝[あさ]になると火[ひ]の炎[ほのお]のように燃[も]え上[あ]がった。"
  7: "彼らはみなかまどのように熱[あつ]くなり、自分[じぶん]の士師[しし]たちを食[く]い尽[つ]くした。彼らの王[おう]たちはみな倒[たお]れた。彼らの中[なか]に、わたしを呼[よ]び求[もと]める者[もの]は一人[ひとり]もいない。"
  8: "エフライムは諸国民[しょこくみん]と混[ま]じり合[あ]った。エフライムは、ひっくり返[かえ]されないまま焼[や]かれた菓子[かし]のようになった。"
  9: "ほかの者[もの]たちが彼の力[ちから]を食[く]い尽[つ]くしたが、彼はそれに気[き]づかない。白髪[しらが]が彼に萌[も]え出[で]たが、彼はそれも知[し]らない。"
  10: "イスラエルの傲[おご]りはその面前[めんぜん]で低[ひく]くされる。それでも彼らは自分[じぶん]の神[かみ]である主[しゅ]に帰[かえ]らず、このすべての中[なか]で主[しゅ]を求[もと]めもしない。"
  11: "エフライムは、心[こころ]のない愚[おろ]かな鳩[はと]のようになった。彼らはエジプトを呼[よ]び求[もと]め、アッシリアへ行[い]った。"
  12: "彼らが行[い]くとき、わたしは彼らの上[うえ]にわたしの網[あみ]を掛[か]ける。空[そら]の鳥[とり]のように彼らを引[ひ]き下[お]ろし、彼らの苦[くる]しみのうわさが聞[き]こえるとき、彼らを懲[こら]らす。"
  13: "彼らは災[わざわ]いだ。わたしから跳[と]び離[はな]れたからである。彼らは惨[みじ]めだ。わたしに対して不敬[ふけい]を行[おこな]ったからである。わたしは彼らを贖[あがな]ったのに、彼らはわたしに対して偽[いつわ]りを語[かた]った。"
  14: "彼らは心[こころ]からわたしに叫[さけ]ばなかった。ただ寝床[ねどこ]の上[うえ]で泣[な]きわめいた。彼らは穀物[こくもつ]とぶどう酒[しゅ]のために身[み]を切[き]り裂[さ]いた。彼らはわたしによって懲[こら]らされた。"
  15: "わたしは彼らの腕[うで]を強[つよ]くしたのに、彼らはわたしに対して悪[わる]を企[たくら]んだ。"
  16: "彼らはむなしいものへ向[む]きを変[かえ]、張[は]り詰[つ]めた弓[ゆみ]のようになった。彼らの君[きみ]たちは、その舌[した]の不遜[ふそん]のゆえに剣[つるぎ]で倒[たお]れる。これがエジプトの地[ち]での彼らの嘲[あざけ]りとなる」。"

notes:
  1: "ἐν τῷ ἰάσασθαί με τὸν Ισραηλ — «когда Я врачевал Израиля» (ἰάομαι — исцелять); ἀποκαλυφθήσεται ἡ ἀδικία Εφραιμ καὶ ἡ κακία Σαμαρείας — «откроется неправда Ефрема и злоба Самарии»; ἠργάσαντο ψευδῆ — «делали ложное» (ἐργάζομαι); κλέπτης πρὸς αὐτὸν εἰσελεύσεται — «вор к нему войдёт»; ἐκδιδύσκων λῃστὴς ἐν τῇ ὁδῷ αὐτοῦ — «ограбляющий разбойник на пути его» (ἐκδιδύσκω — снимать одежду, обирать)."
  2: "ὅπως συνᾴδωσιν ὡς συνᾴδοντες τῇ καρδίᾳ αὐτῶν — «чтобы пели вместе, как поющие сердцем своим» (συνᾴδω — петь вместе; тёмное место, в ru/МТ «не помышляют в сердце»); πάσας τὰς κακίας αὐτῶν ἐμνήσθην — «все злобы их Я вспомнил»; νῦν ἐκύκλωσεν αὐτοὺς τὰ διαβούλια αὐτῶν — «ныне окружили их умыслы их»; ἀπέναντι τοῦ προσώπου μου ἐγένοντο — «пред лицом Моим стали»."
  3: "ἐν ταῖς κακίαις αὐτῶν εὔφραναν βασιλεῖς — «злобами своими увеселили царей» (εὐφραίνω — веселить); ἐν τοῖς ψεύδεσιν αὐτῶν ἄρχοντας — «и ложью своей князей»."
  4: "πάντες μοιχεύοντες — «все прелюбодействующие»; ὡς κλίβανος καιόμενος εἰς πέψιν — «как печь, горящая для печения» (κλίβανος — печь; πέψις — печение); ἀπὸ φυράσεως στέατος ἕως τοῦ ζυμωθῆναι αὐτό — «от замешивания тука (жира) до вскисания его» (φύρασις — замешивание, στέαρ — тук; слав. «от примешения тука, дондеже вскиснет»)."
  5: "αἱ ἡμέραι τῶν βασιλέων ὑμῶν — «дни царей ваших»; ἤρξαντο οἱ ἄρχοντες θυμοῦσθαι ἐξ οἴνου — «начали князья яриться от вина» (θυμόομαι — гневаться, яриться); ἐξέτεινεν τὴν χεῖρα αὐτοῦ μετὰ λοιμῶν — «протянул руку свою с губителями» (λοιμός — погибель, губитель; слав. «с губительми»)."
  6: "διότι ἀνεκαύθησαν ὡς κλίβανος αἱ καρδίαι αὐτῶν ἐν τῷ καταράσσειν αὐτούς — «ибо раскалились, как печь, сердца их, когда они замышляли» (καταράσσω — разбивать, устраивать заговор); ὅλην τὴν νύκτα ὕπνου Εφραιμ ἐνεπλήσθη — «всю ночь сна Ефрем насытился»; πρωῒ ἐγενήθη ἀνεκαύθη ὡς πυρὸς φέγγος — «утро настало — раскалился, как сияние огня»."
  7: "πάντες ἐθερμάνθησαν ὡς κλίβανος — «все нагрелись, как печь» (θερμαίνω); κατέφαγον τοὺς κριτὰς αὐτῶν — «съели судей своих» (κριτής — судья, 士師); πάντες οἱ βασιλεῖς αὐτῶν ἔπεσαν — «все цари их пали»; οὐκ ἦν ὁ ἐπικαλούμενος ἐν αὐτοῖς πρός με — «не было в них призывающего ко Мне»."
  8: "Εφραιμ ἐν τοῖς λαοῖς αὐτοῦ συνανεμείγνυτο — «Ефрем с народами смешивался» (συναναμείγνυμι); ἐγένετο ἐγκρυφίας οὐ μεταστρεφόμενος — «стал печением в золе, не переворачиваемым» (ἐγκρυφίας — хлеб, печённый в золе; слав. «опреснок необращаемь»), т.е. сырой с одной стороны."
  9: "κατέφαγον ἀλλότριοι τὴν ἰσχὺν αὐτοῦ — «съели чужие силу его»; αὐτὸς δὲ οὐκ ἐπέγνω — «он же не узнал»; πολιαὶ ἐξήνθησαν αὐτῷ — «седины расцвели у него» (πολιά — седина; ἐξανθέω — расцветать); αὐτὸς οὐκ ἔγνω — «он не познал»."
  10: "ταπεινωθήσεται ἡ ὕβρις Ισραηλ εἰς πρόσωπον αὐτοῦ — «смирится гордыня Израиля в лице его» (слав. «укоризна израилева»); οὐκ ἐπέστρεψαν πρὸς κύριον τὸν θεὸν αὐτῶν — «не обратились к Господу Богу своему»; οὐκ ἐξεζήτησαν αὐτὸν ἐν πᾶσι τούτοις — «не взыскали Его во всём этом»."
  11: "ἦν Εφραιμ ὡς περιστερὰ ἄνους οὐκ ἔχουσα καρδίαν — «был Ефрем как голубь безумный, не имеющий сердца» (ἄνους — неразумный, 愚かな); Αἴγυπτον ἐπεκαλεῖτο — «Египет призывал»; εἰς Ἀσσυρίους ἐπορεύθησαν — «к Ассирийцам пошли»."
  12: "καθὼς ἂν πορεύωνται, ἐπιβαλῶ ἐπ᾿ αὐτοὺς τὸ δίκτυόν μου — «куда бы ни пошли, накину на них сеть Мою» (ἐπιβάλλω); καθὼς τὰ πετεινὰ τοῦ οὐρανοῦ κατάξω αὐτούς — «как птиц небесных низведу их» (κατάγω); παιδεύσω αὐτοὺς ἐν τῇ ἀκοῇ τῆς θλίψεως αὐτῶν — «накажу их при слухе (молве) о скорби их» (ἀκοή — слух, молва)."
  13: "οὐαὶ αὐτοῖς, ὅτι ἀπεπήδησαν ἀπ᾿ ἐμοῦ — «горе им, ибо отскочили от Меня» (ἀποπηδάω — отскакивать); δείλαιοί εἰσιν, ὅτι ἠσέβησαν εἰς ἐμέ — «жалки они, ибо нечествовали против Меня» (δείλαιος — жалкий, малодушный; слав. «боязливи»); ἐγὼ δὲ ἐλυτρωσάμην αὐτούς — «Я же искупил (избавил) их» (λυτρόω); κατελάλησαν κατ᾿ ἐμοῦ ψεύδη — «говорили против Меня ложь» (καταλαλέω)."
  14: "οὐκ ἐβόησαν πρός με αἱ καρδίαι αὐτῶν — «не возопили ко Мне сердца их»; ὠλόλυζον ἐν ταῖς κοίταις αὐτῶν — «вопили (выли) на ложах своих» (ὀλολύζω — вопить); ἐπὶ σίτῳ καὶ οἴνῳ κατετέμνοντο — «из-за хлеба и вина резали себя» (κατατέμνω — разрезать, о ритуальных порезах); ἐπαιδεύθησαν ἐν ἐμοί — «были наказаны (научены) во Мне»."
  15: "κἀγὼ κατίσχυσα τοὺς βραχίονας αὐτῶν — «Я же укрепил мышцы (руки) их» (κατισχύω); εἰς ἐμὲ ἐλογίσαντο πονηρά — «против Меня замыслили злое» (λογίζομαι — замышлять)."
  16: "ἀπεστράφησαν εἰς οὐθέν — «обратились в ничто» (слав. «совратишася ни во чтоже»); ἐγένοντο ὡς τόξον ἐντεταμένον — «стали как лук натянутый» (ἐντείνω — натягивать; в ru/МТ «неверный лук»); πεσοῦνται ἐν ῥομφαίᾳ οἱ ἄρχοντες αὐτῶν — «падут от меча князья их»; δι᾿ ἀπαιδευσίαν γλώσσης αὐτῶν — «за необученность (дерзость) языка их» (ἀπαιδευσία — невоспитанность); οὗτος ὁ φαυλισμός αὐτῶν ἐν γῇ Αἰγύπτῳ — «таково посмеяние над ними в земле Египетской» (φαυλισμός — презрение, посмеяние)."
