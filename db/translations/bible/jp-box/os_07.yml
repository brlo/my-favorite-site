# jp-box, Осия, глава 7. Черновик для приёмки.
#
# Нумерация — по славяно-синодальной (решение автора): главы 1–2 и 11–12
# переразбиты относительно гр. модуля (слав. 1:10–11 = прежние 2:1–2;
# слав. 11:12 = прежний 12:1). Текст — с Септуагинты, слав. контроль.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# --- прежние заметки (нумерация по гр.) ---
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по gr-lxx-byz (= jp-ni); в этой главе совпадает со славяно-синодальной.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: 1–2 при исцелении Израиля открывается неправда Ефрема и злоба Самарии:
# вор и разбойник, «они поют сердцем своим», Господь помнит зло; 3–7 злобами веселят
# царя, все прелюбодействуют, печь, дни царей, вино, пожирают судей, цари падают,
# никто не взывает; 8–10 Ефрем среди народов как неперевёрнутый хлеб, чужие съели
# силу, седина, гордость унижена — не обратились; 11–13 глупый голубь, Египет и Ассирия,
# сеть, горе отступившим; 14–16 вопят на ложах, не ко Мне, как неверный лук, падут
# от меча, посмеяние в Египте.
# Голоса: 1–16 — одно слово Господа в 「…」 (закрывается в 16).
# 7:2: LXX «συνᾴδωσιν ὡς συνᾴδοντες τῇ καρδίᾳ αὐτῶν» — «поют вместе, как поющие
# сердцем своим» (тёмное место; в ru/МТ «не помышляют в сердце»); в тексте LXX.
# 7:16: «τόξον ἐντεταμένον» — «натянутый лук» (слав. «лук напряжен»; в ru/МТ
# «неверный лук»).
#
