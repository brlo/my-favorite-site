# jp-box, Бытие, глава 11. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru)
# и русский Синодальный (ru). jp-joc в этой главе в модуле отсутствует (стихи 10–32 пусты).
# Язык — современный 常体, без 文語; порядок членов — по греческому.
# Глава 11: вавилонская башня и смешение языков (1–9), родословие от Сима до Фарры (10–26),
# родословие Фарры и переселение в Харран (27–32).
# Красного и синего нет: речь людей (3–4), речь Господа (6–7).
# 〔…〕 нет: все слова есть в gr-lxx-byz.
# ВАЖНО: числа родословия — по LXX, они отличаются от масоретских (в скобках в notes);
# в LXX есть второй Каинан, и ст. 13 объединяет два поколения (Арфаксад и Каинан).
# Красного нет, jp-ni не использовался.

