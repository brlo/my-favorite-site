verses:
  1: "全[ぜん]地[ち]は一[ひと]つの言葉[ことば]であり、すべての者[もの]に一[ひと]つの音[おと]であった。"
  2: "彼[かれ]らが東[ひがし]から移[うつ]ったとき、セナアルの地[ち]に平野[へいや]を見[み]つけて、そこに住[す]んだ。"
  3: "彼[かれ]らは互[たが]いに言[い]った。「さあ、れんがを作[つく]って、火[ひ]で焼[や]こう。」れんがは石[いし]の代[か]わりとなり、アスファルトは漆喰[しっくい]の代[か]わりとなった。"
  4: "彼[かれ]らは言[い]った。「さあ、われわれは町[まち]と塔[とう]を建[た]てて、その頂[いただき]を天[てん]に届[とど]かせよう。そうして、われわれは名[な]を上[あ]げ、全[ぜん]地[ち]の面[おもて]に散[ち]らされるのを免[まぬが]れよう。」"
  5: "主[しゅ]は、人[ひと]の子[こ]らが建[た]てている町[まち]と塔[とう]を見[み]るために降[くだ]られた。"
  6: "主[しゅ]は言[い]われた。「見[み]よ、彼[かれ]らは一[ひと]つの民[たみ]であり、すべてに一[ひと]つの言葉[ことば]がある。彼[かれ]らはこうして事[こと]を始[はじ]めた。今[いま]、彼[かれ]らが企[くわだ]てて行[おこな]うすべてのことは、彼[かれ]らから尽[つ]きることがない。"
  7: "さあ、降[くだ]って、そこで彼[かれ]らの言葉[ことば]を混[ま]ぜ、互[たが]いに隣人[りんじん]の声[こえ]が分[わ]からないようにしよう。」"
  8: "主[しゅ]はそこから彼[かれ]らを全[ぜん]地[ち]の面[おもて]に散[ち]らした。彼[かれ]らは町[まち]と塔[とう]を建[た]てるのをやめた。"
  9: "それゆえ、その町[まち]の名[な]は混乱[こんらん]と呼[よ]ばれた。主[しゅ]がそこで全[ぜん]地[ち]の言葉[ことば]を混[ま]ぜたからである。主[しゅ]はそこから彼[かれ]らを全[ぜん]地[ち]の面[おもて]に散[ち]らした。"
  10: "セムの系譜[けいふ]はこうである。セムは百歳[ひゃくさい]のとき、すなわち洪水[こうずい]の後[のち]の第二[だいに]年[ねん]に、アルファクサドを生[う]んだ。"
  11: "セムはアルファクサドを生[う]んだ後[のち]、五百[ごひゃく]年[ねん]生[い]き、息子[むすこ]たちと娘[むすめ]たちを生[う]んだ。そして、死[し]んだ。"
  12: "アルファクサドは百三十五歳[ひゃくさんじゅうごさい]のとき、カイナンを生[う]んだ。"
  13: "アルファクサドはカイナンを生[う]んだ後[のち]、四百三十年[よんひゃくさんじゅうねん]生[い]き、息子[むすこ]たちと娘[むすめ]たちを生[う]んだ。そして、死[し]んだ。カイナンは百三十歳[ひゃくさんじゅうさい]のとき、サラを生[う]んだ。カイナンはサラを生[う]んだ後[のち]、三百三十年[さんびゃくさんじゅうねん]生[い]き、息子[むすこ]たちと娘[むすめ]たちを生[う]んだ。そして、死[し]んだ。"
  14: "サラは百三十歳[ひゃくさんじゅうさい]のとき、エベルを生[う]んだ。"
  15: "サラはエベルを生[う]んだ後[のち]、三百三十年[さんびゃくさんじゅうねん]生[い]き、息子[むすこ]たちと娘[むすめ]たちを生[う]んだ。そして、死[し]んだ。"
  16: "エベルは百三十四歳[ひゃくさんじゅうよんさい]のとき、ペレグを生[う]んだ。"
  17: "エベルはペレグを生[う]んだ後[のち]、三百七十年[さんびゃくななじゅうねん]生[い]き、息子[むすこ]たちと娘[むすめ]たちを生[う]んだ。そして、死[し]んだ。"
  18: "ペレグは百三十歳[ひゃくさんじゅうさい]のとき、ラガウを生[う]んだ。"
  19: "ペレグはラガウを生[う]んだ後[のち]、二百九年[にひゃくきゅうねん]生[い]き、息子[むすこ]たちと娘[むすめ]たちを生[う]んだ。そして、死[し]んだ。"
  20: "ラガウは百三十二歳[ひゃくさんじゅうにさい]のとき、セルフを生[う]んだ。"
  21: "ラガウはセルフを生[う]んだ後[のち]、二百七年[にひゃくななねん]生[い]き、息子[むすこ]たちと娘[むすめ]たちを生[う]んだ。そして、死[し]んだ。"
  22: "セルフは百三十歳[ひゃくさんじゅうさい]のとき、ナホルを生[う]んだ。"
  23: "セルフはナホルを生[う]んだ後[のち]、二百年[にひゃくねん]生[い]き、息子[むすこ]たちと娘[むすめ]たちを生[う]んだ。そして、死[し]んだ。"
  24: "ナホルは七十九歳[ななじゅうきゅうさい]のとき、テラを生[う]んだ。"
  25: "ナホルはテラを生[う]んだ後[のち]、百二十九年[ひゃくにじゅうきゅうねん]生[い]き、息子[むすこ]たちと娘[むすめ]たちを生[う]んだ。そして、死[し]んだ。"
  26: "テラは七十歳[ななじゅっさい]のとき、アブラム、ナホル、ハランを生[う]んだ。"
  27: "テラの系譜[けいふ]はこうである。テラはアブラム、ナホル、ハランを生[う]み、ハランはロトを生[う]んだ。"
  28: "ハランは父[ちち]テラの前[まえ]で、自分[じぶん]が生[う]まれた地[ち]、カルデア人[じん]の地[ち]で死[し]んだ。"
  29: "アブラムとナホルは自分[じぶん]たちに妻[つま]を迎[むか]えた。アブラムの妻[つま]の名[な]はサライ、ナホルの妻[つま]の名[な]はミルカであった。ミルカはハランの娘[むすめ]であり、ハランはミルカの父[ちち]、またイエスカの父[ちち]である。"
  30: "サライは不妊[ふにん]で、子[こ]を産[う]まなかった。"
  31: "テラは息子[むすこ]アブラム、孫[まご]であるハランの子[こ]ロト、息子[むすこ]アブラムの妻[つま]である嫁[よめ]サライを連[つ]れて、カルデア人[じん]の地[ち]から出[で]て、カナンの地[ち]へ行[ゆ]こうとした。彼[かれ]らはハランまで来[き]て、そこに住[す]んだ。"
  32: "テラの日[ひ]はハランで二百五年[にひゃくごねん]であった。テラはハランで死[し]んだ。"

notes:
  1: "χεῖλος ἕν, καὶ φωνὴ μία πᾶσιν — 一つの言葉、すべてに一つの音 (χεῖλος — «губа», метонимия речи; у jp-joc 言と音)."
  2: "ἐν τῷ κινῆσαι αὐτοὺς ἀπὸ ἀνατολῶν — 彼らが東から移ったとき (κινέω — «двигать(ся)»). πεδίον ἐν γῇ Σεννααρ — セナアルの地の平野."
  3: "εἶπεν ἄνθρωπος τῷ πλησίον — 互いに言った (букв. «человек ближнему своему»). πλινθεύσωμεν πλίνθους καὶ ὀπτήσωμεν αὐτὰς πυρί — れんがを作って火で焼こう. ἡ πλίνθος εἰς λίθον — れんがは石の代わりに. ἄσφαλτος ἦν αὐτοῖς ὁ πηλός — アスファルトが漆喰の代わりとなった (πηλός — «глина, раствор»)."
  4: "οἰκοδομήσωμεν ἑαυτοῖς πόλιν καὶ πύργον — 町と塔を建てて. ἡ κεφαλὴ ἕως τοῦ οὐρανοῦ — 頂きを天にまで. ποιήσωμεν ἑαυτοῖς ὄνομα — われわれは名を上げ. πρὸ τοῦ διασπαρῆναι — 散らされる前に (в LXX — «чтобы не рассеяться»)."
  5: "κατέβη κύριος ἰδεῖν — 主は見るために降られた. οἱ υἱοὶ τῶν ἀνθρώπων — 人の子ら."
  6: "γένος ἓν καὶ χεῖλος ἓν πάντων — 一つの民、すべてに一つの言葉. ἤρξαντο ποιῆσαι — 事を始めた. οὐκ ἐκλείψει ἐξ αὐτῶν πάντα, ὅσα ἂν ἐπιθῶνται ποιεῖν — 彼らが企てて行うすべてのことは、彼らから尽きることがない (ἐκλείπω — «оскудевать»; ἐπιτίθημι — «предпринимать»)."
  7: "δεῦτε καὶ καταβάντες συγχέωμεν — さあ、降って混ぜよう. ἵνα μὴ ἀκούσωσιν ἕκαστος τὴν φωνὴν τοῦ πλησίον — 互いに隣人の声が分からないように (ἀκούω — «слышать, понимать»)."
  8: "διέσπειρεν αὐτοὺς κύριος ἐκεῖθεν — 主はそこから彼らを散らした. ἐπαύσαντο οἰκοδομοῦντες — 建てるのをやめた."
  9: "Σύγχυσις — 混乱: LXX передаёт имя как «смешение»; в масоретском тексте — Вавилон, и jp-joc даёт ワワィロン, но в греческом этого имени нет, поэтому в переводе его нет (отличие — здесь). συνέχεεν κύριος τὰ χείλη πάσης τῆς γῆς — 主は全地の言葉を混ぜた."
  10: "αἱ γενέσεις Σημ — セムの系譜. υἱὸς ἑκατὸν ἐτῶν — 百歳 (букв. «сын ста лет»). δευτέρου ἔτους μετὰ τὸν κατακλυσμόν — 洪水の後の第二年."
  11: "ἔζησεν… πεντακόσια ἔτη — 五百年生きた. ἐγέννησεν υἱοὺς καὶ θυγατέρας — 息子たちと娘たちを生んだ (формула родословий). ἀπέθανεν — 死んだ."
  12: "LXX: ἑκατὸν τριάκοντα πέντε ἔτη — 百三十五歳 (масор. 35 лет, и сразу Сала)."
  13: "В LXX стих объединяет два поколения: Арфаксад после рождения Каинана живёт 430 лет; Каинан в 130 лет рождает Салу и после живёт 330 лет. В масоретском здесь только «Арфаксад жил 403 года», без Каинана. Переведено по LXX, обе части сохранены."
  14: "LXX: ἑκατὸν τριάκοντα ἔτη — 百三十歳 (масор. 30)."
  15: "LXX: τριακόσια τριάκοντα ἔτη — 三百三十年 (масор. 403)."
  16: "LXX: ἑκατὸν τριάκοντα τέσσαρα ἔτη — 百三十四歳 (масор. 34)."
  17: "LXX: τριακόσια ἑβδομήκοντα — 三百七十年 (масор. 430)."
  18: "LXX: ἑκατὸν τριάκοντα — 百三十歳 (масор. 30)."
  19: "LXX: διακόσια ἐννέα ἔτη — 二百九年 (совпадает с масор.)."
  20: "LXX: ἑκατὸν τριάκοντα δύο — 百三十二歳 (масор. 32)."
  21: "LXX: διακόσια ἑπτὰ ἔτη — 二百七年 (совпадает)."
  22: "LXX: ἑκατὸν τριάκοντα — 百三十歳 (масор. 30)."
  23: "LXX: διακόσια — 二百年 (совпадает)."
  24: "LXX: ἑβδομήκοντα ἐννέα ἔτη — 七十九歳 (масор. 29)."
  25: "LXX: ἑκατὸν εἴκοσι ἐννέα — 百二十九年 (масор. 119)."
  26: "LXX: ἑβδομήκοντα ἔτη — 七十歳. Аврам, Нахор, Аран — アブラム、ナホル、ハラン."
  27: "αἱ γενέσεις Θαρα — テラの系譜. Αρραν ἐγέννησεν τὸν Λωτ — ハランはロトを生んだ."
  28: "ἐνώπιον Θαρα τοῦ πατρὸς αὐτοῦ — 父テラの前で (т. е. при жизни отца). ἐν τῇ χώρᾳ τῶν Χαλδαίων — カルデア人の地で: LXX не называет Ур, это уточнение масоретского текста (есть в ru), поэтому не добавлено."
  29: "ἔλαβον ἑαυτοῖς γυναῖκας — 妻を迎えた. Σαρα, Μελχα — サライ、ミルカ. πατὴρ Μελχα καὶ πατὴρ Ιεσχα — ミルカの父、またイエスカの父."
  30: "στεῖρα καὶ οὐκ ἐτεκνοποίει — 不妊で、子を産まなかった (στεῖρα — «бесплодная»; τεκνοποιέω — «рожать детей»)."
  31: "τὸν Λωτ υἱὸν Αρραν υἱὸν τοῦ υἱοῦ αὐτοῦ — 孫であるハランの子ロト (букв. «сына сына своего»). τὴν νύμφην αὐτοῦ — 嫁. ἐξήγαγεν αὐτοὺς ἐκ τῆς χώρας τῶν Χαλδαίων — カルデア人の地から彼らを連れ出した. ἦλθεν ἕως Χαρραν — ハランまで来た."
  32: "αἱ ἡμέραι Θαρα ἐν Χαρραν διακόσια πέντε ἔτη — ハランで二百五年 (совпадает). ἀπέθανεν Θαρα ἐν Χαρραν — テラはハランで死んだ."
