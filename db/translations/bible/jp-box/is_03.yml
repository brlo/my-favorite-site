# jp-box, Исаия, глава 3. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для главы есть, сверен; в текст не копировался; jp-ni не
# использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 3: 1–7 Господь отнимает у Иуды опору — хлеб, воду, вождей, — и ставит
# юношей; люди хватаются за брата, чтобы тот стал вождём, и получают отказ;
# 8–12 обличение: Иерусалим пал, грех открыт, как Содом, «свяжем праведного»;
# 13–15 Господь вступает в суд со старейшинами, «вы сожгли виноградник Мой»;
# 16–26 второе слово Господа о дочерях Сиона: украшения отняты, вместо них
# позор, сыновья падут от меча, город останется один.
# Голоса: 3:1–15 — одна речь Господа 「…」 (Господь говорит и о Себе в 3-м лице);
# внутри неё вложенная речь людей — 『…』: 3:6, 3:7, 3:10. Формула «так говорит
# Господь» (3:16) — вне кавычек; 3:16б–26 — вторая речь Господа 「…」.
# Заключительная формула «と、万軍の主は言われる» (3:15, слав. добавление) вынесена
# за кавычки, как вводная.
# Нумерация — славяно-синодальная (csl-ru), как и во всей книге: 25 стихов
# (в gr-lxx-byz — 26). Карта: наш 3:1–18 = gr 3:1–18; наш 3:19 = gr 3:19 + gr 3:20
# (у слав. это один стих, csl 3:19); наш 3:20 = gr 3:21; наш 3:21 = gr 3:22;
# наш 3:22 = gr 3:23; наш 3:23 = gr 3:24; наш 3:24 = gr 3:25; наш 3:25 = gr 3:26.
# Внутри перечня украшений слав. режет иначе (к csl 3:20 добавлено «утварь храмную»,
# к csl 3:21 — «виссоны и синеты, и червленицы»), но число стихов от этого не меняется;
# держим деление gr, кроме единственного слияния gr 3:19+3:20 в наш 3:19.
# Ещё одно расхождение: конец gr 3:8 («διότι νῦν ἐταπεινώθη ἡ δόξα αὐτῶν») у слав.
# открывает 3:9 — у нас по gr, отмечено в notes к 3:8 и 3:9.
# 〔…〕 нет. Слав. добавления внесены в основной текст без скобок: 3:15 «глаголет
# Господь саваоф» (в конце, вынесено за кавычки), 3:19 «срачицы тонкия» — оба «нет
# в LXX».
# Сносок ⟨…⟩ нет: 上着, 下着, 腕輪, 指輪, 三日月, 粗布, 禿 уже в корпусе или понятны.
# Имена: シオン, ソドム, ユダ, エルサレム, イスラエル; новых имён нет.

