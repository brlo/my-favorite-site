verses:
  1: "「見[み]よ、支配者[しはいしゃ]である万軍[ばんぐん]の主[しゅ]は、ユダヤとエルサレムから、力[ちから]ある男[おとこ]も力ある女[おんな]も、パンの力も水[みず]の力を取[と]り去[さ]る。"
  2: "勇者[ゆうしゃ]も力[ちから]ある者[もの]も、戦士[せんし]も裁[さば]き手[て]も預言者[よげんしゃ]も、占[うらな]い師[し]も長老[ちょうろう]も、"
  3: "五十人[ごじゅうにん]の長[おさ]も、驚[おどろ]くべき顧問[こもん]も、賢[かしこ]い建築家[けんちくか]も、聡明[そうめい]な聞[き]き手[て]も、"
  4: "わたしは若者[わかもの]たちを彼[かれ]らの君[きみ]として立[た]てる。そして、嘲[あざけ]る者[もの]たちが彼らを支配[しはい]する。"
  5: "民[たみ]は崩[くず]れ落[お]ち、人[ひと]は人に、人は隣人[りんじん]に逆[さから]う。子どもは老人[としより]に、卑[いや]しい者[もの]は尊[とうと]い者[もの]にぶつかる。"
  6: "人[ひと]は兄弟[きょうだい]を、あるいは父[ちち]の家[いえ]の者[もの]をつかんで言[い]う。『上着[うわぎ]があるなら、われわれの頭[かしら]になってくれ。わたしの食[た]べ物[もの]も、あなたの下[した]にあるように。』"
  7: "その日[ひ]、彼[かれ]は答[こた]えて言[い]う。『わたしはあなたの頭[かしら]にはならない。わたしの家[いえ]にはパンも着物[きもの]もないからである。わたしはこの民[たみ]の頭にはならない。』"
  8: "エルサレムは捨[す]てられ、ユダは倒[たお]れた。彼[かれ]らの舌[した]は不法[ふほう]とともにあり、彼らは主[しゅ]に逆[さから]う。彼らの栄光[えいこう]は今[いま]、低[ひく]くされたからである。"
  9: "彼[かれ]らの顔[かお]の恥[はじ]は彼らに逆[さから]い立[た]つ。彼らは自分[じぶん]の罪[つみ]をソドムのように告[つ]げ知[し]らせ、隠[かく]さない。ああ、彼らの魂[たましい]よ。彼らは自分[じぶん]のために悪[わる]い計[はか]りを謀[はか]ったからである。"
  10: "『正[ただ]しい者[もの]を縛[しば]ろう。彼[かれ]はわれわれにとって厄介[やっかい]だから』と言[い]って。それゆえ、彼らは自分[じぶん]の行[おこな]いの実[み]を食[た]べる。"
  11: "ああ、不法[ふほう]な者[もの]よ。彼[かれ]の手[て]の業[わざ]に応[おう]じて、悪[わる]いことが彼に起[お]こる。"
  12: "わが民[たみ]よ、あなたがたの役人[やくにん]たちがあなたがたを刈[か]り取[と]り、取[と]り立[た]てる者[もの]たちがあなたがたを支配[しはい]する。わが民よ、あなたがたを幸[しあわ]せだと言[い]う者たちがあなたがたを惑[まど]わせ、あなたがたの足[あし]の道[みち]を乱[みだ]す。"
  13: "しかし今[いま]、主[しゅ]は裁[さば]きのために立[た]ち、ご自分[じぶん]の民[たみ]を裁[さば]きの場[ば]に立[た]たせる。"
  14: "主[しゅ]ご自身[じしん]が、民[たみ]の長老[ちょうろう]たちとその君[きみ]たちとともに裁[さば]きに来[く]る。あなたがたは、なぜわたしのぶどう畑[ばたけ]を焼[や]いたのか。貧[まず]しい者[もの]から奪[うば]った物[もの]が、あなたがたの家[いえ]にある。"
  15: "あなたがたは、なぜわたしの民[たみ]を虐[しいた]げ、貧[まず]しい者[もの]の顔[かお]を辱[はずかし]めるのか。」と、万軍[ばんぐん]の主[しゅ]は言[い]われる。"
  16: "主[しゅ]はこう言[い]われる。「シオンの娘[むすめ]たちは高[たか]ぶり、首[くび]を高くして歩[あゆ]み、目[め]の動[うご]きで誘[さそ]い、足[あし]の運[はこ]びとともに衣[ころも]を引[ひ]きずり、足で戯[たわむ]れるからである。"
  17: "神[かみ]はシオンの娘[むすめ]たちの長[おさ]たちを低[ひく]くし、主[しゅ]は彼女[かのじょ]たちの姿[すがた]を現[あらわ]す。"
  18: "その日[ひ]、主[しゅ]は彼女[かのじょ]たちの衣[ころも]の栄[えい]と飾[かざ]りを取[と]り去[さ]る。すなわち、編[あ]み込[こ]みの飾り、房飾[ふさかざ]り、三日月[みかづき]の飾り、"
  19: "薄[うす]い下着[したぎ]、顔[かお]の飾り、栄[えい]の飾りの組[く]み合[あ]わせ、腕輪[うでわ]、輪[わ]飾[かざ]り、髪[かみ]の編[あ]み飾り、手[て]の飾り、指輪[ゆびわ]、耳飾[みみかざ]り、"
  20: "紫[むらさき]の衣[ころも]と、紫を織[お]り込[こ]んだ衣、"
  21: "家[いえ]のための覆[おお]いと、透[す]けるラコニアの衣[ころも]、"
  22: "亜麻[あま]の衣[ころも]、ヒヤシンス色[いろ]の衣、緋[ひ]の衣、金[きん]とヒヤシンス色[いろ]で織り合[あ]わせた亜麻の衣、夏[なつ]の寝台[ねだい]の覆[おお]い。"
  23: "そして、香[かおり]のよいものの代[か]わりに塵[ちり]がある。あなたは帯[おび]の代わりに縄[なわ]で体[からだ]を縛[しば]り、金[きん]の頭[かしら]の飾りの代わりに、自分の行[おこな]いのゆえに禿[はげ]となり、紫[むらさき]を織[お]り込[こ]んだ衣[ころも]の代わりに粗布[あらぬの]をまとう。"
  24: "あなたの最[もっと]も美[うつく]しい息子[むすこ]、あなたが愛[あい]する者[もの]は剣[つるぎ]で倒[たお]れ、あなたがたの力[ちから]ある者[もの]たちも剣で倒れる。"
  25: "あなたがたの飾[かざ]りを納[おさ]めた箱[はこ]たちは低[ひく]くされ、泣[な]き悲[かな]しむ。そして、あなたは一[ひと]り残[のこ]され、地[ち]に打[う]ち伏[ふ]せられる。」"

notes:
  1: "Ἰδοὺ δὴ ὁ δεσπότης κύριος σαβαωθ — «вот, Владыка Господь Саваоф» (δεσπότης — владыка, 支配者), формула в начале речи, кавычки открыты здесь. ἀφελεῖ — «отнимет» (ἀφαιρέω). ἰσχύοντα καὶ ἰσχύουσαν — «крепкого и крепкую», т. е. мужчину и женщину; слав. «крепкаго и крепкую». ἰσχὺν ἄρτου καὶ ἰσχὺν ὕδατος — «крепость хлеба и крепость воды», т. е. опору жизни. Слав. порядок «от Иерусалима и от иудеи» обратен гр. «от Иудеи и от Иерусалима» — в тексте по gr."
  2: "γίγαντα καὶ ἰσχύοντα — «исполина и крепкого» (γίγας — гигант, 勇者). ἄνθρωπον πολεμιστήν — «человека воинственного», т. е. воина (πολεμιστής). δικαστήν, προφήτην — «судью, пророка». στοχαστήν — «наблюдателя, прорицателя» (στοχάζομαι — метить, наблюдать); слав. «смотреливаго» (прозорливца), в тексте 占い師. πρεσβύτερον — «старца, старейшину». Перечень продолжается в 3:3 при одном сказуемом ἀφελεῖ из 3:1."
  3: "πεντηκόνταρχον — «пятидесятника» (начальник над пятьюдесятью); θαυμαστὸν σύμβουλον — «дивного советника» (θαυμαστός — удивительный); σοφὸν ἀρχιτέκτονα — «мудрого зодчего» (ἀρχιτέκτων); συνετὸν ἀκροατήν — «разумного слушателя» (ἀκροατής). Слав. «архитектона» и «послушателя» — те же слова буквально. Перечень вождей кончается, дальше — следствие."
  4: "ἐπιστήσω νεανίσκους ἄρχοντας αὐτῶν — «поставлю юношей князьями их» (ἐφίστημι — ставить; νεανίσκος — юноша); ἐμπαῖκται κυριεύσουσιν αὐτῶν — «насмешники будут господствовать над ними» (ἐμπαίκτης — глумящийся; κυριεύω — господствовать). 1-е лицо в греч.; так как вся 3:1–15 — одна речь Господа, отдельной цитаты здесь нет."
  5: "συμπεσεῖται ὁ λαός — «обрушатся (падут) люди» (συμπίπτω); ἄνθρωπος πρὸς ἄνθρωπον — «человек на человека», предлог πρός при глаголе вражды. προσκύψει τὸ παιδίον πρὸς τὸν πρεσβύτην — «споткнётся дитя о старца» (προσκόπτω — спотыкаться, ударяться); ὁ ἄτιμος πρὸς τὸν ἔντιμον — «бесчестный о честного» (ἄτιμος / ἔντιμος). Слав. «приразится отроча к старцу»."
  6: "ἐπιλήμψεται ἄνθρωπος τοῦ ἀδελφοῦ αὐτοῦ ἢ τοῦ οἰκείου τοῦ πατρὸς αὐτοῦ — «схватит человек брата своего или домашнего отца своего» (ἐπιλαμβάνομαι — хватать; οἰκεῖος — домашний, родной). Ἱμάτιον ἔχεις — «одежду имеешь»: слова людей, внутри речи Господа они в 『…』. ἀρχηγὸς ἡμῶν γενοῦ — «стань начальником нашим» (ἀρχηγός — вождь); καὶ τὸ βρῶμα τὸ ἐμὸν ὑπὸ σὲ ἔστω — «и пища моя пусть будет под тобою» (βρῶμα — пища; слав. «брашно мое под тобою да будет»). У ru (МТ) в конце «развалины» — иное чтение, не внесено."
  7: "ἀποκριθεὶς ἐρεῖ ἐν τῇ ἡμέρᾳ ἐκείνῃ — «и отвечая скажет в день тот». Οὐκ ἔσομαί σου ἀρχηγός — «не буду твоим начальником» (σου — ед. ч.); οὐ γὰρ ἔστιν ἐν τῷ οἴκῳ μου ἄρτος οὐδὲ ἱμάτιον — «ибо нет в доме моём ни хлеба, ни одежды»; οὐκ ἔσομαι ἀρχηγὸς τοῦ λαοῦ τούτου — «не буду начальником народа этого». Ответ людей — 『…』 (вложенная речь внутри речи Господа). Переход с «твой» на «народа этого» сохранён."
  8: "ἀνεῖται Ιερουσαλημ — «оставлен (брошен) Иерусалим» (ἀνίημι); ἡ Ιουδαία συμπέπτωκεν — «Иудея пала» (συμπίπτω — обрушиваться); аорист-перфект сохранён как прошедшее. αἱ γλῶσσαι αὐτῶν μετὰ ἀνομίας — «языки их с беззаконием»; τὰ πρὸς κύριον ἀπειθοῦντες — «против Господа поступая непокорно» (ἀπειθέω). διότι νῦν ἐταπεινώθη ἡ δόξα αὐτῶν — «ибо ныне унижена слава их»: по gr это конец 3:8, у слав. («сего ради ныне смирися слава их») — начало 3:9; держим gr."
  9: "ἡ αἰσχύνη τοῦ προσώπου αὐτῶν ἀντέστη αὐτοῖς — «стыд лица их восстал против них» (ἀνθίστημι — противостоять), т. е. свидетельствует против них. τὴν δὲ ἁμαρτίαν αὐτῶν ὡς Σοδομων ἀνήγγειλαν — «и грех свой, как Содомский, возвестили» (ἀναγγέλλω); ἐνεφάνισαν — «явили, обнаружили» (ἐμφανίζω). οὐαὶ τῇ ψυχῇ αὐτῶν — «горе душе их»; βεβούλευνται βουλὴν πονηρὰν καθ᾽ ἑαυτῶν — «замыслили совет злой на себя самих» (βουλεύομαι). Тьма 3:9 и 3:10 связана: слова беззаконных начинаются в 3:10."
  10: "εἰπόντες Δήσωμεν τὸν δίκαιον — «говоря: свяжем праведного» (δέω — вязать): слова беззаконных, внутри речи Господа — 『…』; εἰπόντες продолжает 3:9. ὅτι δύσχρηστος ἡμῖν ἐστιν — «ибо он неудобен (тягостен) нам» (δύσχρηστος); слав. «яко непотребен нам есть» («негоден»). τοίνυν τὰ γενήματα τῶν ἔργων αὐτῶν φάγονται — «итак, плоды дел своих съедят» (γένημα — плод, произведение). У ru (МТ) смысл обратный: «Скажите праведнику, что благо ему, ибо он будет вкушать плоды дел своих»; держим LXX и слав."
  11: "οὐαὶ τῷ ἀνόμῳ — «горе беззаконному». πονηρὰ κατὰ τὰ ἔργα τῶν χειρῶν αὐτοῦ συμβήσεται αὐτῷ — «злое по делам рук его случится с ним» (συμβαίνω — случаться); слав. «лукавая бо приключатся ему по делом руку его». Стих — антитеза 3:10: там праведный, здесь беззаконный."
  12: "οἱ πράκτορες ὑμῶν καλαμῶνται ὑμᾶς — «приставники ваши пожинают вас» (πράκτωρ — приставник, надзиратель; καλαμάομαι — жать, пожинать), образ жатвы; слав. «приставницы ваши пожинают вас». οἱ ἀπαιτοῦντες κυριεύουσιν ὑμῶν — «требующие (долги) господствуют над вами» (ἀπαιτέω — требовать); слав. «истязающии обладают вами». οἱ μακαρίζοντες ὑμᾶς πλανῶσιν ὑμᾶς — «ублажающие вас вводят вас в заблуждение» (μακαρίζω — ублажать; πλανάω — вводить в заблуждение); τὸν τρίβον τῶν ποδῶν ὑμῶν ταράσσουσιν — «стезю ног ваших смущают» (τρίβος — стезя; ταράσσω — возмущать)."
  13: "καταστήσεται εἰς κρίσιν κύριος — «станет (предстанет) на суд Господь» (καθίστημι); στήσει εἰς κρίσιν τὸν λαὸν αὐτοῦ — «поставит на суд народ Свой» (ἵστημι). Слав. «устроится Господь на суд и поставит на суд люди своя». У ru (МТ) «восстал Господь на суд… чтобы судить народы» — иное распространение, не внесено."
  14: "αὐτὸς κύριος εἰς κρίσιν ἥξει — «Сам Господь на суд придёт»; μετὰ τῶν πρεσβυτέρων τοῦ λαοῦ καὶ μετὰ τῶν ἀρχόντων αὐτοῦ — «со старейшинами народа и с князьями его». Ὑμεῖς δὲ τί ἐνεπυρίσατε τὸν ἀμπελῶνά μου — «вы же зачем сожгли виноградник Мой?» (ἐμπυρίζω — сожигать; ἀμπελών — виноградник, ぶどう畑). ἡ ἁρπαγὴ τοῦ πτωχοῦ ἐν τοῖς οἴκοις ὑμῶν — «награбленное у бедного в домах ваших» (ἁρπαγή — грабёж, добыча). С 14б начинается прямая речь к «вам» внутри общей речи 3:1–15, продолжается в 3:15."
  15: "τί ὑμεῖς ἀδικεῖτε τὸν λαόν μου — «зачем вы обижаете народ Мой?» (ἀδικέω); τὸ πρόσωπον τῶν πτωχῶν καταισχύνετε — «и лицо бедных посрамляете» (καταισχύνω). Слав. добавляет в конце «глаголет Господь саваоф» — этого нет в LXX; по паритету внесено в основной текст без скобок, но как заключительная формула вынесено за кавычки («と、万軍の主は言われる»). Здесь закрывается слово Господа 3:1–15."
  16: "Τάδε λέγει κύριος — «так говорит Господь»: формула вне кавычек, после неё начинается второе слово Господа (3:16б–26). Ἀνθ᾽ ὧν ὑψώθησαν αἱ θυγατέρες Σιων — «за то, что вознеслись дочери Сиона» (ἀνθ᾽ ὧν — потому что; ὑψόω — возносить); ἐπορεύθησαν ὑψηλῷ τραχήλῳ — «ходили с высокою шеей» (τράχηλος — шея); ἐν νεύμασιν ὀφθαλμῶν — «киванием очей» (νεῦμα — кивок; слав. «помизанием очес»); ἅμα σύρουσαι τοὺς χιτῶνας — «вместе волоча хитоны» (σύρω — волочить; χιτών — хитон, нижняя одежда); τοῖς ποσὶν ἅμα παίζουσαι — «ногами вместе играя» (παίζω — играть)."
  17: "ταπεινώσει ὁ θεὸς ἀρχούσας θυγατέρας Σιων — «смирит Бог начальствующих дочерей Сиона» (ἄρχουσα — начальствующая); слав. «смирит Господь началныя дщери сиони» — в слав. оба раза «Господь», в гр. θεός и κύριος, в тексте 神 и 主. κύριος ἀποκαλύψει τὸ σχῆμα αὐτῶν — «Господь откроет вид их» (ἀποκαλύπτω — открывать; σχῆμα — образ, вид); слав. «открыет срамоту их», в тексте 姿を現す."
  18: "С этого стиха начинается перечень украшений (3:18–23), где слав. делит иначе. По gr: δόξαν τοῦ ἱματισμοῦ αὐτῶν — «славу одеяния их»; τοὺς κόσμους — «украшения» (κόσμος); τὰ ἐμπλόκια — «вплетения» (ἐμπλόκιον); τοὺς κοσύμβους — «бахрому, кисти» (κόσυμβος); τοὺς μηνίσκους — «луночки» (μηνίσκος, 三日月の飾り). Карта (по csl, как во всей книге): наш 3:19 = csl 3:19 = gr 3:19 + gr 3:20; наш 3:20 = csl 3:20 = gr 3:21; наш 3:21 = gr 3:22; наш 3:22 = gr 3:23; наш 3:23 = gr 3:24; наш 3:24 = gr 3:25; наш 3:25 = gr 3:26. Внутри рядов слав. режет иначе (см. notes 19–22), поэтому границы членов у нас по gr."
  19: "καὶ τὸ κάθεμα — «и подвеску (ожерелье)» (κάθεμα — подвеска, серьга); καὶ τὸν κόσμον τοῦ προσώπου αὐτῶν — «и украшение лица их». Слав. открывает 3:19 добавлением «срачицы тонкия» («тонкие сорочки») — этого нет в LXX; по паритету внесено в основной текст без скобок (薄い下着). По gr в 3:19 только два члена; остальные украшения из gr 3:20 у слав. тоже в 3:19 — по csl это один стих, поэтому gr 3:19 и gr 3:20 слиты в наш 3:19 (см. карту в notes к 3:18). σύνθεσιν τοῦ κόσμου τῆς δόξης — «сочетание украшений славы» (σύνθεσις — составление, набор); χλιδῶνας — «запястья» (χλιδών); ψέλια — «браслеты» (ψέλιον); ἐμπλόκιον — «плетение для волос»; περιδέξια — «наручья, браслеты» (περιδέξιον); δακτυλίους — «перстни» (δακτύλιος); ἐνώτια — «серьги» (ἐνώτιον). Слав. «обручи и перстни, и мониста и запястия и художныя усерязи» отвечает этому ряду, но стоит в csl 3:19; в нашем тексте по gr — 3:20. По csl оба ряда — один стих (слав. 3:19: «и срачицы тонкия, и красоту лица их и состроение красы славныя, и обручи и перстни, и мониста и запястия и художныя усерязи»), поэтому gr 3:19 + gr 3:20 у нас слиты в один 3:19; дальше наш N = gr N+1 (наш 3:20 = gr 3:21 и т. д.)."
  20: "περιπόρφυρα καὶ μεσοπόρφυρα — «пурпурные [одежды] и с пурпуром посередине» (περιπόρφυρος — обшитый пурпуром; μεσοπόρφυρος — с пурпурной полосой посередине); слав. «багряницы и пребагряная». У слав. к этому же стиху (csl 3:20) добавлено «утварь храмную» (ἐπιβλήματα из gr 3:22); наш 3:20 = gr 3:21, без этого добавления."
  21: "τὰ ἐπιβλήματα τὰ κατὰ τὴν οἰκίαν — «покрывала для дома» (ἐπίβλημα — покрывало, накидка); τὰ διαφανῆ Λακωνικά — «прозрачные лаконские [ткани]» (διαφανής — прозрачный; Λακωνικά — лаконские тонкие полотна, ラコニア). Слав. «утварь храмную» и «светлая лаконская» — те же слова, но поделены иначе (csl 3:20–21). Наш 3:21 = gr 3:22."
  22: "τὰ βύσσινα καὶ τὰ ὑακίνθινα καὶ τὰ κόκκινα — «льняные, гиацинтовые и алые [одежды]» (βύσσινος — льняной; ὑακίνθινος — цвета гиацинта; κόκκινος — алый); τὴν βύσσον σὺν χρυσίῳ καὶ ὑακίνθῳ συγκαθυφασμένα — «виссон, сотканный с золотом и гиацинтом» (βύσσος — тонкий лён; συγκαθυφαίνω — ткать вместе); θέριστρα κατάκλιτα — «летние постели (покрывала)» (θέριστρον — летняя одежда; κατάκλιτος — для возлежания); слав. «тончицы преиманы златом». Слав. делит этот ряд между csl 3:21–22; наш 3:22 = gr 3:23."
  23: "ἀντὶ ὀσμῆς ἡδείας κονιορτός — «вместо благовония — пыль» (ὀσμή — запах; ἡδεῖα — приятная; κονιορτός — пыль); слав. «вместо вони добрыя смрад» (смрад — зловоние), у ru (МТ) «зловоние». ἀντὶ ζώνης σχοινίῳ ζώσῃ — «вместо пояса верёвкой опояшешься» (ζώνη — пояс; σχοινίον — верёвка); ἀντὶ τοῦ κόσμου τῆς κεφαλῆς τοῦ χρυσίου φαλάκρωμα ἕξεις — «вместо золотого украшения головы будешь иметь плешь» (φαλάκρωμα — плешь, 禿); διὰ τὰ ἔργα σου — «за дела твои»; ἀντὶ τοῦ χιτῶνος τοῦ μεσοπορφύρου περιζώσῃ σάκκον — «вместо хитона с пурпуром опояшешься вретищем» (σάκκος — мешковина, 粗布). У слав. это 3:23 (сдвиг −1)."
  24: "ὁ υἱός σου ὁ κάλλιστος, ὃν ἀγαπᾷς — «сын твой прекраснейший, которого ты любишь» (κάλλιστος — превосходная степень от καλός); μαχαίρᾳ πεσεῖται — «падёт от меча». οἱ ἰσχύοντες ὑμῶν μαχαίρᾳ πεσοῦνται — «крепкие ваши от меча падут»: переход с ед. ч. на мн. ч. сохранён. Слав. добавляет в конце «и смирятся» — при gr 3:25 этого нет (ταπεινωθήσονται стоит в gr 3:26), в текст не внесено. У слав. это 3:24."
  25: "αἱ θῆκαι τοῦ κόσμου ὑμῶν — «хранилища (ящики) украшений ваших» (θήκη — ящик, футляр; κόσμος — украшение); ταπεινωθήσονται καὶ πενθήσουσιν — «смирятся и восплачут»; слав. «восплачутся хранилища утварей ваших». καταλειφθήσῃ μόνη — «останешься одна» (καταλείπω); εἰς τὴν γῆν ἐδαφισθήσῃ — «в землю будешь повержена» (ἐδαφίζω — повергать на землю, разорять); слав. «о землю ударена будеши». У слав. это csl 3:25; здесь закрывается вторая речь Господа (gr 3:16–26 = csl 3:16–25)."
