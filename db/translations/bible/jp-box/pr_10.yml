verses:
  1: "知恵[ちえ]ある子[こ]は父[ちち]を喜[よろこ]ばせ、愚[おろ]かな子は母[はは]の悲[かな]しみとなる。"
  2: "不法[ふほう]な者[もの]の宝[たから]は役[やく]に立[た]たない。しかし、正[ただ]しさは死[し]から救[すく]い出[だ]す。"
  3: "主[しゅ]は正[ただ]しい者[もの]の魂[たましい]を飢[う]えさせない。しかし、不敬[ふけい]な者[もの]たちの暮[く]らしを覆[くつがえ]す。"
  4: "貧[まず]しさは人[ひと]を低[ひく]くする。しかし、雄々[おお]しい者[もの]の手[て]は富[とみ]ませる。訓練[くんれん]を受[う]けた子[こ]は知恵[ちえ]ある者[もの]となる。しかし、愚[おろ]かな者[もの]はしもべとして用[もち]いられる。"
  5: "暑[あつ]さを免[まぬか]れたのは思慮[しりょ]ある子[こ]である。しかし、無法[むほう]な子は刈[か]り入[い]れのとき風[かぜ]に傷[いた]む。"
  6: "主[しゅ]の祝福[しゅくふく]は正[ただ]しい者[もの]の頭[あたま]にある。しかし、不敬[ふけい]な者[もの]の口[くち]は時[とき]ならぬ悲[かな]しみを覆[おお]う。"
  7: "正[ただ]しい者[もの]たちの記憶[きおく]は賛[ほ]めとともにある。しかし、不敬[ふけい]な者[もの]の名[な]は消[き]え去[さ]る。"
  8: "心[こころ]に知恵[ちえ]ある者[もの]は戒[いまし]めを受[う]け入[い]れる。しかし、唇[くちびる]を覆[おお]わぬ者[もの]は、曲[ま]がったことを言[い]って足[あし]をすくわれる。"
  9: "まっすぐに歩[あゆ]む者[もの]は安[あん]心[しん]して歩む。しかし、自分[じぶん]の道[みち]を曲[ま]げる者[もの]は知[し]られてしまう。"
  10: "目[め]で合図[あいず]して欺[あざむ]く者[もの]は人[ひと]に悲[かな]しみを集[あつ]める。しかし、公然[こうぜん]と戒[いまし]める者[もの]は平和[へいわ]を造[つく]る。"
  11: "正[ただ]しい者[もの]の手[て]にはいのちの泉[いずみ]がある。しかし、不敬[ふけい]な者[もの]の口[くち]は滅[ほろ]びで覆[おお]われる。"
  12: "憎[にく]しみは争[あらそ]いを起[おこ]す。しかし、争[あらそ]いを好[この]まないすべての者[もの]を愛[あい]が覆[おお]う。"
  13: "唇[くちびる]から知恵[ちえ]を出[だ]す者[もの]は、心[こころ]なき人[ひと]を杖[つえ]で打[う]つ。"
  14: "知恵[ちえ]ある者[もの]たちは知識[ちしき]を隠[かく]す。しかし、軽率[けいそつ]な者[もの]の口[くち]は破滅[はめつ]に近[ちか]づく。"
  15: "富[とみ]める者[もの]の財産[ざいさん]は堅固[けんご]な町[まち]。しかし、不敬[ふけい]な者[もの]の破滅[はめつ]は貧[まず]しさである。"
  16: "正[ただ]しい者[もの]のわざはいのちを生[う]む。しかし、不敬[ふけい]な者[もの]の実[み]は罪[つみ]である。"
  17: "戒[いまし]めはいのちに至[いた]る正[ただ]しい道[みち]を守[まも]る。しかし、責[せ]めのない戒[いまし]めは人[ひと]を迷[まよ]わせる。"
  18: "正[ただ]しい唇[くちびる]は憎[にく]しみを覆[おお]い隠[かく]す。しかし、ののしりを口[くち]にする者[もの]は最[もっと]も愚[おろ]かな者[もの]である。"
  19: "多[おお]く語[かた]れば罪[つみ]を免[まぬか]れない。しかし、唇[くちびる]を慎[つつし]む者[もの]は思慮[しりょ]深[ぶか]い。"
  20: "正[ただ]しい者[もの]の舌[した]は火[ひ]で清[きよ]められた銀[ぎん]。しかし、不敬[ふけい]な者[もの]の心[こころ]は消[き]え失[う]せる。"
  21: "正[ただ]しい者[もの]たちの唇[くちびる]は高[たか]いことを知[し]っている。しかし、愚[おろ]かな者[もの]たちは乏[とぼ]しさのうちに死[し]ぬ。"
  22: "主[しゅ]の祝福[しゅくふく]は正[ただ]しい者[もの]の頭[あたま]にある。これが富[とみ]ませ、これに悲[かな]しみが心[こころ]に加[くわ]えられることはない。"
  23: "愚[おろ]かな者[もの]は笑[わら]いながら悪[あく]を行[おこな]う。しかし、知恵[ちえ]は人[ひと]に思慮[しりょ]を産[う]む。"
  24: "不敬[ふけい]な者[もの]は滅[ほろ]びのうちを巡[めぐ]り歩[ある]く。しかし、正[ただ]しい者[もの]の願[ねが]いは受[う]け入[い]れられる。"
  25: "激[はげ]しい嵐[あらし]が過[す]ぎ去[さ]ると、不敬[ふけい]な者[もの]は消[き]え去[さ]る。しかし、正[ただ]しい者[もの]は身[み]をかわして、とこしえに救[すく]われる。"
  26: "歯[は]に害[がい]な未熟[みじゅく]なぶどうと、目[め]に煙[けむり]。それと同じく、不法[ふほう]はそれに携[たずさ]わる者[もの]にとってそうである。"
  27: "主[しゅ]を恐[おそ]れることは日[ひ]を増[ま]し加[くわ]える。しかし、不敬[ふけい]な者[もの]の年[とし]は少[すく]なくされる。"
  28: "正[ただ]しい者[もの]たちには喜[よろこ]びが長[なが]く続[つづ]く。しかし、不敬[ふけい]な者[もの]たちの希望[きぼう]は滅[ほろ]びる。"
  29: "主[しゅ]を恐[おそ]れることは敬虔[けいけん]な者[もの]の砦[とりで]である。しかし、悪[あく]を行[おこな]う者[もの]には破滅[はめつ]がある。"
  30: "正[ただ]しい者[もの]はとこしえに揺[ゆ]るがない。しかし、不敬[ふけい]な者[もの]たちは地[ち]に住[す]まない。"
  31: "正[ただ]しい者[もの]の口[くち]は知恵[ちえ]を滴[したた]らせる。しかし、不正[ふせい]な者[もの]の舌[した]は断[た]ち絶[た]やされる。"
  32: "正[ただ]しい人[ひと]々[びと]の唇[くちびる]は恵[めぐ]みを滴[したた]らせる。しかし、不敬[ふけい]な者[もの]の口[くち]は退[しりぞ]けられる。"

notes:
  1: "Υἱὸς σοφὸς εὐφραίνει πατέρα — 知恵ある子は父を喜ばせる (εὐφραίνω — веселить, радовать). υἱὸς δὲ ἄφρων λύπη τῇ μητρί — а глупый сын — печаль матери (именное сказуемое без глагола, датив принадлежности). csl и jp-joc совпадают с LXX."
  2: "οὐκ ὠφελήσουσιν θησαυροὶ ἀνόμους — не принесут пользы сокровища беззаконным (ὠφελέω — помогать, приносить пользу; в LXX здесь ἄνομος, беззаконный, а не ἀσεβής). δικαιοσύνη δὲ ῥύσεται ἐκ θανάτου — правда же избавит от смерти (ῥύομαι — избавлять)."
  3: "οὐ λιμοκτονήσει κύριος ψυχὴν δικαίαν — не уморит голодом Господь душу праведную (λιμοκτονέω — морить голодом). ζωὴν δὲ ἀσεβῶν ἀνατρέψει — жизнь же нечестивых ниспровергнет; ζωή здесь — «жизнь, средства к жизни» (csl «живот», ru «стяжание»), передано 暮らし."
  4: "πενία ἄνδρα ταπεινοῖ — бедность смиряет человека (ταπεινόω — унижать, смирять). χεῖρες δὲ ἀνδρείων πλουτίζουσιν — руки же мужественных обогащают (ἀνδρεῖος — мужественный, крепкий). В gr подстих 4a: υἱὸς πεπαιδευμένος σοφὸς ἔσται, τῷ δὲ ἄφρονι διακόνῳ χρήσεται — воспитанный сын будет мудр, а глупым (отец) будет пользоваться как слугою; в csl 4a стоит в начале 10:5, поэтому переведён здесь, стих не делим."
  5: "διεσώθη ἀπὸ καύματος υἱὸς νοήμων — спасся от зноя разумный сын (διασῴζω — спасать; καῦμα — зной). ἀνεμόφθορος δὲ γίνεται ἐν ἀμήτῳ υἱὸς παράνομος — а беззаконный сын на жатве повреждается ветром (ἀνεμόφθορος — повреждённый ветром, редкое слово; ἄμητος — жатва). jp-joc и ru здесь идут по МТ («собирающий летом»), у нас LXX."
  6: "εὐλογία κυρίου ἐπὶ κεφαλὴν δικαίου — благословение Господне на голове праведного. στόμα δὲ ἀσεβῶν καλύψει πένθος ἄωρον — уста же нечестивых покроет плач безвременный (ἄωρος — преждевременный; καλύπτω — покрывать). ru «заградит насилие» — МТ."
  7: "μνήμη δικαίων μετ᾽ ἐγκωμίων — память праведных с похвалами (ἐγκώμιον — похвала). ὄνομα δὲ ἀσεβοῦς σβέννυται — имя же нечестивого угасает (σβέννυμι — гасить)."
  8: "σοφὸς καρδίᾳ δέξεται ἐντολάς — мудрый сердцем примет заповеди. ὁ δὲ ἄστεγος χείλεσιν σκολιάζων ὑποσκελισθήσεται — а несдержанный, говорящий устами криво, будет подсечён (ἄστεγος — «без кровли», т. е. не сдерживающий себя; σκολιάζω — говорить криво, лукаво; ὑποσκελίζομαι — быть подсечённым, запнуться)."
  9: "ὃς πορεύεται ἁπλῶς, πορεύεται πεποιθώς — кто ходит просто, ходит с упованием (ἁπλῶς — прямодушно; πεποιθώς — доверяя). ὁ δὲ διαστρέφων τὰς ὁδοὺς αὐτοῦ γνωσθήσεται — извращающий же пути свои будет узнан (csl «познан будет», ru «будет наказан» — МТ)."
  10: "ὁ ἐννεύων ὀφθαλμοῖς μετὰ δόλου — подающий знаки глазами с лукавством (ἐννεύω — кивать, мигать). συνάγει ἀνδράσι λύπας — собирает людям печали. ὁ δὲ ἐλέγχων μετὰ παρρησίας εἰρηνοποιεῖ — обличающий же с дерзновением творит мир (παρρησία — открытость, дерзновение; εἰρηνοποιέω — миротворить). В ru 10:10–11 стоит «глупый устами преткнется» — МТ, в LXX этого нет."
  11: "πηγὴ ζωῆς ἐν χειρὶ δικαίου — источник жизни в руке праведного (πηγή — источник). στόμα δὲ ἀσεβοῦς καλύψει ἀπώλεια — уста же нечестивого покроет погибель (ἀπώλεια). jp-joc: «уста — источник жизни» — иное, по МТ."
  12: "μῖσος ἐγείρει νεῖκος — ненависть воздвигает распрю (νεῖκος — ссора, распря). πάντας δὲ τοὺς μὴ φιλονεικοῦντας καλύπτει φιλία — всех же, кто не любит спорить, покрывает дружба (φιλονεικέω — любить споры; φιλία — дружба, любовь). ru «покрывает все грехи» — МТ."
  13: "ὃς ἐκ χειλέων προφέρει σοφίαν — кто из уст произносит премудрость. ῥάβδῳ τύπτει ἄνδρα ἀκάρδιον — жезлом бьёт мужа бессердечного (ῥάβδος — жезл, палка; ἀκάρδιος — бессердечный, неразумный). ru и jp-joc: «на спине глупого розга» — МТ."
  14: "σοφοὶ κρύψουσιν αἴσθησιν — мудрые скроют знание (αἴσθησις — чувство, разумение; csl «чувство»). στόμα δὲ προπετοῦς ἐγγίζει συντριβῇ — уста же опрометчивого приближаются к сокрушению (προπετής — дерзкий, опрометчивый; συντριβή — сокрушение)."
  15: "κτῆσις πλουσίων πόλις ὀχυρά — стяжание богатых — город крепкий (κτῆσις — имущество; ὀχυρός — укреплённый). συντριβὴ δὲ ἀσεβῶν πενία — сокрушение же нечестивых — бедность, т. е. их погибель есть нищета. jp-joc иначе (МТ)."
  16: "ἔργα δικαίων ζωὴν ποιεῖ — дела праведных творят жизнь. καρποὶ δὲ ἀσεβῶν ἁμαρτίας — плоды же нечестивых — греха (род. пад.: плоды их суть грех; καρποί — плоды, доходы)."
  17: "ὁδοὺς δικαίας ζωῆς φυλάσσει παιδεία — пути правые жизни хранит наставление (παιδεία — наставление, наказание). παιδεία δὲ ἀνεξέλεγκτος πλανᾶται — наставление же необличающее блуждает (ἀνεξέλεγκτος — не изобличающее, оставляющее без обличения; тёмное место: csl «наказанием же не обличеный заблуждает», ru иначе)."
  18: "καλύπτουσιν ἔχθραν χείλη δίκαια — покрывают вражду уста праведные (δίκαια — правые; ru «уста лживые» — МТ). οἱ δὲ ἐκφέροντες λοιδορίας ἀφρονέστατοί εἰσιν — произносящие же поношения глупейшие суть (λοιδορία — поношение, клевета; превосх. степень ἀφρονέστατος)."
  19: "ἐκ πολυλογίας οὐκ ἐκφεύξῃ ἁμαρτίαν — от многословия не избежишь греха (πολυλογία — многословие; ἐκφεύγω — избегать). φειδόμενος δὲ χειλέων νοήμων ἔσῃ — щадящий же уста будет разумен (φείδομαι — щадить; νοήμων — рассудительный)."
  20: "ἄργυρος πεπυρωμένος γλῶσσα δικαίου — серебро, очищенное огнём, — язык праведного (πεπυρωμένος — раскалённый, очищенный; csl «разжженое»). καρδία δὲ ἀσεβοῦς ἐκλείψει — сердце же нечестивого исчезнет (ἐκλείπω — оскудевать, исчезать)."
  21: "χείλη δικαίων ἐπίσταται ὑψηλά — уста праведных знают высокое (ὑψηλά — возвышенное). οἱ δὲ ἄφρονες ἐν ἐνδείᾳ τελευτῶσιν — глупые же в нужде умирают (ἔνδεια — скудость; τελευτάω — кончаться, умирать). ru «уста праведного пасут многих» — МТ."
  22: "εὐλογία κυρίου ἐπὶ κεφαλὴν δικαίου — благословение Господне на голове праведного. αὕτη πλουτίζει — оно обогащает. οὐ μὴ προστεθῇ αὐτῇ λύπη ἐν καρδίᾳ — отнюдь не приложится к нему печаль в сердце (двойное οὐ μή — усиленное отрицание). jp-joc короче (МТ); обе половины у gr и csl."
  23: "ἐν γέλωτι ἄφρων πράσσει κακά — со смехом глупый делает зло (ἐν γέλωτι — шутя, со смехом). ἡ δὲ σοφία ἀνδρὶ τίκτει φρόνησιν — мудрость же мужу рождает разум (τίκτω — рождать; φρόνησις — разум, рассудительность)."
  24: "ἐν ἀπωλείᾳ ἀσεβὴς περιφέρεται — в погибели нечестивый носится (περιφέρομαι — кружиться, носиться). ἐπιθυμία δὲ δικαίου δεκτή — желание же праведного приемлемо (δεκτός — угодный, приемлемый)."
  25: "παραπορευομένης καταιγίδος ἀφανίζεται ἀσεβής — когда проходит буря, нечестивый исчезает (καταιγίς — буря, вихрь; ἀφανίζομαι — исчезать). δίκαιος δὲ ἐκκλίνας σῴζεται εἰς τὸν αἰῶνα — праведный же, уклонившись, спасается навек (ἐκκλίνω — уклоняться; εἰς τὸν αἰῶνα — во век). ru «на вечном основании» — МТ."
  26: "ὥσπερ ὄμφαξ ὀδοῦσι βλαβερὸν καὶ καπνὸς ὄμμασιν — как незрелый виноград вреден зубам и дым глазам (ὄμφαξ — кислый, незрелый плод; βλαβερός — вредный). οὕτως παρανομία τοῖς χρωμένοις αὐτήν — так беззаконие для пользующихся им (χράομαι — пользоваться, иметь дело). ru «ленивый для посылающих» — МТ."
  27: "φόβος κυρίου προστίθησιν ἡμέρας — страх Господень прибавляет дней (формула книги; προστίθημι — прибавлять). ἔτη δὲ ἀσεβῶν ὀλιγωθήσεται — лета же нечестивых умалятся (ὀλιγόω — уменьшать; мн. ἔτη при ед. глаголе — конструкция по смыслу)."
  28: "ἐγχρονίζει δικαίοις εὐφροσύνη — длится у праведных веселие (ἐγχρονίζω — задерживаться, продолжаться). ἐλπὶς δὲ ἀσεβῶν ὄλλυται — надежда же нечестивых погибает (ὄλλυμι — губить)."
  29: "ὀχύρωμα ὁσίου φόβος κυρίου — твердыня благочестивого — страх Господень (ὀχύρωμα — укрепление; ὅσιος — благочестивый, преподобный). συντριβὴ δὲ τοῖς ἐργαζομένοις κακά — сокрушение же делающим зло. ru «путь Господень — твердыня» — МТ."
  30: "δίκαιος τὸν αἰῶνα οὐκ ἐνδώσει — праведник во век не уступит (ἐνδίδωμι — уступать, поддаваться; csl «не поколеблется»). ἀσεβεῖς δὲ οὐκ οἰκήσουσιν γῆν — нечестивые же не населят земли (обетование земли)."
  31: "στόμα δικαίου ἀποστάζει σοφίαν — уста праведного источают премудрость (ἀποστάζω — капать, источать; csl «каплют»). γλῶσσα δὲ ἀδίκου ἐξολεῖται — язык же неправедного истребится (ἐξολλύω — истреблять). В csl 10:31 кончается двоеточием, а 10:32 начинается со строчной — держимся деления gr."
  32: "χείλη ἀνδρῶν δικαίων ἀποστάζει χάριτας — уста мужей праведных источают благодати (χάρις — благодать, приятность; мн. χάριτας). στόμα δὲ ἀσεβῶν ἀποστρέφεται — уста же нечестивых отвращаются, извращаются (ἀποστρέφομαι; csl «развращаются»)."
