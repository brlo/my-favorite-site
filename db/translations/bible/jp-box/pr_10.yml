# jp-box, Притчи, глава 10. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc (1901) есть для 10:1–22 — контроль церковного чтения, архаизмы
# не копировались. jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 10: сборник двустиший Соломона — сын и родители (1), богатство и правда (2),
# труд и лень (4–5), уста и язык (6–14, 18–21, 31–32), богатство (15), страх Господень
# (27), надежда (28). Прямой речи в главе нет: все стихи — авторские изречения,
# внешних кавычек нет. Двустишия: параллелизм сохранён, не сглажен.
# Нумерация по gr: 32 стиха. 10:4 в gr включает подстих 4a (υἱὸς πεπαιδευμένος…);
# в csl он стоит в начале 10:5 — в один стих не дробим, 4a переведён в 10:4.
# 〔…〕 нет: все стихи есть в gr-lxx-byz. Сносок ⟨…⟩ нет.
# Имена — транслитерация греческого (LXX).

