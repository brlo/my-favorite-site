verses:
  1: "永遠[えいえん]に生[い]きる方[かた]はすべてのものを共[とも]に造[つく]られた。"
  2: "主[しゅ]だけが正[ただ]しいと認[みと]められる。主のほかにだれもいない。"
  3: "主[しゅ]はご自分[じぶん]の手[て]の一[ひと]スパンで世界[せかい]を操[あやつ]り、すべては主の御心[みこころ]に従[したが]う。主はその力[ちから]によってすべてのものの王[おう]であり、それらの中[なか]で聖[せい]なるものと俗[ぞく]なるものを分[わ]けられる。"
  4: "主[しゅ]はご自分[じぶん]のわざを告[つ]げ知[し]らせることを、だれにも任[まか]せなかった。だれが主の偉大[いだい]さを探[さぐ]り知[し]ることができるだろうか。"
  5: "だれが主[しゅ]の威光[いこう]の力[ちから]を数[かぞ]え上げるだろうか。だれが主のあわれみを語[かた]り尽[つ]くすために、さらに何[なに]かを加[くわ]えるだろうか。"
  6: "主[しゅ]の驚[おどろ]くべきわざを減[へ]らすことも増[ふ]やすこともできず、探[さぐ]り知[し]ることもできない。"
  7: "人[ひと]が終[お]えたとき、そのときが始[はじ]まりであり、やめたとき、そのとき戸惑[とまど]うのである。"
  8: "人[ひと]とは何[なん]か。その用[やく]は何か。その善[ぜん]は何か。その悪[あく]は何か。"
  9: "人[ひと]の日[ひ]の数[かず]は、百[ひゃく]年[ねん]あれば多[おお]い。"
  10: "海[うみ]からの一滴[いってき]の水[みず]、砂[すな]の一粒[ひとつぶ]のように、永遠[えいえん]の日[ひ]のうちで人[ひと]の年[とし]はわずかである。"
  11: "それゆえ、主[しゅ]は彼[かれ]らに対して寛[かん]容[よう]でおられ、彼らの上[うえ]にご自分[じぶん]のあわれみを注[そそ]がれた。"
  12: "主[しゅ]は彼[かれ]らの滅[ほろ]びが悪[あく]であることを見[み]て知[し]られた。それゆえ、主はその宥[ゆる]しを増[ふ]やされた。"
  13: "人[ひと]のあわれみは隣人[りんじん]に及[およ]び、主[しゅ]のあわれみはすべての肉[にく]に及ぶ。主は牧者[ぼくしゃ]が群[む]れを顧[かえり]みるように、叱[しか]り、戒[いまし]め、教[おし]え、立[た]ち帰[かえ]らせる。"
  14: "主[しゅ]は教[おし]えを受[う]け入[い]れる者[もの]をあわれみ、ご自分[じぶん]の裁[さば]きに急[いそ]ぎ向[む]かう者をもあわれまれる。"
  15: "子[こ]よ、善[よ]いことをするときに非難[ひなん]の種[たね]を蒔[ま]くな。すべての贈[おく]り物[もの]に言葉[ことば]の悲[かな]しみを添[そ]えるな。"
  16: "露[つゆ]は炎暑[えんしょ]を和[やわ]らげないだろうか。そのように、言葉[ことば]は贈[おく]り物[もの]よりも優[すぐ]れている。"
  17: "見[み]よ、言葉[ことば]は良[よ]い贈[おく]り物[もの]にまさるではないか。しかも、恵[めぐ]みを受[う]けた人[ひと]にあってはその両方[りょうほう]がある。"
  18: "愚[おろ]かな者[もの]は感謝[かんしゃ]なく責[せ]め立て、ねたむ者[もの]の贈[おく]り物[もの]は目[め]を衰[おとろ]えさせる。"
  19: "語[かた]る前[まえ]に学[まな]べ。病[やまい]の前[まえ]に癒[いや]せ。"
  20: "裁[さば]きの前[まえ]に自分[じぶん]を吟味[ぎんみ]せよ。訪[おとず]れの時[とき]に、あなたは宥[ゆる]しを見[み]いだす。"
  21: "病[やまい]にかかる前[まえ]に身[み]を低[ひく]くせよ。罪[つみ]の時[とき]には悔[く]い改[あらた]めを示[しめ]せ。"
  22: "誓[ちか]いを良[よ]い時[とき]に果[は]たすことを妨[さまた]げられるな。死[し]に至[いた]るまで正[ただ]しいとされるのを待[ま]つな。"
  23: "祈[いの]る前[まえ]に自分[じぶん]を備[そな]えよ。主[しゅ]を試[こころ]みる人[ひと]のようになってはならない。"
  24: "終[お]わりの日[ひ]に怒[いか]りを思[おも]い起[おこ]せ。主[しゅ]が顔[かお]を背[そむ]けられる復讐[ふくしゅう]の時[とき]を思え。"
  25: "満[み]ち足[た]りた時[とき]に飢[う]えの時[とき]を思[おも]い起[おこ]せ。富[とみ]の日[ひ]に貧[まず]しさと乏[とぼ]しさを思え。"
  26: "朝[あさ]から夕[ゆう]べまで時[とき]は移[うつ]り変[か]わり、すべては主[しゅ]の前[まえ]で速[はや]く過[す]ぎ去[さ]る。"
  27: "知恵[ちえ]ある人[ひと]はすべてのことにおいて慎[つつし]み、罪[つみ]の日[ひ]には過[あやま]ちから身[み]を守[まも]る。"
  28: "悟[さと]りのある者[もの]はすべて知恵[ちえ]を知[し]り、それを見[み]いだした方[かた]に感謝[かんしゃ]をささげる。"
  29: "言葉[ことば]に悟[さと]りのある者[もの]たちは自[みずか]ら知恵[ちえ]を得[え]、正確[せいかく]な格言[かくげん]を雨[あめ]のように降[ふ]らす。"
  30: "あなたの欲望[よくぼう]の後[あと]を追[お]って行[い]くな。あなたの望[のぞ]みから身[み]を遠[とお]ざけよ。"
  31: "もしあなたが魂[たましい]に欲望[よくぼう]の喜[よろこ]びを与[あた]えるなら、それはあなたを敵[てき]の喜[よろこ]びものにする。"
  32: "多[おお]くのぜいたくを喜[よろこ]ぶな。その宴[うたげ]に縛[しば]られるな。"
  33: "借金[しゃっきん]して宴[うたげ]を開[ひら]く貧[まず]しい者[もの]になるな。あなたの袋[ふくろ]には何[なに]もないのだから。"

notes:
  1: "Ὁ ζῶν εἰς τὸν αἰῶνα — «Живущий во век»; ἔκτισεν τὰ πάντα κοινῇ — «создал всё вместе (сообща)»: κοινῇ — сообща, вообще (слав. «обще»). Слав. 18:1 вбирает и ст. 2."
  2: "κύριος μόνος δικαιωθήσεται — «Господь один оправдается (будет признан праведным)» (δικαιόω — оправдывать). По полному церковному тексту (GOARCH) добавлено «καὶ οὐκ ἔστιν ἄλλος πλὴν αὐτοῦ» — «и нет иного, кроме Него»; в LXX-модуле и слав. этой клаузы нет (слав. 18:1)."
  3: "В gr-lxx-byz на месте стиха стоит «.» (дефект модуля). οἰακίζων τὸν κόσμον ἐν σπιθαμῇ χειρὸς αὐτοῦ — «управляющий миром пядью руки Своей» (οἰακίζω — править, направлять; σπιθαμή — пядь, スパン); πάντα ὑπακούει τῷ θελήματι αὐτοῦ — «всё повинуется воле Его»; διαστέλλων ἐν αὐτοῖς ἅγια ἀπὸ βεβήλων — «отделяющий в них святое от скверного» (βέβηλος — нечестивый, мирской). Чтение полного церковного греч. текста (GOARCH, в скобках); слав. стиха нет (csl 18:3 = конец гр 4)."
  4: "οὐθενὶ ἐξεποίησεν ἐξαγγεῖλαι τὰ ἔργα αὐτοῦ — «никому не дал возможности возвестить дела Его» (ἐξαγγέλλω — возвещать); τίς ἐξιχνεύσει τὰ μεγαλεῖα αὐτοῦ — «кто исследует величия Его» (ἐξιχνεύω — разыскивать, постигать). Слав. 18:2–3 делит стих; держимся gr."
  5: "κράτος μεγαλωσύνης αὐτοῦ — «держава величия Его» (κράτος — сила, держава); τίς ἐξαριθμήσεται — «кто исчислит»; τίς προσθήσει ἐκδιηγήσασθαι τὰ ἐλέη αὐτοῦ — «кто приложит возвещать милости Его» (ἐκδιηγέομαι — рассказывать подробно). Слав. 18:4."
  6: "οὐκ ἔστιν ἐλαττῶσαι οὐδὲ προσθεῖναι — «нельзя ни умалить, ни прибавить» (ἐλαττόω — уменьшать); ἐξιχνιάσαι τὰ θαυμάσια τοῦ κυρίου — «постигнуть чудеса Господа» (θαυμάσιος — дивный). Слав. 18:5."
  7: "ὅταν συντελέσῃ ἄνθρωπος, τότε ἄρχεται — «когда человек завершит, тогда начинает» (συντελέω — завершать); ὅταν παύσηται, τότε ἀπορηθήσεται — «когда перестанет, тогда придёт в изумление» (ἀπορέω — недоумевать). Слав. 18:6."
  8: "Τί ἄνθρωπος, καὶ τί ἡ χρῆσις αὐτοῦ — «что человек, и что польза его» (χρῆσις — пользование, польза); τί τὸ ἀγαθὸν αὐτοῦ καὶ τί τὸ κακὸν αὐτοῦ — «что доброе его и что злое его». Слав. 18:7."
  9: "ἀριθμὸς ἡμερῶν ἀνθρώπου — «число дней человека»; πολλὰ ἔτη ἑκατόν — «много — сто лет» (т. е. и сто лет много лишь по-человечески). Слав. 18:8 вбирает и ст. 10."
  10: "ὡς σταγὼν ὕδατος ἀπὸ θαλάσσης — «как капля воды из моря» (σταγών — капля); ψῆφος ἄμμου — «песчинка» (ψῆφος — камешек); ὀλίγα ἔτη ἐν ἡμέρᾳ αἰῶνος — «немного лет в день вечности». Слав. 18:8."
  11: "διὰ τοῦτο ἐμακροθύμησεν κύριος ἐπ᾿ αὐτοῖς — «потому долготерпел Господь о них» (μακροθυμέω — долготерпеть); ἐξέχεεν ἐπ᾿ αὐτοὺς τὸ ἔλεος αὐτοῦ — «излил на них милость Свою» (ἐκχέω — изливать). Слав. 18:9."
  12: "εἶδεν καὶ ἐπέγνω τὴν καταστροφὴν αὐτῶν ὅτι πονηρά — «увидел и познал разорение их, что оно зло» (καταστροφή — разрушение, конец); ἐπλήθυνεν τὸν ἐξιλασμὸν αὐτοῦ — «умножил умилостивление Своё» (ἐξιλασμός). Слав. 18:10–11 делит стих; держимся gr."
  13: "ἔλεος ἀνθρώπου ἐπὶ τὸν πλησίον αὐτοῦ — «милость человека — на ближнего его»; ἔλεος δὲ κυρίου ἐπὶ πᾶσαν σάρκα — «милость же Господа — на всякую плоть»; ἐλέγχων καὶ παιδεύων καὶ διδάσκων καὶ ἐπιστρέφων — «обличая, наставляя, уча и обращая»; ὡς ποιμὴν τὸ ποίμνιον αὐτοῦ — «как пастырь стадо своё». Слав. 18:12–13."
  14: "τοὺς ἐκδεχομένους παιδείαν ἐλεᾷ — «принимающих наставление милует» (ἐκδέχομαι — принимать, ожидать); τοὺς κατασπεύδοντας ἐπὶ τὰ κρίματα αὐτοῦ — «стремящихся к судам Его» (κατασπεύδω — спешить). Слав. 18:14."
  15: "Τέκνον, ἐν ἀγαθοῖς μὴ δῷς μῶμον — «чадо, в благах не дай порока (порицания)» (μῶμος — порок, пятно); ἐν πάσῃ δόσει λύπην λόγων — «при всяком даянии — печаль слов» (δόσις — даяние). Слав. 18:15."
  16: "οὐχὶ καύσωνα ἀναπαύσει δρόσος — «не прохладит ли зной роса» (καύσων — зной; δρόσος — роса); κρείσσων λόγος ἢ δόσις — «лучше слово, чем даяние». Слав. 18:16."
  17: "οὐκ ἰδοὺ λόγος ὑπὲρ δόμα ἀγαθόν — «не вот ли, слово лучше дара благого» (δόμα — дар); ἀμφότερα παρὰ ἀνδρὶ κεχαριτωμένῳ — «и то и другое — у мужа облагодатствованного» (χαριτόω — облагодатствовать). Слав. 18:17."
  18: "μωρὸς ἀχαρίστως ὀνειδιεῖ — «глупый неблагодарно укорит» (ὀνειδίζω — укорять); δόσις βασκάνου ἐκτήκει ὀφθαλμούς — «даяние завистливого растопит (иссушит) глаза» (βάσκανος — завистливый; ἐκτήκω — растоплять). Слав. 18:18."
  19: "Πρὶν ἢ λαλῆσαι μάνθανε — «прежде чем говорить, учись»; πρὸ ἀρρωστίας θεραπεύου — «прежде болезни лечись» (θεραπεύω — лечить, ухаживать). Слав. 18:19."
  20: "πρὸ κρίσεως ἐξέταζε σεαυτόν — «прежде суда испытывай себя» (ἐξετάζω — испытывать); ἐν ὥρᾳ ἐπισκοπῆς εὑρήσεις ἐξιλασμόν — «в час посещения найдёшь умилостивление» (ἐπισκοπή). Слав. 18:20."
  21: "πρὶν ἀρρωστῆσαί σε ταπεινώθητι — «прежде чем заболеть, смирись»; ἐν καιρῷ ἁμαρτημάτων δεῖξον ἐπιστροφήν — «во время грехов покажи обращение» (ἐπιστροφή — обращение). Слав. 18:21."
  22: "μὴ ἐμποδισθῇς τοῦ ἀποδοῦναι εὐχήν — «не будь удержан отдать обет» (ἐμποδίζω — препятствовать; εὐχή — обет); μὴ μείνῃς ἕως θανάτου δικαιωθῆναι — «не жди до смерти оправдаться». Слав. 18:22."
  23: "πρὶν εὔξασθαι ἑτοίμασον σεαυτόν — «прежде молитвы приготовь себя» (εὔχομαι — молиться); μὴ γίνου ὡς ἄνθρωπος πειράζων τὸν κύριον — «не будь как человек, искушающий Господа» (πειράζω). Слав. 18:23."
  24: "μνήσθητι θυμοῦ ἐν ἡμέραις τελευτῆς — «помни гнев в дни кончины»; καιρὸν ἐκδικήσεως ἐν ἀποστροφῇ προσώπου — «время мщения при отвращении лица» (ἐκδίκησις — отмщение; ἀποστροφή — отвращение). Слав. 18:24."
  25: "μνήσθητι καιρὸν λιμοῦ ἐν καιρῷ πλησμονῆς — «помни время голода во время полноты» (λιμός — голод; πλησμονή — изобилие); πτωχείαν καὶ ἔνδειαν ἐν ἡμέραις πλούτου — «бедность и нужду в дни богатства». Слав. 18:25."
  26: "ἀπὸ πρωίθεν ἕως ἑσπέρας μεταβάλλει καιρός — «от утра до вечера изменяется время» (μεταβάλλω — переменять); πάντα ἐστὶν ταχινὰ ἔναντι κυρίου — «всё быстро (скоропреходяще) пред Господом» (ταχινός — скорый). Слав. 18:26."
  27: "ἄνθρωπος σοφὸς ἐν παντὶ εὐλαβηθήσεται — «человек мудрый во всём будет осторожен» (εὐλαβέομαι — благоговеть, остерегаться); ἐν ἡμέραις ἁμαρτιῶν προσέξει ἀπὸ πλημμελείας — «в дни грехов будет беречься от погрешности» (πλημμέλεια — прегрешение). Слав. 18:27."
  28: "πᾶς συνετὸς ἔγνω σοφίαν — «всякий разумный познал премудрость»; τῷ εὑρόντι αὐτὴν δώσει ἐξομολόγησιν — «нашедшему её воздаст исповедание (хвалу)» (ἐξομολόγησις). Слав. 18:28."
  29: "συνετοὶ ἐν λόγοις — «разумные в словах»; αὐτοὶ ἐσοφίσαντο — «и сами умудрились» (σοφίζω); ἀνώμβρησαν παροιμίας ἀκριβεῖς — «излили, как дождь, точные притчи» (ὀμβρέω — проливать дождём; παροιμία — притча). Слав. 18:29 добавляет «воздержание души» — надпись следующего раздела; в gr-модуле она стоит отдельной строкой-заголовком и в стих не внесена."
  30: "Ὀπίσω τῶν ἐπιθυμιῶν σου μὴ πορεύου — «за похотями твоими не ходи» (ἐπιθυμία — пожелание, похоть); ἀπὸ τῶν ὀρέξεών σου κωλύου — «от вожделений твоих воздерживайся» (ὄρεξις — вожделение; κωλύω — удерживать). Слав. 18:30; с gr 30 начинается раздел «воздержание души»."
  31: "ἐὰν χορηγήσῃς τῇ ψυχῇ σου εὐδοκίαν ἐπιθυμίας — «если снабдишь душу свою благоволением похоти» (χορηγέω — снабжать); ποιήσει σε ἐπίχαρμα τῶν ἐχθρῶν σου — «сделает тебя радостью врагов твоих» (ἐπίχαρμα — предмет злорадства). Слав. 18:31."
  32: "μὴ εὐφραίνου ἐπὶ πολλῇ τρυφῇ — «не веселись о многой роскоши» (τρυφή — роскошь, нега); μὴ προσδεθῇς συμβολῇ αὐτῆς — «не привязывайся к её пиршеству» (συμβολή — пир, складчина). Слав. 18:32."
  33: "μὴ γίνου πτωχὸς συμβολοκοπῶν ἐκ δανεισμοῦ — «не стань бедным, пиршествуя в долг» (συμβολοκοπέω — пировать в складчину; δανεισμός — заём); οὐδέν σοί ἐστιν ἐν μαρσιππίῳ — «ничего у тебя нет в сумке» (μαρσίππιον — кошель, сумка). Слав. 18:33."
