# jp-box, Сирах, глава 18. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для книги нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 18: 1–7 величие Творца и непостижимость дел Его; 8–14 ничтожество человека
# и милосердие Божие; 15–18 слово и дар; 19–24 предусмотрительность, обеты, память
# о конце; 25–29 благоразумие; 30–33 обуздание похотей (надпись «воздержание души»).
# Прямой речи нет; красного и синего нет.
# Нумерация по gr: 33 стиха. Слав. 18 — 33 стиха, но делит иначе: csl 18:1 вбирает
# gr 1–2, csl 18:2–3 — gr 4, csl 18:4–9 — gr 5–11 (csl 18:8 вбирает gr 9–10),
# csl 18:10–11 — gr 12,
# csl 18:12–13 — gr 13; дальше csl = gr. Держимся gr, слав. лишнее влито без дублей.
# Дефект модуля: 18:3 стоит как «.». Переведён по полному церковному греч. тексту
# (GOARCH, в квадратных скобках); слав. этого стиха не знает (csl 18:3 = конец гр 4).
# К стиху 2 по тому же полному тексту добавлена клауза «и нет иного кроме Него»
# (в LXX-модуле её нет, в слав. нет; отмечено в notes).
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).

