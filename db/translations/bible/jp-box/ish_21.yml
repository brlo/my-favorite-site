chapter: 21
draft: true

verses:
  1: "これが、あなたが彼[かれ]らの前[まえ]に置[お]くべき掟[おきて]である。"
  2: "もしあなたがヘブライ人[じん]の奴隷[どれい]を買[か]うなら、その人[ひと]は六年[ろくねん]あなたに仕[つか]え、七年目[ななねんめ]には無償[むしょう]で自由[じゆう]の身[み]になって去[さ]る。"
  3: "もし彼[かれ]が一人[ひとり]で来[き]たなら、一人[ひとり]で去[さ]る。もし妻[つま]を伴[ともな]って来[き]たなら、その妻[つま]も彼[かれ]とともに去[さ]る。"
  4: "もし主人[しゅじん]が彼[かれ]に妻[つま]を与[あた]え、その妻[つま]が息子[むすこ]や娘[むすめ]を産[う]んだなら、妻[つま]と子[こ]どもは主人[しゅじん]のものとなり、彼[かれ]だけが一人[ひとり]で去[さ]る。"
  5: "しかし、その奴隷[どれい]が答[こた]えて、「わたしは主人[しゅじん]と妻[つま]と子[こ]どもを愛[あい]している。自由[じゆう]の身[み]になって去[さ]りたくない。」と言[い]うなら、"
  6: "主人[しゅじん]は彼[かれ]を神[かみ]の法廷[ほうてい]に連[つ]れて行[い]き、次[つぎ]に戸口[とぐち]の柱[はしら]のところへ連[つ]れて行[い]って、錐[きり]で彼[かれ]の耳[みみ]を刺[さ]し通[とお]す。こうして彼[かれ]は永久[えいきゅう]に主人[しゅじん]に仕[つか]える。"
  7: "もし人[ひと]が自分[じぶん]の娘[むすめ]を女奴隷[おんなどれい]として売[う]るなら、彼女[かのじょ]はほかの女奴隷[おんなどれい]たちのように自由[じゆう]になって去[さ]ることはない。"
  8: "もし彼女[かのじょ]が、自分[じぶん]のものとして迎[むか]えると約束[やくそく]した主人[しゅじん]の目[め]にかなわないなら、主人[しゅじん]は彼女[かのじょ]を贖[あがな]わせる。彼[かれ]には彼女[かのじょ]を外国[がいこく]の民[たみ]に売[う]る権利[けんり]がない。彼[かれ]が彼女[かのじょ]を蔑[ないがし]ろにしたからである。"
  9: "もし彼[かれ]が彼女[かのじょ]を息子[むすこ]に約束[やくそく]したなら、娘[むすめ]に対[たい]する掟[おきて]に従[したが]って彼女[かのじょ]を扱[あつか]う。"
  10: "もし彼[かれ]が別[べつ]の女[おんな]を自分[じぶん]のために迎[むか]えても、彼女[かのじょ]に必要[ひつよう]なもの、着物[きもの]、そして彼女[かのじょ]との夫婦[ふうふ]の交[まじ]わりを奪[うば]ってはならない。"
  11: "もし彼[かれ]がこの三[みっ]つのことを彼女[かのじょ]にしてやらないなら、彼女[かのじょ]は銀[ぎん]を払[はら]わず、無償[むしょう]で去[さ]る。"
  12: "人[ひと]を打[う]って死[し]なせた者[もの]は、死刑[しけい]をもって罰[ばつ]せられる。"
  13: "しかし、それが故意[こい]でなく、神[かみ]が彼[かれ]の手[て]に渡[わた]されたのであるなら、わたしはあなたのために、その殺[ころ]した者[もの]が逃[に]げ込[こ]む場所[ばしょ]を定[さだ]めよう。"
  14: "しかし、もし人[ひと]が企[たくら]みをもって隣人[りんじん]を殺[ころ]そうと襲[おそ]い、そして逃[に]げ込[こ]んだなら、わたしの祭壇[さいだん]からでも、あなたは彼[かれ]を引[ひ]き出[だ]して殺[ころ]さなければならない。"
  15: "自分[じぶん]の父[ちち]や母[はは]を打[う]つ者[もの]は、必[かなら]ず死刑[しけい]に処[しょ]せられる。"
  16: "自分[じぶん]の父[ちち]や母[はは]を呪[のろ]う者[もの]は、必[かなら]ず死[し]ぬ。"
  17: "イスラエルの子[こ]らのうちの誰[だれ]かを盗[ぬす]み出[だ]し、それを虐[しいた]げてから売[う]った者[もの]は、たとえその人[ひと]がまだ彼[かれ]の手[て]にあったとしても、必[かなら]ず死[し]ぬ。"
  18: "もし二人[ふたり]の男[おとこ]が言[い]い争[あらそ]い、一人[ひとり]が石[いし]や拳[こぶし]で相手[あいて]を打[う]っても、その人[ひと]が死[し]なずに寝床[ねどこ]につくだけなら、"
  19: "その人[ひと]が起[お]き上[あ]がって外[そと]を杖[つえ]をついて歩[ある]けるようになるなら、打[う]った者[もの]は罰[ばつ]を免[まぬか]れる。ただ、その人[ひと]の休[やす]んだ分[ぶん]を償[つぐな]い、治療費[ちりょうひ]を払[はら]わなければならない。"
  20: "もし人[ひと]が自分[じぶん]の奴隷[どれい]や女奴隷[おんなどれい]を杖[つえ]で打[う]ち、その人[ひと]が彼[かれ]の手[て]のもとで死[し]んだなら、罰[ばつ]を受[う]けなければならない。"
  21: "しかし、その人[ひと]が一日[いちにち]か二日[ふつか]生[い]き延[の]びたなら、主人[しゅじん]は罰[ばつ]せられない。その人[ひと]は主人[しゅじん]の銀[ぎん]で買[か]われたものだからである。"
  22: "もし二人[ふたり]の男[おとこ]が争[あらそ]い、妊婦[にんぷ]を打[う]って、その子[こ]がまだ形[かたち]をなさずに流[なが]れ出[で]たなら、その男[おとこ]は賠償[ばいしょう]を課[か]せられる。女[おんな]の夫[おっと]が定[さだ]める額[がく]を、定[さだ]められたとおりに支払[しはら]わなければならない。"
  23: "しかし、子[こ]が形[かたち]をなしていたなら、命[いのち]には命[いのち]をもって償[つぐな]う。"
  24: "目[め]には目[め]を、歯[は]には歯[は]を、手[て]には手[て]を、足[あし]には足[あし]を。"
  25: "焼[や]けどには焼[や]けどを、傷[きず]には傷[きず]を、打[う]ち傷[きず]には打[う]ち傷[きず]を。"
  26: "もし人[ひと]が自分[じぶん]の奴隷[どれい]の目[め]や女奴隷[おんなどれい]の目を打[う]って、それを失[しな]わせたなら、目の代[か]わりに、その人[ひと]を自由[じゆう]の身[み]にして去[さ]らせなければならない。"
  27: "また、奴隷[どれい]や女奴隷[おんなどれい]の歯[は]を折[お]ったなら、歯の代[か]わりに、その人[ひと]を自由[じゆう]の身[み]にして去[さ]らせなければならない。"
  28: "もし牛[うし]が男[おとこ]や女[おんな]を角[つの]で突[つ]いて死[し]なせたなら、その牛[うし]は石[いし]で打[う]ち殺[ころ]され、その肉[にく]は食[た]べられない。牛[うし]の飼[か]い主[ぬし]は罰[ばつ]を免[まぬか]れる。"
  29: "しかし、その牛[うし]が以前[いぜん]から角[つの]で突[つ]く癖[くせ]があり、飼[か]い主[ぬし]に告[つ]げられてもそれを隠[かく]さずにいたなら、その牛[うし]が男[おとこ]や女[おんな]を殺[ころ]したときは、牛[うし]は石[いし]で打[う]ち殺[ころ]され、飼[か]い主[ぬし]も死[し]ぬ。"
  30: "もし彼[かれ]に身代金[みのしろきん]が課[か]せられたなら、命[いのち]の代[か]わりとして、課[か]せられただけの身代金[みのしろきん]を払[はら]わなければならない。"
  31: "もしその牛[うし]が息子[むすこ]や娘[むすめ]を突[つ]いたなら、この同[おな]じ掟[おきて]に従[したが]ってその人[ひと]を扱[あつか]う。"
  32: "もしその牛[うし]が男[おとこ]の奴隷[どれい]や女奴隷[おんなどれい]を突[つ]いたなら、銀[ぎん]三十[さんじゅう]ディドラクマをその主人[しゅじん]に払[はら]い、牛[うし]は石[いし]で打[う]ち殺[ころ]される。"
  33: "もし人[ひと]が穴[あな]を開[あ]け、あるいは穴[あな]を掘[ほ]ってそれを覆[おお]わずにいたため、そこに子牛[こうし]やろばが落[お]ちたなら、"
  34: "穴[あな]の持[も]ち主[ぬし]が償[つぐな]う。すなわち、家畜[かちく]の持[も]ち主[ぬし]に銀[ぎん]を払[はら]い、死[し]んだものは自分[じぶん]のものとする。"
  35: "もし誰[だれ]かの牛[うし]が隣人[りんじん]の牛[うし]を突[つ]いて死[し]なせたなら、生[い]きている牛[うし]を売[う]り、その代金[だいきん]を分[わ]け合[あ]い、死[し]んだ牛[うし]も分[わ]け合[あ]う。"
  36: "しかし、その牛[うし]が以前[いぜん]から角[つの]で突[つ]くと知[し]られており、飼[か]い主[ぬし]に告[つ]げられてもそれを隠[かく]さずにいたなら、牛[うし]には牛[うし]を償[つぐな]い、死[し]んだ牛[うし]は自分[じぶん]のものとする。"
  37: "もし人[ひと]が子牛[こうし]や羊[ひつじ]を盗[ぬす]み、それを屠[ほふ]ったり売[う]ったりしたなら、子牛[こうし]の代[か]わりに五頭[ごとう]の子牛[こうし]を、羊[ひつじ]の代[か]わりに四匹[よんひき]の羊[ひつじ]を償[つぐな]う。"

notes:
  1: "τὰ δικαιώματα — 掟 (δικαίωμα — «постановление, право»). παραθήσεις — 置く (букв. «положишь перед ними»), т. е. предложишь народу как закон."
  2: "παῖς Εβραῖος — ヘブライ人の奴隷 (παῖς — «раб, слуга»). ἀπελεύσεται ἐλεύθερος δωρεάν — 無償で自由の身になって去る (δωρεάν — «даром, без выкупа»)."
  3: "εἰσέλθῃ — 来る (вход в дом господина); συνεισέλθῃ — 伴って来る (συν- — «вместе»)."
  4: "ἡ γυνὴ καὶ τὰ παιδία ἔσται τῷ κυρίῳ αὐτοῦ — 妻と子どもは主人のものとなる (букв. «будут господину его»)."
  5: "ἀποκριθεὶς εἴπῃ — 答えて言う. Ἠγάπηκα — 愛している (perfekt — состояние, не действие). οὐκ ἀποτρέχω — 去りたくない (букв. «не убегаю»)."
  6: "τὸ κριτήριον τοῦ θεοῦ — 神の法廷 (судьи как представители Бога). σταθμός — 戸口の柱, дверной косяк. ὀπητίῳ — 錐, шило. εἰς τὸν αἰῶνα — 永久に."
  7: "οἰκέτιν — 女奴隷. οὐκ ἀπελεύσεται ὥσπερ ἀποτρέχουσιν αἱ δοῦλαι — не выйдет, как выходят рабыни (т. е. на седьмой год)."
  8: "ἣν αὑτῷ καθωμολογήσατο — которую он прочил себе (καθομολογέω — «сговаривать, обещать»). ἀπολυτρώσει — 贖わせる (ἀπολυτρόω — «дать выкупить»). ἠθέτησεν ἐν αὐτῇ — 蔑ろにした (ἀθετέω — «отвергнуть, поступить вероломно»)."
  9: "κατὰ τὸ δικαίωμα τῶν θυγατέρων — 娘に対する掟に従って, т. е. как с родной дочерью."
  10: "τὰ δέοντα — 必要なもの (пища). ἱματισμός — 着物. ὁμιλία — 夫婦の交わり (букв. «общение»; слав. «сообщение»)."
  11: "τὰ τρία ταῦτα — この三つ (пища, одежда, супружеское общение). ἄνευ ἀργυρίου — 銀を払わず."
  12: "θανάτῳ θανατούσθω — 死刑をもって罰せられる (датив усиления при глаголе)."
  13: "ὁ δὲ οὐχ ἑκών — 故意でなく (букв. «не по своей воле»). ὁ θεὸς παρέδωκεν εἰς τὰς χεῖρας αὐτοῦ — 神が彼の手に渡された. τόπον, οὗ φεύξεται — 逃げ込む場所 (город убежища)."
  14: "δόλῳ — 企みをもって (коварно). ἀπὸ τοῦ θυσιαστηρίου μου — わたしの祭壇からでも (право убежища у жертвенника не защищает умышленного убийцу)."
  15: "τύπτει — 打つ (настоящее время — о постоянном правиле)."
  16: "ὁ κακολογῶν — 呪う者 (κακολογέω — «злословить, проклинать»). У LXX здесь злословие родителей; в Синодальном (МТ) на этом месте запрет похищения человека, а похищение у LXX — в 21:17."
  17: "κλέψῃ … τῶν υἱῶν Ισραηλ — イスラエルの子らのうちの誰かを盗み出す. καταδυναστεύσας — 虐げて. εὑρεθῇ ἐν αὐτῷ — 彼の手に見つかる."
  18: "λοιδορῶνται — 言い争う (λοιδορέω — «браниться»). πυγμῇ — 拳で. κοιτὴν — 寝床."
  19: "ἐπὶ ῥάβδου — 杖をついて. ἀθῷος — 罰を免れる. τῆς ἀργίας αὐτοῦ — 休んだ分 (ἀργία — «праздность, простой в работе»). τὰ ἰατρεῖα — 治療費."
  20: "ἐν ῥάβδῳ — 杖で. δίκῃ ἐκδικηθήτω — 罰を受ける (букв. «да будет отмщён судом»)."
  21: "διαβιώσῃ — 生き延びる. τὸ ἀργύριον αὐτοῦ ἐστιν — 主人の銀で買われたもの (т. е. его собственность)."
  22: "ἐν γαστρὶ ἔχουσαν — 妊婦. μὴ ἐξεικονισμένον — まだ形をなさず (ἐξεικονίζω — «принимать образ»). ἐπιζήμιον ζημιωθήσεται — 賠償を課せられる. μετὰ ἀξιώματος — 定められた額で (букв. «по достоинству, по оценке»)."
  23: "ἐξεικονισμένον — 形をなしていた (сформировавшийся плод). ψυχὴν ἀντὶ ψυχῆς — 命には命を (букв. «душу за душу»)."
  24: "ὀφθαλμὸν ἀντὶ ὀφθαλμοῦ — 目には目を (ἀντί — «вместо, за»); передано буквально, как в LXX и славянском."
  25: "κατάκαυμα — 焼けど. τραῦμα — 傷. μώλωψ — 打ち傷, рубец."
  26: "ἐκτυφλώσῃ — 失明させる. ἀντὶ τοῦ ὀφθαλμοῦ — 目の代わりに (т. е. за глаз — свобода)."
  27: "ἐκκόψῃ — 折る, выбить. ἀντὶ τοῦ ὀδόντος — 歯の代わりに."
  28: "κερατίσῃ — 角で突く (κερατίζω). λίθοις λιθοβοληθήσεται — 石で打ち殺される. ἀθῷος — 罰を免れる."
  29: "κερατιστής — 突く癖のある牛. διαμαρτύρωνται — 告げられる (διαμαρτύρομαι — «предупреждать»). ἀφανίσῃ — 隠さずに (ἀφανίζω — «убирать, скрывать»). προσαποθανεῖται — 主人も死ぬ."
  30: "λύτρα — 身代金 (λύτρον — «выкуп»). ὅσα ἐὰν ἐπιβάλωσιν — 課せられただけの."
  31: "κατὰ τὸ δικαίωμα τοῦτο — この同じ掟に従って."
  32: "τριάκοντα δίδραχμα — 銀三十ディドラクマ (около 30 сиклей серебра)."
  33: "λάκκον — 穴 (яма-цистерна). λατομήσῃ — 掘る. μόσχος — 子牛. ὄνος — ろば."
  34: "ἀποτείσει — 償う (ἀποτίνω — «возмещать»). τὸ τετελευτηκὸς αὐτῷ ἔσται — 死んだものは自分のもの (туша — хозяину ямы)."
  35: "ἀποδώσονται — 売る (букв. «отдадут»). διελοῦνται — 分け合う (διαιρέω — «делить»)."
  36: "γνωρίζηται — 知られている. διαμεμαρτυρημένοι ὦσιν — 告げられていても. ἀποτείσει ταῦρον ἀντὶ ταύρου — 牛には牛を償う."
  37: "πέντε μόσχους … τέσσαρα πρόβατα — 五頭の子牛…四匹の羊 (возмещение сверх украденного). В Синодальном и масоретском это 22:1; у LXX — конец 21-й главы."
