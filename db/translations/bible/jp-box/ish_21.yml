# jp-box, Исход, глава 21. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru),
# русский Синодальный (ru — с масоретского, только для понимания); jp-joc в этой главе нет.
# Язык — современный 常体, порядок членов и деление на клаузы — по греческому.
# Глава 21: раб-еврей и его освобождение (1–11), убийство и города убежища (12–14),
# оскорбление родителей и похищение человека (15–17), драка и телесные повреждения (18–27),
# бодливый вол и яма (28–36), кража скота (37).
# Красного и синего нет: говорит Бог, но это не прямая речь Христа во плоти; «<j>» не ставится.
# Прямая речь — в 「…」; вложенной речи нет.
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено по базе). Славянское «(и той)» в 21:12 —
# редакторская вставка в скобках, как в Быт 7:9, в 〔…〕 не берётся.
# Нумерация: у LXX в этой главе 37 стихов; 21:37 («кража вола или овцы») в Синодальном (МТ) — 22:1.
# Славянский и Синодальный в гл. 21 совпадают с LXX по номерам стихов 1–36.
# Сносок ⟨…⟩ нет: 奴隷, 祭壇, 隣人, 償う уже в корпусе или понятны по контексту.
# jp-ni не использовался.

