verses:
  1: "ペリシテ人[じん]についての主[しゅ]の言葉[ことば]。すなわち、預言者[よげんしゃ]エレミヤに臨[のぞ]んだもの。ファラオがガザを撃[う]つ前[まえ]のことである。"
  2: "主[しゅ]はこう言[い]われる。「見[み]よ、水[みず]が北[きた]から上[のぼ]って来[き]て、氾濫[はんらん]する流[なが]れとなる。それは地[ち]とその中に満[み]ちるもの、都[みやこ]とそこに住[す]む者[もの]を押[お]し流[なが]す。人[ひと]は叫[さけ]び、地に住む者[もの]はみな泣[な]き叫[さけ]ぶ。"
  3: "その突[つ]進[しん]の響[ひび]き、その馬[うま]のひづめの音[おと]、戦車[せんしゃ]の鳴[な]り響き、車輪[しゃりん]の音のゆえに、父[ちち]たちは子[こ]らへ振[ふ]り向[む]かない。その手[て]は力[ちから]を失[うしな]うからである。"
  4: "すべてのペリシテ人[じん]を滅[ほろ]ぼすために来[く]るその日[ひ]に、わたしはツロとシドン、その助[たす]けの残[のこ]りをことごとく絶[た]やす。主[しゅ]が島々[しまじま]、すなわちカッパドキアの島々の残りを根[ね]こそぎ絶[た]やされるからである。"
  5: "ガザに剃[そ]り落[お]としが来[き]た。アスカロンは投[な]げ捨[す]てられ、エナキムの残[のこ]りも。いつまで切[き]り倒[たお]すのか、"
  6: "主[しゅ]の剣[つるぎ]よ。いつまで安[やす]まわないのか。さやに納[おさ]まれ。憩[いこ]い、そして高[たか]く上[あ]がれ。"
  7: "どうして安[やす]まることができようか。主[しゅ]ご自身[じしん]が、アスカロンと海辺[うみべ]の地[ち]、かの残[のこ]りの者[もの]たちに向[む]けて、これを命[めい]じられたのだから。」"

notes:
  1: "Ἐπὶ τοὺς ἀλλοφύλους — «О иноплеменниках»: в LXX стих состоит только из заголовка. Слав. даёт полное надписание — «Слово Господне, еже бысть ко иеремии пророку на иноплеменники, прежде нежели порази фараон газу»; по паритету внесено в основной текст без 〔…〕 («нет в LXX»). ἀλλόφυλοι — обычное у LXX имя филистимлян (ペリシテ人, как в корпусе, ср. Суд 3:3; 1 Цар 4:1). Упомянутый фараон — Нехао (ср. 4 Цар 23:29 и наш 26:2)."
  2: "Τάδε λέγει κύριος — «так говорит Господь»: формула вне кавычек, ею открывается одно слово Господа на всю главу (29:2–7). ὕδατα ἀναβαίνει ἀπὸ βορρᾶ — «воды поднимаются с севера»: образ нашествия (ср. 26:7–8); χειμάρρους — «поток, разлив» (氾濫する流れ); κατακλύσει γῆν καὶ τὸ πλήρωμα αὐτῆς — «потопит землю и полноту её» (地とその中に満ちるもの). κεκράξονται οἱ ἄνθρωποι — «возопиют люди»; ἀλαλάξουσιν ἅπαντες οἱ κατοικοῦντες τὴν γῆν — «завопят все живущие на земле» (泣き叫ぶ)."
  3: "ἀπὸ φωνῆς ὁρμῆς αὐτοῦ — «от звука устремления его» (突進の響き); ἀπὸ τῶν ὁπλῶν τῶν ποδῶν αὐτοῦ — «от копыт ног его» (ὀπλή — копыто; слав. «от оружия ног его» понято иначе); σεισμὸς ἁρμάτων — «сотрясение колесниц»; ἦχος τροχῶν — «грохот колёс» (車輪). οὐκ ἐπέστρεψαν πατέρες ἐφ᾽ υἱούς — «не обратились отцы к сынам» (не оглянутся на детей); ἀπὸ ἐκλύσεως χειρῶν αὐτῶν — «от расслабления рук их» (その手は力を失う)."
  4: "ἐν τῇ ἡμέρᾳ τῇ ἐρχομένῃ τοῦ ἀπολέσαι πάντας τοὺς ἀλλοφύλους — «в приходящий день, чтобы погубить всех иноплеменников». ἀφανιῶ τὴν Τύρον καὶ τὴν Σιδῶνα — «истреблю Тир и Сидон» (ツロ, シドン по корпусу). καταλοίπους τῆς βοηθείας αὐτῶν — «остатки помощи их», т. е. союзников (その助けの残り). Слав. добавляет «останки островов каппадокийских» — «каппадокийских» нет в LXX, внесено в текст без 〔…〕. ἐξολεθρεύσει κύριος — «истребит Господь»: о Боге в 3-м лице внутри его же речи, как в греч."
  5: "ἥκει φαλάκρωμα ἐπὶ Γάζαν — «пришла плешь на Газу»: выбритая голова — знак траура (剃り落とし); слав. «прииде плешь на газу». ἀπερρίφη Ἀσκαλών — «отвергнут Аскалон» (アスカロン, как в 1 Цар 6:17; Ис 20:1). οἱ κατάλοιποι Ενακιμ — «остатки Енакимов» (исполины, слав. «останцы енакимли»): вероятно, древнее население Газы. ἕως τίνος κόψεις — «доколе будешь сечь?»: по gr этот вопрос закрывает ст. 5, а «меч Господень» открывает ст. 6; слав. относит «доколе сещи будеши» к ст. 6 — держим gr, смысл един."
  6: "ἡ μάχαιρα τοῦ κυρίου — «меч Господень»: обращение, слав. «о, мечу Божий». ἕως τίνος οὐχ ἡσυχάσεις — «доколе не успокоишься?»; ἀποκατάστηθι εἰς τὸν κολεόν σου — «возвратись в ножны твои» (さや); ἀνάπαυσαι καὶ ἐπάρθητι — «успокойся и поднимись» (слав. «почий и вознесися»). Стих продолжает речь Господа, поэтому внутри общей цитаты."
  7: "πῶς ἡσυχάσει — «как успокоится?»: риторический вопрос, слав. «како упокоится?». κύριος ἐνετείλατο αὐτῇ — «Господь повелел ей» (мечу, ж. р.). ἐπὶ τὴν Ἀσκαλῶνα καὶ ἐπὶ τὰς παραθαλασσίους — «на Аскалон и на приморские [города]» (海辺の地); ἐπὶ τὰς καταλοίπους — «на остальных»; ἐπεγερθῆναι — «подняться» (слав. «востати»). Цитата 29:2–7 закрывается в конце стиха."
