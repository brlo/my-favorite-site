verses:
  1: "主[しゅ]からエレミヤにあった言葉[ことば]。すなわち、親衛隊[しんえいたい]の長[ちょう]ネブザルアダンが、ラマで、バビロンへ連[つ]れて行[い]かれるユダの捕囚[ほしゅう]のただ中[なか]で彼を鎖[くさり]につないで捕[と]らえたとき、彼を去[さ]らせた後[のち]のことである。"
  2: "親衛隊[しんえいたい]の長[ちょう]は彼[かれ]を引[ひ]き取[と]って言[い]った。「あなたの神[かみ]、主[しゅ]はこの場所[ばしょ]にこの災[わざわ]いを語[かた]られた。"
  3: "主[しゅ]はこれをもたらし、言[い]われたとおりに行[おこな]われた。あなたがたが主[しゅ]に罪[つみ]を犯[おか]し、その声[こえ]に聞[き]き従[したが]わなかったからである。この言葉[ことば]があなたがたに及[およ]んだのである。"
  4: "見[み]よ、わたしはあなたの手[て]にある鎖[くさり]を解[と]いた。もしバビロンへわたしと一緒[いっしょ]に行[い]くのが良[よ]いと思[おも]うなら、来[き]なさい。わたしはあなたに目[め]をかける。もしそうでなければ、ここにとどまれ。見[み]よ、全[ぜん]地[ち]はあなたの前[まえ]にある。あなたが望[のぞ]むこと、行[い]きたいと思[おも]う所[ところ]へ行[い]け。"
  5: "そうではなく、立[た]ち去[さ]って、バビロンの王[おう]がユダの地[ち]に立[た]てたアヒカムの子[こ]、シャファンの孫[まご]ゲダルヤのもとへ戻[もど]り、その地[ち]の民[たみ]のただ中[なか]で彼とともに住[す]め。あなたの目[め]に良[よ]いと思[おも]うすべての所[ところ]へ行[い]け。」そして親衛隊[しんえいたい]の長[ちょう]は彼に贈[おく]り物[もの]と食物[しょくもつ]を与[あた]えて去[さ]らせた。"
  6: "エレミヤはゲダルヤのもとへ、ミツパに行[い]き、その地[ち]に残[のこ]された民[たみ]のただ中[なか]に住[す]んだ。"
  7: "野[の]にいる軍[ぐん]の長[ちょう]たちはすべて、自分[じぶん]たちとその部下[ぶか]たちとともに、バビロンの王[おう]がゲダルヤをその地[ち]に立[た]て、彼に男[おとこ]たちと女[おんな]たち、子供[こども]たち、およびバビロンへ移[うつ]されなかった地[ち]の貧[まず]しい者[もの]たちを任[まか]せたことを聞[き]いた。"
  8: "イシュマエル、すなわちネタニヤの子[こ]、ヨハナンとヨナタン、すなわちカレアの子[こ]ら、タナエメトの子[こ]セラヤ、ネトファ人[びと]オフェの子[こ]ら、マカティの子[こ]イエゾニアが、彼[かれ]らとその部下[ぶか]たちとともに、ミツパのゲダルヤのもとへ来[き]た。"
  9: "ゲダルヤは彼[かれ]らとその部下[ぶか]たちに誓[ちか]って言[い]った。「カルデア人[じん]のしもべたちを恐[おそ]れてはならない。この地[ち]に住[す]み、バビロンの王[おう]に仕[つか]えなさい。そうすれば、あなたがたはもっと良[よ]くなる。"
  10: "見[み]よ、わたしはミツパに座[すわ]して、あなたがたのところへ来[く]るカルデア人[じん]の前[まえ]に立[た]つ。あなたがたはぶどう酒[しゅ]と果物[くだもの]を集[あつ]め、油[あぶら]を集[あつ]めて自分[じぶん]たちの器[うつわ]に入[い]れ、自分[じぶん]たちが手[て]に入[い]れた町[まち]々に住[す]め。」"
  11: "モアブの地[ち]にいるすべてのユダヤ人[じん]、アンモンの子[こ]らの間[あいだ]、エドム、およびすべての地[ち]にいる者[もの]たちも、バビロンの王[おう]がユダに残[のこ]りの者[もの]を残[のこ]し、その上[うえ]にアヒカムの子[こ]、シャファンの孫[まご]ゲダルヤを立[た]てたことを聞[き]いた。"
  12: "彼[かれ]らは逃[に]げていたすべての場所[ばしょ]から、ユダの地[ち]のミツパにいるゲダルヤのもとへ来[き]て、ぶどう酒[しゅ]と非常[ひじょう]に多[おお]くの果物[くだもの]、油[あぶら]を集[あつ]めた。"
  13: "カレアの子[こ]ヨハナンと、野[の]にいる軍[ぐん]の長[ちょう]たちはすべて、ミツパのゲダルヤのもとへ来[き]て、"
  14: "彼に言[い]った。「あなたは、アンモンの子[こ]らの王[おう]ベリサが、あなたを打[う]ち殺[ころ]そうとしてイシュマエルをあなたのもとへ遣[つか]わしたことを、よく知[し]っているか。」しかしゲダルヤは彼[かれ]らを信[しん]じなかった。"
  15: "ヨハナンはミツパでひそかにゲダルヤに言[い]った。「わたしが行[い]ってイシュマエルを打[う]ち殺[ころ]しましょう。だれにも知[し]られないように。なぜ、彼があなたを打[う]ち殺[ころ]し、あなたのもとに集[あつ]められたユダがみな散[ち]らされて、ユダの残[のこ]りの者[もの]が滅[ほろ]びるのを許[ゆる]すのですか。」"
  16: "しかしゲダルヤはヨハナンに言[い]った。「このことをしてはならない。あなたがイシュマエルについて言[い]っていることは偽[いつわ]りだからである。」"

notes:
  1: "Ὁ λόγος ὁ γενόμενος παρὰ κυρίου πρὸς Ιερεμιαν — «слово, бывшее от Господа к Иеремии»; ὕστερον μετὰ τὸ ἀποστεῖλαι αὐτὸν Ναβουζαρδαν — «после (позже) того, как отпустил его Навузардан» (ἀποστέλλω — отпускать, отсылать). ἀρχιμάγειρος — букв. «начальник поваров», титул начальника телохранителей (слав. «архимагир»), в тексте 親衛隊の長. τὸν ἐκ Δαμαν — «из Дамана»: тёмное чтение LXX (у swete так же τὸν ἐκ Δαμάν); слав. «из рамы» (из Рамы), по МТ — Рама; по паритету в тексте слав. ラマ, вариант LXX отмечен здесь. ἐν χειροπέδαις — «в оковах, в цепях» (χειροπέδη — ручные оковы); ἀποικία Ιουδα τῶν ἠγμένων εἰς Βαβυλῶνα — «переселение Иуды, ведомых в Вавилон»."
  2: "Καὶ ἔλαβεν αὐτὸν ὁ ἀρχιμάγειρος — «и взял его начальник телохранителей» (в тексте 引き取った); Κύριος ὁ θεός σου ἐλάλησεν τὰ κακὰ ταῦτα ἐπὶ τὸν τόπον τοῦτον — «Господь Бог твой изрёк это зло на место сие» (λαλέω — говорить, изрекать; ἐπί с винительным — «на, против»). Слав. «соглаголал есть злая сия на место сие». С этих слов открывается речь Навузардана — 「…」, закрывается в 5."
  3: "καὶ ἐποίησεν κύριος, ὅτι ἡμάρτετε αὐτῷ — «и сделал Господь, ибо вы согрешили Ему» (ἁμαρτάνω с дательным — согрешить против кого-либо); οὐκ ἠκούσατε αὐτοῦ τῆς φωνῆς — «не послушали гласа Его» (родительный при ἀκούω). Слав. добавляет «и приведе» (и привёл), «якоже рече» (как сказал) и в конце «и бысть вам глагол сей» (и стало вам слово сие) — нет в LXX; по паритету внесено в текст без скобок (もたらし…及んだ)."
  4: "ἰδοὺ ἔλυσά σε ἀπὸ τῶν χειροπέδων τῶν ἐπὶ τὰς χεῖράς σου — «вот, Я освободил (развязал) тебя от оков, которые на руках твоих» (λύω — развязывать, освобождать); εἰ καλὸν ἐναντίον σου — «если хорошо пред тобою», т. е. если угодно тебе; ἧκε — «приди»; θήσω τοὺς ὀφθαλμούς μου ἐπὶ σέ — «положу очи Мои на тебя», т. е. буду печься (ср. 46:12), в тексте 目をかける. Слав. добавляет после этого «аще же ни, остани зде: се, вся земля пред лицем твоим есть: что изволиши, и аможе восхощеши ити, тамо иди» — нет в LXX (по МТ); по паритету внесено в текст без скобок. Двойное условие (слав. «аще же ни» в 4 и LXX εἰ δὲ μή в 5) сохранено; второй раз передано как そうではなく, чтобы не читалось как противоречие (см. 5)."
  5: "εἰ δὲ μή, ἀπότρεχε καὶ ἀνάστρεψον πρὸς Γοδολιαν — «если же нет, беги и возвратись к Годолии» (ἀποτρέχω — убегать; ἀναστρέφω — возвращаться); в тексте そうではなく, потому что то же условие у слав. уже стоит в 4 («аще же ни») и два «если же нет» подряд читались бы как противоречие; ὃν κατέστησεν βασιλεὺς Βαβυλῶνος ἐν γῇ Ιουδα — «которого поставил царь Вавилонский в земле Иудиной». εἰς ἅπαντα τὰ ἀγαθὰ ἐν ὀφθαλμοῖς σου τοῦ πορευθῆναι πορεύου — «во всё доброе в очах твоих иди» (гебраизм усиления: «иди, иди»). καὶ ἔδωκεν αὐτῷ ὁ ἀρχιμάγειρος δῶρα — «и дал ему начальник телохранителей дары»; слав. добавляет «пищу» (食物) — нет в LXX; внесено в текст без скобок. Здесь закрывается речь Навузардана и возобновляется авторский текст («и отпустил его»)."
  6: "καὶ ἦλθεν πρὸς Γοδολιαν εἰς Μασσηφα — «и пришёл к Годолии в Массифу»: подлежащее в греч. не названо, по слав. — Иеремия («и прииде иеремиа ко годолии»), в тексте エレミヤ. ἐκάθισεν ἐν μέσῳ τοῦ λαοῦ τοῦ καταλειφθέντος ἐν τῇ γῇ — «сел среди народа, оставшегося в земле». Μασσηφα — ミツパ (ср. 4 Цар 25:23); слав. «в массифаф»."
  7: "πάντες οἱ ἡγεμόνες τῆς δυνάμεως τῆς ἐν ἀγρῷ — «все вожди силы, которые в поле», т. е. военачальники вне города; αὐτοὶ καὶ οἱ ἄνδρες αὐτῶν — «они и мужи их» (в тексте 部下たち). παρεκατέθετο αὐτῷ ἄνδρας καὶ γυναῖκας αὐτῶν — «поручил ему мужчин и жён их» (παρακατατίθημι — вверять, поручать); слав. добавляет «и дети, и от убогих земли» — нет в LXX (по МТ); по паритету внесено в текст без скобок (子供たち…貧しい者たち). οὓς οὐκ ἀπῴκισεν εἰς Βαβυλῶνα — «которых не переселил в Вавилон»."
  8: "Ισμαηλ υἱὸς Ναθανιου — Исмаил, сын Нафании; Ιωαναν υἱὸς Καρηε — Иоханан, сын Карея. Слав. добавляет «и ионафан» (ヨナタン) при сыновьях Карея — нет в LXX (по МТ); внесено в текст без скобок. Σαραιας υἱὸς Θαναεμεθ — Сераия, сын Фанасмефа (греч. Θαναεμεθ, у swete Θαναέμαιθ; в 4 Цар 25:23 Θανεμαθ — タネマト), в тексте タナエメト. υἱοὶ Ωφε τοῦ Νετωφατι — «сыны Офе, Нетофатитянина» (у swete Ιωφε), в тексте ネトファ人オフェの子ら. Ιεζονιας υἱὸς τοῦ Μοχατι — Иезония, сын Махафитянина, в тексте マカティの子イエゾニア, как в 4 Цар 25:23."
  9: "ὤμοσεν αὐτοῖς Γοδολιας — «поклялся им Годолия» (ὄμνυμι — клясться); Μὴ φοβηθῆτε ἀπὸ προσώπου τῶν παίδων τῶν Χαλδαίων — «не бойтесь лица отроков (слуг) халдейских» (παῖς — отрок, слуга; в тексте しもべたち); κατοικήσατε ἐν τῇ γῇ — «живите в земле»; ἐργάσασθε τῷ βασιλεῖ Βαβυλῶνος — «работайте (служите) царю Вавилонскому» (ἐργάζομαι с дательным); βέλτιον ἔσται ὑμῖν — «лучше будет вам». По МТ и ru: «не бойтесь служить Халдеям» — иное понимание того же места, в текст не внесено, держим образ LXX/слав. Речь Годолии — 「…」 до конца 10."
  10: "ἰδοὺ ἐγὼ κάθημαι ἐναντίον ὑμῶν εἰς Μασσηφα — «вот, я сижу пред вами в Массифе»; στῆναι κατὰ πρόσωπον τῶν Χαλδαίων — «чтобы стать пред лицом халдеев», т. е. ходатайствовать за вас (ср. 4 Цар 25:24); οἳ ἂν ἔλθωσιν ἐφ᾿ ὑμᾶς — «которые придут на вас». συναγάγετε οἶνον καὶ ὀπώραν — «соберите вино и плоды» (ὀπώρα — летние плоды; в тексте 果物); βάλετε εἰς τὰ ἀγγεῖα ὑμῶν — «вложите в сосуды ваши» (ἀγγεῖον — сосуд, 器); οἰκήσατε ἐν ταῖς πόλεσιν, αἷς κατεκρατήσατε — «живите в городах, которыми овладели». Здесь закрывается речь Годолии."
  11: "οἱ ἐν γῇ Μωαβ καὶ ἐν υἱοῖς Αμμων — «которые в земле Моав и у сынов Аммона»; οἱ ἐν τῇ Ιδουμαίᾳ — «которые в Идумее» (в тексте エドム); ἔδωκεν βασιλεὺς Βαβυλῶνος κατάλειμμα τῷ Ιουδα — «дал царь Вавилонский остаток Иуде» (κατάλειμμα — остаток). Слав. добавляет в конце «сына сафанова» (シャファンの孫) — в LXX только «сына Ахикама»; по паритету внесено в текст без скобок."
  12: "καὶ ἦλθον πρὸς Γοδολιαν εἰς γῆν Ιουδα εἰς Μασσηφα — «и пришли к Годолии в землю Иудину, в Массифу»; συνήγαγον οἶνον καὶ ὀπώραν πολλὴν σφόδρα καὶ ἔλαιον — «собрали вино и плодов весьма много, и масло». Слав. добавляет «от всех мест, в няже бяху убегли» (из всех мест, куда убежали) — нет в LXX (по МТ); внесено в текст без скобок."
  13: "Καὶ Ιωαναν υἱὸς Καρηε καὶ πάντες οἱ ἡγεμόνες τῆς δυνάμεως οἱ ἐν τοῖς ἀγροῖς — «И Иоханан, сын Карея, и все вожди силы, которые в полях»; ἦλθον πρὸς Γοδολιαν εἰς Μασσηφα — «пришли к Годолии в Массифу». В греч. стих обрывается без точки: речь продолжается в 14; деление держим по gr."
  14: "Εἰ γνώσει γινώσκεις — «знанием знаешь ли» (гебраизм усиления: «разве ты не знаешь»); Βελισα βασιλεὺς υἱῶν Αμμων — Велиса (Ваалис), царь сынов Аммоновых (у swete Βελεισά), в тексте ベリサ — новое имя; ἀπέστειλεν πρὸς σὲ τὸν Ισμαηλ πατάξαι σου ψυχήν — «послал к тебе Исмаила, чтобы поразить душу твою» (πατάσσω — ударить, убить; ψυχή здесь = жизнь), в тексте 打ち殺そうとして. καὶ οὐκ ἐπίστευσεν αὐτοῖς Γοδολιας — «и не поверил им Годолия»."
  15: "κρυφαίως ἐν Μασσηφα — «тайно в Массифе» (κρυφαῖος — тайный); Πορεύσομαι δὴ καὶ πατάξω τὸν Ισμαηλ — «пойду же и поражу Исмаила» (δή — усилительная частица, в тексте わたしが行って…ましょう); μηθεὶς γνώτω — «пусть никто не узнает»; μὴ πατάξῃ σου ψυχὴν — «как бы он не поразил души твоей», т. е. не убил тебя (μὴ с сослагательным — опасение); διασπαρῇ πᾶς Ιουδα οἱ συνηγμένοι πρὸς σὲ — «и не рассеялся весь Иуда, собранный к тебе» (διασπείρω — рассеивать); ἀπολοῦνται οἱ κατάλοιποι Ιουδα — «и не погиб остаток Иуды» (ἀπόλλυμι)."
  16: "Μὴ ποιήσῃς τὸ πρᾶγμα τοῦτο — «не делай этого дела» (πρᾶγμα — дело, поступок); ὅτι ψευδῆ σὺ λέγεις περὶ Ισμαηλ — «ибо ложное ты говоришь об Исмаиле» (ψευδῆ — ложь, мн. ч. среднего рода; в тексте 偽り). Ответ Годолии — 「…」, закрывается в конце стиха; слав. «яко лжу ты глаголеши на исмаила»."
