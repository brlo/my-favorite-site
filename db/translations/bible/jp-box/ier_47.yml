# jp-box, Иеремия, глава 47. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc этой главы не имеет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 47 = слав./ru 40: Годолия. План: 1 надписание — слово при освобождении из Рамы;
# 2–5 речь Навузардана к Иеремии («Господь изрёк зло сие», «иди в Вавилон или
# оставайся», «возвратись к Годолии»); 6 Иеремия приходит к Годолии в Массифу;
# 7 военачальники в поле слышат о поставленном Годолии; 8 они приходят в Массифу
# (Исмаил, Иоханан и Ионафан, Сераия, сыны Офе, Иезония); 9–10 клятва Годолии:
# «не бойтесь халдеев», «я останусь в Массифе», собирайте вино и плоды; 11–12 иудеи
# из Моава, Аммона и Идумеи возвращаются и собирают плоды; 13–14 Иоханан предупреждает
# о заговоре Исмаила; 15 тайное предложение убить Исмаила; 16 отказ Годолии.
# Голоса: 1, 6–8, 11–13 — авторский текст; 2–5 — 「…」 (речь Навузардана; в 5 кавычки
# закрываются перед «и дал ему… и отпустил его»); 9–10 — 「…」 (клятва Годолии);
# 14 — 「…」 (слова военачальников), «しかし…信じなかった» — авторский текст;
# 15 — 「…」 (слова Иоханана); 16 — 「…」 (ответ Годолии).
# Нумерация: gr 16 стихов = слав. 40:1–16, номер в номер; «точек» в этой главе нет.
# 〔…〕 нет. Сносок ⟨…⟩ нет: 親衛隊, 捕囚, 高官, 宦官, 誓 уже в корпусе; ベリサ,
# タナエメト, オフェ — новые имена, оговорены в notes.
# Имена — транслитерация греческого (LXX): エレミヤ, ネブザルアダン (Ναβουζαρδαν,
# в тексте без «архимагир» → 親衛隊の長), ラマ, ゲダルヤ, アヒカム, シャファン,
# ミツパ (Μασσηφα), イシュマエル, ヨハナン, ヨナタン, セラヤ, ベリサ (Βελισα),
# モアブ, アンモン, エドム, カルデア人.

