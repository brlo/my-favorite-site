# jp-box, Бытие, глава 10. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru)
# и русский Синодальный (ru). jp-joc в этой главе в модуле отсутствует (стихи 2–31 пусты),
# поэтому опоры на него нет: имена даются транслитерацией LXX.
# Язык — современный 常体, без 文語; порядок членов — по греческому.
# Глава 10: родословие сыновей Ноя — Иафет (1–5), Хам (6–20), Сим (21–32).
# Красного и синего нет: прямая речь только в 9-м стихе (поговорка о Нимроде), не слова Бога.
# 〔…〕 нет: все слова есть в gr-lxx-byz.
# Важное отличие LXX: в 10:22 и 10:24 есть второй Каинан (его нет в масоретском тексте,
# но он есть у евангелиста Луки, 3:36) — сохранён; в 10:4 названы народы (киттийцы, родосцы),
# а не лица. Имена в LXX и в масоретском тексте часто расходятся — отличия в notes.
# Сносок ⟨…⟩ нет: имена собственные и 巨人, 狩人 понятны.
# jp-ni не использовался.

