verses:
  1: "ノアの息子[むすこ]たち、セム、ハム、ヤフェトの系譜[けいふ]はこうである。洪水[こうずい]の後[のち]、彼[かれ]らに息子[むすこ]たちが生[う]まれた。"
  2: "ヤフェトの息子[むすこ]たちは、ガメル、マゴグ、マダイ、ヨワン、エリサ、トベル、モソク、ティラスである。"
  3: "ガメルの息子[むすこ]たちは、アスカナズ、リファト、トルガマである。"
  4: "ヨワンの息子[むすこ]たちは、エリサ、タルシス、キティム人[じん]、ロドス人[じん]である。"
  5: "この者[もの]たちから、諸国[しょこく]の島々[しまじま]が、それぞれの地[ち]に、それぞれの言語[げんご]に従[したが]って、それぞれの氏族[しぞく]と民[たみ]の中[なか]に分[わ]かれた。"
  6: "ハムの息子[むすこ]たちは、クシュ、ミツライム、プト、カナンである。"
  7: "クシュの息子[むすこ]たちは、セバ、エビラ、サバタ、レグマ、サバカタである。レグマの息子[むすこ]たちは、セバ、ダダンである。"
  8: "クシュはニムロデを生[う]んだ。彼[かれ]は地[ち]の上[うえ]で巨人[きょじん]となり始[はじ]めた。"
  9: "彼[かれ]は主[しゅ]なる神[かみ]の前[まえ]の巨人[きょじん]の狩人[かりゅうど]であった。それゆえ、人[ひと]は言[い]う。「ニムロデのように、主[しゅ]の前[まえ]の巨人[きょじん]の狩人[かりゅうど]だ」と。"
  10: "彼[かれ]の王国[おうこく]の始[はじ]めは、セナアルの地[ち]のバビロン、オレク、アルカド、ハランネであった。"
  11: "その地[ち]からアシュルが出[で]て、ニネベ、ロオボトの町[まち]、ハラハを建[た]てた。"
  12: "また、ニネベとハラハの間[あいだ]にダセムを建[た]てた。これがその大[おお]きな町[まち]である。"
  13: "ミツライムはルディム、エネメティム、ラビム、ネフタリムを生[う]んだ。"
  14: "また、パトロソニム、カスロニムを生[う]んだ。フィリスティムはそこから出[で]た。また、カフトリムを生[う]んだ。"
  15: "カナンは長子[ちょうし]シドンを、またヘト人[じん]を生[う]んだ。"
  16: "また、エブス人[じん]、アモル人[じん]、ゲルゲシ人[じん]を、"
  17: "また、エビ人[じん]、アルキ人[じん]、アセンナイ人[じん]を、"
  18: "また、アラディ人[じん]、サマライ人[じん]、アマティ人[じん]を生[う]んだ。その後[のち]、カナン人[じん]の氏族[しぞく]は散[ち]らばった。"
  19: "カナン人[じん]の境[さかい]は、シドンからゲラルとガザに至[いた]るまでであり、またソドムとゴモラ、アダマとセボイムに至[いた]るまで、ラサに至[いた]るまでであった。"
  20: "これらは、その氏族[しぞく]に従[したが]い、その言語[げんご]に従[したが]い、その地方[ちほう]とその民[たみ]の中[なか]にいるハムの息子[むすこ]たちである。"
  21: "セムにも子[こ]が生[う]まれた。彼[かれ]はエベルのすべての子[こ]たちの父[ちち]であり、年上[としうえ]のヤフェトの兄弟[きょうだい]である。"
  22: "セムの息子[むすこ]たちは、エラム、アシュル、アルファクサド、ルド、アラム、カイナンである。"
  23: "アラムの息子[むすこ]たちは、オス、ウル、ガテル、モソクである。"
  24: "アルファクサドはカイナンを生[う]み、カイナンはサラを生[う]み、サラはエベルを生[う]んだ。"
  25: "エベルには二人[ふたり]の息子[むすこ]が生[う]まれた。一人[ひとり]の名[な]はペレグといった。彼[かれ]の日[ひ]に地[ち]が分[わ]かれたからである。兄弟[きょうだい]の名[な]はヨクタンといった。"
  26: "ヨクタンはエルモダド、サレフ、アサルモト、ヤラハ、"
  27: "オドラ、アイゼル、デクラ、"
  28: "アビメエル、サベウ、"
  29: "オフィル、エビラ、ヨバブを生[う]んだ。これらはすべてヨクタンの息子[むすこ]たちである。"
  30: "彼[かれ]らの住[す]みかは、メサから、東[ひがし]の山[やま]であるソフィラに至[いた]るまでであった。"
  31: "これらは、その氏族[しぞく]に従[したが]い、その言語[げんご]に従[したが]い、その地方[ちほう]とその民[たみ]の中[なか]にいるセムの息子[むすこ]たちである。"
  32: "これらはノアの息子[むすこ]たちの氏族[しぞく]であり、その系譜[けいふ]に従[したが]い、その民[たみ]に従[したが]った。洪水[こうずい]の後[のち]、地[ち]の諸国[しょこく]の島々[しまじま]は、この者[もの]たちから分[わ]かれた。"

notes:
  1: "γενέσεις τῶν υἱῶν Νωε — ノアの子らの系譜 (γένεσις — «происхождение, родословие»). μετὰ τὸν κατακλυσμόν — 洪水の後."
  2: "Γαμερ, Μαγωγ, Μαδαι, Ιωυαν, Ελισα, Θοβελ, Μοσοχ, Θιρας — ガメル、マゴグ、マダイ、ヨワン、エリサ、トベル、モソク、ティラス (по LXX; в масоретском тексте часть форм иная — Гомер, Мадай, Иаван, Фувал, Мешех)."
  3: "Ασχαναζ, Ριφαθ, Θοργαμα — アスカナズ、リファト、トルガマ."
  4: "Ελισα, Θαρσις, Κιτιοι, Ροδιοι — エリサ、タルシス、キティム人、ロドス人: в LXX названы народы (киттийцы, родосцы), в масоретском тексте — Киттим и Доданим. Повтор имени Елиса (было в ст. 2) сохранён, как в LXX."
  5: "ἀφωρίσθησαν νῆσοι τῶν ἐθνῶν — 諸国の島々が分かれた (ἀφορίζω — «отделять»). ἕκαστος κατὰ γλῶσσαν — それぞれの言語に従って. ἐν ταῖς φυλαῖς αὐτῶν καὶ ἐν τοῖς ἔθνεσιν αὐτῶν — 氏族と民の中に."
  6: "Χους, Μεσραιμ, Φουδ, Χανααν — クシュ、ミツライム、プト、カナン."
  7: "Σαβα, Ευιλα, Σαβαθα, Ρεγμα, Σαβακαθα — セバ、エビラ、サバタ、レグマ、サバカタ. υἱοὶ Ρεγμα· Σαβα καὶ Δαδαν — レグマの子らはセバとダダン."
  8: "Νεβρωδ — ニムロデ. γίγας — 巨人 (γίγας — «исполин»). ἤρξατο εἶναι — なり始めた."
  9: "γίγας κυνηγὸς ἐναντίον κυρίου τοῦ θεοῦ — 主なる神の前の巨人の狩人 (κυνηγός — «ловчий»). В поговорке ниже стоит только ἐναντίον κυρίου, без τοῦ θεοῦ — различие сохранено. Речь не Бога, красного нет."
  10: "ἀρχὴ τῆς βασιλείας αὐτοῦ — 彼の王国の始め. Βαβυλών, Ορεχ, Αρχαδ, Χαλαννη — バビロン、オレク、アルカド、ハランネ (LXX; масор. Вавилон, Эрех, Аккад, Халне). ἐν τῇ γῇ Σεννααρ — セナアルの地に."
  11: "ἐκ τῆς γῆς ἐκείνης ἐξῆλθεν Ασσουρ — その地からアシュルが出て. Νινευη, Ροωβωθ πόλιν, Χαλαχ — ニネベ、ロオボトの町、ハラハ."
  12: "Δασεμ ἀνὰ μέσον Νινευη καὶ ἀνὰ μέσον Χαλαχ — ニネベとハラハの間のダセム. αὕτη ἡ πόλις ἡ μεγάλη — これがその大きな町 (в LXX — о городе, о котором только что речь)."
  13: "Λουδιιμ, Ενεμετιιμ, Λαβιιμ, Νεφθαλιιμ — ルディム、エネメティム、ラビム、ネフタリム (порядок LXX; в слав. порядок иной)."
  14: "Πατροσωνιιμ, Χασλωνιιμ, Καφθοριιμ — パトロソニム、カスロニム、カフトリム. ὅθεν ἐξῆλθεν ἐκεῖθεν Φυλιστιιμ — フィリスティムはそこから出た."
  15: "τὸν Σιδῶνα πρωτότοκον — 長子シドン. τὸν Χετταῖον — ヘト人."
  16: "Ιεβουσαῖον, Αμορραῖον, Γεργεσαῖον — エブス人、アモル人、ゲルゲシ人 (продолжение списка от ст. 15)."
  17: "Ευαῖον, Αρουκαῖον, Ασενναῖον — エビ人、アルキ人、アセンナイ人."
  18: "Ἀράδιον, Σαμαραῖον, Αμαθι — アラディ人、サマライ人、アマティ人. μετὰ τοῦτο διεσπάρησαν αἱ φυλαὶ τῶν Χαναναίων — その後、カナン人の氏族は散らばった."
  19: "τὰ ὅρια τῶν Χαναναίων — カナン人の境. ἀπὸ Σιδῶνος ἕως ἐλθεῖν εἰς Γεραρα καὶ Γάζαν — シドンからゲラルとガザに至るまで. ἕως ἐλθεῖν Σοδομων καὶ Γομορρας, Αδαμα καὶ Σεβωιμ, ἕως Λασα — ソドムとゴモラ、アダマとセボイムに至るまで、ラサに至るまで."
  20: "οὗτοι υἱοὶ Χαμ — これらはハムの子ら. ἐν ταῖς φυλαῖς αὐτῶν κατὰ γλώσσας αὐτῶν — その氏族に従い、その言語に従い. ἐν ταῖς χώραις αὐτῶν καὶ ἐν τοῖς ἔθνεσιν αὐτῶν — その地方とその民の中に."
  21: "τῷ Σημ ἐγενήθη καὶ αὐτῷ — セムにも子が生まれた. πατρὶ πάντων τῶν υἱῶν Εβερ — エベルのすべての子らの父. ἀδελφῷ Ιαφεθ τοῦ μείζονος — 年上のヤフェトの兄弟 (LXX и слав. называют Иафета старшим; в масоретском этого нет)."
  22: "Αιλαμ, Ασσουρ, Αρφαξαδ, Λουδ, Αραμ, Καιναν — エラム、アシュル、アルファクサド、ルド、アラム、カイナン. Каинан есть в LXX (и у Луки 3:36), в масоретском тексте его нет."
  23: "Ως, Ουλ, Γαθερ, Μοσοχ — オス、ウル、ガテル、モソク."
  24: "Αρφαξαδ ἐγέννησεν τὸν Καιναν, Καιναν ἐγέννησεν τὸν Σαλα — アルファクサドはカイナンを生み、カイナンはサラを生み: второе поколение — чтение LXX (у Луки 3:36 тоже), в масоретском сразу Сала."
  25: "Φαλεκ — ペレグ. ὅτι ἐν ταῖς ἡμέραις αὐτοῦ διεμερίσθη ἡ γῆ — 彼の日に地が分かれたから (имя понято как «разделение»). Ιεκταν — ヨクタン."
  26: "Ελμωδαδ, Σαλεφ, Ασαρμωθ, Ιαραχ — エルモダド、サレフ、アサルモト、ヤラハ."
  27: "Οδορρα, Αιζηλ, Δεκλα — オドラ、アイゼル、デクラ."
  28: "Αβιμεηλ, Σαβευ — アビメエル、サベウ."
  29: "Ουφιρ, Ευιλα, Ιωβαβ — オフィル、エビラ、ヨバブ. πάντες οὗτοι υἱοὶ Ιεκταν — これらはすべてヨクタンの子ら."
  30: "ἡ κατοίκησις αὐτῶν — 彼らの住みか. ἀπὸ Μασση ἕως ἐλθεῖν εἰς Σωφηρα, ὄρος ἀνατολῶν — メサから東の山ソフィラまで."
  31: "Тот же итог, что в ст. 20, но о Симе: οὗτοι υἱοὶ Σημ ἐν ταῖς φυλαῖς αὐτῶν κατὰ γλώσσας αὐτῶν."
  32: "αἱ φυλαὶ υἱῶν Νωε κατὰ γενέσεις αὐτῶν κατὰ τὰ ἔθνη αὐτῶν — ノアの子らの氏族、その系譜に従い、その民に従った. νῆσοι τῶν ἐθνῶν ἐπὶ τῆς γῆς — 地の諸国の島々."
