# jp-box, 1-я Царств, глава 16. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc для книги нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 16: повеление помазать нового царя (1–3), Самуил в Вифлееме (4–5),
# Елиав, Аминадав, Самма и семь сыновей (6–10), Давид и «Господь смотрит на сердце»
# (7, 11–12), помазание и Дух Господень (13), злой дух и 竪琴 (14–23).
# Речь Господа — 「…」 (1–3, 7, 12); речь Самуила — 「…」 (2, 4–6, 8–12);
# Иессея — 「…」 (11); слуг — 「…」 (15–16); Саула — 「…」 (17, 19, 22).
# Красного нет. Нумерация по гр: 23 стиха, совпадает с csl-ru и ru.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (проверено по выгрузке).
# Сносок ⟨…⟩ нет: エフォド, 燔祭, 悪い霊, 竪琴 уже в корпусе; 先見 объяснён в notes.
