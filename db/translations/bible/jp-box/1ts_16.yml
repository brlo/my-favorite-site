verses:
  1: "主[しゅ]はサムエルに言[い]われた。「いつまであなたはサウルのことを悲[かな]しむのか。わたしは彼[かれ]を退[しりぞ]けて、イスラエルの王[おう]でなくした。あなたの角[つの]に油[あぶら]を満[み]たして行[い]け。わたしはあなたをベツレヘムのエッサイのもとへ遣[つか]わす。彼[かれ]の子[こ]たちのうちに、わたしのために王[おう]となる者[もの]を見[み]たからだ。」"
  2: "サムエルは言[い]った。「どうして行[い]けようか。サウルが聞[き]いて、わたしを殺[ころ]すだろう。」主[しゅ]は言[い]われた。「若[わか]い牛[うし]を手[て]に取[と]って行[い]き、『主[しゅ]に犠牲[ぎせい]をささげるために来[き]た』と言[い]いなさい。"
  3: "エッサイをその犠牲[ぎせい]に呼[よ]びなさい。わたしがあなたにすべきことを示[しめ]す。わたしがあなたに告[つ]げる者[もの]に、わたしのために油[あぶら]を注[そそ]ぎなさい。」"
  4: "サムエルは主[しゅ]が彼[かれ]に語[かた]られたとおりにすべてを行[おこな]い、ベツレヘムへ来[き]た。町[まち]の長老[ちょうろう]たちは彼[かれ]の来訪[らいほう]におののいて言[い]った。「あなたの来[こ]られるのは平和[へいわ]のためか、先見[せんけん]の者[もの]よ。」"
  5: "彼[かれ]は言[い]った。「平和[へいわ]だ。主[しゅ]に犠牲[ぎせい]をささげるために来[き]た。身[み]を清[きよ]めて、今日[きょう]、わたしとともに喜[よろこ]べ。」そしてエッサイとその子[こ]たちを清[きよ]め、彼[かれ]らをその犠牲[ぎせい]に呼[よ]んだ。"
  6: "彼[かれ]らが入[はい]って来[き]、サムエルがエリアブを見[み]ると言[い]った。「まさしく、主[しゅ]の前[まえ]にある方[かた]こそ、主[しゅ]の油[あぶら]を注[そそ]がれた者[もの]だ。」"
  7: "主[しゅ]はサムエルに言[い]われた。「その顔[かお]や背[せ]の高[たか]さを見[み]てはならない。わたしは彼[かれ]を退[しりぞ]けたからだ。主[しゅ]は人[ひと]の見[み]るようには見[み]ない。人[ひと]は顔[かお]を見[み]るが、主[しゅ]は心[こころ]をご覧[らん]になる。」"
  8: "エッサイはアミナダブを呼[よ]び、サムエルの前[まえ]を通[とお]らせた。サムエルは言[い]った。「この者[もの]も主[しゅ]は選[えら]ばなかった。」"
  9: "エッサイはシャマを通[とお]らせた。サムエルは言[い]った。「この者[もの]も主[しゅ]は選[えら]ばなかった。」"
  10: "エッサイは七人[しちにん]の子[こ]たちをサムエルの前[まえ]に通[とお]らせた。サムエルは言[い]った。「この者[もの]たちのうちから主[しゅ]は選[えら]ばなかった。」"
  11: "サムエルはエッサイに言[い]った。「子[こ]どもたちはこれで全員[ぜんいん]か。」エッサイは言[い]った。「まだ末[すえ]の小[ちい]さい者[もの]がいる。見[み]よ、羊[ひつじ]の群[む]れを牧[まき]している。」サムエルはエッサイに言[い]った。「人[ひと]を遣[つか]わして連[つ]れて来[こ]させなさい。彼[かれ]が来[く]るまで、わたしたちは食卓[しょくたく]に着[つ]かない。」"
  12: "エッサイは人[ひと]を遣[つか]わして彼[かれ]を連[つ]れて来[こ]させた。彼[かれ]は赤[あか]みがかった髪[かみ]で、目[め]が美[うつく]しく、主[しゅ]の前[まえ]で姿[すがた]も良[よ]かった。主[しゅ]はサムエルに言[い]われた。「立[た]ち上[あ]がってダビデに油[あぶら]を注[そそ]げ。この者[もの]こそ、わたしが選[えら]んだ者[もの]だ。」"
  13: "サムエルは油[あぶら]の角[つの]を取[と]って、彼[かれ]の兄弟[きょうだい]たちの間[あいだ]で彼[かれ]に油[あぶら]を注[そそ]いだ。その日[ひ]から後[のち]、主[しゅ]の霊[れい]がダビデの上[うえ]に臨[のぞ]んだ。サムエルは立[た]ち上[あ]がってアルマテムへ去[さ]った。"
  14: "主[しゅ]の霊[れい]はサウルから離[はな]れ、主[しゅ]からの悪[わる]い霊[れい]が彼[かれ]を苦[くる]しめた。"
  15: "サウルのしもべたちは彼[かれ]に言[い]った。「見[み]よ、神[かみ]からの悪[わる]い霊[れい]があなたを苦[くる]しめている。"
  16: "どうか、あなたのしもべたちがあなたの前[まえ]で申[もう]し上[あ]げることをお許[ゆる]しください。わたしたちの主人[しゅじん]のために、竪琴[たてごと]を上手[じょうず]に奏[かな]でる者[もの]を探[さが]させてください。悪[わる]い霊[れい]があなたに臨[のぞ]むとき、その者[もの]が竪琴[たてごと]を奏[かな]でれば、あなたは良[よ]くなり、心[こころ]が安[やす]らぐだろう。」"
  17: "サウルはしもべたちに言[い]った。「わたしのために、よく奏[かな]でる者[もの]を見[み]つけて、わたしのところへ連[つ]れて来[こ]い。」"
  18: "若[わか]い者[もの]の一人[ひとり]が答[こた]えて言[い]った。「見[み]た。ベツレヘム人[じん]エッサイの子[こ]で、よく奏[かな]でる者[もの]がいる。しかも、賢[かしこ]い男[おとこ]で、戦[いくさ]に強[つよ]く、言葉[ことば]に優[すぐ]れ、姿[すがた]も良[よ]く、主[しゅ]がともにいる。」"
  19: "サウルはエッサイのもとへ使者[ししゃ]を遣[つか]わして言[い]った。「あなたの羊[ひつじ]の群[む]れのところにいるあなたの子[こ]ダビデを、わたしのところへ遣[つか]わしてくれ。」"
  20: "エッサイはパン一[ひと]荷[に]とぶどう酒[しゅ]の皮袋[かわぶくろ]、それに子山羊[こやぎ]一[いっ]匹[ぴき]を取[と]り、その子[こ]ダビデの手[て]によってサウルのもとへ送[おく]った。"
  21: "ダビデはサウルのところへ来[き]て、彼[かれ]の前[まえ]に仕[つか]えた。サウルは彼[かれ]をたいそう愛[あい]し、彼[かれ]はサウルの武具[ぶぐ]を運[はこ]ぶ者[もの]となった。"
  22: "サウルはエッサイのもとへ人[ひと]を遣[つか]わして言[い]った。「ダビデをわたしの前[まえ]に仕[つか]えさせてほしい。彼[かれ]はわたしの目[め]にかなったからだ。」"
  23: "悪[わる]い霊[れい]がサウルに臨[のぞ]むたびに、ダビデは竪琴[たてごと]を取[と]って手[て]で奏[かな]でた。するとサウルは心[こころ]が休[やす]まり、良[よ]くなって、悪[わる]い霊[れい]は彼[かれ]から離[はな]れた。"

notes:
  1: "Ἕως πότε — доколе; πενθεῖς — печалишься (πενθέω); ἐξουδένωκα — отверг, презрел; πλῆσον τὸ κέρας σου ἐλαίου — наполни рог твой елеем; ἕως εἰς Βηθλεεμ — «до Вифлеема» (ἕως избыточно); ἑόρακα — усмотрел (ὁράω, перфект); ἐμοὶ βασιλεύειν — Мне царствовать."
  2: "Πῶς πορευθῶ — как пойду; Δάμαλιν βοῶν — телицу из волов (δάμαλις); Θῦσαι τῷ κυρίῳ ἥκω — «принести жертву Господу я пришёл»."
  3: "καλέσεις — призовёшь; γνωριῶ σοι — укажу тебе; χρίσεις ὃν ἐὰν εἴπω — помажешь, кого скажу."
  4: "ἐξέστησαν — пришли в трепет; τῇ ἀπαντήσει — при встрече; Εἰρήνη ἡ εἴσοδός σου — «мир вход твой?»; ὁ βλέπων — видящий, прозорливец (先見)."
  5: "ἁγιάσθητε — освятитесь; εὐφράνθητε — возрадуйтесь; ἡγίασεν — освятил; ἐκάλεσεν εἰς τὴν θυσίαν — призвал на жертву."
  6: "Ἀλλὰ καὶ ἐνώπιον κυρίου χριστὸς αὐτοῦ — «но и пред Господом помазанник Его» (эллипсис; слав. «сей ли пред Господем помазанник его?»); χριστός здесь — «помазанник», не титул."
  7: "μὴ ἐπιβλέψῃς — не смотри; ὄψιν — вид; ἕξιν μεγέθους — статность, величина роста; ἐξουδένωκα — отверг; οὐχ ὡς ἐμβλέψεται ἄνθρωπος — не как посмотрит человек; εἰς καρδίαν — в сердце."
  8: "Αμιναδαβ — Аминадав; παρῆλθεν κατὰ πρόσωπον — прошёл пред лицом; οὐδὲ τοῦτον — и этого не."
  9: "Σαμα — Самма (Шамма); παρήγαγεν — провёл, подвёл (παράγω); καὶ ἐν τούτῳ — и в этом."
  10: "τοὺς ἑπτὰ υἱούς — семерых сыновей; οὐκ ἐξελέξατο — не избрал."
  11: "Ἐκλελοίπασιν τὰ παιδάρια — «недостало ли детей?» (ἐκλείπω); ὁ μικρός — меньший; ποιμαίνει — пасёт; οὐ μὴ κατακλιθῶμεν — не возляжем (усиленное отрицание); ἕως τοῦ ἐλθεῖν — до прихода."
  12: "πυρράκης — рыжеватый; μετὰ κάλλους ὀφθαλμῶν — с красотой глаз; ἀγαθὸς ὁράσει κυρίῳ — «хорош видом пред Господом»; χρῖσον — помажь; ὅτι οὗτος ἀγαθός — «ибо он хорош»."
  13: "κέρας τοῦ ἐλαίου — рог елея; ἐν μέσῳ τῶν ἀδελφῶν — среди братьев; ἐφήλατο — «устремился, пал на» (ἐφάλλομαι); ἀπὸ τῆς ἡμέρας ἐκείνης καὶ ἐπάνω — с того дня и выше."
  14: "ἀπέστη — отступил; ἔπνιγεν — душил, терзал (πνίγω); πνεῦμα πονηρὸν παρὰ κυρίου — злой дух от Господа."
  15: "οἱ παῖδες — слуги; πνίγει σε — душит тебя (в гр πνεῦμα κυρίου πονηρόν; слав. «дух лукавый от Господа»)."
  16: "εἰπάτωσαν — пусть скажут; ζητησάτωσαν — пусть поищут; ἄνδρα εἰδότα ψάλλειν ἐν κινύρᾳ — мужа, умеющего играть на кинире (ψάλλω — играть, петь); ἀναπαύσει σε — успокоит тебя."
  17: "Ἴδετε δή μοι — усмотрите же мне; ὀρθῶς ψάλλοντα — правильно играющего; εἰσαγάγετε — введите."
  18: "εἷς τῶν παιδαρίων — один из отроков; εἰδότα ψαλμόν — знающего псалом, т. е. игру; συνετός — разумный; πολεμιστής — воин; σοφὸς λόγῳ — мудрый в слове; ἀγαθὸς τῷ εἴδει — хорош видом; κύριος μετ᾽ αὐτοῦ — Господь с ним."
  19: "ἀπέστειλεν ἀγγέλους — послал вестников; Ἀπόστειλον — пошли; τὸν ἐν τῷ ποιμνίῳ σου — что при отаре твоей."
  20: "γομορ ἄρτων — гомор хлебов (груз осла, мера); ἀσκόν οἴνου — мех вина; ἔριφον αἰγῶν ἕνα — одного козлёнка; ἐξαπέστειλεν — послал."
  21: "παρειστήκει — предстоял (παρίστημι, плюсквамперфект); ἠγάπησεν σφόδρα — полюбил весьма; αἴρων τὰ σκεύη — носящий оружие."
  22: "Παριστάσθω — пусть предстоит; εὗρεν χάριν — обрёл благодать; ἐν ὀφθαλμοῖς μου — в очах моих."
  23: "ἐν τῷ εἶναι πνεῦμα πονηρὸν ἐπὶ Σαυλ — когда был злой дух на Сауле; ἐλάμβανεν τὴν κινύραν — брал киниру; ἔψαλλεν — играл; ἀνέψυχεν — отдыхал, оживал (ἀναψύχω); ἀφίστατο — отступал."
