# jp-box, Деяния апостолов, глава 18. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий (gr-lxx-byz) — свидетель; расхождения — в 〔…〕 и notes.
# jp-ni не использовался.
#
# Глава 18: Коринф, Акила и Прискилла (1–4), проповедь иудеям (5–11), Галлион
# (12–17), возвращение в Антиохию (18–23), Аполлос в Ефесе (24–28).
# Красное (<j>): только 18:9–10 — слова Господа Павлу в видении. Речи Павла,
# иудеев, Галлиона, Аполлоса — не красные.
# 〔…〕: 18:17 〔ギリシア人たち〕 (в критической базе только πάντες, церковный текст
# читает οἱ Ἕλληνες); 18:21 два места церковного текста — праздничная вставка
# и приписка об Акиле и Прискилле (в критической базе их нет).
# Сноска одна: 18:18 (обет).

tr_code: jp-box
book: act
chapter: 18
draft: true

verses:
  1: "その後[のち]、パウロはアテネを立[た]ち去[さ]り、コリントへ来[き]た。"
  2: "そこであるユダヤ人[じん]、アクラに出会[であ]った。ポント生[うま]れの人[ひと]で、最近[さいきん]、妻[つま]プリスキラとともにイタリアから来[き]たばかりであった。クラウディウスが、すべてのユダヤ人[じん]にローマから退去[たいきょ]するよう命[めい]じたからである。パウロは二人[ふたり]を訪[たず]ね、"
  3: "同[おな]じ職人[しょくにん]であったので、彼[かれ]らのところに滞在[たいざい]して一緒[いっしょ]に働[はたら]いた。彼[かれ]らは天幕[てんまく]作[つく]りを仕事[しごと]としていたのである。"
  4: "パウロは安息日[あんそくび]ごとに会堂[かいどう]で論[ろん]じ、ユダヤ人[じん]たちとギリシア人[じん]たちとを説得[せっとく]していた。"
  5: "シラスとティモテがマケドニアから来[き]ると、パウロは御言葉[みことば]に迫[せま]られて、イエスがキリストであることをユダヤ人[じん]たちに力強[ちからづよ]く証[あかし]した。"
  6: "しかし、彼[かれ]らが反抗[はんこう]して冒涜[ぼうとく]の言葉[ことば]を吐[は]くと、パウロは衣[ころも]を振[ふ]るって彼[かれ]らに言[い]った。「あなたがたの血[ち]は、あなたがたの頭[あたま]の上[うえ]にある。わたしは潔白[けっぱく]である。これからは異邦人[いほうじん]のところへ行[い]く。」"
  7: "そして、そこを去[さ]って、神[かみ]を崇[あが]めるティト・ユストという人[ひと]の家[いえ]に入[はい]った。その家[いえ]は会堂[かいどう]の隣[となり]にあった。"
  8: "会堂長[かいどうちょう]クリスポは、全[ぜん]家[か]とともに主[しゅ]を信[しん]じた。また、コリント人[じん]の多[おお]くの者[もの]が、聞[き]いて信[しん]じ、洗礼[せんれい]を受[う]けた。"
  9: "ある夜[よる]、主[しゅ]は幻[まぼろし]のうちにパウロに言[い]われた。「<j>恐[おそ]れるな。語[かた]り続[つづ]け、黙[だま]ってはならない。</j>"
  10: "<j>わたしがあなたとともにいるからである。あなたに害[がい]を加[くわ]えようとする者[もの]はだれもいない。この町[まち]には、わたしの民[たみ]が多[おお]くいるからである。</j>」"
  11: "パウロはそこに一年[いちねん]六[ろく]か月[げつ]とどまり、彼[かれ]らの間[あいだ]で神[かみ]の御言葉[みことば]を教[おし]えた。"
  12: "ガリオンがアカイアの総督[そうとく]であったとき、ユダヤ人[じん]たちは一斉[いっせい]にパウロに襲[おそ]いかかり、彼[かれ]を裁[さば]きの座[ざ]の前[まえ]に引[ひ]き出[だ]して、"
  13: "言[い]った。「この男[おとこ]は、律法[りっぽう]に反[はん]して、人々[ひとびと]に神[かみ]を崇[あが]めるよう説得[せっとく]しています。」"
  14: "パウロが口[くち]を開[ひら]こうとしたとき、ガリオンはユダヤ人[じん]たちに言[い]った。「ユダヤ人[じん]たちよ。もしもそれが不正[ふせい]な行[おこな]いや悪[わる]い企[たくら]みであったなら、わたしはあなたがたの言[い]い分[ぶん]を聞[き]くのが当然[とうぜん]であろう。"
  15: "しかし、それが言葉[ことば]や名[な]や、あなたがたの律法[りっぽう]に関[かん]する論争[ろんそう]であるなら、自分[じぶん]たちで解決[かいけつ]するがよい。わたしはそのようなことの裁判官[さいばんかん]になるつもりはない。」"
  16: "そして、彼[かれ]らを裁[さば]きの座[ざ]から追[お]い払[はら]った。"
  17: "そこで、〔ギリシア人[じん]たち〕皆[みな]が会堂長[かいどうちょう]ソステネを捕[つか]まえ、裁[さば]きの座[ざ]の前[まえ]で打[う]ちたたいた。ガリオンはそのことを少[すこ]しも気[き]にかけなかった。"
  18: "パウロはなお幾日[いくにち]か滞在[たいざい]してから、兄弟[きょうだい]たちに別[わか]れを告[つ]げ、プリスキラとアクラを伴[ともな]ってシリアへ船出[ふなで]した。誓願[せいがん]⟨神[かみ]に立[た]てた誓[ちか]い。この場合はナジル人[じん]の誓願[せいがん]で、一定[いってい]の期間[きかん]、髪[かみ]を刈[か]らずにいた。⟩を立てていたので、ケンクレアイで頭[あたま]の髪[かみ]を刈[か]ったのである。"
  19: "そしてエフェソに着[つ]くと、二人[ふたり]をそこに残[のこ]し、自分[じぶん]は会堂[かいどう]に入[はい]ってユダヤ人[じん]たちと論[ろん]じた。"
  20: "彼[かれ]らは、もっと長[なが]くとどまってほしいと願[ねが]ったが、パウロは承知[しょうち]しなかった。"
  21: "しかし、彼[かれ]らに別[わか]れを告[つ]げて言[い]った。「〔わたしは、来[く]る祭[まつ]りをぜひともエルサレムで守[まも]らなければならない。〕神[かみ]が望[のぞ]まれるなら、またあなたがたのところへ戻[もど]って来[こ]よう。」そして、エフェソから船出[ふなで]した。〔アクラとプリスキラはエフェソに残[のこ]った。〕"
  22: "カイサリアに下[くだ]ると、上[のぼ]って教会[きょうかい]に挨拶[あいさつ]をし、それからアンティオキアへ下[くだ]った。"
  23: "パウロはしばらくそこに滞在[たいざい]してから出[で]かけ、次々[つぎつぎ]にガラテヤの地方[ちほう]とフリギアを巡[めぐ]って、すべての弟子[でし]たちを力[ちから]づけた。"
  24: "さて、アポロという名[な]のユダヤ人[じん]がエフェソに来[き]た。アレクサンドリア生[うま]れの人[ひと]で、弁論[べんろん]に長[た]け、聖書[せいしょ]に詳[くわ]しい人[ひと]であった。"
  25: "この人[ひと]は主[しゅ]の道[みち]について教[おし]えを受[う]けていた。霊[れい]に燃[も]えて、イエスに関[かん]することを正確[せいかく]に語[かた]り、教[おし]えていたが、知[し]っていたのはヨハネの洗礼[せんれい]だけであった。"
  26: "彼[かれ]が会堂[かいどう]で大胆[だいたん]に語[かた]り始[はじ]めると、プリスキラとアクラはそれを聞[き]き、彼[かれ]を招[まね]いて、神[かみ]の道[みち]をいっそう詳[くわ]しく説[と]き明[あか]かした。"
  27: "彼[かれ]がアカイアへ渡[わた]ろうと思[おも]ったとき、兄弟[きょうだい]たちは彼[かれ]を励[はげ]まし、弟子[でし]たちに彼[かれ]を迎[むか]えるよう手紙[てがみ]を書[か]いた。彼[かれ]はそこに着[つ]くと、{恵[めぐ]み|恩寵[おんちょう]}によって信[しん]じた人々[ひとびと]を大[おお]いに助[たす]けた。"
  28: "彼[かれ]は公[おおやけ]の場[ば]で、聖書[せいしょ]に基[もと]づきながらイエスがキリストであることを示[しめ]して、ユダヤ人[じん]たちを強[つよ]く論破[ろんぱ]した。"

notes:
  1: "Κόρινθος — コリント."
  2: "Ἀκύλας, Πρίσκιλλα — アクラ, プリスキラ (в посланиях греч. Πρίσκα, но имя в корпусе выровнено: アクラ, プリスキラ). Клавдий изгнал иудеев из Рима (эдикт ок. 49–50 г.); クラウディウス."
  3: "σκηνοποιοί — «делатели палаток» (кожа и шерсть); 天幕作り. ὁμότεχνον — «того же ремесла»; 同じ職人."
  4: "διελέγετο — «беседовал, рассуждал»; 論じ. ἔπειθεν — «убеждал»; 説得していた."
  5: "συνείχετο τῷ λόγῳ — «сдерживаем, понуждаем был словом»; 御言葉に迫られて. διαμαρτυρόμενος — «торжественно свидетельствуя»; 力強く証しした."
  6: "ἐκτιναξάμενος τὰ ἱμάτια — отряс одежды в знак непричастности; 衣を振るって. τὸ αἷμα ὑμῶν ἐπὶ τὴν κεφαλὴν ὑμῶν — «кровь ваша на головах ваших»; 血は…頭の上にある. Слова Павла, не красные."
  7: "Τιτίου Ἰούστου — ティト・ユスト; у jp-joc «Иуст». σεβομένου τὸν θεόν — 神を崇める人."
  8: "Κρίσπος ὁ ἀρχισυνάγωγος — 会堂長クリスポ (ср. 1 Кор 1:14)."
  9: "Слова Господа в видении — единственное красное в главах 16–18; в критической базе текст без разночтений."
  10: "ἐγώ εἰμι μετὰ σοῦ — «Я есмь с тобою»; わたしがあなたとともにいる. λαός — «народ»; わたしの民."
  11: "ἐνιαυτὸν καὶ μῆνας ἕξ — «год и шесть месяцев»; 一年六か月."
  12: "ἀνθύπατος — проконсул; 総督. Галлион — брат Сенеки, проконсул Ахаии в 51–52 гг.; датировка книги."
  13: "παρὰ τὸν νόμον — «против закона»; 律法に反して. Слова иудеев, не красные."
  14: "ῥᾳδιούργημα πονηρόν — «злое плутовство, злодеяние»; 悪い企み. κατά λόγον — «по разуму, как следует»; 当然."
  15: "ζητήματα περὶ λόγου καὶ ὀνομάτων — «споры о слове и именах»; 言葉や名に関する論争."
  17: "В критической базе ἐπιλαβόμενοι δὲ πάντες (без Ἕλληνες); церковный текст (Елизаветинская «вси еллини», jp-joc 衆エㇽリン人) читает οἱ Ἕλληνες — 〔ギリシア人たち〕. Σωσθένης — начальник синагоги (ср. 1 Кор 1:1)."
  18: "εὐχή — обет; 誓願 (сноска). κειράμενος τὴν κεφαλήν — остриг голову; 頭の髪を刈った. Κεγχρεαί — восточная гавань Коринфа; ケンクレアイ."
  19: "Ἔφεσος — エフェソ."
  21: "В критической базе только Πάλιν ἀνακάμψω πρὸς ὑμᾶς τοῦ θεοῦ θέλοντος; церковный текст (Елизаветинская «подобает ми всяко праздник грядущий сотворити во Иерусалиме», jp-joc 邇づける節筵を必ずイエルサリムに守るべし) читает вставку о празднике — 〔…〕. Приписка «Акила же и Прискилла остаста во Ефесе» (Елизаветинская в скобках) в критической базе отсутствует — 〔…〕; ср. уже сказанное в 18:19."
  22: "Καισάρεια — カイサリア. ἀναβάς — «взойдя» (в Иерусалим, не назван); 上って. Ἀντιόχεια — アンティオキア."
  23: "Γαλατικὴ χώρα καὶ Φρυγία — ガラテヤの地方とフリギア. ἐπιστηρίζων — «утверждая»; 力づけた."
  24: "Ἀπολλῶς — アポロ (у jp-joc アポㇽロス). Ἀλεξανδρεύς — アレクサンドリア生まれ. λόγιος — «красноречивый, учёный»; 弁論に長け."
  25: "κατηχημένος τὴν ὁδὸν τοῦ κυρίου — «наставленный в пути Господнем»; 主の道について教えを受けていた. ζέων τῷ πνεύματι — «горя духом»; 霊に燃えて. βάπτισμα Ἰωάννου — ヨハネの洗礼."
  26: "ἀκριβέστερον — «точнее»; いっそう詳しく. В критической базе τὴν ὁδὸν τοῦ θεοῦ (в Елизаветинской «Господень»); переведено 神の道."
  27: "προτρεψάμενοι — «увещав, ободрив»; 励まし. διὰ τῆς χάριτος — «благодатью»; 恵みによって."
  28: "εὐτόνως — «сильно, настойчиво»; 強く. διακατηλέγχετο — «опровергал»; 論破した. δημοσίᾳ — «публично»; 公の場で."
