verses:
  1: "もし盗人[ぬすびと]が壁[かべ]を破[やぶ]って入[はい]るところを見[み]つかり、打[う]たれて死[し]んだとしても、その死[し]について血[ち]の罪[つみ]はない。"
  2: "しかし、日[ひ]が昇[のぼ]ってからであれば、その者[もの]は罪[つみ]を負[お]い、死[し]をもって償[つぐな]わなければならない。もし盗人[ぬすびと]に償[つぐな]うものがなければ、その盗[ぬす]みの代[か]わりに自分[じぶん]を売[う]らなければならない。"
  3: "しかし、もし盗人[ぬすびと]が捕[つか]まり、盗[ぬす]んだものが、ろばであれ羊[ひつじ]であれ、まだ生[い]きたままその手[て]に見[み]つかったなら、それを二倍[にばい]にして償[つぐな]う。"
  4: "もし人[ひと]が畑[はたけ]やぶどう畑[ばたけ]を家畜[かちく]に食[た]べさせ、自分の家畜[かちく]を放[はな]って他人[たにん]の畑[はたけ]を食[た]べさせたなら、その畑[はたけ]の産物[さんぶつ]に応[おう]じて自分の畑[はたけ]から償[つぐな]う。もし畑[はたけ]の全部[ぜんぶ]を食[た]べさせたなら、自分の畑[はたけ]の最[もっと]も良[よ]いものと、自分のぶどう畑[ばたけ]の最[もっと]も良[よ]いものを償[つぐな]う。"
  5: "もし火[ひ]が燃[も]え広[ひろ]がって茨[いばら]に移[うつ]り、脱穀場[だっこくじょう]や穂[ほ]、あるいは畑[はたけ]を焼[や]いたなら、火[ひ]をつけた者[もの]が償[つぐな]う。"
  6: "もし人[ひと]が隣人[りんじん]に銀[ぎん]や品物[しなもの]を預[あず]け、それがその人[ひと]の家[いえ]から盗[ぬす]まれたなら、盗人[ぬすびと]が見[み]つかったときは、それを二倍[にばい]にして償[つぐな]う。"
  7: "しかし、盗人[ぬすびと]が見[み]つからないなら、その家[いえ]の主人[しゅじん]は神[かみ]の前[まえ]に進[すす]み出[で]て、隣人[りんじん]の預[あず]かり物[もの]すべてについて、自分[じぶん]が手[て]を出[だ]していないと誓[ちか]わなければならない。"
  8: "子牛[こうし]、家畜[かちく]、羊[ひつじ]、着物[きもの]、そのほか、訴[うった]えられた物[もの]の紛失[ふんしつ]についても、それが何[なに]であれ、不正[ふせい]とされるすべての件[けん]について、双方[そうほう]の裁[さば]きは神[かみ]の前[まえ]に持[も]ち出[だ]される。そして、神[かみ]によって罪[つみ]ありとされた者[もの]は、隣人[りんじん]に二倍[にばい]にして償[つぐな]う。"
  9: "もし人[ひと]が隣人[りんじん]に、家畜[かちく]や子牛[こうし]、羊[ひつじ]、あるいはどんな家畜[かちく]でも預[あず]け、それが死[し]んだり、傷[きず]ついたり、奪[うば]い去[さ]られたりして、それを誰[だれ]も見[み]なかったなら、"
  10: "双方[そうほう]の間[あいだ]に、預[あず]かり物[もの]すべてについて自分[じぶん]が手[て]を出[だ]していないという神[かみ]への誓[ちか]いが立[た]てられる。そして、その持[も]ち主[ぬし]はそれを受[う]け入[い]れ、償[つぐな]わなくてよい。"
  11: "しかし、それが彼[かれ]のもとから盗[ぬす]まれたなら、その持[も]ち主[ぬし]に償[つぐな]う。"
  12: "しかし、それが獣[けもの]に食[た]い殺[ころ]されたなら、その死骸[しがい]を持[も]って来[く]る。その場合[ばあい]は償[つぐな]わない。"
  13: "もし人[ひと]が隣人[りんじん]から借[か]りた物[もの]が傷[きず]ついたり、死[し]んだり、奪[うば]い去[さ]られたりして、その持[も]ち主[ぬし]がそこにいなかったなら、借[か]りた者[もの]が償[つぐな]う。"
  14: "しかし、その持[も]ち主[ぬし]がそこにいたなら、償[つぐな]わなくてよい。もしそれが賃借[ちんしゃく]したものであるなら、その賃金[ちんぎん]が代[か]わりになる。"
  15: "もし人[ひと]がまだ婚約[こんやく]していない娘[むすめ]を欺[あざむ]いて、その娘[むすめ]と寝[ね]たなら、婚資[こんし]を払[はら]って、必[かなら]ず彼女[かのじょ]を自分[じぶん]の妻[つま]に迎[むか]えなければならない。"
  16: "しかし、もし娘[むすめ]の父[ちち]がどうしても承知[しょうち]せず、彼女[かのじょ]を彼[かれ]に妻[つま]として与[あた]えようとしないなら、彼[かれ]は、処女[しょじょ]たちに払[はら]われる婚資[こんし]に相応[そうおう]する銀[ぎん]を、父[ちち]に払[はら]わなければならない。"
  17: "呪術[じゅじゅつ]をなす者[もの]たちを生[い]かしておいてはならない。"
  18: "家畜[かちく]と寝[ね]る者[もの]は、すべて必[かなら]ず殺[ころ]さなければならない。"
  19: "神々[かみがみ]にいけにえを献[ささ]げる者[もの]は、主[しゅ]のみに献[ささ]げるほかは、必[かなら]ず滅[ほろ]ぼされる。"
  20: "寄留者[きりゅうしゃ]を苦[くる]しめてはならない。悩[なや]ましてもならない。あなたがたもまたエジプトの地[ち]では寄留者[きりゅうしゃ]であったからである。"
  21: "やもめや孤児[みなしご]をすべて苦[くる]しめてはならない。"
  22: "もしあなたがたが彼[かれ]らをひどく苦[くる]しめ、彼[かれ]らがわたしに向[む]かって叫[さけ]び声[ごえ]を上[あ]げるなら、わたしはその声[こえ]を必[かなら]ず聞[き]こう。"
  23: "わたしは怒[いか]りに燃[も]え、あなたがたを剣[つるぎ]で殺[ころ]す。あなたがたの妻[つま]はやもめとなり、あなたがたの子[こ]どもは孤児[みなしご]となる。"
  24: "もしあなたが、あなたのもとにいる貧[まず]しい兄弟[きょうだい]に銀[ぎん]を貸[か]すなら、あなたは彼[かれ]を厳[きび]しく責[せ]めたててはならない。彼[かれ]に利子[りし]を課[か]してもならない。"
  25: "もしあなたが隣人[りんじん]の着物[きもの]を質[しち]に取[と]ったなら、日[ひ]の沈[しず]む前[まえ]にそれを返[かえ]さなければならない。"
  26: "それは彼[かれ]の覆[おお]いであり、彼[かれ]が裸[はだか]を隠[かく]すただ一[ひと]つの着物[きもの]である。何[なに]に包[つつ]まれて寝[ね]るというのか。彼[かれ]がわたしに向[む]かって叫[さけ]ぶなら、わたしは彼[かれ]の声[こえ]を聞[き]く。わたしはあわれみ深[ぶか]いからである。"
  27: "神々[かみがみ]をののしってはならない。あなたの民[たみ]の支配者[しはいしゃ]を悪[わる]く言[い]ってもならない。"
  28: "あなたの脱穀場[だっこくじょう]とぶどう搾[しぼ]り場[ば]の初穂[はつほ]を、遅[おく]らせてはならない。あなたの息子[むすこ]たちのうちの長子[ちょうし]を、わたしに与[あた]えなければならない。"
  29: "あなたの子牛[こうし]と羊[ひつじ]、ろばについても、同[おな]じようにしなければならない。七日[なのか]の間[あいだ]は母[はは]のもとに置[お]き、八日目[ようかめ]にわたしに献[ささ]げなければならない。"
  30: "あなたがたはわたしにとって聖[せい]なる者[もの]とならなければならない。獣[けもの]に食[た]い荒[あ]らされた肉[にく]を食[た]べてはならない。それを犬[いぬ]に投[な]げ捨[す]てなさい。"

notes:
  1: "ἐν τῷ διορύγματι — 壁を破って (подкоп, взлом). φόνος — 血の罪, убийство (юридический термин). В Синодальном это 22:2."
  2: "ἀνατείλῃ ὁ ἥλιος — 日が昇ってから (вор днём опознан и не опасен). ἀνταποθανεῖται — 死をもって償う (ἀνταποθνήσκω — «умереть в ответ»). πραθήτω — 売られる (πωλέω)."
  3: "καταλημφθῇ — 捕まる. διπλᾶ — 二倍 (διπλοῦς). У LXX речь о найденном в руках вора живом скоте."
  4: "καταβοσκήσῃ — 食わせる (καταβόσκω — «стравливать»). γένημα — 産物. τὰ βέλτιστα — 最も良いもの (превосходная степень от ἀγαθός). В Синодальном это 22:5."
  5: "ἐξελθὸν πῦρ — 火が燃え広がって (букв. «вышедший огонь»). ἄκανθα — 茨. ἅλων — 脱穀場 (гумно). στάχυς — 穂. В Синодальном это 22:6."
  6: "σκεύη — 品物. φυλάξαι — 預ける (φυλάσσω — «стеречь, хранить»). ἀποτείσει διπλοῦν — 二倍にして償う. В Синодальном это 22:7."
  7: "ὀμεῖται ἦ μὴν μὴ … πεπονηρεῦσθαι — 手を出していないと誓う (ἦ μήν — «поистине что»; формула клятвы). παρακαταθήκη — 預かり物. В Синодальном это 22:8."
  8: "ῥητὸν ἀδίκημα — 不正とされる件 (ῥητός — «оговорённый, заявленный»). ὁ ἁλοὺς διὰ τοῦ θεοῦ — 神によって罪ありとされた者 (ἁλίσκομαι — «быть уличённым»). В Синодальном это 22:9."
  9: "συντριβῇ — 傷つく (συντρίβω — «сокрушать»). αἰχμάλωτον γένηται — 奪い去られる (букв. «стать пленным»). В Синодальном это 22:10."
  10: "ὅρκος τοῦ θεοῦ — 神への誓い. προσδέξεται — 受け入れる. В Синодальном это 22:11."
  11: "ἀποτείσει τῷ κυρίῳ — 持ち主に償う. В Синодальном это 22:12."
  12: "θηριάλωτον — 獣に食い殺された (θήρ — «зверь», ἁλίσκομαι). ἄξει … ἐπὶ τὴν θήραν — 死骸を持って来る (букв. «приведёт на растерзанное»). В Синодальном это 22:13."
  13: "ᾐτήσῃ — 借りる (αἰτέω — «просить»). ὁ κύριος μὴ ᾖ μετ᾿ αὐτοῦ — 持ち主がそこにいなかった. В Синодальном это 22:14."
  14: "μισθωτός — 賃借したもの (наёмный). ἔσται αὐτῷ ἀντὶ τοῦ μισθοῦ — 賃金が代わりになる. В Синодальном это 22:15."
  15: "παρθένον ἀμνήστευτον — まだ婚約していない娘 (ἀμνήστευτος — «необручённая»). φερνή — 婚資 (вено). В Синодальном это 22:16."
  16: "ἀνανεύων ἀνανεύσῃ — どうしても承知せず (ἀνανεύω — «отказывать кивком»). φερνὴ τῶν παρθένων — 処女たちに払われる婚資. В Синодальном это 22:17."
  17: "φαρμακούς — 呪術をなす者たち (φάρμακον — «зелье, колдовство»; слав. «волхвы»). В Синодальном это 22:18."
  18: "κοιμώμενον μετὰ κτήνους — 家畜と寝る者. ἀποκτενεῖτε — 殺す (множественное число при собирательном subject). В Синодальном это 22:19."
  19: "ὁ θυσιάζων θεοῖς — 神々にいけにえを献げる者. πλὴν κυρίῳ μόνῳ — 主のみに献げるほかは. θανάτῳ ὀλεθρευθύσεται — 必ず滅ぼされる. В Синодальном это 22:20."
  20: "προσήλυτος — 寄留者. ἦτε γὰρ προσήλυτοι ἐν γῇ Αἰγύπτῳ — エジプトの地では寄留者であった. В Синодальном это 22:21."
  21: "χήρα — やもめ. ὀρφανός — 孤児. В Синодальном это 22:22."
  22: "ἀκοῇ εἰσακούσομαι — 必ず聞く (датив усиления при ἀκούω). В Синодальном это 22:23."
  23: "ὀργισθήσομαι θυμῷ — 怒りに燃える (датив усиления). μαχαίρᾳ — 剣で. В Синодальном это 22:24."
  24: "ἐκδανείσῃς — 貸す (ἐκδανείζω). κατεπείγων — 厳しく責めたてる (κατεπείγω — «понуждать»). τόκον — 利子. В Синодальном это 22:25."
  25: "ἐνεχύρασμα — 質 (залог). πρὸ δυσμῶν ἡλίου — 日の沈む前に. В Синодальном это 22:26."
  26: "περιβόλαιον — 覆い (покрывало). ἀσχημοσύνη — 裸 (срам). ἐλεήμων — あわれみ深い. В Синодальном это 22:27."
  27: "θεοὺς οὐ κακολογήσεις — 神々をののしる (в евр. «элохим» может значить и судей; у LXX — боги). ἄρχοντας τοῦ λαοῦ — 民の支配者. В Синодальном это 22:28."
  28: "ἀπαρχὰς ἅλωνος καὶ ληνοῦ — 脱穀場とぶどう搾り場の初穂 (ληνός — точило). τὰ πρωτότοκα τῶν υἱῶν — 息子たちの長子. В Синодальном это 22:29."
  29: "ὑποζύγιον — ろば (вьючное животное; слав. «осёл»). ὑπὸ τὴν μητέρα — 母のもとに. В Синодальном это 22:30."
  30: "ἄνδρες ἅγιοι — 聖なる者 (букв. «святые мужи»). κρέας θηριάλωτον — 獣に食い荒らされた肉. τῷ κυνὶ ἀπορρίψατε — 犬に投げ捨てる. В Синодальном это 22:31."
