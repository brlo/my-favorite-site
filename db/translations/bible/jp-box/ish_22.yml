# jp-box, Исход, глава 22. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — csl-ru, ru (с масоретского —
# только для понимания); jp-joc в этой главе нет. Язык — современный 常体.
# Глава 22: кража и возмещение (1–4), потрава и пожар (5), поклажа и залог (6–12),
# ссуда скота (13–14), обольщение девицы (15–16), волхвование (17), скотоложство (18),
# идолослужение (19), пришелец, вдова и сирота (20–23), ссуда и залог одежды (24–26),
# судьи и начатки (27–30).
# Красного и синего нет: говорит Бог, но это не прямая речь Христа во плоти; «<j>» не ставится.
# Прямая речь — в 「…」; вложенной речи нет.
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено по базе). Славянские вставки в скобках
# («и поймет ю» в 22:15 при греч. γυναῖκα; «от лица вашего» в 23:23) — редакторские, в 〔…〕 не берутся.
# Нумерация: у LXX гл. 22 — 30 стихов, у Синодального (МТ) — 31. Сдвиг на один стих:
# LXX 22:1 = Син 22:2, LXX 22:30 = Син 22:31. У LXX 22:1 — вор, застигнутый при подкопе;
# в Синодальном этот стих — конец 21-й главы (21:37, кража вола).
# Сносок ⟨…⟩ нет: 寄留者, 孤児, やもめ, 利子 уже в корпусе или понятны.
# jp-ni не использовался.

