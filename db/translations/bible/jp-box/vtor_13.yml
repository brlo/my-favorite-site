# jp-box, Второзаконие, глава 13. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в главе отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 13: лжепророк и сновидец (1–6), соблазнитель из близких (7–12),
# нечестивый город (13–19): исследование, истребление, запрет брать из заклятого.
# Нумерация — по gr: в gr-lxx-byz 19 стихов; в csl-ru и ru 18, потому что
# gr 13:1 («Всякое слово…») у них стоит как 12:32, а gr 13:2–19 = csl/ru 13:1–18.
# Речь Моисея к народу — 「…」 (вся глава); слова лжепророка, соблазнителя и
# беззаконников внутри неё — 『…』. Красного и синего нет.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (проверено по выгрузке).
# Сносок ⟨…⟩ нет: 預言者, 聖絶 уже в корпусе; новых неочевидных терминов нет.
# LXX: 13:5 без «и тому служите» (есть в csl); 13:8 продолжает прямую речь ст. 7;
# 13:9 ἐπιποθήσεις — «не пожалеешь» (слав. «не возлюбиши»).
# jp-ni не использовался.

tr_code: jp-box
book: vtor
chapter: 13
draft: true

verses:
  1: "「わたしが今日[きょう]あなたに命[めい]じるすべての言葉[ことば]は、これを守[まも]って行[おこな]いなさい。これに付[つ]け加[くわ]えてはならず、これから取[と]り除[のぞ]いてもならない。"
  2: "もしあなたの間[あいだ]に預言者[よげんしゃ]が、あるいは夢[ゆめ]を見[み]る者[もの]が起[お]こって、あなたにしるしや奇跡[きせき]を与[あた]え、"
  3: "そのしるしや奇跡[きせき]が、彼[かれ]があなたに『さあ、行[い]って、あなたがたが知[し]らないほかの神々[かみがみ]に仕[つか]えよう』と言[い]ったとおりに起[お]こるなら、"
  4: "あなたがたは、あの預言者[よげんしゃ]の言葉[ことば]、あるいはあの夢[ゆめ]を見る者[もの]の言葉を聞[き]いてはならない。あなたがたの神[かみ]である主[しゅ]が、あなたがたが心[こころ]を尽[つ]くし、魂[たましい]を尽くして、あなたがたの神である主を愛[あい]しているかどうかを知[し]るために、あなたがたを試[ため]しておられるからである。"
  5: "あなたがたの神[かみ]である主[しゅ]に従[したが]って歩[あゆ]み、主を恐[おそ]れ、主の戒[いまし]めを守[まも]り、主の声[こえ]を聞[き]き、主に寄[よ]り添[そ]いなさい。"
  6: "あの預言者[よげんしゃ]、あるいはあの夢[ゆめ]を見る者[もの]は死[し]ななければならない。彼は、あなたをエジプトの地[ち]から導[みちび]き出[だ]し、奴隷[どれい]の身[み]から贖[あがな]い出[だ]したあなたの神[かみ]である主[しゅ]から、あなたを迷[まよ]わせようと語[かた]ったからである。すなわち、あなたの神である主があなたに命[めい]じて歩[あゆ]むべき道[みち]から、あなたを追[お]い出[だ]そうとしたのである。あなたがたは自分[じぶん]たちの間[あいだ]から悪[わる]を取り除[のぞ]きなさい。"
  7: "もしあなたの父[ちち]を同じくする兄弟[きょうだい]、あるいは母[はは]を同じくする兄弟が、またあなたの息子[むすこ]や娘[むすめ]、あなたの胸[むね]に抱[だ]く妻[つま]、あなたの魂[たましい]に等[ひと]しい友[とも]が、密[ひそ]かにあなたを誘[さそ]って、『さあ、行[い]って、あなたもあなたの父祖[ふそ]たちも知[し]らなかったほかの神々[かみがみ]、すなわち、"
  8: "あなたがたの周[まわ]りにいる諸国民[しょこくみん]の神々[かみがみ]のうち、あなたに近[ちか]いものも、あなたから遠[とお]く離[はな]れたものも、地[ち]の果[は]てから地の果てに至[いた]るまでの神々に仕[つか]えよう』と言[い]うなら、"
  9: "あなたは彼[かれ]に同意[どうい]してはならず、彼の言[い]うことを聞[き]いてはならない。あなたの目[め]は彼を惜[お]しんではならず、彼をあわれんではならず、彼をかばってはならない。"
  10: "あなたは必[かなら]ず彼について告[つ]げ知[し]らせなければならない。あなたの手[て]が真[ま]っ先[さき]に彼の上[うえ]に下[くだ]って彼を殺[ころ]し、その後[あと]で民[たみ]全体[ぜんたい]の手が彼の上に下る。"
  11: "そして民[たみ]は彼を石[いし]で打[う]ち殺[ころ]す。彼は死[し]ぬ。彼が、あなたをエジプトの地[ち]から、奴隷[どれい]の家[いえ]から導[みちび]き出[だ]したあなたの神[かみ]である主[しゅ]から、あなたを引[ひ]き離[はな]そうとしたからである。"
  12: "そしてイスラエルはすべて、これを聞[き]いて恐[おそ]れ、あなたがたの間[あいだ]でこのような悪[わる]いことを、もはや行[おこな]わなくなる。"
  13: "もしあなたが、あなたの神[かみ]である主[しゅ]があなたに住[す]むために与[あた]える町[まち]の一[ひと]つについて、人々[ひとびと]が、あなたがたの間[あいだ]から不法[ふほう]な者[もの]たちが出[で]て、その町の住[す]む者[もの]すべてをそそのかし、"
  14: "『さあ、行[い]って、あなたがたが知[し]らなかったほかの神々[かみがみ]に仕[つか]えよう』と言[い]ったと、あなたに告[つ]げるのを聞[き]くなら、"
  15: "あなたはよく調[しら]べ、探[さぐ]り、詳[くわ]しく問[と]いただしなさい。そして、見[み]よ、その言葉[ことば]が真実[しんじつ]で明[あき]らかであり、あなたがたの間[あいだ]でこの忌[いま]むべきことが行[おこな]われたなら、"
  16: "あなたは必[かなら]ず、その町[まち]に住[す]む者[もの]すべてを剣[けん]の刃[は]にかけて滅[ほろ]ぼしなさい。その町と、その中[なか]にあるすべてのものを聖絶[せいぜつ]しなさい。"
  17: "また、その町のすべての分捕[ぶんど]り物[もの]を町の広場[ひろば]に集[あつ]め、民[たみ]全体[ぜんたい]で、あなたの神[かみ]である主[しゅ]の前[まえ]で、町とそのすべての分捕り物を火[ひ]で焼[や]き尽[つ]くしなさい。その町は永遠[えいえん]に住[す]む者[もの]のない所[ところ]となり、二度[にど]と建[た]て直[なお]されてはならない。"
  18: "聖絶[せいぜつ]したもののうち、何[なに]一つとしてあなたの手[て]に付[つ]いてはならない。それは、主[しゅ]がご自分[じぶん]の激[はげ]しい怒[いか]りを止[と]め、あなたに憐[あわ]れみを施[ほどこ]し、あなたをあわれんで、あなたの父祖[ふそ]たちに誓[ちか]われたとおりに、あなたを増[ふ]やしてくださるためである。"
  19: "あなたが、あなたの神[かみ]である主[しゅ]の声[こえ]を聞[き]き、今日[きょう]、わたしがあなたに命[めい]じるすべての戒[いまし]めを守[まも]って、あなたの神である主の前[まえ]に良[よ]いこと、喜[よろこ]ばれることを行[おこな]うなら。」"

notes:
  1: "Πᾶν ῥῆμα — всякое слово (ῥῆμα здесь «слово/дело»). ἐντέλλομαι — заповедую; φυλάξῃ ποιεῖν — соблюдать и исполнять. οὐ προσθήσεις… οὐδὲ ἀφελεῖς — не прибавишь и не убавишь. Нумерация: в gr-lxx-byz это ст. 1 гл. 13, а в csl-ru и ru он стоит как 12:32; дальше gr 13:2–19 = csl/ru 13:1–18. Держимся gr."
  2: "ἐνυπνιαζόμενος ἐνύπνιον — видящий сон, сновидец. σημεῖον ἢ τέρας — знамение или чудо (しるし、奇跡). ἐὰν ἀναστῇ — если восстанет, появится."
  3: "ἔλθῃ — придёт, сбудется. λέγων — говоря; прямая речь лжепророка внутри речи Моисея — 『…』. θεοῖς ἑτέροις — иным богам. οὓς οὐκ οἴδατε — которых вы не знали."
  4: "οὐκ ἀκούσεσθε — не послушаете. πειράζει — искушает, испытывает (πειράζω). εἰδέναι εἰ ἀγαπᾶτε — чтобы узнать, любите ли. ἐξ ὅλης τῆς καρδίας… τῆς ψυχῆς — от всего сердца и всей души."
  5: "ὀπίσω κυρίου πορεύεσθε — за Господом ходите. φοβηθήσεσθε — убоитесь. φυλάξεσθε — соблюдёте. τῆς φωνῆς ἀκούσεσθε — гласа послушаете. προστεθήσεσθε — приложитесь, прилепитесь. В csl добавлено «и тому служите», в gr этого нет — не внесено."
  6: "ἀποθανεῖται — умрёт (смерть по закону). ἐλάλησεν γὰρ πλανῆσαί σε — ибо говорил, чтобы совратить тебя. ἐξαγαγόντος… λυτρωσαμένου — выведшего… избавившего (причастия). ἐξῶσαί σε ἐκ τῆς ὁδοῦ — вытолкнуть тебя с пути. ἀφανιεῖς τὸν πονηρόν — истребишь зло."
  7: "παρακαλέσῃ — уговорит, склонит. ἐκ πατρός… ἢ ἐκ μητρός — от отца или от матери (единокровный или единоутробный); передано «父を同じくする兄弟、あるいは母を同じくする兄弟». ἡ γυνὴ ἡ ἐν κόλπῳ σου — жена на лоне твоём. φίλος ὁ ἴσος τῆς ψυχῆς σου — друг, равный душе твоей. λάθρᾳ — тайно. Прямая речь соблазнителя — 『…』 и продолжается в ст. 8."
  8: "ἀπὸ τῶν θεῶν τῶν ἐθνῶν — из богов народов. περικύκλῳ ὑμῶν — окружающих вас. τῶν ἐγγιζόντων σοι ἢ τῶν μακράν — близких тебе или далёких. ἀπ᾽ ἄκρου τῆς γῆς ἕως ἄκρου τῆς γῆς — от края земли до края земли. Продолжение речи соблазнителя; в японском «と言うなら» перенесено в конец ст. 8, чтобы цитата охватила оба стиха."
  9: "οὐ συνθελήσεις — не соизволишь, не согласишься. οὐκ εἰσακούσῃ — не послушаешь. οὐ φείσεται ὁ ὀφθαλμός σου — не пощадит глаз твой. ἐπιποθήσεις — не возжелаешь (в смысле «не пожалеешь»); слав. «не возлюбиши». οὐ μὴ σκεπάσῃς — не прикроешь, не утаишь."
  10: "ἀναγγέλλων ἀναγγελεῖς — возвещая, возвести (усиленный оборот). αἱ χεῖρές σου ἔσονται ἐπ᾽ αὐτόν — руки твои будут на нём. ἐν πρώτοις… ἐπ᾽ ἐσχάτῳ — первыми… в конце (последними)."
  11: "λιθοβολήσουσιν — побьют камнями (λιθοβολέω). ἐζήτησεν ἀποστῆσαί σε — искал отвратить тебя. ἐξ οἴκου δουλείας — из дома рабства (ср. Исх 20:2)."
  12: "πᾶς Ισραηλ ἀκούσας — весь Израиль, услышав. οὐ προσθήσουσιν ἔτι ποιῆσαι — не приложат более делать. τὸ ῥῆμα τὸ πονηρόν — злое слово/дело."
  13: "ἐν μιᾷ τῶν πόλεών σου — в одном из городов твоих. κατοικεῖν σε ἐκεῖ — жить тебе там. λεγόντων — говорящих (род. при ἀκούσῃς); их речь передана косвенно, внутри — прямая речь беззаконников 『…』 (третий уровень разметки не используется)."
  14: "Ἐξήλθοσαν ἄνδρες παράνομοι — вышли мужи беззаконные. ἀπέστησαν — отвратили, соблазнили (ἀφίστημι). θεοῖς ἑτέροις, οὓς οὐκ ᾔδειτε — иным богам, которых вы не знали. Прямая речь беззаконников — 『…』."
  15: "ἐρωτήσεις καὶ ἐραυνήσεις σφόδρα — спросишь и исследуешь усиленно. ἀληθὴς σαφῶς ὁ λόγος — слово истинно и ясно. βδέλυγμα — мерзость (忌むべきこと)."
  16: "ἀναιρῶν ἀνελεῖς — истребляя, истреби (усиление). ἐν φόνῳ μαχαίρας — избиением меча. ἀναθέματι ἀναθεματιεῖτε — заклятием заклянёте, предадите заклятию (聖絶; ср. Лев 27:28)."
  17: "τὰ σκῦλα — добыча, доспехи (分捕り物). εἰς τὰς διόδους — на перекрёстки, площади. ἐμπρήσεις — сожжёшь (ἐμπίπρημι). πανδημεὶ — всенародно, все вместе. ἀοίκητος εἰς τὸν αἰῶνα — необитаем навек. οὐκ ἀνοικοδομηθήσεται ἔτι — не будет восстановлен."
  18: "οὐ προσκολληθήσεται — не пристанет (προσκολλάω). ἀπὸ τοῦ ἀναθέματος — из заклятого. ἀποστραφῇ κύριος ἀπὸ θυμοῦ τῆς ὀργῆς — Господь отвратится от ярости гнева. δώσει σοι ἔλεος καὶ ἐλεήσει — даст милость и помилует. πληθυνεῖ — умножит. ὃν τρόπον ὤμοσεν τοῖς πατράσιν — как клялся отцам."
  19: "ἐὰν ἀκούσῃς τῆς φωνῆς — если послушаешь гласа. φυλάσσειν πάσας τὰς ἐντολάς — соблюдать все заповеди. ποιεῖν τὸ καλὸν καὶ τὸ ἀρεστόν — делать доброе и угодное. Придаточное без главного (как в csl/ru): зависит от благословений ст. 18, поэтому стих кончается на «なら。」."
