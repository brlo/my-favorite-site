verses:
  1: "イザヤ、すなわちアモスの子[こ]が見[み]た幻[まぼろし]。彼[かれ]がユダヤとエルサレムについて見たもの、すなわち、ウジヤ、ヨタム、アハズ、ヒゼキヤがユダヤを治[おさ]めた時代[じだい]のことであった。"
  2: "天[てん]よ、聞[き]け。地[ち]よ、耳[みみ]を傾[かたむ]けよ。主[しゅ]が語[かた]られたからである。「わたしは子[こ]らを産[う]み、育[そだ]てて高[たか]くした。しかし、彼[かれ]らはわたしに背[そむ]いた。"
  3: "牛[うし]は飼[か]い主[ぬし]を知[し]り、ろばは主人[しゅじん]の飼[か]い葉[ば]おけを知[し]っている。しかし、イスラエルはわたしを知[し]らず、わたしの民[たみ]も悟[さと]らない。"
  4: "ああ、罪[つみ]の民[たみ]、罪[つみ]に満[み]ちた民、悪[あく]の種[たね]、不法[ふほう]の子[こ]らよ。あなたがたは主[しゅ]を捨[す]て、イスラエルの聖[せい]なる方[かた]を怒[いか]らせ、うしろへ退[しりぞ]いた。"
  5: "あなたがたは、なぜさらに打[う]たれ続[つづ]けるのか。不法[ふほう]を重[かさ]ねるばかりである。頭[あたま]はすべて病[やまい]に、心[こころ]はすべて悲[かな]しみに。"
  6: "足[あし]の裏[うら]から頭[あたま]の頂[いただき]まで、健[すこ]やかな所[ところ]はない。打[う]ち傷[きず]、腫[は]れ物[もの]、焼[や]けるように膿[う]む傷[きず]があり、膏薬[こうやく]も、油[あぶら]も、包帯[ほうたい]も、当[あ]てるものが何[なに]もない。"
  7: "あなたがたの地[ち]は荒[あ]れ、あなたがたの都[みやこ]は火[ひ]で焼[や]かれた。あなたがたの国[くに]を、あなたがたの目[め]の前[まえ]で異邦人[いほうじん]たちが食[た]べている。それは、他[た]の民[たみ]たちによって覆[くつがえ]され、荒[あ]らされたままである。"
  8: "そして、シオンの娘[むすめ]は、ぶどう畑[ばたけ]の中[なか]の小屋[こや]のように、きゅうり畑[ばたけ]の中の見張[みは]り小屋[ごや]のように、包囲[ほうい]された都[みやこ]のように、取[と]り残[のこ]される。」"
  9: "もし万軍[ばんぐん]の主[しゅ]が、われわれに種[たね]を残[のこ]さなかったなら、われわれはソドムのようになり、ゴモラに似[に]た者[もの]となっていた。"
  10: "ソドムの君[きみ]たちよ、主[しゅ]の言葉[ことば]を聞[き]け。ゴモラの民[たみ]よ、神[かみ]の律法[りっぽう]に耳[みみ]を傾[かたむ]けよ。"
  11: "「あなたがたの多[おお]くの犠牲[ぎせい]は、わたしにとって何[なん]なのか、と主[しゅ]は言[い]われる。わたしは雄羊[おひつじ]の燔祭[はんさい]に満[み]ちている。子羊[こひつじ]の脂[あぶら]も、雄牛[おうし]や雄山羊[おやぎ]の血[ち]も、わたしは望[のぞ]まない。"
  12: "あなたがたが、わたしの前[まえ]に現[あらわ]れようとして来[く]るとき、だれがあなたがたの手[て]からこれを求[もと]めたのか。わたしの庭[にわ]を踏[ふ]むことを。"
  13: "あなたがたは、もう続[つづ]けてはならない。たとえ素祭[そさい]を持[も]って来[き]ても、むなしい。香[こう]はわたしにとって忌[い]まわしい。あなたがたの新月[しんげつ]と安息日[あんそくび]と大[おお]いなる日[ひ]を、わたしは我慢[がまん]できない。断食[だんじき]と休[やす]みも。"
  14: "あなたがたの新月[しんげつ]と祭[まつ]りを、わたしの魂[たましい]は憎[にく]む。あなたがたは、わたしにとって飽[あ]き飽[あ]きするものとなった。わたしはもう、あなたがたの罪[つみ]を我慢[がまん]しない。"
  15: "あなたがたが手[て]を伸[の]べるとき、わたしはあなたがたから目[め]を背[そむ]ける。あなたがたが祈[いの]りを多[おお]くしても、わたしは聞[き]かない。あなたがたの手は血[ち]に満[み]ちているからである。"
  16: "洗[あら]え。清[きよ]くなれ。あなたがたの悪[わる]い行[おこな]いを、わたしの目[め]の前[まえ]から取[と]り除[のぞ]け。悪[あく]を行[おこな]うことをやめよ。"
  17: "善[よ]いことを行[おこな]うことを学[まな]べ。裁[さば]きを求[もと]めよ。虐[しいた]げられている者[もの]を救[すく]え。孤児[みなしご]のために裁[さば]き、やもめを正[ただ]しいとせよ。"
  18: "さあ、来[こ]い。われわれは互[たが]いに論[ろん]じ合[あ]おう、と主[しゅ]は言[い]われる。たとえあなたがたの罪[つみ]が紫[むらさき]の布[ぬの]のようであっても、雪[ゆき]のように白[しろ]くしよう。たとえ緋[ひ]色[いろ]に染[そ]まっていても、羊毛[ようもう]のように白くしよう。"
  19: "もしあなたがたが喜[よろこ]んで聞[き]き従[したが]うなら、地[ち]の良[よ]いものを食[た]べる。"
  20: "しかし、もし喜[よろこ]ばず、聞[き]き従わないなら、剣[つるぎ]があなたがたを食[く]い尽[つ]くす。」主[しゅ]の口[くち]がこれを語[かた]ったからである。"
  21: "ああ、忠実[ちゅうじつ]であった都[みやこ]、シオンが、どのようにして遊女[ゆうじょ]となったのか。彼女[かのじょ]は裁[さば]きに満[み]ち、その中[なか]に義[ぎ]が宿[やど]っていた。しかし今[いま]は、人殺[ひとごろ]しである。"
  22: "あなたがたの銀[ぎん]は試[ため]しに耐[た]えない。あなたの酒[さけ]売[う]りたちは、ぶどう酒[ぶどうしゅ]を水[みず]で混[ま]ぜている。"
  23: "あなたの君[きみ]たちは背[そむ]き、盗人[ぬすびと]の仲間[なかま]である。彼[かれ]らは皆[みな]、贈[おく]り物[もの]を愛[あい]し、報[むく]いを追[お]い求[もと]める。彼らは孤児[みなしご]のために裁[さば]かず、やもめの裁[さば]きに耳[みみ]を傾[かたむ]けない。"
  24: "それゆえ、支配者[しはいしゃ]である主[しゅ]、万軍[ばんぐん]の主[しゅ]は、こう言[い]われる。「ああ、イスラエルの中[なか]の力[ちから]ある者[もの]たちよ。わたしの怒[いか]りは、敵対[てきたい]する者[もの]たちの上[うえ]で止[と]まらない。わたしは自分[じぶん]の敵[てき]に裁[さば]きを行[おこな]う。"
  25: "わたしはあなたの上[うえ]に手[て]を伸[の]べ、あなたを火[ひ]で溶[と]かして純粋[じゅんすい]にする。背[そむ]く者[もの]たちは滅[ほろ]ぼし、すべての不法[ふほう]な者[もの]をあなたから取[と]り除[のぞ]き、すべての高[たか]ぶる者[もの]を低[ひく]くする。"
  26: "そして、わたしはあなたの裁[さば]き手[て]たちを初[はじ]めのように、あなたの顧問[こもん]たちを初めの時[とき]のように立[た]てる。その後[のち]、あなたは義[ぎ]の都[みやこ]、諸[もろもろ]の都[みやこ]の母[はは]、忠実[ちゅうじつ]なシオンと呼[よ]ばれる。」"
  27: "まことに、その捕囚[ほしゅう]は裁[さば]きとともに、また施[ほどこ]しとともに救[すく]われる。"
  28: "しかし、不法[ふほう]な者[もの]たちと罪[つみ]ある者[もの]たちは共[とも]に打[う]ち砕[くだ]かれ、主[しゅ]を捨[す]てた者[もの]たちは滅[ほろ]ぼされる。"
  29: "彼[かれ]らは、自分[じぶん]が選[えら]んだ偶像[ぐうぞう]によって恥[はじ]を受[う]け、自分が望[のぞ]んだ園[その]によって辱[はずかし]められる。"
  30: "彼[かれ]らは、葉[は]を落[お]としたテレビンの木[き]のように、水[みず]のない園[その]のようになる。"
  31: "そして、彼[かれ]らの力[ちから]は麻[あさ]くずのようになり、彼らの行[おこな]いは火花[ひばな]のようになる。不法[ふほう]な者[もの]と罪[つみ]ある者[もの]は共[とも]に焼[や]かれ、消[け]す者[もの]は誰[だれ]もいない。"

notes:
  1: "Ὅρασις, ἣν εἶδεν Ησαιας υἱὸς Αμως — «видение, которое увидел Исаия, сын Амосов»: ὅρασις — видение (幻). Слав. «видение, еже виде исаиа сын амосов»; повтор ἣν εἶδεν (дважды «которое видел») сохранён двумя оборотами, как в греч. κατὰ τῆς Ιουδαίας καὶ κατὰ Ιερουσαλημ — «об Иудее и об Иерусалиме». ἐν βασιλείᾳ — «в царствование»; οἳ ἐβασίλευσαν τῆς Ιουδαίας — «которые царствовали в Иудее» (слав. «иже царствоваша во иудеи»). Имя отца — アモス по корпусу (2 Пар 32:32 и др.); в брифе стоит «アモツ», но корпус держит アモス."
  2: "Формула «Слыши, небо, и внуши, земле» — вне кавычек, как вводная формула; с неё же начинается слово Господа, цитата открыта в конце стиха. υἱοὺς ἐγέννησα καὶ ὕψωσα — «сыновей родил и возвысил» (ἐγέννησα — родил; ὕψωσα — поднял, воспитал); слав. «сыны родих и возвысих». ἠθέτησαν — «отвергли, отступили» (ἀθετέω); слав. «отвергошася». Цитата идёт до конца 1:8."
  3: "ἔγνω βοῦς τὸν κτησάμενον — «вол знает приобретшего его» (κτάομαι — приобретать; слав. «стяжавшаго»); ὄνος τὴν φάτνην τοῦ κυρίου αὐτοῦ — «осёл ясли господина своего» (φάτνη — ясли, кормушка). Ισραηλ δέ με οὐκ ἔγνω — «Израиль же Меня не познал»; ὁ λαός με οὐ συνῆκεν — «народ Меня не уразумел» (συνίημι — понимать). Слав. при «людие» добавляет «мои» — в LXX μου нет, на смысл не влияет."
  4: "οὐαὶ ἔθνος ἁμαρτωλόν — «горе народ грешный»: восклицание без глагола, сохранено назывными членами. λαὸς πλήρης ἁμαρτιῶν — «народ, полный грехов» (πλήρης — полный). σπέρμα πονηρόν — «семя злое» (σπέρμα — семя, род); υἱοὶ ἄνομοι — «сыны беззаконные» (ἄνομος — беззаконный). ἐγκατελίπατε — 2-е л. мн. ч. «вы оставили»; παρωργίσατε τὸν ἅγιον τοῦ Ισραηλ — «разгневали Святого Израилева» (παροργίζω). Слав. добавляет в конце «отвратистеся вспять» («вы обратились назад») — этого нет в LXX; по паритету внесено в основной текст без скобок (うしろへ退いた)."
  5: "τί ἔτι πληγῆτε προστιθέντες ἀνομίαν — «что ещё будете поражены, прибавляя беззаконие?» (πλήσσω — поражать; προστίθημι — прибавлять); слав. «что еще уязвляетеся, прилагающе беззаконие?». πᾶσα κεφαλὴ εἰς πόνον καὶ πᾶσα καρδία εἰς λύπην — «всякая голова в боль, всякое сердце в печаль» (πόνος — боль; λύπη — печаль); слав. «в болезнь… в печаль». Бессоюзность и краткость двух членов сохранены."
  6: "ἀπὸ ποδῶν ἕως κεφαλῆς — «от ног до головы». τραῦμα, μώλωψ, πληγὴ φλεγμαίνουσα — «рана, рубец от удара, воспалённая язва» (φλεγμαίνω — пылать, воспаляться); слав. «струп, язва, рана палящаяся». οὐκ ἔστιν μάλαγμα ἐπιθεῖναι — «нет пластыря, чтобы наложить» (μάλαγμα — смягчающая припарка, пластырь); слав. «несть пластыря приложити». Слав. в начале добавляет «несть в нем целости» («нет в нём целого [места]») — нет в LXX, внесено в текст без скобок."
  7: "ἡ γῆ ὑμῶν ἔρημος — «земля ваша пуста» (ἔρημος — пустынный, опустевший). αἱ πόλεις ὑμῶν πυρίκαυστοι — «города ваши сожжены огнём» (πυρίκαυστος). τὴν χώραν ὑμῶν ἐνώπιον ὑμῶν ἀλλότριοι κατεσθίουσιν αὐτήν — «страну вашу пред вами чужие поедают её»: винитив и местоимение при нём сохранены, как в греч. ἠρήμωται κατεστραμμένη ὑπὸ λαῶν ἀλλοτρίων — «опустошена, разорённая чужими народами» (καταστρέφω — разрушать); слав. «низвращена от людий чуждих»."
  8: "ἐγκαταλειφθήσεται ἡ θυγάτηρ Σιων — «останется (будет оставлена) дочь Сиона»; слав. «оставится дщерь сионя». ὡς σκηνὴ ἐν ἀμπελῶνι — «как шатёр в винограднике» (σκηνή — шатёр, куща). ὡς ὀπωροφυλάκιον ἐν σικυηράτῳ — «как сторожка в огуречном [огороде]» (ὀπωροφυλάκιον — сторожка для плодов; σικυήρατον — бахча, огуречный огород); слав. «яко овощное хранилище в вертограде». ὡς πόλις πολιορκουμένη — «как город осаждаемый» (πολιορκέω — осаждать)."
  9: "εἰ μὴ κύριος σαβαωθ ἐγκατέλιπεν ἡμῖν σπέρμα — «если бы Господь Саваоф не оставил нам семени» (σπέρμα — семя, т. е. остаток). ὡς Σοδομα ἂν ἐγενήθημεν — «как Содом мы стали бы» (ἄν с аористом — нереальное условие); ὡς Γομορρα ἂν ὡμοιώθημεν — «Гоморре уподобились бы» (ὁμοιόω). Здесь речь пророка от лица народа: 1-е л. мн. ч., Господь в 3-м лице, поэтому цитата 1:2б–1:8 закрыта. ru (МТ) читает «небольшого остатка»."
  10: "Ἀκούσατε λόγον κυρίου, ἄρχοντες Σοδομων — «услышьте слово Господне, князья Содомские»; προσέχετε νόμον θεοῦ, λαὸς Γομορρας — «внемлите закону Божию, народ Гоморрский»: обращение пророка, вводная формула вне кавычек, слово Господа начинается в 1:11. Σοδομα и Γομορρα — условные имена для Иуды и Иерусалима (ср. 1:9). В LXX при θεοῦ нет ἡμῶν; слав. «Божию», ru (МТ) «Бога нашего»."
  11: "τί μοι πλῆθος τῶν θυσιῶν ὑμῶν; λέγει κύριος — «что Мне множество жертв ваших? говорит Господь» (θυσία — жертва, 犠牲); формула стоит внутри речи и оставлена в кавычках, чтобы не разрывать одно слово Господа. πλῆρης εἰμὶ ὁλοκαυτωμάτων κριῶν — «исполнен всесожжений овнов» (ὁλοκαύτωμα — всесожжение, 燔祭; κριός — овен). στέαρ ἀρνῶν — «тук агнцев» (στέαρ — жир, тук); αἷμα ταύρων καὶ τράγων οὐ βούλομαι — «крови тельцов и козлов не хочу» (βούλομαι — желать, хотеть)."
  12: "οὐδ᾽ ἐὰν ἔρχησθε ὀφθῆναί μοι — «даже если приходите явиться Мне» (ὀφθῆναι — быть увиденным, предстать). τίς γὰρ ἐξεζήτησεν ταῦτα ἐκ τῶν χειρῶν ὑμῶν; — «ибо кто взыскал это из рук ваших?» (ἐκζητέω — взыскивать, требовать). πατεῖν τὴν αὐλήν μου — «топтать двор Мой» (αὐλή — двор): по gr этот инфинитив закрывает 1:12, а οὐ προσθήσεσθε («не продолжайте») открывает 1:13; слав. соединяет иначе («ходити по двору моему не приложите»). Деление держим по gr, смысл един."
  13: "οὐ προσθήσεσθε — «не продолжайте [приходить]» (προστίθημι, здесь в значении «прибавлять, продолжать»). ἐὰν φέρητε σεμίδαλιν, μάταιον — «если приносите семидал — тщетно» (σεμίδαλις — лучшая пшеничная мука, хлебный дар; слав. «семидал», 素祭). θυμίαμα βδέλυγμά μοί ἐστιν — «курение — мерзость Мне» (θυμίαμα — фимиам, 香; βδέλυγμα — мерзость). τὰς νουμηνίας ὑμῶν καὶ τὰ σάββατα καὶ ἡμέραν μεγάλην οὐκ ἀνέχομαι — «новомесячий, суббот и дня великого не терплю» (νουμηνία — новомесячие, 新月; οὐκ ἀνέχομαι — не выношу). νηστείαν καὶ ἀργίαν — «пост и праздность» (ἀργία — бездействие, покой) стоят в конце gr 1:13; в слав. они отнесены к 1:14 — держим gr."
  14: "τὰς νουμηνίας ὑμῶν καὶ τὰς ἑορτὰς ὑμῶν μισεῖ ἡ ψυχή μου — «новомесячий ваших и праздников ваших ненавидит душа Моя» (ἑορτή — праздник, 祭り); повтор «новомесячий» после 1:13 есть в греч. и не сглажен. ἐγενήθητέ μοι εἰς πλησμονήν — «вы стали Мне в пресыщение» (πλησμονή — пресыщение, насыщение; слав. «в сытость»). οὐκέτι ἀνήσω τὰς ἁμαρτίας ὑμῶν — «уже не отпущу грехов ваших» (ἀνίημι — отпускать, прощать); слав. «ктому не стерплю грехов ваших» — иное понимание того же глагола, в тексте по смыслу csl (我慢しない)."
  15: "ὅταν τὰς χεῖρας ἐκτείνητε πρός με — «когда протянете ко Мне руки» (ἐκτείνω); слав. «(вашя)» — в LXX без ὑμῶν, но по смыслу «ваши», внесено без скобок. ἀποστρέψω τοὺς ὀφθαλμούς μου ἀφ᾽ ὑμῶν — «отвращу очи Мои от вас». ἐὰν πληθύνητε τὴν δέησιν — «если умножите моление» (δέησις — прошение, молитва); οὐκ εἰσακούσομαι ὑμῶν — «не услышу вас». αἱ γὰρ χεῖρες ὑμῶν αἵματος πλήρεις — «ибо руки ваши полны крови»."
  16: "λούσασθε, καθαροὶ γένεσθε — «омойтесь, чистыми станьте» (λούω — мыть; καθαρός — чистый); слав. «измыйтеся, (и) чисти будите», скобки слав. — по LXX. ἀφέλετε τὰς πονηρίας ἀπὸ τῶν ψυχῶν ὑμῶν — «удалите злобы от душ ваших» (ἀφαιρέω — отнимать; πονηρία — злоба); ἀπέναντι τῶν ὀφθαλμῶν μου — «пред очами Моими». παύσασθε ἀπὸ τῶν πονηριῶν ὑμῶν — «перестаньте от злоб ваших» (παύω — прекращать)."
  17: "μάθετε καλὸν ποιεῖν — «научитесь добро творить» (μανθάνω). ἐκζητήσατε κρίσιν — «взыщите суд» (κρίσις — суд, 裁き). ῥύσασθε ἀδικούμενον — «избавьте обижаемого» (ῥύομαι — спасать, избавлять; ἀδικέω — обижать); слав. «избавите обидимаго». κρίνατε ὀρφανῷ καὶ δικαιώσατε χῆραν — «судите сироте и оправдайте вдову»: дательный при κρίνω означает «в пользу кого» (слав. «судите сиру и оправдите вдовицу»)."
  18: "καὶ δεῦτε καὶ διελεγχθῶμεν — «придите, и рассудимся» (διελέγχω — разбирать, обличать; слав. «истяжимся»). ἐὰν ὦσιν αἱ ἁμαρτίαι ὑμῶν ὡς φοινικοῦν, ὡς χιόνα λευκανῶ — «если будут грехи ваши как багряное, как снег убелю» (φοινικοῦν — пурпурно-красное, багряное; λευκαίνω — белить); ἐὰν δὲ ὦσιν ὡς κόκκινον, ὡς ἔριον λευκανῶ — «если же будут как червлёное, как шерсть убелю» (κόκκινον — алое; ἔριον — шерсть). Двойное сравнение и одинаковый глагол сохранены."
  19: "καὶ ἐὰν θέλητε καὶ εἰσακούσητέ μου — «если захотите и послушаете Меня» (εἰσακούω — слушать, внимать). τὰ ἀγαθὰ τῆς γῆς φάγεσθε — «блага земли снесте» (τὰ ἀγαθά — блага, доброе); слав. «благая земли снесте». Условие и обетование соединены так же кратко, как в греч."
  20: "ἐὰν δὲ μὴ θέλητε μηδὲ εἰσακούσητέ μου — «если же не захотите и не послушаете Меня». μάχαιρα ὑμᾶς κατέδεται — «меч вас поест» (κατεσθίω — съедать); слав. «мечь вы пояст». τὸ γὰρ στόμα κυρίου ἐλάλησεν ταῦτα — «ибо уста Господни изрекли это»: заключительная формула вынесена из кавычек, ею закрывается слово Господа 1:11–20."
  21: "Πῶς ἐγένετο πόρνη πόλις πιστὴ Σιων — «как стала блудницей верная столица Сион?» (πόρνη — блудница; πιστός — верный). πλῆρης κρίσεως — «полная суда» (слав. «полн суда»). ἐν ᾗ δικαιοσύνη ἐκοιμήθη ἐν αὐτῇ — «в котором правда почивала» (κοιμάομαι — спать, почивать); двойное ἐν ᾗ … ἐν αὐτῇ сохранено. νῦν δὲ φονευταί — «ныне же убийцы» (φονεύς); слав. «(в нем) убийцы»."
  22: "τὸ ἀργύριον ὑμῶν ἀδόκιμον — «серебро ваше негодно» (ἀδόκιμος — не прошедшее испытания; слав. «неискушено»). οἱ κάπηλοί σου μίσγουσι τὸν οἶνον ὕδατι — «торговцы твои мешают вино водою» (κάπηλος — корчемник, виноторговец; μίσγνυμι — смешивать; слав. «корчемницы твои мешают вино с водою»). Речь о разбавлении вина водой — знак порчи; в тексте 酒売り."
  23: "οἱ ἄρχοντές σου ἀπειθοῦσιν — «князья твои непокорны» (ἀπειθέω). κοινωνοὶ κλεπτῶν — «сообщники воров» (κοινωνός — участник, сообщник). ἀγαπῶντες δῶρα, διώκοντες ἀνταπόδομα — «любящие дары, гоняющиеся за воздаянием» (ἀνταπόδομα — воздаяние, здесь мзда); слав. «гоняще воздаяние». ὀρφανοῖς οὐ κρίνοντες — «сиротам не судящие» (дательный «в пользу сироты»); κρίσιν χηρῶν οὐ προσέχοντες — «и суда вдов не внимающие» (προσέχω — внимать)."
  24: "διὰ τοῦτο τάδε λέγει ὁ δεσπότης κύριος σαβαωθ — «посему так говорит Владыка Господь Саваоф» (δεσπότης — владыка, 支配者); формула вне кавычек. Οὐαὶ οἱ ἰσχύοντες Ισραηλ — «горе сильным Израиля (в Израиле)»: у LXX и слав. («горе крепким во израили») это обращение к сильным, у ru (МТ) — титул Бога «Сильный Израилев»; держим LXX/csl. οὐ παύσεται γάρ μου ὁ θυμὸς ἐν τοῖς ὑπεναντίοις — «ибо не успокоится гнев Мой на противниках» (θυμός — гнев; ὑπεναντίος — противник); κρίσιν ἐκ τῶν ἐχθρῶν μου ποιήσω — «суд над врагами Моими совершу». Здесь открывается второе слово Господа (1:24б–1:26)."
  25: "ἐπάξω τὴν χεῖρά μου ἐπὶ σὲ — «наведу руку Мою на тебя» (ἐπάγω — наводить). πυρώσω σε εἰς καθαρόν — «расплавлю тебя в чистое» (πυρόω — жечь, плавить, очищать огнём); слав. «разжегу в чистоту»; ru (МТ) «как в щелочи очищу» — иное чтение, не внесено. τοὺς δὲ ἀπειθοῦντας ἀπολέσω — «непокорных же погублю»; ἀφελῶ πάντας ἀνόμους ἀπὸ σοῦ — «удалю всех беззаконных от тебя»; πάντας ὑπερηφάνους ταπεινώσω — «всех гордых смирю» (ὑπερήφανος — гордый)."
  26: "ἐπιστήσω τοὺς κριτάς σου ὡς τὸ πρότερον — «поставлю судей твоих, как прежде» (ἐφίστημι — ставить, назначать); τοὺς συμβούλους σου ὡς τὸ ἀπ᾽ ἀρχῆς — «и советников твоих, как от начала». κληθήσῃ Πόλις δικαιοσύνης — «наречёшься город правды» (слав. «град правды»); μητρόπολις πιστὴ Σιων — «столица верная Сион» (μητρόπολις — мать городов, метрополия; слав. «мати градовом, верный сион»). Второе слово Господа закрывается в конце стиха."
  27: "μετὰ γὰρ κρίματος σωθήσεται ἡ αἰχμαλωσία αὐτῆς — «ибо с судом спасётся пленение её» (αἰχμαλωσία — пленение, плен; σῴζω — спасать); слав. «пленение его» — местоимение иного рода, в тексте «その」. καὶ μετὰ ἐλεημοσύνης — «и с милостыней» (ἐλεημοσύνη — милостыня, милость; слав. «с милостынею»): второе дополнение без глагола, как в греч. У ru (МТ) иначе: «Сион спасётся правосудием, и обратившиеся сыны его — правдою»."
  28: "καὶ συντριβήσονται οἱ ἄνομοι καὶ οἱ ἁμαρτωλοὶ ἅμα — «и сокрушатся беззаконные и грешные вместе» (συντρίβω — сокрушать; ἅμα — вместе); слав. «сокрушатся… вкупе». οἱ ἐγκαταλείποντες τὸν κύριον συντελεσθήσονται — «оставляющие Господа скончаются» (συντελέω — завершать, истреблять); слав. «скончаются». Повтор «беззаконные и грешные» из 1:31 охватывает главу рамкой."
  29: "αἰσχυνθήσονται ἐπὶ τοῖς εἰδώλοις αὐτῶν, ἃ αὐτοὶ ἠβούλοντο — «постыдятся об идолах своих, которых сами возжелали» (εἴδωλον — идол, 偶像; βούλομαι — желать, избирать). ἐπῃσχύνθησαν ἐπὶ τοῖς κήποις αὐτῶν, ἃ ἐπεθύμησαν — «посрамятся о садах своих, которых возжелали» (κῆπος — сад; вероятно, сады при идольских капищах; ἐπιθυμέω — желать). Аорист ἐπῃσχύνθησαν при будущем сохранён как в греч.; в тексте оба глагола переданы настоящим-будущим."
  30: "ἔσονται γὰρ ὡς τερέβινθος ἀποβεβληκυῖα τὰ φύλλα — «будут как теревинф, сбросивший листья» (τερέβινθος — теревинф, テレビンの木; ἀποβάλλω — сбрасывать); слав. «яко теревинф отметнувый листвия». ὡς παράδεισος ὕδωρ μὴ ἔχων — «как сад, воды не имеющий» (παράδεισος — сад, парк; слав. «вертоград не имый воды»)."
  31: "καὶ ἔσται ἡ ἰσχὺς αὐτῶν ὡς καλάμη στιππύου — «и будет сила их как пакля» (καλάμη — стебель, солома; στιππύον — пакля, очёски льна; слав. «яко стебль изгребия»); в тексте 麻くず. αἱ ἐργασίαι αὐτῶν ὡς σπινθῆρες πυρός — «дела их как искры огня» (σπινθήρ — искра; ἐργασία — дело, занятие); κατακαυθήσονται — «сгорят»; οὐκ ἔσται ὁ σβέσων — «не будет гасящего» (σβέννυμι — гасить)."
