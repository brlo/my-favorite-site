# jp-box, Исаия, глава 1. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для главы есть (выгружен), сверен для порядка членов и церковных
# чтений, в текст не копировался; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 1: 1 надписание; 2б–8 слово Господа к небу и земле, обличение сыновей,
# язвы и запустение; 9–10 голос пророка: остаток и призыв слушать; 11–20 второе
# слово Господа — суд над богослужением и призыв к правде; 21–23 верный город стал
# блудницей; 24–26 суд, очищение и восстановление судей; 27–31 погибель отступников,
# сады и теревинф.
# Голоса: 1:2б–1:8 — 「…」 (слово Господа, закрывается в конце 1:8); 1:9–10 — пророк
# от лица народа, без кавычек; 1:11–1:20 — 「…」 (второе слово Господа; «と主は
# 言われる» в 1:11 внутри речи, 1:18 тоже); 1:20б — заключительная формула вне
# кавычек; 1:21–23 и 1:27–31 — авторский текст без кавычек; 1:24б–1:26 — 「…」
# (третье слово Господа). Вводные формулы («天よ、聞け», «主の言葉を聞け», «主は
# こう言われる», «主の口がこれを語った») — вне кавычек.
# Нумерация по gr: 31 стих, совпадает с csl и ru. Слав. делит внутри главы иначе:
# конец gr 1:12 («πατεῖν τὴν αὐλήν μου») у слав. — конец 1:12 с «не приложите»,
# а «νηστείαν καὶ ἀργίαν» (конец gr 1:13) у слав. отнесено к 1:14. Держим gr, карта
# в notes к 1:12–14.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz. Слав. добавления внесены в основной
# текст без скобок и оговорены: 1:4 «отвратистеся вспять», 1:6 «несть в нем целости»
# (в обоих случаях «нет в LXX»). Слав. «(вашя)» в 1:15 и «(и)» в 1:16 — по LXX.
# Сносок ⟨…⟩ нет: 燔祭, 素祭, 香, 新月, 安息日, テレビンの木, 膏薬 уже в корпусе.
# Имена — транслитерация греческого (LXX): イザヤ, アモス (по корпусу, ср. 2 Пар
# 32:32; в брифе ошибочно «アモツ»), ウジヤ, ヨタム, アハズ, ヒゼキヤ, ユダヤ, シオン.

