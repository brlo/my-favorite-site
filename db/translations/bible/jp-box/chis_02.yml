# jp-box, Числа, глава 2. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в этих главах нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 2: станы вокруг скинии (1–2), Иуда на востоке (3–9), Рувим на юге (10–16),
# левиты в середине (17), Ефрем «к морю» (18–24), Дан на севере (25–31),
# итог 603 550 (32), левиты не исчислены (33), исполнение (34).
# Речь Бога — 「…」 (2–31); красного нет.
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено по базе, bracket_check.rb).
# Сносок ⟨…⟩ нет: 宿営, 旗, 隊, レビ人 уже в корпусе или пояснены в гл. 1.
# τάγμα — 隊 (отряд, строй); σημεῖα — 旗 (знамёна); παρεμβολή — 宿営.
# παρὰ θάλασσαν (2:18) — «к морю», т. е. запад (в LXX вместо «запада»); в тексте оставлено
# «海の方» — так у LXX и слав. Числа станов — по LXX; итоги совпадают с гл. 1.
# jp-ni не использовался.

tr_code: jp-box
book: chis
chapter: 2
draft: true

verses:
  1: "主[しゅ]はモーセとアロンに語[かた]って言[い]われた。"
  2: "「イスラエルの子[こ]らは、おのおの自分[じぶん]の隊[たい]に従[したが]って、自分の父[ちち]の家[いえ]の旗[はた]に従って宿営[しゅくえい]しなさい。証[あかし]の幕屋[まくや]を取[と]り囲[かこ]むように、その周[まわ]りに宿営しなさい。"
  3: "東[ひがし]に向[む]かって、まず宿営[しゅくえい]する者[もの]はユダの宿営の隊[たい]で、その軍勢[ぐんせい]とともにいる。ユダの子[こ]らの長[かしら]はナアソン、アミナダブの子[こ]。"
  4: "その軍勢[ぐんせい]、すなわち数[かぞ]え上[あ]げられた者[もの]は、七万四千六百人[にん]である。"
  5: "その次[つぎ]に宿営[しゅくえい]する者[もの]はイッサカルの部族[ぶぞく]である。イッサカルの子[こ]らの長[かしら]はナタナエル、ソガルの子[こ]。"
  6: "その軍勢[ぐんせい]、数[かぞ]え上[あ]げられた者[もの]は、五万四千四百人[にん]である。"
  7: "その次[つぎ]に宿営[しゅくえい]する者[もの]はゼブルンの部族[ぶぞく]である。ゼブルンの子[こ]らの長[かしら]はエリアブ、ヘロンの子[こ]。"
  8: "その軍勢[ぐんせい]、数[かぞ]え上[あ]げられた者[もの]は、五万七千四百人[にん]である。"
  9: "ユダの宿営[しゅくえい]から数[かぞ]え上[あ]げられた者[もの]はすべて、その軍勢[ぐんせい]とともに十八万六千四百人[にん]である。彼[かれ]らはまず出発[しゅっぱつ]する。"
  10: "南[みなみ]に向[む]かうルベンの宿営[しゅくえい]の隊[たい]は、その軍勢[ぐんせい]とともにいる。ルベンの子[こ]らの長[かしら]はエリツル、セデウルの子[こ]。"
  11: "その軍勢[ぐんせい]、数[かぞ]え上[あ]げられた者[もの]は、四万六千五百人[にん]である。"
  12: "その次[つぎ]に宿営[しゅくえい]する者[もの]は、そのそばのシメオンの部族[ぶぞく]である。シメオンの子[こ]らの長[かしら]はサラミエル、スリサダイの子[こ]。"
  13: "その軍勢[ぐんせい]、数[かぞ]え上[あ]げられた者[もの]は、五万九千三百人[にん]である。"
  14: "その次[つぎ]に宿営[しゅくえい]する者[もの]は、そのそばのガドの部族[ぶぞく]である。ガドの子[こ]らの長[かしら]はエリサフ、レグエルの子[こ]。"
  15: "その軍勢[ぐんせい]、数[かぞ]え上[あ]げられた者[もの]は、四万五千六百五十人[にん]である。"
  16: "ルベンの宿営[しゅくえい]から数[かぞ]え上[あ]げられた者[もの]はすべて、その軍勢[ぐんせい]とともに十五万一千四百五十人[にん]である。彼[かれ]らは二番目[にばんめ]に出発[しゅっぱつ]する。"
  17: "証[あかし]の幕屋[まくや]とレビ人[びと]の宿営[しゅくえい]は、もろもろの宿営のただ中[なか]で運[はこ]ばれる。彼[かれ]らは宿営するときも、そのとおりに出発[しゅっぱつ]する。おのおの自分[じぶん]の場所[ばしょ]で、自分の隊[たい]に従[したが]って。"
  18: "エフライムの宿営[しゅくえい]の隊[たい]は、海[うみ]の方[ほう]に向[む]かって、その軍勢[ぐんせい]とともにいる。エフライムの子[こ]らの長[かしら]はエリシャマ、アミフドの子[こ]。"
  19: "その軍勢[ぐんせい]、すなわち数[かぞ]え上[あ]げられた者[もの]は、四万五百人[にん]である。"
  20: "その次[つぎ]に宿営[しゅくえい]する者[もの]はマナセの部族[ぶぞく]である。マナセの子[こ]らの長[かしら]はガマリエル、ペダツルの子[こ]。"
  21: "その軍勢[ぐんせい]、数[かぞ]え上[あ]げられた者[もの]は、三万二千二百人[にん]である。"
  22: "その次[つぎ]に宿営[しゅくえい]する者[もの]はベニヤミンの部族[ぶぞく]である。ベニヤミンの子[こ]らの長[かしら]はアビダン、ギデオニの子[こ]。"
  23: "その軍勢[ぐんせい]、数[かぞ]え上[あ]げられた者[もの]は、三万五千四百人[にん]である。"
  24: "エフライムの宿営[しゅくえい]から数[かぞ]え上[あ]げられた者[もの]はすべて、その軍勢[ぐんせい]とともに十万八千百人[にん]である。彼[かれ]らは三番目[さんばんめ]に出発[しゅっぱつ]する。"
  25: "北[きた]に向[む]かうダンの宿営[しゅくえい]の隊[たい]は、その軍勢[ぐんせい]とともにいる。ダンの子[こ]らの長[かしら]はアヒエゼル、アミシャダイの子[こ]。"
  26: "その軍勢[ぐんせい]、数[かぞ]え上[あ]げられた者[もの]は、六万二千七百人[にん]である。"
  27: "その次[つぎ]に宿営[しゅくえい]する者[もの]は、そのそばのアシェルの部族[ぶぞく]である。アシェルの子[こ]らの長[かしら]はパギエル、オフランの子[こ]。"
  28: "その軍勢[ぐんせい]、数[かぞ]え上[あ]げられた者[もの]は、四万一千五百人[にん]である。"
  29: "その次[つぎ]に宿営[しゅくえい]する者[もの]はナフタリの部族[ぶぞく]である。ナフタリの子[こ]らの長[かしら]はアヒラ、エナンの子[こ]。"
  30: "その軍勢[ぐんせい]、数[かぞ]え上[あ]げられた者[もの]は、五万三千四百人[にん]である。"
  31: "ダンの宿営[しゅくえい]から数[かぞ]え上[あ]げられた者[もの]はすべて、その軍勢[ぐんせい]とともに十五万七千六百人[にん]である。彼[かれ]らは最後[さいご]に、自分[じぶん]の隊[たい]に従[したが]って出発[しゅっぱつ]する。」"
  32: "これが、イスラエルの子[こ]らの、その父[ちち]の家[いえ]に従[したが]った数[かぞ]え上[あ]げである。宿営[しゅくえい]のすべての数え上げは、その軍勢[ぐんせい]とともに六十万三千五百五十人[にん]である。"
  33: "しかしレビ人[びと]は、主[しゅ]がモーセに命[めい]じられたとおりに、彼[かれ]らの中[なか]に数[かぞ]えられなかった。"
  34: "イスラエルの子[こ]らは、主[しゅ]がモーセに命[めい]じられたすべてを行[おこな]った。彼[かれ]らはそのとおりに、自分[じぶん]の隊[たい]に従[したが]って宿営[しゅくえい]し、そのとおりに、おのおの自分の氏族[しぞく]に従って、自分の父[ちち]の家[いえ]に従って出発[しゅっぱつ]した。"

notes:
  1: "ἐλάλησεν κύριος πρὸς Μωυσῆν καὶ Ααρων — здесь, в отличие от 1:1, Господь обращается к Моисею и Аарону вместе; λέγων — «говоря», отдельно не переводится."
  2: "Ἄνθρωπος ἐχόμενος αὐτοῦ — «человек подле себя», т. е. каждый при своём; κατὰ τάγμα — по строю/отряду (隊); κατὰ σημέας — по знамёнам (旗; σημεῖον — «знак»); κατ᾿ οἴκους πατριῶν — по домам отцов (父の家). ἐναντίοι κύκλῳ — напротив, вокруг (слав. «пред Господем» прибавляет «Господом» — в греч. этого нет)."
  3: "οἱ παρεμβάλλοντες πρῶτοι κατ᾿ ἀνατολάς — становящиеся первыми к востоку; τάγμα παρεμβολῆς Ιουδα — строй (отряд) стана Иудина; σὺν δυνάμει αὐτῶν — с силою их, т. е. со своим войском."
  4: "δύναμις αὐτοῦ οἱ ἐπεσκεμμένοι — сила его, исчисленные (ἐπεσκεμμένοι, perf. pass. от ἐπισκέπτομαι); τέσσαρες καὶ ἑβδομήκοντα χιλιάδες καὶ ἑξακόσιοι — 74 600, как в 1:25."
  5: "ἐχόμενοι φυλῆς Ισσαχαρ — «следующие за племенем Иссахара», т. е. рядом с ним; καὶ ὁ ἄρχων — и начальник."
  6: "τέσσαρες καὶ πεντήκοντα χιλιάδες καὶ τετρακόσιοι — 54 400 (1:27)."
  7: "ἐχόμενοι φυλῆς Ζαβουλων — подле племени Завулона; Ελιαβ υἱὸς Χαιλων — Елиав, сын Хелона."
  8: "ἑπτὰ καὶ πεντήκοντα χιλιάδες καὶ τετρακόσιοι — 57 400 (1:29)."
  9: "πάντες οἱ ἐπεσκεμμένοι ἐκ τῆς παρεμβολῆς Ιουδα — все исчисленные из стана Иудина; ἑκατὸν ὀγδοήκοντα χιλιάδες καὶ ἑξακισχίλιοι καὶ τετρακόσιοι — 186 400 (сумма 74 600 + 54 400 + 57 400). πρῶτοι ἐξαροῦσιν — первыми поднимутся (в путь)."
  10: "Τάγμα παρεμβολῆς Ρουβην πρὸς λίβα — строй стана Рувима к югу (λίψ — «юг, юго-запад»); слав. «к югу»."
  11: "ἓξ καὶ τεσσαράκοντα χιλιάδες καὶ πεντακόσιοι — 46 500 (1:21)."
  12: "ἐχόμενοι αὐτοῦ — подле него (т. е. рядом со станом Рувима); φυλῆς Συμεων — племя Симеона."
  13: "ἐννέα καὶ πεντήκοντα χιλιάδες καὶ τριακόσιοι — 59 300 (1:23)."
  14: "φυλῆς Γαδ — в LXX Гад идёт третьим в южном стане (в масоретском порядке он третий в переписи гл. 1); Ελισαφ υἱὸς Ραγουηλ — Елиасаф, сын Регуила; ἐχόμενοι αὐτοῦ — подле него (αὐτοῦ есть в греч. только в ст. 12, 14, 27)."
  15: "πέντε καὶ τεσσαράκοντα χιλιάδες καὶ ἑξακόσιοι καὶ πεντήκοντα — 45 650 (1:37)."
  16: "πάντες οἱ ἐπεσκεμμένοι τῆς παρεμβολῆς Ρουβην — все исчисленные стана Рувима; ἑκατὸν πεντήκοντα μία χιλιάδες καὶ τετρακόσιοι καὶ πεντήκοντα — 151 450 (46 500 + 59 300 + 45 650). δεύτεροι ἐξαροῦσιν — вторыми поднимутся."
  17: "ἀρθήσεται ἡ σκηνὴ τοῦ μαρτυρίου — будет поднята скиния свидетельства; ἡ παρεμβολὴ τῶν Λευιτῶν μέσον τῶν παρεμβολῶν — стан левитов посреди станов; ὡς καὶ παρεμβάλλουσιν, οὕτως καὶ ἐξαροῦσιν — как становятся, так и поднимутся; ἕκαστος ἐχόμενος καθ᾿ ἡγεμονίαν — каждый подле своего, по своему начальству (порядку)."
  18: "παρὰ θάλασσαν — «при море», т. е. на запад (Синодальный: «к западу»); в LXX и слав. буквально «к морю» — в тексте 海の方. Τάγμα παρεμβολῆς Εφραιμ — строй стана Ефрема."
  19: "τεσσαράκοντα χιλιάδες καὶ πεντακόσιοι — 40 500 (1:31)."
  20: "ἐχόμενοι φυλῆς Μανασση — подле племени Манассии; Γαμαλιηλ υἱὸς Φαδασσουρ — Гамалиил, сын Педацура."
  21: "δύο καὶ τριάκοντα χιλιάδες καὶ διακόσιοι — 32 200 (1:33)."
  22: "φυλῆς Βενιαμιν — племя Вениамина; Αβιδαν υἱὸς Γαδεωνι — Авидан, сын Гидеония."
  23: "πέντε καὶ τριάκοντα χιλιάδες καὶ τετρακόσιοι — 35 400 (1:35)."
  24: "πάντες οἱ ἐπεσκεμμένοι τῆς παρεμβολῆς Εφραιμ — все исчисленные стана Ефрема; ἑκατὸν χιλιάδες καὶ ὀκτακισχίλιοι καὶ ἑκατόν — 108 100 (40 500 + 32 200 + 35 400). τρίτοι ἐξαροῦσιν — третьими поднимутся."
  25: "Τάγμα παρεμβολῆς Δαν πρὸς βορρᾶν — строй стана Дана к северу."
  26: "δύο καὶ ἑξήκοντα χιλιάδες καὶ ἑπτακόσιοι — 62 700 (1:39)."
  27: "ἐχόμενοι αὐτοῦ φυλῆς Ασηρ — подле него племя Асира; Φαγαιηλ υἱὸς Εχραν — Пагиил, сын Охрана."
  28: "μία καὶ τεσσαράκοντα χιλιάδες καὶ πεντακόσιοι — 41 500 (1:41)."
  29: "φυλῆς Νεφθαλι — племя Неффалима; Αχιρε υἱὸς Αιναν — Ахира, сын Енана."
  30: "τρεῖς καὶ πεντήκοντα χιλιάδες καὶ τετρακόσιοι — 53 400 (1:43)."
  31: "πάντες οἱ ἐπεσκεμμένοι τῆς παρεμβολῆς Δαν — все исчисленные стана Дана; ἑκατὸν καὶ πεντήκοντα ἑπτὰ χιλιάδες καὶ ἑξακόσιοι — 157 600 (62 700 + 41 500 + 53 400). ἔσχατοι ἐξαροῦσιν κατὰ τάγμα αὐτῶν — последними поднимутся, по строю своему. Конец речи Бога."
  32: "Αὕτη ἡ ἐπίσκεψις τῶν υἱῶν Ισραηλ κατ᾿ οἴκους πατριῶν αὐτῶν — вот исчисление сынов Израиля по домам отцов их; πᾶσα ἡ ἐπίσκεψις τῶν παρεμβολῶν σὺν ταῖς δυνάμεσιν αὐτῶν — всё исчисление станов с силами их; ἑξακόσιαι χιλιάδες καὶ τρισχίλιοι πεντακόσιοι πεντήκοντα — 603 550 (ср. 1:46)."
  33: "οἱ δὲ Λευῖται οὐ συνεπεσκέπησαν ἐν αὐτοῖς — левиты не были сопричислены к ним (συνεπισκέπτομαι); καθὰ ἐνετείλατο κύριος τῷ Μωυσῇ — как заповедал Господь Моисею."
  34: "καὶ ἐποίησαν … πάντα, ὅσα συνέταξεν κύριος τῷ Μωυσῇ — сделали всё, что повелел Господь Моисею; οὕτως παρενέβαλον … καὶ οὕτως ἐξῆρον — так становились станом и так поднимались; ἕκαστος ἐχόμενοι κατὰ δήμους αὐτῶν κατ᾿ οἴκους πατριῶν αὐτῶν — каждый подле своих, по родам своим, по домам отцов своих."
