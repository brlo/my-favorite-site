# jp-box, Песнь Песней, глава 5. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 5: 16 стихов по gr. Возлюбленный входит в сад (1), ночное искание женщины
# и слова возлюбленного у двери (2–8), вопрос дочерей (9), описание возлюбленного
# (10–16). Поэзия: параллелизмы и повторы не сглажены; телесные образы (4, 14)
# переданы по-гречески, без эвфемизмов и без вульгарности.
# Голоса: 1 — возлюбленный; 2–8 — женщина (слова возлюбленного в 2 — 「…」);
# 9 — дочери Иерусалима; 10–16 — женщина. Женщина — без кавычек, прочие — 「…」.
# Нумерация по gr: наш 5:1 = csl 5:1b; начало csl 5:1 («Да снидет брат мой
# в виноградник свой») — это gr 4:16b, оно относится к главе 4.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz. Сносок ⟨…⟩ нет.
# Имена — транслитерация греческого (LXX).

