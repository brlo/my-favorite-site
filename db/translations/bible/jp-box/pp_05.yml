chapter: 5
draft: true

verses:
  1: "「わたしはわが園[その]に入[はい]った。わが姉妹[しまい]、わが花嫁[はなよめ]よ。わたしはわが没薬[もつやく]をわが香料[こうりょう]とともに摘[つ]み取[と]り、わがパンをわが蜜[みつ]とともに食[た]べ、わがぶどう酒[しゅ]をわが乳[ちち]とともに飲[の]んだ。食[た]べよ、近[ちか]き者[もの]たちよ。飲[の]め、そして酔[よ]うがよい、兄弟[きょうだい]たちよ。」"
  2: "わたしは眠[ねむ]っているが、わたしの心[こころ]は目[め]を覚[さ]ましている。わが愛[あい]する者[もの]の声[こえ]がする。戸[と]を叩[たた]いている。「わたしのために開[あ]けてくれ、わが姉妹、わが伴[とも]なる者[もの]、わが鳩[はと]、わが完全[かんぜん]な者[もの]よ。わたしの頭[あたま]は露[つゆ]に満[み]ち、わたしの髪[かみ]の房[ふさ]は夜[よる]の滴[しずく]に濡[ぬ]れているのだから。」"
  3: "わたしは衣[ころも]を脱[ぬ]いでしまった。どうしてまた着[き]られようか。わたしは足[あし]を洗[あら]ってしまった。どうして汚[けが]せようか。"
  4: "わが愛[あい]する者[もの]は穴[あな]から手[て]を差[さ]し入[い]れた。わたしの腹[はら]は彼[かれ]のゆえに騒[さわ]ぎ立[た]った。"
  5: "わたしはわが愛[あい]する者[もの]のために開[あ]けようと立[た]ち上[あ]がった。わたしの手[て]は没薬[もつやく]を滴[したた]らせ、わたしの指[ゆび]は錠前[じょうまえ]の取[と]っ手[て]の上[うえ]に満[み]ちた没薬を滴らせた。"
  6: "わたしはわが愛[あい]する者[もの]のために開[あ]けた。わが愛する者は過[す]ぎ去[さ]った。彼[かれ]の言葉[ことば]によって、わたしの魂[たましい]は出[で]て行[い]った。わたしは彼を求[もと]めたが見[み]つからず、彼を呼[よ]んだが答[こた]えなかった。"
  7: "都[みやこ]を巡[めぐ]る見張[みは]りたちがわたしを見[み]つけ、わたしを打[う]ち、わたしを傷[きず]つけた。城壁[じょうへき]の見張りたちは、わたしから上着[うわぎ]を取[と]り去[さ]った。"
  8: "エルサレムの娘[むすめ]たちよ、わたしはあなたがたに、野[の]の力[ちから]と野の強[つよ]さにかけて誓[ちか]わせる。あなたがたがわが愛[あい]する者[もの]を見つけたなら、彼に何[なに]を告[つ]げるのか。わたしは愛によって傷[きず]ついている、と。"
  9: "「あなたの愛[あい]する者[もの]は、ほかの愛する者と比[くら]べて何[なに]がまさっているのか、女[おんな]たちのうちで美[うつく]しい者[もの]よ。あなたの愛する者は、ほかの愛する者と比べて何がまさっているのか。あなたはなぜ、そのようにわたしたちに誓[ちか]わせたのか。」"
  10: "わが愛[あい]する者[もの]は白[しろ]く、また赤[あか]い。幾万[いくまん]もの中[なか]から選[えら]ばれた者[もの]である。"
  11: "その頭[あたま]は金[きん]、すなわち純金[じゅんきん]。その髪[かみ]の房[ふさ]は縮[ちぢ]れ、烏[からす]のように黒[くろ]い。"
  12: "その目[め]は水[みず]の満[み]ち溢[あふ]れる所[ところ]の鳩[はと]のようで、乳[ちち]の中[なか]で洗[あら]われ、水の満ち溢れる所に座[すわ]っている。"
  13: "その頬[ほお]は香料[こうりょう]の鉢[はち]のようで、香[かおり]を生[しょう]じさせている。その唇[くちびる]はゆりで、満[み]ちた没薬[もつやく]を滴[したた]らせている。"
  14: "その手[て]は金[きん]の刻[きざ]み物[もの]で、タルシスで満[み]たされている。その腹[はら]は象牙[ぞうげ]の細工[さいく]で、サファイアの石[いし]の上[うえ]にある。"
  15: "その腿[もも]は大理石[だいりせき]の柱[はしら]で、金[きん]の台座[だいざ]の上[うえ]に据[す]えられている。その姿[すがた]はレバノンのようで、杉[すぎ]のように選[えら]ばれている。"
  16: "その喉[のど]は甘[あま]いもの、その全[すべ]ては慕[した]わしさである。これがわが愛[あい]する者[もの]、これがわが伴[とも]なる者[もの]、エルサレムの娘[むすめ]たちよ。"

notes:
  1: "Говорит возлюбленный. Εἰσῆλθον — аорист 1 л. ед. ч., «я вошёл» (слав. 5:1b «Внидох»). ἀδελφή μου νύμφη — «сестра моя, невеста» (わが姉妹、わが花嫁). ἐτρύγησα — «сорвал, собрал» (τρυγάω, о сборе плодов); слав. здесь неясное слово, смысл дан по греческому. ἔφαγον ἄρτον μου μετὰ μέλιτός μου, ἔπιον οἶνόν μου μετὰ γάλακτός μου — «ел хлеб мой с мёдом моим, пил вино моё с молоком моим»: повтор μου (восемь раз, включая ἀδελφή μου) сохранён; わが花嫁 — принятая передача νύμφη по глоссарию. φάγετε, πλησίοι — «ешьте, ближние» (слав. «ближнии»); передано 近き者たち, чтобы сохранить связь с ἡ πλησίον μου («わが伴なる者»). ἀδελφοί — «братья», обращение к спутникам, в той же цитате."
  2: "Говорит женщина. Ἐγὼ καθεύδω, καὶ ἡ καρδία μου ἀγρυπνεῖ — «я сплю, а сердце моё бодрствует» (ἀγρυπνέω — не спать, бодрствовать). φωνὴ ἀδελφιδοῦ μου — «голос возлюбленного моего»: назывное предложение без сказуемого. κρούει ἐπὶ τὴν θύραν — «стучит в дверь». С Ἄνοιξόν μοι начинается прямая речь возлюбленного: она в 「…」 внутри речи женщины (сама женщина без кавычек). ἡ πλησίον μου — わが伴なる者 (букв. «ближняя моя»); περιστερά μου — わが鳩; τελεία μου — わが完全な者. ὅτι ἡ κεφαλή μου ἐπλήσθη δρόσου — «ибо голова моя наполнилась росою»; οἱ βόστρυχοί μου ψεκάδων νυκτός — «кудри мои — капель ночных» (ψεκάς — капля; родительный без предлога, слав. «власи мои капель нощных»)."
  3: "Говорит женщина. Ἐξεδυσάμην τὸν χιτῶνά μου — «я сняла хитон мой» (χιτών — нижняя одежда, 衣). πῶς ἐνδύσωμαι αὐτόν — «как надену его?» (ἐνδύω, аорист конъюнктива в риторическом вопросе). ἐνιψάμην τοὺς πόδας μου — «я вымыла ноги мои» (νίπτω); πῶς μολυνῶ αὐτούς — «как оскверню их?» (μολύνω — пачкать, осквернять). Оба вопроса сохранены без сглаживания."
  4: "Говорит женщина. ἀπέστειλεν χεῖρα αὐτοῦ ἀπὸ τῆς ὀπῆς — «протянул руку свою из отверстия» (ὀπή — отверстие, скважина; слав. «сквозе скважню»). ἡ κοιλία μου — 腹 (слав. «чрево»), как и в 5:14. ἐθροήθη ἐπ᾽ αὐτῷ — «пришла в смятение при нём» (θροέω — волновать, смущать; слав. «вострепета от него»): телесное движение передано без эвфемизма, но и без грубости."
  5: "Говорит женщина. ἀνέστην ἐγὼ ἀνοῖξαι — «я встала, чтобы открыть». ἔσταξαν — «капали» (στάζω). σμύρναν πλήρη — «мирру полную», т. е. полную меру. ἐπὶ χεῖρας τοῦ κλείθρου — «на ручки запора» (κλεῖθρον — запор, замок; слав. «на руках заключения»), т. е. на ручки замка или засова. Образ: руки в мирре, которой она умащалась."
  6: "Говорит женщина. ἀδελφιδός μου παρῆλθεν — «возлюбленный мой прошёл мимо». ψυχή μου ἐξῆλθεν ἐν λόγῳ αὐτοῦ — тёмное место: «душа моя вышла при слове его» (слав. «изыде в слово его»; Синодальный «души во мне не стало, когда он говорил»). Оставлено буквально, двусмысленность не разрешена. ἐζήτησα αὐτὸν καὶ οὐχ εὗρον — «искала его и не нашла»; ἐκάλεσα αὐτόν, καὶ οὐχ ὑπήκουσέν μου — «звала его, и он не отозвался» (ὑπακούω — слушаться, откликаться)."
  7: "Говорит женщина. οἱ φύλακες οἱ κυκλοῦντες ἐν τῇ πόλει — «стражи, обходящие город» (κυκλόω — обходить кругом). ἐπάταξάν με, ἐτραυμάτισάν με — «избили меня, изранили меня» (πατάσσω, τραυματίζω). ἦραν τὸ θέριστρόν μου ἀπ᾽ ἐμοῦ — «сняли с меня покрывало»: θέριστρον — летняя верхняя одежда, накидка (слав. «верхнюю ризу», Синодальный «покрывало»); φύλακες τῶν τειχέων — «стражи стен»."
  8: "Говорит женщина. ὥρκισα ὑμᾶς — «заклинаю вас» (ὁρκίζω — приводить к клятве). ἐν ταῖς δυνάμεσιν καὶ ἐν ταῖς ἰσχύσεσιν τοῦ ἀγροῦ — «силами и крепостями поля»: в еврейском тексте здесь «сернами и ланями полей», LXX переводит иначе; слав. «в силах и в крепостех селных», держимся LXX и слав. τετρωμένη ἀγάπης εἰμὶ ἐγώ — «изранена любовью я» (τιτρώσκω; родительный причины). Содержание того, что сказать возлюбленному, передано оборотом с と, без кавычек."
  9: "Говорят дочери Иерусалима; вся реплика — 「…」. ἀδελφιδός σου ἀπὸ ἀδελφιδοῦ — сравнительный оборот: «возлюбленный твой более иного возлюбленного», т. е. чем он превосходит других (слав. «что брат твой паче брата»); вопрос повторён дословно, повтор сохранён. ἡ καλὴ ἐν γυναιξίν — «прекрасная между жёнами» (слав. «добрая в женах»). ὅτι οὕτως ὥρκισας ἡμᾶς — «что так закляла ты нас» (ὥρκισας, аорист 2 л. ед. ч.)."
  10: "Говорит женщина. λευκὸς καὶ πυρρός — «белый и красный» (πυρρός — рыжий, красноватый; слав. «бел и чермен»). ἐκλελοχισμένος ἀπὸ μυριάδων — «выделенный из мириад» (ἐκλοχίζω — отбирать; слав. «избран от тем», тьма — десять тысяч): 幾万もの中から選ばれた."
  11: "Говорит женщина. κεφαλὴ αὐτοῦ χρυσίον καὶ φαζ — «голова его — золото и фаз»: φαζ — гапакс, передающий евр. פָּז «чистое золото»; слав. «злато избранно», поэтому 純金. βόστρυχοι αὐτοῦ ἐλάται — «кудри его — ели» (ἐλάτη — ель, сосна): LXX даёт этот образ, слав. читает «кудрявы», т. е. толкует его; по паритету в тексте церковное чтение (縮れ), вариант LXX отмечен. μέλανες ὡς κόραξ — «чёрные, как ворон»."
  12: "Говорит женщина. ὀφθαλμοὶ αὐτοῦ ὡς περιστεραί — «глаза его, как голуби». ἐπὶ πληρώματα ὑδάτων — «при полноте вод» (πλήρωμα — полнота, наполненное вместилище); оборот стоит в стихе дважды, повтор сохранён. λελουσμέναι ἐν γάλακτι — «омытые в молоке» (λούω). καθῆμεναι — «сидящие» (κάθημαι)."
  13: "Говорит женщина. σιαγόνες αὐτοῦ ὡς φιάλαι τοῦ ἀρώματος — «щёки его, как чаши благовония» (φιάλη — чаша, фиал). φύουσαι μυρεψικά — «производящие благовония» (φύω — растить, производить; μυρεψικός — от μυρεψός, составитель мазей); слав. «прозябающыя благовоние». χείλη αὐτοῦ κρίνα — «губы его — лилии»; στάζοντα σμύρναν πλήρη — «капающие миррой полной»."
  14: "Говорит женщина. χεῖρες αὐτοῦ τορευταί — «руки его точёные» (τορεύω — вырезывать, точить); χρυσαῖ πεπληρωμέναι θαρσις — «золотые, наполненные фарсисом»: θαρσις (Фарсис) — вероятно, название драгоценного камня (хризолит, берилл), слав. транслитерирует «фарсиса»; оставлено транслитерацией タルシス, без домысла. κοιλία αὐτοῦ πυξίον ἐλεφάντινον — «живот его — изделие из слоновой кости» (πυξίον — коробочка, точёное изделие); ἐπὶ λίθου σαπφείρου — «на камне сапфире»."
  15: "Говорит женщина. κνῆμαι — 腿, голени; στῦλοι μαρμάρινοι — «мраморные столпы»; τεθεμελιωμένοι ἐπὶ βάσεις χρυσᾶς — «утверждённые на основаниях золотых» (θεμελιόω; βάσις — основание, подножие; слав. «на степенех златых»). εἶδος αὐτοῦ ὡς Λίβανος — «вид его, как Ливан»; ἐκλεκτὸς ὡς κέδροι — «избранный, как кедры» (слав. «избран яко кедрове»)."
  16: "Говорит женщина, обращаясь к дочерям Иерусалима. φάρυγξ — «гортань, нёбо» (слав. «гортань», Синодальный «уста»); γλυκασμοί — «сладости» (мн. ч.); ὅλος ἐπιθυμία — «весь он — желание», т. е. вожделенный (слав. «весь желание»): именное предложение без глагола сохранено. οὗτος ἀδελφιδός μου, καὶ οὗτος πλησίον μου — «вот возлюбленный мой, и вот ближний мой»: повтор οὗτος передан これが…これが."
