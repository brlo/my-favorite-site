# jp-box, Евангелие от Матфея, глава 17. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, «ru», jp-joc).
# Греческий сайта (критический) — свидетель; расхождения с ним — в 〔…〕.
# Преображение (1–13), исцеление бесноватого (14–21), налог на храм (22–27).
# Красным только слова Христа; речь Петра, отца и голос Отца — не красная.

