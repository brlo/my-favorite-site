verses:
  1: "六日[むいか]の後[のち]、イエスはペトロ、ヤコブ、その兄弟[きょうだい]ヨハネだけを伴[ともな]い、人目[ひとめ]を離[はな]れた高[たか]い山[やま]に登[のぼ]られた。"
  2: "そして、彼[かれ]らの前[まえ]で姿[すがた]を変[か]えられた。顔[かお]は太陽[たいよう]のように輝[かがや]き、衣[ころも]は光[ひかり]のように白[しろ]くなった。"
  3: "すると、モーセとエリヤが弟子[でし]たちの前[まえ]に姿[すがた]を現[あらわ]し、イエスと語[かた]り合[あ]っていた。"
  4: "そこで、ペトロは言[い]った。「主[しゅ]よ、ここにいるのはよいことです。お望[み]とあらば、仮小屋[かりごや]を三[みっ]つ、ここに建[た]てさせてください。あなたのために一[ひと]つ、モーセのために一[ひと]つ、エリヤのために一[ひと]つ。」"
  5: "まだペトロが話[はな]しているうちに、光[ひか]る雲[くも]が彼[かれ]らを覆[おお]い、雲[くも]の中[なか]から声[こえ]がして言[い]った。「これはわたしの愛[あい]する子[こ]。わたしの心[こころ]にかなう者[もの]。これに聞[き]け。」"
  6: "弟子[でし]たちはこれを聞[き]いて、顔[かお]を地[ち]につけてひれ伏[ふ]し、ひどく恐[おそ]れた。"
  7: "イエスは近[ちか]づいて彼[かれ]らに触[ふ]れ、「<j>起[お]きなさい。恐[おそ]れることはない。</j>」と言[い]われた。"
  8: "彼[かれ]らが目[め]を上[あ]げたとき、そこに見[み]えたのはイエスだけであった。"
  9: "彼[かれ]らが山[やま]を下[くだ]りかけたとき、イエスは、「<j>人[ひと]の子[こ]が死者[ししゃ]の中[なか]から復活[ふっかつ]するまでは、この幻[まぼろし]をだれにも語[かた]ってはならない</j>」と戒[いまし]められた。"
  10: "弟子[でし]たちはイエスに尋[たず]ねた。「それでは、なぜ律法学者[りっぽうがくしゃ]たちは、まずエリヤが来[く]るべきだと言[い]っているのですか。」"
  11: "イエスはお答[こた]えになった。「<j>エリヤがまず来[き]て、すべてを元[もと]どおりに整[ととの]えるのは確[たし]かである。</j>"
  12: "<j>しかし、あなたがたに言[い]っておく。エリヤはすでに来[き]たが、人々[ひとびと]は彼[かれ]を認[みと]めず、好[す]きなようにあしらった。同[おな]じように、人[ひと]の子[こ]も彼[かれ]らから苦[くる]しみを受[う]けることになっている。</j>」"
  13: "そこで、弟子[でし]たちは、イエスが話[はな]されたのは洗礼者[せんれいしゃ]ヨハネのことだと悟[さと]った。"
  14: "彼[かれ]らが群衆[ぐんしゅう]のところへ来[く]ると、一人[ひとり]の男[おとこ]がイエスのもとに近[ちか]づいて来[き]て、ひざまずき、"
  15: "言[い]った。「主[しゅ]よ、息子[むすこ]を憐[あわ]れんでください。てんかんの発作[ほっさ]にひどく苦[くる]しんでおり、何度[なんど]も火[ひ]の中[なか]や水[みず]の中[なか]へ転[ころ]げ込[こ]むのです。"
  16: "その子[こ]をお弟子[でし]たちのところへ連[つ]れて参[まい]りましたが、癒[いや]すことができませんでした。」"
  17: "イエスはお答[こた]えになった。「<j>ああ、信仰[しんこう]がなく、心[こころ]の曲[ま]がった時代[じだい]よ。いつまでわたしはあなたがたと一緒[いっしょ]にいるのだろう。いつまであなたがたを忍耐[にんたい]しなければならないのか。その子[こ]をわたしのところへ連[つ]れて来[き]なさい。</j>」"
  18: "イエスが叱[しか]りつけると、悪霊[あくりょう]はその子[こ]から出[で]て行[い]き、子[こ]はそのときから癒[いや]された。"
  19: "それから、弟子[でし]たちはひそかにイエスのもとに来[き]て言[い]った。「なぜ、わたしたちはあの悪霊[あくりょう]を追[お]い出[だ]せなかったのでしょうか。」"
  20: "イエスは言[い]われた。「<j>あなたがたの信仰[しんこう]が薄[うす]いからである。はっきり言[い]っておく。あなたがたにからし種[だね]ほどの信仰[しんこう]があれば、この山[やま]に『ここからあそこへ移[うつ]れ』と言[い]っても、それは移[うつ]る。あなたがたにできないことは何[なに]もない。</j>"
  21: "〔<j>ただし、このたぐいの霊[れい]は、祈[いの]りと断食[だんじつ]のほかには、出[で]て行[い]くことがない。</j>〕」"
  22: "一同[いちどう]がガリラヤに集[あつ]まっているとき、イエスは彼[かれ]らに言[い]われた。「<j>人[ひと]の子[こ]は人々[ひとびと]の手[て]に引[ひ]き渡[わた]される。</j>"
  23: "<j>そして人々[ひとびと]は彼[かれ]を殺[ころ]すが、彼[かれ]は三日目[みっかめ]に復活[ふっかつ]する。</j>」すると、弟子[でし]たちはひどく悲[かな]しんだ。"
  24: "彼[かれ]らがカファルナウムに来[き]たとき、神殿税[でんぜい]を集[あつ]める者[もの]たちがペトロに近[ちか]づいて来[き]て言[い]った。「あなたがたの先生[せんせい]は神殿税[でんぜい]を納[おさ]めないのですか。」"
  25: "ペトロが「納[おさ]めます」と言[い]った。家[いえ]に入[はい]ると、イエスのほうから先[さき]に、「<j>シモン、どう思[おも]うか。地[ち]の王[おう]たちは、税[ぜい]や貢[みつぎ]をだれから取[と]るか。自分[じぶん]の子[こ]たちからか、それとも他人[たにん]からか。</j>」と言[い]われた。"
  26: "ペトロが「他人[たにん]からです」と言[い]うと、イエスは言[い]われた。「<j>それなら、子[こ]たちは自由[じゆう]である。</j>"
  27: "<j>しかし、彼[かれ]らをつまずかせないために、海[うみ]へ行[い]って釣[つ]り針[ばり]を垂[た]れ、最初[さいしょ]に上[あ]がって来[く]る魚[さかな]を取[と]りなさい。その口[くち]を開[あ]けると、一[いち]スタテル⟨銀[ぎん]の貨幣[かへい]。神殿税[でんぜい]二人分[ふたりぶん]に当[あ]たる。⟩が見[み]つかる。それを取[と]って、わたしとあなたの分[ぶん]として彼[かれ]らに渡[わた]しなさい。</j>」"

notes:
  2: "ἔλαμψεν τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος — у Марка лица-солнца нет; порядок Мф сохранён (лицо, потом одежды)."
  3: "συλλαλοῦντες μετ᾽ αὐτοῦ — «беседующие с Ним»; 語り合っていた, без добавления темы беседы (в Лк 9:31 она названа)."
  5: "ἐν ᾧ εὐδόκησα — та же формула, что в 3:17 (わたしの心にかなう者); ἀκούετε αὐτοῦ добавлено Матфеем — これに聞け. Голос Отца не красный."
  9: "τὸ ὅραμα — «видение»; 幻[まぼろし] (по-японски возможен оттенок «морок», но это принятая передача ὅραμα), не «чудо» и не «событие»."
  11: "Ἠλίας μὲν ἔρχεται καὶ ἀποκαταστήσει πάντα — настоящее время: «приходит и устрояет всё»; 来て…整える."
  12: "ἐποίησαν ἐν αὐτῷ ὅσα ἠθέλησαν — «сделали с ним, что хотели»; 好きなようにあしらった, без смягчения."
  15: "σεληνιάζεται — «лунатик», т.е. страдает припадками; てんかん, как в 4:24. κακῶς πάσχει — ひどく苦しんでいる."
  17: "Ὦ γενεὰ ἄπιστος καὶ διεστραμμένη — «о род неверный и развращённый»; 心の曲がった, без сглаживания."
  18: "ἐπετίμησεν αὐτῷ — датив допускает и «запретил ему (бесу)», и «пригрозил ему (отроку)»; оставлено без уточнения, субъект смены действия ясен из греческого."
  20: "ὀλιγοπιστίαν — «маловерие»; 信仰が薄い, как 6:30 и 8:26. κόκκος σινάπεως — からし種, без сноски (понятно по образу)."
  21: "Стиха нет в критической базе (как Мк 9:44); Церковь читает (Елизаветинская, jp-joc) — весь стих в 〔…〕. В Мк 9:29 «и постом» было добавкой внутри стиха, здесь стих церковный целиком."
  24: "τὰ δίδραχμα — «двойная драхма», ежегодный храмовый налог (полсикля); передал 神殿税, как церковная традиция (jp-joc 殿税). Буквальные «две драхмы» без пояснения в японском непонятны."
  25: "προέφθασεν αὐτὸν ὁ Ἰησοῦς — «Иисус предупредил его»; イエスのほうから先に. τέλη ἢ κῆνσον — 税や貢ぎ."
  26: "ἐλεύθεροί εἰσιν οἱ υἱοί — «сыны свободны»; 自由である, без замены на «освобождены от налога»."
  27: "στατήρ — серебряная монета в две драхмы, т.е. ровно налог за двоих; отсюда сноска. ἀντὶ ἐμοῦ καὶ σοῦ — わたしとあなたの分として."
