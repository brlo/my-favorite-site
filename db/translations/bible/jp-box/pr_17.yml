verses:
  1: "平和[へいわ]のうちに喜[よろこ]びとともに食[た]べるパン一切[ひとき]れは、争[あらそ]いとともに不正[ふせい]ないけにえの満[み]ちた家[いえ]にまさる。"
  2: "思慮[しりょ]のある奴隷[どれい]は愚[おろ]かな主人[しゅじん]たちを治[おさ]め、兄弟[きょうだい]たちの間[あいだ]で嗣業[しぎょう]を分[わか]ける。"
  3: "銀[ぎん]と金[きん]が炉[ろ]で試[ため]されるように、選[えら]ばれた心[こころ]は主[しゅ]のもとにある。"
  4: "悪[あく]い者[もの]は不法[ふほう]な者の舌[した]に聞[き]き従[したが]い、正[ただ]しい者は偽[いつわ]りの唇[くちびる]に耳[みみ]を傾[かたむ]けない。"
  5: "貧[まず]しい者[もの]を嘲[あざけ]る者は、これを造[つく]られた方[かた]を怒[いか]らせる。滅[ほろ]びる者を喜[よろこ]ぶ者も罰[ばつ]を免[まぬか]れない。しかし、あわれみをかける者はあわれみを受[う]ける。"
  6: "孫[まご]は老[お]いた者[もの]の冠[かんむり]であり、父[ちち]たちはその子[こ]どもたちの誇[ほこ]りである。信[しん]ある者には世界[せかい]の富[とみ]すべてが与[あた]えられ、不信[ふしん]の者にはオボロス一枚[いちまい]もない。"
  7: "愚[おろ]かな者[もの]に誠実[せいじつ]な唇[くちびる]はふさわしくなく、正[ただ]しい者に偽[いつわ]りの唇もふさわしくない。"
  8: "戒[いまし]めはこれを用[もち]いる者[もの]にとって恵[めぐ]みの報[むく]いであり、どこに向[む]かおうとも道[みち]は開[ひら]ける。"
  9: "罪[つみ]を覆[おお]う者[もの]は愛[あい]を求[もと]め、これを隠[かく]すのを憎[にく]む者は友[とも]と親族[しんぞく]を引[ひ]き離[はな]す。"
  10: "戒[いまし]めの言葉[ことば]は思慮[しりょ]ある者[もの]の心[こころ]を砕[くだ]くが、愚[おろ]かな者は鞭[むち]で打[う]たれても感[かん]じない。"
  11: "悪[あく]い者[もの]はすべて争[あらそ]いを起[お]こす。しかし、主[しゅ]は容赦[ようしゃ]のない使者[ししゃ]をその者に遣[つか]わす。"
  12: "思慮[しりょ]ある人[ひと]には心配[しんぱい]がふりかかるが、愚[おろ]かな者[もの]たちは悪[あく]を思[おも]い巡[めぐ]らす。"
  13: "善[ぜん]に悪[あく]を返[かえ]す者[もの]の家[いえ]からは、災[わざわ]いが去[さ]らない。"
  14: "正[ただ]しさの始[はじ]めは言葉[ことば]に力[ちから]を与[あた]え、乏[とぼ]しさに先立[さきだ]つのは争[あらそ]いと戦[たたか]いである。"
  15: "正[ただ]しい者[もの]を不正[ふせい]な者と裁[さば]き、不正な者を正しい者と裁く者は、神[かみ]の前[まえ]に汚[けが]れて忌[い]むべき者である。"
  16: "愚[おろ]かな者[もの]に財産[ざいさん]があっても何[なん]の役[やく]に立[た]つだろうか。心[こころ]のない者は知恵[ちえ]を手に入[い]れることができないからである。自分[じぶん]の家[いえ]を高[たか]くする者は滅[ほろ]びを求[もと]め、学[まな]ぶことにこだわらない者は悪[あく]に陥[おちい]る。"
  17: "友[とも]はいついかなる時[とき]にもあなたとともにあり、兄弟[きょうだい]は苦[くる]しみのときに役[やく]に立[た]つ。人[ひと]はまさにそのために生[う]まれるからである。"
  18: "愚[おろ]かな者[もの]は手[て]を打[う]って喜[よろこ]ぶ。自分[じぶん]の友[とも]のために保証人[ほしょうにん]になる者も、同[おな]じである。"
  19: "罪[つみ]を愛[あい]する者[もの]は争[あらそ]いを喜[よろこ]ぶ。"
  20: "心[こころ]の頑[かた]くなな者[もの]は良[よ]いものに巡[めぐ]り会[あ]わない。舌[した]の移[うつ]り気[ぎ]な人[ひと]は悪[あく]に陥[おちい]る。"
  21: "愚[おろ]かな者[もの]の心[こころ]は、それを持[も]つ者にとって苦[くる]しみである。父[ちち]は教[おし]えのない子[こ]を喜[よろこ]ばず、思慮[しりょ]ある子は母[はは]を喜ばせる。"
  22: "喜[よろこ]ぶ心[こころ]は体[からだ]を健[すこ]やかにし、憂[うれ]える人[ひと]の骨[ほね]は乾[かわ]き果[は]てる。"
  23: "不正[ふせい]にふところへ贈[おく]り物[もの]を受[う]け取[と]る者[もの]の道[みち]は栄[さか]えない。不敬[ふけい]な者は正[ただ]しさの道を曲[ま]げる。"
  24: "知恵[ちえ]ある人[ひと]の顔[かお]には思慮[しりょ]があり、愚[おろ]かな者[もの]の目[め]は地[ち]の果[は]てにある。"
  25: "愚[おろ]かな子[こ]は父[ちち]の怒[いか]りであり、これを産[う]んだ母[はは]の苦[くる]しみである。"
  26: "正[ただ]しい人[ひと]を罰[ばっ]するのは良[よ]くない。正しい支配者[しはいしゃ]たちに対して企[たくら]みをめぐらすのは敬虔[けいけん]なことではない。"
  27: "激[はげ]しい言葉[ことば]を口[くち]にするのを慎[つつし]む者[もの]は思慮[しりょ]ある者であり、怒[いか]りを遅[おそ]くする人[ひと]は知恵[ちえ]ある者である。"
  28: "愚[おろ]かな者[もの]でも知恵[ちえ]について問[と]えば知恵ある者と見[み]なされ、口[くち]をつぐんでいれば思慮[しりょ]ある者と思[おも]われる。"

notes:
  1: "κρείσσων ψωμὸς μεθ᾽ ἡδονῆς ἐν εἰρήνῃ — лучше кусок хлеба с удовольствием в мире (ψωμός — кусок; csl «укрух хлеба со сластию»). ἢ οἶκος πλήρης πολλῶν ἀγαθῶν καὶ ἀδίκων θυμάτων μετὰ μάχης — нежели дом, полный многих благ и неправедных жертв с бранью (θύματα — заколотое, жертвы; ср. 15:17)."
  2: "οἰκέτης νοήμων κρατήσει δεσποτῶν ἀφρόνων — разумный раб (домочадец) овладеет безумными господами (οἰκέτης; δεσπότης). ἐν δὲ ἀδελφοῖς διελεῖται μέρη — между братьями разделит части, т. е. наследство (διαιρέω)."
  3: "ὥσπερ δοκιμάζεται ἐν καμίνῳ ἄργυρος καὶ χρυσός — как испытывается в печи серебро и золото (δοκιμάζω; κάμινος — печь). οὕτως ἐκλεκταὶ καρδίαι παρὰ κυρίῳ — так избранные сердца у Господа (ἐκλεκτός). ru/МТ: «сердца испытывает Господь» — иное чтение."
  4: "κακὸς ὑπακούει γλώσσης παρανόμων — злой слушает языка беззаконных (ὑπακούω — слушаться, внимать). δίκαιος δὲ οὐ προσέχει χείλεσιν ψευδέσιν — праведный же не внимает устам лживым (προσέχω)."
  5: "ὁ καταγελῶν πτωχοῦ παροξύνει τὸν ποιήσαντα αὐτόν — насмехающийся над нищим раздражает Создавшего его (παροξύνω). ὁ ἐπιχαίρων ἀπολλυμένῳ οὐκ ἀθῳωθήσεται — радующийся погибающему не будет безвинен. ὁ ἐπισπλαγχνιζόμενος ἐλεηθήσεται — сжаливающийся (милосердствующий) помилован будет (ἐπισπλαγχνίζομαι)."
  6: "στέφανος γερόντων τέκνα τέκνων — венец старцев — дети детей, внуки (γέρων — старец). καύχημα δὲ τέκνων πατῆρες αὐτῶν — похвала же детей — отцы их. 6a, подстих модуля: τοῦ πιστοῦ ὅλος ὁ κόσμος τῶν χρημάτων, τοῦ δὲ ἀπίστου οὐδὲ ὀβολός — верному весь мир богатства, неверному же и обола нет (ὀβολός — мелкая монета, ср. 1 Цар 2:36)."
  7: "οὐχ ἁρμόσει ἄφρονι χείλη πιστά — не пристанут глупому уста верные (ἁρμόζω — приличествовать). οὐδὲ δικαίῳ χείλη ψευδῆ — ни праведному уста лживые. ru/МТ иначе («важная речь»)."
  8: "μισθὸς χαρίτων ἡ παιδεία τοῖς χρωμένοις — награда благодатей — наставление пользующимся им (χάριτες — благодати, милости; csl «мзда благодатей»). οὗ δ᾽ ἂν ἐπιστρέψῃ, εὐοδωθήσεται — куда ни обратится, будет успешен (εὐοδόω — давать добрый путь)."
  9: "ὃς κρύπτει ἀδικήματα, ζητεῖ φιλίαν — кто скрывает проступки, ищет дружбы (ἀδίκημα). ὃς δὲ μισεῖ κρύπτειν, διίστησιν φίλους καὶ οἰκείους — кто ненавидит скрывать, разлучает друзей и домашних (διίστημι; οἰκεῖος)."
  10: "συντρίβει ἀπειλὴ καρδίαν φρονίμου — сокрушает угроза (строгое слово) сердце разумного (ἀπειλή). ἄφρων δὲ μαστιγωθεὶς οὐκ αἰσθάνεται — глупый же, битый, не чувствует (μαστιγόω; αἰσθάνομαι)."
  11: "ἀντιλογίας ἐγείρει πᾶς κακός — прекословия (распри) воздвигает всякий злой (ἀντιλογία). ἄγγελον ἀνελεήμονα ἐκπέμψει αὐτῷ — ангела немилостивого пошлёт ему (ἀνελεήμων)."
  12: "ἐμπεσεῖται μέριμνα ἀνδρὶ νοήμονι — впадёт забота мужу разумному (μέριμνα — забота, попечение). οἱ δὲ ἄφρονες διαλογιοῦνται κακά — безумные же размышляют злое. ru/МТ иначе (медведица)."
  13: "ὃς ἀποδίδωσιν κακὰ ἀντὶ ἀγαθῶν — кто воздаёт злом за благое. οὐ κινηθήσεται κακὰ ἐκ τοῦ οἴκου αὐτοῦ — не сдвинутся (не уйдут) зла из дома его (κινέω)."
  14: "ἐξουσίαν δίδωσιν λόγοις ἀρχὴ δικαιοσύνης — власть даёт словам начало правды (ἐξουσία). προηγεῖται δὲ τῆς ἐνδείας στάσις καὶ μάχη — предшествует же скудости мятеж и брань (ἔνδεια; στάσις). ru/МТ иначе (прорыв воды)."
  15: "ὃς δίκαιον κρίνει τὸν ἄδικον — кто праведного судит как неправедного. ἀκάθαρτος καὶ βδελυκτὸς παρὰ θεῷ — нечист и мерзок пред Богом (βδελυκτός)."
  16: "ἵνα τί ὑπῆρξεν χρήματα ἄφρονι — к чему было имущество глупому (ὑπάρχω — быть в наличии). κτήσασθαι σοφίαν ἀκάρδιος οὐ δυνήσεται — приобрести премудрость бессердый не сможет (ἄκαρδιος — без сердца, без разума). 16a, подстих модуля: ὃς ὑψηλὸν ποιεῖ τὸν ἑαυτοῦ οἶκον, ζητεῖ συντριβήν — кто высоким делает дом свой, ищет сокрушения; ὁ σκολιάζων τοῦ μαθεῖν ἐμπεσεῖται εἰς κακά — уклоняющийся от научения впадёт в зло."
  17: "εἰς πάντα καιρὸν φίλος ὑπαρχέτω σοι — во всякое время друг да будет тебе. ἀδελφοὶ δὲ ἐν ἀνάγκαις χρήσιμοι ἔστωσαν — братья же в нуждах полезны да будут (ἀνάγκη). τούτου γὰρ χάριν γεννῶνται — ибо ради сего рождаются."
  18: "ἀνὴρ ἄφρων ἐπικροτεῖ καὶ ἐπιχαίρει ἑαυτῷ — глупый рукоплещет и радуется себе (ἐπικροτέω). ὁ ἐγγυώμενος ἐγγύῃ τὸν ἑαυτοῦ φίλον — ручающийся порукой за друга своего (ἐγγυάω; ἐγγύη — порука). csl добавляет «на своих же устнах огнь сокровишствует» — слав. дублет 16:27b, в текст не внесён."
  19: "φιλαμαρτήμων χαίρει μάχαις — грехолюбец радуется ссорам (φιλαμαρτήμων). В gr стих обрывается на запятой: продолжение — уже в 17:20 (ὁ δὲ σκληροκάρδιος…); csl соединяет 19+20a в один стих. Держимся деления gr, стих не делим и не дополняем."
  20: "ὁ σκληροκάρδιος οὐ συναντᾷ ἀγαθοῖς — жестокосердый не встретит благ (σκληροκάρδιος; συναντάω — встречать). ἀνὴρ εὐμετάβολος γλώσσῃ ἐμπεσεῖται εἰς κακά — муж переменчивый языком впадёт в зло (εὐμετάβολος). В csl этот стих делится иначе: «сердце же безумнаго болезнь стяжавшему е» стоит в csl 17:20, у нас — начало 17:21."
  21: "καρδία δὲ ἄφρονος ὀδύνη τῷ κεκτημένῳ αὐτήν — сердце глупого — страдание тому, кто приобрёл его (κτάομαι). οὐκ εὐφραίνεται πατὴρ ἐπὶ υἱῷ ἀπαιδεύτῳ — не веселится отец о сыне неучёном (ἀπαίδευτος); υἱὸς δὲ φρόνιμος εὐφραίνει μητέρα αὐτοῦ — сын же разумный веселит мать свою."
  22: "καρδία εὐφραινομένη εὐεκτεῖν ποιεῖ — веселящееся сердце делает тело здравым (εὐεκτέω — быть в хорошем состоянии). ἀνδρὸς δὲ λυπηροῦ ξηραίνεται τὰ ὀστᾶ — у мужа печального иссыхают кости (ξηραίνω)."
  23: "λαμβάνοντος δῶρα ἐν κόλπῳ ἀδίκως οὐ κατευοδοῦνται ὁδοί — принимающего дары за пазухой неправедно не успевают пути (κατευοδόω). ἀσεβὴς δὲ ἐκκλίνει ὁδοὺς δικαιοσύνης — нечестивый же уклоняет пути правды (ἐκκλίνω)."
  24: "πρόσωπον συνετὸν ἀνδρὸς σοφοῦ — лицо разумное у мужа мудрого (буквально по LXX). οἱ δὲ ὀφθαλμοὶ τοῦ ἄφρονος ἐπ᾽ ἄκρα γῆς — глаза же глупого на краях земли."
  25: "ὀργὴ πατρὶ υἱὸς ἄφρων — гнев отцу сын глупый. ὀδύνη τῇ τεκούσῃ αὐτοῦ — страдание родившей его (τεκοῦσα — родившая)."
  26: "ζημιοῦν ἄνδρα δίκαιον οὐ καλόν — наказывать (штрафовать) мужа праведного нехорошо (ζημιόω). οὐδὲ ὅσιον ἐπιβουλεύειν δυνάσταις δικαίοις — и не благочестно замышлять против владык праведных (ὅσιος; ἐπιβουλεύω). ru/МТ иначе (бить вельмож)."
  27: "ὃς φείδεται ῥῆμα προέσθαι σκληρόν, ἐπιγνώμων — кто щадит произнести слово жёсткое, рассудителен (φείδομαι; ἐπιγνώμων). μακρόθυμος δὲ ἀνὴρ φρόνιμος — долготерпеливый же муж разумен; csl добавляет «лучше ищущаго науки» — в LXX нет, внесено в текст по паритету."
  28: "ἀνοήτῳ ἐπερωτήσαντι σοφίαν σοφία λογισθήσεται — неразумному, спросившему о премудрости, это вменится в премудрость (λογίζομαι — вменять). ἐνεὸν δέ τις ἑαυτὸν ποιήσας δόξει φρόνιμος εἶναι — а кто сделает себя немым (смолчит), покажется разумным (ἐνεός — немой). Место тёмное; ru/МТ ближе ко второй половине."
