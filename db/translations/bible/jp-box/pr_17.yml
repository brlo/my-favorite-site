# jp-box, Притчи, глава 17. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный, с масоретского) — только
# для понимания, не источник. jp-joc (1901) есть для всей главы — контроль церковного
# чтения, архаизмы не копировались. jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 17: кусок хлеба в мире (1), разумный раб (2), испытание сердец (3),
# злой и праведный (4), насмешка над нищим (5), внуки и верность (6),
# уста и глупость (7), наставление (8–10), распри (11–14), суд (15),
# глупость и богатство (16–21), радость и печаль (22), дары (23),
# мудрость и глупость (24–25), наказание (26), слово и молчание (27–28).
# Прямой речи нет — авторские изречения, внешних кавычек нет; параллелизм сохранён.
# Нумерация по gr: 28 стихов.
# Особенность модуля: gr 17:19 обрывается на запятой, gr 17:20 начинается с «ὁ δὲ
# σκληροκάρδιος» и несёт продолжение, gr 17:21 начинается с «καρδία δὲ ἄφρονος»;
# csl соединяет 19+20a и 20b+21a в свои 19 и 20. Держимся деления gr, стихи не
# делим и не добавляем; сдвиг csl отмечен в notes 19–21.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).

