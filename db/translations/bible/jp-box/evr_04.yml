# jp-box, Послание к Евреям, глава 4. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 4: обещание покоя ещё остаётся (1–2); верующие входят в покой, Пс 95:11
# и Быт 2:2 (3–5); «сегодня» Давида (6–8); субботний покой народа Божия (9–11);
# слово Божие живое и всевидящее (12–13); великий Первосвященник, прошедший небеса
# (14–15); престол благодати (16).
# Красного и синего нет; <j>/<mo> не ставятся. Цитаты Писания — в 「…」.
# 〔…〕 в главе нет: [τὴν] (4:3) в базе есть, слово не оборачивается (проверено
# запросом к gr-lxx-byz). Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

tr_code: jp-box
book: evr
chapter: 4
draft: true

verses:
  1: "それゆえ、わたしたちは恐[おそ]れなければならない。ご自身[じしん]の安息[あんそく]に入[はい]るという約束[やくそく]がまだ残[のこ]されているのに、あなたがたの中[なか]のだれかが、そこに届[とど]かなかったと見[み]なされることのないように。"
  2: "というのは、わたしたちにも、彼[かれ]らと同[おな]じように福音[ふくいん]が告[つ]げ知[し]らされているからである。しかし、彼[かれ]らには、その聞[き]いた言葉[ことば]が益[えき]とならなかった。聞[き]いた者[もの]たちの信仰[しんこう]と混[ま]じ合[あ]わされていなかったからである。"
  3: "というのは、わたしたち信[しん]じた者[もの]たちは、安息[あんそく]に入[はい]るからである。神[かみ]が言[い]われたとおりである。「わたしは怒[いか]りをもって誓[ちか]った。彼[かれ]らは、わたしの安息[あんそく]に入[はい]ることはない」と。もっとも、その業[わざ]は世[よ]の創[はじ]めから成[な]っていたのであるが。"
  4: "というのは、神[かみ]はどこかで、第七日[だいしちにち]についてこう言[い]っておられるからである。「神[かみ]は第七日[だいしちにち]に、ご自身[じしん]のすべての業[わざ]から休[やす]まれた」と。"
  5: "また、ここで再[ふたた]び、「彼[かれ]らは、わたしの安息[あんそく]に入[はい]ることはない」と言[い]っておられる。"
  6: "それゆえ、そこに入[はい]る者[もの]がまだ残[のこ]されているのに、先[さき]に福音[ふくいん]を告[つ]げ知[し]らされた者[もの]たちが不従順[ふじゅう]のゆえに入[はい]らなかったので、"
  7: "神[かみ]はまた、これほど長[なが]い年月[としつき]の後[のち]に、ダビデによって「今日[きょう]」という日[ひ]を定[さだ]め、先[さき]に言[い]われたとおりに、こう言[い]われる。「今日[きょう]、もしあなたがたが、この方[かた]の声[こえ]を聞[き]くなら、あなたがたの心[こころ]を頑[かたくな]にしてはならない」と。"
  8: "というのは、もしヨシュアが彼[かれ]らを安息[あんそく]させたのであれば、神[かみ]はその後[あと]、別[べつ]の日[ひ]について語[かた]られたはずがないからである。"
  9: "それゆえ、神[かみ]の民[たみ]には、安息[あんそく]の休[やす]みが残[のこ]されているのである。"
  10: "というのは、神[かみ]の安息[あんそく]に入[はい]った者[もの]は、その人[ひと]もまた、ご自身[じしん]の業[わざ]から休[やす]まれた神[かみ]のように、自分[じぶん]の業[わざ]から休[やす]んだのである。"
  11: "それゆえ、わたしたちは、この安息[あんそく]に入[はい]ることを努[つと]めて求[もと]めよう。だれも、あの不従順[ふじゅう]の例[れい]に倣[なら]って倒[たお]れることのないように。"
  12: "というのは、神[かみ]の御言葉[みことば]は生[い]きて力[ちから]があり、どの両刃[りょうば]の剣[けん]よりも鋭[するど]く、魂[たましい]と霊[れい]、関節[かんせつ]と骨髄[こつずい]の分[わ]かれ目[め]にまで刺[さ]し通[とお]し、心[こころ]の思[おも]いと考[かんが]えとを裁[さば]く者[もの]である。"
  13: "そして、神[かみ]の前[まえ]に隠[かく]れている被造物[ひぞうぶつ]は何[なに]一つなく、すべてのものは裸[はだか]にされ、神[かみ]の目[め]の前[まえ]にさらされている。わたしたちは、この方[かた]に申[もう]し開[ひら]きをしなければならないのである。"
  14: "それゆえ、わたしたちには、天[てん]を貫[つらぬ]いて行[い]かれた大[おお]いなる大祭司[だいさいし]、神[かみ]の子[こ]イエスがおられるのだから、わたしたちの告白[こくはく]を固[かた]く保[たも]とう。"
  15: "というのは、わたしたちの大祭司[だいさいし]は、わたしたちの弱[よわ]さに共[とも]に感[かん]じることのできない方[かた]ではなく、罪[つみ]のほかは、すべての点[てん]でわたしたちと同[おな]じように試[こころ]みを受[う]けられた方[かた]である。"
  16: "それゆえ、わたしたちは、{恵[めぐ]み|恩寵[おんちょう]}の御座[みくら]に、大胆[だいたん]さをもって近[ちか]づこう。そうすれば、あわれみを受[う]け、時[とき]にかなった助[たす]けのために、{恵[めぐ]み|恩寵[おんちょう]}を得[え]ることができるのである。"

notes:
  1: "φοβηθῶμεν οὖν — それゆえ恐れなければならない. καταλειπομένης ἐπαγγελίας — 約束がまだ残されているのに. δοκῇ τις… ὑστερηκέναι — だれかが…届かなかったと見なされることのないように (ὑστερέω — «опоздать, не достичь»)."
  2: "εὐηγγελισμένοι — 福音が告げ知らされている. ὁ λόγος τῆς ἀκοῆς — 聞いた言葉 (букв. «слово слышания»). οὐκ ὠφέλησεν — 益とならなかった. μὴ συγκεκερασμένους τῇ πίστει τοῖς ἀκούσασιν — 聞いた者たちの信仰と混じり合わされることなく (двусмысленно: «не соединённое с верой у слышавших»)."
  3: "εἰσερχόμεθα οἱ πιστεύσαντες — 信じた者たちは入る. Цитата Пс 95:11 (ср. 3:11). καίτοι τῶν ἔργων… γενηθέντων — もっとも、その業は…成っていたのであるが (уступительное, переходит в 4:4). [τὴν] в базе есть — 〔…〕 не ставится."
  4: "Цитата Быт 2:2. εἴρηκεν γάρ που — どこかで言われている. ἑβδόμη — 第七日. κατέπαυσεν ἀπὸ πάντων τῶν ἔργων αὐτοῦ — すべての業から休まれた."
  5: "Повтор Пс 95:11 (καὶ ἐν τούτῳ πάλιν — また、ここで再び)."
  6: "ἀπολείπεται τινὰς εἰσελθεῖν — 入る者がまだ残されている. οἱ πρότερον εὐαγγελισθέντες — 先に福音を告げ知らされた者たち. δι' ἀπείθειαν — 不従順のゆえに. Предложение продолжается в 4:7."
  7: "πάλιν τινὰ ὁρίζει ἡμέραν — 神はまた…日を定め. Σήμερον — 「今日」 (имя дня, не наречие). ἐν Δαυὶδ λέγων — ダビデによって語り. μετὰ τοσοῦτον χρόνον — これほど長い年月の後に. καθὼς προείρηται — 先に言われたとおり. Цитата Пс 95:7–8."
  8: "Ἰησοῦς здесь — Иисус Навин (ヨシュア), не Христос: εἰ γὰρ αὐτοὺς Ἰησοῦς κατέπαυσεν. ἄλλης ἡμέρας — 別の日."
  9: "ἄρα — それゆえ. σαββατισμός — 安息の休み (субботство, «субботний покой»; отличается от κατάπαυσις — 安息). τῷ λαῷ τοῦ θεοῦ — 神の民に."
  10: "ὁ εἰσελθὼν εἰς τὴν κατάπαυσιν αὐτοῦ — 神の安息に入った者. κατέπαυσεν ἀπὸ τῶν ἔργων αὐτοῦ — 自分の業から休んだ. ὥσπερ ἀπὸ τῶν ἰδίων ὁ θεός — 神がご自身の業から休まれたように."
  11: "σπουδάσωμεν — 努めて求めよう. ἐν τῷ αὐτῷ… ὑποδείγματι τῆς ἀπειθείας — 同じ不従順の例に倣って (ὑπόδειγμα — «пример, образец»)."
  12: "ζῶν… καὶ ἐνεργής — 生きて力があり. τομώτερος ὑπὲρ πᾶσαν μάχαιραν δίστομον — どの両刃の剣よりも鋭く. διϊκνούμενος ἄχρι μερισμοῦ — 分かれ目にまで刺し通し. ἁρμοὶ καὶ μυελοί — 関節と骨髄. κριτικὸς ἐνθυμήσεων καὶ ἐννοιῶν — 思いと考えとを裁く. πνεῦμα здесь — 霊[れい], не 聖霊."
  13: "κτίσις ἀφανής — 隠れている被造物. γυμνὰ καὶ τετραχηλισμένα — 裸にされ、さらされている (τετραχηλισμένα — «с вывернутой шеей», т.е. открытые). πρὸς ὃν ἡμῖν ὁ λόγος — この方に申し開きをしなければならない (букв. «к Которому наше слово»; ср. jp-joc 彼に事を陳べん)."
  14: "ἀρχιερεὺς μέγας — 大いなる大祭司. διεληλυθότα τοὺς οὐρανούς — 天を貫いて行かれた (perfect). κρατῶμεν τῆς ὁμολογίας — 告白を固く保とう."
  15: "συμπαθῆσαι ταῖς ἀσθενείαις — 弱さに共に感じる. πεπειρασμένον κατὰ πάντα καθ' ὁμοιότητα — すべての点で同じように試みを受けた (perfect). χωρὶς ἁμαρτίας — 罪のほかは."
  16: "θρόνος τῆς χάριτος — 恵みの御座. μετὰ παρρησίας — 大胆さをもって. ἔλεος… χάριν… εἰς εὔκαιρον βοήθειαν — あわれみを受け、時にかなった助けのために恵みを得る."
