# jp-box, Второзаконие, глава 22. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — csl-ru; ru — только для понимания.
# jp-joc в этой главе отсутствует. Язык — современный 常体; порядок членов и
# деление на клаузы — по греческому.
# Глава 22: потерянный скот и вещи (1–3), упавший скот (4), одежда другого пола (5),
# птичье гнездо (6–7), перила кровли (8), смешанные посевы, скот и ткани (9–11),
# кисти на одежде (12), клевета на девицу (13–21), прелюбодеяние (22),
# обручённая в городе и в поле (23–27), необручённая девица (28–29).
# Вся глава — речь Моисея: 「…」 (1–29). Внутри неё слова мужа (14)
# и слова отца (16–17) — 『…』. Красного нет.
# Нумерация: 29 стихов, как в gr-lxx-byz; у csl-ru и ru 30 стихов, потому что
# их 22:30 («не бери жены отца своего») в gr-lxx-byz стоит как 23:1 — держимся gr.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (проверено по выгрузке и базе).
# Сносок ⟨…⟩ нет: シケル уже в корпусе; δίδραχμα в 22:29 пояснено в notes.
# jp-ni не использовался.

