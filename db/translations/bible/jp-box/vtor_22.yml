verses:
  1: "「あなたの兄弟[きょうだい]の牛[うし]や羊[ひつじ]が道[みち]で迷[まよ]っているのを見[み]ても、見て見ぬふりをしてはならない。必[かなら]ずそれをあなたの兄弟のもとへ連[つ]れ帰[かえ]り、彼[かれ]に返[かえ]しなさい。"
  2: "もしあなたの兄弟[きょうだい]があなたの近[ちか]くにいないか、あなたが彼[かれ]を知[し]らないなら、それをあなたの家[いえ]の内[うち]に引[ひ]き取[と]っておきなさい。あなたの兄弟がそれを探[さが]しに来[く]るまで、それはあなたのもとになければならない。そして、あなたは彼にそれを返[かえ]しなさい。"
  3: "同じように、彼[かれ]のろばにも、彼の衣[ころも]にも、あなたの兄弟[きょうだい]の失[な]われたすべてのもの、すなわち彼のもとから失われて、あなたが見[み]つけたものについても、そうしなさい。見て見ぬふりをすることはできない。"
  4: "あなたの兄弟[きょうだい]のろばや牛[うし]が道[みち]で倒[たお]れているのを見[み]ても、それを放[ほう]っておいてはならない。必[かなら]ず彼[かれ]とともにそれを起[お]こしなさい。"
  5: "女[おんな]は男[おとこ]の衣装[いしょう]を身[み]につけてはならない。男は女の衣[ころも]を着[き]てはならない。これらのことを行[おこな]う者[もの]はすべて、あなたの神[かみ]である主[しゅ]に忌[い]み嫌[きら]われるものだからである。"
  6: "道[みち]や、どの木[き]の上[うえ]、あるいは地[ち]の上で、あなたの前[まえ]に鳥[とり]の巣[す]が見[み]つかり、その中にひなか卵[たまご]があって、母鳥[ははどり]がひなの上か卵の上に伏[ふ]しているなら、母鳥を子[こ]どもと一緒[いっしょ]に取[と]ってはならない。"
  7: "母鳥[ははどり]は必[かなら]ず放[はな]してやらなければならない。子[こ]どもはあなたのために取[と]ってよい。あなたが幸[しあわ]せになり、長[なが]く生[い]きるためである。"
  8: "新[あたら]しい家[いえ]を建[た]てるときは、屋根[やね]の周[まわ]りに手[て]すりを作[つく]りなさい。人がそこから落[お]ちて、あなたの家に血[ち]の罪[つみ]を招[まね]いてはならないためである。"
  9: "あなたのぶどう畑[ばたけ]に二種類[にしゅるい]の種[たね]を蒔[ま]いてはならない。ぶどう畑の実[み]も、あなたが蒔いた種も、ともに聖別[せいべつ]されてしまわないためである。"
  10: "牛[うし]とろばを一緒[いっしょ]にして耕[たがや]してはならない。"
  11: "羊毛[ようもう]と麻[あさ]を一緒[いっしょ]に混[ま]ぜた着物[きもの]を身[み]に着[つ]けてはならない。"
  12: "あなたが身[み]にまとう上[うわ]着[ぎ]の四[よっ]つの隅[すみ]に、房[ふさ]を作[つく]りなさい。"
  13: "もしある人[ひと]が女[おんな]を妻[つま]に迎[むか]え、彼女[かのじょ]と暮[く]らすようになって、彼女を憎[にく]むようになり、"
  14: "彼女[かのじょ]に言[い]いがかりをつけ、悪[わる]い噂[うわさ]を広[ひろ]めて言う。『わたしはこの女[おんな]を妻[つま]に迎[むか]えたが、彼女のところに入[はい]ってみると、彼女に処女[しょじょ]の証[あかし]がなかった。』"
  15: "その娘[むすめ]の父[ちち]と母[はは]は、娘の処女[しょじょ]の証[あかし]を持[も]って、町[まち]の門[もん]にいる長老[ちょうろう]たちのところへ出[で]て行[い]きなさい。"
  16: "娘[むすめ]の父[ちち]は長老[ちょうろう]たちに言[い]う。『わたしはこの娘をこの人[ひと]の妻[つま]として与[あた]えたが、この人は彼女[かのじょ]を憎[にく]むようになり、"
  17: "この人[ひと]はいま、彼女[かのじょ]に言[い]いがかりをつけ、わたしの娘[むすめ]に処女[しょじょ]の証[あかし]が見[み]つからなかったと言っている。しかし、これがわたしの娘の処女の証である。』そして、彼らはその衣[ころも]を町[まち]の長老[ちょうろう]たちの前[まえ]に広[ひろ]げる。"
  18: "その町[まち]の長老[ちょうろう]たちは、その人[ひと]を捕[と]らえて懲[こら]らしめ、"
  19: "彼[かれ]に銀[ぎん]百[ひゃく]シケルを科[か]し、それを娘[むすめ]の父[ちち]に与[あた]えなさい。彼がイスラエルの処女[しょじょ]について悪[わる]い噂[うわさ]を広[ひろ]めたからである。彼女[かのじょ]は彼の妻[つま]となる。彼は一生[いっしょう]、彼女を離縁[りえん]することができない。"
  20: "しかし、この訴[うった]えが真実[しんじつ]であって、その娘[むすめ]に処女[しょじょ]の証[あかし]が見[み]つからないなら、"
  21: "その娘[むすめ]を父[ちち]の家[いえ]の戸口[とぐち]へ連[つ]れ出[だ]し、その町[まち]の人々[ひとびと]が彼女[かのじょ]を石[いし]で打[う]ち殺[ころ]しなさい。彼女は死[し]ぬ。彼女がイスラエルの子[こ]らの間[あいだ]で愚[おろ]かなことを行[おこな]い、父の家で淫[いん]らな行いをしたからである。あなたはあなたがたの間から悪[あく]を除[のぞ]き去[さ]りなさい。"
  22: "もし人[ひと]が、夫[おっと]のある女[おんな]と寝[ね]ているところを見[み]つかったなら、その男[おとこ]も女も二人[ふたり]とも殺[ころ]しなさい。あなたはイスラエルから悪[あく]を除[のぞ]き去[さ]りなさい。"
  23: "もし、ある男[おとこ]と婚約[こんやく]している処女[しょじょ]の娘[むすめ]がいて、町[まち]のうちで人[ひと]が彼女[かのじょ]を見[み]つけ、彼女と寝[ね]たなら、"
  24: "あなたがたは二人[ふたり]ともその町[まち]の門[もん]へ連[つ]れ出[だ]し、石[いし]で打[う]ち殺[ころ]しなさい。娘[むすめ]は町のうちで叫[さけ]ばなかったからであり、男[おとこ]は隣人[りんじん]の妻[つま]を辱[はずかし]めたからである。あなたはあなたがたの間[あいだ]から悪[あく]を除[のぞ]き去[さ]りなさい。"
  25: "しかし、野[の]で人[ひと]が婚約[こんやく]している娘[むすめ]を見[み]つけ、力[ちから]ずくで彼女[かのじょ]と寝[ね]たなら、その男[おとこ]だけを殺[ころ]しなさい。"
  26: "その娘[むすめ]には何[なに]もしてはならない。娘には死[し]に値[あた]する罪[つみ]はない。人[ひと]が隣人[りんじん]に立[た]ち向[む]かってその命[いのち]を奪[うば]うのと、このこととは同[おな]じだからである。"
  27: "彼[かれ]は野[の]で彼女[かのじょ]を見[み]つけたのである。婚約[こんやく]していた娘は叫[さけ]んだが、助[たす]ける者[もの]がなかった。"
  28: "もし人[ひと]が、まだ婚約[こんやく]していない処女[しょじょ]の娘[むすめ]を見[み]つけ、力[ちから]ずくで彼女[かのじょ]と寝[ね]、そのことが明[あき]らかになったなら、"
  29: "彼女[かのじょ]と寝[ね]た男[おとこ]は、娘[むすめ]の父[ちち]に銀[ぎん]五十[ごじゅう]ディドラクマを払[はら]いなさい。彼女を辱[はずかし]めたのだから、彼女は彼の妻[つま]となる。彼は一生[いっしょう]、彼女を離縁[りえん]することができない。」"

notes:
  1: "Μὴ ἰδὼν … ὑπερίδῃς — «увидев, не пренебреги» (ὑπεροράω); конструкция с μή при причастии передана 見ても…見ぬふりをしてはならない. ἀποστροφῇ ἀποστρέψεις — «возвращением возвратишь», усиление."
  2: "ἐγγίζῃ — «близок»; ἐπίστῃ — «знаешь» (ἐπίσταμαι). συνάξεις … ἔνδον εἰς τὴν οἰκίαν — «соберёшь внутрь дома». ἕως ἂν ζητήσῃ — «пока не взыщет»."
  3: "ὄνος — осёл; ἱμάτιον — одежда; ἀπώλεια — «погибель, потерянная вещь». οὐ δυνήσῃ ὑπεριδεῖν — «не сможешь пренебречь»."
  4: "πεπτωκότας — «упавших». ἀνιστῶν ἀναστήσεις — «поднимая поднимешь», усиление. μετ᾽ αὐτοῦ — «с ним, с братом, вместе»."
  5: "σκεύη ἀνδρός — «мужские вещи, утварь» (σκεῦος); στολὴ γυναικεία — «женское одеяние». βδέλυγμα — «мерзость». Переведено прямо, без смягчения."
  6: "νοσσιά — гнездо; νεοσσοί — птенцы; ᾠά — яйца. θάλπῃ — «согревает, сидит» (θάλπω). οὐ λήμψῃ — «не возьмёшь»."
  7: "ἀποστολῇ ἀποστελεῖς — «отпущением отпустишь», усиление. ἵνα εὖ σοι γένηται — «чтобы благо тебе было». πολυήμερος — «долгоденственный» (многодневный)."
  8: "στεφάνη — «венец, ограда» (перила); δῶμα — кровля. φόνον — «убийство, кровопролитие». ὁ πεσών — «упавший»."
  9: "κατασπερεῖς — «засеешь» (κατασπείρω). διάφορον — «различное, двоякое». ἁγιασθῇ — «будет освящено», т.е. станет запретным; в тексте 聖別される. γένημα — плод, урожай."
  10: "ἀροτριάσεις — «будешь пахать» (ἀροτριάω). ἐπὶ τὸ αὐτό — «вместе»."
  11: "κίβδηλον — «поддельное, смешанное»; ἔρια — шерсть, λίνον — лён."
  12: "στρεπτά — «скрученные кисти» (от στρέφω); κράσπεδα — края, углы; περιβόλαιον — покрывало, верхняя одежда."
  13: "συνοικήσῃ — «станет жить с ней» (συνοικέω), о брачном сожительстве. μισήσῃ — «возненавидит»."
  14: "προφασιστικοὺς λόγους — «обвинительные слова, предлоги» (πρόφασις — предлог); ἐπιθῇ — «возложит». ὄνομα πονηρόν — «худое имя». παρθένια — «признаки девства»; в тексте 処女の証. Слова мужа — 『…』."
  15: "ἐξοίσουσιν — «вынесут»; ἐπὶ τὴν πύλην — к воротам, месту суда."
  16: "δέδωκα … γυναῖκα — «я дал в жену». μισήσας — «возненавидев». Начало речи отца — 『…』, продолжается в 17."
  17: "ἐπιτίθησιν … λέγων — «возлагает, говоря»; прямая речь мужа передана косвенно, чтобы не вкладывать третьи кавычки. ἀναπτύξουσιν τὸ ἱμάτιον — «развернут одежду» (ἀναπτύσσω)."
  18: "παιδεύσουσιν — «накажут» (παιδεύω)."
  19: "ζημιώσουσιν — «оштрафуют» (ζημιόω); ἑκατὸν σίκλους — сто сиклей. ἐξήνεγκεν ὄνομα πονηρόν — «вынес худое имя». ἐξαποστεῖλαι — «отпустить», т.е. развестись."
  20: "ἐπ᾽ ἀληθείας — «по истине». παρθένια — признаки девства."
  21: "ἀφροσύνην — «безумие, глупость». ἐκπορνεῦσαι — «блудодействовать» (ἐκπορνεύω); в тексте 淫らなことをする. θύρας οἴκου πατρός — двери дома отца."
  22: "συνῳκισμένης ἀνδρί — «выданной замуж» (συνοικίζω). ἀποκτενεῖτε — «убьёте». ἐξαρεῖς τὸν πονηρόν — «истребишь злое»."
  23: "μεμνηστευμένη — «обручённая» (μνηστεύω); παῖς παρθένος — молодая девица."
  24: "ἐξάξετε — «выведете». ἐβόησεν — «кричала» (βοάω). ἐταπείνωσεν — «смирил, обесчестил»."
  25: "βιασάμενος — «применив насилие» (βιάζομαι); κοιμηθῇ μετ᾽ αὐτῆς — «ляжет с ней». μόνον — только его."
  26: "ἁμάρτημα θανάτου — «грех смерти», преступление, достойное смерти. ἐπαναστῇ — «восстанет»; φονεύσῃ ψυχήν — «убьёт душу», лишит жизни."
  27: "ἐβόησεν … καὶ ὁ βοηθήσων οὐκ ἦν — «кричала, и не было помогающего». В csl/ru добавлено «хотя»; в греч. простое соединение."
  28: "ἥτις οὐ μεμνήστευται — «которая не обручена». εὑρεθῇ — «будет обнаружено»."
  29: "δίδραχμα — дидрахмы (δίδραχμον, двойная драхма); в LXX соответствует сиклю, ср. 22:19 σίκλοι. πεντήκοντα — пятьдесят. ἀνθ᾽ ὧν — «за то, что». ἐξαποστεῖλαι — «отпустить»."
