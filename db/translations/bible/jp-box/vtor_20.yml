# Глава 20: наставление перед боем и речь священника (1–4); отпущения от войны (5–8);
# военачальники (9); осада дальних городов (10–15); заклятие народов Ханаана (16–18);
# запрет губить плодовые деревья при осаде (19–20).
# Вся глава — речь Моисея к народу: первый уровень 「…」 (1–20).
# Вложенная речь — 『…』: слова священника (3–4) и объявления надзирателей (5–8).
