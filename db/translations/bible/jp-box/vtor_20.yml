book: vtor
chapter: 20
draft: true

verses:
  1: "「あなたが敵[てき]と戦[たたか]いに出[で]て、馬[うま]と騎兵[きへい]、あなたより多[おお]い民[たみ]を見[み]ても、彼[かれ]らを恐[おそ]れてはならない。あなたをエジプトの地[ち]から上[のぼ]らせたあなたの神[かみ]である主[しゅ]が、あなたとともにおられるからである。"
  2: "戦[いくさ]に近[ちか]づくとき、祭司[さいし]が進[すす]み出[で]て民[たみ]に語[かた]り、"
  3: "こう言[い]いなさい。『聞[き]け、イスラエルよ。あなたがたは今日[きょう]、敵[てき]と戦[たたか]うために出[で]て行[い]く。心[こころ]が弱[よわ]ってはならない。恐[おそ]れてはならない。うろたえてはならない。彼[かれ]らの前[まえ]から退[しりぞ]いてはならない。"
  4: "あなたがたの神[かみ]である主[しゅ]は、あなたがたとともに進[すす]み、あなたがたのために敵[てき]と戦[たたか]って、あなたがたを救[すく]われるからである。』"
  5: "監督[かんとく]たちは民[たみ]に語[かた]って言[い]わなければならない。『新[あたら]しい家[いえ]を建[た]ててまだそれに入[はい]って住[す]んでいない者[もの]はだれか。その者[もの]は家[いえ]に帰[かえ]りなさい。戦[いくさ]で死[し]んで、別[べつ]の人[ひと]がそれを手[て]に入[い]れて使[つか]うことのないためである。』"
  6: "『ぶどう畑[ばたけ]を植[う]えてまだその実[み]を楽[たの]しんでいない者[もの]はだれか。その者[もの]は家[いえ]に帰[かえ]りなさい。戦[いくさ]で死[し]んで、別[べつ]の人[ひと]がそれを楽[たの]しむことのないためである。』"
  7: "『妻[つま]となるべき人[ひと]と婚約[こんやく]して、まだ彼女[かのじょ]を娶[めと]っていない者[もの]はだれか。その者[もの]は家[いえ]に帰[かえ]りなさい。戦[いくさ]で死[し]んで、別[べつ]の人[ひと]が彼女を娶ることのないためである。』"
  8: "監督[かんとく]たちはさらに民[たみ]に語[かた]って言[い]わなければならない。『恐[おそ]れて心[こころ]の弱[よわ]い者[もの]はだれか。その者[もの]は家[いえ]に帰[かえ]りなさい。兄弟[きょうだい]の心[こころ]まで自分[じぶん]の心のように怯[おび]えさせないためである。』"
  9: "監督[かんとく]たちが民[たみ]に語[かた]り終[お]えたなら、民[たみ]の先[さき]に立[た]つ軍[ぐん]の長[ちょう]たちを任[にん]じなければならない。"
  10: "あなたが町[まち]に近[ちか]づいてそれを攻[せ]めるとき、まず平和[へいわ]を申[もう]し入[い]れなければならない。"
  11: "もしその町[まち]があなたに平和[へいわ]で答[こた]えて門[もん]を開[あ]くなら、そこに見[み]いだされる民[たみ]はすべて、あなたに貢[みつ]ぎを納[おさ]め、あなたに仕[つか]える者[もの]となる。"
  12: "もしその町[まち]があなたに平和で答えず、あなたと戦[たたか]いをするなら、あなたはそれを包囲[ほうい]しなければならない。"
  13: "あなたの神[かみ]である主[しゅ]がそれをあなたの手[て]に渡[わた]されるとき、あなたはその中の男[おとこ]をすべて剣[つるぎ]の刃[は]にかけて打[う]たなければならない。"
  14: "ただ、女[おんな]たちと家財[かざい]、すべての家畜[かちく]、および町[まち]の中[なか]にあるすべてのもの、すなわちすべての分捕[ぶんど]り物[もの]を、あなたは自分[じぶん]のために取[と]り、あなたの神[かみ]である主[しゅ]があなたに与[あた]えられる敵[てき]の分捕り物を食[た]べ尽[つ]くすことができる。"
  15: "あなたから遠[とお]く離[はな]れたすべての町[まち]、すなわちこれらの国民[こくみん]の町々[まちまち]に属[ぞく]さない町々には、そのようにしなければならない。"
  16: "しかし、あなたの神[かみ]である主[しゅ]が嗣業[しぎょう]としてあなたに与[あた]えるこれらの国民[こくみん]の町々[まちまち]では、息[いき]のあるもの[もの]を一[ひと]つも生[い]かしておいてはならない。"
  17: "むしろ、あなたはヘテ人[じん]、アモリ人[じん]、カナン人[じん]、ペリジ人[じん]、ヒビ人[じん]、エブス人[じん]、ゲルガシ人[じん]を、あなたの神[かみ]である主[しゅ]があなたに命[めい]じられたとおりに聖絶[せいぜつ]しなければならない。"
  18: "彼[かれ]らが自分[じぶん]の神々[かみがみ]のために行[おこな]ったすべての忌[い]むべきことを、あなたがたに教[おし]えて、あなたがたがあなたがたの神[かみ]である主[しゅ]の前[まえ]に罪[つみ]を犯[おか]すことのないためである。"
  19: "あなたが町[まち]を長[なが]い間[あいだ]包囲[ほうい]して、それを攻[せ]め取[と]ろうとするとき、あなたはその町の木[き]に斧[おの]を入[い]れて滅[ほろ]ぼしてはならない。あなたはその実[み]を食[た]べることができる。それを切[き]り倒[たお]してはならない。野[の]の木[き]は人[ひと]だろうか。あなたの前[まえ]から砦[とりで]の中[なか]へ逃[に]げ込[こ]むというのか。"
  20: "ただ、実[み]を食[た]べることのできない木[き]であるとあなたが知[し]っているものだけは、それを滅[ほろ]ぼし、切[き]り倒[たお]して、あなたと戦[たたか]う町[まち]に対して堡塁[ほるい]を築[きず]き、それがあなたに渡[わた]されるまでにするのである。」"

notes:
  1: "ἐξέλθῃς εἰς πόλεμον — выйдешь на войну; ἵππον καὶ ἀναβάτην — коня и всадника (Синодальный «коней и колесницы» — с евр.; в LXX всадник); λαὸν πλεῖονά σου — народа больше тебя; ὁ ἀναβιβάσας σε — возведший, выведший тебя (ἀναβιβάζω)."
  2: "ἔσται ὅταν — «будет, когда»; ἐγγίσῃς τῷ πολέμῳ — приблизишься к войне; προσεγγίσας — приступив (προσεγγίζω)."
  3: "Ἄκουε, Ισραηλ — слушай, Израиль; προσπορεύεσθε — выступаете; μὴ ἐκλυέσθω ἡ καρδία — да не ослабеет сердце (ἐκλύω); μὴ φοβεῖσθε μηδὲ θραύεσθε — не бойтесь и не сокрушайтесь (θραύω); μηδὲ ἐκκλίνητε ἀπὸ προσώπου — не уклоняйтесь от лица их."
  4: "προπορευόμενος — идущий впереди; συνεκπολεμῆσαι — вместе воевать (συνεκπολεμέω); διασῶσαι — спасти."
  5: "γραμματεῖς здесь не «книжники», а войсковые писцы-надзиратели (監督; слав. «книгочия»); ἐνεκαίνισεν — ввёл в употребление, обновил (ἐγκαινίζω); ἐγκαινιεῖ — обновит."
  6: "ἀμπελών — виноградник; εὐφράνθη ἐξ αὐτοῦ — возвеселился от него; εὐφρανθήσεται — возвеселится."
  7: "μεμνήστευται — обручился (perfect от μνηστεύω); οὐκ ἔλαβεν — не взял; λήμψεται — возьмёт."
  8: "δειλὸς τῇ καρδίᾳ — робкий сердцем; δειλιάνῃ — сделает робким (δειλιάω); ὥσπερ ἡ αὐτοῦ — как его собственное (сердце)."
  9: "παύσωνται — перестанут; καταστήσουσιν — поставят (καθίστημι); ἄρχοντας τῆς στρατιᾶς — начальников войска; προηγουμένους — идущих впереди."
  10: "ἐκπολεμῆσαι — воевать против; ἐκκαλέσῃ μετ᾿ εἰρήνης — воззовёшь с миром, т.е. предложишь мир."
  11: "εἰρηνικὰ ἀποκριθῶσίν — ответят мирное; ἀνοίξωσίν σοι — откроют тебе; φορολόγητοι — обложенные данью (φόρος — подать); ὑπήκοοι — послушные."
  12: "μὴ ὑπακούσωσίν — не послушаются; ποιήσωσιν πόλεμον — начнут войну; περικαθιεῖς — обложишь, осадишь (περικαθίζω)."
  13: "παραδώσει εἰς τὰς χεῖρας — предаст в руки; πατάξεις — поразишь; πᾶν ἀρσενικόν — всё мужское; ἐν φόνῳ μαχαίρας — избиением меча."
  14: "ἀποσκευή — имущество, скарб; ἀπαρτία — снаряжение, вся добыча; προνομεύσεις — возьмёшь в добычу (προνομεύω); προνομή — добыча; φάγῃ — съешь, т.е. будешь пользоваться. В LXX нет «детей» (Синодальный добавляет с евр.)."
  15: "μακρὰν οὔσας ἀπὸ σοῦ σφόδρα — весьма далеко от тебя; οὐχὶ ἐκ τῶν πόλεων τῶν ἐθνῶν τούτων — не из городов народов сих."
  16: "ἰδοὺ δέ — «вот же», в противовес; οὐ ζωγρήσετε — не оставите живым (ζωγρέω); πᾶν ἐμπνέον — всё дышащее."
  17: "ἀναθέματι ἀναθεματιεῖτε — «заклятием прокляните» (внутренний объект; herem — 聖絶); ὃν τρόπον ἐνετείλατο — как заповедал."
  18: "διδάξωσιν — научат; βδελύγματα — мерзости; ἁμαρτήσεσθε ἐναντίον — согрешите пред."
  19: "περικαθίσῃς περὶ πόλιν — будешь осаждать город; εἰς κατάλημψιν — для взятия; ἐξολεθρεύσεις — истребишь; ἐπιβαλεῖν σίδηρον — наложить железо, т.е. рубить; οὐκ ἐκκόψεις — не срубишь; μὴ ἄνθρωπος τὸ ξύλον — «разве дерево — человек?» (риторический вопрос); χάραξ — укрепление, вал."
  20: "οὐ καρπόβρωτον — не плодоядное (καρπόβρωτος); χαράκωσις — осадное сооружение, 堡塁; ἕως ἂν παραδοθῇ — доколе не будет предано."
