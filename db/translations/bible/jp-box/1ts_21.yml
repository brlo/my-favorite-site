# jp-box, 1-я Царств, глава 21. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc для книги нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 21: Давид в Номве у Ахимелеха и просьба о хлебе (1–3), ответ о святых
# хлебах и слова Давида о чистоте (4–5), хлебы предложения (6), Доик (7),
# просьба о мече и меч Голиафа (8–9), бегство к Анхусу в Геф (10), песнь слуг
# (11), страх и мнимое безумие (12–13), слова Анхуса (14–15).
# Речи — 「…」: Ахимелек (1, 4, 9), Давид (2, 3, 5, 8), Анхус (14–15),
# слуги Анхуса (11). Вложенная речь — 『…』: повеление царя (2), песня (11).
# Нумерация — славяно-синодальная (по csl-ru): 15 стихов. Гр 21:1 («И воста
# давид и отиде…») отнесён к 20:43, поэтому слав. 21:1 = наш 21:1 (гр 21:2),
# слав. 21:15 = гр 21:16. Меч: слав. отдаёт его в 21:9, а gr — в начале 21:11.
# 〔…〕 нет: на месте всех стихов в gr-lxx-byz стоит текст, а не «.».
# Сносок ⟨…⟩ нет: エフォド, 供えのパン, 祭司, ペリシテ人 уже в корпусе.
# jp-ni не использовался.
tr_code: jp-box
book: 1ts
chapter: 21
draft: true

verses:
  1: "ダビデはノブへ、祭司[さいし]アヒメレクのもとへ来[き]た。アヒメレクは彼の来訪[らいほう]に驚[おどろ]き、言[い]った。「なぜあなたは一人[ひとり]で、だれも一緒[いっしょ]にいないのか。」"
  2: "ダビデは祭司[さいし]に言[い]った。「王[おう]はわたしに事[こと]を命[めい]じ、こう言[い]った。『わたしがあなたを遣[つか]わすわけ、あなたに命じることを、だれにも知[し]らせるな。』わたしは若者[わかもの]たちを、神[かみ]の信[しん]実[じつ]と呼[よ]ばれる場所[ばしょ]、ペラニ・アレモニに残[のこ]してきた。」"
  3: "今[いま]、あなたの手[て]もとに五[いつ]つのパンがあるなら、見[み]つかるだけをわたしに渡[わた]してほしい。"
  4: "祭司[さいし]はダビデに答[こた]えて言[い]った。「わたしの手[て]もとには俗[ぞく]のパンはない。ただ聖[せい]なるパンがあるだけだ。若者[わかもの]たちが女[おんな]から身[み]を遠[とお]ざけているなら、食[た]べてもよい。」"
  5: "ダビデは祭司[さいし]に答えて言[い]った。「女[おんな]からは、昨日[きのう]も一昨日[おととい]も遠[とお]ざかってきた。わたしが道[みち]に出[で]たとき、若者[わかもの]たちはみな清[きよ]められていた。道[みち]そのものは俗[ぞく]であるが、今日[きょう]はわたしの器[うつわ]によって聖[きよ]められる。」"
  6: "祭司[さいし]アヒメレクは彼に、供[そな]えのパンを与[あた]えた。そこにはパンがなく、ただ主[しゅ]の前[まえ]から取[と]り除[のぞ]かれた臨在[りんざい]のパンだけがあったからである。それは、それを取[と]った日に熱[あつ]いパンを供[そな]えるためであった。"
  7: "その日[ひ]、そこにはサウルの若者[わかもの]の一人[ひとり]が、主[しゅ]の前[まえ]に引[ひ]き留[と]められていた。名[な]はドエグといい、シリア人[じん]で、サウルのらばを飼[か]う者[もの]であった。"
  8: "ダビデはアヒメレクに言[い]った。「ここに、あなたの手[て]もとに槍[やり]か剣[つるぎ]があるか。王[おう]の事[こと]が急[きゅう]であったので、わたしは自分の剣[つるぎ]も武具[ぶぐ]も手[て]に持[も]って来[こ]なかったのだ。」"
  9: "祭司[さいし]は言[い]った。「見[み]よ、ゴリアト・ペリシテ人[じん]の剣[つるぎ]がある。あなたがエラの谷[たに]で撃[う]ち殺[ころ]した者の剣[つるぎ]だ。それは布[ぬの]に包[つつ]まれ、エフォドの後[うし]ろにある。もしそれを取[と]るなら、取[と]るがよい。ここにはそれ以外[いがい]に何[なに]もない。」ダビデは言[い]った。「それに並[なら]ぶものはない。わたしに与[あた]えてほしい。」"
  10: "祭司[さいし]はそれを彼に与[あた]えた。ダビデは立[た]って、その日[ひ]、サウルの前[まえ]から逃[に]げ、ガトの王[おう]アンクスのもとへ来[き]た。"
  11: "アンクスの僕[しもべ]たちは彼に言[い]った。「この者[もの]は、あの地[ち]の王[おう]ダビデではないか。この者のために、踊[おど]る女[おんな]たちが歌[うた]って始[はじ]めたのではないか。『サウルは千[せん]を撃[う]ち、ダビデは万[まん]を撃[う]った』と。」"
  12: "ダビデはこれらの言葉[ことば]を心[こころ]に置[お]き、ガトの王[おう]アンクスをひどく恐[おそ]れた。"
  13: "彼は彼らの前[まえ]で顔[かお]つきを変[か]え、その日[ひ]は気[き]が変[か]わった者[もの]のように振[ふ]るまい、町[まち]の門[もん]を太鼓[たいこ]のように叩[たた]き、両手[りょうて]で体[からだ]を引[ひ]きずり回[まわ]し、門[もん]の戸口[とぐち]に倒[たお]れ、よだれをひげに垂[た]らした。"
  14: "アンクスは僕[しもべ]たちに言[い]った。「見[み]よ、この男[おとこ]が狂[くる]っているのが分[わ]からないのか。なぜ彼をわたしのところへ連[つ]れて来[き]たのか。"
  15: "わたしに狂人[きょうじん]が足[た]りないとでもいうのか。あなたがたは、この者[もの]をわたしの前[まえ]で狂[くる]わせるために連[つ]れて来[き]たのか。この者[もの]をわたしの家[いえ]に入[い]れるな。」"

notes:
  1: "Νομβα — Номва (ノブ). ἐξέστη — изумился, пришёл в смятение (ἐξίστημι); слав. «ужасеся». τῇ ἀπαντήσει αὐτοῦ — при встрече с ним."
  2: "ἐντέταλταί μοι ῥῆμα — заповедал мне слово, дело. Μηδεὶς γνώτω — никто да не узнает. διαμεμαρτύρημαι — торжественно засвидетельствовал, наказал (слав. «оставих» — иное понимание). Θεοῦ πίστις — «Божия верность», название места; Φελλανι Αλεμωνι оставлено без перевода (евр.)."
  3: "εἰ εἰσὶν ὑπὸ τὴν χεῖρά σου πέντε ἄρτοι — если есть у тебя пять хлебов. τὸ εὑρεθέν — найденное, что найдётся."
  4: "ἄρτοι βέβηλοι — хлебы несвященные, обычные (βέβηλος; слав. «простии»). ἄρτοι ἅγιοι — святые. εἰ πεφυλαγμένα… ἀπὸ γυναικός — если соблюдены (воздержались) от женщины, т. е. ритуально чисты."
  5: "ἀπὸ γυναικὸς ἀπεσχήμεθα — воздерживались от женщины (ἀπέχω). ἐχθὲς καὶ τρίτην ἡμέραν — вчера и третий день, т. е. позавчера. ἡγνισμένα — очищены (ἁγνίζω). βέβηλος — обычный, несвященный. ἁγιασθήσεται… διὰ τὰ σκεύη μου — освятится ради сосудов моих."
  6: "ἄρτοι τῆς προθέσεως — хлебы предложения (供えのパン); ἄρτοι τοῦ προσώπου — хлебы лица (臨在のパン), то же самое. ἀφῃρημένοι ἐκ προσώπου κυρίου — взятые от лица Господня. παρατεθῆναι ἄρτον θερμόν — чтобы положить горячий хлеб."
  7: "συνεχόμενος νεεσσαραν — «удерживаемый [словом] неессара» (евр. неясно; слав. «удержан»). Δωηκ ὁ Σύρος — Доик Сириянин (слав. «сирин»); в ru и Пс 51 — идумеянин (иное чтение). νέμων τὰς ἡμιόνους — пасущий мулов (ἡμίονος)."
  8: "δόρυ ἢ ῥομφαία — копьё или меч. κατὰ σπουδήν — по спешности, срочно. τὰ σκεύη — оружие, вещи."
  9: "Γολιαθ τοῦ ἀλλοφύλου — Голиаф иноплеменник (ペリシテ人). κοιλὰς Ηλα — долина Ила (エラ). ἐνειλημμένη ἐν ἱματίῳ — завёрнутый в одежду. ἐφούδ — ефод (エフォド). οὐκ ἔστιν ὥσπερ αὐτή — нет подобной ей."
  10: "ἔδωκεν αὐτὴν αὐτῷ — дал её ему (слав. относит это к 21:9). ἔφυγεν… ἐκ προσώπου Σαυλ — убежал от лица Саула. Αγχους — Анхус (アンクス), царь Гефский (ガト)."
  11: "βασιλεὺς τῆς γῆς — царь земли, т. е. той страны. ἐξῆρχον αἱ χορεύουσαι — начинали хороводы (ἐξάρχω). ἐν χιλιάσιν… ἐν μυριάσιν — тысячами и тьмами. Песня — 『…』, так как вложена в речь слуг."
  12: "ἔθετο… ἐν τῇ καρδίᾳ — положил в сердце. ἐφοβήθη σφόδρα — сильно испугался."
  13: "ἠλλοίωσεν τὸ πρόσωπον — изменил лицо. προσεποιήσατο — притворился (προσποιέω). ἐτυμπάνιζεν — бил как в тимпан (τυμπανίζω; слав. «бияше… яко в тимпан»). παρεφέρετο ἐν ταῖς χερσίν — двигался, метался руками. σίελα — слюна. πώγων — борода."
  14: "ἐπίλημπτος — безумный, одержимый (ἐπίλημπτος). ἵνα τί — зачем. εἰσηγάγετε — вы ввели (εἰσάγω)."
  15: "ἦ ἐλαττοῦμαι ἐπιλήμπτων ἐγώ — «разве я нуждаюсь в безумных» (ἐλαττόομαι — терпеть недостаток). εἰσαγειόχατε — вы ввели (перфект). ἐπιλημπτεύεσθαι — безумствовать. οὐκ εἰσελεύσεται εἰς οἰκίαν — не войдёт в дом."
