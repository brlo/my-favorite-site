verses:
  1: "干[かん]ばつについて、主[しゅ]からエレミヤに臨[のぞ]んだ言葉[ことば]。"
  2: "ユダは嘆[なげ]き、その門[もん]は空[から]になり、地[ち]の上[うえ]で暗[くら]くなった。エルサレムの叫[さけ]びは上[のぼ]った。"
  3: "その貴族[きぞく]たちは、若[わか]い者[もの]たちを水[みず]のために遣[つか]わした。彼らは井戸[いど]のところへ来[き]て、水[みず]を見[み]いだせず、空[から]の器[うつわ]を持[も]ち帰[かえ]った。彼らは恥[は]じ、辱[はずかし]められ、頭[あたま]を覆[おお]った。"
  4: "地[ち]の業[わざ]は尽[つ]きた。雨[あめ]が地[ち]に降[ふ]らなかったからである。農夫[のうふ]たちは恥[は]じて、頭[あたま]を覆[おお]った。"
  5: "野[の]の雌鹿[めじか]は子[こ]を産[う]んで、それを捨[す]てた。草[くさ]がなかったからである。"
  6: "野[の]ろばは岩[いわ]の上[うえ]に立[た]ち、蛇[へび]のように空気[くうき]を吸[す]い込[こ]んだ。草[くさ]がなく、不法[ふほう]の民[たみ]のゆえに、彼らの目[め]は衰[おとろ]えた。"
  7: "たとえ、わたしたちの罪[つみ]がわたしたちを訴[うった]えても、主[しゅ]よ、あなたの名[な]のゆえに、わたしたちのために働[はたら]いてください。わたしたちの背[そむ]きは多[おお]く、わたしたちはあなたに罪[つみ]を犯[おか]しました。"
  8: "イスラエルの望[のぞ]み、苦[くる]しみの時[とき]の救[すく]い主[ぬし]よ。なぜ、あなたはこの地[ち]で旅人[たびびと]のように、宿[やど]りに立[た]ち寄[よ]る他国[たこく]の者[もの]のようになったのか。"
  9: "なぜ、あなたは眠[ねむ]る人[ひと]のように、救[すく]う力[ちから]のない男[おとこ]のようになるのだろうか。しかし、主[しゅ]よ、あなたはわたしたちの間[あいだ]におり、あなたの名[な]はわたしたちの上[うえ]に呼[よ]ばれている。わたしたちを忘[わす]れないでください。"
  10: "主[しゅ]はこの民[たみ]についてこう言[い]われる。「彼らは足[あし]を動[うご]かすことを愛[あい]し、これを控[ひか]えなかった。神[かみ]は彼らを喜[よろこ]ばれなかった。今[いま]、神は彼らの不法[ふほう]を思[おも]い起[おこ]し、彼らの罪[つみ]を罰[ばっ]される。」"
  11: "主[しゅ]はわたしに言[い]われた。「この民[たみ]のために、良[よ]いことを祈[いの]ってはならない。"
  12: "彼らが断食[だんじき]しても、わたしはその願[ねが]いを聞[き]かない。彼らが燔祭[はんさい]と犠牲[ぎせい]をささげても、わたしは彼らを喜[よろこ]ばない。わたしは剣[つるぎ]と飢[うえ]えと死[し]によって、彼らを滅[ほろ]ぼし尽[つ]くす。」"
  13: "わたしは言[い]った。「ああ、主[しゅ]よ、神[かみ]よ。見[み]てください。預言者[よげんしゃ]たちは彼らに預言[よげん]して、『あなたがたは剣[つるぎ]を見[み]ず、飢[うえ]えもあなたがたの間[あいだ]に起[おこ]らない。この地[ち]とこの場所[ばしょ]に、わたしは真[しん]の平和[へいわ]を与[あた]える』と言[い]っています。」"
  14: "主[しゅ]はわたしに言[い]われた。「預言者[よげんしゃ]たちはわたしの名[な]によって偽[いつわ]りを預言[よげん]している。わたしは彼らを遣[つか]わさず、彼らに命[めい]じもせず、彼らに語[かた]りもしなかった。彼らはあなたがたに、偽[いつわ]りの幻[まぼろし]と占[うらな]いと、まじないと、自分[じぶん]の心[こころ]の望[のぞ]みとを預言[よげん]している。"
  15: "それゆえ、主[しゅ]は、わたしの名[な]によって偽[いつわ]りを預言[よげん]し、わたしが遣[つか]わさなかった預言者[よげんしゃ]たちについて、こう言[い]われる。彼らは『剣[つるぎ]と飢[うえ]えはこの地[ち]に起[おこ]らない』と言[い]っている。その預言者[よげんしゃ]たちは悪[わる]い病[やまい]で死[し]ぬ。飢[うえ]えで滅[ほろ]び尽[つ]くされる。"
  16: "また、彼らが預言[よげん]する民[たみ]は、剣[つるぎ]と飢[うえ]えのゆえにエルサレムの通[とお]りに投[な]げ捨[す]てられ、葬[ほうむ]る者[もの]もいない。彼らの妻[つま]、息子[むすこ]たち、娘[むすめ]たちも。わたしは彼らの上[うえ]に彼らの悪[あく]を注[そそ]ぐ。"
  17: "そして、あなたは彼らにこの言葉[ことば]を言[い]え。あなたがたの目[め]から、昼[ひる]も夜[よる]も涙[なみだ]が流[なが]れよ。やむことのないように。わたしの民[たみ]の娘[むすめ]は、大[おお]きな打[う]ち砕[くだ]きで打ち砕[くだ]かれ、ひどい傷[きず]を受[う]けたからである。"
  18: "わたしが野[の]に出[で]れば、見[み]よ、剣[つるぎ]で殺[ころ]された者[もの]たち。町[まち]に入[い]れば、見[み]よ、飢[うえ]えによる苦[くる]しみ。祭司[さいし]も預言者[よげんしゃ]も、自分[じぶん]たちの知[し]らない地[ち]へ行[い]ってしまった。」"
  19: "「あなたはユダを全[まった]く退[しりぞ]けたのか。あなたの魂[たましい]はシオンから離[はな]れたのか。なぜ、あなたはわたしたちを打[う]って、癒[いや]しがないのか。わたしたちは平和[へいわ]を待[ま]ち望[のぞ]んだが、良[よ]いものはなかった。癒[いや]しの時[とき]を待ったが、見[み]よ、恐[おそ]れであった。"
  20: "主[しゅ]よ、わたしたちは自分[じぶん]の罪[つみ]と、父[ちち]たちの不法[ふほう]を知[し]っています。わたしたちはあなたに罪[つみ]を犯[おか]しました。"
  21: "あなたの名[な]のゆえに、やめてください。あなたの栄光[えいこう]の位[くらい]を滅[ほろ]ぼさないでください。思[おも]い起[おこ]して、わたしたちと結[むす]んだあなたの契約[けいやく]を破[やぶ]らないでください。"
  22: "国々[くにぐに]の偶像[ぐうぞう]のうちに、雨[あめ]を降[ふ]らせる者[もの]があるだろうか。天[てん]が自分[じぶん]で豊[ゆた]かな雨[あめ]を与[あた]えられるだろうか。わたしたちの神[かみ]、主[しゅ]よ、あなたではないか。わたしたちはあなたを待[ま]ち望[のぞ]みます。あなたがすべてこれらのことをなさったからです。」"

notes:
  1: "Καὶ ἐγένετο λόγος κυρίου πρὸς Ιερεμιαν περὶ τῆς ἀβροχίας — «и было слово Господне к Иеремии о бездождии» (ἀβροχία — бездождие, засуха; слав. «о бездождии»). Надписание, не речь; кавычек нет, 14:2–6 — описание бедствия."
  2: "Ἐπένθησεν ἡ Ιουδαία — «восплакала Иудея» (πενθέω; слав. «рыдала иудеа»); αἱ πύλαι αὐτῆς ἐκενώθησαν — «врата её опустели» (κενόω; слав. «разрушишася» — иное понимание того же места); ἐσκοτώθησαν ἐπὶ τῆς γῆς — «потемнели на земле» (σκοτόω); ἡ κραυγὴ τῆς Ιερουσαλημ ἀνέβη — «вопль Иерусалима поднялся» (κραυγή, ἀναβαίνω)."
  3: "οἱ μεγιστᾶνες — «вельможи» (μεγιστάν; слав. «вельможи»); τοὺς νεωτέρους αὐτῶν — «младших своих» (νεώτερος; слав. «менших своих»); ἐφ᾽ ὕδωρ — «за водой»; φρέατα — «колодцы» (φρέαρ; слав. «кладязи»); ἀπέστρεψαν τὰ ἀγγεῖα αὐτῶν κενά — «возвратили сосуды свои пустыми» (ἀγγεῖον — сосуд; слав. «отнесоша сосуды своя тщы»). В конце слав. добавляет «постыждени суть и посрамлени, и покрыша главы своя» (по МТ; в LXX это только в 14:4) — внесено без скобок (恥じ、辱められ、頭を覆った)."
  4: "τὰ ἔργα τῆς γῆς ἐξέλιπεν — «дела земли оскудели» (ἐκλείπω; слав. «оскудеша»); ὅτι οὐκ ἦν ὑετός — «ибо не было дождя» (ὑετός); ᾐσχύνθησαν γεωργοί — «устыдились земледельцы» (αἰσχύνω, γεωργός); ἐπεκάλυψαν τὴν κεφαλὴν αὐτῶν — «покрыли голову свою» (ἐπικαλύπτω)."
  5: "ἔλαφοι ἐν ἀγρῷ ἔτεκον — «лани в поле родили» (ἔλαφος — лань, 雌鹿; τίκτω); ἐγκατέλιπον — «оставили [детей]» (ἐγκαταλείπω); ὅτι οὐκ ἦν βοτάνη — «ибо не было травы» (βοτάνη — зелень, пастбище; слав. «трава»)."
  6: "ὄνοι ἄγριοι — «дикие ослы» (ὄνος ἄγριος; слав. «онагри»); ἔστησαν ἐπὶ νάπας — «стали в лощинах, зарослях» (νάπη — лощина); слав. читает «на камениих» (岩の上) — взято слав. чтение, в notes ради LXX. εἵλκυσαν ἄνεμον — «втянули воздух» (ἕλκω — тянуть; слав. «браша в себе ветр»); ἐξέλιπον οἱ ὀφθαλμοὶ αὐτῶν — «оскудели очи их»; ὅτι οὐκ ἦν χόρτος ἀπὸ λαοῦ ἀδικίας — «ибо не было травы, [и] от народа неправды»: конец стиха тёмен, в слав. опущен («яко не бе травы»), передан двумя основаниями (草がなく、不法の民のゆえに)."
  7: "εἰ αἱ ἁμαρτίαι ἡμῶν ἀντέστησαν ἡμῖν — «если грехи наши восстали на нас» (ἀνθίστημι; слав. «противусташа нам»); ποίησον ἡμῖν ἕνεκεν σοῦ — «сделай нам ради Тебя»; слав. «ради имене твоего» — по МТ, взято слав. чтение (あなたの名のゆえに). ὅτι σοὶ ἡμάρτομεν — «ибо Тебе согрешили». С 14:7 начинается молитва общины — 「…」."
  8: "ὑπομονὴ Ισραηλ — «терпение (ожидание) Израиля» (ὑπομονή; слав. «Ожидание израилево»); σῴζεις ἐν καιρῷ κακῶν — «спасаешь во время бедствий» (σῴζω); ἵνα τί ἐγενήθης ὡσεὶ πάροικος — «зачем Ты стал как пришелец?» (πάροικος — поселенец, 旅人); αὐτόχθων — «туземец» (слав. «путник»); ἐκκλίνων εἰς κατάλυμα — «сворачивающий на ночлег» (κατάλυμα — гостиница, 宿り)."
  9: "μὴ ἔσῃ ὥσπερ ἄνθρωπος ὑπνῶν…; — вопрос с μή, ожидающий отрицания, сохранён вопросом (眠る人のようになるのだろうか). ἀνὴρ οὐ δυνάμενος σῴζειν — «муж, не могущий спасать» (слав. «не могий спасти»); ru «изумленный» — по МТ, не внесено. καὶ σὺ ἐν ἡμῖν εἶ — «и Ты в нас» (слав. «ты же в нас еси»); τὸ ὄνομά σου ἐπικέκληται ἐφ᾽ ἡμᾶς — «имя Твоё наречено на нас» (ἐπικαλέω); μὴ ἐπιλάθῃ ἡμῶν — «не забудь нас» (ἐπιλανθάνομαι)."
  10: "οὕτως λέγει κύριος τῷ λαῷ τούτῳ — «так говорит Господь этому народу»: формула вне кавычек. Ἠγάπησαν κινεῖν πόδας αὐτῶν — «возлюбили двигать ноги свои» (κινέω; слав. «возлюбиша подвизати нозе свои»); οὐκ ἐφείσαντο — «не пощадили, не удержались» (φείδομαι; слав. «не упокоишася»); ὁ θεὸς οὐκ εὐδόκησεν ἐν αὐτοῖς — «Бог не благоволил к ним» (εὐδοκέω). Слав. добавляет «и посетит грехи их» — нет в LXX, внесено (彼らの罪を罰される)."
  11: "Μὴ προσεύχου περὶ τοῦ λαοῦ τούτου εἰς ἀγαθά — «не молись о народе этом во благо» (слав. «не молися… во благо»). Новая вводная формула — вне кавычек."
  12: "ἐὰν νηστεύσωσιν — «если будут поститься» (νηστεύω; слав. «егда поститися будут»); οὐκ εἰσακούσομαι τῆς δεήσεως αὐτῶν — «не услышу моления их» (δέησις); ὁλοκαυτώματα καὶ θυσίας — «всесожжения и жертвы» (ὁλοκαύτωμα, θυσία); οὐκ εὐδοκήσω ἐν αὐτοῖς — «не благоволю к ним»; ἐν μαχαίρᾳ καὶ ἐν λιμῷ καὶ ἐν θανάτῳ — «мечом, голодом и смертью» (λιμός — голод; θάνατος — смерть; слав. «мечем и гладом и мором»); συντελέσω — «истреблю» (συντελέω)."
  13: "Ὦ κύριε — «о Господи» (слав. «сый Господи Боже», «Боже» — слав. добавление). οἱ προφῆται αὐτῶν προφητεύουσιν — «пророки их пророчествуют»: их слова — 『…』. Οὐκ ὄψεσθε μάχαιραν — «не увидите меча»; ἀλήθειαν καὶ εἰρήνην δώσω — «истину и мир дам»; ἐπὶ τῆς γῆς καὶ ἐν τῷ τόπῳ τούτῳ — «на земле и на месте этом»."
  14: "Ψευδῆ οἱ προφῆται προφητεύουσιν ἐπὶ τῷ ὀνόματί μου — «ложное пророки пророчествуют именем Моим» (ψευδῆ — ложное); οὐκ ἀπέστειλα αὐτοὺς καὶ οὐκ ἐνετειλάμην αὐτοῖς — «Я не посылал их и не заповедал им» (ἀποστέλλω, ἐντέλλομαι); ὁράσεις ψευδεῖς — «видения ложные» (ὅρασις); μαντεῖαι — «гадания» (μαντεία); οἰωνίσματα — «птицегадания, приметы» (οἰώνισμα); προαιρέσεις καρδίας αὐτῶν — «произволения сердца их» (προαίρεσις; слав. «произволы сердца своего»)."
  15: "ἐν θανάτῳ νοσερῷ ἀποθανοῦνται — «смертью болезненной умрут» (νοσερός — болезненный; слав. «смертию лютою умрут»); ἐν λιμῷ συντελεσθήσονται — «голодом истреблены будут» (συντελέω). Слова лжепророков — 『…』; формула «так говорит Господь» стоит внутри речи и оставлена в кавычках, чтобы не разрывать слово Господа."
  16: "ἔσονται ἐρριμμένοι ἐν ταῖς διόδοις Ιερουσαλημ — «будут брошены на перекрёстках Иерусалима» (ῥίπτω — бросать; δίοδος — проход, перекрёсток; слав. «извержени на путех»); οὐκ ἔσται ὁ θάπτων αὐτούς — «не будет погребающего их» (θάπτω); ἐκχεῶ ἐπ᾽ αὐτοὺς τὰ κακὰ αὐτῶν — «изолью на них зло их» (ἐκχέω; слав. «излию на них злая их»)."
  17: "Καταγάγετε ἐπ᾽ ὀφθαλμοὺς ὑμῶν δάκρυα — «сведите на глаза ваши слёзы», т. е. плачьте (κατάγω; слав. «да изведут очи ваши слезы»): в LXX и слав. 2-е л. мн. ч., у ru (МТ) — 1-е л. («из глаз моих»). μὴ διαλιπέτωσαν — «да не перестанут» (διαλείπω); συντρίμματι συνετρίβη — «сокрушением сокрушена» (σύντριμμα, συντρίβω; слав. «сотрением великим сотрена»); πληγῇ ὀδυνηρᾷ σφόδρα — «раной весьма болезненной» (ὀδυνηρός); θυγάτηρ λαοῦ μου — «дочь народа Моего»."
  18: "ἐὰν ἐξέλθω εἰς τὸ πεδίον — «если я выйду в поле» (πεδίον — равнина, поле): здесь 1-е л. ед. ч., хотя в 14:17 было 2-е л. мн. ч.; смешение лиц сохранено, как в LXX и слав. τραυματίαι μαχαίρας — «поражённые мечом» (τραυματίας; слав. «заклани мечем»); πόνος λιμοῦ — «мука голода» (πόνος; слав. «истаявшии гладом»); ἱερεὺς καὶ προφήτης ἐπορεύθησαν εἰς γῆν, ἣν οὐκ ᾔδεισαν — «священник и пророк пошли в землю, которой не знали» (слав. «отидоша в землю, еяже не ведяху»)."
  19: "μὴ ἀποδοκιμάζων ἀπεδοκίμασας τὸν Ιουδαν — «разве, отвергнув, Ты отверг Иуду?» (ἀποδοκιμάζω; слав. «еда отмещущь отвергл еси иуду»): удвоение глагола сохранено (全く退けたのか). ἀπὸ Σιων ἀπέστη ἡ ψυχή σου — «от Сиона отступила душа Твоя» (ἀφίστημι); ἵνα τί ἔπαισας ἡμᾶς — «зачем Ты поразил нас?» (παίω); οὐκ ἔστιν ἡμῖν ἴασις — «нет нам исцеления» (ἴασις); ὑπεμείναμεν εἰς εἰρήνην — «мы ждали мира» (ὑπομένω); εἰς καιρὸν ἰάσεως — «ко времени исцеления»; ταραχή — «смятение» (слав. «боязнь»). С 14:19 начинается молитва общины — 「…」."
  20: "ἔγνωμεν — «мы познали» (γινώσκω; слав. «познахом»); ἁμαρτήματα ἡμῶν, ἀδικίας πατέρων ἡμῶν — «грехи наши, беззакония отцов наших»; ὅτι ἡμάρτομεν ἐναντίον σου — «ибо мы согрешили пред Тобою»."
  21: "κόπασον διὰ τὸ ὄνομά σου — «утихни ради имени Твоего» (κοπάζω — утихать; слав. «престани ради имене твоего»); μὴ ἀπολέσῃς θρόνον δόξης σου — «не погуби престола славы Твоей» (θρόνος; слав. «не погуби престола славы твоея»); μὴ διασκεδάσῃς τὴν διαθήκην σου — «не разори завета Твоего» (διασκεδάννυμι; слав. «не разори завета твоего»)."
  22: "μὴ ἔστιν ἐν εἰδώλοις τῶν ἐθνῶν ὑετίζων — «есть ли среди идолов народов дающий дождь?» (ὑετίζω — дождить; слав. «еда есть во изваянных языческих, иже дождит»); ὁ οὐρανὸς δώσει πλησμονὴν αὐτοῦ — «небо даст полноту свою», т. е. ливень (πλησμονή — полнота); οὐχὶ σὺ εἶ αὐτός — «не Ты ли это?»; ὑπομενοῦμέν σε — «мы будем ждать Тебя» (слав. «пождем тебе»); σὺ ἐποίησας πάντα ταῦτα — «Ты сделал всё это». Слав. добавляет «Господи Боже наш» — в LXX нет «наш», внесено (わたしたちの神、主よ)."
