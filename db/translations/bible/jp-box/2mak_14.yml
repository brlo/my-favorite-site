verses:
  1: "三年[さんねん]の後[のち]、セレウコスの子[こ]デメトリオスが、トリポリスの港[みなと]を通[とお]って強力[ごうりき]な軍[ぐん]と艦隊[かんたい]を率[ひき]いて上陸[じょうりく]したという知[し]らせが、ユダとその仲間[なかま]たちに届[とど]いた。"
  2: "そして、その地方[ちほう]を治[おさ]め、アンティオコスとその後見[こうけん]リュシアスを殺[ころ]したというのである。"
  3: "さて、アルキモスという者[もの]がいた。彼[かれ]は以前[いぜん]大祭司[だいさいし]であったが、混迷[こんめい]の時代[じだい]に自[みずか]ら汚[けが]れを負[お]った者[もの]で、どんな手[て]を使[つか]っても自分[じぶん]に救[すく]いはなく、もはや聖[せい]なる祭壇[さいだん]に近[ちか]づくこともできないと悟[さと]り、"
  4: "第百五十一年[だいひゃくごじゅういちねん]に、王[おう]デメトリオスのもとへ来[き]て、金[きん]の冠[かんむり]と椰子[やし]の枝[えだ]、さらに神殿[しんでん]のものとみなされていた枝[えだ]をささげた。そして、その日[ひ]は何事[なにごと]も起[お]こさなかった。"
  5: "しかし、自分[じぶん]の愚[おろ]かさに都合[つごう]のよい時[とき]が来[き]たので、デメトリオスに会議[かいぎ]へ呼[よ]ばれ、ユダヤ人[じん]がどんな気持[きも]ちと方針[ほうしん]でいるのかと問[と]われると、こう答[こた]えた。"
  6: "「ユダヤ人[じん]のうちでアシデイ人[じん]と呼[よ]ばれる者[もの]たちがいます。その指導者[しどうしゃ]がユダ・マッカバイオスです。彼らは戦[いくさ]を続[つづ]け、反乱[はんらん]を起[お]こして、王国[おうこく]が安定[あんてい]を得[え]るのを許[ゆる]しません。"
  7: "それゆえ、わたしは先祖[せんぞ]の名誉[めいよ]、すなわち大祭司[だいさいし]の職[しょく]を奪[うば]われて、ここに参[まい]りました。"
  8: "第一[だいいち]に王[おう]に属[ぞく]する事[こと]に誠実[せいじつ]に心[こころ]を配[くば]り、第二[だいに]に同胞[どうほう]のことを思[おも]ってのことです。先[さき]に述[の]べた者[もの]たちの無分別[むふんべつ]のゆえに、わたしたちの種族[しゅぞく]全体[ぜんたい]が少[すこ]しならず苦[くる]しんでいます。"
  9: "王[おう]よ、どうかこれらのことを一つ一つご承知[しょうち]のうえ、この地方[ちほう]と、取[と]り囲[かこ]まれているわたしたちの種族[しゅぞく]のことを、あなたがすべての人[ひと]に対して持[も]っておられる深[ふか]い人[じん]道[どう]心[しん]によってお考[かんが]えください。"
  10: "というのは、ユダがいるかぎり、物事[ものごと]が平和[へいわ]のうちに収[おさ]まることはありえないからです。」"
  11: "彼[かれ]がこのように語ると、ほかの友[とも]たちも、ユダに対して敵意[てきい]を抱[いだ]いていたので、いっそうデメトリオスを焚[た]きつけた。"
  12: "そこで王[おう]はすぐに、象[ぞう]の部隊[ぶたい]の長[ちょう]であったニカノルを選[えら]び、ユダヤの将軍[しょうぐん]に任[にん]じて遣[つか]わした。"
  13: "そして、ユダ自身[じしん]を殺[ころ]し、彼[かれ]とともにいる者[もの]たちを散[ち]らし、アルキモスを大[だい]いなる神殿[しんでん]の大祭司[だいさいし]に据[す]えるように命[めい]じた。"
  14: "すると、ユダから逃[に]げてユダヤを出[で]ていた異邦人[いほうじん]たちが、群[む]れをなしてニカノルのもとへ集[あつ]まってきた。彼らは、ユダヤ人[じん]の不幸[ふこう]と災[わざわ]いが自分[じぶん]たちの幸[しあわ]せになると考[かんが]えたのである。"
  15: "ユダヤ人[じん]たちは、ニカノルの進撃[しんげき]と異邦人[いほうじん]の攻撃[こうげき]を聞[き]くと、頭[あたま]に土[つち]をかけて、永遠[えいえん]にご自分[じぶん]の民[たみ]を立[た]て、いつも顕現[けんげん]をもってご自分[じぶん]の受[う]け持[も]ちを守[まも]ってこられた方[かた]に願[ねが]った。"
  16: "そして、その指導者[しどうしゃ]の命令[めいれい]によって、ただちにそこを発[た]ち、デッサウという村[むら]の近[ちか]くで彼らと戦[たたか]った。"
  17: "ユダの兄弟[きょうだい]シモンはニカノルと戦[たたか]い、敵[てき]が不意[ふい]に現[あら]われたために、少[すこ]し後[おく]れをとった。"
  18: "しかしニカノルは、ユダとともにいる者[もの]たちの勇気[ゆうき]と、父[ちち]の国[くに]のための戦[たたか]いにおける気概[きがい]を聞[き]いて、血[ち]を流[なが]して決[けっ]着[ちゃく]をつけることを恐[おそ]れた。"
  19: "それゆえ、ポシデオニオス、テオドトス、マタティアを遣[つか]わして、手[て]を結[むす]ぶようにと伝[つた]えた。"
  20: "このことについて長[なが]く検討[けんとう]が重[かさ]ねられ、指導者[しどうしゃ]が民[たみ]に諮[はか]って意見[いけん]が一致[いっち]したので、彼らは協定[きょうてい]に同意[どうい]した。"
  21: "そして、彼らがひそかに会[あ]う日[ひ]を定[さだ]め、それぞれの側[がわ]から椅子[いす]が運[はこ]ばれて席[せき]が設[もう]けられた。"
  22: "ユダは、敵[てき]から不意[ふい]に悪[わる]だくらみが起[お]こらないようにと、武具[ぶぐ]を帯[お]びた者[もの]たちを都合[つごう]のよい場所[ばしょ]に配置[はいち]した。そして、二人[ふたり]はふさわしい話[はなし]を交[か]わした。"
  23: "ニカノルはエルサレムに滞在[たいざい]し、何[なに]ひとつ不都合[ふつごう]なことをせず、集[あつ]まってきた群衆[ぐんしゅう]を帰[かえ]らせた。"
  24: "そしていつもイウダを自分[じぶん]のそばに置[お]き、心[こころ]からこの人[ひと]に引[ひ]き寄[よ]せられた。"
  25: "そして、妻[つま]を迎[むか]えて子[こ]どもをもうけるように勧[すす]めた。彼[かれ]は結婚[けっこん]し、穏[おだ]やかに暮[く]らし、生[い]きる喜[よろこ]びを分[わ]け合[あ]った。"
  26: "しかしアルキモスは、二人[ふたり]が互[たが]いに好意[こうい]を持[も]ち、結[むす]ばれた協定[きょうてい]を見[み]て、デメトリオスのもとへ行[い]き、ニカノルは国[くに]の事[こと]についてよからぬことを考[かんが]えている、王国[おうこく]の陰謀[いんぼう]者[しゃ]であるユダを自分[じぶん]の後継[あとつ]ぎにした、と言[い]った。"
  27: "王[おう]は怒[いか]りに燃[も]え、この悪党[あくとう]の中傷[ちゅうしょう]に腹[はら]を立[た]てて、ニカノルに手紙[てがみ]を書[か]き、この協定[きょうてい]は耐[た]えがたい、マッカバイオスを縛[しば]ってすぐアンティオキアへ送[おく]るように、と命[めい]じた。"
  28: "この知[しら]せがニカノルに届[とど]くと、彼[かれ]は動揺[どうよう]し、何[なに]ひとつ悪[わる]いことをしていない人[ひと]との約束[やくそく]を破[やぶ]らねばならないことを重[おも]く受[う]け止[と]めた。"
  29: "しかし、王[おう]に逆[さから]うことはできなかったので、彼[かれ]はこれを戦[いくさ]の策略[さくりゃく]で果[は]たす好機[こうき]を待[ま]った。"
  30: "一方[いっぽう]、マッカバイオスは、ニカノルが自分[じぶん]に前[まえ]よりも厳[きび]しく接[せっ]し、いつもの応対[おうたい]も無骨[ぶこつ]になったのを見[み]て、この厳[きび]しさは良[よ]いことから出[で]たものではないと悟[さと]り、自分[じぶん]の周[まわ]りにいる者[もの]をかなり集[あつ]めて、ニカノルから身[み]を隠[かく]した。"
  31: "相手[あいて]は、この人[ひと]が雄々[おお]しく先手[さきて]を打[う]ったと知[し]ると、大[だい]いなる聖[せい]なる神殿[しんでん]へ行[い]き、祭司[さいし]たちが定[さだ]められた犠牲[ぎせい]をささげているときに、この人[ひと]を引[ひ]き渡[わた]すように命[めい]じた。"
  32: "彼らが、あの求[もと]めている者[もの]がどこにいるか知[し]らないと誓[ちか]って言[い]うと、"
  33: "彼[かれ]は神殿[しんでん]に向[む]かって右手[みぎて]を差[さ]し伸[の]べ、こう誓[ちか]った。「もし、あなたがたがユダを縛[しば]ってわたしに引[ひ]き渡[わた]さないなら、わたしはこの神[かみ]の神殿[しんでん]を野[の]っ原[ぱら]にし、祭壇[さいだん]を掘[ほ]り崩[くず]し、ここにディオニソスのための立派[りっぱ]な聖所[せいしょ]を建[た]てる。」"
  34: "こう言[い]って彼[かれ]は去[さ]った。祭司[さいし]たちは天[てん]へ向[む]かって手[て]を差[し]伸[の]べ、いつもわたしたちの民[たみ]を守[まも]ってくださる方[かた]を呼[よ]び求[もと]めて、こう言[い]った。"
  35: "「すべてのものの主[しゅ]よ、あなたはいかなるものも必要[ひつよう]とされない方[かた]ですが、あなたが住[す]まわれる神殿[しんでん]がわたしたちの間[あいだ]にあることを喜[よろこ]ばれました。"
  36: "そして今[いま]、すべての聖[せい]なるもののうちの聖[せい]なる主[しゅ]よ、つい最近[さいきん]清[きよ]められたこの家[いえ]を、永遠[えいえん]に汚[けが]れなく保[たも]ってください。」"
  37: "さて、ラジスという者[もの]が、エルサレムの長老[ちょうろう]たちの一人[ひとり]としてニカノルに密告[みっこく]された。彼[かれ]は市民[しみん]を愛[あい]する人[ひと]で、非常[ひじょう]に良[よ]い評判[ひょうばん]を得[え]ており、その好意[こうい]のゆえにユダヤ人[じん]の父[ちち]と呼[よ]ばれていた。"
  38: "というのは、以前[いぜん]の混迷[こんめい]の時代[じだい]に、彼[かれ]はユダヤの信仰[しんこう]のために裁判[さいばん]に立[た]ち、ユダヤの信仰のために体[からだ]も魂[たましい]も惜[お]しまず差[さ]し出[だ]していたからである。"
  39: "ニカノルは、ユダヤ人[じん]に対して抱[いだ]いている敵意[てきい]を明[あき]らかにしようとして、五百人[ごひゃくにん]を超[こ]える兵[へい]を遣[つか]わして彼[かれ]を捕[と]らえさせた。"
  40: "彼[かれ]を捕[と]らえれば、自分[じぶん]たちに災[わざわ]いをもたらすことができると考[かんが]えたのである。"
  41: "しかし、群衆[ぐんしゅう]が塔[とう]を取[と]ろうとして庭[にわ]の門[もん]に押[お]し寄[よ]せ、火[ひ]を持[も]って来[き]て門[もん]を焼[や]くように命[めい]じるに及[およ]んで、彼[かれ]は包囲[ほうい]されて逃[に]げ場[ば]を失[うしな]い、自[みずか]ら剣[けん]の上[うえ]に倒[たお]れかかった。"
  42: "不法[ふほう]な者[もの]たちの手[て]に渡[わた]されたり、自分[じぶん]の高貴[こうき]さにふさわしくない辱[はずかし]めを受[う]けたりするよりは、立派[りっぱ]に死[し]のうと望[のぞ]んだのである。"
  43: "しかし、急[いそ]いだために急所[きゅうしょ]を外[はず]し、群衆[ぐんしゅう]が入口[いりぐち]から押[お]し入[はい]ってきたので、彼[かれ]は勇気[ゆうき]を振[ふ]るって壁[かべ]の上[うえ]へ駆[か]け上[のぼ]り、群衆[ぐんしゅう]の中[なか]へ雄々[おお]しく身[み]を投[な]げた。"
  44: "人[ひと]々[びと]がすばやく後[あと]へ退[しりぞ]いて間[あいだ]ができると、彼[かれ]は体[からだ]の真[ま]ん中[なか]を地面[じめん]に打[う]ちつけた。"
  45: "まだ息[いき]があり、怒[いか]りに燃[も]えていた彼[かれ]は、血[ち]が流[なが]れ出[で]て傷[きず]も重[おも]かったにもかかわらず、起[お]き上[あ]がって群衆[ぐんしゅう]の間[あいだ]を駆[か]け抜[ぬ]け、切[き]り立[た]った岩[いわ]の上[うえ]に立[た]った。"
  46: "そして、ほとんど血[ち]を失[うしな]いながら、自分の内臓[ないぞう]を引[ひ]き出[だ]して両手[りょうて]でつかみ、群衆[ぐんしゅう]に投[な]げつけ、命[いのち]と霊[れい]を治[おさ]める方[かた]を呼[よ]び求[もと]めて、これらを再[ふたた]び自分[じぶん]に返[かえ]してくださるようにと願[ねが]い、こうして世[よ]を去[さ]った。"

notes:
  1: "Μετὰ δὲ τριετῆ χρόνον — «через три года»; Δημήτριον τὸν τοῦ Σελεύκου — «Димитрия, сына Селевка» (デメトリオス); διὰ τοῦ κατὰ Τρίπολιν λιμένος εἰσπλεύσαντα — «войдя в пристань при Триполисе» (トリポリス); μετὰ πλήθους ἰσχυροῦ καὶ στόλου — «с сильным множеством и флотом»."
  2: "κεκρατηκέναι τῆς χώρας — «овладеть страной» (κρατέω); ἐπανελόμενον Ἀντίοχον καὶ τὸν τούτου ἐπίτροπον Λυσίαν — «умертвив Антиоха и его опекуна Лисия» (ἀναιρέομαι)."
  3: "προγεγονὼς ἀρχιερεύς — «бывший прежде первосвященником»; ἑκουσίως δὲ μεμολυσμένος — «добровольно осквернившийся» (μολύνω); ἐν τοῖς τῆς ἀμειξίας χρόνοις — «во времена смешения (с язычниками)» (ἀμειξία); οὐδὲ πρὸς τὸ ἅγιον θυσιαστήριον ἔτι πρόσοδος — «и нет доступа к святому жертвеннику» (πρόσοδος)."
  4: "ὡς πρώτῳ καὶ πεντηκοστῷ καὶ ἑκατοστῷ ἔτει — «в сто пятьдесят первом году»; στέφανον χρυσοῦν καὶ φοίνικα — «венец золотой и пальму» (φοῖνιξ); τῶν νομιζομένων θαλλῶν τοῦ ἱεροῦ — «из считавшихся [принадлежностями] храма ветвей» (θαλλός); τὴν ἡμέραν ἐκείνην ἡσυχίαν ἔσχεν — «в тот день имел покой (ничего не предпринял)»."
  5: "καιρὸν… τῆς ἰδίας ἀνοίας συνεργὸν — «время, содействующее своему безумию»; προσκληθεὶς εἰς συνέδριον — «призванный на совет (синедрион)»; ἐν τίνι διαθέσει καὶ βουλῇ καθέστηκαν — «в каком расположении и намерении находятся»."
  6: "οἱ λεγόμενοι τῶν Ιουδαίων Ασιδαῖοι — «так называемые из иудеев Асидеи» (アシデイ人[じん]); πολεμοτροφοῦσιν καὶ στασιάζουσιν — «войну питают и возмущают»; οὐκ ἐῶντες τὴν βασιλείαν εὐσταθείας τυχεῖν — «не давая царству достигнуть устойчивости» (εὐστάθεια)."
  7: "ἀφελόμενος τὴν προγονικὴν δόξαν — «лишившись прародительской славы» (ἀφαιρέομαι); [λέγω δὴ τὴν ἀρχιερωσύνην] — вставка-пояснение, すなわち大祭司[だいさいし]の職[しょく]; δεῦρο νῦν ἐλήλυθα — «сюда ныне пришёл»."
  8: "ὑπὲρ τῶν ἀνηκόντων τῷ βασιλεῖ γνησίως φρονῶν — «искренно мысля о том, что принадлежит царю» (γνησίως); τῶν ἰδίων πολιτῶν στοχαζόμενος — «имея в виду своих граждан» (στοχάζομαι); τῇ… ἀλογιστίᾳ — «безрассудством» (ἀλογιστία); ἀκληρεῖ — «бедствует» (ἀκληρέω)."
  9: "τῆς χώρας καὶ τοῦ περιισταμένου γένους ἡμῶν προνοήθητι — «о стране и об угнетённом роде нашем попекись» (περιίστημι); καθ᾽ ἣν ἔχεις πρὸς ἅπαντας εὐαπάντητον φιλανθρωπίαν — «по твоему ко всем доступному человеколюбию» (εὐαπάντητος)."
  10: "ἄχρι γὰρ Ιουδας περίεστιν — «доколе Иуда жив»; ἀδύνατον εἰρήνης τυχεῖν τὰ πράγματα — «невозможно делам получить мир». Здесь речь Алкима закрывается."
  11: "οἱ λοιποὶ φίλοι — «прочие друзья (советники)»; δυσμενῶς ἔχοντες τὰ πρὸς τὸν Ιουδαν — «враждебно настроенные к Иуде»; προσεπύρωσαν τὸν Δημήτριον — «ещё более распалили Димитрия» (προσεπυρέσσω? προσεπιπυρόω)."
  12: "Νικάνορα τὸν γενόμενον ἐλεφαντάρχην — «Никанора, ставшего слоновым начальником» (ἐλεφαντάρχης); στρατηγὸν ἀναδείξας τῆς Ιουδαίας — «назначив военачальником Иудеи»."
  13: "δοὺς ἐντολὰς αὐτὸν μὲν τὸν Ιουδαν ἐπανελέσθαι — «дав приказания самого Иуду убить»; τοὺς σὺν αὐτῷ σκορπίσαι — «бывших с ним рассеять» (σκορπίζω); καταστῆσαι δὲ Ἄλκιμον ἀρχιερέα — «поставить Алкима первосвященником»."
  14: "οἱ… πεφυγαδευκότες τὸν Ιουδαν ἔθνη — «язычники, бежавшие от Иуды»; συνέμισγον ἀγεληδὸν — «смешивались (сходились) стадами»; τὰς τῶν Ιουδαίων ἀτυχίας… ἰδίας εὐημερίας δοκοῦντες ἔσεσθαι — «считая, что несчастья иудеев будут их благоденствием» (ἀτυχία)."
  15: "τὴν τοῦ Νικάνορος ἔφοδον — «нашествие Никанора»; καταπασάμενοι γῆν — «посыпав себя землёй»; τὸν ἄχρι αἰῶνος συστήσαντα τὸν αὑτοῦ λαόν — «утвердившего навек Свой народ» (συνίστημι); μετ᾽ ἐπιφανείας ἀντιλαμβανόμενον — «с явлением защищающего» (ἀντιλαμβάνομαι)."
  16: "προστάξαντος… τοῦ ἡγουμένου — «по повелению вождя»; ἀναζεύξας — «выступив»; ἐπὶ κώμην Δεσσαου — «при селении Дессау» (デッサウ)."
  17: "Σιμων δὲ ὁ ἀδελφὸς Ιουδου — «Симон, брат Иуды»; συμβεβληκὼς ἦν τῷ Νικάνορι — «вступил в бой с Никанором» (συμβάλλω); διὰ τὴν αἰφνίδιον τῶν ἀντιπάλων ἀφασίαν — «из-за внезапной растерянности (безмолвия) противников» (ἀφασία); ἐπταικώς — «потерпев поражение» (πταίω)."
  18: "ἣν εἶχον οἱ περὶ τὸν Ιουδαν ἀνδραγαθίαν — «какое имели бывшие с Иудой мужество» (ἀνδραγαθία); ἐν τοῖς… ἀγῶσιν εὐψυχίαν — «в бранях отвагу» (εὐψυχία); ὑπευλαβεῖτο τὴν κρίσιν δι᾽ αἱμάτων ποιήσασθαι — «опасался решение кровью произвести» (ὑπευλαβέομαι)."
  19: "Ποσιδώνιον καὶ Θεόδοτον καὶ Ματταθιαν — «Посидония, Феодота и Маттафию» (ポシデオニオス, テオドトス, マタティア); δοῦναι καὶ λαβεῖν δεξιάς — «дать и принять десницы»."
  20: "πλείονος… ἐπισκέψεως — «большего рассмотрения»; τοῦ ἡγουμένου τοῖς πλήθεσιν ἀνακοινωσαμένου — «когда вождь сообщил множествам»; ὁμοψήφου γνώμης — «единогласного мнения» (ὁμόψηφος); ἐπένευσαν ταῖς συνθήκαις — «согласились на договоры»."
  21: "ἐτάξαντο… ἡμέραν — «назначили день»; κατ᾽ ἰδίαν ἥξουσιν εἰς τὸ αὐτό — «придут наедине в одно [место]»; προῆλθεν παρ᾽ ἑκάστου δίφραξ — тёмное место (порча текста): «вынесено от каждого по седалищу»; ἔθεσαν δίφρους — «поставили кресла» (δίφρος)."
  22: "διέταξεν Ιουδας ἐνόπλους ἑτοίμους ἐν τοῖς ἐπικαίροις τόποις — «поставил Иуда вооружённых готовыми в удобных местах»; μήποτε… αἰφνιδίως κακουργία γένηται — «как бы внезапно не произошло злодейство»; τὴν ἁρμόζουσαν ἐποιήσαντο κοινολογίαν — «имели подобающую беседу (переговоры)» (κοινολογία)."
  23: "διέτριβεν — «проводил время» (διατρίβω); οὐθὲν ἄτοπον — «ничего неуместного»; τοὺς… ἀγελαίους ὄχλους ἀπέλυσεν — «собранные толпами народы отпустил» (ἀγελαῖος)."
  24: "εἶχεν τὸν Ιουδαν διὰ παντὸς ἐν προσώπῳ — «имел Иуду всегда при себе (в лице)»; ψυχικῶς τῷ ἀνδρὶ προσεκέκλιτο — «душевно к мужу расположился» (προσκλίνομαι)."
  25: "ἐγάμησεν, εὐστάθησεν, ἐκοινώνησεν βίου — «женился, успокоился, стал общником жизни». Слав. «благо поживе, общежителствоваше»."
  26: "συνιδὼν τὴν πρὸς ἀλλήλους εὔνοιαν — «увидев их взаимное благорасположение»; λαβὼν ἧκεν — «собравшись, пришёл»; ἀλλότρια φρονεῖν τῶν πραγμάτων — «мыслить чуждое делам (царства)»; τὸν ἐπίβουλον τῆς βασιλείας — «злоумышленника против царства»; διάδοχον ἀναδεῖξαι — «преемником объявить»."
  27: "ἔκθυμος γενόμενος — «придя в ярость»; ταῖς τοῦ παμπονήρου διαβολαῖς ἐρεθισθείς — «раздражённый клеветами всезлобного» (παμπόνηρος); βαρέως φέρειν — «тяжело переносить»; δέσμιον ἐξαποστέλλειν — «отправить связанным» (δέσμιος)."
  28: "συνεκέχυτο — «смутился» (συγχέω); εἰ τὰ διεσταλμένα ἀθετήσει — «если отвергнет установленное» (διαστέλλω, ἀθετέω); μηδὲν τἀνδρὸς ἠδικηκότος — «когда муж ни в чём не согрешил»."
  29: "τῷ βασιλεῖ ἀντιπράττειν οὐκ ἦν — «противиться царю было нельзя»; εὔκαιρον ἐτήρει στρατηγήματι τοῦτ᾽ ἐπιτελέσαι — «выжидал удобного [времени] исполнить это военной хитростью» (στρατήγημα)."
  30: "αὐστηρότερον διεξαγαγόντα — «обходившегося суровее» (αὐστηρός); τὴν εἰθισμένην ἀπάντησιν ἀγροικότερον ἐσχηκότα — «обычную встречу сделавшего грубее» (ἀγροίκως); οὐκ ἀπὸ τοῦ βελτίστου — «не от лучшего»; συστρέψας οὐκ ὀλίγους — «собрав немало» (συστρέφω); συνεκρύπτετο — «скрывался»."
  31: "συγγνοὺς… ὅτι γενναίως… ἐστρατήγηται — «поняв, что мужественно предупреждён (перехитрён)» (συγγιγνώσκω); τὰς καθηκούσας θυσίας προσαγόντων — «когда приносили надлежащие жертвы»; ἐκέλευσεν παραδιδόναι τὸν ἄνδρα — «приказал выдать мужа»."
  32: "τῶν δὲ μεθ᾽ ὅρκων φασκόντων — «когда они с клятвами говорили»; μὴ γινώσκειν ποῦ ποτ᾽ ἔστιν — «не знать, где находится»."
  33: "προτείνας τὴν δεξιὰν ἐπὶ τὸν νεώ — «простерев правую руку на храм»; Ἐὰν μὴ δέσμιόν μοι τὸν Ιουδαν παραδῶτε — «если не выдадите мне Иуду связанным»; εἰς πεδίον ποιήσω — «сделаю полем»; κατασκάψω — «раскопаю» (κατασκάπτω); ἱερὸν… τῷ Διονύσῳ ἐπιφανὲς ἀναστήσω — «воздвигну славное святилище Дионису»."
  34: "προτείναντες τὰς χεῖρας εἰς τὸν οὐρανόν — «простерев руки к небу»; τὸν διὰ παντὸς ὑπέρμαχον τοῦ ἔθνους ἡμῶν — «всегдашнего защитника народа нашего» (ὑπέρμαχος)."
  35: "Σὺ κύριε τῶν ὅλων ἀπροσδεὴς ὑπάρχων — «Ты, Господи всех, будучи не имеющим нужды» (ἀπροσδεής); ναὸν τῆς σῆς σκηνώσεως ἐν ἡμῖν γενέσθαι — «храму Твоего обитания быть среди нас» (σκήνωσις)."
  36: "ἅγιε παντὸς ἁγιασμοῦ κύριε — «святой Господи всякой святыни»; διατήρησον εἰς αἰῶνα ἀμίαντον — «сохрани навек неосквернённым» (ἀμίαντος); τὸν προσφάτως κεκαθαρισμένον οἶκον — «недавно очищенный дом». Здесь молитва закрывается."
  37: "Ραζις — «Разис» (ラジス); ἐμηνύθη τῷ Νικάνορι — «был донесён Никанору» (μηνύω); φιλοπολίτης — «гражданолюбец» (φιλοπολίτης); σφόδρα καλῶς ἀκούων — «имеющий весьма добрую славу»; κατὰ τὴν εὔνοιαν πατὴρ τῶν Ιουδαίων προσαγορευόμενος — «по благорасположению называемый отцом иудеев»."
  38: "τῆς ἀμειξίας κρίσιν εἰσενηνεγμένος Ιουδαισμοῦ — «внёсший суд (приговор) за иудейство во времена смешения» (εἰσφέρω); σῶμα καὶ ψυχὴν… παραβεβλημένος — «тело и душу предававший» (παραβάλλομαι); μετὰ πάσης ἐκτενίας — «со всяким усердием» (ἐκτένεια)."
  39: "πρόδηλον ποιῆσαι ἣν εἶχεν… δυσμένειαν — «сделать явной имевшуюся ненависть»; ἀπέστειλεν στρατιώτας ὑπὲρ τοὺς πεντακοσίους — «послал более пятисот воинов»; συλλαβεῖν αὐτόν — «схватить его»."
  40: "ἔδοξεν γὰρ ἐκεῖνον συλλαβὼν τούτοις ἐνεργάσασθαι συμφοράν — «ибо думал, схватив его, причинить им несчастье» (ἐνεργάζομαι)."
  41: "τῶν πληθῶν μελλόντων τὸν πύργον καταλαβέσθαι — «когда толпы готовились овладеть башней»; τὴν αὐλαίαν θύραν βιαζομένων — «когда ломились в ворота двора» (αὐλαία); ὑπέθηκεν ἑαυτῷ τὸ ξίφος — «подложил себе меч» (ὑποτίθημι)."
  42: "εὐγενῶς θέλων ἀποθανεῖν ἤπερ… ὑποχείριος γενέσθαι — «желая благородно умереть, нежели стать подручным»; τῆς ἰδίας εὐγενείας ἀναξίως ὑβρισθῆναι — «недостойно обесчестить своё благородство» (ὕβρις)."
  43: "τῇ πληγῇ μὴ κατευθικτήσας — «не попав (не достигнув) ударом» (κατευθικτέω); διὰ τὴν τοῦ ἀγῶνος σπουδήν — «из-за спешки (рвения) подвига»; τῶν θυρωμάτων — «дверных проёмов»; ἀναδραμὼν… ἐπὶ τὸ τεῖχος — «вбежав на стену»; κατεκρήμνισεν ἑαυτὸν ἀνδρωδῶς εἰς τοὺς ὄχλους — «низверг себя мужественно в толпы» (κρημνίζω, ἀνδρωδῶς)."
  44: "τῶν… ἀναποδισάντων — «отступивших назад» (ἀναποδίζω); γενομένου διαστήματος — «когда образовалось пространство»; ἦλθεν κατὰ μέσον τὸν κενεῶνα — «пришёл в середину бока (поясницы)» (κενεών) — тёмное место; передано 体[からだ]の真[ま]ん中[なか]."
  45: "ἔμπνους ὑπάρχων — «будучи ещё дышащим»; πεπυρωμένος τοῖς θυμοῖς — «воспламенённый яростью»; κρουνηδὸν τῶν αἱμάτων — «кровь ручьями (потоком)» (κρουνηδόν); δρόμῳ τοὺς ὄχλους διελθών — «бегом пройдя сквозь толпы»; ἐπί τινος πέτρας ἀπορρῶγος — «на некоей крутой (обрывистой) скале» (ἀπορρώξ)."
  46: "παντελῶς ἔξαιμος ἤδη γινόμενος — «совершенно уже истекая кровью» (ἔξαιμος); προβαλὼν τὰ ἔντερα — «выдвинув (вырвав) внутренности» (ἔντερον, 内臓[ないぞう]); ἑκατέραις ταῖς χερσὶν ἐνέσεισε τοῖς ὄχλοις — «обеими руками бросил в толпы» (ἐνσείω); τὸν δεσπόζοντα τῆς ζωῆς καὶ τοῦ πνεύματος — «Владыку жизни и духа»; ταῦτα αὐτῷ πάλιν ἀποδοῦναι — «снова это ему возвратить»; τόνδε τὸν τρόπον μετήλλαξεν — «таким образом скончался»."
