# его речь о Асидеях и Иуде; 12–14 Никанор поставлен военачальником, язычники
# стекаются; 15–23 молитва, Дессау, переговоры и мир; 24 Никанор сближается
# с Иудой; 25–30 Алким клевещет, царь требует выдачи, Иуда скрывается;
# 31–36 Никанор в храме и молитва священников; 37–46 Разис и его смерть.
# Голоса: речь Алкима 6–10 — 「…」; клятва Никанора 33 — 「…」; молитва
