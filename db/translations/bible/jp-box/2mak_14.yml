# Имена: デメトリオス, セレウコス, アルキモス, ニカノル, アシデイ人, ラジス,
# ポシデオニオス, テオドトス, マタティア, デッサウ, トリポリス, ディオニソス —
# новое; イウダ, マッカバイオス, シモン, エルサレム, アンティオキア.

