# jp-box, Послание к Евреям, глава 8. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 8: главное — такой Первосвященник, севший одесную престола величия (1–2),
# служение в истинной скинии, а не в земной (3–5), лучший завет и его посредник (6),
# пророчество Иер 31:31–34 (8–12), «новый» делает первый ветхим (13).
# Красного и синего нет. 8:8–12 — слова Господа из Иеремии, но это цитата Писания,
# а не прямая речь Христа, поэтому 「…」 без <j>.
# Цитаты: 8:5 — Исх 25:40; 8:8–12 — Иер 31:31–34; 8:13 — слово καινήν из Иер 31:31.
# 〔…〕 в главе нет: [νυνὶ] (8:6) стоит в базе в квадратных скобках, слово есть,
# поэтому не оборачивается (проверено запросом к gr-lxx-byz).
# Сносок ⟨…⟩ в главе нет: 幕屋 уже встречалось в корпусе (Деян 15:16), остальные слова
# (聖所, 御座, 契約, 仲介者) понятны из контекста; лишних пояснений не ставим.
# jp-ni не использовался.

tr_code: jp-box
book: evr
chapter: 8
draft: true

verses:
  1: "以上[いじょう]の話[はなし]の要点[ようてん]はこうである。わたしたちにはこのような大祭司[だいさいし]がおられる。この方[かた]は、天[てん]において、大[おお]いなる威光[いこう]の御座[みくら]の右[みぎ]に着[つ]かれた。"
  2: "聖所[せいしょ]と、まことの幕屋[まくや]に仕[つか]える者[もの]である。その幕屋[まくや]は、人[ひと]ではなく主[しゅ]が建[た]てたものである。"
  3: "すべての大祭司[だいさいし]は、供[そな]え物[もの]といけにえをささげるために立[た]てられる。そこで、この方[かた]も何[なに]かささげる物[もの]を持[も]つ必要[ひつよう]がある。"
  4: "もしこの方[かた]が地上[ちじょう]におられたなら、祭司[さいし]ではなかっただろう。律法[りっぽう]に従[したが]って供[そな]え物[もの]をささげる者[もの]たちがいるからである。"
  5: "その人[ひと]たちは、天[てん]にあるもののひな型[がた]と影[かげ]に仕[つか]えているのである。モーセは、幕屋[まくや]を造[つく]ろうとしたときに、こう告[つ]げられた。「よく注意[ちゅうい]して、山[やま]で示[しめ]された型[かた]どおりに、すべてを造[つく]りなさい」と。"
  6: "しかし今[いま]、この方[かた]は、これまでより優[すぐ]れた奉仕[ほうし]を受[う]けられた。その分[ぶん]だけ、より良[よ]い契約[けいやく]の仲介者[ちゅうかいしゃ]であられるからである。この契約[けいやく]は、より良[よ]い約束[やくそく]の上[うえ]に定[さだ]められている。"
  7: "もしあの最初[さいしょ]の契約[けいやく]に非[ひ]がなかったなら、第二[だいに]の契約[けいやく]を求[もと]める余地[よち]はなかった。"
  8: "神[かみ]は彼[かれ]らを責[せ]めて言[い]われる。「見[み]よ、日[ひ]が来[く]る、と主[しゅ]は言[い]われる。わたしはイスラエルの家[いえ]とユダの家[いえ]とに新[あたら]しい契約[けいやく]を結[むす]ぶ。"
  9: "それは、わたしが彼[かれ]らの先祖[せんぞ]たちの手[て]を引[ひ]いてエジプトの地[ち]から連[つ]れ出[だ]したときに、彼[かれ]らと結[むす]んだ契約[けいやく]とは同[おな]じものではない。彼[かれ]らはわたしの契約[けいやく]にとどまらなかったので、わたしも彼[かれ]らをかえりみなかった、と主[しゅ]は言[い]われる。"
  10: "それらの日[ひ]の後[のち]に、わたしがイスラエルの家[いえ]と結[むす]ぶ契約[けいやく]はこれである、と主[しゅ]は言[い]われる。わたしはわたしの律法[りっぽう]を彼[かれ]らの思[おも]いに置[お]き、彼[かれ]らの心[こころ]に書[か]き記[しる]す。わたしは彼[かれ]らの神[かみ]となり、彼[かれ]らはわたしの民[たみ]となる。"
  11: "それぞれ自分[じぶん]の同胞[どうほう]や兄弟[きょうだい]に、『主[しゅ]を知[し]れ』と言[い]うことはない。小[ちい]さい者[もの]から大[おお]きい者[もの]まで、すべてがわたしを知[し]るようになるからである。"
  12: "わたしは彼[かれ]らの不義[ふぎ]に憐[あわ]れみ深[ぶか]くあり、彼[かれ]らの罪[つみ]をもはや思[おも]い起[お]こさないからである」。"
  13: "「新[あたら]しい」と言[い]われたことで、神[かみ]は最初[さいしょ]の契約[けいやく]を古[ふる]いものとされた。古[ふる]びて衰[おとろ]えるものは、消[き]え去[さ]ることに近[ちか]いのである。"

notes:
  1: "Κεφάλαιον δὲ ἐπὶ τοῖς λεγομένοις — 以上の話の要点はこうである (κεφάλαιον — «главное, итог»). τοιοῦτον ἔχομεν ἀρχιερέα — わたしたちにはこのような大祭司がおられる. ἐκάθισεν ἐν δεξιᾷ τοῦ θρόνου τῆς μεγαλωσύνης — 大いなる威光の御座の右に着かれた (θρόνος — 御座; μεγαλωσύνη — «величие», ср. 1:3 大いなる威光). ἐν τοῖς οὐρανοῖς — 天において."
  2: "τῶν ἁγίων λειτουργὸς — 聖所に仕える者 (τὰ ἅγια — «святилище»; λειτουργός — «служитель»). τῆς σκηνῆς τῆς ἀληθινῆς — まことの幕屋 (σκηνή — 幕屋). ἣν ἔπηξεν ὁ κύριος, οὐκ ἄνθρωπος — 主が建てたもので、人が建てたものではない (πήγνυμι — «ставить, утверждать»)."
  3: "πᾶς γὰρ ἀρχιερεὺς εἰς τὸ προσφέρειν δῶρά τε καὶ θυσίας καθίσταται — すべての大祭司は、供え物といけにえをささげるために立てられる (ср. 5:1; θυσία — いけにえ, как в 9:9). ὅθεν ἀναγκαῖον ἔχειν τι καὶ τοῦτον ὃ προσενέγκῃ — そこで、この方も何かささげる物を持つ必要がある (ἀναγκαῖον — «необходимо»)."
  4: "εἰ μὲν οὖν ἦν ἐπὶ γῆς — もし地上におられたなら. οὐδ᾽ ἂν ἦν ἱερεύς — 祭司ではなかっただろう (на земле есть священники по закону). ὄντων τῶν προσφερόντων κατὰ νόμον τὰ δῶρα — 律法に従って供え物をささげる者たちがいるので."
  5: "οἵτινες ὑποδείγματι καὶ σκιᾷ λατρεύουσιν τῶν ἐπουρανίων — 天にあるもののひな型と影に仕えている (ὑπόδειγμα — ひな型, ср. 9:23; σκιά — 影). καθὼς κεχρημάτισται Μωϋσῆς — モーセは…こう告げられた (χρηματίζω — «возвещать, давать божественное указание»; Μωϋσῆς — подлежащее пассива). Исх 25:40. Ὅρα γάρ, φησίν, ποιήσεις πάντα κατὰ τὸν τύπον — 「よく注意して…型どおりに…造りなさい」 (τύπος — 型)."
  6: "νυν[ὶ] δέ — しかし今は; [ὶ] стоит в базе в квадратных скобках, слово есть, 〔〕 не ставятся. διαφορωτέρας τέτυχεν λειτουργίας — これまでより優れた奉仕を受けた (διαφορώτερος — «превосходнейший»; λειτουργία — 奉仕). κρείττονός ἐστιν διαθήκης μεσίτης — より良い契約の仲介者 (μεσίτης — ср. 9:15; 12:24). ἥτις ἐπὶ κρείττοσιν ἐπαγγελίαις νενομοθέτηται — より良い約束の上に定められている (νομοθετέω — ср. 7:11)."
  7: "Εἰ γὰρ ἡ πρώτη ἐκεῖνη ἦν ἄμεμπτος — もしあの最初の契約に非がなかったなら (ἄμεμπτος — «безупречный»). οὐκ ἂν δευτέρας ἐζητεῖτο τόπος — 第二の契約を求める余地はなかった (τόπος — «место, возможность»)."
  8: "μεμφόμενος γὰρ αὐτοὺς λέγει — 神は彼らを責めて言われる (μέμφομαι — «укорять»). Иер 31:31. Ἰδοὺ ἡμέραι ἔρχονται, λέγει κύριος — 「見よ、日が来る、と主は言われる」. συντελέσω…διαθήκην καινήν — 新しい契約を結ぶ (συντελέω — «завершать, заключать»). οἶκος Ἰσραήλ, οἶκος Ἰούδα — イスラエルの家、ユダの家."
  9: "Иер 31:32. οὐ κατὰ τὴν διαθήκην ἣν ἐποίησα τοῖς πατράσιν αὐτῶν — 彼らの先祖たちと結んだ契約とは同じものではない. ἐν ἡμέρᾳ ἐπιλαβομένου μου τῆς χειρὸς αὐτῶν — わたしが彼らの手を引いて…ときに (букв. «в день, когда Я взял их за руку»; ἐπιλαμβάνομαι — «брать, хватать»). ἐξαγαγεῖν αὐτοὺς ἐκ γῆς Αἰγύπτου — エジプトの地から連れ出すため. ὅτι αὐτοὶ οὐκ ἐνέμειναν ἐν τῇ διαθήκῃ μου — 彼らはわたしの契約に留まらなかった (ἐμμένω — «пребывать»). κἀγὼ ἠμέλησα αὐτῶν — わたしも彼らを顧みなかった (ἀμελέω — «не заботиться, пренебрегать»)."
  10: "Иер 31:33. αὕτη ἡ διαθήκη ἣν διαθήσομαι — わたしが結ぶ契約はこれである. μετὰ τὰς ἡμέρας ἐκείνας — それらの日の後に. διδοὺς νόμους μου εἰς τὴν διάνοιαν αὐτῶν — わたしの律法を彼らの思いに置き (διάνοια — «мысль, разум»). ἐπὶ καρδίας αὐτῶν ἐπιγράψω — 彼らの心に書き記す (ἐπιγράφω — «надписывать»). ἔσομαι αὐτοῖς εἰς θεὸν καὶ αὐτοὶ ἔσονταί μοι εἰς λαόν — わたしは彼らの神となり、彼らはわたしの民となる (формула завета сохранена)."
  11: "Иер 31:34. οὐ μὴ διδάξωσιν ἕκαστος τὸν πολίτην αὐτοῦ — それぞれ自分の同胞に…と言うことはない (πολίτης — «согражданин»). Γνῶθι τὸν κύριον — 「主を知れ」 (внутренняя речь внутри цитаты — в 『…』). πάντες εἰδήσουσίν με ἀπὸ μικροῦ ἕως μεγάλου — 小さい者から大きい者まで、すべてがわたしを知る (ἀπό…ἕως — «от…до»)."
  12: "Иер 31:34. ἵλεως ἔσομαι ταῖς ἀδικίαις αὐτῶν — わたしは彼らの不義に憐れみ深くあり (ἵλεως — «милостив, умилостивлен»; ср. ἱλάσκομαι, 2:17). τῶν ἁμαρτιῶν αὐτῶν οὐ μὴ μνησθῶ ἔτι — 彼らの罪をもはや思い起こさない (οὐ μή — усиленное отрицание)."
  13: "ἐν τῷ λέγειν Καινήν — 「新しい」と言われたことで (Καινήν — слово из Иер 31:31, взято в 「…」 как цитата). πεπαλαίωκεν τὴν πρώτην — 最初の契約を古いものとされた (παλαιόω — «делать ветхим»). τὸ δὲ παλαιούμενον καὶ γηρᾶσκον ἐγγὺς ἀφανισμοῦ — 古びて衰えるものは、消え去ることに近い (γηράσκω — «стареть»; ἀφανισμός — «уничтожение, исчезновение»)."
