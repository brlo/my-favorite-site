verses:
  1: "シオンの谷[たに]についての言葉[ことば]。今[いま]、あなたに何[なに]が起[お]こったのか。あなたがたはみな屋根[やね]に上[のぼ]った。"
  2: "むなしいことか。町[まち]は叫[さけ]ぶ者[もの]で満[み]ちた。あなたの傷[きず]ついた者[もの]は剣[つるぎ]で傷ついた者ではなく、あなたの死[し]んだ者[もの]は戦[いくさ]で死んだ者ではない。"
  3: "あなたの君[きみ]たちはみな逃[に]げ、捕[と]らえられた者[もの]たちはひどく縛[しば]られている。あなたの中[なか]で強[つよ]い者[もの]たちは遠[とお]くへ逃げた。"
  4: "それゆえ、わたしは言[い]った。「わたしを放[はな]っておけ。わたしは苦[にが]く泣[な]く。わたしの一族[いちぞく]の娘[むすめ]の破壊[はかい]について、わたしを慰[なぐさ]めようと力[ちから]を尽[つ]くすな。」"
  5: "万軍[ばんぐん]の主[しゅ]による混乱[こんらん]、滅[ほろ]び、踏[ふ]みにじり、そして迷[まよ]いの日[ひ]が、シオンの谷[たに]にあるからである。小[ちい]さい者[もの]から大[おお]きい者まで迷い、山[やま]の上[うえ]で迷う。"
  6: "エラム人[じん]は矢筒[やとう]を取[と]り、人々[ひとびと]は馬[うま]に乗[の]って進[すす]み、戦[いくさ]の備[そな]えの群[む]れが集[あつ]まる。"
  7: "あなたの選[えら]ばれた谷[たに]々は車[くるま]で満[み]ち、騎兵[きへい]があなたの門[もん]をふさぐ。"
  8: "ユダの門[もん]が開[ひら]かれ、その日[ひ]、人々[ひとびと]は町[まち]の選[えら]ばれた家[いえ]々を見[み]る。"
  9: "ダビデの城塞[じょうさい]の家[いえ]々の隠[かく]された所[ところ]が開[ひら]かれる。彼[かれ]らは、それが多[おお]いのを見[み]、古[ふる]い池[いけ]の水[みず]を町[まち]へ引[ひ]き入[い]れたのを見る。"
  10: "また、エルサレムの家[いえ]々を取[と]り壊[こわ]して、町[まち]の城壁[じょうへき]の要害[ようがい]とした。"
  11: "あなたがたは二[ふた]つの城壁[じょうへき]の間[あいだ]、古[ふる]い池[いけ]の内側[うちがわ]に水[みず]を蓄[たくわ]えた。しかし、これを初[はじ]めから造[つく]った方[かた]に目[め]を向[む]けず、これを建[た]てた方を見[み]なかった。"
  12: "その日[ひ]、万軍[ばんぐん]の主[しゅ]は泣[な]き叫[さけ]び、嘆[なげ]き、頭[あたま]を剃[そ]ること、粗布[あらぬの]をまとうことを呼[よ]び寄[よ]せた。"
  13: "しかし、彼[かれ]らは喜[よろこ]びと楽[たの]しみを造[つく]り、牛[うし]を屠[ほふ]り、羊[ひつじ]をほふり、肉[にく]を食[た]べ、ぶどう酒[しゅ]を飲[の]み、「食[た]べよう、飲[の]もう。明日[あした]は死[し]ぬのだから」と言[い]う。"
  14: "このことは万軍[ばんぐん]の主[しゅ]の耳[みみ]に現[あら]わされている。あなたがたが死[し]ぬまで、この罪[つみ]は赦[ゆる]されない。"
  15: "万軍[ばんぐん]の主[しゅ]はこう言[い]われる。「宮殿[きゅうでん]の奥[おく]の部屋[へや]にいる財務官[ざいむかん]ソムナスのところへ行[い]き、彼[かれ]に言[い]え。"
  16: "あなたはここで何[なに]をしているのか。ここに何[なに]があるというのか。あなたがここに自分[じぶん]の墓[はか]を掘[ほ]り、高[たか]い所[ところ]に自分の墓を造[つく]り、岩[いわ]に自分の住[す]まいを刻[きざ]んだとは。"
  17: "見[み]よ、万軍の主[しゅ]は男[おとこ]を投[な]げ出[だ]し、打[う]ち砕[くだ]き、あなたの衣[ころも]を奪[うば]い取[と]る。"
  18: "あなたの栄光[えいこう]の冠[かんむり]も奪[うば]い取[と]る。主はあなたを広大[こうだい]で測[はか]り知[し]れない国[くに]へ投[な]げ込[こ]み、そこであなたは死[し]ぬ。主はあなたの美[うつく]しい車[くるま]を恥辱[ちじょく]とし、あなたの君[きみ]の家[いえ]を踏[ふ]みにじるものとする。"
  19: "あなたはその管理[かんり]から、その地位[ちい]から退[しりぞ]けられる。"
  20: "その日[ひ]、わたしはわたしのしもべエリアキム、ヒルキヤの子[こ]を呼[よ]ぶ。"
  21: "わたしはあなたの衣[ころも]を彼[かれ]に着[き]せ、あなたの冠[かんむり]を彼に与[あた]え、あなたの権力[けんりょく]と管理[かんり]を彼の手[て]に渡[わた]す。彼はエルサレムに住[す]む者[もの]、ユダに住む者にとって父[ちち]のようになる。"
  22: "わたしはダビデの栄光[えいこう]を彼に与える。彼は治[おさ]め、反対[はんたい]する者[もの]はいない。わたしはダビデの家[いえ]の鍵[かぎ]を彼の肩[かた]に置[お]く。彼が開[ひら]けば、閉[と]じる者はなく、閉じれば、開ける者はない。"
  23: "わたしは彼を堅[かた]い所[ところ]に支配者[しはいしゃ]として置[お]く。彼は父[ちち]の家[いえ]にとって栄光[えいこう]の座[ざ]となる。"
  24: "父[ちち]の家[いえ]のすべての栄光[えいこう]ある者[もの]は、小[ちい]さい者から大[おお]きい者まで、彼に信頼[しんらい]を置[お]き、彼に懸[か]かる。」"
  25: "その日[ひ]、万軍[ばんぐん]の主[しゅ]はこう言[い]われる。「固[かた]く据[す]えられた者[もの]は動[うご]かされ、倒[たお]れ、その上[うえ]にある栄光[えいこう]は取[と]り去[さ]られる。」主[しゅ]が語[かた]られたからである。"

notes:
  1: "Τὸ ῥῆμα τῆς φάραγγος Σιων — «слово долины Сиона» (φάραγξ — ущелье, долина). В слав. надписания нет: 22:1 сразу начинается «Что бысть тебе…»; ru/МТ называют «долина видения» (גיא חזיון), но LXX читает «Сион», и это чтение держим. Τί ἐγένετό σοι νῦν — «что с тобой ныне»; ἀνέβητε πάντες εἰς δώματα — «вы все взошли на кровли» (δῶμα — кровля, плоская крыша)."
  2: "μάταια — «пустое, тщетное» (ср. 22:1); по gr это начало 22:2, слав. относит к 22:1 («на храмины тщетныя»). ἐνεπλήσθη ἡ πόλις βοώντων — «город наполнился кричащих»; ru/МТ говорят о «ликующем» городе, чего в LXX нет. οἱ τραυματίαι σου οὐ τραυματίαι μαχαίρας — «раненые твои не раненые мечом»; οἱ νεκροί σου νεκροὶ πολέμου — «мёртвые твои не мёртвые войны»."
  3: "πάντες οἱ ἄρχοντές σου πεφεύγασιν — «все князья твои убежали» (φεύγω); οἱ ἁλόντες σκληρῶς δεδεμένοι εἰσίν — «пойманные жестоко связаны» (ἁλίσκομαι — быть пойманным, δέω — связывать). οἱ ἰσχύοντες ἐν σοὶ πόρρω πεφεύγασιν — «сильные в тебе далеко убежали»; слав. «крепцыи в тебе далече отбежаша». ru/МТ добавляют «связаны стрелками», чего в LXX нет."
  4: "διὰ τοῦτο εἶπα — «посему я сказал»: слова пророка в 「…」. Ἄφετέ με πικρῶς κλαύσομαι — «оставьте меня, горько заплачу» (πικρῶς — горько); μὴ κατισχύσητε παρακαλεῖν με — «не усиливайтесь утешать меня» (κατισχύω — одолевать, напрягаться). ἐπὶ τὸ σύντριμμα τῆς θυγατρὸς τοῦ γένους μου — «о сокрушении дочери рода моего» (γένος — род, племя; слав. «рода», не «народа»)."
  5: "ἡμέρα ταραχῆς καὶ ἀπωλείας καὶ καταπατήματος — «день смятения, погибели и попрания» (ταραχή — смятение; καταπάτημα — попирание). καὶ πλάνησις παρὰ κυρίου σαβαωθ — «и блуждание от Господа Саваофа» (πλάνησις — блуждание, заблуждение); слав. передаёт «смятение», но в тексте оставлено «迷い», чтобы сохранить повтор πλανῶνται в конце стиха. πλανῶνται ἀπὸ μικροῦ ἕως μεγάλου, πλανῶνται ἐπὶ τὰ ὄρη — «блуждают от малого до великого, блуждают по горам»."
  6: "οἱ Αιλαμῖται ἔλαβον φαρέτρας — «еламитяне взяли колчаны» (φαρέτρα — колчан); ἀναβάται ἄνθρωποι ἐφ᾽ ἵπποις — «всадники, люди на конях»; συναγωγὴ παρατάξεως — «собрание ополчения, боевого строя» (παράταξις). ru/МТ добавляют «Кир обнажает щит», чего в LXX и слав. нет."
  7: "αἱ ἐκλεκταὶ φάραγγές σου — «избранные долины твои»; πλησθήσονται ἁρμάτων — «наполнятся колесницами» (ἅρμα); οἱ ἱππεῖς ἐμφράξουσι τὰς πύλας σου — «всадники заградят ворота твои» (ἐμφράσσω — запирать, заграждать)."
  8: "ἀνακαλύψουσιν τὰς πύλας Ιουδα — «откроют ворота Иуды» (ἀνακαλύπτω — открывать, снимать покров); ἐμβλέψονται τῇ ἡμέρᾳ ἐκείνῃ — «воззрят в тот день»; εἰς τοὺς ἐκλεκτοὺς οἴκους τῆς πόλεως — «на избранные дома города». ru/МТ говорят о «покрове с Иудеи» и «доме кедровом» — это иное чтение (МТ), в LXX его нет."
  9: "τὰ κρυπτὰ τῶν οἴκων τῆς ἄκρας Δαυιδ — «сокрытое домов крепости Давида» (ἄκρα — крепость, акрополь; слав. «краеградие»). εἴδοσαν ὅτι πλείους εἰσίν — «увидели, что их больше/многочисленны»: неясно, о чём (домы? проломы?); ru/МТ поясняют «много проломов», в LXX этого пояснения нет. ἀπέστρεψαν τὸ ὕδωρ τῆς ἀρχαίας κολυμβήθρας εἰς τὴν πόλιν — «отвели воду древней купальни в город» (κολυμβήθρα — бассейн, купальня)."
  10: "καθεῖλοσαν τοὺς οἴκους Ιερουσαλημ — «снесли, разрушили дома Иерусалима» (καθαιρέω — сносить); εἰς ὀχύρωμα τοῦ τείχους τῇ πόλει — «в укрепление стены городу», т. е. на починку городской стены. Слав. «разориша домы Иерусалимли на утверждение стене градней»."
  11: "ἐποιήσατε ἑαυτοῖς ὕδωρ — «сделали себе воду», т. е. водоём; ἀνὰ μέσον τῶν δύο τειχέων ἐσώτερον τῆς κολυμβήθρας τῆς ἀρχαίας — «между двумя стенами, внутри древней купальни». οὐκ ἐνεβλέψατε εἰς τὸν ἀπ᾽ ἀρχῆς ποιήσαντα αὐτήν — «не воззрели на Того, кто от начала создал её»; τὸν κτίσαντα αὐτὴν οὐκ εἴδετε — «Создавшего её не увидели» (κτίζω — создавать, устраивать). ru/МТ говорят о Том, «Кто это делает» и «издавна определил», — иное чтение."
  12: "ἐκάλεσεν κύριος σαβαωθ — «призвал Господь Саваоф»; слав. удваивает «Господь, Господь саваоф». κλαυθμὸν καὶ κοπετὸν καὶ ξύρησιν καὶ ζῶσιν σάκκων — «плач, и рыдание, и острижение, и препоясание вретищем» (κοπετός — плач, биение в грудь; ξύρησις — острижение головы; σάκκος — вретище, дерюга)."
  13: "αὐτοὶ δὲ ἐποιήσαντο εὐφροσύνην καὶ ἀγαλλίαμα — «а они сделали радость и веселие»; σφάζοντες μόσχους καὶ θύοντες πρόβατα — «закалая телят и принося в жертву овец». λέγοντες Φάγωμεν καὶ πίωμεν, αὔριον γὰρ ἀποθνῄσκομεν — «говоря: будем есть и пить, ибо завтра умрём»: эту формулу цитирует 1 Кор 15:32. Слова пирующих в 「…」."
  14: "ἀνακεκαλυμμένα ταῦτά ἐστιν ἐν τοῖς ὠσὶν κυρίου σαβαωθ — «открыто это в ушах Господа Саваофа», т. е. открыто Ему, не скрыто. οὐκ ἀφεθήσεται ὑμῖν αὕτη ἡ ἁμαρτία, ἕως ἂν ἀποθάνητε — «не будет прощён вам этот грех, доколе не умрёте» (ἀφίημι — прощать). ru/МТ добавляют «сказал Господь, Господь Саваоф», чего в LXX и слав. нет."
  15: "Τάδε λέγει κύριος σαβαωθ — вводная формула вне кавычек; далее речь Господа в 「…」 до конца 22:24. Πορεύου εἰς τὸ παστοφόριον — «пойди в пастофорион» (παστοφόριον — внутренний покой, комната во дворце/храме; слав. «куща»); πρὸς Σομναν τὸν ταμίαν — «к Сомне, казначею» (ταμίας — казначей, хранитель сокровищ). В LXX здесь Σομνας (Somnas); в 36–37 тот же сановник также назван Σομνας (Σομναν). В корпусе (4 Цар 18; Ис 36–37) принято ソムナス, оно и оставлено; в брифе была форма シェブナ, но ради единства книги взято ソムナス."
  16: "Τί σὺ ὧδε καὶ τί σοί ἐστιν ὧδε — «что ты здесь и что тебе здесь»; ἐλατόμησας σεαυτῷ ὧδε μνημεῖον — «высек себе здесь гробницу» (λατομέω — высекать в камне; μνημεῖον — гробница, памятник). ἐποίησας σεαυτῷ ἐν ὑψηλῷ μνημεῖον — «сделал себе на высоте гробницу»; ἔγραψας σεαυτῷ ἐν πέτρᾳ σκηνήν — «начертал, высек себе в скале жилище» (σκηνή — шатёр, жилище)."
  17: "ἰδοὺ δὴ κύριος σαβαωθ — «вот, Господь Саваоф»; ἐκβαλεῖ καὶ ἐκτρίψει ἄνδρα — «извергнет и сотрёт мужа» (ἐκτρίβω — стирать, сокрушать). ἀφελεῖ τὴν στολήν σου — «отнимет одежду твою» (στολή — одеяние); слав. присоединяет сюда «и венец твой славный», который по gr стоит в начале 22:18."
  18: "καὶ τὸν στέφανόν σου τὸν ἔνδοξον — «и славный венец твой»: по gr это начало 22:18, продолжение сказуемого 22:17 «отнимет». ῥίψει σε εἰς χώραν μεγάλην καὶ ἀμέτρητον — «бросит тебя в страну великую и неизмеримую» (ἄμετρος — неизмеримый); ἐκεῖ ἀποθανῇ — «там умрёшь». θήσει τὸ ἅρμα σου τὸ καλὸν εἰς ἀτιμίαν — «положит красивую колесницу твою в бесчестие»; τὸν οἶκον τοῦ ἄρχοντός σου εἰς καταπάτημα — «и дом князя твоего в попрание». ru/МТ дают «свернув в сверток, бросит, как меч» — иное чтение."
  19: "ἀφαιρεθήσῃ ἐκ τῆς οἰκονομίας σου — «будешь отнят от управления твоего» (οἰκονομία — управление, должность управителя); ἐκ τῆς στάσεώς σου — «от положения твоего» (στάσις — стояние, место, должность); слав. «от строителства твоего и от степене твоего»."
  20: "καὶ ἔσται ἐν τῇ ἡμέρᾳ ἐκείνῃ — «и будет в тот день»; καλέσω τὸν παῖδά μου Ελιακιμ τὸν τοῦ Χελκιου — «призову раба Моего Елиакима, сына Хелкии» (παῖς — раб, слуга; слав. «раба моего»). Ελιακιμ — Елиаким, Χελκιας — Хелкия; в корпусе (4 Цар 18; Ис 36–37) принято エリアキム, ヒルキヤ, эти формы и взяты (в брифе было エリヤキム)."
  21: "ἐνδύσω αὐτὸν τὴν στολήν σου — «облеку его в одежду твою»; τὸν στέφανόν σου δώσω αὐτῷ — «венец твой дам ему»; τὸ κράτος — «державу, власть»; τὴν οἰκονομίαν σου δώσω εἰς τὰς χεῖρας αὐτοῦ — «управление твоё дам в руки его». ἔσται ὡς πατὴρ τοῖς ἐνοικοῦσιν ἐν Ιερουσαλημ καὶ τοῖς ἐνοικοῦσιν ἐν Ιουδα — «будет как отец живущим в Иерусалиме и живущим в Иудее». ru/МТ добавляют «поясом твоим опояшу его», чего в LXX и слав. нет."
  22: "δώσω τὴν δόξαν Δαυιδ αὐτῷ — «дам ему славу Давидову»; ἄρξει, καὶ οὐκ ἔσται ὁ ἀντιλέγων — «будет владеть, и не будет прекословящего» (ἀντιλέγω — противоречить). Далее в слав. (и в МТ) стоит «и дам ему ключ дома Давидова на рамо его, и отверзет, и не будет затворяющаго, и затворит, и не будет отверзающаго» — в LXX этого нет, но по паритету внесено в основной текст без 〔…〕. Место цитируется в Откр 3:7 (τὴν κλεῖν Δαυίδ)."
  23: "στήσω αὐτὸν ἄρχοντα ἐν τόπῳ πιστῷ — «поставлю его князем на верном месте» (τόπος πιστός — надёжное, твёрдое место); ἔσται εἰς θρόνον δόξης τοῦ οἴκου τοῦ πατρὸς αὐτοῦ — «будет в престол славы для дома отца его». LXX и слав. говорят «князь», ru/МТ — «гвоздь» (יָתֵד); образ гвоздя возвращается в 22:25 (ὁ ἐστηριγμένος), это отмечено в заметке к 22:25."
  24: "πᾶς ἔνδοξος ἐν τῷ οἴκῳ τοῦ πατρὸς αὐτοῦ — «всякий славный в доме отца его» (ἔνδοξος — славный, знатный); ἀπὸ μικροῦ ἕως μεγάλου — «от малого до великого»; ἔσονται ἐπικρεμάμενοι αὐτῷ — «будут висеть на нём» (ἐπικρεμάννυμι — вешать на, подвешивать). ru/МТ добавляют «сосуды… музыкальные орудия» и «вся слава», чего в LXX и слав. нет."
  25: "ἐν τῇ ἡμέρᾳ ἐκείνῃ — τάδε λέγει κύριος σαβαωθ — «в тот день, так говорит Господь Саваоф»: формула вне кавычек, затем новая цитата. κινηθήσεται ὁ ἄνθρωπος ὁ ἐστηριγμένος ἐν τόπῳ πιστῷ — «поколеблется человек, утверждённый на верном месте» (στηρίζω — утверждать; ср. 22:23); πεσεῖται — «падёт»; ἀφαιρεθήσεται ἡ δόξα ἡ ἐπ᾽ αὐτόν — «отнимется слава, которая на нём». Слав. меняет порядок: «и отимется, и падет, и потребится слава»; держим порядок gr."
