# jp-box, Исаия, глава 22. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для главы отсутствует; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 22: 1–2 «долина Сиона» и опустевший город; 3–4 бегство князей, плач пророка;
# 5–8 день смятения, Елам, ворота Иуды; 9–11 укрепления, вода и Забывший Создателя;
# 12–14 плач и вретище вместо пира; 15–25 Севна и Елиаким, ключ Давидов.
# Речь Господа — 22:15–24 (одна цитата) и 22:25; слова пророка — 22:4; слова пирующих — 22:13.
# Нумерация по gr: 25 стихов; деление совпадает с csl-ru и ru.
# Слав. не имеет надписания 22:1; слав. 22:22 содержит «ключ дома Давидова» (в LXX его
# нет) — внесено в основной текст без 〔…〕 по паритету; слав. 22:12 удваивает «Господь».
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).

