verses:
  1: "テマン人[じん]エリファズは答[こた]えて言[い]った。"
  2: "「知恵[ちえ]と知識[ちしき]を教[おし]えるのは主[しゅ]ではないか。"
  3: "あなたが行[おこな]いにおいて非難[ひなん]されない者[もの]であったとしても、主に何[なん]の関[かか]わりがあろうか。あなたが自分[じぶん]の道[みち]をまっすぐにしたとしても、何[なん]の益[えき]があろうか。"
  4: "それとも、あなたを恐[おそ]れて、あなたを責[せ]め、あなたとともに裁[さば]きに入[はい]られるのか。"
  5: "あなたの悪[あく]は大[おお]きく、あなたの罪[つみ]は数[かぞ]えきれないではないか。"
  6: "あなたは兄弟[きょうだい]たちからむなしく担保[たんぽ]を取[と]り、裸[はだか]の者[もの]から衣[ころも]をはぎ取[と]った。"
  7: "渇[かわ]いた者[もの]に水[みず]を飲[の]ませず、飢[うえ]えた者からパンを取[と]り上[あ]げた。"
  8: "あなたはある者[もの]たちの顔[かお]を重[おも]んじ、貧[まず]しい者たちを地[ち]に伏[ふ]せさせた。"
  9: "やもめをむなしく帰[かえ]し、孤児[こじ]を苦[くる]しめた。"
  10: "それゆえ、わながあなたを取[と]り囲[かこ]み、恐[おそ]ろしい戦[いくさ]が突然[とつぜん]あなたに襲[おそ]いかかった。"
  11: "光[ひかり]はあなたにとって闇[やみ]となり、あなたが眠[ねむ]ったとき、水[みず]があなたを覆[おお]った。"
  12: "高[たか]い所[ところ]に住[す]まわれる方[かた]は見[み]ておられないのか。高[たか]ぶって歩[あゆ]む者[もの]を低[ひく]くされたのではないか。"
  13: "あなたは言った。『強[つよ]い方[かた]が何[なに]を知[し]っておられるのか。暗闇[くらやみ]を通[とお]して裁[さば]くことがあるだろうか。"
  14: "雲[くも]がその覆[おお]いとなり、彼は見[み]られない。彼は天[てん]の円[えん]を巡[めぐ]り歩[ある]く。』"
  15: "あなたは、不正[ふせい]な者[もの]たちが歩[あゆ]んだ昔[むかし]の道[みち]を守[まも]ろうとするのか。"
  16: "彼らは時[とき]が来[く]る前[まえ]に捕[と]らえられた。その基[もとい]は溢[あふ]れ流[なが]れる川[かわ]であった。"
  17: "彼らは言った。『主[しゅ]はわたしたちに何[なに]をするだろうか。全能者[ぜんのうしゃ]はわたしたちに何[なに]をもたらすだろうか。』"
  18: "しかし、神[かみ]は彼らの家[いえ]を幸[さいわ]いで満[み]たされた。不敬[ふけい]な者[もの]の企[くわだ]ては彼から遠[とお]い。"
  19: "正[ただ]しい者[もの]たちはこれを見[み]て笑[わら]い、非難[ひなん]されない者[もの]は彼らを嘲[あざけ]った。"
  20: "彼らの富[とみ]は消[き]え去[さ]り、その残[のこ]りは火[ひ]が食[く]い尽[つ]くしたではないか。"
  21: "さあ、あなたは強[つよ]くなれ。もし耐[た]え忍[しの]ぶなら、その後[あと]、あなたの実[みの]りは幸[さいわ]いのうちにある。"
  22: "彼の口[くち]から教[おし]えを受[う]け、その言葉[ことば]をあなたの心[こころ]に受[う]け入[い]れよ。"
  23: "もしあなたが立[た]ち返[かえ]り、主[しゅ]の前[まえ]で自分[じぶん]を低[ひく]くし、自分[じぶん]の住[す]まいから不正[ふせい]を遠[とお]ざけるなら、"
  24: "あなたはそれを土[つち]の上[うえ]に、岩[いわ]の中[なか]に置[お]き、オフィルの流[なが]れの岩のようにする。"
  25: "そのとき、全能者[ぜんのうしゃ]が敵[てき]からあなたを助[たす]ける方[かた]となり、あなたを火[ひ]で試[ため]された銀[ぎん]のように清[きよ]くされる。"
  26: "そのとき、あなたは天[てん]を晴[は]れやかに仰[あお]いで、主[しゅ]の前[まえ]で確信[かくしん]をもって語[かた]る。"
  27: "あなたが祈[いの]るとき、神はあなたを聞[き]き入[い]れ、あなたの誓[ちか]いを果[は]たさせてくださる。"
  28: "神はあなたのために義[ぎ]の住[す]まいを回復[かいふく]し、あなたの道[みち]には光[ひかり]がある。"
  29: "あなたが自分[じぶん]を低[ひく]くしたなら、あなたは言う。『高[たか]く上[あ]げられた』と。神は目[め]を伏[ふ]せる者[もの]を救[すく]われる。"
  30: "神は罪[つみ]のない者[もの]を救[すく]い出[だ]される。あなたも自分[じぶん]の手[て]が清[きよ]ければ救われる。」"

notes:
  1: "Ὑπολαβὼν δὲ Ελιφας ὁ Θαιμανίτης λέγει — вводная формула, повествование, вне кавычек. Θαιμανίτης — テマン人 (от Θαιμαν, テマン); слав. «елифаз феманитин». Речь Елифаза — ст. 2–30, одна цитата."
  2: "Πότερον οὐχὶ ὁ κύριός ἐστιν ὁ διδάσκων σύνεσιν καὶ ἐπιστήμην — «не Господь ли есть учащий разуму и ведению». В LXX этот стих дословно повторяет первую половину 21:22 (там он продолжается словами αὐτὸς δὲ φόνους διακρινεῖ); повтор сохранён, как в слав. («не Господь ли есть научаяй разуму и хитрости»). В МТ и ru на этом месте иное: «разве может человек принести пользу Богу?» — масоретское чтение, по паритету не внесено. Говорящий: Елифаз."
  3: "τί γὰρ μέλει τῷ κυρίῳ — «ибо какое попечение Господу» (μέλει — забота, дело). ἐὰν σὺ ἦσθα τοῖς ἔργοις ἄμεμπτος — «если бы ты был в делах непорочен» (ἄμεμπτος — безупречный). ἢ ὠφέλεια ὅτι ἁπλώσῃς τὴν ὁδόν σου — «или какая польза, что ты сделаешь путь твой простым» (ἁπλόω — выпрямлять); слав. «или кая польза, яко прост творити будеши путь твой». Говорящий: Елифаз."
  4: "ἦ λόγον σου ποιούμενος ἐλέγξει σε — «разве, принимая в расчёт слово твоё, обличит тебя» (λόγον ποιεῖσθαι — обращать внимание, считать); слав. читает «или опасение имея от тебе обличит тя», т. е. «боясь тебя»; по паритету взят смысл слав. (恐れて), разночтение LXX отмечено здесь. συνεισελεύσεταί σοι εἰς κρίσιν — «войдёт с тобой в суд» (συνεισέρχομαι). Говорящий: Елифаз."
  5: "πότερον οὐχ ἡ κακία σού ἐστιν πολλή — «разве не велика злоба твоя» (κακία). ἀναρίθμητοι δέ σού εἰσιν αἱ ἁμαρτίαι — «и не бесчисленны ли грехи твои» (ἁμαρτία); слав. «еда злоба твоя есть не многа? безчисленнии же твои суть греси». Говорящий: Елифаз."
  6: "ἠνεχύραζες δὲ τοὺς ἀδελφούς σου διὰ κενῆς — «ибо ты брал залог у братьев твоих напрасно» (ἐνεχυράζω — брать в залог; διὰ κενῆς — попусту). ἀμφίασιν δὲ γυμνῶν ἀφείλου — «и одежду нагих отнимал» (ἀμφίασις — одеяние; ἀφαιρέω — отнимать); слав. «в залог бо имал еси от братии твоея вотще». Говорящий: Елифаз."
  7: "οὐδὲ ὕδωρ διψῶντας ἐπότισας — «и воды жаждущих не напоил» (ποτίζω — поить). ἀλλὰ πεινώντων ἐστέρησας ψωμόν — «но голодных лишил куска» (ψωμός — кусок хлеба; στερέω — лишать); слав. «ниже водою жаждущих напоил еси, но алчущих лишил еси хлеба». Говорящий: Елифаз."
  8: "ἐθαύμασας δέ τινων πρόσωπον — «и дивился лицу некоторых», т. е. угождал сильным (θαυμάζω πρόσωπον — гебраизм «смотреть на лицо, лицеприятствовать»). ᾤκισας δὲ τοὺς ἐπὶ τῆς γῆς — «и поселил (низвергнул) бывших на земле»; слав. «повергал еси убогих на земли». Говорящий: Елифаз."
  9: "χήρας δὲ ἐξαπέστειλας κενάς — «вдов же отпустил ни с чем» (χήρα — вдова; ἐξαποστέλλω — отсылать). ὀρφανοὺς δὲ ἐκάκωσας — «и сирот озлобил» (ὀρφανός); слав. «вдовицы же отпустил еси тщы и сироты озлобил еси». Говорящий: Елифаз."
  10: "τοιγαροῦν ἐκύκλωσάν σε παγίδες — «потому окружили тебя сети» (τοιγαροῦν — итак, посему; παγίς — сеть, ловушка). ἐσπούδασέν σε πόλεμος ἐξαίσιος — «и поспешила на тебя война страшная» (ἐξαίσιος — необычайный); слав. «и поспеши на тя рать велика». Говорящий: Елифаз."
  11: "τὸ φῶς σοι σκότος ἀπέβη — «свет тебе тьмою стал» (ἀποβαίνω — становиться). κοιμηθέντα δὲ ὕδωρ σε ἐκάλυψεν — «уснувшего же вода тебя покрыла»; слав. «свет тебе тма бысть, уснувшаго же вода тя покры». Говорящий: Елифаз."
  12: "μὴ οὐχὶ ὁ τὰ ὑψηλὰ ναίων ἐφορᾷ — «не Он ли, живущий на высотах, взирает» (ναίω — обитать; ἐφοράω — надзирать). τοὺς δὲ ὕβρει φερομένους ἐταπείνωσεν — «носящихся с надменностью смирил» (ὕβρις — надменность, обида); слав. «укоризною же возносящихся смири». Говорящий: Елифаз."
  13: "καὶ εἶπας — «и ты сказал»: далее Елифаз приводит слова Иова, поэтому 『』. Τί ἔγνω ὁ ἰσχυρός — «что знает Сильный» (ἰσχυρός — сильный). ἦ κατὰ τοῦ γνόφου κρινεῖ — «разве через мрак будет судить» (γνόφος — мрак, облако); слав. «или во мраце разсудит»."
  14: "νέφη ἀποκρυφὴ αὐτοῦ — «облака — покров (скрытие) его» (ἀποκρυφή — укрытие). καὶ οὐχ ὁραθήσεται — «и не будет видим». γῦρον οὐρανοῦ διαπορεύσεται — «круг небесный обходит» (γῦρος — круг); слав. «и круг небесе обходит». Продолжение 『』 из ст. 13, закрывается здесь. Говорящий: Елифаз."
  15: "μὴ τρίβον αἰώνιον φυλάξεις — «разве будешь держать путь древний» (τρίβος — тропа, путь; αἰώνιος — древний, вековой). ἣν ἐπάτησαν ἄνδρες ἄδικοι — «который попрали мужи неправедные» (πατέω — топтать); слав. «еда стезю древнюю сохраниши, в нюже ходиша мужие неправедни». Говорящий: Елифаз."
  16: "οἳ συνελήμφθησαν ἄωροι — «которые взяты были преждевременно» (συλλαμβάνω — схватывать; ἄωρος — не ко времени). ποταμὸς ἐπιρρέων οἱ θεμέλιοι αὐτῶν — «река наводняющая — основания их» (ἐπιρρέω — разливаться; θεμέλιος — основание): фраза оборвана, грамматика сломана и в LXX, и в слав. («река текущая основания их»); передано буквально, без сглаживания. Говорящий: Елифаз."
  17: "οἱ λέγοντες — «говорящие»: слова беззаконников, поэтому 『』. Κύριος τί ποιήσει ἡμῖν — «что сделает нам Господь». ἢ τί ἐπάξεται ἡμῖν ὁ παντοκράτωρ — «или что наведёт на нас Вседержитель» (ἐπάγω — наводить); слав. «глаголющии: что сотворит нам Господь? или что нанесет на ны вседержитель?». Говорящий: Елифаз."
  18: "ὃς δὲ ἐνέπλησεν τοὺς οἴκους αὐτῶν ἀγαθῶν — «Он же наполнил домы их благами» (ἐμπίπλημι). βουλὴ δὲ ἀσεβῶν πόρρω ἀπ᾿ αὐτοῦ — «совет же нечестивых далёк от него» (βουλή — совет, замысел); слав. «совет же нечестивых далече от него». Местоимение «него» оставлено двусмысленным, как в греческом. Говорящий: Елифаз."
  19: "ἰδόντες δίκαιοι ἐγέλασαν — «увидев, праведники посмеялись» (γέλαω). ἄμεμπτος δὲ ἐμυκτήρισεν — «и непорочный поглумился» (μυκτηρίζω — насмехаться, поднимать нос); слав. «видевше праведницы возсмеяшася, непорочен же глумляшеся им». Говорящий: Елифаз."
  20: "εἰ μὴ ἠφανίσθη ἡ ὑπόστασις αὐτῶν — «не исчезло ли имение их» (ὑπόστασις — имущество, состояние; ἀφανίζω — уничтожать). τὸ κατάλειμμα αὐτῶν καταφάγεται πῦρ — «остаток их пожрёт огонь» (κατάλειμμα — остаток); слав. «не погибе ли имение их, и останки их пояст огнь». Говорящий: Елифаз."
  21: "γενοῦ δὴ σκληρός — «итак будь твёрд» (σκληρός — жёсткий, твёрдый). ἐὰν ὑπομείνῃς — «если претерпишь» (ὑπομένω). εἶτ ὁ καρπός σου ἔσται ἐν ἀγαθοῖς — «тогда плод твой будет в благах» (καρπός — плод); слав. «буди убо тверд, аще претерпиши, потом плод твой будет во благих». Говорящий: Елифаз."
  22: "ἔκλαβε δὲ ἐκ στόματος αὐτοῦ ἐξηγορίαν — «прими из уст Его изречение» (ἐξηγορία — изъяснение, изречение; ἐκλαμβάνω — принимать). ἀνάλαβε τὰ ῥήματα αὐτοῦ ἐν καρδίᾳ σου — «прими слова Его в сердце твоё» (ἀναλαμβάνω — брать); слав. «приими же из уст его изречение». Говорящий: Елифаз."
  23: "ἐὰν δὲ ἐπιστραφῇς καὶ ταπεινώσῃς σεαυτὸν ἔναντι κυρίου — «если обратишься и смиришь себя пред Господом» (ἐπιστρέφω, ταπεινόω). πόρρω ἐποίησας ἀπὸ διαίτης σου τὸ ἄδικον — «далеко удалил от жилища твоего неправду» (δίαιτα — жилище); слав. «и далече сотвориши от жилища твоего неправду». Говорящий: Елифаз."
  24: "θήσῃ ἐπὶ χώματι ἐν πέτρᾳ — «положишь на прахе, в скале» (χῶμα — насыпь, прах). ὡς πέτρᾳ χειμάρρους Ωφιρ — «как скале — поток Офира» (χείμαρρος — поток; Ωφιρ — オフィル, страна золота). Ни в LXX, ни в слав. слово «золото» не названо (в МТ оно есть, в ru «блестящий металл»); не добавлено, стих тёмен — передан буквально. Говорящий: Елифаз."
  25: "ἔσται οὖν σου ὁ παντοκράτωρ βοηθὸς ἀπὸ ἐχθρῶν — «будет тебе Вседержитель помощником от врагов» (βοηθός). καθαρὸν δὲ ἀποδώσει σε ὥσπερ ἀργύριον πεπυρωμένον — «и чистым сделает тебя, как серебро прожжённое» (πυρόω — очищать огнём); слав. «чиста же сотворит тя якоже сребро разжжено». Говорящий: Елифаз."
  26: "εἶτα παρρησιασθήσῃ ἔναντι κυρίου — «тогда обретёшь дерзновение (свободу речи) пред Господом» (παρρησιάζομαι). ἀναβλέψας εἰς τὸν οὐρανὸν ἱλαρῶς — «радостно воззрев на небо» (ἱλαρῶς — светло, радостно); слав. «потом дерзновение возимееши пред Богом, воззрев весело на небо». Говорящий: Елифаз."
  27: "εὐξαμένου δέ σου πρὸς αὐτόν — «и когда ты помолишься Ему» (εὔχομαι — молиться, давать обет). εἰσακούσεταί σου — «Он услышит тебя». δώσει δέ σοι ἀποδοῦναι τὰς εὐχάς — «и даст тебе воздать обеты твои» (εὐχή — молитва, обет); слав. «даст же ти обеты твоя воздати». Говорящий: Елифаз."
  28: "ἀποκαταστήσει δέ σοι δίαιταν δικαιοσύνης — «и восстановит тебе жилище правды» (ἀποκαθίστημι — восстанавливать; δικαιοσύνη — правда, праведность). ἐπὶ δὲ ὁδοῖς σου ἔσται φέγγος — «и на путях твоих будет светло» (φέγγος — свет); слав. «устроит же ти жилище правды, на путех же твоих будет свет». Говорящий: Елифаз."
  29: "ὅτι ἐταπείνωσεν αὐτόν — в LXX «ибо он унизил его» (3 л.), καὶ ἐρεῖς Ὑπερηφανεύσατο — «и скажешь: возгордился». Слав. читает иначе, во 2-м лице: «яко смирил еси себе, тогда речеши: вознесеся»; по паритету взят слав. (あなたが自分を低くしたなら…『高く上げられた』). κύφοντα ὀφθαλμοῖς σώσει — «согбенного очами спасёт» (κύφω — сгибать); слав. «поникша очима спасет». Говорящий: Елифаз."
  30: "ῥύσεται ἀθῷον — «избавит неповинного» (ἀθῷος — невинный, невредимый). διασώθητι ἐν καθαραῖς χερσίν σου — «и спасись чистыми руками твоими» (διασῴζω); слав. «избавит неповиннаго, и спасешися чистыма рукама твоима». Закрывающая кавычка — конец речи Елифаза."
