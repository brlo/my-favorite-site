# jp-box, Иов, глава 22. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге только 1–2; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 22: третья речь Елифаза (2–30): Бог не нуждается в человеке (2–4),
# обвинение в грехах (5–9), потому и беда (10–11), Бог видит с высоты (12–14),
# путь древних беззаконников (15–20), призыв к обращению и обетование (21–30).
# Голоса: ст. 1 — формула, повествование, вне кавычек; ст. 2–30 — речь Елифаза, одна
# цитата 「…」 от начала ст. 2 до конца ст. 30. Внутри речи слова Иова, которые
# Елифаз приводит (13–14), слова беззаконников (17) и слова, которые скажет сам
# человек (29), — 『…』.
# Красного и синего нет (Ветхий Завет).
# Нумерация по gr: 30 стихов; в csl-ru тоже 30, деление совпадает.
# Важно: в LXX ст. 2 дословно повторяет первую половину 21:22 (см. notes);
# в МТ и ru здесь иное — «разве может человек принести пользу Богу?».
# 〔…〕 нет: все стихи есть в gr-lxx-byz. Сносок ⟨…⟩ нет: 全能者, 正しい者,
# 不敬な者, 知恵, オフィル уже в корпусе. Имена — транслитерация греческого (LXX).

