verses:
  1: "イエスは十二人[じゅうににん]の弟子[でし]たちを呼[よ]び寄[よ]せ、汚[けが]れた霊[れい]を追[お]い出[だ]して、あらゆる病気[びょうき]と患[わずら]いを癒[いや]すための権能[けんのう]を、彼[かれ]らにお与[あた]えになった。"
  2: "さて、十二使徒[じゅうにしと]とは、次[つぎ]の者[もの]たちである。第一[だいいち]は、ペトロと呼[よ]ばれるシモン、その兄弟[きょうだい]アンデレ、次[つぎ]にゼベダイの子[こ]ヤコブとその兄弟[きょうだい]ヨハネ、"
  3: "フィリポ、バルトロマイ、トマス、徴税人[ちょうぜいにん]のマタイ、アルファイの子[こ]ヤコブ、そして〔レバイと呼[よ]ばれる〕タダイ、"
  4: "熱心党[ねっしんとう]のシモン、それに、イエスを引[ひ]き渡[わた]したイスカリオテのユダ。"
  5: "イエスはこの十二人[じゅうににん]を遣[つか]わし、彼[かれ]らに命[めい]じて言[い]われた。「<j>異邦人[いほうじん]の道[みち]を行[い]ってはならない。サマリア人[びと]の町[まち]に入[はい]ってもならない。</j>"
  6: "<j>むしろ、イスラエルの家[いえ]の滅[ほろ]びた羊[ひつじ]のもとへ行[い]きなさい。</j>"
  7: "<j>行[い]って、『天[てん]の国[くに]は近[ちか]づいた』と告[つ]げ知[し]らせよ。</j>"
  8: "<j>病人[びょうにん]を癒[いや]し、死者[ししゃ]を生[い]き返[かえ]らせ、重[おも]い皮膚病[ひふびょう]の人[ひと]を清[きよ]め、悪霊[あくりょう]を追[お]い出[だ]しなさい。ただで受[う]けたのだから、ただで与[あた]えなさい。</j>"
  9: "<j>腰[こし]の帯[おび]に、金[きん]や銀[ぎん]、銅[どう]を蓄[たくわ]えてはならない。</j>"
  10: "<j>旅[たび]には袋[ふくろ]も、下着[したぎ]二枚[にまい]も、履物[はきもの]も、杖[つえ]も、携[たずさ]えてはならない。働[はたら]く者[もの]には、その食[た]べ物[もの]があるのが当然[とうぜん]だからである。</j>"
  11: "<j>町[まち]でも村[むら]でも、入[はい]った先[さき]で、そこにふさわしい人物[じんぶつ]がだれかを見定[みさだ]めなさい。そして、そこを発[た]つ日[ひ]まで、その人[ひと]の家[いえ]に留[とど]まりなさい。</j>"
  12: "<j>家[いえ]に入[はい]るときは、『平和[へいわ]があるように』と挨拶[あいさつ]せよ。</j>"
  13: "<j>その家[いえ]がふさわしければ、あなたがたの平和[へいわ]はその家[いえ]に臨[のぞ]み、ふさわしくなければ、その平和[へいわ]はあなたがたに返[かえ]って来[く]る。</j>"
  14: "<j>もし、あなたがたを受[う]け入[い]れようとせず、あなたがたの言葉[ことば]に聞[き]く耳[みみ]を持[も]たない者[もの]があれば、その家[いえ]から、またその町[まち]から出[で]るときに、足[あし]に付[つ]いた埃[ちり]を振[ふ]り落[お]としなさい。</j>"
  15: "<j>はっきり言[い]っておく。裁[さば]きの日[ひ]には、ソドムとゴモラの地[ち]の方[ほう]が、この町[まち]よりも軽[かる]く済[す]む。</j>」"
  16: "「<j>わたしはあなたがたを、狼[おおかみ]の群[む]れの中[なか]の羊[ひつじ]のように遣[つか]わす。だから、蛇[へび]のように賢[かしこ]く、鳩[はと]のように純真[じゅんしん]になりなさい。</j>"
  17: "<j>人[ひと]には十分[じゅうぶん]に気[き]を配[くば]りなさい。あなたがたは地方法院[ちほうほういん]に引[ひ]きたてられ、会堂[かいどう]で鞭[むち]の刑[けい]を受[う]けるからである。</j>"
  18: "<j>また、わたしのために、総督[そうとく]や王[おう]の前[まえ]へ引[ひ]いて行[い]かれる。それは、彼[かれ]らと異邦人[いほうじん]への証[あかし]となる。</j>"
  19: "<j>引[ひ]き渡[わた]されるとき、どう言[い]おうか、何[なに]を言[い]おうかと思[おも]い悩[なや]んではならない。そのとき、言[い]うべきことはあなたがたに与[あた]えられるからである。</j>"
  20: "<j>語[かた]るのはあなたがた自身[じしん]ではなく、あなたがたのうちで語[かた]る、あなたがたの父[ちち]の霊[れい]である。</j>"
  21: "<j>兄弟[きょうだい]は兄弟[きょうだい]を、父[ちち]は子[こ]を死[し]に渡[わた]し、子[こ]は親[おや]に立[た]ち向[む]かって、これを殺[ころ]すだろう。</j>"
  22: "<j>わたしの名[な]のゆえに、あなたがたはすべての人[ひと]から憎[にく]まれることになる。だが、最後[さいご]まで耐[た]え抜[ぬ]く者[もの]は救[すく]われる。</j>"
  23: "<j>この町[まち]で迫害[はくがい]されたら、ほかの町[まち]へ逃[に]げなさい。はっきり言[い]っておく。あなたがたがイスラエルの町々[まちまち]を巡[めぐ]り終[お]えないうちに、人[ひと]の子[こ]は来[く]る。</j>"
  24: "<j>弟子[でし]が師[し]を上回[うわまわ]ることはなく、僕[しもべ]が主人[しゅじん]を上回[うわまわ]ることもない。</j>"
  25: "<j>弟子[でし]が師[し]と同[じ]ようになり、僕[しもべ]が主人[しゅじん]と同[じ]ようになれば、それで十分[じゅうぶん]である。家[いえ]の主人[しゅじん]がベルゼブル⟨悪霊[あくりょう]の頭[かしら]とされた名[な]。⟩と呼[よ]ばれたのなら、その家[いえ]の者[もの]たちはなおさらである。</j>」"
  26: "「<j>だから、彼[かれ]らを怖[こわ]がってはならない。覆[おお]われたものが明[あき]らかにされずに終[お]わることはなく、隠[かく]されたことが知[し]られずに済[す]むこともないからである。</j>"
  27: "<j>わたしが暗[くら]やみのうちで語[かた]ったことは、あなたがたも光[ひかり]の下[した]で語[かた]れ。そっと耳[みみ]に告[つ]げられたことは、屋[や]の上[うえ]から告[つ]げ広[ひろ]めよ。</j>"
  28: "<j>体[からだ]を殺[ころ]せても、魂[たましい]を殺[ころ]せない者[もの]たちを怖[こわ]がるには及[およ]ばない。怖[こわ]がるべきなのは、地獄[じごく]で魂[たましい]も体[からだ]も滅[ほろ]ぼしうる方[かた]である。</j>"
  29: "<j>二羽[にはわ]の雀[すずめ]が一[いち]アサリオン⟨ローマの小[ちい]さな銅貨[どうか]。⟩で売[う]られているではないか。その一羽[いちわ]さえ、あなたがたの父[ちち]なしには地[ち]に落[お]ちることはない。</j>"
  30: "<j>あなたがたに至[いた]っては、頭[あたま]の髪[かみ]の毛[け]までも、すべて数[かぞ]えられている。</j>"
  31: "<j>だから、何[なに]も怖[こわ]がることはない。あなたがたは雀[すずめ]の群[む]れより、ずっと値打[ねう]ちのある者[もの]たちなのだ。</j>」"
  32: "「<j>だから、だれでも人々[ひとびと]の前[まえ]でわたしを認[みと]める者[もの]は、わたしも天[てん]におられるわたしの父[ちち]の前[まえ]で、その人[ひと]を認[みと]める。</j>"
  33: "<j>しかし、人々[ひとびと]の前[まえ]でわたしを否[いな]む者[もの]は、わたしも天[てん]におられるわたしの父[ちち]の前[まえ]で、その人[ひと]を否[いな]む。</j>」"
  34: "「<j>わたしが地[ち]の上[うえ]に平和[へいわ]を投[とう]じるために来[き]た、などと思[おも]い込[こ]んではならない。投[とう]じるのは平和[へいわ]ではなく、剣[つるぎ]である。</j>"
  35: "<j>わたしは、人[ひと]をその父[ちち]から、娘[むすめ]をその母[はは]から、嫁[よめ]をその姑[しゅうとめ]から引[ひ]き離[はな]すために来[き]た。</j>"
  36: "<j>こうして、その人[ひと]の家[いえ]の者[もの]たちが、その人[ひと]の敵[てき]となる。</j>"
  37: "<j>父[ちち]や母[はは]をわたし以上[いじょう]に愛[あい]する者[もの]は、わたしにふさわしくない。息子[むすこ]や娘[むすめ]をわたし以上[いじょう]に愛[あい]する者[もの]も、わたしにふさわしくない。</j>"
  38: "<j>自分[じぶん]の十字架[じゅうじか]を取[と]り上[あ]げて、このわたしについて来[こ]ない者[もの]も、わたしに値[あたい]しない。</j>"
  39: "<j>自分[じぶん]の命[いのち]を手[て]に入[い]れた者[もの]はそれを失[うしな]い、わたしのためにそれを失[うしな]う者[もの]は、それを見[み]いだすのである。</j>」"
  40: "「<j>あなたがたを迎[むか]え入[い]れる者[もの]は、わたしを迎[むか]え入[い]れる者[もの]である。わたしを迎[むか]え入[い]れる者[もの]は、わたしを遣[つか]わした方[かた]を迎[むか]え入[い]れる者[もの]である。</j>"
  41: "<j>預言者[よげんしゃ]を、預言者[よげんしゃ]だからという理由[りゆう]で受[う]け入[い]れる人[ひと]は、預言者[よげんしゃ]の報[むく]いを受[う]ける。正[ただ]しい者[もの]を、正[ただ]しい者[もの]だからという理由[りゆう]で受[う]け入[い]れる人[ひと]は、正[ただ]しい者[もの]の報[むく]いを受[う]ける。</j>"
  42: "<j>はっきり言[い]っておく。この小[ちい]さな者[もの]の一人[ひとり]に、冷[つめ]たい水[みず]を一杯[いっぱい]でも飲[の]ませてくれる人[ひと]は、その人[ひと]がわたしの弟子[でし]であるというだけで、必[かなら]ずその報[むく]いを失[うしな]わない。</j>」"

notes:
  2: "τῶν δὲ δώδεκα ἀποστόλων — родительный при имени («двенадцати апостолов имена»); 使徒, как в Мк 3:14."
  3: "В критической базе только Θαδδαῖος. Церковь читает Λεββαῖος ὁ ἐπικληθεὶς Θαδδαῖος (Елизаветинская: «Леввей, нареченный Фаддей»; jp-joc レワェイ、稱してファデイ) — добавка в 〔〕. レバイ — современная передача Λεββαῖος."
  4: "Σίμων ὁ Καναναῖος — от арамейского «ревнитель», отсюда 熱心党のシモン (как в jp-ni)."
  5: "εἰς ὁδὸν ἐθνῶν — буквально «на путь язычников», не сглажено до «к язычникам»."
  8: "νεκροὺς ἐγείρετε («мёртвых воскрешайте») есть в критической базе, скобки не нужны. Порядок греческий: больные, мёртвые, прокажённые, бесы."
  12: "ἀσπάσασθε αὐτήν — «приветствуйте его»; содержание приветствия (『平和があるように』) взято из ст. 13, как у jp-ni и jp-joc (此の家に平安と言へ)."
  14: "В критической базе [ἐκ] в скобках — частицу не маркирую (ср. 3:2)."
  15: "ἀνεκτότερον ἔσται — безличное «будет сноснее», без дополнения; поэтому 軽く済む, без добавления «наказание». Так же 11:22 и 11:24."
  19: "μεριμνήσητε — то же слово, что в 6:25 (思い悩む); лексическая связь сохранена."
  23: "В критической базе [ἂν] в скобках — не маркирую."
  25: "Βεελζεβούλ — имя князя бесов; сноска по образцу Мк 3:22, первое упоминание в Мф. πόσῳ μᾶλλον — эллипсис без сказуемого, поэтому 「なおさらである」, без добавления «скажут»."
  29: "ἀσσάριον — римская мелкая медная монета (1/16 динария); сноска, как у クァドランス и デナリオン. ἄνευ τοῦ πατρὸς ὑμῶν — «без Отца вашего», без добавления «воли/позволения»."
  35: "διχάσαι … κατὰ τοῦ πατρός — «разделить против отца»; jp-ni передаёт «敵対させる». Оставил 引き離す (ср. jp-joc 分つ), чтобы сохранить образ разделения."
