verses:
  1: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  2: "「人[ひと]の子[こ]よ、あなたは不法[ふほう]のただ中[なか]に住[す]んでいる。彼[かれ]らには見[み]る目[め]がありながら見[み]ず、聞[き]く耳[みみ]がありながら聞[き]かない。彼[かれ]らは逆[さか]らう家[いえ]だからである。"
  3: "人[ひと]の子[こ]よ、あなたは捕囚[ほしゅう]の荷物[にもつ]を昼[ひる]の間[あいだ]に用意[ようい]せよ。そして、彼[かれ]らの目[め]の前[まえ]で、あなたの場所[ばしょ]からほかの場所[ばしょ]へ移[うつ]れ。彼[かれ]らが見[み]るためである。彼[かれ]らは逆[さか]らう家[いえ]だからである。"
  4: "あなたは昼[ひる]、彼[かれ]らの目[め]の前[まえ]で、自分[じぶん]の荷物[にもつ]を捕囚[ほしゅう]の荷物[にもつ]のように持[も]ち出[だ]せ。夕[ゆう]べには、捕囚[ほしゅう]が出[で]て行[い]くように、彼[かれ]らの目[め]の前[まえ]で出[で]て行[い]け。"
  5: "彼[かれ]らの目[め]の前[まえ]で、あなたは自分[じぶん]のために壁[かべ]に穴[あな]を掘[ほ]り、そこから出[で]て行[い]け。"
  6: "彼[かれ]らの目[め]の前[まえ]で、あなたは肩[かた]に負[お]われて運[はこ]ばれ、暗[くら]がりの中[なか]で出[で]て行[い]け。あなたは顔[かお]を覆[おお]い、地[ち]を見[み]てはならない。わたしはあなたをイスラエルの家[いえ]へのしるしとしたからである。」"
  7: "わたしは命[めい]じられたとおりに、すべてを行[おこな]った。昼[ひる]、わたしは捕囚[ほしゅう]の荷物[にもつ]のように荷物[にもつ]を持[も]ち出[だ]し、夕[ゆう]べには手[て]で壁[かべ]を掘[ほ]り、暗[くら]がりの中[なか]で出[で]た。わたしは彼[かれ]らの目[め]の前[まえ]で肩[かた]に負[お]われて運[はこ]ばれた。"
  8: "朝[あさ]、主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  9: "「人[ひと]の子[こ]よ、イスラエルの家[いえ]、あの逆[さか]らう家[いえ]は、あなたに『何[なに]をしているのか』と言[い]わなかったか。"
  10: "彼[かれ]らに言[い]え。主[しゅ]なる神[かみ]はこう言[い]われる。この託宣[たくせん]は、エルサレムの君[きみ]と、民[たみ]を導[みちび]く者[もの]たち、および彼[かれ]らのただ中[なか]にいるイスラエルの全[ぜん]家[か]についてである。"
  11: "言[い]え。わたしは都[みやこ]のただ中[なか]でしるしを行[おこな]う。わたしが行[おこな]ったとおりに、彼[かれ]らにもなる。彼[かれ]らは捕[と]らえられて移[うつ]され、捕囚[ほしゅう]となって行[い]く。"
  12: "彼[かれ]らのただ中[なか]にいる君[きみ]は肩[かた]に負[お]われて運[はこ]ばれ、暗[くら]がりの中[なか]で壁[かべ]を抜[ぬ]けて出[で]て行[い]く。彼[かれ]が出[で]られるように、壁[かべ]に穴[あな]が掘[ほ]られる。彼[かれ]は顔[かお]を覆[おお]い、人[ひと]の目[め]に姿[すがた]を見[み]せず、自分[じぶん]も地[ち]を見[み]ない。"
  13: "わたしは彼[かれ]の上[うえ]に網[あみ]を広[ひろ]げ、彼[かれ]はわたしの罠[わな]にかかる。わたしは彼[かれ]をバビロンへ、カルデアの地[ち]へ連[つ]れて行[い]く。彼[かれ]はその地[ち]を見[み]ず、そこで死[し]ぬ。"
  14: "わたしは彼[かれ]の周[まわ]りにいるすべての者[もの]、彼[かれ]を助[たす]ける者[もの]たち、彼[かれ]を支[ささ]える者[もの]たちを、あらゆる風[かぜ]の中[なか]へ散[ち]らし、彼[かれ]らの後[うし]ろに剣[つるぎ]を注[そそ]ぎ出[だ]す。"
  15: "わたしが彼[かれ]らを異邦人[いほうじん]の間[あいだ]に散[ち]らし、国々[くにぐに]に追[お]い散[ち]らすとき、彼[かれ]らはわたしが主[しゅ]であることを知[し]る。"
  16: "わたしは彼[かれ]らの中[なか]から、剣[つるぎ]と飢[う]えと死[し]から、数[かず]の少[すく]ない者[もの]たちを残[のこ]す。彼[かれ]らが行[い]った異邦人[いほうじん]の間[あいだ]で、自分[じぶん]たちのすべての不法[ふほう]を語[かた]り告[つ]げ、彼[かれ]らはわたしが主[しゅ]であることを知[し]るためである。」"
  17: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  18: "「人[ひと]の子[こ]よ、あなたはパンを痛[いた]みとともに食[た]べ、水[みず]を苦[くる]しみと悩[なや]みとともに飲[の]め。"
  19: "あなたはこの地[ち]の民[たみ]に言[い]え。主[しゅ]なる神[かみ]は、イスラエルの地[ち]に住[す]むエルサレムの住民[じゅうみん]たちにこう言[い]われる。彼[かれ]らは自分[じぶん]たちのパンを欠乏[けつぼう]とともに食[た]べ、自分[じぶん]たちの水[みず]を荒廃[こうはい]とともに飲[の]む。地[ち]がその満[み]ちるものとともに荒[あ]れ果[は]てるためである。その中[なか]に住[す]む者[もの]がみな不敬[ふけい]だからである。"
  20: "人[ひと]の住[す]む町々[まちまち]は荒[あ]れ果[は]て、地[ち]は荒廃[こうはい]となる。あなたがたはわたしが主[しゅ]であることを知[し]る。」"
  21: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  22: "「人[ひと]の子[こ]よ、あなたがたがイスラエルの地[ち]で言[い]っているこのことわざは何[なに]か。『日[ひ]は遠[とお]く、すべての幻[まぼろし]は滅[ほろ]びた』と言[い]っているではないか。"
  23: "それゆえ、彼[かれ]らに言[い]え。主[しゅ]なる神[かみ]はこう言[い]われる。わたしはこのことわざを退[しりぞ]け、イスラエルの家[いえ]ではもはやこのことわざを言[い]わせない。むしろ、彼[かれ]らに言[い]え。日[ひ]々[び]は近[ちか]づき、すべての幻[まぼろし]の言葉[ことば]が成就[じょうじゅ]する。"
  24: "イスラエルの子[こ]らの中[なか]に、もはや偽[いつわ]りの幻[まぼろし]も、人[ひと]に取[と]り入[い]る占[うらな]いをする者[もの]もいなくなるからである。"
  25: "わたしは主[しゅ]である。わたしはわたしの言葉[ことば]を語[かた]る。わたしは語[かた]り、行[おこな]い、もはや延[の]ばさない。逆[さか]らう家[いえ]よ、あなたがたの日[ひ]々[び]のうちに、わたしは言葉[ことば]を語[かた]り、それを行[おこな]う、と主[しゅ]なる神[かみ]は言[い]われる。」"
  26: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  27: "「人[ひと]の子[こ]よ、見[み]よ、イスラエルの家[いえ]、あの逆[さか]らう家[いえ]は言[い]っている。『彼[かれ]が見[み]る幻[まぼろし]は遠[とお]い日[ひ]々[び]のためであり、彼[かれ]は遠[とお]い時代[じだい]について預言[よげん]している』と。"
  28: "それゆえ、彼[かれ]らに言[い]え。主[しゅ]はこう言[い]われる。わたしが語[かた]るすべての言葉[ことば]は、もはや延[の]ばされない。わたしは語[かた]り、それを行[おこな]う、と主[しゅ]なる神[かみ]は言[い]われる。」"

notes:
  1: "Вводная формула вне кавычек."
  2: "ἐν μέσῳ τῶν ἀδικιῶν αὐτῶν — «среди неправд их»; ὀφθαλμοὺς τοῦ βλέπειν καὶ οὐ βλέπουσιν — «глаза, чтобы видеть, и не видят»; οἶκος παραπικραίνων — «дом преогорчевающий (мятежный)», формула главы."
  3: "σκεύη αἰχμαλωσίας ἡμέρας — «сосуды (вещи) плена днём»; αἰχμαλωτευθήσῃ ἐκ τοῦ τόπου σου — «будешь отведён в плен с места твоего» (pass.); ὅπως ἴδωσιν — «чтобы увидели»; повтор формулы «дом мятежный»."
  4: "ἐξοίσεις τὰ σκεύη σου — «вынесешь вещи твои»; ὡς ἐκπορεύεται αἰχμάλωτος — «как выходит пленник»."
  5: "διόρυξον σεαυτῷ εἰς τὸν τοῖχον — «прокопай себе в стене»; διεξελεύσῃ δι᾽ αὐτοῦ — «пройдёшь через неё»."
  6: "ἐπ᾽ ὤμων ἀναλημφθήσῃ — «на плечах будешь поднят»; κεκρυμμένος — «скрытно, в темноте» (κρύπτω); συγκαλύψεις τὸ πρόσωπον — «закроешь лицо»; τέρας δέδωκά σε — «знамением (чудом) дал тебя» (τέρας)."
  7: "ἐποίησα οὕτως κατὰ πάντα — «сделал так во всём»; διώρυξα ... τὸν τοῖχον — «прокопал стену»; κεκρυμμένος ἐξῆλθον — «вышел скрытно»; ἐπ᾽ ὤμων ἀνελήμφθην — «на плечах был поднят»."
  8: "Вводная формула; τὸ πρωΐ — «утром»."
  9: "οὐκ εἶπαν πρὸς σὲ ... Τί σὺ ποιεῖς; — «не сказали ли тебе... что ты делаешь?»: слова дома Израилева — 『…』; начинается речь Господа 9–16."
  10: "Ὁ ἄρχων καὶ ὁ ἀφηγούμενος ἐν Ιερουσαλημ — «князь и вождь в Иерусалиме»; слав. «ко князю и старейшинам»; παντὶ οἴκῳ Ισραηλ, οἵ εἰσιν ἐν μέσῳ αὐτῶν — «всему дому Израилеву, которые среди них»."
  11: "ἐγὼ τέρατα ποιῶ — «Я знамения делаю»; ὃν τρόπον πεποίηκα, οὕτως ἔσται αὐτοῖς — «как я сделал, так будет им»; ἐν μετοικεσίᾳ καὶ ἐν αἰχμαλωσίᾳ — «в переселение и в плен»."
  12: "ὁ ἄρχων ... ἐπ᾽ ὤμων ἀρθήσεται — «князь... на плечах будет поднят»; διορύξει τοῦ ἐξελθεῖν αὐτόν — «прокопают, чтобы он вышел»; ὅπως μὴ ὁραθῇ ὀφθαλμῷ — «чтобы не был виден глазом»."
  13: "ἐκπετάσω τὸ δίκτυόν μου — «распростру сеть Мою»; ἐν τῇ περιοχῇ μου — «в окружении (тенетах) Моём» (περιοχή); ἄξω εἰς Βαβυλῶνα — «отведу в Вавилон»; αὐτὴν οὐκ ὄψεται — «её не увидит»; τελευτήσει — «умрёт»."
  14: "τοὺς κύκλῳ αὐτοῦ ... βοηθούς — «вокруг него помощников»; διασπερῶ εἰς πάντα ἄνεμον — «рассею по всякому ветру»; ῥομφαίαν ἐκκενώσω ὀπίσω αὐτῶν — «меч изолью (обнажу) вслед их»."
  15: "ἐν τῷ διασκορπίσαι με αὐτοὺς — «когда рассею их»; ἐν τοῖς ἔθνεσιν ... ἐν ταῖς χώραις — «по народам... по странам»."
  16: "ὑπολείψομαι ἐξ αὐτῶν ἄνδρας ἀριθμῷ — «оставлю из них мужей по числу (немногих)»; ἐκ ῥομφαίας καὶ ἐκ λιμοῦ καὶ ἐκ θανάτου — «от меча, голода и смерти»; ὅπως ἐκδιηγῶνται πάσας τὰς ἀνομίας — «чтобы рассказывали все беззакония»; здесь закрывается речь."
  17: "Вводная формула."
  18: "μετ᾽ ὀδύνης φάγεσαι — «с болью будешь есть»; μετὰ βασάνου καὶ θλίψεως πίεσαι — «с мучением и скорбью будешь пить»."
  19: "Τοὺς ἄρτους αὐτῶν μετ᾽ ἐνδείας — «хлебы их с недостатком (нуждой)» (ἔνδεια); μετὰ ἀφανισμοῦ — «с уничтожением (опустошением)»; ὅπως ἀφανισθῇ ἡ γῆ σὺν πληρώματι αὐτῆς — «чтобы опустела земля с полнотой (изобилием) её»; ἐν ἀσεβείᾳ — «в нечестии»."
  20: "αἱ πόλεις ... ἐξερημωθήσονται — «города опустеют» (ἐρημόω); εἰς ἀφανισμόν — «в опустошение»; здесь закрывается речь."
  21: "Вводная формула."
  22: "τίς ὑμῖν ἡ παραβολή — «что у вас за притча (поговорка)»; Μακρὰν αἱ ἡμέραι — «далеки дни»; ἀπώλωνεν ὅρασις — «погибло видение»: слова народа — 『…』; начинается речь 22–25."
  23: "ἀποστρέψω τὴν παραβολὴν ταύτην — «отвращу (упраздню) притчу сию»; Ἠγγίκασιν αἱ ἡμέραι — «приблизились дни» (ἐγγίζω); λόγος πάσης ὁράσεως — «слово всякого видения»."
  24: "ὅρασις ψευδής — «видение ложное»; μαντευόμενος τὰ πρὸς χάριν — «прорицающий в угоду (льстивое)» (χάρις — угождение)."
  25: "λαλήσω καὶ ποιήσω — «скажу и сделаю»; οὐ μὴ μηκύνω ἔτι — «не буду более отлагать» (μηκύνω — удлинять, медлить); οἶκος ὁ παραπικραίνων — «дом мятежный»; здесь закрывается речь."
  26: "Вводная формула."
  27: "Ἡ ὅρασις, ἣν οὗτος ὁρᾷ, εἰς ἡμέρας πολλάς — «видение, которое он видит, на многие дни»; εἰς καιροὺς μακρούς — «на времена далёкие»: слова дома Израилева — 『…』."
  28: "οὐ μὴ μηκύνωσιν ... πάντες οἱ λόγοι μου — «не будут отложены все слова Мои»; λαλήσω καὶ ποιήσω — «скажу и сделаю»; здесь закрывается речь."
