# jp-box, Иезекииль, глава 12. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 12 (совпадает).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Глава 12: 1–16 знак переселения (вещи, пролом в стене, закрытое лицо; князь,
# сеть, Вавилон); 17–20 хлеб и вода со страхом; 21–25 конец поговорки «далеки дни»;
# 26–28 близость исполнения.
# Голоса: 12:2–6, 12:9–16, 12:18–20, 12:22–25, 12:27–28 — 「…» (речи Господа);
# вложенные 『…』 — слова дома Израилева (9), поговорка (22), слова дома (27).
# 12:7, 12:8, 12:17, 12:21, 12:26 — повествование и вводные формулы вне кавычек.

