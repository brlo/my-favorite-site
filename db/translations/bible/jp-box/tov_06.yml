# jp-box, Товит, глава 6. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc в книге нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 6: путь к Тигру и рыба (1–9), у Рагуила (10–13), Сарра и Асмодей (14–19).
# Диалоги — 「…」; 6:1–6, 10 и 19 — слова рассказчика. Красного и синего нет.
# Нумерация по gr: 19 стихов; сдвиги csl: 6:2–5 = gr 6:1–4, 6:6 = gr 6:5+6,
# 6:7–17 = gr 6:7–17, csl 6:18 = gr 6:18+19 (и добавляет «и пришли в Екватаны»),
# csl 6:1 («и перестала плакать») относится к 5:23. Ориентир — греческий текст.
# 6:8 πανεῦμα — опечатка вместо πνεῦμα, отмечено в notes.
# 〔…〕 нет: все стихи есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 香炉, 新婚の部屋, 悪霊, 婚礼 уже в корпусе.
# Имена — транслитерация греческого (LXX).

