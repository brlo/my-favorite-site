verses:
  1: "道[みち]を行[ゆ]く者[もの]たちは、夕暮[ゆうぐ]れにティグリス川[がわ]のほとりに来[き]て、そこに泊[と]まった。"
  2: "若者[わかもの]が身[み]を洗[あら]おうとして下[お]りると、魚[さかな]が川[かわ]から跳[は]ね上[あ]がり、若者を飲[の]み込[こ]もうとした。"
  3: "天使[てんし]は彼に言[い]った。「その魚[さかな]をつかまえなさい。」若者[わかもの]は魚をつかまえ、地[ち]の上[うえ]に引[ひ]き上[あ]げた。"
  4: "天使[てんし]は彼に言[い]った。「その魚[さかな]を裂[さ]き、心臓[しんぞう]と肝臓[かんぞう]と胆汁[たんじゅう]を取[と]って、安全[あんぜん]にしまっておきなさい。」"
  5: "若者[わかもの]は天使[てんし]が言[い]ったとおりに行[おこな]った。そして魚[さかな]を焼[や]いて食[た]べた。"
  6: "二人[ふたり]は歩[ある]き続[つづ]け、エクバタナに近[ちか]づいた。"
  7: "若者[わかもの]は天使[てんし]に言[い]った。「アザルヤ、兄弟[きょうだい]よ、この魚[さかな]の肝臓[かんぞう]と心臓[しんぞう]と胆汁[たんじゅう]は何[なん]なのか。」"
  8: "彼は言[い]った。「心臓[しんぞう]と肝臓[かんぞう]は、悪霊[あくりょう]か悪[わる]い霊[れい]がだれかを苦[くる]しめるとき、男[おとこ]であれ女[おんな]であれ、その人[ひと]の前[まえ]でこれを燻[くす]べる必要[ひつよう]がある。そうすれば、もう決[けっ]して苦しめられることはない。"
  9: "胆汁[たんじゅう]は、目[め]に白[しろ]い膜[まく]のある人[ひと]に塗[ぬ]るためのもので、その人は癒[い]やされる。」"
  10: "さて、彼らがラゲに近[ちか]づくと、"
  11: "天使[てんし]は若者[わかもの]に言[い]った。「兄弟[きょうだい]よ、今日[きょう]、わたしたちはラグエルのところに泊[と]まる。彼はあなたの親族[しんぞく]であり、彼にはサラという名[な]の一人娘[ひとりむすめ]がいる。"
  12: "わたしは彼女[かのじょ]のことを話[はな]し、あなたに妻[つま]として与[あた]えられるようにしよう。彼女の相続[そうぞく]はあなたに帰[き]するからである。あなただけが彼女の血筋[ちすじ]の者[もの]である。そしてその娘[むすめ]は美[うつく]しく、賢[かしこ]い。"
  13: "そして今[いま]、わたしの言[い]うことを聞[き]きなさい。わたしは彼女[かのじょ]の父[ちち]に話[はな]そう。わたしたちがラゲスから帰[かえ]ったなら、婚礼[こんれい]を挙[あ]げる。というのは、わたしはラグエルを知[し]っているからである。彼はモーセの律法[りっぽう]に従[したが]って、彼女をほかの男[おとこ]に与[あた]えることは決[けっ]してしない。そうでなければ、死[し]の責[せき]を負[お]うことになるからである。彼女の相続[そうぞく]は、ほかのどんな人[ひと]ではなく、あなたが受[う]けるべきものだからである。」"
  14: "そこで若者[わかもの]は天使[てんし]に言[い]った。「アザルヤ、兄弟[きょうだい]よ、わたしは、この娘[むすめ]が七人の男[おとこ]たちに与[あた]えられ、そのすべてが新婚[しんこん]の部屋[へや]で死[し]んだと聞[き]いている。"
  15: "そして今[いま]、わたしは父[ちち]にとってただ一人[ひとり]の子[こ]である。わたしは、入[はい]って行[い]って、前[まえ]の者[もの]たちのように死[し]ぬのではないかと恐[おそ]れている。この娘[むすめ]を悪霊[あくりょう]が愛[あい]していて、彼女に近[ちか]づく者たちのほかは、だれも害[がい]さないからである。そして今、わたしは、自分[じぶん]が死んで、父と母[はは]の命[いのち]を、わたしのことで悲[かな]しみのうちに、彼らの墓[はか]へ下[くだ]してしまうのではないかと恐れている。彼らには、彼らを葬[ほうむ]るほかの息子[むすこ]はいないのだ。」"
  16: "天使[てんし]は彼に言[い]った。「あなたの父[ちち]が、あなたに自分[じぶん]の血筋[ちすじ]から妻[つま]を娶[めと]るようにと命[めい]じた言葉[ことば]を覚[おぼ]えていないのか。そして今[いま]、兄弟[きょうだい]よ、わたしの言うことを聞[き]きなさい。彼女はあなたの妻になるのだから。悪霊[あくりょう]のことは少[すこ]しも気[き]にするな。この夜[よる]、彼女はあなたに妻として与[あた]えられるからである。"
  17: "そして、あなたが新婚[しんこん]の部屋[へや]に入[はい]ったなら、香炉[こうろ]を取[と]り、その魚[さかな]の心臓[しんぞう]と肝臓[かんぞう]の一部[いちぶ]をその上[うえ]に置[お]いて燻[くす]べなさい。そうすれば、悪霊[あくりょう]はそのにおいを嗅[か]ぎ、逃[に]げ去[さ]り、世々[よよ]にわたって再[ふたた]び戻[もど]って来[こ]ない。"
  18: "あなたが彼女[かのじょ]に近[ちか]づくときには、二人[ふたり]とも立[た]ち上[あ]がって、あわれみ深[ふか]い神[かみ]に呼[よ]び求[もと]めなさい。神はあなたがたを救[すく]い、あわれんでくださる。恐[おそ]れてはならない。彼女は世[よ]の初[はじ]めからあなたのために備[そな]えられていたのであり、あなたが彼女を救うのだ。彼女はあなたとともに歩[あゆ]み、わたしは、彼女からあなたに子[こ]どもが生[う]まれると信[しん]じている。」"
  19: "トビアはこれらのことを聞[き]くと、彼女[かのじょ]を愛[あい]した。そして彼の魂[たましい]は彼女に強[つよ]く結[むす]びついた。"

notes:
  1: "Οἱ πορευόμενοι τὴν ὁδόν — идущие дорогою. ἑσπέρας — вечером. ἐπὶ τὸν Τίγριν ποταμόν — к реке Тигру (Τίγρις). ηὐλίζοντο — останавливались на ночлег (αὐλίζομαι). В csl это 6:2; csl 6:1 («И преста плакати») относится к 5:23 и здесь не переводится."
  2: "τὸ παιδάριον — отрок, 若者: здесь Товия. κατέβη περικλύσασθαι — сошёл омыться (περικλύζω). ἀνεπήδησεν ἰχθύς — выскочила рыба (ἀναπηδάω). ἐβουλήθη καταπιεῖν — захотела проглотить (καταπίνω)."
  3: "Ἐπιλαβοῦ τοῦ ἰχθύος — схвати рыбу (ἐπιλαμβάνομαι с род.). ἐκράτησεν — схватил (κρατέω). ἀνέβαλεν ἐπὶ τὴν γῆν — вытащил на землю (ἀναβάλλω)."
  4: "Ἀνάτεμε — разрежь (ἀνατέμνω). καρδία — сердце, ἧπαρ — печень, χολή — желчь. θὲς ἀσφαλῶς — положи сохранно (ἀσφαλῶς); слав. «положи сохранно»."
  5: "ὀπτήσαντες ἔφαγον — изжарив, съели (ὀπτάω). В csl этот стих соединён со следующим (csl 6:6); здесь — по греческому делению."
  6: "ὥδευον — шли (ὁδεύω). ἕως ἤγγισαν ἐν Ἐκβατάνοις — пока не приблизились к Екбатанам (ἐγγίζω). В csl 6:18 в конце добавлено «и приидоста во екватаны» — это повтор данного стиха, в 6:18 не дублируется."
  7: "τὸ ἧπαρ καὶ ἡ καρδία καὶ ἡ χολή — печень, сердце и желчь; порядок греческого сохранён. Ἀζαρια ἄδελφε — звательный падеж: Азария, брат."
  8: "ὀχλῇ — тяготит, мучит (ὀχλέω). δαιμόνιον ἢ πνεῦμα πονηρόν — демон или злой дух. В греч. тексте стоит πανεῦμα — опечатка/искажение вместо πνεῦμα (слав. «дух зол»); переведено 悪い霊 как «злой дух». δεῖ καπνίσαι — должно курить (καπνίζω). οὐκέτι οὐ μὴ ὀχληθῇ — усиленное отрицание: уже не будет мучим."
  9: "ἐγχρῖσαι — помазать (ἐγχρίω). λευκώματα — бельма (λεύκωμα), 白い膜. ἰαθήσεται — исцелится (ἰάομαι)."
  10: "Ὡς δὲ προσήγγισαν τῇ Ραγη — когда приблизились к Раге (Ραγη, дат. ед.); слав. «ко раге». Стих обрывается на запятой: продолжение — в ст. 11 (в греч. тоже запятая)."
  11: "αὐλισθησόμεθα — будем ночевать (αὐλίζομαι). συγγενής — родственник. θυγάτηρ μονογενής — единственная дочь (μονογενής); слав. «дщерь единородна». ὀνόματι Σαρρα — по имени Сарра."
  12: "λαλήσω περὶ αὐτῆς τοῦ δοθῆναί σοι αὐτὴν εἰς γυναῖκα — поговорю о ней, чтобы дать её тебе в жену. σοὶ ἐπιβάλλει ἡ κληρονομία αὐτῆς — тебе принадлежит наследие её (ἐπιβάλλω); слав. «тебе надлежит наследие ея». σὺ μόνος εἶ ἐκ τοῦ γένους αὐτῆς — ты один из рода её. κοράσιον — девица; φρόνιμος — разумная."
  13: "ἄκουσόν μου — послушай меня. ποιήσομεν τὸν γάμον — совершим брак (γάμος), 婚礼. ἐπίσταμαι — знаю. οὐ μὴ δῷ — решительно не даст (δίδωμι). κατὰ τὸν νόμον Μωυσῆ — по закону Моисея. ἢ ὀφειλέσει θάνατον — или будет повинен смерти (ὀφείλω); слав. «или повинен будет смерти». τὴν κληρονομίαν σοὶ καθήκει λαβεῖν ἢ πάντα ἄνθρωπον — наследие надлежит взять тебе, а не всякому человеку (καθήκω)."
  14: "ἀκήκοα — я слышал (perf. ἀκούω). δεδόσθαι ἑπτὰ ἀνδράσιν — отдана семи мужам. ἐν τῷ νυμφῶνι — в брачной комнате (νυμφών), 新婚の部屋. ἀπολωλότας — погибших (ἀπόλλυμι)."
  15: "μόνος εἰμὶ τῷ πατρὶ — я один у отца. φοβοῦμαι μὴ … ἀποθάνω — боюсь, как бы не умереть. οἱ πρότεροι — прежние [женихи]. δαιμόνιον φιλεῖ αὐτήν — демон любит её (φιλέω). οὐκ ἀδικεῖ — не вредит (ἀδικέω). τοὺς προσάγοντας αὐτῇ — приступающих к ней (προσάγω). κατάξω τὴν ζωήν … εἰς τὸν τάφον — сведу жизнь … во гроб (κατάγω). ὃς θάψει αὐτούς — который похоронит их."
  16: "Οὐ μέμνησαι — разве не помнишь (μιμνήσκομαι). ὑπὲρ τοῦ λαβεῖν σε γυναῖκα ἐκ τοῦ γένους σου — о том, чтобы взять тебе жену из рода твоего. σοὶ ἔσται εἰς γυναῖκα — будет тебе в жену. μηδένα λόγον ἔχε — не имей никакой мысли, не беспокойся. τὴν νύκτα ταύτην — в эту ночь."
  17: "λήμψῃ τέφραν θυμιαμάτων — возьмёшь пепел курений (τέφρα, θυμίαμα); слав. «возмеши жераток фимиамный» — курильницу, жаровню для фимиама; в тексте церковное чтение 香炉. ἐπιθήσεις ἀπὸ τῆς καρδίας καὶ τοῦ ἥπατος — положишь [часть] от сердца и печени. καπνίσεις — покуришь (καπνίζω). ὀσφρανθήσεται — ощутит запах (ὀσφραίνομαι). οὐκ ἐπανελεύσεται τὸν αἰῶνα τοῦ αἰῶνος — не вернётся в век века, т. е. никогда."
  18: "προσπορεύῃ αὐτῇ — приближаешься к ней (προσπορεύομαι). ἐγέρθητε — встаньте (ἐγείρω). βοήσατε — воззовите (βοάω). ἐλεήμων — милостивый. σώσει καὶ ἐλεήσει — спасёт и помилует. ἡτοιμασμένη ἦν ἀπὸ τοῦ αἰῶνος — была уготована от века (ἑτοιμάζω). ὑπολαμβάνω — полагаю. В csl 6:18 соединены ст. 18 и 19 и добавлено «и приидоста во екватаны» (соответствует 6:6) — не дублируется."
  19: "ἐφίλησεν αὐτήν — полюбил её (φιλέω; может значить и «поцеловал», здесь — «полюбил», слав. «возлюби ю»). ἐκολλήθη αὐτῇ σφόδρα — прилепилась к ней крепко (κολλάω, σφόδρα). В csl этот стих соединён с 6:18."
