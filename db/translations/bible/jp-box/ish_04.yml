# jp-box, Исход, глава 4. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — csl-ru. jp-joc в этой главе нет.
# ru (с масоретского) — только для понимания, его чтения не вносим.
# Язык — современный 常体; речь Бога — в 「…」, вложенная — 『…』.
# Глава 4: три знамения (1–9), «я не речист» и Аарон (10–17), возвращение в Египет (18–23),
# ночлег и обрезание у Сепфоры (24–26), встреча с Аароном и вера народа (27–31).
# Красного и синего нет: Бог говорит, но это не прямая речь Христа во плоти.
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено по базе).
# 4:6 — в слав. «прокажена яко снег» (добавка λεπρά), у LXX только ὡσεὶ χιών; добавку не вносим.
# 4:25–26 — по LXX: Ἔστη τὸ αἷμα τῆς περιτομῆς τοῦ παιδίου μου («стала кровь обрезания
# дитяти моего»); «жених крови» (νυμφίος αἵματος) — чтение масоретского текста и
# Синодального, в gr-lxx-byz и слав. его нет, поэтому в текст не вносится (см. notes).
# Сносок ⟨…⟩ нет: 割礼 уже в корпусе (Деян 7:8; Рим 4), 杖, 蛇, 雪 понятны.
# jp-ni не использовался.

tr_code: jp-box
book: ish
chapter: 4
draft: true

verses:
  1: "モーセは答[こた]えて言[い]った。「ですが、彼[かれ]らがわたしを信[しん]じず、わたしの声[こえ]に聞[き]き従[したが]わず、『神[かみ]はあなたに現[あらわ]れなかった』と言[い]うなら、わたしは何[なん]と言[い]えばよいのでしょうか。」"
  2: "主[しゅ]は彼[かれ]に言[い]われた。「あなたの手[て]にあるものは何[なに]か。」彼[かれ]は言[い]った。「杖[つえ]です。」"
  3: "主[しゅ]が言[い]われた。「それを地[ち]に投[な]げよ。」彼[かれ]が地[ち]に投[な]げると、それは蛇[へび]になった。モーセはそれを避[さ]けて逃[に]げた。"
  4: "主[しゅ]はモーセに言[い]われた。「手[て]を伸[の]ばして、その尾[お]をつかみなさい。」彼[かれ]が手[て]を伸[の]ばしてそれを捕[つか]まえると、それは手[て]の中[なか]で杖[つえ]になった。"
  5: "「これは、彼[かれ]らの父[ちち]たちの神[かみ]、アブラハムの神[かみ]、イサクの神[かみ]、ヤコブの神[かみ]である主[しゅ]が、あなたに現[あらわ]れたことを、彼[かれ]らに信[しん]じさせるためである。」"
  6: "主[しゅ]はまた彼[かれ]に言[い]われた。「あなたの手[て]を胸[むね]に入[い]れよ。」彼[かれ]が手[て]を胸[むね]に入[い]れて出[だ]すと、その手[て]は雪[ゆき]のようになっていた。"
  7: "「もう一度[いちど]、手[て]を胸[むね]に入[い]れよ。」彼[かれ]が手[て]を胸[むね]に入[い]れて出[だ]すと、それは元[もと]の肉[にく]の色[いろ]に戻[もど]っていた。"
  8: "「もし彼[かれ]らがあなたを信[しん]じず、最初[さいしょ]のしるしの声[こえ]に聞[き]き従[したが]わなければ、次[つぎ]のしるしの声[こえ]を信[しん]じるであろう。"
  9: "もし、この二[ふた]つのしるしをも信[しん]じず、あなたの声[こえ]にも聞[き]き従[したが]わないなら、あなたはナイル川[がわ]の水[みず]を汲[く]んで乾[かわ]いた地[ち]に注[そそ]ぎなさい。ナイル川[がわ]から汲[く]んだその水[みず]は、乾[かわ]いた地[ち]の上[うえ]で血[ち]になる。」"
  10: "モーセは主[しゅ]に言[い]った。「どうか、主[しゅ]よ。わたしは昨日[きのう]も、一昨日[おととい]も、またあなたがしもべに語[かた]り始[はじ]められてからも、口[くち]の達者[たっしゃ]な者[もの]ではありません。わたしは声[こえ]が弱[よわ]く、舌[した]が重[おも]いのです。」"
  11: "主[しゅ]はモーセに言[い]われた。「人[ひと]に口[くち]を与[あた]えたのはだれか。耳[みみ]の聞[き]こえぬ者[もの]、口[くち]のきけぬ者[もの]、目[め]の見[み]える者[もの]、目[め]の見[み]えぬ者[もの]を造[つく]ったのはだれか。このわたし、神[かみ]ではないか。"
  12: "さあ、行[い]け。わたしはあなたの口[くち]を開[ひら]き、あなたが語[かた]るべきことを教[おし]える。」"
  13: "モーセは言[い]った。「どうか、主[しゅ]よ。あなたが遣[つか]わすことのできる別[べつ]の者[もの]をお選[えら]びください。」"
  14: "主[しゅ]はモーセに対して怒[いか]りに燃[も]えて言[い]われた。「あなたの兄弟[きょうだい]、レビ人[びと]アロンがいるではないか。わたしは、彼[かれ]がよく話[はな]すことを知[し]っている。見[み]よ、彼[かれ]はあなたに会[あ]いに出[で]て来[く]る。あなたを見[み]て、心[こころ]から喜[よろこ]ぶであろう。"
  15: "あなたは彼[かれ]に語[かた]り、わたしの言葉[ことば]を彼[かれ]の口[くち]に入[い]れなさい。わたしはあなたの口[くち]と彼[かれ]の口[くち]とともにあり、あなたがたのなすべきことを教[おし]える。"
  16: "彼[かれ]があなたに代[か]わって民[たみ]に語[かた]る。彼[かれ]はあなたの口[くち]となり、あなたは彼[かれ]にとって、神[かみ]に関[かん]することを告[つ]げる者[もの]となる。"
  17: "そして、蛇[へび]に変[か]わったこの杖[つえ]を手[て]に取[と]りなさい。あなたはそれでしるしを行[おこな]う。」"
  18: "モーセは行[い]って、しゅうとであるエテロのところへ帰[かえ]り、言[い]った。「どうか、エジプトにいる兄弟[きょうだい]たちのところへ帰[かえ]らせてください。まだ生[い]きているかどうか、見[み]て来[き]たいのです。」エテロはモーセに言[い]った。「無事[ぶじ]で行[い]きなさい。」"
  19: "長[なが]い年月[としつき]が過[す]ぎて、エジプトの王[おう]は死[し]んだ。ミディアンで、主[しゅ]はモーセに言[い]われた。「さあ、エジプトへ帰[かえ]れ。あなたの命[いのち]を狙[ねら]っていた者[もの]はみな死[し]んだ。」"
  20: "モーセは妻[つま]と子[こ]らを連[つ]れ、彼[かれ]らをろばに乗[の]せてエジプトへ帰[かえ]った。モーセは神[かみ]の杖[つえ]を手[て]に取[と]っていた。"
  21: "主[しゅ]はモーセに言[い]われた。「あなたがエジプトへ帰[かえ]るとき、わたしがあなたの手[て]に授[さず]けたすべての奇跡[きせき]を、ファラオの前[まえ]で行[おこな]いなさい。しかし、わたしは彼[かれ]の心[こころ]を硬[かた]くする。彼[かれ]は民[たみ]を去[さ]らせない。"
  22: "あなたはファラオに言[い]いなさい。『主[しゅ]はこう言[い]われる。イスラエルはわたしの子[こ]、わたしの初[うい]子[ご]である。"
  23: "わたしはあなたに言[い]った。「わたしの民[たみ]を去[さ]らせよ。わたしに仕[つか]えさせるためである」と。もし、あなたが彼[かれ]らを去[さ]らせようとしないなら、見[み]よ、わたしはあなたの子[こ]、あなたの初[うい]子[ご]を殺[ころ]す。』」"
  24: "道[みち]の途中[とちゅう]、宿[やど]で、主[しゅ]の天使[てんし]が彼[かれ]に会[あ]い、彼[かれ]を殺[ころ]そうとした。"
  25: "ツィポラは石[いし]の刃[は]を取[と]り、自分[じぶん]の子[こ]の包皮[ほうひ]を切[き]り落[お]とし、その足[あし]もとにひれ伏[ふ]して言[い]った。「わたしの子[こ]の割礼[かつれい]の血[ち]が立[た]った。」"
  26: "こうして、主[しゅ]の天使[てんし]は彼[かれ]から去[さ]った。彼女[かのじょ]が「わたしの子[こ]の割礼[かつれい]の血[ち]が立[た]った」と言[い]ったからである。"
  27: "主[しゅ]はアロンに言[い]われた。「荒野[こうや]へ行[い]って、モーセを迎[むか]えよ。」彼[かれ]は行[い]って、神[かみ]の山[やま]でモーセに会[あ]い、互[たが]いに口[くち]づけした。"
  28: "モーセは、主[しゅ]が自分[じぶん]を遣[つか]わすときに語[かた]られたすべての言葉[ことば]と、命[めい]じられたすべてのしるしを、アロンに告[つ]げた。"
  29: "モーセとアロンは行[い]って、イスラエルの子[こ]らの長老[ちょうろう]たちをすべて集[あつ]めた。"
  30: "アロンは、主[しゅ]がモーセに語[かた]られたすべての言葉[ことば]を語[かた]り、民[たみ]の前[まえ]でしるしを行[おこな]った。"
  31: "民[たみ]は信[しん]じ、神[かみ]がイスラエルの子[こ]らを顧[かえり]み、彼[かれ]らの苦[くる]しみを見[み]られたのを喜[よろこ]んだ。民[たみ]は頭[こうべ]を垂[た]れて礼拝[れいはい]した。"

notes:
  1: "ἀπεκρίθη… καὶ εἶπεν — 答えて言った. Ἐὰν οὖν μὴ πιστεύσωσίν μοι — もし彼らがわたしを信じないなら. Οὐκ ὦπταί σοι ὁ θεός — 神はあなたに現れなかった (в LXX — ὁ θεός, не κύριος)."
  2: "Ῥάβδος — 杖です (одно слово в ответе, как в греч.)."
  3: "Ῥῖψον αὐτὴν ἐπὶ τὴν γῆν — それを地に投げよ. ἐγένετο ὄφις — 蛇になった (ὄφις). ἔφυγεν Μωϋσῆς ἀπ᾿ αὐτοῦ — モーセはそれを避けて逃げた."
  4: "Ἔκτεινον τὴν χεῖρα — 手を伸ばして. ἐπιλαβοῦ τῆς κέρκου — その尾をつかみなさい (κέρκος — «хвост»). ἐγένετο ῥάβδος ἐν τῇ χειρὶ αὐτοῦ — 手の中で杖になった."
  5: "ἵνα πιστεύσωσίν σοι — 信じさせるため. ὦπταί σοι κύριος ὁ θεὸς τῶν πατέρων αὐτῶν — 彼らの父たちの神である主が…現れた (αὐτῶν — «их», не «ваших»)."
  6: "Εἰσένεγκε τὴν χεῖρά σου εἰς τὸν κόλπον σου — 手を胸に入れよ (κόλπος — «пазуха, грудь»). ἐγενήθη ἡ χεὶρ αὐτοῦ ὡσεὶ χιών — 手は雪のようになった (у LXX только «как снег»; слав. добавляет «прокажена», λεπρά — добавку не вносим)."
  7: "ἀπεκατέστη εἰς τὴν χρόαν τῆς σαρκὸς αὐτοῦ — 元の肉の色に戻っていた (χρόα — «цвет, поверхность»)."
  8: "τῆς φωνῆς τοῦ σημείου τοῦ πρώτου — 最初のしるしの声 (φωνή — «голос»)."
  9: "τοῦ ποταμοῦ — ナイル川 (у LXX ὁ ποταμός — Нил). ἐκχεεῖς ἐπὶ τὸ ξηρόν — 乾いた地に注ぐ (ξηρός — «сухой»). αἷμα ἐπὶ τοῦ ξηροῦ — 乾いた地の上で血になる."
  10: "Δέομαι, κύριε — どうか、主よ (δέομαι — «прошу»). οὐχ ἱκανός εἰμι — 達者な者ではない (ἱκανός — «способный, достаточный»). ἰσχνόφωνος καὶ βραδύγλωσσος — 声が弱く、舌が重い (ἰσχνόφωνος — «слабоголосый», βραδύγλωσσος — «медленноязыкий»)."
  11: "Τίς ἔδωκεν στόμα ἀνθρώπῳ — 人に口を与えたのはだれか. δύσκωφον καὶ κωφόν, βλέποντα καὶ τυφλόν — 耳の聞こえぬ者、口のきけぬ者、目の見える者、目の見えぬ者. οὐκ ἐγὼ ὁ θεός; — このわたし、神ではないか."
  12: "ἀνοίξω τὸ στόμα σου — あなたの口を開く (букв.). συμβιβάσω σε ὃ μέλλεις λαλῆσαι — 語るべきことを教える (συμβιβάζω — «наставлять»)."
  13: "προχείρισαι δυνάμενον ἄλλον, ὃν ἀποστελεῖς — 遣わすことのできる別の者を選んでください (προχειρίζομαι — «поставлять»)."
  14: "θυμωθεὶς ὀργῇ — 怒りに燃えて (удвоение: «воспылав гневом»). ὁ Λευίτης — レビ人. λαλῶν λαλήσει — よく話す (удвоение). χαρήσεται ἐν ἑαυτῷ — 心から喜ぶ."
  15: "δώσεις τὰ ῥήματά μου εἰς τὸ στόμα αὐτοῦ — わたしの言葉を彼の口に入れなさい. ἐγὼ ἀνοίξω τὸ στόμα σου καὶ τὸ στόμα αὐτοῦ — わたしはあなたの口と彼の口とともにあり."
  16: "αὐτὸς ἔσται σου στόμα — 彼はあなたの口となる. σὺ δὲ αὐτῷ ἔσῃ τὰ πρὸς τὸν θεόν — あなたは彼にとって神に関することを告げる者となる (букв. «что к Богу»; Синодальный: «вместо Бога»)."
  17: "τὴν ῥάβδον ταύτην τὴν στραφεῖσαν εἰς ὄφιν — 蛇に変わったこの杖. ἐν ᾗ ποιήσεις… τὰ σημεῖα — それでしるしを行う."
  18: "Βάδιζε ὑγιαίνων — 無事で行きなさい (букв. «иди здоровым»). Слав. в конце этого стиха добавляет «умре же царь египетский» — у LXX эти слова стоят в начале 4:19, держимся LXX."
  19: "μετὰ δὲ τὰς ἡμέρας τὰς πολλὰς ἐκείνας — 長い年月が過ぎて. τεθνήκασιν γὰρ πάντες οἱ ζητοῦντές σου τὴν ψυχήν — あなたの命を狙っていた者はみな死んだ (ζητέω τὴν ψυχήν — «искать души»)."
  20: "τὰ ὑποζύγια — ろば (ὑποζύγιον — «вьючное животное»; мн. ч., слав. «ослята»). τὴν ῥάβδον τὴν παρὰ τοῦ θεοῦ — 神の杖."
  21: "ὅρα πάντα τὰ τέρατα — すべての奇跡を…行いなさい (τέρας — «знамение, чудо»). ἐγὼ δὲ σκληρυνῶ τὴν καρδίαν αὐτοῦ — わたしは彼の心を硬くする (σκληρύνω)."
  22: "Υἱὸς πρωτότοκός μου Ισραηλ — イスラエルはわたしの子、わたしの初子 (πρωτότοκος). Слав. добавляет «Бог еврейский» — у LXX только κύριος."
  23: "εἶπα δέ σοι — わたしはあなたに言った. Ἐξαπόστειλον τὸν λαόν μου, ἵνα μοι λατρεύσῃ — わたしの民を去らせよ、わたしに仕えさせるためである (λατρεύω). ἀποκτενῶ τὸν υἱόν σου τὸν πρωτότοκον — あなたの子、あなたの初子を殺す."
  24: "ἐν τῷ καταλύματι — 宿で (κατάλυμα — «ночлег»). συνήντησεν αὐτῷ ἄγγελος κυρίου — 主の天使が彼に会い (у LXX — ἄγγελος κυρίου; в масоретском тексте «Господь», это чтение не берём). ἐζήτει αὐτὸν ἀποκτεῖναι — 彼を殺そうとした."
  25: "ψῆφον — 石の刃 (ψῆφος — «камень»; слав. «камень»). περιέτεμεν τὴν ἀκροβυστίαν — 包皮を切り落とし (περιτέμνω — «обрезать»). προσέπεσεν πρὸς τοὺς πόδας — その足もとに投げ (букв. «припала к ногам»; чьим — в греч. не сказано). Ἔστη τὸ αἷμα τῆς περιτομῆς τοῦ παιδίου μου — わたしの子の割礼の血が立った (ἔστη — «стала, встала»; смысл тёмный и в греч.)."
  26: "καὶ ἀπῆλθεν ἀπ᾿ αὐτοῦ — 天使は彼から去った. διότι εἶπεν — 彼女が…と言ったからである. «Жених крови» (νυμφίος αἵματος, חֲתַן־דָּמִים) — чтение масоретского текста, отсюда Синодальный «ты жених крови у меня»; в gr-lxx-byz и слав. этого слова нет, поэтому в текст не внесено (ср. комм. к 4:25)."
  27: "ἐν τῷ ὄρει τοῦ θεοῦ — 神の山で. κατεφίλησαν ἀλλήλους — 互いに口づけした (καταφιλέω)."
  28: "πάντας τοὺς λόγους κυρίου, οὓς ἀπέστειλεν — 主が…語られたすべての言葉. ἃ ἐνετείλατο αὐτῷ — 命じられたすべてのしるし."
  29: "συνήγαγον τὴν γερουσίαν — 長老たちをすべて集めた (γερουσία)."
  30: "ἐλάλησεν Ααρων πάντα τὰ ῥήματα — アロンは…すべての言葉を語り. ἐποίησεν τὰ σημεῖα ἐναντίον τοῦ λαοῦ — 民の前でしるしを行った (подлежащее в греч. — Аарон; Синодальный относит к Моисею)."
  31: "ἐπίστευσεν ὁ λαὸς καὶ ἐχάρη — 民は信じ…喜んだ. ἐπεσκέψατο ὁ θεὸς — 神が…顧みられた (ἐπισκέπτομαι). κύψας… προσεκύνησεν — 頭を垂れて礼拝した (κύπτω — «наклоняться»)."
