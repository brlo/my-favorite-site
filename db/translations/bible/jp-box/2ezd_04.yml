verses:
  1: "第二[だいに]の者[もの]、すなわち王[おう]の力[ちから]について語[かた]った者[もの]が、語り始[はじ]めた。"
  2: "「男[おとこ]たちよ、人[ひと]々[びと]は地[ち]と海[うみ]、その中[なか]にあるすべてのものを支配[しはい]して、打[う]ち勝[か]ってはいないのか。"
  3: "しかし、王[おう]は彼[かれ]らに勝[まさ]り、彼らを支配[しはい]し、彼らに君臨[くんりん]する。彼が彼らに言[い]うことは何[なに]であれ、彼らは聞[き]き従[したが]う。"
  4: "もし彼が、互[たが]いに戦[たたか]うようにと彼らに言[い]えば、彼らはそうする。もし敵[てき]のもとへ彼らを遣[つか]わすなら、彼らは行[い]って、山[やま]々[やま]と城壁[じょうへき]と塔[とう]を打[う]ち壊[こわ]す。"
  5: "彼らは殺[ころ]し、殺される。王[おう]の言葉[ことば]を背[そむ]かない。もし勝[か]てば、掠[かす]め取[と]ったものも、そのほかのすべてのものも、王のもとへ運[はこ]び込[こ]む。"
  6: "戦[たたか]わず、軍[いくさ]に加[くわ]わらずに地[ち]を耕[たがや]す者[もの]たちも、種[たね]を蒔[ま]いて刈[か]り取[と]ると、また王[おう]に運[はこ]び込[こ]む。互[たが]いに迫[せま]り合[あ]って、王に貢[みつ]ぎを納[おさ]める者[もの]たちもいる。"
  7: "また、彼自身[じしん]はただ一人[ひとり]である。殺[ころ]せと言[い]えば、彼らは殺す。放[はな]せと言えば、放す。"
  8: "打[う]てと言[い]えば、打[う]つ。荒[あ]らせと言えば、荒らす。建[た]てと言えば、建てる。"
  9: "切[き]り倒[たお]せと言[い]えば、切り倒す。植[う]えと言えば、植える。"
  10: "彼の民[たみ]もすべて、彼の軍[いくさ]も、彼に聞[き]き従[したが]う。"
  11: "そのうえ、彼自身[じしん]は横[よこ]になり、食[た]べ、飲[の]み、眠[ねむ]る。彼らは彼の周[まわ]りを見張[みは]り、だれも立[た]ち去[さ]って自分[じぶん]の仕[し]事[ごと]をすることもできず、彼に逆[さか]らうこともない。"
  12: "男[おとこ]たちよ、これほど聞[き]き従[したが]われるのだから、王[おう]が勝[まさ]っていないはずがあろうか。」そして、彼[かれ]は黙[だま]った。"
  13: "第三[だいさん]の者[もの]、すなわち女[おんな]たちと真理[しんり]について語[かた]った者[もの]は、ゾロバベルであった。彼は語り始[はじ]めた。"
  14: "「男[おとこ]たちよ、王[おう]は偉大[いだい]ではないか。人[ひと]々[びと]も多[おお]く、ぶどう酒[しゅ]も強[つよ]いではないか。では、彼らを支配[しはい]しているのはだれか、それとも彼らを治[おさ]めているのはだれか。女[おんな]たちではないか。"
  15: "女[おんな]たちが王[おう]たちを、また海[うみ]と地[ち]を治[おさ]める民[たみ]をすべて産んだ。"
  16: "彼[かれ]らは女[おんな]たちから生[う]まれ、女たちが、ぶどう畑[ばたけ]を植[う]える者[もの]たちを養[やしな]った。そのぶどう畑からぶどう酒[しゅ]ができる。"
  17: "女[おんな]たちは人[ひと]の衣[ころも]を作[つく]り、人に栄光[えいこう]をもたらす。女たちなしに人[ひと]はありえない。"
  18: "金[きん]と銀[ぎん]、あらゆる美[うつく]しい品[しな]を集[あつ]めても、顔立[かおだ]ちも美[うつく]しさも優[すぐ]れた女[おんな]を一人[ひとり]見[み]れば、"
  19: "彼[かれ]らはこれらすべてを捨[す]てて彼女[かのじょ]に目[め]を注[そそ]ぎ、口[くち]を開[あ]けて彼女を見[み]つめる。金[きん]や銀[ぎん]、あらゆる美[うつく]しい品[しな]よりも、すべての者が彼女を選[えら]ぶ。"
  20: "人[ひと]は自分[じぶん]を育[はぐく]んだ父[ちち]を捨[す]て、自分[じぶん]の国[くに]を捨てて、自分[じぶん]の妻[つま]に結[むす]びつく。"
  21: "妻[つま]とともに自分[じぶん]の魂[たましい]を捨[す]て、父[ちち]も母[はは]も国[くに]も覚[おぼ]えない。"
  22: "だから、あなたがたは、女[おんな]たちがあなたがたを支配[しはい]していることを知[し]るべきである。あなたがたは苦[くる]しみ、骨[ほね]を折[お]り、すべてを女たちに与[あた]え、持[も]って行[い]くではないか。"
  23: "人[ひと]は自分[じぶん]の剣[つるぎ]を取[と]って外[そと]へ出[で]、旅[たび]に出[で]て強奪[ごうだつ]し、盗[ぬす]み、海[うみ]へ漕[こ]ぎ出[だ]し、川[かわ]を漕[こ]いで渡[わた]る。"
  24: "また、獅子[しし]を見[み]、暗[くら]やみを歩[あゆ]む。盗[ぬす]み、奪[うば]い、はぎ取[と]ると、愛[あい]する女[おんな]のもとへ運[はこ]ぶ。"
  25: "人[ひと]は自分[じぶん]の妻[つま]を、父[ちち]や母[はは]よりも、いっそう愛[あい]する。"
  26: "多[おお]くの者が女[おんな]たちのゆえに自[みずか]らの思[おも]いを失[うしな]い、女たちのゆえに奴隷[どれい]になった。"
  27: "多[おお]くの者が女[おんな]たちのゆえに滅[ほろ]び、迷[まよ]い、罪[つみ]を犯[おか]した。"
  28: "今[いま]、あなたがたはわたしを信[しん]じないのか。王[おう]はその権力[けんりょく]において偉大[いだい]ではないか。すべての国[くに]々[ぐに]は王に触[ふ]れることを恐[おそ]れているではないか。"
  29: "わたしは彼[かれ]を見[み]た。また、輝[かがや]かしいバルタコスの娘[むすめ]、王[おう]のそばめアパメが、王の右[みぎ]に座[すわ]っているのを見た。"
  30: "彼女[かのじょ]は王[おう]の頭[あたま]から王冠[おうかん]を取[と]って自分[じぶん]に着[つ]け、左[ひだり]の手[て]で王の頬[ほお]を打[う]った。"
  31: "そのうえ、王[おう]は口[くち]を開[あ]けたまま彼女[かのじょ]を見[み]ていた。彼女が王に微笑[ほほえ]めば、王も笑[わら]う。彼女が王に腹[はら]を立[た]てれば、王は彼女と和解[わかい]しようとして、彼女に取[と]り入[い]る。"
  32: "男[おとこ]たちよ、女[おんな]たちがこのようにふるまうのだから、女たちが強[つよ]くないはずがあろうか。」"
  33: "そこで、王[おう]と貴族[きぞく]たちは互[たが]いに顔[かお]を見[み]合[あ]った。"
  34: "そして、彼は真理[しんり]について語り始[はじ]めた。「男[おとこ]たちよ、女[おんな]たちは強[つよ]くないのか。地[ち]は大[おお]きく、天[てん]は高[たか]く、太陽[たいよう]はその走[はし]りが速[はや]い。太陽は天の円[えん]を巡[めぐ]って、一日[いちにち]のうちに自分[じぶん]の場所[ばしょ]へまた駆[か]け戻[もど]るからである。"
  35: "これらを行[おこな]う方[かた]は偉大[いだい]ではないか。真理[しんり]は大[おお]きく、すべてのものよりも強[つよ]い。"
  36: "地[ち]はすべて真理[しんり]を呼[よ]び、天[てん]は真理を祝福[しゅくふく]し、すべてのわざは震[ふる]え、おののく。真理とともに不正[ふせい]なものは何[なに]もない。"
  37: "ぶどう酒[しゅ]は不正[ふせい]であり、王[おう]も不正であり、女[おんな]たちも不正であり、人[ひと]の子[こ]らはすべて不正である。彼らのすべてのわざ、そのようなものはすべて不正である。彼らの中[なか]に真理[しんり]はなく、彼らは自分[じぶん]の不正のうちに滅[ほろ]びる。"
  38: "しかし、真理[しんり]はとどまり、永遠[とこしえ]に強[つよ]く、生[い]き、世々[よよ]の世[よ]まで治[おさ]める。"
  39: "真理には人[ひと]を偏[かたよ]り見[み]ることも、区別[くべつ]することもない。正[ただ]しいことを行[おこな]い、不正[ふせい]な者[もの]、悪[わる]い者すべてから遠[とお]ざかる。すべての者は真理のわざを喜[よろこ]び、真理の裁[さば]きには不正なものが何もない。"
  40: "真理[しんり]には、すべての世[よ]の力[ちから]と王国[おうこく]と権力[けんりょく]と偉大[いだい]さがある。真理の神[かみ]はほむべきかな。」"
  41: "彼は語るのをやめた。すると、民[たみ]は皆[みな]そのとき声[こえ]を上[あ]げて言[い]った。「真理[しんり]は大[おお]きく、すべてに勝[まさ]る。」"
  42: "そこで、王[おう]は彼[かれ]に言[い]った。「求[もと]めよ。望[のぞ]むことを、書[か]かれていること以上[いじょう]に。あなたに与[あた]えよう。あなたは知恵[ちえ]ある者として見[み]いだされたのだから。あなたはわたしのそばに座[すわ]り、わたしの親族[しんぞく]と呼[よ]ばれる。」"
  43: "そこで、彼は王[おう]に言[い]った。「思[おも]い起[こ]してください。あなたが王位[おうい]を受[う]け取[と]った日[ひ]に、エルサレムを建[た]てると誓[ちか]われたその誓いを。"
  44: "また、エルサレムから持[も]ち去[さ]られたすべての器[うつわ]を送[おく]り返[かえ]してください。それは、クロスがバビロンを打[う]ち砕[くだ]くと誓ったとき、そこへ送り返すと誓って取[と]り分[わ]けたものです。"
  45: "また、あなたご自身が、あの神殿[しんでん]を建[た]てると誓[ちか]われました。それは、ユダヤがカルデア人[じん]によって荒[あ]らされたとき、エドム人[じん]たちが焼[や]いた神殿です。"
  46: "今[いま]、わたしがあなたに願[ねが]うのは、このことです。王[おう]よ、わが主[しゅ]よ。わたしがあなたに求[もと]めるのも、これです。これこそが、あなたから出[で]る偉大[いだい]さです。ですから、あなたが口[くち]をもって天[てん]の王[おう]に誓[ちか]われた誓いを、果[は]たしてくださるよう、わたしは願[ねが]います。」"
  47: "そこで、ダリウス王[おう]は立[た]ち上[あ]がって彼[かれ]に口[くち]づけし、彼に、すべての管理[かんり]する者[もの]、地方[ちほう]の長[かしら]、将軍[しょうぐん]、太守[たいしゅ]たちに宛[あ]てた手紙[てがみ]を書[か]いた。それは、彼と、彼とともにエルサレムを建[た]てるために上[のぼ]るすべての者[もの]を送[おく]り出[だ]すためであった。"
  48: "また、コイレ・シリアとフェニキアのすべての地方[ちほう]の長[かしら]たちと、レバノンにいる者[もの]たちに手紙[てがみ]を書いた。レバノンからエルサレムへ杉[すぎ]の木[き]を運[はこ]び、彼とともに町[まち]を建[た]てるように、と。"
  49: "また、王国[おうこく]からユダヤへ上[のぼ]って行[い]くすべてのユダヤ人[じん]に、自由[じゆう]について書いた。すなわち、力[ちから]ある者[もの]も、太守[たいしゅ]も、地方[ちほう]の長[かしら]も、管理[かんり]する者[もの]も、彼らの門[もん]に来[き]てはならない、と。"
  50: "また、彼らが手[て]に入[い]れるすべての地方[ちほう]を、彼らに無税[むぜい]とすること。また、エドム人[じん]たちは、自分[じぶん]たちが押[おさ]えているユダヤ人[じん]の村[むら]々[むら]を明[あ]け渡[わた]すこと。"
  51: "また、神殿[しんでん]の建[けん]設[せつ]のために、それが建[た]つまで年[とし]ごとに二十[にじゅう]タラントを与[あた]えること。"
  52: "また、祭壇[さいだん]に日[ひ]ごとの燔祭[はんさい]を、彼らが命[めい]じられているとおりに献[ささ]げさせ、年[とし]ごとに十七[じゅうなな]タラント、ほかに十[じゅう]タラントを加[くわ]えて与えること。"
  53: "また、バビロニアから来[き]て町[まち]を建[た]てるすべての者[もの]に、彼らにもその子[こ]どもたちにも、また来[く]るすべての祭司[さいし]たちにも、自由[じゆう]があるように。"
  54: "また、祭司[さいし]が着[き]て務[つと]める衣[ころも]と、その支給[しきゅう]についても書いた。"
  55: "また、レビ人[びと]たちには、神殿[しんでん]が完成[かんせい]し、エルサレムが建[た]てられる日[ひ]まで支給[しきゅう]を与[あた]えるよう書いた。"
  56: "また、町[まち]を警護[けいご]するすべての者[もの]には、土地[とち]と俸給[ほうきゅう]を与えるよう書いた。"
  57: "また、クロスがバビロンから取[と]り分[わ]けたすべての器[うつわ]を送[おく]り出[だ]した。また、クロスが行[おこな]なえと言[い]ったすべてのことを、彼もまた行[おこな]なわせ、エルサレムへ送[おく]り出[だ]すよう命[めい]じた。"
  58: "また、あの若者[わかもの]が外[そと]へ出[で]たとき、エルサレムに向[む]かって天[てん]へ顔[かお]を上[あ]げ、天の王[おう]をほめたたえて言[い]った。"
  59: "「勝利[しょうり]はあなたから、知恵[ちえ]もあなたから、栄光[えいこう]もあなたのものである。わたしはあなたの僕[しもべ]です。"
  60: "あなたはほむべきかな。あなたはわたしに知恵[ちえ]をお与[あた]えになった。父祖[ふそ]たちの主[しゅ]よ、わたしはあなたに告白[こくはく]します。」"
  61: "そして、彼は手紙[てがみ]を受[う]け取[と]り、出[で]てバビロンへ行[い]き、すべての兄弟[きょうだい]たちに告[つ]げた。"
  62: "彼らは、自分[じぶん]たちの父祖[ふそ]の神[かみ]をほめたたえた。神が彼らに安[やす]らぎと解放[かいほう]を与[あた]えられたからである。"
  63: "すなわち、上[のぼ]って行[い]ってエルサレムと、その上[うえ]に御名[みな]が唱[とな]えられている神殿[しんでん]とを建[た]てるためであった。そして、彼らは音楽[おんがく]と喜[よろこ]びとともに七日[なのか]の間[あいだ]、祝宴[しゅくえん]を催[もよお]した。"

notes:
  1: "Καὶ ἤρξατο ὁ δεύτερος λαλεῖν — «и начал второй говорить» (δεύτερος — второй из трёх юношей, ср. 3:1–4:1). ὁ εἴπας περὶ τῆς ἰσχύος τοῦ βασιλέως — «сказавший о силе царя» (ἰσχύς — сила, крепость); слав. «рекий о крепости царстей». Номинатив ὁ εἴπας при глаголе — особенность греческого текста, в переводе «второй, сказавший»."
  2: "Ὦ ἄνδρες — «о мужи», обращение к собранию. ὑπερισχύουσιν — «преобладают, одолевают» (ὑπερισχύω); κατακρατοῦντες — «овладев, держа в руках» (κατακρατέω). Слав. «не премогают ли человецы, землю и море обдержаще»."
  3: "ὑπερισχύει καὶ κυριεύει καὶ δεσπόζει — три глагола господства: «одолевает, господствует, владычествует» (κυριεύω, δεσπόζω). ἐνακούουσιν — «слушаются» (ἐνακούω); слав. «творят». πᾶν ὃ ἐὰν εἴπῃ — «всё, что ни скажет»."
  4: "ποιῆσαι πόλεμον ἕτερος πρὸς τὸν ἕτερον — «вести войну один против другого»; ἐξαποστείλῃ — «пошлёт» (ἐξαποστέλλω); κατεργάζονται — «сокрушают, разрушают» (слав. «истрывают»); τὰ ὄρη — горы."
  5: "φονεύουσιν καὶ φονεύονται — «убивают и бывают убиваемы»; τὸν λόγον τοῦ βασιλέως οὐ παραβαίνουσιν — «слова царского не преступают» (παραβαίνω); κομίζουσιν — «приносят» (κομίζω); προνομεύσωσιν — «захватят добычу» (προνομεύω)."
  6: "οἱ μὴ στρατευόμενοι — «не ходящие на войну» (στρατεύομαι); γεωργοῦσιν τὴν γῆν — «возделывают землю»; θερίσαντες — «сжав» (θερίζω); φόρους — «подати» (φόρος). Слав. делит иначе: вторая половина (ἕτερος τὸν ἕτερον ἀναγκάζοντες…) у него открывает 4:7."
  7: "εἷς μόνος — «один единственный»; ἀποκτεῖναι — «убить»; ἀφεῖναι — «отпустить». У csl этот стих стоит под 4:8 и уже несёт начало гр. 4:8 — поэтому внутри 4:6–11 держимся деления gr."
  8: "εἶπε πατάξαι, τύπτουσιν — «сказал ударить — бьют» (πατάσσω, τύπτω); ἐρημῶσαι — «опустошить» (ἐρημόω); οἰκοδομῆσαι — «построить». У csl 4:8 и 4:9 соединены в один стих."
  9: "ἐκκόψαι — «срубить, вырубить» (ἐκκόπτω); φυτεῦσαι — «насадить» (φυτεύω). Пара «рубить — сажать» замыкает ряд повелений царя."
  10: "πᾶς ὁ λαὸς αὐτοῦ καὶ αἱ δυνάμεις αὐτοῦ — «весь народ его и силы его» (δύναμις — войско); ἐνακούουσιν — «слушаются». У csl к этому стиху присоединено начало гр. 4:11 («и к сим той возлежит…»)."
  11: "ἀνάκειται — «возлежит» (ἀνάκειμαι); τηροῦσιν κύκλῳ — «стерегут вокруг» (τηρέω); οὐ δύνανται ἕκαστος ἀπελθεῖν — «не может каждый отойти»; παρακούουσιν — «ослушаться» (παρακούω). Слав. «тии же стрегут окрест его»."
  12: "πῶς οὐχ ὑπερισχύει — «как не преобладает?»; ἐπακουστός — «тот, кого слушаются» (редкое слово); ἐσείγησεν — «умолк» (σιγάω). Конец речи второго; собрание молчит."
  13: "ὁ τρίτος ὁ εἴπας περὶ τῶν γυναικῶν καὶ τῆς ἀληθείας — «третий, сказавший о женщинах и истине»; οὗτός ἐστιν Ζοροβαβελ — «это Зоровавель» (ゾロバベル; в книге впервые назван здесь). ἤρξατο λαλεῖν — «начал говорить»."
  14: "οὐ μέγας ὁ βασιλεύς… καὶ ὁ οἶνος ἰσχύει — «не велик ли царь… и вино сильно?»; τίς ὁ δεσπόζων… ἢ τίς ὁ κυριεύων — «кто владычествует… или кто господствует?»; ответ: οὐχ αἱ γυναῖκες — «не женщины ли?»."
  15: "ἐγέννησαν τὸν βασιλέα — «родили царя» (γεννάω; в гр. ед. ч.). Слав. «царей» — мн. ч.; как церковное чтение внесено в текст (王たち), вариант LXX — ед. ч. κυριεύει τῆς θαλάσσης καὶ τῆς γῆς — «владеет морем и землёй»."
  16: "ἐξ αὐτῶν ἐγένοντο — «от них родились»; ἐξέθρεψαν — «вскормили» (ἐκτρέφω); τοὺς φυτεύοντας τοὺς ἀμπελῶνας — «насаждающих виноградники»; ἐξ ὧν ὁ οἶνος γίνεται — «из которых бывает вино»."
  17: "στολάς — «одежды» (στολή); δόξαν — «славу, украшение» (δόξα). Слав. «ризы (красны)»: «красны» — редакционная глосса в скобках, в текст не внесена. χωρὶς τῶν γυναικῶν — «без женщин»."
  18: "συναγάγωσιν χρυσίον καὶ ἀργύριον — «соберут золото и серебро» (συνάγω); πρᾶγμα ὡραῖον — «вещь прекрасная» (ὡραῖος); καλὴν τῷ εἴδει καὶ τῷ κάλλει — «красивую видом и красотой» (εἶδος, κάλλος). Стих обрывается: аподосис в 4:19."
  19: "εἰς αὐτὴν ἐγκέχηναν — «уставились на неё» (ἐγχάσκω); χάσκοντες τὸ στόμα — «разинув рот» (χάσκω); αἱρετίζουσιν — «избирают, предпочитают» (αἱρετίζω); μᾶλλον ἢ — «более чем»."
  20: "ἐγκαταλείπει — «оставляет» (ἐγκαταλείπω); ὃς ἐξέθρεψεν αὐτόν — «который воспитал его»; κολλᾶται — «прилепляется» (κολλάω); τὴν ἰδίαν χώραν — «свою страну»."
  21: "ἀφίησι τὴν ψυχήν — «оставляет душу» (ἀφίημι), т. е. забывает себя; слав. то же. μέμνηται — «помнит» (μιμνήσκομαι), с οὔτε… οὔτε… οὔτε… — «ни отца, ни матери, ни страны»."
  22: "ἐντεῦθεν δεῖ ὑμᾶς γνῶναι — «отсюда должно вам знать»; κυριεύουσιν ὑμῶν — «господствуют над вами»; πονεῖτε καὶ μοχθεῖτε — «трудитесь и изнуряетесь» (πονέω, μοχθέω); δίδοτε καὶ φέρετε — «даёте и приносите»."
  23: "ῥομφαία — «меч» (ῥομφαία); ἐξοδεύειν — «выходить в путь» (ἐξοδεύω); λῃστεύειν — «разбойничать» (λῃστεύω); πλεῖν — «плыть» (πλέω). Слав. в скобках добавляет «(убийства)» — глосса, в текст не внесена."
  24: "τὸν λέοντα θεωρεῖ — «льва видит»; ἐν σκότει βαδίζει — «во тьме ходит»; λωποδυτήσῃ — «оберёт» (λωποδυτέω); τῇ ἐρωμένῃ — «возлюбленной» (ἐρωμένη)."
  25: "πλεῖον… μᾶλλον ἢ — двойное сравнение, «более… нежели»; τὴν ἰδίαν γυναῖκα — «свою жену». Слав. «паче любит человек жену свою, нежели отца и матерь»."
  26: "ἀπενοήθησαν ταῖς ἰδίαις διανοίαις — «обезумели в своих помыслах» (ἀπονοέομαι, διάνοια); δοῦλοι ἐγένοντο — «стали рабами»; слав. «от лиц женских»."
  27: "ἀπώλοντο — «погибли» (ἀπόλλυμι); ἐσφάλησαν — «сбились, преткнулись» (σφάλλω); ἡμάρτοσαν — «согрешили» (ἁμαρτάνω). Троекратное διὰ τὰς γυναῖκας — «из-за женщин»."
  28: "οὐ πιστεύετέ μοι — «не верите мне»; τῇ ἐξουσίᾳ αὐτοῦ — «властью своей» (ἐξουσία); εὐλαβοῦνται ἅψασθαι — «боятся прикоснуться» (εὐλαβέομαι); слав. «не смеют прикоснутися»."
  29: "Ἀπάμην τὴν θυγατέρα Βαρτάκου τοῦ θαυμαστοῦ — «Апамину, дочь Бартака дивного» (θαυμαστός — славный, дивный; アパメ, バルタコス). παλλακή — «наложница» (そばめ); ἐν δεξιᾷ — «по правую сторону»."
  30: "διάδημα — «венец» (διάδημα, 王冠); ἐπιτιθοῦσαν ἑαυτῇ — «возлагала на себя» (ἐπιτίθημι); ἐρράπιζεν τῇ ἀριστερᾷ — «била левою [рукою]» (ῥαπίζω). Слав. «по ланите бияше царя левою рукою»."
  31: "χάσκων τὸ στόμα — «разинув рот»; προσγελάσῃ — «улыбнётся» (προσγελάω); πικρανθῇ ἐπ᾿ αὐτόν — «огорчится на него» (πικραίνω); κολακεύει — «ласкает, льстит» (κολακεύω); διαλλαγῇ — «примирилась» (διαλλάσσω)."
  32: "πῶς οὐχὶ ἰσχυραὶ αἱ γυναῖκες — «как не сильны женщины?»; πράσσουσιν — «делают, поступают» (πράσσω). Конец второй речи; дальше молчание и третья речь."
  33: "μεγιστᾶνες — «вельможи, знатные» (μεγιστάν); ἐνέβλεπον ἕτερος πρὸς τὸν ἕτερον — «смотрели друг на друга» (ἐμβλέπω). Слав. присоединяет к стиху «и нача глаголати о истине» — это начало гр. 4:34; держимся гр."
  34: "ἤρξατο λαλεῖν περὶ τῆς ἀληθείας — «начал говорить об истине»; ταχὺς τῷ δρόμῳ — «быстрый в беге» (δρόμος); στρέφεται ἐν τῷ κύκλῳ τοῦ οὐρανοῦ — «обращается в круге небесном»; ἀποτρέχει — «убегает обратно» (ἀποτρέχω)."
  35: "ὃς ταῦτα ποιεῖ — «Кто это делает»; ἰσχυροτέρα παρὰ πάντα — «сильнее всего» (παρά + acc. при сравнении). Здесь формула истины звучит впервые; в 4:41 народ повторяет её."
  36: "πᾶσα ἡ γῆ τὴν ἀλήθειαν καλεῖ — «вся земля истину призывает»; σείεται καὶ τρέμει — «колеблется и трепещет» (σείω, τρέμω); μετ᾿ αὐτοῦ — букв. «с ним» (м. р.), при ἀλήθεια ожидалось бы αὐτῆς, слав. «с нею»; οὐθὲν ἄδικον — «ничего неправедного»."
  37: "ἄδικος — «неправедный», четырежды (ἄδικος ὁ οἶνος, ὁ βασιλεύς, αἱ γυναῖκες, οἱ υἱοὶ τῶν ἀνθρώπων); τὰ τοιαῦτα — «таковое»; ἐν τῇ ἀδικίᾳ αὐτῶν ἀπολοῦνται — «в неправде своей погибнут»."
  38: "μένει καὶ ἰσχύει εἰς τὸν αἰῶνα — «пребывает и укрепляется в век» (μένω); ζῇ καὶ κρατεῖ — «живёт и держит» (κρατέω); εἰς τὸν αἰῶνα τοῦ αἰῶνος — «в век века», т. е. вечно."
  39: "λαμβάνειν πρόσωπα — «принимать лица», т. е. лицеприятствовать; διάφορα — «различия» (διάφορος); τὰ δίκαια ποιεῖ — «делает праведное»; слав. «правая творит и от всех неправедных… огребается»; εὐδοκοῦσι — «благоволят» (εὐδοκέω)."
  40: "ἡ ἰσχὺς καὶ τὸ βασίλειον καὶ ἡ ἐξουσία καὶ ἡ μεγαλειότης — «сила, царство, власть, величие» (βασίλειον, μεγαλειότης); τῶν πάντων αἰώνων — «всех веков»; εὐλογητὸς ὁ θεὸς τῆς ἀληθείας — «благословен Бог истины». У csl стих начинается концом гр. 4:39 («и несть в суде ея ничтоже неправедно»)."
  41: "ἐσιώπησεν τοῦ λαλεῖν — «умолк говорить» (σιωπάω); ἐφώνησεν — «воззвал» (φωνέω). Μεγάλη ἡ ἀλήθεια καὶ ὑπερισχύει — «велика истина и преобладает»: в gr-lxx-byz без πάντων, слав. «и премогает»; «всех» — церковное чтение (ru «сильнее всего»), поэтому в тексте すべてに勝る."
  42: "Αἴτησαι ὃ θέλεις — «проси, чего хочешь»; πλεῖω τῶν γεγραμμένων — «более написанного», т. е. сверх написанного (γράφω); ὃν τρόπον εὑρέθης σοφώτερος — «так как ты оказался мудрейшим»; ἐχόμενός μου — «подле меня» (ἔχομαι); συγγενής — «родственник»."
  43: "Μνήσθητι τὴν εὐχήν — «вспомни обет» (εὐχή — обет, молитва); ἣν ηὔξω — «который ты дал» (εὔχομαι); τὸ βασίλειόν σου παρέλαβες — «ты принял царство» (παραλαμβάνω). Начало просьбы Зоровавеля."
  44: "τὰ σκεύη τὰ λημφθέντα — «сосуды взятые» (λαμβάνω); ἐκπέμψαι — «отослать» (ἐκπέμπω); ἐξεχώρισεν — «отделил» (ἐκχωρίζω); ηὔξατο ἐκκόψαι Βαβυλῶνα — «дал обет сокрушить Вавилон» (ἐκκόπτω)."
  45: "ναός — «храм» (в отличие от ἱερόν); ἐνεπύρισαν — «сожгли» (ἐμπυρίζω); ἠρημώθη — «опустошена» (ἐρημόω); Χαλδαῖοι — халдеи; Ιδουμαῖοι — идумеи, потомки Едома (エドム人)."
  46: "ἀξιῶ… αἰτοῦμαί σε… δέομαι — «прошу… умоляю… молю» (ἀξιόω, αἰτέω, δέομαι); ἡ μεγαλωσύνη ἡ παρὰ σοῦ — «величие, которое от тебя»; ποιήσῃς τὴν εὐχήν — «исполнишь обет»; ἐκ στόματός σου — «из уст твоих»."
  47: "ἀναστὰς… κατεφίλησεν — «встав, поцеловал» (καταφιλέω); οἰκονόμους — «управителей» (οἰκονόμος); τοπάρχας — «областеначальников» (τοπάρχης); στρατηγούς — «военачальников»; σατράπας — «сатрапов» (太守); προπέμψωσιν — «проводили» (προπέμπω)."
  48: "Κοίλῃ Συρίᾳ — Келе-Сирия (コイレ・シリア; слав. «Килисирия»); Φοινίκῃ — Финикия; Λιβάνῳ — Ливан (レバノン); ξύλα κέδρινα — «кедровые дерева» (κέδρινος); μεταφέρειν — «переносить, привозить» (μεταφέρω)."
  49: "τοῖς ἀναβαίνουσιν ἀπὸ τῆς βασιλείας — «идущим из царства»; ὑπὲρ τῆς ἐλευθερίας — «о свободе» (ἐλευθερία); πάντα δυνατόν — «всякого властного» (δυνατός); μὴ ἐπελεύσεσθαι ἐπὶ τὰς θύρας — «не приходить к дверям» (ἐπέρχομαι)."
  50: "ἀφορολόγητον — «безданный, свободный от подати» (ἀφορολόγητος); κρατήσουσιν — «будут держать» (κρατέω); ἀφιῶσι τὰς κώμας — «оставят селения» (ἀφίημι, κώμη); διακρατοῦσιν — «держат в руках» (διακρατέω)."
  51: "εἰς τὴν οἰκοδομὴν τοῦ ἱεροῦ — «на построение храма»; κατ᾿ ἐνιαυτόν — «ежегодно»; τάλαντα εἴκοσι — «двадцать талантов»; μέχρι τοῦ οἰκοδομηθῆναι — «доколе не будет построен»."
  52: "θυσιαστήριον — «жертвенник»; ὁλοκαυτώματα — «всесожжения» (燔祭); καρποῦσθαι — букв. «пожинать», здесь «приносить»; καθὰ ἔχουσιν ἐντολήν — «как имеют заповедь». ἑπτακαίδεκα… ἄλλα τάλαντα δέκα — тёмное место: слав. «иных талант седмьнадесять, да приносят десять на коеждо лето», ru «сверх семнадцати предписанных… по десяти талантов в год»; передано буквально (十七 и 十 талантов)."
  53: "τοῖς προσβαίνουσιν ἀπὸ τῆς Βαβυλωνίας — «приходящим из Вавилонии» (προσβαίνω); κτίσαι τὴν πόλιν — «построить город» (κτίζω); τὴν ἐλευθερίαν — «свободу»; τοῖς τέκνοις — «детям»."
  54: "χορηγία — «снабжение, содержание» (χορηγία; 支給); ἱερατικὴ στολή — «священническое облачение» (στολή); ἐν τίνι λατρεύουσιν — «в котором служат» (λατρεύω). Слав. «(повеле дати)» — глосса, в текст не внесена."
  55: "ἕως ἧς ἡμέρας — «до того дня, когда»; ἐπιτελεσθῇ ὁ οἶκος — «совершится дом» (ἐπιτελέω), т. е. храм; οἰκοδομηθῆναι — «быть построену» (οἰκοδομέω)."
  56: "φρουροῦσι τὴν πόλιν — «стерегущим город» (φρουρέω); κλήρους — «жребии», т. е. участки (κλῆρος); ὀψώνια — «жалованье, содержание» (ὀψώνιον)."
  57: "ἐξαπέστειλεν — «отослал» (ἐξαποστέλλω); ἐξεχώρισεν ἀπὸ Βαβυλῶνος — «отделил из Вавилона»; ἐπέταξεν — «повелел» (ἐπιτάσσω); ὅσα εἶπεν Κῦρος ποιῆσαι — «что сказал сделать Кир»."
  58: "ὁ νεανίσκος — «юноша» (νεανίσκος), т. е. Зоровавель; ἄρας τὸ πρόσωπον — «подняв лицо» (αἴρω); ἐναντίον Ιερουσαλημ — «против Иерусалима»; εὐλόγησεν τῷ βασιλεῖ τοῦ οὐρανοῦ — «благословил Царя Небесного» (εὐλογέω + dat.)."
  59: "νίκη — «победа» (νίκη); σοφία — «премудрость»; σὴ ἡ δόξα — «Твоя слава»; οἰκέτης — «слуга, домочадец» (οἰκέτης; слав. «раб»). Начало молитвы Зоровавеля."
  60: "εὐλογητὸς εἶ — «благословен Ты»; ὃς ἔδωκάς μοι σοφίαν — «Который дал мне премудрость»; ὁμολογῶ — «исповедую, благодарю» (ὁμολογέω); δέσποτα τῶν πατέρων — «Владыко отцов»; слав. добавляет «Боже» («Господи Боже отец наших»)."
  61: "ἔλαβεν τὰς ἐπιστολάς — «принял письма» (ἐπιστολή); ἐξῆλθεν εἰς Βαβυλῶνα — «вышел в Вавилон»; ἀπήγγειλεν — «возвестил» (ἀπαγγέλλω); ἀδελφοῖς — «братьям»."
  62: "εὐλόγησαν τὸν θεὸν τῶν πατέρων — «благословили Бога отцов»; ἄνεσις — «ослабление, облегчение» (ru «свободу»); ἄφεσις — «отпущение, освобождение». Стих обрывается: инфинитивы 4:63 зависят от ἄφεσιν."
  63: "ἀναβῆναι καὶ οἰκοδομῆσαι — «взойти и построить»; οὗ ὠνομάσθη τὸ ὄνομα αὐτοῦ ἐπ᾿ αὐτῷ — «где наречено имя Его над ним» (ὀνομάζω); ἐκωθωνίζοντο — «пировали» (κωθωνίζομαι, от κώθων — пиршественная чаша); ἡμέρας ἑπτά — «семь дней»."
