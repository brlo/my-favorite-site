# jp-box, 2-я Ездры, глава 4. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc в книге нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 4: речь о силе царя (1–12), речь о женщинах (13–32), речь об истине (33–40),
# народ признаёт истину (41), просьба Зоровавеля и указ Дария (42–57), возвращение
# и начало строительства (58–63). Прямая речь — 「…」: 2–12, 14–32, 34–40, 41, 42,
# 43–46, 59–60; вложенных цитат нет. Красного и синего нет.
# Нумерация по gr: 63 стиха; всего в главе csl тоже 63, но внутри 4:6–11 он дробит
# иначе (гр. 4:6b стоит у csl в начале 4:7, гр. 4:8 разорван между csl 4:8–9,
# гр. 4:10–11 сдвинуты); держимся деления gr. 4:40 у csl начинается концом гр. 4:39.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz. Слав. вставки в скобках («красны»
# 4:17, «убийства» 4:23, «повеле дати» 4:54) — редакционные глоссы, в текст не внесены.
# 4:41: в gr-lxx-byz «Μεγάλη ἡ ἀλήθεια καὶ ὑπερισχύει» без πάντων, слав. «и премогает»;
# «всех» — церковное чтение (ru «сильнее всего»), поэтому в тексте すべてに勝る.
# Сносок ⟨…⟩ нет: 祭壇, 燔祭, 祭司, レビ人, タラント, 太守 уже в корпусе.
# Имена — транслитерация греческого (LXX): ゾロバベル, ダリウス, クロス, アパメ, バルタコス.

tr_code: jp-box
