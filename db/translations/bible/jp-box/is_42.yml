verses:
  1: "「ヤコブ、わたしのしもべ。わたしは彼を受[う]け入[い]れる。イスラエル、わたしの選[えら]ばれた者[もの]。わたしの魂[たましい]は彼を喜[よろこ]んだ。わたしはわたしの霊[れい]を彼の上[うえ]に置[お]いた。彼は諸国[しょこく]の民[たみ]に裁[さば]きを告[つ]げ知[し]らせる。"
  2: "彼は叫[さけ]ばず、声[こえ]を上[あ]げず、外[そと]にその声を聞[き]かせることもない。"
  3: "傷[いた]ついた葦[あし]を折[お]らず、くすぶる灯心[とうしん]を消[け]さず、真理[しんり]へと裁[さば]きを導[みちび]き出[だ]す。"
  4: "彼は輝[かがや]き出[で]て、消[き]えることはない。地[ち]に裁[さば]きを置[お]くまで。諸国[しょこく]の民[たみ]は彼の名[な]に望[のぞ]みを置[お]く。」"
  5: "主[しゅ]である神[かみ]はこう言[い]われる。神[かみ]は天[てん]を造[つく]り、これを固[かた]く据[す]え、地[ち]とその上[うえ]にあるものを堅[かた]くし、その上[うえ]の民[たみ]に息[いき]を与[あた]え、その上を歩[あゆ]む者[もの]に霊[れい]を与[あた]えられる。"
  6: "「わたしは主[しゅ]、神[かみ]である。わたしは義[ぎ]をもってあなたを呼[よ]び、あなたの手[て]を握[にぎ]って強[つよ]くし、あなたをイスラエルの民[たみ]の契約[けいやく]、諸国[しょこく]の民[たみ]の光[ひかり]とする。"
  7: "目[め]の見[み]えない者[もの]たちの目[め]を開[ひら]き、縛[しば]られた者[もの]を束縛[そくばく]から、闇[やみ]に座[すわ]る者[もの]を牢獄[ろうごく]から導[みちび]き出[だ]すために。"
  8: "わたしは主[しゅ]、神[かみ]である。これがわたしの名[な]である。わたしはわたしの栄光[えいこう]をほかの者[もの]に与[あた]えず、わたしの誉[ほま]れを刻[きざ]んだ像[ぞう]に与[あた]えない。"
  9: "見[み]よ、初[はじ]めからのことはすでに来[き]た。わたしは新[あたら]しいことを告[つ]げる。それが現[あらわ]れる前[まえ]に、あなたがたに示[しめ]しておく。」"
  10: "主[しゅ]に新[あたら]しい歌[うた]を歌[うた]え。その支配[しはい]の始[はじ]まりを歌え。地[ち]の果[は]てから、その名[な]をほめたたえよ。海[うみ]に下[くだ]る者[もの]たち、海を渡[わた]る者[もの]たち、島々[しまじま]とその住民[じゅうみん]たちよ。"
  11: "荒野[こうや]とその村[むら]々[むら]よ、喜[よろこ]べ。牧場[ぼくじょう]の宿営[しゅくえい]とケダルに住[す]む者[もの]たちよ。岩[いわ]の上[うえ]に住む者[もの]たちも喜び、山[やま]の頂[いただき]から声[こえ]を上[あ]げる。"
  12: "彼らは神[かみ]に栄光[えいこう]を帰[き]し、島々[しまじま]でその誉[ほま]れを告[つ]げる。"
  13: "主[しゅ]、力[ちから]の神[かみ]は出[で]て行[い]き、戦[いくさ]を砕[くだ]く。熱[ねつ]を奮[ふる]い起[お]こし、その敵[てき]に向[む]かって力[ちから]をもって叫[さけ]ぶ。"
  14: "「わたしは黙[だま]っていた。いつまでも黙り、耐[こら]えているべきなのか。わたしは産[う]む女[おんな]のように耐えた。わたしは打[う]ち壊[こわ]し、ともに干[ひ]からびさせる。"
  15: "わたしは山[やま]と丘[おか]を荒[あ]らし、その草[くさ]をすべて干[ひ]からびさせる。川[かわ]を島[しま]とし、沼[ぬま]を干からびさせる。"
  16: "わたしは目[め]の見[み]えない者[もの]たちを、彼らが知[し]らない道[みち]に導[みちび]き、知[し]らなかった小径[こみち]を歩[あゆ]ませる。わたしは彼らの暗[くら]やみを光[ひかり]とし、曲[ま]がった所[ところ]をまっすぐにする。わたしはこれらの言葉[ことば]を行[おこな]い、彼らを見捨[みす]てない。」"
  17: "彼らは後[うし]ろへ引[ひ]き返[かえ]った。恥[はじ]を受[う]けよ、刻[きざ]んだ像[ぞう]に望[のぞ]みを置[お]き、鋳[い]た像[ぞう]に「あなたがたはわたしたちの神[かみ]だ」と言[い]う者[もの]たちよ。"
  18: "耳[みみ]の聞[き]こえない者[もの]たちよ、聞[き]け。目[め]の見[み]えない者[もの]たちよ、目[め]を開[ひら]いて見[み]よ。"
  19: "だれが目[め]の見[み]えない者[もの]なのか。わたしのしもべたちのほかに。だれが耳[みみ]の聞[き]こえない者[もの]なのか。彼らを支配[しはい]する者[もの]たちのほかに。神[かみ]のしもべたちは目[め]が見[み]えなくなった。"
  20: "あなたがたは何度[なんど]も見[み]たが、心[こころ]に留[と]めなかった。耳[みみ]は開[ひら]かれていたが、聞[き]かなかった。"
  21: "主[しゅ]である神[かみ]は、ご自身[じぶん]が正[ただ]しいと認[みと]められ、賛美[さんび]を大[おお]きくされることを望[のぞ]まれた。"
  22: "わたしは見[み]た。この民[たみ]は奪[うば]われ、奪[うば]い尽[つ]くされた。網[あみ]は至[いた]る所[ところ]の奥[おく]の部屋[へや]に、家[いえ]々[いえ]にもともに張[は]られ、彼らが身[み]を隠[かく]した所[ところ]で、彼らは獲物[えもの]となった。救[すく]い出[だ]す者[もの]はなく、「返[かえ]せ」と言[い]う者[もの]もない。"
  23: "あなたがたのうち、だれがこれに耳[みみ]を傾[かたむ]け、来[きた]るべきことに聞[き]き入[い]れるのか。"
  24: "だれがヤコブを略奪[りゃくだつ]する者[もの]に渡[わた]し、イスラエルを奪[うば]う者[もの]に渡[わた]したのか。神[かみ]ではないか。この神[かみ]に彼らは罪[つみ]を犯[おか]し、その道[みち]を歩[あゆ]もうとせず、その律法[りっぽう]を聞[き]こうともしなかった。"
  25: "神[かみ]は彼らの上[うえ]にその激[はげ]しい怒[いか]りを注[そそ]ぎ、戦[いくさ]が彼らを強[つよ]くした。彼らを周[まわ]りで焼[や]く者[もの]たちがいても、彼らはだれ一人[ひとり]知[し]らず、心[こころ]に留[と]めなかった。"

notes:
  1: "Ιακωβ ὁ παῖς μου, ἀντιλήμψομαι αὐτοῦ — «Иаков, раб Мой, восприиму его»: в LXX и слав. Раб назван Иаковом/Израилем; в МТ и ru «Вот, Отрок Мой, Которого Я держу за руку», и так же цитирует Мф 12:18 («Вот, Раб Мой, которого Я избрал»). По паритету держим LXX и слав. (Иаков/Израиль), расхождение с МТ и Мф — здесь. ἀντιλαμβάνομαι — «брать, поддерживать» (слав. «восприиму»), передано 受け入れる. ὁ ἐκλεκτός μου, προσεδέξατο αὐτὸν ἡ ψυχή μου — «избранный Мой, прият его душа Моя». ἔδωκα τὸ πνεῦμά μου ἐπ᾽ αὐτόν — «дах дух Мой нань». κρίσιν τοῖς ἔθνεσιν ἐξοίσει — «суд языком возвестит»."
  2: "οὐ κεκράξεται οὐδὲ ἀνήσει — «не возопиет ниже ослабит» (ἀνίημι — «ослаблять, отпускать»); οὐδὲ ἀκουσθήσεται ἔξω ἡ φωνὴ αὐτοῦ — «ниже услышится вне глас его», т. е. не будет кричать на улицах. В ru «не возвысит голоса Своего… на улицах» — по МТ; в гр. «вне» (ἔξω), передано 外に."
  3: "κάλαμον τεθλασμένον οὐ συντρίψει — «трости сокрушены не сотрет» (θλάω — «ломать», συντρίβω — «сокрушать»); λίνον καπνιζόμενον οὐ σβέσει — «льна курящася не угасит» (λίνον — лён, фитиль; 灯心, как в Мф 12:20). εἰς ἀλήθειαν ἐξοίσει κρίσιν — «во истину изнесет суд»: εἰς ἀλήθειαν — «по истине, к истине». В Мф 12:20 здесь εἰς νῖκος («к победе») — иное чтение, по МТ."
  4: "ἀναλάμψει καὶ οὐ θραυσθήσεται — «возсияет и не сокрушится» (θραύω — «ломать, сокрушать»); слав. «не потухнет» — иное чтение (как будто σβεσθήσεται). По паритету в тексте слав. (消えることはない), вариант LXX — здесь. ἕως ἂν θῇ ἐπὶ τῆς γῆς κρίσιν — «дондеже положит на земли суд». ἐπὶ τῷ ὀνόματι αὐτοῦ ἔθνη ἐλπιοῦσιν — «на имя его языцы уповати имут»: цитируется в Мф 12:21. Здесь закрывается песнь Раба."
  5: "οὕτως λέγει κύριος ὁ θεός — «тако глаголет Господь Бог»: формула вне кавычек, речь открывается с 42:6. ὁ ποιήσας τὸν οὐρανὸν καὶ πήξας αὐτόν — «сотворивый небо и водрузивый е» (πήγνυμι — «утверждать, водружать»); ὁ στερεώσας τὴν γῆν καὶ τὰ ἐν αὐτῇ — «утверждей землю и яже на ней». διδοὺς πνοὴν τῷ λαῷ τῷ ἐπ᾽ αὐτῆς — «даяй дыхание людем, иже на ней» (πνοή — дыхание; 息). В слав. «в завет рода израилева» (42:6) — добавление, см. notes 6."
  6: "ἐγὼ κύριος ὁ θεός — «Аз Господь Бог»; ἐκάλεσά σε ἐν δικαιοσύνῃ — «призвах тя в правде»; κρατήσω τῆς χειρός σου — «удержу за руку твою»; ἐνισχύσω σε — «укреплю тя». ἔδωκά σε εἰς διαθήκην γένους, εἰς φῶς ἐθνῶν — «дах тя в завет рода, во свет языков»: слав. добавляет «израилева» (рода израилева) — в LXX нет, по паритету внесено (イスラエルの民の契約). Стих цитируется в Лк 2:32 (свет к просвещению язычников)."
  7: "ἀνοῖξαι ὀφθαλμοὺς τυφλῶν — «отверсти очи слепых»; ἐξαγαγεῖν ἐκ δεσμῶν δεδεμένους — «извести от уз связанныя»; ἐξ οἴκου φυλακῆς καθημένους ἐν σκότει — «из дому темницы седящыя во тме». В конце стиха в gr стоит редакторский знак «—»; в текст не переносим (brief, «Рефрены и редакторские пометы»)."
  8: "τοῦτό μού ἐστιν τὸ ὄνομα — «сие мое есть имя»; τὴν δόξαν μου ἑτέρῳ οὐ δώσω — «славы моея иному не дам»; οὐδὲ τὰς ἀρετάς μου τοῖς γλυπτοῖς — «ниже добродетелей моих истуканным»: ἀρετή здесь «хвала, слава» (не «добродетель»), отсюда 誉れ; γλυπτόν — 刻んだ像. В ru «хвалы Моей истуканам» — то же понимание."
  9: "τὰ ἀπ᾽ ἀρχῆς ἰδοὺ ἥκασιν — «иже из начала, се, приидоша» (ἥκω — «приходить», perfect со значением настоящего); καινὰ ἃ ἐγὼ ἀναγγελῶ — «новая, яже Аз возвещу»; πρὸ τοῦ ἀνατεῖλαι ἐδηλώθη ὑμῖν — «прежде неже возвестити, явишася вам» (δηλόω — «являть, показывать»). Здесь закрывается речь 42:6–9."
  10: "ὕμνον καινόν — «песнь нову»; ἡ ἀρχὴ αὐτοῦ — «началство его»: место тёмное, вероятно «начало его [владычества]»; в ru «хвалу Ему от концов земли» — по МТ. οἱ καταβαίνοντες εἰς τὴν θάλασσαν καὶ πλέοντες αὐτήν — «сходящии в море и плавающии по нему»; αἱ νῆσοι καὶ οἱ κατοικοῦντες αὐτάς — «острови и живущии на них»."
  11: "εὐφράνθητι, ἔρημος καὶ αἱ κῶμαι αὐτῆς — «возвеселися, пустыне, и веси ея»; ἐπαύλεις — «придвория», загоны, селения пастухов (牧場の宿営); οἱ κατοικοῦντες Κηδαρ — «живущии в Кидаре»: Κηδαρ — ケダル, аравийское племя. οἱ κατοικοῦντες Πέτραν — «живущии на камени»: Πέτρα — скала и город Петра; слав. читает как нарицательное («на камени»), в тексте имя по LXX (ペトラ). ἀπ᾽ ἄκρων τῶν ὀρέων βοήσουσιν — «от края гор возопиют»."
  12: "δώσουσιν τῷ θεῷ δόξαν — «дадят Богу славу»; τὰς ἀρετὰς αὐτοῦ ἐν ταῖς νήσοις ἀναγγελοῦσιν — «добродетели его во островех возвестят» (ἀρετή — «хвала», как в 42:8)."
  13: "κύριος ὁ θεὸς τῶν δυνάμεων — «Господь Бог сил»: не σαβαωθ, поэтому 力の神, а не 万軍の主. ἐξελεύσεται καὶ συντρίψει πόλεμον — «изыдет и сокрушит рать» (συντρίβω — сокрушать; πόλεμος — война, рать); ἐπεγερεῖ ζῆλον — «воздвигнет рвение» (ζῆλος — рвение, ярость); βοήσεται ἐπὶ τοὺς ἐχθροὺς αὐτοῦ μετὰ ἰσχύος — «возопиет на враги своя со крепостию»."
  14: "ἐσιώπησα — «молчах»; μὴ καὶ ἀεὶ σιωπήσομαι καὶ ἀνέξομαι — «еда и всегда умолчу и потерплю» (ἀνέχομαι — «терпеть»); ἐκαρτέρησα ὡς ἡ τίκτουσα — «терпех яко раждающая» (καρτερέω — «терпеливо ждать»); ἐκστήσω καὶ ξηρανῶ ἅμα — «истреблю и изсушу вкупе» (ἐξίστημι здесь «поражать, разрушать»)."
  15: "καὶ θήσω ποταμοὺς εἰς νήσους καὶ ἕλη ξηρανῶ — «и положу реки во островы, и луги изсушу» (ἕλος — болото, заливной луг). Слав. добавляет в начале стиха «опустошу горы и холмы, и всяку траву их изсушу» — в LXX этого нет (слав. идёт за МТ); по паритету внесено в текст без скобок (山と丘を荒らし…)."
  16: "καὶ ἄξω τυφλοὺς ἐν ὁδῷ, ᾗ οὐκ ἔγνωσαν — «и наведу слепыя на путь, егоже не видеша»; τρίβους, οὓς οὐκ ᾔδεισαν, πατῆσαι ποιήσω αὐτούς — «по стезям, ихже не знаша, ходити сотворю им» (τρίβος — тропа, 小径). ποιήσω αὐτοῖς τὸ σκότος εἰς φῶς — «сотворю им тму во свет»; τὰ σκολιὰ εἰς εὐθεῖαν — «стропотная в правая» (σκολιός — кривой). ταῦτα τὰ ῥήματα ποιήσω — «сия глаголы сотворю»; οὐκ ἐγκαταλείψω αὐτούς — «не оставлю их». Здесь закрывается речь 42:14–16."
  17: "αὐτοὶ δὲ ἀπεστράφησαν εἰς τὰ ὀπίσω — «тии же возвратишася вспять»; αἰσχύνθητε αἰσχύνην — «посрамитеся стыдением» (внутренний объект при αἰσχύνομαι); οἱ πεποιθότες ἐπὶ τοῖς γλυπτοῖς — «уповающии на изваянная» (γλυπτόν — 刻んだ像); τοῖς χωνευτοῖς — «слиянным» (χωνευτόν — 鋳た像). Их слова «вы наши боги» — в 「…」."
  18: "Οἱ κωφοί, ἀκούσατε — «глусии, услышите» (κωφός — глухой); οἱ τυφλοί, ἀναβλέψατε ἰδεῖν — «слепии, прозрите видети» (ἀναβλέπω — «прозревать»). Обращение к народу, а не к язычникам; с 42:18 начинается пророческая речь до конца главы (без кавычек)."
  19: "τίς τυφλὸς ἀλλ᾽ ἢ οἱ παῖδές μου — «кто слеп, разве раби мои»; κωφοὶ ἀλλ᾽ ἢ οἱ κυριεύοντες αὐτῶν — «глуси, разве владеющии ими» (κυριεύω — «господствовать»): в ru «вестник Мой, Мною посланный» — по МТ (מַלְאָכִי «мой посланник»), не внесено. ἐτυφλώθησαν οἱ δοῦλοι τοῦ θεοῦ — «ослепоша раби Божии»."
  20: "εἴδετε πλεονάκις — «видесте многажды» (πλεονάκις — «многократно»); οὐκ ἐφυλάξασθε — «не сохранисте», т. е. не удержали в сердце; ἠνοιγμένα τὰ ὦτα — «отверсты уши (имуще)»; οὐκ ἠκούσατε — «не слышасте»."
  21: "ἐβούλετο ἵνα δικαιωθῇ — «восхоте, да оправдится»: passive, «чтобы Он был признан праведным» (в ru по МТ «ради правды Своей возвеличить и прославить закон» — иное чтение). μεγαλύνῃ αἴνεσιν — «возвеличит хвалу» (αἴνεσις — хвала, 賛美). καὶ εἶδον — «и я увидел»: в gr эти слова стоят в конце 42:21, слав. переносит их в начало 42:22; держим слав., иначе стих обрывается на «и увидел»."
  22: "ὁ λαὸς πεπρονομευμένος καὶ διηρπασμένος — «людие расхищени и разграблени» (προνομεύω — «грабить», διαρπάζω — «расхищать»); ἡ παγὶς ἐν τοῖς ταμιείοις πανταχοῦ — «пругло бо в ложах везде»: παγίς — сеть, ловушка; ταμιεῖον — кладовая, внутренняя комната (奥の部屋); слав. «в ложах» — иное понимание. ὅπου ἔκρυψαν αὐτούς — «идеже скрыша я»; ἐγένοντο εἰς προνομήν — «быша в плен»; οὐκ ἦν ὁ ἐξαιρούμενος ἅρπαγμα — «не бысть изимаяй разграбления»; οὐκ ἦν ὁ λέγων Ἀπόδος — «не бе глаголющаго: отдаждь»: слова, которых никто не говорит, — в 「…」."
  23: "τίς ἐν ὑμῖν, ὃς ἐνωτιεῖται ταῦτα — «кто в вас, иже внушит сия» (ἐνωτίζομαι — «внимать, приклонять ухо»); εἰσακούσεται εἰς τὰ ἐπερχόμενα — «услышит во грядущая»."
  24: "τίς ἔδωκεν εἰς διαρπαγὴν Ιακωβ — «кто даде на разграбление Иакова»; οὐχὶ ὁ θεός, ᾧ ἡμάρτοσαν αὐτῷ — «не Бог ли, емуже согрешиша» (дательный при ἁμαρτάνω); οὐκ ἐβούλοντο ἐν ταῖς ὁδοῖς αὐτοῦ πορεύεσθαι — «не восхотеша в путех его ходити»; οὐδὲ ἀκούειν τοῦ νόμου αὐτοῦ — «ни слушати закона его»."
  25: "ἐπήγαγεν ἐπ᾽ αὐτοὺς ὀργὴν θυμοῦ αὐτοῦ — «наведе на ня гнев ярости своея» (ὀργή — гнев, θυμός — ярость); κατίσχυσεν αὐτοὺς πόλεμος — «укрепися на ня рать», т. е. война одолела их; οἱ συμφλέγοντες αὐτοὺς κύκλῳ — «палящии их окрест» (συμφλέγω — сожигать); οὐκ ἔγνωσαν ἕκαστος αὐτῶν — «не уведеша кийждо их»; οὐδὲ ἔθεντο ἐπὶ ψυχήν — «ниже положиша на уме», т. е. не приняли к сердцу."
