# jp-box, Исаия, глава 42. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для гл. 42 есть фрагментами (40–43), но выгрузки
# по этой главе не делалось, в работе он не использовался; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 42: 1–4 первая песнь Раба Господня; 5–9 слово Господа: призвание Раба в завет
# народа и свет языков; 10–13 новая песнь всей земли и выход Господа на брань; 14–16
# «долго молчал Я» — Господь ведёт слепых; 17 посрамление надеющихся на идолов;
# 18–25 слепой и глухой народ, разграбленный, и причина — непослушание.
# Речи: песнь Раба (1–4) и слова Господа (6–9; 14–16) — 「…」. 10–13 — пророческий
# призыв к хвале (авторский голос, без кавычек); 17 — пророческое слово о идолослужителях
# (без кавычек), внутри него их слова — 「…」; 18–25 — пророческая речь (без кавычек),
# внутри 22 — слова, которых никто не говорит, — 「…」. Вводные формулы (5) — вне кавычек.
# Нумерация по gr: 25 стихов; у csl и ru тоже 25. Внутри главы слав. делит иначе:
# gr кончает 42:21 словом καὶ εἶδον («и я увидел»), а 42:22 начинает «и стал народ
# разграбленным»; слав. переносит «И видех» в начало 42:22. Держим деление слав.,
# иначе 21-й стих обрывается на «и увидел» без дополнения (notes 21–22).
# Паритет: слав. добавления внесены без 〔…〕 — 42:6 «рода израилева» (нет в LXX);
# 42:15 «опустошу горы и холмы, и всяку траву их изсушу» (нет в LXX, слав. идёт за МТ).
# 42:1–4 — первая песнь Раба, цитируется в Мф 12:18–21; LXX и слав. называют Раба
# Иаковом/Израилем, МТ и Мф — «Вот, Раб Мой, которого Я избрал»: держим LXX и слав.,
# расхождение — в notes 1.
# 〔…〕 нет; сносок ⟨…⟩ нет: 葦, 灯心, 島々, 荒野, 網, 律法 уже в корпусе или пояснены
# в notes (ケダル, ペトラ, セイレーン).
# Имена — транслитерация греческого (LXX): ヤコブ, イスラエル, ケダル, ペトラ, シオン.

