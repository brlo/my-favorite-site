verses:
  1: "第百四十九年[だいひゃくよんじゅうきゅうねん]、アンティオコス・エウパトルが大軍[たいぐん]を率[ひき]いてユダヤへ来[く]るという知[し]らせが、ユダとその仲間[なかま]たちに届[とど]いた。"
  2: "彼[かれ]とともに、後見[こうけん]で政務[せいむ]を司[つかさど]るリュシアスがいた。それぞれギリシアの軍[ぐん]を率[ひき]い、歩兵[ほへい]十一万[じゅういちまん]、騎兵[きへい]五千三百[ごせんさんびゃく]、象[ぞう]二十二頭[にじゅうにとう]、鎌[かま]をつけた戦車[せんしゃ]三百[さんびゃく]台[だい]であった。"
  3: "メネラオスも彼らに加[くわ]わり、多[おお]くの偽[いつわ]りを込[こ]めてアンティオコスを勧[すす]めた。それは父[ちち]の国[くに]の救[すく]いのためではなく、自分[じぶん]がその職[しょく]に据[す]えられることを思[おも]ってのことであった。"
  4: "しかし、王[おう]の王[おう]である方[かた]は、この不敬[ふけい]な者[もの]へのアンティオコスの怒[いか]りをかき立[た]てられた。そしてリュシアスが、彼[かれ]こそすべての悪[あく]の原因[げんいん]だと示[しめ]すと、王[おう]は、その場所[ばしょ]の慣習[かんしゅう]に従[したが]って、彼をベリアへ連[つ]れて行[い]かせて殺[ころ]すように命[めい]じた。"
  5: "その場所[ばしょ]には、五十[ごじゅう]ペキスの高[たか]さの、灰[はい]で満[み]ちた塔[とう]があった。そこには、四方[しほう]に回[まわ]る、灰[はい]の中[なか]へ落[お]とす仕掛[しか]けの装置[そうち]があった。"
  6: "そこへ、すべての者[もの]が、神殿[しんでん]を汚[けが]した罪[つみ]に問[と]われた者[もの]、あるいはほかの悪[あく]で他[た]の人[ひと]を凌[しの]いだ者[もの]を、滅[ほろ]びへと押[お]し込[こ]むのである。"
  7: "このような死[し]に方[ほう]をとげることになったのは、無法[むほう]なメネラオスであった。彼[かれ]は土[つち]に葬[ほうむ]られることもなかった。"
  8: "それはまったく正[ただ]しいことであった。彼[かれ]は祭壇[さいだん]に対して多[おお]くの罪[つみ]を犯[おか]したからである。その祭壇[さいだん]の火[ひ]も灰[はい]も聖[せい]であったのに、彼[かれ]は灰[はい]の中[なか]で死[し]を受[う]け取[と]ったのである。"
  9: "さて王[おう]は、思考[しこう]まで荒[あら]れ果[は]てて進[すす]み、父[ちち]の時代[じだい]に起[お]こったことよりもひどいことをユダヤ人[じん]に示[しめ]そうとしていた。"
  10: "ユダはこれを知[し]ると、民[たみ]に、昼[ひる]も夜[よる]も主[しゅ]を呼[よ]び求[もと]めるように命[めい]じた。律法[りっぽう]と父[ちち]の国[くに]と聖[せい]なる神殿[しんでん]を奪[うば]われようとしている者[もの]たちのために、主[しゅ]が、かってそうであったように、今[いま]も助[たす]けてくださるようにと。"
  11: "また、つい先[さき]までようやく息[いき]をついたばかりの民[たみ]が、神[かみ]を冒瀆[ぼうとく]する民[たみ]々[たみ]の手[て]に渡[わた]されないようにと願[ねが]った。"
  12: "すべての者[もの]が共[とも]にそうして、泣[な]き、断食[だんじっく]し、ひれ伏[ふ]して、三日[みっか]の間[あいだ]絶[た]え間[ま]なく憐[あわ]れみ深[ふか]い主[しゅ]に願[ねが]うと、ユダは彼らを励[はげ]まして、集[あつ]まるように命[めい]じた。"
  13: "そして、自分[じぶん]は長老[ちょうろう]たちとひそかに会[あ]い、王[おう]の軍[ぐん]がユダヤに入[はい]り都[みやこ]を占領[せんりょう]する前[まえ]に、出[で]て行[い]って、神[かみ]の助[たす]けによって事[こと]を決[き]めるべきだと決議[けつぎ]した。"
  14: "そして、世界[せかい]の造[つく]り主[ぬし]に采配[さいはい]をゆだね、自分[じぶん]とともにいる者[もの]たちに、律法[りっぽう]、神殿[しんでん]、都[みやこ]、父[ちち]の国[くに]、国[くに]の制度[せいど]のために死[し]ぬまで勇[いさ]ましく戦[たたか]うように勧[すす]め、モディンの近[ちか]くに陣[じん]を敷[し]いた。"
  15: "そして、自分[じぶん]とともにいる者[もの]たちに「神[かみ]の勝利[しょうり]」という合図[あいず]を与[あた]え、選[えら]ばれた最[さい]良[りょう]の若者[わかもの]たちとともに夜[よる]に王[おう]の陣営[じんえい]へ襲[おそ]いかかり、陣中[じんちゅう]で二千人[にせんにん]の者[もの]を殺[ころ]し、象[ぞう]の先頭[せんとう]のものと、それに乗[の]っていた者[もの]とを刺[さ]し殺[ころ]した。"
  16: "そしてついに、陣営[じんえい]を恐怖[きょうふ]と混乱[こんらん]で満[み]たし、成功[せいこう]のうちに引[ひ]き揚[あ]げた。"
  17: "これが起[お]こったのは、すでに夜[よ]が明[あ]けかけたころ、主[しゅ]が彼[かれ]を覆[おお]い守[まも]っておられたからである。"
  18: "王[おう]はユダヤ人[じん]の大胆[だいたん]さを味[あじ]わうと、策略[さくりゃく]によってその場所[ばしょ]を取[と]ろうとした。"
  19: "そして、ユダヤ人[じん]の堅固[けんご]な要塞[ようさい]ベフスラに迫[せま]ったが、何度[なんど]も押[お]し返[かえ]され、打[う]ち負[ま]かし、損害[そんがい]を受[う]けた。"
  20: "その間[あいだ]、中[なか]にいる者[もの]たちには、ユダが必要[ひつよう]なものを送[おく]っていた。"
  21: "しかし、ユダヤの隊[たい]の者[もの]ロドコスが、敵[てき]にその秘密[ひみつ]を告[つ]げた。彼[かれ]は捜[さが]し出[だ]され、捕[と]らえられ、閉[と]じ込[こ]められた。"
  22: "王[おう]は二度目[にどめ]にベフスラの人[ひと]々[びと]と話[はな]し合[あ]い、手[て]を結[むす]び、それを受[う]け入[い]れて去[さ]り、ユダの者[もの]たちに攻[せ]めかかったが、敗[やぶ]れた。"
  23: "そして、アンティオキアに残[のこ]して政務[せいむ]を任[まか]せていたフィリッポスが離反[りはん]したと知[し]ると、彼[かれ]は動揺[どうよう]し、ユダヤ人[じん]を説得[せっとく]して、すべての正[ただ]しい条件[じょうけん]で服[ふく]し、誓[ちか]い、和解[わかい]して犠牲[ぎせい]を捧[ささ]げ、神殿[しんでん]を敬[うやま]い、その場所[ばしょ]に温情[おんじょう]を示[しめ]した。"
  24: "また、マッカバイオスを迎[むか]え入[い]れ、プトレマイスからゲラ人[じん]のところまでを治[おさ]める将軍[しょうぐん]としてヘゲモニデスを残[のこ]した。"
  25: "そしてプトレマイスへ来[き]た。プトレマイスの人[ひと]々[びと]は、この協定[きょうてい]に不満[ふまん]で、その条件[じょうけん]を取[と]り消[け]そうとしたので、憤[いきどお]った。"
  26: "そこでリュシアスは演壇[えんだん]に上[あ]がり、できるかぎり弁明[べんめい]し、説得[せっとく]してなだめ、好意[こうい]を持[も]たせてから、アンティオキアへ引[ひ]き揚[あ]げた。王[おう]の遠征[えんせい]と帰還[きかん]は、このように進[すす]んだのである。"

notes:
  1: "Τῷ… ἐνάτῳ καὶ τεσσαρακοστῷ καὶ ἑκατοστῷ ἔτει — «в сто сорок девятый год»; προσέπεσεν τοῖς περὶ τὸν Ιουδαν — «донесено было бывшим с Иудой» (προσπίπτω); Ἀντίοχον τὸν Εὐπάτορα παραγενέσθαι σὺν πλήθεσιν — «Антиох Евпатор пришёл с множествами»."
  2: "τὸν ἐπίτροπον καὶ ἐπὶ τῶν πραγμάτων — «опекуна и [поставленного] над делами»; ἕκαστον ἔχοντα δύναμιν Ἑλληνικήν — «каждый имея эллинскую силу»; πεζῶν μυριάδας ἕνδεκα — «пеших одиннадцать мириад» (сто десять тысяч); ἐλέφαντας εἴκοσι δύο — «слонов двадцать два»; ἅρματα δὲ δρεπανηφόρα τριακόσια — «колесниц серпоносных триста» (δρεπανηφόρος, 鎌[かま])."
  3: "συνέμειξεν δὲ αὐτοῖς καὶ Μενέλαος — «смешался (присоединился) к ним и Менелай»; μετὰ πολλῆς εἰρωνείας — «с большим притворством (иронией)» (εἰρωνεία); οὐκ ἐπὶ σωτηρίᾳ τῆς πατρίδος — «не ради спасения отечества»; οἰόμενος δὲ ἐπὶ τῆς ἀρχῆς κατασταθήσεσθαι — «думая быть поставленным на начальство»."
  4: "ὁ βασιλεὺς τῶν βασιλέων — «Царь царей» (о Боге); ἐξήγειρεν τὸν θυμὸν τοῦ Ἀντιόχου ἐπὶ τὸν ἀλιτήριον — «воздвиг ярость Антиоха на нечестивца»; ὡς ἔθος ἐστὶν ἐν τῷ τόπῳ — «как обычай есть в том месте»; προσαπολέσαι ἀγαγόντας εἰς Βέροιαν — «погубить, отведя в Берию» (ベリア)."
  5: "πύργος πεντήκοντα πήχεων — «башня в пятьдесят локтей»; πλήρης σποδοῦ — «полная пепла» (σποδός); ὄργανον… περιφερὲς πάντοθεν ἀπόκρημνον εἰς τὴν σποδόν — «орудие, кругом обращающееся, низвергающее в пепел» (ἀπόκρημνος)."
  6: "τὸν ἱεροσυλίας ἔνοχον — «виновного в святотатстве» (ἔνοχος); ἢ καί τινων ἄλλων κακῶν ὑπεροχὴν πεποιημένον — «или сделавшего превосходство в иных злых [делах]»; ἅπαντες προσωθοῦσιν εἰς ὄλεθρον — «все сталкивают на погибель» (προσωθέω)."
  7: "τοιούτῳ μόρῳ — «такой смертью» (μόρος); τὸν παράνομον — «беззаконного»; μηδὲ τῆς γῆς τυχόντα — «не получив и земли (погребения)»."
  8: "πάνυ δικαίως — «вполне праведно»; πολλὰ περὶ τὸν βωμὸν ἁμαρτήματα — «много грехов против жертвенника» (βωμός); οὗ τὸ πῦρ ἁγνὸν ἦν καὶ ἡ σποδός — «которого огонь и пепел были чисты (святы)»; ἐν σποδῷ τὸν θάνατον ἐκομίσατο — «в пепле смерть получил»."
  9: "τοῖς φρονήμασιν… βεβαρβαρωμένος — «одичавший в мыслях» (βαρβαρόω); τὰ χείριστα τῶν ἐπὶ τοῦ πατρὸς αὐτοῦ γεγονότων — «худшее из бывшего при отце его»; ἐνδειξόμενος — «имея показать» (ἐνδείκνυμι)."
  10: "παρήγγειλεν τῷ πλήθει — «повелел множеству»; δι᾽ ἡμέρας καὶ νυκτός — «день и ночь»; εἴ ποτε καὶ ἄλλοτε, καὶ νῦν ἐπιβοηθεῖν — «как некогда, и ныне помочь»; τοῖς… στερεῖσθαι μέλλουσιν — «имеющим лишиться» (στερέω)."
  11: "τὸν ἄρτι βραχέως ἀνεψυχότα λαόν — «только что немного отдохнувший народ» (ἀναψύχω); μὴ ἐᾶσαι… ὑποχειρίους γενέσθαι — «не дать стать подручными»; τοῖς δυσφήμοις ἔθνεσιν — «хульным язычникам» (δύσφημος)."
  12: "τὸ αὐτὸ ποιησάντων ὁμοῦ — «сделавших то же вместе»; καταξιωσάντων — «удостоивших (просивших)»; μετὰ κλαυθμοῦ καὶ νηστειῶν καὶ προπτώσεως — «с плачем, постами и падением ниц» (πρόπτωσις); ἐπὶ ἡμέρας τρεῖς — «три дня»; παρακαλέσας αὐτοὺς… ἐκέλευσεν παραγίνεσθαι — «ободрив их, повелел собраться»."
  13: "καθ᾽ ἑαυτὸν… σὺν τοῖς πρεσβυτέροις γενόμενος — «оставшись наедине со старейшинами»; ἐβουλεύσατο — «решил (советовал)»; πρὶν εἰσβαλεῖν τοῦ βασιλέως τὸ στράτευμα — «прежде чем войску царя войти»; κρῖναι τὰ πράγματα — «решить дело»."
  14: "δοὺς τὴν ἐπιτροπὴν τῷ κτίστῃ τοῦ κόσμου — «вверив попечение Творцу мира» (ἐπιτροπή); γενναίως ἀγωνίσασθαι μέχρι θανάτου — «мужественно сражаться до смерти»; περὶ νόμων, ἱεροῦ, πόλεως, πατρίδος, πολιτείας — «за законы, храм, город, отечество, государственное устройство»; περὶ δὲ Μωδειν ἐποιήσατο τὴν στρατοπεδείαν — «близ Модина расположил стан» (モディン)."
  15: "ἀναδοὺς… σύνθημα — «дав условный знак (пароль)» (σύνθημα); μετὰ νεανίσκων ἀρίστων κεκριμένων — «с отборными лучшими юношами»; ἐπιβαλὼν νύκτωρ ἐπὶ τὴν βασιλικὴν αὐλήν — «напав ночью на царский двор»; τὴν παρεμβολὴν ἀνεῖλεν εἰς ἄνδρας δισχιλίους — «в лагере убил до двух тысяч мужей»; τὸν πρωτεύοντα τῶν ἐλεφάντων — «первенствующего (главного) из слонов»; τὸν κατ᾽ οἰκίαν ὄντα — «находившегося в помещении (на нём)»; συνεκέντησεν — «пронзил». Слав. «четыре тысящы» — иное чтение; по gr две тысячи."
  16: "τὸ τέλος τὴν παρεμβολὴν δέους καὶ ταραχῆς ἐπλήρωσαν — «наконец исполнили лагерь страха и смятения»; ἐξέλυσαν εὐημεροῦντες — «ушли с успехом» (ἐκλύω)."
  17: "ὑποφαινούσης ἤδη τῆς ἡμέρας — «когда уже занимался день»; διὰ τὴν ἐπαρήγουσαν αὐτῷ τοῦ κυρίου σκέπην — «из-за помогающего ему покрова Господа» (ἐπαρήγω, σκέπη)."
  18: "εἰληφὼς γεῦμα τῆς τῶν Ιουδαίων εὐτολμίας — «взяв вкус (отведав) иудейской отваги» (εὐτολμία); κατεπε ίρασεν διὰ μεθόδων τοὺς τόπους — «попытался хитростями [овладеть] местами» (μέθοδος)."
  19: "ἐπὶ Βαιθσουρα φρούριον ὀχυρόν — «на Вефсуру, крепкую крепость» (ベフスラ); ἐτροποῦτο — «обращаем был в бегство» (τροπόω); προσέκρουεν — «терпел поражение» (προσκρούω); ἠλαττονοῦτο — «умалялся» (ἐλαττονόω)."
  20: "τοῖς δὲ ἔνδον… τὰ δέοντα εἰσέπεμψεν — «бывшим внутри нужное послал»."
  21: "τὰ μυστήρια — «тайны»; Ροδοκος ἐκ τῆς Ιουδαικῆς τάξεως — «Родок из иудейского отряда» (ロドコス); ἀνεζητήθη καὶ κατελήμφθη καὶ κατεκλείσθη — «был отыскан, схвачен и заключён»."
  22: "ἐδευτερολόγησεν — «вторично переговорил» (δευτερολογέω); τοῖς ἐν Βαιθσουροις — «с бывшими в Вефсуре»; δεξιὰν ἔδωκεν, ἔλαβεν — «десницу дал, принял»; ἥττων ἐγένετο — «побеждён был» (ἥττων). Слав. относит «брань с Иудою» к 23; по gr — к 22."
  23: "μετέλαβεν ἀπονενοῆσθαι τὸν Φίλιππον — «узнал, что Филипп отложился» (ἀπονοέομαι); τὸν ἀπολελειμμένον ἐπὶ τῶν πραγμάτων — «оставленного над делами»; συνεχύθη — «смутился»; ὑπετάγη καὶ ὤμοσεν ἐπὶ πᾶσι τοῖς δικαίοις — «подчинился и поклялся на всех справедливых [условиях]»; συνελύθη — «примирился» (συλλύω); ἐτίμησεν τὸν νεὼ — «почтил храм»; ἐφιλανθρώπησεν — «оказал милость»."
  24: "τὸν Μακκαβαῖον ἀπεδέξατο — «Маккавея принял» (ἀποδέχομαι); κατέλιπεν στρατηγὸν ἀπὸ Πτολεμαίδος ἕως τῶν Γερρηνῶν Ἡγεμονίδην — «оставил военачальником от Птолемаиды до Геррян Гегемонида» (ヘゲモニデス, ゲラ人[じん])."
  25: "ἦλθεν εἰς Πτολεμαίδα — «пришёл в Птолемаиду» (プトレマイス); ἐδυσφόρουν περὶ τῶν συνθηκῶν — «тяготились договорами» (δυσφορέω); ἐδείναζον — «негодовали» (δεινάζω); ὑπὲρ ὧν ἠθέλησαν ἀθετεῖν τὰς διαστάλσεις — «за то, что хотели отменить уступки (распоряжения)» (διάσταλσις)."
  26: "προσῆλθεν ἐπὶ τὸ βῆμα Λυσίας — «взошёл на трибуну (судилище) Лисий» (βῆμα); ἀπελογήσατο ἐνδεχομένως — «защитился по возможности» (ἀπολογέομαι); συνέπεισεν, κατεπράυνεν, εὐμενεῖς ἐποίησεν — «убедил, успокоил, сделал благосклонными»; ἀνέζευξεν εἰς Ἀντιόχειαν — «отправился в Антиохию» (ἀναζεύγνυμι); τὰ τοῦ βασιλέως τῆς ἐφόδου καὶ τῆς ἀναζυγῆς — «царские поход и возвращение» (ἀναζυγή)."
