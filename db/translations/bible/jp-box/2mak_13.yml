# в башне с пеплом; 9–12 царь и молитва народа; 13–17 ночное нападение на лагерь
# при Модине; 18–23 осада Вефсуры, измена Родока, мир с царём; 24–26 Гегемонид,
# Птолемаида, речь Лисия.
# Голоса: прямой речи нет.
