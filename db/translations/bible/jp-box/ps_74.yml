verses:
  0: "指揮者[しきしゃ]のために。「滅[ほろ]ぼすな」の調[しら]べで。アサフの詩[うた]、歌[うた]。"
  1: "神[かみ]よ、わたしたちはあなたに感謝[かんしゃ]をささげる。あなたに感謝[かんしゃ]をささげ、あなたの名[な]を呼[よ]び求[もと]める。"
  2: "時[とき]が来[く]れば、わたしはあなたのすべての奇[き]跡[せき]を語[かた]ろう。わたしは正[ただ]しく裁[さば]く。"
  3: "「地[ち]は溶[と]け、そこに住[す]む者[もの]はみな溶[と]け去[さ]った。このわたしがその柱[はしら]を堅[かた]く据[す]えた」と。"
  4: "わたしは不法[ふほう]をなす者[もの]たちに言[い]った。「不法[ふほう]を重[かさ]ねるな」。罪[つみ]を犯[おか]す者[もの]たちにも言[い]う。「角[つの]を高[たか]く上[あ]げるな。"
  5: "あなたがたの角[つの]を高[たか]く上[あ]げるな。神[かみ]に逆[さか]らって不正[ふせい]を語[かた]るな」と。"
  6: "高[たか]くすることが東[ひがし]からでも、西[にし]からでも、荒野[こうや]の山[やま]からでもないからである。"
  7: "神[かみ]は裁[さば]く方[かた]であり、この者[もの]を低[ひく]くし、あの者[もの]を高[たか]くされる。"
  8: "主[しゅ]の手[て]には杯[さかずき]があり、濃[こ]く混[ま]ぜ合[あ]わされたぶどう酒[ぶどうしゅ]が満[み]ちている。主[しゅ]はそこから注[そそ]がれる。その滓[かす]は残[のこ]ったままで、地[ち]のすべての罪[つみ]人[びと]がそれを飲[の]む。"
  9: "しかし、わたしはとこしえに喜[よろこ]び躍[おど]り、ヤコブの神[かみ]に歌[うた]おう。"
  10: "わたしは罪[つみ]人[びと]の角[つの]をすべて砕[くだ]き、正[ただ]しい者[もの]の角[つの]は高[たか]く上[あ]げられる。"

notes:
  0: "Εἰς τὸ τέλος — «в конец», т. е. начальнику хора; μὴ διαφθείρῃς — «не погуби» (музыкальная ремарка, ср. Пс 56–58); ψαλμὸς τῷ Ασαφ ᾠδῆς — アサフの詩、歌. Надписание — стих 0."
  1: "ἐξομολογησόμεθά σοι — 感謝をささげる (ἐξομολογέομαι — «исповедовать, славословить»); повтор греч. сохранён. ἐπικαλεσόμεθα τὸ ὄνομά σου — 名を呼び求める."
  2: "διηγήσομαι πάντα τὰ θαυμάσιά σου, ὅταν λάβω καιρόν — 時が来れば…すべての奇跡を語ろう (καιρός — «время, срок»). ἐγὼ εὐθύτητας κρινῶ — わたしは正しく裁く (εὐθύτης — «правота»)."
  3: "ἐτάκη ἡ γῆ καὶ πάντες οἱ κατοικοῦντες ἐν αὐτῇ — 地は溶け、住む者はみな溶け去った (τήκω — «плавить, таять»). ἐγὼ ἐστερέωσα τοὺς στύλους αὐτῆς — このわたしがその柱を堅く据えた (στύλος — «столп»). Слова Бога — 「」."
  4: "εἶπα τοῖς παρανομοῦσιν· Μὴ παρανομεῖτε — 不法をなす者たちに「不法を重ねるな」. В LXX граница речи не отмечена; по указанию стих 3 — слова Бога, а 4–5 — слово псалмопевца к нечестивым (в евр. это продолжение речи Бога). τοῖς ἁμαρτάνουσιν· Μὴ ὑψοῦτε κέρας — 罪を犯す者たちに「角を高く上げるな」 (κέρας — «рог», образ силы и гордыни)."
  5: "μὴ ἐπαίρετε εἰς ὕψος τὸ κέρας ὑμῶν — あなたがたの角を高く上げるな. μὴ λαλεῖτε κατὰ τοῦ θεοῦ ἀδικίαν — 神に逆らって不正を語るな (κατά + gen. — «против»)."
  6: "οὔτε ἀπὸ ἐξόδων οὔτε ἀπὸ δυσμῶν — ни от востоков, ни от западов (ἔξοδος — «выход, восток»; δυσμή — «запад»). οὔτε ἀπὸ ἐρήμων ὀρέων — ни от пустынных гор."
  7: "ὁ θεὸς κριτής ἐστιν — 神は裁く方. τοῦτον ταπεινοῖ καὶ τοῦτον ὑψοῖ — この者を低くし、あの者を高くする (ταπεινόω — «смирять»)."
  8: "ποτήριον ἐν χειρὶ κυρίου οἴνου ἀκράτου πλῆρες κεράσματος — 主の手には杯があり、濃く混ぜ合わされたぶどう酒が満ちている (ἄκρατος — «неразбавленный»; κέρασμα — «смесь, приправа»). ἔκλινεν ἐκ τούτου εἰς τοῦτο — そこから注ぐ. ὁ τρυγίας αὐτοῦ οὐκ ἐξεκενώθη — その滓は残ったまま (τρυγίας — «дрожжи, осадок»). πίονται πάντες οἱ ἁμαρτωλοὶ τῆς γῆς — 地のすべての罪人が飲む."
  9: "ἀγαλλιάσομαι εἰς τὸν αἰῶνα — とこしえに喜び躍る. ψαλῶ τῷ θεῷ Ιακωβ — ヤコブの神に歌う."
  10: "πάντα τὰ κέρατα τῶν ἁμαρτωλῶν συγκλάσω — 罪人の角をすべて砕く (συγκλάω — «сокрушать»). ὑψωθήσεται τὰ κέρατα τοῦ δικαίου — 正しい者の角は高く上げられる."
