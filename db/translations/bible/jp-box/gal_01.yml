# jp-box, Послание к Галатам, глава 1. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 1: надписание и приветствие (1–5), нет другого Евангелия и анафема (6–10),
# как Павел получил Евангелие — не от людей, а через откровение (11–12),
# прежняя жизнь в иудействе и призвание (13–17), первое посещение Иерусалима (18–24).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет, <j>/<mo> не ставятся.
# 〔…〕 в главе нет: [Χριστοῦ] (1:6) и [ὑμῖν] (1:8) стоят в базе в квадратных скобках,
# слова есть, поэтому не оборачиваются.
# Сносок ⟨…⟩ в главе нет: アナテマ уже пояснено в 1 Кор 12:3. jp-ni не использовался.

tr_code: jp-box
book: gal
chapter: 1
draft: true

verses:
  1: "パウロ、使徒[しと]。人[ひと]からでもなく、人[ひと]を通[とお]してもなく、イエス・キリストと、死者[ししゃ]の中[なか]から彼[かれ]を復活[ふっかつ]させた父[ちち]なる神[かみ]による使徒[しと]である。"
  2: "および、わたしとともにある兄弟[きょうだい]たちすべてから、ガラテヤの諸[しょ]教会[きょうかい]へ。"
  3: "恵[めぐ]みと平和[へいわ]が、わたしたちの父[ちち]である神[かみ]と主[しゅ]イエス・キリストから、あなたがたにありますように。"
  4: "この方[かた]は、わたしたちの罪[つみ]のためにご自分[じぶん]をお与[あた]えになった。わたしたちの父[ちち]である神[かみ]の御心[みこころ]に従[したが]って、わたしたちを今[いま]の悪[あ]しき世[よ]から救[すく]い出[だ]すためである。"
  5: "栄光[えいこう]が、世々[よよ]限[かぎ]りなく、この方[かた]にありますように。アーメン。"
  6: "わたしは驚[おどろ]いている。あなたがたが、キリストの恵[めぐ]みによってあなたがたを召[め]された方[かた]から、こんなにも早[はや]く離[はな]れて、別[べつ]の福音[ふくいん]へと移[うつ]っているからである。"
  7: "それは別[べつ]の福音[ふくいん]ではない。ただ、あなたがたをかき乱[みだ]し、キリストの福音[ふくいん]を変[か]えようとしている者[もの]たちがいるだけである。"
  8: "しかし、わたしたちであれ、天[てん]から来[き]た天使[てんし]であれ、わたしたちがあなたがたに宣[の]べ伝[つた]えた福音[ふくいん]と違[ちが]う福音[ふくいん]を宣[の]べ伝[つた]える者[もの]があれば、その者[もの]はアナテマとされよ。"
  9: "前[まえ]に言[い]ったとおり、今[いま]もまた言[い]う。あなたがたが受[う]け入[い]れた福音[ふくいん]と違[ちが]う福音[ふくいん]をあなたがたに宣[の]べ伝[つた]える者[もの]は、だれであれ、アナテマとされよ。"
  10: "というのは、今[いま]、わたしは人[ひと]の心[こころ]を得[え]ようとしているのか、神[かみ]の心[こころ]を得[え]ようとしているのか。それとも、人[ひと]に喜[よろこ]ばれようと努[つと]めているのか。もし今[いま]もなお人[ひと]に喜[よろこ]ばれようとしていたなら、わたしはキリストの僕[しもべ]ではなかっただろう。"
  11: "兄弟[きょうだい]たち、あなたがたに知[し]ってもらいたい。わたしが宣[の]べ伝[つた]えた福音[ふくいん]は、人[ひと]によるものではない。"
  12: "なぜなら、わたしはそれを人[ひと]から受[う]けたのでも、教[おし]えられたのでもなく、イエス・キリストの啓示[けいじ]によるからである。"
  13: "なぜなら、あなたがたは、わたしがかつてユダヤ教[きょう]のうちで行[おこな]っていた生活[せいかつ]を聞[き]いているからである。すなわち、わたしは神[かみ]の教会[きょうかい]を激[はげ]しく迫害[はくがい]し、それを荒[あ]らしていたのである。"
  14: "そして、わたしの同族[どうぞく]のうちで、わたしと同[おな]じ年頃[としごろ]の多[おお]くの人[ひと]々[びと]よりも、ユダヤ教[きょう]のうちで進[すす]んでいた。父祖[ふそ]の言[い]い伝[つた]えに、人[ひと]一倍[いちばい]熱心[ねっしん]であったのである。"
  15: "しかし、母[はは]の胎[たい]からわたしを取[と]り分[わ]け、その恵[めぐ]みによってわたしを召[め]された神[かみ]が、"
  16: "御子[みこ]をわたしのうちに現[あらわ]し、わたしが異邦人[いほうじん]の間[あいだ]に御子[みこ]を福音[ふくいん]として宣[の]べ伝[つた]えるようにとお定[さだ]めになったとき、わたしはすぐに、血肉[けつにく]に相談[そうだん]しなかった。"
  17: "また、エルサレムへ上[のぼ]って、わたしより先[さき]に使徒[しと]となった人[ひと]々[びと]を訪[たず]ねることもせず、むしろアラビアへ出[で]かけて、またダマスコへ戻[もど]った。"
  18: "それから三年[さんねん]の後[のち]、ケファに会[あ]うためにエルサレムへ上[のぼ]り、彼[かれ]のもとに十五日[じゅうごにち]間[かん]滞在[たいざい]した。"
  19: "しかし、ほかの使徒[しと]たちは、主[しゅ]の兄弟[きょうだい]ヤコブのほか、だれにも会[あ]わなかった。"
  20: "わたしがあなたがたに書[か]いていることについて、見[み]よ、神[かみ]の御前[みまえ]で言[い]うが、わたしは偽[いつわ]らない。"
  21: "それから、シリアとキリキアの地方[ちほう]へ行[い]った。"
  22: "わたしは、キリストにあるユダヤの諸[しょ]教会[きょうかい]には、顔[かお]を知[し]られていなかった。"
  23: "ただ、彼[かれ]らは、かつてわたしたちを迫害[はくがい]していた者[もの]が、今[いま]は、かつて荒[あ]らしていた信仰[しんこう]を福音[ふくいん]として宣[の]べ伝[つた]えている、とだけ聞[き]いていた。"
  24: "そして、わたしのゆえに神[かみ]を崇[あが]めていた。"

notes:
  1: "Παῦλος ἀπόστολος — без глагола, как в Рим 1:1. οὐκ ἀπ᾽ ἀνθρώπων οὐδὲ δι᾽ ἀνθρώπου — 人からでもなく、人を通してもなく. διὰ Ἰησοῦ Χριστοῦ καὶ θεοῦ πατρός — «через Иисуса Христа и Бога Отца»; родительный при 使徒. ἐγείραντος — 復活させた."
  2: "ταῖς ἐκκλησίαις τῆς Γαλατίας — ガラテヤの諸教会. Γαλατία — ガラテヤ (не ガラティヤ, как у jp-joc)."
  3: "χάρις καὶ εἰρήνη — 恵みと平和, формула приветствия (ср. Рим 1:7)."
  4: "τοῦ δόντος ἑαυτὸν ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν — «отдавшего Себя за грехи наши». ἐξέληται — 救い出す. αἰὼν ἐνεστὼς πονηρός — «настоящий злой век»; 今の悪しき世."
  5: "ᾧ ἡ δόξα — «Которому слава»; εἰς τοὺς αἰῶνας τῶν αἰώνων — 世々限りなく."
  6: "В базе [Χριστοῦ] в квадратных скобках — слово есть, 〔〕 не ставятся: キリストの恵み. μετατίθεσθε — «переставляетесь, переходите»; 移っている. ἕτερον εὐαγγέλιον — 別の福音 (не просто «другое», а «иного рода»)."
  7: "ὃ οὐκ ἔστιν ἄλλο — «которое не есть иное»; それは別の福音ではない. ταράσσοντες — 乱し. μεταστρέψαι — 変えようとしている."
  8: "В базе [ὑμῖν] — слово есть, 〔〕 не ставятся. ἀνάθεμα ἔστω — アナテマとされよ; термин уже пояснён в 1 Кор 12:3, сноски нет. ἄγγελος ἐξ οὐρανοῦ — 天から来た天使."
  9: "ὡς προειρήκαμεν — 前に言ったとおり. παρ᾽ ὃ παρελάβετε — «иное, чем приняли»; 受け入れた福音と違う福音."
  10: "Ἄρτι γάρ — というのは、今. πείθω — «убеждать, склонять»; 心を得よう. ἀρέσκειν — 喜ばれよう. εἰ ἔτι… ἤρεσκον — ирреальное условие: ではなかっただろう."
  11: "γνωρίζω — 知ってもらいたい. οὐκ ἔστιν κατὰ ἄνθρωπον — «не по человеку»; 人によるものではない."
  12: "οὐδὲ γὰρ ἐγώ — なぜなら、わたしは. παρέλαβον — 受けた. ἐδιδάχθην — 教えられた. δι᾽ ἀποκαλύψεως Ἰησοῦ Χριστοῦ — イエス・キリストの啓示によって (род. субъектный и объектный)."
  13: "ἀναστροφή — 生活. Ἰουδαϊσμός — ユダヤ教. καθ᾽ ὑπερβολὴν ἐδίωκον — 激しく迫害し. ἐπόρθουν — 荒らしていた."
  14: "προέκοπτον — 進んでいた. συνηλικιῶται — 同じ年頃の者. ζηλωτὴς τῶν πατρικῶν παραδόσεων — 父祖の言い伝えに熱心."
  15: "ἀφορίσας ἐκ κοιλίας μητρός — «отделивший от утробы матери»; 母の胎から取り分け. διὰ τῆς χάριτος — その恵みによって."
  16: "ἀποκαλύψαι τὸν υἱὸν αὐτοῦ ἐν ἐμοί — «открыть Сына Своего во мне»; わたしのうちに現し. σαρκὶ καὶ αἵματι — «плоти и крови», то есть людям; 血肉."
  17: "ἀνῆλθον εἰς Ἱεροσόλυμα — エルサレムへ上る (восхождение в город). ἀπῆλθον εἰς Ἀραβίαν — アラビアへ出かけて. ὑπέστρεψα — 戻った."
  18: "ἱστορῆσαι Κηφᾶν — «посетить Кефу»; ケファ — арамейское имя Петра. ἐπέμεινα — 滞在した."
  19: "εἰ μὴ Ἰάκωβον — ヤコブのほか. ἀδελφὸν τοῦ κυρίου — 主の兄弟."
  20: "ἰδοὺ ἐνώπιον τοῦ θεοῦ — «вот, пред Богом»; 見よ、神の御前で. οὐ ψεύδομαι — 偽らない."
  21: "κλίματα — 地方 (области). Συρία, Κιλικία — シリア、キリキア."
  22: "ἀγνοούμενος τῷ προσώπῳ — «неизвестный лицом»; 顔を知られていなかった. ταῖς ἐν Χριστῷ — キリストにある."
  23: "ὁ διώκων ἡμᾶς ποτε — かつてわたしたちを迫害していた者. τὴν πίστιν ἣν ποτε ἐπόρθει — かつて荒らしていた信仰."
  24: "ἐδόξαζον ἐν ἐμοὶ τὸν θεόν — «прославляли во мне Бога»; わたしのゆえに神を崇めていた."
