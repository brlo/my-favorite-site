# jp-box, Первое послание к Коринфянам, глава 12. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 12: источник даров — один Дух (1–11), тело и его члены (12–30),
# путь ещё превосходнейший (31).
# Красного и синего нет: прямой речи Христа и Богородицы в главе нет, <j>/<mo> не ставятся.
# 〔…〕 в главе нет: [δὲ] в 12:10 в базе есть, весь текст стихов на месте.
# Сноска ⟨…⟩ одна: 12:3 アナテマ — слово, неочевидное нехристианину, первое место в корпусе.
