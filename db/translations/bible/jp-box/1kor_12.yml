tr_code: jp-box
book: 1kor
chapter: 12
draft: true

verses:
  1: "さて、兄弟[きょうだい]たちよ、霊[れい]の賜物[たまもの]については、あなたがたに知[し]ってもらいたいことがある。"
  2: "あなたがたが異邦人[いほうじん]であったとき、引[ひ]かれるままに、物[もの]を言[い]わない偶像[ぐうぞう]のもとへと連[つ]れて行[い]かれていたことは、あなたがたが知[し]っているとおりである。"
  3: "だから、あなたがたに知[し]らせたい。神[かみ]の霊[れい]によって語[かた]る者[もの]は、だれも「イエスはアナテマ⟨ギリシア語[ご]で、呪[のろ]われて滅[ほろ]びに定[さだ]められたもの、という意[い]。⟩だ」と言[い]わない。また、{聖霊[せいれい]|聖神[せいしん]}によらなければ、だれも「イエスは主[しゅ]である」と言[い]えないのである。"
  4: "賜物[たまもの]にはいろいろあるが、霊[れい]は同[おな]じである。"
  5: "奉仕[ほうし]にはいろいろあるが、主[しゅ]は同[おな]じである。"
  6: "働[はたら]きにはいろいろあるが、すべての人[ひと]の中[なか]にすべてのことを働[はたら]かせておられる神[かみ]は同[おな]じである。"
  7: "それぞれの人[ひと]に、霊[れい]の現[あらわ]れが益[えき]のために与[あた]えられている。"
  8: "ある人[ひと]には、霊[れい]によって知恵[ちえ]の言[ことば]が与[あた]えられ、ほかの人[ひと]には、同[おな]じ霊[れい]によって知識[ちしき]の言[ことば]が与[あた]えられ、"
  9: "ほかの人[ひと]には同[おな]じ霊[れい]によって信仰[しんこう]が、またほかの人[ひと]には一[ひと]つの霊[れい]によって癒[いや]しの賜物[たまもの]が与[あた]えられ、"
  10: "ほかの人[ひと]には力[ちから]ある業[わざ]、ほかの人[ひと]には預言[よげん]、ほかの人[ひと]には霊[れい]を見分[みわ]ける力[ちから]、ほかの人[ひと]には種々[しゅじゅ]の異言[いげん]、ほかの人[ひと]には異言[いげん]の解[と]き明[あ]かしが与[あた]えられる。"
  11: "しかし、すべてこれらのことを働[はたら]かせるのは、同[おな]じ一[ひと]つの霊[れい]であり、霊[れい]は自分[じぶん]の望[のぞ]むままに、それぞれの人[ひと]に分[わ]け与[あた]えてくださる。"
  12: "体[からだ]は一[ひと]つでも、多[おお]くの肢[えだ]があり、体[からだ]の肢[えだ]が多[おお]くても、すべては一[ひと]つの体[からだ]である。キリストも同[おな]じである。"
  13: "わたしたちは皆[みな]、ユダヤ人[じん]であれギリシア人[じん]であれ、奴隷[どれい]であれ自由[じゆう]な者[もの]であれ、一[ひと]つの霊[れい]によって一[ひと]つの体[からだ]へと洗礼[せんれい]を受け、また皆[みな]、一[ひと]つの霊[れい]を飲[の]まされたのである。"
  14: "体[からだ]は一[ひと]つの肢[えだ]ではなく、多[おお]くの肢[えだ]である。"
  15: "もし足[あし]が「わたしは手[て]ではないから、体[からだ]に属[ぞく]していない」と言[い]っても、それで体[からだ]に属[ぞく]していないことにはならない。"
  16: "もし耳[みみ]が「わたしは目[め]ではないから、体[からだ]に属[ぞく]していない」と言[い]っても、それで体[からだ]に属[ぞく]していないことにはならない。"
  17: "もし体[からだ]のすべてが目[め]なら、聞[き]くことはどこにあるのか。もしすべてが耳[みみ]なら、嗅[か]ぐことはどこにあるのか。"
  18: "しかし今[いま]、神[かみ]はご自分[じぶん]の望[のぞ]まれたとおりに、それぞれの肢[えだ]を体[からだ]の中[なか]に置[お]かれた。"
  19: "もしすべてが一[ひと]つの肢[えだ]なら、体[からだ]はどこにあるのか。"
  20: "しかし今[いま]、肢[えだ]は多[おお]くても、体[からだ]は一[ひと]つである。"
  21: "目[め]が手[て]に「わたしはあなたを必要[ひつよう]としない」と言[い]うことはできないし、頭[かしら]が足[あし]に「わたしはあなたがたを必要[ひつよう]としない」と言[い]うこともできない。"
  22: "むしろ、体[からだ]の肢[えだ]の中で弱[よわ]いと思[おも]われるものこそ、必要[ひつよう]なものである。"
  23: "体[からだ]の肢[えだ]の中で卑[いや]しいと思[おも]われるものには、かえって多[おお]くの誉[ほま]れを着[き]せ、見苦[みぐる]しいと思[おも]われるものには、かえって多[おお]くの飾[かざ]りを施[ほどこ]す。"
  24: "しかし、わたしたちの見苦[みぐる]しくないものには、その必要[ひつよう]がない。むしろ、神[かみ]は体[からだ]を調和[ちょうわ]させ、劣[おと]っているものに、かえって多[おお]くの誉[ほま]れを与[あた]えられた。"
  25: "それは、体[からだ]の中[なか]に分裂[ぶんれつ]がなく、肢[えだ]が互[たが]いに同[おな]じように気[き]を配[くば]り合[あ]うためである。"
  26: "もし一[ひと]つの肢[えだ]が苦[くる]しむなら、すべての肢[えだ]が共[とも]に苦[くる]しむ。もし一[ひと]つの肢[えだ]が誉[ほま]れを受[う]けるなら、すべての肢[えだ]が共[とも]に喜[よろこ]ぶ。"
  27: "あなたがたはキリストの体[からだ]であり、それぞれがその肢[えだ]なのである。"
  28: "神[かみ]は教会[きょうかい]の中[なか]に、まず使徒[しと]を、次[つぎ]に預言者[よげんしゃ]を、三[さん]番目[ばんめ]に教[きょう]師[し]を、そして力[ちから]ある業[わざ]、癒[いや]しの賜物[たまもの]、助[たす]ける者[もの]、治[おさ]める者[もの]、種々[しゅじゅ]の異言[いげん]を置[お]かれた。"
  29: "すべてが使徒[しと]だろうか。すべてが預言者[よげんしゃ]だろうか。すべてが教[きょう]師[し]だろうか。すべてが力[ちから]ある業[わざ]を行[おこな]う者[もの]だろうか。"
  30: "すべてが癒[いや]しの賜物[たまもの]を持[も]っているだろうか。すべてが異言[いげん]を語[かた]るだろうか。すべてが解[と]き明[あ]かすだろうか。"
  31: "あなたがたは、さらに大[おお]きな賜物[たまもの]を熱心[ねっしん]に求[もと]めなさい。しかも、わたしはあなたがたに、はるかに優[すぐ]れた道[みち]を示[しめ]そう。"

notes:
  1: "τῶν πνευματικῶν — «о духовном / духовных [дарах]»; 霊の賜物. ἀγνοεῖν — 知らないでいる. δέ — さて."
  2: "ἔθνη ἦτε — «вы были язычниками»; 異邦人であった. ἄφωνα — 物を言わない. ὡς ἂν ἤγεσθε ἀπαγόμενοι — «как вели вас, увлекаемых»; 引かれるままに…連れて行かれていた. Трудный текст, не сглаживать."
  3: "ἀνάθεμα Ἰησοῦς — формула проклятия, букв. «Иисус — анафема»; оставлено アナテマ со сноской (первое место в корпусе; ср. Рим 9:3, где ἀνάθεμα переведено по смыслу: 呪われ、滅びに定められた者). ἐν πνεύματι ἁγίῳ — {聖霊|聖神}."
  4: "διαιρέσεις — «разделения, различия»; いろいろある. χαρίσματα — 賜物. Три параллельных стиха 4–6: 霊 / 主 / 神."
  5: "διακονίαι — 奉仕. ὁ αὐτὸς κύριος — 主は同じ."
  6: "ἐνεργήματα — 働き. ὁ ἐνεργῶν τὰ πάντα ἐν πᾶσιν — すべての人の中にすべてのことを働かせておられる神."
  7: "φανέρωσις — 現れ. πρὸς τὸ συμφέρον — 益のために."
  8: "λόγος σοφίας / λόγος γνώσεως — 知恵の言 / 知識の言. διὰ τοῦ πνεύματος — 霊によって."
  9: "ἰάματα — 癒し. Формула меняется: ἐν τῷ αὐτῷ πνεύματι / ἐν τῷ ἑνὶ πνεύματι — 同じ霊によって / 一つの霊によって; различие сохранено."
  10: "ἐνεργήματα δυνάμεων — 力ある業. διακρίσεις πνευμάτων — 霊を見分ける力. γένη γλωσσῶν — 種々の異言 (ср. Мк 16:17; Деян 19:6). ἑρμηνεία — 解き明かし (как в 14:26; выровнено с гл. 14: 解き明かす)."
  11: "διαιροῦν ἰδίᾳ ἑκάστῳ — «разделяя каждому особо»; それぞれの人に分け与えてくださる. καθὼς βούλεται — 望むままに."
  12: "μέλη — 肢. οὕτως καὶ ὁ Χριστός — キリストも同じ."
  13: "εἰς ἓν σῶμα ἐβαπτίσθημεν — 一つの体へと洗礼を受けた. ἓν πνεῦμα ἐποτίσθημεν — 一つの霊を飲まされた (не «напоены» в бытовом смысле)."
  14: "οὐκ ἔστιν ἓν μέλος — 一つの肢ではない."
  15: "οὐ παρὰ τοῦτο — «не из-за этого»; それで…ことにはならない (дважды, 15 и 16)."
  16: "Параллель 12:15, повтор дословно — как в греческом."
  17: "ποῦ ἡ ἀκοή — 聞くことはどこにあるのか. ὄσφρησις — 嗅ぐこと."
  18: "νυνὶ δέ — しかし今. ἔθετο — 置かれた. καθὼς ἠθέλησεν — 望まれたとおりに."
  19: "εἰ… ἓν μέλος — もしすべてが一つの肢なら."
  20: "νῦν δέ — しかし今. πολλὰ μὲν μέλη, ἓν δὲ σῶμα — 肢は多くても、体は一つ."
  21: "χρείαν σου οὐκ ἔχω — あなたを必要としない; во второй части ὑμῶν (мн. ч.) — あなたがたを必要としない. Число сохранено."
  22: "ἀσθενέστερα — 弱い. ἀναγκαῖα — 必要なもの. ἀλλά — むしろ."
  23: "ἀτιμότερα — 卑しい. περιτίθεμεν — 着せる. ἀσχήμονα — 見苦しい."
  24: "συνεκέρασεν — «смешал, устроил»; 調和させ. τῷ ὑστερουμένῳ — 劣っているもの."
  25: "σχίσμα — 分裂. μεριμνῶσιν — 気を配り合う."
  26: "συμπάσχει / συγχαίρει — 共に苦しむ / 共に喜ぶ. εἴτε… εἴτε — もし…なら."
  27: "μέλη ἐκ μέρους — «частично члены»; それぞれがその肢."
  28: "ἀντιλήμψεις — 助ける者. κυβερνήσεις — 治める者. γένη γλωσσῶν — 種々の異言."
  29: "Серия вопросов μή — вопросами: すべてが…だろうか."
  30: "χαρίσματα ἰαμάτων — 癒しの賜物. διερμηνεύουσιν — 解き明かす (как 14:5,13,27–28)."
  31: "ζηλοῦτε — 熱心に求める. καθ᾽ ὑπερβολὴν ὁδόν — «путь по превосходству»; はるかに優れた道. καὶ ἔτι — しかも."
