# jp-box, Исход, глава 13. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru)
# и jp-joc (1901, public domain; в этой главе ст. 10–12, 14–16, 20–22).
# ru — только для понимания, не источник. Язык — современный 常体.
# Глава 13: закон о первенцах (1–2), память об исходе и опресноки (3–10),
# первенец осла и человека, выкуп (11–16), путь через пустыню к морю, кости Иосифа,
# столп облачный и огненный (17–22).
# Красного и синего нет: говорит Бог, но это не прямая речь Христа во плоти; «<j>» не ставится.
# Кавычки: речь Моисея к народу — 「…」 (3–16); его ответ сыну — 『…』 (8, 14–16);
# слово Бога — 「…」 (2, 17); слова Иосифа в устах рассказчика — 「…」 (19).
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено по базе).
# 13:6 LXX читает «шесть дней ешьте опресноки» (ἓξ ἡμέρας), масоретский текст и Синодальный —
# семь; держимся греческого, отличие в notes. 13:18 LXX: «в пятом роде» (πέμπτη γενεά),
# а не «вооружённые» (масоретский текст). 13:18 — первое упоминание 紅海; это Чермное
# (Красное) море, 紅海, о чём в notes.
# Сносок ⟨…⟩ нет: 初子, 紅海, 雲の柱, 火の柱 — либо уже в корпусе, либо пояснены в notes.
# jp-ni не использовался.

