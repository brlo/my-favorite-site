verses:
  1: "主[しゅ]はモーセに言[い]われた。"
  2: "「イスラエルの子[こ]らのうちで、母[はは]の胎[たい]を開[ひら]いて生[う]まれる初子[ういご]はすべて、わたしのために聖別[せいべつ]しなさい。人[ひと]から家畜[かちく]に至[いた]るまで、初[はじ]めに生[う]まれる者[もの]はわたしのものである。」"
  3: "モーセは民[たみ]に言[い]った。「あなたがたは、エジプトの地[ち]から、すなわち奴隷[どれい]の家[いえ]から出[で]たこの日[ひ]を覚[おぼ]えていなさい。主[しゅ]は強[つよ]い手[て]によって、あなたがたをここから導[みちび]き出[だ]されたからである。種[たね]を入[い]れたものを食[た]べてはならない。"
  4: "今日[きょう]、あなたがたは新[あたら]しい月[つき]のうちに出[で]て行[い]く。"
  5: "主[しゅ]が、あなたの父[ちち]たちに誓[ちか]われたとおりに、あなたをカナン人[じん]、ヘト人[じん]、ヒビ人[じん]、ギルガシ人[じん]、アモリ人[じん]、ペリジ人[じん]、エブス人[じん]の地[ち]、乳[ちち]と蜜[みつ]の流[なが]れる地[ち]へ導[みちび]き入[い]れられるなら、あなたはこの月[つき]にこの務[つと]めを行[おこな]いなさい。"
  6: "六日[むいか]の間[あいだ]は種[たね]なしパンを食[た]べなさい。七日目[なぬかめ]は主[しゅ]の祭[まつ]りである。"
  7: "七日[なぬか]の間[あいだ]、種[たね]なしパンを食[た]べなさい。あなたのうちにパン種[ぱんだね]を入[い]れたものが見[み]つかってはならない。あなたのすべての境[さかい]のうちに、パン種[ぱんだね]があってはならない。"
  8: "あなたはその日[ひ]、子[こ]に告[つ]げて言[い]いなさい。『これは、わたしがエジプトを出[で]たとき、主[しゅ]がわたしのためにしてくださったことのためである。』"
  9: "それはあなたの手[て]の上[うえ]のしるしとなり、あなたの目[め]の前[まえ]の記念[きねん]となる。主[しゅ]の法[ほう]があなたの口[くち]にあるためである。主[しゅ]は強[つよ]い手[て]によって、あなたをエジプトから導[みちび]き出[だ]されたからである。"
  10: "あなたはこの法[ほう]を、定[さだ]められた時[とき]ごとに、日[ひ]から日[ひ]へと守[まも]りなさい。"
  11: "主[しゅ]があなたの父[ちち]たちに誓[ちか]われたとおりに、あなたをカナン人[じん]の地[ち]へ導[みちび]き入[い]れ、それをあなたに与[あた]えられるなら、"
  12: "あなたは母[はは]の胎[たい]を開[ひら]く者[もの]をすべて主[しゅ]にささげなさい。家畜[かちく]のうちであなたに生[う]まれる初[はじ]めの雄[おす]は、すべて主[しゅ]のものである。"
  13: "ろばの初子[ういご]はすべて、羊[ひつじ]と引[ひ]き換[か]えなさい。もし引[ひ]き換[か]えないなら、それを贖[あがな]いなさい。あなたの子[こ]らのうちの人の初子[ういご]は、すべて贖[あがな]いなさい。"
  14: "後[のち]になって、あなたの子[こ]が『これは何[なん]か』と問[と]うなら、彼[かれ]に言[い]いなさい。『主[しゅ]は強[つよ]い手[て]によって、わたしたちをエジプトから、奴隷[どれい]の家[いえ]から導[みちび]き出[だ]された。"
  15: "ファラオがかたくなで、わたしたちを去[さ]らせなかったとき、主[しゅ]はエジプトの地[ち]の初子[ういご]をすべて、人[ひと]の初子[ういご]から家畜[かちく]の初子[ういご]に至[いた]るまで殺[ころ]された。それゆえ、わたしは母[はは]の胎[たい]を開[ひら]く雄[おす]をすべて犠牲[ぎせい]として主[しゅ]にささげ、わたしの子[こ]らの初子[ういご]はすべて贖[あがな]うのである。』"
  16: "それはあなたの手[て]の上[うえ]のしるしとなり、あなたの目[め]の前[まえ]に動[うご]かぬものとなる。主[しゅ]は強[つよ]い手[て]によって、あなたをエジプトから導[みちび]き出[だ]されたからである。」"
  17: "ファラオが民[たみ]を去[さ]らせたとき、神[かみ]は彼[かれ]らを、ペリシテ人[じん]の地[ち]への道[みち]には導[みちび]かれなかった。近[ちか]いからである。神[かみ]は言[い]われた。「民[たみ]が戦[いくさ]を見[み]て悔[く]い、エジプトへ引[ひ]き返[かえ]すことのないように」と。"
  18: "神[かみ]は民[たみ]を荒野[こうや]の道[みち]へ、紅海[こうかい]へと回[まわ]り込[こ]ませられた。イスラエルの子[こ]らは第五[だいご]の世代[せだい]にエジプトの地[ち]から上[のぼ]って来[き]た。"
  19: "モーセはヨセフの骨[ほね]を携[たずさ]えて行[い]った。ヨセフは、「神[かみ]は必[かなら]ずあなたがたを顧[かえり]みられる。そのとき、あなたがたはわたしの骨[ほね]をここから一緒[いっしょ]に携[たずさ]えて上[のぼ]るがよい」と言[い]って、イスラエルの子[こ]らに堅[かた]く誓[ちか]わせていたからである。"
  20: "彼[かれ]らはスコトを出[で]て、荒野[こうや]のそばのエタムに陣[じん]を張[は]った。"
  21: "神[かみ]は彼[かれ]らの前[まえ]を進[すす]み、昼[ひる]は雲[くも]の柱[はしら]で道[みち]を示[しめ]し、夜[よる]は火[ひ]の柱[はしら]で照[て]らされた。"
  22: "昼[ひる]の雲[くも]の柱[はしら]も、夜[よる]の火[ひ]の柱[はしら]も、民[たみ]の前[まえ]から離[はな]れることはなかった。"

notes:
  1: "εἶπεν δὲ κύριος πρὸς Μωυσῆν λέγων — 主はモーセに言われた (λέγων по-японски отдельно не передаётся; речь начинается в ст. 2)."
  2: "Ἁγίασόν μοι — わたしのために聖別しなさい (ἁγιάζω — «освящать»). πᾶν πρωτότοκον πρωτογενές — 初子はすべて (πρωτογενής — «перворождённый»). διανοῖγον πᾶσαν μήτραν — 母の胎を開いて生まれる (διανοίγω — «открывать»; μήτρα — «утроба»). ἐμοί ἐστιν — わたしのものである."
  3: "Μνημονεύετε τὴν ἡμέραν ταύτην — この日を覚えていなさい (μνημονεύω). ἐξ οἴκου δουλείας — 奴隷の家から (δουλεία — «рабство»). ἐν γὰρ χειρὶ κραταιᾷ — 強い手によって (κραταιός — «крепкий»). οὐ βρωθήσεται ζύμη — 種を入れたものを食べてはならない (пассив; ζύμη — «закваска»)."
  4: "ἐν μηνὶ τῶν νέων — 新しい月のうちに (νέος — «новый»; евр. אָבִיב, Авив — месяц колосьев; Синодальный — «в месяце Авиве»; у LXX — «месяц новых плодов», слав. «месяце плодов новых»)."
  5: "Χαναναίων καὶ Χετταίων καὶ Ευαίων καὶ Γεργεσαίων καὶ Αμορραίων καὶ Φερεζαίων καὶ Ιεβουσαίων — семь народов (в слав. порядок иной). γῆν ῥέουσαν γάλα καὶ μέλι — 乳と蜜の流れる地 (ῥέω — «течь»). ποιήσεις τὴν λατρείαν ταύτην — この務めを行いなさい (λατρεία — «служение»)."
  6: "ἓξ ἡμέρας ἔδεσθε ἄζυμα — 六日の間は種なしパンを (LXX: шесть; масоретский текст и Синодальный — семь; держимся греческого). ἑορτὴ κυρίου — 主の祭り."
  7: "οὐκ ὀφθήσεταί σοι ζυμωτόν — パン種を入れたものが見つかってはならない (ὀφθήσεται — «явится»). ἐν πᾶσιν τοῖς ὁρίοις σου — すべての境のうちに (ὅριον — «предел»)."
  8: "ἀναγγελεῖς τῷ υἱῷ σου — 子に告げて言いなさい (ἀναγγέλλω). Διὰ τοῦτο — このためである. ὡς ἐξεπορευόμην ἐξ Αἰγύπτου — わたしがエジプトを出たとき (imperfect: «когда я выходил»)."
  9: "σημεῖον ἐπὶ τῆς χειρός σου — 手の上のしるし (образ действия: памятный знак). μνημόσυνον πρὸ ὀφθαλμῶν — 目の前の記念. ὁ νόμος κυρίου ἐν τῷ στόματί σου — 主の法があなたの口に (νόμος — «закон, учение»)."
  10: "κατὰ καιροὺς ὡρῶν ἀφ᾽ ἡμερῶν εἰς ἡμέρας — 定められた時ごとに、日から日へと (букв. «по временам часов, от дней к дням»; слав. «по временом уставленым, от дний до дний»)."
  11: "ὃν τρόπον ὤμοσεν τοῖς πατράσιν σου — 父たちに誓われたとおりに (ὄμνυμι). δώσει σοι αὐτήν — それをあなたに与えられる."
  12: "ἀφελεῖς — ささげなさい (ἀφαιρέω — «отделять»; слав. «отлучиши»). τὰ ἀρσενικά — 雄 (ἀρσενικός). ἐκ τῶν βουκολίων — 家畜のうちで (βουκόλιον — «стадо»). ἁγιάσεις τῷ κυρίῳ — 主に聖別しなさい."
  13: "ὄνου — ろば (ὄνος). ἀλλάξεις προβάτῳ — 羊と引き換えなさい (ἀλλάσσω). λυτρώσῃ αὐτό — それを贖いなさい (λυτρόω — «выкупать»; ср. 13:15). πᾶν πρωτότοκον ἀνθρώπου — 人の初子."
  14: "Τί τοῦτο; — これは何か (вопрос сына). Ἐν χειρὶ κραταιᾷ — 強い手によって (ср. 13:3). ἐξ οἴκου δουλείας — 奴隷の家から."
  15: "ἡνίκα δὲ ἐσκλήρυνεν Φαραω — ファラオがかたくなで (σκληρύνω — «ожесточать»; здесь без подлежащего-Бога, в отличие от 11:10). ἀπέκτεινεν — 殺された (ἀποκτείνω). ἐγὼ θύω — わたしは犠牲としてささげる (θύω — «приносить жертву»). λυτρώσομαι — 贖う (futurum)."
  16: "ἀσάλευτον — 動かぬもの (ἀσάλευτος — «непоколебимый»; слав. «непоколебимо»; Синодальный — «повязка над глазами»). ἐν χειρὶ κραταιᾷ — 強い手によって."
  17: "οὐχ ὡδήγησεν — 導かれなかった (ὁδηγέω). ὁδὸν γῆς Φυλιστιιμ — ペリシテ人の地への道 (Φυλιστιιμ — «филистимляне»). Μήποτε μεταμελήσῃ τῷ λαῷ — 民が悔い…ことのないように (μήποτε — «как бы не»; μεταμέλομαι — «раскаиваться»)."
  18: "ἐκύκλωσεν ὁ θεὸς τὸν λαόν — 神は民を回り込ませられた (κυκλόω — «обходить кругом»). εἰς τὴν ἐρυθρὰν θάλασσαν — 紅海へ (ἐρυθρά — «красная»; это Чермное, Красное море, 紅海; в Синодальном — «Чермное»). πέμπτη δὲ γενεὰ ἀνέβησαν — 第五の世代に上って来た (букв. «в пятом роде»; масоретский текст — «вооружённые», חֲמֻשִׁים; LXX понял иначе — держимся его)."
  19: "τὰ ὀστᾶ Ιωσηφ — ヨセフの骨 (ὀστέον). ὅρκῳ ὥρκισεν — 堅く誓わせていた (ὅρκος — «клятва»; датив усиления). Ἐπισκοπῇ ἐπισκέψεται ὑμᾶς κύριος — 神は必ず顧みられる (ἐπισκοπή — «посещение»; гебраизм). συνανοίσετε — 一緒に携えて上る (συναναφέρω)."
  20: "ἐξάραντες ἐκ Σοκχωθ — スコトを出て (ἐξαίρω — «сниматься»). ἐστρατοπέδευσαν ἐν Οθομ — エタムに陣を張った (στρατοπεδεύω). παρὰ τὴν ἔρημον — 荒野のそばに."
  21: "ἡγεῖτο αὐτῶν — 彼らの前を進み (ἡγέομαι — «вести»). ἐν στύλῳ νεφέλης — 雲の柱で (στῦλος — «столп»; νεφέλη — «облако»). δεῖξαι αὐτοῖς τὴν ὁδόν — 道を示すため. ἐν στύλῳ πυρός — 火の柱で."
  22: "οὐκ ἐξέλιπεν — 離れることはなかった (ἐκλείπω — «оставлять»). ἐναντίον παντὸς τοῦ λαοῦ — 民の前から (букв. «пред всем народом»)."
