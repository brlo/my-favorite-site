# jp-box, Иеремия, глава 17. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный, с МТ) — только для понимания,
# не источник. jp-joc по Иеремии — только фрагменты (гл. 11, 12, 31), для главы 17 его
# нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 17: 1–4 грех Иуды написан железным резцом (в модуле «точки»); 5–8 проклят
# надеющийся на человека / благословен уповающий на Господа; 9–10 сердце и воздаяние;
# 11 куропатка и неправедное богатство; 12–13 престол славы и источник живой воды;
# 14–18 молитва пророка об исцелении и о суде над гонителями; 19–27 слово о субботних
# ношах и о воротах Иерусалима.
# Голоса: 1–4 — без кавычек («точки» в модуле, текст по csl); 5–11 — 「…」 (слово
# Господа; формула «так говорит Господь» стоит в конце 4, вне кавычек); 12–13 — 「…」
# (молитвенный возглас пророка); 14–18 — 「…」 (молитва пророка), слова противников
# в 15 — 『…』; 19 — 「…」 (повеление пророку: «пойди и стань»); 20а — «и скажи им»
# внутри той же цитаты; 20б–27 — 『…』 (проповедь, которую пророк должен произнести,
# с формулами «так говорит Господь» внутри), до конца главы.
# Нумерация по gr: 27 стихов; слав. и ru — тоже 27, но слав. внутри главы делит иначе:
# конец gr 17:22 («καὶ οὐκ ἤκουσαν καὶ οὐκ ἔκλιναν τὸ οὖς αὐτῶν») у слав. отнесён
# к 17:23, а «и речеши к ним» из начала gr 17:20 слав. относит к концу 17:19.
# «Точки» 17:1–4: в модуле gr-lxx-byz на месте стихов стоит «.», стихи переведены
# по слав. (текст дан в выгрузке), без 〔…〕; лакуна отмечена в notes к каждому стиху.
# Слав. добавки внесены в основной текст без 〔…〕 и оговорены: 17:12 «от начала»,
# 17:19 «ко мне». 〔…〕 нет. Сносок ⟨…⟩ нет: 陶工, 粘土, 祭壇, 律法, 安息日, 燔祭,
# 素祭, 乳香 уже в корпусе или пояснены в notes.
# Имена — транслитерация греческого (LXX): ユダ, イスラエル, ダビデ, ベニヤミン.

