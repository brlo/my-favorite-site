verses:
  1: "ユダの罪[つみ]は鉄[てつ]の筆[ふで]で書[か]かれ、金剛石[こんごうせき]の爪[つめ]で彼[かれ]らの心[こころ]の板[いた]に、また彼らの祭壇[さいだん]の角[つの]に刻[きざ]まれている。"
  2: "彼[かれ]らの子[こ]らは、緑[みどり]の木[き]のそばや高[たか]い丘[おか]の上[うえ]で、自分[じぶん]たちの祭壇[さいだん]と木立[こだち]を思[おも]い起[お]こす。"
  3: "おお、山[やま]に住[す]む者[もの]よ。わたしはあなたの力[ちから]とあなたの宝[たから]を略奪[りゃくだつ]に渡[わた]し、あなたの高[たか]い所[ところ]をも、あなたのすべての国境[こくきょう]の内[うち]にある罪[つみ]のゆえに、同[おな]じく略奪に渡す。"
  4: "あなたはわたしがあなたに与[あた]えた嗣業[しぎょう]から切[き]り離[はな]され、一[ひと]人[り]だけ残[のこ]される。わたしはあなたを、あなたが知[し]らない地[ち]であなたの敵[てき]に仕[つか]えさせる。あなたがわたしの怒[いか]りの中[なか]で火[ひ]を燃[も]やしたからであり、その火は永遠[えいえん]に燃[も]え続[つづ]ける。主[しゅ]はこう言[い]われる。"
  5: "「人[ひと]を頼[たの]みとし、肉[にく]の腕[うで]を自分[じぶん]の支[ささ]えとし、その心[こころ]が主[しゅ]から離[はな]れる者[もの]は呪[のろ]われている。"
  6: "彼[かれ]は荒[あ]れ野[の]野生[やせい]の木[き]のようで、良[よ]いことが来[き]てもそれを見[み]ない。彼は乾[かわ]いた所[ところ]と荒[あ]れ野、だれも住[す]まない塩[しお]の地[ち]に住[す]む。"
  7: "主[しゅ]に信[しん]を置[お]き、主[しゅ]がその望[のぞ]みとなる人[ひと]は、幸[さいわ]いである。"
  8: "彼[かれ]は水[みず]のほとりに植[う]えられた木[き]のように、湿[しめ]りの中[なか]に根[ね]を伸[の]ばす。暑[あつ]さが来[き]ても恐[おそ]れず、その葉[は]は緑[みどり]のままで、雨[あめ]のない年[とし]にも恐れず、実[み]を結[むす]ぶことをやめない。"
  9: "心[こころ]はすべてのものよりも深[ふか]く、しかもそれは人[ひと]である。だれがそれを知[し]り得[え]ようか。"
  10: "わたしは主[しゅ]であり、心[こころ]を探[さぐ]り、腎臓[じんぞう]を試[ため]して、おのおのにその道[みち]に応[おう]じ、その営[いとな]みの実[み]に応[おう]じて返[かえ]す。"
  11: "ヤマウズラが鳴[な]き、自[みずか]らが産[う]まなかったもの[もの]を集[あつ]めた。不正[ふせい]な裁[さば]きで富[とみ]を築[きず]く者[もの]も同[おな]じである。その富は彼の日[ひ]の半[なか]ばで彼を離[はな]れ、終[お]わりに彼は愚[おろ]か者[もの]となる。」"
  12: "「初[はじ]めから高[たか]く挙[あ]げられた栄光[えいこう]の王座[おうざ]は、われわれの聖所[せいしょ]である。"
  13: "イスラエルの待[ま]ち望[のぞ]みである主[しゅ]よ、あなたを捨[す]てる者[もの]はすべて恥[はじ]を受[う]けるように。あなたから離[はな]れる者[もの]は地[ち]に書[か]き記[しる]されるように。彼らは生[い]ける水[みず]の源[みなもと]である主[しゅ]を捨てたからである。」"
  14: "「主[しゅ]よ、わたしを癒[いや]してください。そうすればわたしは癒[い]やされる。わたしを救[すく]ってください。そうすればわたしは救われる。あなたはわたしの誇[ほこ]りだからである。"
  15: "見[み]よ、彼[かれ]らはわたしに言[い]う。『主[しゅ]の言葉[ことば]はどこにあるのか。来[く]るがよい。』"
  16: "しかし、わたしはあなたに従[したが]って来[き]ることに疲[つか]れず、人[ひと]の災[わざわ]いの日[ひ]を望[のぞ]まなかった。あなたが知[し]っておられる。わたしの唇[くちびる]から出[で]たものは、あなたの前[まえ]にある。"
  17: "あなたはわたしにとってよそよそしいものとならないでください。わざわいの日[ひ]には、あなたがわたしの望[のぞ]みである。"
  18: "わたしを追[お]う者[もの]が恥[はじ]を受け、わたしは恥を受けないように。彼らが恐[おそ]れ、わたしは恐れないように。彼らの上[うえ]に災[わざわ]いの日[ひ]を導[みちび]き、二倍[にばい]の破滅[はめつ]で彼らを打[う]ち砕[くだ]いてください。」"
  19: "主[しゅ]はこう言[い]われる。「行[い]って、あなたの民[たみ]の子[こ]らの門[もん]、すなわちユダの王[おう]たちが入[はい]り、またそこから出[で]る門に立[た]ち、エルサレムのすべての門[もん]でもそうしなさい。"
  20: "そして、彼らに言[い]いなさい。『主[しゅ]の言葉[ことば]を聞[き]け。ユダの王[おう]たち、ユダのすべての者[もの]、エルサレムのすべての者、この門[もん]から入[はい]る者たちよ。"
  21: "主[しゅ]はこう言[い]われる。あなたがたの魂[たましい]を守[まも]れ。安息日[あんそくび]に荷[に]を担[かつ]いではならない。エルサレムの門[もん]から出[で]てもならない。"
  22: "安息日[あんそくび]にあなたがたの家[いえ]から荷[に]を運[はこ]び出[で]てはならない。いっさいの仕事[しごと]をしてはならない。わたしがあなたがたの父[ちち]たちに命[めい]じたとおりに、安息日を聖[せい]なるものとせよ。しかし、彼らは聞[き]かず、耳[みみ]を傾[かたむ]けなかった。"
  23: "彼[かれ]らは自分[じぶん]たちの父[ちち]たちよりも首[くび]を固[かた]くし、わたしに聞[き]かず、戒[いまし]めを受[う]け入[い]れなかった。"
  24: "しかし、主[しゅ]は言[い]われる。もしあなたがたがわたしに聞[き]き従[したが]い、安息日[あんそくび]にこの都[みやこ]の門[もん]から荷[に]を運[はこ]び入[い]れず、安息日を聖[せい]なるものとして、いっさいの仕事[しごと]をしないならば、"
  25: "この都[みやこ]の門[もん]から、ダビデの王座[おうざ]に座[すわ]り、自分[じぶん]の車[くるま]と馬[うま]に乗[の]る王[おう]たちと、彼[かれ]らおよびそのつかさたち、ユダの人[ひと]、エルサレムの住民[じゅうみん]が入[はい]る。この都[みやこ]は永遠[えいえん]に住[す]まわれる。"
  26: "彼らはユダの町[まち]々[まち]、エルサレムの周[まわ]りの所[ところ]、ベニヤミンの地[ち]、低[ひく]い地[ち]、山地[さんち]、南[みなみ]の地方[ちほう]から、燔祭[はんさい]、犠牲[ぎせい]、香[こう]、素祭[そさい]、乳香[にゅうこう]を携[たずさ]え、主[しゅ]の家[いえ]に賛美[さんび]を携えて来る。"
  27: "しかし、もしあなたがたがわたしに聞[き]き従わず、安息日[あんそくび]を聖[せい]なるものとせず、安息日に荷[に]を担[かつ]いでエルサレムの門[もん]から入[はい]るなら、わたしはその門[もん]に火[ひ]を燃[も]やし、それはエルサレムの家[いえ]々[いえ]を焼[や]き尽[つ]くして消[き]えない。』」"

notes:
  1: "В модуле gr-lxx-byz на месте 17:1 стоит «.» — лакуна (стих есть в слав. и МТ, в LXX-модуле отсутствует). Переведено по csl: «Грех иудин написан есть писалом железным на ногти адамантове, начертан на скрижали сердца их и на розех олтарей их». Евр. בְּעֵט בַּרְזֶל בְּצִפֹּרֶן שָׁמִיר — «железным резцом, алмазным остриём»; слав. «писалом железным на ногти адамантове» («ноготь» — остриё резца). Скрижаль сердца — ср. 2 Кор 3:3; рога алтарей — ср. Исх 27:2. 〔…〕 не ставится; лакуна отмечена здесь."
  2: "«Точка» в модуле — лакуна; переведено по csl: «Егда воспомянут сынове их олтари своя и дубравы своя при древе лиственне и на холмех высоких». Дубравы — священные рощи (евр. ашерот); «при древе лиственне» — «у зелёного (лиственного) дерева», ср. ru «у зеленых дерев». У слав. стих — придаточное, продолжающее 17:3; в тексте дан самостоятельным предложением (деление gr: каждый стих отдельно)."
  3: "«Точка» в модуле — лакуна; переведено по csl: «о, нагорный (жителю)! крепость твою и сокровища твоя в расхищение дам, и высокая твоя, грех ради твоих, яже во всех пределех твоих». Слав. понял евр. הֲרָרִי как обращение «о горний (житель)»; ru (МТ) — «Гору Мою в поле». Держим csl. Высокая — «высоты» (高き所) — места незаконного богослужения; «крепость» — сила, твердыня."
  4: "«Точка» в модуле — лакуна; переведено по csl: «и останешися един от наследия твоего, еже дах тебе: и служити тя сотворю врагом твоим в земли, еяже не веси: яко огнь разжегл еси в ярости моей, даже во век горети будет. сия глаголет Господь». Слав. формула «сия глаголет Господь» стоит в конце ст. 4; в LXX-тексте 17:5 формулы нет, у ru (МТ) она в начале 17:5. Оставлена в конце 4, вне кавычек, как вводная к 5–11. ru читает «лишишься наследия твоего» (МТ) — слав./LXX «останешься один»."
  5: "Ἐπικατάρατος ὁ ἄνθρωπος — «проклят человек»; ὃς τὴν ἐλπίδα ἔχει ἐπ᾽ ἄνθρωπον — «который надежду имеет на человека»; στηρίσει σάρκα βραχίονος αὐτοῦ ἐπ᾽ αὐτόν — «утвердит плоть мышцы своей на нём» (στηρίζω — укреплять, опирать); ἀπὸ κυρίου ἀποστῇ ἡ καρδία αὐτοῦ — «от Господа отступит сердце его». Слав. «проклят человек, иже надеется на человека и утвердит плоть мышцы своея на нем, и от Господа отступит сердце его». Здесь открывается слово Господа (5–11); вводная формула — в конце ст. 4."
  6: "ἀγριομυρίκη — «дикая мирика» (род тамариска?); слав. «дивия мирика», ru «вереск»; точное растение неясно, поэтому в тексте 荒れ野の野生の木 («дикое дерево пустыни»). οὐκ ὄψεται ὅταν ἔλθῃ τὰ ἀγαθά — «не увидит, когда придут блага»; κατασκηνώσει ἐν ἁλίμοις — «поселится в солёных (бесплодных) местах» (ἅλιμος — солёный, сухой); ἐν γῇ ἁλμυρᾷ ἥτις οὐ κατοικεῖται — «в земле солёной, необитаемой» (ἁλμυρός — солёный)."
  7: "εὐλογημένος ὁ ἄνθρωπος — «благословен человек»; ὃς πέποιθεν ἐπὶ τῷ κυρίῳ — «который уповал на Господа» (πείθω в перфекте — доверился); ἔσται κύριος ἐλπὶς αὐτοῦ — «и будет Господь упование его». Слав. «благословен человек, иже надеется на Господа, и будет Господь упование его». Ключевое место книги; антитеза 17:5 сохранена."
  8: "ξύλον εὐθηνοῦν παρ᾽ ὕδατα — «дерево процветающее при водах» (εὐθηνέω — процветать); слав. «древо насажденное при водах» — иное чтение, держим csl. ἐπὶ ἰκμάδα βαλεῖ ῥίζας αὐτοῦ — «в сырость (влагy) пустит корни свои» (ἰκμάς — влага); οὐ φοβηθήσεται ὅταν ἔλθῃ καῦμα — «не убоится, когда придёт зной» (καῦμα); στελέχη ἀλσώδη — «ветви, покрытые листвой» (ἄλσος — роща), слав. «стеблие зелено»; ἐν ἐνιαυτῷ ἀβροχίας — «в год бездождия» (ἀβροχία — засуха); οὐ διαλείψει ποιῶν καρπόν — «не перестанет приносить плод» (διαλείπω — прекращать). Ср. Пс 1:3."
  9: "βαθεῖα ἡ καρδία παρὰ πάντα, καὶ ἄνθρωπός ἐστιν — «глубоко сердце более всего, и человек есть»; καὶ τίς γνώσεται αὐτόν; — «и кто познает его?». Место тёмное: слав. «глубоко сердце (человеку) паче всех, и человек есть»; ru (МТ) «лукаво сердце человеческое более всего и крайне испорчено». Держим LXX/csl, не сглаживаем (в тексте 心はすべてのものよりも深く、しかも人である)."
  10: "ἐτάζων καρδίας καὶ δοκιμάζων νεφρούς — «испытующий сердца и испытывающий почки (внутренности)» (ἐτάζω — испытывать; νεφροί — почки, ср. Лев 3:4); τοῦ δοῦναι ἑκάστῳ κατὰ τὰς ὁδοὺς αὐτοῦ — «чтобы дать каждому по путям его»; κατὰ τοὺς καρποὺς τῶν ἐπιτηδευμάτων αὐτοῦ — «по плодам занятий (дел) его» (ἐπιτήδευμα — занятие, дело). Слав. «Аз Господь испытуяй сердца и искушаяй утробы… по плодом изобретений его». В тексте 腎臓 (по корпусу, ср. Лев 3), в notes — «внутренности»."
  11: "ἐφώνησεν πέρδιξ, συνήγαγεν ἃ οὐκ ἔτεκεν — «закричала куропатка, собрала, чего не родила» (πέρδιξ — куропатка, ヤマウズラ); слав. «Возгласи ряб, собра, ихже не роди». ποιῶν πλοῦτον αὐτοῦ οὐ μετὰ κρίσεως — «делающий богатство своё не по правде (без суда)»; ἐν ἡμίσει ἡμερῶν αὐτοῦ ἐγκαταλείψουσιν αὐτόν — «в половине дней его оставят его»; ἐπ᾽ ἐσχάτων αὐτοῦ ἔσται ἄφρων — «в конце его будет безумен». Образ: птица, собирающая чужие яйца (поговорка)."
  12: "Θρόνος δόξης ὑψωμένος ἁγίασμα ἡμῶν — «престол славы, высоко поднятый, святыня наша»; слав. добавляет «от начала» (в LXX нет; чтение МТ) — внесено без 〔…〕 (初めから). Речь о храме/престоле Божием; возглас пророка, поэтому 「…」 (вместе с 13)."
  13: "ὑπομονὴ Ισραηλ κύριε — «терпение (упование) Израиля, Господи» (ὑπομονή — терпение, ожидание); слав. «Чаяние израилево, Господи». πάντες οἱ καταλιπόντες σε καταισχυνθήτωσαν — «все оставляющие Тебя да постыдятся»; ἀφεστηκότες ἐπὶ τῆς γῆς γραφήτωσαν — «отступившие на земле да напишутся» (в прахе, ср. Иер 17:13 у ru «на прахе»); ὅτι ἐγκατέλιπον πηγὴν ζωῆς τὸν κύριον — «ибо оставили источник жизни — Господа». Слав. «источник живых вод» — в тексте 生ける水の源."
  14: "ἴασαί με, κύριε, καὶ ἰαθήσομαι — «исцели меня, Господи, и исцелею»; σῶσόν με, καὶ σωθήσομαι — «спаси меня, и спасён буду» (оба раза будущее в значении следствия); ὅτι καύχημά μου σὺ εἶ — «ибо Ты — похвала моя». Слав. «Изцели мя, Господи, и изцелею: спаси мя, и спасен буду, яко хвала моя ты еси». Начало молитвы пророка (14–18)."
  15: "ἰδοὺ αὐτοὶ λέγουσι πρός με — «вот, они говорят мне»; Ποῦ ἐστιν ὁ λόγος κυρίου; ἐλθάτω — «где слово Господне? да придёт». Слова противников — 『…』 внутри молитвы; κύριος в их устах — «Господь» без гонорифики."
  16: "οὐκ ἐκοπίασα κατακολουθῶν ὀπίσω σου — «я не утрудился, следуя за Тобою» (κοπιάω — утруждаться; κατακολουθέω — следовать); слав. «не утрудихся, тебе (пастырю) последуяй» — скобки csl передают вариант «пастырь», в LXX слова нет. ἡμέραν ἀνθρώπου οὐκ ἐπεθύμησα — «дня человеческого не возжелал» (т. е. дня бедствия, ср. ru «не желал бедственного дня»); σὺ ἐπίστῃ — «Ты знаешь»; τὰ ἐκπορευόμενα διὰ τῶν χειλέων μου πρὸ προσώπου σού ἐστιν — «исходящее из уст моих пред лицом Твоим»."
  17: "μὴ γενηθῇς μοι εἰς ἀλλοτρίωσιν — «не стань мне в отчуждение (чем-то чужим)» (ἀλλοτρίωσις); φειδόμενός μου ἐν ἡμέρᾳ πονηρᾷ — «щадя меня в день злой» (φείδομαι — щадить) — в слав. этот оборот не передан, у ru «не будь страшен для меня». Слав. «не буди ми во отчуждение, упование мое ты в день лют» — вторая половина понята как «Ты — упование моё»; в тексте по csl."
  18: "καταισχυνθήτωσαν οἱ διώκοντές με, καὶ μὴ καταισχυνθείην ἐγώ — «да постыдятся гонящие меня, а я да не постыжусь»; πτοηθείησαν αὐτοί — «да устрашатся они» (πτοέω — пугать); ἐπάγαγε ἐπ᾽ αὐτοὺς ἡμέραν πονηράν — «наведи на них день злой»; δισσὸν σύντριμμα σύντριψον αὐτούς — «двойным сокрушением сокруши их» (δισσός — двойной; σύντριμμα — сокрушение). Слав. «сугубым сокрушением сотри их»."
  19: "Τάδε λέγει κύριος Βάδισον καὶ στῆθι ἐν πύλαις υἱῶν λαοῦ σου — «так говорит Господь: пойди и стань в воротах сынов народа твоего»; ἐν αἷς εἰσπορεύονται… βασιλεῖς Ιουδα καὶ ἐν αἷς ἐκπορεύονται — «которыми входят цари Иудейские и которыми выходят»; καὶ ἐν πάσαις ταῖς πύλαις Ιερουσαλημ — «и во всех воротах Иерусалима». Слав. добавляет «ко мне» при формуле и переносит «и речеши к ним» в конец ст. 19 — держим gr (начало ст. 20). Формула «так говорит Господь» вне кавычек; ею вводится повеление (「…», 19–27); проповедь, которую пророк произносит, — 『…』 с 20б."
  20: "καὶ ἐρεῖς πρὸς αὐτούς — «и скажи им»; Ἀκούσατε λόγον κυρίου — «слушайте слово Господне»; βασιλεῖς Ιουδα καὶ πᾶσα Ιουδαία καὶ πᾶσα Ιερουσαλημ οἱ εἰσπορευόμενοι ἐν ταῖς πύλαις ταύταις — «цари Иудейские и вся Иудея и весь Иерусалим, входящие воротами сими». Слав. «слышите слово Господне, царие иудины и вся иудеа и весь Иерусалим, входящии во врата сия». Слова, которые пророк должен произнести, — 『…』, открывается здесь и закрывается в конце 27."
  21: "Φυλάσσεσθε τὰς ψυχὰς ὑμῶν — «берегите души ваши» (φυλάσσω — хранить, блюсти); μὴ αἴρετε βαστάγματα ἐν τῇ ἡμέρᾳ τῶν σαββάτων — «не поднимайте нош в день субботний» (βάσταγμα — ноша); μὴ ἐκπορεύεσθε ταῖς πύλαις Ιερουσαλημ — «не выходите воротами Иерусалима». Слав. «сохраните душы вашя и не носите бремен в день суббот… не исходите враты Иерусалима»."
  22: "μὴ ἐκφέρετε βαστάγματα ἐξ οἰκιῶν ὑμῶν — «не выносите нош из домов ваших»; πᾶν ἔργον οὐ ποιήσετε — «никакого дела не делайте»; ἁγιάσατε τὴν ἡμέραν τῶν σαββάτων — «освятите день субботний»; καθὼς ἐνετειλάμην τοῖς πατράσιν ὑμῶν — «как Я заповедал отцам вашим». Конец стиха в gr: καὶ οὐκ ἤκουσαν καὶ οὐκ ἔκλιναν τὸ οὖς αὐτῶν — «и не послушали и не приклонили уха своего»; у слав. это отнесено к 17:23 — держим gr."
  23: "ἐσκλήρυναν τὸν τράχηλον αὐτῶν ὑπὲρ τοὺς πατέρας αὐτῶν — «ожесточили шею свою более отцов своих» (σκληρύνω — делать жёстким); τοῦ μὴ ἀκοῦσαί μου — «чтобы не слушать Меня»; τοῦ μὴ δέξασθαι παιδείαν — «и не принять наказания (наставления)» (παιδεία). Слав. начинает стих с «и не услышаша, ни приклониша уха своего» (из конца gr 17:22) — деление держим по gr."
  24: "ἐὰν ἀκοῇ ἀκούσητέ μου — «если послушаете Меня» (усилительный оборот, букв. «слухом услышите»); τοῦ μὴ εἰσφέρειν βαστάγματα διὰ τῶν πυλῶν τῆς πόλεως ταύτης ἐν τῇ ἡμέρᾳ τῶν σαββάτων — «не вносить нош воротами города сего в день субботний»; ἁγιάζειν τὴν ἡμέραν τῶν σαββάτων — «святить день субботний»; τοῦ μὴ ποιεῖν πᾶν ἔργον — «не делать никакого дела». Стих — протасис условия, аподосис в 17:25; поэтому в тексте кончается на ならば、 (деление gr и слав. совпадает)."
  25: "εἰσελεύσονται διὰ τῶν πυλῶν… βασιλεῖς καὶ ἄρχοντες — «войдут воротами… цари и начальники»; καθήμενοι ἐπὶ θρόνου Δαυιδ — «сидящие на престоле Давида»; ἐπιβεβηκότες ἐφ᾽ ἅρμασιν καὶ ἵπποις αὐτῶν — «восходящие на колесницы и коней своих» (ἐπιβαίνω — восходить); αὐτοὶ καὶ οἱ ἄρχοντες αὐτῶν — «они и начальники их»; κατοικισθήσεται ἡ πόλις αὕτη εἰς τὸν αἰῶνα — «и будет обитаем город сей вовеки». Слав. «внидут… царие и началницы, седящии на престоле давидове… и обитати будут во граде сем во веки»."
  26: "ἥξουσιν ἐκ τῶν πόλεων Ιουδα καὶ κυκλόθεν Ιερουσαλημ — «придут из городов Иуды и окрестностей Иерусалима»; ἐκ γῆς Βενιαμιν — «из земли Вениаминовой»; ἐκ τῆς πεδινῆς — «с равнины (низменности)»; ἐκ τοῦ ὄρους — «с горы (нагорья)»; ἐκ τῆς πρὸς νότον — «с юга». φέροντες ὁλοκαυτώματα καὶ θυσίαν καὶ θυμιάματα καὶ μαναα καὶ λίβανον — «принося всесожжения и жертву и фимиам и мана (хлебный дар) и ливан»; μαναα — евр. минха, слав. транслитерирует «манау», в тексте 素祭; λίβανος — ладан, 乳香. φέροντες αἴνεσιν εἰς οἶκον κυρίου — «принося хвалу в дом Господень»; у ru (МТ) «благодарственные жертвы»."
  27: "ἐὰν μὴ εἰσακούσητέ μου τοῦ ἁγιάζειν τὴν ἡμέραν τῶν σαββάτων — «если не послушаете Меня святить день субботний»; τοῦ μὴ αἴρειν βαστάγματα — «не поднимать нош»; τοῦ μὴ εἰσπορεύεσθαι ταῖς πύλαις Ιερουσαλημ — «не входить воротами Иерусалима»; ἀνάψω πῦρ ἐν ταῖς πύλαις αὐτῆς — «зажгу огонь в воротах её»; καταφάγεται ἄμφοδα Ιερουσαλημ — «пожрёт кварталы Иерусалима» (ἄμφοδον — квартал, улица), слав. «пожрет домы Иерусалимли» — в тексте エルサレムの家々; οὐ σβεσθήσεται — «не угаснет» (σβέννυμι). Здесь закрываются 『…』 и 「…」."
