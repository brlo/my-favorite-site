# jp-box, 1-я Царств, глава 22. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc для книги нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 22: пещера Одоллам и четыреста спутников (1–2), родители у царя
# Моава (3–4), слово пророка Гада (5), Саул и его слуги (6–8), донос Доика
# (9–10), Ахимелек перед Саулом (11–15), приговор и избиение священников
# (16–19), спасение Авиафара (20–21), слова Давида (22–23).
# Речи — 「…」: Давид (3, 22–23), Гад (5), Саул (7–8, 12, 13, 16, 17, 18),
# Доик (9–10), Ахимелек (12, 14–15). Вложенной речи нет.
# Нумерация по gr совпадает со слав. (23 стиха).
# 〔…〕 нет: на месте всех стихов в gr-lxx-byz стоит текст, а не «.».
# Слав. добавления («да не возложиши, царю…» в 22:15 и др.) — в notes.
# Сносок ⟨…⟩ нет: オドラム, エフォド, 祭司, 預言者 уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: 1ts
chapter: 22
draft: true

verses:
  1: "ダビデはそこを去[さ]り、逃[に]げ延[の]びて、オドラムの洞窟[ほらあな]へ来[き]た。彼の兄弟[きょうだい]たちと父[ちち]の家[いえ]のすべての者[もの]がこれを聞[き]いて、そこへ下[くだ]って来[き]た。"
  2: "すべて苦[くる]しみの中[なか]にある者[もの]、すべて負債[ふさい]のある者[もの]、すべて魂[たましい]の苦[くる]しむ者[もの]が彼のもとに集[あつ]まって来[き]た。彼は彼らの頭[かしら]となった。彼とともにいる者[もの]は、およそ四百人[にん]であった。"
  3: "ダビデはそこからモアブのミツパへ行[い]き、モアブの王[おう]に言[い]った。「どうか、わたしの父[ちち]と母[はは]をあなたのもとに住[す]まわせてください。神[かみ]がわたしに何[なに]をしてくださるか分[わ]かるまで。」"
  4: "ダビデはモアブの王[おう]をなだめた。ダビデがその地方[ちほう]にいる間[あいだ]、両親[りょうしん]は王のもとに住[す]んだ。"
  5: "預言者[よげんしゃ]ガドはダビデに言[い]った。「この地方[ちほう]に留[とど]まらないで、行[い]ってユダの地[ち]へ入[はい]れ。」ダビデは行[い]って、サリクの町[まち]に住[す]んだ。"
  6: "サウルは、ダビデと彼とともにいる者[もの]たちの居場所[いばしょ]が知[し]られたと聞[き]いた。そのときサウルは、ラマの野[の]の下[した]の丘[おか]に座[すわ]り、手[て]に槍[やり]を持[も]ち、すべての僕[しもべ]たちが彼のそばに立[た]っていた。"
  7: "サウルはそばに立[た]つ僕[しもべ]たちに言[い]った。「聞[き]け、ベニヤミンの子[こ]らよ。エッサイの子[こ]は、あなたがたすべてに畑[はたけ]とぶどう畑[ばたけ]を与[あた]え、あなたがたすべてを百人[ひゃくにん]の長[かしら]、千人[せんにん]の長[かしら]にするだろうか。"
  8: "あなたがたはみな、わたしに逆[さか]らって結託[けつだく]している。わたしの息子[むすこ]がエッサイの子[こ]と契約[けいやく]を結[むす]んだとき、だれもわたしの耳[みみ]に告[つ]げる者[もの]がなく、あなたがたのうちに、わたしのために心[こころ]を痛[いた]めて耳に告げる者もいない。わたしの息子[むすこ]が、今日[きょう]見[み]るとおり、わたしの僕[しもべ]をわたしに逆らう敵[てき]として立[た]たせたのだから。」"
  9: "ドエグ・シリア人[じん]、サウルのらばの管理[かんり]を任[まか]されていた者[もの]が答[こた]えて言[い]った。「わたしは、エッサイの子[こ]がノブへ、祭司[さいし]アヒトブの子[こ]アヒメレクのもとへ来[き]るのを見[み]た。"
  10: "祭司[さいし]は彼のために神[かみ]に問[と]うた。そして食[た]べ物[もの]を与[あた]え、ゴリアト・ペリシテ人[じん]の剣[つるぎ]をも与えた。」"
  11: "王[おう]は人[ひと]を遣[つか]わして、アヒトブの子[こ]アヒメレクと、彼の父[ちち]の家[いえ]のすべての祭司[さいし]、すなわちノブにいる祭司たちを呼[よ]んだ。彼らはみな王のもとへ来[き]た。"
  12: "サウルは言[い]った。「聞[き]け、アヒトブの子[こ]よ。」彼は言[い]った。「はい。お話[はなし]ください、ご主人[しゅじん]様[さま]。」"
  13: "サウルは彼に言[い]った。「なぜ、あなたとエッサイの子[こ]は、わたしに逆[さか]らって結託[けつだく]したのか。なぜ彼にパンと剣[つるぎ]を与[あた]え、彼のために神[かみ]に問[と]うて、彼を今日[きょう]見[み]るとおり、わたしに逆らう敵[てき]として立[た]たせたのか。」"
  14: "アヒメレクは王[おう]に答えて言[い]った。「あなたのすべての僕[しもべ]のうち、だれがダビデのように忠実[ちゅうじつ]だろうか。彼は王[おう]の婿[むこ]であり、あなたのすべての命令[めいれい]の長[かしら]であり、あなたの家[いえ]で尊[とうと]ばれている者[もの]である。"
  15: "今日[きょう]、わたしが彼のために神[かみ]に問[と]い始[はじ]めたのだろうか。決[けっ]してそんなことはない。王[おう]よ、あなたの僕[しもべ]と、わたしの父[ちち]の家[いえ]のすべてに、このことを負[お]わせないでください。あなたの僕[しもべ]は、このすべてのことについて、小[ちい]さなことも大[おお]きなことも知[し]らなかったのだから。」"
  16: "王[おう]は言[い]った。「アヒメレク、あなたは必[かなら]ず死[し]ぬ。あなたも、あなたの父[ちち]の家[いえ]のすべての者[もの]も。」"
  17: "王[おう]は自分のそばに立[た]つ走[はし]り使[づかい]たちに言[い]った。「近[ちか]づいて、主[しゅ]の祭司[さいし]たちを殺[ころ]せ。彼らの手[て]はダビデとともにあり、彼が逃[に]げるのを知[し]りながら、わたしの耳[みみ]に告[つ]げなかったからだ。」しかし、王[おう]の僕[しもべ]たちは、主[しゅ]の祭司[さいし]たちに手[て]を下[くだ]そうとしなかった。"
  18: "王[おう]はドエグに言[い]った。「あなたが向[む]きを変[か]えて、祭司[さいし]たちに襲[おそ]いかかれ。」ドエグ・シリア人[じん]は向きを変えて、主[しゅ]の祭司[さいし]たちを殺[ころ]した。その日[ひ]、三百五[さんびゃくご]人[にん]が死[し]んだ。彼らはみなエフォドを着[き]ていた。"
  19: "ノブの町[まち]、祭司[さいし]たちの町を、彼は剣[つるぎ]の刃[は]にかけて撃[う]った。男[おとこ]から女[おんな]まで、幼児[ようじ]から乳[ち]を飲[の]む者[もの]まで、また牛[うし]もろばも羊[ひつじ]も。"
  20: "アヒメレクの子[こ]の一人[ひとり]だけが助[たす]かった。名[な]はアビアタルといい、彼はダビデの後[あと]を追[お]って逃[に]げた。"
  21: "アビアタルはダビデに、サウルが主[しゅ]の祭司[さいし]たちをすべて殺[ころ]したことを告[つ]げた。"
  22: "ダビデはアビアタルに言[い]った。「あの日[ひ]、あの場所[ばしょ]にドエグ・シリア人[じん]がいたとき、彼が必[かなら]ずサウルに告[つ]げると、わたしは知[し]っていた。わたしが、あなたの父[ちち]の家[いえ]のすべての命[いのち]の責任[せきにん]を負[お]っている。"
  23: "わたしのもとに留[とど]まれ。恐[おそ]れることはない。わたしの命[いのち]を求[もと]める者[もの]は、あなたの命をも求めるからだ。あなたはわたしのもとで守[まも]られる。」"

notes:
  1: "διεσώθη — спасся (διασῴζω). σπήλαιον τὸ Οδολλαμ — пещера Одолламская (オドラム). οἱ ἀδελφοὶ αὐτοῦ καὶ ὁ οἶκος τοῦ πατρός — братья его и дом отца его."
  2: "πᾶς ἐν ἀνάγκῃ — всякий в нужде; πᾶς ὑπόχρεως — всякий должник (ὑπόχρεως); πᾶς κατώδυνος ψυχῇ — всякий огорчённый душой (κατώδυνος). ἦν ἐπ᾿ αὐτῶν ἡγούμενος — был над ними вождём. ὡς τετρακόσιοι — около четырёхсот."
  3: "Μασσηφα τῆς Μωαβ — Массифа Моавитская (モアブのミツパ; не путать с ミツパ в Израиле). Γινέσθωσαν — да будут. ἕως ὅτου γνῶ — доколе не узнаю."
  4: "παρεκάλεσεν τὸ πρόσωπον τοῦ βασιλέως — «умолил лицо царя» (семитизм), т. е. уговорил, умилостивил. ἐν τῇ περιοχῇ — в области, убежище (περιοχή; слав. «во области»; ru «в убежище»)."
  5: "Μὴ κάθου — не сиди, не оставайся. Γαδ ὁ προφήτης — Гад пророк (ガド). ἥξεις εἰς γῆν Ιουδα — придёшь в землю Иудину. πόλις Σαριχ — город Сарих (サリク); в ru «лес Херет» (иное чтение)."
  6: "ἐν τῷ βουνῷ ὑπὸ τὴν ἄρουραν τὴν ἐν Ραμα — «на холме под полем [пашней] Рамы»; ἄρουρα — поле, пашня (слав. «под дубравою»; ru «под дубом» — иное понимание). τὸ δόρυ ἐν τῇ χειρί — копьё в руке. παρειστήκεισαν — предстояли (παρίστημι)."
  7: "υἱοὶ Βενιαμιν — сыны Вениамина (ベニヤミンの子ら). εἰ ἀληθῶς — неужели действительно. ἑκατοντάρχους καὶ χιλιάρχους — сотников и тысячников. Речь продолжается в ст. 8."
  8: "σύγκεισθε ἐπ᾿ ἐμέ — сговорились против меня (σύγκειμαι). τὸ ὠτίον μου — ухо моё. διαθέσθαι διαθήκην — заключить завет. πονῶν περὶ ἐμοῦ — болящий обо мне, т. е. сочувствующий. ἐπήγειρεν… εἰς ἐχθρόν — поднял как врага. ὡς ἡ ἡμέρα αὕτη — как [видно] в сей день."
  9: "Δωηκ ὁ Σύρος — Доик Сириянин (см. 21:8). ὁ καθεστηκὼς ἐπὶ τὰς ἡμιόνους — приставленный над мулами. παραγινόμενον — приходящего."
  10: "ἠρώτα αὐτῷ διὰ τοῦ θεοῦ — вопрошал о нём через Бога. ἐπισιτισμός — продовольствие. ῥομφαία Γολιαδ — меч Голиафа."
  11: "ἀπέστειλεν… καλέσαι — послал позвать. τοὺς υἱοὺς τοῦ πατρὸς αὐτοῦ — сынов отца его, т. е. весь род."
  12: "Ἄκουε δή — послушай же. Ἰδοὺ ἐγώ — вот я. λάλει, κύριε — говори, господин."
  13: "συνέθου — сговорился (συντίθημι). ἐρωτᾶν αὐτῷ διὰ τοῦ θεοῦ — вопрошать о нём Бога. θέσθαι αὐτὸν ἐπ᾿ ἐμὲ εἰς ἐχθρόν — поставить его против меня врагом."
  14: "πιστὸς — верный. γαμβρὸς τοῦ βασιλέως — зять царя. ἄρχων παντὸς παραγγέλματός σου — начальник всякого повеления твоего (слав. «князь всем заповедем твоим»). ἔνδοξος — славный, почтенный."
  15: "ἦ σήμερον ἦργμαι ἐρωτᾶν — разве сегодня я начал вопрошать. μηδαμῶς — никоим образом. μὴ δότω… λόγον — да не возложит [вины] (букв. «да не даст слова»); слав. «да не возложиши, царю…». ῥῆμα μικρὸν ἢ μέγα — ни малого, ни великого."
  16: "Θανάτῳ ἀποθανῇ — «смертью умрёшь» (гебраизм, усиление). πᾶς ὁ οἶκος τοῦ πατρός σου — весь дом отца твоего."
  17: "τοῖς παρατρέχουσιν — скороходам, телохранителям (παρατρέχω; слав. «скороходцем»). Προσαγάγετε — приступите. ἡ χεὶρ αὐτῶν μετὰ Δαυιδ — рука их с Давидом. οὐκ ἀπεκάλυψαν τὸ ὠτίον μου — не открыли уха моего. ἐπενεγκεῖν τὰς χεῖρας — наложить руки."
  18: "Ἐπιστρέφου σὺ — обратись ты. ἀπάντα εἰς τοὺς ἱερεῖς — напади на священников (ἀπαντάω). τριακοσίους καὶ πέντε — триста пять (в ru 85 — масоретское чтение). αἴροντας εφουδ — носящих ефод."
  19: "ἐν στόματι ῥομφαίας — устами меча. ἀπὸ ἀνδρὸς ἕως γυναικὸς — от мужа до жены. ἀπὸ νηπίου ἕως θηλάζοντος — от младенца до сосущего. μόσχος, ὄνος, πρόβατον — телёнок, осёл, овца."
  20: "διασῴζεται — спасается. υἱὸς εἷς — один сын. Αβιαθαρ — Авиафар (アビアタル). ἔφυγεν ὀπίσω Δαυιδ — убежал вслед Давида."
  21: "ἀπήγγειλεν — возвестил (ἀπαγγέλλω). ἐθανάτωσεν — умертвил."
  22: "Ἤιδειν — я знал (οἶδα). ἀπαγγέλλων ἀπαγγελεῖ — «возвещая возвестит» (усиление). ἐγώ εἰμι αἴτιος τῶν ψυχῶν — я виновен в душах, жизнях."
  23: "κάθου μετ᾿ ἐμοῦ — сиди, оставайся со мной. οὗ ἐὰν ζητῶ… τόπον — где бы я ни искал места [для] души моей. πεφύλαξαι σὺ παρ᾿ ἐμοί — ты сохранён у меня (φυλάσσω, перфект)."
