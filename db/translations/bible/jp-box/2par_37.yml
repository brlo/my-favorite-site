chapter: 37
draft: true

verses:
  1: "ユダの王[おう]マナセが、バビロンで捕[とら]われの身[み]となっていたときの祈[いの]り。「全能者[ぜんのうしゃ]である主[しゅ]よ、わたしたちの父[ちち]たちの神[かみ]、アブラハムとイサクとヤコブ、またその正[ただ]しい子孫[ししそん]の神[かみ]よ。あなたは天[てん]と地[ち]を、そのすべての美[うつく]しさとともに造[つく]られました。あなたが命[めい]じられた言葉[ことば]によって海[うみ]を縛[しば]り、深淵[しんえん]を閉[と]じ込[こ]めて、それを恐[おそ]るべき、栄[えい]光[こう]ある御名[みな]で封[ふう]じられました。すべてのものはその御名[みな]を恐[おそ]れ、あなたの力[ちから]の前[まえ]に震[ふる]えます。"
  2: "あなたの栄光[えいこう]の輝[かがや]きの前[まえ]には、だれも立[た]つことができません。あなたの怒[いか]りのこもった叱[しか]りは、"
  3: "罪[つみ]人[びと]に向[む]けられ、耐[た]えがたいものです。"
  4: "しかし、あなたの約束[やくそく]の憐[あわ]れみは、量[はか]り知[し]れず、究[きわ]め尽[つ]くせません。あなたこそ、いと高[たか]き主[しゅ]、深[ふか]い慈[いつく]しみに満[み]ち、怒[いか]りをおそくし、多[おお]くの憐[あわ]れみに富[と]み、人[ひと]の悪[あく]を思[おも]い直[なお]される方[かた]です。主[しゅ]よ、あなたはその豊[ゆた]かな慈[いつく]しみによって、"
  5: "あなたに罪[つみ]を犯[おか]した者[もの]たちに悔[く]い改[あらた]めと赦[ゆる]しを約束[やくそく]し、あなたの憐[あわ]れみの多[おお]さによって、罪[つみ]人[びと]が救[すく]いに至[いた]る悔[く]い改[あらた]めを定[さだ]められました。それゆえ、万軍[ばんぐん]の神[かみ]である主[しゅ]よ、"
  6: "あなたに罪[つみ]を犯[おか]さなかった正[ただ]しい者[もの]たち、アブラハムとイサクとヤコブには悔[く]い改[あらた]めを定[さだ]めず、この罪[つみ]深[ぶか]いわたしに悔[く]い改[あらた]めを定[さだ]められました。"
  7: "わたしは海[うみ]の砂[すな]の数[かず]よりも多[おお]く罪[つみ]を犯[おか]しました。主[しゅ]よ、わたしの不法[ふほう]は増[ふ]えに増[ふ]えました。わたしは不正[ふせい]の多[おお]さのゆえに、天[てん]の高[たか]さに目[め]を上[あ]げることも、それを見[み]ることもできません。"
  8: "わたしは多[おお]くの鉄[てつ]の鎖[くさり]で身[み]をかがめられ、頭[あたま]を上[あ]げることもできません。わたしには何[なに]の安[やす]らぎもありません。あなたの激怒[げきど]を引[ひ]き起[おこ]し、"
  9: "あなたの前[まえ]に悪[あく]を行[おこな]ったからです。あなたの御心[みこころ]を行[おこな]わず、あなたの戒[いまし]めを守[まも]らなかったわたしは、忌[い]まわしいものどもを置[お]き、つまずきを増[ふ]やしました。"
  10: "今[いま]、わたしは心[こころ]の膝[ひざ]をかがめて、あなたに恵[めぐ]みを願[ねが]い求[もと]めます。主[しゅ]よ、わたしは罪[つみ]を犯[おか]しました。罪[つみ]を犯[おか]しました。わたしの不法[ふほう]を、このわたしが知[し]っています。ですが、祈[いの]りつつお願[ねが]いします。主[しゅ]よ、わたしを赦[ゆる]してください。わたしを赦[ゆる]してください。わたしの不法[ふほう]とともに、わたしを滅[ほろ]ぼさないでください。とこしえに怒[いか]りを抱[いだ]いて、わたしの悪[あく]を蓄[たくわ]えておかないでください。地[ち]の底[そこ]にわたしを落[おと]さないでください。神[かみ]よ、あなたは悔[く]い改[あらた]める者[もの]の神[かみ]ですから、あなたの恵[めぐ]みのすべてをわたしの上[うえ]に示[しめ]してくださいます。ふさわしくないわたしを、あなたの大[おお]いなる憐[あわ]れみによって救[すく]ってくださるからです、"
  11: "わたしは命[いのち]のある日[ひ]々[び]、絶[た]えずあなたをほめたたえます。天[てん]の軍[ぐん]勢[せい]のすべてがあなたをほめ歌[うた]い、栄[えい]光[こう]は世[よ]々[よ]にあなたのものだからです。アーメン。」"

notes:
  1: "Заглавие-рубрика: «Молитва манассии царя иудейска, егда пленен держашеся во вавилоне» — «когда он содержался в плену в Вавилоне» (держатися — быть держиму), ср. 2 Пар 33:11. Далее: «Господи вседержителю» — 全能者である主 (παντοκράτωρ в корпусе — 全能者); «Боже отец наших, авраамов и исааков и иаковль и семене их праведнаго» — притяжательные прилагательные, «семя» — потомство (子孫); «сотворивый небо и землю со всею лепотою их» — «лепота» = красота, убранство; «связавый море словом повеления твоего» — ср. Иов 38:8–11, Притч 8:29; «заключивый бездну и запечатствовавый ю страшным и славным именем твоим» — «запечатствовать» = запечатать, «ю» = её (бездну), 深淵; в ru «запечатавший ее страшным и славным именем Твоим»; «егоже вся боятся» — относительное к «имя», отсюда その御名. Стих в слав. обрывается на запятой («...от лица силы твоея,»), продолжение — ст. 2, поэтому и в японском он кончается точкой, а связь («яко») уходит в следующий стих."
  2: "«яко никтоже постоит пред великолепием славы твоея» — «постоит» = устоит; «великолепие славы» — 栄光の輝き; «и нестерпимь гнев,» — «нестерпим» = невыносим. В слав. «гнев» закрывает 2-й стих, а его определение («еже на грешники, прещения твоего») открывает 3-й; в японском словосочетание не разорвано: ст. 2 кончается на 「あなたの怒りのこもった叱りは、」, а «нестерпим» (耐えがたい) отнесено к ст. 3. «прещение» = гроза, грозное запрещение; в корпусе передаётся 叱り (ср. Пс 75:7; 3 Езд 16:11)."
  3: "«еже на грешники, прещения твоего» — «еже» = которое (относится к «гнев»), т. е. «гнев, который на грешников». Стих в слав. — обрывок фразы из ст. 2, поэтому в японском он её продолжает: 罪人に向けられ、耐えがたいものです."
  4: "«Безмерна же и неизследованна милость обещания твоего» — «безмерна» = неизмерима, «неизследованна» = непостижима, неисследима; «ты бо еси Господь, вышний» — いと高き主; «благоутробен» — глубоко милосерд (深い慈しみ); «долготерпелив» — 怒りをおそくし (как в корпусе для μακρόθυμος); «многомилостив» — 多くの憐れみに富む; «каяйся о злобах человеческих» — по формуле Иоиль 2:13 («災いを思い直される»): Бог отменяет Своё определение; «злобы» здесь — грехи людей, поэтому 人の悪を思い直される (смысл: не воздаёт по грехам). Слав. стих кончается на «Ты, Господи, по множеству благости твоея» — продолжение в ст. 5."
  5: "«обещал еси покаяние и оставление согрешившым тебе» — «оставление» = прощение (赦し); «и множеством щедрот твоих определил еси покаяние грешником во спасение» — «определил» = положил, установил, «щедроты» = щедроты, 憐れみ; «Ты убо, Господи Боже сил» — «Боже сил» в корпусе передаётся 万軍の神 (Пс 58:5; 79:5; 3 Цар 17:1), отсюда 万軍の神である主. В ru здесь иное чтение: «Ты, Господи, Боже праведных»; держим слав., вариант отмечен. Стих кончается обращением, продолжение — ст. 6."
  6: "«не положил еси покаяние праведным аврааму и исааку и иакову, не согрешившым тебе» — «положити» = установить, назначить; «не согрешившым тебе» — не согрешившим пред Тобою (дат. п.); «но положил еси покаяние мне грешному» — «мне грешному» дат. п. при «положил еси», отсюда この罪深いわたしに. Мысль: покаяние положено не праведным, а грешникам."
  7: "«зане согреших паче числа песка морскаго» — «зане» = ибо; сравнение с песком морским (ср. Быт 22:17; Пс 138:18); «умножишася беззакония моя, Господи, умножишася беззакония моя» — повтор дважды, с «Господи» внутри; повтор сохранён (増えに増えました); «и несмь достоин воззрети и видети высоту небесную» — два глагола («воззрети» и «видети») переданы оба: 目を上げることも、それを見ることも; «от множества неправд моих» — «неправда» = неправда, беззаконие (不正)."
  8: "«Слячен есмь многими узами железными» — «слячен» от «сляцати» — согбен, согнут (не «связан»): 身をかがめられ; «узы железные» — железные оковы (鉄の鎖); «во еже не возвести главы моея» — чтобы не поднять головы; «и несть ми ослабления» — нет мне облегчения, отдохновения (в ru «нет мне отдохновения»); «зане прогневах ярость твою» — «прогневати ярость» = возбудить гнев (激怒を引き起こし). Стих обрывается, «и лукавое пред тобою сотворих» — уже ст. 9."
  9: "«и лукавое пред тобою сотворих» — «лукавое» = злое (悪); «не сотворивый воли твоея и не сохранивый повелений твоих» — причастия при «аз» (я, не исполнивший): あなたの御心を行わず、あなたの戒めを守らなかったわたし; «поставих мерзости и умножих претыкания» — «мерзости» = мерзости (идольские), 忌まわしいものども; «претыкания» = преткновения, соблазны (つまずき); ср. 2 Пар 33:2–9, где те же слова о грехах Манасеи."
  10: "«И ныне приклоняю колена сердца» — «колена сердца» — образ смирения (ср. 2 Пар 6:13; Дан 6:11): 心の膝をかがめて; «требуя от тебе благости» — «требуя» = прося, домогаясь; «Согреших, Господи, согреших» — повтор сохранён; «и беззакония моя аз вем» — эмфатическое «аз» (не просто «знаю», а «я сам знаю»): このわたしが知っています; «но прошу моляся» — 祈りつつお願いします; «ослаби ми, Господи, ослаби ми» — «ослабити» = ослабить, отпустить (узы, долг), передано 赦してください (букв. «ослабь, отпусти»); «ниже в век враждовав соблюдеши зол моих» — «ниже» = и не, «враждовав» = враждуя, «соблюдеши зол моих» — слав. букв. «сохранишь зла мои» (ср. Иов 14:17), смысл: не храни зла для суда, не откладывай возмездия — 蓄えておかないでください; в ru этой клаузы нет; «ниже осудиши мя в преисподних земли» — «осудиши» = осудишь, «преисподняя земли» = шеол; передано 地の底に落とさないでください (не осуди на низведение в шеол); «Бог кающихся» — 悔い改める者の神; «и на мне явиши всю благость твою» — явишь на мне всю благость; «яко недостойна суща спасеши мя по мнозей милости твоей» — «недостойна суща» = будучи недостойным. Стих обрывается на запятой, продолжение — ст. 11."
  11: "«и восхвалю тя выну во днех живота моего» — «выну» = всегда, непрестанно (絶えず); «яко тя поет вся сила небесная» — «сила небесная» = небесное воинство, 天の軍勢 (ср. Пс 148:2: 主のすべての軍勢 для δυνάμεις); «и твоя есть слава во веки веков» — 栄光は世々にあなたのもの; «Аминь» — アーメン, конец молитвы (закрывает 「…」)."
