# jp-box, 2-я Паралипоменон, глава 37 — «Молитва Манассии, царя Иудейского».
# Черновик для приёмки.
#
# ВАЖНО: в славянской и Синодальной традиции после 2 Пар 36 стоит «Молитва
# Манассии, царя Иудейского» (11 стихов). Отдельной книги в нашем каноне для неё
# нет, поэтому по решению автора она включена главой 37 книги 2 Паралипоменон.
# В `csl-ru` она так и лежит — 2 Пар 37, 11 стихов; в `csl-pnm` тот же текст стоит
# одним стихом в конце 2 Пар 36 (36:24), чтения совпадают.
# Греческого текста в базе нет: у 2 Пар 36 глав и в `gr-lxx-byz`, и в
# `gr-lxx-swete`, и в `gr-ru` — это славянское добавление (перевод греческой
# «Молитвы Манассии» по Александрийскому кодексу в модули не входит). В `ru`
# (Синодальном) молитва есть, но одним стихом — 2 Пар 36:24, без деления на
# стихи; по нему только понимание смысла, его чтения в текст не вносились
# (расхождения отмечены в notes). Поэтому база — `csl-ru`: и текст, и деление
# на стихи. `jp-joc` молитвы нет; `jp-ni` этой главы не имеет (в `sim_jp`
# 0 сравнений).
# 〔…〕 не ставим: скобки отмечают добавку к LXX, а здесь LXX нет вовсе.
# Язык: заглавие-рубрика в ст. 1 (до кавычек) — 常体; сама молитва — です・ます,
# как молитвы в корпусе (2 Пар 6:14–42, Дан 9:4–19, Тов 3).
# Кавычки: вся молитва — одна цитата 「…」 (открывается в ст. 1 после заглавия,
# закрывается в конце ст. 11). Вложенной речи нет, 『…』 не понадобились.
# Деление на стихи — по `csl-ru`, и оно проходит посреди фраз: 1→2, 2→3, 4→5,
# 5→6, 8→9, 10→11. Фразы из-за этого не перестроены: стих кончается там же, где
# у слав. (без точки — на 「、」 или на 連用中止), продолжение — в следующем стихе.
# Сносок ⟨…⟩ нет: 全能者, 栄光, 御名, 深淵, 悔い改め, 赦し, 万軍の神, 不法,
# 憐れみ, アーメン уже в корпусе или понятны. Красного нет.
# Имена: マナセ (2 Пар 33), アブラハム, イサク, ヤコブ (1 Пар 29:18).
#
# Содержание: 1 заглавие и обращение — Вседержитель, Бог отцов, Творец неба
# и земли, связавший море и запечатавший бездну Своим именем; 1–2 всё трепещет
# пред Ним; 2–3 никто не устоит пред славою, гнев прещения на грешников
# невыносим; 4 безмерна и неисследима милость обетования, Он — Вышний,
# благоутробный, долготерпеливый, многомилостивый, «каяйся о злобах
# человеческих»; 5–6 покаяние и оставление обещано согрешившим, покаяние
# грешникам «во спасение», а праведным (Аврааму, Исааку, Иакову) не положено —
# положено «мне грешному»; 7 согрешил паче песка морского, недостоин воззреть
# на высоту небесную; 8–9 согбен многими железными узами, нет ослабления,
# прогневал ярость, поставил мерзости и умножил претыкания; 10 преклоняет
# колена сердца, «ослаби ми», «не погуби», «Бог кающихся»; 11 хвала непрестанно,
# «вся сила небесная» поёт, слава во веки веков, «Аминь».
# Голос один — молящийся царь Манасея; других речей нет.
#
