# jp-box, Второе соборное послание Петра, глава 3. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 3: второе напоминание (1–2), насмешники последних дней (3–4),
# вода и огонь — слово Божие (5–7), день Господень как тать (8–10),
# ожидание нового неба и новой земли (11–13), Павел и невежды (14–16),
# последнее увещание и славословие (17–18).
# Красного и синего нет: прямой речи Христа и Богородицы в главе нет.
# Прямая речь и Писание в 「…」, без красного: 3:4 — речь насмешников; 3:5–7 — рассуждение
# самого Петра, поэтому без кавычек (Быт 1:6–9 и потоп — в notes); 3:8 (Пс 90:4 — перифраз), 3:13 (Ис 65:17).
# 〔…〕 в главе нет: 3:10 — замена чтения (в базе εὑρεθήσεται «будут найдены», церковный
# текст читает κατακαήσεται «сгорят»); замены даются церковной формой без 〔〕
# (проверено по базе: ευρεθησεται — ЕСТЬ, κατακαησεται — НЕТ).
# Сносок ⟨…⟩ в главе нет. 3:18 ἀμήν в базе есть (в квадратных скобках) — アーメン оставлен.
# jp-ni не использовался.

