verses:
  1: "愛[あい]する者[もの]たちよ、わたしは今[いま]、あなたがたに第二[だいに]の手紙[てがみ]を書[か]いている。そのどちらにおいても、思[おも]い起[おこ]こさせることによって、あなたがたの清[きよ]らかな心[こころ]を目覚[めざ]めさせようとしている。"
  2: "聖[せい]なる預言者[よげんしゃ]たちが前[まえ]もって語[かた]った言葉[ことば]と、あなたがたの使徒[しと]たちを通[とお]して伝[つた]えられた、主[しゅ]であり救[すく]い主[ぬし]であるイエス・キリストの戒[いまし]めとを、思[おも]い起[おこ]こすためである。"
  3: "まず、終[お]わりの日[ひ]に、自分[じぶん]の欲[よく]に従[したが]って歩[あゆ]む嘲[あざけ]る者[もの]たちが来[く]ることを、知[し]っておきなさい。"
  4: "そして、「この方[かた]の来臨[らいりん]の約束[やくそく]は、どこにあるのか。父[ちち]たちが眠[ねむ]ってからというもの、すべてのものは創造[そうぞう]の初[はじ]めからあるままではないか」と言[い]う。"
  5: "彼[かれ]らは、次[つぎ]のことをわざと見[み]のがしている。天[てん]は昔[むかし]からあり、地[ち]は水[みず]から、また水[みず]をとおして、神[かみ]の言葉[ことば]によって成[な]り立[た]っていた。"
  6: "それによって、その時[とき]の世[よ]は、水[みず]に覆[おお]われて滅[ほろ]びた。"
  7: "しかし、今[いま]の天[てん]と地[ち]は、同[おな]じ言葉[ことば]によって、火[ひ]のために取[と]っておかれ、不敬虔[ふけいけん]な人[ひと]々[びと]の裁[さば]きと滅[ほろ]びの日[ひ]まで守[まも]られている。"
  8: "しかし、愛[あい]する者[もの]たちよ、この一[ひと]つのことを忘[わす]れてはならない。「主[しゅ]の前[まえ]では、一日[いちにち]は千年[せんねん]のようであり、千年[せんねん]は一日[いちにち]のようである。」"
  9: "主[しゅ]は、その約束[やくそく]を果[は]たすのに遅[おそ]いのではない。ある人[ひと]々[びと]が遅[おそ]いと考[かんが]えているだけである。あなたがたに対[たい]して忍耐[にんたい]しておられるのである。一人[ひとり]も滅[ほろ]びず、すべての者[もの]が悔[く]い改[あらた]めに至[いた]ることを望[のぞ]んでおられるからである。"
  10: "しかし、主[しゅ]の日[ひ]は盗人[ぬすびと]のように来[く]る。その日[ひ]には、天[てん]は大[おお]きな響[ひび]きを立[た]てて過[す]ぎ去[さ]り、諸元素[しょげんそ]は燃[も]えて溶[と]け、地[ち]と、その上[うえ]にある業[わざ]は焼[や]き尽[つ]くされる。"
  11: "このように、これらすべてが溶[と]けてなくなるのだから、あなたがたは、聖[せい]なる行[おこな]いと敬虔[けいけん]のうちに、どのような者[もの]であるべきであろうか。"
  12: "神[かみ]の日[ひ]が来[く]るのを待[ま]ち望[のぞ]み、その日[ひ]を早[はや]める者[もの]として。そのために、天[てん]は燃[も]えて溶[と]け、諸元素[しょげんそ]は焼[や]けて解[と]けるのである。"
  13: "しかし、わたしたちは、この方[かた]の約束[やくそく]に従[したが]って、「新[あたら]しい天[てん]と新[あたら]しい地[ち]」を待[ま]ち望[のぞ]んでいる。そこには義[ぎ]が住[す]んでいる。"
  14: "だから、愛[あい]する者[もの]たちよ、あなたがたはこれらのことを待[ま]ち望[のぞ]んでいるのだから、汚[けが]れも傷[きず]もない者[もの]として、平和[へいわ]のうちに、この方[かた]の前[まえ]に現[あらわ]れるように努[つと]めなさい。"
  15: "また、わたしたちの主[しゅ]の忍耐[にんたい]を救[すく]いと考[かんが]えなさい。愛[あい]する兄弟[きょうだい]パウロも、自分[じぶん]に与[あた]えられた知恵[ちえ]に従[したが]って、あなたがたに書[か]いているとおりである。"
  16: "そのすべての手紙[てがみ]のどこにおいても、これらのことについて語[かた]っている。その中[なか]には難[むずか]しいところがあり、無学[むがく]で心[こころ]の定[さだ]まらない者[もの]たちが、ほかの聖書[せいしょ]に対[たい]するのと同[おな]じように、それを曲[ま]げて解[と]き、自分[じぶん]の滅[ほろ]びを招[まね]いているのである。"
  17: "あなたがたは、愛[あい]する者[もの]たちよ、あらかじめこれを知[し]って、無[む]法[ほう]な者[もの]たちの迷[まよ]いに誘[さそ]い込[こ]まれて、自分[じぶん]の堅[かた]い立[た]ち場[ば]を失[うしな]わないように、身[み]を慎[つつし]みなさい。"
  18: "あなたがたは、わたしたちの主[しゅ]であり救[すく]い主[ぬし]であるイエス・キリストの恵[めぐ]みと知識[ちしき]とにおいて成[せい]長[ちょう]しなさい。栄光[えいこう]が、今[いま]も、永遠[えいえん]の日[ひ]にも、この方[かた]にありますように。アーメン。"

notes:
  1: "Ταύτην ἤδη…δευτέραν ὑμῖν γράφω ἐπιστολήν — 今、あなたがたに第二の手紙を書いている (ἐπιστολή — 手紙). ἐν αἷς διεγείρω ὑμῶν…τὴν εἰλικρινῆ διάνοιαν — そのどちらにおいても、…清らかな心を目覚めさせようとしている (εἰλικρινής — «чистый, неподдельный»; διάνοια — 心). ἐν ὑπομνήσει — 思い起こさせることによって."
  2: "μνησθῆναι — 思い起こすためである (inf. цели при глаголе ст. 1). τῶν προειρημένων ῥημάτων ὑπὸ τῶν ἁγίων προφητῶν — 聖なる預言者たちが前もって語った言葉. τῆς τῶν ἀποστόλων ὑμῶν ἐντολῆς τοῦ κυρίου καὶ σωτῆρος — あなたがたの使徒たちを通して伝えられた、主であり救い主である…の戒め («заповедь Господа и Спасителя, данная через ваших апостолов»)."
  3: "τοῦτο πρῶτον γινώσκοντες — まず…知っておきなさい (прич. в значении императива, ср. 2 Пет 1:20). ἐλεύσονται ἐπ᾿ ἐσχάτων τῶν ἡμερῶν — 終わりの日に…来る. ἐν ἐμπαιγμονῇ ἐμπαῖκται — 嘲る者たち (ἐμπαιγμός — «насмешка»). κατὰ τὰς ἰδίας ἐπιθυμίας αὐτῶν πορευόμενοι — 自分の欲に従って歩む."
  4: "Ποῦ ἐστιν ἡ ἐπαγγελία τῆς παρουσίας αὐτοῦ — この方の来臨の約束はどこにあるのか (речь насмешников — в 「」). ἀφ᾿ ἧς γὰρ οἱ πατέρες ἐκοιμήθησαν — 父たちが眠ってからというもの (κοιμάω — «почивать», эвфемизм смерти). πάντα οὕτως διαμένει ἀπ᾿ ἀρχῆς κτίσεως — すべてのものは創造の初めからあるまま (διαμένω — «пребывать»)."
  5: "λανθάνει γὰρ αὐτοὺς τοῦτο θέλοντας — 彼らは次のことをわざと見のがしている (λανθάνω — «ускользать от внимания»; θέλοντας — «желая», т. е. намеренно). οὐρανοὶ ἦσαν ἔκπαλαι — 天は昔からあり. γῆ ἐξ ὕδατος καὶ δι᾿ ὕδατος συνεστῶσα — 地は水から、また水をとおして成り立っていた (Быт 1:6–9). τῷ τοῦ θεοῦ λόγῳ — 神の言葉によって."
  6: "δι᾿ ὧν — «через что» (через воду и слово). ὁ τότε κόσμος ὕδατι κατακλυσθεὶς ἀπώλετο — その時の世は水に覆われて滅びた (κατακλύζω — «затоплять»; Быт 7)."
  7: "οἱ δὲ νῦν οὐρανοὶ καὶ ἡ γῆ — 今の天と地. τῷ αὐτῷ λόγῳ τεθησαυρισμένοι εἰσὶν πυρί — 同じ言葉によって、火のために取っておかれ (θησαυρίζω — «откладывать, хранить»). τηρούμενοι εἰς ἡμέραν κρίσεως καὶ ἀπωλείας τῶν ἀσεβῶν ἀνθρώπων — 不敬虔な人々の裁きと滅びの日まで守られている. Свидетельство 5–7 — одна речь в 「」."
  8: "Ἓν δὲ τοῦτο μὴ λανθανέτω ὑμᾶς — この一つのことを忘れてはならない. μία ἡμέρα παρὰ κυρίῳ ὡς χίλια ἔτη — 主の前では、一日は千年のようであり. καὶ χίλια ἔτη ὡς ἡμέρα μία — 千年は一日のようである (Пс 90:4; ср. 2 Пет 3:8). Перифраз псалма — в 「」, не красное."
  9: "οὐ βραδύνει κύριος τῆς ἐπαγγελίας — 主は約束を果たすのに遅いのではない (βραδύνω — «медлить»). ὥς τινες βραδύτητα ἡγοῦνται — ある人々が遅いと考えているだけ. μακροθυμεῖ εἰς ὑμᾶς — あなたがたに対して忍耐しておられる (μακροθυμέω — «долготерпеть»). μὴ βουλόμενός τινας ἀπολέσθαι — 一人も滅びず…ことを望んでおられる. εἰς μετάνοιαν χωρῆσαι — 悔い改めに至る."
  10: "Ἥξει δὲ ἡμέρα κυρίου ὡς κλέπτης — 主の日は盗人のように来る (ср. 1 Сол 5:2; Мф 24:43). οἱ οὐρανοὶ ῥοιζηδὸν παρελεύσονται — 天は大きな響きを立てて過ぎ去る (ῥοιζηδόν — «с грохотом, с шипением»). στοιχεῖα δὲ καυσούμενα λυθήσεται — 諸元素は燃えて溶ける (στοιχεῖα — 諸元素). καὶ γῆ καὶ τὰ ἐν αὐτῇ ἔργα — 地と、その上にある業. В базе εὑρεθήσεται («будут найдены»); церковный текст (Елизаветинская «сгорят», jp-joc「焚け盡きん») читает κατακαήσεται — 焼き尽くされる. Это замена, а не добавка, поэтому без 〔〕 (проверено по базе: ευρεθησεται — ЕСТЬ, κατακαησεται — НЕТ)."
  11: "τούτων οὕτως πάντων λυομένων — このように、これらすべてが溶けてなくなるのだから (λύω — «разрушать, растворять»). ποταποὺς δεῖ ὑπάρχειν ὑμᾶς — どのような者であるべきか (ποταπός — «какого рода»). ἐν ἁγίαις ἀναστροφαῖς καὶ εὐσεβείαις — 聖なる行いと敬虔のうちに (мн. ч.: «святые поведения и благочестия»)."
  12: "προσδοκῶντας καὶ σπεύδοντας — 待ち望み、早める者として (σπεύδω — «ускорять, спешить»). τὴν παρουσίαν τῆς τοῦ θεοῦ ἡμέρας — 神の日の来ること. δι᾿ ἣν οὐρανοὶ πυρούμενοι λυθήσονται — その日のために、天は燃えて溶ける. στοιχεῖα καυσούμενα τήκεται — 諸元素は焼けて解ける (τήκω — «плавить»)."
  13: "καινοὺς δὲ οὐρανοὺς καὶ γῆν καινὴν κατὰ τὸ ἐπάγγελμα αὐτοῦ προσδοκῶμεν — この方の約束に従って、「新しい天と新しい地」を待ち望んでいる (Ис 65:17; 66:22; Откр 21:1). ἐν οἷς δικαιοσύνη κατοικεῖ — そこには義が住んでいる (κατοικέω — «обитать»)."
  14: "ταῦτα προσδοκῶντες σπουδάσατε — これらのことを待ち望んでいるのだから、努めなさい. ἄσπιλοι καὶ ἀμώμητοι — 汚れも傷もない者 (ἄσπιλος — «незапятнанный», ἀμώμητος — «непорочный»). αὐτῷ εὑρεθῆναι ἐν εἰρήνῃ — この方の前に…平和のうちに現れる (εὑρίσκω в pass. — «оказаться»)."
  15: "τὴν τοῦ κυρίου ἡμῶν μακροθυμίαν σωτηρίαν ἡγεῖσθε — 主の忍耐を救いと考えなさい. ὁ ἀγαπητὸς ἡμῶν ἀδελφὸς Παῦλος — 愛する兄弟パウロ. κατὰ τὴν δοθεῖσαν αὐτῷ σοφίαν — 自分に与えられた知恵に従って."
  16: "ὡς καὶ ἐν πάσαις ἐπιστολαῖς λαλῶν — その手紙のどこにおいても…語っている (λαλῶν относится к Павлу). δυσνόητά τινα — 難しいところ (δυσνόητος — «труднопонимаемый»). οἱ ἀμαθεῖς καὶ ἀστήρικτοι στρεβλοῦσιν — 無学で心の定まらない者たちが曲げて解く (στρεβλόω — «выкручивать, искажать»). ὡς καὶ τὰς λοιπὰς γραφάς — ほかの聖書に対するのと同じように. πρὸς τὴν ἰδίαν αὐτῶν ἀπώλειαν — 自分の滅びを招いて."
  17: "προγινώσκοντες φυλάσσεσθε — あらかじめ知って、身を慎みなさい. τῇ τῶν ἀθέσμων πλάνῃ συναπαχθέντες — 無法な者たちの迷いに誘い込まれて (συναπάγω — «увлекать вместе»). ἐκπέσητε τοῦ ἰδίου στηριγμοῦ — 自分の堅い立ち場を失う (στηριγμός — «утверждение, опора»)."
  18: "αὐξάνετε δὲ ἐν χάριτι καὶ γνώσει — 恵みと知識とにおいて成長しなさい (αὐξάνω — «возрастать»). τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ — 主であり救い主であるイエス・キリストの. αὐτῷ ἡ δόξα καὶ νῦν καὶ εἰς ἡμέραν αἰῶνος — 栄光が、今も、永遠の日にも、この方に (εἰς ἡμέραν αἰῶνος — «в день века»; ср. Елизаветинская «в день века»). [ἀμήν] в базе есть (в квадратных скобках) — アーメン оставлен, 〔〕 не ставятся."
