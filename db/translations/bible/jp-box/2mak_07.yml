# третьего — 「…」; 14 четвёртого — 「…」; 16–17 пятого — 「…」;
# 18–19 шестого — 「…」; 22–23 слово матери — 「…」; 27–29 её слово младшему —
# 「…」; 30–38 ответ юноши — 「…」. Формулы «говоря» — вне кавычек.
