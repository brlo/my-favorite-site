verses:
  1: "また、七人[しちにん]の兄弟[きょうだい]と母[はは]が捕[と]らえられ、王[おう]によって禁[きん]じられた豚[ぶた]の肉[にく]を口[くち]にするように強[し]いられた。彼らはむちと牛[ぎゅう]の腱[けん]で責[せ]められたのである。"
  2: "その一人[ひとり]が彼らの代弁者[だいべんしゃ]となって、こう言[い]った。「あなたはわたしたちに何[なに]を問[と]い、何[なに]を知[し]ろうとするのか。わたしたちは父[ちち]たちの律法[りっぽう]を犯[おか]すよりも、死[し]ぬ覚悟[かくご]ができている。」"
  3: "王[おう]は怒[いか]りに燃[も]えて、大[おお]きな鍋[なべ]と釜[かま]を熱[あつ]くするように命[めい]じた。"
  4: "それらがすぐに熱[あつ]くされると、王[おう]は彼らの代弁者[だいべんしゃ]の舌[した]を切[き]り、頭[あたま]の皮[かわ]を髪[かみ]ごと剥[は]ぎ、残[のこ]りの兄弟[きょうだい]たちと母[はは]が見[み]ている前[まえ]で、その手足[てあし]を切[き]り落[お]とすように命[めい]じた。"
  5: "彼[かれ]がすっかり役[やく]に立[た]たなくなると、まだ息[いき]のあるうちに火[ひ]の上[うえ]へ運[はこ]び、鍋[なべ]で焼[や]くように命[めい]じた。鍋[なべ]から多[おお]くの蒸気[じょうき]が立[た]ち上[のぼ]ると、彼らは母[はは]とともに互[たが]いに、勇[いさ]ましく死[し]ぬように勧[すす]め合[あ]って、こう言[い]った。"
  6: "「主[しゅ]である神[かみ]はご覧[らん]になっておられ、真[しん]実[じつ]にわたしたちのゆえに慰[なぐさ]めを受[う]けられます。モーセが顔[かお]を向[む]けて証[あかし]する歌[うた]の中で明[あき]らかにしたとおりです。『主[しゅ]はその僕[しもべ]たちのゆえに慰[なぐさ]めを受[う]けられる』と。」"
  7: "このようにして最初[さいしょ]の者[もの]が世[よ]を去[さ]ると、彼らは次[つぎ]の者[もの]を嘲[あざけ]りのために連[つ]れて行[い]き、頭[あたま]の皮[かわ]を髪[かみ]ごと引きむしって、尋[たず]ねた。「体[からだ]を一[ひと]つ一[ひと]つ責[せ]められる前[まえ]に、食[た]べるか。」"
  8: "彼[かれ]は父[ちち]たちの言葉[ことば]で答[こた]えて言[い]った。「いいえ。」それゆえ、この者[もの]も最初[さいしょ]の者[もの]と同じように次[つぎ]の責[せめ]苦[くる]しみを受[う]けた。"
  9: "そして、息[いき]が絶[た]えようとするとき、彼[かれ]は言[い]った。「あなたは、破滅[はめつ]をもたらす者[もの]よ、わたしたちを今[いま]の命[いのち]から断[た]ち切[き]る。しかし世[よ]の王[おう]は、その律法[りっぽう]のために死[し]んだわたしたちを、永遠[えいえん]の命[いのち]への復活[ふっかつ]によみがえらせてくださる。」"
  10: "この者[もの]の次[つぎ]に、三人目[さんにんめ]が嘲[あざけ]られた。舌[した]を求[もと]められるとすぐに差[さ]し出[だ]し、両手[りょうて]を大胆[だいたん]に差[さ]し伸[の]べて、"
  11: "勇[いさ]ましく言[い]った。「わたしはこれらを天[てん]から受[う]け取[と]った。その律法[りっぽう]のゆえに、これらを軽[かろ]んじる。そして、神[かみ]から再[ふたた]びこれらを受[う]け取[と]ることを望[のぞ]んでいる。」"
  12: "王[おう]自身[じしん]も、ともにいる者[もの]たちも、この若者[わかもの]の魂[たましい]に驚[おどろ]いた。彼[かれ]が苦痛[くつう]を何[なに]とも思[おも]わなかったからである。"
  13: "この者[もの]も世[よ]を去[さ]ると、四人目[よにんめ]を同[おな]じように責[せ]め苦[くる]しめた。"
  14: "そして、死[し]のうとするとき、こう言[い]った。「人[ひと]に殺[ころ]されながら神[かみ]からの希望[きぼう]を抱[いだ]き、神によって再[ふたた]びよみがえらされることを望[のぞ]むのは、望[のぞ]ましいことである。しかし、あなたには命[いのち]への復活[ふっかつ]がない。」"
  15: "続[つづ]いて、五人目[ごにんめ]を連[つ]れて来[き]て責[せ]め苦[くる]しめた。"
  16: "彼[かれ]は王[おう]を見[み]て言[い]った。「あなたは人[ひと]々[びと]の上[うえ]に権力[けんりょく]を持[も]ちながら、自[みずか]らは朽[く]ちる者[もの]であり、思[おも]うままに行[おこな]っている。だが、わたしたちの民[たみ]が神[かみ]に見捨[みす]てられたと考[かんが]えてはならない。"
  17: "あなたは待[ま]って、神[かみ]の大[おお]いなる力[ちから]を仰[あお]ぎ見[み]るがよい。神[かみ]があなたとあなたの子孫[しそん]をどのように責[せ]め苦[くる]しめるかを。」"
  18: "この者[もの]の次[つぎ]に、六人目[ろくにんめ]を連[つ]れて来[き]た。彼[かれ]は死[し]のうとするとき、こう言[い]った。「無駄[むだ]な迷[まよ]いをしてはならない。わたしたちは自分[じぶん]の神[かみ]に対して罪[つみ]を犯[おか]したゆえに、自分[じぶん]たちのためにこれを受けている。それゆえ、驚[おどろ]くべきことが起[お]こったのだ。"
  19: "しかし、あなたは神[かみ]に逆[さから]おうとしたからといって、罰[ばつ]を免[まぬか]れると考[かんが]えてはならない。」"
  20: "母[はは]はこのうえなく驚[おどろ]くべき人[ひと]であり、良[よ]い記憶[きおく]にふさわしい。彼女[かのじょ]は、七人[しちにん]の息子[むすこ]たちが一日[いちにち]のうちに滅[ほろ]びるのを見[み]ながら、主[しゅ]への希望[きぼう]のゆえに、それを雄々[おお]しく耐[た]え忍[しの]んだ。"
  21: "彼女[かのじょ]は一人[ひとり]一人[ひとり]を父[ちち]たちの言葉[ことば]で勧[すす]め、勇[いさ]ましい心[こころ]に満[み]ちあふれて、女[おんな]の考[かんが]えを男[おとこ]の勇気[ゆうき]で奮[ふる]い立[た]たせ、彼らに言[い]った。"
  22: "「わたしは、あなたがたがどのようにしてわたしの胎[はら]に現[あら]われたのか知[し]らない。わたしがあなたがたに霊[れい]と命[いのち]を与[あた]えたのではない。あなたがた一人[ひとり]一人[ひとり]の体[からだ]の組[く]み立[た]てを整[ととの]えたのも、わたしではない。"
  23: "だから、世[よ]の造[つく]り主[ぬし]であり、人[ひと]の生[せい]まれを形[かたち]づくり、すべてのものの起[お]こりを考[かんが]え出[だ]された方[かた]が、あなたがたに憐[あわ]れみをもって再[ふたた]び霊[れい]と命[いのち]をお与[あた]えになる。今[いま]、あなたがたがその律法[りっぽう]のために自分[じぶん]たちを顧[かえり]みないのだから。」"
  24: "アンティオコスは、自分[じぶん]が侮[あなど]られていると考[かんが]え、その言葉[ことば]を嘲[あざけ]りと見[み]なして、まだ残[のこ]っている最[さい]年[ねん]少[しょう]の者[もの]に、言葉[ことば]だけでなく確[かく]かな誓[ちか]いまで添[そ]えて勧[すす]めた。すなわち、父[ちち]たちのものから離[はな]れれば、富[とみ]を与[あた]えて幸[しあわ]せにし、友人[ゆうじん]として遇[ぐう]し、大事[だいじ]な務[つと]めを任[まか]せる、と言[い]うのであった。"
  25: "しかし、この若者[わかもの]がまったく耳[みみ]を貸[か]さないので、王[おう]は母[はは]を呼[よ]び寄[よ]せて、息子[むすこ]が救[すく]われるように勧[すす]める者[もの]になるようにと言[い]った。"
  26: "彼[かれ]が多[おお]くを勧[すす]めると、彼女[かのじょ]は息子[むすこ]を説得[せっとく]しようと引[ひ]き受[う]けた。"
  27: "そして、彼[かれ]に身[み]を寄[よ]せ、残酷[ざんこく]な王[おう]を嘲[あざけ]って、父[ちち]たちの言葉[ことば]でこう言[い]った。「子[こ]よ、わたしをあわれみなさい。わたしは九月[くげつ]の間[あいだ]あなたを胎[はら]に宿[やど]し、三年[さんねん]の間[あいだ]乳[ちち]を飲[の]ませ、育[そだ]て、この年[とし]頃[ごろ]まで養[やしな]い、世話[せわ]をしてきた者[もの]である。"
  28: "子[こ]よ、わたしはあなたに願[ねが]う。天[てん]と地[ち]と、その中[なか]にあるすべてのものを見[み]て、神[かみ]がこれらを無[む]から造[つく]られたこと、人[ひと]の種[しゅ]もまたそのように生[しょう]じたことを悟[さと]りなさい。"
  29: "この殺[ころ]し手[て]を恐[おそ]れてはならない。兄弟[きょうだい]たちにふさわしい者[もの]となって、死[し]を受[う]け入[い]れなさい。そうすれば、わたしはあわれみのうちに、あなたの兄弟[きょうだい]たちとともにあなたを受[う]け入[い]れるであろう。」"
  30: "彼女[かのじょ]がまだ語[かた]り終[お]えないうちに、若者[わかもの]は言[い]った。「あなたがたは何[なに]を待[ま]っているのか。わたしは王[おう]の命令[めいれい]には従[したが]わない。わたしが聞[き]き従[したが]うのは、モーセによって父[ちち]たちに与[あた]えられた律法[りっぽう]の命令[めいれい]である。"
  31: "あなたは、ユダヤ人[じん]に対してあらゆる悪[あく]を考[かんが]え出[だ]した者[もの]となったが、神[かみ]の手[て]から逃[のが]れることはできない。"
  32: "わたしたちは自分[じぶん]たちの罪[つみ]のゆえに、これを受けている。"
  33: "生[い]けるわたしたちの主[しゅ]が、戒[いまし]めと教育[きょういく]のためにしばらく怒[いか]られたとしても、再[ふたた]びご自分[じぶん]の僕[しもべ]たちと和[やわ]らがれるであろう。"
  34: "しかし、あなたは、不敬[ふけい]な者[もの]、すべての人[ひと]のうちで最も汚[けが]れた者[もの]よ、むなしく高[たか]ぶってはならない。不確[ふたし]かな希望[きぼう]にいきり立[た]ち、天[てん]にいる僕[しもべ]たちに手[て]を上[あ]げてはならない。"
  35: "あなたはまだ、全能[ぜんのう]で、すべてを見[み]る神[かみ]の裁[さば]きから逃[のが]れていないのだ。"
  36: "わたしたちの兄弟[きょうだい]たちは、今[いま]わずかな苦[くる]しみを耐[た]え忍[しの]んで、神[かみ]の契約[けいやく]により永遠[えいえん]の命[いのち]を受[う]けた。しかし、あなたは神[かみ]の裁[さば]きにより、高[たか]ぶりに対する正当[せいとう]な罰[ばつ]を受[う]けるであろう。"
  37: "わたしは兄弟[きょうだい]たちと同じように、父[ちち]たちの律法[りっぽう]のために体[からだ]と魂[たましい]を差[さ]し出[だ]し、神[かみ]が間[ま]もなく民[たみ]に憐[あわ]れみを示[しめ]してくださるようにと願[ねが]っている。そして、あなたが苦[くる]しみとむちの中で、神[かみ]がただひとりであることを告白[こくはく]するように、"
  38: "わたしと兄弟[きょうだい]たちの上[うえ]で、全能[ぜんのう]者の怒[いか]りが止[と]まるように。その怒[いか]りは、わたしたちの民[たみ]の全体[ぜんたい]に正[ただ]しく下[くだ]ったものである。」"
  39: "王[おう]は怒[いか]りに燃[も]え、この者[もの]にはほかの者[もの]たち以上[いじょう]にひどく当[あ]たり、嘲[あざけ]りを苦[にが]く思[おも]った。"
  40: "こうして、この者[もの]も清[きよ]いまま世[よ]を去[さ]り、すべてを主[しゅ]に委[ゆだ]ねた。"
  41: "そして、息子[むすこ]たちの後[あと]に、母[はは]も世[よ]を去[さ]った。"
  42: "犠牲[ぎせい]と、度[ど]を越[こ]えた責[せめ]苦[くる]しみについては、これだけにしておこう。"

notes:
  1: "ἑπτὰ ἀδελφοὺς μετὰ τῆς μητρός — «семь братьев с матерью»; συλλημφθέντας — «схваченных»; ἀπὸ τῶν ἀθεμίτων ὑείων κρεῶν ἐφάπτεσθαι — «прикоснуться к недозволенным свиным мясам» (ἀθέμιτος); μάστιξιν καὶ νευραῖς αἰκιζομένους — «бичами и жилами (сухожилиями) терзаемых» (νευρά — жила, 牛[ぎゅう]の腱[けん])."
  2: "γενόμενος προήγορος — «ставший предстоятелем (ответчиком за всех)» (προήγορος, 代弁者[だいべんしゃ]); Τί μέλλεις ἐρωτᾶν καὶ μανθάνειν ἡμῶν — «что ты собираешься спрашивать и узнавать от нас?»; ἕτοιμοι… ἀποθνῄσκειν ἐσμὲν ἢ παραβαίνειν — «готовы умереть, нежели преступить»."
  3: "ἔκθυμος… γενόμενος — «придя в ярость» (ἔκθυμος); τήγανα καὶ λέβητας ἐκπυροῦν — «раскалить сковороды и котлы» (τήγανον, λέβης)."
  4: "γλωσσοτομεῖν — «отрезать язык» (γλωσσοτομέω); περισκυθίσαντας — «содрав кожу с головы» (περισκυθίζω); ἀκρωτηριάζειν — «отсекать члены» (ἀκρωτηριάζω); τῶν λοιπῶν ἀδελφῶν καὶ τῆς μητρὸς συνορώντων — «при виде прочих братьев и матери»."
  5: "ἄχρηστον… τοῖς ὅλοις γενόμενον — «ставшего вовсе негодным»; τῇ πυρᾷ προσάγειν ἔμπνουν — «к костру принести ещё дышащим» (πυρά); τηγανίζειν — «жарить на сковороде»; τῆς ἀτμίδος ἐφ᾽ ἱκανὸν διαδιδούσης — «когда пар широко распространялся» (ἀτμίς)."
  6: "ὁ κύριος ὁ θεὸς ἐφορᾷ — «Господь Бог видит» (ἐφοράω); ταῖς ἀληθείαις ἐφ᾽ ἡμῖν παρακαλεῖται — «поистине о нас умилостивится» (παρακαλέομαι — быть утешену, умилостивлену); διὰ τῆς κατὰ πρόσωπον ἀντιμαρτυρούσης ᾠδῆς — «через песнь, свидетельствующую пред лицом» (ἀντιμαρτυρέω); цитата Моисея (Втор 32:36) — 『…』. Слав. «якоже пред лицем свидетелствующею песнию изяви моисей»."
  7: "ἐπὶ τὸν ἐμπαιγμόν — «на поругание» (ἐμπαιγμός); τὸ τῆς κεφαλῆς δέρμα σὺν ταῖς θριξὶν περισύραντες — «содрав с головы кожу с волосами» (περισύρω); Εἰ φάγεσαι — «будешь ли есть?»; κατὰ μέλος — «по членам»."
  8: "τῇ πατρίῳ φωνῇ — «на отеческом языке» (ивр./арам.); Οὐχί — «нет»; τὴν ἑξῆς ἔλαβεν βάσανον — «принял следующее мучение» (βάσανος)."
  9: "ἐν ἐσχάτῃ πνοῇ γενόμενος — «быв при последнем дыхании»; ἀλάστωρ — «губитель, злодей» (ἀλάστωρ); ἐκ τοῦ παρόντος… ζῆν ἀπολύεις — «от настоящей жизни отрешаешь»; ὁ τοῦ κόσμου βασιλεύς — «Царь мира»; εἰς αἰώνιον ἀναβίωσιν ζωῆς — «в вечное возрождение жизни» (ἀναβίωσις)."
  10: "ἐνεπαίζετο — «подвергался поруганию»; τὴν γλῶσσαν αἰτηθεὶς — «когда потребовали язык»; ταχέως προέβαλεν — «тотчас выставил» (προβάλλω); εὐθαρσῶς προέτεινεν — «смело протянул»."
  11: "Ἐξ οὐρανοῦ ταῦτα κέκτημαι — «с неба это я приобрёл»; διὰ τοὺς αὐτοῦ νόμους ὑπερορῶ ταῦτα — «ради Его законов презираю это» (ὑπεροράω); παρ᾽ αὐτοῦ… πάλιν ἐλπίζω κομίσασθαι — «от Него надеюсь снова получить» (κομίζομαι)."
  12: "ἐκπλήσσεσθαι τὴν τοῦ νεανίσκου ψυχήν — «изумляться душе юноши»; ὡς ἐν οὐδενὶ τὰς ἀλγηδόνας ἐτίθετο — «как он ни во что ставил страдания» (ἀλγηδών)."
  13: "μεταλλάξαντος — «скончавшегося»; ὡσαύτως ἐβασάνιζον αἰκιζόμενοι — «так же мучили, терзая»."
  14: "Αἱρετὸν — «предпочтительно (желательно)»; μεταλλάσσοντας ὑπ᾽ ἀνθρώπων — «убиваемым людьми»; τὰς ὑπὸ τοῦ θεοῦ προσδοκᾶν ἐλπίδας πάλιν ἀναστήσεσθαι ὑπ᾽ αὐτοῦ — «ожидать надежд от Бога — снова быть воскрешёнными Им»; σοὶ… ἀνάστασις εἰς ζωὴν οὐκ ἔσται — «тебе не будет воскресения в жизнь»."
  15: "Ἐχομένως — «затем, следом»; τὸν πέμπτον προσάγοντες ᾐκίζοντο — «пятого приведя, терзали». Слав. относит «и он, воззрев, сказал» к этому стиху; по gr вступление — в 16."
  16: "πρὸς αὐτὸν ἰδών — «на него взглянув»; ἐξουσίαν ἐν ἀνθρώποις ἔχων — «имея власть над людьми»; φθαρτὸς ὤν — «будучи тленным»; ὃ θέλεις ποιεῖς — «что хочешь, делаешь»; μὴ δόκει… καταλελεῖφθαι — «не думай, что оставлен род наш Богом»."
  17: "καρτέρει καὶ θεώρει — «терпи и смотри» (καρτερέω); τὸ μεγαλεῖον αὐτοῦ κράτος — «великое Его могущество»; ὡς σὲ καὶ τὸ σπέρμα σου βασανιεῖ — «как тебя и семя твоё будет мучить». Слав. «зри велию державу его, како тебе и семя твое умучит»."
  18: "Μὴ πλανῶ μάτην — «не прельщайся напрасно»; δι᾿ ἑαυτοὺς ταῦτα πάσχομεν ἁμαρτόντες — «за себя это страдаем, согрешив»; ἄξια θαυμασμοῦ γέγονεν — «произошло достойное удивления»."
  19: "μὴ νομίσῃς ἀθῷος ἔσεσθαι — «не думай остаться безвинным» (ἀθῷος); θεομαχεῖν ἐπιχειρήσας — «дерзнув богоборствовать» (θεομαχέω)."
  20: "Ὑπεραγόντως… θαυμαστή — «необычайно дивная»; μνήμης ἀγαθῆς ἀξία — «достойная доброй памяти»; μιᾶς ὑπὸ καιρὸν ἡμέρας — «в течение одного дня»; εὐψύχως ἔφερεν — «мужественно переносила» (εὐψύχως); διὰ τὰς ἐπὶ κύριον ἐλπίδας — «ради надежд на Господа»."
  21: "γενναίῳ πεπληρωμένη φρονήματι — «исполненная доблестного духа» (φρόνημα); τὸν θῆλυν λογισμὸν ἄρσενι θυμῷ διεγείρασα — «женскую мысль возбудив мужским мужеством» (θῆλυς, ἄρσην)."
  22: "Οὐκ οἶδ ὅπως εἰς τὴν ἐμὴν ἐφάνητε κοιλίαν — «не знаю, как вы явились в моё чрево»; τὸ πνεῦμα καὶ τὴν ζωὴν… ἐχαρισάμην — «дыхание (дух) и жизнь даровала»; τὴν ἑκάστου στοιχείωσιν… διερρύθμισα — «состав (устроение) каждого устроила» (στοιχείωσις)."
  23: "ὁ τοῦ κόσμου κτίστης — «Творец мира»; ὁ πλάσας ἀνθρώπου γένεσιν — «создавший происхождение (природу) человека» (πλάσσω); πάντων ἐξευρὼν γένεσιν — «измысливший происхождение всего» (ἐξευρίσκω); μετ᾽ ἐλέους — «с милостью»; ὡς νῦν ὑπερορᾶτε ἑαυτούς — «так как ныне презираете себя»."
  24: "οἰόμενος καταφρονεῖσθαι — «думая, что его презирают»; τὴν ὀνειδίζουσαν ὑφορώμενος φωνήν — «подозревая укоряющий голос» (ὑφοράομαι); τοῦ νεωτέρου περιόντος — «когда младший ещё жив»; δι᾿ ὅρκων ἐπίστου — «верными клятвами»; πλουτιεῖν καὶ μακαριστὸν ποιήσειν — «обогатить и осчастливить»; φίλον ἕξειν καὶ χρείας ἐμπιστεύσειν — «другом иметь и дела вверить»."
  25: "μηδαμῶς προσέχοντος — «нисколько не внимающего» (προσέχω); σύμβουλον ἐπὶ σωτηρίᾳ — «советницей ко спасению»."
  26: "πολλὰ… παραινέσαντος — «много убеждавшего»; ἐπεδέξατο πείσειν τὸν υἱόν — «согласилась убедить сына». Стих короткий, как в gr."
  27: "προσκύψασα — «наклонившись» (προσκύπτω); χλευάσασα τὸν ὠμὸν τύραννον — «насмеявшись над жестоким тираном» (χλευάζω); ἐν γαστρὶ περιενέγκασάν σε μῆνας ἐννέα — «носившую тебя во чреве девять месяцев»; θηλάσασάν σε ἔτη τρία — «кормившую грудью три года»; τροφοφορήσασαν — «носившую на руках (вскормившую)»."
  28: "ἀναβλέψαντα εἰς τὸν οὐρανὸν καὶ τὴν γῆν — «взглянув на небо и землю»; οὐκ ἐξ ὄντων ἐποίησεν αὐτὰ ὁ θεός — «не из сущих сотворил их Бог» (т. е. из ничего); τὸ τῶν ἀνθρώπων γένος οὕτω γίνεται — «и род человеческий так произошёл»."
  29: "τὸν δήμιον τοῦτον — «этого палача» (δήμιος); τῶν ἀδελφῶν ἄξιος γενόμενος — «став достойным братьев»; ἐπίδ εξαι τὸν θάνατον — «прими смерть» (ἐπιδέχομαι); ἐν τῷ ἐλέει σὺν τοῖς ἀδελφοῖς σου κομίσωμαί σε — «в милости с братьями твоими приму тебя»."
  30: "καταληγούσης — «когда она заканчивала»; Τίνα μένετε — «чего ждёте?»; οὐχ ὑπακοῦω τοῦ προστάγματος τοῦ βασιλέως — «не слушаю повеления царя»; τοῦ νόμου τοῦ δοθέντος… διὰ Μωυσέως — «закона, данного через Моисея»."
  31: "πάσης κακίας εὑρετὴς γενόμενος εἰς τοὺς Εβραίους — «изобретателем всякого зла для евреев» (εὑρετής); οὐ μὴ διαφύγῃς τὰς χεῖρας τοῦ θεοῦ — «не избежишь рук Божиих»."
  32: "διὰ τὰς ἑαυτῶν ἁμαρτίας πάσχομεν — «за свои грехи страдаем». Короткий стих, как в gr."
  33: "χάριν ἐπιπλήξεως καὶ παιδείας — «ради обличения и наставления» (ἐπίπληξις); ὁ ζῶν κύριος — «живой Господь»; βραχέως ἐπώργισται — «на краткое время прогневался»; καταλλαγήσεται τοῖς ἑαυτοῦ δούλοις — «примирится со Своими рабами»."
  34: "ὦ ἀνόσιε καὶ πάντων ἀνθρώπων μιαρώτατε — «о нечестивый и сквернейший из всех людей»; μὴ μάτην μετεωρίζου φρυαττόμενος — «не напрасно превозносись, кичась» (φρυάττομαι); ἀδήλοις ἐλπίσιν — «неясными (неверными) надеждами»; ἐπὶ τοὺς οὐρανίους παῖδας ἐπαιρόμενος χεῖρα — «на небесных отроков поднимая руку»."
  35: "οὔπω… τὴν τοῦ παντοκράτορος ἐπόπτου θεοῦ κρίσιν ἐκπέφευγας — «ещё не избежал суда вседержителя, всевидящего Бога» (ἐπόπτης)."
  36: "βραχὺν ὑπενέγκαντες πόνον — «понесши краткий труд»; ἀενάου ζωῆς — «вечной (нескончаемой) жизни» (ἀέναος); ὑπὸ διαθήκην θεοῦ πεπτώκασιν — «под завет Божий подпали (получили)»; τὰ πρόστιμα τῆς ὑπερηφανίας — «кары за превозношение» (πρόστιμον)."
  37: "καθάπερ οἱ ἀδελφοί — «как братья»; σῶμα καὶ ψυχὴν προδίδωμι — «тело и душу предаю»; ἐπικαλούμενος τὸν θεὸν ἵλεως ταχὺ τῷ ἔθνει γενέσθαι — «призывая Бога скоро умилостивиться к народу»; μετὰ ἐτασμῶν καὶ μαστίγων ἐξομολογήσασθαι — «с истязаниями и бичами исповедать» (ἐτασμός); ὅτι μόνος αὐτὸς θεός ἐστιν — «что Он один есть Бог»."
  38: "στῆσαι τὴν τοῦ παντοκράτορος ὀργήν — «остановить гнев Вседержителя» (ἵστημι); τὴν ἐπὶ τὸ σύμπαν ἡμῶν γένος δικαίως ἐπηγμένην — «праведно наведённый на весь род наш» (ἐπάγω). Здесь речь юноши закрывается."
  39: "Ἔκθυμος… γενόμενος — «придя в ярость»; τούτῳ παρὰ τοὺς ἄλλους χειρίστως ἀπήντησεν — «с ним хуже, чем с другими, обошёлся»; πικρῶς φέρων ἐπὶ τῷ μυκτηρισμῷ — «горько перенося насмешку» (μυκτηρισμός)."
  40: "καθαρὸς μετήλλαξεν — «чистым скончался»; παντελῶς ἐπὶ τῷ κυρίῳ πεποιθώς — «всецело на Господа понадеявшись»."
  41: "Ἐσχάτη δὲ τῶν υἱῶν ἡ μήτηρ ἐτελεύτησεν — «последней из сыновей мать скончалась»."
  42: "Τὰ μὲν οὖν περὶ τοὺς σπλαγχνισμοὺς καὶ τὰς ὑπερβαλλούσας αἰκίας — «о жертвоприношениях и чрезвычайных мучениях» (αἰκία); ἐπὶ τοσοῦτον δεδηλώσθω — «до этого пусть сказано». Заключительная формула, ср. 3:40."
