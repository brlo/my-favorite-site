verses:
  1: "彼[かれ]らは幕屋[まくや]のために、十枚[じゅうまい]の幕[まく]を造[つく]った。"
  2: "一枚[いちまい]の幕[まく]の長[なが]さは二十八[にじゅうはち]キュビト、幅[はば]は四[よん]キュビトで、どの幕[まく]も同[おな]じであった。"
  3: "彼[かれ]らは青[あお]、紫[むらさき]、撚[よ]った緋[ひ]の糸[いと]、撚[よ]った亜麻布[あまぬの]で垂[た]れ幕[まく]を造[つく]り、その上[うえ]に織[お]り手[て]の技[わざ]でケルビムを織[お]り込[こ]んだ。"
  4: "また、それを朽[く]ちない木[き]の四[よっ]つの柱[はしら]に据[す]え、柱[はしら]には金[きん]をかぶせた。柱[はしら]の頭[かしら]は金[きん]、台座[だいざ]は銀[ぎん]の四[よっ]つであった。"
  5: "また、証[あかし]の幕屋[まくや]の入口[いりぐち]の垂[た]れ幕[まく]を、青[あお]、紫[むらさき]、撚[よ]った緋[ひ]の糸[いと]、撚[よ]った亜麻布[あまぬの]で造[つく]り、その上[うえ]に織[お]り手[て]の技[わざ]でケルビムを織[お]り込[こ]んだ。"
  6: "また、その五[いつ]つの柱[はしら]と鉤[かぎ]を造[つく]り、柱[はしら]の頭[かしら]とつなぎ金[がね]に金[きん]をかぶせた。台座[だいざ]は青銅[せいどう]の五[いつ]つであった。"
  7: "彼[かれ]らは庭[にわ]を造[つく]った。南[みなみ]側[がわ]の庭[にわ]の幕[まく]は、撚[よ]った亜麻布[あまぬの]で、百[ひゃく]キュビトに百[ひゃく]キュビトであった。"
  8: "その柱[はしら]は二十[にじゅう]本[ぽん]、台座[だいざ]も二十[にじゅう]であった。"
  9: "北[きた]側[がわ]も百[ひゃく]キュビトに百[ひゃく]キュビトで、柱[はしら]は二十[にじゅう]本[ぽん]、台座[だいざ]も二十[にじゅう]であった。"
  10: "海[うみ]の側[がわ]の幕[まく]は五十[ごじゅう]キュビトで、柱[はしら]は十[じゅう]本[ぽん]、台座[だいざ]も十[じゅう]であった。"
  11: "東[ひがし]の側[がわ]も五十[ごじゅう]キュビトであった。"
  12: "後[うし]ろ側[がわ]には十五[じゅうご]キュビトの幕[まく]があり、柱[はしら]は三[みっ]本[ぽん]、台座[だいざ]も三[みっ]つであった。"
  13: "また、後[うし]ろの第二[だいに]の側[がわ]、すなわち庭[にわ]の門[もん]のこちら側[がわ]とあちら側[がわ]にも、十五[じゅうご]キュビトの幕[まく]があり、柱[はしら]は三[みっ]本[ぽん]、台座[だいざ]も三[みっ]つであった。"
  14: "庭[にわ]の幕[まく]はすべて、撚[よ]った亜麻布[あまぬの]であった。"
  15: "柱[はしら]の台座[だいざ]は青銅[せいどう]、鉤[かぎ]は銀[ぎん]、柱[はしら]の頭[かしら]には銀[ぎん]をかぶせ、庭[にわ]の柱[はしら]はすべて銀[ぎん]をかぶせた。"
  16: "また、庭[にわ]の門[もん]の垂[た]れ幕[まく]は、刺繍師[ししゅうし]の手法[しゅほう]による青[あお]、紫[むらさき]、撚[よ]った緋[ひ]の糸[いと]、撚[よ]った亜麻布[あまぬの]で、長[なが]さ二十[にじゅう]キュビト、高[たか]さも幅[はば]も五[ご]キュビトで、庭[にわ]の幕[まく]と同[おな]じであった。"
  17: "その柱[はしら]は四[よっ]本[ぽん]、台座[だいざ]は青銅[せいどう]の四[よっ]つ、鉤[かぎ]は銀[ぎん]、柱[はしら]の頭[かしら]には銀[ぎん]をかぶせた。"
  18: "柱[はしら]にも銀[ぎん]をかぶせ、庭[にわ]の周[まわ]りの杭[くい]はすべて青銅[せいどう]であった。"
  19: "これが証[あかし]の幕屋[まくや]の組[く]み立[た]てであり、レビ人[びと]の務[つと]めが、祭司[さいし]アロンの子[こ]イタマルによって行[おこな]われるように、モーセに命[めい]じられたとおりである。"
  20: "ベツァレル、すなわちウリの子[こ]、ユダの部族[ぶぞく]の者[もの]は、主[しゅ]がモーセに命[めい]じたとおりに行[おこな]った。"
  21: "また、ダンの部族[ぶぞく]のアヒサマクの子[こ]オホリアブは、緋[ひ]と亜麻布[あまぬの]を織[お]る織[お]り物[もの]、縫[ぬ]い物[もの]、刺繍[ししゅう]の細工[さいく]を司[つかさど]る工匠[こうしょう]であった。"

notes:
  1: "τῇ σκηνῇ δέκα αὐλαίας — 幕屋のために十枚の幕 (αὐλαία — полотнище, «опона»; не καταπέτασμα — «завеса»). Ср. 26:1."
  2: "ὀκτὼ καὶ εἴκοσι πήχεων — 二十八キュビト (πῆχυς — локоть; в книге — キュビト, ср. 26:2). τὸ αὐτὸ ἦσαν πᾶσαι — все одинаковы."
  3: "καταπέτασμα — 垂れ幕 (завеса; евр. פָּרֹכֶת). ἔργον ὑφάντου χερουβιμ — ケルビムを織り出した (χερουβίμ — херувимы; ср. 26:31)."
  4: "στύλοι ἄσηπτοι — 朽ちない木の柱 (акация; ἄσηπτος — «нетленный»). κατακεχρυσωμένοι — 金をかぶせた. κεφαλίδες — 柱の頭 (капители). βάσεις ἀργυραῖ — 銀の台座."
  5: "καταπέτασμα τῆς θύρας τῆς σκηνῆς τοῦ μαρτυρίου — 証の幕屋の入口の垂れ幕 (завеса входа; ср. 26:36)."
  6: "κρίκοι — 鉤. ψαλίδες — つなぎ金 (связи, соединительные планки; слав. «верхи»). βάσεις πέντε χαλκαῖ — 青銅の台座五つ."
  7: "αὐλή — 庭 (двор). τὰ πρὸς λίβα — 南側 (λίψ — юго-запад, здесь юг). ἑκατὸν ἐφ᾿ ἑκατόν — 百キュビトに百キュビト (букв. «сто на сто»; имеется в виду длина стороны)."
  8: "στῦλοι εἴκοσι, βάσεις εἴκοσι — 柱二十本、台座二十 (в csl добавлено «медяна» — в гр. нет)."
  9: "τὸ κλῖτος τὸ πρὸς βορρᾶν — 北側 (κλῖτος — «сторона»). В csl здесь повторено «и страна к югу» — в гр. нет."
  10: "τὸ πρὸς θάλασσαν — 海の側, то есть запад (θάλασσα — «море»; в Палестине запад — сторона моря). αὐλαῖαι πεντήκοντα πήχεων — 五十キュビトの幕."
  11: "τὸ πρὸς ἀνατολάς — 東側."
  12: "ἱστία — 幕 (полотнища; ἱστίον — «ткань»). τὸ κατὰ νώτου — 後ろ側 (νῶτον — «спина, тыл»)."
  13: "ἐπὶ τοῦ νώτου τοῦ δευτέρου — 後ろの第二の側 (вторая сторона у ворот). ἔνθεν καὶ ἔνθεν — с той и другой стороны. πύλη — 門 (ворота двора)."
  14: "πᾶσαι αἱ αὐλαῖαι τῆς αὐλῆς — 庭の幕はすべて (в csl «скинии» — в гр. «двора»)."
  15: "αἱ ἀγκύλαι ἀργυραῖ — 銀の鉤. περιηργυρωμέναι ἀργυρίῳ — 銀をかぶせた (посеребрённые)."
  16: "ἔργον ποικιλτοῦ — 刺繍師の手法 (работа вышивальщика, разноцветная). ἐξισούμενον τοῖς ἱστίοις — 庭の幕と同じ (равна прочим полотнищам двора)."
  17: "οἱ στῦλοι αὐτῶν τέσσαρες — 柱四本. ἀγκύλαι ἀργυραῖ — 銀の鉤."
  18: "πάσσαλοι — 杭 (колья). κύκλῳ χαλκοῖ — 周りの青銅."
  19: "σύνταξις — 組み立て, устройство (порядок работ). λειτουργία τῶν Λευιτῶν — レビ人の務め. διὰ Ιθαμαρ — через Ифамара (сын Аарона, ср. Числ 4:28). τοῦ ἱερέως — 祭司."
  20: "Βεσελεηλ ὁ τοῦ Ουριου — ウリの子ベツァレル (евр. בְּצַלְאֵל; ср. 31:2). ἐκ φυλῆς Ιουδα — из колена Иудина."
  21: "Ελιαβ ὁ τοῦ Αχισαμακ — в LXX здесь Ελιαβ, то есть Аголиав (オホリアブ; ср. 31:6). ἠρχιτεκτόνησεν — был мастером, «архитектором». τὰ ὑφαντά — 織り物, ῥαφιδευτά — 縫い物, ποικιλτικά — 刺繍. τῷ κοκκίνῳ καὶ τῇ βύσσῳ — 緋と亜麻布."
