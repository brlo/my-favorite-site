verses:
  1: "「七[なな]年[ねん]ごとに、あなたは負債[ふさい]の免除[めんじょ]を行[おこな]いなさい。"
  2: "その免除[めんじょ]の定[さだ]めは次[つぎ]のとおりである。あなたは、あなたの隣人[りんじん]があなたに負[お]うすべての負債[ふさい]を免除[めんじょ]しなければならない。あなたの兄弟[きょうだい]から取[と]り立[た]ててはならない。あなたの神[かみ]である主[しゅ]のために免除が告[つ]げ知[し]らされたからである。"
  3: "外国人[がいこくじん]からは、あなたに負[お]いがあるものをすべて取[と]り立[た]てなさい。しかし、あなたの兄弟[きょうだい]には、あなたの負債[ふさい]を免除[めんじょ]しなさい。"
  4: "あなたの間[あいだ]には、貧[まず]しい者[もの]が一人[ひとり]もいなくなる。あなたの神[かみ]である主[しゅ]は、ご自身[じぶん]があなたに嗣業[しぎょう]として受[う]け継[つ]がせるために与[あた]える地[ち]であなたを大[おお]いに祝福[しゅくふく]してくださるからである。"
  5: "ただし、あなたがたが、あなたがたの神[かみ]である主[しゅ]の声[こえ]によく聞[き]き従[したが]い、今日[きょう]、わたしがあなたに命[めい]じるこれらすべての戒[いまし]めを守[まも]って行[おこな]うなら。"
  6: "あなたの神[かみ]である主[しゅ]が、あなたに語[かた]られたとおりにあなたを祝福[しゅくふく]してくださったからである。あなたは多[おお]くの国民[こくみん]に貸[か]し、自分[じぶん]は借[か]りず、多くの国民を治[おさ]め、彼らがあなたを治めることはない。"
  7: "もしあなたの兄弟[きょうだい]のうち、あなたの神[かみ]である主[しゅ]があなたに与[あた]える地[ち]の、あなたの町[まち]の一[ひと]つに、貧[まず]しい者[もの]がいるなら、あなたは心[こころ]をかたくなにせず、あなたの乏[とぼ]しい兄弟[きょうだい]に対して手[て]を閉[と]ざしてはならない。"
  8: "あなたは必[かなら]ず彼[かれ]のために手[て]を開[ひら]き、彼が求[もと]めるだけ、彼が不足[ふそく]しているだけのものを貸[か]し与[あた]えなさい。"
  9: "あなたは自分[じぶん]に気[き]をつけなさい。『第七[だいしち]の年[とし]、すなわち免除[めんじょ]の年が近[ちか]づいている』という不法[ふほう]な考[かんが]えが、あなたの心[こころ]に密[ひそ]かに入[はい]って、あなたの目[め]が乏[とぼ]しい兄弟[きょうだい]に対して悪[わる]くなり、何[なに]も与[あた]えないことのないように。彼があなたのことを主[しゅ]に向[む]かって叫[さけ]ぶなら、あなたに大[おお]きな罪[つみ]があることになる。"
  10: "あなたは彼[かれ]に必[かなら]ず与[あた]え、彼が求[もと]めるだけのものを貸[か]し与[あた]えなさい。彼に与[あた]えるとき、あなたの心[こころ]を痛[いた]めてはならない。このことのゆえに、あなたの神[かみ]である主[しゅ]は、あなたのすべてのわざと、あなたが手[て]をかけるすべてのものにおいて、あなたを祝福[しゅくふく]してくださるからである。"
  11: "貧[まず]しい者[もの]は地[ち]から絶[た]えることがないからである。それゆえ、わたしはあなたに命[めい]じて言[い]う。『あなたは必[かなら]ず、あなたの地[ち]にいるあなたの兄弟[きょうだい]、すなわち貧しい者[もの]と乏[とぼ]しい者[もの]のために手[て]を開[ひら]かなければならない』と。"
  12: "もしあなたの兄弟[きょうだい]であるヘブライ人[じん]、あるいはヘブライ人の女[おんな]があなたに売[う]られるなら、その人[ひと]は六[ろく]年[ねん]あなたに仕[つか]え、第七[だいしち]の年にはあなたのもとから自由[じゆう]の身[み]にして去[さ]らせなさい。"
  13: "あなたが彼[かれ]を自由[じゆう]の身[み]にして去[さ]らせるとき、空[から]の手[て]で去[さ]らせてはならない。"
  14: "あなたは彼[かれ]に、あなたの羊[ひつじ]の群[む]れから、あなたの麦[むぎ]から、あなたのぶどうの搾[しぼ]り場[ば]から、旅[たび]のための糧[かて]を贈[おく]りなさい。あなたの神[かみ]である主[しゅ]があなたを祝福[しゅくふく]してくださったとおりに、彼に与[あた]えなさい。"
  15: "あなたは、自分[じぶん]がエジプトの地[ち]で奴隷[どれい]であったこと、そしてあなたの神[かみ]である主[しゅ]がそこからあなたを贖[あがな]い出[だ]されたことを覚[おぼ]えていなさい。それゆえ、わたしはあなたにこのことを命[めい]じるのである。"
  16: "もし彼[かれ]があなたに『あなたのもとから去[さ]りたくない』と言[い]うなら、それは彼があなたとあなたの家[いえ]を愛[あい]し、あなたのもとでよく暮[く]らしているからである。"
  17: "あなたは錐[きり]を取[と]り、彼[かれ]の耳[みみ]を戸[と]に刺[さ]し通[とお]しなさい。そうすれば、彼は永遠[えいえん]にあなたの奴隷[どれい]となる。あなたの女奴隷[おんなどれい]にも同[おな]じようにしなさい。"
  18: "彼[かれ]らを自由[じゆう]の身[み]にして去[さ]らせるとき、それをあなたの目[め]に重[おも]いことと思[おも]ってはならない。彼[かれ]は六[ろく]年[ねん]の間[あいだ]、雇[やと]われ人[びと]の一年[いちねん]分[ぶん]の賃金[ちんぎん]で、あなたのために働[はたら]いたからである。あなたの神[かみ]である主[しゅ]は、あなたが行[おこな]うすべてのことにおいてあなたを祝福[しゅくふく]してくださる。"
  19: "あなたの牛[うし]や羊[ひつじ]のうちで生[う]まれる初[うい]子[ご]は、すなわち雄[おす]のものはすべて、あなたの神[かみ]である主[しゅ]に聖別[せいべつ]しなさい。あなたの初子の子牛[こうし]を労役[ろうえき]に使ってはならず、あなたの羊の初子の毛[け]を刈[か]ってはならない。"
  20: "あなたはそれを、あなたの神[かみ]である主[しゅ]が選[えら]ばれる所[ところ]で、年[とし]ごとに、あなたもあなたの家[いえ]も、主[しゅ]の前[まえ]で食[た]べなさい。"
  21: "しかし、その中[なか]に傷[きず]があり、足[あし]が不自由[ふじゆう]であったり、目[め]が見[み]えなかったり、そのほかどのような悪[わる]い傷があっても、それをあなたの神[かみ]である主[しゅ]に屠[ほふ]ってはならない。"
  22: "あなたの町々[まちまち]でそれを食[た]べなさい。あなたのうちの汚[けが]れた者[もの]も清[きよ]い者も、同[おな]じように、かもしかや鹿[しか]を食[た]べるのと同様[どうよう]に、それを食べることができる。"
  23: "ただ、その血[ち]を食[た]べてはならない。それを水[みず]のように地[ち]に注[そそ]ぎ出[だ]しなさい。」"

notes:
  1: "Δι᾽ ἑπτὰ ἐτῶν — через семь лет, по прошествии семи лет. ἄφεσις — отпущение, прощение долгов (負債の免除; слав. «отпущение»). ποιήσεις — сделаешь, совершишь."
  2: "πρόσταγμα τῆς ἀφέσεως — постановление об отпущении. ἀφήσεις πᾶν χρέος ἴδιον — простишь всякий собственный долг. ὃ ὀφείλει σοι ὁ πλησίον — который должен тебе ближний. οὐκ ἀπαιτήσεις — не взыщешь. ἐπικέκληται ἄφεσις κυρίῳ — наречено отпущение Господу."
  3: "τὸν ἀλλότριον — иноземца (в отличие от брата); ἀπαιτήσεις — взыщешь. ἄφεσιν ποιήσεις τοῦ χρέους — простишь долг."
  4: "οὐκ ἔσται ἐν σοὶ ἐνδεής — не будет в тебе нуждающегося; слав. и Син. передают условность через ст. 5. εὐλογῶν εὐλογήσει — благословляя благословит (усиление). ἐν κλήρῳ κατακληρονομῆσαι — в удел наследовать."
  5: "ἐὰν δὲ ἀκοῇ εἰσακούσητε — если слухом послушаете (усиление). φυλάσσειν καὶ ποιεῖν — соблюдать и исполнять. Придаточное без главного, продолжается в ст. 6; поэтому стих кончается на «なら。」."
  6: "δανιεῖς ἔθνεσιν πολλοῖς — будешь давать взаймы многим народам; σὺ δὲ οὐ δανιῇ — сам не будешь брать. ἄρξεις… οὐκ ἄρξουσιν — будешь господствовать… не будут господствовать."
  7: "ἐνδεὴς τῶν ἀδελφῶν σου — нуждающийся из братьев твоих. οὐκ ἀποστέρξεις τὴν καρδίαν — не ожесточишь сердца (ἀποστέργω — лишать любви). οὐ μὴ συσφίγξῃς τὴν χεῖρα — не сожмёшь руки."
  8: "ἀνοίγων ἀνοίξεις — отверзая отверзи (усиление). δάνειον δανιεῖς — взаймы дашь. ὅσον ἐπιδέεται, καθ᾽ ὅσον ἐνδεεῖται — сколько просит, сколько нуждается."
  9: "ῥῆμα κρυπτὸν ἐν τῇ καρδίᾳ — тайное слово в сердце. ἀνόμημα — беззаконие. Ἐγγίζει τὸ ἔτος τὸ ἕβδομον — приближается седьмой год. πονηρεύσηται ὁ ὀφθαλμός — глаз сделается злым. βοήσεται κατὰ σοῦ — возопит против тебя. ἁμαρτία μεγάλη — грех великий."
  10: "διδοὺς δώσεις — давая дай (усиление). οὐ λυπηθήσῃ τῇ καρδίᾳ — не огорчишься сердцем. διὰ τὸ ῥῆμα τοῦτο — за это слово, дело. ἐπιβάλῃς τὴν χεῖρα — наложишь руку."
  11: "οὐ γὰρ μὴ ἐκλίπῃ ἐνδεής — ибо не оскудеет нуждающийся. ἐγώ σοι ἐντέλλομαι — я тебе заповедую. λέγων — говоря; далее прямая речь внутри речи Моисея — 『…』. τῷ πένητι καὶ τῷ ἐπιδεομένῳ — бедному и нуждающемуся."
  12: "πραθῇ σοι — продан будет тебе. ὁ Εβραῖος ἢ ἡ Εβραία — еврей или еврейка (ヘブライ人). δουλεύσει ἓξ ἔτη — будет служить шесть лет. τῷ ἑβδόμῳ ἐξαποστελεῖς — в седьмой отпустишь."
  13: "ἐξαποστέλλῃς ἐλεύθερον — отпускаешь свободным. οὐκ ἐξαποστελεῖς κενόν — не отпустишь с пустыми руками (κενός — пустой)."
  14: "ἐφόδιον ἐφοδιάσεις — снабдишь на дорогу (ἐφόδιον — дорожный запас, 旅の糧). ληνός — точило (ぶどうの搾り場). καθὰ εὐλόγησέν σε — как благословил тебя."
  15: "οἰκέτης ἦσθα — ты был рабом (οἰκέτης — домочадец, раб). ἐλυτρώσατό σε — избавил тебя (λυτρόω). διὰ τοῦτο ἐντέλλομαι — поэтому заповедую."
  16: "Οὐκ ἐξελεύσομαι ἀπὸ σοῦ — не выйду от тебя. ἠγάπηκέν σε καὶ τὴν οἰκίαν σου — полюбил тебя и дом твой. εὖ αὐτῷ ἐστιν παρὰ σοί — хорошо ему у тебя. Прямая речь раба — 『…』."
  17: "ὀπήτιον — шило (錐). τρυπήσεις τὸ ὠτίον πρὸς τὴν θύραν — проколешь ухо у двери. οἰκέτης εἰς τὸν αἰῶνα — раб навек. παιδίσκη — рабыня (女奴隷)."
  18: "οὐ σκληρὸν ἔσται ἐναντίον σου — не будет тяжким пред тобою. ἐφέτιον μισθὸν τοῦ μισθωτοῦ — годовую плату наёмника (ἐφέτιος — годовой; слав. «годовую мзду»; Син. «вдвое» следует евр. מִשְׁנֶה). ἐδούλευσέν σοι ἓξ ἔτη — служил тебе шесть лет."
  19: "πρωτότοκον… τὰ ἀρσενικά — первородное мужского пола (初子). ἁγιάσεις — освятишь, посвятишь (聖別). οὐκ ἐργᾷ — не будешь работать на нём (労役に使う). οὐ μὴ κείρῃς — не острижёшь (κείρω)."
  20: "ἔναντι κυρίου — пред Господом. ἐνιαυτὸν ἐξ ἐνιαυτοῦ — год за годом. ἐν τῷ τόπῳ, ᾧ ἐὰν ἐκλέξηται — на месте, которое изберёт."
  21: "μῶμος — порок, недостаток (傷). χωλόν, τυφλόν — хромое, слепое. μῶμος πονηρός — злой порок. οὐ θύσεις — не заколешь, не принесёшь в жертву."
  22: "ὁ ἀκάθαρτος… καὶ ὁ καθαρός — нечистый и чистый. ὡς δορκάδα ἢ ἔλαφον — как серну или оленя (т.е. как обычное мясо, не жертвенное)."
  23: "πλὴν τὸ αἷμα — только кровь. ἐπὶ τὴν γῆν ἐκχεεῖς ὡς ὕδωρ — на землю выльешь, как воду."
