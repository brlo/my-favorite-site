# jp-box, 1-е Послание к Тимофею, глава 6. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 6: рабы и господа (1–2), лжеучители и любостяжание (3–10),
# доброе исповедание Тимофея и славословие (11–16), богатые (17–19), заключение (20–21).
# Красного и синего нет: 6:15–16 — славословие Павла, а не слова Христа, поэтому не красное.
# 〔…〕 четыре: 6:5 〔そのような者たちから離れなさい。〕 — в базе нет ἀφίστασο ἀπὸ τῶν τοιούτων
# (церковное добавление, ср. jp-joc「是くの如き者より遠ざかれ」); 6:7 〔…明らかなことである。〕 —
# в базе нет δῆλον; 6:17 〔生ける〕 — в базе нет ζῶντι; 6:21 〔アーメン〕 — в базе нет ἀμήν.
# Все четыре проверены запросом к gr-lxx-byz.
# 6:19 — замена (в базе τῆς ὄντως ζωῆς, церковный текст читает τῆς αἰωνίου ζωῆς),
# дана церковная форма без 〔〕, как принято в корпусе.
# Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

