book: 1tim
chapter: 6
draft: true

verses:
  1: "くびきの下[した]にある奴隷[どれい]たちはみな、自分[じぶん]の主人[しゅじん]を、すべての敬[うやま]いを受[う]けるに値[あた]いする者[もの]と考[かんが]えなさい。神[かみ]の名[な]と教[おし]えとが冒涜[ぼうとく]されないためである。"
  2: "信[しん]じる主人[しゅじん]を持[も]つ者[もの]たちは、その人[ひと]が兄弟[きょうだい]だからといって軽[かろ]んじてはならない。かえって、ますます仕[つか]えなさい。仕[つか]える相手[あいて]が、信[しん]じる者[もの]であり、愛[あい]されている者[もの]、恩恵[おんけい]を受[う]ける者[もの]だからである。これらのことを教[おし]え、勧[すす]めなさい。"
  3: "異[こと]なる教[おし]えを説[と]き、健全[けんぜん]な言葉[ことば]、すなわち、わたしたちの主[しゅ]イエス・キリストの言葉[ことば]と、敬虔[けいけん]に基[も]づく教[おし]えとに近[ちか]づこうとしない者[もの]は、"
  4: "高慢[こうまん]になっており、何[なに]も知[し]らず、質問[しつもん]と論争[ろんそう]について病[や]んでいる。そこから、妬[ねた]み、争[あらそ]い、冒涜[ぼうとく]、悪[あ]い疑[うたが]い、"
  5: "心[こころ]が腐[くさ]り、真理[しんり]を失[うしな]って、敬虔[けいけん]を利得[りとく]の手段[しゅだん]と考[かんが]える人[ひと]たちの間[あいだ]に、絶[た]え間[ま]ない摩擦[まさつ]が生[しょう]じる。〔そのような者[もの]たちから離[はな]れなさい。〕"
  6: "しかし、敬虔[けいけん]と自足[じそく]とは、大[おお]きな利得[りとく]である。"
  7: "というのは、わたしたちは何[なに]も世[よ]に持[も]ち込[こ]んでいないからである。〔何[なに]も持[も]ち出[だ]すこともできないのは明[あき]らかなことである。〕"
  8: "食物[しょくもつ]と着物[きもの]があれば、それで満足[まんぞく]しよう。"
  9: "しかし、富[とみ]を得[え]ようとする者[もの]たちは、誘惑[ゆうわく]と罠[わな]と、愚[おろ]かで有害[ゆうがい]な多[おお]くの欲望[よくぼう]に陥[おちい]る。それらは人[ひと]を滅[ほろ]びと破滅[はめつ]へと沈[しず]める。"
  10: "金銭欲[きんせんよく]はすべての悪[あく]の根[ね]だからである。ある人[ひと]たちはこれを求[もと]めて信仰[しんこう]から迷[まよ]い出[で]、多[おお]くの苦[くる]しみで自分[じぶん]を刺[さ]し貫[つらぬ]いた。"
  11: "しかし、神[かみ]の人[ひと]であるあなたは、これらのことから逃[に]げなさい。そして、義[ぎ]、敬虔[けいけん]、信仰[しんこう]、愛[あい]、忍耐[にんたい]、柔和[じゅうわ]を追[お]い求[もと]めなさい。"
  12: "信仰[しんこう]の良[よ]い戦[たたか]いを戦[たたか]い、永遠[えいえん]の命[いのち]をつかみなさい。あなたはその命[いのち]へと召[め]され、多[おお]くの証人[しょうにん]の前[まえ]で良[よ]い告白[こくはく]をしたのである。"
  13: "すべてのものに命[いのち]を与[あた]える神[かみ]と、ポンティオ・ピラトの前[まえ]で良[よ]い告白[こくはく]を証[あかし]されたキリスト・イエスの前[まえ]で、わたしはあなたに命[めい]じる。"
  14: "わたしたちの主[しゅ]イエス・キリストが現[あらわ]れるまで、この戒[いまし]めを、汚[けが]れなく、責[せ]められるところのないまま守[まも]りなさい。"
  15: "祝福[しゅくふく]された唯一[ゆいいつ]の主権者[しゅけんしゃ]、王[おう]たちの王[おう]、主[しゅ]たちの主[しゅ]である方[かた]が、ご自身[じしん]の時[とき]に、それを現[あらわ]される。"
  16: "この方[かた]だけが不死[ふし]を持[も]ち、近[ちか]づくことのできない光[ひかり]のうちに住[す]まわれる。人[ひと]のうちで、だれもこの方[かた]を見[み]たことがなく、見[み]ることもできない。この方[かた]に誉[ほま]れと永遠[えいえん]の力[ちから]があるように。アーメン。"
  17: "今[いま]、この世[よ]で富[と]んでいる者[もの]たちに命[めい]じなさい。高[たか]ぶることも、定[さだ]めのない富[とみ]に望[のぞ]みを置[お]くこともせず、わたしたちにすべてのものを豊[ゆた]かに与[あた]えて楽[たの]しませてくださる〔生[い]ける〕神[かみ]に望[のぞ]みを置[お]くように。"
  18: "善[ぜん]を行[おこな]い、良[よ]いわざに富[と]み、惜[お]しみなく施[ほどこ]し、共[とも]に分[わ]かち合[あ]う者[もの]となるように。"
  19: "そうして、将来[しょうらい]のための良[よ]い基[きそ]を自分[じぶん]のために蓄[たくわ]え、永遠[えいえん]の命[いのち]をつかむのである。"
  20: "テモテよ、あなたに委[ゆだ]ねられたものを守[まも]りなさい。俗悪[ぞくあく]な空[くう]言[げん]と、偽[いつわ]りに名[な]づけられた知識[ちしき]の反対論[はんたいろん]を避[さ]けなさい。"
  21: "ある人[ひと]たちはこれを唱[とな]えながら、信仰[しんこう]について的[まと]を外[はず]してしまった。{恵[めぐ]み|恩寵[おんちょう]}が、あなたとともにありますように。〔アーメン〕"

notes:
  1: "Ὅσοι εἰσὶν ὑπὸ ζυγὸν δοῦλοι — くびきの下にある奴隷たち (образ ярма, ср. Гал 5:1). τοὺς ἰδίους δεσπότας — 自分の主人 (δεσπότης — «господин, владелец»). πάσης τιμῆς ἀξίους ἡγείσθωσαν — すべての敬いを受けるに値する者と考えなさい. βλασφημῆται — 冒瀆される (о имени Божием и учении)."
  2: "οἱ δὲ πιστοὺς ἔχοντες δεσπότας — 信じる主人を持つ者たち. μὴ καταφρονείτωσαν, ὅτι ἀδελφοί εἰσιν — 兄弟だからといって軽んじてはならない. ἀλλὰ μᾶλλον δουλευέτωσαν — かえって、ますます仕えなさい. ὅτι πιστοί εἰσιν καὶ ἀγαπητοὶ οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι — 仕える相手が、信じる者であり、愛されている者、恩恵を受ける者だからである (εὐεργεσία — «благодеяние»; ἀντιλαμβάνομαι — «получать»; речь о самих господах). Ταῦτα δίδασκε καὶ παρακάλει — これらのことを教え、勧めなさい."
  3: "εἴ τις ἑτεροδιδασκαλεῖ — 異なる教えを説く (ἑτεροδιδασκαλέω — «учить иному»). μὴ προσέρχεται — 近づこうとしない. ὑγιαίνουσιν λόγοις — 健全な言葉 (ὑγιαίνω — «быть здоровым»; ср. 1:10; 2 Тим 1:13). τοῖς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ — 主イエス・キリストの言葉 (приложение, не родительный принадлежности). τῇ κατ᾽ εὐσέβειαν διδασκαλίᾳ — 敬虔に基づく教え."
  4: "τετύφωται — 高慢になって (τύφομαι — «дымиться, быть ослеплённым»). μηδὲν ἐπιστάμενος — 何も知らず. νοσῶν περὶ ζητήσεις καὶ λογομαχίας — 質問と論争について病んでいる (νοσέω — «болеть»; лексика болезни продолжает ὑγιαίνω ст. 3). ἐξ ὧν γίνεται φθόνος, ἔρις, βλασφημίαι, ὑπόνοιαι πονηραί — そこから、妬み、争い、冒瀆、悪い疑い (четыре члена сохранены)."
  5: "διαπαρατριβαί — «постоянные трения, взаимное раздражение»; 絶え間ない摩擦. διεφθαρμένων τὸν νοῦν — 心の腐った (διαφθείρω — «развращать»; νοῦς — 心). ἀπεστερημένων τῆς ἀληθείας — 真理を失った. νομιζόντων πορισμὸν εἶναι τὴν εὐσέβειαν — 敬虔を利得の手段と考える (πορισμός — «прибыток»). В базе стих кончается на εὐσέβειαν; церковный текст (Елизаветинская «отступай от таковых», jp-joc「爾是くの如き者より遠ざかれ」) добавляет ἀφίστασο ἀπὸ τῶν τοιούτων — 〔そのような者たちから離れなさい。〕. Проверено по базе: ἀφίστασο — 0, τοιούτων — 0."
  6: "ἔστιν δὲ πορισμὸς μέγας ἡ εὐσέβεια μετὰ αὐταρκείας — しかし、敬虔と自足とは、大きな利得である; порядок греческий сохранён, ἀυτάρκεια — «довольство тем, что есть», 自足. δέ противопоставляет ст. 5, поэтому しかし."
  7: "οὐδὲν γὰρ εἰσηνέγκαμεν εἰς τὸν κόσμον — わたしたちは何も世に持ち込んでいない. ἐξενεγκεῖν — 持ち出す. В базе стих кончается на δυνάμεθα; церковный текст (Елизаветинская «яве», jp-joc「明らかなり」) добавляет δῆλον — 〔…明らかなことである。〕. Проверено по базе: δῆλον — 0."
  8: "διατροφάς — 食物 (содержание, пропитание). σκεπάσματα — 着物 (одежда, покров). ἀρκεσθησόμεθα — 満足しよう (future pass. от ἀρκέω — «быть довольным»)."
  9: "οἱ βουλόμενοι πλουτεῖν — 富を得ようとする者たち. ἐμπίπτουσιν εἰς πειρασμὸν καὶ παγίδα — 誘惑と罠に陥る. ἐπιθυμίας πολλὰς ἀνοήτους καὶ βλαβεράς — 愚かで有害な多くの欲望 (два определения сохранены). βυθίζουσιν — 沈める. εἰς ὄλεθρον καὶ ἀπώλειαν — 滅びと破滅 (два слова не сведены в одно)."
  10: "ῥίζα γὰρ πάντων τῶν κακῶν ἐστιν ἡ φιλαργυρία — 金銭欲はすべての悪の根 (φιλαργυρία — «сребролюбие»). ἧς τινες ὀρεγόμενοι — ある人たちはこれを求めて (ὀρέγομαι — «стремиться»). ἀπεπλανήθησαν ἀπὸ τῆς πίστεως — 信仰から迷い出た. ἑαυτοὺς περιέπειραν ὀδύναις πολλαῖς — 多くの苦しみで自分を刺し貫いた (περιπείρω — «пронзать насквозь»; образ сохранён)."
  11: "ὦ ἄνθρωπε θεοῦ — 神の人 (титул, ср. 3 Цар 17:24; 2 Тим 3:17). ταῦτα φεῦγε — これらのことから逃げなさい. δίωκε — 追い求めなさい. Шесть членов сохранены: 義、敬虔、信仰、愛、忍耐、柔和 (πραϋπαθία — «кротость»; 柔和[じゅうわ] — слово корпуса, ср. 1 Кор 4:21)."
  12: "ἀγωνίζου τὸν καλὸν ἀγῶνα τῆς πίστεως — 信仰の良い戦いを戦いなさい (ср. 1:18; 2 Тим 4:7). ἐπιλαβοῦ τῆς αἰωνίου ζωῆς — 永遠の命をつかみなさい (つかむ — каной: 摑 не в 常用漢字, корпус пишет つかむ). εἰς ἣν ἐκλήθης — あなたはその命へと召され. ὡμολόγησας τὴν καλὴν ὁμολογίαν ἐνώπιον πολλῶν μαρτύρων — 多くの証人の前で良い告白をした (вероятно, при крещении или поставлении; не уточнено)."
  13: "παραγγέλλω [σοι] — 命じる; [σοι] в базе в квадратных скобках, слово есть, 〔〕 не ставятся. τοῦ ζῳογονοῦντος τὰ πάντα — すべてのものにいのちを与える (ζῳογονέω — «оживлять»). τοῦ μαρτυρήσαντος ἐπὶ Ποντίου Πιλάτου τὴν καλὴν ὁμολογίαν — ポンティオ・ピラトの前で良い告白を証しされた (ἐπί с род. — «перед»; ср. ст. 12)."
  14: "τηρῆσαί σε τὴν ἐντολὴν — 戒めを守りなさい (ἵνα-конструкция передана императивом, как в 1 Тим 5:21). ἄσπιλον ἀνεπίλημπτον — 汚れなく、責められるところのないまま (ἄσπιλος — «незапятнанный»). μέχρι τῆς ἐπιφανείας — 現れるまで (ἐπιφάνεια — «явление», ср. 2 Тим 4:1)."
  15: "ἣν καιροῖς ἰδίοις δείξει — ご自身の時に、それを現される (καιροῖς ἰδίοις — «в свои сроки»). ὁ μακάριος καὶ μόνος δυνάστης — 祝福された唯一の主権者 (δυνάστης — «властелин»). ὁ βασιλεὺς τῶν βασιλευόντων καὶ κύριος τῶν κυριευόντων — 王たちの王、主たちの主. Славословие Павла, не прямая речь Христа — не красное."
  16: "ὁ μόνος ἔχων ἀθανασίαν — ただひとり不死を持つ (ἀθανασία — 不死). φῶς οἰκῶν ἀπρόσιτον — 近づくことのできない光のうちに住まわれる (ἀπρόσιτος — «неприступный»). ὃν εἶδεν οὐδεὶς ἀνθρώπων οὐδὲ ἰδεῖν δύναται — だれも見たことがなく、見ることもできない. ᾧ τιμὴ καὶ κράτος αἰώνιον — この方に誉れと永遠の力があるように (κράτος — «держава, сила»). ἀμήν — アーメン (ср. 1:17)."
  17: "τοῖς πλουσίοις ἐν τῷ νῦν αἰῶνι — 今、この世で富んでいる者たち. μὴ ὑψηλοφρονεῖν — 高ぶる (ὑψηλοφρονέω — «высоко думать о себе»). ἠλπικέναι ἐπὶ πλούτου ἀδηλότητι — 定めのない富に望みを置く (ἀδηλότης — «ненадёжность»). ἐπὶ θεῷ τῷ παρέχοντι ἡμῖν πάντα πλουσίως εἰς ἀπόλαυσιν — すべてのものを豊かに与えて楽しませてくださる神に (ἀπόλαυσις — «наслаждение»). В базе ἐπὶ θεῷ без ζῶντι; церковный текст (Елизаветинская «Бога живаго», Синодальный «Бога живаго», jp-joc「活ける神」) читает ἐπὶ θεῷ ζῶντι — добавление Церкви: 〔生ける〕 (проверено по базе: ζῶντι — 0)."
  18: "ἀγαθοεργεῖν — 善を行う (ἀγαθοεργέω — «делать добро»). πλουτεῖν ἐν ἔργοις καλοῖς — 良いわざに富む. εὐμεταδότους εἶναι — 惜しみなく施す (εὐμετάδοτος — «щедро делящийся»). κοινωνικούς — 共に分かち合う (κοινωνικός — «общительный, готовый делиться»)."
  19: "ἀποθησαυρίζοντας ἑαυτοῖς — 自分のために蓄える (θησαυρίζω — «собирать сокровище»). θεμέλιον καλὸν εἰς τὸ μέλλον — 将来のための良い基 (θεμέλιος — «основание»). В базе τῆς ὄντως ζωῆς («действительно жизни»); церковный текст (Елизаветинская, Синодальный «жизнь вечную», jp-joc「永遠の生命」) читает τῆς αἰωνίου ζωῆς — 永遠の命; это замена, а не добавка, поэтому 〔〕 не ставятся (проверено по базе: αἰωνίου — 0, ὄντως — 1)."
  20: "ὦ Τιμόθεε — テモテよ. τὴν παραθήκην φύλαξον — あなたに委ねられたものを守りなさい (παραθήκη — «вверенное, депозит»; ср. 2 Тим 1:12,14). τὰς βεβήλους κενοφωνίας — 俗悪な空言 (κενοφωνία — «пустословие»). ἀντιθέσεις τῆς ψευδωνύμου γνώσεως — 偽りに名づけられた知識の反対論 (ἀντίθεσις — «противопоставление»; ψευδώνυμος — «ложно названный»)."
  21: "ἥν τινες ἐπαγγελλόμενοι — ある人たちはこれを唱えながら (ἐπαγγέλλομαι — «обещать, заявлять»). περὶ τὴν πίστιν ἠστόχησαν — 信仰について的を外した (ἀστοχέω — «промахиваться», ср. 1:6). Ἡ χάρις μεθ᾽ ὑμῶν — 恵みが、あなたとともに. В базе ὑμῶν (мн. ч.); церковный текст (Елизаветинская, Синодальный «с тобою», jp-joc「爾と偕に」) читает μετὰ σοῦ — принято церковное единственное число, あなた, замена без 〔〕 (проверено: ὑμῶν — 1, ὑμᾶς — 0). ἀμήν в базе нет; у Церкви (Елизаветинская, Синодальный, jp-joc「アミン」) он есть — 〔アーメン〕 (проверено: ἀμήν в 6:21 — 0; ср. 2 Кор 13:13)."
