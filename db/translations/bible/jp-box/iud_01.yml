verses:
  1: "イエス・キリストの僕[しもべ]であり、ヤコブの兄弟[きょうだい]であるユダから、父[ちち]である神[かみ]のうちに愛[あい]され、イエス・キリストに守[まも]られて召[め]された人[ひと]々[びと]へ。"
  2: "あわれみと平和[へいわ]と愛[あい]が、あなたがたに豊[ゆた]かに増[ま]し加[くわ]えられますように。"
  3: "愛[あい]する者[もの]たちよ、わたしたちが共[とも]に受[う]ける救[すく]いについて、あなたがたに書[か]き送[おく]ろうと、あらゆる努[つと]めを払[はら]っていたとき、わたしは、聖[せい]なる者[もの]たちに一度[いちど]だけ伝[つた]えられた信仰[しんこう]のために、力[ちから]を尽[つ]くして戦[たたか]うようあなたがたに勧[すす]める手紙[てがみ]を書[か]く必要[ひつよう]を感[かん]じたのである。"
  4: "というのは、ある人[ひと]々[びと]がひそかに入[はい]り込[こ]んだからである。彼[かれ]らは、昔[むかし]からこの裁[さば]きを受[う]ける者[もの]として定[さだ]められていた不敬虔[ふけいけん]な者[もの]たちで、わたしたちの神[かみ]の恵[めぐ]みを放縦[ほうじゅう]に変[か]え、わたしたちのただ一人[ひとり]の主人[しゅじん]また主[しゅ]であるイエス・キリストを否[いな]んでいる。"
  5: "あなたがたはすべてのことをすでに知[し]っているが、わたしはあなたがたに思[おも]い起[おこ]こしてほしい。主[しゅ]は民[たみ]をエジプトの地[ち]から救[すく]い出[だ]して後[のち]、信[しん]じなかった者[もの]たちを滅[ほろ]ぼされた。"
  6: "また、自分[じぶん]の位[くらい]を守[まも]らず、自分[じぶん]の住[す]みかを捨[す]てた天使[てんし]たちを、永遠[えいえん]の鎖[くさり]に縛[しば]って暗[くら]やみの下[した]に閉[と]じ込[こ]め、大[おお]いなる日[ひ]の裁[さば]きのために守[まも]っておられる。"
  7: "ソドム、ゴモラ、またその周[まわ]りの町[まち]々[まち]も、これらと同[おな]じように淫[いん]らにふるまい、ほかの肉[にく]を追[お]い求[もと]めたので、永遠[えいえん]の火[ひ]の罰[ばつ]を受[う]けて、見[み]せしめとして置[お]かれている。"
  8: "同[おな]じように、これらの夢[ゆめ]を見[み]る者[もの]たちも、肉[にく]を汚[けが]し、主権[しゅけん]を蔑[さげす]み、尊[とうと]い者[もの]たちをそしるのである。"
  9: "しかし、大天使[だいてんし]ミカエルは、悪魔[あくま]と論[ろん]じてモーセのからだのことで争[あらそ]ったとき、そしりの裁[さば]きを下[くだ]すことをあえてせず、「主[しゅ]があなたを叱[しか]られますように」と言[い]った。"
  10: "しかし、彼[かれ]らは、自分[じぶん]たちが知[し]らないことをそしる。また、理性[りせい]のない獣[けもの]が本能[ほんのう]によって知[し]っていることにおいて、彼[かれ]らは滅[ほろ]ぼされていくのである。"
  11: "彼[かれ]らは災[わざわ]いである。彼[かれ]らはカインの道[みち]を歩[あゆ]み、報酬[ほうしゅう]を求[もと]めてバラムの迷[まよ]いに流[なが]れ、コラの反抗[はんこう]によって滅[ほろ]びたのである。"
  12: "彼[かれ]らは、あなたがたの愛餐[あいさん]⟨信[しん]じる者[もの]たちが共[とも]に食[しょく]を分[わ]かち合[あ]う、愛[あい]の食事[しょくじ]。⟩に同席[どうせき]し、恐[おそ]れることなく自分[じぶん]を肥[こや]す、隠[かく]れた岩[いわ]のような者[もの]たちである。彼[かれ]らは風[かぜ]に吹[ふ]き流[なが]される水[みず]のない雲[くも]、実[み]を結[むす]ばず、二度[にど]死[し]んで根[ね]から抜[ぬ]かれた秋[あき]の木[き]であり、"
  13: "自分[じぶん]の恥[はじ]を泡[あわ]として吹[ふ]き上[あ]げる海[うみ]の荒[あら]れ波[なみ]であり、暗[くら]やみの濃[こ]い闇[やみ]が永遠[えいえん]に用意[ようい]されている迷[まよ]いの星[ほし]である。"
  14: "アダムから数[かぞ]えて七代目[ななだいめ]のエノクも、彼[かれ]らについて預言[よげん]して言[い]った。「見[み]よ、主[しゅ]は幾万[いくまん]もの聖[せい]なる者[もの]たちとともに来[こ]られ、"
  15: "すべての者[もの]を裁[さば]き、不敬虔[ふけいけん]な者[もの]たちを、その不敬虔[ふけいけん]の行[おこな]いのすべてと、不敬虔[ふけいけん]な罪人[ざいにん]たちがこの方[かた]に逆[さか]らって語[かた]ったすべての激[はげ]しい言葉[ことば]とについて責[せ]めるためである。」"
  16: "彼[かれ]らは不満[ふまん]を言[い]い、自分[じぶん]の運命[うんめい]を嘆[なげ]く者[もの]たちであり、自分[じぶん]の欲[よく]に従[したが]って歩[あゆ]み、その口[くち]は大[おお]げさなことを語[かた]り、利[り]のために人[ひと]にへつらうのである。"
  17: "しかし、愛[あい]する者[もの]たちよ、あなたがたは、わたしたちの主[しゅ]イエス・キリストの使徒[しと]たちが前[まえ]もって語[かた]った言葉[ことば]を思[おも]い起[おこ]こしなさい。"
  18: "彼[かれ]らはあなたがたに、「終[お]わりの時[とき]には、自分[じぶん]の不敬虔[ふけいけん]な欲[よく]に従[したが]って歩[あゆ]む嘲[あざけ]る者[もの]たちが現[あらわ]れる」と言[い]ったのである。"
  19: "彼[かれ]らは、分[わ]け隔[へだ]てを生[しょう]じる者[もの]たちであり、肉[にく]に属[ぞく]して、霊[れい]を持[も]たない者[もの]たちである。"
  20: "しかし、愛[あい]する者[もの]たちよ、あなたがたは、きわめて聖[せい]なるあなたがたの信仰[しんこう]の上[うえ]に自分[じぶん]を建[た]て、{聖霊[せいれい]|聖神[せいしん]}によって祈[いの]りつつ、"
  21: "神[かみ]の愛[あい]のうちに自分[じぶん]を守[まも]りなさい。永遠[えいえん]の命[いのち]へと導[みちび]く、わたしたちの主[しゅ]イエス・キリストのあわれみを待[ま]ち望[のぞ]みながら。"
  22: "また、ある人[ひと]々[びと]には、疑[うたが]いの中[なか]にある者[もの]たちをあわれみ、"
  23: "ある人[ひと]々[びと]は、火[ひ]の中[なか]から引[ひ]き出[だ]して救[すく]い、ある人[ひと]々[びと]は、恐[おそ]れをもってあわれみなさい。肉[にく]に汚[けが]された衣[ころも]さえも、忌[い]み嫌[きら]いなさい。"
  24: "あなたがたを守[まも]ってつまずかせず、傷[きず]のない者[もの]として、喜[よろこ]びのうちに、その栄光[えいこう]の前[まえ]に立[た]たせることができる方[かた]に、"
  25: "わたしたちの救[すく]い主[ぬし]であるただ一人[ひとり]の〔賢[けん]い〕神[かみ]に、わたしたちの主[しゅ]イエス・キリストを通[とお]して、栄光[えいこう]、威厳[いげん]、力[ちから]、権威[けんい]が、すべての世[よ]に先立[さきだ]って、また今[いま]も、世[よ]々[よ]限[かぎ]りなくありますように。アーメン。"

notes:
  1: "Ἰούδας Ἰησοῦ Χριστοῦ δοῦλος, ἀδελφὸς δὲ Ἰακώβου — イエス・キリストの僕であり、ヤコブの兄弟であるユダ (Ἰούδας — ユダ, Ἰάκωβος — ヤコブ, как в корпусе). τοῖς ἐν θεῷ πατρὶ ἠγαπημένοις — 父である神のうちに愛され. Ἰησοῦ Χριστῷ τετηρημένοις — イエス・キリストに守られて (τηρέω — «блюсти, хранить»). κλητοῖς — 召された者たち."
  2: "ἔλεος ὑμῖν καὶ εἰρήνη καὶ ἀγάπη πληθυνθείη — あわれみと平和と愛が…豊かに増し加えられますように (ἔλεος — あわれみ, как в корпусе; πληθύνω — «умножать»). Три члена сохранены, порядок греч. — тот же (ср. 1 Пет 1:2, 2 Пет 1:2)."
  3: "πᾶσαν σπουδὴν ποιούμενος γράφειν — あらゆる努めを払っていた (σπουδή — «усердие»). περὶ τῆς κοινῆς ἡμῶν σωτηρίας — わたしたちが共に受ける救い (κοινός — «общий»). ἀνάγκην ἔσχον γράψαι — 書く必要を感じた. ἐπαγωνίζεσθαι τῇ ἅπαξ παραδοθείσῃ τοῖς ἁγίοις πίστει — 聖なる者たちに一度だけ伝えられた信仰のために力を尽くして戦う (ἅπαξ — «раз и навсегда»; ἐπαγωνίζομαι — «подвизаться»). Дат. τοῖς ἁγίοις — адресат передачи, не «вера святых»."
  4: "παρεισέδυσαν γάρ τινες ἄνθρωποι — ある人々がひそかに入り込んだ (παρεισδύνω — «вкрадываться»). οἱ πάλαι προγεγραμμένοι εἰς τοῦτο τὸ κρίμα — 昔からこの裁きを受ける者として定められていた (προγράφω — «наперед написанные»). τὴν τοῦ θεοῦ ἡμῶν χάριτα μετατιθέντες εἰς ἀσέλγειαν — わたしたちの神の恵みを放縦に変え (μετατίθημι — «переменять»; χάριτα — acc. от χάρις). τὸν μόνον δεσπότην καὶ κύριον ἡμῶν Ἰησοῦν Χριστόν — ただ一人の主人また主であるイエス・キリスト (δεσπότης — 主人[しゅじん], как в 2 Пет 2:1)."
  5: "Ὑπομνῆσαι…βούλομαι — 思い起こしてほしい (βούλομαι — «желать»). εἰδότας ἅπαξ πάντα — すべてのことをすでに知っているが. Ἰησοῦς λαὸν ἐκ γῆς Αἰγύπτου σώσας — в базе Ἰησοῦς (проверено: ιησουσ — ЕСТЬ); церковный текст (Елизаветинская «Господа», jp-joc「主」) читает κύριος — принято 主, замена без 〔〕 (проверено: κυριος — НЕТ). τὸ δεύτερον τοὺς μὴ πιστεύσαντας ἀπώλεσεν — 後になって、信じなかった者たちを滅ぼされた."
  6: "ἀγγέλους…τοὺς μὴ τηρήσαντας τὴν ἑαυτῶν ἀρχήν — 自分の位を守らなかった天使たち (ἀρχή — «начальство, достоинство»; у jp-joc 本位). ἀπολιπόντας τὸ ἴδιον οἰκητήριον — 自分の住みかを捨てた (οἰκητήριον — «жилище»). δεσμοῖς ἀϊδίοις ὑπὸ ζόφον — 永遠の鎖に縛って暗やみの下に (ἀΐδιος — «вечный»). εἰς κρίσιν μεγάλης ἡμέρας — 大いなる日の裁きのために (ср. 2 Пет 2:4)."
  7: "Σόδομα καὶ Γόμορρα καὶ αἱ περὶ αὐτὰς πόλεις — ソドム、ゴモラ、またその周りの町々. τὸν ὅμοιον τρόπον τούτοις ἐκπορνεύσασαι — これらと同じように淫らにふるまい (ἐκπορνεύω — «блудодействовать»). ἀπελθοῦσαι ὀπίσω σαρκὸς ἑτέρας — ほかの肉を追い求めた («иная плоть»; ср. Быт 19; 2 Пет 2:10). πρόκεινται δεῖγμα — 見せしめとして置かれている. πυρὸς αἰωνίου δίκην ὑπέχουσαι — 永遠の火の罰を受けている (ὑπέχω δίκην — «нести наказание»)."
  8: "Ὁμοίως μέντοι καὶ οὗτοι ἐνυπνιαζόμενοι — 同じように、これらの夢を見る者たちも (ἐνυπνιάζομαι — «грезить, видеть сны»). σάρκα μὲν μιαίνουσιν — 肉を汚し. κυριότητα δὲ ἀθετοῦσιν — 主権を蔑み (ἀθετέω — «отвергать»). δόξας δὲ βλασφημοῦσιν — 尊い者たちをそしる (δόξαι — ангельские силы, «славы»; у jp-joc 尊者)."
  9: "ὁ δὲ Μιχαὴλ ὁ ἀρχάγγελος — 大天使ミカエル (ἀρχάγγελος — 大天使[だいてんし], как в 1 Сол 4:16; у jp-joc 天使首ミハイル). ὅτε τῷ διαβόλῳ διακρινόμενος διελέγετο περὶ τοῦ Μωϋσέως σώματος — 悪魔と論じてモーセのからだのことで争ったとき (διακρίνομαι — «спорить, судиться»; ср. Втор 34:6; апокриф «Успение Моисея»). οὐκ ἐτόλμησεν κρίσιν ἐπενεγκεῖν βλασφημίας — そしりの裁きを下すことをあえてせず (τολμάω — «дерзать»). Ἐπιτιμήσαι σοι κύριος — 主があなたを叱られるように (optative). Слова архангела, не Христа — не красное."
  10: "ὅσα μὲν οὐκ οἴδασιν βλασφημοῦσιν — 自分たちが知らないことをそしる. ὅσα δὲ φυσικῶς ὡς τὰ ἄλογα ζῷα ἐπίστανται — 本能によって知っていることにおいて (φυσικῶς — «по природе, инстинктивно»). ἐν τούτοις φθείρονται — 滅ぼされていく (ср. 2 Пет 2:12)."
  11: "οὐαὶ αὐτοῖς — 彼らは災いである (οὐαί — «горе»). τῇ ὁδῷ τοῦ Κάϊν ἐπορεύθησαν — カインの道を歩み (Быт 4:8–16). τῇ πλάνῃ τοῦ Βαλαὰμ μισθοῦ ἐξεχύθησαν — 報酬を求めてバラムの迷いに流れ (ἐκχέω в pass. — «увлекаться»; Числ 22–24; ср. Откр 2:14). τῇ ἀντιλογίᾳ τοῦ Κόρε ἀπώλοντο — コラの反抗によって滅びた (Числ 16; ἀντιλογία — «противоречие, мятеж»)."
  12: "οἱ ἐν ταῖς ἀγάπαις ὑμῶν σπιλάδες — あなたがたの愛餐の席に…隠れた岩のような者たち (σπιλάς — «подводный камень, риф»; ἀγάπη здесь — вечеря любви, 愛餐 — сноска, первое место в корпусе). συνευωχούμενοι ἀφόβως — 恐れることなく同席し. ἑαυτοὺς ποιμαίνοντες — 自分を肥やす (ποιμαίνω — «пасти»; ср. Иез 34). νεφέλαι ἄνυδροι ὑπὸ ἀνέμων παραφερόμεναι — 風に吹き流される水のない雲 (ср. 2 Пет 2:17). δένδρα φθινοπωρινὰ ἄκαρπα — 実を結ばない秋の木. δὶς ἀποθανόντα — 二度死んで. ἐκριζωθέντα — 根から抜かれた."
  13: "κύματα ἄγρια θαλάσσης ἐπαφρίζοντα τὰς ἑαυτῶν αἰσχύνας — 自分の恥を泡として吹き上げる海の荒れ波 (ἐπαφρίζω — «вскипать пеной»). ἀστέρες πλανῆται — 迷いの星 (πλανήτης — «блуждающий»). ὁ ζόφος τοῦ σκότους εἰς αἰῶνα τετήρηται — 暗やみの濃い闇が永遠に用意されている (ср. 2 Пет 2:17, где в базе εἰς αἰῶνα нет)."
  14: "ἕβδομος ἀπὸ Ἀδὰμ Ἑνώχ — アダムから数えて七代目のエノク. προεφήτευσεν…λέγων — 預言して言った. Ἰδοὺ ἦλθεν κύριος ἐν ἁγίαις μυριάσιν αὐτοῦ — 見よ、主は幾万もの聖なる者たちとともに来られ (μυριάς — «десятки тысяч, тьмы»; ср. Втор 33:2; 1 Енох 1:9). Пророчество Еноха — 「」; речь открыта здесь и закрыта в ст. 15."
  15: "ποιῆσαι κρίσιν κατὰ πάντων — すべての者を裁き. ἐλέγξαι πάντας τοὺς ἀσεβεῖς — 不敬虔な者たちを…責める (ἐλέγχω — «обличать»). περὶ πάντων τῶν ἔργων ἀσεβείας αὐτῶν ὧν ἠσέβησαν — その不敬虔の行いのすべてについて. περὶ πάντων τῶν σκληρῶν ὧν ἐλάλησαν κατ᾿ αὐτοῦ ἁμαρτωλοὶ ἀσεβεῖς — 不敬虔な罪人たちがこの方に逆らって語ったすべての激しい言葉について (σκληρός — «жёсткий, дерзкий»; ср. 1 Енох 1:9)."
  16: "γογγυσταί, μεμψίμοιροι — 不満を言い、自分の運命を嘆く者たち (γογγυστής — «ропотник»; μεμψίμοιρος — «ропщущий на свою долю»). κατὰ τὰς ἐπιθυμίας αὐτῶν πορευόμενοι — 自分の欲に従って歩み. τὸ στόμα αὐτῶν λαλεῖ ὑπέρογκα — その口は大げさなことを語り. θαυμάζοντες πρόσωπα ὠφελείας χάριν — 利のために人にへつらう (θαυμάζω πρόσωπον — «лицеприятствовать»; ὠφέλεια — «выгода»)."
  17: "Ὑμεῖς δέ, ἀγαπητοί — しかし、愛する者たちよ. μνήσθητε τῶν ῥημάτων τῶν προειρημένων ὑπὸ τῶν ἀποστόλων — 使徒たちが前もって語った言葉を思い起こしなさい. τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ — わたしたちの主イエス・キリストの (ср. 2 Пет 3:2)."
  18: "ἔλεγον ὑμῖν — 彼らはあなたがたに…と言った. Ἐπ᾿ ἐσχάτου [τοῦ] χρόνου — 終わりの時に ([τοῦ] в базе есть, 〔〕 не ставятся). ἔσονται ἐμπαῖκται — 嘲る者たちが現れる (ср. 2 Пет 3:3). κατὰ τὰς ἑαυτῶν ἐπιθυμίας πορευόμενοι τῶν ἀσεβειῶν — 自分の不敬虔な欲に従って歩む (род. τῶν ἀσεβειῶν — «нечестий»)."
  19: "οἱ ἀποδιορίζοντες — 分け隔てを生じる者たち (ἀποδιορίζω — «отделять, производить разделения»). ψυχικοί — 肉に属して (ψυχικός — «душевный, природный», противоположность πνευματικός; у jp-joc「靈に屬して」 — понято иначе). πνεῦμα μὴ ἔχοντες — 霊を持たない者たち (πνεῦμα без ἅγιον → 霊[れい])."
  20: "ἐποικοδομοῦντες ἑαυτοὺς τῇ ἁγιωτάτῃ ὑμῶν πίστει — きわめて聖なるあなたがたの信仰の上に自分を建て (ἐποικοδομέω — «надстраивать»; ἁγιώτατος — превосх. ст.). ἐν πνεύματι ἁγίῳ προσευχόμενοι — 聖霊によって祈りつつ (πνεῦμα ἅγιον — пара {聖霊|聖神})."
  21: "ἑαυτοὺς ἐν ἀγάπῃ θεοῦ τηρήσατε — 神の愛のうちに自分を守りなさい (τηρέω — императив). προσδεχόμενοι τὸ ἔλεος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ — わたしたちの主イエス・キリストのあわれみを待ち望みながら (προσδέχομαι — «ожидать»). εἰς ζωὴν αἰώνιον — 永遠の命へと導く."
  22: "οὓς μὲν ἐλεᾶτε διακρινομένους — ある人々には、疑いの中にある者たちをあわれみ (διακρίνω в pass. — «колебаться, сомневаться»). В базе ст. 22–23 — два члена; некоторые рукописи делят на три (ср. jp-joc), деление базы сохранено."
  23: "οὓς δὲ σῴζετε ἐκ πυρὸς ἁρπάζοντες — ある人々は、火の中から引き出して救い (ἁρπάζω — «выхватывать»). οὓς δὲ ἐλεᾶτε ἐν φόβῳ — ある人々は、恐れをもってあわれみ. μισοῦντες καὶ τὸν ἀπὸ τῆς σαρκὸς ἐσπιλωμένον χιτῶνα — 肉に汚された衣さえも忌み嫌いなさい (χιτών — «хитон, нижняя одежда»; ἐσπιλωμένον — «запятнанный»)."
  24: "Τῷ δὲ δυναμένῳ φυλάξαι ὑμᾶς ἀπταίστους — あなたがたを守ってつまずかせないことができる方に (ἄπταιστος — «непреткновенный»). στῆσαι κατενώπιον τῆς δόξης αὐτοῦ ἀμώμους ἐν ἀγαλλιάσει — 傷のない者として、喜びのうちに、その栄光の前に立たせることができる (ἀμώμητος — «непорочный»; ἀγαλλίασις — «ликование»)."
  25: "μόνῳ θεῷ σωτῆρι ἡμῶν — わたしたちの救い主であるただ一人の神に. διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν — わたしたちの主イエス・キリストを通して. δόξα μεγαλωσύνη κράτος καὶ ἐξουσία — 栄光、威厳、力、権威 (четыре члена). πρὸ παντὸς τοῦ αἰῶνος καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας — すべての世に先立って、また今も、世々限りなく. В базе нет σοφῷ, церковный текст (Елизаветинская «Единому премудрому Богу», jp-joc「獨一睿知の神」) его имеет — 〔賢い〕 (проверено по базе: σοφω — НЕТ; так как это добавление, а не замена, поставлены 〔〕). ἀμήν в базе есть — アーメン оставлен."
