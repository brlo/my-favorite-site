# jp-box, Соборное послание Иуды, глава 1. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 1 (единственная): надписание и приветствие (1–2), повод — общая вера (3),
# вкравшиеся нечестивцы (4), примеры суда — Египет, ангелы, Содом (5–7),
# Михаил и тело Моисея (8–9), скотское неразумие (10), Каин, Валаам, Коре (11),
# образы лжеучителей (12–13), пророчество Еноха (14–15), их портрет (16),
# память слов апостолов (17–19), назидание и милость к сомневающимся (20–23),
# славословие (24–25).
# Красного и синего нет: Михаил (1:9) — ангел, а не Христос; <j>/<mo> не ставятся.
# Цитаты в 「…」, без красного: 1:9 (слова архангела Михаила), 1:14–15 (пророчество
# Еноха: речь открыта в ст. 14 и закрыта в ст. 15), 1:18 (слова апостолов).
# 〔…〕 одно — 1:25: церковное σοφῷ («Единому премудрому Богу») в базе отсутствует
# (проверено по базе: σοφω — НЕТ), поэтому 賢[けん]い в скобках.
# Сноска ⟨…⟩ одна — 1:12 愛餐 (ἀγάπη), первое место в корпусе.
# 1:19 πνεῦμα без ἅγιον → 霊[れい] (не 聖霊). jp-ni не использовался.

