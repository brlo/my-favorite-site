# jp-box, Псалтирь, псалом 134. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0.
# Псалом 134: хвала имени Господню (1–3), избрание Иакова (4), величие Творца (5–7),
# исход и покорение царей (8–12), вечное имя и суд (13–14), ничтожество идолов (15–18),
# заключительная хвала (19–21).
# Красного и синего нет. Кавычки: слова Господа в 14 — 「…」 (по указанию о 134:14).
# 〔…〕 нет: перевод сделан по gr-lxx-byz, включая ст. 17, где база держит
# описание идола в квадратных скобках; добавлений Церкви не вносилось.
# セラ (διάψαλμα) в этой главе нет.
# Сносок ⟨…⟩ нет: 偶像, 銀, 金 уже в корпусе.
# jp-ni не использовался.

