verses:
  0: "アリルイヤ。"
  1: "主[しゅ]の名[な]をほめたたえよ。主[しゅ]の僕[しもべ]たちよ、主[しゅ]をほめたたえよ。"
  2: "主[しゅ]の家[いえ]に、わたしたちの神[かみ]の家[いえ]の庭[にわ]に立[た]つ者[もの]たちよ、主[しゅ]をほめたたえよ。"
  3: "主[しゅ]をほめたたえよ。主[しゅ]は善[よ]い方[かた]である。その名[な]に歌[うた]え。それは良[よ]いことだからである。"
  4: "主[しゅ]はヤコブをご自分[じぶん]のために選[えら]び、イスラエルをご自分[じぶん]の所有[しょゆう]として選[えら]ばれたからである。"
  5: "わたしは知[し]った。主[しゅ]は偉大[いだい]であり、わたしたちの主[しゅ]はすべての神[かみ]々[がみ]の上[うえ]におられる。"
  6: "主[しゅ]は天[てん]にも地[ち]にも、海[うみ]にもすべての深[ふか]みにも、望[のぞ]まれたことをすべて行[おこな]われた。"
  7: "主[しゅ]は地[ち]の果[は]てから雲[くも]を上[あ]げ、雨[あめ]のために稲妻[いなずま]を造[つく]り、その蔵[くら]から風[かぜ]を出[だ]される。"
  8: "主[しゅ]はエジプトの初[うい]子[ご]を、人[ひと]から家畜[かちく]に至[いた]るまで打[う]たれた。"
  9: "エジプトよ、主[しゅ]はあなたのただ中[なか]で、ファラオとそのすべての僕[しもべ]たちの上[うえ]に、しるしと奇[き]跡[せき]とを送[おく]られた。"
  10: "主[しゅ]は多[おお]くの民[たみ]を打[う]ち、強[つよ]い王[おう]たちを殺[ころ]された。"
  11: "すなわち、アモリ人[びと]の王[おう]シホン、バシャンの王[おう]オグ、そしてカナンのすべての王国[おうこく]である。"
  12: "主[しゅ]は彼[かれ]らの地[ち]を、ご自分[じぶん]の民[たみ]イスラエルの受[う]け継[つ]ぎとして与[あた]えられた。"
  13: "主[しゅ]よ、あなたの名[な]はとこしえにあり、主[しゅ]よ、あなたの記念[きねん]は代[よ]々[よ]に及[およ]ぶ。"
  14: "「主[しゅ]はご自分[じぶん]の民[たみ]を裁[さば]き、その僕[しもべ]たちをあわれまれる。」"
  15: "諸国[しょこく]の民[たみ]の偶像[ぐうぞう]は銀[ぎん]と金[きん]、人[ひと]の手[て]のわざである。"
  16: "口[くち]があっても語[かた]らず、目[め]があっても見[み]ない。"
  17: "耳[みみ]があっても聞[き]かず、鼻[はな]があってもにおわず、手[て]があっても触[さわ]らず、足[あし]があっても歩[あゆ]まず、喉[のど]で声[こえ]を出[だ]すこともない。その口[くち]には息[いき]がないからである。"
  18: "これらを造[つく]る者[もの]も、これらに寄[よ]り頼[たよ]む者[もの]も、すべてこれらと同じようになる。"
  19: "イスラエルの家[いえ]よ、主[しゅ]をほめたたえよ。アロンの家[いえ]よ、主[しゅ]をほめたたえよ。"
  20: "レビの家[いえ]よ、主[しゅ]をほめたたえよ。主[しゅ]を恐[おそ]れる者[もの]たちよ、主[しゅ]をほめたたえよ。"
  21: "シオンから、エルサレムに住[す]まわれる主[しゅ]は、ほめたたえられる。"

notes:
  0: "Αλληλουια — アリルイヤ (евр. הַלְלוּיָהּ «хвалите Господа»; в ru-базе «Аллилуия», у jp-joc アリルイヤ). Надписание — стих 0, скобками не маркируется; セラ в псалме нет."
  1: "Αἰνεῖτε τὸ ὄνομα κυρίου — 主の名をほめたたえよ (αἰνέω — «хвалить»; ὄνομα — 名). αἰνεῖτε, δοῦλοι, κύριον — 主の僕たちよ、主をほめたたえよ (повтор императива сохранён, как в греч.; δοῦλος — 僕)."
  2: "οἱ ἑστῶτες ἐν οἴκῳ κυρίου — 主の家に…立つ者たちよ (ἵστημι — «стоять»; продолжение звательного из ст. 1; сказуемое в греч. стихе не повторено, но по-японски стих должен читаться отдельно, поэтому императив 主をほめたたえよ повторён, как у jp-joc). ἐν αὐλαῖς οἴκου θεοῦ ἡμῶν — わたしたちの神の家の庭に (αὐλή — 庭, ср. 133:1)."
  3: "αἰνεῖτε τὸν κύριον, ὅτι ἀγαθὸς κύριος — 主をほめたたえよ。主は善い方である (ἀγαθός — «благой»; именное сказуемое). ψάλατε τῷ ὀνόματι αὐτοῦ — その名に歌え (ψάλλω — «петь под струны, псалмопеть»; датив «имени»). ὅτι καλόν — それは良いことだからである (καλόν — «хорошо, прекрасно», ср. 132:1)."
  4: "ὅτι τὸν Ιακωβ ἐξελέξατο ἑαυτῷ ὁ κύριος — 主はヤコブをご自分のために選び (ἐκλέγομαι — «избирать»; ἑαυτῷ — «Себе»). Ισραηλ εἰς περιουσιασμὸν αὐτοῦ — イスラエルをご自分の所有として選ばれた (περιουσιασμός — «собственное достояние, удел»; второй член параллелизма сохранён)."
  5: "ὅτι ἐγὼ ἔγνων — わたしは知った (γινώσκω — «знать, познать»; аорист — «узнал»). ὅτι μέγας κύριος — 主は偉大であり (μέγας — «великий»). καὶ ὁ κύριος ἡμῶν παρὰ πάντας τοὺς θεούς — わたしたちの主はすべての神々の上におられる (παρά + acc. — «выше, чем»; θεοί — 神々)."
  6: "πάντα, ὅσα ἠθέλησεν ὁ κύριος, ἐποίησεν — 主は望まれたことをすべて行われた (θέλω — «хотеть»; ποιέω — «делать»). ἐν τῷ οὐρανῷ καὶ ἐν τῇ γῇ — 天にも地にも (пара, ср. 120:2). ἐν ταῖς θαλάσσαις καὶ ἐν πάσαις ταῖς ἀβύσσοις — 海にもすべての深みにも (θάλασσα — 海; ἄβυσσος — «бездна», отсюда 深み). Четыре места сохранены в порядке греч."
  7: "ἀνάγων νεφέλας ἐξ ἐσχάτου τῆς γῆς — 地の果てから雲を上げ (ἀνάγω — «возводить, поднимать»; νεφέλη — 雲; ἔσχατον τῆς γῆς — «край земли»). ἀστραπὰς εἰς ὑετὸν ἐποίησεν — 雨のために稲妻を造り (ἀστραπή — «молния»; ὑετός — «дождь»; εἰς — «для»). ὁ ἐξάγων ἀνέμους ἐκ θησαυρῶν αὐτοῦ — その蔵から風を出される (ἐξάγω — «выводить»; θησαυρός — «сокровищница», отсюда 蔵)."
  8: "ὃς ἐπάταξεν τὰ πρωτότοκα Αἰγύπτου — 主はエジプトの初子を…打たれた (πατάσσω — «поражать»; πρωτότοκος — «первородный», 初子). ἀπὸ ἀνθρώπου ἕως κτήνους — 人から家畜に至るまで (κτῆνος — «скот»; диапазон «от… до» сохранён)."
  9: "ἐξαπέστειλεν σημεῖα καὶ τέρατα — しるしと奇跡とを送られた (σημεῖον — «знамение»; τέρας — «чудо»; два слова сохранены). ἐν μέσῳ σου, Αἴγυπτε — エジプトよ、あなたのただ中で (звательное в середине греч. фразы вынесено в начало). ἐν Φαραω καὶ ἐν πᾶσι τοῖς δούλοις αὐτοῦ — ファラオとそのすべての僕たちの上に (ἐν — «на, над»)."
  10: "ὃς ἐπάταξεν ἔθνη πολλὰ — 主は多くの民を打ち (ἔθνη — 民, мн. «народы»; πατάσσω, как в ст. 8). καὶ ἀπέκτεινεν βασιλεῖς κραταιούς — 強い王たちを殺された (ἀποκτείνω — «умерщвлять»; κραταιός — «крепкий, сильный»)."
  11: "τὸν Σηων βασιλέα τῶν Αμορραίων — アモリ人の王シホン (Σηων — Сигон/Сихон, シホン; Αμορραῖοι — アモリ人). καὶ τὸν Ωγ βασιλέα τῆς Βασαν — バシャンの王オグ (Ωγ — Ог; Βασαν — Васан, バシャン, как в 67:16). καὶ πάσας τὰς βασιλείας Χανααν — カナンのすべての王国 (Χανααν — Ханаан, カナン)."
  12: "καὶ ἔδωκεν τὴν γῆν αὐτῶν κληρονομίαν — 主は彼らの地を…受け継ぎとして与えられた (δίδωμι — «давать»; κληρονομία — «наследие», ср. 127:3). κληρονομίαν Ισραηλ λαῷ αὐτοῦ — ご自分の民イスラエルの受け継ぎとして (повтор κληρονομία сохранён повтором 受け継ぎ; λαῷ αὐτοῦ — «народу Своему»)."
  13: "κύριε, τὸ ὄνομά σου εἰς τὸν αἰῶνα — 主よ、あなたの名はとこしえにあり (εἰς τὸν αἰῶνα — «во век»). κύριε, τὸ μνημόσυνόν σου εἰς γενεὰν καὶ γενεάν — 主よ、あなたの記念は代々に及ぶ (μνημόσυνον — «память, памятование»; γενεὰ καὶ γενεά — «род и род», отсюда 代々). Двойное κύριε сохранено, как в греч."
  14: "ὅτι κρινεῖ κύριος τὸν λαὸν αὐτοῦ — 「主はご自分の民を裁き (κρίνω — «судить»; λαός — 民). καὶ ἐπὶ τοῖς δούλοις αὐτοῦ παρακληθήσεται — その僕たちをあわれまれる (παρακαλέομαι ἐπί + dat. — «умилосердиться над», букв. «утешиться о рабах Своих»). По указанию о 134:14 эти слова Господа даны прямой речью — 「…」; красного нет: это слово Ветхого Завета, а не евангельская речь Христа."
  15: "τὰ εἴδωλα τῶν ἐθνῶν — 諸国の民の偶像 (εἴδωλον — 偶像; ἔθνη — 諸国の民). ἀργύριον καὶ χρυσίον — 銀と金 (ἀργύριον — «серебро»; χρυσίον — «золото»; порядок греч. сохранён). ἔργα χειρῶν ἀνθρώπων — 人の手のわざである (ἔργον — «дело, изделие»; χείρ — 手)."
  16: "στόμα ἔχουσιν καὶ οὐ λαλήσουσιν — 口があっても語らず (στόμα — 口; λαλέω — «говорить»). ὀφθαλμοὺς ἔχουσιν καὶ οὐκ ὄψονται — 目があっても見ない (ὀφθαλμός — 目; ὁράω — «видеть»). Конструкция «есть — и не» сохранена в обоих членах."
  17: "ὦτα ἔχουσιν καὶ οὐκ ἐνωτισθήσονται — 耳があっても聞かず (οὖς — 耳; ἐνωτίζομαι — «внимать, слышать»). В квадратных скобках базы стоят ещё члены: ῥῖνας… οὐκ ὀσφρανθῆσονται (鼻…におわず), χεῖρας… οὐ ψηλαφήσουσιν (手…触らず), πόδας… οὐ περιπατήσουσιν (足…歩まず), οὐ φωνήσουσιν ἐν τῷ λάρυγγι αὐτῶν (喉で声を出すこともない). Раз они есть в gr-lxx-byz, 〔…〕 не ставятся; критическое издание держит их в квадратных скобках — это отмечено здесь. οὐδὲ γάρ ἐστιν πνεῦμα ἐν τῷ στόματι αὐτῶν — その口には息がないからである (πνεῦμα здесь — «дыхание», а не «дух», поэтому 息, а не 霊)."
  18: "ὅμοιοι αὐτοῖς γένοιντο — これらと同じようになる (ὅμοιος — «подобный»; γένοιντο — оптатив, пожелание-проклятие). οἱ ποιοῦντες αὐτὰ — これらを造る者も (ποιέω — «делать»). καὶ πάντες οἱ πεποιθότες ἐπ' αὐτοῖς — これらに寄り頼む者も、すべて (πείθω в perfect — «положившиеся», ср. 2:12; 124:1)."
  19: "οἶκος Ισραηλ, εὐλογήσατε τὸν κύριον — イスラエルの家よ、主をほめたたえよ (οἶκος — «дом» как род; εὐλογέω — «благословлять, хвалить»). οἶκος Ααρων, εὐλογήσατε τὸν κύριον — アロンの家よ、主をほめたたえよ (повтор императива сохранён, как и в греч. — литания)."
  20: "οἶκος Λευι, εὐλογήσατε τὸν κύριον — レビの家よ、主をほめたたえよ (Λευι — Левий, レビ; священническое колено). οἱ φοβούμενοι τὸν κύριον — 主を恐れる者たちよ (φοβέομαι — «бояться», ср. 127:2). εὐλογήσατε τὸν κύριον — 主をほめたたえよ (третий повтор императива в литании)."
  21: "εὐλογητὸς κύριος ἐκ Σιων — シオンから…主は、ほめたたえられる (εὐλογητός — «благословен»; ἐκ Σιων — от Сиона, где храм). ὁ κατοικῶν Ιερουσαλημ — エルサレムに住まわれる方 (κατοικέω — «обитать»). В базе стих кончается здесь; «Аллилуия», которое стоит в ru-базе и у jp-joc, в gr-lxx-byz отсутствует, поэтому не добавлено (оно есть в стихе 0)."
