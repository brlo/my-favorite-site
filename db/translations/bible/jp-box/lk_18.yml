verses:
  1: "イエスは、いつでも祈[いの]り、くじけてはならないことを示[しめ]すために、彼[かれ]らにたとえを語[かた]られた。"
  2: "「<j>ある町[まち]に、神[かみ]を恐[おそ]れず、人[ひと]を恥[は]じない裁判官[さいばんかん]がいた。</j>"
  3: "<j>その町[まち]にやもめが一人[ひとり]いて、その人[ひと]のもとへ来[き]ては、『わたしを、わたしの相手[あいて]から守[まも]ってください』と言[い]っていた。</j>"
  4: "<j>裁判官[さいばんかん]はしばらくの間[あいだ]、応[おう]じようとしなかった。しかし、その後[のち]、心[こころ]の中[なか]で言[い]った。『わたしは神[かみ]を恐[おそ]れず、人[ひと]を恥[は]じないが、</j>"
  5: "<j>このやもめが煩[わずら]わすので、彼女[かのじょ]のために裁[さば]きをしてやろう。そうでなければ、彼女[かのじょ]はいつまでも来[き]続[つづ]けて、わたしを疲[つか]れ果[は]てさせるだろう』。</j>」"
  6: "主[しゅ]は言[い]われた。「<j>この不正[ふせい]な裁判官[さいばんかん]が言[い]うことを聞[き]きなさい。</j>"
  7: "<j>まして神[かみ]は、昼[ひる]も夜[よる]も神[かみ]に叫[さけ]び求[もと]める選[えら]ばれた者[もの]たちのために、正[ただ]しい裁[さば]きをなさらないことがあろうか。彼[かれ]らを長[なが]く待[ま]たせておられるのだろうか。</j>"
  8: "<j>あなたがたに言[い]う。神[かみ]は彼[かれ]らのために、速[すみや]かに正[ただ]しい裁[さば]きをなさる。しかし、人[ひと]の子[こ]が来[き]たとき、地上[ちじょう]に信仰[しんこう]を見[み]つけるだろうか。</j>」"
  9: "自分[じぶん]を正[ただ]しい者[もの]と信[しん]じ、ほかの人[ひと]たちを見下[みくだ]している者[もの]たちにも、イエスはこのたとえを語[かた]られた。"
  10: "「<j>二人[ふたり]の人[ひと]が、祈[いの]りのために神殿[しんでん]に上[のぼ]った。一人[ひとり]はファリサイ派[は]、もう一人[ひとり]は徴税人[ちょうぜいにん]であった。</j>"
  11: "<j>ファリサイ派[は]の者[もの]は立[た]って、心[こころ]の中[なか]でこう祈[いの]った。『神[かみ]よ、わたしがほかの人[ひと]たちのように、強盗[ごうとう]や不正[ふせい]な者[もの]、姦淫[かんいん]をする者[もの]でなく、またこの徴税人[ちょうぜいにん]のようでもないことを、あなたに感謝[かんしゃ]します。</j>"
  12: "<j>わたしは週[しゅう]に二度[にど]、断食[だんじつ]し、手[て]に入[はい]れるものはすべて十[じゅう]分[ぶん]の一[いち]を納[おさ]めています』。</j>"
  13: "<j>ところが、徴税人[ちょうぜいにん]は遠[とお]くに立[た]ったまま、目[め]を天[てん]に上[あ]げることもせず、胸[むね]を打[う]ちながら言[い]った。『神[かみ]よ、罪人[ざいにん]であるわたしを憐[あわ]れんでください』。</j>"
  14: "<j>あなたがたに言[い]う。この人[ひと]は、あの人[ひと]よりは正[ただ]しい者[もの]とされて、家[いえ]へ帰[かえ]って行[い]った。おのれを高[たか]くする者[もの]はみな低[ひく]くされ、おのれを低[ひく]くする者[もの]は高[たか]くされるのである。</j>」"
  15: "人々[ひとびと]は、イエスが幼子[おさなご]たちに触[ふ]れるために、その子[こ]たちを連[つ]れて来[き]た。弟子[でし]たちはそれを見[み]て、たしなめた。"
  16: "しかし、イエスは幼子[おさなご]たちを呼[よ]び寄[よ]せて言[い]われた。「<j>子[こ]どもたちをわたしのところへ来[こ]させなさい。止[と]めてはならない。神[かみ]の国[くに]は、このような者[もの]たちのものである。</j>"
  17: "<j>はっきり言[い]っておく。神[かみ]の国[くに]を子[こ]どものように受[う]け入[い]れない者[もの]は、そこに入[はい]れない。</j>」"
  18: "ある指導者[しどうしゃ]がイエスに尋[たず]ねた。「善[よ]い先生[せんせい]、永遠[えいえん]の命[いのち]を受[う]け継[つ]ぐには、何[なに]をしたらよいのでしょうか。」"
  19: "イエスは言[い]われた。「<j>なぜ、わたしのことを善[よ]いと言[い]うのか。善[よ]い者[もの]は神[かみ]のほかにいない。</j>"
  20: "<j>あなたは掟[おきて]を知[し]っている。『姦淫[かんいん]するな』『殺[ころ]すな』『盗[ぬす]むな』『偽[いつわ]りの証[あかし]を立[た]てるな』『父[ちち]と母[はは]を敬[うやま]え』。</j>」"
  21: "指導者[しどうしゃ]は言[い]った。「そのようなことはみな、若[わか]い時[とき]から守[まも]ってきました。」"
  22: "イエスはこれを聞[き]いて言[い]われた。「<j>あなたにまだ一[ひと]つ足[た]りないものがある。持[も]っているものをすべて売[う]り払[はら]って、貧[まず]しい人[ひと]たちに分[わ]け与[あた]えなさい。そうすれば、天[てん]に宝[たから]を積[つ]むことができる。それから、わたしに従[したが]って来[き]なさい。</j>」"
  23: "彼[かれ]はこれを聞[き]いて、ひどく悲[かな]しんだ。非常[ひじょう]に富[とみ]を持[も]っていたからである。"
  24: "イエスは彼[かれ]が〔ひどく悲[かな]しんで〕いるのをご覧[らん]になって言[い]われた。「<j>富[とみ]を持[も]つ者[もの]が神[かみ]の国[くに]に入[はい]るのは、なんと難[むずか]しいことか。</j>"
  25: "<j>らくだが針[はり]の穴[あな]をくぐるほうが、富[とみ]を持[も]つ者[もの]が神[かみ]の国[くに]に入[はい]るよりも、まだ易[やさ]しい。</j>」"
  26: "これを聞[き]いた人々[ひとびと]は言[い]った。「それでは、だれが救[すく]われるのだろうか。」"
  27: "イエスは言[い]われた。「<j>人[ひと]にとって不可能[ふかのう]なことも、神[かみ]には可能[かのう]である。</j>」"
  28: "ペトロが言[い]った。「ご覧[らん]ください。わたしたちは自分[じぶん]のものすべてを捨[す]てて、あなたに従[したが]ってきました。」"
  29: "イエスは言[い]われた。「<j>はっきり言[い]っておく。神[かみ]の国[くに]のために、家[いえ]を、父母[ふぼ]を、兄弟[きょうだい]を、妻[つま]を、子[こ]どもを捨[す]てた者[もの]で、</j>"
  30: "<j>この時代[じだい]に何倍[なんばい]にもなって受[う]け、来[く]るべき世[よ]では永遠[えいえん]の命[いのち]を受[う]けない者[もの]は、一人[ひとり]もいない。</j>」"
  31: "イエスは十二人[じゅうににん]をそばに呼[よ]んで言[い]われた。「<j>見[み]よ、わたしたちはエルサレムへ上[のぼ]る。預言者[よげんしゃ]たちによって人[ひと]の子[こ]について書[か]かれたことは、すべて成就[じょうじゅ]する。</j>"
  32: "<j>人[ひと]の子[こ]は異邦人[いほうじん]に引[ひ]き渡[わた]され、嘲[あざけ]られ、辱[はずかし]められ、唾[つば]をかけられ、</j>"
  33: "<j>鞭[むち]で打[う]たれて殺[ころ]され、三日[みっか]目[め]に復活[ふっかつ]する。</j>」"
  34: "しかし、彼[かれ]らはこれらのことを何[なに]一[ひと]つ理解[りかい]できず、この言葉[ことば]は彼[かれ]らから隠[かく]されていて、言[い]われていることの意味[いみ]が分[わ]からなかった。"
  35: "イエスがエリコに近[ちか]づかれたとき、目[め]の見[み]えない人[ひと]が一人[ひとり]、道[みち]のそばに座[すわ]って物乞[ものご]いをしていた。"
  36: "群衆[ぐんしゅう]が通[とお]り過[す]ぎるのを聞[き]いて、何[なに]ごとかと尋[たず]ねた。"
  37: "人々[ひとびと]は、ナザレのイエスが通[とお]り過[す]ぎると告[つ]げた。"
  38: "彼[かれ]は叫[さけ]んで言[い]った。「イエス、ダビデの子[こ]よ、わたしを憐[あわ]れんでください。」"
  39: "前[まえ]を行[ゆ]く者[もの]たちは、黙[だま]っているようにと彼[かれ]をたしなめた。しかし、彼[かれ]はいよいよ大[おお]きな声[こえ]で叫[さけ]んだ。「ダビデの子[こ]よ、わたしを憐[あわ]れんでください。」"
  40: "イエスは足[あし]を止[と]めて、その人[ひと]を連[つ]れて来[く]るように命[めい]じられた。その人[ひと]が近[ちか]づくと、イエスは尋[たず]ねられた。"
  41: "「<j>わたしに何[なに]をしてほしいのか。</j>」彼[かれ]は言[い]った。「主[しゅ]よ、見[み]えるようになることです。」"
  42: "イエスは言[い]われた。「<j>見[み]えるようになれ。あなたの信仰[しんこう]があなたを救[すく]ったのだ。</j>」"
  43: "彼[かれ]はたちまち見[み]えるようになり、神[かみ]を賛美[さんび]しながらイエスに従[したが]った。人々[ひとびと]はみな、これを見[み]て神[かみ]を賛美[さんび]した。"

notes:
  1: "ἐγκακεῖν — «унывать, изнемогать»; くじける. Притча о настойчивой вдове (1–8) сказана «им» — ученикам."
  3: "ἐκδικέω — «защитить, отомстить»; в 3 передано 守る, в 5 — 裁きをする; юридический оттенок сохранён, без сглаживания в «помочь»."
  4: "ἐν ἑαυτῷ — «в себе»; 心の中で. ἐντρέπομαι — «стыдиться»; 恥じる."
  7: "καὶ μακροθυμεῖ ἐπ᾽ αὐτοῖς — букв. «и долготерпит о них»; передано 長く待たせておられる, вопросительная форма сохранена. У Синодального «медлит»."
  8: "ἐν τάχει — 速やかに. πλήν — しかし. «Найдёт ли веру» — вопрос без ответа, как в греческом."
  11: "πρὸς ἑαυτὸν — «про себя, сам себе»; 心の中で. Перечисление грехов оставлено без смягчения."
  12: "δὶς τοῦ σαββάτου — «дважды в неделю»; 週に二度 (не «дважды в субботу»). ἀποδεκατῶ — 十分の一を納める."
  13: "ἱλάσθητί μοι τῷ ἁμαρτωλῷ — «будь милостив ко мне, грешнику»; 罪人であるわたしを憐れんでください."
  14: "δεδικαιωμένος — «оправданным»; 正しい者とされて. παρ᾽ ἐκεῖνον — «более, чем тот»; あの人よりは."
  15: "βρέφη — 幼子 (не «дети» вообще); в 16 παιδία — 子どもたち. ἐπετίμων αὐτοῖς — укоряли приносивших; 連れて来た者たちをたしなめた."
  18: "ἄρχων — «начальник, один из начальствующих»; ある指導者 (как Мф 9:18 для ἄρχων). Не «юноша»: у Луки юность не упомянута; богатство — в 18:23."
  20: "Состав и порядок заповедей — как у Луки, без «не обманывай» (которая есть в Мк 10:19)."
  22: "πώλησον καὶ διάδος — «продай и раздай»; 売り払って分け与え. У Луки нет «возьми крест» (ср. Мк 10:21) — не добавляю."
  24: "περίλυπον γενόμενον в критическом тексте под скобками; Церковь читает — 〔ひどく悲しんで〕."
  25: "κάμηλος — らくだ; τρῆμα βελόνης — 針の穴."
  29: "Порядок церковного текста: 家、父母、兄弟、妻、子 (Елизаветинская «дом, или родителей, или братию, или жену, или чада»); в критическом иначе: дом, жену, братьев, родителей, детей. У jp-joc добавлены 姉妹 — в греческом их нет, не включаю."
  31: "τὰ γεγραμμένα διὰ τῶν προφητῶν — «написанное через пророков»; 預言者たちによって書かれたこと. Третье предсказание (31–34)."
  34: "οὐδὲν συνῆκαν — 何一つ理解できず; τὸ ῥῆμα κεκρυμμένον — 言葉は隠されていて. Непонимание учеников не сглажено."
