verses:
  1: "イサクはヤコブを呼[よ]び寄[よ]せて祝福[しゅくふく]し、命[めい]じて言[い]った。「カナンの娘[むすめ]たちの中[なか]から妻[つま]を迎[むか]えてはならない。"
  2: "立[た]って、メソポタミアへ、母[はは]の父[ちち]ベトエルの家[いえ]へ逃[に]げて行[ゆ]き、そこから、母[はは]の兄[あに]ラバンの娘[むすめ]たちの中[なか]から、自分[じぶん]の妻[つま]を迎[むか]えなさい。"
  3: "わたしの神[かみ]があなたを祝福[しゅくふく]し、あなたを大[おお]きくし、あなたを多[おお]くしてくださるように。あなたはもろもろの民[たみ]の集[あつ]まりとなる。"
  4: "また、父[ちち]アブラハムの祝福[しゅくふく]を、あなたと、あなたの後[あと]の子孫[しそん]に与[あた]え、あなたが、神[かみ]がアブラハムに与[あた]えられた寄留[きりゅう]の地[ち]を受[う]け継[つ]ぐように。」"
  5: "イサクはヤコブを送[おく]り出[だ]した。ヤコブはメソポタミアへ、シリア人[じん]ベトエルの子[こ]ラバン、すなわちヤコブとエサウの母[はは]リベカの兄[あに]のもとへ向[む]かった。"
  6: "エサウは、イサクがヤコブを祝福[しゅくふく]し、妻[つま]を迎[むか]えさせようとシリアのメソポタミアへ行[い]かせたこと、また、彼[かれ]を祝福[しゅくふく]するとき「カナンの娘[むすめ]たちのうちから妻[つま]を迎[むか]えてはならない」と命[めい]じたことを見[み]た。"
  7: "ヤコブは父[ちち]と母[はは]の声[こえ]に従[したが]って、シリアのメソポタミアへ行[い]った。"
  8: "エサウは、カナンの娘[むすめ]たちが父[ちち]イサクの目[め]に悪[わる]く映[うつ]るのを見[み]た。"
  9: "エサウはイシュマエルのもとへ行[い]き、アブラハムの子[こ]イシュマエルの娘[むすめ]、ナベヨトの妹[いもうと]マハラトを、自分の妻[つま]たちのほかに妻[つま]として迎[むか]えた。"
  10: "ヤコブは誓[ちか]いの井戸[いど]から出[で]て、ハランへ向[む]かった。"
  11: "ある場所[ばしょ]に着[つ]いて、そこに宿[やど]った。日[ひ]が沈[しず]んでいたからである。彼[かれ]はその場所[ばしょ]の石[いし]を取[と]って枕[まくら]とし、その場所[ばしょ]で眠[ねむ]った。"
  12: "彼[かれ]は夢[ゆめ]を見[み]た。見[み]よ、天[てん]のはしごが地[ち]に立[た]ち、その頂[いただき]は天[てん]に届[とど]いていた。神[かみ]の天使[てんし]たちが、それを上[のぼ]り下[くだ]りしていた。"
  13: "主[しゅ]はその上[うえ]に立[た]って言[い]われた。「わたしは主[しゅ]、あなたの父[ちち]アブラハムの神[かみ]、イサクの神[かみ]である。恐[おそ]れてはならない。あなたがその上[うえ]に寝[ね]ているこの地[ち]を、あなたとあなたの子孫[しそん]に与[あた]えよう。"
  14: "あなたの子孫[しそん]は地[ち]の砂[すな]のようになり、海[うみ]に、南[みなみ]に、北[きた]に、東[ひがし]に広[ひろ]がる。地[ち]のすべての部族[ぶぞく]は、あなたによって、またあなたの子孫[しそん]によって祝福[しゅくふく]される。"
  15: "見[み]よ、わたしはあなたとともにいて、あなたがどこへ行[い]っても、そのすべての道[みち]であなたを守[まも]り、あなたをこの地[ち]に帰[かえ]らせる。わたしがあなたに語[かた]ったすべてのことを成[な]し遂[と]げるまで、あなたを捨[す]て置[お]きはしないからである。」"
  16: "ヤコブは眠[ねむ]りから覚[さ]めて言[い]った。「主[しゅ]はこの場所[ばしょ]におられる。それなのに、わたしは知[し]らなかった。」"
  17: "彼[かれ]は恐[おそ]れて言[い]った。「この場所[ばしょ]はなんと恐[おそ]ろしいことか。ここはほかでもない、神[かみ]の家[いえ]であり、天[てん]の門[もん]である。」"
  18: "ヤコブは朝[あさ]早[はや]く起[お]き、枕[まくら]としてそこに置[お]いた石[いし]を取[と]って石柱[いしばしら]として立[た]て、その頂[いただき]に油[あぶら]を注[そそ]いだ。"
  19: "ヤコブはその場所[ばしょ]の名[な]を「神[かみ]の家[いえ]」、すなわちベテルと名[な]づけた。その町[まち]の名[な]は、以前[いぜん]はウラムルスであった。"
  20: "ヤコブは誓[ちか]いを立[た]てて言[い]った。「神[かみ]である主[しゅ]がわたしとともにいて、わたしが歩[あゆ]むこの道[みち]でわたしを守[まも]り、食[た]べるパンと着[き]る衣[ころも]をわたしに与[あた]え、"
  21: "わたしを無事[ぶじ]に父[ちち]の家[いえ]へ帰[かえ]らせてくださるなら、主[しゅ]はわたしの神[かみ]となる。"
  22: "また、わたしが石柱[いしばしら]として立[た]てたこの石[いし]は、神[かみ]の家[いえ]となる。あなたがわたしに与[あた]えてくださるすべてのものから、わたしは十分[じゅうぶん]の一[いち]をあなたに納[おさ]める。」"

notes:
  1: "προσκαλεσάμενος — 呼び寄せて (προσκαλέομαι). ἐνετείλατο αὐτῷ λέγων — 命じて言った (ἐντέλλομαι — «заповедовать»). Οὐ λήμψῃ γυναῖκα ἐκ τῶν θυγατέρων Χανααν — カナンの娘たちの中から妻を迎えてはならない (λαμβάνω γυναῖκα — «брать в жёны», семитизм)."
  2: "ἀπόδραθι — 逃げて行き (ἀποδιδράσκω, «убежать»; не «пойди»: Ревекка уже говорила «беги», 27:43). εἰς τὸν οἶκον Βαθουηλ — ベトエルの家へ (Бетуэль — дед Иакова по матери). λαβὲ σεαυτῷ ἐκεῖθεν γυναῖκα — そこから自分の妻を迎えなさい (λαβέ — императив; σεαυτῷ — «себе»)."
  3: "ὁ δὲ θεός μου — わたしの神 (LXX; масоретский текст: «Бог Всемогущий», שַׁדַּי; слав. тоже «Бог мой»). εὐλογήσαι… αὐξήσαι… πληθύναι — оптативы: 祝福し…大きくし…多くしてくださるように. ἔσῃ εἰς συναγωγὰς ἐθνῶν — もろもろの民の集まりとなる (συναγωγή — «собрание»; слав. «в собрания языков»; Синодальный с масоретского: «множество народов»)."
  4: "δῴη — да даст (оптатив; подлежащее — «Бог мой» из ст. 3, поэтому в японском одна конструкция на два стиха). κληρονομῆσαι — 受け継ぐ (инфинитив цели). γῆ τῆς παροικήσεώς σου — 寄留の地 (παροίκησις — «жительство пришельца, странничество»). ἣν ἔδωκεν ὁ θεὸς τῷ Αβρααμ — 神がアブラハムに与えられた地."
  5: "ἀπέστειλεν — 送り出した (ἀποστέλλω). τοῦ Σύρου — シリア人 (букв. «сириянин»; евр. «арамей»). ἀδελφὸν δὲ Ρεβεκκας — リベカの兄: Лаван назван братом Ревекки, то есть дядей Иакова (ср. 24:29)."
  6: "ἀπῴχετο — 行かせた (ᾤχετο, «ушёл»; здесь в значении «отправил», ср. слав. «посла»). ἐν τῷ εὐλογεῖν αὐτόν — 祝福するとき (временной оборот с инфинитивом). Повтор запрета дословно, как в LXX."
  7: "ἤκουσεν τοῦ πατρὸς καὶ τῆς μητρός — 父と母の声に従って (ἀκούω с родительным — «слушаться, внимать»)."
  8: "πονηραί εἰσιν… ἐναντίον Ισαακ — 父イサクの目に悪く映る (букв. «злы пред Исааком»; πονηρός здесь о неугодности, а не о нравственном зле)."
  9: "πρὸς τοῖς γυναιξὶν αὐτοῦ — 自分の妻たちのほかに (πρός с дательным — «в добавление к»). Μαελεθ, Ναβαιωθ — マハラト, ナベヨト (в LXX Μαελεθ, Ναβαιωθ; в Синодальном Махалафа, Наваиоф)."
  10: "φρέαρ τοῦ ὅρκου — 誓いの井戸 (букв. «колодец клятвы»; евр. Беэр-Шева, ベエル・シェバ, то есть Вирсавия). LXX передаёт имя переводом, поэтому в тексте перевод, а не транслитерация."
  11: "ἀπήντησεν τόπῳ — ある場所に着いて (ἀπαντάω — «достичь, встретить»). ἔδυ γὰρ ὁ ἥλιος — 日が沈んでいたからである. πρὸς κεφαλῆς αὐτοῦ — 枕として (букв. «к голове своей»). ἐκοιμήθη дважды (宿った…眠った) — повтор сохранён."
  12: "ἐνυπνιάσθη — 夢を見た (ἐνυπνιάζομαι). κλῖμαξ ἐστηριγμένη ἐν τῇ γῇ — 天のはしごが地に立ち (κλῖμαξ — «лестница»; ἐστηριγμένη — «водружённая, утверждённая»). ἧς ἡ κεφαλὴ ἀφικνεῖτο εἰς τὸν οὐρανόν — その頂は天に届いていた. ἀνέβαινον καὶ κατέβαινον ἐπ᾿ αὐτῆς — それを上り下りしていた (несовершенный вид — постоянное движение)."
  13: "ὁ δὲ κύριος ἐπεστήρικτο ἐπ᾿ αὐτῆς — 主はその上に立って (ἐπιστηρίζομαι, «утвердился»). Ἐγὼ κύριος ὁ θεὸς Αβρααμ τοῦ πατρός σου καὶ ὁ θεὸς Ισαακ — わたしは主、あなたの父アブラハムの神、イサクの神である. μὴ φοβοῦ — 恐れてはならない (гонорифик: 神の言葉). ἡ γῆ ἐφ᾿ ἧς σὺ καθεύδεις ἐπ᾿ αὐτῆς — あなたがその上に寝ているこの地 (двойное ἐπί — как в греч.)."
  14: "ὡς ἡ ἄμμος τῆς γῆς — 地の砂のように. πλατυνθήσεται ἐπὶ θάλασσαν καὶ ἐπὶ λίβα καὶ ἐπὶ βορρᾶν καὶ ἐπ᾿ ἀνατολάς — 海に、南に、北に、東に広がる (порядок греческий: море, юг, север, восток; в Синодальном иначе). ἐνευλογηθήσονται ἐν σοί — あなたによって祝福される (LXX «благословятся в тебе»; слав. «о тебе»)."
  15: "διαφυλάσσων σε — あなたを守り (причастие при ἐγὼ μετὰ σοῦ). οὗ ἐὰν πορευθῇς — どこへ行っても (οὗ ἄν — «куда бы»). οὐ μή σε ἐγκαταλίπω — 捨て置きはしない (οὐ μή + сослагательное — усиленное отрицание). ἕως τοῦ ποιῆσαί με πάντα ὅσα ἐλάλησά σοι — 語ったすべてのことを成し遂げるまで."
  16: "ἐξηγέρθη — 目を覚ました (ἐξεγείρομαι). Ἔστιν κύριος ἐν τῷ τόπῳ τούτῳ — 主はこの場所におられる (в LXX с ὅτι, но по смыслу это прямая речь; слав. «яко есть Господь на месте сем»). ἐγὼ δὲ οὐκ ᾔδειν — それなのに、わたしは知らなかった (ᾔδειν — плюсквамперфект от οἶδα)."
  17: "Ὡς φοβερὸς ὁ τόπος οὗτος — この場所はなんと恐ろしいことか (восклицание с ὡς; φοβερός — «страшный, внушающий трепет»). οὐκ ἔστιν τοῦτο ἀλλ᾿ ἢ οἶκος θεοῦ — ここはほかでもない、神の家 (ἀλλ᾿ ἤ — «кроме как»). πύλη τοῦ οὐρανοῦ — 天の門."
  18: "στήλην — 石柱 (στήλη — «памятный столп»; ср. 31:45, 35:14). ἐπέχεεν ἔλαιον ἐπὶ τὸ ἄκρον αὐτῆς — その頂に油を注いだ (ἐπιχέω — «возливать»; помазание камня, ср. 31:13)."
  19: "LXX даёт переведённое имя: Οἶκος θεοῦ — «дом Божий»; евр. Бейт-Эль (ベテル). В тексте перевод с приложением «すなわちベテル» — тот же приём, что в Мф 27:33 (ゴルゴタ…すなわち「されこうべの場所」). Ουλαμλους — ウラムルス (слав. «Уламлуз»; евр. Луз, ルズ)."
  20: "ηὔξατο εὐχὴν — 誓いを立てて (εὔχομαι с εὐχή — «дать обет»; ср. 31:13, где тот же корень). ἐὰν ᾖ κύριος ὁ θεὸς μετ᾿ ἐμοῦ — 神である主がわたしとともにいて (условие, продолжающееся в 21-м стихе). ἄρτον φαγεῖν καὶ ἱμάτιον περιβαλέσθαι — 食べるパンと着る衣 (минимум пищи и одежды)."
  21: "μετὰ σωτηρίας — 無事に (букв. «со спасением»). ἔσται μοι κύριος εἰς θεόν — 主はわたしの神となる (LXX «будет мне Господь в Бога»; слав. «в Бога»)."
  22: "ὁ λίθος οὗτος ὃν ἔστησα στήλην — 石柱として立てたこの石. δεκάτην ἀποδεκατώσω — 十分の一を納める (δεκάτη — «десятина»; тавтология ἀποδεκατόω сохранена). ἔσται μοι οἶκος θεοῦ — 神の家となる (в греч. снова переведённое имя, без «Вефиля»)."
