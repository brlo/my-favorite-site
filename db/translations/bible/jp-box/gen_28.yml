# jp-box, Бытие, глава 28. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru),
# русский Синодальный (ru) и, где есть, jp-joc (1901, public domain).
# Язык — современный 常体, без 文語; порядок членов и деление на клаузы — по греческому.
# Глава 28: Исаак посылает Иакова в Месопотамию (1–5), Исав берёт жену из рода Измаила (6–9),
# ночлег в Вефиле и сон о лестнице (10–12), обетование Господа (13–15), пробуждение и страх (16–17),
# камень-столп и елей (18), имя места (19), обет Иакова (20–22).
# Красного и синего нет: речь Господа — в 「…」, без красного (это не речь Христа во плоти).
# Прямая речь Исаака в 1–4 — один 「…」 на четыре стиха (как длинные речи в jn 17 и ps 2);
# в 6-м стихе — своя короткая речь. Слово Господа в 13–15 — один 「…」 на три стиха.
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено по базе).
# LXX в 28:19 даёт переведённое имя места (Οἶκος θεοῦ), а не «Вефиль»; в тексте стоит перевод
# с приложением «すなわちベテル» (тот же приём, что ゴルゴタ в Мф 27:33), греческое чтение — в notes.
# Имена: イサク, ヤコブ, エサウ, ベトエル, リベカ, ラバン, イシュマエル, マハラト, ナベヨト,
# アブラハム, カナン, ハラン, ベテル.
# Сносок ⟨…⟩ нет: はしご, 天使, 石柱, 油を注ぐ, 誓い — понятные слова. jp-ni не использовался.

