# jp-box, Притчи, глава 19. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный, с масоретского) — только
# для понимания, не источник. jp-joc (1901) есть только для 19:16–25 — контроль
# церковного чтения, архаизмы не копировались. jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 19: бедный и богатый (1, 4, 6–7, 22), глупость (2–3), лжесвидетель (5, 9),
# царь (10–12), дом и жена (13–14), лень (15, 24), заповедь (16), милость (17),
# наказание сына (18–20), совет Господень (21), страх Господень (23),
# обличение (25–29). Прямой речи нет — авторские изречения, внешних кавычек нет;
# параллелизм сохранён.
# Нумерация по gr: 29 стихов.
# ВНИМАНИЕ (дефект модуля): 19:1 и 19:2 в gr-lxx-byz стоят как «.». Переведены
# по csl 19:1–2 (единственный свидетель), без скобок, см. notes 1–2.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).

