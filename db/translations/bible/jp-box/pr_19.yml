verses:
  1: "自分[じぶん]の誠実[せいじつ]のうちに歩[あゆ]む貧[まず]しい者[もの]は、唇[くちびる]が曲[ま]がって愚[おろ]かな富[とみ]める者よりも良[よ]い。"
  2: "魂[たましい]に教[おし]えがないところには良[よ]いものがなく、足[あし]の速[はや]い者[もの]はつまずく。"
  3: "人[ひと]の愚[おろ]かさはその道[みち]を損[そこ]ない、その心[こころ]は神[かみ]を責[せ]める。"
  4: "富[とみ]は多[おお]くの友[とも]を増[ふ]やし、貧[まず]しい者[もの]は持[も]っている友からも見捨[みす]てられる。"
  5: "偽[いつわ]りの証人[しょうにん]は罰[ばつ]を免[まぬか]れず、不正[ふせい]に訴[うった]える者[もの]も逃[のが]れられない。"
  6: "多[おお]くの者[もの]が王[おう]の顔色[かおいろ]をうかがい、悪[あく]い者はすべて人[ひと]の嘲笑[ちょうしょう]となる。"
  7: "貧[まず]しい兄弟[きょうだい]を憎[にく]む者[もの]は、友[とも]との交[まじ]わりからも遠[とお]ざかる。良[よ]い思[おも]いはそれを知[し]る者に近[ちか]づき、思慮[しりょ]ある人[ひと]はそれを見[み]いだす。多[おお]くの悪[あく]を行[おこな]う者は悪を極[きわ]め、言葉[ことば]を激[はげ]しくする者は救[すく]われない。"
  8: "分別[ふんべつ]を得[え]る者[もの]は自分[じぶん]を愛[あい]し、分別を守[まも]る者は良[よ]いものを見[み]いだす。"
  9: "偽[いつわ]りの証人[しょうにん]は罰[ばつ]を免[まぬか]れず、悪[あく]を燃[も]え上[あ]がらせる者[もの]はそれによって滅[ほろ]びる。"
  10: "愚[おろ]かな者[もの]にぜいたくは益[えき]にならず、しもべが高[たか]ぶって支配[しはい]し始[はじ]めるのも益にならない。"
  11: "あわれみ深[ふか]い人[ひと]は怒[いか]りを遅[おそ]くし、その誇[ほこ]りは不法[ふほう]な者[もの]たちに及[およ]ぶ。"
  12: "王[おう]の脅[おど]しは獅子[しし]の唸[うな]りに似[に]ており、その喜[よろこ]びは草[くさ]の上[うえ]の露[つゆ]のようである。"
  13: "愚[おろ]かな子[こ]は父[ちち]の恥[はじ]であり、娼婦[しょうふ]の報酬[ほうしゅう]から出[で]る誓願[せいがん]は清[きよ]くない。"
  14: "父[ちち]たちは家[いえ]と財産[ざいさん]を子[こ]どもたちに分[わ]け与[あた]えるが、良[よ]い妻[つま]は主[しゅ]から夫[おっと]に結[むす]び合[あ]わされる。"
  15: "臆病[おくびょう]は女[おんな]のような男[おとこ]を捕[と]らえ、怠[なま]ける者[もの]の魂[たましい]は飢[う]える。"
  16: "戒[いまし]めを守[まも]る者[もの]は自分[じぶん]の魂[たましい]を保[たも]ち、自分の道[みち]を軽[かる]んじる者は滅[ほろ]びる。"
  17: "貧[まず]しい者[もの]をあわれむ者は主[しゅ]に貸[か]すのであり、その贈[おく]り物[もの]に応[おう]じて返[かえ]される。"
  18: "あなたの子[こ]を戒[いまし]めよ。そうすれば、その子は望[のぞ]みある者となる。しかし、高[たか]ぶってその魂[たましい]を驕[おご]らせてはならない。"
  19: "悪[あく]しき思[おも]いの人[ひと]は多[おお]くの罰[ばつ]を受[う]ける。もしも暴[あば]れ回[まわ]るなら、その魂[たましい]までも失[うしな]う。"
  20: "わが子[こ]よ、父[ちち]の戒[いまし]めを聞[き]け。そうすれば、あなたは終[お]わりに知恵[ちえ]ある者となる。"
  21: "人[ひと]の心[こころ]には多[おお]くの思[おも]いがあるが、主[しゅ]の計画[けいかく]は永遠[とこしえ]に立[た]つ。"
  22: "あわれみは人[ひと]の実[み]であり、正[ただ]しい貧[まず]しい者[もの]は偽[いつわ]りの富[とみ]める者にまさる。"
  23: "主[しゅ]を恐[おそ]れることは人[ひと]を命[いのち]に導[みちび]き、恐れを知[し]らない者[もの]は知識[ちしき]が顧[かえり]みられない場所[ばしょ]に宿[やど]る。"
  24: "不正[ふせい]にふところに手[て]を隠[かく]す者[もの]は、その手を口[くち]に持[も]って行[い]くこともしない。"
  25: "蔑[さげす]む者[もの]が鞭[むち]打[う]たれると、愚[おろ]かな者はさらに悪賢[わるがしこ]くなる。しかし、思慮[しりょ]ある人[ひと]を責[せ]めれば、その人は悟[さと]りを得[え]る。"
  26: "父[ちち]を侮[あなど]り母[はは]を退[しりぞ]ける者[もの]は辱[はずかし]められ、非難[ひなん]される者となる。"
  27: "父[ちち]の戒[いまし]めを守[まも]ることを捨[す]てる子[こ]は、悪[あく]い言葉[ことば]を考[かんが]える。"
  28: "愚[おろ]かな若者[わかもの]の保証人[ほしょうにん]になる者[もの]は裁[さば]きを侮[あなど]り、不敬[ふけい]な者の口[くち]は裁きを飲[の]み込[こ]む。"
  29: "放縦[ほうじゅう]な者[もの]には鞭[むち]が、愚[おろ]かな者の肩[かた]には罰[ばつ]が備[そな]えられている。"

notes:
  1: "В gr-lxx-byz 19:1 стоит «.» — стиха нет (дефект модуля). Переведён по csl 19:1 (единственный свидетель), без скобок: «Лучше есть убог ходяй в простоте своей, неже богатый строптив устны своими и несмыслен» — лучше бедный, ходящий в простоте (честности) своей, нежели богатый, кривой устами своими и бессмысленный. ἁπλότης — простота, честность; передано 誠実."
  2: "В gr 19:2 стоит «.» — дефект модуля; переведён по csl 19:2, без скобок: «Идеже несть учения души, несть добро, и иже скор есть ногама, поткнется» — где нет учения (наставления) душе, нет добра, и кто скор ногами, тот споткнётся. ru/МТ: «Нехорошо душе без знания» — по масоретскому, отмечено."
  3: "ἀφροσύνη ἀνδρὸς λυμαίνεται τὰς ὁδοὺς αὐτοῦ — безумие мужа губит пути его (λυμαίνομαι). τὸν δὲ θεὸν αἰτιᾶται τῇ καρδίᾳ αὐτοῦ — а Бога винит сердцем своим (αἰτιάομαι — обвинять)."
  4: "πλοῦτος προστίθησιν φίλους πολλούς — богатство прибавляет друзей многих (προστίθημι). ὁ δὲ πτωχὸς καὶ ἀπὸ τοῦ ὑπάρχοντος φίλου λείπειται — нищий же и от имеющегося друга оставляется (λείπω — оставлять)."
  5: "μάρτυς ψευδὴς οὐκ ἀτιμώρητος ἔσται — свидетель лживый не останется без наказания (ἀτιμώρητος). ὁ δὲ ἐγκαλῶν ἀδίκως οὐ διαφεύξεται — обвиняющий же неправедно не избежит (ἐγκαλέω; διαφεύγω)."
  6: "πολλοὶ θεραπεύουσιν πρόσωπα βασιλέων — многие угождают лицам царей (θεραπεύω — служить, угождать). πᾶς δὲ ὁ κακὸς γίνεται ὄνειδος ἀνδρί — всякий же злой бывает поношением мужу."
  7: "πᾶς, ὃς ἀδελφὸν πτωχὸν μισεῖ, καὶ φιλίας μακρὰν ἔσται — всякий, кто брата нищего ненавидит, и от дружбы далеко будет. ἔννοια ἀγαθὴ τοῖς εἰδόσιν αὐτὴν ἐγγιεῖ — мысль благая знающим её приблизится. ὁ πολλὰ κακοποιῶν τελεσιουργεῖ κακίαν — много зла творящий совершает злобу (τελεσιουργέω); ὃς δὲ ἐρεθίζει λόγους, οὐ σωθήσεται — раздражающий словами не спасётся. ru/МТ иначе (бедного ненавидят все братья)."
  8: "ὁ κτώμενος φρόνησιν ἀγαπᾷ ἑαυτόν — приобретающий разум любит себя. ὃς δὲ φυλάσσει φρόνησιν, εὑρήσει ἀγαθά — хранящий же разум обретёт блага."
  9: "μάρτυς ψευδὴς οὐκ ἀτιμώρητος ἔσται — ср. 19:5. ὃς δ᾽ ἂν ἐκκαύσῃ κακίαν, ἀπολεῖται ὑπ᾽ αὐτῆς — кто разожжёт злобу, погибнет от неё (ἐκκαίω — разжигать)."
  10: "οὐ συμφέρει ἄφρονι τρυφή — не полезно глупому роскошество (συμφέρω; τρυφή). ἐὰν οἰκέτης ἄρξηται μεθ᾽ ὕβρεως δυναστεύειν — если раб начнёт с дерзостью господствовать (δυναστεύω)."
  11: "ἐλεήμων ἀνὴρ μακροθυμεῖ — милостивый муж долготерпит. τὸ δὲ καύχημα αὐτοῦ ἐπέρχεται παρανόμοις — похвала же его приходит на беззаконных; место тёмное, csl «превосходит законопреступных»."
  12: "βασιλέως ἀπειλὴ ὁμοία βρυγμῷ λέοντος — угроза царя подобна рыканию льва (βρυγμός). ὥσπερ δὲ δρόσος ἐπὶ χόρτῳ, οὕτως τὸ ἱλαρὸν αὐτοῦ — как же роса на траве, так благоволение его (δρόσος; ἱλαρός)."
  13: "αἰσχύνη πατρὶ υἱὸς ἄφρων — стыд отцу сын глупый. καὶ οὐχ ἁγναὶ εὐχαὶ ἀπὸ μισθώματος ἑταίρας — и нечисты обеты (молитвы) от платы блудницы (εὐχή — обет, молитва; μίσθωμα — плата; ἑταίρα — блудница)."
  14: "οἶκον καὶ ὕπαρξιν μερίζουσιν πατέρες παισίν — дом и имение разделяют отцы детям (μερίζω). παρὰ δὲ θεοῦ ἁρμόζεται γυνὴ ἀνδρί — от Бога же сочетавается жена мужу (ἁρμόζω)."
  15: "δειλία κατέχει ἀνδρόγυαιον — робость (лень) держит женоподобного (δειλία; ἀνδρόγυνος). ψυχὴ δὲ ἀεργοῦ πεινάσει — душа же праздного взалчет (ἀεργός — неделающий)."
  16: "ὃς φυλάσσει ἐντολήν, τηρεῖ τὴν ἑαυτοῦ ψυχήν — хранящий заповедь соблюдает свою душу (τηρέω). ὁ δὲ καταφρονῶν τῶν ἑαυτοῦ ὁδῶν ἀπολεῖται — нерадящий же о своих путях погибнет (καταφρονέω)."
  17: "δανίζει θεῷ ὁ ἐλεῶν πτωχόν — даёт взаймы Богу милующий нищего (δανίζω). κατὰ δὲ τὸ δόμα αὐτοῦ ἀνταποδώσει αὐτῷ — по даянию же его воздаст ему (ἀνταποδίδωμι)."
  18: "παίδευε υἱόν σου, οὕτως γὰρ ἔσται εὔελπις — наказывай сына твоего, так ибо будет благонадёжен (εὔελπις — имеющий добрую надежду). εἰς δὲ ὕβριν μὴ ἐπαίρου τῇ ψυχῇ σου — в дерзость не поднимайся душою твоею (ἐπαίρω); csl «не вземлися душею твоею»; ru/МТ иначе («не возмущайся криком его»)."
  19: "κακόφρων ἀνὴρ πολλὰ ζημιωθήσεται — злонравный муж много потерпит ущерба (ζημιόω). ἐὰν δὲ λοιμεύηται, καὶ τὴν ψυχὴν αὐτοῦ προσθήσει — если же будет неистовствовать, и душу свою приложит (λοιμεύομαι — свирепствовать)."
  20: "ἄκουε, υἱέ, παιδείαν πατρός σου — слушай, сын, наставление отца твоего. ἵνα σοφὸς γένῃ ἐπ᾽ ἐσχάτων σου — чтобы мудрым стать в последняя твоя (ἐπ᾽ ἐσχάτων — в конце, впоследствии)."
  21: "πολλοὶ λογισμοὶ ἐν καρδίᾳ ἀνδρός — многие помыслы в сердце мужа (λογισμός). ἡ δὲ βουλὴ τοῦ κυρίου εἰς τὸν αἰῶνα μένει — совет же Господень во век пребывает (βουλή)."
  22: "καρπὸς ἀνδρὶ ἐλεημοσύνη — плод мужу — милостыня (ἐλεημοσύνη). κρείσσων δὲ πτωχὸς δίκαιος ἢ πλούσιος ψεύστης — лучше же нищий праведный, нежели богатый лживый."
  23: "φόβος κυρίου εἰς ζωὴν ἀνδρί — страх Господень в жизнь мужу. ὁ δὲ ἄφοβος αὐλισθήσεται ἐν τόποις, οὗ οὐκ ἐπισκοπεῖται γνῶσις — бесстрашный же водворится на местах, где не наблюдается (не посещается) знание (αὐλίζομαι — водворяться; ἐπισκοπέω)."
  24: "ὁ ἐγκρύπτων εἰς τὸν κόλπον αὐτοῦ χεῖρας ἀδίκως — скрывающий в пазуху свою руки неправедно (ἐγκρύπτω). οὐδὲ τῷ στόματι οὐ μὴ προσαγάγῃ αὐτάς — и к устам не принесёт их (προσάγω); образ лени, ср. 26:15; ru/МТ «опускает руку в чашу»."
  25: "λοιμοῦ μαστιγουμένου ἄφρων πανουργότερος γίνεται — когда негодяй (кощунник) бит, глупый делается хитрее (λοιμός — негодный; πανουργότερος — более коварный). ἐὰν δὲ ἐλέγχῃς ἄνδρα φρόνιμον, νοήσει αἴσθησιν — если же обличаешь мужа разумного, уразумеет разумение (αἴσθησις)."
  26: "ὁ ἀτιμάζων πατέρα καὶ ἀπωθούμενος μητέρα αὐτοῦ — бесчестящий отца и отталкивающий мать свою (ἀτιμάζω; ἀπωθέω). καταισχυνθήσεται καὶ ἐπονείδιστος ἔσται — постыдится и поносим будет (ἐπονείδιστος)."
  27: "υἱὸς ἀπολειπόμενος φυλάξαι παιδείαν πατρός — сын, оставляющий хранить наставление отца (ἀπολείπω — оставлять). μελετήσει ῥήσεις κακάς — поучится словам злым (μελετάω — упражняться, размышлять)."
  28: "ὁ ἐγγυώμενος παῖδα ἄφρονα καθυβρίζει δικαίωμα — ручающийся за отрока глупого оскорбляет правосудие (καθυβρίζω; δικαίωμα — устав, право). στόμα δὲ ἀσεβῶν καταπίεται κρίσεις — уста же нечестивых поглощают суды (καταπίνω)."
  29: "ἑτοιμάζονται ἀκολάστοις μάστιγες — уготовляются невоздержным бичи (ἀκόλαστος — необузданный). καὶ τιμωρίαι ὤμοις ἀφρόνων — и наказания на плечи глупых (τιμωρία; ὦμος)."
