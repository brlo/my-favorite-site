verses:
  1: "ああ、エチオピアの川[かわ]の向[む]こうにある地[ち]の、舟[ふね]の翼[つばさ]よ。"
  2: "海[うみ]の上[うえ]に人質[ひとじち]と紙[かみ]の手紙[てがみ]を送[おく]り、水[みず]の上[うえ]を渡[わた]る者[もの]よ。軽[かる]やかな使者[ししゃ]たちは、高[たか]くそびえる民[たみ]、見[み]なれぬ民[たみ]、激[はげ]しい民[たみ]のもとへ行[い]く。その先[さき]には、だれがいるのか。望[のぞ]みを失[うしな]い、踏[ふ]みにじられた民[たみ]である。今[いま]、地[ち]の川々[かわがわ]は、"
  3: "すべての者[もの]は、人[ひと]の住[す]む国[くに]のようになる。彼らの国[くに]は住[す]み着[つ]かれる。山[やま]からしるしが上[あ]げられるように、角笛[つのぶえ]の音[ね]が聞[き]こえるように、それは聞こえるものとなる。"
  4: "主[しゅ]はわたしにこう言[い]われた。「わたしの都[みやこ]には安[やす]らぎがある。真昼[まひる]の暑[あつ]さの光[ひかり]のように、刈[か]り入[い]れの日[ひ]の露[つゆ]の雲[くも]のように。」"
  5: "刈[か]り入[い]れの前[まえ]、花[はな]が終[お]わり、ぶどうの房[ふさ]が花[はな]の後[あと]にまだ熟[じゅく]さない実[み]をつけるとき、彼は小[ちい]さな房[ふさ]を鎌[かま]で取[と]り去[さ]り、枝[えだ]を取[と]り去[さ]って切[き]り倒[たお]す。"
  6: "それらは、天[てん]の鳥[とり]たちと地[ち]の獣[けもの]たちに、そのまま残[のこ]される。天の鳥たちはそれらに集[あつ]まり、地の獣たちはどれもそれに向[む]かって来[く]る。"
  7: "その時[とき]、万軍[ばんぐん]の主[しゅ]に贈[おく]り物[もの]が携[たずさ]えられて来[く]る。苦[くる]しめられ、引[ひ]き裂[さ]かれた民[たみ]から、また、今[いま]から永遠[えいえん]に至[いた]るまで大[おお]きな民[たみ]から。望[のぞ]みをかけられ、踏[ふ]みつけられた民[たみ]、すなわちその地[ち]の川[かわ]のほとりにある民[たみ]から、万軍の主の名[な]が呼[よ]ばれた場所[ばしょ]、シオンの山[やま]へ。"

notes:
  1: "Οὐαὶ γῆς πλοίων πτέρυγες ἐπέκεινα ποταμῶν Αἰθιοπίας — «горе крылам кораблей земли за реками Ефиопии»: греч. синтаксис сбит (Οὐαί с родительным, затем висящее πτέρυγες), в тексте сохранён; слав. «горе корабелным крилам земли, яже об ону страну рек ефиопских». πτέρυγες — «крылья», образ парусов или корабельных навесов."
  2: "ὁ ἀποστέλλων — «посылающий»: причастие продолжает обращение 18:1. ὅμηρα — «заложники» (слав. «в залог»); ἐπιστολὰς βυβλίνας — «письма папирусные» (βύβλινος — «из папируса»), передано 紙の手紙. κοῦφοι — «лёгкие, быстрые»; ἔθνος μετέωρον — «народ высокий, надменный» (μετέωρος — «поднятый»; слав. «язык высок»); ξένον — «чужой, странный»; χαλεπόν — «тяжёлый, суровый» (слав. «строптивым»). τίς αὐτοῦ ἐπέκεινα — «кто за ним?», т. е. кто сравнится; ἀνέλπιστον — «не имеющий надежды» (слав. «безнадежен»); καταπεπατημένον — «попираемый». Стих обрывается на νῦν οἱ ποταμοὶ τῆς γῆς — «ныне реки земли» (продолжение в 18:3); слав. переносит эти слова в начало 18:3."
  3: "πάντες ὡς χώρα κατοικουμένη — «все как страна населённая»: тёмное место, возможно повреждение текста; сохранено буквально. κατοικηθήσεται ἡ χώρα αὐτῶν — «будет населена страна их». ὡσεὶ σημεῖον ἀπὸ ὄρους ἀρθῇ — «как знамение с горы поднято будет» (σημεῖον — «знамя, знак»; αἴρω — «поднимать»). ὡς σάλπιγγος φωνὴ ἀκουστὸν ἔσται — «как голос трубы, услышано будет» (σάλπιγξ — труба)."
  4: "οὕτως εἶπέν μοι κύριος — вводная формула вне кавычек. Ἀσφάλεια ἔσται ἐν τῇ ἐμῇ πόλει — «безопасность будет в городе Моём» (ἀσφάλεια — «безопасность, твёрдость»; слав. «утверждение»), передано 安らぎ. ὡς φῶς καύματος μεσημβρίας — «как свет полуденного зноя» (καῦμα — «жар»). ὡς νεφέλη δρόσου ἡμέρας ἀμήτου — «как облако росы в день жатвы» (δρόσος — «роса»; ἀμητός — «жатва»)."
  5: "πρὸ τοῦ θερισμοῦ — «прежде жатвы» (θερισμός). ὅταν συντελεσθῇ ἄνθος — «когда завершится цвет». ὄμφαξ ἀνθήσῃ ἄνθος ὀμφακίζουσα — «когда завязь [винограда] даст цвет, [ещё] незрелый»: ὄμφαξ — «незрелая гроздь», ὀμφακίζω — «быть в завязи»; слав. «грезн произыдет по цвете недозрел». ἀφελεῖ … τοῖς δρεπάνοις — «снимет серпами» (δρέπανον — «серп, кривой нож»). κληματίς — «побег, ветвь лозы» (слав. «лозие»); κατακόψει — «изрубит»."
  6: "καταλείψει ἅμα — «оставит вместе» (слав. «оставит вкупе»). πετεινὰ τοῦ οὐρανοῦ … θηρία τῆς γῆς — «птицы небесные… звери земные». συναχθήσεται ἐπ᾿ αὐτούς — «соберутся на них»; далее ἐπ᾿ αὐτόν — «на него» (ед. ч.): смена числа сохранена. ἥξει — «придёт»."
  7: "ἀνενεχθήσεται δῶρα — «принесены будут дары» (ἀναφέρω — «возносить, приносить»; слав. «принесутся»). λαοῦ τεθλιμμένου καὶ τετιλμένου — «народа стеснённого и общипанного» (θλίβω — «теснить»; τίλλω — «щипать, обрывать»; слав. «оскорбленых и отторженых»). ἀπὸ τοῦ νῦν καὶ εἰς τὸν αἰῶνα χρόνον — «отныне и в век времени». ἔθνος ἐλπίζον καὶ καταπεπατημένον — «народ надеющийся и попираемый» (слав. «надеющься и попран»). ὅ ἐστιν ἐν μέρει ποταμοῦ τῆς χώρας αὐτοῦ — «который при реке страны своей»; εἰς τὸν τόπον, οὗ τὸ ὄνομα κυρίου σαβαωθ ἐπεκλήθη, ὄρος Σιων — «на место, где имя Господа Саваофа наречено, — гору Сион» (ἐπικαλέω — «называть, призывать»)."
