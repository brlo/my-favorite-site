# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 18: 1–2 воззвание к земле за реками Ефиопии и к посылающим послов по морю;
# 3–4 знамя и труба, слово Господа о тишине в Его городе; 5–6 срезание лозы до
# жатвы, оставленное птицам и зверям; 7 дары Господу от того народа на гору Сион.
# Прямая речь — 18:4 (вводная формула «ибо так сказал мне Господь» вне кавычек).
