verses:
  1: "「わたしは魂[たましい]に疲[つか]れ、嘆[なげ]きながら、主[しゅ]に向[む]かってわたしの言葉[ことば]を投[な]げかけよう。魂の苦[にが]さに迫[せま]られて、わたしは語[かた]る。"
  2: "主[しゅ]に向[む]かって言[い]おう。わたしに不敬[ふけい]を教[おし]えないでください。なぜ、わたしをこのように裁[さば]かれたのですか。"
  3: "わたしが不正[ふせい]を行[おこな]うことが、あなたにとって良[よ]いことなのでしょうか。あなたはご自分[じぶん]の手[て]のわざを退[しりぞ]け、不敬[ふけい]な者[もの]の計[はか]らいに耳[みみ]を傾[かたむ]けられたのですか。"
  4: "あなたは死[し]すべき者[もの]が見[み]るように見、人[ひと]が見るように見られるのでしょうか。"
  5: "あなたの生涯[しょうがい]は人間[にんげん]のものなのでしょうか。あなたの年[とし]は、人[ひと]の日[ひ]のようなのでしょうか。"
  6: "あなたはわたしの不法[ふほう]を探[さが]し求[もと]め、わたしの罪[つみ]を探[さぐ]り出[だ]されたからです。"
  7: "あなたは、わたしが不敬[ふけい]を行[おこな]わなかったことを知[し]っておられるからです。しかし、あなたの手[て]からわたしを救[すく]い出[だ]す者[もの]が、いるでしょうか。"
  8: "あなたの手[て]がわたしを形[かたち]づくり、わたしを造[つく]られた。その後[のち]、あなたは変[か]わって、わたしを打[う]たれた。"
  9: "思[おも]い起[おこ]してください。あなたはわたしを粘土[ねんど]のように形[かたち]づくり、またわたしを土[つち]に帰[かえ]されることを。"
  10: "あなたはわたしを乳[ちち]のように搾[しぼ]り出[だ]し、チーズのように固[かた]められたのではありませんか。"
  11: "あなたは皮膚[ひふ]と肉[にく]でわたしを包[つつ]み、骨[ほね]と筋[すじ]でわたしを編[あ]み合[あ]わされた。"
  12: "あなたは命[いのち]とあわれみをわたしに授[さず]け、あなたの顧[かえり]みがわたしの霊[れい]を守[まも]ってきた。"
  13: "これらのことをあなたはご自身[じしん]の内[うち]に持[も]っておられる。わたしは、あなたがすべてを為[な]し得[え]ることを知[し]っている。あなたにできないことは何[なに]もない。"
  14: "わたしが罪[つみ]を犯[おか]すなら、あなたはわたしを見張[みは]っておられる。不法[ふほう]からは、わたしを無罪[むざい]の者[もの]としてくださらなかった。"
  15: "不敬[ふけい]な者[もの]であれば、ああ、わたしは不幸[ふこう]だ。正[ただ]しい者[もの]であっても、顔[かお]を上[あ]げることはできない。わたしは辱[はずかし]めに満[み]ちているからだ。"
  16: "わたしは屠[ほふ]り場[ば]へ引[ひ]かれる獅子[しし]のように捕[と]らえられ、またも変[か]わって、恐[おそ]ろしいまでにわたしを滅[ほろ]ぼされる。"
  17: "あなたはわたしへの吟味[ぎんみ]を新[あら]たにし、大[おお]きな怒[いか]りをわたしに注[そそ]ぎ、次々[つぎつぎ]と試練[しれん]をわたしに臨[のぞ]ませられる。"
  18: "なぜ、あなたはわたしを胎[たい]から出[だ]されたのか。わたしは死[し]んで、だれの目[め]にも見[み]られなければよかった。"
  19: "そうすれば、わたしは存在[そんざい]しなかった者[もの]のようになっていただろう。なぜ、わたしは胎[たい]から墓[はか]へと移[うつ]されなかったのか。"
  20: "わたしの生涯[しょうがい]の時[とき]は、わずかではないか。わたしを少[すこ]し休[やす]ませてほしい。"
  21: "わたしが、二度[にど]と戻[もど]ることのない所[ところ]へ、暗[くら]く、陰[かげ]に包[つつ]まれた地[ち]へ行[い]く前[まえ]に。"
  22: "永遠[えいえん]の闇[やみ]の地[ち]、そこには光[ひかり]もなく、死[し]すべき者[もの]の命[いのち]を見[み]ることもできない。」"

notes:
  1: "Иов, продолжение речи (9:2–35); глава открывается цитатой без вводной формулы — речь идёт из предыдущей главы. κάμνων τῇ ψυχῇ μου — «изнемогая душою»; στένων — «стеная»; ἐπαφήσω ἐπ᾽ αὐτὸν τὰ ῥήματά μου — «брошу на него слова мои»: в LXX ἐπ᾽ αὐτόν («на Него», т. е. на Бога), в csl «на мя» («на себя») — слав. идёт за МТ; принято чтение LXX, слав. отмечено. λαλήσω πικρίᾳ ψυχῆς μου συνεχόμενος — «буду говорить, объятый горечью души моей»."
  2: "Иов. ἐρῶ πρὸς κύριον — «скажу Господу»; μὴ με ἀσεβεῖν δίδασκε — «не учи меня нечествовать» (ἀσεβέω — «быть нечестивым»); διὰ τί με οὕτως ἔκρινας — «зачем ты так судил меня» (κρίνω). Слав. то же: «не учи мя нечествовати»."
  3: "Иов. ἦ — вопросительная частица «разве»; καλόν σοι — «хорошо тебе»; ἀπείπω ἔργα χειρῶν σου — «отверг дела рук твоих» (ἀπεῖπον — «отказаться, отвергнуть»); βουλῇ ἀσεβῶν προσέσχες — «к совету нечестивых прислушался» (προσέχω — «обращать внимание»). Син. иначе (по МТ), не источник."
  4: "Иов. ἦ ὥσπερ βροτὸς ὁρᾷ καθορᾷς — «разве, как смертный видит, ты видишь» (καθοράω — «усматривать»); ἢ καθὼς ὁρᾷ ἄνθρωπος βλέψῃ — «или, как человек видит, увидишь»: параллелизм ὁράω / βλέπω сохранён; βροτός — «смертный»."
  5: "Иов. ὁ βίος σου ἀνθρώπινός ἐστιν — «жизнь твоя человеческая ли»; τὰ ἔτη σου ἀνδρός — «годы твои — [годы] мужа». Слав. добавляет «яко дние» («как дни»), следуя МТ; в LXX этого слова нет — внесено в основной текст без 〔…〕 по паритету, отмечено здесь."
  6: "Иов. ἀνεζήτησας τὴν ἀνομίαν μου — «ты взыскал беззаконие мое» (ἀναζητέω — «разыскивать»); τὰς ἁμαρτίας μου ἐξιχνίασας — «грехи мои выследил» (ἐξιχνιάζω, ср. 11:7). Слав. то же."
  7: "Иов. οἶδας γὰρ ὅτι οὐκ ἠσέβησα — «ибо знаешь, что я не нечествовал»; τίς ἐστιν ὁ ἐκ τῶν χειρῶν σου ἐξαιρούμενος — «кто избавляющий из рук твоих» (ἐξαιρέω — «выхватывать»)."
  8: "Иов. αἱ χεῖρές σου ἔπλασάν με καὶ ἐποίησάν με — «руки твои создали меня и сделали меня» (πλάσσω — «лепить», как гончар); μετὰ ταῦτα μεταβαλὼν με ἔπαισας — «после этого, изменившись, ты поразил меня». Слав. «преложив» — то же; тёмное место оставлено без сглаживания."
  9: "Иов. μνήσθητι ὅτι πηλόν με ἔπλασας — «вспомни, что ты вылепил меня как глину» (πηλός — «глина, брение»); εἰς δὲ γῆν με πάλιν ἀποστρέφεις — «а обратно в землю возвращаешь меня» (наст. время, как в греч.)."
  10: "Иов. ἦ οὐχ ὥσπερ γάλα με ἤμελξας — «разве не как молоко ты выдоил меня» (ἀμέλγω — «доить»); ἐτύρωσας δέ με ἴσα τυρῷ — «и сгустил меня, как сыр» (τυρόω — «створоживать»; τυρός — «сыр»). Образ сохранён буквально; слав. «равно сыру»."
  11: "Иов. δέρμα καὶ κρέας με ἐνέδυσας — «кожей и мясом ты одел меня»; ὀστέοις δὲ καὶ νεύροις με ἐνεῖρας — «костями и жилами ты связал меня» (ἐνείρω — «нанизывать, сплетать»). Слав. «сшил мя еси»."
  12: "Иов. ζωὴν δὲ καὶ ἔλεος ἔθου παρ᾽ ἐμοί — «жизнь и милость ты положил при мне»; ἡ δὲ ἐπισκοπή σου ἐφύλαξέν μου τὸ πνεῦμα — «и посещение твое сохранило дух мой» (ἐπισκοπή — «попечение, посещение»)."
  13: "Иов. ταῦτα ἔχων ἐν σεαυτῷ — «это имея в себе»; οἶδα ὅτι πάντα δύνασαι — «знаю, что все можешь»; ἀδυνατεῖ δέ σοι οὐθέν — «и невозможно тебе ничто». Слав. то же; Син. иначе (по МТ: «скрывал в сердце»), не источник."
  14: "Иов. ἐάν τε γὰρ ἁμάρτω, φυλάσσεις με — «если согрешу, ты стережешь меня»; ἀπὸ δὲ ἀνομίας οὐκ ἀθῷόν με πεποίηκας — «и от беззакония не сделал меня невинным» (ἀθῷος — «невинный», ср. 9:28)."
  15: "Иов. ἐάν τε γὰρ ἀσεβὴς ὦ, οἴμμοι — «если я нечестив — горе мне»; ἐάν τε ὦ δίκαιος, οὐ δύναμαι ἀνακύψαι — «если я праведен, не могу поднять головы» (ἀνακύπτω — «выпрямиться»); πλήρης γὰρ ἀτιμίας εἰμί — «ибо полон бесчестия я»."
  16: "Иов. ἀγρεύομαι γὰρ ὥσπερ λέων εἰς σφαγήν — «ибо ловят меня, как льва на заклание» (ἀγρεύω — «ловить»; σφαγή — «заклание»); πάλιν δὲ μεταβαλὼν δεινῶς με ὀλέκεις — «снова изменившись, страшно губишь меня» (ὀλέκω — «губить»). Слав. «люте убиваеши мя»."
  17: "Иов. ἐπανακαινίζων ἐπ᾽ ἐμὲ τὴν ἔτασίν μου — «обновляя против меня испытание мое» (ἔτασις — «дознание, испытание»); ὀργῇ μεγάλῃ μοι ἐχρήσω — «великим гневом на меня воспользовался»; ἐπήγαγες ἐπ᾽ ἐμὲ πειρατήρια — «и навел на меня искушения» (πειρατήριον — «испытание, искушение»)."
  18: "Иов. ἵνα τί οὖν ἐκ κοιλίας με ἐξήγαγες — «зачем же ты вывел меня из чрева»; καὶ οὐκ ἀπέθανον — «и я не умер»; ὀφθαλμὸς δέ με οὐκ εἶδεν — «и око меня не видело». Слав. доводит до пожелания («не видело бы»); пожелание выражено в 18–19, как и в слав."
  19: "Иов. καὶ ὥσπερ οὐκ ὢν ἐγενόμην — «и стал бы я, как не существующий»; διὰ τί γὰρ ἐκ γαστρὸς εἰς μνῆμα οὐκ ἀπηλλάγην — «ибо зачем из чрева в гроб не перешёл я» (ἀπαλλάσσω — «уходить, избавляться»). Слав. «во гроб не снидох»."
  20: "Иов. ἦ οὐκ ὀλίγος ἐστὶν ὁ χρόνος τοῦ βίου μου — «разве не мало время жизни моей»; ἔασόν με ἀναπαύσασθαι μικρόν — «оставь меня отдохнуть немного». Стих не закончен — продолжается в 21."
  21: "Иов. πρὸ τοῦ με πορευθῆναι — «прежде чем мне пойти»; ὅθεν οὐκ ἀναστρέψω — «откуда не возвращусь» (ἀναστρέφω — «возвращаться»); εἰς γῆν σκοτεινὴν καὶ γνοφεράν — «в землю темную и мрачную» (γνοφερός — «сумрачный»)."
  22: "Иов. εἰς γῆν σκότους αἰωνίου — «в землю тьмы вечной»; οὗ οὐκ ἔστιν φέγγος — «где нет света» (φέγγος — «сияние»); οὐδὲ ὁρᾶν ζωὴν βροτῶν — «и не видеть жизни смертных». 21–22 — один образ; в японском разделён точкой, как в греч. Конец речи Иова (11:1 — формула Зофара)."
