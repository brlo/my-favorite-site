# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге только 1–2; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 10: продолжение речи Иова (с 9:2), 22 стиха. Одна цитата 「…」 с 1 по 22:
# глава открывается кавычкой без вводной формулы (речь идёт из 9-й главы) и
# закрывается в конце 22-го стиха. Голос — Иов; вложенных речей нет.
# Содержание: усталость и дерзость речи (1–2), Ты судишь не как человек (3–7),
# Ты создал меня — и губишь (8–17), зачем я не умер (18–19), просьба о кратком
# отдыхе перед смертью (20–22). Поэзия: параллелизмы и повторы сохранены,
# тёмные места (8, 13, 16–17) не сглажены.
# Нумерация по gr: 22 стиха; деление csl совпадает, сдвигов нет.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz. Сносок ⟨…⟩ нет.
# Имена — транслитерация греческого (LXX).

