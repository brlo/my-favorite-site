verses:
  1: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  2: "「人[ひと]の子[こ]よ、顔[かお]をイスラエルの山々[やまやま]に向[む]け、彼[かれ]らに対[たい]して預言[よげん]せよ。"
  3: "そして言[い]え。イスラエルの山々[やまやま]よ、主[しゅ]の言葉[ことば]を聞[き]け。主[しゅ]なる神[かみ]はこう言[い]われる。山[やま]と丘[おか]、岩[いわ]と谷[たに]に。見[み]よ、わたしはあなたがたに剣[つるぎ]を臨[のぞ]ませ、あなたがたの高[たか]き所[ところ]を滅[ほろ]ぼす。"
  4: "あなたがたの祭壇[さいだん]は砕[くだ]かれ、あなたがたの偶像[ぐうぞう]の社[やしろ]は荒[あ]らされる。わたしはあなたがたの殺[ころ]された者[もの]を、あなたがたの偶像[ぐうぞう]の前[まえ]に投[な]げ倒[たお]す。"
  5: "わたしはイスラエルの子[こ]らの死体[したい]を、彼[かれ]らの偶像[ぐうぞう]の前[まえ]に置[お]き、あなたがたの骨[ほね]をあなたがたの祭壇[さいだん]の周[まわ]りに撒[ま]き散[ち]らす。"
  6: "あなたがたのすべての住[す]まいで、町々[まちまち]は荒[あ]れ果[は]て、高[たか]き所[ところ]は滅[ほろ]びる。あなたがたの祭壇[さいだん]が滅[ほろ]ぼされ、偶像[ぐうぞう]が砕[くだ]かれ、社[やしろ]が取[と]り除[のぞ]かれ、あなたがたのわざが滅[ほろ]ぼされるためである。"
  7: "殺[ころ]された者[もの]はあなたがたのただ中[なか]に倒[たお]れる。あなたがたは、わたしが主[しゅ]であることを知[し]る。"
  8: "しかし、わたしはあなたがたのうちから、剣[つるぎ]を免[まぬか]れて諸国[しょこく]の民[たみ]の間[あいだ]にいる者[もの]たちを残[のこ]す。あなたがたが国々[くにぐに]に散[ち]らされるとき、"
  9: "あなたがたのうちの生[い]き残[のこ]った者[もの]たちは、捕[と]らえられて行[い]った諸国[しょこく]の民[たみ]の間[あいだ]で、わたしを思[おも]い起[おこ]す。わたしは、わたしから離[はな]れて淫行[いんこう]をした彼[かれ]らの心[こころ]と、自分[じぶん]たちの行[おこな]いの後[あと]を追[お]って淫行[いんこう]をした彼[かれ]らの目[め]に対して誓[ちか]った。彼[かれ]らは、自分[じぶん]たちがすべての忌[い]まわしいもののうちで行[おこな]った悪[わる]のゆえに、自分[じぶん]の顔[かお]を打[う]つ。"
  10: "彼[かれ]らは、わたしが主[しゅ]であることを知[し]る。わたしが彼[かれ]らにこのすべての災[わざわ]いを臨[のぞ]ませると語[かた]ったのは、むなしくはなかった。"
  11: "主[しゅ]なる神[かみ]はこう言[い]われる。手[て]を打[う]ち、足[あし]を踏[ふ]み鳴[な]らして言[い]え。ああ、イスラエルの家[いえ]のすべての忌[い]まわしい悪[わる]のゆえに。見[み]よ、彼[かれ]らは剣[つるぎ]と飢[う]えと死[し]によって倒[たお]れる。"
  12: "遠[とお]くの者[もの]は死[し]によって果[は]て、近[ちか]くの者[もの]は剣[つるぎ]で倒[たお]れる。残[のこ]されて囲[かこ]まれた者[もの]は飢[う]えで滅[ほろ]びる。わたしは彼[かれ]らに対[たい]して怒[いか]りを全[まっと]うする。"
  13: "あなたがたの殺[ころ]された者[もの]が、あなたがたの偶像[ぐうぞう]の間[あいだ]、祭壇[さいだん]の周[まわ]りにいるのを見[み]るとき、あなたがたは、わたしが主[しゅ]であることを知[し]る。すべての高[たか]い丘[おか]の上[うえ]、すべての山[やま]の頂[いただき]、すべての茂[しげ]った木[き]の下[した]、すべての陰[かげ]の深[ふか]い樫[かし]の木[き]の下[した]で、彼[かれ]らはすべての偶像[ぐうぞう]に香[かおり]の良[よ]い匂[にお]いをささげた。"
  14: "わたしは彼[かれ]らに手[て]を伸[の]ばし、その地[ち]を荒廃[こうはい]と滅[ほろ]びとする。デブラタの荒野[こうや]から、彼[かれ]らのすべての住[す]まいまで。あなたがたは、わたしが主[しゅ]であることを知[し]る。」"

notes:
  1: "Καὶ ἐγένετο λόγος κυρίου πρός με λέγων — «и было слово Господне ко мне, говоря»; слав. «И бысть слово Господне ко мне глаголя». Вводная формула вне кавычек; само слово Господа начинается в 6:2 и идёт до конца главы."
  2: "Υἱὲ ἀνθρώπου — «сын человеческий» (人[ひと]の子[こ], по брифу); στήρισον τὸ πρόσωπόν σου ἐπὶ τὰ ὄρη Ισραηλ — «утверди лице твоё к горам Израилевым» (στηρίζω — утверждать, обращать твёрдо); προφήτευσον ἐπ' αὐτά — «прореки на них». Поручение входит в слово Господа."
  3: "Τὰ ὄρη Ισραηλ, ἀκούσατε λόγον κυρίου — «горы Израилевы, слушайте слово Господне»: обращение к горам как к живым. Τάδε λέγει κύριος — «так говорит Господь»; слав. «сия глаголет адонаи Господь» — «Господь Бог» (отсюда 主[しゅ]なる神[かみ]). τοῖς ὄρεσιν καὶ τοῖς βουνοῖς καὶ ταῖς φάραγξιν καὶ ταῖς νάπαις — «горам и холмам, и ущельям (φάραγξ) и лощинам (νάπη)»; слав. «и каменем и дебрем» — «и скалам и дебрям», передано 岩と谷 (смысл тот же: возвышенности и низины). Ἰδοὺ ἐγὼ ἐπάγω ἐφ' ὑμᾶς ῥομφαίαν — «вот, Я навожу на вас меч»; ἐξολεθρευθήσεται τὰ ὑψηλὰ ὑμῶν — «истребятся высоты ваши» (τὰ ὑψηλά — высоты, капища на холмах)."
  4: "συντριβήσονται τὰ θυσιαστήρια ὑμῶν — «сокрушатся жертвенники ваши» (συντρίβω — разбивать); τὰ τεμένη ὑμῶν — «капища ваши» (τέμενος — священный участок, 偶像の社); καταβαλῶ τραυματίας ὑμῶν ἐνώπιον τῶν εἰδώλων ὑμῶν — «повергну убитых ваших перед идолами вашими» (καταβάλλω — бросать вниз). Слав. «требища» — жертвенники, «кумирницы» — капища."
  5: "διασκορπιῶ τὰ ὀστᾶ ὑμῶν κύκλῳ τῶν θυσιαστηρίων ὑμῶν — «рассею кости ваши вокруг жертвенников ваших» (διασκορπίζω — рассеивать). Слав. перед этим добавляет «и дам трупы сынов израилевых пред кумиры их» — этой фразы нет в LXX (чтение МТ); по паритету внесена в основной текст без 〔…〕 (イスラエルの子らの死体)."
  6: "ἐν πάσῃ τῇ κατοικίᾳ ὑμῶν — «во всём жительстве вашем» (κατοικία); αἱ πόλεις ἐξερημωθήσονται — «города опустеют» (ἐξερημόω); τὰ ὑψηλὰ ἀφανισθήσεται — «высоты исчезнут» (ἀφανίζω); ὅπως ἐξολεθρευθῇ — «чтобы истреблены были» (придаточное цели). Слав. добавляет в конце «и потребятся дела ваша» — нет в LXX (МТ); внесено без 〔…〕 (わざ)."
  7: "πεσοῦνται τραυματίαι ἐν μέσῳ ὑμῶν — «падут убитые среди вас»; ἐπιγνώσεσθε ὅτι ἐγὼ κύριος — «узнаете, что Я Господь»: формула познания, повторяется в 6:10, 13, 14. В японском передана одинаково: …であることを知る."
  8: "ἐν τῷ γενέσθαι ἐξ ὑμῶν ἀνασῳζομένους ἐκ ῥομφαίας — «когда будут из вас спасаемые от меча» (ἀνασῴζω — спасать); ἐν τοῖς ἔθνεσιν καὶ ἐν τῷ διασκορπισμῷ ὑμῶν ἐν ταῖς χώραις — «среди народов и при рассеянии вашем по странам» (διασκορπισμός — рассеяние; χώρα — страна). Слав. даёт конечный глагол «оставлю» («И оставлю еже быти…»), поэтому стих переведён самостоятельным предложением; в LXX это придаточное, продолжающееся в 6:9 (главный глагол — «вспомнят»)."
  9: "μνησθήσονταί μου οἱ ἀνασῳζόμενοι — «вспомнят Меня уцелевшие»; οὗ ᾐχμαλωτεύθησαν ἐκεῖ — «куда были отведены в плен» (αἰχμαλωτεύω). ὀμώμοκα τῇ καρδίᾳ αὐτῶν τῇ ἐκπορνευούσῃ ἀπ' ἐμοῦ — «Я поклялся сердцу их, блудившему от Меня»: тёмное место, клятва суда (слав. «кляхся бо сердцу их блудившему»); ἐκπορνεύω — предаваться блуду, 淫行. κόψονται πρόσωπα αὐτῶν — «будут бить лица свои» (знак скорби; κόπτω — ударять); слав. добавляет «яже твориша» («которые делали») — нет в LXX. ἐν πᾶσι τοῖς βδελύγμασιν αὐτῶν — «при всех мерзостях их» (βδέλυγμα — 忌まわしいもの)."
  10: "ἐπιγνώσονται διότι ἐγὼ κύριος λελάληκα — «узнают, что Я, Господь, говорил». Слав. добавляет «не туне глаголах сотворити им вся злая сия» — «не напрасно говорил Я, что наведу на них всё это злое» (чтение МТ); нет в LXX, внесено без 〔…〕 (むなしくはなかった)."
  11: "Κρότησον τῇ χειρὶ καὶ ψόφησον τῷ ποδί — «всплесни рукою и топни ногою» (κροτέω — бить, хлопать; ψοφέω — шуметь); εἰπὸν Εὖγε εὖγε — «скажи: хорошо же, хорошо же!»: ироническое одобрение суда (εὖγε — «славно!»), слав. «благоже, благоже», передано ああ、ああ. ἐπὶ πᾶσιν τοῖς βδελύγμασιν οἴκου Ισραηλ — «за все мерзости дома Израилева»; слав. «о всех мерзостех злобы дому израилева» добавляет «злобы» — нет в LXX. ἐν ῥομφαίᾳ καὶ ἐν θανάτῳ καὶ ἐν λιμῷ — «мечом, и смертью, и голодом»; порядок в слав. иной («мечем и гладом и смертию» — 剣と飢えと死), в тексте по слав."
  12: "ὁ ἐγγὺς ἐν ῥομφαίᾳ πεσεῖται, ὁ δὲ μακρὰν ἐν θανάτῳ τελευτήσει — «близкий падёт от меча, а далёкий умрёт смертью» (τελευτάω — кончаться); ὁ περιεχόμενος ἐν λιμῷ συντελεσθήσεται — «окружённый (осаждённый) голодом будет истреблён» (περιέχω — окружать; συντελέω — завершать, истреблять); συντελέσω τὴν ὀργήν μου ἐπ' αὐτούς — «совершу гнев Мой на них». Слав. меняет порядок: сначала «дальнии смертию скончаются», затем «ближнии мечем падут»; в тексте по слав., порядок LXX — близкий/меч, далёкий/смерть."
  13: "ἐν τῷ εἶναι τοὺς τραυματίας ὑμῶν ἐν μέσῳ τῶν εἰδώλων ὑμῶν — «когда убитые ваши будут среди идолов ваших»; κύκλῳ τῶν θυσιαστηρίων — «вокруг жертвенников». ἐπὶ πάντα βουνὸν ὑψηλὸν καὶ ὑποκάτω δένδρου συσκίου — «на всяком холме высоком и под деревом тенистым» (σύσκιος — тенистый). Слав. добавляет «и на всех версех горних» («на всех вершинах гор») и «под всяким древом чащным» («под всяким деревом густым») — нет в LXX (МТ); внесено без 〔…〕. ὀσμὴν εὐωδίας — «благоухание» (жертвенный дым)."
  14: "ἐκτενῶ τὴν χεῖρά μου ἐπ' αὐτούς — «простру руку Мою на них»; θήσομαι τὴν γῆν εἰς ἀφανισμὸν καὶ εἰς ὄλεθρον — «положу землю в опустошение и в погибель»; ἀπὸ τῆς ἐρήμου Δεβλαθα ἐκ πάσης τῆς κατοικίας — «от пустыни Деблафа, от всего селения их»: тёмное место, вероятно «от пустыни Деблафа до всех поселений»; Δεβλαθα — Деблафа (евр. Дивлаф), デブラタ. καὶ ἐπιγνώσεσθε ὅτι ἐγὼ κύριος — формула познания закрывает главу."
