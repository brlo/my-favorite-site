# jp-box, Иезекииль, глава 6. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 6 (совпадает), 14 стихов.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Глава 6: 1–2 слово Господне и поручение пророку обратиться к горам Израилевым;
# 3–7 меч на высоты, разрушение жертвенников и капищ, убитые перед идолами;
# 8–10 остаток среди народов, память о Господе и познание; 11–14 рукоплескание
# и плач, меч, голод и смерть, рассеяние костей, опустошение земли от пустыни Деблафа.
# Голоса: 6:1 вводная формула вне кавычек; 6:2–14 — одно слово Господа в 「…」
# (пророк возвещает его горам, но говорит Сам Господь, поэтому вложенной речи нет).
# csl-добавления (нет в LXX): 6:5 «трупы сынов израилевых», 6:6 «дела ваша»,
# 6:10 «не туне… вся злая сия», 6:13 «верхи горние» и «древо чащное» — в основном
# тексте без 〔…〕. Порядок даров суда — по слав. (6:11, 6:12).
# Новые имена: デブラタ (Δεβλαθα).

