verses:
  1: "ヨシヤの記念[きねん]は、香料[こうりょう]を調[ととの]えて混[ま]ぜ合[あ]わせ、香[こう]を作[つく]る者[もの]のわざによって整[ととの]えられたもののようである。"
  2: "それはすべての口[くち]において蜜[みつ]のように甘[あま]くされ、ぶどう酒[ぶどうしゅ]の宴[うたげ]の音楽[おんがく]のようになる。"
  3: "彼は民[たみ]を立[た]ち返[かえ]らせることにあって正[ただ]しく導[みちび]かれ、不法[ふほう]の憎[にく]むべきものを除[のぞ]き去[さ]った。"
  4: "彼は自分[じぶん]の心[こころ]を主[しゅ]に向[む]けて正[ただ]しくし、不法[ふほう]な者[もの]たちの日々[ひび]に敬虔[けいけん]を強[つよ]くした。"
  5: "ダビデとエゼキヤとヨシヤのほかは、すべての者[もの]が大[おお]きな罪[つみ]を犯[おか]した。"
  6: "彼らはいと高[たか]き者の律法[りっぽう]を捨[す]て去[さ]ったからである。ユダの王[おう]たちは衰[おとろ]えた。"
  7: "彼らは自分[じぶん]たちの角[つの]をほかの者[もの]たちに与[あた]え、自分[じぶん]たちの栄光[えいこう]を異[こと]なる民[たみ]に与えた。"
  8: "彼らは聖所[せいしょ]の選[えら]ばれた都[みやこ]を火[ひ]で焼[や]き、その道[みち]を荒[あ]らした。"
  9: "預言者[よげんしゃ]エレミヤの手[て]によって。彼らは彼を苦[くる]しめたが、彼は母[はは]の胎[たい]の中[なか]で、預言者[よげんしゃ]として聖[せい]とされていた。根[ね]を抜[ぬ]き、苦[くる]しめ、滅[ほろ]ぼし、同[おな]じように建[た]て、植[う]えるために。"
  10: "エゼキエル。彼は栄光[えいこう]の幻[まぼろし]を見[み]た。それはケルビムの戦車[せんしゃ]の上[うえ]で、主[しゅ]が彼に示[しめ]されたものである。"
  11: "彼は雨[あめ]の中[なか]で敵[てき]のことを思[おも]い起[おこ]し、道[みち]を正[ただ]しくする者[もの]たちに善[よ]いことを行[おこな]おうとした。"
  12: "また、十二人[じゅうににん]の預言者[よげんしゃ]たちの骨[ほね]が、その場所[ばしょ]から芽[め]を出[だ]すように。彼らはヤコブを慰[なぐさ]め、希望[きぼう]への信仰[しんこう]によって人[ひと]びとを救[すく]い出[だ]したからである。"
  13: "どうしてゾロバベルを大[おお]いにほめたたえることができようか。彼もまた、右[みぎ]の手[て]の上[うえ]の印[しるし]のようである。"
  14: "同[おな]じように、ヨセデクの子[こ]イエスも。彼らは自分[じぶん]たちの日々[ひび]に家[いえ]を建[た]て、主[しゅ]のために聖[せい]なる神殿[しんでん]を建[た]て起[お]こした。それは永遠[えいえん]の栄光[えいこう]のために備[そな]えられたものである。"
  15: "ネヘミヤの記念[きねん]もまた大[おお]きい。彼はわたしたちのために倒[たお]れた城壁[じょうへき]を起[お]こし、門[もん]とかんぬきを立[た]て、わたしたちの家屋[かおく]を建[た]て直[なお]した。"
  16: "地[ち]の上[うえ]に、エノクのような者[もの]は造[つく]られなかった。彼もまた地[ち]から取[と]り上[あ]げられたからである。"
  17: "また、兄弟[きょうだい]たちを導[みちび]く者[もの]、民[たみ]の支[ささ]えとなる者として、ヨセフのような人[ひと]は生[う]まれなかった。彼の骨[ほね]もまた顧[かえり]みられた。"
  18: "セムとセトは人[ひと]の間[あいだ]で栄光[えいこう]を受[う]け、被造物[ひぞうぶつ]のうちで、すべての生[い]き物[もの]にまさる者[もの]はアダムである。"

notes:
  1: "Μνημόσυνον Ιωσιου εἰς σύνθεσιν θυμιάματος — «память Иосии — в состав благовония (фимиама)» (μνημόσυνον — память, памятование; σύνθεσις — составление; θυμίαμα — фимиам, благовоние). ἐσκευασμένον ἔργῳ μυρεψοῦ — «приготовленный искусством мироварника» (σκευάζω — готовить; μυρεψός — изготовитель мазей)."
  2: "ἐν παντὶ στόματι ὡς μέλι γλυκανθήσεται — «во всяких устах, как мёд, будет сладок» (γλυκαίνω — делать сладким). ὡς μουσικὰ ἐν συμποσίῳ οἴνου — «как музыка на пиру вина» (συμπόσιον — пир)."
  3: "αὐτὸς κατευθύνθη ἐν ἐπιστροφῇ λαοῦ — «он был направлен (прав) в обращении народа» (κατευθύνω — направлять, исправлять; ἐπιστροφή — обращение, возвращение). ἐξῆρεν βδελύγματα ἀνομίας — «изъял мерзости беззакония» (βδέλυγμα — мерзость; ἀνομία — беззаконие): реформы Иосии (4 Цар 22–23)."
  4: "κατεύθυνεν πρὸς κύριον τὴν καρδίαν αὐτοῦ — «он направил к Господу сердце своё». ἐν ἡμέραις ἀνόμων κατίσχυσεν τὴν εὐσέβειαν — «во дни беззаконных он усилил благочестие» (κατισχύω — укреплять, осиливать; εὐσέβεια — благочестие). Слав. «во дни беззаконных укрепи благочестие»."
  5: "Πάρεξ Δαυιδ καὶ Εζεκιου καὶ Ιωσιου — «кроме Давида, Езекии и Иосии». πάντες πλημμέλειαν ἐπλημμέλησαν — «все тяжко согрешили» (πλημμέλεια — проступок; πλημμελέω — грешить; усилительный оборот)."
  6: "κατέλιπον γὰρ τὸν νόμον τοῦ ὑψίστου — «ибо оставили закон Всевышнего» (καταλείπω — оставлять). οἱ βασιλεῖς Ιουδα ἐξέλιπον — «цари Иудеи оскудели, престали» (ἐκλείπω — прекращаться, иссякать)."
  7: "ἔδωκαν γὰρ τὸ κέρας αὐτῶν ἑτέροις — «ибо они отдали рог свой иным» (κέρας — рог, сила; ἕτερος — другой). τὴν δόξαν αὐτῶν ἔθνει ἀλλοτρίῳ — «славу свою — народу чужому» (ἔθνος — народ; ἀλλότριος — чужой). Слав. «даша бо рог свой инем и славу свою языку чуждему»."
  8: "ἐνεπύρισαν ἐκλεκτὴν πόλιν ἁγιάσματος — «сожгли избранный город святыни» (ἐμπυρίζω — сжигать; ἁγίασμα — святыня): Иерусалим. ἠρήμωσαν τὰς ὁδοὺς αὐτῆς — «опустошили улицы его» (ἐρημόω — опустошать; ὁδός — дорога, улица). Слав. добавляет «рукою иеремииною» уже здесь; по gr это начало ст. 7."
  9: "ἐν χειρὶ Ιερεμιου — «рукою Иеремии»: город сожжён по слову пророка (ср. Иер 37–39); греч. синтаксис продолжает ст. 6. ἐκάκωσαν γὰρ αὐτόν — «ибо они измучили (ожесточили) его» (κακόω — вредить, мучить). αὐτὸς ἐν μήτρᾳ ἡγιάσθη προφήτης — «он во чреве освящён был как пророк» (ἁγιάζω — освящать): призвание Иеремии от рождения (Иер 1:5). ἐκριζοῦν καὶ κακοῦν καὶ ἀπολλύειν — «искоренять, губить и погублять» (ἐκριζόω — вырывать с корнем); οἰκοδομεῖν καὶ καταφυτεύειν — «строить и насаждать». Слав. даёт этот стих как 9-й."
  10: "Ιεζεκιηλ ὃς εἶδεν ὅρασιν δόξης — «Иезекииль, который видел видение славы» (ὅρασις — видение). ἣν ὑπέδειξεν αὐτῷ ἐπὶ ἅρματος χερουβιν — «которое показал ему на колеснице херувимов» (ὑποδείκνυμι — показывать; ἅρμα — колесница; χερουβιν — херувимы): видение колесницы (Иез 1). Слав. «в колеснице херувимсте»."
  11: "καὶ γὰρ ἐμνήσθη τῶν ἐχθρῶν ἐν ὄμβρῳ — «ибо он вспомнил врагов в дожде» (ὄμβρος — ливень): место тёмное; вероятно, образ суда над врагами через дождь (ср. Иез 38:22); слав. «помяну бо враги в дожди». ἀγαθῶσαι τοὺς εὐθύνοντας ὁδούς — «облагодетельствовать направляющих пути» (ἀγαθόω — делать добро; εὐθύνω — выправлять). Понимание гадательно, буквальность сохранена."
  12: "τῶν δώδεκα προφητῶν τὰ ὀστᾶ ἀναθάλοι ἐκ τοῦ τόπου αὐτῶν — «кости двенадцати пророков да процветут от места своего» (ἀναθάλλω — расцветать, пускать побеги; ἀναθάλοι — оптатив, пожелание). παρεκάλεσαν γὰρ τὸν Ιακωβ — «ибо они утешили Иакова» (παρακαλέω — утешать). ἐλυτρώσαντο αὐτοὺς ἐν πίστει ἐλπίδος — «избавили их верою надежды» (λυτρόω — избавлять; πίστις — вера; ἐλπίς — надежда)."
  13: "Πῶς μεγαλύνωμεν τὸν Ζοροβαβελ — «как прославим Зоровавеля» (μεγαλύνω — величать, прославлять; вопросительное пожелание). καὶ αὐτὸς ὡς σφραγὶς ἐπὶ δεξιᾶς χειρός — «и он, как печать на правой руке» (σφραγίς — печать, перстень): образ избранности (ср. Агг 2:23)."
  14: "οὕτως Ἰησοῦς υἱὸς Ιωσεδεκ — «так и Иисус, сын Иоседека»: первосвященник при Зоровавеле. οἳ ἐν ἡμέραις αὐτῶν ᾠκοδόμησαν οἶκον — «они во дни свои построили дом» (мн. ч. οἵ относится к обоим). ἀνύψωσαν ναὸν ἅγιον κυρίῳ — «воздвигли храм святой Господу» (ἀνυψόω — воздвигать). ἡτοιμασμένον εἰς δόξαν αἰῶνος — «приготовленный к славе века» (ἑτοιμάζω — готовить)."
  15: "Νεεμιου ἐπὶ πολὺ τὸ μνημόσυνον — «Неемии память весьма велика» (μνημόσυνον — память). τοῦ ἐγείραντος ἡμῖν τείχη πεπτωκότα — «воздвигшего нам павшие стены» (ἐγείρω — воздвигать; τεῖχος — стена). στήσαντος πύλας καὶ μοχλούς — «поставившего ворота и запоры» (ἵστημι — ставить; πύλη — ворота; μοχλός — засов). ἀνεγείραντος τὰ οἰκόπεδα ἡμῶν — «восстановившего дома наши» (οἰκόπεδον — строение, дом)."
  16: "Οὐδεὶς ἐκτίσθη ἐπὶ τῆς γῆς τοιοῦτος οἷος Ενωχ — «никто на земле не был создан таким, как Енох» (κτίζω — создавать, творить). καὶ γὰρ αὐτὸς ἀνελήμφθη ἀπὸ τῆς γῆς — «ибо и он был взят с земли» (ἀναλαμβάνω — брать вверх): взятие Еноха (Быт 5:24)."
  17: "οὐδὲ ὡς Ιωσηφ ἐγεννήθη ἀνὴρ ἡγούμενος ἀδελφῶν — «и как Иосиф не родился муж, предводительствующий братьями» (ἡγέομαι — вести, предводительствовать). στήριγμα λαοῦ — «утверждение народа» (στήριγμα — опора). τὰ ὀστᾶ αὐτοῦ ἐπεσκέπησαν — «кости его были посещены (почтены)» (ἐπισκέπτομαι — посещать, попечительски смотреть): перенесение костей Иосифа (Нав 24:32)."
  18: "Σημ καὶ Σηθ ἐν ἀνθρώποις ἐδοξάσθησαν — «Сим и Сиф между людьми прославились» (δοξάζω — прославлять). ὑπὲρ πᾶν ζῷον ἐν τῇ κτίσει Αδαμ — «более всякого живого существа в творении — Адам» (ζῷον — живое существо; κτίσις — творение): Адам превыше всего живого. Слав. «паче всякаго животнаго в твари адам»."
