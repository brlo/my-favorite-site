# jp-box, Иезекииль, глава 4. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для главы нет (лакуна в модуле); jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 4: 1–3 кирпич с начертанным Иерусалимом, осада, железная сковорода-стена;
# 4–8 пророк лежит на левом боку сто пятьдесят дней (неправды Израиля), затем на
# правом сорок дней (неправды Иуды), «день за год», узы и неподвижность; 9–12 хлеб
# из шести злаков, вес двадцать сиклей, вода шестая часть ина, ячменный опреснок,
# печённый на человеческом навозе; 13–15 нечистый хлеб у народов и ответ пророка
# «никак», замена на коровий навоз; 16–17 сокрушение опоры хлеба, вес и мера, гибель
# человека и брата его, истаивание в неправдах.
# Нумерация по gr: 17 стихов, совпадает с csl и ru.
# Голоса: 4:1–4:13 — речь Бога в 「…」 (в 4:13 вложенные слова пророка к народу —
# 『…』; там же речь закрывается); 4:14 — повествование и ответ пророка в 「…」;
# 4:15 — вводная формула и речь Бога в 「…」; 4:16–4:17 — речь Бога в 「…」.
# Вводные формулы («И сказал мне») — вне кавычек.
# 〔…〕 нет. Слав. добавления внесены в основной текст без скобок и оговорены:
# 4:13 «хлеб свой», «аможе разсыплю я». Редакционные скобки слав. («(сыне
# человечь)» в 4:9) не переводились.
# Сносок ⟨…⟩ нет: れんが, 平鍋, シケル, ヒン, パン, 糞 уже в корпусе или понятны.
# Имена — транслитерация греческого (LXX): エゼキエル (в главе не назван), イスラエル,
# ユダ, エルサレム.
# Повторяющиеся формулы: Υἱὲ ἀνθρώπου — 人[ひと]の子[こ]; ἀδικία — 不法[ふほう];
# ἐν σταθμῷ — 目方[めかた]で; ἀπὸ καιροῦ ἕως καιροῦ — 時[とき]から時[とき]へ.

