verses:
  1: "「人[ひと]の子[こ]よ、あなたはれんがを取[と]って自分[じぶん]の前[まえ]に置[お]き、その上[うえ]にエルサレムという都[みやこ]を描[えが]け。"
  2: "これに包囲[ほうい]を設[もう]け、これに防壁[ぼうへき]を築[きず]き、これに柵[さく]を巡[めぐ]らし、これに陣営[じんえい]を置[お]き、その周[まわ]りに矢[や]を射[い]る機械[きかい]を据[す]えよ。"
  3: "あなたは鉄[てつ]の平[ひら]鍋[なべ]を取り、あなたと都[みやこ]との間[あいだ]に鉄[てつ]の壁[かべ]として置[お]け。あなたの顔[かお]をそれに向[む]けよ。それは包囲[ほうい]のうちにあり、あなたはそれを包囲[ほうい]する。これがイスラエルの子[こ]らへのしるしである。"
  4: "あなたは左[ひだり]の脇[わき]を下[した]にして横[よこ]たわれ。その上[うえ]に、イスラエルの家[いえ]の不法[ふほう]を置[お]け。その上[うえ]に横[よこ]たわる日[ひ]の数[かず]、すなわち百五十日[ひゃくごじゅうにち]の間[あいだ]、あなたは彼[かれ]らの不法[ふほう]を負[お]う。"
  5: "わたしはあなたに、彼[かれ]らの二[ふた]つの不法[ふほう]を日[ひ]の数[かず]として与[あた]えた。すなわち百九十日[ひゃくきゅうじゅうにち]である。あなたはイスラエルの家[いえ]の不法[ふほう]を負[お]う。"
  6: "これをすべて終[お]えたなら、あなたは二[ふた]たび、右[みぎ]の脇[わき]を下[した]にして横[よこ]たわる。あなたはユダの家[いえ]の不法[ふほう]を、四十日[しじゅうにち]の間[あいだ]負[お]う。わたしはあなたに、一日[いちにち]を一年[いちねん]として定[さだ]めた。"
  7: "あなたはエルサレムの包囲[ほうい]に向[む]かって顔[かお]を定[さだ]め、あなたの腕[うで]を強[つよ]くし、これに向[む]かって預言[よげん]せよ。"
  8: "見[み]よ、わたしはあなたの上[うえ]に縄[なわ]を置[お]いた。あなたは包囲[ほうい]の日[ひ]々[び]が終[お]わるまで、脇[わき]から脇[わき]へ寝返[ねがえ]りしてはならない。"
  9: "あなたは小麦[こむぎ]、大麦[おおむぎ]、豆[まめ]、レンズ豆[まめ]、粟[あわ]、スペルト小麦[こむぎ]を取[と]り、それらを一[ひと]つの土[つち]の器[うつわ]に入[い]れ、それで自分[じぶん]のパンを作[つく]れ。あなたが脇[わき]を下[した]にして横[よこ]たわる日[ひ]の数[かず]、すなわち百九十日[ひゃくきゅうじゅうにち]の間[あいだ]、あなたはそれを食[た]べる。"
  10: "あなたの食[た]べ物[もの]は、一日[いちにち]に二十[にじゅう]シケルの目方[めかた]とし、時[とき]から時[とき]へと食[た]べよ。"
  11: "水[みず]も量[はか]って飲[の]め。ヒンの六分[ろくぶん]の一[いち]を、時[とき]から時[とき]へと飲[の]め。"
  12: "あなたはそれを、大麦[おおむぎ]の種[たね]なしパンとして食[た]べよ。人[ひと]の糞[ふん]の塊[かたまり]の上[うえ]で、彼[かれ]らの目[め]の前[まえ]でそれを焼[や]け。"
  13: "あなたは言[い]わなければならない。『イスラエルの神[かみ]である主[しゅ]はこう言[い]われる。イスラエルの子[こ]らは、わたしが彼[かれ]らを追[お]いやった国[くに]々[ぐに]の間[あいだ]で、汚[けが]れたパンを食[た]べる』と。」"
  14: "わたしは言[い]った。「決[けっ]して、主[しゅ]なるイスラエルの神[かみ]よ。見[み]てください。わたしの魂[たましい]は汚[けが]れに染[そ]まったことがありません。死[し]んだものや獣[けもの]に裂[さ]かれたものを、生[う]まれてから今[いま]に至[いた]るまで食[た]べたことがありません。汚[けが]れた肉[にく]、忌[い]まわしい肉[にく]は、わたしの口[くち]に入[はい]ったことがありません。」"
  15: "わたしに言[い]われた。「見[み]よ、わたしは人[ひと]の糞[ふん]の代[か]わりに、牛[うし]の糞[ふん]をあなたに与[あた]える。あなたはその上[うえ]でパンを焼[や]くがよい。」"
  16: "わたしに言[い]われた。「人[ひと]の子[こ]よ、見[み]よ、わたしはエルサレムでパンの支[ささ]えを打[う]ち砕[くだ]く。彼[かれ]らはパンを目方[めかた]で、乏[とぼ]しさのうちに食[た]べ、水[みず]を量[はか]って、恐[おそ]れのうちに飲[の]む。"
  17: "彼[かれ]らはパンと水[みず]に乏[とぼ]しくなる。人[ひと]もその兄弟[きょうだい]も滅[ほろ]び、自分[じぶん]の不法[ふほう]のうちに溶[と]けていなくなる。」"

notes:
  1: "πλίνθον — «плинфу» (πλίνθος — кирпич-сырец, れんが); θήσεις αὐτὴν πρὸ προσώπου σου — «положишь её пред лицом твоим»; διαγράψεις ἐπ᾽ αὐτὴν πόλιν τὴν Ιερουσαλημ — «начертаешь на ней город Иерусалим» (διαγράφω — чертить, 描く). Речь Бога открывается здесь и идёт до конца 4:13, без новых вводных формул."
  2: "περιοχήν — «обложение, осаду» (περιοχή — обвод, осадное укрепление); προμαχῶνας — «передовые укрепления» (προμαχών — бастион, 防壁); χάρακα — «вал, острог» (χάραξ — частокол, 柵); παρεμβολάς — «станы» (παρεμβολή — лагерь, 陣営); τάξεις τὰς βελοστάσεις — «построения стреломётных машин» (βελοστάσις — баллиста, 機械)."
  3: "τήγανον σιδηροῦν — «железная сковорода» (τήγανον — сковорода, 平鍋); θήσεις αὐτὸ τοῖχον σιδηροῦν ἀνὰ μέσον σοῦ καὶ τῆς πόλεως — «положишь её железной стеной между тобою и городом»; ἔσται ἐν συγκλεισμῷ, καὶ συγκλείσεις αὐτήν — «будет в осаде, и осадишь его» (συγκλεισμός — заключение, осада); σημεῖον — «знамение» (しるし)."
  4: "κοιμηθήσῃ ἐπὶ τὸ πλευρὸν τὸ ἀριστερόν — «ляжешь на левый бок» (πλευρόν — бок, ребро, 脇); θήσεις τὰς ἀδικίας τοῦ οἴκου Ισραηλ ἐπ᾽ αὐτοῦ — «положишь неправды дома Израилева на нём»; κατὰ ἀριθμὸν τῶν ἡμερῶν πεντήκοντα καὶ ἑκατόν — «по числу дней: пятьдесят и сто» (в гр. порядок «пятьдесят и сто», отсюда 百五十); λήμψῃ τὰς ἀδικίας αὐτῶν — «понесёшь неправды их»."
  5: "δύο ἀδικίας αὐτῶν — «две неправды их»; εἰς ἀριθμὸν ἡμερῶν ἐνενήκοντα καὶ ἑκατὸν ἡμέρας — «в число дней: девяносто и сто дней» (порядок «девяносто и сто» — как в гр. и слав.; МТ и ru читают 390, в текст не внесено); λήμψῃ τὰς ἀδικίας τοῦ οἴκου Ισραηλ — «понесёшь неправды дома Израилева»."
  6: "συντελέσεις ταῦτα πάντα — «совершишь всё это»; ἐπὶ τὸ πλευρόν σου τὸ δεξιόν — «на правый бок твой»; τεσσαράκοντα ἡμέρας — «сорок дней»; ἡμέραν εἰς ἐνιαυτὸν τέθεικά σοι — «день за год Я положил тебе» (слав. «день за едино лето»)."
  7: "εἰς τὸν συγκλεισμὸν Ιερουσαλημ — «на осаду Иерусалима»; ἑτοιμάσεις τὸ πρόσωπόν σου — «уготовишь лицо твоё»; τὸν βραχίονά σου στερεώσεις — «мышцу твою утвердишь» (βραχίων — рука, мышца; обнажённая рука — знак войны); προφητεύσεις ἐπ᾽ αὐτήν — «будешь пророчествовать на него»."
  8: "ἰδοὺ δέδωκα ἐπὶ σὲ δεσμούς — «вот, Я возложил на тебя узы»; μὴ στραφῇς ἀπὸ τοῦ πλευροῦ σου ἐπὶ τὸ πλευρόν σου — «не повернёшься с боку твоего на бок твой»; ἕως οὗ συντελεσθῶσιν αἱ ἡμέραι τοῦ συγκλεισμοῦ σου — «доколе не исполнятся дни осады твоей»."
  9: "πυροὺς καὶ κριθάς, κύαμον καὶ φακόν, κέγχρον καὶ ὄλυραν — «пшеницу, ячмень, боб, чечевицу, просо и полбу» (κέγχρος — просо, 粟; ὄλυρα — полба, спельта, スペルト小麦); ἄγγος ἓν ὀστράκινον — «сосуд один глиняный» (ὀστράκινος — глиняный); κατ᾽ ἀριθμὸν τῶν ἡμερῶν ἐνενήκοντα καὶ ἑκατὸν ἡμέρας — «по числу дней: девяносто и сто дней»; φάγεσαι αὐτά — «будешь есть их». В начале слав. редакционное «(сыне человечь)» — не переводилось."
  10: "ἐν σταθμῷ εἴκοσι σίκλους τὴν ἡμέραν — «весом двадцать сиклей в день» (σταθμός — вес; σίκλος — сикль, シケル); ἀπὸ καιροῦ ἕως καιροῦ — «от времени до времени», т.е. размеренно, порциями."
  11: "ὕδωρ ἐν μέτρῳ — «воду мерою» (μέτρον — мера); τὸ ἕκτον τοῦ ιν — «шестую часть ина» (ἴν — мера объёма, ヒン; в корпусе: Лев 23:13 и др., без фуриганы); ἀπὸ καιροῦ ἕως καιροῦ πίεσαι — «от времени до времени будешь пить»."
  12: "ἐγκρυφίαν κρίθινον — «опреснок ячменный» (ἐγκρυφίας — хлеб, печённый в золе; опреснок — пресный, 種なしパン); βόλβιτα κόπρου ἀνθρωπίνης — «комки человеческого навоза» (βόλβιτον — навозная лепёшка; κόπρος — навоз, 糞); ἐγκρύψεις αὐτὰ κατ᾽ ὀφθαλμοὺς αὐτῶν — «испечёшь их пред глазами их». Образ нарочито нечистый, не сглажен."
  13: "Τάδε λέγει κύριος ὁ θεὸς τοῦ Ισραηλ — «так говорит Господь Бог Израилев»; ἀκάθαρτα — «нечистое» (汚れた); ἐν τοῖς ἔθνεσιν — «у народов». Слав. добавляет «хлеб свой» и «аможе разсыплю я» («куда Я рассею их») — в LXX нет, внесено без скобок. Слова пророка к народу — 『…』; здесь речь Бога закрывается."
  14: "Μηδαμῶς — «никак» (сильный отказ); οὐ μεμίανται ἡ ψυχή μου ἐν ἀκαθαρσίᾳ — «не осквернилась душа моя в нечистоте» (μιαίνω — осквернять); θνησιμαῖον καὶ θηριάλωτον — «мертвечина и звероядина» (θνησιμαῖος — падаль; θηριάλωτος — растерзанное зверем); ἕωλον — «несвежее, вчерашнее» мясо (ἕωλος — вчерашний)."
  15: "βόλβιτα βοῶν ἀντὶ τῶν βολβίτων τῶν ἀνθρωπίνων — «коровьи лепёшки вместо человеческих»; ποιήσεις τοὺς ἄρτους σου ἐπ᾽ αὐτῶν — «будешь печь хлебы твои на них»."
  16: "συντρίβω στήριγμα ἄρτου ἐν Ιερουσαλημ — «сокрушу опору хлеба в Иерусалиме» (στήριγμα — опора, подкрепление, 支え); ἐν σταθμῷ καὶ ἐν ἐνδείᾳ — «весом и в оскудении» (ἔνδεια — недостаток); ὕδωρ ἐν μέτρῳ καὶ ἐν ἀφανισμῷ — «воду мерою и в исчезновении» (ἀφανισμός — уничтожение, пагуба)."
  17: "ἐνδεεῖς γένωνται ἄρτου καὶ ὕδατος — «сделаются скудными хлебом и водою»; ἀφανισθήσεται ἄνθρωπος καὶ ἀδελφὸς αὐτοῦ — «погибнет человек и брат его»; τακήσονται ἐν ταῖς ἀδικίαις αὐτῶν — «истают в неправдах своих» (τήκω — плавить, таять). Здесь речь Бога закрывается."
