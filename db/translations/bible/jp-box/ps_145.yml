verses:
  1: "アレルヤ。ハガイとゼカリヤの詩[うた]。わたしの魂[たましい]よ、主[しゅ]をほめたたえよ。"
  2: "わたしは生[い]きている限[かぎ]り主[しゅ]をほめたたえ、わたしが存在[そんざい]する限[かぎ]り、わたしの神[かみ]に歌[うた]う。"
  3: "支[し]配[はい]者[しゃ]たちや、救[すく]いを持[も]たない人[ひと]の子[こ]らに、信[しん]を置[お]いてはならない。"
  4: "その霊[れい]が去[さ]り、その人[ひと]が自分[じぶん]の土[つち]に帰[かえ]ると、その日[ひ]に、その人[ひと]のすべての思[おも]いは消[き]え失[う]せる。"
  5: "ヤコブの神[かみ]を助[たす]けとする者[もの]、その望[のぞ]みを主[しゅ]その神[かみ]に置[お]く者[もの]は幸[さいわ]いである。"
  6: "主[しゅ]は天[てん]と地[ち]と海[うみ]と、その中[なか]のすべてのものを造[つく]り、とこしえに真実[しんじつ]を守[まも]られる。"
  7: "主[しゅ]は虐[しいた]げられる者[もの]のために裁[さば]きを行[おこな]い、飢[う]える者[もの]に食物[しょくもつ]を与[あた]え、捕[とら]われた者[もの]を解[と]き放[はな]たれる。"
  8: "主[しゅ]は押[お]し伏[ふ]せられた者[もの]を起[おこ]し、主[しゅ]は目[め]の見[み]えない者[もの]を賢[かしこ]くされ、主[しゅ]は正[ただ]しい者[もの]を愛[あい]される。"
  9: "主[しゅ]は寄[き]留[りゅう]者[しゃ]を守[まも]り、孤[みなし]児[ご]と寡婦[やもめ]を支[ささ]え、罪[つみ]人[びと]の道[みち]を覆[くつがえ]される。"
  10: "主[しゅ]はとこしえに王[おう]として治[しら]す。シオンよ、あなたの神[かみ]は代[よ]から代[よ]に治[しら]す。"

notes:
  1: "Αλληλουια· Αγγαιου καὶ Ζαχαριου — アレルヤ。ハガイとゼカリヤの詩 (Αγγαιος — ハガイ; Ζαχαριας — ゼカリヤ; надписание в греч. то же, что в Пс 146–148). Надписание — стих 0 (в csl-ru отдельного стиха нет, влито в ст. 1). Αἴνει, ἡ ψυχή μου, τὸν κύριον — わたしの魂よ、主をほめたたえよ (ψυχή — 魂; обращение к себе, как в Пс 102:1)."
  2: "αἰνέσω κύριον ἐν ζωῇ μου — 生いている限り主をほめたたえ (ζωή — «жизнь»). ψαλῶ τῷ θεῷ μου, ἕως ὑπάρχω — 存在する限り、わたしの神に歌う (ὑπάρχω — «существовать»; повтор «доколе» передан двумя 限り)."
  3: "μὴ πεποίθατε ἐπ᾽ ἄρχοντας — 支配者たちに信を置いてはならない (πείθω, perfect πεποίθατε — «положились»; ἄρχων — «начальник, князь»). ἐφ᾽ υἱοὺς ἀνθρώπων, οἷς οὐκ ἔστιν σωτηρία — 救いを持たない人の子らに (σωτηρία — 救い)."
  4: "ἐξελεύσεται τὸ πνεῦμα αὐτοῦ — その霊が去り (πνεῦμα — 霊, здесь «дыхание жизни»). ἐπιστρέψει εἰς τὴν γῆν αὐτοῦ — 自分の土に帰る (ἐπιστρέφω — «возвращаться»). ἐν ἐκείνῃ τῇ ἡμέρᾳ ἀπολοῦνται πάντες οἱ διαλογισμοὶ αὐτῶν — その日に、その人のすべての思いは消え失せる (διαλογισμός — «помышление»)."
  5: "μακάριος οὗ ὁ θεὸς Ιακωβ βοηθός — ヤコブの神を助けとする者は幸い (βοηθός — «помощник»). ἡ ἐλπὶς αὐτοῦ ἐπὶ κύριον τὸν θεὸν αὐτοῦ — その望みを主その神に置く者 (ἐλπίς — 望み)."
  6: "τὸν ποιήσαντα τὸν οὐρανὸν καὶ τὴν γῆν — 天と地を造り (ποιέω — «творить»). τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς — 海とその中のすべてのもの. τὸν φυλάσσοντα ἀλήθειαν εἰς τὸν αἰῶνα — とこしえに真実を守られる (ἀλήθεια — 真実)."
  7: "ποιοῦντα κρίμα τοῖς ἀδικουμένοις — 虐げられる者のために裁きを行い (κρίμα — «суд»; ἀδικέω — «обижать»). διδόντα τροφὴν τοῖς πεινῶσιν — 飢える者に食物を与え (τροφή — «пища»). κύριος λύει πεπεδημένους — 主は捕われた者を解き放たれる (λύω — «разрешать»; πεδέω — «связывать»)."
  8: "κύριος ἀνορθοῖ κατερραγμένους — 主は押し伏せられた者を起こし. κύριος σοφοῖ τυφλούς — 主は目の見えない者を賢くされる (σοφόω — «умудрять»; слав. «умудряяй слепцы»). κύριος ἀγαπᾷ δικαίους — 主は正しい者を愛される."
  9: "κύριος φυλάσσει τοὺς προσηλύτους — 主は寄留者を守り (προσήλυτος — «пришелец»). ὀρφανὸν καὶ χήραν ἀναλήμψεται — 孤児と寡婦を支え (ἀναλαμβάνω — «принимать, поднимать»). ὁδὸν ἁμαρτωλῶν ἀφανιεῖ — 罪人の道を覆される (ἀφανίζω — «уничтожать»)."
  10: "βασιλεύσει κύριος εἰς τὸν αἰῶνα — 主はとこしえに王として治める (βασιλεύω — «царствовать»). ὁ θεός σου, Σιων, εἰς γενεὰν καὶ γενεάν — シオンよ、あなたの神は代から代に治める."
