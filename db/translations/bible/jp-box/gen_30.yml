verses:
  1: "ラケルは、自分[じぶん]がヤコブに子[こ]を産[う]んでいないのを見[み]て、姉[あね]をねたみ、ヤコブに言[い]った。「わたしに子[こ]を与[あた]えなさい。そうでなければ、わたしは死[し]ぬ。」"
  2: "ヤコブはラケルに怒[いか]りを発[はっ]して言[い]った。「わたしが、あなたから胎[たい]の実[み]を奪[うば]った神[かみ]の代[か]わりだとでもいうのか。」"
  3: "ラケルは言[い]った。「見[み]よ、わたしの女奴隷[おんなどれい]ビルハがいる。彼女[かのじょ]のところへ入[はい]りなさい。彼女[かのじょ]はわたしの膝[ひざ]の上[うえ]で産[う]み、わたしもまた彼女[かのじょ]によって子[こ]を得[え]るだろう。」"
  4: "ラケルは自分[じぶん]の女奴隷[おんなどれい]ビルハを彼[かれ]の妻[つま]として与[あた]えた。ヤコブは彼女[かのじょ]のところへ入[はい]った。"
  5: "ラケルの女奴隷[おんなどれい]ビルハは身[み]ごもって、ヤコブに男[おとこ]の子[こ]を産[う]んだ。"
  6: "ラケルは言[い]った。「神[かみ]はわたしのために裁[さば]き、わたしの声[こえ]を聞[き]いて、わたしに男[おとこ]の子[こ]を与[あた]えられた。」それゆえ、その名[な]をダンと名[な]づけた。"
  7: "ラケルの女奴隷[おんなどれい]ビルハはさらに身[み]ごもって、ヤコブに二[ふた]人[り]目[め]の男[おとこ]の子[こ]を産[う]んだ。"
  8: "ラケルは言[い]った。「神[かみ]はわたしと取[と]り組[く]み、わたしは姉[あね]と争[あらそ]って勝[か]った。」それゆえ、その名[な]をナフタリと名[な]づけた。"
  9: "レアは、自分[じぶん]が産[う]むことをやめたのを見[み]て、自分[じぶん]の女奴隷[おんなどれい]ジルパを取[と]り、ヤコブに妻[つま]として与[あた]えた。"
  10: "ヤコブは彼女[かのじょ]のところへ入[はい]り、レアの女奴隷[おんなどれい]ジルパは身[み]ごもって、ヤコブに男[おとこ]の子[こ]を産[う]んだ。"
  11: "レアは言[い]った。「幸運[こううん]が訪[おとず]れた。」そしてその名[な]をガドと名[な]づけた。"
  12: "レアの女奴隷[おんなどれい]ジルパはさらに身[み]ごもって、ヤコブに二[ふた]人[り]目[め]の男[おとこ]の子[こ]を産[う]んだ。"
  13: "レアは言[い]った。「わたしは幸[しあわ]せである。女[おんな]たちがわたしを幸[しあわ]せな者[もの]と呼[よ]ぶからである。」そしてその名[な]をアシェルと名[な]づけた。"
  14: "ルベンは麦[むぎ]の刈[か]り入[い]れのころに出[で]かけて、野[の]でマンドラゴラの実[み]を見[み]つけ、母[はは]レアのところへ持[も]って来[き]た。ラケルはレアに言[い]った。「あなたの子[こ]が持[も]って来[き]たマンドラゴラを、わたしにください。」"
  15: "レアは言[い]った。「あなたがわたしの夫[おっと]を取[と]っただけでは足[た]りないのか。わたしの子[こ]のマンドラゴラまで取[と]ろうというのか。」ラケルは言[い]った。「そうではない。あなたの子[こ]のマンドラゴラの代[か]わりに、今夜[こんや]、彼[かれ]はあなたとともに寝[ね]るがよい。」"
  16: "夕[ゆう]べ、ヤコブは野[の]から帰[かえ]って来[き]た。レアは彼[かれ]を迎[むか]えに出[で]て言[い]った。「今日[きょう]はわたしのところへ入[はい]ってください。わたしの子[こ]のマンドラゴラの代[か]わりに、わたしはあなたを雇[やと]ったのですから。」ヤコブはその夜[よる]、彼女[かのじょ]とともに寝[ね]た。"
  17: "神[かみ]はレアの願[ねが]いを聞[き]き入[い]れ、彼女[かのじょ]は身[み]ごもって、ヤコブに五[ご]人[にん]目[め]の男[おとこ]の子[こ]を産[う]んだ。"
  18: "レアは言[い]った。「神[かみ]は、わたしが女奴隷[おんなどれい]を夫[おっと]に与[あた]えたその報[むく]いを、わたしに与[あた]えられた。」そしてその名[な]をイッサカル、すなわち「報[むく]い」と名[な]づけた。"
  19: "レアはさらに身[み]ごもって、ヤコブに六[ろく]人[にん]目[め]の男[おとこ]の子[こ]を産[う]んだ。"
  20: "レアは言[い]った。「神[かみ]はわたしに良[よ]い贈[おく]り物[もの]を贈[おく]ってくださった。今[いま]という時[とき]、わたしの夫[おっと]はわたしを選[えら]ぶだろう。わたしが彼[かれ]に六人[ろくにん]の男[おとこ]の子[こ]を産[う]んだからである。」そしてその名[な]をゼブルンと名[な]づけた。"
  21: "その後[のち]、彼女[かのじょ]は娘[むすめ]を産[う]み、その名[な]をディナと名[な]づけた。"
  22: "神[かみ]はラケルを心[こころ]に留[と]め、彼女[かのじょ]の願[ねが]いを聞[き]き入[い]れて、彼女[かのじょ]の胎[たい]を開[ひら]かれた。"
  23: "彼女[かのじょ]は身[み]ごもって、ヤコブに男[おとこ]の子[こ]を産[う]んだ。ラケルは言[い]った。「神[かみ]はわたしの恥[はじ]を取[と]り去[さ]られた。」"
  24: "そしてその名[な]をヨセフと名[な]づけて言[い]った。「神[かみ]がわたしにほかにもう一[ひと]人[り]、男[おとこ]の子[こ]を加[くわ]えてくださるように。」"
  25: "ラケルがヨセフを産[う]むと、ヤコブはラバンに言[い]った。「わたしを送[おく]り出[だ]してください。わたしの場所[ばしょ]、わたしの地[ち]へ行[い]きたいのです。"
  26: "わたしがあなたに仕[つか]えてきた、わたしの妻[つま]たちと子[こ]どもたちを渡[わた]してください。わたしは去[さ]ります。あなたは、わたしがあなたにした仕[つと]めをよく知[し]っているのですから。」"
  27: "ラバンは彼[かれ]に言[い]った。「もし、わたしがあなたの目[め]にかなったのなら。わたしは占[うらな]ってみたのだが、神[かみ]はあなたが来[き]たことでわたしを祝福[しゅくふく]してくださった。"
  28: "あなたの報酬[ほうしゅう]をわたしに対して定[さだ]めなさい。そうすれば与[あた]えよう。」"
  29: "ヤコブは言[い]った。「あなたは、わたしがあなたに仕[つか]えたこと、あなたの家畜[かちく]がわたしのもとでどうであったかを知[し]っています。"
  30: "あなたのものは、わたしのもとではわずかであったのに、多[おお]くの群[む]れに増[ふ]えました。主[しゅ]は、わたしが足[あし]を踏[ふ]み入[い]れてから、あなたを祝福[しゅくふく]されました。それなのに、いつ、わたしは自分[じぶん]の家[いえ]のために働[はたら]くのでしょうか。」"
  31: "ラバンは言[い]った。「何[なに]をあなたに与[あた]えようか。」ヤコブは言[い]った。「何[なに]も与[あた]えなくてよい。ただ、このことをわたしにしてくだされば、わたしはまたあなたの羊[ひつじ]を牧[まき]し、見張[みは]ります。"
  32: "今日[きょう]、あなたの羊[ひつじ]の群[む]れをすべて通[とお]らせ、そこから、子羊[こひつじ]の中のすべての灰色[はいいろ]のもの、山羊[やぎ]の中のすべての白[しろ]みのあるものと斑点[はんてん]のあるものを分[わ]けてください。それがわたしの報酬[ほうしゅう]となります。"
  33: "明日[あす]、わたしの正[ただ]しさがわたしのために答[こた]える。あなたがわたしの報酬[ほうしゅう]を目[め]の前[まえ]に確[たし]かめるとき、山羊[やぎ]の中に斑点[はんてん]や白[しろ]みのないもの、子羊[こひつじ]の中に灰色[はいいろ]のものがあれば、それはわたしが盗[ぬす]んだものとなる。」"
  34: "ラバンは言[い]った。「あなたの言葉[ことば]のとおりにしよう。」"
  35: "その日[ひ]、ラバンは、斑点[はんてん]のある雄山羊[おやぎ]と白[しろ]みのあるもの、斑点[はんてん]のある雌山羊[めやぎ]と白[しろ]みのあるもの、すなわちそれらの中のすべての白[しろ]いもの、また子羊[こひつじ]の中のすべての灰色[はいいろ]のものを分[わ]け、自分[じぶん]の子[こ]らに手渡[てわた]した。"
  36: "そして、自分[じぶん]とヤコブの間[あいだ]に三[みっ]か日[か]の道[みち]の隔[へだ]たりを置[お]いた。ヤコブは、残[のこ]されたラバンの羊[ひつじ]を牧[まき]していた。"
  37: "ヤコブは、緑[みどり]のポプラとくるみとプラタナスの枝[えだ]を取[と]り、その皮[かわ]をはいで緑[みどり]の部分[ぶぶん]を削[けず]り取[と]り、白[しろ]い筋[すじ]を現[あらわ]れさせた。こうして、皮[かわ]をはいだ白[しろ]い所[ところ]が、枝[えだ]にぶちになって見[み]えた。"
  38: "そして、皮[かわ]をはいだ枝[えだ]を、水[みず]を飲[の]ませる槽[ふね]の中[なか]に置[お]いた。羊[ひつじ]が水[みず]を飲[の]みに来[く]るとき、その枝[えだ]の前[まえ]で、"
  39: "羊[ひつじ]が枝[えだ]に向[む]かって身[み]ごもると、羊[ひつじ]は白[しろ]みのあるもの、ぶちのもの、灰[はい]色[いろ]の斑点[はんてん]のあるものを産[う]んだ。"
  40: "ヤコブは子羊[こひつじ]を分[わ]け、羊[ひつじ]の前[まえ]に、白[しろ]みのある雄羊[おひつじ]と、子羊[こひつじ]の中のすべてのぶちのものを置[お]いた。こうして彼[かれ]は自分[じぶん]の群[む]れを別[べつ]にして、ラバンの羊[ひつじ]に混[ま]ぜなかった。"
  41: "そして、羊[ひつじ]が身[み]ごもって胎[たい]に宿[やど]す時[とき]になると、ヤコブは枝[えだ]を羊[ひつじ]の前[まえ]の槽[ふね]の中[なか]に置[お]いた。枝[えだ]に向[む]かって身[み]ごもらせるためであった。"
  42: "しかし、羊[ひつじ]が産[う]むときには、彼[かれ]は置[お]かなかった。こうして、しるしのないものはラバンのものとなり、しるしのあるものはヤコブのものとなった。"
  43: "こうして、この人[ひと]はきわめて、きわめて豊[ゆた]かになり、多[おお]くの家畜[かちく]、牛[うし]、男[おとこ]奴隷[どれい]、女[おんな]奴隷[どれい]、らくだ、ろばを手[て]に入[い]れた。"

notes:
  1: "Ἰδοῦσα — 見て (ἰδοῦσα — причастие от ὁράω). ἐζήλωσεν — ねたんだ (ζηλόω). Δός μοι τέκνα — わたしに子を与えなさい (τέκνον — «ребёнок»). εἰ δὲ μή, τελευτήσω ἐγώ — そうでなければ、わたしは死ぬ (τελευτάω — «умереть»; ἐγώ подчёркнуто)."
  2: "Μὴ ἀντὶ θεοῦ ἐγώ εἰμι — わたしが神の代わりなのか (риторический вопрос с μή, ожидает «нет»). ὃς ἐστέρησέν σε καρπὸν κοιλίας — あなたから胎の実を奪った (στερέω — «лишать»; καρπὸς κοιλίας — «плод чрева»)."
  3: "τέξεται ἐπὶ τῶν γονάτων μου — わたしの膝の上で産む (обряд: дитя кладут на колени госпожи, ср. 50:23). τεκνοποιήσομαι κἀγώ — わたしもまた子を得る (τεκνοποιέομαι — «рождать детей»)."
  4: "ἔδωκεν αὐτῷ…γυναῖκα — 妻として与えた (та же формула, что 30:9). εἰσῆλθεν πρὸς αὐτήν — 彼女のところへ入った (эвфемизм)."
  5: "συνέλαβεν…ἔτεκεν — 身ごもって…産んだ (συλλαμβάνω, τίκτω)."
  6: "Ἔκρινέν μοι ὁ θεός — 神はわたしのために裁いた (κρίνω — «судить, рассудить»; евр. דָּן — «судил», отсюда имя). ἐπήκουσεν τῆς φωνῆς μου — わたしの声を聞いた. Δαν — ダン."
  7: "υἱὸν δεύτερον — 二人目の男の子 (δεύτερον — «второй»)."
  8: "Συνελάβετό μοι ὁ θεός — 神はわたしと取り組んだ (συλλαμβάνομαι в среднем залоге — «схватиться, бороться», ср. 32:25). συνανεστράφην τῇ ἀδελφῇ μου καὶ ἠδυνάσθην — 姉と争って勝った (ἀναστρέφομαι — «состязаться»; δύναμαι — «одолеть»). Νεφθαλι — ナフタリ (евр. «боролся»)."
  9: "ἔστη τοῦ τίκτειν — 産むことをやめた (ἵστημι — «остановиться»; ср. 29:35). В слав. в конце стиха повторено «и вниде к ней» (в греч. это начало 10-го), в перевод не перенесено."
  10: "εἰσῆλθεν δὲ πρὸς αὐτὴν Ιακωβ — ヤコブは彼女のところへ入り (в слав. это стоит в конце 9-го, в греч. — здесь)."
  11: "Ἐν τύχῃ — 幸運が訪れた (ἐν τύχῃ — «в удаче»; слав. «благо мне случися»; евр. גָּד — «удача, счастье»). ἐπωνόμασεν — 名づけた (ἐπονομάζω, синоним ἐκάλεσεν)."
  12: "υἱὸν δεύτερον — 二人目 (в LXX без имени матери-госпожи, как в 30:7)."
  13: "Μακαρία ἐγώ — わたしは幸せである (μακάριος — «блаженный»). μακαρίζουσίν με αἱ γυναῖκες — 女たちがわたしを幸せな者と呼ぶ (μακαρίζω — «ублажать»). Ασηρ — アシェル (евр. «счастливый»)."
  14: "ἐν ἡμέραις θερισμοῦ πυρῶν — 麦の刈り入れのころ (θερισμός — «жатва»; πυρός — «пшеница»). μῆλα μανδραγόρου — マンドラゴラの実 (μανδραγόρας; евр. דּוּדָאִים — «мандрагоры», которым приписывали силу зачатия)."
  15: "Οὐχ ἱκανόν σοι — 足りないのか (ἱκανός — «достаточный»). μὴ καὶ…λήμψῃ — まで取ろうというのか (вопрос с μή, ожидает «нет»). Οὐχ οὕτως — そうではない. κοιμηθήτω μετὰ σοῦ τὴν νύκτα ταύτην — 今夜、彼はあなたとともに寝るがよい (императив 3 л.; подлежащее не названо, в японском пришлось поставить 彼)."
  16: "ἐξ ἀγροῦ ἑσπέρας — 夕べ、野から (ἑσπέρας — родительный времени). μεμίσθωμαι γάρ σε — わたしはあなたを雇った (μισθόω — «нанимать»; perfect). ἀντὶ τῶν μανδραγορῶν — マンドラゴラの代わりに."
  17: "ἐπήκουσεν ὁ θεὸς Λειας — 神はレアの願いを聞き入れ (ἐπακούω с родительным — «услышать кого»). υἱὸν πέμπτον — 五番目の子 (порядковое — счёт сыновей Лии)."
  18: "τὸν μισθόν μου ἀνθ᾿ οὗ ἔδωκα — 女奴隷を与えたその報い (ἀνθ᾿ οὗ — «за то, что»; μισθός — «плата, награда»). Ισσαχαρ, ὅ ἐστιν Μισθός — イッサカル、すなわち「報い」 (LXX сам добавляет перевод имени)."
  19: "υἱὸν ἕκτον — 六番目の子 (в LXX без речения матери)."
  20: "Δεδώρηταί μοι ὁ θεὸς δῶρον καλόν — 神は良い贈り物を贈ってくださった (δωρέομαι и δῶρον — тавтология, сохранена). αἱρετιεῖ με ὁ ἀνήρ μου — 夫はわたしを選ぶ (αἱρετίζω — «избирать, предпочитать»; слав. «возлюбит»). Ζαβουλων — ゼブルン."
  21: "θυγατέρα — дочь. Δινα — ディナ (единственная дочь Иакова в этой главе)."
  22: "Ἐμνήσθη…ὁ θεὸς τῆς Ραχηλ — 神はラケルを心に留め (μιμνήσκομαι — «вспомнить, помянуть»). ἀνέῳξεν αὐτῆς τὴν μήτραν — 彼女の胎を開かれた (ср. 29:31)."
  23: "Ἀφεῖλεν ὁ θεός μου τὸ ὄνειδος — 神はわたしの恥を取り去られた (ὄνειδος — «позор, поношение»: бесплодие считалось позором, ср. 30:1)."
  24: "Ιωσηφ — ヨセフ (евр. «да прибавит»). Προσθέτω ὁ θεός μοι υἱὸν ἕτερον — 神がもう一人加えてくださるように (προστίθημι — «прибавлять»; оптатив 3 л.)."
  25: "Ἀπόστειλόν με — わたしを送り出してください (ἀποστέλλω). εἰς τὸν τόπον μου καὶ εἰς τὴν γῆν μου — わたしの場所、わたしの地へ."
  26: "ἀπόδος τὰς γυναῖκάς μου καὶ τὰ παιδία — 妻たちと子どもたちを渡してください (ἀποδίδωμι — «отдать»). περὶ ὧν δεδούλευκά σοι — あなたに仕えてきた、その者たち (περί — «за»; perfect)."
  27: "Εἰ εὗρον χάριν ἐναντίον σου — もしあなたの目にかなったのなら (фраза оборвана, как в греч.; слав. «аще обретох благодать»). οἰωνισάμην ἄν — わたしは占ってみた (οἰωνίζομαι — «гадать по птицам»; Лаван говорит как язычник; слав. «усмотрих»). τῇ σῇ εἰσόδῳ — あなたが来たことで (εἴσοδος — «вход, приход»)."
  28: "διάστειλον τὸν μισθόν σου πρός με — あなたの報酬をわたしに対して定めなさい (διαστέλλω — «назначить, отделить»)."
  29: "ἃ δεδούλευκά σοι — 仕えたこと. ὅσα ἦν κτήνη σου μετ᾿ ἐμοῦ — あなたの家畜がわたしのもとでどうであったか (ὅσα — «сколь много»)."
  30: "μικρὰ ἦν… ἐναντίον ἐμοῦ — わたしのもとではわずかであった. ηὐξήθη εἰς πλῆθος — 多くの群れに増えた (πλῆθος — «множество»). ἐπὶ τῷ ποδί μου — わたしが足を踏み入れてから (букв. «при ноге моей»; слав. «пришествием моим»). πότε ποιήσω κἀγὼ ἐμαυτῷ οἶκον — いつ、わたしは自分の家のために働くのか."
  31: "Οὐ δώσεις μοι οὐθέν — 何も与えなくてよい. ἐὰν ποιήσῃς μοι τὸ ῥῆμα τοῦτο — このことをしてくださるなら (ῥῆμα — «слово, дело»). ποιμανῶ…καὶ φυλάξω — 牧し、見張る (ποιμαίνω, φυλάσσω)."
  32: "παρελθάτω πάντα τὰ πρόβατά σου σήμερον — 今日、あなたの羊の群れをすべて通らせ (императив 3 л.; в масоретском тексте «я пройду», отсюда разница с Синодальным). φαιὸν ἐν τοῖς ἀρνάσιν — 子羊の中の灰色のもの (φαιός — «тёмно-серый, бурый»; слав. «пелесый»; Синодальный «чёрную»). διάλευκον — 白みのあるもの (διάλευκος — «беловатый, с белым»). ῥαντὸν ἐν ταῖς αἰξίν — 山羊の中の斑点のあるもの (ῥαντός — «крапчатый»; слав. «пестрый»)."
  33: "ἐπακούσεταί μοι ἡ δικαιοσύνη μου — わたしの正しさがわたしのために答える (ἐπακούω — «услышать, ответить»; слав. «послушает мене правда моя»). ἐν τῇ ἡμέρᾳ τῇ αὔριον — 明日. κεκλεμμένον ἔσται παρ᾿ ἐμοί — わたしが盗んだものとなる (κλέπτω — perfect)."
  34: "Ἔστω κατὰ τὸ ῥῆμά σου — あなたの言葉のとおりにしよう (императив 3 л.)."
  35: "διέστειλεν — 分けた (διαστέλλω). τοὺς τράγους τοὺς ῥαντοὺς καὶ τοὺς διαλεύκους — 斑点のある雄山羊と白みのあるもの (τράγος — «козёл»). πᾶν ὃ ἦν λευκόν — すべて白いもの. ἔδωκεν διὰ χειρὸς τῶν υἱῶν αὐτοῦ — 自分の子らに手渡した (букв. «дал через руку»)."
  36: "ἀπέστησεν ὁδὸν τριῶν ἡμερῶν — 三日の道の隔たりを置いた (ἀφίστημι — «отставить»; ὁδὸς τριῶν ἡμερῶν — «путь трёх дней»). τὰ ὑπολειφθέντα — 残されたもの (ὑπολείπω)."
  37: "ῥάβδον στυρακίνην χλωρὰν καὶ καρυίνην καὶ πλατάνου — 緑のポプラ、くるみ、プラタナスの枝 (στυρακίνη — «стираксовое дерево»; евр. לִבְנֶה — «белый тополь», отсюда ポプラ; καρυίνη — «ореховое»; πλάτανος — «платан»). ἐλέπισεν…λεπίσματα λευκὰ περισύρων τὸ χλωρόν — 皮をはいで緑の部分を削り取り、白い筋を現れさせた (λεπίζω — «снимать кору»). ποικίλον — ぶち (ποικίλος — «пёстрый»)."
  38: "ἐν ταῖς ληνοῖς τῶν ποτιστηρίων τοῦ ὕδατος — 水を飲ませる槽の中 (ληνός — «корыто, чан»; ποτιστήριον — «водопой»). ἵνα…ἐλθόντων αὐτῶν εἰς τὸ πιεῖν — 羊が水を飲みに来るとき、枝の前で (обрыв фразы в греч., продолжение — ст. 39; сохранено)."
  39: "ἐγκισσήσωσιν τὰ πρόβατα εἰς τὰς ῥάβδους — 羊が枝に向かって身ごもると (ἐγκισσάω — «приходить в течку, зачинать»; слав. «зачнут по жезлом»). διάλευκα καὶ ποικίλα καὶ σποδοειδῆ ῥαντά — 白みのあるもの、ぶちのもの、灰色の斑点のあるもの (σποδοειδής — «пепеловидный»)."
  40: "τοὺς ἀμνοὺς διέστειλεν — 子羊を分けた (ἀμνός — «ягнёнок»). ἔστησεν ἐναντίον τῶν προβάτων κριὸν διάλευκον — 羊の前に白みのある雄羊を置いた (κριός — «баран»). οὐκ ἔμιξεν — 混ぜなかった (μίγνυμι)."
  41: "ἐν τῷ καιρῷ ᾧ ἐνεκίσσησεν — 身ごもる時になると. ἐν γαστρὶ λαμβάνοντα — 胎に宿して (букв. «принимая во чрево»). τοῦ ἐγκισσῆσαι αὐτὰ κατὰ τὰς ῥάβδους — 枝に向かって身ごもらせるため (инфинитив цели с τοῦ)."
  42: "ἡνίκα ἂν ἔτεκον — 産むときには (ἡνίκα ἄν + оптатив — «когда бы ни»). οὐκ ἐτίθει — 置かなかった. τὰ ἄσημα τοῦ Λαβαν, τὰ δὲ ἐπίσημα τοῦ Ιακωβ — しるしのないものはラバンのもの、しるしのあるものはヤコブのもの (ἄσημος/ἐπίσημος — «неотмеченный/отмеченный»; в масоретском тексте речь о слабом и крепком скоте, отсюда разница с Синодальным)."
  43: "ἐπλούτησεν σφόδρα σφόδρα — きわめて、きわめて豊かになった (удвоение наречия сохранено; слав. «зело зело»). παῖδες καὶ παιδίσκαι — 男奴隷と女奴隷. κάμηλοι καὶ ὄνοι — らくだとろば."
