# jp-box, Бытие, глава 30. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru),
# русский Синодальный (ru) и, где есть, jp-joc (1901, public domain).
# Язык — современный 常体, без 文語; порядок членов и деление на клаузы — по греческому.
# Глава 30: спор Рахили и Лии о детях (1–8), Зелфа и её сыновья (9–13), мандрагоры (14–16),
# ещё сыновья Лии и рождение Иосифа (17–24), Иаков просит отпустить его (25–26),
# договор о пёстром скоте (27–34), отделение скота (35–36), прутья у водопоя (37–43).
# Красного и синего нет: речи людей — в 「…」, без красного.
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено по базе).
# Пёстрый скот передан конкретно (см. notes к 32, 35, 37): φαιός — 灰色, ῥαντός — 斑点,
# διάλευκος — 白みのある, ποικίλος — ぶち, σποδοειδής — 灰色の斑点.
# 30:38 по греч. обрывается на полуслове (продолжение — 30:39); деление стихов сохранено,
# поэтому 38-й кончается запятой, а 39-й продолжает фразу.
# Имена: ラケル, レア, ビルハ, ジルパ, ダン, ナフタリ, ガド, アシェル, イッサカル, ゼブルン,
# ディナ, ヨセフ, ヤコブ, ラバン; マンドラゴラ — растение (без пояснения).
# Сносок ⟨…⟩ нет: マンドラゴラ, 天幕, 報酬 — понятные слова. jp-ni не использовался.

