# jp-box, Псалтирь, псалом 67. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0.
# Псалом 67: восстание Бога и бегство врагов (1–3), шествие Бога из Синая (4–8),
# дождь наследию и слово благовестников (9–12), голубица и Селмон (13–14),
# гора Божия и колесницы (15–18), восшествие на высоту (18–20),
# сокрушение врагов и слова Господа о Васане (21–23), шествие в святилище (24–28),
# цари и дары, Египет и Ефиопия (29–32), пойте Богу небес (32–35).
# Красного и синего нет: слова Господа в ст. 22 — прямая речь, но это псалом,
# а не евангельская речь Христа (ср. решение по Пс 2), поэтому <j> не ставится.
# Кавычки: слова Господа в ст. 22 — 「…」 (речь псалмопевца в кавычки не берётся,
# поэтому это первый уровень; ст. 23 — уже обращение к Богу, вне кавычек).
# 〔…〕 нет: все слова в gr-lxx-byz есть. Порядок и повтор стиха 22 (ἐπιστρέψω дважды)
# сохранены; ст. 12 и 18 в греч. тёмные — переданы буквально, без догадок.
# セラ (διάψαλμα, в конце ст. 7, 13, 19 и 32) не передаётся — по решению пользователя.
# Сносок ⟨…⟩ нет: 車, 聖所, 嗣業, 荒野, 犬 уже в корпусе или понятны. jp-ni не использовался.

