verses:
  0: "指揮者[しきしゃ]に。ダビデの詩[うた]、歌[うた]。"
  1: "神[かみ]が立[た]ち上[あ]がられますように。その敵[てき]は散[ち]り、神[かみ]を憎[にく]む者[もの]はその顔[かお]から逃[に]げますように。"
  2: "煙[けむり]が消[き]えるように、彼[かれ]らは消[き]えよ。火[ひ]の前[まえ]で蝋[ろう]が溶[と]けるように、罪[つみ]人[びと]は神[かみ]の顔[かお]の前[まえ]で滅[ほろ]びよ。"
  3: "正[ただ]しい者[もの]は喜[よろこ]び、神[かみ]の前[まえ]で楽[たの]しむように。喜[よろこ]びに浸[ひた]るように。"
  4: "神[かみ]に歌[うた]え、その名[な]に歌[うた]え。西[にし]の上[うえ]に上[のぼ]られた方[かた]のために道[みち]を備[そな]えよ。その名[な]は主[しゅ]である。その前[まえ]で楽[たの]しめ。その顔[かお]の前[まえ]で彼[かれ]らは恐[おそ]れおののく。"
  5: "孤[みなし]児[ご]の父[ちち]、やもめの裁[さば]き手[て]である神[かみ]は、その聖[せい]なる所[ところ]におられる。"
  6: "神[かみ]は孤[こ]独[どく]な者[もの]を家[いえ]に住[す]まわせ、鎖[くさり]につながれた者[もの]を力[ちから]をもって連[つ]れ出[だ]される。同[おな]じように、逆[さか]らう者[もの]は墓[はか]に住[す]まわされる。"
  7: "神[かみ]よ、あなたがあなたの民[たみ]に先立[さきだ]って出[で]て行[ゆ]かれるとき、荒[あ]れ野[の]を行[ゆ]かれるとき。"
  8: "地[ち]は震[ふる]え、天[てん]も滴[したた]った。これはシナイの神[かみ]、イスラエルの神[かみ]の顔[かお]の前[まえ]でのことである。"
  9: "神[かみ]よ、あなたは自[みずか]ら進[すす]んで、あなたの嗣[し]業[ぎょう]に雨[あめ]を降[ふ]らせ、それが弱[よわ]ったとき、これを建[た]て直[なお]された。"
  10: "あなたの群[む]れはそこに住[す]む。神[かみ]よ、あなたはその恵[めぐ]みによって、貧[まず]しい者[もの]のために備[そな]えをされた。"
  11: "主[しゅ]は、力[ちから]強[づよ]く福音[ふくいん]を告[つ]げ知[し]らせる者[もの]たちに、みことばを与[あた]えられる。"
  12: "愛[あい]する方[かた]の軍[いくさ]の王[おう]は、家[いえ]の美[うつく]しさによって獲[え]物[もの]を分[わ]ける。"
  13: "あなたがたが嗣[し]業[ぎょう]の間[あいだ]で眠[ねむ]るとき、鳩[はと]の翼[つばさ]は銀[ぎん]で覆[おお]われ、その羽[はね]は緑[みどり]がかった金[きん]の輝[かがや]きのようである。"
  14: "天[てん]の王[おう]がそこに王[おう]たちを分[わ]けられるとき、彼[かれ]らはセルモンで雪[ゆき]のように白[しろ]くなる。"
  15: "神[かみ]の山[やま]は肥[こ]えた山[やま]、凝[こ]り固[かた]まった山[やま]、肥[こ]えた山[やま]である。"
  16: "凝[こ]り固[かた]まった山[やま]々[やま]よ、なぜ、あなたがたは、神[かみ]が住[す]むことを喜[よろこ]ばれた山[やま]を、ねたみの目[め]で見[み]るのか。主[しゅ]はそこに永遠[えいえん]に住[す]まわれる。"
  17: "神[かみ]の車[くるま]は幾万[いくまん]も重[かさ]なり、千[せん]の豊[ゆた]かなる者[もの]の群[む]れである。主[しゅ]はその中[なか]に、シナイの聖所[せいしょ]におられる。"
  18: "あなたは高[たか]みに上[のぼ]り、捕[とり]らわれた者[もの]を捕[とり]らえ、人[ひと]の中[なか]から贈[おく]り物[もの]を受[う]けられた。逆[さか]らう者[もの]さえも、あなたとともに住[す]むために。主[しゅ]なる神[かみ]はほむべきかな。"
  19: "日[ひ]ごとに主[しゅ]はほむべきかな。わたしたちの救[すく]いの神[かみ]は、わたしたちの歩[あゆ]みを進[すす]めさせてくださる。"
  20: "わたしたちの神[かみ]は救[すく]う神[かみ]である。主[しゅ]なる神[かみ]に、死[し]から出[で]る道[みち]はある。"
  21: "しかし、神[かみ]はその敵[てき]の頭[あたま]を砕[くだ]き、自[みずか]らの罪[つみ]の中[なか]を歩[あゆ]む者[もの]の髪[かみ]の頂[いただき]を砕[くだ]かれる。"
  22: "主[しゅ]は言[い]われた。「わたしはバシャンから連[つ]れ戻[もど]す。海[うみ]の深[ふか]みからも連[つ]れ戻[もど]す。」"
  23: "それは、あなたの足[あし]が血[ち]に浸[ひた]り、あなたの犬[いぬ]の舌[した]が敵[てき]の血[ち]をなめるためである。"
  24: "神[かみ]よ、あなたの行[ゆ]く道[みち]、すなわち聖[せい]なる所[ところ]におられるわたしの神[かみ]、王[おう]の行[ゆ]く道[みち]が見[み]られた。"
  25: "君[くん]たちは先[さき]に立[た]ち、歌[うた]う者[もの]たちがそれに続[つづ]き、若[わか]い女[おんな]たちが太鼓[たいこ]を鳴[な]らしてその間[あいだ]にいる。"
  26: "イスラエルの泉[いずみ]から出[で]る主[しゅ]を、集会[しゅうかい]のうちでほめたたえよ。"
  27: "そこには、若[わか]いベニヤミンが夢中[むちゅう]になっており、ユダの君[くん]たちとその支[し]配[はい]者[しゃ]たち、ゼブルンの君[くん]たち、ナフタリの君[くん]たちがいる。"
  28: "神[かみ]よ、あなたの力[ちから]に命[めい]じてください。神[かみ]よ、あなたがわたしたちのために成[な]し遂[と]げたことを強[つよ]めてください。"
  29: "エルサレムにあるあなたの神殿[しんでん]から、王[おう]たちはあなたに贈[おく]り物[もの]を運[はこ]ぶ。"
  30: "葦[あし]の中[なか]の野[や]獣[じゅう]を、もろもろの民[たみ]の間[あいだ]の牛[うし]の群[む]れを、銀[ぎん]でためされた者[もの]たちを閉[と]じ込[こ]めようとする者[もの]たちを、叱[しか]ってください。戦[いくさ]を好[この]む民[たみ]を散[ち]らしてください。"
  31: "エジプトから使[し]者[しゃ]たちが来[き]る。エチオピアは先[さき]に神[かみ]へ手[て]を差[さ]し伸[の]べる。"
  32: "地[ち]の諸[しょ]国[こく]よ、神[かみ]に歌[うた]え。主[しゅ]に歌[うた]え。"
  33: "天[てん]の天[てん]の上[うえ]、東[ひがし]の方[ほう]に上[のぼ]られた神[かみ]に歌[うた]え。見[み]よ、神[かみ]はその声[こえ]に力[ちから]の声[こえ]を与[あた]えられる。"
  34: "神[かみ]に栄光[えいこう]を帰[き]せよ。その威[い]厳[げん]はイスラエルの上[うえ]にあり、その力[ちから]は雲[くも]のうちにある。"
  35: "神[かみ]はその聖[せい]なる者[もの]たちのうちで驚[おどろ]くべき方[かた]である。イスラエルの神[かみ]は、ご自身の民[たみ]に力[ちから]と強[つよ]さを与[あた]えられる。神[かみ]はほむべきかな。"

notes:
  0: "Εἰς τὸ τέλος· τῷ Δαυιδ ψαλμὸς ᾠδῆς — «в конец, Давиду, псалом песни»; 指揮者に。ダビデの詩、歌。 Надписание — стих 0; скобками не маркируется."
  1: "Ἀναστήτω ὁ θεός — 神が立ち上がられますように (ἀνίστημι — «вставать»; ср. Числ 10:35; слав. «Да воскреснет Бог» — пасхальное чтение; 立ち上がる передаёт движение, а не догматический термин). διασκορπισθήτωσαν οἱ ἐχθροὶ αὐτοῦ — その敵は散り (διασκορπίζω — «рассеивать»). φυγέτωσαν οἱ μισοῦντες αὐτὸν ἀπὸ προσώπου αὐτοῦ — 神を憎む者はその顔から逃げますように (φεύγω — «бежать»; πρόσωπον — «лицо»)."
  2: "ὡς ἐκλείπει καπνός, ἐκλιπέτωσαν — 煙が消えるように、彼らは消えよ (ἐκλείπω — «исчезать»; слав. «яко исчезает дым, да исчезнут»). ὡς τήκεται κηρὸς ἀπὸ προσώπου πυρός — 火の前で蝋が溶けるように (τήκω — «плавить»; κηρός — «воск»). ἀπόλοιντο οἱ ἁμαρτωλοί — 罪人は滅びよ (ἀπόλλυμι — «губить»; оптатив)."
  3: "οἱ δίκαιοι εὐφρανθήτωσαν — 正しい者は喜び. ἀγαλλιάσθωσαν ἐνώπιον τοῦ θεοῦ — 神の前で楽しむように (ἀγαλλιάομαι — «ликовать»). τερφθήτωσαν ἐν εὐφροσύνῃ — 喜びに浸るように (τέρπω — «услаждать»; εὐφροσύνη — «веселие»; слав. «да насладятся в веселии»)."
  4: "ᾄσατε τῷ θεῷ, ψάλατε τῷ ὀνόματι αὐτοῦ — 神に歌え、その名に歌え. ὁδοποιήσατε τῷ ἐπιβεβηκότι ἐπὶ δυσμῶν — 西の上に上られた方のために道を備えよ (ὁδοποιέω — «прокладывать путь»; δυσμαί — «закат, запад»; слав. «путесотворите возшедшему на запады»). κύριος ὄνομα αὐτῷ — その名は主である. ταραχθήσονται ἀπὸ προσώπου αὐτοῦ — その顔の前で彼らは恐れおののく (ταράσσω — «смущать»; в базе стоит в конце ст. 4, по-японски — отдельным предложением, как и в слав.)."
  5: "τοῦ πατρὸς τῶν ὀρφανῶν καὶ κριτοῦ τῶν χηρῶν — 孤児の父、やもめの裁き手 (ὀρφανός — 孤児; χήρα — やもめ; κριτής — 裁き手, от 裁き как по корпусу). ὁ θεὸς ἐν τόπῳ ἁγίῳ αὐτοῦ — 神はその聖なる所におられる (τόπος ἅγιος — «место святое»)."
  6: "κατοικίζει μονοτρόπους ἐν οἴκῳ — 孤独な者を家に住まわせ (μονότροπος — «живущий особняком, одинокий»; слав. «единомысленныя»). ἐξάγων πεπεδημένους ἐν ἀνδρείᾳ — 鎖につながれた者を力をもって連れ出される (πεδέω — «оковывать»; ἀνδρεία — «мужество, сила»). ὁμοίως τοὺς παραπικραίνοντας… ἐν τάφοις — 同じように、逆らう者は墓に住まわされる (παραπικραίνω — «противиться»; слав. «такожде преогорчевающыя живущыя во гробех»; в ru-базе по евр. «остаются в знойной пустыне» — здесь греч.)."
  7: "ἐν τῷ ἐκπορεύεσθαί σε ἐνώπιον τοῦ λαοῦ σου — あなたが民に先立って出て行かれるとき (ἐκπορεύομαι — «выходить»; ἐνωπίον — «пред лицом»). ἐν τῷ διαβαίνειν σε ἐν τῇ ἐρήμῳ — 荒れ野を行かれるとき (διαβαίνω — «переходить»). διάψαλμα в конце стиха не передаётся."
  8: "γῆ ἐσείσθη — 地は震え (σείω — «трясти»). οἱ οὐρανοὶ ἔσταξαν — 天も滴った (στάζω — «капать»; слав. «небеса кануша»). ἀπὸ προσώπου τοῦ θεοῦ τοῦτο Σινα — これはシナイの神の顔の前でのこと (τοῦτο Σινα — «это — Синай»; слав. «от лица Бога Синаина», т. е. Синайского). ἀπὸ προσώπου τοῦ θεοῦ Ισραηλ — イスラエルの神の顔の前で."
  9: "βροχὴν ἑκούσιον ἀφοριεῖς — 進んで雨を降らせ (ἑκούσιος — «добровольный»; ἀφορίζω — «назначать, отделять»; слав. «дождь волен отлучиши»). τῇ κληρονομίᾳ σου — あなたの嗣業に (κληρονομία — 嗣業, как по корпусу). ἠσθένησεν, σὺ δὲ κατηρτίσω αὐτήν — それが弱ったとき、これを建て直された (ἀσθενέω — «изнемогать»; καταρτίζω — «устроять, восстанавливать»; слав. «Ты же совершил еси е»)."
  10: "τὰ ζῷά σου κατοικοῦσιν ἐν αὐτῇ — あなたの群れはそこに住む (τὰ ζῷα — «животные», т. е. народ Божий как стадо; слав. «животная Твоя»; 群れ — по смыслу церковного текста, не «звери»). ἡτοίμασας ἐν τῇ χρηστότητί σου τῷ πτωχῷ — あなたはその恵みによって貧しい者のために備えをされた (χρηστότης — «благость»; πτωχός — 貧しい者)."
  11: "κύριος δώσει ῥῆμα — 主はみことばを与えられる (ῥῆμα — «слово, изречение»; слав. «Господь даст глагол»). τοῖς εὐαγγελιζομένοις δυνάμει πολλῇ — 力強く福音を告げ知らせる者たちに (εὐαγγελίζομαι — «благовествовать»; δυνάμει πολλῇ — «силою многою»)."
  12: "ὁ βασιλεὺς τῶν δυνάμεων τοῦ ἀγαπητοῦ — 愛する方の軍の王 (букв. «царь сил Возлюбленного»; слав. «Царь сил возлюбленнаго»). ὡραιότητι τοῦ οἴκου διελέσθαι σκῦλα — 家の美しさによって獲物を分ける (ὡραιότης — «красота»; διαιρέω — «делить»; σκῦλα — «добыча»). Место тёмное, в греч. испорчено; передано буквально, без догадок (в ru-базе по евр. иначе — «цари воинств бегут»)."
  13: "ἐὰν κοιμηθῆτε ἀνὰ μέσον τῶν κλήρων — 嗣業の間で眠るとき (κλῆρος — «жребий, удел»; слав. «посреде пределов»). πτέρυγες περιστερᾶς περιηργυρωμέναι — 鳩の翼は銀で覆われ (περιστερά — 鳩; περιαργυρόω — «оковывать серебром»). τὰ μετάφρενα αὐτῆς ἐν χλωρότητι χρυσίου — その羽は緑がかった金の輝きのよう (μετάφρενον — «спина, хребет»; χλωρότης — «зеленоватость», о цвете золота; слав. «междорамия ея в блещании злата»)."
  14: "ἐν τῷ διαστέλλειν τὸν ἐπουράνιον βασιλεῖς ἐπ᾽ αὐτῆς — 天の王がそこに王たちを分けられるとき (ἐπουράνιος — «небесный»; διαστέλλω — «разделять»; слав. «внегда разнствует небесный цари на ней»). χιονωθήσονται ἐν Σελμων — 彼らはセルモンで雪のように白くなる (χιονόομαι — «становиться как снег»; Σελμων — セルモン, ср. Суд 9:48)."
  15: "ὄρος τοῦ θεοῦ ὄρος πῖον — 神の山は肥えた山 (πῖων — «тучный»). ὄρος τετυρωμένον — 凝り固まった山 (τυρόω — «сгущать, как сыр»; слав. «гора усыренная»). Троекратный повтор с вариантом сохранён. В слав. и ru-базе здесь «Васанская» (по евр.); в греч. имени нет, поэтому バシャン в ст. 15 не добавлено."
  16: "ἵνα τί ὑπολαμβάνετε, ὄρη τετυρωμένα — なぜ、凝り固まった山々よ、ねたみ見るのか (ὑπολαμβάνω — «подозревать, ревновать»; слав. «вскую непщуете»). τὸ ὄρος, ὃ εὐδόκησεν ὁ θεὸς κατοικεῖν ἐν αὐτῷ — 神が住むことを喜ばれた山を (εὐδοκέω — «благоволить»). ὁ κύριος κατασκηνώσει εἰς τέλος — 主はそこに永遠に住まわれる (κατασκηνόω — «обитать в шатре»; εἰς τέλος — «до конца», т. е. навсегда)."
  17: "τὸ ἅρμα τοῦ θεοῦ μυριοπλάσιον — 神の車は幾万も重なり (ἅρμα — 車[くるま]; μυριοπλάσιος — «десятитысячекратный»; слав. «колесница Божия тмами тем»). χιλιάδες εὐθηνούντων — 千の豊かなる者の群れ (εὐθηνέω — «процветать»; слав. «тысяща гобзующих»). ὁ κύριος ἐν αὐτοῖς ἐν Σινα ἐν τῷ ἁγίῳ — 主はその中に、シナイの聖所におられる."
  18: "ἀνέβης εἰς ὕψος — あなたは高みに上り (ср. Еф 4:8, где стих цитируется). ᾐχμαλώτευσας αἰχμαλωσίαν — 捕らわれた者を捕らえ (внутренний объект, «пленил плен»). ἔλαβες δόματα ἐν ἀνθρώπῳ — 人の中から贈り物を受け (δόμα — «дар»; слав. «приял еси даяния в человецех»). ἀπειθοῦντες τοῦ κατασκηνῶσαι — 逆らう者さえも、ともに住むために (ἀπειθέω — «не покоряться»; фраза тёмная, передана по смыслу церковного текста). κύριος ὁ θεὸς εὐλογητός — 主なる神はほむべきかな."
  19: "εὐλογητὸς κύριος ἡμέραν καθ᾽ ἡμέραν — 日ごとに主はほむべきかな (вин. времени). κατευοδώσει ἡμῖν ὁ θεὸς τῶν σωτηρίων ἡμῶν — わたしたちの救いの神は、わたしたちの歩みを進めさせてくださる (κατευοδόω — «давать успех»; слав. «поспешит нам Бог спасений наших»; в ru-базе и у jp-joc иначе — «возлагает бремя», по евр.). διάψαλμα в конце стиха не передаётся."
  20: "ὁ θεὸς ἡμῶν θεὸς τοῦ σῴζειν — わたしたちの神は救う神 (род. цели при θεός; σῴζω — 救う). τοῦ κυρίου κυρίου αἱ διέξοδοι τοῦ θανάτου — 主なる神に、死から出る道がある (διέξοδος — «выход, исход»; слав. «Господня Господа исходы смертныя»; повтор κύριος передан 主なる神)."
  21: "συνθλάσει κεφαλὰς ἐχθρῶν αὐτοῦ — その敵の頭を砕き (συνθλάω — «сокрушать»). κορυφὴν τριχὸς διαπορευομένων ἐν πλημμελείαις αὐτῶν — 自らの罪の中を歩む者の髪の頂を (κορυφὴ τριχός — «темя волос»; слав. «верх влас»; πλημμέλεια — «прегрешение»)."
  22: "εἶπεν κύριος — 主は言われた; слова Господа — в 「」 (в русской нумерации это ст. 23, здесь — ст. 22 по gr-lxx-byz, нумерация не сдвинута). Ἐκ Βασαν ἐπιστρέψω — わたしはバシャンから連れ戻す (Βασαν — バシャン, Заиорданье). ἐπιστρέψω ἐν βυθοῖς θαλάσσης — 海の深みからも連れ戻す (βυθός — «глубина»); повтор ἐπιστρέψω сохранён."
  23: "ὅπως ἂν βαφῇ ὁ πούς σου ἐν αἵματι — あなたの足が血に浸るため (βάπτω — «погружать, омывать»). ἡ γλῶσσα τῶν κυνῶν σου ἐξ ἐχθρῶν παρ᾽ αὐτοῦ — あなたの犬の舌が、敵から、その血をなめるため (фраза эллиптична: «от него», т. е. от той же крови; слав. «язык псов твоих от враг от него»). Обращение на «Ты» возвращает речь псалмопевцу, поэтому вне 「」."
  24: "ἐθεωρήθησαν αἱ πορεῖαί σου — あなたの行く道が見られた (πορεία — «шествие, путь»; слав. «видешася шествия Твоя»). αἱ πορεῖαι τοῦ θεοῦ μου τοῦ βασιλέως τοῦ ἐν τῷ ἁγίῳ — 聖なる所におられるわたしの神、王の行く道 (приложение сохранено, как в греч.; すなわち вводит второе приложение)."
  25: "προέφθασαν ἄρχοντες — 君たちは先に立った (προφθάνω — «опережать»; ἄρχων — 君). ἐχόμενοι ψαλλόντων — 歌う者たちがそれに続き (ἔχομαι — «держаться, следовать»). ἐν μέσῳ νεανίδων τυμπανιστριῶν — 若い女たちが太鼓を鳴らしてその間にある (τυμπανίστρια — «играющая на тимпане»)."
  26: "ἐν ἐκκλησίαις εὐλογεῖτε τὸν θεόν — 集会のうちで神をほめたたえよ (ἐκκλησία — «собрание»; здесь не 教会, а собрание народа, как в слав. «в церквах»). τὸν κύριον ἐκ πηγῶν Ισραηλ — イスラエルの泉から出る主を (πηγή — «источник»; слав. «Господа от источник Израилевых»; в ru-базе по евр. «от семени Израилева» — здесь греч.)."
  27: "ἐκεῖ Βενιαμιν νεώτερος ἐν ἐκστάσει — そこには、若いベニヤミンが夢中になっており (ἔκστασις — «исступление, восторг»; слав. «юнейший во ужасе»; передано как самозабвение, без «ужаса» славянского текста). ἄρχοντες Ιουδα ἡγεμόνες αὐτῶν — ユダの君たちとその支配者たち (ἡγεμών — «вождь, правитель»). ἄρχοντες Ζαβουλων, ἄρχοντες Νεφθαλι — ゼブルン、ナフタリの君たち."
  28: "ἔντειλαι, ὁ θεός, τῇ δυνάμει σου — 神よ、あなたの力に命じてください (ἐντέλλομαι — «заповедовать»; слав. «заповеждь, Боже, силою Твоею»; в ru-базе по евр. «Бог твой предназначил тебе силу»). δυνάμωσον τοῦτο, ὃ κατειργάσω ἡμῖν — あなたがわたしたちのために成し遂げたことを強めてください (δυναμόω — «укреплять»; κατεργάζομαι — «совершать»)."
  29: "ἀπὸ τοῦ ναοῦ σου ἐπὶ Ιερουσαλημ — エルサレムにあるあなたの神殿から (ναός — 神殿; ἐπί с вин. — «в направлении»). σοὶ οἴσουσιν βασιλεῖς δῶρα — 王たちはあなたに贈り物を運ぶ (φέρω — «нести»; слав. «принесут царие дары»)."
  30: "ἐπιτίμησον τοῖς θηρίοις τοῦ καλάμου — 葦の中の野獣を…叱ってください (одна форма ἐπιτίμησον управляет тремя дополнениями — を…を…を, как в греч.) (θηρίον — «зверь»; κάλαμος — «тростник»; слав. «зверем тростным»). ἡ συναγωγὴ τῶν ταύρων ἐν ταῖς δαμάλεσιν τῶν λαῶν — もろもろの民の間の牛の群れ (ταῦρος — «бык»; δάμαλις — «телица»). τοῦ μὴ ἀποκλεισθῆναι τοὺς δεδοκιμασμένους τῷ ἀργυρίῳ — 銀でためされた者たちを閉じ込めないために (ἀποκλείω — «запирать»). διασκόρπισον ἔθνη τὰ τοὺς πολέμους θέλοντα — 戦を好む民を散らしてください (πόλεμος — 戦[いくさ])."
  31: "ἥξουσιν πρέσβεις ἐξ Αἰγύπτου — エジプトから使者たちが来る (πρέσβυς — «посол, вельможа»; слав. «приидут послы от Египта»). Αἰθιοπία προφθάσει χεῖρα αὐτῆς τῷ θεῷ — エチオピアは先に神へ手を差し伸べる (προφθάνω — «упреждать»; слав. «предварить руку свою к Богу»)."
  32: "αἱ βασιλεῖαι τῆς γῆς — 地の諸国 (βασιλεία — «царство»). ᾄσατε τῷ θεῷ, ψάλατε τῷ κυρίῳ — 神に歌え。主に歌え. διάψαλμα в конце стиха не передаётся."
  33: "τῷ ἐπιβεβηκότι ἐπὶ τὸν οὐρανὸν τοῦ οὐρανοῦ κατὰ ἀνατολάς — 天の天の上、東の方に上られた方に (ἐπιβαίνω — «восходить на»; ἀνατολαί — «восток»; слав. «на небо небесе на востоки»). ἰδοὺ δώσει ἐν τῇ φωνῇ αὐτοῦ φωνὴν δυνάμεως — 見よ、神はその声に力の声を与えられる (повтор φωνή сохранён)."
  34: "δότε δόξαν τῷ θεῷ — 神に栄光を帰せよ. ἐπὶ τὸν Ισραηλ ἡ μεγαλοπρέπεια αὐτοῦ — その威厳はイスラエルの上にあり (μεγαλοπρέπεια — «величие»; слав. «велелепота»). ἡ δύναμις αὐτοῦ ἐν ταῖς νεφέλαις — その力は雲のうちにある."
  35: "θαυμαστὸς ὁ θεὸς ἐν τοῖς ἁγίοις αὐτοῦ — 神はその聖なる者たちのうちで驚くべき方 (ἅγιοι — «святые»; слав. «во святых Своих»). αὐτὸς δώσει δύναμιν καὶ κραταίωσιν τῷ λαῷ αὐτοῦ — ご自身の民に力と強さを与えられる (κραταίωσις — «укрепление, держава»). εὐλογητὸς ὁ θεός — 神はほむべきかな."
