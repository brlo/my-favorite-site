verses:
  1: "闇[やみ]の中[なか]を歩[ある]く民[たみ]は、大[おお]きな光[ひかり]を見[み]た。死[し]の影[かげ]の地[ち]に住[す]む者[もの]たちの上[うえ]に、光[ひかり]が輝[かがや]く。"
  2: "あなたが喜[よろこ]びのうちに導[みちび]き出[だ]した多[おお]くの民[たみ]は、あなたの前[まえ]で喜[よろこ]ぶ。刈[か]り入[れ]のときに喜[よろこ]ぶ者[もの]のように、獲物[えもの]を分[わ]ける者[もの]のように。"
  3: "彼[かれ]らの上[うえ]に置[お]かれた軛[くびき]と、その首[くび]の杖[つえ]は取[と]り去[さ]られた。主[しゅ]は、貢[みつ]ぎを取[と]り立[た]てる者[もの]の杖を、ミディアンの日[ひ]のように砕[くだ]かれたからである。"
  4: "すべて欺[あざむ]きによって集[あつ]められた衣[ころも]と、和解[わかい]のための上着[うわぎ]は、明[あ]け渡[わた]される。人[ひと]々[びと]は、それが火[ひ]で焼[や]かれていたらよいのに、と願[ねが]う。"
  5: "幼子[おさなご]がわたしたちに生[う]まれ、子[こ]がわたしたちに与[あた]えられた。その支配[しはい]はその肩[かた]に置[お]かれた。その名[な]は『大[おお]いなる助言[じょげん]の使者[ししゃ]』と呼ばれる。不思議[ふしぎ]な助言者[じょげんしゃ]、力[ちから]ある神[かみ]、支配者[しはいしゃ]、永遠[えいえん]の父[ちち]、平和[へいわ]の君[きみ]。わたしは平和[へいわ]を指導者[しどうしゃ]たちの上[うえ]にもたらし、彼[かれ]に平和と健康[けんこう]を与[あた]える。"
  6: "その支配[しはい]は大[おお]きく、その平和[へいわ]には限[かぎ]りがない。ダビデの王座[おうざ]とその王国[おうこく]の上[うえ]に、これを据[す]え、これを支[ささ]えて、裁[さば]きと義[ぎ]をもって、今[いま]からとこしえまで固[かた]くする。万軍[ばんぐん]の主[しゅ]の熱心[ねっしん]がこれを成[な]し遂[と]げる。"
  7: "主[しゅ]はヤコブの上[うえ]に死[し]を遣[つか]わし、それはイスラエルの上[うえ]に来[き]た。"
  8: "エフライムの民[たみ]すべてと、サマリアに住[す]む者[もの]たちは知[し]る。彼[かれ]らは高[たか]ぶる心[こころ]と傲慢[ごうまん]さで言[い]う。"
  9: "「れんがは崩[くず]れた。だが、来[こ]い、切[き]り石[いし]を切[き]り出[だ]し、いちじく桑[くわ]と杉[すぎ]を切[き]り倒[たお]して、自分[じぶん]たちのために塔[とう]を建[た]てよう。」"
  10: "しかし神[かみ]は、シオンの山[やま]に立[た]ち向[む]かう者[もの]たちを打[う]ち砕[くだ]き、彼[かれ]らの敵[てき]を散[ち]らされる。"
  11: "東[ひがし]からはシリアを、西[にし]からはギリシア人[じん]を、イスラエルを口[くち]いっぱいに食[く]らい尽[つ]くす者[もの]たちを。それでもなお、主[しゅ]の怒[いか]りは収[おさ]まらず、その手[て]はまだ上[あ]げられたままである。"
  12: "民[たみ]は打[う]たれても立[た]ち返[かえ]らず、主[しゅ]を求[もと]めもしなかった。"
  13: "主[しゅ]はイスラエルから頭[あたま]と尾[しっぽ]を、一日[いちにち]のうちに大[おお]きい者[もの]も小[ちい]さい者[もの]も断[た]ち切[き]られる。"
  14: "すなわち、長老[ちょうろう]と、顔[かお]を重[おも]んじられる者[もの]———これが頭[あたま]———と、不法[ふほう]を教[おし]える預言者[よげんしゃ]———これが尾[しっぽ]である。"
  15: "この民[たみ]を『幸[しあわ]せだ』と言[い]う者[もの]たちは、この民を惑[まど]わせ、飲[の]み込[こ]もうとしている。"
  16: "それゆえ、主[しゅ]は彼[かれ]らの若者[わかもの]たちを喜[よろこ]ばず、その孤児[みなしご]ややもめをあわれまれない。彼らはみな不法[ふほう]な者[もの]、悪[わる]い者[もの]であり、すべての口[くち]が不義[ふぎ]を語[かた]るからである。それでもなお、主の怒[いか]りは収[おさ]まらず、その手[て]はまだ上[あ]げられたままである。"
  17: "不法[ふほう]は火[ひ]のように燃[も]え、乾[かわ]いた草[くさ]は火に食[く]われ、林[はやし]の茂[しげ]みの中[なか]で燃[も]え上[あ]がり、丘[おか]の周[まわ]りのすべてを巻[ま]き込[こ]んで煙[けむり]となる。"
  18: "主[しゅ]の怒[いか]りの激[はげ]しさによって全[ぜん]地[ち]は焼[や]かれ、民[たみ]は火[ひ]に焼[や]かれた者[もの]のようになる。人[ひと]はその兄弟[きょうだい]をあわれまない。"
  19: "彼[かれ]らは右[みぎ]に傾[かたむ]いても飢[う]え、左[ひだり]のものも食[た]べるが、満[み]ち足[た]りない。人[ひと]は自分[じぶん]の腕[うで]の肉[にく]を食[た]べる。"
  20: "マナセはエフライムを、エフライムはマナセを食[た]べる。二人[ふたり]は共[とも]にユダを包囲[ほうい]する。それでもなお、主[しゅ]の怒[いか]りは収[おさ]まらず、その手[て]はまだ上[あ]げられたままである。"

notes:
  1: "Слав. 9:2 (сдвиг: слав. 9:1 — конец нашего 8:23, дальше слав. N = наш N−1). ὁ λαὸς ὁ πορευόμενος ἐν σκότει — «народ, ходящий во тьме» (σκότος — тьма). ἴδετε φῶς μέγα — в gr-lxx-byz императив «смотрите свет великий»; слав. «видеша свет велий», МТ и Мф 4:16 — «увидели»; в тексте 見た (по слав., как древнее чтение). οἱ κατοικοῦντες ἐν χώρᾳ καὶ σκιᾷ θανάτου — «живущие в стране и тени смертной» (σκιά — тень); φῶς λάμψει ἐφ᾿ ὑμᾶς — «свет воссияет на вас» (λάμπω — сиять)."
  2: "Слав. 9:3. τὸ πλεῖστον τοῦ λαοῦ — «множество (большая часть) народа». ὃ κατήγαγες ἐν εὐφροσύνῃ σου — «которое Ты вывел в радости Твоей» (κατάγω — вести вниз, выводить; слав. «яже извел еси»); слав. читает «множайшии людие». ὡς οἱ εὐφραινόμενοι ἐν ἀμήτῳ — «как веселящиеся на жатве» (ἄμητος — жатва). ὃν τρόπον οἱ διαιρούμενοι σκῦλα — «как делящие добычу» (διαιρέω — делить). МТ/ru «Ты умножил народ, увеличил радость его» — иное; держимся LXX/слав."
  3: "Слав. 9:4. ἀφῄρηται ὁ ζυγὸς ὁ ἐπ᾿ αὐτῶν κείμενος — «снято ярмо, лежавшее на них» (ἀφαιρέω — отнимать; ζυγός — ярмо, 軛). ἡ ῥάβδος ἡ ἐπὶ τοῦ τραχήλου αὐτῶν — «жезл на шее их» (τράχηλος — шея). τὴν ῥάβδον τῶν ἀπαιτούντων — «жезл требующих (дань)» (ἀπαιτέω — требовать; слав. «истязующих»). ὡς τῇ ἡμέρᾳ τῇ ἐπὶ Μαδιαμ — «как в день [поражения] при Мадиаме» (Мидиан, ミディアン)."
  4: "Слав. 9:5. πᾶσαν στολὴν ἐπισυνηγμένην δόλῳ — «всякую одежду, собранную обманом» (στολή — одеяние; δόλος — коварство; ἐπισυνάγω — собирать; слав. «собранну лестию»). ἱμάτιον μετὰ καταλλαγῆς — «одежду с примирением» (καταλλαγή — примирение, замена; место тёмное). ἀποτείσουσιν — «отдадут» (ἀποτίνω — выплачивать, отдавать). θελήσουσιν εἰ ἐγενήθησαν πυρίκαυστοι — «пожелают, если бы они были сожжены огнём» (πυρίκαυστος — сожжённый огнём). МТ/ru здесь иное («обувь воина… одежда, обагрённая кровью, — в пищу огню»); по правилу 4 не вносим, держимся LXX/слав."
  5: "Слав. 9:6. παιδίον ἐγεννήθη ἡμῖν, υἱὸς καὶ ἐδόθη ἡμῖν — «младенец родился нам, Сын и дан нам» (рождественское чтение). οὗ ἡ ἀρχὴ ἐγενήθη ἐπὶ τοῦ ὤμου αὐτοῦ — «начальство Его было на плече Его» (ὦμος — плечо). καλεῖται τὸ ὄνομα αὐτοῦ Μεγάλης βουλῆς ἄγγελος — «называется имя Его: Ангел великого совета» (LXX; в тексте 『大いなる助言の使者』; МТ אֲבִי־עַד «Отец вечности» — иное чтение). Слав. добавляет титулы «чуден, советник, Бог крепкий, властелин, Князь мира, Отец будущаго века» — в LXX их нет; по паритету внесены в основной текст без 〔…〕 (不思議な助言者、力ある神、支配者、永遠の父、平和の君; порядок — по терминологии брифа: у слав. «Князь мира» стоит перед «Отец будущаго века», «властелин» передан как 支配者). ἐγὼ γὰρ ἄξω εἰρήνην ἐπὶ τοὺς ἄρχοντας, εἰρήνην καὶ ὑγίειαν αὐτῷ — «ибо Я приведу мир на князей, мир и здравие ему» (ἄγω — вести; ὑγίεια — здоровье)."
  6: "Слав. 9:7. μεγάλη ἡ ἀρχὴ αὐτοῦ — «велико начальство Его». τῆς εἰρήνης αὐτοῦ οὐκ ἔστιν ὅριον — «миру Его нет предела» (ὅριον — граница). ἐπὶ τὸν θρόνον Δαυιδ καὶ τὴν βασιλείαν αὐτοῦ — «на престоле Давида и в царстве Его». κατορθῶσαι αὐτὴν καὶ ἀντιλαβέσθαι αὐτῆς — «чтобы утвердить его и поддержать его» (κατορθόω — выпрямлять, утверждать; ἀντιλαμβάνομαι — поддерживать). ἐν δικαιοσύνῃ καὶ ἐν κρίματι — «в правде и в суде» (κρίμα — суд, 定め). ὁ ζῆλος κυρίου σαβαωθ ποιήσει ταῦτα — «ревность Господа Саваофа сделает это» (ζῆλος — ревность, 熱心)."
  7: "Слав. 9:8. Θάνατον ἀπέστειλεν κύριος ἐπὶ Ιακωβ — «смерть послал Господь на Иакова» (θάνατος — смерть; слав. «смерть»); МТ и ru читают «слово» (דָּבָר), но LXX и слав. дают «смерть» — в тексте 死. καὶ ἦλθεν ἐπὶ Ισραηλ — «и пришла на Израиля»."
  8: "Слав. 9:9. γνώσονται πᾶς ὁ λαὸς τοῦ Εφραιμ — «узнает весь народ Ефраима» (γινώσκω — узнавать; слав. «уразумеют»). οἱ ἐγκαθήμενοι ἐν Σαμαρείᾳ — «сидящие в Самарии» (ἐγκαθήμαι — сидеть в). ἐφ᾿ ὕβρει καὶ ὑψηλῇ καρδίᾳ — «в надменности и высоком сердце» (ὕβρις — надменность, дерзость; слав. «в досаждении»). λέγοντες — «говоря»: речь народа начинается в 9:9."
  9: "Слав. 9:10. Πλίνθοι πεπτώκασιν — «кирпичи пали» (πλίνθος — кирпич; слав. «плинфы падоша»). λαξεύσωμεν λίθους — «обтешем камни» (λαξεύω — высекать, обтёсывать). ἐκκόψωμεν συκαμίνους καὶ κέδρους — «вырубим сикоморы и кедры» (συκάμινος — сикомор, いちじく桑; κέδρος — кедр). οἰκοδομήσωμεν ἑαυτοῖς πύργον — «построим себе башню» (πύργος — башня). Речь народа — 「…」."
  10: "Слав. 9:11. ῥάξει ὁ θεὸς τοὺς ἐπανιστανομένους ἐπ᾿ ὄρος Σιων — «разобьёт Бог восстающих на гору Сион» (ῥήγνυμι — рвать, разбивать; ἐπανίστημι — восставать). τοὺς ἐχθροὺς αὐτῶν διασκεδάσει — «врагов их рассеет» (διασκεδάζω). МТ/ru «воздвигнет Господь против него врагов Рецина» — иное чтение; держимся LXX/слав."
  11: "Слав. 9:12. Συρίαν ἀφ᾿ ἡλίου ἀνατολῶν — «Сирию от востока солнца». τοὺς Ἕλληνας ἀφ᾿ ἡλίου δυσμῶν — «Еллинов (греков) от запада солнца» (в LXX так переданы филистимляне); в тексте ギリシア人. τοὺς κατεσθίοντας τὸν Ισραηλ ὅλῳ τῷ στόματι — «пожирающих Израиля всем ртом» (κατεσθίω — поедать). ἐπὶ τούτοις πᾶσιν οὐκ ἀπεστράφη ὁ θυμός, ἀλλ᾿ ἔτι ἡ χεὶρ ὑψηλή — рефрен: «при всём этом не отвратился гнев, но ещё рука высока» (ἀποστρέφω — отвращать). Рефрен повторяется в 9:16, 9:20 и 10:4."
  12: "Слав. 9:13. ὁ λαὸς οὐκ ἀπεστράφη, ἕως ἐπλήγη — «народ не обратился, доколе не был поражён» (πλήσσω — поражать; слав. «дондеже язвени быша»). τὸν κύριον οὐκ ἐξεζήτησαν — «Господа не взыскали» (ἐκζητέω — искать, взыскивать)."
  13: "Слав. 9:14. ἀφεῖλεν κύριος ἀπὸ Ισραηλ κεφαλὴν καὶ οὐράν — «отнял Господь у Израиля голову и хвост» (οὐρά — хвост). μέγαν καὶ μικρὸν ἐν μιᾷ ἡμέρᾳ — «великого и малого в один день»."
  14: "Слав. 9:15. πρεσβύτην — «старца» (πρεσβύτης; в тексте 長老). τοὺς τὰ πρόσωπα θαυμάζοντας — «уважающих лица» (θαυμάζω — дивиться, чтить; слав. «чудящихся лицам»), т. е. знатных. αὕτη ἡ ἀρχή — «это начало (голова)»; οὗτος ἡ οὐρά — «это хвост». Квадратные скобки в gr-lxx-byz — знак критического издания, не лакуна: слова в базе есть, 〔…〕 не ставим."
  15: "Слав. 9:16. οἱ μακαρίζοντες τὸν λαὸν τοῦτον — «убаюкивающие (называющие блаженным) народ этот» (μακαρίζω — называть блаженным; слав. «блажащии»). πλανῶντες καὶ πλανῶσιν — «обманывая, и обманывают» (πλανάω), повтор сохранён. ὅπως καταπίωσιν αὐτούς — «чтобы поглотить их» (καταπίνω — проглатывать)."
  16: "Слав. 9:17. ἐπὶ τοὺς νεανίσκους αὐτῶν οὐκ εὐφρανθήσεται ὁ θεός — «о юношах их не возрадуется Бог» (νεανίσκος — юноша). ὀρφανούς … χήρας — «сирот и вдов» (χήρα — вдова; слав. «вдовиц»). πάντες ἄνομοι καὶ πονηροί — «все беззаконные и злые». πᾶν στόμα λαλεῖ ἄδικα — «всякие уста говорят неправду» (ἄδικα — неправое). Конец — рефрен (см. 9:11)."
  17: "Слав. 9:18. καυθήσεται ὡς πῦρ ἡ ἀνομία — «сгорит, как огонь, беззаконие» (καίω — жечь; ἀνομία — беззаконие). ὡς ἄγρωστις ξηρὰ βρωθήσεται ὑπὸ πυρός — «как сухая трава будет съедена огнём» (ἄγρωστις — трава, пырей; слав. «троскот»). ἐν τοῖς δάσεσι τοῦ δρυμοῦ — «в чащах дубравы» (δάσος — чаща; δρυμός — дубрава). συγκαταφάγεται τὰ κύκλῳ τῶν βουνῶν πάντα — «пожрёт всё вокруг холмов» (βουνός — холм)."
  18: "Слав. 9:19. διὰ θυμὸν ὀργῆς κυρίου συγκέκαυται ἡ γῆ ὅλη — «от ярости гнева Господня сгорела вся земля» (συγκαίω — сжигать). ὁ λαὸς ὡς ὑπὸ πυρὸς κατακεκαυμένος — «народ, как огнём сожжённый» (κατακαίω). ἄνθρωπος τὸν ἀδελφὸν αὐτοῦ οὐκ ἐλεήσει — «человек брата своего не помилует» (ἐλεέω — миловать)."
  19: "Слав. 9:20. ἐκκλινεῖ εἰς τὰ δεξιά — «уклонится направо» (ἐκκλίνω — отклоняться). φάγεται ἐκ τῶν ἀριστερῶν — «будет есть от левых». οὐ μὴ ἐμπλησθῇ — «не насытится» (ἐμπίμπλημι — наполнять). ἄνθρωπος ἔσθων τὰς σάρκας τοῦ βραχίονος αὐτοῦ — «человек, поедающий плоть мышцы своей» (βραχίων — рука, мышца; σάρξ — плоть)."
  20: "Слав. 9:21. φάγεται γὰρ Μανασση τοῦ Εφραιμ καὶ Εφραιμ τοῦ Μανασση — «ибо поест Манассия Ефраима и Ефраим Манассию» (Манассия — マナセ). ἅμα πολιορκήσουσιν τὸν Ιουδαν — «вместе осадят Иуду» (πολιορκέω — осаждать). ἐπὶ τούτοις πᾶσιν οὐκ ἀπεστράφη ὁ θυμός — последний рефрен главы; у слав. он один составляет 9:21, потому что слав. сдвинут на стих. Конец главы."
