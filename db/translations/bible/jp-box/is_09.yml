# jp-box, Исаия, глава 9. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для Исаии есть фрагментами, но в этой
# главе он не привлекался; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 9: 1–4 народ во тьме и великий свет, радость, сокрушённое ярмо;
# 5–6 рождественское чтение: Младенец, Сын, титулы, Ангел великого совета,
# престол Давида; 7–20 гнев на Израиль: смерть и слово, глава и хвост, беззаконие
# как огонь, Манассия и Ефраим, рефрен о простёртой руке.
# Голоса: 1–8, 10–20 пророческая речь (возгласы и обетования) — без кавычек,
# в LXX нет вводных формул; 9 слова народа («кирпичи пали…») — 「…」.
# Рождественское чтение 9:5–6 — без кавычек (провозглашение, не чужая речь).
# Нумерация по gr: 20 стихов; у csl 21, потому что слав. 9:1 — это конец нашего
# 8:23 («Сие прежде испий, скоро твори…»). Дальше слав. на стих впереди:
# слав. N = наш N−1 (слав. 9:2 = наш 9:1 … слав. 9:21 = наш 9:20). Карта — в notes.
# 〔…〕 нет. Слав. 9:6 добавляет титулы «чуден, советник, Бог крепкий, властелин,
# Князь мира, Отец будущаго века» — их нет в LXX; по паритету внесены в основной
# текст без скобок, в notes отмечено. Сносок ⟨…⟩ нет.

