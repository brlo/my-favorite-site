verses:
  1: "アビメレクの後[あと]に、イスラエルを救[すく]うために、イッサカルの人[ひと]であるトラ、すなわちプアの子[こ]が立[た]った。プアは彼[かれ]の父[ちち]の兄弟[きょうだい]の子であった。彼はエフライムの山[やま]にあるサマリアに住[す]んでいた。"
  2: "彼[かれ]は二十三年[にじゅうさんねん]の間[あいだ]、イスラエルを裁[さば]き、死[し]んでサマリアに葬[ほうむ]られた。"
  3: "彼[かれ]の後[あと]に、ギレアデ人[びと]ヤイルが立[た]ち、二十二年[にじゅうにねん]の間[あいだ]、イスラエルを裁[さば]いた。"
  4: "彼[かれ]には三十二人[さんじゅうににん]の息子[むすこ]があり、彼らは三十二頭[さんじゅうにとう]の若[わか]いろばに乗[の]っていた。また彼らには三十二[さんじゅうに]の町[まち]があり、彼はそれらを、今日[きょう]に至[いた]るまで、ギレアデの地[ち]にあるヤイルの村々[むらむら]と呼[よ]んだ。"
  5: "ヤイルは死[し]んで、ラモに葬[ほうむ]られた。"
  6: "イスラエルの子[こ]らは再[ふたた]び、主[しゅ]の目[め]に悪[わる]を行[おこな]い、バアル神[がみ]たちとアスタロト神たち、シドンの神々[かみがみ]、モアブの神々、アンモンの子らの神々、ペリシテ人[じん]の神々に仕[つか]えた。彼[かれ]らは主を捨[す]て、主に仕えなかった。"
  7: "主[しゅ]はイスラエルに激[はげ]しく怒[いか]り、彼[かれ]らをペリシテ人[じん]の手[て]とアンモンの子[こ]らの手に売[う]り渡[わた]した。"
  8: "彼[かれ]らはその年[とし]から、十八年[じゅうはちねん]の間[あいだ]、ヨルダン川[がわ]の向[む]こう側[がわ]の、ギレアデにあるアモリ人[じん]の地[ち]にいるイスラエルの子[こ]らを、ことごとく虐[しいた]げ、打[う]ち砕[くだ]いた。"
  9: "アンモンの子[こ]らは、ユダとベニヤミン、またエフライムの家[いえ]で戦[たたか]うためにヨルダン川[がわ]を渡[わた]り、イスラエルの子らはひどく苦[くる]しめられた。"
  10: "イスラエルの子[こ]らは主[しゅ]に向かって叫[さけ]んで言[い]った。「あなたに罪[つみ]を犯[おか]しました。私たちは自分[じぶん]たちの神[かみ]を捨[す]てて、バアル神[がみ]たちに仕[つか]えたからです。」"
  11: "「エジプト人[じん]、アモリ人[じん]、アンモンの子[こ]ら、モアブ、ペリシテ人[じん]、"
  12: "シドン人[じん]、ミディアン人[じん]、アマレク人[じん]が、あなたがたを虐[しいた]げたのではないか。あなたがたがわたしに向かって叫[さけ]んだとき、わたしはあなたがたを彼[かれ]らの手[て]から救[すく]った。"
  13: "しかし、あなたがたはわたしを捨[す]てて他[ほか]の神々[かみがみ]に仕[つか]えた。それゆえ、わたしはもはやあなたがたを救[すく]わない。"
  14: "行[ゆ]って、自分[じぶん]たちが選[えら]んだ神々[かみがみ]に叫[さけ]べ。あなたがたが苦[くる]しむとき、その神々があなたがたを救[すく]うがよい。」"
  15: "イスラエルの子[こ]らは主[しゅ]に言[い]った。「私たちは罪[つみ]を犯[おか]しました。あなたの目[め]にかなうことをすべて、私たちにしてくださってかまいません。ただ、主[しゅ]よ、この日[ひ]、私たちを救[すく]い出[だ]してください。」"
  16: "彼[かれ]らは自分たちの間[あいだ]からほかの神々[かみがみ]を取り除[りのぞ]き、主[しゅ]に仕[つか]えた。主は民[たみ]のことを喜[よろこ]ばれず、イスラエルの労苦[ろうく]に心[こころ]を痛[いた]められた。"
  17: "アンモンの子[こ]らは上[のぼ]って来[き]て、ギレアデに陣営[じんえい]を張[は]った。イスラエルの子らも出[で]て来て、ミツパに陣営を張った。"
  18: "ギレアデの民[たみ]の指導者[しどうしゃ]たちは、互[たがい]に言[い]った。「誰[だれ]がアンモンの子[こ]らとの戦[たたか]いを始[はじ]めるだろうか。その者[もの]が、ギレアデに住[す]むすべての者[もの]の頭[かしら]となる。」"

notes:
  1: "ἀνέστη — восстал (ἀνίστημι; слав. «воста»). τοῦ σῶσαι τὸν Ισραηλ — «чтобы спасти Израиля» (инфинитив цели). Θωλα υἱὸς Φουα υἱὸς πατραδέλφου αὐτοῦ — «Фола, сын Фуи, сын брата отца его»: πατράδελφος — дядя по отцу; родство передано раздельно для ясности; в евр. здесь имя Додо (דּוֹדוֹ), отсюда у Синодального «сына Додова». ἀνὴρ Ισσαχαρ — «муж из Иссахара» (слав. «муж от иссахара»). κατῴκει ἐν Σαμαρείᾳ ἐν ὄρει Εφραιμ — жил в Самарии на горе Ефремовой: это Шамир (слав. «в самире», ру «в Шамире»), не город Самария; в тексте греческая форма サマリア, отличие отмечено здесь."
  2: "ἔκρινεν τὸν Ισραηλ — судил Израиля (κρίνω); 23 года. ἀπέθανεν καὶ ἐτάφη — умер и погребён (θάπτω). Дважды повторено ἐν Σαμαρείᾳ — サマリア (Шамир, см. ст. 1)."
  3: "ἀνέστη μετ᾿ αὐτὸν — восстал после него. Ιαιρ ὁ Γαλααδίτης — Иаир Галаадитянин (ギレアデ人; ср. Числ 32:41, Нав 13:30, где ヤイル). 22 года; формула та же, что в ст. 2."
  4: "ἐπιβεβηκότες ἐπὶ τριάκοντα καὶ δύο πώλους — «сидевшие на тридцати двух молодых ослах» (πῶλος — молодой осёл); 32. καὶ τριάκοντα καὶ δύο πόλεις αὐτοῖς — «и тридцать два города им»: в LXX 32, у Синодального 30 (масоретский текст), слав. «грады им тридесять два». ἐκάλεσεν αὐτὰς Ἐπαύλεις Ιαιρ — «назвал их Селениями Иаира» (ἔπαυλις — селение, двор); в корпусе ヤイルの村々. ἕως τῆς ἡμέρας ταύτης — до сего дня."
  5: "ἀπέθανεν Ιαιρ καὶ ἐτάφη ἐν Ραμμω — умер и погребён в Раммо; слав. «в камоне», ру «в Камоне» (по МТ קָמוֹן). Греческая форма передана как ラモ; расхождение отмечено."
  6: "προσέθεντο ... ποιῆσαι — «приложили делать», т. е. снова и продолжали делать (προστίθημι). ἐλάτρευσαν — служили (λατρεύω). Βααλιμ καὶ Ασταρωθ — Ваалы и Астарты (мн. ч.); バアル神たち、アスタロト神たち. θεοῖς Σιδῶνος, Μωαβ, υἱῶν Αμμων, ἀλλοφύλων — богам Сидона, Моава, сынов Аммона, иноплеменников (ペリシテ人). У слав. добавлено «богом Сирским» (Сирийским), в гр. нет — не переводим. ἐγκατέλιπον — оставили; οὐκ ἐδούλευσαν — не служили (δουλεύω)."
  7: "ἐθυμώθη ὀργῇ — воспылал гневом (θυμόω с ὀργή — усилительная конструкция). ἀπέδοτο — «продал» (ἀποδίδωμι; слав. «предаде»); 売り渡した. ἐν χειρὶ ἀλλοφύλων καὶ ἐν χειρὶ υἱῶν Αμμων — в руку иноплеменников и в руку сынов Аммона."
  8: "ἐσάθρωσαν καὶ ἔθλασαν — «изнуряли и сокрушали»: ἐσαθρόω редкий глагол (ослаблять, изнурять), θλάω — дробить; слав. «озлобиша и сокрушиша», ру «теснили и мучили». ὀκτωκαίδεκα ἔτη — 18 лет. ἐν τῷ πέραν τοῦ Ιορδάνου ἐν τῇ γῇ τοῦ Αμορραίου ἐν τῇ Γαλααδίτιδι — за Иорданом, в земле Аморрея, в Галааде; повтор «всех сынов Израиля» сохранён."
  9: "διέβησαν τὸν Ιορδάνην ἐκπολεμῆσαι — перешли Иордан, чтобы воевать (ἐκπολεμέω). καὶ ἐν τῷ Ιουδα καὶ Βενιαμιν καὶ ἐν τῷ οἴκῳ Εφραιμ — «и в Иуде, и в Вениамине, и в доме Ефрема»; ἐν здесь — «в [пределах]», не «против». ἐθλίβησαν ... σφόδρα — были стеснены весьма (θλίβω)."
  10: "ἐκέκραξαν — возопили (κράζω). Ἡμάρτομέν σοι — «согрешили Тебе» (датив). ἐγκατελίπομεν — оставили. ἐλατρεύσαμεν — служили. Речь в 「」."
  11: "Οὐχὶ οἱ Αἰγύπτιοι... — «не [были ли] египтяне...»: вопрос начинается здесь и завершается в ст. 12 на ἐξέθλιψαν ὑμᾶς. Перечисление: египтяне, аморреи, сыны Аммона, Моав, иноплеменники. Речь Господа — 「」, начинается здесь и кончается в ст. 14."
  12: "Σιδώνιοι καὶ Μαδιαμ καὶ Αμαληκ — сидоняне, Мадиам, Амалик; ἐξέθλιψαν ὑμᾶς — угнетали вас (ἐκθλίβω). ἐκεκράξατε ... ἔσωσα — воззвали, Я спас: в гр. это утверждение, не вопрос (слав. и ру ставят вопросительный знак в конце). Речь Господа продолжается."
  13: "ἐγκατελίπετέ με — оставили Меня. ἐλατρεύσατε θεοῖς ἑτέροις — служили иным богам. οὐ προσθήσω τοῦ σῶσαι — «не приложу спасать», т. е. не буду больше спасать (προστίθημι с инфинитивом)."
  14: "βαδίζετε καὶ βοᾶτε — идите и взывайте (βαδίζω, βοάω). ἐξελέξασθε ἑαυτοῖς — избрали себе. σωσάτωσαν — пусть спасут (императив 3 л. мн. ч.). ἐν καιρῷ θλίψεως — во время скорби. Ирония сохранена."
  15: "Ἡμάρτομεν — согрешили (без дополнения, в отличие от ст. 10). ποίησον σὺ ἡμῖν — «сделай Ты нам» (σύ эмфатично). κατὰ πάντα, ὅσα ἂν ἀρέσκῃ ἐνώπιόν σου — по всему, что угодно пред очами Твоими. πλήν — только, впрочем. ἐξελοῦ — избавь (ἐξαιρέω). Речь в 「」."
  16: "μετέστησαν — удалили (μεθίστημι). θεοὺς ἀλλοτρίους — чужих богов. ἐλάτρευσαν τῷ κυρίῳ — служили Господу. καὶ οὐκ εὐηρέστησεν ἐν τῷ λαῷ — «и не благоволил в народе»: трудное место; LXX-A и слав. читают «сократилась/сжалилась душа Его от труда Израиля» (ὠλιγώθη ἡ ψυχὴ αὐτοῦ), ру «не потерпела душа Его страдания Израилева». ὠλιγοψύχησεν — «изнемог духом» (ὀλιγοψυχέω). Передано по gr-lxx-byz без сглаживания; расхождение с слав. и ру отмечено."
  17: "ἀνέβησαν — поднялись (ἀναβαίνω). παρενέβαλον — расположились станом (παρεμβάλλω). Μασσηφα — Массифа; по брифу ミツパ (ср. 11:11, 34)."
  18: "οἱ ἄρχοντες τοῦ λαοῦ Γαλααδ — «князья народа Галаада»; слав. «людие князи галаадстии» переставляет. ἀνὴρ πρὸς τὸν πλησίον αὐτοῦ — друг к другу. Τίς ἀνήρ, ὃς ἄρξεται... — «кто муж, который начнёт» (ἄρχομαι с инфинитивом). εἰς κεφαλήν — в главу, т. е. начальником. Речь в 「」."
