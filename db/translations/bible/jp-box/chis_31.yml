verses:
  1: "主[しゅ]はモーセに言[い]われた。"
  2: "「イスラエルの子[こ]らのために、ミディアン人[じん]に復讐[ふくしゅう]しなさい。その後[あと]、あなたは自分[じぶん]の民[たみ]に加[くわ]えられる。」"
  3: "モーセは民[たみ]に語[かた]って言[い]った。「あなたがたのうちから男[おとこ]たちを武装[ぶそう]させ、主[しゅ]の前[まえ]に出[で]てミディアンに向[む]かって戦[たたか]わせなさい。主[しゅ]の復讐[ふくしゅう]をミディアンに行[おこな]うためである。"
  4: "イスラエルのすべての部族[ぶぞく]から、部族ごとに千人[せんにん]ずつを戦[たたか]いに送[おく]り出[だ]しなさい。」"
  5: "イスラエルのうちから、部族ごとに千人[せんにん]ずつ、戦[たたか]いのために武装[ぶそう]した一万二千人[いちまんにせんにん]が数[かぞ]えられた。"
  6: "モーセは彼らを、部族ごとに千人[せんにん]ずつ、その軍勢[ぐんせい]とともに送[おく]り出[だ]した。また、祭司[さいし]アロンの子[こ]であるエレアザルの子[こ]ピネハスを、聖[せい]なる器[うつわ]と合図[あいず]のラッパを彼の手[て]に持[も]たせて送った。"
  7: "彼らは主[しゅ]がモーセに命[めい]じられたとおりにミディアンに向かって戦[たたか]い、男[おとこ]をすべて殺[ころ]した。"
  8: "彼らはミディアンの王[おう]たちを、その殺[ころ]された者[もの]たちとともに殺した。すなわち、エウイン、スル、ロコム、ウル、ロボクの五人[ごにん]のミディアンの王である。また、ベオルの子[こ]バラムを、その殺された者たちとともに剣[けん]で殺した。"
  9: "彼らはミディアンの女[おんな]たちとその子[こ]どもたち、家畜[かちく]、すべての所有物[しょゆうぶつ]、およびその富[とみ]のすべてを奪[うば]い取[と]った。"
  10: "彼らは彼らの住[す]まいであるすべての町[まち]と、その村々[むらむら]を火[ひ]で焼[や]き払[はら]った。"
  11: "彼らはすべての略奪物[りゃくだつぶつ]と、人[ひと]から家畜[かちく]に至[いた]るまですべての戦利品[せんりひん]を取[と]った。"
  12: "彼らは捕虜[ほりょ]、戦利品[せんりひん]、略奪物[りゃくだつぶつ]を、モーセと祭司[さいし]エレアザル、およびイスラエルのすべての子[こ]らのもとへ、ヨルダン川[がわ]のほとり、エリコの向[む]かい側[がわ]にあるモアブのアラボトの宿営[しゅくえい]へ連[つ]れて来[き]た。"
  13: "モーセと祭司[さいし]エレアザル、および会衆[かいしゅう]のすべての長[ちょう]たちは、宿営[しゅくえい]の外[そと]へ彼らを迎[むか]えに出[で]た。"
  14: "モーセは、戦[たたか]いから帰[かえ]って来[き]た軍[ぐん]の監督[かんとく]たち、すなわち千人[せんにん]の長[ちょう]たちと百人[ひゃくにん]の長たちに怒[いか]った。"
  15: "モーセは彼らに言[い]った。「なぜ、あなたがたは女[おんな]をすべて生[い]かしておいたのか。"
  16: "この女[おんな]たちは、バラムの言葉[ことば]によって、イスラエルの子[こ]らがペオルのために主[しゅ]の言葉から背[そむ]き、主の言葉を軽[かろ]んじるきっかけとなった。そのため、主[しゅ]の会衆[かいしゅう]に災[わざわ]いが起[お]こったのである。"
  17: "だから今、すべての子[こ]どもたちのうちの男[おとこ]を殺[ころ]し、男[おとこ]を知[し]った女[おんな]をすべて殺しなさい。"
  18: "女[おんな]の子[こ]どもで、まだ男[おとこ]を知らない者[もの]はすべて、あなたがたのために生[い]かしておきなさい。"
  19: "あなたがたは宿営[しゅくえい]の外[そと]に七日[なぬか]の間[あいだ]野営[やえい]しなさい。人[ひと]を殺[ころ]した者[もの]、また殺された者[もの]に触[ふ]れた者[もの]は、あなたがたもあなたがたの捕虜[ほりょ]も、三日目[みっかめ]と七日目[なぬかめ]に清[きよ]められなければならない。"
  20: "また、すべての衣服[いふく]、すべての革[かわ]の器[うつわ]、山羊[やぎ]の皮[かわ]で作[つく]ったすべての品[しな]、すべての木[き]の器を清[きよ]めなさい。」"
  21: "祭司[さいし]エレアザルは、戦[たたか]いから帰[かえ]って来[き]た軍[ぐん]の男[おとこ]たちに言[い]った。「これは、主[しゅ]がモーセに命[めい]じられた律法[りっぽう]の定[さだ]めである。"
  22: "ただし、金[きん]、銀[ぎん]、銅[どう]、鉄[てつ]、鉛[なまり]、すずについては、"
  23: "火[ひ]の中[なか]を通[とお]るものはすべて、火[ひ]で清[きよ]められる。さらに、清[きよ]めの水[みず]でも清めなければならない。火の中を通らないものはすべて、水[みず]の中を通しなさい。"
  24: "七日目[なぬかめ]には衣服[いふく]を洗[あら]い、身[み]を清[きよ]めなさい。その後[あと]で宿営[しゅくえい]に入[はい]りなさい。」"
  25: "主[しゅ]はモーセに言[い]われた。"
  26: "「あなたと祭司[さいし]エレアザル、および会衆[かいしゅう]の氏族[しぞく]の長[ちょう]たちは、捕虜[ほりょ]の戦利品[せんりひん]を、人[ひと]から家畜[かちく]に至[いた]るまで数[かぞ]え上[あ]げなさい。"
  27: "あなたがたは戦利品[せんりひん]を、戦[たたか]いに出[で]た兵士[へいし]たちと全会衆[ぜんかいしゅう]との間[あいだ]で分[わ]けなさい。"
  28: "戦[たたか]いに出[で]た兵士[へいし]たちから、主[しゅ]への貢[みつ]ぎ物[もの]として、人[ひと]からも家畜[かちく]からも、すなわち牛[うし]、羊[ひつじ]、山羊[やぎ]からも、五百[ごひゃく]につき一[いち]つずつを取[と]り分[わ]けなさい。"
  29: "その半分[はんぶん]から取[と]り、祭司[さいし]エレアザルに主[しゅ]への初穂[はつほ]として与[あた]えなさい。"
  30: "イスラエルの子[こ]らの半分[はんぶん]からは、人[ひと]、牛[うし]、羊[ひつじ]、ろば、およびすべての家畜[かちく]のうちから、五十[ごじゅう]につき一[いち]つを取[と]り、主[しゅ]の幕屋[まくや]で務[つと]めを守[まも]るレビ人[びと]たちに与[あた]えなさい。」"
  31: "モーセと祭司[さいし]エレアザルは、主[しゅ]がモーセに命[めい]じられたとおりに行[おこな]った。"
  32: "戦[たたか]いに出[で]た男[おとこ]たちが奪[うば]い取[と]った略奪物[りゃくだつぶつ]の残[のこ]りは、羊[ひつじ]が六十万七千五百匹[ひき]、"
  33: "牛[うし]が七万二千頭[とう]、"
  34: "ろばが六万一千頭[とう]、"
  35: "人[ひと]の魂[たましい]、すなわち男[おとこ]を知[し]らない女[おんな]たちは、全部[ぜんぶ]で三万二千人[にん]であった。"
  36: "戦[たたか]いに出[で]た者[もの]たちの分[ぶん]である半分[はんぶん]は、羊[ひつじ]の数[かず]から、三十三万七千五百匹[ひき]であった。"
  37: "羊[ひつじ]から主[しゅ]への貢[みつ]ぎ物[もの]は六百七十五匹[ひき]であった。"
  38: "牛[うし]は三万六千頭[とう]で、そのうち主[しゅ]への貢[みつ]ぎ物[もの]は七十二頭[とう]であった。"
  39: "ろばは三万五百頭[とう]で、そのうち主[しゅ]への貢[みつ]ぎ物[もの]は六十一頭[とう]であった。"
  40: "人[ひと]は一万六千人[にん]で、そのうち主[しゅ]への貢[みつ]ぎ物[もの]は三十二人[にん]の魂[たましい]であった。"
  41: "モーセは、主[しゅ]への貢[みつ]ぎ物[もの]、すなわち神[かみ]への取[と]り分[わ]けを、主が命[めい]じられたとおりに祭司[さいし]エレアザルに与[あた]えた。"
  42: "これは、モーセが戦[たたか]いの男[おとこ]たちから分[わ]けた、イスラエルの子[こ]らの半分[はんぶん]からである。"
  43: "会衆[かいしゅう]の受[う]ける半分[はんぶん]は、羊[ひつじ]が三十三万七千五百匹[ひき]、"
  44: "牛[うし]が三万六千頭[とう]、"
  45: "ろばが三万五百頭[とう]、"
  46: "人[ひと]が一万六千人[にん]であった。"
  47: "モーセは、イスラエルの子[こ]らの半分[はんぶん]から、人[ひと]からも家畜[かちく]からも五十[ごじゅう]につき一[いち]つを取[と]り、主[しゅ]の幕屋[まくや]の務[つと]めを守[まも]るレビ人[びと]たちに与[あた]えた。主[しゅ]がモーセに命[めい]じられたとおりである。"
  48: "軍[ぐん]の千人隊[せんにんたい]を任[まか]された者[もの]たち、すなわち千人[せんにん]の長[ちょう]たちと百人[ひゃくにん]の長たちが、モーセのもとに来[き]た。"
  49: "彼らはモーセに言[い]った。「あなたの僕[しもべ]たちは、自分[じぶん]たちの配下[はいか]の戦士[せんし]たちを数[かぞ]え上[あ]げました。すると、一人[ひとり]も欠[か]けませんでした。"
  50: "それで、わたしたちは主[しゅ]への贈[おく]り物[もの]を携[たずさ]えて来[き]ました。それぞれが見[み]つけた金[きん]の飾[かざ]り物[もの]、すなわち腕輪[うでわ]、腕飾[うでかざ]り、指輪[ゆびわ]、右腕[みぎうで]の飾り、首飾[くびかざ]りなどです。主[しゅ]の前[まえ]でわたしたちのために贖[あがな]いをするためです。」"
  51: "モーセと祭司[さいし]エレアザルは、彼らから金[きん]、すなわち細工[さいく]されたすべての器[うつわ]を受[う]け取[と]った。"
  52: "主[しゅ]への取[と]り分[わ]けとしてささげられた金[きん]は全部[ぜんぶ]で、千人[せんにん]の長[ちょう]たちと百人[ひゃくにん]の長たちから、一万六千七百五十シケルであった。"
  53: "戦[たたか]いの男[おとこ]たちは、それぞれ自分[じぶん]のために略奪[りゃくだつ]した。"
  54: "モーセと祭司[さいし]エレアザルは、千人[せんにん]の長[ちょう]たちと百人[ひゃくにん]の長たちからその金[きん]を受[う]け取[と]り、それを証[あかし]の幕屋[まくや]に運[はこ]び入[い]れた。主[しゅ]の前[まえ]でイスラエルの子[こ]らの記念[きねん]とするためである。"

notes:
  1: "Стандартная формула введения речи (ἐλάλησεν κύριος πρὸς Μωυσῆν λέγων); λέγων отдельно не передаётся (ср. 29:1; Лев 23:1)."
  2: "ἐκδίκει τὴν ἐκδίκησιν — «отмсти отмщение» (cognate accusative; ἐκδικέω). ἐκ τῶν Μαδιανιτῶν — от Мадианитян (ἐκ + род. — «от», т.е. против них). ἔσχατον — напоследок, после (ἔσχατος). προστεθήσῃ πρὸς τὸν λαόν σου — приложишься к народу своему, т.е. умрёшь (προστίθημι; ср. Быт 25:8)."
  3: "ἐξοπλίσατε — вооружите (ἐξοπλίζω). παρατάξασθαι — ополчиться, построиться для боя (παρατάσσω). ἔναντι κυρίου — пред Господом. ἀποδοῦναι ἐκδίκησιν παρὰ τοῦ κυρίου τῇ Μαδιαν — отдать отмщение от Господа Мадиаму, т.е. исполнить Господне мщение над Мадиамом."
  4: "χιλίους ἐκ φυλῆς — по тысяче от колена (повтор, как в евр.). ἀποστείλατε — пошлите (имп. аор.). παρατάξασθαι — на войну, в строй. Всего двенадцать тысяч (ст. 5)."
  5: "ἐξηρίθμησαν — исчислили (ἐξαριθμέω). ἐκ τῶν χιλιάδων Ισραηλ — из тысяч Израиля (тысячи — родовые подразделения). δώδεκα χιλιάδες — двенадцать тысяч. ἐνωπλισμένοι εἰς παράταξιν — вооружённые для строя/боя."
  6: "σὺν δυνάμει αὐτῶν — с силою их, т.е. с их отрядами. Φινεες υἱὸν Ελεαζαρ υἱοῦ Ααρων τοῦ ἱερέως — Финееса, сына Елеазара, сына Аарона-священника (цепочка родительных падежей). τὰ σκεύη τὰ ἅγια — священные сосуды. αἱ σάλπιγγες τῶν σημασιῶν — трубы знамений/сигналов (σημασία), т.е. сигнальные трубы."
  7: "παρετάξαντο ἐπὶ Μαδιαν — построились против Мадиама. καθὰ ἐνετείλατο — как повелел. ἀπέκτειναν πᾶν ἀρσενικόν — убили весь мужской пол (ἀρσενικός)."
  8: "τοὺς βασιλεῖς... ἅμα τοῖς τραυματίαις αὐτῶν — царей вместе с их поражёнными/павшими (τραυματίας — «раненый, убитый»; слав. «язвеные»). Ευιν, Σουρ, Ροκομ, Ουρ, Ροβοκ — пять царей (в Синодальном: Евий, Рекем, Цур, Хур, Рева). Βαλααμ υἱὸν Βεωρ — Валаама, сына Веорова. ἐν ῥομφαίᾳ — мечом (ῥομφαία — большой меч)."
  9: "ἐπρονόμευσαν — взяли добычу (προνομεύω). ἀποσκευή — здесь «дети, домочадцы» (в LXX обычно «обоз, имение»; в ст. 9 — жёны и дети, ср. Синодальный «детей их»). τὰ ἔγκτητα — недвижимое имущество, владения (ἔγκτητος). τὴν δύναμιν αὐτῶν — силу их; в контексте добычи — богатство/имущество (слав. «силу их»)."
  10: "τὰς ἐν ταῖς οἰκίαις αὐτῶν — «которые в жилищах их», т.е. обитаемые города. ἐπαύλεις — селения, дворы (ἔπαυλις). ἐνέπρησαν ἐν πυρί — сожгли огнём (ἐμπίπρημι)."
  11: "προνομή — добыча, награбленное; σκῦλα — военная добыча, трофеи. ἀπὸ ἀνθρώπου ἕως κτήνους — от человека до скота (формула полноты)."
  12: "ἤγαγον — привели (ἄγω). αἰχμαλωσία — плен, пленные. τὴν παρεμβολήν — стан. Αραβωθ Μωαβ — Аравоф Моав, равнины Моавитские (עַרְבוֹת מוֹאָב). ἐπὶ τοῦ Ιορδάνου κατὰ Ιεριχω — у Иордана против Иерихона."
  13: "ἐξῆλθεν... εἰς συνάντησιν αὐτοῖς — вышел навстречу им. ἔξω τῆς παρεμβολῆς — вне стана. οἱ ἄρχοντες τῆς συναγωγῆς — начальники общества."
  14: "ὠργίσθη ἐπὶ τοῖς ἐπισκόποις — прогневался на надзирателей (ἐπίσκοπος — «блюститель, надзиратель»). τοῖς ἐρχομένοις ἐκ τῆς παρατάξεως τοῦ πολέμου — пришедшим с военного построения, т.е. с войны."
  15: "Ἵνα τί — для чего, почему. ἐζωγρήσατε — оставили живыми, взяли живыми (ζωγρέω). πᾶν θῆλυ — весь женский пол (θῆλυς)."
  16: "αὗται γὰρ ἦσαν... κατὰ τὸ ῥῆμα Βαλααμ — они были... по слову Валаама (причина соблазна). τοῦ ἀποστῆσαι καὶ ὑπεριδεῖν — чтобы отступить и презреть (ἀφίστημι, ὑπεροράω). ἕνεκεν Φογωρ — ради Фогора (Ваал-Фегор; ср. 25:3). ἡ πληγή — поражение, мор. ἐν τῇ συναγωγῇ κυρίου — в обществе Господнем."
  17: "ἀπαρτία — здесь «дети, малые» (слово многозначное; слав. «во всяком возрасте»); πᾶν ἀρσενικόν — всех мужского пола. ἔγνωκεν κοίτην ἄρσενος — познала ложе мужчины (γινώσκω + κοίτη)."
  18: "ἀπαρτία τῶν γυναικῶν — девочки, женский молодняк. ἥτις οὐκ οἶδεν κοίτην ἄρσενος — которая не познала ложа мужчины. ζωγρήσατε αὐτάς — оставьте их живыми (ζωγρέω)."
  19: "παρεμβάλετε — расположитесь станом (παρεμβάλλω). ὁ ἀνελών — убивший (ἀναιρέω); ὁ ἁπτόμενος τοῦ τετρωμένου — прикасающийся к поражённому/убитому. ἁγνισθήσεται — будет очищен (ἁγνίζω). τῇ τρίτῃ... τῇ ἑβδόμῃ — в третий и седьмой день (обряд очищения от трупной скверны, ср. 19:11–19). αἰχμαλωσία — пленные."
  20: "περίβλημα — одежда, покрывало. σκεῦος δερμάτινον — кожаный сосуд/изделие. ἐργασία ἐξ αἰγείας — изделие из козьей [кожи] (αἴγειος; слав. «козличина»), ср. Синодальный «из козьей шерсти». σκεῦος ξύλινον — деревянный сосуд. ἀφαγνιεῖτε — очистите (ἀφαγνίζω, усилительная форма)."
  21: "δικαίωμα τοῦ νόμου — устав закона (δικαίωμα). συνέταξεν — заповедал (συντάσσω). Далее речь Елеазара продолжается до ст. 24."
  22: "πλήν — кроме (начало перечисления; синтаксис продолжается в ст. 23). χρυσίον, ἀργύριον, χαλκός, σίδηρος, μόλιβδος, κασσίτερος — золото, серебро, медь, железо, свинец, олово. В слав. порядок иной, а κασσίτερος передан как «касситер»."
  23: "πᾶν πρᾶγμα, ὃ διελεύσεται ἐν πυρί — всякая вещь, которая пройдёт через огонь. καθαρισθήσεται — очистится. ἀλλ᾿ ἢ τῷ ὕδατι τοῦ ἁγνισμοῦ ἁγνισθήσεται — но и водою очищения очистится (ἀλλ᾿ ἤ — «кроме как, но и»). διαπορεύηται — проходит (διαπορεύομαι)."
  24: "πλυνεῖσθε τὰ ἱμάτια — омойте одежды (πλύνω). τῇ ἡμέρᾳ τῇ ἑβδόμῃ — в седьмой день. εἰσελεύσεσθε εἰς τὴν παρεμβολήν — войдёте в стан."
  25: "Формула введения речи (ср. ст. 1)."
  26: "Λαβὲ τὸ κεφάλαιον — возьми итог/поголовье (κεφάλαιον — «главное, итог»). σὺ καὶ Ελεαζαρ... καὶ οἱ ἄρχοντες τῶν πατριῶν — ты, Елеазар и начальники родов (πατριά). τῆς συναγωγῆς — общества."
  27: "διελεῖτε — разделите (διαιρέω). ἀνὰ μέσον... — между. οἱ πολεμισταί — воины. οἱ ἐκπορευόμενοι εἰς τὴν παράταξιν — выходящие на бой. πάσης συναγωγῆς — всего общества."
  28: "ἀφελεῖτε τέλος κυρίῳ — отделите дань Господу (τέλος — «налог, дань»). μίαν ψυχὴν ἀπὸ πεντακοσίων — одну душу из пятисот (распределительно). ἀπὸ τῶν ἀνθρώπων καὶ ἀπὸ τῶν κτηνῶν... — из людей, скота, волов, овец и коз. В слав. вместо коз — «ослят» (расхождение с LXX; в тексте держимся греческого)."
  29: "ἀπὸ τοῦ ἡμίσους αὐτῶν — из половины их (воинов). δώσεις — дай (буд. в знач. имп.). τὰς ἀπαρχάς — начатки (ἀπαρχή), здесь 初穂."
  30: "ἀπὸ τοῦ ἡμίσους τοῦ τῶν υἱῶν Ισραηλ — из половины сынов Израиля. ἕνα ἀπὸ τῶν πεντήκοντα — одного из пятидесяти. ὄνων — ослов (в этом стихе LXX называет ослов; в ст. 28 — коз). τοῖς Λευίταις τοῖς φυλάσσουσιν τὰς φυλακάς — левитам, охраняющим стражи (φυλάσσω + φυλακή), т.е. несущим службу при скинии."
  31: "καθὰ συνέταξεν κύριος — как повелел Господь. Простое исполнение приказа."
  32: "τὸ πλεόνασμα τῆς προνομῆς — остаток/излишек добычи (πλεόνασμα). ἀπὸ τῶν προβάτων — из мелкого скота (πρόβατον). ἑξακόσιαι χιλιάδες καὶ ἑβδομήκοντα καὶ πέντε χιλιάδες — 675 000 (букв. «шестьсот тысяч и семьдесят и пять тысяч»)."
  33: "βόες — волы (βοῦς). δύο καὶ ἑβδομήκοντα χιλιάδες — 72 000."
  34: "ὄνοι — ослы. μία καὶ ἑξήκοντα χιλιάδες — 61 000."
  35: "ψυχαὶ ἀνθρώπων ἀπὸ τῶν γυναικῶν — души людей из женщин, т.е. женщины. αἳ οὐκ ἔγνωσαν κοίτην ἀνδρός — не познавшие ложа мужчины. πᾶσαι ψυχαὶ δύο καὶ τριάκοντα χιλιάδες — 32 000 душ."
  36: "τὸ ἡμίσευμα — половина (ἡμίσευμα). ἡ μερὶς τῶν ἐκπεπορευμένων — доля выступивших на войну. ἐκ τοῦ ἀριθμοῦ — из числа. τριακόσιαι καὶ τριάκοντα χιλιάδες καὶ ἑπτακισχίλια καὶ πεντακόσια — 337 500."
  37: "τὸ τέλος κυρίῳ — дань Господу (τέλος). ἑξακόσια ἑβδομήκοντα πέντε — 675 (одна пятисотая от 337 500)."
  38: "βόες ἓξ καὶ τριάκοντα χιλιάδες — 36 000 волов. τὸ τέλος κυρίῳ δύο καὶ ἑβδομήκοντα — 72."
  39: "ὄνοι τριάκοντα χιλιάδες καὶ πεντακόσιοι — 30 500 ослов. τὸ τέλος κυρίῳ εἷς καὶ ἑξήκοντα — 61."
  40: "ψυχαὶ ἀνθρώπων ἑκκαίδεκα χιλιάδες — 16 000 душ. τὸ τέλος αὐτῶν... δύο καὶ τριάκοντα ψυχαί — 32 души."
  41: "τὸ ἀφαίρεμα τοῦ θεοῦ — отделённое/выделенное Богу (ἀφαίρεμα). ἔδωκεν... Ελεαζαρ — отдал Елеазару. καθὰ συνέταξεν κύριος — как повелел Господь."
  42: "ἀπὸ τοῦ ἡμισεύματος τῶν υἱῶν Ισραηλ — из половины сынов Израиля. οὓς διεῖλεν Μωϋσῆς ἀπὸ τῶν ἀνδρῶν τῶν πολεμιστῶν — которых отделил Моисей от мужей-воинов (οὓς — муж. род мн. ч., согласовано с τῶν υἱῶν Ισραηλ, а не с ἡμίσευμα)."
  43: "ἡμίσευμα τὸ τῆς συναγωγῆς — половина общества. ἀπὸ τῶν προβάτων... — 337 500 овец (та же цифра, что и у воинов)."
  44: "βόες ἓξ καὶ τριάκοντα χιλιάδες — 36 000 волов."
  45: "ὄνοι τριάκοντα χιλιάδες καὶ πεντακόσιοι — 30 500 ослов."
  46: "ψυχαὶ ἀνθρώπων ἓξ καὶ δέκα χιλιάδες — 16 000 душ."
  47: "τὸ ἓν ἀπὸ τῶν πεντήκοντα — одного из пятидесяти. τοῖς φυλάσσουσιν τὰς φυλακάς — несущим стражи. ὃν τρόπον συνέταξεν — как повелел."
  48: "οἱ καθεσταμένοι εἰς τὰς χιλιαρχίας — поставленные над тысячами (καθίστημι). χιλίαρχοι καὶ ἑκατόνταρχοι — тысяченачальники и стоначальники."
  49: "εἰλήφασιν τὸ κεφάλαιον — взяли итог/перепись. τῶν παρ᾿ ἡμῶν — из наших, т.е. подчинённых нам. οὐ διαπεφώνηκεν ἀπ᾿ αὐτῶν οὐδὲ εἷς — не убыл/не пропал ни один (διαφωνέω — «недоставать»)."
  50: "προσενηνόχαμεν τὸ δῶρον — принесли дар (προσφέρω). ἀνὴρ ὃ εὗρεν σκεῦος χρυσοῦν — каждый, что нашёл из золотых вещей. χλιδών, ψέλιον, δακτύλιος, περιδέξιον, ἐμπλόκιον — золотые украшения: обруч/браслет, запястье, перстень, наручье (на правую руку), ожерелье/плетёное украшение; точные значения спорны. ἐξιλάσασθαι περὶ ἡμῶν — умилостивить за нас."
  51: "σκεῦος εἰργασμένον — обработанная/изготовленная вещь (ἐργάζομαι)."
  52: "τὸ ἀφαίρεμα — отделённое (ср. ст. 41). ἓξ καὶ δέκα χιλιάδες καὶ ἑπτακόσιοι καὶ πεντήκοντα σίκλοι — 16 750 сиклей: итог золота, принесённого тысяченачальниками и стоначальниками (не дань 1/500 из ст. 28, а добровольное приношение)."
  53: "ἐπρονόμευσαν ἕκαστος ἑαυτῷ — каждый грабил для себя (датив интереса)."
  54: "μνημόσυνον τῶν υἱῶν Ισραηλ — памятование/памятник сынов Израиля (μνημόσυνον). εἰσήνεγκεν εἰς τὴν σκηνὴν τοῦ μαρτυρίου — внёс в скинию свидетельства."
