# jp-box, Второзаконие, глава 5. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — csl-ru (jp-joc в гл. 5 отсутствует).
# ru (Синодальный, с масоретского) — только для понимания, не источник.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 5: речь Моисея (1–33): призыв слушать (1), завет на Хориве (2–5),
# Декалог — слова Бога внутри речи Моисея, поэтому 『…』 (6–21), страх народа
# и посредничество Моисея (22–27), ответ Бога Моисею (28–31), заключение (32–33).
# Нумерация заповедей — греческая: 17 прелюбодеяние, 18 убийство, 19 кража
# (в csl-ru и Синодальном 17 «Не убий», 18 «Не прелюбодействуй» — держимся греческого).
# Красного и синего нет: речь Бога — 『…』, <j> не ставится.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (проверено по выгрузке и базе).
# Сносок ⟨…⟩ нет: 契約, 安息日, 偶像, 嗣業 уже в корпусе или понятны.
# jp-ni не использовался.

tr_code: jp-box
book: vtor
chapter: 5
draft: true

verses:
  1: "モーセはイスラエル全体[ぜんたい]を呼[よ]び寄[よ]せて言[い]った。「聞[き]け、イスラエル。わたしが今日[きょう]、あなたがたの耳[みみ]に語[かた]る定[さだ]めと裁[さば]きをすべて、あなたがたは学[まな]び、守[まも]って行[おこな]いなさい。"
  2: "あなたがたの神[かみ]である主[しゅ]は、ホレブで、あなたがたと契約[けいやく]を結[むす]ばれた。"
  3: "主[しゅ]がこの契約[けいやく]を結[むす]ばれたのは、あなたがたの父[ちち]たちに対してではなく、今日[きょう]、ここに生[い]きているあなたがたすべてに対してである。"
  4: "主[しゅ]は山[やま]の上[うえ]で、火[ひ]の中[なか]から、あなたがたと顔[かお]と顔[かお]を合[あ]わせて語[かた]られた。"
  5: "そのとき、わたしは主[しゅ]とあなたがたの間[あいだ]に立[た]って、主[しゅ]の言葉[ことば]をあなたがたに告[つ]げていた。あなたがたが火[ひ]の前[まえ]を恐[おそ]れ、山[やま]に上[のぼ]らなかったからである。主[しゅ]は言[い]われた。"
  6: "『わたしは主[しゅ]、あなたの神[かみ]である。あなたをエジプトの地[ち]から、奴隷[どれい]の家[いえ]から導[みちび]き出[だ]した者[もの]である。"
  7: "あなたには、わたしの前[まえ]に、ほかの神[かみ]々[がみ]があってはならない。"
  8: "あなたは自分[じぶん]のために偶像[ぐうぞう]を造[つく]ってはならない。また、上[うえ]の天[てん]にあるもの、下[した]の地[ち]にあるもの、地[ち]の下[した]の水[みず]の中[なか]にあるもの、そのいかなる形[かたち]も造[つく]ってはならない。"
  9: "それらを拝[おが]んではならない。それらに仕[つか]えてはならない。わたしは主[しゅ]、あなたの神[かみ]、妬[ねた]む神[かみ]であって、わたしを憎[にく]む者[もの]には、父[ちち]の罪[つみ]を子[こ]どもに、三代[さんだい]また四代[よんだい]の子孫[ししそん]にまで報[むく]いる者[もの]である。"
  10: "しかし、わたしを愛[あい]し、わたしの定[さだ]めを守[まも]る者[もの]には、千代[せんだい]に至[いた]るまで慈[いつく]しみを施[ほどこ]す。"
  11: "あなたは、あなたの神[かみ]である主[しゅ]の名[な]をいたずらに唱[とな]えてはならない。主[しゅ]は、ご自分[じぶん]の名[な]をいたずらに唱[とな]える者[もの]を罰[ばっ]せずにはおかれないからである。"
  12: "安息日[あんそくび]を守[まも]り、これを聖[せい]とせよ。あなたの神[かみ]である主[しゅ]があなたに命[めい]じたとおりである。"
  13: "六日[むいか]の間[あいだ]は働[はたら]き、あなたのすべての業[わざ]を行[おこな]え。"
  14: "しかし、第七[だいしち]の日[ひ]は、あなたの神[かみ]である主[しゅ]の安息日[あんそくび]である。あなたも、あなたの息子[むすこ]も娘[むすめ]も、男[おとこ]の奴隷[どれい]も女[おんな]の奴隷[どれい]も、あなたの牛[うし]も、荷[に]を負[お]う獣[けもの]も、あなたのすべての家畜[かちく]も、あなたの中[なか]に住[す]む寄留[きりゅう]の者[もの]も、その日[ひ]はいかなる業[わざ]も行[おこな]ってはならない。あなたの男[おとこ]の奴隷[どれい]と女[おんな]の奴隷[どれい]が、あなたと同じように休[やす]むためである。"
  15: "あなたは、エジプトの地[ち]で奴隷[どれい]であったことを覚[おぼ]えていなさい。あなたの神[かみ]である主[しゅ]は、強[つよ]い手[て]と高[たか]く上[あ]げた腕[うで]によって、あなたをそこから導[みちび]き出[だ]された。それゆえ、あなたの神[かみ]である主[しゅ]は、安息日[あんそくび]を守[まも]り、これを聖[せい]とするように、あなたに命[めい]じられたのである。"
  16: "あなたの父[ちち]と母[はは]を敬[うやま]え。あなたの神[かみ]である主[しゅ]があなたに命[めい]じたとおりである。そうすれば、あなたは幸[しあわ]せになり、あなたの神[かみ]である主[しゅ]があなたに与[あた]える地[ち]の上[うえ]で、長[なが]く生[い]きることができる。"
  17: "姦淫[かんいん]してはならない。"
  18: "人[ひと]を殺[ころ]してはならない。"
  19: "盗[ぬす]んではならない。"
  20: "あなたの隣人[となり]に反[はん]して、偽[いつわ]りの証[あかし]を立[た]ててはならない。"
  21: "あなたの隣人[となり]の妻[つま]を欲[ほ]しがってはならない。あなたの隣人[となり]の家[いえ]を欲[ほ]しがってはならない。その畑[はたけ]も、その男[おとこ]の奴隷[どれい]も、その女[おんな]の奴隷[どれい]も、その牛[うし]も、その荷[に]を負[お]う獣[けもの]も、そのすべての家畜[かちく]も、あなたの隣人[となり]に属[ぞく]するすべてのものも、欲[ほ]しがってはならない。』"
  22: "これらの言葉[ことば]を主[しゅ]は、山[やま]の上[うえ]で、火[ひ]の中[なか]から、暗[くら]やみ、濃[こ]い闇[やみ]、嵐[あらし]、大[おお]きな声[こえ]とともに、あなたがたの会衆[かいしゅう]全体[ぜんたい]に語[かた]られた。そして、それ以上[いじょう]は語[かた]られなかった。主[しゅ]はそれらを二[ふた]つの石[いし]の板[いた]に書[か]き、わたしに与[あた]えられた。"
  23: "あなたがたが火[ひ]の中[なか]から声[こえ]を聞[き]き、山[やま]が火[ひ]で燃[も]えているとき、あなたがたの部族[ぶぞく]の長[かしら]たちと長老[ちょうろう]たちはみな、わたしのところへ近[ちか]づいて来[き]た。"
  24: "そして、あなたがたは言[い]った。『見[み]よ、わたしたちの神[かみ]である主[しゅ]は、ご自分[じぶん]の栄光[えいこう]をわたしたちに示[しめ]された。わたしたちは火[ひ]の中[なか]からその声[こえ]を聞[き]いた。今日[きょう]、神[かみ]が人[ひと]と語[かた]り、その人[ひと]が生[い]きているのを、わたしたちは見[み]た。"
  25: "しかし今[いま]、わたしたちは死[し]ぬわけにはいかない。この大[おお]きな火[ひ]がわたしたちを焼[や]き尽[つ]くすからである。もしわたしたちが、わたしたちの神[かみ]である主[しゅ]の声[こえ]をさらに聞[き]こうものなら、わたしたちは死[し]んでしまう。"
  26: "なぜなら、生[い]ける神[かみ]が火[ひ]の中[なか]から語[かた]る声[こえ]を、わたしたちのように聞[き]いて、なお生[い]きている肉[にく]が、どこにあるだろうか。"
  27: "あなたが近[ちか]づいて、わたしたちの神[かみ]である主[しゅ]が言[い]われることをすべて聞[き]いてください。そして、わたしたちの神[かみ]である主[しゅ]があなたに語[かた]られることをすべて、わたしたちに語[かた]ってください。わたしたちは聞[き]き、行[おこな]います。』"
  28: "主[しゅ]は、あなたがたがわたしに語[かた]る声[こえ]を聞[き]かれた。そして、主[しゅ]はわたしに言[い]われた。『わたしはこの民[たみ]があなたに語[かた]った言葉[ことば]の声[こえ]を聞[き]いた。彼[かれ]らが語[かた]ったことは、すべて正[ただ]しい。"
  29: "だれが、彼[かれ]らの心[こころ]を、わたしを恐[おそ]れ、わたしの戒[いまし]めをすべていつまでも守[まも]るようなものにしてくれようか。そうすれば、彼[かれ]らとその子[こ]どもたちは永遠[えいえん]に幸[しあわ]せである。"
  30: "行[い]って、彼[かれ]らに「あなたがたは自分[じぶん]の家[いえ]へ戻[もど]りなさい」と言[い]いなさい。"
  31: "あなたはここに、わたしとともに立[た]っていなさい。わたしはあなたに、戒[いまし]めと定[さだ]めと裁[さば]きを語[かた]ろう。あなたが彼[かれ]らに教[おし]え、彼[かれ]らが、わたしが嗣業[しぎょう]として彼[かれ]らに与[あた]える地[ち]でそれを行[おこな]うためである。』"
  32: "あなたがたは、あなたがたの神[かみ]である主[しゅ]が命[めい]じられたとおりに守[まも]って行[おこな]わなければならない。右[みぎ]にも左[ひだり]にもそれてはならない。"
  33: "あなたがたの神[かみ]である主[しゅ]が、あなたがたに歩[あゆ]むように命[めい]じられたすべての道[みち]を歩[あゆ]みなさい。そうすれば、主[しゅ]はあなたがたを安[やす]らかにし、あなたがたは幸[しあわ]せになり、あなたがたが嗣業[しぎょう]として受[う]け継[つ]ぐ地[ち]で長[なが]く生[い]きることができる。」"

notes:
  1: "ἐκάλεσεν πάντα Ισραηλ — созвал весь Израиль (πᾶς без артикля: «весь»). τὰ δικαιώματα καὶ τὰ κρίματα — 定めと裁き (δικαίωμα «оправдание, установление», κρίμα «суд»). ἐν τοῖς ὠσὶν ὑμῶν — «в уши ваши» (евр. оборот; слав. «во ушы ваши»). μαθήσεσθε … φυλάξεσθε ποιεῖν — будущее в значении повеления; передано императивом."
  2: "κύριος ὁ θεὸς ὑμῶν — здесь мн. ч. «ваш» (в 5:6 и далее ед. ч.). διέθετο … διαθήκην — заключил завет (διατίθημι + διαθήκη; слав. «завеща завет»). Χωρηβ — Хорив."
  3: "οὐχὶ … ἀλλ᾿ ἤ — не…, а только. ὑμεῖς ὧδε πάντες ζῶντες σήμερον — вы, здесь все живые сегодня; LXX подчёркивает, что завет заключён с нынешним поколением, а не только с отцами."
  4: "πρόσωπον κατὰ πρόσωπον — лицом к лицу (букв. «лицо против лица»); та же формула в 34:10. ἐκ μέσου τοῦ πυρός — из среды огня."
  5: "κἀγὼ εἱστήκειν — и я стоял (pluperf. от ἵστημι). ἀνὰ μέσον — между. ἀναγγεῖλαι — возвестить. ὅτι ἐφοβήθητε ἀπὸ προσώπου τοῦ πυρός — ибо вы убоялись от лица огня. λέγων — «говоря»: вводит речь Бога, начинающуюся в ст. 6."
  6: "Ἐγὼ κύριος ὁ θεός σου — без εἰμί (в Исх 20:2 — ἐγώ εἰμι). ὁ ἐξαγαγών — «выведший» (аористное причастие). ἐξ οἴκου δουλείας — из дома рабства."
  7: "οὐκ ἔσονταί σοι θεοὶ ἕτεροι πρὸ προσώπου μου — да не будут тебе боги иные пред лицом Моим. В Исх 20:3 стоит πλὴν ἐμοῦ «кроме Меня»; здесь иное чтение, поэтому わたしの前に, а не «わたしのほかに»."
  8: "οὐ ποιήσεις σεαυτῷ εἴδωλον — не сделай себе идола. οὐδὲ παντὸς ὁμοίωμα — и никакого подобия; ὁμοίωμα «подобие, изображение». Три сферы: небо вверху, земля внизу, воды под землёй."
  9: "οὐδὲ μὴ λατρεύσῃς — усиленное отрицание (οὐ μή + аорист). θεὸς ζηλωτής — Бог ревнитель. ἀποδιδοὺς ἁμαρτίας πατέρων ἐπὶ τέκνα — воздающий грехи отцов детям (ἀποδίδωμι). ἐπὶ τρίτην καὶ τετάρτην γενεάν — до третьего и четвёртого рода."
  10: "ποιῶν ἔλεος εἰς χιλιάδας — творящий милость в тысячи (родов). τοῖς φυλάσσουσιν τὰ προστάγματά μου — хранящим повеления Мои (πρόσταγμα — 定め)."
  11: "οὐ λήμψῃ τὸ ὄνομα … ἐπὶ ματαίῳ — не возьмёшь имя Господа всуе (ἐπὶ ματαίῳ «на пустое», напрасно). οὐ γὰρ μὴ καθαρίσῃ — «не очистит», т. е. не оставит без наказания (двойное отрицание с μή; слав. «не очистит»)."
  12: "φύλαξαι — храни (imper. aor.). ἁγιάζειν αὐτήν — святить его (инфинитив цели). ὃν τρόπον ἐνετείλατό σοι — как заповедал тебе. В Исх 20:8 начало иное: μνήσθητι «помни»."
  13: "ἓξ ἡμέρας ἐργᾷ — шесть дней работай (ἐργάζομαι, будущее в значении повеления). ποιήσεις πάντα τὰ ἔργα σου — сделаешь все дела твои."
  14: "σάββατα κυρίῳ τῷ θεῷ σου — суббота Господу Богу твоему. ὁ παῖς / ἡ παιδίσκη — раб / рабыня. ὑποζύγιον — вьючное животное. ὁ προσήλυτος ὁ παροικῶν ἐν σοί — пришелец, живущий у тебя (寄留の者). ἵνα ἀναπαύσηται — чтобы отдохнул. В csl-ru в конце повторно добавлено «и осел твой»; в греч. осёл (ὑποζύγιον) назван раньше, в перечне имущества."
  15: "οἰκέτης — раб, домочадец. ἐν χειρὶ κραταιᾷ καὶ ἐν βραχίονι ὑψηλῷ — рукою крепкою и мышцею высокою (ср. 4:34; 7:8). συνέταξεν — повелел, установил."
  16: "τίμα — почитай (τιμάω). ἵνα εὖ σοι γένηται — чтобы благо тебе было. μακροχρόνιος γένῃ — долголетен будешь. LXX добавляет «как заповедал тебе Господь Бог твой» (в Исх 20:12 этого нет)."
  17: "οὐ μοιχεύσεις — не прелюбодействуй (μοιχεύω). В csl-ru и Синодальном этот номер стоит как «Не убий» (нумерация сдвинута); держимся греческого."
  18: "οὐ φονεύσεις — не убивай (φονεύω). В csl-ru и Синодальном — «Не прелюбодействуй»."
  19: "οὐ κλέψεις — не кради (κλέπτω)."
  20: "οὐ ψευδομαρτυρήσεις κατὰ τοῦ πλησίον σου μαρτυρίαν ψευδῆ — не засвидетельствуешь против ближнего твоего свидетельства ложного; повтор «ложное» сохранён, как в греческом."
  21: "οὐκ ἐπιθυμήσεις — не пожелай (ἐπιθυμέω). У LXX сначала жена, потом дом, затем поле, раб, рабыня, вол, осёл (ὑποζύγιον), скот и всё, что у ближнего. LXX повторяет ἐπιθυμήσεις дважды; в переводе повтор сохранён."
  22: "τὰ ῥήματα ταῦτα — эти слова. σκότος, γνόφος, θύελλα, φωνὴ μεγάλη — тьма, мрак, буря, глас великий (перечисление обстоятельств; в Синодальном сглажено). οὐ προσέθηκεν — «не приложил», более не говорил. ἐπὶ δύο πλάκας λιθίνας — на двух каменных скрижалях (πλάξ — 板)."
  23: "ὡς ἠκούσατε — когда вы услышали. τὸ ὄρος ἐκαίετο πυρί — гора горела огнём. οἱ ἡγούμενοι τῶν φυλῶν — начальники колен (ἡγούμενος «ведущий»). γερουσία — старейшины (長老たち)."
  24: "Ἰδοὺ ἔδειξεν — вот, показал. τὴν δόξαν αὐτοῦ — славу Свою (в Синодальном «славу Свою и величие Своё» — добавка). λαλήσει ὁ θεὸς πρὸς ἄνθρωπον, καὶ ζήσεται — Бог говорит с человеком, и он жив (ζήσεται будущее); в переводе «神が人と語り、その人が生きているのを…見た»."
  25: "μὴ ἀποθάνωμεν — «да не умрём» (гортатив); передано 死ぬわけにはいかない. ἐξαναλώσει — пожрёт, истребит. ἐὰν προσθώμεθα … ἀκοῦσαι — если ещё приложим услышать."
  26: "τίς γὰρ σάρξ — «какая плоть», т. е. кто из людей. θεοῦ ζῶντος — Бога живого. καὶ ζήσεται — и останется жив (вопрос относится ко всей фразе)."
  27: "πρόσελθε σύ — приступи ты. ἀκουσόμεθα καὶ ποιήσομεν — будем слушать и исполнять (порядок греческого сохранён)."
  28: "ἤκουσεν κύριος τὴν φωνὴν τῶν λόγων ὑμῶν — услышал Господь голос слов ваших. ὀρθῶς πάντα, ὅσα ἐλάλησαν — всё, что они говорили, правильно."
  29: "τίς δώσει — «кто даст», евр. оборот пожелания (слав. «кто даст»). ὥστε φοβεῖσθαί με — чтобы бояться Меня. δι᾿ αἰῶνος — вовеки."
  30: "βάδισον — иди (imper. от βαδίζω). Ἀποστράφητε — обратитесь, возвратитесь. εἰς τοὺς οἴκους ὑμῶν — в дома ваши (Синодальный «в шатры свои» — с евр.)."
  31: "αὐτοῦ στῆθι — здесь стань. ἐν κλήρῳ — в жребий, в удел (κλῆρος; передано 嗣業). ὅσα διδάξεις — которым научишь."
  32: "φυλάξεσθε ποιεῖν — храните исполнять. οὐκ ἐκκλινεῖτε — не уклонитесь. εἰς δεξιὰ οὐδὲ εἰς ἀριστερά — направо и налево."
  33: "κατὰ πᾶσαν τὴν ὁδόν — по всему пути. καταπαύσῃ σε — упокоит тебя (καταπαύω). μακροημερεύσητε — долгоденствовать будете. ἧς κληρονομήσετε — которую наследуете (嗣業として受け継ぐ)."
