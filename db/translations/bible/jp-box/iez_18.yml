verses:
  1: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]われた。"
  2: "「人[ひと]の子[こ]よ、イスラエルの子[こ]たちの間[あいだ]で、あなたがたがこのたとえを言[い]うのはなぜか。『父[ちち]たちが酸[す]いぶどうを食[た]べたので、子[こ]どもたちの歯[は]が浮[う]いた』と言[い]うのは。"
  3: "わたしは生[い]きている、と主[しゅ]なる神[かみ]は言[い]われる。もはやイスラエルの中[なか]で、このたとえが語[かた]られることはない。"
  4: "見[み]よ、すべての魂[たましい]はわたしのものである。父[ちち]の魂[たましい]も、子[こ]の魂[たましい]も、わたしのものである。罪[つみ]を犯[おか]す魂[たましい]は死[し]ぬ。酸[す]いぶどうを食[た]べた者[もの]の歯[は]も浮[う]く。"
  5: "人[ひと]が正[ただ]しく、裁[さば]きと正[ただ]しさを行[おこな]うなら、"
  6: "その人[ひと]は山[やま]の上[うえ]で食[た]べず、イスラエルの家[いえ]の偶像[ぐうぞう]に目[め]を上[あ]げず、隣人[りんじん]の妻[つま]を汚[けが]さず、月[げつ]経[けい]の不[ふ]浄[じょう]にある女[おんな]に近[ちか]づかない。"
  7: "だれかから力[ちから]ずくで奪[うば]わず、借[か]り手[て]には質[しち]を返[かえ]し、奪[うば]い取[と]らず、パンを飢[う]えた者[もの]に与[あた]え、裸[はだか]の者[もの]に衣[ころも]を着[き]せる。"
  8: "金[きん]を利息[りそく]につけて貸[か]さず、ましを取[と]らず、不法[ふほう]から手[て]を引[ひ]き、人[ひと]と人[ひと]の間[あいだ]に正[ただ]しい裁[さば]きを行[おこな]う。"
  9: "わたしの掟[おきて]に歩[あゆ]み、わたしの定[さだ]めを守[まも]って行[おこな]うなら、その人[ひと]は正[ただ]しい者[もの]である。その人[ひと]は必[かなら]ず生[い]きる、と主[しゅ]なる神[かみ]は言[い]われる。"
  10: "しかし、もし彼が子[こ]を生[う]み、その子[こ]が血[ち]を流[なが]す滅[ほろ]ぼす者[もの]となり、これらのことを行[おこな]うなら、"
  11: "その子[こ]が父[ちち]の道[みち]を歩[あゆ]まず、山[やま]の上[うえ]で食[た]べ、隣人[りんじん]の妻[つま]を汚[けが]し、"
  12: "貧[まず]しい者[もの]と乏[とぼ]しい者[もの]を虐[しいた]げ、奪[うば]い取[と]り、質[しち]を返[かえ]さず、偶像[ぐうぞう]に目[め]を上[あ]げて忌[い]まわしいことを行[おこな]い、"
  13: "利息[りそく]につけて貸[か]し、ましを取[と]るなら、その人[ひと]は生[い]きるだろうか。生[い]きはしない。これらの不法[ふほう]をすべて行[おこな]ったのだから、その人[ひと]は必[かなら]ず死[し]ぬ。その血[ち]はその人[ひと]にある。"
  14: "しかし、もし彼が子[こ]を生[う]み、その子[こ]が父[ちち]の行[おこな]ったすべての罪[つみ]を見[み]て、恐[おそ]れ、そのようには行[おこな]わないなら、"
  15: "山[やま]の上[うえ]で食[た]べず、イスラエルの家[いえ]の偶像[ぐうぞう]に目[め]を上[あ]げず、隣人[りんじん]の妻[つま]を汚[けが]さず、"
  16: "だれかから力[ちから]ずくで奪[うば]わず、質[しち]を取[と]らず、奪[うば]い取[と]らず、パンを飢[う]えた者[もの]に与[あた]え、裸[はだか]の者[もの]に衣[ころも]を着[き]せ、"
  17: "不法[ふほう]から手[て]を引[ひ]き、利息[りそく]もましも取[と]らず、わたしの掟[おきて]を行[おこな]い、わたしの定[さだ]めに歩[あゆ]むなら、その人[ひと]は父[ちち]の不法[ふほう]のゆえに死[し]なない。必[かなら]ず生[い]きる。"
  18: "しかし、その父[ちち]は、しいたげ、奪[うば]い取[と]り、わたしの民[たみ]の中[なか]で良[よ]くないことを行[おこな]ったので、見[み]よ、その人[ひと]は自分[じぶん]の不法[ふほう]のゆえに死[し]ぬ。"
  19: "あなたがたは言[い]う。『なぜ、子[こ]は父[ちち]の罪[つみ]を負[お]わないのか』と。子[こ]が正[ただ]しさとあわれみを行[おこな]い、わたしの掟[おきて]をすべて守[まも]って行[おこな]ったのだから、その子[こ]は必[かなら]ず生[い]きる。"
  20: "罪[つみ]を犯[おか]す魂[たましい]は死[し]ぬ。子[こ]は父[ちち]の罪[つみ]を負[お]わず、父[ちち]は子[こ]の罪[つみ]を負[お]わない。正[ただ]しい者[もの]の正[ただ]しさはその人[ひと]にあり、不法[ふほう]な者[もの]の不法[ふほう]はその人[ひと]にある。"
  21: "しかし、不法[ふほう]な者[もの]が、自分[じぶん]が行[おこな]ったすべての不法[ふほう]から離[はな]れ、わたしの戒[いまし]めをすべて守[まも]り、正[ただ]しさとあわれみを行[おこな]うなら、その人[ひと]は必[かなら]ず生[い]き、死[し]なない。"
  22: "その人[ひと]が行[おこな]ったすべての罪[つみ]は思[おも]い起[おこ]されない。その人[ひと]は自分[じぶん]の正[ただ]しさによって生[い]きる。"
  23: "わたしは不法[ふほう]な者[もの]の死[し]を喜[よろこ]ぶだろうか、と主[しゅ]なる神[かみ]は言[い]われる。むしろ、その人[ひと]がその悪[わる]い道[みち]から離[はな]れて生[い]きることを喜[よろこ]ぶのではないか。"
  24: "しかし、正[ただ]しい者[もの]がその正[ただ]しさから離[はな]れて不法[ふほう]を行[おこな]い、不法[ふほう]な者[もの]が行[おこな]うすべての不法[ふほう]に従[したが]って行[おこな]うなら、その人[ひと]の正[ただ]しさはすべて思[おも]い起[おこ]されず、その人[ひと]は自分[じぶん]の背[はい]信[しん]によって、自分[じぶん]が犯[おか]した罪[つみ]によって死[し]ぬ。"
  25: "しかし、あなたがたは言[い]う。『主[しゅ]の道[みち]は正[ただ]しくない』と。イスラエルの家[いえ]よ、聞[き]け。わたしの道[みち]が正[ただ]しくないのか。あなたがたの道[みち]こそ正[ただ]しくないのではないか。"
  26: "正[ただ]しい者[もの]がその正[ただ]しさから離[はな]れて不法[ふほう]を行[おこな]い、そのゆえに死[し]ぬなら、その人[ひと]は自分[じぶん]が行[おこな]った不法[ふほう]のゆえに死[し]ぬのである。"
  27: "しかし、不法[ふほう]な者[もの]が自分[じぶん]が行[おこな]った不法[ふほう]から離[はな]れ、裁[さば]きと正[ただ]しさを行[おこな]うなら、その人[ひと]は自分[じぶん]の魂[たましい]を生[い]かしたのである。"
  28: "その人[ひと]は見[み]て、自分[じぶん]が行[おこな]ったすべての不敬[ふけい]から離[はな]れたから、必[かなら]ず生[い]き、死[し]なない。"
  29: "しかし、イスラエルの家[いえ]は言[い]う。『主[しゅ]の道[みち]は正[ただ]しくない』と。イスラエルの家[いえ]よ、わたしの道[みち]が正[ただ]しくないのか。あなたがたの道[みち]こそ正[ただ]しくないのではないか。"
  30: "それゆえ、イスラエルの家[いえ]よ、わたしはあなたがたを、それぞれ自分[じぶん]の道[みち]に従[したが]って裁[さば]く、と主[しゅ]なる神[かみ]は言[い]われる。悔[く]い改[あらた]めて、自分[じぶん]のすべての不敬[ふけい]から離[はな]れよ。そうすれば、不法[ふほう]があなたがたの罰[ばつ]となることはない。"
  31: "あなたがたは、自分[じぶん]がわたしに対して犯[おか]したすべての不敬[ふけい]を自分[じぶん]から投[な]げ捨[す]て、新[あたら]しい心[こころ]と新[あたら]しい霊[れい]を自分[じぶん]のために造[つく]れ。わたしの戒[いまし]めをすべて行[おこな]え。イスラエルの家[いえ]よ、なぜ、あなたがたは死[し]ぬのか。"
  32: "わたしは死[し]ぬ者[もの]の死[し]を望[のぞ]まない、と主[しゅ]なる神[かみ]は言[い]われる。悔[く]い改[あらた]めて、生[い]きよ」。"

notes:
  1: "Καὶ ἐγένετο λόγος κυρίου πρός με λέγων — формула начала речи."
  2: "τί ὑμῖν ἡ παραβολὴ αὕτη ἐν τοῖς υἱοῖς Ισραηλ — «что вам притча сия у сынов Израиля»; Οἱ πατέρες ἔφαγον ὄμφακα — «отцы ели незрелый (кислый) виноград» (ὄμφαξ); οἱ ὀδόντες τῶν τέκνων ἐγομφίασαν — «у детей зубы заоскоминились» (γομφιάζω — сводить зубы); csl «зубом чад их оскомины быша». Поговорка — 『…』."
  3: "ζῶ ἐγώ, λέγει κύριος — клятва «живу Я»; ἐὰν γένηται ἔτι λεγομένη ἡ παραβολὴ αὕτη — «если будет ещё говориться притча сия» (клятвенное εἰ μή с опущенным наказанием = «не будет»)."
  4: "πᾶσαι αἱ ψυχαὶ ἐμαί εἰσιν — «все души Мои»; ὃν τρόπον ἡ ψυχὴ τοῦ πατρός, οὕτως καὶ ἡ ψυχὴ τοῦ υἱοῦ — «как душа отца, так и душа сына» (ψυχή — 魂); ἡ ψυχὴ ἡ ἁμαρτάνουσα, αὕτη ἀποθανεῖται — «душа согрешающая, та умрёт»: главный стих главы. csl добавляет «и зобавшаго пародки зубы оскоминны будут» — нет в LXX, внесено."
  5: "ὁ ποιῶν κρίμα καὶ δικαιοσύνην — «творящий суд и правду» (κρίμα, δικαιοσύνη): формула праведника, ср. 18:8, 19."
  6: "ἐπὶ τῶν ὀρέων οὐ φάγεται — «на горах не ест» (трапезы идолам); τοὺς ὀφθαλμοὺς αὐτοῦ οὐ μὴ ἐπάρῃ πρὸς τὰ ἐνθυμήματα οἴκου Ισραηλ — «очей не воздвигнет к помыслам (идолам) дома Израиля» (ἐπαίρω, ἐνθύμημα); τὴν γυναῖκα τοῦ πλησίον αὐτοῦ οὐ μὴ μιάνῃ — «жены ближнего не осквернит» (μιαίνω); πρὸς γυναῖκα ἐν ἀφέδρῳ οὖσαν οὐ προσεγγιεῖ — «к жене в месячном очищении не приблизится» (ἄφεδρος, 月経の不浄)."
  7: "ἄνθρωπον οὐ μὴ καταδυναστεύσῃ — «человека не притеснит» (καταδυναστεύω); ἐνεχυρασμὸν ὀφείλοντος ἀποδώσει — «залог должника возвратит» (ἐνεχυρασμός — залог, ὀφείλων — должник); ἅρπαγμα οὐχ ἁρπᾶται — «хищением не восхитит» (cognatus); τὸν ἄρτον αὐτοῦ τῷ πεινῶντι δώσει — «хлеб свой голодному даст»."
  8: "ἐπὶ τόκῳ οὐ δώσει — «в рост (под процент) не даст» (τόκος — рост, 利息); πλεονασμὸν οὐ λήμψεται — «прибытка (лихвы) не возьмёт» (πλεονασμός, まし); ἐξ ἀδικίας ἀποστρέψει τὴν χεῖρα αὐτοῦ — «от неправды отвратит руку свою»; κρίμα δίκαιον ποιήσει — «суд праведный сотворит»."
  9: "τοῖς προστάγμασίν μου πεπόρευται — «по заповедям (уставам) Моим ходил» (πρόσταγμα, 掟); τὰ δικαιώματά μου πεφύλακται — «определения Мои сохранил» (δικαίωμα, 定め); ζωῇ ζήσεται — «жизнью жить будет» (cognatus accusativus), 必ず生きる."
  10: "ἐὰν γεννήσῃ υἱὸν λοιμόν — «если родит сына губителя» (λοιμός — язва, губитель; в ru «разбойник»); ἐκχέοντα αἷμα — «проливающего кровь»; ποιοῦντα ἁμαρτήματα — «делающего грехи»."
  11: "ἐν τῇ ὁδῷ τοῦ πατρὸς αὐτοῦ τοῦ δικαίου οὐκ ἐπορεύθη — «путём отца своего праведного не пошёл»; ἀλλὰ καὶ ἐπὶ τῶν ὀρέων ἔφαγεν — «но и на горах ел» (καί усиливает); τὴν γυναῖκα τοῦ πλησίου αὐτοῦ ἐμίανεν."
  12: "πτωχὸν καὶ πένητα κατεδυνάστευσεν — «бедного и нищего притеснил» (πτωχός, πένης); ἅρπαγμα ἥρπασεν — «хищением восхитил»; ἐνεχυρασμὸν οὐκ ἀπέδωκεν — «залога не отдал»; εἰς τὰ εἴδωλα ἔθετο τοὺς ὀφθαλμοὺς αὐτοῦ — «к идолам положил очи свои»; ἀνομίαν πεποίηκεν."
  13: "μετὰ τόκου ἔδωκε καὶ πλεονασμὸν ἔλαβεν — «с ростом дал и прибыток взял»; οὗτος ζωῇ οὐ ζήσεται — «он жизнью не будет жить» (усиленное отрицание); θανάτῳ θανατωθήσεται — «смертью умрёт» (cognatus); τὸ αἷμα αὐτοῦ ἐπ᾽ αὐτὸν ἔσται — «кровь его на нём будет»."
  14: "ἐὰν δὲ γεννήσῃ υἱόν, καὶ ἴδῃ πάσας τὰς ἁμαρτίας τοῦ πατρὸς αὐτοῦ — «если же родит сына, и увидит все грехи отца своего»; καὶ φοβηθῇ καὶ μὴ ποιήσῃ κατὰ ταύτας — «и убоится и не сделает по ним»."
  15: "ἐπὶ τῶν ὀρέων οὐ βέβρωκεν — «на горах не ел» (βιβρώσκω); τοὺς ὀφθαλμοὺς αὐτοῦ οὐκ ἔθετο εἰς τὰ ἐνθυμήματα οἴκου Ισραηλ — «очей своих не положил на помыслы дома Израиля»."
  16: "ἄνθρωπον οὐ κατεδυνάστευσεν — «человека не притеснил»; ἐνεχυρασμὸν οὐκ ἐνεχύρασεν — «залога не взял в залог» (cognatus); ἅρπαγμα οὐχ ἥρπασεν — «хищения не восхитил»; τὸν ἄρτον αὐτοῦ τῷ πεινῶντι ἔδωκεν."
  17: "ἀπ᾽ ἀδικίας ἀπέστρεψε τὴν χεῖρα αὐτοῦ — «от неправды отвратил руку свою»; τόκον οὐδὲ πλεονασμὸν οὐκ ἔλαβεν — «роста и прибытка не взял»; οὐ τελευτήσει ἐν ἀδικίαις πατρὸς αὐτοῦ — «не умрёт в неправдах отца своего» (τελευτάω); ζωῇ ζήσεται."
  18: "ὁ δὲ πατὴρ αὐτοῦ ἐὰν θλίψει θλίψῃ — «отец же его, если притеснением притеснит» (θλίβω, cognatus); ἁρπάσῃ ἅρπαγμα — «восхитит хищение»; ἐναντία ἐποίησεν ἐν μέσῳ τοῦ λαοῦ μου — «противное сделал среди народа Моего»; ἀποθανεῖται ἐν τῇ ἀδικίᾳ αὐτοῦ."
  19: "καὶ ἐρεῖτε Τί ὅτι οὐκ ἔλαβεν τὴν ἀδικίαν ὁ υἱὸς τοῦ πατρὸς αὐτοῦ; — «и скажете: почему не принял неправды (вины) сын отца своего?» (ἀδικία — неправда, вина); ὅτι ὁ υἱὸς δικαιοσύνην καὶ ἔλεος ἐποίησεν — «ибо сын правду и милость сотворил» (ἔλεος — あわれみ). Возражение народа — 『…』."
  20: "ἡ ψυχὴ ἡ ἁμαρτάνουσα ἀποθανεῖται — «душа согрешающая умрёт» (повтор 18:4); ὁ υἱὸς οὐ λήμψεται τὴν ἀδικίαν τοῦ πατρός — «сын не примет неправды отца»; δικαιοσύνη δικαίου ἐπ᾽ αὐτὸν ἔσται — «правда праведного на нём будет»."
  21: "ὁ ἄνομος ἐὰν ἀποστρέψῃ ἐκ πασῶν τῶν ἀνομιῶν αὐτοῦ — «беззаконник, если обратится от всех беззаконий своих» (ἀποστρέφω — обращать); φυλάξηται πάσας τὰς ἐντολάς μου — «сохранит все заповеди Мои» (ἐντολή); ζωῇ ζήσεται, οὐ μὴ ἀποθάνῃ."
  22: "πάντα τὰ παραπτώματα αὐτοῦ… οὐ μνησθήσεται — «все преступления его… не вспомнятся» (παράπτωμα — преступление, падение); ἐν τῇ δικαιοσύνῃ αὐτοῦ, ᾗ ἐποίησεν, ζήσεται — «в правде своей, которую сотворил, жив будет»."
  23: "μὴ θελήσει θελήσω τὸν θάνατον τοῦ ἀνόμου — «разве хотением восхочу смерти беззаконника» (cognatus); ὡς τὸ ἀποστρέψαι αὐτὸν… καὶ ζῆν αὐτόν — «как не (того, чтобы) обратился он… и жил»: риторический вопрос с отрицанием."
  24: "ἐν δὲ τῷ ἀποστρέψαι δίκαιον ἐκ τῆς δικαιοσύνης αὐτοῦ — «когда отвратится праведник от правды своей»; πᾶσαι αἱ δικαιοσύναι αὐτοῦ… οὐ μὴ μνησθῶσιν — «все правды его… не вспомнятся»; ἐν τῷ παραπτώματι αὐτοῦ, ᾧ παρέπεσεν — «в преступлении его, которым преступил» (παραπίπτω); ἐν ταῖς ἁμαρτίαις αὐτοῦ… ἀποθανεῖται."
  25: "Οὐ κατευθύνει ἡ ὁδὸς κυρίου — «неправ (не направляется прямо) путь Господень» (κατευθύνω); μὴ ἡ ὁδός μου οὐ κατευθύνει; — «Мой ли путь не прям?» (двойное отрицание); οὐχὶ ἡ ὁδὸς ὑμῶν οὐ κατευθύνει; — «не ваши ли пути не прямы?». Возражение — 『…』."
  26: "ἐν τῷ ἀποστρέψαι τὸν δίκαιον ἐκ τῆς δικαιοσύνης αὐτοῦ καὶ ποιήσῃ παράπτωμα — «когда праведник отвратится от правды своей и сделает преступление»; ἐν τῷ παραπτώματι, ᾧ ἐποίησεν, ἐν αὐτῷ ἀποθανεῖται."
  27: "ἐν τῷ ἀποστρέψαι ἄνομον ἀπὸ τῆς ἀνομίας αὐτοῦ — «когда беззаконник обратится от беззакония своего»; ποιήσῃ κρίμα καὶ δικαιοσύνην — «сотворит суд и правду»; οὗτος τὴν ψυχὴν αὐτοῦ ἐφύλαξεν — «он душу свою сохранил» (φυλάσσω)."
  28: "ἀπέστρεψεν ἐκ πασῶν τῶν ἀσεβειῶν αὐτοῦ — «отвратился от всех нечестий своих» (ἀσέβεια); csl добавляет «виде» («и виде и обратися») — нет в LXX, внесено (見て); ζωῇ ζήσεται, οὐ μὴ ἀποθάνῃ."
  29: "Οὐ κατορθοῖ ἡ ὁδὸς κυρίου — «неправ (не выправляется) путь Господень» (κατορθόω, синоним κατευθύνω в 25); μὴ ἡ ὁδός μου οὐ κατορθοῖ, οἶκος Ισραηλ; — «Мой ли путь не прям, дом Израилев?». Возражение — 『…』."
  30: "ἕκαστον κατὰ τὴν ὁδὸν αὐτοῦ κρινῶ ὑμᾶς — «каждого по пути его буду судить вас»; ἐπιστράφητε καὶ ἀποστρέψατε ἐκ πασῶν τῶν ἀσεβειῶν ὑμῶν — «обратитесь и отвратитесь от всех нечестий ваших»; οὐκ ἔσονται ὑμῖν εἰς κόλασιν ἀδικίας — «не будут вам в наказание (мучение) неправды» (κόλασις — наказание), 罰."
  31: "ἀπορρίψατε ἀπὸ ἑαυτῶν πάσας τὰς ἀσεβείας ὑμῶν — «отвергните от себя все нечестия ваши» (ἀπορρίπτω); ποιήσατε ἑαυτοῖς καρδίαν καινὴν καὶ πνεῦμα καινόν — «сотворите себе сердце новое и дух новый»; ἵνα τί ἀποθνῄσκετε, οἶκος Ισραηλ; — «зачем вы умираете, дом Израилев?». csl добавляет «и сотворите вся заповеди моя» — нет в LXX, внесено."
  32: "οὐ θέλω τὸν θάνατον τοῦ ἀποθνῄσκοντος — «не хочу смерти умирающего» (θάνατος, ἀποθνῄσκω); csl добавляет «но еже обратитися ему… обратитеся убо, и живи будете» — нет в LXX, внесено; здесь речь Господа закрывается."