# jp-box, Иезекииль, глава 18. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава тоже 18. Стихов 32,
# деление совпадает.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: 1–4 притча «отцы ели кислый виноград» и её отмена; 5–9 праведник и его
# жизнь; 10–13 сын-беззаконник и смерть; 14–18 сын, видящий грехи отца, и жизнь;
# 19–20 «душа согрешающая умрёт» — каждый отвечает за своё; 21–23 обращение беззаконника
# и жизнь; 24 падение праведника и смерть; 25–29 спор о путях Господних; 30–32 призыв
# к обращению и «новое сердце и новый дух».
# Речь: 18:1 — вне кавычек; 18:2–32 — одна непрерывная речь Господа в 「…».
# Внутри: 18:2 — народная поговорка в 『…』; 18:19, 25, 29 — возражения народа в 『…』.
# 〔…〕 нет, сносок нет; кавычки сбалансированы.
# Паритет: 18:4 csl добавляет «и зобавшаго пародки зубы оскоминны будут» (нет в LXX),
# не внесено; 18:10 LXX «λοιμός» (губитель), ru «разбойник»; 18:17 csl «в заповедех
# моих ходити будет»; 18:28 csl добавляет «виде» (нет в LXX); 18:31 csl добавляет
# «и сотворите вся заповеди моя» — нет в LXX, внесено; 18:32 csl добавляет «но еже
# обратитися ему… обратитеся убо, и живи будете» — нет в LXX, внесено.

