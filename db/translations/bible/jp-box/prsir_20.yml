# jp-box, Сирах, глава 20. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для книги нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 20: 1–3 обличение и молчание; 4–8 о молчании и многословии; 9–17 о даянии
# и дарах; 18–26 о языке, лжи и лукавстве; 27–31 о мудрости и её сокрытии.
# Прямая речь: 20:16 — слова глупого в 「…」 (вводка «глупый говорит»); 17 — уже
# авторский текст («едящие хлеб его», 3-е лицо). 20:21 — слова слуги в 「…」
# (речь внутри авторского текста); больше прямой речи нет. Красного и синего нет.
# Нумерация по gr: 31 стих. Слав. 20 — 31 стих, но csl 20:1 вбирает gr 2–3
# (стиха gr 1 в слав. нет), а csl 20:2–3 передают чтение полного текста (20:3:
# «Как хорошо обличённому показать покаяние; он избежит вольного греха»), которого
# в LXX-модуле нет; оно внесено в наш ст. 3 без 〔…〕 по паритету. Держимся gr.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).

