verses:
  1: "見苦[みぐる]しい叱責[しっせき]がある。また、黙[だま]っている者[もの]がいて、その者こそ思慮[しりょ]深[ぶか]い。"
  2: "叱[しか]ることは、怒[いか]ることに比[くら]べて何[なん]と良[よ]いことか。"
  3: "自分[じぶん]の過[あやま]ちを告白[こくはく]する者[もの]は守[まも]られる。叱[しか]られた者が悔[く]い改[あらた]めを示[しめ]すのは良[よ]いことだ。そうすれば、その人[ひと]は進[すす]んで犯[おか]す罪[つみ]を免[まぬか]れる。"
  4: "宦官[かんがん]が若[わか]い女[おんな]を処女[しょじょ]でなくしたいと願[ねが]うようなもの、それと同じように、無理[むり]に裁[さば]きをする者[もの]がある。"
  5: "黙[だま]っているゆえに知恵[ちえ]ある者[もの]と認[みと]められる者[もの]があり、多[おお]くしゃべるゆえに憎[にく]まれる者[もの]がある。"
  6: "答[こた]えを持[も]たないので黙[だま]っている者[もの]があり、時[とき]を知[し]って黙っている者[もの]がいる。"
  7: "知恵[ちえ]ある人[ひと]は時[とき]まで黙[だま]る。しかし、大言[たいげん]を吐[は]く愚[おろ]かな者[もの]は時[とき]を過[す]ぎ越[こ]す。"
  8: "言葉[ことば]を多[おお]くする者[もの]は忌[い]み嫌[きら]われ、権力[けんりょく]をほしいままにする者[もの]は憎[にく]まれる。"
  9: "悪[あく]のうちにある人[ひと]の繁栄[はんえい]があり、滅[ほろ]びに至[いた]る得[え]たものがある。"
  10: "あなたの益[やく]にならない贈[おく]り物[もの]があり、二倍[にばい]の返[かえ]しがある贈[おく]り物[もの]がある。"
  11: "名誉[めいよ]のために身[み]を低[ひく]くする者[もの]があり、低[ひく]さから頭[あたま]を上[あ]げる者[もの]がいる。"
  12: "少[すこ]しのもので多[おお]くを買[か]いながら、それを七倍[ななばい]にして払[はら]う者[もの]がいる。"
  13: "言葉[ことば]に知恵[ちえ]のある者[もの]は自分[じぶん]を愛[あい]される者とする。しかし、愚[おろ]かな者[もの]の恵[めぐ]みは注[そそ]ぎ出[だ]されて失[うしな]われる。"
  14: "愚[おろ]かな者[もの]の贈[おく]り物[もの]はあなたの益[やく]にならない。彼[かれ]の目[め]はひとつの代[か]わりに多[おお]くあるからである。"
  15: "少[すこ]し与[あた]えて多[おお]く責[せ]め、布告者[ふこくしゃ]のように口[くち]を開[ひら]く。今日[きょう]貸[か]して明日[あす]には返[かえ]しを求[もと]める。そのような人[ひと]は憎[にく]まれる。"
  16: "愚[おろ]かな者[もの]は言[い]う。「わたしには友[とも]がいない。わたしの善[よ]いことに対する感謝[かんしゃ]もない」。"
  17: "彼[かれ]のパンを食[た]べる者[もの]たちは舌[した]が悪[わる]い。何度[なんど]、どれほど多[おお]くの者[もの]が彼[かれ]をあざ笑[わら]うことか。"
  18: "地[ち]から滑[すべ]ることは舌[した]から滑ることにまさる。そのように、悪[あく]な者[もの]の倒[たお]れは急[きゅう]に来[く]る。"
  19: "恵[めぐ]みを知[し]らない人[ひと]は、時[とき]ならぬ話[はなし]である。それは無[む]教[きょう]養[よう]な者[もの]の口[くち]のうちに絶[た]えずある。"
  20: "愚[おろ]かな者[もの]の口[くち]からは格言[かくげん]が拒[こば]まれる。彼[かれ]はそれを時[とき]にかなって語[かた]らないからである。"
  21: "乏[とぼ]しさのゆえに罪[つみ]を犯[おか]すことを妨[さまた]げられている者[もの]があり、その安[やす]らぎのうちで心[こころ]を刺[さ]されない。"
  22: "恥[はじ]のゆえに自分[じぶん]の魂[たましい]を滅[ほろ]ぼす者[もの]があり、愚[おろ]かな者[もの]の顔[かお]をはばかってそれを滅ぼす。"
  23: "恥[はじ]のゆえに友[とも]に約束[やくそく]し、無償[むしょう]でその友を敵[てき]にしてしまう者[もの]がある。"
  24: "人[ひと]のうちの悪[あく]い汚[けが]れは偽[いつわ]りである。それは無[む]教[きょう]養[よう]な者[もの]の口[くち]のうちに絶[た]えずある。"
  25: "盗人[ぬすびと]は絶[た]えず偽[いつわ]りを言[い]う者[もの]よりもましである。しかし、両方[りょうほう]とも滅[ほろ]びを嗣業[しぎょう]として受[う]け継[つ]ぐ。"
  26: "偽[いつわ]りの人[ひと]の習[なら]わしは不名誉[ふめいよ]であり、その恥[はじ]は絶[た]えずその人とともにある。"
  27: "言葉[ことば]に知恵[ちえ]のある者[もの]は自[みずか]らを進[すす]める。思慮[しりょ]深[ぶか]い人[ひと]は高官[こうかん]たちの心[こころ]を満[み]たす。"
  28: "地[ち]を耕[たがや]す者[もの]は自分[じぶん]の麦束[むぎたば]の山[やま]を高[たか]くする。高官[こうかん]たちの心[こころ]を満[み]たす者[もの]は、不正[ふせい]のゆえに宥[ゆる]しを受[う]ける。"
  29: "贈[おく]り物[もの]と賜[たま]り物[もの]は知恵[ちえ]ある者[もの]の目[め]をくらませ、口[くち]のくつわのように叱責[しっせき]を遠[とお]ざける。"
  30: "隠[かく]された知恵[ちえ]と見[み]えない宝[たから]、その両方[りょうほう]に何[なん]の益[やく]があるだろうか。"
  31: "自分[じぶん]の愚[おろ]かさを隠[かく]す人[ひと]は、自分の知恵[ちえ]を隠す人よりも優[すぐ]れている。"

notes:
  1: "Ἔστιν ἔλεγχος ὃς οὐκ ἔστιν ὡραῖος — «есть обличение, которое не прекрасно» (ὡραῖος — прекрасный, благовременный); ἔστιν σιωπῶν καὶ αὐτὸς φρόνιμος — «есть молчащий — и он разумен» (φρόνιμος — благоразумный). Слав. 20:1 начинается с гр 20:2, стиха gr 1 в слав. нет."
  2: "ὡς καλὸν ἐλέγξαι ἢ θυμοῦσθαι — «как хорошо обличить, нежели гневаться» (ἐλέγχω — обличать). Слав. 20:1 вбирает этот стих вместе с началом ст. 3; держимся gr."
  3: "ὁ ἀνθομολογούμενος ἀπὸ ἐλαττώσεως κωλυθήσεται — «исповедующийся от умаления будет удержан (сохранён)» (ἀνθομολογέομαι — исповедовать, благодарить; ἐλάττωσις — умаление). Слав. 20:2–3 добавляют чтение полного текста: «как хорошо обличённому явить покаяние: он избежит вольного греха»; в LXX-модуле его нет, внесено без 〔…〕."
  4: "ἐπιθυμία εὐνούχου ἀποπαρθενῶσαι νεάνιδα — «пожелание евнуха растлить девицу» (εὐνοῦχος — евнух; ἀποπαρθενόω — лишать девства); ὁ ποιῶν ἐν βίᾳ κρίματα — «творящий суды с насилием» (βία — сила, насилие). Слав. «Желание скопчо»."
  5: "ἔστιν σιωπῶν εὑρισκόμενος σοφός — «есть молчащий, оказывающийся мудрым»; μισητὸς ἀπὸ πολλῆς λαλιᾶς — «ненавидим за многую болтливость» (λαλιά — болтовня). Слав. 20:5."
  6: "ἔστιν σιωπῶν, οὐ γὰρ ἔχει ἀπόκρισιν — «есть молчащий, ибо не имеет ответа» (ἀπόκρισις — ответ); σιωπῶν εἰδὼς καιρόν — «молчащий, знающий время». Слав. 20:6."
  7: "ἄνθρωπος σοφὸς σιγήσει ἕως καιροῦ — «человек мудрый будет молчать до времени» (σιγάω — молчать); ὁ λαπιστὴς καὶ ἄφρων ὑπερβήσεται καιρόν — «дерзкий (болтливый) и глупый преступит время» (λαπιστής — болтун, дерзкий). Слав. «продерзый»."
  8: "ὁ πλεονάζων λόγῳ βδελυχθήσεται — «умножающий слова будет мерзок» (πλεονάζω — умножать); ὁ ἐνεξουσιαζόμενος μισηθήσεται — «присваивающий себе власть будет ненавидим» (ἐνεξουσιάζομαι — самовластвовать). Слав. «восхищаяй власть»."
  9: "ἔστιν εὐοδία ἐν κακοῖς ἀνδρί — «есть успех в злом человеку» (εὐοδία — благополучие, удача); ἔστιν εὕρεμα εἰς ἐλάττωσιν — «есть находка на умаление (в убыток)» (εὕρεμα — находка). Слав. «благопоспешство во злых»."
  10: "ἔστιν δόσις, ἣ οὐ λυσιτελήσει σοι — «есть даяние, которое не принесёт тебе пользы» (λυσιτελέω — быть полезным); ἧς τὸ ἀνταπόδομα διπλοῦν — «у которого воздаяние двойное» (ἀνταπόδομα). Слав. «даяние, егоже отдание сугубо»."
  11: "ἔστιν ἐλάττωσις ἕνεκεν δόξης — «есть умаление ради славы»; ὃς ἀπὸ ταπεινώσεως ἦρεν κεφαλήν — «кто от унижения поднял голову» (ταπείνωσις — унижение). Слав. 20:11."
  12: "ἀγοράζων πολλὰ ὀλίγου — «покупающий много за малое» (ἀγοράζω — покупать); ἀποτιννύων αὐτὰ ἑπταπλάσιον — «возвращающий за них всемеро» (ἑπταπλάσιος — семикратный). Слав. «купуяй многая малым»."
  13: "ὁ σοφὸς ἐν λόγοις ἑαυτὸν προσφιλῆ ποιήσει — «мудрый в словах сделает себя любезным» (προσφιλής — приятный, любезный); χάριτες δὲ μωρῶν ἐκχυθήσονται — «а милости (прелести) глупых изольются (расточатся)» (χάρις). Слав. «благодати же безумных излиются»."
  14: "δόσις ἄφρονος οὐ λυσιτελήσει σοι — «даяние глупого не принесёт тебе пользы»; οἱ ὀφθαλμοὶ αὐτοῦ ἀνθ᾿ ἑνὸς πολλοί — «глаза его вместо одного — многие», т. е. он всё высматривает для себя. Слав. «очи бо его вместо единаго мнози»."
  15: "ὀλίγα δώσει καὶ πολλὰ ὀνειδίσει — «мало даст и много укорит»; ἀνοίξει τὸ στόμα αὐτοῦ ὡς κῆρυξ — «откроет уста свои, как глашатай» (κῆρυξ — вестник, глашатай); σήμερον δανιεῖ καὶ αὔριον ἀπαιτήσει — «сегодня даст в долг, а завтра потребует» (δανίζω — давать в долг). Слав. 20:15."
  16: "μωρὸς ἐρεῖ Οὐχ ὑπάρχει μοι φίλος — «глупый скажет: нет у меня друга»; οὐκ ἔστιν χάρις τοῖς ἀγαθοῖς μου — «нет благодарности моим добрым делам». Речь глупого — 「…」, закрывается в конце стиха. Слав. относит сюда же «ядущии хлеб мой льстиви языком»; в греч. это третье лицо (αὐτοῦ) и начало ст. 17, поэтому оставлено авторским текстом."
  17: "οἱ ἔσθοντες τὸν ἄρτον αὐτοῦ φαῦλοι γλώσσῃ — «едящие хлеб его злы языком» (φαῦλος — дурной); ποσάκις καὶ ὅσοι καταγελάσονται αὐτοῦ — «как часто и сколько будет смеяться над ним» (καταγελάω — осмеивать). По греч. «его хлеб» (αὐτοῦ) — третье лицо, поэтому весь стих авторский, вне кавычек. Слав. 20:17."
  18: "Ὀλίσθημα ἀπὸ ἐδάφους μᾶλλον ἢ ἀπὸ γλώσσης — «преткновение от земли (пола) лучше, чем от языка» (ὀλίσθημα — скольжение, падение); πτῶσις κακῶν κατὰ σπουδὴν ἥξει — «падение злых скоро придёт» (σπουδή — усердие, скорость). Слав. «Поползновение на земли»."
  19: "ἄνθρωπος ἄχαρις, μῦθος ἄκαιρος — «человек неблагодатный — басня (россказнь) неблаговременная» (ἄχαρις — неприятный, неблагодарный; μῦθος — басня); ἐν στόματι ἀπαιδεύτων ἐνδελεχισθήσεται — «в устах невоспитанных будет постоянно» (ἐνδελεχίζω — пребывать). Слав. «Человек безблагодатен баснь безвременна»."
  20: "ἀπὸ στόματος μωροῦ ἀποδοκιμασθήσεται παραβολή — «из уст глупого отвергается притча» (ἀποδοκιμάζω — отвергать; παραβολή — притча); οὐ γὰρ μὴ εἴπῃ αὐτὴν ἐν καιρῷ αὐτῆς — «ибо не скажет её в её время». Слав. 20:20."
  21: "Ἔστιν κωλυόμενος ἁμαρτάνειν ἀπὸ ἐνδείας — «есть удерживаемый от греха от скудости» (ἐνδεία — недостаток); ἐν τῇ ἀναπαύσει αὐτοῦ οὐ κατανυγήσεται — «в покое своём не умилится (не сокрушится)» (κατανύσσομαι — сокрушаться, быть уязвлённым совестью). Слав. «возбраняемый согрешати от скудости»."
  22: "ἔστιν ἀπολλύων τὴν ψυχὴν αὐτοῦ δι᾿ αἰσχύνην — «есть губящий душу свою из-за стыда» (αἰσχύνη — стыд); ἀπὸ ἄφρονος προσώπου ἀπολεῖ αὐτήν — «из-за лица (лицеприятия) глупого погубит её». Слав. 20:22."
  23: "ἔστιν χάριν αἰσχύνης ἐπαγγελλόμενος φίλῳ — «есть из-за стыда обещающий другу» (ἐπαγγέλλομαι — обещать); ἐκτήσατο αὐτὸν ἐχθρὸν δωρεάν — «приобрёл его врагом без причины» (δωρεάν — даром). Слав. «приобрете его врага туне»."
  24: "Μῶμος πονηρὸς ἐν ἀνθρώπῳ ψεῦδος — «злой порок в человеке — ложь» (μῶμος — порок, пятно); ἐν στόματι ἀπαιδεύτων ἐνδελεχισθήσεται — «в устах невоспитанных пребудет постоянно». Слав. 20:24."
  25: "αἱρετὸν κλέπτης ἢ ὁ ἐνδελεχίζων ψεύδει — «предпочтителен вор, чем постоянно лгущий» (αἱρετός — предпочтительный); ἀμφότεροι δὲ ἀπώλειαν κληρονομήσουσιν — «но оба наследуют погибель» (ἀπώλεια). Слав. «Уне есть тать»."
  26: "ἦθος ἀνθρώπου ψευδοῦς ἀτιμία — «нрав человека лживого — бесчестие» (ἦθος — нрав, обычай; ἀτιμία — бесчестие); ἡ αἰσχύνη αὐτοῦ μετ᾿ αὐτοῦ ἐνδελεχῶς — «и стыд его с ним постоянно». Слав. 20:26."
  27: "Ὁ σοφὸς ἐν λόγοις προάξει ἑαυτόν — «мудрый в словах выдвинет себя» (προάγω — выдвигать вперёд); ἄνθρωπος φρόνιμος ἀρέσει μεγιστᾶσιν — «разумный человек угодит вельможам» (μεγιστάν — вельможа). Слав. 20:27."
  28: "ὁ ἐργαζόμενος γῆν ἀνυψώσει θιμωνιὰν αὐτοῦ — «возделывающий землю возвысит скирду (стог) свою» (θιμωνιά — скирда); ὁ ἀρέσκων μεγιστᾶσιν ἐξιλάσεται ἀδικίαν — «угождающий вельможам умилостивит (покроет) неправду». Слав. 20:28."
  29: "ξένια καὶ δῶρα ἀποτυφλοῖ ὀφθαλμοὺς σοφῶν — «угощения и дары ослепляют глаза мудрых» (ξένια — дары странноприимства; ἀποτυφλόω — ослеплять); ὡς φιμὸς ἐν στόματι ἀποτρέπει ἐλεγμούς — «как узда в устах, отвращает обличения» (φιμός — намордник, узда). Слав. «Мзда и дарове»."
  30: "σοφία κεκρυμμένη καὶ θησαυρὸς ἀφανής — «премудрость сокрытая и сокровище неявленное» (ἀφανής — невидимый); τίς ὠφέλεια ἐν ἀμφοτέροις — «какая польза в обоих» (ὠφέλεια). Слав. 20:30."
  31: "κρείσσων ἄνθρωπος ἀποκρύπτων τὴν μωρίαν αὐτοῦ — «лучше человек, скрывающий глупость свою» (μωρία — глупость); ἢ ἄνθρωπος ἀποκρύπτων τὴν σοφίαν αὐτοῦ — «чем человек, скрывающий мудрость свою». Слав. 20:31."
