# Содержание: 1–9 продолжение слова к священникам (с 1:6): заповедь, проклятие
# благословениям, отнятое плечо и требуха праздников; завет с Левием — жизнь и мир,
# закон истины, «уста священника хранят знание»; вы уклонились и растлили завет.
# 10–16 измена брату и жене юности: один Отец и один Бог, мерзость в Израиле,
# «Господь был свидетелем между тобою и женою юности твоей», «берегите дух ваш».
