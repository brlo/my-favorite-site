verses:
  1: "「今[いま]、祭司[さいし]たちよ、この戒[いまし]めはあなたがたに臨[のぞ]む。"
  2: "もしあなたがたが聞[き]き従[したが]わず、心[こころ]に留[と]めてわたしの名[な]に栄光[えいこう]を帰[かえ]さないなら、わたしはあなたがたの上[うえ]に呪[のろ]いを送[おく]り、あなたがたの祝福[しゅくふく]を呪[のろ]って、それを呪[のろ]い、あなたがたの祝福[しゅくふく]を壊[こわ]す。それはあなたがたのうちに残[のこ]らない。あなたがたが心[こころ]に留[と]めないからである。"
  3: "見[み]よ、わたしはあなたがたから肩[かた]を取[と]り去[さ]り、あなたがたの祭[まつ]りの腸[はらわた]をあなたがたの顔[かお]にまき散[ち]らす。そして、あなたがたを一緒[いっしょ]に取[と]り去[さ]る。"
  4: "あなたがたは、わたしがこの戒[いまし]めをあなたがたに送[おく]り、レビとのわたしの契約[けいやく]を保[たも]たせようとしていることを知[し]る、と万軍[ばんぐん]の主[しゅ]は言[い]われる。"
  5: "わたしの契約[けいやく]は彼[かれ]と共[とも]にあり、いのちと平和[へいわ]の契約[けいやく]であった。わたしは彼に恐[おそ]れを与[あた]え、わたしを恐[おそ]れさせ、わたしの名[な]の前[まえ]でかしこませた。"
  6: "真実[しんじつ]の律法[りっぽう]が彼[かれ]の口[くち]にあり、彼[かれ]のくちびるに不[ふ]正[せい]は見[み]つからなかった。彼は平和[へいわ]と正[ただ]しさのうちをわたしと共[とも]に歩[あゆ]み、多[おお]くの人[ひと]を不[ふ]正[せい]から離[はな]れさせた。"
  7: "祭司[さいし]のくちびるは知識[ちしき]を守[まも]り、人[ひと]々[びと]は彼[かれ]の口[くち]から律法[りっぽう]を求[もと]める。彼は万軍[ばんぐん]の主[しゅ]の使[つか]いだからである。"
  8: "しかし、あなたがたは道[みち]から外[はず]れ、多[おお]くの人[ひと]を律法[りっぽう]のうちでつまずかせ、レビとの契約[けいやく]を破[やぶ]った、と万軍[ばんぐん]の主[しゅ]は言[い]われる。"
  9: "それゆえ、わたしもあなたがたを、すべての民[たみ]の前[まえ]で卑[いや]しめ、辱[はずかし]めた。あなたがたがわたしの道[みち]を守[まも]らず、律法[りっぽう]において人[ひと]の顔色[かおいろ]をうかがったからである」。"
  10: "「あなたがたはみな、ひとりの父[ちち]を持[も]つのではないか。ひとりの神[かみ]があなたがたを造[つく]ったのではないか。なぜ、あなたがたはそれぞれ兄弟[きょうだい]を捨[す]てて、父[ちち]たちの契約[けいやく]を汚[けが]すのか。"
  11: "ユダは捨[す]てられ、イスラエルとエルサレムのうちに忌[い]まわしいことが起[お]こった。ユダは主[しゅ]の聖[せい]なるもの、すなわち主[しゅ]が愛[あい]されたものを汚[けが]し、異[い]なる神[かみ]々[がみ]のもとへ行[い]ったからである。"
  12: "主[しゅ]はこのようなことを行[おこな]う者[もの]を、ヤコブの天幕[てんまく]から、また万軍[ばんぐん]の主[しゅ]に犠牲[ぎせい]をささげる者[もの]たちの間[あいだ]から、その者[もの]がへりくだるまで断[た]ち滅[ほろ]ぼされる。"
  13: "また、あなたがたは、わたしが憎[にく]んだことを行[おこな]っている。あなたがたは涙[なみだ]と泣[な]き声[ごえ]と、苦[くる]しみによるうめきで、主[しゅ]の祭壇[さいだん]を覆[おお]っている。それでも、そのささげ物[もの]に目[め]を留[と]め、あなたがたの手[て]から喜[よろこ]んで受[う]け入[い]れることは、まだふさわしいことか。"
  14: "あなたがたは言[い]う。『なぜか』と。主[しゅ]があなたと、あなたの若[わか]いときの妻[つま]との間[あいだ]の証人[しょうにん]となられたからである。あなたはその妻[つま]を捨[す]てた。彼女[かのじょ]はあなたの伴侶[はんりょ]、あなたの契約[けいやく]の妻[つま]であるのに。"
  15: "神[かみ]は良[よ]いことをされたのではないか。神[かみ]には霊[れい]の残[のこ]りがあった。あなたがたは言[い]う。『神[かみ]は子孫[しそん]のほかに何[なに]を求[もと]められるのか』と。あなたがたは霊[れい]において身[み]を慎[つつし]み、あなたの若[わか]いときの妻[つま]を捨[す]ててはならない。"
  16: "もしあなたが彼女[かのじょ]を憎[にく]んで離縁[りえん]するなら、と主[しゅ]イスラエルの神[かみ]は言[い]われる。不法[ふほう]があなたの思[おも]いを覆[おお]う、と万軍[ばんぐん]の主[しゅ]は言[い]われる。あなたがたは霊[れい]において身[み]を慎[つつし]み、彼女[かのじょ]を捨[す]ててはならない」。"
  17: "「あなたがたは言葉[ことば]によって神[かみ]を怒[いか]らせている。あなたがたは言[い]う。『どのようにして、わたしたちは彼を怒[いか]らせたのか』と。あなたがたが『悪[わる]いことを行[おこな]う者[もの]はすべて主[しゅ]の前[まえ]で良[よ]い者[もの]であり、主[しゅ]は彼らを喜[よろこ]ばれる』と言[い]い、また『裁[さば]きの神[かみ]はどこにいるのか』と言[い]うからである」。"

notes:
  1: "Καὶ νῦν ἡ ἐντολὴ αὕτη πρὸς ὑμᾶς, οἱ ἱερεῖς — «и ныне заповедь эта к вам, священники». Продолжение слова 1:6–14; из-за границы глав цитата открыта заново (для парности кавычек в главе)."
  2: "ἐὰν μὴ ἀκούσητε, καὶ ἐὰν μὴ θῆσθε εἰς τὴν καρδίαν ὑμῶν — «если не услышите и если не положите на сердца ваши»; τοῦ δοῦναι δόξαν τῷ ὀνόματί μου — «чтобы дать славу имени Моему»; ἐξαποστελῶ ἐφ᾽ ὑμᾶς τὴν κατάραν — «пошлю на вас проклятие»; ἐπικαταράσομαι τὴν εὐλογίαν ὑμῶν — «прокляну благословение ваше»; διασκεδάσω — «рассею» (слав. «разорю»); διασκεδάσω τὴν εὐλογίαν ὑμῶν, καὶ οὐκ ἔσται ἐν ὑμῖν — «рассею (разорю) благословение ваше, и не будет его в вас»; οὐ τίθεσθε εἰς τὴν καρδίαν ὑμῶν — «вы не полагаете на сердца ваши»."
  3: "ἀφορίζω ὑμῖν τὸν ὦμον — «отделяю (отнимаю) вам плечо» (ὦμος — плечо; слав. «рамо»); σκορπιῶ ἤνυστρον ἐπὶ τὰ πρόσωπα ὑμῶν — «разбросаю требуху (внутренности) на лица ваши» (ἤνυστρον — внутренности, требуха; слав. «требухи»); ἤνυστρον ἑορτῶν ὑμῶν — «требуху праздников ваших»; λήμψομαι ὑμᾶς εἰς τὸ αὐτό — «возьму вас вместе». В ru/МТ «помет» — иное чтение; в тексте csl."
  4: "ἐπιγνώσεσθε διότι ἐγὼ ἐξαπέσταλκα πρὸς ὑμᾶς τὴν ἐντολὴν ταύτην — «узнаете, что Я послал к вам заповедь эту»; τοῦ εἶναι τὴν διαθήκην μου πρὸς τοὺς Λευίτας — «чтобы был завет Мой с левитами». Слав. «еже быти завету моему к левитом»."
  5: "ἡ διαθήκη μου ἦν μετ᾽ αὐτοῦ τῆς ζωῆς καὶ τῆς εἰρήνης — «завет Мой был с ним жизни и мира»; ἔδωκα αὐτῷ ἐν φόβῳ φοβεῖσθαί με — «Я дал ему в страхе бояться Меня» (внутренний объект: страх); ἀπὸ προσώπου ὀνόματός μου στέλλεσθαι αὐτόν — «и от лица имени Моего благоговеть ему» (στέλλομαι — уклоняться, благоговеть; слав. «устрашатися»)."
  6: "νόμος ἀληθείας ἦν ἐν τῷ στόματι αὐτοῦ — «закон истины был в устах его»; ἀδικία οὐχ εὑρέθη ἐν χείλεσιν αὐτοῦ — «неправда не нашлась в устах его»; ἐν εἰρήνῃ κατευθύνων ἐπορεύθη μετ᾽ ἐμοῦ — «в мире направляя (ходя право), пошёл со Мною» (κατευθύνω — направлять); πολλοὺς ἐπέστρεψεν ἀπὸ ἀδικίας — «многих обратил от неправды»."
  7: "χείλη ἱερέως φυλάξεται γνῶσιν — «уста священника сохранят знание» (φυλάσσω — хранить); νόμον ἐκζητήσουσιν ἐκ στόματος αὐτοῦ — «закона будут искать из уст его» (ἐκζητέω — искать, взыскивать); ἄγγελος κυρίου παντοκράτορός ἐστιν — «он вестник Господа Вседержителя» (в тексте 使[つか]い)."
  8: "ἐξεκλίνατε ἐκ τῆς ὁδοῦ — «вы уклонились от пути» (ἐκκλίνω); πολλοὺς ἠσθενήσατε ἐν νόμῳ — «многих ослабили в законе» (ἀσθενέω — быть слабым, соблазнять); διεφθείρατε τὴν διαθήκην τοῦ Λευι — «растлили завет Левия» (διαφθείρω — портить, разрушать)."
  9: "κἀγὼ δέδωκα ὑμᾶς ἐξουδενωμένους καὶ παρειμένους εἰς πάντα τὰ ἔθνη — «и Я сделал вас униженными и отверженными во всех народах» (ἐξουδενόω — уничижать; παρίημι — оставлять, отвергать); οὐκ ἐφυλάξασθε τὰς ὁδούς μου — «вы не сохранили путей Моих»; ἐλαμβάνετε πρόσωπα ἐν νόμῳ — «принимали лица (лицеприятствовали) в законе». Здесь слово 2:1–9 закрывается."
  10: "Οὐχὶ θεὸς εἷς ἔκτισεν ὑμᾶς — «не один ли Бог сотворил вас»; οὐχὶ πατὴρ εἷς πάντων ὑμῶν — «не один ли Отец у всех вас»; τί ὅτι ἐγκατελίπετε ἕκαστος τὸν ἀδελφὸν αὐτοῦ — «что же вы оставили каждый брата своего» (ἐγκαταλείπω — оставлять, покидать); τοῦ βεβηλῶσαι τὴν διαθήκην τῶν πατέρων ὑμῶν — «чтобы осквернить завет отцов ваших»."
  11: "ἐγκατελείφθη Ιουδας — «оставлен Иуда» (слав. «оставлен бысть иуда»); βδέλυγμα ἐγένετο ἐν τῷ Ισραηλ καὶ ἐν Ιερουσαλημ — «мерзость стала в Израиле и в Иерусалиме» (βδέλυγμα — мерзость); ἐβεβήλωσεν Ιουδας τὰ ἅγια κυρίου, ἐν οἷς ἠγάπησεν — «осквернил Иуда святыни Господни, которые возлюбил»; ἐπετήδευσεν εἰς θεοὺς ἀλλοτρίους — «устремился к чужим богам» (ἐπιτηδεύω — заниматься, стремиться)."
  12: "ἐξολεθρεύσει κύριος τὸν ἄνθρωπον τὸν ποιοῦντα ταῦτα — «истребит Господь человека, делающего это» (ἐξολεθρεύω); ἕως καὶ ταπεινωθῇ — «доколе и смирится»; ἐκ σκηνωμάτων Ιακωβ — «из селений (шатров) Иакова»; ἐκ προσαγόντων θυσίαν τῷ κυρίῳ παντοκράτορι — «из приносящих жертву Господу Вседержителю». Место тёмное; в ru/МТ «бдящего на страже и отвечающего» — иное чтение, в текст не внесено."
  13: "καὶ ταῦτα, ἃ ἐμίσουν, ἐποιεῖτε — «и это, что Я ненавидел, вы делали»; ἐκαλύπτετε δάκρυσιν τὸ θυσιαστήριον κυρίου — «вы покрывали слезами жертвенник Господень»; ἔτι ἄξιον ἐπιβλέψαι εἰς θυσίαν — «ещё ли достойно призреть на жертву»; λαβεῖν δεκτὸν ἐκ τῶν χειρῶν ὑμῶν — «принять благосклонно из рук ваших». Слав. содержит в скобках «(вашу)» — редакционная вставка, не перенесена."
  14: "κύριος διεμαρτύρατο ἀνὰ μέσον σοῦ καὶ ἀνὰ μέσον γυναικὸς νεότητός σου — «Господь был свидетелем между тобою и между женою юности твоей» (διαμαρτύρομαι — свидетельствовать); ἣν ἐγκατέλιπες — «которую ты оставил»; αὐτὴ κοινωνός σου καὶ γυνὴ διαθήκης σου — «она сообщница твоя и жена завета твоего» (κοινωνός — участница, спутница; в тексте 伴[とも]う者[もの])."
  15: "καὶ οὐκ ἄλλος ἐποίησεν, καὶ ὑπόλειμμα πνεύματος αὐτοῦ — «и не другой ли сделал, и остаток духа у Него» (ὑπόλειμμα — остаток); Τί ἄλλο ἀλλ᾽ ἢ σπέρμα ζητεῖ ὁ θεός — «чего иного, кроме семени, ищет Бог»; φυλάξασθε ἐν τῷ πνεύματι ὑμῶν — «сохраните в духе вашем»; γυναῖκα νεότητός σου μὴ ἐγκαταλίπῃς — «жены юности твоей не оставляй». Слав. «не добро ли сотвори» — иное чтение, чем LXX «οὐκ ἄλλος ἐποίησεν»; в тексте csl («良[よ]いことをされたのではないか»). Подлежащее — Бог (в контексте стиха), поэтому в тексте 神[かみ]."
  16: "ἀλλὰ ἐὰν μισήσας ἐξαποστείλῃς — «но если, возненавидев, отпустишь её» (ἐξαποστέλλω — отпускать, разводиться); λέγει κύριος ὁ θεὸς τοῦ Ισραηλ — «говорит Господь Бог Израилев»; καλύψει ἀσέβεια ἐπὶ τὰ ἐνθυμήματά σου — «покроет нечестие помышления твои» (ἐνθύμημα — помышление); φυλάξασθε ἐν τῷ πνεύματι ὑμῶν καὶ οὐ μὴ ἐγκαταλίπητε — «сохраните в духе вашем и не оставляйте». Здесь слово 2:10–16 закрывается."
  17: "Οἱ παροξύνοντες τὸν θεὸν ἐν τοῖς λόγοις ὑμῶν — «прогневляющие Бога словами вашими» (παροξύνω — раздражать, возбуждать); Πᾶς ποιῶν πονηρόν, καλὸν ἐνώπιον κυρίου — «всякий, делающий злое, хорош пред Господом»; ἐν αὐτοῖς αὐτὸς εὐδόκησεν — «и к ним Он благоволил» (εὐδοκέω); Ποῦ ἐστιν ὁ θεὸς τῆς δικαιοσύνης — «где Бог правды». Слова народа — 『…』. Слово закрывается в стихе; в 3:1 начинается новое."
