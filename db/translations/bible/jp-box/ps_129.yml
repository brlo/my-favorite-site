# jp-box, Псалтирь, псалом 129. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация — славяно-синодальная (csl-ru): в слав. надписание отдельным стихом
# не стоит, поэтому наш стих 0 (надписание) влит в начало стиха 1; дальше номера 1..6.
# Разбивка — славяно-синодальная (csl-ru): слав. 1 = гр. 1 + первая половина
# гр. 2, слав. 2 = вторая половина гр. 2, слав. 3 = гр. 3+4, слав. 4 = гр. 5,
# слав. 5 = гр. 6 (граница внутри гр. 6 иная: по-японски «主を待ち望む» не
# оторвать от «朝の見張りから夜まで»), слав. 6 = гр. 7+8; см. notes 1–6.
# Псалом 129: из глубины взываю (1–2), никто не устоит пред судом и прощение (3),
# ожидание Господа как стражи утра (4–5), у Господа избавление (6).
# Красного и синего нет. Кавычек нет: в псалме нет прямой речи.
# 〔…〕 нет: перевод сделан по gr-lxx-byz, добавлений Церкви не вносилось.
# セラ (διάψαλμα) в этой главе нет.
# Сносок ⟨…⟩ нет: 深み, 見張り, 贖い уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: ps
chapter: 129
draft: true

verses:
  1: "登[とう]上[じょう]の歌[うた]。主[しゅ]よ、わたしは深[ふか]みからあなたに呼[よ]び求[もと]めた。主[しゅ]よ、わたしの声[こえ]を聞[き]いてください。"
  2: "あなたの耳[みみ]を、わたしの願[ねが]いの声[こえ]に傾[かたむ]けてください。"
  3: "主[しゅ]よ、もしあなたが不法[ふほう]を見張[みは]っておられるなら、主[しゅ]よ、だれが立[た]ち得[え]るだろうか。あなたには赦[ゆる]しがあるからである。"
  4: "わたしはあなたの律法[りっぽう]のゆえに、主[しゅ]よ、あなたを待[ま]ち望[のぞ]んだ。わたしの魂[たましい]はあなたの言葉[ことば]を待[ま]ち望[のぞ]む。"
  5: "わたしの魂[たましい]は、朝[あさ]の見張[みは]りから夜[よる]まで、主[しゅ]を待[ま]ち望[のぞ]む。イスラエルは、朝[あさ]の見張[みは]りから、主[しゅ]を待[ま]ち望[のぞ]むように。"
  6: "主[しゅ]のもとにはあわれみがあり、豊[ゆた]かな贖[あがな]いがあるからである。主[しゅ]はイスラエルを、そのすべての不法[ふほう]から贖[あがな]い出[だ]される。"

notes:
  1: "Ὠιδὴ τῶν ἀναβαθμῶν — 登[とう]上[じょう]の歌. В gr-lxx-byz и ру-базе надписание — стих 0; в csl-ru отдельного стиха нет — влито в ст. 1. Ἐκ βαθέων ἐκέκραξά σε, κύριε — 主よ、わたしは深みからあなたに呼び求めた (βαθέα мн. — «глубины», образ бездны; κράζω — «взывать», как 119:1). Обращение κύριε стоит в конце греч. фразы; по-японски оно вынесено вперёд, как требует звательное. κύριε, εἰσάκουσον τῆς φωνῆς μου — 主よ、わたしの声を聞いてください (εἰσακούω + gen. — «услышать»). Слав. ст. 1 = гр. 1 + первая половина гр. 2."
  2: "Слав. ст. 2 — вторая половина гр. 2. γενηθήτω τὰ ὦτά σου προσέχοντα — あなたの耳を…傾けてください (букв. «да будут уши Твои внимающими»; προσέχω — «внимать, склоняться»). εἰς τὴν φωνὴν τῆς δεήσεώς μου — わたしの願いの声に (δέησις — «прошение, мольба»; повтор φωνή сохранён повтором 声)."
  3: "ἐὰν ἀνομίας παρατηρήσῃ, κύριε — 主よ、もしあなたが不法を見張っておられるなら (παρατηρέω — «наблюдать, подстерегать»; ἀνομία — 不法; ἐάν + аорист — условие). κύριε, τίς ὑποστήσεται; — 主よ、だれが立ち得るだろうか (ὑφίστημι — «выстоять, устоять»; риторический вопрос сохранён). Двойное κύριε в греч. сохранено двумя 主よ. ὅτι παρὰ σοὶ ὁ ἱλασμός ἐστιν — あなたには赦しがあるからである (ἱλασμός — «умилостивление, очищение», передано 赦し, как в церковном чтении «яко у Тебе очищение есть»). В базе стих состоит только из этой фразы; продолжение («чтобы благоговели пред Тобою») здесь уже начало ст. 4, поэтому не добавлено. Слав. ст. 3 = гр. 3+4 (в слав. слиты); слав. ст. 4 = гр. 5."
  4: "ἕνεκεν τοῦ νόμου σου ὑπέμεινά σε, κύριε — わたしはあなたの律法のゆえに、主よ、あなたを待ち望んだ (ἕνεκεν — «ради»; ὑπομένω — «ожидать с терпением, переносить»; νόμος — 律法). ὑπέμεινεν ἡ ψυχή μου εἰς τὸν λόγον σου — わたしの魂はあなたの言葉を待ち望む (повтор ὑπομένω сохранён повтором 待ち望む; λόγος — 言葉). Слав. деление: гр. 5 = слав. 4."
  5: "ἤλπισεν ἡ ψυχή μου ἐπὶ τὸν κύριον — わたしの魂は…主を待ち望む (ἐλπίζω ἐπί — «надеяться на»). ἀπὸ φυλακῆς πρωίας μέχρι νυκτός — 朝の見張りから夜まで (φυλακή — «стража, ночная стража»; πρωία — «утро»). ἀπὸ φυλακῆς πρωίας ἐλπισάτω Ισραηλ ἐπὶ τὸν κύριον — イスラエルは、朝の見張りから、主を待ち望むように (повтор «от стражи утренней» сохранён, как в греч.; ἐλπισάτω — императив 3 л., отсюда ように). Слав. деление: гр. 6 = слав. 5 (ср. notes 4)."
  6: "ὅτι παρὰ τῷ κυρίῳ τὸ ἔλεος — 主のもとにはあわれみがあり (ἔλεος — あわれみ, как по всему корпусу). καὶ πολλὴ παρ' αὐτῷ λύτρωσις — 豊かな贖いがある (λύτρωσις — «избавление, выкуп»; πολλή — «многая», отсюда 豊かな). καὶ αὐτὸς λυτρώσεται τὸν Ισραηλ — 主はイスラエルを…贖い出される (λυτρόω — 贖う; αὐτός — «Он Сам», подчёркнуто). ἐκ πασῶν τῶν ἀνομιῶν αὐτοῦ — そのすべての不法から (ἀνομία, как в ст. 3; πᾶς — «все»). Слав. ст. 6 = гр. 7+8 (в слав. слиты)."
