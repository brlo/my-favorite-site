verses:
  0: "登[とう]上[じょう]の歌[うた]。"
  1: "主[しゅ]よ、わたしは深[ふか]みからあなたに呼[よ]び求[もと]めた。"
  2: "主[しゅ]よ、わたしの声[こえ]を聞[き]いてください。あなたの耳[みみ]を、わたしの願[ねが]いの声[こえ]に傾[かたむ]けてください。"
  3: "主[しゅ]よ、もしあなたが不法[ふほう]を見張[みは]っておられるなら、主[しゅ]よ、だれが立[た]ち得[え]るだろうか。"
  4: "あなたには赦[ゆる]しがあるからである。"
  5: "わたしはあなたの律法[りっぽう]のゆえに、主[しゅ]よ、あなたを待[ま]ち望[のぞ]んだ。わたしの魂[たましい]はあなたの言葉[ことば]を待[ま]ち望[のぞ]む。"
  6: "わたしの魂[たましい]は、朝[あさ]の見張[みは]りから夜[よる]まで、主[しゅ]を待[ま]ち望[のぞ]む。イスラエルは、朝[あさ]の見張[みは]りから、主[しゅ]を待[ま]ち望[のぞ]むように。"
  7: "主[しゅ]のもとにはあわれみがあり、豊[ゆた]かな贖[あがな]いがあるからである。"
  8: "主[しゅ]はイスラエルを、そのすべての不法[ふほう]から贖[あがな]い出[だ]される。"

notes:
  0: "Ὠιδὴ τῶν ἀναβαθμῶν — 登[とう]上[じょう]の歌. Стих 0; совпадает в gr-lxx-byz и в ru-базе."
  1: "Ἐκ βαθέων ἐκέκραξά σε, κύριε — 主よ、わたしは深みからあなたに呼び求めた (βαθέα мн. — «глубины», образ бездны; κράζω — «взывать», как 119:1). Обращение κύριε стоит в конце греч. фразы; по-японски оно вынесено вперёд, как требует звательное."
  2: "κύριε, εἰσάκουσον τῆς φωνῆς μου — 主よ、わたしの声を聞いてください (εἰσακούω + gen. — «услышать»). γενηθήτω τὰ ὦτά σου προσέχοντα — あなたの耳を…傾けてください (букв. «да будут уши Твои внимающими»; προσέχω — «внимать, склоняться»). εἰς τὴν φωνὴν τῆς δεήσεώς μου — わたしの願いの声に (δέησις — «прошение, мольба»; повтор φωνή сохранён повтором 声)."
  3: "ἐὰν ἀνομίας παρατηρήσῃ, κύριε — 主よ、もしあなたが不法を見張っておられるなら (παρατηρέω — «наблюдать, подстерегать»; ἀνομία — 不法; ἐάν + аорист — условие). κύριε, τίς ὑποστήσεται; — 主よ、だれが立ち得るだろうか (ὑφίστημι — «выстоять, устоять»; риторический вопрос сохранён). Двойное κύριε в греч. сохранено двумя 主よ."
  4: "ὅτι παρὰ σοὶ ὁ ἱλασμός ἐστιν — あなたには赦しがあるからである (ἱλασμός — «умилостивление, очищение», передано 赦し, как в церковном чтении «яко у Тебе очищение есть»). В базе стих состоит только из этой фразы; продолжение («чтобы благоговели пред Тобою») здесь уже начало ст. 5, поэтому не добавлено."
  5: "ἕνεκεν τοῦ νόμου σου ὑπέμεινά σε, κύριε — わたしはあなたの律法のゆえに、主よ、あなたを待ち望んだ (ἕνεκεν — «ради»; ὑπομένω — «ожидать с терпением, переносить»; νόμος — 律法). ὑπέμεινεν ἡ ψυχή μου εἰς τὸν λόγον σου — わたしの魂はあなたの言葉を待ち望む (повтор ὑπομένω сохранён повтором 待ち望む; λόγος — 言葉)."
  6: "ἤλπισεν ἡ ψυχή μου ἐπὶ τὸν κύριον — わたしの魂は…主を待ち望む (ἐλπίζω ἐπί — «надеяться на»). ἀπὸ φυλακῆς πρωίας μέχρι νυκτός — 朝の見張りから夜まで (φυλακή — «стража, ночная стража»; πρωία — «утро»). ἀπὸ φυλακῆς πρωίας ἐλπισάτω Ισραηλ ἐπὶ τὸν κύριον — イスラエルは、朝の見張りから、主を待ち望むように (повтор «от стражи утренней» сохранён, как в греч.; ἐλπισάτω — императив 3 л., отсюда ように)."
  7: "ὅτι παρὰ τῷ κυρίῳ τὸ ἔλεος — 主のもとにはあわれみがあり (ἔλεος — あわれみ, как по всему корпусу). καὶ πολλὴ παρ' αὐτῷ λύτρωσις — 豊かな贖いがある (λύτρωσις — «избавление, выкуп»; πολλή — «многая», отсюда 豊かな)."
  8: "καὶ αὐτὸς λυτρώσεται τὸν Ισραηλ — 主はイスラエルを…贖い出される (λυτρόω — 贖う; αὐτός — «Он Сам», подчёркнуто). ἐκ πασῶν τῶν ἀνομιῶν αὐτοῦ — そのすべての不法から (ἀνομία, как в ст. 3; πᾶς — «все»)."
