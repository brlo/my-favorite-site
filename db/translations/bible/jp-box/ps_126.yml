verses:
  0: "登[とう]上[じょう]の歌[うた]。ソロモンのもの。"
  1: "主[しゅ]が家[いえ]を建[た]てなければ、建[た]てる者[もの]たちの労苦[ろうく]はむなしい。主[しゅ]が町[まち]を守[まも]らなければ、見張[みは]る者[もの]の警戒[けいかい]はむなしい。"
  2: "あなたがたが朝早[あさはや]く起[お]き、夜[よる]遅[おそ]くまで起[お]きて、苦[くる]しみのパンを食[た]べるのは、むなしい。主[しゅ]は愛[あい]する者[もの]たちに眠[ねむ]りを与[あた]えられる。"
  3: "見[み]よ、子[こ]どもは主[しゅ]から与[あた]えられた受[う]け継[つ]ぎ、胎[たい]の実[み]は報[むく]いである。"
  4: "若[わか]い日[ひ]に生[う]まれた子[こ]どもは、力[ちから]ある者[もの]の手[て]にある矢[や]のようである。"
  5: "これらの子[こ]どもで自分[じぶん]の矢筒[やづつ]を満[み]たす人[ひと]は幸[さいわ]いである。その人[ひと]は、門[もん]のところで敵[てき]と語[かた]るとき、辱[はずかし]められない。"

notes:
  0: "Ὠιδὴ τῶν ἀναβαθμῶν· τῷ Σαλωμων — 登[とう]上[じょう]の歌、ソロモンのもの (τῷ Σαλωμων — датив принадлежности; в ru-базе «Песнь восхождения. Соломона»). Стих 0; в надписании стоит имя, как в базе."
  1: "Ἐὰν μὴ κύριος οἰκοδομήσῃ οἶκον — 主が家を建てなければ (οἰκοδομέω — «строить»; οἶκος — 家, может значить и дом, и род). εἰς μάτην ἐκοπίασαν οἱ οἰκοδομοῦντες αὐτόν — 建てる者たちの労苦はむなしい (εἰς μάτην — «напрасно»; κοπιάω — «трудиться до усталости»). ἐὰν μὴ κύριος φυλάξῃ πόλιν — 主が町を守らなければ (φυλάσσω — 守る). εἰς μάτην ἠγρύπνησεν ὁ φυλάσσων — 見張る者の警戒はむなしい (ἀγρυπνέω — «бодрствовать, не спать»; ὁ φυλάσσων — «страж»). Двойной εἰς μάτην и двойное οἰκοδομέω/φυλάσσω сохранены повторами."
  2: "εἰς μάτην ὑμῖν ἐστιν τοῦ ὀρθρίζειν — あなたがたが朝早く起き…のは、むなしい (ὀρθρίζω — «вставать на рассвете»; один εἰς μάτην относится ко всем инфинитивам, поэтому むなしい стоит в конце периода). ἐγείρεσθαι μετὰ τὸ καθῆσθαι — 夜遅くまで起きて (букв. «вставать после сидения» — евр. идиома «сидеть допоздна»; передано по смыслу, как jp-joc «遲く寢ね»). οἱ ἔσθοντες ἄρτον ὀδύνης — 苦しみのパンを食べる (ἄρτος ὀδύνης — «хлеб скорби», т. е. добытый тяжким трудом; ср. Быт 3:17). ὅταν δῷ τοῖς ἀγαπητοῖς αὐτοῦ ὕπνον — 主は愛する者たちに眠りを与えられる (δίδωμι — «давать»; подлежащее — Бог, в греч. не названо; ср. 120:3, где так же поставлено 主)."
  3: "ἰδοὺ ἡ κληρονομία κυρίου υἱοί — 見よ、子どもは主から与えられた受け継ぎ (κληρονομία — «наследие»; υἱοί — «сыны», передано 子ども, потому что дальше речь о детях вообще). ὁ μισθὸς τοῦ καρποῦ τῆς γαστρός — 胎の実は報い (μισθός — «награда, плата»; καρπός — «плод»; γαστήρ — «чрево», ср. 43:25). Именные предложения без глагола сохранены."
  4: "ὡσεὶ βέλη ἐν χειρὶ δυνατοῦ — 力ある者の手にある矢のように (βέλος — 矢; δυνατός — «сильный»). οὕτως οἱ υἱοὶ τῶν ἐκτετιναγμένων — 若い日に生まれた子どもは…のようである (ἐκτετιναγμένοι — букв. «отрясённые»; евр. «сыны юности», отсюда 若い日に生まれた; у jp-joc «少壯の諸子»; буквальный греч. смысл тёмен и отмечен здесь)."
  5: "μακάριος ἄνθρωπος, ὃς πληρώσει τὴν ἐπιθυμίαν αὐτοῦ ἐξ αὐτῶν — これらの子どもで自分の矢筒を満たす人は幸いである (πληρόω — «наполнять»; ἐπιθυμία — «желание», здесь конкретно «колчан», отсюда 矢筒, как в Синодальном и jp-joc 箙). οὐ καταισχυνθήσονται — 辱められない (καταισχύνω — «посрамлять»). ὅταν λαλῶσι τοῖς ἐχθροῖς αὐτῶν ἐν πύλῃ — 門のところで敵と語るとき (πύλη — городские ворота, где вершился суд; речь о тяжбе перед старейшинами)."
