# jp-box, 4-я Царств, глава 19. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет;
# jp-ni (под авторским правом) не использовался.
# Язык — современный 常体 (в молитве и речах тоже); порядок членов и деление
# на клаузы — по греческому.
# Глава 19: вретище Езекии и посольство к Исаии (1–7), Рабсак у Ливны и
# письмо Сеннахирима (8–14), молитва Езекии (15–19), пророчество Исаии о
# Сеннахириме (20–34), гибель ассирийского войска и смерть Сеннахирима (35–37).
# Нумерация по gr: 37 стихов, совпадает с csl.
# Речи: посланные передают слова Езекии — 「…」 (3–4), его слова внутри — 『…』;
# речь Исаии — 「…」 (6–7, 20, 29–31), слово Господа внутри — 『…』 (20–28,
# 32–34), слова царя Ассирийского внутри пророчества — 「…」 (23–24);
# письмо Сеннахирима — 「…」 (9–13), содержание письма — 『…』, цитата внутри
# него — 「…」 (10).
# 〔…〕 нет: все стихи есть в gr-lxx-byz. Слав. добавки внесены в основной
# текст без скобок: 19:9 «тако рцыте езекии царю иудейску», 19:13 «царь» при
# Сепарваиме, 19:25 «еда не слышал еси?»; расхождения с LXX оговорены в notes.
# Сносок ⟨…⟩ нет: 神殿, 祭壇, 預言者, ケルビム, 聖絶, 粗布, 陣営 уже
# в корпусе. Красного нет.
# jp-ni не использовался.

