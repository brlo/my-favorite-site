verses:
  1: "王[おう]ヒゼキヤはそれを聞[き]くと、自分[じぶん]の衣[ころも]を裂[さ]き、粗布[あらぬの]を身[み]にまとって、主[しゅ]の神殿[しんでん]に入[はい]った。"
  2: "彼[かれ]は王[おう]の家[いえ]の管理[かんり]人[にん]エリアキム、書記[しょき]ソムナ、および祭司[さいし]たちの長老[ちょうろう]たちを、粗布[あらぬの]をまとったまま、預言者[よげんしゃ]イザヤ、アモスの子[こ]のもとへ遣[つか]わした。"
  3: "そして言[い]った。「ヒゼキヤはこう言[い]う。『この日[ひ]は苦難[くなん]と叱責[しっせき]と怒[いか]りの日[ひ]である。子[こ]どもが生[う]まれ出[で]る時[とき]まで来[き]ながら、産[う]む力[ちから]がないからである。"
  4: "もしかすると、あなたの神[かみ]である主[しゅ]は、アッシリアの王[おう]がその主人[しゅじん]として、生[い]ける神[かみ]をそしり、あなたの神[かみ]である主[しゅ]が聞[き]かれた言葉[ことば]によって冒瀆[ぼうとく]するために遣[つか]わしたラブシャケのすべての言葉[ことば]を、聞[き]いてくださるかもしれない。あなたは、残[のこ]されている者[もの]たちのために祈[いの]りをささげてほしい。』」"
  5: "ヒゼキヤ王[おう]の家来[けらい]たちはイザヤのもとへ来[き]た。"
  6: "イザヤは彼[かれ]らに言[い]った。「あなたがたの主人[しゅじん]にこう言[い]いなさい。『主[しゅ]はこう言[い]われる。アッシリアの王[おう]の若[わか]い者[もの]たちがわたしを冒瀆[ぼうとく]したその言葉[ことば]を、あなたは聞[き]いたが、それを恐[おそ]れてはならない。"
  7: "見[み]よ、わたしは彼[かれ]の内[うち]に霊[れい]を与[あた]える。彼は知[し]らせを聞[き]いて自分[じぶん]の地[ち]へ帰[かえ]る。わたしは彼[かれ]をその地[ち]で剣[つるぎ]によって倒[たお]す。』」"
  8: "ラブシャケは引[ひ]き返[かえ]し、アッシリアの王[おう]がリブナと戦[たたか]っているのを見[み]つけた。王[おう]がラキシュから去[さ]ったことを聞[き]いたからである。"
  9: "王[おう]はティルハカ、エチオピアの王[おう]について、「見[み]よ、彼はあなたと戦[たたか]うために出[で]て来[き]た」と言[い]われるのを聞[き]き、引[ひ]き返[かえ]してヒゼキヤのもとへ使者[ししゃ]たちを遣[つか]わし、こう言[い]わせた。「ユダの王[おう]ヒゼキヤにこう言[い]いなさい。"
  10: "『あなたが頼[たよ]りにしているあなたの神[かみ]が、あなたをそそのかして「エルサレムはアッシリアの王[おう]の手[て]に渡[わた]されることはない」と言[い]わせてはならない。"
  11: "見[み]よ、あなたはアッシリアの王[おう]たちがすべての地[ち]に行[おこな]ったこと、すなわちそれらを聖絶[せいぜつ]したことを聞[き]いた。あなただけが助[たす]かるのか。"
  12: "わたしの父[ちち]たちが滅[ほろ]ぼした国[くに]々[ぐに]の神[かみ]々[がみ]は、それらを救[すく]い出[だ]したか。ゴザン、ハラン、ラフェス、またタアステンにいるエデンの子[こ]らを。"
  13: "ハマトの王[おう]とアルパデの王[おう]はどこにいるのか。セパルワイムの王[おう]、アナとアワはどこにいるのか。』」"
  14: "ヒゼキヤは使者[ししゃ]たちの手[て]から書[しょ]き物[もの]を受[う]け取[と]って読[よ]み、主[しゅ]の神殿[しんでん]に上[のぼ]って行[い]き、主[しゅ]の前[まえ]でそれを広[ひろ]げた。"
  15: "そして言[い]った。「イスラエルの神[かみ]、主[しゅ]よ。ケルビムの上[うえ]に座[すわ]る方[かた]、あなたこそ、地[ち]のすべての国[くに]々[ぐに]のうちでただ一[ひと]人[り]の神[かみ]である。あなたは天[てん]と地[ち]を造[つく]られた。"
  16: "主[しゅ]よ、あなたの耳[みみ]を傾[かたむ]けて聞[き]いてください。主[しゅ]よ、あなたの目[め]を開[ひら]いて見[み]てください。センナケリブが遣[つか]わした言葉[ことば]を聞[き]いてください。彼は生[い]ける神[かみ]をそしるためにそれを遣[つか]わしたのである。"
  17: "主[しゅ]よ、まことに、アッシリアの王[おう]たちは国[くに]々[ぐに]を荒[あ]らし、"
  18: "彼[かれ]らの神[かみ]々[がみ]を火[ひ]に投[な]げ入[い]れた。それらは神[かみ]ではなく、人[ひと]の手[て]のわざ、木[き]と石[いし]にすぎないからである。それゆえ彼[かれ]らはそれらを滅[ほろ]ぼした。"
  19: "そして今[いま]、わたしたちの神[かみ]、主[しゅ]よ。わたしたちを彼[かれ]の手[て]から救[すく]ってください。そうすれば、地[ち]のすべての国[くに]々[ぐに]は、主[しゅ]よ、あなただけが神[かみ]であることを知[し]るだろう。」"
  20: "イザヤ、アモスの子[こ]はヒゼキヤのもとへ人[ひと]を遣[つか]わして言[い]った。「万軍[ばんぐん]の神[かみ]である主[しゅ]、イスラエルの神[かみ]はこう言[い]われる。『あなたがアッシリアの王[おう]センナケリブについてわたしに祈[いの]ったことを、わたしは聞[き]いた。"
  21: "これが、主[しゅ]が彼[かれ]について語[かた]られた言葉[ことば]である。おとめシオンの娘[むすめ]は、あなたを蔑[さげす]み、あざ笑[わら]って、あなたのことで頭[あたま]を振[ふ]った。"
  22: "あなたはだれをそしり、だれを冒瀆[ぼうとく]したのか。だれに向[む]かって声[こえ]を上[あ]げ、目[め]を高[たか]く上[あ]げたのか。イスラエルの聖[せい]なる方[かた]に向かってではないか。"
  23: "あなたは使者[ししゃ]たちの手[て]によって主[しゅ]をそしって言[い]った。「わたしは戦車[せんしゃ]の多[おお]さによって山[やま]々[やま]の高[たか]みに上[のぼ]り、レバノンの峰[みね]々[みね]に上[のぼ]った。わたしはその杉[すぎ]の大[おお]きなものを切[き]り倒[たお]し、その糸杉[いとすぎ]の選[え]り抜[ぬ]きのものを切った。わたしはその果[は]ての奥[おく]、そのカルメルの森[もり]の奥[おく]まで来[き]た。"
  24: "わたしは水[みず]を干[ひ]あがらせ、他国[たこく]の水[みず]を飲[の]んだ。わたしは足[あし]の跡[あと]をもって、周[まわ]りのすべての川[かわ]を荒[あ]らした。」"
  25: "あなたは聞[き]かなかったのか。わたしは昔[むかし]からそれを造[つく]り、昔[むかし]の日[ひ]々[び]にそれを定[さだ]め、今[いま]それを実現[じつげん]した。それは、あなたが堅固[けんご]な町[まち]々[まち]を廃墟[はいきょ]とし、戦[たたか]う民[たみ]の移[うつ]り住[す]むところとするためである。"
  26: "その中[なか]に住[す]む者[もの]たちは力[ちから]を失[うしな]い、恐[おそ]れて恥[は]じた。彼[かれ]らは野[の]の草[くさ]、あるいは青[あお]い草[くさ]、屋根[やね]の上[うえ]の草[くさ]のようになり、その前[まえ]に立[た]つ者[もの]に踏[ふ]みにじられた。"
  27: "あなたが座[すわ]ることも、出[で]て行[い]くことも、入[はい]って来[く]ることも、わたしは知[し]っている。また、あなたがわたしに向[む]かって怒[いか]っていることも。"
  28: "あなたがわたしに向[む]かって怒[いか]り、あなたの高[たか]ぶりがわたしの耳[みみ]に届[とど]いたからである。わたしはあなたの鼻[はな]の穴[あな]に鉤[かぎ]を掛[か]け、あなたの唇[くちびる]にくつわを掛[か]け、あなたが来[き]た道[みち]をそのまま帰[かえ]らせる。』"
  29: "あなたへのしるしはこれである。今年[ことし]は自生[じせい]したものを食[た]べ、二[ふた]年目[としめ]も自然[しぜん]に生[は]えるものを食[た]べる。三[み]年目[としめ]には種[たね]をまき、刈[か]り取[と]り、ぶどう園[えん]を植[う]えて、その実[み]を食[た]べる。"
  30: "ユダの家[いえ]のうち、逃[のが]れ延[の]びた残[のこ]りの者[もの]は、再[ふたた]び下[した]に根[ね]を張[は]り、上[うえ]に実[み]を結[むす]ぶ。"
  31: "まことに、エルサレムから残[のこ]りの者[もの]が、シオンの山[やま]から逃[のが]れた者[もの]が出[で]て来[く]る。万軍[ばんぐん]の主[しゅ]の熱心[ねっしん]がこれを成[な]し遂[と]げる。"
  32: "それゆえ、主[しゅ]はアッシリアの王[おう]についてこう言[い]われる。『彼はこの町[まち]に入[はい]らず、そこに矢[や]を放[はな]たず、盾[たて]をその前[まえ]に進[すす]めず、その周[まわ]りに土塁[どるい]を築[きず]くこともない。"
  33: "彼[かれ]は来[き]た道[みち]をそのまま帰[かえ]る。この町[まち]に入[はい]ることはない、と主[しゅ]は言[い]われる。"
  34: "わたしはこの町[まち]を、わたし自身[じしん]のため、またわたしのしもべダビデのために守[まも]る。』」"
  35: "その夜[よる]、主[しゅ]の使[つか]いが出[で]て行[い]き、アッシリアの陣営[じんえい]で十八万五千人[じゅうはちまんごせんにん]を打[う]ち殺[ころ]した。朝[あさ]早[はや]く起[お]きて見[み]ると、見[み]よ、すべては死体[したい]であった。"
  36: "アッシリアの王[おう]センナケリブは立[た]ち去[さ]って帰[かえ]り、ニネベに住[す]んだ。"
  37: "彼[かれ]が自分[じぶん]の神[かみ]ネセラクの神殿[しんでん]で礼拝[れいはい]していたとき、その子[こ]らであるアドラメレクとサラサルが剣[つるぎ]で彼[かれ]を殺[ころ]した。彼[かれ]らはアララトの地[ち]へ逃[に]げ延[の]びた。そしてその子[こ]アソルダンが彼[かれ]に代[か]わって王[おう]となった。"

notes:
  1: "διέρρηξεν τὰ ἱμάτια ἑαυτοῦ — разодрал одежды свои (διαρρήγνυμι); περιεβάλετο σάκκον — облёкся во вретище (σάκκος, 粗布); εἰσῆλθεν εἰς οἶκον κυρίου — вошёл в дом Господень. При ἤκουσεν дополнения нет — содержание слышанного в 18:37 (ru добавляет «это»)."
  2: "οἰκονόμος — домоправитель (王の家の管理人; слав. «строитель»); γραμματεύς — писец (書記); πρεσβυτέρους τῶν ἱερέων — старейшины священников; περιβεβλημένους σάκκους — облечённые во вретища. Σομνας — Сомнас (в ru Севна), в тексте ソムナ по гр; υἱὸν Αμως — сын Амоса (アモスの子)."
  3: "θλῖψις — скорбь, ἐλεγμός — обличение (叱責), παροργισμός — прогневание, «приведение в ярость»; Ἡμέρα ... ἡ ἡμέρα αὕτη — именной оборот без глагола. ἦλθον υἱοὶ ἕως ὠδίνων — «дошли сыны до родовых мук» (ὠδίν — родовые муки; слав. «даже до болезнорождения»); ἰσχὺς οὐκ ἔστιν τῇ τικτούσῃ — «нет силы у рождающей». Стих кончается двоеточием."
  4: "εἴ πως — «если как-нибудь, может быть». Ραψακης — Рабсак (ラブシャケ). ὀνειδίζειν θεὸν ζῶντα — поносить Бога живого; βλασφημεῖν ἐν λόγοις, οἷς ἤκουσεν κύριος — хулить словами, которые услышал Господь. λεῖμμα — остаток (残されている者たち); λήμψῃ προσευχήν — «примешь молитву», т. е. прими, вознеси."
  5: "οἱ παῖδες τοῦ βασιλέως — слуги, отроки царя. Слав. «и приидоша отроцы царя езекии и ко исаии» — то же содержание, порядок иной."
  6: "Μὴ φοβηθῇς ἀπὸ τῶν λόγων — «не убойся от слов» (ἀπό — «от, из-за»); παιδάρια — уменьшительное от παῖς, «мальчишки, слуги» (слав. «отроцы»), передано 若い者たち. ἐβλασφήμησαν — абсолютное употребление; слав. добавляет «мя» («похулиша мя») — в тексте わたしを冒瀆した по слав."
  7: "δίδωμι ἐν αὐτῷ πνεῦμα — «дам в него дух», т. е. пошлю в него дух (побуждение); ἀγγελία — весть, известие; καταβαλῶ — низложу (καταβάλλω); ἐν ῥομφαίᾳ — мечом (ῥομφαία — большой меч, 剣). Исполнение — 19:37."
  8: "Λομνα — Ливна (в слав. «Ловна»); Λαχις — Лахис. ἀπῆρεν — отправился, ушёл (ἀπαίρω). πολεμοῦντα ἐπὶ Λομνα — «воюющего против Ливны» (ἐπί с винительным)."
  9: "Θαρακα — Тирхака (слав. «Фарака» — смешение с фараоном); Αἰθίοπες — эфиопы (エチオピア). λέγων при ἤκουσεν — безличное «говоря», т. е. ему сказали. Слав. добавляет «тако рцыте езекии царю иудейску» (в гр этого нет, в ru оно стоит в 19:10) — внесено в основной текст."
  10: "ἐπαιρέτω — «да не превозносит, не обольщает» (ἐπαίρω); ἐφ᾿ ᾧ πέποιθας ἐπ᾿ αὐτῷ — «на кого ты уповаешь» (πείθω, перфект); Οὐ μὴ παραδοθῇ — усиленное отрицание будущего. Внутри письма цитата — 「…」."
  11: "ἀναθεματίσαι — предать заклятию, истребить (ἀναθεματίζω, 聖絶); ῥυσθῇς — будешь избавлен (ῥύομαι); καί σύ — эмфатическое «и ты ли»."
  12: "ἐξείλαντο — избавили (ἐξαιρέω); διέφθειραν — истребили (διαφθείρω); οἱ πατέρες μου — отцы мои. Γωζαν — Гозан, Χαρραν — Харран, Ραφες — Рецеф (слав. «Фарес»), υἱοὺς Εδεμ — сыны Едена, Θαασθεν — Фалассар (слав. «Фалассар»); передано транслитерацией по гр."
  13: "Αιμαθ — Емаф (в тексте ハマト по обычной японской форме), Αρφαδ — Арфад, Σεπφαρουαιν — Сепарваим, Ανα καὶ Αυα — Ана и Ава. В гр при Сепарваиме нет слова «царь»; слав. «и где есть царь града сепфаруима» — внесено. Стих обрывается тире — речь прервана."
  14: "τὰ βιβλία — мн. ч., «письма, книги» (в ru ед. ч. «письмо»); ἀνέγνω — прочитал (ἀναγινώσκω); ἀνέβη — взошёл; ἀνέπτυξεν — развернул (ἀναπτύσσω). Слав. «прият царь езекиа книги от руки послов и прочте я»."
  15: "ὁ καθήμενος ἐπὶ τῶν χερουβιν — сидящий на херувимах (ケルビム); ὁ θεὸς μόνος ἐν πάσαις ταῖς βασιλείαις τῆς γῆς — единственный Бог во всех царствах земли; ἐποίησας τὸν οὐρανὸν καὶ τὴν γῆν. Слав. перед молитвой добавляет «и молися езекиа пред Господем» — в гр этого нет."
  16: "κλῖνον τὸ οὖς — приклони ухо; ἄνοιξον τοὺς ὀφθαλμούς — открой очи; ἰδέ — воззри (εἶδον); οὓς ἀπέστειλεν ὀνειδίζειν — «которые он послал поносить». Слав. добавляет «мя» («услыши мя») и «тебе» («поношая тебе Богу живу»); в гр этих слов нет, не внесены."
  17: "ἀληθείᾳ — «поистине» (датив); ἠρήμωσαν — опустошили (ἐρημόω); τὰ ἔθνη — народы (国々). Стих обрывается запятой, продолжение — в 18 (слав. так же)."
  18: "ἔδωκαν εἰς τὸ πῦρ — предали огню; ὅτι οὐ θεοί εἰσιν — ибо они не боги; ἔργα χειρῶν ἀνθρώπων — дела рук человеческих; ξύλα καὶ λίθοι — дерево и камни; ἀπώλεσαν — погубили, истребили."
  19: "σῶσον ἡμᾶς ἐκ χειρὸς αὐτοῦ — спаси нас из руки его; γνώσονται — узнают; ὅτι σὺ κύριος ὁ θεὸς μόνος — «что Ты, Господь, Бог един». Здесь закрывается молитва (15–19)."
  20: "ὁ θεὸς τῶν δυνάμεων — «Бог сил» (в отличие от κύριος τῶν δυνάμεων — 万軍の主); Ἃ προσηύξω — «о чём ты молился» (относительное; слав. «о нихже молился еси»); ἤκουσα — услышал. Здесь открывается слово Господа (20–28)."
  21: "ἐξουδέννησέν — презрел (ἐξουθενέω); ἐμυκτήρισέν — осмеял (μυκτηρίζω, букв. «сморщил нос»); παρθένος θυγάτηρ Σιων — дева, дочь Сиона (おとめシオンの娘); ἐπὶ σοὶ κεφαλὴν αὐτῆς ἐκίνησεν — «над тобой покачала головой», знак насмешки. Оборот «вот слово, которое изрёк Господь о нём» стоит внутри речи Господа — шов оригинала, передан буквально."
  22: "ὠνείδισας — поносил (ὀνειδίζω); ἐβλασφήμησας — хулил; ὕψωσας φωνήν — возвысил голос; ἦρας εἰς ὕψος τοὺς ὀφθαλμούς σου — поднял очи в высоту; ἅγιον τοῦ Ισραηλ — Святой Израилев (イスラエルの聖なる方)."
  23: "ἐν χειρὶ ἀγγέλων σου — «рукою послов твоих» (ἄγγελος здесь — посланник, не ангел); ἅρματα — колесницы (戦車); μηροὺς τοῦ Λιβάνου — «бёдра Ливана», т. е. склоны, отроги, передано レバノンの峰々; κυπάρισσος — кипарис (糸杉); μελον τέλους — испорченное, тёмное место (слав. «в средину чащи», ru «на самое крайнее пристанище»), передано 果ての奥; δρυμός — чаща, лес; Καρμηλος — Кармил. Здесь открывается речь царя Ассирийского (23–24)."
  24: "ἔψυξα — иссушил (ψύχω); ὕδατα ἀλλότρια — воды чужие; ἴχνος τοῦ ποδός — след ноги; περιοχή — округа (слав. «реки окрестныя»). В ru по МТ «откапывал я и пил воду чужую»; в тексте по гр и слав. Здесь закрывается речь царя."
  25: "В гр стих начинается с ἔπλασα αὐτήν — «Я образовал это» (πλάσσω); слав. начинает вопросом «еда не слышал еси?» (по МТ) — внесено в основной текст. ἐπάρσεις — «возвышения», вероятно «груды развалин» (ru по МТ); ἀποικεσία — переселение; μαχίμων — воинственных; πόλεις ὀχυράς — города укреплённые. Место тёмное, передано по смыслу: 廃墟 и 移り住むところ."
  26: "ἠσθέννησαν τῇ χειρί — «изнемогли рукою» (слав. «изнемогоша рукою»); ἔπτηξαν — устрашились (πτήσσω); κατῃσχύνθησαν — постыдились; χόρτος ἀγροῦ — трава полевая; χλωρὰ βοτάνη — зелёная зелень; χλόη δωμάτων — злак кровель; πάτημα — попрание; ἀπέναντι ἑστηκότος — «пред стоящим»."
  27: "καθέδρα — сидение (座ること); ἔξοδος καὶ εἴσοδος — выход и вход; θυμός — гнев. Стих обрывается, продолжение — в 28."
  28: "στρῆνος — дерзость, надмение (слав. «шум»); ἀνέβη ἐν τοῖς ὠσίν μου — «вошло в уши Мои»; ἄγκιστρον — крюк, удица (鉤); μυκτῆρες — ноздри; χαλινός — узда (くつわ); χεῖλος — уста. Здесь закрывается слово Господа о Сеннахириме (20–28)."
  29: "σημεῖον — знамение (しるし); αὐτόματα — самородное, выросшее само; τὰ ἀνατέλλοντα — произрастающее; ἄμητος — жатва; φυτεία ἀμπελώνων — насаждение виноградников. Обращение снова к Езекии — снова речь Исаии (29–31)."
  30: "τὸ διασεσῳσμένον οἴκου Ιουδα — спасшееся дома Иуды; τὸ ὑπολειφθέν — оставшееся; προσθήσει — приложит, т. е. вновь; ῥίζαν κάτω — корень вниз; ποιήσει καρπὸν ἄνω — сотворит плод вверх."
  31: "κατάλειμμα — остаток (残りの者); ἀνασῳζόμενος — спасаемый; ἐξ ὄρους Σιων — от горы Сиона; ὁ ζῆλος κυρίου τῶν δυνάμεων — ревность Господа сил (万軍の主の熱心); ποιήσει τοῦτο — сделает это."
  32: "οὐχ οὕτως — «не так» (слав. «сего ради», ru «посему»); θυρεός — большой щит; πρόσχωμα — вал, насыпь (土塁); οὐ μὴ ἐκχέῃ — усиленное отрицание; οὐ τοξεύσει βέλος — не пустит стрелы. Здесь снова открывается слово Господа (32–34)."
  33: "τῇ ὁδῷ, ᾗ ἦλθεν, ἐν αὐτῇ ἀποστραφήσεται — «тем путём, которым пришёл, им и возвратится»; λέγει κύριος — «говорит Господь», заключительная формула."
  34: "ὑπερασπιῶ — буду защищать (ὑπερασπίζω, слав. «защищу»); δι᾿ ἐμέ — ради Меня; διὰ Δαυιδ τὸν δοῦλόν μου — ради Давида, раба Моего. Здесь закрываются слово Господа (32–34) и речь Исаии."
  35: "ἕως νυκτός — «до ночи» (слав. «в нощь ону», ru «в ту ночь»); ἄγγελος κυρίου — ангел Господень (主の使い); παρεμβολή — стан, лагерь (陣営); ἑκατὸν ὀγδοήκοντα πέντε χιλιάδες — 185 000; ὤρθρισαν — встали рано (ὀρθρίζω); σώματα νεκρά — тела мёртвые (死体)."
  36: "ἀπῆρεν καὶ ἐπορεύθη καὶ ἀπέστρεψεν — три глагола (отправился, пошёл, возвратился) переданы двумя; Νινευη — Ниневия (ニネベ, как в Мф 12:41 и Лк 11:30)."
  37: "Νεσεραχ — Нисрох (слав. «Месерах», ru «Нисрох»); Αδραμελεχ καὶ Σαρασαρ — Адрамелех и Сарасар (ru «Шарецер»); μαχαίρᾳ — мечом; ἐσώθησαν — спаслись (σῴζω); γῆ Αραρατ — земля Араратская (アララト, ср. Быт 8:4); Ασορδαν — Асардан, т. е. Асархаддон. Исполнение слова 19:7."
