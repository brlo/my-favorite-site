verses:
  1: "イエスはそこを出[で]て、故郷[こきょう]へ行[い]かれた。弟子[でし]たちもイエスに従[したが]って行[い]った。"
  2: "安息日[あんそくび]になると、イエスは会堂[かいどう]で教[おし]え始[はじ]められた。多[おお]くの人[ひと]が聞[き]いて驚[おどろ]き、こう言[い]った。「この人[ひと]は、こうしたことをどこから身[み]につけたのか。この人[ひと]に与[あた]えられた知恵[ちえ]とは何[なん]なのか。その手[て]によって、このような力[ちから]ある業[わざ]が行[おこな]われるとは。」"
  3: "「この人[ひと]はあの大工[だいく]⟨家[いえ]を建[た]てたり、家具[かぐ]を作[つく]ったりする職人[しょくにん]。⟩ではないか。マリアの子[こ]で、ヤコブ、ヨセフ、ユダ、シモンの兄弟[きょうだい]ではないか。姉妹[しまい]たちもみな、わたしたちのところにいるではないか。」そして、人々[ひとびと]はイエスにつまずいた。"
  4: "イエスは彼[かれ]らに言[い]われた。「<j>預言者[よげんしゃ]が敬[うやま]われないのは、自分[じぶん]の故郷[こきょう]、自分[じぶん]の親族[しんぞく]、自分[じぶん]の家[いえ]においてだけである。</j>」"
  5: "そこでは、どんな力[ちから]ある業[わざ]も行[おこな]うことができなかった。ただ、少数[しょうすう]の病人[びょうにん]に手[て]を置[お]いて癒[いや]されただけであった。"
  6: "そして、彼[かれ]らの不信仰[ふしんこう]のゆえに驚[おどろ]かれた。それから、周辺[しゅうへん]の村々[むらむら]を巡[めぐ]って教[おし]えて回[まわ]られた。"
  7: "イエスは十二人[じゅうににん]を呼[よ]び寄[よ]せ、二人[ふたり]ずつ遣[つか]わし始[はじ]められた。そして、汚[けが]れた霊[れい]を支配[しはい]する権威[けんい]をお与[あた]えになった。"
  8: "旅[たび]のために持[も]って行[い]くのは杖[つえ]一本[いっぽん]だけにし、パンも袋[ふくろ]も、帯[おび]に入[い]れる銭[ぜに]も持[も]ってはならない、と命[めい]じられた。"
  9: "ただし、サンダルは履[は]いて行[い]き、衣服[いふく]を二枚[にまい]重[かさ]ねて着[き]てはならない。"
  10: "また言[い]われた。「<j>どこでも、ある家[いえ]に入[はい]ったなら、そこを立[た]ち去[さ]るまで、その家[いえ]にとどまりなさい。</j>」"
  11: "「<j>どこでも、あなたがたを受[う]け入[い]れず、あなたがたの話[はなし]を聞[き]こうとしない所[ところ]があれば、そこを出[で]るとき、彼[かれ]らに対[たい]する証[あかし]として、足[あし]の下[した]の土[つち]を払[はら]い落[お]としなさい。〔はっきり言[い]っておく。裁[さば]きの日[ひ]には、ソドムとゴモラのほうが、その町[まち]よりも罰[ばつ]が軽[かる]いであろう。〕</j>」"
  12: "弟子[でし]たちは出[で]て行[い]き、人々[ひとびと]が悔[く]い改[あらた]めるようにと宣[の]べ伝[つた]えた。"
  13: "また、多[おお]くの悪霊[あくりょう]を追[お]い出[だ]し、多[おお]くの病人[びょうにん]に油[あぶら]を塗[ぬ]って癒[いや]した。"
  14: "ヘロデ王[おう]はこのことを聞[き]いた。イエスの名[な]が広[ひろ]く知[し]られるようになっていたからである。人々[ひとびと]は言[い]っていた。「洗礼者[せんれいしゃ]ヨハネが死者[ししゃ]の中[なか]から起[お]き上[あ]がったのだ。だから、彼[かれ]のうちに力[ちから]ある業[わざ]が働[はたら]いているのだ。」"
  15: "ほかの人々[ひとびと]は「エリヤだ」と言[い]い、またほかの人々[ひとびと]は「預言者[よげんしゃ]の一人[ひとり]のような預言者[よげんしゃ]だ」と言[い]っていた。"
  16: "ヘロデはこれを聞[き]くと、言[い]った。「わたしが首[くび]を斬[き]り落[お]としたヨハネが、生[い]き返[かえ]ったのだ。」"
  17: "というのは、ヘロデ自身[じしん]が人[ひと]を送[おく]ってヨハネを捕[と]らえ、牢[ろう]に縛[しば]りつけておいたからである。兄弟[きょうだい]フィリポの妻[つま]ヘロディアのゆえであった。ヘロデは彼女[かのじょ]を娶[めと]っていたのである。"
  18: "ヨハネはヘロデに、「あなたが兄弟[きょうだい]の妻[つま]を娶[めと]っているのは、許[ゆる]されないことです」と言[い]っていたからである。"
  19: "ヘロディアはヨハネを恨[うら]み、殺[ころ]そうと思[おも]っていたが、それはできなかった。"
  20: "ヘロデはヨハネを恐[おそ]れていた。彼[かれ]が正[ただ]しく聖[せい]なる人[ひと]であると知[し]っていたからである。そして彼[かれ]を保護[ほご]し、その話[はなし]を聞[き]いては多[おお]くのことを行[おこな]い、喜[よろこ]んで耳[みみ]を傾[かたむ]けた。"
  21: "ちょうど機会[きかい]が訪[おとず]れた。ヘロデが自分[じぶん]の誕生日[たんじょうび]に、重臣[じゅうしん]たち、千人隊長[せんにんたいちょう]たち、ガリラヤの主[おも]だった人々[ひとびと]のために晩餐[ばんさん]を催[もよお]したときのことである。"
  22: "ヘロディアの娘[むすめ]が入[はい]って来[き]て踊[おど]り、ヘロデと同席[どうせき]の者[もの]たちを喜[よろこ]ばせた。そこで王[おう]は少女[しょうじょ]に言[い]った。「何[なに]でも欲[ほ]しいものをわたしに求[もと]めなさい。お前[まえ]に与[あた]えよう。」"
  23: "そして、彼女[かのじょ]に誓[ちか]って言[い]った。「わたしの国[くに]の半分[はんぶん]までも、お前[まえ]が求[もと]めるものは何[なん]でも与[あた]えよう。」"
  24: "娘[むすめ]は外[そと]へ出[で]て、母[はは]に言[い]った。「何[なに]をお願[ねが]いしましょうか。」母[はは]は答[こた]えた。「洗礼者[せんれいしゃ]ヨハネの首[くび]を。」"
  25: "娘[むすめ]はすぐに、急[いそ]いで王[おう]のもとへ入[はい]って行[い]き、願[ねが]い出[で]た。「今[いま]すぐ、洗礼者[せんれいしゃ]ヨハネの首[くび]を盆[ぼん]に載[の]せて、わたしに下[くだ]さい。」"
  26: "王[おう]はたいそう心[こころ]を痛[いた]めたが、自分[じぶん]の誓[ちか]いと同席[どうせき]の者[もの]たちの手前[てまえ]、彼女[かのじょ]の願[ねが]いを退[しりぞ]ける気[き]にはなれなかった。"
  27: "そこで王[おう]はすぐに衛兵[えいへい]を送[おく]り、ヨハネの首[くび]を持[も]って来[く]るように命[めい]じた。衛兵[えいへい]は行[い]って、牢[ろう]の中[なか]でヨハネの首[くび]を斬[き]り落[お]とした。"
  28: "そして、その首[くび]を盆[ぼん]に載[の]せて持[も]って来[き]、少女[しょうじょ]に渡[わた]した。少女[しょうじょ]はそれを母[はは]に渡[わた]した。"
  29: "ヨハネの弟子[でし]たちはその知[し]らせを受[う]けると、やって来[き]て遺体[いたい]を引[ひ]き取[と]り、墓[はか]に葬[ほうむ]った。"
  30: "使徒[しと]たちはイエスのもとに集[あつ]まり、自分[じぶん]たちが行[おこな]ったこと、教[おし]えたことを、すべてイエスに報告[ほうこく]した。"
  31: "イエスは言[い]われた。「<j>あなたがただけで、人気[ひとけ]のない所[ところ]へ行[い]って、しばらく休[やす]みなさい。</j>」というのは、行[い]き来[き]する人[ひと]が多[おお]く、食事[しょくじ]をする暇[ひま]さえなかったからである。"
  32: "一行[いっこう]は舟[ふね]に乗[の]って、人気[ひとけ]のない所[ところ]へ、自分[じぶん]たちだけで向[む]かった。"
  33: "しかも、多[おお]くの人[ひと]が、彼[かれ]らが去[さ]って行[い]くのを見[み]てそれと気[き]づき、あらゆる町[まち]から徒歩[とほ]で駆[か]け集[あつ]まり、彼[かれ]らより先[さき]に着[つ]いた。"
  34: "イエスは舟[ふね]から出[で]て、大[おお]きな群衆[ぐんしゅう]をご覧[らん]になった。羊飼[ひつじか]いのいない羊[ひつじ]のようだったので、深[ふか]く憐[あわ]れみ、多[おお]くのことを教[おし]え始[はじ]められた。"
  35: "すでに時[とき]も遅[おそ]くなっていたので、弟子[でし]たちが近[ちか]くに来[き]て言[い]った。「ここは人気[ひとけ]のない所[ところ]で、もうすっかり遅[おそ]くなりました。"
  36: "この人[ひと]たちを帰[かえ]らせて、周[まわ]りの村々[むらむら]や集落[しゅうらく]へ行[い]き、食[た]べる物[もの]を買[か]わせてください。」"
  37: "イエスはお答[こた]えになった。「<j>あなたがたが彼[かれ]らに食[た]べさせなさい。</j>」弟子[でし]たちは言[い]った。「わたしたちが二百[にひゃく]デナリオン⟨ローマの銀貨[ぎんか]。労働者[ろうどうしゃ]の一日[いちにち]の給料[きゅうりょう]にあたる。⟩のパンを買[か]って来[き]て、この人[ひと]たちに食[た]べさせろとおっしゃるのですか。」"
  38: "イエスは言[い]われた。「<j>パンはいくつあるか。行[い]って見[み]て来[き]なさい。</j>」弟子[でし]たちは確[たし]かめてから言[い]った。「五[いつ]つと、魚[さかな]が二匹[にひき]です。」"
  39: "イエスは、皆[みな]を青[あお]い草[くさ]の上[うえ]に、組[くみ]ごとに座[すわ]らせるように命[めい]じられた。"
  40: "人々[ひとびと]は、百人[ひゃくにん]ずつ、五十人[ごじゅうにん]ずつの組[くみ]になって座[すわ]った。"
  41: "イエスは五[いつ]つのパンと二匹[にひき]の魚[さかな]を取[と]り、天[てん]を仰[あお]いで祝福[しゅくふく]し、パンを裂[さ]いて、弟子[でし]たちに渡[わた]し、人々[ひとびと]に配[くば]らせた。また、二匹[にひき]の魚[さかな]も皆[みな]に分[わ]け与[あた]えられた。"
  42: "人々[ひとびと]は皆[みな]食[た]べて、満腹[まんぷく]した。"
  43: "そして、パンの屑[くず]と魚[さかな]の残[のこ]りを集[あつ]めると、籠[かご]十二[じゅうに]杯[はい]になった。"
  44: "パンを食[た]べたのは、男[おとこ]が五千人[ごせんにん]であった。"
  45: "イエスはすぐに弟子[でし]たちを舟[ふね]に乗[の]らせ、ご自分[じぶん]が群衆[ぐんしゅう]を帰[かえ]らせる間[あいだ]に、先[さき]に対岸[たいがん]のベツサイダへ向[む]かわせた。"
  46: "そして、群衆[ぐんしゅう]と別[わか]れてから、祈[いの]るために山[やま]へ登[のぼ]られた。"
  47: "夕方[ゆうがた]になると、舟[ふね]は湖[みずうみ]の真[ま]ん中[なか]にあり、イエスはただ一人[ひとり]、陸[りく]におられた。"
  48: "イエスは、彼[かれ]らが漕[こ]ぎ進[すす]むのに苦[くる]しんでいるのをご覧[らん]になった。風[かぜ]が向[む]かい風[かぜ]だったからである。夜[よ]の四更[しこう]ごろ、イエスは湖[みずうみ]の上[うえ]を歩[ある]いて彼[かれ]らの方[ほう]へ来[こ]られた。そして、彼[かれ]らを通[とお]り過[す]ぎようとされた。"
  49: "弟子[でし]たちは、イエスが湖[みずうみ]の上[うえ]を歩[ある]いておられるのを見[み]て、幽霊[ゆうれい]だと思[おも]い、叫[さけ]び声[ごえ]を上[あ]げた。"
  50: "皆[みな]、イエスを見[み]て恐[おそ]れたのである。そこでイエスはすぐに彼[かれ]らに語[かた]りかけ、言[い]われた。「<j>勇気[ゆうき]を出[だ]しなさい。わたしである。恐[おそ]れてはならない。</j>」"
  51: "イエスが舟[ふね]に乗[の]って彼[かれ]らのところへ行[い]かれると、風[かぜ]はやんだ。彼[かれ]らは内心[ないしん]、ひどく驚[おどろ]いて、われを忘[わす]れた。"
  52: "パンの出来事[できごと]を理解[りかい]していなかったからである。彼[かれ]らの心[こころ]が頑[かたくな]になっていたからである。"
  53: "一行[いっこう]は湖[みずうみ]を渡[わた]って陸[りく]に着[つ]き、ゲネサレトに来[き]て舟[ふね]を着[つ]けた。"
  54: "舟[ふね]から出[で]るとすぐ、人々[ひとびと]はイエスだと気[き]づき、"
  55: "その地方[ちほう]の全域[ぜんいき]を駆[か]け回[まわ]って、イエスがおられると聞[き]いた所[ところ]へ、病人[びょうにん]を寝床[ねどこ]に載[の]せて運[はこ]び始[はじ]めた。"
  56: "そして、イエスが村[むら]でも町[まち]でも集落[しゅうらく]でも入[はい]られる所[ところ]では、人々[ひとびと]は広場[ひろば]に病人[びょうにん]を置[お]き、せめて衣[ころも]の裾[すそ]にでも触[ふ]れさせてくださいと願[ねが]った。触[ふ]れた者[もの]は皆[みな]、癒[いや]された。"

notes:
  2: "δυνάμεις — «силы», «дела силы»; передал 力ある業 (не 奇跡), сохраняя греческое δύναμις."
  3: "τέκτων — плотник и строитель; 大工, сноска при первом упоминании в книге (ср. Мф 13:55). Ἰωσῆς — ヨセフ, Ἰούδας — ユダ (как в Мф 13:55)."
  5: "οὐκ ἐδύνατο — «не мог»; не сглаживал в «не совершил»."
  11: "В критическом тексте стих кончается на «во свидетельство им»; Церковь (Визант., ср. Мф 10:15) добавляет слово о Содоме и Гоморре — в 〔…〕."
  14: "В критическом тексте объект «услышал» не выражен; передал このことを聞いた, без пояснительной добавки «τὰ περὶ Ἰησοῦ» (у jp-joc イイススの事を)."
  17: "Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ — «Филиппа, брата его»; 兄弟フィリポ, не «сын»."
  22: "В критическом тексте «τῆς θυγατρὸς αὐτοῦ Ἡρῳδιάδος» (дочь его, Иродиада); церковное чтение (TR, jp-joc イロデアダの女) — «дочь Иродиады». Взято церковное: ヘロディアの娘."
  23: "πολλά в критическом тексте в квадратных скобках; jp-joc его не передаёт, оставил без «много»."
  27: "У jp-joc казнь отнесена к ст. 28; держу деление критического текста: приказ и казнь — 27, принесение головы — 28."
  37: "δηναρίων διακοσίων — двести динариев; デナリオン, сноска при первом упоминании в книге (дневная плата работника)."
  44: "τοὺς ἄρτους в критическом тексте в скобках; «パンを食べたのは» без 〔〕, чтобы не дробить формулу."
  48: "τετάρτη φυλακή — четвёртая стража (3–6 утра); 四更, церковное деление ночи."
  52: "πεπωρωμένη — «окаменевшее», «затвердевшее»; 頑くなになっていた."
