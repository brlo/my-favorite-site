# jp-box, Неемия, глава 1. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); славянский (csl-ru) — второй
# свидетель церковного текста: слав. чтения и добавки входят в основной текст
# без 〔…〕, вариант LXX — в notes. ru (Синодальный) — только для понимания.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Неемия на сайте — отдельная книга; греческий модуль хранит её как ezd 11–23,
# поэтому глава N соответствует ezd N+10 (сверено по базе: 11+20+37+17+19+19).
# Глава 1: весть из Иерусалима (1–3), плач и пост (4), молитва Неемии (5–11).
# Речь: ответ вернувшихся — 「…」 (3); молитва — 「…」 (5–11); слова Бога внутри
# молитвы — 『…』 (8). Красного нет.
# 〔…〕 нет. Сносок ⟨…⟩ нет: 城壁, 門, 契約, 戒め уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: neem
chapter: 1
draft: true

verses:
  1: "ハカルヤの子[こ]であるネヘミヤの言葉[ことば]。第二十[だいにじゅう]年[ねん]のキスレウの月[つき]、私[わたし]はスサの城[しろ]にいた。"
  2: "私[わたし]の兄弟[きょうだい]の一人[ひとり]であるハナニが、ユダから幾人[いくにん]かの者[もの]とともに来[き]た。私[わたし]は彼[かれ]らに、捕囚[ほしゅう]から救[すく]われて残[のこ]った者[もの]たちのこと、またエルサレムのことを尋[たず]ねた。"
  3: "彼[かれ]らは私[わたし]に言[い]った。「捕囚[ほしゅう]から残[のこ]された者[もの]たちは、あの国[くに]の地[ち]で大[おお]きな災[わざわ]いと恥[は]ずかしめの中[なか]にいる。エルサレムの城壁[じょうへき]は崩[くず]され、その門[もん]は火[ひ]で焼[や]かれている。」"
  4: "私[わたし]はこれらの言葉[ことば]を聞[き]くと、座[すわ]って泣[な]き、幾日[いくにち]も悲[かな]しんだ。そして断食[だんじつ]して、天[てん]の神[かみ]の前[まえ]に祈[いの]っていた。"
  5: "そして言[い]った。「ああ、主[しゅ]、天[てん]の神[かみ]よ。あなたは強[つよ]く、大[おお]いなる、恐[おそ]るべき方[かた]であり、あなたを愛[あい]し、あなたの戒[いまし]めを守[まも]る者[もの]たちに、契約[けいやく]と慈[いつく]しみを保[たも]たれる。"
  6: "どうか、あなたの耳[みみ]が傾[かたむ]き、あなたの目[め]が開[ひら]かれて、あなたの僕[しもべ]の祈[いの]りを聞[き]いてください。私[わたし]は今日[きょう]、昼[ひる]も夜[よる]も、あなたの僕[しもべ]であるイスラエルの子[こ]らのために、あなたの前[まえ]に祈[いの]っている。そして、イスラエルの子[こ]らがあなたに対[たい]して犯[おか]した罪[つみ]を告白[こくはく]する。私[わたし]も、私[わたし]の父[ちち]の家[いえ]も罪[つみ]を犯[おか]した。"
  7: "私[わたし]たちはあなたに対[たい]して甚[はなは]だしく罪[つみ]を犯[おか]し、あなたがあなたの僕[しもべ]モーセに命[めい]じられた戒[いまし]めと掟[おきて]と定[さだ]めを守[まも]らなかった。"
  8: "どうか、あなたがあなたの僕[しもべ]モーセに命[めい]じられた言葉[ことば]を思[おも]い起[お]こしてください。あなたは言[い]われた。『もしあなたがたが背[そむ]くなら、わたしはあなたがたを諸[もろ]もろの民[たみ]の中[なか]に散[ち]らす。』"
  9: "また、もしあなたがたが私[わたし]に帰[かえ]り、私[わたし]の戒[いまし]めを守[まも]って行[おこな]うなら、たとえあなたがたの散[ち]らされた者[もの]が天[てん]の果[は]てにいても、そこから彼[かれ]らを集[あつ]め、私[わたし]の名[な]を住[す]まわせるために私[わたし]が選[えら]んだ場所[ばしょ]へ彼[かれ]らを連[つ]れて来[く]る。"
  10: "彼[かれ]らこそ、あなたの僕[しもべ]、あなたの民[たみ]であり、あなたが大[おお]いなる力[ちから]と強[つよ]い手[て]によって贖[あがな]われた者[もの]たちである。"
  11: "ああ、主[しゅ]よ、どうか、あなたの僕[しもべ]の祈[いの]りに、またあなたの名[な]を恐[おそ]れることを願[ねが]うあなたの僕[しもべ]たちの祈[いの]りに、あなたの耳[みみ]を傾[かたむ]けてください。どうか、今日[きょう]、あなたの僕[しもべ]を幸[さいわ]いならしめ、この人[ひと]の前[まえ]で彼[かれ]があわれみを得[え]るようにしてください。」私[わたし]は王[おう]の酒[さけ]を注[そそ]ぐ者[もの]であった。"

notes:
  1: "Λόγοι Νεεμια υἱοῦ Αχαλια — «Слова Неемии, сына Ахалии»: обычное надписание-заглавие (слав. «Словеса неемии сына ахалиина»). ἐν μηνὶ Χασεηλου — месяц кислев (ноябрь–декабрь). ἔτους εἰκοστοῦ — 20-й год [Артаксеркса], ср. 2:1. ἐν Σουσαν αβιρα — «в Сузах, столице»: евр. שׁוּשַׁן הַבִּירָה, «Сузы-Бира»; слав. оставил без перевода («в Сусан-авире»), поэтому 城[しろ] — «крепость, стольный город»."
  2: "Ανανι — Ханани (слав. «Ананиа», ру «Ханани»); εἷς ἀπὸ ἀδελφῶν μου — «один из братьев моих». ἠρώτησα — «спросил» (ἐρωτάω). περὶ τῶν σωθέντων, οἳ κατελείφθησαν ἀπὸ τῆς αἰχμαλωσίας — «о спасшихся, которые остались от плена» (αἰχμαλωσία — плен, 捕囚). καὶ περὶ Ιερουσαλημ — «и об Иерусалиме»."
  3: "οἱ καταλειπόμενοι οἱ καταλειφθέντες — тавтология LXX («оставшиеся, которые остались»), слав. «оставшиися от пленения»; по-японски передана один раз. ἐν πονηρίᾳ μεγάλῃ — «в великой беде» (πονηρία здесь — бедствие; слав. «во озлоблении велице»). ἐν ὀνειδισμῷ — «в поношении». τείχη… καθῃρημένα — «стены разрушены» (καθαιρέω); αἱ πύλαι… ἐνεπρήσθησαν ἐν πυρί — «ворота сожжены огнём» (ἐμπρήθω)."
  4: "ἐν τῷ ἀκοῦσαί με — «когда я услышал» (ἐν τῷ + inf.). ἐκάθισα καὶ ἔκλαυσα καὶ ἐπένθησα — «сел, плакал и печалился» (πενθέω — оплакивать). ἡμέρας — «дни» (слав. «дни многи»). ἤμην νηστεύων καὶ προσευχόμενος — описательное «был постящимся и молящимся», передано деепричастно."
  5: "Μὴ δή — увещательное «о, молю» (слав. «молю тя»); передано ああ. ὁ ἰσχυρός, ὁ μέγας, ὁ φοβερός — «крепкий, великий, страшный» (слав. «крепкий, великий и страшный»). φυλάσσων τὴν διαθήκην καὶ τὸ ἔλεος — «хранящий завет и милость»; ἔλεος здесь — милость-верность, 慈しみ."
  6: "ἔστω δὴ τὸ οὖς σου προσέχον — «да будет ухо Твоё внимающим» (προσέχω); οἱ ὀφθαλμοί σου ἀνεῳγμένοι — «очи отверсты» (ἀνοίγω). ἐξαγορεύω ἐπὶ ἁμαρτίαις — «исповедую грехи» (ἐξαγορεύω — открыто признавать); слав. «исповедаюся о гресех». ἃς ἡμάρτομέν σοι — «которыми согрешили Тебе». καὶ ἐγὼ καὶ ὁ οἶκος πατρός μου — «и я и дом отца моего»."
  7: "διαλύσει διελύσαμεν πρὸς σέ — усиленное «мы тяжко провинились пред Тобою» (διαλύω — расторгать, здесь: нарушать верность; слав. «преступлением преступихом тебе»). τὰ προστάγματα — повеления, 掟; τὰ κρίματα — определения, 定め. ἃ ἐνετείλω τῷ Μωυσῇ — «которые Ты заповедал Моисею»."
  8: "μνήσθητι δή — «вспомни же». Ὑμεῖς ἐὰν ἀσυνθετήσητε — «если вы нарушите [завет]» (ἀσυνθετέω; слав. «аще преступите вы»). διασκορπιῶ ὑμᾶς ἐν τοῖς λαοῖς — «рассею вас по народам». Слова Бога внутри молитвы — 『…』."
  9: "ἐπιστρέψητε — «обратитесь» (ἐπιστρέφω). ἐὰν ᾖ ἡ διασπορὰ ὑμῶν ἀπ᾽ ἄκρου τοῦ οὐρανοῦ — «если рассеяние ваше будет от края неба» (διασπορά — рассеяние). κατασκηνῶσαι τὸ ὄνομά μου ἐκεῖ — «чтобы обитало там имя Моё» (κατασκηνόω — водворяться). ὃν ἐξελεξάμην — «которое Я избрал»."
  10: "οὓς ἐλυτρώσω — «которых Ты искупил» (λυτρόω). ἐν δυνάμει σου τῇ μεγάλῃ καὶ ἐν τῇ χειρί σου τῇ κραταιᾷ — «силою Твоею великою и рукою Твоею крепкою» (κραταιός — крепкий)."
  11: "μὴ δή, κύριε, ἀλλ᾽ ἔστω… — «о, Господи, но да будет…»: просьба продолжается. τῶν θελόντων φοβεῖσθαι τὸ ὄνομά σου — «желающих бояться имени Твоего». εὐόδωσον — «даруй успех» (εὐοδόω); δὸς αὐτὸν εἰς οἰκτιρμούς — «дай ему [обрести] милости» (οἰκτιρμός — сострадание), слав. «даждь его в щедроты». οἰνοχόος — виночерпий, 酌人; слав. «виночерпчий». Стих кончается вне молитвы."
