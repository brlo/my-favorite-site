# jp-box, 3-я Ездры, глава 1. Черновик для приёмки.
#
# База: церковнославянский текст (csl-ru) — единственный полный текст книги:
# в Септуагинте (gr-lxx-byz) её нет вовсе, греческого контроля нет. ru (Синодальный)
# — только для понимания, не источник: у него другое деление (945 стихов против 876)
# и нумерация не совпадает. jp-joc в книге нет; jp-ni не использовался.
# Нумерация — славянская (16 глав); 1–2 — христианские добавления (в западной
# традиции 5 Ездры), 3–14 — иудейский апокалипсис, 15–16 — добавления.
# Язык — современный 常体; порядок членов и клаузы — по славянскому.
# 〔…〕 нет (слав. — это и есть церковное чтение); сносок ⟨…⟩ нет.
#
# Содержание главы 1: обличение Израиля. 1–3 надписание и родословие Ездры
# (плен в Мидии при Артаксерксе); 4–27 слово Господа к Ездре: «не Я ли вывел их
# из земли Египетской», перепелы, манна, вода из камня, «что ещё сделаю вам?»;
# 28–40 отец и мать, курица с птенцами, отвергнутые праздники, избитые пророки,
# «дом ваш пуст», иной народ, который уверует не видев, и вожди — Авраам… Малахия.
# Голоса: 1–3 — надписание и родословие, без кавычек; 4 — вводная формула;
# 5–40 — одно слово Господа к Ездре в 「…」 (формулы «так говорит Господь»
# внутри речи не отделяются кавычками, как и в слав.; слова народа в 18 — 『…』).
# Слав. 1:1 — заголовок книги, а не стих, но в csl-ru и ru он входит в счёт
# стихов, поэтому переведён как ст. 1.
#
tr_code: jp-box
book: 3ezd
chapter: 1
draft: true

verses:
  1: "預言者[よげんしゃ]エズラの第二[だいに]の書[しょ]、サライの子[こ]、アザリヤの子、ヒルキヤの子、シャルムの子、サドクの子、アヒトブの子、"
  2: "アヒヤの子、フィネエスの子、エリの子、アマリヤの子、アシエルの子、メライオフの子、アルの子、ウジヤの子、ボリフの子、アビシュイの子、フィネエスの子、エレアザルの子、"
  3: "アロンの子[こ]、レビの部族[ぶぞく]の者[もの]である。この者[もの]はメディアの地[ち]で、ペルシアの王[おう]アルタクセルクセスの治世[ちせい]に捕囚[ほしゅう]となった。"
  4: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  5: "「行[い]って、わたしの民[たみ]に彼らの悪[あ]しき行[おこな]いを、その子[こ]らに彼らの不法[ふほう]を告[つ]げよ。彼らがその子[こ]らの子[こ]らに告[つ]げるために。"
  6: "彼らの父祖[ふそ]の罪[つみ]は彼らのうちに育[そだ]った。彼らはわたしを忘[わす]れ、他[ほか]の神々[かみがみ]に犠牲[ぎせい]をささげたからである。"
  7: "わたしが彼らをエジプトの地[ち]から、奴隷[どれい]の家[いえ]から導[みちび]き出[だ]したのではないか。しかし彼らはわたしを怒[いか]らせ、わたしの計[はか]りを蔑[さげす]んだ。"
  8: "あなたは頭[あたま]の髪[かみ]を剃[そ]って、すべての災[わざわ]いを彼らの上[うえ]に投[な]げよ。彼らはわたしの律法[りっぽう]に聞[き]き従[したが]わなかったからである。彼らはしつけられていない民[たみ]である。"
  9: "いつまでわたしは彼らに耐[た]えるのか。彼らにはこれほど多[おお]くの善[ぜん]を行[おこな]ってやったのに。"
  10: "わたしは彼らのために多[おお]くの王[おう]たちを倒[たお]し、ファラオをそのしもべたち、その全[ぜん]軍[ぐん]勢[ぜい]とともに打[う]ち倒[たお]した。"
  11: "すべての異邦人[いほうじん]を彼らの前[まえ]から滅[ほろ]ぼし、東[ひがし]ではティルスとシドンの二[ふた]つの地方[ちほう]の民[たみ]を散[ち]らし、彼らの敵[てき]をことごとく打[う]ち殺[ころ]した。"
  12: "あなたは彼らにこう言[い]え。主[しゅ]はこう言[い]われる。"
  13: "わたしはあなたがたを海[うみ]を越[こ]えて導[みちび]き、初[はじ]めからあなたがたに良[よ]い道[みち]を備[そな]えた。あなたがたにモーセを導[みちび]き手[て]として、アロンを祭司[さいし]として与[あた]えた。"
  14: "火[ひ]の柱[はしら]のうちであなたがたに光[ひかり]を与[あた]え、あなたがたの間[あいだ]に大[おお]きな奇[き]跡[せき]を行[おこな]った。しかしあなたがたはわたしを忘[わす]れた、と主[しゅ]は言[い]われる。"
  15: "全能者[ぜんのうしゃ]である主[しゅ]はこう言[い]われる。うずらはあなたがたへのしるしとなった。わたしはあなたがたを守[まも]るために陣営[じんえい]を与[あた]えた。それなのにあなたがたはそこでもつぶやいた。"
  16: "わたしの名[な]のゆえに、あなたがたの敵[てき]に勝[か]ったことを喜[よろこ]ばず、ただ今日[こんにち]に至[いた]るまでつぶやいている。"
  17: "わたしがあなたがたに与[あた]えた恵[めぐ]みはどこにあるのか。荒[あ]れ野[の]で、あなたがたが飢[う]えたとき、わたしに叫[さけ]んだではないか。"
  18: "こう言[い]って。「なぜあなたはわたしたちをこの荒[あ]れ野[の]に連[つ]れて来[き]て、わたしたちを滅[ほろ]ぼそうとするのか。エジプト人[じん]に仕[つか]えていたほうが、この荒[あ]れ野[の]で死[し]ぬよりもよかった。」"
  19: "わたしはあなたがたの嘆[なげ]きを哀[あわ]れみ、あなたがたにマンナを食物[しょくもつ]として与[あた]えた。あなたがたは天使[てんし]のパンを食[た]べた。"
  20: "あなたがたが渇[かわ]いたとき、わたしは岩[いわ]を割[わ]らなかったか。水[みず]は満[み]ちあふれて流[なが]れた。暑[あつ]さのゆえに、わたしは木[き]の葉[は]であなたがたを覆[おお]った。"
  21: "わたしはあなたがたに豊[ゆた]かな地[ち]を分[わ]け与[あた]え、カナン人[じん]、ペリジ人[じん]、ペリシテ人[じん]をあなたがたの前[まえ]から追[お]い出[だ]した。これ以上[いじょう]、わたしはあなたがたに何[なに]をしようか、と主[しゅ]は言[い]われる。"
  22: "全能者[ぜんのうしゃ]である主[しゅ]はこう言[い]われる。あなたがたが荒[あ]れ野[の]、アモリ人[じん]の川[かわ]のほとりで渇[かわ]き、わたしの名[な]をののしったとき、"
  23: "わたしはそのののしりのゆえにあなたがたに火[ひ]を送[おく]らず、木[き]を水[みず]に入[い]れて、その川[かわ]を甘[あま]くした。"
  24: "ヤコブよ、わたしはあなたに何[なに]をしようか。ユダよ、あなたは聞[き]き従[したが]おうとしなかった。わたしは他[ほか]の民[たみ]のもとへ移[うつ]り、彼らにわたしの名[な]を与[あた]えて、わたしの律法[りっぽう]を守[まも]らせよう。"
  25: "あなたがたがわたしを捨[す]てたので、わたしもあなたがたを捨[す]てる。あなたがたのためにわたしに憐[あわ]れみを求[もと]める者[もの]を、わたしは憐[あわ]れまない。"
  26: "あなたがたがわたしを呼[よ]んでも、わたしは聞[き]かない。あなたがたはその手[て]を血[ち]で汚[けが]し、その足[あし]は人[ひと]を殺[ころ]すことに速[はや]いからである。"
  27: "あなたがたはわたしを捨[す]てたのではなく、あなたがた自身[じしん]を捨[す]てたのだ、と主[しゅ]は言[い]われる。"
  28: "全能者[ぜんのうしゃ]である主[しゅ]はこう言[い]われる。わたしは父[ちち]が子[こ]らに、母[はは]が娘[むすめ]たちに、乳母[うば]がその幼[おさな]子[ご]にするように、あなたがたに願[ねが]い求めなかったか。"
  29: "あなたがたがわたしの民[たみ]となり、わたしがあなたがたの神[かみ]となり、あなたがたがわたしの子[こ]らとなり、わたしがあなたがたの父[ちち]となるために。"
  30: "わたしはそこで、雌鳥[めんどり]がそのひなを翼[つばさ]の下[した]に集[あつ]めるように、あなたがたを集[あつ]めた。それなのに、今[いま]、わたしはあなたがたに何[なに]をしようか。わたしはあなたがたをわたしの顔[かお]から退[しりぞ]けよう。"
  31: "あなたがたがわたしに供[そな]え物[もの]をささげても、わたしはあなたがたから顔[かお]を背[そむ]ける。わたしはあなたがたの祭[まつ]りの日[ひ]と新月[しんげつ]と割礼[かつれい]を退[しりぞ]けたからである。"
  32: "わたしはわたしのしもべである預言者[よげんしゃ]たちをあなたがたに遣[つか]わした。あなたがたは彼らを捕[と]らえて殺[ころ]し、その体[からだ]を引[ひ]き裂[さ]いた。わたしは彼らの血[ち]を求[もと]める、と主[しゅ]は言[い]われる。"
  33: "全能者[ぜんのうしゃ]である主[しゅ]はこう言[い]われる。あなたがたの家[いえ]は荒[あ]れ果[は]てている。わたしはあなたがたを、風[かぜ]がもみがらを吹[ふ]き散[ち]らすように散[ち]らす。"
  34: "その子[こ]らは子孫[しそん]を生[う]まない。彼らはわたしの戒[いまし]めを蔑[さげす]み、わたしの前[まえ]に悪[あく]とされることを行[おこな]ったからである。"
  35: "わたしはあなたがたの家[いえ]を、来[きた]るべき民[たみ]に渡[わた]す。彼らはわたしを聞[き]かずにわたしを信[しん]じ、わたしがしるしを示[しめ]さなかった者[もの]たちが、わたしが命[めい]じたことを行[おこな]う。"
  36: "彼らは預言者[よげんしゃ]たちを見[み]なかったが、自分[じぶん]たちの不法[ふほう]を思[おも]い起[おこ]す。"
  37: "わたしは来[きた]るべき民[たみ]に恵[めぐ]みを証[あかし]する。その子[こ]らは、肉[にく]の目[め]でわたしを見[み]ずに、霊[れい]でわたしが言[い]ったことを信[しん]じて、喜[よろこ]びをもって楽[たの]しむ。"
  38: "そして今[いま]、兄弟[きょうだい]よ、どんな栄光[えいこう]があるかを見[み]よ。東[ひがし]から来[く]る民[たみ]を見[み]よ。"
  39: "わたしは彼らに、アブラハム、イサク、ヤコブを、またホセア、アモス、ミカ、ヨエル、オバデヤ、ヨナを、導[みちび]き手[て]として与[あた]える。"
  40: "またナホム、ハバクク、ゼパニヤ、ハガイ、ゼカリヤ、マラキを。この者[もの]は主[しゅ]の天使[てんし]とも呼[よ]ばれた。」"
notes:
  1: "слав. «Книга ездры пророка вторая, сына сараиева…» — это надписание (заголовок) книги, а не стих; в csl-ru и ru оно входит в счёт стихов, поэтому переведено ст. 1. Родословие: слав. «сына сараиева, сына азариева, сына елкиева, сына саданиева, сына садокова, сына ахитова», ru — Сераии, Азарии, Хелкии, Шаллума, Садока, Ахитува. Имена даны в синодальной форме: サライ, アザリヤ, ヒルキヤ, シャルム, サドク, アヒトブ."
  2: "слав. «сына ахиева, сына финеесова, сына елиева, сына америева, сына асиелева, сына маримофова, сына арнаева, сына озиева, сына ворифова, сына ависеева, сына финеесова, сына елеазарова»; ru — Ахии, Финееса, Илия, Амарии, Асиела, Мерайофа, Арна, Уззии, Ворифа, Авишуя, Финееса, Елеазара. «Елиев» — Илий (первосвященник, 1 Цар), передан как エリ, чтобы не путать с Илиёй-пророком."
  3: "слав. «от колена левиина, иже бысть юзником в земли мидстей, в царство артаксеркса царя персскаго» — «узник» (пленник), ru «был пленником в стране Мидийской». «Иже» — относительное местоимение, в японском слито с предыдущей фразой. Артаксеркс — アルタクセルクセス."
  4: "слав. «И бысть слово Господне ко мне, сице глаголющее» — формула ввода пророческой речи; в японском — 臨[のぞ]んで言[い]った, как в остальных книгах корпуса."
  5: "слав. «иди и возвести людем моим злая дела их и сыном их лукавствия, яже противу мене сотвориша, да возвестят сыном сынов своих» — «лукавствия» здесь не «коварство», а беззакония (ἀνομία); «противу мене» — против Меня. «Да возвестят» — цель: чтобы передали дальше. В ru то же."
  6: "слав. «яко греси родителей их возрастоша в них» — «грехи родителей возросли в них» (образ роста, ср. Мф 23:32); ru «грехи родителей их возросли в них». «Пожроша» — принесли жертву (жрети), не «пожрали»."
  7: "слав. «еда не аз изведох их из земли египетския из дому работы» — риторический вопрос с еда (ли); «дом работы» — дом рабства. «Советы моя уничижиша» — презрели Мои советы (замыслы)."
  8: "слав. «остризи власы главы твоея и верзи на них вся злая» — обряд плача и обличения: остричь волосы и бросить их на них; ru «остриги волосы… и брось на них все злое». «Людие… ненаказанни» — народ необузданный, не вразумлённый; передано как しつけられていない民."
  9: "слав. «доколе терплю им, имже толикая благодеяния сотворих» — «доколе терплю им» = до каких пор Я их терплю; «имже» — дат. «которым». В ru «Доколе Я буду терпеть их, которым сделал столько благодеяний?»"
  10: "слав. «низложих ради их множество царей» — «ради них» (за них) низложил; ru «Ради них Я многих царей низложил». «Поразих фараона с людьми его и со всеми вои его» — с рабами/народом его и всем войском."
  11: "слав. «вся языки от лица их погубих, и на востоце двух стран людий, тирских и сидонских, разсыпах» — «на востоке народ двух областей, Тирской и Сидонской, рассеял»; ru «народ двух областей, Тира и Сидона, рассеял». «Языки» — народы, не «языки» в смысле речи."
  12: "слав. «Ты же глаголи к ним сице: тако глаголет Господь» — поручение Ездре возвестить; далее в слав. без кавычек идёт сама речь Господа, поэтому в японском она остаётся внутри того же 「…」, а формула — без отдельной кавычки (в слав. тоже нет разметки)."
  13: "слав. «аз вы преведох сквозе море и уготовах вам путь благ из начала» — «провёл вас через море и от начала приготовил вам добрый путь»; ru иначе: «по дну его проложил вам огражденную улицу» (масоретско-синодальный образ). Держим слав. «путь благ». «Моисеа вожда и аарона во иереа» — Моисея вождём, Аарона священником."
  14: "слав. «дах вам свет во столпе огнене» — свет в огненном столпе (Исх 13:21); «сотворих в вас чудеса велия» — «в вас» = среди вас. «Рече Господь» внутри речи — формула, в японском внутри того же 「…」."
  15: "слав. «крастеле быша вам во знамение» — перепелы (крастель) были вам в знамение; ru «перепелы были вам в знамение». «Дах вам полки в защищение» — полки (ополчения) для защиты; в Исх речь о станах, но слав. «полки» — отряды. «И тамо роптасте» — и там роптали."
  16: "слав. «и не радовастеся о имени моем, о победе врагов ваших» — «не радовались имени Моему, победе [над] врагами вашими»; родительный «врагов» двусмыслен (победа врагов / победа над врагами), в ru «о погибели врагов ваших». Переведено по слав.: радость о победе над врагами. «Даже и доныне» — до сего дня."
  17: "слав. «где суть благодеяния, яже сотворих вам? не в пустыни ли, егда возалкасте, возописте ко мне» — вопрос и продолжение: «не в пустыне ли… вопияли ко Мне»; в слав. фраза не закончена и переходит в ст. 18 (речь народа). В японском тоже оставлено незакрытым, как в слав."
  18: "слав. «чесо ради нас в пустыню сию привел еси погубити нас? лучше нам бе работати египтяном, нежели умрети в пустыни сей» — слова народа (Исх 14:11–12; 16:3), в 『…』, как вложенная речь. «Работати» — служить, быть в рабстве."
  19: "слав. «аз ужалехся стенаний ваших» — «ужалихся» здесь «сжалился, умилосердился» (жалити — жалеть), не «ужаснулся»; ru «Я сжалился на стенания ваши». «Хлеб ангелскии ядосте» — ели хлеб ангельский (Пс 77:25), отсюда 天使のパン."
  20: "слав. «не разсекох ли камене, и потекоша воды в сытости» — рассек камень, воды потекли в изобилии; «зноя ради листвием древес вас покрывах» — от зноя покрывал листьями деревьев. В ru «от зноя покрывал вас листьями древесными»."
  21: "слав. «разделих вам земли обилны, хананеов и ферезеов и филистимлян от лица вашего извергох» — разделил тучные земли, Хананеев, Ферезеев и Филистимлян изгнал от лица вашего; ru так же. Имена: カナン人, ペリジ人 (Ферезеи), ペリシテ人 (по корпусу, не フィリスティ)."
  22: "слав. «егда в пустыни бесте на реце аморрейсте жаждуще и хуляще имя мое» — «на реке Аморрейской»; ru «на реке Мерры» (Исх 15:23): слав. называет реку по народу, ru — по горечи вод. Держим слав. «Аморрейская», в скобках не поясняем."
  23: "слав. «не огнь вам за хуления дах, но вложив древо в воду, сладку сотворих реку» — не огонь послал за хулу, но, вложив дерево в воду, сделал реку сладкой (Исх 15:25). «Дах» здесь «послал, дал», а не «дал в награду»."
  24: "слав. «что тебе сотворю, иакове? не восхотел еси послушати, иудо: преселюся ко иным языком и дам им имя мое» — «преселюся» — переселюсь, уйду; «иным языком» — другим народам. В ru «Переселюсь к другим народам и дам им имя Мое»."
  25: "слав. «понеже остависте мя, и аз вас оставлю: просящих вас от мене милости не помилую» — «просящих вас от мене милости» = просящих у Меня милости для вас (вин. «вас» при «просящих»); ru «просящих у Меня милости не помилую». Смысл: ходатаев за вас не помилую."
  26: "слав. «егда призовете мя, аз не услышу вы» — «вы» = вас (вин. мн. в слав. совпадает с им.); «осквернисте бо руце ваши кровию» — осквернили руки кровью; «нозе ваши скоры суть во еже сотворити человекоубийства» — ноги быстры на человекоубийство (Притч 1:16; Рим 3:15)."
  27: "слав. «не яко мене остависте, но вас самих» — «вы оставили не Меня, а самих себя»; ru «Вы как бы не Меня оставили, а вас самих». «Яко» здесь изъяснительное «что», не «как»."
  28: "слав. «еда аз вас не молих, яко отец сыны и яко мати дщерей и яко доилица отрочат своих» — «не Я ли умолял вас, как отец сыновей, как мать дочерей, как кормилица детей своих»; «молих» — просил, умолял, не «молился»."
  29: "слав. «да будете ми в люди, и аз вам в Бога, и вы мне в сыны, и аз вам во отца» — формула завета (Лев 26:12; Иер 31:33); «в люди», «в Бога» — дат. принадлежности с предлогом «в»: «чтобы вы были Мне народом». В японском — となる, чтобы сохранить параллелизм четырёх членов."
  30: "слав. «тамо вас собирах, якоже кокош птенцы своя под криле свои» — «кокош» — курица, наседка; образ Мф 23:37. «Ныне же что сотворю вам? отвергу вы от лица моего» — «отвергу» — отвергну, отрину."
  31: "слав. «приношение егда мне принесете, отвращу лице мое от вас» — приношение (жертва-дар, не всесожжение); «дни бо праздничныя ваша и новом(с)чия и обрезания отвергох» — праздники, новомесячия и обрезания отверг (Ис 1:13–14). Скобки в слав. «новом(с)чия» — редакционные, в текст не переносились."
  32: "слав. «аз послах отроки моя пророки к вам, ихже емше убисте, и растнисте телеса их» — «емше» — схватив; «растнисте» — растерзали (растнити). «Ихже крове взыщу» — кровь их взыщу (Быт 9:5). ru «умертвили и растерзали тела их»."
  33: "слав. «дом ваш пустъ есть, помещу вас яко ветр плевы» — «помещу» здесь «развею, разметаю» (от метати), не «помещу» в смысле «положу»; ru «Развею вас, как ветер мякину». «Плевы» — мякина, полова."
  34: "слав. «и сынове порождения не сотворят» — «сыновья не произведут потомства» (порождение — рождение, потомство); «понеже заповедь мою презреша» — презрели заповедь. В ru «сыновья не будут иметь потомства»."
  35: "слав. «предам домы ваша людем грядущим, иже мя не слышавше уверуют» — предам дома ваши людям грядущим, которые, не слышав Меня, уверуют; «имже знамений не явих, сотворят, яже повелех» — которым Я не явил знамений, они исполнят, что Я повелел. Тема «уверовавших не видев» (Ин 20:29)."
  36: "слав. «пророков не видеша, а воспомянут беззакония своя» — пророков не видели, но вспомнят свои беззакония; ru «не видев пророков, воспомянут о своих беззакониях». «Воспомянут» — вспомнят, приведут на память."
  37: "слав. «засвидетелствую людий грядущих благодать» — «свидетельствую благодать людям грядущим» (засвидетелствовати — засвидетельствовать, завещать); «ихже отроцы веселятся с радостию» — их дети веселятся с радостью; «мене не видяще очесы плотскими, но духом верующе» — не видя Меня плотскими очами, но веруя духом."
  38: "слав. «и ныне, брате, смотри, кая слава, и виждь люди приходящия от востока» — обращение к «брату» (Ездре? ангелу?); в слав. и ru без пояснения, кто брат, — не добавлено. «Кая слава» — какая слава."
  39: "слав. «имже дам началство авраамле, исааково и иаковле, и осиино и амосово, и михеино и иоилево, и авдиино и ионино» — «началство» — начальство, водительство; притяжательные «авраамле…» — «Авраамово, Исааково…». В ru «дам в вожди Авраама, Исаака и Иакова, и Осию, и Амоса, и Михея, и Иоиля, и Авдия, и Иону». Праотцы и пророки — вожди грядущего народа."
  40: "слав. «и наумово и аввакумово, софониино, аггеево, захариино и малахиино, иже и ангел Господень наречеся» — продолжение списка; «иже и ангел Господень наречеся» — «который и Ангелом Господним назван» (о Малахии: имя значит «вестник Мой», ср. Мал 3:1). В ru «который наречен и Ангелом Господним»."
