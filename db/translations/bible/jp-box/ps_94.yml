verses:
  1: "ダビデの賛歌[さんか]。さあ、主[しゅ]に向[む]かって喜[よろこ]び歌[うた]おう。わたしたちの救[すく]いの神[かみ]に向[む]かって叫[さけ]ぼう。"
  2: "感謝[かんしゃ]をもって主[しゅ]の顔[かお]の前[まえ]に進[すす]み、歌[うた]をもって主[しゅ]に向[む]かって叫[さけ]ぼう。"
  3: "主[しゅ]は大[おお]いなる神[かみ]、すべての神[かみ]々[がみ]の上[うえ]にある大[おお]いなる王[おう]である。"
  4: "地[ち]の果[は]ては主[しゅ]の手[て]のうちにあり、山[やま]の頂[いただき]も主[しゅ]のものである。"
  5: "海[うみ]は主[しゅ]のもの、主[しゅ]がこれを造[つく]られた。乾[かわ]いた地[ち]も、主[しゅ]の手[て]が形[かたち]づくられた。"
  6: "さあ、ひれ伏[ふ]して拝[おが]もう。わたしたちを造[つく]られた主[しゅ]の前[まえ]で泣[な]こう。"
  7: "主[しゅ]はわたしたちの神[かみ]、わたしたちはその牧[まき]の民[たみ]、その手[て]の羊[ひつじ]である。きょう、あなたがたがその声[こえ]を聞[き]くなら、"
  8: "「あなたがたの心[こころ]をかたくなにしてはならない。荒野[こうや]での試[こころ]みの日[ひ]、あの逆[さか]らうときのように。"
  9: "そこであなたがたの父[ちち]たちはわたしを試[こころ]み、わたしをためし、わたしのわざを見[み]た。"
  10: "わたしは四十年[よんじゅうねん]の間[あいだ]、あの世代[せだい]に腹[はら]を立[た]てて言[い]った。『彼[かれ]らはいつも心[こころ]が迷[まよ]い、わたしの道[みち]を知[し]らなかった』と。"
  11: "だから、わたしは怒[いか]りのうちに誓[ちか]った。『彼[かれ]らはわたしの安息[あんそく]に入[はい]ることはない』」。"

notes:
  1: "Надписание (прежний ст. 0, влит в этот стих): Αἶνος ᾠδῆς τῷ Δαυιδ — «Хвала песни Давиду»; 賛歌 (αἶνος — «хвала»), как в Пс 47 и 92. Надписание влито в ст. 1. Стих: Δεῦτε ἀγαλλιασώμεθα τῷ κυρίῳ — さあ、主に向かって喜び歌おう (δεῦτε — «идите, ну»; ἀγαλλιάομαι — «ликовать»). ἀλαλάξωμεν τῷ θεῷ τῷ σωτῆρι ἡμῶν — わたしたちの救いの神に向かって叫ぼう (ἀλαλάζω — «издавать клич»; σωτήρ — 救いの神)."
  2: "προφθάσωμεν τὸ πρόσωπον αὐτοῦ ἐν ἐξομολογήσει — 感謝をもって主の顔の前に進み (προφθάνω — «предварять, приходить навстречу»; ἐξομολόγησις — «славословие, благодарение»). ἐν ψαλμοῖς ἀλαλάξωμεν αὐτῷ — 歌をもって主に向かって叫ぼう (ψαλμός — 歌)."
  3: "θεὸς μέγας κύριος — 主は大きなる神. βασιλεὺς μέγας ἐπὶ πάντας τοὺς θεούς — すべての神々の上にある大きなる王 (βασιλεύς — 王; ἐπί — «над»)."
  4: "ἐν τῇ χειρὶ αὐτοῦ τὰ πέρατα τῆς γῆς — 地の果ては主の手のうちにあり (πέρας — «предел»). τὰ ὕψη τῶν ὀρέων αὐτοῦ εἰσιν — 山の頂も主のものである (ὕψος — «высота»; ὄρος — 山)."
  5: "αὐτοῦ ἐστιν ἡ θάλασσα, καὶ αὐτὸς ἐποίησεν αὐτήν — 海は主のもの、主がこれを造られた. τὴν ξηρὰν αἱ χεῖρες αὐτοῦ ἔπλασαν — 乾いた地も、主の手が形づくられた (ξηρά — «суша»; πλάσσω — «лепить, образовывать»)."
  6: "δεῦτε προσκυνήσωμεν καὶ προσπέσωμεν αὐτῷ — さあ、ひれ伏して拝もう (προσκυνέω — 拝む; προσπίπτω — «припадать»). κλαύσωμεν ἐναντίον κυρίου τοῦ ποιήσαντος ἡμᾶς — わたしたちを造られた主の前で泣こう (κλαίω — 泣く; слав. «восплачем»)."
  7: "αὐτός ἐστιν ὁ θεὸς ἡμῶν — 主はわたしたちの神. ἡμεῖς λαὸς νομῆς αὐτοῦ — わたしたちはその牧の民 (νομή — «пастбище, пажить»). πρόβατα χειρὸς αὐτοῦ — その手の羊 (πρόβατον — 羊). σήμερον, ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε — きょう、あなたがたがその声を聞くなら (σήμερον — きょう; вводит речь Бога, которая идёт с 8-го стиха)."
  8: "μὴ σκληρύνητε τὰς καρδίας ὑμῶν — あなたがたの心をかたくなにしてはならない (σκληρύνω — «ожесточать»). ὡς ἐν τῷ παραπικρασμῷ — あの逆らうときのように (παραπικρασμός — «ропот, огорчение»; в евр. «как в Мериве», отсюда у jp-joc メリワ). κατὰ τὴν ἡμέραν τοῦ πειρασμοῦ ἐν τῇ ἐρήμῳ — 荒野での試みの日 (πειρασμός — 試み; ἔρημος — 荒野). С этого стиха говорит Бог — 「」."
  9: "οὗ ἐπείρασαν οἱ πατέρες ὑμῶν — そこであなたがたの父たちはわたしを試み (πειράζω — «искушать»). ἐδοκίμασαν καὶ εἴδοσαν τὰ ἔργα μου — わたしをためし、わたしのわざを見た (δοκιμάζω — «испытывать»)."
  10: "τεσσαράκοντα ἔτη προσώχθισα τῇ γενεᾷ ἐκείνῃ — わたしは四十年の間、あの世代に腹を立てて (προσοχθίζω — «гневаться, быть недовольным»). καὶ εἶπα Ἀεὶ πλανῶνται τῇ καρδίᾳ — 言った、『彼らはいつも心が迷い』と (ἀεί — «всегда»; πλανάομαι — «блуждать»). αὐτοὶ οὐκ ἔγνωσαν τὰς ὁδούς μου — わたしの道を知らなかった. Слова Бога внутри речи Бога — 『…』."
  11: "ὡς ὤμοσα ἐν τῇ ὀργῇ μου — だから、わたしは怒りのうちに誓った (ὀμνύω — «клясться»). Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου — 『彼らはわたしの安息に入ることはない』 (клятвенная формула «εἰ…» означает отрицание, слав. «аще внидут»; κατάπαυσις — 安息). Речь Божия закрывается 」."
