verses:
  1: "シバの女王[じょおう]はソロモンの名[な]を聞[き]いて、なぞによって彼[かれ]を試[ため]すために、非常[ひじょう]に大[おお]きな勢[いきお]いを伴[ともな]ってエルサレムに来[き]た。らくだは香[こう]と多[おお]くの金[きん]と貴[とうと]い石[いし]を運[はこ]んでいた。彼女[かのじょ]はソロモンのもとに来て、自分[じぶん]の心[こころ]にあるすべてのことを彼に語[かた]った。"
  2: "ソロモンは彼女[かのじょ]のすべての言葉[ことば]に答[こた]えた。ソロモンから漏[も]れた言葉はなく、彼女に告[つ]げなかったものはなかった。"
  3: "シバの女王[じょおう]はソロモンの知恵[ちえ]と、彼[かれ]が建[た]てた家[いえ]を見[み]た。"
  4: "また、その食卓[しょくたく]の食物[しょくもつ]、僕[しもべ]たちの座[ざ]、奉仕者[ほうししゃ]たちの立[た]ち居[い]振[ふ]る舞[まい]、彼らの衣装[いしょう]、酌人[くみびと]たちとその装[よそお]い、また彼が主[しゅ]の家[いえ]で献[ささ]げる燔祭[はんさい]を見て、彼女は我[われ]を失[うしな]った。"
  5: "彼女[かのじょ]は王[おう]に言[い]った。「わたしが自分[じぶん]の国[くに]であなたの言葉[ことば]とあなたの知恵[ちえ]について聞[き]いたことは、真実[しんじつ]であった。"
  6: "しかし、わたしはその言葉[ことば]を信[しん]じなかった。来[き]て、この目[め]で見[み]るまでは。そして、見なさい、あなたの知恵[ちえ]の多[おお]くの半分[はんぶん]も、わたしに告[つ]げられていなかった。あなたは、わたしが聞[き]いた噂[うわさ]にさらに加[くわ]えておられる。"
  7: "幸[しあわ]せなのは、あなたの人[ひと]々[びと]である。幸せなのは、いつもあなたの前[まえ]に立[た]って、あなたの知恵[ちえ]を聞[き]いているこれらの僕[しもべ]たちである。"
  8: "あなたの神[かみ]である主[しゅ]がほめたたえられますように。主はあなたを喜[よろこ]んで、ご自分[じぶん]の王座[おうざ]に、あなたの神である主のための王[おう]として着[つ]かせられた。あなたの神である主がイスラエルを愛[あい]し、永遠[えいえん]にこれを立[た]たせるために、あなたを彼[かれ]らの上[うえ]に王として置[お]き、裁[さば]きと正[ただ]しさを行[おこな]わせるようにされたからである。」"
  9: "彼女[かのじょ]は王[おう]に金[きん]百二十[ひゃくにじゅう]タラントと、多[おお]くの香[こう]と貴[とうと]い石[いし]を贈[おく]った。シバの女王[じょおう]がソロモン王に贈ったほどの香は、二度[にど]と来[こ]なかった。"
  10: "また、ヒラムの僕[しもべ]たちとソロモンの僕たちは、ソロモンに金[きん]を運[はこ]んできた。"
  11: "王[おう]はその木[き]で、主[しゅ]の家[いえ]と王の家のために階段[かいだん]を造[つく]り、また歌[うた]い手[て]たちのために竪琴[たてごと]と琴[こと]を造った。このようなものは、以前[いぜん]ユダの地[ち]で見[み]られたことがなかった。"
  12: "ソロモン王[おう]は、シバの女王[じょおう]が望[のぞ]み、求[もと]めたすべてのものを、彼女[かのじょ]がソロモン王に持[も]って来[き]たすべてのもののほかに与[あた]えた。そして彼女は自分[じぶん]の国[くに]へ帰[かえ]って行[い]った。"
  13: "ソロモンのもとに一年[いちねん]に来[き]た金[きん]の重[おも]さは、金六百六十六[ろっぴゃくろくじゅうろく]タラントであった。"
  14: "それは、服属[ふくぞく]する者[もの]たちと商人[しょうにん]たちが運[はこ]んで来[き]たもののほかであり、またアラビアのすべての王[おう]たちと、その地[ち]の太守[たいしゅ]たちも、ソロモン王に金[きん]と銀[ぎん]を運んできた。"
  15: "ソロモン王[おう]は、打[う]ち延[の]ばした金[きん]の大[おお]きな盾[たて]を二百[にひゃく]造[つく]った。一[ひと]つの盾に純金[じゅんきん]六百[ろっぴゃく]が用[もち]いられた。"
  16: "また、打[う]ち延[の]ばした金[きん]の盾[たて]を三百[さんびゃく]造[つく]り、一[ひと]つの盾に金三百[きんさんびゃく]を用[もち]いた。王[おう]はそれらをレバノンの森[もり]の家[いえ]に置[お]いた。"
  17: "王[おう]は象牙[ぞうげ]の大[おお]きな王座[おうざ]を造[つく]り、純金[じゅんきん]でそれを覆[おお]った。"
  18: "王座[おうざ]には六[むっ]つの段[だん]があり、金[きん]で結[むす]び合[あ]わされていた。座[ざ]の両側[りょうがわ]には肘掛[ひじか]けがあり、その肘掛けのそばに二頭[にとう]の獅子[しし]が立[た]っていた。"
  19: "また、六[むっ]つの段[だん]の上[うえ]に、こちら側[がわ]とあちら側に十二頭[じゅうにとう]の獅子[しし]が立っていた。このようなものは、どの王国[おうこく]にもなかった。"
  20: "ソロモン王[おう]の器[うつわ]はすべて金[きん]であり、レバノンの森[もり]の家[いえ]の器もすべて金で覆[おお]われていた。ソロモンの日[ひ]々[び]には、銀[ぎん]は数[かぞ]えられないものとされた。"
  21: "王[おう]の船[ふね]はヒラムの僕[しもべ]たちとともにタルシシュへ行[い]き、三年[さんねん]に一度[いちど]、タルシシュの船が王のもとに来[き]て、金[きん]と銀[ぎん]、象牙[ぞうげ]、猿[さる]を運[はこ]んできた。"
  22: "ソロモンは富[とみ]と知恵[ちえ]において、地[ち]のすべての王[おう]たちをしのいで大[おお]きくなった。"
  23: "地[ち]のすべての王[おう]たちは、ソロモンの顔[かお]を見[み]、神[かみ]が彼の心[こころ]に与[あた]えた知恵[ちえ]を聞[き]こうとして、彼を求[もと]めた。"
  24: "彼[かれ]らはそれぞれ、銀[ぎん]の器[うつわ]と金[きん]の器、衣[ころも]、スタクテ、香[こう]、馬[うま]と騾馬[らば]を、年[とし]ごとに贈[おく]り物[もの]として持[も]って来[き]た。"
  25: "ソロモンには戦車[せんしゃ]のための牝馬[ひんば]四万[よんまん]と、騎兵[きへい]一万二千[いちまんにせん]がいた。彼はそれらを戦車の町[まち]々[まち]に、また王[おう]とともにエルサレムに置[お]いた。"
  26: "彼[かれ]は川[かわ]からペリシテ人[じん]の地[ち]、エジプトの境[さかい]に至[いた]るまで、すべての王[おう]たちを治[おさ]めた。"
  27: "王[おう]はエルサレムで金[きん]と銀[ぎん]を石[いし]のように、杉[すぎ]の木[き]を低地[ていち]にあるいちじく桑[ぐわ]のように多[おお]くした。"
  28: "ソロモンに馬[うま]がエジプトから、またすべての地[ち]から運[はこ]ばれて来[き]た。"
  29: "ソロモンの残[のこ]りの言葉[ことば]、初[はじ]めのものも後[のち]のものも、見[み]よ、預言者[よげんしゃ]ナタンの言葉、シロ人[じん]アヒヤの言葉、また先見者[せんけんしゃ]ヨエルの幻[まぼろし]のうちに、ナバトの子[こ]ヤロブアムについて書[か]かれている。"
  30: "ソロモンはエルサレムで、全[ぜん]イスラエルの上[うえ]に四十年[よんじゅうねん]治[おさ]めた。"
  31: "ソロモンは父[ちち]たちとともに眠[ねむ]り、父ダビデの町[まち]に葬[ほうむ]られた。そしてその子[こ]レハブアムが彼の代[か]わりに王[おう]となった。"

notes:
  1: "βασίλισσα Σαβα — царица Савская (Σαβα, シバ; слав. «савска»; ср. 3 Цар 10:1). ἤκουσεν τὸ ὄνομα Σαλωμων — услышала имя Соломона; в ru «о славе Соломона» — масоретское чтение. πειράσαι ἐν αἰνίγμασιν — испытать загадками (πειράζω, αἴνιγμα), なぞ. δυνάμει βαρείᾳ σφόδρα — с весьма тяжкой силой, т. е. с большой свитой (δύναμις, βαρύς). κάμηλοι αἴρουσαι — верблюды, несущие (αἴρω). ἀρώματα, χρυσίον εἰς πλῆθος, λίθος τίμιος — благовония, золото во множестве, драгоценный камень. ὅσα ἐν τῇ ψυχῇ αὐτῆς — всё, что в душе её (слав. «в сердцы ея»)."
  2: "ἀνήγγειλεν — возвестил, изъяснил (ἀπαγγέλλω). οὐ παρῆλθεν λόγος — не прошло, не ускользнуло слово (παρέρχομαι; слав. «не прейде слово»). ὃν οὐκ ἀπήγγειλεν αὐτῇ — которого он не возвестил ей."
  3: "σοφία — мудрость (知恵). οἶκος ὃν ᾠκοδόμησεν — дом, который он построил (дворец, ср. 7:1–12; 3 Цар 10:4)."
  4: "βρῶμα — яство, пища (食卓の食物); καθέδρα παίδων — седалища слуг (καθέδρα, 座); στάσις λειτουργῶν — предстояние служителей (στάσις, λειτουργός); ἱματισμός — одежда (衣装); οἰνοχόοι — виночерпии (酌人); στολισμός — убранство (装い); ὁλοκαύτωμα — всесожжение (燔祭); ἐξ ἑαυτῆς ἐγένετο — «вышла из себя», была вне себя (слав. «вне себе бысть»). В ru «ход, которым он ходил в дом Господень» — масоретское чтение; в LXX и csl — всесожжения."
  5: "Ἀληθινὸς ὁ λόγος — истинно слово (ἀληθινός). ἤκουσα ἐν τῇ γῇ μου — услышала в земле моей. περὶ τῶν λόγων σου καὶ περὶ τῆς σοφίας σου — о словах твоих и о мудрости твоей; слав. «о словесех твоих»."
  6: "τοῖς λόγοις — словам (в csl «словесем их» — мн. ч. «их»); ἕως οὗ ἦλθον — доколе не пришла; εἶδον οἱ ὀφθαλμοί μου — увидели глаза мои; οὐκ ἀπηγγέλη μοι ἥμισυ τοῦ πλήθους — не возвещено мне и половины множества; προσέθηκας ἐπὶ τὴν ἀκοήν — приложил к слуху (προστίθημι, ἀκοή), т. е. превзошёл молву."
  7: "μακάριοι οἱ ἄνδρες — блаженны мужи твои (ἀνήρ; слав. «блажени мужие твои»), т. е. твои люди; в ru и МТ «блаженны жёны твои». οἱ παῖδες οἱ παρεστηκότες — рабы, предстоящие (παρίστημι); διὰ παντός — всегда; ἀκούουσιν σοφίαν σου — слышат мудрость твою."
  8: "ἔστω … ηὐλογημένος — да будет благословен (оптатив γίνομαι). ἠθέλησέν σοι — благоволил о тебе. δοῦναί σε ἐπὶ θρόνον αὐτοῦ εἰς βασιλέα τῷ κυρίῳ θεῷ σου — посадить тебя на престол Свой в царя Господу Богу твоему. ἐν τῷ ἀγαπῆσαι κύριον … τὸν Ισραηλ — за то, что возлюбил Господь Израиля; τοῦ στῆσαι αὐτὸν εἰς αἰῶνα — чтобы утвердить его навек (ἵστημι). ποιῆσαι κρίμα καὶ δικαιοσύνην — творить суд и правду."
  9: "ἑκατὸν εἴκοσι τάλαντα χρυσίου — 120 талантов золота (τάλαντον, タラント). ἀρώματα εἰς πλῆθος πολύ — благовоний во множестве великом. οὐκ ἦν κατὰ τὰ ἀρώματα ἐκεῖνα — не было подобных тем благовониям."
  10: "В гр. порядок «слуги Соломона и слуги Хирама» (καὶ οἱ παῖδες Σαλωμων καὶ οἱ παῖδες Χιραμ); в csl наоборот — «раби хирамовы с рабы соломоними». Гр. продолжает: ἔφερον χρυσίον … ἐκ Σουφιρ καὶ ξύλα πεύκινα καὶ λίθον τίμιον — приносили золото из Суфира (Офира) и дерево певговое, и камень драгоценный; в csl только «злато … драгое», поэтому в тексте по csl, LXX-добавление здесь. Стих в критическом издании в квадратных скобках как дублет 3 Цар 9:26–28, но в базе он есть — 〔…〕 не ставим."
  11: "ξύλα πεύκινα — певговое (пихтовое, корабельное) дерево (слав. «от древ певговых»); ἀναβάσεις — ступени, лестницы (ἀνάβασις); κιθάρα καὶ νάβλα — кинира и набла (竪琴, 琴); ᾠδοί — певцы (歌い手); οὐκ ὤφθησαν τοιαῦτα ἔμπροσθεν — не видано было такого прежде. Стих также в квадратных скобках (дублет), в базе есть."
  12: "θελήματα — желания (θέλημα); ἃ ᾔτησεν — которые попросила (αἰτέω); ἐκτὸς πάντων, ὧν ἤνεγκεν — сверх всего, что принесла (ἐκτός). ἀπέστρεψεν εἰς τὴν γῆν αὐτῆς — возвратилась в землю свою. В ru добавлено «она и слуги ее» — в LXX и csl нет."
  13: "σταθμός — вес (σταθμός). ἑξακόσια ἑξήκοντα ἓξ τάλαντα — 666 талантов. ἐν ἐνιαυτῷ ἑνί — в один год, т. е. ежегодно."
  14: "πλὴν τῶν ἀνδρῶν τῶν ὑποτεταγμένων — кроме подвластных мужей (ὑποτάσσω); τῶν ἐμπορευομένων — торгующих (ἐμπορεύομαι); ὧν ἔφερον — что приносили; βασιλεῖς τῆς Ἀραβίας — цари Аравии; σατράπαι — сатрапы, наместники (太守)."
  15: "θυρεοὺς χρυσοῦς ἐλατούς — золотые кованые щиты (θυρεός — большой щит; ἐλατός — тянутый, кованый, 打ち延ばした). ἑξακόσιοι χρυσοῖ καθαροί — шестьсот золотых чистых; ἐπῆσαν ἐπὶ τὸν ἕνα θυρεόν — были на каждом щите. В ru «по шестисот сиклей» (МТ); в 3 Цар 10:16 — «копья», иное чтение."
  16: "ἀσπίδας ἐλατάς — кованые (малые) щиты (ἀσπίς); τριακοσίων χρυσῶν ἀνεφέρετο ἐπὶ τὴν ἀσπίδα ἑκάστην — по триста золотых на каждый щит; οἶκος δρυμοῦ τοῦ Λιβάνου — дом Ливанского леса (レバノンの森の家), ср. 3 Цар 10:17."
  17: "θρόνος ἐλεφάντινος ὀδόντων — престол из слоновых зубов, т. е. из слоновой кости (ἐλεφάντινος, ὀδούς); κατεχρύσωσεν — позолотил (χρυσόω); χρυσίον δόκιμον — золото испытанное, чистое (純金)."
  18: "ἀναβαθμοί — ступени (ἀναβαθμός); ἐνδεδεμένοι χρυσίῳ — связанные, скреплённые золотом (ἐνδέω; слав. «позлащени златом»); ἀγκῶνες — локотники, ручки (肘掛け); ἔνθεν καὶ ἔνθεν — с той и другой стороны; καθέδρα — седалище; λέοντες ἑστηκότες — стоящие львы."
  19: "δώδεκα λέοντες — двенадцать львов; ἐπὶ τῶν ἕξ ἀναβαθμῶν — на шести ступенях; οὐκ ἐγενήθη οὕτως ἐν πάσῃ βασιλείᾳ — не было так ни в одном царстве; в csl добавлено «престол»."
  20: "σκεύη — сосуды, утварь (器); κατειλημμένα χρυσίῳ — обложенные, заключённые золотом (καταλαμβάνω; слав. «златом окружены»); οὐκ ἦν ἀργύριον λογιζόμενον εἰς οὐθέν — серебро не вменялось ни во что (λογίζομαι)."
  21: "ναῦς — корабль; εἰς Θαρσις — в Фарсис (タルシシュ); ἅπαξ διὰ τριῶν ἐτῶν — раз в три года; γέμοντα — полные (γέμω); ὀδόντων ἐλεφαντίνων — слоновой кости; πιθήκων — обезьян (猿). В ru и МТ добавлены павлины, в LXX и csl их нет."
  22: "ἐμεγαλύνθη — возвеличился (μεγαλύνω); ὑπὲρ πάντας τοὺς βασιλεῖς — более всех царей; πλούτῳ καὶ σοφίᾳ — богатством и мудростью."
  23: "ἐζήτουν τὸ πρόσωπον Σαλωμων — искали лицо Соломона, т. е. стремились видеть его (ζητέω); ἧς ἔδωκεν ὁ θεὸς ἐν καρδίᾳ αὐτοῦ — которую дал Бог в сердце его."
  24: "σκεύη ἀργυρᾶ καὶ χρυσᾶ — сосуды серебряные и золотые; ἱματισμός — одежда; στακτή — стакти, благовонная смола (スタクテ); ἡδύσματα — благовония, пряности (香); ἵπποι καὶ ἡμίονοι — кони и мулы (騾馬); τὸ κατ᾽ ἐνιαυτὸν ἐνιαυτόν — из года в год. В ru добавлено «оружие» — в LXX и csl нет."
  25: "θήλειαι ἵπποι — кобылицы (θῆλυς, 牝馬); εἰς ἅρματα — для колесниц; τέσσαρες χιλιάδες — в LXX 4000, в csl «четыредесять тысящ» (40 000) — в тексте csl, греч. число здесь (ср. 3 Цар 10:26); ἱππέων — всадников (騎兵); πόλεις τῶν ἁρμάτων — города колесниц (戦車の町々)."
  26: "ἡγούμενος πάντων τῶν βασιλέων — вождь, правитель всех царей (ἡγέομαι); ἀπὸ τοῦ ποταμοῦ — от реки (Евфрата; в csl пояснение «евфрата» взято в скобки); ἀλλόφυλοι — иноплеменники, здесь филистимляне (ペリシテ人); ὅριον Αἰγύπτου — предел Египта."
  27: "συκάμινος — сикомор, тутовое дерево (いちじく桑); πεδινή — низменность (低地); εἰς πλῆθος — во множество. Слав. «яко черничие, еже (раждается) в полях» — тёмное место, скобки редакторские."
  28: "ἡ ἔξοδος τῶν ἵππων — «выход» коней, т. е. откуда их приводили (ἔξοδος); ἐξ Αἰγύπτου — из Египта; ἐκ πάσης τῆς γῆς — из всей земли."
  29: "κατάλοιποι λόγοι — остальные слова, т. е. дела (κατάλοιπος); ἐπὶ τῶν λόγων Ναθαν — в словах Нафана; Αχια τοῦ Σηλωνίτου — Ахии Силомлянина (シロ人); ἐν ταῖς ὁράσεσιν Ιωηλ τοῦ ὁρῶντος — в видениях Иоиля прозорливца (先見者, ὁρῶν); περὶ Ιεροβοαμ υἱοῦ Ναβατ — об Иеровоаме, сыне Наватовом."
  30: "ἐβασίλευσεν … ἐπὶ πάντα Ισραηλ — царствовал над всем Израилем; τεσσαράκοντα ἔτη — сорок лет. В csl добавлено «во Иерусалиме» — в LXX нет."
  31: "ἐκοιμήθη — почил, уснул (κοιμάω); ἔθαψαν — погребли (θάπτω); ἐν πόλει Δαυιδ τοῦ πατρὸς αὐτοῦ — в городе Давида, отца его; ἀντ᾿ αὐτοῦ — вместо него. Слав. «успе со отцы своими» — почил с отцами."
