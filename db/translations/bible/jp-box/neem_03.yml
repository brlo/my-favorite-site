# jp-box, Неемия, глава 3. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# слав. чтения и добавки входят в основной текст без 〔…〕, вариант LXX — в notes.
# ru (Синодальный) — только для понимания, не источник.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 3: список строителей стены и ворот (1–32), насмешки Санаваллата и Товии
# и молитва Неемии (33–37). В слав. и ру эти последние стихи отнесены к Неем 4:1–6,
# поэтому для 33–37 слав. стих = 4:(N−32); в греч. базе они стоят в ezd 13:33–37.
# Дефект LXX: в gr-lxx-byz стих 13:7 — одна точка (лакуна); 3:7 переведён по csl.
# Речь: Санаваллата — 「…」 (34); Товии и братьев — 「…」 (35); молитва — 「…」 (36–37).
# Красного нет. 〔…〕 нет.
# Сносок ⟨…⟩ нет: 城壁, 門, 塔, 大祭司, レビ, ネティニム уже в корпусе.
