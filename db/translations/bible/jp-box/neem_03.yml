verses:
  1: "大祭司[だいさいし]エリアシブとその兄弟[きょうだい]である祭司[さいし]たちは立[た]ち上[あ]がり、羊[ひつじ]の門[もん]を建[た]てた。彼[かれ]らはそれを聖別[せいべつ]し、その扉[とびら]を据[す]えた。すなわち百[ひゃく]キュビトの塔[とう]まで、ハナネルの塔[とう]まで聖別[せいべつ]した。"
  2: "その次[つぎ]には、エリコの人[ひと]たちが建[た]て、その次[つぎ]にはアマリの子[こ]ザクルの子[こ]らが建[た]てた。"
  3: "魚[さかな]の門[もん]は、アサナの子[こ]らが建[た]てた。彼[かれ]らはそれに屋根[やね]を架[か]け、その扉[とびら]、錠[じょう]、かんぬきを据[す]えた。"
  4: "その次[つぎ]には、ウリヤの子[こ]、アコスの子[こ]メラモトが建[た]てた。その次[つぎ]には、バラキヤの子[こ]、マセゼベルの子[こ]メシュラムが建[た]てた。その次[つぎ]には、バアナの子[こ]サドクが建[た]てた。"
  5: "その次[つぎ]には、テコアの人[ひと]たちが建[た]てた。しかし、彼[かれ]らの力[ちから]ある者[もの]たちは、自分[じぶん]たちの神[かみ]である主[しゅ]の仕事[しごと]に首[くび]を入[い]れなかった。"
  6: "古[ふる]い門[もん]は、パセクの子[こ]ヨイダと、ベソデヤの子[こ]メシュラムが建[た]てた。彼[かれ]らはそれに屋根[やね]を架[か]け、その扉[とびら]、錠[じょう]、かんぬきを据[す]えた。"
  7: "その次[つぎ]には、ギブオン人[じん]マルティヤと、メロノト人[じん]ヤドンが、ギブオンとミツパの人[ひと]たちとともに、川[かわ]の向[む]こうの太守[たいしゅ]の座[ざ]に至[いた]るまで建[た]てた。"
  8: "その次[つぎ]には、金細工師[きんざいくし]のハルハヤの子[こ]ウジエルが建[た]て、その次[つぎ]にはロケムの子[こ]ハナニヤが建[た]てた。彼[かれ]らはエルサレムを広[ひろ]い城壁[じょうへき]のところまで修復[しゅうふく]した。"
  9: "その次[つぎ]には、エルサレムの半[はん]地区[ちく]の長[おさ]レファヤが建[た]てた。"
  10: "その次[つぎ]には、エロマフの子[こ]イェダヤが自分[じぶん]の家[いえ]の前[まえ]を建[た]て、その次[つぎ]にはアシュバニヤの子[こ]アトシュが建[た]てた。"
  11: "次[つぎ]の区画[くかく]は、ハリムの子[こ]マルキヤと、パハト・モアブの子[こ]ハシュブが建[た]て、炉[ろ]の塔[とう]に至[いた]るまで及[およ]んだ。"
  12: "その次[つぎ]には、エルサレムの半[はん]地区[ちく]の長[おさ]であるハロヘシュの子[こ]シャルムが、自分[じぶん]と娘[むすめ]たちとで建[た]てた。"
  13: "谷[たに]の門[もん]は、ハヌンとザノアハの住民[じゅうみん]が建[た]てた。彼[かれ]らはそれを建[た]て、その扉[とびら]、錠[じょう]、かんぬきを据[す]え、城壁[じょうへき]を千[せん]キュビト、肥[こや]の門[もん]まで建[た]てた。"
  14: "肥[こや]の門[もん]は、ベト・ハケレム地区[ちく]の長[おさ]であるレハブの子[こ]マルキヤが、自分[じぶん]と子[こ]らとで建[た]てた。彼[かれ]らはそれに屋根[やね]を架[か]け、その扉[とびら]、錠[じょう]、かんぬきを据[す]えた。"
  15: "泉[いずみ]の門[もん]は、ミツパ地区[ちく]の長[おさ]であるコロホゼの子[こ]シャルムが建[た]てた。彼[かれ]はそれを建[た]てて屋根[やね]を架[か]け、その扉[とびら]、錠[じょう]、かんぬきを据[す]えた。また、王[おう]の庭[にわ]に面[めん]したシロアの池[いけ]の城壁[じょうへき]と、ダビデの町[まち]から下[くだ]る階段[かいだん]に至[いた]るまでを建[た]てた。"
  16: "その次[つぎ]には、ベト・ツルの半[はん]地区[ちく]の長[おさ]であるアズブクの子[こ]ネヘミヤが、ダビデの墓[はか]の園[その]のところまで、また掘[ほ]られた池[いけ]と勇士[ゆうし]たちの家[いえ]に至[いた]るまで建[た]てた。"
  17: "その次[つぎ]には、レビ人[びと]のバニの子[こ]ラウムが建[た]てた。その次[つぎ]には、自分[じぶん]の地区[ちく]のために、ケイラの半[はん]地区[ちく]の長[おさ]ハシャブヤが建[た]てた。"
  18: "その次[つぎ]には、彼[かれ]らの兄弟[きょうだい]たち、すなわちケイラの半[はん]地区[ちく]の長[おさ]であるヘナダドの子[こ]バンワイが建[た]てた。"
  19: "その次[つぎ]には、ミツパの長[おさ]であるイェシュアの子[こ]エゼルが、角[かど]に接[せっ]する登[のぼ]り口[ぐち]の塔[とう]に至[いた]る第二[だい]の区画[くかく]を建[た]てた。"
  20: "その次[つぎ]には、ザブダイの子[こ]バルクが、角[かど]から大祭司[だいさいし]エリアシブの家[いえ]の扉[とびら]に至[いた]るまで、第二[だい]の区画[くかく]を建[た]てた。"
  21: "その次[つぎ]には、ウリヤの子[こ]、アコスの子[こ]メラモトが、エリアシブの家[いえ]の扉[とびら]からその家[いえ]の端[はし]まで、第二[だい]の区画[くかく]を建[た]てた。"
  22: "その次[つぎ]には、周辺[しゅうへん]の者[もの]である祭司[さいし]たちが建[た]てた。"
  23: "その次[つぎ]には、ベニヤミンとハシュブが自分[じぶん]たちの家[いえ]の前[まえ]を建[た]てた。その次[つぎ]には、アナニヤの子[こ]、マアセヤの子[こ]アザルヤが自分[じぶん]の家[いえ]のそばを建[た]てた。"
  24: "その次[つぎ]には、ヘナダドの子[こ]ビヌイが、アザルヤの家[いえ]から角[かど]と曲[ま]がり角[かど]に至[いた]るまで、第二[だい]の区画[くかく]を建[た]てた。"
  25: "その次[つぎ]には、ウザイの子[こ]パラルが角[かど]の向[む]かいを建[た]てた。すなわち、王[おう]の家[いえ]の上[かみ]の部分[ぶぶん]から突[つ]き出[で]た、監獄[かんごく]の庭[にわ]に属[ぞく]する高[たか]い塔[とう]である。その次[つぎ]には、パロシュの子[こ]ペダヤが建[た]てた。"
  26: "オフェルに住[す]むネティニムは、東[ひがし]の水[みず]の門[もん]の庭[にわ]に至[いた]るまで、また突[つ]き出[で]た塔[とう]に至[いた]るまでであった。"
  27: "その次[つぎ]には、テコアの人[ひと]たちが、大[おお]きな突[つ]き出[で]た塔[とう]の向[む]かいからオフェルの城壁[じょうへき]に至[いた]るまで、第二[だい]の区画[くかく]を建[た]てた。"
  28: "馬[うま]の門[もん]の上[うえ]では、祭司[さいし]たちが、それぞれ自分[じぶん]の家[いえ]の向[む]かいを建[た]てた。"
  29: "その次[つぎ]には、イメルの子[こ]サドクが自分[じぶん]の家[いえ]の向[む]かいを建[た]てた。その次[つぎ]には、東[ひがし]の門[もん]の番人[ばんにん]であるシェカニヤの子[こ]シェマヤが建[た]てた。"
  30: "その次[つぎ]には、シェレミヤの子[こ]ハナニヤと、ツァラフの第六[だいろく]の子[こ]ハヌンが第二[だい]の区画[くかく]を建[た]てた。その次[つぎ]には、バラキヤの子[こ]メシュラムが自分[じぶん]の部屋[へや]の向[む]かいを建[た]てた。"
  31: "その次[つぎ]には、サラフィの子[こ]マルキヤが、ネティニムと商人[しょうにん]たちの家[いえ]のところまで、マフェカドの門[もん]の向[む]かいから角[かど]の部屋[へや]に至[いた]るまで建[た]てた。"
  32: "羊[ひつじ]の門[もん]の登[のぼ]り口[ぐち]の間[あいだ]では、鍛冶[かじ]たちと商人[しょうにん]たちが建[た]てた。"
  33: "サンバラトは、私[わたし]たちが城壁[じょうへき]を建[た]てていると聞[き]いて、それを不[ふ]快[かい]に思[おも]い、大[おお]いに怒[いか]ってユダの人[ひと]々[びと]を嘲笑[あざけ]った。"
  34: "彼[かれ]は自分[じぶん]の兄弟[きょうだい]たち、すなわちサマリアの軍勢[ぐんぜい]の前[まえ]で言[い]った。「このユダの人[ひと]々[びと]は、自分[じぶん]たちの町[まち]を建[た]てているのか。」"
  35: "アンモン人[じん]トビヤがそのそばに来[き]て、彼[かれ]らは互[たが]いに言[い]った。「彼[かれ]らは自分[じぶん]たちの場所[ばしょ]で犠牲[ぎせい]を献[ささ]げたり、食[た]べたりするだろうか。狐[きつね]が上[のぼ]って来[き]ても、彼[かれ]らの石[いし]の城壁[じょうへき]を崩[くず]すだろう。」"
  36: "私[わたし]たちの神[かみ]よ、聞[き]いてください。私[わたし]たちは嘲[あざけ]り者[もの]とされたからである。彼[かれ]らの嘲[あざけ]りを彼[かれ]らの頭[あたま]に返[かえ]し、捕囚[ほしゅう]の地[ち]で彼[かれ]らを嘲[あざけ]り者[もの]としてください。"
  37: "彼[かれ]らの不法[ふほう]を覆[おお]わないでください。"

notes:
  1: "Ελισουβ ὁ ἱερεὺς ὁ μέγας — Елияшив, великий [первосвященник] (слав. «елиасув священник великий»). τὴν πύλην τὴν προβατικήν — Овечьи ворота, 羊の門. ἡγίασαν — «освятили» (ἁγιάζω). ἕως πύργου τῶν ἑκατὸν — «до башни ста [локтей]» (слав. «до столпа ста лакот»); πύργος Ανανεηλ — башня Хананела (слав. «анамеиля»). Посвящение ворот и башен — обряд освящения стройки."
  2: "ἐπὶ χεῖρας — «подле, рядом» (букв. «на руку»), формула всего списка; передана その次には. υἱοὶ ἀνδρῶν Ιεριχω — «сыны мужей Иерихона». Ζακχουρ υἱὸς Αμαρι — Закхур, сын Имрия (слав. «аманиин», ру «Имрия»)."
  3: "πύλην τὴν ἰχθυηράν — Рыбные ворота (ἰχθυηρός — рыбный). υἱοὶ Ασανα — «сыны Асаны» (ру «уроженцы Сенаи»). ἐστέγασαν — «покрыли» (στεγάζω). κλεῖθρα — засовы, 錠; μοχλοί — запоры, かんぬき."
  4: "ἀπὸ Ραμωθ υἱὸς Ουρια υἱοῦ Ακως — «из Рамофа сын Урии, сына Аккоса» (слав. «из рамофы»; ру «Меремоф»): предлог ἀπό здесь неясен, вероятно «из [рода] Рамофа». Это тот же Меремоф, что в ст. 21 (Μεραμωθ), поэтому имя унифицировано. Μοσολλαμ — Мешуллам (слав. «мосоллам»), Βαραχιου — Берехия, Μασεζεβηλ — Мешизабел. Σαδωκ υἱὸς Βαανα — Садок, сын Бааны."
  5: "Θεκωιν — фекойцы, テコア人 (Θεκωε). αδωρηεμ — передача евр. אַדִּירִים «знатнейшие» (слово оставлено в LXX без перевода; слав. «сильнии»). οὐκ εἰσήνεγκαν τράχηλον αὐτῶν — «не вложили шеи своей» (слав. «не положиша выи своея»); εἰς δουλείαν αὐτῶν — «в служение их», слав. «в дело Господа Бога своего» — иное чтение."
  6: "πύλην τοῦ Ισανα — «ворота Исаны», т. е. Старые ворота (слав. «врата старая»); евр. יְשָׁנָה. Ιοιδα υἱὸς Φασεκ — Иоиада, сын Пасеаха (слав. «иоида сын фасеков»). Μεσουλαμ υἱὸς Βασωδια — Мешуллам, сын Бесодии."
  7: "Лакуна: в gr-lxx-byz на месте 13:7 стоит одна точка. Стих переведён по csl-ru; в масоретском тексте здесь Мелатия Гаваонитянин и Иадон из Меронофа. Слав. «малтиа гаваонитин» — Малтиа/Мелатия Гаваонитянин; «еварон миронофит» — Иадон Меронофитянин (ру «Иадон из Меронофа»). עד־כּסא פּחת עבר הנהר — «до престола наместника Заречья», т. е. до места, где чиновник вершил суд."
  8: "В LXX здесь только Ανανιας υἱὸς Ρωκειμ (Анания, сын Рокеима); Уззиил, сын Хархаии, серебряник (златарь) есть в слав. и в масоретском тексте, поэтому добавлен в основной текст. κατέλιπον Ιερουσαλημ ἕως τοῦ τείχους τοῦ πλατέος — «оставили Иерусалим до широкой стены»; слав. «возставиша Иерусалим даже до стены широкия». 金細工師 = серебряник/златарь."
  9: "Ραφαια — Рефаия (слав. «рафаиа»). ἄρχων ἡμίσους περιχώρου Ιερουσαλημ — «начальник половины округа Иерусалима» (περίχωρος — округ; слав. «началник половины окрестныя страны»); 半地区の長."
  10: "Ιεδαια υἱὸς Ερωμαφ — Иедаия, сын Харумафа. καὶ κατέναντι οἰκίας αὐτοῦ — «и против дома своего»: каждый чинил участок напротив собственного дома. Ατους υἱὸς Ασβανια — Хаттуш, сын Хашавнии."
  11: "δεύτερος — «второй [участок]» (слав. «вторую часть»), т. е. следующий, второй по счёту. Μελχια υἱὸς Ηραμ — Малхия, сын Харима; Ασουβ υἱὸς Φααθμωαβ — Хашшув, сын Пахаф-Моава. πύργου τῶν θαννουριμ — «башня печей» (θαννουρίμ — евр. «печи»), 炉の塔."
  12: "Σαλουμ υἱὸς Αλλωης — Шаллум, сын Галлохеша; αὐτὸς καὶ αἱ θυγατέρες αὐτοῦ — «он и дочери его»: редкое участие женщин в стройке; слав. «той и дщери его». "
  13: "Ανουν — Ханун (слав. «анун»); οἱ κατοικοῦντες Ζανω — жители Заноаха (слав. «обитающии в заноне»). χιλίους πήχεις — «тысячу локтей» (πῆχυς — локоть); 千キュビト. Ворота Долины = 谷の門; Навозные = 肥の門."
  14: "Μελχια υἱὸς Ρηχαβ — Малхия, сын Рехава; ἄρχων περιχώρου Βηθαχαρμ — начальник округа Беф-Карем (слав. «вифакрамския»); передано ベト・ハケレム по принятой форме. ἐσκέπασαν — «покрыли» (στεγάζω), в ст. 13–15 глагол ἠγίασαν/ἐσκέπασαν чередуется."
  15: "Σολομων υἱὸς Χαλεζε — в LXX имя искажено («Соломон, сын Халезея»; слав. «соломон сын халезеов»); по масоретскому тексту — Шаллум, сын Колхозея, поэтому シャルム, コロホゼ. τὸ τεῖχος κολυμβήθρας τῶν κωδίων — «стена водоёма кожевников» (κώδιον — овечья шкура; слав. «купели силоамли»); シロアの池 — по слав. чтению. κουρά τοῦ βασιλέως — «сад/участок царя» (слав. «вертограду цареву»), 王の庭."
  16: "Νεεμιας υἱὸς Αζαβουχ — Неемия, сын Азбука (не одноимённый автор). ἄρχων ἡμίσους περιχώρου Βηθσουρ — начальник половины округа Беф-Цур, ベト・ツル. ἕως κήπου τάφου Δαυιδ — «до сада гробницы Давида»; κολυμβήθρας τῆς γεγονυίας — «водоёма устроенного», 掘られた池; Βηθαγγαβαριμ — передано по слав. «дом сильных», 勇士たちの家 (евр. «дом храбрых»)."
  17: "Ραουμ υἱὸς Βανι — Рехум, сын Вания (слав. «раум»). Ασαβια — Хашавия; ἄρχων ἡμίσους περιχώρου Κειλα — начальник половины округа Кеила, ケイラ. τῷ περιχώρῳ αὐτοῦ — «за свой округ» (слав. «на стране своей»)."
  18: "μετ᾿ αὐτὸν — «за ним» (в ст. 17–25 чередуются μετ᾿ αὐτὸν и ἐπὶ χεῖρα; по-японски одинаково その次には). Βενι υἱὸς Ηναδαδ — Баввай/Биннуй, сын Хенадада (слав. «веней сын инададов»). ἀδελφοὶ αὐτῶν — «братья их»."
  19: "Αζουρ υἱὸς Ἰησοῦ — Езер, сын Иисуса (слав. «азур сын иисусов»); ἄρχων τοῦ Μασφε — начальник Мицфы. μέτρον δεύτερον — «вторая мера», т. е. второй участок (слав. «меру вторую»). πύργου ἀναβάσεως τῆς συναπτούσης τῆς γωνίας — «башни восхода, примыкающей к углу» (ἀνάβασις — подъём, лестница); 角に接する登り口の塔."
  20: "Βαρουχ υἱὸς Ζαβου — Варух, сын Забвая. ἀπὸ τῆς γωνίας ἕως θύρας Βηθελισουβ — «от угла до двери [дома] Елияшива»; Βηθελισουβ = «дом Елияшива» (בית אלישיב). τοῦ ἱερέως τοῦ μεγάλου — великого священника, 大祭司."
  21: "Μεραμωθ υἱὸς Ουρια υἱοῦ Ακως — Меремоф, сын Урии, сына Аккоса (ср. ст. 4). ἕως ἐκλείψεως Βηθελισουβ — «до конца [дома] Елияшива» (ἔκλειψις — исчезновение, конец; слав. «до конца дому елиасувова»)."
  22: "οἱ ἱερεῖς ἄνδρες Αχεχαρ — «священники, мужи Ахехара»: тёмное место, вероятно испорченное название местности. Слав. «священницы, мужие от поля (иорданска)» понято как «из окрестности»; ру «из окрестностей». Переведено по слав."
  23: "Βενιαμιν καὶ Ασουβ — Вениамин и Хашшув; κατέναντι οἴκου αὐτῶν — «против дома их». Αζαρια υἱὸς Μαασηα υἱοῦ Ανανια — Азария, сын Маасеи, сына Анании; ἐχόμενα οἴκου αὐτοῦ — «подле дома его»."
  24: "Βανι υἱὸς Ηναδαδ — Биннуй, сын Хенадада (слав. «ваней сын ададов»). ἀπὸ Βηθαζαρια — «от Беф-Азарии» (слав. «от дому азарии»), アザルヤの家. ἕως τῆς γωνίας καὶ ἕως τῆς καμπῆς — «до угла и до поворота» (καμπή — изгиб), 曲がり角."
  25: "Φαλαλ υἱοῦ Ευζαι — Фалал, сын Узая (слав. «фалах сын узаин»). ὁ πύργος ὁ ἐξέχων ἐκ τοῦ οἴκου τοῦ βασιλέως ὁ ἀνώτερος — «выступающая башня от дома царского, верхняя»; τῆς αὐλῆς τῆς φυλακῆς — «двора темницы», 監獄の庭. Φαδαια υἱὸς Φορος — Федаия, сын Пароша."
  26: "οἱ ναθινιμ — нефинеи, храмовые служители (נְתִינִים), ネティニム; в LXX слово оставлено без перевода. ἐν τῷ Ωφαλ — в Офеле (холм южнее храма), オフェル. ἕως κήπου πύλης τοῦ ὕδατος εἰς ἀνατολάς — «до сада Водяных ворот к востоку». καὶ ὁ πύργος ὁ ἐξέχων — «и выступающая башня»: обрывок фразы, продолженный в ст. 27."
  27: "οἱ Θεκωιν — фекойцы (ср. ст. 5); μέτρον δεύτερον — второй участок. ἐξ ἐναντίας τοῦ πύργου τοῦ μεγάλου τοῦ ἐξέχοντος — «напротив большой выступающей башни». ἕως τοῦ τείχους τοῦ Οφλα — «до стены Офела»."
  28: "ἀνώτερον πύλης τῶν ἵππων — «выше ворот Конских» (слав. «вышше врат конских»); 馬の門の上. ἀνὴρ ἐξ ἐναντίας οἴκου αὐτοῦ — «каждый напротив дома своего»."
  29: "Σαδδουκ υἱὸς Εμμηρ — Садок, сын Иммера. Σαμαια υἱὸς Σεχενια — Шемаия, сын Шехании; φύλαξ τῆς πύλης τῆς ἀνατολῆς — страж восточных ворот, 東の門の番人."
  30: "Ανανια υἱὸς Σελεμια — Ханания, сын Шелемии; Ανουμ υἱὸς Σελεφ ὁ ἕκτος — Ханун, шестой сын Целефа (слав. «аном сын селефов шестый»). ἐξ ἐναντίας γαζοφυλακίου αὐτοῦ — «против сокровищницы своей» (γαζοφυλάκιον — сокровищница), 部屋."
  31: "Μελχια υἱὸς τοῦ Σαραφι — Малхия, сын Царифия. ἕως Βηθαναθινιμ — «до дома нефинеев» (בית הנתינים); καὶ οἱ ῥοποπῶλαι — «и торговцы» (ῥοποπώλης — мелочной торговец). πύλης τοῦ Μαφεκαδ — ворота Мафек ад (евр. הַמִּפְקָד, «перепись/смотр»; слав. «врата судныя»); передано транслитерацией. ἀναβάσεως τῆς καμπῆς — «подъёма поворота»; слав. «горницы угла», 角の部屋."
  32: "ἀνὰ μέσον ἀναβάσεως τῆς πύλης τῆς προβατικῆς — «между подъёмом [и] Овечьими воротами»; слав. «посреде врат овчих». οἱ χαλκεῖς — кузнецы, 鍛冶; οἱ ῥοποπῶλαι — торговцы. Список замыкается там же, где начался (ст. 1)."
  33: "ἡνίκα ἤκουσεν — «когда услышал». πονηρὸν ἦν αὐτῷ — «было ему досадно». ὠργίσθη ἐπὶ πολύ — «сильно разгневался». ἐξεγέλα — «осмеял» (ἐκγελάω). В слав. это Неем 4:1; в греч. базе — 13:33."
  34: "Αὕτη ἡ δύναμις Σομορων, ὅτι… — тёмное место: «это сила Самарии, что…»; слав. понял как «пред братиею своею, иже бяху сила соморов» (то есть перед самарийским войском). οἰκοδομοῦσιν τὴν ἑαυτῶν πόλιν — «строят свой город». Ру добавляет «неужели им это дозволят?» и др. — по масоретскому тексту."
  35: "Τωβιας ὁ Αμμανίτης ἐχόμενα αὐτοῦ ἦλθεν — «Товия Аммонитянин, [бывший] подле него, пришёл». Μὴ θυσιάσουσιν ἢ φάγονται — «не принесут ли жертвы или не поедят ли?» (вопрос-насмешка). ἀλώπηξ — лисица, 狐. καθελεῖ τὸ τεῖχος λίθων αὐτῶν — «разрушит стену камней их»."
  36: "ἄκουσον, ὁ θεὸς ἡμῶν — «услышь, Боже наш». ἐγενήθημεν εἰς μυκτηρισμόν — «мы стали посмешищем» (μυκτηρισμός — осмеяние). ἐπίστρεψον ὀνειδισμὸν αὐτῶν εἰς κεφαλὴν αὐτῶν — «обрати поношение их на голову их». ἐν γῇ αἰχμαλωσίας — «в земле пленения». Молитва начинается здесь и продолжается в ст. 37."
  37: "καὶ μὴ καλύψῃς ἐπὶ ἀνομίαν — «и не покрой беззакония»: стих в LXX оборван (нет дополнения); слав. добавляет «их» («не покрый беззакония их»). Продолжение масоретского текста («и грех их да не изгладится… потому что они огорчили строящих») в греч. и слав. отсутствует, поэтому не переводилось."
