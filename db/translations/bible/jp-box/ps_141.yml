verses:
  0: "ダビデの教[おし]え。彼[かれ]が洞[ほら]のうちにいたときの祈[いの]り。"
  1: "わたしは声[こえ]を上[あ]げて主[しゅ]に呼[よ]び、声[こえ]を上[あ]げて主[しゅ]に願[ねが]った。"
  2: "わたしは主[しゅ]の前[まえ]にわたしの願[ねが]いを注[そそ]ぎ、わたしの苦[くる]しみを主[しゅ]の前[まえ]に告[つ]げる。"
  3: "わたしの霊[れい]がわたしの内[うち]で衰[おとろ]えたとき、あなたはわたしの道[みち]を知[し]っておられた。わたしが歩[あゆ]むこの道[みち]に、彼[かれ]らはわたしのための罠[わな]を隠[かく]した。"
  4: "わたしは右[みぎ]に目[め]を向[む]けて見[み]たが、わたしを知[し]る者[もの]は一人[ひとり]もいなかった。わたしから逃[に]げる道[みち]は消[き]え失[う]せ、わたしの魂[たましい]を求[もと]める者[もの]もいない。"
  5: "主[しゅ]よ、わたしはあなたに呼[よ]び求[もと]めて言[い]った。「あなたはわたしの望[のぞ]み、生[い]ける者[もの]の地[ち]でのわたしの分[ぶん]である」と。"
  6: "わたしの願[ねが]いに耳[みみ]を傾[かたむ]けてください。わたしはひどく低[ひく]くされています。わたしを追[お]う者[もの]たちからわたしを救[すく]い出[だ]してください。彼[かれ]らはわたしよりも強[つよ]いからです。"
  7: "わたしの魂[たましい]を牢[ろう]から引[ひ]き出[だ]して、あなたの名[な]に感謝[かんしゃ]をささげさせてください。正[ただ]しい者[もの]たちは、あなたがわたしに報[むく]いてくださるのを待[ま]ち望[のぞ]んで、わたしを囲[かこ]む。"

notes:
  0: "Συνέσεως τῷ Δαυιδ ἐν τῷ εἶναι αὐτὸν ἐν τῷ σπηλαίῳ· προσευχή — ダビデの教え。彼が洞のうちにいたときの祈り (σύνεσις — «разумение, учение», как в Пс 77; σπήλαιον — «пещера»). Надписание — стих 0."
  1: "Φωνῇ μου πρὸς κύριον ἐκέκραξα — 声を上げて主に呼び (κράζω — «взывать»). φωνῇ μου πρὸς κύριον ἐδεήθην — 声を上げて主に願った (δέομαι — «просить»; повтор φωνῇ μου сохранён, как в греч.)."
  2: "ἐκχεῶ ἐναντίον αὐτοῦ τὴν δέησίν μου — 主の前にわたしの願いを注ぎ (ἐκχέω — «изливать»). τὴν θλῖψίν μου ἐνώπιον αὐτοῦ ἀπαγγελῶ — 苦しみを主の前に告げる (ἀπαγγέλλω — «возвещать»)."
  3: "ἐν τῷ ἐκλείπειν ἐξ ἐμοῦ τὸ πνεῦμά μου — わたしの霊がわたしの内で衰えたとき (ἐκλείπω — «оставлять, иссякать»). σὺ ἔγνως τὰς τρίβους μου — あなたはわたしの道を知っておられた. ἔκρυψαν παγίδα μοι — 彼らはわたしのために罠を隠した."
  4: "κατενόουν εἰς τὰ δεξιὰ καὶ ἐπέβλεπον — 右に目を向けて見た (κατανοέω — «всматриваться»). οὐκ ἦν ὁ ἐπιγινώσκων με — わたしを知る者は一人もいなかった. ἀπώλετο φυγὴ ἀπ᾽ ἐμοῦ — わたしから逃げる道は消え失せ (φυγή — «бегство»). οὐκ ἔστιν ὁ ἐκζητῶν τὴν ψυχήν μου — わたしの魂を求める者もいない."
  5: "ἐκέκραξα πρὸς σέ, κύριε, εἶπα — 主よ、わたしはあなたに呼び求めて言った. Σὺ εἶ ἡ ἐλπίς μου — 「あなたはわたしの望み」. μερὶς μου ἐν γῇ ζώντων — 生ける者の地でのわたしの分 (μερίς — «часть, удел»; γῆ ζώντων — «земля живых»). Слова псалмопевца — 「」."
  6: "πρόσχες πρὸς τὴν δέησίν μου, ὅτι ἐταπεινώθην σφόδρα — わたしの願いに耳を傾けてください、わたしはひどく低くされています (ταπεινόω — «смирять»). ῥῦσαί με ἐκ τῶν καταδιωκόντων με — わたしを追う者たちから救い出してください (καταδιώκω — «преследовать»). ἐκραταιώθησαν ὑπὲρ ἐμέ — 彼らはわたしよりも強い (κραταιόω — «укрепляться»)."
  7: "ἐξάγαγε ἐκ φυλακῆς τὴν ψυχήν μου — わたしの魂を牢から引き出して (φυλακή — «темница»). τοῦ ἐξομολογήσασθαι τῷ ὀνόματί σου — あなたの名に感謝をささげさせてください. ἐμὲ ὑπομενοῦσιν δίκαιοι — 正しい者たちはわたしを待ち望んで囲む (ὑπομένω — «ожидать, терпеть»). ἕως οὗ ἀνταποδῷς μοι — あなたがわたしに報いてくださるのを (ἀνταποδίδωμι — «воздавать»)."
