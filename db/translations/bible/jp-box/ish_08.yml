verses:
  1: "主[しゅ]はモーセに言[い]われた。「アロンに言[い]いなさい。『あなたの杖[つえ]を手[て]に取[と]り、川[かわ]々[がわ]、水路[すいろ]、沼[ぬま]の上[うえ]に伸[の]ばして、蛙[かえる]を上[あ]がらせなさい。』」"
  2: "アロンはエジプトの水[みず]の上[うえ]に手[て]を伸[の]ばした。すると、一匹[いっぴき]の蛙[かえる]が上[あ]がって来[き]て、エジプトの地[ち]を覆[おお]った。"
  3: "魔術師[まじゅつし]たちも、自分[じぶん]たちの呪術[じゅじゅつ]によって同[おな]じことをし、エジプトの地[ち]に蛙[かえる]を上[あ]がらせた。"
  4: "ファラオはモーセとアロンを呼[よ]んで言[い]った。「主[しゅ]に祈[いの]って、この蛙[かえる]をわたしとわたしの民[たみ]から取[と]り除[の]いてもらいたい。そうすれば、わたしは民[たみ]を去[さ]らせ、彼[かれ]らは主[しゅ]に犠牲[ぎせい]を献[ささ]げるだろう。」"
  5: "モーセはファラオに言[い]った。「いつ、わたしがあなたと、あなたの家来[けらい]たちと、あなたの民[たみ]のために祈[いの]って、蛙[かえる]をあなたとあなたの民[たみ]とあなたがたの家[いえ]から消[き]え失[う]せさせればよいか、お定[さだ]めください。蛙[かえる]はナイル川[がわ]にだけ残[のこ]ります。」"
  6: "ファラオは言[い]った。「明日[あした]だ。」モーセは言[い]った。「お言葉[ことば]どおりになります。あなたは、主[しゅ]のほかには、だれもいないことを知[し]るでしょう。"
  7: "蛙[かえる]は、あなたと、あなたがたの家[いえ]と、あなたの家来[けらい]たちと、あなたの民[たみ]から取[と]り除[か]かれ、ナイル川[がわ]にだけ残[のこ]る。」"
  8: "モーセとアロンはファラオのところを出[で]た。モーセは、ファラオが定[さだ]めた蛙[かえる]の時[とき]について主[しゅ]に呼[よ]び求[もと]めた。"
  9: "主[しゅ]はモーセの言[い]ったとおりに行[おこな]い、蛙[かえる]は家[いえ]からも、庭[にわ]からも、畑[はたけ]からも死[し]に絶[た]えた。"
  10: "人々[ひとびと]はそれらをいくつもの山[やま]に積[つ]み上[あ]げた。すると、地[ち]は悪臭[あくしゅう]を放[はな]った。"
  11: "ファラオは、息[いき]つぎが得[え]られたのを見[み]て、その心[こころ]は重[おも]くなった。彼[かれ]らに聞[き]き従[したが]わなかった。主[しゅ]が言[い]われたとおりである。"
  12: "主[しゅ]はモーセに言[い]われた。「アロンに言[い]いなさい。『あなたの杖[つえ]を手[て]に取[と]り、地[ち]の土[つち]を打[う]ちなさい。』すると、それはぶよ⟨人[ひと]や家畜[かちく]の血[ち]を吸[す]う、小[ちい]さな虫[むし]。⟩となり、人[ひと]にも家畜[かちく]にも、エジプトの全土[ぜんど]に及[およ]ぶ。」"
  13: "アロンは手[て]に杖[つえ]を取[と]って地[ち]の土[つち]を打[う]った。すると、ぶよが人[ひと]にも家畜[かちく]にも発生[はっせい]し、エジプトの全土[ぜんど]の土[つち]がぶよになった。"
  14: "魔術師[まじゅつし]たちも、自分[じぶん]たちの呪術[じゅじゅつ]でぶよを出[だ]そうとしたが、できなかった。ぶよは人[ひと]にも家畜[かちく]にも発生[はっせい]した。"
  15: "魔術師[まじゅつし]たちはファラオに言[い]った。「これは神[かみ]の指[ゆび]です。」しかし、ファラオの心[こころ]は頑[かたくな]になり、彼[かれ]らに聞[き]き従[したが]わなかった。主[しゅ]が言[い]われたとおりである。"
  16: "主[しゅ]はモーセに言[い]われた。「明日[あした]の朝[あさ]、早[はや]く起[き]て、ファラオの前[まえ]に立[た]ちなさい。見[み]よ、彼[かれ]は水[みず]のところへ出[で]て来[く]る。彼[かれ]に言[い]いなさい。『ヘブライ人[じん]の神[かみ]である主[しゅ]がこう言[い]われる。わたしの民[たみ]を去[さ]らせて、荒野[こうや]でわたしに仕[つか]えさせよ。"
  17: "もし、あなたがわたしの民[たみ]を去[さ]らせることを拒[こば]むなら、見[み]よ、わたしはあなたと、あなたの家来[けらい]たちと、あなたの民[たみ]と、あなたがたの家[いえ]に、あぶを送[おく]る。エジプト人[じん]の家[いえ]はあぶで満[み]ち、あぶはその地[ち]にも及[およ]ぶ。"
  18: "その日[ひ]、わたしはゴシェンの地[ち]を不思議[ふしぎ]に扱[あつか]う。そこにはわたしの民[たみ]が住[す]んでいる。そこにはあぶが発生[はっせい]しない。それは、わたしが主[しゅ]、全[ぜん]地[ち]の主[しゅ]であることを、あなたが知[し]るためである。"
  19: "わたしは、わたしの民[たみ]とあなたの民[たみ]の間に区別[くべつ]を置[お]く。明日[あした]、このしるしがこの地[ち]に現[あらわ]れる。』」"
  20: "主[しゅ]はそのとおりに行[おこな]われた。あぶの大群[たいぐん]がファラオの家[いえ]、その家来[けらい]たちの家[いえ]、エジプトの全土[ぜんど]に押[お]し寄[よ]せ、あぶのために地[ち]は荒[あ]れ果[は]てた。"
  21: "ファラオはモーセとアロンを呼[よ]んで言[い]った。「あなたがたはこの地[ち]で、あなたがたの神[かみ]に犠牲[ぎせい]を献[ささ]げよ。」"
  22: "モーセは言[い]った。「それはできません。わたしたちが主[しゅ]に献[ささ]げるものは、エジプト人[じん]が忌[い]み嫌[きら]うものだからです。わたしたちがエジプト人[じん]の目の前[まえ]で、彼[かれ]らが忌[い]み嫌[きら]うものを犠牲[ぎせい]として献[ささ]げたら、わたしたちは石[いし]を投[な]げられないでしょうか。"
  23: "わたしたちは三日[みっか]の道[みち]のりを荒野[こうや]へ行[い]き、主[しゅ]がわたしたちに言[い]われたとおりに、わたしたちの神[かみ]である主[しゅ]に犠牲[ぎせい]を献[ささ]げます。」"
  24: "ファラオは言[い]った。「わたしはあなたがたを去[さ]らせ、荒野[こうや]であなたがたの神[かみ]である主[しゅ]に犠牲[ぎせい]を献[ささ]げさせよう。ただし、あまり遠[とお]くへは行[い]くな。わたしのためにも主[しゅ]に祈[いの]ってくれ。」"
  25: "モーセは言[い]った。「すぐに、わたしはあなたのもとを出[で]て主[しゅ]に祈[いの]ります。明日[あした]、あぶはあなたとあなたの家来[けらい]たちとあなたの民[たみ]から去[さ]るでしょう。ただ、ファラオよ、もうこれ以上、民[たみ]を去[さ]らせて主[しゅ]に犠牲[ぎせい]を献[ささ]げさせまいとして、わたしを欺[あざむ]かないでください。」"
  26: "モーセはファラオのところを出[で]て、神[かみ]に祈[いの]った。"
  27: "主[しゅ]はモーセの言[い]ったとおりに行[おこな]い、あぶをファラオとその家来[けらい]たちとその民[たみ]から取[と]り除[の]かれた。一匹[いっぴき]も残[のこ]らなかった。"
  28: "しかし、ファラオはこの時[とき]もまた、自分[じぶん]の心[こころ]を重[おも]くし、民[たみ]を去[さ]らせなかった。"

notes:
  1: "Εἰπὸν Ααρων — скажи Аарону. Ἔκτεινον τῇ χειρὶ τὴν ῥάβδον — простри руку с жезлом. διώρυγας, ἕλη — каналы, болота. ἀνάγαγε — выведи. В слав. и масоретской нумерации это 8:5."
  2: "ἐξέτεινεν τὴν χεῖρα — простёр руку. ἀνεβιβάσθη ὁ βάτραχος — поднялась жаба (в греч. ед. ч.; слав. — «жабы»). ἐκάλυψεν τὴν γῆν — покрыла землю. В слав. нумерации — 8:6."
  3: "ἐπαοιδοί — волхвы, заклинатели (魔術師[まじゅつし]). φαρμακεῖαι — чары. В слав. нумерации — 8:7."
  4: "Εὔξασθε περὶ ἐμοῦ — помолитесь обо мне. περιελέτω — пусть удалит. θύσωσιν — принесут жертву. В слав. нумерации — 8:8."
  5: "Τάξαι πρός με — назначь мне (τάσσω). ἀφανίσαι — истребить. πλὴν ἐν τῷ ποταμῷ ὑπολειφθήσονται — только в реке останутся. В слав. нумерации — 8:9."
  6: "Εἰς αὔριον — завтра. ὡς εἴρηκας — как сказал. οὐκ ἔστιν ἄλλος πλὴν κυρίου — нет иного, кроме Господа. В слав. нумерации — 8:10."
  7: "περιαιρεθήσονται — будут удалены. ἐπαύλεις — дворы, загоны. В слав. нумерации — 8:11."
  8: "ἐβόησεν — воззвал. ὁρισμός — назначенный срок. ὡς ἐτάξατο — как назначил. В слав. нумерации — 8:12."
  9: "ἐτελεύτησαν — вымерли. ἀγροί — поля. В слав. нумерации — 8:13."
  10: "θιμωνιὰς θιμωνιάς — кучами (винительный падеж в роли наречия). ὤζεσεν ἡ γῆ — земля воссмердела. В слав. нумерации — 8:14."
  11: "ἀνάψυξις — облегчение, передышка. ἐβαρύνθη ἡ καρδία — отягчилось (βαρύνω, не σκληρύνω). В слав. нумерации — 8:15."
  12: "πάταξον τὸ χῶμα — ударь прах. σκνῖφες — мошки, гнус (ぶよ; ср. 8:16–18). τετράποδα — четвероногие, скот. В слав. нумерации — 8:16."
  13: "ἐγένοντο οἱ σκνῖφες — появились мошки. ἐν παντὶ χώματι — во всей персти. В слав. нумерации — 8:17."
  14: "ἐξαγαγεῖν τὸν σκνῖφα — вывести мошку. οὐκ ἠδύναντο — не могли. В слав. нумерации — 8:18."
  15: "Δάκτυλος θεοῦ — перст Божий. ἐσκληρύνθη — ожесточилось (пассив). В слав. нумерации — 8:19."
  16: "Ὄρθρισον τὸ πρωί — встань рано утром. στῆθι ἐναντίον — стань пред. ἐν τῇ ἐρήμῳ — в пустыне. В слав. нумерации — 8:20."
  17: "ἐπαποστέλλω — посылаю (на). κυνόμυια — песья муха, слепень (あぶ). οἰκίαι — дома. В слав. нумерации — 8:21."
  18: "παραδοξάσω — сотворю дивное, отличу (παράδοξος «необычайный»). Γεσεμ — ゴシェン (LXX Γεσεμ, евр. Гошен). ἐγώ εἰμι κύριος ὁ κύριος πάσης τῆς γῆς — Я Господь, Господь всей земли. В слав. нумерации — 8:22."
  19: "διαστολή — разделение, различие. σημεῖον — знамение. В слав. нумерации — 8:23."
  20: "παρεγένετο — пришло. πλῆθος — множество. ἐξωλεθρεύθη — была опустошена (ἐξολεθρεύω). В слав. нумерации — 8:24."
  21: "Ἐλθόντες θύσατε — пойдите и принесите жертву. ἐν τῇ γῇ — в этой земле. В слав. нумерации — 8:25."
  22: "βδελύγματα — мерзости (то, что гнусно). λιθοβοληθησόμεθα — побьют камнями. В слав. нумерации — 8:26."
  23: "ὁδὸν τριῶν ἡμερῶν — путь трёх дней. καθάπερ εἶπεν ἡμῖν — как сказал нам. В слав. нумерации — 8:27."
  24: "ἀποτενεῖτε — прострёте (ἀποτείνω). εὔξασθε — помолитесь. В слав. нумерации — 8:28."
  25: "Ὅδε ἐγώ — вот я. μὴ προσθῇς ἔτι — не продолжай (προστίθημι). ἐξαπατῆσαι — обмануть. В слав. нумерации — 8:29."
  26: "ηὔξατο — помолился. В слав. нумерации — 8:30."
  27: "περιεῖλεν — удалил. οὐ κατελείφθη οὐδεμία — не осталось ни одной. В слав. нумерации — 8:31."
  28: "ἐβάρυνεν τὴν καρδίαν — отягчил сердце (актив βαρύνω, субъект — фараон). καὶ ἐπὶ τοῦ καιροῦ τούτου — и на этот раз. В слав. нумерации — 8:32."
