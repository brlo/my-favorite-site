# jp-box, Исход, глава 8. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru).
# jp-joc в этой главе отсутствует; ru (с масоретского) — только для понимания, не источник.
# Язык — современный 常体, порядок членов и деление на клаузы — по греческому.
# Глава 8: вторая казнь — жабы (1–7), избавление от жаб (8–11),
# третья казнь — мошки (12–15), четвертая казнь — песьи мухи (16–20),
# переговоры с фараоном (21–28).
# Нумерация LXX: в главе 28 стихов; 8:1–28 в славянской и масоретской нумерации — 8:5–32
# (тамошние 8:1–4 = 7:26–29). Держимся греческой нумерации.
# Красного и синего нет: говорит Бог, но это не прямая речь Христа во плоти; «<j>» не ставится.
# Кавычки: речь Бога — 「…」 (1, 12, 16–19); речь Моисея и фараона — 「…」;
# слово, которое Моисей передаёт Аарону, и слово Господа в устах Моисея — 『…』 (1, 12, 16–19).
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено по базе); отличия csl/МТ — в notes.
# 8:2 — в греч. ед. ч. «жаба» (слав. и Синодальный — «жабы»); 8:18 — παραδοξάζω,
# «делать дивное», отсюда 不思議[ふしぎ]に扱[あつか]う.
# Сноска ⟨…⟩ одна: 8:12 ぶよ — первое место в корпусе; あぶ уже в Пс 104:31.
# jp-ni не использовался.

