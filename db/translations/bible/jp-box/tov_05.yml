# jp-box, Товит, глава 5. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc в книге нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 5: найм Рафаила (1–17) и плач Анны (18–22); 5:23 — слова рассказчика.
# Диалоги — 「…」; красного и синего нет.
# Нумерация по gr: 23 стиха. У csl нет 5:23 («и перестала плакать»): там этот стих
# стоит как 6:1; остальные номера совпадают. 5:23 обязателен по греческой нумерации.
# 5:21 ἀδελφή — 妻よ, буквальное 姉妹よ невозможно; греч. в notes.
# 〔…〕 нет: все стихи есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 証文, ドラクマ, 天使, ラファエル уже в корпусе.
# Имена — транслитерация греческого (LXX).

