verses:
  1: "トビアは答[こた]えて彼[かれ]に言[い]った。「父[ちち]よ、あなたがわたしに命[めい]じたことはすべて行[おこな]う。"
  2: "しかし、どうやってあの銀[ぎん]を受[う]け取[と]ることができるだろうか。わたしはその人[ひと]を知[し]らないのだ。」"
  3: "そこで父[ちち]は彼[かれ]に証文[しょうもん]を渡[わた]し、彼に言[い]った。「自分[じぶん]のために、あなたとともに行[い]く人[ひと]を探[さが]しなさい。わたしは生[い]きている間[あいだ]、その人に報酬[ほうしゅう]を払[はら]う。そして行って、あの銀[ぎん]を受[う]け取[と]りなさい。」"
  4: "彼は人[ひと]を探[さが]しに行[い]き、ラファエルを見[み]つけた。ラファエルは天使[てんし]であったが、彼は知[し]らなかった。"
  5: "彼は言[い]った。「わたしはあなたとともにメディアのラゲスへ行[い]くことができるだろうか。あなたはその土地[とち]に詳[くわ]しいか。」"
  6: "天使[てんし]は彼に言[い]った。「わたしはあなたとともに行[い]こう。わたしはその道[みち]をよく知[し]っている。わたしはわたしたちの兄弟[きょうだい]ガバエルのところに泊[と]まったことがある。」"
  7: "トビアは彼に言[い]った。「わたしを待[ま]っていてくれ。父[ちち]に話[はな]すから。」"
  8: "彼は言[い]った。「行[い]きなさい。ためらってはならない。」"
  9: "彼は入[はい]って行[い]き、父[ちち]に言[い]った。「父よ、見[み]てくれ。わたしとともに行く者[もの]を見つけた。」父は言った。「その人[ひと]をわたしのところへ呼[よ]びなさい。どの部族[ぶぞく]の者か、あなたとともに行くのに信頼[しんらい]できる者かどうか、わたしが知[し]ろう。」"
  10: "彼がその人[ひと]を呼[よ]ぶと、その人は入[はい]って来[き]て、二人[ふたり]は互[たが]いに挨拶[あいさつ]した。"
  11: "トビトは彼に言[い]った。「兄弟[きょうだい]よ、あなたはどの部族[ぶぞく]の者[もの]か、どこの国[くに]の者か。わたしに示[しめ]してほしい。」"
  12: "彼は言[い]った。「あなたは部族[ぶぞく]と氏族[しぞく]を尋[たず]ねているのか、それとも、あなたの息子[むすこ]とともに行[い]く雇[やと]い人[びと]を尋ねているのか。」トビトは彼に言った。「兄弟[きょうだい]よ、わたしはあなたの血筋[ちすじ]と名[な]を知[し]りたいのだ。」"
  13: "彼は言[い]った。「わたしはアザルヤ、大[おお]いなるアナニヤの子[こ]で、あなたの兄弟[きょうだい]たちの一人[ひとり]である。」"
  14: "彼は言[い]った。「よく来[き]たな、兄弟[きょうだい]よ。わたしがあなたの部族[ぶぞく]と氏族[しぞく]を知[し]ろうとしたことで、わたしを怒[おこ]ってはならない。あなたはわたしの兄弟で、良[よ]い、善[よ]い家系[かけい]の出だ。というのは、わたしはアナニヤとヤタン、大[おお]いなるセメイの息子[むすこ]たちを知っていたからである。わたしたちは一緒[いっしょ]にエルサレムへ行[い]って礼拝[れいはい]し、その産物[さんぶつ]の初物[はつもの]と十分[じゅうぶん]の一[いち]を携[たずさ]えて行ったのであり、彼らはわたしたちの兄弟たちの迷[まよ]いの中[なか]で迷わなかった。あなたは良い根[ね]から出[で]た者[もの]だ、兄弟よ。」"
  15: "だが、あなたにどんな報酬[ほうしゅう]を払[はら]うべきか、言[い]ってくれ。一日[いちにち]にドラクマ、そしてわたしの子[こ]に与[あた]えるのと同[おな]じように、あなたに必要[ひつよう]なものを与える、ではどうか。"
  16: "あなたがたが無事[ぶじ]に帰[かえ]ってきたなら、その報酬[ほうしゅう]にさらに付[つ]け加[くわ]えよう。"
  17: "そこで、そのように決[き]まった。父[ちち]はトビアに言[い]った。「旅[たび]の支度[したく]をしなさい。旅が無事[ぶじ]に進[すす]むように。」息子[むすこ]は旅の支度をした。父は彼に言った。「この人[ひと]とともに行[い]きなさい。天[てん]におられる神[かみ]があなたがたの道[みち]を幸[さいわ]いへと導[みちび]き、神の天使[てんし]があなたがたとともに歩[あゆ]んでくださるように。」そして二人[ふたり]は出[で]かけて行き、若者[わかもの]の犬[いぬ]も彼らとともにいた。"
  18: "しかし、母[はは]アンナは泣[な]いて、トビトに言[い]った。「なぜ、あなたはわたしたちの子[こ]を送[おく]り出[だ]したのか。この子がわたしたちの前[まえ]を出入[でい]りするとき、この子はわたしたちの手[て]の杖[つえ]ではなかったか。」"
  19: "銀[ぎん]が銀として戻[もど]って来[く]ることがないように。わたしたちの子[こ]のためには、それは屑[くず]となればよい。"
  20: "というのは、主[しゅ]によってわたしたちに生[い]きることが与[あた]えられているのだから、それでわたしたちには十分[じゅうぶん]である。"
  21: "トビトは彼女[かのじょ]に言[い]った。「妻[つま]よ、心配[しんぱい]してはならない。彼は無事[ぶじ]に帰[かえ]って来[く]る。あなたの目[め]が彼を見[み]る。」"
  22: "良[よ]い天使[てんし]が彼とともに歩[あゆ]むからである。彼の道[みち]は順調[じゅんちょう]に進[すす]み、彼は無事[ぶじ]に帰[かえ]って来[く]る。"
  23: "そして彼女[かのじょ]は泣[な]きやんだ。"

notes:
  1: "ἀποκριθεὶς … εἶπεν — отвечая, сказал: семитский оборот. Πάτερ — зват. от πατήρ, 父よ. ἐντέταλσαί μοι — заповедал мне (ἐντέλλομαι, perf.). Слав. «отче, сотворю вся, елика заповедал еси ми»."
  2: "πῶς δυνήσομαι λαβεῖν — как смогу взять (δύναμαι). οὐ γινώσκω αὐτόν — не знаю его; слав. «а не знаю его». Товия отвечает отцу."
  3: "χειρόγραφον — рукописание, долговая расписка. ὃς συμπορεύσεταί σοι — кто пойдёт с тобою (συμπορεύομαι). ἕως ζῶ — пока я жив. λαβὲ πορευθεὶς — пойди и возьми. Подлежащее ἔδωκεν — Товит, в греч. не назван."
  4: "ἐπορεύθη ζητῆσαι — пошёл искать. εὗρεν τὸν Ραφαηλ — нашёл Рафаила. ὃς ἦν ἄγγελος — который был ангел; слав. «иже бе ангел». οὐκ ᾔδει — не знал: Товия не знает, что перед ним ангел."
  5: "Εἰ δύναμαι πορευθῆναι — могу ли пойти. ἔμπειρος εἶ τῶν τόπων — опытен ли в тех местах (ἔμπειρος); слав. «известен ли еси о местех»."
  6: "Πορεύσομαι — пойду. τῆς ὁδοῦ ἐμπειρῶ — знаю дорогу (ἐμπειρέω, редкий глагол). παρὰ Γαβαηλ τὸν ἀδελφὸν ἡμῶν ηὐλίσθην — у Гаваила, брата нашего, я останавливался (αὐλίζομαι); слав. «у гаваила брата нашего живях»."
  7: "Ὑπόμεινόν με — подожди меня (ὑπομένω). ἐρῶ τῷ πατρί μου — скажу отцу моему."
  8: "Πορεύου — иди. μὴ χρονίσῃς — не медли (χρονίζω); слав. «не косни». Ответ ангела без вводящих слов."
  9: "Ἰδοὺ εὕρηκα ὃς συμπορεύσεταί μοι — вот я нашёл того, кто пойдёт со мною. Φώνησον — позови (φωνέω). ἐπιγνῶ ποίας φυλῆς ἐστιν — узнаю, какого он племени. πιστὸς τοῦ πορευθῆναι — надёжен, чтобы идти (πιστός с inf.); слав. «аще верен есть, еже ити»."
  10: "ἐκάλεσεν — позвал. ἠσπάσαντο ἀλλήλους — приветствовали друг друга (ἀσπάζομαι); слав. «приветствоваста друг друга» — двойственное число."
  11: "Ἄδελφε — зват. «брат», 兄弟よ. ἐκ ποίας φυλῆς καὶ ἐκ ποίας πατρίδος — из какого племени и из какого отечества (πατρίς). ὑπόδειξόν μοι — покажи мне."
  12: "Φυλὴν καὶ πατριὰν σὺ ζητεῖς ἢ μίσθιον — племени и рода ты ищешь или наёмника (μίσθιος). Βούλομαι … ἐπιγνῶναι τὸ γένος σου καὶ τὸ ὄνομα — хочу узнать род твой и имя. Слав. «племене и отечества ты ищеши? или наемника…»."
  13: "Αζαριας Ανανιου τοῦ μεγάλου — Азария [сын] Анании великого (род. Ανανιου); слав. «азариа анании великаго». τῶν ἀδελφῶν σου — из братьев твоих. В 5:14 названы Анания и Иафан, сыновья Семея."
  14: "Ὑγιαίνων ἔλθοις — «придя здоровым»: приветствие, слав. «благо пришел еси». μή μοι ὀργισθῇς — не гневайся на меня (ὀργίζομαι). τυγχάνεις — оказываешься (τυγχάνω). ἐκ τῆς καλῆς καὶ ἀγαθῆς γενεᾶς — из доброго и благого рода (γενεά). Ανανιαν καὶ Ιαθαν τοὺς υἱοὺς Σεμειου — Ананию и Иафана, сыновей Семея (слав. «ионафана»). κοινῶς — вместе. τὰ πρωτότοκα καὶ τὰς δεκάτας τῶν γενημάτων — первородное и десятины произведений (γένημα). ἐπλανήθησαν ἐν τῇ πλάνῃ — впали в заблуждение (πλανάω, πλάνη). ἐκ ῥίζης καλῆς — от доброго корня; слав. «от корене великаго» — в тексте по LXX."
  15: "εἰπόν μοι τίνα σοι ἔσομαι μισθὸν διδόναι — скажи мне, какую плату я тебе буду давать. δραχμὴν τῆς ἡμέρας — драхму на день (δραχμή); слав. «драхму на день». τὰ δέοντά σοι — нужное тебе (δέω). ὡς καὶ τῷ υἱῷ μου — как и сыну моему."
  16: "ἔτι προσθήσω σοι ἐπὶ τὸν μισθόν — ещё прибавлю тебе к плате (προστίθημι). ἐὰν ὑγιαίνοντες ἐπιστρέψητε — если здоровыми возвратитесь (ἐπιστρέφω)."
  17: "εὐδόκησαν οὕτως — так согласились (εὐδοκέω). Ἕτοιμος γίνου — будь готов. εὐοδωθείητε — оптатив: да будет успешен [путь] вам (εὐοδόω). ὁ ἄγγελος αὐτοῦ — ангел Его. κύων τοῦ παιδαρίου — пёс отрока (κύων); παιδάριον здесь — Товия, 若者."
  18: "ἔκλαυσεν — заплакала. Τί ἐξαπέστειλας — зачем ты отослал (ἐξαποστέλλω). ἡ ῥάβδος τῆς χειρὸς ἡμῶν — жезл руки нашей, т. е. опора. εἰσπορεύεσθαι καὶ ἐκπορεύεσθαι — входить и выходить (ср. Пс 120:8)."
  19: "ἀργύριον τῷ ἀργυρίῳ — серебро серебру. μὴ φθάσαι — «да не достигнет», т. е. не сравнится (φθάνω); слав. «сребро сребром да не возвратится» — это чтение взято в текст (銀が銀として戻って来る…). περίψημα — сор, отбросы; слав. «уметы». Смысл: деньги не должны быть предпочтены сыну."
  20: "ὡς δέδοται ἡμῖν ζῆν παρὰ τοῦ κυρίου — как дано нам жить от Господа. τοῦτο ἱκανὸν ἡμῖν ὑπάρχει — этого достаточно нам (ἱκανός); слав. «сие доволно есть нама»."
  21: "Μὴ λόγον ἔχε — не имей [такой] мысли, не тревожься. ἀδελφή — «сестра», ласковое обращение к жене; по-японски буквальное 姉妹よ невозможно (означает пару сестёр), поэтому 妻よ — осознанное решение, не сглаживание. ὑγιαίνων ἐλεύσεται — здоровым придёт."
  22: "ἄγγελος ἀγαθός — добрый ангел. συμπορεύσεται — будет сопутствовать (συμπορεύομαι). εὐοδωθήσεται — будет благоуспешен (εὐοδόω). ὑποστρέψει ὑγιαίνων — возвратится здоровым (ὑποστρέφω)."
  23: "καὶ ἐπαύσατο κλαίουσα — и перестала плакать (παύω, κλαίω). В csl этого стиха нет: он стоит как 6:1 («И преста плакати»); здесь — по греческой нумерации 5:23. Слова рассказчика, не речь."
