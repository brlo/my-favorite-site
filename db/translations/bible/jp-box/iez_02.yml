# jp-box, Иезекииль, глава 2. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для главы есть частично (2:3–10, 2:1–2 пусты), сверен как
# свидетель церковного чтения, в текст не копировался; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 2: 1 конец видения (подобие славы Господней), падение пророка и первое слово
# Бога «стань на ноги»; 2 дух поднимает и ставит его; 3–4 послание к дому Израилеву,
# «сыны с жёстким лицом и твёрдым сердцем», формула «так говорит Господь»;
# 5–7 «будут ли слушать или убоятся» — дом мятежный, пророк среди скорпионов,
# «не бойся»; 8 повеление съесть свиток; 9–10 простёртая рука и свиток, исписанный
# внутри и снаружи: «плач, и песнь, и горе».
# Нумерация по gr: 10 стихов, совпадает с csl и ru. Слав. 2:1 включает конец гр. 1:28
# («таково видение подобия славы Господней…»), поэтому стих начинается с этих слов;
# деление держим по слав. (см. notes к 1:28 и 2:1).
# Голоса: 2:1 — повествование, затем 「…」 (первое слово Бога, закрывается в конце
# стиха); 2:2 — повествование; 2:3–2:8 — одна непрерывная речь Бога в 「…」 (в 2:4
# вложенное поручение пророку — 『…』); 2:9–10 — повествование без кавычек.
# 〔…〕 нет. Слав. добавления внесены в основной текст без скобок и оговорены:
# 2:3 «отвергошася мене», 2:4 «сынове жестоколичнии и твердосердечнии» и «Аз послю
# тя к тем».
# Сносок ⟨…⟩ нет: 幻, 霊, 預言者, 反逆, 巻物 уже в корпусе или понятны.
# Имена — транслитерация греческого (LXX): エゼキエル, イスラエル.
# Повторяющиеся формулы: οἶκος παραπικραίνων — 反逆[はんぎゃく]の家[いえ] (2:5, 6, 7, 8);
# ἐὰν ἄρα ἀκούσωσιν ἢ πτοηθῶσιν — 聞[き]くにせよ、怖[こわ]がるにせよ (2:5, 7);
# Υἱὲ ἀνθρώπου — 人[ひと]の子[こ]; Τάδε λέγει κύριος — 主[しゅ]なる神[かみ]はこう言[い]われる.

