verses:
  1: "これが、主[しゅ]の栄光[えいこう]に似[に]たものの幻[まぼろし]であった。わたしはこれを見[み]て、顔[かお]を地[ち]につけて伏[ふ]した。すると、語[かた]る者[もの]の声[こえ]を聞[き]き、わたしに言[い]われた。「人[ひと]の子[こ]よ、あなたの足[あし]の上[うえ]に立[た]て。わたしはあなたに語[かた]ろう。」"
  2: "霊[れい]がわたしの上[うえ]に来[き]て、わたしを取[と]り上[あ]げ、持[も]ち上[あ]げて、わたしの足[あし]の上[うえ]に立[た]たせた。わたしは、その方[かた]がわたしに語[かた]るのを聞[き]いた。"
  3: "そして、わたしに言[い]われた。「人[ひと]の子[こ]よ、わたしはあなたをイスラエルの家[いえ]へ遣[つか]わす。わたしを怒[いか]らせる者[もの]たち、わたしを怒[いか]らせた者[もの]たちのところへ。彼[かれ]らもその父[ちち]たちも、今日[きょう]に至[いた]るまでわたしを退[しりぞ]けてきた。"
  4: "その者[もの]たちは、顔[かお]をかたくなにし、心[こころ]を強[こわ]くした子[こ]らである。わたしはあなたを彼[かれ]らのもとへ遣[つか]わす。あなたは彼[かれ]らに言[い]わなければならない。『主[しゅ]なる神[かみ]はこう言[い]われる』と。"
  5: "彼[かれ]らが聞[き]くにせよ、怖[こわ]がるにせよ、彼[かれ]らは反逆[はんぎゃく]の家[いえ]である。それでも彼[かれ]らは、預言者[よげんしゃ]が自分[じぶん]たちの間[あいだ]にいたことを知[し]るだろう。"
  6: "人[ひと]の子[こ]よ、あなたは彼[かれ]らを恐[おそ]れてはならない。彼[かれ]らの顔[かお]に驚[おどろ]いてはならない。彼[かれ]らは激[はげ]しく怒[いか]って、あなたを周[まわ]りに取[と]り囲[かこ]むからである。あなたはさそりの中[なか]に住[す]んでいるのだから。彼[かれ]らの言葉[ことば]を恐[おそ]れてはならない。彼[かれ]らの顔[かお]に驚[おどろ]いてはならない。彼[かれ]らは反逆[はんぎゃく]の家[いえ]だからである。"
  7: "あなたは彼[かれ]らにわたしの言葉[ことば]を語[かた]らなければならない。彼[かれ]らが聞[き]くにせよ、怖[こわ]がるにせよ。彼[かれ]らは反逆[はんぎゃく]の家[いえ]だからである。"
  8: "人[ひと]の子[こ]よ、あなたに語[かた]る者[もの]の声[こえ]を聞[き]け。反逆[はんぎゃく]の家[いえ]のように反逆[はんぎゃく]してはならない。あなたの口[くち]を開[ひら]いて、わたしがあなたに与[あた]えるものを食[た]べよ。」"
  9: "わたしは見[み]た。見[み]よ、わたしに向[む]かって手[て]が差[さ]し伸[の]べられ、その中[なか]に書[か]き物[もの]の巻[まき]物[もの]があった。"
  10: "それはわたしの前[まえ]で広[ひろ]げられた。そこには、表[おもて]にも裏[うら]にも文[もじ]が書[か]かれていた。そこに書[か]かれていたのは、嘆[なげ]きと悲[かな]しみと災[わざわ]いであった。"

notes:
  1: "Слав. 2:1 включает конец гр. 1:28: αὕτη ἡ ὅρασις ὁμοιώματος δόξης κυρίου — «таково видение подобия славы Господней» (ὁμοίωμα — подобие, 似たもの; δόξα — слава, 栄光); καὶ πίπτω ἐπὶ πρόσωπόν μου — «и падаю на лицо моё»; φωνὴ λαλοῦντος — «голос говорящего»; Υἱὲ ἀνθρώπου — «сын человеческий» (人[ひと]の子[こ] по корпусу и брифу); στῆθι ἐπὶ τοὺς πόδας σου — «стань на ноги твои»; λαλήσω πρὸς σέ — «буду говорить с тобою». С этих слов начинается речь Бога (「…」), закрывается в конце стиха; продолжение — в 2:3."
  2: "ἦλθεν ἐπ᾽ ἐμὲ πνεῦμα — «пришёл на меня дух»; ἀνέλαβέν με καὶ ἐξῆρέν με — «взял меня и поднял меня» (ἀναλαμβάνω, ἐξαίρω); ἔστησέν με ἐπὶ τοὺς πόδας μου — «поставил меня на ноги мои»; ἤκουον αὐτοῦ λαλοῦντος — «слышал его говорящего». Речь Бога возобновляется в 2:3."
  3: "ἐξαποστέλλω ἐγώ σε — «Я посылаю тебя» (ἐξαποστέλλω — посылать); πρὸς τὸν οἶκον τοῦ Ισραηλ — «к дому Израилеву»; τοὺς παραπικραίνοντας με — «огорчающих (прогневляющих) Меня» (παραπικραίνω); οἵτινες παρεπίκρανάν με — «которые огорчили Меня»; ἕως τῆς σήμερον ἡμέρας — «до сего дня». Слав. добавляет «отвергошася мене» («отверглись Меня») — в LXX нет, по паритету внесено без 〔…〕."
  4: "Слав. начинает стих словами «сынове жестоколичнии и твердосердечнии» — «сыны с жёстким лицом и твёрдым сердцем» (букв. «жестоколицые и твердосердечные»): в gr-lxx-byz их нет (полный церковный текст, ср. МТ), внесены в основной текст. Также слав. добавляет «Аз послю тя к тем» («Я пошлю тебя к ним») — в LXX нет. Τάδε λέγει κύριος — «так говорит Господь» (слав. «адонаи Господь» — 主[しゅ]なる神[かみ]). Слова пророка к народу — 『…』 внутри речи Бога."
  5: "Ἐὰν ἄρα ἀκούσωσιν ἢ πτοηθῶσιν — «будут ли слушать или убоятся» (πτοέω — устрашать, 怖がる); διότι οἶκος παραπικραίνων ἐστίν — «ибо дом мятежный (огорчевающий)»; γνώσονται ὅτι προφήτης εἶ σύ — «узнают, что пророк ты»; ἐν μέσῳ αὐτῶν — «среди них». Формула «дом мятежный» — 反逆[はんぎゃく]の家[いえ] по всей книге."
  6: "μὴ φοβηθῇς αὐτούς — «не бойся их»; μηδὲ ἐκστῇς ἀπὸ προσώπου αὐτῶν — «и не ужасайся от лица их» (ἐξίστημι — выходить из себя, ужасаться); παροιστρήσουσι — «разъярятся, нападут» (οἶστρος — слепень, ярость); ἐπισυστήσονται ἐπὶ σὲ κύκλῳ — «соберутся на тебя вокруг»; ἐν μέσῳ σκορπίων σὺ κατοικεῖς — «среди скорпионов ты живёшь». ru добавляет «волчцами и тернами» — масоретское чтение, в LXX и слав. нет, не внесено."
  7: "λαλήσεις τοὺς λόγους μου πρὸς αὐτούς — «будешь говорить слова Мои им»; повтор формулы 2:5 («будут ли слушать или убоятся»). Слав. в конце «дом прогневаяй есть» — вариант «огорчеваяй», переведено так же."
  8: "ἄκουε τοῦ λαλοῦντος πρός σε — «слушай говорящего тебе»; μὴ γίνου παραπικραίνων — «не будь мятежником»; χάνε τὸ στόμα σου — «раскрой уста твои» (χάσκω — разевать); φάγε ἃ ἐγὼ δίδωμί σοι — «съешь, что Я даю тебе». Здесь речь Бога закрывается."
  9: "χεὶρ ἐκτεταμένη πρός με — «рука простёртая ко мне»; κεφαλὶς βιβλίου — «свиток книжный» (κεφαλίς — головка свитка, свиток, 巻物)."
  10: "ἀνείλησεν αὐτὴν ἐνώπιον ἐμοῦ — «развернул его предо мною» (ἀναείλω — разворачивать); τὰ ὄπισθεν καὶ τὰ ἔμπροσθεν — «заднее и переднее», т.е. с обеих сторон (表にも裏にも); θρῆνος καὶ μέλος καὶ οὐαί — «рыдание, песнь и горе» (θρῆνος — плач; μέλος — песнь; οὐαί — горе). Слав. «жалость» передаёт μέλος как «плач, сожаление», переведено 悲[かな]しみ."
