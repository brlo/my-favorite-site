verses:
  1: "主[しゅ]はその夜[よ]、王[おう]から眠[ねむ]りを遠[とお]ざけられた。そこで王は自分[じぶん]のしもべに、日々[ひび]の記念[きねん]の書[しょ]を持[も]ち込[こ]んで自分に読[よ]むように言[い]った。"
  2: "そこに、モルデカイについて書[か]かれた記録[きろく]が見[み]つかった。すなわち、王[おう]の二人[ふたり]の宦官[かんがん]が守[まも]りに当[あ]たっていたとき、彼[かれ]らがアルタシャスタに手[て]をかけようと企[くわだ]てたことについて、モルデカイが王に告[つ]げた次第[しだい]である。"
  3: "王[おう]は言[い]った。「わたしはモルデカイにどんな名誉[めいよ]や恵[めぐ]みを与[あた]えたか。」王のしもべたちは言った。「あなたは彼[かれ]に何[なに]もなさっていない。」"
  4: "王[おう]がモルデカイへの好意[こうい]について尋[たず]ねていると、見[み]よ、アマンが王の庭[にわ]にいた。王は言[い]った。「庭にいるのはだれか。」アマンは、自分[じぶん]が用意[ようい]した柱[はしら]にモルデカイを掛[か]けさせるよう王に言うために、入[はい]って来[き]ていたのである。"
  5: "王[おう]のしもべたちは言[い]った。「見[み]よ、アマンが庭[にわ]に立[た]っている。」王は言った。「彼[かれ]を呼[よ]べ。」"
  6: "王[おう]はアマンに言[い]った。「わたしが栄誉[えいよ]を与[あた]えたいと思[おも]うその人[ひと]に、何[なに]をしてやろうか。」アマンは心[こころ]のうちで言った。「王が栄誉を与えたいのは、わたしのほかにだれだというのか。」"
  7: "彼[かれ]は王[おう]に言[い]った。「王が栄誉[えいよ]を与えたいと思[おも]うその人[ひと]には、"
  8: "王[おう]の若[わか]い者[もの]たちが、王がまとう亜麻布[あまぬの]の衣[ころも]と、王が乗[の]る馬[うま]を運[はこ]んで来[く]るようにし、"
  9: "それを王[おう]の友人[ゆうじん]のうち、名[な]だたる一人[ひとり]に渡[わた]して、その者[もの]が、王が愛[あい]するその人[ひと]に衣[ころも]を着[き]せ、彼[かれ]を馬[うま]に乗[の]らせ、都[みやこ]の広場[ひろば]を行[ゆ]きながら、こう宣[の]べるように。『王が栄誉[えいよ]を与[あた]えるすべての人には、このようにされる。』」"
  10: "王[おう]はアマンに言[い]った。「あなたが言ったとおりに、王の庭[にわ]で仕[つか]えているユダヤ人[じん]モルデカイにそうしなさい。あなたが語[かた]った言葉[ことば]のうち、一[ひと]つも落[お]としてはいけない。」"
  11: "アマンは衣[ころも]と馬[うま]を取[と]り、モルデカイに着[き]せ、彼[かれ]を馬に乗[の]らせて、都[みやこ]の広場[ひろば]を行[ゆ]きながら、彼の前[まえ]でこう宣[の]べた。「王[おう]が栄誉[えいよ]を与[あた]えたいと思[おも]うすべての人[ひと]には、このようにされる。」"
  12: "モルデカイは王[おう]の庭[にわ]に戻[もど]った。アマンは悲[かな]しみながら頭[あたま]を垂[た]れて自分[じぶん]の家[いえ]へ帰[かえ]った。"
  13: "アマンは自分[じぶん]に起[お]こったことを、妻[つま]のゾサラと友人[ゆうじん]たちに語[かた]った。友人たちと妻は彼[かれ]に言[い]った。「モルデカイがユダヤ人[じん]の血筋[ちすじ]の者[もの]であるなら、あなたは彼の前[まえ]で卑[ひく]められることを始[はじ]めたのである。あなたは必[かなら]ず倒[たお]れる。彼に対抗[たいこう]することは決[けっ]してできない。生[い]ける神[かみ]が彼とともにおられるからである。」"
  14: "彼[かれ]らがまだ語[かた]っていると、宦官[かんがん]たちが来[き]て、エステルが用意[ようい]した酒宴[しゅえん]へアマンを急[いそ]がせた。"

notes:
  1: "ὁ κύριος ἀπέστησεν τὸν ὕπνον — «Господь отнял сон» (ἀφίστημι; слав. «отя сон»). τῷ διδασκάλῳ αὐτοῦ — «наставнику своему»: редкое для LXX слово; слав. «рабу своему» (сглаживание), по паритету взято церковное чтение しもべ (греч. διδάσκαλος — «наставник», чтение LXX). γράμματα μνημόσυνα τῶν ἡμερῶν — «памятные записи дней» (слав. «книги памятныя дний»), т. е. дворцовая хроника. εἰσφέρειν … ἀναγινώσκειν — «внести и читать»."
  2: "εὗρεν δὲ τὰ γράμματα — «нашлось в записях» (слав. «обрете писания»). ἀπήγγειλεν — «донёс, объявил» (ἀπαγγέλλω). ἐν τῷ φυλάσσειν αὐτούς — «когда они несли стражу» (φυλάσσω). ζητῆσαι ἐπιβαλεῖν τὰς χεῖρας — «искали наложить руки». Син. называет евнухов Гавафой и Ифаррой (масоретский текст), в LXX и слав. имён нет — не вносим."
  3: "τίνα δόξαν ἢ χάριν ἐποιήσαμεν — «какую славу или благодать мы сделали»: 1 л. мн. ч., царское «мы» (слав. «сотворихом»); в тексте единственное число по японской речевой норме. διάκονοι — «служители» (слав. «отроцы»). οὐκ ἐποίησας αὐτῷ οὐδέν — «ты не сделал ему ничего»; в слав. с вопросительным знаком, смысл отрицательный."
  4: "πυνθάνεσθαι περὶ τῆς εὐνοίας — «расспрашивать о благодеянии» (εὔνοια; слав. «о благодеянии»). ἰδοὺ Αμαν ἐν τῇ αὐλῇ — «вот Аман во дворе». κρεμάσαι … ἐπὶ τῷ ξύλῳ — «повесить на дереве» (κρεμάννυμι). Порядок греческого сохранён: сначала ремарка о том, что Аман во дворе, затем вопрос царя и только потом цель прихода Амана."
  5: "οἱ διάκονοι τοῦ βασιλέως — «служители царя» (слав. «отроцы царевы»). ἕστηκεν — перфект, «стоит». Καλέσατε αὐτόν — «позовите его»; Син. «пусть войдёт»."
  6: "τί ποιήσω τῷ ἀνθρώπῳ — «что сделать человеку». δοξάσαι — «прославить, почтить» (δοξάζω), в тексте 栄誉を与える. εἶπεν ἐν ἑαυτῷ — «сказал в себе», внутренняя речь без кавычек. εἰ μὴ ἐμέ — «если не меня», т. е. «кроме меня»."
  7: "Ἄνθρωπον, ὃν … — винительный падеж, продолжение в ст. 8 («человеку, которого царь хочет прославить, пусть принесут…»); в тексте その人には、. Речь Амана открыта здесь и закрыта в ст. 9."
  8: "στολὴν βυσσίνην — «одежду виссонную» (βύσσινος — тонкий лён, 亜麻布; слав. «виссонную»). ἣν ὁ βασιλεὺς περιβάλλεται — «которую царь надевает». ἵππον, ἐφ᾽ ὃν … ἐπιβαίνει — «коня, на которого царь садится». Син. добавляет венец на голову и передачу одеяния в руки князю — этого нет ни в LXX, ни в слав."
  9: "δότω ἑνὶ τῶν φίλων … τῶν ἐνδόξων — «пусть дадут одному из славных друзей царя» (ἔνδοξος — «знатный»); слав. «да дастся единому от другов царевых славных». στολισάτω — «пусть облечёт», ἀναβιβασάτω — «пусть посадит на коня» (ἀναβιβάζω). κηρυσσέτω διὰ τῆς πλατείας — «пусть провозглашает по широкой улице» (πλατεῖα, в тексте 広場, как в Иудифи и Товите); возглас внутри речи Амана — 『…』."
  10: "καθὼς ἐλάλησας — «как ты сказал». τῷ θεραπεύοντι ἐν τῇ αὐλῇ — «служащему во дворе» (θεραπεύω). μὴ παραπεσάτω σου λόγος — «пусть не выпадет [ни одно] слово твоё» (παραπίπτω); слав. «да не изменится слово твое»."
  11: "ἐστόλισεν — «облёк», ἀνεβίβασεν — «посадил [на коня]». διῆλθεν διὰ τῆς πλατείας — «прошёл по широкой улице». ἐκήρυσσεν — «провозглашал» (κηρύσσω). Слав. добавляет «(пред ним)» — в LXX нет; по паритету внесено (彼の前で)."
  12: "ἐπέστρεψεν … εἰς τὴν αὐλήν — «возвратился во двор» (ἐπιστρέφω), εἰς τὰ ἴδια — «к себе». λυπούμενος — «скорбя» (λυπέω). κατὰ κεφαλῆς — букв. «[с] головой», идиома траура «с покрытой головой» (то же выражение в 1 Кор 11:4); слав. «преклонив главу», в тексте 頭を垂れて по слав."
  13: "διηγήσατο τὰ συμβεβηκότα — «рассказал случившееся» (διηγέομαι, συμβαίνω). ἦρξαι ταπεινοῦσθαι — «ты начал смиряться» (ἄρχομαι, ταπεινόω). πεσὼν πεσῇ — гебраизм «падая падёшь», т. е. непременно упадёшь. οὐ μὴ δύνῃ … ἀμύνασθαι — «не сможешь защититься» (ἀμύνω); θεὸς ζῶν μετ᾽ αὐτοῦ — «Бог живой с ним»."
  14: "ἔτι αὐτῶν λαλούντων — «когда они ещё говорили» (родительный абсолютный). ἐπισπεύδοντες — «торопя» (ἐπισπεύδω). πότος — «питьё, пир» (ср. δοχή); слав. «на пир». Тире в конце стиха в модуле — редакционный знак, в текст не переносится."
