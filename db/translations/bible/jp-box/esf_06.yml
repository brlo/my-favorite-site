# Глава 6: бессонница царя и чтение памятных записей (1–3), приход Амана и вопрос
# о почести (4–6), совет Амана (7–9), приказ царя и чествование Мардохея (10–11),
# горе Амана и совет Зосары (12–14). Прямая речь: царь (3, 4, 5, 6, 10), служители
# (3, 5), Аман (6 — про себя, 7–9; возглас внутри его речи в 9 — 『…』), провозглашение
# Амана (11), Зосара и друзья (13). Красного и синего нет.
