# jp-box, 3-я Царств, глава 4. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); церковнославянский (csl-ru) — второй
# свидетель церковного текста (новый паритет, docs/japanese-bible.md):
# слав. чтения и добавки входят в основной текст без 〔…〕, вариант LXX — в notes.
# ru (Синодальный) — только для понимания, не источник. jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
#
# Нумерация — славяно-синодальная (по csl-ru): 34 стиха. Прежняя (греческая)
# глава 4 кончалась 19-м стихом; теперь в неё вошёл весь материал, который в LXX
# стоит в гл. 5 (гр 5:1–14 = слав. 4:20–34):
#   4:1–19  — сановники и двенадцать приставников (гр 4:1–19);
#   4:20–34 — «Иуда и Израиль мнози яко песок», трапеза и мудрость Соломона
#             (гр 5:1–14).
# Внутри 4:1–19 порядок один раз расходится с прежним греческим:
#   слав. 4:17 (Иосафат в Иссахаре) = прежний гр 4:19;
#   слав. 4:18 (Семей в Вениамине) = гр 4:17;
#   слав. 4:19 (Гавер в Галааде и Насиф) = гр 4:18.
# Слав. 4:2 — только вводка («сии старейшины иже беша с ним»), имя Азарии
# у слав. открывает 4:3; поэтому прежний гр 4:2 разделён: вводка оставлена
# в 4:2, Азария перенесён в 4:3 (оба текста сохранены).
# Внутри 4:20–34 слав. порядок иной, чем в прежней греческой гл. 5:
#   слав. 4:20–21 = гр 5:5–6; 4:22–24 = гр 5:2–4; 4:25–26 = гр 5:7–8;
#   4:27–28 = гр 5:1; 4:29–34 = гр 5:9–14 (+ суб-стих 14a в 4:34).
# Имена и топонимы — по gr (база), слав. варианты отмечены в notes; где текст gr
# испорчен (4:10–11), имя берётся у csl.
# 〔…〕 нет: всё взятое у csl отмечено в notes.
# Сносок ⟨…⟩ нет: 祭司, 神殿, 契約の箱, 燔祭 уже пояснены в корпусе.

tr_code: jp-box
book: 3ts
chapter: 4
draft: true

verses:
  1: "ソロモン王[おう]はイスラエルを治[おさ]めていた。"
  2: "これが彼[かれ]のもとにいた長[かしら]たちである。"
  3: "サドクの子[こ]アザリヤ。シバの子[こ]らエリアレフとアヒヤは書記[しょき]。アヒルデの子ヨシャファトは記録[きろく]係[がかり]。"
  4: "ヨヤダの子[こ]ベナヤは軍[ぐん]の長[ちょう]。サドクとアビアタルは祭司[さいし]。"
  5: "ナタンの子[こ]オルニヤは任命[にんめい]された者[もの]たちの上[うえ]にいた。ナタンの子ザブトは王[おう]の友[とも]であった。"
  6: "アヒエルは家[いえ]の管理[かんり]者[しゃ]。サフの子[こ]エリアブは一族[いちぞく]の上[うえ]に、エフラの子アドニラムは賦役[ふえき]の上にいた。"
  7: "ソロモンには、イスラエル全土[ぜんど]にわたって任命[にんめい]された者[もの]が十二人[にん]いて、王[おう]とその家[いえ]に食料[しょくりょう]を供給[きょうきゅう]した。年[とし]のうち一月[ひとつき]ずつ、それぞれが供給に当[あ]たった。"
  8: "エフライムの山[やま]の地[ち]にはベン・フルが一人[ひとり]いた。"
  9: "マケマス、ベタラミン、ベト・シェメシュ、そしてアイロンからベタナンに至[いた]るまでの地[ち]には、ベン・デケルが一人[ひとり]いた。"
  10: "アルボトにはベン・ヘセドがいた。ソコとヘフェルの全地[ぜんち]も彼[かれ]のものであった。"
  11: "ナファト・ドルの全地[ぜんち]には、アビナダブの子[こ]が一人[ひとり]いた。ソロモンの娘[むすめ]タファトが彼[かれ]の妻[つま]であった。"
  12: "タナク、メギド、イズレエルの下[した]にあるツァルタンのそばのベト・シャンの全地[ぜんち]、ベト・シャンからアベル・メホラを経[へ]てルカムの渡[わた]し場[ば]の向[む]こうに至[いた]るまでの地[ち]には、アヒルデの子[こ]バアナが一人[ひとり]いた。"
  13: "ギルアデのラモテにはベン・ゲベルがいた。バシャンにあるアルゴブの地方[ちほう]も彼[かれ]のもので、城壁[じょうへき]に囲[かこ]まれた大[おお]きな町[まち]が六十[ろくじゅう]あり、青銅[せいどう]のかんぬきがあった。"
  14: "マハナイムにはアヘルの子[こ]アヒナダブがいた。"
  15: "ネフタリにはアヒマアスが一人[ひとり]いた。彼[かれ]もソロモンの娘[むすめ]バセマトを妻[つま]にした。"
  16: "アシェルとバアロテにはフシャイの子[こ]バアナが一人[ひとり]いた。"
  17: "イッサカルにはフアスデの子[こ]ヨシャファトがいた。"
  18: "ベニヤミンにはエラの子[こ]シメイがいた。"
  19: "ガドの地[ち]、すなわちヘシュボンの王[おう]シホンとバシャンの王オグの地には、アダイの子[こ]ゲベルがいた。また、ユダの地にはナシフが一人[ひとり]いた。"
  20: "ユダとイスラエルは海辺[うみべ]の砂[すな]のように多[おお]く、食[た]べ、飲[の]み、楽[たの]しんでいた。"
  21: "ソロモンは、川[かわ]からペリシテ人[じん]の地[ち]、エジプトの境[さかい]に至[いた]るまでのすべての王国[おうこく]を支配[しはい]していた。それらの国々[くにぐに]は彼[かれ]に贈[おく]り物[もの]を持[も]って来[き]て、生涯[しょうがい]彼に仕[つか]えた。"
  22: "ソロモンの一日[いちにち]の食料[しょくりょう]は、上等[じょうとう]の小麦粉[こむぎこ]三十[さんじゅう]コル、ついた粉[こな]六十[ろくじゅう]コルであった。"
  23: "さらに、選[え]り抜[ぬ]きの子牛[こうし]十頭[じゅっとう]、放牧[ほうぼく]の雄牛[おうし]二十頭[にじゅっとう]、羊[ひつじ]百[ひゃく]匹[ぴき]、そのほかに鹿[しか]、かもしか、選り抜きの肥[こ]えた鳥[とり]が加[くわ]わった。"
  24: "彼[かれ]は川[かわ]の向[む]こう側[がわ]、ティフサハからガザに至[いた]るまでを治[おさ]める者[もの]であり、四方[しほう]のどこからも平和[へいわ]であった。"
  25: "ユダとイスラエルは、ダンからベエル・シェバに至[いた]るまで、ソロモンの生涯[しょうがい]、それぞれ自分[じぶん]のぶどうの木[き]の下[した]、いちじくの木の下で、食[た]べ、飲[の]みながら安[やす]らかに暮[く]らした。"
  26: "ソロモンには、戦車[せんしゃ]のための雌馬[めうま]が四万[よんまん]頭[とう]、騎兵[きへい]が二万[にまん]人[にん]いた。"
  27: "任命[にんめい]された者[もの]たちは、こうしてソロモン王[おう]に、王の食卓[しょくたく]に必要[ひつよう]なすべての品[しな]を、それぞれの月[つき]に、欠[か]けることなく供給[きょうきゅう]した。"
  28: "また、馬[うま]と戦車[せんしゃ]のための大麦[おおむぎ]と藁[わら]を、王がいる場所[ばしょ]へ、それぞれの割[わ]り当[あ]てに従[したが]って運[はこ]んだ。"
  29: "主[しゅ]はソロモンに思慮[しりょ]と非常[ひじょう]に多[おお]い知恵[ちえ]、海辺[うみべ]の砂[すな]のような広[ひろ]やかな心[こころ]を与[あた]えた。"
  30: "ソロモンの知恵[ちえ]は、すべての昔[むかし]の人々[ひとびと]の思慮[しりょ]よりも、またエジプトのすべての知者[ちしゃ]よりも、はるかに増[ま]し加[くわ]わった。"
  31: "彼[かれ]はすべての人[ひと]よりも、またエズラ人[じん]ガイタン、エマン、カルコル、ダルダ、マホルの子[こ]らよりも賢[かしこ]かった。その名[な]は四方[しほう]のすべての国々[くにぐに]に広[ひろ]まった。"
  32: "彼[かれ]は三千[さんぜん]のたとえ話[ばなし]を語[かた]り、その歌[うた]は五千[ごせん]首[しゅ]あった。"
  33: "彼[かれ]はレバノンの杉[すぎ]から壁[かべ]から生[は]えるヒソプに至[いた]るまでの木[き]について語[かた]り、獣[けもの]、鳥[とり]、這[は]うもの、魚[さかな]についても語った。"
  34: "すべての民[たみ]がソロモンの知恵[ちえ]を聞[き]こうとして来[き]た。彼[かれ]は、その知恵のうわさを聞いた地[ち]のすべての王[おう]から贈[おく]り物[もの]を受[う]け取[と]った。ソロモンはファラオの娘[むすめ]を妻[つま]に迎[むか]え、主[しゅ]の家[いえ]と自分[じぶん]の家、エルサレムの城壁[じょうへき]を建[た]て終[お]えるまで、彼女[かのじょ]をダビデの町[まち]へ連[つ]れて入[はい]った。"

notes:
  1: "καὶ ἦν ὁ βασιλεὺς Σαλωμων βασιλεύων ἐπὶ Ισραηλ — «и был царь Соломон царствующим над Израилем» (перифраза с причастием; слав. «бе царь соломон царствуяй»). ἐπὶ Ισραηλ — над Израилем; «всем» (как в ru) в gr нет. Здесь начинается список сановников; с 4:7 идут приставники по областям."
  2: "οἱ ἄρχοντες — начальники (слав. «старейшины»). οἳ ἦσαν αὐτοῦ — «которые были у него». У слав. 4:2 — только вводка («сии старейшины иже беша с ним»), а имя Азарии открывает 4:3; в gr имя стоит в конце 4:2. Поэтому прежний гр 4:2 разделён: вводка оставлена в 4:2, Азария перенесён в 4:3; оба текста сохранены."
  3: "Αζαριου υἱὸς Σαδωκ — Азария, сын Садока (слав. «азариа сын садоков, жрец»; титул 祭司 уже назван в 4:4, здесь не повторён). γραμματεῖς — писцы, книжники (слав. «книгочии»). ὑπομιμνῄσκων — «напоминающий», дееписатель, летописец (слав. «напоминатель»). υἱὸς Σαβα — в gr ед. ч. (сын Сивы — об Ахии), в csl «сынове сивины» — оба брата; взято csl."
  4: "ἱερεῖς — священники. В gr только «Садок и Авиафар, иереи»; «Ванеа сын Иодаев над силою» (ベナヤ, сын Иодая, над войском) — чтение csl (ср. МТ 4:4), в LXX его нет; по паритету внесено в основной текст без 〔…〕. サドク, アビアタル, ベナヤ, ヨヤダ — написания корпуса."
  5: "Ορνια — в csl «азариа» (Азария), в ru «Азария»; здесь по gr — オルニヤ, слав. вариант отмечен. ἐπὶ τῶν καθεσταμένων — над приставниками (καθεσταμένοι — «поставленные»; те же двенадцать в 4:7 и 4:27–28). ἑταῖρος τοῦ βασιλέως — «друг царя», придворный титул (слав. «друг царев»)."
  6: "οἰκονόμος — домоправитель (слав. «строитель»). ἐπὶ τῆς πατριᾶς — «над отечеством», над родовым округом. ἐπὶ τῶν φόρων — над податями и повинностями (слав. «над даньми»). Имена: gr Αχιηλ, Σαφ, Εφρα; в csl Ахисар, Сафат, Авдон (ср. ru «Ахисар», «Авда») — держимся gr, слав. варианты отмечены."
  7: "χορηγεῖν — снабжать, доставлять провизию (χορηγέω). καθεσταμένοι — «поставленные», приставники (слав. «приставник»). μῆνα ἐν τῷ ἐνιαυτῷ ἐγίνετο ἐπὶ τὸν ἕνα χορηγεῖν — «месяц в году приходился на одного, чтобы снабжать» (слав. «по месяцу в лете бываше един, еже подаяти»)."
  8: "Βενωρ — Бен-Хур (слав. «вен сын оров»). εἷς — «один»: счёт приставников, в тексте сохранён (一人). ἐν ὄρει Εφραιμ — на горе (нагорье) Ефремовой."
  9: "υἱὸς Ρηχαβ — «сын Декара», т. е. Бен-Декер (слав. «сын дакарь»). Μαχεμας, Βηθαλαμιν, Βαιθσαμυς, Αιλων ἕως Βαιθαναν — Макес, Бет-Аламин, Беф-Самис, Аилон до Беф-Анана (слав. махемат, висаламин, вефсамис, елон, вефанан). ベト・シェメシュ — написание корпуса."
  10: "Βηρβηθνεμα — тёмное место; csl даёт «во аравофе» (Арюбоф), поэтому アルボト. Λουσαμηνχα καὶ Ρησφαρα — в csl «сего сохо и вся земля оферова» (Соко и земля Хефер, ср. ru). Держимся csl; форма gr приведена здесь."
  11: "В gr текст испорчен: «Χιναναδαβ καὶ Αναφαθι, ἀνὴρ Ταβληθ»; по csl («сына аминадавля вся неффадор») и ru это Бен-Авинадав над всем Нафаф-Дором. θυγάτηρ Σαλωμων ἦν αὐτῷ εἰς γυναῖκα — дочь Соломона была ему женой (Тафафь, タファト). εἷς — «один»."
  12: "Θααναχ καὶ Μεκεδω — Танак и Мегиддо (タナク, メギド — написания корпуса). ὁ οἶκος Σαν ὁ παρὰ Σεσαθαν — «дом Сана близ Сесафана» (Беф-Шан; ベト・シャン). ὑποκάτω τοῦ Εσραε — ниже Изрееля (イズレエル). ἐκ Βαισαφουδ Εβελμαωλα — от Беф-Шана до Авел-Мехола. ἕως Μαεβερ Λουκαμ — до переправы Лукама (слав. «маевер лукам»; ru «за Иокмеам»)."
  13: "υἱὸς Γαβερ — Бен-Гебер (слав. «сын наверов», т. е. вариант имени Навер). σχοίνισμα Ερεγαβα — «удел Аргова» (σχοίνισμα — верёвочная мера, участок). ἑξήκοντα πόλεις μεγάλαι τειχήρεις — шестьдесят больших городов со стенами. μοχλοὶ χαλκοῖ — медные (бронзовые) засовы."
  14: "Αχιναδαβ υἱὸς Αχελ — Ахинадав, сын Ахела (слав. «сын саддов»). Μααναιν — Маханаим (マハナイム — написание корпуса)."
  15: "Αχιμαας ἐν Νεφθαλι — Ахимаас в Неффалиме. Βασεμμαθ — Васемафа, дочь Соломона, его жена. εἷς — «один»."
  16: "Βαανα υἱὸς Χουσι ἐν τῇ Μααλαθ — в gr «в Маалафе»; csl «во асире и во ваалофе» (в Асире и Ваалофе, ср. МТ 4:16) — внесено по csl, форма gr отмечена. εἷς — «один»."
  17: "Ιωσαφατ υἱὸς Φουασουδ ἐν Ισσαχαρ — Иосафат, сын Фуасуда (слав. «иосафат сын фаруев»; ru «сын Паруаха»), в Иссахаре. У слав. этот стих открывает конец списка (4:17), а в прежней греческой нумерации он стоял последним (гр 4:19): отсюда перестановка трёх последних стихов."
  18: "Σαμαα υἱὸς Ηλα ἐν τῷ Βενιαμιν — Самеа (Шимей), сын Илы, в Вениамине. В прежней греческой нумерации — 4:17; у слав. порядок иной: Иссахар (4:17) — Вениамин (4:18) — Гад (4:19)."
  19: "Γαβερ υἱὸς Αδαι — Гевер, сын Адая (слав. «гавер сын адаев»). γῇ Σηων βασιλέως τοῦ Εσεβων καὶ Ωγ βασιλέως τοῦ Βασαν — земля Сигона, царя Есевонского, и Ога, царя Васанского. καὶ νασιφ εἷς ἐν γῇ Ιουδα — «и Насиф, один, в земле Иудовой» (слав. «и насиф един в земли иудове»); тёмное место, сохранено. В прежней греческой нумерации — 4:18."
  20: "В gr-lxx-byz (и в gr-ru) на месте прежнего гр 5:5 стоит «.» — текст в модуле утрачен. Стих дан по csl 4:20: Иуда и Израиль многочисленны, как песок при море, едят, пьют и веселятся (МТ 4:20). У слав. здесь начинается ряд 4:20–34, которого в гр. гл. 4 нет вовсе (в LXX он стоит в 5:1–14)."
  21: "Стих по csl 4:21 (в gr на месте прежнего гр 5:6 «.»): Соломон владел всеми царствами от реки до земли Филистимской и до пределов Египта; приносили дары и служили ему во все дни жизни его (МТ 4:21)."
  22: "σεμίδαλις — тонкая пшеничная мука (上等の小麦粉); ἄλευρον κεκοπανισμένον — «толчёная» мука (слав. «мука смешаная»), т. е. обычная; κόρος — кор (コル — мера сыпучего). = csl 4:22 (прежний гр 5:2)."
  23: "μόσχοι ἐκλεκτοί — отборные телята; βόες νομάδες — пастбищные, откормленные на траве волы (слав. «волов тучных»); πρόβατα — овцы; ἐκτὸς ἐλάφων καὶ δορκάδων καὶ ὀρνίθων ἐκλεκτῶν, σιτευτά — кроме оленей, косуль и отборных откормленных птиц. = csl 4:23 (прежний гр 5:3)."
  24: "πέραν τοῦ ποταμοῦ — за рекой (Евфрат). В csl 4:24 прибавлено «от фапсы и даже до газы» (ἀπὸ Θαψακοῦ ἕως Γάζης), в gr прежнего 5:4 этой клаузы нет — по паритету внесено в текст (ティフサハ, ガザ). εἰρήνη ἐκ πάντων τῶν μερῶν κυκλόθεν — мир со всех сторон. = csl 4:24 (прежний гр 5:4)."
  25: "Стих по csl 4:25 (в gr на месте прежнего гр 5:7 «.»): Иуда и Израиль жили беспечально, каждый под виноградом своим и под смоковницей своею, от Дана до Вирсавии, во все дни Соломона (МТ 4:25)."
  26: "Стих по csl 4:26 (в gr на месте прежнего гр 5:8 «.»): у Соломона сорок тысяч кобылиц для колесниц и двадцать тысяч всадников; в ru/МТ — двенадцать тысяч всадников. Держимся csl как церковного чтения, расхождение отмечено."
  27: "ἐχορήγουν — снабжали (χορηγέω); τὰ διαγγέλματα — «распоряжения», всё назначенное к столу; οὐ παραλλάσσουσιν λόγον — «не изменяют слова», т. е. не допускают недостатка (слав. «не пременяюще словесе»); κατὰ τὴν σύνταξιν αὐτοῦ — по своему распорядку; ἐν μηνὶ αὐτοῦ — в свой месяц. = csl 4:27; это первая половина прежнего гр 5:1 (у слав. стих 4:27 отдельный)."
  28: "κριθὰς καὶ ἄχυρα — ячмень и солома (слав. «ячмень и плевы»); ἵπποις καὶ ἅρμασιν — коням и колесницам; εἰς τὸν τόπον, οὗ ἂν ᾖ ὁ βασιλεύς — на место, где царь; κατὰ τὴν σύνταξιν — по своему чину (слав. «кийждо по чину своему»). = csl 4:28; вторая половина прежнего гр 5:1, у слав. отдельный стих."
  29: "ἔδωκεν κύριος φρόνησιν — Господь дал разумение (слав. «смысл»); σοφίαν πολλὴν σφόδρα — весьма много мудрости; χύμα καρδίας — «разлитие сердца», широта ума (слав. «широту сердца»); ἄμμος ἡ παρὰ τὴν θάλασσαν — песок приморский. = csl 4:29 (прежний гр 5:9; в ru «Бог» вместо «Господь»)."
  30: "ἐπληθύνθη — «умножился» (о мудрости); ὑπὲρ τὴν φρόνησιν πάντων ἀρχαίων ἀνθρώπων — сверх разумения всех древних людей; τοὺς φρονίμους Αἰγύπτου — разумных Египта. = csl 4:30 (прежний гр 5:10)."
  31: "ἐσοφίσατο — «умудрился», стал мудрее (σοφίζω); Γαιθαν τὸν Εζραίτην — Гефан Езрахитянин (エズラ人); Αιμαν, Χαλκαλ, Δαρδα υἱοὺς Μαλ — Еман, Халкал, Дарда, сыновья Махола (слав. «сына самадова» — ед. ч.). Клауза «и прославилось имя его во всех окрестных странах» есть в csl, в gr прежнего 5:11 её нет — внесена. = csl 4:31 (прежний гр 5:11)."
  32: "παραβολάς — притчи, подобия (слав. «притчи»); ᾠδαί — песни; τρισχιλίας / πεντακισχίλιαι — три тысячи / пять тысяч. = csl 4:32 (прежний гр 5:12)."
  33: "ἀπὸ τῆς κέδρου τῆς ἐν τῷ Λιβάνῳ — от кедра Ливанского (杉); ὕσσωπος ἡ ἐκπορευομένη διὰ τοῦ τοίχου — иссоп, вырастающий из стены (ヒソプ); κτήνη — скот, звери; πετεινά — птицы; ἑρπετά — пресмыкающиеся (這うもの); ἰχθύες — рыбы. = csl 4:33 (прежний гр 5:13)."
  34: "παρεγίνοντο — приходили; ἐλάμβανεν δῶρα — принимал дары. = csl 4:34 (прежний гр 5:14). Вторая половина стиха — суб-стих «14a» (в тексте модуля помечен цифрой): о дочери фараона; у слав. 4:34 её нет — этот рассказ стоит в слав. 3:1 и 9:24 (ср. гр 9:16 — «.»). Оставлен здесь, чтобы не потерять текст модуля; τὸ τεῖχος Ιερουσαλημ — стена Иерусалима."
