# jp-box, 3-я Царств, глава 4. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); церковнославянский (csl-ru) — второй
# свидетель церковного текста (новый паритет, docs/japanese-bible.md):
# слав. чтения и добавки входят в основной текст без 〔…〕, вариант LXX — в notes.
# ru (Синодальный) — только для понимания, не источник. jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 4: сановники Соломона (1–6) и двенадцать приставников по областям (7–19).
# Нумерация по gr: 19 стихов. У csl 34: 4:20–34 (процветание и мудрость) в gr
# стоят в гл. 5 (5:1–14), поэтому здесь их нет — глава кончается списком областей.
# Внутри 4:2–4 нумерация csl сдвинута на стих: в gr имя Азарии уже в 4:2, у csl —
# в 4:3. В 4:4 csl добавляет «Ванеа сын Иодаев над силою» (в LXX нет) — внесено.
# Имена и топонимы — по gr (база), слав. варианты отмечены в notes; где текст gr
# испорчен (4:10–11), имя берётся у csl.
# 〔…〕 нет: всё взятое у csl отмечено в notes.
# Сносок ⟨…⟩ нет: 祭司, 神殿, 契約の箱, 燔祭 уже пояснены в корпусе.

tr_code: jp-box
book: 3ts
chapter: 4
draft: true

verses:
  1: "ソロモン王[おう]はイスラエルを治[おさ]めていた。"
  2: "これが彼[かれ]のもとにいた長[かしら]たちである。サドクの子[こ]アザリヤ。"
  3: "シバの子[こ]らエリアレフとアヒヤは書記[しょき]。アヒルデの子ヨシャファトは記録[きろく]係[がかり]。"
  4: "ヨヤダの子[こ]ベナヤは軍[ぐん]の長[ちょう]。サドクとアビアタルは祭司[さいし]。"
  5: "ナタンの子[こ]オルニヤは任命[にんめい]された者[もの]たちの上[うえ]にいた。ナタンの子ザブトは王[おう]の友[とも]であった。"
  6: "アヒエルは家[いえ]の管理[かんり]者[しゃ]。サフの子[こ]エリアブは一族[いちぞく]の上[うえ]に、エフラの子アドニラムは賦役[ふえき]の上にいた。"
  7: "ソロモンには、イスラエル全土[ぜんど]にわたって任命[にんめい]された者[もの]が十二人[にん]いて、王[おう]とその家[いえ]に食料[しょくりょう]を供給[きょうきゅう]した。年[とし]のうち一月[ひとつき]ずつ、それぞれが供給に当[あ]たった。"
  8: "エフライムの山[やま]の地[ち]にはベン・フルが一人[ひとり]いた。"
  9: "マケマス、ベタラミン、ベト・シェメシュ、そしてアイロンからベタナンに至[いた]るまでの地[ち]には、ベン・デケルが一人[ひとり]いた。"
  10: "アルボトにはベン・ヘセドがいた。ソコとヘフェルの全地[ぜんち]も彼[かれ]のものであった。"
  11: "ナファト・ドルの全地[ぜんち]には、アビナダブの子[こ]が一人[ひとり]いた。ソロモンの娘[むすめ]タファトが彼[かれ]の妻[つま]であった。"
  12: "タナク、メギド、イズレエルの下[した]にあるツァルタンのそばのベト・シャンの全地[ぜんち]、ベト・シャンからアベル・メホラを経[へ]てルカムの渡[わた]し場[ば]の向[む]こうに至[いた]るまでの地[ち]には、アヒルデの子[こ]バアナが一人[ひとり]いた。"
  13: "ギルアデのラモテにはベン・ゲベルがいた。バシャンにあるアルゴブの地方[ちほう]も彼[かれ]のもので、城壁[じょうへき]に囲[かこ]まれた大[おお]きな町[まち]が六十[ろくじゅう]あり、青銅[せいどう]のかんぬきがあった。"
  14: "マハナイムにはアヘルの子[こ]アヒナダブがいた。"
  15: "ネフタリにはアヒマアスが一人[ひとり]いた。彼[かれ]もソロモンの娘[むすめ]バセマトを妻[つま]にした。"
  16: "アシェルとバアロテにはフシャイの子[こ]バアナが一人[ひとり]いた。"
  17: "ベニヤミンにはエラの子[こ]シメイがいた。"
  18: "ガドの地[ち]、すなわちヘシュボンの王[おう]シホンとバシャンの王オグの地には、アダイの子[こ]ゲベルがいた。また、ユダの地にはナシフが一人[ひとり]いた。"
  19: "イッサカルにはフアスデの子[こ]ヨシャファトがいた。"

notes:
  1: "καὶ ἦν ὁ βασιλεὺς Σαλωμων βασιλεύων ἐπὶ Ισραηλ — «и был царь Соломон царствующим над Израилем» (перифраза с причастием; слав. «бе царь соломон царствуяй»). ἐπὶ Ισραηλ — над Израилем; «всем» (как в ru) в gr нет. Здесь начинается список сановников; с 4:7 идут приставники по областям."
  2: "οἱ ἄρχοντες — начальники (слав. «старейшины»). οἳ ἦσαν αὐτοῦ — «которые были у него». Αζαριου υἱὸς Σαδωκ — Азария, сын Садока; в csl это имя открывает 4:3 («азариа сын садоков, жрец»), а gr 4:2 — вводная фраза вместе с именем: отсюда сдвиг нумерации csl на стих (csl 4:3 = gr 4:2–3)."
  3: "γραμματεῖς — писцы, книжники (слав. «книгочии»). ὑπομιμνῄσκων — «напоминающий», дееписатель, летописец (слав. «напоминатель»). υἱὸς Σαβα — в gr ед. ч. (сын Сивы — об Ахии), в csl «сынове сивины» — оба брата; взято csl."
  4: "ἱερεῖς — священники. В gr только «Садок и Авиафар, иереи»; «Ванеа сын Иодаев над силою» (ベナヤ, сын Иодая, над войском) — чтение csl (ср. МТ 4:4), в LXX его нет; по паритету внесено в основной текст без 〔…〕. サドク, アビアタル, ベナヤ, ヨヤダ — написания корпуса."
  5: "Ορνια — в csl «азариа» (Азария), в ru «Азария»; здесь по gr — オルニヤ, слав. вариант отмечен. ἐπὶ τῶν καθεσταμένων — над приставниками (καθεσταμένοι — «поставленные»; те же двенадцать в 4:7 и 5:1). ἑταῖρος τοῦ βασιλέως — «друг царя», придворный титул (слав. «друг царев»)."
  6: "οἰκονόμος — домоправитель (слав. «строитель»). ἐπὶ τῆς πατριᾶς — «над отечеством», над родовым округом. ἐπὶ τῶν φόρων — над податями и повинностями (слав. «над даньми»). Имена: gr Αχιηλ, Σαφ, Εφρα; в csl Ахисар, Сафат, Авдон (ср. ru «Ахисар», «Авда») — держимся gr, слав. варианты отмечены."
  7: "χορηγεῖν — снабжать, доставлять провизию (χορηγέω). καθεσταμένοι — «поставленные», приставники (слав. «приставник»). μῆνα ἐν τῷ ἐνιαυτῷ ἐγίνετο ἐπὶ τὸν ἕνα χορηγεῖν — «месяц в году приходился на одного, чтобы снабжать» (слав. «по месяцу в лете бываше един, еже подаяти»)."
  8: "Βενωρ — Бен-Хур (слав. «вен сын оров»). εἷς — «один»: счёт приставников, в тексте сохранён (一人). ἐν ὄρει Εφραιμ — на горе (нагорье) Ефремовой."
  9: "υἱὸς Ρηχαβ — «сын Декара», т. е. Бен-Декер (слав. «сын дакарь»). Μαχεμας, Βηθαλαμιν, Βαιθσαμυς, Αιλων ἕως Βαιθαναν — Макес, Бет-Аламин, Беф-Самис, Аилон до Беф-Анана (слав. махемат, висаламин, вефсамис, елон, вефанан). ベト・シェメシュ — написание корпуса."
  10: "Βηρβηθνεμα — тёмное место; csl даёт «во аравофе» (Арюбоф), поэтому アルボト. Λουσαμηνχα καὶ Ρησφαρα — в csl «сего сохо и вся земля оферова» (Соко и земля Хефер, ср. ru). Держимся csl; форма gr приведена здесь."
  11: "В gr текст испорчен: «Χιναναδαβ καὶ Αναφαθι, ἀνὴρ Ταβληθ»; по csl («сына аминадавля вся неффадор») и ru это Бен-Авинадав над всем Нафаф-Дором. θυγάτηρ Σαλωμων ἦν αὐτῷ εἰς γυναῖκα — дочь Соломона была ему женой (Тафафь, タファト). εἷς — «один»."
  12: "Θααναχ καὶ Μεκεδω — Танак и Мегиддо (タナク, メギド — написания корпуса). ὁ οἶκος Σαν ὁ παρὰ Σεσαθαν — «дом Сана близ Сесафана» (Беф-Шан; ベト・シャン). ὑποκάτω τοῦ Εσραε — ниже Изрееля (イズレエル). ἐκ Βαισαφουδ Εβελμαωλα — от Беф-Шана до Авел-Мехола. ἕως Μαεβερ Λουκαμ — до переправы Лукама (слав. «маевер лукам»; ru «за Иокмеам»)."
  13: "υἱὸς Γαβερ — Бен-Гебер (слав. «сын наверов», т. е. вариант имени Навер). σχοίνισμα Ερεγαβα — «удел Аргова» (σχοίνισμα — верёвочная мера, участок). ἑξήκοντα πόλεις μεγάλαι τειχήρεις — шестьдесят больших городов со стенами. μοχλοὶ χαλκοῖ — медные (бронзовые) засовы."
  14: "Αχιναδαβ υἱὸς Αχελ — Ахинадав, сын Ахела (слав. «сын саддов»). Μααναιν — Маханаим (マハナイム — написание корпуса)."
  15: "Αχιμαας ἐν Νεφθαλι — Ахимаас в Неффалиме. Βασεμμαθ — Васемафа, дочь Соломона, его жена. εἷς — «один»."
  16: "Βαανα υἱὸς Χουσι ἐν τῇ Μααλαθ — в gr «в Маалафе»; csl «во асире и во ваалофе» (в Асире и Ваалофе, ср. МТ 4:16) — внесено по csl, форма gr отмечена. εἷς — «один»."
  17: "Σαμαα υἱὸς Ηλα ἐν τῷ Βενιαμιν — Самеа (Шимей), сын Илы, в Вениамине. У csl этот стих стоит как 4:18, а csl 4:17 — Иосафат в Иссахаре (gr 4:19): последние три стиха у csl переставлены, держимся gr."
  18: "Γαβερ υἱὸς Αδαι — Гевер, сын Адая (слав. «гавер сын адаев»). γῇ Σηων βασιλέως τοῦ Εσεβων καὶ Ωγ βασιλέως τοῦ Βασαν — земля Сигона, царя Есевонского, и Ога, царя Васанского. καὶ νασιφ εἷς ἐν γῇ Ιουδα — «и Насиф, один, в земле Иудовой» (слав. «и насиф един в земли иудове»); тёмное место, сохранено."
  19: "Ιωσαφατ υἱὸς Φουασουδ ἐν Ισσαχαρ — Иосафат, сын Фуасуда (слав. «иосафат сын фаруев»; ru «сын Паруаха»), в Иссахаре. У csl этот стих — 4:17; держимся gr, порядок и имя отмечены."
