verses:
  1: "主[しゅ]はモーセに語[かた]って言[い]われた。"
  2: "「あなたは銀[ぎん]のラッパを二本[にほん]作[つく]りなさい。打[う]ち延[の]ばして作るのである。それは、会衆[かいしゅう]を呼[よ]び集[あつ]め、宿営[しゅくえい]を出[で]て旅[たび]立[だ]つときに用[もち]いるためのものとなる。"
  3: "それらを吹[ふ]き鳴[な]らすと、会衆[かいしゅう]はすべて証[あかし]の幕屋[まくや]の入口[いりぐち]に集[あつ]まる。"
  4: "一[ひと]本[ぼん]だけ吹[ふ]き鳴[な]らすなら、すべての首長[しゅちょう]、イスラエルの長[おさ]たちが、あなたのもとへ来[き]る。"
  5: "合図[あいず]を吹[ふ]き鳴[な]らすと、東[ひがし]に陣[じん]を取[と]っている宿営[しゅくえい]が旅[たび]立[だ]つ。"
  6: "第二[だいに]の合図[あいず]を吹[ふ]き鳴[な]らすと、南[みなみ]に陣[じん]を取っている宿営[しゅくえい]が旅[たび]立[だ]つ。第三[だいさん]の合図を吹き鳴らすと、海[うみ]の側[そば]に陣を取っている宿営が旅立つ。第四[だいよん]の合図を吹き鳴らすと、北[きた]に陣を取っている宿営が旅立つ。彼[かれ]らは旅立つとき、合図を吹き鳴らす。"
  7: "会衆[かいしゅう]を集[あつ]めるときは、吹[ふ]き鳴[な]らしなさい。ただし、合図[あいず]としてではない。"
  8: "アロンの子[こ]らである祭司[さいし]たちがラッパを吹[ふ]き鳴[な]らす。これはあなたがたの世代[せだい]にわたる永遠[えいえん]の定[さだ]めとなる。"
  9: "あなたがたの地[ち]で、あなたがたに敵対[てきたい]して立[た]つ敵[てき]との戦[たたか]いに出[で]るときは、ラッパで合図[あいず]を吹[ふ]き鳴[な]らしなさい。そうすれば、あなたがたは主[しゅ]の前[まえ]に覚[おぼ]えられ、敵から救[すく]われる。"
  10: "あなたがたの喜[よろこ]びの日[ひ]、祭[まつ]り、新月[しんげつ]には、燔祭[はんさい]と酬恩祭[しゅうおんさい]の犠牲[ぎせい]の上[うえ]にラッパを吹[ふ]き鳴[な]らしなさい。それはあなたがたの神[かみ]の前[まえ]で、あなたがたの記念[きねん]となる。わたしはあなたがたの神、主[しゅ]である。」"
  11: "二年目[にねんめ]の第二[だいに]の月[つき]の二十日[にじゅうにち]に、雲[くも]は証[あかし]の幕屋[まくや]から上[あ]がった。"
  12: "イスラエルの子[こ]らは、その全[すべ]てのものとともにシナイの荒野[こうや]を旅[たび]立[だ]った。雲[くも]はパランの荒野にとどまった。"
  13: "彼[かれ]らはまず、モーセの手[て]による主[しゅ]の声[こえ]に従[したが]って旅[たび]立[だ]った。"
  14: "まず、ユダの子[こ]らの宿営[しゅくえい]の隊[たい]が、その軍勢[ぐんせい]とともに旅[たび]立[だ]った。その軍勢の上[うえ]には、アミナダブの子ナアソンがいた。"
  15: "また、イッサカルの子[こ]らの部族[ぶぞく]の軍勢[ぐんせい]の上[うえ]には、ソガルの子ナタナエルがいた。"
  16: "また、ゼブルンの子[こ]らの部族[ぶぞく]の軍勢[ぐんせい]の上[うえ]には、ヘロンの子エリアブがいた。"
  17: "幕屋[まくや]が下[お]ろされると、ゲルションの子[こ]らとメラリの子らが幕屋を担[かつ]いで旅[たび]立[だ]った。"
  18: "次[つぎ]に、ルベンの宿営[しゅくえい]の隊[たい]が、その軍勢[ぐんせい]とともに旅[たび]立[だ]った。その軍勢の上[うえ]には、セデウルの子エリツルがいた。"
  19: "また、シメオンの子[こ]らの部族[ぶぞく]の軍勢[ぐんせい]の上[うえ]には、スリサダイの子サラミエルがいた。"
  20: "また、ガドの子[こ]らの部族[ぶぞく]の軍勢[ぐんせい]の上[うえ]には、レグエルの子エリサフがいた。"
  21: "次に、カアトの子[こ]らが聖[せい]なるものを担[かつ]いで旅[たび]立[だ]った。彼[かれ]らが着[つ]くまでに、幕屋[まくや]は建[た]てられた。"
  22: "次に、エフライムの子[こ]らの宿営[しゅくえい]の隊[たい]が、その軍勢[ぐんせい]とともに旅[たび]立[だ]った。その軍勢の上[うえ]には、アミフドの子エリシャマがいた。"
  23: "また、マナセの子[こ]らの部族[ぶぞく]の軍勢[ぐんせい]の上[うえ]には、ペダツルの子ガマリエルがいた。"
  24: "また、ベニヤミンの子[こ]らの部族[ぶぞく]の軍勢[ぐんせい]の上[うえ]には、ギデオニの子アビダンがいた。"
  25: "最後[さいご]に、ダンの子[こ]らの宿営[しゅくえい]の隊[たい]が、すべての宿営の後[あと]について、その軍勢[ぐんせい]とともに旅[たび]立[だ]った。その軍勢の上[うえ]には、アミシャダイの子アヒエゼルがいた。"
  26: "また、アシェルの子[こ]らの部族[ぶぞく]の軍勢[ぐんせい]の上[うえ]には、オフランの子パギエルがいた。"
  27: "また、ナフタリの子[こ]らの部族[ぶぞく]の軍勢[ぐんせい]の上[うえ]には、エナンの子アヒラがいた。"
  28: "これがイスラエルの子[こ]らの軍勢[ぐんせい]の隊列[たいれつ]である。彼[かれ]らはその軍勢とともに旅[たび]立[だ]った。"
  29: "モーセは、ミディアン人[じん]ラグエルの子[こ]ホバブ、すなわちモーセの親族[しんぞく]に言[い]った。「わたしたちは、主[しゅ]が『あなたがたに与[あた]える』と言[い]われた所[ところ]へ旅[たび]立[だ]ちます。わたしたちと一緒[いっしょ]に来[き]てください。あなたによくしてあげます。主はイスラエルについて良[よ]いことを語[かた]られたからです。」"
  30: "しかし彼[かれ]は言[い]った。「わたしは行[い]きません。自分[じぶん]の国[くに]へ、自分の一族[いちぞく]のもとへ帰[かえ]ります。」"
  31: "モーセは言[い]った。「わたしたちを離[はな]れないでください。あなたは荒野[こうや]でわたしたちとともにいたのですから、わたしたちのうちで長老[ちょうろう]となってください。」"
  32: "もしあなたがわたしたちと一緒[いっしょ]に行[い]くなら、主[しゅ]がわたしたちに施[ほどこ]してくださる良[よ]いことを、わたしたちはあなたにも施します。"
  33: "彼[かれ]らは主[しゅ]の山[やま]を発[た]って、三日[みっか]の道[みち]の旅[たび]に出[で]た。主の契約[けいやく]の箱[はこ]は彼らより先[さき]に三日の道を行[い]き、彼らが休[やす]む所[ところ]を探[さが]した。"
  34: "箱[はこ]が旅[たび]立[だ]つとき、モーセは言[い]った。「主[しゅ]よ、立[た]ち上[あ]がってください。あなたの敵[てき]が散[ち]らされ、あなたを憎[にく]む者[もの]がみな、あなたの前[まえ]から逃[に]げますように。」"
  35: "箱がとどまるときには、言[い]った。「主[しゅ]よ、イスラエルの幾千[いくせん]、幾万[いくまん]のもとへ戻[もど]ってください。」"
  36: "彼[かれ]らが宿営[しゅくえい]を出[で]て旅[たび]立[だ]つとき、雲[くも]は昼[ひる]、彼らの上[うえ]に影[かげ]を落[お]とした。"

notes:
  1: "ἐλάλησεν κύριος πρὸς Μωυσῆν λέγων — введение речи (λέγων отдельно не переводится; речь — ст. 2)."
  2: "σάλπιγγας ἀργυρᾶς — серебряные трубы. ἐλατὰς ποιήσεις αὐτάς — коваными (чеканными) сделаешь их (ἐλατός от ἐλαύνω — «ковать, тянуть»; слав. «кованы»). ἀνακαλεῖν τὴν συναγωγήν — созывать собрание (ἀνακαλέω). ἐξαίρειν τὰς παρεμβολάς — снимать станы, выступать (ἐξαίρω)."
  3: "σαλπίσεις ἐν αὐταῖς — затрубишь в них. συναχθήσεται πᾶσα ἡ συναγωγή — соберётся всё собрание. ἐπὶ τὴν θύραν τῆς σκηνῆς τοῦ μαρτυρίου — к двери скинии свидетельства. В gr-lxx-byz нет «к тебе» (слав. и Синодальный прибавляют)."
  4: "ἐν μιᾷ σαλπίσωσιν — затрубят в одну (трубу). προσελεύσονται πρὸς σέ — придут к тебе. οἱ ἄρχοντες, ἀρχηγοὶ Ισραηλ — начальники, вожди Израиля; в LXX здесь нет «тысяченачальников» (слав. прибавляет)."
  5: "σαλπιεῖτε σημασίαν — затрубите сигнал (σημασία — «знак, сигнал тревоги»; слав. «в знамение», Синодальный «тревогу»). αἱ παρεμβολαὶ αἱ παρεμβάλλουσαι ἀνατολάς — станы, стоящие к востоку (ἀνατολή — «восток»)."
  6: "σημασίαν δευτέραν … τρίτην … τετάρτην — второй, третий, четвёртый сигнал. αἱ παρεμβάλλουσαι λίβα — стоящие к югу (λίψ — «южный ветер, юг»). παρὰ θάλασσαν — при море, т. е. западная сторона (Средиземное море к западу от Израиля). πρὸς βορρᾶν — к северу. σημασίᾳ σαλπιοῦσιν ἐν τῇ ἐξάρσει αὐτῶν — сигналом трубят при выступлении своём."
  7: "ὅταν συναγάγητε τὴν συναγωγήν — когда соберёте собрание. σαλπιεῖτε καὶ οὐ σημασίᾳ — трубите, но не сигнал (датив σημασίᾳ — «как сигнал»; слав. «не в знамение»)."
  8: "οἱ υἱοὶ Ααρων οἱ ἱερεῖς — сыны Аарона, священники. νόμιμον αἰώνιον — постановление вечное (νόμιμος — «законный, уставный»). εἰς τὰς γενεὰς ὑμῶν — в роды ваши."
  9: "ἐξέλθητε εἰς πόλεμον ἐν τῇ γῇ ὑμῶν — выйдете на войну в земле вашей. πρὸς τοὺς ὑπεναντίους τοὺς ἀνθεστηκότας ὑμῖν — против противников, восставших на вас (ὑπεναντίος, ἀνθίστημι). σημανεῖτε ταῖς σάλπιγξιν — дадите сигнал трубами (σημαίνω). ἀναμνησθήσεσθε ἔναντι κυρίου — будете вспомянуты пред Господом. διασωθήσεσθε — будете спасены (διασῴζω)."
  10: "ἐν ταῖς ἡμέραις τῆς εὐφροσύνης — в дни веселия. ἐν ταῖς ἑορταῖς — в праздники. ἐν ταῖς νουμηνίαις — в новомесячия (νουμηνία — первый день месяца; 新月). ἐπὶ τοῖς ὁλοκαυτώμασιν — при всесожжениях. ἐπὶ ταῖς θυσίαις τῶν σωτηρίων — при жертвах спасения, т. е. мирных (σωτήριον — «спасительная жертва»; 酬恩祭). ἀνάμνησις ἔναντι τοῦ θεοῦ — воспоминание пред Богом. ἐγὼ κύριος ὁ θεὸς ὑμῶν — формула завета."
  11: "ἐν τῷ ἐνιαυτῷ τῷ δευτέρῳ — во второй год. εἰκάδι τοῦ μηνός — двадцатого числа месяца (εἰκάς — «двадцатка»). ἀνέβη ἡ νεφέλη ἀπὸ τῆς σκηνῆς — поднялось облако от скинии."
  12: "σὺν ἀπαρτίαις αὐτῶν — со всем снаряжением (обозом) своим (ἀπαρτία — «снаряжение, обоз»; слав. «со имениями»). ἐν τῇ ἐρήμῳ Σινα — в пустыне Синай. ἔστη ἡ νεφέλη — стало облако. ἐν τῇ ἐρήμῳ τοῦ Φαραν — в пустыне Фаран."
  13: "ἐξῆραν πρῶτοι — выступили первыми. διὰ φωνῆς κυρίου — по голосу Господню. ἐν χειρὶ Μωυσῆ — рукою Моисея."
  14: "τάγμα παρεμβολῆς υἱῶν Ιουδα — строй (отряд) стана сынов Иудиных (τάγμα — «отряд, строй»; слав. «знамя полка»). πρῶτοι σὺν δυνάμει αὐτῶν — первые с силою (ополчением) своею. ἐπὶ τῆς δυνάμεως αὐτῶν — над ополчением их, т. е. во главе: Наассон, сын Аминадава."
  15: "φυλῆς υἱῶν Ισσαχαρ — колена сынов Иссахаровых. Ναθαναηλ υἱὸς Σωγαρ — Нафанаил, сын Цуара (Σωγαρ; в Синодальном Цуар)."
  16: "Ελιαβ υἱὸς Χαιλων — Елиав, сын Хелона (Χαιλων; в Синодальном Хелон)."
  17: "καθελοῦσιν τὴν σκηνήν — снимут скинию (καθαιρέω). οἱ υἱοὶ Γεδσων καὶ οἱ υἱοὶ Μεραρι — сыны Гирсоновы и Мерарины. αἴροντες τὴν σκηνήν — носящие скинию."
  18: "τάγμα παρεμβολῆς Ρουβην — строй стана Рувимова. Ελισουρ υἱὸς Σεδιουρ — Елицур, сын Шедеура (LXX Σεδιουρ)."
  19: "Σαλαμιηλ υἱὸς Σουρισαδαι — Саламиил, сын Сурисадая (в Синодальном Шелумиил, сын Цуришаддая)."
  20: "Ελισαφ ὁ τοῦ Ραγουηλ — Елисаф, сын Рагуилов (ὁ τοῦ — «тот, что от»)."
  21: "οἱ υἱοὶ Κααθ — сыны Каафовы. αἴροντες τὰ ἅγια — носящие святыни (τὰ ἅγια). στήσουσιν τὴν σκηνήν, ἕως παραγένωνται — поставят скинию, пока они не придут (т. е. скиния ставится к их приходу)."
  22: "Ελισαμα υἱὸς Εμιουδ — Елишама, сын Аммиуда (LXX Εμιουδ)."
  23: "Γαμαλιηλ ὁ τοῦ Φαδασσουρ — Гамалиил, сын Педацура (LXX Φαδασσουρ)."
  24: "Αβιδαν ὁ τοῦ Γαδεωνι — Авидан, сын Гидеония (Γαδεωνι; в Синодальном Гидеоний)."
  25: "ἔσχατοι πασῶν τῶν παρεμβολῶν — последние из всех станов. Αχιεζερ ὁ τοῦ Αμισαδαι — Ахиезер, сын Аммишаддая (LXX Αμισαδαι)."
  26: "Φαγαιηλ υἱὸς Εχραν — Пагиил, сын Охрана (LXX Εχραν)."
  27: "Αχιρε υἱὸς Αιναν — Ахира, сын Енана."
  28: "αὗται αἱ στρατιαὶ υἱῶν Ισραηλ — вот ополчения сынов Израилевых (στρατιά — «войско, ополчение»). ἐξῆραν σὺν δυνάμει αὐτῶν — выступили с силою своею."
  29: "Ιωβαβ υἱὸς Ραγουηλ τῷ Μαδιανίτῃ — Ховав, сын Рагуила, Мадианитянин. τῷ γαμβρῷ Μωυσῆ — свойственнику Моисееву (γαμβρός — «зять, свойственник»; слав. «тестю»; точное родство спорно, поэтому 親族). Ἐξαίρομεν ἡμεῖς — мы выступаем. δεῦρο μεθ᾿ ἡμῶν — иди с нами. εὖ σε ποιήσομεν — сделаем тебе добро. ἐλάλησεν καλὰ περὶ Ισραηλ — изрёк доброе об Израиле."
  30: "Οὐ πορεύσομαι — не пойду. εἰς τὴν γῆν μου καὶ εἰς τὴν γενεάν μου — в землю мою и в род мой (γενεά — «род, поколение»)."
  31: "Μὴ ἐγκαταλίπῃς ἡμᾶς — не оставь нас (ἐγκαταλείπω). οὗ εἵνεκεν ἦσθα μεθ᾿ ἡμῶν ἐν τῇ ἐρήμῳ — потому что ты был с нами в пустыне (εἵνεκεν — «из-за, ради»). ἔσῃ ἐν ἡμῖν πρεσβύτης — будешь у нас старцем (слав. «старейшина»; масоретский текст и Синодальный: «будешь для нас глазом»)."
  32: "ἔσται ἐὰν πορευθῇς μεθ᾿ ἡμῶν — будет, если пойдёшь с нами. τὰ ἀγαθὰ ἐκεῖνα, ὅσα ἐὰν ἀγαθοποιήσῃ κύριος ἡμᾶς — те блага, какие сотворит нам Господь (ἀγαθοποιέω). εὖ σε ποιήσομεν — и тебе сделаем добро."
  33: "ἐξῆραν ἐκ τοῦ ὄρους κυρίου — выступили от горы Господней. ὁδὸν τριῶν ἡμερῶν — на три дня пути. ἡ κιβωτὸς τῆς διαθήκης — ковчег завета. προεπορεύετο προτέρα αὐτῶν — шёл впереди них (προπορεύομαι). κατασκέψασθαι αὐτοῖς ἀνάπαυσιν — усмотреть им место покоя (κατασκέπτομαι — «высматривать»)."
  34: "ἐν τῷ ἐξαίρειν τὴν κιβωτόν — когда поднимали ковчег. Ἐξεγέρθητι, κύριε — восстань, Господи (ἐξεγείρω). διασκορπισθήτωσαν οἱ ἐχθροί σου — да рассеются враги Твои (διασκορπίζω). φυγέτωσαν πάντες οἱ μισοῦντές σε — да побегут все ненавидящие Тебя."
  35: "ἐν τῇ καταπαύσει — при остановке (κατάπαυσις — «успокоение, стоянка»). Ἐπίστρεφε, κύριε — возвратись, Господи (ἐπιστρέφω, императив длительного вида). χιλιάδας μυριάδας ἐν τῷ Ισραηλ — тысячи тем в Израиле (μυριάς — «десять тысяч», т. е. бесчисленные тысячи)."
  36: "ἡ νεφέλη ἐγένετο σκιάζουσα ἐπ᾿ αὐτοῖς ἡμέρας — облако было осеняющим над ними днём (σκιάζω). ἐν τῷ ἐξαίρειν αὐτοὺς ἐκ τῆς παρεμβολῆς — когда они выступали из стана."
