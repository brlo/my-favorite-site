verses:
  1: "レビ人[びと]の子[こ]らの氏族[しぞく]の長[かしら]たちは、祭司[さいし]エレアザルと、ヌンの子ヨシュアと、イスラエルの部族[ぶぞく]から出[で]た氏族の長たちのもとに来[き]た。"
  2: "彼[かれ]らは、カナンの地[ち]のシロで彼らに言[い]った。「主[しゅ]はモーセの手[て]によって、私たちに住[す]むための町々[まちまち]と、私たちの家畜[かちく]のための放牧地[ぼくぼくち]を与[あた]えるよう命[めい]じられた。」"
  3: "そこでイスラエルの子[こ]らは、主[しゅ]の命令[めいれい]によって嗣業[しぎょう]を分[わ]け与[あた]えるときに、レビ人[びと]にその町々[まちまち]と放牧地[ぼくぼくち]を与[あた]えた。"
  4: "くじはカアトの氏族[しぞく]に出[で]た。レビ人[びと]である祭司[さいし]アロンの子[こ]らには、ユダの部族[ぶぞく]とシメオンの部族とベニヤミンの部族から、くじによって十三[じゅうさん]の町[まち]が与[あた]えられた。"
  5: "カアトの残[のこ]りの子[こ]らには、エフライムの部族[ぶぞく]とダンの部族とマナセの部族の半分[はんぶん]から、くじによって十[じゅう]の町[まち]が与[あた]えられた。"
  6: "ゲルションの子[こ]らには、イッサカルの部族[ぶぞく]とアシェルの部族とナフタリの部族と、バシャンにあるマナセの部族の半分[はんぶん]から、十三[じゅうさん]の町[まち]が与[あた]えられた。"
  7: "メラリの子[こ]らには、その氏族[しぞく]ごとに、ルベンの部族[ぶぞく]とガドの部族とゼブルンの部族から、くじによって十二[じゅうに]の町[まち]が与[あた]えられた。"
  8: "イスラエルの子[こ]らは、主[しゅ]がモーセに命[めい]じられたとおりに、くじによって、レビ人[びと]にこれらの町々[まちまち]とその放牧地[ぼくぼくち]を与[あた]えた。"
  9: "ユダの子[こ]らの部族[ぶぞく]とシメオンの子らの部族とベニヤミンの子らの部族から、次[つぎ]の町々[まちまち]が与[あた]えられた。すなわち、名[な]を呼[よ]ばれた町々である。"
  10: "アロンの子[こ]らには、レビの子らであるカアトの氏族[しぞく]のうちから与[あた]えられた。彼らにこのくじが当[あ]たったからである。"
  11: "すなわち、彼らにキルヤト・アルボク、エナク人[びと]の母[はは]なる町[まち]（これはヘブロンである）を、ユダの山地[さんち]に与[あた]えた。その周[まわ]りの放牧地[ぼくぼくち]もまた、彼らに与えられた。"
  12: "ただし、その町[まち]の畑[はたけ]と村々[むらむら]は、ヨシュアがイェフォンネの子[こ]カレブの子らに所有[しょゆう]として与[あた]えた。"
  13: "また、アロンの子[こ]らに、人[ひと]を殺[ころ]した者[もの]のための避難[ひなん]の町[まち]、すなわちヘブロンと、それに添[そ]う放牧地[ぼくぼくち]、またレムナと、それに添う放牧地を与[あた]えた。"
  14: "さらに、アイロムとその放牧地[ぼくぼくち]、テマとその放牧地を与[あた]えた。"
  15: "さらに、ゲラとその放牧地[ぼくぼくち]、ダビルとその放牧地を与[あた]えた。"
  16: "さらに、アサとその放牧地[ぼくぼくち]、タニとその放牧地、ベトサミスとその放牧地を与[あた]えた。これらはこの二[ふた]つの部族[ぶぞく]から出[で]た九[ここの]つの町[まち]である。"
  17: "ベニヤミンの部族[ぶぞく]からは、ガバオンとその放牧地[ぼくぼくち]、ガテトとその放牧地を与[あた]えた。"
  18: "さらに、アナトトとその放牧地[ぼくぼくち]、ガマラとその放牧地を与[あた]えた。四[よっ]つの町[まち]である。"
  19: "アロンの子[こ]らである祭司[さいし]の町[まち]は、全部[ぜんぶ]で十三[じゅうさん]の町である。"
  20: "また、レビ人[びと]であるカアテの子[こ]らの氏族[しぞく]、すなわちカアテの子らの残[のこ]りの者[もの]たちには、エフライムの部族[ぶぞく]から、彼らの境[さかい]の町[まち]が与[あた]えられた。"
  21: "すなわち、彼らに、人[ひと]を殺[ころ]した者[もの]の避難[ひなん]の町[まち]であるシェケムとその放牧地[ぼくぼくち]、またガザラと、それに添[そ]うもの、すなわちその放牧地を与[あた]えた。"
  22: "さらに、カブサイムとその放牧地[ぼくぼくち]、上[かみ]のベトホロンとその放牧地を与[あた]えた。四[よっ]つの町[まち]である。"
  23: "ダンの部族[ぶぞく]からは、エルコタイムとその放牧地[ぼくぼくち]、ゲテダンとその放牧地を与[あた]えた。"
  24: "さらに、アイロンとその放牧地[ぼくぼくち]、ゲテレムモンとその放牧地を与[あた]えた。四[よっ]つの町[まち]である。"
  25: "マナセの部族[ぶぞく]の半分[はんぶん]からは、タナクとその放牧地[ぼくぼくち]、イエバタとその放牧地を与[あた]えた。二[ふた]つの町[まち]である。"
  26: "カアテの子[こ]らの氏族[しぞく]の残[のこ]りの者[もの]たちに与[あた]えられた町[まち]は、全部[ぜんぶ]で十[じゅう]の町と、それらに添[そ]う放牧地[ぼくぼくち]である。"
  27: "また、レビ人[びと]であるゲルションの子[こ]らには、マナセの部族[ぶぞく]の半分から、人を殺[ころ]した者[もの]たちのために取[と]り分[わ]けられた町々[まちまち]、すなわちバシャンにあるガウロンとその放牧地[ぼくぼくち]、またボソラとその放牧地を与[あた]えた。二つの町[まち]である。"
  28: "イッサカルの部族[ぶぞく]からは、キソンとその放牧地[ぼくぼくち]、デバとその放牧地を与[あた]えた。"
  29: "さらに、レマトとその放牧地[ぼくぼくち]、文字[もじ]の泉[いずみ]とその放牧地を与[あた]えた。四[よっ]つの町[まち]である。"
  30: "アシェルの部族[ぶぞく]からは、バセラとその放牧地[ぼくぼくち]、ダボンとその放牧地を与[あた]えた。"
  31: "さらに、ヘルカトとその放牧地[ぼくぼくち]、ラアブとその放牧地を与[あた]えた。四つの町[まち]である。"
  32: "ナフタリの部族[ぶぞく]からは、人[ひと]を殺[ころ]した者[もの]のための避難[ひなん]の町[まち]、すなわちガリラヤのカデシュとその放牧地[ぼくぼくち]、エマトとその放牧地、テムモンとその放牧地を与[あた]えた。三[みっ]つの町[まち]である。"
  33: "ゲルションの子[こ]らの町[まち]は、その氏族[しぞく]ごとに、全部[ぜんぶ]で十三[じゅうさん]の町である。"
  34: "また、レビ人[びと]の残[のこ]りの者[もの]であるメラリの子[こ]らの氏族[しぞく]には、ゼブルンの子[こ]らの部族[ぶぞく]から、マアンとその放牧地[ぼくぼくち]、カデシュとその放牧地を与[あた]えた。"
  35: "さらに、デムナとその放牧地[ぼくぼくち]、セラとその放牧地を与[あた]えた。四[よっ]つの町[まち]である。"
  36: "また、ヨルダン川[がわ]の向[む]こう側[がわ]、エリコに面[めん]した所[ところ]のルベンの部族[ぶぞく]からは、人[ひと]を殺[ころ]した者[もの]のための避難[ひなん]の町[まち]、すなわちミソルの荒野[こうや]にあるボソルとその放牧地[ぼくぼくち]、またイアゼルとその放牧地を与[あた]えた。"
  37: "さらに、デクモンとその放牧地[ぼくぼくち]、マファとその放牧地を与[あた]えた。四つの町[まち]である。"
  38: "ガドの部族[ぶぞく]からは、人[ひと]を殺[ころ]した者[もの]のための避難[ひなん]の町[まち]、すなわちギレアデにあるラモトとその放牧地[ぼくぼくち]、またカミンとその放牧地を与[あた]えた。"
  39: "さらに、エセボンとその放牧地[ぼくぼくち]、イアゼルとその放牧地を与[あた]えた。全部[ぜんぶ]で四[よっ]つの町[まち]である。"
  40: "メラリの子[こ]ら、すなわちレビの部族[ぶぞく]の残[のこ]りの者[もの]たちの氏族[しぞく]ごとに、そのすべての町[まち]は、その境[さかい]の町々[まちまち]は十二[じゅうに]の町[まち]であった。"
  41: "レビ人[びと]の町々[まちまち]は、イスラエルの子[こ]らの所有[しょゆう]の真[ま]ん中[なか]にあって、四十八[よんじゅうはち]の町[まち]とその放牧地[ぼくぼくち]である。"
  42: "これらの町々[まちまち]の周[まわ]りには、すべての町[まち]に、その町の周りの放牧地[ぼくぼくち]があった。ヨシュアは地[ち]をその境[さかい]のうちで分[わ]け与[あた]えることを終[お]えた。イスラエルの子[こ]らは主[しゅ]の命令[めいれい]に従[したが]って、ヨシュアに分[わ]け前[まえ]を与えた。すなわち、彼が願[ねが]い求[もと]めた町、エフライムの山地[さんち]のタムナサラクを彼に与えた。ヨシュアはその町を建[た]てて、そこに住[す]んだ。またヨシュアは、荒野[こうや]の道[みち]で生[う]まれたイスラエルの子らに割礼[かつれい]を施[ほどこ]した石[いし]の刀[かたな]を取[と]って、それらをタムナサラクに置[お]いた。"
  43: "主[しゅ]はイスラエルに、彼らの父[ちち]たちに与えると誓[ちか]われたすべての地[ち]を与え、彼らはそれを嗣業[しぎょう]として受[う]け継[つ]ぎ、そこに住[す]んだ。"
  44: "主[しゅ]は彼らを四方[しほう]から休[やす]ませ、彼らの父たちに誓われたとおりにされた。彼らの敵[てき]のうち、だれ一人[ひとり]として彼らの前[まえ]に立[た]つ者[もの]はなかった。主は彼らの敵をすべて、彼らの手[て]に渡[わた]された。"
  45: "主[しゅ]がイスラエルの子[こ]らに語[かた]られたすべていい言葉[ことば]のうち、地[ち]に落[お]ちなかったものは一[ひと]つもなく、すべてが実現[じつげん]した。"

notes:
  1: "ἀρχιπατριῶται — «начальники родов (отечеств)» (ἀρχιπατριώτης). Πρὸς τοὺς ἀρχιφύλους πατριῶν ἐκ τῶν φυλῶν Ισραηλ — «к начальникам родов из племён Израиля» (ἀρχίφυλος)."
  2: "ἐν Σηλω ἐν γῇ Χανααν — в Силоме, в земле Ханаанской. Ἐνετείλατο κύριος ἐν χειρὶ Μωυσῆ — «Господь заповедал рукою Моисея». περισπόρια — «предместья, пастбища» (περισπόριον; 放牧地). κτῆνος — скот."
  3: "ἐν τῷ κατακληρονομεῖν — «при наследовании (разделе)» (κατακληρονομέω). διὰ προστάγματος κυρίου — «по повелению Господню» (πρόσταγμα)."
  4: "ἐξῆλθεν ὁ κλῆρος τῷ δήμῳ Κααθ — «вышел жребий роду Каафа» (δῆμος — род; 氏族). κληρωτί — по жребию (くじによって). ἀπὸ φυλῆς … — от племени …"
  5: "τοῖς καταλελειμμένοις — «оставшимся» (καταλείπω). ἡμίσους φυλῆς Μανασση — половины племени Манассии."
  6: "Γεδσων — Герсон (ゲルション; в слав. «гирсон»). ἐν τῷ Βασαν — в Васане (バシャン). ἀπὸ τοῦ ἡμίσους φυλῆς Μανασση — от половины племени Манассии."
  7: "κατὰ δήμους αὐτῶν — по родам их. κληρωτὶ πόλεις δώδεκα — по жребию двенадцать городов."
  8: "ὃν τρόπον ἐνετείλατο κύριος τῷ Μωυσῇ — «как заповедал Господь Моисею». κληρωτί — по жребию."
  9: "ἡ φυλὴ υἱῶν Ιουδα … — «племя сынов Иуды…». καὶ ἐπεκλήθησαν — «и были названы» (ἐπικαλέω); в ст. 10 продолжается перечисление получателей. В слав. «и нарекоша по имени»."
  10: "ἀπὸ τοῦ δήμου τοῦ Κααθ τῶν υἱῶν Λευι — «из рода Каафа, из сынов Левия». ὅτι τούτοις ἐγενήθη ὁ κλῆρος — «ибо им достался жребий» (в слав. добавлено «первый»)."
  11: "Καριαθαρβοκ — Кириаф-Арбок (キルヤト・アルボク; в слав. «кариафарвок»). μητρόπολιν τῶν Ενακ — «метрополию Енака» (μητρόπολις; 母なる町). [αὕτη ἐστὶν Χεβρων] — «это Хеврон» (квадратные скобки критического издания). τὰ περισπόρια κύκλῳ αὐτῆς — «предместья вокруг него»; в гр-тексте член без глагола, по смыслу он относится к городам левитов (поля и сёла отданы Халеву, ст. 12), поэтому в тексте добавлено 与えられた."
  12: "ἀγροὺς … κώμας — поля и деревни (ἀγρός, κώμη). ἐν κατασχέσει — во владение (κατάσχεσις). Халев — сын Иефоннии (イェフォンネの子カレブ; ср. Числ 34:19)."
  13: "τὴν πόλιν φυγαδευτήριον τῷ φονεύσαντι — «город убежища для убившего» (φονεύω). ἀφωρισμένα — «отделённые (участки)» (ἀφορίζω), здесь 放牧地. Λεμνα — Левна (レムナ; в слав. «левна», у Синодального «Ливна»)."
  14: "Αιλωμ — Иаттир (アイロム; в слав. «иефер», у Синодального «Иаттир»). Τεμα — Тема (テマ; в слав. «есфемо», у Синодального «Ештемоа»)."
  15: "Γελλα — Гелла (ゲラ; в слав. «олон», у Синодального «Холон»). Δαβιρ — Давир (ダビル)."
  16: "Ασα — Аса (アサ; в слав. «аин», у Синодального «Аин»). Τανυ — Тану (タニ; в слав. «иетта», у Синодального «Ютту»). Βαιθσαμυς — Беф-Шемеш (ベトサミス). πόλεις ἐννέα παρὰ τῶν δύο φυλῶν — девять городов от двух этих племён."
  17: "Γαβαων — Гаваон (ガバオン; в корпусе ガバオン). Γαθεθ — Гафеф (ガテト; в слав. «гавее», у Синодального «Гева»)."
  18: "Αναθωθ — Анафоф (アナトト). Γαμαλα — Гамала (ガマラ; в слав. «алмон», у Синодального «Алмон»)."
  19: "πᾶσαι αἱ πόλεις υἱῶν Ααρων τῶν ἱερέων — «все города сынов Аарона, священников»; в слав. добавлено «и окрестная их»."
  20: "δήμοις υἱοῖς Κααθ — «родам сынов Каафа» (плеоназм). τοῖς καταλελειμμένοις ἀπὸ τῶν υἱῶν Κααθ — «оставшимся из сынов Каафа». πόλις τῶν ὁρίων αὐτῶν — «город пределов их»."
  21: "τὴν πόλιν τοῦ φυγαδευτηρίου τὴν τοῦ φονεύσαντος — «город убежища для убившего» (ср. ст. 13). Συχεμ — Сихем (シェケム). Γαζαρα — Газер (ガザラ; у Синодального «Гезер»); καὶ τὰ πρὸς αὐτὴν καὶ τὰ ἀφωρισμένα αὐτῇ — «и что при нём, и отделённое ему» (плеоназм)."
  22: "Καβσαιμ — Кавсаим (カブサイム; у Синодального «Кивцаим»). ἄνω Βαιθωρων — Верхний Беф-Орон (上のベトホロン)."
  23: "ἐκ τῆς φυλῆς Δαν — из племени Данова. Ελκωθαιμ — Елкофам (エルコタイム; в слав. «елфеко», у Синодального «Елфеке»). Γεθεδαν — Гефедон (ゲテダン; в слав. «гавефон», у Синодального «Гиввефон»)."
  24: "Αιλων — Аиалон (アイロン). Γεθερεμμων — Гаф-Риммон (ゲテレムモン; в слав. «гефреммон»)."
  25: "ἀπὸ τοῦ ἡμίσους φυλῆς Μανασση — от половины племени Манассии. Ταναχ — Фаанах (タナク; в слав. «фаанах»). Ιεβαθα — Иевафа (イエバタ; в слав. «вефсам», у Синодального «Гаф-Риммон» — вероятно, ошибка Синодального)."
  26: "πᾶσαι πόλεις δέκα — «всех городов десять». τοῖς ὑπολελειμμένοις — «оставшимся» (ὑπολείπω)."
  27: "τοῖς υἱοῖς Γεδσων τοῖς Λευίταις — «сынам Герсона, левитам». τὰς πόλεις τὰς ἀφωρισμένας τοῖς φονεύσασι — «города, отделённые убившим» (т. е. города убежища). Γαυλων ἐν τῇ Βασανίτιδι — Гавлон в Васанитиде (ガウロン; у Синодального «Голан»). Βοσοραν — Босору (ボソラ; в слав. «веесфера», у Синодального «Беештера»); форма Βοσοραν отличается от Βοσορ в ст. 36."
  28: "Κισων — Кисон (キソン; в слав. «кисион», у Синодального «Кишион»). Δεββα — Давраф (デバ; в слав. «девраф»)."
  29: "Ρεμμαθ — Реммаф (レマト; в слав. «иермоф», у Синодального «Иармуф»). Πηγὴν γραμμάτων — букв. «Источник письмён» (πηγή, γράμματα); в слав. «источник писмен», у Синодального «Ен-Ганним»."
  30: "Βασελλαν — Васелла (バセラ; в слав. «масаал», у Синодального «Мишал»). Δαββων — Даввон (ダボン; в слав. «авдон», у Синодального «Авдон»)."
  31: "Χελκατ — Хелкаф (ヘルカト). Ρααβ — Раав (ラアブ; в слав. «роов», у Синодального «Рехов»)."
  32: "τὴν πόλιν τὴν ἀφωρισμένην τῷ φονεύσαντι — «город, отделённый убившему». Καδες ἐν τῇ Γαλιλαίᾳ — Кадес в Галилее (カデシュ; ср. 20:4). Εμμαθ — Еммаф (エマト; в слав. «емафдор», у Синодального «Хамоф-Дор»). Θεμμων — Феммон (テムモン; в слав. «ноеммон», у Синодального «Карфан»)."
  33: "πᾶσαι αἱ πόλεις τοῦ Γεδσων — «все города Герсона»; в слав. добавлено «и отделённое их»."
  34: "τῷ δήμῳ υἱῶν Μεραρι τοῖς Λευίταις τοῖς λοιποῖς — «роду сынов Мерари, левитам остальным». Μααν — Маан (マアン; в слав. «иекнаам», у Синодального «Иокнеам»). Καδης — Кадес (カデシュ; в слав. «карфа», у Синодального «Карфу»; по гр-тексту совпадает с Καδης, но, вероятно, иной город)."
  35: "Δεμνα — Димна (デムナ; в слав. «дамна», у Синодального «Димна»). Σελλα — Селла (セラ; в слав. «наалол», у Синодального «Нагалал»)."
  36: "πέραν τοῦ Ιορδάνου τοῦ κατὰ Ιεριχω — «за Иорданом, против Иерихона». Βοσορ ἐν τῇ ἐρήμῳ τῇ Μισωρ — Босор в пустыне Мисор (ボソル; ср. 20:5; Втор 4:43). Ιαζηρ — Иазер (イアゼル; в слав. «иазир», у Синодального «Иааца»)."
  37: "Δεκμων — Декмон (デクモン; в слав. «гедсон», у Синодального «Кедемоф»). Μαφα — Мафа (マファ; в слав. «масфа», у Синодального «Мефааф»)."
  38: "τὴν πόλιν τὸ φυγαδευτήριον τοῦ φονεύσαντος — «город — убежище убившего». Ραμωθ ἐν τῇ Γαλααδ — Рамоф в Галааде (ラモト; ср. 20:5 Αρημωθ). Καμιν — Камин (カミン; в слав. «манаим», у Синодального «Маханаим»)."
  39: "Εσεβων — Есевон (エセボン). Ιαζηρ — Иазер (ср. ст. 36; в евр. тексте здесь иной город, в LXX повторён Ιαζηρ). αἱ πᾶσαι πόλεις τέσσαρες — «всех городов четыре»."
  40: "τοῖς υἱοῖς Μεραρι … τῶν καταλελειμμένων ἀπὸ τῆς φυλῆς Λευι — «сынам Мерари… из оставшихся от племени Левия». ἐγενήθη τὰ ὅρια πόλεις δέκα δύο — «стали пределы их городами двенадцать» (слав. «и быша пределы их грады дванадесять»)."
  41: "ἐν μέσῳ κατασχέσεως υἱῶν Ισραηλ — «среди владения сынов Израиля». τεσσαράκοντα ὀκτὼ πόλεις — сорок восемь городов."
  42: "Ст. 42 в модуле содержит 42a–42d: окончание раздела (a), удел Иисуса — Фамнасахар (b), построение города (c) и каменные ножи обрезания (d); в ru эти стихи стоят в 19:49–50 и 5:3, в csl — здесь же. Θαμνασαραχ — Фамнасахар (タムナサラク). τὰς μαχαίρας τὰς πετρίνας — каменные ножи (μάχαιρα, πετρίνος). τοὺς γενομένους ἐν τῇ ὁδῷ — букв. «бывших в пути» (слав. «родившыяся»)."
  43: "ὤμοσεν δοῦναι τοῖς πατράσιν αὐτῶν — «клялся дать отцам их». κατεκληρονόμησαν — «получили в удел» (κατακληρονομέω). κατῴκησαν ἐν αὐτῇ — «поселились в ней»."
  44: "κατέπαυσεν αὐτοὺς κυκλόθεν — «успокоил их со всех сторон» (καταπαύω, κυκλόθεν). οὐκ ἀνέστη οὐθεὶς κατενώπιον αὐτῶν — «не восстал никто пред ними». παρέδωκεν εἰς τὰς χεῖρας — «предал в руки»."
  45: "οὐ διέπεσεν — «не отпало, не упало» (διαπίπτω; слав. «не оскуде»). τῶν ῥημάτων τῶν καλῶν — «слов добрых». πάντα παρεγένετο — «всё исполнилось» (παραγίνομαι)."
