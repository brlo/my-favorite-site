# jp-box, Иисус Навин, глава 21. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в этой главе нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 21: прошение левитов в Силоме (1–3), жребии четырёх родов левитов (4–7),
# города сынов Аарона (8–19), остальных каафитян (20–26), гершонитян (27–33),
# мераритян (34–40), итог 48 городов (41–42), покой и исполнение обетований (43–45).
# Нумерация: 45 стихов, как в gr-lxx-byz (совпадает с csl-ru). Ст. 42 в модуле
# содержит 42a–42d (удел Иисуса — Фамнасахар и каменные ножи обрезания);
# они переведены в том же ст. 42, как в csl (в ru — 19:49–50 и 5:3).
# Речь — 「…」 (2); остальное повествование. Красного нет.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (сверено bracket_check.rb).
# Сносок ⟨…⟩ нет: 放牧地, 避難の町, 嗣業, 氏族, くじ уже в корпусе.
# Термины: περισπόρια / ἀφωρισμένα — 放牧地; φυγαδευτήριον — 避難の町;
# κληρωτί — くじによって; μητρόπολις — 母なる町; χιλίαρχοι — 千人隊長.
# Топонимы транслитерированы с греческого; в notes даны славянские и
# синодальные формы, где они расходятся. 21:29 Πηγὴν γραμμάτων — букв.
# «Источник письмён» (в Синодальном «Ен-Ганним»), оставлено буквально.
# jp-ni не использовался.

