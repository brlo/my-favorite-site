verses:
  1: "その後[そのご]、主[しゅ]はまた別[べつ]に七十人[しちじゅうにん]を選[えら]び、二人[ふたり]ずつを御前[みまえ]に先[さき]だたせて、ご自身[じしん]が行[い]こうとしておられたすべての町[まち]や場所[ばしょ]へ遣[つか]わされた。"
  2: "そして彼[かれ]らに言[い]われた。「<j>収穫[しゅうかく]は多[おお]いが、働[はたら]き手[て]は少[すく]ない。だから、収穫[しゅうかく]の主[ぬし]に、働[はたら]き手[て]をその収穫[しゅうかく]へ送[おく]り出[だ]してくださるよう願[ねが]いなさい。</j>」"
  3: "「<j>行[い]きなさい。見[み]よ、わたしはあなたがたを、狼[おおかみ]の中[なか]に送[おく]る子羊[こひつじ]のように遣[つか]わす。</j>"
  4: "<j>財布[さいふ]も、旅[たび]の袋[ふくろ]も、履物[はきもの]も持[も]ってはならない。道[みち]でだれにも挨拶[あいさつ]してはならない。</j>"
  5: "<j>どの家[いえ]に入[はい]っても、まず『この家[いえ]に平和[へいわ]があるように』と言[い]いなさい。</j>"
  6: "<j>そこに平和[へいわ]の子[こ]がいるなら、あなたがたの平和[へいわ]はその人[ひと]の上[うえ]に留[とど]まる。そうでなければ、あなたがたのところへ返[かえ]って来[く]る。</j>"
  7: "<j>その家[いえ]に留[とど]まり、出[だ]されるものを食[た]べ、飲[の]みなさい。働[はたら]く者[もの]がその報酬[ほうしゅう]を受[う]けるのは当然[とうぜん]だからである。家[いえ]から家[いえ]へ移[うつ]ってはならない。</j>」"
  8: "「<j>どの町[まち]に入[はい]って、そこであなたがたが迎[むか]え入[い]れられるなら、出[だ]されるものを食[た]べなさい。</j>"
  9: "<j>その町[まち]の病人[びょうにん]を癒[いや]し、彼[かれ]らに『神[かみ]の国[くに]があなたがたのところへ近[ちか]づいた』と言[い]いなさい。</j>"
  10: "<j>どの町[まち]に入[はい]っても、そこであなたがたが迎[むか]え入[い]れられないなら、その町[まち]の大通[おおどお]りに出[で]て、こう言[い]いなさい。</j>"
  11: "<j>『あなたがたの町[まち]から自分[じぶん]たちの足[あし]に付[つ]いた埃[ちり]さえ、あなたがたに向[む]かって払[はら]い落[おと]とす。それでも、神[かみ]の国[くに]が近[ちか]づいたことを知[し]りなさい。』</j>」"
  12: "「<j>あなたがたに言[い]う。その日[ひ]には、ソドムの方[ほう]がその町[まち]よりも耐[た]えやすく済[す]むであろう。</j>"
  13: "<j>コラジンよ、お前[まえ]は不幸[ふこう]だ。ベツサイダよ、お前[まえ]も不幸[ふこう]だ。あなたがたの間[あいだ]で行[おこな]われた力[ちから]あるわざが、もしティルスとシドンで行[おこな]われていたなら、彼[かれ]らはとうに粗布[あらぬの]を身[み]にまとって灰[はい]の中[なか]に座[すわ]り、悔[く]い改[あらた]めていたであろう。</j>"
  14: "<j>しかし、裁[さば]きのときには、ティルスとシドンの方[ほう]があなたがたよりも耐[た]えやすく済[す]む。</j>"
  15: "<j>カファルナウムよ、お前[まえ]は天[てん]まで高[たか]く上[あ]げられるのか。陰府[よみ]にまで落[お]とされるのだ。</j>」"
  16: "「<j>あなたがたの言[い]うことを聞[き]く者[もの]は、わたしの言[い]うことを聞[き]く。あなたがたを拒[こば]む者[もの]は、わたしを拒[こば]む。わたしを拒[こば]む者[もの]は、わたしを遣[つか]わした方[かた]を拒[こば]む。</j>」"
  17: "七十人[しちじゅうにん]は喜[よろこ]びながら帰[かえ]って来[き]て言[い]った。「主[しゅ]よ、あなたの名[な]によって、悪霊[あくりょう]までわたしたちに服[ふく]します。」"
  18: "イエスは彼[かれ]らに言[い]われた。「<j>わたしは見[み]ていた。サタンが天[てん]から稲妻[いなずま]のように落[お]ちるのを。</j>"
  19: "<j>見[み]よ、わたしはあなたがたに、蛇[へび]や蠍[さそり]を踏[ふ]みつけ、敵[てき]のあらゆる力[ちから]を踏[ふ]みにじる力[ちから]を与[あた]えた。何[なに]もあなたがたを害[がい]することはない。</j>"
  20: "<j>しかし、霊[れい]があなたがたに服[ふく]することを喜[よろこ]んではならない。むしろ、あなたがたの名[な]が天[てん]に記[しる]されていることを喜[よろこ]びなさい。</j>」"
  21: "そのとき、イエスは{聖霊[せいれい]|聖神[せいしん]}によって喜[よろこ]び躍[おど]り、言[い]われた。「<j>父[ちち]よ、天[てん]と地[ち]の主[しゅ]よ。あなたをほめたたえます。あなたはこれらのことを、知恵[ちえ]ある者[もの]や賢[かしこ]い者[もの]たちから隠[かく]して、幼[おさな]い者[もの]たちに現[あらわ]しになりましたからです。父[ちち]よ、そのとおりです。これがあなたの御前[みまえ]でよしとされたことでした。</j>"
  22: "<j>すべてのものは、わたしの父[ちち]からわたしに渡[わた]された。父[ちち]のほかに、子[こ]がだれであるかを知[し]る者[もの]はなく、子[こ]と、子[こ]が現[あらわ]そうと望[のぞ]む者[もの]とのほかに、父[ちち]がだれであるかを知[し]る者[もの]はいない。</j>」"
  23: "そして、弟子[でし]たちの方[ほう]を向[む]いて、ひそかに言[い]われた。「<j>あなたがたが見[み]ているものを見[み]る目[め]は、幸[さいわ]いである。</j>"
  24: "<j>あなたがたに言[い]う。多[おお]くの預言者[よげんしゃ]たちや王[おう]たちが、あなたがたが見[み]ているものを見[み]ようと望[のぞ]みながら見[み]ることができず、あなたがたが聞[き]いているものを聞[き]こうと望[のぞ]みながら聞[き]くことができなかったのである。</j>」"
  25: "すると、ある律法学者[りっぽうがくしゃ]が立[た]ち上[あ]がり、イエスを試[こころ]みて言[い]った。「先生[せんせい]。何[なに]をすれば、永遠[えいえん]の命[いのち]を受[う]け継[つ]ぐことができるのでしょうか。」"
  26: "イエスは彼[かれ]に言[い]われた。「<j>律法[りっぽう]には何[なに]と書[か]かれているか。どう読[よ]んでいるのか。</j>」"
  27: "彼[かれ]は答[こた]えて言[い]った。「『心[こころ]を尽[つ]くし、魂[たましい]を尽[つ]くし、力[ちから]を尽[つ]くし、思[おも]いを尽[つ]くして、あなたの神[かみ]である主[しゅ]を愛[あい]せよ。また、自分[じぶん]を愛[あい]するように、隣人[りんじん]を愛[あい]せよ。』」"
  28: "イエスは彼[かれ]に言[い]われた。「<j>あなたの答[こた]えは正[ただ]しい。これを行[おこな]いなさい。そうすれば、あなたは生[い]きる。</j>」"
  29: "しかし彼[かれ]は、自分[じぶん]を正[ただ]しいとしようとして、イエスに言[い]った。「では、わたしの隣人[りんじん]とはだれのことでしょうか。」"
  30: "イエスは答[こた]えて言[い]われた。「<j>ある人[ひと]がエルサレムからエリコへ下[くだ]って行[い]く途中[とちゅう]、強盗[ごうとう]たちに襲[おそ]われた。彼[かれ]らはその人[ひと]の衣[ころも]をはぎ取[と]り、なぐりつけて、半[はん]死[し]のまま捨[す]てて去[さ]った。</j>"
  31: "<j>すると、たまたま一人[ひとり]の祭司[さいし]がその道[みち]を下[くだ]って来[き]て、その人[ひと]を見[み]ると、向[む]こう側[がわ]を通[とお]り過[す]ぎた。</j>"
  32: "<j>同[おな]じように、レビ人[びと]⟨神殿[しんでん]で祭司[さいし]を助[たす]ける務[つと]めの人[ひと]。⟩もその場所[ばしょ]に来[き]て、その人[ひと]を見[み]ると、向[む]こう側[がわ]を通[とお]り過[す]ぎた。</j>"
  33: "<j>ところが、旅[たび]をしていた一人[ひとり]のサマリア人[びと]⟨ユダヤ人[じん]と交際[こうさい]しなかった隣国[りんごく]の人[ひと]。⟩がその人[ひと]のそばに来[き]て、見[み]ると、かわいそうに思[おも]った。</j>"
  34: "<j>そして近[ちか]づいて、傷[きず]に油[あぶら]とぶどう酒[しゅ]を注[そそ]いで包[つつ]み、自分[じぶん]の家畜[かちく]に乗[の]せ、宿[やど]へ連[つ]れて行[い]って介抱[かいほう]した。</j>"
  35: "<j>翌日[よくじつ]、デナリオン二枚[にまい]を取[と]り出[だ]して宿[やど]の主人[しゅじん]に渡[わた]し、言[い]った。『この人[ひと]を介抱[かいほう]してくれ。余計[よけい]に費[つい]やした分[ぶん]は、わたしが帰[かえ]って来[き]たときに返[かえ]す。』</j>"
  36: "<j>この三人[さんにん]のうち、強盗[ごうとう]に襲[おそ]われた人[ひと]の隣人[りんじん]になったのは、だれだと思[おも]うか。</j>」"
  37: "彼[かれ]は言[い]った。「その人[ひと]に憐[あわ]れみをかけた者[もの]です。」イエスは彼[かれ]に言[い]われた。「<j>行[い]って、あなたも同[おな]じようにしなさい。</j>」"
  38: "一行[いっこう]が旅[たび]を続[つづ]けているうちに、イエスはある村[むら]に入[はい]られた。マルタという名[な]の女[おんな]が、イエスを自分[じぶん]の家[いえ]に迎[むか]え入[い]れた。"
  39: "彼女[かのじょ]にはマリアという姉妹[しまい]があった。マリアは主[しゅ]の足[あし]もとに座[すわ]って、主[しゅ]の言葉[ことば]に聞[き]き入[い]っていた。"
  40: "マルタは、もてなしの仕事[しごと]が多[おお]くて心[こころ]を取[と]られていた。そこで、そばに来[き]て言[い]った。「主[しゅ]よ、わたしの姉妹[しまい]が、わたし一人[ひとり]にもてなしを任[まか]せているのを、あなたはお気[き]になさいませんか。わたしを手伝[てつだ]うように、あの人[ひと]におっしゃってください。」"
  41: "主[しゅ]はお答[こた]えになった。「<j>マルタ、マルタ。あなたは多[おお]くのことに心[こころ]を騒[さわ]がせ、気[き]を取[と]られています。</j>"
  42: "<j>しかし、必要[ひつよう]なことは一[ひと]つだけである。マリアは良[よ]い分[ぶん]を選[えら]び取[と]ったのである。それは彼女[かのじょ]から取[と]り上[あ]げられることがない。</j>」"

notes:
  1: "В критической базе ἑβδομήκοντα [δύο] («семьдесят [два]», δύο под скобками); Церковь (Елизаветинская «семьдесят», jp-joc 七十門徒) читает семьдесят — 七十人, без 〔〕 (замена, а не добавка)."
  10: "ἀσπάσησθε — «приветствовать»; 挨拶してはならない, как jp-joc 安を問ふ勿れ."
  13: "δυνάμεις — «силы, мощные дела»; 力あるわざ (не 奇跡; так же в Мф 14:2). οὐαί здесь — 不幸だ, как в Мф 11:21."
  15: "ᾅδης — 陰府[よみ], как Мф 11:23; 地獄 оставлено за γέεννα. μή — вопрос, ожидающий отрицания."
  17: "ὑπέστρεψαν δὲ οἱ ἑβδομήκοντα [δύο] — то же сомнение, что в 10:1; 七十人."
  21: "ἠγαλλιάσατο — «возликовал»; 喜び躍り. ἐξομολογοῦμαί σοι — «славлю Тебя»; あなたをほめたたえます (как Мф 11:25). εὐδοκία ἐγένετο ἔμπροσθέν σου — 御前でよしとされたこと."
  22: "У jp-joc «門徒を顧みて» отнесено к 10:22; в базе στραφεὶς πρὸς τοὺς μαθητάς стоит в 10:23 — оставлено в 10:23."
  30: "κατέβαινεν — «спускался»; 下って行く (Иерусалим выше Иерихона). λῃσταῖς περιέπεσεν — 強盗たちに襲われた."
  31: "ἀντιπαρῆλθεν — «прошёл мимо по другой стороне»; 向こう側を通り過ぎた, без сглаживания до «прошёл мимо»."
  42: "ἑνὸς δέ ἐστιν χρεία — «одно нужно»; 必要なことは一つだけ (jp-joc 需むる所は一つのみ)."
