verses:
  1: "ただ、自分[じぶん]の魂[たましい]をささげ、いと高[たか]き者[もの]の律法[りっぽう]を思[おも]いめぐらす者[もの]は、昔[むかし]のすべての人[ひと]々[びと]の知恵[ちえ]を尋[たず]ね求[もと]め、預言[よげん]の言葉[ことば]に専念[せんねん]する。"
  2: "名[な]の知[し]られた人[ひと]々[びと]の物語[ものがたり]を保[たも]ち、たとえ話の曲[きょく]がりに入[はい]って行[く]。"
  3: "格言[かくげん]の隠[かく]されたことを尋[たず]ね求[もと]め、たとえ話の謎[なぞ]のうちに生[い]きる。"
  4: "彼は大[おお]いなる者[もの]たちの間[あいだ]で仕[つか]え、支配者[しはいしゃ]たちの前[まえ]に立[た]つ。異[こと]なる民[たみ]の地[ち]を旅[たび]し、人[ひと]の間[あいだ]の善[ぜん]と悪[あく]とを試[ため]してきたからである。"
  5: "彼は心[こころ]を込[こ]めて、自分[じぶん]を造[つく]った主[しゅ]に朝[あさ]早[はや]く向[む]かい、いと高[たか]き者[もの]の前[まえ]に祈[いの]る。祈りをもって口[くち]を開[ひら]き、自分[じぶん]の罪[つみ]について願[ねが]い求[もと]める。"
  6: "大[おお]いなる主[しゅ]が望[のぞ]まれるなら、彼は悟[さと]りの霊[れい]に満[み]たされる。主は彼の知恵[ちえ]の言葉[ことば]を雨[あめ]のように降[ふ]らせ、彼は祈[いの]りのうちに主に告白[こくはく]する。"
  7: "主は彼の計画[けいかく]と知識[ちしき]を導[みちび]き、彼は主[しゅ]の隠[かく]されたことを思[おも]いめぐらす。"
  8: "主は彼が教[おし]えることを明[あき]らかにし、彼は主[しゅ]の契約[けいやく]の律法[りっぽう]を誇[ほこ]る。"
  9: "多[おお]くの者[もの]が彼の悟[さと]りをほめたたえ、それは永遠[えいえん]に消[き]え去[さ]らない。彼の記憶[きおく]は失[うしな]われず、その名[な]は代々[よよ]にわたって生[い]きる。"
  10: "国々[くにぐに]の民[たみ]は彼の知恵[ちえ]を語[かた]り、集会[しゅうかい]は彼の賛美[さんび]を告[つ]げる。"
  11: "彼がとどまるなら、千人[せんにん]にもまさる名[な]を残[のこ]す。彼が憩[いこ]うなら、そのことは彼のためになる。"
  12: "もう一度[いちど]思[おも]いめぐらして、わたしは語[かた]ろう。わたしは月[つき]の満[み]ちるように満たされた。"
  13: "わたしの言葉[ことば]を聞[き]け、聖[せい]なる子[こ]らよ。湿[しめ]った流[なが]れのそばに育[そだ]つ薔薇[ばら]のように芽[め]を出[だ]せ。"
  14: "乳香[にゅうこう]のように香[かおり]を放[はな]ち、百合[ゆり]の花[はな]のように咲[さ]け。香りを放[はな]って歌[うた]を歌[うた]い、すべてのわざのうちで主[しゅ]をほめたたえよ。"
  15: "主[しゅ]の名[な]に大[おお]いなる栄光[えいこう]をささげ、唇[くちびる]の歌[うた]と竪琴[たてごと]をもって、主の賛美[さんび]のうちに告白[こくはく]せよ。そして、こう言[い]え。"
  16: "主[しゅ]のわざはみな、非常[ひじょう]に良[よ]い。そのすべての定[さだ]めは時[とき]が来[く]れば成[な]る。「これは何[なに]か。何[なん]のためにあるのか」と言[い]ってはならない。すべてはその時[とき]に応[おう]じて尋[たず]ね求[もと]められるからである。"
  17: "主[しゅ]の言葉[ことば]によって水[みず]は草[くさ]の山[やま]のように立[た]ち、その口[くち]の言葉によって水[みず]の貯[た]えができた。"
  18: "主[しゅ]の定[さだ]めによって、すべての良[よ]い望[のぞ]みが成[な]る。主の救[すく]いを減[へ]らす者[もの]はだれもいない。"
  19: "すべての肉[にく]のわざは主[しゅ]の前[まえ]にあり、その目[め]から隠[かく]れることはできない。"
  20: "主[しゅ]は世々[よよ]に目[め]を注[そそ]いでおられる。主の前[まえ]に驚[おどろ]くべきことは何[なに]もない。"
  21: "「これは何[なに]か。何[なん]のためにあるのか」と言[い]ってはならない。すべてはそれぞれの必要[ひつよう]のために造[つく]られたからである。"
  22: "主[しゅ]の祝福[しゅくふく]は川[かわ]のように地[ち]を覆[おお]い、洪水[こうずい]のように乾[かわ]いた地[ち]を潤[うるお]した。"
  23: "国々[くにぐに]は、主[しゅ]が水[みず]を塩[しお]に変[か]えられたときのように、主の怒[いか]りを嗣業[しぎょう]として受[う]ける。"
  24: "主[しゅ]の道[みち]は聖[せい]なる者[もの]にはまっすぐであり、不法[ふほう]な者[もの]にはつまずきとなる。"
  25: "良[よ]いものは初[はじ]めから善[よ]い者[もの]のために造られ、同[おな]じように悪[わる]いものは罪[つみ]ある者[もの]のためにある。"
  26: "人[ひと]が生[い]きるために必要[ひつよう]なすべてのものの始[はじ]めは、水[みず]、火[ひ]、鉄[てつ]、塩[しお]、小麦粉[こむぎこ]、乳[ちち]、蜜[みつ]、ぶどうの汁[しる]、油[あぶら]、衣[ころも]である。"
  27: "これらはすべて、敬虔[けいけん]な者[もの]には良[よ]いものとなる。同じように、罪[つみ]ある者[もの]には悪[わる]いものに変[か]わる。"
  28: "復讐[ふくしゅう]のために造[つく]られた霊[れい]たちがいる。主[しゅ]は怒[いか]りのうちにその鞭[むち]を固[かた]くされた。終[お]わりの時[とき]には彼らは力[ちから]を注[そそ]ぎ、自分[じぶん]を造[つく]った方[かた]の怒りを鎮[しず]める。"
  29: "火[ひ]、雹[ひょう]、飢[う]え、死[し]、これらはみな復讐[ふくしゅう]のために造られた。"
  30: "獣[けもの]の歯[は]、蠍[さそり]、蛇[へび]、そして不敬[ふけい]な者[もの]を滅[ほろ]びに至[いた]らせる復讐[ふくしゅう]の剣[つるぎ]。"
  31: "彼らは主[しゅ]の戒[いまし]めのうちに喜[よろこ]び、地[ち]の上[うえ]で必要[ひつよう]のために備[そな]えられ、その時[とき]が来[く]れば言葉[ことば]を破[やぶ]らない。"
  32: "それゆえ、わたしは初[はじ]めから堅[かた]く立[た]ち、思[おも]いめぐらし、書[しょ]き記[しる]して残[のこ]した。"
  33: "主[しゅ]のわざはみな良[よ]い。主はすべての必要[ひつよう]をその時[とき]に満[み]たしてくださる。"
  34: "「これがそれよりも悪[わる]い」と言[い]ってはならない。すべてはその時[とき]にふさわしいと認[みと]められるからである。"
  35: "今[いま]、心[こころ]を尽[つ]くし、口[くち]を尽くして歌[うた]い、主[しゅ]の名[な]をほめたたえよ。"

notes:
  1: "Πλὴν τοῦ ἐπιδιδόντος τὴν ψυχὴν αὐτοῦ — «но [тот], кто отдаёт душу свою» (ἐπιδίδωμι — отдавать; πλήν — но, кроме); слав. «точию вдаяй душу свою». διανοουμὲνου ἐν νόμῳ ὑψίστου — «размышляющего в законе Всевышнего» (διανοέομαι — размышлять; νόμος — закон); слав. «размышляяй в законе вышняго». σοφίαν πάντων ἀρχαίων ἐκζητήσει — «премудрости всех древних взыщет» (ἀρχαῖος — древний; ἐκζητέω — взыскивать); ἐν προφητείαις ἀσχοληθήσεται — «в пророчествах будет упражняться» (ἀσχολέομαι — заниматься)."
  2: "διήγησιν ἀνδρῶν ὀνομαστῶν συντηρήσει — «повествование мужей именитых соблюдёт» (διήγησις — рассказ, повествование; ὀνομαστός — именитый; συντηρέω — соблюдать, хранить); слав. «повести мужей именитых соблюдет». ἐν στροφαῖς παραβολῶν συνεισελεύσεται — «в извивах притчей войдёт» (στροφή — извив, оборот; παραβολή — притча); слав. «во извития притчей совнидет»."
  3: "ἀπόκρυφα παροιμιῶν ἐκζητήσει — «сокровенное притчей (пословиц) взыщет» (ἀπόκρυφος — сокровенный; παροιμία — притча, пословица); слав. «сокровенная притчей изыщет». ἐν αἰνίγμασι παραβολῶν ἀναστραφήσεται — «в загадках притчей будет обращаться» (αἴνιγμα — загадка); слав. «в гадании притчей поживет»."
  4: "ἀνὰ μέσον μεγιστάνων ὑπηρετήσει — «среди вельмож будет служить» (μεγιστάν — вельможа; ὑπηρετέω — служить); слав. «посреде вельмож послужит». ἔναντι ἡγουμένων ὀφθήσεται — «пред начальствующими явится» (ἡγούμενος — начальник); ἐν γῇ ἀλλοτρίων ἐθνῶν διελεύσεται — «по земле чужих народов пройдёт» (ἀλλότριος — чужой; διέρχομαι — проходить); ἀγαθὰ γὰρ καὶ κακὰ ἐν ἀνθρώποις ἐπείρασεν — «ибо доброе и злое среди людей испытал» (πειράζω — испытывать); слав. «добро бо и зло в человецех искуси»."
  5: "τὴν καρδίαν αὐτοῦ ἐπιδώσει ὀρθρῖσαι πρὸς κύριον — «сердце своё отдаст тому, чтобы с рассветом [обратиться] к Господу» (ὀρθρίζω — вставать рано, с рассветом); слав. «сердце свое вдаст утреневати ко Господу». καὶ ἀνοίξει στόμα αὐτοῦ ἐν προσευχῇ — «и откроет уста свои в молитве» (προσευχή — молитва); περὶ τῶν ἁμαρτιῶν αὐτοῦ δεηθήσεται — «о грехах своих помолится» (ἁμαρτία — грех)."
  6: "ἐὰν κύριος ὁ μέγας θελήσῃ — «если великий Господь захочет» (θέλω — хотеть); слав. «аще Господь велий восхощет». πνεύματι συνέσεως ἐμπλησθήσεται — «духом разумения исполнится» (πνεῦμα — дух; σύνεσις — разумение); αὐτὸς ἀνομβρήσει ῥήματα σοφίας αὐτοῦ — «Он изольёт, как дождь, слова премудрости его» (ἀνομβρέω — изливать дождём); ἐν προσευχῇ ἐξομολογήσεται κυρίῳ — «в молитве исповедается Господу» (ἐξομολογέομαι — исповедовать, благодарить)."
  7: "αὐτὸς κατευθυνεῖ βουλὴν αὐτοῦ καὶ ἐπιστήμην — «Он направит совет его и знание» (κατευθύνω — направлять; βουλή — совет; ἐπιστήμη — знание); слав. «той управит совет его и художество». ἐν τοῖς ἀποκρύφοις αὐτοῦ διανοηθήσεται — «в сокровенных Его будет размышлять» (ἀπόκρυφος — сокровенный)."
  8: "αὐτὸς ἐκφανεῖ παιδείαν διδασκαλίας αὐτοῦ — «Он явит наставление учения его» (ἐκφαίνω — являть; παιδεία — наставление; διδασκαλία — учение); слав. «той известит наказание учения его». ἐν νόμῳ διαθήκης κυρίου καυχήσεται — «в законе завета Господня будет хвалиться» (διαθήκη — завет; καυχάομαι — хвалиться); слав. «в законе завета Господня похвалится»."
  9: "αἰνέσουσιν τὴν σύνεσιν αὐτοῦ πολλοί — «будут хвалить разумение его многие» (αἰνέω — хвалить; σύνεσις — разумение); слав. «восхвалят разум его мнози». οὐκ ἀποστήσεται τὸ μνημόσυνον αὐτοῦ — «не отступит память его» (μνημόσυνον — память); τὸ ὄνομα αὐτοῦ ζήσεται εἰς γενεὰς γενεῶν — «имя его будет жить в роды родов»; слав. «имя его поживет в роды родов»."
  10: "τὴν σοφίαν αὐτοῦ διηγήσονται ἔθνη — «премудрость его возвестят народы» (διηγέομαι — возвещать); слав. «премудрость его поведят языцы». τὸν ἔπαινον αὐτοῦ ἐξαγγελεῖ ἐκκλησία — «хвалу его возвестит собрание» (ἔπαινος — хвала; ἐκκλησία — собрание); слав. «хвалу его исповесть церковь»."
  11: "ἐὰν ἐμμείνῃ, ὄνομα καταλείψει ἢ χίλιοι — «если пребудет, оставит имя более [чем] тысяча» (ἐμμένω — пребывать; καταλείπω — оставлять); слав. «аще пребудет, приусвоит себе, и аще почиет, имя оставит паче тысящ». ἐὰν ἀναπαύσηται, ἐκποιεῖ αὐτῷ — «если почиет, [это] служит ему» (ἀναπαύομαι — почивать; ἐκποιέω — быть достаточным, служить). Место тёмное; смысл: и по смерти имя его полезно."
  12: "Ἔτι διανοηθεὶς ἐκδιηγήσομαι — «ещё размыслив, возвещу» (ἔτι — ещё; διανοέομαι — размышлять; ἐκδιηγέομαι — возвещать); слав. «еще размыслив повем». ὡς διχομηνία ἐπληρώθην — «как в середине месяца (полнолуние) я исполнился» (διχομηνία — полнолуние, середина месяца; πίμπλημι — наполнять); слав. «якоже луны полнота наполнихся»."
  13: "εἰσακούσατέ μου, υἱοὶ ὅσιοι — «послушайте меня, святые сыны» (εἰσακούω — слушать; ὅσιος — святой, благочестивый); слав. «послушайте мене, преподобнии сынове». βλαστήσατε ὡς ῥόδον φυόμενον ἐπὶ ῥεύματος ὑγροῦ — «произрастите, как роза, растущая при влажном потоке» (βλαστάνω — произрастать; ῥόδον — роза; ῥεῦμα — поток; ὑγρός — влажный); слав. «прозябните яко шипки произрастающыя при потоце селнем»."
  14: "ὡς λίβανος εὐωδιάσατε ὀσμήν — «как ливан, благоухайте запахом» (λίβανος — ладан, ливан; εὐωδιάζω — благоухать; ὀσμή — запах); слав. «якоже ливан дадите благовоние». ἀνθήσατε ἄνθος ὡς κρίνον — «расцветите цветом, как лилия» (ἄνθος — цвет; κρίνον — лилия); διάδοτε ὀσμὴν καὶ αἰνέσατε ᾆσμα — «дайте запах и воспойте песнь» (ᾆσμα — песнь); εὐλογήσατε κύριον ἐπὶ πᾶσιν τοῖς ἔργοις — «благословите Господа во всех делах»."
  15: "δότε τῷ ὀνόματι αὐτοῦ μεγαλωσύνην — «дайте имени Его величие» (μεγαλωσύνη — величие); слав. «дадите имени его величие». ἐξομολογήσασθε ἐν αἰνέσει αὐτοῦ — «исповедайтесь в хвале Его» (αἴνεσις — хвала); ἐν ᾠδαῖς χειλέων καὶ ἐν κινύραις — «в песнях уст и в кифарах» (ᾠδή — песнь; χεῖλος — губа; κινύρα — кифара, струнный инструмент); слав. «в песнех устен и в гуслех». οὕτως ἐρεῖτε ἐν ἐξομολογήσει — «так скажите в исповедании»."
  16: "Τὰ ἔργα κυρίου πάντα ὅτι καλὰ σφόδρα — «все дела Господа прекрасны весьма» (σφόδρα — весьма); слав. «дела Господня вся яко добра зело». πᾶν πρόσταγμα ἐν καιρῷ αὐτοῦ ἔσται — «всякое повеление будет в своё время» (πρόσταγμα — повеление; καιρός — время); οὐκ ἔστιν εἰπεῖν Τί τοῦτο; εἰς τί τοῦτο; — «нельзя сказать: что это? для чего это?»; эти слова — 「…」. πάντα γὰρ ἐν καιρῷ αὐτοῦ ζητηθήσεται — «ибо всё в своё время будет искано (объяснено)». Гимн 16–35 идёт без внешних кавычек."
  17: "ἐν λόγῳ αὐτοῦ ἔστη ὡς θιμωνιὰ ὕδωρ — «словом Его стала как стог вода» (θιμωνιά — стог, куча; ὕδωρ — вода); слав. «словом его ста вода яко стог». ἐν ῥήματι στόματος αὐτοῦ ἀποδοχεῖα ὑδάτων — «словом уст Его — вместилища вод» (ῥῆμα — слово; ἀποδοχεῖον — вместилище, водоём); слав. «глаголом уст его приятелища водная»."
  18: "ἐν προστάγματι αὐτοῦ πᾶσα ἡ εὐδοκία — «по повелению Его всякое благоволение» (πρόσταγμα — повеление; εὐδοκία — благоволение); слав. «повелением его всякое благоволение». οὐκ ἔστιν ὃς ἐλαττώσει τὸ σωτήριον αὐτοῦ — «нет [никого], кто умалит спасение Его» (ἐλαττόω — уменьшать; σωτήριον — спасение); слав. «несть, иже умалит спасение его»."
  19: "ἔργα πάσης σαρκὸς ἐνώπιον αὐτοῦ — «дела всякой плоти пред Ним» (σάρξ — плоть; ἐνώπιον — перед); слав. «дела всякия плоти пред ним». οὐκ ἔστιν κρυβῆναι ἀπὸ τῶν ὀφθαλμῶν αὐτοῦ — «нельзя укрыться от очей Его» (κρύπτω — скрывать; ὀφθαλμός — глаз); слав. «несть укрытися от очес его»."
  20: "ἀπὸ τοῦ αἰῶνος εἰς τὸν αἰῶνα ἐπέβλεψεν — «от века до века Он призрел» (αἰών — век; ἐπιβλέπω — призирать); слав. «от века на век призре». οὐθέν ἐστιν θαυμάσιον ἐναντίον αὐτοῦ — «нет ничего дивного пред Ним» (θαυμάσιον — дивное); слав. «ничтоже есть дивно пред ним»."
  21: "οὐκ ἔστιν εἰπεῖν Τί τοῦτο; εἰς τί τοῦτο; — «нельзя сказать: что это? для чего это?»; слав. «несть рещи: что сие? на что сие?». πάντα γὰρ εἰς χρείας αὐτῶν ἔκτισται — «ибо всё для нужд их создано» (χρεία — нужда; κτίζω — создавать); слав. «вся бо на потребу их создана быша»."
  22: "Ἡ εὐλογία αὐτοῦ ὡς ποταμὸς ἐπεκάλυψεν — «благословение Его, как река, покрыло» (εὐλογία — благословение; ποταμός — река; ἐπικαλύπτω — покрывать); слав. «благословение его яко река покры». ὡς κατακλυσμὸς ξηρὰν ἐμέθυσεν — «как потоп напоил сушу» (κατακλυσμός — потоп; ξηρά — суша; μεθύσκω — поить, насыщать); слав. «яко поток сушу напои»."
  23: "οὕτως ὀργὴν αὐτοῦ ἔθνη κληρονομήσει — «так гнев Его народы наследуют» (ὀργή — гнев; κληρονομέω — наследовать); слав. «сице гнев его языцы наследят». ὡς μετέστρεψεν ὕδατα εἰς ἅλμην — «как Он обратил воды в солёность» (μεταστρέφω — обращать; ἅλμη — солёность, рассол); слав. «яко преврати воду в сланость»."
  24: "αἱ ὁδοὶ αὐτοῦ τοῖς ὁσίοις εὐθεῖαι — «пути Его святым прямы» (ὁδός — путь; ὅσιος — святой; εὐθύς — прямой); слав. «путие его преподобным прави». τοῖς ἀνόμοις προσκώμματα — «беззаконным — преткновения» (ἄνομος — беззаконный; πρόσκομμα — преткновение); слав. «беззаконником претыкания»."
  25: "ἀγαθὰ τοῖς ἀγαθοῖς ἔκτισται ἀπ᾿ ἀρχῆς — «блага добрым созданы от начала» (ἀγαθός — добрый; κτίζω — создавать); слав. «благая благим создана быша из начала». οὕτως τοῖς ἁμαρτωλοῖς κακά — «так и грешникам — злое» (ἁμαρτωλός — грешник); слав. «такожде грешным злая»."
  26: "ἀρχὴ πάσης χρείας εἰς ζωὴν ἀνθρώπου — «начало всякой нужды для жизни человека» (ἀρχή — начало; χρεία — нужда; ζωή — жизнь); слав. «начало всякия потребы в житие человеку». ὕδωρ καὶ πῦρ καὶ σίδηρος καὶ ἅλας καὶ σεμίδαλις πυροῦ καὶ γάλα καὶ μέλι — «вода, огонь, железо, соль, пшеничная мука, молоко и мёд» (σίδηρος — железо; ἅλας — соль; σεμίδαλις — лучшая мука; γάλα — молоко; μέλι — мёд); αἷμα σταφυλῆς καὶ ἔλαιον καὶ ἱμάτιον — «кровь винограда, елей и одежда» (σταφυλή — виноградная гроздь; ἔλαιον — елей; ἱμάτιον — одежда)."
  27: "ταῦτα πάντα τοῖς εὐσεβέσιν εἰς ἀγαθά — «всё это благочестивым во благо» (εὐσεβής — благочестивый); слав. «вся сия благочестивым во благая». οὕτως τοῖς ἁμαρτωλοῖς τραπήσεται εἰς κακά — «так и грешникам обратится во зло» (τρέπω — обращать); слав. «сице и грешником превратятся во злая»."
  28: "Ἔστιν πνεύματα, ἃ εἰς ἐκδίκησιν ἔκτισται — «есть духи (или ветры), созданные на отмщение» (πνεῦμα — дух, ветер; ἐκδίκησις — отмщение); слав. «суть дуси, иже создани быша на месть». ἐν θυμῷ αὐτοῦ ἐστερέωσεν μάστιγας αὐτῶν — «в гневе Своём Он утвердил бичи их» (θυμός — гнев; στερεόω — утверждать; μάστιξ — бич); ἐν καιρῷ συντελείας ἰσχὺν ἐκχεοῦσιν — «во время кончины изольют силу» (συντέλεια — кончина; ἐκχέω — изливать); τὸν θυμὸν τοῦ ποιήσαντος αὐτοὺς κοπάσουσιν — «гнев Сотворившего их утолят» (κοπάζω — утихать, утолять)."
  29: "πῦρ καὶ χάλαζα καὶ λιμὸς καὶ θάνατος — «огонь, град, голод и смерть» (χάλαζα — град; λιμός — голод; θάνατος — смерть); слав. «огнь и град, и глад и смерть». πάντα ταῦτα εἰς ἐκδίκησιν ἔκτισται — «всё это на отмщение создано»."
  30: "θηρίων ὀδόντες — «зубы зверей» (θηρίον — зверь; ὀδούς — зуб); слав. «зубы зверей». σκορπίοι καὶ ἔχεις — «скорпионы и змеи» (σκορπίος — скорпион; ἔχις — змея, ехидна); ῥομφαία ἐκδικοῦσα εἰς ὄλεθρον ἀσεβεῖς — «меч, мстящий на погибель нечестивым» (ῥομφαία — меч; ἐκδικέω — мстить; ὄλεθρος — погибель; ἀσεβής — нечестивый)."
  31: "ἐν τῇ ἐντολῇ αὐτοῦ εὐφρανθήσονται — «в заповеди Его они возрадуются» (ἐντολή — заповедь; εὐφραίνομαι — радоваться); слав. «в заповедех его возвеселятся». ἐπὶ τῆς γῆς εἰς χρείας ἑτοιμασθήσονται — «на земле для нужд приготовятся» (ἑτοιμάζω — готовить); ἐν καιροῖς αὐτῶν οὐ παραβήσονται λόγον — «в времена свои не преступят слова» (παραβαίνω — преступать)."
  32: "Διὰ τοῦτο ἐξ ἀρχῆς ἐστηρίχθην καὶ διενοήθην — «поэтому от начала я утвердился и размыслил» (στηρίζω — утверждать; διανοέομαι — размышлять); слав. «сего ради исперва утвердихся и размыслих». ἐν γραφῇ ἀφῆκα — «в писании оставил» (γραφή — писание; ἀφίημι — оставлять); слав. «в писании оставих»."
  33: "Τὰ ἔργα κυρίου πάντα ἀγαθά — «все дела Господа благи»; слав. «вся дела Господня блага». πᾶσαν χρείαν ἐν ὥρᾳ αὐτῆς χορηγήσει — «всякую нужду в час её подаст» (χρεία — нужда; ὥρα — час; χορηγέω — подавать, доставлять); слав. «всю потребу во время свое подаст»."
  34: "καὶ οὐκ ἔστιν εἰπεῖν Τοῦτο τούτου πονηρότερον — «и нельзя сказать: это хуже того» (πονηρός — злой, худой; сравн. πονηρότερον); слова — 「…」; слав. «и несть рещи: сие сего злее». πάντα γὰρ ἐν καιρῷ εὐδοκιμηθήσεται — «ибо всё в своё время будет признано добрым» (εὐδοκιμέω — быть признанным, одобряться); слав. «вся бо во время на угождение будут»."
  35: "καὶ νῦν ἐν πάσῃ καρδίᾳ καὶ στόματι ὑμνήσατε — «и ныне всем сердцем и устами воспойте» (ὑμνέω — воспевать; καρδία — сердце; στόμα — уста); слав. «и ныне всем сердцем и усты воспойте». εὐλογήσατε τὸ ὄνομα κυρίου — «благословите имя Господне»; слав. «благословите имя Господне»."
