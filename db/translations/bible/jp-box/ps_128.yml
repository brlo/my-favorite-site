verses:
  0: "登[とう]上[じょう]の歌[うた]。"
  1: "イスラエルは言[い]うがよい。「わたしの若[わか]いときから、彼[かれ]らは幾度[いくど]もわたしを攻[せ]めた。"
  2: "わたしの若[わか]いときから、彼[かれ]らは幾度[いくど]もわたしを攻[せ]めたが、わたしに勝[か]つことはできなかった」。"
  3: "悪[わる]い者[もの]たちは、わたしの背[せ]に鋤[すき]を入[い]れた。彼[かれ]らはその不法[ふほう]の畝[うね]を長[なが]くした。"
  4: "主[しゅ]は正[ただ]しく、悪[わる]い者[もの]たちの首[くび]を断[た]ち切[き]られた。"
  5: "シオンを憎[にく]む者[もの]は、すべて恥[は]ずかしめられ、後[うし]ろへ退[しりぞ]くように。"
  6: "彼[かれ]らが、引[ひ]き抜[ぬ]かれる前[まえ]に枯[か]れる屋根[やね]の草[くさ]のようになるように。"
  7: "この草[くさ]は、刈[か]る者[もの]の手[て]を満[み]たさず、束[たば]を集[あつ]める者[もの]の懐[ふところ]も満[み]たさない。"
  8: "そして、通[とお]り過[す]ぎる者[もの]も、「主[しゅ]の祝福[しゅくふく]があなたがたの上[うえ]にあるように。わたしたちは主[しゅ]の名[な]によってあなたがたを祝福[しゅくふく]した」と言[い]わない。"

notes:
  0: "Ὠιδὴ τῶν ἀναβαθμῶν — 登[とう]上[じょう]の歌. Стих 0; совпадает в gr-lxx-byz и в ru-базе."
  1: "Πλεονάκις ἐπολέμησάν με ἐκ νεότητός μου — わたしの若いときから、彼らは幾度もわたしを攻めた (πλεονάκις — «многократно»; πολεμέω — «воевать»; νεότης — «юность»). εἰπάτω δὴ Ισραηλ — イスラエルは言うがよい (призыв, как 123:1; отсюда «…», замыкающиеся в ст. 2)."
  2: "πλεονάκις ἐπολέμησάν με ἐκ νεότητός μου — дословный повтор ст. 1, сохранён без изменений (приём евр. поэзии: повтор с добавлением). καὶ γὰρ οὐκ ἠδυνήθησάν μοι — わたしに勝つことはできなかった (δύναμαι — «мочь»; μοί — датив «против меня»)."
  3: "ἐπὶ τοῦ νώτου μου ἐτέκταινον οἱ ἁμαρτωλοί — 悪い者たちは、わたしの背に鋤を入れた (νῶτον — «спина»; τεκταίνομαι — «плотничать, вытёсывать», в LXX образ вспахивания спины, ср. jp-joc «耕へす者»). ἐμάκρυναν τὴν ἀνομίαν αὐτῶν — 彼らはその不法の畝を長くした (μακρύνω — «удлинять»; ἀνομία — 不法; образ длинных борозд — «долго длилось их беззаконие»)."
  4: "κύριος δίκαιος — 主は正しく (δίκαιος — 正しい, ср. 1:6). συνέκοψεν αὐχένας ἁμαρτωλῶν — 悪い者たちの首を断ち切られた (συγκόπτω — «рассекать, сокрушать»; αὐχήν — «шея, выя», ср. церковнослав. «ссече выя грешников»). Образ ярма, снятого с шеи народа."
  5: "αἰσχυνθήτωσαν καὶ ἀποστραφήτωσαν εἰς τὰ ὀπίσω — 恥ずかしめられ、後ろへ退くように (αἰσχύνομαι — «стыдиться»; ἀποστρέφω — «поворачивать назад»; императивы 3 л. — пожелание, отсюда ように). πάντες οἱ μισοῦντες Σιων — シオンを憎む者は、すべて (μισέω — 憎む)."
  6: "γενηθήτωσαν ὡς χόρτος δωμάτων — 屋根の草のようになるように (χόρτος — «трава»; δῶμα — «кровля»; на плоских кровлях трава всходила и тотчас сохла). ὃς πρὸ τοῦ ἐκσπασθῆναι ἐξηράνθη — 引き抜かれる前に枯れる (ἐκσπάω — «выдёргивать»; ξηραίνω — «сушить, сохнуть»)."
  7: "οὗ οὐκ ἐπλήρωσεν τὴν χεῖρα αὐτοῦ ὁ θερίζων — この草は、刈る者の手を満たさず (θερίζω — «жать»; πληρόω — «наполнять»). καὶ τὸν κόλπον αὐτοῦ ὁ τὰ δράγματα συλλέγων — 束を集める者の懐も満たさない (κόλπος — «лоно, пазуха», отсюда 懐; δράγμα — «сноп», ср. 125:6)."
  8: "καὶ οὐκ εἶπαν οἱ παράγοντες — 通り過ぎる者も…と言わない (παράγω — «проходить мимо»; при жатве прохожие приветствовали жнецов благословением, ср. Руфь 2:4). Εὐλογία κυρίου ἐφ' ὑμᾶς — 「主の祝福があなたがたの上にあるように」 (εὐλογία — «благословение»). εὐλογήκαμεν ὑμᾶς ἐν ὀνόματι κυρίου — わたしたちは主の名によってあなたがたを祝福した (perfect εὐλογήκαμεν — совершённое действие, ответное приветствие). Слова проходящих — 「…」."
