verses:
  1: "主[しゅ]はエジプトの地[ち]で、モーセとアロンに言[い]われた。"
  2: "「この月[つき]をあなたがたの月[つき]の初[はじ]めとしなさい。一年[いちねん]の月[つき]のうちで、あなたがたにはこれが第一[だいいち]の月[つき]となる。"
  3: "イスラエルの子[こ]らの会衆[かいしゅう]すべてに語[かた]って言[い]いなさい。この月[つき]の十日[とおか]に、おのおの父[ちち]の家[いえ]ごとに小羊[こひつじ]を一匹[いっぴき]ずつ取[と]りなさい。家[いえ]ごとに小羊[こひつじ]を一匹[いっぴき]である。"
  4: "もし家[いえ]の者[もの]が少[すく]なくて、小羊[こひつじ]一匹[いっぴき]を食[た]べ尽[つ]くせないなら、その人[ひと]は家[いえ]の近[ちか]くの隣人[りんじん]を連[つ]れて来[き]て、人[ひと]の数[かず]に従[したが]ってそれを取[と]りなさい。おのおの食[た]べる分[ぶん]に応[おう]じて、小羊[こひつじ]の数[かず]を決[き]めなさい。"
  5: "あなたがたの小羊[こひつじ]は、傷[きず]のない一歳[いっさい]の雄[おす]でなければならない。羊[ひつじ]の群[む]れから、あるいは山羊[やぎ]の群[む]れから取[と]りなさい。"
  6: "それをこの月[つき]の十四日[じゅうよっか]まで守[まも]っておき、イスラエルの子[こ]らの会衆[かいしゅう]のすべてが、夕暮[ゆうぐ]れにそれを屠[ほふ]りなさい。"
  7: "その血[ち]を取[と]り、それを食[た]べる家[いえ]の二[ふた]つの門柱[もんちゅう]と鴨居[かもい]に塗[ぬ]りなさい。"
  8: "その夜[よる]、その肉[にく]を食[た]べなさい。火[ひ]で焼[や]いたもの、種[たね]なしパン⟨パン種[ぱんだね]を入[い]れずに焼[や]いたパン。⟩と苦[にが]い菜[な]を添[そ]えて食[た]べなさい。"
  9: "生[なま]で食[た]べても、水[みず]で煮[に]て食[た]べてもならない。火[ひ]で焼[や]いたものを、頭[あたま]も足[あし]も内臓[ないぞう]もともに食[た]べなさい。"
  10: "朝[あさ]までその一部[いちぶ]も残[のこ]してはならない。その骨[ほね]を一本[いっぽん]も折[お]ってはならない。朝[あさ]まで残[のこ]ったものは、火[ひ]で焼[や]き尽[つ]くしなさい。"
  11: "あなたがたはこうしてそれを食[た]べなさい。腰[こし]に帯[おび]を締[し]め、足[あし]に履[は]き物[もの]をはき、手[て]に杖[つえ]を持[も]ち、急[いそ]いでそれを食[た]べなさい。それは主[しゅ]の過越[すぎこし]⟨エジプトで災[わざわ]いが家[いえ]を過[す]ぎ越[こ]したことを記念[きねん]する祭[まつ]り。⟩である。"
  12: "わたしはこの夜[よる]、エジプトの地[ち]を巡[めぐ]り、エジプトの地[ち]の初子[ういご]をすべて、人[ひと]から家畜[かちく]に至[いた]るまで打[う]つ。またエジプトのすべての神々[かみがみ]にも、わたしは裁[さば]きを行[おこな]う。わたしは主[しゅ]である。"
  13: "その血[ち]は、あなたがたがいる家[いえ]の上[うえ]であなたがたへのしるしとなる。わたしはその血[ち]を見[み]て、あなたがたを覆[おお]い守[まも]る。わたしがエジプトの地[ち]を打[う]つとき、あなたがたのうちに滅[ほろ]ぼす災[わざわ]いは及[およ]ばない。"
  14: "この日[ひ]はあなたがたの記念[きねん]の日[ひ]となる。あなたがたは代々[よよ]、これを主[しゅ]の祭[まつ]りとして祝[いわ]いなさい。永遠[えいえん]の定[さだ]めとして、これを祝[いわ]いなさい。"
  15: "七日[なぬか]の間[あいだ]、あなたがたは種[たね]なしパンを食[た]べなさい。初[はじ]めの日[ひ]に、あなたがたの家[いえ]からパン種[ぱんだね]を除[のぞ]き去[さ]りなさい。パン種[ぱんだね]を入[い]れたものを食[た]べる者[もの]は、初[はじ]めの日[ひ]から七日目[なぬかめ]まで、その魂[たましい]はイスラエルから断[た]たれる。"
  16: "初[はじ]めの日[ひ]は聖[せい]なる集[つど]いと呼ばれ、七日目[なぬかめ]も聖[せい]なる集[つど]いとなる。その日[ひ]にはどのような仕事[しごと]もしてはならない。ただ、すべての魂[たましい]のためにしなければならないこと、それだけをあなたがたはしてよい。"
  17: "あなたがたはこの戒[いまし]めを守[まも]りなさい。この日[ひ]、わたしはあなたがたの軍勢[ぐんせい]をエジプトの地[ち]から導[みちび]き出[だ]すからである。あなたがたはこの日[ひ]を、代々[よよ]にわたる永遠[えいえん]の定[さだ]めとしなさい。"
  18: "第一[だいいち]の月[つき]の十四日[じゅうよっか]の夕[ゆう]べから、その月[つき]の二十一日[にじゅういちにち]の夕[ゆう]べまで、あなたがたは種[たね]なしパンを食[た]べなさい。"
  19: "七日[なぬか]の間[あいだ]、あなたがたの家[いえ]にはパン種[ぱんだね]が見[み]つかってはならない。種[たね]を入[い]れたものを食[た]べる者[もの]は、その地[ち]の寄留者[きりゅうしゃ]であれ、その地[ち]の生[う]まれの者[もの]であれ、イスラエルの会衆[かいしゅう]から断[た]たれる。"
  20: "種[たね]を入[い]れたものは一切[いっさい]食[た]べてはならない。あなたがたのすべての住[す]む所[ところ]で、種[たね]なしパンを食[た]べなさい。」"
  21: "モーセはイスラエルの子[こ]らのすべての長老[ちょうろう]を呼[よ]んで言[い]った。「あなたがたは行[い]って、家族[かぞく]ごとに小羊[こひつじ]を取[と]り、過越[すぎこし]の犠牲[ぎせい]を屠[ほふ]りなさい。"
  22: "あなたがたはヒソプの束[たば]を取[と]り、戸口[とぐち]のそばにある血[ち]に浸[ひた]して、鴨居[かもい]と二[ふた]つの門柱[もんちゅう]に、戸口[とぐち]のそばにあるその血[ち]を塗[ぬ]りなさい。あなたがたは朝[あさ]まで、おのおの自分[じぶん]の家[いえ]の戸口[とぐち]から出[で]てはならない。"
  23: "主[しゅ]はエジプト人[じん]を打[う]つために通[とお]り過[す]ぎられる。鴨居[かもい]と二[ふた]つの門柱[もんちゅう]の血[ち]を見[み]ると、主[しゅ]はその戸口[とぐち]を過[す]ぎ越[こ]し、滅[ほろ]ぼす者[もの]があなたがたの家[いえ]に入[はい]って打[う]つことを許[ゆる]されない。"
  24: "あなたがたはこの言葉[ことば]を、自分[じぶん]と自分[じぶん]の子[こ]らへの永遠[えいえん]の定[さだ]めとして守[まも]りなさい。"
  25: "主[しゅ]が言[い]われたとおりに、あなたがたに与[あた]えられる地[ち]に入[はい]ったなら、この務[つと]めを守[まも]りなさい。"
  26: "あなたがたの子[こ]らが『この務[つと]めは何[なに]か』と問[と]うなら、"
  27: "彼[かれ]らにこう言[い]いなさい。『これは、エジプトでイスラエルの子[こ]らの家[いえ]を覆[おお]い守[まも]られた主[しゅ]への過越[すぎこし]の犠牲[ぎせい]である。主[しゅ]がエジプト人[じん]を打[う]たれたとき、わたしたちの家[いえ]をお救[すく]いになったのである。』」民[たみ]は身[み]をかがめて礼拝[れいはい]した。"
  28: "イスラエルの子[こ]らは行[い]って、主[しゅ]がモーセとアロンに命[めい]じられたとおりに行[おこな]った。そのとおりに行[おこな]った。"
  29: "夜[よる]の半[なか]ば、主[しゅ]はエジプトの地[ち]の初子[ういご]をすべて打[う]たれた。ファラオの位[くらい]に座[すわ]る者[もの]の初子[ういご]から、穴倉[あなぐら]にいる捕虜[ほりょ]の女[おんな]の初子[ういご]に至[いた]るまで、また家畜[かちく]の初子[ういご]もすべて打[う]たれた。"
  30: "ファラオは夜[よる]に起[お]き、その家来[けらい]たちもエジプト人[じん]もみな起[お]きた。エジプト全土[ぜんど]に大[おお]きな叫[さけ]びが起[お]こった。死[し]んだ者[もの]のいない家[いえ]は一[ひと]つもなかったからである。"
  31: "ファラオは夜[よる]のうちにモーセとアロンを呼[よ]んで言[い]った。「立[た]って、わたしの民[たみ]の中[なか]から出[で]て行[い]け。あなたがたも、イスラエルの子[こ]らも。行[い]って、あなたがたが言[い]うとおりに、あなたがたの神[かみ]であられる主[しゅ]に仕[つか]えなさい。"
  32: "あなたがたの羊[ひつじ]も牛[うし]も連[つ]れて行[い]け。そして、わたしをも祝福[しゅくふく]してくれ。」"
  33: "エジプト人[じん]は民[たみ]をせき立[た]てて、急[いそ]いでその地[ち]から追[お]い出[だ]そうとした。「わたしたちはみな死[し]んでしまう」と彼[かれ]らは言[い]ったからである。"
  34: "民[たみ]は、練[ね]り粉[こ]がまだふくらまないうちにそれを取[と]り、衣[ころも]に包[つつ]んで肩[かた]に担[かつ]いだ。"
  35: "イスラエルの子[こ]らは、モーセが命[めい]じたとおりに行[おこな]い、エジプト人[じん]に銀[ぎん]の器[うつわ]と金[きん]の器[うつわ]、それに衣[ころも]を求[もと]めた。"
  36: "主[しゅ]は民[たみ]に、エジプト人[じん]の目[め]にかなう{恵[めぐ]み|恩寵[おんちょう]}を与[あた]えられたので、エジプト人[じん]は求[もと]められるままに貸[か]し与[あた]えた。こうして、彼[かれ]らはエジプト人[じん]を奪[うば]い尽[つ]くした。"
  37: "イスラエルの子[こ]らはラメセスを出[で]てスコトへ向[む]かった。荷[に]を負[お]う者[もの]のほかに、徒歩[かち]の男[おとこ]たちが六十万[ろくじゅうまん]人[にん]いた。"
  38: "また、多[おお]くの混[ま]じり合[あ]った民[たみ]が彼[かれ]らとともに上[のぼ]って行[い]った。羊[ひつじ]も牛[うし]も、家畜[かちく]も非常[ひじょう]に多[おお]くいた。"
  39: "彼[かれ]らは、エジプトから持[も]ち出[だ]した練[ね]り粉[こ]を焼[や]いて、種[たね]なしのパンにした。ふくれていなかったからである。エジプト人[じん]に追[お]い出[だ]されて、ためらうこともできず、道[みち]のための食[た]べ物[もの]も用意[ようい]できなかったのである。"
  40: "イスラエルの子[こ]らがエジプトの地[ち]とカナンの地[ち]に住[す]んだ期間[きかん]は、四百三十年[よんひゃくさんじゅうねん]であった。"
  41: "四百三十年[よんひゃくさんじゅうねん]の後[のち]、主[しゅ]の軍勢[ぐんせい]はすべてエジプトの地[ち]から出[で]た。"
  42: "これは主[しゅ]への見張[みは]りの夜[よる]であり、主[しゅ]が彼[かれ]らをエジプトの地[ち]から導[みちび]き出[だ]された夜[よる]である。この同[おな]じ夜[よる]は、イスラエルの子[こ]らすべてが代々[よよ]にわたって守[まも]る、主[しゅ]への見張[みは]りの夜[よる]である。"
  43: "主[しゅ]はモーセとアロンに言[い]われた。「過越[すぎこし]の法[ほう]はこうである。外国[がいこく]の者[もの]はだれも、これを食[た]べてはならない。"
  44: "おのおのの奴隷[どれい]、すなわち銀[ぎん]で買[か]い取[と]った者[もの]には割礼[かつれい]を施[ほどこ]しなさい。そうすれば、彼[かれ]はこれを食[た]べることができる。"
  45: "寄留者[きりゅうしゃ]も雇[やと]われた者[もの]も、これを食[た]べてはならない。"
  46: "一[ひと]つの家[いえ]で食[た]べなければならない。その肉[にく]を家[いえ]の外[そと]へ持[も]ち出[だ]してはならない。その骨[ほね]を一本[いっぽん]も折[お]ってはならない。"
  47: "イスラエルの子[こ]らの会衆[かいしゅう]はすべて、これを行[おこな]わなければならない。"
  48: "あなたがたのもとに寄留者[きりゅうしゃ]が来[き]て、主[しゅ]の過越[すぎこし]を行[おこな]おうとするなら、その男[おとこ]はみな割礼[かつれい]を受[う]けさせなさい。そうすれば、彼[かれ]はその地[ち]の生[う]まれの者[もの]と同[おな]じように、これを行[おこな]うことができる。割礼[かつれい]を受[う]けていない者[もの]は、だれもこれを食[た]べてはならない。"
  49: "この地[ち]の生[う]まれの者[もの]にも、あなたがたの間[あいだ]にいる寄留者[きりゅうしゃ]にも、同[おな]じ一[ひと]つの法[ほう]がある。」"
  50: "イスラエルの子[こ]らは、主[しゅ]がモーセとアロンを通[とお]して命[めい]じられたとおりに行[おこな]った。そのとおりに行[おこな]った。"
  51: "その日[ひ]、主[しゅ]はイスラエルの子[こ]らを、その軍勢[ぐんせい]とともにエジプトの地[ち]から導[みちび]き出[だ]された。"

notes:
  1: "εἶπεν … ἐν γῇ Αἰγύπτου λέγων — エジプトの地で…言われた (обстоятельство места относится к речению, а не к исходу). λέγων по-японски не передаётся отдельно."
  2: "ὁ μὴν οὗτος — この月 (μείς — «месяц»). ἀρχὴ μηνῶν — 月の初め (не «начало месяцев» как исчисление, а первый месяц года). πρῶτός ἐστιν ὑμῖν — あなたがたにはこれが第一の月となる."
  3: "συναγωγὴ υἱῶν Ισραηλ — イスラエルの子らの会衆 (συναγωγή — «собрание»). τῇ δεκάτῃ τοῦ μηνός — この月の十日に. πρόβατον κατ᾽ οἴκους πατριῶν — 父の家ごとに小羊 (κατὰ + вин. — «по»; πατριά — «род, семейство»). ἕκαστος πρόβατον κατ᾽ οἰκίαν — 家ごとに小羊を一匹 (повтор, как в LXX)."
  4: "ὀλιγοστοὶ ὦσιν — 少なくて (ὀλιγοστός — «немногочисленный»). ὥστε μὴ ἱκανοὺς εἶναι εἰς πρόβατον — 小羊一匹を食べ尽くせない (ἱκανός — «достаточный»). κατὰ ἀριθμὸν ψυχῶν — 人の数に従って (ψυχή — «душа», здесь «человек»). τὸ ἀρκοῦν αὐτῷ συναριθμήσεται — 食べる分に応じて数える (ἀρκέω — «быть достаточным»)."
  5: "τέλειον — 傷のない (τέλειος — «совершенный, без порока»). ἐνιαύσιον — 一歳の (ἐνιαυτός — «год»). ἄρσεν — 雄. ἀπὸ τῶν ἀρνῶν καὶ τῶν ἐρίφων — 羊の群れから、あるいは山羊の群れから (ἀρήν — «ягнёнок», ἔριφος — «козлёнок»)."
  6: "διατετηρημένον — 守っておき (διατηρέω — «сберегать»). ἕως τῆς τεσσαρεσκαιδεκάτης — 十四日まで. πᾶν τὸ πλῆθος συναγωγῆς — 会衆のすべて (πλῆθος — «множество»). πρὸς ἑσπέραν — 夕暮れに (букв. «к вечеру»)."
  7: "ἀπὸ τοῦ αἵματος — その血を (частично). ἐπὶ τῶν δύο σταθμῶν — 二つの門柱に (σταθμός — «косяк»). ἐπὶ τὴν φλιάν — 鴨居に (φλιά — «перекладина двери»). ἐν οἷς ἐὰν φάγωσιν — それを食べる家の."
  8: "τὰ κρέα — その肉 (κρέας). ὀπτὰ πυρί — 火で焼いたもの (ὀπτός — «печёный, жареный»). ἄζυμα — 種なしパン (ἄζυμος — «пресный»; сноска). ἐπὶ πικρίδων — 苦い菜を添えて (πικρίς — «горькая зелень»)."
  9: "ὠμόν — 生で (ὠμός — «сырой»). ἡψημένον ἐν ὕδατι — 水で煮て (ἕψω — «варить»). ἀλλ᾽ ἢ ὀπτὰ πυρί — ただ火で焼いたもの (ἀλλ᾽ ἤ — «кроме как»). κεφαλὴν σὺν τοῖς ποσὶν καὶ τοῖς ἐνδοσθίοις — 頭も足も内臓もともに (ἐνδόσθια — «внутренности»)."
  10: "οὐκ ἀπολείψετε — 残してはならない (ἀπολείπω). ὀστοῦν οὐ συντρίψετε — 骨を一本も折ってはならない (συντρίβω — «сокрушать»; ср. Ин 19:36). ἐν πυρὶ κατακαύσετε — 火で焼き尽くす (κατακαίω)."
  11: "αἱ ὀσφύες περιεζωσμέναι — 腰に帯を締め (ὀσφύς — «чресла», περιζώννυμι — «опоясывать»). ὑποδήματα — 履き物. βακτηρίαι — 杖 (βακτηρία). μετὰ σπουδῆς — 急いで (σπουδή — «поспешность»). πασχα ἐστὶν κυρίῳ — 主の過越である (πάσχα; сноска)."
  12: "διελεύσομαι — 巡り (διέρχομαι — «проходить»). πατάξω — 打つ (πατάσσω). ἀπὸ ἀνθρώπου ἕως κτήνους — 人から家畜に至るまで. ποιήσω τὴν ἐκδίκησιν — 裁きを行う (ἐκδίκησις — «мщение, суд»; слав. «сотворю отмщение»). ἐγὼ κύριος — わたしは主である."
  13: "τὸ αἷμα ὑμῖν ἐν σημείῳ — 血はあなたがたへのしるし (не «для Меня», а «для вас»). σκεπάσω ὑμᾶς — あなたがたを覆い守る (σκεπάζω — «покрывать, защищать»). πληγὴ τοῦ ἐκτριβῆναι — 滅ぼす災い (ἐκτρίβω — «истреблять»). ὅταν παίω — 打つとき (παίω — «ударять»)."
  14: "μνημόσυνον — 記念 (μνημόσυνον). ἑορτάσετε αὐτὴν ἑορτὴν κυρίῳ — 主の祭りとして祝いなさい (ἑορτάζω — «праздновать»; винительный внутреннего объекта). νόμιμον αἰώνιον — 永遠の定め (νόμιμος — «установленный законом»)."
  15: "ἑπτὰ ἡμέρας ἄζυμα — 七日の間、種なしパンを. ἀφανιεῖτε ζύμην — パン種を除き去りなさい (ἀφανίζω — «уничтожать»; ζύμη — «закваска»). ἐξολεθρευθήσεται ἡ ψυχὴ ἐκείνη — その魂は断たれる (ἐξολεθρεύω — «истреблять»)."
  16: "κλητὴ ἁγία — 聖なる集い (букв. «созванное святое»; евр. מִקְרָא־קֹדֶשׁ — «священное собрание»; слав. «нарочит свят»). ἔργον λατρευτόν — 仕事 (λατρευτός — «служебный, рабский»). ὃσα ποιηθήσεται πάσῃ ψυχῇ — すべての魂のためにしなければならないこと (т. е. приготовление пищи)."
  17: "φυλάξεσθε τὴν ἐντολὴν ταύτην — この戒めを守りなさい (ἐντολή — «заповедь»). ἐξάξω τὴν δύναμιν ὑμῶν — あなたがたの軍勢を導き出す (δύναμις — «сила, войско»; слав. «силу вашу»; ср. 12:41). νόμιμον αἰώνιον — 永遠の定め."
  18: "ἐναρχομένου τῇ τεσσαρεσκαιδεκάτῃ — 十四日の夕べから (ἐνάρχομαι — «начинать»; датив времени). ἕως ἡμέρας μιᾶς καὶ εἰκάδος — 二十一日まで (εἰκάς — «двадцатое число»). ἀφ᾽ ἑσπέρας ἕως ἑσπέρας — 夕べから夕べまで."
  19: "ζύμη οὐχ εὑρεθήσεται — パン種が見つかってはならない. ζυμωτόν — 種を入れたもの (ζυμόω — «квасить»). ἐκ συναγωγῆς Ισραηλ — イスラエルの会衆から. ἔν τε τοῖς γειώραις καὶ αὐτόχθοσιν — 寄留者であれ、生まれの者であれ (γειώρας — «пришлец»; αὐτόχθων — «туземец»)."
  20: "πᾶν ζυμωτὸν οὐκ ἔδεσθε — 種を入れたものは一切食べてはならない. ἐν παντὶ κατοικητηρίῳ — すべての住む所で (κατοικητήριον — «жилище»)."
  21: "γερουσία — 長老たち (γερουσία — «совет старейшин»). θύσατε τὸ πασχα — 過越の犠牲を屠りなさい (θύω — «приносить в жертву, закалать»). κατὰ συγγενείας — 家族ごとに (συγγένεια — «родство»)."
  22: "δεσμὴν ὑσσώπου — ヒソプの束 (ὕσσωπος — «иссоп»; растение для окропления). βάψαντες — 浸して (βάπτω — «погружать»). καθίξετε τῆς φλιᾶς — 鴨居に塗りなさい (в LXX глагол стоит в форме, которую слав. передаёт «помажите»). τὴν θύραν τοῦ οἴκου — 家の戸口."
  23: "παρελεύσεται κύριος — 主は通り過ぎられる (παρέρχομαι; отсюда имя праздника — 過越). τὸν ὀλεθρεύοντα — 滅ぼす者 (ὀλεθρεύω — «губить»; ангел-губитель). οὐκ ἀφήσει εἰσελθεῖν — 入ることを許されない (ἀφίημι — «попускать»)."
  24: "τὸ ῥῆμα τοῦτο — この言葉 (ῥῆμα — «слово, дело»). νόμιμον σεαυτῷ — 自分への定め. ἕως αἰῶνος — 永遠に."
  25: "καθότι ἐλάλησεν — 言われたとおりに (καθότι — «как»). τὴν λατρείαν ταύτην — この務め (λατρεία — «служение»; ср. 12:26)."
  26: "Τίς ἡ λατρεία αὕτη; — この務めは何か (вопрос детей; прямая речь в 『…』)."
  27: "Θυσία τὸ πασχα τοῦτο κυρίῳ — これは主への過越の犠牲である (θυσία — «жертва»). ὡς ἐσκέπασεν τοὺς οἴκους — 家を覆い守られた (σκεπάζω; ср. 12:13). τοὺς δὲ οἴκους ἡμῶν ἐρρύσατο — わたしたちの家をお救いになった (ῥύομαι — «избавлять»). κύψας ὁ λαὸς προσεκύνησεν — 民は身をかがめて礼拝した (κύπτω — «наклоняться»)."
  28: "καθὰ ἐνετείλατο κύριος — 主が命じられたとおりに (ἐντέλλομαι). οὕτως ἐποίησαν — そのとおりに行った (повтор, как в LXX и слав.)."
  29: "μεσούσης τῆς νυκτός — 夜の半ば (μεσόω — «быть в середине»). τῆς αἰχμαλωτίδος τῆς ἐν τῷ λάκκῳ — 穴倉にいる捕虜の女 (αἰχμαλωτίς — «пленница»; λάκκος — «яма, темница»; слав. «в рове»). ἕως πρωτοτόκου παντὸς κτήνους — 家畜の初子もすべて."
  30: "ἀναστὰς Φαραω νυκτός — ファラオは夜に起き (ἀνίστημι). κραυγὴ μεγάλη — 大きな叫び. οὐ γὰρ ἦν οἰκία, ἐν ᾗ οὐκ ἦν τεθνηκώς — 死んだ者のいない家は一つもなかった (двойное отрицание сохранено)."
  31: "ἐκάλεσεν Φαραω Μωυσῆν καὶ Ααρων νυκτός — 夜のうちに…呼んで. Ἀνάστητε καὶ ἐξέλθατε — 立って、出て行け. λατρεύσατε κυρίῳ τῷ θεῷ ὑμῶν — あなたがたの神であられる主に仕えなさい (λατρεύω — «служить»)."
  32: "τὰ πρόβατα καὶ τοὺς βόας — 羊も牛も (βοῦς — «крупный скот»). ἀναλαβόντες πορεύεσθε — 連れて行け. εὐλογήσατε δὲ κἀμέ — わたしをも祝福してくれ (καί + ἐμέ; неожиданная просьба фараона)."
  33: "κατεβιάζοντο — せき立てて (καταβιάζομαι — «принуждать»; ср. Быт 19:3). σπουδῇ ἐκβαλεῖν — 急いで追い出そうと. Πάντες ἡμεῖς ἀποθνῄσκομεν — わたしたちはみな死んでしまう (прямая речь без вводящего глагола — так в LXX)."
  34: "τὸ σταῖς — 練り粉 (σταῖς — «тесто»). πρὸ τοῦ ζυμωθῆναι — まだふくらまないうちに (ζυμόω). τὰ φυράματα — 練り粉 (φύραμα — «замес»; в японском оба слова сведены к 練り粉/それ). ἐνδεδεμένα ἐν τοῖς ἱματίοις — 衣に包んで (ἐνδέω — «завязывать в»). ἐπὶ τῶν ὤμων — 肩に."
  35: "καθὰ συνέταξεν αὐτοῖς Μωϋσῆς — モーセが命じたとおりに (συντάσσω). ᾔτησαν — 求めた (αἰτέω). σκεύη ἀργυρᾶ καὶ χρυσᾶ — 銀の器と金の器 (ср. 11:2)."
  36: "ἔδωκεν τὴν χάριν — 恵みを与えられた (ср. 11:3). ἔχρησαν αὐτοῖς — 貸し与えた (κίχρημι). ἐσκύλευσαν τοὺς Αἰγυπτίους — エジプト人を奪い尽くした (σκυλεύω — «снимать добычу»)."
  37: "Ἀπάραντες ἐκ Ραμεσση εἰς Σοκχωθα — ラメセスを出てスコトへ (ἀπαίρω — «сниматься со стоянки»). ἑξακοσίας χιλιάδας πεζῶν — 徒歩の男たち六十万 (πεζός — «пеший»). πλὴν τῆς ἀποσκευῆς — 荷を負う者のほかに (ἀποσκευή — «обоз, домашние»)."
  38: "ἐπίμικτος πολὺς — 多くの混じり合った民 (ἐπίμικτος — «смешанный сброд»). συνανέβη — ともに上って行った (συναναβαίνω). κτήνη πολλὰ σφόδρα — 家畜も非常に多く."
  39: "ἔπεψαν τὸ σταῖς — 練り粉を焼いて (πέσσω — «печь»). ἐγκρυφίας ἀζύμους — 種なしのパン (ἐγκρυφίας — «лепёшка, печённая в золе/углях»). οὐ γὰρ ἐζυμώθη — ふくれていなかった. ἐπισιτισμὸν ἐποίησαν — 食べ物を用意した (ἐπισιτισμός — «съестные припасы»)."
  40: "ἡ κατοίκησις — 住んだ期間 (κατοίκησις — «обитание»). ἐν γῇ Αἰγύπτῳ καὶ ἐν γῇ Χανααν — エジプトの地とカナンの地に (LXX включает Ханаан; масоретский текст и Синодальный — только Египет; слав. «и в земли ханаани»). ἔτη τετρακόσια τριάκοντα — 四百三十年."
  41: "μετὰ τὰ τετρακόσια τριάκοντα ἔτη — 四百三十年の後. πᾶσα ἡ δύναμις κυρίου — 主の軍勢はすべて (δύναμις — «войско, воинство»; слав. «вся сила Господня»; ср. 12:17; масоретский текст — «ополчения»). В LXX нет слов «в этот день» и «ночью» (слав. прибавляет «в нощи»)."
  42: "νυκτὸς προφυλακή ἐστιν τῷ κυρίῳ — 主への見張りの夜 (προφυλακή — «стража, бдение»). ἐξαγαγεῖν αὐτοὺς — 彼らを導き出すため. εἰς γενεὰς αὐτῶν — 代々にわたって."
  43: "Οὗτος ὁ νόμος τοῦ πασχα — 過越の法はこうである (νόμος — «устав, закон»). ἀλλογενής — 外国の者 (ἀλλογενής — «иноплеменник»)."
  44: "οἰκέτην — 奴隷 (οἰκέτης — «домочадец-раб»). ἀργυρώνητον — 銀で買い取った者 (ἀργυρώνητος). περιτεμεῖς αὐτόν — 割礼を施しなさい (περιτέμνω). τότε φάγεται — そうすれば食べることができる."
  45: "πάροικος — 寄留者 (πάροικος — «временный житель»). μισθωτός — 雇われた者 (μισθωτός — «наёмник»)."
  46: "ἐν οἰκίᾳ μιᾷ βρωθήσεται — 一つの家で食べなければならない (пассив). οὐκ ἐξοίσετε … ἔξω — 外へ持ち出してはならない. ὀστοῦν οὐ συντρίψετε — 骨を一本も折ってはならない (ср. 12:10; Ин 19:36)."
  47: "πᾶσα συναγωγὴ υἱῶν Ισραηλ — イスラエルの子らの会衆はすべて. ποιήσει αὐτό — これを行わなければならない (ποιέω — «совершать» о Пасхе)."
  48: "προσήλυτος — 寄留者 (προσήλυτος — «пришелец, прозелит»). περιτεμεῖς αὐτοῦ πᾶν ἀρσενικόν — その男はみな割礼を受けさせなさい. ὥσπερ καὶ ὁ αὐτόχθων — その地の生まれの者と同じように. ἀπερίτμητος — 割礼を受けていない者."
  49: "νόμος εἷς — 同じ一つの法. τῷ ἐγχωρίῳ — この地の生まれの者 (ἐγχώριος). τῷ προσελθόντι προσηλύτῳ — 来て寄留した者."
  50: "καθὰ ἐνετείλατο κύριος … πρὸς αὐτούς — 主が…彼らに命じられたとおりに. οὕτως ἐποίησαν — そのとおりに行った (повтор, как в 12:28)."
  51: "ἐν τῇ ἡμέρᾳ ἐκείνῃ — その日. ἐξήγαγεν κύριος — 主は導き出された. σὺν δυνάμει αὐτῶν — その軍勢とともに (δύναμις — «войско»; Синодальный — «по ополчениям их»)."
