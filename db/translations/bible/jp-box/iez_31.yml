verses:
  1: "第十一年[だいじゅういちねん]、第三[だいさん]の月[つき]の一日[ついたち]に、主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  2: "「人[ひと]の子[こ]よ、エジプトの王[おう]ファラオとその多[おお]くの民[たみ]に言[い]え。あなたはその高[たか]さにおいて、自分[じぶん]をだれに似[に]た者[もの]としたのか。"
  3: "見[み]よ、アッスルはレバノンの糸杉[いとすぎ]であり、その枝[えだ]において美[うつく]しく、その大[おお]きさにおいて高[たか]かった。その支[し]配[はい]は雲[くも]のただ中[なか]にあった。"
  4: "水[みず]がこれを育[そだ]て、深[ふか]みがこれを高[たか]くした。深[ふか]みはその川[かわ]々[がわ]をその植[う]え物[もの]の周[まわ]りに巡[めぐ]らせ、その流[なが]れを野[の]のすべての木[き]に送[おく]り出[だ]した。"
  5: "それゆえ、その大[おお]きさは野[の]のすべての木[き]よりも高[たか]くなり、その枝[えだ]は多[おお]くの水[みず]によって広[ひろ]がった。"
  6: "その枝[えだ]々[びと]に天[てん]のすべての鳥[とり]が巣[す]を作[つく]り、その枝[えだ]の下[した]で野[の]のすべての獣[けもの]が子[こ]を産[う]んだ。その陰[かげ]にはすべての国[くに]々[ぐに]の多[おお]くの民[たみ]が住[す]んだ。"
  7: "それはその高[たか]さにおいて美[うつく]しかった。その枝[えだ]の多[おお]さのゆえである。その根[ね]が多[おお]くの水[みず]の中[なか]にあったからである。"
  8: "神[かみ]の楽園[らくえん]にも、このような糸杉[いとすぎ]はなかった。松[まつ]もその枝[えだ]々[びと]に似[に]てはいなかった。樅[もみ]もその枝[えだ]に似[に]てはいなかった。神[かみ]の楽園[らくえん]のどの木[き]も、その美[うつく]しさにおいてこれに似[に]た者[もの]はなかった。"
  9: "わたしはその枝[えだ]の多[おお]さによってこれを美[うつく]しくした。神[かみ]の楽園[らくえん]の喜[よろこ]びの木[き]々[ぎ]は、これを妬[ねた]んだ。"
  10: "それゆえ、主[しゅ]である神[かみ]はこう言[い]われる。あなたはその大[おお]きさにおいて大[おお]きくなり、その支[し]配[はい]を雲[くも]のただ中[なか]に置[お]いた。そして、その高[たか]さのうちでその心[こころ]が高[たか]ぶり、わたしはそれが高[たか]くされるのを見[み]た。"
  11: "わたしはこれを国[くに]々[ぐに]の君[きみ]の手[て]に渡[わた]した。彼はその不法[ふほう]に従[したが]って、これに滅[ほろ]びをもたらした。"
  12: "異邦[いほう]の滅[ほろ]ぼす者[もの]たちがこれを根[ね]こそぎにし、これを山[やま]々[やま]に投[な]げ倒[たお]した。その枝[えだ]はすべての谷[たに]に落[お]ち、その幹[みき]は地[ち]のすべての平[ひら]地[ち]で砕[くだ]かれた。その陰[かげ]からすべての国[くに]々[ぐに]の民[たみ]が下[お]りて、これを地[ち]に伏[ふ]せた。"
  13: "その倒[たお]れる上[うえ]に、天[てん]のすべての鳥[とり]が休[やす]み、その幹[みき]の上[うえ]に、野[の]のすべての獣[けもの]が来[き]た。"
  14: "これは、水[みず]のほとりのすべての木[き]がその大[おお]きさによって高[たか]くならず、その支[し]配[はい]を雲[くも]のただ中[なか]に置[お]かず、水[みず]を飲[の]む者[もの]がだれも、その高[たか]さにおいてこれらに並[なら]び立[た]たないためである。彼らはみな死[し]に渡[わた]され、地[ち]の深[ふか]みへ、人[ひと]の子[こ]らの中[なか]で穴[あな]に下[くだ]る者[もの]たちのもとへ行[ゆ]く。"
  15: "主[しゅ]である神[かみ]はこう言[い]われる。それが陰府[よみ]に下[くだ]った日[ひ]、深[ふか]みはこれを悲[かな]しんだ。わたしはその川[かわ]をせき止[と]め、多[おお]い水[みず]を閉[と]ざした。レバノンはこれについて暗[くら]くなり、野[の]のすべての木[き]はこれについて力[ちから]を失[うしな]った。"
  16: "その倒[たお]れる声[こえ]によって、国[くに]々[ぐに]は震[ふる]えた。わたしがこれを、穴[あな]に下[くだ]る者[もの]たちとともに陰府[よみ]に下[くだ]らせたときである。地[ち]の最[もっと]も低[ひく]い所[ところ]では、すべての喜[よろこ]びの木[き]、レバノンの選[えら]ばれた木[き]々[ぎ]、水[みず]を飲[の]む者[もの]たちがみな、これを慰[なぐさ]めた。"
  17: "彼らもまた、剣[つるぎ]で傷[きず]ついた者[もの]たちとともに、これとともに陰府[よみ]に下[くだ]った。その子孫[しそん]、その陰[かげ]の下[した]に住[す]む者[もの]たちは、その命[いのち]のただ中[なか]で滅[ほろ]びた。"
  18: "あなたは力[ちから]と栄光[えいこう]と大[おお]きさにおいて、喜[よろこ]びの木[き]々[ぎ]のうちでだれに似[に]ているのか。下[くだ]り、喜[よろこ]びの木[き]々[ぎ]とともに地[ち]の深[ふか]みへ下[くだ]って行[ゆ]け。あなたは無割礼[むかつれい]の者[もの]たちのただ中[なか]で、剣[つるぎ]で傷[きず]ついた者[もの]たちとともに眠[ねむ]る。ファラオとその力[ちから]のすべての群[ぐん]衆[しゅう]もそうである、と主[しゅ]である神[かみ]は言[い]われる」。"

notes:
  1: "Καὶ ἐγένετο ἐν τῷ ἑνδεκάτῳ ἔτει ἐν τῷ τρίτῳ μηνὶ μιᾷ τοῦ μηνός — «и было в одиннадцатый год, в третий месяц, в первый день месяца»: дата с точностью до дня (ср. 26:1; 30:20; 32:1, 17). ἐγένετο λόγος κυρίου πρός με λέγων — «было слово Господне ко мне, говоря»: формула вне кавычек. Слав. «во единонадесятое лето, в третий месяц, во един день месяца»; ru — то же."
  2: "Υἱὲ ἀνθρώπου — «сын человеческий» (人[ひと]の子[こ], по брифу). εἰπὸν πρὸς Φαραω βασιλέα Αἰγύπτου καὶ τῷ πλήθει αὐτοῦ — «скажи фараону, царю Египетскому, и множеству его» (πλῆθος — множество, 多[おお]くの民[たみ]). Τίνι ὡμοίωσας σεαυτὸν ἐν τῷ ὕψει σου — «кому уподобил ты себя в высоте твоей»: вопрос к фараону; с него начинается слово Господа, идущее до конца главы."
  3: "ἰδοὺ Ασσουρ κυπάρισσος ἐν τῷ Λιβάνῳ — «вот, Ассур — кипарис на Ливане»: в LXX и слав. («ассур кипарис в ливане») кипарис, в МТ и Синодальном — кедр; держим LXX/csl (糸杉[いとすぎ]). καλὸς ταῖς παραφυάσιν καὶ ὑψηλὸς τῷ μεγέθει — «красив ветвями и высок величием» (παραφυάς — отпрыск, ветвь, 枝[えだ]). εἰς μέσον νεφελῶν ἐγένετο ἡ ἀρχὴ αὐτοῦ — «в среду облаков стала власть (вершина) его»: ἀρχή здесь — власть/вершина, слав. «власть его», в МТ «вершина»; передано 支[し]配[はい]."
  4: "ὕδωρ ἐξέθρεψεν αὐτόν — «вода вскормила его» (ἐκτρέφω — воспитывать, питать); ἡ ἄβυσσος ὕψωσεν αὐτόν — «бездна вознесла его» (ἄβυσσος — 深[ふか]み); τοὺς ποταμοὺς αὐτῆς ἤγαγεν κύκλῳ τῶν φυτῶν αὐτοῦ — «реки её провела вокруг растений его» (φυτόν — 植[う]え物[もの]); τὰ συστήματα αὐτῆς ἐξαπέστειλεν — «составы (потоки) её послала» (σύστημα — стечение, поток), слав. «составы своя испусти»."
  5: "ἕνεκεν τούτου ὑψώθη τὸ μέγεθος αὐτοῦ παρὰ πάντα τὰ ξύλα τοῦ πεδίου — «потому вознеслось величие его выше всех дерев полевых»; ἐπλατύνθησαν οἱ κλάδοι αὐτοῦ ἀφ' ὕδατος πολλοῦ — «расширились ветви его от воды многой». Слав. добавляет «и вознесошася отрасли его… егда протяжеся» — дублет, в текст не внесён."
  6: "ἐν ταῖς παραφυάσιν αὐτοῦ ἐνόσσευσαν πάντα τὰ πετεινὰ τοῦ οὐρανοῦ — «в ветвях его свили гнёзда все птицы небесные» (νοσσεύω — вить гнездо); ὑποκάτω τῶν κλάδων αὐτοῦ ἐγεννῶσαν πάντα τὰ θηρία τοῦ πεδίου — «под ветвями его рождали все звери полевые»; ἐν τῇ σκιᾷ αὐτοῦ κατῴκησεν πᾶν πλῆθος ἐθνῶν — «в тени его поселилось всякое множество народов»: образ мирового древа, ср. Дан 4:9–12."
  7: "καὶ ἐγένετο καλὸς ἐν τῷ ὕψει αὐτοῦ — «и стал красив в высоте своей»; διὰ τὸ πλῆθος τῶν κλάδων αὐτοῦ — «за множество ветвей его»; ὅτι ἐγενήθησαν αἱ ῥίζαι αὐτοῦ εἰς ὕδωρ πολύ — «ибо корни его были при водах многих» (слав. «яко беша корение его в воде мнозе»)."
  8: "κυπάρισσοι τοιαῦται οὐκ ἐγενήθησαν ἐν τῷ παραδείσῳ τοῦ θεοῦ — «такие кипарисы не рождались в раю Божием» (παράδεισος — 楽園[らくえん]); πίτυες — «сосны» (松[まつ]), ἐλάται — «ели» (樅[もみ]); πᾶν ξύλον… οὐχ ὡμοιώθη αὐτῷ ἐν τῷ κάλλει αὐτοῦ — «ни одно дерево… не уподобилось ему в красоте его». В МТ/ru иные породы (кедры, каштаны) — держим LXX/csl. Слав. в конце добавляет «множества ради ветвий его» — дублет из 9-го."
  9: "διὰ τὸ πλῆθος τῶν κλάδων αὐτοῦ — «за множество ветвей его»; ἐζήλωσεν αὐτὸν τὰ ξύλα τοῦ παραδείσου τῆς τρυφῆς τοῦ θεοῦ — «позавидовали ему деревья рая сладости Божией» (τρυφή — нега, сладость, 喜[よろこ]び). Слав. начинает «Добра сотворих его во множестве ветвий его» («Я сделал его прекрасным») — нет в LXX, внесено."
  10: "διὰ τοῦτο τάδε λέγει κύριος — «потому так говорит Господь»; Ἀνθ ὧν ἐγένου μέγας τῷ μεγέθει — «за то, что ты стал велик величием»; ἔδωκας τὴν ἀρχήν σου εἰς μέσον νεφελῶν — «дал власть твою в среду облаков»; καὶ εἶδον ἐν τῷ ὑψωθῆναι αὐτόν — «и увидел Я, когда он возвысился». Слав. добавляет «и вознесеся сердце его в высоте его» (гордость) — нет в LXX, внесено."
  11: "καὶ παρέδωκα αὐτὸν εἰς χεῖρας ἄρχοντος ἐθνῶν — «и предал его в руки князя народов» (ἄρχων — 君[きみ]); ἐποίησεν τὴν ἀπώλειαν αὐτοῦ — «он сделал погибель его». Слав. добавляет «по нечестию его» — нет в LXX, внесено (передано 不法[ふほう]に従って)."
  12: "ἀλλότριοι λοιμοὶ ἀπὸ ἐθνῶν — «чужие губители из народов» (λοιμός — губитель, язва); κατέβαλον αὐτὸν ἐπὶ τῶν ὀρέων — «повергли его на горах»; ἐν πάσαις ταῖς φάραγξιν ἔπεσαν οἱ κλάδοι αὐτοῦ — «во всех ущельях пали ветви его» (φάραγξ — 谷[たに]); συνετρίβη τὰ στελέχη αὐτοῦ — «сокрушились стволы его» (στέλεχος — 幹[みき]); ἠδάφισαν αὐτόν — «сравняли его с землёй» (ἔδαφος — основание)."
  13: "ἐπὶ τὴν πτῶσιν αὐτοῦ ἀνεπαύσαντο πάντα τὰ πετεινὰ τοῦ οὐρανοῦ — «на падение его почили все птицы небесные» (ἀναπαύομαι); ἐπὶ τὰ στελέχη αὐτοῦ ἐγένοντο πάντα τὰ θηρία τοῦ ἀγροῦ — «на стволах его были все звери полевые». Слав. «во падении его почиша… на стеблиех его быша»."
  14: "ὅπως μὴ ὑψωθῶσιν ἐν τῷ μεγέθει αὐτῶν πάντα τὰ ξύλα τὰ ἐν τῷ ὕδατι — «чтобы не возносились величием своим все деревья при воде»; οὐκ ἔδωκαν τὴν ἀρχὴν αὐτῶν εἰς μέσον νεφελῶν — «не дали власти своей в среду облаков»; οὐκ ἔστησαν ἐν τῷ ὕψει αὐτῶν πρὸς αὐτά — «не стали в высоте своей против них», т. е. наравне; πάντες ἐδόθησαν εἰς θάνατον εἰς γῆς βάθος — «все преданы смерти, в глубину земли»; πρὸς καταβαίνοντας εἰς βόθρον — «к сходящим в яму» (βόθρος)."
  15: "Ἐν ᾗ ἡμέρᾳ κατέβη εἰς ᾅδου — «в день, когда он сошёл в ад» (ᾅδης — 陰府[よみ]); ἐπένθησεν αὐτὸν ἡ ἄβυσσος — «оплакала его бездна»; ἐπέστησα τοὺς ποταμοὺς αὐτῆς καὶ ἐκώλυσα πλῆθος ὕδατος — «остановил реки её и удержал множество воды» (ἐφίστημι, κωλύω); ἐσκότασεν ἐπ' αὐτὸν ὁ Λίβανος — «омрачился о нём Ливан»; πάντα τὰ ξύλα τοῦ πεδίου ἐπ' αὐτῷ ἐξελύθησαν — «все деревья полевые о нём расслабли» (ἐκλύω — ослаблять), передано 力[ちから]を失[うしな]った."
  16: "ἀπὸ τῆς φωνῆς τῆς πτώσεως αὐτοῦ ἐσείσθησαν τὰ ἔθνη — «от голоса падения его потряслись народы»; μετὰ τῶν καταβαινόντων εἰς λάκκον — «с сходящими в ров» (λάκκος); παρεκάλουν αὐτὸν ἐν γῇ — «утешали его в земле»; τὰ ἐκλεκτὰ τοῦ Λιβάνου — «избранное Ливана». Слав. добавляет «в земли долнейшей» (в земле глубочайшей), передано 地[ち]の最[もっと]も低[ひく]い所[ところ]."
  17: "καὶ γὰρ αὐτοὶ κατέβησαν μετ' αὐτοῦ εἰς ᾅδου ἐν τοῖς τραυματίαις ἀπὸ μαχαίρας — «ибо и они сошли с ним в ад, к поражённым мечом» (τραυματίας — раненый, 傷[きず]ついた者[もの]); τὸ σπέρμα αὐτοῦ — «семя его» (子孫[しそん]); οἱ κατοικοῦντες ὑπὸ τὴν σκέπην αὐτοῦ — «живущие под покровом его»; ἐν μέσῳ τῆς ζωῆς αὐτῶν ἀπώλοντο — «среди жизни их погибли»."
  18: "τίνι ὡμοιώθης — «кому ты уподобился»: слав. добавляет «силою и славою и величеством» — нет в LXX, внесено. κατάβηθι καὶ καταβιβάσθητι — «сойди и низведён будь»: двойное повеление (下[くだ]り…下[くだ]って行[ゆ]け). ἐν μέσῳ ἀπεριτμήτων κοιμηθήσῃ — «среди необрезанных почиешь» (ἀπερίτμητος — 無割礼[むかつれい]); μετὰ τραυματιῶν μαχαίρας — «с поражёнными мечом». οὕτως Φαραω καὶ τὸ πλῆθος τῆς ἰσχύος αὐτοῦ — «так фараон и множество силы его»: здесь слово Господа закрывается."
