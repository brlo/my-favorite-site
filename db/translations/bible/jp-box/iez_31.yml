# jp-box, Иезекииль, глава 31. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 31 (совпадает).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: кедр и фараон. 1 дата (одиннадцатый год, третий месяц, первый день);
# 2 вопрос фараону и его множеству; 3–9 Ассур как мировое древо: кипарис Ливана,
# воды бездны, ветви и гнёзда, тень для народов, несравнимость с деревьями рая;
# 10–14 гордость и падение: предание князю народов, срубленное дерево на горах,
# ствол в долинах, «чтобы не возносились деревья при воде»; 15–17 сведение в ад:
# плач бездны, остановленные реки, омрачённый Ливан, утешение деревьями рая,
# сошедшие с ним; 18 итог: «кому ты уподобился» — фараон и всё множество силы его.
# Голоса: 1 — формула вне кавычек. 2–18 — одно непрерывное слово Господа в 「…»
# (обращение к фараону в 2 — внутри него, как в 27-й главе обращение к Тиру);
# формулы «так говорит Господь Бог» в 10 и 15 внутри речи. Вложенной речи нет.
# «Точка»: в этой главе нет.
# Имена и термины: アッスル (Ασσουρ), レバノン, ファラオ, エジプト; 糸杉[いとすぎ] —
# κυπάρισσοι (в МТ/ru «кедр»), 松[まつ] — πίτυες, 樅[もみ] — ἐλάται; 雲[くも]のただ中[なか] —
# εἰς μέσον νεφελῶν; 陰府[よみ] — ᾅδης; 深[ふか]み — ἄβυσσος; 無割礼[むかつれい] — ἀπερίτμητοι;
# 支[し]配[はい] — ἀρχή (власть/вершина) в 3, 10, 14 — единообразно.
