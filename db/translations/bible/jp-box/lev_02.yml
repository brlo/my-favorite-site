chapter: 2
draft: true

verses:
  1: "「もし人[ひと]が主[しゅ]に捧[ささ]げ物[もの]、すなわち素祭[そさい]⟨穀物[こくもつ]の粉[こな]を焼[や]いて献[ささ]げる、血[ち]を流[なが]さない供[そな]え物[もの]。⟩を献[ささ]げるなら、その捧[ささ]げ物[もの]は小麦粉[こむぎこ]でなければならない。その上[うえ]に油[あぶら]を注[そそ]ぎ、その上[うえ]に乳香[にゅうこう]を置[お]きなさい。これは犠牲[ぎせい]である。"
  2: "それをアロンの子[こ]らである祭司[さいし]たちのところへ持[も]って行[い]きなさい。祭司[さいし]は、その小麦粉[こむぎこ]を、油[あぶら]とその乳香[にゅうこう]のすべてとともに手[て]いっぱいに掴[つか]み取[と]り、その記念[きねん]の分[ぶん]を祭壇[さいだん]の上[うえ]に置[お]きなさい。これは主[しゅ]に芳[かんば]しい香[かおり]となる犠牲[ぎせい]である。"
  3: "その犠牲[ぎせい]の残[のこ]りは、アロンとその子[こ]らに帰[き]する。これは主[しゅ]への犠牲[ぎせい]のうちの最[もっと]も聖[せい]なるものである。"
  4: "もし炉[ろ]で焼[や]いたものを素祭[そさい]として献[ささ]げるなら、それは小麦粉[こむぎこ]から作[つく]る主[しゅ]への捧[ささ]げ物[もの]であり、油[あぶら]を混[ま]ぜた種[たね]なしのパンと、油[あぶら]を塗[ぬ]った種[たね]なしの薄焼[うすや]きパンである。"
  5: "もしあなたの捧[ささ]げ物[もの]が平[ひら]鍋[なべ]で焼[や]く素祭[そさい]であるなら、それは油[あぶら]を混[ま]ぜた小麦粉[こむぎこ]で、種[たね]なしでなければならない。"
  6: "それを細[こま]かく割[わ]り、その上[うえ]に油[あぶら]を注[そそ]ぎなさい。これは主[しゅ]への犠牲[ぎせい]である。"
  7: "もし鉄板[てっぱん]で焼[や]くものがあなたの捧[ささ]げ物[もの]であるなら、それは油[あぶら]を混[ま]ぜた小麦粉[こむぎこ]で作[つく]らなければならない。"
  8: "あなたはこれらのものから作[つく]る犠牲[ぎせい]を主[しゅ]に持[も]って来[き]て、祭司[さいし]のところへ持[も]って行[い]きなさい。祭司[さいし]が祭壇[さいだん]に近[ちか]づくと、"
  9: "その犠牲[ぎせい]からその記念[きねん]の分[ぶん]を取[と]り、祭壇[さいだん]の上[うえ]に置[お]きなさい。これは主[しゅ]に芳[かんば]しい香[かおり]となる焼[や]き尽[つ]くす捧[ささ]げ物[もの]である。"
  10: "その犠牲[ぎせい]の残[のこ]りは、アロンとその子[こ]らに帰[き]する。これは主[しゅ]の焼[や]き尽[つ]くす捧[ささ]げ物[もの]のうちの最[もっと]も聖[せい]なるものである。"
  11: "主[しゅ]に献[ささ]げるすべての犠牲[ぎせい]は、パン種[ぱんだね]を入[い]れて作[つく]ってはならない。パン種[ぱんだね]も蜜[みつ]も、そのうちのどれも主[しゅ]に焼[や]いて献[ささ]げてはならないからである。"
  12: "それらは初穂[はつほ]の捧[ささ]げ物[もの]として主[しゅ]に献[ささ]げなさい。ただし、主[しゅ]に芳[かんば]しい香[かおり]とするために、祭壇[さいだん]の上[うえ]へ上[のぼ]らせてはならない。"
  13: "あなたの犠牲[ぎせい]のすべての捧[ささ]げ物[もの]には、塩[しお]で味[あじ]を付[つ]けなさい。あなたの犠牲[ぎせい]から、あなたの神[かみ]の契約[けいやく]の塩[しお]を絶[た]やしてはならない。あなたのすべての捧[ささ]げ物[もの]には、あなたの神[かみ]であられる主[しゅ]に塩[しお]を添[そえ]えて献[ささ]げなさい。"
  14: "もし初穂[はつほ]の素祭[そさい]を主[しゅ]に献[ささ]げるなら、火[ひ]で炒[い]った新[あたら]しい穀粒[こくつぶ]を砕[くだ]いたものを、主[しゅ]への初穂[はつほ]の素祭[そさい]として献[ささ]げなさい。"
  15: "その上[うえ]に油[あぶら]を注[そそ]ぎ、その上[うえ]に乳香[にゅうこう]を置[お]きなさい。これは犠牲[ぎせい]である。"
  16: "祭司[さいし]は、その砕[くだ]いた穀粒[こくつぶ]と油[あぶら]、およびその乳香[にゅうこう]のすべてから、その記念[きねん]の分[ぶん]を焼[や]いて献[ささ]げなさい。これは主[しゅ]への焼[や]き尽[つ]くす捧[ささ]げ物[もの]である。」"

notes:
  1: "ψυχή — «душа», здесь в значении «человек, кто-либо» (слав. «душа»). δῶρον θυσίαν — «дар, жертву» (два слова при одном глаголе; θυσία здесь ещё не технический термин, а «жертва-приношение»). σεμίδαλις — пшеничная мука тонкого помола (小麦粉). ἐπιχεεῖ — возольёт (ἐπιχέω); ἐπιθήσει — положит (ἐπιτίθημι). λίβανος — ладан, ливан (乳香). θυσία ἐστίν — «это жертва»."
  2: "οἴσει — принесёт (φέρω). δραξάμενος … πλήρη τὴν δράκα — «взяв полную горсть» (δράξ — горсть). μνημόσυνον — «память», часть, сожигаемая как «воспоминание» пред Богом (記念の分). ὀσμὴ εὐωδίας — «благоухание» (слав. «воня благоухания»)."
  3: "τὸ λοιπόν — остаток. ἅγιον τῶν ἁγίων — «святое святых», то есть самая священная часть (最も聖なるもの); слав. «святое святых». ἀπὸ τῶν θυσιῶν κυρίου — «из жертв Господних»."
  4: "πεπεμμένην ἐν κλιβάνῳ — испечённое в печи (κλίβανος — печь). πεφυραμένους ἐν ἐλαίῳ — смешанные с елеем (φυράω — месить). λάγανα — тонкие лепёшки (薄焼き). διακεχρισμένα — помазанные (διαχρίω)."
  5: "τήγανον — сковорода, противень (平鍋); слав. «сковрада». πεφυραμένη — смешанная. ἄζυμα ἔσται — «пресным да будет» (ср. ст. 4)."
  6: "διαθρύψεις … κλάσματα — «разломишь на куски» (διαθρύπτω, κλάσμα). ἐπιχεεῖς — возольёшь."
  7: "ἐσχάρα — очаг, жаровня, железная плита (鉄板); слав. «огнище». ποιηθήσεται — «да будет сделано» (из муки с елеем)."
  8: "Стих обрывается на деепричастии προσεγγίσας πρὸς τὸ θυσιαστήριον — «приступив к жертвеннику»; продолжение в ст. 9 (в слав. и Синодальном деление то же)."
  9: "ἀφελεῖ — отделит, возьмёт (ἀφαιρέω). κάρπωμα — «сожигаемое» (焼き尽くす捧げ物). ὀσμὴ εὐωδίας κυρίῳ — ср. ст. 2."
  10: "καταλειφθέν — оставшееся (καταλείπω). ἅγια τῶν ἁγίων — мн. ч. (ср. ст. 3); ἀπὸ τῶν καρπωμάτων — «из сожигаемых»."
  11: "ζυμωτόν — квасное (ζυμόω). ζύμη — закваска (パン種). μέλι — мёд (蜜). καρπῶσαι — «сожечь» (καρπόω); слав. «еже приносити Господу дар»."
  12: "ἀπαρχή — начаток, первый плод (初穂). ἀναβιβασθήσεται — «будет вознесено» (ἀναβιβάζω). εἰς ὀσμὴν εὐωδίας — «в благоухание»."
  13: "ἁλὶ ἁλισθήσεται — «солью осолится» (ἁλίζω). ἅλα διαθήκης — «соль завета» (соль как знак союза; ср. Числ 18:19). διαπαύσετε — «прекратите, оставите» (διαπαύω). θυσίασμα — жертвенное (θυσίασμα)."
  14: "πρωτογενήματα — первые плоды, первенцы урожая. νέα πεφρυγμένα χίδρα — «новые, высушенные на огне зёрна» (χίδρον — крупа, зерно; φρύγω — жарить, сушить). ἐρικτά — «раздробленные» (ἐρείκω); слав. «истлачены». Стих обрывается, продолжение в ст. 15."
  15: "ἐπιχεεῖς … ἐπιθήσεις — возольёшь … положишь (ср. ст. 1). θυσία ἐστίν — «это жертва»."
  16: "ἀνοίσει — вознесёт (ἀναφέρω). μνημόσυνον — ср. ст. 2. ἀπὸ τῶν χίδρων — «из зёрен». κάρπωμά ἐστιν κυρίῳ — «это сожигаемое Господу»."
