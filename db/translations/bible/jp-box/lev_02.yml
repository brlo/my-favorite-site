# jp-box, Левит, глава 2. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в Левите отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 2: закон хлебного дара — 素祭 (1–3), его виды: печь, сковорода, плита (4–10),
# запрет закваски и мёда, соль завета (11–13), дар первых плодов (14–16).
# Речь Бога — 「…」 (1–16), красного нет.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (текст полный, проверено по выгрузке).
# Сноска ⟨…⟩ одна: 素祭 (2:1) — первое упоминание в корпусе.
# Стих 8 обрывается по греческому (продолжение в 9), поэтому кончается на 「…、」;
# ст. 14 по-гречески тоже переходит в 15, но клауза в нём закончена — 「…。」.
# jp-ni не использовался.

tr_code: jp-box
