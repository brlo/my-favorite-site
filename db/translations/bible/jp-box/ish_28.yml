verses:
  1: "「あなたは、あなたの兄弟[きょうだい]アロンとその子[こ]らを、イスラエルの子[こ]らの間[あいだ]からあなたのそばに近[ちか]づけ、わたしに祭司[さいし]として仕[つか]えさせよ。アロン、ナダブ、アビウ、エルアザル、イタマル、すなわちアロンの子[こ]らである。"
  2: "あなたはあなたの兄弟[きょうだい]アロンのために、聖[せい]なる衣服[いふく]を、栄光[えいこう]と美[うつく]しさのために造[つく]れ。"
  3: "あなたは心[こころ]の賢[かしこ]いすべての人[ひと]々[びと]に語[かた]れ。わたしは彼[かれ]らを分別[ふんべつ]の霊[れい]で満[み]たした。彼[かれ]らはあなたの兄弟[きょうだい]アロンの聖[せい]なる衣服[いふく]を造[つく]り、彼[かれ]が聖所[せいしょ]でわたしに祭司[さいし]として仕[つか]えるようにする。"
  4: "これがその衣服[いふく]である。胸当[むねあて]、エフォド、足[あし]まで届[とど]く衣[ころも]、房[ふさ]飾[かざ]りの衣[ころも]、頭[あたま]の被[かぶ]り物[もの]、帯[おび]。彼[かれ]らはアロンとその子[こ]らのために聖[せい]なる衣服[いふく]を造[つく]り、わたしに祭司[さいし]として仕[つか]えさせる。"
  5: "彼[かれ]らは金[きん]と青[あお]と紫[むらさき]と緋[ひ]の糸と亜麻布[あまぬの]を取[と]る。」"
  6: "「彼[かれ]らはエフォドを造[つく]る。撚[よ]った亜麻布[あまぬの]で、刺繍[ししゅう]師[し]の織[お]り物[もの]として。"
  7: "エフォドには、その両端[りょうたん]で互[たが]いにつなぐ二[ふた]つの肩帯[かたおび]がある。"
  8: "その上[うえ]にあるエフォドの織[お]り物[もの]は、エフォドと同[おな]じ造[つく]りで、金[きん]、青[あお]、紫[むらさき]、撚[よ]った緋[ひ]の糸、撚[よ]った亜麻布[あまぬの]で造[つく]る。"
  9: "あなたは二[ふた]つの石[いし]、エメラルドの石[いし]を取[と]り、その上[うえ]にイスラエルの子[こ]らの名[な]を刻[きざ]め。"
  10: "一[ひと]つの石[いし]に六[むっ]つの名[な]を、もう一[ひと]つの石[いし]に残[のこ]りの六[むっ]つの名[な]を、その生[う]まれの順[じゅん]に刻[きざ]め。"
  11: "石[いし]を彫[ほ]る職人[しょくにん]の技[わざ]で、印[いん]を彫[ほ]るように、イスラエルの子[こ]らの名[な]を二[ふた]つの石[いし]に刻[きざ]み込[こ]め。"
  12: "あなたはその二[ふた]つの石[いし]をエフォドの肩[かた]に置[お]け。それらはイスラエルの子[こ]らのための記念[きねん]の石[いし]である。アロンはその二[ふた]つの肩[かた]にイスラエルの子[こ]らの名[な]を負[お]い、彼[かれ]らの記念[きねん]として主[しゅ]の前[まえ]にある。"
  13: "あなたは純[じゅん]な金[きん]で枠[わく]を造[つく]れ。"
  14: "あなたは純[じゅん]な金[きん]で二[ふた]つの編[あ]み紐[ひも]を造[つく]れ。花[はな]の形[かたち]に組[く]み合[あ]わせた、編[あ]み細工[ざいく]である。あなたはその編[あ]んだ紐[ひも]を枠[わく]に、肩[かた]の部分[ぶぶん]の前[まえ]側[がわ]に取[つ]けよ。」"
  15: "「あなたは裁[さば]きの胸当[むねあて]を造[つく]れ。刺繍[ししゅう]師[し]の技[わざ]による。エフォドの形[かたち]に倣[なら]って造[つく]れ。金[きん]、青[あお]、紫[むらさき]、撚[よ]った緋[ひ]の糸、撚[よ]った亜麻布[あまぬの]で造[つく]れ。"
  16: "四角[しかく]で、二重[にじゅう]にする。長[なが]さも幅[はば]も一[いっ]スパン⟨親指[おやゆび]の先[さき]から小指[こゆび]の先[さき]まで広[ひろ]げた長[なが]さ。約[やく]二十二[にじゅうに]センチ。⟩とする。"
  17: "あなたはその中[なか]に四[よん]列[れつ]の石[いし]を組[く]み込[こ]め。第一[だいいち]の列[れつ]はサルディオン、トパーズ、エメラルド、"
  18: "第二[だいに]の列[れつ]はカーバンクル、サファイア、ジャスパー、"
  19: "第三[だいさん]の列[れつ]はリグリオン、アゲート、アメジスト、"
  20: "第四[だいよん]の列[れつ]はクリソライト、ベリル、オニキス。それらは金[きん]で包[つつ]まれ、それぞれの列[れつ]ごとに金[きん]で結[むす]ばれる。"
  21: "その石[いし]はイスラエルの子[こ]らの名[な]による十二[じゅうに]個[こ]とする。それぞれの名[な]に従[したが]って、印[いん]を刻[きざ]むようにして、十二[じゅうに]の部族[ぶぞく]のためにする。"
  22: "あなたは胸当[むねあて]に、純[じゅん]な金[きん]で鎖[くさり]細工[ざいく]の編[あ]み紐[ひも]を造[つく]れ。"
  23: "〔あなたは胸当[むねあて]に二[ふた]つの金[きん]の環[かん]を造[つく]り、その二[ふた]つの環[かん]を胸当[むねあて]の両端[りょうたん]に付[つ]けよ。〕"
  24: "〔あなたは二[ふた]つの編[あ]み紐[ひも]を、胸当[むねあて]の両端[りょうたん]の二[ふた]つの環[かん]に通[とお]せ。〕"
  25: "〔あなたは二[ふた]つの紐[ひも]の端[はし]を二[ふた]つの枠[わく]に取[つ]け、エフォドの肩[かた]の部分[ぶぶん]の前[まえ]側[がわ]に置[お]け。〕"
  26: "〔あなたは二[ふた]つの金[きん]の環[かん]を造[つく]り、胸当[むねあて]の両端[りょうたん]、エフォドの内[うち]側[がわ]の後[うし]ろの縁[ふち]に置[お]け。〕"
  27: "〔あなたは二[ふた]つの金[きん]の環[かん]を造[つく]り、エフォドの下[した]の二[ふた]つの肩[かた]の部分[ぶぶん]の前[まえ]側[がわ]、そのつなぎ目[め]の上[うえ]、エフォドの織[お]り物[もの]の帯[おび]の上[うえ]に置[お]け。〕"
  28: "〔あなたは胸当[むねあて]の環[かん]を、エフォドの環[かん]に青[あお]の紐[ひも]で結[むす]び、エフォドの織[お]り物[もの]の上[うえ]に置[お]かれるようにせよ。胸当[むねあて]がエフォドから外[はず]れないためである。〕"
  29: "アロンは裁[さば]きの胸当[むねあて]にイスラエルの子[こ]らの名[な]を、その胸[むね]に負[お]って聖所[せいしょ]に入[はい]る。神[かみ]の前[まえ]で絶[たえ]ず記念[きねん]とするためである。"
  30: "あなたは裁[さば]きの胸当[むねあて]にウリムとトンミム⟨胸当[むねあて]に入[い]れて、神[かみ]の御心[みこころ]を問[と]うためのもの。⟩を入[い]れよ。アロンが聖所[せいしょ]に入[はい]るとき、それはアロンの胸[むね]にある。アロンはイスラエルの子[こ]らの裁[さば]きを、主[しゅ]の前[まえ]で絶[たえ]ずその胸[むね]に負[お]う。」"
  31: "「あなたはエフォドの下[した]に着[き]る、足[あし]まで届[とど]く衣[ころも]を、その全体[ぜんたい]を青[あお]で造[つく]れ。"
  32: "その真[ま]ん中[なか]に頭[あたま]を通[とお]す口[くち]があり、口[くち]の周[まわ]りには織[お]り物[もの]の縁[ふち]がある。衣[ころも]と同[おな]じように織[お]り合[あ]わせた縁[ふち]で、裂[さ]けないようにする。"
  33: "あなたはその裾[すそ]に、石榴[ざくろ]の花[はな]のような飾[かざ]りを、青[あお]、紫[むらさき]、撚[よ]った緋[ひ]の糸、撚[よ]った亜麻布[あまぬの]で、衣[ころも]の裾[すそ]の周[まわ]りに造[つく]れ。同じ形[かたち]の金[きん]の鈴[すず]を、その間[あいだ]に周[まわ]りに造[つく]れ。"
  34: "石榴[ざくろ]の飾[かざ]りごとに、金[きん]の鈴[すず]と花[はな]の飾[かざ]りが、衣[ころも]の裾[すそ]の周[まわ]りにある。"
  35: "アロンが仕[つと]めるとき、それがアロンにあるので、聖所[せいしょ]に入[はい]るときも出[で]るときも、主[しゅ]の前[まえ]でその音[おと]が聞[き]こえる。死[し]なないためである。」"
  36: "「あなたは純[じゅん]な金[きん]の板[いた]を造[つく]り、印[いん]の形[かたち]に『主[しゅ]の聖[せい]なるもの』と刻[きざ]め。"
  37: "あなたはそれを青[あお]の撚[よ]り紐[ひも]に付[つ]け、冠[かんむり]に付[つ]ける。冠[かんむり]の前[まえ]の面[めん]にあるようにする。"
  38: "それはアロンの額[ひたい]にあり、アロンは、イスラエルの子[こ]らが聖[せい]なるものとして献[ささ]げる聖[せい]なる贈[おく]り物[もの]のすべてについて、その罪[つみ]を負[お]う。それは絶[たえ]ずアロンの額[ひたい]にあり、彼[かれ]らのために主[しゅ]の前[まえ]で受[う]け入[い]れられる。"
  39: "あなたは亜麻布[あまぬの]の衣[ころも]に房[ふさ]を、亜麻布[あまぬの]の頭[あたま]の被[かぶ]り物[もの]を造[つく]り、刺繍[ししゅう]師[し]の技[わざ]で帯[おび]を造[つく]れ。」"
  40: "「あなたはアロンの子[こ]らのために衣[ころも]と帯[おび]と頭[あたま]の被[かぶ]り物[もの]を、栄光[えいこう]と美[うつく]しさのために造[つく]れ。"
  41: "あなたはそれをあなたの兄弟[きょうだい]アロンと、彼[かれ]とともにいるその子[こ]らに着[き]せ、彼[かれ]らに油[あぶら]を注[そそ]ぎ、彼[かれ]らの手[て]を満[み]たし、彼[かれ]らを聖[せい]なる者[もの]とせよ。わたしに祭司[さいし]として仕[つか]えるためである。"
  42: "あなたは彼[かれ]らのために亜麻布[あまぬの]の下[した]ばきを造[つく]り、彼[かれ]らの裸[はだか]を覆[おお]え。腰[こし]から腿[もも]までとする。"
  43: "アロンとその子[こ]らは、証[あかし]の幕屋[まくや]に入[はい]るとき、また聖[せい]なる祭壇[さいだん]に近[ちか]づいて仕[つと]めるとき、それを着[き]る。そうすれば彼[かれ]らは罪[つみ]を負[お]って死[し]ぬことはない。これは彼[かれ]と、彼[かれ]の後[のち]の子孫[しそん]にとって永遠[えいえん]の定[さだ]めである。」"

notes:
  1: "προσαγάγου πρὸς σεαυτόν — «приведи к себе», приблизь; ἱερατεύειν μοι — священнодействовать Мне. Пять имён: Ααρων, Ναδαβ, Αβιουδ, Ελεαζαρ, Ιθαμαρ."
  2: "στολὴ ἁγία — священная одежда (衣服); εἰς τιμὴν καὶ δόξαν — в честь и славу (Синодальный: «для славы и благолепия»)."
  3: "τοῖς σοφοῖς τῇ διανοίᾳ — мудрым умом (心の賢い); οὓς ἐνέπλησα πνεύματος αἰσθήσεως — «которых Я исполнил духа разумения» (識別/分別の霊); εἰς τὸ ἅγιον — для святилища."
  4: "περιστήθιον — нагрудник (胸当), ἐπωμίς — ефод, ποδήρης — длинная риза, χιτὼν κοσυμβωτός — хитон с бахромой (房飾りの衣), κίδαρις — кидар (頭の被り物), ζώνη — пояс. У LXX здесь περιστήθιον, а λογεῖον — только с 28:15 («наперсник судный», 裁きの胸当)."
  5: "Пять материалов: золото, голубая, пурпуровая, червлёная шерсть, виссон."
  6: "У LXX ефод — только из кручёного виссона; золото появляется в 28:8 (у масоретского текста и Синодального золото и здесь). ἔργον ὑφαντὸν ποικιλτοῦ — тканая работа вышивальщика."
  7: "δύο ἐπωμίδες συνέχουσαι — два нарамника (плечевые части), держащие один другого; ἐπὶ τοῖς δυσὶ μέρεσιν ἐξηρτημέναι — привешены на двух сторонах."
  8: "ὕφασμα τῶν ἐπωμίδων — ткань ефода, «которая на нём» (пояс ефода); κατὰ τὴν ποίησιν ἐξ αὐτοῦ — той же работы."
  9: "σμάραγδος — смарагд (エメラルド); в масоретском тексте שֹׁהַם (оникс), у Синодального «оникс». γλύψεις — вырежешь."
  10: "Шесть имён на одном камне, шесть на другом, κατὰ τὰς γενέσεις αὐτῶν — по родам/рождению их."
  11: "ἔργον λιθουργικῆς τέχνης, γλύμμα σφραγῖδος — работа камнереза, резьба печати."
  12: "λίθοι μνημοσύνου — камни памяти; ἀναλήμψεται — понесёт; μνημόσυνον περὶ αὐτῶν — память о них."
  13: "ἀσπιδίσκαι — гнёзда-щитки (枠), куда вставляются камни; ἐκ χρυσίου καθαροῦ — из чистого золота."
  14: "κροσσωτά — плетёные цепочки (金の編み紐); καταμεμιγμένα ἐν ἄνθεσιν — «смешанные с цветами», т.е. узор из цветов; ἔργον πλοκῆς — плетёная работа."
  15: "λογεῖον τῶν κρίσεων — наперсник судный (裁きの胸当); κατὰ τὸν ῥυθμὸν τῆς ἐπωμίδος — по образцу ефода."
  16: "τετράγωνον, διπλοῦν — четырёхугольный и двойной (сложенный); σπιθαμή — пядь (スパン), около 22 см."
  17: "καθυφανεῖς ὕφασμα κατάλιθον τετράστιχον — воткнёшь в него каменное тканьё в четыре ряда. Первый ряд: σάρδιον, τοπάζιον, σμάραγδος — サルディオン、トパーズ、エメラルド."
  18: "Второй ряд: ἄνθραξ, σάπφειρος, ἴασπις — カーバンクル、サファイア、ジャスパー."
  19: "Третий ряд: λιγύριον, ἀχάτης, ἀμέθυστος — リグリオン、アゲート、アメジスト. λιγύριον отождествляют с гиацинтом."
  20: "Четвёртый ряд: χρυσόλιθος, βηρύλλιον, ὀνύχιον — クリソライト、ベリル、オニキス. περικεκαλυμμένα χρυσίῳ — обложены золотом, συνδεδεμένα ἐν χρυσίῳ — связаны в золоте."
  21: "Двенадцать камней по числу сыновей; γλυφαὶ σφραγίδων — резьба печатей; εἰς δέκα δύο φυλάς — для двенадцати колен."
  22: "κροσσοὺς συμπεπλεγμένους, ἔργον ἁλυσιδωτόν — плетёные цепочки, работа цепочная."
  23: "Стих целиком в 〔…〕: в gr-lxx-byz на месте стиха «.» (текст 23–28 слит в 28:29 как «29a»); перевод по csl-ru. δακτύλιοι χρυσοῖ — золотые кольца на двух концах наперсника."
  24: "〔…〕 по той же причине. δύο κροσσοί — две цепочки, вдеты в кольца по концам наперсника."
  25: "〔…〕. ἀσπιδίσκαι — гнёзда (枠); κατὰ τὰς παρωμίδας — у нарамников, с лицевой стороны."
  26: "〔…〕. δακτύλιοι на другой паре концов наперсника, «внутрь», к ефоду."
  27: "〔…〕. Вторые два кольца — снизу у нарамников, у соединения над поясом ефода."
  28: "〔…〕. συσφίγξεις — стянешь наперсник с ефодом шнуром из голубой шерсти, чтобы он не спадал."
  29: "ἐπὶ τοῦ λογείου τῆς κρίσεως ἐπὶ τοῦ στήθους — на наперснике судном у сердца; μνημόσυνον ἔναντι τοῦ θεοῦ — память пред Богом (у LXX θεός, не κύριος)."
  30: "δήλωσις καὶ ἀλήθεια — «явное и истина» (明らかにするものと真理): так LXX передаёт евр. אוּרִים וְתֻמִּים, отсюда традиционные ウリムとトンミム; οἴσει τὰς κρίσεις — понесёт суды сынов Израилевых."
  31: "ὑποδύτης ποδήρης ὅλον ὑακίνθινον — нижняя риза до пят, вся голубая; Синодальный называет её «верхняя риза к ефоду»."
  32: "περιστόμιον — устье для головы; ᾤα … κύκλῳ — обшивка вокруг; τὴν συμβολὴν συνυφασμένην ἐξ αὐτοῦ — соединение, вытканное из него же, ἵνα μὴ ῥαγῇ — чтобы не разорвалось."
  33: "ὡσεὶ ἐξανθούσης ῥόας ῥοίσκους — «как бы расцветающего граната» украшения (石榴の花のような飾り); κώδωνες — звонки (鈴); χρυσοῦς — золотые."
  34: "παρὰ ῥοίσκον χρυσοῦν κώδωνα καὶ ἄνθινον — при каждом гранате золотой звонок и цветок; кругом по подолу."
  35: "ἀκουστὴ ἡ φωνὴ αὐτοῦ — слышен звук его; εἰσιόντι … καὶ ἐξιόντι — при входе и выходе; ἵνα μὴ ἀποθάνῃ — чтобы не умереть."
  36: "πέταλον — дощечка (板); ἐκτύπωμα σφραγῖδος — оттиск печати; Ἁγίασμα κυρίου — «святыня Господня» (主の聖なるもの)."
  37: "ἐπὶ ὑακίνθου κεκλωσμένης — на шнуре из голубой кручёной шерсти; μίτρα — головной убор (冠); у LXX это иное слово, чем κίδαρις в 28:4, но предмет тот же (слав. различает клобук и увясло)."
  38: "μετῶπον — чело (額); ἐξαρεῖ τὰ ἁμαρτήματα τῶν ἁγίων — снимет грехи святынь; δόμα — дар; δεκτὸν αὐτοῖς — приемлемо для них."
  39: "κόσυμβοι τῶν χιτώνων — бахрома хитонов (房); κίδαρις βυσσίνη — льняной кидар; ζώνη — пояс, ἔργον ποικιλτοῦ."
  40: "То же для сыновей: хитоны, пояса, кидары — εἰς τιμὴν καὶ δόξαν."
  41: "ἐνδύσεις — облечёшь; χρίσεις — помажешь; ἐμπλήσεις αὐτῶν τὰς χεῖρας — букв. «наполнишь их руки» (поставление в священство); ἁγιάσεις — освятишь."
  42: "περισκελῆ λινᾶ — льняные надраги (下ばき); καλύψαι ἀσχημοσύνην χρωτός — прикрыть наготу тела; ἀπὸ ὀσφύος ἕως μηρῶν — от чресл до бёдер."
  43: "ἕξει — будет иметь (на себе); ἐπάξονται ἁμαρτίαν — наведут на себя грех; νόμιμον αἰώνιον — устав вечный."
