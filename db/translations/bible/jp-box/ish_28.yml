# jp-box, Исход, глава 28. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru)
# и русский Синодальный (ru). jp-joc для Исхода в базе нет.
# Язык — современный 常体; порядок членов — по греческому.
# Глава 28: избрание Аарона и сыновей (1), одежды (2–5), ефод (6–14), наперсник (15–30),
# верхняя риза с яблоками и звонками (31–35), кидар и дощечка (36–39), одежды сыновей (40–43).
# ВАЖНО: в gr-lxx-byz стихи 28:23–28 стоят как «.» — текст их в модуле слит в 28:29 как «29a»
# (там греч. ἀσπιδίσκας, чего нет в собственно 28:29). Стихи 23–28 переведены по csl-ru
# (церковное чтение, LXX) и целиком обёрнуты в 〔…〕 по правилу «стиха в базе нет».
# 〔…〕 больше нигде нет: остальное сверено bracket_check.rb.
# Сноски ⟨…⟩: スパン (28:16), ウリムとトンミム (28:30) — впервые в корпусе;
# エフォド пояснён при первом упоминании (25:7).
# jp-ni не использовался.

