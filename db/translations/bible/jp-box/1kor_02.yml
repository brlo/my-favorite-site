# jp-box, Первое послание к Коринфянам, глава 2. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 2: проповедь Павла — не в мудрости слова, а в силе (1–5);
# Божия премудрость, сокрытая и открытая Духом (6–16).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет, <j>/<mo> не ставятся.
# 〔…〕: 2:13 — церковное πνεύματος ἁγίου.
# Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

tr_code: jp-box
book: 1kor
chapter: 2
draft: true

verses:
  1: "兄弟[きょうだい]たちよ、わたしもあなたがたのところへ行[い]ったとき、言葉[ことば]や知恵[ちえ]の優[すぐ]れたものによって神[かみ]の証[あかし]を告[つ]げ知[し]らせるために行[い]ったのではない。"
  2: "なぜなら、わたしは、あなたがたの間[あいだ]で、イエス・キリスト、しかも十字架[じゅうじか]につけられた方[かた]のほかには、何[なに]も知[し]らないと決[き]めたからである。"
  3: "そして、わたしはあなたがたのところに、弱[よわ]さと恐[おそ]れと大[おお]きな震[ふる]えとをもって赴[おもむ]いた。"
  4: "わたしの言葉[ことば]もわたしの宣教[せんきょう]も、人[ひと]の知恵[ちえ]による説得[せっとく]の言葉[ことば]によらず、霊[れい]と力[ちから]との証明[しょうめい]によった。"
  5: "それは、あなたがたの信仰[しんこう]が人[ひと]の知恵[ちえ]によるのではなく、神[かみ]の力[ちから]によるものとなるためである。"
  6: "しかし、わたしたちは、熟達[じゅくたつ]した者[もの]たちの間[あいだ]で知恵[ちえ]を語[かた]る。それはこの世[よ]の知恵[ちえ]ではなく、また、過[す]ぎ去[さ]りつつあるこの世[よ]の支配者[しはいしゃ]たちの知恵[ちえ]でもない。"
  7: "むしろ、わたしたちが語[かた]るのは、奥義[おうぎ]の中[なか]に隠[かく]されていた神[かみ]の知恵[ちえ]である。それは、神[かみ]がわたしたちの栄光[えいこう]のために、世[よ]の始[はじ]めより前[まえ]に定[さだ]めておられたものである。"
  8: "この世[よ]の支配者[しはいしゃ]たちは、だれもこの知恵[ちえ]を知[し]らなかった。もし知[し]っていたなら、栄光[えいこう]の主[しゅ]を十字架[じゅうじか]につけることはしなかったであろう。"
  9: "しかし、「神[かみ]がご自分[じぶん]を愛[あい]する者[もの]たちのために備[そな]えられたものは、目[め]がまだ見[み]ず、耳[みみ]がまだ聞[き]かず、人[ひと]の心[こころ]にまだ上[のぼ]らなかったもの」と書[か]かれているとおりである。"
  10: "しかし、神[かみ]はこれらを、霊[れい]によってわたしたちに示[しめ]された。霊[れい]はすべてのものを、神[かみ]の深[ふか]みさえも、見[み]通[とお]されるからである。"
  11: "なぜなら、人[ひと]のうちにあるその人[ひと]の霊[れい]のほかに、だれが人[ひと]のことを知[し]りえようか。同[おな]じように、神[かみ]の霊[れい]のほかに、だれも神[かみ]のことを知[し]る者[もの]はいない。"
  12: "わたしたちは、この世[よ]の霊[れい]を受[う]けたのではなく、神[かみ]から出[で]る霊[れい]を受[う]けた。それは、神[かみ]がわたしたちに賜[たまわ]ったものごとを知[し]るためである。"
  13: "わたしたちが語[かた]るのは、人[ひと]の知恵[ちえ]が教[おし]えた言葉[ことば]ではなく、〔{聖霊[せいれい]|聖神[せいしん]}の〕教[おし]えた言葉[ことば]であり、霊[れい]に属[ぞく]する事柄[ことがら]を霊[れい]に属[ぞく]する言葉[ことば]に合[あ]わせて語[かた]るのである。"
  14: "魂[たましい]に属[ぞく]する人[ひと]は、神[かみ]の霊[れい]の事[こと]を受[う]け入[い]れない。なぜなら、それは彼[かれ]にとって愚[おろ]かさであり、また、それらは霊[れい]によって見分[みわ]けられるので、彼[かれ]はそれらを知[し]ることができないからである。"
  15: "霊[れい]に属[ぞく]する人[ひと]はすべてのものを見分[みわ]けるが、自分[じぶん]はだれからも見分[みわ]けられない。"
  16: "なぜなら、「だれが主[しゅ]の心[こころ]を知[し]り、主[しゅ]に教[おし]え諭[さと]すことができようか」とあるとおりである。しかし、わたしたちにはキリストの心[こころ]がある。"

notes:
  1: "В базе μυστήριον; церковный текст (Елизаветинская «свидетельство Божие», jp-joc「神の證」) читает μαρτύριον — 神の証. Это замена, а не добавление, поэтому без 〔〕 (ср. Рим 2:17). καθ᾽ ὑπεροχὴν λόγου ἢ σοφίας — «превосходство слова или мудрости»; 言葉や知恵の優れたもの."
  2: "ἔκρινα … εἰδέναι — 知らないと決めた. ἐσταυρωμένον — 十字架につけられた."
  3: "ἐν ἀσθενείᾳ καὶ ἐν φόβῳ καὶ ἐν τρόμῳ πολλῷ — 弱さと恐れと大きな震え."
  4: "πειθοῖς σοφίας λόγοις — «убедительными словами мудрости» (человеческой); 人の知恵による説得の言葉. В базе [λόγοις] и [ς] стоят в квадратных скобках — слова есть, 〔〕 не ставятся. ἀπόδειξις — 証明."
  6: "τέλειοι — «совершенные, зрелые»; 熟達した者たち. ἄρχοντες τοῦ αἰῶνος τούτου — この世の支配者たち; καταργούμενοι — 過ぎ去りつつある."
  7: "ἐν μυστηρίῳ — 奥義の中に. προώρισεν — 定めておられた; πρὸ τῶν αἰώνων — 世の始めより前に."
  9: "Ис 64:4 (LXX). ἀνέβη ἐπὶ καρδίαν — 心に上らなかった."
  10: "ἐραυνᾷ — «исследует, испытывает»; 見通される. βάθη τοῦ θεοῦ — 神の深み."
  11: "τὸ πνεῦμα τοῦ ἀνθρώπου — 人の霊; τὸ πνεῦμα τοῦ θεοῦ — 神の霊. Оба члена сохранены раздельно, без сглаживания."
  13: "В базе ἐν διδακτοῖς πνεύματος без ἁγίου; церковный текст (Елизаветинская «Духа Святаго», jp-joc「聖神の教ふる所」) читает πνεύματος ἁγίου — 〔聖霊の〕. Проверено по базе: ἁγίου в стихе — 0. συγκρίνοντες — «сопоставляя»; 合わせて語る."
  14: "ψυχικός — 魂に属する人 (не σαρκικός, ср. 3:1–3, где 肉に属する); ἀνακρίνεται — 見分けられる."
  16: "Ис 40:13 (LXX). νοῦς κυρίου — 主の心. συμβιβάσει — 教え諭す."
