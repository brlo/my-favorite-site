#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc этой главы не имеет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 31 — оракул о Моаве. В слав./ru это глава 48 (47 стихов против 44).
# План: 1 надписание «О Моаве» и плач о Нево; 2–10 гибель городов, «нет
# врачевания Моаву», бегство; 11–13 «Моав почивал от юности своей» — не был
# переливаем из сосуда, и суд над ним; 14–17 «мы сильны», жезл сокрушён, «покачайте
# [головой] о нём»; 18–24 Дивон, Ароер, перечень городов под судом; 25–27 отсечён
# рог, чаша опьянения, Израиль в посмех; 28–31 бегство в скалы, гордость Моава;
# 32–36 плач о винограднике Севамском, «сердце моё как свирель»; 37–39 стриженые
# головы, «сосуд, никому не нужный»; 40–44 орёл над Моавом, страх, пропасть и сеть,
# год посещения; в конце — «возвращу плен Моава» и «доселе суд Моава».
# Голоса: 1–44 — сплошная речь Господа в 「…」 (открыта в 1, закрыта в 44). Внутри
# неё вложенная речь — 『…』: 2 (замысел «истребим её»), 14 («мы сильны»), 17 («как
# сокрушён жезл»), 19 («что случилось?»). Вводные формулы («так говорит Господь»,
# «говорит Господь») не разрывают кавычек — говорит тот же Господь. Заключительная
# формула слав. 48:47 «доселе суд Моава» — вне кавычек, в конце 44.
# Нумерация по gr: 44 стиха. gr 31:N = слав. 48:N при N = 1–44. Слав. 45–47
# (МТ 48:45–47) в LXX нет — влиты по содержанию: 45 — в конец 44 (продолжение образа
# сетей: огонь из Есевона), 46 — в конец 42 («горе тебе, Моав», «погиб народ Хамоса»),
# 47 — в конец 44 («возвращу плен Моава в последние дни»). Стихи не добавлялись.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz; слав. добавления внесены в основной
# текст без скобок и оговорены в notes («нет в LXX»): 5 «врази», 7 «и в сокровищах
# твоих», 15 «глаголет Царь, Господь Вседержитель имя Его», 18 «дщи», 27 «преселишися
# инамо», 38 «всяк плачь», 40 орёл (в gr только формула), 43 «глаголет Господь».
# Сносок ⟨…⟩ нет: 粗布, 罠, 屠り場, 香, 笛 уже в корпусе, пояснения — в notes.
# Имена — транслитерация греческого (LXX): モアブ, ネボ, キリアタイム, アマト, エセボン,
# オロナイム, ゾゴラ, アラオト, ハモス, ダイボン, アロエル, アルノン, ミソル, ハイロン,
# ヤッサ, モファト, デブラタイム, ガモル, マオン, カリオト, ボソル, キラダス, ヤゼル,
