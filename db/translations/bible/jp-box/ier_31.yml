verses:
  1: "「その時[とき]、わたしはイスラエルの氏族[しぞく]の神[かみ]となり、彼らはわたしの民[たみ]となる、と主[しゅ]は言[い]われる。」"
  2: "主[しゅ]はこう言[い]われる。「わたしは荒野[こうや]で、剣[つるぎ]に倒[たお]れた者[もの]たちとともに暖[あたた]かさを見[み]いだした。行[い]け。イスラエルを滅[ほろ]ぼしてはならない。」"
  3: "主[しゅ]は遠[とお]くから彼[かれ]に現[あらわ]れた。「永遠[えいえん]の愛[あい]をもって、わたしはあなたを愛[あい]した。それゆえ、わたしはあなたをあわれみへと引[ひ]き寄[よ]せた。"
  4: "わたしは再[ふたた]びあなたを建[た]てる。イスラエルの処女[おとめ]よ、あなたは建[た]てられ、再び太鼓[たいこ]を取[と]って、踊[おど]る者[もの]たちの集[つど]いとともに出[で]て行[い]く。"
  5: "あなたがたは再びサマリアの山[やま]々[やま]にぶどう畑[ばたけ]を植[う]える。植えて、ほめたたえよ。"
  6: "エフライムの山[やま]で、呼[よ]びかけに答[こた]える者[もの]たちの声[こえ]が上[あ]がる日[ひ]が来[く]る。『立[た]って、シオンへ、われわれの神[かみ]である主[しゅ]のもとへ上[のぼ]ろう。』」"
  7: "主[しゅ]はヤコブにこう言[い]われる。「喜[よろこ]び、諸国[しょこく]の頭[かしら]の上[うえ]で雄叫[おたけ]びせよ。聞[き]こえるように告[つ]げ知[ら]せ、ほめたたえて言[い]え。『主[しゅ]はその民[たみ]、イスラエルの残[のこ]りを救[すく]われた。』"
  8: "見[み]よ、わたしは彼[かれ]らを北[きた]から連[つ]れて来[く]る。地[ち]の果[は]てから彼らを集[あつ]める。過越[すぎこし]の祭[まつ]りに、大[おお]きな群[む]れが生[う]まれ、彼らはここへ帰[かえ]って来る。"
  9: "彼[かれ]らは泣[な]きながら出[で]て行[い]った。わたしは慰[なぐさ]めをもって彼らを連[つ]れ戻[もど]す。水[みず]の流[なが]れのそばのまっすぐな道[みち]に彼らを住[す]まわせ、彼らはそこで迷[まよ]わない。わたしはイスラエルの父[ちち]となり、エフライムはわたしの初子[ういご]であるからである。"
  10: "諸国[しょこく]の民[たみ]よ、主[しゅ]の言葉[ことば]を聞[き]け。遠[とお]い島[しま]々[じま]に告[つ]げ知[ら]せ。言[い]え。『イスラエルを散[ち]らした方[かた]が彼を集[あつ]め、羊飼[ひつじか]いが群[む]れを飼[か]うように彼を守[まも]る。』"
  11: "主[しゅ]はヤコブを贖[あがな]い、彼より強[つよ]い者[もの]の手[て]から彼を救[すく]い出[だ]したからである。"
  12: "彼らは来[き]て、シオンの山[やま]で喜[よろこ]び、主[しゅ]の良[よ]いものへ、すなわち穀物[こくもつ]とぶどう酒[ぶどうしゅ]と果実[かじつ]と家畜[かちく]と羊[ひつじ]の地[ち]へと向[む]かう。彼らの魂[たましい]は実[み]を結[むす]ぶ木[き]のようになり、彼らはもはや飢[う]えない。"
  13: "その時[とき]、処女[おとめ]たちは若者[わかもの]たちの集[つど]いの中で喜[よろこ]び、老人[ろうじん]たちも喜ぶ。わたしは彼らの嘆[なげ]きを喜[よろこ]びに変[か]え、彼らを慰[なぐさ]めて、悲[かな]しみの後[あと]に喜ばせる。"
  14: "わたしは祭司[さいし]たち、レビの子[こ]らの魂[たましい]を大[おお]いにし、酔[よ]わせる。わたしの民[たみ]はわたしの良[よ]いもので満[み]たされる。」"
  15: "主[しゅ]はこう言[い]われる。「ラマに声[こえ]が聞[き]こえた。嘆[なげ]きと泣[な]き声[ごえ]と号泣[ごうきゅう]である。ラケルがその子[こ]らについて泣き、子らがもういないので、慰[なぐさ]めを受[う]けることを拒[こば]んでいる。」"
  16: "主[しゅ]はこう言[い]われる。「あなたの声[こえ]を泣[な]き声[ごえ]から、あなたの目[め]を涙[なみだ]から遠[とお]ざけよ。あなたの行[おこな]いには報[むく]いがあるからである、と主[しゅ]は言[い]われる。彼らは敵[てき]の地[ち]から帰[かえ]って来る。"
  17: "あなたの後[のち]の者[もの]たちには希望[きぼう]がある、と主[しゅ]は言[い]われる。あなたの子[こ]らは自分の境[さかい]へ帰[かえ]って来る。」"
  18: "「わたしはエフライムが嘆[なげ]くのを聞[き]いた。『あなたはわたしを懲[こ]らしめ、わたしは懲[こ]らしめられて、まだ教[おし]えられていない若[わか]い雄牛[おうし]のようになった。わたしを帰[かえ]らせてください。そうすれば帰[かえ]ります。あなたはわたしの神[かみ]である主[しゅ]ですから。"
  19: "わたしは捕囚[ほしゅう]の後[のち]に悔[く]い改[あらた]め、悟[さと]った後[のち]に、恥[はじ]の日[ひ]々[び]に嘆[なげ]いた。若[わか]い時[とき]の辱[はずかし]めを負[お]ったことを、あなたに示[しめ]しました。』」"
  20: "「エフライムはわたしの愛[いと]しい子[こ]、喜[よろこ]ばしい子[こ]であろうか。わたしが彼[かれ]について語[かた]るたびに、いつも彼を思[おも]い起[おこ]す。わたしの内[うち]は彼のために騒[さわ]ぎ、わたしは彼をあわれまずにはいられない、と主[しゅ]は言[い]われる。」"
  21: "「シオンよ、あなたは自分[じぶん]のために見張[みは]りを立[た]て、罰[ばつ]を加[くわ]えよ。心[こころ]を、あなたが歩[あゆ]んだその道[みち]に向[む]けよ。イスラエルの処女[おとめ]よ、帰[かえ]れ。泣[な]きながら、あなたの都々[みやこみやこ]へ帰れ。"
  22: "いつまで、あなたは背[そむ]くのか、辱[はずかし]められた娘[むすめ]よ。主[しゅ]は新[あたら]しい植[う]え物[もの]として救[すく]いを造[つく]られた。人々[ひとびと]は救いのうちを歩[あゆ]む。」"
  23: "主[しゅ]はこう言[い]われる。「ユダの地[ち]とその都々[みやこみやこ]で、わたしがその捕囚[ほしゅう]を帰[かえ]らせるとき、人々[ひとびと]は再[ふたた]びこの言葉[ことば]を語[かた]る。『その聖[せい]なる義[ぎ]の山[やま]の上[うえ]で、主[しゅ]はほめたたえられよ。』"
  24: "ユダの都々[みやこみやこ]とその全[ぜん]地[ち]に住[す]む者[もの]たちは、農夫[のうふ]とともに住[す]み、羊[ひつじ]の群[む]れもそこに伴[とも]なわれる。"
  25: "わたしは渇[かわ]いたすべての魂[たましい]を酔[よ]わせ、飢[うえ]えたすべての魂を満[み]たした。」"
  26: "それゆえ、わたしは目[め]を覚[さ]まして見[み]た。わたしの眠[ねむ]りは心地[ここち]よかった。"
  27: "主[しゅ]はこう言[い]われる。「見[み]よ、日[ひ]が来[く]る。わたしはイスラエルとユダに、人[ひと]の種[たね]と家畜[かちく]の種を蒔[ま]く。"
  28: "わたしが彼[かれ]らの上[うえ]で、壊[こわ]し、害[がい]するために見張[みは]っていたように、そのように彼らの上で、建[た]て、植[う]えるために見張る、と主[しゅ]は言[い]われる。"
  29: "その日[ひ]々[び]には、もはや言[い]わない。『父[ちち]たちは酸[す]いぶどうを食[た]べ、子[こ]どもたちの歯[は]がしびれた』と。"
  30: "しかし、それぞれが自分[じぶん]の罪[つみ]によって死[し]ぬ。酸[す]いぶどうを食[た]べた者[もの]の歯[は]がしびれるのである。」"
  31: "「見[み]よ、日[ひ]が来[く]る、と主[しゅ]は言[い]われる。わたしはイスラエルの家[いえ]とユダの家[いえ]と、新[あたら]しい契約[けいやく]を結[むす]ぶ。"
  32: "それは、わたしが彼[かれ]らの父祖[ふそ]の手[て]を取[と]って、エジプトの地[ち]から連[つ]れ出[だ]した日[ひ]に、彼らと結[むす]んだ契約[けいやく]とは違[ちが]う。彼らはわたしの契約にとどまらなかったので、わたしは彼らを顧[かえり]みなかった、と主[しゅ]は言[い]われる。"
  33: "わたしがそれらの日[ひ]の後[あと]に、イスラエルの家[いえ]と結[むす]ぶ契約[けいやく]は、これである、と主[しゅ]は言[い]われる。わたしはわたしの律法[りっぽう]を彼らの思[おも]いに与[あた]え、彼らの心[こころ]に書[か]き記[しる]す。わたしは彼らの神[かみ]となり、彼らはわたしの民[たみ]となる。"
  34: "彼らはもはや、それぞれ隣人[りんじん]や兄弟[きょうだい]に『主[しゅ]を知[し]れ』と教[おし]えない。小[ちい]さい者[もの]から大[おお]きい者[もの]まで、すべてがわたしを知[し]るからである。わたしは彼らの不法[ふほう]を赦[ゆる]し、その罪[つみ]を再[ふたた]び思[おも]い起[おこ]さないからである。」"
  35: "「たとえ天[てん]が高[たか]く上[あ]げられ、地[ち]の基[もとい]が下[した]に沈[しず]んでも、わたしはイスラエルの氏族[しぞく]を、彼らが行[おこな]ったすべてのことのゆえに捨[す]てない、と主[しゅ]は言[い]われる。」"
  36: "主[しゅ]はこう言[い]われる。「昼[ひる]の光[ひかり]として太陽[たいよう]を、夜[よる]の光として月[つき]と星[ほし]々[ぼし]を与[あた]え、海[うみ]に叫[さけ]びを起[お]こしてその波[なみ]をとどろかせた方[かた]、その名[な]は万軍[ばんぐん]の主[しゅ]である。"
  37: "もしこれらの定[さだ]めがわたしの前[まえ]から絶[た]えるなら、イスラエルの氏族[しぞく]も、わたしの前で民[たみ]であることをやめる、と主[しゅ]は言[い]われる。」"
  38: "「見[み]よ、日[ひ]が来[く]る、と主[しゅ]は言[い]われる。都[みやこ]は主[しゅ]のために、ハナメエルの塔[とう]から隅[すみ]の門[もん]まで建[た]てられる。"
  39: "その測[はか]り縄[なわ]は彼らの前[まえ]を出[で]て、ガリブの丘[おか]まで及[およ]び、選[えら]ばれた石[いし]で周[まわ]りを囲[かこ]まれる。"
  40: "すべてのアサリモトは、ケデロンの流[なが]れまで、東[ひがし]の馬[うま]の門[もん]の隅[すみ]まで、主[しゅ]への聖[せい]なるものとなる。それはもはや絶[た]えず、永遠[えいえん]に壊[こわ]されない。」"

notes:
  1: "Ἐν τῷ χρόνῳ ἐκείνῳ — «в то время»; ἔσομαι εἰς θεὸν τῷ γένει Ισραηλ — «буду Богом роду Израилеву» (γένος — род, племя; дательный «для»; в тексте 氏族); αὐτοὶ ἔσονταί μοι εἰς λαόν — «они будут Мне народом»: формула завета (ср. 38:33; Лев 26:12). В ru (МТ) «всем племенам Израилевым» — множественное число, масоретское чтение, в текст не внесено."
  2: "Εὗρον θερμὸν ἐν ἐρήμῳ — «нашёл тепло в пустыне» (θερμός — тёплый; в тексте 暖かさ): образ неясен, вероятно «тепло/милость» (ср. εὗρον χάριν в МТ); слав. «обретох теплоту в пустыни». μετὰ ὀλωλότων ἐν μαχαίρᾳ — «с погибшими от меча» (ὄλλυμι — губить). βαδίσατε καὶ μὴ ὀλέσητε τὸν Ισραηλ — «идите и не погубите Израиля»: тёмное место, сохранено буквально. В ru (МТ) иначе: «народ, уцелевший от меча, нашёл милость в пустыне; иду успокоить Израиля»."
  3: "κύριος πόρρωθεν ὤφθη αὐτῷ — «Господь издалека явился ему» (πόρρωθεν — издалека; ὤφθη — явился, был виден). Ἀγάπησιν αἰωνίαν ἠγάπησά σε — «любовью вечною возлюбил тебя» (винительный как наречие; cognatus accusativus сохранён 愛をもって…愛した). εἵλκυσά σε εἰς οἰκτίρημα — «привлёк тебя в милосердие» (ἕλκω — влечь; οἰκτίρημα — милосердие); слав. «вовлекох тя в щедроты»."
  4: "ἔτι οἰκοδομήσω σε — «ещё (снова) построю тебя» (ἔτι); παρθένος Ισραηλ — «дева Израилева» (в тексте 処女); λήμψῃ τύμπανόν σου — «возьмёшь тимпан твой» (τύμπανον — бубен, 太鼓); ἐξελεύσῃ μετὰ συναγωγῆς παιζόντων — «выйдешь с собранием играющих» (παίζω — плясать, веселиться). Слав. «возмеши тимпаны своя и изыдеши с собором играющих»."
  5: "φυτεύσατε ἀμπελῶνας — «насадите виноградники» (ἀμπελών); ἐν ὄρεσιν Σαμαρείας — «на горах Самарии» (サマリア — по корпусу, 4 Цар 23:19). καὶ αἰνέσατε — «и восхвалите» (αἰνέω); слав. «насаждающе насадите и похвалите». В ru (МТ) добавлено «виноградари сами будут пользоваться ими» — масоретское чтение, не внесено."
  6: "ἡμέρα κλήσεως ἀπολογουμένων — «день призыва отвечающих» (κλῆσις — призыв; ἀπολογέομαι — отвечать); ἐν ὄρεσιν Εφραιμ — «в горах Ефрема» (エフライム). Ἀνάστητε καὶ ἀνάβητε εἰς Σιων — «встаньте и взойдите в Сион»: призыв стражей, вложенная цитата 『…』. Слав. «день воззвания отвещавающих в горах ефремовых». Цитата 38:4–6 закрывается."
  7: "Εὐφράνθητε καὶ χρεμετίσατε ἐπὶ κεφαλὴν ἐθνῶν — «радуйтесь и ржите на главу народов» (χρεμετίζω — ржать, о коне; образ ликования, 雄叫び); ἀκουστὰ ποιήσατε — «сделайте слышимым», возвестите; εἴπατε Ἔσωσεν κύριος τὸν λαὸν αὐτοῦ — «скажите: спас Господь народ Свой». τὸ κατάλοιπον τοῦ Ισραηλ — «остаток Израиля» (κατάλοιπον). Слова народов — 『…』. Открывается слово Господа (38:7–14)."
  8: "ἄγω αὐτοὺς ἀπὸ βορρᾶ — «веду их от севера»; συνάξω ἀπ᾽ ἐσχάτου τῆς γῆς — «соберу от конца земли»; ἐν ἑορτῇ φασεκ — «в праздник Пасхи» (ἑορτή — праздник; φασεκ — транслитерация ивр. песах): чтение LXX/модуля, в слав. тоже «в праздник пасхи», в ru (МТ) этого нет; место тёмное. τεκνοποιήσῃ ὄχλον πολύν — «породишь многое множество» (2-е л. ед. ч.; слав. «чадородит народ мног» — 3-е л.), передано безличным 大きな群れが生まれる."
  9: "ἐν κλαυθμῷ ἐξῆλθον — «со плачем вышли» (κλαυθμός — плач); ἐν παρακλήσει ἀνάξω — «с утешением возведу» (παράκλησις); αὐλίζων ἐπὶ διώρυγας ὑδάτων — «водворяя при потоках вод» (αὐλίζω — располагаться станом; διῶρυξ — канал, поток); ἐν ὁδῷ ὀρθῇ — «на пути прямом» (ὀρθός); οὐ μὴ πλανηθῶσιν — «не заблудятся» (πλανάω). ἐγενόμην τῷ Ισραηλ εἰς πατέρα — «Я стал Израилю отцом»; Εφραιμ πρωτότοκός μού ἐστιν — «Ефрем — первенец Мой» (πρωτότοκος; ср. Исх 4:22)."
  10: "Ἀκούσατε λόγον κυρίου, ἔθνη — «слушайте слово Господне, народы»; ἀναγγείλατε εἰς νήσους τὰς μακρότερον — «возвестите островам дальнейшим» (νῆσος — остров); ὁ λικμήσας τὸν Ισραηλ — «рассеявший (провеявший) Израиля» (λικμάω — веять, рассеивать); συνάξει καὶ φυλάξει — «соберёт и сохранит»; ὡς ὁ βόσκων τὸ ποίμνιον — «как пасущий стадо» (βόσκω, ποίμνιον). Речь Господа продолжается (1-е л. в 13–14), потому и здесь 「…」; слова народов — 『…』."
  11: "ἐλυτρώσατο κύριος τὸν Ιακωβ — «искупил Господь Иакова» (λυτρόω — искупать, освобождать); ἐξείλατο ἐκ χειρὸς στερεωτέρων αὐτοῦ — «изъял из руки сильнейших его» (ἐξαιρέω; στερεός — крепкий, сравн. ст.). Греч. аорист («избавил»), в ru (МТ) будущее («искупит») — держим LXX/csl."
  12: "ἥξουσιν ἐπ᾽ ἀγαθὰ κυρίου — «придут к благам Господним» (ἀγαθά — блага); ἐπὶ γῆν σίτου καὶ οἴνου καὶ καρπῶν — «на землю пшеницы, вина и плодов» (σῖτος, οἶνος, καρπός). В ru (МТ) добавлен «елей» — в LXX нет, в текст не внесено. ἔσται ἡ ψυχὴ αὐτῶν ὥσπερ ξύλον ἔγκαρπον — «душа их будет как дерево плодоносное» (ἔγκαρπος); οὐ πεινάσουσιν ἔτι — «не будут голодать более» (πεινάω). В ru (МТ) «как напоенный водою сад» — иное чтение."
  13: "τότε χαρήσονται παρθένοι ἐν συναγωγῇ νεανίσκων — «тогда возрадуются девы в собрании юношей» (παρθένος, νεανίσκος); πρεσβῦται χαρήσονται — «старцы возрадуются»; στρέψω τὸ πένθος αὐτῶν εἰς χαρμονήν — «обращу плач их в радость» (πένθος — плач, траур; χαρμονή — радость); ποιήσω αὐτοὺς εὐφραινομένους — «сделаю их веселящимися» (εὐφραίνω; в тексте 喜ばせる)."
  14: "μεγαλυνῶ καὶ μεθύσω τὴν ψυχὴν τῶν ἱερέων υἱῶν Λευι — «возвеличу и упою душу священников, сынов Левия» (μεγαλύνω; μεθύσκω — поить допьяна, в значении «насыщать»); ὁ λαός μου τῶν ἀγαθῶν μου ἐμπλησθήσεται — «народ Мой благами Моими насытится» (ἐμπίπλημι). Слав. «возвеличу и упою душу жерцев сынов левииных, и людие мои благот моих насытятся». Цитата закрывается."
  15: "Φωνὴ ἐν Ραμα ἠκούσθη θρήνου καὶ κλαυθμοῦ καὶ ὀδυρμοῦ — «голос в Раме слышен: плача, рыдания и вопля» (θρῆνος — причитание; ὀδυρμός — рыдание); Ραχηλ ἀποκλαιομένη — «Рахиль плачущая» (ἀποκλαίομαι); οὐκ ἤθελεν παύσασθαι ἐπὶ τοῖς υἱοῖς αὐτῆς, ὅτι οὐκ εἰσίν — «не хотела перестать [плакать] о детях своих, ибо их нет». Слав. «глас в раме слышан бысть плача и рыдания и вопля». Пророчество о пленении (ср. Мф 2:18); ラマ, ラケル — по корпусу (Быт 35; 1 Цар 10)."
  16: "Διαλιπέτω ἡ φωνή σου ἀπὸ κλαυθμοῦ — «пусть оставит голос твой плач» (διαλείπω — прекращаться); οἱ ὀφθαλμοί σου ἀπὸ δακρύων — «очи твои от слёз» (δάκρυον); ἔστιν μισθὸς τοῖς σοῖς ἔργοις — «есть награда делам твоим» (μισθός — награда, плата); ἐπιστρέψουσιν ἐκ γῆς ἐχθρῶν — «возвратятся из земли врагов». Слав. «да почиет глас твой от плача и очи твои от слез, яко есть мзда делом твоим»."
  17: "μόνιμον τοῖς σοῖς τέκνοις — «пребывающее (прочное) детям твоим» (μόνιμος — постоянный): в gr-lxx-byz стих обрывается на этих словах. Полный вид — в слав. 31:17: «и есть надежда последним твоим, (глаголет Господь,) и возвратятся сынове твои в пределы своя»; по нему и переведено, отсутствующее в LXX внесено без скобок. Слав. скобки «(глаголет Господь)» — редакционная помета, в тексте формула есть."
  18: "ἀκοὴν ἤκουσα Εφραιμ ὀδυρομένου — «слухом услышал Ефрема рыдающего» (ἀκοή — слух; ὀδύρομαι — рыдать): слова Ефрема — вложенная цитата 『…』. Ἐπαίδευσάς με, καὶ ἐπαιδεύθην — «наказал Ты меня, и я наказан» (παιδεύω); ὥσπερ μόσχος οὐκ ἐδιδάχθην — «как телец, я не научен» (μόσχος — теля; διδάσκω); ἐπίστρεψόν με, καὶ ἐπιστρέψω — «обрати меня, и обращусь»; σὺ κύριος ὁ θεός μου — «Ты Господь Бог мой». Слав. «наказал мя еси, (Господи,) и наказахся: аз якоже телец не научихся»."
  19: "ὕστερον αἰχμαλωσίας μου μετενόησα — «после пленения моего покаялся» (αἰχμαλωσία — плен; μετανοέω — каяться); ὕστερον τοῦ γνῶναί με ἐστέναξα — «после того как познал, возстенал» (στενάζω); ἐφ᾽ ἡμέρας αἰσχύνης — «в дни стыда» (αἰσχύνη); ὑπέδειξά σοι ὅτι ἔλαβον ὀνειδισμὸν ἐκ νεότητός μου — «показал Тебе, что принял поношение от юности моей» (ὑποδείκνυμι; ὀνειδισμός). Слав. «приях укоризну от юности моея». Плач Ефрема заканчивается, закрываются 『』 и 「」."
  20: "υἱὸς ἀγαπητὸς Εφραιμ ἐμοί — «сын любимый Ефрем Мне» (ἀγαπητός); παιδίον ἐντρυφῶν — «дитя, утешающееся» (ἐντρυφάω — наслаждаться, резвиться); ἀνθ᾽ ὧν οἱ λόγοι μου ἐν αὐτῷ — «потому что слова Мои в нём»; μνείᾳ μνησθήσομαι αὐτοῦ — «памятью вспомню его» (μνεία, μιμνήσκομαι); ἔσπευσα ἐπ᾽ αὐτῷ — «поспешил о нём» (σπεύδω); ἐλεῶν ἐλεήσω αὐτόν — «милуя помилую его». Ответ Господа на плач Ефрема; цитата закрывается."
  21: "Στῆσον σεαυτήν, Σιων — «поставь себе, Сион» (ἵστημι); ποίησον τιμωρίαν — «сделай наказание» (τιμωρία), в тексте 罰を加えよ; δὸς καρδίαν σου εἰς τοὺς ὤμους — букв. «дай сердце твоё на плечи»: тёмное место; слав. «направи сердце твое на путь прав» понял иначе, в тексте по смыслу csl 心を道に向けよ; ὁδὸν ἣν ἐπορεύθης ἀποστράφητι — «на путь, которым ты шла, обратись»; ἀποστράφητι εἰς τὰς πόλεις σου πενθοῦσα — «обратись в города твои, плача» (πενθέω)."
  22: "ἕως πότε ἀποστρέψεις, θυγάτηρ ἠτιμωμένη — «доколе будешь отвращаться, дочь обесчещенная» (ἀτιμόω — бесчестить); ἔκτισεν κύριος σωτηρίαν εἰς καταφύτευσιν καινήν — «создал Господь спасение в насаждение новое» (κτίζω — творить; καταφύτευσις — насаждение; καινός — новый); ἐν σωτηρίᾳ περιελεύσονται ἄνθρωποι — «в спасении будут ходить человеки» (περιέρχομαι — обходить). В ru (МТ) иначе: «Господь сотворит на земле нечто новое: жена спасёт мужа» — масоретское чтение, важное для смысла; по паритету держим LXX/csl, МТ отмечен здесь."
  23: "Ἔτι ἐροῦσιν τὸν λόγον τοῦτον — «ещё скажут слово сие»; ὅταν ἀποστρέψω τὴν αἰχμαλωσίαν αὐτοῦ — «когда возвращу пленение его» (αἰχμαλωσία); Εὐλογημένος κύριος ἐπὶ δίκαιον ὄρος τὸ ἅγιον αὐτοῦ — «благословен Господь на праведной горе, святой Его»: приветствие городу и храму, передано ほめたたえられよ. Слав. «благословен Господь на праведней горе святей своей». Слова людей — 『…』."
  24: "ἐνοικοῦντες ἐν ταῖς πόλεσιν Ιουδα — «живущие в городах Иуды»; ἅμα γεωργῷ — «вместе с земледельцем» (γεωργός); ἀρθήσεται ἐν ποιμνίῳ — «вознесётся в стаде» (αἴρω — поднимать; ποίμνιον — стадо): тёмное место, передано 羊の群れもそこに伴なわれる, слав. «вознесется во стаде»."
  25: "ἐμέθυσα πᾶσαν ψυχὴν διψῶσαν — «упоил всякую душу жаждущую» (μεθύσκω; διψάω — жаждать); πᾶσαν ψυχὴν πεινῶσαν ἐνέπλησα — «всякую душу алчущую наполнил» (πεινάω; ἐμπίπλημι). Слав. «упоих всяку душу жаждущу и всяку душу алчущу насытих». Цитата закрывается."
  26: "ἐξηγέρθην καὶ εἶδον — «я пробудился и увидел» (ἐξεγείρω); ὁ ὕπνος μου ἡδύς μοι ἐγενήθη — «сон мой стал мне сладок» (ὕπνος; ἡδύς — сладкий, приятный). Слова самого пророка, пробудившегося от видения: авторская речь, без кавычек. Слав. «Того ради востах от сна и видех, и сон ми сладок бысть»."
  27: "σπερῶ τὸν Ισραηλ καὶ τὸν Ιουδαν σπέρμα ἀνθρώπου καὶ σπέρμα κτήνους — «посею Израиля и Иуду семенем человека и семенем скота» (σπείρω — сеять; σπέρμα — семя; κτῆνος — скот): образ полного возрождения (ср. 38:28). Слав. «всею израиля и иуду семя человечо и семя скотское» (слав. «всею» вместо «посею»). Открывается слово Господа (38:27–30)."
  28: "ὥσπερ ἐγρηγόρουν ἐπ᾽ αὐτοὺς καθαιρεῖν καὶ κακοῦν — «как Я бодрствовал над ними, чтобы разрушать и злодействовать» (γρηγορέω — бодрствовать; καθαιρέω — разрушать; κακόω — вредить); οὕτως γρηγορήσω ἐπ᾽ αὐτοὺς τοῦ οἰκοδομεῖν καὶ καταφυτεύειν — «так буду бодрствовать над ними, чтобы созидать и насаждать» (καταφυτεύω). Слав. «якоже бдех на ня потребити и озлобити, тако бдети буду о них, еже созидати и насаждати»."
  29: "οἱ πατέρες ἔφαγον ὄμφακα — «отцы ели кислый виноград» (ὄμφαξ — незрелый виноград); οἱ ὀδόντες τῶν τέκνων ᾑμωδίασαν — «у детей зубы онемели» (αἱμωδιάω — испытывать оскомину). Поговорка (ср. Иез 18:2; здесь же 38:30): слова народа — 『…』. Слав. «отцы ядоша кислая, а зубы детем оскомнишася»."
  30: "ἀλλ᾽ ἢ ἕκαστος ἐν τῇ ἑαυτοῦ ἁμαρτίᾳ ἀποθανεῖται — «но каждый в своём грехе умрёт»; τοῦ φαγόντος τὸν ὄμφακα αἱμωδιάσουσιν οἱ ὀδόντες αὐτοῦ — «у съевшего кислый виноград онемеют зубы его». Слав. «но кийждо своим грехом умрет, и ядшему кислая оскоменятся зубы его». Цитата закрывается."
  31: "διαθήσομαι τῷ οἴκῳ Ισραηλ καὶ τῷ οἴκῳ Ιουδα διαθήκην καινήν — «заключу с домом Израиля и с домом Иуды завет новый» (διαθήκη — завет, 契約; καινός — новый; ср. Евр 8:8–12). Слав. «завещаю дому израилеву и дому иудину завет нов». Ключевое место о новом завете; открывается слово Господа (38:31–34)."
  32: "οὐ κατὰ τὴν διαθήκην, ἣν διεθέμην τοῖς πατράσιν αὐτῶν — «не по завету, который Я заключил с отцами их»; ἐν ἡμέρᾳ ἐπιλαβομένου μου τῆς χειρὸς αὐτῶν — «в день, когда Я взял их за руку» (ἐπιλαμβάνομαι — брать, хватать); ἐξαγαγεῖν ἐκ γῆς Αἰγύπτου — «вывести из земли Египетской». αὐτοὶ οὐκ ἐνέμειναν ἐν τῇ διαθήκῃ μου — «они не пребыли в завете Моём» (ἐμμένω); ἐγὼ ἠμέλησα αὐτῶν — «Я пренебрёг ими» (ἀμελέω — нерадеть): LXX/csl «аз небрегох их», в тексте 顧みなかった; в ru (МТ) «Я оставался в союзе с ними» — иное чтение, в текст не внесено."
  33: "αὕτη ἡ διαθήκη, ἣν διαθήσομαι — «вот завет, который Я заключу»; μετὰ τὰς ἡμέρας ἐκείνας — «после тех дней»; Διδοὺς δώσω νόμους μου εἰς τὴν διάνοιαν αὐτῶν — «давая, дам законы Мои в разум их» (διάνοια — разум, мысль; в тексте 思い; конструкция διδοὺς δώσω передана простым 与え); ἐπὶ καρδίας αὐτῶν γράψω αὐτούς — «на сердцах их напишу их» (γράφω; объект — законы); ἔσομαι αὐτοῖς εἰς θεόν — «буду им Богом». Слав. «дая законы моя в мысли их, и на сердцах их напишу я, и буду им в Бога, и тии будут ми в люди»."
  34: "οὐ μὴ διδάξωσιν ἕκαστος τὸν πολίτην αὐτοῦ — «не научит каждый согражданина своего» (πολίτης — согражданин, 隣人); Γνῶθι τὸν κύριον — «познай Господа»; πάντες εἰδήσουσίν με ἀπὸ μικροῦ αὐτῶν καὶ ἕως μεγάλου αὐτῶν — «все познают Меня от малого их до великого их»; ἵλεως ἔσομαι ταῖς ἀδικίαις αὐτῶν — «буду милостив к неправдам их» (ἵλεως — милостивый, умилостивленный); τῶν ἁμαρτιῶν αὐτῶν οὐ μὴ μνησθῶ ἔτι — «грехов их не помяну более» (μιμνήσκομαι). Слав. «вси познают мя от мала даже и до великаго их: яко милостив буду неправдам их». Цитата закрывается; 35–37 — знамение светил."
  35: "ἐὰν ὑψωθῇ ὁ οὐρανὸς εἰς τὸ μετέωρον — «если возвысится небо в высоту» (ὑψόω; μετέωρον — высота); ἐὰν ταπεινωθῇ τὸ ἔδαφος τῆς γῆς κάτω — «если унизится основание земли вниз» (ταπεινόω; ἔδαφος — основание, 基); οὐκ ἀποδοκιμῶ τὸ γένος Ισραηλ — «не отвергну род Израилев» (ἀποδοκιμάζω — отвергать). Внимание: в модуле порядок 35–37 сдвинут относительно слав./Rahlfs: наш 38:35 = слав. 31:37, наш 38:36 = слав. 31:35, наш 38:37 = слав. 31:36. Держим нумерацию модуля."
  36: "ὁ δοὺς τὸν ἥλιον εἰς φῶς τῆς ἡμέρας — «давший солнце в свет дня»; σελήνην καὶ ἀστέρας εἰς φῶς τῆς νυκτός — «луну и звёзды в свет ночи»; κραυγὴν ἐν θαλάσσῃ — «вопль в море» (κραυγή — крик, рёв; в тексте 叫び); ἐβόμβησεν τὰ κύματα αὐτῆς — «возшумели волны его» (βομβέω — гудеть; κῦμα — волна); κύριος παντοκράτωρ ὄνομα αὐτῷ — «Господь Вседержитель — имя Ему» (παντοκράτωρ — 万軍の主). Слав. «давый солнце во свет дне, луну и звезды на свет нощи, и вопль на мори, и возшумеша волны его». По Rahlfs это 31:35."
  37: "Ἐὰν παύσωνται οἱ νόμοι οὗτοι ἀπὸ προσώπου μου — «если прекратятся законы эти от лица Моего» (παύω — прекращать; νόμος — закон, устав; в тексте 定め); τὸ γένος Ισραηλ παύσεται γενέσθαι ἔθνος κατὰ πρόσωπόν μου — «род Израилев перестанет быть народом пред лицом Моим». Слав. «аще премолкнут законы сии от лица моего, то и род израилев престанет быти язык пред лицем моим во вся дни». По Rahlfs это 31:36."
  38: "ἀπὸ πύργου Αναμεηλ ἕως πύλης τῆς γωνίας — «от башни Анамеила до ворот угольных» (πύργος — башня; πύλη γωνίας — угловые ворота, 隅の門; ср. 2 Пар 26:9; Неем 3:24). ハナメエル — по брифу (Αναμεηλ), 隅の門 — по корпусу (2 Пар 25:23; 26:9). Открывается слово о восстановлении города (38:38–40)."
  39: "ἡ διαμέτρησις αὐτῆς — «измерение её» (διαμέτρησις — размер, измерение; в тексте 測り縄, как землемерная вервь); ἕως βουνῶν Γαρηβ — «до холмов Гарив» (βουνός — холм; Γαρηβ — транслитерация, ガリブ); περικυκλωθήσεται κύκλῳ ἐξ ἐκλεκτῶν λίθων — «обойдётся вокруг из отборных камней» (περικυκλόω — окружать; ἐκλεκτός — избранный; λίθος). Слав. «до могил гарив, и оымется окрест избранным камением» — слав. «могил» вместо «холмов»."
  40: "πάντες ασαρημωθ — «все ассаримоф»: транслитерация евр. слова (вероятно «поля», ср. ru «всё поле»), оставлена как アサリモト с оговоркой; ἕως ναχαλ Κεδρων — «до потока Кедрон» (ναχάλ — поток; ケデロンの流れ — по корпусу, 4 Цар 23:6); ἕως γωνίας πύλης ἵππων ἀνατολῆς — «до угла ворот конских к востоку» (πύλη ἵππων — 馬の門, ср. Неем 3:28); ἁγίασμα τῷ κυρίῳ — «святыня Господу» (ἁγίασμα); οὐκέτι οὐ μὴ ἐκλίπῃ — «уже не иссякнет» (ἐκλείπω); οὐ μὴ καθαιρεθῇ ἕως τοῦ αἰῶνος — «не разрушится до века» (καθαιρέω). Цитата закрывается."
