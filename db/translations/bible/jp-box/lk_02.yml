verses:
  1: "そのころ、皇帝[こうてい]アウグストから、全世界[ぜんせかい]の民[たみ]を人口調査[じんこうちょうさ]にかけるという勅令[ちょくれい]が出[で]た。"
  2: "この人口調査[じんこうちょうさ]は、キリニオがシリアの総督[そうとく]であったときに行[おこな]われた最初[さいしょ]のものである。"
  3: "人々[ひとびと]は皆[みな]、人口調査[じんこうちょうさ]を受[う]けるために、それぞれ自分[じぶん]の町[まち]へ帰[かえ]って行[い]った。"
  4: "ヨセフも、ガリラヤの町[まち]ナザレから、ユダヤへ、ダビデの町[まち]と呼[よ]ばれるベツレヘムへ上[のぼ]った。彼[かれ]がダビデの家[いえ]と一族[いちぞく]に属[ぞく]していたからである。"
  5: "婚約[こんやく]していたマリアとともに登録[とうろく]するためである。マリアはすでに身[み]ごもっていた。"
  6: "二人[ふたり]がそこにいるうちに、マリアの産[さん]期[き]が満[み]ちた。"
  7: "マリアは長子[ちょうし]である男[おとこ]の子[こ]を産[う]み、布[ぬの]に包[つつ]んで飼[か]い葉桶[ばおけ]に寝[ね]かせた。宿屋[やどや]には、二人[ふたり]のための場所[ばしょ]がなかったからである。"
  8: "その地方[ちほう]には羊飼[ひつじか]いたちが野宿[のじゅく]して、夜[よる]の間[あいだ]、自分[じぶん]たちの羊[ひつじ]の群[む]れを見張[みは]っていた。"
  9: "すると、主[しゅ]の天使[てんし]が彼[かれ]らのそばに立[た]ち、主[しゅ]の栄光[えいこう]が彼[かれ]らの周[まわ]りを照[て]らしたので、彼[かれ]らはひどく恐[おそ]れた。"
  10: "天使[てんし]は彼[かれ]らに言[い]った。「恐[おそ]れるな。見[み]よ、わたしはあなたがたに、民[たみ]すべてに及[およ]ぶ大[おお]きな喜[よろこ]びの知[し]らせを告[つ]げる。"
  11: "今日[きょう]、ダビデの町[まち]に、あなたがたのために救[すく]い主[ぬし]がお生[う]まれになった。この方[かた]こそ、キリストと呼[よ]ばれる主[しゅ]である。"
  12: "あなたがたへのしるしはこれである。布[ぬの]に包[つつ]まれ、飼[か]い葉桶[ばおけ]に寝[ね]かせられている幼[おさな]子[ご]が見[み]つかる。」"
  13: "すると突然[とつぜん]、天[てん]の軍勢[ぐんぜい]が大勢[おおぜい]、その天使[てんし]とともに現[あらわ]れ、神[かみ]を賛美[さんび]して言[い]った。"
  14: "「いと高[たか]き所[ところ]には神[かみ]に栄光[えいこう]、地[ち]には平和[へいわ]、人[ひと]には恵[めぐ]みがあるように。」"
  15: "天使[てんし]たちが彼[かれ]らを離[はな]れて天[てん]へ帰[かえ]ると、羊飼[ひつじか]いたちは互[たが]いに言[い]った。「ベツレヘムへ行[い]って、主[しゅ]がわたしたちに知[し]らせてくださったこの出来事[できごと]を見[み]よう。」"
  16: "彼[かれ]らは急[いそ]いで行[い]き、マリアとヨセフ、そして飼[か]い葉桶[ばおけ]に寝[ね]かせられている幼[おさな]子[ご]を見[み]つけた。"
  17: "見[み]ると、この子[こ]について自分[じぶん]たちに語[かた]られた事[こと]を話[はな]し聞[き]かせた。"
  18: "これを聞[き]いた者[もの]は皆[みな]、羊飼[ひつじか]いたちの話[はなし]に驚[おどろ]いた。"
  19: "しかし、マリアはこれらのことをすべて心[こころ]に留[と]めて、思[おも]い巡[めぐ]らしていた。"
  20: "羊飼[ひつじか]いたちは、自分[じぶん]たちが聞[き]いたとおり、見[み]たとおりのすべてのことに神[かみ]をあがめ、賛美[さんび]しながら帰[かえ]って行[い]った。"
  21: "八日目[ようかめ]が満[み]ちて割礼[かつれい]を受[う]けさせるとき、その名[な]をイエスと名[な]づけた。天使[てんし]が身[み]ごもる前[まえ]に告[つ]げていた名[な]である。"
  22: "モーセの律法[りっぽう]による彼[かれ]らの清[きよ]めの日[ひ]が満[み]ちると、二人[ふたり]は子[こ]を連[つ]れてエルサレムへ上[のぼ]り、主[しゅ]に献[ささ]げようとした。"
  23: "主[しゅ]の律法[りっぽう]に「初[はじ]めて胎[たい]を開[ひら]く男[おとこ]の子[こ]は、すべて主[しゅ]に聖[せい]なる者[もの]と呼[よ]ばれる」と書[か]かれているとおりである。"
  24: "そして、主[しゅ]の律法[りっぽう]に言[い]われているとおりに、山鳩[やまばと]一対[いっつい]、あるいは家鳩[いえばと]のひな二羽[にはわ]を、いけにえとして捧[ささ]げるためであった。"
  25: "そのとき、エルサレムにシメオンという人[ひと]がいた。この人[ひと]は正[ただ]しく敬虔[けいけん]な人[ひと]で、イスラエルの慰[なぐさ]めを待[ま]ち望[のぞ]み、{聖霊[せいれい]|聖神[せいしん]}が彼[かれ]の上[うえ]にあった。"
  26: "この人[ひと]は、主[しゅ]のキリストを見[み]るまでは死[し]を見[み]ない、と{聖霊[せいれい]|聖神[せいしん]}から告[つ]げられていた。"
  27: "シメオンは霊[れい]に導[みちび]かれて神殿[しんでん]に入[はい]った。ちょうどそのとき、両親[りょうしん]が、律法[りっぽう]の慣[なら]わしに従[したが]って行[おこな]うため、幼[おさな]子[ご]イエスを連[つ]れて来[き]た。"
  28: "シメオンはその子[こ]を腕[うで]に受[う]け取[と]り、神[かみ]をほめたたえて言[い]った。"
  29: "「主[しゅ]よ。今[いま]、お言葉[ことば]のとおり、僕[しもべ]を安[やす]らかに去[さ]らせてください。"
  30: "わたしの目[め]は、あなたの救[すく]いを見[み]ました。"
  31: "あなたがすべての民[たみ]の前[まえ]に備[そな]えてくださった救[すく]いです。"
  32: "異邦人[いほうじん]への啓示[けいじ]となる光[ひかり]、あなたの民[たみ]イスラエルの栄光[えいこう]です。」"
  33: "〔ヨセフとその母[はは]〕は、イエスについて語[かた]られたことを不思議[ふしぎ]に思[おも]った。"
  34: "シメオンは二人[ふたり]を祝福[しゅくふく]し、母[はは]マリアに言[い]った。「見[み]よ、この子[こ]は、イスラエルの多[おお]くの人[ひと]を倒[たお]れさせ、また立[た]ち上[あ]がらせるために置[お]かれた。また、反対[はんたい]を受[う]けるしるしとなる。"
  35: "そして、あなた自身[じしん]の魂[たましい]も剣[つるぎ]で貫[つらぬ]かれる。それは、多[おお]くの心[こころ]の思[おも]いが明[あき]らかになるためである。」"
  36: "そこに、アセルの部族[ぶぞく]のファヌエルの娘[むすめ]で、アンナという女預言者[おんなよげんしゃ]がいた。この女[おんな]は非常[ひじょう]に年[とし]を取[と]っていて、処女[しょじょ]の時[とき]から七年[ななねん]夫[おっと]と暮[く]らした後[のち]、"
  37: "八十四歳[はちじゅうよんさい]になるまで寡[やもめ]で、神殿[しんでん]を離[はな]れず、断食[だんじつ]と祈[いの]りとによって夜[よる]も昼[ひる]も神[かみ]に仕[つか]えていた。"
  38: "ちょうどその時[とき]、アンナも近[ちか]づいて来[き]て神[かみ]をほめたたえ、エルサレムの贖[あがな]いを待[ま]ち望[のぞ]む者[もの]すべてに、この子[こ]のことを話[はな]した。"
  39: "そして、主[しゅ]の律法[りっぽう]に基[もと]づくことをすべて果[は]たすと、二人[ふたり]はガリラヤへ、自分[じぶん]たちの町[まち]ナザレへ帰[かえ]った。"
  40: "幼[おさな]子[ご]は育[そだ]ち、〔霊[れい]において〕強[つよ]くなり、知恵[ちえ]に満[み]ちていった。神[かみ]の{恵[めぐ]み|恩寵[おんちょう]}が彼[かれ]の上[うえ]にあった。"
  41: "両親[りょうしん]は毎年[まいとし]、過越[すぎこし]の祭[まつ]りにエルサレムへ行[い]っていた。"
  42: "イエスが十二歳[じゅうにさい]になったとき、祭[まつ]りの慣[なら]わしに従[したが]って都[みやこ]へ上[のぼ]った。"
  43: "祭[まつ]りの日[ひ]が終[お]わって、二人[ふたり]が帰[かえ]る途中[とちゅう]、少年[しょうねん]イエスはエルサレムに残[のこ]っていた。〔ヨセフとその母[はは]〕はそれに気[き]づかなかった。"
  44: "イエスが同行[どうこう]の者[もの]たちの中[なか]にいると思[おも]って、一日分[いちにちぶん]の道[みち]を進[すす]み、親戚[しんせき]や知人[ちじん]の間[あいだ]でイエスを捜[さが]した。"
  45: "見[み]つからなかったので、二人[ふたり]は捜[さが]しながらエルサレムへ戻[もど]った。"
  46: "三日[みっか]たって、二人[ふたり]はイエスが神殿[しんでん]の中[なか]で、教師[きょうし]たちの間[あいだ]に座[すわ]って、彼[かれ]らの話[はなし]を聞[き]き、また問[と]い返[かえ]しているのを見[み]つけた。"
  47: "聞[き]いていた者[もの]は皆[みな]、イエスの知恵[ちえ]と答[こた]えに驚[おどろ]いた。"
  48: "両親[りょうしん]はイエスを見[み]て驚[おどろ]き、母[はは]が言[い]った。「<mo>子[こ]よ、どうしてこんなことをしたのですか。見[み]よ、あなたの父[ちち]とわたしが、心[こころ]を痛[いた]めてあなたを捜[さが]していたのですよ。</mo>」"
  49: "イエスは言[い]われた。「<j>どうして、わたしを捜[さが]したのですか。わたしが父[ちち]の家[いえ]にいるべきことを、知[し]らなかったのですか。</j>」"
  50: "二人[ふたり]は、イエスが言[い]った言葉[ことば]の意味[いみ]が分[わ]からなかった。"
  51: "イエスは一緒[いっしょ]に下[くだ]ってナザレへ帰[かえ]り、二人[ふたり]に従[したが]っていた。母[はは]はこれらのことをすべて心[こころ]に留[め]ていた。"
  52: "イエスは知恵[ちえ]と年齢[ねんれい]においても、神[かみ]と人[ひと]からの{恵[めぐ]み|恩寵[おんちょう]}においても、ますます進[すす]んでいった。"

notes:
  1: "δόγμα — «повеление, указ»; 勅令. ἀπογράφεσθαι — «быть внесённым в список»; 人口調査. οἰκουμένη — 全世界."
  2: "ἡγεμονεύοντος…Κυρηνίου — «когда правителем Сирии был Квириний»; 総督, как в 3:1. Хронологическое расхождение с переписью при Квиринии (6 г. по Р. Х.) не сглаживаю."
  7: "πρωτότοκος в критической базе есть, поэтому без 〔〕 (ср. Мф 1:25, где «первенец» — церковное чтение). φάτνη — 飼い葉桶; сноски нет, понятно из контекста."
  9: "ἐπέστη — «предстал, встал рядом»; そばに立った. В церковном тексте перед этим стоит ἰδού (jp-joc「視よ」); частицу не маркирую (ср. Мф 13:2)."
  11: "Χριστὸς κύριος — «Христос Господь»; キリストと呼ばれる主, чтобы остались и имя, и титул (калька ハリストス срабатывает только на キリスト)."
  14: "В критической базе εὐδοκίας (род. п.); церковный текст (Елизаветинская, jp-joc「人には恵み臨めり」) читает εὐδοκία — взято «人には恵み», без 〔〕: это разночтение падежа, а не добавка."
  22: "καθαρισμοῦ αὐτῶν — «их очищения» (мн. ч.); оставил 彼らの, как в тексте."
  23: "Исх 13:2, 12 — цитата дана прямой речью, как в тексте."
  24: "Лев 12:8 — жертва бедных: пара горлиц или два птенца голубей; いけにえ — добавление только по-японски необходимое, в греч. θυσία."
  25: "παράκλησις — «утешение»; 慰め. προσδεχόμενος — «ожидающий»; 待ち望み."
  26: "κεχρηματισμένον — «получивший извещение, откровение»; 告げられていた."
  28: "ἐδέξατο αὐτὸ εἰς τὰς ἀγκάλας — «принял его на руки»; 腕に受け取り."
  31: "κατὰ πρόσωπον πάντων τῶν λαῶν — «пред лицом всех народов»; すべての民の前に."
  33: "В критической базе ὁ πατὴρ αὐτοῦ καὶ ἡ μήτηρ («отец Его и матерь»); церковный текст (Елизаветинская, jp-joc「イオシフ及び嬰児の母」) читает «Иосиф и Матерь Его» — 〔ヨセフとその母〕."
  35: "В критической базе καὶ σοῦ…ῥομφαία стоит в квадратных скобках; церковный текст читает, поэтому без 〔〕."
  36: "Ἀσήρ — Асир; アセル, как в списке колен."
  37: "χήρα ἕως ἐτῶν ὀγδοήκοντα τεσσάρων — «вдова до восьмидесяти четырёх лет»; 八十四歳になるまで寡で."
  40: "πληρούμενον σοφίᾳ — «исполняясь премудрости»; 知恵に満ち. В критической базе ἐκραταιοῦτο без πνεύματι; церковный текст (Елизаветинская «укреплялся духом», jp-joc「精神益強健」) читает «духом» — 〔霊において〕, как в 1:80."
  43: "В критической базе οἱ γονεῖς αὐτοῦ («родители Его»); церковный текст (Елизаветинская, jp-joc「イオシフと其の母」) читает «Иосиф и Матерь Его» — 〔ヨセフとその母〕, как в ст. 33."
  48: "Слова Богородицы — синие (единственное синее место в книге после 1:34, 1:38 и Магнификата). ὀδυνώμενοι — «терзаясь»; 心を痛めて."
  49: "Слова Христа — красные, единственное красное в главах 1–3. ἐν τοῖς τοῦ πατρός μου — «в том, что принадлежит Отцу Моему»; 父の家に, по церковной традиции."
  52: "προέκοπτεν σοφίᾳ καὶ ἡλικίᾳ — «преуспевал в премудрости и возрасте»; 知恵と年齢において進んだ."
