# jp-box, Второзаконие, глава 34. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в гл. 33–34 отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 34: восход Моисея на Нево и обозрение земли (1–3), слово Господа (4),
# смерть и погребение (5–6), возраст и крепость (7), плач народа (8), Иисус (9),
# итог о пророке (10–12).
# Кавычки: глава повествовательная; прямая речь Господа в 34:4 — 「…」, вложенная
# клятва отцам — 『…』. Красного нет.
# 〔…〕 нет: все слова есть в gr-lxx-byz. csl 34:6 опускает «в Гае», csl 34:12 добавляет
# в скобках «(и мышцу высокую)» — в gr этого нет, в текст не внесено, см. notes.
# LXX: 34:6 — ἐν Γαι («в Гае»), слав. опускает, в ru «на долине» — по масоретскому;
# 34:7 — χελύνια «губы, уста», в ru «крепость» — по масоретскому; 34:9 — πνεῦμα συνέσεως
# «дух разумения», в ru «дух премудрости»; 34:10 — πρόσωπον κατὰ πρόσωπον, 顔と顔を合わせて.
# Сносок ⟨…⟩ нет: 預言者, 嗣業, 手を置く понятны или уже в корпусе. jp-ni не использовался.

