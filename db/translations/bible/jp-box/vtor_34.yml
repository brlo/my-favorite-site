chapter: 34
draft: true

verses:
  1: "モーセはモアブのアラボトから、ネボ山[やま]、すなわちエリコの向[む]かいにあるファスガの頂[いただき]に上[のぼ]った。主[しゅ]は彼[かれ]に、ギレアデの全[すべ]ての地[ち]をダンまで示[しめ]された。"
  2: "また、ナフタリの全[すべ]ての地[ち]、エフライムとマナセの全ての地、ユダの全ての地を、最後[さいご]の海[うみ]まで。"
  3: "また、荒野[こうや]と、エリコの周[まわ]りの地[ち]、すなわちなつめやしの町[まち]を、ツォアルまで。"
  4: "主[しゅ]はモーセに言[い]われた。「これが、わたしがアブラハム、イサク、ヤコブに誓[ちか]って、『あなたがたの子孫[しそん]にこれを与[あた]える』と言[い]った地[ち]である。わたしはこれをあなたの目[め]に見[み]せたが、あなたはそこへは入[はい]らない。」"
  5: "主[しゅ]の僕[しもべ]モーセは、モアブの地[ち]で、主の言葉[ことば]によって死[し]んだ。"
  6: "彼[かれ]は、モアブの地[ち]のガイで、フォゴルの家[いえ]の近[ちか]くに葬[ほうむ]られた。しかし、だれも彼の墓[はか]を知[し]らない、今日[きょう]まで。"
  7: "モーセは死[し]ぬとき、百二十歳[ひゃくにじゅっさい]であった。その目[め]はかすむことがなく、その唇[くちびる]も衰[おとろ]えなかった。"
  8: "イスラエルの子[こ]らは、モアブのアラボトで、ヨルダン川[がわ]のほとり、エリコの向[む]かいで、モーセのために三十日[さんじゅうにち]泣[な]いた。そして、モーセを悼[いた]む悲[かな]しみの日[ひ]々[び]は終[お]わった。"
  9: "ヌンの子[こ]ヨシュアは、悟[さと]りの霊[れい]に満[み]たされた。モーセが彼の上[うえ]に手[て]を置[お]いたからである。イスラエルの子らは彼[かれ]に聞[き]き従[したが]い、主[しゅ]がモーセに命[めい]じたとおりに行[おこな]った。"
  10: "イスラエルには、モーセのような預言者[よげんしゃ]が、もはや立[た]たなかった。主[しゅ]が顔[かお]と顔[かお]を合[あ]わせて知[し]っておられた者[もの]である。"
  11: "エジプトの地[ち]で、ファラオとその僕[しもべ]たち、およびその全[すべ]ての地に対して、主[しゅ]が彼[かれ]を遣[つか]わして行[おこな]わせた、すべてのしるしと不思議[ふしぎ]において。"
  12: "また、モーセがすべてのイスラエルの前[まえ]で行[おこな]った、大[おお]いなる驚[おどろ]くべき業[わざ]と強[つよ]い手[て]において。"

notes:
  1: "ἀνέβη — взошёл (ἀναβαίνω). ἀπὸ Αραβωθ Μωαβ — с равнин Моавитских (アラボト, как Чис 26:3). ὄρος Ναβαυ — гора Нево. ἐπὶ κορυφὴν Φασγα — на вершину Фасги (ファスガ, как Втор 3:17). ἐπὶ προσώπου Ιεριχω — против Иерихона. ἔδειξεν αὐτῷ κύριος — показал ему Господь (δεικνύω)."
  2: "πᾶσαν τὴν γῆν Νεφθαλι … — всю землю Неффалима, Ефрема и Манассии, Иуды. ἕως τῆς θαλάσσης τῆς ἐσχάτης — до последнего моря, т. е. Средиземного (ἔσχατος)."
  3: "τὴν ἔρημον — пустыню. τὰ περίχωρα Ιεριχω — окрестности Иерихона (περίχωρον). πόλιν φοινίκων — город финиковых пальм, т. е. Иерихон (φοῖνιξ); отсюда なつめやし. ἕως Σηγωρ — до Сигора (ツォアル, как Быт 19:22)."
  4: "Αὕτη ἡ γῆ, ἣν ὤμοσα — вот земля, которою Я клялся (ὄμνυμι). Τῷ σπέρματι ὑμῶν δώσω αὐτήν — семени вашему дам её; слова клятвы — 『…』. ἔδειξα … τοῖς ὀφθαλμοῖς σου — показал глазам твоим. ἐκεῖ οὐκ εἰσελεύσῃ — туда не войдёшь."
  5: "ἐτελεύτησεν — скончался (τελευτάω). οἰκέτης κυρίου — слуга Господень (οἰκέτης, не δοῦλος; слав. «раб Господень»). ἐν γῇ Μωαβ — в земле Моава. διὰ ῥήματος κυρίου — по слову Господню (ῥῆμα)."
  6: "ἔθαψαν αὐτὸν ἐν Γαι — погребли его в Гае (3 мн. без подлежащего; в тексте пассив 葬られた, ср. ru «погребен») (Γαι; евр. גיא «долина»; слав. опускает, в ru «на долине» — по масоретскому). ἐγγὺς οἴκου Φογωρ — близ дома Фогора (フォゴル, как Чис 23:28). οὐκ οἶδεν οὐδεὶς τὴν ταφήν — никто не знает погребения его. ἕως τῆς ἡμέρας ταύτης — до сего дня."
  7: "ἑκατὸν καὶ εἴκοσι ἐτῶν — ста двадцати лет (род. возраста). ἐν τῷ τελευτᾶν αὐτόν — при кончине его. οὐκ ἠμαυρώθησαν οἱ ὀφθαλμοί — не померкли глаза (ἀμαυρόω). οὐδὲ ἐφθάρησαν τὰ χελύνια αὐτοῦ — не истлели губы его (χελύνια — губы, уста; слав. «устне»; в ru «крепость» — по масоретскому)."
  8: "ἔκλαυσαν — оплакали (κλαίω). ἐν Αραβωθ Μωαβ — на равнинах Моавитских. ἐπὶ τοῦ Ιορδάνου κατὰ Ιεριχω — при Иордане против Иерихона. τριάκοντα ἡμέρας — тридцать дней. συνετελέσθησαν αἱ ἡμέραι πένθους κλαυθμοῦ — окончились дни плача сетования (πένθος — траур)."
  9: "ἐνεπλήσθη πνεύματος συνέσεως — исполнился духа разумения (σύνεσις — понимание, разум; в ru «премудрости»). ἐπέθηκεν γὰρ Μωϋσῆς τὰς χεῖρας αὐτοῦ ἐπ᾽ αὐτόν — ибо возложил Моисей руки свои на него. εἰσήκουσαν αὐτοῦ — послушались его. καθότι ἐνετείλατο κύριος — как повелел Господь."
  10: "οὐκ ἀνέστη ἔτι προφήτης — не восстал более пророк (ἀνίστημι). ὡς Μωϋσῆς — как Моисей. ὃν ἔγνω κύριος αὐτὸν πρόσωπον κατὰ πρόσωπον — которого Господь знал лицом к лицу (избыточное αὐτὸν при относительном; отсюда 顔と顔を合わせて)."
  11: "ἐν πᾶσι τοῖς σημείοις καὶ τέρασιν — во всех знамениях и чудесах (σημεῖον, τέρας). ὃν ἀπέστειλεν αὐτὸν κύριος — которого послал его Господь (избыточное αὐτὸν). ποιῆσαι αὐτὰ ἐν γῇ Αἰγύπτῳ — сделать их в земле Египетской. Φαραω καὶ τοῖς θεράπουσιν αὐτοῦ — фараону и слугам его (θεράπων)."
  12: "τὰ θαυμάσια τὰ μεγάλα — великие чудеса (θαυμάσιος). τὴν χεῖρα τὴν κραταιάν — руку крепкую (κραταιός); слав. добавляет в скобках «(и мышцу высокую)» — в gr нет. ἃ ἐποίησεν Μωϋσῆς ἔναντι παντὸς Ισραηλ — которые совершил Моисей пред всем Израилем."
