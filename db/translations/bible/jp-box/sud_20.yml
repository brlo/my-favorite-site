verses:
  1: "イスラエルの子[こ]らはすべてい出[で]、会衆[かいしゅう]はみな、ダンからベエル・シェバまで、またギレアデの地[ち]から、一人[ひとり]の人[ひと]のように、主[しゅ]のもとへ、マスファに集[あつ]まった。"
  2: "民[たみ]すべての隊[たい]、すなわちイスラエルの全部族[ぶぞく]が、神[かみ]の民[たみ]の集会[しゅうかい]の中[なか]に立[た]った。剣[つるぎ]を抜[ぬ]いた歩兵[ほへい]四十万人[にん]であった。"
  3: "ベニヤミンの子[こ]らは、イスラエルの子らが主[しゅ]のもとへマスファに上[のぼ]ったことを聞[き]いた。イスラエルの子らは言[い]った。「この悪[あく]はどこで起[お]こったのか、話[はな]しなさい。」"
  4: "殺[ころ]された女[おんな]の夫[おっと]であるレビ人[びと]の男[おとこ]が答[こた]えて言[い]った。「わたしとわたしの側女[そばめ]は、ベニヤミンのギベアに泊[と]まるために来[き]ました。"
  5: "すると、ギベアの者[もの]たちがわたしに立[た]ち向[む]かい、夜[よる]、わたしの家[いえ]を取[と]り囲[かこ]みました。彼[かれ]らはわたしを殺[ころ]そうとし、わたしの側女[そばめ]を辱[はずかし]めてひどく扱[あつか]ったので、彼女[かのじょ]は死[し]にました。"
  6: "わたしは側女[そばめ]を取[と]って、それを切[き]り分[わ]け、イスラエルの嗣業[しぎょう]の全[すべ]ての地境[ちざかい]に送[おく]りました。彼[かれ]らがイスラエルの中[なか]で愚[おろ]かなことを行[おこな]ったからです。"
  7: "見[み]なさい、あなたがたはみな、イスラエルの子[こ]らです。あなたがた自身[じしん]で、言葉[ことば]と相談[そうだん]を決[き]めなさい。」"
  8: "民[たみ]はみな、一人[ひとり]の人[ひと]のように立[た]って言[い]った。「わたしたちはだれも自分[じぶん]の天幕[てんまく]に入[はい]らず、だれも自分の家[いえ]に退[しりぞ]かない。"
  9: "そして今[いま]、わたしたちがギベアにしようとすることはこうである。わたしたちはくじによってそれに上[のぼ]り、"
  10: "百人[にん]につき十人[にん]、千人[にん]につき百人[にん]、一万人[にん]につき千人[にん]の者[もの]を取[と]って、民[たみ]のために糧食[りょうしょく]を取[と]らせ、彼[かれ]らが行[い]って、ベニヤミンのギベアに、イスラエルで行[おこな]ったすべての愚[おろ]かさに応[おう]じて、それを成[な]し遂[と]げるためである。」"
  11: "イスラエルのすべての男[おとこ]は、町々[まちまち]から一人[ひとり]の人[ひと]のように集[あつ]まって来[き]た。"
  12: "イスラエルの部族[ぶぞく]は、ベニヤミンの全部族[ぶぞく]に人[ひと]を遣[つか]わして言[い]った。「あなたがたの中[なか]で起[おこ]ったこの悪[あく]は何[なん]なのか。"
  13: "今[いま]、ギベアにいるベリアルの子[こ]らである不敬[ふけい]な者[もの]たちを引[ひ]き渡[わた]しなさい。わたしたちは彼[かれ]らを殺[ころ]し、イスラエルから悪[あく]を取[と]り除[のぞ]く。」しかし、ベニヤミンの子らは、自分[じぶん]たちの兄弟[きょうだい]であるイスラエルの子らの声[こえ]に聞[き]き従[したが]おうとしなかった。"
  14: "ベニヤミンの子[こ]らは、イスラエルの子らと戦[たたか]うために、町々[まちまち]からギベアに集[あつ]まった。"
  15: "その日[ひ]、ベニヤミンの子らは町々[まちまち]から、剣[つるぎ]を抜[ぬ]く者[もの]二万五千人[にん]が数[かぞ]えられた。そのほかに、ギベアに住[す]む者[もの]として、選[えら]ばれた若者[わかもの]七百人[にん]が数[かぞ]えられた。"
  16: "彼[かれ]らは両手[りょうて]利[き]きであり、みな投石手[とうせきしゅ]で、石[いし]を髪[かみ]の毛[け]に当[あ]てて外[はず]さなかった。"
  17: "イスラエルのすべての男[おとこ]は、ベニヤミンの子[こ]らを除[のぞ]いて、剣[つるぎ]を抜[ぬ]く者[もの]四十万人[にん]が数[かぞ]えられた。彼[かれ]らはみな戦[いくさ]人[びと]であった。"
  18: "彼[かれ]らは立[た]ってベテルに上[のぼ]り、神[かみ]に問[と]うた。イスラエルの子[こ]らは言[い]った。「だれがわたしたちに先立[さきだ]って、ベニヤミンと戦[たたか]うために上[のぼ]るのか。」主[しゅ]は言[い]われた。「ユダが先立[さきだ]って上[のぼ]る。」"
  19: "イスラエルの子[こ]らは立[た]って、ギベアに向[む]かって陣[じん]を敷[し]いた。"
  20: "イスラエルのすべての男[おとこ]はベニヤミンとの戦[いくさ]に出[で]て、イスラエルの男たちはギベアに向[む]かって、彼[かれ]らと戦[たたか]うために戦列[せんれつ]を整[ととの]えた。"
  21: "ベニヤミンの子[こ]らは町[まち]から出[で]て、その日[ひ]、イスラエルのうちで二万二千人[にん]を地[ち]に倒[たお]した。"
  22: "イスラエルの男[おとこ]たちは力[ちから]を得[え]て、最初[さいしょ]の日[ひ]にそこに戦列[せんれつ]を整[ととの]えたその場所[ばしょ]で、再[ふたた]び戦[いくさ]のために戦列[せんれつ]を整[ととの]えた。"
  23: "イスラエルの子[こ]らは上[のぼ]って、夕[ゆう]べまで主[しゅ]の前[まえ]で泣[な]き、主[しゅ]に問[と]うて言[い]った。「わたしは再[ふたた]び、兄弟[きょうだい]ベニヤミンとの戦[いくさ]に近[ちか]づくべきでしょうか。」主[しゅ]は言[い]われた。「彼[かれ]に向[む]かって上[のぼ]りなさい。」"
  24: "イスラエルの子[こ]らは二日目[ふつかめ]にベニヤミンに近[ちか]づいた。"
  25: "ベニヤミンは二日目[ふつかめ]に、ギベアから彼[かれ]らを迎[むか]えに出[で]て、さらにイスラエルの子[こ]らのうち一万八千人[にん]を地[ち]に倒[たお]した。彼[かれ]らはみな剣[つるぎ]を抜[ぬ]いていた。"
  26: "イスラエルの子[こ]らはみな、民[たみ]もこぞって上[のぼ]ってベテルに来[き]、主[しゅ]の前[まえ]で泣[な]いた。彼[かれ]らはその日[ひ]断食[だんじつ]し、主[しゅ]の前[まえ]に燔祭[はんさい]と酬恩祭[しゅうおんさい]をささげた。"
  27: "イスラエルの子[こ]らは主[しゅ]に問[と]うた。そのころ、主[しゅ]の契約[けいやく]の箱[はこ]はそこにあった。"
  28: "また、アロンの子[こ]エレアザルの子[こ]であるピネハスが、そのころ、その箱[はこ]の前[まえ]に立[た]っていた。彼[かれ]らは言[い]った。「わたしは再[ふたた]び、兄弟[きょうだい]ベニヤミンとの戦[いくさ]に出[で]るべきでしょうか、それともやめるべきでしょうか。」主[しゅ]は言[い]われた。「上[のぼ]りなさい。明日[あす]、わたしは彼[かれ]をあなたの手[て]に渡[わた]す。」"
  29: "イスラエルの子[こ]らはギベアの周[まわ]りに伏兵[ふくへい]を置[お]いた。"
  30: "イスラエルは三日目[みっかめ]にベニヤミンに向[む]かって進[すす]み、これまでと同[おな]じようにギベアに向[む]かって戦列[せんれつ]を整[ととの]えた。"
  31: "ベニヤミンの子[こ]らは民[たみ]を迎[むか]えに出[で]て、町[まち]から引[ひ]き出[だ]され、これまでと同[おな]じように民[たみ]を打[う]ち始[はじ]めた。すなわち、ベテルへ上[のぼ]る道[みち]とギベアへ上[のぼ]る道[みち]の、野[の]にある道[みち]で、イスラエルのうちのおよそ三十人[にん]を打[う]った。"
  32: "ベニヤミンの子[こ]らは言[い]った。「彼[かれ]らは前[まえ]と同[おな]じようにわたしたちの前[まえ]で倒[たお]れている。」イスラエルの子らは言[い]った。「逃[に]げて、彼[かれ]らを町[まち]から道[みち]へ引[ひ]き出[だ]そう。」"
  33: "イスラエルのすべての男[おとこ]は自分[じぶん]の場所[ばしょ]から立[た]って、バアル・タマルで戦列[せんれつ]を整[ととの]えた。イスラエルの伏兵[ふくへい]はギベアの西[にし]から、自分[じぶん]の場所[ばしょ]から攻[せ]めかかった。"
  34: "そして、全[ぜん]イスラエルから選[えら]ばれた者[もの]一万人[にん]がギベアの前[まえ]に来[き]た。戦[いくさ]は激[はげ]しくなったが、彼[かれ]らは、自分[じぶん]たちに災[わざわ]いが迫[せま]っていることを知[し]らなかった。"
  35: "主[しゅ]はイスラエルの前[まえ]でベニヤミンを打[う]ち破[やぶ]り、イスラエルの子[こ]らはその日[ひ]、ベニヤミンのうち二万五千百人[にん]を打[う]った。彼[かれ]らはみな剣[つるぎ]を抜[ぬ]いていた。"
  36: "ベニヤミンは自分[じぶん]たちが打[う]ち破[やぶ]られたのを見[み]た。イスラエルの男[おとこ]たちはベニヤミンに場所[ばしょ]を譲[ゆず]った。彼[かれ]らがギベアに向[む]けて置[お]いた伏兵[ふくへい]に望[のぞ]みをかけたからである。"
  37: "伏兵[ふくへい]は突[つ]き進[すす]み、ギベアへなだれ込[こ]んだ。そして進[すす]んで、町[まち]をことごとく剣[つるぎ]の刃[は]にかけて打[う]った。"
  38: "イスラエルの男[おとこ]たちが伏兵[ふくへい]に対して定[さだ]めた合図[あいず]は、彼[かれ]らが町[まち]の煙[けむり]の火[ひ]を上[あ]げることだった。"
  39: "イスラエルの男[おとこ]たちは戦[いくさ]の場[ば]で引[ひ]き返[かえ]した。ベニヤミンはイスラエルの男たちを、傷[きず]つけて打[う]ち始[はじ]め、およそ三十人[にん]を打[う]った。彼[かれ]らが言[い]ったからである。「彼[かれ]らは前[まえ]の戦[いくさ]と同[おな]じように、わたしたちの前[まえ]で打[う]ち負[ま]かされている。」"
  40: "すると、町[まち]から煙[けむり]の柱[はしら]が上[あ]がり始[はじ]めた。ベニヤミンは後[うし]ろを振[ふ]り向[む]き、見[み]よ、町[まち]のすべてが天[てん]へ上[のぼ]った。"
  41: "イスラエルの男[おとこ]たちは引[ひ]き返[かえ]した。ベニヤミンの男[おとこ]たちは慌[あわ]てふためき、災[わざわ]いが自分[じぶん]たちに迫[せま]ったのを見[み]た。"
  42: "彼[かれ]らはイスラエルの男[おとこ]の前[まえ]から、荒野[こうや]への道[みち]へ向[む]きを変[か]えた。しかし戦[いくさ]は彼[かれ]らに追[お]いつき、町々[まちまち]から出[で]た者[もの]たちが彼[かれ]らの中[なか]で彼[かれ]らを滅[ほろ]ぼした。"
  43: "彼[かれ]らはベニヤミンを打[う]ち、とどめを刺[さ]そうとして、日[ひ]の昇[のぼ]る東[ひがし]の側[がわ]、ギベアの前[まえ]まで彼[かれ]らを踏[ふ]みにじった。"
  44: "ベニヤミンのうち一万八千人[にん]が倒[たお]れた。これらはみな強[つよ]い者[もの]たちであった。"
  45: "彼[かれ]らは向[む]きを変[か]えて、荒野[こうや]のリンモンの岩[いわ]へ逃[に]げた。イスラエルは道々[みちみち]で彼[かれ]らのうち五千人[にん]を刈[か]り取[と]り、さらにガダアムまで彼[かれ]らの後[あと]を追[お]って、彼[かれ]らのうち二千人[にん]を打[う]った。"
  46: "その日[ひ]、ベニヤミンのうちで倒[たお]れた者[もの]は全部[ぜんぶ]で二万五千人[にん]に及[およ]んだ。彼[かれ]らはみな剣[つるぎ]を抜[ぬ]いた強[つよ]い者[もの]たちであった。"
  47: "しかし、六百人[にん]は向[む]きを変[か]えて、荒野[こうや]のリンモンの岩[いわ]へ逃[に]げ、リンモンの岩[いわ]の中[なか]に四か月[かげつ]とどまった。"
  48: "イスラエルの男[おとこ]たちはベニヤミンの子[こ]らを閉[と]じ込[こ]め、町[まち]の者[もの]から家畜[かちく]に至[いた]るまで、見[み]つかったすべての者[もの]を、剣[つるぎ]の刃[は]にかけて打[う]った。そして、見[み]つかった町々[まちまち]を火[ひ]で焼[や]き払[はら]った。"

notes:
  1: "ἐξεκκλησιάσθη — было созвано (ἐκκλησιάζω); συναγωγή — 会衆, собрание. ὡς ἀνὴρ εἷς — как один человек (семитизм, ср. 20:8, 11). ἀπὸ Δαν καὶ ἕως Βηρσαβεε — от Дана до Вирсавии (ベエル・シェバ, форма корпуса). γῆ Γαλααδ — земля Галаадская (ギレアデ). πρὸς κύριον εἰς Μασσηφα — к Господу в Массифу (マスファ, форма корпуса)."
  2: "τὸ κλίμα παντὸς τοῦ λαοῦ — «строй, отряд всего народа» (κλίμα; слав. «племена»); πεζῶν — пеших; σπωμένων ῥομφαίαν — обнажающих меч (σπάω); τετρακόσιαι χιλιάδες — 400 000. Слав. добавляет «пред лицем Господним» — в gr этого нет."
  3: "ἤκουσαν — услышали; ἀνέβησαν — взошли. Λαλήσατε — «говорите», повелительное; ποῦ ἐγένετο ἡ κακία αὕτη — где произошло это зло (κακία — злоба, злое дело)."
  4: "ὁ ἀνὴρ ὁ Λευίτης — муж-левит; τῆς γυναικὸς τῆς πεφονευμένης — убитой жены (φονεύω); παλλακή — 側女, наложница; καταλῦσαι — «снять постой, переночевать» (καταλύω). В слав. «в гаваон» — ошибка, в gr Γαβαα, Гива."
  5: "ἀνέστησαν ἐπ᾽ ἐμέ — восстали на меня; οἱ παρὰ τῆς Γαβαα — «те, что при Гиве» (слав. «гаваонстии»); περιεκύκλωσαν — окружили; ἠθέλησαν ἀποκτεῖναι — хотели убить; ἐταπείνωσαν καὶ ἐνέπαιξαν — унизили и надругались (ταπεινόω, ἐμπαίζω); ἀπέθανεν — умерла."
  6: "ἐπελαβόμην — взял; ἐμέλισα — рассек на части (μελίζω); ἐξαπέστειλα — разослал; ἐν παντὶ ὁρίῳ κληρονομίας — по всей области наследия (ὅριον — предел); ἀφροσύνη — безумие, срамная глупость."
  7: "ἰδοὺ πάντες ὑμεῖς — вот, все вы; δότε ἑαυτοῖς λόγον καὶ βουλήν — «дайте себе слово и совет», т. е. сообща решите дело (в тексте передано 言葉と相談を決めなさい). Слав. добавляет «зде» — в gr нет."
  8: "ἀνέστη — встал; ὡς ἀνὴρ εἷς λέγων — как один человек, говоря; σκήνωμα — 天幕, шатёр; ἐκκλινοῦμεν — уклонимся, уйдём (ἐκκλίνω)."
  9: "ῥῆμα — слово, дело; ἀναβησόμεθα ἐπ᾽ αὐτὴν ἐν κλήρῳ — взойдём на неё по жребию (κλῆρος). Стих обрывается на «и взойдём»; продолжение — в ст. 10 (в тексте конец с «、»)."
  10: "λήμψομαι — возьму; δέκα ἄνδρας τοῖς ἑκατόν — по десять мужей на сто (и далее 100 на 1000, 1000 на 10 000); ἐπισιτισμός — продовольствие, провиант; τοῖς εἰσπορευομένοις — «входящим», тем, кто пойдёт; ἐπιτελέσαι — исполнить над Гибой; ἀφροσύνη — глупость."
  11: "συνήχθη — собрался (συνάγω); ἐκ τῶν πόλεων — из городов; ὡς ἀνὴρ εἷς ἐρχόμενοι — приходя как один человек."
  12: "ἐξαπέστειλαν — послали; ἐν πάσῃ φυλῇ Βενιαμιν — во всё колено Вениамина; Τίς ἡ κακία αὕτη ἡ γενομένη ἐν ὑμῖν — что это за зло, бывшее у вас."
  13: "τοὺς ἄνδρας τοὺς ἀσεβεῖς — мужей нечестивых; υἱοὺς Βελιαλ — сынов Велиара (בְּלִיַּעַל, «негодные»; слав. «велиаловых»); θανατώσομεν — умертвим; ἐξαροῦμεν κακίαν — истребим зло; εἰσακοῦσαι τῆς φωνῆς — послушать голоса (εἰσακούω)."
  14: "συνήχθησαν — собрались; ἐξελθεῖν τοῦ πολεμῆσαι — выйти воевать (родительный цели при ἐξέρχομαι)."
  15: "ἐπεσκέπησαν — были пересчитаны (ἐπισκέπτομαι); εἴκοσι καὶ πέντε χιλιάδες — 25 000; χωρὶς τῶν κατοικούντων τὴν Γαβαα — кроме жителей Гивы; ἑπτακόσιοι ἄνδρες νεανίσκοι ἐκλεκτοί — 700 мужей, юношей избранных (в csl отнесены к ст. 16)."
  16: "ἀμφοτεροδέξιοι — «обеерукие», владеющие обеими руками (в евр. левши; слав. «ободесноручных»); σφενδονῆται — пращники (σφενδόνη — праща); πρὸς τὴν τρίχα — в волос; οὐ διαμαρτάνοντες — не промахиваясь (διαμαρτάνω)."
  17: "ἐπεσκέπησαν — пересчитаны; χωρὶς τῶν υἱῶν Βενιαμιν — кроме сынов Вениамина; σπωμένων ῥομφαίαν — обнажающих меч; ἄνδρες πολεμισταί — мужи воины."
  18: "ἀνέβησαν εἰς Βαιθηλ — взошли в Вефиль; ἐπηρώτησαν ἐν τῷ θεῷ — вопросили Бога (ἐν + дат. — «у Бога»); ἀφηγούμενος — предводительствуя (ἀφηγέομαι); Ιουδας ἀναβήσεται ἀφηγούμενος — Иуда взойдёт предводителем."
  19: "παρενέβαλον ἐπὶ τὴν Γαβαα — расположились станом против Гивы (παρεμβάλλω). Слав. добавляет «заутра» — в gr нет."
  20: "ἐξῆλθεν — вышел; παρετάξαντο — построились (παρατάσσομαι); μετ᾽ αὐτῶν εἰς πόλεμον — «с ними на войну», т. е. против них; πρὸς τὴν Γαβαα — против Гивы."
  21: "διέφθειραν — погубили (διαφθείρω); ἐπὶ τὴν γῆν — на землю (пали); δύο καὶ εἴκοσι χιλιάδας — 22 000. Слав. «избиша» — то же."
  22: "ἐνίσχυσεν — укрепился (ἐνισχύω); προσέθεντο — «приложили», снова (προστίθημι); παρατάξασθαι πόλεμον — построиться на войну; ἐν τῷ τόπῳ, ᾧ παρετάξαντο — на месте, где построились."
  23: "ἀνέβησαν — взошли; ἔκλαυσαν ἕως ἑσπέρας — плакали до вечера; ἐπηρώτησαν ἐν κυρίῳ — вопросили Господа; Εἰ προσθῶ προσεγγίσαι — «приложу ли приблизиться», 1-е л. ед. ч. (слав. «приложим»); Ἀνάβητε πρὸς αὐτόν — взойдите к нему."
  24: "προσῆλθοσαν — подступили (προσέρχομαι); τῇ ἡμέρᾳ τῇ δευτέρᾳ — во второй день."
  25: "ἐξῆλθεν ... εἰς ἀπάντησιν — вышел навстречу; διέφθειρεν ἐκ τοῦ λαοῦ — погубил из народа; ὀκτωκαίδεκα χιλιάδας — 18 000; ἐσπασμένοι ῥομφαίαν — обнажившие меч."
  26: "ἤλθοσαν εἰς Βαιθηλ — пришли в Вефиль; ἐνήστευσαν — постились (νηστεύω); ἀνήνεγκαν ὁλοκαυτώματα σωτηρίου — вознесли всесожжения спасения, т. е. мирные жертвы (в корпусе 酬恩祭). Слав. добавляет «седоша тамо» и «даже до вечера» — в gr нет."
  27: "ἐπηρώτησαν ἐν κυρίῳ — вопросили Господа; κιβωτὸς διαθήκης κυρίου — ковчег завета Господня; ἐν ταῖς ἡμέραις ἐκείναις — в те дни. Стих кончается на «,», продолжение — в ст. 28."
  28: "Φινεες υἱὸς Ελεαζαρ υἱοῦ Ααρων — Финеес, сын Елеазара, сына Аарона; παρεστηκὼς ἐνώπιον αὐτῆς — предстоящий пред нею (ковчегом, ж. р.); λέγων — «говоря»: грамматически при Финеесе, по смыслу вопрос задают сыны Израиля (так в csl и ru); ἢ κοπάσω — «или успокоюсь», т. е. прекратить ли; αὔριον παραδώσω αὐτὸν ἐν χειρί σου — завтра предам его в руку твою."
  29: "ἔθηκαν ... ἔνεδρα ... κύκλῳ — поставили засаду вокруг (ἔνεδρον — засада; κύκλῳ — вокруг)."
  30: "ἔταξεν — поставил (τάσσω); ἐν τῇ ἡμέρᾳ τῇ τρίτῃ — в третий день; καθὼς ἅπαξ καὶ ἅπαξ — «как раз и раз», т. е. как прежде (слав. «яко единою и единою»)."
  31: "ἐξειλκύσθησαν — были вытянуты, выманены (ἐξελκύω); ἤρξαντο τύπτειν — начали поражать; καθὼς ἅπαξ καὶ ἅπαξ — как прежде; ὡσεὶ τριάκοντα ἄνδρας — около 30 человек; ἐν τῷ ἀγρῷ — в поле."
  32: "Προσκόπτουσιν — «спотыкаются, падают» (προσκόπτω); Φύγωμεν καὶ ἐκσπάσωμεν — убежим и вырвем, отвлечём (ἐκσπάω); εἰς τὰς ὁδούς — на дороги. Слав. добавляет «и сотвориша тако» — в gr нет."
  33: "ἀνέστη ἐκ τοῦ τόπου — встал с места; ἐν Βααλθαμαρ — в Ваал-Фамаре (バアル・タマル); ἐπάλαιεν — «боролся», здесь устремился (παλαίω; слав. «нахождаше»); ἀπὸ δυσμῶν τῆς Γαβαα — с запада Гивы."
  34: "παρεγένοντο ἐξ ἐναντίας — пришли напротив; ἐκλεκτῶν — избранных; ὁ πόλεμος ἐβαρύνθη — война отяжелела, стала жестокой (βαρύνω); ἀφῆπται αὐτῶν ἡ κακία — «охватило их зло» (ἀφάπτω, перфект)."
  35: "ἐτρόπωσεν — обратил в бегство, поразил (τροπόω); κατὰ πρόσωπον Ισραηλ — пред лицом Израиля; διέφθειραν — погубили; εἴκοσι καὶ πέντε χιλιάδας καὶ ἑκατὸν ἄνδρας — 25 100."
  36: "τετρόπωται — поражён (перфект от τροπόω); ἔδωκεν ... τόπον — уступил место; ἤλπισαν ἐπὶ τὸ ἔνεδρον — понадеялись на засаду (ἐλπίζω ἐπί)."
  37: "ὥρμησεν — устремилась (ὁρμάω); ἐξεχύθησαν — излились, хлынули (ἐκχέω); ἐπάταξαν ... ἐν στόματι ῥομφαίας — поразили устами меча."
  38: "συνταγή — уговор, условленный знак (συντάσσω); πρὸς τὸ ἔνεδρον — с засадой; ἀνενέγκαι πυρσὸν τοῦ καπνοῦ — поднять огненный знак, дым (πυρσός — сигнальный огонь, факел)."
  39: "ἀνέστρεψεν — повернул (ἀναστρέφω); ἦρκται τοῦ τύπτειν — начал поражать; τραυματίας — раненых (или «нанося раны»); Πλὴν τροπούμενος τροποῦται — «однако поражением поражается» (усилительная конструкция); ἐναντίον ἡμῶν — пред нами."
  40: "ὁ πυρσὸς ... στῦλος καπνοῦ — сигнальный огонь столпом дыма (στῦλος — столп); ἐπέβλεψεν ὀπίσω — оглянулся назад (ἐπιβλέπω); συντέλεια τῆς πόλεως — «завершение города», т. е. дым от всего города (слав. «скончание града»)."
  41: "ἀπέστρεψεν — повернул; ἔσπευσεν — поспешил, оробел (σπεύδω); ἧπται αὐτοῦ ἡ κακία — «коснулось его зло» (ἅπτω, перфект)."
  42: "ἔκλιναν — уклонились, побежали (κλίνω); εἰς τὴν ὁδὸν τῆς ἐρήμου — на дорогу пустыни; κατέφθασεν — настиг (καταφθάνω); οἱ ἀπὸ τῶν πόλεων — «те, что из городов»; ἐν μέσῳ αὐτῶν — среди них."
  43: "ἔκοψαν — били, рубили (κόπτω); καταπαῦσαι κατάπαυσιν — «успокоить успокоением», т. е. добить (в тексте とどめを刺そうとして); κατεπάτησαν — попрали (καταπατέω); ἕως ἐξ ἐναντίας τῆς Γαβαα ἀπὸ ἀνατολῶν ἡλίου — до против Гивы, от восхода солнца."
  44: "ἔπεσαν — пали; ὀκτωκαίδεκα χιλιάδες — 18 000; σὺν πᾶσιν τούτοις ἄνδρες δυνατοί — со всеми ними мужи сильные."
  45: "ἐξέκλιναν — уклонились; πέτραν τὴν Ρεμμων — скала Риммон (リンモンの岩); ἐκαλαμήσαντο — «сжали, как колосья» (καλαμάομαι); προσεκολλήθησαν ὀπίσω — прилепились вслед (προσκολλάω); ἕως Γαδααμ — до Гадаама (Γαδααμ; в ru «Гидом»); δισχιλίους — 2000."
  46: "ἐγένοντο ... οἱ πεπτωκότες — оказались павшие; σπωμένων ῥομφαίαν — обнажавших меч; 25 000; ἄνδρες δυνατοί — мужи сильные."
  47: "ἐξέκλιναν — уклонились; πέτρα Ρεμμων — скала Риммон; ἑξακόσιοι — 600; τετράμηνον — четыре месяца (τετράμηνος)."
  48: "ἀπέκλεισεν — замкнул, запер (ἀποκλείω); ἀπὸ πόλεως ἑξῆς ἕως κτήνους — от города далее до скота (ἑξῆς — «подряд, затем»); ἕως παντὸς τοῦ εὑρεθέντος — до всего найденного; ἐξαπέστειλαν ἐν πυρί — предали огню (ἐξαποστέλλω, букв. «послали»)."
