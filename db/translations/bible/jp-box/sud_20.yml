# jp-box, Судьи, глава 20. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в этой главе нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 20: сбор в Массифе и речь левита (1–11), посольство к Вениамину (12–13),
# первый и второй бой (14–25), плач и пост в Вефиле, вопрошание (26–28),
# засада и поражение Вениамина (29–48).
# Речь Бога — 「…」 (18, 23, 28); речи людей — 「…」 (3, 4–7, 8–10, 12–13,
# 23, 28, 32, 39). Вложенной речи в главе нет.
# Нумерация по gr: 48 стихов. Фраза о семистах отборных юношах разрезана
# границей стихов: gr 20:15 кончается «семьсот… юношей», 20:16 начинается
# «двурукие» (в csl 700 отнесены к ст. 16).
# 〔…〕 нет: на месте всех стихов в gr-lxx-byz стоит текст, а не «.».
# Сносок ⟨…⟩ нет: 契約の箱, 燔祭, 酬恩祭, レビ人, 祭司, 嗣業, 聖絶, 伏兵,
# 天幕 уже пояснены в корпусе.
# jp-ni не использовался.

