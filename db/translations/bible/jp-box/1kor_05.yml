# jp-box, Первое послание к Коринфянам, глава 5. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 5: кровосмешение в общине и предание сатане (1–5), закваска и Пасха (6–8),
# прежнее письмо и отлучение блудника (9–13).
# Красного (<j>) и синего (<mo>) нет: прямой речи Христа в главе нет.
# 〔…〕 в главе нет: все стихи в gr-lxx-byz есть. В 5:4–5 церковный текст
# (Елизаветинская «Иисуса Христа», jp-joc) читает «Иисуса Христа» дважды и
# «Господа нашего Иисуса Христа»; переведено по базе — 主イエス, 主の日
# (ср. решение по Рим 15:19: база, не византийское дополнение).
# Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

tr_code: jp-box
book: 1kor
chapter: 5
draft: true

verses:
  1: "実際[じっさい]、あなたがたの間[あいだ]に淫[いん]らな行[おこな]いがあると聞[き]こえている。しかも、異邦人[いほうじん]の間[あいだ]にさえないような淫[いん]らな行[おこな]いであって、父[ちち]の妻[つま]を自分[じぶん]のものにしている者[もの]がいるというのである。"
  2: "あなたがたは高[たか]ぶっている。むしろ、悲[かな]しんで、この行[おこな]いをした者[もの]があなたがたの間[あいだ]から取[と]り除[のぞ]かれるようにすべきではなかったのか。"
  3: "わたしは、体[からだ]では離[はな]れていても、霊[れい]では共[とも]にいて、あたかもそこに居合[いあ]わせているかのように、このようなことを行[おこな]った者[もの]をすでに裁[さば]いたのである。"
  4: "あなたがたが集[あつ]まるとき、わたしの霊[れい]も共[とも]にいて、わたしたちの主[しゅ]イエスの名[な]によって、またその力[ちから]によって、その者[もの]をサタンに引[ひ]き渡[わた]すのである。"
  5: "それは、肉[にく]が滅[ほろ]びて、霊[れい]が主[しゅ]の日[ひ]に救[すく]われるためである。"
  6: "あなたがたの誇[ほこ]りは良[よ]くない。あなたがたは知[し]らないのか。少[すこ]しのパン種[ぱんだね]が練[ね]り粉[こ]全体[ぜんたい]を発酵[はっこう]させるということを。"
  7: "古[ふる]いパン種[ぱんだね]をすっかり除[のぞ]き去[さ]って、新[あたら]しい練[ね]り粉[こ]となりなさい。あなたがたはパン種[ぱんだね]のない者[もの]なのだから。それというのも、わたしたちの過越祭[すぎこしまつり]の小羊[こひつじ]であるキリストが屠[ほふ]られたからである。"
  8: "だから、わたしたちは祭[まつ]りを行[おこな]おう。古[ふる]いパン種[ぱんだね]によってではなく、悪意[あくい]と邪悪[じゃあく]のパン種[ぱんだね]によってでもなく、純粋[じゅんすい]と真理[しんり]のパン種[ぱんだね]のないパンによってである。"
  9: "わたしは手紙[てがみ]で、淫[いん]らな行[おこな]いをする者[もの]たちと交[まじ]わらないようにと書[か]いた。"
  10: "しかし、それはこの世[よ]の淫[いん]らな行[おこな]いをする者[もの]たち、あるいは貪欲[どんよく]な者[もの]たち、奪[うば]い取[と]る者[もの]たち、偶像[ぐうぞう]を拝[おが]む者[もの]たちを指[さ]して言[い]ったのではない。そうでなければ、あなたがたはこの世[よ]から出[で]て行[い]かねばならないことになる。"
  11: "しかし、わたしが今[いま]書[か]いたのは、兄弟[きょうだい]と呼[よ]ばれていながら淫[いん]らな行[おこな]いをする者[もの]、貪欲[どんよく]な者[もの]、偶像[ぐうぞう]を拝[おが]む者[もの]、人[ひと]を罵[ののし]る者[もの]、酒[さけ]に酔[よ]う者[もの]、奪[うば]い取[と]る者[もの]がいたら、そのような者[もの]とは交[まじ]わってはならない、彼[かれ]と共[とも]に食[しょく]事[じ]をしてさえない、ということである。"
  12: "なぜなら、外[そと]の者[もの]たちを裁[さば]くことが、わたしに何[なん]の関[かか]わりがあろうか。あなたがたが裁[さば]くのは、内[うち]の者[もの]たちではないか。"
  13: "外[そと]の者[もの]たちは、神[かみ]が裁[さば]きを行[おこな]われる。あなたがたは、その悪[あく]い者[もの]をあなたがたの中[なか]から除[のぞ]き去[さ]りなさい。"

notes:
  1: "Ὅλως — «совершенно, вообще»; 実際. πορνεία — 淫らな行い. τοῦ πατρὸς ἔχειν — «иметь жену отца», то есть мачеху; 父の妻を自分のものにしている, без смягчения."
  2: "πεφυσιωμένοι — «надменные»; 高ぶっている. ἐπενθήσατε — «оплакали»; 悲しんで. ἵνα ἀρθῇ — «чтобы удалён был»; 取り除かれるように, призыв в форме вопроса."
  3: "ἀπὼν τῷ σώματι παρὼν δὲ τῷ πνεύματι — 体では離れていても霊では共にいて. κέκρικα — 裁いた (перфект, решение уже принято)."
  4: "В критической базе τοῦ κυρίου [ἡμῶν] Ἰησοῦ без Χριστοῦ; церковный текст (Елизаветинская «Иисуса Христа», jp-joc) читает с Χριστός — оставлено по базе: 主イエス (ср. Рим 15:19). σὺν τῇ δυνάμει — сила Господа; 力."
  5: "παραδοῦναι τῷ Σατανᾷ εἰς ὄλεθρον τῆς σαρκός — サタンに引き渡して、肉が滅びるため. «Предать сатане» не смягчено. ἡμέρᾳ τοῦ κυρίου — 主の日; в церковном тексте «Господа нашего Иисуса Христа», по базе — 主の日."
  6: "καύχημα — 誇り. μικρὰ ζύμη ὅλον τὸ φύραμα ζυμοῖ — 少しのパン種が練り粉全体を発酵させる; ср. Мф 13:33 / Мк 8:15, сноска не повторяется."
  7: "ἐκκαθάρατε — 除き去って (аорист-повеление). νέον φύραμα — 新しい練り粉. τὸ πάσχα ἡμῶν ἐτύθη Χριστός — 過越祭の小羊であるキリストが屠られた; сноска на 過越祭 уже дана (Мф 26:2)."
  8: "ἑορτάζωμεν — 祭りを行おう (hortative). εἰλικρινείας — 純粋; ἀληθείας — 真理."
  10: "ἅρπαξιν — 奪い取る者. ἐπεὶ ὠφείλετε ἄρα ἐκ τοῦ κόσμου ἐξελθεῖν — そうでなければ、この世から出て行かねばならないことになる."
  11: "ὀνομαζόμενος — 呼ばれていながら. συνεσθίειν — 共に食事をしてさえ, усиление μηδέ."
  12: "τί γάρ μοι… — 何の関わりがあろうか, γάρ передан なぜなら."
  13: "ὁ πονηρός — 悪い者, конкретно согрешивший; ἐξάρατε — 除き去りなさい."
