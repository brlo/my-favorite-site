# jp-box, Иона, глава 2. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 2 (совпадает, 11 стихов).
# Деление на стихи совпадает с gr, слав. и ru (2:1–11); молитва Ионы — 2:3–10.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1 Господь повелевает большому киту поглотить Иону; три дня и три ночи
# во чреве; 2–3 Иона молится из чрева; 4–7 глубины, волны, бездна, засовы земли;
# 8–9 память о Господе и молитва, доходящая до храма; 9 суетные и ложные оставили
# милость; 10 жертва хвалы и обет; 11 кит извергает Иону на сушу.
# Голоса: 1 — повествование; 2 — повествование с вводом молитвы (без кавычек, как
# в 1:1); молитва Ионы — одно 「…» с 3 по 10 (открывается после «и сказал»);
# 11 — повествование. Внутри молитвы кавычек нет.
# κῆτος передано 鯨 (церковная традиция); в Иов 3:8 в корпусе то же слово —
# 大いなる海獣, различие оговорено в notes.
#
tr_code: jp-box
book: ion
chapter: 2
draft: true

verses:
  1: "主[しゅ]は大[おお]きな鯨[くじら]に命[めい]じてヨナを飲[の]み込[こ]ませた。ヨナは三日[みっか]三晩[さんばん]、鯨[くじら]の腹[はら]のうちにいた。"
  2: "ヨナは鯨[くじら]の腹[はら]のうちから、自分[じぶん]の神[かみ]である主[しゅ]に祈[いの]って、"
  3: "言[い]った。「わたしは苦[くる]しみのうちで主[しゅ]に呼[よ]びかけ、主[しゅ]はわたしに答[こた]えられた。よみの腹[はら]からわたしは叫[さけ]び、あなたはわたしの声[こえ]を聞[き]かれた。"
  4: "あなたはわたしを海[うみ]の心[こころ]の深[ふか]みに投[な]げ込[こ]まれた。流[なが]れがわたしを囲[かこ]み、あなたのすべてもろもろの高[たか]みと波[なみ]がわたしの上[うえ]を過[す]ぎ去[さ]った。"
  5: "わたしは言[い]った。『わたしはあなたの目[め]から追[お]い払[はら]われた』と。わたしはもう一度[いちど]、あなたの聖[せい]なる宮[みや]を仰[あお]ぎ見[み]ることができるだろうか。"
  6: "水[みず]はわたしの魂[たましい]にまで及[およ]び、最後[さいご]の淵[ふち]がわたしを囲[かこ]んだ。わたしの頭[あたま]は山[やま]の裂[さけ]目[め]に沈[しず]んだ。"
  7: "わたしは地[ち]に下[くだ]った。そのかんぬきは永遠[えいえん]にわたしを閉[と]じ込[こ]めていた。わたしの命[いのち]が朽[く]ちる所[ところ]から上[のぼ]りますように、わたしの神[かみ]である主[しゅ]よ。"
  8: "わたしの魂[たましい]がわたしから消[き]え去[さ]るとき、わたしは主[しゅ]を思[おも]い起[おこ]した。わたしの祈[いの]りはあなたに、あなたの聖[せい]なる宮[みや]に届[とど]いた。"
  9: "むなしいもの、偽[いつわ]りなものを守[まも]る者[もの]たちは、自分[じぶん]のあわれみを捨[す]て去[さ]る。"
  10: "しかし、わたしは感謝[かんしゃ]と賛美[さんび]の声[こえ]をもってあなたに犠[ぎ]牲[せい]をささげる。わたしが誓[ちか]ったことをあなたに果[た]す。救[すく]いは主[しゅ]のものである。」"
  11: "主[しゅ]は鯨[くじら]に命[めい]じ、鯨[くじら]はヨナを陸[りく]に吐[は]き出[だ]した。"

notes:
  1: "προσέταξεν κύριος κήτει μεγάλῳ καταπιεῖν τὸν Ιωναν — «повелел Господь великому киту поглотить Иону» (καταπίνω — проглатывать); κήτει μεγάλῳ — κῆτος означает морское чудовище, «кит» (слав. «кит великий»); в Иов 3:8 то же слово передано в корпусе 大いなる海獣, здесь — 鯨 по церковной традиции (сомнительное место, см. отчёт). ἐν τῇ κοιλίᾳ τοῦ κήτους — «во чреве кита»; τρεῖς ἡμέρας καὶ τρεῖς νύκτας — «три дня и три ночи»."
  2: "προσηύξατο Ιωνας πρὸς κύριον τὸν θεὸν αὐτοῦ — «помолился Иона Господу Богу своему»; ἐκ τῆς κοιλίας τοῦ κήτους — «из чрева кита». В LXX стих обрывается без «и сказал»; ввод речи — в 2:3, кавычки не открываются здесь."
  3: "Ἐβόησα ἐν θλίψει μου πρὸς κύριον τὸν θεόν μου — «воззвал я в скорби моей к Господу Богу моему» (слав. «возопих в скорби моей»); καὶ εἰς ἤκουσέν μου — «и Он услышал меня» (в LXX стоит εἰς — описка вместо καί); ἐκ κοιλίας ᾅδου κραυγῆς μου — «из чрева ада вопль мой» (ᾅδης — преисподняя, よみ по корпусу); ἤκουσας φωνῆς μου — «Ты услышал голос мой»."
  4: "ἀπέρριψάς με εἰς βάθη καρδίας θαλάσσης — «низверг меня в глубины сердца моря»; ποταμοί με ἐκύκλωσαν — «реки окружили меня»; πάντες οἱ μετεωρισμοί σου — «все возвышения (высоты) Твои» (μετεωρισμός — поднятие, вздымание; слав. «вся высоты твоя»; в ru/МТ «все воды Твои» — иное чтение, в текст не внесено); τὰ κύματά σου ἐπ᾽ ἐμὲ διῆλθον — «волны Твои надо мною прошли»."
  5: "Ἀπῶσμαι ἐξ ὀφθαλμῶν σου — «отринут я от очей Твоих» (слав. «отринуся от очию твоею»), внутренняя речь — 『…』; ἆρα προσθήσω τοῦ ἐπιβλέψαι πρὸς τὸν ναὸν τὸν ἅγιόν σου — «неужели я ещё приложу призреть ко святому храму Твоему?» — вопрос оставлен вопросом, без разрешения (в ru переведён утвердительно)."
  6: "περιεχύθη ὕδωρ μοι ἕως ψυχῆς — «облилась вода надо мною до души» (περιχέω — обливать); ἄβυσσος ἐκύκλωσέν με ἐσχάτη — «бездна окружила меня последняя» (слав. «бездна обыде мя последняя»); ἔδυ ἡ κεφαλή μου εἰς σχισμὰς ὀρέων — «голова моя погрузилась в расселины гор» (в ru/МТ «морскою травою обвита была голова моя» — другое чтение)."
  7: "κατέβην εἰς γῆν, ἧς οἱ μοχλοὶ αὐτῆς κάτοχοι αἰώνιοι — «сошёл я в землю, у которой засовы её — держатели вечные» (μοχλός — засов, запор; κάτοχος — держащий; слав. «вереи ея заклепи вечнии»); ἀναβήτω φθορὰ ζωῆς μου — «да взойдёт нетление жизни моей» (ἀναβήτω — 3 л. ед. ч. повелительного наклонения, пожелание; φθορά — тление; слав. «да взыдет из истления живот мой»); κύριε ὁ θεός μου — обращение в конце стиха, порядок сохранён."
  8: "ἐν τῷ ἐκλείπειν ἀπ᾽ ἐμοῦ τὴν ψυχήν μου — «когда оскудевала во мне душа моя» (ἐκλείπω — оставлять, изнемогать); τοῦ κυρίου ἐμνήσθην — «о Господе я вспомнил»; ἔλθοι πρὸς σὲ ἡ προσευχή μου — «да придёт к Тебе молитва моя» (слав. «да приидет к тебе молитва моя»); εἰς ναὸν ἅγιόν σου — «ко святому храму Твоему»."
  9: "φυλασσόμενοι μάταια καὶ ψευδῆ — «хранящие суетное и ложное»; ἔλεος αὐτῶν ἐγκατέλιπον — «милость свою оставили» — тёмное место LXX (слав. то же: «милость свою оставиша»); вероятный смысл — «оставили милость, на которую надеялись»; в тексте без сглаживания."
  10: "μετὰ φωνῆς αἰνέσεως καὶ ἐξομολογήσεως θύσω σοι — «с голосом хвалы и исповедания принесу Тебе жертву» (ἐξομολόγησις — исповедание, благодарение; слав. «со гласом хваления и исповедания пожру тебе»); ὅσα ηὐξάμην, ἀποδώσω σοι — «что обещал, воздам Тебе»; σωτηρίου τῷ κυρίῳ — «спасение Господу» (слав. «во спасение мое Господеви» — с «мое», чего в LXX нет; в тексте 救いは主のもの)."
  11: "προσετάγη τῷ κήτει — «повелено было киту» (страдательный оборот без подлежащего; слав. «повеле Господь китови» вносит Господа — по паритету в тексте 主は…命じ); ἐξέβαλεν τὸν Ιωναν ἐπὶ τὴν ξηράν — «изверг Иону на сушу»."
