verses:
  1: "主[しゅ]はモーセに語[かた]って言[い]われた。"
  2: "「アロンとその子[こ]らに告[つ]げなさい。彼[かれ]らは、イスラエルの子らがわたしに聖別[せいべつ]する聖[せい]なるものに対[たい]して、注意[ちゅうい]を払[はら]わなければならない。わたしの聖なる名[な]を汚[けが]してはならない。わたしは主[しゅ]である。"
  3: "彼[かれ]らに言[い]いなさい。あなたがたの代[よ]々[よ]の者[もの]のうち、だれでも、自分[じぶん]の汚[けが]れが自分の上[うえ]にあるのに、イスラエルの子[こ]らが主[しゅ]に聖別[せいべつ]する聖[せい]なるものに近[ちか]づくなら、その者[もの]はわたしの前[まえ]から断[た]たれる。わたしはあなたがたの神[かみ]、主[しゅ]である。」"
  4: "「アロン祭司[さいし]の子孫[しそん]の者[もの]で、重[おも]い皮膚病[ひふびょう]にかかっている者、また漏[も]れのある者は、清[きよ]くなるまで聖[せい]なるものを食[た]べてはならない。また、死[し]んだ者[もの]によって身[み]を汚[けが]した者、また自分[じぶん]から交[まじ]わりの種[たね]が出[で]た者、"
  5: "また、自分[じぶん]を汚[けが]す汚れた這[は]うものに触[ふ]れた者[もの]、また、あらゆる汚[けが]れによって自分を汚れさせる人[ひと]に触れた者、"
  6: "そのようなものに触[ふ]れた者[もの]は、夕[ゆう]べまで汚[けが]れた者[もの]となる。からだを水[みず]で洗[あら]わないかぎり、聖[せい]なるものを食[た]べてはならない。"
  7: "日[ひ]が沈[しず]むと、その者[もの]は清[きよ]くなり、そのとき聖[せい]なるものを食[た]べることができる。それはその者の食[た]べ物[もの]だからである。"
  8: "彼[かれ]は死[し]に倒[たお]れたもの、獣[けもの]に裂[さ]かれたものを食[た]べて、それらによって身[み]を汚[けが]してはならない。わたしは主[しゅ]である。」"
  9: "「彼[かれ]らはわたしの戒[いまし]めを守[まも]らなければならない。それを汚[けが]して、そのために罪[つみ]を負[お]い、死[し]ぬことのないためである。わたしは彼らを聖別[せいべつ]する神[かみ]、主[しゅ]である。」"
  10: "「すべての他国人[たこくじん]は聖[せい]なるものを食[た]べてはならない。祭司[さいし]のところに住[す]む者[もの]も、雇[やと]われた者も、聖なるものを食べてはならない。"
  11: "しかし、祭司[さいし]が銀[ぎん]で買[か]い取[と]った者[もの]は、その食[た]べ物[もの]を食べることができる。また、その家[いえ]に生[う]まれた者[もの]たちも、祭司の食べ物を食べることができる。"
  12: "祭司[さいし]の娘[むすめ]が他国人[たこくじん]の妻[つま]となったなら、彼女[かのじょ]は聖[せい]なる捧[ささ]げ物[もの]の初穂[はつほ]を食[た]べてはならない。"
  13: "祭司[さいし]の娘[むすめ]が寡婦[かふ]となったか、夫[おっと]から追[お]い出[だ]され、しかも子[こ]がなかったなら、彼女[かのじょ]は若[わか]かったころのように父[ちち]の家[いえ]に戻[もど]り、父の食[た]べ物[もの]を食べることができる。しかし、すべての他国人[たこくじん]はそれを食べてはならない。」"
  14: "「もし人[ひと]が知[し]らずに聖[せい]なるものを食[た]べたなら、その者[もの]はそれに五分[ごぶん]の一[いち]を加[くわ]えて、聖なるものを祭司[さいし]に返[かえ]さなければならない。"
  15: "祭司[さいし]たちは、イスラエルの子[こ]らが主[しゅ]に取[と]り分[わ]ける聖[せい]なるものを汚[けが]してはならない。"
  16: "そうすれば、彼[かれ]らは自分[じぶん]たちの聖[せい]なるものを食[た]べるとき、愆[けん]の不法[ふほう]を自分たちの上[うえ]に招[まね]くことはない。わたしは彼らを聖別[せいべつ]する主[しゅ]だからである。」"
  17: "主[しゅ]はモーセに語[かた]って言[い]われた。"
  18: "「アロンとその子[こ]ら、およびイスラエルの全会衆[ぜんかいしゅう]に告[つ]げ、彼[かれ]らに言[い]いなさい。イスラエルの子らのうちの者[もの]であれ、イスラエルで彼らに加[くわ]わった寄留者[きりゅうしゃ]の子らのうちの者であれ、だれでも、誓願[せいがん]によってであれ、自[みずか]らの望[のぞ]みによってであれ、その捧[ささ]げ物[もの]を主[しゅ]への燔祭[はんさい]として献[ささ]げるなら、"
  19: "それはあなたがたに受[う]け入[い]れられるために、牛[うし]の群[む]れ、羊[ひつじ]の群れ、山羊[やぎ]の群れから、傷[きず]のない雄[おす]でなければならない。"
  20: "傷[きず]のあるものは、何[なに]であれ主[しゅ]に献[ささ]げてはならない。それはあなたがたに受[う]け入[い]れられないからである。」"
  21: "「人[ひと]が、誓願[せいがん]を果[は]たすために、あるいは自[みずか]らの望[のぞ]みによって、またあなたがたの祭[まつ]りのときに、牛[うし]の群[む]れか羊[ひつじ]の群れから、主[しゅ]に酬恩祭[しゅうおんさい]を献[ささ]げるなら、それは受[う]け入[い]れられるために傷[きず]のないものでなければならない。どんな傷もあってはならない。」"
  22: "「目[め]の見[み]えないもの、傷[きず]ついたもの、舌[した]を切[き]られたもの、いぼのあるもの、かさぶたのできたもの、湿疹[しっしん]のあるものは、主[しゅ]に献[ささ]げてはならない。それらを主への焼[や]き尽[つ]くす捧[ささ]げ物[もの]として祭壇[さいだん]にささげてはならない。」"
  23: "「耳[みみ]を切[き]られたもの、尾[お]を短[みじか]くされたもので、子牛[こうし]や羊[ひつじ]は、あなたのために屠[ほふ]ってよい。しかし、誓願[せいがん]のためには受[う]け入[い]れられない。」"
  24: "「睾丸[こうがん]の砕[くだ]けたもの、押[お]しつぶされたもの、切[き]り取[と]られたもの、引[ひ]き裂[さ]かれたものは、主[しゅ]に献[ささ]げてはならない。あなたがたの土地[とち]でも、そのようなことをしてはならない。」"
  25: "「また、他国人[たこくじん]の手[て]から、これらのものをあなたがたの神[かみ]への捧[ささ]げ物[もの]として献[ささ]げてはならない。それらは損[そこ]なわれたものであり、傷[きず]のあるものだからである。それらはあなたがたに受[う]け入[い]れられない。」"
  26: "主[しゅ]はモーセに語[かた]って言[い]われた。"
  27: "「子牛[こうし]、羊[ひつじ]、山羊[やぎ]は、生[う]まれたなら七日[なぬか]の間[あいだ]、母[はは]のもとにとどまらなければならない。八日[ようか]目[め]から後[のち]は、主[しゅ]への捧[ささ]げ物[もの]、焼[や]き尽[つ]くす捧げ物として受[う]け入[い]れられる。」"
  28: "「雌[めす]の牛[うし]や羊[ひつじ]と、その子[こ]とを同[おな]じ日[ひ]に屠[ほふ]ってはならない。」"
  29: "「あなたがたが主[しゅ]に喜[よろこ]びの誓願[せいがん]の犠牲[ぎせい]を献[ささ]げるなら、それが受[う]け入[い]れられるように献げなさい。」"
  30: "「それはその日[ひ]のうちに食[た]べなければならない。その肉[にく]を朝[あさ]まで残[のこ]してはならない。わたしは主[しゅ]である。」"
  31: "「あなたがたはわたしの戒[いまし]めを守[まも]り、それを行[おこな]わなければならない。〔わたしは主[しゅ]である。〕」"
  32: "「あなたがたはわたしの聖[せい]なる名[な]を汚[けが]してはならない。わたしはイスラエルの子[こ]らの間[あいだ]で聖[せい]なる者[もの]とされる。わたしはあなたがたを聖別[せいべつ]する主[しゅ]、"
  33: "エジプトの地[ち]からあなたがたを導[みちび]き出[だ]し、あなたがたの神[かみ]となる者[もの]である。わたしは主[しゅ]である。」"

notes:
  1: "Καὶ ἐλάλησεν κύριος πρὸς Μωυσῆν λέγων — формула введения; в базе csl-ru здесь «И рече Господь к моисеовы, глаголя» (опечатка вместо «к моисею»)."
  2: "προσεχέτωσαν ἀπὸ τῶν ἁγίων — пусть остерегаются святынь (προσέχω «внимать, остерегаться»; ἀπό + род.; слав. «да внимают от святынь»). ὅσα αὐτοὶ ἁγιάζουσίν μοι — что они освящают Мне. οὐ βεβηλώσουσιν τὸ ὄνομα τὸ ἅγιόν μου — не осквернят имени святого Моего."
  3: "Εἰς τὰς γενεὰς ὑμῶν — в роды ваши. πρὸς τὰ ἅγια — к святыням. καὶ ἡ ἀκαθαρσία αὐτοῦ ἐπ᾽ αὐτῷ — и нечистота его на нём. ἐξολεθρευθήσεται ἡ ψυχὴ ἐκείνη ἀπ᾽ ἐμοῦ — истреблена будет душа та от Меня (ψυχή — человек, потому 者)."
  4: "λεπρᾷ — болен проказой (λεπράω; 重い皮膚病 — как в гл. 13). γονορρυής — с истечением семени (γονορρυής). ἕως ἂν καθαρισθῇ — пока не очистится. ὁ ἁπτόμενος πάσης ἀκαθαρσίας ψυχῆς — прикасающийся ко всякой нечистоте (умершего). κοίτη σπέρματος — ложе семени."
  5: "ἑρπετόν — пресмыкающееся, гад. ὃ μιανεῖ αὐτόν — которое осквернит его. ἐπ᾽ ἀνθρώπῳ, ἐν ᾧ μιανεῖ αὐτόν — к человеку, от которого осквернится (ἐπί + дат.)."
  6: "ψυχή, ἥτις ἂν ἅψηται αὐτῶν — душа, которая прикоснётся к ним (ψυχή = человек). ἕως ἑσπέρας — до вечера. ἐὰν μὴ λούσηται τὸ σῶμα αὐτοῦ ὕδατι — если не омоет тела своего водою (λούω)."
  7: "δύῃ ὁ ἥλιος — зайдёт солнце (δύω). ἄρτος ἐστὶν αὐτοῦ — хлеб его есть, т. е. его пища (ἄρτος; слав. «хлеб его есть»); в переводе 食べ物, чтобы не спутать с パン."
  8: "θνησιμαῖον — мертвечина, падаль (θνησιμαῖος). θηριάλωτον — растерзанное зверем (θηριάλωτος). μιανθῆναι αὐτὸν ἐν αὐτοῖς — чтобы не оскверниться ими."
  9: "φυλάγματα — то, что должно соблюдать (φύλαγμα; слав. «повеления»). ἵνα μὴ λάβωσιν δι᾽ αὐτὰ ἁμαρτίαν — чтобы не приняли через них греха. ἐὰν βεβηλώσωσιν αὐτά — если осквернят их. ὁ ἁγιάζων αὐτούς — освящающий их."
  10: "ἀλλογενής — иноплеменник, чужеземец (ἀλλογενής; 他国人). πάροικος ἱερέως — живущий у священника пришлец (πάροικος; не προσήλυτος — иное слово). μισθωτός — наёмник (μισθωτός)."
  11: "ψυχὴν ἔγκτητον ἀργυρίου — душу приобретённую за серебро, т. е. купленного раба (ἔγκτητος «приобретённый»). οἱ οἰκογενεῖς — рождённые в доме (οἰκογενής; слав. «домочадцы»). ἄρτοι — хлебы, т. е. пища."
  12: "ἀπαρχαὶ τῶν ἁγίων — начатки святынь (ἀπαρχή; 初穂). ἀνδρὶ ἀλλογενεῖ — за иноплеменника."
  13: "χήρα ἢ ἐκβεβλημένη — вдова или изгнанная. σπέρμα δὲ μὴ ἦν αὐτῇ — а семени (детей) не было у неё. κατὰ τὴν νεότητα αὐτῆς — как в юности её. ἐπαναστρέψει — вернётся (ἐπαναστρέφω)."
  14: "κατὰ ἄγνοιαν — по неведению (ἄγνοια). προσθήσει τὸ ἐπίπεμπτον αὐτοῦ ἐπ᾽ αὐτό — приложит пятую часть свою к нему (ἐπίπεμπτον). δώσει τῷ ἱερεῖ τὸ ἅγιον — отдаст священнику святыню."
  15: "ἀφαιροῦσιν τῷ κυρίῳ — отделяют Господу (ἀφαιρέω; слав. «отделяют»). οὐ βεβηλώσουσιν — не осквернят."
  16: "ἐπάξουσιν ἐφ᾽ ἑαυτοὺς ἀνομίαν πλημμελείας — наведут на себя беззаконие преступления (ἐπάγω; πλημμέλεια — «преступление», ср. 愆祭). ἐν τῷ ἐσθίειν αὐτοὺς τὰ ἅγια αὐτῶν — когда будут есть святыни свои."
  17: "Формула введения; слав. «И рече Господь к моисею, глаголя»."
  18: "Ἄνθρωπος ἄνθρωπος — человек человек (всякий человек). κατὰ πᾶσαν ὁμολογίαν — по всякому исповеданию, т. е. по обету (ὁμολογία). κατὰ πᾶσαν αἵρεσιν — по всякому изволению (αἵρεσις здесь «выбор, усердие», не «ересь»). εἰς ὁλοκαύτωμα — во всесожжение (燔祭)."
  19: "δεκτὰ ὑμῖν — приемлемые вам. ἄμωμα ἄρσενα — непорочные, мужского пола. βουκόλια — стада крупного скота (βουκόλιον)."
  20: "μῶμον ἐν αὐτῷ — порок в нём. οὐ προσάξουσιν κυρίῳ — не принесут Господу. οὐ δεκτὸν ἔσται ὑμῖν — не будет приемлемо вам."
  21: "διαστείλας εὐχήν — «различив обет», т. е. объявив или исполнив обет (δια στέλλω; слав. «отлучив обет»; Синодальный «исполняя обет»). κατὰ αἵρεσιν — по изволению. ἐν ταῖς ἑορταῖς ὑμῶν — в праздники ваши."
  22: "γλωσσότμητον — с отрезанным языком (γλῶσσα + τέμνω). μυρμηκιῶντα — с наростами, бородавками (μυρμηκιάω). ψωραγριῶντα — покрытый струпьями (ψωρίασις). λιχῆνας ἔχοντα — имеющее лишаи (λιχήν). εἰς κάρπωσιν — в сожигаемое (κάρπωσις)."
  23: "ὠτότμητον — с отрезанными ушами. κολοβόκερκον — с коротким или обрезанным хвостом (κολοβός + κέρκος). σφάγια ποιήσεις αὐτὰ σεαυτῷ — в заколание сделаешь их себе, т. е. на обычное употребление (σφάγιον; слав. «в заколение сотвориши я себе»). εἰς δὲ εὐχήν — а на обет."
  24: "θλαδίας — с размозжёнными ядрами (θλάω «дробить»). ἐκτεθλιμμένος — выдавленный (ἐκθλίβω). ἐκτομίας — вырезанный, кастрат (ἐκτομίας). ἀπεσπασμένος — оторванный (ἀποσπάω). ἐπὶ τῆς γῆς ὑμῶν οὐ ποιήσετε — в земле вашей не сделаете."
  25: "ἐκ χειρὸς ἀλλογενοῦς — из руки иноплеменника. φθάρματα — испорченное (φθάρμα; слав. «вреждения»). οὐ δεχθήσεται ταῦτα ὑμῖν — не будут приняты вами."
  26: "Формула введения; слав. «И рече Господь к моисею, глаголя»."
  27: "ὡς ἂν τεχθῇ — как только родится (τίκτω). ἑπτὰ ἡμέρας ὑπὸ τὴν μητέρα — семь дней под матерью. τῇ ὀγδόῃ καὶ ἐπέκεινα — в восьмой и далее (ἐπέκεινα). εἰς δῶρα, κάρπωμα κυρίῳ — в дары, сожигаемое Господу."
  28: "αὐτὴν καὶ τὰ παιδία αὐτῆς — её и детей её (αὐτήν — мать, потому 雌). οὐ σφάξεις ἐν ἡμέρᾳ μιᾷ — не заколешь в день один."
  29: "θυσίαν εὐχὴν χαρμοσύνης — жертву обета радости, т. е. благодарственную (χαρμοσύνη «радость»; слав. «жертву обет радования»). εἰς δεκτὸν ὑμῖν θύσετε αὐτό — в приемлемое вам заколите её."
  30: "αὐτῇ τῇ ἡμέρᾳ ἐκείνῃ βρωθήσεται — в тот же день будет съедено. οὐκ ἀπολείψετε ἀπὸ τῶν κρεῶν εἰς τὸ πρωί — не оставите из мяса до утра (κρέας)."
  31: "φυλάξετε τὰς ἐντολάς μου — сохраните заповеди Мои (ἐντολή; 戒め). В gr-lxx-byz стих кончается здесь, без «Я Господь»; слав. и Синодальный добавляют «аз Господь» (по масоретскому), поэтому 〔わたしは主である。〕."
  32: "οὐ βεβηλώσετε τὸ ὄνομα τοῦ ἁγίου — не оскверните имени Святого. ἁγιασθήσομαι ἐν μέσῳ τῶν υἱῶν Ισραηλ — освящусь среди сынов Израиля (pass., «буду явлен святым»). ὁ ἁγιάζων ὑμᾶς — освящающий вас."
  33: "ὁ ἐξαγαγὼν ὑμᾶς ἐκ γῆς Αἰγύπτου — выведший вас из земли Египетской. ὥστε εἶναι ὑμῶν θεός — чтобы быть вам Богом. ἐγὼ κύριος — Я Господь (стих продолжает предложение 32-го, как в греческом)."
