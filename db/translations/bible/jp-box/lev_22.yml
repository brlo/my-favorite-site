# jp-box, Левит, глава 22. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в Левите отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 22: святыни — кто и когда может их есть (1–16), жертвы без порока
# (17–25), новорождённые животные и жертва обета (26–33).
# Речь Бога — 「…」 (2–16, 18–25, 27–33); 1, 17, 26 — слова повествования.
# Красного и синего нет.
# 〔…〕 одно: 22:31 «わたしは主である。」 — есть в церковном чтении (слав. «аз Господь»)
# и в Синодальном, но в gr-lxx-byz отсутствует (проверено по базе); поставлено в скобки
# как слово церковного чтения.
# Сносок ⟨…⟩ нет: 燔祭, 酬恩祭, 愆祭 уже пояснены в 1–16; 重い皮膚病 — в Евангелиях;
# 祭壇, 祭司 понятны по контексту.
# Отличия LXX: 22:22 «с отрезанным языком» (γλωσσότμητον; в Синодальном «уродливого»),
# 22:23 σφάγια «на заколание» (в Синодальном «с членами несоразмерно длинными»),
# 22:28 «её и детей её» (αὐτήν — мать); масоретские чтения в текст не вносились.
# jp-ni не использовался.

