verses:
  1: "ミナ人[じん]ゾファルは答[こた]えて言[い]った。"
  2: "「多[おお]くを語[かた]る者[もの]は、答[こた]えを受[う]けるのだろうか。口[くち]達者[じょうず]な者[もの]は、自分[じぶん]を正[ただ]しい者[もの]と思[おも]っているのだろうか。女[おんな]から生[う]まれた短命[たんめい]の者[もの]は、祝福[しゅくふく]されている。"
  3: "言葉[ことば]多[おお]くしてはならない。あなたに答[こた]え返[かえ]す者[もの]は、だれもいないのだから。"
  4: "『わたしはわざにおいて清[きよ]く、彼[かれ]の前[まえ]に非[そし]りのない者[もの]だ』と、あなたは言[い]ってはならない。"
  5: "しかし、主[しゅ]があなたに語[かた]り、あなたとともにご自分[じぶん]の唇[くちびる]を開[ひら]いてくださればよいのに。"
  6: "そうすれば、神[かみ]はあなたに知恵[ちえ]の力[ちから]を告[つ]げ知[し]らせるだろう。それは、あなたに反[はん]するものの二倍[にばい]となる。そのとき、あなたは知[し]るだろう。あなたが罪[つみ]を犯[おか]したそのゆえに、主からあなたにふさわしいことが臨[のぞ]んだのだ、と。"
  7: "あなたは主[しゅ]の足跡[あしあと]を見[み]つけられるだろうか。全能者[ぜんのうしゃ]が造[つく]られたものの極[きわ]みにまで達[たっ]したというのか。"
  8: "天[てん]は高[たか]い。あなたは何[なに]をしようというのか。よみにあるものより深[ふか]いものを、あなたは何を知[し]っているというのか。"
  9: "地[ち]の測[はかり]よりも長[なが]く、海[うみ]の幅[はば]よりも広[ひろ]いというのか。"
  10: "神[かみ]がすべてを覆[くつがえ]すなら、だれが神に『何[なに]をなさったのか』と言[い]えるだろうか。"
  11: "神[かみ]は不法[ふほう]な者[もの]のわざを知[し]っておられる。見[み]て、見逃[みのが]すことはない。"
  12: "しかし、人[ひと]は別[べつ]の仕方[しかた]で言葉[ことば]の中[なか]を泳[およ]ぐ。女[おんな]から生[う]まれた者[もの]は、荒[あ]れ野[の]の驢馬[ろば]に等[ひと]しい。"
  13: "もしあなたが心[こころ]を清[きよ]く保[たも]ち、彼[かれ]に向[む]かって手[て]を差[さ]し伸[の]べるなら、"
  14: "あなたの手[て]に不法[ふほう]なものがあるなら、それをあなたから遠[とお]くに退[しりぞ]け、不義[ふぎ]があなたの住[す]まいに宿[やど]らないようにせよ。"
  15: "そうすれば、あなたの顔[かお]は清[きよ]い水[みず]のように輝[かがや]き、あなたは汚[けが]れを脱[ぬ]ぎ捨[す]てて、恐[おそ]れることはない。"
  16: "あなたは労苦[ろうく]を、過[す]ぎ去[さ]った波[なみ]のように忘[わす]れ、おののくことはない。"
  17: "あなたの祈[いの]りは明[あ]けの明星[みょうじょう]のようになり、正午[しょうご]にもまさって、あなたに命[いのち]が昇[のぼ]る。"
  18: "あなたは自分[じぶん]に望[のぞ]みがあると確信[かくしん]し、心配[しんぱい]と気遣[きづか]いの中[なか]から、あなたに平和[へいわ]が現[あらわ]れる。"
  19: "あなたは安[やす]らかに休[やす]み、あなたと戦[たたか]う者[もの]はなくなる。多[おお]くの者[もの]が心[こころ]を変[か]えて、あなたに願[ねが]い求[もと]める。"
  20: "しかし、救[すく]いは彼[かれ]らを去[さ]る。彼らの望[のぞ]みは滅[ほろ]びであり、不敬[ふけい]な者[もの]の目[め]は溶[と]け消[き]える。」"

notes:
  1: "Зофар; вводная формула — повествование, вне кавычек. Ὑπολαβὼν δὲ Σωφαρ ὁ Μιναῖος λέγει — «и отвечал Софар Минаит и говорит» (эпитет при первом появлении имени, как в 15:1 и 18:1) (ὑπολαμβάνω — «подхватывать, отвечать»). Μιναῖος — ミナ人; в евр. он нааматитянин, в LXX και в csl — минейский."
  2: "Зофар, начало речи. ὁ τὰ πολλὰ λέγων καὶ ἀντακούσεται — «говорящий много — и будет услышан в ответ» (ἀντακούω — «отвечать»); ὁ εὔλαλος οἴεται εἶναι δίκαιος — «красноречивый думает быть праведным» (εὔλαλος — «хорошо говорящий»); εὐλογημένος γεννητὸς γυναικὸς ὀλιγόβιος — «благословен рожденный от жены, малолетен»: тёмное место LXX (похоже на искажение или раннюю вставку, ср. 14:1); оставлено буквально, как в греч. и слав., без сглаживания. Син. этой фразы не имеет (иное деление по МТ)."
  3: "Зофар. μὴ πολὺς ἐν ῥήμασιν γίνου — «не будь мног в словах»; οὐ γάρ ἐστιν ὁ ἀντικρινόμενός σοι — «ибо нет противоречащего тебе» (ἀντικρίνομαι — «состязаться в суде»). Слав. «не мног во словесех буди»; Син. иначе (по МТ)."
  4: "Зофар; слова Иова, которые он пересказывает, — 『…』. μὴ γὰρ λέγε ὅτι Καθαρός εἰμι τοῖς ἔργοις — «не говори, что чист я делами»; ἄμεμπτος ἐναντίον αὐτοῦ — «непорочен пред ним» (ἄμεμπτος — «безупречный»). Слав. то же."
  5: "Зофар. ἀλλὰ πῶς ἂν ὁ κύριος λαλήσαι πρὸς σέ — «о если бы Господь заговорил с тобой» (πῶς ἄν + оптатив — пожелание); ἀνοίξει χείλη αὐτοῦ μετὰ σοῦ — «и открыл бы уста свои с тобой». Пожелание продолжается в ст. 6."
  6: "Зофар. εἶτα ἀναγγελεῖ σοι δύναμιν σοφίας — «тогда возвестил бы тебе силу премудрости»; ὅτι διπλοῦς ἔσται τῶν κατὰ σέ — «что вдвое будет против тебя»: тёмное место, передано буквально; слав. «сугуб будет в сих, яже противу тебе»; Син. понимает иначе («вдвое больше следовало бы понести»). ἄξιά σοι ἀπέβη ἀπὸ κυρίου ὧν ἡμάρτηκας — «достойное тебе пришло от Господа за грехи твои», т. е. наказание соразмерно согрешению."
  7: "Зофар. ἦ ἴχνος κυρίου εὑρήσεις — «разве след Господа найдешь» (ἴχνος — «след»); εἰς τὰ ἔσχατα ἀφίκου, ἃ ἐποίησεν ὁ παντοκράτωρ — «до последнего достиг, что сотворил Вседержитель». παντοκράτωρ — 全能者."
  8: "Зофар. ὑψηλὸς ὁ οὐρανός, καὶ τί ποιήσεις — «высоко небо, и что сделаешь»; βαθύτερα δὲ τῶν ἐν ᾅδου τί οἶδας — «а что глубже того, что в аде, — что знаешь». ᾅδης — よみ, как по всей книге."
  9: "Зофар. ἢ μακρότερα μέτρου γῆς ἢ εὔρους θαλάσσης — «или длиннее меры земли, или широты морской»: ellipsis, сказуемое не названо; в японском вопрос сохранён, как в греч."
  10: "Зофар; слова к Богу внутри речи — 『…』. ἐὰν δὲ καταστρέψῃ τὰ πάντα — «если он ниспровергнет все» (καταστρέφω); τίς ἐρεῖ αὐτῷ Τί ἐποίησας — «кто скажет ему: что ты сделал»."
  11: "Зофар. αὐτὸς γὰρ οἶδεν ἔργα ἀνόμων — «ибо он знает дела беззаконных»; ἰδὼν δὲ ἄτοπα οὐ παρόψεται — «увидев нелепое, не презрит» (ἄτοπος — «неуместный, странный»; παροράω — «проглядеть, оставить без внимания»). Слав. «не презрит»."
  12: "Зофар. ἄνθρωπος δὲ ἄλλως νήχεται λόγοις — «человек же иначе плавает в словах» (νήχομαι — «плавать»): тёмный образ сохранён; слав. сглаживает — «инако обилует словесы». βροτὸς γεννητὸς γυναικὸς ἴσα ὄνῳ ἐρημίτῃ — «смертный, рожденный от жены, равен дикому ослу» (ἐρημίτης — «пустынный»)."
  13: "Зофар. εἰ γὰρ σὺ καθαρὰν ἔθου τὴν καρδίαν σου — «если ты положил сердце твое чистым»; ὑπτιάζεις δὲ χεῖρας πρὸς αὐτόν — «и простираешь руки к нему» (ὑπτιάζω — «поднимать ладонями вверх»). Условие продолжается в ст. 14–15."
  14: "Зофар. εἰ ἄνομόν τί ἐστιν ἐν χερσίν σου — «если есть что беззаконное в руках твоих»; πόρρω ποίησον αὐτὸ ἀπὸ σοῦ — «удали это от себя»; ἀδικία δὲ ἐν διαίτῃ σου μὴ αὐλισθήτω — «и неправда в жилище твоем пусть не ночует» (αὐλίζομαι — «проводить ночь»)."
  15: "Зофар. οὕτως γὰρ ἀναλάμψει σου τὸ πρόσωπον ὥσπερ ὕδωρ καθαρόν — «так просияет лицо твое, как чистая вода» (ἀναλάμπω — «воссиять»); ἐκδύσῃ δὲ ῥύπον — «и совлечешь грязь» (ῥύπος — «грязь, нечистота»)."
  16: "Зофар. τὸν κόπον ἐπιλήσῃ ὥσπερ κῦμα παρελθόν — «труд забудешь, как волну прошедшую» (κῦμα — «волна»); οὐ πτοηθήσῃ — «не устрашишься» (πτοέω — «пугать»)."
  17: "Зофар. ἡ δὲ εὐχή σου ὥσπερ ἑωσφόρος — «и молитва твоя, как денница» (ἑωσφόρος — «утренняя звезда»); ἐκ δὲ μεσημβρίας ἀνατελεῖ σοι ζωή — «и от полудня взойдет тебе жизнь» (ἀνατέλλω). Слав. «паче полудне возсияет ти жизнь» (по МТ «светлее полудня») — в тексте слав. чтение, вариант LXX отмечен."
  18: "Зофар. πεποιθώς τε ἔσῃ ὅτι ἔστιν σοι ἐλπίς — «и будешь уверен, что есть тебе надежда» (πείθω, ἐλπίς); ἐκ δὲ μερίμνης καὶ φροντίδος ἀναφανεῖταί σοι εἰρήνη — «и от заботы и попечения явится тебе мир» (μέριμνα — «забота», φροντίς — «попечение»)."
  19: "Зофар. ἡσυχάσεις γάρ, καὶ οὐκ ἔσται ὁ πολεμῶν σε — «ибо успокоишься, и не будет воюющего с тобой»; μεταβαλόμενοι δὲ πολλοί σου δεηθήσονται — «и многие, изменившись, будут просить тебя» (μεταβάλλομαι — «переменяться», δέομαι — «просить»)."
  20: "Зофар, конец речи; смена лица на 3-е мн. сохранена (в 13–19 — 2-е ед.). σωτηρία δὲ αὐτοὺς ἀπολείψει — «спасение же оставит их»; ἡ ἐλπὶς αὐτῶν ἀπώλεια — «надежда их — погибель»; ὀφθαλμοὶ δὲ ἀσεβῶν τακήσονται — «очи нечестивых истают» (τήκομαι — «таять»)."
