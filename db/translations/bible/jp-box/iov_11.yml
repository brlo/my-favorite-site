# Глава 11: первая речь Зофара, 20 стихов. 11:1 — вводная формула («И отвечал
# Софар Минаит и сказал») — повествование, вне кавычек; 11:2–20 — одна цитата 「…」.
# Внутри речи: слова Иова, которые Зофар ему приписывает (4), и слова к Богу (10) —
# 『…』. Содержание: упрёк в многословии (2–3), «не говори, что чист» (4–6),
# непостижимость Бога (7–12), призыв к покаянию и обещание мира (13–19),
# погибель нечестивых (20).
# Нумерация по gr: 20 стихов; деление csl совпадает, сдвигов нет.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz. Сносок ⟨…⟩ нет.
# Имена — транслитерация греческого (LXX): Σωφαρ ὁ Μιναῖος — ゾファル、ミナ人.

