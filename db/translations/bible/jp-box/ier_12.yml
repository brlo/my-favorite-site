book: ier
chapter: 12
draft: true

verses:
  1: "「主[しゅ]よ、あなたは正[ただ]しい。わたしがあなたと論[ろん]じても、あなたは正[ただ]しい。しかし、わたしはあなたと裁[さば]きについて語[かた]ろう。なぜ、悪[わる]い者[もの]の道[みち]は栄[さか]え、すべて背[そむ]きを重[かさ]ねる者[もの]たちは安泰[あんたい]なのか。"
  2: "あなたは彼[かれ]らを植[う]え、彼らは根[ね]を張[は]った。彼らは子[こ]を産[う]み、実[み]を結[むす]んだ。あなたは彼らの口[くち]の近[ちか]くにあり、彼らの内[うち]なるものからは遠[とお]い。"
  3: "しかし、主[しゅ]よ、あなたはわたしを知[し]っておられ、あなたの前[まえ]でわたしの心[こころ]を試[ため]されました。彼らを、屠[ほふ]り場[ば]へ行[ゆ]く羊[ひつじ]のように集[あつ]め、彼らの屠[ほふ]りの日[ひ]に彼らを清[きよ]めてください。"
  4: "いつまで、この地[ち]は嘆[なげ]き、野[の]の草[くさ]はすべて枯[か]れるのか。そこに住[す]む者[もの]たちの悪[あく]のゆえに。家畜[かちく]も鳥[とり]も滅[ほろ]びた。彼らが言[い]ったからである。『神[かみ]はわたしたちの道[みち]を見[み]ない。』」"
  5: "「あなたの足[あし]は走[はし]って、あなたを弱[よわ]らせる。どうして、あなたは馬[うま]とともに身[み]を備[そな]えられるだろうか。あなたは平和[へいわ]の地[ち]で頼[たよ]りにしているが、ヨルダンの茂[しげ]みの中[なか]でどうするのか。"
  6: "あなたの兄弟[きょうだい]たちも、あなたの父[ちち]の家[いえ]の者[もの]たちも、あなたを裏切[うらぎ]った。彼らもあなたの後[うしろ]から集[あつ]まって叫[さけ]んだ。彼らがあなたに良[よ]いことを語[かた]る時[とき]でも、彼らを信[しん]じてはならない。」"
  7: "「わたしはわたしの家[いえ]を捨[す]て、わたしの嗣業[しぎょう]を手放[てばな]し、わたしの愛[あい]する魂[たましい]をその敵[てき]の手[て]に渡[わた]した。"
  8: "わたしの嗣業[しぎょう]は、わたしにとって森[もり]の中[なか]の獅子[しし]のようになった。それはわたしに向[む]かって声[こえ]をあげた。それゆえ、わたしはそれを憎[にく]んだ。"
  9: "わたしの嗣業[しぎょう]は、わたしにとってハイエナの洞[ほら]穴[あな]、その周[まわ]りの洞[ほら]穴[あな]なのか。行[い]け、野[の]のすべての獣[けもの]を集[あつ]め、来[き]てそれを食[く]らわせよ。"
  10: "多[おお]くの牧[ぼく]者[しゃ]たちがわたしのぶどう畑[ばたけ]を荒[あ]らし、わたしの分[わけ]を汚[よご]し、わたしの望[のぞ]ましい分[わけ]を人[ひと]の通[とお]わない荒[あ]れ野[の]とした。"
  11: "人々[ひとびと]はそれを、滅[ほろ]びに至[いた]る荒廃[こうはい]とした。わたしのゆえに、全[ぜん]地[ち]は荒[あ]れに荒[あ]れてしまった。心[こころ]に思[おも]いを置[お]く者[もの]が一人[ひとり]もいないからである。"
  12: "荒[あ]れ野[の]すべての道[みち]に、荒[あ]らす者[もの]たちが来[き]た。主[しゅ]の剣[つるぎ]は、地[ち]の端[はし]から端[はし]まで食[く]い尽[つ]くす。すべての肉[にく]に平和[へいわ]はない。"
  13: "あなたがたは小麦[こむぎ]を蒔[ま]き、茨[いばら]を刈[か]り取[と]った。彼らの分[わけ]は彼らに何[なに]の益[えき]にもならない。あなたがたは自分[じぶん]の誇[ほこ]りと、主[しゅ]の前[まえ]での辱[はずかし]めとによって、恥[はじ]を受[う]けるがよい。」"
  14: "わたしの嗣業[しぎょう]に触[ふ]れるすべての悪[わる]い隣人[りんじん]について、主[しゅ]はこう言[い]われる。「見[み]よ、わたしは彼らをその地[ち]から引[ひ]き抜[ぬ]き、ユダを彼らの間[あいだ]から追[お]い出[だ]す。"
  15: "しかし、わたしが彼らを引[ひ]き抜[ぬ]いた後[のち]、わたしは再[ふたた]び顧[かえり]みて彼らをあわれみ、彼らをおのおのその嗣業[しぎょう]に、おのおのその地[ち]に住[す]まわせる。"
  16: "そして、もし彼らが、わたしの民[たみ]の道[みち]を学[まな]んで、『主[しゅ]は生[い]きておられる』と、わたしの名[な]によって誓[ちか]うことを学[まな]ぶなら、ちょうど彼らがわたしの民にバアルによって誓[ちか]うことを教[おし]えたように、彼らはわたしの民の間[あいだ]に建[た]てられる。"
  17: "しかし、もし彼らが聞[き]き従[したが]わないなら、わたしはその民[たみ]を引[ひ]き抜[ぬ]き、滅[ほろ]ぼし尽[つ]くす。」と主[しゅ]は言[い]われる。"

notes:
  1: "Δίκαιος εἶ, κύριε — «праведен Ты, Господи» (слав. «Праведен еси, Господи»); ὅτι ἀπολογήσομαι πρὸς σέ — «что (если) я стану судиться с Тобою» (ἀπολογέομαι — отвечать, защищаться; слав. «яко отвещаю к тебе»); πλὴν κρίματα λαλήσω πρὸς σέ — «однако о судах буду говорить с Тобою» (слав. «обаче судбы возглаголю к тебе»). τί ὅτι ὁδὸς ἀσεβῶν εὐοδοῦται — «почему путь нечестивых успешен?» (εὐοδόω); εὐθύνησαν — «процвели, благоденствуют» (εὐθύνω). С 12:1 начинается молитва пророка — 「…」."
  2: "ἐφύτευσας αὐτοὺς καὶ ἐρριζώθησαν — «Ты насадил их, и они укоренились» (ῥιζόω); ἐτεκνοποίησαν — «родили детей» (τεκνοποιέω); ἐποίησαν καρπόν — «принесли плод». ἐγγὺς εἶ σὺ τοῦ στόματος αὐτῶν — «близок Ты к устам их»; πόρρω ἀπὸ τῶν νεφρῶν — «далеко от внутренностей их» (νεφροί — почки, внутреннее; слав. «от утроб их»)."
  3: "γινώσκεις με — «знаешь меня»; δεδοκίμακας τὴν καρδίαν μου — «испытал сердце моё» (δοκιμάζω, perfect). ἅγνισον — «освяти, очисти» (ἁγνίζω; слав. «очисти»); εἰς ἡμέραν σφαγῆς — «на день заклания». Слав. полнее: «собери их яко овцы на заколение и очисти их в день заколения их» — собрание и сравнение с овцами внесены в текст без скобок; в LXX только «освяти их на день заклания их»."
  4: "ἕως πότε πενθήσει ἡ γῆ — «доколе будет плакать земля?» (πενθέω); χόρτος τοῦ ἀγροῦ — «трава поля» (χόρτος); ἠφανίσθησαν κτήνη καὶ πετεινά — «исчезли скоты и птицы» (ἀφανίζω). Οὐκ ὄψεται ὁ θεὸς ὁδοὺς ἡμῶν — «не увидит Бог путей наших»: слова нечестивых — 『…』. ru «Он не увидит, что с нами будет» — по МТ, не внесено."
  5: "σοῦ οἱ πόδες τρέχουσιν καὶ ἐκλύουσίν σε — букв. «твои ноги бегут и расслабляют тебя» (ἐκλύω — расслаблять); слав. «Нозе твои текут и разслабляют тя». πῶς παρασκευάσῃ ἐφ᾽ ἵπποις — «как изготовишься с конями?» (παρασκευάζω; слав. «како уготовишися с коньми»). ἐν γῇ εἰρήνης σὺ πέποιθας — «в земле мира ты уповал» (perfect; слав. «в земли мира твоего уповал еси», «твоего» — слав. добавление). φρύαγμα τοῦ Ιορδάνου — «волнение Иордана» (φρύαγμα — кипение, наводнение; слав. «шум иорданск»)."
  6: "ἠθέτησάν σε — «отвергли тебя, изменили тебе» (ἀθετέω; слав. «отвергошася тебе»); ἐκ τῶν ὀπίσω σου ἐπισυνήχθησαν — «собрались за тобою» (ἐπισυνάγω); μὴ πιστεύσῃς ἐν αὐτοῖς — «не верь им» (слав. «не веруй им»). ὅτι καὶ οἱ ἀδελφοί σου — «ибо и братья твои»: повтор «и» сохранён."
  7: "Ἐγκαταλέλοιπα — perfect «Я оставил» (ἐγκαταλείπω; слав. «Оставих»); ἀφῆκα τὴν κληρονομίαν — «покинул удел Мой» (κληρονομία — 嗣業; слав. «достояние»); ἔδωκα τὴν ἠγαπημένην ψυχήν μου — «отдал возлюбленную душу Мою» (слав. «дах возлюбленную душу мою»). С 12:7 говорит Господь от первого лица; новая вводная формула не нужна, речь продолжается до 12:13."
  8: "ὡς λέων ἐν δρυμῷ — «как лев в дубраве» (δρυμός — лес, чаща); ἔδωκεν ἐπ᾽ ἐμὲ τὴν φωνὴν αὐτῆς — «поднял на Меня голос свой» (слав. «даде противу мене глас свой»); ἐμίσησα αὐτήν — «возненавидел её»."
  9: "μὴ σπήλαιον ὑαίνης — «разве пещера гиены?» (ὕαινα — гиена; σπήλαιον — пещера; слав. «вертеп иенин»). ru «разноцветная птица» — по МТ, не внесено. βαδίσατε συναγάγετε πάντα τὰ θηρία — «идите, соберите всех зверей»; τοῦ φαγεῖν αὐτήν — «чтобы съесть её». ハイエナ — новая передача; слово понятное, сноски нет."
  10: "ποιμένες πολλοί — «многие пастыри» (слав. «пастырие мнози»); διέφθειραν τὸν ἀμπελῶνά μου — «погубили виноградник Мой» (διαφθείρω); ἐμόλυναν — «осквернили» (μολύνω); μερὶς ἐπιθυμητή — «вожделенная часть» (слав. «часть желаемая»); εἰς ἔρημον ἄβατον — «в пустыню непроходимую» (ἄβατος)."
  11: "ἐτέθη εἰς ἀφανισμὸν ἀπωλείας — «предано уничтожению погибели» (τίθημι, ἀφανισμός, ἀπώλεια); слав. читает 3-м л. мн. ч. «положиша в потребление пагубы», поэтому 人々は…とした; в LXX страдательное ἐτέθη (см. отчёт, сомнительное место). δι᾽ ἐμὲ ἀφανισμῷ ἠφανίσθη πᾶσα ἡ γῆ — «ради Меня опустошением опустошена вся земля»: удвоение сохранено (荒れに荒れて). ἀνὴρ τιθέμενος ἐν καρδίᾳ — «человек, полагающий в сердце» (слав. «иже размышляет сердцем»)."
  12: "ἐπὶ πᾶσαν διεκβολὴν ἐν τῇ ἐρήμῳ — «на всякий проход в пустыне» (διεκβολή — проход, переправа; слав. «во всякий путь пустыни»); ταλαιπωροῦντες — «разоряющие» (ταλαιπωρέω); μάχαιρα τοῦ κυρίου καταφάγεται — «меч Господень поест» (κατεσθίω); ἀπ᾽ ἄκρου ἕως ἄκρου — «от края до края»; οὐκ ἔστιν εἰρήνη πάσῃ σαρκί — «нет мира всякой плоти»."
  13: "σπείρατε πυροὺς καὶ ἀκάνθας θερίσατε — в LXX императивы «сейте пшеницу и жните тернии»; слав. читает аористом «Посеясте пшеницу, а терние пожасте» — взято слав. чтение (прошедшее время). οἱ κλῆροι αὐτῶν οὐκ ὠφελήσουσιν αὐτούς — «их жребии не принесут им пользы» (ὠφελέω); αἰσχύνθητε ἀπὸ καυχήσεως ὑμῶν — «постыдитесь от похваления вашего» (καύχησις); ἀπὸ ὀνειδισμοῦ ἔναντι κυρίου — «от поношения пред Господом»."
  14: "γείτονες οἱ πονηροί — «злые соседи» (γείτων); ἁπτομένων τῆς κληρονομίας — «касающиеся удела» (ἅπτομαι); ἧς ἐμέρισα — «который Я разделил» (μερίζω); ἀποσπῶ — «исторгаю» (ἀποσπάω); ἐκβαλῶ ἐκ μέσου αὐτῶν — «извергну из среды их». Формула «так говорит Господь» вне кавычек."
  15: "ἐπιστρέψω καὶ ἐλεήσω — «обращусь и помилую» (ἐλεάω); κατοικιῶ ἕκαστον — «поселю каждого» (κατοικίζω); повтор ἕκαστον сохранён (おのおの…おのおの)."
  16: "ἐὰν μαθόντες μάθωσιν — «если научатся (учась)»: удвоение глагола (μανθάνω) сохранено одним оборотом; τὴν ὁδὸν τοῦ λαοῦ μου — «путь народа Моего»; ὀμνύειν τῷ ὀνόματί μου Ζῇ κύριος — «клясться именем Моим: жив Господь»: клятвенная формула народов — 『…』. καθὼς ἐδίδαξαν τὸν λαόν μου ὀμνύειν τῇ Βααλ — «как они научили народ Мой клясться Ваалом»; οἰκοδομηθήσονται ἐν μέσῳ τοῦ λαοῦ μου — «созиждутся среди народа Моего» (οἰκοδομέω)."
  17: "ἐὰν δὲ μὴ ἐπιστρέψωσιν — «если же не обратятся»; слав. «аще же не послушают» — взято слав. чтение (聞き従わない). ἐξαρῶ… ἐξάρσει καὶ ἀπωλείᾳ — «исторгну исторжением и погибелью» (ἐξαίρω). Слав. добавляет «рече Господь» — в LXX нет, внесено как 「と主は言われる」."
