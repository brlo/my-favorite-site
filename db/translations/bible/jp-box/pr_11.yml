# jp-box, Притчи, глава 11. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc (1901) есть для 11:1–12 и 11:19–31 — контроль церковного чтения,
# архаизмы не копировались. jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 11: двустишия о весах и мере (1), гордости (2), правде и богатстве (3–8),
# устах и городе (9–14), лукавом и жене (15–16), милости (17), надежде (18–23),
# щедрости (24–27), богатстве (28), доме (29). Прямой речи нет — авторские изречения,
# внешних кавычек нет. Двустишия: параллелизм сохранён, не сглажен.
# Нумерация по gr: 31 стих.
# 11:4 в gr-lxx-byz стоит как «.» — дефект модуля; переведён целиком по csl
# (единственный свидетель, ср. jp-joc), без скобок, см. notes 4.
# 11:10 и 11:11 в модуле усечены: 11:10 обрывается на πόλις, 11:11 содержит только
# вторую половину; утраченные клаузы есть в csl и jp-joc — внесены в основной текст
# без скобок, усечение отмечено в notes. В 11:26 и 11:24 csl добавляет слова, которых
# нет в LXX, — внесены так же, отмечено в notes.
# 〔…〕 нет. Сносок ⟨…⟩ нет.
# Имена — транслитерация греческого (LXX).

