verses:
  1: "偽[いつわ]りの秤[はかり]は主[しゅ]の前[まえ]に忌[い]むべきもの。しかし、正[ただ]しい分銅[ふんどう]は主に喜[よろこ]ばれる。"
  2: "傲慢[ごうまん]が入[はい]るところには、辱[はずかし]めも入る。しかし、へりくだる者[もの]たちの口[くち]は知恵[ちえ]を思[おも]い巡[めぐ]らす。"
  3: "死[し]んだ正[ただ]しい者[もの]は後悔[こうかい]を残[のこ]す。しかし、不敬[ふけい]な者[もの]の滅[ほろ]びは手軽[てがる]で、しかも嘲笑[ちょうしょう]の的[まと]となる。"
  4: "正[ただ]しい者[もの]たちの誠実[せいじつ]は彼[かれ]らを導[みちび]き、背[そむ]く者[もの]たちのつまずきは彼ら自身[じしん]を捕[と]らえる。財産[ざいさん]は怒[いか]りの日[ひ]に役[やく]に立[た]たない。しかし、正[ただ]しさは死[し]から救[すく]う。"
  5: "正[ただ]しさは非[ひ]のない者[もの]たちの道[みち]をまっすぐにする。しかし、不敬[ふけい]は不正[ふせい]に陥[おちい]る。"
  6: "まっすぐな人[ひと]々[びと]の正[ただ]しさは彼[かれ]らを救[すく]う。しかし、不法[ふほう]な者[もの]たちは無[む]分別[ぶんべつ]によって捕[と]らえられる。"
  7: "正[ただ]しい人[ひと]が死[し]んでも、その希望[きぼう]は滅[ほろ]びない。しかし、不敬[ふけい]な者[もの]たちの誇[ほこ]りは滅びる。"
  8: "正[ただ]しい者[もの]は罠[わな]から逃[のが]れ出[だ]す。しかし、代[か]わりに不敬[ふけい]な者[もの]が引[ひ]き渡[わた]される。"
  9: "不敬[ふけい]な者[もの]の口[くち]は市民[しみん]への罠[わな]となる。しかし、正[ただ]しい者[もの]たちの知識[ちしき]によって道[みち]は良[よ]くなる。"
  10: "正[ただ]しい者[もの]たちの幸[さいわ]いによって町[まち]は栄[さか]え、不敬[ふけい]な者[もの]たちの滅[ほろ]びには喜[よろこ]びがある。"
  11: "正[ただ]しい者[もの]たちの祝福[しゅくふく]によって町[まち]は高[たか]くされ、不敬[ふけい]な者[もの]の口[くち]によって打[う]ち壊[こわ]される。"
  12: "思慮[しりょ]に欠[か]ける者[もの]は市民[しみん]を嘲[あざけ]る。しかし、思慮[しりょ]ある人[ひと]は静[しず]けを保[たも]つ。"
  13: "二[ふた]つ舌[した]の男[おとこ]は会議[かいぎ]の場[ば]で企[くわだ]てを明[あ]かす。しかし、信実[しんじつ]な者[もの]は口[くち]に出[だ]さずに事[こと]を隠[かく]す。"
  14: "彼[かれ]らに導[みちび]きがなければ、木[き]の葉[は]のように倒[たお]れる。しかし、多[おお]くの助言[じょげん]のうちに救[すく]いがある。"
  15: "悪[わる]い者[もの]は正[ただ]しい者[もの]と交[まじ]わると悪[あく]を行[おこな]い、安全[あんぜん]の響[ひび]きを憎[にく]む。"
  16: "恵[めぐ]み深[ぶか]い妻[つま]は夫[おっと]に栄光[えいこう]をもたらす。しかし、正[ただ]しいことを憎[にく]む妻[つま]は辱[はずかし]めの座[ざ]である。怠[おこた]る者[もの]は富[とみ]に乏[とぼ]しくなり、雄々[おお]しい者[もの]は富によって支[ささ]えられる。"
  17: "慈[いつく]しみ深[ぶか]い人[ひと]は自分[じぶん]の魂[たましい]に善[よ]いことを行[おこな]う。しかし、無[む]慈悲[じひ]な者[もの]は自分[じぶん]の体[からだ]を滅[ほろ]ぼす。"
  18: "不敬[ふけい]な者[もの]は不正[ふせい]なわざを行[おこな]う。しかし、正[ただ]しい者[もの]たちの子孫[しそん]は真理[しんり]の報[むく]いである。"
  19: "正[ただ]しい子[こ]はいのちへと生[う]まれる。しかし、不敬[ふけい]な者[もの]の追[お]い求[もと]めは死[し]に至[いた]る。"
  20: "曲[ま]がった道[みち]は主[しゅ]の忌[い]むところ。しかし、その道[みち]に非[ひ]のない者[もの]はすべて主に喜[よろこ]ばれる。"
  21: "不法[ふほう]に手[て]を組[く]む者[もの]は悪[あく]の罰[ばつ]を免[まぬか]れない。しかし、正[ただ]しさを蒔[ま]く者[もの]は確[かた]かな報[むく]いを受[う]ける。"
  22: "豚[ぶた]の鼻[はな]の金[きん]の輪[わ]のように、思慮[しりょ]のない女[おんな]の美[うつく]しさもそうである。"
  23: "正[ただ]しい者[もの]たちの願[ねが]いはすべて善[よ]い。しかし、不敬[ふけい]な者[もの]たちの希望[きぼう]は滅[ほろ]びる。"
  24: "自分[じぶん]のものを蒔[ま]きながら増[ふ]やす者[もの]たちがいる。また、他人[たにん]のものを集[あつ]めながら減[へ]らす者[もの]たちもいる。"
  25: "祝[しゅく]福[ふく]される魂[たましい]はすべて単純[たんじゅん]である。しかし、怒[いか]りやすい人[ひと]は見苦[みぐる]しい。"
  26: "穀物[こくもつ]を蓄[たくわ]えて手放[てばな]さない者[もの]は、それを異邦[いほう]の民[たみ]に残[のこ]す。惜[お]しんで売[う]る者[もの]は民[たみ]に呪[のろ]われる。しかし、分[わ]け与[あた]える者[もの]の頭[あたま]には主[しゅ]の祝福[しゅくふく]がある。"
  27: "善[ぜん]を企[くわだ]てる者[もの]は良[よ]い恵[めぐ]みを求[もと]める。しかし、悪[あく]を求[もと]める者[もの]を、悪[あく]が捕[と]らえる。"
  28: "富[とみ]に頼[たよ]る者[もの]は倒[たお]れる。しかし、正[ただ]しい者[もの]たちをかばう者[もの]は芽[め]を吹[ふ]く。"
  29: "自分[じぶん]の家[いえ]を顧[かえり]みない者[もの]は風[かぜ]を嗣業[しぎょう]とする。しかし、愚[おろ]かな者[もの]は思慮[しりょ]ある者[もの]のしもべとなる。"
  30: "正[ただ]しさの実[み]からいのちの木[き]が生[しょう]じる。しかし、不法[ふほう]な者[もの]たちの魂[たましい]は時[とき]ならず奪[うば]い去[さら]れる。"
  31: "もし正[ただ]しい者[もの]がかろうじて救[すく]われるなら、不敬[ふけい]な者[もの]と罪人[ざいにん]はどこに現[あらわ]れるのか。"

notes:
  1: "ζυγοὶ δόλιοι — весы лживые (ζυγός — весы, ярмо; δόλιος — коварный; csl «мерила льстивая»). βδέλυγμα ἐνώπιον κυρίου — мерзость пред Господом (βδέλυγμα — формула книги). στάθμιον δὲ δίκαιον δεκτὸν αὐτῷ — вес же праведный угоден Ему (στάθμιον — гиря, вес; δεκτός — угодный)."
  2: "οὗ ἐὰν εἰσέλθῃ ὕβρις, ἐκεῖ καὶ ἀτιμία — где войдёт надменность, там и бесчестие (ὕβρις — дерзость, надменность; csl «досаждение»; ἀτιμία — бесчестие). στόμα δὲ ταπεινῶν μελετᾷ σοφίαν — уста же смиренных поучаются премудрости (μελετάω — упражняться, размышлять)."
  3: "ἀποθανὼν δίκαιος ἔλιπεν μετάμελον — умерший праведник оставил сожаление (μετάμελον — раскаяние, сожаление). πρόχειρος δὲ γίνεται καὶ ἐπίχαρτος ἀσεβῶν ἀπώλεια — скорой и достойной злорадства бывает погибель нечестивых (πρόχειρος — лёгкий, скорый; ἐπίχαρτος — вызывающий злорадство; csl «посмеятелна»). ru здесь иное (МТ)."
  4: "В gr-lxx-byz 11:4 стоит «.» — дефект модуля, стиха нет; переведён целиком по csl (единственный свидетель, ср. jp-joc), без скобок, стих не делим. Греческие слова ниже — по изданиям LXX (в модуле их нет). Слав. «Совершенство правых наставит их» — непорочность прямых наставит их (τελειότης — совершенство, непорочность); «поползновение отрицающихся пленит их» — падение (подножка) отрекающихся пленит их (ὑποσκελισμός); «Не упользуют имения в день ярости» — не принесут пользы имения в день гнева (ὠφελέω); «правда же избавит от смерти» (ῥύομαι)."
  5: "δικαιοσύνη ἀμώμους ὀρθοτομεῖ ὁδούς — правда непорочным прямо проводит пути (ὀρθοτομέω — прямо резать, направлять; csl «исправляет»; ἄμωμος — непорочный). ἀσέβεια δὲ περιπίπτει ἀδικίᾳ — нечестие же впадает в неправду (περιπίπτω — впадать)."
  6: "δικαιοσύνη ἀνδρῶν ὀρθῶν ῥύεται αὐτούς — правда мужей прямых избавляет их (ῥύομαι). τῇ δὲ ἀπωλείᾳ αὐτῶν ἁλίσκονται παράνομοι — погибелью их уловляются беззаконные (ἁλίσκομαι — быть пойманным). csl читает «безсоветием» (предположительно ἀβουλίᾳ) — чтение csl взято в текст по паритету, вариант LXX отмечен здесь."
  7: "τελευτήσαντος ἀνδρὸς δικαίου οὐκ ὄλλυται ἐλπίς — по кончине мужа праведного не погибает надежда (τελευτάω — скончаться; ὄλλυμι — губить). τὸ δὲ καύχημα τῶν ἀσεβῶν ὄλλυται — похвала же нечестивых погибает (καύχημα — предмет похвалы, гордость). ru иначе (МТ)."
  8: "δίκαιος ἐκ θήρας ἐκδύνει — праведный из лова выскальзывает (θήρα — лов, охота; ἐκδύνω — выскальзывать, убегать). ἀντ αὐτοῦ δὲ παραδίδοται ὁ ἀσεβής — вместо него же предаётся нечестивый."
  9: "ἐν στόματι ἀσεβῶν παγὶς πολίταις — в устах нечестивых сеть гражданам (παγίς — сеть, западня; πολίτης — согражданин). αἴσθησις δὲ δικαίων εὔοδος — разумение же праведных благопоспешно (αἴσθησις — чувство, знание; εὔοδος — имеющий добрый путь; csl «благопоспешно»), передано оборотом 道は良くなる."
  10: "ἐν ἀγαθοῖς δικαίων κατώρθωσεν πόλις — при благах праведных процвёл город (κατορθόω — исправлять, процветать; ἀγαθά — блага, благоденствие). В gr-lxx-byz стих обрывается на πόλις (усечение модуля); вторая половина «и в погибели нечестивых радование» есть в csl и jp-joc, в модуле её нет — внесена в основной текст без скобок."
  11: "στόμασιν δὲ ἀσεβῶν κατεσκάφη — устами же нечестивых разрушен (κατασκάπτω — раскапывать, разрушать). В gr-lxx-byz это весь стих; первая половина «В благословении правых возвысится град» есть в csl и jp-joc, в модуле утрачена — внесена в основной текст без скобок."
  12: "μυκτηρίζει πολίτας ἐνδεὴς φρενῶν — осмеивает сограждан лишённый разума (μυκτηρίζω — поднимать на смех; ἐνδεής — нуждающийся). ἀνὴρ δὲ φρόνιμος ἡσυχίαν ἄγει — муж же разумный хранит покой (ἡσυχίαν ἄγειν — водить безмолвие)."
  13: "ἀνὴρ δίγλωσσος ἀποκαλύπτει βουλὰς ἐν συνεδρίῳ — муж двоязычный открывает советы в собрании (δίγλωσσος — двуязычный, переносчик; βουλή — совет, замысел; συνεδρίον — собрание, сонмище). πιστὸς δὲ πνοῇ κρύπτει πράγματα — верный же дыханием (духом) таит дела (πνοή — дыхание, дух; csl «духом»); передано «не выдавая словом»."
  14: "οἷς μὴ ὑπάρχει κυβέρνησις — у кого нет управления (κυβέρνησις — кормление, управление). πίπτουσιν ὥσπερ φύλλα — падают, как листья. σωτηρία δὲ ὑπάρχει ἐν πολλῇ βουλῇ — спасение же есть во множестве совета."
  15: "πονηρὸς κακοποιεῖ, ὅταν συμμείξῃ δικαίῳ — лукавый злодействует, когда сблизится с праведным (συμμείγνυμι — смешиваться, сближаться). μισεῖ δὲ ἦχον ἀσφαλείας — ненавидит же звук безопасности (ἦχος — звук, глас; csl «гласа утверждения»). ru говорит о поручительстве (МТ) — в LXX иное, место тёмное."
  16: "γυνὴ εὐχάριστος ἐγείρει ἀνδρὶ δόξαν — жена благодатная воздвизает мужу славу (εὐχάριστος — приятная, благодатная). θρόνος δὲ ἀτιμίας γυνὴ μισοῦσα δίκαια — престол же бесчестия — жена, ненавидящая правое. πλούτου ὀκνηροὶ ἐνδεεῖς γίνονται — богатства ленивые лишаются (ὀκνηρός — ленивый). οἱ δὲ ἀνδρεῖοι ἐρείδονται πλούτῳ — мужественные же утверждаются богатством (ἐρείδω — утверждать). Два двустишия в одном стихе переведены оба; ru и jp-joc дают только первую половину (МТ)."
  17: "τῇ ψυχῇ αὐτοῦ ἀγαθὸν ποιεῖ ἀνὴρ ἐλεήμων — душе своей добро делает муж милостивый (ἐλεήμων — милосердный). ἐξολλύει δὲ αὐτοῦ σῶμα ὁ ἀνελεήμων — погубляет же тело его немилостивый (ἐξολλύω — истреблять; ἀνελεήμων — немилосердный)."
  18: "ἀσεβὴς ποιεῖ ἔργα ἄδικα — нечестивый делает дела неправедные. σπέρμα δὲ δικαίων μισθὸς ἀληθείας — семя же праведных — награда истины (μισθός — плата, награда)."
  19: "υἱὸς δίκαιος γεννᾶται εἰς ζωήν — сын праведный рождается в жизнь (γεννάω — рождать). διωγμὸς δὲ ἀσεβοῦς εἰς θάνατον — гонение же нечестивого — в смерть (διωγμός — гонение, преследование). ru и jp-joc иначе (МТ)."
  20: "βδέλυγμα κυρίῳ διεστραμμέναι ὁδοί — мерзость Господу пути извращённые (διαστρέφω — извращать). προσδεκτοὶ δὲ αὐτῷ πάντες ἄμωμοι ἐν ταῖς ὁδοῖς αὐτῶν — приятны же Ему все непорочные в путях своих (ἄμωμος — непорочный)."
  21: "χειρὶ χεῖρας ἐμβαλὼν ἀδίκως — «дав руку в руку» неправедно, т. е. вступив в неправое дело (ἐμβάλλω — вкладывать). οὐκ ἀτιμώρητος ἔσται — не останется без наказания (ἀτιμώρητος). csl добавляет «злых» — этого слова нет в LXX, но по паритету оно внесено (悪の罰). ὁ δὲ σπείρων δικαιοσύνην λήμψεται μισθὸν πιστόν — сеющий правду получит награду верную."
  22: "ὥσπερ ἐνώτιον ἐν ῥινὶ ὑός — как серьга (кольцо) в носу свиньи (ἐνώτιον — серьга; ῥίς — нос; ὗς — свинья). οὕτως γυναικὶ κακόφρονι κάλλος — так жене злонравной красота (κακόφρων — злонравная, неразумная; κάλλος — красота)."
  23: "ἐπιθυμία δικαίων πᾶσα ἀγαθή — желание праведных всякое благо (ἐπιθυμία — желание). ἐλπὶς δὲ ἀσεβῶν ἀπολεῖται — надежда же нечестивых погибнет. ru «ожидание нечестивых — гнев» — МТ."
  24: "εἰσὶν οἳ τὰ ἴδια σπείροντες πλείονα ποιοῦσιν — есть, кто, сея своё, большее творят. εἰσὶν καὶ οἳ συνάγοντες ἐλαττονοῦνται — есть и такие, кто, собирая, умаляются (ἐλαττόω — уменьшать). csl добавляет «чуждая» («собирающе чуждая») — этого слова нет в LXX, по паритету внесено в текст (他人のものを)."
  25: "ψυχὴ εὐλογουμένη πᾶσα ἁπλῆ — душа благословляемая вся проста (ἁπλῆ — простая, бесхитростная). ἀνὴρ δὲ θυμώδης οὐκ εὐσχήμων — муж же гневливый неблагообразен (θυμώδης — вспыльчивый; εὐσχήμων — приличный, благообразный). ru и jp-joc говорят о щедрости (МТ) — в LXX иное."
  26: "ὁ συνέχων σῖτον — удерживающий хлеб (συνέχω — сдерживать, задерживать). ὑπολίποιτο ἂν αὐτὸν τοῖς ἔθνεσιν — «оставил бы его язычникам» (ὑπολείπω; оптатив с ἄν, текст тёмен). εὐλογία δὲ εἰς κεφαλὴν τοῦ μεταδιδόντος — благословение же на голову раздающего (μεταδίδωμι — уделять). csl добавляет «продаяй пшеницу скупо, от народа проклят» и «Господне» — нет в LXX, внесено в основной текст."
  27: "τεκταινόμενος ἀγαθὰ ζητεῖ χάριν ἀγαθήν — замышляющий доброе ищет благую милость (τεκταίνομαι — замышлять, устраивать; χάρις — милость, благодать). ἐκζητοῦντα δὲ κακά, καταλήμψεται αὐτόν — ищущего же злое постигнет его (καταλαμβάνω — постигать, захватывать; csl «постигнут его»)."
  28: "ὁ πεποιθὼς ἐπὶ πλούτῳ, οὗτος πεσεῖται — надеющийся на богатство своё падёт. ὁ δὲ ἀντιλαμβανόμενος δικαίων, οὗτος ἀνατελεῖ — поддерживающий же праведных воссияет, произрастёт (ἀντιλαμβάνομαι — поддерживать, заступаться; ἀνατέλλω — восходить, произрастать; csl «возсияет»)."
  29: "ὁ μὴ συμπεριφερόμενος τῷ ἑαυτοῦ οἴκῳ — не пекущийся о своём доме (συμπεριφέρομαι — обходиться, заботиться; csl «сматряяй»). κληρονομήσει ἄνεμον — наследит ветер. δουλεύσει δὲ ἄφρων φρονίμῳ — и будет служить глупый разумному."
  30: "ἐκ καρποῦ δικαιοσύνης φύεται δένδρον ζωῆς — от плода правды произрастает древо жизни (φύομαι — произрастать; δένδρον ζωῆς — древо жизни, ср. Быт 2:9). ἀφαιροῦνται δὲ ἄωροι ψυχαὶ παρανόμων — отъемлются же безвременно души беззаконных (ἄωρος — преждевременный). ru «мудрый привлекает души» — МТ."
  31: "εἰ ὁ μὲν δίκαιος μόλις σῴζεται — если праведный едва спасается (μόλις — едва, с трудом). ὁ ἀσεβὴς καὶ ἁμαρτωλὸς ποῦ φανεῖται — нечестивый же и грешный где явится (риторический вопрос сохранён). ru иначе (МТ)."
