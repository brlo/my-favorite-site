verses:
  1: "主[しゅ]はこう言[い]われる。「見[み]よ、わたしはバビロンと、カルデア人[じん]の中[なか]に住[す]む者[もの]たちとに、荒[あ]らし尽[つ]くす焼[や]けつく風[かぜ]を起[お]こす。"
  2: "わたしはバビロンに荒[あ]らす者[もの]たちを送[おく]り、彼らはバビロンを辱[はずかし]め、その地[ち]を荒[あ]らす。バビロンに災[わざわ]いが四方[しほう]から来[く]る、その苦[くる]しみの日[ひ]に。"
  3: "弓[ゆみ]を引[ひ]く者[もの]は、その弓をバビロンに向[む]けて引[ひ]け。武具[ぶぐ]を身[み]に着[つ]けよ。その若者[わかもの]たちを惜[お]しむな。その軍[ぐん]のすべても滅[ほろ]ぼせ。"
  4: "刺[さ]し貫[つらぬ]かれた者[もの]たちはカルデア人[じん]の地[ち]に倒[たお]れ、突[つ]き通[とお]された者たちはその外[そと]に倒れる。"
  5: "イスラエルもユダも、その神[かみ]から、全能者[ぜんのうしゃ]である主[しゅ]から見捨[みす]てられてはいない。彼らの地[ち]はイスラエルの聖[せい]なる方[かた]に対する罪[つみ]で満[み]ちているが。"
  6: "バビロンの中[なか]から逃[に]げよ。それぞれ自分[じぶん]の命[いのち]を救[すく]え。その不義[ふぎ]によって滅[ほろ]びるな。これは主[しゅ]の復讐[ふくしゅう]の時[とき]であり、主はバビロンに報[むく]いを与[あた]えられるからである。"
  7: "バビロンは主[しゅ]の手[て]にある金[きん]の杯[さかずき]で、全[ぜん]地[ち]を酔[よ]わせた。そのぶどう酒[ぶどうしゅ]を諸国民[しょこくみん]が飲[の]み、それゆえに彼らはよろめいた。"
  8: "バビロンは突然[とつぜん]倒[たお]れ、砕[くだ]かれた。バビロンのために泣[な]き、その傷[きず]のために樹脂[じゅし]を取[と]れ。もしかすると、癒[いや]されるかもしれない。"
  9: "わたしたちはバビロンを癒[いや]したが、癒されなかった。彼女[かのじょ]を捨[す]てて、それぞれ自分[じぶん]の地[ち]へ行[い]こう。その裁[さば]きは天[てん]に達[たっ]し、星[ほし]にまで上[のぼ]ったからである。"
  10: "主[しゅ]はその裁[さば]きを明[あき]らかにされた。来[こ]い、シオンで、主[しゅ]なるわれわれの神[かみ]の業[わざ]を告[つ]げよう。"
  11: "矢[や]を研[と]ぎ、矢筒[やづつ]を満[み]たせ。主[しゅ]はメディア人[じん]の王[おう]たちの霊[れい]を起[お]こされた。バビロンに向[む]かうその怒[いか]りは、これを滅[ほろ]ぼすためである。これは主[しゅ]の復讐[ふくしゅう]、その民[たみ]のための復讐であるからである。"
  12: "バビロンの城壁[じょうへき]の上[うえ]に旗[はた]を上[あ]げ、矢筒[やづつ]を置[お]き、見張[みは]りを立[た]て、武具[ぶぐ]を備[そな]えよ。主[しゅ]はバビロンに住[す]む者[もの]たちについて語[かた]られたことを、必[かなら]ず成[な]し遂[と]げられるからである。"
  13: "水[みず]の多[おお]い所[ところ]に住[す]み、宝[たから]の多[おお]い者[もの]よ。あなたの終[おわ]りが来[き]た。まことに、あなたのはらわたの内[うち]に。"
  14: "全能者[ぜんのうしゃ]である主[しゅ]は、ご自分[じぶん]の腕[うで]にかけて誓[ちか]われた。わたしはあなたを人[ひと]で満[み]たす、いなごのように。そして、下[くだ]って来[く]る者[もの]たちはあなたに向[む]かって叫[さけ]ぶ。"
  15: "地[ち]をその力[ちから]で造[つく]り、その知恵[ちえ]で世界[せかい]を整[ととの]え、その悟[さと]りで天[てん]を広[ひろ]げられた方[かた]。"
  16: "その声[こえ]によって天[てん]の水[みず]はざわめき、地[ち]の果[は]てから雲[くも]を上[あ]げ、雨[あめ]のために稲妻[いなずま]を造[つく]り、ご自分の蔵[くら]から光[ひかり]を出[だ]される。"
  17: "人[ひと]はみな知[ち]しきに及[およ]ばず、金[きん]を鋳[い]る者[もの]はみなその彫[ほ]り物[もの]によって恥[はじ]を見[み]る。その鋳物[いもの]は偽[いつわ]りであり、その中に霊[れい]はないからである。"
  18: "それらはむなしく、あざけりの業[わざ]である。その罰[ばつ]の時[とき]に、それらは滅[ほろ]びる。"
  19: "ヤコブの受[う]ける分[ぶん]はこのようなものではない。すべてを造[つく]られた方[かた]が彼の嗣業[しぎょう]である。その名[な]は全能者[ぜんのうしゃ]である主[しゅ]。"
  20: "あなたはわたしの戦[いくさ]の器[うつわ]を砕[くだ]く。わたしはあなたによって諸国民[しょこくみん]を砕き、あなたによって王国[おうこく]を滅[ほろ]ぼす。"
  21: "わたしはあなたによって馬[うま]とその乗[の]り手[て]を打[う]ち砕[くだ]き、あなたによって戦車[せんしゃ]とその乗り手を打ち砕く。"
  22: "わたしはあなたによって若者[わかもの]とおとめを打[う]ち砕き、あなたによって男[おとこ]と女[おんな]を打ち砕く。老[おい]いた者[もの]と幼[おさな]い者[もの]をも打ち砕く。"
  23: "わたしはあなたによって牧者[ぼくしゃ]とその群[む]れを打[う]ち砕き、あなたによって農夫[のうふ]とその耕地[こうち]を打ち砕き、あなたによって知事[ちじ]たちと長官[ちょうかん]たちを打ち砕く。"
  24: "わたしはバビロンとカルデア人[じん]のすべとの住[す]む者[もの]に、彼らがシオンに行[おこな]ったすべての悪[わる]に報[むく]いる。あなたがたの目[め]の前[まえ]で、と主[しゅ]は言[い]われる。"
  25: "見[み]よ、わたしはあなたに向[む]かう。全[ぜん]地[ち]を滅[ほろ]ぼす、滅[ほろ]びの山[やま]よ。わたしはあなたに手[て]を伸[の]べ、あなたを岩[いわ]から転[ころ]がし落[お]とし、焼[や]け尽[つ]きた山とする。"
  26: "彼らはあなたから隅[すみ]の石[いし]も、礎[いしずえ]の石も取[と]らない。あなたは永久[えいきゅう]に荒[あ]れ果[は]てたものとなるからである、と主[しゅ]は言[い]われる。"
  27: "地[ち]の上[うえ]に旗[はた]を上[あ]げ、諸国民[しょこくみん]の間[あいだ]で角笛[つのぶえ]を吹[ふ]け。諸国民をバビロンに対して聖別[せいべつ]し、アララトの王国[おうこく]とアスカナズ人[じん]を、わたしの命[めい]によってバビロンに告[つ]げよ。バビロンに矢[や]を射[い]る者[もの]たちを立[た]て、いなごの群[む]れのように馬[うま]を上[のぼ]らせよ。"
  28: "諸国民をバビロンに対して聖別[せいべつ]せよ。メディア人[じん]の王[おう]と全[ぜん]地[ち]の王を、その知事[ちじ]たちとその長官[ちょうかん]たちと、その地のすべとの領域[りょういき]を。"
  29: "地[ち]は震[ふる]え、苦[くる]しんだ。主[しゅ]のバビロンに対する計[はか]りが起[お]こり、バビロンの地[ち]を荒[あ]れ果[は]てたものとし、住[す]む者[もの]のない所[ところ]とするためである。"
  30: "バビロンの戦士[せんし]たちは戦[たたか]うことをやめ、塁[とりで]の中[なか]に座[すわ]る。その力[ちから]は砕[くだ]かれ、彼らは女[おんな]のようになった。その天幕[てんまく]は焼[や]かれ、そのかんぬきは打[う]ち砕かれた。"
  31: "走[はし]る者[もの]は走る者に会[あ]うために走り、告[つ]げる者は告げる者に会うために走り、バビロンの王[おう]に、その都[みやこ]が取[と]られたことを告げる。"
  32: "その渡[わた]し場[ば]の果[は]てから彼らは捕[と]らえられ、そのとりでは火[ひ]で焼[や]かれ、その戦士[せんし]たちは出[で]て行[い]く。"
  33: "全能者[ぜんのうしゃ]である主[しゅ]、イスラエルの神[かみ]はこう言[い]われる。バビロンの王[おう]の家[いえ]は熟[じゅく]した打[う]ち場[ば]のようになり、打[う]たれる。もはや少[すこ]しで、その刈[か]り入[い]れが来[く]る。"
  34: "『彼[かれ]はわたしを食[く]らい、わたしを裂[さ]き、わたしを捕[と]らえた。ネブカドネツァル、バビロンの王は、わたしを空[から]の器[うつわ]とした。彼は龍[りゅう]のようにわたしを飲[の]み込み、その腹[はら]をわたしの甘[あま]いもので満[み]たし、わたしを吐[は]き出[だ]した。』"
  35: "『わたしの労苦[ろうく]と苦[くる]しみはバビロンに帰[き]す』と、シオンに住[す]む者[もの]は言[い]う。『わたしの血[ち]はカルデア人[じん]の住む者たちに帰す』と、エルサレムは言う。"
  36: "それゆえ、主[しゅ]はこう言[い]われる。見[み]よ、わたしはあなたの訴[うった]えを裁[さば]き、あなたの復讐[ふくしゅう]を遂[と]げ行[おこな]う。わたしはその海[うみ]を荒[あ]らし、その泉[いずみ]を涸[か]らす。"
  37: "バビロンは荒[あ]れ果[は]てたものとなり、蛇[へび]の住[す]みかとなり、驚[おどろ]きと口笛[くちぶえ]の的[まと]となる。住む者[もの]はいなくなる。"
  38: "彼らは共[とも]に獅子[しし]のように起[お]こり、獅子の子[こ]らのようにほえる。"
  39: "彼らが激[はげ]しく燃[も]えるとき、わたしは彼らに飲[の]み物[もの]を与[あた]え、彼らを酔[よ]わせる。彼らは重[おも]くなって永久[えいきゅう]の眠[ねむ]りに眠り、目[め]を覚[さ]まさない、と主[しゅ]は言[い]われる。"
  40: "わたしは彼らを、子羊[こひつじ]たちのように屠[ほふ]り場[ば]へ、雄羊[おひつじ]たちを雄山羊[おやぎ]たちと共[とも]に下[くだ]らせる。"
  41: "どうしてセサクは取[と]られ、全[ぜん]地[ち]の誇[ほこ]りは捕[と]らえられたのか。どうしてバビロンは諸国民[しょこくみん]の間[あいだ]で荒[あ]れ果[は]てたものとなったのか。"
  42: "海[うみ]がその波[なみ]の響[ひび]きと共[とも]にバビロンに上[のぼ]り、バビロンは覆[おお]われた。"
  43: "その町々[まちまち]は水[みず]のない、通[とお]り過[す]ぎることのできない地[ち]となった。そこには一人[ひとり]も住[す]まず、人[ひと]の子[こ]もそこに宿[やど]らない。"
  44: "わたしはバビロンでベルを罰[ばっ]し、その口[くち]から飲[の]み込[こ]んだものを取[と]り出[だ]す。諸国民[しょこくみん]はもはやバビロンに集[あつ]まらない。その城壁[じょうへき]もまた倒[たお]れる。"
  45: "わたしの民[たみ]よ、その中[なか]から出[で]よ。それぞれ、主[しゅ]の激[はげ]しい怒[いか]りから自分[じぶん]の命[いのち]を救[すく]え。"
  46: "あなたがたの心[こころ]が弱[よわ]くなり、地[ち]に聞[き]こえるうわさに恐[おそ]れてはならない。年[とし]ごとにうわさが来[き]、年ごとにうわさが来る。地には暴虐[ぼうぎゃく]と不義[ふぎ]があり、支配者[しはいしゃ]が支配者に逆[さか]らう。"
  47: "それゆえ、見[み]よ、日[ひ]が来[く]る。わたしはバビロンの彫[ほ]り物[もの]を罰[ばっ]する。その地[ち]は全[まった]く辱[はずかし]められ、その刺[さ]し貫[つらぬ]かれた者[もの]たちはその中[なか]に倒[たお]れる。"
  48: "天[てん]と地[ち]とその中にあるすべても、バビロンの上[うえ]で喜[よろこ]ぶ。北[きた]から滅[ほろ]ぼす者[もの]たちがバビロンに来[く]るからである、と主[しゅ]は言[い]われる。"
  49: "バビロンがイスラエルに倒[たお]れた者[もの]を生[しょう]じたように、バビロンでも、全[ぜん]地[ち]の刺[さ]し貫[つらぬ]かれた者たちが倒れる。"
  50: "剣[つるぎ]から逃[のが]れた者[もの]たちよ、行[い]け。立[た]ち止[ど]まるな。遠[とお]くにいる者[もの]は主[しゅ]を思[おも]い起[おこ]し、エルサレムを心[こころ]に上[のぼ]らせよ。"
  51: "わたしたちは辱[はずかし]められた。ののしりを聞[き]いたからである。恥[はじ]がわたしたちの顔[かお]を覆[おお]った。他国[たこく]の者[もの]たちがわたしたちの聖所[せいしょ]に、主[しゅ]の家[いえ]に入[はい]ったからである。"
  52: "それゆえ、見[み]よ、日[ひ]が来[く]る、と主[しゅ]は言[い]われる。わたしはその彫[ほ]り物[もの]を罰[ばっ]する。その全[ぜん]地[ち]で刺[さ]し貫[つらぬ]かれた者[もの]たちが倒れる。"
  53: "たとえバビロンが天[てん]に上[のぼ]り、たとえその力[ちから]の高[たか]みを堅[かた]くしても、わたしのもとから滅[ほろ]ぼす者[もの]たちが来[く]る、と主[しゅ]は言[い]われる。"
  54: "バビロンから叫[さけ]びの声[こえ]が、カルデア人[じん]の地[ち]から大[おお]いなる破壊[はかい]がある。"
  55: "主[しゅ]はバビロンを滅[ほろ]ぼし、そこから大[おお]いなる声[こえ]を失[うしな]わせたからである。その声は多[おお]い水[みず]のように響[ひび]いていたが、主はそれを滅[ほろ]びに渡[わた]された。"
  56: "バビロンに災[わざわ]いが来[き]た。その戦士[せんし]たちは捕[と]らえられ、その弓[ゆみ]は折[お]られた。主[しゅ]は報[むく]いを与[あた]える神[かみ]であり、主はバビロンにその報いを報いられるからである。"
  57: "わたしはその知事[ちじ]たちとその知者[ちしゃ]たちを、その長官[ちょうかん]たちとその戦士[せんし]たちを、その力[ちから]ある者[もの]たちを酔[よ]わせる。彼らは眠[ねむ]って永久[えいきゅう]に目[め]を覚[さ]まさない、と王[おう]である主[しゅ]、その名[な]は全能者[ぜんのうしゃ]は言[い]われる。"
  58: "全能者[ぜんのうしゃ]である主[しゅ]はこう言[い]われる。バビロンの城壁[じょうへき]は広[ひろ]く、掘[ほ]り崩[くず]される。その高[たか]い門[もん]は火[ひ]で焼[や]かれる。民[たみ]たちはむなしく労[ろう]し、諸国民[しょこくみん]は初[はじ]めに力尽[ちからづ]きる。」"
  59: "預言者[よげんしゃ]エレミヤに主[しゅ]が命[めい]じられた言葉[ことば]、すなわち、ネリヤの子[こ]、マアセヤの子サライに告[つ]げるように。それは、ユダの王[おう]ゼデキヤのもとから、その治世[ちせい]の第四年[だいよねん]にバビロンへ行[い]ったときのことである。サライは贈[おく]り物[もの]の長[おさ]であった。"
  60: "エレミヤは、バビロンに来[く]るすべとの災[わざわ]い、すなわちバビロンについて書[か]かれたこれらのすべとの言葉[ことば]を、一[ひと]つの巻物[まきもの]に書[か]き記[しる]した。"
  61: "そして、エレミヤはサライに言[い]った。「バビロンに着[ち]いたなら、よく見[み]て、これらのすべとの言葉を読[よ]み、"
  62: "『主[しゅ]よ、主[しゅ]よ。あなたはこの所[ところ]について、これを滅[ほろ]ぼし、人[ひと]も家畜[かちく]もそこに住[す]まないようにし、永久[えいきゅう]に荒[あ]れ果てたものとすると語[かた]られました』と言[い]い、"
  63: "この書[しょ]を読[よ]み終[お]えたなら、それに石[いし]を結[むす]びつけ、ユーフラテス川[がわ]の中[なか]へ投[な]げ込[こ]み、"
  64: "言[い]え。『このようにバビロンは沈[しず]み、わたしがこれに下[くだ]す災[わざわ]いのゆえに、もはや起[お]き上[あ]がらない』と。」バビロンは滅[ほろ]びる。ここまでがエレミヤの言葉[ことば]である。"

notes:
  1: "Τάδε λέγει κύριος — «так говорит Господь»: формула вне кавычек, ею открывается сплошная цитата 28:1–58 (ср. Ис 47). ἐξεγείρω ἐπὶ Βαβυλῶνα... ἄνεμον καύσωνα διαφθείροντα — «поднимаю на Вавилон… ветер знойный губительный» (καύσων — зной, 焼けつく風; διαφθείρω — губить). ru (МТ) читает «противников Моих» — иное чтение, не внесено."
  2: "ἐξαποστελῶ εἰς Βαβυλῶνα ὑβριστάς — «пошлю в Вавилон наглецов (губителей)» (ὑβριστής — наглый; 荒らす者たち); καθυβρίσουσιν αὐτὴν καὶ λυμανοῦνται τὴν γῆν αὐτῆς — «обесчестят её и опустошат землю её». οὐαὶ ἐπὶ Βαβυλῶνα κυκλόθεν — «горе Вавилону отовсюду»; ἐν ἡμέρᾳ κακώσεως αὐτῆς — «в день озлобления её» (苦しみの日)."
  3: "ἐπ᾿ αὐτὴν τεινέτω ὁ τείνων τὸ τόξον αὐτοῦ — «на неё пусть натягивает натягивающий лук свой» (弓を引く者); περιθέσθω ᾧ ἐστιν ὅπλα αὐτῷ — «пусть опояшется, у кого есть оружие» (武具を身に着けよ). μὴ φείσησθε ἐπὶ νεανίσκους αὐτῆς — «не щадите юношей её» (惜しむな); ἀφανίσατε πᾶσαν τὴν δύναμιν αὐτῆς — «истребите всю силу её»."
  4: "πεσοῦνται τραυματίαι ἐν γῇ Χαλδαίων — «падут поражённые в земле Халдейской» (τραυματίας — раненый, поражённый; 刺し貫かれた者); κατακεκεντημένοι ἔξωθεν αὐτῆς — «пронзённые вне её» (κατακεντέω — пронзать)."
  5: "οὐκ ἐχήρευσεν Ισραηλ καὶ Ιουδας ἀπὸ θεοῦ αὐτῶν — «не овдовел Израиль и Иуда от Бога своего» (χηρεύω — вдоветь; 見捨てられてはいない); ἀπὸ κυρίου παντοκράτορος — «от Господа Вседержителя» (全能者である主). ἡ γῆ αὐτῶν ἐπλήσθη ἀδικίας ἀπὸ τῶν ἁγίων Ισραηλ — «земля их наполнилась неправды от святых Израиля»: тёмный оборот, понят как «против Святого Израилева» (слав. «от святых израилевых»); в notes — возможное «от святынь Израиля»."
  6: "φεύγετε ἐκ μέσου Βαβυλῶνος — «бегите из среды Вавилона»; ἀνασῴζετε ἕκαστος τὴν ψυχὴν αὐτοῦ — «спасайте каждый душу свою» (命を救え); μὴ ἀπορριφῆτε ἐν τῇ ἀδικίᾳ αὐτῆς — «да не будете отвергнуты в неправде её» (滅びるな). καιρὸς ἐκδικήσεως αὐτῆς ἐστιν παρὰ κυρίου — «время отмщения её от Господа»; ἀνταπόδομα αὐτὸς ἀνταποδίδωσιν αὐτῇ — «воздаяние Он воздаёт ей»."
  7: "ποτήριον χρυσοῦν Βαβυλὼν ἐν χειρὶ κυρίου — «чаша золотая Вавилон в руке Господней» (金の杯); μεθύσκον πᾶσαν τὴν γῆν — «опьяняющая всю землю». ἀπὸ τοῦ οἴνου αὐτῆς ἐπίοσαν ἔθνη — «от вина её пили народы»; διὰ τοῦτο ἐσαλεύθησαν — «потому поколебались» (よろめいた; ru «безумствовали» — МТ)."
  8: "ἄφνω ἔπεσεν Βαβύλων καὶ συνετρίβη — «внезапно пал Вавилон и сокрушился» (突然). θρηνεῖτε αὐτήν — «плачьте о ней»; λάβετε ῥητίνην τῇ διαφθορᾷ αὐτῆς — «возьмите смолу (бальзам) для повреждения её» (樹脂); εἴ πως ἰαθήσεται — «не исцелится ли» (癒されるかもしれない)."
  9: "ἰατρεύσαμεν τὴν Βαβυλῶνα, καὶ οὐκ ἰάθη — «врачевали мы Вавилон, и не исцелился» (癒した); ἐγκαταλίπωμεν αὐτὴν καὶ ἀπέλθωμεν ἕκαστος εἰς τὴν γῆν αὐτοῦ — «оставим её и пойдём каждый в землю свою». ἤγγισεν εἰς οὐρανὸν τὸ κρίμα αὐτῆς — «приблизился до неба суд её»; ἐξῆρεν ἕως τῶν ἄστρων — «поднялся до звёзд»."
  10: "ἐξήνεγκεν κύριος τὸ κρίμα αὐτοῦ — «вынес Господь суд Свой» (裁きを明らかにされた); δεῦτε καὶ ἀναγγείλωμεν εἰς Σιων τὰ ἔργα κυρίου θεοῦ ἡμῶν — «придите и возвестим на Сионе дела Господа Бога нашего»."
  11: "παρασκευάζετε τὰ τοξεύματα, πληροῦτε τὰς φαρέτρας — «готовьте стрелы, наполняйте колчаны» (矢筒). ἤγειρεν κύριος τὸ πνεῦμα βασιλέως Μήδων — «воздвиг Господь дух царя Мидийского» (слав. и ru «царей» — 王たち). ὅτι εἰς Βαβυλῶνα ἡ ὀργὴ αὐτοῦ τοῦ ἐξολεθρεῦσαι αὐτήν — «ибо на Вавилон гнев Его, чтобы истребить его»; ἐκδίκησις κυρίου ἐστίν, ἐκδίκησις λαοῦ αὐτοῦ — «это отмщение Господне, отмщение народа Его». Слав. добавляет «сил» при «Господь» — нет в LXX, отдельно не переводилось."
  12: "ἐπὶ τειχέων Βαβυλῶνος ἄρατε σημεῖον — «на стенах Вавилона поднимите знамя» (城壁); ἐπιστήσατε φαρέτρας — «поставьте колчаны» (矢筒); ἐγείρατε φυλακάς — «поднимите стражу» (見張り); ἑτοιμάσατε ὅπλα — «приготовьте оружие» (武具). ὅτι ἐνεχείρησεν καὶ ποιήσει κύριος ἃ ἐλάλησεν — «ибо Господь начал и сделает, что изрёк»."
  13: "κατασκηνοῦντας ἐφ᾿ ὕδασι πολλοῖς — «живущие при водах многих» (水の多い所); ἐπὶ πλήθει θησαυρῶν αὐτῆς — «при множестве сокровищ её» (宝). ἥκει τὸ πέρας σου ἀληθῶς εἰς τὰ σπλάγχα σου — «пришёл конец твой истинно во внутренности твои» (はらわた; слав. «во утробы твоя»)."
  14: "ὤμοσεν κύριος κατὰ τοῦ βραχίονος αὐτοῦ — «поклялся Господь Своею мышцею» (腕にかけて誓われた; слав. «клятся бо Господь сил»). πληρώσω σε ἀνθρώπων ὡσεὶ ἀκρίδων — «наполню тебя людьми, как саранчой» (いなご); φθέγξονται ἐπὶ σὲ οἱ καταβαίνοντες — «возгласят на тебя нисходящие» (叫ぶ)."
  15: "ποιῶν γῆν ἐν τῇ ἰσχύι αὐτοῦ — «творящий землю в силе Своей»; ἑτοιμάζων οἰκουμένην ἐν τῇ σοφίᾳ αὐτοῦ — «уготовляющий вселенную в премудрости Своей» (知恵); ἐν τῇ συνέσει αὐτοῦ ἐξέτεινεν τὸν οὐρανόν — «разумом Своим распростёр небо» (悟り)."
  16: "εἰς φωνὴν ἔθετο ἦχος ὕδατος ἐν τῷ οὐρανῷ — «на голос Его [является] шум воды на небе» (ざわめき); ἀνήγαγεν νεφέλας ἀπ᾿ ἐσχάτου τῆς γῆς — «возводит облака от края земли». ἀστραπὰς εἰς ὑετὸν ἐποίησεν — «молнии в дождь творит» (稲妻); ἐξήγαγεν φῶς ἐκ θησαυρῶν αὐτοῦ — «изводит свет из сокровищ Своих» (光; ru «ветер» — МТ, не внесено)."
  17: "ἐμωράνθη πᾶς ἄνθρωπος ἀπὸ γνώσεως — «обезумел всякий человек от знания» (知しきに及ばず); κατῃσχύνθη πᾶς χρυσοχόος ἀπὸ τῶν γλυπτῶν αὐτοῦ — «посрамлён всякий плавильщик от изваяний своих» (金を鋳る者, 彫り物). ὅτι ψευδῆ ἐχώνευσαν — «ибо ложное вылили» (偽り); οὐκ ἔστιν πνεῦμα ἐν αὐτοῖς — «нет духа в них»."
  18: "μάταιά ἐστιν — «суетны они» (むなしい); ἔργα μεμωκημένα — «дела осмеянные (достойные смеха)» (あざけりの業); ἐν καιρῷ ἐπισκέψεως αὐτῶν ἀπολοῦνται — «в час посещения их погибнут» (罰の時)."
  19: "οὐ τοιαύτη μερὶς τῷ Ιακωβ — «не такова доля Иакова» (受ける分); ὁ πλάσας τὰ πάντα αὐτός ἐστιν κληρονομία αὐτοῦ — «Создавший всё — Он наследие его» (嗣業); κύριος ὄνομα αὐτῷ — «Господь имя Ему». Слав. в скобках добавляет «(а израиль) жезл достояния его» — нет в LXX, отдельно не переводилось."
  20: "διασκορπίζεις σύ μοι σκεύη πολέμου — «ты рассеиваешь Мне орудия войны»: тёмное место LXX (слав. «сокрушаеши ты мне сосуды бранныя», 砕く); в МТ «ты у Меня молот и оружие войны» — не внесено. διασκορπιῶ ἐν σοὶ ἔθνη — «рассею в тебе народы» (あなたによって…砕き); ἐξαρῶ ἐκ σοῦ βασιλεῖς — «изъяму (истреблю) из тебя царей»."
  21: "διασκορπιῶ ἐν σοὶ ἵππον καὶ ἀναβάτην αὐτοῦ — «рассею в тебе коня и всадника его» (馬と乗り手); ἅρματα καὶ ἀναβάτας αὐτῶν — «колесницы и всадников их» (戦車). Слав. передаёт глагол как «избию» (打ち砕く), поэтому в тексте 打ち砕く."
  22: "νεανίσκον καὶ παρθένον — «юношу и деву» (若者とおとめ); ἄνδρα καὶ γυναῖκα — «мужа и жену» (男と女). Слав. добавляет «стара и отрока» (老いた者と幼い者) — нет в LXX, внесено в текст без 〔…〕 (слав. ставит этот член между двумя другими, порядок держим по gr)."
  23: "ποιμένα καὶ τὸ ποίμνιον αὐτοῦ — «пастыря и стадо его» (牧者と群れ); γεωργὸν καὶ τὸ γεώργιον αὐτοῦ — «земледельца и поле его» (農夫と耕地); ἡγεμόνας καὶ στρατηγούς σου — «правителей и военачальников твоих» (知事たちと長官たち)."
  24: "ἀνταποδώσω τῇ Βαβυλῶνι καὶ πᾶσι τοῖς κατοικοῦσι Χαλδαίοις — «воздам Вавилону и всем живущим в Халдее» (報いる); πάσας τὰς κακίας αὐτῶν, ἃς ἐποίησαν ἐπὶ Σιων — «все злодейства их, которые они сделали на Сионе»; κατ᾿ ὀφθαλμοὺς ὑμῶν — «перед глазами вашими» (あなたがたの目の前で)."
  25: "ἰδοὺ ἐγὼ πρὸς σέ, τὸ ὄρος τὸ διεφθαρμένον — «вот, Я на тебя, гора погибельная (растленная)» (滅びの山); τὸ διαφθεῖρον πᾶσαν τὴν γῆν — «разоряющая всю землю». ἐκτενῶ τὴν χεῖρά μου ἐπὶ σέ — «простру руку Мою на тебя»; κατακυλιῶ σε ἀπὸ τῶν πετρῶν — «скачу тебя со скал» (岩から転がし落とす); δώσω σε ὡς ὄρος ἐμπεπυρισμένον — «дам тебя как гора сожжённая» (焼け尽きた山)."
  26: "οὐ μὴ λάβωσιν ἀπὸ σοῦ λίθον εἰς γωνίαν — «не возьмут от тебя камня в угол» (隅の石); λίθον εἰς θεμέλιον — «камня в основание» (礎の石); εἰς ἀφανισμὸν εἰς τὸν αἰῶνα ἔσῃ — «в запустение навек будешь» (永久に荒れ果てたもの)."
  27: "Ἄρατε σημεῖον ἐπὶ τῆς γῆς — «поднимите знамя на земле» (旗); σαλπίσατε ἐν ἔθνεσιν σάλπιγγι — «трубите трубою среди народов» (角笛). ἁγιάσατε ἐπ᾿ αὐτὴν ἔθνη — «освятите на неё народы» (聖別し); βασιλείαις Αραρατ παρ᾿ ἐμοῦ καὶ τοῖς Ασχαναζαίοις — «царствам Араратским от Меня и Асканазейцам» (アララト, アスカナズ人). ἐπιστήσατε ἐπ᾿ αὐτὴν βελοστάσεις — «поставьте на неё стреломёты» (矢を射る者たち); ἀναβιβάσατε ἐπ᾿ αὐτὴν ἵππον ὡς ἀκρίδων πλῆθος — «возведите на неё коня, как множество саранчи» (いなごの群れ)."
  28: "ἁγιάσατε ἐπ᾿ αὐτὴν ἔθνη — «освятите на неё народы»: повтор начала предыдущего стиха, сохранён. τὸν βασιλέα τῶν Μήδων καὶ πάσης τῆς γῆς — «царя Мидян и всей земли» (メディア人の王); τοὺς ἡγουμένους αὐτοῦ καὶ πάντας τοὺς στρατηγοὺς αὐτοῦ — «начальников его и всех военачальников его». Слав. добавляет «и всея земли области его» (その地のすべとの領域) — нет в LXX, внесено без 〔…〕."
  29: "ἐσείσθη ἡ γῆ καὶ ἐπόνεσεν — «потряслась земля и пострадала (заболела)» (震え、苦しんだ). ἐξανέστη ἐπὶ Βαβυλῶνα λογισμὸς κυρίου — «восстал на Вавилон помысел Господень» (計り); τοῦ θεῖναι τὴν γῆν Βαβυλῶνος εἰς ἀφανισμὸν — «чтобы положить землю Вавилона в запустение»; μὴ κατοικεῖσθαι αὐτήν — «и не быть ей обитаемой»."
  30: "ἐξέλιπεν μαχητὴς Βαβυλῶνος τοῦ πολεμεῖν — «оскудел (перестал) воин Вавилона воевать» (戦うことをやめ); καθήσονται ἐκεῖ ἐν περιοχῇ — «сядут там в укреплении (осаде)» (塁); ἐθραύσθη ἡ δυναστεία αὐτῶν — «сокрушена сила их»; ἐγενήθησαν ὡσεὶ γυναῖκες — «стали как женщины»; ἐνεπυρίσθη τὰ σκηνώματα αὐτῆς — «сожжены шатры её» (天幕); συνετρίβησαν οἱ μοχλοί αὐτῆς — «сокрушены засовы её» (かんぬき)."
  31: "διώκων εἰς ἀπάντησιν διώκοντος διώξεται — «гонящий навстречу гонящему погонится» (走る者が走る者に会うために走り); ἀναγγέλλων εἰς ἀπάντησιν ἀναγγέλλοντος — «возвещающий навстречу возвещающему». τοῦ ἀναγγεῖλαι τῷ βασιλεῖ Βαβυλῶνος ὅτι ἑάλωκεν ἡ πόλις αὐτοῦ — «чтобы возвестить царю Вавилона, что взят город его»."
  32: "ἀπ᾿ ἐσχάτου τῶν διαβάσεων αὐτοῦ ἐλήμφθησαν — «от края переправ его взяты» (渡し場); τὰ συστέματα αὐτῶν ἐνέπρησαν ἐν πυρί — «ограды (сплочения) их сожгли огнём» (とりで); ἄνδρες αὐτοῦ οἱ πολεμισταὶ ἐξέρχονται — «мужи его воинские выходят» (戦士たちは出て行く)."
  33: "Οἶκοι βασιλέως Βαβυλῶνος ὡς ἅλων ὥριμος ἀλοηθήσονται — «дома царя Вавилонского, как гумно зрелое, будут обмолочены» (熟した打ち場); ἔτι μικρὸν καὶ ἥξει ὁ ἄμητος αὐτῆς — «ещё немного, и придёт жатва её» (刈り入れ). Слав. добавляет «вседержитель, Бог израилев» — нет в LXX, внесено без 〔…〕."
  34: "κατέφαγέν με, ἐμερίσατό με, κατέλαβέν με — «съел меня, разделил меня, овладел мной»: плач Сиона от первого лица, внутри большой цитаты поэтому 『…』. σκεῦος λεπτόν — «сосуд тонкий» (пустой, опустошённый; 空の器); κατέπιέν με ὡς δράκων — «поглотил меня, как дракон» (龍); ἔπλησεν τὴν κοιλίαν αὐτοῦ — «наполнил чрево своё»; ἀπὸ τῆς τρυφῆς μου ἐξῶσέν με — «от роскоши моей изверг меня» (吐き出した)."
  35: "οἱ μόχθοι μου καὶ αἱ ταλαιπωρίαι μου εἰς Βαβυλῶνα, ἐρεῖ κατοικοῦσα Σιων — «труды мои и бедствия мои на Вавилон, скажет обитательница Сиона» (労苦と苦しみ); τὸ αἷμά μου ἐπὶ τοὺς κατοικοῦντας Χαλδαίους, ἐρεῖ Ιερουσαλημ — «кровь моя на живущих в Халдее, скажет Иерусалим» (血). Формулы «скажет» вынесены из кавычек; сами речения — 『…』."
  36: "ἐγὼ κρινῶ τὴν ἀντίδικόν σου — «Я буду судить противницу (соперницу) твою» (訴えを裁く); ἐκδικήσω τὴν ἐκδίκησίν σου — «отмщу отмщение твоё» (復讐を遂げ行う); ἐρημώσω τὴν θάλασσαν αὐτῆς — «опустошу море её» (海); ξηρανῶ τὴν πηγὴν αὐτῆς — «иссушу источник её» (泉を涸らす)."
  37: "ἔσται Βαβυλὼν εἰς ἀφανισμὸν καὶ οὐ κατοικηθήσεται — «будет Вавилон в запустение и не будет обитаем». Слав. добавляет «жилище змием, в чудо и позвиздание, понеже не будет живущаго» (蛇の住みか, 驚きと口笛の的) — нет в LXX, внесено без 〔…〕."
  38: "ἅμα ὡς λέοντες ἐξηγέρθησαν — «вместе как львы пробудились» (獅子); ὡς σκύμνοι λεόντων — «как львята львов» (獅子の子ら). Глагола «рычать» в LXX нет (ru/МТ добавляет «зарыкают») — не внесено."
  39: "ἐν τῇ θερμασίᾳ αὐτῶν — «в горячности (жару) их» (激しく燃えるとき); δώσω πότεμα αὐτοῖς — «дам питьё им» (飲み物); μεθύσω αὐτούς — «упою их» (酔わせる). ὅπως καρωθῶσιν — «чтобы отяжелели (были оглушены)» (重くなる); ὑπνώσωσιν ὕπνον αἰώνιον — «уснут сном вечным»; οὐ μὴ ἐγερθῶσι — «не пробудятся» (目を覚まさない)."
  40: "καταβιβάσω αὐτοὺς ὡς ἄρνας εἰς σφαγήν — «сведу их, как агнцев, на заклание» (子羊たち); ὡς κριοὺς μετ᾿ ἐρίφων — «как овнов с козлами» (雄羊, 雄山羊). Слав. «яко овны с козлы»; порядок сохранён."
  41: "πῶς ἑάλω καὶ ἐθηρεύθη τὸ καύχημα πάσης τῆς γῆς — «как взят и уловлен предмет хвалы всей земли» (誇り); πῶς ἐγένετο Βαβυλὼν εἰς ἀφανισμὸν ἐν τοῖς ἔθνεσιν — «как стал Вавилон запустением среди народов». Слав. добавляет «сесах» (セサク, криптограмма Вавилона, евр. ששך) — в LXX имени нет, внесено без 〔…〕."
  42: "ἀνέβη ἐπὶ Βαβυλῶνα ἡ θάλασσα ἐν ἤχῳ κυμάτων αὐτῆς — «поднялось на Вавилон море с шумом волн своих» (波の響き); κατεκαλύφθη — «покрылся» (覆われた)."
  43: "ἐγενήθησαν αἱ πόλεις αὐτῆς γῆ ἄνυδρος καὶ ἄβατος — «стали города её землёю безводною и непроходимою» (水のない、通り過ぎることのできない地); οὐ κατοικήσει ἐν αὐτῇ οὐδὲ εἷς — «не будет жить в ней ни один человек»; οὐδὲ μὴ καταλύσῃ ἐν αὐτῇ υἱὸς ἀνθρώπου — «и не остановится в ней сын человеческий» (宿らない)."
  44: "ἐκδικήσω ἐπὶ Βαβυλῶνα — «посещу Вавилон» (罰する); слав. добавляет «на вила» (ベル) — нет в LXX, внесено без 〔…〕. ἐξοίσω ἃ κατέπιεν ἐκ τοῦ στόματος αὐτῆς — «вынесу, что поглотил он, из уст его» (口から飲み込んだものを取り出す); οὐ μὴ συναχθῶσιν πρὸς αὐτὴν ἔτι τὰ ἔθνη — «не соберутся к ней более народы»; слав. добавляет «зане и стены вавилонския падут» (その城壁もまた倒れる) — нет в LXX, внесено без 〔…〕."
  45: "В модуле лакуна («.»). Слав. 51:45: «Изыдите от среды его, людие мои, да спасет кийждо душу свою от гнева ярости Господни» — переведено по слав. без 〔…〕. В LXX (Rahlfs) этого стиха нет: 28:45–48 — добавление, которое Церковь читает (ср. Откр 18:4)."
  46: "В модуле лакуна («.»). Слав. 51:46: «Да не когда умягчится сердце ваше, и убоитеся ради слуха, иже услышится на земли, и приидет в лето слышание, и по лете слышание, бедность и неправда на землю, и властелин на властелина» — переведено по слав. без 〔…〕; в LXX стиха нет. «В лето… по лете» — год за годом (年ごとに)."
  47: "В модуле лакуна («.»). Слав. 51:47: «Сего ради, се, дние грядут, и посещу на изваяныя вавилона: и вся земля его посрамится, и вси язвении его падут посреде его» — переведено по слав. без 〔…〕; в LXX стиха нет. Соответствует нашему 28:52, но там ст. 52 в модуле есть."
  48: "В модуле лакуна («.»). Слав. 51:48: «И возвеселятся над вавилоном небеса и земля и вся сущая в них: от полунощи бо приидут нань всегубителие, глаголет Господь» — переведено по слав. без 〔…〕; в LXX стиха нет."
  49: "καὶ ἐν Βαβυλῶνι πεσοῦνται τραυματίαι πάσης τῆς γῆς — «и в Вавилоне падут поражённые всей земли» (刺し貫かれた者). Слав. даёт длиннее: «якоже сотвори вавилон падати язвеным во израили, тако в вавилоне падут язвении всея земли» — сравнение «как Вавилон повергал поражённых в Израиле» не в LXX (по МТ), внесено в текст без 〔…〕."
  50: "ἀνασῳζόμενοι ἐκ γῆς — «спасающиеся из земли» (слав. «избегшии меча»; 剣から逃れた者たち); πορεύεσθε καὶ μὴ ἵστασθε — «идите и не стойте» (立ち止まるな). οἱ μακρόθεν, μνήσθητε τοῦ κυρίου — «находящиеся вдали, вспомните Господа» (遠くにいる者); Ιερουσαλημ ἀναβήτω ἐπὶ τὴν καρδίαν ὑμῶν — «Иерусалим да взойдёт на сердце ваше» (心に上らせよ)."
  51: "ᾐσχύνθημεν, ὅτι ἠκούσαμεν ὀνειδισμὸν ἡμῶν — «посрамились мы, ибо услышали поношение наше» (辱められた, ののしり); κατεκάλυψεν ἀτιμία τὸ πρόσωπον ἡμῶν — «покрыло бесчестие лицо наше» (恥が顔を覆った). εἰσῆλθον ἀλλογενεῖς εἰς τὰ ἅγια ἡμῶν — «вошли иноплеменники во святыни наши» (他国の者たち, 聖所); εἰς οἶκον κυρίου — «в дом Господень» (主の家)."
  52: "διὰ τοῦτο ἰδοὺ ἡμέραι ἔρχονται — «посему вот, приходят дни»; ἐκδικήσω ἐπὶ τὰ γλυπτὰ αὐτῆς — «посещу изваяния её» (彫り物); ἐν πάσῃ τῇ γῇ αὐτῆς πεσοῦνται τραυματίαι — «по всей земле её падут поражённые» (刺し貫かれた者たち)."
  53: "ἐὰν ἀναβῇ Βαβυλὼν ὡς ὁ οὐρανός — «если и взойдёт Вавилон, как небо» (天に上り); ἐὰν ὀχυρώσῃ ὕψος ἰσχύος αὐτῆς — «если и укрепит высоту силы своей» (力の高みを堅くする); παρ᾿ ἐμοῦ ἥξουσιν ἐξολεθρεύοντες αὐτήν — «от Меня придут истребляющие её» (滅ぼす者たち)."
  54: "φωνὴ κραυγῆς ἐν Βαβυλῶνι — «голос вопля в Вавилоне» (叫びの声); συντριβὴ μεγάλη ἐν γῇ Χαλδαίων — «великое сокрушение в земле Халдейской» (大いなる破壊)."
  55: "ἐξωλόθρευσεν κύριος τὴν Βαβυλῶνα — «истребил Господь Вавилон»; ἀπώλεσεν ἀπ᾿ αὐτῆς φωνὴν μεγάλην ἠχοῦσαν ὡς ὕδατα πολλά — «погубил от неё голос великий, звучавший как воды многие» (多い水のように響く); ἔδωκεν εἰς ὄλεθρον φωνὴν αὐτῆς — «предал в погибель голос её» (滅びに渡された)."
  56: "ἦλθεν ἐπὶ Βαβυλῶνα ταλαιπωρία — «пришла на Вавилон беда» (災い); ἑάλωσαν οἱ μαχηταὶ αὐτῆς — «взяты воины её» (捕らえられ); ἐπτόηται τὸ τόξον αὐτῶν — «устрашён (сокрушён) лук их» (弓は折られた). θεὸς ἀνταποδίδωσιν αὐτοῖς — «Бог воздаёт им»; κύριος ἀνταποδίδωσιν αὐτῇ τὴν ἀνταπόδοσιν — «Господь воздаёт ей воздаяние» (報いを報いられる)."
  57: "μεθύσει μέθῃ τοὺς ἡγεμόνας αὐτῆς — «упоит допьяна начальников её» (知事たち); τοὺς σοφοὺς αὐτῆς καὶ τοὺς στρατηγοὺς αὐτῆς — «мудрых её и военачальников её» (知者, 長官). Слав. добавляет «вои его и сильныя его» (戦士たち, 力ある者たち) — нет в LXX, внесено без 〔…〕. λέγει ὁ βασιλεύς, κύριος παντοκράτωρ ὄνομα αὐτῷ — «говорит Царь, Господь Вседержитель имя Ему» (王である主、その名は全能者)."
  58: "Τεῖχος Βαβυλῶνος ἐπλατύνθη — «стена Вавилона расширилась» (城壁は広く); κατασκαπτόμενον κατασκαφήσεται — «подкопом будет подкопана» (掘り崩される). αἱ πύλαι αὐτῆς αἱ ὑψηλαὶ ἐμπυρισθήσονται — «врата её высокие сожжены будут» (高い門); οὐ κοπιάσουσιν λαοὶ εἰς κενόν — «не будут трудиться народы напрасно» (むなしく労し); ἔθνη ἐν ἀρχῇ ἐκλείψουσιν — «народы в начале оскудеют» (初めに力尽きる; тёмное место, слав. «языцы в начале погибнут»). Цитата 28:1–58 закрывается в конце стиха."
  59: "Ὁ λόγος ὃν ἐνετείλατο κύριος Ιερεμια τῷ προφήτῃ εἰπεῖν τῷ Σαραια — «слово, которое заповедал Господь Иеремии пророку сказать Сараии»: с этого стиха — повествование вне кавычек. υἱῷ Νηριου υἱοῦ Μαασαιου — «сыну Нирии, сына Маасеи» (ネリヤ, マアセヤ). ὅτε ἐπορεύετο παρὰ Σεδεκιου βασιλέως Ιουδα εἰς Βαβυλῶνα — «когда он шёл от Седекии, царя Иудейского, в Вавилон»; ἐν τῷ ἔτει τῷ τετάρτῳ τῆς βασιλείας αὐτοῦ — «в четвёртый год его царствования» (第四年). ἄρχων δώρων — «начальник даров» (贈り物の長; ru «главный постельничий» — иное понимание)."
  60: "ἔγραψεν Ιερμιας πάντα τὰ κακὰ ἃ ἥξει ἐπὶ Βαβυλῶνα — «написал Иеремия все бедствия, которые придут на Вавилон» (災い); ἐν βιβλίῳ ἑνί — «в одну книгу» (一つの巻物); πάντας τοὺς λόγους τούτους τοὺς γεγραμμένους ἐπὶ Βαβυλῶνα — «все слова эти, написанные на Вавилон». Слав. переносит сюда начало нашей 28:61 («И рече иеремиа к сарею») — деление держим по gr."
  61: "καὶ εἶπεν Ιερμιας πρὸς Σαραιαν — «и сказал Иеремия Сараии»: здесь открывается речь Иеремии 「…」 (до конца 64). Ὅταν ἔλθῃς εἰς Βαβυλῶνα — «когда придёшь в Вавилон»; καὶ ὄψῃ καὶ ἀναγνώσῃ πάντας τοὺς λόγους τούτους — «и увидишь, и прочитаешь все слова эти» (よく見て…読み)."
  62: "καὶ ἐρεῖς Κύριε κύριε — «и скажешь: Господи, Господи»: молитва, которую велено прочитать, — внутри речи Иеремии, поэтому 『…』. σὺ ἐλάλησας ἐπὶ τὸν τόπον τοῦτον τοῦ ἐξολεθρεῦσαι αὐτόν — «Ты изрёк о месте сем, чтобы истребить его»; μὴ εἶναι ἐν αὐτῷ κατοικοῦντας ἀπὸ ἀνθρώπου ἕως κτήνους — «чтобы не было в нём живущих от человека до скота»; ἀφανισμὸς εἰς τὸν αἰῶνα ἔσται — «запустением навек будет» (永久に荒れ果てたもの)."
  63: "ὅταν παύσῃ τοῦ ἀναγινώσκειν τὸ βιβλίον τοῦτο — «когда окончишь читать книгу сию» (この書を読み終えたなら); ἐπιδήσεις ἐπ᾿ αὐτὸ λίθον — «привяжешь к ней камень» (石を結びつけ); ῥίψεις αὐτὸ εἰς μέσον τοῦ Εὐφράτου — «бросишь её в середину Евфрата» (ユーフラテス川の中へ投げ込み)."
  64: "καὶ ἐρεῖς Οὕτως καταδύσεται Βαβυλὼν — «и скажешь: так погрузится Вавилон» (沈む): слово при бросании свитка, 『…』. οὐ μὴ ἀναστῇ ἀπὸ προσώπου τῶν κακῶν ὧν ἐγὼ ἐπάγω ἐπ᾿ αὐτήν — «не восстанет от лица бедствий, которые Я наведу на него» (起き上がらない). Слав. добавляет «и разорится» и колофон «Даже до зде словеса иеремиина» (ここまでがエレミヤの言葉) — нет в LXX, внесено без 〔…〕."
