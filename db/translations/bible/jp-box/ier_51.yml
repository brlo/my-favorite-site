# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc этой главы не имеет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 51 — слово к иудеям в Египте (в слав./ru это глава 44), а в конце — слово
# Варуху (в слав./ru это глава 45).
# План: 1 надписание; 2–6 «вы видели всё зло, которое Я навёл на Иерусалим», «за
# нечестие их»; 4–5 «Я посылал пророков, вы не послушали»; 6 излилась ярость,
# города стали пустыней; 7–10 «зачем вы делаете великое зло душам вашим», «разве
# забыли нечестие отцов»; 11–14 «вот, Я обращаю лицо Моё на вас во зло»,
# «не будет спасшегося»; 15–19 народ отвечает: «слова, которое ты говорил, не
# слушаем», «будем кадить царице неба» (17–19 — царица небесная), «разве без
# ведома мужей наших делали мы ей лепёшки?»; 20–23 ответ Иеремии: «не это ли
# каждение вспомянул Господь», «Господь не мог более терпеть», «постигли вас эти
# бедствия»; 24–30 «слушайте слово Господне», «вы, жёны, устами говорили»,
# «Я поклялся великим именем Моим», «Я бодрствую над вами», «вот вам знамение»,
# «предаю фараона Уафре»; 31–35 слово Варуху: 31 надписание, 32 «так говорит
# Господь о тебе, Варух», 33 «горе мне, горе мне!» (слова Варуха в 『…』),
# 34 «что Я построил, разрушу», 35 «и ты ищешь себе великого? не ищи».
# Голоса: 1 — авторский текст; 2–14 — 「…」 (слово Господа); 15 — авторский текст;
# 16–19 — 「…」 (речь народа); 20 — авторский текст; 21–23 — 「…」 (ответ Иеремии);
# 24 — вводная формула вне кавычек, начало речи Господа; 25–30 — 「…」 (слово
# Господа, внутри — слова жён в 『…』, 25); 31 — авторский текст; 32 — формула вне
# кавычек; 33–35 — 「…」 (слово Господа Варуху, внутри — слова Варуха в 『…』, 33).
# Нумерация по gr: 35 стихов; слав. 44 — 30 стихов. Карта: 51:1–10 = слав. 44:1–10
# (номер в номер); 51:11–14 = слав. 44:11–14 с переразбивкой: хвост слав. 44:11
# («еже погубити вся люди иудины») в греч. отнесён к 51:12 (τοῦ ἀπολέσαι πάντας
# τοὺς καταλοίπους), а начало слав. 44:12 («и возму останки иудины…») в греч.
# отсутствует; 51:15–30 = слав. 44:15–30 (номер в номер); 51:31–35 = слав. 45:1–5 —
# слово Варуху, которое в LXX стоит в конце книги (слав. выносит его в гл. 45).
# 〔…〕 нет; сносок ⟨…⟩ нет: 香をたく, 灌祭, 天の女王, 王座, 誓い, 獲物 уже в корпусе,
# пояснения — в notes.
# Имена — транслитерация греческого (LXX): エレミヤ, バルク, ネリヤ (Νηριας),
# マグドル (Μαγδωλος), タフナヘス (Ταφνας), メンフィス (по слав. «мемфис»),
# パトロス (Παθουρης), バビロン, セデキヤ, ネブカドネツァル, ヨヤキム,
