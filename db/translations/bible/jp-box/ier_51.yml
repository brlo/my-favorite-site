verses:
  1: "エジプトの地[ち]に住[す]むすべてのユダヤ人[じん]、すなわちマグドル、タフナヘス、メンフィス、パトロスの地[ち]に住[す]む者[もの]たちに語[かた]られた、エレミヤに臨[のぞ]んだ言葉[ことば]は次[つぎ]のとおりである。"
  2: "「イスラエルの神[かみ]である主[しゅ]はこう言[い]われる。あなたがたは、わたしがエルサレムとユダの町[まち]々[まち]に下[くだ]したすべての災[わざわ]いを見[み]た。見[み]よ、それらは今[いま]、住[す]む者[もの]を失[うしな]って荒[あ]れ果[て]てている。"
  3: "それは、彼らがわたしを怒[いか]らせるために行[おこな]った自分[じぶん]たちの悪[あく]のゆえである。彼らは行[い]って、あなたがたもあなたがたの父[ちち]たちも知[し]らなかったべつの神[かみ]々[がみ]に香[こう]をたいた。"
  4: "わたしは朝[あさ]早[はや]くから、わたしのしもべである預言者[よげんしゃ]たちをあなたがたに遣[つか]わし、遣[つか]わして言[い]った。『この汚[けが]れの行[おこな]いをしてはならない。わたしが憎[にく]んでいるものだ』と。"
  5: "しかし彼らはわたしに聞[き]かず、耳[みみ]を傾[かたむ]けて自分[じぶん]たちの悪[あく]から離[はな]れ返[かえ]ることも、べつの神[かみ]々[がみ]に香[こう]をたたくこともなかった。"
  6: "わたしの怒[いか]りと憤[いか]りは滴[したた]り落[お]ちて、ユダの町[まち]々[まち]とエルサレムの外[そと]で燃[も]え上[あ]がり、それらは荒[あ]れ果[は]てて人[ひと]の住[す]まない所[ところ]となり、今日[きょう]のとおりになった。"
  7: "そして今[いま]、万軍[ばんぐん]の主[しゅ]はこう言[い]われる。なぜあなたがたは、自分[じぶん]たちの魂[たましい]に大[おお]きな悪[あく]を行[おこな]い、ユダの中[なか]から男[おとこ]も女[おんな]も、幼[おさな]い子[こ]も乳[ちち]を飲[の]む子[こ]も断[た]ち絶[た]やして、あなたがたのうちに一人[ひとり]も残[のこ]らないようにするのか。"
  8: "あなたがたの手[て]のわざによって、エジプトの地[ち]でべつの神[かみ]々[がみ]に香[こう]をたたいてわたしを怒[いか]らせ、自分[じぶん]たちを断[た]ち絶[た]やし、地[ち]のすべての民[たみ]の間[あいだ]で呪[のろ]いとそしりとなるためである。あなたがたはそこへ入[はい]って住[す]もうとしているではないか。"
  9: "あなたがたの父[ちち]たちの悪[あく]、ユダの王[おう]たちの悪[あく]、あなたがたの君[きみ]たちの悪[あく]、あなたがた自身[じしん]の悪[あく]、あなたがたの妻[つま]たちの悪[あく]、すなわちユダの地[ち]とエルサレムの外[そと]で行[おこな]われた悪[あく]を、あなたがたは忘[わす]れたのか。"
  10: "彼らは今日[きょう]に至[いた]るまでやめず、わたしがあなたがたの前[まえ]、あなたがたの父[ちち]たちの目[め]の前[まえ]に与[あた]えたわたしの律法[りっぽう]と定[さだ]めを守[まも]らなかった。"
  11: "それゆえ、万軍[ばんぐん]の主[しゅ]、イスラエルの神[かみ]はこう言[い]われる。見[み]よ、わたしはあなたがたに顔[かお]を向[む]けて災[わざわ]いを下[くだ]し、ユダの民[たみ]をことごとく断[た]ち滅[ほろ]ぼす。"
  12: "顔[かお]をエジプトの地[ち]に向[む]けてそこへ入[はい]って住[す]もうとしたユダの残[のこ]りの者[もの]たちを、わたしは取[と]る。彼らはエジプトの地[ち]でことごとく断[た]たれ、剣[つるぎ]と飢[き]饉[きん]によって倒[たお]れ、小[ちい]さい者[もの]から大[おお]きい者[もの]まで尽[つ]き果[は]てて、そしりと滅[ほろ]びと呪[のろ]いとなる。"
  13: "わたしは、エルサレムを訪[たず]ねたように、エジプトの地[ち]に住[す]む者[もの]たちを、剣[つるぎ]と飢[き]饉[きん]と死[し]によって訪[たず]ねる。"
  14: "エジプトの地[ち]に寄留[きりゅう]しているユダの残[のこ]りの者[もの]たちのうち、ユダの地[ち]に帰[かえ]ろうと望[のぞ]み、そこへ帰[かえ]って住[す]もうと心[こころ]の底[そこ]から願[ねが]っている者[もの]は、一人[ひとり]も救[すく]われて帰[かえ]ることはない。逃[のが]れ出[で]た者[もの]たちのほかは、だれも帰[かえ]らない。」"
  15: "すると、自分[じぶん]たちの妻[つま]がべつの神[かみ]々[がみ]に香[こう]をたたいていることを知[し]っているすべての男[おとこ]たち、また大[おお]きな集[あつ]まりとなったすべての女[おんな]たち、およびパトロスの地[ち]、エジプトの地[ち]に住[す]むすべての民[たみ]が、エレミヤに答[こた]えて言[い]った。"
  16: "「あなたが主[しゅ]の名[な]によってわたしたちに語[かた]った言葉[ことば]を、わたしたちはあなたから聞[き]かない。"
  17: "わたしたちは、自分[じぶん]たちの口[くち]から出[で]るすべての言葉[ことば]を必[かなら]ず行[おこな]い、天[てん]の女王[じょおう]に香[こう]をたたき、彼女[かのじょ]に灌[かん]祭[さい]を注[そそ]ぐ。わたしたちも、わたしたちの父[ちち]たちも、わたしたちの王[おう]たちも、君[きみ]たちも、ユダの町[まち]々[まち]とエルサレムの外[そと]でそうしたように。そのとき、わたしたちはパンに満[み]ち足[た]り、幸[しあわ]せで、悪[わる]い目[め]に遭[あ]わなかった。"
  18: "そして、わたしたちが天[てん]の女王[じょおう]に香[こう]をたたき、彼女[かのじょ]に灌[かん]祭[さい]を注[そそ]ぐのをやめてから、わたしたちはすっかり乏[とぼ]しくなり、剣[つるぎ]と飢[き]饉[きん]によって滅[ほろ]びた。"
  19: "また、わたしたちが彼女[かのじょ]に香[こう]をたたき、灌[かん]祭[さい]を注[そそ]ぐとき、わたしたちは夫[おっと]たちの承[しょう]知[ち]なしに、彼女[かのじょ]に焼[や]き菓子[がし]を供[そな]えたり、灌[かん]祭[さい]を注[そそ]いだりしただろうか。」"
  20: "エレミヤは、自分[じぶん]に言葉[ことば]を返[かえ]したすべての民[たみ]、すなわち力[ちから]ある男[おとこ]たち、女[おんな]たち、およびすべての民[たみ]に言[い]った。"
  21: "「あなたがたも、あなたがたの父[ちち]たちも、あなたがたの王[おう]たちも、君[きみ]たちも、地[ち]の民[たみ]も、ユダの町[まち]々[まち]とエルサレムの外[そと]でたいた香[こう]を、主[しゅ]は思[おも]い起[おこ]されなかったのか。それが主[しゅ]の心[こころ]に上[のぼ]らなかったのか。"
  22: "主[しゅ]は、あなたがたの悪[あく]い行[おこな]いと、あなたがたが行[おこな]った忌[い]まわしいことのゆえに、もはや耐[た]えられなくなって、あなたがたの地[ち]は荒[あ]れ果[は]て、人[ひと]の住[す]まない所[ところ]、呪[のろ]いとなり、今日[きょう]のとおりになった。"
  23: "あなたがたが香[こう]をたたき、主[しゅ]に罪[つみ]を犯して、主[しゅ]の声[こえ]に聞[き]き従[したが]わず、その定[さだ]めと律法[りっぽう]と証[あかし]のうちを歩[あゆ]まなかったために、これらの災[わざわ]いがあなたがたに及[およ]んだのである。」"
  24: "エレミヤは民[たみ]と女[おんな]たちに言[い]った。「主[しゅ]の言葉[ことば]を聞[き]け。エジプトの地[ち]にいるすべてのユダの人[ひと]々[びと]よ。"
  25: "万軍[ばんぐん]の主[しゅ]、イスラエルの神[かみ]はこう言[い]われる。あなたがた女[おんな]たちは自分[じぶん]たちの口[くち]で語[かた]り、自分[じぶん]たちの手[て]でそれを成[な]し遂[と]げて言[い]った。『わたしたちは、誓[ちか]ったとおりに必[かなら]ず行[おこな]い、天[てん]の女王[じょおう]に香[こう]をたたき、彼女[かのじょ]に灌[かん]祭[さい]を注[そそ]ぐ』と。あなたがたはその誓[ちか]いを固[かた]く守[まも]り、必[かなら]ず行[おこな]ってきた。"
  26: "それゆえ、エジプトの地[ち]に住[す]むすべてのユダの人[ひと]々[びと]よ、主[しゅ]の言葉[ことば]を聞[き]け。見[み]よ、わたしはわたしの大[おお]いなる名[な]によって誓[ちか]った、と主[しゅ]は言[い]われる。エジプトの全[ぜん]地[ち]で、ユダの人[ひと]がだれも『主[しゅ]は生[い]きておられる』と言[い]って、もはやわたしの名[な]を口[くち]にすることはない。"
  27: "見[み]よ、わたしは彼らに対して目[め]を覚[さ]まして災[わざわ]いを下[くだ]し、良[よ]いことはしない。エジプトの地[ち]に住[す]むすべてのユダの人[ひと]は、剣[つるぎ]と飢[き]饉[きん]によって尽[つ]き果[は]てるまで滅[ほろ]びる。"
  28: "しかし、剣[つるぎ]から逃[のが]れた者[もの]たちは、少[すこ]しの数[かず]でユダの地[ち]に帰[かえ]る。エジプトの地[ち]に住[す]むためにやって来[き]たユダの残[のこ]りの者[もの]たちはみな、だれの言葉[ことば]が成[な]り立[た]つのか、わたしの言葉[ことば]か、それとも彼らの言葉[ことば]かを知[し]る。"
  29: "これがあなたがたへのしるしである。わたしがこの場所[ばしょ]であなたがたを災[わざわ]いのために訪[たず]ねるというしるしである。あなたがたは、わたしの言葉[ことば]があなたがたの上[うえ]に災[わざわ]いとして必[かなら]ず成[な]り立[た]つことを知[し]るであろう。"
  30: "万軍[ばんぐん]の主[しゅ]はこう言[い]われる。見[み]よ、わたしはエジプトの王[おう]ファラオ・ウアフレを、彼の敵[てき]の手[て]、彼の命[いのち]を求[もと]める者[もの]の手[て]に渡[わた]す。ちょうど、わたしがユダの王[おう]セデキヤを、彼の敵[てき]であり彼の命[いのち]を求[もと]めたバビロンの王[おう]ネブカドネツァルの手[て]に渡[わた]したように。」"
  31: "預言者[よげんしゃ]エレミヤがバルク、ネリヤの子[こ]に語[かた]った言葉[ことば]は次[つぎ]のとおりである。それは、ユダの王[おう]ヨヤキムの第四年[だいよんねん]に、バルクがエレミヤの口[くち]からこれらの言葉[ことば]を書[か]き物[もの]に記[しる]したときのことである。"
  32: "主[しゅ]はあなたについてこう言[い]われる。"
  33: "「あなたは言[い]った。『ああ、わたしは不幸[ふこう]だ。ああ、わたしは不幸[ふこう]だ。主[しゅ]がわたしの苦[くる]しみに労苦[ろうく]を加[くわ]えられた。わたしは嘆[なげ]きながら眠[ねむ]りにつき、安[やす]らぎを得[え]なかった』と。"
  34: "彼に言[い]え。主[しゅ]はこう言[い]われる。見[み]よ、わたしが建[た]てたものを、わたしが壊[こわ]し、わたしが植[う]えたものを、わたしが抜[ぬ]き去[さ]る。この地[ち]も、すべて。"
  35: "あなたは自分[じぶん]のために大[おお]きなことを求[もと]めているのか。求[もと]めるな。見[み]よ、わたしはすべての肉[にく]なる者[もの]に災[わざわ]いを下[くだ]す、と主[しゅ]は言[い]われる。あなたの魂[たましい]は、あなたがどこへ行[い]っても、獲物[えもの]として与[あた]えられる。」"

notes:
  1: "Ὁ λόγος ὁ γενόμενος πρὸς Ιερεμιαν ἅπασιν τοῖς Ιουδαίοις — «слово, бывшее к Иеремии ко всем Иудеям»; τοῖς κατοικοῦσιν ἐν γῇ Αἰγύπτῳ καὶ τοῖς καθημένοις ἐν Μαγδώλῳ καὶ ἐν Ταφνας καὶ ἐν γῇ Παθουρης — «живущим в земле Египетской и сидящим в Магдоле, и в Тафне, и в земле Пафурской»; слав. добавляет «и во мемфисе» (メンフィス) и «(от Господа)» в скобках: первое внесено в текст без скобок (нет в LXX), второе — редакторская вставка, не переведена. Здесь же начало карты: 51:1–30 = слав. 44:1–30, 51:31–35 = слав. 45:1–5 (см. notes 31)."
  2: "Οὕτως εἶπεν κύριος ὁ θεὸς Ισραηλ — «так говорит Господь Бог Израилев»; ἑωράκατε πάντα τὰ κακά, ἃ ἐπήγαγον ἐπὶ Ιερουσαλημ — «вы видели всё зло, которое Я навёл на Иерусалим» (ἐπάγω — наводить); ἰδοὺ εἰσιν ἔρημοι ἀπὸ ἐνοίκων — «вот, они пусты от жителей» (ἔνοικος — житель). Отсюда до 14 — слово Господа в 「…」."
  3: "ἀπὸ προσώπου πονηρίας αὐτῶν, ἧς ἐποίησαν παραπικρᾶναί με — «от лица злобы их, которую они сделали, чтобы прогневать Меня» (παραπικραίνω — горько прогневлять); πορευθέντες θυμιᾶν θεοῖς ἑτέροις — «ходя кадить иным богам» (θυμιάω — кадить, 香をたく); οἷς οὐκ ἔγνωτε — «которых вы не знали»; слав. добавляет «вы сами и отцы ваши» — нет в LXX, внесено в текст без скобок."
  4: "ἀπέστειλα πρὸς ὑμᾶς τοὺς παῖδάς μου τοὺς προφήτας ὄρθρου καὶ ἀπέστειλα — «Я посылал к вам рабов Моих, пророков, с рассвета (ὄρθρου) и послал»; двойное «посылал и послал» сохранено; Μὴ ποιήσητε τὸ πρᾶγμα τῆς μολύνσεως ταύτης — «не делайте этого дела осквернения» (μόλυνσις — осквернение); ἧς ἐμίσησα — «которое Я возненавидел». Слова Господа, переданные через пророков, — 『…』."
  5: "οὐκ ἤκουσάν μου — «не послушали Меня»; οὐκ ἔκλιναν τὸ οὖς αὐτῶν — «не приклонили уха своего»; ἀποστρέψαι ἀπὸ τῶν κακῶν αὐτῶν — «чтобы обратиться от злых дел своих»; πρὸς τὸ μὴ θυμιᾶν θεοῖς ἑτέροις — «чтобы не кадить иным богам». Слав. «ни приклониша уха своего»."
  6: "ἔσταξεν ἡ ὀργή μου καὶ ὁ θυμός μου — «источилась ярость Моя и гнев Мой» (στάζω — капать; ср. 49:18); ἐξεκαύθη ἐν πόλεσιν Ιουδα καὶ ἔξωθεν Ιερουσαλημ — «возгорелась в городах Иуды и вне Иерусалима»; слав. «во вратех иудиных» (у ворот) — расхождение с LXX «в городах»; в тексте по греч. 町々; εἰς ἐρήμωσιν καὶ εἰς ἄβατον ὡς ἡ ἡμέρα αὕτη — «в опустошение и в непроходимое, как день сей»."
  7: "καὶ νῦν οὕτως εἶπεν κύριος παντοκράτωρ — «и ныне так говорит Господь Вседержитель» (παντοκράτωρ, слав. «вседержитель»); Ἵνα τί ὑμεῖς ποιεῖτε κακὰ μεγάλα ἐπὶ ψυχαῖς ὑμῶν — «зачем вы делаете великое зло душам вашим»; ἐκκόψαι ὑμῶν ἄνθρωπον καὶ γυναῖκα, νήπιον καὶ θηλάζοντα — «истребляя у себя мужа и жену, младенца и сосущего» (ἐκκόπτω — вырубать, истреблять). Слав. «изсещи вам мужы и жены»."
  8: "παραπικρᾶναί με ἐν τοῖς ἔργοις τῶν χειρῶν ὑμῶν — «прогневать Меня делами рук ваших»; εἰς ἣν εἰσήλθατε ἐνοικεῖν ἐκεῖ — «в которую вы вошли жить там»; ἵνα ἐκκοπῆτε καὶ ἵνα γένησθε εἰς κατάραν καὶ εἰς ὀνειδισμὸν ἐν πᾶσιν τοῖς ἔθνεσιν τῆς γῆς — «чтобы вам быть истреблёнными и стать проклятием и поношением у всех народов земли». Слав. «да изсечени будете»."
  9: "μὴ ἐπιλέλησθε ὑμεῖς τῶν κακῶν τῶν πατέρων ὑμῶν — «разве вы забыли злодеяния отцов ваших» (ἐπιλανθάνομαι); τῶν κακῶν τῶν βασιλέων Ιουδα καὶ τῶν κακῶν τῶν ἀρχόντων ὑμῶν καὶ τῶν κακῶν τῶν γυναικῶν ὑμῶν — «злодеяния царей Иуды, князей ваших и жён ваших»; слав. добавляет «и злобы вашя» (あなたがた自身の悪) — по МТ, нет в LXX; внесено в текст без скобок. ὧν ἐποίησαν ἐν γῇ Ιουδα καὶ ἔξωθεν Ιερουσαλημ — «которые они делали в земле Иуды и вне Иерусалима»."
  10: "καὶ οὐκ ἐπαύσαντο ἕως τῆς ἡμέρας ταύτης — «и не перестали до сего дня»; οὐκ ἀντείχοντο τῶν προσταγμάτων μου — «не держались повелений Моих» (ἀντέχομαι — держаться); ὧν ἔδωκα κατὰ πρόσωπον τῶν πατέρων αὐτῶν — «которые Я дал пред лицом отцов их»; слав. шире: «законов моих и повелений моих, яже дах пред лицем вашим и пред очима отец ваших» — внесено в текст по слав. без скобок (нет в LXX); вариант LXX — здесь."
  11: "διὰ τοῦτο οὕτως εἶπεν κύριος — «посему так сказал Господь»; Ἰδοὺ ἐγὼ ἐφίστημι τὸ πρόσωπόν μου — «вот, Я обращаю (ἐφίστημι) лицо Моё». Слав. добавляет «сил, Бог израилев» и «на вы во зло, еже погубити вся люди иудины» — внесено по слав.; в греч. «погубить всех остальных» открывает ст. 12 (τοῦ ἀπολέσαι πάντας τοὺς καταλοίπους). Переразбивка границы 11/12 — см. notes 12."
  12: "τοῦ ἀπολέσαι πάντας τοὺς καταλοίπους τοὺς ἐν Αἰγύπτῳ — «чтобы погубить всех остальных, которые в Египте» (ἀπόλλυμι); καὶ πεσοῦνται — «и падут»; ἐν ῥομφαίᾳ καὶ ἐν λιμῷ ἐκλείψουσιν ἀπὸ μικροῦ ἕως μεγάλου — «мечом и голодом исчезнут от малого до великого»; ἔσονται εἰς ὀνειδισμὸν καὶ εἰς ἀπώλειαν καὶ εἰς κατάραν — «будут в поношение, в погибель и в проклятие». Слав. 44:12 начинается словами «и возму останки иудины, иже поставиша лица своя, еже внити в землю египетску и жити тамо» — в греч. этого нет; внесено в текст без скобок по паритету (церковное чтение), а хвост слав. 44:11 («еже погубити вся люди иудины») по греч. отнесён к этому стиху."
  13: "καὶ ἐπισκέψομαι ἐπὶ τοὺς καθημένους ἐν γῇ Αἰγύπτῳ — «и посещу сидящих в земле Египетской» (ἐπισκέπτομαι — посещать, взыскивать); ὡς ἐπεσκεψάμην ἐπὶ Ιερουσαλημ — «как посетил Иерусалим»; ἐν ῥομφαίᾳ καὶ ἐν λιμῷ καὶ ἐν θανάτῳ — «мечом, голодом и смертью»."
  14: "οὐκ ἔσται σεσῳσμένος οὐθεὶς τῶν ἐπιλοίπων Ιουδα — «не будет спасённого никого из оставшихся Иуды»; τῶν παροικούντων ἐν γῇ Αἰγύπτῳ — «пришельцев (παροικέω — жить пришельцем) в земле Египетской»; ἐφ' ἣν αὐτοὶ ἐλπίζουσιν ταῖς ψυχαῖς αὐτῶν — «на которую они надеются душами своими»; οὐ μὴ ἐπιστρέψωσιν ἀλλ' ἢ ἀνασεσῳσμένοι — «не возвратятся, разве убежавшие (спасшиеся бегством)». Здесь закрывается слово Господа."
  15: "ἀπεκρίθησαν τῷ Ιερεμια πάντες οἱ ἄνδρες οἱ γνόντες ὅτι θυμιῶσιν αἱ γυναῖκες αὐτῶν θεοῖς ἑτέροις — «отвечали Иеремии все мужи, знавшие, что жёны их кадят иным богам»; συναγωγὴ μεγάλη — «собрание великое» (συναγωγή — собрание); οἱ καθήμενοι ἐν γῇ Αἰγύπτῳ ἐν Παθουρη — «сидящие в земле Египетской, в Пафуре». Отсюда до 19 — речь народа в 「…」."
  16: "Ὁ λόγος, ὃν ἐλάλησας πρὸς ἡμᾶς τῷ ὀνόματι κυρίου, οὐκ ἀκούσομέν σου — «слова, которое ты говорил нам именем Господа, мы не послушаем от тебя» (ἀκούω с род. — слушать кого). Слав. «слово, еже глаголал еси... не послушаем тебе»."
  17: "ποιοῦντες ποιήσομεν πάντα τὸν λόγον, ὃς ἐξελεύσεται ἐκ τοῦ στόματος ἡμῶν — «делая сделаем всякое слово, которое выйдет из уст наших» (гебраизм усиления); θυμιᾶν τῇ βασιλίσσῃ τοῦ οὐρανοῦ καὶ σπένδειν αὐτῇ σπονδάς — «кадить царице неба и возливать ей возлияния» (βασίλισσα — царица, 天の女王; σπονδή — возлияние, 灌祭); καθὰ ἐποιήσαμεν ἡμεῖς καὶ οἱ πατέρες ἡμῶν καὶ οἱ βασιλεῖς ἡμῶν καὶ οἱ ἄρχοντες ἡμῶν — «как делали мы, отцы наши, цари наши и князья наши»; ἐπλήσθημεν ἄρτων καὶ ἐγενόμεθα χρηστοὶ καὶ κακὰ οὐκ εἴδομεν — «насытились хлебами, стали благополучны и зла не видели». Здесь тема «царицы небесной» (17–19)."
  18: "ὡς διελίπομεν θυμιῶντες τῇ βασιλίσσῃ τοῦ οὐρανοῦ — «когда мы перестали кадить царице неба» (διαλείπω — прекращать); ἠλαττώθημεν πάντες — «мы все умалились (оскудели)» (ἐλαττόω); ἐν ῥομφαίᾳ καὶ ἐν λιμῷ ἐξελείπομεν — «мечом и голодом исчезли». Слав. добавляет «и возливати возлияния» и «хлебы» (оскудехом хлебы) — нет в LXX; первое внесено в текст без скобок, второе сглажено в «すっかり乏しくなり»."
  19: "μὴ ἄνευ τῶν ἀνδρῶν ἡμῶν ἐποιήσαμεν αὐτῇ χαυῶνας — «разве без мужей наших делали мы ей χαυῶνας» (χαυῶνας — лепёшки, печенье с изображением богини, 焼き菓子); ἐσπείσαμεν σπονδάς — «возливали ей возлияния». Слав. «опресноки» (пресные лепёшки). Риторический вопрос — конец речи народа."
  20: "καὶ εἶπεν Ιερεμιας παντὶ τῷ λαῷ, τοῖς δυνατοῖς καὶ ταῖς γυναιξίν — «и сказал Иеремия всему народу, сильным (οἱ δυνατοί) и жёнам»; τοῖς ἀποκριθεῖσιν αὐτῷ λόγους — «отвечавшим ему словами»."
  21: "Οὐχὶ τοῦ θυμιάματος, οὗ ἐθυμιάσατε... ἐμνήσθη κύριος — «не об этом ли каждении, которое вы кадили... вспомнил Господь» (μιμνήσκομαι); καὶ ἀνέβη ἐπὶ τὴν καρδίαν αὐτοῦ — «и взошло это на сердце Его». Перечисление: вы, отцы ваши, цари ваши, князья ваши и народ земли."
  22: "καὶ οὐκ ἠδύνατο κύριος ἔτι φέρειν — «и не мог Господь более терпеть» (φέρω — нести, терпеть); ἀπὸ προσώπου πονηρίας πραγμάτων ὑμῶν — «от лица злобы дел ваших»; ἀπὸ τῶν βδελυγμάτων — «от мерзостей» (βδέλυγμα); εἰς ἐρήμωσιν καὶ εἰς ἄβατον καὶ εἰς ἀρὰν — «в опустошение, в непроходимое и в проклятие»; слав. добавляет «еже не быти живущым» (住む者がいない) — нет в LXX, внесено в текст без скобок."
  23: "ἀπὸ προσώπου ὧν ἐθυμιᾶτε καὶ ὧν ἡμαρτετε τῷ κυρίῳ — «от лица того, что вы кадили и грешили Господу»; οὐκ ἠκούσατε τῆς φωνῆς κυρίου — «не послушали гласа Господа»; ἐν τοῖς προστάγμασιν αὐτοῦ καὶ ἐν τῷ νόμῳ αὐτοῦ καὶ ἐν τοῖς μαρτυρίοις αὐτοῦ οὐκ ἐπορεύθητε — «по повелениям Его, по закону Его и по свидетельствам (μαρτύρια) Его не ходили»; ἐπελάβετο ὑμῶν τὰ κακὰ ταῦτα — «постигли вас эти бедствия». Здесь закрывается ответ Иеремии."
  24: "καὶ εἶπεν Ιερεμιας τῷ λαῷ καὶ ταῖς γυναιξίν — «и сказал Иеремия народу и жёнам»; Ἀκούσατε τὸν λόγον κυρίου — «слушайте слово Господне»; слав. добавляет «весь иуда, иже есте в земли египетстей» (エジプトの地にいるすべてのユダ) — нет в LXX, внесено в текст без скобок. С 25 — слово Господа."
  25: "Ὑμεῖς γυναῖκες τῷ στόματι ὑμῶν ἐλαλήσατε καὶ ταῖς χερσὶν ὑμῶν ἐπληρώσατε — «вы, жёны, устами вашими говорили и руками вашими исполнили»; Ποιοῦσαι ποιήσομεν τὰς ὁμολογίας ἡμῶν — «делая сделаем обеты наши» (ὁμολογία — обещание, обет); ἐμμεῖνασαι ἐνεμείνατε — «пребывая пребыли» (ἐμμένω — держаться); ποιοῦσαι ἐποιήσατε — «делая сделали». Двойные глаголы сохранены; слав. «творяще сотворим исповедания наша»."
  26: "Ἰδοὺ ὤμοσα τῷ ὀνόματί μου τῷ μεγάλῳ — «вот, Я поклялся великим именем Моим»; ἐὰν γένηται ἔτι ὄνομά μου ἐν τῷ στόματι παντὸς Ιουδα — «если ещё будет имя Моё в устах всякого Иуды» (клятвенная формула с опущенным наказанием); εἰπεῖν Ζῇ κύριος κύριος — «сказать: жив Господь Господь», слав. «жив Господь Бог»; ἐπὶ πάσῃ γῇ Αἰγύπτῳ — «на всей земле Египетской»."
  27: "ἐγὼ ἐγρήγορα ἐπ' αὐτοὺς τοῦ κακῶσαι αὐτοὺς καὶ οὐκ ἀγαθῶσαι — «Я бодрствую (ἐγρήγορα) над ними, чтобы делать зло, а не добро»; ἐκλείψουσιν πᾶς Ιουδα οἱ κατοικοῦντες ἐν γῇ Αἰγύπτῳ ἐν ῥομφαίᾳ καὶ ἐν λιμῷ — «исчезнут все Иудеи, живущие в земле Египетской, от меча и голода»; ἕως ἂν ἐκλίπωσιν — «доколе не исчезнут»."
  28: "οἱ σεσῳσμένοι ἀπὸ ῥομφαίας ἐπιστρέψουσιν εἰς γῆν Ιουδα ὀλίγοι ἀριθμῷ — «спасшиеся от меча возвратятся в землю Иуды, немногие числом»; οἱ κατάλοιποι Ιουδα οἱ καταστάντες ἐν γῇ Αἰγύπτῳ κατοικῆσαι ἐκεῖ — «остаток Иуды, пришедший в землю Египетскую жить там»; λόγος τίνος ἐμμενεῖ — «слово чьё устоит» (ἐμμένω); слав. добавляет вопрос «мое, или их?» — внесено в текст (わたしの言葉か、それとも彼らの言葉か)."
  29: "καὶ τοῦτο ὑμῖν τὸ σημεῖον — «и вот вам знамение»; ὅτι ἐπισκέψομαι ἐγὼ ἐφ' ὑμᾶς εἰς πονηρά — «что Я посещу вас во зло»; слав. распространяет: «глаголет Господь, яко посещу аз на вы на месте сем, да уведите, яко воистинну исполнятся словеса моя на вас во злая» — нет в LXX, внесено в текст без скобок."
  30: "δίδωμι τὸν Ουαφρη βασιλέα Αἰγύπτου εἰς χεῖρας ἐχθροῦ αὐτοῦ — «предаю Уафре, царя Египетского, в руки врага его» (Ουαφρης — евр. Хофра); слав. «фараона вафриа» — титул внесён по слав. (ファラオ・ウアフレ); εἰς χεῖρας ζητούντων τὴν ψυχὴν αὐτοῦ — «в руки ищущих души его»; καθὰ ἔδωκα τὸν Σεδεκιαν — «как Я предал Седекию». Здесь закрывается слово Господа."
  31: "Ὁ λόγος, ὃν ἐλάλησεν Ιερεμιας ὁ προφήτης πρὸς Βαρουχ υἱὸν Νηριου — «слово, которое сказал Иеремия пророк Варуху, сыну Нирии»; ὅτε ἔγραφεν τοὺς λόγους τούτους ἐν τῷ βιβλίῳ ἀπὸ στόματος Ιερεμιου — «когда он записывал эти слова в книгу из уст Иеремии»; ἐν τῷ ἐνιαυτῷ τῷ τετάρτῳ τῷ Ιωακιμ υἱῷ Ιωσια βασιλέως Ιουδα — «в четвёртый год Иоакима, сына Иосии, царя Иудейского». Это слово в слав. вынесено в главу 45: gr 51:31–35 = слав. 45:1–5, номер в номер; в LXX оно стоит в конце книги Иеремии."
  32: "Οὕτως εἶπεν κύριος ἐπὶ σοί, Βαρουχ — «так говорит Господь о тебе, Варух». Вводная формула, кавычек нет; речь Господа открывается в 33."
  33: "Ὅτι εἶπας — «ибо ты сказал»: слова Варуха даны вложенной речью 『…』; Οἴμμοι οἴμμοι — «горе мне, горе мне» (οἴμμοι — возглас скорби); ὅτι προσέθηκεν κύριος κόπον ἐπὶ πόνον μοι — «ибо Господь приложил труд к болезни моей» (πόνος — боль, страдание); ἐκοιμήθην ἐν στεναγμοῖς — «я уснул в стенаниях» (στεναγμός — стенание); ἀνάπαυσιν οὐχ εὗρον — «покоя не нашёл»."
  34: "εἰπὸν αὐτῷ — «скажи ему»; Ἰδοὺ οὓς ἐγὼ ᾠκοδόμησα, ἐγὼ καθαιρῶ — «вот, что Я построил, Я разрушаю»; οὓς ἐγὼ ἐφύτευσα, ἐγὼ ἐκτίλλω — «что Я насадил, Я искореняю»; слав. добавляет «и всю землю мою» (この地も、すべて) — нет в LXX, внесено в текст без скобок."
  35: "καὶ σὺ ζητεῖς σεαυτῷ μεγάλα; — «и ты ищешь себе великого?»; μὴ ζητήσῃς — «не ищи»; ἐγὼ ἐπάγω κακὰ ἐπὶ πᾶσαν σάρκα — «Я навожу бедствия на всякую плоть»; δώσω τὴν ψυχήν σου εἰς εὕρεμα — «дам душу твою в находку (добычу)» (εὕρεμα — находка, 獲物); ἐν παντὶ τόπῳ, οὗ ἐὰν βαδίσῃς ἐκεῖ — «на всяком месте, куда бы ты ни пошёл». Здесь закрываются слово Господа и глава."
