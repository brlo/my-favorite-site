# jp-box, Иезекииль, глава 33. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 33 (совпадает).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: страж и ответственность каждого. 1–9 притча о страже: меч на землю,
# труба, кровь на голове слышавшего, кровь от руки стража (повтор 3:17–19);
# 10–20 «не хочу смерти грешника»: правда праведника не спасёт в день падения,
# суд по путям каждого (параллель 18:21–30); 21–22 весть о падении города
# и открытые уста пророка; 23–29 слово к оставшимся в земле: «Авраам был один»,
# кровь, идолы, меч, мерзости — опустошение; 30–33 народ слушает пророка как певца,
# но не исполняет; «узнают, что пророк был среди них».
# Голоса: 1, 23 — формулы вне кавычек; 21–22 — авторское повествование, слова
# спасшегося в 「…」 (21). 2–20 — одно слово Господа в 「…» (внутри: слова народа
# в 10 и 17 — 『…』; слова Господа к грешнику и праведнику в 8, 13, 14 — 『…』,
# как в 3:18); 24–33 — второе слово Господа в 「…」 (в 24 слова жителей, в 30 —
# слова народа — 『…』).
# «Точка»: 33:26 — в gr-lxx-byz на месте стиха «.», переведено по слав. (csl-ru)
# без 〔…〕; в notes «в модуле лакуна».
# Термины выровнены с 3:17–19 и 18:21–30: 見張[みは]り人[びと] — σκοπός; 戒[いまし]める;
# 質[しち]を返[かえ]す; 偶像[ぐうぞう]に目[め]を上[あ]げる; 隣人[りんじん]の妻[つま]を汚[けが]す;
# 「主[しゅ]の道[みち]は正[ただ]しくない」; 「それぞれ自分[じぶん]の道[みち]に従[したが]って
# 裁[さば]く」; 「あなたは必[かなら]ず死[し]ぬ」; 「血[ち]をあなたの手[て]から求[もと]める」.
# ラッパ — σάλπιγξ (по корпусу, без фуриганы).
#
