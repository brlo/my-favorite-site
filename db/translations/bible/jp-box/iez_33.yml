verses:
  1: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  2: "「人[ひと]の子[こ]よ、あなたの民[たみ]の子[こ]らに語[かた]り、彼らに言[い]え。わたしがある地[ち]に剣[つるぎ]を臨[のぞ]ませるとき、その地[ち]の民[たみ]が彼らの中[なか]から一人[ひとり]の者[もの]を取[と]って、自分[じぶん]たちの見張[みは]り人[びと]として置[お]くなら、"
  3: "その者[もの]が、剣[つるぎ]がその地[ち]に来[く]るのを見[み]、ラッパを吹[ふ]いて民[たみ]に合図[あいず]するなら、"
  4: "聞[き]いた者[もの]がラッパの音[ね]を聞[き]いても身[み]を守[まも]らず、剣[つるぎ]が来[き]て彼[かれ]を捕[と]らえるなら、その血[ち]はその頭[あたま]の上[うえ]にある。"
  5: "彼はラッパの音[ね]を聞[き]いても身[み]を守[まも]らなかった。その血[ち]は彼[かれ]の上[うえ]にある。しかし、この者[もの]は身[み]を守[まも]ったので、その魂[たましい]を救[すく]い出[だ]した。"
  6: "しかし、見張[みは]り人[びと]が剣[つるぎ]の来[く]るのを見[み]てもラッパを吹[ふ]いて合図[あいず]せず、民[たみ]が身[み]を守[まも]らなければ、剣[つるぎ]が来[き]て彼らの中[なか]から魂[たましい]を取[と]り去[さ]る。その魂は自分[じぶん]の不法[ふほう]のゆえに取[と]られる。しかし、わたしはその血[ち]をこの見張[みは]り人[びと]の手[て]から求[もと]める。"
  7: "あなたも、人[ひと]の子[こ]よ。わたしはあなたをイスラエルの家[いえ]の見張[みは]り人[びと]とした。あなたはわたしの口[くち]から言葉[ことば]を聞[き]き、わたしから彼らに告[つ]げる。"
  8: "わたしが罪[つみ]人[びと]に『あなたは必[かなら]ず死[し]ぬ』と言[い]うとき、あなたが語[かた]って、不敬[ふけい]な者[もの]をその道[みち]から守[まも]らなければ、その不法[ふほう]な者[もの]はその不法[ふほう]のゆえに死[し]ぬ。しかし、わたしはその血[ち]をあなたの手[て]から求[もと]める。"
  9: "しかし、あなたが不敬[ふけい]な者[もの]にその道[みち]を告[つ]げて、そこから離[はな]れさせようとし、彼がその道[みち]から離[はな]れないなら、その者[もの]はその不敬[ふけい]のゆえに死[し]ぬ。あなたは自分[じぶん]の魂[たましい]を救[すく]い出[だ]したのである。"
  10: "あなたも、人[ひと]の子[こ]よ。イスラエルの家[いえ]に言[い]え。あなたがたはこう言[い]っている。『わたしたちの迷[まよ]いとわたしたちの不法[ふほう]はわたしたちの上[うえ]にあり、わたしたちはそれらの中[なか]で溶[と]け去[さ]っている。どうしてわたしたちは生[い]きることができるのか』と。"
  11: "彼らに言[い]え。わたしは生[い]きている、と主[しゅ]である神[かみ]は言[い]われる。わたしは不敬[ふけい]な者[もの]の死[し]を望[のぞ]まず、不敬[ふけい]な者[もの]がその道[みち]から離[はな]れて生[い]きることを望[のぞ]む。あなたがたの悪[わる]い道[みち]から離[はな]れよ、離[はな]れよ。イスラエルの家[いえ]よ、あなたがたはなぜ死[し]ぬのか。"
  12: "あなたの民[たみ]の子[こ]らに言[い]え。正[ただ]しい者[もの]の正[ただ]しさは、その者[もの]が迷[まよ]う日[ひ]に彼を救[すく]い出[だ]さない。不敬[ふけい]な者[もの]の不法[ふほう]も、彼がその不法[ふほう]から離[はな]れる日[ひ]に彼を害[がい]さない。正[ただ]しい者[もの]も、自分[じぶん]の罪[つみ]の日[ひ]には救[すく]われることができない。"
  13: "わたしが正[ただ]しい者[もの]に『あなたは必[かなら]ず生[い]きる』と言[い]うとき、彼が自分[じぶん]の正[ただ]しさに頼[たよ]って不法[ふほう]を行[おこな]うなら、その正[ただ]しさはすべて思[おも]い起[おこ]されない。彼は自分[じぶん]が行[おこな]った不[ふ]正[せい]のゆえに、その中[なか]で死[し]ぬ。"
  14: "また、わたしが不敬[ふけい]な者[もの]に『あなたは必[かなら]ず死[し]ぬ』と言[い]うとき、彼がその罪[つみ]から離[はな]れて裁[さば]きと正[ただ]しさを行[おこな]うなら、"
  15: "すなわち、質[しち]を返[かえ]し、奪[うば]った物[もの]を償[つぐな]い、命[いのち]の戒[いまし]めのうちを歩[あゆ]んで不[ふ]正[せい]を行[おこな]わないなら、その者[もの]は必[かなら]ず生[い]き、決[けっ]して死[し]なない。"
  16: "彼が犯[おか]したすべての罪[つみ]は思[おも]い起[おこ]されない。彼は裁[さば]きと正[ただ]しさを行[おこな]ったからである。彼はそのゆえに生[い]きる。"
  17: "あなたの民[たみ]の子[こ]らは言[い]う。『主[しゅ]の道[みち]は正[ただ]しくない』と。しかし、彼らの道[みち]は正[ただ]しくない。"
  18: "正[ただ]しい者[もの]がその正[ただ]しさから離[はな]れて不法[ふほう]を行[おこな]うなら、彼はその中[なか]で死[し]ぬ。"
  19: "罪[つみ]人[びと]がその不法[ふほう]から離[はな]れて裁[さば]きと正[ただ]しさを行[おこな]うなら、彼はそのゆえに生[い]きる。"
  20: "これこそ、あなたがたが言[い]ったことである。『主[しゅ]の道[みち]は正[ただ]しくない』と。わたしはあなたがたを、それぞれ自分[じぶん]の道[みち]に従[したが]って裁[さば]く、イスラエルの家[いえ]よ」。"
  21: "わたしたちの捕囚[ほしゅう]の第十二年[だいじゅうにねん]、第十二[だいじゅうに]の月[つき]の五日[いつか]に、エルサレムから逃[のが]れた者[もの]がわたしのところへ来[き]て言[い]った。「都[みやこ]は取[と]られた。」"
  22: "その者[もの]が来[く]る前[まえ]の夕[ゆう]べ、主[しゅ]の手[て]がわたしの上[うえ]に臨[のぞ]み、わたしの口[くち]を開[ひら]かれた。朝[あさ]、その者[もの]がわたしのところへ来[く]るまでそうであった。わたしの口[くち]が開[ひら]かれてからは、もはや閉[と]じられなかった。"
  23: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  24: "「人[ひと]の子[こ]よ、イスラエルの地[ち]の荒[あ]れ果[は]てた所[ところ]に住[す]む者[もの]たちは言[い]う。『アブラハムは一人[ひとり]であったが、この地[ち]を所有[しょゆう]した。わたしたちは多[おお]い。この地[ち]はわたしたちに所有[しょゆう]として与[あた]えられた』と。"
  25: "それゆえ、彼らに言[い]え。主[しゅ]である神[かみ]はこう言[い]われる。あなたがたは血[ち]を伴[ともな]って食[た]べ、目[め]を偶像[ぐうぞう]に上[あ]げ、血[ち]を流[なが]している。それでもあなたがたは地[ち]を嗣業[しぎょう]として受[う]け継[つ]ごうとするのか。"
  26: "あなたがたは剣[つるぎ]を携[たずさ]えて立[た]ち、忌[い]まわしいことを行[おこな]い、おのおの隣人[りんじん]の妻[つま]を汚[けが]した。それでもあなたがたは地[ち]を嗣業[しぎょう]として受[う]け継[つ]ごうとするのか。"
  27: "彼らにこう言[い]え。主[しゅ]である神[かみ]はこう言[い]われる。わたしは生[い]きている。荒[あ]れ果[は]てた所[ところ]にいる者[もの]は剣[つるぎ]で倒[たお]れ、野[の]の面[おもて]にいる者[もの]は野[の]の獣[けもの]に食[た]べ物[もの]として与[あた]えられ、町[まち]々[まち]と洞窟[どうくつ]にいる者[もの]は死[し]に渡[わた]される。"
  28: "わたしはその地[ち]を荒[あ]れ果[は]てた所[ところ]とし、その力[ちから]の誇[ほこ]りは失[うしな]われる。イスラエルの山[やま]々[やま]は荒[あ]れ、そこを通[とお]る者[もの]もいなくなる。"
  29: "わたしがこの地[ち]を、彼らが行[おこな]ったすべての忌[い]まわしいことのゆえに荒[あ]れ果[は]てた所[ところ]とするとき、彼らはわたしが主[しゅ]であることを知[し]る。"
  30: "あなたも、人[ひと]の子[こ]よ。あなたの民[たみ]の子[こ]らは、あなたについて壁[かべ]のそばや家[いえ]の戸口[とぐち]で語[かた]り、おのおのその兄弟[きょうだい]に言[い]う。『さあ、来[き]て、主[しゅ]から出[で]ることを聞[き]こう』と。"
  31: "彼らは民[たみ]が集[あつ]まるようにあなたのところへ来[き]て、わたしの民[たみ]としてあなたの前[まえ]に座[すわ]り、あなたの言葉[ことば]を聞[き]くが、それを行[おこな]わない。彼らの口[くち]には偽[いつわ]りがあり、その心[こころ]は忌[い]まわしいものの後[あと]を追[お]っているからである。"
  32: "あなたは彼らにとって、よく調[ととの]った美[うつく]しい歌[うた]い手[て]の声[こえ]のようになる。彼らはあなたの言葉[ことば]を聞[き]くが、それを行[おこな]わない。"
  33: "それが来[く]るとき、彼らは言[い]う。『見[み]よ、来[き]た』と。そして、彼らは自分[じぶん]たちの中[なか]に預言者[よげんしゃ]がいたことを知[し]る」。"

notes:
  1: "Καὶ ἐγένετο λόγος κυρίου πρός με λέγων — «и было слово Господне ко мне, говоря»: формула без даты (в отличие от 33:21). Слав. «И быти слово Господне ко мне глаголя»."
  2: "Υἱὲ ἀνθρώπου, λάλησον τοῖς υἱοῖς τοῦ λαοῦ σου — «сын человеческий, говори сынам народа твоего»; Γῆ, ἐφ' ἣν ἂν ἐπάγω ῥομφαίαν — «земля, на которую Я наведу меч»: притча начинается с «земли»; λάβῃ ὁ λαὸς τῆς γῆς ἄνθρωπον ἕνα ἐξ αὐτῶν — «возьмёт народ земли человека одного из них»; δῶσιν αὐτὸν ἑαυτοῖς εἰς σκοπόν — «поставят его себе в стражи» (σκοπός — 見張[みは]り人[びと], как в 3:17)."
  3: "σαλπίσῃ τῇ σάλπιγγι — «затрубит трубою» (σάλπιγξ — ラッパ, по корпусу); σημάνῃ τῷ λαῷ — «подаст знак народу» (σημαίνω — 合図[あいず]する)."
  4: "καὶ ἀκούσῃ ὁ ἀκούσας τὴν φωνὴν τῆς σάλπιγγος καὶ μὴ φυλάξηται — «и услышит услышавший голос трубы и не сохранится» (φυλάσσομαι — остеречься, 身[み]を守[まも]る); ἐπέλθῃ ἡ ῥομφαία καὶ καταλάβῃ αὐτόν — «найдёт меч и постигнет его»; τὸ αἷμα αὐτοῦ ἐπὶ τῆς κεφαλῆς αὐτοῦ ἔσται — «кровь его на голове его будет»."
  5: "τὴν φωνὴν τῆς σάλπιγγος ἀκούσας οὐκ ἐφυλάξατο — «голос трубы услышав, не сохранился»; τὸ αἷμα αὐτοῦ ἐπ' αὐτοῦ ἔσται — «кровь его на нём будет»; οὗτος… τὴν ψυχὴν αὐτοῦ ἐξείλατο — «этот… душу свою избавил» (ἐξαιρέω)."
  6: "ὁ σκοπός, ἐὰν ἴδῃ… καὶ μὴ σημάνῃ τῇ σάλπιγγι — «страж, если увидит… и не подаст знака трубою»; λάβῃ ἐξ αὐτῶν ψυχήν — «возьмёт из них душу»; αὕτη διὰ τὴν αὑτῆς ἀνομίαν ἐλήμφθη — «она за своё беззаконие взята»; τὸ αἷμα ἐκ τῆς χειρὸς τοῦ σκοποῦ ἐκζητήσω — «кровь от руки стража взыщу». Слав. содержит в скобках «(и не проповесть людем,)» — редакционная вставка, не перенесена."
  7: "σκοπὸν δέδωκά σε τῷ οἴκῳ Ισραηλ — «стражем дал Я тебя дому Израилеву»: ср. 3:17, формулировка выровнена по нему; ἀκούσῃ ἐκ στόματός μου λόγον — «услышишь из уст Моих слово». Слав. добавляет «и проповеси им от мене» — нет в LXX, внесено."
  8: "ἐν τῷ εἶπαί με τῷ ἁμαρτωλῷ· Θανάτῳ θανατωθήσῃ — «когда Я скажу грешнику: смертью умрёшь»: слова Господа внутри Его речи — 『…』, как в 3:18; μὴ λαλήσῃς τοῦ φυλάξασθαι τὸν ἀσεβῆ ἀπὸ τῆς ὁδοῦ αὐτοῦ — «не скажешь, чтобы сохранить нечестивого от пути его»; αὐτὸς ὁ ἄνομος τῇ ἀνομίᾳ αὐτοῦ ἀποθανεῖται — «сам беззаконник в беззаконии своём умрёт»; τὸ αἷμα αὐτοῦ ἐκ τῆς χειρός σου ἐκζητήσω. Слав. содержит в скобках «(грешнику)», «(еже обратитися ему)», «(и живу быти ему)» — редакционные, не перенесены."
  9: "προαπαγγείλῃς τῷ ἀσεβεῖ τὴν ὁδὸν αὐτοῦ τοῦ ἀποστρέψαι ἀπ' αὐτῆς — «возвестишь нечестивому путь его, чтобы обратиться от него» (προαπαγγέλλω); μὴ ἀποστρέψῃ ἀπὸ τῆς ὁδοῦ αὐτοῦ — «не обратится от пути своего»; σὺ τὴν ψυχὴν σαυτοῦ ἐξῄρησαι — «ты душу свою избавил». Здесь слово о страже (2–9) закрывается."
  10: "Οὕτως ἐλαλήσατε λέγοντες — «так вы говорили, говоря»: речь народа в 『…』. Αἱ πλάναι ἡμῶν… ἐφ' ἡμῖν εἰσιν — «заблуждения наши… на нас» (πλάνη); ἐν αὐταῖς ἡμεῖς τηκόμεθα — «в них мы таем (истаиваем)» (τήκομαι — плавиться, 溶[と]ける); καὶ πῶς ζησόμεθα — «и как будем жить?»"
  11: "Ζῶ ἐγώ — «живу Я» (клятвенная формула); Οὐ βούλομαι τὸν θάνατον τοῦ ἀσεβοῦς ὡς τὸ ἀποστρέψαι… — «не хочу смерти нечестивого, но (как) чтобы обратился…» (ὡς в значении «но»); ἀποστροφῇ ἀποστρέψατε — «обращением обратитесь»: cognatus accusativus, в тексте повтор 離[はな]れよ、離[はな]れよ; ἵνα τί ἀποθνῄσκετε, οἶκος Ισραηλ — «для чего умираете, дом Израилев?» Ср. 18:23, 31."
  12: "Δικαιοσύνη δικαίου οὐ μὴ ἐξέληται αὐτὸν ἐν ᾗ ἂν ἡμέρᾳ πλανηθῇ — «правда праведника не избавит его в день, когда он заблудится»; ἀνομία ἀσεβοῦς οὐ μὴ κακώσῃ αὐτόν — «беззаконие нечестивого не повредит ему» (κακόω); δίκαιος οὐ μὴ δύνηται σωθῆναι — «праведник не сможет спастись»: слав. добавляет «в день греха своего» — нет в LXX, внесено."
  13: "Οὗτος πέποιθεν ἐπὶ τῇ δικαιοσύνῃ αὐτοῦ — «он понадеялся на правду свою» (πείθω в перфекте — довериться). В слав. иначе: «Егда реку праведнику: жизнию жив будеши: сей же уповая на правду свою…» — прямая речь «жизнию жив будеши» есть только в слав., по паритету взята (в LXX она слита с «οὗτος πέποιθεν»); в тексте 必[かなら]ず生[い]きる, как 18:9 для ζωῇ ζήσεται. πᾶσαι αἱ δικαιοσύναι αὐτοῦ οὐ μὴ ἀναμνησθῶσιν — «все правды его не вспомнятся»; ἐν τῇ ἀδικίᾳ αὐτοῦ… ἀποθανεῖται — «в неправде своей… умрёт»."
  14: "ἐν τῷ εἶπαί με τῷ ἀσεβεῖ· Θανάτῳ θανατωθήσῃ — «когда Я скажу нечестивому: смертью умрёшь» (слова Господа в 『…』); ἀποστρέψῃ ἀπὸ τῆς ἁμαρτίας αὐτοῦ — «обратится от греха своего»; ποιήσῃ κρίμα καὶ δικαιοσύνην — «сотворит суд и правду»."
  15: "ἐνεχύρασμα ἀποδῷ — «залог отдаст» (ἐνεχύρασμα — залог, 質[しち], как в 18:7); ἅρπαγμα ἀποτείσῃ — «похищенное возместит» (ἅρπαγμα — 奪[うば]った物[もの]); ἐν προστάγμασιν ζωῆς διαπορεύηται — «в повелениях жизни будет ходить» (πρόσταγμα — повеление, 戒[いまし]め); ζωῇ ζήσεται — «жизнью жив будет» (cognatus, передано 必[かなら]ず生[い]きる, как 18:9); οὐ μὴ ἀποθάνῃ — «не умрёт»."
  16: "πᾶσαι αἱ ἁμαρτίαι αὐτοῦ… οὐ μὴ ἀναμνησθῶσιν — «все грехи его… не вспомнятся»; ὅτι κρίμα καὶ δικαιοσύνην ἐποίησεν — «ибо суд и правду сотворил»; ἐν αὐτοῖς ζήσεται — «в них (в этом) будет жить»."
  17: "Οὐκ εὐθεῖα ἡ ὁδὸς τοῦ κυρίου — «неправ путь Господень» (εὐθύς — прямой): слова народа в 『…』, ср. 18:25, 29; καὶ αὕτη ἡ ὁδὸς αὐτῶν οὐκ εὐθεῖα — «и вот, путь их не прямой»: порядок сохранён, ответ Господа следует сразу."
  18: "ἐν τῷ ἀποστρέψαι δίκαιον ἀπὸ τῆς δικαιοσύνης αὐτοῦ — «когда отступит праведник от правды своей»; ποιήσῃ ἀνομίας — «сотворит беззакония»; ἀποθανεῖται ἐν αὐταῖς — «умрёт в них» (ἐν αὐταῖς — «в них», т. е. в беззакониях)."
  19: "ἐν τῷ ἀποστρέψαι τὸν ἁμαρτωλὸν ἀπὸ τῆς ἀνομίας αὐτοῦ — «когда обратится грешник от беззакония своего»; ποιήσῃ κρίμα καὶ δικαιοσύνην — «сотворит суд и правду»; ἐν αὐτοῖς αὐτὸς ζήσεται — «в них сам будет жить»."
  20: "καὶ τοῦτό ἐστιν, ὃ εἴπατε — «и это то, что вы сказали»; ἕκαστον ἐν ταῖς ὁδοῖς αὐτοῦ κρινῶ ὑμᾶς — «каждого по путям его буду судить вас» (ἕκαστον… ὑμᾶς — конструкция сохранена). Здесь слово Господа (2–20) закрывается."
  21: "ἐν τῷ δωδεκάτῳ ἔτει… ἐν τῷ δωδεκάτῳ μηνὶ πέμπτῃ τοῦ μηνός — «в двенадцатый год, в двенадцатый месяц, в пятый день месяца»: в LXX и слав. («месяца вторагонадесять») двенадцатый месяц, в ru — «десятом месяце» (МТ); держим LXX/csl, отмечено. τῆς αἰχμαλωσίας ἡμῶν — «переселения нашего»; ὁ ἀνασωθεὶς πρός με ἀπὸ Ιερουσαλημ — «спасшийся ко мне из Иерусалима» (ἀνασῴζω); Ἑάλω ἡ πόλις — «взят город»: его слова в 「…」, повествование без кавычек."
  22: "χεὶρ κυρίου ἑσπέρας πρὶν ἐλθεῖν αὐτὸν — «рука Господня вечером, прежде прихода его»; ἤνοιξέν μου τὸ στόμα — «открыл уста мои»; ἕως ἦλθεν πρός με τὸ πρωί — «до того, как он пришёл ко мне утром»; οὐ συνεσχέθη ἔτι — «не были удержаны более» (συνέχω). Слав. «и отверзшаяся уста моя не затворишася ктому»."
  23: "καὶ ἐγενήθη λόγος κυρίου πρός με λέγων — «и было слово Господне ко мне, говоря». Слав. «И бысть слово Господне ко мне глаголя»."
  24: "οἱ κατοικοῦντες τὰς ἠρημωμένας ἐπὶ τῆς γῆς τοῦ Ισραηλ — «живущие на опустошённых (местах) земли Израилевой»; Εἷς ἦν Αβρααμ καὶ κατέσχεν τὴν γῆν — «один был Авраам и овладел землёй»: речь их в 『…』; ἡμεῖς πλείους ἐσμέν — «нас больше»; ἡμῖν δέδοται ἡ γῆ εἰς κατάσχεσιν — «нам дана земля во владение» (κατάσχεσις)."
  25: "Τάδε λέγει κύριος κύριος — «так говорит Господь Бог». В LXX стих — только эта формула, обвинения начинаются в слав. 25-м; в модуле gr 25 короткое, gr 26 — «.». По паритету содержание 25-го дано по слав.: «понеже с кровию ясте и очи ваши воздвигосте ко кумиром и кровь проливаете, и землю ли наследите?» (с кровию ясте — 血[ち]を伴[ともな]って食[た]べる)."
  26: "В gr-lxx-byz на месте стиха стоит «.» — в модуле лакуна; стих переведён по церковнославянскому (csl-ru) без 〔…〕 (решение брифа): «стасте с мечем вашим, сотвористе мерзости, и кийждо жену ближняго своего осквернисте, и тако ли землю имате наследити?». В ru (МТ) то же по смыслу. Лексика выровнена по 18:6, 12 (偶像[ぐうぞう]に目[め]を上[あ]げる, 隣人[りんじん]の妻[つま]を汚[けが]す)."
  27: "Ζῶ ἐγώ — «живу Я»; οἱ ἐν ταῖς ἠρημωμέναις μαχαίρᾳ πεσοῦνται — «сущие в опустошённых (местах) падут от меча»; οἱ ἐπὶ προσώπου τοῦ πεδίου τοῖς θηρίοις… εἰς κατάβρωμα — «сущие на лице поля зверям… на съедение»; τοὺς ἐν ταῖς τετειχισμένοις καὶ τοὺς ἐν τοῖς σπηλαίοις θανάτῳ ἀποκτενῶ — «сущих в укреплениях и в пещерах смертью убью»: слав. читает «во градех» (в городах), в тексте по слав. 町[まち]; θάνατος — «смерть» (в МТ «мор»), передано 死[し]に渡[わた]す."
  28: "δώσω τὴν γῆν ἔρημον — «отдам землю пустою»; ἀπολεῖται ἡ ὕβρις τῆς ἰσχύος αὐτῆς — «погибнет гордость силы её» (ὕβρις — 誇[ほこ]り); ἐρημωθήσεται τὰ ὄρη τοῦ Ισραηλ — «опустеют горы Израилевы»; διὰ τὸ μὴ εἶναι διαπορευόμενον — «за то, что не будет проходящего»."
  29: "καὶ γνώσονται ὅτι ἐγώ εἰμι κύριος — формула знания стоит в начале стиха (в слав. так же); ποιήσω τὴν γῆν αὐτῶν ἔρημον — «сделаю землю их пустою»; ἐρημωθήσεται διὰ πάντα τὰ βδελύγματα αὐτῶν — «опустеет за все мерзости их» (βδέλυγμα — 忌[い]まわしいこと)."
  30: "οἱ υἱοὶ τοῦ λαοῦ σου οἱ λαλοῦντες περὶ σοῦ παρὰ τὰ τείχη — «сыны народа твоего, говорящие о тебе у стен» (τεῖχος — 壁[かべ]); ἐν τοῖς πυλῶσι τῶν οἰκιῶν — «в воротах домов» (πυλών — 戸口[とぐち]); Συνέλθωμεν καὶ ἀκούσωμεν — «сойдёмся и услышим»: речь их в 『…』; τὰ ἐκπορευόμενα παρὰ κυρίου — «исходящее от Господа»."
  31: "ὡς συμπορεύεται λαός — «как сходится народ» (συμπορεύομαι); κάθηνται ἐναντίον σου — «сидят пред тобою»: слав. добавляет «людие мои» — わたしの民[たみ]; αὐτὰ οὐ μὴ ποιήσουσιν — «их не сделают»; ψεῦδος ἐν τῷ στόματι αὐτῶν — «ложь в устах их»; ὀπίσω τῶν μιασμάτων ἡ καρδία αὐτῶν — «за сквернами сердце их» (μίασμα — скверна, 忌[い]まわしいもの). В ru (МТ) иначе «сердце их увлекается за корыстью» — не внесено."
  32: "ὡς φωνὴ ψαλτηρίου ἡδυφώνου εὐαρμόστου — «как голос псалтири сладкозвучной, хорошо настроенной» (ψαλτήριον — струнный инструмент); слав. понял как «глас песнивца сладкогласнаго благосличнаго» — по паритету взято «歌[うた]い手[て]»; ἀκούσονταί σου τὰ ῥήματα καὶ οὐ μὴ ποιήσουσιν αὐτά — «услышат слова твои и не сделают их»."
  33: "ἡνίκα ἂν ἔλθῃ — «когда придёт» (о слове/пророчестве); ἐροῦσιν· Ἰδοὺ ἥκει — «скажут: вот, пришло»: речь их в 『…』; γνώσονται ὅτι προφήτης ἦν ἐν μέσῳ αὐτῶν — «узнают, что пророк был среди них». Слав. «егда приидеши, рекут: се, прииде» (2 л. ед. ч.), держим LXX."
