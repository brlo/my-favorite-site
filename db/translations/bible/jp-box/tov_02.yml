# jp-box, Товит, глава 2. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc в книге нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 2: пятидесятница и погребение убитого (1–8), слепота от воробьёв (9–10),
# работа Анны и козлёнок (11–14). Всё от первого лица.
# Речь: слова Товита сыну (2), ответ сына (3), насмешка соседей (8), диалог
# с Анной (13–14) — 「…」; вложенной речи нет. Красного нет.
# Нумерация по gr: 14 стихов; номера совпадают с csl.
# 〔…〕 нет: все стихи есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 五旬節, 施し, 異邦人, 医者, 羊毛 уже в корпусе.
# Имена — транслитерация греческого (LXX): アモス, アヒカル, エリマイス.

tr_code: jp-box
book: tov
chapter: 2
draft: true

verses:
  1: "わたしが自分の家[いえ]に帰[かえ]り、妻[つま]のアンナと子[こ]のトビアがわたしのもとに返[かえ]されたとき、七週の聖[せい]なる祭[まつ]りである五旬節[ごじゅんせつ]の日[ひ]に、わたしのために立派[りっぱ]な昼食[ちゅうしょく]が用意[ようい]され、わたしは食[た]べるために横[よこ]たわった。"
  2: "わたしは多[おお]くの料理[りょうり]を見[み]て、子[こ]に言[い]った。「行[い]って、わたしたちの兄弟[きょうだい]のうち、主[しゅ]を覚[おぼ]えている乏[とぼ]しい者[もの]を見[み]つけたなら、連[つ]れて来[き]なさい。見[み]よ、わたしはあなたを待[ま]っている。」"
  3: "彼[かれ]は来[き]て言[い]った。「父[ちち]よ、わたしたちの一族[いちぞく]の一人[ひとり]が絞[し]め殺[ころ]されて、広場[ひろば]に投[な]げ捨[す]てられている。」"
  4: "わたしは食[た]べる前[まえ]に跳[と]び起[お]き、日[ひ]が沈[しず]むまで、彼[かれ]をある部屋[へや]へ運[はこ]び入[い]れた。"
  5: "そして戻[もど]って身[み]を洗[あら]い、悲[かな]しみの中[なか]で自分のパンを食[た]べた。"
  6: "わたしは、アモスが「あなたがたの祭[まつ]りは嘆[なげ]きに変[か]わり、あなたがたのすべての喜[よろこ]びは悲[かな]しみの歌[うた]に変[か]わる」と言[い]った、その預言[よげん]を思[おも]い起[おこ]した。そして、わたしは泣[な]いた。"
  7: "日[ひ]が沈[しず]むと、わたしは行[い]って穴[あな]を掘[ほ]り、彼[かれ]を葬[ほうむ]った。"
  8: "近[ちか]くの者[もの]たちはあざ笑[わら]って言[い]った。「彼[かれ]はこのことのために殺[ころ]されるのをもう恐[おそ]れないのか。逃[に]げたではないか。そして見[み]よ、また死者[ししゃ]たちを葬[ほうむ]っている。」"
  9: "その夜[よる]、葬[ほうむ]りを終[お]えて戻[もど]り、汚[けが]れたまま庭[にわ]の壁[かべ]のそばで眠[ねむ]った。わたしの顔[かお]は覆[おお]われていなかった。"
  10: "わたしは壁[かべ]にすずめがいることに気[き]づかなかった。わたしの目[め]が開[ひら]いていたとき、すずめたちは温[あたた]かいもの[もの]をわたしの目[め]に落[お]とし、わたしの目[め]に白[しろ]い膜[まく]ができた。わたしは医者[いしゃ]たちのところへ行[い]ったが、彼[かれ]らはわたしを助[たす]けなかった。アヒカルは、自分[じぶん]がエリマイスへ行[い]くまで、わたしを養[やしな]ってくれた。"
  11: "妻[つま]のアンナは女[おんな]たちの部屋[へや]で羊毛[ようもう]を紡[つむ]いでいた。"
  12: "そして、それを主人[しゅじん]たちに送[おく]った。彼[かれ]らは報酬[ほうしゅう]を払[はら]い、そのうえに子[こ]やぎ一匹を添[そ]えてくれた。"
  13: "子[こ]やぎがわたしのところへ来[く]ると、鳴[な]き始[はじ]めた。わたしは彼女[かのじょ]に言[い]った。「どこから来[き]た子[こ]やぎだ。盗[ぬす]んだものではないのか。主人[しゅじん]たちに返[かえ]しなさい。盗[ぬす]んだものを食[た]べることは許[ゆる]されないからだ。」"
  14: "彼女[かのじょ]は言[い]った。「報酬[ほうしゅう]のほかに、贈[おく]り物[もの]としてもらった。」しかし、わたしは彼女[かのじょ]を信[しん]じず、それを主人[しゅじん]たちに返[かえ]すように言[い]い、彼女[かのじょ]の前[まえ]で顔[かお]を赤[あか]らめた。すると、彼女[かのじょ]は答[こた]えて言[い]った。「あなたの施[ほどこ]しとあなたの正[ただ]しい行[おこな]いはいったいどこにあるのか。見[み]よ、すべてがあなたとともに知[し]られている。」"

notes:
  1: "κατῆλθον — «я пришёл, спустился» (κατέρχομαι). ἀπεδόθη μοι — «были возвращены мне» (ἀποδίδωμι). ἐν τῇ πεντηκοστῇ τῇ ἑορτῇ, ἥ ἐστιν ἁγία ἑπτὰ ἑβδομάδων — «в праздник Пятидесятницы, который свят — семь седмиц» (слав. «в праздник пятьдесятницы… седмь седмиц»); 五旬節. ἄριστον καλόν — «хороший обед»; ἀνέπεσα — «возлёг» (ἀναπίπτω)."
  2: "ὄψα πολλά — «многие снеди» (ὄψον — кушанье; слав. «снеди»). ὃν ἐὰν εὕρῃς τῶν ἀδελφῶν ἡμῶν ἐνδεῆ — «кого найдёшь из братьев наших нуждающимся» (ἐνδεής). ὃς μέμνηται τοῦ κυρίου — «кто помнит Господа». ἰδοὺ μενῶ σε — «вот, я жду тебя» (μένω)."
  3: "Πάτερ — звательный падеж, 父よ (слав. «отче»). ἐστραγγαλωμένος — «удавленный» (στραγγαλόω; слав. «удавлен»). ἔρριπται ἐν τῇ ἀγορᾷ — «брошен на площади» (ῥίπτω, ἀγορά)."
  4: "πρὶν ἢ γεύσασθαί με — «прежде нежели вкусить мне» (γεύομαι). ἀναπηδήσας — «вскочив» (ἀναπηδάω). ἀνειλόμην — «взял, поднял» (ἀναιρέω). εἴς τι οἴκημα — «в некое помещение» (οἴκημα). ἕως οὗ ἔδυ ὁ ἥλιος — «доколе не зашло солнце» (δύω)."
  5: "ἐπιστρέψας — «возвратившись». ἐλουσάμην — «омылся» (λούω). ἤσθιον τὸν ἄρτον μου ἐν λύπῃ — «ел хлеб мой в печали» (λύπη); слав. «ядох хлеб мой в скорби»."
  6: "ἐμνήσθην τῆς προφητείας Αμως — «вспомнил пророчество Амоса» (Ам 8:10). В LXX цитата читается στραφήσονται αἱ ἑορταὶ ὑμῶν εἰς πένθος — «обратятся праздники ваши в плач»; слав. «дние ваши» (дни) — уникальное чтение, расходящееся и с LXX, и с книгой Амоса, поэтому в тексте LXX (祭り), слав. — здесь. θρῆνος — плач, причитание. καὶ ἔκλαυσα — «и я заплакал» (слав. переносит этот плач в начало 2:7)."
  7: "ᾠχόμην — «я пошёл» (οἴχομαι, имперфект). ὀρύξας ἔθαψα — «выкопав, погрёб» (ὀρύσσω, θάπτω). Слав. начинает стих словами «и плакахся» (καὶ ἔκλαυσα из конца 2:6), поэтому здесь плач не повторён."
  8: "οἱ πλησίον — «ближние, соседи». ἐπεγέλων — «насмехались» (ἐπιγελάω, имперфект). Οὐκέτι φοβεῖται φονευθῆναι περὶ τοῦ πράγματος τούτου — «уже не боится быть убитым за это дело»: насмешливый вопрос, отсюда 〜ないのか. Слав. «еще не боится убиен быти» — иное (οὐκέτι понято как «ещё не»). ἀπέδρα — «убежал» (ἀποδιδράσκω)."
  9: "ἀνέλυσα θάψας — «возвратился, погрёбши» (ἀναλύω). ἐκοιμήθην — «лёг спать» (κοιμάομαι). μεμιαμμένος — «осквернённый» (μιαίνω, причастие перфекта), т.е. после прикосновения к мёртвому. παρὰ τὸν τοῖχον τῆς αὐλῆς — «у стены двора» (αὐλή). ἀκάλυπτον — «непокрытое» (о лице), слав. «откровено»."
  10: "στρουθία — воробьи (στρουθίον). ἀφώδευσαν — «испустили» (ἀφοδεύω, буквально «испражнились»); θερμὸν εἰς τοὺς ὀφθαλμούς μου — «тёплое в глаза мои», передано буквально, без сглаживания. λευκώματα — бельма (白い膜; слав. «бельма»). ἕως οὗ ἐπορεύθη εἰς τὴν Ἐλυμαΐδα — «доколе не отправился в Елимаиду» (третье лицо); слав. «дондеже отидох» — первое лицо, расходится с LXX, поэтому в тексте «自分が…行くまで» (речь об Ахиакаре)."
  11: "ἠριθεύετο — «пряла шерсть» (ἠριθεύω, от ἔριον — шерсть); слав. «волну прядяше». ἐν τοῖς γυναικείοις — «в женских покоях» (γυναικεῖα)."
  12: "ἀπέστελλε τοῖς κυρίοις — «посылала господам», т.е. заказчикам (κύριοι здесь не «Господь»). ἀπέδωκαν αὐτῇ τὸν μισθόν — «отдали ей плату» (ἀποδίδωμι, μισθός). προσδόντες καὶ ἔριφον — «прибавив и козлёнка» (προσδίδωμι; ἔριφος)."
  13: "ἦλθεν πρός με — «пришёл ко мне»: подлежащее — козлёнок (τὸ ἐρίφιον). ἤρξατο κράζειν — «начал кричать, блеять» (κράζω). Πόθεν — «откуда». κλεψιμαῖον — «краденое» (κλεψιμαῖος). θεμιτόν — «позволительно» (слав. «лепо»). ἀπόδος — императив «отдай» (ἀποδίδωμι)."
  14: "Δῶρον δέδοταί μοι ἐπὶ τῷ μισθῷ — «дар дан мне сверх платы» (ἐπί с дательным — «в дополнение»). ἠρυθρίων πρὸς αὐτήν — «я краснел перед нею» (ἐρυθριάω); слав. «стыдяхся пред нею». Ποῦ εἰσιν αἱ ἐλεημοσύναι σου — «где милостыни твои»: здесь ἐλεημοσύνη в прямом смысле, 施し. γνωστὰ πάντα μετὰ σοῦ — «известно всё с тобою», т.е. всё открылось на тебе."
