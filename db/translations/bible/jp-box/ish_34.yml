# jp-box, Исход, глава 34. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — csl-ru и jp-joc
# (1901, PD; ст. 4–8). ru (с масоретского) — только для понимания.
# Язык — современный 常体, порядок членов и деление на клаузы — по греческому.
# Глава 34: новые скрижали (1–4), явление Господа и определение Бога (5–7),
# молитва Моисея (8–9), обновление завета (10–26), сорок дней и скрижали (27–28),
# сияющее лицо Моисея и покрывало (29–35).
# Красного и синего нет: речь Бога — в 「…」; Его провозглашение имени (6–7) —
# тоже в 「…」 (это Его собственные слова, а не цитата внутри речи).
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено по базе).
# 34:6 — οἰκτίρμων καὶ ἐλεήμων передано あわれみ深く、慈しみ深い: первое слово —
# сострадание, второе — милость; оба сохранены (ср. 33:19).
# 34:29, 30, 35 — «зрак плоти лица» славянского текста: в греч. ὄψις τοῦ χρώματος
# τοῦ προσώπου, отсюда 顔の肌.
# Сносок ⟨…⟩ нет: 石板, 契約, 祭壇, 初子, 過越の祭り уже в корпусе или пояснены.
# jp-ni не использовался.

