verses:
  1: "主[しゅ]はモーセに言[い]われた。「あなたのために二枚[にまい]の石板[せきばん]を、前[まえ]のものと同じように切[き]り出[だ]せ。わたしは、あなたが砕[くだ]いた前[まえ]の板[いた]にあった言葉[ことば]を、その板[いた]に書[か]こう。"
  2: "朝[あさ]までに備[そな]えを整[ととの]えて、朝[あさ]になったらシナイの山[やま]に上[のぼ]り、山[やま]の頂[いただき]でわたしの前[まえ]に立[た]て。"
  3: "だれもあなたとともに上[のぼ]ってはならない。山[やま]のどこにも人[ひと]の姿[すがた]が見[み]えてはならない。羊[ひつじ]も牛[うし]も、あの山[やま]の近[ちか]くで草[くさ]を食[た]べてはならない。」"
  4: "モーセは前[まえ]のものと同じような二枚[にまい]の石板[せきばん]を切[き]り出[だ]し、朝[あさ]早[はや]く起[お]きて、主[しゅ]が命[めい]じられたとおりにシナイの山[やま]に上[のぼ]り、二枚[にまい]の石板[せきばん]を手[て]に取[と]った。"
  5: "主[しゅ]は雲[くも]の中[なか]に降[くだ]り、そこに彼[かれ]のそばに立[た]ち、主[しゅ]の名[な]を呼[よ]ばれた。"
  6: "主[しゅ]は彼[かれ]の前[まえ]を通[とお]り過[す]ぎながら、宣[の]べられた。「主[しゅ]、主[しゅ]はあわれみ深[ぶか]く、慈[いつく]しみ深[ぶか]い神[かみ]、怒[いか]りを遅[おそ]くし、恵[めぐ]みに富[と]み、真実[しんじつ]であり、"
  7: "義[ぎ]を保[たも]ち、恵[めぐ]みを千代[せんだい]に及[およ]ぼし、咎[とが]と背[そむ]きと罪[つみ]を取[と]り除[の]かれる。しかし、罪[つみ]ある者[もの]を罰[ばっ]しないではおかず、父[ちち]の咎[とが]を子[こ]どもに、子[こ]どもの子[こ]どもに、三代[さんだい]、四代[よんだい]まで報[むく]いられる。」"
  8: "モーセは急[いそ]いで地[ち]にひれ伏[ふ]して礼拝[れいはい]し、"
  9: "言[い]った。「主[しゅ]よ、もしわたしがあなたの前[まえ]に{恵[めぐ]み|恩寵[おんちょう]}を得[え]ているのなら、どうか、わたしの主[しゅ]がわたしたちとともに歩[あゆ]んでください。この民[たみ]はうなじの堅[かた]い民[たみ]ですが、あなたはわたしたちの咎[とが]と背[そむ]きをお赦[ゆる]しになり、わたしたちをあなたのものとしてください。」"
  10: "主[しゅ]はモーセに言[い]われた。「見[み]よ、わたしはあなたと契約[けいやく]を結[むす]ぶ。わたしはあなたの民[たみ]すべての前[まえ]で、全[ぜん]地[ち]にも諸[しょ]民[みん]の間[あいだ]にも起[お]こったことのない驚[おどろ]くべきことを行[おこな]う。あなたがともにいる民[たみ]は皆[みな]、わたしがあなたに対して行[おこな]う業[わざ]が、主[しゅ]のなされた恐[おそ]るべきことであるのを見[み]る。"
  11: "あなたは、わたしが今日[きょう]あなたに命[めい]じるすべてのことを守[まも]れ。見[み]よ、わたしはあなたがたの前[まえ]からアモリ人[じん]、カナン人[じん]、ヘト人[じん]、フェレズ人[じん]、ヒビ人[じん]、ゲルゲシ人[じん]、エブス人[じん]を追[お]い出[だ]す。"
  12: "気[き]をつけよ。あなたが入[はい]って行[ゆ]く地[ち]の住[す]み人[びと]と契約[けいやく]を結[むす]んではならない。それがあなたがたの間[あいだ]でつまずきの石[いし]とならないように。"
  13: "あなたがたは彼[かれ]らの祭壇[さいだん]を壊[こわ]し、その石柱[せきちゅう]を砕[くだ]き、その聖[せい]なる木立[こだち]を切[き]り倒[たお]し、その神々[かみがみ]の彫[ほ]り像[ぞう]を火[ひ]で焼[や]き払[はら]わねばならない。"
  14: "あなたがたはほかの神[かみ]を拝[おが]んではならない。主[しゅ]は妬[ねた]む名[な]の神[かみ]、妬[ねた]む神[かみ]であるからである。"
  15: "あなたが入[はい]って行[ゆ]く地[ち]の住[す]み人[びと]と契約[けいやく]を結[むす]んではならない。彼[かれ]らがその神々[かみがみ]を慕[した]って淫[いん]を働[はたら]き、自分[じぶん]の神々[かみがみ]に犠牲[ぎせい]をささげ、あなたを招[まね]いて、その犠牲[ぎせい]の肉[にく]をあなたが食[た]べるようにならないためである。"
  16: "また、あなたの息子[むすこ]たちに彼[かれ]らの娘[むすめ]を嫁[とつ]がせ、その娘[むすめ]たちが自分[じぶん]の神々[かみがみ]を慕[した]って淫[いん]を働[はたら]き、あなたの息子[むすこ]たちまでその神々[かみがみ]を慕[した]って淫[いん]を働[はたら]かせるようにならないためである。"
  17: "あなたは自分[じぶん]のために熔[と]かした神々[かみがみ]を造[つく]ってはならない。"
  18: "あなたは種[たね]を入[い]れないパンの祭[まつ]りを守[まも]れ。わたしがあなたに命[めい]じたとおり、新[あたら]しい実[み]りの月[つき]の定[さだ]められた時[とき]に、七日[なのか]の間[あいだ]、種[たね]を入[い]れないパンを食[た]べよ。あなたがエジプトから出[で]たのは、新[あたら]しい実[み]りの月[つき]であったからである。"
  19: "胎[たい]を開[ひら]くものはすべて、雄[おす]のものはわたしのものである。牛[うし]の初子[ういご]も、羊[ひつじ]の初子[ういご]も。"
  20: "ろばの初子[ういご]は羊[ひつじ]で贖[あがな]え。もし贖[あがな]わないのなら、代金[だいきん]を払[はら]え。あなたの息子[むすこ]たちの初子[ういご]はすべて贖[あがな]え。わたしの前[まえ]に何[なに]も持[も]たずに現[あらわ]れてはならない。"
  21: "六日[むいか]は働[はたら]き、七日目[なのかめ]には休[やす]め。種[たね]まきの時[とき]にも、刈[か]り入[い]れの時[とき]にも休[やす]め。"
  22: "あなたは七週[ななしゅう]の祭[まつ]り、すなわち麦[むぎ]の刈[か]り入[い]れの初[はじ]めの祭[まつ]りを守[まも]り、年[とし]の半[なか]ばの収穫[しゅうかく]の祭[まつ]りを守[まも]れ。"
  23: "年[とし]に三度[さんど]、あなたの男[おとこ]は皆[みな]、イスラエルの神[かみ]である主[しゅ]の前[まえ]に現[あらわ]れねばならない。"
  24: "わたしがあなたの前[まえ]から諸[しょ]民[みん]を追[お]い払[はら]い、あなたの境[さかい]を広[ひろ]げるとき、あなたが年[とし]に三度[さんど]、あなたの神[かみ]である主[しゅ]の前[まえ]に現[あらわ]れるために上[のぼ]る間[あいだ]、だれもあなたの地[ち]を欲[ほ]しがらないであろう。"
  25: "あなたはわたしの犠牲[ぎせい]の血[ち]を、種[たね]を入[い]れたパンとともにささげてはならない。過越[すぎこし]の祭[まつ]りの犠牲[ぎせい]は朝[あさ]まで残[のこ]してはならない。"
  26: "あなたの地[ち]の初[はつ]物[もの]の最[もっと]も良[よ]いものを、あなたの神[かみ]である主[しゅ]の家[いえ]に持[も]って来[こ]なければならない。あなたは子羊[こひつじ]をその母[はは]の乳[ちち]で煮[に]てはならない。」"
  27: "主[しゅ]はモーセに言[い]われた。「あなたはこれらの言葉[ことば]を書[か]け。わたしはこれらの言葉[ことば]によって、あなたとイスラエルとに契約[けいやく]を結[むす]んだからである。」"
  28: "モーセは主[しゅ]の前[まえ]に四十日[しじゅうにち]四十夜[しじゅうや]とどまり、パンも食[た]べず、水[みず]も飲[の]まなかった。そして、契約[けいやく]の板[いた]に、十[とお]の言葉[ことば]を書[か]いた。"
  29: "モーセがシナイの山[やま]から下[くだ]って来[く]るとき、二枚[にまい]の石板[せきばん]が彼[かれ]の手[て]にあった。彼[かれ]が山[やま]から下[くだ]って来[く]るとき、モーセは、主[しゅ]と語[かた]ったために自分[じぶん]の顔[かお]の肌[はだ]が輝[かがや]いていることを知[し]らなかった。"
  30: "アロンとイスラエルの長老[ちょうろう]たちは皆[みな]、モーセを見[み]た。彼[かれ]の顔[かお]の肌[はだ]は輝[かがや]いていた。彼[かれ]らは近[ちか]づくのを恐[おそ]れた。"
  31: "モーセは彼[かれ]らを呼[よ]んだ。アロンと会衆[かいしゅう]のすべての長[おさ]たちが彼[かれ]のもとへ向[む]き直[なお]ったので、モーセは彼[かれ]らに語[かた]った。"
  32: "その後[あと]、イスラエルの子[こ]らは皆[みな]、彼[かれ]のもとに近[ちか]づいた。モーセは、主[しゅ]がシナイの山[やま]で彼[かれ]に語[かた]られたすべてのことを、彼[かれ]らに命[めい]じた。"
  33: "モーセは彼[かれ]らに語[かた]り終[お]えると、顔[かお]に覆[おお]いをかけた。"
  34: "モーセが主[しゅ]の前[まえ]に、語[かた]るために入[はい]るときは、出[で]て来[く]るまで覆[おお]いを取[と]った。そして出[で]て来[く]ると、主[しゅ]が命[めい]じたすべてのことをイスラエルの子[こ]らに語[かた]り、"
  35: "イスラエルの子[こ]らはモーセの顔[かお]が輝[かがや]いているのを見[み]た。モーセは、主[しゅ]と語[かた]るために入[はい]るまでは、また顔[かお]に覆[おお]いをかけた。"

notes:
  1: "Λάξευσον σεαυτῷ — あなたのために…切り出せ (λαξεύω — «вытёсывать»; σεαυτῷ — «себе»). καθὼς καὶ αἱ πρῶται — 前のものと同じように. γράψω ἐπὶ τῶν πλακῶν — その板に書こう. αἷς συνέτριψας — あなたが砕いた (συντρίβω)."
  2: "γίνου ἕτοιμος εἰς τὸ πρωΐ — 朝までに備えを整えて (ἕτοιμος — «готовый»). ἀναβήσῃ ἐπὶ τὸ ὄρος — 山に上り. στήσῃ μοι ἐκεῖ ἐπ᾿ ἄκρου τοῦ ὄρους — 山の頂でわたしの前に立て (ἄκρον — «вершина»)."
  3: "μηδεὶς ἀναβήτω — だれも上ってはならない. μηδὲ ὀφθήτω ἐν παντὶ τῷ ὄρει — 山のどこにも姿が見えてはならない (ὀφθῆναι — «показаться»). μὴ νεμέσθωσαν — 草を食べてはならない (νέμω — «пасти»)."
  4: "ἐλάξευσεν — 切り出し. καθάπερ καὶ αἱ πρῶται — 前のものと同じような. ὀρθρίσας — 朝早く起きて (ὀρθρίζω). καθότι συνέταξεν — 命じられたとおりに. ἔλαβεν — 手に取った (λαμβάνω)."
  5: "κατέβη κύριος ἐν νεφέλῃ — 主は雲の中に降り. παρέστη αὐτῷ ἐκεῖ — そこに彼のそばに立ち (παρίστημι). ἐκἀλεσεν τῷ ὀνόματι κυρίου — 主の名を呼ばれた (καλέω + датив: «провозгласил имя»). Слав. и jp-joc относят «стал» и «воззвал» к Моисею; в греч. подлежащее — Господь (ср. 34:6 παρῆλθεν κύριος)."
  6: "παρῆλθεν κύριος πρὸ προσώπου αὐτοῦ — 彼の前を通り過ぎながら. ἐκἀλεσεν — 宣べられた. ΚΥΡΙΟΣ ὁ θεὸς οἰκτίρμων καὶ ἐλεήμων — 主、主はあわれみ深く慈しみ深い神 (двойное «Господь» — провозглашение имени; οἰκτίρμων — «сострадательный», ἐλεήμων — «милующий»). μακρόθυμος — 怒りを遅くし (букв. «долготерпеливый»), πολυέλεος — 恵みに富み («многомилостивый»), ἀληθινός — 真実."
  7: "δικαιοσύνην διατηρῶν — 義を保ち (διατηρέω — «соблюдать»). ποιῶν ἔλεος εἰς χιλιάδας — 恵みを千代に及ぼし. ἀφαιρῶν ἀνομίας καὶ ἀδικίας καὶ ἁμαρτίας — 咎と背きと罪を取り除かれる (три слова: беззаконие, неправда, грех). οὐ καθαριεῖ τὸν ἔνοχον — 罪ある者を罰しないではおかず (καθαρίζω — «очищать»; ἔνοχος — «виновный»). ἐπάγων ἀνομίας πατέρων ἐπὶ τέκνα — 父の咎を子どもに報いられる (ἐπάγω). ἐπὶ τρίτην καὶ τετάρτην γενεάν — 三代、四代まで."
  8: "σπεύσας — 急いで (σπεύδω). κύψας ἐπὶ τὴν γῆν — 地にひれ伏して (κύπτω — «наклоняться»). προσεκύνησεν — 礼拝し (προσκυνέω)."
  9: "συμπορευθήτω ὁ κύριός μου μεθ᾿ ἡμῶν — わたしの主がわたしたちとともに歩んでください (κύριός μου — «господин мой»; обращение к Богу). σκληροτράχηλος — うなじの堅い. ἀφελεῖς σὺ τὰς ἁμαρτίας — あなたは…咎を赦し (ἀφαιρέω). ἐσόμεθα σοί — あなたのものとなる (букв. «будем Твоими»)."
  10: "τίθημί σοι διαθήκην — あなたと契約を結ぶ (τίθημι διαθήκην — «полагать завет»). ἔνδοξα — 驚くべきこと (ἔνδοξος — «славный»). ἃ οὐ γέγονεν ἐν πάσῃ τῇ γῇ — 全地にも…起こったことのない. ὄψεται πᾶς ὁ λαός — 民は皆見る. ἐν οἷς εἶ σύ — あなたがともにいる (букв. «среди которых ты»). θαυμαστά — 恐るべきこと (θαυμαστός — «дивный»)."
  11: "πρόσεχε σὺ πάντα — すべてのことを守れ (προσέχω — «внимать, соблюдать»). ἐκβάλλω πρὸ προσώπου ὑμῶν — あなたがたの前から追い出す. Здесь в базе есть «хананеа» (カナン人), которого нет в 33:2."
  12: "πρόσεχε σεαυτῷ — 気をつけよ (букв. «внимай себе»). μήποτε θῇς διαθήκην — 契約を結んではならない (аор. конъюнктив τίθημι). τοῖς ἐγκαθημένοις ἐπὶ τῆς γῆς — 地の住み人と (ἐγκάθημαι — «сидеть, обитать»). πρόσκομμα — つまずきの石."
  13: "βωμούς — 祭壇 (βωμός — языческий жертвенник). στήλας — 石柱 (στήλη). ἄλση — 聖なる木立 (ἄλσος — «священная роща»). ἐκκόψετε — 切り倒し (ἐκκόπτω). γλυπτά — 彫り像 (γλυπτός — «изваянный»). κατακαύσετε ἐν πυρί — 火で焼き払う."
  14: "ζηλωτὸν ὄνομα — 妬む名 (букв. «ревнительное имя»). θεὸς ζηλωτής — 妬む神 («Бог ревнитель»; слав. «Бог ревнив»)."
  15: "ἐγκαθημένοις πρὸς ἀλλοφύλους — 住み人と (πρὸς ἀλλοφύλους — «с иноплеменниками»; добавка LXX, в слав. её нет). ἐκπορνεύσωσιν ὀπίσω τῶν θεῶν — 神々を慕って淫を働き (πορνεύω — «блудодействовать»; ὀπίσω — «вслед»). θύσωσι — 犠牲をささげ (θύω). καλέσωσίν σε — あなたを招き. φάγῃς τῶν θυμάτων — 犠牲の肉を食べる (θύμα — «жертвенное»)."
  16: "λάβῃς τῶν θυγατέρων αὐτῶν τοῖς υἱοῖς σου — 息子たちに彼らの娘を嫁がせ (λαμβάνω — «брать»). δῷς τοῖς υἱοῖς αὐτῶν — 彼らの息子に与え (LXX держит оба направления). ἐκπορνεύσωσιν τοὺς υἱούς σου — 息子たちまで淫を働かせる (вин. при ἐκπορνεύω)."
  17: "θεοὺς χωνευτούς — 熔かした神々 (χωνευτός — «литой»; ср. 32:4)."
  18: "ἑορτὴν τῶν ἀζύμων — 種を入れないパンの祭り (ἄζυμος — «пресный»). φυλάξῃ — 守れ. ἐν μηνὶ τῶν νέων — 新しい実りの月に (μὴν τῶν νέων — месяц новых колосьев, Авив; слав. «в месяце новых плодов»). ἐξῆλθες ἐξ Αἰγύπτου — エジプトから出た."
  19: "πᾶν διανοῖγον μήτραν — 胎を開くもの (διανοίγω — «открывать»; μήτρα — «утроба»). τὰ ἀρσενικά — 雄のもの. πρωτότοκον μόσχου — 牛の初子 (μόσχος — «телец»)."
  20: "πρωτότοκον ὑποζυγίου — ろばの初子 (ὑποζύγιον — «вьючное животное»). λυτρώσῃ προβάτῳ — 羊で贖え (λυτρόω — «выкупать»; датив средства). τιμὴν δώσεις — 代金を払え (τιμή — «цена»). οὐκ ὀφθήσῃ ἐνώπιόν μου κενός — わたしの前に何も持たずに現れてはならない (κενός — «пустой»)."
  21: "ἓξ ἡμέρας ἐργᾷ — 六日は働き (ἐργάζομαι). τῷ σπόρῳ καὶ τῷ ἀμήτῳ καταπαύσεις — 種まきの時にも刈り入れの時にも休め (σπόρος — «сев», ἄμητος — «жатва»)."
  22: "ἑορτὴν ἑβδομάδων — 七週の祭り (ἑβδομάς — «седмица»; в церковном календаре — Пятидесятница). ἀρχὴν θερισμοῦ πυρῶν — 麦の刈り入れの初め (πυρός — «пшеница»). ἑορτὴν συναγωγῆς — 収穫の祭り (букв. «праздник собрания»). μεσοῦντος τοῦ ἐνιαυτοῦ — 年の半ばの (μεσόω — «быть в середине»)."
  23: "τρεῖς καιροὺς τοῦ ἐνιαυτοῦ — 年に三度 (καιρός — «срок, раз»). ὀφθήσεται πᾶν ἀρσενικόν σου — あなたの男は皆…現れねばならない."
  24: "πλατύνω τὰ ὅριά σου — あなたの境を広げる (ὅριον — «предел»). οὐκ ἐπιθυμήσει οὐδεὶς τῆς γῆς σου — だれもあなたの地を欲しがらない (ἐπιθυμέω + род.). ἀναβαίνῃς ὀφθῆναι — 現れるために上る."
  25: "οὐ σφάξεις ἐπὶ ζύμῃ αἷμα θυμιαμάτων μου — わたしの犠牲の血を、種を入れたパンとともにささげてはならない (σφάζω — «закалать»; ζύμη — «закваска»; θυμίαμα здесь — «жертва»). οὐ κοιμηθήσεται εἰς τὸ πρωΐ — 朝まで残してはならない (κοιμάομαι — «лежать»). θύματα τῆς ἑορτῆς τοῦ πασχα — 過越の祭りの犠牲."
  26: "πρωτογενήματα τῆς γῆς — 地の初物 (πρωτογένημα — «первый плод»). οὐ προσοίσεις ἄρνα ἐν γάλακτι μητρὸς αὐτοῦ — 子羊をその母の乳で煮てはならない (ἄρνα — «ягнёнок»; προσφέρω — «приносить»; в Синодальном «козленка» — масоретский текст)."
  27: "Γράψον σεαυτῷ — これらの言葉を書け (σεαυτῷ — «себе»). ἐπὶ γὰρ τῶν λόγων τούτων τέθειμαί σοι διαθήκην — これらの言葉によって…契約を結んだ (τέθειμαι, perfect от τίθημι)."
  28: "ἐναντίον κυρίου — 主の前に. τεσσαράκοντα ἡμέρας καὶ τεσσαράκοντα νύκτας — 四十日四十夜. ἄρτον οὐκ ἔφαγεν καὶ ὕδωρ οὐκ ἔπιεν — パンも食べず、水も飲まなかった. τοὺς δέκα λόγους — 十の言葉 (десятословие)."
  29: "ὡς δὲ κατέβαινεν — 下って来るとき. καταβαίνοντος δὲ αὐτοῦ — 彼が下って来るとき (повтор, как в LXX). δεδόξασται ἡ ὄψις τοῦ χρώματος τοῦ προσώπου αὐτοῦ — 顔の肌が輝いている (букв. «прославился вид цвета лица»; слав. «зрак плоти лица»). ἐν τῷ λαλεῖν αὐτὸν αὐτῷ — 主と語ったために (букв. «когда Он говорил с ним»)."
  30: "πρεσβύτεροι Ισραηλ — イスラエルの長老たち (слав. «вси сынове израилевы» — иное чтение). ἐφοβήθησαν ἐγγίσαι αὐτοῦ — 近づくのを恐れた (ἐγγίζω + род.)."
  31: "ἐπεστράφησαν πρὸς αὐτὸν — 彼のもとへ向き直った (ἐπιστρέφω). οἱ ἄρχοντες τῆς συναγωγῆς — 会衆のすべての長たち (συναγωγή здесь — «собрание»)."
  32: "προσῆλθον — 近づいた (προσέρχομαι). ἐνετείλατο αὐτοῖς — 彼らに命じた (ἐντέλλομαι). ἐν τῷ ὄρει Σινα — シナイの山で."
  33: "ἐπειδὴ κατέπαυσεν λαλῶν — 語り終えると (καταπαύω). ἐπέθηκεν ἐπὶ τὸ πρόσωπον αὐτοῦ κάλυμμα — 顔に覆いをかけた (κάλυμμα — «покрывало»)."
  34: "περιῃρεῖτο τὸ κάλυμμα — 覆いを取った (περιαιρέω; имперфект — каждый раз). ἕως τοῦ ἐκπορεύεσθαι — 出て来るまで. ὅσα ἐνετείλατο αὐτῷ κύριος — 主が命じたすべてのこと."
  35: "εἶδον οἱ υἱοὶ Ισραηλ…ὅτι δεδόξασται — イスラエルの子らは…輝いているのを見た. περιέθηκεν κάλυμμα — 覆いをかけた (περιτίθημι). ἕως ἂν εἰσέλθῃ συλλαλεῖν αὐτῷ — 主と語るために入るまでは (συλλαλέω — «беседовать»)."
