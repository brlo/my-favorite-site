# jp-box, 2-я Ездры, глава 9. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc в книге нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 9: Ездра в притворе храма, пост и воззвание собраться (1–4), сбор народа
# (5–6), обличение браков с иноплеменницами (7–9), ответ народа (10–13), согласие
# разобрать дело (14–17), список виновных по родам (18–36), чтение закона (37–48),
# утешение и радость (49–55). 9:37–55 — параллель Неем 8, формы имён и терминов
# выровнены по neem_08 (律法, 演壇, 大祭司, 読み手).
# Прямая речь: Ездра — 「…」 (7–9); народ — 「…」 (10–13); Аттарат — 「…」 (50),
# затем снова 「…」 (51–52) после ремарки рассказчика; левиты — 「…」 (53).
# Красного и синего нет.
# Нумерация по gr: 55 стихов; деление совпадает с csl (55), сдвигов нет.
# 〔…〕 нет: на месте каждого стиха в gr-lxx-byz есть текст. Сносок ⟨…⟩ нет:
# 律法, 契約, 捕囚, 祭司, レビ人, 氏族, 異民族, 聖なる日, 大祭司, 宝物庫 уже в корпусе.
# Имена: エズラ, ヨアナン, エリヤシブ; в списках — транслитерация греческого, где
# есть параллель в ezd_10/neem_08 — формы корпуса (расхождения в notes). Неемия в этой
# главе не назван (в Неем 8:9 он есть — отмечено в notes 49).
# jp-ni не использовался.

