verses:
  1: "エズラは立[た]ち上[あ]がり、神殿[しんでん]の庭[にわ]から、エリヤシブの子[こ]ヨアナンの宝物庫[たからものぐら]へ行[い]った。"
  2: "そこで夜[よ]を過[す]ごしたが、パンを味[あじ]わわず、水[みず]も飲[の]まなかった。民[たみ]の大[おお]きな不法[ふほう]のゆえに悲[かな]しんでいたからである。"
  3: "そして、ユダヤとエルサレムの全土[ぜんど]に、捕囚[ほしゅう]の者[もの]たちすべてに、エルサレムに集[あつ]まるよう告[つ]げ知[し]らせが出[で]された。"
  4: "二日[ふつか]か三日[みっか]のうちに来[こ]ない者[もの]はだれでも、先[さき]に立[た]つ長老[ちょうろう]たちの裁[さば]きにより、その家畜[かちく]は聖絶[せいぜつ]され、その人[ひと]自身[じしん]も捕囚[ほしゅう]の会衆[かいしゅう]から断[た]たれる。"
  5: "ユダとベニヤミンの部族[ぶぞく]の者[もの]たちは皆[みな]、三日[みっか]のうちにエルサレムに集[あつ]まった。これは第九[だいきゅう]の月[つき]、その月の二十日[はつか]のことであった。"
  6: "民[たみ]はすべて、神殿[しんでん]の広場[ひろば]に座[すわ]り、今[いま]の冬[ふゆ]のため震[ふる]えていた。"
  7: "エズラは立[た]ち上[あ]がって彼[かれ]らに言[い]った。「あなたがたは不法[ふほう]を行[おこな]い、イスラエルに罪[つみ]を加[くわ]えようとして、異[い]民族[みんぞく]の女[おんな]を妻[つま]に迎[むか]えた。"
  8: "今[いま]、あなたがたの父祖[ふそ]の神[かみ]である主[しゅ]に、告白[こくはく]と栄光[えいこう]をささげ、"
  9: "その御心[みこころ]を行[おこな]い、この地[ち]の諸国民[しょこくみん]から、また異民族の女[おんな]たちから離[はな]れなさい。」"
  10: "民[たみ]はすべて叫[さけ]び、大[おお]きな声[こえ]で言[い]った。「あなたが言[い]ったとおりに、わたしたちは行[おこな]う。"
  11: "しかし、民[たみ]は多[おお]く、しかも冬[ふゆ]の時[とき]である。わたしたちは外[そと]に立[た]つことができない。この事[こと]は一日[いちにち]や二日[ふつか]の仕事[しごと]ではない。わたしたちはこの事で多[おお]く罪[つみ]を犯[おか]したからである。"
  12: "民[たみ]の先[さき]に立[た]つ者[もの]たちは立[た]つように、わたしたちの住[す]む所[ところ]の者[もの]で異[い]民族[みんぞく]の女[おんな]を妻[つま]に迎[むか]えた者はすべて、時[とき]を定[さだ]めて来[く]るように。"
  13: "また、どの場所[ばしょ]でも、その長老[ちょうろう]たちとさばき人[びと]たちも来[く]るように。この事[こと]のゆえに、主[しゅ]の怒[いか]りがわたしたちから解[と]かれるまで。」"
  14: "アサエルの子[こ]ヨナタンと、トカヌの子[こ]イエジヤがこのことを引[ひ]き受[う]け、モソラムとレビスとサバタイが彼[かれ]らとともに働[はたら]いた。"
  15: "捕囚[ほしゅう]の者[もの]たちは、これらすべてのとおりに行[おこな]った。"
  16: "祭司[さいし]エズラは、彼[かれ]らの氏族[しぞく]の長[かしら]となる者[もの]たちを、すべて名[な]によって選[えら]んだ。彼[かれ]らは第十[だいじゅう]の月[つき]の新月[しんげつ]に、この事[こと]を調[しら]べるためにともに集[あつ]まった。"
  17: "異[い]民族[みんぞく]の女[おんな]を妻[つま]に迎[むか]えた者[もの]たちについての事[こと]は、第一[だいいち]の月[つき]の新月[しんげつ]までに終[お]わりに至[いた]った。"
  18: "祭司[さいし]たちのうち、集[あつ]まった者[もの]たちの中[なか]から、異[い]民族[みんぞく]の女[おんな]を妻[つま]に迎[むか]えた者[もの]たちが見[み]つかった。"
  19: "すなわち、ヨセデクの子[こ]イエシュアの子[こ]らと、その兄弟[きょうだい]たちのうちから、マアセヤ、エレアザル、ヤリブ、ヨダノス。"
  20: "彼[かれ]らは、自分[じぶん]の妻[つま]たちを追[お]い出[だ]すために手[て]を差[さ]し出[だ]し、自分[じぶん]の無知[むち]のゆえに雄羊[おひつじ]を償[つぐな]いの献[ささ]げ物[もの]としてささげた。"
  21: "エンメルの子[こ]らからは、アナニヤ、ザブダイオス、マネス、サマイオス、イエヒエル、アザリヤ。"
  22: "ファイスルの子[こ]らからは、エリオナイス、マッシアス、イシュマエル、ナタナエル、オキデロス、サルタス。"
  23: "レビ人[びと]のうちからは、ヨザバド、シメイス、コリオス、すなわちカリタ、パタイオス、ユダ、ヨアナス。"
  24: "歌[うた]い手[て]たちのうちからは、エリヤシブ、バクフロス。"
  25: "門番[もんばん]たちのうちからは、サルム、トルバン。"
  26: "イスラエルのうち、フォロスの子[こ]らからは、ラマヤ、イジヤ、マルキヤ、ミヤミン、エレアザル、アサビヤ、バナヤ。"
  27: "エラムの子[こ]らからは、マタニヤ、ザカリヤ、エズリエル、アブデヤ、ヤリモト、エリヤ。"
  28: "ザモトの子[こ]らからは、エリアダ、エリアシモス、オトニヤ、ヤリモト、サバトス、ゼルダイヤ。"
  29: "ベバイの子[こ]らからは、ヨアンネス、アナニヤ、ザブドス、エマティス。"
  30: "マニの子[こ]らからは、オラモス、マムコス、イエダイオス、ヤスボス、アサエル、イエレモト。"
  31: "アディの子[こ]らからは、ナアトス、モオシアス、ラクノス、ナイドス、マタニヤ、セスティル、バルヌオス、マナセ。"
  32: "アンナンの子[こ]らからは、エリオナス、アサイヤ、マルキヤ、サバイヤ、シモン・ホサマイオス。"
  33: "アソムの子[こ]らからは、マルタンナイオス、マタティア、サバンナイオス、エリファラト、マナセ、シメイ。"
  34: "バアニの子[こ]らからは、エレミヤ、モムディオス、マエロス、ユエル、マムダイ、ペディヤ、アノス、カラバシオン、エリヤシブ、マムニタナイモス、エリアシス、バンヌス、エリアリス、ソメイス、シェレミヤ、ナタニヤ。また、エゾラの子[こ]らからは、セスシス、エズリル、アザエル、サマトス、ザムブリス、ヨセフ。"
  35: "ノオマの子[こ]らからは、マジティヤ、ザバダイヤ、イダイス、ユエル、バナヤ。"
  36: "これらすべての者[もの]は異[い]民族[みんぞく]の女[おんな]を妻[つま]に迎[むか]え、彼女[かのじょ]たちを子[こ]どもたちとともに去[さ]らせた。"
  37: "祭司[さいし]たち、レビ人[びと]たち、イスラエルの者[もの]たちは、エルサレムとその地方[ちほう]に住[す]んだ。第七[だいしち]の月[つき]の新月[しんげつ]、イスラエルの子[こ]らは自分[じぶん]の住[す]みかにいた。"
  38: "民[たみ]はすべて、心[こころ]を一[ひと]つにして、神殿[しんでん]の東[ひがし]の門[もん]の広場[ひろば]に集[あつ]まった。"
  39: "彼[かれ]らは、大祭司[だいさいし]であり読[よ]み手[て]でもあるエズラに、主[しゅ]であるイスラエルの神[かみ]がモーセに授[さず]けられた律法[りっぽう]を持[も]って来[く]るように言[い]った。"
  40: "大祭司エズラは、第七[だいしち]の月[つき]の新月[しんげつ]に、男[おとこ]から女[おんな]に至[いた]るまで民[たみ]すべてに、また祭司[さいし]たちすべてに律法[りっぽう]を聞[き]かせるために、その律法を持って来[き]た。"
  41: "彼[かれ]は神殿[しんでん]の門[もん]の前[まえ]の広場[ひろば]で、夜明[よあ]けから正午[しょうご]まで、男[おとこ]たちと女[おんな]たちの前[まえ]でそれを読[よ]んだ。民[たみ]はすべて、心[こころ]を律法[りっぽう]に向[む]けた。"
  42: "祭司[さいし]であり律法[りっぽう]の読[よ]み手[て]であるエズラは、造[つく]られた木[き]の演壇[えんだん]の上[うえ]に立[た]った。"
  43: "彼[かれ]のそばでは、右[みぎ]にマタティア、サンムス、アナニヤ、アザリヤ、ウリヤ、エゼキヤ、バアルサモスが立[た]った。"
  44: "左[ひだり]にはファダイオス、ミサエル、マルキヤ、ロタスボス、ナバリア、ザカリヤが立[た]った。"
  45: "エズラは民[たみ]すべての前[まえ]で律法[りっぽう]の書[しょ]を取[と]り上[あ]げた。彼[かれ]はすべての前[まえ]に栄光[えいこう]のうちに座[すわ]っていたからである。"
  46: "彼[かれ]が律法[りっぽう]を開[ひら]いたとき、すべての者[もの]はまっすぐに立[た]った。エズラは、いと高[たか]き神[かみ]、万軍[ばんぐん]の神、全能者[ぜんのうしゃ]である主[しゅ]をほめたたえた。"
  47: "民[たみ]はすべて「アーメン」と叫[さけ]び、手[て]を高[たか]く上[あ]げて地[ち]に伏[ふ]し、主[しゅ]を拝[はい]した。"
  48: "イエシュア、アンニウト、サラビヤ、ヤディノス、ヤクボス、サバタイ、アウタイヤ、マイアンナス、カリタ、アザリヤ、ヨザバド、アナニヤ、ファリヤというレビ人[びと]たちは、主[しゅ]の律法[りっぽう]を教[おし]え、民[たみ]に向[む]かって主の律法を読[よ]んで聞[き]かせ、ともにその意味[いみ]を悟[さと]らせた。"
  49: "アタラテスは、大祭司[だいさいし]であり読[よ]み手[て]であるエズラに、また民[たみ]を教[おし]えているレビ人[びと]たちに、すべての者[もの]に向[む]かって言[い]った。"
  50: "「この日[ひ]は主[しゅ]にとって聖[せい]なる日[ひ]である。」民[たみ]は皆[みな]、律法[りっぽう]を聞[き]いて泣[な]いていた。"
  51: "「だから、行[い]って脂[あぶら]っこい物[もの]を食[た]べ、甘[あま]い物[もの]を飲[の]み、持[も]たない者[もの]には贈[おく]り物[もの]を送[おく]りなさい。"
  52: "この日[ひ]は主[しゅ]にとって聖[せい]なる日[ひ]だからである。悲[かな]しんではならない。主[しゅ]があなたがたに栄光[えいこう]を与[あた]えてくださるからである。」"
  53: "レビ人[びと]たちは民[たみ]すべてに命[めい]じて言[い]った。「この日[ひ]は主[しゅ]にとって聖[せい]なる日[ひ]である。悲[かな]しんではならない。」"
  54: "人[ひと]々[びと]は皆[みな]、食[た]べ、飲[の]み、喜[よろこ]び、持[も]たない者[もの]に贈[おく]り物[もの]を送[おく]るために去[さ]り、大[おお]いに喜[よろこ]んだ。"
  55: "彼[かれ]らは、教[おし]えられた言葉[ことば]に心[こころ]を奮[ふる]い立[た]たされたからである。そして、彼らは集[あつ]まった。"

notes:
  1: "ἀναστὰς … ἀπὸ τῆς αὐλῆς τοῦ ἱεροῦ — встав, [пошёл] от двора храма (αὐλή, 庭); слав. «от притвора храма». ἐπορεύθη εἰς τὸ παστοφόριον Ιωαναν τοῦ Ελιασιβου — пошёл в παστοφόριον, боковую комнату при храме (слав. «сосудохранилницу»), к Иоанану [сыну] Елиасива; в ezd_10:6 то же место названо γαζοφυλάκιον (宝物庫), поэтому 宝物庫. Имена: ヨアナン, エリヤシブ — транслитерация 2-й Ездры; в ezd_10:6 те же лица названы ヨハナン, エリアシブ."
  2: "αὐλισθεὶς ἐκεῖ — проведя там ночь (αὐλίζομαι); ἄρτου οὐκ ἐγεύσατο — не вкусил хлеба (γεύομαι); οὐδὲ ὕδωρ ἔπιεν — и воды не пил. πενθῶν ὑπὲρ τῶν ἀνομιῶν τῶν μεγάλων τοῦ πλήθους — скорбя о великих беззакониях множества (πενθέω, ἀνομία, πλῆθος); слав. «рыдая», Син. «скорбя». ἀνομία передана 不法, как и в остальной главе."
  3: "ἐγένετο κήρυγμα — было воззвание, провозглашение (κήρυγμα); ἐν ὅλῃ τῇ Ιουδαίᾳ καὶ Ιερουσαλημ — по всей Иудее и Иерусалиму (ユダヤ, как в корпусе). πᾶσι τοῖς ἐκ τῆς αἰχμαλωσίας — всем из плена (αἰχμαλωσία, 捕囚). συναχθῆναι εἰς Ιερουσαλημ — собраться в Иерусалим; слав. «еже собратися во Иерусалим»."
  4: "ἀπαντήσωσιν — придут, явятся (ἀπαντάω); ἐν δυσὶν ἢ τρισὶν ἡμέραις — в два или три дня. κατὰ τὸ κρίμα τῶν προκαθημένων πρεσβυτέρων — по суду председательствующих старейшин (κρίμα, προκάθημαι, 長老). ἀνιερωθήσονται τὰ κτήνη αὐτῶν — скот их будет посвящён, т. е. отобран в пользу святилища (ἀνιερόω, κτῆνος); слав. «возмется имение их» — слово шире, поэтому взято 聖絶, как в ezd_10:8 (ἀναθεματίζω). ἀλλοτριωθήσεται ἀπὸ τοῦ πλήθους — будет отчуждён от множества (ἀλλοτριόω)."
  5: "ἐπισυνήχθησαν οἱ ἐκ τῆς φυλῆς Ιουδα καὶ Βενιαμιν — собрались бывшие из колена Иудина и Вениаминова (φυλή, 部族). ἐν τρισὶν ἡμέραις — в три дня. [οὗτος ὁ μὴν ἔνατος τῇ εἰκάδι τοῦ μηνός] — в квадратных скобках критического издания, но есть и в слав. («сей месяц девятый, в двадесятый день»), поэтому без 〔…〕: девятый месяц, двадцатое число."
  6: "συνεκάθισαν — сели вместе (συγκαθίζω); πᾶν τὸ πλήθος — всё множество. ἐν τῇ εὐρυχώρῳ τοῦ ἱεροῦ — на пространном месте храма (εὐρύχωρος), 広場, как в ezd_10:9 (πλατεῖα). τρέμοντες διὰ τὸν ἐνεστῶτα χειμῶνα — дрожа из-за наступившей зимы (τρέμω, ἐνεστώς, χειμών, 冬); слав. «ради зимы настоящия»."
  7: "ἠνομήσατε — вы беззаконновали (ἀνομέω); συνῳκίσατε γυναῖκας ἀλλογενεῖς — «поселили» у себя жён иноплеменных, т. е. взяли в жёны (συνοικίζω, ἀλλογενής, 異民族). τοῦ προσθεῖναι ἁμαρτίαν τῷ Ισραηλ — чтобы прибавить грех Израилю (προστίθημι, ἁμαρτία); слав. «да приложите грехи ко израилю». С этого стиха начинается речь Ездры, она идёт до ст. 9."
  8: "δότε ὁμολογίαν δόξαν τῷ κυρίῳ θεῷ τῶν πατέρων ἡμῶν — воздайте исповедание и славу Господу Богу отцов наших (ὁμολογία, δόξα); слав. «дадите исповедание и славу». Син. добавляет «Итак, воздайте теперь» — в LXX и слав. этого «итак» нет, в текст не внесено. Ὁμολογία здесь — открытое признание, поэтому 告白."
  9: "ποιήσατε τὸ θέλημα αὐτοῦ — сотворите волю Его (θέλημα, 御心); χωρίσθητε ἀπὸ τῶν ἐθνῶν τῆς γῆς — отделитесь от народов земли (χωρίζω, ἔθνος, 諸国民); καὶ ἀπὸ τῶν γυναικῶν τῶν ἀλλογενῶν — и от жён иноплеменных. Здесь речь Ездры заканчивается; слав. «отлучитеся от язык земных и от жен иноплеменных»."
  10: "ἐφώνησαν ἅπαν τὸ πλήθος — возопило всё множество (φωνέω); μεγάλῃ τῇ φωνῇ — громким голосом. Οὕτως ὡς εἴρηκας ποιήσομεν — «так, как ты сказал, сделаем» (ἐρῶ); слав. «тако, якоже рекл еси, сотворим». Ответ народа — 常体, как и вся прямая речь в корпусе; греч. εἶπον (аорист) передано настоящим-будущим 行う, как в ezd_10:12."
  11: "τὸ πλῆθος πολὺ — множество многочисленно; ἡ ὥρα χειμερινή — время зимнее (χειμερινός); οὐκ ἰσχύομεν στῆναι αἴθριοι — не можем стоять под открытым небом (ἰσχύω, αἴθριος), слав. «не можем стояти без покрова». καὶ οὐχ εὕρομεν — «и не нашли»: тёмное место, вероятно порча текста; слав. и Син. его опускают, поэтому в тексте не передано. ἐπὶ πλεῖον γὰρ ἡμάρτομεν — ибо сверх меры согрешили (ἐπί с вин.)."
  12: "στήτωσαν οἱ προηγούμενοι τοῦ πλήθους — пусть предстанут предводители народа (προηγέομαι); πάντες οἱ ἐκ τῶν κατοικιῶν ἡμῶν — все из селений наших (κατοικία); ὅσοι ἔχουσιν γυναῖκας ἀλλογενεῖς — кто имеет жён иноплеменных. παραγενηθήτωσαν λαβόντες χρόνον — пусть придут, взяв [себе] время, т. е. в назначенный срок (παραγίνομαι, λαμβάνω χρόνον); отсюда 時を定めて."
  13: "ἑκάστου τόπου τοὺς πρεσβυτέρους καὶ τοὺς κριτάς — старейшин и судей каждого места (κριτής, さばき人); слав. «от всякаго места старейшины и судии». ἕως τοῦ λῦσαι τὴν ὀργὴν τοῦ κυρίου ἀφ᾿ ἡμῶν — доколе не разрешится гнев Господень от нас (λύω, ὀργή); τοῦ πράγματος τούτου — за это дело. Греч. фраза оборвана (эллипсис сказуемого из ст. 12) — в тексте повторено 来るように; здесь речь народа кончается."
  14: "Ιωναθας Αζαηλου — Ионафан [сын] Азаила (в ezd_10:15 те же лица: ヨナタン, アサエル, но с иным греч. обликом имён). Ιεζιας Θοκανου — Иезия [сын] Фокана (в ezd_10:15 — Ιαζια υἱὸς Θεκουε, ヤジヤ, テコア; здесь патронимик иной, поэтому イエジヤ, トカヌ). ἐπεδέξαντο κατὰ ταῦτα — приняли на себя это (ἐπιδέχομαι); слав. «прияста по сему». Μοσολλαμος, Λευις, Σαββαταιος — モソラム (как в neem_08:4), レビス, サバタイ (как в ezd_10:15). συνεβράβευσαν αὐτοῖς — содействовали им (συμβραβεύω, редкий глагол); слав. «вкупе содействоваша има»."
  15: "ἐποίησαν κατὰ πάντα ταῦτα — сделали по всему этому; οἱ ἐκ τῆς αἰχμαλωσίας — бывшие из плена (αἰχμαλωσία). Слав. «и сотвориша по всему сему бывшии от пленения»."
  16: "ἐπελέξατο ἑαυτῷ — избрал себе (ἐπιλέγω); ἄνδρας ἡγουμένους τῶν πατριῶν αὐτῶν — мужей, начальствующих в их отечествах (ἡγέομαι, πατριά, 氏族). κατ᾽ ὄνομα πάντας — всех по имени (ὄνομα). συνεκάθισαν τῇ νουμηνίᾳ τοῦ μηνὸς τοῦ δεκάτου — сели вместе в новолуние десятого месяца (νουμηνία, 新月; слав. «в новомесячии десятаго месяца»). ἐτάσαι τὸ πρᾶγμα — исследовать дело (ἐτάζω), слав. «испытати дело то»."
  17: "ἤχθη ἐπὶ πέρας — было приведено к концу (ἄγω ἐπὶ πέρας); τὰ κατὰ τοὺς ἄνδρας — дела о мужах. τοὺς ἐπισυνέχοντας γυναῖκας ἀλλογενεῖς — державших при себе жён иноплеменных (ἐπισυνέχω). ἕως τῆς νουμηνίας τοῦ πρώτου μηνός — до новолуния первого месяца; слав. «даже до новомесячия перваго месяца»."
  18: "εὑρέθησαν τῶν ἱερέων οἱ ἐπισυναχθέντες — нашлись из священников собравшиеся (εὑρίσκω, ἐπισυνάγω); ἀλλογενεῖς γυναῖκας ἔχοντες — имеющие жён иноплеменных. Слав. «обретошася от иереев собравшиися имуще жен иноплеменничих»; порядок слов греч. сохранён."
  19: "ἐκ τῶν υἱῶν Ἰησοῦ τοῦ Ιωσεδεκ — из сынов Иисуса [сына] Иоседекова (イエシュア, ヨセデク); καὶ τῶν ἀδελφῶν Μασηας — и из братьев Масии (Μασηας; в ezd_10:18 — Μαασηα, マアセヤ, форма корпуса). Ελεαζαρος, Ιωριβος, Ιωδανος — Елеазар, Иорив, Иодан; エレアザル, ヤリブ — формы корпуса (ezd_10:18), третье имя в 1-й Ездре иное (в ezd_10:18 — Γαδαλια, ゲダルヤ), поэтому транслитерация ヨダノス. Слав. читает первое имя «Мафила» — уникальное чтение, не взято."
  20: "ἐπέβαλον τὰς χεῖρας — возложили руки, т. е. дали обязательство (ἐπιβάλλω); ἐκβαλεῖν τὰς γυναῖκας αὐτῶν — изгнать жён своих (ἐκβάλλω), слав. «да изгонят жены своя». εἰς ἐξιλασμὸν κριοὺς — овнов во умилостивление (ἐξιλασμός, κριός, 雄羊); ὑπὲρ τῆς ἀγνοίας αὐτῶν — за неведение их (ἄγνοια), слав. «во умилостивление овны за неведение свое»."
  21: "υἱοὶ Εμμηρ — сыны Еммера (Εμμηρ, エンメル, как в ezd_02:37; в ezd_10:20 тот же род — インメル). Ανανιας — アナニヤ (имя из таблицы книги). Ζαβδαιος, Μανης, Σαμαιος, Ιιηλ, Αζαριας — ザブダイオス, マネス, サマイオス, イエヒエル (как в ezd_10:21), アザリヤ; слав. «завдей, ианин, самиа, иереил, азариа»."
  22: "υἱοὶ Φαισουρ — сыны Фесура (Φαισουρ; слав. «фесуровых», Син. «Фесура»; в ezd_10:22 — Φασουρ, パシュル). Ελιωναις — エリオナイス (в ezd_10:22 — Ελιωηναι, エルヨエナイ). Μασσιας, Ισμαηλος, Ναθαναηλος, Ωκιδηλος, Σαλθας — マッシアス, イシュマエル (форма корпуса), ナタナエル (форма корпуса), オキデロス, サルタス; слав. «масиа, исмаил, нафанаил, окидил, салоа»."
  23: "ἐκ τῶν Λευιτῶν — из левитов (Λευίτης, レビ人). Ιωζαβδος, Σεμεις, Κωλιος [οὗτος Καλιτας], Παθαιος, Ωουδας, Ιωανας — ヨザバド (форма корпуса, ezd_10:23), シメイス, コリオス, он же Карита (в квадратных скобках критического издания, в базе есть, поэтому без 〔…〕), パタイオス, ユダ (форма корпуса), ヨアナス; слав. «колий (сей есть калита)»."
  24: "ἱεροψάλται — церковные певцы (ἱεροψάλτης), в отличие от ᾄδοντες (歌い手); слав. «священнопевцев», поэтому 歌い手たち. Ελιασιβος, Βακχουρος — Елиасив, Вакхур; エリヤシブ, バクフロス. Слав. первое имя читает «елиаксур» (иное чтение), поэтому здесь транслитерация с греческого, а не форма корпуса."
  25: "ἐκ τῶν θυρωρῶν — из привратников (θυρωρός, 門番); Σαλλουμος καὶ Τολβανης — Саллум и Толван (слав. «саллум и толван», Син. «Салум и Толван»); サルム (форма корпуса, ezd_02:42), トルバン. В ezd_10:24 привратники названы иначе (シャルム, テレム, ウリ), поэтому списки не совпадают."
  26: "ἐκ τοῦ Ισραηλ — из Израиля, т. е. из мирян (после священников, левитов, певцов и привратников). υἱοὶ Φορος — сыны Фароса (Φορος, フォロス, как в ezd_02:3; в ezd_10:25 — パロシュ). Имена: Ιερμας, Ιεζιας, Μελχιας, Μιαμινος, Ελεαζαρος, Ασιβιας, Βανναιας; по параллели ezd_10:25 (там те же семь человек в ином греч. облике) взяты формы корпуса: ラマヤ, イジヤ, マルキヤ, ミヤミン, エレアザル, アサビヤ, バナヤ. Слав. «иерма, иеддиа, мелхиа, маил, елеазар, асивиа, ваанеа»."
  27: "υἱοὶ Ηλαμ — сыны Илама (Ηλαμ, エラム, как в ezd_10:26; в ezd_02:7 — アイラム). Ματανιας, Ζαχαριας — マタニヤ, ザカリヤ (формы корпуса). Ιεζριηλος — エズリエル (слав. «иереил»; в ezd_10:26 на этом месте Ιαιηλ). Ωβαδιος — アブデヤ (форма корпуса, ezd_10:26). Ιερεμωθ — ヤリモト (форма корпуса). Ηλιας — エリヤ. В слав. пять имён (пропущен Авдий), в LXX и Син. шесть — держимся LXX."
  28: "υἱοὶ Ζαμοθ — сыны Замофа (Ζαμοθ; в параллели ezd_10:27 этот род — Ζαθουα, ザトア, но здесь держимся греч. формы 2-й Ездры, отсюда ザモト). Ελιαδας, Ελιασιμος, Οθονιας, Ιαριμωθ, Σαβαθος, Ζερδαιας — エリアダ, エリアシモス, オトニヤ, ヤリモト (форма корпуса), サバトス, ゼルダイヤ; слав. «елиада, елисим, офониа, иаримоф, сават, сардей»."
  29: "υἱοὶ Βηβαι — сыны Вивая (Βηβαι, ベバイ; слав. «виваевых», Син. «Виваия»). Ιωαννης, Ανανιας, Ζαβδος, Εμαθις — ヨアンネス, アナニヤ, ザブドス, エマティス; слав. «иоанн, ананиа, иозавад, емафий» (в слав. третье имя иное), в ezd_10:28 иной набор имён."
  30: "υἱοὶ Μανι — сыны Мани (Μανι, マニ). Ωλαμος, Μαμουχος, Ιεδαιος, Ιασουβος, Ασαηλος, Ιερεμωθ — オラモス, マムコス, イエダイオス, ヤスボス, アサエル (форма корпуса, ezd_10:15), イエレモト; слав. «олам, мамух, иеддей, иасув, иасаил, иеримоф»."
  31: "υἱοὶ Αδδι — сыны Аддия (Αδδι, アディ). Νααθος, Μοοσσιας, Λακκουνος, Ναιδος, Βεσκασπασμυς, Σεσθηλ, Βαλνουος, Μανασσηας — ナアトス, モオシアス, ラクノス, ナイドス, マタニヤ, セスティル, バルヌオス, マナセ. На месте пятого имени в LXX стоит тёмное Βεσκασπασμυς (гапакс), слав. и Син. читают «Матфания» (マタニヤ) — по паритету взято церковное чтение, вариант LXX назван здесь."
  32: "υἱοὶ Ανναν — сыны Анана (Ανναν, アンナン). Ελιωνας, Ασαιας, Μελχιας, Σαββαιας, Σιμων Χοσαμαιος — エリオナス, アサイヤ, マルキヤ (форма корпуса), サバイヤ, シモン・ホサマイオス; слав. «елиона, иасей, мелхиа, саввей, симон хосамей»."
  33: "υἱοὶ Ασομ — сыны Асома (Ασομ, アソム). Μαλτανναιος, Ματταθιας, Σαβανναιους, Ελιφαλατ, Μανασσης, Σεμει — マルタンナイオス, マタティア (форма корпуса, neem_08:4), サバンナイオス, エリファラト, マナセ (форма корпуса), シメイ (форма корпуса); слав. «алтаней, матфий, ванеа, елифалат, манассиа, семей» (третье имя иное)."
  34: "υἱοὶ Βαανι — сыны Ваания (Βαανι, バアニ). Шестнадцать имён: Ιερεμιας, Μομδιος, Μαηρος, Ιουηλ, Μαμδαι, Πεδιας, Ανως, Καραβασιων, Ελιασιβος, Μαμνιταναιμος, Ελιασις, Βαννους, Ελιαλις, Σομεις, Σελεμιας, Ναθανιας — エレミヤ, モムディオス, マエロス, ユエル, マムダイ, ペディヤ, アノス, カラバシオン, エリヤシブ, マムニタナイモス, エリアシス, バンヌス, エリアリス, ソメイス, シェレミヤ (форма корпуса, ezd_10:39), ナタニヤ. καὶ ἐκ τῶν υἱῶν Εζωρα — и из сынов Езора (Εζωρα, エゾラ): Σεσσις, Εζριλ, Αζαηλος, Σαματος, Ζαμβρις, Ιωσηπος — セスシス, エズリル, アザエル, サマトス, ザムブリス, ヨセフ (форма корпуса). Слав. передаёт те же имена в иных формах."
  35: "υἱοὶ Νοομα — сыны Ноомы (Νοομα, ノオマ; слав. «ефмы», Син. «Ефма» — иное чтение имени рода, в тексте греческое). Μαζιτιας, Ζαβαδαιας, Ηδαις, Ιουηλ, Βαναιας — マジティヤ, ザバダイヤ, イダイス, ユエル, バナヤ (форма корпуса); слав. «мазитиа, завадаиа, идаий, иуил, ванеа»."
  36: "συνῴκισαν γυναῖκας ἀλλογενεῖς — взяли [в дом] жён иноплеменных (συνοικίζω); ἀπέλυσαν αὐτὰς σὺν τέκνοις — отпустили их с детьми (ἀπολύω, τέκνον); слав. «отпустиша их со чады», Син. «отпустили их с детьми». Итог списка 18–35."
  37: "κατῴκησαν — поселились (κατοικέω); οἱ ἱερεῖς, οἱ Λευῖται, οἱ ἐκ τοῦ Ισραηλ — священники, левиты, бывшие из Израиля; ἐν Ιερουσαλημ καὶ ἐν τῇ χώρᾳ — в Иерусалиме и в области (χώρα, 地方). τῇ νουμηνίᾳ τοῦ ἑβδόμου μηνός — в новолуние седьмого месяца (νουμηνία, 新月); καὶ οἱ υἱοὶ Ισραηλ ἐν ταῖς κατοικίαις αὐτῶν — и сыны Израиля в жилищах своих. Фраза сбита (переход к Неем 8), порядок греч. сохранён."
  38: "συνήχθη … ὁμοθυμαδὸν — собралось единодушно (ὁμοθυμαδόν); ἐπὶ τὸ εὐρύχωρον — на пространное место (εὐρύχωρος, 広場). τοῦ πρὸς ἀνατολὰς τοῦ ἱεροῦ πυλῶνος — [у] восточных ворот храма (πυλών, ἀνατολή), слав. «еже ко востоку врат священных»."
  39: "Εσδρα τῷ ἀρχιερεῖ καὶ ἀναγνώστῃ — Ездре, первосвященнику и чтецу (ἀρχιερεύς, 大祭司; ἀναγνώστης, 読み手); слав. «архиерею и чтецу». κομίσαι τὸν νόμον Μωυσέως — принести закон Моисеев (κομίζω, νόμος, 律法). τὸν παραδοθέντα ὑπὸ τοῦ κυρίου θεοῦ Ισραηλ — преданный Господом Богом Израиля (παραδίδωμι); в Неем 8:1 просят «книгу закона Моисеева», здесь добавлено «преданный Господом»."
  40: "ἐκόμισεν — принёс; ὁ ἀρχιερεύς — первосвященник; παντὶ τῷ πλήθει — всему множеству. ἀπὸ ἀνθρώπου ἕως γυναικὸς — от мужа до жены, т. е. от мужчин до женщин; καὶ πᾶσιν τοῖς ἱερεῦσιν ἀκοῦσαι τοῦ νόμου — и всем священникам, чтобы слушали закон. νουμηνίᾳ τοῦ ἑβδόμου μηνός — в новолуние седьмого месяца; слав. «в новомесячии седмаго месяца»."
  41: "ἀνεγίγνωσκεν — читал (имперфект, ἀναγινώσκω); ἐν τῷ … εὐρυχώρῳ — на пространстве; πρὸ τοῦ ἱεροῦ πυλῶνος — пред воротами храма. ἀπὸ ὄρθρου ἕως μεσημβρινοῦ — от зари до полудня (ὄρθρος, μεσημβρία). ἐπέδωκαν τὸν νοῦν εἰς τὸν νόμον — приложили ум к закону (ἐπιδίδωμι, νοῦς, 心を向ける); слав. «даша… чувства в закон»."
  42: "ἔστη … ἐπὶ τοῦ ξυλίνου βήματος — встал на деревянном возвышении (βῆμα ξύλινον, 演壇, как в neem_08:4). τοῦ κατασκευασθέντος — которое было устроено (κατασκευάζω); слав. «на древянем амвоне, иже соделан бысть»."
  43: "ἔστησαν παρ᾽ αὐτῷ … ἐκ δεξιῶν — стояли при нём справа; ἐκ δεξιῶν — справа (δεξιός). Имена: Ματταθιας, Σαμμους, Ανανιας, Αζαριας, Ουριας, Εζεκιας, Βααλσαμος — マタティア (форма корпуса, neem_08:4), サンムス, アナニヤ, アザリヤ, ウリヤ, エゼキヤ, バアルサモス; слав. «маттафиа, самуй, ананиа, азариа, уриа, езекиа, валасам». В Неем 8:4 имена иные (サマヤ, エルキヤ, マアセヤ), поэтому список не совпадает."
  44: "ἐξ εὐωνύμων — слева (εὐώνυμος). Φαδαιος, Μισαηλ, Μελχιας, Λωθασουβος, Ναβαριας, Ζαχαριας — ファダイオス, ミサエル (форма корпуса, neem_08:4), マルキヤ (форма корпуса), ロタスボス, ナバリア, ザカリヤ; слав. «фалдей, мисаил, мелхиа, аофасув, навариа, захариа» — в слав. четвёртое имя иное (иная огласовка), в LXX 6 имён и в слав. 6."
  45: "ἀναλαβὼν … τὸ βιβλίον τοῦ νόμου — взяв книгу закона (ἀναλαμβάνω, βιβλίον, 書); ἐνώπιον τοῦ πλήθους — пред множеством. προεκάθητο γὰρ ἐπιδόξως ἐνώπιον πάντων — ибо он сидел прежде в славе пред всеми (προκάθημαι, ἐπιδόξως); слав. «председяше бо во славе пред всеми». Порядок членов греч. сохранён (вставка γάρ внутри фразы)."
  46: "ἐν τῷ λῦσαι τὸν νόμον — при раскрытии (букв. «разрешении») закона, т. е. когда открыл свиток (λύω); слав. «егда толковаше закон», Син. «когда он объяснял закон» — иное понимание, в тексте держимся греч. ὀρθοὶ ἔστησαν — встали прямо (ὀρθός). εὐλόγησεν … τῷ κυρίῳ θεῷ ὑψίστῳ — благословил Господа Бога Вышнего (εὐλογέω, ὕψιστος, いと高き). θεῷ σαβαωθ παντοκράτορι — Богу Саваофу, Вседержителю (Σαβαωθ — евр. «воинства»; в корпусе передаётся 万軍の神, транслитерации サバオト нет; παντοκράτωρ — 全能者)."
  47: "ἐπεφώνησεν — возгласил (ἐπιφωνέω); Αμην — アーメン. ἄραντες ἄνω τὰς χεῖρας — подняв руки вверх (αἴρω, χείρ). προσπεσόντες ἐπὶ τὴν γῆν — припав на землю (προσπίπτω). προσεκύνησαν τῷ κυρίῳ — поклонились Господу (προσκυνέω); слав. «воздвигше горе руки и припадше на землю, поклонишася Господу»."
  48: "Тринадцать имён: Ἰησοῦς, Αννιουθ, Σαραβιας, Ιαδινος, Ιακουβος, Σαββαταιος, Αυταιας, Μαιαννας, Καλιτας, Αζαριας, Ιωζαβδος, Ανανιας, Φαλιας — イエシュア, アンニウト, サラビヤ (форма корпуса, neem_08:7), ヤディノス, ヤクボス, サバタイ, アウタイヤ, マイアンナス, カリタ, アザリヤ, ヨザバド, アナニヤ, ファリヤ; οἱ Λευῖται — левиты. ἐδίδασκον τὸν νόμον κυρίου — учили закону Господню (διδάσκω). ἐμφυσιοῦντες ἅμα τὴν ἀνάγνωσιν — «внушая вместе чтение», т. е. втолковывая смысл при чтении (ἐμφυσάω); слав. «внушающе купно чтение», отсюда ともにその意味を悟らせた."
  49: "εἶπεν Ατταρατης — сказал Аттарат (Ατταρατης; слав. «атфарат», Син. «Атфарат»); τῷ ἀρχιερεῖ καὶ ἀναγνώστῃ — первосвященнику и чтецу; τοῖς Λευίταις τοῖς διδάσκουσι τὸ πλῆθος — левитам, учащим множество. ἐπὶ πάντας — ко всем [народу], т. е. обращаясь ко всем; речь его начинается в ст. 50. В Неем 8:9 здесь говорят Неемия, Ездра и левиты — в 1-й Ездре назван только Аттарат."
  50: "Ἡ ἡμέρα αὕτη ἐστὶν ἁγία τῷ κυρίῳ — день сей свят Господу (ἁγία, 聖なる日). καὶ πάντες ἔκλαιον ἐν τῷ ἀκοῦσαι τοῦ νόμου — и все плакали при слушании закона: это ремарка рассказчика внутри речи (в греч. между тире), поэтому кавычки закрыты и открыты снова в ст. 51. Слав. добавляет в конце «(И рече ездра:)» — в LXX этого нет; не внесено, потому что говорит Аттарат, а не Ездра."
  51: "βαδίσαντες οὖν φάγετε λιπάσματα — пойдя, ешьте тучное (βαδίζω, λίπασμα); слав. «шедше убо ядите тучная». πίετε γλυκάσματα — пейте сладкое (γλύκασμα). ἀποστείλατε ἀποστολὰς τοῖς μὴ ἔχουσιν — пошлите посылки (дары) неимущим (ἀποστολή), слав. «послите неимущым»; отсюда 贈り物."
  52: "ἁγία γὰρ ἡ ἡμέρα τῷ κυρίῳ — ибо свят день [сей] Господу. μὴ λυπεῖσθε — не скорбите (λυπέω); ὁ γὰρ κύριος δοξάσει ὑμᾶς — ибо Господь прославит вас (δοξάζω). В параллельном Неем 8:10 вместо этого стоит «радость Господня — сила ваша» (ἰσχὺς ὑμῶν); в LXX-А 2-й Ездры этого чтения нет, поэтому не внесено."
  53: "οἱ Λευῖται ἐκέλευον — левиты велели (κελεύω); τῷ δήμῳ παντὶ — всему народу (δῆμος, 民). Ἡ ἡμέρα αὕτη ἁγία — день сей свят; μὴ λυπεῖσθε — не скорбите. Слав. добавляет «Господеви» (день сей свят Господу); по паритету внесено в текст без скобок (主にとって), в LXX этого слова нет."
  54: "ᾤχοντο — пошли (οἴχομαι); φαγεῖν καὶ πιεῖν καὶ εὐφραίνεσθαι — есть, пить и веселиться (εὐφραίνω); δοῦναι ἀποστολὰς τοῖς μὴ ἔχουσιν — дать посылки неимущим; καὶ εὐφρανθῆναι μεγάλως — и возвеселиться весьма (μεγάλως); слав. «да радуются (зело) много»."
  55: "ἐνεφυσιώθησαν ἐν τοῖς ῥήμασιν — были воодушевлены, «вдохновлены» словами (ἐμφυσάω, ῥῆμα); οἷς ἐδιδάχθησαν — которым были научены (διδάσκω); слав. «еще бо содержаша словеса, имже научишася» — «держались слов», иное понимание того же глагола. καὶ ἐπισυνήχθησαν — и собрались: короткая придаточная, вероятно след перехода к следующей главе (ср. Неем 8), в тексте оставлена; Син. присоединяет «в собрании»."
