# jp-box, Судьи, глава 6. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc есть в 6:2, 6:7,
# 6:11–24 и 6:36–40 — только свидетель церковного чтения, не источник языка.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 6: угнетение от Мидиана и вопль (1–10), призвание Гедеона и знамение
# с огнём (11–24), жертвенник Ваала и имя Ербаал (25–32), сбор войска (33–35),
# шерсть и роса (36–40).
# Речи: пророк (8–10, внутри — слова Бога 『…』), ангел (12–14, 16, 18, 20),
# Гедеон (13, 15, 17–18, 36–37, 39), Господь (23, 25–26), жители и Иоас (30–31).
# Красного и синего нет: <j>/<mo> не ставятся.
# 〔…〕: 6:32 〔エルバアル、すなわち〕 — имя из церковного чтения (слав.
# «иероваалом», Синод. «Иероваалом»), в gr-lxx-byz оно переведено
# (Δικαστήριον τοῦ Βααλ); проверено по базе: ιεροβααλ в стихе — НЕТ.
# В остальном 〔…〕 нет: «втораго» (слав./Синод., 6:26) в базе нет — переводится
# один телец; 6:27 в базе τρεῖς καὶ δέκα (13), у слав./Синод. — десять.
# Сносок ⟨…⟩ нет: 祭壇, 燔祭, 聖なる木立 уже пояснены в корпусе; エルバアル — имя.
# 6:11 и 6:24: ἐν Εφραθα — город Офра (евр. עָפְרָה), オフラ; греч. форма та же,
# что у Ефрафы (Быт 35:16), но это другое место.
# jp-ni не использовался.

