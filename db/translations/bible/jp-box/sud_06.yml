verses:
  1: "イスラエルの子[こ]らは主[しゅ]の目[め]に悪[あく]を行[おこな]った。主は彼[かれ]らを七年[ななねん]の間[あいだ]、ミディアンの手[て]に渡[わた]された。"
  2: "ミディアンの手[て]はイスラエルに対[たい]して強[つよ]くなった。イスラエルの子[こ]らは、ミディアンを避[さ]けて、山々[やまやま]や洞窟[どうくつ]、砦[とりで]の中[なか]に、自分[じぶん]たちのために囲[かこ]いを作[つく]った。"
  3: "イスラエルの人[ひと]が種[たね]を蒔[ま]くたびに、ミディアンとアマレクと東[ひがし]の民[たみ]が上[のぼ]って来[き]て、彼[かれ]に向[む]かって攻[せ]め上[のぼ]った。"
  4: "彼[かれ]らはイスラエルに対[たい]して陣[じん]を張[は]って、ガザに至[いた]るまで地[ち]の産物[さんぶつ]を滅[ほろ]ぼし、イスラエルには、羊[ひつじ]も、子牛[こうし]も、ろばも、命[いのち]をつなぐものを何[なに]も残[のこ]さなかった。"
  5: "彼[かれ]らは家畜[かちく]も伴[とも]って上[のぼ]って来[き]、自分[じぶん]たちの天幕[てんまく]を携[たずさ]えて来た。彼らは数[かず]の多[おお]さでは蝗[いなご]のように来た。彼らにも、そのらくだにも、数がなかった。彼らはイスラエルの地[ち]に、それを滅[ほろ]ぼすために来た。"
  6: "イスラエルはミディアンのゆえに、ひどく貧[まず]しくなった。イスラエルの子[こ]らは主[しゅ]に叫[さけ]び求[もと]めた。"
  7: "イスラエルの子[こ]らがミディアンのゆえに主[しゅ]に叫[さけ]び求[もと]めると、"
  8: "主[しゅ]はイスラエルの子[こ]らに、一人[ひとり]の預言者[よげんしゃ]を遣[つか]わし、彼[かれ]らに言[い]われた。「イスラエルの神[かみ]である主[しゅ]はこう言[い]われる。わたしはあなたがたをエジプトから上[のぼ]らせた者[もの]、あなたがたを奴隷[どれい]の家[いえ]から導[みちび]き出[だ]した者である。"
  9: "わたしはあなたがたをエジプトの手[て]から、またあなたがたを苦[くる]しめるすべての者[もの]の手から救[すく]い出[だ]し、彼[かれ]らをあなたがたの前[まえ]から追[お]い出[だ]して、その地[ち]をあなたがたに与[あた]えた。"
  10: "そしてあなたがたに言[い]った。『わたしはあなたがたの神[かみ]、主[しゅ]である。あなたがたがその地[ち]に住[す]んでいるアモリ人[じん]の神々[かみがみ]を恐[おそ]れてはならない。』しかし、あなたがたはわたしの声[こえ]に聞[き]き従[したが]わなかった。」"
  11: "主[しゅ]の使[つか]いが来[き]て、アビエゼルの父[ちち]ヨアシュのものである、オフラの樫[かし]の木[き]の下[した]に座[すわ]った。その子[こ]ギデオンは、ミディアンを避[さ]けるために、ぶどう搾[しぼ]り場[ば]で小麦[こむぎ]を打[う]っていた。"
  12: "主[しゅ]の使[つか]いが彼[かれ]に現[あらわ]れて言[い]った。「主[しゅ]はあなたとともにいる、力[ちから]ある者[もの]よ。」"
  13: "ギデオンは彼[かれ]に言[い]った。「主[しゅ]よ、もし主がわたしたちとともにおられるのなら、なぜ、これらすべての災[わざわ]いがわたしたちに降[ふ]りかかったのですか。父[ちち]たちがわたしたちに語[かた]ってくれた、あのもろもろの奇[き]跡[せき]はどこにあるのですか。父たちは、『主[しゅ]はわたしたちをエジプトから上[のぼ]らせなかったか』と言[い]いました。そして今、主はわたしたちを退[しりぞ]け、ミディアンの手[て]に渡[わた]されたのです。」"
  14: "主[しゅ]の使[つか]いは彼[かれ]を見[み]つめて言[い]った。「あなたのその力[ちから]で行[い]き、イスラエルを救[すく]え。見[み]よ、わたしがあなたを遣[つか]わした。」"
  15: "ギデオンは彼[かれ]に言[い]った。「主[しゅ]よ、わたしは何[なに]をもってイスラエルを救[すく]えるのでしょうか。見[み]よ、わたしの氏族[しぞく]はマナセのうちで最[もっと]も弱[よわ]く、わたしは父[ちち]の家[いえ]で最も小[ちい]さい者[もの]です。」"
  16: "主[しゅ]の使[つか]いは彼[かれ]に言[い]った。「主[しゅ]があなたとともにいてくださる。あなたはミディアンを、あたかも一人[ひとり]の者[もの]であるかのように打[う]ち倒[たお]す。」"
  17: "ギデオンは彼[かれ]に言[い]った。「もしわたしがあなたの目[め]にかなうなら、わたしと語[かた]っているのがあなたであるというしるしを、わたしに示[しめ]してください。"
  18: "どうか、ここを離[はな]れずに、わたしがあなたのところへ戻[もど]り、わたしの犠牲[ぎせい]を持[も]って来[き]て、あなたの前[まえ]に供[そな]えるまで、お待[ま]ちください。」彼[かれ]は言[い]った。「わたしは、あなたが戻るまで待[ま]とう。」"
  19: "ギデオンは入[はい]って行[い]き、山羊[やぎ]の子[こ]と、小麦粉[こむぎこ]一[いち]エファでパン種[ぱんだね]のないパンを作[つく]り、肉[にく]を籠[かご]に入[い]れ、煮汁[にじる]を壺[つぼ]に注[そそ]いで、樫[かし]の木[き]の下[した]にいる彼[かれ]のもとへ持[も]って来[き]て、ひれ伏[ふ]した。"
  20: "主[しゅ]の使[つか]いは彼[かれ]に言[い]った。「肉[にく]とパン種[ぱんだね]のないパンを取[と]り、あの岩[いわ]の上[うえ]に置[お]き、煮汁[にじる]を注[そそ]ぎなさい。」彼[かれ]はそのとおりに行[おこな]った。"
  21: "主[しゅ]の使[つか]いは手[て]の杖[つえ]を差[さ]し伸[の]べ、その先[さき]で肉[にく]とパン種[ぱんだね]のないパンに触[ふ]れた。すると、岩[いわ]から火[ひ]が噴[ふ]き出[で]、二[ふた]つとも焼[や]き尽[つ]くされた。主[しゅ]の使[つか]いは彼[かれ]の視界[しかい]から消[き]えた。"
  22: "ギデオンは、これが主[しゅ]の使[つか]いであることを知[し]って言[い]った。「ああ、主[しゅ]よ、主[しゅ]よ。わたしは主[しゅ]の使[つか]いを顔[かお]と顔を合[あ]わせて見[み]てしまいました。」"
  23: "主[しゅ]は彼[かれ]に言[い]われた。「あなたに平和[へいわ]があるように。恐[おそ]れるな。あなたは死[し]なない。」"
  24: "ギデオンはそこに主[しゅ]のために祭壇[さいだん]を築[きず]き、それを「主[しゅ]は平和[へいわ]」と名[な]づけた。それは今日[こんにち]まで、エズリの父[ちち]のオフラにある。"
  25: "その夜[よる]、主[しゅ]は彼[かれ]に言[い]われた。「父[ちち]が肥[こ]やしている七歳[ななさい]の子牛[こうし]を連[つ]れて来[き]て、父[ちち]のバアルの祭壇[さいだん]を打[う]ち壊[こわ]し、そのそばの聖[せい]なる木立[こだち]を切[き]り倒[たお]せ。"
  26: "そして、あなたに現[あらわ]れたあなたの神[かみ]である主[しゅ]のために、このマオズの山[やま]の頂[いただき]に、しかるべき配置[はいち]をもって祭壇[さいだん]を築[きず]き、その子牛[こうし]を取[と]って、あなたが切[き]り倒[たお]す聖[せい]なる木立[こだち]の木[き]で燔祭[はんさい]をささげよ。」"
  27: "ギデオンは自分[じぶん]の僕[しもべ]たちのうちから十三人[じゅうさんにん]を連[つ]れて行[い]き、主[しゅ]が彼[かれ]に語[かた]られたとおりに行[おこな]った。彼[かれ]は、父[ちち]の家[いえ]の者[もの]たちや町[まち]の人々[ひとびと]を恐[おそ]れて昼[ひる]に行[おこな]うことができなかったので、夜[よる]に行[おこな]った。"
  28: "町[まち]の人々[ひとびと]は朝[あさ]早[はや]く起[お]きた。すると見[み]よ、バアルの祭壇[さいだん]は壊[こわ]され、そのそばの聖[せい]なる木立[こだち]は切[き]り倒[たお]され、肥[こ]えた子牛[こうし]は、新[あら]たに築[きず]かれた祭壇[さいだん]の上[うえ]で燔祭[はんさい]としてささげられていた。"
  29: "人々[ひとびと]は互[たが]いに言[い]った。「だれがこのことをしたのか。」彼[かれ]らは尋[たず]ね、探[さが]し求[もと]めて言[い]った。「ヨアシュの子[こ]ギデオンがこのことをした。」"
  30: "町[まち]の人々[ひとびと]はヨアシュに言[い]った。「あなたの子[こ]を引[ひ]き出[だ]せ。彼[かれ]は死[し]ぬべきである。バアルの祭壇[さいだん]を壊[こわ]し、そのそばの聖[せい]なる木立[こだち]を切[き]り倒[たお]したからである。」"
  31: "ヨアシュは、彼[かれ]に立[た]ち向[む]かっている者[もの]たちに言[い]った。「あなたがたは今、バアルのために裁[さば]きを行[おこな]うのか。あなたがたが彼[かれ]を救[すく]うのか。彼[かれ]のために争[あらそ]う者[もの]は、朝[あさ]までに死[し]ぬ。もし彼[かれ]が神[かみ]なら、自分[じぶん]の祭壇[さいだん]を壊[こわ]した者[もの]に、自分[じぶん]で復讐[ふくしゅう]するだろう。」"
  32: "その日[ひ]、彼[かれ]を〔エルバアル、すなわち〕「バアルの裁[さば]き」と名[な]づけた。彼[かれ]がバアルの祭壇[さいだん]を壊[こわ]したからである。"
  33: "ミディアンとアマレクと東[ひがし]の民[たみ]は皆[みな]、一[ひと]つに集[あつ]まって川[かわ]を渡[わた]り、イズレエルの谷[たに]に陣[じん]を張[は]った。"
  34: "神[かみ]の霊[れい]がギデオンを包[つつ]み、彼[かれ]は角笛[つのぶえ]を吹[ふ]き鳴[な]らした。アビエゼルは彼[かれ]の後[あと]に呼[よ]び集[あつ]められた。"
  35: "彼[かれ]はマナセ全[ぜん]域[いき]に使者[ししゃ]たちを遣[つか]わし、彼[かれ]らは彼[かれ]の後[あと]に呼[よ]び集[あつ]められた。また、アシェル、ゼブルン、ネフタリに使者[ししゃ]たちを遣わすと、彼[かれ]らは上[のぼ]って来[き]て彼[かれ]に合流[ごうりゅう]した。"
  36: "ギデオンは神[かみ]に言[い]った。「もし、あなたが語[かた]られたとおり、この手[て]でイスラエルを救[すく]ってくださるのなら、"
  37: "見[み]よ、わたしは脱穀場[だっこくじょう]に羊[ひつじ]の毛[け]を置[お]きます。もし毛[け]にだけ露[つゆ]が降[お]りて、地[ち]がすべて乾[かわ]いていれば、あなたが語[かた]られたとおり、この手[て]でイスラエルを救[すく]ってくださることを知[し]りましょう。」"
  38: "そのとおりになった。ギデオンは翌日[よくじつ]早[はや]く起[お]きて羊[ひつじ]の毛[け]を絞[しぼ]ると、露[つゆ]が毛[け]から流[なが]れ出[で]て、鉢[はち]を満[み]たした。"
  39: "ギデオンは神[かみ]に言[い]った。「わたしに対して怒[いか]りを燃[も]やさないでください。もう一度[いちど]だけ言[い]います。もう一度だけ毛[け]で試[こころ]みます。どうか、毛にだけ乾[かわ]きが来[き]て、地[ち]にはすべて露[つゆ]が降[お]りますように。」"
  40: "神[かみ]はその夜[よる]、そのとおりに行[おこな]われた。毛[け]にだけ乾[かわ]きが来[き]て、地[ち]にはすべて露[つゆ]が降[お]りた。"

notes:
  1: "ἐποίησαν τὸ πονηρόν — сделали злое; ἔναντι κυρίου — пред Господом (слав. «пред Господем»). παρέδωκεν αὐτοὺς ἐν χειρὶ Μαδιαμ — предал их в руку Мадиама (Μαδιαμ — народ и страна; ミディアン). ἔτη ἑπτά — семь лет (ἑπτά)."
  2: "κατίσχυσεν χεὶρ Μαδιαμ — укрепилась рука Мадиама (κατισχύω). ἀπὸ προσώπου Μαδιαμ — от лица Мадиама, т.е. спасаясь от него. μάνδραι — загоны, ограды (μάνδρα; слав. «ограды»), 囲い. σπήλαια — пещеры; ὀχυρώματα — укрепления, 砦. jp-joc передаёт только первую половину стиха."
  3: "ὅταν ἔσπειρεν ἀνὴρ Ισραηλ — когда сеял человек Израиля (σπείρω). ἀνέβαινεν — поднимался (ἀναβαίνω; повтор ἀνέβαινον сохранён). Αμαληκ — Амалик (アマレク). οἱ υἱοὶ ἀνατολῶν — сыны востока (ἀνατολή)."
  4: "παρενέβαλλον ἐπ᾿ αὐτούς — становились станом против них (παρεμβάλλω). ἐκφόρια τῆς γῆς — произведения земли (ἐκφόριον). ἕως τοῦ ἐλθεῖν εἰς Γάζαν — до прихода в Газу (Γαζα). ὑπόστασιν ζωῆς — «средство к жизни» (ὑπόστασις), 命をつなぐもの. ποίμνιον, μόσχος, ὄνος — мелкий скот, телёнок, осёл; в слав. «стад и телца и осла»."
  5: "τὰ κτήνη αὐτῶν — скот их (κτῆνος). παρέφερον — приносили с собой (παραφέρω). ὡς ἀκρίς εἰς πλῆθος — как саранча по множеству (ἀκρίς, πλῆθος). κάμηλοι — верблюды. οὐκ ἦν ἀριθμός — не было числа. τοῦ διαφθεῖρειν αὐτήν — чтобы губить её (διαφθείρω)."
  6: "ἐπτώχευσεν σφόδρα — обнищал весьма (πτωχεύω). ἀπὸ προσώπου Μαδιαμ — от Мадиама. ἐκέκραξαν πρὸς κύριον — возопили к Господу (κράζω). В слав. стих обрывается на «от лица мадиамля», без вопля; в базе вопль есть."
  7: "ἐγένετο ἐπεί — «было, когда» (ἐπεί). διὰ Μαδιαμ — из-за Мидиана. Стих — придаточное, главное предложение в ст. 8; jp-joc передаёт только «воззвали к Богу»."
  8: "ἐξαπέστειλεν … ἄνδρα προφήτην — послал мужа-пророка (ἀποστέλλω). Τάδε λέγει κύριος ὁ θεὸς Ισραηλ — «так говорит Господь Бог Израиля». ὁ ἀναβιβάσας ὑμᾶς ἐξ Αἰγύπτου — возведший вас из Египта (ἀναβιβάζω). οἶκος δουλείας — дом рабства. Речь пророка — 「…」 до конца ст. 10."
  9: "ἐξειλάμην — избавил (ἐξαιρέω). ἐκ χειρὸς πάντων τῶν θλιβόντων ὑμᾶς — из руки всех угнетающих вас (θλίβω). ἐξέβαλον — изгнал (ἐκβάλλω). ἔδωκα ὑμῖν τὴν γῆν αὐτῶν — дал вам землю их."
  10: "οὐ φοβηθήσεσθε — не убоитесь (будущее в значении запрета). τοὺς θεοὺς τοῦ Αμορραίου — богов Аморрея (собир.; アモリ人). ἐν οἷς ὑμεῖς ἐνοικεῖτε ἐν τῇ γῇ αὐτῶν — «в которых вы живёте на земле их» (слав. «в нихже… в земли их»). οὐκ εἰσηκούσατε τῆς φωνῆς μου — не послушали голоса Моего. Слова Бога внутри речи пророка — 『…』."
  11: "ἄγγελος κυρίου — 主の使い (ангел; не «посланник»). ἐκάθισεν ὑπὸ τὴν δρῦν — сел под дуб (δρῦς, 樫の木). τὴν οὖσαν ἐν Εφραθα — что в Ефрафе (LXX; это город Офра, евр. עָפְרָה; в японской традиции オフラ, так и передано; греч. форма Εφραθα совпадает с Ефрафой Быт 35:16 — это разные места). τοῦ Ιωας πατρὸς Αβιεζρι — Иоаса, отца Авиезера. ἐρράβδιζεν πυρούς — выбивал пшеницу палкой (ῥαβδίζω; πυρός — пшеница). ληνός — точило, ぶどう搾り場. τοῦ ἐκφυγεῖν ἀπὸ προσώπου Μαδιαμ — чтобы убежать от Мадиама (ἐκφεύγω)."
  12: "ὤφθη αὐτῷ — явился ему (ὁράω, pass.). Κύριος μετὰ σοῦ — Господь с тобою. δυνατὸς τῇ ἰσχύι — «сильный крепостью» (ἰσχύς), 力ある者."
  13: "Ἐν ἐμοί, κύριε — букв. «во мне, Господи», гебраизм-мольба («прошу, Господи»); слав. «во мне, Господи мой», Синод. «господин мой!». εἰ ἔστιν κύριος μεθ᾽ ἡμῶν — если Господь с нами. ἵνα τί εὗρεν ἡμᾶς — почему нашло нас. θαυμάσια — чудеса (θαυμάσιος). διηγήσαντο — рассказали (διηγέομαι). Слова отцов — 『…』. ἀπώσατο — отринул (ἀπωθέω)."
  14: "ἐπέβλεψεν — воззрел (ἐπιβλέπω). Πορεύου ἐν τῇ ἰσχύι σου — иди в силе твоей. σώσεις τὸν Ισραηλ — спасёшь Израиля (σῴζω). ἰδοὺ ἐξαπέστειλά σε — вот, Я послал тебя."
  15: "ἐν τίνι σώσω — чем спасу (ἐν τίνι — «чем, каким средством»). ἡ χιλιάς μου — «тысяча моя», т.е. род, клан (χιλιάς). ταπεινοτέρα ἐν Μανασση — нижайшая в Манассии (ταπεινός), 最も弱い. μικρὸς ἐν τῷ οἴκῳ τοῦ πατρός μου — малый в доме отца моего."
  16: "Κύριος ἔσται μετὰ σοῦ — Господь будет с тобою. πατάξεις τὴν Μαδιαμ — поразишь Мадиама (πατάσσω). ὡσεὶ ἄνδρα ἕνα — как одного человека (слав. «яко мужа единаго»)."
  17: "εὗρον χάριν ἐν ὀφθαλμοῖς σου — обрёл благодать в очах твоих (χάρις). ποιήσεις μοι σημεῖον — сделай мне знамение (будущее в значении повеления; слав. «да сотвориши»). ὅτι σὺ λαλεῖς μετ᾽ ἐμοῦ — что ты говоришь со мною."
  18: "μὴ κινηθῇς ἐντεῦθεν — не двинься отсюда (κινέω). ἕως τοῦ ἐλθεῖν με πρὸς σέ — пока я не приду к тебе. θυσία — жертва, 犠牲. θήσω ἐνώπιόν σου — положу пред тобою. Ἐγώ εἰμι καθῆσομαι — «Я есмь, останусь» (слав. «аз есмь, премедлю»), передано «わたしは…待とう»."
  19: "ἔριφον αἰγῶν — козлёнка из коз (ἔριφος). οἶφι ἀλεύρου — ефа муки (οἶφι — мера; слав. «четверть ифи»). ἄζυμα — пресное, パン種のないパン. κανοῦν — корзина, 籠. ζωμός — похлёбка, 煮汁. χύτρα — горшок, 壺. προσεκύνησεν — поклонился, пал ниц (προσκυνέω)."
  20: "Λαβέ — возьми (императив λαμβάνω). ἄρτοι ἄζυμοι — опресноки. θὲς πρὸς τὴν πέτραν — положи у скалы (τίθημι). ἔκχεον — вылей (ἐκχέω). ἐποίησεν οὕτως — сделал так."
  21: "ἐξέτεινεν τὸ ἄκρον τῆς ῥάβδου — простёр конец жезла (ῥάβδος). ἥψατο — коснулся (ἅπτω). ἀνήφθη πῦρ ἐκ τῆς πέτρας — возгорелся огонь из скалы (ἀνάπτω). κατέφαγεν — пожрал (κατεσθίω). ἀπῆλθεν ἐξ ὀφθαλμῶν αὐτοῦ — ушёл от очей его."
  22: "Ἆ ἆ — возглас ужаса («ах, ах»). κύριε κύριε — Господи, Господи (двойное обращение). πρόσωπον πρὸς πρόσωπον — лицом к лицу. ὅτι εἶδον — «что я видел» (причина ужаса)."
  23: "Εἰρήνη σοι — мир тебе (εἰρήνη), 平和. μὴ φοβοῦ — не бойся. μὴ ἀποθάνῃς — «не умрёшь» (μὴ с аористом сослагательного в уверении/запрете; слав. «не умреши»)."
  24: "ᾠκοδόμησεν θυσιαστήριον τῷ κυρίῳ — построил жертвенник Господу. ἐκάλεσεν αὐτὸ Εἰρήνη κυρίου — назвал его «Мир Господень» (букв.; евр. «Яхве-Шалом»; по брифу — 主は平和). ἕως τῆς ἡμέρας ταύτης — до сего дня. ἔτι αὐτοῦ ὄντος — «пока он ещё [там]» (gen. abs.; αὐτός — жертвенник). ἐν Εφραθα πατρὸς τοῦ Εζρι — в Офре отца Езри (греч. Εφραθα; см. 6:11); jp-joc кончается раньше."
  25: "ἐγενήθη τῇ νυκτὶ ἐκείνῃ — было в ту ночь. μόσχον τὸν σιτευτόν — откормленного тельца (σιτευτός). μόσχον τὸν ἑπταετῆ — тельца семилетнего (приложение к первому; слав. «и телца втораго» — два тельца, в гр. один). καθελεῖς — разрушишь (καθαιρέω). ἄλσος — священная роща, столб Ашеры (聖なる木立; ср. Втор 7:5). ἐκκόψεις — срубишь (ἐκκόπτω). Речь Господа продолжается в ст. 26."
  26: "οἰκοδομήσεις — построишь. τῷ ὀφθέντι σοι — явившемуся тебе (ὁράω). ἐπὶ τῆς κορυφῆς τοῦ ὄρους Μαωζ — на вершине горы Маоз (Μαωζ — тёмное; слав. «на верху (горы) маози», Синод. «на вершине скалы сей»), マオズ. ἐν τῇ παρατάξει — «в строю, порядке» (παράταξις; слав. «во предчинии»), смысл тёмен; しかるべき配置. ὁλοκαύτωμα — 燔祭. ἐν τοῖς ξύλοις τοῦ ἄλσους — на дровах рощи."
  27: "τρεῖς καὶ δέκα — тринадцать (13); слав. и Синод. читают «десять» — расхождение с базой, в тексте 十三人. δοῦλοι — рабы, 僕. καθὰ ἐλάλησεν — как сказал. ἐφοβήθη … μὴ ποιῆσαι ἡμέρας — побоялся сделать днём. νυκτός — ночью."
  28: "ὤρθρισαν τὸ πρωί — встали рано утром (ὀρθρίζω). κατεσκαμμένον — разрушен (κατασκάπτω). ἐκκεκομμένον — срублен (ἐκκόπτω). ἀνηνεγμένος εἰς ὁλοκαύτωμα — принесён во всесожжение (ἀναφέρω). τὸ ᾠκοδομημένον — построенный (новый)."
  29: "ἀνὴρ πρὸς τὸν πλησίον αὐτοῦ — человек к ближнему своему. ἀνήταζον — допрашивали (ἀνετάζω). ἐξεζήτουν — разыскивали (ἐκζητέω). εἶπαν — сказали."
  30: "Ἐξάγαγε — выведи (ἐξάγω). ἀποθανέτω — да умрёт (императив 3 л.). κατέσκαψεν — разрушил. ἔκοψεν — срубил."
  31: "τοὺς ἑσταμένους ἐπ᾽ αὐτόν — стоящих против него (ἵστημι). Μὴ ὑμεῖς δικάζεσθε περὶ τοῦ Βααλ; — «не вы ли судитесь о Ваале?» (δικάζω). σῴζετε — спасаете. ὃς ἀντεδίκησεν αὐτόν — кто вступится за него (ἀντιδικέω). ἕως πρωί — до утра. ἐκδικήσει — отомстит (ἐκδικέω)."
  32: "ἐκάλεσεν αὐτὸ … Δικαστήριον τοῦ Βααλ — назвал его «Судом (судилищем) Ваала» (δικαστήριον); LXX переводит имя, а не транслитерирует. Слав. и Синод. читают «Иероваал»; в 7:1 база уже даёт Ιεροβααλ (エルバアル). Имя из церковного чтения — в 〔…〕 (проверено: ιεροβααλ — НЕТ)."
  33: "συνήχθησαν ἐπὶ τὸ αὐτό — собрались вместе. διέβησαν — перешли (подразумевается река; слав. «преидоша (реку)»). παρενέβαλον ἐν τῇ κοιλάδι Ιεζραελ — стали станом в долине Изреель (イズレエル)."
  34: "πνεῦμα θεοῦ ἐνέδυσεν τὸν Γεδεων — «Дух Божий облёк Гедеона» (ἐνδύω — облечь), 神の霊 (не 聖霊). ἐσάλπισεν ἐν κερατίνῃ — затрубил в рог (σαλπίζω, κερατίνη), 角笛. ἐβόησεν Αβιεζερ ὀπίσω αὐτοῦ — воззвал Авиезер за ним (созвал род)."
  35: "ἀγγέλους — здесь «послы, вестники» (ἄγγελος). ἐν παντὶ Μανασση — по всей Манассии. ἐβόησεν καὶ αὐτὸς ὀπίσω αὐτοῦ — и сам [Манассия] отозвался за ним. εἰς συνάντησιν αὐτοῦ — навстречу ему."
  36: "Εἰ σῴζεις ἐν τῇ χειρί μου τὸν Ισραηλ — если спасаешь рукою моею Израиля (σῴζω). ὃν τρόπον ἐλάλησας — как Ты сказал. Молитва продолжается в ст. 37."
  37: "ἀπερείδομαι τὸν πόκον τῶν ἐρίων — «кладу, опираю руно шерсти» (ἀπερείδω; πόκος — руно, 羊の毛). ἅλων — гумно, 脱穀場. δρόσος — роса. ξηρασία — сухость, засуха. γνώσομαι — узнаю. Повтор «как сказал» сохранён."
  38: "ὤρθρισεν τῇ ἐπαύριον — встал рано на другой день (ἐπαύριον). ἀπεπίασεν τὸν πόκον — выжал руно (ἀποπιάζω). ἀπερρύη — вытекла (ἀπορρέω). λεκάνη ὕδατος — чаша воды (λεκάνη), 鉢."
  39: "Μὴ ὀργισθήτω ὁ θυμός σου ἐν ἐμοί — да не прогневается ярость Твоя на меня (ὀργίζομαι; θυμός). ἔτι ἅπαξ — ещё однажды. πειράσω — испытаю (πειράζω). γενηθήτω — да будет (γίνομαι). ξηρασία… δρόσος — сухость… роса."
  40: "ἐποίησεν ὁ θεὸς οὕτως — сделал Бог так. ἐν τῇ νυκτὶ ἐκείνῃ — в ту ночь. ἐγένετο ξηρασία ἐπὶ τὸν πόκον μόνον — сухость только на руне. ἐπὶ δὲ πᾶσαν τὴν γῆν ἐγένετο δρόσος — а на всей земле была роса. Здесь ὁ θεός — Бог (не 主)."
