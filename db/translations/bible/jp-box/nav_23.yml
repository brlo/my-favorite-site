verses:
  1: "主[しゅ]がイスラエルを、周[まわ]りにあるすべての敵[てき]から休[やす]ませられてから、多[おお]くの年月[としつき]が過[す]ぎた。ヨシュアは年老[としお]い、日[ひ]を重[かさ]ねていた。"
  2: "ヨシュアはイスラエルのすべての子[こ]らと、その長老[ちょうろう]たち、その首長[しゅちょう]たち、その書記[しょき]たち、その裁[さば]き人[びと]たちを呼[よ]び集[あつ]め、彼[かれ]らに言[い]った。「わたしは年老[としお]い、日[ひ]を重[かさ]ねた。"
  3: "あなたがたは、あなたがたの神[かみ]であられる主[しゅ]が、これらのすべての民[たみ]に対して、あなたがたの前[まえ]でなさったことをすべて見[み]た。あなたがたの神であられる主が、あなたがたのために戦[たたか]われたからである。"
  4: "見[み]よ、あなたがたに残[のこ]されたこれらの民[たみ]を、わたしはくじによってあなたがたの部族[ぶぞく]に嗣業[しぎょう]として割[わ]り当[あ]てた。ヨルダン川[がわ]から、わたしが滅[ほろ]ぼしたすべての民の地[ち]に至[いた]るまで、また大[おお]きな海[うみ]から日[ひ]の沈[しず]む方[ほう]までが、あなたがたの境界[きょうかい]となる。"
  5: "あなたがたの神[かみ]であられる主[しゅ]は、彼[かれ]らが滅[ほろ]びるまで、彼らをあなたがたの前[まえ]から滅ぼされる。また、彼らとその王[おう]たちをあなたがたの前から滅ぼし尽[つ]くすまで、彼らに野[の]の獣[けもの]を送[おく]られる。あなたがたは彼らの地[ち]を嗣業[しぎょう]として受[う]け継[つ]ぎなさい。あなたがたの神であられる主があなたがたに語[かた]られたとおりである。"
  6: "だから、あなたがたは大[おお]いに強[つよ]くあって、モーセの律法[りっぽう]の書[しょ]に書[か]かれているすべてのことを守[まも]り行[おこな]いなさい。右[みぎ]にも左[ひだり]にも曲[ま]がらないためである。"
  7: "これらの残[のこ]された民[たみ]の間[あいだ]に入[はい]ってはならない。彼らの神々[かみがみ]の名[な]は、あなたがたのうちで口[くち]にされてはならない。それらに伏[ふ]し拝[おが]んではならない。それらに仕[つか]えてはならない。"
  8: "ただ、あなたがたの神[かみ]であられる主[しゅ]に寄[より]り添[そ]いなさい。今日[きょう]に至[いた]るまで、あなたがたがしてきたとおりである。"
  9: "主[しゅ]はあなたがたの前[まえ]から、大[おお]きく強[つよ]い民[たみ]をいくつも滅[ほろ]ぼされた。今日[きょう]に至るまで、あなたがたの前[まえ]に立[た]ち向[む]かった者[もの]は一人[ひとり]もいなかった。"
  10: "あなたがたのうちの一人[ひとり]が千[せん]人[にん]を追[お]い払[はら]った。あなたがたの神[かみ]であられる主[しゅ]が、あなたがたに言[い]われたとおり、あなたがたのために戦[たたか]われたからである。"
  11: "あなたがたの神[かみ]であられる主[しゅ]を愛[あい]するよう、大[おお]いに心[こころ]を配[くば]りなさい。"
  12: "もしあなたがたが背[そむ]いて、あなたがたの間[あいだ]に残[のこ]っているこれらの民[たみ]に加[くわ]わり、彼らと婚姻[こんいん]の関係[かんけい]を結[むす]び、彼らと混[ま]じり合[あ]い、彼らもあなたがたと混じり合うなら、"
  13: "知[し]っておきなさい。主[しゅ]はもはや、これらの民[たみ]をあなたがたの前[まえ]から滅[ほろ]ぼし尽[つ]くされることはない。彼らはあなたがたにとって罠[わな]となり、つまずきとなり、あなたがたのかかとに刺[さ]さる釘[くぎ]となり、あなたがたの目[め]に刺さる矢[や]となる。それは、あなたがたが、あなたがたの神[かみ]であられる主があなたがたに与[あた]えたこの良[よ]い地[ち]から滅[ほろ]び去[さ]るまでである。"
  14: "わたしは今[いま]、地[ち]の上[うえ]のすべての者[もの]と同じく、その道[みち]を行[い]く。あなたがたは心[こころ]と魂[たましい]をもって知[し]るであろう。あなたがたの神[かみ]であられる主が、あなたがたに関[かか]わるすべてのことについて語[かた]られたすべての言葉[ことば]のうち、一[ひと]つとして落[お]ちなかった。そのうちの一つも食[たが]わなかった。"
  15: "そして、主[しゅ]があなたがたに語[かた]られたすべての良[よ]い言葉[ことば]があなたがたの上[うえ]に臨[のぞ]んだように、主なる神[かみ]も、あなたがたが、主があなたがたに与[あた]えたこの良い地[ち]から滅[ほろ]び去[さ]るまで、あなたがたの上にすべての悪[わる]い言葉を下[くだ]される。"
  16: "それは、あなたがたが、あなたがたの神[かみ]であられる主[しゅ]の契約[けいやく]を、すなわち主があなたがたに命[めい]じられた契約を破[やぶ]り、行[い]って他[ほか]の神々[かみがみ]に仕[つか]え、それらに伏[ふ]し拝[おが]むからである。」"

notes:
  1: "μεθ᾽ ἡμέρας πλείους — через много дней, спустя много времени. καταπαῦσαι — успокоить (καταπαύω); слав. «упокои». κυκλόθεν — вокруг, со всех сторон. πρεσβύτερος προβεβηκὼς ταῖς ἡμέραις — «старый, продвинувшийся днями», т. е. в преклонных летах; слав. «состареся прошед дни»."
  2: "συνεκάλεσεν — созвал. γερουσία — совет старейшин (長老). ἄρχοντες — начальники (首長). γραμματεῖς — писцы, книжники (書記); в csl «книгочия». δικασταί — судьи (裁き人). γεγήρακα καὶ προβέβηκα — состарился и продвинулся (perfect). С этого стиха до конца главы — речь Иисуса 「…」."
  3: "ἑωράκατε — вы видели (perfect с настоящим значением). ἐκπολεμήσας — «воевавший» (ἐκπολεμέω), слав. «споборствовавый». В csl «Бог наш … нам», в gr — «Бог ваш … вам»."
  4: "ἐπέρριφα — поверг, бросил (ἐπιρρίπτω); здесь «отдал по жребию». τὰ καταλελειμμένα — оставленные. ἐν τοῖς κλήροις εἰς τὰς φυλάς — по жребиям для колен. ὁριεῖ ἐπὶ δυσμὰς ἡλίου — «определит к западу солнца», т. е. будет границей на запад; слав. «еже определит на запад солнца»."
  5: "ἐξολεθρεύσει — истребит. ἕως ἂν ἀπόλωνται — доколе не погибнут. θηρία ἄγρια — дикие звери (в ru этого нет). κατακληρονομήσατε — наследуйте (императив). καθὰ ἐλάλησεν — как сказал."
  6: "κατισχύσατε σφόδρα — «укрепитесь весьма» (κατισχύω). φυλάσσειν καὶ ποιεῖν — хранить и исполнять. ἐκκλίνητε εἰς δεξιὰν ἢ εὐώνυμα — уклониться направо или налево."
  7: "ὅπως μή — чтобы не. ὀνομασθήσεται ἐν ὑμῖν — не будет называться среди вас. В csl добавлено «ниже да кленетеся ими» (не клянитесь ими) — в gr этого нет."
  8: "προσκολληθήσεσθε — прилепитесь (будущее в значении императива). καθάπερ ἐποιήσατε — как вы делали."
  9: "ἐξωλέθρευσεν — истребил (аорист). ἔθνη μεγάλα καὶ ἰσχυρά — народы большие и сильные. οὐθεὶς ἀντέστη — никто не противостал."
  10: "ἐδίωξεν — прогнал (аорист). χιλίους — тысячу. ἐξεπολέμει — воевал за вас (имперфект). καθάπερ εἶπεν — как сказал."
  11: "φυλάξασθε σφόδρα τοῦ ἀγαπᾶν — «весьма берегитесь любить», т. е. всячески старайтесь любить; ср. 6."
  12: "ἀποστραφῆτε — отвратитесь. προσθῆσθε — приложитесь. ἐπιγαμίαι — брачные союзы. συγκαταμιγῆτε — смешаетесь. καὶ αὐτοὶ ὑμῖν — и они вам (незаконченная конструкция, переходит в 13)."
  13: "οὐ μὴ προσθῇ … ἐξολεθρεῦσαι — «не приложит истребить», т. е. больше не будет истреблять. παγίδες — сети, западни. σκάνδαλα — соблазны, преткновения. ἥλοι ἐν πτέρναις — гвозди в пятках. βολίδες — стрелы, дротики. ἕως ἂν ἀπόλησθε — доколе не погибнете."
  14: "ἀποτρέχω — отхожу (ἀποτρέχω, «убегаю»); τὴν ὁδὸν … πάντες οἱ ἐπὶ τῆς γῆς — путь всех на земле. οὐ διέπεσεν — не отпало. οὐ διεφώνησεν — не разногласило, не нарушилось (διαφωνέω)."
  15: "ἥκει — пришли, сбылись (perfect). ἐπάξει — наведёт (ἐπάγω). ῥήματα πονηρά — слова злые. ἧς ἔδωκεν κύριος ὑμῖν — которую дал Господь вам (в csl «Бог ваш»)."
  16: "ἐν τῷ παραβῆναι — «в преступлении» (ἐν τῷ + inf.), по смыслу причины: «за то, что преступите»; слав. «внегда преступите». В gr стих обрывается без аподосиса; csl и ru добавляют «и разгневается яростию Господь на вы, и погибнете скоро от земли благия, юже даде Господь вам» — в текст не внесено."
