# jp-box, Иисус Навин, глава 23. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в гл. 23 отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 23: прощальная речь Иисуса. Вступление: Иисус состарился (1), собрание
# старейшин и начало речи (2), что Бог сделал для Израиля и сделает (3–5),
# увещание хранить закон (6), не сообщаться с оставшимися народами (7–8),
# опыт побед (9–10), заповедь любви к Богу (11), предостережение против браков
# и смешения с народами (12–13), близкая кончина и верность слов Господа (14),
# угроза истребления (15–16).
# Кавычки: 1 — повествование; 2–16 — речь Иисуса 「…」 (глава кончается закрытой
# цитатой). Вложенных слов Бога в этой главе нет, поэтому 『…』 не встречается.
# 〔…〕 нет: csl-добавления («ниже да кленетеся ими» в 7; аподосис «и разгневается
# яростию Господь на вы…» в 16) в gr-lxx-byz отсутствуют и в текст не внесены —
# см. notes. Красного нет.
# Сносок ⟨…⟩ нет: 契約, 嗣業, 部族, 裁き人 уже в корпусе или прозрачны.
# Отличия LXX: 23:3 — в gr «Бог ваш … вам», в csl «Бог наш … нам»; 23:5 — в ru нет
# «пошлёт на них диких зверей»; 23:14 — «отхожу путём всех на земле»; 23:16 —
# в gr нет аподосиса (стих обрывается на придаточном), csl и ru добавляют
# «и разгневается яростию Господь на вы, и погибнете скоро». jp-ni не использовался.

