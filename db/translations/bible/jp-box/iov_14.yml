verses:
  1: "「人[ひと]は女[おんな]から生[う]まれ、短命[たんめい]で、怒[いか]りに満[み]ちている。"
  2: "あるいは、花[はな]のように咲[さ]いては散[ち]り、影[かげ]のように逃[に]げ去[さ]って、とどまることがない。"
  3: "あなたはこの者[もの]のことを問題[もんだい]にし、この者をあなたの前[まえ]の裁[さば]きに入[はい]らせられたではないか。"
  4: "汚[けが]れから清[きよ]い者[もの]が、だれかいるだろうか。いや、だれもいない。"
  5: "たとえ彼[かれ]の生涯[しょうがい]が地[ち]の上[うえ]で一日[いちにち]であっても、彼の月[つき]はあなたのもとで数[かぞ]えられ、あなたは時[とき]を定[さだ]められた。彼はそれを越[こ]えることはない。"
  6: "彼[かれ]から離[はな]れてください。そうすれば彼は静[しず]まり、雇[やと]われ人[びと]のように自分[じぶん]の生涯[しょうがい]を喜[よろこ]んで過[す]ごせる。"
  7: "木[き]には望[のぞ]みがある。たとえ切[き]られても、また芽吹[めぶ]き、その若枝[わかえだ]が絶[た]えることはない。"
  8: "その根[ね]が地[ち]に老[お]いても、その幹[みき]が岩[いわ]の間[あいだ]で枯[か]れても、"
  9: "水[みず]のにおいを感[かん]じるだけで花[はな]を咲[さ]かせ、新[あら]たに植[う]えた木のように実[み]りを結[むす]ぶ。"
  10: "しかし、人[ひと]は死[し]ぬと消[き]え去[さ]り、倒[たお]れた者[もの]は、もはやいない。"
  11: "時[とき]とともに海[うみ]は少[すく]なくなり、川[かわ]は涸[か]れて乾[かわ]き上[あ]がる。"
  12: "天[てん]が縫[ぬ]い合[あ]わされない限り、人[ひと]は眠[ねむ]りにつけば起[お]き上[あ]がることはない。彼[かれ]らが眠りから呼[よ]び覚[さ]まされることはない。"
  13: "ああ、あなたがわたしをよみに隠[かく]し、あなたの怒[いか]りが過[す]ぎ去[さ]るまで、わたしを覆[おお]ってくださるなら。そして、わたしのために時[とき]を定[さだ]め、わたしを思[おも]い起[おこ]してくださるなら。"
  14: "人[ひと]は、自分[じぶん]の生涯[しょうがい]の日々[ひび]を終[お]えて、また生[い]きるのだろうか。わたしは、再[ふたた]び生[う]まれるときまで待[ま]とう。"
  15: "そうすれば、あなたが呼[よ]ばれ、わたしは従[したが]う。あなたはご自分[じぶん]の手[て]のわざを退[しりぞ]けない。"
  16: "あなたはわたしの仕業[しわざ]を数[かぞ]え上[あ]げられ、わたしの罪[つみ]の一つもあなたを過[す]ぎ越[こ]すことはない。"
  17: "あなたはわたしの不法[ふほう]を袋[ふくろ]に封[ふう]じ、わたしが不本意[ふほんい]ながら犯[おか]したことにも印[しるし]を付[つ]けられた。"
  18: "しかし、山[やま]は崩[くず]れて砕[くだ]け、岩[いわ]も古[ふる]びて、その場所[ばしょ]から離[はな]れる。"
  19: "水[みず]は石[いし]を磨[みが]き、水は土[つち]の表面[ひょうめん]を洗[あら]い流[なが]す。あなたは人[ひと]の望[のぞ]みを滅[ほろ]ぼされた。"
  20: "あなたは彼[かれ]を押[お]しやり、ついに彼は去[さ]って行[い]く。あなたは彼の顔[かお]を変[か]え、彼を送[おく]り出[だ]される。"
  21: "その子[こ]らが多[おお]くなっても、彼[かれ]は知[し]らない。少[すく]なくなっても、悟[さと]らない。"
  22: "ただ、彼[かれ]の肉[にく]が痛[いた]み、彼の魂[たましい]が自分[じぶん]のために嘆[なげ]くだけである。」"

notes:
  1: "Иов; продолжение речи (12:2–14:22), глава открывается цитатой без вводной формулы. βροτὸς γεννητὸς γυναικὸς ὀλιγόβιος — «смертный, рожденный от жены, малолетен» (ὀλιγόβιος — «краткодневный»); πλήρης ὀργῆς — «исполнен гнева»; Син. «пресыщен печалями» (по МТ)."
  2: "Иов. ἢ ὥσπερ ἄνθος ἀνθῆσαν ἐξέπεσεν — «или, как цветок процветший, опал» (ἀνθέω — «цвести»; ἐκπίπτω); ἀπέδρα ὥσπερ σκιὰ καὶ οὐ μὴ στῇ — «убежал, как тень, и не устоит» (ἀποδιδράσκω — «убегать»)."
  3: "Иов. οὐχὶ καὶ τούτου λόγον ἐποιήσω — «разве не о нем ты слово сделал» (λόγον ποιεῖσθαι — «обращать внимание, вести дело»); εἰσελθεῖν ἐν κρίματι ἐνώπιόν σου — «войти в суд пред тобой»."
  4: "Иов. τίς γὰρ καθαρὸς ἔσται ἀπὸ ῥύπου — «ибо кто чист будет от скверны» (ῥύπος); ἀλλ᾽ οὐθείς — «но никто». Слав. «никтоже»."
  5: "Иов. ἐὰν καὶ μία ἡμέρα ὁ βίος αὐτοῦ ἐπὶ τῆς γῆς — «если и один день жизнь его на земле»; ἀριθμητοὶ δὲ μῆνες αὐτοῦ παρὰ σοί — «и исчислены месяцы его у тебя» (ἀριθμητός); εἰς χρόνον ἔθου, καὶ οὐ μὴ ὑπερβῇ — «ты положил время, и он не преступит» (ὑπερβαίνω)."
  6: "Иов. ἀπόστα ἀπ᾽ αὐτοῦ, ἵνα ἡσυχάσῃ — «отступи от него, чтобы он успокоился» (ἀφίστημι, ἡσυχάζω); εὐδοκήσῃ τὸν βίον ὥσπερ ὁ μισθωτός — «и был доволен жизнью, как наемник» (εὐδοκέω — «благоволить, быть довольным»; μισθωτός — «наемник»)."
  7: "Иов. ἔστιν γὰρ δένδρῳ ἐλπίς — «ибо есть дереву надежда»; ἐὰν γὰρ ἐκκοπῇ, ἔτι ἐπανθήσει — «если и срублено будет, еще процветет» (ἐκκόπτω, ἐπανθέω); ὁ ῥάδαμνος αὐτοῦ οὐ μὴ ἐκλίπῃ — «и побег его не оскудеет» (ῥάδαμνος — «побег, ветвь»)."
  8: "Иов. ἐὰν γὰρ γηράσῃ ἐν γῇ ἡ ῥίζα αὐτοῦ — «если и состарится в земле корень его» (γηράσκω); ἐν δὲ πέτρᾳ τελευτήσῃ τὸ στέλεχος αὐτοῦ — «и на камне умрет ствол его» (στέλεχος — «ствол»). Условие продолжается в ст. 9."
  9: "Иов. ἀπὸ ὀσμῆς ὕδατος ἀνθήσει — «от запаха воды процветет» (ὀσμή — «запах»); ποιήσει δὲ θερισμὸν ὥσπερ νεόφυτον — «и принесет жатву, как новосажденное» (θερισμός — «жатва»; νεόφυτον — «молодое растение»). Образ сохранён, хотя для дерева «жатва» необычна."
  10: "Иов. ἀνὴρ δὲ τελευτήσας ᾤχετο — «муж же, умерши, ушел» (τελευτάω, οἴχομαι); πεσὼν δὲ βροτὸς οὐκέτι ἔστιν — «и падший смертный уже не существует»."
  11: "Иов. χρόνῳ γὰρ σπανίζεται θάλασσα — «ибо со временем оскудевает море» (σπανίζω — «делаться редким, убывать»); ποταμὸς δὲ ἐρημωθεὶς ἐξηράνθη — «и река, опустев, иссохла» (ἐρημόω, ξηραίνω)."
  12: "Иов. ἄνθρωπος κοιμηθεὶς οὐ μὴ ἀναστῇ — «человек, уснув, не восстанет»; ἕως ἂν ὁ οὐρανὸς οὐ μὴ συρραφῇ — «доколе небо не будет сшито» (συρράπτω — «сшивать»): тёмный образ, сохранён буквально с двойным отрицанием, как в греч. и слав.; οὐκ ἐξυπνισθήσονται ἐξ ὕπνου αὐτῶν — «и не пробудятся от сна своего» (ἐξυπνίζω — «будить»)."
  13: "Иов. εἰ γὰρ ὄφελον ἐν ᾅδῃ με ἐφύλαξας — «о если бы ты сохранил меня в аде» (ὄφελον — частица пожелания); ἕως ἂν παύσηταί σου ἡ ὀργή — «доколе не прекратится гнев твой»; τάξῃ μοι χρόνον, ἐν ᾧ μνείαν μου ποιήσῃ — «назначишь мне время, в которое вспомнишь обо мне» (τάσσω, μνεία)."
  14: "Иов. ἐὰν γὰρ ἀποθάνῃ ἄνθρωπος, ζήσεται — «если умрет человек, будет ли жить» — знаменитый вопрос, в LXX именно вопрос; συντελέσας ἡμέρας τοῦ βίου αὐτοῦ — «окончив дни жизни своей»; ὑπομενῶ, ἕως ἂν πάλιν γένωμαι — «буду ждать, пока снова не стану». Слав. «потерплю, дондеже паки буду»."
  15: "Иов. εἶτα καλέσεις, ἐγὼ δέ σοι ὑπακούσομαι — «тогда позовешь, и я послушаю тебя» (ср. 13:22); τὰ ἔργα τῶν χειρῶν σου μὴ ἀποποιοῦ — «дел рук твоих не отвергай» (ἀποποιέομαι — «отвергать»)."
  16: "Иов. ἠρίθμησας δέ μου τὰ ἐπιτηδεύματα — «и исчислил ты дела мои» (ἐπιτήδευμα — «занятие, дело»); οὐ μὴ παρέλθῃ σε οὐδὲν τῶν ἁμαρτιῶν μου — «и ничто из грехов моих не пройдет мимо тебя» (παρέρχομαι)."
  17: "Иов. ἐσφράγισας τὰς ἀνομίας ἐν βαλλαντίῳ — «запечатал беззакония в мешке» (σφραγίζω, βαλλάντιον — «кошель, мешок»); ἐπεσημηνῶ δέ, εἴ τι ἄκων παρέβην — «и отметил, если что невольно преступил» (σημαίνω — «отмечать»; ἄκων — «невольно»)."
  18: "Иов. καὶ πλὴν ὄρος πῖπτον διαπεσεῖται — «и однако гора, падая, распадется» (διαπίπτω — «рассыпаться»); πέτρα παλαιωθήσεται ἐκ τοῦ τόπου αὐτῆς — «и камень обветшает от места своего» (παλαιόω — «старить»)."
  19: "Иов. λίθους ἐλέαναν ὕδατα — «камни сгладили воды» (λεαίνω — «сглаживать»); κατέκλυσεν ὕδατα ὕπτια τοῦ χώματος τῆς γῆς — «и смыли воды поверхность земной пыли» (κατακλύζω; ὕπτιος — «обращенный вверх»; χῶμα — «насыпь, прах»); ὑπομονὴν ἀνθρώπου ἀπώλεσας — «и терпение человека погубил ты» (ὑπομονή — «ожидание, терпение»; так и слав. «ожидание»)."
  20: "Иов. ὦσας αὐτὸν εἰς τέλος, καὶ ᾤχετο — «ты отринул его до конца, и он ушел» (ὠθέω — «толкать»); ἐπέστησας αὐτῷ τὸ πρόσωπον καὶ ἐξαπέστειλας — букв. «поставил на него лицо и отослал его»: тёмное место; слав. понимает как «изменил еси ему лице» (изменение лица); в тексте по слав., греч. двусмысленно."
  21: "Иов. πολλῶν δὲ γενομένων τῶν υἱῶν αὐτοῦ οὐκ οἶδεν — «если и много станет сыновей его, он не знает»; ἐὰν δὲ ὀλίγοι γένωνται, οὐκ ἐπίσταται — «если же и мало их будет, не разумеет» (ἐπίσταμαι)."
  22: "Иов. ἀλλ᾽ ἢ αἱ σάρκες αὐτοῦ ἤλγησαν — «но только плоть его болела» (ἀλγέω — «болеть»); ἡ δὲ ψυχὴ αὐτοῦ ἐπένθησεν — «и душа его плакала [о себе]» (πενθέω — «плакать, сетовать»); слав. «душа же его о себе сетова». Конец речи Иова: 15:1 — формула Елифаза."
