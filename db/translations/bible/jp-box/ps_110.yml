verses:
  0: "アレルヤ。"
  1: "主[しゅ]よ、わたしは心[こころ]を尽[つ]くしてあなたに感謝[かんしゃ]します。正[ただ]しい者[もの]たちの集[つど]いのうちで、会衆[かいしゅう]のうちで。"
  2: "主[しゅ]のわざは大[おお]きく、その望[のぞ]みのすべてにおいて、詳[くわ]しく調[しら]べられている。"
  3: "そのわざは輝[かがや]きと威[い]厳[げん]に満[み]ち、その義[ぎ]はとこしえに限[かぎ]りなく立[た]ち続[つづ]ける。"
  4: "主[しゅ]はその奇[き]跡[せき]の記[き]念[ねん]を残[のこ]された。主[しゅ]はあわれみ深[ぶか]く、情[なさ]け深[ふか]い方[かた]である。"
  5: "主[しゅ]はご自分[じぶん]を恐[おそ]れる者[もの]たちに食[しょく]べ物[もの]を与[あた]え、とこしえにその契約[けいやく]を思[おも]い起[おこ]される。"
  6: "主[しゅ]はその民[たみ]に、ご自分[じぶん]のわざの力[ちから]を告[つ]げ知[ら]せ、諸国[しょこく]の民[たみ]の嗣業[しぎょう]を彼[かれ]らに与[あた]えられた。"
  7: "その手[て]のわざは真実[しんじつ]と裁[さば]きであり、その戒[いまし]めはすべて確[たし]かである。"
  8: "それらはとこしえに限[かぎ]りなく堅[かた]く据[す]えられ、真実[しんじつ]と正[ただ]しさのうちに成[な]り立[た]っている。"
  9: "主[しゅ]はその民[たみ]に贖[あがな]いを送[おく]り、とこしえにその契約[けいやく]を定[さだ]められた。その名[な]は聖[せい]であり、恐[おそ]るべきである。"
  10: "主[しゅ]を恐[おそ]れることが知恵[ちえ]の始[はじ]めである。それを守[まも]る者[もの]はみな、すぐれた悟[さと]りを得[え]る。主[しゅ]の賛美[さんび]はとこしえに限[かぎ]りなく立[た]ち続[つづ]ける。"

notes:
  0: "Αλληλουια — アレルヤ; надписание, как в Пс 105–106. Надписание — стих 0."
  1: "Ἐξομολογήσομαί σοι, κύριε, ἐν ὅλῃ καρδίᾳ μου — 主よ、わたしは心を尽くしてあなたに感謝します (ἐξομολογέομαι — «славить, благодарить»). ἐν βουλῇ εὐθείων καὶ συναγωγῇ — 正しい者たちの集いのうちで、会衆のうちで (βουλή — «совет, собрание»; συναγωγή — «собрание»; два синонима сохранены)."
  2: "μεγάλα τὰ ἔργα κυρίου — 主のわざは大きく. ἐξεζητημένα εἰς πάντα τὰ θελήματα αὐτοῦ — その望みのすべてにおいて詳しく調べられている (ἐκζητέω — «изыскивать, исследовать»; место тёмное: «изысканы во всех хотениях Его», ср. Синодальный по евр. «вожделенны»)."
  3: "ἐξομολόγησις καὶ μεγαλοπρέπεια τὸ ἔργον αὐτοῦ — そのわざは輝きと威厳に満ち (ἐξομολόγησις — «славословие, исповедание», здесь «слава»; μεγαλοπρέπεια — «величие»). ἡ δικαιοσύνη αὐτοῦ μένει εἰς τὸν αἰῶνα τοῦ αἰῶνος — その義はとこしえに立ち続ける (μένω — «пребывать»)."
  4: "μνείαν ἐποιήσατο τῶν θαυμασίων αὐτοῦ — その奇跡の記念を残された (μνεία — «память»; θαυμάσιον — «чудо»). ἐλεήμων καὶ οἰκτίρμων ὁ κύριος — 主はあわれみ深く、情け深い方 (ἐλεήμων; οἰκτίρμων — «милосердный»)."
  5: "τροφὴν ἔδωκεν τοῖς φοβουμένοις αὐτόν — 自分を恐れる者たちに食べ物を与え (τροφή — «пища»). μνησθήσεται εἰς τὸν αἰῶνα διαθήκης αὐτοῦ — とこしえにその契約を思い起される (διαθήκη — 契約)."
  6: "ἰσχὺν ἔργων αὐτοῦ ἀνήγγειλεν τῷ λαῷ αὐτοῦ — その民に、ご自分のわざの力を告げ知らせ (ἰσχύς — «сила»). τοῦ δοῦναι αὐτοῖς κληρονομίαν ἐθνῶν — 諸国の民の嗣業を彼らに与えるために (κληρονομία — 嗣業)."
  7: "ἔργα χειρῶν αὐτοῦ ἀλήθεια καὶ κρίσις — その手のわざは真実と裁き (ἀλήθεια — 真実; κρίσις — 裁き). πισταὶ πᾶσαι αἱ ἐντολαὶ αὐτοῦ — その戒めはすべて確か (πιστός — «верный»; ἐντολή — 戒め)."
  8: "ἐστηριγμέναι εἰς τὸν αἰῶνα τοῦ αἰῶνος — とこしえに限りなく堅く据えられ (στηρίζω — «утверждать»). πεποιημέναι ἐν ἀληθείᾳ καὶ εὐθύτητι — 真実と正しさのうちに成り立っている (εὐθύτης — «прямота, правота»)."
  9: "λύτρωσιν ἀπέστειλεν τῷ λαῷ αὐτοῦ — その民に贖いを送り (λύτρωσις — 贖い). ἐνετείλατο εἰς τὸν αἰῶνα διαθήκην αὐτοῦ — とこしえにその契約を定められた (ἐντέλλομαι — «заповедывать»). ἅγιον καὶ φοβερὸν τὸ ὄνομα αὐτοῦ — その名は聖であり、恐るべきである (φοβερός — «страшный»)."
  10: "ἀρχὴ σοφίας φόβος κυρίου — 主を恐れることが知恵の始め (ἀρχή — «начало»; σοφία — 知恵). σύνεσις ἀγαθὴ πᾶσι τοῖς ποιοῦσιν αὐτήν — それを守る者はみな、すぐれた悟りを得る (σύνεσις — «разумение»; ποιέω — «исполнять»). ἡ αἴνεσις αὐτοῦ μένει εἰς τὸν αἰῶνα τοῦ αἰῶνος — 主の賛美はとこしえに立ち続ける."
