# jp-box, Псалтирь, псалом 110. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный 常体, без 文語.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0.
# Псалом 110: хвала делам Божиим — исповедание (1), величие дел (2–3),
# милость и завет (4–6), верность заповедей (7–8), искупление и страх Божий (9–10).
# Красного и синего нет. Кавычек нет: прямая речь не звучит, всё — хвала от «я».
# 〔…〕 нет: все слова в gr-lxx-byz есть.
# セラ (διάψαλμα) в этой главе нет.
# Сносок ⟨…⟩ нет: 会衆, 嗣業, 戒め уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
