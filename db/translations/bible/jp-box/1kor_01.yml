# jp-box, Первое послание к Коринфянам, глава 1. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 1: надписание и приветствие (1–3), благодарение и надежда (4–9),
# призыв к единству против разделений (10–17), слово о кресте (18–25),
# призвание немудрых и ничтожных (26–31).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет, <j>/<mo> не ставятся.
# 〔…〕: 1:14 — церковное τῷ θεῷ (в базе εὐχαριστῶ ὅτι без него).
# Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

tr_code: jp-box
book: 1kor
chapter: 1
draft: true

verses:
  1: "パウロ、神[かみ]の御心[みこころ]によって召[め]されたキリスト・イエスの使徒[しと]、および兄弟[きょうだい]ソステネは、"
  2: "コリントにある神[かみ]の教会[きょうかい]、すなわち、キリスト・イエスにあって聖[せい]とされ、聖[せい]なる者[もの]として召[め]された者[もの]たち、ならびに、すべての場所[ばしょ]で、わたしたちの主[しゅ]であり、彼[かれ]らの主[しゅ]でもあるイエス・キリストの名[な]を呼[よ]び求[もと]めるすべての者[もの]たちに、"
  3: "恵[めぐ]みと平和[へいわ]が、わたしたちの父[ちち]である神[かみ]と主[しゅ]イエス・キリストから、あなたがたにありますように。"
  4: "わたしは、あなたがたのために、いつもわたしの神[かみ]に感謝[かんしゃ]している。キリスト・イエスにあってあなたがたに与[あた]えられた神[かみ]の恵[めぐ]みのゆえである。"
  5: "なぜなら、あなたがたはキリストにあって、あらゆることにおいて、すなわち、すべての言葉[ことば]とすべての知識[ちしき]において富[と]んでいるからである。"
  6: "キリストの証[あかし]があなたがたの間[あいだ]で確[かく]かなものとされたとおりである。"
  7: "それゆえ、あなたがたはどんな賜物[たまもの]にも欠[か]けるところがなく、わたしたちの主[しゅ]イエス・キリストの現[あらわ]れを待[ま]ち望[のぞ]んでいる。"
  8: "この方[かた]は、わたしたちの主[しゅ]イエス・キリストの日[ひ]に、あなたがたを終[おわ]りまで確[かく]かなものとし、責[せ]められるところのない者[もの]としてくださる。"
  9: "神[かみ]は信[しん]実[じつ]である。あなたがたは、その御子[みこ]であるわたしたちの主[しゅ]イエス・キリストとの交[まじ]わりへと、この神[かみ]によって召[め]されたのである。"
  10: "さて、兄弟[きょうだい]たちよ、わたしたちの主[しゅ]イエス・キリストの名[な]によって、あなたがたに求[もと]める。あなたがたは皆[みな]、同[おな]じことを語[かた]り、あなたがたの間[あいだ]に分裂[ぶんれつ]がなく、同[おな]じ心[こころ]と同[おな]じ考[かんが]えとをもって、一[ひと]つに整[ととの]えられていなさい。"
  11: "なぜなら、わたしの兄弟[きょうだい]たちよ、あなたがたについて、クロエの家[いえ]の人[ひと]々[びと]から知[し]らされた。あなたがたの間[あいだ]に争[あらそ]いがある、と。"
  12: "わたしが言[い]うのは、あなたがたがそれぞれ「わたしはパウロのものだ」「わたしはアポロのものだ」「わたしはケファのものだ」「わたしはキリストのものだ」と言[い]っているということである。"
  13: "キリストは分[わか]たれたのか。パウロがあなたがたのために十字架[じゅうじか]につけられたのか。あなたがたはパウロの名[な]によって洗礼[せんれい]を受[う]けたのか。"
  14: "〔神[かみ]に〕感謝[かんしゃ]する。あなたがたのうち、わたしが洗礼[せんれい]を授[さず]けた者[もの]は、クリスポとガイオのほかには、だれもいない。"
  15: "それは、だれも「あなたがたはわたしの名[な]によって洗礼[せんれい]を受[う]けた」と言[い]わないためである。"
  16: "わたしはステファナの家[いえ]の人[ひと]々[びと]にも洗礼[せんれい]を授[さず]けた。そのほかにだれかに授[さず]けたかどうかは、わたしは知[し]らない。"
  17: "なぜなら、キリストがわたしを遣[つか]わされたのは、洗礼[せんれい]を授[さず]けるためではなく、福音[ふくいん]を宣[の]べ伝[つた]えるためであり、しかも、言葉[ことば]の知恵[ちえ]によらずに、キリストの十字架[じゅうじか]が空[むな]しくされないためである。"
  18: "なぜなら、十字架[じゅうじか]の言葉[ことば]は、滅[ほろ]びる者[もの]たちには愚[おろ]かさであるが、救[すく]われるわたしたちには神[かみ]の力[ちから]である。"
  19: "なぜなら、「わたしは知恵[ちえ]ある者[もの]の知恵[ちえ]を滅[ほろ]ぼし、賢[かしこ]い者[もの]の分別[ふんべつ]を無[な]きものとする」と書[か]かれているからである。"
  20: "知恵[ちえ]ある者[もの]はどこにいるのか。律法学者[りっぽうがくしゃ]はどこにいるのか。この世[よ]の論客[ろんかく]はどこにいるのか。神[かみ]はこの世[よ]の知恵[ちえ]を愚[おろ]かさとされたのではないか。"
  21: "なぜなら、神[かみ]の知恵[ちえ]のうちで、世[よ]は自分[じぶん]の知恵[ちえ]によって神[かみ]を知[し]らなかったので、神[かみ]は、宣教[せんきょう]の愚[おろ]かさによって信[しん]じる者[もの]たちを救[すく]うことを良[よ]しとされたのである。"
  22: "ユダヤ人[じん]はしるしを求[もと]め、ギリシア人[じん]は知恵[ちえ]を求[もと]める。"
  23: "しかし、わたしたちは、十字架[じゅうじか]につけられたキリストを宣[の]べ伝[つた]えている。ユダヤ人[じん]にはつまずき、異邦人[いほうじん]には愚[おろ]かさである。"
  24: "しかし、召[め]された者[もの]たち、すなわちユダヤ人[じん]にもギリシア人[じん]にも、キリストは神[かみ]の力[ちから]、神[かみ]の知恵[ちえ]である。"
  25: "神[かみ]の愚[おろ]かさは人[ひと]の知恵[ちえ]より賢[かしこ]く、神[かみ]の弱[よわ]さは人[ひと]の強[つよ]さより強[つよ]いからである。"
  26: "兄弟[きょうだい]たちよ、あなたがたの召[め]しを思[おも]い見[み]なさい。なぜなら、肉[にく]に従[したが]って知恵[ちえ]ある者[もの]は多[おお]くなく、力[ちから]ある者[もの]も多[おお]くなく、家柄[いえがら]の良[よ]い者[もの]も多[おお]くない。"
  27: "しかし、神[かみ]は、この世[よ]の愚[おろ]かな者[もの]たちを選[えら]ばれた。知恵[ちえ]ある者[もの]たちを恥[は]ずかしめるためである。神[かみ]は、この世[よ]の弱[よわ]い者[もの]たちを選[えら]ばれた。強[つよ]い者[もの]たちを恥[は]ずかしめるためである。"
  28: "神[かみ]は、この世[よ]の卑[いや]しい者[もの]たち、蔑[さげす]まれた者[もの]たち、すなわち、無[む]に等[ひと]しい者[もの]たちを選[えら]ばれた。有[あ]る者[もの]たちを無[な]きものとするためである。"
  29: "それは、すべての肉[にく]が神[かみ]の前[まえ]で誇[ほこ]ることがないためである。"
  30: "あなたがたがキリスト・イエスにあるのは、神[かみ]によるのである。キリストは、わたしたちのために、神[かみ]から出[で]た知恵[ちえ]となられた。すなわち、義[ぎ]と聖化[せいか]と贖[あがな]いとである。"
  31: "それは、「誇[ほこ]る者[もの]は主[しゅ]において誇[ほこ]れ」と書[か]かれているとおりになるためである。"

notes:
  1: "Χριστοῦ Ἰησοῦ — порядок «Христос Иисус», как в греч.: キリスト・イエス. κλητὸς ἀπόστολος — 召された使徒. Σωσθένης — ソステネ (у jp-joc ソスフェン, форма устарела)."
  2: "ἡγιασμένοις … κλητοῖς ἁγίοις — «освящённым, призванным святым»; 聖とされ、聖なる者として召された者たち. αὐτῶν καὶ ἡμῶν — «их и наш»: Господь их и наш, 彼らの主でもある."
  3: "χάρις — 恵み, εἰρήνη — 平和."
  5: "λόγος здесь — «слово, речь»; 言葉. γνῶσις — 知識."
  6: "τὸ μαρτύριον τοῦ Χριστοῦ — キリストの証. ἐβεβαιώθη — «было утверждено»; 確かなものとされた."
  7: "χάρισμα — 賜物. ἀποκάλυψις — 現れ."
  8: "В базе [Χριστοῦ] стоит в квадратных скобках — слово есть, 〔〕 не ставятся. ἀνέγκλητος — 責められるところのない."
  9: "πιστὸς ὁ θεός — 神は信実である. κοινωνία — 交わり."
  10: "σχίσματα — 分裂. νοῦς — 心, γνώμη — 考え; оба члена переданы раздельно, как у jp-joc (心を一にし、意を一に)."
  11: "Χλόης — «Хлои»; クロエの家の人々 (букв. «от тех, кто у Хлои»). ἔριδες — 争い."
  14: "В базе εὐχαριστῶ ὅτι без τῷ θεῷ; церковный текст (Елизаветинская «Благодарю Бога», jp-joc「神に感謝す」) читает с τῷ θεῷ — 〔神に〕. Проверено по базе: τῷ θεῷ в стихе — 0."
  18: "ὁ λόγος ὁ τοῦ σταυροῦ — 十字架の言葉. μωρία — 愚かさ, δύναμις — 力."
  19: "Ис 29:14. ἀθετήσω — «отвергну, упраздню»; 無きものとする. σύνεσις — 分別."
  20: "συζητητής — 論客 (у jp-joc 辯論者). οὐχί вводит риторический вопрос — сохранён."
  21: "ἐπειδή — なぜなら…ので. μωρία τοῦ κηρύγματος — 宣教の愚かさ; κήρυγμα — 宣教."
  23: "σκάνδαλον — つまずき; ἔθνεσιν — 異邦人."
  25: "τὸ μωρὸν τοῦ θεοῦ — «немудрое Божие»; 神の愚かさ. Сравнительная степень σοφώτερον, ἰσχυρότερον передана сравнением."
  26: "κατὰ σάρκα — 肉に従って. εὐγενεῖς — 家柄の良い者."
  27: "ἐξελέξατο — 選ばれた; καταισχύνῃ — 恥ずかしめる."
  28: "τὰ ἀγενῆ — 卑しい者たち, τὰ ἐξουθενημένα — 蔑まれた者たち, τὰ μὴ ὄντα — «не сущие», 無に等しい者たち; противопоставление τὰ ὄντα — 有る者たち сохранено. καταργήσῃ — 無きものとする."
  29: "πᾶσα σάρξ — «всякая плоть», то есть всё человечество; すべての肉. ὅπως μή — それは…ためである."
  30: "ἀπολύτρωσις — 贖い; ἁγιασμός — 聖化; δικαιοσύνη — 義."
  31: "Иер 9:24 (LXX). ὁ καυχώμενος ἐν κυρίῳ καυχάσθω — 誇る者は主において誇れ."
