# jp-box, 3-я Ездры, глава 12. Черновик для приёмки.
#
# База: церковнославянский текст (csl-ru) — в Септуагинте книги нет; ru — для понимания.
# Нумерация — славянская. Язык — современный 常体; 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1–2 конец видения: оставшаяся голова и четыре крыла исчезают, царство их
# скудно и полно молвы; 3–6 Ездра пробуждается в ужасе, молится об укреплении;
# 7–9 молитва «Владыко Господи»; 10–39 толкование: орёл — царство, показанное Даниилу,
# но не истолкованное ему; двенадцать царей, второй царствует дольше; голос из средины
# тела — распри после того царства; восемь подкрыльных перьев — восемь царей (два
# погибнут, четыре сохранятся до среднего времени, два — до конца); три головы — три
# царства в конце, они довершат беззакония; большая голова умрёт на постели с мучением,
# двух пожрёт меч; два малых пера у правой головы — скудное царство, сохранённое к концу;
# лев — обличитель, поставленный на суд живых, избавит остаток; 36–39 повеление
# написать в книгу, научить мудрых, ждать семь дней; 40–45 народ просит Ездру не
# оставлять его; 46–49 ответ Ездры («надейся, Израиль»); 50 народ уходит; 51 Ездра
# остаётся в поле семь дней.
# Голоса: 12:1–6 — рассказ и слова Ездры к духу (12:4–6, 「…」); 12:7–9 — молитва
# Ездры 「…», в конце 12:9 вводка «И рече ко мне»; 12:10–39 — толкование ангела,
# одна речь 「…», в 12:39 закрывается перед «и отиде от мене»; 12:41–45 — речь народа
# 「…» (вводка в 12:40); 12:45 — плач народа вне кавычек; 12:46–49 — ответ Ездры 「…».
# Термины: 幻[まぼろし] — видение; 王国[おうこく] — царство; 王[おう] — царь;
# 翼[つばさ] — крыло; 小[ちい]さな羽[はね] — перийце; 頭[あたま] — голова;
# いと高[たか]き方[かた] — Вышний; 力[ちから]ある者[もの] — Крепкий; 主[しゅ]なる神[かみ] —
# Владыко Господи; 裁[さば]きの座[ざ] — суд живых; 不敬虔[ふけいけん] — нечестие;
# 不法[ふほう] — беззаконие; 残[のこ]りの者[もの] — останок; 秘密[ひみつ] — тайна.
# Имена: エズラ, ダニエル, イスラエル, ヤコブ, シオン.
# Язык: молитва Ездры 12:7–9 — です・ます (как молитвы в корпусе); остальное — 常体.
#
