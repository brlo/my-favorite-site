verses:
  1: "獅子[しし]がこれらの言葉[ことば]を鷲[わし]に語[かた]ったとき、わたしは見[み]た。"
  2: "見[み]よ、残[のこ]っていた頭[あたま]も、それに移[うつ]って王[おう]になろうと起[お]こったあの四[よっ]つの翼[つばさ]も、もはや現[あらわ]れなかった。彼[かれ]らの王国[おうこく]は乏[とぼ]しく、騒[さわ]ぎに満[み]ちていた。"
  3: "わたしが見[み]ると、見[み]よ、それらは消[き]え、鷲[わし]の体[からだ]はすべて燃[も]え、地[ち]はひどく恐[おそ]れた。わたしは騒[さわ]ぎと心[こころ]の混乱[こんらん]と大[おお]きな恐[おそ]れのためにはっと目[め]を覚[さ]まし、わたしの霊[れい]に言[い]った。"
  4: "「見[み]よ、あなたは、いと高[たか]き方[かた]の道[みち]を探[さぐ]り求[もと]めることによって、わたしにこれをもたらした。"
  5: "見[み]よ、わたしはまだ魂[たましい]に疲[つか]れ、霊[れい]もひどく弱[よわ]っている。今夜[こんや]恐[おそ]れた多[おお]くの恐[おそ]れのため、わたしのうちにはわずかな力[ちから]もない。"
  6: "だから今[いま]、わたしはいと高[たか]き方[かた]に祈[いの]ろう。どうか終[お]わりまでわたしを強[つよ]めてくださるように。」"
  7: "そしてわたしは言[い]った。「主[しゅ]なる神[かみ]よ。もしわたしがあなたの目[め]に恵[めぐ]みを得[え]、もしあなたの前[まえ]に多[おお]くの者[もの]よりも正[ただ]しいと認[みと]められ、もしわたしの祈[いの]りが真実[しんじつ]にあなたの顔[かお]の前[まえ]に上[のぼ]りましたのなら、"
  8: "どうかわたしを強[つよ]め、この恐[おそ]ろしい幻[まぼろし]の解[かい]とその意味[いみ]を、この僕[しもべ]に示[しめ]してください。そうすれば、わたしの魂[たましい]はより完全[かんぜん]に慰[なぐさ]められます。"
  9: "あなたは、終[お]わりの時[とき]々[どき]をわたしに示[しめ]すにふさわしい者[もの]として、わたしを選[えら]ばれました。」彼はわたしに言[い]った。"
  10: "「これがこの幻[まぼろし]の解[かい]である。"
  11: "あなたが見[み]た、海[うみ]から上[のぼ]って来[く]る鷲[わし]、それが、あなたの兄弟[きょうだい]ダニエルに幻[まぼろし]のうちに示[しめ]された王国[おうこく]である。"
  12: "しかし、それは彼に解[と]き明[あ]かされなかった。それを今[いま]、わたしがあなたに解[と]き明[あ]かす。"
  13: "見[み]よ、日[ひ]が来[く]る。地[ち]の上[うえ]に一[ひと]つの王国[おうこく]が起[お]こり、それは先[さき]にあったすべての王国[おうこく]にまさる恐[おそ]れとなる。"
  14: "その中[なか]で十二[じゅうに]の王[おう]たちが、一[ひと]りずつ次々[つぎつぎ]に王[おう]として治[おさ]める。"
  15: "そのうちの二番目[にばんめ]の者が王[おう]となり始[はじ]め、彼はほかの十二[じゅうに]の者[もの]たちよりも長[なが]い時[とき]を保[たも]つ。"
  16: "これが、あなたが見[み]た十二[じゅうに]の翼[つばさ]の解[かい]である。"
  17: "あなたが聞[き]いた、その頭[あたま]からではなく体[からだ]の真[ま]ん中[なか]から出[で]ていた声[こえ]については、"
  18: "その解[かい]はこうである。すなわち、その王国[おうこく]の時[とき]の後[あと]に少[すこ]しならぬ争[あらそ]いが生[しょう]じ、その王国[おうこく]は倒[たお]れる危[あや]うさにさらされる。しかしそのときには倒[たお]れず、再[ふたた]び初[はじ]めの状態[じょうたい]に立[た]ち返[かえ]る。"
  19: "あなたが見[み]た、翼[つばさ]に付[つ]いている八[やっ]つの小[ちい]さな羽[はね]については、"
  20: "その解[かい]はこうである。すなわち、その王国[おうこく]のうちに八人[はちにん]の王[おう]が起[お]こり、彼[かれ]らの時[とき]は短[みじか]く、年[とし]も速[はや]く過[す]ぎる。そのうち二[ふた]りは滅[ほろ]びる。"
  21: "中間[ちゅうかん]の時[とき]が近[ちか]づくと、四[よっ]つの者[もの]が、その終[お]わりが近[ちか]づく時[とき]まで保[たも]たれ、二[ふた]つはついに終[お]わりまで保[たも]たれる。"
  22: "あなたが見[み]た三[みっ]つの休[やす]んでいる頭[あたま]については、"
  23: "その解[かい]はこうである。すなわち、その終[お]わりの時[とき]に、いと高[たか]き方[かた]は三[みっ]つの王国[おうこく]を起[お]こし、多[おお]くの者[もの]をそれらに招[まね]き、彼[かれ]らは地[ち]と、その上[うえ]に住[す]む者[もの]たちを支配[しはい]する。"
  24: "そして彼[かれ]らは、先[さき]のすべての者[もの]たちの上[うえ]に大[おお]きな苦[くる]しみを課[か]す。それゆえ、彼[かれ]らは鷲[わし]の頭[あたま]と呼[よ]ばれる。"
  25: "彼[かれ]らこそ、その不敬虔[ふけいけん]を極[きわ]め、その終[お]わりを全[まっと]うする者[もの]たちである。"
  26: "あなたが見[み]た、もはや現[あらわ]れない大[おお]きな頭[あたま]については、その解[かい]はこうである。すなわち、そのうちの一[ひと]りは自[みずか]らの寝床[ねどこ]で死[し]ぬ。ただし苦[くる]しみのうちに。"
  27: "残[のこ]る二[ふた]りは剣[つるぎ]に食[く]われ、"
  28: "彼[かれ]の剣[つるぎ]は彼[かれ]とともにいる者[もの]たちを食[く]らう。しかしこの者[もの]もまた、ついに剣[つるぎ]によって倒[たお]れる。"
  29: "あなたが見[み]た、右[みぎ]の側[がわ]の頭[あたま]へ移[うつ]る二[ふた]つの小[ちい]さな羽[はね]については、"
  30: "その解[かい]はこうである。これらは、いと高[たか]き方[かた]がその終[お]わりのために取[と]っておかれた者[もの]たち、すなわち乏[とぼ]しく、悩[なや]みに満[み]ちた王国[おうこく]である。"
  31: "あなたが見[み]た獅子[しし]、すなわち森[もり]から起[お]こり出[で]て、ほえ、鷲[わし]に語[かた]り、あなたが聞[き]いたすべての言葉[ことば]をもってその不法[ふほう]を責[せ]めた獅子[しし]については、"
  32: "これこそ、いと高[たか]き方[かた]が彼[かれ]らとその不敬虔[ふけいけん]に対して終[お]わりのために取[と]っておかれた風[かぜ]である。彼[かれ]は彼[かれ]らを責[せ]め、彼[かれ]らの前[まえ]に彼[かれ]らの迷[まよ]いを示[しめ]す。"
  33: "彼[かれ]は彼[かれ]らを生[い]ける者[もの]の裁[さば]きの座[ざ]に立[た]たせ、責[せ]めたのち、罰[ばっ]するであろう。"
  34: "彼[かれ]はわたしの民[たみ]の残[のこ]りを苦難[くなん]のうちから救[すく]い出[だ]し、わたしの国[くに]の果[は]てに保[たも]たれた者[もの]たちを喜[よろこ]ばせる。やがて裁[さば]きの日[ひ]である終[お]わりが来[く]るまで、すなわち、わたしが初[はじ]めにあなたに語[かた]ったその日[ひ]まで。"
  35: "これがあなたが見[み]た夢[ゆめ]であり、これがその解[かい]である。"
  36: "あなただけが、いと高[たか]き方[かた]のこの秘密[ひみつ]を知[し]るにふさわしかった。"
  37: "だから、あなたが見[み]たこれらすべてを書[か]に記[しる]して、安全[あんぜん]な場所[ばしょ]に置[お]きなさい。"
  38: "そして、あなたの民[たみ]のうちの賢[かしこ]い者[もの]たち、あなたがその心[こころ]をご存[ぞん]じで、これらの秘密[ひみつ]を受[う]け取[と]って保[たも]つことのできる者[もの]たちを教[おし]えなさい。"
  39: "あなたはもう七日[なぬか]、ここで耐[た]え忍[しの]びなさい。そうすれば、いと高[たか]き方[かた]があなたに示[しめ]すことをよしとされるすべてのことが、あなたに示[しめ]されるであろう。」そして彼はわたしから去[さ]った。"
  40: "七日[なぬか]が過[す]ぎてもわたしが町[まち]へ戻[もど]らないと、民[たみ]はみな、小[ちい]さな者[もの]から大[おお]きな者[もの]まで集[あつ]まって、わたしのもとへ来[き]て言[い]った。"
  41: "「わたしたちはあなたに何[なに]を罪[つみ]としたのか。あなたに対して何[なに]を悪[わる]くしたというのか。あなたはわたしたちを捨[す]てたまま、あの場所[ばしょ]に座[すわ]っているのか。"
  42: "あなたはすべての民[たみ]のうちでわたしたちに残[のこ]された唯一[ゆいいつ]の者[もの]、ぶどうの房[ふさ]から取[と]った一[ひと]粒[つぶ]の実[み]、暗[くら]い場所[ばしょ]の灯[あか]り、嵐[あらし]から救[すく]われた港[みなと]と舟[ふね]のような者[もの]である。"
  43: "わたしたちに降[ふ]りかかる災[わざわ]いは、まだ足[た]りないのか。"
  44: "もしあなたがわたしたちを捨[す]てるなら、わたしたちはシオンが焼[や]かれたとき、ともに焼[や]かれてしまったほうがよかったのだ。"
  45: "わたしたちは、あそこで死[し]んだ者[もの]たちよりも良[よ]い者[もの]ではない。」彼[かれ]らは大[おお]きな声[こえ]をあげて泣[な]いた。わたしは彼[かれ]らに答[こた]えて言[い]った。"
  46: "「イスラエルよ、望[のぞ]みを持[も]ちなさい。ヤコブの家[いえ]よ、悲[かな]しんではならない。"
  47: "あなたがたのことを覚[おぼ]えている方がいと高[たか]き方[かた]の前[まえ]におられ、力[ちから]ある者[もの]は苦[くる]しみのうちであなたがたを忘[わす]れてはいないからである。"
  48: "わたしはあなたがたを捨[す]てず、あなたがたから離[はな]れなかった。ただ、シオンの荒廃[こうはい]のために祈[いの]り、あなたがたの聖所[せいしょ]の辱[はずか]しめのためにあわれみを求[もと]めるために、この場所[ばしょ]に来[き]たのだ。"
  49: "今[いま]はおのおの家[いえ]に帰[かえ]りなさい。わたしはこれらの日[ひ]の後[あと]に、あなたがたのもとへ行[い]く。」"
  50: "民[たみ]はわたしが言[い]ったとおりに町[まち]へ帰[かえ]った。"
  51: "わたしは命[めい]じられたとおりに野[の]に七日[なぬか]とどまり、ただ野[の]花[はな]を食[た]べ、その日[ひ]々[び]は草[くさ]がわたしの食[たべ]物[もの]となった。"

notes:
  1: "«егда глаголаше лев словеса сия ко орлу, и видех» — «когда лев говорил орлу эти слова, я увидел»; предложение продолжается в 12:2."
  2: "«яже оста глава, и не явишася четыри крила оная, яже к нему преидоша и воздвигошася да царствуют» — «оставшаяся голова и те четыре крыла, которые к ней перешли и поднялись, чтобы царствовать, не явились»; «бяше царство их скудно и молвы полно» — «царство их было скудно и полно молвы (смуты)»."
  3: "«все тело орлее возжигашеся» — «всё тело орла возжигалось (горело)»; «от молвы и ужаса ума и от велика страха воспрянух» — «от молвы, и ужаса ума, и от великого страха я воспрянул (пробудился)»."
  4: "Тёмное: «се, ты подал еси мне то в том, яко испытуеши пути вышняго» — букв. «вот, ты подал мне это в том, что испытуешь пути Вышнего»; ru: «вот, ты причинил мне это тем, что испытываешь пути Всевышнего»."
  5: "«еще утружден есмь душею и духомъ моим изнемогох зело, и ниже малая есть во мне сила от множества боязни, еюже устрашихся нощи сея» — «ещё я утруждён душою и духом моим изнемог весьма, и нет во мне и малой силы от множества боязни, которою я устрашился ночи сей»."
  6: "«ныне убо помолюся вышнему, да мя укрепитъ даже до конца» — «итак ныне помолюсь Вышнему, да укрепит меня даже до конца»."
  7: "«владыко Господи» — «Владыко Господи», передано 主[しゅ]なる神[かみ]よ; «аще обретох благодать пред очима твоима» — «если я обрёл благодать пред очами Твоими»; «аще оправдан есмь пред тобою паче многих» — «если я оправдан пред Тобою более многих» (ru: «если Ты нашел меня праведным пред многими»); «аще истинно взыде моление мое пред лицем твоим» — «если истинно взошла молитва моя пред лицом Твоим»."
  8: "«толкование и разделение видения грознаго сего» — «истолкование и разделение видения страшного сего»; «разделение» — разбор, раздел (ru: «значение»), передано 意味[いみ]; «да совершеннее утешиши душу мою» — «чтобы совершеннее утешить душу мою»."
  9: "«достойна бо мене имел еси показати мне времена последняя» — «ибо Ты счёл меня достойным показать мне последние времена»; «И рече ко мне» — вводка речи ангела (12:10–39) вне кавычек."
  10: "«сие есть толкование видения сего» — «таково истолкование видения сего»."
  11: "«орла егоже видел еси восходяща от моря, то есть царство, еже видено бысть в видении даниила брата твоего» — «орёл, которого ты видел восходящим от моря, — это царство, которое было показано в видении Даниилу, брату твоему» (Дан 7)."
  12: "«но несть ему протолковано, яже азъ ныне тебе протолкую» — «но не было ему истолковано то, что я ныне тебе истолкую»."
  13: "«востанет царство на земли, и будет боязнь вящшая всем царством, яже быша прежде его» — «восстанет на земле царство, и будет страх больший всех царств, которые были прежде него»; слав. «боязнь» — страх, ужас."
  14: "«царствовати же будут на ней царие дванадесять, един по единому» — «царствовать же будут на ней двенадцать царей, один за другим». Число — буквально: 十二."
  15: "«вторый начнет царствовати, и той одержитъ вящшее время паче дванадесяти» — «второй начнёт царствовать, и тот удержит большее время, нежели двенадцать» (ru: «нежели прочие двенадцать»)."
  16: "«сие есть толкование дванадесяти крил, яже видел еси» — «таково истолкование двенадцати крыльев, которые ты видел»."
  17: "«егоже слышал еси глас, иже глаголаше, не от глав его исходящь, но от средины тела его» — «голос, который ты слышал, говоривший не от голов его, но из средины тела его»; предложение продолжается в 12:18."
  18: "«яко после времене царства того родятся рвения не мала, и бедствовати имать, яко да падет, и не падет тогда, но паки возставится в свое начало» — «что после времени царства того родятся немалые распри, и оно будет в беде, чтобы пасть, но не падёт тогда, а снова восстановится в своё начало»; «рвения» — распри, рвения."
  19: "«а яже видел еси подкрилец осмь прилепляющихся крилам его» — «а что ты видел восемь подкрыльных [перьев], прилепляющихся к крыльям его». Число — буквально: 八."
  20: "«востанут в томъ осмь царей, ихже будут времена легка и лета скорая, и два убо от них погибнут» — «восстанут в нём восемь царей, которых времена будут легки и годы скоры, и два из них погибнут». Числа — буквально: 八人、二."
  21: "«приближающуся же времени среднему, четыри сохранятся во время, егда начнет приближатися время его да скончается, двое же на конец сохранятся» — «когда приблизится среднее время, четыре сохранятся до времени, когда начнёт приближаться время его, чтобы окончиться, а два сохранятся до конца». Числа — буквально: 四、二."
  22: "«а яко видел еси три главы покоящияся» — «а что ты видел три головы в покое». Число — буквально: 三."
  23: "«в последняя его воздвигнет вышний три царства и призовет въ ня многих, и пообладают землею» — «в последние его [дни] воздвигнет Вышний три царства и призовёт в них многих, и они овладеют землёю»."
  24: "«и иже обитают на ней, с трудом многимъ на всех, иже быша прежде сих, сего ради тии названи суть главы орли» — «и те, кто обитает на ней, с великим угнетением для всех, кто был прежде них; поэтому они названы головами орла»; слав. оборот оборван, переведён по смыслу (ru: «с бо́льшим утеснением, нежели все прежде бывшие»)."
  25: "«сии бо будут, иже возоглавят нечестия его и иже совершат последняя его» — «ибо они будут те, которые возглавят (довершат) нечестия его и совершат последнее его»."
  26: "«главу болшую неявляющуюся … яко единъ от них на одре своем умрет, но обаче с мучением» — «что большая голова не является… что один из них умрёт на одре своём, но однако с мучением»."
  27: "«ибо два, иже пребудут, мечь их пояст» — «ибо двух, которые пребудут, меч пожрёт»; слав. «их» — винительный при «пояст»."
  28: "«единаго бо мечь пояст сущих с ним, но обаче и сей мечем на последок падет» — «ибо одного меч пожрёт — тех, кто с ним, но однако и сей мечом на конец падёт»; тёмное, передано по смыслу."
  29: "«два подкрилия восходящая на главу, яже есть о десную страну» — «два подкрыльных пера, восходящие на голову, которая с правой стороны»."
  30: "«сии суть, ихже соблюде вышний в конец свой, то есть царство скудное и скорбей полно» — «это те, которых соблюл Вышний к концу своему, то есть царство скудное и полное скорбей»."
  31: "«льва, егоже виделъ еси от леса возбудившася, рыкающа и глаголюща ко орлу, и обличающа его и неправды его всеми словесы его» — «льва, которого ты видел возбудившимся из леса, рыкающим, говорящим к орлу и обличающим его и неправды его всеми словами его»."
  32: "Трудное место: слав. «сей есть ветр, егоже сохранил вышний на конец на них и на нечестия их» — «это есть ветер, которого сохранил Вышний на конец против них и нечестий их». ru (и Синод.) читает здесь «Помазанник» (лат. unctus; слав. «ветр», вероятно, порча). В тексте держим слав. чтение — 風[かぜ]; по содержанию лев — обличитель орла, Помазанник. Место отмечено для приёмки."
  33: "«поставит бо их на суде живых: и будет, егда обличит их, тогда накажет их» — «ибо поставит их на суде живых: и будет, когда обличит их, тогда накажет их»."
  34: "Тёмное: «ибо останок людий моих избавит с бедностию» — «ибо остаток народа Моего избавит с бедностию»; ru: «по милосердию избавит остаток народа Моего» (вероятно, иное чтение); передано 苦難[くなん]のうちから; «дондеже приидет конец день суда, о немже глаголах тебе от начала» — «доколе не придёт конец — день суда, о котором Я говорил тебе от начала»."
  35: "«сей сон, егоже видел еси, и сия суть толкования» — «таков сон, который ты видел, и таковы истолкования»."
  36: "«ты убо един достоин был еси знати тайну сию вышняго» — «итак ты один был достоин знать эту тайну Вышнего»."
  37: "«напиши убо вся сия в книгу, яже виделъ еси, и положи я в месте сохранне» — «итак напиши всё это в книгу, что видел, и положи в месте сохранном»."
  38: "«научиши сим мудрыя от людий твоих, ихже сердца веси, яко могут прияти и хранити тайны сия» — «научи сему мудрых из народа твоего, которых сердца ты знаешь, что могут принять и хранить тайны сии»."
  39: "«ты же еще потерпи зде иных дний седмь, да тебе показано будет все, еже изволится вышнему показати тебе» — «ты же ещё потерпи здесь иных дней семь, да будет показано тебе всё, что изволится Вышнему показать тебе»; «И отиде от мене» — вне кавычек, речь ангела закрывается."
  40: "«егда услыша весь народ, яко проидоша седмь дний, и аз не возвратихся во град» — «когда услышал весь народ, что прошли семь дней, а я не возвратился в город»; «собрашася вси от меншаго даже до болшаго» — «собрались все от меньшего до большего»."
  41: "«что согрешили есмы тебе и что неправо содеяхом на тя, яко оставляяй нас селъ еси на месте том?» — «что мы согрешили тебе и что неправо сделали против тебя, что, оставляя нас, сидишь на месте том?»"
  42: "«ты бо нам остался еси един от всехъ людий, якоже грозд от винограда и яко светилникъ в месте мрачне и яко пристанище и корабль спасеный от бури» — «ибо ты остался нам один из всех людей, как гроздь от винограда, и как светильник в месте мрачном, и как пристань и корабль, спасённый от бури»."
  43: "«или недоволна нам суть злая, яже приключаются?» — «или не довольно нам зла, которое приключается?»"
  44: "«аще убо ты нас оставиши, коль лучше бы нам было, аще быхом сожжени были и мы с сожжением сиона?» — «если ты оставишь нас, сколь лучше было бы нам, если бы и мы были сожжены с сожжением Сиона?»"
  45: "«ниже бо мы есмы лучши тех, иже тамо умроша» — «ибо мы не лучше тех, которые там умерли»; «И плакаша гласом великим» — плач народа вне кавычек; «И овещахъ к ним и рекох» — вводка ответа Ездры (12:46–49)."
  46: "«уповай, израилю, и не скорби ты, доме иаковль» — «уповай, Израиль, и не скорби ты, дом Иакова»."
  47: "«есть бо память о вас пред вышним, и крепкий не забы вас в напасти» — «ибо есть память о вас пред Вышним, и Крепкий не забыл вас в напасти»."
  48: "«аз бо не оставих вас, ни отидох от вас, но приидох на сие место» — «ибо я не оставил вас и не ушёл от вас, но пришёл на это место»; «да помолюся о разорении сиона, да взыщу милосердие за смирение святыни вашея» — «чтобы помолиться о разорении Сиона, чтобы взыскать милосердие за унижение святыни вашей»."
  49: "«и ныне идите един кийждо в дом свой, и аз прииду к вам по днех сих» — «и ныне идите каждый в дом свой, и я приду к вам после дней сих». Здесь речь Ездры закрывается."
  50: "«И отиде народ, якоже рекох ему, во град» — «и пошёл народ, как я сказал ему, в город»."
  51: "«аз же седох на поли седмь дний, якоже ми повеле, и ядох токмо от цветов селных, и от трав сотворена бысть мне пища во днехъ тех» — «я же сидел в поле семь дней, как мне повелено, и ел только полевые цветы, и из трав была мне пища в те дни»."
