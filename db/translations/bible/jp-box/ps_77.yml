verses:
  0: "アサフの教[おし]え。"
  1: "わたしの民[たみ]よ、わたしの律法[りっぽう]を聞[き]け。わたしの口[くち]の言葉[ことば]にあなたがたの耳[みみ]を傾[かたむ]けよ。"
  2: "わたしは口[くち]を開[ひら]いてたとえを語[かた]り、昔[むかし]からの謎[なぞ]を説[と]き明[あ]かそう。"
  3: "わたしたちが聞[き]き、知[し]ったこと、わたしたちの父[ちち]たちがわたしたちに語[かた]ってくれたことを、"
  4: "わたしたちはそれを彼[かれ]らの子[こ]どもたちに隠[かく]さず、次[つぎ]の世代[せだい]に、主[しゅ]の賛美[さんび]とその力[ちから]と、主[しゅ]が行[おこな]われた奇[き]跡[せき]とを告[つ]げ知[し]らせる。"
  5: "主[しゅ]はヤコブの中[なか]に証[あかし]を立[た]て、イスラエルの中[なか]に律法[りっぽう]を置[お]き、わたしたちの父[ちち]たちに命[めい]じて、それを子[こ]らに知[し]らせようとされた。"
  6: "それは、次[つぎ]の世代[せだい]がそれを知[し]り、これから生[う]まれる子[こ]どもたちが立[た]ち上[あ]がって、自分[じぶん]たちの子[こ]らにそれを告[つ]げ知[し]らせるためである。"
  7: "彼[かれ]らが神[かみ]に自分[じぶん]たちの望[のぞ]みを置[お]き、神[かみ]のわざを忘[わす]れず、その戒[いまし]めを守[まも]るように。"
  8: "彼[かれ]らが、自分[じぶん]たちの父[ちち]たちのように、心[こころ]を正[ただ]しくせず、その霊[れい]が神[かみ]に忠実[ちゅうじつ]でなかった、曲[ま]がった逆[さか]らう世代[せだい]にならないように。"
  9: "エフライムの子[こ]らは、弓[ゆみ]を引[ひ]き矢[や]を射[い]る者[もの]たちであったが、戦[いくさ]の日[ひ]に退[しりぞ]いた。"
  10: "彼[かれ]らは神[かみ]の契約[けいやく]を守[まも]らず、その律法[りっぽう]に従[したが]って歩[あゆ]むことを望[のぞ]まなかった。"
  11: "彼[かれ]らは神[かみ]の善[よ]いわざと、神[かみ]が彼[かれ]らに示[しめ]された奇[き]跡[せき]とを忘[わす]れた。"
  12: "神[かみ]は彼[かれ]らの父[ちち]たちの目[め]の前[まえ]で、エジプトの地[ち]で、タネオスの野[の]で奇[き]跡[せき]を行[おこな]われた。"
  13: "神[かみ]は海[うみ]を裂[さ]いて彼[かれ]らを通[とお]らせ、水[みず]を革袋[かわぶくろ]のように立[た]たせられた。"
  14: "昼[ひる]は雲[くも]で、夜[よる]は一晩中[ひとばんじゅう]火[ひ]の光[ひかり]で、彼[かれ]らを導[みちび]かれた。"
  15: "神[かみ]は荒野[こうや]で岩[いわ]を裂[さ]き、大[おお]きな淵[ふち]から水[みず]を汲[く]むように、彼[かれ]らに飲[の]ませられた。"
  16: "神[かみ]は岩[いわ]から水[みず]を流[なが]れ出[で]させ、水[みず]を川[かわ]のように流[なが]れさせた。"
  17: "しかし、彼[かれ]らはさらに罪[つみ]を重[かさ]ね、水[みず]のない荒野[こうや]で至高[しこう]の神[かみ]を怒[いか]らせた。"
  18: "彼[かれ]らは心[こころ]のうちで神[かみ]を試[こころ]み、自分[じぶん]たちの魂[たましい]のために食物[しょくもつ]を求[もと]めた。"
  19: "そして、神[かみ]をののしって言[い]った。「神[かみ]は荒野[こうや]で食卓[しょくたく]を整[ととの]えることができるだろうか。"
  20: "神[かみ]が岩[いわ]を打[う]つと、水[みず]が流[なが]れ出[で]、川[かわ]があふれた。それでも神[かみ]はパンを与[あた]え、ご自分[じぶん]の民[たみ]に食卓[しょくたく]を整[ととの]えることができるだろうか」と。"
  21: "主[しゅ]はこれを聞[き]いて激[はげ]しく怒[いか]り、火[ひ]はヤコブに燃[も]え、怒[いか]りはイスラエルに上[のぼ]った。"
  22: "彼[かれ]らは神[かみ]を信[しん]じず、その救[すく]いを寄[よ]り頼[たの]まなかったからである。"
  23: "神[かみ]は上[うえ]の雲[くも]に命[めい]じ、天[てん]の扉[とびら]を開[ひら]いて、"
  24: "彼[かれ]らにマンナを雨[ふ]らして食[た]べさせ、天[てん]のパンを彼[かれ]らに与[あた]えられた。"
  25: "人[ひと]は天使[てんし]のパンを食[た]べ、神[かみ]は満[み]ち足[た]りるほどの食[しょく]を彼[かれ]らに送[おく]られた。"
  26: "神[かみ]は天[てん]から南風[みなみかぜ]を起[おこ]し、その力[ちから]によって南西[なんせい]の風[かぜ]を引[ひ]き寄[よ]せられた。"
  27: "神[かみ]は彼[かれ]らの上[うえ]に肉[にく]を塵[ちり]のように、翼[つばさ]ある鳥[とり]を海[うみ]の砂[すな]のように雨[ふ]らせられた。"
  28: "神[かみ]はそれらを彼[かれ]らの陣営[じんえい]のただ中[なか]に、その住[す]まいの周[まわ]りに落[お]とされた。"
  29: "彼[かれ]らは食[た]べて十分[じゅうぶん]に飽[あ]き足[た]り、神[かみ]は彼[かれ]らの望[のぞ]むものを与[あた]えられた。"
  30: "彼[かれ]らは自分[じぶん]たちの欲望[よくぼう]を満[み]たされた。食物[しょくもつ]がまだ彼[かれ]らの口[くち]にあるうちに、"
  31: "神[かみ]の怒[いか]りは彼[かれ]らの上[うえ]に上[のぼ]り、彼[かれ]らの肥[こ]えた者[もの]たちを殺[ころ]し、イスラエルの選[えら]ばれた者[もの]たちを打[う]ち倒[たお]された。"
  32: "それでも彼[かれ]らはなお罪[つみ]を犯[おか]し、神[かみ]の奇[き]跡[せき]を信[しん]じなかった。"
  33: "彼[かれ]らの日[ひ]々[び]はむなしく過[す]ぎ去[さ]り、その年[とし]々[とし]は慌[あわ]ただしさのうちに消[き]え去[さ]った。"
  34: "神[かみ]が彼[かれ]らを殺[ころ]すと、彼[かれ]らは神[かみ]を求[もと]めて向[む]きを変[か]え、朝[あさ]早[はや]くから神[かみ]のもとへ急[いそ]いだ。"
  35: "彼[かれ]らは、神[かみ]が自分[じぶん]たちの助[たす]けであり、至高[しこう]の神[かみ]が自分[じぶん]たちを贖[あがな]う方[かた]であることを思[おも]い起[おこ]した。"
  36: "しかし、彼[かれ]らは口[くち]で神[かみ]を欺[あざむ]き、舌[した]で神[かみ]にうそをついた。"
  37: "彼[かれ]らの心[こころ]は神[かみ]に対して正[ただ]しくなく、神[かみ]の契約[けいやく]に忠実[ちゅうじつ]でもなかった。"
  38: "しかし、神[かみ]はあわれみ深く、彼[かれ]らの罪[つみ]を赦[ゆる]して滅[ほろ]ぼさず、しばしばその怒[いか]りを退[しりぞ]け、その憤[いきどお]りをことごとく燃[も]え上[あ]がらせなかった。"
  39: "神[かみ]は、彼[かれ]らが肉[にく]にすぎず、過[す]ぎ去[さ]って帰[かえ]らない霊[れい]であることを思[おも]い出[だ]された。"
  40: "彼[かれ]らは荒野[こうや]で何度[なんど]も神[かみ]を悲[かな]しませ、水[みず]のない地[ち]で神[かみ]を怒[いか]らせたことか。"
  41: "彼[かれ]らはまた向[む]きを変[か]えて神[かみ]を試[こころ]み、イスラエルの聖[せい]なる方[かた]を怒[いか]らせた。"
  42: "彼[かれ]らは神[かみ]の手[て]を、彼[かれ]らを苦[くる]しめる者[もの]の手[て]から贖[あがな]われた日[ひ]を思[おも]い出[だ]さなかった。"
  43: "つまり、神[かみ]がエジプトでそのしるしを、タネオスの野[の]でその奇[き]跡[せき]を置[お]かれた日のことである。"
  44: "神[かみ]は彼[かれ]らの川[かわ]と流[なが]れを血[ち]に変[か]え、彼[かれ]らが飲[の]めないようにされた。"
  45: "神[かみ]は彼[かれ]らの間にあぶを送って彼[かれ]らを食[く]い尽[つ]くさせ、かえるを送って彼[かれ]らを滅[ほろ]ぼされた。"
  46: "神[かみ]は彼[かれ]らの実[み]を青虫[あおむし]に、彼[かれ]らの労苦[ろうく]をいなごに与[あた]えられた。"
  47: "神[かみ]は雹[ひょう]で彼[かれ]らのぶどうを、霜[しも]でその桑[くわ]の木[き]を打[う]たれた。"
  48: "神[かみ]は彼[かれ]らの家畜[かちく]を雹[ひょう]に、その財産[ざいさん]を炎[ほのお]に渡[わた]された。"
  49: "神[かみ]は彼[かれ]らに、その怒[いか]りの炎[ほのお]、憤[いきどお]りと怒[いか]りと苦難[くなん]、悪[わる]い天使[てんし]たちによる使[つか]いを送[おく]られた。"
  50: "神[かみ]はその怒[いか]りのために道[みち]を平[たい]らにし、彼[かれ]らの魂[たましい]を死[し]から免[まぬか]れさせず、その家畜[かちく]を死[し]に閉[と]じ込[こ]められた。"
  51: "神[かみ]はエジプトのすべての初[うい]子[ご]を、ハムの幕屋[まくや]のうちにある彼[かれ]らの労苦[ろうく]の初[はじ]めを打[う]たれた。"
  52: "神[かみ]はご自分[じぶん]の民[たみ]を羊[ひつじ]のように引[ひ]き出[だ]し、荒野[こうや]で彼[かれ]らを羊[ひつじ]の群[む]れのように導[みちび]かれた。"
  53: "神[かみ]は彼[かれ]らを望[のぞ]みのうちに導[みちび]き、彼[かれ]らは恐[おそ]れなかった。海[うみ]は彼[かれ]らの敵[てき]を覆[おお]った。"
  54: "神[かみ]は彼[かれ]らをその聖[せい]なる境[さかい]へ、ご自分[じぶん]の右[みぎ]の手[て]で獲[え]たこの山[やま]へ導[みちび]き入[い]れられた。"
  55: "神[かみ]は彼[かれ]らの前[まえ]から諸[しょ]民[みん]を追[お]い出[だ]し、測[はか]り縄[なわ]で彼[かれ]らに嗣業[しぎょう]を分[わ]け与[あた]え、イスラエルの部族[ぶぞく]を彼[かれ]らの幕屋[まくや]に住[す]まわせられた。"
  56: "しかし、彼[かれ]らは神[かみ]を試[こころ]み、至高[しこう]の神[かみ]を怒[いか]らせ、その証[あかし]を守[まも]らなかった。"
  57: "彼[かれ]らは退[しりぞ]いて父[ちち]たちと同[おな]じように裏切[うらぎ]り、曲[ま]がった弓[ゆみ]のようにねじれた。"
  58: "彼[かれ]らは自分[じぶん]たちの丘[おか]の上[うえ]で神[かみ]を怒[いか]らせ、その彫[ほ]り物[もの]で神[かみ]の嫉[ねた]みを引[ひ]き起[お]こした。"
  59: "神[かみ]は聞[き]いてこれを軽[かろ]んじ、イスラエルをひどく退[しりぞ]けられた。"
  60: "神[かみ]はシロの幕屋[まくや]、人[ひと]々[びと]の間[あいだ]に住[す]まわれたご自分[じぶん]の住[す]まいを捨[す]てられた。"
  61: "神[かみ]は彼[かれ]らの力[ちから]を捕虜[ほりょ]とし、その美[うつく]しさを敵[てき]の手[て]に渡[わた]された。"
  62: "神[かみ]はご自分[じぶん]の民[たみ]を剣[つるぎ]に渡[わた]し、その嗣業[しぎょう]を軽[かろ]んじられた。"
  63: "彼[かれ]らの若者[わかもの]たちは火[ひ]に食[く]われ、彼[かれ]らの娘[むすめ]たちは嘆[なげ]かれることもなかった。"
  64: "彼[かれ]らの祭司[さいし]たちは剣[つるぎ]に倒[たお]れ、彼[かれ]らの寡婦[やもめ]たちは泣[な]かれることもない。"
  65: "主[しゅ]は眠[ねむ]る者[もの]のように、ぶどう酒[ぶどうしゅ]に酔[よ]った勇士[ゆうし]のように目[め]を覚[さ]まして立[た]ち上[あ]がられた。"
  66: "主[しゅ]は敵[てき]を後[うしろ]から打[う]ち、彼[かれ]らに永遠[えいえん]の恥[はじ]を与[あた]えられた。"
  67: "主[しゅ]はヨセフの幕屋[まくや]を捨[す]て、エフライムの部族[ぶぞく]を選[えら]ばれなかった。"
  68: "主[しゅ]はユダの部族[ぶぞく]、ご自分[じぶん]が愛[あい]されたシオンの山[やま]を選[えら]ばれた。"
  69: "主[しゅ]はその聖所[せいしょ]を一角獣[いっかくじゅう]のように建[た]て、地[ち]の上[うえ]にそれをとこしえに据[す]えられた。"
  70: "主[しゅ]はその僕[しもべ]ダビデを選[えら]び、羊[ひつじ]の群[む]れから彼[かれ]を取[と]り、"
  71: "子[こ]を産[う]む羊[ひつじ]の後[あと]から彼[かれ]を連[つ]れて来[き]て、ご自分[じぶん]の民[たみ]ヤコブを、その嗣業[しぎょう]イスラエルを牧[ぼく]させられた。"
  72: "彼[かれ]は心[こころ]の純真[じゅんしん]さをもって彼[かれ]らを牧[ぼく]し、巧[たく]みな手[て]で彼[かれ]らを導[みちび]いた。"

notes:
  0: "Συνέσεως τῷ Ασαφ — «Учение Асафа»; 教え. Надписание — стих 0."
  1: "Προσέχετε, λαός μου, τὸν νόμον μου — わたしの民よ、わたしの律法を聞け (προσέχω — «внимать»). κλίνατε τὸ οὖς ὑμῶν εἰς τὰ ῥήματα τοῦ στόματός μου — 口の言葉に耳を傾けよ (κλίνω — «наклонять»)."
  2: "ἀνοίξω ἐν παραβολαῖς τὸ στόμα μου — 口を開いてたとえを語る (παραβολή — «притча»). φθέγξομαι προβλήματα ἀπ᾽ ἀρχῆς — 昔からの謎を説き明かす (πρόβλημα — «загадка»)."
  3: "ὅσα ἠκούσαμεν καὶ ἔγνωμεν — 聞き、知ったこと. οἱ πατέρες ἡμῶν διηγήσαντο ἡμῖν — 父たちが語ってくれた (διηγέομαι — «рассказывать»)."
  4: "οὐκ ἐκρύβη ἀπὸ τῶν τέκνων αὐτῶν εἰς γενεὰν ἑτέραν — 子たちから隠されず、次の世代に (κρύπτω — «скрывать»). ἀπαγγέλλοντες τὰς αἰνέσεις τοῦ κυρίου καὶ τὰς δυναστείας αὐτοῦ καὶ τὰ θαυμάσια αὐτοῦ — 主の賛美、その力、その奇跡を告げ知らせる (δυναστεία — «могущество»)."
  5: "ἀνέστησεν μαρτύριον ἐν Ιακωβ — ヤコブの中に証を立て (μαρτύριον — «свидетельство»). νόμον ἔθετο ἐν Ισραηλ — イスラエルの中に律法を置き. ὅσα ἐνετείλατο τοῖς πατράσιν ἡμῶν τοῦ γνωρίσαι αὐτὰ τοῖς υἱοῖς αὐτῶν — 父たちに命じて子らに知らせよとされた."
  6: "ὅπως ἂν γνῷ γενεὰ ἑτέρα — 次の世代が知るため. υἱοὶ οἱ τεχθησόμενοι — これから生まれる子ら. ἀναστήσονται καὶ ἀπαγγελοῦσιν αὐτὰ τοῖς υἱοῖς αὐτῶν — 立ち上がって自分の子らに告げ知らせる."
  7: "ἵνα θῶνται ἐπὶ τὸν θεὸν τὴν ἐλπίδα αὐτῶν — 神に望みを置くため (τίθημι — «полагать»). μὴ ἐπιλάθωνται τῶν ἔργων τοῦ θεοῦ — 神のわざを忘れず. τὰς ἐντολὰς αὐτοῦ ἐκζητήσουσιν — その戒めを求める (ἐκζητέω — «ревностно искать, исполнять»); 守る."
  8: "γενεὰ σκολιὰ καὶ παραπικραίνουσα — 曲がった逆らう世代 (σκολιός — «кривой»; παραπικραίνω — «огорчать, раздражать»). οὐ κατηύθυνεν τὴν καρδίαν αὐτῆς — 心を正しくせず (κατευθύνω — «направлять»). οὐκ ἐπιστώθη μετὰ τοῦ θεοῦ τὸ πνεῦμα αὐτῆς — その霊が神に忠実でなかった (πιστόω — «делать верным»)."
  9: "υἱοὶ Εφραιμ ἐντείνοντες καὶ βάλλοντες τόξοις — 弓を引き矢を射るエフライムの子ら (ἐντείνω — «натягивать»; βάλλω — «бросать, стрелять»). ἐστράφησαν ἐν ἡμέρᾳ πολέμου — 戦の日に退いた (στρέφω — «поворачивать»)."
  10: "οὐκ ἐφύλαξαν τὴν διαθήκην τοῦ θεοῦ — 神の契約を守らず. ἐν τῷ νόμῳ αὐτοῦ οὐκ ἤθελον πορεύεσθαι — その律法に従って歩むことを望まなかった."
  11: "ἐπελάθοντο τῶν εὐεργεσιῶν αὐτοῦ — 神の善いわざを忘れた (εὐεργεσία — «благодеяние»). τῶν θαυμασίων αὐτοῦ, ὧν ἔδειξεν αὐτοῖς — 彼らに示された奇跡."
  12: "ἐναντίον τῶν πατέρων αὐτῶν — 父たちの目の前で. ἃ ἐποίησεν θαυμάσια ἐν γῇ Αἰγύπτῳ ἐν πεδίῳ Τάνεως — エジプトの地、タネオスの野で行った奇跡 (Τάνεως — Танис/Цоан)."
  13: "διέρρηξεν θάλασσαν καὶ διήγαγεν αὐτούς — 海を裂いて通らせ (διαρρήγνυμι — «разрывать»). ἔστησεν ὕδατα ὡσεὶ ἀσκόν — 水を革袋のように立たせた (ἀσκός — «мех, бурдюк»)."
  14: "ὡδήγησεν αὐτοὺς ἐν νεφέλῃ ἡμέρας — 昼は雲で導き. ὅλην τὴν νύκτα ἐν φωτισμῷ πυρός — 夜は一晩中、火の光で (φωτισμός — «свет»)."
  15: "διέρρηξεν πέτραν ἐν ἐρήμῳ — 荒野で岩を裂き. ἐπότισεν αὐτοὺς ὡς ἐν ἀβύσσῳ πολλῇ — 大きな淵から飲ませるように (ἄβυσσος — «бездна»)."
  16: "ἐξήγαγεν ὕδωρ ἐκ πέτρας — 岩から水を出し. κατήγαγεν ὡς ποταμοὺς ὕδατα — 水を川のように流れさせた."
  17: "προσέθεντο ἔτι τοῦ ἁμαρτάνειν αὐτῷ — さらに罪を重ね (προστίθημι — «прибавлять»). παρεπίκραναν τὸν ὕψιστον ἐν ἀνύδρῳ — 水のない荒野で至高の神を怒らせた."
  18: "ἐξεπείασαν τὸν θεὸν ἐν ταῖς καρδίαις αὐτῶν — 心のうちで神を試み (ἐκπειράζω — «искушать»). τοῦ αἰτῆσαι βρώματα ταῖς ψυχαῖς αὐτῶν — 自分の魂のために食物を求めて."
  19: "κατελάλησαν τοῦ θεοῦ καὶ εἶπαν — 神をののしって言った (καταλαλέω — «говорить против»). Μὴ δυνήσεται ὁ θεὸς ἑτοιμάσαι τράπεζαν ἐν ἐρήμῳ — 神は荒野で食卓を整えることができるか. Слова народа — 「」."
  20: "ἐπεὶ ἐπάταξεν πέτραν καὶ ἐρρύησαν ὕδατα — 岩を打つと水が流れ出た (ῥέω — «течь»). χείμαρροι κατεκλύσθησαν — 川があふれた (κατακλύζω — «затоплять»). μὴ καὶ ἄρτον δύναται δοῦναι ἢ ἑτοιμάσαι τράπεζαν τῷ λαῷ αὐτοῦ — パンを与え、民に食卓を整えることができるか; продолжение речи — 「」."
  21: "ἤκουσεν κύριος καὶ ἀνεβάλετο — 主は聞いた (ἀναβάλλομαι — тёмное слово, «отложил»; передано по смыслу «воспылал»). πῦρ ἀνήφθη ἐν Ιακωβ — 火はヤコブに燃え (ἀνάπτω — «зажигать»). ὀργὴ ἀνέβη ἐπὶ τὸν Ισραηλ — 怒りはイスラエルに上った."
  22: "οὐκ ἐπίστευσαν ἐν τῷ θεῷ — 神を信じず. οὐδὲ ἤλπισαν ἐπὶ τὸ σωτήριον αὐτοῦ — その救いを寄り頼まなかった (σωτήριον — «спасение»)."
  23: "ἐνετείλατο νεφέλαις ὑπεράνωθεν — 上の雲に命じ (ὑπεράνωθεν — «свыше»). θύρας οὐρανοῦ ἀνέῳξεν — 天の扉を開いた."
  24: "ἔβρεξεν αὐτοῖς μαννα φαγεῖν — マンナを雨らして食べさせ (βρέχω — «орошать»). ἄρτον οὐρανοῦ ἔδωκεν αὐτοῖς — 天のパンを与えた."
  25: "ἄρτον ἀγγέλων ἔφαγεν ἄνθρωπος — 人は天使のパンを食べた. ἐπισιτισμὸν ἀπέστειλεν αὐτοῖς εἰς πλησμονήν — 満ち足りるほどの食を送った (ἐπισιτισμός — «продовольствие»; πλησμονή — «изобилие»)."
  26: "ἀπῆρεν νότον ἐξ οὐρανοῦ — 天から南風を起こし (νότος — «южный ветер»). ἐπήγαγεν ἐν τῇ δυναστείᾳ αὐτοῦ λίβα — 力によって南西の風を引き寄せた (λίψ — «юго-западный ветер»)."
  27: "ἔβρεξεν ἐπ᾽ αὐτοὺς ὡσεὶ χοῦν σάρκας — 肉を塵のように降らせ (χοῦς — «пыль, прах»). ὡσεὶ ἄμμον θαλασσῶν πετεινὰ πτερωτά — 翼ある鳥を海の砂のように."
  28: "ἐπέπεσον εἰς μέσον τῆς παρεμβολῆς αὐτῶν — 陣営のただ中に落ちた (παρεμβολή — «стан»). κύκλῳ τῶν σκηνωμάτων αὐτῶν — 住まいの周りに."
  29: "ἐφάγοσαν καὶ ἐνεπλήσθησαν σφόδρα — 食べて十分に飽き足りた. τὴν ἐπιθυμίαν αὐτῶν ἤνεγκεν αὐτοῖς — 彼らの望むものを与えた (ἐπιθυμία — «желание»)."
  30: "οὐκ ἐστερήθησαν ἀπὸ τῆς ἐπιθυμίας αὐτῶν — не были лишены желания своего, 欲望を満たされた (στερέω — «лишать»). ἔτι τῆς βρώσεως αὐτῶν οὔσης ἐν τῷ στόματι αὐτῶν — 食物がまだ口にあるうちに."
  31: "ὀργὴ τοῦ θεοῦ ἀνέβη ἐπ᾽ αὐτούς — 神の怒りが上った. ἀπέκτεινεν ἐν τοῖς πίοσιν αὐτῶν — 肥えた者たちを殺した (πίων — «тучный»). τοὺς ἐκλεκτοὺς τοῦ Ισραηλ συνεπόδισεν — イスラエルの選ばれた者たちを打ち倒した (συμποδίζω — «низвергать»)."
  32: "ἐν πᾶσιν τούτοις ἥμαρτον ἔτι — それでもなお罪を犯し. οὐκ ἐπίστευσαν ἐν τοῖς θαυμασίοις αὐτοῦ — その奇跡を信じなかった."
  33: "ἐξέλιπον ἐν ματαιότητι αἱ ἡμέραι αὐτῶν — 日々はむなしく過ぎ去り (ματαιότης — «суета»). τὰ ἔτη αὐτῶν μετὰ σπουδῆς — 年々は慌ただしさのうちに (σπουδή — «поспешность»)."
  34: "ὅταν ἀπέκτεννεν αὐτούς — 神が彼らを殺すと. ἐξεζήτουν αὐτὸν καὶ ἐπέστρεφον — 神を求めて向きを変え. ὤρθριζον πρὸς τὸν θεόν — 朝早くから神のもとへ急いだ (ὀρθρίζω — «вставать рано»)."
  35: "ἐμνήσθησαν ὅτι ὁ θεὸς βοηθὸς αὐτῶν ἐστιν — 神が自分たちの助けであることを思い起した. ὁ θεὸς ὁ ὕψιστος λυτρωτὴς αὐτῶν ἐστιν — 至高の神が自分たちを贖う方である (λυτρωτής — «избавитель»)."
  36: "ἠπάτησαν αὐτὸν ἐν τῷ στόματι αὐτῶν — 口で神を欺き (ἀπατάω — «обманывать»). τῇ γλώσσῃ αὐτῶν ἐψεύσαντο αὐτῷ — 舌で神にうそをついた."
  37: "ἡ καρδία αὐτῶν οὐκ εὐθεῖα μετ᾽ αὐτοῦ — 心は神に対して正しくなく. οὐδὲ ἐπιστώθησαν ἐν τῇ διαθήκῃ αὐτοῦ — その契約に忠実でもなかった."
  38: "αὐτὸς δέ ἐστιν οἰκτίρμων — 神はあわれみ深い (οἰκτίρμων — «милосердный»). ἱλάσεται ταῖς ἁμαρτίαις αὐτῶν — 罪を赦す (ἱλάσκομαι — «умилостивлять, прощать»). πληθυνεῖ τοῦ ἀποστρέψαι τὸν θυμὸν αὐτοῦ — しばしば怒りを退ける (πληθύνω — «умножать»). οὐχὶ ἐκκαύσει πᾶσαν τὴν ὀργὴν αὐτοῦ — 憤りをことごとく燃え上がらせない."
  39: "ἐμνήσθη ὅτι σάρξ εἰσιν — 彼らが肉にすぎないことを思い出した. πνεῦμα πορευόμενον καὶ οὐκ ἐπιστρέφον — 過ぎ去って帰らない霊."
  40: "ποσάκις παρεπίκραναν αὐτὸν ἐν τῇ ἐρήμῳ — 荒野で何度も神を悲しませたか. παρώργισαν αὐτὸν ἐν γῇ ἀνύδρῳ — 水のない地で神を怒らせた."
  41: "ἐπέστρεψαν καὶ ἐπείρασαν τὸν θεόν — また向きを変えて神を試み. τὸν ἅγιον τοῦ Ισραηλ παρώξυναν — イスラエルの聖なる方を怒らせた (παροξύνω — «раздражать»)."
  42: "οὐκ ἐμνήσθησαν τῆς χειρὸς αὐτοῦ — 神の手を思い出さなかった. ἡμέρας, ἧς ἐλυτρώσατο αὐτοὺς ἐκ χειρὸς θλίβοντος — 苦しめる者の手から贖われた日 (θλίβω — «теснить»)."
  43: "ὡς ἔθετο ἐν Αἰγύπτῳ τὰ σημεῖα αὐτοῦ — エジプトでそのしるしを置いた. τὰ τέρατα αὐτοῦ ἐν πεδίῳ Τάνεως — タネオスの野でその奇跡を (τέρας — «знамение, чудо»)."
  44: "μετέστρεψεν εἰς αἷμα τοὺς ποταμοὺς αὐτῶν — 川を血に変えた (μεταστρέφω — «превращать»). τὰ ὀμβρήματα αὐτῶν — 流れ (ὄμβρημα — «поток»). ὅπως μὴ πίωσιν — 飲めないように."
  45: "ἐξαπέστειλεν εἰς αὐτοὺς κυνόμυιαν — あぶを送った (κυνόμυια — «песья муха»). κατέφαγεν αὐτούς — 彼らを食い尽くした. βάτραχον — かえる. διέφθειρεν αὐτούς — 彼らを滅ぼした (διαφθείρω — «губить»)."
  46: "ἔδωκεν τῇ ἐρυσίβῃ τὸν καρπὸν αὐτῶν — 実を青虫に与えた (ἐρυσίβη — «ржавчина»; в LXX рядом с ἀκρίς, передано 青虫). τοὺς πόνους αὐτῶν τῇ ἀκρίδι — 労苦をいなごに (ἀκρίς — «саранча»)."
  47: "ἀπέκτεινεν ἐν χαλάζῃ τὴν ἄμπελον αὐτῶν — 雹でぶどうを打った (χάλαζα — «град»). τὰς συκαμίνους αὐτῶν ἐν τῇ πάχνῃ — 桑の木を霜で (συκάμινος — «шелковица»; πάχνη — «иней»)."
  48: "παρέδωκεν εἰς χάλαζαν τὰ κτήνη αὐτῶν — 家畜を雹に渡した. τὴν ὕπαρξιν αὐτῶν τῷ πυρί — 財産を炎に (ὕπαρξις — «имущество»)."
  49: "ὀργὴν θυμοῦ αὐτοῦ — 怒りの炎. θυμὸν καὶ ὀργὴν καὶ θλῖψιν — 憤りと怒りと苦難. ἀποστολὴν δι᾽ ἀγγέλων πονηρῶν — 悪い天使たちによる使い (ἀποστολή — «посольство»)."
  50: "ὡδοποίησεν τρίβον τῇ ὀργῇ αὐτοῦ — 怒りのために道を平らにした (ὁδοποιέω — «уравнивать путь»). οὐκ ἐφείσατο ἀπὸ θανάτου τῶν ψυχῶν αὐτῶν — 魂を死から免れさせなかった (φείδομαι — «щадить»). τὰ κτήνη αὐτῶν εἰς θάνατον συνέκλεισεν — 家畜を死に閉じ込めた."
  51: "ἐπάταξεν πᾶν πρωτότοκον ἐν Αἰγύπτῳ — エジプトのすべての初子を打った. ἀπαρχὴν τῶν πόνων αὐτῶν — 労苦の初め (ἀπαρχή — «начаток»). ἐν τοῖς σκηνώμασι Χαμ — ハムの幕屋のうちに."
  52: "ἀπῆρεν ὡς πρόβατα τὸν λαὸν αὐτοῦ — 民を羊のように引き出した. ἀνήγαγεν αὐτοὺς ὡς ποίμνιον ἐν ἐρήμῳ — 荒野で羊の群れのように導いた (ποίμνιον — «стадо»)."
  53: "ὡδήγησεν αὐτοὺς ἐν ἐλπίδι — 望みのうちに導いた. οὐκ ἐδειλίασαν — 恐れなかった (δειλιάω — «робеть»). τοὺς ἐχθροὺς αὐτῶν ἐκάλυψεν θάλασσα — 海が敵を覆った."
  54: "εἰσήγαγεν αὐτοὺς εἰς ὅριον ἁγιάσματος αὐτοῦ — その聖なる境へ導き入れた (ὅριον — «предел»). ὄρος τοῦτο, ὃ ἐκτήσατο ἡ δεξιὰ αὐτοῦ — 右の手で獲たこの山."
  55: "ἐξέβαλεν ἀπὸ προσώπου αὐτῶν ἔθνη — 彼らの前から諸民を追い出した. ἐκληροδότησεν αὐτοὺς ἐν σχοινίῳ κληροδοσίας — 測り縄で嗣業を分け与えた (σχοινίον — «вервь, мера»). κατεσκήνωσεν... τὰς φυλὰς τοῦ Ισραηλ — イスラエルの部族を住まわせた."
  56: "ἐπείρασαν καὶ παρεπίκραναν τὸν θεὸν τὸν ὕψιστον — 神を試み、至高の神を怒らせた. τὰ μαρτύρια αὐτοῦ οὐκ ἐφυλάξαντο — その証を守らなかった (μαρτύριον — «свидетельство»)."
  57: "ἀπέστρεψαν καὶ ἠσυνθέτησαν — 退いて裏切った (ἀσυνθετέω — «нарушать договор»). μετεστράφησαν εἰς τόξον στρεβλὸν — 曲がった弓のようにねじれた (στρεβλός — «кривой»)."
  58: "παρώργισαν αὐτὸν ἐν τοῖς βουνοῖς αὐτῶν — 丘の上で神を怒らせた (βουνός — «холм»). ἐν τοῖς γλυπτοῖς αὐτῶν παρεζήλωσαν αὐτόν — 彫り物で神の嫉みを引き起こした (γλυπτόν — «изваяние»; παραζηλόω — «возбуждать ревность»)."
  59: "ἤκουσεν ὁ θεὸς καὶ ὑπερεῖδεν — 神は聞いてこれを軽んじた (ὑπεροράω — «презирать»). ἐξουδένωσεν σφόδρα τὸν Ισραηλ — イスラエルをひどく退けた (ἐξουδενόω — «уничижать»)."
  60: "ἀπώσατο τὴν σκηνὴν Σηλωμ — シロの幕屋を捨てた (Σηλωμ — Силом). σκήνωμα αὐτοῦ, οὗ κατεσκήνωσεν ἐν ἀνθρώποις — 人々の間に住まわれたその住まい."
  61: "παρέδωκεν εἰς αἰχμαλωσίαν τὴν ἰσχὺν αὐτῶν — 力を捕虜とした (αἰχμαλωσία — «плен»). τὴν καλλονὴν αὐτῶν εἰς χεῖρας ἐχθροῦ — 美しさを敵の手に (καλλονή — «красота»)."
  62: "συνέκλεισεν εἰς ῥομφαίαν τὸν λαὸν αὐτοῦ — 民を剣に渡した (ῥομφαία — «меч»). τὴν κληρονομίαν αὐτοῦ ὑπερεῖδεν — 嗣業を軽んじた."
  63: "τοὺς νεανίσκους αὐτῶν κατέφαγεν πῦρ — 若者たちは火に食われた. αἱ παρθένοι αὐτῶν οὐκ ἐπενθήθησαν — 娘たちは嘆かれることもなかった (πενθέω — «оплакивать»)."
  64: "οἱ ἱερεῖς αὐτῶν ἐν ῥομφαίᾳ ἔπεσαν — 祭司たちは剣に倒れた. αἱ χῆραι αὐτῶν οὐ κλαυσθήσονται — 寡婦たちは泣かれることもない (κλαίω — «плакать»)."
  65: "ἐξηγέρθη ὡς ὁ ὑπνῶν κύριος — 主は眠る者のように目を覚ました. ὡς δυνατὸς κεκραιπαληκὼς ἐξ οἴνου — ぶどう酒に酔った勇士のように (κραιπαλάω — «быть охмелевшим»)."
  66: "ἐπάταξεν τοὺς ἐχθροὺς αὐτοῦ εἰς τὰ ὀπίσω — 敵を後ろから打った. ὄνειδος αἰώνιον ἔδωκεν αὐτοῖς — 永遠の恥を与えた (ὄνειδος — «поношение»)."
  67: "ἀπώσατο τὸ σκήνωμα Ιωσηφ — ヨセフの幕屋を捨てた. τὴν φυλὴν Εφραιμ οὐκ ἐξελέξατο — エフライムの部族を選ばなかった."
  68: "ἐξελέξατο τὴν φυλὴν Ιουδα — ユダの部族を選んだ. τὸ ὄρος τὸ Σιων, ὃ ἠγάπησεν — 愛されたシオンの山."
  69: "ᾠκοδόμησεν ὡς μονοκερώτων τὸ ἁγίασμα αὐτοῦ — 聖所を一角獣のように建てた (μονόκερως — «единорог»; в евр. «как высоты»). ἐν τῇ γῇ ἐθεμελίωσεν αὐτὴν εἰς τὸν αἰῶνα — 地の上にそれをとこしえに据えた (θεμελιόω — «основывать»)."
  70: "ἐξελέξατο Δαυιδ τὸν δοῦλον αὐτοῦ — その僕ダビデを選んだ. ἀνέλαβεν αὐτὸν ἐκ τῶν ποιμνίων τῶν προβάτων — 羊の群れから彼を取った."
  71: "ἐξόπισθεν τῶν λοχευομένων — 子を産む羊の後ろから (λοχεύομαι — «рожать»). ἔλαβεν αὐτὸν ποιμαίνειν Ιακωβ τὸν λαὸν αὐτοῦ — ご自分の民ヤコブを牧させるために彼を連れて来た. Ισραηλ τὴν κληρονομίαν αὐτοῦ — その嗣業イスラエル."
  72: "ἐποίμανεν αὐτοὺς ἐν τῇ ἀκακίᾳ τῆς καρδίας αὐτοῦ — 心の純真さをもって牧した (ἀκακία — «незлобие, простота»). ἐν ταῖς συνέσεσι τῶν χειρῶν αὐτοῦ ὡδήγησεν αὐτούς — 巧みな手で導いた (σύνεσις — «разумение, уменье»)."
