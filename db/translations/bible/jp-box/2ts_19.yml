verses:
  1: "王[おう]は心[こころ]を騒[さわ]がせ、門[もん]の上[うえ]の部屋[へや]へ上[のぼ]って泣[な]いた。そして歩[ある]きながらこう言[い]った。「わが子[こ]アブサロム、わが子よ、わが子アブサロム。だれがわたしを、あなたの代[か]わりに死[し]なせてくれるだろうか。わたしが、あなたの代わりに。アブサロム、わが子よ、わが子よ。」"
  2: "人々[ひとびと]はヨアブに告[つ]げて言[い]った。「見[み]よ、王[おう]はアブサロムのことで泣[な]き、悲[かな]しんでいる。」"
  3: "その日[ひ]、勝利[しょうり]は民[たみ]すべてにとって悲[かな]しみとなった。民がその日、「王[おう]はわが子[こ]のことで悲しんでいる」と言[い]うのを聞[き]いたからである。"
  4: "民[たみ]はその日[ひ]、町[まち]に入[はい]るとき、こっそりと入った。戦[いくさ]で逃[に]げた者[もの]たちが恥[は]じてこっそり入るのと同[おな]じであった。"
  5: "王[おう]は顔[かお]を隠[かく]し、大[おお]きな声[こえ]で叫[さけ]んで言[い]った。「わが子[こ]アブサロム、アブサロム、わが子よ。」"
  6: "ヨアブは王[おう]のところへ家[いえ]に入[はい]って言[い]った。「あなたは今日[きょう]、あなたを救[すく]い出[だ]したしもべたちすべての顔[かお]に恥[はじ]を負[お]わせた。今日、あなたの息子[むすこ]たち、娘[むすめ]たち、妻[つま]たち、そばめたちの命[いのち]を救った者[もの]たちの顔に。"
  7: "あなたは自分[じぶん]を憎[にく]む者[もの]を愛[あい]し、自分を愛する者を憎んでいる。今日、あなたには支配者[しはいしゃ]も若者[わかもの]もいないことが明[あき]らかになった。今日わたしは知[し]った。アブサロムが生[い]きていて、わたしたちがみな死[し]んでいたほうが、あなたの目[め]に正[ただ]しく見[み]えたであろう、と。"
  8: "だから今[いま]、立[た]って出[で]て、しもべたちの心[こころ]に語[かた]りなさい。わたしは主[しゅ]によって誓[ちか]った。もし今日あなたが出て行かなければ、今夜[こんや]、あなたとともに宿[やど]る者[もの]は一人[ひとり]もいなくなる。これを悟[さと]りなさい。これは、あなたの若[わか]い時[とき]から今に至[いた]るまで、あなたに降[ふ]りかかったどの災[わざわ]いよりも、あなたにとって悪[わる]いことである。」"
  9: "王[おう]は立[た]って門[もん]に座[すわ]った。民[たみ]すべてに「見[み]よ、王は門に座っている」と告[つ]げた。民はすべて王の前[まえ]に出[で]た。イスラエルはみな、それぞれ自分[じぶん]の天幕[てんまく]へ逃[に]げた。"
  10: "民[たみ]はすべて、イスラエルの全部族[ぶぞく]で論[ろん]じ合[あ]って言[い]った。「ダビデ王[おう]はわたしたちをすべての敵[てき]から救[すく]い出[だ]し、ペリシテ人[じん]の手[て]から引[ひ]き出[だ]した。しかし今、彼[かれ]はアブサロムのゆえに、この地[ち]と自分の王国[おうこく]から逃[に]げている。"
  11: "わたしたちが自分[じぶん]たちの上[うえ]に油[あぶら]を注[そそ]いだアブサロムは、戦[いくさ]で死[し]んだ。それなのに今、なぜあなたがたは、王[おう]を連[つ]れ戻[もど]すことに黙[だま]っているのか。」イスラエルすべての言葉[ことば]は、王のもと、その家[いえ]に届[とど]いた。"
  12: "ダビデ王[おう]は祭司[さいし]サドクとアビアタルに人[ひと]を遣[つか]わして言[い]った。「ユダの長老[ちょうろう]たちに語[かた]って言いなさい。なぜ、あなたがたは王をその家[いえ]へ連[つ]れ戻[もど]すのに最後[さいご]になろうとするのか。」"
  13: "「あなたがたはわたしの兄弟[きょうだい]、わたしの骨[ほね]と肉[にく]である。なぜ、あなたがたは王[おう]をその家[いえ]へ連れ戻すのに最後[さいご]になろうとするのか。」"
  14: "「また、アマサに言いなさい。『あなたはわたしの骨[ほね]と肉[にく]ではないか。もしあなたが、すべての日にわたってヨアブに代[か]わって、わたしの前[まえ]で軍勢[ぐんぜい]の長[ちょう]にならないなら、神[かみ]がわたしにこのようにし、さらにこのように加[くわ]えられるように。』」"
  15: "彼[かれ]はユダのすべての人の心[こころ]を、一人[ひとり]の人のように傾[かたむ]けた。そして王[おう]に人[ひと]を遣[つか]わして言[い]った。「あなたも、あなたのしもべたちもすべて、帰[かえ]って来[き]てください。」"
  16: "王[おう]は帰[かえ]ってヨルダンまで来[き]た。ユダの人[ひと]たちは、王を迎[むか]え、王をヨルダンの向[む]こうへ渡[わた]すためにギルガルへ来た。"
  17: "ベニヤミン人[じん]、バフリムのゲラの子[こ]シメイは急[いそ]いで、ユダの人[ひと]たちとともにダビデ王[おう]を迎[むか]えに下[くだ]った。"
  18: "彼[かれ]とともにベニヤミンから千人[せんにん]の者[もの]がいた。サウルの家[いえ]の若者[わかもの]ツィバも、その息子[むすこ]十五人[じゅうごにん]としもべ二十人[にじゅうにん]を伴[ともな]って彼とともにいた。彼らは王[おう]の前[まえ]でヨルダンをまっすぐに渡[わた]った。"
  19: "人々[ひとびと]は王[おう]を渡[わた]すために務[つ]めを果[は]たした。渡[わた]しの者[もの]たちが王の家[いえ]を移[うつ]し、王の目[め]に正[ただ]しいことを行[おこな]うためであった。ゲラの子[こ]シメイは、王がヨルダンを渡るとき、王の前[まえ]で顔[かお]を地[ち]につけて伏[ふ]した。"
  20: "そして王[おう]に言[い]った。「わが主人[しゅじん]よ、どうか不法[ふほう]を思[おも]い巡[めぐ]らさないでください。しもべが犯[おか]したすべてのことを心[こころ]に留[と]めないでください。あの日[ひ]、わが主人である王[おう]がエルサレムから出[で]て行[い]かれた日、しもべが犯したすべてのことを。王がそれを心に置[お]かれることのないように。"
  21: "しもべは知[し]っている。わたしが罪[つみ]を犯[おか]したことを。そして見[み]よ、今日[きょう]、ヨセフの家[いえ]のすべてに先[さき]だって、わが主人[しゅじん]である王[おう]を迎[むか]えに下[くだ]って来[き]た。」"
  22: "ツルヤの子[こ]アベシャは答[こた]えて言[い]った。「このことのゆえに、シメイは殺[ころ]されないのか。彼[かれ]は主[しゅ]の油[あぶら]を注[そそ]がれた者[もの]を呪[のろ]ったのだ。」"
  23: "ダビデは言[い]った。「ツルヤの子[こ]らよ、わたしとあなたがたと何[なん]の関[かか]わりがあるのか。なぜ今日[きょう]、あなたがたはわたしの敵[てき]となるのか。今日、イスラエルから一人[ひとり]も殺[ころ]されてはならない。わたしは今日、イスラエルの上[うえ]に王[おう]として治[おさ]めていると知[し]っているからだ。」"
  24: "王[おう]はシメイに言[い]った。「あなたは死[し]なない。」そして王は彼[かれ]に誓[ちか]った。"
  25: "サウルの子[こ]ヨナタンの子[こ]メフィボシェトは、王[おう]を迎[むか]えに下[くだ]った。彼[かれ]は王[おう]が出発[しゅっぱつ]した日[ひ]から、平和[へいわ]のうちに帰[かえ]って来[く]る日まで、足[あし]の手入[てい]れもせず、爪[つめ]も切[き]らず、口[くち]ひげも整[ととの]えず、衣[ころも]も洗[あら]わなかった。"
  26: "彼[かれ]がエルサレムに入[はい]って王[おう]を迎[むか]えたとき、王は彼[かれ]に言[い]った。「メフィボシェト、なぜあなたはわたしとともに来[こ]なかったのか。」"
  27: "メフィボシェトは彼[かれ]に言[い]った。「わが主人[しゅじん]、王[おう]よ。しもべのしもべがわたしを欺[あざむ]いた。このしもべが彼[かれ]に『ろばに鞍[くら]を置[お]いてください。それに乗[の]って王[おう]のもとへ行[い]く。しもべは足[あし]が不自由[ふじゆう]なのだから』と言[い]ったのに。"
  28: "そして彼[かれ]は、しもべのことをわが主人[しゅじん]である王[おう]に讒言[ざんげん]した。しかし、わが主人である王は神[かみ]の使[つか]いのようだ。あなたの目[め]に良[よ]いと思[おも]うことを行[おこな]ってください。"
  29: "わたしの父[ちち]の家[いえ]はすべて、わが主人[しゅじん]である王[おう]にとって、死[し]に定[さだ]められた者[もの]たちにすぎなかった。それなのにあなたは、このしもべをあなたの食卓[しょくたく]で食[た]べる者たちの中[なか]に置[お]いてくださった。これ以上[いじょう]、わたしにどんな訴[うった]えの権利[けんり]があり、王[おう]に叫[さけ]ぶことがあるだろうか。」"
  30: "王[おう]は彼[かれ]に言[い]った。「なぜ、あなたはなおも自分の言葉[ことば]を語[かた]るのか。わたしは言[い]った。あなたとツィバは畑[はたけ]を分[わ]け合[あ]いなさい、と。」"
  31: "メフィボシェトは王[おう]に言[い]った。「すべてを彼[かれ]に取[と]らせてください。わが主人[しゅじん]である王[おう]が、平和[へいわ]のうちに自分の家[いえ]に帰[かえ]って来[こ]られたのだから。」"
  32: "ギレアデ人[じん]ベルゼリはロゲリムから下[くだ]って来[き]て、王[おう]とともにヨルダンを渡[わた]り、王をヨルダンの向[む]こうへ送[おく]り出[だ]そうとした。"
  33: "ベルゼリは非常[ひじょう]に年[とし]を取[と]った人[ひと]で、八十歳[はちじゅっさい]であった。彼[かれ]は、王[おう]がマハナイムに住[す]んでいたとき王を養[やしな]った。非常[ひじょう]に大[おお]きな人[ひと]であったからである。"
  34: "王[おう]はベルゼリに言[い]った。「あなたはわたしとともに渡[わた]りなさい。わたしはエルサレムで、あなたとともにあなたの老後[ろうご]を養[やしな]おう。」"
  35: "ベルゼリは王[おう]に言[い]った。「わたしの一生[いっしょう]の年月[としつき]はどれほどあるだろうか。なぜ、わたしは王[おう]とともにエルサレムへ上[のぼ]らねばならないのだろうか。"
  36: "わたしは今日[きょう]、八十歳[はちじゅっさい]だ。善[ぜん]と悪[あく]の違[ちが]いが分[わ]かるだろうか。しもべはまだ、食[た]べるもの、飲[の]むものの味[あじ]が分かるだろうか。歌[うた]う男[おとこ]たち、歌う女[おんな]たちの声[こえ]をまだ聞[き]くことができるだろうか。なぜ、しもべはなおも、わが主人[しゅじん]である王[おう]の重荷[ににもつ]とならねばならないのだろうか。"
  37: "しもべは王[おう]とともにヨルダンをほんの少[すこ]し渡[わた]るだけだ。なぜ、王[おう]はわたしにこのような報[むく]いを返[かえ]してくださるのか。"
  38: "どうか、しもべを帰[かえ]らせてください。わたしは自分[じぶん]の町[まち]で、父[ちち]と母[はは]の墓[はか]のそばで死[し]ぬ。しかし見[み]よ、しもべの子[こ]ハマアムが、わが主人[しゅじん]である王[おう]とともに渡[わた]る。彼[かれ]に、あなたの目[め]に良[よ]いと思[おも]うことを行[おこな]ってください。」"
  39: "王[おう]は言[い]った。「ハマアムはわたしとともに渡[わた]りなさい。わたしは彼[かれ]に、あなたの目[め]に良[よ]いことをしよう。あなたがわたしに望[のぞ]むことは何[なん]でも、あなたのためにしよう。」"
  40: "民[たみ]はすべてヨルダンを渡[わた]り、王[おう]も渡った。王はベルゼリに口[くち]づけし、彼[かれ]を祝福[しゅくふく]した。そして彼は自分[じぶん]の場所[ばしょ]へ帰[かえ]った。"
  41: "王[おう]はギルガルへ渡[わた]り、ハマアムも彼[かれ]とともに渡った。ユダの民[たみ]はすべて王[おう]とともに渡り、イスラエルの民[たみ]の半分[はんぶん]も渡った。"
  42: "見[み]よ、イスラエルの人[ひと]はすべて王[おう]のもとに来[き]て、王に言[い]った。「なぜ、わたしたちの兄弟[きょうだい]であるユダの人[ひと]たちがあなたを盗[ぬす]み、王[おう]とその家[いえ]、ダビデの者[もの]すべてを、王とともにヨルダンへ渡[わた]したのか。」"
  43: "ユダの人[ひと]はすべて、イスラエルの人[ひと]に答[こた]えて言[い]った。「王[おう]はわたしたちに近[ちか]いからだ。なぜ、このことでそんなに怒[いか]るのか。わたしたちは王から何[なに]か食[た]べたのか。彼[かれ]がわたしたちに贈[おく]り物[もの]をしたのか、何かを取[と]り上[あ]げたのか。」"
  44: "イスラエルの人[ひと]はユダの人[ひと]に答[こた]えて言[い]った。「わたしには王[おう]に対して十[じゅう]の手[て]がある。また、わたしはあなたよりも長子[ちょうし]である。ダビデにおいても、わたしはあなたにまさっている。なぜ、あなたはわたしをこのように辱[はずかし]めたのか。王[おう]を連[つ]れ戻[もど]すのに、わたしの言葉[ことば]がまず取[と]り上[あ]げられなかったのか。」ユダの人[ひと]の言葉[ことば]は、イスラエルの人の言葉よりも強[つよ]かった。"

notes:
  1: "ἐταράχθη — смутился, пришёл в смятение (ταράσσω). ἀνέβη εἰς τὸ ὑπερῷον τῆς πύλης — взошёл в горницу над воротами (ὑπερῷον; слав. «на горницу яже на вратех»). τίς δῴη — «кто дал бы» (оптатив δίδωμι, формула желания). Этот плач в csl/ru стоит как 18:33 (у них в гл. 18 — 33 стиха, в gr — 32), поэтому в гл. 19 их нумерация на единицу меньше: csl 19:1 = gr 19:2. Держимся gr."
  2: "ἀνηγγέλη τῷ Ιωαβ λέγοντες — «возвещено было Иоаву, говоря» (безличный оборот; слав. «поведаша иоаву, глаголюще»). πενθεῖ — скорбит, оплакивает (πενθέω)."
  3: "ἡ σωτηρία — спасение, победа (σωτηρία); победа того дня обратилась в плач. εἰς πένθος — в скорбь (πένθος). λυπεῖται — печалится (λυπέω)."
  4: "διεκλέπτετο — крадучись входил (διακλέπτω, имперфект). οἱ αἰσχυνόμενοι — стыдящиеся. ἐν τῷ αὐτοὺς φεύγειν ἐν τῷ πολέμῳ — когда они бегут с войны."
  5: "ἔκρυψεν τὸ πρόσωπον — закрыл, скрыл лицо своё. ἔκραξεν φωνῇ μεγάλῃ — воззвал громким голосом (κράζω)."
  6: "κατῄσχυνας — посрамил (καταισχύνω). τῶν ἐξαιρουμένων σε — избавляющих тебя (ἐξαιρέω). Фраза не закончена: перечисление продолжается в 7-м стихе, как в греческом."
  7: "τοῦ ἀγαπᾶν… καὶ μισεῖν — «любить… и ненавидеть» (инфинитивы при κατῄσχυνας). ἄρχοντες, παῖδες — князья, отроки. τὸ εὐθὲς ἐν ὀφθαλμοῖς σου — «прямое в очах твоих»."
  8: "ἀναστὰς ἔξελθε — встав, выйди. λάλησον εἰς τὴν καρδίαν — «говори в сердце», т. е. скажи по сердцу, утешь (семитизм). ἐν κυρίῳ ὤμοσα — поклялся Господом. εἰ αὐλισθήσεται — «если переночует» (условная форма вместо отрицания: не переночует). ἐπίγνωθι σεαυτῷ — «уразумей себе». ἐκ νεότητός σου — от юности твоей."
  9: "ἐκάθισεν ἐν τῇ πύλῃ — сел у ворот. ἀνήγγειλαν λέγοντες — возвестили, говоря. εἰς τὰ σκηνώματα αὐτοῦ — по шатрам своим."
  10: "ἐρρύσατο — избавил (ῥύομαι). ἐξείλατο ἐκ χειρὸς ἀλλοφύλων — изъял из руки иноплеменников (ἐξαιρέω). πέφευγεν — убежал (перфект φεύγω). Речь продолжается в 11-м стихе."
  11: "ὃν ἐχρίσαμεν — которого мы помазали. κωφεύετε — «глухи вы», т. е. медлите, молчите (κωφεύω). ῥῆμα — слово, дело. В csl добавлено «в дом его» — внесено в основной текст."
  12: "ἀπέστειλεν πρὸς Σαδωκ καὶ Αβιαθαρ — послал к Садоку и Авиафару. πρεσβύτεροι Ιουδα — старейшины Иуды. ἵνα τί γίνεσθε ἔσχατοι — почему вы делаетесь последними."
  13: "ἀδελφοί μου ὑμεῖς, ὀστᾶ μου καὶ σάρκες μου — «вы братья мои, кости мои и плоть моя». Вопрос из 12-го стиха повторён (в LXX и слав. он стоит дважды)."
  14: "τῷ Αμεσσαι ἐρεῖτε — Амессаю скажите. τάδε ποιήσαι μοι ὁ θεὸς καὶ τάδε προσθείη — «то и то да сотворит мне Бог и да приложит» (клятвенная формула). ἄρχων δυνάμεως — начальник войска. ἀντὶ Ιωαβ — вместо Иоава."
  15: "ἔκλινεν τὴν καρδίαν — склонил сердце. ὡς ἀνδρὸς ἑνός — как одного человека. ἐπιστράφητι — возвратись (императив ἐπιστρέφω)."
  16: "ἦλθεν ἕως τοῦ Ιορδάνου — дошёл до Иордана. εἰς Γαλγαλα — в Галгал (ギルガル). διαβιβάσαι — переправить."
  17: "ἐτάχυνεν — поспешил (ταχύνω). Σεμει υἱὸς Γηρα — Семей, сын Геры (シメイ). ἐκ Βαουριμ — из Бахурима (バフリム). υἱοῦ τοῦ Ιεμενι — вениамитянин."
  18: "χίλιοι ἄνδρες ἐκ τοῦ Βενιαμιν — тысяча мужей из Вениамина. τὸ παιδάριον τοῦ οἴκου Σαουλ — «отрок дома Саулова», Сива (ツィバ). κατεύθυναν τὸν Ιορδάνην — направили через Иордан, переправились."
  19: "ἐλειτούργησαν τὴν λειτουργίαν — совершили служение (λειτουργία). ἐξεγεῖραι τὸν οἶκον τοῦ βασιλέως — «поднять дом царя», т. е. переправить царское семейство. τὸ εὐθὲς ἐν ὀφθαλμοῖς αὐτοῦ — прямое в очах его. ἔπεσεν ἐπὶ πρόσωπον — пал на лицо."
  20: "μὴ διαλογισάσθω — да не помыслит (διαλογίζομαι). μὴ μνησθῇς — не вспомни. ἠδίκησεν — неправдовал, согрешил (ἀδικέω). τοῦ θέσθαι εἰς τὴν καρδίαν — «положить на сердце», принять к сердцу."
  21: "ἔγνω — узнал, познал. πρότερος παντὸς οἴκου Ιωσηφ — первый из всего дома Иосифа (т. е. Израиля; слав. «первее всего израиля и дому иосифля»). εἰς ἀπαντήν — навстречу."
  22: "ἀντὶ τούτου — за это. οὐ θανατωθήσεται — не будет ли умерщвлён. κατηράσατο — проклял (καταράομαι). χριστὸς κυρίου — помазанник Господень."
  23: "τί ἐμοὶ καὶ ὑμῖν — «что мне и вам» (семитизм: какое мне дело до вас). ἐπίβουλος — злоумышленник, противник. οὐκ οἶδα εἰ — «не знаю, если», т. е. разве я не знаю, что (слав. «не вем ли»)."
  24: "οὐ μὴ ἀποθάνῃς — «не умрёшь» (усиленное отрицание). ὤμοσεν αὐτῷ — поклялся ему."
  25: "οὐκ ἐθεράπευσεν τοὺς πόδας — не ухаживал за ногами (θεραπεύω). ὠνυχίσατο — не стриг ногтей (ὀνυχίζω). τὸν μύστακα — усы, бороду (μύσταξ). οὐκ ἔπλυνεν — не мыл. ἕως… παρεγένετο ἐν εἰρήνῃ — до дня, когда вернулся с миром."
  26: "εἰσῆλθεν εἰς Ιερουσαλημ εἰς ἀπάντησιν — вошёл в Иерусалим навстречу. τί ὅτι — почему же."
  27: "Κύριέ μου βασιλεῦ — «господин мой, царь» (звательный; передано わが主人、王よ, чтобы 主 оставалось именем Бога). παρελογίσατό με — обманул меня (παραλογίζομαι). Ἐπίσαξόν μοι τὴν ὄνον — оседлай мне осла (ἐπισάσσω). ἐπιβῶ — сяду. χωλός — хромой."
  28: "μεθώδευσεν — «обошёл», оболгал, оклеветал (μεθοδεύω). ὡς ἄγγελος τοῦ θεοῦ — как ангел Божий. ποίησον τὸ ἀγαθὸν ἐν ὀφθαλμοῖς σου — сделай доброе в очах твоих."
  29: "οὐκ ἦν… ἀλλ᾽ ἢ ὅτι — «не был… разве только». ἄνδρες θανάτου — мужи смерти, повинные смерти. ἔθηκας ἐν τοῖς ἐσθίουσιν τὴν τράπεζάν σου — посадил есть за стол твой. δικαίωμα — право, оправдание. κεκραγέναι — взывать (κραυγάζω)."
  30: "ἵνα τί λαλεῖς ἔτι — к чему ещё говоришь. διελεῖσθε τὸν ἀγρόν — разделите поле."
  31: "καί γε τὰ πάντα λαβέτω — «пусть возьмёт даже всё». μετὰ τὸ παραγενέσθαι — после того как пришёл."
  32: "Βερζελλι ὁ Γαλααδίτης — Верзеллий Галаадитянин (ベルゼリ). ἐκ Ρωγελλιμ — из Рогеллима (ロゲリム). ἐκπέμψαι — проводить, отправить."
  33: "πρεσβύτερος σφόδρα — очень старый. υἱὸς ὀγδοήκοντα ἐτῶν — «сын восьмидесяти лет», восьмидесятилетний. διέθρεψεν — содержал, кормил (διατρέφω). ἐν Μαναιμ — в Маханаиме. ἀνὴρ μέγας σφόδρα — человек очень большой, богатый (слав. «велий зело»)."
  34: "διαβήσῃ μετ᾽ ἐμοῦ — перейдёшь со мною. διαθρέψω τὸ γῆράς σου — буду кормить старость твою (γῆρας)."
  35: "πόσαι ἡμέραι ἐτῶν ζωῆς μου — сколько дней лет жизни моей. ὅτι ἀναβήσομαι — что мне восходить."
  36: "μὴ γνώσομαι ἀνὰ μέσον ἀγαθοῦ καὶ κακοῦ — различу ли между добрым и злым. γεύσεται — вкусит. ᾀδόντων καὶ ᾀδουσῶν — поющих (ᾄδω). εἰς φορτίον — в тягость, в ношу (φορτίον)."
  37: "ὡς βραχὺ — «как немного», совсем немного. ἀνταποδίδωσίν μοι… τὴν ἀνταπόδοσιν — воздаёт мне воздаяние (ἀνταπόδοσις)."
  38: "καθισάτω — пусть сядет, останется (καθίζω). παρὰ τῷ τάφῳ — у могилы. Χαμααμ — Хамаам (греч.; в евр. Кимгам, ru «Кимгам»). В csl добавлено «сын мой» — внесено в текст."
  39: "διαβήτω — пусть перейдёт. ὅσα ἐκλέξῃ ἐπ᾽ ἐμοί — что ни выберешь на мне, т. е. ни попросишь у меня."
  40: "κατεφίλησεν — поцеловал (καταφιλέω). εὐλόγησεν — благословил. ἐπέστρεψεν εἰς τὸν τόπον αὐτοῦ — возвратился в место своё."
  41: "εἰς Γαλγαλα — в Галгал. διαβαίνοντες — переходя. τὸ ἥμισυ τοῦ λαοῦ Ισραηλ — половина народа Израиля."
  42: "ἔκλεψάν σε — «украли тебя», тайно увели (κλέπτω). διεβίβασαν — переправили (διαβιβάζω). ἄνδρες Δαυιδ — люди Давидовы."
  43: "ἐγγίζει πρός με — близок ко мне. ἐθυμώθης — разгневался (θυμόω). μὴ βρώσει ἐφάγαμεν — «едением ли ели мы» (усиленный оборот). δόμα — дар. ἄρσιν ἦρεν — «поднял поднятие», взял, отнял."
  44: "δέκα χεῖρές μοι ἐν τῷ βασιλεῖ — «десять рук у меня в царе», т. е. десять долей (слав. «десять рук мы у царя»; ru «десять частей»). πρωτότοκος — первенец. ὕβρισας — обесчестил (ὑβρίζω). ἐσκληρύνθη — ожесточилось, окрепло (σκληρύνω). В csl этот стих — 19:43."
