# jp-box, Евангелие от Иоанна, глава 1. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 1: пролог (1–18), свидетельство Иоанна (19–34), первые ученики (35–51).
# Красное (<j>): 1:38, 39, 42, 43, 47, 48, 50, 51 — слова Христа.
# Синего (<mo>) в главе нет. Слова Иоанна Крестителя (1:15, 19–34) — не красные.
# jp-ni не использовался.

tr_code: jp-box
book: in
chapter: 1
draft: true

verses:
  1: "初[はじ]めに言葉[ことば]があった。言葉[ことば]は神[かみ]とともにあった。言葉[ことば]は神[かみ]であった。"
  2: "この言葉[ことば]は初[はじ]めに神[かみ]とともにあった。"
  3: "すべてのものは、この方[かた]によって造[つく]られた。造[つく]られたもののうち、この方[かた]によらずにできたものは一[ひと]つもない。"
  4: "この方[かた]の内[うち]に命[いのち]があった。命[いのち]は人[ひと]の光[ひかり]であった。"
  5: "光[ひかり]は闇[やみ]の中[なか]に輝[かがや]いている。闇[やみ]はそれに打[う]ち勝[か]てなかった。"
  6: "神[かみ]から遣[つか]わされた人[ひと]があった。その名[な]はヨハネであった。"
  7: "この人[ひと]は証[あかし]のために来[き]た。光[ひかり]について証[あかし]し、すべての人[ひと]がこの人[ひと]によって信[しん]じるようになるためであった。"
  8: "彼[かれ]は光[ひかり]ではなかった。光[ひかり]について証[あかし]するために来[き]たのである。"
  9: "まことの光[ひかり]があった。それは、世[よ]に来[く]るすべての人[ひと]を照[てら]す者[もの]である。"
  10: "この方[かた]は世[よ]にあった。世[よ]はこの方[かた]によって造[つく]られたのに、世[よ]はこの方[かた]を知[し]らなかった。"
  11: "この方[かた]は自分[じぶん]のもののもとへ来[き]たが、自分[じぶん]のものはこの方[かた]を受[う]け入[い]れなかった。"
  12: "しかし、この方[かた]を受[う]け入[い]れた者[もの]、すなわちその名[な]を信[しん]じる者[もの]には、神[かみ]の子[こ]となる権[けん]をお与[あた]えになった。"
  13: "その者[もの]たちは、血[ち]によるのでもなく、肉[にく]の意志[いし]によるのでもなく、男[おとこ]の意志[いし]によるのでもなく、神[かみ]によって生[う]まれたのである。"
  14: "言葉[ことば]は肉[にく]となって、わたしたちの間[あいだ]に宿[やど]った。わたしたちはその栄光[えいこう]を見[み]た。父[ちち]のもとからの独[ひと]り子[こ]としての栄光[えいこう]である。この方[かた]は恵[めぐ]みと真理[しんり]とに満[み]ちていた。"
  15: "ヨハネはこの方[かた]について証[あかし]して叫[さけ]んで言[い]った。「わたしが言[い]ったのは、この方[かた]のことである。『わたしの後[あと]から来[く]る方[かた]は、わたしより先[さき]にあった者[もの]だから、わたしの前[まえ]に立[た]つ方[かた]である。』」"
  16: "わたしたちは皆[みな]、この方[かた]の満[み]ち溢[あふ]れるものから受[う]け、恵[めぐ]みの上[うえ]に恵[めぐ]みを受[う]けた。"
  17: "律法[りっぽう]はモーセによって与[あた]えられ、恵[めぐ]みと真理[しんり]はイエス・キリストによって来[き]た。"
  18: "神[かみ]を見[み]た者[もの]は、これまで一人[ひとり]もいない。父[ちち]の懐[ふところ]にいる独[ひと]り子[こ]が、その方[かた]を明[あき]らかにされた。"
  19: "ヨハネの証[あかし]は次[つぎ]のとおりである。ユダヤ人[じん]たちがエルサレムから祭司[さいし]とレビ人[びと]を遣[つか]わして、「あなたはどなたですか」と尋[たず]ねさせたとき、"
  20: "彼[かれ]は告白[こくはく]して、否定[ひてい]しなかった。告白[こくはく]して言[い]った。「わたしはキリストではない。」"
  21: "彼[かれ]らは尋[たず]ねた。「では、あなたはだれか。エリヤか。」彼[かれ]は言[い]った。「そうではない。」「あの預言者[よげんしゃ]か。」彼[かれ]は答[こた]えた。「いや。」"
  22: "そこで彼[かれ]らは言[い]った。「あなたはだれか。わたしたちを遣[つか]わした人[ひと]たちに答[こた]えを返[かえ]さなければならない。あなたは自分[じぶん]のことを何[なん]と言[い]うのか。」"
  23: "彼[かれ]は言[い]った。「わたしは荒[あ]れ野[の]で叫[さけ]ぶ者[もの]の声[こえ]である。『主[しゅ]の道[みち]をまっすぐにせよ』と、預言者[よげんしゃ]イザヤが言[い]ったとおりに。」"
  24: "遣[つか]わされた者[もの]たちはファリサイ派[は]に属[ぞく]する人々[ひとびと]であった。"
  25: "彼[かれ]らは尋[たず]ねて言[い]った。「キリストでもなく、エリヤでもなく、あの預言者[よげんしゃ]でもないのなら、なぜ洗礼[せんれい]を授[さず]けるのか。」"
  26: "ヨハネは彼[かれ]らに答[こた]えて言[い]った。「わたしは水[みず]で洗礼[せんれい]を授[さず]ける。あなたがたの間[あいだ]には、あなたがたの知[し]らない方[かた]が立[た]っている。"
  27: "わたしの後[あと]から来[く]る方[かた]〔は、わたしより先[さき]にあった方[かた]である〕。わたしはその方[かた]の履物[はきもの]のひもを解[と]く値打[ねう]ちもない。」"
  28: "これらのことは、ヨルダン川[がわ]の向[む]こう側[がわ]、ヨハネが洗礼[せんれい]を授[さず]けていたベタバラで起[お]こった。"
  29: "その翌日[よくじつ]、ヨハネはイエスがご自身[じしん]のもとへ来[く]るのを見[み]て言[い]った。「見[み]よ、神[かみ]の子羊[こひつじ]、世[よ]の罪[つみ]を負[お]う方[かた]である。"
  30: "わたしが『わたしの後[あと]から来[く]る方[かた]は、わたしより先[さき]にあった者[もの]だから、わたしの前[まえ]に立[た]つ方[かた]である』と言[い]ったのは、この方[かた]のことである。"
  31: "わたしはこの方[かた]を知[し]らなかった。しかし、この方[かた]がイスラエルに現[あらわ]れるために、わたしは来[き]て、水[みず]で洗礼[せんれい]を授[さず]けているのである。」"
  32: "ヨハネは証[あかし]して言[い]った。「わたしは{聖霊[せいれい]|聖神[せいしん]}が鳩[はと]のように天[てん]から降[くだ]り、この方[かた]の上[うえ]にとどまるのを見[み]た。"
  33: "わたしはこの方[かた]を知[し]らなかった。しかし、水[みず]で洗礼[せんれい]を授[さず]けるためにわたしを遣[つか]わした方[かた]が、わたしにこう言[い]われた。『{聖霊[せいれい]|聖神[せいしん]}が降[くだ]って、ある人[ひと]の上[うえ]にとどまるのをあなたが見[み]たら、その人[ひと]こそ{聖霊[せいれい]|聖神[せいしん]}で洗礼[せんれい]を授[さず]ける者[もの]である』。"
  34: "わたしはそれを見[み]た。そして、この方[かた]が神[かみ]の子[こ]であることを証[あかし]したのである。」"
  35: "その翌日[よくじつ]、ヨハネは再[ふたた]び、弟子[でし]の二人[ふたり]とともに立[た]っていた。"
  36: "そして、イエスが歩[あゆ]いておられるのを見[み]て言[い]った。「見[み]よ、神[かみ]の子羊[こひつじ]である。」"
  37: "二人[ふたり]の弟子[でし]はこの言葉[ことば]を聞[き]いて、イエスに従[したが]った。"
  38: "イエスは振[ふ]り返[かえ]って、彼[かれ]らが従[したが]って来[く]るのをご覧[らん]になり、言[い]われた。「<j>何[なに]を求[もと]めているのか。</j>」彼[かれ]らは言[い]った。「ラビ、どこに泊[と]まっておられるのですか。」"
  39: "イエスは言[い]われた。「<j>来[き]て、見[み]なさい。</j>」彼[かれ]らは来[き]て、どこに泊[と]まっておられるかを見[み]、その日[ひ]はイエスとともに泊[と]まった。時[とき]はおよそ十時[じゅうじ]ごろであった。"
  40: "シモン・ペトロの兄弟[きょうだい]アンデレは、ヨハネから聞[き]いてイエスに従[したが]った二人[ふたり]のうちの一人[ひとり]であった。"
  41: "この人[ひと]はまず自分[じぶん]の兄弟[きょうだい]シモンを見[み]つけて言[い]った。「わたしたちはメシア、すなわちキリストを見[み]つけた。」"
  42: "彼[かれ]はシモンをイエスのもとへ連[つ]れて行[い]った。イエスはシモンを見[み]つめて言[い]われた。「<j>あなたはヨナの子[こ]シモンである。あなたはケファ、すなわちペトロと呼[よ]ばれるようになる。</j>」"
  43: "その翌日[よくじつ]、イエスはガリラヤへ出[で]かかろうとされた。そしてピリポを見[み]つけて言[い]われた。「<j>わたしに従[したが]って来[き]なさい。</j>」"
  44: "ピリポはアンデレとペトロの町[まち]、ベツサイダの出身[しゅっしん]であった。"
  45: "ピリポはナタナエルを見[み]つけて言[い]った。「わたしたちは、モーセが律法[りっぽう]に書[か]き、預言者[よげんしゃ]たちも書[か]いた方[かた]に会[あ]った。ナザレのヨセフの子[こ]、イエスである。」"
  46: "ナタナエルは言[い]った。「ナザレから何[なに]か良[よ]いものが出[で]るだろうか。」ピリポは言[い]った。「来[き]て、見[み]なさい。」"
  47: "イエスはナタナエルがご自身[じしん]のもとへ来[く]るのをご覧[らん]になって、彼[かれ]について言[い]われた。「<j>見[み]よ、この人[ひと]は本当[ほんとう]にイスラエル人[じん]である。その心[こころ]に偽[いつわ]りがない。</j>」"
  48: "ナタナエルは言[い]った。「どうして、わたしをご存[ぞん]じなのですか。」イエスは答[こた]えて言[い]われた。「<j>ピリポがあなたを呼[よ]ぶ前[まえ]に、あなたが無花果[いちじく]の木[き]の下[した]にいるのを、わたしは見[み]ていた。</j>」"
  49: "ナタナエルは答[こた]えて言[い]った。「ラビ、あなたは神[かみ]の子[こ]、あなたはイスラエルの王[おう]です。」"
  50: "イエスは答[こた]えて言[い]われた。「<j>わたしが『あなたを無花果[いちじく]の木[き]の下[した]で見[み]た』と言[い]ったので、あなたは信[しん]じるのか。あなたは、これよりも大[おお]きなことを見[み]るだろう。</j>」"
  51: "そして言[い]われた。「<j>よくよく言[い]っておく。あなたがたは、天[てん]が開[ひら]いているのを、そして神[かみ]の使[つか]いたちが人[ひと]の子[こ]の上[うえ]に上[のぼ]り下[くだ]りするのを見[み]るだろう。</j>」"

notes:
  1: "λόγος — 言葉[ことば] (1:1 и 1:14), как условлено для Иоанна; 初めに — ἐν ἀρχῇ."
  3: "В критическом тексте ὃ γέγονεν («что произошло») стоит в конце 1:3 и продолжается в 1:4; Церковь (Елизаветинская «еже бысть, в том животе бе») читает их с 1:4, jp-joc эти слова опускает. Стихи не объединены: 1:4 начинается с «この方の内に命があった»."
  5: "κατέλαβεν — «не постиг» и «не одолел»; оставлено «打ち勝てなかった» (не одолела). Двусмысленность греческого не снята."
  9: "ἐρχόμενον можно отнести и к «свету» («приходящий в мир»), и к «человеку» («всякий человек, приходящий в мир»). Оставлено по jp-joc: 世に来るすべての人を照らす."
  18: "В критическом μονογενὴς θεός («единородный Бог»); Церковь (Елизаветинская, jp-joc «獨生の子») читает μονογενὴς υἱός — взято церковное «独り子», без 〔〕 (замена, а не добавка)."
  27: "Критический текст: ὁ ὀπίσω μου ἐρχόμενος, οὗ οὐκ εἰμὶ ἄξιος… Церковь (Елизаветинская «но прииде предо мною», jp-joc) добавляет ὃς ἔμπροσθέν μου γέγονεν — 〔は、わたしより先にあった方である〕."
  28: "В критическом Βηθανίᾳ («Вифания»); Церковь (Елизаветинская, jp-joc ワィファワラ) читает Βηθαβαρᾷ — ベタバラ, без 〔〕 (замена имени)."
  34: "В критическом ὁ ἐκλεκτός («избранный»); Церковь (Елизаветинская, jp-joc) читает ὁ υἱός — «神の子», без 〔〕 (замена, а не добавка)."
  38: "Ῥαββί — ラビ; сноска уже стоит при первом упоминании в корпусе (Мф 23:7), поэтому здесь без ⟨⟩."
  39: "ὥρα δεκάτη — десятый час по римскому счёту, около четырёх часов дня. В тексте «十時ごろ», без пересчёта."
  41: "Μεσσίας с глоссой ὅ ἐστιν μεθερμηνευόμενον Χριστός — «メシア、すなわちキリスト»; глосса евангелиста внутри прямой речи."
  42: "В критическом υἱὸς Ἰωάννου («сын Иоанна»); Церковь (Елизаветинская, jp-joc イオナの子) читает Ἰωνᾶ — ヨナの子, без 〔〕 (замена имени)."
