verses:
  0: "ダビデの詩[うた]。"
  1: "神[かみ]よ、わたしを裁[さば]き、聖[せい]ならぬ民[たみ]との、わたしの訴[うった]えを弁護[べんご]してください。不[ふ]義[ぎ]で欺[あざむ]きに満[み]ちた人[ひと]から、わたしを救[すく]い出[だ]してください。"
  2: "あなたはわたしの力[ちから]なる神[かみ]である。なぜ、わたしを退[しりぞ]けたのか。なぜ、わたしは敵[てき]に苦[くる]しめられて、暗[くら]い顔[かお]をして歩[ある]くのか。"
  3: "あなたの光[ひかり]と真実[しんじつ]を送[おく]ってください。それらがわたしを導[みちび]き、あなたの聖[せい]なる山[やま]と、あなたの住[す]まいへと連[つ]れて行[い]くように。"
  4: "わたしは神[かみ]の祭壇[さいだん]へ、わたしの若[わか]さを喜[よろこ]ばせてくださる神[かみ]のもとへと進[すす]む。神[かみ]、わたしの神[かみ]よ、わたしは竪琴[たてごと]を奏[かな]でて、あなたをほめたたえる。"
  5: "なぜ、わたしの魂[たましい]よ、悲[かな]しみに沈[しず]むのか。なぜ、わたしをかき乱[みだ]すのか。神[かみ]に寄[よ]り頼[たの]め。わたしはなお、わたしの救[すく]いである神[かみ]をほめたたえる。"

notes:
  0: "Ψαλμὸς τῷ Δαυιδ — ダビデの詩. В евр. Пс 43 без надписания; LXX прибавляет «Давидов» (ср. слав. «не надписан у еврей»). Надписание — стих 0, скобками не маркируется."
  1: "Κρῖνόν με, ὁ θεός, καὶ δίκασον τὴν δίκην μου — суди ми, Боже, и разсуди прю мою (κρίνω «судить»; δικάζω «разбирать тяжбу»; δίκη «тяжба, правое дело»); 訴えを弁護する. ἐξ ἔθνους οὐχ ὁσίου — от языка не преподобна (ἔθνος «народ»; ὅσιος «святой, благочестивый»); 聖ならぬ民. ἀπὸ ἀνθρώπου ἀδίκου καὶ δολίου ῥῦσαί με — от человека неправедна и льстива избави мя (δολιος «коварный»)."
  2: "σὺ εἶ, ὁ θεός, κραταίωμά μου — Ты еси, Боже, крепость моя (κραταίωμα «твердыня, сила»). ἵνα τί ἀπώσω με; — вскую отринул мя еси? (ἀπωθέω «отталкивать»); 退けた. ἵνα τί σκυθρωπάζων πορεύομαι — вскую сетуя хожду. ἐν τῷ ἐκθλίβειν τὸν ἐχθρόν μου — внегда оскорбляет враг."
  3: "ἐξαπόστειλον τὸ φῶς σου καὶ τὴν ἀλήθειάν σου — посли свет Твой и истину Твою. αὐτὰ με ὡδήγησαν καὶ ἤγαγόν με — та мя настависта и введоста мя (двойственное число). εἰς ὄρος ἅγιόν σου καὶ εἰς τὰ σκηνώματά σου — в гору святую Твою и в селения Твоя (σκήνωμα «жилище»); 住まい."
  4: "εἰσελεύσομαι πρὸς τὸ θυσιαστήριον τοῦ θεοῦ — вниду к олтарю Божию (θυσιαστήριον — 祭壇). πρὸς τὸν θεὸν τὸν εὐφραίνοντα τὴν νεότητά μου — к Богу веселящему юность мою (εὐφραίνω «веселить»; νεότης «юность»). ἐξομολογήσομαί σοι ἐν κιθάρᾳ — исповемся Тебе в гуслех (κιθάρα «кифара, гусли»); 竪琴[たてごと]. ὁ θεὸς ὁ θεός μου — Боже, Боже мой."
  5: "Рефрен, как в 41:5 и 41:11; сохранён дословно, включая σωτήριον τοῦ προσώπου μου."
