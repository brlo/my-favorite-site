# jp-box, Псалтирь, псалом 42. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный 常体, без 文語.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0.
# Псалом 42: молитва гонимого — суд Божий (1), уныние (2),
# свет и истина Божия (3), жертвенник и хвала (4), рефрен (5).
# Красного и синего нет. Прямой речи других лиц нет; молитва самого псалмопевца
# кавычками не берётся (как в Пс 3).
# 〔…〕 нет: все слова в gr-lxx-byz есть.
# セラ (διάψαλμα) в псалме не встречается.
# Сносок ⟨…⟩ нет: 祭壇, 竪琴 уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
