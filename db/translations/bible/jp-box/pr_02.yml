# jp-box, Притчи, глава 2. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc (1901) есть для этой главы: использован как контроль церковного
# чтения, архаизмы не копировались. jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 2: наставление искать премудрость (1–4), обетование страха Господня и
# познания Бога (5–8), плоды премудрости (9–11), избавление от злого пути (12–16)
# и от жены-соблазнительницы (17–19), путь добрых и гибель нечестивых (20–22).
# Прямой речи нет: наставление идёт от лица учителя, но без вводящих слов; кавычек
# в главе нет, все изречения авторские.
# Нумерация по gr: 22 стиха; csl делит 2:20–21 иначе — первую половину 2:21
# (χρηστοὶ … ἄκακοι) относит к 2:20; держимся gr, см. notes 2:21.
# 〔…〕 нет: все 22 стиха есть в gr-lxx-byz. Сносок ⟨…⟩ нет: 銀, 宝, 盾, 陰府, 轍
# уже в корпусе.

tr_code: jp-box
book: pr
chapter: 2
draft: true

verses:
  1: "わが子[こ]よ、もしあなたがわたしの戒[いまし]めの言葉[ことば]を受[う]け入[い]れ、それを自分[じぶん]の内[うち]に隠[かく]すなら、"
  2: "あなたの耳[みみ]が知恵[ちえ]に従[したが]い、あなたの心[こころ]を悟[さと]りに傾[かたむ]け、それをあなたの子[こ]への戒[いまし]めに当[あ]てるなら、"
  3: "知恵[ちえ]を呼[よ]び求め、悟[さと]りに向[む]かって声[こえ]を上[あ]げ、識見[しきけん]を大[おお]きな声で求[もと]めるなら、"
  4: "それを銀[ぎん]のように求[もと]め、宝[たから]のように探[さぐ]り出[だ]すなら、"
  5: "そのとき、あなたは主[しゅ]を恐[おそ]れることを悟[さと]り、神[かみ]の知識[ちしき]を見[み]いだすであろう。"
  6: "主[しゅ]が知恵[ちえ]を与[あた]え、その御前[みまえ]から知識[ちしき]と悟[さと]りが出[で]るからである。"
  7: "主[しゅ]は正[ただ]しく行[おこな]う者[もの]たちに救[すく]いを蓄[たくわ]え、彼[かれ]らの歩[あゆ]みに盾[たて]となる。"
  8: "義[ぎ]の定[さだ]めの道[みち]を守[まも]り、自分[じぶん]を畏[おそ]れる者[もの]の道を守[まも]り抜[ぬ]くためである。"
  9: "そのとき、あなたは義[ぎ]と裁[さば]きを悟[さと]り、すべての良[よ]い道[みち]をまっすぐに整[ととの]えるであろう。"
  10: "知恵[ちえ]があなたの思[おも]いに入[はい]り、識見[しきけん]があなたの魂[たましい]に良[よ]いものと思[おも]われるなら、"
  11: "良[よ]い計画[けいかく]があなたを守[まも]り、聖[せい]なる思[おも]いがあなたを保[たも]つであろう。"
  12: "それは、悪[あく]い道[みち]から、また何[なに]一[ひと]つ真実[しんじつ]を語[かた]らない者[もの]から、あなたを救[すく]い出[だ]し、"
  13: "ああ、まっすぐな道[みち]を捨[す]てて暗[くら]い道[みち]を行[ゆ]く者[もの]たち、"
  14: "悪[あく]を喜[よろこ]び、悪[あく]い歪[ゆが]みを楽[たの]しむ者[もの]たち、"
  15: "その細道[ほそみち]は曲[ま]がり、その轍[わだち]は歪[ゆが]んでいる者[もの]たち、"
  16: "あなたをまっすぐな道[みち]から遠[とお]ざけ、正[ただ]しい思[おも]いから遠ざけるためである。"
  17: "わが子[こ]よ、若[わか]いころの教[おし]えを捨[す]て、神[かみ]の契約[けいやく]を忘[わす]れた悪[あく]い計画[けいかく]が、あなたを捕[と]らえないように。"
  18: "その家[いえ]を死[し]のそばに、その轍[わだち]を陰府[よみ]のそばに、地[ち]に生[う]まれた者[もの]たちとともに置[お]いたからである。"
  19: "そこに入[はい]る者[もの]は誰[だれ]も戻[もど]らず、まっすぐな細道[ほそみち]に達[たっ]することもない。彼[かれ]らは生[い]きる年々[としとし]に達[たっ]しないからである。"
  20: "彼[かれ]らが良[よ]い細道[ほそみち]を歩[あゆ]んでいたなら、義[ぎ]の細道を平[たい]らかに見[み]いだしたであろうに。"
  21: "善[よ]い者[もの]たちは地[ち]に住[す]む者[もの]となり、悪意[あくい]のない者[もの]たちはそこに残[のこ]る。まっすぐな者[もの]たちは地に住[す]まい、聖[せい]なる者[もの]たちはそこに残るからである。"
  22: "不敬[ふけい]な者[もの]の道[みち]は地[ち]から滅[ほろ]び、不法[ふほう]な者[もの]はそこから追[お]い出[だ]される。"

notes:
  1: "Наставление сыну; авторская речь, кавычек нет. Υἱέ, ἐὰν δεξάμενος ῥῆσιν ἐμῆς ἐντολῆς κρύψῃς παρὰ σεαυτῷ — «сын, аще приим глагол моея заповеди, скрыеши в себе»: ῥῆσις — «изречение», ἐντολή — 戒め. Условия 1–4 связаны, главное предложение — в 2:5; поэтому стихи кончаются なら."
  2: "ὑπακούσεται σοφίας τὸ οὖς σου — «послушает премудрости твое ухо»; παραβαλεῖς καρδίαν σου εἰς σύνεσιν — «приложиши сердце твое к разуму»; παραβαλεῖς αὐτὴν ἐπὶ νουθέτησιν τῷ υἱῷ σου — «приложиши е на наказание сыну твоему», т. е. применишь её к наставлению сына (νουθέτησις — «вразумление»)."
  3: "ἐὰν τὴν σοφίαν ἐπικαλέσῃ — «аще премудрость призовеши»; τῇ συνέσει δῷς φωνήν σου — «разуму даси глас твой», т. е. воззовёшь к разуму (δίδωμι φωνήν — «подавать голос»); τὴν αἴσθησιν ζητήσῃς μεγάλῃ τῇ φωνῇ — «чувство взыщеши великим гласом» (αἴσθησις — 識見); повтор φωνή сохранён."
  4: "ζητήσῃς αὐτὴν ὡς ἀργύριον — «взыщеши ея яко сребра»; ὡς θησαυροὺς ἐξερευνήσῃς αὐτήν — «якоже сокровища испытаеши ю» (ἐξερευνάω — «разыскивать, выведывать»), передано 探り出す."
  5: "Главное предложение условий 1–4: τότε συνήσεις φόβον κυρίου — «тогда уразумееши страх Господень»; ἐπίγνωσιν θεοῦ εὑρήσεις — «познание Божие обрящеши» (ἐπίγνωσις — «полное знание»)."
  6: "ὅτι κύριος δίδωσιν σοφίαν — «яко Господь дает премудрость»; ἀπὸ προσώπου αὐτοῦ γνῶσις καὶ σύνεσις — «от лица его познание и разум» (πρόσωπον — «лицо», передано 御前; Син. «из уст Его»)."
  7: "θησαυρίζει τοῖς κατορθοῦσι σωτηρίαν — «сокровищствует исправляющим спасение», т. е. хранит про запас (κατορθόω — «выпрямлять, поступать право»); ὑπερασπιεῖ τὴν πορείαν αὐτῶν — «защищает шествие их» (ὑπερασπίζω — «быть щитом»), передано 盾となる."
  8: "τοῦ φυλάξαι ὁδοὺς δικαιωμάτων — «еже сохранити пути оправданий» (δικαίωμα — «устав, оправдание», передано 義の定め); ὁδὸν εὐλαβουμένων αὐτὸν διαφυλάξει — «путь благоговеинствующих его сохранит» (εὐλαβέομαι — «благоговеть»). Инфинитив цели относится к ὑπερασπιεῖ 2:7."
  9: "τότε συνήσεις δικαιοσύνην καὶ κρίμα — «тогда уразумееши правду и суд»; κατορθώσεις πάντας ἄξονας ἀγαθούς — «исправиши вся стези благия» (ἄξων — «ось, колея», передано 道); κατορθόω — «делать прямым»."
  10: "ἐὰν γὰρ ἔλθῃ ἡ σοφία εἰς σὴν διάνοιαν — «аще приидет премудрость в твою мысль»; ἡ αἴσθησις τῇ σῇ ψυχῇ καλὴ εἶναι δόξῃ — «чувство же твоей души добро быти возмнится» (δοκέω — «казаться»); αἴσθησις — 識見."
  11: "βουλὴ καλὴ φυλάξει σε — «совет добр сохранит тя»; ἔννοια ὁσία τηρήσει σε — «помышление же преподобное соблюдет тя» (ὅσιος — «святой, благочестивый», 聖なる)."
  12: "ἵνα ῥύσηταί σε ἀπὸ ὁδοῦ κακῆς — «да избавит тя от пути злаго»; ἀνδρὸς λαλοῦντος μηδὲν πιστόν — «мужа, глаголюща ничтоже верно» (πιστός — «верный, истинный»). Предложение продолжается через восклицание 2:13–15 и завершается в 2:16 вторым инфинитивом цели ποιῆσαι."
  13: "ὦ οἱ ἐγκαταλείποντες ὁδοὺς εὐθείας — «о, оставившии пути правыя»: ὦ — евр. восклицание (הוֹי), передано ああ; τοῦ πορεύεσθαι ἐν ὁδοῖς σκότους — «еже ходити в путех тмы». Восклицание сохранено, как «о» в csl."
  14: "οἱ εὐφραινόμενοι ἐπὶ κακοῖς — «веселящиися о злых»; χαίροντες ἐπὶ διαστροφῇ κακῇ — «радующиися о развращении злем» (διαστροφή — «извращение»), передано 歪み."
  15: "ὧν αἱ τρίβοι σκολιαί — «ихже стези стропотны» (σκολιός — «кривой»); καμπύλαι αἱ τροχιαὶ αὐτῶν — «крива течения их» (τροχιά — «колея, след колеса»), передано 轍. У csl к этому стиху добавлено «еже далече тя сотворити от пути права» — это начало gr 2:16, держимся gr."
  16: "τοῦ μακράν σε ποιῆσαι ἀπὸ ὁδοῦ εὐθείας — «еже далече тя сотворити от пути права»; ἀλλότριον τῆς δικαίας γνώμης — «чужда от праведнаго разума» (γνώμη — «мысль, мнение»). Цель ῥύσηται 2:12. У csl «Сыне, да тя не постигнет совет злый» отнесено к 2:16, а в gr это начало 2:17 — держимся gr."
  17: "υἱέ, μή σε καταλάβῃ κακὴ βουλή — «сыне, да тя не постигнет совет злый»; ἡ ἀπολείπουσα διδασκαλίαν νεότητος — «оставляяй учение юности» (διδασκαλία — 教え); διαθήκην θείαν ἐπιλελησμένη — «завета Божественнаго забывый» (ἐπιλανθάνομαι — «забывать»)."
  18: "ἔθετο παρὰ τῷ θανάτῳ τὸν οἶκον αὐτῆς — «постави при смерти дом свой»; παρὰ τῷ ᾅδῃ μετὰ τῶν γηγενῶν τοὺς ἄξονας αὐτῆς — «при аде с земными деяния своя» (γηγενής — «земнородный», 地に生まれた者; ᾅδης — 陰府). αὐτῆς — жен. род: в LXX формально к κακὴ βουλή, по смыслу — к жене-соблазнительнице (МТ); в япон. その."
  19: "πάντες οἱ πορευόμενοι ἐν αὐτῇ οὐκ ἀναστρέψουσιν — «вси ходящии по нему не возвратятся» (ἀναστρέφω — «поворачивать назад»); οὐδὲ μὴ καταλάβωσιν τρίβους εὐθείας — «ниже постигнут стезь правых»; οὐ γὰρ καταλαμβάνονται ὑπὸ ἐνιαυτῶν ζωῆς — «ни бо достигнут лет жизни»: букв. «не бывают объяты годами жизни», т. е. не достигают полноты лет."
  20: "εἰ γὰρ ἐπορεύοντο τρίβους ἀγαθάς — «аще бо быша ходили в стези благия»; εὕροσαν ἂν τρίβους δικαιοσύνης λείους — «обрели убо быша стези правы гладки» (λεῖος — «гладкий, ровный»). Ирреальное условие прошедшего времени; частица ἂν передана であろうに."
  21: "χρηστοὶ ἔσονται οἰκήτορες γῆς — «блази будут жителие на земли»; ἄκακοι ὑπολειφθήσονται ἐν αὐτῇ — «незлобивии же останут на ней»; ὅτι εὐθεῖς κατασκηνώσουσι γῆν — «яко правии вселятся на земли»; ὅσιοι ὑπολειφθήσονται ἐν αὐτῇ — «преподобнии останут на ней». В gr обе пары в одном стихе; csl первую половину (χρηστοὶ … ἄκακοι) относит к 2:20, вторую — к 2:21; держимся gr."
  22: "ὁδοὶ ἀσεβῶν ἐκ γῆς ὀλοῦνται — «путие нечестивых от земли погибнут» (ὄλλυμι — «губить»); οἱ παράνομοι ἐξωσθήσονται ἀπ᾿ αὐτῆς — «пребеззаконнии же изринутся от нея» (ἐξωθέω — «выталкивать, изгонять»)."
