verses:
  1: "「あなたは彼[かれ]を見[み]たことがないのか。彼について語[かた]られていることに、驚[おどろ]かなかったのか。"
  2: "わたしに備[そな]えられていることを恐[おそ]れないのか。わたしに逆[さか]らう者[もの]が、だれかいるか。"
  3: "わたしに立[た]ち向[む]かい、耐[た]え忍[しの]ぶ者[もの]が、だれかいるか。天[てん]の下[した]のすべては、わたしのものではないか。"
  4: "わたしは彼[かれ]のゆえに黙[だま]らない。力[ちから]の言葉[ことば]をもって、彼に等[ひと]しい者[もの]をあわれもう。"
  5: "だれがその衣[ころも]の表[おもて]を現[あらわ]すのか。その胸当[むねあ]ての折[お]り目[め]に、だれが入[はい]るのか。"
  6: "だれがその顔[かお]の戸[と]を開[あ]けるのか。その歯[は]の周[まわ]りには恐怖[きょうふ]がある。"
  7: "その内[うち]なるものは青銅[せいどう]の盾[たて]であり、そのつなぎ目[め]は金剛砂[こんごうしゃ]の石[いし]のようだ。"
  8: "一[ひと]つが他[ほか]の一[ひと]つに密着[みっちゃく]し、風[かぜ]もその間[あいだ]を通[とお]らない。"
  9: "一[ひと]つがその兄弟[きょうだい]に寄[よ]り添[そ]い、互[たが]いに固[かた]く結[むす]ばれて離[はな]れない。"
  10: "そのくしゃみで光[ひかり]が輝[かがや]き、その目[め]は明[あ]けの星[ほし]の姿[すがた]のようだ。"
  11: "その口[くち]から燃[も]えるたいまつが出[で]て、火[ひ]の炭[すみ]が散[ち]らばる。"
  12: "その鼻[はな]の穴[あな]から、炭火[すみび]で燃[も]える炉[ろ]の煙[けむり]が出[で]る。"
  13: "その魂[たましい]は炭[すみ]であり、その口[くち]から炎[ほのお]が出[で]る。"
  14: "その首[くび]には力[ちから]が宿[やど]り、その前[まえ]を滅[ほろ]びが走[はし]る。"
  15: "その体[からだ]の肉[にく]は固[かた]く結[むす]ばれている。その上[うえ]に注[そそ]がれても、揺[ゆ]るがない。"
  16: "その心[こころ]は石[いし]のように固[かた]まり、打[う]ち砕[くだ]けない金床[かなとこ]のように立[た]っている。"
  17: "彼[かれ]が向[む]きを変[か]えると、地[ち]の上[うえ]を跳[は]ねる四足[よつあし]の獣[けもの]たちに恐怖[きょうふ]が走[はし]る。"
  18: "槍[やり]が彼[かれ]に突[つ]き当[あ]たっても、何[なに]もできない。突[つ]き刺[さ]された槍[やり]も、鎧[よろい]も。"
  19: "彼[かれ]は鉄[てつ]をわらのように思[おも]い、青銅[せいどう]を腐[くさ]った木[き]のように思う。"
  20: "青銅[せいどう]の弓[ゆみ]は彼[かれ]を傷[きず]つけない。彼は石[いし]を投[な]げる投石[とうせき]器[き]を草[くさ]のように思う。"
  21: "槌[つち]はわらのように数[かぞ]えられ、彼[かれ]は火[ひ]を帯[お]びた震動[しんどう]をあざ笑[わら]う。"
  22: "その寝床[ねどこ]は鋭[するど]い杭[くい]であり、海[うみ]の黄金[おうごん]はすべて、彼[かれ]の下[した]で無数[むすう]の泥[どろ]のようだ。"
  23: "彼[かれ]は深[ふか]みを青銅[せいどう]の炉[ろ]のように沸[わ]き立[た]たせ、海[うみ]を香油[こうゆ]の壺[つぼ]のように思う。"
  24: "彼[かれ]は深[ふか]みのタルタロスを捕[と]らえられた者[もの]のようにし、深[ふか]みを行[ゆ]き来[き]する道[みち]とみなした。"
  25: "地[ち]の上[うえ]に、彼[かれ]に似[に]て造[つく]られ、わたしの使[つか]いたちに侮[あざけ]られるものは、ほかに何[なに]もない。"
  26: "彼[かれ]はすべていと高[たか]いものを見[み]る。彼[かれ]こそ、水[みず]の中[なか]のすべてのものの王[おう]である。」"

notes:
  1: "Господь. οὐχ ἑόρακας αὐτὸν οὐδὲ ἐπὶ τοῖς λεγομένοις τεθαύμακας — «разве ты не видел его и не удивился сказанному о нём» (ὁράω — «видеть»; θαυμάζω — «удивляться»; ἐπί с дат. — «при, о»). csl 41:1: «Не видел ли еси его, и глаголемым не удивился ли еси?» — в слав. этот стих слит с 41:2–3a. Речь Господа, продолжение; цитата открыта здесь."
  2: "Господь. οὐ δέδοικας ὅτι ἡτοίμασταί μοι — «не убоялся ли ты, что уготовано Мне» (δείδω — «бояться»; perfect pass. от ἑτοιμάζω — «готовить»). τίς γάρ ἐστιν ὁ ἐμοὶ ἀντιστάς — «ибо кто есть противящийся Мне» (ἀνθίστημι — «противостоять»); csl «не убоялся ли еси, яко уготовася ми? Кто бо есть противляяйся мне». Место тёмное: «уготовано Мне» — о левиафане."
  3: "Господь. ἢ τίς ἀντιστήσεταί μοι καὶ ὑπομενεῖ — «или кто противостанет Мне и устоит» (ὑπομένω — «выдерживать, оставаться»). εἰ πᾶσα ἡ ὑπ᾿ οὐρανὸν ἐμή ἐστιν — «если всё под небом Моё» (ὑπ᾿ οὐρανόν — «под небом»); csl «или кто противостанет ми и стерпит, аще вся поднебесная моя есть?» — в слав. конец этого стиха вынесен в 41:2."
  4: "Господь. οὐ σιωπήσομαι δι᾿ αὐτόν — «не умолчу ради него» (σιωπάω — «молчать»; διά с вин. — «ради, из-за»). καὶ λόγον δυνάμεως ἐλεήσει τὸν ἴσον αὐτοῦ — «и словом силы помилую равного ему» (λόγον δυνάμεως — винительный средства, «словом силы»; ἐλεήσει — будущее 3 л. ед. ч., подлежащее — Господь; ἐλεέω — «миловать»; ἴσος — «равный»); csl «Не умолчу его ради и словом силы помилую равнаго ему». Место тёмное, передано буквально."
  5: "Господь. τίς ἀποκαλύψει πρόσωπον ἐνδύσεως αὐτοῦ — «кто откроет лицо одежды его» (ἀποκαλύπτω — «открывать»; ἔνδυσις — «одеяние»). εἰς δὲ πτύξιν θώρακος αὐτοῦ τίς ἂν εἰσέλθοι — «в сгиб брони его кто войдёт» (πτύξις — «складка, сгиб»; θώραξ — «броня, панцирь»); csl «Кто открыет лице облечения его, в согбение же персей его кто внидет?»"
  6: "Господь. πύλας προσώπου αὐτοῦ τίς ἀνοίξει — «двери лица его кто отворит» (πύλη — «ворота, дверь»). κύκλῳ ὀδόντων αὐτοῦ φόβος — «вокруг зубов его страх» (κύκλῳ — «вокруг»; ὀδούς — «зуб»; φόβος — «страх»); csl «Двери лица его кто отверзет? окрест зубов его страх»."
  7: "Господь. τὰ ἔγκατα αὐτοῦ ἀσπίδες χάλκειαι — «внутренности его — щиты медные» (ἔγκατα — «внутренности»; ἀσπίς — «щит»; χάλκειος — «медный»). σύνδεσμος δὲ αὐτοῦ ὥσπερ σμιρίτης λίθος — «связь его — как камень смирит» (σύνδεσμος — «связь, соединение»; σμιρίτης — «наждак, наждачный камень»; csl «смирит камень» — транслитерация)."
  8: "Господь. εἷς τοῦ ἑνὸς κολλῶνται — «один к одному прилепляются» (κολλάω — «склеивать, соединять»). πνεῦμα δὲ οὐ μὴ διέλθῃ αὐτόν — «дух (дыхание, ветер) не пройдёт сквозь него» (πνεῦμα — «дух, дыхание, ветер»; διέρχομαι — «проходить»); csl «един ко другому прилипают, дух же не пройдет его»."
  9: "Господь. ἀνὴρ τῷ ἀδελφῷ αὐτοῦ προσκολληθήσεται — «муж к брату своему прилепится» (προσκολλάω — «прилепляться»). συνέχονται καὶ οὐ μὴ ἀποσπασθῶσιν — «держатся и не отторгнутся» (συνέχω — «держать»; ἀποσπάω — «отрывать»); csl «яко муж брату своему прилепится, содержатся и не отторгнутся»."
  10: "Господь. ἐν πταρμῷ αὐτοῦ ἐπιφαύσκεται φέγγος — «при чихании его блистает свет» (πταρμός — «чихание»; ἐπιφαύσκω — «блистать»; φέγγος — «свет»). οἱ δὲ ὀφθαλμοὶ αὐτοῦ εἶδος ἑωσφόρου — «глаза его — вид денницы» (εἶδος — «вид»; ἑωσφόρος — «утренняя звезда, денница»); csl «В чхании его возблистает свет: очи же его видение денницы»."
  11: "Господь. ἐκ στόματος αὐτοῦ ἐκπορεύονται λαμπάδες καιόμεναι — «из уст его исходят светильники горящие» (λαμπάς — «светильник, факел»; καίω — «жечь»). διαρριπτοῦνται ἐσχάραι πυρός — «рассыпаются огненные искры» (διαρριπτέω — «разбрасывать»; ἐσχάρα — «очаг, искра, уголь»); csl «Из уст его исходят аки свещы горящыя, и размещутся аки искры огненныя»."
  12: "Господь. ἐκ μυκτήρων αὐτοῦ ἐκπορεύεται καπνὸς καμίνου καιομένης πυρὶ ἀνθράκων — «из ноздрей его исходит дым печи, горящей огнём углей» (μυκτήρ — «ноздря»; κάμινος — «печь»; ἄνθραξ — «уголь»); csl «из ноздрей его исходит дым пещи горящия огнем углия»."
  13: "Господь. ἡ ψυχὴ αὐτοῦ ἄνθρακες — «душа его — угли» (ψυχή — «душа, дыхание»; ἄνθραξ — «уголь»). φλὸξ δὲ ἐκ στόματος αὐτοῦ ἐκπορεύεται — «и пламя из уст его исходит» (φλόξ — «пламя»); csl «душа же его яко углие, и яко пламы из яст его исходит»."
  14: "Господь. ἐν δὲ τραχήλῳ αὐτοῦ αὐλίζεται δύναμις — «в шее его обитает сила» (τράχηλος — «шея»; αὐλίζομαι — «обитать, ночевать»). ἔμπροσθεν αὐτοῦ τρέχει ἀπώλεια — «перед ним бежит погибель» (ἀπώλεια — «погибель»); csl «На выи же его водворяется сила, пред ним течет пагуба»."
  15: "Господь. σάρκες δὲ σώματος αὐτοῦ κεκόλληνται — «плоти тела его склеены» (σάρξ — «плоть»; κολλάω — «склеивать»). καταχέει ἐπ᾿ αὐτόν, οὐ σαλευθήσεται — «льёт на него, не поколеблется» (καταχέω — «изливать»; σαλεύω — «колебать»); csl «Плоти же телесе его сольпнушася: лиет нань, и не подвижится». Тёмное место: подлежащее не выражено."
  16: "Господь. ἡ καρδία αὐτοῦ πέπηγεν ὡς λίθος — «сердце его застыло, как камень» (πήγνυμι — «застывать, твердеть»). ἕστηκεν δὲ ὥσπερ ἄκμων ἀνήλατος — «стоит, как наковальня неотразимая» (ἄκμων — «наковальня»; ἀνήλατος — «неподвижный, неотразимый»); csl «Сердце его ожесте аки камень, стоит же аки наковальня неподвижна»."
  17: "Господь. στραφέντος δὲ αὐτοῦ φόβος θηρίοις τετράποσιν — «при повороте его — страх четвероногим зверям» (στρέφω — «поворачивать»; θηρίον — «зверь»; τετράπους — «четвероногий»). ἐπὶ γῆς ἁλλομένοις — «скачущим по земле» (ἅλλομαι — «прыгать»); csl «Обращшуся же ему, страх зверем четвероногим по земли скачущым»."
  18: "Господь. ἐὰν συναντήσωσιν αὐτῷ λόγχαι — «если встретят его копья» (λογχή — «копьё»; συναντάω — «встречать»). οὐδὲν μὴ ποιήσωσιν δόρυ ἐπηρμένον καὶ θώρακα — «ничего не сделают ему копьё поднятое и броня» (δόρυ — «копьё»; ἐπαίρω — «поднимать»; θώραξ — «броня»); csl «копие вонзено» — «вонзённое»; взято csl."
  19: "Господь. ἥγηται μὲν γὰρ σίδηρον ἄχυρα — «считает ведь железо соломой» (ἡγέομαι — «считать»; ἄχυρον — «солома, мякина»). χαλκὸν δὲ ὥσπερ ξύλον σαθρόν — «а медь — как дерево гнилое» (χαλκός — «медь, бронза»; σαθρός — «гнилой, рыхлый»); csl «вменяет бо железо аки плевы, медь же аки древо гнило»."
  20: "Господь. οὐ μὴ τρώσῃ αὐτὸν τόξον χάλκειον — «не ранит его лук медный» (τιτρώσκω — «ранить»; τόξον — «лук»). ἥγηται μὲν πετροβόλον χόρτον — «считает камнемётное орудие травой» (πετροβόλον — «камнемёт, праща»; χόρτος — «трава, сено»); csl «не уязвит его лук медян, мнит бо каменометную пращу аки сено»."
  21: "Господь. ὡς καλάμη ἐλογίσθησαν σφῦραι — «как солома сочтены молоты» (καλάμη — «соломина»; σφῦρα — «молот»). καταγελᾷ δὲ σεισμοῦ πυρφόρου — «смеётся над огненосным сотрясением» (καταγελάω — «осмеивать»; σεισμός — «сотрясение, землетрясение»; πυρφόρος — «огненосный»); csl «аки стеблие вменишася ему млатове, ругаетжеся трусу огненосному». Тёмное место."
  22: "Господь. ἡ στρωμνὴ αὐτοῦ ὀβελίσκοι ὀξεῖς — «ложе его — острые колья» (στρωμνή — «ложе, постель»; ὀβελίσκος — «вертел, острый шест»). πᾶς δὲ χρυσὸς θαλάσσης ὑπ᾿ αὐτὸν ὥσπερ πηλὸς ἀμύθητος — «всё золото моря под ним — как грязь несказанная» (πηλός — «глина, грязь»; ἀμύθητος — «несказанный, бесчисленный»); csl «Ложе его остни острии, всяко же злато морское под ним, якоже брение безчисленно»."
  23: "Господь. ἀναζεῖ τὴν ἄβυσσον ὥσπερ χαλκεῖον — «вскипает бездну, как медный горн» (ἀναζέω — «вскипать»; ἄβυσσος — «бездна»; χαλκεῖον — «кузнечный горн, котёл»). ἥγηται δὲ τὴν θάλασσαν ὥσπερ ἐξάλειπτρον — «считает море как сосуд для мази» (ἐξάλειπτρον — «сосуд для мази, алебастр»); csl «Возжизает бездну, якоже пещь медяну: мнит же море яко мироварницу»."
  24: "Господь. τὸν δὲ τάρταρον τῆς ἀβύσσου ὥσπερ αἰχμάλωτον — «тартар бездны — как пленника» (τάρταρος — «тартар»; αἰχμάλωτος — «пленник»). ἐλογίσατο ἄβυσσον εἰς περίπατον — «счёл бездну для прогулки» (περίπατος — «хождение, прогулка»); csl «и тартар бездны якоже пленника: вменил бездну в прохождение»."
  25: "Господь. οὐκ ἔστιν οὐδὲν ἐπὶ τῆς γῆς ὅμοιον αὐτῷ πεποιημένον — «нет на земле ничего, подобного ему созданного» (ὅμοιος — «подобный»). ἐγκαταπαίζεσθαι ὑπὸ τῶν ἀγγέλων μου — «на посмеяние ангелам Моим» (ἐγκαταπαίζω — «осмеивать»); csl «Ничтоже есть на земли подобно ему сотворено, поругано быти ангелы моими»."
  26: "Господь. πᾶν ὑψηλὸν ὁρᾷ — «всё высокое видит» (ὑψηλός — «высокий»). αὐτὸς δὲ βασιλεὺς πάντων τῶν ἐν τοῖς ὕδασιν — «он же царь всех в водах» (βασιλεύς — «царь»); csl «все высокое зрит: сам же царь всем сущым в водах». Здесь речь Господа кончается; 42:1 — новая формула Иова."
