# jp-box, Левит, глава 11. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в главе отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 11: чистые и нечистые животные (1–8), рыбы (9–12), птицы (13–19),
# крылатые пресмыкающиеся (20–23), осквернение от трупов (24–40),
# заключение: святость и закон (41–47).
# Красного и синего нет. Вся глава, кроме 11:1, — речь Бога в 「…」 (2–47).
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (проверено по базе).
# Сносок ⟨…⟩ нет — по указанию для этой главы; животные переданы родовыми
# или общеупотребительными названиями, спорные места разобраны в notes.
# LXX 11:5–6: δασύπους и χοιρογρύλλιος не совпадают с евр. (שָׁפָן, אַרְנֶבֶת)
# и с Син. («тушканчик», «заяц»); 11:22 — четыре вида саранчовых, отождествление
# спорно; 11:13–19 — названия птиц в LXX и масоретском расходятся.
# jp-ni не использовался.

