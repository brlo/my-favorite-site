verses:
  1: "主[しゅ]はモーセとアロンに言[い]われた。"
  2: "「イスラエルの子[こ]らに語[かた]って言[い]いなさい。地[ち]の上[うえ]にいるすべての獣[けもの]のうち、あなたがたが食[た]べることのできるものは次[つぎ]のとおりである。"
  3: "ひづめが分[わ]かれ、ひづめに割[わ]れ目[め]があり、反芻[はんすう]する獣[けもの]は、すべて食[た]べてよい。"
  4: "ただし、反芻[はんすう]するもの、またひづめが分[わ]かれているもののうち、次[つぎ]のものは食[た]べてはならない。ラクダは反芻[はんすう]するが、ひづめが分[わ]かれていない。これはあなたがたには汚[けが]れたものである。"
  5: "毛深[けぶか]い足[あし]を持[も]つ獣[けもの]は、反芻[はんすう]するが、ひづめが分[わ]かれていない。これはあなたがたには汚[けが]れたものである。"
  6: "野兎[のうさぎ]は反芻[はんすう]するが、ひづめが分[わ]かれていない。これはあなたがたには汚[けが]れたものである。"
  7: "豚[ぶた]はひづめが分[わ]かれ、ひづめに割[わ]れ目[め]があるが、反芻[はんすう]しない。これはあなたがたには汚[けが]れたものである。"
  8: "それらの肉[にく]を食[た]べてはならない。それらの死骸[しがい]に触[ふ]れてはならない。それらはあなたがたには汚[けが]れたものである。"
  9: "水[みず]の中[なか]のすべてのもののうち、次[つぎ]のものは食[た]べてよい。水[みず]の中[なか]、海[うみ]の中[なか]、川[かわ]の中[なか]にいて、ひれと鱗[うろこ]のあるものは、すべて食[た]べてよい。"
  10: "しかし、水[みず]の中[なか]、海[うみ]の中[なか]、川[かわ]の中[なか]にいて、ひれも鱗[うろこ]もないものは、水[みず]が生[う]み出[だ]すすべてのもの、水[みず]の中[なか]のすべての生[い]き物[もの]のうち、あなたがたには忌[いま]むべきものである。"
  11: "それらはあなたがたには忌[いま]むべきものである。それらの肉[にく]を食[た]べてはならず、その死骸[しがい]を忌[いま]むべきものとしなさい。"
  12: "水[みず]の中[なか]にいて、ひれも鱗[うろこ]もないものは、すべてあなたがたには忌[いま]むべきものである。"
  13: "鳥[とり]のうち、次[つぎ]のものは忌[いま]むべきもので、食[た]べてはならない。鷲[わし]、禿[はげ]鷲[わし]、海[うみ]鷲[わし]、"
  14: "禿[はげ]鷹[たか]と鳶[とび]、およびその類[るい]、"
  15: "からすとその類[るい]、"
  16: "ダチョウ、ふくろう、かもめとその類[るい]、鷹[たか]とその類[るい]、"
  17: "みみずく、隼[はやぶさ]、イビス、"
  18: "水鶏[くいな]、ペリカン、白鳥[はくちょう]、"
  19: "ふくろう、鷺[さぎ]、千鳥[ちどり]とその類[るい]、ヤツガシラ、こうもり。"
  20: "羽[はね]のある這[は]うもののうち、四本[よんほん]の足[あし]で歩[あゆ]むものは、すべてあなたがたには忌[いま]むべきものである。"
  21: "ただし、羽[はね]のある這[は]うもののうち、四本[よんほん]の足[あし]で歩[あゆ]むものでも、足[あし]よりも上[うえ]に、それで地[ち]を跳[は]ねる脛[すね]があるものは、食[た]べてよい。"
  22: "すなわち、いなごとその類[るい]、ばったとその類[るい]、きりぎりすとその類[るい]、およびそれらに似[に]た羽[はね]のある虫[むし]とその類[るい]を食[た]べてよい。"
  23: "羽[はね]のある這[は]うもので、四本[よんほん]の足[あし]のあるものは、すべてあなたがたには忌[いま]むべきものである。"
  24: "これらのものによって、あなたがたは汚[けが]れる。その死骸[しがい]に触[ふ]れる者[もの]は、夕方[ゆうがた]まで汚[けが]れた者[もの]となる。"
  25: "その死骸[しがい]を運[はこ]ぶ者[もの]は、衣[ころも]を洗[あら]い、夕方[ゆうがた]まで汚[けが]れた者[もの]となる。"
  26: "ひづめが分[わ]かれ、ひづめに割[わ]れ目[め]はあるが、反芻[はんすう]しない獣[けもの]は、すべてあなたがたには汚[けが]れたものである。その死骸[しがい]に触[ふ]れる者[もの]は、夕方[ゆうがた]まで汚[けが]れた者[もの]となる。"
  27: "四本[よんほん]の足[あし]で歩[あゆ]むすべての獣[けもの]のうち、前足[まえあし]の裏[うら]で歩[あゆ]むものは、あなたがたには汚[けが]れたものである。その死骸[しがい]に触[ふ]れる者[もの]は、夕方[ゆうがた]まで汚[けが]れた者[もの]となる。"
  28: "その死骸[しがい]を運[はこ]ぶ者[もの]は、衣[ころも]を洗[あら]い、夕方[ゆうがた]まで汚[けが]れた者[もの]となる。それらはあなたがたには汚[けが]れたものである。"
  29: "地[ち]を這[は]うもののうち、次[つぎ]のものはあなたがたには汚[けが]れたものである。いたち、ねずみ、とかげの一種[いっしゅ]、"
  30: "トガリネズミ、カメレオン、やもり、とかげ、もぐら。"
  31: "これらは、地[ち]の上[うえ]を這[は]うすべてのもののうち、あなたがたには汚[けが]れたものである。それらの死骸[しがい]に触[ふ]れる者[もの]は、夕方[ゆうがた]まで汚[けが]れた者[もの]となる。"
  32: "また、それらの死骸[しがい]が落[お]ちたものは、何[なに]であれ汚[けが]れる。木[き]の器[うつわ]、衣[ころも]、皮[かわ]、袋[ふくろ]など、仕事[しごと]に用[もち]いるすべての器[うつわ]は、水[みず]に浸[ひた]しなさい。夕方[ゆうがた]まで汚[けが]れたものとなり、その後[あと]で清[きよ]くなる。"
  33: "土[つち]の器[うつわ]の中[なか]に、それらのものが落[お]ちたなら、その中[なか]にあるものはすべて汚[けが]れ、器[うつわ]は壊[こわ]さなければならない。"
  34: "そのような器[うつわ]の水[みず]がかかった食[た]べ物[もの]は、すべて汚[けが]れる。その器[うつわ]に入[はい]っている飲[の]み物[もの]も、すべて汚[けが]れる。"
  35: "それらの死骸[しがい]が上[うえ]に落[お]ちたものは、すべて汚[けが]れる。パン焼[や]き窯[がま]と竈[かまど]は壊[こわ]さなければならない。それらは汚[けが]れたものであり、あなたがたには汚[けが]れたものとなる。"
  36: "ただ、泉[いずみ]、水[みず]をたたえる穴[あな]、水[みず]の集[あつ]まる所[ところ]は清[きよ]いままである。しかし、その死骸[しがい]に触[ふ]れる者[もの]は汚[けが]れる。"
  37: "もしそれらの死骸[しがい]が、蒔[ま]くべき種[たね]の上[うえ]に落[お]ちても、その種[たね]は清[きよ]いままである。"
  38: "しかし、種[たね]に水[みず]が注[そそ]がれているとき、その上[うえ]にそれらの死骸[しがい]が落[お]ちたなら、その種[たね]はあなたがたには汚[けが]れたものである。"
  39: "あなたがたが食[た]べることのできる獣[けもの]が死[し]んだなら、その死骸[しがい]に触[ふ]れる者[もの]は、夕方[ゆうがた]まで汚[けが]れた者[もの]となる。"
  40: "その死骸[しがい]を食[た]べる者[もの]は、衣[ころも]を洗[あら]い、夕方[ゆうがた]まで汚[けが]れた者[もの]となる。その死骸[しがい]を運[はこ]ぶ者[もの]も、衣[ころも]を洗[あら]い、水[みず]で体[からだ]を洗[あら]い、夕方[ゆうがた]まで汚[けが]れた者[もの]となる。"
  41: "地[ち]を這[は]うすべてのものは、あなたがたには忌[いま]むべきものであり、食[た]べてはならない。"
  42: "地[ち]を這[は]うすべてのもののうち、腹[はら]で這[は]うもの、四本[よんほん]の足[あし]でいつも歩[あゆ]むもの、多[おお]くの足[あし]を持[も]つものは、すべて食[た]べてはならない。それらは忌[いま]むべきものだからである。"
  43: "あなたがたは、地[ち]を這[は]うすべてのものによって、自分[じぶん]の魂[たましい]を忌[いま]むべきものとしてはならない。それらによって汚[けが]れてはならない。それらによって汚[けが]れた者[もの]となってはならない。"
  44: "わたしはあなたがたの神[かみ]、主[しゅ]である。あなたがたは聖[せい]なる者[もの]とされ、聖[せい]なる者[もの]となりなさい。わたしが聖[せい]なる者[もの]であるからである。わたしはあなたがたの神[かみ]、主[しゅ]である。あなたがたは、地[ち]の上[うえ]を動[うご]き回[まわ]るすべてのものによって、自分[じぶん]の魂[たましい]を汚[けが]してはならない。"
  45: "わたしはあなたがたをエジプトの地[ち]から導[みちび]き上[あ]げて、あなたがたの神[かみ]となる者[もの]、主[しゅ]である。あなたがたは聖[せい]なる者[もの]となりなさい。わたしが聖[せい]なる者[もの]だからである。"
  46: "これは、獣[けもの]と鳥[とり]と、水[みず]の中[なか]を動[うご]き回[まわ]るすべての生[い]き物[もの]と、地[ち]の上[うえ]を這[は]うすべての生[い]き物[もの]についての律法[りっぽう]である。"
  47: "汚[けが]れたものと清[きよ]いもの、食[た]べてよい生[い]き物[もの]と食[た]べてはならない生[い]き物[もの]とを見分[みわ]けるためである。」"

notes:
  1: "ἐλάλησεν κύριος πρὸς Μωυσῆν καὶ Ααρων — Господь сказал Моисею и Аарону (обоим)."
  2: "Λαλήσατε… λέγοντες — скажите… говоря. κτῆνος — скот, животное (здесь 獣; не только домашнее). τῶν ἐπὶ τῆς γῆς — на земле."
  3: "διχηλοῦν ὁπλὴν — раздвояющее копыто. ὀνυχιστῆρας ὀνυχίζον δύο χηλῶν — имеющее раздвоенные когти/копыта (двойное выражение LXX; слав. «пазнокти на двое»). ἀνάγον μηρυκισμόν — жующее жвачку (ἀνάγω — «износить», μηρυκισμός — жвачка)."
  4: "πλήν — но, однако. κάμηλος — верблюд (ラクダ). ἀκάθαρτον τοῦτο ὑμῖν — нечисто это для вас."
  5: "δασύπους — букв. «мохноногий»; вид неясен (традиционно даман/хайракс или заяц), передан родовым 毛深い足を持つ獣. Слав. «хирогриль», Син. «тушканчик»."
  6: "χοιρογρύλλιος — букв. «свинохрюк»; традиционно заяц (野兎); Син. «заяц», слав. «заяц». μηρυκισμός — жвачка."
  7: "ὗς — свинья (豚). ὀνυχίζει ὄνυχας ὁπλῆς — имеет копыта с разрезом."
  8: "θνησιμαῖα — трупы, мертвечина (死骸). οὐχ ἅψεσθε — не прикасайтесь."
  9: "πτερύγια — плавники (букв. «перья»; Син. «перья» с евр.). λεπίδες — чешуя. χείμαρρος — поток, река (川)."
  10: "ἐρεύγεται τὰ ὕδατα — «изрыгают воды» (ἐρεύγομαι); передано 水が生み出す. βδέλυγμα — мерзость, 忌むべきもの. ψυχὴ ζῶσα — живая душа, 生き物."
  11: "βδελύξεσθε — гнушайтесь (βδελύσσομαι). θνησιμαῖα — трупы."
  12: "πτερύγια καὶ λεπίδες — плавники и чешуя."
  13: "βδελύξεσθε ἀπὸ τῶν πετεινῶν — гнушайтесь из птиц. ἀετός — орёл (鷲). γρύψ — гриф, сип (禿鷲). ἁλιάετος — морской орёл, скопа (海鷲)."
  14: "γύψ — сип, гриф (禿鷹; в LXX другой синоним, чем γρύψ в 13). ἰκτῖνος — коршун (鳶). τὰ ὅμοια αὐτῷ — подобные ему."
  15: "κόραξ — ворон (からす)."
  16: "στρουθός — здесь страус (ダチョウ; слав. «струф», Син. «страус»). γλαῦξ — сова (ふくろう). λάρος — чайка (かもめ). ἱέραξ — ястреб (鷹)."
  17: "νυκτικόραξ — букв. «ночной ворон»; сова/филин (みみずく; Син. «филин»). καταρράκτης — букв. «ныряющий»; хищная птица, вероятно сокол (隼). ἶβις — ибис (イビス)."
  18: "πορφυρίων — водяная курочка, султанка (水鶏). πελεκάν — пеликан (ペリカン). κύκνος — лебедь (白鳥)."
  19: "γλαῦξ — сова (повтор, как в LXX). ἐρωδιός — цапля (鷺). χαραδριός — ржанка, зуй (千鳥). ἔποψ — удод (ヤツガシラ). νυκτερίς — летучая мышь (こうもり)."
  20: "ἑρπετὰ τῶν πετεινῶν — «пресмыкающиеся из птиц», т. е. крылатые насекомые. πορεύεται ἐπὶ τέσσαρα — ходит на четырёх."
  21: "σκέλη ἀνώτερον τῶν ποδῶν — голени выше ступней. πηδᾶν ἐν αὐτοῖς — прыгать ими."
  22: "βροῦχος, ἀττάκης, ἀκρίς — виды саранчовых; переданы родовыми いなご, ばった, きりぎりす. ὀφιομάχης — букв. «змееборец», вид саранчи, точное отождествление неясно, передан родовым 羽のある虫. Син. передаёт евр. названия транслитерацией (солам, харгол, хагаб)."
  23: "πᾶν ἑρπετὸν ἀπὸ τῶν πετεινῶν — всякое крылатое пресмыкающееся. τέσσαρες πόδες — четыре ноги."
  24: "μιανθήσεσθε — осквернитесь (μιαίνω). ἕως ἑσπέρας — до вечера."
  25: "αἴρων — поднимающий, несущий. πλυνεῖ τὰ ἱμάτια — вымоет одежды."
  26: "διχηλοῦν… καὶ μηρυκισμὸν οὐ μαρυκᾶται — раздвояет копыто, но жвачки не жуёт (μαρυκᾶται — редкая форма = μηρυκάζεται)."
  27: "πορεύεται ἐπὶ χειρῶν — ходит «на руках», т. е. на лапах (слав. «на лапах»). θνησιμαῖα — трупы."
  28: "αἴρων — несущий. ἀκάθαρτα ταῦτα ὑμῖν — нечисты они для вас."
  29: "γαλῆ — ласка (いたち). μῦς — мышь (ねずみ). κροκόδειλος ὁ χερσαῖος — «земной крокодил», т. е. ящерица (とかげの一種; Син. «ящерица»)."
  30: "μυγαλῆ — землеройка (トガリネズミ). χαμαιλέων — хамелеон (カメレオン). καλαβώτης — геккон/ящерица (やもり). σαύρα — ящерица (とかげ). ἀσπάλαξ — крот (もぐら)."
  31: "ἁπτόμενος αὐτῶν τεθνηκότων — прикасающийся к ним мёртвым."
  32: "ἐφ᾽ ὃ ἂν ἐπιπέσῃ — на что упадёт. σκεῦος ξύλινον — деревянный сосуд. σάκκος — мешок, вретище. βαφήσεται — будет погружено (βάπτω)."
  33: "σκεῦος ὀστράκινον — глиняный сосуд. συντριβήσεται — будет разбит."
  34: "βρῶμα — пища. ποτόν — питьё. ἀγγεῖον — сосуд."
  35: "κλίβανος — печь. κυθρόπους — очаг, треножник. καθαιρεθήσονται — будут разрушены."
  36: "πηγὴ ὑδάτων — источник вод. λάκκος — яма, колодец. συναγωγὴ ὕδατος — собрание вод, водоём."
  37: "σπέρμα σπόριμον — посевное семя. ὃ σπαρήσεται — которое будет посеяно."
  38: "ἐπιχυθῇ ὕδωρ — если налита вода. ἐπιπέσῃ τῶν θνησιμαίων — упадёт из трупов."
  39: "ἀποθάνῃ τῶν κτηνῶν ὅ ἐστιν ὑμῖν τοῦτο φαγεῖν — умрёт из скотов, которые вам в пищу."
  40: "ὁ ἐσθίων — «едящий». πλυνεῖ τὰ ἱμάτια — вымоет одежды. λούσεται ὕδατι — омоется водой."
  41: "ἕρπει ἐπὶ τῆς γῆς — ползает по земле. οὐ βρωθήσεται — не должно быть съедено."
  42: "πορευόμενος ἐπὶ κοιλίας — ползающий на чреве. διὰ παντός — постоянно. πολυπληθεῖ ποσίν — имеет много ног (πολυπληθής)."
  43: "βδελύξητε τὰς ψυχὰς ὑμῶν — омерзите души ваши. μιανθήσεσθε — осквернитесь."
  44: "ἁγιασθήσεσθε — освятитесь (pass. imper.); ἅγιοι ἔσεσθε — будете святы. κινούμενα ἐπὶ τῆς γῆς — движущиеся по земле."
  45: "ὁ ἀναγαγὼν ὑμᾶς — выведший вас (ἀνάγω). εἶναι ὑμῶν θεός — быть вашим Богом."
  46: "οὗτος ὁ νόμος — вот закон. ψυχὴ κινουμένη ἐν τῷ ὕδατι — живое в воде."
  47: "διαστεῖλαι — различать (διαστέλλω). ζωογονούντων — букв. «производящих живое»; здесь — животных (слав. «оживляющих ядомая»)."
