# jp-box, Иеремия, глава 7. Черновик для приёмки.
#
# Нумерация — по славянской и Синодальной Библии (масоретский порядок глав):
# так привычнее читателю. В Септуагинте (gr-lxx-byz) эта глава — 7.
# База: Септуагинта; контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# --- прежние заметки (написаны при нумерации по гр.; номера в них — греческие) ---
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc по Иеремии — только фрагменты (гл. 11, 12, 31); в гл. 7 его нет.
# jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 7 — речь в храме: 1 надписание; 2 пророк у ворот храма; 3–7 призыв исправить
# пути и обетование; 8–15 обличение — «храм Господень», Силом, изгнание; 16–20 запрет
# молитвы и обличение идолослужения; 21–28 всесожжения и главная заповедь, непослушание
# отцов, «народ сей»; 29–34 плач, мерзости в доме, Тофет, погибель.
# Голоса: 7:1 — надписание, кавычек нет; 7:2 — повеление и воззвание пророка, без
# кавычек (вводная формула, ср. is 1:2–10); 7:3–34 — одна цитата 「…» (слово Господа
# через пророка; «と主は言われる» в 7:11, 7:19, 7:30, 7:32 и «と主は言われた» в
# конце 7:15 оставлены внутри); вложенные 『…』: 7:4 («храм Господень»), 7:10
# (самооправдание народа), 7:23 (заповедь, данная отцам), 7:28 (слово, которое надо
# сказать).
# Нумерация по gr: 34 стиха, совпадает с csl и ru. Слав. делит внутри главы иначе лишь
# в 7:1 (в gr — точка, стих восстановлен по слав.) и в 7:27–28 (gr склеил 27–28, см.
# notes к 7:27–28); держим гр.
# 〔…〕 нет: все стихи есть в gr-lxx-byz, кроме точки 7:1 (лакуна модуля, переведено
# по слав.) и точки 7:28 (там же). Сносок ⟨…⟩ нет: 寄留, 孤児, やもめ, バアル, 粗布,
# 花婿, トフェト уже в корпусе или пояснены в notes.
# Имена — транслитерация греческого (LXX): エレミヤ, ユダヤ, シオン, シロ, エフライム;
# место Тофета — ベン・ヒノムの谷 (гр. φάραγξ υἱοῦ Εννομ; в корпусе ベン・ヒノムの谷,
# ср. 4 Цар 23:10) и トフェト (гр. Ταφεθ/Τοφεθ).
