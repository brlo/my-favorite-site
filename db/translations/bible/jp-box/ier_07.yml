verses:
  1: "主[しゅ]からエレミヤに臨[のぞ]んだ言葉[ことば]。"
  2: "主[しゅ]の家[いえ]の門[もん]に立[た]ち、そこでこの言葉[ことば]を告[つ]げよ。主[しゅ]の言葉[ことば]を聞[き]け、ユダヤ全体[ぜんたい]よ。この門[もん]を通[とお]って主[しゅ]を礼拝[れいはい]するために入[はい]る者[もの]よ。"
  3: "イスラエルの神[かみ]、万軍[ばんぐん]の主[しゅ]はこう言[い]われる。「あなたがたの道[みち]と行[おこな]いを改[あらた]めよ。そうすれば、わたしはあなたがたをこの場所[ばしょ]に住[す]まわせる。"
  4: "あなたがたは、『主[しゅ]の神殿[しんでん]、主[しゅ]の神殿、主[しゅ]の神殿』と言[い]って、偽[いつわ]りの言葉[ことば]に頼[たよ]ってはならない。それはあなたがたに何[なに]の益[えき]にもならない。"
  5: "もしあなたがたが、まことに自分[じぶん]の道[みち]と行[おこな]いを改[あらた]め、人[ひと]とその隣[となり]との間[あいだ]に正[ただ]しい裁[さば]きを行[おこな]い、"
  6: "寄留[きりゅう]の者[もの]、孤児[みなしご]、やもめを虐[しいた]げず、この場所[ばしょ]に無実[むじつ]の血[ち]を流[なが]さず、またほかの神々[かみがみ]に従[したが]って、自分[じぶん]に災[わざわ]いを招[まね]かないなら、"
  7: "わたしはあなたがたを、あなたがたの父[ちち]たちに永遠[えいえん]から永遠[えいえん]までに与[あた]えた地[ち]、この場所[ばしょ]に住[す]まわせる。"
  8: "見[み]よ、あなたがたは、何[なに]の益[えき]にもならない偽[いつわ]りの言葉[ことば]に頼[たよ]っている。"
  9: "盗[ぬす]み、殺[ころ]し、姦淫[かんいん]し、偽[いつわ]りをもって誓[ちか]い、バアルに香[こう]をたき、あなたがたが知[し]らないほかの神々[かみがみ]に従[したが]って、自分[じぶん]に災[わざわ]いを招[まね]き、"
  10: "わたしの名[な]が呼[よ]ばれているこの家[いえ]に来[き]て、わたしの前[まえ]に立[た]ち、『われわれは、これらの忌[い]まわしいことをすべて行[おこな]わないように遠[とお]ざかった』と言[い]って、これらの忌[い]まわしいことをすべて行[おこな]うのか。"
  11: "わたしの名[な]が呼[よ]ばれているこの家[いえ]は、あなたがたの目[め]に盗人[ぬすびと]の巣[す]となったのか。見[み]よ、わたし自身[じしん]がそれを見[み]た、と主[しゅ]は言[い]われる。"
  12: "さあ、わたしの場所[ばしょ]、シロにある所[ところ]へ行[い]き、わたしが初[はじ]めにわたしの名[な]を住[す]まわせたその所[ところ]に、わたしが何[なに]をしたかを見[み]よ。それは、わが民[たみ]イスラエルの悪[あく]のゆえであった。"
  13: "そして今[いま]、あなたがたがこれらすべての業[わざ]を行[おこな]ったので、また、わたしが朝早[あさはや]くからあなたがたに語[かた]り、呼[よ]びかけたのに、あなたがたが聞[き]かず、答[こた]えなかったので、"
  14: "わたしは、わたしの名[な]が呼[よ]ばれているこの家[いえ]、すなわちあなたがたが頼[たよ]り、あなたがたとあなたがたの父[ちち]たちに与[あた]えたこの場所[ばしょ]に、シロに行[おこな]ったのと同[おな]じように行[おこな]う。"
  15: "そして、わたしはあなたがたをわたしの前[まえ]から投[な]げ捨[す]てる。わたしがあなたがたの兄弟[きょうだい]たち、エフライムの種[しゅ]のすべてを投[な]げ捨[す]てたように。"
  16: "あなたは、この民[たみ]のために祈[いの]ってはならない。彼らが憐[あわれ]みを受[う]けるように求[もと]めてもならない。彼らのために願[ねが]っても、わたしのところへ近[ちか]づいてもならない。わたしは聞[き]かないからである。"
  17: "あなたは、彼らがユダの町々[まちまち]とエルサレムの道[みち]で行[おこな]っていることを見[み]ないのか。"
  18: "その子[こ]どもたちは木[き]を集[あつ]め、父[ちち]たちは火[ひ]をたき、女[おんな]たちは粉[こな]を練[ね]って、天[てん]の軍勢[ぐんぜい]に菓子[かし]を供[そな]え、ほかの神々[かみがみ]に注[そそ]ぎ物[もの]を注[そそ]いで、わたしを怒[いか]らせている。"
  19: "彼らはわたしを怒[いか]らせているのか、と主[しゅ]は言[い]われる。そうではなく、自分[じぶん]自身[じしん]を怒[いか]らせているのではないか。自分[じぶん]の顔[かお]を恥[は]ずかしめるために。"
  20: "それゆえ、主[しゅ]はこう言[い]われる。見[み]よ、わたしの怒[いか]りと憤[いきどお]りはこの場所[ばしょ]に、人[ひと]にも、家畜[かちく]にも、野[の]の木[き]にも、地[ち]の実[みの]りにも注[そそ]がれ、燃[も]え上[あ]がって消[き]えない。"
  21: "イスラエルの神[かみ]、万軍[ばんぐん]の主[しゅ]はこう言[い]われる。あなたがたの燔祭[はんさい]をあなたがたの犠牲[ぎせい]に集[あつ]め、肉[にく]を食[た]べよ。"
  22: "わたしがあなたがたの父[ちち]たちをエジプトの地[ち]から導[みちび]き上[あ]げた日[ひ]、燔祭[はんさい]と犠牲[ぎせい]について彼らに語[かた]ったのでも、命[めい]じたのでもない。"
  23: "ただ、このことを彼らに命[めい]じて言[い]った。『わたしの声[こえ]を聞[き]け。そうすれば、わたしはあなたがたの神[かみ]となり、あなたがたはわたしの民[たみ]となる。わたしがあなたがたに命[めい]じるすべての道[みち]を歩[あゆ]め。あなたがたが幸[しあわ]せになるために。』"
  24: "しかし、彼らは聞[き]かず、耳[みみ]を傾[かたむ]けなかった。彼らは自分[じぶん]の悪[わる]い心[こころ]の思[おも]いと、かたくなさのままに歩[あゆ]み、前[まえ]ではなく後[うし]ろへ向[む]かった。"
  25: "あなたがたの父[ちち]たちがエジプトの地[ち]から出[で]た日[ひ]から今日[こんにち]に至[いた]るまで、わたしはあなたがたに、わたしの僕[しもべ]であるすべての預言者[よげんしゃ]たちを、日[ひ]ごとに朝早[あさはや]くから遣[つか]わし続[つづ]けた。"
  26: "しかし、彼らはわたしに聞[き]かず、耳[みみ]を傾[かたむ]けず、うなじを固[かた]くして、自分[じぶん]の父[ちち]たちよりも悪[わる]くなった。"
  27: "あなたは彼らにこれらのすべての言葉[ことば]を語[かた]れ。しかし、彼らはあなたに聞[き]かず、あなたが呼[よ]んでも答[こた]えない。"
  28: "あなたは彼らに言[い]え。『これは、その神[かみ]である主[しゅ]の声[こえ]を聞[き]かず、懲[こ]らしめを受[う]けない民[たみ]である。信仰[しんこう]は消[き]え失[う]せ、彼らの口[くち]から取[と]り去[さ]られた。』"
  29: "あなたの頭[あたま]を刈[か]って投[な]げ捨[す]て、唇[くちびる]に嘆[なげ]きをのせよ。主[しゅ]がこのことを行[おこな]う世代[せだい]を捨[す]てて退[しりぞ]けられたからである。"
  30: "ユダの子[こ]らはわたしの目[め]に悪[わる]いことを行[おこな]った、と主[しゅ]は言[い]われる。彼らはわたしの名[な]が呼[よ]ばれている家[いえ]に自分[じぶん]の忌[い]まわしいものを置[お]いて、それを汚[けが]した。"
  31: "彼らは、ベン・ヒノムの谷[たに]にあるトフェトの祭壇[さいだん]を建[た]て、自分[じぶん]の息子[むすこ]たちと娘[むすめ]たちを火[ひ]の中[なか]で焼[や]いた。それはわたしが命[めい]じたこともなく、心[こころ]に思[おも]い浮[か]かべたこともないことである。"
  32: "それゆえ、見[み]よ、日[ひ]が来[く]る、と主[しゅ]は言[い]われる。もはやトフェトの祭壇[さいだん]とも、ベン・ヒノムの谷[たに]とも呼[よ]ばれず、殺[ころ]された者[もの]の谷[たに]と呼[よ]ばれる。人々はトフェトに、場所[ばしょ]がないので葬[ほうむ]る。"
  33: "この民[たみ]の死体[したい]は天[てん]の鳥[とり]と地[ち]の獣[けもの]の食[た]べ物[もの]となり、それらを追[お]い払[はら]う者[もの]はない。"
  34: "わたしはユダの町々[まちまち]とエルサレムの通[とお]りから、喜[よろこ]ぶ声[こえ]と歓[よろこ]びの声、花婿[はなむこ]の声と花嫁[はなよめ]の声を断[た]つ。この地[ち]のすべてが荒[あ]れ果[は]てるからである。」"

notes:
  1: "В модуле стих — точка (лакуна); переведено по слав. 7:1: «Слово, еже бысть ко иеремии от Господа, глаголющее». В LXX 7:1 — то же надписание (ὁ λόγος ὁ γενόμενος παρὰ κυρίου πρὸς Ιερεμιαν λέγων); слав. продолжает его повелением 7:2. Надписание, кавычек нет."
  2: "В гр. 7:2 только Ἀκούσατε λόγον κυρίου, πᾶσα ἡ Ιουδαία — «слушайте слово Господне, вся Иудея»; слав. 7:2 содержит и повеление: «стани во вратех дому Господня и проповеждь тамо слово то и глаголи… ходящии сквозе врата сия, да поклонитеся Господу» — этих слов нет в LXX (чтение МТ), по паритету внесены в основной текст без скобок. πύλη — ворота, 門; προσκυνέω — поклоняться, 礼拝する. Вводное воззвание — вне кавычек; слово Господа начинается в 7:3."
  3: "τάδε λέγει κύριος ὁ θεὸς Ισραηλ — «так говорит Господь Бог Израилев»; слав. добавляет «сил» (Саваоф) — нет в LXX, внесено без скобок (万軍の主). διορθώσατε τὰς ὁδοὺς ὑμῶν καὶ τὰ ἐπιτηδεύματα ὑμῶν — «исправьте пути ваши и деяния ваши» (διορθόω — выпрямлять, исправлять; ἐπιτήδευμα — занятие, дело, 行い); слав. «исправити пути вашя и начинания ваша». κατοικιῶ ὑμᾶς ἐν τῷ τόπῳ τούτῳ — «вселю вас на месте сем» (κατοικίζω — поселять)."
  4: "μὴ πεποίθατε ἐφ᾽ ἑαυτοῖς ἐπὶ λόγοις ψευδέσιν — «не надейтесь на себя в словах ложных» (πείθω, перфект — полагаться); слав. «не надейтеся на себе во словесех лживых». ὅτι τὸ παράπαν οὐκ ὠφελήσουσιν ὑμᾶς — «ибо совершенно не принесут вам пользы» (ὠφελέω). Слова «храм Господень» в LXX повторены дважды (ναὸς κυρίου ναὸς κυρίου ἐστίν), в слав. и МТ — трижды; по паритету в тексте трижды (слав.), отмечено. Вложенная цитата — 『…』."
  5: "ἐὰν διορθοῦντες διορθώσητε — «если исправляя исправите» (усилительный оборот: причастие + финитная форма, как в евр. перед инфинитивом absolutus); слав. «аще исправляюще исправите». ποιοῦντες ποιήσητε κρίσιν — «творя творя суд» (тот же оборот). ἀνὰ μέσον ἀνδρὸς καὶ ἀνὰ μέσον τοῦ πλησίον αὐτοῦ — «между мужем и между ближним его», т. е. в тяжбах. Условие продолжается в 7:6–7, поэтому стих кончается на «…行い、» — деление по гр. (слав. так же)."
  6: "προσήλυτον καὶ ὀρφανὸν καὶ χήραν μὴ καταδυναστεύσητε — «пришельца, сироту и вдову не притесняйте» (καταδυναστεύω — угнетать; προσήλυτος — пришелец, 寄留の者); слав. «пришелцу и сиру и вдовице не сотворите насилия». αἷμα ἀθῷον μὴ ἐκχέητε — «крови невинной не проливайте» (ἀθῷος — невинный); ἐν τῷ τόπῳ τούτῳ — «на месте сем». ὀπίσω θεῶν ἀλλοτρίων μὴ πορεύησθε εἰς κακὸν ὑμῖν — «за богами чужими не ходите на зло вам» (εἰς κακόν — «на беду»). Условие продолжается."
  7: "κατοικιῶ ὑμᾶς … ἐν γῇ, ῇ ἔδωκα τοῖς πατράσιν ὑμῶν ἐξ αἰῶνος καὶ ἕως αἰῶνος — «вселю вас… в земле, которую дал отцам вашим от века и до века» (αἰών — век). ἐξ αἰῶνος καὶ ἕως αἰῶνος — формула вечности, в тексте «永遠から永遠まで». Аподосис условия 7:5–6."
  8: "εἰ δὲ ὑμεῖς πεποίθατε ἐπὶ λόγοις ψευδέσιν, ὅθεν οὐκ ὠφεληθήσεσθε — «если же вы надеетесь на слова ложные, откуда не получите пользы»; условная конструкция в гр. риторическая, в тексте передана утверждением (ср. ru «Вот, вы надеетесь…»); слав. «Аще же вы надеетеся…» — условно."
  9: "καὶ φονεύετε καὶ μοιχᾶσθε καὶ κλέπτετε — «и убиваете, и прелюбодействуете, и крадёте»: порядок по гр., у слав. иначе («крадете и убиваете…»). ὀμνύετε ἐπ᾽ ἀδίκῳ — «клянётесь на неправде», т. е. ложно (ἄδικος — неправедный); слав. «кленетеся лживо». ἐθυμιᾶτε τῇ Βααλ — «кадите Ваалу» (θυμιάω — воскурять, 香をたく); Βααλ — バアル. ὧν οὐκ οἴδατε — «которых не знаете»; τοῦ κακῶς εἶναι ὑμῖν — «чтобы худо было вам» (εἶναι с наречием — «на беду»)."
  10: "καὶ ἤλθετε καὶ ἔστητε ἐνώπιον ἐμοῦ ἐν τῷ οἴκῳ, οὗ ἐπικέκληται τὸ ὄνομά μου ἐπ᾽ αὐτῷ — «и пришли, и стали пред лицом Моим в доме, над которым наречено имя Моё» (ἐπικαλέω — нарекать; слав. «в немже призвано есть имя мое»). καὶ εἴπατε Ἀπεσχήμεθα τοῦ μὴ ποιεῖν πάντα τὰ βδελύγματα ταῦτα — «и сказали: мы удалились (воздержались) от того, чтобы делать все эти мерзости» (ἀπέχομαι — держаться вдали, воздерживаться; βδέλυγμα — мерзость, 忌まわしいもの); вложенная цитата 『…』; ru «мы спасены» следует МТ, в текст не внесено."
  11: "μὴ σπήλαιον λῃστῶν ὁ οἶκός μου … ἐνώπιον ὑμῶν; — «не вертепом ли разбойников дом Мой… в глазах ваших?» (σπήλαιον — пещера, вертеп; λῃστής — разбойник, 盗人; 巣 передаёт «вертеп»). ἐγὼ ἰδοὺ ἑώρακα — «вот, Я видел» (ὁράω, перфект); λέγει κύριος — внутри речи."
  12: "ὅτι πορεύθητε εἰς τὸν τόπον μου τὸν ἐν Σηλωμ — «ибо пойдите на место Моё, что в Силоме» (Σηλωμ — Силом, シロ); οὗ κατεσκήνωσα τὸ ὄνομά μου ἐκεῖ ἔμπροσθεν — «где Я прежде поставил имя Моё» (κατασκηνόω — водружать шатёр, вселять; слав. «идеже вселих имя мое от начала»). ἃ ἐποίησα αὐτῷ ἀπὸ προσώπου κακίας λαοῦ μου Ισραηλ — «что Я сделал с ним из-за злобы народа Моего Израиля». Силом — место скинии (ср. 1 Цар 4)."
  13: "καὶ νῦν ἀνθ᾽ ὧν ἐποιήσατε πάντα τὰ ἔργα ταῦτα — «и ныне, за то что вы делали все эти дела». ἐλάλησα πρὸς ὑμᾶς καὶ οὐκ ἠκούσατέ μου — «Я говорил вам, и вы не слушали Меня»; слав. добавляет «рано востая и глаголя» (от МТ) — нет в LXX, внесено без скобок (朝早くから). ἐκάλεσα ὑμᾶς καὶ οὐκ ἀπεκρίθητε — «звал вас, и вы не отвечали». Слав. вставляет здесь «рече Господь» — в LXX нет; не внесено, чтобы не разрывать речь."
  14: "καὶ ποιήσω τῷ οἴκῳ τούτῳ, ᾧ ἐπικέκληται τὸ ὄνομά μου ἐπ᾽ αὐτῷ, ἐφ᾽ ᾧ ὑμεῖς πεποίθατε ἐπ᾽ αὐτῷ — «и сделаю дому сему, над которым наречено имя Моё, на который вы надеетесь»; καὶ τῷ τόπῳ, ᾧ ἔδωκα ὑμῖν καὶ τοῖς πατράσιν ὑμῶν — «и месту, которое Я дал вам и отцам вашим»; καθὼς ἐποίησα τῇ Σηλωμ — «как сделал Я Сило́му» (дательный падеж)."
  15: "ἀπορρίψω ὑμᾶς ἀπὸ προσώπου μου — «отвергну вас от лица Моего» (ἀπορρίπτω — отбрасывать); καθὼς ἀπέρριψα τοὺς ἀδελφοὺς ὑμῶν πᾶν τὸ σπέρμα Εφραιμ — «как отверг братьев ваших, всё семя Ефрема» (Ефрем — Северное царство, павшее в 722 г. до Р. Х.). Кавычки закрываются в конце стиха; 7:16 — продолжение слова Господа, но уже с запретом молитвы."
  16: "καὶ σὺ μὴ προσεύχου περὶ τοῦ λαοῦ τούτου — «и ты не молись о народе сем» (προσεύχομαι). μὴ ἀξίου τοῦ ἐλεηθῆναι αὐτούς — «не проси, чтобы они были помилованы» (ἀξιόω — просить, считать достойным); μὴ εὔχου — «не моли» (εὔχομαι); μὴ προσέλθῃς μοι περὶ αὐτῶν — «не приступай ко Мне о них» (προσέρχομαι); ὅτι οὐκ εἰσακούσομαι — «ибо Я не услышу». Запрет усилен четырьмя глаголами — все сохранены."
  17: "ἦ οὐχ ὁρᾷς τί αὐτοὶ ποιοῦσιν — «разве ты не видишь, что они делают»; ἐν ταῖς πόλεσιν Ιουδα — «в городах Иуды» (Иуда — ユダ); ἐν ταῖς ὁδοῖς Ιερουσαλημ — «на улицах Иерусалима» (ὁδός здесь «улица»)."
  18: "οἱ υἱοὶ αὐτῶν συλλέγουσιν ξύλα — «сыновья их собирают дрова»; οἱ πατέρες … καίουσι πῦρ — «отцы разжигают огонь»; αἱ γυναῖκες … τρίβουσιν σταῖς — «жёны месят тесто» (τρίβω — тереть, месить; σταῖς — тесто); τοῦ ποιῆσαι χαυῶνας — «чтобы сделать лепёшки» (χαυών — лепёшка, печенье, 菓子); τῇ στρατιᾷ τοῦ οὐρανοῦ — «воинству небесному» (στρατιά — войско, 天の軍勢), т. е. звёздам (ср. 8:2); ἔσπεισαν σπονδὰς θεοῖς ἀλλοτρίοις — «возлили возлияния чужим богам» (σπένδω — возливать; σπονδή — возлияние, 注ぎ物); ἵνα παροργίσωσίν με — «чтобы разгневать Меня»."
  19: "μὴ ἐμὲ αὐτοὶ παροργίζουσιν; — «Меня ли они гневают?»; οὐχὶ ἑαυτούς — «не себя ли»; ὅπως καταισχυνθῇ τὰ πρόσωπα αὐτῶν — «так что постыдятся лица их» (καταισχύνω — посрамлять). «と主は言われる» внутри речи."
  20: "Ἰδοὺ ὀργὴ καὶ θυμός μου χεῖται — «вот, гнев и ярость Моя изливается» (χεῖται — наст. вр. от χέω, «льётся»); ἐπὶ τὸν τόπον τοῦτον καὶ ἐπὶ τοὺς ἀνθρώπους καὶ ἐπὶ τὰ κτήνη — «на место сие, и на людей, и на скот» (κτῆνος — скот, 家畜); ἐπὶ πᾶν ξύλον τοῦ ἀγροῦ — «на всякое дерево поля»; ἐπὶ πάντα τὰ γενήματα τῆς γῆς — «на все произрастания земли» (γένημα — плод, 実り); καυθήσεται καὶ οὐ σβεσθήσεται — «возгорится и не угаснет» (σβέννυμι — гасить). В гр. «Господь» без «Бог»; в тексте «主」."
  21: "τὰ ὁλοκαυτώματα ὑμῶν συναγάγετε μετὰ τῶν θυσιῶν ὑμῶν καὶ φάγετε κρέα — «всесожжения ваши соберите с жертвами вашими и ешьте мясо»; смысл: жертвы не нужны, ешьте сами (ср. 7:22–23). Слав. добавляет «Господь сил, Бог израилев» — в LXX только κύριος; внесено без скобок (万軍の主、イスラエルの神), отмечено."
  22: "οὐκ ἐλάλησα … οὐκ ἐνετειλάμην — «не говорил… и не заповедал» (ἐντέλλομαι — заповедовать); περὶ ὁλοκαυτωμάτων καὶ θυσίας — «о всесожжениях и жертве». Речь не о том, что жертвы не были установлены вовсе (ср. Лев), а о том, что главное — послушание (7:23); так и в LXX/слав. — не сглажено. Продолжение — 7:23."
  23: "ἀλλ᾽ ἢ τὸ ῥῆμα τοῦτο — «но только слово это» (ἀλλ᾽ ἢ — «кроме, только»). Ἀκούσατε τῆς φωνῆς μου — «слушайте голоса Моего»; καὶ ἔσομαι ὑμῖν εἰς θεόν — «и буду вам Богом»; ὑμεῖς ἔσεσθέ μοι εἰς λαόν — «и вы будете Мне народом» — формула завета. πορεύεσθε ἐν πάσαις ταῖς ὁδοῖς μου — «ходите всеми путями Моими»; ὅπως ἂν εὖ ᾖ ὑμῖν — «чтобы хорошо было вам» (εὖ — хорошо). Вложенная цитата 『…』 — заповедь, данная отцам."
  24: "οὐ προσέσχεν τὸ οὖς αὐτῶν — «не приклонилось ухо их» (προσέχω — внимать). ἐπορεύθησαν ἐν τοῖς ἐνθυμήμασιν τῆς καρδίας αὐτῶν τῆς κακῆς — «пошли в помышлениях сердца своего злого» (ἐνθύμημα — помысел, 思い); слав. добавляет «и стропотстве» («в похотех и стропотстве») — нет в LXX, внесено без скобок (かたくなさ). ἐγενήθησαν εἰς τὰ ὄπισθεν καὶ οὐκ εἰς τὰ ἔμπροσθεν — «стали назад, а не вперёд», т. е. спиной к Богу."
  25: "ἀφ᾽ ἧς ἡμέρας ἐξήλθοσαν οἱ πατέρες αὐτῶν — «от дня, когда вышли отцы их» (ἐξέρχομαι). ἐξαπέστειλα πρὸς ὑμᾶς πάντας τοὺς δούλους μου τοὺς προφήτας — «посылал Я к вам всех рабов Моих, пророков» (ἐξαποστέλλω). ἡμέρας καὶ ὄρθρου — «днём и на рассвете» (ὄρθρος — рассвет, 朝早く); слав. «в день и рано востая». ἀπέστειλα — повтор глагола в конце, как в гр."
  26: "ἐσκλήρυναν τὸν τράχηλον αὐτῶν — «ожесточили шею свою» (σκληρύνω — делать жёстким; τράχηλος — шея, выя); ὑπὲρ τοὺς πατέρας αὐτῶν — «более отцов своих». Повтор 7:24 усилен."
  27: "В модуле gr 7:27 помечен «27-28» и содержит сразу καὶ ἐρεῖς αὐτοῖς τὸν λόγον τοῦτον — «и скажешь им слово это» — и Τοῦτο τὸ ἔθνος… (то, что в LXX и слав. стоит в 7:28). Слав. 7:27: «И речеши к ним вся словеса сия, и не услышат тя, и воззовеши их, и не отвещают тебе» — чтение МТ. Держим деление LXX/слав.: 7:27 — приказ и отказ, 7:28 — «народ сей»; содержание не потеряно. ἐρεῖς — «скажешь» (λέγω); οὐκ ἀκούσονταί σου — «не послушают тебя»; καλέσεις — «воззовёшь»."
  28: "В модуле стих — точка (лакуна): в gr 7:28 пусто, потому что текст 7:28 склеен с 7:27 (см. notes к 7:27). Переведено по слав. 7:28: «И речеши к ним: сей язык, иже не послуша гласа Господа Бога своего, ни восприят наказания: погибе вера и отята есть от уст их». τοῦτο τὸ ἔθνος — «народ сей» (ἔθνος — народ; слав. «язык»); οὐδὲ ἐδέξατο παιδείαν — «и не принял наставления» (παιδεία — наказание, наставление, 懲らしめ); ἐξέλιπεν ἡ πίστις ἐκ στόματος αὐτῶν — «иссякла вера из уст их» (πίστις — вера, верность, 信仰). Вложенная цитата 『…』 внутри слова Господа."
  29: "Κεῖραι τὴν κεφαλήν σου — «остриги голову твою» (κείρω — стричь); ἀπόρριπτε — «брось» (ἀπορρίπτω); ἀνάλαβε ἐπὶ χειλέων θρῆνον — «возьми на уста плач» (ἀναλαμβάνω — брать; χεῖλος — губа; θρῆνος — плач); слав. «восприими во устне рыдание». У ru (МТ) «подними плач на горах» — иное чтение, не внесено. ἀπεδοκίμασεν κύριος καὶ ἀπώσατο — «отверг Господь и отринул» (ἀπωθέω); τὴν γενεὰν τὴν ποιοῦσαν ταῦτα — «род, делающий это»."
  30: "ἔταξαν τὰ βδελύγματα αὐτῶν — «поставили мерзости свои» (τάσσω — ставить); ἐν τῷ οἴκῳ, οὗ ἐπικέκληται τὸ ὄνομά μου ἐπ᾽ αὐτόν — «в доме, над которым наречено имя Моё»; τοῦ μιᾶναι αὐτόν — «чтобы осквернить его» (μιαίνω — осквернять). «と主は言われる» внутри речи — как в 6:12."
  31: "ᾠκοδόμησαν τὸν βωμὸν τοῦ Ταφεθ — «построили жертвенник Тофета» (βωμός — жертвенник, 祭壇; Ταφεθ — トフェト, ср. 4 Цар 23:10); ἐν φάραγγι υἱοῦ Εννομ — «в долине сына Еннома» (φάραγξ — ущелье, долина); в тексте «ベン・ヒノムの谷» по корпусу (ср. 4 Цар 23:10), греч. форма — в notes. τοῦ κατακαίειν — «сожигать» (κατακαίω); ὃ οὐκ ἐνετειλάμην αὐτοῖς — «чего Я не заповедал им»; οὐ διενοήθην ἐν τῇ καρδίᾳ μου — «и не помыслил в сердце Моём» (διανοέομαι)."
  32: "οὐκ ἐροῦσιν ἔτι Βωμὸς τοῦ Ταφεθ καὶ Φάραγξ υἱοῦ Εννομ — «не будут больше говорить: жертвенник Тофета и долина сына Еннома»; ἀλλ᾽ ἢ Φάραγξ τῶν ἀνῃρημένων — «но долина убитых» (ἀναιρέω — убивать); θάψουσιν ἐν τῷ Ταφεθ διὰ τὸ μὴ ὑπάρχειν τόπον — «будут хоронить в Тофете, потому что нет места» (θάπτω — погребать)."
  33: "ἔσονται οἱ νεκροὶ τοῦ λαοῦ τούτου εἰς βρῶσιν — «будут трупы народа сего в пищу» (βρῶσις — пища); πετεινὰ τοῦ οὐρανοῦ — «птицы небесные» (πετεινόν); θηρία τῆς γῆς — «звери земные» (θηρίον); οὐκ ἔσται ὁ ἀποσοβῶν — «не будет отгоняющего» (ἀποσοβέω — отгонять)."
  34: "καταλύσω … φωνὴν εὐφραινομένων καὶ φωνὴν χαιρόντων — «прекращу… голос веселящихся и голос радующихся» (καταλύω — разрушать, прекращать; εὐφραίνομαι — веселиться); φωνὴν νυμφίου καὶ φωνὴν νύμφης — «голос жениха и голос невесты» (νυμφίος, νύμφη), т. е. свадебные песни; εἰς ἐρήμωσιν ἔσται πᾶσα ἡ γῆ — «в запустение будет вся земля» (ἐρήμωσις). Кавычки закрываются в конце главы."
