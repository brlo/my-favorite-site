#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc по Иеремии — только фрагменты (гл. 11, 12,
# 31), в выгрузку не входил и не использовался; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 13: 1–11 льняной пояс (повеление, покупка, сокрытие у Евфрата, истление,
# толкование); 12–14 мехи с вином — слово и суд; 15–27 увещание и плач об Иерусалиме.
# Голоса: 1, 4, 6 — 「…» (слово Господа пророку); 2, 3, 5, 7, 8 — авторский текст;
# 9–14 — 「…» (слово Господа), в 12 ответ народа — 『…』; 15–27 — пророческое обращение
# без кавычек; в 18 слова к царю — 「…», в 22 вопрос народа — 「…». Слово, которое
# пророк должен передать (13:12–14), оставлено в речи Господа без вложенных 『…』.
# Нумерация по gr: 27 стихов; слав. и ru — та же глава 13, номера совпадают, но слав.
# делит иначе: слав. 13:8 кончается «сия глаголет Господь» (у нас — начало 13:9);
# слав. 13:9 включает начало нашего 13:10 («многую гордыню сию людий сих строптивых»);
# слав. 13:12 добавляет «тако рече Господь Бог израилев»; слав. 13:17 добавляет
# «и плачя восплачет». Карта — в notes.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX): エレミヤ, ユダ,
# エルサレム, イスラエル, バアル, ユーフラテス川, ダビデ, エチオピア人.
# 
