chapter: 13
draft: true

verses:
  1: "主[しゅ]はこう言[い]われる。「行[い]け。そして、自分[じぶん]のために亜麻[あま]の帯[おび]を手[て]に入[い]れ、それをあなたの腰[こし]に結[むす]べ。水[みず]には入[い]れてはならない。」"
  2: "わたしは主[しゅ]の言葉[ことば]のとおりに帯[おび]を手[て]に入[い]れ、腰[こし]に結[むす]んだ。"
  3: "そして、主[しゅ]の言葉[ことば]が再[ふたた]びわたしに臨[のぞ]んだ。"
  4: "「あなたが手[て]に入[い]れた帯[おび]、すなわちあなたの腰[こし]にあるものを取[と]り、立[た]ち上[あ]がってユーフラテス川[がわ]へ行[い]き、そこでは岩[いわ]の割[わ]れ目[め]の中[なか]にそれを隠[かく]せ。」"
  5: "わたしは行[い]って、主[しゅ]がわたしに命[めい]じたとおりに、それをユーフラテス川[がわ]のほとりに隠[かく]した。"
  6: "多[おお]くの日[ひ]が過[す]ぎた後[のち]、主[しゅ]はわたしに言[い]われた。「立[た]ち上[あ]がり、ユーフラテス川[がわ]へ行[い]って、わたしがそこに隠[かく]せと命[めい]じた帯[おび]を、そこから取[と]って来[こ]い。」"
  7: "わたしはユーフラテス川[がわ]へ行[い]き、掘[ほ]って、わたしが隠[かく]した場所[ばしょ]から帯[おび]を取[と]った。見[み]ると、帯[おび]は腐[くさ]っていた。何[なに]の役[やく]にも立[た]たないほどだった。"
  8: "そして、主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んだ。"
  9: "主[しゅ]はこう言[い]われる。「このように、わたしはユダの高[たか]ぶりと、エルサレムの高[たか]ぶりを滅[ほろ]ぼす。"
  10: "すなわち、わたしの言葉[ことば]に聞[き]き従[したが]おうとせず、自分[じぶん]の心[こころ]の頑[かたくな]さに従[したが]って歩[あゆ]み、異[い]なる神々[かみがみ]の後[あと]を歩[あゆ]んで、それらに仕[つか]え、それらを拝[おが]む、この大[おお]きな高[たか]ぶりを。そして、彼らは何[なに]の役[やく]にも立[た]たない、この帯[おび]のようになる。"
  11: "というのは、帯[おび]が人[ひと]の腰[こし]に結[むす]びつくように、わたしはイスラエルの家[いえ]のすべてとユダの家[いえ]のすべてを、わたしに結[むす]びつけたからである、と主[しゅ]は言[い]われる。それは、彼らがわたしの民[たみ]となり、名[な]ある者[もの]、誉[ほま]れとなり、栄[えい]えとなるためであった。しかし、彼らはわたしに聞[き]き従[したが]わなかった。"
  12: "そして、あなたはこの民[たみ]に言[い]え。イスラエルの神[かみ]、主[しゅ]はこう言[い]われる。すべての革袋[かわぶくろ]はぶどう酒[ぶどうしゅ]で満[み]たされる。彼らがあなたに『すべての革袋[かわぶくろ]がぶどう酒[ぶどうしゅ]で満たされることを、わたしたちが知[し]らないとでもいうのか』と言[い]うなら、"
  13: "あなたは彼らに言[い]え。主[しゅ]はこう言[い]われる。見[み]よ、わたしはこの地[ち]に住[す]むすべての者[もの]、ダビデの位[くらい]に座[すわ]るその王[おう]たち、祭司[さいし]たち、預言者[よげんしゃ]たち、ユダとエルサレムのすべての住[す]む者[もの]を、酔[よ]いで満[み]たす。"
  14: "そして、わたしは彼らを、人[ひと]とその兄弟[きょうだい]、父[ちち]たちと息子[むすこ]たちをともに、砕[くだ]き散[ち]らす、と主[しゅ]は言[い]われる。わたしはあわれまず、惜[お]しまず、彼らを滅[ほろ]ぼすことから手[て]を引[ひ]かない。」"
  15: "聞[き]け、そして耳[みみ]を傾[かたむ]けよ。高[たか]ぶってはならない。主[しゅ]が語[かた]られたからである。"
  16: "あなたがたの神[かみ]、主[しゅ]に栄光[えいこう]を帰[かえ]せ。暗[くら]くなる前[まえ]に。あなたがたの足[あし]が暗[くら]い山[やま]々[やま]につまずく前[まえ]に。あなたがたが光[ひかり]を待[ま]ち望[のぞ]んでも、そこには死[し]の影[かげ]があり、彼らは暗[くら]やみに置[お]かれる。"
  17: "もし、あなたがたが聞[き]かないなら、あなたがたの魂[たましい]は高[たか]ぶりのゆえに、人[ひと]知[し]れず泣[な]きに泣[な]く。あなたがたの目[め]は涙[なみだ]を流[なが]し、とどまらない。主[しゅ]の群[む]れが奪[うば]い去[さ]られたからである。"
  18: "王[おう]と、権力[けんりょく]ある者[もの]たちに言[い]え。「へりくだって、低[ひく]い所[ところ]に座[すわ]れ。あなたがたの頭[あたま]から、あなたがたの栄光[えいこう]の冠[かんむり]が落[お]ちたからである。」"
  19: "南[みなみ]の町[まち]々[まち]は閉[と]ざされ、開[あ]ける者[もの]はいない。ユダはすべて捕[と]らえ移[うつ]され、完[かん]全[ぜん]な移[い]住[じゅう]を成[な]し遂[と]げた。"
  20: "目[め]を上[あ]げよ、エルサレムよ。北[きた]から来[く]る者[もの]たちを見[み]よ。あなたに与[あた]えられた群[む]れ、あなたの栄光[えいこう]の羊[ひつじ]たちは、どこにいるのか。"
  21: "彼らがあなたを罰[ばっ]する時[とき]、あなたは何[なに]と言[い]うのか。あなた自身[じしん]が、彼らをあなたに対して、支配者[しはいしゃ]とすることを教[おし]えたのに。産[う]む女[おんな]のように、痛[いた]みがあなたを捕[と]らえるのではないか。"
  22: "もし、あなたが心[こころ]のうちで「なぜ、わたしにこれらのことが起[お]こったのか」と言[い]うなら、あなたの不法[ふほう]の多[おお]さのゆえに、あなたの裾[すそ]がめくられ、かかとが辱[はずかし]められるのである。"
  23: "エチオピア人[じん]がその肌[はだ]を、豹[ひょう]がその斑点[はんてん]を変[か]えられるだろうか。変[か]えられるものなら、悪[あく]を学[まな]んできたあなたがたも、善[よ]を行[おこな]うことができるだろう。"
  24: "だから、わたしは彼らを、荒[あ]れ野[の]へ風[かぜ]に運[はこ]ばれる枯[か]れ枝[えだ]のように散[ち]らす。"
  25: "これがあなたのくじ、あなたがわたしに逆[さから]ったことの分[わけ]である、と主[しゅ]は言[い]われる。あなたはわたしを忘[わす]れ、偽[いつわ]りに頼[たよ]ったからである。"
  26: "それゆえ、わたしはあなたの裾[すそ]をあなたの顔[かお]の上[うえ]までまくり上[あ]げ、あなたの恥[はじ]をさらす。"
  27: "わたしはあなたの姦淫[かんいん]と、あなたのいななきと、あなたの淫[いん]らな行[おこな]いの移[うつ]り変[か]わりを、丘[おか]の上[うえ]でも野[の]でも見[み]た。あなたの忌[い]まわしい行[おこな]いを。ああ、エルサレムよ、あなたに災[わざわ]いがある。あなたはわたしの後[あと]に従[したが]っても清[きよ]くならなかった。いつまで続[つづ]くのか。"

notes:
  1: "Τάδε λέγει κύριος — «так говорит Господь»: формула вне кавычек, слово Господа — 「…». Βάδισον καὶ κτῆσαι σεαυτῷ — «иди и приобрети себе» (βαδίζω — идти; κτάομαι — приобретать; слав. «стяжи себе»). περίζωμα λινοῦν — «льняной пояс» (περίζωμα — опоясание, 帯; λινοῦν — льняной; слав. «чресленик льняный»). περὶ τὴν ὀσφύν — «на чресла» (ὀσφύς — чресла, 腰). ἐν ὕδατι οὐ διελεύσεται — «через воду не пройдёт», т. е. не мочить (слав. «в воду да не внесеши того»); в ru «в воду не клади»."
  2: "ἐκτησάμην — «я приобрёл» (κτάομαι); περιέθηκα περὶ τὴν ὀσφύν μου — «обложил вокруг чресл моих» (περιτίθημι — обкладывать, надевать; слав. «обложих окрест чресл моих»). Говорит пророк; авторский текст без кавычек."
  3: "καὶ ἐγενήθη λόγος κυρίου πρὸς μὲ λέγων — «и было слово Господне ко мне, говорящее». Слав. добавляет «вторицею» (во второй раз) — нет в LXX, внесено без скобок (再び)."
  4: "Λαβὲ τὸ περίζωμα… ἀνάστηθι καὶ βάδισον ἐπὶ τὸν Εὐφράτην — «возьми пояс… встань и иди к Евфрату» (слав. «востани и иди ко евфрату»). κατάκρυψον… ἐν τῇ τρυμαλιᾷ τῆς πέτρας — «скрой в расселине скалы» (τρυμαλιά — нора, расселина; слав. «во разселине каменне»)."
  5: "ἐπορεύθην καὶ ἔκρυψα — «я пошёл и скрыл» (слав. «идох и скрых»). ἐν τῷ Εὐφράτῃ — «в Евфрате»; в тексте ユーフラテス川のほとりに: «в реке» по-японски значило бы «в воде», а пояс велено не мочить (13:1)."
  6: "μεθ᾽ ἡμέρας πολλάς — «через много дней» (слав. «по днех мнозех»); ἀνάστηθι βάδισον — «встань, иди»; λαβὲ ἐκεῖθεν τὸ περίζωμα — «возьми оттуда пояс»; ὃ ἐνετειλάμην σοι τοῦ κατακρύψαι — «который Я велел тебе скрыть»."
  7: "ὤρυξα — «я выкопал» (ὀρύσσω; слав. «раскопах»); διεφθαρμένον ἦν — «он был испорчен, сгнил» (διαφθείρω; слав. «изгнил бе»). ὃ οὐ μὴ χρησθῇ εἰς οὐθέν — «который ни на что не годен» (χράομαι — пользоваться; слав. «яко ни на чтоже быти потребну ему»)."
  8: "καὶ ἐγενήθη λόγος κυρίου πρός με λέγων — формула. Слав. присоединяет к 13:8 «сия глаголет Господь», а в gr это начало 13:9, поэтому деление держим по gr: 13:9 начинается с 主はこう言われる."
  9: "Οὕτω φθερῶ τὴν ὕβριν Ιουδα — «так погублю гордость Иуды» (φθείρω — губить; ὕβρις — гордость, надменность; слав. «согнити сотворю гордыню иудину»). Слав. 13:9 включает и начало нашего 13:10 («многую гордыню сию людий сих строптивых»), деление держим по gr."
  10: "τὴν πολλὴν ταύτην ὕβριν — «эту великую гордость»: в gr это начало стиха, у слав. — конец 13:9. τοὺς μὴ βουλομένους ὑπακοῦσαι — «не хотящих слушаться» (ὑπακούω); πορευθέντας ὀπίσω θεῶν ἀλλοτρίων — «пошедших вслед чужих богов»; τοῦ δουλεύειν… καὶ τοῦ προσκυνεῖν — «служить… и поклоняться» (προσκυνέω). Слав. добавляет «ходящих во строптивстве сердца своего» — нет в LXX, внесено (自分の心の頑なさに従って歩み). ὥσπερ τὸ περίζωμα — «как этот пояс»."
  11: "καθάπερ κολλᾶται τὸ περίζωμα περὶ τὴν ὀσφύν — «как прилепляется пояс к чреслам» (κολλάω — прилеплять; слав. «придержится»). ἐκόλλησα πρὸς ἐμαυτὸν τὸν οἶκον τοῦ Ισραηλ — «Я прилепил к Себе дом Израилев» (слав. «прилепих мне»). εἰς λαὸν ὀνομαστόν — «в народ именитый» (ὀνομαστός — знаменитый; слав. «в люди имениты»); εἰς καύχημα καὶ εἰς δόξαν — «в похвалу и в славу». «рече Господь» стоит внутри речи и оставлено в кавычках."
  12: "Πᾶς ἀσκός πληρωθήσεται οἴνου — «всякий мех наполнится вином» (ἀσκός — мех, 革袋; слав. «всяк мех исполнится вина»). Слав. добавляет «тако рече Господь Бог израилев» — в LXX нет, внесено без скобок (イスラエルの神、主はこう言われる). Ответ народа: Μὴ γνόντες οὐ γνωσόμεθα…; — «разве мы, зная, не знаем?» (слав. «еда ведяще не увемы»); вложенная речь — 『…』."
  13: "Τάδε λέγει κύριος — формула внутри речи; Ἰδοὺ ἐγὼ πληρῶ… μεθύσματι — «вот, Я наполню… опьянением» (μεθύσμα — опьянение; слав. «пиянством»). τοὺς καθημένους υἱοὺς Δαυιδ ἐπὶ θρόνου αὐτοῦ — «сидящих, сынов Давида, на престоле его»: конструкция сохранена (ダビデの位に座るその王たち)."
  14: "διασκορπιῶ αὐτοὺς ἄνδρα καὶ τὸν ἀδελφὸν αὐτοῦ — «рассею их, мужа и брата его» (διασκορπίζω; слав. «расточу»); ἐν τῷ αὐτῷ — «вместе» (слав. «вкупе»). οὐκ ἐπιποθήσω — «не пощажу» (ἐπιποθέω; слав. «не пожелаю»); οὐ φείσομαι καὶ οὐκ οἰκτιρήσω — «не пощажу и не помилую» (φείδομαι, οἰκτίρω); ἀπὸ διαφθορᾶς αὐτῶν — «от погибели их» (слав. «еже не погубити их»). ru «сокрушу их друг о друга» — по МТ, не внесено."
  15: "Ἀκούσατε καὶ ἐνωτίσασθε — «слушайте и внимайте» (ἐνωτίζομαι — внимать; слав. «внушите»); μὴ ἐπαίρεσθε — «не возноситесь» (ἐπαίρω; слав. «не возноситеся»); ὅτι κύριος ἐλάλησεν — «ибо Господь сказал». С 13:15 начинается пророческое обращение к Иерусалиму — без кавычек (см. шапку)."
  16: "δότε δόξαν — «воздайте славу» (слав. «дадите славу»); πρὸ τοῦ συσκοτάσαι — «прежде нежели смеркнется» (συσκοτάζω); πρὸς τοῦ προσκόψαι πόδας ὑμῶν ἐπ᾽ ὄρη σκοτεινά — «прежде нежели преткнутся ноги ваши о горы тёмные» (προσκόπτω — претыкаться); ἀναμενεῖτε εἰς φῶς — «будете ждать света» (ἀναμένω); σκιὰ θανάτου — «тень смерти»; τεθήσονται εἰς σκότος — «будут положены во тьму» (τίθημι): 3-е л. мн. ч. после 2-го л., смена лица сохранена (彼らは…置かれる). ru «Он обратит его в тень смерти» — по МТ."
  17: "κεκρυμμένως κλαύσεται ἡ ψυχὴ ὑμῶν ἀπὸ προσώπου ὕβρεως — «тайно восплачет душа ваша от лица гордости» (κεκρυμμένως — скрытно; слав. «в тайне восплачется душа ваша»): в LXX и слав. 2-е л. мн. ч., у ru (МТ) — 1-е л. («душа моя»), поэтому в тексте あなたがたの. κατὰξουσιν οἱ ὀφθαλμοὶ ὑμῶν δάκρυα — «изведут очи ваши слёзы» (κατάγω — сводить, низводить); συνετρίβη τὸ ποίμνιον κυρίου — «сокрушено стадо Господне» (συντρίβω). Слав. добавляет «и плачя восплачет» — внесено (泣きに泣く)."
  18: "εἴπατε τῷ βασιλεῖ καὶ τοῖς δυναστεύουσιν — «скажите царю и владыкам» (δυναστεύω — властвовать; слав. «рцыте царю и владыкам»). Ταπεινώθητε καὶ καθίσατε — «смиритесь и сядьте» (ταπεινόω; слав. «смиритеся, сядите»). καθῃρέθη ἀπὸ κεφαλῆς ὑμῶν στέφανος δόξης — «снят с головы вашей венец славы» (καθαιρέω — снимать; στέφανος — венец, 冠). Слова к царю — 「…」."
  19: "πόλεις αἱ πρὸς νότον συνεκλείσθησαν — «города южные заперты» (συγκλείω — запирать); οὐκ ἦν ὁ ἀνοίγων — «не было открывающего»; ἀπῳκίσθη Ιουδας — «Иуда отведён в переселение» (ἀποικίζω); συνετέλεσεν ἀποικίαν τελείαν — «совершил совершенное переселение» (συντελέω, ἀποικία; слав. «совершиша преселение совершенное»)."
  20: "Ἀνάλαβε ὀφθαλμούς σου — «подними глаза твои» (ἀναλαμβάνω; слав. «воздвигни очи твои»); τοὺς ἐρχομένους ἀπὸ βορρᾶ — «идущих от севера» (βορρᾶς — север); ποῦ ἐστιν τὸ ποίμνιον — «где стадо?»; πρόβατα δόξης σου — «овцы славы твоей» (слав. «овцы славы твоея»). В LXX обращение в ед. ч. (Ιερουσαλημ), у ru — во мн. ч.; держим LXX."
  21: "τί ἐρεῖς ὅταν ἐπισκέπτωνταί σε — «что скажешь, когда посетят тебя?» (ἐπισκέπτομαι); καὶ σὺ ἐδίδαξας αὐτοὺς ἐπὶ σὲ μαθήματα εἰς ἀρχήν — «и ты научил их против себя урокам, чтобы начальствовать» (μαθήματα — уроки; ἀρχή — начало, власть); οὐκ ὠδῖνες καθέξουσίν σε — «не схватят ли тебя боли?» (ὠδίν — родовая боль; κατέχω); καθὼς γυναῖκα τίκτουσαν — «как женщину рождающую» (τίκτω). В выгрузке слав. «еда не оымут тя» — опечатка вместо «имут»."
  22: "Διὰ τί ἀπήντησέν μοι ταῦτα — «зачем постигло меня это?» (ἀπαντάω — встречать, постигать): вопрос народа — 「…». ἀνεκαλύφθη τὰ ὀπίσθιά σου — «открыт зад твой», т. е. подол (ἀνακαλύπτω; слав. «откровена суть задняя твоя»); παραδειγματισθῆναι τὰς πτέρνας σου — «чтобы обнажены были пяты твои» (παραδειγματίζω — выставлять на позор; πτέρνα — пята)."
  23: "εἰ ἀλλάξεται Αἰθίοψ τὸ δέρμα αὐτοῦ — «переменит ли эфиоп кожу свою?» (ἀλλάσσω; δέρμα — кожа; слав. «ефиоплянин кожу свою»); πάρδαλις τὰ ποικίλματα αὐτῆς — «барс пятна свои» (πάρδαλις — барс, леопард, 豹; слав. читает «рысь» — иное слово, взято LXX; ποικίλμα — пятно, узор); καὶ ὑμεῖς δυνήσεσθε εὖ ποιῆσαι — «и вы сможете делать добро»; μεμαθηκότες τὰ κακά — «научившись злому» (μανθάνω, perfect)."
  24: "διέσπειρα αὐτοὺς ὡς φρύγανα φερόμενα ὑπὸ ἀνέμου — «рассеял их, как хворост, носимый ветром» (διασπείρω; φρύγανον — хворост, сучья; слав. «яко стеблие носимое ветром»). В LXX аорист, у слав. будущее («развею») — взято слав. чтение (散らす)."
  25: "οὗτος ὁ κλῆρός σου — «вот жребий твой» (κλῆρος; слав. «сей жребий твой»); μερὶς τοῦ ἀπειθεῖν ὑμᾶς ἐμοί — «часть непокорства вашего Мне» (ἀπειθέω): в греч. ед. и мн. число смешаны (σου… ὑμᾶς), в тексте あなたの…あなたがたが; ὡς ἐπελάθου μου — «ибо ты забыла Меня» (ἐπιλανθάνομαι); ἤλπισας ἐπὶ ψεύδεσιν — «надеялась на ложь» (ἐλπίζω)."
  26: "κἀγὼ ἀποκαλύψω τὰ ὀπίσω σου ἐπὶ τὸ πρόσωπόν σου — «и Я открою зад твой на лице твоём» (ἀποκαλύπτω; слав. «обнажу бедры твоя противу лица твоего»); ὀφθήσεται ἡ ἀτιμία σου — «явится бесчестие твоё» (ἀτιμία; слав. «срамота твоя»)."
  27: "μοιχεία — «прелюбодеяние» (姦淫); χρεμετισμός — «ржание» (χρεμετίζω — ржать; слав. «ржание»); ἀπαλλοτρίωσις τῆς πορνείας σου — «отчуждение блуда твоего» (ἀπαλλοτρίωσις — отчуждение); ἐπὶ τῶν βουνῶν καὶ ἐν τοῖς ἀγροῖς — «на холмах и в полях» (βουνός — холм); ἑώρακα — «Я увидел» (perfect); οὐαί σοι — «горе тебе»; οὐκ ἐκαθαρίσθης ὀπίσω μου — «не очистилась ты, [идя] за Мною» (καθαρίζω; слав. «не очистился еси, последуя мне»); ἕως τίνος ἔτι — «доколе ещё?»."
