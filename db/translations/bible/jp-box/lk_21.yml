verses:
  1: "イエスは目[め]を上[あ]げて、富[とみ]ある人[ひと]々[びと]が献金箱[けんきんばこ]に自分[じぶん]の捧[ささ]げ物[もの]を投[な]げ入[い]れるのをご覧[らん]になった。"
  2: "また、一人[ひとり]の貧[まず]しいやもめが、そこにレプタ銅貨[どうか]二枚[にまい]を投[な]げ入[い]れるのをご覧[らん]になった。"
  3: "そして、言[い]われた。「<j>はっきり言[い]っておく。この貧[まず]しいやもめは、だれよりも多[おお]く投[な]げ入[い]れた。</j>"
  4: "<j>あの人[ひと]々[びと]はみな、自分[じぶん]に余[あま]っているものから捧[ささ]げ物[もの]を投[な]げ入[い]れたが、この人[ひと]は乏[とぼ]しさの中[なか]から、自分[じぶん]が持[も]っていた生活[せいかつ]のすべてを投[な]げ入[い]れたのである。</j>」"
  5: "ある人[ひと]々[びと]が、神殿[しんでん]が美[うつく]しい石[いし]と奉納物[ほうのうぶつ]で飾[かざ]られていることを話[はな]していたとき、イエスは言[い]われた。"
  6: "「<j>あなたがたが見[み]ているこれらのものは、石[いし]が石[いし]の上[うえ]に残[のこ]らず、すべて崩[くず]される日[ひ]が来[く]る。</j>」"
  7: "彼[かれ]らはイエスに尋[たず]ねた。「先生[せんせい]、それでは、これらのことはいつ起[お]こるのですか。これらのことが起[お]ころうとするとき、どんなしるしがあるのでしょうか。」"
  8: "イエスは言[い]われた。「<j>惑[まど]わされないように気[き]をつけなさい。多[おお]くの者[もの]がわたしの名[な]を名乗[なの]って来[き]て、『このわたしがそうだ』と言[い]い、また『時[とき]は近[ちか]づいた』と言[い]う。彼[かれ]らの後[あと]を追[お]って行[い]ってはならない。</j>"
  9: "<j>戦争[せんそう]や暴動[ぼうどう]の知[し]らせを聞[き]いても、恐[おそ]れてはならない。これらのことはまず起[お]こらなければならないが、終[お]わりはすぐには来[こ]ない。</j>」"
  10: "また、彼[かれ]らに言[い]われた。「<j>民[たみ]は民[たみ]に、国[くに]は国[くに]に敵対[てきたい]して立[た]ち上[あ]がる。</j>"
  11: "<j>大[おお]きな地震[じしん]が起[お]こり、あちこちに飢[き]きんと疫病[えきびょう]が起[お]こる。また、恐[おそ]ろしい現象[げんしょう]と、天[てん]からの大[おお]きなしるしが現[あらわ]れる。</j>"
  12: "<j>しかし、これらのことのすべてに先[さき]だって、人[ひと]々[びと]はあなたがたに手[て]をかけ、迫害[はくがい]して、会堂[かいどう]や牢[ろう]に引[ひ]き渡[わた]し、わたしの名[な]のためにあなたがたを王[おう]たちや総督[そうとく]たちの前[まえ]に引[ひ]き立[た]てる。</j>"
  13: "<j>それは、あなたがたにとって証[あかし]となる。</j>"
  14: "<j>だから、どう弁明[べんめい]するかを前[あらかじ]め心[こころ]に思[おも]い定[さだ]めておいてはならない。</j>"
  15: "<j>わたしがあなたがたに口[くち]と知恵[ちえ]を与[あた]えるからである。それに対[たい]しては、あなたがたに敵対[てきたい]する者[もの]たちも、だれ一人[ひとり]として逆[さか]らうことも、反論[はんろん]することもできない。</j>"
  16: "<j>あなたがたは、両親[りょうしん]、兄弟[きょうだい]、親戚[しんせき]、友人[ゆうじん]からさえ引[ひ]き渡[わた]され、あなたがたのうちの何人[なんにん]かは殺[ころ]される。</j>"
  17: "<j>あなたがたはわたしの名[な]のゆえに、すべての人[ひと]から憎[にく]まれる。</j>"
  18: "<j>しかし、あなたがたの頭[あたま]から髪[かみ]の毛[け]一本[いっぽん]さえ失[うしな]われることはない。</j>"
  19: "<j>あなたがたは耐[た]え忍[しの]ぶことによって、自分[じぶん]の命[いのち]を手[て]に入[い]れなさい。</j>」"
  20: "「<j>しかし、エルサレムが軍[ぐん]に囲[かこ]まれるのを見[み]たら、その荒廃[こうはい]が近[ちか]づいたことを知[し]りなさい。</j>"
  21: "<j>そのとき、ユダヤにいる者[もの]たちは山[やま]へ逃[に]げなさい。都[みやこ]の中[なか]にいる者[もの]たちはそこから出[で]て行[い]き、周辺[しゅうへん]にいる者[もの]たちは都[みやこ]の中[なか]へ入[はい]ってはならない。</j>"
  22: "<j>これらの日[ひ]は報復[ほうふく]の日[ひ]であり、書[か]かれていることがすべて成就[じょうじゅ]するからである。</j>"
  23: "<j>その日[ひ]には、身[み]ごもった女[おんな]たちと乳[ち]を飲[の]ませている女[おんな]たちは災[わざわ]いである。大[おお]きな苦[くる]しみがこの地[ち]に臨[のぞ]み、怒[いか]りがこの民[たみ]に下[くだ]るからである。</j>"
  24: "<j>彼[かれ]らは剣[つるぎ]の刃[は]にかかって倒[たお]れ、すべての異邦人[いほうじん]の間[あいだ]に捕虜[ほりょ]として連[つ]れて行[い]かれる。エルサレムは異邦人[いほうじん]に踏[ふ]みにじられ、異邦人[いほうじん]の時[とき]が満[み]ちるまで、そうであり続[つづ]ける。</j>"
  25: "<j>また、太陽[たいよう]と月[つき]と星[ほし]にしるしが現[あらわ]れ、地[ち]の上[うえ]では異邦人[いほうじん]が、海[うみ]の轟[とどろ]きと波[なみ]の荒[あ]れに、なすすべもなく悩[なや]む。</j>"
  26: "<j>人[ひと]々[びと]は、世界[せかい]に降[ふ]りかかろうとする事[こと]への恐[おそ]れと予感[よかん]に、息[いき]が絶[た]えるほどになる。天[てん]の諸[しょ]力[りき]が揺[ゆ]らぐからである。</j>"
  27: "<j>そのとき、人[ひと]の子[こ]が、力[ちから]と大[おお]きな栄光[えいこう]とを伴[ともな]って、雲[くも]に乗[の]って来[く]るのを見[み]るであろう。</j>"
  28: "<j>これらのことが起[お]こり始[はじ]めたら、身[み]を起[おこ]し、頭[あたま]を上[あ]げなさい。あなたがたの贖[あがない]が近[ちか]づいているからである。</j>」"
  29: "イエスは彼[かれ]らにたとえを語[かた]られた。「<j>いちじくの木[き]や、すべての木[き]を見[み]なさい。</j>"
  30: "<j>すでに芽[め]を出[だ]しているのを見[み]れば、夏[なつ]が近[ちか]いことは、あなたがた自身[じしん]で分[わ]かる。</j>"
  31: "<j>同[おな]じようにあなたがたも、これらのことが起[お]こるのを見[み]たら、神[かみ]の国[くに]が近[ちか]いことを知[し]りなさい。</j>"
  32: "<j>はっきり言[い]っておく。これらのことがすべて起[お]こるまで、この時代[じだい]は決[けっ]して過[す]ぎ去[さ]らない。</j>"
  33: "<j>天[てん]と地[ち]は過[す]ぎ去[さ]るが、わたしの言葉[ことば]は決[けっ]して過[す]ぎ去[さ]らない。</j>"
  34: "<j>あなたがたは自分[じぶん]自身[じしん]に気[き]をつけなさい。暴飲暴食[ぼういんぼうしょく]と酒[さけ]の酔[よ]い、生活[せいかつ]の心配[しんぱい]によって心[こころ]が重[おも]くなり、その日[ひ]が突然[とつぜん]、あなたがたに襲[おそ]いかかることのないように。</j>"
  35: "<j>その日[ひ]は、地[ち]の全面[ぜんめん]に住[す]むすべての者[もの]に、罠[わな]のように襲[おそ]いかかるからである。</j>"
  36: "<j>だから、いつも目[め]を覚[さ]まして祈[いの]りなさい。これらの起[お]こらんとしていることをすべて免[まぬが]れ、人[ひと]の子[こ]の前[まえ]に立[た]つことができるようになるために。</j>」"
  37: "イエスは昼[ひる]には神殿[しんでん]で教[おし]え、夜[よる]には外[そと]へ出[で]て、オリーブ山[やま]と呼[よ]ばれる山[やま]に宿[やど]っておられた。"
  38: "民[たみ]は皆[みな]、イエスの話[はなし]を聞[き]こうと、朝早[あさはや]くから神殿[しんでん]へ来[き]ていた。"

notes:
  1: "ἀναβλέψας — «возведя взор»; γαζοφυλάκιον — сокровищница при храме, 献金箱, как в Мк 12:41. δῶρα — 捧げ物."
  2: "λεπτὰ δύο — две лепты. Сноска не повторяется: слово レプタ объяснено в Мк 12:42 (первое упоминание в корпусе)."
  3: "Ἀληθῶς λέγω ὑμῖν — «истинно говорю вам»; формула передана はっきり言っておく, как в Марке."
  4: "ἐκ τοῦ περισσεύοντος αὐτοῖς — «от избытка у них»; ἐκ τοῦ ὑστερήματος — «от недостатка». εἰς τὰ δῶρα — «в дары [Богу]», 捧げ物. У Марка 12:44 прибавлено «всё, что имела»; у Луки βίος — «средства к жизни», 生活."
  5: "ἀναθήματα — «посвящённые дары, украшения храма»; 奉納物."
  6: "οὐκ ἀφεθήσεται λίθος ἐπὶ λίθῳ — «не останется камня на камне»."
  7: "σημεῖον — しるし (не 徴: слово должно быть понятно без сноски)."
  8: "Ἐγώ εἰμι — здесь не богоявление, а самозванство лжеучителей: このわたしがそうだ. Ὁ καιρὸς ἤγγικεν — 時は近づいた."
  9: "ἀκαταστασίαι — «смуты, мятежи»; 暴動. οὐκ εὐθέως τὸ τέλος — «не тотчас конец»."
  11: "φόβητρα — «ужасы, страшные знамения»; 恐ろしい現象. σημεῖα μεγάλα ἀπ᾽ οὐρανοῦ — 天からの大きなしるし."
  12: "ἀπαγομένους ἐπὶ βασιλεῖς καὶ ἡγεμόνας — «ведомых к царям и правителям»; ἡγεμών — 総督 (как в 20:20). ἕνεκεν τοῦ ὀνόματός μου — «ради имени Моего»."
  13: "ἀποβήσεται ὑμῖν εἰς μαρτύριον — «послужит вам для свидетельства»; 証."
  14: "μὴ προμελετᾶν ἀπολογηθῆναι — «не обдумывать заранее, что отвечать»; 弁明."
  15: "στόμα καὶ σοφία — «уста и премудрость»; 口と知恵. ἀντιστῆναι ἢ ἀντειπεῖν — «противостать или возразить»; оба глагола сохранены."
  16: "Порядок γονεῖς — ἀδελφοί — συγγενεῖς — φίλοι сохранён: 両親、兄弟、親戚、友人."
  18: "θρὶξ ἐκ τῆς κεφαλῆς — «волос с головы»; οὐ μὴ ἀπόληται — усиленное отрицание."
  19: "κτήσασθε — «приобретайте» (в критической базе κτήσεσθε, «приобретёте»); чтение Церкви совпадает с византийским, 〔〕 не ставил. ψυχή здесь — «жизнь», поэтому 命, а не 魂."
  20: "στρατόπεδα — «войска, станы»; 軍. ἐρήμωσις — 荒廃."
  21: "οἱ ἐν μέσῳ αὐτῆς — «кто в середине её»; οἱ ἐν ταῖς χώραις — «кто в окрестностях»; 周辺."
  22: "ἡμέραι ἐκδικήσεως — «дни отмщения»; 報復の日. τοῦ πλησθῆναι πάντα τὰ γεγραμμένα — «чтобы исполнилось всё написанное»."
  23: "ἀνάγκη μεγάλη — «великая нужда, беда»; передано 大きな苦しみ, чтобы не повторять 災い дважды."
  24: "στόματι μαχαίρης — буквально «устьем меча», то есть остриём; 剣の刃. καιροὶ ἐθνῶν — «времена язычников»; 異邦人の時."
  25: "συνοχὴ ἐθνῶν ἐν ἀπορίᾳ — «смятение народов в недоумении»; ἦχος θαλάσσης καὶ σάλος — «шум моря и волнение». Солнце, луна, звёзды — порядок сохранён."
  26: "ἀποψυχόντων ἀνθρώπων — «испускающих дух», то есть умирающих от страха; 息が絶えるほど. αἱ δυνάμεις τῶν οὐρανῶν — 天の諸力."
  27: "Дан 7:13. ἐν νεφέλῃ — единственное число: 雲に乗って. μετὰ δυνάμεως καὶ δόξης πολλῆς — «с силою и славою великою»."
  28: "ἀνακύψατε — «поднимите головы»; 身を起こし、頭を上げなさい. ἀπολύτρωσις — 贖い."
  31: "ἐγγύς ἐστιν ἡ βασιλεία τοῦ θεοῦ — 神の国が近い."
  32: "γενεά — «род»; 時代, как в Мф 24:34 и Мк 13:30."
  34: "κραιπάλη — «объядение с пьянством, похмелье»; передано 暴飲暴食 (Синод.: «объядением и пьянством»). μερίμναι βιωτικαί — 生活の心配. βαρηθῶσιν — «отягчатся»; 心が重くなる."
  35: "παγίς — «сеть, петля»; 罠. ἐπὶ πάντας τοὺς καθημένους ἐπὶ πρόσωπον πάσης τῆς γῆς — «на всех живущих по всему лицу земли»."
  36: "ἀγρυπνεῖτε — «бодрствуйте»; κατισχύσητε ἐκφυγεῖν — «укрепиться, чтобы избежать»; σταθῆναι ἔμπροσθεν τοῦ υἱοῦ τοῦ ἀνθρώπου — «стать перед Сыном Человеческим»."
  37: "ηὐλίζετο — «проводил ночь под открытым небом»; 宿る. τὸ ὄρος τὸ καλούμενον Ἐλαιῶν — オリーブ山と呼ばれる山. Написание オリーブ山 принято в корпусе (Мф 21:1; 24:3; 26:30; Мк 11:1; 14:26), в задании — オリーブ山; расхождение вынесено на ревью."
  38: "ὤρθριζεν — «приходил ранним утром»; 朝早くから."
