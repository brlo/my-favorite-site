# jp-box, 3-я Царств, глава 6. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); церковнославянский (csl-ru) — второй
# свидетель церковного текста (новый паритет, docs/japanese-bible.md):
# слав. чтения и добавки входят в основной текст без 〔…〕, вариант LXX — в notes.
# ru (Синодальный) — только для понимания, не источник. jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 6: постройка храма (1–36), основание и завершение (37–38).
# Нумерация — славяно-синодальная (по csl-ru): 38 стихов. Порядок и деление по csl,
# прежние греческие стихи переставлены:
#   csl 6:1 = гр 6:1 + суб-стих 1a (камни для основания; двойное чтение LXX,
#     тот же материал стоит в 5:17); csl 6:2 = размеры (гр 6:4b);
#   csl 6:3 = притвор (гр 6:4c); csl 6:4 = окна (гр 6:4d);
#   csl 6:5–36 = гр 6:5–36; csl 6:37 = гр 6:3 (основание в четвёртый год);
#   csl 6:38 = гр 6:4a (завершение в одиннадцатый год).
# Прежний гр 6:2 (обтёсывали сыны Соломона и сыны Хирама) перенесён в 5:18,
# где эта половина стоит в славянском тексте (csl 5:18).
# Размеры храма: в gr 40×20×25 (LXX), в csl 60×20×30 (МТ) — взят LXX, csl в notes.
# 〔…〕 нет: всё взятое у csl отмечено в notes.
# Сносок ⟨…⟩ нет: 神殿, 契約の箱, 祭壇, 燔祭, ケルビム уже пояснены в корпусе.
tr_code: jp-box
book: 3ts
chapter: 6
draft: true

verses:
  1: "イスラエルの子[こ]らがエジプトの地[ち]を出[で]てから四百四十年目、ソロモンがイスラエルを治[おさ]めて四年目、第二の月[つき]に、王[おう]は命[めい]じて、神殿[しんでん]の礎[いしずえ]のための大[おお]きな貴重[きちょう]な石[いし]、切[き]り出[だ]した石を運[はこ]ばせた。こうして主[しゅ]のために神殿を建[た]て始[はじ]めた。"
  2: "ソロモン王[おう]が主[しゅ]のために建[た]てた神殿は、長[なが]さ四十[よんじゅう]キュビト、幅[はば]二十[にじゅう]キュビト、高[たか]さ二十五[にじゅうご]キュビトであった。"
  3: "神殿の前[まえ]の廊[ろう]は、神殿の幅に合[あ]わせて長さ二十キュビト、神殿の前に幅十[じゅう]キュビトであった。"
  4: "彼[かれ]は神殿を建てて完成させ、神殿に隠[かく]れた格子窓[こうしまど]を造[つく]った。"
  5: "彼[かれ]は神殿[しんでん]の壁[かべ]に沿[そ]って、神殿と至聖所[しせいしょ]の周[まわ]りに側房[そくぼう]を造[つく]り、周りに脇間[わきま]を設[もう]けた。"
  6: "下[した]の側房[そくぼう]は幅[はば]五[ご]キュビト、中[なか]の側房は六[ろく]キュビト、第三[だいさん]の側房は七[なな]キュビトであった。神殿[しんでん]の外[そと]の周[まわ]りに段[だん]を付[つ]けたので、側房が神殿の壁[かべ]に触[ふ]れることはなかった。"
  7: "神殿[しんでん]は、切[き]り出[だ]されたままの石[いし]で建[た]てられた。神殿を建てる間[あいだ]、槌[つち]も斧[おの]も、鉄[てつ]の道具[どうぐ]も、神殿のうちでは聞[き]こえなかった。"
  8: "下[した]の側房[そくぼう]の戸口[とぐち]は神殿[しんでん]の右[みぎ]の肩[かた]の下にあり、らせん状[じょう]の階段[かいだん]で中[なか]へ、中から三階[さんがい]へ上[のぼ]った。"
  9: "彼[かれ]は神殿[しんでん]を建[た]てて完成[かんせい]させ、神殿を杉[すぎ]の板[いた]で天井[てんじょう]張[ば]りにした。"
  10: "彼[かれ]は神殿[しんでん]全体[ぜんたい]に側房[そくぼう]を造[つく]り、その高[たか]さは五[ご]キュビトで、杉[すぎ]の木[き]で結[むす]び合[あ]わされていた。"
  11: "主[しゅ]の言葉[ことば]がソロモンに臨[のぞ]んで言[い]った。"
  12: "「あなたが建[た]てているこの神殿[しんでん]、この家[いえ]について、もしあなたがわたしの掟[おきて]の道[みち]を歩[あゆ]み、わたしの定[さだ]めを実行[じっこう]し、わたしの戒[いまし]めをすべて守[まも]って、そこにとどまるなら、わたしはダビデ、あなたの父[ちち]に告[つ]げたわたしの言葉[ことば]を、あなたの上[うえ]に成[な]し遂[と]げる。"
  13: "わたしはイスラエルの子[こ]らの間[あいだ]に住[す]み、わたしの民[たみ]イスラエルを捨[す]て去[さ]らない。」"
  14: "ソロモンは神殿[しんでん]を建[た]てて完成[かんせい]させた。"
  15: "彼[かれ]は神殿[しんでん]の壁[かべ]を内側[うちがわ]から杉[すぎ]の木[き]で覆[おお]い、床[ゆか]から梁[はり]、壁の上[うえ]まで及[およ]んだ。内側を木で張[は]り、神殿の内部[ないぶ]を糸杉[いとすぎ]の板[いた]で囲[かこ]んだ。"
  16: "彼[かれ]は神殿[しんでん]の奥[おく]から二十[にじゅう]キュビトのところに、床[ゆか]から梁[はり]まで側壁[そくへき]を造[つく]り、神殿の内側[うちがわ]の至聖所[しせいしょ]とした。"
  17: "神殿[しんでん]、すなわち前[まえ]の部分[ぶぶん]は四十[よんじゅう]キュビトであった。"
  18: "神殿[しんでん]の内部[ないぶ]の杉[すぎ]には、ひょうたんの実[み]のような飾[かざ]りと咲[さ]き広[ひろ]がる花[はな]が刻[きざ]まれ、すべてが杉で覆[おお]われて、石[いし]は見[み]えなかった。"
  19: "神殿[しんでん]の内側[うちがわ]の中央[ちゅうおう]の至聖所[しせいしょ]は、そこに主[しゅ]の契約[けいやく]の箱[はこ]を置[お]くためであった。"
  20: "至聖所[しせいしょ]は長[なが]さ二十[にじゅう]キュビト、幅[はば]二十キュビト、高[たか]さ二十キュビトで、彼[かれ]はそれを純金[じゅんきん]で覆[おお]い、杉[すぎ]の祭壇[さいだん]を造[つく]った。"
  21: "至聖所[しせいしょ]の前[まえ]のものも、彼[かれ]は金[きん]で覆[おお]った。"
  22: "彼[かれ]は神殿[しんでん]全体[ぜんたい]を、すべてが終[お]わるまで金[きん]で覆[おお]った。"
  23: "彼[かれ]は至聖所[しせいしょ]に、糸杉[いとすぎ]の木[き]で、十[じゅう]キュビトの大[おお]きさのケルビム二[ふた]つを造[つく]った。"
  24: "一[ひと]つのケルビムの翼[つばさ]は五[ご]キュビト、もう一つの翼も五キュビトで、一方[いっぽう]の翼の端[はし]から他方[たほう]の翼の端まで十[じゅう]キュビトあった。"
  25: "第二のケルビムも同[おな]じであった。一[ひと]つの寸法[すんぽう]で、二[ふた]つとも一つの仕上[しあ]がりであった。"
  26: "一[ひと]つのケルビムの高[たか]さは十[じゅう]キュビトで、第二のケルビムも同[おな]じであった。"
  27: "彼[かれ]は二[ふた]つのケルビムを神殿[しんでん]の内[うち]の中央[ちゅうおう]に置[お]いた。その翼[つばさ]は広[ひろ]げられ、一[ひと]つの翼は一方[いっぽう]の壁[かべ]に触[ふ]れ、もう一つの翼は第二の壁に触れ、神殿の中央にある彼らの翼は互[たが]いに触れ合[あ]っていた。"
  28: "彼[かれ]はケルビムを金[きん]で覆[おお]った。"
  29: "彼[かれ]は神殿[しんでん]のすべての壁[かべ]の周[まわ]りに、内[うち]にも外[そと]にも、ケルビムと棕櫚[しゅろ]と咲[さ]き広[ひろ]がる花[はな]を、彫[ほ]り物[もの]として刻[きざ]んだ。"
  30: "神殿[しんでん]の床[ゆか]は、内[うち]も外[そと]も金[きん]で覆[おお]った。"
  31: "至聖所[しせいしょ]の入口[いりぐち]には、彼[かれ]はビャクシンの木[き]の扉[とびら]と、五重[ごじゅう]の扉枠[とびらわく]を造[つく]った。"
  32: "また、糸杉[いとすぎ]の木[き]の二[ふた]つの扉[とびら]を造[つく]り、その上[うえ]にケルビムと棕櫚[しゅろ]と咲[さ]き広[ひろ]がる花[はな]を刻[きざ]み、金[きん]で覆[おお]った。金はケルビムと棕櫚の上にまで及[およ]んだ。"
  33: "同[おな]じように、神殿[しんでん]の入口[いりぐち]には、ビャクシンの木[き]の扉枠[とびらわく]と、四重[よんじゅう]の柱廊[ちゅうろう]を造[つく]った。"
  34: "糸杉[いとすぎ]の木[き]の扉[とびら]は二[ふた]つあり、一[ひと]つの扉は二つの折[お]り戸[と]とその蝶番[ちょうつがい]、第二の扉も二つの折り戸で、回[まわ]るようになっていた。"
  35: "彼[かれ]はその上[うえ]にケルビムと棕櫚[しゅろ]と咲[さ]き広[ひろ]がる花[はな]を刻[きざ]み、彫[ほ]り物[もの]の上に金[きん]をかぶせた。"
  36: "彼[かれ]は内[うち]の庭[にわ]を、切[き]り出[だ]した石[いし]の三[みっ]つの列[れつ]と、杉[すぎ]の木[き]の一[ひと]つの列で、周[まわ]りに造[つく]った。また、神殿[しんでん]の前[まえ]の廊[ろう]の庭の垂[た]れ幕[まく]を造った。"
  37: "四年目、ニソンの月[つき]、すなわち第二の月に、彼[かれ]は主[しゅ]の神殿[しんでん]の礎[いしずえ]を据[す]えた。"
  38: "第十一[だいじゅういち]の年[とし]、バアルの月[つき]、すなわち第八の月に、神殿[しんでん]はそのすべての言葉[ことば]に従[したが]い、そのすべての配置[はいち]に従って完成[かんせい]した。"

notes:
  1: "τεσσαρακοστῷ καὶ τετρακοσιοστῷ ἔτει — в 440-й год (LXX; в ru/МТ — 480-й); слав. «в четыредесятное и в четвертосотное лето». τῷ ἔτει τῷ τετάρτῳ ... ἐν μηνὶ τῷ δευτέρῳ — в четвёртый год царствования, во второй месяц. Клауза «и созда храм Господеви» есть в csl 6:1, в gr модуля её нет — внесена (神殿を建て始めた). Приказ о камнях (gr 6:1a) — двойное чтение LXX; тот же материал стоит в csl 5:17, здесь сохранён как в гр. модуле (ср. 5:17)."
  2: "Слав. 6:2: «И храм, егоже созда соломон… шестьдесят лакот долгота его, и двадесяти лакот широта его, и тридесяти лакот высота его». В gr (6:4b) размеры 40×20×25 (LXX); взят LXX, csl-числа отмечены. θυρίδες — окна (см. ст. 4)."
  3: "Слав. 6:3: «и притвор, иже пред лицем храма, двадесяти лакот долгота его в широту дому, и десяти лакот широта его пред лицем дому». В gr эта часть стоит внутри 6:4 (помечена «3»); слав. выносит отдельным стихом 6:3. αιλαμ — притвор (前廊)."
  4: "Слав. 6:4: «И сотвори храму окна преклонены сокровены». В gr — конец 6:4 (помечен «4»). θυρίδες παρακυπτόμεναι κρυπταί — окна с откосами, скрытые (παρακύπτω — «выглядывать»; κρυπτός — «скрытый»)."
  5: "μέλαθρα — покои, навесы; πλευραί — боковые комнаты, рёбра (слав. «притворы», «бока»); δαβιρ — давир, внутреннее святилище (至聖所; слав. «давир»)."
  6: "πλευρά — ярус пристройки; ὑποκάτω / μέσον / τρίτη — нижний, средний, третий: 5, 6, 7 локтей; διάστημα — уступ, промежуток (слав. «разстояние»); ὅπως μὴ ἐπιλαμβάνωνται — чтобы не касались стен."
  7: "λίθοις ἀκροτόμοις ἀργοῖς — камнями, обтёсанными вчерне, необработанными (слав. «камением краесекомым нетесаным»); σφῦρα — молот; πέλεκυς — топор; σκεῦος σιδηροῦν — железный инструмент."
  8: "πυλών — вход (слав. «двери»); ὠμία — плечо, сторона; ἑλικτὴ ἀνάβασις — винтовая лестница (слав. «извиенный восход»); τριώροφα — третий ярус (слав. «трекровныя»)."
  9: "ἐκοιλοστάθμησεν — сделал кессонный потолок, обшил досками (κοιλοστάθμιον; слав. «обстави дсками»); κέδροις — кедром (杉)."
  10: "ἐνδέσμους — связи, срубы (слав. «вязания»); πέντε ἐν πήχει τὸ ὕψος — высотой в пять локтей; συνέσχεν ... ἐν ξύλοις κεδρίνοις — скрепил кедровым деревом."
  11: "В gr-lxx-byz (и в gr-ru) на месте стиха стоит «.» — текст в модуле утрачен; стих по csl 6:11: было слово Господне к Соломону. Далее речь Бога (12–13) — 「…」."
  12: "Стих по csl 6:12 (в gr «.»). ὁ οἶκος οὗτος ὃν σὺ οἰκοδομεῖς — «этот дом, который ты строишь»; ἐὰν πορευθῇς ... καὶ ποιήσῃς ... καὶ φυλάξῃς — если пойдёшь, сделаешь, сохранишь; «еже пребывати в них» — чтобы пребывать в них, в заповедях; στήσω τὸν λόγον μου — утвержу слово Моё."
  13: "Стих по csl 6:13 (в gr «.»): вселюсь посреди сынов Израилевых и не оставлю народа Моего Израиля. Здесь речь Бога закрывается."
  14: "Стих по csl 6:14 (в gr «.»): Соломон построил храм и окончил его. Повтор завершения (ср. 6:4 и 6:9) оставлен, как в церковном тексте."
  15: "τοὺς τοίχους ... διὰ ξύλων κεδρίνων — стены кедровыми деревьями; ἀπὸ τοῦ ἐδάφους ... ἕως τῶν δοκῶν — от пола до балок; ἐκοιλοστάθμησεν συνεχόμενα ξύλοις — обшил сплошным деревом; πλευραῖς πευκίναις — досками певговыми (糸杉)."
  16: "τοὺς εἴκοσι πήχεις ἀπ᾿ ἄκρου τοῦ οἴκου — двадцать локтей от края дома; τὸ πλευρὸν τὸ ἕν — сторона одна; ἐκ τοῦ δαβιρ εἰς τὸ ἅγιον τῶν ἁγίων — «из давира во святое святых» (слав. «от давира стену до святая святых»), т. е. давир и есть святое святых."
  17: "τεσσαράκοντα πηχῶν ἦν ὁ ναός — сорок локтей был храм (ναός — святилище); κατὰ πρόσωπον — «пред лицом», передняя часть. В csl прибавлено «сей есть храм внутреннейший», в gr этого нет."
  18: "В gr на месте стиха «.» — по csl 6:18: внутри, на кедре, вырезаны плетение, доски и резьба (слав. «плетение и дщицы и ваяния»); в ru — «подобия огурцов и распускающихся цветов»; камня не видно."
  19: "τοῦ δαβιρ ἐν μέσῳ τοῦ οἴκου ἔσωθεν — давир внутри, посреди дома; δοῦναι ἐκεῖ τὴν κιβωτὸν διαθήκης κυρίου — чтобы положить там ковчег завета Господня (契約の箱)."
  20: "εἴκοσι πήχεις μῆκος ... πλάτος ... ὕψος — 20×20×20; χρυσίῳ συγκεκλεισμένῳ — закрытым, сплошным золотом (слав. «златом чистым»); θυσιαστήριον — жертвенник, «кедровый» — по csl (в gr слово обрывается: ἐποίησεν θυσιαστήριον)."
  21: "κατὰ πρόσωπον τοῦ δαβιρ — перед давиром; περιέσχεν αὐτὸ χρυσίῳ — обложил его золотом. В csl 6:21 стоит другая клауза («весь храм объят златом до скончания»), она в gr 6:22."
  22: "ὅλον τὸν οἶκον ... ἕως συντελείας παντὸς τοῦ οἴκου — весь дом до завершения всего дома (слав. «весь храм… до скончания всего храма» — в csl это 6:21)."
  23: "δύο χερουβιν δέκα πήχεων μέγεθος ἐσταθμωμένον — два херувима, размер отмеренный, десять локтей (ケルビム). В csl прибавлено «от древ кипарисных» (糸杉), в gr этого нет — внесено по csl."
  24: "πτερύγιον — крыло; πέντε πήχεων ... τὸ δεύτερον — пять локтей второе крыло; ἀπὸ μέρους ... εἰς μέρος — от края до края, десять локтей."
  25: "ἐν μέτρῳ ἑνὶ συντέλεια μία ἀμφοτέροις — «при одной мере одно завершение обоим», т. е. одинаковы по мере и виду."
  26: "τὸ ὕψος τοῦ χερουβ ... δέκα ἐν πήχει — высота херувима десять локтей; καὶ οὕτως τὸ δεύτερον — так и второй."
  27: "τὰ χερουβιν ἐν μέσῳ τοῦ οἴκου τοῦ ἐσωτάτου — оба херувима посреди внутреннего дома; διεπέτασεν — распростёр (διαπετάννυμι); ἥπτετο — касался; πτέρυξ πτέρυγος — крыло к крылу."
  28: "περιέσχεν τὰ χερουβιν χρυσίῳ — обложил херувимов золотом."
  29: "ἐγκολαπτὰ ἔγραψεν γραφίδι — вырезал резцом (γραφίς — резец); φοίνικες — пальмы (棕櫚); τῷ ἐσωτέρῳ καὶ τῷ ἐξωτέρῳ — во внутреннем и внешнем."
  30: "τὸ ἔδαφος τοῦ οἴκου — пол дома; τοῦ ἐσωτάτου καὶ τοῦ ἐξωτάτου — внутреннего и внешнего."
  31: "τῷ θυρώματι τοῦ δαβιρ — входу в давир; θύρας ξύλων ἀρκευθίνων — двери из можжевелового дерева (ビャクシン; слав. «смерчие»); φλιὰς πενταπλᾶς — косяки пятеричные, пятичастные."
  32: "δύο θύρας ξύλων πευκίνων — две двери из певгового дерева (糸杉); ἐγκολαπτὰ ... χερουβιν καὶ φοίνικας καὶ πέταλα διαπεπετασμένα — резные херувимы, пальмы и раскрытые листья-цветы; κατέβαινεν ... τὸ χρυσίον — золото сходило, покрывало херувимов и пальмы."
  33: "τῷ πυλῶνι τοῦ ναοῦ — входу в храм; φλιαὶ ξύλων ἀρκευθίνων — косяки из можжевельника; στοαὶ τετραπλῶς — притворы четвероякие, четырёхчастные (слав. «притворы четверогубо»)."
  34: "ἐν ἀμφοτέραις ταῖς θύραις ξύλα πεύκινα — на обеих дверях певговое дерево; δύο πτυχαὶ — две створки (πτυχή; слав. «затворы»); στροφεῖς — петли, крюки (слав. «вереи»); στρεφόμενα — вращающиеся."
  35: "ἐγκεκολαμμένα — вырезанные; διαπεπετασμένα πέταλα — раскрытые листья-цветы; περιεχόμενα χρυσίῳ καταγομένῳ ἐπὶ τὴν ἐκτύπωσιν — покрытые золотом, сходящим на рельеф (ἐκτύπωσις — изображение)."
  36: "τὴν αὐλὴν τὴν ἐσωτάτην — внутренний двор; τρεῖς στίχους ἀπελεκήτων — три ряда тёсаных камней; στίχος κατειργασμένης κέδρου — ряд обработанного кедра (杉). Суб-стих «36a» (помечен в модуле) — завеса двора притвора дома перед храмом (καταπέτασμα); в csl его нет, отдельного стиха в gr нет."
  37: "ἐν τῷ ἔτει τῷ τετάρτῳ ἐθεμελίωσεν — в четвёртый год положил основание; μηνὶ Νισω — в месяц Нисон (слав. «зии» — по МТ Зив); τῷ δευτέρῳ μηνί — второго месяца. В csl это стих 6:37 (конец главы)."
  38: "Слав. 6:38: «Во единонадесятое лето в месяце вул, сей месяц осмый, совершися храм по всему словеси своему и по всему устроению своему: и созда его в седмь лет». В gr — начало 6:4 (помечено «2»): ἐν ἑνδεκάτῳ ἐνιαυτῷ ἐν μηνὶ Βααλ [οὗτος ὁ μὴν ὁ ὄγδοος] συνετελέσθη ὁ οἶκος εἰς πάντα λόγον αὐτοῦ καὶ εἰς πᾶσαν διάταξιν αὐτοῦ."
