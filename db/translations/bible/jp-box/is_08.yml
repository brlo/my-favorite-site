# jp-box, Исаия, глава 8. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для Исаии есть фрагментами, но в этой
# главе он не привлекался; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 8: 1–4 свиток и имя сына (Магер-шелал-хаш-баз), знамение о Дамаске и Самарии;
# 5–8 воды Силоама и река Ассирийская, «с нами Бог»; 9–10 возглас к народам;
# 11–16 слово Господа о страхе и освящении, камень преткновения; 17–22 речь пророка:
# надежда, дети-знамения, вызыватели мёртвых, голод и тьма, «и не оскудеет в тесноте
# сый даже до времене» (конец 22); переход к свету — уже в 9:1.
# Голоса: 1–2, 3 (начало), 5, 7–8 (описание) авторское повествование;
# 1–2 и 3–4 слово Господа — 「…」, имя на свитке — 『…』; 6–8 слово Господа — 「…」;
# 9–10 пророческий возглас, без кавычек; 11–16 слово Господа — 「…」 (『ひどい』 —
# слова народа внутри); 17–22 речь пророка — 「…」 (слова людей в 8:19 — 『…』),
# закрыта в конце 22.
# Нумерация — славяно-синодальная (csl-ru), как и во всей книге: 22 стиха
# (в gr-lxx-byz — 23). Стих gr 8:23 у слав. разделён: первая половина («и не оскудеет
# в тесноте сый даже до времене» — καὶ οὐκ ἀπορηθήσεται ὁ ἐν στενοχωρίᾳ ὢν ἕως
# καιροῦ) относится к слав. 8:22 и у нас стоит в конце 8:22; вторая половина
# (Τοῦτο πρῶτον ποίει… — «Сие прежде испий, скоро твори…») — это слав. 9:1, у нас 9:1.
# Плюс слав. делит внутри стиха иначе: «и воззрят на небо горе» (конец gr 8:21, у нас
# в 8:21) у слав. открывает 8:22; держим деление gr (см. notes 21–22).
# 〔…〕 нет. Сносок ⟨…⟩ нет: シロアム, 口寄せ, 卷物, 筆 и пр. понятны или в notes.
# Имена — транслитерация греческого (LXX): ウリヤ, ザカリヤ, イアスブ, タベエル.

