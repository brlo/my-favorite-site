verses:
  1: "主[しゅ]はわたしに言[い]われた。「大[おお]きな新[あたら]しい巻物[まきもの]を取[と]り、人[ひと]の筆[ふで]でその中に、『速[すみ]やかに獲物[えもの]を取[と]れ、直[ただ]ちに略奪[りゃくだつ]せよ』と書[か]け。そろそろ近[ちか]づいているからだ。"
  2: "わたしのために、信頼[しんらい]できる証人[しょうにん]を立[た]てよ。祭司[さいし]ウリヤと、バラキヤの子[こ]ザカリヤとを。」"
  3: "わたしは女預言者[おんなよげんしゃ]のところへ行[い]き、彼女[かのじょ]は身[み]ごもって男[おとこ]の子[こ]を産[う]んだ。主[しゅ]はわたしに言[い]われた。「その名[な]を『速[すみ]やかに奪[うば]え、急[いそ]いで略奪[りゃくだつ]せよ』と呼[よ]べ。"
  4: "この子[こ]が父[ちち]や母[はは]を呼[よ]べるようになる前[まえ]に、ダマスコの力[ちから]とサマリアの獲物[えもの]が、アッシリアの王[おう]の前[まえ]に運[はこ]び去[さ]れるからである。」"
  5: "主[しゅ]は再[ふたた]びわたしに語[かた]って言[い]われた。"
  6: "「この民[たみ]が、静[しず]かに流[なが]れるシロアムの水[みず]を望[のぞ]まず、レツィンとレマリヤの子[こ]を王[おう]として迎[むか]えようとしているからである。"
  7: "それゆえ、見[み]よ、主[しゅ]は彼[かれ]らの上[うえ]に、強[つよ]く大[おお]きな川[かわ]の水[みず]、すなわちアッシリアの王[おう]とその栄光[えいこう]を上[のぼ]らせる。それは彼[かれ]らの谷[たに]という谷[たに]にあふれ、すべての城壁[じょうへき]を越[こ]えて流[なが]れ、"
  8: "ユダから、頭[あたま]を上[あ]げうる者[もの]も、何[なに]かを成[な]し遂[と]げうる者[もの]も取[と]り去[さ]る。その陣営[じんえい]はあなたの地[ち]の幅[はば]を満[み]たす。神[かみ]がわたしたちと共[とも]におられる。」"
  9: "諸国[しょこく]の民[たみ]よ、知[し]って打[う]ち負[ま]かされよ。地[ち]の果[は]てまで聞[き]け。力[ちから]を強[つよ]める者[もの]よ、打[う]ち負[ま]かされよ。たとえ力[ちから]を強[つよ]めても、打[う]ち負[ま]かされる。"
  10: "どんな計画[けいかく]を立[た]てても、主[しゅ]がそれを打[う]ち砕[くだ]かれる。どんな言葉[ことば]を語[かた]っても、それは成[な]り立[た]たない。神[かみ]がわたしたちと共[とも]におられるからである。"
  11: "主[しゅ]はこう言[い]われる。「強[つよ]い手[て]をもって、この民[たみ]の行[ゆ]く道[みち]に従[したが]わない者[もの]たちに言[い]う。"
  12: "彼[かれ]らが『ひどい』と言[い]うことを、あなたがたは『ひどい』と言[い]ってはならない。この民[たみ]が言[い]うことは、すべてひどいことである。彼[かれ]らの恐[おそ]れるものを恐[おそ]れてはならない。おののいてはならない。"
  13: "万軍[ばんぐん]の主[しゅ]、その方[かた]を聖[せい]なる方[かた]としてあがめよ。その方こそ、あなたがたの恐[おそ]れであり、その方こそ、あなたがたのおののきである。"
  14: "もしあなたがたがその方に信頼[しんらい]するなら、その方はあなたがたの聖所[せいしょ]となる。あなたがたは、つまずきの石[いし]としてその方に会[あ]うことも、倒[たお]れの岩[いわ]として会うこともない。しかし、ヤコブの家[いえ]は罠[わな]にかかり、エルサレムに住[す]む者[もの]たちは落[お]とし穴[あな]に落ちる。"
  15: "多[おお]くの者[もの]が彼[かれ]らの中[なか]でつまずき、倒[たお]れて砕[くだ]かれ、罠[わな]にかかって捕[と]らえられる。安全[あんぜん]な所[ところ]にいる者[もの]たちも。"
  16: "そのとき、律法[りっぽう]を封[ふう]じて、学[まな]ぶことを妨[さまた]げる者[もの]たちが明[あき]らかになる。」"
  17: "「わたしは、ヤコブの家[いえ]から御顔[みかお]を隠[かく]された神[かみ]を待[ま]ち、この方[かた]に信頼[しんらい]しよう。"
  18: "見[み]よ、わたしと、神[かみ]がわたしに与[あた]えた子[こ]どもたちは、シオンの山[やま]に住[す]む万軍[ばんぐん]の主[しゅ]から、イスラエルの家[いえ]に与[あた]えられたしるしと不思議[ふしぎ]である。"
  19: "人[ひと]々[びと]があなたがたに『地[ち]の口寄[くちよ]せや、腹[はら]から声[こえ]を出[だ]す者[もの]たち、むなしいことをささやく者[もの]たちに尋[たず]ねよ』と言[い]うとき、民[たみ]は自分[じぶん]の神[かみ]に尋ねるべきではないか。生[い]ける者[もの]のために、死者[ししゃ]に尋ねるのか。"
  20: "律法[りっぽう]は助[たす]けのために与[あた]えられた。『この言葉[ことば]のとおりではない』と言[い]うためである。そのことについては、贈[おく]り物[もの]をささげることはできない。"
  21: "しかし、あなたがたの上[うえ]に激[はげ]しい飢[うえ]が来[く]る。飢[う]えるとき、あなたがたは悲[かな]しみ、自分[じぶん]の支配者[しはいしゃ]と祖国[そこく]を悪[わる]しく言[い]、上[うえ]の天[てん]を見上[みあ]げ、"
  22: "下[した]の地[ち]を見下[みお]ろす。見[み]よ、苦難[くなん]と狭[せま]りと暗[くら]やみ、行[ゆ]き詰[づ]まりと暗[くら]やみがあり、見[み]ることができないほどである。しかし、狭[せま]りの中[なか]にいる者[もの]は、時[とき]が来[く]るまで見捨[みす]てられない。」"

notes:
  1: "Λαβὲ σεαυτῷ τόμον καινοῦ μεγάλου — «возьми себе свиток новый большой» (τόμος — свиток; καινοῦ μεγάλου — родительный качества). γράψον εἰς αὐτὸν γραφίδι ἀνθρώπου — «напиши в нём писалом человеческим» (γραφίς — перо, резец; слав. «писалом человечим»). Τοῦ ὀξέως προνομὴν ποιῆσαι σκύλων· πάρεστιν γάρ — «чтобы скоро учинить разграбление добычи; ибо близко» (ὀξέως — быстро; προνομή — добыча; σκῦλα — добыча, трофеи; πάρεστι — присутствует, близко). LXX переводит евр. имя Магер-шелал-хаш-баз; в тексте перевод, как надпись — 『…』."
  2: "μάρτυράς μοι ποίησον πιστοὺς ἀνθρώπους — «сделай мне свидетелями людей верных» (μάρτυς — свидетель; πιστός — верный). τὸν Ουριαν καὶ τὸν Ζαχαριαν υἱὸν Βαραχιου — «Урию и Захарию, сына Варахии» (Ουριας — ウリヤ; Βαραχιας — バラキヤ). Слав. добавляет «иереа» («священника») при Урии — этого слова нет в LXX; по паритету внесено в текст (祭司ウリヤ). Здесь закрывается речь Господа 「…」."
  3: "προσῆλθον πρὸς τὴν προφῆτιν — «приступил я к пророчице» (προφῆτις — женский род; в тексте 女預言者). ἐν γαστρὶ ἔλαβεν καὶ ἔτεκεν υἱόν — «зачала и родила сына». Κάλεσον τὸ ὄνομα αὐτοῦ Ταχέως σκύλευσον, ὀξέως προνόμευσον — «нареки ему имя: Скоро-ограбляй, Быстро-расхищай» (Ταχέως σκύλευσον — императивы; евр. Магер-шелал-хаш-баз); имя — 『…』. Речь Господа — 「…」, продолжается в 8:4."
  4: "πρὶν ἢ γνῶναι τὸ παιδίον καλεῖν πατέρα ἢ μητέρα — «прежде нежели дитя узнает звать отца или мать» (παιδίον — дитя). λήμψεται δύναμιν Δαμασκοῦ καὶ τὰ σκῦλα Σαμαρείας — «возьмёт силу Дамаска и добычи Самарии» (δύναμις — сила, богатство; слав. «приимет силу дамаскову»). ἔναντι βασιλέως Ἀσσυρίων — «пред царём Ассирийским». Здесь закрывается речь 「…」."
  5: "Καὶ προσέθετο κύριος λαλῆσαί μοι ἔτι — «и приложил (продолжил) Господь говорить мне ещё» (προστίθημι — прибавлять; слав. «приложи»). Новая вводная формула; далее речь Господа — 「…」 до конца 8:8."
  6: "Διὰ τὸ μὴ βούλεσθαι τὸν λαὸν τοῦτον τὸ ὕδωρ τοῦ Σιλωαμ τὸ πορευόμενον ἡσυχῇ — «за то, что народ сей не хочет воды Силоама, текущей тихо» (Σιλωαμ — シロアム; ἡσυχῇ — тихо, спокойно; слав. «тисе»). ἀλλὰ βούλεσθαι ἔχειν τὸν Ραασσων καὶ τὸν υἱὸν Ρομελιου βασιλέα ἐφ᾿ ὑμῶν — «но хочет иметь Рецина и сына Ремалии царём над вами» (слав. «восхотеша имети рассона и сына ромелиева царя над вами»)."
  7: "τὸ ὕδωρ τοῦ ποταμοῦ τὸ ἰσχυρὸν καὶ τὸ πολύ — «воду реки сильную и многую» (Евфрат как образ Ассирии). τὸν βασιλέα τῶν Ἀσσυρίων καὶ τὴν δόξαν αὐτοῦ — «царя Ассирийского и славу его». ἀναβήσεται ἐπὶ πᾶσαν φάραγγα ὑμῶν καὶ περιπατήσει ἐπὶ πᾶν τεῖχος ὑμῶν — «поднимется на всякое ущелье ваше и пройдёт по всякой стене вашей» (φάραγξ — ущелье; τεῖχος — стена). МТ иначе («поднимется во всех протоках своих»); в тексте LXX/слав."
  8: "ἀφελεῖ ἀπὸ τῆς Ιουδαίας ἄνθρωπον ὃς δυνήσεται κεφαλὴν ἆραι — «отнимет от Иудеи человека, который сможет голову поднять» (αἴρω — поднимать). ἢ δυνατὸν συντελέσασθαί τι — «или способного что-либо совершить» (συντελέω — завершать). ἡ παρεμβολὴ αὐτοῦ ὥστε πληρῶσαι τὸ πλάτος τῆς χώρας σου — «стан его, чтобы наполнить ширину земли твоей» (παρεμβολή — стан, войско; πλάτος — ширина). μεθ᾿ ἡμῶν ὁ θεός — «с нами Бог»: LXX переводит имя Еммануил (ср. 7:14). Здесь закрывается речь 「…」."
  9: "γνῶτε ἔθνη καὶ ἡττᾶσθε — «узнайте, народы, и покоряйтесь» (ἡττάομαι — быть побеждённым, уступать). ἐπακούσατε ἕως ἐσχάτου τῆς γῆς — «услышьте до края земли». ἰσχυκότες ἡττᾶσθε — «укрепившиеся, покоряйтесь»; ἐὰν γὰρ πάλιν ἰσχύσητε, πάλιν ἡττηθήσεσθε — «ибо если снова укрепитесь, снова будете побеждены». Пророческий возглас, без кавычек: в LXX нет вводной формулы, и «с нами» (8:10) указывает на речь пророка, а не Господа."
  10: "καὶ ἣν ἂν βουλεύσησθε βουλήν, διασκεδάσει κύριος — «какой бы совет ни замыслили, рассеет Господь» (διασκεδάζω — рассеивать; слав. «разорит»). λόγον ὃν ἐὰν λαλήσητε, οὐ μὴ ἐμμείνῃ ὑμῖν — «слово, которое скажете, не пребудет у вас» (ἐμμένω). ὅτι μεθ᾿ ἡμῶν κύριος ὁ θεός — «ибо с нами Господь Бог». Возглас, без кавычек; в конце — второй раз «с нами Бог»."
  11: "Οὕτως λέγει κύριος — «так говорит Господь». Τῇ ἰσχυρᾷ χειρὶ ἀπειθοῦσιν τῇ πορείᾳ τῆς ὁδοῦ τοῦ λαοῦ τούτου λέγοντες — «крепкою рукою непокорным хождению пути народа сего, говоря»: место тёмное (LXX, видимо, испорчен; ср. МТ и ru «держа на мне крепкую руку и внушая мне не ходить путем сего народа»). В тексте держимся LXX/слав.; речь Господа — 「…」 до конца 8:16."
  12: "Μήποτε εἴπητε σκληρόν — «не говорите: жестоко» (σκληρός — жёсткий, тяжёлый); слав. «да не когда рекут» (3-е л. мн. ч.), в тексте 2-е л. по LXX. πᾶν γὰρ ὃ ἐὰν εἴπῃ ὁ λαὸς οὗτος, σκληρόν ἐστιν — «ибо всё, что скажет народ сей, жестоко». τὸν δὲ φόβον αὐτοῦ οὐ μὴ φοβηθῆτε οὐδὲ μὴ ταραχθῆτε — «страха его не бойтесь и не смущайтесь» (ταράσσω — смущать)."
  13: "κύριον αὐτὸν ἁγιάσατε — «Господа Его освятите» (ἁγιάζω — святить, почитать святым). καὶ αὐτὸς ἔσται σου φόβος — «и Он будет тебе страх». Слав. «Господа сил» добавляет «сил» (Саваоф), в LXX этого слова нет; по паритету внесено (万軍の主). Ср. 1 Пет 3:14–15."
  14: "καὶ ἐὰν ἐπ᾿ αὐτῷ πεποιθὼς ᾖς, ἔσται σοι εἰς ἁγίασμα — «и если на Него будешь уповать, будет тебе во освящение» (ἁγίασμα — святыня). οὐχ ὡς λίθου προσκόμματι συναντήσεσθε αὐτῷ οὐδὲ ὡς πέτρας πτώματι — «не как о камень преткновения встретитесь с Ним и не как о скалу падения» (πρόσκομμα — преткновение; πτῶμα — падение). ὁ δὲ οἶκος Ιακωβ ἐν παγίδι, καὶ ἐν κοιλάσματι ἐγκαθήμενοι ἐν Ιερουσαλημ — «дом же Иакова — в петле, и в яме сидящие в Иерусалиме» (παγίς — петля, сеть; κοίλασμα — углубление; слав. «в пругле»). Место тёмное в LXX; ср. МТ/ru «камнем преткновения… петлею и сетью для жителей Иерусалима» (цит. 1 Пет 2:8; Рим 9:33)."
  15: "ἀδυνατήσουσιν ἐν αὐτοῖς πολλοὶ — «изнемогут в них многие» (ἀδυνατέω — терять силу). καὶ πεσοῦνται καὶ συντριβήσονται — «и падут, и сокрушатся» (συντρίβω — сокрушать). ἐγγιοῦσιν καὶ ἁλώσονται ἄνθρωποι ἐν ἀσφαλείᾳ ὄντες — «приблизятся и будут взяты люди, в безопасности сущие» (ἁλίσκομαι — быть взятым; ἀσφάλεια — безопасность)."
  16: "Τότε φανεροὶ ἔσονται οἱ σφραγιζόμενοι τὸν νόμον τοῦ μὴ μαθεῖν — «тогда явны будут запечатывающие закон, чтобы не учиться» (σφραγίζω — запечатывать; φανερός — явный). LXX здесь передаёт иначе, чем МТ: в МТ и ru «Завяжи свидетельство, и запечатай откровение при учениках Моих» — этого чтения в текст не вносим (правило 4). Здесь закрывается речь Господа 「…」."
  17: "καὶ ἐρεῖ Μενῶ τὸν θεὸν τὸν ἀποστρέψαντα τὸ πρόσωπον αὐτοῦ ἀπὸ τοῦ οἴκου Ιακωβ — «и скажет: буду ждать Бога, отвратившего лицо Своё от дома Иакова» (μένω — ждать, оставаться; ἀποστρέφω — отвращать). Греч. ἐρεῖ («скажет») без подлежащего; отнесено к пророку (ср. слав. «И речет», ru «Итак я надеюсь»). Начало речи пророка — 「…」 до конца 8:22; ср. Евр 2:13."
  18: "ἰδοὺ ἐγὼ καὶ τὰ παιδία, ἅ μοι ἔδωκεν ὁ θεός — «вот я и дети, которых дал мне Бог» (цит. Евр 2:13). εἰς σημεῖα καὶ τέρατα ἐν τῷ οἴκῳ Ισραηλ — «в знамения и чудеса в доме Израиля» (σημεῖον — しるし; τέρας — 不思議). παρὰ κυρίου σαβαωθ, ὃς κατοικεῖ ἐν τῷ ὄρει Σιων — «от Господа Саваофа, обитающего на горе Сион» (κατοικέω — обитать)."
  19: "Ζητήσατε τοὺς ἀπὸ τῆς γῆς φωνοῦντας καὶ τοὺς ἐγγαστριμύθους — «ищите вызывающих с земли и чревовещателей» (ἐγγαστρίμυθος — чревовещатель, 口寄せ; φωνέω — издавать голос). τοὺς κενολογοῦντας οἳ ἐκ τῆς κοιλίας φωνοῦσιν — «пустословящих, которые из чрева говорят» (κενολογέω — пустословить). οὐκ ἔθνος πρὸς θεὸν αὐτοῦ — «не народ ли к Богу своему [обратится]?» τί ἐκζητοῦσιν περὶ τῶν ζώντων τοὺς νεκρούς — «что ищут о живых у мёртвых?» Слова людей — 『…』 внутри речи пророка."
  20: "νόμον γὰρ εἰς βοήθειαν ἔδωκεν — «ибо закон дал Он в помощь» (βοήθεια — помощь; слав. «в помощь»). ἵνα εἴπωσιν οὐχ ὡς τὸ ῥῆμα τοῦτο — «чтобы сказали: не как слово это». περὶ οὗ οὐκ ἔστιν δῶρα δοῦναι περὶ αὐτοῦ — «о котором нельзя дать даров за него» (место тёмное; слав. «заньже не леть дары даяти»); сохранено буквально, без догадок."
  21: "καὶ ἥξει ἐφ᾿ ὑμᾶς σκληρὰ λιμός — «и придёт на вас жестокий голод» (λιμός — голод). ἔσται ὡς ἂν πεινάσητε, λυπηθήσεσθε — «будет: когда взалчете, огорчитесь» (λυπέω — печалить). κακῶς ἐρεῖτε τὸν ἄρχοντα καὶ τὰ παταχρα — «зло скажете князю и отечеству» (τὰ παταχρα — испорченное слово, вероятно «отечество»; слав. «князю и отечеству»). ἀναβλέψονται εἰς τὸν οὐρανὸν ἄνω — «воззрят на небо вверху» (ἀναβλέπω — поднимать глаза)."
  22: "καὶ εἰς τὴν γῆν κάτω ἐμβλέψονται — «и на землю вниз посмотрят» (ἐμβλέπω — вглядываться). θλῖψις καὶ στενοχωρία καὶ σκότος — «скорбь, и теснота, и тьма» (θλῖψις — скорбь; στενοχωρία — теснота). ἀπορία στενὴ καὶ σκότος ὥστε μὴ βλέπειν — «недоумение тесное и тьма, так что не видеть». Слав. в конце добавляет «и не оскудеет в тесноте сый даже до времене» (= καὶ οὐκ ἀπορηθήσεται ὁ ἐν στενοχωρίᾳ ὢν ἕως καιροῦ — вторая половина gr 8:22, начало gr 8:23): по csl это конец 8:22, и в тексте она стоит здесь. Речь пророка закрывается в конце стиха. Начало gr 8:23 (Τοῦτο πρῶτον ποίει…) по csl — отдельный стих, наш 9:1."
