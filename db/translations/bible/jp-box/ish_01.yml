# jp-box, Исход, глава 1. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru)
# и jp-joc (1901, PD; в этой главе до ст. 20). ru (с масоретского) — только для понимания.
# Язык — современный 常体, порядок членов и деление на клаузы — по греческому.
# Глава 1: имена пришедших в Египет (1–5), смерть Иосифа и рост народа (6–7),
# новый фараон и его замысел (8–10), надзиратели и города (11–14),
# повивальные бабки (15–21), приказ бросать младенцев в реку (22).
# Красного и синего нет: говорит фараон и люди; речь Бога — только косвенно.
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено по базе).
# 1:5 — по LXX семьдесят пять душ (масоретский текст и Синодальный — семьдесят);
# 1:21 — по LXX «они сделали себе дома», а не «Бог устроял домы их» (масоретский текст).
# Сносок ⟨…⟩ нет: れんが и わら уже в корпусе (Быт 11; 1 Кор 3), 助産婦 понятно.
# jp-ni не использовался.

tr_code: jp-box
book: ish
chapter: 1
draft: true

verses:
  1: "これらは、エジプトへ入[はい]ったイスラエルの子[こ]ら、すなわち、彼[かれ]らの父[ちち]ヤコブとともに、それぞれ一家[いっか]を挙[あげ]て入[はい]った者[もの]たちの名[な]である。"
  2: "ルベン、シメオン、レビ、ユダ、"
  3: "イッサカル、ゼブルン、ベニヤミン、"
  4: "ダン、ナフタリ、ガド、アシェル。"
  5: "ヨセフはエジプトにいた。ヤコブから出[で]た者[もの]は、全部[ぜんぶ]で七十五人[にん]であった。"
  6: "やがてヨセフも、その兄弟[きょうだい]たちも、その世代[せだい]の人[ひと]もみな死[し]んだ。"
  7: "しかし、イスラエルの子[こ]らは多[おお]くの子[こ]を産[う]んで増[ふ]え、群[むれ]をなし、きわめて、きわめて強[つよ]くなり、地[ち]も彼[かれ]らを増[ふ]やした。"
  8: "そのころ、ヨセフのことを知[し]らない新[あたら]しい王[おう]がエジプトに起[お]こった。"
  9: "王[おう]は自分[じぶん]の民[たみ]に言[い]った。「見[み]よ、イスラエルの子[こ]らの民[たみ]はわたしたちより多[おお]く、しかも強[つよ]い。"
  10: "さあ、うまく計[はか]って彼[かれ]らを押[お]さえよう。これ以上[いじょう]増[ふ]えて、もし戦[いくさ]が起[お]これば、彼[かれ]らも敵[てき]に加[くわ]わり、わたしたちを攻[せ]めて、この地[ち]から出[で]て行[い]ってしまうといけない。」"
  11: "そこで、彼[かれ]らの上[うえ]に仕事[しごと]の監督[かんとく]たちを置[お]き、重[おも]い労働[ろうどう]で彼[かれ]らを苦[くる]しめた。彼[かれ]らはファラオのために、ピトム、ラメセス、オン、すなわちヘリオポリスという堅固[けんご]な町[まち]を建[た]てた。"
  12: "しかし、彼[かれ]らを苦[くる]しめれば苦[くる]しめるほど、彼[かれ]らは数[かず]を増[ま]し、きわめて、きわめて強[つよ]くなった。エジプト人[じん]はイスラエルの子[こ]らを忌[い]み嫌[きら]うようになった。"
  13: "エジプト人[じん]はイスラエルの子[こ]らを力[ちから]ずくで虐[しいた]げ、"
  14: "泥[どろ]とれんがの厳[きび]しい仕事[しごと]、野[の]でのあらゆる仕事[しごと]、すなわち、彼[かれ]らを力[ちから]ずくで奴隷[どれい]としたすべての仕事[しごと]によって、彼[かれ]らの命[いのち]を苦[くる]しくした。"
  15: "エジプトの王[おう]は、ヘブライ人[じん]の助産婦[じょさんぷ]たちに言[い]った。その一人[ひとり]の名[な]はシフラ、もう一人[ひとり]の名[な]はプアといった。"
  16: "そして言[い]った。「ヘブライ人[じん]の女[おんな]たちに助産婦[じょさんぷ]の務[つと]めをするとき、彼女[かのじょ]らが子[こ]を産[う]もうとするのを見[み]て、男[おとこ]の子[こ]なら殺[ころ]し、女[おんな]の子[こ]なら生[い]かしておけ。」"
  17: "しかし、助産婦[じょさんぷ]たちは神[かみ]を畏[おそ]れて、エジプトの王[おう]が命[めい]じたとおりにはせず、男[おとこ]の子[こ]を生[い]かした。"
  18: "エジプトの王[おう]は助産婦[じょさんぷ]たちを呼[よ]び寄[よ]せて言[い]った。「なぜこのようなことをして、男[おとこ]の子[こ]を生[い]かしたのか。」"
  19: "助産婦[じょさんぷ]たちはファラオに言[い]った。「ヘブライ人[じん]の女[おんな]たちはエジプトの女[おんな]たちと違[ちが]います。彼女[かのじょ]らは丈夫[じょうぶ]で、助産婦[じょさんぷ]が行[い]く前[まえ]に産[う]んでしまうのです。」"
  20: "神[かみ]は助産婦[じょさんぷ]たちに良[よ]くしてくださった。民[たみ]はますます増[ふ]え、きわめて強[つよ]くなった。"
  21: "助産婦[じょさんぷ]たちが神[かみ]を畏[おそ]れていたので、彼女[かのじょ]らは自分[じぶん]たちのために家[いえ]を建[た]てた。"
  22: "ファラオは民[たみ]すべてに命[めい]じて言[い]った。「ヘブライ人[じん]に生[う]まれる男[おとこ]の子[こ]は、すべてナイル川[がわ]に投[な]げよ。女[おんな]の子[こ]はすべて生[い]かしておけ。」"

notes:
  1: "Ταῦτα τὰ ὀνόματα — これらは…名である. τῶν εἰσπεπορευμένων εἰς Αἴγυπτον ἅμα Ιακωβ τῷ πατρὶ αὐτῶν — ヤコブとともにエジプトへ入った者たち. ἕκαστος πανοικίᾳ αὐτῶν — それぞれ一家を挙げて (πανοικίᾳ — «со всем домом»)."
  2: "Греч. формы: Ρουβην, Συμεων, Λευι, Ιουδας — ルベン、シメオン、レビ、ユダ."
  3: "Ισσαχαρ, Ζαβουλων, Βενιαμιν — イッサカル、ゼブルン、ベニヤミン."
  4: "Δαν, Νεφθαλι, Γαδ, Ασηρ — ダン、ナフタリ、ガド、アシェル. В слав. «Иосиф же бяше во Египте» стоит в конце этого стиха, у LXX — в начале 5-го; держимся LXX."
  5: "ἦσαν δὲ πᾶσαι ψυχαὶ ἐξ Ιακωβ πέντε καὶ ἑβδομήκοντα — 七十五人 (LXX; в масоретском тексте и Синодальном — семьдесят, это чтение не берём). Ιωσηφ δὲ ἦν ἐν Αἰγύπτῳ — ヨセフはエジプトにいた."
  6: "ἐτελεύτησεν δὲ Ιωσηφ — ヨセフは…死んだ (τελευτάω — «скончаться»). πᾶσα ἡ γενεὰ ἐκείνη — その世代の人 (γενεά — «род, поколение»)."
  7: "ηὐξήθησαν καὶ ἐπληθύνθησαν — 増え. χυδαῖοι ἐγένοντο — 群れをなし (χυδαῖος — «многочисленный, толпою»). σφόδρα σφόδρα — きわめて、きわめて (удвоение сохранено). ἐπλήθυνεν δὲ ἡ γῆ αὐτούς — 地も彼らを増やした (подлежащее — γῆ)."
  8: "Ἀνέστη δὲ βασιλεὺς ἕτερος — 新しい王が起こった (ἀνίστημι; ἕτερος — «другой»). ὃς οὐκ ᾔδει τὸν Ιωσηφ — ヨセフを知らない."
  9: "τῷ ἔθνει αὐτοῦ — 自分の民に (ἔθνος — «народ»). μέγα πλῆθος — 多く (букв. «великое множество»). ἰσχύει ὑπὲρ ἡμᾶς — わたしたちより強い."
  10: "δεῦτε οὖν κατασοφισώμεθα αὐτούς — さあ、うまく計って押さえよう (κατασοφίζομαι — «перехитрить»). μήποτε πληθυνθῇ — これ以上増えて. ἐκπολεμήσαντες ἡμᾶς — わたしたちを攻めて."
  11: "ἐπιστάτας τῶν ἔργων — 仕事の監督たち. ἵνα κακώσωσιν αὐτούς — 苦しめるため. πόλεις ὀχυράς — 堅固な町. Πιθωμ, Ραμεσση, Ων — ピトム、ラメセス、オン; ἥ ἐστιν Ἡλίου πόλις — すなわちヘリオポリス (букв. «город Солнца»)."
  12: "καθότι… ἐταπείνουν — 苦しめれば苦しめるほど (ταπεινόω — «смирять»). ἐβδελύσσοντο οἱ Αἰγύπτιοι ἀπὸ τῶν υἱῶν Ισραηλ — エジプト人は…忌み嫌うようになった (βδελύσσομαι — «гнушаться»)."
  13: "κατεδυνάστευον — 虐げた (καταδυναστεύω — «порабощать»). βίᾳ — 力ずくで (βία — «насилие»)."
  14: "τῷ πηλῷ καὶ τῇ πλινθείᾳ — 泥とれんが (πηλός — глина; πλινθεία — кирпичное дело). κατὰ πάντα τὰ ἔργα, ὧν κατεδουλοῦντο αὐτοὺς μετὰ βίας — 力ずくで奴隷としたすべての仕事によって (καταδουλόω)."
  15: "ταῖς μαίαις τῶν Εβραίων — ヘブライ人の助産婦たち (μαῖα — «повивальная бабка»). Σεπφωρα καὶ Φουα — シフラ、プア (совр. японские формы; в LXX Σεπφωρα пишется так же, как имя жены Моисея в 2:21, где оно передано ツィポラ, чтобы не путать двух женщин)."
  16: "Ὅταν μαιοῦσθε — 助産婦の務めをするとき. ὦσιν πρὸς τῷ τίκτειν — 子を産もうとするとき. ἀποκτείνατε — 殺せ. περιποιεῖσθε — 生かしておけ."
  17: "ἐφοβήθησαν… τὸν θεόν — 神を畏れて. ἐζωογόνουν τὰ ἄρσενα — 男の子を生かした (ζωογονέω — «оставлять в живых»)."
  18: "Τί ὅτι ἐποιήσατε τὸ πρᾶγμα τοῦτο — なぜこのようなことをしたのか."
  19: "Οὐχ ὡς γυναῖκες Αἰγύπτου αἱ Εβραῖαι — ヘブライの女たちはエジプトの女たちと違う. τίκτουσιν γὰρ πρὶν ἢ εἰσελθεῖν πρὸς αὐτὰς τὰς μαίας — 助産婦が行く前に産んでしまう."
  20: "εὖ δὲ ἐποίει ὁ θεὸς ταῖς μαίαις — 神は助産婦たちによくしてくださった (εὖ ποιέω — «благодетельствовать»). ἴσχυεν σφόδρα — きわめて強くなった."
  21: "ἐποίησαν ἑαυταῖς οἰκίας — 彼女らは自分たちのために家を建てた (подлежащее — αἱ μαῖαι; в масоретском тексте и Синодальном «Он устроял домы их», но LXX говорит иначе — держимся греческого)."
  22: "εἰς τὸν ποταμὸν ῥίψατε — ナイル川に投げよ (ὁ ποταμός у LXX — Нил). ζωογονεῖτε αὐτὸ — 生かしておけ."
