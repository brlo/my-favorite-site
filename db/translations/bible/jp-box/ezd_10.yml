# jp-box, Ездра, глава 10. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); церковнославянский (csl-ru) — второй свидетель
# церковного текста: слав. чтения и добавки входят в основной текст без 〔…〕,
# вариант LXX — в notes. ru (Синодальный) — только для понимания, не источник.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 10: молитва Ездры и речь Шехании (1–4), клятва и собрание (5–9),
# обличение и ответ народа (10–14), дело разбора (15–17), список согрешивших
# (18–44).
# Речь: Шехания — 「…」 (2–4); Ездра — 「…」 (10–11); народ — 「…」 (12–14).
# Красного нет.
# Паритет: 10:6 «сел там» — по csl (в LXX «пошёл туда»); 10:12 «громким голосом»
