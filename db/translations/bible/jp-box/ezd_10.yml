verses:
  1: "エズラが神[かみ]の家[いえ]の前[まえ]で祈[いの]り、涙[なみだ]を流[なが]して告白[こくはく]していると、イスラエルから彼[かれ]のもとに、男[おとこ]も女[おんな]も子[こ]どもも含[ふく]めて、きわめて多[おお]くの会衆[かいしゅう]が集[あつ]まって来[き]た。民[たみ]もまた大[おお]いに泣[な]いたからである。"
  2: "エラムの子[こ]らに属[ぞく]するイエヒエルの子[こ]シェカニヤが答[こた]えて、エズラに言[い]った。「わたしたちは、その地[ち]の民[たみ]のうちから異[い]民族[みんぞく]の女[おんな]を妻[つま]に迎[むか]えて、わたしたちの神[かみ]に罪[つみ]を犯[おか]した。しかし今[いま]、このことについてイスラエルには望[のぞ]みがある。"
  3: "今[いま]、わたしたちの神[かみ]と契約[けいやく]を結[むす]ぼう。すべての妻[つま]と、彼女[かのじょ]たちから生[う]まれた子[こ]らを追[お]い出[だ]そう。あなたが望[のぞ]むままに。立[た]ち上[あ]がって、わたしたちの神[かみ]の戒[いまし]めをもって彼[かれ]らを戒[いまし]めよ。法[ほう]に従[したが]って行[おこな]われよ。"
  4: "立[た]ち上[あ]がれ。このことはあなたにかかっている。わたしたちはあなたとともにいる。勇気[ゆうき]を出[だ]して行[おこな]え。」"
  5: "エズラは立[た]ち上[あ]がり、祭司[さいし]たちの長[かしら]たち、レビ人[びと]たち、およびすべてのイスラエルに、このとおりに行[おこな]うよう誓[ちか]わせた。彼[かれ]らは誓[ちか]った。"
  6: "エズラは神[かみ]の家[いえ]の前[まえ]から立[た]ち去[さ]り、エリアシブの子[こ]ヨハナンの宝物庫[たからものぐら]へ行[い]って、そこに座[すわ]った。彼[かれ]はパンを食[た]べず、水[みず]も飲[の]まなかった。捕囚[ほしゅう]から帰[かえ]った者[もの]たちの背信[はいしん]のゆえに悲[かな]しんでいたからである。"
  7: "ユダヤとエルサレムで、捕囚[ほしゅう]から帰[かえ]った者[もの]たちすべてに、エルサレムに集[あつ]まるよう告[つ]げ知[し]らせた。"
  8: "三日[みっか]のうちに来[こ]ない者[もの]はだれでも、長[かしら]たちと長老[ちょうろう]たちの決定[けってい]により、その全財産[ぜんざいさん]が聖絶[せいぜつ]され、その者[もの]自身[じしん]も捕囚[ほしゅう]から帰[かえ]った者[もの]たちの会衆[かいしゅう]から断[た]たれる。"
  9: "ユダとベニヤミンの人々[ひとびと]は皆[みな]、三日[みっか]のうちにエルサレムに集[あつ]まった。それは第九[だいきゅう]の月[つき]の二十日[はつか]であった。民[たみ]は皆[みな]、この事[こと]のゆえに、また雨[あめ]のゆえに震[ふる]えながら、神[かみ]の家[いえ]の前[まえ]の広場[ひろば]に座[すわ]っていた。"
  10: "祭司[さいし]エズラは立[た]ち上[あ]がって彼[かれ]らに言[い]った。「あなたがたは異[い]民族[みんぞく]の女[おんな]を妻[つま]に迎[むか]えて罪[つみ]を犯[おか]し、イスラエルの咎[とが]をさらに増[ふ]やした。"
  11: "今[いま]、あなたがたの父祖[ふそ]の神[かみ]である主[しゅ]に告白[こくはく]し、その御心[みこころ]を行[おこな]い、その地[ち]の民[たみ]々[みん]と異[い]民族[みんぞく]の女[おんな]たちから離[はな]れなさい。」"
  12: "会衆[かいしゅう]は皆[みな]答[こた]えて、大[おお]きな声[こえ]で言[い]った。「あなたが言[い]ったとおりに、わたしたちは行[おこな]う。"
  13: "しかし、民[たみ]は多[おお]く、今[いま]は雨[あめ]の季節[きせつ]で、外[そと]に立[た]っていることはできない。また、この事[こと]は一日[いちにち]や二日[ふつか]の仕事[しごと]ではない。わたしたちはこの事[こと]で多[おお]く罪[つみ]を犯[おか]したからである。"
  14: "わたしたちの長[かしら]たちが全会衆[ぜんかいしゅう]のために立[た]つように。わたしたちの町[まち]々[まち]のうちで異[い]民族[みんぞく]の女[おんな]を妻[つま]に迎[むか]えた者[もの]は皆[みな]、定[さだ]められた時[とき]にここへ来[く]るように。町[まち]ごとの長老[ちょうろう]たちとさばき人[びと]たちも、彼[かれ]らとともに来[く]るように。この事[こと]のゆえに、わたしたちの神[かみ]の燃[も]える怒[いか]りがわたしたちから離[はな]れるまで。」"
  15: "ただ、アサエルの子[こ]ヨナタンとテコアの子[こ]ヤジヤだけがこの事[こと]にわたしとともに立[た]ち、レビ人[びと]メシュラムとサバタイが彼[かれ]らを助[たす]けた。"
  16: "捕囚[ほしゅう]から帰[かえ]った者[もの]たちは、そのとおりに行[おこな]った。祭司[さいし]エズラと、父祖[ふそ]の家[いえ]による長[かしら]たち、すなわちその氏族[しぞく]ごとのすべての者[もの]が、名[な]によって選[えら]び分[わ]けられた。彼[かれ]らは第十[だいじゅう]の月[つき]の一日[ついたち]に集[あつ]まって、この事[こと]を調[しら]べ始[はじ]めた。"
  17: "そして、異[い]民族[みんぞく]の女[おんな]を妻[つま]に迎[むか]えたすべての者[もの]についての調査[ちょうさ]を、第一[だいいち]の月[つき]の一日[ついたち]までに終[お]えた。"
  18: "祭司[さいし]の子[こ]らの中[なか]から、異[い]民族[みんぞく]の女[おんな]を妻[つま]に迎[むか]えた者[もの]たちが見[み]つかった。すなわち、ヨセデクの子[こ]イエシュアの子[こ]らとその兄弟[きょうだい]たちのうちから、マアセヤ、エリエゼル、ヤリブ、ゲダルヤ。"
  19: "彼[かれ]らは、自分[じぶん]の妻[つま]たちを去[さ]らせることを誓[ちか]うために手[て]を差[さ]し出[だ]し、自分[じぶん]の咎[とが]のために雄羊[おひつじ]を罪[つみ]の献[ささ]げ物[もの]としてささげることを認[みと]めた。"
  20: "インメルの子[こ]らからは、ハナニとゼバデヤ。"
  21: "ハリムの子[こ]らからは、マアセヤ、エリヤ、シェマヤ、イエヒエル、ウジヤ。"
  22: "パシュルの子[こ]らからは、エルヨエナイ、マアセヤ、イシュマエル、ナタナエル、ヨザバド、エラサ。"
  23: "レビ人[びと]からは、ヨザバド、シメイ、コリア、すなわちコリタ、パタヒヤ、ユダ、エリエゼル。"
  24: "歌[うた]い手[て]からは、エリアシブ。門衛[もんえい]からは、シャルム、テレム、ウリ。"
  25: "イスラエルのうち、パロシュの子[こ]らからは、ラマヤ、イジヤ、マルキヤ、ミヤミン、エレアザル、アサビヤ、バナヤ。"
  26: "エラムの子[こ]らからは、マタニヤ、ザカリヤ、イエヒエル、アブデヤ、ヤリモト、エリヤ。"
  27: "ザトアの子[こ]らからは、エルヨエナイ、エリアシブ、マタニヤ、ヤリモト、ザバド、アジザ。"
  28: "ババイの子[こ]らからは、ヨハナン、ハナニヤ、ザブ、オタリ。"
  29: "バニの子[こ]らからは、メシュラム、マルク、アダヤ、ヤシュブ、シャル、レモト。"
  30: "パハト・モアブの子[こ]らからは、アドナ、ヘラル、バナヤ、マアセヤ、マタニヤ、ベツァルエル、バヌイ、マナセ。"
  31: "ハリムの子[こ]らからは、エリエゼル、イシヤ、マルキヤ、シェマヤ、シメオン、"
  32: "ベニヤミン、マルク、シェマリヤ。"
  33: "ハシュムの子[こ]らからは、マトナイ、マタタ、ザバド、エリフェレト、エレマイ、マナセ、シメイ。"
  34: "バニの子[こ]らからは、マアダイ、アムラム、ウエル、"
  35: "バナヤ、ビデヤ、ケルヒ、"
  36: "ワニヤ、メレモト、エリアシブ、"
  37: "マタニヤ、マトナイ、ヤアサイ、"
  38: "バヌイの子[こ]らとシメイの子[こ]らが、このとおりに行[おこな]った。すなわち、"
  39: "シェレミヤ、ナタン、アダヤ、"
  40: "マクナダバイ、シャシャイ、シャライ、"
  41: "エズリエル、シェレミヤ、シェマリヤ、"
  42: "シャルム、アマルヤ、ヨセフ。"
  43: "ネボの子[こ]らからは、イエヒエル、マタテヤ、ゼデム、ゼビナ、ヤダイ、ヨエル、バナヤ。"
  44: "これらすべての者[もの]は異[い]民族[みんぞく]の女[おんな]を妻[つま]に迎[むか]え、彼女[かのじょ]たちは彼[かれ]らに子[こ]どもを産[う]んだ。"

notes:
  1: "ὡς προσηύξατο — когда помолился (προσεύχομαι); ἐξηγόρευσεν — исповедал (ἐξαγορεύω — открыто признавать); κλαίων καὶ προσευχόμενος — плача и молясь; ἐνώπιον οἴκου τοῦ θεοῦ — пред домом Божиим; ἐκκλησία πολλὴ σφόδρα — весьма большое собрание (ἐκκλησία); ἄνδρες καὶ γυναῖκες καὶ νεανίσκοι — мужчины, женщины и юноши (νεανίσκος; Синод. «дети»); ἔκλαυσεν ὁ λαός — народ плакал; ὕψωσεν κλαίων — «возвысил плач», плакал громко."
  2: "ἀπεκρίθη Σεχενιας υἱὸς Ιιηλ — отвечал Шехания, сын Иехиила (Σεχενιας — シェカニヤ; Ιιηλ — イエヒエル); ἀπὸ υἱῶν Ηλαμ — из сыновей Елама; ἠσυνθετήσαμεν — «нарушили договор», согрешили (ἀσυνθετέω); ἐκαθίσαμεν γυναῖκας ἀλλοτρίας — «посадили», т. е. взяли чужих жён (καθίζω); ὑπομονή — надежда, ожидание (csl «упование»); ἐπὶ τούτῳ — в этом деле."
  3: "διαθώμεθα διαθήκην — заключим завет (διατίθημι); ἐκβαλεῖν πάσας τὰς γυναῖκας — изгнать всех жён; τὰ γενόμενα ἐξ αὐτῶν — рождённых от них; ὡς ἂν βούλῃ — «как ты хочешь» (βούλομαι, 2-е л. ед. ч.; csl «якоже хощет» — 3-е л.); ἀνάστηθι — встань; φοβέρισον αὐτοὺς ἐν ἐντολαῖς — устраши их заповедями (φοβερίζω); ὡς ὁ νόμος γενηθήτω — да будет по закону."
  4: "ἀνάστα — встань (ἀνίστημι); ἐπὶ σὲ τὸ ῥῆμα — «на тебе слово», т. е. дело твоё; ἡμεῖς μετὰ σοῦ — мы с тобой; κραταιοῦ καὶ ποίησον — укрепиcь и сделай (κραταιόω, повелит.)."
  5: "ὥρκισεν — заклял (ὁρκίζω; csl «закля»); τοὺς ἄρχοντας, τοὺς ἱερεῖς καὶ Λευίτας — начальствующих, священников и левитов; τοῦ ποιῆσαι κατὰ τὸ ῥῆμα — сделать по слову сему; ὤμοσαν — поклялись (ὄμνυμι)."
  6: "ἀνέστη ἀπὸ προσώπου οἴκου τοῦ θεοῦ — встал от лица дома Божия; γαζοφυλάκιον Ιωαναν υἱοῦ Ελισουβ — сокровищница Иоханана, сына Елияшива (γαζοφυλάκιον, 宝物庫); ἐπορεύθη ἐκεῖ — пошёл туда (LXX), csl «седе тамо» — сел там (принято csl); ἄρτον οὐκ ἔφαγεν — хлеба не ел; ἐπένθει — скорбел, плакал (πενθέω); ἐπὶ τῇ ἀσυνθεσίᾳ τῆς ἀποικίας — о беззаконии переселения."
  7: "παρήνεγκαν φωνήν — «пронесли голос», провозгласили (παραφέρω); ἐν Ιουδα καὶ ἐν Ιερουσαλημ — в Иудее и Иерусалиме; πᾶσιν τοῖς υἱοῖς τῆς ἀποικεσίας — всем сынам переселения; συναθροισθῆναι — собраться (συναθροίζω)."
  8: "ἐν τρεῖς ἡμέρας — в три дня; ὡς ἡ βουλὴ τῶν ἀρχόντων — по решению начальствующих (βουλή); ἀναθεματισθήσεται πᾶσα ἡ ὕπαρξις — всё имущество будет предано заклятию (ἀναθεματίζω, ὕπαρξις); διασταλήσεται — будет отделён (διαστέλλω); ἀπὸ ἐκκλησίας τῆς ἀποικεσίας — от собрания переселения."
  9: "εἰς τὰς τρεῖς ἡμέρας — в три дня; ὁ μὴν ὁ ἔνατος — девятый месяц; εἰκάδι τοῦ μηνός — в двадцатый день; ἐκάθισεν πᾶς ὁ λαός — сел весь народ; ἐν πλατείᾳ οἴκου τοῦ θεοῦ — на площади у дома Божия (πλατεῖα); ἀπὸ θορύβου αὐτῶν περὶ τοῦ ῥήματος — от смятения их об этом деле (θόρυβος; csl «трепещуще»); ἀπὸ τοῦ χειμῶνος — от зимы, дождей (χειμών)."
  10: "ἀνέστη Εσδρας ὁ ἱερεύς — встал Ездра священник; ἠσυνθετήκατε — вы нарушили [завет]; τοῦ προσθεῖναι ἐπὶ πλημμέλειαν — чтобы прибавить к вине (προστίθημι)."
  11: "δότε αἴνεσιν κυρίῳ — «воздайте хвалу Господу», т. е. исповедайте (αἴνεσις); ποιήσατε τὸ ἀρεστόν — сделайте угодное; διαστάλητε — отделитесь (διαστέλλω); ἀπὸ λαῶν τῆς γῆς — от народов земли; ἀπὸ τῶν γυναικῶν τῶν ἀλλοτρίων — от чужих жён."
  12: "ἀπεκρίθησαν πᾶσα ἡ ἐκκλησία — отвечало всё собрание; Μέγα τοῦτο τὸ ῥῆμά σου ἐφ᾿ ἡμᾶς ποιῆσαι — «велико это слово твоё для нас — сделать»; csl добавляет «гласом великим» (大きな声で), в LXX нет, — принято csl."
  13: "ὁ λαὸς πολύς — народ многочислен; ὁ καιρὸς χειμερινός — время зимнее, дождливое (χειμερινός); οὐκ ἔστιν δύναμις στῆναι ἔξω — нет возможности стоять вне (δύναμις); τὸ ἔργον οὐκ εἰς ἡμέραν μίαν — дело не на один день; ἐπληθύναμεν τοῦ ἀδικῆσαι — «умножили, чтобы поступать неправедно» (ἀδικέω)."
  14: "στήτωσαν οἱ ἄρχοντες — пусть предстанут начальники (ἵστημι); τῇ πάσῃ ἐκκλησίᾳ — пред всем собранием; ὃς ἐκάθισεν γυναῖκας ἀλλοτρίας — кто взял чужих жён; εἰς καιροὺς ἀπὸ συνταγῶν — в назначенные сроки по повелению (συνταγή); πρεσβύτεροι πόλεως καὶ πόλεως — старейшины каждого города; κριταί — судьи; ἀποστρέψαι ὀργὴν θυμοῦ — отвратить ярость гнева (ἀποστρέφω)."
  15: "πλὴν Ιωναθαν υἱὸς Ασαηλ — только Ионафан, сын Асаила (Ιωναθαν — ヨナタン; Ασαηλ — アサエル); Ιαζια υἱὸς Θεκουε — Яхзеия, сын Фиквы (Ιαζια — ヤジヤ; Θεκουε — テコア); μετ᾿ ἐμοῦ περὶ τούτου — со мною об этом; Μεσουλαμ — Мешуллам (メシュラム); Σαβαθαι ὁ Λευίτης — Шавфай левит (サバタイ); βοηθῶν αὐτοῖς — помогая им (βοηθέω)."
  16: "ἐποίησαν οὕτως — сделали так; διεστάλησαν — были отделены (διαστέλλω); ἄνδρες ἄρχοντες πατριῶν — мужи, главы родов; τῷ οἴκῳ — по дому, роду; πάντες ἐν ὀνόμασιν — все по именам; ἐπέστρεψαν — обратились (csl «обратишася»); ἐν ἡμέρᾳ μιᾷ τοῦ μηνὸς τοῦ δεκάτου — в первый день десятого месяца; ἐκζητῆσαι τὸ ῥῆμα — исследовать дело."
  17: "ἐτέλεσαν — окончили; ἐν πᾶσιν ἀνδράσιν — со всеми мужами; ἕως ἡμέρας μιᾶς τοῦ μηνὸς τοῦ πρώτου — до первого дня первого месяца."
  18: "εὑρέθησαν — нашлись; ἀπὸ υἱῶν τῶν ἱερέων — из сыновей священников; ἀπὸ υἱῶν Ἰησοῦ υἱοῦ Ιωσεδεκ — из сыновей Иисуса, сына Иоседека (イエシュア, ヨセデク); Μαασηα — Маасея (マアセヤ); Ελιεζερ — Елиезер (エリエゼル); Ιαριβ — Иарив (ヤリブ); Γαδαλια — Гедалия (ゲダルヤ)."
  19: "ἔδωκαν χεῖρα αὐτῶν — дали руку свою (знак обязательства); ἐξενέγκαι γυναῖκας — изгнать жён (ἐκφέρω); πλημμελείας κριὸν ἐκ προβάτων — овна из овец за преступление (πλημμέλεια); περὶ πλημμελήσεως αὐτῶν — за преступление их."
  20: "Εμμηρ — Иммер (インメル; слав. «еммировых»); Ανανι — Хананий (ハナニ); Ζαβδια — Зевадия (ゼバデヤ)."
  21: "Ηραμ — Харим (ハリム; слав. «ирамлих»); Μασαια — Маасея (マアセヤ); Ελια — Елия (エリヤ); Σαμαια — Шемаия (シェマヤ); Ιιηλ — Иехиил (イエヒエル); Οζια — Уззия (ウジヤ)."
  22: "Φασουρ — Пашхур (パシュル; слав. «фассур»); Ελιωηναι — Елиоенай (エルヨエナイ); Μαασαια — Маасея (マアセヤ); Ισμαηλ — Измаил (イシュマエル); Ναθαναηλ — Нафанаил (ナタナエル); Ιωζαβαδ — Иозавад (ヨザバド); Ηλασα — Еласа (エラサ)."
  23: "ἀπὸ τῶν Λευιτῶν — из левитов; Ιωζαβαδ — Иозавад (ヨザバド); Σαμου — Шимей (シメイ; слав. «фамуй»); Κωλια [αὐτὸς Κωλιτας] — Келаия, он же Клита (コリア、すなわちコリタ; в издании второе имя в квадратных скобках, в базе есть); Φαθαια — Пафахия (パタヒヤ); Ιοδομ — Иуда (ユダ; слав. «иуда», в LXX иная форма); Ελιεζερ — Елиезер (エリエゼル)."
  24: "ἀπὸ τῶν ᾀδόντων — из певцов (ᾄδω); Ελισαφ — Елияшив (エリアシブ; слав. «елисав»); ἀπὸ τῶν πυλωρῶν — из привратников (πυλωρός); Σελλημ — Шаллум (シャルム; слав. «солмин»); Τελημ — Телем (テレム); Ωδουε — Урий (ウリ; слав. «одуа»)."
  25: "ἀπὸ Ισραηλ — из Израиля; Φορος — Парош (パロシュ); Ραμια — Рамаия (ラマヤ); Ιαζια — Иззия (イジヤ); Μελχια — Малхия (マルキヤ); Μεαμιν — Миямин (ミヤミン); Ελεαζαρ — Елеазар (エレアザル); Ασαβια — Хашавия (アサビヤ; слав. «асавиа»); Βαναια — Венаия (バナヤ)."
  26: "Ηλαμ — Елам (エラム); Μαθανια — Матфания (マタニヤ); Ζαχαρια — Захария (ザカリヤ); Ιαιηλ — Иехиил (イエヒエル); Αβδια — Авдий (アブデヤ); Ιαριμωθ — Иремоф (ヤリモト); Ηλια — Елия (エリヤ)."
  27: "Ζαθουα — Заффу (ザトア); Ελιωηναι — Елиоенай (エルヨエナイ); Ελισουβ — Елияшив (エリアシブ); Μαθανια — Матфания (マタニヤ); Ιαρμωθ — Иремоф (ヤリモト); Ζαβαδ — Завад (ザバド); Οζιζα — Азиса (アジザ)."
  28: "Βαβι — Бевай (ババイ); Ιωαναν — Иоханан (ヨハナン); Ανανια — Ханания (ハナニヤ); Ζαβου — Забвай (ザブ; слав. «завуй»); Οθαλι — Афлай (オタリ; слав. «фали»)."
  29: "Βανουι — Ваний (バニ); Μεσουλαμ — Мешуллам (メシュラム); Μαλουχ — Маллух (マルク); Αδαιας — Адая (アダヤ); Ιασουβ — Иашув (ヤシュブ); Σαλουια — Шеал (シャル; слав. «саал»); Ρημωθ — Иерамоф (レモト; слав. «римоф»)."
  30: "Φααθμωαβ — Пахаф-Моав (パハト・モアブ); Εδενε — Адна (アドナ; слав. «еднеа»); Χαληλ — Хелал (ヘラル); Βαναια — Венаия (バナヤ); Μασηα — Маасея (マアセヤ); Μαθανια — Матфания (マタニヤ); Βεσεληλ — Веселеил (ベツァルエル); Βανουι — Биннуй (バヌイ); Μανασση — Манассия (マナセ)."
  31: "Ηραμ — Харим (ハリム); Ελιεζερ — Елиезер (エリエゼル); Ιεσσια — Ишшия (イシヤ); Μελχια — Малхия (マルキヤ); Σαμαια — Шемаия (シェマヤ); Σεμεων — Симеон (シメオン)."
  32: "Βενιαμιν — Вениамин (ベニヤミン); Μαλουχ — Маллух (マルク); Σαμαρια — Шемария (シェマリヤ)."
  33: "Ησαμ — Хашум (ハシュム; слав. «асим»); Μαθανι — Мафнай (マトナイ); Μαθαθα — Мафафа (マタタ); Ζαβεδ — Завад (ザバド); Ελιφαλεθ — Елифелет (エリフェレト); Ιεραμι — Иеремай (エレマイ); Μανασση — Манассия (マナセ); Σεμει — Шимей (シメイ)."
  34: "Βανι — Ваний (バニ); Μοοδι — Маадай (マアダイ; слав. «моодиа»); Αμραμ — Амрам (アムラム); Ουηλ — Уел (ウエル)."
  35: "Βαναια — Бенаия (バナヤ); Βαδαια — Бидья (ビデヤ); Χελια — Келухи (ケルヒ; слав. «хелиа»)."
  36: "Ουιεχωα — Вания (ワニヤ; слав. «уаниа»); Ιεραμωθ — Меремоф (メレモト; слав. «маримоф»); Ελιασιβ — Елиашив (エリアシブ)."
  37: "Μαθανια — Матфания (マタニヤ); Μαθαναι — Мафнай (マトナイ); καὶ ἐποίησαν — «и сделали»: в LXX эти слова стоят в конце ст. 37, а csl относит их к началу ст. 38 («И сотвориша»), — принято csl; третье имя в Синод. «Иаасай» — по евр."
  38: "οἱ υἱοὶ Βανουι καὶ οἱ υἱοὶ Σεμει — сыны Вания и сыны Шимея (バヌイ, シメイ); ἐποίησαν — сделали (см. ст. 37). Имена ст. 39–42 — их продолжение, поэтому стих кончается «すなわち»."
  39: "Σελεμια — Шелемия (シェレミヤ; слав. «салемиа»); Ναθαν — Нафан (ナタン); Αδαια — Адаия (アダヤ)."
  40: "Μαχναδαβου — Махнадбай (マクナダバイ); Σεσι — Шашай (シャシャイ); Σαρου — Шарай (シャライ). В csl эти три имени переданы как «махнада, авусесей» (два слова) — повреждённое чтение, держимся LXX."
  41: "Εζερηλ — Азариел (エズリエル; слав. «аруесриил»); Σελεμια — Шелемия (シェレミヤ); Σαμαρια — Шемария (シェマリヤ)."
  42: "Σαλουμ — Шаллум (シャルム); Αμαρια — Амария (アマルヤ); Ιωσηφ — Иосиф (ヨセフ)."
  43: "Ναβου — Нево (ネボ); Ιιηλ — Иеиел (イエヒエル); Μαθαθια — Матфифия (マタテヤ); Σεδεμ — ゼデム: в csl ошибочно «завад» (повтор имени из ст. 27), держимся LXX; Ζαμβινα — Зевина (ゼビナ); Ιαδαι — Иаддай (ヤダイ); Ιωηλ — Иоиль (ヨエル); Βαναια — Бенаия (バナヤ)."
  44: "πάντες οὗτοι — все эти; ἐλάβοσαν γυναῖκας ἀλλοτρίας — взяли чужих жён; ἐγέννησαν ἐξ αὐτῶν υἱούς — родили от них сыновей (γεννάω)."
