# jp-box, Песнь Песней, глава 1. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 1: заголовок (1), лобзания и благоухание (2–3), «повлекли тебя» и чертог (4),
# «черна и красива» (5–6), поиск возлюбленного в полдень (7), ответ спутников (8),
# конь фараона и украшения (9–11), нард, смирна и кипр (12–14), «ты прекрасна» (15),
# ложе в тени, кедры и кипарисы (16–17). Поэзия: параллелизмы и повторы не сглажены;
# телесные образы (2, 13) переданы по-гречески, без эвфемизмов и без вульгарности.
# Голоса: женщина — без кавычек (2–7, 12–14, 16–17); возлюбленный — 「…」 (9–11, 15);
# спутники/хор — 「…」 (8). 1:1 — заголовок, без кавычек.
# Нумерация по gr: 17 стихов. Слав. идёт на стих позади: заголовка в csl нет,
# csl 1:1 = gr 1:2, csl 1:16 = gr 1:17. Держимся gr.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz. Сносок ⟨…⟩ нет.
# Имена — транслитерация греческого (LXX).

tr_code: jp-box
book: pp
chapter: 1
draft: true

verses:
  1: "歌[うた]の歌[うた]。それはソロモンのものである。"
  2: "あの人がその口の口づけで、わたしに口づけしてくれるように。あなたの乳房[ちぶさ]はぶどう酒よりも良い。"
  3: "あなたの香油[こうゆ]の香[かお]りは、すべての香料[こうりょう]にまさる。あなたの名[な]は注[そそ]ぎ出[だ]された香油だ。それゆえ、若[わか]い女[おんな]たちはあなたを愛[あい]した。"
  4: "あなたは引[ひ]き寄[よ]せられ、わたしたちはあなたの香油の香りを追[お]って、あなたのあとを走[はし]る。王[おう]はわたしをその寝室[しんしつ]へ連[つ]れて入[はい]った。わたしたちはあなたによって喜[よろこ]び、楽[たの]しもう。あなたの乳房をぶどう酒にまさって愛[あい]そう。正[ただ]しさがあなたを愛した。"
  5: "エルサレムの娘[むすめ]たちよ、わたしは黒[くろ]くて美[うつく]しい。ケダルの天幕[てんまく]のように、ソロモンの幕[まく]のように。"
  6: "わたしを見[み]ないでほしい。わたしが黒いのは、太陽[たいよう]がわたしを焼[や]いたからだ。母[はは]の息子[むすこ]たちはわたしに敵対[てきたい]し、わたしをぶどう畑[ばたけ]の見張[みは]りに置[お]いた。わたしは自分[じぶん]のぶどう畑を見張らなかった。"
  7: "わたしの魂[たましい]が愛[あい]したあなたよ、わたしに告[つ]げてほしい。どこで羊[ひつじ]を飼[か]い、昼[ひる]のうちにどこで憩[いこ]うのか。わたしが、あなたの仲間[なかま]たちの群[む]れのそばで、顔[かお]を覆[おお]う者[もの]のようにならないために。"
  8: "「もしあなたが自分[じぶん]を知[し]らないなら、女[おんな]たちのうちで美[うつく]しい者[もの]よ、羊の群れの足跡[あしあと]をたどって出[で]て行[ゆ]き、羊飼[ひつじか]いたちの天幕[てんまく]のそばで、あなたの子[こ]やぎを飼[か]いなさい。」"
  9: "「ファラオの戦車[せんしゃ]の馬[うま]に、わたしはあなたをなぞらえた、わが伴[とも]なる者[もの]よ。"
  10: "あなたの頬[ほお]はなんと美[うつく]しくなったことか。まるで山鳩[やまばと]のようだ。あなたの首[くび]は、まるで首飾[くびかざ]りのようだ。"
  11: "わたしたちはあなたのために、銀[ぎん]の点[てん]を散[ち]らした金[きん]の飾りを作[つく]ろう。」"
  12: "王[おう]がその食卓[しょくたく]に横[よこ]たわっている間[あいだ]、わたしのナルドは香[かお]りを放[はな]った。"
  13: "わが愛[あい]する者[もの]は、わたしにとって没薬[もつやく]の束[たば]。わたしの乳房[ちぶさ]の間[あいだ]に宿[やど]る。"
  14: "わが愛[あい]する者[もの]は、わたしにとってエンゲディのぶどう畑[ばたけ]にあるヘンナの房[ふさ]。"
  15: "「見[み]よ、あなたは美[うつく]しい、わが伴[とも]なる者[もの]よ。見よ、あなたは美しい。あなたの目[め]は鳩[はと]。」"
  16: "見よ、あなたは美しい、わが愛[あい]する者[もの]よ、まことに麗[うるわ]しい。わたしたちの寝床[ねどこ]は木陰[こかげ]に包[つつ]まれ、"
  17: "わたしたちの家[いえ]の梁[はり]は杉[すぎ]、わたしたちの天井[てんじょう]は糸杉[いとすぎ]。"

notes:
  1: "ᾎισμα ᾀσμάτων — «песнь песней», евр. суперлатив («песнь из песней»); ὅ ἐστιν τῷ Σαλωμων — «которая Соломону», датив принадлежности. Заголовка в слав. нет: csl 1:1 = гр. 1:2, поэтому весь слав. ряд сдвинут на стих. Говорящего нет, заголовок без кавычек."
  2: "Говорящая — женщина, без кавычек: о возлюбленном она говорит в 3-м лице, затем обращается к нему во 2-м. φιλησάτω — импер. аор. 3 л. от φιλέω, «пусть целует»; ἀπὸ φιλημάτων — «от [множества] лобзаний», т. е. пусть целует много (слав. «да лобжет мя от лобзаний уст своих»). ἀγαθοὶ μαστοί σου ὑπὲρ οἶνον — «груди твои лучше вина» (слав. «яко блага сосца твоя паче вина»); μαστοί передано 乳房, без эвфемизма."
  3: "Говорящая — женщина. ὀσμὴ μύρων σου — «запах мастей (благовоний) твоих» (μύρον — 香油); μύρον ἐκκενωθέν — «миро излиянное, вылитое» (ἐκκενόω): имя возлюбленного — разлитое миро, без связки, как в греч. διὰ τοῦτο — «потому»; νεάνιδες — молодые женщины, 若い女たち (по брифу; слав. «отроковицы»)."
  4: "Говорящая — женщина; мн. ч. δραμοῦμεν, ἀγαλλιασώμεθα, ἀγαπήσομεν она относит к себе вместе с дочерьми из ст. 3 (вариант: это голос дочерей, тогда 1:4b в 「…」; стих не делим, оставлен одним голосом). εἵλκυσάν σε — «повлекли тебя» (3 л. мн. ч.; слав. «привлекоша тя»), передано страдательным оборотом, чтобы не приписывать действие дочерям прямо; в Синодальном «влеки меня» — иное чтение, не внесено. ταμίειον — «сокровищница, внутренний покой»; слав. «ложница», поэтому 寝室. εὐθύτης ἠγάπησέν σε — «праведность (прямота) возлюбила тебя», тёмное место; слав. «правость возлюби тя»."
  5: "Говорящая — женщина, обращение к дочерям Иерусалима. μέλαινα — «чёрная, смуглая»; καί — «и», не «но» (слав. «черна есмь аз и добра»). σκηνώματα Κηδαρ — шатры Кидарские (Κηδαρ — ケダル); δέρρεις Σαλωμων — кожаные покровы, завесы Соломоновы (слав. «завесы соломони»)."
  6: "Говорящая — женщина. μὴ βλέψητε — запрет с аор. конъюнктивом, «не смотрите»; μεμελανωμένη — перфект пасс. от μελαίνω, «почерневшая, опалённая». παρέβλεψέν με ὁ ἥλιος — «солнце обожгло меня» (παραβλέπω — смотреть мимо, опалить; слав. «опали мя солнце»); двойное ὅτι сведено в одну причинную связь. υἱοὶ μητρός μου ἐμαχέσαντο ἐν ἐμοί — «сыновья матери моей враждовали против меня»; φυλάκισσα — «стражница» (слав. «стража»)."
  7: "Говорящая — женщина, обращение к возлюбленному. ἀπάγγειλον — импер. «возвести, скажи»; ποιμαίνεις — «пасёшь»; κοιτάζεις — «укладываешь [стадо] на отдых, покоишься» (κοιτάζω), в Синодальном «отдыхаешь». μήποτε γένωμαι ὡς περιβαλλομένη ἐπ᾿ ἀγέλαις ἑταίρων σου — «как бы мне не стать кутающейся при стадах товарищей твоих»: περιβαλλομένη — прич. от περιβάλλω, «окутывать себя»; слав. «облагающаяся», Синодальный «скиталицею» — понимание по МТ."
  8: "Голос — спутники/хор (по брифу), поэтому 「…」. ἡ καλὴ ἐν γυναιξίν — «прекрасная между жёнами», обращение (слав. «добрая в женах»). πτέρναι — «пятки», т. е. следы (слав. «в пятах паств»); ἐρίφους — козлята, 子やぎ; σκηνώματα τῶν ποιμένων — шатры пастухов (слав. «кущи пастырския»)."
  9: "Говорящий — возлюбленный, поэтому 「…」. τῇ ἵππῳ μου — «кобылице моей» (ἵππος ж. р.); ἐν ἅρμασιν Φαραω — «в колесницах фараона» (слав. «в колесницех фараоновых», ед. ч.). ὡμοίωσά σε — «уподобил тебя» (ὁμοιόω); ἡ πλησίον μου — «ближняя моя», わが伴なる者 (по брифу)."
  10: "Говорящий — возлюбленный, 「…」. τί ὡραιώθησαν — восклицание «как прекрасны стали» (ὡραιόω); σιαγόνες — щёки, ланиты. ὡς τρυγόνες — «как горлицы» (τρυγών); в Синодальном «под подвесками» — по МТ, не внесено, слав. держит «яко горлицы». ὁρμίσκοι — «ожерелья, нити бус» (слав. «монисты»); мн. ч. в японском не выражено."
  11: "Говорящий — возлюбленный, 「…」; ποιήσομεν — 1 л. мн. ч., он говорит и о других (свите). ὁμοιώματα χρυσίου — «подобия золота», золотые украшения; στίγματα τοῦ ἀργυρίου — «крапины (точки) серебра» (στίγμα — метка; слав. «с пестротами сребра»)."
  12: "Говорящая — женщина. ἕως οὗ — «доколе, пока»; ἀνάκλισις — «возлежание [за трапезой]» (слав. «на восклонении своем»), поэтому 食卓に横たわる. νάρδος — нард, ナルド; ἔδωκεν ὀσμήν — «дал благоухание» (слав. «даде воню свою»)."
  13: "Говорящая — женщина. ἀπόδεσμος τῆς στακτῆς — «связка (узелок) смирны»: στακτή — жидкая смирна, капля (слав. «вязание стакти», Синодальный «мирровый пучок»). ἀδελφιδός μου — わが愛する者 (по брифу); αὐλισθήσεται — «проведёт ночь, водворится» (αὐλίζομαι). Образ груди сохранён, как в греческом, без сглаживания."
  14: "Говорящая — женщина. βότρυς τῆς κύπρου — «гроздь кипра (хны)»: κύπρος — Lawsonia, ヘンナ (слав. «грезн кипров», Синодальный «кисть кипера»). ἐν ἀμπελῶσιν Εγγαδδι — «в виноградниках Енгадди» (エンゲディ)."
  15: "Говорящий — возлюбленный, 「…」. ἰδού — повтор сохранён; ὀφθαλμοί σου περιστεραί — «глаза твои — голуби», без связки, как в греч. (слав. «очи твои голубине»); περιστερά — 鳩."
  16: "Говорящая — женщина. καί γε — «и даже, и притом»; ὡραῖος — «красив, прекрасен». πρὸς κλίνῃ ἡμῶν σύσκιος — «при ложе нашем [всё] тенисто»: σύσκιος — «осенённый, тенистый» (слав. «одр наш со осенением»); 木陰に包まれ передаёт именно тенистость."
  17: "Говорящая — женщина; стих продолжает 16. δοκοί — «балки, брусья»; κέδροι — кедры, 杉; φατνώματα — «кессоны, потолок» (слав. «дски» — доски); κυπάρισσοι — кипарисы, 糸杉. Слав. текст этого стиха стоит в csl 1:16 (сдвиг на стих)."
