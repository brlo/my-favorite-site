verses:
  1: "「主[しゅ]の霊[れい]がわたしの上[うえ]にある。それゆえ、主はわたしに油[あぶら]を注[そそ]がれた。主は、貧[まず]しい者[もの]たちに福音[ふくいん]を告[つ]げ知[し]らせ、心[こころ]の砕[くだ]けた者たちを癒[いや]し、捕[とら]われた者たちに釈放[しゃくほう]を、目[め]の見[み]えない者たちに目の開[ひら]かれることを告[つ]げ知[し]らせるために、わたしを遣[つか]わされた。"
  2: "主[しゅ]の喜[よろこ]ばしい年[とし]と、報[むく]いの日[ひ]を告[つ]げ知[し]らせ、すべて悲[かな]しむ者[もの]たちを慰[なぐさ]めるために。"
  3: "シオンで悲[かな]しむ者[もの]たちに、灰[はい]の代[か]わりに栄光[えいこう]を与[あた]え、悲しむ者たちに喜[よろこ]びの油[あぶら]を、沈[しず]みの霊[れい]の代[か]わりに栄光の衣[ころも]を与[あた]えるために。そして、彼らは義[ぎ]の世代[せだい]たち、主[しゅ]の栄光のための植[う]え付[つ]けと呼[よ]ばれる。"
  4: "彼[かれ]らは永遠[えいえん]の荒[あ]れ地[ち]を建[きず]き、昔[むかし]荒[あ]れ果[は]てた所[ところ]を起[お]こす。彼らは、代[よ]々[よ]のまま荒れ果てていた町[まち]々[まち]を新[あら]たにする。"
  5: "そして、異国[いこく]の者[もの]たちが来[き]てあなたの羊[ひつじ]を飼[か]い、異民族[いみんぞく]の者たちが、あなたの農夫[のうふ]、ぶどうを作[つく]る者となる。"
  6: "しかし、あなたがたは主[しゅ]の祭司[さいし]と呼ばれ、神[かみ]の仕[つか]え手[て]と呼ばれる。あなたがたにはこう言[い]われる。あなたがたは諸国[しょこく]の力[ちから]を食[く]らう。彼らの富[とみ]によって、あなたがたはほめたたえられる。"
  7: "こうして、彼[かれ]らは二度[にど]目[め]に地[ち]を嗣業[しぎょう]として受[う]け取[と]り、永遠[えいえん]の喜[よろこ]びが彼らの頭[あたま]の上[うえ]にある。」"
  8: "「わたしは主[しゅ]であり、義[ぎ]を愛[あい]し、不正[ふせい]による奪[うば]い取[と]りを憎[にく]む者である。わたしは彼らの労苦[ろうく]を正[ただ]しい者[もの]たちに与[あた]え、彼らと永遠[えいえん]の契約[けいやく]を結[むす]ぶ。"
  9: "彼らの子孫[しそん]とその子[こ]らは諸国[しょこく]の間[あいだ]で知[し]られ、すべて彼らを見[み]る者[もの]は彼らを認[みと]める。彼らは神[かみ]によって祝福[しゅくふく]された子孫だからである。」"
  10: "「彼らは喜[よろこ]びにあふれて主[しゅ]にあって喜ぶ。わたしの魂[たましい]よ、主にあって喜[よろこ]び躍[おど]れ。主はわたしに救[すく]いの衣[ころも]を着[き]せ、喜びの衣をまとわせ、花婿[はなむこ]のようにわたしに冠[かんむり]をかぶらせ、花嫁[はなよめ]のようにわたしを飾[かざ]りで装[よそお]われたからである。"
  11: "地[ち]がその花[はな]を咲[さ]かせ、園[その]がその種[たね]を芽生[めば]えさせるように、主[しゅ]はすべての国[くに]々[ぐに]の前[まえ]で義[ぎ]と喜[よろこ]びを芽生えさせられる。」"

notes:
  1: "Πνεῦμα κυρίου ἐπ᾽ ἐμέ — «Дух Господень на мне»; οὗ εἵνεκεν — «ради чего, потому что»; ἔχρισέν με — «помазал меня» (χρίω). εὐαγγελίσασθαι πτωχοῖς ἀπέσταλκέν με — «благовествовать нищим послал меня» (perfect ἀπέσταλκεν). ἰάσασθαι τοὺς συντετριμμένους τῇ καρδίᾳ — «исцелять сокрушённых сердцем» (συντρίβω — сокрушать). κηρύξαι αἰχμαλώτοις ἄφεσιν — «проповедовать пленным отпущение» (αἰχμάλωτος — пленный; ἄφεσις — отпущение, освобождение); τυφλοῖς ἀνάβλεψιν — «слепым прозрение» (ἀνάβλεψις — прозрение). Стих цитируется в Лк 4:18–19; переведено с LXX буквально, порядок инфинитивов сохранён. У Син. «и узникам открытие темницы» — по МТ, в LXX и слав. этого нет, в текст не внесено."
  2: "καλέσαι ἐνιαυτὸν κυρίου δεκτόν — «наречь год Господень приятный» (δεκτός — приемлемый, благоприятный); в Лк 4:19 — 主の喜ばしい年. ἡμέραν ἀνταποδόσεως — «день воздаяния» (ἀνταπόδοσις — воздаяние, возмездие). Син. «день мщения Бога нашего» — по МТ; в LXX и слав. только «день воздаяния», в текст не внесено. παρακαλέσαι πάντας τοὺς πενθοῦντας — «утешить всех плачущих» (πενθέω — плакать, скорбеть)."
  3: "δοθῆναι — «дать» (пассив, продолжение ряда инфинитивов от 61:1). δόξαν ἀντὶ σποδοῦ — «славу вместо пепла» (σποδός — пепел). ἄλειμμα εὐφροσύνης — «помазание веселия» (ἄλειμμα — мазь, елей); καταστολὴν δόξης — «одеяние славы» (καταστολή — одежда, убор). πνεῦμα ἀκηδίας — «дух уныния» (ἀκηδία — подавленность, беспечность; в тексте 沈み). γενεαὶ δικαιοσύνης — «роды правды»; φύτευμα κυρίου — «насаждение Господне» (φύτευμα — посаженное)."
  4: "ἐρήμους αἰωνίας — «пустыни вечные» (αἰώνιος — вечный, здесь: издревле пустующие). ἐξηρημωμένας πρότερον ἐξαναστήσουσιν — «запустевшие прежде воздвигнут» (ἐξαναστήσω — поднять, восстановить). καινιοῦσιν — «обновят» (καινόω). πόλεις ἐρήμους ἐξηρημωμένας εἰς γενεάς — «города пустые, опустошённые в роды»."
  5: "ἀλλογενεῖς — «инородцы» (ἀλλογενής — чужого рода); ἀλλόφυλοι — «иноплеменники». В 1 Цар ἀλλόφυλοι передаётся как ペリシテ人, но здесь слово стоит в параллель к ἀλλογενεῖς и означает вообще чужие народы, поэтому 異民族 (у Син. «сыновья чужестранцев»). ἀροτῆρες — «оратаи, пахари» (ἀροτήρ); ἀμπελουργοί — «виноградари» (ἀμπελουργός)."
  6: "ἱερεῖς κυρίου κληθήσεσθε — «священниками Господними наречётесь»; λειτουργοὶ θεοῦ — «служители Божии» (λειτουργός). Слав. добавляет «речется вам» — в LXX этих слов нет, внесено в основной текст без 〔…〕 (передано «あなたがたにはこう言われる»). ἰσχὺν ἐθνῶν κατέδεσθε — «крепость народов снесте» (κατεσθίω — съедать); ἐν τῷ πλούτῳ αὐτῶν θαυμασθήσεσθε — «в богатстве их дивны будете» (θαυμάζω — дивиться, изумляться; слав. «чудни будете»)."
  7: "οὕτως ἐκ δευτέρας κληρονομήσουσιν τὴν γῆν — «так, во второй раз наследуют землю» (ἐκ δευτέρας — во второй раз; слав. «вторицею»). εὐφροσύνη αἰώνιος ὑπὲρ κεφαλῆς αὐτῶν — «веселие вечное над главою их». Син. «за посрамление вам будет вдвое» — по МТ, в LXX и слав. иначе, в текст не внесено."
  8: "ἐγὼ γάρ εἰμι κύριος ὁ ἀγαπῶν δικαιοσύνην — «ибо Я Господь, любящий правду»; μισῶν ἁρπάγματα ἐξ ἀδικίας — «ненавидящий грабления от неправды» (ἅρπαγμα — похищенное, грабёж). δώσω τὸν μόχθον αὐτῶν δικαίοις — «дам труд их праведникам» (μόχθος — тяжёлый труд); διαθήκην αἰώνιον διαθήσομαι αὐτοῖς — «завет вечный завещаю им»."
  9: "γνωσθήσεται ἐν τοῖς ἔθνεσιν τὸ σπέρμα αὐτῶν — «известно будет в народах семя их»; τὰ ἔκγονα αὐτῶν — «потомство их» (ἔκγονος — рождённый, потомок). πᾶς ὁ ὁρῶν αὐτοὺς ἐπιγνώσεται — «всякий видящий их узнает» (ἐπιγινώσκω). σπέρμα ηὐλογημένον ὑπὸ θεοῦ — «семя, благословенное Богом». Слав. в конце стиха добавляет «и радостию возрадуются о Господе» — это начало гр. 61:10; деление иное, держим gr."
  10: "καὶ εὐφροσύνῃ εὐφρανθήσονται ἐπὶ κύριον — «и радостию возрадуются о Господе» (3 л. мн.; у слав. отнесено к концу 61:9). Знак «—» после κύριον в гр. — редакторская помета, в текст не перенесён. ἀγαλλιάσθω ἡ ψυχή μου — «да возрадуется душа моя» (императив 3 л., передан звательно-повелительно). ἱμάτιον σωτηρίου — «риза спасения»; χιτῶνα εὐφροσύνης — «одежда веселия» (χιτών — хитон, нижняя одежда; в тексте тоже 衣). ὡς νυμφίῳ περιέθηκέν μοι μίτραν — «как жениху, возложил на меня венец» (μίτρα — головная повязка); ὡς νύμφην κατεκόσμησέν με κόσμῳ — «как невесту, украсил меня украшением»."
  11: "ὡς γῆν αὔξουσαν τὸ ἄνθος αὐτῆς — «как землю, произращающую цвет свой» (αὔξω — растить); ὡς κῆπος τὰ σπέρματα αὐτοῦ — «как сад семена свои» (κῆπος — сад). ἀνατελεῖ κύριος δικαιοσύνην — «произрастит Господь правду» (ἀνατέλλω — произращать, восходить); ἀγαλλίαμα — «ликование, радость». Слав. удваивает «Господь, Господь»; держим LXX (одно κύριος)."
