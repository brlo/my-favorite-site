# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 61: 1–3 Дух Господень на помазаннике: благовестие нищим, исцеление
# сокрушённых сердцем, отпущение пленным, прозрение слепым, год Господень и день
# воздаяния, пепел и елей, слава и дух уныния; 4–7 восстановление вечных пустынь,
# иноземцы-пастухи и виноградари, священство Господне, двойное наследие и вечное
# веселие; 8–9 Господь любит правду, завет вечный, благословенное семя; 10–11
# радость о Господе, ризы спасения, жених и невеста, произрастание правды.
# Голоса: 1–7 речь помазанника от 1-го лица (в церковном чтении — Христос;
# цит. Лк 4:18–19) — 「…」; 8–9 речь Господа — 「…」 (вводной формулы в LXX нет);
# 10–11 речь пророка/общины — 「…」.
# Нумерация по gr: 11 стихов. У csl тоже 11, но слав. относит начало гр. 61:10
# («и радостию возрадуются о Господе») к концу своего 61:9 — держим деление gr.
# 〔…〕 нет: все стихи есть в gr-lxx-byz. 61:1–2 переведено с LXX буквально;
# масоретские добавки Синодального («узникам открытие темницы», «день мщения
# Бога нашего») в текст не внесены — notes. Слав. добавление 61:6 «речется вам»
# (нет в LXX) внесено в основной текст без 〔…〕. Знак «—» в гр. 61:10 —
# редакторская помета, в текст не перенесён.
# Сносок ⟨…⟩ нет: 灰, 油, 冠, 花婿, 花嫁, 嗣業, 祭司 уже в корпусе.
# Имена — транслитерация греческого (LXX): シオン (Σιων).

