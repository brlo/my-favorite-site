# jp-box, 1-я Паралипоменон, глава 27. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); церковнославянский (csl-ru) — второй
# свидетель церковного текста (новый паритет, docs/japanese-bible.md):
# слав. чтения и добавки входят в основной текст без 〔…〕, вариант LXX — в notes.
# ru (Синодальный) — только для понимания, не источник. jp-joc нет;
# jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 27: войско по месяцам (1–15), начальники колен (16–22), предел переписи
# (23–24), надзиратели над имениями (25–31), советники Давида (32–34).
# Прямой речи нет. Имена — по LXX (база), слав. варианты — в notes; слав.
# добавления (27:4 «Макеллоф», 27:24 «гнев Божий») внесены в основной текст.
# 〔…〕 нет: все стихи есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 契約, 嗣業, 会衆, 部族, 祭司, 宝物 уже в корпусе. Красного нет.

