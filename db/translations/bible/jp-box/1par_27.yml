verses:
  1: "イスラエルの子[こ]らは、その数[かず]に従[したが]って、氏族[しぞく]の長[かしら]たち、千人隊長[せんにんたいちょう]たち、百人隊長[ひゃくにんたいちょう]たち、王[おう]に仕[つか]える書記[しょき]たちであった。彼[かれ]らは組[くみ]ごとに、月[つき]から月へと、年[とし]のすべての月にわたって交替[こうたい]しながら、王のすべての事柄[ことがら]に当[あ]たった。一[ひと]つの組は二万四千人[にまんよんせんにん]であった。"
  2: "第一[だいいち]の月[つき]の第一の組[くみ]を率[ひき]いたのは、ザブディエルの子[こ]イエスボアムであり、その組には二万四千人[にまんよんせんにん]がいた。"
  3: "彼[かれ]はファレスの子[こ]らに属[ぞく]し、第一[だいいち]の月[つき]のすべての軍[ぐん]の長[ちょう]たちの上[うえ]に立[た]つ者[もの]であった。"
  4: "第二[だいに]の月[つき]の組[くみ]を率[ひき]いたのは、エホヒ人[びと]ドダイであった。その組には長[かしら]ミクロトもいて、軍[ぐん]の長[ちょう]たちからなる二万四千人[にまんよんせんにん]がいた。"
  5: "第三[だいさん]の月[つき]の組[くみ]を率[ひき]いたのは、祭司[さいし]で長[かしら]であるヨヤダの子[こ]ベナヤであり、その組には二万四千人[にまんよんせんにん]がいた。"
  6: "このベナヤは三十人[さんじゅうにん]のうちで最[もっと]も強[つよ]く、三十人の上[うえ]に立[た]っていた。彼[かれ]の組[くみ]には、その子[こ]アミザバドがいた。"
  7: "第四[だいよん]の月[つき]の組[くみ]を率[ひき]いたのは、ヨアブの兄弟[きょうだい]アサエル、およびその子[こ]ザブディアと兄弟[きょうだい]たちであり、その組には二万四千人[にまんよんせんにん]がいた。"
  8: "第五[だいご]の月[つき]の組[くみ]を率[ひき]いたのは、イエスラエ人[びと]サマオトであり、その組には二万四千人[にまんよんせんにん]がいた。"
  9: "第六[だいろく]の月[つき]の組[くみ]を率[ひき]いたのは、テコア人[びと]オドゥイア、エッカの子[こ]であり、その組には二万四千人[にまんよんせんにん]がいた。"
  10: "第七[だいしち]の月[つき]の組[くみ]を率[ひき]いたのは、エフライムの子[こ]らに属[ぞく]するファルス出身[しゅっしん]のヘレスであり、その組には二万四千人[にまんよんせんにん]がいた。"
  11: "第八[だいはち]の月[つき]の組[くみ]を率[ひき]いたのは、ザラの氏族[しぞく]に属[ぞく]するフシャ人[びと]ソボハイであり、その組には二万四千人[にまんよんせんにん]がいた。"
  12: "第九[だいきゅう]の月[つき]の組[くみ]を率[ひき]いたのは、ベニヤミンの地[ち]のアナトト出身[しゅっしん]のアビエゼルであり、その組には二万四千人[にまんよんせんにん]がいた。"
  13: "第十[だいじゅう]の月[つき]の組[くみ]を率[ひき]いたのは、ザラの氏族[しぞく]に属[ぞく]するネトファ出身[しゅっしん]のメイラであり、その組には二万四千人[にまんよんせんにん]がいた。"
  14: "第十一[だいじゅういち]の月[つき]の組[くみ]を率[ひき]いたのは、エフライムの子[こ]らに属[ぞく]するピラトン出身[しゅっしん]のベナヤであり、その組には二万四千人[にまんよんせんにん]がいた。"
  15: "第十二[だいじゅうに]の月[つき]の組[くみ]を率[ひき]いたのは、ゴトニエルの氏族[しぞく]に属[ぞく]するネトファ人[びと]ホルダイであり、その組には二万四千人[にまんよんせんにん]がいた。"
  16: "イスラエルの部族[ぶぞく]の上[うえ]には次[つぎ]の者[もの]たちがいた。ルベンにはゼクリの子[こ]エリエゼル、シメオンにはマアハの子[こ]サファティア。"
  17: "レビにはカムエルの子[こ]アサビア、アロンにはサドク。"
  18: "ユダにはダビデの兄弟[きょうだい]の一人[ひとり]エリアブ、イッサカルにはミカエルの子[こ]アムリ。"
  19: "ゼブルンにはアブディの子[こ]サマイア、ナフタリにはエスリエルの子[こ]イエリモト。"
  20: "エフライムにはウジヤの子[こ]オシア、マナセの半部族[はんぶぞく]にはファダイの子[こ]ヨエル。"
  21: "ギレアデのマナセの半部族[はんぶぞく]にはザブディの子[こ]ヤダイ、ベニヤミンの子[こ]らにはアブネルの子[こ]アシエル。"
  22: "ダンにはヨラムの子[こ]アザラエル。これらはイスラエルの部族[ぶぞく]の族長[ぞくちょう]たちである。"
  23: "ダビデは二十歳[にじゅっさい]以下[いか]の者[もの]の数[かず]を取[と]らなかった。主[しゅ]がイスラエルを天[てん]の星[ほし]のように増[ふ]やすと言[い]われたからである。"
  24: "ツルヤの子[こ]ヨアブは民[たみ]の数[かず]を数[かぞ]え始[はじ]めたが、終[お]えることができなかった。このことによってイスラエルに神[かみ]の怒[いか]りが下[くだ]り、その数はダビデ王[おう]の日[ひ]々[び]の言葉[ことば]の書[しょ]に記[しる]されなかった。"
  25: "王[おう]の宝物[たからもの]を管理[かんり]したのはオディエルの子[こ]アスモト、野[の]や村[むら]や集落[しゅうらく]や塔[とう]にある宝物を管理したのはウジヤの子[こ]ヨナタン。"
  26: "土地[とち]を耕[たがや]す者[もの]、すなわち農夫[のうふ]たちの上[うえ]にはヘルブの子[こ]エズリがいた。"
  27: "畑[はたけ]を管理[かんり]したのはラマ出身[しゅっしん]のシメイ、畑のぶどう酒[しゅ]の宝物[たからもの]を管理したのはセフニの子[こ]ザクリ。"
  28: "低地[ていち]のオリーブと桑[くわ]の木[き]を管理[かんり]したのはゲドル人[びと]バラナン、油[あぶら]の宝物[たからもの]を管理したのはヨアス。"
  29: "シャロンで放牧[ほうぼく]される牛[うし]を管理[かんり]したのはシャロン人[びと]サトライ、谷々[たにだに]の牛を管理したのはアドリの子[こ]ソファト。"
  30: "らくだを管理[かんり]したのはイシュマエル人[びと]オビル、ろばを管理したのはメラトン出身[しゅっしん]のヤディア。"
  31: "羊[ひつじ]を管理[かんり]したのはアガル人[びと]ヤジズ。これらは皆[みな]、ダビデ王[おう]の財産[ざいさん]の監督[かんとく]たちであった。"
  32: "ダビデの叔父[おじ]ヨナタンは顧問[こもん]であり、知恵[ちえ]ある人[ひと]で書記[しょき]でもあった。アハマニの子[こ]イエヒエルは王[おう]の子[こ]たちとともにいた。"
  33: "アヒトフェルは王[おう]の顧問[こもん]、フシャイは王の第一[だいいち]の友[とも]であった。"
  34: "その後[のち]、アヒトフェルに次[つ]いで、ベナヤの子[こ]ヨヤダとアビアタルがいた。ヨアブは王[おう]の軍[ぐん]の長[ちょう]であった。"

notes:
  1: "κατ᾽ ἀριθμὸν αὐτῶν — по числу их; ἄρχοντες τῶν πατριῶν — главы отечеств (氏族の長); χιλίαρχοι καὶ ἑκατόνταρχοι — тысяченачальники и стоначальники; γραμματεῖς — писцы (слав. «книгочии»); οἱ λειτουργοῦντες τῷ λαῷ — служащие народу, слав. «служащии царю» — в тексте по csl (王に仕える), вариант LXX в notes. κατὰ διαιρέσεις — по отделениям (組); εἰσπορευομένου καὶ ἐκπορευομένου — входящего и исходящего, т.е. сменяющегося; διαίρεσις μία — одно отделение, 24 000."
  2: "Ιεσβοαμ ὁ τοῦ Ζαβδιηλ — Иесвоам, сын Завдиила (тот же, что в 1 Пар 11:11; слав. «извоаз»). ἐπὶ τῆς διαιρέσεως — над отделением (組を率いる)."
  3: "ἀπὸ τῶν υἱῶν Φαρες — из сынов Фареса; ἄρχων πάντων τῶν ἀρχόντων τῆς δυνάμεως — главный над всеми начальниками войска; у csl «началник всем князем воинства»."
  4: "Δωδια ὁ Εχωχι — Додай Ехохитянин (ср. 2 Цар 23:9). Слав. добавляет «и макеллоф вождь» (Миклоф, по МТ) — внесено в основной текст; в LXX этого имени нет. ἄρχοντες δυνάμεως — начальники войска."
  5: "ὁ ἱερεὺς ὁ ἄρχων — священник, начальствующий (слав. «иже священник началный»); Ванея, сын Иодая (ヨヤダ, как в 3 Цар). τρίτος τὸν μῆνα τὸν τρίτον — третий на третий месяц."
  6: "δυνατώτερος τῶν τριάκοντα — сильнейший из тридцати (в 2 Цар 23:22–23 — «между тремя»); ἐπὶ τῶν τριάκοντα — над тридцатью. Αμιζαβαθ — Амизавад (слав. «завад») — в тексте по LXX, слав. вариант в notes."
  7: "Ασαηλ ὁ ἀδελφὸς Ιωαβ — Асаил, брат Иоава (アサエル, ср. 2 Цар 2:18); Ζαβδιας — Завдия; καὶ οἱ ἀδελφοί — и братья. У csl «в полце его» для διαίρεσις."
  8: "Σαμαωθ ὁ Ιεσραε — Самаоф Иесрае (вероятно, из Изрееля; в ru «Шамгуф Израхитянин» — иное); ὁ ἡγούμενος — начальствующий."
  9: "Οδουιας ὁ τοῦ Εκκης ὁ Θεκωίτης — Одуия, сын Екки, фекоитянин (テコア人); в ru и МТ здесь Ира, сын Иккеша (ср. 2 Цар 23:26 «テコア人イラ、エッカの子»), в LXX и csl — Одуия; Θεκωίτης — фекоитянин."
  10: "Χελλης ὁ ἐκ Φαλλους — Хелес из Фаллуса (слав. «хеллис»; в ru «Хелец Пелонитянин», ср. 2 Цар 23:26, где то же лицо — エレス); ἀπὸ τῶν υἱῶν Εφραιμ — из сынов Ефрема."
  11: "Σοβοχαι — Совахай (ソボハイ); ὁ Ισαθι — тёмное слово, слав. «усафитянин», т.е. хушатянин (フシャ人, ср. 1 Пар 11:29); τῷ Ζαραι — из рода Зары. В 2 Цар 23:27 то же лицо — サブハイ."
  12: "Αβιεζερ ὁ ἐξ Αναθωθ — Авиезер из Анафофа (アナトト人, ср. 2 Цар 23:27); ἐκ γῆς Βενιαμιν — из земли Вениамина (в ru «из сыновей Вениаминовых»)."
  13: "Μεηρα ὁ ἐκ Νετουφατ τῷ Ζαραι — Меира из Нетофата, из рода Зары (в ru «Магарай»; ср. 2 Цар 23:28, где то же лицо — モオレ); у csl «меирай... от колена зараина»."
  14: "Βαναιας ὁ ἐκ Φαραθων — Ванея Пирафонянин (ピラトン人ベナヤ, ср. 2 Цар 23:30); τῶν υἱῶν Εφραιμ — из сынов Ефрема."
  15: "Χολδαι ὁ Νετωφατι τῷ Γοθονιηλ — Холдай Нетофатитянин, из рода Гофониила (ゴトニエル, ср. 1 Пар 4:13); слав. «холдиа»."
  16: "ἐπὶ τῶν φυλῶν Ισραηλ — над коленами Израиля; ἡγούμενος — вождь (長). Ελιεζερ ὁ τοῦ Ζεχρι — Елиезер, сын Зехрия; Σαφατιας ὁ τοῦ Μααχα — Сафатия, сын Маахи."
  17: "Ασαβιας ὁ τοῦ Καμουηλ — Асавия, сын Камуила; τῷ Ααρων Σαδωκ — у Аарона Садок, т.е. первосвященник."
  18: "Ελιαβ τῶν ἀδελφῶν Δαυιδ — Елиав из братьев Давида (старший брат, 1 Цар 16:6; エリアブ); Αμβρι ὁ τοῦ Μιχαηλ — Амврий, сын Михаила."
  19: "Σαμαιας ὁ τοῦ Αβδιου — Самаия, сын Авдия; Ιεριμωθ ὁ τοῦ Εσριηλ — Иеримоф, сын Есриила."
  20: "Ωση ὁ τοῦ Οζιου — Осия, сын Озии (слав. «осий, сын озазиев»; в ru «Осия, сын Азазии»); τῷ ἡμίσει φυλῆς Μανασση — половине колена Манассии (半部族); Ιωηλ ὁ τοῦ Φαδαια — Иоиль, сын Фадаи."
  21: "Ιαδδαι ὁ τοῦ Ζαβδιου — Иаддай, сын Завдия, в Галааде; Ασιηλ ὁ τοῦ Αβεννηρ — Асиил, сын Авенира (アブネル; слав. «иасиил»)."
  22: "Αζαραηλ ὁ τοῦ Ιωραμ — Азариил, сын Иорама; πατριάρχαι τῶν φυλῶν — родоначальники (族長) колен."
  23: "ἀπὸ εἰκοσαετοῦς καὶ κάτω — от двадцатилетнего и ниже; πληθῦναι τὸν Ισραηλ ὡς τοὺς ἀστέρας — умножить Израиля, как звёзды (ср. Быт 15:5). Слав. «не хоте... счести» — иная передача οὐκ ἔλαβεν (не взял числа)."
  24: "ἤρξατο ἀριθμεῖν... καὶ οὐ συνετέλεσεν — начал считать и не окончил; ὀργὴ ἐπὶ τὸν Ισραηλ — гнев на Израиля; слав. добавляет «Божий» — внесено (神の怒り). οὐ κατεχωρίσθη — не было внесено; βιβλίῳ λόγων τῶν ἡμερῶν — книга словес дней, т.е. летопись."
  25: "θησαυρῶν — сокровищ (宝物); ἐν ἀγρῷ καὶ ἐν ταῖς κώμαις καὶ ἐν τοῖς ἐποικίοις καὶ ἐν τοῖς πύργοις — в поле, в селах, в поселениях и в башнях. Ασμωθ ὁ τοῦ Ωδιηλ — Асмоф, сын Одиила; Ιωναθαν ὁ τοῦ Οζιου — Ионафан, сын Озии."
  26: "τῶν γεωργούντων τὴν γῆν τῶν ἐργαζομένων — возделывающих землю, земледельцев; Εσδρι ὁ τοῦ Χολουβ — Езрий, сын Хелува."
  27: "Σεμει ὁ ἐκ Ραμα — Семей из Рамы (слав. «армафейский», т.е. из Арамафы); Ζαχρι ὁ τοῦ Σεφνι — Захрий, сын Сефния (слав. «замвдиа» — иное имя)."
  28: "ἐλαιώνων — масличных рощ; συκαμίνων — тутовых (桑); ἐν τῇ πεδινῇ — в низменности (低地); Βαλανας ὁ Γεδωρίτης — Валанан Гедорец; θησαυρῶν τοῦ ἐλαίου — запасов масла (油)."
  29: "βοῶν τῶν νομάδων — кочующего, пасущегося скота; ἐν τῷ Ασιδων — в Асидоне, слав. «в сароне» (Шарон) — в тексте シャロン. Σατραις ὁ Σαρωνιτης — Сатрай Саронянин; Σωφατ ὁ τοῦ Αδλι — Софат, сын Адли (слав. «адаин»)."
  30: "Ωβιλ ὁ Ισμαηλίτης — Овил Исмаильтянин; Ιαδιας ὁ ἐκ Μεραθων — Иадия из Мерафона (слав. «от марафона»)."
  31: "Ιαζιζ ὁ Αγαρίτης — Иазиз Агаритянин (слав. «иоас агаритин» — иное имя); προστάται ὑπαρχόντων — начальники имений (財産の監督)."
  32: "Ιωναθαν ὁ πατράδελφος Δαυιδ — Ионафан, дядя Давида (брат отца); σύμβουλος, ἄνθρωπος συνετὸς καὶ γραμματεύς — советник, человек разумный и книжник; Ιιηλ ὁ τοῦ Αχαμανι — Иехиил, сын Ахамани; μετὰ τῶν υἱῶν τοῦ βασιλέως — при сыновьях царя."
  33: "Αχιτοφελ σύμβουλος — Ахитофел, советник (アヒトフェル); Χουσι πρῶτος φίλος — Хусий, первый друг (フシャイ; придворный титул, слав. «первейший друг»)."
  34: "μετὰ τοῦτον... ἐχόμενος — после него, следующий за Ахитофелом; Ιωδαε ὁ τοῦ Βαναιου — Иодай, сын Ванеи (здесь обратный порядок: сын того Ванеи); ἀρχιστράτηγος — главный военачальник (軍の長)."
