verses:
  1: "ベニヤミンの子[こ]らのうちに、力[ちから]ある男[おとこ]がいた。名[な]はキスといい、アビエルの子[こ]、サレドの子、バキルの子、アフェクの子、すなわちベニヤミン人[じん]の男[おとこ]の子[こ]であった。"
  2: "彼[かれ]には息子[むすこ]がいて、名[な]をサウルといった。大[おお]きな体[からだ]の立派[りっぱ]な男[おとこ]で、イスラエルの子[こ]らのうちに彼[かれ]より立派な者[もの]はいなかった。彼[かれ]は民[たみ]全体[ぜんたい]よりも、肩[かた]から上[うえ]が高[たか]かった。"
  3: "サウルの父[ちち]キスの雌[めす]ろばが迷[まよ]い出[で]た。キスは息子[むすこ]サウルに言[い]った。「若者[わかもの]の一人[ひとり]を連[つ]れて、立[た]って、雌ろばを探[さが]しに行[い]きなさい。」"
  4: "彼[かれ]はエフライムの山地[さんち]を通[とお]り、セルハの地[ち]を通ったが、見[み]つからなかった。エアサケムの地を通ったが、そこにはいなかった。ヤキムの地を通ったが、見つからなかった。"
  5: "彼[かれ]らがツフの地[ち]へ来[き]たとき、サウルはともにいる若者[わかもの]に言[い]った。「さあ、引[ひ]き返[かえ]そう。父[ちち]が雌[めす]ろばのことをあきらめて、わたしたちのことを案[あん]じているといけないから。」"
  6: "若者[わかもの]は彼[かれ]に言[い]った。「この町[まち]には神[かみ]の人[ひと]がいる。その人[ひと]は名[な]の高[たか]い人で、彼[かれ]が語[かた]ることは何[なん]でも必[かなら]ずそのとおりになる。さあ、そこへ行[い]こう。わたしたちの歩[あゆ]むべき道[みち]を、彼が告[つ]げてくれるかもしれない。」"
  7: "サウルはともにいる若者[わかもの]に言[い]った。「だが、行[い]くとして、あの神[かみ]の人[ひと]に何[なに]を持[も]って行[い]こうか。わたしたちの袋[ふくろ]のパンは尽[つ]きてしまい、神の人に差[さ]し出[だ]せる物[もの]が、もう手[て]もとにはない。」"
  8: "若者[わかもの]はさらに答[こた]えてサウルに言[い]った。「見[み]よ、わたしの手[て]には銀[ぎん]一[いち]シケルの四分[しぶん]がある。これを神[かみ]の人[ひと]に渡[わた]そう。そうすれば、わたしたちの道[みち]を告[つ]げてくれる。」"
  9: "かつてイスラエルでは、だれかが神[かみ]に尋[たず]ねに行[い]くとき、それぞれこう言[い]った。「さあ、先見者[せんけんしゃ]のところへ行[い]こう」と。今[いま]預言者[よげんしゃ]と呼[よ]ばれている者[もの]を、昔[むかし]は先見者と呼んだからである。"
  10: "サウルは若者[わかもの]に言[い]った。「良[よ]いことを言[い]う。さあ、行[い]こう。」二人[ふたり]は神[かみ]の人[ひと]のいる町[まち]へ向[む]かった。"
  11: "彼[かれ]らが町[まち]の上[のぼ]り坂[ざか]を上っていると、水[みず]を汲[く]みに出[で]て来[き]た娘[むすめ]たちに会[あ]った。彼[かれ]らは娘たちに言[い]った。「先見者[せんけんしゃ]はここにいるか。」"
  12: "娘[むすめ]たちは答[こた]えて言[い]った。「いる。見[み]よ、あなたがたの前[まえ]にいる。今[いま]、この日[ひ]のために彼[かれ]は町[まち]へ来[き]ている。今日[きょう]、民[たみ]のために高[たか]き所[ところ]でいけにえがあるからだ。"
  13: "あなたがたが町[まち]へ入[はい]ると、彼[かれ]が食[た]べるために高[たか]き所[ところ]へ上[のぼ]る前[まえ]に、町で彼に会[あ]える。民[たみ]は彼が来[く]るまで食[た]べないからだ。彼[かれ]がいけにえを祝[いわ]い、その後[のち]で招[まね]かれた者[もの]たちが食[た]べる。だから、今[いま]、上[のぼ]って行[い]きなさい。今日[きょう]のうちに彼に会える。」"
  14: "彼[かれ]らは町[まち]へ上[のぼ]って行[い]った。彼らが町の中[なか]へ入[はい]ろうとしたとき、見[み]よ、サムエルが高[たか]き所[ところ]へ上るために、彼らを迎[むか]えに出[で]て来[き]た。"
  15: "主[しゅ]は、サウルが来[く]る前[まえ]の日[ひ]に、サムエルの耳[みみ]を開[ひら]いて言[い]われた。"
  16: "「明日[あす]のこのころ、わたしはベニヤミンの地[ち]から一人[ひとり]の男[おとこ]をあなたのもとへ遣[つか]わす。あなたは彼[かれ]に油[あぶら]を注[そそ]いで、わたしの民[たみ]イスラエルの上[うえ]の指導者[しどうしゃ]としなさい。彼[かれ]はわたしの民をペリシテ人[じん]の手[て]から救[すく]う。わたしの民の虐[しいた]げに目[め]を留[と]めたからだ。彼[かれ]らの叫[さけ]びがわたしに届[とど]いたからである。」"
  17: "サムエルがサウルを見[み]ると、主[しゅ]は彼[かれ]に答[こた]えて言[い]われた。「見[み]よ、この人[ひと]こそ、わたしがあなたに言った者[もの]である。この者[もの]がわたしの民[たみ]を治[おさ]める。」"
  18: "サウルは町[まち]の真[ま]ん中[なか]でサムエルに近[ちか]づき、言[い]った。「先見者[せんけんしゃ]の家[いえ]がどこか、教[おし]えてください。」"
  19: "サムエルはサウルに答[こた]えて言[い]った。「わたしがその者[もの]だ。わたしの前[まえ]を先[さき]にして高[たか]き所[ところ]へ上[のぼ]り、今日[きょう]はわたしとともに食[た]べなさい。朝[あさ]にはあなたを送[おく]り出[だ]し、あなたの心[こころ]にあることをすべて告[つ]げよう。"
  20: "雌[めす]ろばのことは、今日[きょう]で三[みっ]日[か]になるが、心[こころ]にかけることはない。見[み]つかったからだ。それに、イスラエルのすべてもろもろの望[のぞ]ましいものは、だれのものか。あなたと、あなたの父[ちち]の家[いえ]のものではないか。」"
  21: "サウルは答[こた]えて言[い]った。「わたしはベニヤミン人[じん]の男[おとこ]の子[こ]にすぎない。イスラエルの部族[ぶぞく]のうちの小[ちい]さな部族、ベニヤミンの部族のうちでも最も小[ちい]さい氏族[しぞく]の者[もの]だ。なぜ、このようなことをわたしに言[い]うのか。」"
  22: "サムエルはサウルとその若者[わかもの]を連[つ]れて来[き]て、客間[きゃくま]へ導[みちび]き入[い]れ、招[まね]かれた者[もの]たちの上座[かみざ]に彼[かれ]らの席[せき]を置[お]いた。それはおよそ七十人[ななじゅうにん]であった。"
  23: "サムエルは料理人[りょうりにん]に言[い]った。「わたしがあなたに渡[わた]し、あなたのところに取[と]っておくようにと言った、あの部分[ぶぶん]をわたしに持[も]って来[き]なさい。」"
  24: "料理人[りょうりにん]は腿[もも]の肉[にく]を取[と]り上[あ]げて、サウルの前[まえ]に置[お]いた。サムエルはサウルに言[い]った。「見[み]よ、これは取っておいたものだ。あなたの前に置[お]いて、切[き]り分[わ]けて食[た]べなさい。ほかの者[もの]たちを差[さ]し置[お]いて、あなたのために証[あかし]として用意[ようい]されたものだから。」そして、サウルはその日[ひ]、サムエルとともに食[た]べた。"
  25: "そして、高[たか]き所[ところ]から町[まち]へ下[くだ]った。彼[かれ]らはサウルのために屋上[おくじょう]に床[とこ]を敷[し]いた。"
  26: "サウルは眠[ねむ]った。夜明[よあ]けが上[のぼ]ると、サムエルは屋上[おくじょう]にいるサウルを呼[よ]んで言[い]った。「立[た]ちなさい。わたしがあなたを送[おく]り出[だ]そう。」サウルは立[た]ち、二人[ふたり]は外[そと]へ出[で]た。"
  27: "彼[かれ]らが町[まち]の端[はし]へ下[くだ]って行[い]くとき、サムエルはサウルに言[い]った。「あの若者[わかもの]に、わたしたちの先[さき]を行[い]くように言[い]いなさい。あなたは今日[きょう]のように、ここに立[た]っていなさい。神[かみ]の言葉[ことば]を聞[き]きなさい。」"

notes:
  1: "ἦν ἀνὴρ ἐξ υἱῶν Βενιαμιν — был муж из сынов Вениамина. Κις υἱὸς Αβιηλ υἱοῦ Σαρεδ … — родословие: Кис, сын Авиила, сына Сареда, сына Вахира, сына Афека, сына мужа Иеминиева (ἀνδρὸς Ιεμιναίου — мужа Иеминиева, т. е. вениамитянина). ἀνὴρ δυνατός — муж сильный, крепкий (δυνατός; слав. «муж силен крепостию»)."
  2: "εὐμεγέθης ἀνὴρ ἀγαθός — крупного роста, хороший (ἀγαθός здесь о достоинстве и внешности; в ru «молодой и красивый» — по МТ). οὐκ ἦν ἐν υἱοῖς Ισραηλ ἀγαθὸς ὑπὲρ αὐτόν — не было среди сынов Израиля лучше его. ὑπὲρ ὠμίαν καὶ ἐπάνω — выше плеч и выше."
  3: "ἀπώλοντο αἱ ὄνοι — пропали ослицы (ἀπόλλυμι). Λαβὲ μετὰ σεαυτοῦ ἓν τῶν παιδαρίων — возьми с собою одного из слуг (παιδάριον). ἀνάστητε καὶ πορεύθητε — встаньте и идите."
  4: "διῆλθον δι᾽ ὄρους Εφραιμ — прошли через гору Ефремову. Σελχα, Εασακεμ, Ιακιμ — транслитерации LXX; в csl «селха», «сегалим», «иамин», в ru иные названия (Шалиша, Шаалим, Вениаминова). οὐχ εὗρον — не нашли."
  5: "εἰς τὴν Σιφ — в землю Цуф (Σιφ; это не ジフ из 23:14, где греч. Ζιφ). μὴ ἀνεὶς ὁ πατήρ μου τὰς ὄνους φροντίζῃ περὶ ἡμῶν — «как бы отец мой, оставив ослиц, не стал беспокоиться о нас» (ἀνίημι — отпускать)."
  6: "ἄνθρωπος τοῦ θεοῦ — человек Божий (9:6,7,8,10). ἔνδοξος — славный, уважаемый. πᾶν, ὃ ἐὰν λαλήσῃ, παραγινόμενον παρέσται — всё, что он ни скажет, непременно сбудется. τὴν ὁδὸν ἡμῶν — путь наш."
  7: "τί οἴσομεν — что принесём (φέρω, буд. οἴσω). οἱ ἄρτοι ἐκλελοίπασιν ἐκ τῶν ἀγγείων ἡμῶν — хлебы истощились из сосудов наших (ἀγγεῖον). πλεῖον οὐκ ἔστιν … τὸ ὑπάρχον ἡμῖν — больше нет у нас того, что есть; слав. «от имения нашего»."
  8: "τέταρτον σίκλου ἀργυρίου — четверть сикля серебра (σίκλος). προσέθετο … ἀποκριθῆναι — «приложил отвечать», т. е. продолжал отвечать. δώσεις — дашь, отдашь."
  9: "ὁ βλέπων — «видящий», прозорливец (先見者); τὸν προφήτην — пророк. ἔμπροσθεν — прежде. ἐκάλει ὁ λαός — народ называл. Стих объясняет, почему в 9:11–19 спрашивают о «прозорливце»."
  10: "Ἀγαθὸν τὸ ῥῆμα — хорошее слово, хорошо сказано. οὗ ἦν ἐκεῖ ὁ ἄνθρωπος τοῦ θεοῦ — где был человек Божий."
  11: "τὴν ἀνάβασιν τῆς πόλεως — подъём в город. τὰ κορόσια — девицы (κοράσιον). ὑδρεύσασθαι ὕδωρ — начерпать воды (ὑδρεύω)."
  12: "κατὰ πρόσωπον ὑμῶν — перед лицом вашим, т. е. впереди. νῦν διὰ τὴν ἡμέραν ἥκει εἰς τὴν πόλιν — «ныне ради дня он пришёл в город», т. е. сегодня. θυσία σήμερον τῷ λαῷ ἐν Βαμα — сегодня жертва народу на высоте (Βαμα — «высота», 高き所)."
  13: "πρὶν ἀναβῆναι αὐτὸν εἰς Βαμα τοῦ φαγεῖν — прежде чем он взойдёт на высоту есть. οὐ μὴ φάγῃ ὁ λαός — народ не станет есть (усиленное отрицание). οὗτος εὐλογεῖ τὴν θυσίαν — он благословляет жертву. οἱ ξένοι — званые, гости (слав. «страннии»). ἀνάβητε — взойдите."
  14: "αὐτῶν εἰσπορευομένων εἰς μέσον τῆς πόλεως — когда они входили в середину города. εἰς ἀπάντησιν αὐτῶν — навстречу им. τοῦ ἀναβῆναι εἰς Βαμα — чтобы взойти на высоту."
  15: "ἀπεκάλυψεν τὸ ὠτίον Σαμουηλ — открыл ухо Самуилу (образ откровения; ὠτίον — ушко). ἡμέρᾳ μιᾷ ἔμπροσθεν — за один день до."
  16: "Ὡς ὁ καιρὸς αὔριον — «завтра в это время». χρίσεις αὐτὸν εἰς ἄρχοντα — помажешь его в правителя (χρίω; ἄρχων, а не βασιλεύς — слав. «царя»). σώσει τὸν λαόν μου — спасёт народ Мой. ἐπέβλεψα ἐπὶ τὴν ταπείνωσιν — призрел на унижение (ταπείνωσις). βοὴ αὐτῶν — вопль их."
  17: "Οὗτος ἄρξει ἐν τῷ λαῷ μου — этот будет править народом Моим (ἄρχω; слав. «царствовати»). ἀπεκρίθη αὐτῷ — отвечал ему."
  18: "Ἀπάγγειλον δὴ ποῖος ὁ οἶκος τοῦ βλέποντος — скажи же, какой дом у видящего, т. е. где его дом."
  19: "Ἐγώ εἰμι αὐτός — «я — он самый». ἀνάβηθι ἔμπροσθέν μου — взойди передо мной. ἐξαποστελῶ σε πρωΐ — отпущу тебя утром. πάντα τὰ ἐν τῇ καρδίᾳ σου — всё, что на сердце твоём."
  20: "σήμερον τριταίων — «сегодня третий день» (пропали три дня назад). μὴ θῇς τὴν καρδίαν σου αὐταῖς — не полагай сердца твоего на них, т. е. не заботься. τὰ ὡραῖα τοῦ Ισραηλ — прекрасное, вожделенное Израиля (ὡραῖος)."
  21: "τοῦ μικροῦ σκήπτρου φυλῆς Ισραηλ — малого колена (σκῆπτρον — жезл, колено) племени Израилева. τῆς φυλῆς τῆς ἐλαχίστης — наименьшего племени (φυλή). В csl добавлено «и отечество мое меншее паче всех отечеств вениаминовых» — в gr нет, в текст не внесено."
  22: "τὸ κατάλυμα — гостевые покои, комната. ἔθετο αὐτοῖς τόπον ἐν πρώτοις τῶν κεκλημένων — дал им место среди первых званых (καλέω, perf. pass.). ὡσεὶ ἑβδομήκοντα ἀνδρῶν — около семидесяти человек (в ru «около тридцати» — по МТ)."
  23: "τῷ μαγείρῳ — повару (μάγειρος). τὴν μερίδα, ἣν ἔδωκά σοι — часть, которую я дал тебе. θεῖναι αὐτὴν παρὰ σοί — положить её у себя."
  24: "κωλέα — бедро, окорок (в csl и ru «плечо» — по МТ). ὑπόλειμμα — остаток. εἰς μαρτύριον τέθειταί σοι παρὰ τοὺς ἄλλους — в свидетельство положено тебе сверх других. ἀπόκνιζε — «отсеки, отдели» (редкое слово; слав. «прикоснися» — иное понимание)."
  25: "κατέβη ἐκ τῆς Βαμα ἐν τῇ πόλει — сошёл с высоты в город (подлежащее не названо: Самуил или Саул). διέστρωσαν τῷ Σαουλ ἐπὶ τῷ δώματι — постелили Саулу на кровле (δῶμα)."
  26: "ἐκοιμήθη — он спал (в gr открывает стих; в csl — конец 25). ἀνέβαινεν ὁ ὄρθρος — всходила заря (ὄρθρος). Ἀνάστα — встань. ἕως ἔξω — донаружу, до выхода."
  27: "εἰς μέρος τῆς πόλεως — к части города, к окраине. Εἰπὸν τῷ νεανίσκῳ — скажи юноше (νεανίσκος). στῆθι ὡς σήμερον — «останься, как сегодня»; смысл: постой здесь. ῥῆμα θεοῦ — слово Божие. В ru добавлено «и он пошел вперед» — в gr нет."
