# jp-box, 1-я Царств, глава 9. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc и jp-ni в книге нет.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы — по греческому.
# Глава 9: род Киса и Саул (1–2), поиски ослиц (3–5), совет слуги идти к человеку
# Божию (6–10), девушки у города (11–14), откровение Господа Самуилу (15–17),
# встреча у ворот (18–21), трапеза на высоте (22–24), ночлег и уход (25–27).
# Речи — 「…」: Кис (3), Саул (5, 7, 10, 18, 21), слуга (6, 8), девушки (12–13),
# Господь (16, 17), Самуил (19–20, 22–24, 26–27). Красного нет.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (проверено по базе); слав. добавление
# в 9:21 в текст не внесено — см. notes.
# Сносок ⟨…⟩ нет: 預言者, 契約, 燔祭, 酬恩祭, エフォド уже пояснены в корпусе,
# новых терминов в главе нет.
# Отличия LXX: 9:4 — иные топонимы (Σελχα, Εασακεμ, Ιακιμ), чем в ru (Шалиша,
# Шаалим, Вениаминова); 9:5 — Σιφ (Цуф), это не ジフ/Зиф из 23:14; 9:9 — «прозорливец»
# (ὁ βλέπων) как прежнее название пророка; 9:16 — ἄρχων «правитель», а не βασιλεύς;
# 9:22 — «около семидесяти» (в ru «около тридцати»); 9:24 — κωλέα «бедро»
# (в csl и ru «плечо»); 9:26 — gr начинает стих с «он спал» (в csl это конец 25).

