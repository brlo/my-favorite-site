verses:
  0: "ダビデの詩[うた]。"
  1: "主[しゅ]よ、わたしはあなたに呼[よ]び求[もと]める。わたしの神[かみ]よ、わたしに黙[だま]っていないでください。もしあなたが黙[だま]っておられるなら、わたしは墓[はか]に下[くだ]る者[もの]のようになる。"
  2: "わたしがあなたに祈[いの]り、あなたの聖[せい]なる神殿[しんでん]に向[む]かって手[て]を上[あ]げるとき、わたしの願[ねが]いの声[こえ]を聞[き]いてください。"
  3: "わたしの魂[たましい]を罪[つみ]人[びと]と共[とも]に引[ひ]き去[さ]らないでください。不正[ふせい]を行[おこな]う者[もの]と共[とも]に、わたしを滅[ほろ]ぼさないでください。彼[かれ]らは隣[となり]人[びと]と平和[へいわ]を語[かた]りながら、その心[こころ]には悪[あく]を抱[いだ]いている。"
  4: "彼[かれ]らの行[おこな]いに応[おう]じて、その悪[わる]い企[たくら]みに応[おう]じて、彼[かれ]らに報[むく]いてください。彼[かれ]らの手[て]の業[わざ]に応[おう]じて彼[かれ]らに報[むく]い、受[う]くべき報[むく]いを彼[かれ]らに返[かえ]してください。"
  5: "彼[かれ]らは主[しゅ]の業[わざ]を、その手[て]の業[わざ]を悟[さと]らないからである。あなたは彼[かれ]らを打[う]ち壊[こわ]し、決[けっ]して建[た]て直[なお]されない。"
  6: "主[しゅ]はほめたたえられる方[かた]である。主[しゅ]はわたしの願[ねが]いの声[こえ]を聞[き]かれたからである。"
  7: "主[しゅ]はわたしの助[たす]け、わたしの盾[たて]。わたしの心[こころ]は主[しゅ]に望[のぞ]みを置[お]き、わたしは助[たす]けられた。わたしの肉[にく]は生[い]き返[かえ]った。わたしは心[こころ]を尽[つ]くして主[しゅ]をたたえよう。"
  8: "主[しゅ]はご自身[じしん]の民[たみ]の砦[とりで]、ご自身[じしん]の油[あぶら]を注[そそ]がれた者[もの]の救[すく]いの守[まも]りである。"
  9: "あなたの民[たみ]を救[すく]い、あなたの受[う]け継[つ]ぎを祝福[しゅくふく]してください。彼[かれ]らを牧[ぼく]し、とこしえに彼[かれ]らを高[たか]く上[あ]げてください。"

notes:
  0: "Τοῦ Δαυιδ — ダビデの詩 (ψαλμός подразумевается по образцу других надписаний). Надписание — стих 0."
  1: "Πρὸς σέ, κύριε, ἐκέκραξα, ὁ θεός μου — 主よ、わたしはあなたに呼び求める、わたしの神よ (κράζω — «взывать»). μὴ παρασιωπήσῃς ἀπ᾿ ἐμοῦ — わたしに黙っていないでください (παρασιωπάω — «хранить молчание»). μήποτε παρασιωπήσῃς ἀπ᾿ ἐμοῦ καὶ ὁμοιωθήσομαι τοῖς καταβαίνουσιν εἰς λάκκον — повтор «если промолчишь» сохранён; λάκκος — «ров, могила» (墓)."
  2: "εἰσάκουσον τῆς φωνῆς τῆς δεήσεώς μου — わたしの願いの声を聞いてください (δέησις — «моление»). ἐν τῷ δέεσθαί με πρὸς σέ — когда я молюсь Тебе. ἐν τῷ με αἴρειν χεῖράς μου πρὸς ναὸν ἅγιόν σου — あなたの聖なる神殿に向かって手を上げるとき (αἴρω χεῖρας — жест молитвы)."
  3: "μὴ συνελκύσῃς μετὰ ἁμαρτωλῶν τὴν ψυχήν μου — не увлеки души моей с грешниками (συνελκύω — «стаскивать, увлекать»). μετὰ ἐργαζομένων ἀδικίαν μὴ συναπολέσῃς με — 不正を行う者と共に、わたしを滅ぼさないでください (συναπόλλυμι — «погубить вместе»). τῶν λαλούντων εἰρήνην μετὰ τῶν πλησίον αὐτῶν, κακὰ δὲ ἐν ταῖς καρδίαις αὐτῶν — 隣人と平和を語りながら、その心には悪を抱いている."
  4: "δὸς αὐτοῖς κατὰ τὰ ἔργα αὐτῶν — 彼らの行いに応じて報いてください. κατὰ τὴν πονηρίαν τῶν ἐπιτηδευμάτων αὐτῶν — その悪い企みに応じて (ἐπιτήδευμα — «ухищрение, дело»). κατὰ τὰ ἔργα τῶν χειρῶν αὐτῶν δὸς αὐτοῖς — повтор «по делам рук их» сохранён. ἀπόδος τὸ ἀνταπόδομα αὐτῶν αὐτοῖς — 受くべき報いを彼らに返してください (ἀνταπόδομα — «воздаяние»)."
  5: "ὅτι οὐ συνῆκαν εἰς τὰ ἔργα κυρίου — 彼らは主の業を悟らないからである (συνίημι — «вникать, понимать»). καθελεῖς αὐτοὺς καὶ οὐ μὴ οἰκοδομήσεις αὐτούς — あなたは彼らを打ち壊し、決して建て直されない; второе лицо обращено к Богу, как в греческом (слав. «разориши… не созиждеши»)."
  6: "εὐλογητὸς κύριος — 主はほめたたえられる方である (εὐλογητός — формула благословения; ср. 2 Кор 1:3 по корпусу). ὅτι εἰσήκουσεν τῆς φωνῆς τῆς δεήσεώς μου — 主はわたしの願いの声を聞かれたからである."
  7: "κύριος βοηθός μου καὶ ὑπερασπιστής μου — 主はわたしの助け、わたしの盾 (ὑπερασπιστής — «заступник»; 盾[たて], как Пс 3:3). ἐπ᾿ αὐτῷ ἤλπισεν ἡ καρδία μου, καὶ ἐβοηθήθην — 心は主に望みを置き、わたしは助けられた. ἀνέθαλεν ἡ σάρξ μου — わたしの肉は生き返った (ἀναθάλλω — «расцветать, оживать»). ἐκ θελήματός μου ἐξομολογήσομαι αὐτῷ — 心を尽くして主をたたえよう (ἐκ θελήματός μου — «по воле моей», т. е. охотно; Синодальный «прославлю Его песнью моею»)."
  8: "κύριος κραταίωμα τοῦ λαοῦ αὐτοῦ — 主はご自身の民の砦 (κραταίωμα — «твердыня»). ὑπερασπιστὴς τῶν σωτηρίων τοῦ χριστοῦ αὐτοῦ — 油を注がれた者の救いの守り (τὰ σωτήρια — «спасения»; χριστός здесь ещё титул, потому 油を注がれた者, как Пс 2:2)."
  9: "σῶσον τὸν λαόν σου — あなたの民を救い. εὐλόγησον τὴν κληρονομίαν σου — あなたの受け継ぎを祝福してください (κληρονομία — 受け継ぎ). ποίμανον αὐτούς — 彼らを牧し (ποιμαίνω — «пасти»). ἔπαρον αὐτοὺς ἕως τοῦ αἰῶνος — とこしえに彼らを高く上げてください (ἐπαίρω — «поднимать»)."
