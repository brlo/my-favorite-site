verses:
  1: "わたしたちの間[あいだ]で確[かく]かに成[な]し遂[と]げられた事柄[ことがら]について、多[おお]くの人[ひと]が記録[きろく]を順序[じゅんじょ]立[た]てて書[か]き記[しる]そうと試[こころ]みたので、"
  2: "初[はじ]めから言[ことば]の目撃者[もくげきしゃ]となり、言[ことば]に仕[つか]える者[もの]となった人々[ひとびと]が、わたしたちに伝[つた]えたとおり、"
  3: "わたしも、すべてのことを初[はじ]めから詳[くわ]しく調[しら]べたうえで、テオフィロ閣下[かっか]に順[じゅん]を追[お]って書[か]き記[しる]すのがよいと思[おも]った。"
  4: "それは、あなたが教[おし]えを受[う]けた事柄[ことがら]が、どれほど確[たし]かなものであるかを知[し]っていただくためである。"
  5: "ユダヤの王[おう]ヘロデの時代[じだい]、アビヤの組[くみ]に属[ぞく]するザカリヤという祭司[さいし]がいた。妻[つま]はアロンの娘[むすめ]たちの一人[ひとり]で、名[な]をエリサベトといった。"
  6: "二人[ふたり]とも神[かみ]の前[まえ]に正[ただ]しい人[ひと]で、主[しゅ]のすべての戒[いまし]めと定[さだ]めを、非[とが]められるところなく歩[あゆ]んでいた。"
  7: "二人[ふたり]には子[こ]がなかった。エリサベトが不妊[ふにん]の女[おんな]であったからである。二人[ふたり]とも、すでに年[とし]を重[かさ]ねていた。"
  8: "ザカリヤが、自分[じぶん]の組[くみ]の順[じゅん]に従[したが]って神[かみ]の前[まえ]で祭司[さいし]の務[つと]めを行[おこな]っていたとき、"
  9: "祭司[さいし]の慣[なら]わしに従[したが]って籤[くじ]を引[ひ]き、主[しゅ]の神殿[しんでん]に入[はい]って香[こう]⟨燃[も]やして煙[けむり]を立[た]て、神[かみ]に捧[ささ]げる香料[こうりょう]。⟩をたくことに当[あ]たった。"
  10: "香[こう]をたく時[とき]、民[たみ]はこぞって外[そと]で祈[いの]っていた。"
  11: "すると、主[しゅ]の天使[てんし]がザカリヤの前[まえ]に現[あらわ]れ、香[こう]の祭壇[さいだん]の右[みぎ]に立[た]った。"
  12: "ザカリヤはこれを見[み]てうろたえ、恐[おそ]れに襲[おそ]われた。"
  13: "天使[てんし]は彼[かれ]に言[い]った。「ザカリヤ、恐[おそ]れるな。あなたの願[ねが]いは聞[き]き届[とど]けられた。妻[つま]エリサベトがあなたに男[おとこ]の子[こ]を産[う]む。その名[な]をヨハネと名[な]づけなさい。"
  14: "あなたには喜[よろこ]びと楽[たの]しみがある。多[おお]くの人[ひと]も、彼[かれ]の生[う]まれることを喜[よろこ]ぶ。"
  15: "彼[かれ]は主[しゅ]の前[まえ]に大[おお]きな者[もの]となるからである。ぶどう酒[しゅ]と強[つよ]い酒[さけ]を飲[の]まず、母[はは]の胎内[たいない]にいる時[とき]からすでに{聖霊[せいれい]|聖神[せいしん]}に満[み]たされる。"
  16: "イスラエルの子[こ]らの多[おお]くを、彼[かれ]らの神[かみ]である主[しゅ]のもとへ立[た]ち返[かえ]らせる。"
  17: "彼[かれ]はエリヤの霊[れい]と力[ちから]を帯[お]びて主[しゅ]の前[まえ]を先[さき]に進[すす]み、父[ちち]の心[こころ]を子[こ]に向[む]けさせ、背[そむ]く者[もの]を正[ただ]しい人[ひと]の思[おも]いに立[た]ち返[かえ]らせて、整[ととの]えられた民[たみ]を主[しゅ]のために用意[ようい]する。」"
  18: "ザカリヤは天使[てんし]に言[い]った。「何[なに]によって、それを知[し]ることができるのでしょうか。わたしは年[とし]を取[と]っており、妻[つま]も年[とし]を重[かさ]ねているのです。」"
  19: "天使[てんし]は答[こた]えて言[い]った。「わたしはガブリエル。神[かみ]の前[まえ]に立[た]つ者[もの]である。あなたに語[かた]り、この喜[よろこ]ばしい知[し]らせを告[つ]げるために遣[つか]わされたのだ。"
  20: "見[み]よ、あなたは黙[だま]り、これらのことが成[な]る日[ひ]まで物[もの]を言[い]えなくなる。わたしの言葉[ことば]を信[しん]じなかったからである。その言葉[ことば]は、時[とき]が来[く]れば必[かなら]ず成就[じょうじゅ]する。」"
  21: "民[たみ]はザカリヤを待[ま]ちわび、彼[かれ]が神殿[しんでん]の内[うち]に長[なが]くとどまっているのを不思議[ふしぎ]に思[おも]った。"
  22: "ザカリヤは出[で]て来[き]ても、彼[かれ]らに物[もの]を言[い]うことができなかった。そこで、神殿[しんでん]の内[うち]で幻[まぼろし]を見[み]たのだと分[わ]かった。彼[かれ]は身振[みぶ]りで彼[かれ]らに示[しめ]し、口[くち]のきけないままでいた。"
  23: "務[つと]めの日[ひ]が満[み]ちると、ザカリヤは家[いえ]へ帰[かえ]った。"
  24: "その日[ひ]の後[のち]、妻[つま]エリサベトは身[み]ごもり、五[ご]か月[げつ]の間[あいだ]人[ひと]に隠[かく]れて、言[い]った。"
  25: "「主[しゅ]はこのように、人々[ひとびと]の間[あいだ]にあるわたしの恥[はじ]を取[と]り除[のぞ]こうと顧[かえり]みてくださった日[ひ]に、わたしに計[はか]らいをしてくださった。」"
  26: "六[ろく]か月[げつ]目[め]に、天使[てんし]ガブリエルが神[かみ]から遣[つか]わされ、ガリラヤのナザレという町[まち]へ行[い]った。"
  27: "ダビデの家[いえ]に属[ぞく]するヨセフという人[ひと]と婚約[こんやく]した処女[しょじょ]のもとへである。その処女[しょじょ]の名[な]はマリアであった。"
  28: "天使[てんし]は彼女[かのじょ]のもとに入[はい]って言[い]った。「恵[めぐ]みに満[み]ちた者[もの]よ、喜[よろこ]べ。主[しゅ]はあなたとともにいる。〔女[おんな]たちの間[あいだ]で、あなたは祝福[しゅくふく]されている。〕」"
  29: "マリアはその言葉[ことば]にうろたえ、この挨拶[あいさつ]はどういう意味[いみ]なのだろうかと思[おも]い巡[めぐ]らした。"
  30: "天使[てんし]は彼女[かのじょ]に言[い]った。「マリア、恐[おそ]れるな。あなたは神[かみ]の前[まえ]に{恵[めぐ]み|恩寵[おんちょう]}を見[み]いだした。"
  31: "見[み]よ、あなたは身[み]ごもって男[おとこ]の子[こ]を産[う]む。その名[な]をイエスと名[な]づけなさい。"
  32: "この子[こ]は大[おお]きな者[もの]となり、いと高[たか]き方[かた]の子[こ]と呼[よ]ばれる。主[しゅ]である神[かみ]は、彼[かれ]にその父[ちち]ダビデの王座[おうざ]をお与[あた]えになる。"
  33: "彼[かれ]はヤコブの家[いえ]をとこしえに治[おさ]め、その支配[しはい]は終[お]わることがない。」"
  34: "マリアは言[い]った。「<mo>どうして、そのようなことがあるのでしょうか。わたしは男[おとこ]を知[し]らないのですから。</mo>」"
  35: "天使[てんし]は答[こた]えて彼女[かのじょ]に言[い]った。「{聖霊[せいれい]|聖神[せいしん]}があなたの上[うえ]に臨[のぞ]み、いと高[たか]き方[かた]の力[ちから]があなたを覆[おお]う。だから、生[う]まれてくる聖[せい]なる者[もの]は、神[かみ]の子[こ]と呼[よ]ばれる。"
  36: "見[み]よ、あなたの親戚[しんせき]エリサベトも、年[とし]を取[と]ってから男[おとこ]の子[こ]を身[み]ごもった。不妊[ふにん]の女[おんな]と呼[よ]ばれていたあの女[おんな]が、今[いま]は六[ろく]か月[げつ]である。"
  37: "神[かみ]にとって、できない事柄[ことがら]はないからである。」"
  38: "マリアは言[い]った。「<mo>見[み]よ、わたしは主[しゅ]のはしためです。あなたの言葉[ことば]のとおりに、わたしに成[な]りますように。</mo>」そして、天使[てんし]は彼女[かのじょ]から離[はな]れて行[い]った。"
  39: "そのころ、マリアは立[た]ち上[あ]がり、急[いそ]いでユダの山地[さんち]へ向[む]かい、ユダの町[まち]へ至[いた]った。"
  40: "そして、ザカリヤの家[いえ]に入[はい]り、エリサベトに挨拶[あいさつ]した。"
  41: "エリサベトがマリアの挨拶[あいさつ]を聞[き]くと、子[こ]が彼女[かのじょ]の胎内[たいない]で躍[おど]った。エリサベトは{聖霊[せいれい]|聖神[せいしん]}に満[み]たされ、"
  42: "大声[おおごえ]で叫[さけ]んで言[い]った。「女[おんな]たちの間[あいだ]で、あなたは祝福[しゅくふく]されています。あなたの胎[たい]の実[み]も祝福[しゅくふく]されています。"
  43: "わたしの主[しゅ]の母[はは]が、わたしのところへ来[き]てくださるとは、何[なん]ということでしょう。"
  44: "見[み]よ、あなたの挨拶[あいさつ]の声[こえ]がわたしの耳[みみ]に入[はい]ったとたん、子[こ]がわたしの胎内[たいない]で喜[よろこ]び躍[おど]りました。"
  45: "主[しゅ]が彼女[かのじょ]に語[かた]られたことが必[かなら]ず成[な]ると信[しん]じた女[おんな]は、なんと幸[さいわ]いなことでしょう。」"
  46: "そして、マリアは言[い]った。「<mo>わたしの魂[たましい]は主[しゅ]をあがめます。</mo>"
  47: "<mo>わたしの霊[れい]は、わたしの救[すく]い主[ぬし]である神[かみ]を喜[よろこ]びます。</mo>"
  48: "<mo>主[しゅ]は、そのはしための低[ひく]さをご覧[らん]になりました。見[み]よ、これから後[のち]、すべての世代[せだい]が、わたしを幸[さいわ]いな者[もの]と呼[よ]ぶでしょう。</mo>"
  49: "<mo>力[ちから]ある方[かた]が、わたしに大[おお]きなことをしてくださったからです。その御名[みな]は聖[せい]です。</mo>"
  50: "<mo>その憐[あわ]れみは、主[しゅ]を恐[おそ]れる者[もの]に、代[よ]々[よ]に及[およ]びます。</mo>"
  51: "<mo>主[しゅ]はその腕[うで]に力[ちから]を現[あらわ]し、心[こころ]の思[おも]いの高[たか]ぶる者[もの]を散[ち]らし、</mo>"
  52: "<mo>権力[けんりょく]ある者[もの]を王座[おうざ]から打[う]ち降[お]ろし、低[ひく]い者[もの]を高[たか]く引[ひ]き上[あ]げ、</mo>"
  53: "<mo>空腹[くうふく]の者[もの]を良[よ]いもので満[み]たし、富[とみ]ある者[もの]を空[むな]しく帰[かえ]らせました。</mo>"
  54: "<mo>主[しゅ]は、その僕[しもべ]イスラエルを助[たす]け上[あ]げ、憐[あわ]れみを覚[おぼ]えておられました。</mo>"
  55: "<mo>わたしたちの先祖[せんぞ]に、アブラハムとその子孫[しそん]とに、とこしえまで語[かた]られたとおりです。</mo>」"
  56: "マリアはエリサベトとともに三[さん]か月[げつ]ほど過[す]ごし、それから家[いえ]へ帰[かえ]った。"
  57: "エリサベトに産[さん]期[き]が満[み]ちて、男[おとこ]の子[こ]を産[う]んだ。"
  58: "近所[きんじょ]の人々[ひとびと]や親戚[しんせき]は、主[しゅ]が彼女[かのじょ]に大[おお]きな憐[あわ]れみを注[そそ]がれたのを聞[き]いて、彼女[かのじょ]とともに喜[よろこ]んだ。"
  59: "八日目[ようかめ]になって、子[こ]に割礼[かつれい]を行[おこな]うために人々[ひとびと]が来[き]て、子[こ]を父[ちち]の名[な]にちなんでザカリヤと名[な]づけようとした。"
  60: "すると、母[はは]が答[こた]えて言[い]った。「いいえ。この子[こ]はヨハネと名[な]づけます。」"
  61: "人々[ひとびと]は彼女[かのじょ]に言[い]った。「あなたの親戚[しんせき]には、その名[な]で呼[よ]ばれる者[もの]は一人[ひとり]もいません。」"
  62: "そこで、彼[かれ]らは子[こ]の父[ちち]に身振[みぶ]りで、何[なに]と名[な]づけたいのかと尋[たず]ねた。"
  63: "ザカリヤは書[か]く板[いた]を求[もと]めて、「その名[な]はヨハネである」と書[か]いた。人々[ひとびと]は皆[みな]、驚[おどろ]いた。"
  64: "すると、ザカリヤの口[くち]がたちまち開[ひら]き、舌[した]がほどけて、彼[かれ]は神[かみ]をほめたたえながら話[はな]し始[はじ]めた。"
  65: "近所[きんじょ]の者[もの]たちは皆[みな]恐[おそ]れを抱[いだ]き、これらの事[こと]はすべて、ユダヤの山地[さんち]一帯[いったい]に言[い]い広[ひろ]められた。"
  66: "聞[き]いた者[もの]は皆[みな]、このことを心[こころ]に留[と]め、「この子[こ]はいったい、どんな者[もの]になるのだろう」と話[はな]し合[あ]った。主[しゅ]の手[て]が彼[かれ]とともにあったからである。"
  67: "父[ちち]ザカリヤは{聖霊[せいれい]|聖神[せいしん]}に満[み]たされて預言[よげん]し、言[い]った。"
  68: "「主[しゅ]であるイスラエルの神[かみ]は、ほめたたえられますように。神[かみ]はその民[たみ]を顧[かえり]み、贖[あがな]いを成[な]し遂[と]げて、"
  69: "わたしたちのために、その僕[しもべ]ダビデの家[いえ]に救[すく]いの角[つの]を立[た]て上[あ]がらせてくださいました。"
  70: "それは、古[いにしえ]からその聖[せい]なる預言者[よげんしゃ]たちの口[くち]を通[とお]して語[かた]られたとおりです。"
  71: "わたしたちを敵[てき]の手[て]から、わたしたちを憎[にく]む者[もの]すべての手[て]から救[すく]い出[だ]して、"
  72: "わたしたちの先祖[せんぞ]に憐[あわ]れみを施[ほどこ]し、その聖[せい]なる契約[けいやく]を、"
  73: "わたしたちの父[ちち]アブラハムに誓[ちか]われた誓[ちか]いを覚[おぼ]えてくださいました。わたしたちに、"
  74: "〔わたしたちの〕敵[てき]の手[て]から救[すく]い出[だ]された者[もの]として、恐[おそ]れることなく、"
  75: "生涯[しょうがい]、御前[みまえ]に聖[せい]と義[ぎ]をもって、主[しゅ]に仕[つか]えさせてくださるためです。"
  76: "子[こ]よ、あなたも、いと高[たか]き方[かた]の預言者[よげんしゃ]と呼[よ]ばれます。主[しゅ]の道[みち]を備[そな]えるために、主[しゅ]の前[まえ]を先[さき]に進[すす]むからです。"
  77: "あなたの民[たみ]に救[すく]いの知識[ちしき]を与[あた]えます。それは彼[かれ]らの罪[つみ]の赦[ゆる]しによるもので、"
  78: "わたしたちの神[かみ]の深[ふか]い憐[あわ]れみによるものです。その憐[あわ]れみによって、日[ひ]の出[で]が高[たか]き所[ところ]からわたしたちを訪[おとず]れ、"
  79: "暗[くら]やみと死[し]の陰[かげ]に座[すわ]る者[もの]たちを照[て]らし、わたしたちの足[あし]を平和[へいわ]の道[みち]へ導[みちび]いてくださるためです。」"
  80: "子[こ]は育[そだ]って、霊[れい]において強[つよ]くなっていった。そして、イスラエルに現[あらわ]れる日[ひ]まで、荒[あ]れ野[の]にいた。"

notes:
  1: "διήγησις — «повествование, рассказ»; передал 記録 (у jp-joc 伝記). πεπληροφορημένων — «исполненных, вполне достоверных»; 確かに成し遂げられた."
  2: "αὐτόπται — «самовидцы»; 目撃者. ὑπηρέται τοῦ λόγου — «служители слова»; 言に仕える者."
  3: "κράτιστε — почётное обращение к знатному лицу; передал 閣下. Стихи 1–4 в греч. одно предложение, разбито по стихам, как у jp-joc."
  5: "ἐφημερία — чреда, то есть группа священников, служившая в храме по очереди; 組. «Из дочерей Аарона» — アロンの娘たちの一人, как в тексте."
  9: "Сноска на 香 — первое упоминание в книге, реалия неочевидна. θυμιᾶσαι — «воскурить фимиам»."
  15: "σίκερα — «сикер», крепкий напиток (заимствование из арамейского), не только виноградное вино; 強い酒."
  17: "ἐπιστρέψαι καρδίας πατέρων ἐπὶ τέκνα — «обратить сердца отцов к детям»; 父の心を子に向けさせる."
  19: "εὐαγγελίσασθαι — глагол от εὐαγγέλιον, «благовествовать»; передал 喜ばしい知らせを告げる (существительное 福音 остаётся в 3:18)."
  28: "В критической базе только χαῖρε, κεχαριτωμένη, ὁ κύριος μετὰ σοῦ; церковный текст (Елизаветинская, jp-joc「爾は女の中に祝福せられたり」) добавляет εὐλογημένη σὺ ἐν γυναιξίν — 〔…〕 (молитва «Богородице Дево»)."
  34: "ἄνδρα οὐ γινώσκω — «мужа не знаю»; 男を知らない, без смягчения. Слова Богородицы — синие."
  37: "ῥῆμα — «слово, дело»; 事柄, как в 2:15."
  38: "Слова Богородицы — синие. δούλη κυρίου — «раба Господня»; はしため."
