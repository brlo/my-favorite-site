verses:
  1: "百六十年[ひゃくろくじゅうねん]に、アンティオコス・エピファネスの子[こ]アレクサンドロスが上[のぼ]って来[き]てプトレマイスを占領[せんりょう]し、人[ひと]々[びと]は彼[かれ]を受[う]け入[い]れ、彼[かれ]はそこで王[おう]となった。"
  2: "デメトリオス王[おう]はこれを聞[き]き、非常[ひじょう]に多[おお]くの軍勢[ぐんぜい]を集[あつ]めて、彼[かれ]と戦[たたか]うために出[で]て行[い]った。"
  3: "デメトリオスはヨナタンに、彼[かれ]を高[たか]めようとする平和[へいわ]な言葉[ことば]の手紙[てがみ]を送[おく]った。"
  4: "彼[かれ]は言[い]った。「先手[さきて]を打[う]って彼[かれ]と和[わ]を結[むす]ぼう。アレクサンドロスと和[わ]を結[むす]んでわれわれに敵対[てきたい]する前[まえ]に。"
  5: "彼[かれ]は、われわれが彼[かれ]とその兄弟[きょうだい]たち、その民族[みんぞく]に対[たい]して行[おこな]ったすべての悪[あく]を思[おも]い出[だ]すだろうから。」"
  6: "そして彼[かれ]に、軍勢[ぐんぜい]を集[あつ]め、武器[ぶき]を整[ととの]え、自分[じぶん]の味方[みかた]となる権限[けんげん]を与[あた]え、アクラにいる人質[ひとじち]を彼[かれ]に渡[わた]すよう命[めい]じた。"
  7: "ヨナタンはエルサレムに来[き]て、すべての民[たみ]とアクラの者[もの]たちの耳[みみ]にその手紙[てがみ]を読[よ]み聞[き]かせた。"
  8: "彼[かれ]らは、王[おう]が彼[かれ]に軍勢[ぐんぜい]を集[あつ]める権限[けんげん]を与[あた]えたと聞[き]いて、大[おお]いなる恐[おそ]れを抱[いだ]いた。"
  9: "アクラの者[もの]たちは人質[ひとじち]をヨナタンに引[ひ]き渡[わた]し、彼[かれ]は彼[かれ]らをその両親[りょうしん]に返[かえ]した。"
  10: "ヨナタンはエルサレムに住[す]み、町[まち]を建[た]て直[なお]し、新[あら]たにし始[はじ]めた。"
  11: "彼[かれ]は仕事[しごと]をする者[もの]たちに、城壁[じょうへき]とシオンの山[やま]の周[まわ]りを四角[しかく]い石[いし]で堅固[けんご]に築[きず]くよう命[めい]じ、彼[かれ]らはそのとおりに行[おこな]った。"
  12: "バッキデスが建[た]てた要塞[ようさい]にいた異邦人[いほうじん]たちは逃[に]げた。"
  13: "それぞれ自分[じぶん]の場所[ばしょ]を捨[す]てて自分[じぶん]の地[ち]へ去[さ]った。"
  14: "ただベテズルには、律法[りっぽう]と戒[いまし]めを捨[す]てた者[もの]たちのうちのある者[もの]たちが残[のこ]った。そこが彼[かれ]らの逃[に]げ場[ば]となっていたからである。"
  15: "アレクサンドロス王[おう]は、デメトリオスがヨナタンに送[おく]ったすべての約束[やくそく]を聞[き]いた。また、彼[かれ]とその兄弟[きょうだい]たちが行[おこな]った戦[たたか]いと武勇[ぶゆう]、彼[かれ]らが耐[た]えた苦労[くろう]を告[つ]げられた。"
  16: "彼[かれ]は言[い]った。「このような人物[じんぶつ]がほかに見[み]つかるだろうか。今[いま]、彼[かれ]をわれわれの友[とも]、われわれの味方[みかた]としよう。」"
  17: "彼[かれ]は手紙[てがみ]を書[か]いて、次[つぎ]の言葉[ことば]とともに彼[かれ]に送[おく]った。"
  18: "「王[おう]アレクサンドロス、兄弟[きょうだい]ヨナタンに挨拶[あいさつ]を送[おく]る。"
  19: "われわれはあなたについて、あなたが力[ちから]ある勇士[ゆうし]であり、われわれの友[とも]となるにふさわしい者[もの]であることを聞[き]いた。"
  20: "今[いま]、われわれはあなたを、あなたの民族[みんぞく]の大祭司[だいさいし]とし、王[おう]の友[とも]と呼[よ]ばれる者[もの]とする。われわれはあなたに紫[むらさき]の衣[ころも]と金[きん]の冠[かんむり]を送[おく]った。そして、われわれと同[おな]じ思[おも]いを持[も]ち、われわれとの友情[ゆうじょう]を保[たも]つように。」"
  21: "ヨナタンは百六十年[ひゃくろくじゅうねん]の第七[だいしち]の月[つき]、仮庵[かりいお]の祭[まつ]りに聖[せい]なる衣[ころも]を着[き]、軍勢[ぐんぜい]を集[あつ]めて多[おお]くの武器[ぶき]を整[ととの]えた。"
  22: "デメトリオスはこれらの言葉[ことば]を聞[き]いて悲[かな]しみ、言[い]った。"
  23: "「われわれは何[なん]ということをしたのか。アレクサンドロスが先[さき]にユダヤ人[じん]と友情[ゆうじょう]を結[むす]び、自分[じぶん]の支[ささ]えとしたとは。"
  24: "われわれも彼[かれ]らに、勧[すす]めと称揚[しょうよう]と贈[おく]り物[もの]の言葉[ことば]を書[か]こう。彼[かれ]らがわれわれの助[たす]けとなるように。」"
  25: "彼[かれ]は次[つぎ]の言葉[ことば]とともに彼[かれ]らに送[おく]った。「王[おう]デメトリオス、ユダヤ人[じん]の民族[みんぞく]に挨拶[あいさつ]を送[おく]る。"
  26: "あなたがたがわれわれとの契約[けいやく]を守[まも]り、われわれとの友情[ゆうじょう]にとどまり、われわれの敵[てき]に加[くわ]わらなかったので、われわれは聞[き]いて喜[よろこ]んだ。"
  27: "今[いま]もなお、われわれに対[たい]して誠実[せいじつ]を保[たも]ち続[つづ]けよ。われわれはあなたがたがわれわれに対[たい]して行[おこな]うことに対[たい]して、良[よ]いものを返[かえ]す。"
  28: "われわれはあなたがたに多[おお]くの免除[めんじょ]を与[あた]え、贈[おく]り物[もの]を与[あた]える。"
  29: "今[いま]、われわれはあなたがたを自由[じゆう]にし、すべてのユダヤ人[じん]を貢[みつ]ぎ物[もの]と塩[しお]の税[ぜい]と冠[かんむり]の税[ぜい]から解[と]き放[はな]つ。"
  30: "また、種[たね]の三分[さんぶん]の一[いち]と、われわれに帰[き]すべき木[き]の実[み]の半分[はんぶん]の代[か]わりに、今日[きょう]から後[のち]、ユダの地[ち]と、これに加[くわ]えられたサマリアとガリラヤからの三[みっ]つの地方[ちほう]から取[と]り立[た]てることを、今日[きょう]から永遠[えいえん]に免除[めんじょ]する。"
  31: "エルサレムは聖[せい]なるものとされ、その境[さかい]、十分[じゅうぶん]の一[いち]と税[ぜい]も免除[めんじょ]される。"
  32: "われわれはエルサレムのアクラの権限[けんげん]も手放[てばな]し、大祭司[だいさいし]に与[あた]える。彼[かれ]が自分[じぶん]で選[えら]んだ者[もの]たちをそこに置[お]いて守[まも]らせるためである。"
  33: "また、ユダの地[ち]からわが王国[おうこく]のすべての地域[ちいき]へ捕[と]らえられて行[い]ったユダヤ人[じん]を一人[ひとり]残[のこ]らず、無償[むしょう]で自由[じゆう]の身[み]とする。すべての者[もの]はその家畜[かちく]とともに貢[みつ]ぎ物[もの]から解[と]き放[はな]たれる。"
  34: "すべての祭[まつ]り、安息日[あんそくび]、新月[しんげつ]、定[さだ]められた日々[ひび]、祭[まつ]りの前[まえ]の三日[みっか]と祭[まつ]りの後[あと]の三日[みっか]は、わが王国[おうこく]にいるすべてのユダヤ人[じん]にとって、免税[めんぜい]と免除[めんじょ]の日[ひ]とする。"
  35: "だれも、彼[かれ]らのうちのだれかに対[たい]して、いかなる事柄[ことがら]についても、これを扱[あつか]い、煩[わずら]わす権限[けんげん]を持[も]たない。"
  36: "また、ユダヤ人[じん]から三万[さんまん]の者[もの]を王[おう]の軍勢[ぐんぜい]に登録[とうろく]させ、彼[かれ]らには王[おう]のすべての軍勢[ぐんぜい]にふさわしい手当[てあて]を与[あた]える。"
  37: "彼[かれ]らのうちから者[もの]を王[おう]の大[おお]きな要塞[ようさい]に置[お]き、そのうちから王国[おうこく]の信頼[しんらい]にかなう務[つと]めに就[つ]かせる。彼[かれ]らの上[うえ]に立[た]つ者[もの]も長[ちょう]も彼[かれ]らのうちから出[で]る者[もの]とし、彼[かれ]らはユダの地[ち]で王[おう]が命[めい]じたとおりに、自分[じぶん]の律法[りっぽう]に従[したが]って歩[あゆ]む。"
  38: "ユダヤに加[くわ]えられたサマリア地方[ちほう]からの三[みっ]つの地方[ちほう]は、ユダヤに加[くわ]えられたまま、ただ一[ひと]つの権威[けんい]の下[もと]に数[かぞ]えられ、大祭司[だいさいし]以外[いがい]の権威[けんい]に服[ふく]さない。"
  39: "プトレマイスとその周辺[しゅうへん]を、エルサレムの聖所[せいしょ]に与[あた]える贈[おく]り物[もの]とし、聖所[せいしょ]にふさわしい費用[ひよう]に充[あ]てるために与[あた]えた。"
  40: "われわれは毎年[まいとし]、しかるべき場所[ばしょ]から、王[おう]の収入[しゅうにゅう]から銀[ぎん]一万五千[いちまんごせん]シケルを与[あた]える。"
  41: "また、務[つと]めにある者[もの]たちが初[はじ]めの年々[としどし]のように納[おさ]めなかった余[あま]りのすべてを、今[いま]から後[のち]、神殿[しんでん]の業[わざ]のために納[おさ]めさせる。"
  42: "その上[うえ]、聖所[せいしょ]の務[つと]めから毎年[まいとし]受[う]け取[と]っていた銀[ぎん]五千[ごせん]シケルも、奉仕[ほうし]する祭司[さいし]たちに属[ぞく]するものとして免除[めんじょ]する。"
  43: "また、エルサレムの神殿[しんでん]とそのすべての境[さかい]に逃[に]げる者[もの]は、王[おう]に負[お]うものや、いかなる事柄[ことがら]についても解[と]き放[はな]たれ、わが王国[おうこく]にある彼[かれ]らのすべてのものもともに解[と]き放[はな]たれる。"
  44: "聖所[せいしょ]の業[わざ]を建[た]て、新[あら]たにするためにも、費用[ひよう]は王[おう]の収入[しゅうにゅう]から与[あた]える。"
  45: "エルサレムの城壁[じょうへき]を建[た]て、周[まわ]りを堅固[けんご]にするためにも、またユダヤの城壁[じょうへき]を建[た]てるためにも、費用[ひよう]は王[おう]の収入[しゅうにゅう]から与[あた]える。」"
  46: "ヨナタンと民[たみ]はこれらの言葉[ことば]を聞[き]いて、それを信[しん]じず、受[う]け入[い]れなかった。イスラエルに対[たい]して行[おこな]った大[おお]きな悪[あく]と、彼[かれ]らをひどく苦[くる]しめたことを思[おも]い出[だ]したからである。"
  47: "彼[かれ]らはアレクサンドロスを喜[よろこ]んだ。彼[かれ]が自分[じぶん]たちに先[さき]に平和[へいわ]な言葉[ことば]をかけたからである。そして彼[かれ]らはすべての日[ひ]、彼[かれ]とともに戦[たたか]った。"
  48: "アレクサンドロス王[おう]は大[おお]きな軍勢[ぐんぜい]を集[あつ]め、デメトリオスの前[まえ]に陣[じん]を敷[し]いた。"
  49: "二人[ふたり]の王[おう]は戦[たたか]いを交[ま]え、デメトリオスの陣営[じんえい]は逃[に]げ、アレクサンドロスは彼[かれ]を追[お]い、彼[かれ]らを圧倒[あっとう]した。"
  50: "彼[かれ]は日[ひ]が沈[しず]むまで戦[たたか]いを激[はげ]しく続[つづ]け、その日[ひ]デメトリオスは倒[たお]れた。"
  51: "アレクサンドロスはエジプトの王[おう]プトレマイオスに、次[つぎ]の言葉[ことば]とともに使者[ししゃ]を送[おく]った。"
  52: "「われわれは自分[じぶん]の王国[おうこく]に帰[かえ]り、父[ちち]たちの王座[おうざ]に座[すわ]り、支配[しはい]を握[にぎ]り、デメトリオスを砕[くだ]いて、われわれの地[ち]を治[おさ]めた。"
  53: "われわれは彼[かれ]と戦[たたか]いを交[ま]え、彼[かれ]とその陣営[じんえい]はわれわれによって砕[くだ]かれ、われわれは彼[かれ]の王国[おうこく]の王座[おうざ]に座[すわ]った。"
  54: "今[いま]、われわれは互[たが]いに友情[ゆうじょう]を結[むす]ぼう。今[いま]、あなたの娘[むすめ]を妻[つま]としてわれわれに与[あた]えよ。われわれはあなたの婿[むこ]となり、あなたと彼女[かのじょ]に、あなたにふさわしい贈[おく]り物[もの]を与[あた]える。」"
  55: "プトレマイオス王[おう]は答[こた]えて言[い]った。「あなたが父[ちち]たちの地[ち]に帰[かえ]り、彼[かれ]らの王国[おうこく]の王座[おうざ]に座[すわ]った日[ひ]は良[よ]い日[ひ]である。"
  56: "今[いま]、われわれはあなたが書[か]いたとおりに行[おこな]う。ただ、プトレマイスで会[あ]おう。互[たが]いに顔[かお]を見[み]るためである。われわれはあなたが言[い]ったとおり、あなたの婿[むこ]となる。」"
  57: "プトレマイオスはエジプトから、自分[じぶん]とその娘[むすめ]クレオパトラとともに出[で]て、百六十二年[ひゃくろくじゅうにねん]、プトレマイスに来[き]た。"
  58: "アレクサンドロス王[おう]は彼[かれ]を迎[むか]えた。プトレマイオスは彼[かれ]に自分[じぶん]の娘[むすめ]クレオパトラを与[あた]え、プトレマイスで彼女[かのじょ]の婚礼[こんれい]を、王[おう]たちにふさわしく大[おお]きな栄光[えいこう]のうちに行[おこな]った。"
  59: "アレクサンドロス王[おう]はヨナタンに、自分[じぶん]のもとへ来[く]るよう書[か]き送[おく]った。"
  60: "彼[かれ]は栄光[えいこう]のうちにプトレマイスへ行[い]き、二人[ふたり]の王[おう]に会[あ]い、彼[かれ]らとその友[とも]たちに銀[ぎん]と金[きん]、多[おお]くの贈[おく]り物[もの]を与[あた]え、彼[かれ]らの前[まえ]で恵[めぐ]みを得[え]た。"
  61: "イスラエルから出[で]た悪[わる]しき者[もの]たち、不法[ふほう]な者[もの]たちが彼[かれ]に訴[うった]えようと集[あつ]まったが、王[おう]は彼[かれ]らに耳[みみ]を貸[か]さなかった。"
  62: "王[おう]は命[めい]じて、ヨナタンの衣[ころも]を脱[ぬ]がせ、彼[かれ]に紫[むらさき]の衣[ころも]を着[き]せた。彼[かれ]らはそのとおりに行[おこな]った。"
  63: "王[おう]は彼[かれ]を自分[じぶん]のそばに座[すわ]らせ、自分[じぶん]の長[ちょう]たちに言[い]った。「彼[かれ]とともに町[まち]の中央[ちゅうおう]へ出[で]て行[い]き、だれも彼[かれ]に対[たい]していかなる事柄[ことがら]についても訴[うった]えてはならない、まただれも彼[かれ]をいかなる言葉[ことば]でも煩[わずら]わしてはならないと布告[ふこく]せよ。」"
  64: "訴[うった]えていた者[もの]たちが、彼[かれ]の栄光[えいこう]と、布告[ふこく]されたとおりに紫[むらさき]の衣[ころも]をまとった彼[かれ]を見[み]ると、皆[みな]逃[に]げた。"
  65: "王[おう]は彼[かれ]を重[おも]んじ、最初[さいしょ]の友[とも]たちのうちに数[かぞ]え、彼[かれ]を将軍[しょうぐん]また地方[ちほう]の太守[たいしゅ]とした。"
  66: "ヨナタンは平和[へいわ]と喜[よろこ]びのうちにエルサレムへ帰[かえ]った。"
  67: "百六十五年[ひゃくろくじゅうごねん]、デメトリオスの子[こ]デメトリオスがクレタから父[ちち]たちの地[ち]へ来[き]た。"
  68: "アレクサンドロス王[おう]はこれを聞[き]いて非常[ひじょう]に悲[かな]しみ、アンティオキアへ戻[もど]った。"
  69: "デメトリオスはコイレ・シリアの太守[たいしゅ]アポロニオスを立[た]て、彼[かれ]は大[おお]きな軍勢[ぐんぜい]を集[あつ]めてヤムニアに陣[じん]を敷[し]き、大祭司[だいさいし]ヨナタンに次[つぎ]のように言[い]って送[おく]った。"
  70: "「あなただけがわれわれに対[たい]して高[たか]ぶっている。わたしはあなたのゆえに嘲[あざけ]られ、辱[はずかし]められた。なぜあなたは山々[やまやま]でわれわれに対[たい]して権[けん]を振[ふ]るうのか。"
  71: "今[いま]、もしあなたが自分[じぶん]の軍勢[ぐんぜい]に信頼[しんらい]しているなら、われわれのところへ平地[へいち]に下[お]りて来[こ]い。そこで互[たが]いに比[くら]べよう。わたしには諸都市[しょとし]の軍勢[ぐんぜい]があるからだ。"
  72: "尋[たず]ねて、わたしがだれであり、われわれを助[たす]ける残[のこ]りの者[もの]たちがだれであるかを知[し]れ。彼[かれ]らは言[い]う。『あなたがたにはわれわれの前[まえ]に足[あし]を立[た]てることもできない。あなたの父[ちち]たちは二度[にど]、自分[じぶん]の地[ち]で追[お]い返[かえ]されたからだ。』"
  73: "今[いま]、あなたはこのような騎兵[きへい]と軍勢[ぐんぜい]に、石[いし]もなく、小石[こいし]もなく、逃[に]げる場所[ばしょ]もない平地[へいち]で立[た]ち向[む]かうことはできない。」"
  74: "ヨナタンはアポロニオスの言葉[ことば]を聞[き]くと、心[こころ]を奮[ふる]い立[た]たせ、一万人[いちまんにん]の者[もの]を選[えら]んでエルサレムから出[で]た。兄弟[きょうだい]シモンも彼[かれ]を助[たす]けるために彼[かれ]と合流[ごうりゅう]した。"
  75: "彼[かれ]はヤッファに陣[じん]を敷[し]いたが、町[まち]の者[もの]たちが彼[かれ]を閉[し]め出[だ]した。アポロニオスの守備隊[しゅびたい]がヤッファにいたからである。彼[かれ]らはそれを攻[せ]めた。"
  76: "町[まち]の者[もの]たちは恐[おそ]れて開[あ]いた。ヨナタンはヤッファを支配[しはい]した。"
  77: "アポロニオスはこれを聞[き]き、三千[さんぜん]の騎兵[きへい]と大[おお]きな軍勢[ぐんぜい]を率[ひき]いて、アゾトへ行[い]き、通[とお]り過[す]ぎるかのようにして、すぐに平地[へいち]へ進[すす]み出[で]た。多[おお]くの騎兵[きへい]を持[も]ち、それに信頼[しんらい]していたからである。"
  78: "ヨナタンは彼[かれ]の後[あと]を追[お]ってアゾトへ行[い]き、両軍[りょうぐん]は戦[たたか]いを交[ま]えた。"
  79: "アポロニオスは千[せん]の騎兵[きへい]を彼[かれ]らの後[うし]ろに密[ひそ]かに残[のこ]していた。"
  80: "ヨナタンは自分[じぶん]の後[うし]ろに待[ま]ち伏[ぶ]せがあるのを知[し]った。彼[かれ]らは彼[かれ]の陣営[じんえい]を包囲[ほうい]し、朝[あさ]から夕方[ゆうがた]まで民[たみ]に向[む]かって矢[や]を放[はな]った。"
  81: "しかし民[たみ]はヨナタンが命[めい]じたとおりに立[た]っていた。彼[かれ]らの馬[うま]は疲[つか]れた。"
  82: "シモンは自分[じぶん]の軍勢[ぐんぜい]を引[ひ]き寄[よ]せて部隊[ぶたい]に襲[おそ]いかかった。騎兵[きへい]はすでに弱[よわ]っていたからである。彼[かれ]らは彼[かれ]によって砕[くだ]かれ、逃[に]げた。"
  83: "騎兵[きへい]は平地[へいち]に散[ち]り、アゾトへ逃[に]げ、救[すく]われるために彼[かれ]らの偶像[ぐうぞう]の神殿[しんでん]ベトダゴンに入[はい]った。"
  84: "ヨナタンはアゾトとその周[まわ]りの町々[まちまち]を焼[や]き、彼[かれ]らの分捕[ぶんど]り物[もの]を取[と]り、ダゴンの神殿[しんでん]とそこへ逃[に]げ込[こ]んだ者[もの]たちを火[ひ]で焼[や]いた。"
  85: "剣[つるぎ]で倒[たお]れた者[もの]と焼[や]かれた者[もの]は、合[あ]わせて八千[はっせん]人[にん]であった。"
  86: "ヨナタンはそこを発[た]ってアスカロンに陣[じん]を敷[し]いた。町[まち]の者[もの]たちは大[おお]きな栄光[えいこう]をもって彼[かれ]を迎[むか]えに出[で]た。"
  87: "ヨナタンは多[おお]くの分捕[ぶんど]り物[もの]を持[も]って、仲間[なかま]たちとともにエルサレムへ帰[かえ]った。"
  88: "アレクサンドロス王[おう]はこれらの言葉[ことば]を聞[き]くと、さらにヨナタンを重[おも]んじることにした。"
  89: "彼[かれ]は王[おう]の親族[しんぞく]に与[あた]えるのが慣[なら]わしである金[きん]の留[と]め金[がね]を彼[かれ]に送[おく]り、アッカロンとそのすべての境[さかい]を嗣業[しぎょう]として彼[かれ]に与[あた]えた。"

notes:
  1: "Ἀλέξανδρος ὁ τοῦ Ἀντιόχου ὁ Ἐπιφανής — «Александр, сын Антиоха Епифана»; Πτολεμαΐς — プトレマイス (Акко). Слав. «в лето сто шестьдесятое взыде александр сын антиохов епифан»."
  3: "ἐπιστολὰς λόγοις εἰρηνικοῖς — «письма со словами мирными»; слав. «словесы мирными, величая его»."
  6: "ἐξουσίαν συναγαγεῖν δυνάμεις — «власть собрать войска»; τὰ ὅμηρα τὰ ἐν τῇ ἄκρᾳ — «заложников, что в крепости» (アクラ)."
  11: "τὸ ὄρος Σιων κυκλόθεν ἐκ λίθων τετραπόδων — «гору Сион окрест из камней четвероугольных»; εἰς ὀχύρωσιν — «в утверждение»."
  12: "οἱ ἀλλογενεῖς — «иноплеменники» (слав. «иноплеменницы»); 異邦人 — по корпусу. τοῖς ὀχυρώμασιν — 要塞[ようさい]."
  14: "οἱ καταλιπόντες τὸν νόμον καὶ τὰ προστάγματα — «оставившие закон и повеления»; φυγαδευτήριον — «убежище», 逃げ場."
  15: "τὰς ἐπαγγελίας — «обещания»; ἀνδραγαθίαι — «мужественные подвиги»; τοὺς κόπους — «труды» (слав. «труды»)."
  18: "Βασιλεὺς Ἀλέξανδρος τῷ ἀδελφῷ Ιωναθαν χαίρειν — epistolary formula; χαίρειν — 挨拶を送る. Письмо продолжается до конца 20."
  20: "καὶ ἀπέστειλεν αὐτῷ πορφύραν καὶ στέφανον χρυσοῦν — в LXX в квадратных скобках, у слав. в скобках («и посла ему порфиру и венец злат»); в базе текст есть, 〔…〕 не ставится. ἀρχιερέα τοῦ ἔθνους σου — «первосвященника народа твоего»."
  21: "ἑορτῇ σκηνοπηγίας — 仮庵の祭り; ἁγία στολή — «святая одежда» (слав. «святая риза»)."
  23: "προέφθακεν ἡμᾶς Ἀλέξανδρος τοῦ φιλίαν καταλαβέσθαι — «Александр предупредил нас, чтобы заключить дружбу»; εἰς στήριγμα — «в утверждение (опору)»."
  24: "λόγους παρακλήσεως καὶ ὕψους καὶ δομάτων — «слова утешения (увещания), возвышения и даров»; слав. «просителная и возвышения и дары»."
  29: "τῆς τιμῆς τοῦ ἁλός — «цены соли»; ἀπὸ τῶν στεφάνων — «от венцов» (венечный сбор)."
  30: "ἀντὶ τοῦ τρίτου τῆς σπορᾶς — «вместо трети посева»; τοῦ καρποῦ τοῦ ξυλίνου — «плода древесного»; τριῶν νομῶν — «трёх областей (номов)»; Σαμαρῖτις — サマリア."
  31: "ἁγία καὶ ἀφειμένη — «свята и оставлена (свободна)»; αἱ δεκάται καὶ τὰ τέλη — «десятины и пошлины»."
  32: "τῆς ἄκρας τῆς ἐν Ιερουσαλημ — «крепости, что в Иерусалиме» (アクラ); τοῦ φυλάσσειν αὐτήν — «охранять её»."
  33: "πᾶσαν ψυχὴν Ιουδαίων τὴν αἰχμαλωτισθεῖσαν — «всякую душу Иудеев, пленённую»; ἐλευθέραν δωρεάν — «свободной даром» (слав. «свободну туне»)."
  34: "νουμηνίαι — 新月; ἡμέραι ἀποδεδειγμέναι — «дни назначенные»; ἀτελείας καὶ ἀφέσεως — «беспошлинности и освобождения»."
  36: "προγραφήτωσαν — «пусть записываются»; ξένια — «содержание, жалованье» (слав. «оброцы»); τριάκοντα χιλιάδας ἀνδρῶν — 三万."
  37: "ἐπὶ χρειῶν τῆς βασιλείας — «на службах (должностях) царства»; τοῖς νόμοις αὐτῶν — «по своим законам»."
  38: "τοὺς τρεῖς νομούς — «три области»; ὑφ᾿ ἕνα — «под одного» (единую власть)."
  39: "Πτολεμαΐδα καὶ τὴν προσκυροῦσαν αὐτῇ — «Птолемаиду и принадлежащее ей»; εἰς τὴν καθήκουσαν δαπάνην — «на подобающий расход»."
  40: "δέκα πέντε χιλιάδας σίκλων ἀργυρίου — 一万五千 сиклей; ἀπὸ τῶν λόγων τοῦ βασιλέως — «из счётов (доходов) царя»."
  41: "τὸ πλεονάζον, ὃ οὐκ ἀπεδίδωσαν ἀπὸ τῶν χρειῶν — «излишек, который не отдавали от служб» (слав. «от потреб»)."
  42: "πεντακισχιλίους σίκλους — 五千 сиклей; τοῖς ἱερεῦσιν τοῖς λειτουργοῦσιν — «священникам служащим»."
  43: "ὀφείλων βασιλικὰ — «должные царское» (царские повинности); ἀπολελύσθωσαν — «да будут освобождены»."
  46: "οὐκ ἐπίστευσαν — «не поверили»; ἔθλιψεν αὐτοὺς σφόδρα — «притеснил их весьма»."
  47: "ἀρχηγὸς λόγων εἰρηνικῶν — «начальник (первый) мирных слов»; συνεμάχουν — «воевали вместе»."
  50: "ἐστερέωσεν τὸν πόλεμον σφόδρα — «укрепил (напряг) войну весьма»; ἕως ἔδυ ὁ ἥλιος — «до захода солнца»."
  52: "ἐνεκάθισα ἐπὶ θρόνου πατέρων μου — «воссел на престоле отцов моих»; ἐκράτησα τῆς ἀρχῆς — «овладел начальством (властью)»."
  54: "στήσωμεν πρὸς αὑτοὺς φιλίαν — «поставим между собою дружбу»; ἐπιγαμβρεύσω σοι — «породнюсь с тобою»."
  57: "Κλεοπάτρα — クレオパトラ; ἔτους δευτέρου καὶ ἑξηκοστοῦ καὶ ἑκατοστοῦ — 162-й год."
  58: "καθὼς οἱ βασιλεῖς ἐν δόξῃ μεγάλῃ — «как цари, в славе великой»."
  61: "ἄνδρες λοιμοί — «мужи гибельные» (слав. «губителе»); ἐντυχεῖν κατ᾿ αὐτοῦ — «обратиться (с жалобой) против него»."
  63: "Ἐξέλθατε μετ᾿ αὐτοῦ εἰς μέσον τῆς πόλεως — «выйдите с ним на середину города»; κηρύξατε — «провозгласите»."
  65: "τῶν πρώτων φίλων — «первых друзей» (придворный чин); στρατηγὸν καὶ μεριδάρχην — «военачальником и меридархом» (областным правителем), 将軍・太守."
  67: "Δημήτριος υἱὸς Δημητρίου ἐκ Κρήτης — Димитрий II, сын Димитрия I, из Крита; 165-й год."
  69: "Ἀπολλώνιον τὸν ὄντα ἐπὶ Κοίλης Συρίας — «Аполлония, начальствующего над Келе-Сирией» (コイレ・シリア); Ιάμνειαν — ヤムニア."
  70: "Σὺ μονώτατος ἐπαίρῃ ἐφ᾿ ἡμᾶς — «ты один только поднимаешься на нас»; εἰς καταγέλωτα καὶ εἰς ὀνειδισμόν — «в посмех и в поношение»."
  71: "συγκριθῶμεν ἑαυτοῖς — «сравним (померимся) друг с другом»; δύναμις τῶν πόλεων — «сила городов»."
  72: "δὶς ἐτροπώθησαν οἱ πατέρες σου — «дважды обращены в бегство отцы твои»."
  73: "οὐδὲ κόχλαξ — «ни голыш (камешек)»; τόπος τοῦ φυγεῖν — «место убежать»."
  74: "ἐκινήθη τῇ διανοίᾳ — «подвигся мыслию (духом)»; ἐπέλεξεν δέκα χιλιάδας — «избрал десять тысяч»."
  75: "Ιοππη — ヤッファ (Иоппия); φρουρὰ Ἀπολλωνίου — «стража Аполлония»."
  77: "διοδεύων — «делая переход (как бы проходя)»; πεποιθέναι ἐπ᾿ αὐτῇ — «полагаться на неё (конницу)»."
  80: "ἔνεδρον κατόπισθεν — «засада позади»; ἐξετίναξαν τὰς σχίζας — «метали (бросали) стрелы» (σχίζα — расщеплённое древко, стрела)."
  82: "ἡ ἵππος ἐξελύθη — «конница изнемогла»; συνῆψεν πρὸς τὴν φάλαγγα — «сошёлся с отрядом (фалангой)»."
  83: "Βηθδαγων τὸ εἰδώλιον αὐτῶν — «Бетдагон, капище (идольский храм) их»; τοῦ σωθῆναι — «чтобы спастись»."
  84: "τὸ ἱερὸν Δαγων — «святилище Дагона» (ダゴン); τοὺς συμφυγόντας εἰς αὐτό — «убежавших в него»."
  86: "Ἀσκαλῶνα — アスカロン; ἐν δόξῃ μεγάλῃ — «в славе (почёте) великой»."
  89: "πόρπην χρυσῆν — «золотую пряжку (застёжку)», 留め金; Ἀκκαρων — アッカロン; εἰς κληροδοσίαν — «в наследственное владение», 嗣業."
