verses:
  1: "群衆[ぐんしゅう]が神[かみ]の言葉[ことば]を聞[き]こうと、イエスに押[お]し寄[よ]せて来[き]た。イエスはゲネサレト湖[みずうみ]の岸[きし]に立[た]っておられた。"
  2: "イエスは、湖[みずうみ]の岸[きし]に着[つ]けてある二[ふた]つの舟[ふね]をご覧[らん]になった。漁師[りょうし]たちは舟[ふね]から降[お]りて、網[あみ]を洗[あら]っていた。"
  3: "イエスはその一[ひと]つ、シモンの舟[ふね]に乗[の]り込み、少[すこ]し岸[きし]から離[はな]すように頼[たの]まれた。そして舟[ふね]に座[すわ]って、群衆[ぐんしゅう]を教[おし]え始[はじ]められた。"
  4: "話[はなし]を終[お]えられると、シモンに言[い]われた。「<j>深[ふか]い所[ところ]へ漕[こ]ぎ出[だ]して、網[あみ]を下[お]ろして漁[りょう]をしなさい。</j>」"
  5: "シモンは答[こた]えて言[い]った。「先生[せんせい]、わたしたちは夜通[よどお]し働[はたら]きましたが、何[なに]も取[と]れませんでした。しかし、あなたの言葉[ことば]ですから、網[あみ]を下[お]ろします。」"
  6: "そうすると、おびただしい数[かず]の魚[さかな]がかかり、網[あみ]が破[やぶ]れそうになった。"
  7: "そこで、もう一[ひと]つの舟[ふね]にいる仲間[なかま]に合図[あいず]して、来[き]て手[て]を貸[か]してもらった。こうして二[ふた]つの舟[ふね]はいっぱいになり、沈[しず]みそうになった。"
  8: "シモン・ペトロはこれを見[み]て、イエスの膝[ひざ]もとにひれ伏[ふ]して言[い]った。「主[しゅ]よ、わたしから離[はな]れてください。わたしは罪人[ざいにん]です。」"
  9: "あまりの魚[さかな]の多[おお]さに、彼[かれ]も一緒[いっしょ]にいた者[もの]たちも皆[みな]、驚[おどろ]きに打[う]たれたからである。"
  10: "同じ[おな]ように、シモンの仲間[なかま]であるゼベダイの子[こ]ヤコブとヨハネもそうであった。イエスはシモンに言[い]われた。「<j>恐[おそ]れることはない。今[いま]からあなたは、人[ひと]を生[い]け捕[いけど]りにする漁師[りょうし]になる。</j>」"
  11: "彼[かれ]らは舟[ふね]を岸[きし]に上[あ]げると、すべてを捨[す]ててイエスに従[したが]った。"
  12: "イエスがある町[まち]にいたとき、全身[ぜんしん]に重[おも]い皮膚病[ひふびょう]を患[わずら]う人[ひと]がいた。その人[ひと]はイエスを見[み]ると、顔[かお]を地[ち]につけて願[ねが]った。「主[しゅ]よ、お望[のぞ]みでしたら、わたしを清[きよ]くすることがおできになります。」"
  13: "イエスは手[て]を伸[の]べてその人[ひと]に触[ふ]れ、「<j>わたしは望[のぞ]む。清[きよ]くなれ</j>」と言[い]われた。すると、重[おも]い皮膚病[ひふびょう]はたちまちその人[ひと]から離[はな]れた。"
  14: "イエスはその人[ひと]に、だれにも話[はな]さないよう厳[きび]しく言[い]い含[ふく]めてから、こう言[い]われた。「<j>ただ、行[い]って祭司[さいし]に体[からだ]を見[み]せ、あなたの清[きよ]めのためにモーセが定[さだ]めた捧[ささ]げ物[もの]をしなさい。それが人々[ひとびと]への証[あかし]となる。</j>」"
  15: "しかし、イエスのうわさはますます広[ひろ]がり、多[おお]くの群衆[ぐんしゅう]が集[あつ]まって教[おし]えを聞[き]き、また自分[じぶん]の病[やまい]を癒[いや]してもらおうとした。"
  16: "イエスは退[しりぞ]いては人気[ひとけ]のない所[ところ]で祈[いの]っておられた。"
  17: "ある日[ひ]、イエスが教[おし]えておられたとき、ファリサイ派[は]の人々[ひとびと]と律法学者[りっぽうがくしゃ]たちが座[すわ]っていた。彼[かれ]らはガリラヤのあらゆる村[むら]、ユダヤ、エルサレムから来[き]ていた。主[しゅ]の力[ちから]が働[はたら]いて、イエスは病[やまい]を癒[いや]しておられた。"
  18: "すると、中風[ちゅうぶ]の人[ひと]を寝台[しんだい]に載[の]せた人々[ひとびと]が来[き]て、その人[ひと]を家[いえ]の中[なか]へ運[はこ]び入[い]れ、イエスの前[まえ]に置[お]こうとした。"
  19: "しかし、群衆[ぐんしゅう]が多[おお]くて運[はこ]び入[い]れることができなかったので、屋根[やね]に上[のぼ]り、瓦[かわら]の間[あいだ]からその人[ひと]を寝台[しんだい]ごとつり下[お]ろして、人々[ひとびと]の真[ま]ん中[なか]、イエスの前[まえ]に置[お]いた。"
  20: "イエスは彼[かれ]らの信仰[しんこう]をご覧[らん]になって言[い]われた。「<j>人[ひと]よ、あなたの罪[つみ]は赦[ゆる]された。</j>」"
  21: "律法学者[りっぽうがくしゃ]たちとファリサイ派[は]の人々[ひとびと]は、心[こころ]の中[なか]で論[ろん]じ始[はじ]めた。「このように神[かみ]を冒涜[ぼうとく]することを言[い]う者[もの]は誰[だれ]だ。罪[つみ]を赦[ゆる]すことができるのは、神[かみ]のほかにはいないではないか。」"
  22: "イエスは彼[かれ]らの論[ろん]じていることを見[み]抜[ぬ]いて、言[い]われた。「<j>あなたがたはなぜ、心[こころ]の中[なか]で論[ろん]じているのか。</j>」"
  23: "「<j>どちらが易[やさ]しいか。『あなたの罪[つみ]は赦[ゆる]された』と言[い]うことか、それとも『起[お]きて歩[あ]け』と言[い]うことか。</j>"
  24: "<j>人の子[こ]が地上[ちじょう]で罪[つみ]を赦[ゆる]す権威[けんい]を持[も]っていることを、あなたがたに知[し]ってもらうために。</j>」こう言[い]って、中風[ちゅうぶ]の人[ひと]に言[い]われた。「<j>あなたに言[い]う。起[お]きて、寝台[しんだい]を取[と]り上[あ]げて、家[いえ]へ帰[かえ]りなさい。</j>」"
  25: "その人[ひと]は皆[みな]の前[まえ]ですぐに起[お]き上[あ]がり、自分[じぶん]が寝[ね]ていた寝台[しんだい]を取[と]り、神[かみ]を讃[たた]えながら家[いえ]へ帰[かえ]って行[い]った。"
  26: "人[ひと]は皆[みな]驚[おどろ]き、神[かみ]を讃[たた]え、恐[おそ]れに満[み]ちて言[い]った。「今日[きょう]は不思議[ふしぎ]なことを見[み]たものだ。」"
  27: "その後[あと]、イエスは外[そと]へ出[で]て、徴税人[ちょうぜいにん]のレビが徴税所[ちょうぜいしょ]に座[すわ]っているのをご覧[らん]になり、「<j>わたしについて来[き]なさい</j>」と言[い]われた。"
  28: "レビはすべてを捨[す]てて立[た]ち上[あ]がり、イエスに従[したが]った。"
  29: "レビは自分[じぶん]の家[いえ]でイエスのために大[おお]きな宴会[えんかい]を開[ひら]いた。徴税人[ちょうぜいにん]やほかにも多[おお]くの人[ひと]が、彼[かれ]らと一緒[いっしょ]に食卓[しょくたく]に着[つ]いていた。"
  30: "ファリサイ派[は]の人々[ひとびと]とその律法学者[りっぽうがくしゃ]たちは、弟子[でし]たちに不平[ふへい]を言[い]った。「なぜあなたがたは、徴税人[ちょうぜいにん]や罪人[ざいにん]と一緒[いっしょ]に飲[の]み食[く]いをするのか。」"
  31: "イエスは答[こた]えて言[い]われた。「<j>健康[けんこう]な者[もの]に医者[いしゃ]は要[い]らない。病人[びょうにん]にこそ要[い]る。</j>"
  32: "<j>わたしが来[き]たのは、正[ただ]しい者[もの]を招[まね]くためではなく、罪人[ざいにん]を悔[く]い改[あらた]めへと招[まね]くためである。</j>」"
  33: "彼[かれ]らはイエスに言[い]った。「ヨハネの弟子[でし]たちはしばしば断食[だんじつ]して祈[いの]りをしている。ファリサイ派[は]の弟子[でし]たちも同[おな]じだ。しかし、あなたの弟子[でし]たちは飲[の]み食[く]いばかりしている。」"
  34: "イエスは言[い]われた。「<j>花婿[はなむこ]が一緒[いっしょ]にいる間[あいだ]、婚礼[こんれい]の客[きゃく]たちを断食[だんじつ]させることができるだろうか。</j>"
  35: "<j>だが、花婿[はなむこ]が彼[かれ]らから取[と]り去[さ]られる日[ひ]が来[く]る。その日[ひ]には断食[だんじつ]する。</j>」"
  36: "また、イエスは彼[かれ]らにたとえを話[はな]された。「<j>だれも、新しい衣[ころも]から布[ぬの]を切[き]り取[と]って、古[ふる]い衣[ころも]に継[つ]ぎ当[あ]てはしない。もしそうすれば、新しい衣[ころも]を裂[さ]くことになり、しかも新しい衣[ころも]から取[と]った布[ぬの]は古[ふる]い衣[ころも]に合[あ]わない。</j>"
  37: "<j>また、新しい酒[さけ]を古[ふる]い皮[かわ]袋[ぶくろ]に入[い]れる者[もの]はいない。もしそうすれば、新しい酒[さけ]は皮袋[かわぶくろ]を破[やぶ]り、酒[さけ]は流[なが]れ出[で]、皮袋[かわぶくろ]もだめになる。</j>"
  38: "<j>新しい酒[さけ]は新しい皮袋[かわぶくろ]に入[い]れなければならない。〔そうすれば、両方[りょうほう]とも保[たも]たれる。〕</j>"
  39: "<j>また、古[ふる]い酒[さけ]を飲[の]んでから新しい酒[さけ]を欲[ほ]しがる者[もの]はいない。『古[ふる]いものが良[よ]い』と言[い]うからである。</j>」"

notes:
  38: "καὶ ἀμφότεροι συντηροῦνται («и то и другое сохраняется», из Мф 9:17) — церковное чтение (jp-joc 兩の者存せん), в критической базе нет — добавление в 〔〕."
