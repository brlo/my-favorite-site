# jp-box, Бытие, глава 1. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru),
# русский Синодальный (ru) и, где есть, jp-joc (1901, public domain).
# Язык — современный 常体, без 文語; порядок членов и деление на клаузы — по греческому.
# Глава 1: творение за шесть дней (1–25), сотворение человека (26–28),
# пища человеку и животным (29–30), «весьма хорошо» и шестой день (31).
# Красного и синего нет: Бог говорит, но это не прямая речь Христа во плоти; «<j>» не ставится.
# Прямая речь Бога — в 「…」, без красного; кавычек внутри нет.
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено по базе).
# LXX отличается от еврейского текста в 1:2 (ἀόρατος καὶ ἀκατασκεύαστος — «невидима и неустроена»,
# а не «безвидна и пуста») и в 1:6–8 (στερέωμα — «твердь», 大空); перевод с греческого, отличия в notes.
# Сносок ⟨…⟩ нет: 大空, 淵, 姿, 支配, 安息 уже в корпусе или понятны.
# jp-ni не использовался.

tr_code: jp-box
book: gen
chapter: 1
draft: true

verses:
  1: "初[はじ]めに、神[かみ]は天[てん]と地[ち]を造[つく]られた。"
  2: "地[ち]は見[み]えず、まだ整[ととの]っていなかった。闇[やみ]が深[ふか]い淵[ふち]の上[うえ]にあり、神[かみ]の霊[れい]が水[みず]の面[おもて]を覆[おお]っていた。"
  3: "神[かみ]は言[い]われた。「光[ひかり]があれ。」すると、光[ひかり]があった。"
  4: "神[かみ]は光[ひかり]を良[よ]いと見[み]られた。神[かみ]は光[ひかり]と闇[やみ]を分[わ]けられた。"
  5: "神[かみ]は光[ひかり]を昼[ひる]と名[な]づけ、闇[やみ]を夜[よる]と名[な]づけられた。夕[ゆう]べがあり、朝[あさ]があった。これが第一[だいいち]の日[ひ]である。"
  6: "神[かみ]は言[い]われた。「水[みず]の間[あいだ]に大空[おおぞら]があって、水[みず]と水[みず]を分[わ]けるように。」そうなった。"
  7: "神[かみ]は大空[おおぞら]を造[つく]り、大空[おおぞら]の下[した]の水[みず]と、大空[おおぞら]の上[うえ]の水[みず]を分[わ]けられた。"
  8: "神[かみ]は大空[おおぞら]を天[てん]と名[な]づけられた。神[かみ]はそれを良[よ]いと見[み]られた。夕[ゆう]べがあり、朝[あさ]があった。これが第二[だいに]の日[ひ]である。"
  9: "神[かみ]は言[い]われた。「天[てん]の下[した]の水[みず]は一[ひと]つの所[ところ]に集[あつ]まり、乾[かわ]いた地[ち]が現[あらわ]れよ。」そうなった。天[てん]の下[した]の水[みず]はそれぞれの所[ところ]に集[あつ]まり、乾[かわ]いた地[ち]が現[あらわ]れた。"
  10: "神[かみ]は乾[かわ]いた地[ち]を地[ち]と名[な]づけ、水[みず]の集[あつ]まりを海[うみ]と名[な]づけられた。神[かみ]はそれを良[よ]いと見[み]られた。"
  11: "神[かみ]は言[い]われた。「地[ち]は草[くさ]を、すなわち種[たね]を結[むす]ぶ草[くさ]を、それぞれの種類[しゅるい]に従[したが]って芽生[めば]えさせ、また実[み]を結[むす]び、その中[なか]に種[たね]を持[も]つ木[き]を、それぞれの種類[しゅるい]に従[したが]って芽生[めば]えさせよ。」そうなった。"
  12: "地[ち]は草[くさ]を、すなわち種[たね]を結[むす]ぶ草[くさ]を、それぞれの種類[しゅるい]に従[したが]って芽生[めば]えさせ、また実[み]を結[むす]び、その中[なか]に種[たね]を持[も]つ木[き]を、それぞれの種類[しゅるい]に従[したが]って芽生[めば]えさせた。神[かみ]はそれを良[よ]いと見[み]られた。"
  13: "夕[ゆう]べがあり、朝[あさ]があった。これが第三[だいさん]の日[ひ]である。"
  14: "神[かみ]は言[い]われた。「天[てん]の大空[おおぞら]に光[ひかり]る者[もの]があって、昼[ひる]と夜[よる]を分[わ]けよ。それはしるしとなり、季節[きせつ]と日[ひ]と年[とし]のためになれ。"
  15: "また、天[てん]の大空[おおぞら]にあって地[ち]の上[うえ]を照[て]らす光[ひかり]となれ。」そうなった。"
  16: "神[かみ]は二[ふた]つの大[おお]きな光[ひかり]る者[もの]を造[つく]られた。大[おお]きい方[ほう]を昼[ひる]を治[おさ]めるために、小[ちい]さい方[ほう]を夜[よる]を治[おさ]めるために、また星[ほし]を造[つく]られた。"
  17: "神[かみ]はこれらの光[ひかり]を天[てん]の大空[おおぞら]に据[す]え、地[ち]の上[うえ]を照[て]らさせられた。"
  18: "昼[ひる]と夜[よる]を治[おさ]め、光[ひかり]と闇[やみ]を分[わ]けさせられた。神[かみ]はそれを良[よ]いと見[み]られた。"
  19: "夕[ゆう]べがあり、朝[あさ]があった。これが第四[だいし]の日[ひ]である。"
  20: "神[かみ]は言[い]われた。「水[みず]は生[い]き物[もの]の群[む]れを涌[わ]き出[だ]せ。鳥[とり]は地[ち]の上[うえ]を、天[てん]の大空[おおぞら]を飛[と]べ。」"
  21: "神[かみ]は大[おお]きな海[うみ]の獣[けもの]たちと、水[みず]が涌[わ]き出[だ]すあらゆる生[い]き物[もの]を、それぞれの種類[しゅるい]に従[したが]って、また翼[つばさ]のある鳥[とり]を、それぞれの種類[しゅるい]に従[したが]って造[つく]られた。神[かみ]はそれを良[よ]いと見[み]られた。"
  22: "神[かみ]はそれらを祝福[しゅくふく]して言[い]われた。「産[う]めよ、増[ふ]えよ、海[うみ]の水[みず]を満[み]たせ。鳥[とり]は地[ち]の上[うえ]に増[ふ]えよ。」"
  23: "夕[ゆう]べがあり、朝[あさ]があった。これが第五[だいご]の日[ひ]である。"
  24: "神[かみ]は言[い]われた。「地[ち]は生[い]き物[もの]を、家畜[かちく]と、地[ち]を這[は]うものと、地[ち]の獣[けもの]を、それぞれの種類[しゅるい]に従[したが]って産[う]み出[だ]せ。」そうなった。"
  25: "神[かみ]は地[ち]の獣[けもの]をそれぞれの種類[しゅるい]に従[したが]って、家畜[かちく]をそれぞれの種類[しゅるい]に従[したが]って、地[ち]を這[は]うものをすべてそれぞれの種類[しゅるい]に従[したが]って造[つく]られた。神[かみ]はそれを良[よ]いと見[み]られた。"
  26: "神[かみ]は言[い]われた。「わたしたちの姿[かたち]に、わたしたちに似[に]せて、人[ひと]を造[つく]ろう。その人[ひと]は、海[うみ]の魚[さかな]、天[てん]の鳥[とり]、家畜[かちく]、地[ち]のすべての獣[けもの]、地[ち]を這[は]うすべてのものを支配[しはい]するように。」"
  27: "神[かみ]は人[ひと]をご自分[じぶん]の姿[かたち]に造[つく]られた。神[かみ]の姿[かたち]に造[つく]られたのである。男[おとこ]と女[おんな]に造[つく]られた。"
  28: "神[かみ]は彼[かれ]らを祝福[しゅくふく]して言[い]われた。「産[う]めよ、増[ふ]えよ、地[ち]に満[み]ちよ。地[ち]を支配[しはい]し、海[うみ]の魚[さかな]、天[てん]の鳥[とり]、地[ち]を這[は]うすべての生[い]き物[もの]を治[おさ]めよ。」"
  29: "神[かみ]は言[い]われた。「見[み]よ、わたしは、地[ち]の面[おもて]にある種[たね]を結[むす]ぶすべての草[くさ]と、実[み]を結[むす]び、その中[なか]に種[たね]を持[も]つすべての木[き]を、あなたがたに与[あた]える。それはあなたがたの食物[しょくもつ]となる。"
  30: "地[ち]のすべての獣[けもの]、天[てん]のすべての鳥[とり]、地[ち]を這[は]うすべてのもの、すなわち命[いのち]の息[いき]を持[も]つものには、すべての青[あお]草[くさ]を食物[しょくもつ]として与[あた]える。」そうなった。"
  31: "神[かみ]は造[つく]られたすべてのものを見[み]て、非常[ひじょう]に良[よ]いと思[おも]われた。夕[ゆう]べがあり、朝[あさ]があった。これが第六[だいろく]の日[ひ]である。"

notes:
  1: "Ἐν ἀρχῇ — 初めに (не «в начале» как наречие времени, а «в начале» творения). ἐποίησεν ὁ θεὸς τὸν οὐρανὸν καὶ τὴν γῆν — 神は天と地を造られた: 天[てん]と地[ち] — весь мир, как в Символе веры."
  2: "ἡ δὲ γῆ ἦν ἀόρατος καὶ ἀκατασκεύαστος — 地は見えず、まだ整っていなかった (LXX; евр. «безвидна и пуста», слав. «невидима и неустроена»; переводим греч.). σκότος ἐπάνω τῆς ἀβύσσου — 闇が深い淵の上に (ἄβυσσος — 淵[ふち]). πνεῦμα θεοῦ — 神の霊[れい] (πνεῦμα без ἅγιον; не 聖霊). ἐπεφέρετο ἐπάνω τοῦ ὕδατος — 水の面を覆っていた (ἐπιφέρομαι — «носиться над»)."
  3: "εἶπεν ὁ θεός — 神は言われた (гонорифик). Γενηθήτω φῶς — 光があれ (императив 3 л.; не «да будет» — архаизм). καὶ ἐγένετο φῶς — すると、光があった."
  4: "εἶδεν ὁ θεὸς τὸ φῶς ὅτι καλόν — 光を良いと見られた (καλός — «хорош, красив»; не «добро»). διεχώρισεν — 分けられた (διαχωρίζω)."
  5: "ἐκάλεσεν τὸ φῶς ἡμέραν — 光を昼と名づけ (καλέω — «называть»). ἑσπέρα καὶ πρωί — 夕べがあり、朝があった (букв. «вечер и утро»). ἡμέρα μία — 第一の日 (LXX: «день один», не «первый»; в японском порядковое естественно, ср. слав.)."
  6: "στερέωμα — 大空[おおぞら] (букв. «твердь»; στερέωμα — «утверждение, свод»). ἀνὰ μέσον ὕδατος καὶ ὕδατος — 水と水を分ける (ἀνὰ μέσον — «между»). καὶ ἐγένετο οὕτως — そうなった."
  7: "τὸ στερέωμα — 大空; ὃ ἦν ὑποκάτω τοῦ στερεώματος — 大空の下の水; τοῦ ἐπάνω τοῦ στερεώματος — 大空の上の水."
  8: "ἐκάλεσεν τὸ στερέωμα οὐρανόν — 大空を天と名づけ. εἶδεν ὁ θεὸς ὅτι καλόν — 良いと見られた (в LXX этот обзор есть и в конце 8-го стиха). ἡμέρα δευτέρα — 第二の日."
  9: "Συναχθήτω τὸ ὕδωρ… εἰς συναγωγὴν μίαν — 水は一つの所に集まり (συναγωγή — «собрание»; здесь «место сбора»). ὀφθήτω ἡ ξηρά — 乾いた地が現れよ (ξηρά — «суша»). καὶ συνήχθη… εἰς τὰς συναγωγὰς αὐτῶν — それぞれの所に集まり (LXX повторяет с «их»; сохранено)."
  10: "τὴν ξηρὰν γῆν — 乾いた地を地と (ξηρά — суша, γῆ — земля). τὰ συστήματα τῶν ὑδάτων — 水の集まり (σύστημα — «скопление»). θαλάσσας — 海." 
  11: "Βλαστησάτω ἡ γῆ βοτάνην χόρτου — 地は草を芽生えさせよ (βοτάνη — «трава, зелень»). σπεῖρον σπέρμα κατὰ γένος καὶ καθ᾽ ὁμοιότητα — 種を結ぶ草を、それぞれの種類に従って (κατὰ γένος — «по роду»). ξύλον κάρπιμον ποιοῦν καρπόν — 実を結ぶ木 (κάρπιμος — «плодоносный»). οὗ τὸ σπέρμα αὐτοῦ ἐν αὐτῷ — その中に種を持つ."
  12: "ἐξήνεγκεν ἡ γῆ — 地は芽生えさせた (ἐκφέρω — «производить»). Повтор 11-го стиха — сохранён, как в LXX и слав."
  13: "ἡμέρα τρίτη — 第三の日."
  14: "φωστῆρες — 光る者[もの] (φωστήρ — «светило»). εἰς σημεῖα καὶ εἰς καιροὺς καὶ εἰς ἡμέρας καὶ εἰς ἐνιαυτούς — しるしとなり、季節と日と年のために (καιρός — «время, срок»)."
  15: "εἰς φαῦσιν ἐπὶ τῆς γῆς — 地の上を照らす光 (φαῦσις — «сияние»)."
  16: "τοὺς δύο φωστῆρας τοὺς μεγάλους — 二つの大きな光る者. εἰς ἀρχὰς τῆς ἡμέρας — 昼を治めるために (ἀρχή — «начало, власть»). εἰς ἀρχὰς τῆς νυκτός — 夜を治めるために. τοὺς ἀστέρας — また星を (LXX добавляет звёзды в этом стихе, слав. тоже)."
  17: "ἔθετο αὐτὰ ὁ θεὸς ἐν τῷ στερεώματι — それらを天の大空に置き (τίθημι). φαίνειν ἐπὶ τῆς γῆς — 地の上を照らさせ (φαίνω — «светить»)."
  18: "ἄρχειν τῆς ἡμέρας καὶ τῆς νυκτός — 昼と夜を治め. διαχωρίζειν ἀνὰ μέσον τοῦ φωτὸς καὶ ἀνὰ μέσον τοῦ σκότους — 光と闇を分け."
  19: "ἡμέρα τετάρτη — 第四の日."
  20: "Ἐξαγαγέτω τὰ ὕδατα ἑρπετὰ ψυχῶν ζωσῶν — 水は生き物の群れを涌き出せ (ἑρπετά — «пресмыкающиеся, ползающие»; ψυχὴ ζῶσα — «живая душа»). πετεινὰ πετόμενα ἐπὶ τῆς γῆς — 鳥は地の上を飛べ (πετεινόν — «птица»)."
  21: "τὰ κήτη τὰ μεγάλα — 大きな海の獣たち (κῆτος — «морское чудовище, кит»). ψυχὴν ζωσῶν ἑρπετῶν — 生き物. πετεινὸν πτερωτόν — 翼のある鳥 (πτερωτός)."
  22: "ηὐλόγησεν — 祝福して (εὐλογέω). Αὐξάνεσθε καὶ πληθύνεσθε — 産めよ、増えよ (букв. «растите и умножайтесь»). πληρώσατε τὰ ὕδατα — 海の水を満たせ."
  23: "ἡμέρα πέμπτη — 第五の日."
  24: "Ἐξαγαγέτω ἡ γῆ ψυχὴν ζῶσαν — 地は生き物を産み出せ. κτήνη — 家畜 (κτῆνος). ἑρπετὰ — 地を這うもの. θηρία — 獣 (θηρίον)."
  25: "κατὰ γένος αὐτῶν — それぞれの種類に従って (повтор сохранён)."
  26: "Ποιήσωμεν ἄνθρωπον — 人を造ろう (LXX мн. ч., как и евр.; в notes не сглаживаем). κατ᾽ εἰκόνα ἡμετέραν καὶ καθ᾽ ὁμοίωσιν — わたしたちの姿に、わたしたちに似せて (εἰκών — 姿[かたち], ὁμοίωσις — подобие; два слова сохранены). ἄρχετε — 支配する (ἄρχω)."
  27: "κατ᾽ εἰκόνα θεοῦ — 神の姿に (повтор, как в LXX). ἄρσεν καὶ θῆλυ ἐποίησεν αὐτούς — 男と女に造られた (ἄρσην — «мужской», θῆλυς — «женский»; не «мужчину и женщину сотворил их» — по-японски естественнее так)."
  28: "ηὐλόγησεν αὐτοὺς ὁ θεός — 彼らを祝福して. κατακυριεύσατε αὐτῆς — 地を支配し (κατακυριεύω — «господствовать»). ἄρχετε — 治めよ."
  29: "ἰδοὺ δέδωκα ὑμῖν — 見よ、わたしは…与える (perfect с силой дарения). πᾶν χόρτον σπόριμον — 種を結ぶすべての草 (σπόριμος — «семяносный»). ξύλον — 木. εἰς βρῶσιν — 食物として (βρῶσις — «пища»)."
  30: "πᾶσι τοῖς θηρίοις… καὶ παντὶ πετεινῷ… καὶ παντὶ ἑρπετῷ — すべての獣、すべての鳥、すべての這うもの. ὃ ἔχει ἐν ἑαυτῷ ψυχὴν ζωῆς — 命の息を持つもの (ψυχὴ ζωῆς — «душа жизни»; 息[いき] — «дыхание», ср. 2:7). πάντα χόρτον χλωρὸν εἰς βρῶσιν — すべての青草を食物として."
  31: "καλὰ λίαν — 非常に良い (λίαν — «весьма»). ἡμέρα ἕκτη — 第六の日."
