verses:
  1: "そのときソロモンは言[い]った。「主[しゅ]は、ご自分[じぶん]が濃[こ]い暗[くら]がりの中[なか]に住[す]むと仰[おっしゃ]った。"
  2: "わたしはあなたの名[な]のために、あなたに聖[せい]なる神殿[しんでん]を建[た]てた。あなたが永遠[えいえん]に住[す]まわれるために備[そな]えられたものである。」"
  3: "王[おう]は顔[かお]を向[む]き直[なお]し、イスラエルすべてを祝福[しゅくふく]した。イスラエルの会衆[かいしゅう]はすべて立[た]っていた。"
  4: "彼[かれ]は言[い]った。「イスラエルの神[かみ]、主[しゅ]はほめたたえられるように。主[しゅ]はご自分[じぶん]の口[くち]で父[ちち]ダビデに語[かた]り、ご自分[じぶん]の手[て]でそれを成[な]し遂[と]げて、こう言[い]われた。"
  5: "『わたしがわたしの民[たみ]をエジプトの地[ち]から導[みちび]き出[だ]した日[ひ]から、イスラエルのすべての部族[ぶぞく]のうちで、わたしの名[な]を置[お]く神殿[しんでん]を建[た]てるために一[ひと]つの町[まち]も選[えら]ばず、わたしの民[たみ]イスラエルを治[おさ]める者[もの]として一人[ひとり]の人[ひと]も選[えら]ばなかった。"
  6: "しかし、わたしの名[な]がそこにあるためにエルサレムを選[えら]び、わたしの民[たみ]イスラエルの上[うえ]に立[た]つ者[もの]としてダビデを選[えら]んだ。』"
  7: "父[ちち]ダビデは、イスラエルの神[かみ]、主[しゅ]の名[な]のために神殿[しんでん]を建[た]てることを心[こころ]に思[おも]っていた。"
  8: "主[しゅ]は父[ちち]ダビデに言[い]われた。『あなたがわたしの名[な]のために神殿[しんでん]を建[た]てることを心[こころ]に思[おも]ったのは、良[よ]いことだ。それはあなたの心[こころ]にあったのだから。"
  9: "しかし、あなたが神殿[しんでん]を建[た]てるのではない。あなたの腰[こし]から出[で]るあなたの子[こ]が、わたしの名[な]のために神殿[しんでん]を建[た]てる。』"
  10: "主[しゅ]は語[かた]られたみ言葉[ことば]を成[な]し遂[と]げ、わたしは父[ちち]ダビデの代[か]わりに立[た]ち、主[しゅ]が言[い]われたとおりにイスラエルの王座[おうざ]に座[すわ]って、イスラエルの神[かみ]、主[しゅ]の名[な]のために神殿[しんでん]を建[た]てた。"
  11: "そして、そこに契約[けいやく]の箱[はこ]を置[お]いた。その中[なか]には主[しゅ]の契約[けいやく]があり、それは主[しゅ]がイスラエルと結[むす]んだものである。」"
  12: "ソロモンは主[しゅ]の祭壇[さいだん]の前[まえ]、イスラエルの会衆[かいしゅう]すべての前[まえ]に立[た]ち、両手[りょうて]を広[ひろ]げた。"
  13: "ソロモンは青銅[せいどう]の台[だい]を作[つく]り、神殿[しんでん]の庭[にわ]の中央[ちゅうおう]に置[お]いていた。その長[なが]さ五[ご]キュビト、幅[はば]五[ご]キュビト、高[たか]さ三[さん]キュビトであった。彼[かれ]はその上[うえ]に立[た]ち、イスラエルの会衆[かいしゅう]すべての前[まえ]で膝[ひざ]まずき、両手[りょうて]を天[てん]に向[む]けて広[ひろ]げた。"
  14: "そして言[い]った。「イスラエルの神[かみ]、主[しゅ]よ。上[うえ]の天[てん]にも下[した]の地[ち]にも、あなたのような神[かみ]はいない。あなたは、心[こころ]を尽[つ]くしてあなたの前[まえ]を歩[あゆ]むしもべに対して、契約[けいやく]と慈[いつく]しみを守[まも]られる方[かた]である。"
  15: "あなたはしもべダビデ、わたしの父[ちち]に語[かた]られたことを守[まも]り、口[くち]で語[かた]られたことを手[て]で成[な]し遂[と]げ、今日[きょう]のこの日[ひ]のとおりにくださった。"
  16: "今[いま]、イスラエルの神[かみ]、主[しゅ]よ。あなたがしもべダビデ、わたしの父[ちち]に語[かた]られたことを、彼[かれ]のために守[まも]ってください。あなたは言[い]われた。『わたしの前[まえ]でイスラエルの王座[おうざ]に座[すわ]る者[もの]が、あなたから断[た]たれることはない。ただし、あなたの子[こ]たちが自分[じぶん]の道[みち]を守[まも]り、わたしの律法[りっぽう]のうちを歩[あゆ]み、あなたがわたしの前[まえ]を歩[あゆ]んだようにするならば。』"
  17: "今[いま]、イスラエルの神[かみ]よ。どうか、あなたがしもべダビデに語[かた]られたみ言葉[ことば]が確[かた]められるように。"
  18: "しかし、神[かみ]は本当[ほんとう]に地上[ちじょう]の人[ひと]々[びと]の間[あいだ]に住[す]まれるのだろうか。もし天[てん]も天[てん]の天[てん]もあなたを入[い]れることができないのなら、わたしが建[た]てたこの神殿[しんでん]はどうだろうか。"
  19: "あなたのしもべの祈[いの]りと願[ねが]いに目[め]を留[と]めてください。主[しゅ]なる神[かみ]よ。しもべが今日[きょう]、あなたの前[まえ]でささげる願[ねが]いと祈[いの]りを聞[き]いてください。"
  20: "あなたの目[め]が昼[ひる]も夜[よる]もこの神殿[しんでん]に、すなわちあなたが『わたしの名[な]はそこに呼[よ]ばれる』と言[い]われたその場所[ばしょ]に開[ひら]かれているように。しもべがこの場所[ばしょ]に向[む]けてする祈[いの]りを聞[き]いてください。"
  21: "あなたのしもべの願[ねが]いと、あなたの民[たみ]イスラエルの願[ねが]いを聞[き]いてください。彼[かれ]らがこの場所[ばしょ]に向[む]かって祈[いの]るとき、あなたは天[てん]にある住[す]まいの場所[ばしょ]で聞[き]き、聞[き]き入[い]れて赦[ゆる]してください。"
  22: "人[ひと]が隣人[りんじん]に罪[つみ]を犯[おか]し、その者[もの]に誓[ちか]いを求[もと]められて誓[ちか]い、この神殿[しんでん]であなたの祭壇[さいだん]の前[まえ]に来[き]て誓[ちか]うとき、"
  23: "あなたは天[てん]から聞[き]き、行[おこな]い、あなたのしもべたちを裁[さば]いてください。悪[わる]い者[もの]を悪[わる]いと定[さだ]めてその道[みち]をその頭[あたま]に返[かえ]し、正[ただ]しい者[もの]を正[ただ]しいと定[さだ]めて、その正[ただ]しさに従[したが]って彼[かれ]に与[あた]えてください。"
  24: "もしあなたの民[たみ]イスラエルが、あなたに罪[つみ]を犯[おか]して敵[てき]の前[まえ]で打[う]ち砕[くだ]かれ、あなたに立[た]ち返[かえ]り、あなたの名[な]を告白[こくはく]し、この神殿[しんでん]であなたの前[まえ]に祈[いの]って願[ねが]うとき、"
  25: "あなたは天[てん]から聞[き]き、あなたの民[たみ]イスラエルの罪[つみ]を赦[ゆる]し、彼[かれ]らを、あなたが彼[かれ]らとその父祖[ふそ]たちに与[あた]えた地[ち]へ連[つ]れ戻[もど]してください。"
  26: "天[てん]が閉[と]ざされて雨[あめ]が降[ふ]らないとき、それは彼[かれ]らがあなたに罪[つみ]を犯[おか]したからであり、彼[かれ]らがこの場所[ばしょ]に向[む]かって祈[いの]り、あなたの名[な]をほめたたえ、あなたが彼[かれ]らを苦[くる]しめたときに彼[かれ]らの罪[つみ]から立[た]ち返[かえ]るなら、"
  27: "あなたは天[てん]から聞[き]き、あなたのしもべたちとあなたの民[たみ]イスラエルの罪[つみ]を赦[ゆる]し、彼[かれ]らがそのうちを歩[あゆ]むべき良[よ]い道[みち]を教[おし]え、あなたがあなたの民[たみ]に嗣業[しぎょう]として与[あた]えた地[ち]に雨[あめ]を降[ふ]らせてください。"
  28: "飢[う]えが地[ち]に起[お]こり、疫病[えきびょう]が起[お]こり、風[かぜ]の害[がい]や黄疸[おうだん]が起[こ]り、いなごや毛虫[けむし]が起[お]こり、敵[てき]が彼[かれ]らの町[まち]々[まち]の前[まえ]で彼[かれ]を攻[せ]めるとき、どのような災[わざわ]い、どのような病[やまい]があっても、"
  29: "どんな人[ひと]でも、あなたの民[たみ]イスラエルのすべての者[もの]でも、自分[じぶん]の打[う]ち傷[きず]と自分[じぶん]の罪[つみ]とを知[し]って、この神殿[しんでん]に手[て]を広[ひろ]げてするどんな祈[いの]り、どんな願[ねが]いでも、"
  30: "あなたは天[てん]にあるあなたの定[さだ]めの住[す]まいから聞[き]き、清[きよ]め、人[ひと]それぞれにその道[みち]に従[したが]って与[あた]えてください。あなたはその心[こころ]を知[し]っておられるからである。あなただけがすべての人[ひと]の子[こ]らの心[こころ]を知[し]っておられる。"
  31: "それは、彼[かれ]らが生[い]きているすべての日[ひ]々[び]、あなたがわたしたちの父祖[ふそ]たちに与[あた]えた地[ち]の面[おもて]で、あなたを恐[おそ]れ、あなたのすべての道[みち]を歩[あゆ]むためである。"
  32: "また、あなたの民[たみ]イスラエルに属[ぞく]さない異国人[いこくじん]が、あなたの大[おお]いなる名[な]と強[つよ]い手[て]と伸[の]ばされた腕[うで]のゆえに、遠[とお]い地[ち]から来[き]て、この場所[ばしょ]に向[む]かって祈[いの]るとき、"
  33: "あなたは天[てん]にあるあなたの定[さだ]めの住[す]まいから聞[き]き、異国人[いこくじん]があなたを呼[よ]び求[もと]めるすべてのことに従[したが]って行[おこな]ってください。それは、地[ち]のすべての民[たみ]があなたの名[な]を知[し]り、あなたの民[たみ]イスラエルが恐[おそ]れるようにあなたを恐[おそ]れ、またこの神殿[しんでん]、わたしが建[た]てたこの家[いえ]にあなたの名[な]が呼[よ]ばれていることを知[し]るためである。"
  34: "あなたの民[たみ]が敵[てき]と戦[たたか]うために出[で]て行[い]くとき、あなたが彼[かれ]らを遣[つか]わす道[みち]で、あなたが選[えら]ばれたこの町[まち]と、わたしがあなたの名[な]のために建[た]てたこの神殿[しんでん]に向[む]かってあなたに祈[いの]るなら、"
  35: "あなたは天[てん]から彼[かれ]らの願[ねが]いと祈[いの]りを聞[き]き、彼[かれ]らのために裁[さば]きを行[おこな]ってください。"
  36: "彼[かれ]らがあなたに罪[つみ]を犯[おか]すとき（罪[つみ]を犯[おか]さない人[ひと]は一人[ひと]もいないからである）、あなたが彼[かれ]らを打[う]ち、彼[かれ]らを敵[てき]の前[まえ]に渡[わた]し、捕[と]り手[て]が彼[かれ]らを敵[てき]の地[ち]、遠[とお]い地[ち]にも近[ちか]い地[ち]にも捕[と]らえて行[い]くなら、"
  37: "彼[かれ]らが連[つ]れ去[さ]られたその地[ち]で心[こころ]に思[おも]い返[かえ]し、捕[と]らわれの地[ち]で、あなたに願[ねが]って言[い]うなら、『わたしたちは罪[つみ]を犯[おか]し、不正[ふせい]を行[おこな]い、悪[わる]を行[おこな]いました』と、"
  38: "彼[かれ]らが捕[と]らわれて行[い]った敵[てき]の地[ち]で、心[こころ]を尽[つ]くし、魂[たましい]を尽[つ]くしてあなたに立[た]ち返[かえ]り、あなたが彼[かれ]らの父祖[ふそ]たちに与[あた]えた地[ち]、あなたが選[えら]ばれた町[まち]、わたしがあなたの名[な]のために建[た]てた神殿[しんでん]に向[む]かってあなたに祈[いの]るなら、"
  39: "あなたは天[てん]にあるあなたの定[さだ]めの住[す]まいから、彼[かれ]らの祈[いの]りと願[ねが]いを聞[き]き、裁[さば]きを行[おこな]い、あなたに罪[つみ]を犯[おか]した民[たみ]を赦[ゆる]してください。"
  40: "今[いま]、主[しゅ]よ。どうか、あなたの目[め]が開[ひら]かれ、あなたの耳[みみ]がこの場所[ばしょ]の願[ねが]いに傾[かたむ]けられますように。"
  41: "今[いま]、主[しゅ]なる神[かみ]よ。あなたと、あなたの力[ちから]の箱[はこ]とが、あなたの安[やす]らぎの場[ば]へ立[た]ち上[あ]がってください。主[しゅ]なる神[かみ]よ、あなたの祭司[さいし]たちが救[すく]いを着[き]せられますように。あなたの聖[せい]なる者[もの]たちが良[よ]いものの中[なか]で喜[よろこ]びますように。"
  42: "主[しゅ]なる神[かみ]よ。あなたが油[あぶら]を注[そそ]がれた者[もの]から顔[かお]を背[そむ]けないでください。あなたのしもべダビデの慈[いつく]しみを思[おも]い起[おこ]してください。」"

notes:
  1: "Κύριος εἶπεν τοῦ κατασκηνῶσαι ἐν γνόφῳ — Господь сказал, чтобы обитать во мраке (γνόφος — мрак, 濃い暗がり). Ср. 3 Цар 8:12. Слав. 6:1 «Господь рече обитати во мгле»."
  2: "ᾠκοδόμηκα οἶκον τῷ ὀνόματί σου ἅγιόν σοι — я построил дом имени Твоему, святой Тебе; ἕτοιμον τοῦ κατασκηνῶσαι εἰς τοὺς αἰῶνας — готовый для обитания в века. В слав. 6:2 нет «престолу твоему» (это слав. 3 Цар 8:13), поэтому 王座 не добавлен. Слав. 6:2."
  3: "ἐπέστρεψεν τὸ πρόσωπον — обратил лицо; εὐλόγησεν τὴν πᾶσαν ἐκκλησίαν — благословил всё собрание; παρειστήκει — стояло (παρίστημι). Ср. 3 Цар 8:14. Слав. 6:3 добавляет «и рече» — речь начинается в 6:4."
  4: "Εὐλογητὸς κύριος ὁ θεὸς Ισραηλ — благословен Господь Бог Израилев; ὃς ἐλάλησεν ἐν στόματι αὐτοῦ — который сказал устами Своими; ἐν χερσὶν αὐτοῦ ἐπλήρωσεν — руками Своими исполнил. Ср. 3 Цар 8:15. Слав. 6:4."
  5: "ἐν ἀνδρὶ ... εἰς ἡγούμενον — в муже... в вождя; οὐκ ἐξελεξάμην ἐν πόλει — не избрал города; τοῦ εἶναι ὄνομά μου ἐκεῖ — чтобы имя Моё было там. Ср. 3 Цар 8:16 (там иначе: «в одном жезле Израиля»). Слав. 6:5."
  6: "ἐν Ιερουσαλημ γενέσθαι τὸ ὄνομά μου — в Иерусалиме быть имени Моему; ἐπάνω τοῦ λαοῦ μου — над народом Моим. Ср. 3 Цар 8:16. Слав. 6:6."
  7: "ἐγένετο ἐπὶ καρδίαν — было на сердце; οἰκοδομῆσαι οἶκον τῷ ὀνόματι κυρίου θεοῦ Ισραηλ — построить дом имени Господа Бога Израилева. Ср. 3 Цар 8:17. Слав. 6:7."
  8: "Διότι ἐγένετο ἐπὶ καρδίαν σου — понеже было на сердце твоём; καλῶς ἐποίησας — хорошо сделал. Ср. 3 Цар 8:18. Слав. 6:8."
  9: "πλὴν σὺ οὐκ οἰκοδομήσεις — однако не ты построишь; ὁ ἐξελεύσεται ἐκ τῆς ὀσφύος σου — который выйдет из чресл твоих (ὀσφύς — чресла, 腰); οὗτος οἰκοδομήσει — он построит; ὅτι — ибо (отдельным словом не выражено). Ср. 3 Цар 8:19. Слав. 6:9."
  10: "ἀνέστησεν κύριος τὸν λόγον — Господь исполнил слово (ἀνίστημι — поставить, исполнить); ἐγενήθην ἀντὶ Δαυιδ — я стал вместо Давида; ἐκάθισα ἐπὶ τὸν θρόνον — сел на престоле. Ср. 3 Цар 8:20. Слав. 6:10."
  11: "ἔθηκα ἐκεῖ τὴν κιβωτόν — поставил там ковчег; ἐν ᾗ ἐκεῖ διαθήκη κυρίου — в котором завет Господень (греч. конструкция с ἐκεῖ); ἣν διέθετο τῷ Ισραηλ — который завещал Израилю. Ср. 3 Цар 8:21 («место ковчегу»). Слав. 6:11."
  12: "ἔστη κατέναντι τοῦ θυσιαστηρίου — стал пред жертвенником; ἔναντι πάσης ἐκκλησίας — пред всем собранием; διεπέτασεν τὰς χεῖρας — распростёр руки. Ср. 3 Цар 8:22 (там сразу «к небу»). Слав. 6:12."
  13: "βάσιν χαλκῆν — медное подножие, помост (βάσις; слав. «стояло медяно»; 青銅の台); πέντε πηχῶν ... τριῶν πηχῶν — пять локтей... три локтя (πῆχυς — キュビト); ἐν μέσῳ τῆς αὐλῆς τοῦ ἱεροῦ — среди двора святилища; ἔπεσεν ἐπὶ τὰ γόνατα — пал на колени. В 3 Цар 8 этого стиха нет — особенность 2 Пар. Слав. 6:13."
  14: "οὐκ ἔστιν ὅμοιός σοι θεός — нет подобного Тебе Бога; φυλάσσων τὴν διαθήκην καὶ τὸ ἔλεος — хранящий завет и милость; τοῖς πορευομένοις ἐναντίον σου ἐν ὅλῃ καρδίᾳ — ходящим пред Тобою всем сердцем. Ср. 3 Цар 8:23. Слав. 6:14."
  15: "ἃ ἐφύλαξας τῷ παιδί σου — что сохранил рабу Твоему; ἐλάλησας ἐν στόματί σου — сказал устами Твоими; ἐν χερσίν σου ἐπλήρωσας — руками Твоими исполнил; ὡς ἡ ἡμέρα αὕτη — как день сей. Ср. 3 Цар 8:24. Слав. 6:15."
  16: "Οὐκ ἐκλείψει σοι ἀνήρ — не исчезнет у тебя муж (ἐκλείπω); ἀπὸ προσώπου μου — от лица Моего; καθῆσθαι ἐπὶ θρόνου Ισραηλ — сидеть на престоле Израиля; τοῦ πορεύεσθαι ἐν τῷ νόμῳ μου — ходить в законе Моём (в 3 Цар 8:25 — «как ты ходил предо Мною»); ὡς ἐπορεύθης ἐναντίον μου — как ты ходил предо Мною. Слав. 6:16 повторяет формулу 6:15 («и глаголал еси усты твоими и исполнил еси якоже в день сей, глаголя») — дубль не внесён. Слав. 6:16."
  17: "πιστωθήτω δὴ τὸ ῥῆμά σου — да будет верно, подтверждено слово Твоё (πιστόω); ὃ ἐλάλησας τῷ παιδί σου τῷ Δαυιδ — которое сказал рабу Твоему Давиду. Ср. 3 Цар 8:26. Слав. 6:17."
  18: "εἰ ἀληθῶς κατοικήσει θεὸς μετὰ ἀνθρώπων ἐπὶ τῆς γῆς; — вопрос: поистине ли Бог будет жить с людьми на земле; εἰ ὁ οὐρανὸς καὶ ὁ οὐρανὸς τοῦ οὐρανοῦ οὐκ ἀρκέσουσίν σοι — если небо и небо небес не вместят Тебя (ἀρκέω); τίς ὁ οἶκος οὗτος — каков дом сей. Ср. 3 Цар 8:27. Слав. 6:18."
  19: "ἐπιβλέψῃς — призри (ἐπιβλέπω); δέησις — прошение; τοῦ ἐπακοῦσαι τῆς δεήσεως καὶ τῆς προσευχῆς — чтобы услышать прошение и молитву (ἐπακούω); ἧς ὁ παῖς σου προσεύχεται — которую раб Твой молится. Ср. 3 Цар 8:28. Слав. 6:19 «и на молитву мою... услышати молитвы моя и моление»."
  20: "ὀφθαλμοὺς ἀνεῳγμένους — очи отверсты (ἀνοίγω); ἡμέρας καὶ νυκτός — день и ночь; ὃν εἶπας ἐπικληθῆναι τὸ ὄνομά σου ἐκεῖ — о котором Ты сказал, что имя Твоё будет призвано там (ἐπικαλέω); τοῦ ἀκοῦσαι τῆς προσευχῆς — чтобы услышать молитву. Ср. 3 Цар 8:29. Слав. 6:20."
  21: "ἀκούσῃ ... εἰσακούσῃ — услышишь... услышишь (ἀκούω / εἰσακούω); ἃ ἂν προσεύξωνται — о чём бы ни молились; ἐν τῷ τόπῳ τῆς κατοικήσεώς σου ἐκ τοῦ οὐρανοῦ — на месте обитания Твоего с неба; ἵλεως ἔσῃ — будешь милостив. Ср. 3 Цар 8:30. Слав. 6:21."
  22: "ἁμάρτῃ τῷ πλησίον — согрешит против ближнего; λάβῃ ἐπ᾿ αὐτὸν ἀρὰν τοῦ ἀρᾶσθαι αὐτόν — примет на себя проклятие, чтобы проклясть его (ἀρά, ἀράομαι); ἀράσηται — проклянёт, произнесёт заклятие. Слав. 6:22 «приимет на него клятву еже клясти его... и прокленет»; существительное передано 誓い, как в 3 Цар 8:31, глагол — 誓う."
  23: "κρινεῖς τοὺς δούλους σου — будешь судить рабов Твоих (в 3 Цар 8:32 — «народ Твой Израиль»); ἀποδοῦναι τῷ ἀνόμῳ ... ὁδοὺς αὐτοῦ εἰς κεφαλὴν αὐτοῦ — воздать беззаконному, обратить пути его на голову его; δικαιῶσαι δίκαιον — оправдать праведного; κατὰ τὴν δικαιοσύνην αὐτοῦ — по правде его. Ср. 3 Цар 8:32. Слав. 6:23."
  24: "θραυσθῇ — будет сокрушён (θραύω); ἐὰν ἁμάρτωσίν σοι — если согрешат Тебе; ἐπιστρέψωσιν — обратятся; ἐξομολογήσωνται τῷ ὀνόματί σου — исповедают имя Твоё; δεηθῶσιν — умолят. Ср. 3 Цар 8:33. Слав. 6:24."
  25: "ἵλεως ἔσῃ ταῖς ἁμαρτίαις — будешь милостив к грехам; ἀποστρέψεις αὐτοὺς εἰς τὴν γῆν — возвратишь их в землю; ἣν ἔδωκας αὐτοῖς καὶ τοῖς πατράσιν αὐτῶν — которую дал им и отцам их. Ср. 3 Цар 8:34. Слав. 6:25."
  26: "ἐν τῷ συσχεθῆναι τὸν οὐρανὸν — когда небо заключится (συσχῶ — заключить, сдержать; в слав. «егда заключиши небо» — 2-е л., по МТ; в тексте по LXX, как в 3 Цар 8:35); ἁμαρτήσονταί σοι — согрешат Тебе; αἰνέσουσιν τὸ ὄνομά σου — восхвалят имя Твоё (в 3 Цар 8:35 — «исповедают»); ἀπὸ τῶν ἁμαρτιῶν αὐτῶν ἐπιστρέψουσιν — обратятся от грехов своих; ταπεινώσεις αὐτούς — Ты смиришь их. Слав. 6:26."
  27: "δηλώσεις αὐτοῖς τὴν ὁδὸν τὴν ἀγαθήν — укажешь им добрый путь (δηλόω); ἐν ᾗ πορεύσονται ἐν αὐτῇ — по которому пойдут; δώσεις ὑετὸν ἐπὶ τὴν γῆν — дашь дождь на землю; εἰς κληρονομίαν — в наследие (嗣業). Ср. 3 Цар 8:36. Слав. 6:27."
  28: "λιμός, θάνατος, ἀνεμοφθορία καὶ ἴκτερος, ἀκρίς καὶ βροῦχος — голод, мор, повреждение от ветра и желтуха, саранча и червь (ἀνεμοφθορία — «порча от ветра», слав. «воздуха растление», 風の害; ἴκτερος — желтуха, слав. «иктер», 黄疸; ἀκρίς — いなご; βροῦχος — 毛虫, как в 3 Цар 8:37); θλίψῃ — стеснит (θλίβω); κατὰ πᾶσαν πληγὴν καὶ πᾶν πόνον — по всякому поражению и всякой боли. Слав. 6:28."
  29: "πᾶσα προσευχὴ καὶ πᾶσα δέησις — всякая молитва и всякое прошение; ἐὰν γνῷ ἄνθρωπος τὴν ἁφὴν αὐτοῦ — если познает человек язву свою (ἁφή — прикосновение, язва); καὶ τὴν μαλακίαν αὐτοῦ — и слабость, недуг свой (μαλακία; слав. «и грех свой» — в тексте 罪 по csl); διαπετάσῃ τὰς χεῖρας — распрострёт руки. Слав. 6:29."
  30: "ἐξ ἑτοίμου κατοικητηρίου σου — из готового жилища Твоего; ἱλάσῃ — умилостивишь, очистишь (ἱλάσκομαι; слав. «очести» — 清め); δώσεις ἀνδρὶ κατὰ τὰς ὁδούς αὐτοῦ — дашь мужу по путям его; μόνος γινώσκεις τὴν καρδίαν — один знаешь сердце. Ср. 3 Цар 8:39. Слав. 6:30."
  31: "φοβῶνται τὰς ὁδούς σου πάσας — боялись путей Твоих всех (букв.); слав. «да боятся тебе, еже ходити бо всех путех твоих» — добавлено «ходить»; в тексте あなたを恐れ、あなたのすべての道を歩む по csl; ἃς αὐτοὶ ζῶσιν — которые они живут; ἐπὶ προσώπου τῆς γῆς — на лице земли. Слав. 6:31."
  32: "ἀλλότριος — чужеземец (異国人); ὃς οὐκ ἐκ τοῦ λαοῦ σου Ισραηλ ἐστὶν αὐτός — который не из народа Твоего Израиля; ἔλθῃ ἐκ γῆς μακρόθεν — придёт из земли издалека; διὰ τὸ ὄνομά σου τὸ μέγα — ради имени Твоего великого; τὴν χεῖρά σου τὴν κραταιὰν καὶ τὸν βραχίονά σου τὸν ὑψηλόν — руку Твою крепкую и мышцу Твою высокую; προσεύξωνται εἰς τὸν τόπον τοῦτον — помолятся на месте сем. Ср. 3 Цар 8:41–42. Слав. 6:32."
  33: "ποιήσεις κατὰ πάντα, ὅσα ἐὰν ἐπικαλέσηταί σε — сделаешь по всему, что призовёт Тебя; ὅπως γνῶσιν πάντες οἱ λαοὶ τῆς γῆς — чтобы познали все народы земли; ἐπικέκληται τὸ ὄνομά σου ἐπὶ τὸν οἶκον — имя Твоё наречено на доме. Ср. 3 Цар 8:43. Слав. 6:33."
  34: "ἐξέλθῃ ... εἰς πόλεμον — выйдет на войну; ἐν ὁδῷ, ᾗ ἀποστελεῖς αὐτούς — путём, которым Ты пошлёшь их; κατὰ τὴν ὁδὸν τῆς πόλεως — к пути города (слав. «по пути града»); οὗ ᾠκοδόμησα τῷ ὀνόματί σου — который я построил имени Твоему. Ср. 3 Цар 8:44. Слав. 6:34."
  35: "ἀκούσῃ ... τῆς δεήσεως ... καὶ τῆς προσευχῆς — услышишь прошение и молитву; ποιήσεις τὸ δικαίωμα αὐτῶν — сделаешь им оправдание, суд (δικαίωμα). Ср. 3 Цар 8:45. Слав. 6:35."
  36: "[ὅτι οὐκ ἔσται ἄνθρωπος, ὃς οὐχ ἁμαρτήσεται] — ибо не будет человека, который не согрешит (в gr-lxx-byz в квадратных скобках, но текст есть — 〔…〕 не ставим); πατάξεις αὐτούς — поразишь их (в 3 Цар 8:46 — «прогневаешься»); παραδώσεις κατὰ πρόσωπον ἐχθρῶν — предашь пред лицем врагов (слав. «в руки врагов»); αἰχμαλωτεύσουσιν οἱ αἰχμαλωτεύοντες — уведут пленившие; εἰς γῆν μακρὰν ἢ ἐγγύς — в землю далёкую или близкую. Слав. 6:36."
  37: "ἐπιστρέψωσιν καρδίαν αὐτῶν — обратят сердце своё; ἐν τῇ γῇ αὐτῶν, οὗ μετήχθησαν — в земле их, куда переселены (μετάγω); δεηθῶσίν σου — умолят Тебя; Ἡμάρτομεν ἠδικήσαμεν ἠνομήσαμεν — согрешили, неправдовали, беззаконновали. Слав. 6:37 добавляет «и тамо обратятся» — дубль не внесён."
  38: "ἐν ὅλῃ καρδίᾳ καὶ ἐν ὅλῃ ψυχῇ — всем сердцем и всею душою; ἐν γῇ αἰχμαλωτευσάντων αὐτούς — в земле пленивших их; προσεύξωνται ὁδὸν γῆς αὐτῶν — помолятся к пути земли их (ὁδός как направление); ἧς ἔδωκας τοῖς πατράσιν αὐτῶν — которую дал отцам их. Ср. 3 Цар 8:48. Слав. 6:38."
  39: "ἀκούσῃ ... τῆς προσευχῆς ... καὶ τῆς δεήσεως — услышишь молитву и прошение; ποιήσεις κρίματα — совершишь суды; ἵλεως ἔσῃ τῷ λαῷ τῷ ἁμαρτόντι σοι — будешь милостив народу, согрешившему Тебе. Ср. 3 Цар 8:49–50. Слав. 6:39."
  40: "ἔστωσαν ... οἱ ὀφθαλμοί σου ἀνεῳγμένοι — да будут очи Твои отверсты; τὰ ὦτά σου ἐπήκοα — уши Твои внимательны (ἐπήκοος); εἰς τὴν δέησιν τοῦ τόπου τούτου — к прошению места сего. Ср. 3 Цар 8:52. Слав. 6:40."
  41: "ἀνάστηθι ... εἰς τὴν κατάπαυσίν σου — восстань в покой Твой (κατάπαυσις — покой, 休み); ἡ κιβωτὸς τῆς ἰσχύος σου — ковчег силы Твоей; ἐνδύσαιντο σωτηρίαν — да облекутся в спасение (ἐνδύω); οἱ υἱοί σου εὐφρανθήτωσαν ἐν ἀγαθοῖς — сыны Твои да возвеселятся в благах. В gr οἱ υἱοί σου — сыны Твои, в слав. «преподобнии твои» (по Пс 131:9) — в тексте 聖なる者たち по csl. Стих — начало Пс 131:8–10, иное окончание молитвы, чем в 3 Цар 8:53. Слав. 6:41."
  42: "μὴ ἀποστρέψῃς τὸ πρόσωπον τοῦ χριστοῦ σου — не отврати лица помазанника Твоего (χριστός — 油を注がれた者, как в Псалтири); μνήσθητι τὰ ἐλέη Δαυιδ τοῦ δούλου σου — вспомни милости Давида, раба Твоего. Слав. 6:42. Здесь закрывается речь Соломона (4–11; 14–42; 12–13 — повествование)."
