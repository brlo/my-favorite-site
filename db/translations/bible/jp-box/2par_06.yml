# jp-box, 2-я Паралипоменон, глава 6. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); второй свидетель церковного текста —
# церковнославянский (csl-ru), по паритету (docs/japanese-bible.md); ru
# (Синодальный) — только для понимания, не источник. jp-joc в книге нет;
# jp-ni (под авторским правом) не использовался.
# Язык — современный 常体 (молитва тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 6: слово Соломона о мраке (1–2), благословение собрания (3–11),
# молитва посвящения (12–42). Параллель — 3 Цар 8:12–53, но композиция иная:
# 6:1–2 = 3 Цар 8:12–13, далее 6:3–42 = 3 Цар 8:14–53; окончание молитвы
# (6:41–42) — Пс 131:8–10, а не благословение 3 Цар 8:54–61. В 3 Цар между
# 8:30 и 8:31 нет стихов 2 Пар 6:12–13 (медный помост) — это особенность 2 Пар.
# Речи: Соломон — 「…」 (1–2; 4–11; 14–42); слова Господа внутри его речи —
# 『…』 (5–6, 8–9, 16, 20); слова народа — 『…』 (37). 6:12–13 — повествование.
# 〔…〕 нет. Слав. в 6:16 повторяет формулу 6:15 — дубль не внесён; в 6:19
# «молитвы моя»; в 6:26 «егда заключиши» (2-е л.); в 6:30 «очести»;
# в 6:31 добавлено «ходить»; в 6:41 «преподобнии твои». Всё отмечено в notes.
# Сносок ⟨…⟩ нет: 神殿, 至聖所, 契約の箱, 祭壇, 燔祭, 祭司, 異国人, 嗣業 уже в корпусе.

