verses:
  1: "エジプトの王[おう]は、海[うみ]の岸[きし]の砂[すな]のような多[おお]くの軍勢[ぐんぜい]と多[おお]くの船[ふね]を集[あつ]め、デメトリオスの王国[おうこく]を欺[あざむ]きによって掌握[しょうあく]し、自分[じぶん]の王国[おうこく]に加[くわ]えようと求[もと]めた。"
  2: "彼[かれ]は平和[へいわ]な言葉[ことば]とともにシリアへ出[で]て行[い]った。町々[まちまち]の者[もの]たちは彼[かれ]に門[もん]を開[あ]き、彼[かれ]を迎[むか]えた。アレクサンドロス王[おう]が彼[かれ]を迎[むか]えるよう命[めい]じていたからである。彼[かれ]がその岳父[がくふ]であったからである。"
