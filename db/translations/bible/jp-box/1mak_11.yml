  4: "彼[かれ]がアゾトに近[ちか]づくと、人[ひと]々[びと]は彼[かれ]に、焼[や]かれたダゴンの神殿[しんでん]、破壊[はかい]されたアゾトとその周辺[しゅうへん]の町々[まちまち]、投[な]げ捨[す]てられた体[からだ]、戦[たたか]いで焼[や]かれた者[もの]たちを見[み]せた。彼[かれ]らはそれらを彼[かれ]の道[みち]に積[つ]み上[あ]げていたからである。"
