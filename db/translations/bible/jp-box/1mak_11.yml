  35: "『また、今[いま]から後[のち]、われわれに属[ぞく]する十分[じゅうぶん]の一[いち]と税[ぜい]、塩[しお]の池[いけ]、われわれに属[ぞく]する冠[かんむり]の税[ぜい]、これらすべてを彼[かれ]らに与[あた]える。』"
