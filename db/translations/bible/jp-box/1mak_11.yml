  6: "ヨナタンは栄光[えいこう]のうちにヤッファで王[おう]に会[あ]い、彼[かれ]らは互[たが]いに挨拶[あいさつ]し、そこで一夜[いちや]を過[す]ごした。"
  7: "ヨナタンはエレウテロスと呼[よ]ばれる川[かわ]まで王[おう]とともに歩[あゆ]み、エルサレムへ帰[かえ]った。"
  8: "プトレマイオス王[おう]は海沿[うみぞ]いの町々[まちまち]を、海辺[うみべ]のセレウキアまで支配[しはい]し、アレクサンドロスに対[たい]して悪[わる]い計略[けいりゃく]を巡[めぐ]らせた。"
  9: "彼[かれ]はデメトリオス王[おう]に使者[ししゃ]を送[おく]って言[い]った。「来[き]なさい。われわれは互[たが]いに契約[けいやく]を結[むす]ぼう。わたしはあなたに、アレクサンドロスが持[も]っていたわたしの娘[むすめ]を与[あた]え、あなたはあなたの父[ちち]の王国[おうこく]を治[おさ]めるだろう。"
  10: "わたしは彼[かれ]に娘[むすめ]を与[あた]えたことを後悔[こうかい]している。彼[かれ]はわたしを殺[ころ]そうと求[もと]めたからである。」"
  11: "プトレマイオスはアレクサンドロスを非難[ひなん]した。自分[じぶん]がその王国[おうこく]を欲[ほっ]していたからである。"
  12: "彼[かれ]は彼[かれ]から娘[むすめ]を奪[うば]い、デメトリオスに与[あた]え、アレクサンドロスと疎遠[そえん]になり、彼[かれ]らの敵意[てきい]が明[あき]らかになった。"
  13: "プトレマイオスはアンティオキアに入[はい]り、アジアの冠[かんむり]とエジプトの冠[かんむり]の二[ふた]つを自分[じぶん]の頭[あたま]に置[お]いた。"
  14: "アレクサンドロス王[おう]はその頃[ころ]キリキアにいた。その地方[ちほう]の者[もの]たちが離反[りはん]していたからである。"
  15: "アレクサンドロスはこれを聞[き]いて彼[かれ]に対[たい]して戦[たたか]いに出[で]た。プトレマイオスは軍勢[ぐんぜい]を率[ひき]いて出[で]て、強[つよ]い力[ちから]で彼[かれ]を迎[むか]え撃[う]ち、彼[かれ]を追[お]い返[かえ]した。"
  16: "アレクサンドロスはそこで身[み]を守[まも]るためにアラビアへ逃[に]げ、プトレマイオス王[おう]は高[たか]められた。"
  17: "アラビア人[じん]ザブディエルはアレクサンドロスの頭[あたま]を切[き]り落[お]とし、プトレマイオスに送[おく]った。"
  18: "プトレマイオス王[おう]は三日目[みっかめ]に死[し]に、彼[かれ]の要塞[ようさい]にいた者[もの]たちは要塞[ようさい]の者[もの]たちによって滅[ほろ]ぼされた。"
  19: "デメトリオスは百六十七年[ひゃくろくじゅうしちねん]に王[おう]となった。"
  20: "その日々[ひび]にヨナタンはユダヤの者[もの]たちを集[あつ]め、エルサレムのアクラを攻[せ]めようとして、それに対[たい]して多[おお]くの兵器[へいき]を造[つく]った。"
  21: "しかし、自分[じぶん]の民族[みんぞく]を憎[にく]む者[もの]たち、不法[ふほう]な者[もの]たちのうちのある者[もの]たちが王[おう]のもとへ行[い]き、ヨナタンがアクラを包囲[ほうい]していると告[つ]げた。"
  22: "王[おう]は聞[き]いて怒[いか]った。彼[かれ]はすぐにプトレマイスへ来[き]て、ヨナタンに、アクラを包囲[ほうい]してはならない、直[ただ]ちにプトレマイスへ来[き]て自分[じぶん]に会[あ]い、語[かた]り合[あ]うようにと書[か]いた。"
  23: "ヨナタンはこれを聞[き]くと、包囲[ほうい]を続[つづ]けるよう命[めい]じ、イスラエルの長老[ちょうろう]たちと祭司[さいし]たちのうちから者[もの]を選[えら]び、自分[じぶん]を危険[きけん]にさらした。"
  24: "彼[かれ]は銀[ぎん]と金[きん]、衣服[いふく]、その他[ほか]の多[おお]くの贈[おく]り物[もの]を取[と]って、プトレマイスの王[おう]のもとへ行[い]き、彼[かれ]の前[まえ]で恵[めぐ]みを得[え]た。"
  25: "彼[かれ]の民族[みんぞく]のうちのある不法[ふほう]な者[もの]たちが彼[かれ]を訴[うった]えた。"
  26: "しかし王[おう]は、彼[かれ]より前[まえ]の者[もの]たちが彼[かれ]に対[たい]して行[おこな]ったとおりに彼[かれ]に行[おこな]い、すべての友[とも]たちの前[まえ]で彼[かれ]を高[たか]めた。"
  27: "彼[かれ]に大祭司[だいさいし]の職[しょく]を確認[かくにん]し、以前[いぜん]に持[も]っていた他[ほか]のすべての名誉[めいよ]あるものを確認[かくにん]し、彼[かれ]を最初[さいしょ]の友[とも]たちの長[ちょう]とした。"
  28: "ヨナタンは王[おう]に、ユダヤと三[みっ]つの地方[ちほう]とサマリアを免税[めんぜい]にしてもらうよう願[ねが]い、三百[さんびゃく]タラントを約束[やくそく]した。"
  29: "王[おう]はこれを喜[よろこ]び、ヨナタンに、これらすべてについて次[つぎ]のような手紙[てがみ]を書[か]いた。"
  30: "「王[おう]デメトリオス、兄弟[きょうだい]ヨナタンとユダヤ人[じん]の民族[みんぞく]に挨拶[あいさつ]を送[おく]る。"
  31: "われわれがわれわれの親族[しんぞく]ラステネスにあなたがたについて書[か]いた手紙[てがみ]の写[うつ]しを、あなたがたにも書[か]いた。あなたがたが知[し]るためである。"
