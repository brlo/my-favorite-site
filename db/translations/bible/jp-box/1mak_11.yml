  37: "『今[いま]、これらの写[うつ]しを作[つく]るよう心[こころ]を配[くば]り、それをヨナタンに与[あた]え、聖[せい]なる山[やま]の目立[めだ]つ場所[ばしょ]に置[お]くように。』」"
  38: "デメトリオス王[おう]は、地[ち]が自分[じぶん]の前[まえ]で静[しず]まり、だれも自分[じぶん]に立[た]ち向[む]かわないのを見[み]て、自分[じぶん]のすべての軍勢[ぐんぜい]を、それぞれ自分[じぶん]の場所[ばしょ]へ帰[かえ]した。ただし、諸民族[しょみんぞく]の島々[しまじま]から雇[やと]った異国[いこく]の軍勢[ぐんぜい]は除[のぞ]いた。父[ちち]たちのすべての軍勢[ぐんぜい]が彼[かれ]を憎[にく]んだからである。"
