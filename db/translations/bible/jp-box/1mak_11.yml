  65: "シモンはベテズルに陣[じん]を敷[し]き、多[おお]くの日[ひ]それを攻[せ]め、これを封鎖[ふうさ]した。"
  66: "彼[かれ]らは彼[かれ]に和[わ]を求[もと]めた。彼[かれ]はそれを受[う]け入[い]れ、彼[かれ]らをそこから追[お]い出[だ]し、町[まち]を掌握[しょうあく]して、そこに守備隊[しゅびたい]を置[お]いた。"
  67: "ヨナタンとその陣営[じんえい]はゲネサレの水[みず]のほとりに陣[じん]を敷[し]いた。朝[あさ]早[はや]く、彼[かれ]らはアソルの平地[へいち]へ出[で]た。"
  68: "見[み]よ、異邦人[いほうじん]の軍勢[ぐんぜい]が平地[へいち]で彼[かれ]に会[あ]した。彼[かれ]らは山[やま]の中[なか]に彼[かれ]に対[たい]して待[ま]ち伏[ぶ]せを置[お]き、自分[じぶん]たちは正面[しょうめん]から会[あ]した。"
  69: "待[ま]ち伏[ぶ]せの者[もの]たちはその場所[ばしょ]から立[た]ち上[あ]がり、戦[たたか]いを交[ま]えた。"
  70: "ヨナタンとともにいた者[もの]は皆[みな]逃[に]げ、軍勢[ぐんぜい]の長[ちょう]たちであるアブサロムの子[こ]マタティアとハルフィの子[こ]ユダのほかは、彼[かれ]らのうち一人[ひとり]も残[のこ]らなかった。"
  71: "ヨナタンは自分[じぶん]の衣[ころも]を裂[さ]き、頭[あたま]に土[つち]を置[お]き、祈[いの]った。"
  72: "そして彼[かれ]らに向[む]かって引[ひ]き返[かえ]し、戦[たたか]って彼[かれ]らを打[う]ち破[やぶ]った。彼[かれ]らは逃[に]げた。"
  73: "彼[かれ]から逃[に]げた者[もの]たちはこれを見[み]て、彼[かれ]のもとへ戻[もど]り、彼[かれ]とともにカデスまで、彼[かれ]らの陣営[じんえい]まで追[お]った。そしてそこに陣[じん]を敷[し]いた。"
  74: "その日[ひ]、異邦人[いほうじん]のうち三千人[さんぜんにん]ほどの者[もの]が倒[たお]れた。ヨナタンはエルサレムへ帰[かえ]った。"

notes:
  1: "βασιλεὺς Αἰγύπτου — «царь Египетский» (Птолемей VI Филометор); ὡς ἡ ἄμμος ἡ παρὰ τὸ χεῖλος τῆς θαλάσσης — «как песок при берегу моря»."
  3: "φρουρὰν ἐν ἑκάστῃ πόλει — «стражу (гарнизон) в каждом городе»."
  4: "τὸ ἱερὸν Δαγων ἐμπεπυρισμένον — «святилище Дагона сожжённое»; θιμωνιάς — «кучи» (слав. «сметаша бо я в купы»); τὰ περιπόλια — «предместья», 周辺の町々."
  5: "εἰς τὸ ψογίσαι αὐτόν — «чтобы очернить (порицать) его» (слав. «еже бы возненавидети его»); ἐσίγησεν — «умолчал»."
  8: "τῆς παραλίας — «приморья»; Σελευκείας τῆς παραθαλασσίας — 海辺のセレウキア; λογισμοὺς πονηρούς — «помыслы злые»."
  9: "Δεῦρο συνθώμεθα ... διαθήκην — «приди, заключим договор»; слав. «составим между нама завет»."
  10: "μεταμεμέλημαι — «я раскаялся» (слав. «раскаяхся»)."
  11: "ἐψόγισεν αὐτὸν χάριν τοῦ ἐπιθυμῆσαι αὐτὸν τῆς βασιλείας αὐτοῦ — «порицал его ради того, что он возжелал царства его»: в греч. неясно, кто возжелал (Птолемей царства Александра или наоборот). По слав./ru и по контексту 11:8 — Птолемей; так и переведено. Слав. «похули его ради похотения царства его»."
  13: "περιέθετο τὸ διάδημα τῆς Ἀσίας — «возложил на себя венец Азии»; слав. сводит обе клаузы в одну: «возложи две диадимы, асийскую и египетскую»."
  15: "ἐν χειρὶ ἰσχυρᾷ — «рукою крепкою»; ἐτροπώσατο — «обратил в бегство»."
  17: "Ζαβδιηλ ὁ Ἄραψ — ザブディエル (слав. «завдииль»); ἀφεῖλεν τὴν κεφαλήν — «снял голову»."
  18: "ἀπώλοντο ὑπὸ τῶν ἐν τοῖς ὀχυρώμασιν — тёмное место: «погибли от бывших в крепостях» (слав. так же; ru «истреблены жителями крепостей»)."
  20: "τοὺς ἐκ τῆς Ιουδαίας — «бывших из Иудеи»; ἄκρα — アクラ."
  22: "ἀναζεύξας — «снявшись (поспешно собравшись)»; συμμίσγειν — «сойтись, переговорить»."
  23: "ἐπέλεξεν τῶν πρεσβυτέρων Ισραηλ καὶ τῶν ἱερέων — «избрал из старейшин Израиля и священников»; ἔδωκεν ἑαυτὸν τῷ κινδύνῳ — «отдал себя опасности»."
  26: "καθὼς ἐποίησαν αὐτῷ οἱ πρὸ αὐτοῦ — «как поступали с ним бывшие прежде него»."
  27: "ἔστησεν αὐτῷ τὴν ἀρχιερωσύνην — «утвердил за ним первосвященство»; τῶν πρώτων φίλων ἡγεῖσθαι — «быть вождём (первым) первых друзей»."
  28: "ἀφορολόγητον — «свободной от податей» (слав. «безданну»); τὰς τρεῖς τοπαρχίας — «три топархии» (области); τάλαντα τριακόσια — 三百 талантов."
  31: "τὸ ἀντίγραφον τῆς ἐπιστολῆς, ἧς ἐγράψαμεν Λασθένει — «список письма, которое мы написали Ластене»; слав. «ласфену сроднику»."
  32: "Λασθένει τῷ πατρὶ — «Ластене отцу» (слав. «ласфену отцу»). Здесь начинается вложенное письмо — 『…』."
  34: "τοὺς τρεῖς νομοὺς Αφαιρεμα καὶ Λυδδα καὶ Ραθαμιν — アフェレマ、リダ、ラマテム; πάντα τὰ συγκυροῦντα αὐτοῖς πᾶσιν τοῖς θυσιάζουσιν — «всё, принадлежащее им, всем приносящим жертвы»; ἀντὶ τῶν βασιλικῶν — «вместо царских (податей)»."
  35: "τὰς τοῦ ἁλὸς λίμνας — «соляные озёра» (слав. «соли точила»); τοὺς στεφάνους — «венцы» (венечный сбор)."
  36: "Слав. в начале стиха добавляет «вся щедро оставляем им» (дословный повтор конца 35) — в LXX нет; как дубль в текст не внесено."
  38: "πλὴν τῶν ξένων δυνάμεων, ὧν ἐξενολόγησεν ἀπὸ τῶν νήσων τῶν ἐθνῶν — «кроме иноземных войск, которые он нанял с островов народов»; ἤχθραναν αὐτῷ πᾶσαι αἱ δυνάμεις αἱ ἀπὸ τῶν πατέρων — «возненавидели его все войска от отцов»."
  39: "Τρύφων — トリュフォン; Ιμαλκουε τὸν Ἄραβα — イマルクエ (слав. «емалкуя»); ὃς ἔτρεφεν Ἀντίοχον τὸ παιδάριον — «который вскормил Антиоха, отрока»."
  40: "προσήδρευεν — «настаивал, сидел при нём»; ὅπως παραδοῖ αὐτὸν αὐτῷ — «чтобы он выдал его ему»; ἔμεινεν ἐκεῖ ἡμέρας πολλάς — «остался там дни многие»."
  42: "δόξῃ δοξάσω σε — «славою прославлю тебя»; ἐὰν εὐκαιρίας τύχω — «если благоприятного времени достигну»."
  45: "εἰς ἀνδρῶν δώδεκα μυριάδας — «до двенадцати мириад (120 000) мужей»; ἠβούλοντο ἀνελεῖν — «хотели убить»."
  47: "εἰς μυριάδας δέκα — «до десяти мириад (100 000)»; слав. относит избиение к 48 — держим LXX, содержание то же."
  49: "ἠσθέννησαν ταῖς διανοίαις — «изнемогли мыслями»; μετὰ δεήσεως — «с молением»."
  50: "Δὸς ἡμῖν δεξιάς — «дай нам десницу (руку)», т.е. мир; 和を許す."
  53: "ἐψεύσατο πάντα, ὅσα εἶπεν — «солгал во всём, что сказал»; οὐκ ἀνταπέδωκεν τὰς εὐνοίας — «не воздал за благодеяния»."
  54: "Ἀντίοχος ... παιδάριον νεώτερον — «Антиох, отрок младший» (Антиох VI); ἐπέθετο διάδημα — «возложил венец»."
  56: "τὰ θηρία — «зверей», т.е. боевых слонов (象)."
  57: "ἐπὶ τῶν τεσσάρων νομῶν — «над четырьмя областями»; τῶν φίλων τοῦ βασιλέως — «друзей царя»."
  58: "χρυσώματα — «золотые сосуды (утварь)»; διακονία — «служение, утварь»; πόρπην χρυσῆν — 金の留め金."
  59: "ἀπὸ τῆς κλίμακος Τύρου — «от области (лестницы) Тирской»; слав. «от страны тира»."
  60: "διεπορεύετο πέραν τοῦ ποταμοῦ — «проходил за рекою» (Иордан); ἐνδόξως — «с честью»."
  61: "τὰ περιπόλια αὐτῆς — «предместья её»; ἐσκύλευσεν — «разграбил»."
  62: "ἔδωκεν αὐτοῖς δεξιάς — «дал им десницу», т.е. мир; διῆλθεν τὴν χώραν ἕως Δαμασκοῦ — «прошёл страну до Дамаска»."
  63: "Κηδες τὴν ἐν τῇ Γαλιλαίᾳ — カデス (в Галилее); μεταστῆσαι αὐτὸν τῆς χρείας — «устранить его от должности (дела)»."
  67: "Γεννησαρ — ゲネサレ; τὸ πεδίον Ασωρ — «равнину Асор» (слав. «поле насор»)."
  68: "ἀλλοφύλων — «иноплеменников», 異邦人 (по корпусу; ср. 3:41). ἐξέβαλον ἔνεδρον — «выставили засаду»."
  70: "Ματταθιας ὁ τοῦ Αψαλωμου καὶ Ιουδας ὁ τοῦ Χαλφι — マタティア (сын Авессалома) и ユダ (сын Халфи), не путать с Иудой Маккавеем."
  71: "διέρρηξεν τὰ ἱμάτια — «разодрал одежды»; ἐπέθετο γῆν ἐπὶ τὴν κεφαλήν — «возложил землю на голову»."
  73: "ἕως Κεδες ἕως τῆς παρεμβολῆς αὐτῶν — «до Кадеса, до стана их»."
  74: "ἀλλοφύλων — 異邦人; εἰς ἄνδρας τρισχιλίους — «до трёх тысяч мужей»."
