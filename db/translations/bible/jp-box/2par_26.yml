verses:
  1: "その地[ち]の民[たみ]はみな、ウジヤを取[と]って、父[ちち]アマツヤの代[か]わりに王[おう]とした。彼は十六歳[じゅうろくさい]であった。"
  2: "彼[かれ]はエラトを建[た]て、王[おう]が父[ちち]たちとともに眠[ねむ]った後[のち]に、それをユダのものとして戻[もど]した。"
  3: "ウジヤは十六歳[じゅうろくさい]で王[おう]となり、エルサレムで五十二年[ごじゅうにねん]治[おさ]めた。母[はは]の名[な]はエコルヤといい、エルサレムの出[で]であった。"
  4: "彼[かれ]は父[ちち]アマツヤが行[おこな]ったすべてのとおりに、主[しゅ]の前[まえ]に正[ただ]しいことを行った。"
  5: "彼[かれ]は、主[しゅ]を恐[おそ]れることにおいて悟[さと]りのあるゼカリヤの日[ひ]々[び]に、主を求[もと]め続[つづ]けた。彼の日々に主を求めたので、主は彼を栄[さか]えさせた。"
  6: "彼[かれ]は出[で]て行[い]き、ペリシテ人[びと]と戦[たたか]って、ガテ、ヤブネ、アシュドドの城壁[じょうへき]を壊[こわ]し、アシュドドとペリシテ人の地[ち]に町[まち]を建[た]てた。"
  7: "主[しゅ]は彼を強[つよ]くして、ペリシテ人[びと]、岩[いわ]の上[うえ]に住[す]むアラビア人[じん]、およびミナイ人に打[う]ち勝[か]たせた。"
  8: "ミナイ人[じん]はウジヤに贈[おく]り物[もの]を納[おさ]め、その名[な]はエジプトの入口[いりぐち]にまで届[とど]いた。彼がきわめて強[つよ]くなったからである。"
  9: "ウジヤはエルサレムに塔[とう]を建[た]て、隅[すみ]の門[もん]の上[うえ]、谷[たに]の門の上、また隅々[すみ]の上に置[お]き、これらを堅固[けんご]にした。"
  10: "また、荒野[こうや]に塔[とう]を建[た]て、多[おお]くの溜[た]め池[いけ]を掘[ほ]った。シェフェラと平野[へいや]に多くの家畜[かちく]があったからである。また山地[さんち]とカルメルには、ぶどうを作[つく]る者[もの]たちがいた。彼[かれ]は農[のう]を愛[あい]する人[ひと]であった。"
  11: "ウジヤには、戦[たたか]いをなし、戦列[せんれつ]について出[で]て行[い]く軍勢[ぐんぜい]があった。その数[かず]は、書記官[しょきかん]イエイエルと裁判官[さいばんかん]マアセヤの手[て]により、王[おう]の代理[だいり]ハナニヤの手[て]を通[とお]して数[かぞ]えられた。"
  12: "戦[たたか]いに強[つよ]い者[もの]たちの氏族[しぞく]の長[かしら]の数[かず]は、全部[ぜんぶ]で二千六百[にせんろっぴゃく]人[にん]であった。"
  13: "彼[かれ]らとともに、王[おう]を助[たす]けて敵[てき]に対[たい]する戦[たたか]いを、強[つよ]い力[ちから]をもって行[おこな]う軍勢[ぐんぜい]が三十万七千五百[さんじゅうまんななせんごひゃく]人[にん]あった。"
  14: "ウジヤは全[ぜん]軍[ぐん]のために、盾[たて]、槍[やり]、兜[かぶと]、鎧[よろい]、弓[ゆみ]、および石[いし]を投[な]げるための投石器[とうせきき]を用意[ようい]した。"
  15: "また、エルサレムで巧[たくみ]に考[かんが]えられた装置[そうち]を造[つく]り、塔[とう]の上[うえ]や隅[すみ]の上に置[お]いて、矢[や]や大[おお]きな石[いし]を放[はな]たせた。その評判[ひょうばん]は遠[とお]くまで聞[き]こえ、彼[かれ]は助[たす]けを受[う]けて驚[おどろ]くべき者[もの]となり、ついにきわめて強[つよ]くなった。"
  16: "しかし、彼[かれ]が強[つよ]くなると、心[こころ]は高[たか]ぶって自分[じぶん]を滅[ほろ]ぼすこととなり、彼は自分の神[かみ]である主[しゅ]に罪[つみ]を犯[おか]した。そして主の神殿[しんでん]に入[はい]り、香[こう]の祭壇[さいだん]の上[うえ]に香をたこうとした。"
  17: "祭司[さいし]アザリヤは彼の後[あと]に続[つづ]き、主[しゅ]の祭司たち八十人[はちじゅうにん]の勇[いさ]ましい者[もの]たちがともに入[はい]った。"
  18: "彼[かれ]らは王[おう]ウジヤの前[まえ]に立[た]って言[い]った。「ウジヤよ、主[しゅ]に香[こう]をたくのはあなたの務[つと]めではない。香をたくのは、聖別[せいべつ]されたアロンの子[こ]らである祭司[さいし]たちの務めである。聖所[せいしょ]から出[で]て行[い]きなさい。あなたは主から離[はな]れたのだから。このことは、あなたの神[かみ]である主の前で、あなたの栄光[えいこう]にはならない。」"
  19: "ウジヤは怒[いか]り、手[て]には香[こう]をたくための香炉[こうろ]を持[も]っていた。彼が祭司[さいし]たちに対[たい]して怒っていると、その額[ひたい]に癩病[らいびょう]が現[あらわ]れた。祭司たちの前[まえ]、主[しゅ]の家[いえ]の中[なか]、香の祭壇[さいだん]の上[うえ]であった。"
  20: "大祭司[だいさいし]アザリヤとすべての祭司[さいし]たちが彼[かれ]を振[ふ]り向[む]いて見[み]ると、彼の額[ひたい]に癩病[らいびょう]があった。そこで彼らは急[いそ]いで彼をそこから連[つ]れ出[だ]した。彼自身[じしん]も急いで出[で]て行[い]こうとした。主[しゅ]が彼を打[う]ったからである。"
  21: "ウジヤ王[おう]は死[し]ぬ日[ひ]まで癩病[らいびょう]の者[もの]であり、隔離[かくり]された家[いえ]に住[す]んだ。主[しゅ]の家から断[た]たれたからである。その子[こ]ヨタムが王国[おうこく]を治[おさ]め、その地[ち]の民[たみ]を裁[さば]いた。"
  22: "ウジヤの残[のこ]りの言葉[ことば]、最初[さいしょ]から最後[さいご]まで、預言者[よげんしゃ]イザヤ、すなわちアモスの子[こ]が書[か]き記[しる]した。"
  23: "ウジヤは父[ちち]たちとともに眠[ねむ]り、王[おう]たちの墓[はか]の野[の]に、父たちとともに葬[ほうむ]られた。「彼は癩病[らいびょう]の者[もの]だ」と言[い]われたからである。代[か]わりにその子[こ]ヨタムが王となった。"

notes:
  1: "ἔλαβεν πᾶς ὁ λαὸς τῆς γῆς τὸν Οζιαν — взял весь народ земли Озию. καὶ αὐτὸς δέκα καὶ ἓξ ἐτῶν — а он был шестнадцати лет. ἐβασίλευσαν αὐτὸν ἀντὶ τοῦ πατρὸς αὐτοῦ Αμασιου — воцарили его вместо отца его Амасии. Слав. «вси людие иудины (сына его) озию» — вставка «сына его», в гр. её нет. Οζιας — он же Азария (4 Цар 15), в 2 Пар принято ウジヤ."
  2: "ᾠκοδόμησεν τὴν Αιλαθ — построил Елаф (Αιλαθ, Элат; エラト, ср. 4 Цар 14:22). ἐπέστρεψεν αὐτὴν τῷ Ιουδα — возвратил её Иуде. μετὰ τὸ κοιμηθῆναι τὸν βασιλέα μετὰ τῶν πατέρων αὐτοῦ — после того как царь почил с отцами своими."
  3: "υἱὸς δέκα ἓξ ἐτῶν — сын шестнадцати лет. πεντήκοντα καὶ δύο ἔτη — пятьдесят два года. ὄνομα τῇ μητρὶ αὐτοῦ Χαλια — имя матери его Халия (слав. «иехелиа», ru «Иехолия»; та же мать, что в 4 Цар 15:2, в тексте обычная форма エコルヤ). ἀπὸ Ιερουσαλημ — из Иерусалима."
  4: "ἐποίησεν τὸ εὐθὲς ἐνώπιον κυρίου — делал правое пред Господом. κατὰ πάντα, ὅσα ἐποίησεν Αμασιας ὁ πατὴρ αὐτοῦ — по всему, что сделал Амасия, отец его."
  5: "ἦν ἐκζητῶν τὸν κύριον — был взыскующим Господа (ἐκζητέω — «искать усердно»). ἐν ταῖς ἡμέραις Ζαχαριου τοῦ συνίοντος ἐν φόβῳ κυρίου — во дни Захарии, разумеющего в страхе Господнем (συνίημι — «понимать»; слав. «разумеющаго во страсе Господни»). ἐν ταῖς ἡμέραις αὐτοῦ ἐζήτησεν τὸν κύριον — в дни его взыскал Господа. εὐόδωσεν αὐτῷ κύριος — дал ему успех Господь (εὐοδόω; слав. «благопоспеши»)."
  6: "ἐξῆλθεν καὶ ἐπολέμησεν πρὸς τοὺς ἀλλοφύλους — вышел и воевал с иноплеменниками (ἀλλόφυλοι — филистимляне). κατέσπασεν τὰ τείχη — разрушил стены (κατασπάω). Γεθ — Геф (ガテ), Ιαβνη — Иавнея (ヤブネ; слав. «иавнир»), Ἀζωτος — Азот (アシュドド). ᾠκοδόμησεν πόλεις Ἀζώτου καὶ ἐν τοῖς ἀλλοφύλοις — построил города Азота и у иноплеменников."
  7: "κατίσχυσεν αὐτὸν κύριος ἐπὶ τοὺς ἀλλοφύλους — укрепил его Господь против иноплеменников. τοὺς Ἄραβας τοὺς κατοικοῦντας ἐπὶ τῆς πέτρας — арабов, живущих на скале (πέτρα; слав. «в камениих», ru «в Гур-Ваале» по МТ). τοὺς Μιναίους — минеев (Μιναῖοι; слав. «минее», ru «Меунитяне»/«Аммонитяне»; в тексте ミナイ人, как в 1 Пар 4:41)."
  8: "ἔδωκαν οἱ Μιναῖοι δῶρα τῷ Οζια — дали минеи дары Озии. ἦν τὸ ὄνομα αὐτοῦ ἕως εἰσόδου Αἰγύπτου — имя его было до входа Египетского. ὅτι κατίσχυσεν ἕως ἄνω — ибо укрепился до высоты, т. е. чрезвычайно (слав. «понеже укрепися до высоты»)."
  9: "ᾠκοδόμησεν πύργους ἐν Ιερουσαλημ — построил башни в Иерусалиме. ἐπὶ τὴν πύλην τῆς γωνίας — над воротами угла. ἐπὶ τὴν πύλην τῆς φάραγγος — над воротами долины (φάραγξ; слав. «юдольными»). ἐπὶ τῶν γωνιῶν — на углах. κατίσχυσεν — укрепил их (слав. «укрепи их»)."
  10: "ἐλατόμησεν λάκκους πολλούς — иссек много водоёмов (λατομέω — «высекать в камне»; λάκκος — «яма, цистерна»). κτήνη πολλὰ ὑπῆρχεν αὐτῷ — много скота было у него. ἐν Σεφηλα καὶ ἐν τῇ πεδινῇ — в Шефеле и на равнине (Σεφηλα; слав. «на поли и в пустыни» — путаница). ἀμπελουργοὶ ἐν τῇ ὀρεινῇ καὶ ἐν τῷ Καρμήλῳ — виноградари в нагорной стране и на Кармиле. φιλογέωργος ἦν — был любителем земледелия (φιλογέωργος; слав. «муж любоземледелен»)."
  11: "ἐγένετο τῷ Οζια δυνάμεις ποιοῦσαι πόλεμον — были у Озии силы, творящие войну. ἐκπορευόμεναι εἰς παράταξιν εἰς ἀριθμόν — выходящие на боевой строй по числу (παράταξις — «строй, порядок»). ὁ ἀριθμὸς αὐτῶν διὰ χειρὸς Ιιηλ τοῦ γραμματέως — число их рукою Иеила писца (γραμματεύς; слав. «писаря»). Μαασαιου τοῦ κριτοῦ — Маасеи судьи (κριτής). Ανανιου τοῦ διαδόχου τοῦ βασιλέως — Анании, преемника (заместителя) царя (διάδοχος; слав. «наместника»)."
  12: "πᾶς ὁ ἀριθμὸς τῶν πατριαρχῶν τῶν δυνατῶν εἰς πόλεμον — всё число родоначальников (глав отчеств), сильных для войны (πατριάρχης; слав. «отечеств началников»). δισχίλιοι ἑξακόσιοι — две тысячи шестьсот."
  13: "δύναμις πολεμική — сила воинская. τριακόσιαι χιλιάδες καὶ ἑπτακισχίλιοι πεντακόσιοι — триста тысяч и семь тысяч пятьсот, т. е. 307 500 (слав. «триста седмь тысящ и пять сот»). οἱ ποιοῦντες πόλεμον ἐν δυνάμει ἰσχύος — творящие войну в силе крепости. βοηθῆσαι τῷ βασιλεῖ ἐπὶ τοὺς ὑπεναντίους — помогать царю против супостатов (ὑπεναντίος)."
  14: "ἡτοίμαζεν αὐτοῖς... πάσῃ τῇ δυνάμει — готовил им для всей силы. θυρεοὺς καὶ δόρατα καὶ περικεφαλαίας καὶ θώρακας — щиты, копья, шлемы и брони (περικεφαλαία, θώραξ). τόξα καὶ σφενδόνας εἰς λίθους — луки и пращи для камней (σφενδόνη)."
  15: "μηχανὰς μεμηχανευμένας λογιστοῦ — машины, изобретённые изобретателем (μηχανή, μηχανεύομαι, λογιστής — «искусный мастер»; слав. «хитрости ухищреныя вымыслом»). βάλλειν βέλεσιν καὶ λίθοις μεγάλοις — бросать стрелами и большими камнями. ἠκούσθη ἡ κατασκευὴ αὐτῶν ἕως πόρρω — услышано было устройство их далеко (κατασκευή). ἐθαυμαστώθη τοῦ βοηθηθῆναι — был прославлен (стал дивен) в том, что получил помощь (θαυμαστόω; слав. «удивлен бысть ищя помощи»). ἕως οὗ κατίσχυσεν — пока не укрепился."
  16: "ὡς κατίσχυσεν, ὑψώθη ἡ καρδία αὐτοῦ — когда укрепился, вознеслось сердце его. τοῦ καταφθεῖραι — на погибель (καταφθείρω). ἠδίκησεν ἐν κυρίῳ θεῷ αὐτοῦ — поступил нечестиво против Господа Бога своего (ἀδικέω). εἰσῆλθεν εἰς τὸν ναὸν κυρίου — вошёл в храм Господень (ναός — 神殿). θυμιᾶσαι ἐπὶ τὸ θυσιαστήριον τῶν θυμιαμάτων — воскурить на жертвеннике кадильном (θυμίαμα)."
  17: "εἰσῆλθεν ὀπίσω αὐτοῦ Αζαριας ὁ ἱερεύς — вошёл за ним Азария священник. ἱερεῖς τοῦ κυρίου ὀγδοήκοντα υἱοὶ δυνατοί — священники Господни, восемьдесят сынов сильных. Стих в гр. не закончен (продолжается в 18); в тексте — точка."
  18: "Οὐ σοί, Οζια, θυμιᾶσαι τῷ κυρίῳ — не тебе, Озия, кадить Господу. ἀλλ᾿ ἢ τοῖς ἱερεῦσιν υἱοῖς Ααρων τοῖς ἡγιασμένοις — но священникам, сынам Аароновым, освящённым (ἁγιάζω). ἔξελθε ἐκ τοῦ ἁγιάσματος — выйди из святилища (ἁγίασμα). ὅτι ἀπέστης ἀπὸ κυρίου — ибо ты отступил от Господа. οὐκ ἔσται σοι τοῦτο εἰς δόξαν — не будет тебе это в славу."
  19: "ἐθυμώθη Οζιας — разгневался Озия. ἐν τῇ χειρὶ αὐτοῦ τὸ θυμιατήριον — в руке его кадильница (θυμιατήριον; 香炉). ἐν τῷ θυμωθῆναι αὐτὸν πρὸς τοὺς ἱερεῖς — когда он разгневался на священников. ἡ λέπρα ἀνέτειλεν ἐν τῷ μετώπῳ αὐτοῦ — проказа взошла на челе его (λέπρα, μέτωπον; ἀνατέλλω). ἐπάνω τοῦ θυσιαστηρίου τῶν θυμιαμάτων — над жертвенником кадильным."
  20: "ὁ ἱερεὺς ὁ πρῶτος — «первый священник»; слав. «архиерей», ru «первосвященник» — в тексте 大祭司 (по слав.). ἐπέστρεψεν ἐπ᾿ αὐτὸν — обратился (взглянул) на него. κατέσπευσαν αὐτὸν ἐκεῖθεν — поспешно вывели его оттуда (κατασπεύδω). καὶ γὰρ αὐτὸς ἔσπευσεν ἐξελθεῖν — ибо и сам он спешил выйти. ἤλεγξεν αὐτὸν κύριος — обличил его Господь (ἐλέγχω), т. е. поразил."
  21: "ἦν... λεπρὸς ἕως ἡμέρας τῆς τελευτῆς αὐτοῦ — был прокажённым до дня кончины своей. ἐν οἴκῳ αφφουσωθ ἐκάθητο — сидел в доме аффусоф (евр. бейт ха-хофшит, «дом свободы», т. е. отдельный дом; слав. «в дому отлучене», ru «в отдельном доме»; ср. 4 Цар 15:5). ἀπεσχίσθη ἀπὸ οἴκου κυρίου — был отделён от дома Господня (ἀποσχίζω). ἐπὶ τῆς βασιλείας αὐτοῦ κρίνων τὸν λαὸν τῆς γῆς — над царством его, судя народ земли."
  22: "οἱ λοιποὶ λόγοι Οζιου οἱ πρῶτοι καὶ οἱ ἔσχατοι — прочие слова Озии, первые и последние. γεγραμμένοι ὑπὸ Ιεσσιου τοῦ προφήτου — записанные Иессием пророком (Ιεσσιου — искажение Ησαιου, Исаии; слав. «у исаии сына амосова пророка» — добавление «сына Амосова» внесено в текст по паритету)."
  23: "ἐκοιμήθη Οζιας μετὰ τῶν πατέρων αὐτοῦ — почил Озия с отцами своими. ἔθαψαν αὐτὸν... ἐν τῷ πεδίῳ τῆς ταφῆς τῶν βασιλέων — погребли его на поле погребения царей. ὅτι εἶπαν ὅτι Λεπρός ἐστιν — ибо сказали: он прокажённый. ἐβασίλευσεν Ιωαθαμ υἱὸς αὐτοῦ ἀντ αὐτοῦ — воцарился Иоафам, сын его, вместо него."
