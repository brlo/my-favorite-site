# jp-box, 2-я Паралипоменон, глава 26. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет,
# jp-ni (под авторским правом) источником не был.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 26: воцарение Узии и Елаф (1–2); его благочестие при Захарии (3–5);
# победы над филистимлянами, арабами, минеями (6–8); строительство и войско (9–15);
# гордость, воскурение в храме и проказа (16–21); источники и смерть (22–23).
# Речь — 「…」 (18). Красного нет.
# Нумерация по gr: 23 стиха, совпадает с csl/ru.
# Паритет LXX/csl: csl-чтения в основном тексте без 〔…〕; вариант LXX — в notes.
# 26:20 — в гр. «первый священник», слав. «архиерей», ru «первосвященник»;
# в тексте 大祭司 (по слав.).
# 26:22 — слав. называет Исаию «сыном Амоса»; в гр. только «Иессий пророк».
# 〔…〕 не ставим. Сносок ⟨…⟩ нет: 神殿, 祭壇, 香炉, 癩病, 隔離, 高[たか]い所[ところ] уже в корпусе.

