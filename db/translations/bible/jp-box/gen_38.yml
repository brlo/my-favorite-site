verses:
  1: "そのころ、ユダは兄弟[きょうだい]たちのもとを離[はな]れて下[くだ]り、オドラム人[じん]のある人[ひと]のところへ行[い]った。その人[ひと]の名[な]はヒラといった。"
  2: "そこでユダは、カナン人[じん]のある人[ひと]の娘[むすめ]を見[み]た。その名[な]はシュアといった。彼[かれ]は彼女[かのじょ]を娶[めと]り、彼女[かのじょ]のところに入[はい]った。"
  3: "彼女[かのじょ]は身[み]ごもって息子[むすこ]を産[う]み、その名[な]をエルと名[な]づけた。"
  4: "彼女[かのじょ]はまた身[み]ごもって息子[むすこ]を産[う]み、その名[な]をオナンと名[な]づけた。"
  5: "彼女[かのじょ]はさらに身[み]ごもって息子[むすこ]を産[う]み、その名[な]をシェラと名[な]づけた。彼女[かのじょ]が彼[かれ]らを産[う]んだとき、彼女[かのじょ]はケジブにいた。"
  6: "ユダは長子[ちょうし]エルのために妻[つま]を迎[むか]えた。その名[な]はタマルといった。"
  7: "ユダの長子[ちょうし]エルは主[しゅ]の前[まえ]に悪[わる]であったので、神[かみ]は彼[かれ]を殺[ころ]された。"
  8: "ユダはオナンに言[い]った。「兄[あに]の妻[つま]のところに入[はい]り、義弟[ぎてい]として彼女[かのじょ]を娶[めと]り、兄[あに]に子孫[しそん]を起[お]こせ。」"
  9: "オナンは、その子孫[しそん]が自分[じぶん]のものにならないと知[し]っていたので、兄[あに]の妻[つま]のところに入[はい]るたびに、兄[あに]に子孫[しそん]を与[あた]えないために、地[ち]にこぼした。"
  10: "彼[かれ]がこのことを行[おこな]ったのは神[かみ]の前[まえ]に悪[わる]であったので、神[かみ]は彼[かれ]をも死[し]なせられた。"
  11: "ユダは嫁[よめ]タマルに言[い]った。「父[ちち]の家[いえ]にいて、やもめとして暮[く]らせ。わたしの息子[むすこ]シェラが大[おお]きくなるまで。」彼[かれ]は、この者[もの]もまた、兄[あに]たちのように死[し]ぬことがないように、と思[おも]ったからである。タマルは去[さ]って、父[ちち]の家[いえ]に住[す]んだ。"
  12: "日[ひ]がたって、ユダの妻[つま]シュアは死[し]んだ。ユダは慰[なぐさ]められると、羊[ひつじ]の毛[け]を刈[か]る者[もの]たちのところへ、自分[じぶん]と羊飼[ひつじか]いのオドラム人[じん]ヒラとともに、タムナへ上[のぼ]って行[い]った。"
  13: "タマルに、すなわち嫁[よめ]に告[つ]げる者[もの]があった。「見[み]よ、あなたのしゅうとが、羊[ひつじ]の毛[け]を刈[か]るためにタムナへ上[のぼ]って来[き]る。」"
  14: "彼女[かのじょ]は自分[じぶん]からやもめの衣[ころも]を脱[ぬ]ぎ、覆[おお]いを身[み]にまとい、身[み]を飾[かざ]って、タムナへの道[みち]の途[と]中[ちゅう]にあるエナイムの門[もん]のそばに座[すわ]った。シェラが大[おお]きくなったのに、自分[じぶん]が彼女[かのじょ]を彼[かれ]の妻[つま]として与[あた]えなかったからである。"
  15: "ユダは彼女[かのじょ]を見[み]て、遊女[ゆうじょ]だと思[おも]った。彼女[かのじょ]が顔[かお]を覆[おお]っていたからである。彼[かれ]は彼女[かのじょ]を見[み]分[わ]けなかった。"
  16: "彼[かれ]は道[みち]を彼女[かのじょ]の方[ほう]へ曲[ま]げて言[い]った。「あなたのところへ入[はい]らせてくれ。」自分[じぶん]の嫁[よめ]だとは知[し]らなかったからである。彼女[かのじょ]は言[い]った。「わたしのところへ入[はい]るなら、何[なに]をわたしに与[あた]えるのか。」"
  17: "彼[かれ]は言[い]った。「わたしは羊[ひつじ]の中[なか]から雄[お]やぎを一匹[いっぴき]、あなたに送[おく]ろう。」彼女[かのじょ]は言[い]った。「あなたが送[おく]って来[く]るまで、担保[たんぽ]を預[あず]けてくださるなら。」"
  18: "彼[かれ]は言[い]った。「どんな担保[たんぽ]をあなたに預[あず]けようか。」彼女[かのじょ]は言[い]った。「あなたの印[しるし]の指輪[ゆびわ]と糸[いと]と、あなたの手[て]にある杖[つえ]。」そこで彼[かれ]はそれらを彼女[かのじょ]に与[あた]え、彼女[かのじょ]のところに入[はい]った。彼女[かのじょ]は彼[かれ]によって身[み]ごもった。"
  19: "彼女[かのじょ]は立[た]ち上[あ]がって去[さ]り、自分[じぶん]から覆[おお]いを脱[ぬ]いで、やもめの衣[ころも]を着[き]た。"
  20: "ユダは、あの女[おんな]から担保[たんぽ]を受[う]け取[と]るために、羊飼[ひつじか]いのオドラム人[じん]の手[て]を借[か]りて、雄[お]やぎを送[おく]った。しかし、彼[かれ]は彼女[かのじょ]を見[み]つけなかった。"
  21: "彼[かれ]はその場所[ばしょ]の人々[ひとびと]に尋[たず]ねた。「道[みち]のほとり、エナイムにいた遊女[ゆうじょ]はどこにいるのか。」彼[かれ]らは言[い]った。「ここには遊女[ゆうじょ]はいなかった。」"
  22: "彼[かれ]はユダのもとへ戻[もど]って言[い]った。「見[み]つからなかった。その場所[ばしょ]の人々[ひとびと]も、ここに遊女[ゆうじょ]はいないと言[い]っている。」"
  23: "ユダは言[い]った。「彼女[かのじょ]に持[も]たせておけ。ただ、わたしたちが笑[わら]い者[もの]にならないように。この雄[お]やぎはわたしが送[おく]ったのだが、あなたは見[み]つけなかったのだ。」"
  24: "三か月[さんかげつ]ほどたって、ユダにこう告[つ]げる者[もの]があった。「あなたの嫁[よめ]タマルは不貞[ふてい]を働[はたら]き、見[み]よ、不貞[ふてい]によって身[み]ごもっている。」ユダは言[い]った。「彼女[かのじょ]を引[ひ]き出[だ]せ。焼[や]き殺[ころ]せ。」"
  25: "彼女[かのじょ]は引[ひ]かれて行[い]くとき、しゅうとのもとへ人[ひと]を遣[つか]わして言[い]った。「わたしは、これらのものの持[も]ち主[ぬし]である男[おとこ]によって身[み]ごもっている。」そして言[い]った。「この印[しるし]の指輪[ゆびわ]と糸[いと]と杖[つえ]が、だれのものか、よく見[み]てください。」"
  26: "ユダはそれを見[み]分[わ]けて言[い]った。「タマルはわたしよりも正[ただ]しい。わたしが彼女[かのじょ]を息子[むすこ]シェラに与[あた]えなかったからだ。」そして、彼[かれ]はもはや彼女[かのじょ]を知[し]ることがなかった。"
  27: "彼女[かのじょ]が産[う]もうとするとき、見[み]よ、その腹[はら]には双子[ふたご]がいた。"
  28: "彼女[かのじょ]が産[う]もうとするとき、一人[ひとり]が手[て]を先[さき]に伸[の]ばした。産婆[さんば]はそれを取[と]って、彼[かれ]の手[て]に赤[あか]い糸[いと]を結[むす]びつけて言[い]った。「この子[こ]が先[さき]に出[で]る。」"
  29: "しかし、彼[かれ]が手[て]を引[ひ]っ込[こ]めると、すぐに彼[かれ]の兄弟[きょうだい]が出[で]て来[き]た。彼女[かのじょ]は言[い]った。「あなたのために、なんと破[やぶ]れ目[め]ができたことか。」そして、その名[な]をペレツと名[な]づけた。"
  30: "その後[あと]で、手[て]に赤[あか]い糸[いと]のあった彼[かれ]の兄弟[きょうだい]が出[で]て来[き]た。その名[な]をゼラと名[な]づけた。"

notes:
  1: "κατέβη ἀπὸ τῶν ἀδελφῶν αὐτοῦ — 兄弟たちのもとを離れて下り (καταβαίνω — «сходить»; из нагорий Хеврона вниз, в Одоллам). ἀφίκετο ἕως πρὸς ἄνθρωπον… Οδολλαμίτην — オドラム人のある人のところへ行った (Ὀδολλαμίτης — «одолламитянин», житель Одоллама). ᾧ ὄνομα Ιρας — その名はヒラ (LXX Ἴρας; евр. Хира)."
  2: "θυγατέρα ἀνθρώπου Χαναναίου — カナン人のある人の娘. ᾗ ὄνομα Σαυα — その名はシュア (относительное местоимение женского рода: LXX понимает Шую как имя женщины; в евр. и ru — имя отца, «которому имя Шуа»; держимся греческого). εἰσῆλθεν πρὸς αὐτήν — 彼女のところに入った (библейский оборот о супружеском соединении)."
  3: "συλλαβοῦσα — 身ごもって (συλλαμβάνω — «зачинать»). ἐκάλεσεν τὸ ὄνομα αὐτοῦ — その名を…と名づけた (подлежащее — мать; в ru наречение относит к Иуде). Ηρ — エル (LXX Ἤρ)."
  4: "Αυναν — オナン (LXX Αὐνάν)."
  5: "Σηλωμ — シェラ (LXX Σηλώμ). Χασβι — ケジブ (LXX Χασβί; евр. Кезив). αὐτὴ δὲ ἦν ἐν Χασβι — 彼女はケジブにいた (LXX: подлежащее — жена; в ru «Иуда был в Хезиве» — по масоретскому тексту). ἡνίκα ἔτεκεν αὐτούς — 彼らを産んだとき (мн. ч., хотя речь о Шеле; особенность LXX, не сглаживаем)."
  6: "ἔλαβεν γυναῖκα Ηρ τῷ πρωτοτόκῳ αὐτοῦ — 長子エルのために妻を迎えた. Θαμαρ — タマル."
  7: "πονηρὸς ἐναντίον κυρίου — 主の前に悪 (πονηρός — «злой, дурной»). ἀπέκτεινεν αὐτὸν ὁ θεός — 神は彼を殺された (в греч. сначала κύριος, потом ὁ θεός — оба сохранены)."
  8: "Εἴσελθε πρὸς τὴν γυναῖκα τοῦ ἀδελφοῦ σου — 兄の妻のところに入り. γάμβρευσαι αὐτήν — 義弟として彼女を娶り (γαμβρεύω — «вступать в брак с женой умершего брата», ужичество/левират). ἀνάστησον σπέρμα τῷ ἀδελφῷ σου — 兄に子孫を起こせ (ἀνίστημι — «восставлять»; σπέρμα — «семя, потомство»)."
  9: "γνοὺς… ὅτι οὐκ αὐτῷ ἔσται τὸ σπέρμα — その子孫が自分のものにならないと知っていた (при ужичестве первый сын считался сыном умершего). ἐξέχεεν ἐπὶ τὴν γῆν — 地にこぼした (ἐκχέω — «изливать»; слав. «проливаше на землю»). τοῦ μὴ δοῦναι σπέρμα — 子孫を与えないために. Не смягчаем."
  10: "πονηρὸν… ἐφάνη ἐναντίον τοῦ θεοῦ — 神の前に悪であった (φάνη — от φαίνω «казаться»). ἐθανάτωσεν — 死なせられた (θανατόω — «умерщвлять»)."
  11: "τῇ νύμφῃ αὐτοῦ — 嫁に (νύμφη — «невестка»). Κάθου χήρα — やもめとして暮らせ (χήρα — «вдова»). ἕως μέγας γένηται Σηλωμ — シェラが大きくなるまで. εἶπεν γάρ — 思ったからである (букв. «сказал [в себе]»; слав. «рече бо (во уме си)»). Μήποτε ἀποθάνῃ καὶ οὗτος — この者もまた…死ぬことがないように (μήποτε — «как бы не»)."
  12: "Ἐπληθύνθησαν αἱ ἡμέραι — 日がたって (πληθύνω — «умножать»). Σαυα ἡ γυνὴ Ιουδα — ユダの妻シュア (здесь LXX ясно называет её по имени). παρακληθεὶς — 慰められると (παρακαλέω — «утешать»; траур окончился). τοὺς κείροντας τὰ πρόβατα — 羊の毛を刈る者たち (κείρω — «стричь»). Ιρας ὁ ποιμὴν αὐτοῦ ὁ Οδολλαμίτης — 羊飼いのオドラム人ヒラ. εἰς Θαμνα — タムナへ (Θαμνά — Фамна)."
  13: "ἀπηγγέλη Θαμαρ τῇ νύμφῃ αὐτοῦ — タマルに、すなわち嫁に告げる者があった (двойной датив: имя и уточнение «невестка его»). ὁ πενθερός σου — あなたの舅 (πενθερός — «свёкор/тесть»). ἀναβαίνει — 上って来る."
  14: "περιελομένη τὰ ἱμάτια τῆς χηρεύσεως — やもめの衣を脱ぎ (περιαιρέω — «снимать»; χήρευσις — «вдовство»). περιεβάλετο θέριστρον — 覆いを身にまとい (θέριστρον — «покрывало, летняя одежда»). ἐκαλλωπίσατο — 身を飾って (καλλωπίζω — «украшать»). πρὸς ταῖς πύλαις Αιναν — エナイムの門のそばに (Αἰνάν — Енаим). ἐν παρόδῳ Θαμνα — タムナへの道の途中に. εἶδεν γὰρ ὅτι μέγας γέγονεν Σηλωμ — シェラが大きくなったのに (обратите внимание: «увидела, что вырос», т. е. поняла, что её обманывают)."
  15: "ἔδοξεν αὐτὴν πόρνην εἶναι — 遊女だと思った (δοκέω — «думать, казаться»). κατεκαλύψατο τὸ πρόσωπον — 顔を覆っていた (κατακαλύπτω — «покрывать»). οὐκ ἐπέγνω — 見分けなかった (ἐπιγινώσκω — «узнавать»)."
  16: "ἐξέκλινεν… τὴν ὁδόν — 道を…方へ曲げて (ἐκκλίνω — «сворачивать»). Ἔασόν με εἰσελθεῖν — 入らせてくれ. οὐ γὰρ ἔγνω ὅτι ἡ νύμφη αὐτοῦ ἐστιν — 自分の嫁だとは知らなかった. Τί μοι δώσεις — 何をわたしに与えるのか."
  17: "ἔριφον αἰγῶν ἐκ τῶν προβάτων — 羊の中から雄やぎを一匹 (ἔριφος — «козлёнок»). ἀρραβῶνα — 担保 (ἀρραβών — «залог, залог-поручительство»). ἕως τοῦ ἀποστεῖλαί σε — あなたが送って来るまで."
  18: "Τίνα τὸν ἀρραβῶνα… δώσω; — どんな担保を…預けようか. δακτύλιος — 印の指輪 (перстень-печатка, которым прикладывали печать). ὁρμίσκος — 糸 (шнур, на котором носили печать; слав. «гривна»). ῥάβδος — 杖 (жезл). ἐν γαστρὶ ἔλαβεν ἐξ αὐτοῦ — 彼によって身ごもった (букв. «приняла во чреве от него»)."
  19: "περιείλατο τὸ θέριστρον — 覆いを脱いで. ἐνεδύσατο τὰ ἱμάτια τῆς χηρεύσεως — やもめの衣を着た (ἐνδύω — «надевать»)."
  20: "κομίσασθαι τὸν ἀρραβῶνα παρὰ τῆς γυναικὸς — あの女から担保を受け取るために (κομίζω — «получать»). ἐν χειρὶ τοῦ ποιμένος — 羊飼いの手を借りて (букв. «рукою пастуха»). οὐχ εὗρεν — 見つけなかった."
  21: "τοὺς ἄνδρας τοὺς ἐκ τοῦ τόπου — その場所の人々. ἡ πόρνη ἡ γενομένη ἐν Αιναν ἐπὶ τῆς ὁδοῦ — 道のほとり、エナイムにいた遊女 (ἐπὶ τῆς ὁδοῦ — «при дороге»). Οὐκ ἦν ἐνταῦθα πόρνη — ここには遊女はいなかった."
  22: "ἀπεστράφη — 戻って (ἀποστρέφω). μὴ εἶναι ὧδε πόρνην — ここに遊女はいないということ (инфинитив в косвенной речи)."
  23: "Ἐχέτω αὐτά — 彼女に持たせておけ (ἔχω — «иметь, держать»). μήποτε καταγελασθῶμεν — 笑い者にならないように (καταγελάω — «осмеивать»). ἀπέσταλκα — わたしが送った (perfect)."
  24: "μετὰ τρίμηνον — 三か月ほどたって (τρίμηνος — «трёхмесячный»). Ἐκπεπόρνευκεν — 淫行を犯し (ἐκπορνεύω — «предаваться блуду»). ἐν γαστρὶ ἔχει ἐκ πορνείας — 淫行によって身ごもっている. Ἐξαγάγετε — 引き出せ. κατακαυθήτω — 焼き殺せ (κατακαίω — «сожигать»; пассивный императив «да будет сожжена», передан активно по-японски)."
  25: "ἀγομένη — 引かれて行くとき (ἄγω — «вести»). Ἐκ τοῦ ἀνθρώπου, τίνος ταῦτά ἐστιν — これらのものの持ち主である男によって (букв. «от человека, чьи это вещи»). Ἐπίγνωθι — よく見てください (ἐπιγινώσκω). δακτύλιος… ὁρμίσκος… ῥάβδος — 印の指輪、糸、杖."
  26: "Δεδικαίωται Θαμαρ ἢ ἐγώ — タマルはわたしよりも正しい (δικαιόω — «оправдывать»; ἤ — «чем»). οὗ εἵνεκεν οὐκ ἔδωκα αὐτὴν Σηλωμ — わたしが彼女をシェラに与えなかったからだ. οὐ προσέθετο ἔτι τοῦ γνῶναι αὐτήν — もはや彼女を知ることがなかった (γινώσκω — библейский оборот о супружеском общении)."
  27: "ἔτικτεν — 産もうとする (τίκτω). δίδυμα ἐν τῇ γαστρὶ αὐτῆς — その腹には双子がいた (δίδυμος — «близнец»)."
  28: "προεξήνεγκεν τὴν χεῖρα — 手を先に伸ばした (προεκφέρω — «выносить вперёд»). ἡ μαῖα — 産婆 (повивальная бабка). ἔδησεν… κόκκινον — 赤い糸を結びつけて (δέω — «вязать»; κόκκινος — «алый»). Οὗτος ἐξελεύσεται πρότερος — この子が先に出る."
  29: "ἐπισυνήγαγεν τὴν χεῖρα — 手を引っ込めると (ἐπισυνάγω — «собирать, втягивать»). Τί διεκκόπη διὰ σὲ φραγμός; — あなたのために、なんと破れ目ができたことか (φραγμός — «ограда, преграда»; имя Фарес и означает «пролом, брешь»). Φαρες — ペレツ (LXX Φαρές)."
  30: "ἐφ᾿ ᾧ ἦν ἐπὶ τῇ χειρὶ αὐτοῦ τὸ κόκκινον — 手に赤い糸のあった. Ζαρα — ゼラ (LXX Ζαρά; имя связано со значением «восход, сияние»)."
