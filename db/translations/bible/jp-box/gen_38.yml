# Язык — современный 常体, порядок членов — по греческому.
# Глава 38: Иуда и Шуа, рождение Ира, Онана и Шелы (1–5), брак Ира с Фамарью (6),
# смерть Ира (7), грех Онана и его смерть (8–10), Фамарь ждёт Шелу (11),
# смерть Шуи и поездка в Фамну (12), Фамарь у ворот Енаима (13–16), залог (17–18),
# возвращение к вдовству (19), неудачные поиски (20–23), обвинение и сожжение (24),
# залог и признание Иуды (25–26), рождение Фареса и Зары (27–30).
