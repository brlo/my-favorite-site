verses:
  1: "ヨセフは父[ちち]の顔[かお]に伏[ふ]して泣[な]き、彼[かれ]に口[くち]づけした。"
  2: "ヨセフは、しもべであるミイラ造[づく]りの者[もの]たちに命[めい]じて、父[ちち]をミイラにさせた。ミイラ造[づく]りの者[もの]たちはイスラエルをミイラにした。"
  3: "こうして彼[かれ]のために四十日[しじゅうにち]が満[み]ちた。葬[ほうむ]りの日[ひ]はこう数[かぞ]えられるからである。エジプトは彼[かれ]のために七十日間[ななじゅうにちかん]泣[な]き悲[かな]しんだ。"
  4: "泣[な]き悲[かな]しむ日[ひ]が過[す]ぎると、ヨセフはファラオの高官[こうかん]たちに言[い]った。「もしわたしがあなたがたの前[まえ]で恵[めぐ]みを得[え]ているなら、わたしについてファラオの耳[みみ]に告[つ]げてください。"
  5: "『わたしの父[ちち]は、わたしに誓[ちか]わせて言[い]いました。「わたしがカナンの地[ち]に自分[じぶん]のために掘[ほ]った墓[はか]に、わたしを葬[ほうむ]れ」と。今[いま]、どうか、わたしが上[のぼ]って父[ちち]を葬[ほうむ]ることをお許[ゆる]しください。その後[あと]、わたしは帰[かえ]ってまいります。』」〔こうして人々[ひとびと]はヨセフの言葉[ことば]をファラオに告[つ]げた。〕"
  6: "ファラオは言[い]った。「上[のぼ]って行[い]き、彼[かれ]があなたに誓[ちか]わせたとおりに、あなたの父[ちち]を葬[ほうむ]れ。」"
  7: "ヨセフは父[ちち]を葬[ほうむ]るために上[のぼ]って行[い]った。ファラオのしもべたち、その家[いえ]の長老[ちょうろう]たち、エジプトの地[ち]の長老[ちょうろう]たちも皆[みな]、彼[かれ]とともに上[のぼ]った。"
  8: "ヨセフの全[ぜん]家[か]、彼[かれ]の兄弟[きょうだい]たち、父[ちち]の家[いえ]も。ただ彼[かれ]らは親族[しんぞく]と羊[ひつじ]と牛[うし]をゴシェンの地[ち]に残[のこ]した。"
  9: "車[くるま]と騎兵[きへい]も彼[かれ]とともに上[のぼ]り、その陣営[じんえい]は非常[ひじょう]に大[おお]きくなった。"
  10: "彼[かれ]らはヨルダンの向[む]こう側[がわ]にあるアタドの脱穀場[だっこくじょう]に来[き]て、そこで大[おお]きく激[はげ]しく泣[な]き悲[かな]しんだ。彼[かれ]は父[ちち]のために七日間[なのかかん]の喪[も]を営[いとな]んだ。"
  11: "その地[ち]の住民[じゅうみん]、カナン人[じん]たちはアタドの脱穀場[だっこくじょう]の喪[も]を見[み]て言[い]った。「これはエジプト人[じん]の大[おお]きな喪[も]だ。」それゆえ、その名[な]は「エジプトの喪[も]」と呼[よ]ばれた。それはヨルダンの向[む]こう側[がわ]にある。"
  12: "ヤコブの子[こ]らは、彼[かれ]に命[めい]じられたとおりに彼[かれ]のために行[おこな]い、そこで彼[かれ]を葬[ほうむ]った。"
  13: "彼[かれ]らは彼[かれ]をカナンの地[ち]に運[はこ]び、マムレの向[む]かいにある二重[にじゅう]の洞窟[どうくつ]、アブラハムがヘト人[じん]エフロンから墓所[ぼしょ]の所有[しょゆう]として買[か]い取[と]った洞窟[どうくつ]に葬[ほうむ]った。"
  14: "ヨセフは兄弟[きょうだい]たち、および父[ちち]を葬[ほうむ]るために彼[かれ]とともに上[のぼ]ったすべての者[もの]たちとともに、エジプトへ帰[かえ]った。"
  15: "ヨセフの兄弟[きょうだい]たちは、父[ちち]が死[し]んだのを見[み]て言[い]った。「ヨセフがわたしたちを恨[うら]み、わたしたちが彼[かれ]にしたすべての悪[わる]を報[むく]いるかもしれない。」"
  16: "彼[かれ]らはヨセフのもとへ来[き]て言[い]った。「あなたの父[ちち]は死[し]ぬ前[まえ]に、あなたに誓[ちか]わせて言[い]いました。"
  17: "『ヨセフにこう言[い]いなさい。「あなたの兄弟[きょうだい]たちはあなたに悪[わる]を行[おこな]ったのだから、どうか、彼[かれ]らの不正[ふせい]と罪[つみ]を赦[ゆる]してほしい。そして今[いま]、あなたの父[ちち]の神[かみ]のしもべたちの不正[ふせい]を赦[ゆる]してほしい。」』」ヨセフは彼[かれ]らが彼[かれ]に語[かた]ったとき、泣[な]いた。"
  18: "兄弟[きょうだい]たちもまた来[き]て、彼[かれ]の前[まえ]に伏[ふ]して言[い]った。「見[み]よ、わたしたちはあなたのしもべです。」"
  19: "ヨセフは彼[かれ]らに言[い]った。「恐[おそ]れてはならない。わたしは神[かみ]に属[ぞく]する者[もの]である。"
  20: "あなたがたはわたしに対して悪[わる]を企[くわだ]てたが、神[かみ]はわたしについて善[ぜん]を企[くわだ]てられた。今日[きょう]のようになり、多[おお]くの民[たみ]が養[やしな]われるためであった。"
  21: "恐[おそ]れてはならない。わたしはあなたがたとあなたがたの家[いえ]の者[もの]たちを養[やしな]う。」彼[かれ]は彼[かれ]らを慰[なぐさ]め、心[こころ]に語[かた]りかけた。"
  22: "ヨセフはエジプトに住[す]んだ。彼[かれ]も、兄弟[きょうだい]たちも、父[ちち]の全[ぜん]家[か]も。ヨセフは百十年[ひゃくじゅうねん]生[い]きた。"
  23: "ヨセフはエフライムの子[こ]らを三代[さんだい]に及[およ]ぶまで見[み]た。マナセの子[こ]マキルの子[こ]らも、ヨセフの膝[ひざ]の上[うえ]で生[う]まれた。"
  24: "ヨセフは兄弟[きょうだい]たちに言[い]った。「わたしは死[し]ぬ。しかし神[かみ]は必[かなら]ずあなたがたを顧[かえり]み、この地[ち]から、アブラハム、イサク、ヤコブに誓[ちか]われた地[ち]へ、あなたがたを連[つ]れ上[のぼ]られる。」"
  25: "ヨセフはイスラエルの子[こ]らに誓[ちか]わせて言[い]った。「神[かみ]が必[かなら]ずあなたがたを顧[かえり]みられるとき、あなたがたはわたしの骨[ほね]を、ここからあなたがたとともに携[たずさ]えて上[のぼ]りなさい。」"
  26: "ヨセフは百十歳[ひゃくじゅっさい]で死[し]んだ。人々[ひとびと]は彼[かれ]を葬[ほうむ]り、エジプトで棺[ひつぎ]に納[おさ]めた。"

notes:
  1: "ἐπιπεσὼν… ἐπὶ τὸ πρόσωπον — 顔に伏して (ἐπιπίπτω «пасть на»). ἐφίλησεν — 口づけした."
  2: "ἐνταφιασταῖς — ミイラ造りの者 (ἐνταφιαστής «бальзамировщик»; слав. «погребателем», ru «врачам» — толковательно). ἐνεταφίασαν — ミイラにした."
  3: "ἐπλήρωσαν… τεσσαράκοντα ἡμέρας — 四十日が満ちた. καταριθμοῦνται αἱ ἡμέραι τῆς ταφῆς — 葬りの日はこう数えられる. ἐπένθησεν… ἑβδομήκοντα ἡμέρας — 七十日間泣き悲しんだ (πενθέω «оплакивать»)."
  4: "τοὺς δυνάστας Φαραω — ファラオの高官たち (δυνάστης «вельможа, властелин»). εἰ εὗρον χάριν — 恵みを得ているなら. λαλήσατε περὶ ἐμοῦ εἰς τὰ ὦτα Φαραω — ファラオの耳に告げてください (букв. «скажите обо мне в уши фараона»)."
  5: "ὥρκισέν με λέγων — わたしに誓わせて言いました. Ἐν τῷ μνημείῳ, ᾧ ὤρυξα ἐμαυτῷ — 自分のために掘った墓に (ὀρύσσω «копать»). ἀναβὰς θάψω… καὶ ἐπανελεύσομαι — 上って…葬り…帰ってまいります. 〔こうして人々はヨセフの言葉をファラオに告げた〕 — καὶ εἶπον τῷ Φαραω κατὰ τὸ ῥῆμα Ιωσηφ: этих слов нет в gr-lxx-byz 50:5 (проверено bracket_check: φαραω/ειπον/ρημα — НЕТ), но они есть у csl-ru («И рекоша фараону по словеси иосифову») и jp-joc — потому в 〔…〕; ими закрывается переход к ответу фараона в ст. 6."
  6: "Ἀνάβηθι, θάψον… καθάπερ ὥρκισέν σε — 上って行き…誓わせたとおりに…葬れ."
  7: "συνανέβησαν… πάντες οἱ παῖδες Φαραω — ファラオのしもべたちも皆…上った. οἱ πρεσβύτεροι τοῦ οἴκου αὐτοῦ — その家の長老たち (πρεσβύτερος «старейшина»)."
  8: "πᾶσα ἡ πανοικία Ιωσηφ — ヨセフの全家 (πανοικία «весь дом»). τὴν συγγένειαν καὶ τὰ πρόβατα… ὑπελίποντο — 親族と羊と牛を…残した (συγγένεια «родня»; греч. допускает и «оставили родню»; csl понимает иначе — родня идёт, оставлен только скот — в тексте по греческому порядку)."
  9: "ἅρματα καὶ ἱππεῖς — 車と騎兵. ἡ παρεμβολὴ μεγάλη σφόδρα — 陣営は非常に大きい (παρεμβολή «стан, обоз»)."
  10: "ἅλων Αταδ — アタドの脱穀場 (ἅλων «гумно»). ἐκόψαντο κοπετὸν μέγαν — 大きく激しく泣き悲しんだ (κόπτομαι «рыдать, бить себя в грудь»). ἑπτὰ ἡμέρας — 七日間の喪 (πένθος «плач по умершему»)."
  11: "οἱ κάτοικοι τῆς γῆς Χανααν — その地の住民、カナン人たち. Πένθος μέγα τοῦτό ἐστιν τοῖς Αἰγυπτίοις — これはエジプト人の大きな喪だ. ἐκάλεσεν τὸ ὄνομα αὐτοῦ Πένθος Αἰγύπτου — 「エジプトの喪」と呼ばれた (в евр. и ru «Авель-Мицраим» — еврейское имя, в LXX его нет)."
  12: "ἐποίησαν αὐτῷ οὕτως οἱ υἱοὶ αὐτοῦ — ヤコブの子らは…そのために行った. καθὼς ἐνετείλατο — 命じられたとおりに (ἐντέλλομαι). καὶ ἔθαψαν αὐτὸν ἐκεῖ — そこで彼を葬った (по LXX; ст. 13 затем говорит о перенесении в Ханаан — повтор не сглажен)."
  13: "ἀνέλαβον αὐτὸν… εἰς γῆν Χανααν — カナンの地に運び. τὸ σπήλαιον τὸ διπλοῦν… κατέναντι Μαμβρη — マムレの向かいの二重の洞窟 (ср. 49:30; имени «Махпела» в LXX нет)."
  14: "ἀπέστρεψεν Ιωσηφ εἰς Αἴγυπτον — エジプトへ帰った. οἱ συναναβάντες θάψαι — 葬るためにともに上った者たち."
  15: "Ἰδόντες… ὅτι τέθνηκεν ὁ πατὴρ αὐτῶν — 父が死んだのを見て. Μήποτε μνησικακήσῃ ἡμῖν — 恨み…かもしれない (μνησικακέω «помнить зло»). ἀνταπόδομα ἀνταποδῷ — 報いる (ἀνταποδίδωμι)."
  16: "Ὁ πατήρ σου ὥρκισεν πρὸ τοῦ τελευτῆσαι αὐτὸν — 父は死ぬ前に…誓わせて言いました (τελευτάω «умирать»)."
  17: "Ἄφες αὐτοῖς τὴν ἀδικίαν καὶ τὴν ἁμαρτίαν — 不正と罪を赦してほしい (ἀφίημι «прощать»). ὅτι πονηρά σοι ἐνεδείξαντο — あなたに悪を行った (ἐνδείκνυμαι «сделать»). τοὺς θεράποντας τοῦ θεοῦ τοῦ πατρός σου — あなたの父の神のしもべたち (θεράπων «слуга»). ἔκλαυσεν… λαλούντων αὐτῶν — 彼らが語ったとき、泣いた."
  18: "Οἵδε ἡμεῖς σοι οἰκέται — 見よ、わたしたちはあなたのしもべです (οἰκέτης «домочадец, раб»)."
  19: "Μὴ φοβεῖσθε — 恐れてはならない. τοῦ γὰρ θεοῦ εἰμι ἐγώ — わたしは神に属する者である (букв. «я Божий»; слав. «Божий бо есмь аз»; jp-joc «我は神を畏る» — толкование, не буква)."
  20: "ὑμεῖς ἐβουλεύσασθε κατ᾽ ἐμοῦ εἰς πονηρά — あなたがたはわたしに対して悪を企てた. ὁ δὲ θεὸς ἐβουλεύσατο περὶ ἐμοῦ εἰς ἀγαθά — 神はわたしについて善を企てられた (параллель βουλεύομαι сохранена). ὅπως ἂν γενηθῇ ὡς σήμερον — 今日のようになり. ἵνα διατραφῇ λαὸς πολύς — 多くの民が養われるため (διατρέφω «прокормить»)."
  21: "ἐγὼ διαθρέψω ὑμᾶς καὶ τὰς οἰκίας ὑμῶν — あなたがたと…家の者たちを養う. παρεκάλεσεν αὐτοὺς — 彼らを慰め (παρακαλέω «утешать»). ἐλάλησεν αὐτῶν εἰς τὴν καρδίαν — 心に語りかけた (букв. «говорил им в сердце»)."
  22: "κατῴκησεν Ιωσηφ ἐν Αἰγύπτῳ — ヨセフはエジプトに住んだ. ἔζησεν… ἔτη ἑκατὸν δέκα — 百十年生きた."
  23: "εἶδεν… Εφραιμ παιδία ἕως τρίτης γενεᾶς — エフライムの子らを三代に及ぶまで見た (γενεά «род»). υἱοὶ Μαχιρ… ἐτέχθησαν ἐπὶ μηρῶν Ιωσηφ — マキルの子らも、ヨセフの膝の上で生まれた (μηροί «колени, бёдра» — новорождённого клали на колени)."
  24: "Ἐγὼ ἀποθνῄσκω — わたしは死ぬ. ἐπισκοπῇ δὲ ἐπισκέψεται ὑμᾶς ὁ θεός — 神は必ずあなたがたを顧み (ἐπισκοπή «посещение»; повтор корня сохранён). ἣν ὤμοσεν… Αβρααμ καὶ Ισαακ καὶ Ιακωβ — アブラハム、イサク、ヤコブに誓われた地."
  25: "ὥρκισεν Ιωσηφ τοὺς υἱοὺς Ισραηλ — イスラエルの子らに誓わせて. Ἐν τῇ ἐπισκοπῇ, ᾗ ἐπισκέψεται ὑμᾶς ὁ θεός — 神が必ず…顧みられるとき. συνανοίσετε τὰ ὀστᾶ μου ἐντεῦθεν μεθ᾽ ὑμῶν — わたしの骨を、ここからあなたがたとともに携えて上りなさい (συναναφέρω «унести вместе»; ср. Исх 13:19)."
  26: "ἐτελεύτησεν… ἐτῶν ἑκατὸν δέκα — 百十歳で死んだ. ἔθαψαν αὐτὸν καὶ ἔθηκαν ἐν τῇ σορῷ — 葬り、棺に納めた (σοφός «гроб, ковчег»; в ru добавлено «набальзамировали» — иное чтение)."
