# jp-box, Бытие, глава 50. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru)
# и jp-joc (1901, public domain). ru — только для понимания, не источник.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 50: бальзамирование и оплакивание Иакова (1–3), погребение в Ханаане (4–14),
# прощение братьев (15–21), старость и смерть Иосифа, клятва о костях (22–26).
# Красного и синего нет: говорят люди, не Христос.
# Кавычки: 「…」 — прямая речь; 『…』 — вложенная (слова отца в устах Иосифа, 5;
# слова отца в устах братьев, 17). В 5 и 17 есть третий уровень — клятва/просьба,
# переданная внутри вложенной речи; по японской типографской традиции она снова в 「…」.
# 〔…〕: в ст. 5 в конце — 〔こうして人々はヨセフの言葉をファラオに告げた〕:
# этих слов нет в gr-lxx-byz (проверено bracket_check), но они есть у csl-ru
# («И рекоша фараону по словеси иосифову») и jp-joc, — это церковное чтение.
# Сносок ⟨…⟩ нет: ミイラ, 香油, 棺, 骨 понятны или уже в корпусе. jp-ni не использовался.

