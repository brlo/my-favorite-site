verses:
  1: "ダビデの子[こ]ソロモン、イスラエルを治[おさ]めた王[おう]の箴言[しんげん]。"
  2: "知恵[ちえ]と戒[いまし]めとを知[し]り、思慮[しりょ]の言葉[ことば]を悟[さと]るため、"
  3: "言葉[ことば]の綾[あや]と謎解[なぞと]きとを受[う]け入[い]れ、真[しん]の義[ぎ]を悟[さと]り、裁[さば]きをまっすぐに整[ととの]えるため、"
  4: "悪意[あくい]のない者[もの]に才覚[さいかく]を、若[わか]い者[もの]に識見[しきけん]と思慮[しりょ]を与[あた]えるためである。"
  5: "これらを聞[き]けば、知恵[ちえ]ある者[もの]はさらに知恵深[ふか]くなり、悟[さと]りある者[もの]は舵取[かじと]りを身[み]につける。"
  6: "また、たとえと暗[くら]い言葉[ことば]、知恵[ちえ]ある者[もの]の言葉と謎[なぞ]とを悟[さと]るであろう。"
  7: "主[しゅ]を恐[おそ]れることは知恵[ちえ]の始[はじ]めであり、知恵[ちえ]を行[おこな]うすべての者[もの]にとって悟[さと]りは良[よ]いものである。神[かみ]への敬虔[けいけん]は識見[しきけん]の始[はじ]めであり、不敬[ふけい]な者[もの]は知恵[ちえ]と戒[いまし]めを蔑[さげす]む。"
  8: "わが子[こ]よ、父[ちち]の戒[いまし]めを聞[き]け、母[はは]の掟[おきて]を斥[しりぞ]けるな。"
  9: "それはあなたの頭[あたま]には恵[めぐ]みの冠[かんむり]、あなたの首[くび]には金[きん]の首輪[くびわ]となるからである。"
  10: "わが子[こ]よ、不敬[ふけい]な者[もの]たちに迷[まよ]わされるな。彼[かれ]らがあなたを誘[いざな]ってこう言[い]っても、応[おう]じてはならない。"
  11: "「わたしたちとともに来[こ]い。血[ち]を流[なが]す仲間[なかま]になれ。正[ただ]しい人[ひと]を不当[ふとう]にも地[ち]に埋[うず]めよう。"
  12: "陰府[よみ]が生[い]きた者[もの]を飲[の]み込[こ]むように、彼[かれ]を生[い]きたまま飲み込み、彼[かれ]の記憶[きおく]を地[ち]から取[と]り去[さ]ろう。"
  13: "彼[かれ]の貴重[きちょう]な財産[ざいさん]を手[て]に入[い]れ、わたしたちの家[いえ]を略奪品[りゃくだつひん]で満[み]たそう。"
  14: "あなたのくじをわたしたちの間[あいだ]に投[とう]じよ。わたしたちは皆[みな]で一[ひと]つの財布[さいふ]を手[て]に入[い]れ、一つの袋[ふくろ]を共有[きょうゆう]しよう。」"
  15: "彼[かれ]らとともにその道[みち]を行[ゆ]くな。彼[かれ]らの細道[ほそみち]からあなたの足[あし]を外[そ]らせ。"
  16: "彼[かれ]らの足[あし]は悪[あく]へと走[はし]り、血[ち]を流[なが]すことに急[いそ]いでいるからである。"
  17: "鳥[とり]のために網[あみ]を張[は]るのは、不正[ふせい]なことではない。"
  18: "彼[かれ]らは血[ち]を流[なが]すことに加[くわ]わりながら、自分[じぶん]たちに災[わざわ]いを蓄[たくわ]えている。不法[ふほう]な者[もの]たちの滅[ほろ]びは悪[あ]しきものである。"
  19: "これが、不法[ふほう]を行[おこな]うすべての者[もの]の道[みち]である。彼[かれ]らは不敬[ふけい]によって自分[じぶん]の魂[たましい]を奪[うば]い取[と]るのである。"
  20: "知恵[ちえ]は町[まち]の出口[でぐち]で歌[うた]われ、広場[ひろば]では大胆[だいたん]にふるまう。"
  21: "城壁[じょうへき]の頂[いただき]では告[つ]げ知[し]らせ、権力者[けんりょくしゃ]の門[もん]のそばに座[すわ]り、町[まち]の門では大胆[だいたん]に言[い]う。"
  22: "「悪意[あくい]のない者[もの]が義[ぎ]に執[と]りすがる限[かぎ]り、彼[かれ]らは恥[は]じない。しかし、愚[おろ]かな者[もの]たちは傲慢[ごうまん]を慕[した]い、不敬[ふけい]な者[もの]となって識見[しきけん]を憎[にく]んだ。"
  23: "そして彼[かれ]らは責[せ]めを受[う]けるべき者[もの]となった。見[み]よ、わたしはわたしの息[いき]の言葉[ことば]をあなたがたに注[そそ]ぎ、わたしの言葉をあなたがたに教[おし]えよう。"
  24: "わたしが呼[よ]んだのに、あなたがたは聞[き]かなかった。わたしが言葉[ことば]を差[さ]し伸[の]べたのに、あなたがたは耳[みみ]を傾[かたむ]けなかった。"
  25: "かえって、あなたがたはわたしの計画[けいかく]を無効[むこう]にし、わたしの責[せ]めに従[したが]わなかった。"
  26: "だから、わたしもあなたがたの滅[ほろ]びを笑[わら]い、あなたがたに破滅[はめつ]が来[く]るとき、喜[よろこ]び躍[おど]るであろう。"
  27: "突然[とつぜん]の騒乱[そうらん]があなたがたに降[ふ]りかかり、破滅[はめつ]が嵐[あらし]のように襲[おそ]い、苦難[くなん]と包囲[ほうい]があなたがたに臨[のぞ]み、あるいは破滅があなたがたに来[く]るとき。"
  28: "あなたがたがわたしを呼[よ]ぶとき、わたしは聞[き]かないであろう。悪[わる]い者[もの]たちがわたしを求[もと]めても、見[み]いだすことはない。"
  29: "彼[かれ]らは知恵[ちえ]を憎[にく]み、主[しゅ]の言葉[ことば]を受[う]け入[い]れなかったからである。"
  30: "また、わたしの計画[けいかく]に耳[みみ]を傾[かたむ]けようともせず、わたしの責[せ]めを嘲[あざけ]った。"
  31: "それゆえ、彼[かれ]らは自分[じぶん]の道[みち]の実[み]を食[た]べ、自分[じぶん]の不敬[ふけい]に飽[あ]き足[た]りるであろう。"
  32: "彼[かれ]らは幼[おさな]い者[もの]たちを虐[しいた]げたゆえに殺[ころ]され、不敬[ふけい]な者[もの]は吟味[ぎんみ]によって滅[ほろ]ぼされるからである。"
  33: "しかし、わたしに聞[き]く者[もの]は希望[きぼう]の上[うえ]に住[す]まい、すべての悪[あく]から恐[おそ]れることなく安[やす]らかに過[す]ごすであろう。」"

notes:
  1: "Надписание. Παροιμίαι Σαλωμῶντος υἱοῦ Δαυιδ, ὃς ἐβασίλευσεν ἐν Ισραηλ — «Притчи Соломона, сына Давидова, который царствовал в Израиле»: приложение υἱοῦ Δαυιδ и относительное ὃς относятся к Соломону; 箴言 как определяемое стоит в конце по-японски. Σαλωμων — ソロモン, Δαυιδ — ダビデ; ἐν Ισραηλ без артикля, «в Израиле»."
  2: "Цель книги. γνῶναι σοφίαν καὶ παιδείαν — «познать премудрость и наказание» (παιδεία — 戒め, не только «наказание»); νοῆσαί τε λόγους φρονήσεως — «уразуметь слова мудрости» (φρόνησις — 思慮). Цепь инфинитивов зависит от «Притчи»; в япон. — ために."
  3: "δέξασθαί τε στροφὰς λόγων — «принять извития словес» (στροφή — «поворот, извив речи»; слав. «извития словес», Син. «правила благоразумия»; передано 言葉の綾). У csl добавлено «и разрешения гаданий» — этого нет в LXX, по паритету внесено в основной текст без скобок (謎解き). νοῆσαι δικαιοσύνην ἀληθῆ — «уразуметь правду истинную»; κρίμα κατευθύνειν — «суд исправляти», т. е. судить прямо (κατευθύνω — «выпрямлять»), передано まっすぐに整える."
  4: "ἵνα δῷ ἀκάκοις πανουργίαν — «дать незлобивым коварство»: πανουργία здесь в хорошем смысле — «сметливость, находчивость» (слав. «коварство» буквально, Син. «смышленость»), передано 才覚. ἀκάκοις — «незлобивым», 悪意のない者. παιδὶ νέῳ αἴσθησίν τε καὶ ἔννοιαν — «отроку юному чувство и смысл» (αἴσθησις — 識見, ἔννοια — 思慮)."
  5: "τῶνδε ἀκούσας — «сих послушав»: τῶνδε относится к самим притчам. σοφὸς σοφώτερος ἔσται — «мудрый премудрее будет»; κυβέρνησιν κτήσεται — «строителство стяжет» (κυβέρνησις — «управление, кормление корабля»), передано 舵取り. Речь авторская, без кавычек."
  6: "νοήσει παραβολὴν καὶ σκοτεινὸν λόγον — «уразумеет притчу и темное слово»; ῥήσεις σοφῶν καὶ αἰνίγματα — «речения премудрых и гадания». Сказуемое νοήσει — будущее и продолжает 1:5, поэтому здесь не цель, а следствие."
  7: "Ἀρχὴ σοφίας φόβος θεοῦ — «начало премудрости страх Божий»: у csl и ru «страх Господень», взято церковное чтение (主を恐れること), вариант LXX (θεοῦ) отмечен здесь. σύνεσις ἀγαθὴ πᾶσι τοῖς ποιοῦσιν αὐτήν — «разум благ всем творящим его» (αὐτήν — σοφία). εὐσέβεια εἰς θεὸν ἀρχὴ αἰσθήσεως — «благочестие в Бога начало чувства» (αἴσθησις — 識見); ἀσεβεῖς ἐξουθενήσουσιν — «нечестивые уничижат»."
  8: "Наставление сыну; авторская речь. ἄκουε, υἱέ, παιδείαν πατρός σου — «слушай, сын, наказание отца твоего»; θεσμοὺς μητρός σου — «заветы матери твоей» (θεσμός — «установление», передано 掟); μὴ ἀπώσῃ — «не отрини»."
  9: "στέφανον γὰρ χαρίτων — «венец благодатей» (χάριτες — «прелесть, благодать», слав. «благодатей»); κλοιὸν χρύσεον περὶ σῷ τραχήλῳ — «гривну злату о твоей выи» (κλοιός — «ошейник, гривна»), 金の首輪. Сказуемое δέξῃ — «примешь»; по-японски именное となる."
  10: "Υἱέ, μή σε πλανήσωσιν ἄνδρες ἀσεβεῖς — «сын, да не прельстят тебя мужи нечестивии»; μηδὲ βουληθῇς — «не восхощи», т. е. не соглашайся. ἐὰν παρακαλέσωσί σε λέγοντες — «если будут просить тебя, говоря»: у csl эта клауза стоит в 1:11, держимся gr, поэтому стих кончается こう言っても, а слова нечестивых начинаются с 1:11."
  11: "Слова нечестивых — 「…」 (11–14). Ἐλθὲ μεθ᾽ ἡμῶν — «иди с нами»; κοινώνησον αἵματος — «приобщися крове», т. е. стань участником кровопролития (передано 血を流す仲間になれ); κρύψωμεν εἰς γῆν ἄνδρα δίκαιον ἀδίκως — «скрыем в землю мужа праведна неправедно», т. е. заживо погребём (ἀδίκως — 不当にも)."
  12: "καταπίωμεν αὐτὸν ὥσπερ ᾅδης ζῶντα — «пожрем его якоже ад жива» (ᾅδης — 陰府, как по корпусу); ἄρωμεν αὐτοῦ τὴν μνήμην ἐκ γῆς — «возьмём память его от земли» (μνήμη — 記憶), т. е. истребим самую память. Продолжение речи нечестивых."
  13: "τὴν κτῆσιν αὐτοῦ τὴν πολυτελῆ — «стяжание его многоценное» (πολυτελής — «драгоценный»); καταλαβώμεθα — «приимем, захватим»; σκύλων — «корыстей» (σκῦλον — «добыча, трофей»)."
  14: "τὸν σὸν κλῆρον βάλε ἐν ἡμῖν — «жребий твой положи с нами» (κλῆρος — «жребий, доля»), передано くじ; κοινὸν βαλλάντιον — «обще влагалище», общий кошель (βαλλάντιον — 財布); μαρσίππιον ἕν — «мешец един» (μαρσίππιον — 袋). Конец речи нечестивых."
  15: "Возврат к авторскому наставлению. μὴ πορευθῇς ἐν ὁδῷ μετ᾽ αὐτῶν — «не иди в путь с ними»; ἔκκλινον τὸν πόδα σου ἐκ τῶν τρίβων αὐτῶν — «уклони ногу твою от стезь их» (τρίβος — 細道). Обращения «сын мой» в gr и csl нет (есть в ru) — не добавлено."
  16: "οἱ πόδες αὐτῶν εἰς κακίαν τρέχουσιν — «нозе их на зло текут»; ταχινοὶ τοῦ ἐκχέαι αἷμα — «скори суть излияти кровь» (ταχινός — «быстрый»). Причина, почему не следует идти с ними."
  17: "οὐ γὰρ ἀδίκως ἐκτείνεται δίκτυα πτερωτοῖς — «не без правды простираются мрежи пернатым»: LXX читает οὐκ ἀδίκως («не без правды, не напрасно»), а не «в глазах птиц» (МТ, Син. «напрасно»). Смысл: сеть на злодея ставится по правде. В тексте 不正なことではない, по LXX."
  18: "αὐτοὶ οἱ φόνου μετέχοντες — «сами убийству приобщающиеся»; θησαυρίζουσιν ἑαυτοῖς κακά — «сокровищствуют себе злая»; καταστροφὴ ἀνδρῶν παρανόμων κακή — «разрушение мужей законопреступных зло». Связь с 1:17: сеть, поставленная на других, губит их самих."
  19: "αὗται αἱ ὁδοί εἰσιν πάντων τῶν συντελούντων τὰ ἄνομα — «сии путие суть всех творящих беззаконная»; τῇ ἀσεβείᾳ τὴν ἑαυτῶν ψυχὴν ἀφαιροῦνται — «нечестием бо свою душу отемлют» (ἀφαιρέω — «отнимать»), т. е. сами лишают себя жизни. Итог первого наставления."
  20: "Зачин раздела Премудрости на улицах (авторское введение). Σοφία ἐν ἐξόδοις ὑμνεῖται — «премудрость во исходех поется» (ὑμνέω — «воспевать»); ἐν πλατείαις παρρησίαν ἄγει — «в стогнах дерзновение водит» (παρρησία — «дерзновение, смелость»), передано 大胆にふるまう. 20–21 — авторское введение, без кавычек; речь начинается с 1:22."
  21: "ἐπ᾽ ἄκρων τειχέων κηρύσσεται — «на краех стен проповедуется»; ἐπὶ πύλαις δυναστῶν παρεδρεύει — «у врат сильных приседит» (παρεδρεύω — «сидеть при»); θαρροῦσα λέγει — «дерзающи глаголет»: λέγει вводит прямую речь, которая открывается в 1:22."
  22: "Речь Премудрости — 「…」 (22–33). Ὅσον ἂν χρόνον ἄκακοι ἔχωνται τῆς δικαιοσύνης, οὐκ αἰσχυνθήσονται — «елико время незлобивии держатся правды, не постыдятся»: LXX не даёт вопроса «доколе?» (он в МТ и Син.), а временное придаточное, поэтому 限り. οἱ ἄφρονες τῆς ὕβρεως ὄντες ἐπιθυμηταί — «безумнии досады суще желателие» (ὕβρις — 傲慢); ἐμίσησαν αἴσθησιν — «возненавидеша чувство» (αἴσθησις — 識見)."
  23: "καὶ ὑπεύθυνοι ἐγένοντο ἐλέγχοις — «и повинни быша обличением», т. е. стали подлежать обличению (ἔλεγχος — 責め). ἰδοὺ προήσομαι ὑμῖν ἐμῆς πνοῆς ῥῆσιν — «се, предложу вам моего дыхания речение» (πνοή — «дыхание», слав. «дыхание»; ῥῆσις — «изречение»); διδάξω ὑμᾶς τὸν ἐμὸν λόγον — «научу вас моему словеси»."
  24: "ἐπειδὴ ἐκάλουν καὶ οὐχ ὑπηκούσατε — «понеже звах, и не послушасте»; ἐξέτεινον λόγους καὶ οὐ προσεῖχετε — «простирах словеса, и не внимасте»: LXX говорит о простёртых словах, а не руках (Син. «простирала руку»), образ сохранён — 言葉を差し伸べた."
  25: "ἀλλὰ ἀκύρους ἐποιεῖτε ἐμὰς βουλάς — «но отметасте моя советы» (ἄκυρος — «недействительный», передано 無効にする); τοῖς ἐμοῖς ἐλέγχοις ἠπειθήσατε — «моим обличением не внимасте» (ἀπειθέω — «не покоряться, не слушать»)."
  26: "τοιγαροῦν κἀγὼ τῇ ὑμετέρᾳ ἀπωλείᾳ ἐπιγελάσομαι — «убо и аз вашей погибели посмеюся»; καταχαροῦμαι — «порадуюся» (усиленное «возрадуюсь», передано 喜び躍る); ἡνίκα ἂν ἔρχηται ὑμῖν ὄλεθρος — «егда приидет вам пагуба»."
  27: "ὡς ἂν ἀφίκηται ὑμῖν ἄφνω θόρυβος — «егда приидет на вы внезапу мятеж» (θόρυβος — 騒乱); καταστροφὴ ὁμοίως καταιγίδι — «низвращение подобно бури» (καταιγίς — «буря, шквал»); θλῖψις καὶ πολιορκία — «печаль и градоразорение» (πολιορκία — «осада», передано 包囲). Всё это — придаточное времени к 1:26; ὄλεθρος повторён в 26 и 27, повтор сохранён."
  28: "ἔσται γὰρ ὅταν ἐπικαλέσησθέ με, ἐγὼ δὲ οὐκ εἰσακούσομαι ὑμῶν — «будет бо егда призовете мя, аз же не послушаю вас»; ζητήσουσίν με κακοὶ καὶ οὐχ εὑρήσουσιν — «взыщут мене злии и не обрящут»."
  29: "ἐμίσησαν γὰρ σοφίαν — «возненавидеша бо премудрость»; τὸν φόβον τοῦ κυρίου οὐ προείλαντο — «страха Господня не избраша». У csl иное чтение — «словесе же Господня не прияша» (λόγον вместо φόβον, «не прияша» вместо «не избраша»), по паритету взято церковное чтение — 主の言葉. Смысл тот же: отвергли слово Господне."
  30: "οὐδὲ ἤθελον ἐμαῖς προσέχειν βουλαῖς — «ниже хотеша внимати моим советом»; ἐμυκτήριζον ἐμοὺς ἐλέγχους — «ругахуся моим обличением» (μυκτηρίζω — «издеваться»), передано 嘲る."
  31: "ἔδονται τῆς ἑαυτῶν ὁδοῦ τοὺς καρπούς — «снедят своих путий плоды»; τῆς ἑαυτῶν ἀσεβείας πλησθήσονται — «своего нечестия насытятся» (πίμπλημι — «наполнять, насыщать»), передано 飽き足りる. Приговор как плод их же пути."
  32: "ἀνθ᾿ ὧν γὰρ ἠδίκουν νηπίους, φονευθήσονται — «зане обидеша младенцев, убиени будут»: LXX говорит о «младенцах, незлобивых» (νήπιοι), а не о «невеждах» (Син. «упорство невежд»), сохранено 幼い者たち. ἐξετασμὸς ἀσεβεῖς ὀλεῖ — «истязание нечестивыя погубит» (ἐξετασμός — «испытание, допрос»), передано 吟味."
  33: "ὁ δὲ ἐμοῦ ἀκούων — «мене же слушаяй»; κατασκηνώσει ἐπ᾿ ἐλπίδι — «вселится на уповании» (ἐλπίς — 希望), образ сохранён: 希望の上に住まう; ἡσυχάσει ἀφόβως ἀπὸ παντὸς κακοῦ — «почиет без страха от всякаго зла». Конец речи Премудрости."
