# jp-box, Притчи, глава 1. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc (1901) есть для этой главы: использован как контроль церковного
# чтения, архаизмы не копировались. jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 1: надписание и цель книги (1–6), страх Господень — начало премудрости (7),
# наставление сыну и слова нечестивых (8–19), речь Премудрости на улицах (20–33).
# Голоса: авторские изречения без кавычек; слова нечестивых — 「…」 (11–14);
# речь Премудрости — 「…」 (22–33) одной непрерывной цитатой. 1:20–21 — авторское
# введение (θαρροῦσα λέγει в конце 21), поэтому кавычки открываются с 1:22.
# Нумерация по gr: 33 стиха; в 1:10–11 csl иначе делит клаузу «если будут уговаривать
# тебя, говоря» (у csl она в 1:11) — держимся gr.
# 〔…〕 нет: все 33 стиха есть в gr-lxx-byz. Сносок ⟨…⟩ нет: 知恵, 陰府, 戒め, 冠,
# 網, 広場 уже в корпусе.

