verses:
  1: "主[しゅ]の言葉[ことば]がエレミヤに再[ふたた]び臨[のぞ]んだ。その時[とき]、彼はまだ牢[ろう]の庭[にわ]に縛[しば]られていた。"
  2: "主[しゅ]はこう言[い]われる。地[ち]を造[つく]り、これを整[ととの]えて堅[かた]く立[た]てた方[かた]、その名[な]は主[しゅ]である。"
  3: "「わたしを呼[よ]べ。そうすれば、わたしはあなたに答[こた]え、あなたが知[し]らない大[おお]きく力[ちから]あることを示[しめ]す。」"
  4: "イスラエルの神[かみ]である主[しゅ]は、この都[みやこ]の家[いえ]々[いえ]と、ユダの王[おう]たちの家々について、こう言[い]われる。「これらの家は、塁[るい]と堡[とりで]のために取[と]り壊[こわ]され、"
  5: "カルデア人[じん]と戦[たたか]うために用[もち]いられ、わたしが怒[いか]りと憤[いきどお]りのうちに打[う]った人[ひと]の死体[したし]で満[み]たされる。わたしは彼らのすべての悪[あく]のゆえに、彼らから顔[かお]を背[そむ]けたからである。"
  6: "見[み]よ、わたしは都[みやこ]に癒[いや]しと手当[てあて]を加[くわ]え、これを癒[いや]し、彼らに平和[へいわ]と真実[しんじつ]が満[み]ちるのを見[み]せる。"
  7: "わたしはユダの捕囚[ほしゅう]とイスラエルの捕囚を帰[かえ]らせ、彼らを初[はじ]めのように建[た]て直[なお]す。"
  8: "わたしは、彼らがわたしに対して犯[おか]したすべての不法[ふほう]から彼らを清[きよ]め、わたしに犯[おか]してわたしから離[はな]れたすべての罪[つみ]を赦[ゆる]す。"
  9: "この都[みやこ]は、わたしに喜[よろこ]びと賛美[さんび]と誉[ほま]れとなる。わたしが彼らに行[おこな]うすべての良[よ]いことを聞[き]く地[ち]のすべての民[たみ]は、わたしが彼らに与[あた]えるすべての良いものと平和[へいわ]のゆえに、恐[おそ]れ、心[こころ]を痛[いた]める。」"
  10: "主[しゅ]はこう言[い]われる。「あなたがたが『人[ひと]も家畜[かちく]もない荒[あ]れ地[ち]だ』と言[い]うこの場所[ばしょ]、すなわち、人も家畜もいない、荒[あ]れ果[は]てたユダの都[みやこ]々[みやこ]と、エルサレムの外[そと]の所[ところ]で、再[ふたた]び聞[き]こえる。"
  11: "喜[よろこ]びの声[こえ]と楽しみの声、花婿[はなむこ]の声と花嫁[はなよめ]の声、『万軍[ばんぐん]の主[しゅ]に感謝[かんしゃ]せよ。主[しゅ]は善[よ]い方[かた]、そのあわれみは永遠[えいえん]に及[およ]ぶ』と言[い]う者[もの]たちの声、また主[しゅ]の家[いえ]に賛美[さんび]の供[そな]え物[もの]を携[たずさ]えて来[く]る者たちの声が。わたしはこの地[ち]の捕囚[ほしゅう]を、前[まえ]のように帰[かえ]らせるからである、と主[しゅ]は言[い]われる。」"
  12: "万軍[ばんぐん]の主[しゅ]はこう言[い]われる。「人[ひと]も家畜[かちく]もいないこの荒[あ]れた場所[ばしょ]、そのすべての都[みやこ]で、羊飼[ひつじか]いたちが羊[ひつじ]を伏[ふ]さ寝[ね]させる宿[やど]りが、再[ふたた]びある。"
  13: "山[やま]の都々[みやこみやこ]、低[ひく]い地[ち]の都々、南[みなみ]の都々、ベニヤミンの地[ち]、エルサレムの周[まわ]り、ユダの都々で、羊[ひつじ]が再[ふたた]び、数[かぞ]える者[もの]の手[て]もとに通[とお]り過[す]ぎる、と主[しゅ]は言[い]われる。」"

notes:
  1: "Καὶ ἐγένετο λόγος κυρίου πρὸς Ιερεμιαν δεύτερον — «и было слово Господне к Иеремии во второй раз» (δεύτερον — вторично, 再び); αὐτὸς ἦν ἔτι δεδεμένος ἐν τῇ αὐλῇ τῆς φυλακῆς — «он ещё был связан во дворе стражи» (δέω в перф. — связанный; αὐλή — двор, 牢の庭). Слав. «И бысть слово Господне ко иеремии вторицею, тойже бяше еще связан во дворе темничнем». Вводная формула вне кавычек."
  2: "Οὕτως εἶπεν κύριος ποιῶν γῆν καὶ πλάσσων αὐτὴν — «так говорит Господь, творящий землю и образующий её» (ποιέω, πλάσσω — лепить, образовывать); τοῦ ἀνορθῶσαι αὐτήν — «чтобы утвердить (восставить) её» (ἀνορθόω); κύριος ὄνομα αὐτῷ — «Господь — имя Ему». Слав. «творяй землю и устрояяй ю, еже исправити ю, Господь имя ему». Имя «Господь» (κύριος) — передача тетраграмматона, как по всему корпусу."
  3: "Κέκραξον πρός με, καὶ ἀποκριθήσομαί σοι — «воззови ко Мне, и Я отвечу тебе» (κράζω — взывать; ἀποκρίνομαι — отвечать); ἀπαγγελῶ σοι μεγάλα καὶ ἰσχυρά — «возвещу тебе великое и крепкое» (ἀπαγγέλλω — возвещать; ἰσχυρός — сильный, 力ある); ἃ οὐκ ἔγνως αὐτά — «чего ты не знал». Слав. «возопий ко мне, и отвещаю ти и возвещу тебе великая и крепкая, ихже не разумел еси». Цитата в стихе закрывается."
  4: "περὶ οἴκων τῆς πόλεως ταύτης καὶ περὶ οἴκων βασιλέως Ιουδα — «о домах города сего и о домах царя Иудина»; τῶν καθῃρημένων εἰς χάρακας καὶ προμαχῶνας — «разрушаемых для валов и передовых укреплений» (καθαιρέω — разрушать; χάραξ — вал, частокол; προμαχών — передовое укрепление, 堡). Слав. «о домех града сего и о храмех царя иудина, растерзанных на остроги и на забрала». Предложение продолжается в 40:5; цитата идёт до конца 40:9."
  5: "τοῦ μάχεσθαι πρὸς τοὺς Χαλδαίους — «чтобы воевать с Халдеями» (μάχομαι); πληρῶσαι αὐτὴν τῶν νεκρῶν τῶν ἀνθρώπων — «наполнить его трупами людей» (πληρόω; νεκρός — мёртвый, 死体); οὓς ἐπάταξα ἐν ὀργῇ μου καὶ ἐν θυμῷ μου — «которых Я поразил в гневе Моём и ярости Моей» (πατάσσω); ἀπέστρεψα τὸ πρόσωπόν μου ἀπ᾽ αὐτῶν — «отвратил лицо Моё от них»; περὶ πασῶν τῶν πονηριῶν αὐτῶν — «за все злобы их». В ru (МТ) «Я сокрыл лице Моё от города сего» — иное чтение, в текст не внесено."
  6: "ἀνάγω αὐτῇ συνούλωσιν καὶ ἴαμα — «возведу ей заживление и исцеление» (ἀνάγω — возводить; συνούλωσις — заживление раны; ἴαμα — исцеление, 手当); φανερώσω αὐτοῖς εἰσακοῦειν — «явлю им, чтобы слушать» (φανερόω — являть; εἰσακούω — слушать); ἰατρεύσω αὐτὴν — «исцелю её» (ἰατρεύω; город — жен. рода); ποιήσω αὐτοῖς εἰρήνην καὶ πίστιν — «сотворю им мир и веру» (εἰρήνη — мир, 平和; πίστις — верность, истина, 真実). Слав. «наведу на ня срастение язвы и изцеление… и сотворю им мир и веру»."
  7: "ἐπιστρέψω τὴν ἀποικίαν Ιουδα καὶ τὴν ἀποικίαν Ισραηλ — «возвращу переселение Иуды и переселение Израиля» (ἀποικία — переселение, плен, 捕囚); οἰκοδομήσω αὐτοὺς καθὼς τὸ πρότερον — «построю их, как прежде» (οἰκοδομέω; πρότερον — прежде). Слав. «обращу преселение иудино и преселение израилево, и согражду я, якоже и прежде»."
  8: "καθαριῶ αὐτοὺς ἀπὸ πασῶν τῶν ἀδικιῶν αὐτῶν — «очищу их от всех неправд их» (καθαρίζω — очищать; ἀδικία — неправда, 不法); ὧν ἡμάρτοσάν μοι — «которыми согрешили Мне» (ἁμαρτάνω); οὐ μὴ μνησθῶ ἁμαρτιῶν αὐτῶν — «не помяну грехов их» (μιμνήσκομαι); ἀπέστησαν ἀπ᾽ ἐμοῦ — «отступили от Меня» (ἀφίστημι). οὐ μὴ μνησθῶ ἁμαρτιῶν αὐτῶν — «не помяну грехов их» (μιμνήσκομαι; LXX); слав. вместо этого читает «милостив буду всем неправдам их» («буду милостив ко всем неправдам их», ср. МТ и 38:34) — в тексте по csl 赦す, чтение LXX отмечено здесь."
  9: "ἔσται εἰς εὐφροσύνην καὶ εἰς αἶνεσιν καὶ εἰς μεγαλειότητα — «будет в веселие, хвалу и величие» (εὐφροσύνη — веселие; αἶνεσις — хвала, 賛美; μεγαλειότης — величие); παντὶ τῷ λαῷ τῆς γῆς — «всему народу земли»; οἵτινες ἀκούσονται πάντα τὰ ἀγαθά — «которые услышат все блага»; φοβηθήσονται καὶ πικρανθήσονται — «убоятся и огорчатся» (πικραίνω — делать горьким, огорчать, 心を痛める): второй глагол неожидан, вероятно «будут поражены»; слав. «убоятся, и огорчатся». Цитата закрывается."
  10: "Ἔτι ἀκουσθήσεται ἐν τῷ τόπῳ τούτῳ — «ещё будет слышно на месте этом»; ᾧ ὑμεῖς λέγετε Ἔρημός ἐστιν ἀπὸ ἀνθρώπων καὶ κτηνῶν — «о котором вы говорите: пусто от людей и скотов» (ἔρημος — пустой, 荒れ地; κτῆνος — скот); ἐν πόλεσιν Ιουδα καὶ ἔξωθεν Ιερουσαλημ ταῖς ἠρημωμέναις — «в городах Иуды и вне Иерусалима, опустевших» (ἐρημόω — опустошать); παρὰ τὸ μὴ εἶναι ἄνθρωπον καὶ κτήνη — «из-за того, что нет человека и скота». Слав. «еще услышится в сем месте, о немже вы глаголете: пусто есть от человек и от скот»."
  11: "φωνὴ εὐφροσύνης καὶ φωνὴ χαρμοσύνης — «голос веселия и голос радости» (χαρμοσύνη — радость); φωνὴ νυμφίου καὶ φωνὴ νύμφης — «голос жениха и голос невесты» (νυμφίος, νύμφη; 花婿, 花嫁); Ἐξομολογεῖσθε κυρίῳ παντοκράτορι — «славьте (исповедуйте) Господа Вседержителя» (ἐξομολογέομαι — славословить, благодарить); ὅτι χρηστὸς κύριος — «ибо благ Господь» (χρηστός — благой); εἰς τὸν αἰῶνα τὸ ἔλεος αὐτοῦ — «вовек милость Его» (ἔλεος); εἰσοίσουσιν δῶρα εἰς οἶκον κυρίου — «принесут дары в дом Господень» (δῶρον — дар): слав. добавляет «похваления» («дары похваления») — нет в LXX, внесено без скобок (賛美の供え物); ὅτι ἀποστρέψω πᾶσαν τὴν ἀποικίαν τῆς γῆς ἐκείνης κατὰ τὸ πρότερον — «ибо возвращу всё переселение земли той, как прежде». Слова благодарения — 『…』. Цитата закрывается."
  12: "οὕτως εἶπεν κύριος τῶν δυνάμεων — «так говорит Господь сил» (δυνάμεις — силы; 万軍の主); ἐν τῷ τόπῳ τούτῳ τῷ ἐρήμῳ — «на месте этом пустом»; καταλύματα ποιμένων — «жилища пастухов» (κατάλυμα — постой, жилище, 宿り; ποιμήν — пастух, 羊飼い); κοιταζόντων πρόβατα — «покоящих овец» (κοιτάζω — укладывать спать, 伏さ寝させる; πρόβατον — овца). Слав. «еще будут на сем месте пустем… обиталища пастухов пасущих овцы». Открывается новое слово (40:12–13)."
  13: "ἐν πόλεσιν τῆς ὀρεινῆς — «в городах нагорных» (ὀρεινή — нагорная страна); τῆς Σεφηλα — «Шефелы» (низменность, 低い地; транслитерация, ср. 39:44); τῆς Ναγεβ — «Негева» (юг, 南; транслитерация); ἐν γῇ Βενιαμιν — «в земле Вениамина»; ἐν ταῖς κύκλῳ Ιερουσαλημ — «в окрестностях Иерусалима»; ἔτι παρελεύσεται πρόβατα ἐπὶ χεῖρα ἀριθμοῦντος — «ещё пройдут овцы под руку считающего» (παραπορεύομαι — проходить мимо; ἀριθμέω — считать): образ стада, проходящего под жезлом пастуха при счёте. Слав. «еще пойдут овцы к руце изчисляющаго, глаголет Господь». Цитата закрывается."
