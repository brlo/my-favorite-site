# jp-box, Иеремия, глава 40. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для книги почти нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 40 = слав./ru 33: обещание восстановления. 1–2 второе слово Господне в темнице,
# «Господь имя Ему»; 3 призыв воззвать и обетование великого и сокровенного;
# 4–9 о домах города, которые разрушаются: «вот, Я приложу пластырь и исцеление»,
# возвращение плена, очищение, город — в радость и хвалу; 10–11 снова будет слышен
# голос радости и жениха и невесты, «славьте Господа, ибо вовек милость Его»;
# 12–13 жилища пастухов, стада под рукою считающего.
# Голоса: 40:1 — вводная формула вне кавычек; 40:2 — формула вне кавычек (слова
# «Господь имя Ему» принадлежат ей); 40:3 — 「…」 (слово Господа, одно в стихе);
# 40:4 — формула + 「…» (речь идёт до конца 40:9); 40:10 — формула + 「…» (до конца
# 40:11; «万軍の主に感謝せよ…」 в 11 — 『…』); 40:12 — формула + 「…» (до конца 40:13).
# Нумерация по gr: 13 стихов, совпадает со слав. и ru. «Точек» нет.
# 〔…〕 нет. Слав. добавления внесены без скобок, отмечены в notes: 40:8 «милостив
# буду» вместо LXX «не помяну», 40:11 «дары похваления» (в LXX только «дары»).
# Сносок ⟨…⟩ нет: 塁, 花婿, 花嫁, 羊飼い, 群れ, 花嫁, 平和, 真実, 契約 (в 40 нет),
# 嗣業 уже в корпусе; シェフェラ, ネゲブ — транслитерация, оговорена.
# Имена: エレミヤ, ユダ, イスラエル, エルサレム, ベニヤミン, カルデア人 — по корпусу.

