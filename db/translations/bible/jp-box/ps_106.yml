# jp-box, Псалтирь, псалом 106. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный 常体, без 文語.
# Нумерация — славяно-синодальная (csl-ru): в слав. надписание отдельным стихом
# не стоит, поэтому наш стих 0 (надписание) влит в начало стиха 1; дальше номера 1..43.
# Псалом 106: призыв к искупленным (1–3); четыре картины избавления —
# блуждающие в пустыне (4–9), узники в темнице (10–16), больные (17–22),
# мореплаватели в буре (23–32); Господь изменяет судьбы (33–42); заключение (43).
# Красного и синего нет: прямая речь — только призыв к хвале, без кавычек.
# 〔…〕 нет: все слова в gr-lxx-byz есть.
# セラ (διάψαλμα) в этой главе нет.
# Сносок ⟨…⟩ нет: 青銅, かんぬき, 港, 長老 уже в корпусе или понятны.
# jp-ni не использовался.

