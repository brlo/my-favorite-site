verses:
  1: "アレルヤ。主[しゅ]に感謝[かんしゃ]せよ。主[しゅ]はいつくしみ深[ぶか]く、そのあわれみはとこしえに絶[た]えないからである。"
  2: "主[しゅ]に贖[あがな]われた者[もの]たちはこう言[い]え。主[しゅ]は彼[かれ]らを敵[てき]の手[て]から贖[あがな]い出[だ]された。"
  3: "主[しゅ]は彼[かれ]らをもろもろの国[くに]から、東[ひがし]から、西[にし]から、北[きた]から、海[うみ]のほとりから集[あつ]められた。"
  4: "彼[かれ]らは水[みず]のない荒野[こうや]をさまよい、住[す]むべき町[まち]への道[みち]を見[み]いだせなかった。"
  5: "飢[う]え渇[かわ]いて、その魂[たましい]は彼[かれ]らのうちに尽[つ]き果[は]てようとしていた。"
  6: "彼[かれ]らは苦[くる]しみのうちで主[しゅ]に呼[よ]び、主[しゅ]はその苦難[くなん]から彼[かれ]らを救[すく]い出[だ]された。"
  7: "主[しゅ]は彼[かれ]らをまっすぐな道[みち]に導[みちび]き、住[す]むべき町[まち]へ行[ゆ]かせられた。"
  8: "彼[かれ]らは主[しゅ]に感謝[かんしゃ]すべきである。主[しゅ]のあわれみと、人[ひと]々[びと]に行[おこな]われた奇[き]跡[せき]のゆえに。"
  9: "主[しゅ]はむなしい魂[たましい]を満[み]ち足[た]らせ、飢[う]えた魂[たましい]を良[よ]いもので満[み]たされたからである。"
  10: "闇[やみ]と死[し]の影[かげ]のうちに座[すわ]り、貧[まず]しさと鉄[てつ]の鎖[くさり]に縛[しば]られた者[もの]たち、"
  11: "彼[かれ]らは神[かみ]の言葉[ことば]に逆[さから]い、至高[しこう]の神[かみ]の計[はかりごと]を拒[こば]んだからである。"
  12: "主[しゅ]は労苦[ろうく]によって彼[かれ]らの心[こころ]を低[ひく]くされた。彼[かれ]らは弱[よわ]り果[は]て、助[たす]ける者[もの]もなかった。"
  13: "彼[かれ]らは苦[くる]しみのうちで主[しゅ]に呼[よ]び、主[しゅ]はその苦難[くなん]から彼[かれ]らを救[すく]われた。"
  14: "主[しゅ]は彼[かれ]らを闇[やみ]と死[し]の影[かげ]から連[つ]れ出[だ]し、その束縛[そくばく]を断[た]ち切[き]られた。"
  15: "彼[かれ]らは主[しゅ]に感謝[かんしゃ]すべきである。主[しゅ]のあわれみと、人[ひと]々[びと]に行[おこな]われた奇[き]跡[せき]のゆえに。"
  16: "主[しゅ]は青銅[せいどう]の門[もん]を砕[くだ]き、鉄[てつ]のかんぬきを折[お]られたからである。"
  17: "主[しゅ]は愚[おろ]かな者[もの]たちを、その不法[ふほう]の道[みち]から引[ひ]き上[あ]げられた。彼[かれ]らはその不法[ふほう]のゆえに低[ひく]くされていたからである。"
  18: "彼[かれ]らの魂[たましい]はどんな食物[しょくもつ]も嫌[いと]い、死[し]の門[もん]に近[ちか]づいていた。"
  19: "彼[かれ]らは苦[くる]しみのうちで主[しゅ]に呼[よ]び、主[しゅ]はその苦難[くなん]から彼[かれ]らを救[すく]われた。"
  20: "主[しゅ]はその言葉[ことば]を送[おく]って彼[かれ]らを癒[いや]し、その滅[ほろ]びから彼[かれ]らを救[すく]い出[だ]された。"
  21: "彼[かれ]らは主[しゅ]に感謝[かんしゃ]すべきである。主[しゅ]のあわれみと、人[ひと]々[びと]に行[おこな]われた奇[き]跡[せき]のゆえに。"
  22: "彼[かれ]らは賛美[さんび]のいけにえをささげ、喜[よろこ]びのうちに主[しゅ]のわざを告[つ]げ知[らせ]るべきである。"
  23: "船[ふね]に乗[の]って海[うみ]に下[くだ]り、大[おお]きな水[みず]の上[うえ]で仕事[しごと]をする者[もの]たち、"
  24: "彼[かれ]らは主[しゅ]のわざと、深[ふか]い淵[ふち]でのその奇[き]跡[せき]を見[み]た。"
  25: "主[しゅ]が言[い]われると、嵐[あらし]の風[かぜ]が起[お]こり、海[うみ]の波[なみ]が高[たか]く盛[も]り上[あ]がった。"
  26: "彼[かれ]らは天[てん]にまで上[のぼ]り、淵[ふち]にまで下[くだ]る。その魂[たましい]は苦[くる]しみのうちに溶[と]け消[き]えた。"
  27: "彼[かれ]らは揺[ゆ]れ動[うご]き、酔[よ]った者[もの]のようによろめいた。その知恵[ちえ]はすべて飲[の]み尽[つ]くされた。"
  28: "彼[かれ]らは苦[くる]しみのうちで主[しゅ]に呼[よ]び、主[しゅ]はその苦難[くなん]から彼[かれ]らを連[つ]れ出[だ]された。"
  29: "主[しゅ]が嵐[あらし]に命[めい]じると、嵐[あらし]はそよ風[かぜ]となり、海[うみ]の波[なみ]は静[しず]まった。"
  30: "彼[かれ]らは静[しず]けになったことを喜[よろこ]び、主[しゅ]は彼[かれ]らを望[のぞ]みの港[みなと]へ導[みちび]かれた。"
  31: "彼[かれ]らは主[しゅ]に感謝[かんしゃ]すべきである。主[しゅ]のあわれみと、人[ひと]々[びと]に行[おこな]われた奇[き]跡[せき]のゆえに。"
  32: "彼[かれ]らは民[たみ]の集[つど]いのうちで主[しゅ]をあがめ、長老[ちょうろう]たちの座[ざ]のうちで主[しゅ]を賛美[さんび]すべきである。"
  33: "主[しゅ]は川[かわ]を荒野[こうや]に、水[みず]の流[なが]れを乾[かわ]いた地[ち]に変[か]えられた。"
  34: "実[みの]り豊[ゆた]かな地[ち]を塩[しお]の地[ち]に変[か]えられた。そこに住[す]む者[もの]の悪[わる]さのゆえである。"
  35: "主[しゅ]は荒野[こうや]を池[いけ]に、乾[かわ]いた地[ち]を水[みず]の泉[いずみ]に変[か]えられた。"
  36: "主[しゅ]はそこに飢[う]えた者[もの]たちを住[す]まわせ、彼[かれ]らは住[す]むべき町[まち]を築[きず]いた。"
  37: "彼[かれ]らは畑[はたけ]に種[たね]を蒔[ま]き、ぶどう園[えん]を植[う]えて、実[み]を結[むす]ばせた。"
  38: "主[しゅ]は彼[かれ]らを祝福[しゅくふく]し、彼[かれ]らは大[おお]いに増[ふ]えた。主[しゅ]は彼[かれ]らの家畜[かちく]を減[へ]らされなかった。"
  39: "しかし、彼[かれ]らは苦[くる]しみと悪[わる]しき悩[なや]みによって少[すく]なくされ、苦[くる]しまされた。"
  40: "主[しゅ]は支配者[しはいしゃ]たちに軽蔑[けいべつ]を注[そそ]ぎ、道[みち]のない荒[あ]れ野[の]で彼[かれ]らをさまよわせられた。"
  41: "主[しゅ]は貧[まず]しい者[もの]をその貧[まず]しさから助[たす]け、その一族[いちぞく]を羊[ひつじ]の群[む]れのようにされた。"
  42: "正[ただ]しい者[もの]たちはこれを見[み]て喜[よろこ]び、すべての不法[ふほう]はその口[くち]を閉[と]じる。"
  43: "だれが知恵[ちえ]ある者[もの]だろうか。その人[ひと]はこれを守[まも]り、主[しゅ]のあわれみを悟[さと]るだろう。"

notes:
  1: "Αλληλουια — アレルヤ; надписание, как в Пс 105. Надписание — стих 0 (в csl-ru отдельного стиха нет, влито в ст. 1), скобками не маркируется. Та же формула, что в 105:1: ἐξομολογεῖσθε — 感謝せよ; χρηστός — いつくしみ深い; ἔλεος — あわれみ. Дословное совпадение в греч. сохранено и по-японски."
  2: "εἰπάτωσαν οἱ λελυτρωμένοι ὑπὸ κυρίου — 主に贖われた者たちは言え (λυτρόω в perf. — «искупленные»). οὓς ἐλυτρώσατο ἐκ χειρὸς ἐχθροῦ — 敵の手から贖い出された."
  3: "ἐκ τῶν χωρῶν συνήγαγεν αὐτούς — もろもろの国から集められた (χώρα — «страна»). ἀπὸ ἀνατολῶν καὶ δυσμῶν καὶ βορρᾶ καὶ θαλάσσης — 東から、西から、北から、海のほとりから (θάλασσα здесь — «море» как сторона света, т. е. юг; оставлено 海のほとり без домысла)."
  4: "ἐπλανήθησαν ἐν τῇ ἐρήμῳ ἐν ἀνύδρῳ — 水のない荒野をさまよい (πλανάω в страд. — «блуждать»; ἄνυδρος — «безводный»). ὁδὸν πόλεως κατοικητηρίου οὐχ εὗρον — 住むべき町への道を見いだせなかった (κατοικητήριον — «жилище, обиталище»)."
  5: "πεινῶντες καὶ διψῶντες — 飢え渇いて (причастия). ἡ ψυχὴ αὐτῶν ἐν αὐτοῖς ἐξέλιπεν — その魂は彼らのうちに尽き果てようとしていた (ἐκλείπω — «иссякать»)."
  6: "ἐκέκραξαν πρὸς κύριον ἐν τῷ θλίβεσθαι αὐτούς — 苦しみのうちで主に呼び (κράζω; θλίβω). ἐκ τῶν ἀναγκῶν αὐτῶν ἐρρύσατο αὐτούς — その苦難から救い出された (ἀνάγκη — «нужда, теснота»; ῥύομαι). Этот рефрен повторяется в 13, 19, 28 с разными глаголами."
  7: "ὡδήγησεν αὐτοὺς εἰς ὁδὸν εὐθεῖαν — まっすぐな道に導き (ὁδηγέω; εὐθύς — «прямой»). τοῦ πορευθῆναι εἰς πόλιν κατοικητηρίου — 住むべき町へ行かせられた."
  8: "ἐξομολογησάσθωσαν τῷ κυρίῳ τὰ ἐλέη αὐτοῦ — 主に感謝すべきである、そのあわれみのゆえに (ἐξομολογέομαι; ἐλέη мн. ч.). τὰ θαυμάσια αὐτοῦ τοῖς υἱοῖς τῶν ἀνθρώπων — 人々に行われた奇跡 (θαυμάσιον; υἱοὶ τῶν ἀνθρώπων — «сыны человеческие», передано 人々, чтобы не смешивать с 人の子). Рефрен 8, 15, 21, 31."
  9: "ἐχόρτασεν ψυχὴν κενήν — むなしい魂を満ち足らせ (χορτάζω — «насыщать»). ψυχὴν πεινῶσαν ἐνέπλησεν ἀγαθῶν — 飢えた魂を良いもので満たされた (ἐμπίπλημι + gen.)."
  10: "καθημένους ἐν σκότει καὶ σκιᾷ θανάτου — 闇と死の影のうちに座り (σκιά — 影). πεπεδημμένους ἐν πτωχείᾳ καὶ σιδήρῳ — 貧しさと鉄の鎖に縛られた (πεδάω — «сковывать»; πτωχεία — «нищета»; σίδηρος — «железо», т. е. кандалы)."
  11: "παρεπίκραναν τὰ λόγια τοῦ θεοῦ — 神の言葉に逆らい (παραπικραίνω — «огорчать»; λόγιον — «изречение»). τὴν βουλὴν τοῦ ὑψίστου παρώξυναν — 至高の神の計らいを拒んだ (παροξύνω — «раздражать»; βουλή — «замысел»)."
  12: "ἐταπεινώθη ἐν κόποις ἡ καρδία αὐτῶν — 労苦によって心を低くされた (ταπεινόω; κόπος — «труд, страдание»). ἠσθένησαν — 弱り果て (ἀσθενέω). οὐκ ἦν ὁ βοηθῶν — 助ける者もなかった."
  13: "Рефрен ст. 6, но с ἔσωσεν вместо ἐρρύσατο — 救われた; различие глаголов сохранено."
  14: "ἐξήγαγεν αὐτοὺς ἐκ σκότους καὶ σκιᾶς θανάτου — 闇と死の影から連れ出し (ἐξάγω). τοὺς δεσμοὺς αὐτῶν διέρρηξεν — その束縛を断ち切られた (δεσμός — «узы»; διαρρήγνυμι — «разрывать»)."
  15: "Повтор рефрена ст. 8 дословно."
  16: "συνέτριψεν πύλας χαλκᾶς — 青銅の門を砕き (συντρίβω; χαλκοῦς — «медный, бронзовый»). μοχλοὺς σιδηροῦς συνέκλασεν — 鉄のかんぬきを折られた (μοχλός — «засов»; συγκλάω — «разбивать»)."
  17: "ἀντελάβετο αὐτῶν ἐξ ὁδοῦ ἀνομίας αὐτῶν — 主は…その不法の道から引き上げられた (ἀντιλαμβάνομαι — «брать, поддерживать») — подлежащее Бог; у jp-joc подлежащее иное, «неразумные страдали». διὰ γὰρ τὰς ἀνομίας αὐτῶν ἐταπεινώθησαν — 彼らはその不法のゆえに低くされていたからである."
  18: "πᾶν βρῶμα ἐβδελύξατο ἡ ψυχὴ αὐτῶν — 魂はどんな食物も嫌い (βδελύσσομαι — «гнушаться»; βρῶμα — «пища»). ἤγγισαν ἕως τῶν πυλῶν τοῦ θανάτου — 死の門に近づいていた (ἐγγίζω)."
  19: "Рефрен ст. 6 и 13 дословно."
  20: "ἀπέστειλεν τὸν λόγον αὐτοῦ — その言葉を送って (λόγος — 言葉). ἰάσατο αὐτούς — 癒やし (ἰάομαι). ἐρρύσατο αὐτοὺς ἐκ τῶν διαφθορῶν αὐτῶν — その滅びから救い出された (διαφθορά — «тление, погибель»; у jp-joc 墓)."
  21: "Повтор рефрена ст. 8, 15."
  22: "θυσάτωσαν θυσίαν αἰνέσεως — 賛美のいけにえをささげ (θυσία αἰνέσεως — «жертва хвалы», ср. Евр 13:15). ἐξαγγειλάτωσαν τὰ ἔργα αὐτοῦ ἐν ἀγαλλιάσει — 喜びのうちにそのわざを告げ知らせよ (ἐξαγγέλλω; ἀγαλλίασις — «ликование»)."
  23: "οἱ καταβαίνοντες εἰς τὴν θάλασσαν ἐν πλοίοις — 船に乗って海に下り (καταβαίνω — о выходе в море). ποιοῦντες ἐργασίαν ἐν ὕδασι πολλοῖς — 大きな水の上で仕事をする (ἐργασία — «дело, промысел»). Стих начинает раздел о мореплавателях."
  24: "αὐτοὶ εἴδοσαν τὰ ἔργα κυρίου — 彼らは主のわざを見た (οἶδα в знач. аориста). τὰ θαυμάσια αὐτοῦ ἐν τῷ βυθῷ — 深い淵でのその奇跡 (βυθός — «глубина, пучина»)."
  25: "εἶπεν, καὶ ἔστη πνεῦμα καταιγίδος — 主が言われると、嵐の風が起こり (καταιγίς — «буря»; πνεῦμα здесь — ветер, поэтому 風, а не 霊). ὑψώθη τὰ κύματα αὐτῆς — 海の波が高く盛り上がった (κῦμα — «волна»)."
  26: "ἀναβαίνουσιν ἕως τῶν οὐρανῶν καὶ καταβαίνουσιν ἕως τῶν ἀβύσσων — 天にまで上り、淵にまで下る (ἄβυσσος). ἡ ψυχὴ αὐτῶν ἐν κακοῖς ἐτήκετο — 魂は苦しみのうちに溶け消えた (τήκω — «таять, изнемогать»)."
  27: "ἐταράχθησαν, ἐσαλεύθησαν ὡς ὁ μεθύων — 揺れ動き、酔った者のようによろめいた (σαλεύω; μεθύων — «пьяный»). πᾶσα ἡ σοφία αὐτῶν κατεπόθη — その知恵はすべて飲み尽くされた (καταπίνω — «поглощать»)."
  28: "Рефрен, как в ст. 6, но с ἐξήγαγεν — 連れ出された."
  29: "ἐπέταξεν τῇ καταιγίδι — 嵐に命じると (ἐπιτάσσω). ἔστη εἰς αὔραν — そよ風となった (αὔρα — «лёгкий ветер»). ἐσίγησαν τὰ κύματα αὐτῆς — 海の波は静まった (σιγάω — «утихать»)."
  30: "εὐφράνθησαν, ὅτι ἡσύχασαν — 静けさになったことを喜び (ἡσυχάζω — «успокаиваться»). ὡδήγησεν αὐτοὺς ἐπὶ λιμένα θελήματος αὐτῶν — 望みの港へ導かれた (λιμήν — «пристань»; θέλημα — «желание»)."
  31: "Повтор рефрена ст. 8, 15, 21."
  32: "ὑψωσάτωσαν αὐτὸν ἐν ἐκκλησίᾳ λαοῦ — 民の集いのうちで主をあがめ (ὑψόω — «возвышать»; ἐκκλησία — 集い). ἐν καθέδρᾳ πρεσβυτέρων αἰνεσάτωσαν αὐτόν — 長老たちの座のうちで賛美すべきである (καθέδρα — «седалище»; πρεσβύτερος — 長老)."
  33: "ἔθετο ποταμοὺς εἰς ἔρημον — 川を荒野に変え (τίθημι; ποταμός). διεξόδους ὑδάτων εἰς δίψαν — 水の流れを乾いた地に (διέξοδος — «проток»; δίψα — «жажда»)."
  34: "γῆν καρποφόρον εἰς ἅλμην — 実り豊かな地を塩の地に (καρποφόρος — «плодоносный»; ἅλμη — «солончак»). ἀπὸ κακίας τῶν κατοικούντων ἐν αὐτῇ — そこに住む者の悪さのゆえ (κακία — «злоба, нечестие»)."
  35: "ἔθετο ἔρημον εἰς λίμνας ὑδάτων — 荒野を池に (λίμνη — «озеро, водоём»). γῆν ἄνυδρον εἰς διεξόδους ὑδάτων — 乾いた地を水の泉に (ἄνυδρος — «безводный»). Антитеза ст. 33–34."
  36: "κατῴκισεν ἐκεῖ πεινῶντας — そこに飢えた者たちを住まわせ (κατοικίζω — «поселять»). συνεστήσαντο πόλιν κατοικεσίας — 住むべき町を築いた (συνίστημι — «основывать»)."
  37: "ἔσπειραν ἀγροὺς καὶ ἐφύτευσαν ἀμπελῶνας — 畑に種を蒔き、ぶどう園を植え (σπείρω; φυτεύω; ἀμπελών — ぶどう園). ἐποίησαν καρπὸν γενήματος — 実を結ばせた (γένημα — «произведение, урожай»)."
  38: "εὐλόγησεν αὐτούς — 祝福し (εὐλογέω). ἐπληθύνθησαν σφόδρα — 大いに増えた (πληθύνω). τὰ κτήνη αὐτῶν οὐκ ἐσμίκρυνεν — 家畜を減らされなかった (κτῆνος — «скот»; σμικρύνω — «умалять»)."
  39: "ὠλιγώθησαν καὶ ἐκακώθησαν — 少なくされ、苦しまされた (ὀλιγόω — «умалять»; κακόω — «озлоблять»). ἀπὸ θλίψεως κακῶν καὶ ὀδύνης — 苦しみと悪しき悩みによって (ὀδύνη — «боль, скорбь»)."
  40: "ἐξεχύθη ἐξουδένωσις ἐπ᾿ ἄρχοντας — 支配者たちに軽蔑を注ぎ (ἐκχέω; ἐξουδένωσις — «уничижение»). ἐπλάνησεν αὐτοὺς ἐν ἀβάτῳ καὶ οὐχ ὁδῷ — 道のない荒れ野でさまよわせられた (ἄβατος — «непроходимый»)."
  41: "ἐβοήθησεν πένητι ἐκ πτωχείας — 貧しい者をその貧しさから助け (βοηθέω; πένης — «бедняк»). ἔθετο ὡς πρόβατα πατριάς — その一族を羊の群れのようにされた (πατριά — «род, племя», в греч. ед. ч.)."
  42: "ὄψονται εὐθεῖς καὶ εὐφρανθήσονται — 正しい者たちはこれを見て喜び (εὐθής — «прямой, праведный»). πᾶσα ἀνομία ἐμφράξει τὸ στόμα αὐτῆς — すべての不法はその口を閉じる (ἐμφράσσω — «заграждать»; ἀνομία выступает как лицо)."
  43: "τίς σοφὸς καὶ φυλάξει ταῦτα — だれが知恵ある者だろうか、その人はこれを守り (σοφός; φυλάσσω — «хранить»). συνήσουσιν τὰ ἐλέη τοῦ κυρίου — 主のあわれみを悟るだろう (συνίημι)."
