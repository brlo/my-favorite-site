# jp-box, Псалтирь, псалом 115. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация — славяно-синодальная (csl-ru): в слав. надписание отдельным стихом
# не стоит, поэтому наш стих 0 (надписание) влит в начало стиха 1; дальше номера 1..10.
# Псалом 115: вера и слово (1–2), вопрос о воздаянии (3), чаша спасения (4),
# обет пред всем народом (5), драгоценная смерть святых (6), раб Господень (7),
# жертва хвалы (8), обет в доме Господнем (9–10).
#
# ОСОБЫЙ СЛУЧАЙ — дефект модуля gr-lxx-byz. У 115 строки 1–9 стоят как «.» (пусто),
# а строки 10–18 содержат девять стихов LXX 115 (Ἐπίστευσα … ἐν αὐλαῖς); строки 0
# в модуле нет, слово Αλληλουια стоит в начале строки 10. Поэтому нумерация взята
# церковная, как в ру-базе и jp-joc: 1..10. Надписание «Аллилуия» влито в начало
# стиха 1 (строка 10 модуля); стихи 1–10 — девять стихов строк 10–18, но обет (строка 17)
# стоит дважды: в ст. 5 и в ст. 9 — так в церковном делении (в греч. он один раз),
# повтор оставлен, чтобы не сдвинуть счёт. Ст. 10 — строка 18.
#
# Красного и синего нет. Кавычки: слова самого псалмопевца в 2 — 「…」 (первый уровень).
# 〔…〕 нет: все слова в gr-lxx-byz есть (в строках 10–18).
# セラ (διάψαλμα) в этой главе нет.
# Сносок ⟨…⟩ нет: 誓, 杯, いけにえ уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: ps
chapter: 115
draft: true

verses:
  1: "アレルヤ。わたしは信[しん]じた。だからこそ、わたしは語[かた]った。わたしはひどく苦[くる]しめられた。"
  2: "わたしは我[が]を失[うしな]って言[い]った。「人[ひと]はみな偽[いつわ]り者[もの]である。」"
  3: "わたしは、主[しゅ]がわたしに施[ほどこ]してくださったすべての恵[めぐ]みに、何[なに]をもって報[むく]いようか。"
  4: "わたしは救[すく]いの杯[さかずき]を受[う]け、主[しゅ]の名[な]を呼[よ]び求[もと]める。"
  5: "わたしはわたしの誓[ちか]いを主[しゅ]に、その民[たみ]すべての前[まえ]で果[は]たす。"
  6: "主[しゅ]の前[まえ]で、その聖[せい]なる者[もの]たちの死[し]は貴[とうと]い。"
  7: "ああ、主[しゅ]よ。わたしはあなたの僕[しもべ]、あなたの僕[しもべ]、あなたのはしための子[こ]である。あなたはわたしの枷[かせ]を断[た]ち切[き]られた。"
  8: "わたしはあなたに賛美[さんび]のいけにえをささげ、主[しゅ]の名[な]を呼[よ]び求[もと]める。"
  9: "わたしはわたしの誓[ちか]いを主[しゅ]に、その民[たみ]すべての前[まえ]で、"
  10: "主[しゅ]の家[いえ]の庭[にわ]で、エルサレムよ、あなたのただ中[なか]で果[は]たす。"

notes:
  1: "Αλληλουια — アレルヤ (Откр 19:1). В модуле стоит в начале строки 10; в ру-базе, csl-ru и jp-joc надписание — стих 0 (в csl-ru отдельного стиха нет, влито в ст. 1). Строки 0 у 115 в gr-lxx-byz нет. Ἐπίστευσα, διὸ ἐλάλησα — わたしは信じた。だからこそ、わたしは語った (πιστεύω; λαλέω — «говорить»; ср. 2 Кор 4:13, где стих цитируется). ἐγὼ δὲ ἐταπεινώθην σφόδρα — わたしはひどく苦しめられた (ταπεινόω — «умалять»; σφόδρα — «весьма»). Кавычек нет: речь не вводится глаголом «сказал», это отдельное утверждение."
  2: "ἐγὼ εἶπα ἐν τῇ ἐκστάσει μου — わたしは我を失って言った (ἔκστασις — «исступление, крайнее смятение»; ср. jp-joc 惑ひし時, Синодальный «в опрометчивости»). Πᾶς ἄνθρωπος ψεύστης — 人はみな偽り者である (ψεύστης — «лжец»); введено глаголом 言った, поэтому 「…」."
  3: "τί ἀνταποδώσω τῷ κυρίῳ — 何をもって報いようか (ἀνταποδίδωμι — «воздавать»). περὶ πάντων, ὧν ἀνταπέδωκέν μοι — 主がわたしに施してくださったすべての恵みに (букв. «за всё, что Он воздал мне»); один и тот же глагол в вопросе и в ответе, 報いる/施す передают его пару."
  4: "ποτήριον σωτηρίου λήμψομαι — 救いの杯を受ける (σωτήριον — «спасение»; чаша спасения, ср. Лк 22:20). καὶ τὸ ὄνομα κυρίου ἐπικαλέσομαι — 主の名を呼び求める."
  5: "τὰς εὐχάς μου τῷ κυρίῳ ἀποδώσω — わたしの誓いを主に…果たす (εὐχή — «обет, обещание»). ἐναντίον παντὸς τοῦ λαοῦ αὐτοῦ — その民すべての前で. В церковном делении (ру, csl-ru, jp-joc) этот стих повторён ещё раз в ст. 9; в греч. он один (строка 17), повтор сохранён ради церковной нумерации."
  6: "τίμιος ἐναντίον κυρίου ὁ θάνατος τῶν ὁσίων αὐτοῦ — 主の前で、その聖なる者たちの死は貴い (τίμιος — «драгоценный, честный»; ὅσιος — «преподобный, святой»; в Синодальном «дорога… смерть святых Его»)."
  7: "ὦ κύριε, ἐγὼ δοῦλος σός, ἐγὼ δοῦλος σὸς καὶ υἱὸς τῆς παιδίσκης σου — ああ、主よ。わたしはあなたの僕、あなたの僕、あなたのはしための子である (παιδίσκη — «рабыня, служанка»); двойной повтор сохранён. διέρρηξας τοὺς δεσμούς μου — あなたはわたしの枷を断ち切られた (διαρρήγνυμι — «разрывать»; δεσμός — «узы, оковы»)."
  8: "σοὶ θύσω θυσίαν αἰνέσεως — あなたに賛美のいけにえをささげる (θυσία αἰνέσεως — «жертва хвалы», ср. Евр 13:15). καὶ τὸ ὄνομα κυρίου ἐπικαλέσομαι — 主の名を呼び求める, повтор 4-го стиха."
  9: "τὰς εὐχάς μου τῷ κυρίῳ ἀποδώσω ἐναντίον παντὸς τοῦ λαοῦ αὐτοῦ — повтор 5-го стиха (см. примечание к нему). Стих кончается на 、: предложение продолжается в ст. 10, как в греч."
  10: "ἐν αὐλαῖς οἴκου κυρίου — 主の家の庭で (αὐλή — «двор»). ἐν μέσῳ σου, Ιερουσαλημ — エルサレムよ、あなたのただ中で (ἐν μέσῳ — «посреди»). В ру-базе в конце стиха ещё «Аллилуия», в gr-lxx-byz его нет — не добавлено."
