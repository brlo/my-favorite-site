verses:
  1: "ああ、死[し]よ。その思[おも]い出[で]は、自[じ]分[ぶん]の財[ざい]産[さん]のうちで安[やす]らかに暮[く]らし、心[こころ]を乱[みだ]されず、すべてのことに道[みち]が開[ひら]け、なお食[しょく]物[もつ]を受[う]け入[う]ける力[ちから]のある人[ひと]にとって、なんと苦[にが]いことか。"
  2: "ああ、死[し]よ。あなたの裁[さば]きは、乏[とぼ]しく、力[ちから]の衰[おとろ]えた人[ひと]、最[さい]後[ご]の老[ろう]いにある者[もの]、すべてのことに心[こころ]を煩[わずら]わせ、不[ふ]信[しん]のうちに耐[た]え忍[しの]ぶことを失[うしな]った者にとって、なんと快[こころよ]いことか。"
  3: "死[し]の裁[さば]きを恐[おそ]れてはならない。あなたより前[まえ]の者[もの]たちと、後[あと]に来[く]る者たちを思[おも]い起[おこ]せ。"
  4: "この裁[さば]きは、すべての肉[にく]に対する主[しゅ]からのものである。あなたはなぜ、いと高[たか]き者[もの]の御心[みこころ]を拒[こば]むのか。十[じゅう]年[ねん]であれ、百[ひゃく]年であれ、千[せん]年であれ、よみには命[いのち]を調[しら]べることはない。"
  5: "罪[つみ]人[びと]の子[こ]どもは忌[い]まわしい子どもとなり、不[ふ]敬[けい]な者[もの]たちの集[あつ]まりと交[まじ]わる。"
  6: "罪[つみ]人[びと]の子[こ]どもの受[う]け継[つ]ぎは滅[ほろ]び、その子孫[しそん]とともに恥[はじ]が絶[た]えず続[つづ]く。"
  7: "不[ふ]敬[けい]な父[ちち]のゆえに、子[こ]どもは責[せ]められる。子どもがそのために恥[はじ]を受[う]けるからである。"
  8: "災[わざわ]いだ、不[ふ]敬[けい]な者[もの]たちよ。あなたがたは、いと高[たか]き神[かみ]の律法[りっぽう]を捨[す]て去[さ]った。"
  9: "あなたがたが生[う]まれれば呪[のろ]いのうちに生まれ、死[し]ねば呪いのうちに分[わ]けられる。"
  10: "土[つち]から出[で]たすべてのものは土に帰[かえ]る。同[おな]じく、不[ふ]敬[けい]な者[もの]たちは呪[のろ]いから滅[ほろ]びへと去[さ]る。"
  11: "人[ひと]の嘆[なげ]きはその体[からだ]のうちにあり、罪[つみ]人[びと]の悪[わる]い名[な]は消[け]し去[さ]られる。"
  12: "名[な]について考[かんが]えよ。名は、千[せん]もの大[おお]きな金[きん]の宝[たから]よりも長[なが]く、あなたのもとに残[のこ]るからである。"
  13: "良[よ]い生[い]き方[かた]には日々[ひび]の数[かず]があり、良い名[な]は永遠[えいえん]に残[のこ]る。"
  14: "子[こ]どもたちよ、平[へい]和[わ]のうちに教[きょう]えを守[まも]れ。隠[かく]された知恵[ちえ]と見[み]えなしい宝[たから]とに、何[なん]の益[えき]があろうか。"
  15: "自[じ]分[ぶん]の愚[おろ]かさを隠[かく]す人[ひと]は、自分の知恵[ちえ]を隠す人よりも良[よ]い。"
  16: "それゆえ、わたしの言葉[ことば]にこそ恥[はじ]を覚[おぼ]えよ。すべての恥を守[まも]ることが良[よ]いのではなく、すべてのことが、すべての人[ひと]に信[しん]をもって喜[よろこ]ばれるわけではないからである。"
  17: "父[ちち]と母[はは]の前[まえ]では淫[いん]らなことを、支[し]配[はい]する者[もの]と権[けん]力[りょく]ある者の前では偽[いつわ]りを恥[はじ]よ。"
  18: "裁[さば]き手[て]と指[し]導[どう]者[しゃ]の前[まえ]では過[あやま]ちを、集[しゅう]会[かい]と民[たみ]の前では不[ふ]法[ほう]を恥[はじ]よ。"
  19: "仲[なか]間[ま]と友[とも]の前[まえ]では不[ふ]正[せい]を、あなたが住[す]む場[ば]所[しょ]の前では盗[ぬす]みを恥[はじ]よ。"
  20: "神[かみ]の真[しん]理[り]と契[けい]約[やく]を、また、パンの上[うえ]に肘[ひじ]をつくことを恥[はじ]よ。"
  21: "受[う]け取[と]り与[あた]えることに蔑[さげす]みを示[しめ]すこと、また、挨拶[あいさつ]する者[もの]の前[まえ]で黙[だま]り込[こ]むことを恥[はじ]よ。"
  22: "遊[あそ]び女[おんな]を見[み]ることを、親[しん]族[ぞく]から顔[かお]を背[そむ]けることを恥[はじ]よ。"
  23: "分[ぶん]け前[まえ]を取[と]り上[あ]げ、与[あた]えることを、また、夫[おっと]のある女[おんな]をじっと見[み]つめることを恥[はじ]よ。"
  24: "自[じ]分[ぶん]の女中[じょちゅう]に余[よ]計[けい]な関[かん]心[しん]を向[む]け、その寝[ね]床[どこ]に近[ちか]づくことを恥[はじ]よ。"
  25: "友[とも]の前[まえ]では、ののしりの言[ことば]を、また、与[あた]えた後[あと]で責[せ]め立[た]てることを恥[はじ]よ。"
  26: "同[おな]じことを繰[く]り返[かえ]し、聞[き]いた話[はなし]を語[かた]り、隠[かく]された言葉[ことば]を明[あ]かすことを恥[はじ]よ。"
  27: "そうすれば、あなたは真[しん]に恥[はじ]を知[し]る者[もの]となり、すべての人[ひと]の前[まえ]で恵[めぐ]みを受[う]ける。"

notes:
  1: "Ὦ θάνατε — звательный падеж, «о смерть»; риторическое обращение автора, не чужая речь. πικρόν σου τὸ μνημόσυνόν ἐστιν — «горька память о тебе» (μνημόσυνον — память, воспоминание). εἰρηνεύοντι ἐν τοῖς ὑπάρχουσιν αὐτοῦ — «живущему в мире с имуществом своим» (τὰ ὑπάρχοντα — имущество; слав. «во имениих»). ἀνδρὶ ἀπερισπάστῳ καὶ εὐοδουμένῳ ἐν πᾶσιν — «мужу неотвлекаемому и во всём преуспевающему» (ἀπερίσπαστος — не отвлекаемый; εὐοδόομαι — иметь успех)."
  2: "καλόν σου τὸ κρίμα — «отраден твой приговор» (κρίμα — приговор, суд). ἐπιδεομένῳ καὶ ἐλασσουμένῳ ἰσχύι — «нуждающемуся и оскудевшему силой» (ἐπιδέομαι — нуждаться; ἐλασσόομαι — умаляться). ἐσχατογήρῳ — «в последней старости»; ἀπειθοῦντι καὶ ἀπολωλεκότι ὑπομονήν — «неверующему и потерявшему терпение» (ἀπειθέω — не покоряться; ὑπομονή — терпение). Слав. дробит: 41:1–2 = гр 41:1, 41:3–4 = гр 41:2."
  3: "μὴ εὐλαβοῦ κρίμα θανάτου — «не бойся приговора смерти» (εὐλαβέομαι — бояться, благоговеть). μνήσθητι προτέρων σου καὶ ἐσχάτων — «вспомни прежних твоих и последних», т. е. предков и потомков. Слав. читает это как 41:5."
  4: "τοῦτο τὸ κρίμα παρὰ κυρίου πάσῃ σαρκί — «этот приговор от Господа всякой плоти». τί ἀπαναίνῃ ἐν εὐδοκίᾳ ὑψίστου — «что ты отказываешься от благоволения Всевышнего» (ἀπαναίνομαι — отклонять; εὐδοκία — благоволение). εἴτε δέκα εἴτε ἑκατὸν εἴτε χίλια ἔτη — «десять ли, сто ли, тысяча лет». ἐλεγμὸς ζωῆς — «исследование жизни» (ἐλεγμός — испытание, обличение; слав. «обличение живота»). Слав. делит на 41:6–7."
  5: "Τέκνα βδελυρά — «дети омерзительные» (βδελυρός — мерзкий, отвратительный). συναναστρεφόμενα παροικίαις ἀσεβῶν — «обращающиеся с обществами нечестивых» (συναναστρέφομαι — вращаться с кем-либо; παροικία — поселение, община)."
  6: "τέκνων ἁμαρτωλῶν ἀπολεῖται κληρονομία — «наследие детей грешников погибнет». ἐνδελεχιεῖ ὄνειδος — «будет длиться поношение» (ἐνδελεχέω — длиться непрерывно; ὄνειδος — поношение, срам)."
  7: "πατρὶ ἀσεβεῖ μέμψεται τέκνα — «нечестивому отцу будут ставить в вину дети» (μέμφομαι — порицать; слав. «укорят чада»). ὅτι δι᾽ αὐτὸν ὀνειδισθήσονται — «потому что из-за него подвергнутся поношению»."
  8: "οὐαὶ ὑμῖν, ἄνδρες ἀσεβεῖς — «горе вам, мужи нечестивые» (οὐαί — горе, возглас скорби). ἐγκατελίπετε νόμον θεοῦ ὑψίστου — «вы оставили закон Бога Всевышнего» (ἐγκαταλείπω — оставлять, покидать)."
  9: "εἰς κατάραν γεννηθήσεσθε — «в проклятие родитесь» (κατάρα — проклятие); εἰς κατάραν μερισθήσεσθε — «в проклятие будете разделены» (μερίζω — делить, уделять). Оба оборота переданы буквально, без смягчения."
  10: "πάντα, ὅσα ἐκ γῆς, εἰς γῆν ἀπελεύσεται — «всё, что из земли, в землю уйдёт» (ср. Быт 3:19). οὕτως ἀσεβεῖς ἀπὸ κατάρας εἰς ἀπώλειαν — «так и нечестивые — от проклятия в погибель» (ἀπώλεια — погибель)."
  11: "Πένθος ἀνθρώπων ἐν σώμασιν αὐτῶν — «плач людей — в телах их» (πένθος — плач, скорбь; слав. «сетование»). ὄνομα δὲ ἁμαρτωλῶν οὐκ ἀγαθὸν ἐξαλειφθήσεται — «а недоброе имя грешников изгладится» (ἐξαλείφω — изглаживать, стирать)."
  12: "φρόντισον περὶ ὀνόματος — «позаботься об имени» (φροντίζω — заботиться). διαμενεῖ σοι — «пребудет тебе»; ἢ χίλιοι μεγάλοι θησαυροὶ χρυσίου — «нежели тысяча великих сокровищ золота» (ἤ при сравнении — «чем»)."
  13: "ἀγαθῆς ζωῆς ἀριθμὸς ἡμερῶν — «у доброй жизни — число дней»: родительный качества (слав. «благаго жития число дний»). ἀγαθὸν ὄνομα εἰς αἰῶνα διαμενεῖ — «доброе имя пребудет вовеки»."
  14: "παιδείαν ἐν εἰρήνῃ συντηρήσατε, τέκνα — «наставление в мире соблюдите, дети» (παιδεία — наставление, воспитание; συντηρέω — соблюдать). σοφία κεκρυμμένη καὶ θησαυρὸς ἀφανής — «мудрость сокрытая и сокровище невидимое» (ἀφανής — неявный). τίς ὠφέλεια ἐν ἀμφοτέροις — «какая польза в обоих»."
  15: "κρείσσων ἄνθρωπος ἀποκρύπτων τὴν μωρίαν αὐτοῦ — «лучше человек, скрывающий свою глупость» (μωρία — глупость). ἢ ἄνθρωπος ἀποκρύπτων τὴν σοφίαν αὐτοῦ — «чем человек, скрывающий свою мудрость». Слав. ставит это как 41:18."
  16: "Τοιγαροῦν ἐντράπητε ἐπὶ τῷ ῥήματί μου — «итак, устыдитесь слова моего» (ἐντρέπομαι — стыдиться; ῥῆμα — слово). οὐκ ἔστιν πᾶσαν αἰσχύνην διαφυλάξαι καλόν — «не всякий стыд хорошо соблюсти» (αἰσχύνη — стыд). οὐ πάντα πᾶσιν ἐν πίστει εὐδοκιμεῖται — «не всё всеми по вере одобряется» (εὐδοκιμέω — быть одобряемым). Слав. делит на 41:19–20."
  17: "αἰσχύνεσθε ἀπὸ πατρὸς καὶ μητρὸς περὶ πορνείας — «стыдитесь пред отцом и матерью из-за блуда»: ἀπό при αἰσχύνομαι указывает, перед кем стыдно. ἀπὸ ἡγουμένου καὶ δυνάστου περὶ ψεύδους — «пред вождём и властелином из-за лжи» (ἡγούμενος — вождь; δυνάστης — властелин)."
  18: "ἀπὸ κριτοῦ καὶ ἄρχοντος περὶ πλημμελείας — «пред судьёй и начальником из-за проступка» (πλημμελεία — проступок, погрешность; слав. «о согрешении»). ἀπὸ συναγωγῆς καὶ λαοῦ περὶ ἀνομίας — «пред собранием и народом из-за беззакония»."
  19: "ἀπὸ κοινωνοῦ καὶ φίλου περὶ ἀδικίας — «пред товарищем и другом из-за несправедливости» (κοινωνός — участник, товарищ). ἀπὸ τόπου, οὗ παροικεῖς, περὶ κλοπῆς — «пред местом, где ты живёшь, из-за кражи» (παροικέω — жить пришельцем; κλοπή — кража)."
  20: "ἀπὸ ἀληθείας θεοῦ καὶ διαθήκης — «пред истиной Божией и заветом»: родительный объекта при αἰσχύνεσθε. πῆξις ἀγκῶνος ἐπ᾽ ἄρτοις — «упирание локтя на хлебы», т. е. локти на столе за трапезой (слав. «от опертия лактей на трапезе»)."
  21: "ἀπὸ σκορακισμοῦ λήμψεως καὶ δόσεως — «пред презрительным отвержением принятия и даяния» (σκορακισμός — отбрасывание, отказ с презрением). ἀπὸ ἀσπαζομένων περὶ σιωπῆς — «пред приветствующими из-за молчания», т. е. стыдно не ответить на приветствие."
  22: "ἀπὸ ὁράσεως γυναικὸς ἑταίρας — «пред взглядом на женщину-блудницу» (ἑταίρα — гетера, блудница). ἀπὸ ἀποστροφῆς προσώπου συγγενοῦς — «пред отвращением лица от родственника» (ἀποστροφή — отвращение; συγγενής — родственник)."
  23: "ἀπὸ ἀφαιρέσεως μερίδος καὶ δόσεως — «пред отнятием доли и даяния» (ἀφαίρεσις — отнятие; μερίς — доля). ἀπὸ κατανοήσεως γυναικὸς ὑπάνδρου — «пред разглядыванием замужней женщины» (κατανόησις — всматривание; ὕπανδρος — имеющая мужа)."
  24: "ἀπὸ περιεργίας παιδίσκης αὐτοῦ — «пред излишним любопытством к служанке его» (περιεργία — назойливость, излишняя любознательность). μὴ ἐπιστῇς ἐπὶ τὴν κοίτην αὐτῆς — «не подходи к постели её» (ἐφίστημι — подходить). Слав. делит: 26 = гр 23–24a, 27 = гр 24b."
  25: "ἀπὸ φίλων περὶ λόγων ὀνειδισμοῦ — «пред друзьями из-за слов поношения» (ὀνειδισμός — поношение). μετὰ τὸ δοῦναι μὴ ὀνείδιζε — «после того как дал, не попрекай» (ὀνειδίζω — упрекать)."
  26: "ἀπὸ δευτερώσεως — «пред повторением» (δευτέρωσις — повторение, пересказ); λόγου ἀκοῆς — «словом слышания», т. е. пересказом услышанного. καλύψεως λόγων κρυφίων — «сокрытием слов тайных»: LXX читает καλύψεως, слав. — «от откровения словес тайных» (разглашение); по паритету взято слав. чтение."
  27: "ἔσῃ αἰσχυντηρὸς ἀληθινῶς — «будешь истинно стыдлив» (αἰσχυντηρός — стыдливый). εὑρίσκων χάριν ἔναντι παντὸς ἀνθρώπου — «обретая благодать перед всяким человеком» (χάρις — благодать, расположение). Слав. сливает гр 26–27 в 41:29."
