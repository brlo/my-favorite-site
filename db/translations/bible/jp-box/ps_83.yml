verses:
  0: "指揮者[しきしゃ]に。ぶどう搾[しぼ]り場[ば]について。コラの子[こ]らの詩[うた]。"
  1: "万軍[ばんぐん]の主[しゅ]よ、あなたの住[す]まいはなんと愛[いと]しいものか。"
  2: "わたしの魂[たましい]は、主[しゅ]の庭[にわ]を慕[した]い求[もと]めて尽[つ]き果[は]てる。わたしの心[こころ]も肉[にく]も、生[い]ける神[かみ]に向[む]かって喜[よろこ]び歌[うた]う。"
  3: "雀[すずめ]も自分[じぶん]の住[す]みかを、燕[つばめ]も雛[ひな]を置[お]く巣[す]を見[み]つけた。あなたの祭壇[さいだん]のそばに、万軍[ばんぐん]の主[しゅ]よ、わたしの王[おう]、わたしの神[かみ]よ。"
  4: "あなたの家[いえ]に住[す]む者[もの]たちは幸[さいわ]いである。彼[かれ]らは世[よ]々[よ]にあなたを賛美[さんび]する。"
  5: "主[しゅ]よ、その助[たす]けをあなたから受[う]ける人[ひと]は幸[さいわ]いである。その人[ひと]の心[こころ]には、上[のぼ]り道[みち]が定[さだ]められている。"
  6: "彼[かれ]らは涙[なみだ]の谷[たに]を通[とお]り、そこを、神[かみ]が定[さだ]められた場[ば]所[しょ]とする。律法[りっぽう]を与[あた]える方[かた]も、祝福[しゅくふく]をもって彼[かれ]らに応[こた]えられる。"
  7: "彼[かれ]らは力[ちから]から力[ちから]へ進[すす]み、神[かみ]々[がみ]の神[かみ]がシオンに現[あらわ]れる。"
  8: "万軍[ばんぐん]の神[かみ]、主[しゅ]よ、わたしの祈[いの]りを聞[き]いてください。ヤコブの神[かみ]よ、耳[みみ]を傾[かたむ]けてください。"
  9: "わたしたちの盾[たて]である神[かみ]よ、見[み]てください。あなたの油[あぶら]を注[そそ]がれた者[もの]の顔[かお]を顧[かえり]みてください。"
  10: "あなたの庭[にわ]での一日[いちにち]は、千[せん]の日[ひ]にまさる。わたしは神[かみ]の家[いえ]の門[もん]のそばに捨[す]て置[お]かれることを選[えら]び、悪[わる]い者[もの]の天幕[てんまく]に住[す]むことを選[えら]ばない。"
  11: "主[しゅ]である神[かみ]はあわれみと真[しん]実[じつ]を愛[あい]されるからである。主[しゅ]は{恵[めぐ]み|恩寵[おんちょう]}と栄光[えいこう]を与[あた]え、まっすぐに歩[あゆ]む者[もの]から善[よ]いものを奪[うば]われない。"
  12: "万軍[ばんぐん]の主[しゅ]よ、あなたに望[のぞ]みを置[お]く人[ひと]は幸[さいわ]いである。"

notes:
  0: "Εἰς τὸ τέλος, ὑπὲρ τῶν ληνῶν· τοῖς υἱοῖς Κορε ψαλμός — 指揮者に。ぶどう搾り場について。コラの子らの詩 (ληνός — «точило»; υἱοὶ Κορε — コラの子ら, как в Пс 41–48; у Синодального «на Гефском орудии» — по евр.). Надписание — стих 0."
  1: "Ὡς ἀγαπητὰ τὰ σκηνώματά σου, κύριε τῶν δυνάμεων — 万軍の主よ、あなたの住まいはなんと愛しいものか (ἀγαπητός — «вожделенный, любимый»; σκήνωμα — 住まい, шатёр; δυνάμεις — 万軍)."
  2: "ἐπιποθεῖ καὶ ἐκλείπει ἡ ψυχή μου εἰς τὰς αὐλάς τοῦ κυρίου — わたしの魂は、主の庭を慕い求めて尽き果てる (ἐπιποθέω — «сильно желать»; ἐκλείπω — «изнемогать»; αὐλή — 庭, двор). ἡ καρδία μου καὶ ἡ σάρξ μου ἠγαλλιάσαντο ἐπὶ θεὸν ζῶντα — わたしの心も肉も、生ける神に向かって喜び歌う (ἀγαλλιάομαι — «ликовать»; θεὸς ζῶν — «Бог живой»)."
  3: "καὶ γὰρ στρουθίον εὗρεν ἑαυτῷ οἰκίαν — 雀も自分の住みかを見つけた (στρουθίον — «воробей»). τρυγὼν νοσσιὰν ἑαυτῇ, οὗ θήσει τὰ νοσσία αὐτῆς — 燕も雛を置く巣を (τρυγών — «горлица»; νοσσιά — «гнездо»; νοσσίον — «птенец»; 燕 — по образу, ср. jp-joc). τὰ θυσιαστήριά σου, κύριε τῶν δυνάμεων — あなたの祭壇のそばに、万軍の主よ (порядок греч. сохранён: «у алтарей Твоих» относится к гнезду). ὁ βασιλεύς μου καὶ ὁ θεός μου — わたしの王、わたしの神よ."
  4: "μακάριοι οἱ κατοικοῦντες ἐν τῷ οἴκῳ σου — あなたの家に住む者たちは幸いである (μακάριος — 幸い, как в Пс 1:1). εἰς τοὺς αἰῶνας τῶν αἰώνων αἰνέσουσίν σε — 彼らは世々にあなたを賛美する (αἰνέω — «хвалить»). διάψαλμα не передаётся."
  5: "μακάριος ἀνήρ, οὗ ἐστιν ἡ ἀντίλημψις αὐτοῦ παρὰ σοῦ, κύριε — 主よ、その助けをあなたから受ける人は幸いである (ἀντίλημψις — «поддержка, заступление»). ἀναβάσεις ἐν τῇ καρδίᾳ αὐτοῦ διέθετο — その人の心には、上り道が定められている (ἀνάβασις — «восхождение», ступени; διατίθεμαι — «располагать, устанавливать»)."
  6: "ἐν τῇ κοιλάδι τοῦ κλαυθμῶνος — 涙の谷を通り (κοιλάς — «долина»; κλαυθμός — «плач»). εἰς τόπον, ὃν ἔθετο — そこを、神が定められた場所とする (букв. «в место, которое Он положил»; евр. читается «делают его источником» — отсюда у Синодального и jp-joc «открывают источники»; здесь по греч., без добавления). καὶ γὰρ εὐλογίας δώσει ὁ νομοθετῶν — 律法を与える方も、祝福をもって彼らに応えられる (νομοθέτης — «Законодатель»; εὐλογία — 祝福)."
  7: "πορεύσονται ἐκ δυνάμεως εἰς δύναμιν — 彼らは力から力へ進み (δύναμις — «сила», здесь «укрепление»). ὀφθήσεται ὁ θεὸς τῶν θεῶν ἐν Σιων — 神々の神がシオンに現れる (ὀφθήσεται — «явится»; θεὸς θεῶν — «Бог богов», как в Пс 49:1)."
  8: "κύριε ὁ θεὸς τῶν δυνάμεων, εἰσάκουσον τῆς προσευχῆς μου — 万軍の神、主よ、わたしの祈りを聞いてください (εἰσακούω — «услышать»). ἐνώτισαι, ὁ θεὸς Ιακωβ — ヤコブの神よ、耳を傾けてください (ἐνωτίζομαι — «внимать»). διάψαλμα не передаётся."
  9: "ὑπερασπιστὰ ἡμῶν — わたしたちの盾である神よ (ὑπερασπιστής — «защитник, щит»). ἰδέ, ὁ θεός, καὶ ἐπίβλεψον ἐπὶ τὸ πρόσωπον τοῦ χριστοῦ σου — 見てください。あなたの油を注がれた者の顔を顧みてください (χριστός здесь — «помазанник», титул, не имя; キリスト не ставится, как в Пс 2:2)."
  10: "ὅτι κρείσσων ἡμέρα μία ἐν ταῖς αὐλαῖς σου ὑπὲρ χιλιάδας — あなたの庭での一日は、千の日にまさる (κρείσσων — «лучше»; χιλιάς — «тысяча»). ἐξελεξάμην παραρριπτεῖσθαι ἐν τῷ οἴκῳ τοῦ θεοῦ — わたしは神の家の門のそばに捨て置かれることを選び (παραρρίπτομαι — «быть брошенным, валяться»; слав. «приметатися»). μᾶλλον ἢ οἰκεῖν ἐν σκηνώμασιν ἁμαρτωλῶν — 悪い者の天幕に住むことを選ばない (μᾶλλον ἤ — «скорее чем»)."
  11: "ἔλεον καὶ ἀλήθειαν ἀγαπᾷ κύριος ὁ θεός — 主である神は恵みと真実を愛される (ἔλεος — あわれみ; χάρις — 恵み, два разных слова переданы различно). χάριν καὶ δόξαν δώσει — 主は恵みと栄光を与え (χάρις — «благодать»; δόξα — 栄光). κύριος οὐ στερήσει τὰ ἀγαθὰ τοὺς πορευομένους ἐν ἀκακίᾳ — まっすぐに歩む者から善いものを奪われない (στερέω — «лишать»; ἀκακία — «незлобие, простота», слав. «незлобием»). У Синодального здесь «Господь Бог есть солнце и щит» — по евр.; в греч. и у jp-joc — «милость и истину любит», взято по греч."
  12: "κύριε τῶν δυνάμεων, μακάριος ἄνθρωπος ὁ ἐλπίζων ἐπὶ σέ — 万軍の主よ、あなたに望みを置く人は幸いである (ἐλπίζω — «уповать»)."
