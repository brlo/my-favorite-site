# jp-box, Псалтирь, псалом 83. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0.
# Псалом 83: любовь к дому Божию (1–2), птицы у алтарей (3), блаженство живущих
# в доме Божием (4–5), путь долиной плача (6–7), молитва о помазаннике (8–9),
# один день во дворах Божиих (10–11), блаженство уповающего (12).
# Красного и синего нет. Прямой речи нет: кавычек в главе нет.
# 〔…〕 нет: всё переведено по gr-lxx-byz, добавлений Церкви не вносилось.
# セラ (διάψαλμα, в конце ст. 4 и 8) не передаётся — по решению пользователя, как у jp-joc.
# Сносок ⟨…⟩ нет: 祭壇, 万軍, 嗣業 уже в корпусе. jp-ni не использовался.

