# jp-box, Премудрость Соломона, глава 2. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для главы есть фрагментами (1, 10–17, 19–22), архаизмы не
# копировались;
# jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 2: рассуждение нечестивых — одна длинная прямая речь 「…」 с 2:1 по 2:20:
# краткость и бессмысленность жизни (1–5), призыв наслаждаться настоящим (6–9),
# угнетение бедного и праведника (10), «сила — закон правды» (11), засада праведнику
# и его обвинения (12–16), испытание его слов и дел (17–20). С 2:21 снова авторский
# текст: ослепление злобой (21–22), создание человека для нетления и зависть диавола
# (23–24). Вложенной речи в главе нет, поэтому 『…』 не употребляются.
# Красного и синего нет.
# Нумерация по gr: 24 стиха, как у csl-ru и ru. Деление внутри главы у csl иное:
# csl 2:14 = gr 2:14a, csl 2:15 = gr 2:14b + gr 2:15. Держимся деления gr: в нашем
# 2:14 оба полустишия, в нашем 2:15 — только ἀνόμοιος… (см. notes 14–15).
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz. Слав. добавление «истинный» (2:18)
# внесено в основной текст без скобок, отмечено «нет в LXX».
# Сносок ⟨…⟩ нет: 奥義, 悪魔, よみ, 律法, 霊 уже в корпусе.
# Имён в главе нет; διάβολος — 悪魔, ᾅδης — よみ, ἀφθαρσία — 不滅.

