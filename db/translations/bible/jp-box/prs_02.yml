verses:
  1: "彼らは心[こころ]のうちで、誤[あやま]って考[かんが]えて言[い]った。「わたしたちの人生[じんせい]は短[みじか]く、悲[かな]しみに満[み]ちている。人[ひと]の終[お]わりには癒[いや]しがなく、よみから帰[かえ]った者[もの]も知[し]られていない。"
  2: "わたしたちは偶然[ぐうぜん]に生[う]まれ、その後[のち]には存在[そんざい]しなかった者[もの]のようになる。わたしたちの鼻[はな]の息[いき]は煙[けむり]、わたしたちの言葉[ことば]は心[こころ]の動[うご]きのうちの火花[ひばな]にすぎない。"
  3: "それが消[き]えると、体[からだ]は灰[はい]となり、霊[れい]は薄[うす]い空気[くうき]のように散[ち]ってゆく。"
  4: "わたしたちの名[な]は時[とき]とともに忘[わす]れられ、だれもわたしたちのわざを思[おも]い起[おこ]さない。わたしたちの人生[じんせい]は雲[くも]の足跡[あしあと]のように過[す]ぎ去[さ]り、霧[きり]のように、太陽[たいよう]の光[ひかり]に追[お]われ、その熱[ねつ]に重[おも]くされて散[ち]る。"
  5: "わたしたちの時[とき]は影[かげ]の過[よ]ぎ行[ゆ]くにすぎず、わたしたちの終[お]わりには引[ひ]き返[かえ]しがつかない。それは封印[ふういん]され、だれも戻[もど]らないからである。"
  6: "さあ、今[いま]ある良[よ]いものを楽[たの]しもう。若[わか]いときのように、熱心[ねっしん]に造[つく]られたものを用[もち]いよう。"
  7: "高価[こうか]なぶどう酒[しゅ]と香油[こうゆ]に満[み]ち、命[いのち]の花[はな]をわたしたちのそばから過[す]ぎ去[さ]らせてはならない。"
  8: "しおれる前[まえ]に、薔薇[ばら]のつぼみで身[み]を飾[かざ]ろう。"
  9: "わたしたちのうち、だれ一人[ひとり]としてわたしたちの驕[おご]りにあずからない者[もの]があってはならない。至[いた]るところに喜[よろこ]びのしるしを残[のこ]そう。これこそわたしたちの分[ぶん]、わたしたちの受[う]け持[も]ちなのだから。"
  10: "貧[まず]しく正[ただ]しい者[もの]を虐[しいた]げよう。寡婦[かふ]に情[なさ]けをかけず、多年[たねん]の白髪[しらが]をもつ老人[ろうじん]にも敬[うやま]いを払[はら]わない。"
  11: "わたしたちの力[ちから]を正[ただ]しさの法[のり]としよう。弱[よわ]いものは無用[むよう]であると明[あき]らかになるからである。"
  12: "正[ただ]しい者[もの]に罠[わな]を仕掛[しか]けよう。彼はわたしたちにとって厄介[やっかい]な者[もの]であり、わたしたちのわざに逆[さか]らい、律法[りっぽう]に背[そむ]く罪[つみ]を責[せ]め、わたしたちの育[そだ]ちの罪[つみ]を言[い]いふらすからである。"
  13: "彼は自[みずか]ら神[かみ]を知[し]る者[もの]だと唱[とな]え、自分[じぶん]を主[しゅ]の僕[しもべ]と名乗[なの]っている。"
  14: "彼はわたしたちの思[おも]いを責[せ]めるものとなった。彼はわたしたちにとって、見[み]るだけでも重[おも]い。"
  15: "彼の生[せい]き方[かた]はほかの者[もの]たちと似[に]ておらず、その歩[あゆ]みは違[ちが]っているからである。"
  16: "わたしたちは彼にとって偽[にせ]物[もの]と見[み]なされ、彼はわたしたちの道[みち]を汚[けが]れのように避[さ]ける。彼は正[ただ]しい者[もの]たちの終[お]わりを幸[さいわ]いだとし、神[かみ]を父[ちち]と誇[ほこ]っている。"
  17: "彼の言葉[ことば]が真実[しんじつ]かどうか見[み]よう。彼の行[ゆ]く末[すえ]に現[あらわ]れるものを試[ため]そう。"
  18: "もしこの正[ただ]しい者[もの]が真[しん]の神[かみ]の子[こ]であるなら、神は彼をかばい、逆[さか]らう者[もの]たちの手[て]から救[すく]い出[だ]されるはずだ。"
  19: "侮辱[ぶじょく]と責[せめ]め苦[くる]しみで彼を試[ため]そう。そうして彼の柔和[にゅうわ]さを知[し]り、彼の恨[うら]みを抱[だ]かない心[こころ]を試[ため]そう。"
  20: "みにくい死[し]に彼を処[しょ]そう。彼の言葉[ことば]に従[したが]って、彼には訪[おとず]れがあるにちがいない。」"
  21: "彼らはこのように考[かんが]え、迷[まよ]った。彼らの悪[あく]が彼らを盲目[もうもく]にしたからである。"
  22: "彼らは神[かみ]の奥義[おうぎ]を知[し]らず、敬虔[けいけん]の報[むく]いを望[のぞ]みもせず、傷[きず]のない魂[たましい]たちへの誉[ほま]れを認[みと]めもしなかった。"
  23: "神[かみ]は人[ひと]を不滅[ふめつ]のために造[つく]り、ご自身[じしん]の永遠性[えいえんせい]の像[かたち]に人を造[つく]られたからである。"
  24: "悪魔[あくま]の妬[ねた]みによって死[し]は世界[せかい]に入[はい]った。悪魔の側[がわ]に属[ぞく]する者[もの]たちが、これを味[あじ]わうのである。"

notes:
  1: "εἶπον γὰρ ἐν ἑαυτοῖς λογισάμενοι οὐκ ὀρθῶς — 彼らは心のうちで、誤って考えて言った: отсюда до 2:20 — прямая речь нечестивых, 「…」; вводка автора — вне кавычек. λογισάμενοι — аор. причастие, «рассудив»; οὐκ ὀρθῶς — «неправо» (слав. «помышляющии неправо»). Ὀλίγος — «малый, краткий»; ἴασις ἐν τελευτῇ — «исцеление при конце»; ὁ ἀναλύσας ἐξ ᾅδου — «тот, кто освободился из ада», т. е. вернувшийся оттуда (слав. «возвративыйся от ада»)."
  2: "αὐτοσχεδίως ἐγενήθημεν — 偶然に生まれた: αὐτοσχέδιος — «сделанный на скорую руку, случайный» (слав. «самослучайно»). ὡς οὐχ ὑπάρξαντες — 存在しなかった者のように: ὑπάρχω — «существовать, быть». καπνὸς ἡ πνοὴ ἐν ῥισὶν ἡμῶν — 鼻の息は煙: πνοή — «дыхание»; ῥίς — «нос, ноздря». ὁ λόγος σπινθὴρ ἐν κινήσει καρδίας — ことばは心の動きのうちの火花: σπινθήρ — «искра» (ср. 3:7)."
  3: "οὗ σβεσθέντος — それが消えると: относительное местоимение ср. рода, относится к искре (σπινθήρ) или к дыханию; слав. «ейже угасшей». τέφρα ἀποβήσεται τὸ σῶμα — 体は灰となる: ἀποβαίνω — «становиться»; τέφρα — «пепел». τὸ πνεῦμα διαχυθήσεται ὡς χαῦνος ἀήρ — 霊は薄い空気のように散る: διαχέω — «рассеивать, разливать»; χαῦνος — «рыхлый, разреженный» (слав. «мягкий»), в тексте 薄い."
  4: "τὸ ὄνομα ἡμῶν ἐπιλησθήσεται ἐν χρόνῳ — 名は時とともに忘れられる: ἐπιλανθάνομαι — «забывать» (пассив). ὡς ἴχνη νεφέλης — 雲の足跡のように: ἴχνος — «след»; νεφέλη — «облако». ὡς ὁμίχλη διασκεδασθήσεται — 霧のように散る: ὁμίχλη — «туман, мгла»; διασκεδάννυμι — «рассеивать». διωχθεῖσα ὑπὸ ἀκτίνων ἡλίου — 太陽の光に追われ: ἀκτίς — «луч»; διώκω — «гнать». βαρυνθεῖσα ὑπὸ θερμότητος — 熱に重くされる: βαρύνω — «отягощать» (слав. «отягчившися»)."
  5: "σκιᾶς πάροδος ὁ καιρὸς ἡμῶν — わたしたちの時は影の過ぎ行くにすぎない: πάροδος — «проход, прохождение»; καιρός — «время, срок» (слав. «стени бо преход житие наше»). οὐκ ἔστιν ἀναποδισμὸς τῆς τελευτῆς — 終わりに引き返しがつかない: ἀναποδισμός — «возврат, отступление назад» (слав. «возвращение»); τελευτή — «конец, смерть». κατεσφραγίσθη — 封印された: σφραγίζω — «запечатывать»; οὐδεὶς ἀναστρέφει — だれも戻らない."
  6: "δεῦτε οὖν — さあ、それゆえ: δεῦτε — призыв «идите сюда, ну». ἀπολαύσωμεν τῶν ὄντων ἀγαθῶν — 今ある良いものを楽しもう: ἀπολαύω — «пользоваться, наслаждаться» (слав. «насладимся настоящих благих»); τὰ ὄντα ἀγαθά — «настоящие, наличные блага». χρησώμεθα τῇ κτίσει — 造られたものを用いよう: κτίσις — «творение» (слав. «создания»). ὡς ἐν νεότητι σπουδαίως — 若いときのように、熱心に: σπουδαίως — «усердно, ревностно» (слав. «яко в юности скоро»)."
  7: "οἴνου πολυτελοῦς καὶ μύρων πλησθῶμεν — 高価なぶどう酒と香油に満ちよう: πολυτελής — «драгоценный, дорогой»; μύρον — «благовоние, миро» (слав. «вина дражайшаго и мира»). μὴ παροδευσάτω ἡμᾶς ἄνθος ἔαρος — 春の花をそばから過ぎ去らせてはならない: παροδεύω — «проходить мимо»; ἄνθος ἔαρος — «цвет весны». Слав. читает «цвет жития» (命の花) — это чтение принято по паритету, вариант LXX отмечен здесь."
  8: "στεψώμεθα ῥόδων κάλυξιν — 薔薇のつぼみで身を飾ろう: στέφω — «венчать, увенчивать»; κάλυξ — «чашечка цветка, бутон» (слав. «шипковыми цветы»). πρὶν ἢ μαρανθῆναι — しおれる前に: μαραίνομαι — «увядать»."
  9: "μηδεὶς ἡμῶν ἄμοιρος ἔστω — だれ一人あずからない者があってはならない: ἄμοιρος — «не имеющий доли, лишённый» (слав. «лишен»). τῆς ἡμετέρας ἀγερωχίας — わたしたちの驕り: ἀγερωχία — «надменность, заносчивость»; слав. «наслаждения» понимает слово как «разгул, веселье»; в тексте 驕り, потому что рядом σύμβολα τῆς εὐφροσύνης. πανταχῇ καταλίπωμεν σύμβολα τῆς εὐφροσύνης — 至るところに喜びのしるしを残そう: σύμβολον — «знак»; εὐφροσύνη — «веселье, радость». αὕτη ἡ μερὶς ἡμῶν καὶ ὁ κλῆρος οὗτος — これこそわたしたちの分、受ける持ち: κλῆρος — «жребий, удел»."
  10: "καταδυναστεύσωμεν πένητα δίκαιον — 貧しく正しい者を虐げよう: καταδυναστεύω — «угнетать, насиловать» (слав. «насилие сотворим»); πένης — «бедный». μὴ φεισώμεθα χήρας — 寡婦に情けをかけず: φείδομαι — «щадить»; χήρα — 寡婦. μηδὲ πρεσβύτου ἐντραπῶμεν πολιὰς πολυχρονίους — 多年の白髪をもつ老人にも敬いを払わない: ἐντρέπομαι — «стыдиться, уважать»; πολιά — «седина»; πολυχρόνιος — «многолетний» (слав. «седин многолетных»)."
  11: "ἡ ἰσχὺς νόμος τῆς δικαιοσύνης — 力を正しさの法としよう: ἰσχύς — «сила, крепость»; νόμος — 法; родительный τῆς δικαιοσύνης — «закон правды», т. е. право сильного. τὸ ἀσθενὲς ἄχρηστον ἐλέγχεται — 弱いものは無用であると明らかになる: ἐλέγχεται — «оказывается, изобличается» (слав. «неполезно обретается»); ἄχρηστος — «негодный»."
  12: "ἐνεδρεύσωμεν τὸν δίκαιον — 正しい者に罠を仕掛けよう: ἐνεδρεύω — «устраивать засаду» (слав. «уловим»). δύσχρηστος ἡμῖν ἐστιν — わたしたちにとって厄介な者: δύσχρηστος — «неудобный, тяжёлый в общении». ἐναντιοῦται τοῖς ἔργοις ἡμῶν — わたしたちのわざに逆らう. ὀνειδίζει ἁμαρτήματα νόμου — 律法に背く罪を責める: ὀνειδίζω — «укорять, поносить». ἐπιφημίζει ἡμῖν ἁμαρτήματα παιδείας ἡμῶν — わたしたちの育ちの罪を言いふらす: ἐπιφημίζω — «возглашать, разглашать»; παιδεία — «воспитание, обучение» (слав. «грехи учения нашего»)."
  13: "ἐπαγγέλλεται γνῶσιν ἔχειν θεοῦ — 神を知る者だと唱える: ἐπαγγέλλομαι — «обещать, заявлять притязание». παῖδα κυρίου ἑαυτὸν ὀνομάζει — 自分を主の僕と名乗る: παῖς — «отрок, слуга» (слав. «отрока»); в тексте 僕, потому что в 2:18 уже υἱός — 子; различие παῖς/υἱός сохранено."
  14: "ἐγένετο ἡμῖν εἰς ἔλεγχον ἐννοιῶν ἡμῶν — わたしたちの思いを責めるものとなった: ἔλεγχος — «обличение, изобличение»; ἔννοια — «мысль, помысел» (слав. «на обличение помышлений наших»). βαρύς ἐστιν ἡμῖν καὶ βλεπόμενος — 見るだけでも重い: βαρύς — «тяжёлый»; καί при βλεπόμενος — «даже когда его видят». Слав. делит иначе: csl 2:14 кончается словами «помышлений наших», а «тяжек есть нам и к видению» отнесено к csl 2:15."
  15: "ἀνόμοιος τοῖς ἄλλοις ὁ βίος αὐτοῦ — 彼の生き方はほかの者たちと似ていない: ἀνόμοιος — «неподобный, непохожий» (слав. «неподобно»). ἐξηλλαγμέναι αἱ τρίβοι αὐτοῦ — その歩みは違っている: ἐξαλλάσσω — «изменять, делать иным»; τρίβος — «тропа, путь» (слав. «отменны стези»). Слав. 2:15 начинается с полустишия предыдущего стиха, поэтому по делению gr этот стих короче слав."
  16: "εἰς κίβδηλον ἐλογίσθημεν αὐτῷ — 彼にとって偽物と見なされた: κίβδηλος — «поддельный, фальшивый (о монете)»; слав. «в поругание вменихомся» — свободная передача. ἀπέχεται τῶν ὁδῶν ἡμῶν ὡς ἀπὸ ἀκαθαρσιῶν — わたしたちの道を汚れのように避ける: ἀπέχομαι ἀπό — «держаться вдали»; ἀκαθαρσία — «нечистота». Слав. «удаляетеся» — 2-е лицо мн. ч., не согласующееся с греч. 3-м лицом ед. ч. μακαρίζει ἔσχατα δικαίων — 正しい者たちの終わりを幸いだとする: μακαρίζω — «ублажать». ἀλαζονεύεται πατέρα θεόν — 神を父と誇る: ἀλαζονεύομαι — «хвастаться, присваивать себе». Это хвастовство праведника в устах нечестивых, а не оценка автора."
  17: "ἴδωμεν εἰ οἱ λόγοι αὐτοῦ ἀληθεῖς — 彼の言葉が真実かどうか見よう: ἴδωμεν — конъюнктив-гортатив «увидим». πειράσωμεν τὰ ἐν ἐκβάσει αὐτοῦ — 彼の行く末に現れるものを試そう: ἔκβασις — «исход, конец» (слав. «яже сбудутся ему»)."
  18: "εἰ γάρ ἐστιν ὁ δίκαιος υἱὸς θεοῦ — もしこの正しい者が神の子であるなら: υἱός — 子 (ср. 2:13 παῖς). Слав. добавляет «истинный» (真の), чего в gr-lxx-byz нет; по паритету слово внесено в основной текст без 〔…〕 и отмечено «нет в LXX». ἀντιλήμψεται αὐτοῦ — 彼をかばう: ἀντιλαμβάνομαι — «заступаться, помогать». ῥύσεται ἐκ χειρὸς ἀνθεστηκότων — 逆らう者たちの手から救い出す: ῥύομαι — «избавлять»; ἀνθίστημι — «противостоять»."
  19: "ὕβρει καὶ βασάνῳ ἐτάσωμεν αὐτόν — 侮辱と責め苦しみで彼を試そう: ὕβρις — «оскорбление, надругательство»; βάσανος — «пытка, мучение»; ἐτάσωμεν от ἐτάζω — «испытывать, допрашивать» (слав. «истяжим»). ἐπιείκεια — 柔和 «кротость, снисходительность»; ἀνεξικακία — 恨みを抱かない心 «незлобие, терпение в обидах» (слав. «беззлобство»); δοκιμάζω — «испытывать»."
  20: "θανάτῳ ἀσχήμονι καταδικάσωμεν αὐτόν — みにくい死に彼を処そう: καταδικάζω — «осуждать, приговаривать»; ἀσχήμων — «безобразный, позорный» (слав. «смертию поносною»). ἔσται αὐτοῦ ἐπισκοπὴ ἐκ λογῶν αὐτοῦ — 彼の言葉に従って彼に訪れがある: ἐπισκοπή — «посещение» (здесь скорее «воздаяние, попечение»); ἐκ λογῶν — «от слов». Место тёмное: слав. «разсмотрение от словес его», Син. «о нем попечение будет»; многозначность не сглажена. Здесь речь нечестивых заканчивается, кавычки закрыты."
  21: "Ταῦτα ἐλογίσαντο, καὶ ἐπλανήθησαν — 彼らはこのように考え、迷った: с 21 снова авторский текст; аористы «помыслили и прельстились» (слав. «Сия помыслиша и прельстишася»). ἀπετύφλωσεν γὰρ αὐτοὺς ἡ κακία αὐτῶν — 彼らの悪が彼らを盲目にした: ἀποτυφλόω — «ослеплять»; κακία — «злоба, зло». Подлежащее — ἡ κακία, а не сами люди."
  22: "οὐκ ἔγνωσαν μυστήρια θεοῦ — 神の奥義を知らなかった: μυστήριον — 奥義, как в НЗ. μισθὸν ἤλπισαν ὁσιότητος — 敬虔の報いを望みもしなかった: μισθός — «награда»; ὁσιότης — «святость, благочестие» (слав. «мзды преподобия»). οὐδὲ ἔκριναν γέρας ψυχῶν ἀμώμων — 傷のない魂たちへの誉れを認めもしなかった: γέρας — «почётный дар, награда»; ἄμωμος — «непорочный» (слав. «чести душам непорочным»); κρίνω — «рассудить, признать»."
  23: "ὁ θεὸς ἔκτισεν τὸν ἄνθρωπον ἐπ᾽ ἀφθαρσίᾳ — 神は人を不滅のために造った: ἀφθαρσία — 不滅 (терминология книги; ср. 1 Кор 15:42, где в корпусе 朽ちないもの); ἐπί с дат. — «для, ради». εἰκόνα τῆς ἰδίας ἀιδιότητος ἐποίησεν αὐτόν — ご自身の永遠性の像に人を造られた: ἀιδιότης — «вечность, вечное бытие» (слав. «во образ подобия своего» — расширительно); εἰκών — 像; повтор 造 сохранён, как повтор ἔκτισεν/ἐποίησεν."
  24: "φθόνῳ δὲ διαβόλου — 悪魔の妬みによって: φθόνος — «зависть, завистливая ревность»; διάβολος — 悪魔. θάνατος εἰσῆλθεν εἰς τὸν κόσμον — 死は世界に入った: εἰσέρχομαι — «входить»; ср. Рим 5:12. πειράζουσιν δὲ αὐτὸν οἱ τῆς ἐκείνου μερίδος ὄντες — 悪魔の側に属する者たちがこれを味わう: πειράζω — «испытывать, подвергать искушению»; слав. «вкушают же ю» — чтение принято по паритету (味わう), вариант LXX отмечен. μερίς — «часть, удел» (ср. 1:16; 2:9)."
