verses:
  0: "指揮者[しきしゃ]に。第八[だいはち]について。ダビデの詩[うた]。"
  1: "主[しゅ]よ、わたしを救[すく]ってください。聖[せい]なる者[もの]が絶[た]え、人[ひと]の子[こ]らの中[なか]から真実[しんじつ]が少[すく]なくなったからである。"
  2: "人[ひと]はそれぞれ、隣[となり]の人[ひと]にむなしいことを語[かた]った。欺[あざむ]く唇[くちびる]で、心[こころ]を二[ふた]つに分[わ]けて語[かた]った。"
  3: "主[しゅ]が、すべての欺[あざむ]く唇[くちびる]と、大[おお]げさに語[かた]る舌[した]とを根[ね]こそぎ断[た]ち切[き]られるように。"
  4: "彼[かれ]らは言[い]った。「わたしたちは自分の舌[した]を大[おお]きくする。わたしたちの唇[くちびる]はわたしたちのものだ。だれがわたしたちの主[ぬし]なのか」と。"
  5: "「貧[まず]しい者[もの]の苦[くる]しみと、苦[くる]しむ者[もの]の呻[うめ]きのゆえに、わたしは今[いま]、立[た]ち上[あ]がる」と主[しゅ]は言[い]われる。「わたしは彼[かれ]を救[すく]いのうちに置[お]き、彼[かれ]において大胆[だいたん]に語[かた]る。」"
  6: "主[しゅ]の言葉[ことば]は清[きよ]い言葉[ことば]であり、地[ち]の上[うえ]で試[ため]され、七度[ななたび]にわたって清[きよ]められた銀[ぎん]である。"
  7: "主[しゅ]よ、あなたはわたしたちを守[まも]り、この世代[せだい]から、とこしえに守[まも]り続[つづ]けてくださる。"
  8: "悪[わる]い者[もの]たちが周[まわ]りを歩[ある]き回[まわ]っている。あなたはあなたの高[たか]みに応[おう]じて、人[ひと]の子[こ]らを多[おお]くされた。"

notes:
  0: "Εἰς τὸ τέλος, ὑπὲρ τῆς ὀγδόης· ψαλμὸς τῷ Δαυιδ — 指揮者に。第八について。ダビデの詩 (как в надписании Пс 6; ὀγδόη — «восьмая», глас или восьмиструнник, оставлено 第八 без домысла). Надписание — стих 0."
  1: "Σῶσόν με, κύριε, ὅτι ἐκλέλοιπεν ὅσιος — 主よ、わたしを救ってください、聖なる者が絶えたからである (ἐκλείπω — «оскудевать, исчезать»; ὅσιος — «преподобный, святой»). ὅτι ὠλιγώθησαν αἱ ἀλήθειαι ἀπὸ τῶν υἱῶν τῶν ἀνθρώπων — 人の子らの中から真実が少なくなった (ὀλιγόω — «умаляться»; plural ἀλήθειαι — «истины», передано 真実)."
  2: "μάταια ἐλάλησεν ἕκαστος πρὸς τὸν πλησίον αὐτοῦ — 人はそれぞれ、隣の人にむなしいことを語った (μάταια — «пустое, суетное»; πλησίον — 隣の人). χείλη δόλια ἐν καρδίᾳ καὶ ἐν καρδίᾳ ἐλάλησαν — 欺く唇で、心を二つに分けて語った (χεῖλος — 唇; δόλιος — «коварный»; ἐν καρδίᾳ καὶ ἐν καρδίᾳ — «сердце и сердце», т. е. двоедушие, передано 心を二つに分けて)."
  3: "ἐξολεθρεύσαι κύριος πάντα τὰ χείλη τὰ δόλια — 主が、すべての欺く唇を…断ち切られるように (ἐξολεθρεύω — «истреблять»; оптатив передан 〜ように). καὶ γλῶσσαν μεγαλορήμονα — 大げさに語る舌 (μεγαλορήμων — «велеречивый, хвастливый», букв. «великоглаголивый»)."
  4: "τοὺς εἰπόντας — 彼らは言った (тех, кто сказал). Τὴν γλῶσσαν ἡμῶν μεγαλυνοῦμεν — わたしたちは自分の舌を大きくする (μεγαλύνω — «возвеличивать»). τὰ χείλη ἡμῶν παρ᾽ ἡμῶν ἐστιν — わたしたちの唇はわたしたちのものだ (παρ᾽ ἡμῶν — «от нас», т. е. в нашей власти). τίς ἡμῶν κύριός ἐστιν — だれがわたしたちの主なのか. Речь нечестивых — 「」."
  5: "Ἀπὸ τῆς ταλαιπωρίας τῶν πτωχῶν — 貧しい者の苦しみのゆえに (ταλαιπωρία — «бедствие, страдание»; πτωχός — «нищий»). ἀπὸ τοῦ στεναγμοῦ τῶν πενήτων — 苦しむ者の呻きのゆえに (στεναγμός — 呻き). νῦν ἀναστήσομαι, λέγει κύριος — 「わたしは今、立ち上がる」と主は言われる. θήσομαι ἐν σωτηρίᾳ — わたしは彼を救いのうちに置き (τίθημι — «полагать»). παρρησιάσομαι ἐν αὐτῷ — 彼において大胆に語る (παρρησιάζομαι — «говорить с дерзновением»; тёмное место, оставлено буквально)."
  6: "τὰ λόγια κυρίου λόγια ἁγνά — 主の言葉は清い言葉 (λόγιον — «изречение»; ἁγνός — «чистый»). ἀργύριον πεπυρωμένον δοκίμιον τῇ γῇ κεκαθαρισμένον ἑπταπλασίως — 地の上で試され、七度にわたって清められた銀 (πυρόω — «прокаливать»; δοκίμιον — «испытанное»; ἑπταπλασίως — «семерично»; 炉 не добавлена — в греч. её нет)."
  7: "σύ, κύριε, φυλάξεις ἡμᾶς — 主よ、あなたはわたしたちを守り (φυλάσσω — «охранять»). διατηρήσεις ἡμᾶς ἀπὸ τῆς γενεᾶς ταύτης — この世代から守り続けてくださる (διατηρέω — «сохранять»; γενεά — «род, поколение»). καὶ εἰς τὸν αἰῶνα — とこしえに."
  8: "κύκλῳ οἱ ἀσεβεῖς περιπατοῦσιν — 悪い者たちが周りを歩き回っている (κύκλῳ — «вокруг»; περιπατέω — «ходить»). κατὰ τὸ ὕψος σου ἐπολυώρησας τοὺς υἱοὺς τῶν ἀνθρώπων — あなたはその高みに応じて、人の子らを多くされた (ἐπολυώρησας — тёмное место: «умножил» или «много попечился»; ср. церковнослав. «по высоте Твоей умножил еси сыны человеческия»; передано буквально, без сглаживания)."
