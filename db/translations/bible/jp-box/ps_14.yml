verses:
  0: "ダビデの詩[うた]。"
  1: "主[しゅ]よ、だれがあなたの幕屋[まくや]に宿[やど]り、だれがあなたの聖[せい]なる山[やま]に住[す]まうことができるのか。"
  2: "欠[か]けるところなく歩[あゆ]み、義[ぎ]を行[おこな]い、心[こころ]のうちに真実[しんじつ]を語[かた]る者[もの]。"
  3: "その舌[した]で欺[あざむ]かず、隣[となり]の人[ひと]に悪[わる]をせず、近[ちか]しい者[もの]へのそしりを受[う]けない者[もの]。"
  4: "その目[め]には悪[わる]を行[おこな]う者[もの]が軽[かろ]んじられ、主[しゅ]を恐[おそ]れる者[もの]が尊[たっと]ばれる者[もの]。隣[となり]の人[ひと]に誓[ちか]って、それを変[か]えない者[もの]。"
  5: "銀[ぎん]を利子[りし]につけて貸[か]さず、罪[つみ]のない者[もの]に反[はん]して贈[おく]り物[もの]を受[う]け取[と]らない者[もの]。これらのことを行[おこな]う者[もの]は、とこしえに揺[ゆ]らぐことがない。"

notes:
  0: "Ψαλμὸς τῷ Δαυιδ — ダビデの詩. В gr-lxx-byz надписание короткое, без «в конец»; надписание — стих 0."
  1: "Κύριε, τίς παροικήσει ἐν τῷ σκηνώματί σου — 主よ、だれがあなたの幕屋に宿り (παροικέω — «жить как пришлец, гостить»; σκήνωμα — «шатёр, скиния», 幕屋). καὶ τίς κατασκηνώσει ἐν τῷ ὄρει τῷ ἁγίῳ σου — だれがあなたの聖なる山に住まうことができるのか (κατασκηνόω — «водружать шатёр, обитать»). Два глагола «обитать» переданы различно: 宿り и 住まう."
  2: "πορευόμενος ἄμωμος — 欠けるところなく歩み (ἄμωμος — «непорочный», букв. «без порока», о жертве). ἐργαζόμενος δικαιοσύνην — 義を行い. λαλῶν ἀλήθειαν ἐν καρδίᾳ αὐτοῦ — 心のうちに真実を語る (ἐν καρδίᾳ — «в сердце», т. е. нелицемерно). Ряд придаточных продолжается в ст. 3–5."
  3: "ὃς οὐκ ἐδόλωσεν ἐν γλώσσῃ αὐτοῦ — その舌で欺かず (δολόω — «льстить, обманывать»). οὐδὲ ἐποίησεν τῷ πλησίον αὐτοῦ κακόν — 隣の人に悪をせず. ὀνειδισμὸν οὐκ ἔλαβεν ἐπὶ τοὺς ἔγγιστα αὐτοῦ — 近しい者へのそしりを受けない (ὀνειδισμός — «порицание, позор»; ἐπὶ τοὺς ἔγγιστα — «на ближних», т. е. не принимает хулы на них)."
  4: "ἐξουδένωται ἐνώπιον αὐτοῦ πονηρευόμενος — その目には悪を行う者が軽んじられ (ἐξουδενόω — «уничижать, ни во что вменять»). τοὺς δὲ φοβουμένους κύριον δοξάζει — 主を恐れる者が尊ばれる (δοξάζω — «прославлять, чтить»). ὁ ὀμνύων τῷ πλησίον αὐτοῦ καὶ οὐκ ἀθετῶν — 隣の人に誓って、それを変えない (ἀθετέω — «нарушать, отменять»)."
  5: "τὸ ἀργύριον αὐτοῦ οὐκ ἔδωκεν ἐπὶ τόκῳ — 銀を利子につけて貸さず (τόκος — «рост, лихва»). δῶρα ἐπ᾽ ἀθῴοις οὐκ ἔλαβεν — 罪のない者に反して贈り物を受け取らない (δῶρον — «дар, взятка»; ἀθῷος — «невинный»). ὁ ποιῶν ταῦτα οὐ σαλευθήσεται εἰς τὸν αἰῶνα — これらのことを行う者は、とこしえに揺らぐことがない (σαλεύω — «колебать, потрясать»)."
