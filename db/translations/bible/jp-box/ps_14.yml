# jp-box, Псалтирь, псалом 14. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0.
# Псалом 14 (LXX; евр. 15): кто обитает в шатре и на святой горе (1),
# непорочный, правду творящий, истину глаголющий (2), не льстящий языком (3),
# уничижающий нечестивого и чтящий боящихся Господа, верный в клятве (4),
# не дающий серебра в лихву и не берущий даров на невинного (5).
# Вся глава — один ряд придаточных «…者」, стихи 2–5 продолжают вопрос ст. 1;
# каждый стих всё же закончен точкой, как в пилоте Пс 2 (речь в 7–9).
# Красного и синего нет. Прямой речи нет; кавычек в главе нет.
# 〔…〕 нет: все слова в gr-lxx-byz есть.
# セラ в этом псалме нет; διάψαλμα не передаётся — по решению пользователя, как у jp-joc.
# Сносок ⟨…⟩ нет: 幕屋, 聖なる山, 祭壇 уже в корпусе.
# jp-ni не использовался.

