# jp-box, Екклесиаст, глава 6. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru); ru (Синодальный)
# только для понимания. jp-joc в Екклесиасте отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Нумерация LXX: глава 6 = Син. 5:9–6:12, 12 стихов; 6:1–12 — о ненасытности
# (богатство без власти пользоваться им; сто детей и выкидыш; труд ради рта;
# мудрый и бедняк; непостижимость будущего).
# Красного и синего нет: речь Екклесиаста — от первого лица, без кавычек; его слова о себе
# и прямая цитата собственного изречения — в 「…」 (6:3, как 1:16).
# 〔…〕 нет: все слова есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 流産, 墓, 太陽, 魂 понятны и уже встречались в корпусе.
# Дефект модуля csl-ru: в 6:11 славянский стих обрывается на первой половине, а вторая
# половина с 6:12 стоит у славян в 7:1 — сдвиг нумерации, оговорено в notes.
# jp-ni не использовался.

tr_code: jp-box
book: ekl
chapter: 6
draft: true

verses:
  1: "日[ひ]の下[もと]でわたしが見[み]た悪[あく]がある。それは人[ひと]の上[うえ]に重[おも]くのしかかる。"
  2: "それは、神[かみ]が富[とみ]と財産[ざいさん]と栄光[えいこう]を与[あた]え、その魂[たましい]が望[のぞ]むことの何[なに]一[ひと]つ欠[か]けない者[もの]である。なのに神[かみ]はその者[もの]にそれを食[た]べることを許[ゆる]されず、ほかならぬ他[た]人[にん]がそれを食[た]べる。これもまた空[むな]しく、悪[わる]い病[やまい]である。"
  3: "たとえ人[ひと]が百人[ひゃくにん]の子[こ]を生[う]み、多[おお]くの年[とし]を生[い]き、その年[とし]の日[ひ]がどれほど多[おお]くなっても、その魂[たましい]が善[よ]いもので満[み]たされず、しかも墓[はか]も与[あた]えられなかったなら、わたしは言[い]った。「流産[りゅうざん]の子[こ]のほうが、彼[かれ]より良[よ]い」と。"
  4: "その子[こ]は空[むな]しさのうちに来[き]て、暗[くら]がりの中[なか]を歩[あゆ]み、その名[な]も暗[くら]がりに覆[おお]われるからである。"
  5: "太陽[たいよう]を見[み]ることも知[し]ることもなかった。それでも、この者[もの]よりは安[やす]らかである。"
  6: "たとえ千年[せんねん]を二度[にど]生[い]きても、善[よ]いものを見[み]なかったなら、すべてのものは一[ひと]つの所[ところ]へ行[い]くのではないか。"
  7: "人[ひと]の労苦[ろうく]はすべて自分[じぶん]の口[くち]のためにある。それでも魂[たましい]は満[み]たされない。"
  8: "知恵[ちえ]ある者[もの]には、愚[おろ]かな者[もの]にまさる何[なん]の益[えき]があるのか。貧[まず]しい者[もの]が、生[い]きている者[もの]の前[まえ]を歩[あゆ]むことを知[し]っていても、何[なん]の益[えき]があるのか。"
  9: "目[め]で見[み]るほうが、魂[たましい]をさまよわせるより良[よ]い。これもまた空[むな]しく、風[かぜ]を追[お]うようなものである。"
  10: "かつて生[しょう]じたものには、すでに名[な]がつけられている。人[ひと]とは何[なん]であるかも知[し]られている。人[ひと]は自分[じぶん]より強[つよ]い者[もの]と争[あらそ]うことはできない。"
  11: "多[おお]くの言葉[ことば]は空[むな]しさを増[ふ]やす。人[ひと]にとって何[なん]の益[えき]があるのか。"
  12: "人[ひと]にとって何[なに]が善[よ]いかを、誰[だれ]が知[し]っているだろうか。その人[ひと]の空[むな]しい命[いのち]の日[ひ]数[かず]の間[あいだ]のことを。その日[ひ]々[び]は影[かげ]のように過[す]ぎて行[い]く。その人[ひと]の後[あと]に日[ひ]の下[もと]で何[なに]があるかを、誰[だれ]がその人[ひと]に告[つ]げるだろうか。"

notes:
  1: "πονηρία — «зло, лукавство». πολλή ἐστιν ἐπὶ τὸν ἄνθρωπον — «велико оно над человеком»; Синодальный «часто бывает между людьми» — смягчение (с масоретского). 悪 — здесь не «злодеяние», а тяжкое зло жизни."
  2: "ἀνήρ — «человек, муж». ὑστερῶν τῇ ψυχῇ — «терпящий недостаток душою». ἀνὴρ ξένος — «чужой человек». ἀρρωστία πονηρά — «злой недуг». Тот же случай, что 5:12–13, но здесь добавлены слава и чужая трапеза."
  3: "ἔκτρωμα — «выкидыш, преждевременно рождённый» (流産の子). ταφή — «погребение». εἶπα Ἀγαθὸν ὑπὲρ αὐτὸν τὸ ἔκτρωμα — «я сказал: лучше его выкидыш»; прямая цитата собственного изречения — в 「…」, как 1:16."
  4: "ἐν ματαιότητι ἦλθεν — «в суете пришёл»; ἐν σκότει πορεύεται — «во тьме ходит»; ὄνομα καλυφθήσεται — «имя покроется». Речь о выкидыше, а не о человеке из 6:3."
  5: "ἥλιον οὐκ εἶδεν καὶ οὐκ ἔγνω — «солнца не видел и не познал». ἀνάπαυσις τούτῳ ὑπὲρ τοῦτον — «покой этому лучше того»."
  6: "χιλίων ἐτῶν καθόδους — букв. «тысячи лет обороты»; слав. «тысящу лет сугубо», т.е. две тысячи. μὴ οὐκ εἰς τόπον ἕνα — усиленное отрицание в вопросе: «не в одно ли место?» (ср. 3:20)."
  7: "πᾶς μόχθος τοῦ ἀνθρώπου εἰς στόμα αὐτοῦ — «весь труд человека в уста его», т.е. ради еды (слав. «во уста его»). ψυχὴ οὐ πληρωθήσεται — «душа не наполнится»."
  8: "περισσεία — «преимущество» (ср. 5:9). ὁ πένης οἶδεν πορευθῆναι κατέναντι τῆς ζωῆς — «бедняк знает, как ходить перед жизнью», т.е. перед живыми (слав. «противу живота»). Обе половины — вопросы."
  9: "ὅραμα ὀφθαλμῶν — «видение очей»; πορευόμενον ψυχῇ — «ходящего душою» (слав. «ходящаго душею»): лучше видеть, чем блуждать желанием. προαίρεσις πνεύματος — «стремление духа», передаётся 風を追う, как 1:14."
  10: "κέκληται ὄνομα — «названо имя». ἐγνώσθη ὅ ἐστιν ἄνθρωπος — «познано, что есть человек». κριθῆναι μετὰ τοῦ ἰσχυροῦ — «судиться с Сильным»; ἰσχυρός здесь о Боге (Синодальный «с тем, кто сильнее его»)."
  11: "πληθύνοντες ματαιότητα — «умножающие суету». В модуле csl-ru стих обрывается на первой половине, вторая (τί περισσὸν τῷ ἀνθρώπῳ) у славян стоит в 7:1 — это сдвиг нумерации, а не пропуск."
  12: "ἀριθμὸν ἡμερῶν ζωῆς ματαιότητος — «число дней суетной жизни». ἐποίησεν αὐτὰς ἐν σκιᾷ — «проводит их как тень». Стих csl-ru в модуле пуст (его текст сдвинут в 7:1 славянской нумерации) — перевод по греческому."
