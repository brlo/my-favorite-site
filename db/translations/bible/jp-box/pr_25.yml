verses:
  1: "これらはソロモンの戒[いまし]めであり、まだ順[じゅん]に整[ととの]えられていないもので、ユダヤの王[おう]エゼキヤの友人[ゆうじん]たちが書[か]き写[うつ]したものである。"
  2: "神[かみ]の栄光[えいこう]は言葉[ことば]を隠[かく]すことにあり、王[おう]の栄光[えいこう]は事柄[ことがら]を尊[とうと]ぶことにある。"
  3: "天[てん]は高[たか]く、地[ち]は深[ふか]く、王[おう]の心[こころ]は測[はか]り知[し]れない。"
  4: "試[ため]されていない銀[ぎん]を打[う]て。そうすれば、すべて純[じゅん]なものに清[きよ]められる。"
  5: "王[おう]の前[まえ]から不敬[ふけい]な者[もの]たちを殺[ころ]せ。そうすれば、その王座[おうざ]は正[ただ]しさのうちに立[た]ち直[なお]る。"
  6: "王[おう]の前[まえ]で高[たか]ぶるな。支[し]配者[しはいしゃ]たちの場所[ばしょ]に立[た]つな。"
  7: "「こちらへ上[あ]がってきなさい」と言[い]われるほうが、支[し]配者[しはいしゃ]の前[まえ]で辱[はずかし]められるより、あなたにとって良[よ]いからである。あなたの目[め]が見[み]たことを語[かた]れ。"
  8: "争[あらそ]いへ性急[せいきゅう]に飛[び]び込[こ]むな。終[お]わりになって悔[く]いることになるからである。それは、あなたの友[とも]があなたを責[せ]めるときである。"
  9: "後[うし]ろへ退[しりぞ]け。侮[あなど]るな。"
  10: "友[とも]があなたを責[せ]め、あなたの争[あらそ]いと敵意[てきい]が去[さ]らず、死[し]に等[ひと]しいものとなることがないように。恵[めぐ]みと愛[あい]は解[と]き放[はな]つ。これらを自分[じぶん]のために守[まも]れ。そうすれば、あなたは辱[はずかし]めを受[う]ける者[もの]とならず、あなたの道[みち]を穏[おだ]やかに保[たも]つことができる。"
  11: "金[きん]のりんごをサードの飾[かざ]りに据[す]えるように、ふさわしいときに語[かた]られる言葉[ことば]はある。"
  12: "金[きん]の耳飾[みみかざ]りに貴重[きちょう]なサードが結[むす]ばれるように、よく聞[き]く耳[みみ]には知恵[ちえ]ある言葉[ことば]が結ばれる。"
  13: "暑[あつ]い刈[か]り入[い]れのときに雪[ゆき]が降[ふ]りるのは役[やく]に立[た]つ。そのように、忠実[ちゅうじつ]な使者[ししゃ]は遣[つか]わした者[もの]に役に立つ。彼は自分[じぶん]を用[もち]いる者[もの]たちの魂[たましい]を益[えき]するからである。"
  14: "風[かぜ]と雲[くも]と激[はげ]しい雨[あめ]があるように、偽[いつわ]りの贈[おく]り物[もの]を誇[ほこ]る者[もの]もそうである。"
  15: "忍耐[にんたい]によって王[おう]たちには道[みち]が開[ひら]ける。柔[やわ]らかい舌[した]は骨[ほね]を砕[くだ]く。"
  16: "蜜[みつ]を見[み]つけたら、満[み]ち足[た]りるだけ食[た]べよ。飽[あ]きて吐[は]き出[だ]すことのないように。"
  17: "あなたの友[とも]のところへ、足[あし]をまれに運[はこ]べ。飽[あ]きてあなたを憎[にく]むことのないように。"
  18: "棍棒[こんぼう]と剣[つるぎ]と鋭[するど]い矢[や]があるように、自分[じぶん]の友[とも]に偽[にせ]の証言[しょうげん]をする者[もの]もそうである。"
  19: "悪[あく]い者[もの]の道[みち]と不法[ふほう]な者[もの]の足[あし]は、悪[わる]い日[ひ]に滅[ほろ]びる。"
  20: "酢[す]が傷[きず]に悪[わる]いように、煙[けむり]が目[め]に悪いように、体[からだ]に降[ふ]りかかった苦[くる]しみは心[こころ]を痛[いた]める。衣[ころも]に蛾[が]、木[き]に虫[むし]が食[く]い入[はい]るように、悲[かな]しみは人[ひと]の心を傷[きず]つける。"
  21: "あなたの敵[てき]が飢[う]えているなら、食[た]べさせよ。渇[かわ]いているなら、飲[の]ませよ。"
  22: "そうするなら、あなたは燃[も]える炭[すみ]を彼[かれ]の頭[あたま]に積[つ]むことになり、主[しゅ]はあなたに良[よ]いことを報[むく]いられる。"
  23: "北風[きたかぜ]が雲[くも]を起[お]こすように、厚[あつ]かましい顔[かお]は舌[した]を激[はげ]しくする。"
  24: "屋根[やね]の隅[すみ]に住[す]むほうが、共[とも]に住[す]まう家[いえ]で口[くち]うるさい女[おんな]と住むより良[よ]い。"
  25: "渇[かわ]いた魂[たましい]に冷[つめ]たい水[みず]が心地[ここち]よいように、遠[とお]い国[くに]から届[とど]く良[よ]い知[し]らせも心地よい。"
  26: "泉[いずみ]をふさぎ、水[みず]の流[なが]れを濁[にご]す者[もの]がいるなら、正[ただ]しい者[もの]が不敬[ふけい]な者[もの]の前[まえ]で倒[たお]れるのも、それと同[おな]じく見苦[みぐる]しい。"
  27: "蜜[みつ]を多[おお]く食[た]べるのは良[よ]くない。だが、立派[りっぱ]な言葉[ことば]は尊[とうと]ぶべきである。"
  28: "城壁[じょうへき]が崩[くず]れ落[お]ちて囲[かこ]いのない都[みやこ]のように、助言[じょげん]なしに何[なに]かを行[おこな]う者[もの]はそうである。"

notes:
  1: "Αὗται αἱ παιδεῖαι Σαλωμῶντος αἱ ἀδιάκριτοι — «это наставления Соломона неразобранные (неразличённые)»: ἀδιάκριτος — «неразделённый, без разбора», слав. «бывшыя нерасположенны». ἃς ἐξεγράψαντο οἱ φίλοι Εζεκιου τοῦ βασιλέως τῆς Ιουδαίας — «которые списали друзья Езекии, царя Иудеи»: ἐκγράφω — «переписывать»; слав. «друзие езекии царя иудейска», Син. «мужи Езекии»."
  2: "δόξα θεοῦ κρύπτει λόγον — «слава Божия скрывает слово»; δόξα δὲ βασιλέως τιμᾷ πράγματα — «слава же царя чтит дела (вещи)»: τιμάω — «чтить, ценить»; слав. «слава же царева почитает повеления его», Син. «исследывать дело» (по масоретскому тексту). Держимся греческого."
  3: "οὐρανὸς ὑψηλός, γῆ δὲ βαθεῖα — «небо высоко, земля же глубока»; καρδία δὲ βασιλέως ἀνεξέλεγκτος — «сердце же царя необличимо (неисследимо)» (ἀνεξέλεγκτος, от ἐλέγχω — «обличать»); слав. «необличително»."
  4: "τῦπτε ἀδόκιμον ἀργύριον — «бей (чекань) неодобренное серебро» (ἀδόκιμος — «непринятый, неиспытанный»; τύπτω — «ударять, чеканить»); καθαρισθήσεται καθαρὸν ἅπαν — «очистится всё чистое»; слав. «куй неискушенное сребро»."
  5: "κτεῖνε ἀσεβεῖς ἐκ προσώπου βασιλέως — «убивай нечестивых от лица царя» (κτείνω — «убивать»); слав. «убивай нечестивыя от лица царева». κατορθώσει ἐν δικαιοσύνῃ ὁ θρόνος αὐτοῦ — «утвердится в правде престол его» (κατορθόω — «выпрямлять, утверждать»)."
  6: "μὴ ἀλαζονεύου ἐνώπιον βασιλέως — «не величайся пред царём» (ἀλαζονεύομαι — «хвастаться»); μηδὲ ἐν τόποις δυναστῶν ὑφίστασο — «и в местах владык не становись» (ὑφίσταμαι — «становиться, выступать»); слав. «на месте сильных не стани»."
  7: "κρεῖσσον γάρ σοι τὸ ῥηθῆναι Ἀνάβαινε πρός με — «ибо лучше тебе, чтобы сказали: взойди ко мне»: слова царя или распорядителя — 「…」; ἢ ταπεινῶσαί σε ἐν προσώπῳ δυνάστου — «чем унизить тебя пред лицом владыки». ἃ εἶδον οἱ ὀφθαλμοί σου, λέγε — «что видели глаза твои, говори»: в gr стоит в конце ст. 7, в csl — в начале ст. 8."
  8: "μὴ πρόσπιπτε εἰς μάχην ταχέως — «не впадай в тяжбу (ссору) скоро» (προσπίπτω — «бросаться на»); ἵνα μὴ μεταμεληθῇς ἐπ᾽ ἐσχάτων — «чтобы не раскаяться тебе в конце». ἡνίκα ἄν σε ὀνειδίσῃ ὁ σὸς φίλος — «когда укорит тебя друг твой»: в gr этот оборот стоит в конце ст. 8, в csl он отнесён к ст. 9 («да не поносит убо тебе друг»); в японском дан законченным предложением, чтобы стих не обрывался на полуслове."
  9: "ἀναχώρει εἰς τὰ ὀπίσω — «отступай назад»; μὴ καταφρόνει — «не презирай» (καταφρονέω). Слав. вбирает сюда начало ст. 10: «вступай вспять, не неради, да не поносит убо тебе друг»."
  10: "μή σε ὀνειδίσῃ μὲν ὁ φίλος — «чтобы не укорил тебя друг»: повтор оборота из ст. 8 (в LXX так, двойное чтение сохранено); ἡ δὲ μάχη σου καὶ ἡ ἔχθρα οὐκ ἀπέσται — «и ссора твоя и вражда не отступят»; ἀλλ᾽ ἔσται σοι ἴση θανάτῳ — «но будет тебе равна смерти». Подстих 10a: χάρις καὶ φιλία ἐλευθεροῖ — «благодать (милость) и дружба освобождают»; ἃς τήρησον σεαυτῷ — «их соблюди себе»; ἵνα μὴ ἐπονείδιστος γένῃ — «чтобы не стать тебе поносимым»; φύλαξον τὰς ὁδούς σου εὐσυναλλάκτως — «храни пути твои мирно (уступчиво)» (εὐσυνάλλακτος — «легко мирящийся»)."
  11: "μῆλον χρυσοῦν ἐν ὁρμίσκῳ σαρδίου — «золотое яблоко в ожерелье (оправе) сардия»: ὁρμίσκος — «ожерелье, цепочка»; σάρδιον — сердолик, сардий; слав. «яблоко злато во усерязи сардийскаго камене» (усерязь — серьга), Син. «в серебряных прозрачных сосудах» (по масоретскому тексту). οὕτως εἰπεῖν λόγον — «так сказать слово», т. е. слово, сказанное вовремя и к месту."
  12: "εἰς ἐνώτιον χρυσοῦν σάρδιον πολυτελὲς δέδεται — «в золотую серьгу драгоценный сардий вдевается» (ἐνώτιον — «серьга»; δέω — «связывать, вделывать»); λόγος σοφὸς εἰς εὐήκοον οὖς — «слово мудрое в ухо внимающее» (εὐήκοος — «послушный, внимающий»)."
  13: "ὥσπερ ἔξοδος χιόνος ἐν ἀμήτῳ κατὰ καῦμα ὠφελεῖ — «как выпадение снега в жатву во время зноя полезно» (ἔξοδος — «выход»; καῦμα — «зной»); ἄγγελος πιστὸς τοὺς ἀποστείλαντας αὐτόν — «посол верный пославших его»; ψυχὰς τῶν αὐτῷ χρωμένων ὠφελεῖ — «души пользующихся им (служащих ему) пользует»."
  14: "ὥσπερ ἄνεμοι καὶ νέφη καὶ ὑετοὶ ἐπιφανέστατοι — «как ветры, облака и дожди, весьма явные» (ἐπιφανής — «явный, видный»; ὑετός — «дождь»); οἱ καυχώμενοι ἐπὶ δόσει ψευδεῖ — «хвалящиеся даянием ложным». Синодальный «тучи и ветры без дождя»."
  15: "ἐν μακροθυμίᾳ εὐοδία βασιλεῦσιν — «в долготерпении благоуспешность царям» (μακροθυμία — «долготерпение»; εὐοδία — «успешный путь»); γλῶσσα δὲ μαλακὴ συντρίβει ὀστᾶ — «язык же мягкий сокрушает кости», т. е. мягкой речью можно сломить упорство."
  16: "μέλι εὑρὼν φάγε τὸ ἱκανόν — «мёд найдя, ешь достаточное» (τὸ ἱκανόν — «достаточно»); μήποτε πλησθεὶς ἐξεμέσῃς — «как бы, пресытившись, не изблевал» (ἐξεμέω — «извергать»)."
  17: "σπάνιον εἴσαγε σὸν πόδα πρὸς τὸν σεαυτοῦ φίλον — «редко вводи ногу твою к другу твоему» (σπάνιος — «редкий»); μήποτε πλησθεὶς σου μισήσῃ σε — «как бы, пресытившись тобою, не возненавидел тебя»."
  18: "ῥόπαλον καὶ μάχαιρα καὶ τόξευμα ἀκιδωτόν — «палица, меч и стрела острая» (ῥόπαλον — «дубина»; ἀκιδωτός — «острожалый»); ὁ καταμαρτυρῶν τοῦ φίλου αὐτοῦ μαρτυρίαν ψευδῆ — «свидетельствующий против друга своего свидетельство ложное»."
  19: "ὀδοὺς κακοῦ καὶ ποὺς παρανόμου ὀλεῖται ἐν ἡμέρᾳ κακῇ — «пути злого и нога беззаконного погибнет в день злой»: два подлежащих при одном сказуемом; слав. «путь злаго и нога законопреступнаго погибнут в день зол». Синодальный здесь иной (по масоретскому тексту: «сломанный зуб и расслабленная нога»)."
  20: "ὥσπερ ὄξος ἕλκει ἀσύμφορον — «как уксус влечёт негодное»: тёмный оборот, слав. «якоже оцет неполезен вреду»; в csl добавлено «и дым очима», чего в gr нет, — внесено в основной текст по паритету, без 〔…〕. ὥσπερ σὴς ἱματίῳ καὶ σκώληξ ξύλῳ, οὕτως λύπη ἀνδρὸς βλάπτει καρδίαν (подстих 20a) — «как моль одежде и червь дереву, так печаль мужу вредит сердце»; это и есть слав. ст. 21, поэтому отдельного стиха нет. Синодальный иной (по масоретскому тексту)."
  21: "ἐὰν πεινᾷ ὁ ἐχθρός σου, τρέφε αὐτόν — «если голоден враг твой, корми его» (τρέφω — «питать»); ἐὰν διψᾷ, πότιζε αὐτόν — «если жаждет, пои его» (ποτίζω — «давать пить»). По делению gr это ст. 21; в csl те же слова — ст. 22 (сдвиг на один стих, см. ст. 20 и шапку)."
  22: "ἄνθρακας πυρὸς σωρεύσεις ἐπὶ τὴν κεφαλὴν αὐτοῦ — «уголья огненные соберёшь на голову его» (σωρεύω — «нагромождать»): образ жгучего стыда, ведущего к примирению; ὁ κύριος ἀνταποδώσει σοι ἀγαθά — «Господь воздаст тебе благая». В csl это ст. 23."
  23: "ἄνεμος βορέας ἐξεγείρει νέφη — «ветер северный воздвигает облака» (βορέας — «северный ветер»); πρόσωπον δὲ ἀναιδὲς γλῶσσαν ἐρεθίζει — «лицо же бесстыдное язык раздражает» (ἀναιδής — «бесстыжий»; ἐρεθίζω — «раздражать»), т. е. бесстыдство вызывает злоязычие. В csl это ст. 24."
  24: "κρεῖττον οἰκεῖν ἐπὶ γωνίας δώματος — «лучше жить на углу дома (кровли)»; ἢ μετὰ γυναικὸς λοιδόρου ἐν οἰκίᾳ κοινῇ — «чем с женой сварливой в доме общем» (λοίδορος — «ругатель, злоречивый»); слав. «во храмине общей со женою клеветливою»."
  25: "ὕδωρ ψυχρὸν ψυχῇ διψώσῃ προσηνές — «вода холодная душе жаждущей приятна» (προσηνής — «приятный»); ἀγγελία ἀγαθὴ ἐκ γῆς μακρόθεν — «весть благая из земли издалека»."
  26: "πηγὴν φράσσοι καὶ ὕδατος ἔξοδον λυμαίνοιτο — «заградил бы источник и испортил бы исход воды» (φράσσω — «запирать»; λυμαίνομαι — «портить»); ἄκοσμον δίκαιον πεπτωκέναι ἐνώπιον ἀσεβοῦς — «непристойно праведнику пасть пред нечестивым» (ἄκοσμος — «неприличный, бесчинный»); слав. «не лепо праведнику пасти пред нечестивым»."
  27: "ἐσθίειν μέλι πολὺ οὐ καλόν — «есть мёд много нехорошо»; τιμᾶν δὲ χρὴ λόγους ἐνδόξους — «чтить же должно слова славные» (ἔνδοξος — «славный»); слав. «почитати же подобает словеса славна». Синодальный иной («домогаться славы не есть слава»)."
  28: "πόλις τὰ τείχη καταβεβλημένη καὶ ἀτείχιστος — «город, стены которого низвергнуты и без стен» (καταβάλλω — «низвергать»; ἀτείχιστος — «безстенный»); ἀνὴρ ὃς οὐ μετὰ βουλῆς τι πράσσει — «муж, который без совета что-либо делает»."
