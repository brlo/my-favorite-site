# jp-box, Притчи, глава 25. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для гл. 25 нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 25: притчи Соломона, собранные мужами Езекии (1); слава Божия и слава царя
# (2–3); очищение серебра и престола (4–5); не величайся пред царём (6–7); тяжба
# с другом (8–10); золотое яблоко (11–12); верный посол (13); ложный дар (14);
# долготерпение и мягкий язык (15); мёд (16); редкий гость (17); лжесвидетель (18);
# путь злого (19); уксус и печаль (20); накорми врага (21–22); северный ветер
# и злой язык (23); сварливая жена (24); добрая весть (25); осквернённый источник (26);
# мёд и слава (27); город без стен (28).
# Прямая речь: 7 (「…」 внутри изречения).
# Нумерация по gr: 28 стихов. Слав. имеет 29: с 21-го стиха нумерация сдвинута на один
# (csl 25:21 — подстих gr 25:20a о моли и черве, он переведён в нашем ст. 20; csl 25:22
# = gr 25:21 и т. д.). Стихи не добавлялись и не дробились.
# В ст. 20 csl содержит «и дым очима», чего нет в gr; по паритету внесено в основной
# текст без 〔…〕.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).

