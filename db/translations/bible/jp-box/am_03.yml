# jp-box, Амос, глава 3. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 3 (совпадает).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1–2 слово к дому Израилеву: «только вас признал Я»; 3–6 цепь
# риторических вопросов о причине и следствии; 7–8 Господь открывает тайну
# пророкам, лев возревел — кто не устрашится; 9–11 призыв к Ассирии и Египту
# смотреть на Самарию: насилие и грабёж, враг окружит; 12–13 остаток Израиля,
# как две голени из львиной пасти; 14–15 жертвенники Вефиля, роги, зимний и
# летний дом, дома из слоновой кости.
# Голоса: 1–8 — речь пророка (в 8 «Господь Бог сказал» — формула внутри);
# 9 — призыв пророка, слова для провозглашения в 「…»; 10 — слово Господа в 「…»
# (формула в конце); 11 — слово Господа в 「…»; 12 — слово Господа в 「…»;
# 13 — призыв пророка в 「…», формула вне; 14–15 — слово Господа в 「…».
# Трудное место 11: LXX/csl обращаются «Тире» (Τύρος), хотя речь о Самарии;
# вероятно, порча — отмечено в notes.
# Термины: 見張り/預言者, 契約 (διαθήκη), 嗣業, 祭壇 (θυσιαστήριον), 角 (κέρατα).
# Имена: イスラエル, エジプト, アッシリア, サマリア, ヤコブ, ベテル, ダマスコ, ツロ.
#
tr_code: jp-box
book: am
chapter: 3
draft: true

verses:
  1: "イスラエルの家[いえ]よ、主[しゅ]があなたがたに、また、エジプトの地[ち]からわたしが導[みちび]き出[だ]したすべての部族[ぶぞく]に対して語[かた]られたこの言葉[ことば]を聞[き]け。"
  2: "地[ち]のすべての部族[ぶぞく]のうちで、わたしが知[し]ったのはあなたがただけである。それゆえ、わたしはあなたがたのすべての罪[つみ]を問[と]い正[ただ]す。"
  3: "二人[ふたり]が約束[やくそく]もなく、ともに歩[あゆ]むだろうか。"
  4: "獅子[しし]が獲物[えもの]もないのに森[もり]でほえるだろうか。若[わか]い獅子[しし]が何[なに]も捕[つか]まえないのに、洞穴[ほらあな]から声[こえ]を出[だ]すだろうか。"
  5: "鳥[とり]を捕[と]る者[もの]もいないのに、鳥が地[ち]の上[うえ]の網[あみ]にかかるだろうか。何[なに]も捕[つか]まえないのに、地[ち]の上のわなが跳[は]ね上[あ]がるだろうか。"
  6: "町[まち]で角笛[つのぶえ]が鳴[な]り響[ひび]いて、民[たみ]が震[ふる]えないことがあるだろうか。主[しゅ]がなさらない災[わざわ]いが、町に起[お]こることがあるだろうか。"
  7: "まことに、主[しゅ]である神[かみ]は、ご自分[じぶん]の計画[けいかく]をその僕[しもべ]である預言者[よげんしゃ]たちに明[あ]かさないかぎり、何[なに]もなさらない。"
  8: "獅子[しし]がほえれば、だれが恐[おそ]れないだろうか。主[しゅ]である神[かみ]が語[かた]られれば、だれが預言[よげん]しないだろうか。"
  9: "アッシリアの地[ち]の国[くに]々[くに]とエジプトの国々に告[つ]げ知[し]らせ、言[い]え。「サマリアの山[やま]に集[あつ]まり、その中[なか]の多[おお]くの恐[おそ]ろしいことと、その中で行[おこな]われている虐政[ぎゃくせい]を見[み]よ。」"
  10: "主[しゅ]は言[い]われる。「彼らは正[ただ]しいことを行[おこな]うことを知[し]らず、自分[じぶん]たちの国[くに]々[くに]に不法[ふほう]と災[わざわ]いを蓄[たくわ]えている。」"
  11: "それゆえ、主[しゅ]である神[かみ]はこう言[い]われる。「ツロよ、あなたの周[まわ]りの地[ち]は荒[あ]れ果[は]て、あなたから力[ちから]を奪[うば]い去[さ]り、あなたの国[くに]々[くに]は奪[うば]い尽[つ]くされる。」"
  12: "主[しゅ]はこう言[い]われる。「羊飼[ひつじか]いが獅子[しし]の口[くち]から二本[にほん]の脚[あし]や耳[みみ]の一片[いっぺん]を引[ひ]き出[だ]すように、サマリアに住[す]むイスラエルの子[こ]らは、部族[ぶぞく]の前[まえ]にいる者[もの]も、ダマスコにいる者[もの]も、かろうじて引き出される。」"
  13: "「ヤコブの家[いえ]よ、聞[き]け、証[あかし]せよ。」と主[しゅ]である神[かみ]、全能者[ぜんのうしゃ]は言[い]われる。"
  14: "「わたしがイスラエルの背[そむ]きを彼の上[うえ]に問[と]い正[ただ]すその日[ひ]、わたしはベテルの祭壇[さいだん]をも問い正す。祭壇[さいだん]の角[つの]は打[う]ち砕[くだ]かれ、地[ち]に落[お]ちる。"
  15: "わたしは冬[ふゆ]の家[いえ]と夏[なつ]の家を打[う]ち、象牙[ぞうげ]の家は滅[ほろ]び、多く[おおく]の家もまた失[うしな]われる。」と主[しゅ]は言[い]われる。"

notes:
  1: "Ἀκούσατε τὸν λόγον τοῦτον, ὃν ἐλάλησεν κύριος ἐφ' ὑμᾶς, οἶκος Ισραηλ — «слушайте слово сие, которое изрёк Господь на вас, дом Израилев» (ἐπί + вин. — «против/на»); καὶ κατὰ πάσης φυλῆς, ἧς ἀνήγαγον ἐκ γῆς Αἰγύπτου — «и против всякого племени, которое Я вывел из земли Египетской» (φυλή — 部族; ἀνάγω — выводить)."
  2: "Πλὴν ὑμᾶς ἔγνων ἐκ πασῶν φυλῶν τῆς γῆς — «только вас Я узнал (признал) из всех племён земли» (πλήν — только; γινώσκω — знать/избрать); διὰ τοῦτο ἐκδικήσω ἐφ' ὑμᾶς πάσας τὰς ἁμαρτίας ὑμῶν — «потому взыщу с вас все грехи ваши» (ἐκδικέω — взыскивать, 問い正す; ἁμαρτία — 罪)."
  3: "εἰ πορεύσονται δύο ἐπὶ τὸ αὐτὸ καθόλου ἐὰν μὴ γνωρίσωσιν ἑαυτούς — «пойдут ли двое вместе, если не познают (не сговорятся) друг с другом» (καθόλου — вообще; γνωρίζω — узнавать/договариваться). Риторический ряд 3–6 — речь пророка, без кавычек."
  4: "εἰ ἐρεύξεται λέων ἐκ τοῦ δρυμοῦ αὐτοῦ θήραν οὐκ ἔχων — «заревёт ли лев из дубравы своей, не имея добычи» (ἐρεύγομαι — реветь, ほえる; δρυμός — дубрава, 森; θήρα — добыча, 獲物); εἰ δώσει σκύμνος φωνὴν αὐτοῦ ἐκ τῆς μάνδρας αὐτοῦ — «подаст ли львёнок голос свой из логова своего» (σκύμνος — 若い獅子; μάνδρα — загон/логовище, 洞穴); ἐὰν μὴ ἁρπάσῃ τι — «если не схватит чего» (ἁρπάζω — хватать)."
  5: "εἰ πεσεῖται ὄρνεον ἐπὶ τὴν γῆν ἄνευ ἰξευτοῦ — «упадёт ли птица на землю без птицелова» (ὄρνεον — птица, 鳥; ἰξευτής — птицелов, 鳥を捕る者); εἰ σχασθήσεται παγὶς ἐπὶ τῆς γῆς ἄνευ τοῦ συλλαβεῖν τι — «раскроется ли петля на земле, если ничего не поймала» (σχάω — разверзать; παγίς — сеть/петля, 網/わな; συλλαμβάνω — ловить)."
  6: "εἰ φωνήσει σάλπιγξ ἐν πόλει καὶ λαὸς οὐ πτοηθήσεται — «затрубит ли труба в городе, и народ не испугается» (πτοέω — устрашать, 震える); εἰ ἔσται κακία ἐν πόλει ἣν κύριος οὐκ ἐποίησεν — «будет ли бедствие в городе, которого Господь не сделал» (κακία — бедствие/зло, 災い)."
  7: "διότι οὐ μὴ ποιήσῃ κύριος ὁ θεὸς πρᾶγμα — «ибо не сделает Господь Бог дела» (πρᾶγμα — дело); ἐὰν μὴ ἀποκαλύψῃ παιδείαν αὐτοῦ πρὸς τοὺς δούλους αὐτοῦ τοὺς προφήτας — «если не откроет наставления (наказания) Своего рабам Своим, пророкам» (ἀποκαλύπτω — открывать; παιδεία — наставление/наказание, csl «наказание»; ru «тайну» — МТ, не внесено; передано 計画)."
  8: "λέων ἐρεύξεται, καὶ τίς οὐ φοβηθήσεται — «лев заревёт, и кто не устрашится» (φοβέομαι — бояться, 恐れる); κύριος ὁ θεὸς ἐλάλησεν, καὶ τίς οὐ προφητεύσει — «Господь Бог сказал, и кто не будет пророчествовать» (προφητεύω — 預言する)."
  9: "Ἀπαγγείλατε χώραις ἐν Ἀσσυρίοις — «возвестите странам в Ассирии» (χώρα — страна/область, 国々; csl «во ассирианех»); ἐπὶ τὰς χώρας τῆς Αἰγύπτου — «странам Египта»; Συνάχθητε ἐπὶ τὸ ὄρος Σαμαρείας καὶ ἴδετε — «соберитесь на гору Самарийскую и смотрите» (招集; サマリア); θαυμαστὰ πολλὰ ἐν μέσῳ αὐτῆς — «многие ужасные (чудесные) вещи среди неё» (θαυμαστός — дивный/ужасный, 恐ろしいこと; csl «чудесная многа»); τὴν καταδυναστείαν τὴν ἐν αὐτῇ — «притеснение (насилие) в ней» (καταδυναστεία — 虐政). В ru (МТ) «на кровлях в Азоте» — иное чтение, не внесено."
  10: "καὶ οὐκ ἔγνω ἃ ἔσται ἐναντίον αὐτῆς — «и не познали, что будет против неё» (γινώσκω — знать); οἱ θησαυρίζοντες ἀδικίαν καὶ ταλαιπωρίαν ἐν ταῖς χώραις αὐτῶν — «собирающие в сокровищницы неправду и бедствие в странах своих» (θησαυρίζω — копить, 蓄える; ἀδικία — 不法; ταλαιπωρία — бедствие, 災い)."
  11: "διὰ τοῦτο τάδε λέγει κύριος ὁ θεός — «посему так говорит Господь Бог»; Τύρος, κυκλόθεν ἡ γῆ σου ἐρημωθήσεται — «Тир, окрест земля твоя опустеет» (Τύρος — ツロ; обращение к Тиру в LXX и csl, хотя речь о Самарии; вероятно, порча текста — в МТ/ru «неприятель»); κατάξει ἐκ σοῦ ἰσχύν σου — «низведёт из тебя крепость твою» (κατάγω — сводить; ἰσχύς — 力); διαρπαγήσονται αἱ χῶραί σου — «разграблены будут страны твои» (διαρπάζω — разграбить, 奪い尽くす)."
  12: "Ὃν τρόπον ὅταν ἐκσπάσῃ ὁ ποιμὴν ἐκ στόματος τοῦ λέοντος δύο σκέλη ἢ λοβὸν ὠτίου — «как когда пастух исторгнет из пасти льва две голени или часть уха» (ἐκσπάω — вырывать; σκέλος — голень, 脚; λοβός — кусок/мочка, 一片; ὠτίον — ухо); οὕτως ἐκσπασθήσονται οἱ υἱοὶ Ισραηλ οἱ κατοικοῦντες ἐν Σαμαρείᾳ — «так исторгнуты будут сыны Израилевы, живущие в Самарии»; κατέναντι φυλῆς καὶ ἐν Δαμασκῷ ἱερεῖς — «напротив племени и в Дамаске жрецы» — тёмное место (κατέναντι — напротив; φυλή — 部族; ἱερεῖς — 祭司); csl «прямо племене и в дамасце» без «жрецы»; ru «в углу постели и в Дамаске на ложе» — МТ, не внесено. Передано «部族の前にいる者も、ダマスコにいる者も、かろうじて»."
  13: "ἀκούσατε καὶ ἐπιμαρτύρασθε τῷ οἴκῳ Ιακωβ — «слушайте и засвидетельствуйте дому Иакова» (ἐπιμαρτύρομαι — свидетельствовать, 証しする); λέγει κύριος ὁ θεὸς ὁ παντοκράτωρ — «говорит Господь Бог Вседержитель» (παντοκράτωρ — 全能者). Слав. добавляет в начале «Жерцы» — в LXX нет, не внесено."
  14: "ἐν τῇ ἡμέρᾳ, ὅταν ἐκδικῶ ἀσεβείας τοῦ Ισραηλ ἐπ' αὐτόν — «в день, когда взыщу нечестия Израиля на нём» (ἐκδικέω — взыскивать); ἐκδικήσω ἐπὶ τὰ θυσιαστήρια Βαιθηλ — «взыщу на жертвенниках Вефиля» (θυσιαστήριον — 祭壇; Βαιθηλ — ベテル); κατασκαφήσεται τὰ κέρατα τοῦ θυσιαστηρίου — «раскопаны (снесены) будут роги жертвенника» (κέρας — рог, 角; κατασκάπτω — разрушать); πεσοῦνται ἐπὶ τὴν γῆν — «падут на землю»."
  15: "συγχεῶ καὶ πατάξω τὸν οἶκον τὸν περίπτερον ἐπὶ τὸν οἶκον τὸν θερινόν — «сокрушу и поражу дом с колоннадой (крытым ходом) вместе с домом летним» (περίπτερος — окружённый колоннами, csl «с преклеты», 柱廊; θερινός — летний, 夏の家); ἀπολοῦνται οἶκοι ἐλεφάντινοι — «погибнут дома из слоновой кости» (ἐλεφάντινος — 象牙の); προστεθήσονται οἶκοι ἕτεροι πολλοί — «прибавятся многие другие домы» (προστίθημι — прибавлять, 失われる)."
