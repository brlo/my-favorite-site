# jp-box, Амос, глава 1. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 1 (совпадает).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1 надписание: Амос из пастухов Фекойских, за два года до землетрясения;
# 2 явление Господа с Сиона, плач пажитей; 3–5 Дамаск; 6–8 Газа; 9–10 Тир;
# 11–12 Едом; 13–15 Аммон. Суд над народами за жестокость; Израиль будет судим
# в следующей главе.
# Голоса: 2 — речь пророка («И сказал он»), прямая речь Бога не вводится; 3–15 —
# оракулы: формула «так говорит Господь» вне кавычек, слово Господа в 「…»,
# закрывается перед «говорит Господь». В каждом оракуле — рефрен:
# 「…の三つの罪、いや四つの罪のゆえに、わたしはその裁きを取り消さない」.
# Термины: 罪 (ἀσέβεια), 裁きを取り消す (οὐκ ἀποστραφήσομαι), 捕囚 (αἰχμαλωσία),
# 城壁 (τεῖχος), 基 (θεμέλια), 部族 (φυλή), 王笏 — нет: в LXX φυλή.
# Имена: アモス, テコア, ウジヤ, ヤロブアム, ヨアシュ, ダマスコ, ハザエル, アデル,
# ギレアデ, ガザ, アシュドド, アシュケロン, エクロン, ペリシテ, ツロ, エドム,
# テマン, ボツラ, アンモン, ラバ.
#
tr_code: jp-box
book: am
chapter: 1
draft: true

verses:
  1: "テコアの牧者[ぼくしゃ]のうちにいたアモスの言葉[ことば]。彼[かれ]がエルサレムについて見[み]たもの、すなわち、ユダの王[おう]ウジヤの時代[じだい]、イスラエルの王[おう]、ヨアシュの子[こ]ヤロブアムの時代、地震[じしん]の二年前[にねんまえ]のことである。"
  2: "彼[かれ]は言[い]った。主[しゅ]はシオンからとどろき、エルサレムから声[こえ]を出[だ]される。牧者[ぼくしゃ]たちの牧[まき]場[ば]は嘆[なげ]き、カルメルの頂[いただき]は枯[か]れる。"
  3: "主[しゅ]はこう言[い]われる。「ダマスコの三[みっ]つの罪[つみ]、いや四[よっ]つの罪のゆえに、わたしはその裁[さば]きを取[と]り消[け]さない。彼らが鉄[てつ]ののこぎりでギレアデの妊婦[にんぷ]たちを挽[ひ]き裂[さ]いたからである。"
  4: "わたしはハザエルの家[いえ]に火[ひ]を送[おく]り、それはアデルの子[こ]の基[もとい]を食[く]い尽[つ]くす。"
  5: "わたしはダマスコのかんぬきを砕[くだ]き、オンの野[の]に住[す]む者[もの]を滅[ほろ]ぼし、ハルランの男[おとこ]たちのうちから一[ひと]つの部族[ぶぞく]を断[た]ち切[き]る。シリアの民[たみ]は捕囚[ほしゅう]となって連[つ]れて行[い]かれる。」と主[しゅ]は言[い]われる。"
  6: "主[しゅ]はこう言[い]われる。「ガザの三[みっ]つの罪[つみ]、いや四[よっ]つの罪のゆえに、わたしはその裁[さば]きを取[と]り消[け]さない。彼らがすべての者[もの]を捕囚[ほしゅう]として連[つ]れ去[さ]り、エドムに引[ひ]き渡[わた]したからである。"
  7: "わたしはガザの城壁[じょうへき]に火[ひ]を送[おく]り、それはその基[もとい]を食[く]い尽[つ]くす。"
  8: "わたしはアシュドドから住[す]む者[もの]を滅[ほろ]ぼし、アシュケロンから一[ひと]つの部族[ぶぞく]を断[た]ち切[き]る。わたしの手[て]をエクロンに及[およ]ぼすと、ペリシテ人[じん]の残[のこ]りの者[もの]は滅びる。」と主[しゅ]は言[い]われる。"
  9: "主[しゅ]はこう言[い]われる。「ツロの三[みっ]つの罪[つみ]、いや四[よっ]つの罪のゆえに、わたしはその裁[さば]きを取[と]り消[け]さない。彼らがすべての者[もの]を捕囚[ほしゅう]としてエドムに引[ひ]き渡[わた]し、兄弟[きょうだい]の契約[けいやく]を思[おも]い起[おこ]さなかったからである。"
  10: "わたしはツロの城壁[じょうへき]に火[ひ]を送[おく]り、それはその基[もとい]を食[く]い尽[つ]くす。」と主[しゅ]は言[い]われる。"
  11: "主[しゅ]はこう言[い]われる。「エドムの三[みっ]つの罪[つみ]、いや四[よっ]つの罪のゆえに、わたしはその裁[さば]きを取[と]り消[け]さない。彼が剣[つるぎ]をもって兄弟[きょうだい]を追[お]い、地[ち]の上[うえ]で母[はは]の胎[たい]を傷[きず]つけ、その恐[おそ]ろしい怒[いか]りを証[あかし]として抱[だ]き続[つづ]け、その激[はげ]しい怒りを絶[た]やさずに保[たも]ったからである。"
  12: "わたしはテマンに火[ひ]を送[おく]り、それはボツラの城壁[じょうへき]の基[もとい]を食[く]い尽[つ]くす。」と主[しゅ]は言[い]われる。"
  13: "主[しゅ]はこう言[い]われる。「アンモンの子[こ]らに三[みっ]つの罪[つみ]、いや四[よっ]つの罪のゆえに、わたしはその裁[さば]きを取[と]り消[け]さない。彼らが自分[じぶん]たちの国境[こっきょう]を広[ひろ]げるために、ギレアデの妊婦[にんぷ]たちの腹[はら]を裂[さ]いたからである。"
  14: "わたしはラバの城壁[じょうへき]に火[ひ]を点[つ]け、それは戦[いくさ]の日[ひ]の叫[さけ]びとともに、その基[もとい]を食[く]い尽[つ]くす。それはその終[お]わりの日[ひ]に震[ふる]え動[うご]く。"
  15: "彼らの王[おう]たちは捕囚[ほしゅう]となり、その祭司[さいし]たちと君[きみ]たちもともに連[つ]れて行[い]かれる。」と主[しゅ]は言[い]われる。"

notes:
  1: "Λόγοι Αμως — «слова Амоса» (надписание); οἳ ἐγένοντο ἐν νακκαριμ ἐκ Θεκουε — «которые были в наккарим из Фекои»: ἐν νακκαριμ — транслитерация евр. נֹקְדִים «пастухи» (ср. 4 Цар 3:4, где נֹקֵד — «пастух»), поэтому 牧者のうちにいた; csl «в кариафиариме» — понято как Кириаф-Иарим, иное чтение; ru «из пастухов Фекойских» — по МТ. οὓς εἶδεν ὑπὲρ Ιερουσαλημ — «которые он видел об Иерусалиме» (csl «о Иерусалиме»; в МТ/ru «об Израиле» — не внесено). ἐν ἡμέραις Οζιου… Ιεροβοαμ τοῦ Ιωας — «во дни Озии… Иеровоама, сына Иоасова» (ウジヤ, ヤロブアム, ヨアシュ — формы корпуса); πρὸ δύο ἐτῶν τοῦ σεισμοῦ — «за два года до землетрясения» (地震)."
  2: "Καὶ εἶπεν — «и сказал он» (Амос; прямая речь Бога не вводится формулой). Κύριος ἐκ Σιων ἐφθέγξατο — «Господь от Сиона возглаголал (возгремел)» (φθέγγομαι — издавать голос, とどろく); ἐξ Ιερουσαλημ ἔδωκεν φωνὴν αὐτοῦ — «из Иерусалима дал голос Свой»; ἐπένθησαν αἱ νομαὶ τῶν ποιμένων — «восплакали пажити пастухов» (νομή — пастбище, 牧場); ἐξηράνθη ἡ κορυφὴ τοῦ Καρμήλου — «иссохла вершина Кармила» (カルメル)."
  3: "Формула «так говорит Господь» вне кавычек; далее слово Господа. Ἐπὶ ταῖς τρισὶν ἀσεβείαις Δαμασκοῦ καὶ ἐπὶ ταῖς τέσσαρσιν — «за три нечестия Дамаска и за четыре» (ἀσέβεια — нечестие, 罪; числительное-рефрен); οὐκ ἀποστραφήσομαι αὐτόν — «не отвращусь его», т.е. не отменю приговор (裁きを取り消さない); ἀνθ' ὧν ἔπριζον πρίοσιν σιδηροῖς τὰς ἐν γαστρὶ ἐχούσας τῶν ἐν Γαλααδ — «за то, что пилили железными пилами беременных в Галааде» (πρίζω — пилить, 挽き裂く; γαστήρ — чрево, 妊婦). В ru (МТ) «молотили железными молотилами» — иное чтение, не внесено."
  4: "ἐξαποστελῶ πῦρ εἰς τὸν οἶκον Αζαηλ — «пошлю огонь в дом Азаила» (Αζαηλ — ハザエル, форма корпуса по 3–4 Цар; слав. «азаиль»); καταφάγεται θεμέλια υἱοῦ Αδερ — «поест основания сына Адера» (θεμέλια — 基; Αδερ — アデル, как в Иер 49:27; в МТ/ru «чертоги Венадада» — не внесено)."
  5: "συντρίψω μοχλοὺς Δαμασκοῦ — «сокрушу засовы Дамаска» (μοχλός — засов, かんぬき; csl «вереи»); ἐξολεθρεύσω κατοικοῦντας ἐκ πεδίου Ων — «истреблю жителей с поля Он» (Ων — Авен? слав. «с поля онова»; オンの野); κατακόψω φυλὴν ἐξ ἀνδρῶν Χαρραν — «посеку племя из мужей Харрана» (φυλή — племя, 部族; Χαρραν — ハルラン; в МТ/ru «держащего скипетр из дома Еденова» — не внесено); αἰχμαλωτευθήσεται λαὸς Συρίας ἐπίκλητος — «пленён будет народ Сирии именитый» (ἐπίκλητος — знатный/наречённый, 名ある; в МТ/ru «в Кир» — не внесено)."
  6: "Ἐπὶ ταῖς τρισὶν ἀσεβείαις Γάζης — «за три нечестия Газы» (ガザ); ἕνεκεν τοῦ αἰχμαλωτεῦσαι αὐτοὺς αἰχμαλωσίαν τοῦ Σαλωμων — «за то, что они увели в плен пленение Салмона» (τοῦ Σαλωμων — транслитерация евр. שְׁלֵמִים «совершенный/целый плен»; csl «пленение соломоне»; ru «вывели всех в плен»); τοῦ συγκλεῖσαι εἰς τὴν Ιδουμαίαν — «чтобы заключить в Идумею» (συγκλείω — запирать, передавать; エドム)."
  7: "ἐξαποστελῶ πῦρ ἐπὶ τὰ τείχη Γάζης — «пошлю огонь на стены Газы» (τεῖχος — 城壁); καταφάγεται θεμέλια αὐτῆς — «поест основания её» (θεμέλια — 基)."
  8: "ἐξολεθρεύσω κατοικοῦντας ἐξ Ἀζώτου — «истреблю жителей Азота» (Ἀζωτος — アシュドド, форма корпуса, ср. 1 Цар 5); ἐξαρθήσεται φυλὴ ἐξ Ἀσκαλῶνος — «извержется племя из Аскалона» (φυλή — 部族; Ἀσκαλών — アシュケロン, форма корпуса); ἐπάξω τὴν χεῖρά μου ἐπὶ Ακκαρων — «наведу руку Мою на Аккарон» (Ακκαρων — エクロン, форма корпуса); ἀπολοῦνται οἱ κατάλοιποι τῶν ἀλλοφύλων — «погибнут остатки иноплеменников» (ἀλλόφυλοι — ペリシテ人 по корпусу)."
  9: "Ἐπὶ ταῖς τρισὶν ἀσεβείαις Τύρου — «за три нечестия Тира» (ツロ); συνέκλεισαν αἰχμαλωσίαν τοῦ Σαλωμων εἰς τὴν Ιδουμαίαν — «заключили пленение Салмона в Идумею»; οὐκ ἐμνήσθησαν διαθήκης ἀδελφῶν — «не вспомнили завета братьев» (διαθήκη — 契約; ἀδελφῶν — братского союза, 兄弟の契約)."
  10: "ἐξαποστελῶ πῦρ ἐπὶ τὰ τείχη Τύρου — «пошлю огонь на стены Тира»; καταφάγεται θεμέλια αὐτῆς — «поест основания её»."
  11: "Ἐπὶ ταῖς τρισὶν ἀσεβείαις τῆς Ιδουμαίας — «за три нечестия Идумеи» (エドム); ἕνεκα τοῦ διῶξαι αὐτοὺς ἐν ῥομφαίᾳ τὸν ἀδελφὸν αὐτοῦ — «за то, что они гнали брата своего мечом» (διώκω — преследовать, 追う); ἐλυμήνατο μήτραν ἐπὶ γῆς — «повредил утробу на земле» (λυμαίνομαι — губить; μήτρα — чрево/материнство; 母の胎を傷つけ); ἥρπασεν εἰς μαρτύριον φρίκην αὐτοῦ — «восхитил в свидетельство ужас свой» (ἁρπάζω — похищать; μαρτύριον — 証; φρίκη — ужас; тёмное место, передано «怒りを証として抱き続け»); τὸ ὅρμημα αὐτοῦ ἐφύλαξεν εἰς νεῖκος — «стремление своё сохранил на победу/вражду» (ὅρμημα — порыв; νεῖκος — вражда/победа, csl «на победу»). В ru (МТ) «подавил чувства родства… сохранял ярость» — иное чтение."
  12: "ἐξαποστελῶ πῦρ εἰς Θαιμαν — «пошлю огонь в Феман» (Θαιμαν — テマン); καταφάγεται θεμέλια τειχέων αὐτῆς — «поест основания стен его» (csl «ограды его»; в МТ/ru «чертоги Восора» — не внесено, имя Босры в LXX здесь отсутствует)."
  13: "Ἐπὶ ταῖς τρισὶν ἀσεβείαις υἱῶν Αμμων — «за три нечестия сынов Аммона» (アンモン); ἀνέσχιζον τὰς ἐν γαστρὶ ἐχούσας τῶν Γαλααδιτῶν — «рассекали беременных Галаадитян» (ἀνασχίζω — разрывать, 腹を裂く); ὅπως ἐμπλατύνωσιν τὰ ὅρια αὐτῶν — «чтобы расширить пределы свои» (ἐμπλατύνω — расширять; ὅρια — 国境)."
  14: "ἀνάψω πῦρ ἐπὶ τὰ τείχη Ραββα — «зажгу огонь на стенах Раввы» (Ραββα — ラバ); καταφάγεται θεμέλια αὐτῆς μετὰ κραυγῆς ἐν ἡμέρᾳ πολέμου — «поест основания её с воплем в день войны» (κραυγή — 叫び); σεισθήσεται ἐν ἡμέρᾳ συντελείας αὐτῆς — «потрясётся в день кончины своей» (συντέλεια — конец, 終わり)."
  15: "πορεύσονται οἱ βασιλεῖς αὐτῆς ἐν αἰχμαλωσίᾳ — «пойдут цари её в плен» (βασιλεῖς — мн. ч.; в ru ед. ч. «царь» — МТ); οἱ ἱερεῖς αὐτῶν καὶ οἱ ἄρχοντες αὐτῶν ἐπὶ τὸ αὐτό — «жрецы их и князья их вместе» (祭司, 君たち)."
