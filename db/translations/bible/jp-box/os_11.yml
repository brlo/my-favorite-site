chapter: 11
draft: true

verses:
  1: "「イスラエルは幼[おさな]い子[こ]であった。わたしは彼を愛[あい]し、エジプトから彼の子[こ]らを呼[よ]び出[だ]した。"
  2: "わたしが彼らを呼[よ]ぶほどに、彼らはわたしの前[まえ]から去[さ]って行[い]った。彼らはバアルにいけにえをささげ、刻[きざ]んだ像[ぞう]に香[こう]をたいた。"
  3: "わたしはエフライムをわたし自身[じしん]に結[むす]びつけ、彼をわたしの腕[うで]に抱[だ]き上[あ]げた。しかし、彼らはわたしが彼らを癒[いや]したことを知[し]らなかった。"
  4: "わたしは人間[にんげん]の朽[くち]る縄[なわ]をもって、わたしの愛[あい]のきずなで彼らを引[ひ]き寄[よ]せた。わたしは彼らにとって、その頬[ほお]を打[う]つ人[ひと]のようになり、彼を顧[かえり]みて、彼を強[つよ]くする。"
  5: "エフライムはエジプトに住[す]み、アッシリアが彼の王[おう]となった。彼が帰[かえ]ることを望[のぞ]まなかったからである。"
  6: "剣[つるぎ]はその都[みやこ]々[みやこ]で力[ちから]を失[うしな]い、彼の手[て]の中[なか]で休[やす]まった。彼らは自分[じぶん]の企[たくら]みの実[み]を食[く]べる。"
  7: "わたしの民[たみ]は自分[じぶん]の住[す]まいから離[はな]れようとぶら下がっている。神[かみ]はその尊[とうと]いものに怒[いか]り、彼を高[たか]く上[あ]げることはない。"
  8: "エフライムよ、わたしはあなたをどうしようか。イスラエルよ、わたしはあなたをかばうべきか。あなたをどうしようか。あなたをアダマのように、セボイムのようにしようか。わたしの心[こころ]はわたしの中[なか]で変[か]わり、わたしの悔[く]いはかき乱[みだ]された。"
  9: "わたしは自分[じぶん]の激[はげ]しい怒[いか]りに従[したが]って行[おこな]わない。エフライムを消[け]し去[さ]るままにはしない。わたしは神[かみ]であって、人[ひと]ではないからである。あなたの中[なか]に聖[せい]なる者[もの]がおられ、わたしは都[みやこ]に入[はい]らない。"
  10: "彼らは主[しゅ]の後[あと]に従[したが]って行[い]く。主[しゅ]は獅子[しし]のようにほえる。主[しゅ]がほえると、水[みず]の子[こ]らは恐[おそ]れおののく。"
  11: "彼らはエジプトから鳥[とり]のように、アッシリアの地[ち]から鳩[はと]のように飛[と]んで来[く]る。わたしは彼らをその家[いえ]に帰[かえ]らせる、と主[しゅ]は言[い]われる」。"
  12: "「エフライムは偽[いつわ]りでわたしを囲[かこ]み、イスラエルの家[いえ]とユダは不敬[ふけい]で囲[かこ]んだ。今[いま]、神[かみ]は彼らを知[し]り、彼らは神[かみ]の聖[せい]なる民[たみ]と呼[よ]ばれる。"

notes:
  1: "Διότι νήπιος Ισραηλ — «ибо Израиль — младенец» (νήπιος — дитя, 幼い子); ἐγὼ ἠγάπησα αὐτὸν — «Я возлюбил его»; ἐξ Αἰγύπτου μετεκάλεσα τὰ τέκνα αὐτοῦ — «из Египта воззвал детей его» (μετακαλέω — призывать). В csl 11:1 спереди стоит конец евр. 10:15 («Заутра отвергошася, отвержеся царь израилев»); в LXX эти слова уже в 10:15 («ὄρθρου ἀπερρίφησαν»), поэтому здесь не повторены."
  2: "καθὼς μετεκάλεσα αὐτούς, οὕτως ἀπῴχοντο ἐκ προσώπου μου — «как Я призывал их, так они отходили от лица Моего» (ἀποίχομαι); τοῖς Βααλιμ ἔθυον — «Ваалам жертвы приносили» (θύω); τοῖς γλυπτοῖς ἐθυμίων — «истуканам кадили» (γλυπτός — изваянный; θυμιάω — кадить)."
  3: "συνεπόδισα τὸν Εφραιμ — «Я связал (сплёл ноги) Ефрема» (συμποδίζω; слав. «связах ефрема»; в ru «приучал ходить» — иное понимание); ἀνέλαβον αὐτὸν ἐπὶ τὸν βραχίονά μου — «взял его на мышцу Мою (на руки)»; οὐκ ἔγνωσαν ὅτι ἴαμαι αὐτούς — «не познали, что Я исцеляю их» (ἰάομαι)."
  4: "ἐν διαφθορᾷ ἀνθρώπων ἐξέτεινα αὐτοὺς ἐν δεσμοῖς ἀγαπήσεώς μου — «в тлении (немощи) человеческом простёр их узами любви Моей» (διαφθορά — тление; δεσμός — узы; слав. «во истлении человечесте привлекох я узами любления моего»); ἔσομαι αὐτοῖς ὡς ῥαπίζων ἄνθρωπος ἐπὶ τὰς σιαγόνας αὐτοῦ — «буду им как человек, бьющий по щекам его» (ῥαπίζω — бить; σιαγών — челюсть; тёмное место, в евр. «поднимающий ярмо с челюстей»); ἐπιβλέψομαι πρός αὐτόν, δυνήσομαι αὐτῷ — «воззрю на него, премогу (укреплю) ему» (слав. «премогу ему»)."
  5: "κατῴκησεν Εφραιμ ἐν Αἰγύπτῳ — «поселился Ефрем в Египте» (κατοικέω); Ασσουρ αὐτὸς βασιλεὺς αὐτοῦ — «Ассур — он царь его»; ὅτι οὐκ ἠθέλησεν ἐπιστρέψαι — «ибо не захотел обратиться» (ἐπιστρέφω)."
  6: "ἠσθένησεν ῥομφαία ἐν ταῖς πόλεσιν αὐτοῦ — «изнемог меч в городах его» (ἀσθενέω); κατέπαυσεν ἐν ταῖς χερσὶν αὐτοῦ — «и успокоился (умолк) в руках его» (καταπαύω); φάγονται ἐκ τῶν διαβουλίων αὐτῶν — «съедят от умышлений своих» (διαβούλιον — замысел; смысл тёмный, слав. «снедят от умышлений своих»)."
  7: "ὁ λαὸς αὐτοῦ ἐπικρεμάμενος ἐκ τῆς κατοικίας αὐτοῦ — «народ его висит (держится) от жилища своего» (ἐπικρέμαμαι — висеть над; тёмное место, слав. «висяще от обитания своего»); ὁ θεὸς ἐπὶ τὰ τίμια αὐτοῦ θυμωθήσεται — «Бог на драгоценности его разгневается» (τίμιος — ценный, 尊い); οὐ μὴ ὑψώσῃ αὐτόν — «и не возвысит его»."
  8: "τί σε διαθῶ, Εφραιμ — «что Мне сделать тебе, Ефрем?» (διατίθημι — устраивать, распоряжаться); ὑπερασπιῶ σου — «защищу ли тебя?» (ὑπερασπίζω — прикрывать щитом); ὡς Αδαμα θήσομαί σε καὶ ὡς Σεβωιμ — «как Адаму сделаю тебя и как Севоим» (Адама и Севоим — города погибели, ср. Втор 29:23); μετεστράφη ἡ καρδία μου ἐν τῷ αὐτῷ — «переменилось сердце Моё во Мне» (μεταστρέφω); συνεταράχθη ἡ μεταμέλειά μου — «смутилась жалость (раскаяние) Моя» (μεταμέλεια; слав. «смятеся раскаяние мое»)."
  9: "οὐ μὴ ποιήσω κατὰ τὴν ὀργὴν τοῦ θυμοῦ μου — «не сделаю по ярости гнева Моего»; οὐ μὴ ἐγκαταλίπω τοῦ ἐξαλειφθῆναι τὸν Εφραιμ — «не оставлю, чтобы истребить Ефрема» (ἐξαλείφω — стирать); θεὸς ἐγώ εἰμι καὶ οὐκ ἄνθρωπος — «ибо Я Бог, а не человек»; ἐν σοὶ ἅγιος — «в тебе Святый»; οὐκ εἰσελεύσομαι εἰς πόλιν — «не войду в город»."
  10: "ὀπίσω κυρίου πορεύσομαι — «за Господом пойдут» (ὀπίσω — вслед); ὡς λέων ἐρεύξεται — «как лев заревёт» (ἐρεύγομαι — рычать); αὐτὸς ὠρύσεται — «Он возревет» (ὠρύομαι); ἐκστήσονται τέκνα ὑδάτων — «ужаснутся дети вод» (ἐξίστημι; τέκνα ὑδάτων — «сыны вод»; в ru/МТ «сыны с запада» — тёмное место)."
  11: "ἐκστήσονται ὡς ὄρνεον ἐξ Αἰγύπτου — «ужаснутся (прилетят) как птица из Египта» (ὄρνεον — птица); ὡς περιστερά ἐκ γῆς Ἀσσυρίων — «как голубь из земли Ассирийской» (περιστερά — 鳩); ἀποκαταστήσω αὐτοὺς εἰς τοὺς οἴκους αὐτῶν — «возвращу (восстановлю) их в домы их» (ἀποκαθίστημι); λέγει κύριος — «говорит Господь»."
  12: "Ἐκύκλωσέν με ἐν ψεύδει Εφραιμ — «окружил Меня ложью Ефрем» (κυκλόω — окружать); ἐν ἀσεβείαις οἶκος Ισραηλ καὶ Ιουδα — «и нечестиями дом Израилев и Иуда» (ἀσέβεια); νῦν ἔγνω αὐτοὺς ὁ θεός — «ныне познал их Бог»; λαὸς ἅγιος κεκλήσεται θεοῦ — «народ святой наречётся Божий» (слав. «людие святи прозвашася Богови»). В слав. это 11:12."
