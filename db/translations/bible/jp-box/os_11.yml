# jp-box, Осия, глава 11. Черновик для приёмки.
#
# Нумерация — по славяно-синодальной (см. шапку ниже).
#
# --- прежние заметки (нумерация по гр.) ---
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по gr-lxx-byz (= jp-ni): слав. 11:12 (= наш 12:1) относится уже к 12-й
# главе; слав. 11:1 спереди несёт конец евр. 10:15, в LXX стоящий в 10:15.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: 1–4 «когда Израиль был юн, Я любил его», из Египта воззвал сына,
# узы любви, «не знали, что Я исцеляю их»; 5–7 Ефрем в Египте и под Ассирией, меч
# в городах, народ висит от жилища своего; 8–9 «как поступлю с тобою, Ефрем?»,
# Адама и Севоим, переменилось сердце, «Я Бог, а не человек»; 10–11 за Господом пойдут,
# как лев возревет, птицы из Египта и голуби из Ассирии, возвращение в домы.
# Голоса: 1–11 — одно слово Господа в 「…」 (закрывается в 11).
# 11:3: «συνεπόδισα» — «связал (сплёл ноги)» (слав. «связах»; в ru «приучал ходить»).
# 11:4: «ῥαπίζων ἄνθρωπος ἐπὶ τὰς σιαγόνας» — «человек, бьющий по щекам» (тёмное
# место; в евр. «поднимающий ярмо с челюстей»).
# 11:10: «τέκνα ὑδάτων» — «дети вод» (в ru/МТ «сыны с запада»), оставлено буквально.
#
