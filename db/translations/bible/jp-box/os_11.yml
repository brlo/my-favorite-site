  8: "τί σε διαθῶ, Εφραιμ — «что Мне сделать тебе, Ефрем?» (διατίθημι — устраивать, распоряжаться); ὑπερασπιῶ σου — «защищу ли тебя?» (ὑπερασπίζω — прикрывать щитом); ὡς Αδαμα θήσομαί σε καὶ ὡς Σεβωιμ — «как Адаму сделаю тебя и как Севоим» (Адама и Севоим — города погибели, ср. Втор 29:23); μετεστράφη ἡ καρδία μου ἐν τῷ αὐτῷ — «переменилось сердце Моё во Мне» (μεταστρέφω); συνεταράχθη ἡ μεταμέλειά μου — «смутилась жалость (раскаяние) Моя» (μεταμέλεια; слав. «смятеся раскаяние мое»)."
  9: "οὐ μὴ ποιήσω κατὰ τὴν ὀργὴν τοῦ θυμοῦ μου — «не сделаю по ярости гнева Моего»; οὐ μὴ ἐγκαταλίπω τοῦ ἐξαλειφθῆναι τὸν Εφραιμ — «не оставлю, чтобы истребить Ефрема» (ἐξαλείφω — стирать); θεὸς ἐγώ εἰμι καὶ οὐκ ἄνθρωπος — «ибо Я Бог, а не человек»; ἐν σοὶ ἅγιος — «в тебе Святый»; οὐκ εἰσελεύσομαι εἰς πόλιν — «не войду в город»."
  10: "ὀπίσω κυρίου πορεύσομαι — «за Господом пойдут» (ὀπίσω — вслед); ὡς λέων ἐρεύξεται — «как лев заревёт» (ἐρεύγομαι — рычать); αὐτὸς ὠρύσεται — «Он возревет» (ὠρύομαι); ἐκστήσονται τέκνα ὑδάτων — «ужаснутся дети вод» (ἐξίστημι; τέκνα ὑδάτων — «сыны вод»; в ru/МТ «сыны с запада» — тёмное место)."
  11: "ἐκστήσονται ὡς ὄρνεον ἐξ Αἰγύπτου — «ужаснутся (прилетят) как птица из Египта» (ὄρνεον — птица); ὡς περιστερά ἐκ γῆς Ἀσσυρίων — «как голубь из земли Ассирийской» (περιστερά — 鳩); ἀποκαταστήσω αὐτοὺς εἰς τοὺς οἴκους αὐτῶν — «возвращу (восстановлю) их в домы их» (ἀποκαθίστημι); λέγει κύριος — «говорит Господь»."
  12: "Ἐκύκλωσέν με ἐν ψεύδει Εφραιμ — «окружил Меня ложью Ефрем» (κυκλόω — окружать); ἐν ἀσεβείαις οἶκος Ισραηλ καὶ Ιουδα — «и нечестиями дом Израилев и Иуда» (ἀσέβεια); νῦν ἔγνω αὐτοὺς ὁ θεός — «ныне познал их Бог»; λαὸς ἅγιος κεκλήσεται θεοῦ — «народ святой наречётся Божий» (слав. «людие святи прозвашася Богови»). В слав. это 11:12. Цитата закрывается здесь; в следующей главе открывается снова."
