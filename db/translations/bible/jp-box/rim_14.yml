# jp-box, Послание к Римлянам, глава 14. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 14: о пище и днях (1–12), не подавать брату повода (13–23).
# 14:14 — слова Павла о своём убеждении «в Господе Иисусе», не слова Христа.
# Красного и синего нет. jp-ni не использовался.

tr_code: jp-box
book: rim
chapter: 14
draft: true

verses:
  1: "信仰[しんこう]の弱[よわ]い者[もの]を、その意見[いけん]を論[ろん]じ合[あ]うためではなく、受け入[い]れなさい。"
  2: "ある人[ひと]は、何[なに]でも食[た]べてよいと信[しん]じている。しかし、弱[よわ]い者[もの]は野菜[やさい]だけを食[た]べている。"
  3: "食[た]べる者[もの]は、食[た]べない者[もの]を軽[かろ]んじてはならない。食[た]べない者[もの]は、食[た]べる者[もの]を裁[さば]いてはならない。神[かみ]がその人[ひと]を受け入[い]れたからである。"
  4: "あなたは何者[なにもの]なのか。他人[たにん]の僕[しもべ]を裁[さば]くとは。その僕[しもべ]が立[た]つか倒[たお]れるかは、その人[ひと]の主人[しゅじん]にかかっている。そして、その僕[しもべ]は立[た]たされる。主[しゅ]には、その人[ひと]を立[た]たせる力[ちから]があるからである。"
  5: "ある人[ひと]は特定[とくてい]の日[ひ]を他[ほか]の日[ひ]と区別[くべつ]し、ある人[ひと]はどの日[ひ]も同[おな]じだと考[かんが]える。それぞれ、自分[じぶん]の心[こころ]に確信[かくしん]を持[も]つべきである。"
  6: "日[ひ]を重[おも]んじる者[もの]は、主[しゅ]のために重[おも]んじる。〔日[ひ]を重[おも]んじない者[もの]も、主[しゅ]のために重[おも]んじない。〕食[た]べる者[もの]は主[しゅ]のために食[た]べ、神[かみ]に感謝[かんしゃ]する。食[た]べない者[もの]も主[しゅ]のために食[た]べず、神[かみ]に感謝[かんしゃ]する。"
  7: "というのは、わたしたちのうち、だれも自分[じぶん]のために生[い]きず、だれも自分[じぶん]のために死[し]なないからである。"
  8: "わたしたちは、生[い]きるなら主[しゅ]のために生[い]き、死[し]ぬなら主[しゅ]のために死[し]ぬ。だから、生[い]きるにせよ死[し]ぬにせよ、わたしたちは主[しゅ]のものである。"
  9: "というのは、キリストは、死者[ししゃ]にも生[い]ける者[もの]にも主[しゅ]となるために、死[し]んで、また生[い]き返[かえ]られたからである。"
  10: "ところで、あなたはなぜ兄弟[きょうだい]を裁[さば]くのか。また、あなたはなぜ兄弟[きょうだい]を軽[かろ]んじるのか。わたしたちは皆[みな]、神[かみ]の裁[さば]きの座[ざ]の前[まえ]に立[た]つことになるからである。"
  11: "というのは、「わたしは生[い]きている、と主[しゅ]は言[い]われる。すべての膝[ひざ]はわたしに屈[かが]み、すべての舌[した]は神[かみ]に告白[こくはく]する」と書[か]いてあるからである。"
  12: "だから、わたしたちはそれぞれ、自分[じぶん]のことを神[かみ]に申[もう]し開[ひら]きするのである。"
  13: "だから、もう互[たが]いに裁[さば]き合[あ]ってはならない。むしろ、兄弟[きょうだい]の前[まえ]に妨[さまた]げとなるものや、つまずきとなるものを置[お]かないことこそ、あなたがたが決[き]めるべきことである。"
  14: "わたしは主[しゅ]イエスにあって知[し]り、また確[たし]かに信[しん]じている。何[なに]もそれ自体[じたい]で汚[けが]れたものはない。ただ、何[なに]かを汚[けが]れていると考[かんが]える人[ひと]には、それが汚[けが]れたものとなる。"
  15: "というのは、食物[しょくもつ]のことであなたの兄弟[きょうだい]が悲[かな]しむなら、あなたはもはや愛[あい]に従[したが]って歩[あゆ]んでいないからである。キリストがその人[ひと]のために死[し]なわれたのに、あなたの食物[しょくもつ]でその人[ひと]を滅[ほろ]ぼしてはならない。"
  16: "だから、あなたがたの善[ぜん]が人[ひと]にそしられないようにしなさい。"
  17: "というのは、神[かみ]の国[くに]は飲[の]み食[く]いにあるのではなく、{聖霊[せいれい]|聖神[せいしん]}による義[ぎ]と平和[へいわ]と喜[よろこ]びにあるからである。"
  18: "というのは、このようにしてキリストに仕[つか]える者[もの]は、神[かみ]に喜[よろこ]ばれ、人々[ひとびと]にも認[みと]められるからである。"
  19: "だから、わたしたちは、平和[へいわ]に資[し]する事柄[ことがら]と、互[たが]いを建[た]て上[あ]げる事柄[ことがら]とを追[お]い求[もと]めよう。"
  20: "食物[しょくもつ]のために神[かみ]の働[はたら]きを壊[こわ]してはならない。すべてのものは確[たし]かに清[きよ]い。しかし、人[ひと]をつまずかせながら食[た]べる者[もの]には、それは悪[あく]である。"
  21: "肉[にく]を食[た]べず、ぶどう酒[しゅ]を飲[の]まず、また、あなたの兄弟[きょうだい]がつまずくようなこと、〔あるいは惑[まど]わされたり、弱[よわ]ったりするようなこと〕をしないのは、良[よ]いことである。"
  22: "あなたには信仰[しんこう]があるのか。それを自分[じぶん]の内[うち]に、神[かみ]の前[まえ]に持[も]っていなさい。自分[じぶん]がよしと認[みと]めることで、自分[じぶん]を罪[つみ]に定[さだ]めない者[もの]は幸[さいわ]いである。"
  23: "しかし、疑[うたが]いながら食[た]べる者[もの]は、食[た]べれば罪[つみ]に定[さだ]められる。信仰[しんこう]から出[で]たのでないからである。信仰[しんこう]から出[で]ないものは、すべて罪[つみ]である。"

notes:
  1: "ἀσθενοῦντα τῇ πίστει — «немощного в вере»; 信仰の弱い者. διακρίσεις διαλογισμῶν — «споры о мнениях»; 意見を論じ合うこと."
  2: "λάχανα — «овощи»; 野菜."
  3: "ἐξουθενείτω — «пусть не уничижает»; 軽んじてはならない. προσελάβετο — «принял»; 受け入れた."
  4: "ἀλλότριον οἰκέτην — «чужого слугу»; 他人の僕. τῷ ἰδίῳ κυρίῳ — своему господину, 主人; далее ὁ κύριος — Господь, 主."
  5: "κρίνει ἡμέραν παρ᾿ ἡμέραν — «отличает день от дня»; 特定の日を他の日と区別する. πληροφορείσθω — «пусть будет вполне уверен»; 確信を持つ."
  6: "В критической базе нет «и кто не различает дня, для Господа не различает»; церковный текст (Елизаветинская, jp-joc「日を別たざる者も主のために別たず」) читает его — 〔…〕."
  7: "οὐδεὶς ἡμῶν ἑαυτῷ ζῇ — «никто из нас не живёт для себя»; 自分のために生きず."
  8: "ἐάν τε… ἐάν τε… — «живём ли… умираем ли…»; 生きるにせよ死ぬにせよ. τοῦ κυρίου ἐσμέν — «мы Господни»; 主のものである."
  9: "ἀπέθανεν καὶ ἔζησεν — «умер и ожил»; 死んで、また生き返られた. κυριεύσῃ — «чтобы господствовать»; 主となる."
  10: "βῆμα τοῦ θεοῦ — «судилище Божие»; 神の裁きの座. Византийский текст и jp-joc читают Χριστοῦ («престол Христов»); в базе θεοῦ, переведено по базе, без скобок."
  11: "Цитата из Ис 45:23. ἐξομολογήσεται τῷ θεῷ — «исповедует Бога»; 神に告白する."
  12: "λόγον δώσει — «даст отчёт»; 申し開きをする."
  13: "πρόσκομμα — «преткновение»; σκάνδαλον — «соблазн»; переданы 妨げ и つまずき. κρίνατε — «рассудите»; 決めるべきこと."
  14: "οἶδα καὶ πέπεισμαι ἐν κυρίῳ Ἰησοῦ — «я знаю и уверен в Господе Иисусе»: это убеждение самого Павла, а не речь Христа. κοινόν — «нечистое»; 汚れた."
  15: "κατὰ ἀγάπην περιπατεῖς — «по любви поступаешь»; 愛に従って歩む. ἀπόλλυε — «губишь»; 滅ぼす."
  16: "βλασφημείσθω — «пусть не хулится»; そしられる."
  17: "βρῶσις καὶ πόσις — «пища и питие»; 飲み食い. δικαιοσύνη καὶ εἰρήνη καὶ χαρά — 義と平和と喜び."
  18: "ἐν τούτῳ — «в этом»; このようにして. δόκιμος — «испытанный, одобряемый»; 認められる."
  19: "τὰ τῆς εἰρήνης… τὰ τῆς οἰκοδομῆς — «что служит к миру… к назиданию»; 平和に資する事柄…建て上げる事柄."
  20: "κατάλυε — «разрушай»; 壊す. πάντα μὲν καθαρά, ἀλλὰ… — «всё чисто, но…»; 確かに清い、しかし…."
  21: "В критической базе стих кончается на προσκóπτει; церковный текст (Елизаветинская, jp-joc「或は惑はせ、或は弱らしむる」) добавляет ἢ σκανδαλίζεται ἢ ἀσθενεῖ — 〔…〕."
  22: "κατὰ σεαυτὸν ἔχε — «имей у себя»; 自分の内に持つ. δοκιμάζει — «одобряет, признаёт»; よしと認める."
  23: "διακρινόμενος — «сомневающийся»; 疑いながら. κατακέκριται — «осуждён»; 罪に定められる."
