verses:
  0: "捕囚[ほりゅう]の後[のち]に家[いえ]が建[た]てられたときの、ダビデの歌[うた]。"
  1: "主[しゅ]に新[あたら]しい歌[うた]を歌[うた]え。全地[ぜんち]よ、主[しゅ]に歌[うた]え。"
  2: "主[しゅ]に歌[うた]い、その名[な]をほめたたえよ。日[ひ]から日[ひ]へと、その救[すく]いを告[つ]げ知[し]らせよ。"
  3: "諸国[しょこく]の民[たみ]の中[なか]にその栄光[えいこう]を、すべての民[たみ]の中[なか]にその奇[き]跡[せき]を告[つ]げ知[し]らせよ。"
  4: "主[しゅ]は大[おお]いなる方[かた]、大[おお]いにほめたたえられるべき方[かた]、すべての神[かみ]々[がみ]の上[うえ]に恐[おそ]るべき方[かた]である。"
  5: "諸国[しょこく]の民[たみ]の神[かみ]々[がみ]はみな悪[あく]霊[れい]にすぎない。しかし、主[しゅ]は天[てん]を造[つく]られた。"
  6: "賛美[さんび]と美[うつく]しさはその前[まえ]にあり、聖[せい]なることと威厳[いげん]はその聖所[せいしょ]にある。"
  7: "諸国[しょこく]の民[たみ]の諸族[しょぞく]よ、主[しゅ]に帰[き]せよ。栄光[えいこう]と誉[ほま]れを主[しゅ]に帰[き]せよ。"
  8: "その名[な]にふさわしい栄光[えいこう]を主[しゅ]に帰[き]せよ。供[そな]え物[もの]を携[たずさ]えて、その庭[にわ]に入[はい]れ。"
  9: "その聖[せい]なる庭[にわ]で主[しゅ]を拝[おが]め。全地[ぜんち]よ、その前[まえ]に震[ふる]えよ。"
  10: "諸国[しょこく]の民[たみ]に言[い]え。「主[しゅ]は王[おう]となられた。まことに、世界[せかい]は固[かた]く据[す]えられ、揺[ゆ]るぐことはない。主[しゅ]は民[たみ]を正[ただ]しく裁[さば]かれる」と。"
  11: "天[てん]は喜[よろこ]べ、地[ち]は喜[よろこ]び躍[おど]れ。海[うみ]とその中[なか]に満[み]ちるものとは鳴[な]りとどろけ。"
  12: "野[の]とその中[なか]にあるものはみな喜[よろこ]ぶ。そのとき、森[もり]の木[き]々[ぎ]はみな喜[よろこ]び躍[おど]る。"
  13: "主[しゅ]の前[まえ]で。主[しゅ]は来[く]る、地[ち]を裁[さば]くために来[く]る。主[しゅ]は世界[せかい]を義[ぎ]によって、民[たみ]をその真実[しんじつ]によって裁[さば]かれる。"

notes:
  0: "Ὅτε ὁ οἶκος ᾠκοδομεῖτο μετὰ τὴν αἰχμαλωσίαν — 捕囚の後に家が建てられたときの (οἶκος — «дом»; οἰκοδομέω — «строить»; αἰχμαλωσία — 捕囚). ᾠδὴ τῷ Δαυιδ — ダビデの歌 (ᾠδή — 歌). Надписание — стих 0."
  1: "Ἄισατε τῷ κυρίῳ ᾆσμα καινόν — 主に新しい歌を歌え (ᾆσμα — «песнь»; καινός — 新しい). ᾄσατε τῷ κυρίῳ, πᾶσα ἡ γῆ — 全地よ、主に歌え (πᾶσα ἡ γῆ — 全地)."
  2: "ᾄσατε τῷ κυρίῳ, εὐλογήσατε τὸ ὄνομα αὐτοῦ — 主に歌い、その名をほめたたえよ (εὐλογέω — «благословлять, хвалить»). εὐαγγελίζεσθε ἡμέραν ἐξ ἡμέρας τὸ σωτήριον αὐτοῦ — 日から日へと、その救いを告げ知らせよ (εὐαγγελίζομαι — «благовествовать»; σωτήριον — 救い)."
  3: "ἀναγγείλατε ἐν τοῖς ἔθνεσιν τὴν δόξαν αὐτοῦ — 諸国の民の中にその栄光を告げ知らせよ (ἀναγγέλλω — «возвещать»; δόξα — 栄光). ἐν πᾶσι τοῖς λαοῖς τὰ θαυμάσια αὐτοῦ — すべての民の中にその奇跡を (θαυμάσιον — 奇跡)."
  4: "μέγας κύριος καὶ αἰνετὸς σφόδρα — 主は大きなる方、大いにほめたたえられるべき方 (αἰνετός — «достохвальный»). φοβερός ἐστιν ἐπὶ πάντας τοὺς θεούς — すべての神々の上に恐るべき方である (φοβερός — «страшный, внушающий благоговение»)."
  5: "πάντες οἱ θεοὶ τῶν ἐθνῶν δαιμόνια — 諸国の民の神々はみな悪霊にすぎない (δαιμόνιον — 悪霊, как по корпусу; слав. «бесове»; у jp-joc 偶像). ὁ δὲ κύριος τοὺς οὐρανοὺς ἐποίησεν — しかし、主は天を造られた."
  6: "ἐξομολόγησις καὶ ὡραιότης ἐνώπιον αὐτοῦ — 賛美と美しさはその前にあり (ἐξομολόγησις — «славословие»; ὡραιότης — «красота»). ἁγιωσύνη καὶ μεγαλοπρέπεια ἐν τῷ ἁγιάσματι αὐτοῦ — 聖なることと威厳はその聖所にある (ἁγιωσύνη — «святость»; μεγαλοπρέπεια — 威厳; ἁγίασμα — 聖所)."
  7: "ἐνέγκατε τῷ κυρίῳ, αἱ πατριαὶ τῶν ἐθνῶν — 諸国の民の諸族よ、主に帰せよ (πατριά — «племя, род»). ἐνέγκατε τῷ κυρίῳ δόξαν καὶ τιμήν — 栄光と誉れを主に帰せよ (τιμή — 誉れ)."
  8: "ἐνέγκατε τῷ κυρίῳ δόξαν ὀνόματι αὐτοῦ — その名にふさわしい栄光を主に帰せよ (датив «имени Его»). ἄρατε θυσίας — 供え物を携えて (αἴρω — «поднимать, приносить»; θυσία — «жертва»). εἰσπορεύεσθε εἰς τὰς αὐλὰς αὐτοῦ — その庭に入れ (αὐλή — «двор»)."
  9: "προσκυνήσατε τῷ κυρίῳ ἐν αὐλῇ ἁγίᾳ αὐτοῦ — その聖なる庭で主を拝め (προσκυνέω — 拝む). σαλευθήτω ἀπὸ προσώπου αὐτοῦ πᾶσα ἡ γῆ — 全地よ、その前に震えよ (σαλεύω — «колебать, сотрясать»)."
  10: "εἴπατε ἐν τοῖς ἔθνεσιν — 諸国の民に言え (вводит возвещение — 「」). Ὁ κύριος ἐβασίλευσεν — 主は王となられた. κατώρθωσεν τὴν οἰκουμένην, ἥτις οὐ σαλευθήσεται — 世界は固く据えられ、揺るぐことはない (κατορθόω — «утверждать, исправлять»). κρινεῖ λαοὺς ἐν εὐθύτητι — 主は民を正しく裁かれる (εὐθύτης — «правота»)."
  11: "εὐφραινέσθωσαν οἱ οὐρανοί — 天は喜べ (εὐφραίνω — «веселить»). ἀγαλλιάσθω ἡ γῆ — 地は喜び躍れ (ἀγαλλιάομαι — «ликовать»). σαλευθήτω ἡ θάλασσα καὶ τὸ πλήρωμα αὐτῆς — 海とその中に満ちるものとは鳴りとどろけ (πλήρωμα — «полнота»; σαλεύω — здесь «шуметь, волноваться»)."
  12: "χαρήσεται τὰ πεδία καὶ πάντα τὰ ἐν αὐτοῖς — 野とその中にあるものはみな喜ぶ (πεδίον — «поле, равнина»). τότε ἀγαλλιάσονται πάντα τὰ ξύλα τοῦ δρυμοῦ — そのとき、森の木々はみな喜び躍る (ξύλον — 木; δρυμός — «дубрава, лес»)."
  13: "πρὸ προσώπου κυρίου — 主の前で (продолжение ст. 12). ὅτι ἔρχεται, ὅτι ἔρχεται κρῖναι τὴν γῆν — 主は来る、地を裁くために来る (повтор ἔρχεται сохранён). κρινεῖ τὴν οἰκουμένην ἐν δικαιοσύνῃ — 主は世界を義によって裁き (δικαιοσύνη — 義). λαοὺς ἐν τῇ ἀληθεία αὐτοῦ — 民をその真実によって裁かれる (ἀλήθεια — 真実)."
