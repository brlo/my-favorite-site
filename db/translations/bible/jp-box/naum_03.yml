# jp-box, Наум, глава 3. Черновик для приёмки.
#
# Нумерация — по славяно-синодальной: наш 3:1–19 = gr 3:1–19, совпадает стих в стих
# (граница глав 1/2 — см. шапки naum_01/naum_02: наш 1:15 = gr 2:1, наш 2:13 = gr 2:14).
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1–3 город кровей, бичи, колесницы, груды раненых; 4–7 блудница Ниневия,
# «вот, Я — на тебя», обнажение и посмеяние; 8–10 Но-Амон (Фивы) как пример;
# 11–15 опьянение, укрепления как смоковницы, осадные работы; 15–17 саранча и
# торговцы; 18–19 спящие пастыри, «нет исцеления разрушению твоему».
# Голоса: 1–4 речь пророка; 5–19 — слово Господа в 「…」 (в 5 формула «говорит
# Господь Бог Вседержитель» внутри); 7 — слова прохожих в 『…』 внутри слова Господа.
# 3:3: слав. включает в этот стих «от множества блужения» (= начало gr 3:4),
# поэтому 3:4 начинается с «娼婦».
# 3:8: тёмное место LXX («приготовь часть, настрой струну…»): держим церковное
# чтение, не сглаживая; в ru «разве ты лучше Но-Амона» — по МТ.
# 3:14: κατακράτησον ὑπὲρ πλίνθον — тёмное; слав. «утверди паче плинфа».
# 3:15: βαρυνθήσῃ ὡς βροῦχος — «отяготеешь как саранча» (слав. «отягчаеши аки мшица»);
# в ru «хотя бы ты умножился как гусеница» — по МТ.
#
tr_code: jp-box
book: naum
chapter: 3
draft: true

verses:
  1: "ああ、血[ち]の都[みやこ]、すべて偽[いつわ]りで、不正[ふせい]に満[み]ちている。獲物[えもの]はもはや手探[てさぐ]りされることもない。"
  2: "鞭[むち]の音[おと]、車輪[しゃりん]のどよめき、駆[か]ける馬[うま]、跳[は]ねる戦車[せんしゃ]の音[おと]がある。"
  3: "騎兵[きへい]が上[のぼ]り、剣[つるぎ]は光[ひか]り、武具[ぶぐ]は閃[ひらめ]く。傷[きず]ついた者[もの]は多[おお]く、倒[たお]れる者[もの]は重[おも]い。彼女[かのじょ]の民[たみ]には限[かぎ]りがない。彼らはその体[からだ]のうちで、多[おお]くの淫行[いんこう]のゆえに弱[よわ]り果[は]てる。"
  4: "美[うつく]しく、好[この]ましい娼婦[しょうふ]、魔術[まじゅつ]の長[かしら]である者[もの]よ。彼女[かのじょ]はその淫行[いんこう]で国[くに]々[ぐに]を売[う]り、その魔術[まじゅつ]で部族[ぶぞく]を売[う]る。"
  5: "見[み]よ、わたしはあなたに向[む]かう、と全能者[ぜんのうしゃ]である主[しゅ]なる神[かみ]は言[い]われる。「わたしはあなたの裾[すそ]をあなたの顔[かお]までまくり上げ、国[くに]々[ぐに]にあなたの恥[は]ずかしさを、王国[おうこく]たちにあなたの辱[はずかし]めを見[み]せる。"
  6: "わたしはあなたの汚[けが]れに応[おう]じて忌[い]むべき物[もの]をあなたに投[な]げかけ、あなたを見せしめとする。"
  7: "すべてあなたを見[み]る者[もの]はあなたから飛[と]び退[の]き、言[い]う。『ああ、みじめなニネベ。だれが彼女[かのじょ]のために嘆[なげ]くのか。どこから彼女[かのじょ]に慰[なぐさ]めを求[もと]めようか』と。"
  8: "分[わ]け前[まえ]を備[そな]え、弦[つる]を調[ととの]え、ノ・アモンのために分[わ]け前[まえ]を備[そな]えよ。川[かわ]々[がわ]の間[あいだ]に住[す]む者[もの]、水[みず]はその周[まわ]りにあり、その始[はじ]めは海[うみ]、水[みず]がその城壁[じょうへき]である。"
  9: "エチオピアはその力[ちから]、エジプトもまた然[しか]り。あなたの逃[に]げる果[は]てはない。フドとリビア人[じん]はその助[たす]けとなった。"
  10: "彼女[かのじょ]もまた捕囚[ほしゅう]となって連[つ]れ去[さ]られ、その幼[おさな]い子[こ]らはすべての道[みち]の角[かど]で打[う]ち砕[くだ]かれ、そのすべてもろもろの誉[ほま]れある者[もの]の上[うえ]に籤[くじ]が投[な]げられ、そのすべてもろもろの貴人[きじん]たちは鎖[くさり]で縛[しば]られる。"
  11: "あなたもまた酔[よ]い、見捨[みす]てられる。あなたもまた敵[てき]から立[た]ち返[かえ]る力[ちから]を求[もと]める。"
  12: "あなたのすべての城塞[じょうさい]はいちじくの木[き]のようで、その番人[ばんにん]がいる。揺[ゆ]らされれば、食[く]らう者[もの]の口[くち]に落[お]ちる。"
  13: "見[み]よ、あなたの民[たみ]はあなたのうちで女[おんな]のようである。あなたの地[ち]の門[もん]は敵[てき]のために開[ひら]かれ、火[ひ]があなたのかんぬきを食[く]らう。"
  14: "包囲[ほうい]のための水[みず]を汲[く]め。あなたの城塞[じょうさい]を堅[かた]くせよ。泥[どろ]に入[はい]り、もみがらの中[なか]を踏[ふ]め、れんがを取[と]って強[つよ]くせよ。"
  15: "そこでは火[ひ]があなたを食[く]らい、剣[つるぎ]があなたを滅[ほろ]ぼす。いなごのようにあなたを食[く]らう。いなごのように多[おお]くなれ、ばったのように身[み]が重[おも]くなれ。"
  16: "あなたはその交易[こうえき]を天[てん]の星[ほし]よりも多[おお]くした。いなごは群[む]れ来[き]て飛[と]び去[さ]った。"
  17: "あなたの混[ま]じり合[あ]った者[もの]は、いなごのように跳[は]ね、寒[さむ]い日[ひ]に垣[かき]に上[のぼ]るばったのようである。日[ひ]が昇[のぼ]ると飛[と]び去[さ]り、その場所[ばしょ]も知[し]られなくなる。ああ、彼らはわざわいだ。"
  18: "あなたの牧者[ぼくしゃ]たちは眠[ねむ]り、アッシリアの王[おう]はあなたの支配[しはい]者[しゃ]たちを眠[ねむ]らせた。あなたの民[たみ]は山[やま]々[やま]に散[ち]り、集[あつ]める者[もの]はいない。"
  19: "あなたの破[やぶ]れには癒[いや]しがない。あなたの傷[きず]は燃[も]え上がった。あなたの知[し]らせを聞[き]く者[もの]はすべて、あなたの上[うえ]で手[て]を打[う]つ。あなたの悪[わる]いは、すべての者[もの]に絶[た]えず及[およ]んだからである」。"

notes:
  1: "Ὦ πόλις αἱμάτων — «о город кровей» (αἷμα — кровь, 血); ὅλη ψευδὴς ἀδικίας πλήρης — «весь лживый, неправды полный»; οὐ ψηλαφηθήσεται θήρα — «не будет ощупана добыча» (ψηλαφάω — ощупывать, 手探りする): тёмное место, слав. «не осяжется ловитва»."
  2: "φωνὴ μαστίγων — «голос бичей» (μάστιξ — бич, 鞭); φωνὴ σεισμοῦ τροχῶν — «голос трясения колёс» (τροχός — колесо, 車輪); ἵππου διώκοντος — «коня скачущего» (διώκω — гнать, 駆ける); ἅρματος ἀναβράσσοντος — «колесницы клокочущей» (ἀναβράσσω — вскипать, 跳ねる)."
  3: "ἱππέως ἀναβαίνοντος — «всадника поднимающегося»; στιλβούσης ῥομφαίας — «блистающего меча» (στίλβω — блестеть, 光る); ἐξαστραπτόντων ὅπλων — «сверкающих оружий» (ἐξαστράπτω — сверкать, 閃く); πλήθους τραυματιῶν — «множества раненых» (τραυματίας — раненый, 傷ついた者); βαρείας πτώσεως — «тяжкого падения»; οὐκ ἦν πέρας τοῖς ἔθνεσιν αὐτῆς — «не было конца народам её»; ἀσθενήσουσιν ἐν τοῖς σώμασιν αὐτῶν — «изнемогут в телах своих»; ἀπὸ πλήθους πορνείας (начало gr 3:4) — «от множества блуда», слав. относит сюда."
  4: "πόρνη καλὴ καὶ ἐπιχαρής — «блудница красивая и приятная» (πόρνη — блудница, 娼婦; ἐπιχαρής — приятный, 好ましい); ἡγουμένη φαρμάκων — «начальница чар» (φάρμακον — зелье, 魔術); ἡ πωλοῦσα ἔθνη ἐν τῇ πορνείᾳ αὐτῆς — «продающая народы в блуде своём» (πωλέω — продавать, 売る)."
  5: "ἀποκαλύψω τὰ ὀπίσω σου ἐπὶ τὸ πρόσωπόν σου — «открою заднее твоё на лицо твоё» (слав. «открыю задняя твоя к лицу твоему»); δείξω ἔθνεσιν τὴν αἰσχύνην σου — «покажу народам срамоту твою»; βασιλείαις τὴν ἀτιμίαν σου — «царствам бесчестие твоё» (ἀτιμία — бесчестие, 辱め)."
  6: "ἐπιρρίψω ἐπὶ σὲ βδελυγμὸν κατὰ τὰς ἀκαθαρσίας σου — «брошу на тебя мерзость по нечистотам твоим» (βδελυγμός — мерзость, 忌むべき物; ἀκαθαρσία — нечистота, 汚れ); θήσομαί σε εἰς παράδειγμα — «положу тебя в пример (притчу)» (слав. «в притчу»), т.е. на посмешище."
  7: "πᾶς ὁ ὁρῶν σε ἀποπηδήσεται ἀπὸ σοῦ — «всякий видящий тебя отскочит от тебя» (ἀποπηδάω — отпрыгивать, 飛び退く); Δειλαία Νινευη — «окаянная (жалкая) Ниневия» (δειλαῖος — жалкий, みじめな); τίς στενάξει αὐτήν — «кто восстенает о ней» (στενάζω — стенать, 嘆く); πόθεν ζητήσω παράκλησιν αὐτῇ — «откуда поищу утешение ей» (παράκλησις — утешение, 慰め). Слова прохожих — 『…』."
  8: "ἑτοίμασαι μερίδα, ἅρμοσαι χορδήν — «приготовь часть, настрой струну»: тёмное, по-видимому испорченное место LXX (ожидается вопрос «разве ты лучше Но-Амона?»); слав. «уготовити часть, устроити струну, уготовити часть аммону» повторяет его, в текст внесено как есть, без сглаживания. Αμων ἡ κατοικοῦσα ἐν ποταμοῖς — «Амон, живущая в реках»: Но-Амон = Фивы (אָמוֹן נֹא); в тексте ノ・アモン, чтобы не смешивать с アモン (царь Иудин, Соф 1:1); слав. «аммону» могло быть понято и как Аммон; ὕδωρ κύκλῳ αὐτῆς — «вода вокруг неё»; ἧς ἡ ἀρχὴ θάλασσα — «у которой начало — море»; ὕδωρ τὰ τείχη αὐτῆς — «вода — стены её»."
  9: "Αἰθιοπία ἡ ἰσχὺς αὐτῆς — «Ефиопия — сила её»; Αἴγυπτος — «Египет»; οὐκ ἔστιν πέρας τῆς φυγῆς — «нет конца бегству» (слав. «бегству твоему»; φυγή — бегство, 逃げること); Λίβυες ἐγένοντο βοηθοὶ αὐτῆς — «Ливийцы стали помощниками её»; слав. добавляет «фуд» (Φούδ) — нет в LXX, внесено."
  10: "εἰς μετοικεσίαν πορεύσεται αἰχμάλωτος — «в переселение пойдёт пленницей» (μετοικεσία — переселение, 捕囚); τὰ νήπια αὐτῆς ἐδαφιοῦσιν ἐπ᾿ ἀρχὰς πασῶν τῶν ὁδῶν — «младенцев её разобьют в началах всех путей» (ἐδαφίζω — разбивать о землю, 打ち砕く); ἐπὶ πάντα τὰ ἔνδοξα αὐτῆς βαλοῦσιν κλήρους — «о всех славных её бросят жребий» (κλῆρος — жребий, 籤); πάντες οἱ μεγιστᾶνες αὐτῆς δεθήσονται χειροπέδαις — «все вельможи её будут связаны ручными оковами» (χειροπέδη — оковы, 鎖)."
  11: "μεθυσθήσῃ — «упиёшься» (μεθύσκω — напоить, 酔う); ἔσῃ ὑπερεωραμένη — «будешь презрена» (ὑπεροράω — презирать, 見捨てる); ζητήσεις σεαυτῇ στάσιν ἐξ ἐχθρῶν — «поищешь себе стояния (защиты) от врагов» (στάσις — стояние, 立ち返る力)."
  12: "πάντα τὰ ὀχυρώματά σου συκαῖ σκοποὺς ἔχουσαι — «все укрепления твои — смоковницы, имеющие стражей» (ὀχύρωμα — крепость, 城塞; σκοπός — страж, 番人; возможно, «ранние смоквы»); ἐὰν σαλευθῶσιν, πεσοῦνται εἰς στόμα ἔσθοντος — «если поколеблются, упадут в рот ядущего»."
  13: "ὁ λαός σου ὡς γυναῖκες ἐν σοί — «народ твой как женщины в тебе»; ἀνοιγόμεναι ἀνοιχθήσονται πύλαι τῆς γῆς σου — «отворяясь, отворятся ворота земли твоей» (усиление); καταφάγεται πῦρ τοὺς μοχλούς σου — «поест огонь засовы твои» (μοχλός — засов, かんぬき)."
  14: "ὕδωρ περιοχῆς ἐπίσπασαι σεαυτῇ — «воды осады начерпай себе» (περιοχή — осада/ограда, 包囲; ἐπισπάω — черпать, 汲む); κατακράτησον τῶν ὀχυρωμάτων σου — «укрепи укрепления твои»; ἔμβηθι εἰς πηλόν — «войди в глину» (πηλός — глина, 泥); συμπατήθητι ἐν ἀχύροις — «потопчись в мякине» (ἄχυρον — мякина, もみがら); κατακράτησον ὑπὲρ πλίνθον — «возьми (укрепи) сверх кирпича»: тёмное, слав. «утверди паче плинфа»; в ru «исправь печь для обжигания кирпичей» — по МТ."
  15: "ἐκεῖ καταφάγεταί σε πῦρ — «там поест тебя огонь»; ἐξολεθρεύσει σε ῥομφαία — «истребит тебя меч»; καταφάγεταί σε ὡς ἀκρίς — «поест тебя как саранча» (ἀκρίς — саранча, いなご); βαρυνθήσῃ ὡς βροῦχος — «отяготеешь как саранча» (βροῦχος — вид саранчи, ばった; слав. «отягчаеши аки мшица»); в ru «хотя бы ты умножился как гусеница» — по МТ."
  16: "ἐπλήθυνας τὰς ἐμπορίας σου ὑπὲρ τὰ ἄστρα τοῦ οὐρανοῦ — «умножила торговлю твою паче звёзд небесных» (ἐμπορία — торговля, 交易); βροῦχος ὥρμησεν καὶ ἐξεπετάσθη — «саранча устремилась и улетела» (ἐκπετάννυμι — распростирать крылья, 飛び去る)."
  17: "ἐξήλατο ὡς ἀττέλεβος ὁ σύμμικτός σου — «вскочил как саранча смешанный (сброд) твой» (ἀττέλεβος — вид саранчи; σύμμικτος — смешанный, 混じり合った者); ὡς ἀκρὶς ἐπιβεβηκυῖα ἐπὶ φραγμόν — «как саранча, взошедшая на ограду» (φραγμός — ограда, 垣); ἐν ἡμέραις πάγους — «в дни мороза» (πάγος — мороз, 寒い日); ὁ ἥλιος ἀνέτειλεν, καὶ ἀφήλατο — «солнце взошло, и она улетела»; οὐκ ἔγνω τὸν τόπον αὐτῆς — «не познали места её»; οὐαὶ αὐτοῖς — «горе им»."
  18: "ἐνύσταξαν οἱ ποιμένες σου — «воздремали пастыри твои» (νυστάζω — дремать, 眠る); βασιλεὺς Ἀσσύριος ἐκοίμισεν τοὺς δυνάστας σου — «царь Ассирийский усыпил владык твоих» (δυνάστης — владыка, 支配者); ἀπῆρεν ὁ λαός σου ἐπὶ τὰ ὄρη — «поднялся народ твой на горы» (ἀπαίρω — поднимать, 散る); οὐκ ἦν ὁ ἐκδεχόμενος — «не было принимающего (собирающего)» (ἐκδέχομαι — принимать, 集める)."
  19: "οὐκ ἔστιν ἴασις τῇ συντριβῇ σου — «нет исцеления разрушению твоему» (ἴασις — исцеление, 癒し; συντριβή — сокрушение, 破れ); ἐφλέγμανεν ἡ πληγή σου — «воспалилась рана твоя» (φλεγμαίνω — воспаляться, 燃え上がる); οἱ ἀκούοντες τὴν ἀγγελίαν σου κροτήσουσιν χεῖρας ἐπὶ σέ — «слышащие весть твою восплещут руками о тебе» (κροτέω — ударять, 手を打つ); ἐπὶ τίνα οὐκ ἐπῆλθεν ἡ κακία σου διὰ παντός — «на кого не находила злоба твоя всегда». Здесь слово Господа закрывается."
