verses:
  1: "これを聞[き]いた不敬[ふけい]な王[おう]は激[はげ]しく怒[いか]り、アレクサンドリアのユダヤ人[じん]ばかりか、国中[くにじゅう]の者[もの]たちにもさらに激[はげ]しく敵対[てきたい]し、急[いそ]いで全[すべ]ての者[もの]を一[ひと]つの所[ところ]に集[あつ]め、最[もっと]も惨[むご]い死[し]に処[しょ]するよう命[めい]じた。"
  2: "このことが準備[じゅんび]されるうちに、この民[たみ]に不利[ふり]なうわさが広[ひろ]まった。悪[わる]だくみを同[おな]じくする者[もの]たちに、彼[かれ]らを害[がい]する口実[こうじつ]が与[あた]えられた。あたかも彼[かれ]らが法[ほう]の定[さだ]めに逆[さから]っているかのように。"
  3: "一方[いっぽう]、ユダヤ人[じん]たちは王[おう]たちへの善意[ぜんい]と揺[ゆ]るがない信[しん]義[ぎ]を保[たも]っていた。彼[かれ]らは神[かみ]を敬[うやま]い、その律法[りっぽう]に従[したが]って暮[く]らしていたので、食物[しょくもつ]について他[ほか]の者[もの]たちと交[まじ]わらなかった。そのため、ある者[もの]たちには憎[にく]ましく映[うつ]った。しかし彼[かれ]らは正[ただ]しい行[おこな]いによって日々[ひび]の交[まじ]わりを飾[かざ]り、すべの人[ひと]々[びと]から立派[りっぱ]だと認[みと]められていた。"
  4: "他[た]の民[たみ]の者[もの]たちは、すべての人[ひと]に語[かた]り伝[つた]えられていたこの民[たみ]の善[よ]い行[おこな]いには、まったく目[め]を向[む]けなかった。ただ礼拝[れいはい]と食物[しょくもつ]についての違[ちが]いを言[い]いふらし、この者[もの]たちは王[おう]とも軍[ぐん]とも盟約[めいやく]を結[むす]ばず、敵意[てきい]を抱[いだ]いて国[くに]の事[こと]に大[おお]いに逆[さから]っていると言[い]った。そして、ただならぬ非難[ひなん]を彼[かれ]らに浴[あ]びせた。"
  5: "都[みやこ]のギリシア人[じん]たちは、何[なに]の害[がい]も受[う]けていないのに、この人[ひと]々[びと]の周[まわ]りに思[おも]いがけない騒[さわ]ぎが起[お]こり、人[ひと]々[びと]が無[む]秩序[ちつじょ]に集[あつ]まってくるのを見[み]た。しかし、彼[かれ]らを助[たす]ける力[ちから]はなかった。王[おう]のやり方[かた]が専制[せんせい]的[てき]だったからである。それでも彼[かれ]らは励[はげ]まし、心[こころ]を痛[いた]め、この事[こと]もやがて変[か]わるだろうと思[おも]っていた。"
  6: "これほど大[おお]きな集[しゅう]まりが、何[なに]一つ悪[わる]いことをしていないのに、見[み]過[す]ごされるはずはない、と思[おも]ったからである。"
  7: "すでに、ある隣人[りんじん]たちや友人[ゆうじん]たち、また取引[とりひき]をともにする者[もの]たちは、ひそかに幾人[いくにん]かを引[ひ]き入[い]れて誓[ちか]いを交[か]わし、盾[たて]を並[なら]べて助[たす]け、あらゆる力[ちから]を尽[つ]くして支援[しえん]すると約束[やくそく]していた。"
  8: "ところが王[おう]は、そのときの繁栄[はんえい]に驕[おご]り、大[おお]いなる神[かみ]の支配[しはい]を顧[かえり]みず、いつまでも同[おな]じ決意[けつい]にとどまると考[かんが]えて、彼[かれ]らに対[たい]する次[つぎ]のような書簡[しょかん]を書[か]いた。"
  9: "「王[おう]プトレマイオス・フィロパトルは、エジプトと各地[かくち]の将軍[しょうぐん]たち、および兵士[へいし]たちに、喜[よろこ]びと健康[けんこう]を願[ねが]って挨拶[あいさつ]する。わたし自身[じしん]も、わたしたちの事[こと]も無事[ぶじ]である。"
  10: "わたしたちがアジアへ行[おこな]った遠征[えんせい]は、あなたがたも知[し]っているとおり、神[かみ]々[がみ]の思[おも]いがけない加護[かご]によって望[のぞ]みどおり成就[じょうじゅ]した。そこでわたしたちは、槍[やり]の力[ちから]ではなく、寛容[かんよう]と大[おお]いなる人間[にんげん]愛[あい]によって、ケレシリアとフェニキアに住[す]む民[たみ]たちを育[はぐく]み、喜[よろこ]んで善[ぜん]を施[ほどこ]そうと考えた。"
  11: "また、各地[かくち]の神殿[しんでん]には多[おお]くの収入[しゅうにゅう]を割[わ]り当[あ]て、さらにエルサレムに上[のぼ]り、あの忌[い]まわしい者[もの]たち——その愚[おろ]かさが決[けっ]して尽[つ]きることのない者[もの]たち——の神殿[しんでん]を敬[うやま]おうとした。"
  12: "ところが彼[かれ]らは、言葉[ことば]の上[うえ]ではわたしたちの訪[おとず]れを受け入[い]れながら、実際[じっさい]には偽[いつわ]りであった。わたしたちが彼[かれ]らの聖所[せいしょ]に入[はい]り、立派[りっぱ]で最[もっと]も美[うつく]しい奉納物[ほうのうぶつ]でこれを敬[うやま]おうと望[のぞ]んだとき、彼[かれ]らは古[ふる]い高慢[こうまん]に駆[か]られてわたしたちの入[はい]るのを妨[さまた]げた。わたしたちがすべての人[ひと]に対[たい]して抱[いだ]いている人間[にんげん]愛[あい]の力[ちから]を、彼[かれ]らは軽[かろ]んじたのである。"
  13: "彼[かれ]らがわたしたちに抱[いだ]く敵意[てきい]は明[あき]らかである。彼[かれ]らはすべての民[たみ]のうちでただ彼[かれ]らだけが、王[おう]たちや自分[じぶん]たちの恩人[おんじん]に対[たい]して高[たか]ぶり、誠実[せいじつ]なものは何[なに]一つ示[しめ]そうとしない。"
  14: "わたしたちは彼[かれ]らの愚[おろ]かさに寛大[かんだい]に付[つ]き合[あ]い、勝利[しょうり]とともにエジプトへ帰[かえ]ってからも、すべての民[たみ]に人間[にんげん]愛[あい]をもって接[せっ]し、ふさわしいことを行[おこな]ってきた。"
  15: "そのうえ、彼[かれ]らの同族[どうぞく]たちすべてに、わたしたちが恨[うら]みを抱[いだ]かないことを知[しら]しめた。彼[かれ]らとの同盟[どうめい]と、初[はじ]めから彼[かれ]らに単純[たんじゅん]に託[たく]されてきた無数[むすう]の事[こと]がらを顧[かえり]み、わたしたちは彼[かれ]らにアレクサンドリア市民[しみん]の権利[けんり]を与[あた]え、永遠[えいえん]の聖[せい]なる祭儀[さいぎ]にあずからせることを望[のぞ]んだ。"
  16: "しかし彼[かれ]らは逆[ぎゃく]の受[う]け取[と]り方[かた]をし、生[う]まれつきの悪[わる]い性[しょう]によって善[ぜん]を退[しりぞ]け、絶[た]えず悪[あく]へと傾[かたむ]いていた。彼[かれ]らは尊[とうと]い市民権[しみんけん]を拒[こば]んだだけでなく、言葉[ことば]の上[うえ]でもひそかにも、彼[かれ]らのうちでわたしたちに誠実[せいじつ]な少数[しょうすう]の者[もの]たちを忌[い]み嫌[きら]った。そして、あの不名誉[ふめいよ]な暮[く]らしぶりによって、わたしたちの事[こと]がらを速[すみ]やかに倒[たお]そうと、折[おり]に触[ふ]れて警戒[けいかい]していた。"
  17: "それゆえ、わたしたちは確[たし]かな証拠[しょうこ]によって、彼[かれ]らがあらゆる点[てん]でわたしたちに悪意[あくい]を抱[いだ]いていると十分[じゅうぶん]に確信[かくしん]した。そして、いつか不意[ふい]の騒乱[そうらん]が起[おこ]ったとき、この不敬[ふけい]な者[もの]たちが背後[はいご]から裏切[うらぎ]る野蛮[やばん]な敵[てき]となることのないよう、備[そな]えようとし、"
  18: "この書簡[しょかん]が届[とど]き次第[しだい]、ただちにかの者[もの]たちを妻子[さいし]もろとも、辱[はずかし]めと乱暴[らんぼう]を加[くわ]えて、四方[しほう]から鉄[てつ]の鎖[くさり]で閉[と]じ込[こ]めたまま、わたしたちのもとへ送[おく]るよう命[めい]じた。彼[かれ]らを敵[てき]にふさわしい、取[と]り返[かえ]しのつかない不名誉[ふめいよ]な死[し]に処[しょ]するためである。"
  19: "彼[かれ]らが一[いっ]斉[せい]に罰[ばつ]されれば、これからの時代[じだい]、わたしたちの事[こと]がらは完全[かんぜん]に安定[あんてい]し、最[もっと]も良[よ]い状態[じょうたい]に整[ととの]えられると考[かんが]えたからである。"
  20: "ユダヤ人[じん]を、老人[ろうじん]から幼[おさな]い子[こ]に至[いた]るまで、また乳飲[ちのみ]子[ご]に至[いた]るまで、誰[だれ]かが匿[かくま]ったなら、その者[もの]は一家[いっか]もろとも最[もっと]も恥[は]ずかしい拷問[ごうもん]を受[う]けて殺[ころ]される。"
  21: "告発[こくはつ]しようとする者[もの]は告発[こくはつ]してよい。その者[もの]は処罰[しょばつ]される者[もの]の財産[ざいさん]を受[う]け取[と]り、王[おう]の金庫[きんこ]から銀[ぎん]二千[にせん]ドラクマを受[う]け、さらに自由[じゆう]の栄誉[えいよ]を授[さず]けられる。"
  22: "ユダヤ人[じん]が匿[かくま]われているのが見[み]つかった場所[ばしょ]は、すべて立[た]ち入[い]りを禁[きん]じられ、火[ひ]を放[はな]たれ、いかなる死[し]すべきものにも永遠[えいえん]に用[もち]いられない所[ところ]となれ。」——書簡[しょかん]の内容[ないよう]はこのとおりであった。"

notes:
  1: "Ἃ καὶ μεταλαμβάνων — «узнав об этом»; ἐξεχόλησεν — «воспылал гневом»; χειρίστῳ μόρῳ — «наихудшей смертью»; οἱ ἐν τῇ χώρᾳ — «живущие в стране» (вне Александрии)."
  2: "οἰκονομουμένων — «когда это устраивалось»; φήμη δυσμενής — «недобрая молва»; ἀφορμή — повод; ὡς ἂν ἀπὸ τῶν νομίμων κωλυόντων — «будто они препятствуют законным (обязанностям)»."
  3: "СТИХ СОЕДИНЁН: gr 3:3+4+5. Верность царям (3), почитание Бога и различие в пище (4), доброе мнение у людей (5). ἀδιάστροφος — «непоколебимый»; χωρισμὸν ἐποίουν ἐπὶ τῷ κατὰ τὰς τροφάς — «отделялись в отношении пищи»; εὐπραξία — доброе поведение."
  4: "СТИХ СОЕДИНЁН: gr 3:6+7. Иноплеменники не вменили в добро доброго поведения (6), но раздували различие в богопочитании и пище (7). διηριθμήσαντο — «сочли, приняли в расчёт»; ὁμοσπόνδους — «союзниками»; περιῆψαν ψόγον — «возложили (на них) поношение»."
  5: "gr 3:8. Ἕλληνες οἱ κατὰ τὴν πόλιν — «эллины в городе»; ταραχὴ ἀπροσδόκητος — «неожиданное смятение»; συνδρομαὶ ἀπρόσκοποι — «беспорядочные сборища»; τυραννικὴ ἡ διάθεσις — «тиранический образ действий»."
  6: "gr 3:9. τηλικοῦτο σύστεμα — «такое множество»; μηδὲν ἠγνοηκός — «ни в чём не повинное»."
  7: "gr 3:10. γείτονες καὶ φίλοι καὶ συμπραγματευόμενοι — соседи, друзья и торговые партнёры; μυστικῶς πίστεις ἐδίδουν — «тайно давали заверения»; συνασπιεῖν — «поднять щит вместе», помочь."
  8: "gr 3:11. τῇ κατὰ τὸ παρὸν εὐημερία γεγαυρωμένος — «кичась нынешним благополучием»; καθορῶν — «усматривая»; ἐπιστολή — письмо, указ (書簡)."
  9: "СТИХ СОЕДИНЁН: gr 3:12+13. Начало указа (12) и «я здоров, и дела наши» (13). χαίρειν καὶ ἐρρῶσθαι — обычная формула приветствия («радоваться и здравствовать»)."
  10: "СТИХ СОЕДИНЁН: gr 3:14+15. Поход в Азию (14) и решение облагодетельствовать Келе-Сирию и Финикию (15). ἀπρόπτωτος συμμαχία — «неколебимая помощь (богов)»; ἐπιείκεια — снисходительность; φιλανθρωπία — человеколюбие (人間愛)."
  11: "gr 3:16. προσόδους — доходы; ἀλιτήριοι — «нечестивцы»; μηδέποτε ληγόντων τῆς ἀνοίας — «никогда не оставляющих безумия»."
  12: "СТИХ СОЕДИНЁН: gr 3:17+18. Приняли на словах, но коварно (17), и не пустили в святилище из древней гордости (18). νόθως — «подложно, притворно»; ἀναθήματα — приношения (奉納物); τύφοι παλαιότεροι — «древнее высокомерие»."
  13: "gr 3:19. ἔκδηλος — явный; ὑψαυχενοῦντες — «держа голову высоко»; γνήσιον — «искреннее, подлинное»."
  14: "gr 3:20. συμπεριενεχθέντες — «снисходя»; μετὰ νίκης διακομισθέντες — «с победой возвратившись»."
  15: "gr 3:21. ἀμνησικακία — непамятозлобие; σκυλμός нет; ἁπλότης — простота; μέτοχοι τῶν ἀεὶ ἱερῶν — «участники вечных священнодействий»."
  16: "СТИХ СОЕДИНЁН: gr 3:22+23. Отвергли доброе по врождённой злобе (22), презрели гражданство и гнушаются немногими верными (23). τοὐναντίον ἐκδεχόμενοι — «приняв противное»; ἀτίμητος πολιτεία — «бесценное гражданство»; ὀλίγοι — немногие."
  17: "gr 3:24. τεκμήρια — доказательства; δυσνοεῖν — злоумышлять; αἰφνίδιος ταραχή — внезапное смятение; κατὰ νώτου προδόται — «предатели в тылу»."
  18: "gr 3:25. αὐθωρί — тотчас; σκυλμοί — издевательства, грабёж; ἀνήκεστος — неисцельный; δυσκλεής — бесславный."
  19: "gr 3:26. διειλήφαμεν — «мы рассудили»; εὐστάθεια — устойчивость; βελτίστη διάθεσις — наилучшее состояние."
  20: "gr 3:27. ἀπὸ γεραιοῦ μέχρι νηπίου καὶ μέχρι τῶν ὑπομαστιδίων — «от старца до младенца и до грудных»; αἴσχισται βάσανοι — «постыднейшие мучения»; πανοικίᾳ — «со всем домом»."
  21: "gr 3:28. μηνύειν — доносить; οὐσία — имущество; δραχμὰς δισχιλίας — две тысячи драхм; ἐλευθερίᾳ στεφανωθήσεται — «будет увенчан свободой»."
  22: "СТИХ СОЕДИНЁН: gr 3:29+30. Проклятие места, где укрыт иудей (29), и заключительная ремарка о содержании письма (30). ἄβατος — «непроходимый»; πυριφλεγής — «объятый огнём»; ὁ τῆς ἐπιστολῆς τύπος — «содержание письма»."
