# jp-box, 3-я Маккавейская, глава 3. Черновик для приёмки.
#
# Нумерация — по Синодальному (ru, 22 стиха); текст — с греческого (gr-lxx-byz,
# 30 стихов); карта книги — в шапке гл. 1. В этой главе соединены:
# 3:3 (gr 3+4+5), 3:4 (gr 6+7), 3:9 (gr 12+13), 3:10 (gr 14+15),
# 3:12 (gr 17+18), 3:16 (gr 22+23), 3:22 (gr 29+30). Остальные — один к одному.
#
# Содержание: ярость царя и приказ истребить всех иудеев (1–2); их верность
# царям и верность закону, из-за которой их чернят (3–5); греки в городе
# сочувствуют, но бессильны (5–6); соседи и торговые партнёры тайно обещают
# помощь (7); царь пишет указ (8–22): поход в Азию, благодеяния, отказ иудеев
# пустить его в святилище, приказ о переписи и казни, награда доносчику,
# проклятие укрывателям.
# Прямая речь: 3:9–22 — указ царя в 「…」 (открывается в 9, закрывается в 22;
# в 22 после закрытия — авторская ремарка). Остальное — повествование.
# 〔…〕 нет; сносок ⟨…⟩ нет. ru — только нумерация и понимание, его чтения
# в текст не вносятся (расхождения отмечены в notes).

