verses:
  1: "乏[とぼ]しさのために多[おお]くの人[ひと]が罪[つみ]を犯[おか]し、富[とみ]を増[ふ]やそうとする者[もの]は目[め]をそらす。"
  2: "石[いし]と石の継[つ]ぎ目[め]には釘[くぎ]が打[う]ち込[こ]まれ、売[う]り買[か]いの間[あいだ]には罪[つみ]が生[しょう]じる。"
  3: "主[しゅ]を恐[おそ]れることのうちに、励[はげ]んで身[み]を保[たも]たないなら、その家[いえ]は間[ま]もなく倒[たお]れる。"
  4: "篩[ふるい]を揺[ゆ]らすと糞[くそ]が残[のこ]る。同じように、人[ひと]の汚[けが]れはその思[おも]いのうちに残る。"
  5: "陶[とう]器[き]は窯[かま]が試[ため]し、人[ひと]の試[し]練[れん]はその思[おも]いのうちにある。"
  6: "木[き]の育[そだ]ちはその実[み]が現[あらわ]す。同じように、心[こころ]の思[おも]いはその言葉[ことば]に現れる。"
  7: "その人[ひと]と語[かた]る前[まえ]に、その人を褒[ほ]めてはならない。これこそ人を試[ため]すものだからである。"
  8: "正[ただ]しさを追[お]い求[もと]めるなら、あなたはそれを捕[つか]まえ、栄光[えいこう]の衣[ころも]のようにそれを着[き]る。"
  9: "鳥[とり]は同[おな]じ類[るい]のもののところに宿[やど]り、真[しん]実[じつ]はそれを行[おこな]う者[もの]のところへ帰[かえ]ってくる。"
  10: "獅子[しし]は獲物[えもの]を待[ま]ち伏[ぶ]せる、同じように罪[つみ]は不正[ふせい]を行[おこな]う者[もの]を待ち伏せる。"
  11: "敬虔[けいけん]な人[ひと]の語[かた]りはいつも知恵[ちえ]である。しかし愚[おろ]かな者[もの]は月[つき]のように変[か]わる。"
  12: "無分別[むふんべつ]な者[もの]の間[あいだ]では時[とき]を惜[お]しみ、悟[さと]りのある者たちの間では絶[た]えず語[かた]れ。"
  13: "愚[おろ]かな者[もの]の話[はなし]は忌[い]まわしいもの、その笑[わら]いは罪[つみ]の放[ほう]縦[じゅう]のうちにある。"
  14: "多[おお]く誓[ちか]う者[もの]の話[はなし]は髪[かみ]を逆[さか]立[だ]たせ、その争[あらそ]いは耳[みみ]を塞[ふさ]ぐ。"
  15: "高[たか]ぶる者[もの]の争[あらそ]いは血[ち]を流[なが]すこと、その罵[ののし]りは耳[みみ]に苦[くる]しい。"
  16: "秘密[ひみつ]を明[あ]かす者[もの]は信[しん]頼[らい]を失[うしな]い、自分[じぶん]の魂[たましい]にふさわしい友[とも]を決[けっ]して見[み]つけることはない。"
  17: "友[とも]を愛[あい]し、彼[かれ]とともに信[しん]実[じつ]であれ。しかし、彼の秘密[ひみつ]を明[あ]かしてしまったなら、その後[あと]を追[お]ってはならない。"
  18: "人[ひと]が自分[じぶん]の死者[ししゃ]を失[うしな]うように、あなたは隣人[りんじん]との友情[ゆうじょう]を失ってしまった。"
  19: "手[て]から鳥[とり]を放[はな]つように、あなたは隣人[りんじん]を手放[てばな]し、もう彼[かれ]を捕[つか]まえることはできない。"
  20: "彼[かれ]を追[お]ってはならない。彼は遠[とお]く離[はな]れ、かもしかが罠[わな]から逃[に]げるように逃げ去ったからである。"
  21: "傷[きず]は包[つつ]むことができ、ののしりも和解[わかい]できる。しかし秘密[ひみつ]を明[あ]かした者[もの]は望[のぞ]みを失[うしな]った。"
  22: "目[め]で合図[あいず]する者[もの]は悪[あく]を企[くわだ]てるが、だれもそれを彼[かれ]から遠[とお]ざけることはできない。"
  23: "あなたの目[め]の前[まえ]では彼[かれ]の口[くち]は甘[あま]く、あなたの言葉[ことば]に感心[かんしん]する。しかし後[あと]になって口を歪[ゆが]め、あなたの言葉に罠[わな]を仕掛[しか]ける。"
  24: "わたしは多[おお]くのことを憎[にく]んだが、彼[かれ]ほどには憎まなかった。主[しゅ]も彼を憎まれる。"
  25: "高[たか]みへ石[いし]を投[な]げる者[もの]は、自分[じぶん]の頭[あたま]に投げている。偽[いつわ]りの打[う]撃[げき]は傷[きず]を開[ひら]く。"
  26: "穴[あな]を掘[ほ]る者[もの]は自分[じぶん]の穴に落[お]ち、罠[わな]を掛[か]ける者はその罠にかかる。"
  27: "悪[わる]を行[おこな]う者[もの]にはその悪が転[ころ]がり込[こ]み、それがどこから来[き]たのか彼[かれ]は知[し]ることもない。"
  28: "嘲[あざけ]りと辱[はずかし]めは高[たか]ぶる者[もの]に帰[き]し、復讐[ふくしゅう]は獅子[しし]のように彼[かれ]を待[ま]ち伏[ぶ]せる。"
  29: "敬虔[けいけん]な人[ひと]の倒[たお]れを喜[よろこ]ぶ者[もの]たちは罠[わな]にかかり、苦[くる]しみが彼らを死[し]ぬ前[まえ]に食[く]い尽[つ]くす。"
  30: "怒[いか]りと激[げき]しい憤[いきどお]り、これらは忌[い]むべきものである。罪[つみ]深[ぶか]い者[もの]はそれらに支配[しはい]される。"

notes:
  1: "χάριν διαφόρου πολλοὶ ἥμαρτον — 乏しさのために多くの人が罪を犯し (διάφορος — различный, иной; выражение тёмное; слав. «за скудость», Синод. «ради маловажных вещей»). ὁ ζητῶν πληθῦναι ἀποστρέψει ὀφθαλμόν — 富を増やそうとする者は目をそらす (πληθύνω — умножать; ἀποστρέφω — отвращать; слав. «ищай обогатети отвратит око»)."
  2: "ἀνὰ μέσον ἁρμῶν λίθων παγήσεται πάσσαλος — 石と石の継ぎ目には釘が打ち込まれ (ἁρμός — стык, скрепа; πάσσαλος — кол, гвоздь; слав. «посреде собраных камений вонзется кол»). ἀνὰ μέσον πράσεως καὶ ἀγορασμοῦ συντριβήσεται ἁμαρτία — 売り買いの間には罪が生じる (πρᾶσις — продажа; ἀγορασμός — купля; συντρίβω — сокрушать; слав. «совершится грех»)."
  3: "ἐὰν μὴ ἐν φόβῳ κυρίου κρατήσῃ κατὰ σπουδήν — 主を恐れることのうちに励んで身を保たないなら (κρατέω — держаться; σπουδή — усердие, тщание; слав. «аще не держится страха Господня со тщанием»). ἐν τάχει καταστραφήσεται αὐτοῦ ὁ οἶκος — その家は間もなく倒れる (καταστρέφω — ниспровергать; слав. «вскоре превратится дом его»)."
  4: "Ἐν σείσματι κοσκίνου διαμένει κοπρία — 篩を揺らすと糞が残る (σεῖσμα — трясение; κόσκινον — решето; κοπρία — навоз; слав. «трясением решета останет сметие»). οὕτως σκύβαλα ἀνθρώπου ἐν λογισμῷ αὐτοῦ — 人の汚れはその思いのうちに残る (σκύβαλον — сор, нечистота; λογισμός — помысел)."
  5: "σκεύη κεραμέως δοκιμάζει κάμινος — 陶器は窯が試す (κεραμεύς — горшечник; κάμινος — печь; слав. «сосуды скудельничи искушает пещь»). πειρασμὸς ἀνθρώπου ἐν διαλογισμῷ αὐτοῦ — 人の試練はその思いのうちにある (πειρασμός — испытание; διαλογισμός — размышление, помысел)."
  6: "γεώργιον ξύλου ἐκφαίνει ὁ καρπὸς αὐτοῦ — 木の育ちはその実が現す (γεώργιον — возделывание, уход; ἐκφαίνω — выявлять). οὕτως λόγος ἐνθυμήματος καρδίας ἀνθρώπου — 心の思いはその言葉に現れる (ἐνθύμημα — помысел, замысел)."
  7: "πρὸ λογισμοῦ μὴ ἐπαινέσῃς ἄνδρα — その人と語る前に褒めてはならない (πρό — прежде; λογισμός — мысль, беседа; слав. «прежде беседы»). οὗτος γὰρ πειρασμὸς ἀνθρώπων — これこそ人を試すもの (πειρασμός — испытание)."
  8: "Ἐὰν διώκῃς τὸ δίκαιον — 正しさを追い求めるなら (διώκω — гнать, преследовать). καταλήμψῃ καὶ ἐνδύσῃ αὐτὸ ὡς ποδήρη δόξης — それを捕まえ、栄光の衣のように着る (ποδήρης — длинная одежда, подир; слав. «яко в подир славы»)."
  9: "πετεινὰ πρὸς τὰ ὅμοια αὐτοῖς καταλύσει — 鳥は同じ類のところに宿る (καταλύω — останавливаться, гнездиться). ἀλήθεια πρὸς τοὺς ἐργαζομένους αὐτὴν ἐπανήξει — 真理はそれを行う者のところへ帰る (ἐπανήκω — возвращаться; слав. «обратится»)."
  10: "λέων θήραν ἐνεδρεύει — 獅子は獲物を待ち伏せる (θήρα — добыча, охота; ἐνεδρεύω — подстерегать). οὕτως ἁμαρτία ἐργαζομένους ἄδικα — 罪は不正を行う者を待ち伏せる (ἄδικος — неправедный)."
  11: "διήγησις εὐσεβοῦς διὰ παντὸς σοφία — 敬虔な人の語りはいつも知恵 (διήγησις — рассказ, беседа; слав. «повесть»). ὁ δὲ ἄφρων ὡς σελήνη ἀλλοιοῦται — 愚かな者は月のように変わる (ἄφρων — безумный; ἀλλοιόω — изменять; слав. «яко луна изменяется»)."
  12: "εἰς μέσον ἀσυνέτων συντήρησον καιρόν — 無分別な者の間では時を惜しめ (ἀσύνετος — неразумный; συντηρέω — соблюдать, беречь; καιρός — время; слав. «блюди время»). εἰς μέσον δὲ διανοουμένων ἐνδελέχιζε — 悟りのある者の間では絶えず語れ (διανοέομαι — размышлять; ἐνδελεχίζω — пребывать постоянно)."
  13: "διήγησις μωρῶν προσόχθισμα — 愚かな者の話は忌まわしいもの (προσόχθισμα — досада, мерзость; слав. «мерзость»). ὁ γέλως αὐτῶν ἐν σπατάλῃ ἁμαρτίας — その笑いは罪の放縦のうちにある (σπατάλη — распутство, роскошь; слав. «во услаждении греха»)."
  14: "λαλιὰ πολυόρκου ἀνορθώσει τρίχας — 多く誓う者の話は髪を逆立てる (λαλιά — речь, болтовня; πολύορκος — много клянущийся; ἀνορθόω — поднимать; слав. «подимет власы»). ἡ μάχη αὐτῶν ἐμφραγμὸς ὠτίων — その争いは耳を塞ぐ (ἐμφραγμός — заграждение; οὖς — ухо)."
  15: "ἔκχυσις αἵματος μάχη ὑπερηφάνων — 高ぶる者の争いは血を流すこと (ἔκχυσις — излияние; ὑπερήφανος — надменный). ἡ διαλοιδόρησις αὐτῶν ἀκοὴ μοχθηρά — その罵りは耳に苦しい (διαλοιδόρησις — брань, поношение; ἀκοή — слух; μοχθηρός — тяжкий)."
  16: "Ὁ ἀποκαλύπτων μυστήρια ἀπώλεσεν πίστιν — 秘密を明かす者は信頼を失う (ἀποκαλύπτω — открывать; μυστήριον — тайна; πίστις — верность, доверие). οὐ μὴ εὕρῃ φίλον πρὸς τὴν ψυχὴν αὐτοῦ — 自分の魂にふさわしい友を見つけることは決してない (πρὸς τὴν ψυχήν — по душе; слав. «друга противу души своея»)."
  17: "στέρξον φίλον καὶ πιστώθητι μετ᾿ αὐτοῦ — 友を愛し、彼とともに信実であれ (στέργω — любить; πιστόω — быть верным). ἐὰν δὲ ἀποκαλύψῃς τὰ μυστήρια αὐτοῦ, μὴ καταδιώξῃς ὀπίσω αὐτοῦ — 秘密を明かしたなら、その後を追うな (καταδιώκω — преследовать)."
  18: "καθὼς γὰρ ἀπώλεσεν ἄνθρωπος τὸν νεκρὸν αὐτοῦ — 人が自分の死者を失うように (νεκρός — мёртвый; слав. читает «врага своего» — иное чтение). οὕτως ἀπώλεσας τὴν φιλίαν τοῦ πλησίον — 隣人との友情を失った (φιλία — дружба; πλησίον — ближний)."
  19: "ὡς πετεινὸν ἐκ χειρός σου ἀπέλυσας — 手から鳥を放つように (ἀπολύω — отпускать). ἀφῆκας τὸν πλησίον καὶ οὐ θηρεύσεις αὐτόν — 隣人を手放し、もう捕まえられない (θηρεύω — ловить; слав. «не уловиши его»)."
  20: "μὴ αὐτὸν διώξῃς — 彼を追うな (διώκω — гнать). μακρὰν ἀπέστη καὶ ἐξέφυγεν ὡς δορκὰς ἐκ παγίδος — 遠く離れ、かもしかが罠から逃げるように逃げ去った (δορκάς — косуля, серна; παγίς — сеть, петля; слав. «яко серна от сети»)."
  21: "τραῦμα ἔστιν καταδῆσαι — 傷は包むことができる (τραῦμα — рана; καταδέω — перевязывать). λοιδορίας ἔστιν διαλλαγή — ののしりも和解できる (λοιδορία — брань; διαλλαγή — примирение). ὁ ἀποκαλύψας μυστήρια ἀφήλπισεν — 秘密を明かした者は望みを失った (ἐλπίζω — надеяться; слав. «погуби верность»)."
  22: "Διανεύων ὀφθαλμῷ τεκταίνει κακά — 目で合図する者は悪を企てる (διανεύω — мигать, подавать знак; τεκταίνω — устраивать, замышлять; слав. «помизаяй оком»). οὐδεὶς αὐτὰ ἀποστήσει ἀπ᾽ αὐτοῦ — だれもそれを彼から遠ざけられない (ἀφίστημι — отставлять)."
  23: "ἀπέναντι τῶν ὀφθαλμῶν σου γλυκανεῖ τὸ στόμα αὐτοῦ — あなたの目の前で彼の口は甘い (γλυκαίνω — делать сладким; слав. «усладит уста своя»). ἐπὶ τῶν λόγων σου ἐκθαυμάσει — あなたの言葉に感心する (ἐκθαυμάζω — удивляться). ὕστερον δὲ διαστρέψει τὸ στόμα αὐτοῦ — 後になって口を歪める (διαστρέφω — извращать). ἐν τοῖς λόγοις σου δώσει σκάνδαλον — あなたの言葉に罠を仕掛ける (σκάνδαλον — соблазн, ловушка)."
  24: "πολλὰ ἐμίσησα καὶ οὐχ ὡμοίωσα αὐτῷ — 多くのことを憎んだが、彼ほどには憎まなかった (μισέω — ненавидеть; ὁμοιόω — уподоблять; слав. «многая возненавидех и не обретох подобна ему»). ὁ κύριος μισήσει αὐτόν — 主も彼を憎まれる."
  25: "ὁ βάλλων λίθον εἰς ὕψος ἐπὶ κεφαλὴν αὐτοῦ βάλλει — 高みへ石を投げる者は自分の頭に投げている (βάλλω — бросать; ὕψος — высота). πληγὴ δολία διελεῖ τραύματα — 偽りの打撃は傷を開く (δολία — коварная; διαιρέω — разделять, рассекать; слав. «язва льстива раздерет струпы»)."
  26: "ὁ ὀρύσσων βόθρον εἰς αὐτὸν ἐμπεσεῖται — 穴を掘る者は自分の穴に落ちる (ὀρύσσω — копать; βόθρος — яма). ὁ ἱστῶν παγίδα ἐν αὐτῇ ἁλώσεται — 罠を掛ける者はその罠にかかる (ἵστημι — ставить; ἁλίσκομαι — попадать, быть пойманным)."
  27: "ὁ ποιῶν πονηρά, εἰς αὐτὸν κυλισθήσεται — 悪を行う者にはその悪が転がり込む (κυλίω — катить; слав. «ввалится в не»). οὐ μὴ ἐπιγνῷ πόθεν ἥκει αὐτῷ — それがどこから来たのか知ることもない (ἐπιγινώσκω — узнавать)."
  28: "ἐμπαιγμὸς καὶ ὀνειδισμὸς ὑπερηφάνῳ — 嘲りと辱めは高ぶる者に帰し (ἐμπαιγμός — насмешка; ὀνειδισμός — поношение). ἡ ἐκδίκησις ὡς λέων ἐνεδρεύσει αὐτόν — 復讐は獅子のように彼を待ち伏せる (ἐκδίκησις — мщение)."
  29: "παγίδι ἁλώνται οἱ εὐφραινόμενοι πτώσει εὐσεβῶν — 敬虔な人の倒れを喜ぶ者たちは罠にかかる (πτῶσις — падение; слав. «веселящиися о падении благоверных»). ὀδύνη καταναλώσει αὐτοὺς πρὸ τοῦ θανάτου αὐτῶν — 苦しみが彼らを死ぬ前に食い尽くす (ὀδύνη — боль, скорбь; καταναλίσκω — пожирать)."
  30: "Μῆνις καὶ ὀργή — 怒りと激しい憤り (μῆνις — гнев, злоба). ταῦτά ἐστιν βδελύγματα — これらは忌むべきもの (βδέλυγμα — мерзость). ἀνὴρ ἁμαρτωλὸς ἐγκρατὴς ἔσται αὐτῶν — 罪深い者はそれらに支配される (ἐγκρατής — владеющий; слав. «одержан ими будет»)."
