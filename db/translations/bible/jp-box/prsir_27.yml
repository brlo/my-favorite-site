# jp-box, Сирах, глава 27. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc в книге нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 27: бедность, богатство и грех (1–3), испытание в помысле (4–7), искание
# правды (8–10), речь мудрого и глупого (11–15), тайна и дружба (16–21), коварство
# и его оборот (22–27), гордость, мщение и гнев (28–30). Прямой речи нет: всё —
# авторское поучение; красного и синего в Ветхом Завете нет.
# Нумерация по gr: 30 стихов. Слав. 27:1–33: деление дробит греч. (5+6 = гр 5;
# 7–9 = гр 6; 17+18 = гр 17; 22+23 = гр 21; 25+26 = гр 23; 31–33 = гр 28–30);
# лишние слав. стихи влиты по содержанию, стихов не добавлено.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).

