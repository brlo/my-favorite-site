verses:
  1: "誇[ほこ]ることは必要[ひつよう]である。もっとも、益[えき]にはならないが。しかし、わたしは幻[まぼろし]と主[しゅ]の啓示[けいじ]へと進[すす]もう。"
  2: "わたしは、キリストにある一人[ひとり]の人[ひと]を知[し]っている。十四[じゅうよ]年[ねん]前[まえ]のことである。その人[ひと]が体[からだ]のままだったのか、体[からだ]の外[そと]だったのか、わたしは知[し]らない。神[かみ]が知[し]っておられる。そのような人[ひと]が第三[だいさん]の天[てん]⟨ユダヤの言[い]い伝[つた]えでは、天[てん]は幾重[いくえ]にも重[かさ]なり、第三[だいさん]の天[てん]は楽園[らくえん]のある天[てん]とされた。⟩にまで引[ひ]き上[あ]げられたのである。"
  3: "わたしは、そのような人[ひと]のことを知[し]っている。その人[ひと]が体[からだ]のままだったのか、体[からだ]を離[はな]れていたのか、わたしは知[し]らない。神[かみ]が知[し]っておられる。"
  4: "そして、その人[ひと]は楽園[らくえん]に引[ひ]き上[あ]げられ、人[ひと]が語[かた]ることを許[ゆる]されない、言[い]い表[あらわ]し難[がた]い言葉[ことば]を聞[き]いたのである。"
  5: "わたしは、そのような人[ひと]のことを誇[ほこ]ろう。しかし、自分[じぶん]のことは誇[ほこ]らない。ただ、わたしの弱[よわ]さのほかは誇らない。"
  6: "なぜなら、わたしが誇[ほこ]ろうとしても、愚[おろ]かな者[もの]にはならないからである。真理[しんり]を言[い]うからである。しかし、わたしは慎[つつし]む。だれかが、わたしについて見[み]ること、あるいはわたしから聞[き]くこと以上[いじょう]のことを、わたしについて思[おも]わないようにするためである。"
  7: "また、その啓示[けいじ]のあまりの大[おお]きさのゆえに、わたしが高[たか]ぶり過[す]ぎないように、わたしの肉[にく]にとげが与[あた]えられた。すなわち、サタンの使[つか]いである。それは、わたしを打[う]ち、わたしを高[たか]ぶらせないためである。"
  8: "このことのために、わたしは三度[さんど]主[しゅ]に願[ねが]って、わたしから離[はな]れるようにと求[もと]めた。"
  9: "そして、主[しゅ]はわたしに言[い]われた。「<j>わたしの{恵[めぐ]み|恩寵[おんちょう]}はあなたに足[た]りる。わたしの力[ちから]は弱[よわ]さのうちに完成[かんせい]されるからである。</j>」そこで、わたしはむしろ喜[よろこ]んで自分[じぶん]の弱[よわ]さを誇[ほこ]ろう。キリストの力[ちから]がわたしの上[うえ]に宿[やど]るためである。"
  10: "それゆえ、わたしはキリストのためなら、弱[よわ]さ、侮辱[ぶじょく]、窮乏[きゅうぼう]、迫[はく]害[がい]、行[い]き詰[づ]まりを喜[よろこ]んで受[う]け入[い]れる。なぜなら、わたしが弱[よわ]いとき、そのときこそ、わたしは強[つよ]いからである。"
  11: "わたしは愚[おろ]かな者[もの]になった。あなたがたが、わたしをそうさせたのである。わたしはむしろ、あなたがたから推薦[すいせん]されるべきであった。わたしは何[なに]でもない者[もの]ではあるが、あの超[ちょう]使徒[しと]たちに少[すこ]しも劣[おと]っていないからである。"
  12: "使徒[しと]のしるしは、あなたがたの間[あいだ]で、すべての忍耐[にんたい]をもって行[おこな]われた。すなわち、しるしと奇[き]跡[せき]と力[ちから]あるわざとによってである。"
  13: "あなたがたがほかの教会[きょうかい]に比[くら]べて劣[おと]っているところがあるだろうか。ただ一[ひと]つ、わたし自身[じしん]があなたがたに負担[ふたん]をかけなかったことだけである。この不当[ふとう]を、どうかわたしに赦[ゆる]してほしい。"
  14: "見[み]よ、わたしはこれで三度[さんど]目[め]、あなたがたのもとへ行[い]く用意[ようい]ができている。そして、あなたがたに負担[ふたん]はかけない。わたしが求[もと]めるのは、あなたがたのものではなく、あなたがた自身[じしん]だからである。子[こ]は親[おや]のために蓄[たくわ]えるべきではなく、親が子のために蓄えるべきである。"
  15: "わたしは、あなたがたの魂[たましい]のために、喜[よろこ]んで費[つか]い、また自分[じぶん]自身[じしん]をも費[つか]い尽[つ]くそう。わたしがあなたがたをいっそう愛[あい]するなら、かえって愛[あい]されないのだろうか。"
  16: "しかし、そうだとしても、わたしはあなたがたに重[おも]い負担[ふたん]を負[お]わせなかった。いや、わたしはずる賢[かしこ]い者[もの]として、欺[あざむ]きによってあなたがたを捕[つか]まえた、というのである。"
  17: "わたしがあなたがたに遣[つか]わした者[もの]のうち、だれかによって、わたしがあなたがたから利[り]を得[え]たことがあるか。"
  18: "わたしはテトスに頼[たの]み、兄弟[きょうだい]を一人[ひとり]彼[かれ]とともに遣[つか]わした。テトスがあなたがたから利[り]を得[え]たことがあるか。わたしたちは同[おな]じ霊[れい]によって歩[あゆ]んだのではないか。同[おな]じ足跡[あしあと]を踏[ふ]んだのではないか。"
  19: "あなたがたは、わたしたちがあなたがたに弁明[べんめい]していると、ずっと思[おも]っているのか。わたしたちは、キリストにあって、神[かみ]の前[まえ]で語[かた]っているのである。愛[あい]する者[もの]たちよ、すべてはあなたがたの建[けん]設[せつ]のためのものである。"
  20: "なぜなら、わたしは恐[おそ]れているからである。行[い]ってみたとき、あなたがたがわたしの望[のぞ]むような者[もの]ではなく、わたしがあなたがたの望[のぞ]まないような者[もの]であることが見[み]つかるのではないか、と。また、争[あらそ]い、妬[ねた]み、怒[いか]り、党[とう]争[そう]、中傷[ちゅうしょう]、陰口[かげぐち]、高[たか]ぶり、混乱[こんらん]があるのではないか、と。"
  21: "また、わたしが行[い]ったとき、わたしの神[かみ]があなたがたの前[まえ]でわたしを辱[はずかし]め、先[さき]に罪[つみ]を犯[おか]して、その行[おこな]った汚[けが]れ、淫行[いんこう]、好色[こうしょく]を悔[く]い改[あらた]めなかった多[おお]くの人[ひと]のために、わたしが悲[かな]しむことにならないように。"

notes:
  1: "ὀπτασία — 幻. ἀποκάλυψις — 啓示. οὐ συμφέρον μέν — «хотя и не полезно»; 益にはならないが. δεῖ — 必要である."
  2: "ἐν Χριστῷ — キリストにある. πρὸ ἐτῶν δεκατεσσάρων — 十四年前. εἴτε ἐν σώματι… οὐκ οἶδα — «в теле ли — не знаю»; греч. вставки переданы отдельными предложениями. ἁρπαγέντα — «восхищен»; 引き上げられた. τρίτος οὐρανός — 第三の天, сноска. Стих целиком есть в gr-lxx-byz — 〔〕 нет."
  3: "Повтор мысли 12:2 (в греч. иной порядок слов и χωρὶς вместо ἐκτός); сохранён."
  4: "παράδεισος — 楽園. ἄρρητα ῥήματα — 言い表し難い言葉. οὐκ ἐξὸν ἀνθρώπῳ λαλῆσαι — 人が語ることを許されない."
  5: "ὑπὲρ τοῦ τοιούτου — そのような人のこと. εἰ μὴ ἐν ταῖς ἀσθενείαις [μου] — 弱さのほかは; [μου] в базе есть — 〔〕 нет."
  6: "ἄφρων — 愚かな者. φείδομαι — «щажу, воздерживаюсь»; 慎む. ὑπὲρ ὃ βλέπει… ἢ ἀκούει [τι] — 見ること、聞くこと以上; [τι] в базе есть."
  7: "ὑπερβολὴ τῶν ἀποκαλύψεων — 啓示のあまりの大きさ (в греч. висит в начале стиха после 12:6). σκόλοψ τῇ σαρκί — «жало, кол в плоть»; とげ, не «болезнь» (ср. jp-joc「刺」). ἄγγελος Σατανᾶ — サタンの使い. κολαφίζῃ — «бить кулаком»; 打つ. Двойное ἵνα μὴ ὑπεραίρωμαι сохранено; ἵνα в базе есть — 〔〕 нет."
  8: "τρὶς τὸν κύριον παρεκάλεσα — 三度主に願った. ἀποστῇ — 離れる."
  9: "Слова Господа — прямая речь, красным в <j>…</j> и в 「」; «主はわたしに言われた」 — слова Павла, не красные. Ἀρκεῖ σοι — «довольно тебе»; あなたに足りる. τελεῖται — «совершается, достигает цели»; 完成される. ἐπισκηνώσῃ — «обитает, осенит»; 宿る."
  10: "εὐδοκῶ — «благоволю»; 喜んで受け入れる. ὕβρεις — 侮辱. ἀνάγκαι — 窮乏. στενοχωρίαι — 行き詰まり. ὅταν ἀσθενῶ, τότε δυνατός εἰμι — 弱いとき、そのときこそ強い."
  11: "Γέγονα ἄφρων — 愚かな者になった. ἠναγκάσατε — そうさせた. ὤφειλον — べきであった. ὑπερλίαν ἀποστόλων — 超使徒 (см. 11:5)."
  12: "σημεῖα, τέρατα, δυνάμεις — しるし、奇跡、力あるわざ. ἐν πάσῃ ὑπομονῇ — すべての忍耐をもって."
  13: "ἡσσώθητε — 劣っている. κατενάρκησα — 負担をかけなかった. χαρίσασθέ μοι τὴν ἀδικίαν ταύτην — ирония; この不当を赦してほしい."
  14: "τρίτον τοῦτο — これで三度目. ὀφείλει — べきである. θησαυρίζειν — 蓄える."
  15: "ἥδιστα — 喜んで. δαπανήσω καὶ ἐκδαπανηθήσομαι — 費い、費い尽くす. εἰ περισσοτέρως… ἧσσον — риторический вопрос; いっそう愛するなら、かえって愛されないのか."
  16: "ἔστω δέ — «пусть так»; そうだとしても. πανοῦργος — ずる賢い. δόλῳ — 欺きによって. ἔλαβον — «взял»; 捕まえた."
  17: "πλεονέκτησα — «получил выгоду»; 利を得た."
  18: "Τίτος — テトス. τῷ αὐτῷ πνεύματι — 同じ霊. ἴχνη — 足跡."
  19: "ἀπολογούμεθα — 弁明する. κατέναντι θεοῦ — 神の前で. οἰκοδομή — 建設."
  20: "φοβοῦμαι — 恐れている. ἔρις, ζῆλος, θυμοί, ἐριθεῖαι, καταλαλιαί, ψιθυρισμοί, φυσιώσεις, ἀκαταστασίαι — все восемь сохранены; 党争、中傷、陰口、高ぶり、混乱."
  21: "ταπεινώσῃ — 辱める. προημαρτηκότων — 先に罪を犯した者. ἀκαθαρσία, πορνεία, ἀσελγεία — 汚れ、淫行、好色. πενθήσω — 悲しむ."
