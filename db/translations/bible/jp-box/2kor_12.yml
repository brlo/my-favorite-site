# jp-box, Второе послание к Коринфянам, глава 12. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 12: видения и откровения, восхищение до третьего неба (1–6),
# жало в плоть и сила в немощи (7–10), знамения апостола (11–13),
# третье посещение и страх Павла (14–21).
# Красное одно: 12:9 — прямая речь Господа в <j>…</j> и в 「」 («довольно для тебя
# благодати Моей…»). Слова Павла «主はわたしに言われた» — не красные. <mo> нет.
# 〔…〕 в главе нет: проверено по базе — все 21 стих в gr-lxx-byz на месте (`.` нет);
# 12:7 ἵνα (оба раза), 12:5 [μου], 12:6 [τι] в базе есть — не оборачиваются; 12:2 целиком есть.
# Сноска ⟨…⟩ одна: 12:2 第三の天 — первое место в корпусе, читателю-нехристианину неочевидно.
# jp-ni не использовался.

