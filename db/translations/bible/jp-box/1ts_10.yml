# jp-box, 1-я Царств, глава 10. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc и jp-ni в книге нет.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы — по греческому.
# Глава 10: помазание Саула и три знамения (1–8), исполнение знамений: иное сердце
# и сонм пророков (9–13), расспросы родственника (14–16), собрание в Массифе
# и жребий (17–24), устав царства и отпуск народа (25), возвращение в Гиву
# и негодные люди (26–27).
# Речи — 「…」: Самуил (1–8, 24), народ (11), вопрошающий и поговорка (12),
# родственник (14, 15), Саул (14, 16), Господь (22), народ (24), негодные (27).
# Слова Бога внутри речи Самуила (18–19) — 『…』. Красного нет.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (проверено по базе); слав. добавления
# (10:2, 10:12, 10:19) в текст не внесены — см. notes.
# Сносок ⟨…⟩ нет: 預言者, 燔祭, 酬恩祭, 契約, 嗣業 уже пояснены в корпусе; новых
# терминов в главе нет (ナシブ — транслитерация, пояснён в notes).
# Отличия LXX: 10:1 — ἄρχων «правитель», а не βασιλεύς; 10:2 — в csl добавлено
# «в Силоме, в Вакалафе»; 10:5 — «отряд филистимлян» (ἀνάστημα) и Насив;
# 10:12 — вопрос «кто отец его» без слав. «не кис ли?»; 10:19 — в csl добавлено
# «и по тысячам вашим»; 10:21 — племя Ματταρι (マタリ), в ru «Матриево»;
# 10:22 — «сосуды» (σκεύη), т. е. поклажа, в ru «обоз»; 10:27 — в ru добавлено
# «но он как бы не замечал того», в gr и csl этого нет.

tr_code: jp-box
book: 1ts
chapter: 10
draft: true

verses:
  1: "サムエルは油[あぶら]の入[はい]った器[うつわ]を取[と]り、その頭[あたま]に注[そそ]ぎ、彼[かれ]に口[くち]づけをして言[い]った。「主[しゅ]はあなたに油を注いで、ご自分[じぶん]の民[たみ]、イスラエルの上[うえ]の指導者[しどうしゃ]とされたのではないか。あなたは主の民を治[おさ]め、彼[かれ]らを周[まわ]りの敵[てき]の手[て]から救[すく]う。これが、主があなたに油を注いでご自分の嗣業[しぎょう]の指導者とされたことの、あなたへのしるしだ。"
  2: "今日[きょう]、あなたがわたしのもとを離[はな]れて行[い]くと、ベニヤミンの境界[きょうかい]にあるラケルの墓[はか]のそばで、二人[ふたり]の男[おとこ]に会[あ]う。彼らは大[おお]きく跳[は]ねながら、あなたにこう言[い]う。『あなたがたが探[さが]しに行[い]った雌[めす]ろばは見[み]つかった。見[み]よ、あなたの父[ちち]は、ろばのことを忘[わす]れて、あなたがたのことをひどく気[き]にかけ、息子[むすこ]のためにどうしようかと言[い]っている』と。"
  3: "そこからさらに進[すす]んで、あなたはタボルの樫[かし]の木[き]に至[いた]る。そこで、神[かみ]のもとへベテルに上[のぼ]って行[い]く三人[さんにん]の男[おとこ]に会う。一人[ひとり]は三匹[さんびき]の子[こ]やぎを、一人は三つのパンの入[はい]った器[うつわ]を、もう一人はぶどう酒[しゅ]の皮袋[かわぶくろ]を負[お]っている。"
  4: "彼[かれ]らはあなたに平安[へいわ]を尋[たず]ね、初穂[はつほ]のパン二[ふた]つをあなたに与[あた]える。あなたはそれを彼[かれ]らの手[て]から受[う]け取[と]る。"
  5: "その後[のち]、あなたは神[かみ]の丘[おか]へ行[い]く。そこにはペリシテ人[じん]の守備隊[しゅびたい]があり、ペリシテ人のナシブがいる。あなたがそこから町[まち]へ入[はい]ると、高[たか]き所[ところ]から下[くだ]って来[く]る預言者[よげんしゃ]の群[む]れに会[あ]う。彼[かれ]らの前[まえ]には琴[こと]と太鼓[たいこ]と笛[ふえ]と竪琴[たてごと]があり、彼らは預言[よげん]している。"
  6: "そのとき、主[しゅ]の霊[れい]があなたの上[うえ]に臨[のぞ]み、あなたは彼[かれ]らとともに預言[よげん]して、別[べつ]の人[ひと]に変[か]わる。"
  7: "これらのしるしがあなたに起[お]こったなら、あなたの手[て]に見[み]つかることは何[なん]でもしなさい。神[かみ]があなたとともにいるからだ。"
  8: "あなたはわたしより先[さき]にギルガルへ下[くだ]って行[い]きなさい。見[み]よ、わたしはあなたのところへ下って行って、燔祭[はんさい]と酬恩祭[しゅうおんさい]をささげる。あなたは七日[なぬか]の間[あいだ]、わたしがあなたのところへ行[い]くまで待[ま]ちなさい。そうすれば、あなたが何[なに]をすべきかを示[しめ]そう。」"
  9: "サウルがサムエルから離[はな]れようとして背[せ]を向[む]けたとき、神[かみ]は彼[かれ]に別[べつ]の心[こころ]を与[あた]えた。その日[ひ]、あのしるしはすべて彼の上[うえ]に起[お]こった。"
  10: "彼[かれ]はそこから丘[おか]へ行[い]った。すると、見[み]よ、預言者[よげんしゃ]の群[む]れが彼[かれ]の方[ほう]へ向[む]かって来[き]た。神[かみ]の霊[れい]が彼[かれ]の上[うえ]に臨[のぞ]み、彼[かれ]は彼らの間[あいだ]で預言[よげん]した。"
  11: "昨日[きのう]も一昨日[おととい]も彼[かれ]を知[し]っていた者[もの]たちは、彼[かれ]が預言者[よげんしゃ]たちの間[あいだ]で預言[よげん]しているのを見[み]て、民[たみ]の者[もの]がそれぞれ隣人[りんじん]に言[い]った。「キスの子[こ]に何[なに]が起[お]こったのか。サウルも預言者の中にいるのか。」"
  12: "すると、そのうちの一人[ひとり]が答[こた]えて言[い]った。「だが、彼[かれ]らの父[ちち]はだれか。」それゆえ、これはことわざになった。「サウルも預言者[よげんしゃ]の中にいるのか」と。"
  13: "彼[かれ]は預言[よげん]を終[お]えると、丘[おか]へ行[い]った。"
  14: "サウルのおじが、彼[かれ]とその若者[わかもの]に言[い]った。「どこへ行[い]って来[き]たのか。」サウルは言[い]った。「わたしたちは雌[めす]ろばを探[さが]しに行[い]ったが、いなかったので、サムエルのところへ行って来た。」"
  15: "おじはサウルに言[い]った。「サムエルがあなたに何[なに]と言[い]ったのか、わたしに話[はな]してくれ。」"
  16: "サウルはおじに言[い]った。「雌[めす]ろばが見[み]つかったと、わたしに告[つ]げてくれた。」しかし、王国[おうこく]のことを告[つ]げられた言葉[ことば]については、彼[かれ]に話[はな]さなかった。"
  17: "サムエルは民[たみ]すべてを、主[しゅ]のもとへ、ミツパに呼[よ]び集[あつ]めた。"
  18: "そして、イスラエルの子[こ]らに言[い]った。「イスラエルの神[かみ]である主[しゅ]はこう言[い]われる。『わたしはイスラエルの子らをエジプトから上[のぼ]らせ、あなたがたをファラオ、エジプトの王[おう]の手[て]から、またあなたがたを苦[くる]しめるすべての王国[おうこく]の手[て]から救[すく]い出[だ]した。"
  19: "しかし、あなたがたは今日[きょう]、あなたがたのすべての災[わざわ]いと苦[くる]しみから救[すく]ってくださる神[かみ]ご自身[じしん]を侮[あなど]り、『いいえ、わたしたちの上[うえ]に王[おう]を立[た]てよ』と言[い]った。今[いま]、あなたがたの部族[ぶぞく]ごと、氏族[しぞく]ごとに、主[しゅ]の前[まえ]に立[た]ちなさい。』」"
  20: "サムエルはイスラエルのすべての部族[ぶぞく]を近[ちか]づけ、くじを引[ひ]かせた。すると、ベニヤミンの部族[ぶぞく]がくじに当[あ]たった。"
  21: "彼[かれ]はベニヤミンの部族[ぶぞく]を氏族[しぞく]ごとに近づけ、くじを引かせた。すると、マタリの氏族[しぞく]が当[あ]たった。彼[かれ]はマタリの氏族を男[おとこ]ごとに近づけ、くじを引かせた。すると、キスの子[こ]サウルが当たった。人々[ひとびと]は彼[かれ]を探[さが]したが、見[み]つからなかった。"
  22: "そこで、彼[かれ]らはさらに主[しゅ]に尋[たず]ねた。「あの男[おとこ]はまだここへ来[こ]ないのか。」主[しゅ]は言[い]われた。「見[み]よ、彼[かれ]は荷物[にもつ]の中[なか]に隠[かく]れている。」"
  23: "彼[かれ]らは走[はし]って行[い]って、彼[かれ]をそこから連[つ]れて来[き]た。彼[かれ]は民[たみ]の中[なか]に立[た]った。すると、彼[かれ]は民[たみ]全体[ぜんたい]より、肩[かた]から上[うえ]が高[たか]かった。"
  24: "サムエルは民[たみ]すべてに言[い]った。「主[しゅ]がご自分[じぶん]のために選[えら]ばれたこの人[ひと]を見[み]たか。民全体のうちに、彼[かれ]に似[に]た者[もの]は一人[ひとり]もいない。」そこで、民[たみ]はみな、そのことを知[し]って、「王[おう]よ、生[い]き永[なが]らえ」と言[い]った。"
  25: "サムエルは民[たみ]に王国[おうこく]の定[さだ]めを告[つ]げ、それを書[しょ]に書[か]き記[しる]して、主[しゅ]の前[まえ]に置[お]いた。そしてサムエルは民[たみ]をすべて帰[かえ]らせ、彼[かれ]らはそれぞれ自分[じぶん]の場所[ばしょ]へ帰[かえ]った。"
  26: "サウルも自分の家[いえ]、ギベアへ帰[かえ]った。主[しゅ]がその心[こころ]に触[ふ]れた勇士[ゆうし]たちは、サウルとともに歩[あゆ]んだ。"
  27: "しかし、ならず者[もの]たちは言[い]った。「この者[もの]がわたしたちをどうやって救[すく]えるというのか。」彼[かれ]らはサウルを辱[はずかし]め、彼[かれ]に贈[おく]り物[もの]を持[も]って来[こ]なかった。"

notes:
  1: "φακὸν τοῦ ἐλαίου — сосуд с елеем (φακός букв. «чечевица»; LXX так передаёт евр. «флакон», слав. «сосуд»). ἐπέχεεν ἐπὶ τὴν κεφαλήν — возлил на голову. ἐφίλησεν — поцеловал. Οὐχὶ κέχρικέν σε — «не помазал ли тебя» (χρίω, перфект). εἰς ἄρχοντα — в правителя (не βασιλεύς). ἐπὶ κληρονομίαν αὐτοῦ — над наследием Его."
  2: "ἁλλομένους μεγάλα — «сильно скачущих» (ἅλλομαι); смысл тёмен, возможно «ликующих» (слав. «скачущих зелно»). ἐν τῷ ὁρίῳ Βενιαμιν — в пределе Вениаминовом. ἐδαψιλεύσατο δι᾽ ὑμᾶς — «изобильно печётся о вас» (δαψιλεύομαι). В csl добавлено «в Силоме, в Вакалафе» — в gr нет."
  3: "δρυὸς Θαβωρ — дубрава Фаворская (δρῦς — дуб). ἀναβαίνοντας πρὸς τὸν θεὸν εἰς Βαιθηλ — восходящих к Богу в Вефиль. τρία αἰγίδια — три козлёнка. τρία ἀγγεῖα ἄρτων — три сосуда хлебов. ἀσκὸν οἴνου — мех вина."
  4: "ἐρωτήσουσίν σε τὰ εἰς εἰρήνην — спросят тебя о мире, т. е. приветствуют. ἀπαρχὰς ἄρτων — начатки, первые хлебы (ἀπαρχή). λήμψῃ ἐκ τῆς χειρός — возьмёшь из руки."
  5: "βουνὸν τοῦ θεοῦ — холм Божий. τὸ ἀνάστημα τῶν ἀλλοφύλων — отряд, гарнизон филистимлян (ἀνάστημα). Νασιβ ὁ ἀλλόφυλος — Насив, филистимлянин (вероятно, начальник гарнизона; слав. «началницы иноплеменничи»). χορὸς προφητῶν — сонм пророков. νάβλα — струнный инструмент (псалтирь), τύμπανον — тимпан, αὐλός — свирель, κινύρα — кинира (竪琴 по брифу)."
  6: "ἐφαλεῖται ἐπὶ σέ — «ринет на тебя» (ἐφάλλομαι). στραφήσῃ εἰς ἄνδρα ἄλλον — обратишься в иного человека."
  7: "ποίει πάντα, ὅσα ἐὰν εὕρῃ ἡ χείρ σου — делай всё, что найдёт рука твоя. ὅτι θεὸς μετὰ σοῦ — ибо Бог с тобою."
  8: "καταβήσῃ ἔμπροσθεν τῆς Γαλγαλα — сойдёшь перед Галгалом (ἔμπροσθεν — прежде, впереди). ἀνενεγκεῖν ὁλοκαύτωσιν καὶ θυσίας εἰρηνικάς — вознести всесожжения и мирные жертвы. διαλείψεις — оставишь промежуток, будешь ждать (διαλείπω). γνωρίσω σοι — покажу тебе."
  9: "ὥστε ἐπιστραφῆναι τῷ ὤμῳ αὐτοῦ — когда он повернулся плечом. μετέστρεψεν αὐτῷ ὁ θεὸς καρδίαν ἄλλην — изменил ему Бог сердце на иное (μεταστρέφω). ἦλθεν πάντα τὰ σημεῖα — пришли все знамения."
  10: "εἰς τὸν βουνόν — на холм (тот же, 10:5). ἐξ ἐναντίας αὐτοῦ — напротив него. ἥλατο ἐπ᾽ αὐτὸν πνεῦμα θεοῦ — «ринулся на него Дух Божий» (ἅλλομαι). ἐπροφήτευσεν ἐν μέσῳ αὐτῶν — пророчествовал среди них."
  11: "ἐχθὲς καὶ τρίτην — вчера и третьего дня. Τί τοῦτο τὸ γεγονὸς τῷ υἱῷ Κις — что это случилось с сыном Киса. ἦ καὶ Σαουλ ἐν προφήταις — «неужели и Саул среди пророков» (ἦ — вопросительная частица)."
  12: "Καὶ τίς πατὴρ αὐτοῦ — «а кто отец его»: вопрос тёмен (слав. добавляет «не кис ли?»). διὰ τοῦτο ἐγενήθη εἰς παραβολήν — поэтому стало притчей, поговоркой (παραβολή). Ἦ καὶ Σαουλ ἐν προφήταις — сама поговорка."
  13: "συνετέλεσεν προφητεύων — окончил пророчествовать (συντελέω). ἔρχεται εἰς τὸν βουνόν — приходит на холм."
  14: "ὁ οἰκεῖος αὐτοῦ — его домашний, родственник (по МТ — дядя, поэтому おじ). Ποῦ ἐπορεύθητε — куда вы ходили. Ζητεῖν τὰς ὄνους — искать ослиц. εἴδαμεν ὅτι οὐκ εἰσίν — увидели, что их нет."
  15: "Ἀπάγγειλον δή μοι — расскажи же мне. τί εἶπέν σοι Σαμουηλ — что сказал тебе Самуил."
  16: "Ἀπήγγειλεν ἀπαγγέλλων μοι — «объявляя объявил мне» (усилительный оборот LXX). τὸ ῥῆμα τῆς βασιλείας — слово о царстве. οὐκ ἀπήγγειλεν αὐτῷ — не объявил ему. В csl добавлено «еже рече самуил»."
  17: "παρήγγειλεν — велел собраться (παραγγέλλω). πρὸς κύριον εἰς Μασσηφα — к Господу в Массифу (ミツパ; слав. «в массифаф»)."
  18: "Τάδε εἶπεν κύριος — так говорит Господь. Ἐγὼ ἀνήγαγον — Я вывел (ἀνάγω). ἐξειλάμην — избавил (ἐξαιρέω). ἐκ πασῶν τῶν βασιλειῶν τῶν θλιβουσῶν ὑμᾶς — от всех царств, угнетавших вас (θλίβω)."
  19: "ἐξουθενήκατε — презрели, отвергли (ἐξουθενέω). ὃς αὐτός ἐστιν ὑμῶν σωτήρ — который Сам есть ваш спаситель. Οὐχί, ἀλλ᾽ ἤ — «нет, но только». κατὰ τὰ σκῆπτρα ὑμῶν καὶ κατὰ τὰς φυλάς — по коленам (σκῆπτρον) и племенам (φυλή). В csl добавлено «и по тысящам вашым» — в gr нет."
  20: "προσήγαγεν … πάντα τὰ σκῆπτρα — привёл все колена (σκῆπτρον — жезл, колено). κατακληροῦται — по жребию выпало (κατακληρόω)."
  21: "εἰς φυλάς — по племенам. φυλὴ Ματταρι — племя Маттари (マタリ; в ru «Матриево»). εἰς ἄνδρας — по мужам. ἐζήτει αὐτὸν — искали его."
  22: "ἐπηρώτησεν … ἔτι ἐν κυρίῳ — вопросил ещё у Господа. κέκρυπται ἐν τοῖς σκεύεσιν — скрылся среди сосудов, т. е. поклажи (σκεῦος; в ru «в обозе»)."
  23: "ἔδραμεν — побежал (τρέχω). κατέστησεν ἐν μέσῳ τοῦ λαοῦ — поставил среди народа. ὑψώθη … ὑπὲρ ὠμίαν καὶ ἐπάνω — был выше плеч и выше."
  24: "Εἰ ἑοράκατε — видели ли вы (ὁράω). ὃν ἐκλέλεκται ἑαυτῷ κύριος — которого избрал Себе Господь. οὐκ ἔστιν αὐτῷ ὅμοιος — нет подобного ему. Ζήτω ὁ βασιλεύς — «да живёт царь!» (формула воцарения)."
  25: "τὸ δικαίωμα τοῦ βασιλέως — устав, право царя (δικαίωμα; слав. «оправдания царствия»). ἔγραψεν ἐν βιβλίῳ — написал в книге. ἔθηκεν ἐνώπιον κυρίου — положил пред Господом. ἐξαπέστειλεν — отпустил."
  26: "οἱ υἱοὶ δυνάμεων — «сыны силы», храбрые (слав. «сынове сил»). ὧν ἥψατο κύριος καρδίας αὐτῶν — которых коснулся Господь в сердцах их (ἅπτω)."
  27: "υἱοὶ λοιμοί — «сыны погибели», негодяи (λοιμός; слав. «сынове погибелнии»). Τί σώσει ἡμᾶς οὗτος — как спасёт нас этот. ἠτίμασαν — обесчестили (ἀτιμάζω). οὐκ ἤνεγκαν αὐτῷ δῶρα — не принесли ему даров. В ru добавлено «но он как бы не замечал того» — в gr и csl нет."
