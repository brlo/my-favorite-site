# jp-box, Сирах, глава 6. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 6: о дружбе и испытании друга (1–17), затем наставление о воспитании
# и приобретении премудрости (18–37). Прямой речи нет: всё — авторское поучение,
# поэтому кавычек в главе нет.
# Нумерация по gr: 37 стихов. В gr 6:1 стоит `.` (дефект модуля): стих переведён
# по csl 6:1, который здесь единственный свидетель; 〔…〕 не ставится.
# Слав. сдвиги: csl 6:1 = гр. 6:1 (в гр. текст потерян); csl 6:19–20 делят
# гр. 6:19 (вторая половина — «в делании бо ея…»); поэтому csl 6:20–34 идут
# на один номер впереди gr. csl 6:35 вбирает гр. 6:34–35, и с csl 6:36 счёт
# снова совпадает. Держимся деления gr: гр. 6:19 — один стих, гр. 6:34 и 6:35 —
# два стиха. Лишних стихов нет.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).

