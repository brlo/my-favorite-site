verses:
  1: "友[とも]に代[か]わって敵[てき]となるな。悪[わる]い名[な]は恥[はじ]とそしりを受[う]け継[つ]ぐからである。二枚舌[にまいじた]の罪人[つみびと]も、そのとおりである。"
  2: "自分[じぶん]の魂[たましい]の思[おも]い計[はか]りによって高[たか]ぶるな。さもなければ、あなたの魂は若[わか]い雄牛[おうし]のように奪[うば]い尽[つ]くされる。"
  3: "あなたは自分[じぶん]の葉[は]を食[た]べ尽[つ]くし、自分の実[み]を滅[ほろ]ぼして、枯[か]れた木[き]のように自分だけを残[のこ]すことになる。"
  4: "悪[わる]い魂[たましい]は、それを手[て]に入[い]れた者[もの]を滅[ほろ]ぼし、その人[ひと]を敵[てき]の喜[よろこ]びとする。"
  5: "快[こころよ]い声[こえ]は友[とも]を増[ふ]やし、語[かた]りの巧[たくみ]みな舌[した]は親[した]しみの言葉[ことば]を増やす。"
  6: "あなたと平和[へいわ]に過[す]ごす者[もの]は多[おお]くあれ。しかし、あなたの相談相手[そうだんあいて]は千[せん]人[にん]に一人[ひとり]であれ。"
  7: "友[とも]を得[え]るなら、試[こころ]みのうちに得よ。すぐにその人[ひと]を信[しん]じてはならない。"
  8: "自分[じぶん]の時[とき]にだけ友[とも]となる者[もの]がいる。その者はあなたの苦難[くなん]の日[ひ]にはとどまらない。"
  9: "また、敵意[てきい]に変[か]わる友[とも]がいる。その者[もの]はあなたを辱[はずかし]める争[あらそ]いを暴[あば]く。"
  10: "食卓[しょくたく]を共[とも]にする友[とも]がいる。その者[もの]も、あなたの苦難[くなん]の日[ひ]にはとどまらない。"
  11: "あなたが繁栄[はんえい]しているとき、その者[もの]はあなたと同じようになり、あなたの僕[しもべ]たちに対して尊大[そんだい]にふるまう。"
  12: "あなたが低[ひく]くされると、その者[もの]はあなたに敵対[てきたい]し、あなたの前[まえ]から身[み]を隠[かく]す。"
  13: "敵[てき]から離[はな]れよ。そして友[とも]にも気[き]をつけよ。"
  14: "忠実[ちゅうじつ]な友[とも]は強[つよ]い守[まも]りであり、それを見[み]つけた者[もの]は宝[たから]を見つけたのである。"
  15: "忠実[ちゅうじつ]な友[とも]に代[か]わるものはなく、その良[よ]さを量[はか]る秤[はかり]もない。"
  16: "忠実[ちゅうじつ]な友[とも]はいのちの薬[くすり]である。主[しゅ]を恐[おそ]れる者[もの]たちは、その友を見[み]つける。"
  17: "主[しゅ]を恐[おそ]れる者[もの]は自分の友情[ゆうじょう]を正[ただ]しく導[みちび]く。自分[じぶん]に似[に]た者が、その隣人[りんじん]となるからである。"
  18: "子[こ]よ、若[わか]い時[とき]から教[おし]えを選[えら]べ。そうすれば白髪[しらが]になるまで知恵[ちえ]を見[み]つける。"
  19: "耕[たがや]す者[もの]、種[たね]を蒔[ま]く者のように、知恵[ちえ]に近[ちか]づき、その良[よ]い実[み]を待[ま]て。知恵の働[はたら]きでは、少[すこ]し苦[くる]しむだけで、すぐにその実を食[た]べることになる。"
  20: "知恵[ちえ]は教[おし]えのない者[もの]にとって非常[ひじょう]に厳[きび]しい。愚[おろ]かな者は、その中[なか]にとどまらない。"
  21: "知恵[ちえ]はその者[もの]にとって強[つよ]い試[ため]しの石[いし]のようになり、その者はすぐに知恵を投[な]げ捨[す]てる。"
  22: "知恵[ちえ]はその名[な]にふさわしいものであり、多[おお]くの人[ひと]に現[あらわ]れるものではない。"
  23: "子[こ]よ、聞[き]け。わたしの思[おも]いを受[う]け入[い]れ、わたしの助言[じょげん]を拒[こば]んではならない。"
  24: "あなたの足[あし]をその足枷[あしかせ]に入[い]れ、あなたの首[くび]をその首輪[くびわ]に入れよ。"
  25: "あなたの肩[かた]を入[い]れて知恵[ちえ]を担[かつ]げ。その束縛[そくばく]を忌[い]み嫌[きら]ってはならない。"
  26: "あなたの魂[たましい]を尽[つ]くして知恵[ちえ]に近[ちか]づき、あなたの力[ちから]を尽くしてその道[みち]を守[まも]れ。"
  27: "探[さぐ]り求[もと]めよ。そうすれば知恵[ちえ]はあなたに知[し]られる。それを手[て]に入[い]れたら、手放[てばな]してはならない。"
  28: "ついにはその安[やす]らぎを見[み]つけ、それがあなたの喜[よろこ]びに変[か]わるからである。"
  29: "その足枷[あしかせ]はあなたの強[つよ]い守[まも]りとなり、その首輪[くびわ]は栄光[えいこう]の衣[ころも]となる。"
  30: "その上[うえ]には金[きん]の飾[かざ]りがあり、その束縛[そくばく]は青紫[あおむらさき]の糸[いと]である。"
  31: "あなたは知恵[ちえ]を栄光[えいこう]の衣[ころも]として着[き]て、喜[よろこ]びの冠[かんむり]を自分[じぶん]に戴[いただ]く。"
  32: "子[こ]よ、もし教[おし]えを受[う]けたいと願[ねが]い、あなたの魂[たましい]を差[さ]し出[だ]すなら、あなたは賢[かしこ]くなる。"
  33: "聞[き]くことを愛[あい]するなら、あなたは受[う]け入[い]れる。耳[みみ]を傾[かたむ]けるなら、賢[かしこ]い者[もの]となる。"
  34: "多[おお]くの長老[ちょうろう]の中[なか]に立[た]て。賢[かしこ]い者[もの]がいるなら、その人[ひと]に付[つ]き従[したが]え。"
  35: "すべての神[かみ]の物語[ものがたり]を聞[き]くことを望[のぞ]め。悟[さと]りの格言[かくげん]を逃[のが]してはならない。"
  36: "悟[さと]りのある人[ひと]を見[み]たら、朝早[あさはや]くその人のもとへ行[い]け。その人の戸口[とぐち]の段[だん]を、あなたの足[あし]ですり減[へ]らせよ。"
  37: "主[しゅ]の定[さだ]めを思[おも]い、その戒[いまし]めをいつも思い巡[めぐ]らせよ。主があなたの心[こころ]を強[つよ]くし、知恵[ちえ]への願[ねが]いがあなたに与[あた]えられる。"

notes:
  1: "В gr-lxx-byz стих стоит как `.` — дефект модуля, текст потерян. Переведено по csl 6:1, единственному свидетелю: «И вместо друга не буди враг, имя бо лукаво студ и поношение наследит: сице грешник двоязычен». ὄνομα πονηρόν — «злое имя»; κληρονομήσει — «наследует» (слав. «наследит»); δίγλωσσος — «двуязычный, двоязычный», передано 二枚舌. 〔…〕 не ставится."
  2: "ἐπάρῃς σεαυτόν — «не превозноси себя» (ἐπαίρω); ἐν βουλῇ ψυχῆς σου — «в совете души твоей» (слав. «советом души твоея»), т. е. в собственном замысле. διαρπαγῇ — «будет расхищена, растерзана» (διαρπάζω); ὡς ταῦρος — «как бык» (слав. «аки юнец»)."
  3: "καταφάγεσαι — «съешь» (κατεσθίω), ἀπολέσεις — «погубишь»; ἀφήσεις σεαυτόν — «оставишь себя». φύλλα — листья, καρποί — плоды; ξύλον ξηρόν — «сухое дерево» (слав. «древо сухо»). Продолжение образа 6:2: гордец сам себя обгладывает."
  4: "ψυχὴ πονηρά — «злая душа»; ἀπολεῖ τὸν κτησάμενον αὐτήν — «погубит приобретшего её» (κτάομαι). ἐπίχαρμα ἐχθρῶν — «радость врагов», т. е. посмешище (слав. «порадование врагом»)."
  5: "λάρυγξ — «гортань, голос»; γλυκύς — сладкий (слав. «гортань сладок»). πληθυνεῖ — «умножит»; εὔλαλος — «хорошо говорящий, красноречивый»; εὐπροσήγορα — «приветливые обращения» (слав. «добры беседы»), передано 親しみの言葉."
  6: "οἱ εἰρηνεύοντές σοι — «мирствующие с тобою»; σύμβουλοι — советники; εἷς ἀπὸ χιλίων — «один из тысячи». Числа — кандзи, как в корпусе."
  7: "εἰ κτᾶσαι φίλον — «если приобретаешь друга»; ἐν πειρασμῷ κτῆσαι — «в испытании приобрети» (πειρασμός — испытание, проба); μὴ ταχὺ ἐμπιστεύσῃς — «не скоро доверься» (ἐμπιστεύω)."
  8: "φίλος ἐν καιρῷ αὐτοῦ — «друг в своё время», т. е. пока ему выгодно; παραμείνῃ — «останется» (παραμένω); ἡμέρᾳ θλίψεώς σου — «в день скорби твоей»."
  9: "μετατιθέμενος εἰς ἔχθραν — «переходящий во вражду» (μετατίθημι); μάχην ὀνειδισμοῦ σου ἀποκαλύψει — «откроет ссору к твоему поношению» (ὀνειδισμός — поношение, слав. «поношение твоего»)."
  10: "κοινωνὸς τραπεζῶν — «участник трапез» (слав. «общник трапезам»), т. е. друг застолья; повтор ἡμέρᾳ θλίψεως подчёркивает антитезу: в беде его нет."
  11: "ἐν τοῖς ἀγαθοῖς σου — «в благах твоих», т. е. в благополучии (слав. «во благих твоих»); ἔσται ὡς σύ — «будет как ты»; παρρησιάσεται — «дерзнёт, будет говорить смело» (παρρησιάζομαι), ἐπὶ τοὺς οἰκέτας — «против слуг твоих»."
  12: "ταπεινωθῇς — «будешь унижен» (ταπεινόω); ἔσται κατὰ σοῦ — «будет против тебя»; κρυβήσεται — «скроется» (κρύπτω)."
  13: "διαχωρίσθητι — «отделись» (διαχωρίζω); πρόσεχε — «будь внимателен, остерегайся» (προσέχω). Слав. «отлучися… внимай»."
  14: "σκέπη κραταιά — «крепкий покров, защита» (σκέπη — кров, сень; слав. «кров крепок»), передано 守り; θησαυρόν — сокровище. Сентенция о верном друге."
  15: "ἀντάλλαγμα — «обмен, замена» (слав. «измена» в смысле замены); σταθμός — «вес, мерило» (слав. «мерило»); καλλονή — «красота, доброта» (слав. «доброта»)."
  16: "φάρμακον ζωῆς — «лекарство жизни» (слав. «врачевание житию»); οἱ φοβούμενοι κύριον — «боящиеся Господа»; εὑρήσουσιν αὐτόν — «найдут его», т. е. такого друга."
  17: "εὐθυνεῖ φιλίαν αὐτοῦ — «направит дружбу свою» (εὐθύνω — выпрямлять); κατ᾽ αὐτὸν οὕτως καὶ ὁ πλησίον — «каков он, таков и ближний его». Слав. «якоже бо сам, тако и искренний его»."
  18: "τέκνον — «чадо»; ἐκ νεότητός σου ἐπίλεξαι παιδείαν — «от юности избери наказание, учение» (παιδεία); ἕως πολιῶν — «до седин» (πολιά — седина), передано 白髪. Слав. «даже до седин»."
  19: "ὁ ἀροτριῶν — пашущий, ὁ σπείρων — сеющий; ἀνάμενε — «ожидай»; ἐν τῇ ἐργασίᾳ αὐτῆς — «в работе над нею»; γενημάτων — «произведений, плодов» (γένημα). Слав. делит стих: csl 6:19 — «якоже оряй…», csl 6:20 — «в делании бо ея…»; по gr это один стих."
  20: "τραχεῖα — «суровая, жёсткая» (слав. «стропотна»); τοῖς ἀπαιδεύτοις — «невеждам, необученным»; οὐκ ἐμμενεῖ — «не пребудет» (ἐμμένω); ἀκάρδιος — «бессердечный, малодушный» (слав. «безумный»), передано 心の弱い者."
  21: "λίθος δοκιμασίας — «камень испытания» (δοκιμασία — проба); ἰσχυρός — сильный, тяжёлый; οὐ χρονιεῖ ἀπορρῖψαι — «не замедлит отбросить» (χρονίζω — медлить; ἀπορρίπτω)."
  22: "κατὰ τὸ ὄνομα αὐτῆς — «по имени её»: имя σοφία связано с σαφής, «ясный»; οὐ πολλοῖς φανερά — «не многим явна» (слав. «не многим есть явна»)."
  23: "Ἄκουσον, τέκνον — «слушай, чадо»; ἔκδεξαι γνώμην μου — «прими моё мнение, волю» (γνώμη); ἀπαναίνου — «отвергай» (ἀπαναίνομαι). Слав. «приими волю мою»."
  24: "εἰσένεγκον τοὺς πόδας σου εἰς τὰς πέδας αὐτῆς — «введи ноги твои в её путы» (πέδη — колодка, путы); κλοιός — «ошейник, кольцо на шею» (слав. «гривна»); τράχηλος — шея."
  25: "ὑπόθες τὸν ὦμόν σου — «подставь плечо твоё»; βάσταξον — «неси» (βαστάζω); μὴ προσοχθίσῃς — «не вознегодуй, не тяготись» (προσοχθίζω); δεσμοί — узы."
  26: "ἐν πάσῃ ψυχῇ σου — «всей душою»; συντήρησον — «соблюди» (συντηρέω); τὰς ὁδοὺς αὐτῆς — «пути её». Слав. «всею душею… соблюди пути ея»."
  27: "ἐξίχνευσον — «разыщи, выследи» (ἐξιχνεύω); ζήτησον — «ищи»; γνωσθήσεταί σοι — «будет познана тебе»; ἐγκρατὴς γενόμενος — «сделавшись обладателем» (ἐγκρατής), передано 手に入れたら."
  28: "ἐπ᾽ ἐσχάτων — «в конце, напоследок» (слав. «на последок»); ἀνάπαυσις — покой; στραφήσεταί σοι εἰς εὐφροσύνην — «обратится тебе в веселие»."
  29: "αἱ πέδαι — путы; εἰς σκέπην ἰσχύος — «в покров силы», т. е. в крепкую защиту; κλοιοί — ошейники; εἰς στολὴν δόξης — «в одеяние славы» (στολή — длинная одежда)."
  30: "κόσμος χρύσεος — «золотое украшение» (κόσμος здесь украшение, слав. «красота злата»); κλῶσμα ὑακίνθινον — «гиацинтовая, сине-фиолетовая нить» (ὑάκινθος), передано 青紫の糸."
  31: "ἐνδύσῃ αὐτήν — «облечёшься в неё»; στέφανον ἀγαλλιάματος — «венец ликования, радости» (ἀγαλλίαμα); περιθήσεις σεαυτῷ — «возложишь на себя» (περιτίθημι)."
  32: "ἐὰν θέλῃς, τέκνον, παιδευθῇς — «если пожелаешь, чадо, быть наказанным, обученным»; ἐπιδῷς τὴν ψυχήν σου — «отдашь душу твою»; πανοῦργος — «искусный, сведущий» (слав. «хитр»), здесь в положительном смысле, передано 賢い."
  33: "ἀγαπήσῃς ἀκούειν — «полюбишь слушать»; ἐκδέξῃ — «примешь»; κλίνῃς τὸ οὖς — «приклонишь ухо». Слав. «аще возлюбиши слушати, приимеши»."
  34: "ἐν πλήθει πρεσβυτέρων στῆθι — «стань в собрании старцев» (πλῆθος — множество); τίς σοφός — «кто мудр?»; αὐτῷ προσκολλήθητι — «к нему прилепись» (προσκολλάω). Слав. 6:35 вбирает этот стих и следующий."
  35: "διήγησιν θείαν — «божественное повествование» (διήγησις — рассказ); θέλε ἀκροᾶσθαι — «желай слушать»; παροιμίαι συνέσεως — «притчи разума» (παροιμία, σύνεσις); μὴ ἐκφευγέτωσάν σε — «да не убегут от тебя»."
  36: "συνετός — «разумный, понятливый»; ὄρθριζε πρὸς αὐτόν — «вставай рано к нему» (ὀρθρίζω); βαθμούς — ступени; ἐκτριβέτω ὁ πούς σου — «пусть нога твоя истирает» (ἐκτρίβω)."
  37: "διανοοῦ — «размышляй, вникай» (διανοέομαι); προστάγματα — повеления, уставы; μελέτα — «поучайся, упражняйся»; στηριεῖ — «утвердит» (στηρίζω); ἐπιθυμία τῆς σοφίας — «желание премудрости»."
