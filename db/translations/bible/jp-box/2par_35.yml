verses:
  1: "ヨシヤはエルサレムで、自分[じぶん]の神[かみ]である主[しゅ]に過越祭[すぎこしまつり]を行[おこな]い、第一[だいいち]の月[つき]の十四日[じゅうよっか]に過越祭の小羊[こひつじ]を屠[ほふ]った。"
  2: "彼[かれ]は祭司[さいし]たちをその務[つと]めの場所[ばしょ]に立[た]たせ、主[しゅ]の家[いえ]の仕事[しごと]に励[はげ]ませた。"
  3: "彼[かれ]は、イスラエル全体[ぜんたい]で力[ちから]あるレビ人[びと]たちに言[い]った。「主[しゅ]に聖別[せいべつ]されて、聖[せい]なる契約[けいやく]の箱[はこ]を、イスラエルの王[おう]ダビデの子[こ]ソロモンが建[た]てた家[いえ]に置[お]きなさい。」そして王[おう]は言った。「あなたがたはもはや何[なに]も肩[かた]に負[お]う必要[ひつよう]はない。今[いま]、あなたがたの神[かみ]である主[しゅ]と、その民[たみ]イスラエルに仕[つか]えなさい。」"
  4: "「あなたがたは父祖[ふそ]の家[いえ]ごとに、またあなたがたの組[くみ]ごとに、イスラエルの王[おう]ダビデの書[しょ]と、その子[こ]ソロモンの手[て]による定[さだ]めに従[したが]って備[そな]えなさい。"
  5: "そして、父祖[ふそ]の家[いえ]の分[わ]け方[かた]に従[したが]って、あなたがたの兄弟[きょうだい]である民[たみ]の子[こ]らとともに家[いえ]に立[た]ちなさい。レビ人[びと]は父祖の家の分[ぶん]に従[したが]って立[た]ちなさい。"
  6: "過越祭[すぎこしまつり]の小羊[こひつじ]を屠[ほふ]り、聖[せい]なるもの[もの]をあなたがたの兄弟[きょうだい]たちのために備[そな]えて、主[しゅ]がモーセの手[て]によって語[かた]られた言葉[ことば]のとおりに行[おこな]いなさい。」"
  7: "ヨシヤは民[たみ]の子[こ]らに、羊[ひつじ]と子羊[こひつじ]と山羊[やぎ]の子[こ]を、すべての者[もの]のために過越祭[すぎこしまつり]のいけにえとして与[あた]えた。数[かず]は三万[さんまん]頭[とう]、雄牛[おうし]は三千頭[さんぜんとう]で、これは王[おう]の財産[ざいさん]から出[で]たものであった。"
  8: "彼[かれ]の長[かしら]たちもまた、民[たみ]、祭司[さいし]たち、レビ人[びと]たちに贈[おく]り物[もの]をささげた。神[かみ]の家[いえ]の長たちであるヒルキヤ、ザカリヤ、イエイエルは祭司たちに、過越祭[すぎこしまつり]のために羊[ひつじ]と子羊[こひつじ]と山羊[やぎ]の子[こ]を二千六百頭[にせんろっぴゃくとう]、雄牛[おうし]を三百頭[さんびゃくとう]与[あた]えた。"
  9: "また、レビ人[びと]の長[かしら]たちであるホナニヤ、バナヤ、シマヤ、その兄弟[きょうだい]ナタナエル、ハシャビヤ、イエイエル、ヨザバドは、レビ人たちに過越祭[すぎこしまつり]のために羊[ひつじ]五千頭[ごせんとう]と雄牛[おうし]五百頭[ごひゃくとう]を与[あた]えた。"
  10: "こうして務[つと]めが整[ととの]い、祭司[さいし]たちはその場所[ばしょ]に、レビ人[びと]たちはその組[くみ]ごとに、王[おう]の命[めい]に従[したが]って立[た]った。"
  11: "彼[かれ]らは過越祭[すぎこしまつり]の小羊[こひつじ]を屠[ほふ]り、祭司[さいし]たちはレビ人[びと]の手[て]から受[う]け取[と]った血[ち]を注[そそ]ぎかけ、レビ人たちは皮[かわ]を剥[は]いだ。"
  12: "彼[かれ]らは燔祭[はんさい]を備[そな]え、父祖[ふそ]の家[いえ]ごとの分[わ]け方[かた]に従[したが]って民[たみ]の子[こ]らに渡[わた]し、主[しゅ]にささげさせた。それはモーセの書[しょ]に書[か]かれているとおりであった。朝[あさ]までも同[おな]じようにした。"
  13: "彼[かれ]らは定[さだ]めに従[したが]って過越祭[すぎこしまつり]の小羊[こひつじ]を火[ひ]で焼[や]き、聖[せい]なるもの[もの]を青銅[せいどう]の器[うつわ]と大鍋[おおなべ]で煮[に]た。こうして準備[じゅんび]が整[ととの]い、彼らは民[たみ]の子[こ]らすべてのところへ走[はし]って行[い]った。"
  14: "その後[あと]で、彼[かれ]らは自分[じぶん]たちと祭司[さいし]たちのために備[そな]えた。祭司たちは夜[よる]まで、脂肪[しぼう]と燔祭[はんさい]をささげることに忙[いそが]しかったからである。レビ人[びと]たちは自分たちと、その兄弟[きょうだい]であるアロンの子[こ]らのために備えた。"
  15: "歌[うた]い手[て]であるアサフの子[こ]らは、ダビデと、王[おう]の先見者[せんけんしゃ]であるアサフ、ヘマン、エドトンの命[めい]に従[したが]って、自分[じぶん]たちの場所[ばしょ]に立[た]った。長[かしら]たちと、それぞれの門[もん]の門番[もんばん]たちもそこにいた。彼[かれ]らは聖[せい]なる務[つと]めから離[はな]れることができなかった。その兄弟[きょうだい]であるレビ人[びと]たちが彼らのために備[そな]えたからである。"
  16: "こうしてその日[ひ]、主[しゅ]への務[つと]めはすべて整[ととの]えられ、王[おう]ヨシヤの命[めい]に従[したが]って過越祭[すぎこしまつり]を行[おこな]い、主の祭壇[さいだん]に燔祭[はんさい]をささげた。"
  17: "そこにいたイスラエルの子[こ]らは、その時[とき]に過越祭[すぎこしまつり]と除酵祭[じょこうさい]を七日間[なのかかん]行[おこな]った。"
  18: "預言者[よげんしゃ]サムエルの日[ひ]以来[いらい]、イスラエルにはこのような過越祭[すぎこしまつり]はなかった。イスラエルの王[おう]たちはだれも、ヨシヤと祭司[さいし]たちとレビ人[びと]たち、ユダのすべてと、そこにいたイスラエルのすべて、エルサレムの住民[じゅうみん]が主[しゅ]に行[おこな]ったような過越祭を行[おこな]わなかった。"
  19: "この過越祭[すぎこしまつり]は、ヨシヤの治世[ちせい]の第十八年目[だいじゅうはちねんめ]に行[おこな]われた。また、ヨシヤ王[おう]は、ユダの地[ち]とエルサレムにあった霊媒[れいばい]、占[うらな]い師[し]、テラフィム、偶像[ぐうぞう]、カラシムを火[ひ]で焼[や]いた。祭司[さいし]ヒルキヤが主[しゅ]の家[いえ]で見[み]つけた書[しょ]に書[か]かれている律法[りっぽう]の言葉[ことば]を、そのとおりに立[た]てるためであった。"
  20: "彼[かれ]より前[まえ]に、心[こころ]を尽[つ]くし、魂[たましい]を尽くし、力[ちから]を尽くして、モーセの律法[りっぽう]のすべてに従[したが]って主[しゅ]に立[た]ち返[かえ]った者[もの]で、彼のような者はいなかった。彼の後[あと]にも、彼のような者は起[お]こらなかった。"
  21: "しかし、主[しゅ]は、ユダに対[たい]して燃[も]え上[あ]がったその大[おお]きな怒[いか]りの激[はげ]しさを、引[ひ]き返[かえ]されなかった。マナセが主[しゅ]を怒[いか]らせたすべての事[こと]のゆえであった。"
  22: "主[しゅ]は言[い]われた。「わたしはユダをも、わたしの前[まえ]から退[しりぞ]けよう。イスラエルを退けたように。わたしは、わたしが選[えら]んだ町[まち]エルサレムと、わたしの名[な]がそこにあると言[い]った家[いえ]を退[しりぞ]ける。」また、エジプトの王[おう]ファラオ・ネカオは、ユーフラテス川[がわ]のほとりのアッシリアの王[おう]に向[む]かって上[のぼ]って来[き]たので、ヨシヤ王[おう]は彼[かれ]に会[あ]いに出[で]た。ネカオは使者[ししゃ]たちを彼のもとへ遣[つか]わして言[い]わせた。「ユダの王[おう]よ、わたしとあなたの間[あいだ]に何[なに]があろうか。わたしは今日[きょう]、あなたと戦[たたか]うために来[き]たのではない。わたしの戦[たたか]いは別[べつ]のところにある。神[かみ]がわたしに急[いそ]ぐよう命[めい]じられたのだ。わたしとともにいる神[かみ]に気[き]をつけよ、あなたを滅[ほろ]ぼされないように。」しかし、ヨシヤは彼[かれ]から顔[かお]を背[む]けず、かえってこれと戦[たたか]おうと力[ちから]を尽[つ]くし、神[かみ]の口[くち]からのネカオの言葉[ことば]に聞[き]き従[したが]わず、メギドの平野[へいや]で戦[たたか]うために行[い]った。"
  23: "射手[しゃしゅ]たちはヨシヤ王[おう]を射[い]た。王[おう]は自分[じぶん]のしもべたちに言[い]った。「わたしをここから連[つ]れ出[だ]せ。ひどく傷[きず]ついたからである。」"
  24: "しもべたちは彼[かれ]を戦車[せんしゃ]から降[お]ろし、彼[かれ]の第二[だいに]の戦車[せんしゃ]に乗[の]せてエルサレムへ連[つ]れて行[い]った。彼は死[し]に、父[ちち]たちとともに葬[ほうむ]られた。ユダのすべての者[もの]とエルサレムの住民[じゅうみん]はヨシヤのために嘆[なげ]いた。"
  25: "エレミヤはヨシヤのために哀歌[あいか]を歌[うた]った。すべての長[かしら]たちと、その妻[つま]たちは、今日[きょう]に至[いた]るまでヨシヤのために哀歌を歌った。彼らはそれをイスラエルへの定[さだ]めとした。見[み]よ、それは哀歌[あいか]の書[しょ]に記[しる]されている。"
  26: "ヨシヤの残[のこ]りの言葉[ことば]と、彼[かれ]の望[のぞ]みは、主[しゅ]の律法[りっぽう]の書[しょ]に書[か]かれている。"
  27: "彼[かれ]の最初[さいしょ]の言葉[ことば]と最後[さいご]の言葉[ことば]は、見[み]よ、イスラエルとユダの王[おう]たちの書[しょ]に記[しる]されている。"

notes:
  1: "ἐποίησεν τὸ φασεχ — совершил пасху (φασεχ, евр. פֶּסַח; 過越祭); ἔθυσαν τὸ φασεχ — заклали пасху (безличное мн. ч.; 過越祭の小羊); τῇ τεσσαρεσκαιδεκάτῃ τοῦ μηνὸς τοῦ πρώτου — в четырнадцатый день первого месяца; в csl добавлено «во Иерусалиме» — по паритету エルサレムで."
  2: "ἔστησεν τοὺς ἱερεῖς ἐπὶ τὰς φυλακὰς αὐτῶν — поставил священников на стражи их (φυλακή — чреда, стража; слав. «на стражах их»); κατίσχυσεν αὐτοὺς εἰς τὰ ἔργα — укрепил, ободрил их на дела (κατισχύω)."
  3: "τοῖς Λευίταις τοῖς δυνατοῖς ἐν παντὶ Ισραηλ — левитам, сильным во всём Израиле (слав. «левитом сильным»), т. е. начальникам; τοῦ ἁγιασθῆναι αὐτοὺς τῷ κυρίῳ — чтобы они освятились Господу (инфинитив цели; передано 聖別されて); ἔθηκαν τὴν κιβωτόν — поставили ковчег (3 л. мн. в составе повеления); κιβωτὸς ἁγία — святой ковчег (契約の箱); εἰς τὸν οἶκον, ὃν ᾠκοδόμησεν Σαλωμων — в дом, который построил Соломон; в csl повтор «И поставиши кивот святый во храме…» — редакторское удвоение, не переведено; Οὐκ ἔστιν ὑμῖν ἆραι ἐπ᾿ ὤμων οὐθέν — «нет вам носить на плечах ничего» (αἴρω); λειτουργήσατε — служите (λειτουργέω); τῷ λαῷ αὐτοῦ Ισραηλ — народу Его, Израилю."
  4: "ἑτοιμάσθητε — приготовьтесь; κατ᾿ οἴκους πατριῶν — по домам отцов (父祖の家ごと); κατὰ τὰς ἐφημερίας — по чредам (ἐφημερία, 組); κατὰ τὴν γραφὴν Δαυιδ — по писанию Давида (γραφή — предписание); διὰ χειρὸς Σαλωμων — рукою Соломона."
  5: "στῆτε ἐν τῷ οἴκῳ — станьте в доме; κατὰ τὰς διαιρέσεις οἴκων πατριῶν — по разделениям домов отцов (διαίρεσις); τοῖς ἀδελφοῖς ὑμῶν υἱοῖς τοῦ λαοῦ — при братьях ваших, сынах народа; μερὶς οἴκου πατριᾶς τοῖς Λευίταις — часть дома отца левитам (датив; слав. «по части дому отечества в левитех»): левиты распределяются по чредам."
  6: "θύσατε τὸ φασεχ — заколите пасху; τὰ ἅγια ἑτοιμάσατε — приготовьте святыни (ἅγια); τοῖς ἀδελφοῖς ὑμῶν — братьям вашим; κατὰ τὸν λόγον κυρίου διὰ χειρὸς Μωυσῆ — по слову Господню рукою Моисея; в csl скобочная вставка «(еже глагола)» — не переведена; в ru «и освятитесь» — по МТ."
  7: "ἀπήρξατο — дал начатки, пожертвовал (ἀπάρχομαι; слав. «даде начатки»); πρόβατα καὶ ἀμνοὺς καὶ ἐρίφους ἀπὸ τῶν τέκνων τῶν αἰγῶν — овец, агнцев и козлят из коз; πάντα εἰς τὸ φασεχ — всё на пасху; εἰς πάντας τοὺς εὑρεθέντας — всем находившимся; εἰς ἀριθμὸν τριάκοντα χιλιάδας — числом тридцать тысяч; μόσχων τρεῖς χιλιάδας — волов три тысячи; ἀπὸ τῆς ὑπάρξεως τοῦ βασιλέως — из имения царя (ὕπαρξις)."
  8: "οἱ ἄρχοντες αὐτοῦ ἀπήρξαντο — начальники его дали начатки; ἔδωκεν Χελκιας καὶ Ζαχαριας καὶ Ιιηλ οἱ ἄρχοντες οἴκου τοῦ θεοῦ — дали Хелкия, Захария и Иехиил, начальствующие в доме Божием (в csl «началницы священником дому Господня» — иное понимание); δισχίλια ἑξακόσια — две тысячи шестьсот; μόσχους τριακοσίους — триста волов."
  9: "Χωνενιας — Хонания (в csl «хонениа»; ホナニヤ, как 2 Пар 31:12); Βαναιας — Банея; Σαμαιας — Шемаия; Ναθαναηλ ἀδελφὸς αὐτοῦ — Нафанаил, брат его; Ασαβια — Хашавия; Ιιηλ — Иехиил; Ιωζαβαδ — Иозавад; ἄρχοντες τῶν Λευιτῶν — начальники левитов; ἀπήρξαντο — дали начатки; πρόβατα πεντακισχίλια — пять тысяч овец; μόσχους πεντακοσίους — пятьсот волов."
  10: "κατωρθώθη ἡ λειτουργία — устроилось служение (κατορθόω); ἔστησαν ἐπὶ τὴν στάσιν αὐτῶν — стали на своё место (στάσις, слав. «в чине своем»); ἐπὶ τὰς διαιρέσεις αὐτῶν — по разделениям своим; κατὰ τὴν ἐντολὴν τοῦ βασιλέως — по повелению царя."
  11: "ἔθυσαν τὸ φασεχ — заклали пасху; προσέχεαν τὸ αἷμα — возлили кровь (προσχέω); ἐκ χειρὸς αὐτῶν — из руки их, т. е. принимая из рук левитов (в csl «рукама своима» — иное понимание); ἐξέδειραν — содрали кожу (ἐκδέρω; слав. «одираху кожы»)."
  12: "ἡτοίμασαν τὴν ὁλοκαύτωσιν — приготовили всесожжение; παραδοῦναι αὐτοῖς — чтобы передать им; κατὰ τὴν διαίρεσιν κατ᾽ οἴκους πατριῶν — по разделению, по домам отцов; τοῖς υἱοῖς τοῦ λαοῦ — сынам народа; τοῦ προσάγειν τῷ κυρίῳ — чтобы приносить Господу; ὡς γέγραπται ἐν βιβλίῳ Μωυσῆ — как написано в книге Моисея (в csl добавлено «закона» — «в книзе закона моисеова»); καὶ οὕτως εἰς τὸ πρωί — «и так к утру» (слав. «тако и заутра»; в ru «то же сделали и с волами» — по МТ)."
  13: "ὤπτησαν ἐν πυρί — испекли на огне (ὀπτάω); κατὰ τὴν κρίσιν — по уставу (κρίσις); τὰ ἅγια ἥψησαν — святыни сварили (ἕψω); ἐν τοῖς χαλκείοις καὶ ἐν τοῖς λέβησιν — в медных сосудах и котлах (χαλκεῖον, λέβης); εὐοδώθη — было успешно (εὐοδόω, слав. «предуспе»); ἔδραμον πρὸς πάντας — побежали ко всем, т. е. поспешно раздали (слав. «разделиша»)."
  14: "μετὰ τὸ ἑτοιμάσαι αὐτοῖς καὶ τοῖς ἱερεῦσιν — после того как приготовили себе и священникам; ἐν τῷ ἀναφέρειν τὰ στέατα καὶ τὰ ὁλοκαυτώματα — при возношении туков и всесожжений (στέαρ — тук, 脂肪); ἕως νυκτός — до ночи; в csl скобочная вставка «(быша не праздни)» — не переведена; ἡτοίμασαν αὑτοῖς — приготовили себе; τοῖς ἀδελφοῖς αὐτῶν υἱοῖς Ααρων — братьям своим, сынам Аарона."
  15: "οἱ ψαλτῳδοὶ υἱοὶ Ασαφ — певцы, сыны Асафа (ψαλτῳδός, 歌い手); ἐπὶ τῆς στάσεως αὐτῶν — на месте своём; κατὰ τὰς ἐντολὰς Δαυιδ καὶ Ασαφ καὶ Αιμαν καὶ Ιδιθων οἱ προφῆται τοῦ βασιλέως — по заповедям Давида, Асафа, Емана и Идифуна, прозорливцев царя (слав. «пророков царевых»); οἱ ἄρχοντες καὶ οἱ πυλωροὶ πύλης καὶ πύλης — начальники и привратники у каждых ворот; οὐκ ἦν αὐτοῖς κινεῖσθαι — не было им [возможности] двинуться, отойти (κινέω); ἀπὸ τῆς λειτουργίας ἁγίων — от служения святынь; в csl вставки «(стояху)» и «(брашна)» — не переведены."
  16: "κατωρθώθη καὶ ἡτοιμάσθη — было устроено и приготовлено; πᾶσα ἡ λειτουργία κυρίου — всё служение Господне; ἐν τῇ ἡμέρᾳ ἐκείνῃ — в тот день; ἐνεγκεῖν τὰ ὁλοκαυτώματα ἐπὶ τὸ θυσιαστήριον — принести всесожжения на жертвенник; κατὰ τὴν ἐντολὴν τοῦ βασιλέως Ιωσια — по повелению царя Иосии."
  17: "οἱ υἱοὶ Ισραηλ οἱ εὑρεθέντες — сыны Израилевы, находившиеся там; τὸ φασεχ — пасху; τὴν ἑορτὴν τῶν ἀζύμων — праздник опресноков (除酵祭); ἑπτὰ ἡμέρας — семь дней."
  18: "οὐκ ἐγένετο φασεχ ὅμοιον αὐτῷ — не было пасхи, подобной ей; ἀπὸ ἡμερῶν Σαμουηλ τοῦ προφήτου — от дней Самуила пророка; οὐκ ἐποίησαν ὡς τὸ φασεχ, ὃ ἐποίησεν — не совершили, как пасху, которую совершил; πᾶς Ιουδα καὶ πᾶς Ισραηλ ὁ εὑρεθείς — весь Иуда и весь Израиль, находившийся там; οἱ κατοικοῦντες ἐν Ιερουσαλημ — жители Иерусалима; τῷ κυρίῳ — Господу (датив в конце, слав. «Господу»)."
  19: "τῷ ὀκτωκαιδεκάτῳ ἔτει τῆς βασιλείας Ιωσια — в восемнадцатый год царства Иосии; 19a — продолжение стиха в тексте модуля (номер вставной): τοὺς ἐγγαστριμύθους καὶ τοὺς γνώστας — вызывателей мёртвых и знахарей (霊媒, 占い師); τὰ θαραφιν — терафимы (テラフィム; слав. «кумирницы»); τὰ εἴδωλα — идолы (偶像); τὰ καρασιμ — тёмное слово (слав. «дубравы»); ἐνεπύρισεν — сжёг (ἐμπυρίζω); ἵνα στήσῃ τοὺς λόγους τοῦ νόμου — чтобы поставить, исполнить слова закона; οὗ εὗρεν Χελκιας — которую нашёл Хелкия. В csl 18-й год — отдельный ст. 19, а очищение — в начале ст. 20."
  20: "ὅμοιος αὐτῷ οὐκ ἐγενήθη ἔμπροσθεν αὐτοῦ — подобного ему не было прежде него; ὃς ἐπέστρεψεν πρὸς κύριον — который обратился к Господу; ἐν ὅλῃ καρδίᾳ … ψυχῇ … ἰσχύι — всем сердцем, душою и крепостию; κατὰ πάντα τὸν νόμον Μωυσῆ — по всему закону Моисея; μετ᾿ αὐτὸν οὐκ ἀνέστη ὅμοιος αὐτῷ — после него не восстал подобный ему. В csl это часть ст. 20 (объединён с очищением и словом Господа)."
  21: "πλὴν οὐκ ἀπεστράφη κύριος ἀπὸ ὀργῆς θυμοῦ αὐτοῦ τοῦ μεγάλου — но не отвратился Господь от ярости великого гнева Своего; οὗ ὠργίσθη θυμῷ κύριος ἐν τῷ Ιουδα — которым воспылал Господь на Иуду; ἐπὶ πάντα τὰ παροργίσματα, ἃ παρώργισεν Μανασσης — за все прогневления, которыми прогневал Манассия. В csl — в ст. 20."
  22: "Стих по LXX соединяет слово Господа и рассказ о походе Нехао, посольстве и отказе Иосии: вставные номера 20, 21, 22 в тексте модуля. καὶ εἶπεν κύριος — и сказал Господь; ἀποστήσω ἀπὸ προσώπου μου — отставлю от лица Моего; ἀπωσάμην τὴν πόλιν — отверг город (ἀπωθέω); Ἔσται τὸ ὄνομά μου ἐκεῖ — «будет имя Моё там»; ἀνέβη Φαραω Νεχαω — взошёл фараон Нехао (ファラオ・ネカオ, как 4 Цар 23:29); ἐπὶ τὸν βασιλέα Ἀσσυρίων ἐπὶ τὸν ποταμὸν Εὐφράτην — против царя Ассирийского к реке Евфрату; ἀπέστειλεν ἀγγέλους — послал послов; Τί ἐμοὶ καὶ σοί — что мне и тебе; οὐκ ἐπὶ σὲ ἥκω — не против тебя пришёл; в csl добавлено «но на место брани моея» — по паритету わたしの戦いは別のところにある; ὁ θεὸς εἶπεν κατασπεῦσαί με — Бог сказал поспешить мне; πρόσεχε ἀπὸ τοῦ θεοῦ τοῦ μετ᾿ ἐμοῦ — берегись Бога, Который со мною; μὴ καταφθείρῃ σε — чтобы не погубил тебя; οὐκ ἀπέστρεψεν τὸ πρόσωπον αὐτοῦ — не отвратил лица своего; ἐκραταιώθη — укрепился (κραταιόω); διὰ στόματος θεοῦ — из уст Божиих; ἐν τῷ πεδίῳ Μαγεδων — на равнине Мегиддо (メギド)."
  23: "ἐτόξευσαν οἱ τοξόται — выстрелили стрелки (τοξεύω); ἐπὶ βασιλέα Ιωσιαν — в царя Иосию; ἐξαγάγετέ με — выведите меня; ἐπόνεσα σφόδρα — сильно изнемог, страдаю (πονέω; слав. «изнемогох зело»); в csl скобка «(от брани)» — не переведена."
  24: "ἐξήγαγον ἀπὸ τοῦ ἅρματος — вывели из колесницы; ἀνεβίβασαν ἐπὶ τὸ ἅρμα τὸ δευτερεῦον — посадили на вторую колесницу (δευτερεύω); ἤγαγον εἰς Ιερουσαλημ — привезли в Иерусалим; ἀπέθανεν καὶ ἐτάφη μετὰ τῶν πατέρων — умер и погребён с отцами; ἐπένθησαν ἐπὶ Ιωσιαν — оплакали Иосию (πενθέω)."
  25: "ἐθρήνησεν Ιερεμιας — оплакал Иеремия (θρηνέω, 哀歌); οἱ ἄρχοντες καὶ αἱ ἄρχουσαι — князья и княгини (начальствующие мужи и жёны; передано 長たちとその妻たち); θρῆνον ἐπὶ Ιωσιαν ἕως τῆς σήμερον — плач об Иосии до сего дня; ἔδωκαν αὐτὸν εἰς πρόσταγμα ἐπὶ Ισραηλ — дали его в постановление Израилю (слав. «в повеление»); ἐπὶ τῶν θρήνων — в плачевных песнях (слав. «в рыданиих»)."
  26: "οἱ λόγοι Ιωσια — слова, дела Иосии; ἡ ἐλπὶς αὐτοῦ — надежда его (слав. «упование»); γεγραμμένα — написанные; ἐν νόμῳ κυρίου — в законе Господнем."
  27: "οἱ λόγοι αὐτοῦ οἱ πρῶτοι καὶ οἱ ἔσχατοι — слова его первые и последние; ἐπὶ βιβλίῳ βασιλέων Ισραηλ καὶ Ιουδα — в книге царей Израиля и Иуды."
