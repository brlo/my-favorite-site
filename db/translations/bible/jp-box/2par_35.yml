# jp-box, 2-я Паралипоменон, глава 35. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru), по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»); ru (Синодальный) —
# только для понимания, не источник. jp-joc в книге нет; jp-ni (под авторским правом)
# не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 35: Пасха Иосии (1–19), смерть Иосии (20–25), итог (26–27).
# Речь: слова царя — 「…」 (3–6); слово Господа — 「…」 (22); посольство Нехао — 「…» (22).
# Красного нет.
# Нумерация по gr: 27 стихов. В csl ст. 19 — только «в восемнадцатый год», очищение
# отнесено к ст. 20; слово Господа и поход Нехао — тоже к ст. 20, посольство — к 21,
# отказ Иосии — к 22. Держимся нумерации gr: в 35:19 входит и очищение (19a), в 35:22 —
# слово Господа, поход Нехао, посольство и отказ Иосии (вставные номера 20–22 в тексте
# модуля). Сдвиг оговорён в notes.
# 〔…〕 нет: слав. добавки 1 «во Иерусалиме» и 22 «но на место брани моея» внесены
# в основной текст без скобок; остальные расхождения с LXX — в notes.
# Сносок ⟨…⟩ нет: 過越祭, 除酵祭, 燔祭, 祭壇, 契約の箱, 祭司, レビ人, 歌い手, 預言者,
