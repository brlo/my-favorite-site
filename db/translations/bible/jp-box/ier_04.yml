# jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 4: 1–2 условие возвращения и клятва «жив Господь»; 3–4 новая пашня и обрезание
# сердца; 5–9 труба, знамя, лев с севера, вретище, ужас царей и священников; 10–18
# ропот пророка, жгучий ветер, колесницы, омой сердце, Дан и Ефрем, осада; 19–21 вопль
# пророка о утробе и шатрах; 22 незнание вождей; 23–26 видение пустой земли, дрожащих
# гор, исчезнувшего человека, сожжённого Кармила; 27–28 земля опустеет, но не до конца;
# 29–31 бегство, раскрашенная блудница, голос дочери Сиона.
# Голоса: 4:1–2 「…» (слово Господа; клятва 『…』 в 4:2); 4:3–4 「…»; 4:5–9 「…»
# (крик народа 『…』 в 4:13); 4:10 「…» (ропот пророка); 4:11–18 「…» (слова, которые
# будут сказаны, — 『…』 в 4:11; 『…』 в 4:16 дважды); 4:19–21 「…» (вопль пророка);
# 4:22 「…» (слово Господа); 4:23–26 авторский текст, кавычек нет; 4:27–28 「…»;
# 4:29 авторский текст; 4:30–31 「…» (голос дочери Сиона — 『…』 в 4:31).
# Нумерация по gr: 31 стих, совпадает с csl и ru. Слав. добавляет «(знамение)» в 4:6,
# «и беды» в 4:19, «(на сотрение)» в 4:20 и «запустелая» в 4:30 — эти чтения внесены
