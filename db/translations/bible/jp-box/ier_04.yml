verses:
  1: "「イスラエルよ、もしあなたが帰[かえ]るなら、と主[しゅ]は言[い]われる、わたしのもとへ帰[かえ]れ。もしあなたがわたしの目の前[まえ]から忌[い]まわしい偶像[ぐうぞう]を取[と]り除[のぞ]き、わたしの顔[かお]を恐[おそ]れるなら、"
  2: "あなたは『主[しゅ]は生[い]きておられる』と、真[しん]実[じつ]と裁[さば]きと義[ぎ]をもって誓[ちか]うだろう。そのとき、もろもろの民[たみ]は主[しゅ]によって祝福[しゅくふく]され、エルサレムで神[かみ]をほめたたえる。」"
  3: "主[しゅ]はこう言[い]われる。「ユダの人々[ひとびと]、エルサレムに住[す]む者[もの]たちよ、新[あたら]しい田畑[たはた]を自分[じぶん]のために耕[たがや]せ。茨[いばら]の中[なか]に種[たね]を蒔[ま]くな。"
  4: "ユダの人々[ひとびと]、エルサレムに住[す]む者[もの]たちよ、あなたがたの神[かみ]のために割礼[かつれい]を受[う]け、あなたがたの固[かた]い心[こころ]に割礼[かつれい]を施[ほどこ]せ。わたしの怒[いか]りが火[ひ]のように出[で]て燃[え]え上[あ]がり、あなたがたの悪[あく]い企[たくら]みのゆえに消[け]す者[もの]がいなくならないようにするために。」"
  5: "「ユダで告[つ]げ、エルサレムで聞[き]こえさせよ。言[い]え。『この地[ち]で角笛[つのぶえ]を吹[ふ]いて合図[あいず]せよ』と。声[こえ]を大[おお]きくして叫[さけ]べ。言[い]え。『集[あつ]まれ。われわれは城壁[じょうへき]のある町[まち]へ入[はい]ろう』と。"
  6: "シオンへ旗[はた]を掲[かか]げて逃[に]げよ。立[た]ち止[ど]まらずに急[いそ]げ。わたしは北[きた]から災[わざわ]いと大[おお]きな破壊[はかい]をもたらすからである。"
  7: "獅子[しし]がその棲[す]みかから上[のぼ]って来[き]た。もろもろの民[たみ]を滅[ほろ]ぼす者[もの]が立[た]ち上[あ]がり、自分[じぶん]の場所[ばしょ]から出[で]て来[き]た。あなたの地[ち]を荒[あ]らし、あなたの町々[まちまち]を住[す]む者[もの]のない廃墟[はいきょ]とするためである。"
  8: "このゆえに、粗布[あらぬの]を身[み]にまとい、泣[な]き、叫[さけ]べ。主[しゅ]の怒[いか]りの炎[ほのお]は、あなたがたから離[はな]れていないからである。"
  9: "その日[ひ]には、と主[しゅ]は言[い]われる、王[おう]の心[こころ]も君[きみ]たちの心[こころ]も失[うしな]われ、祭司[さいし]たちは驚[おどろ]き、預言者[よげんしゃ]たちは呆然[ぼうぜん]とする。」"
  10: "わたしは言[い]った。「ああ、主[しゅ]なる神[かみ]よ。あなたはこの民[たみ]とエルサレムを欺[あざむ]き、『あなたがたに平和[へいわ]がある』と言[い]われた。しかし、剣[つるぎ]が魂[たましい]にまで及[およ]んだ。」"
  11: "その時[とき]、この民[たみ]とエルサレムに言[い]われる。「荒野[こうや]の高[たか]みから吹[ふ]く迷[まよ]いの風[かぜ]が、わたしの民[たみ]の娘[むすめ]の道[みち]に吹[ふ]く。それは清[きよ]めのためでも、聖[せい]なるもののためでもない。"
  12: "満[み]ちあふれる風[かぜ]がわたしのもとに来[く]る。今[いま]、わたしは彼[かれ]らに対して裁[さば]きを語[かた]る。"
  13: "見[み]よ、彼[かれ]は雲[くも]のように上[のぼ]り、その戦車[せんしゃ]はつむじ風[かぜ]のようだ。その馬[うま]は鷲[わし]よりも速[はや]い。『ああ、わたしたちは災[わざわ]いだ。わたしたちは滅[ほろ]びる』。"
  14: "エルサレムよ、悪[あく]からあなたの心[こころ]を洗[あら]い清[きよ]めよ。救[すく]われるために。いつまで、あなたのうちに苦[くる]しみの思[おも]いが宿[やど]っているのか。"
  15: "ダンから告[つ]げる者[もの]の声[こえ]が来[き]、エフライムの山[やま]から苦[くる]しみの知[し]らせが聞[き]こえる。"
  16: "もろもろの民[たみ]に思[おも]い起[おこ]させよ。『見[み]よ、彼[かれ]らは来[き]た』と。エルサレムで告[つ]げよ。『包囲[ほうい]する者[もの]たちが遠[とお]い地[ち]から来[き]て、ユダの町々[まちまち]に向[む]かって声[こえ]を上[あ]げる』と。"
  17: "彼[かれ]らは畑[はたけ]を見張[みは]る者[もの]たちのように、町[まち]を四方[しほう]から囲[かこ]む。あなたがわたしに背[そむ]いたからである、と主[しゅ]は言[い]われる。"
  18: "あなたの道[みち]とあなたの企[たくら]みが、あなたにこのことをもたらした。これがあなたの悪[あく]であり、なんと苦[にが]いことか。それはあなたの心[こころ]にまで及[およ]んだ。」"
  19: "「わたしの腹[はら]よ、わたしの腹よ、わたしは苦[くる]しむ。心[こころ]の感[かん]じる所[ところ]も。わたしの魂[たましい]はもだえ、わたしの心[こころ]は引[ひ]き裂[さ]かれる。わたしは黙[だま]っていられない。わたしの魂[たましい]は角笛[つのぶえ]の音[ね]を、戦[いくさ]の叫[さけ]びと災[わざわ]いを聞[き]いたからである。」"
  20: "「苦[くる]しみが破壊[はかい]を呼[よ]び寄[よ]せる。地[ち]はことごとく荒[あ]れ果[は]てた。たちまち、わたしの天幕[てんまく]は荒[あ]らされ、わたしの幕[まく]は引[ひ]き裂[さ]かれた。」"
  21: "「いつまで、わたしは逃[に]げる者[もの]たちを見[み]、角笛[つのぶえ]の音[ね]を聞[き]かねばならないのか。」"
  22: "「まことに、わたしの民[たみ]の指導者[しどうしゃ]たちはわたしを知[し]らなかった。彼[かれ]らは愚[おろ]かな子[こ]らで、悟[さと]りがない。彼らは悪[あく]を行[おこな]うことには賢[かしこ]く、善[よ]いことを行[おこな]うことを知[し]らない。」"
  23: "わたしは地[ち]を見[み]た。見[み]よ、何[なに]もなかった。天[てん]を見[み]た。そこには光[ひかり]がなかった。"
  24: "わたしは山々[やまやま]を見[み]た。見[み]よ、それらは震[ふる]え、すべての丘[おか]は揺[ゆ]れ動[うご]いていた。"
  25: "わたしは見[み]た。見[み]よ、人[ひと]は一人[ひとり]もおらず、空[そら]のすべての鳥[とり]もおののいていた。"
  26: "わたしは見[み]た。見[み]よ、カルメルは荒野[こうや]となり、すべての町々[まちまち]は主[しゅ]の前[まえ]から、その怒[いか]りの炎[ほのお]の前[まえ]から火[ひ]で焼[や]かれ、消[き]え失[う]せていた。"
  27: "主[しゅ]はこう言[い]われる。「地[ち]はことごとく荒[あ]れ果[は]てる。しかし、わたしはそれを全[まった]く滅[ほろ]ぼしはしない。"
  28: "このゆえに、地[ち]は悲[かな]しみ、上[うえ]の天[てん]は暗[くら]くなる。わたしが語[かた]り、悔[く]い改[あらた]めず、決[けつ]いしたことを取[と]り消[け]さないからである。」"
  29: "馬[うま]の蹄[ひづめ]の音[おと]、弓[ゆみ]を引[ひ]き絞[しぼ]る者の音[おと]のゆえに、国[くに]はことごとく逃[に]げ去[さ]った。彼[かれ]らは洞窟[どうくつ]に入[はい]り、林[はやし]に身[み]を隠[かく]し、岩[いわ]の上[うえ]に登[のぼ]った。すべての町[まち]は捨[す]てられ、そこに住[す]む人[ひと]はいない。"
  30: "「荒[あ]らされた者[もの]よ、あなたはどうするのか。たとえ緋[ひ]色[いろ]の衣[ころも]をまとっても。たとえ金[きん]の飾[かざ]りで身[み]を飾っても。たとえ目[め]に化粧[けしょう]を施[ほどこ]しても。あなたの美[うつく]しさはむなしい。あなたの愛人[あいじん]たちはあなたを退[しりぞ]け、あなたの命[いのち]を求[もと]めている。"
  31: "わたしは聞[き]いた。産[さん]の苦[くる]しみの中[なか]にある女[おんな]の声[こえ]のような声[こえ]を。初[はじ]めて子[こ]を産[う]む女[おんな]のうめきのような、あなたのうめきを。シオンの娘[むすめ]の声[こえ]を。彼女[かのじょ]は力[ちから]を失[うしな]い、両手[りょうて]を垂[た]らして言[い]う。『ああ、わたしは災[わざわ]いだ。わたしの魂[たましい]は、殺[ころ]された者[もの]たちの前[まえ]に消[き]え入[い]る』と。」"

notes:
  1: "Ἐὰν ἐπιστραφῇ Ισραηλ, λέγει κύριος, πρός με ἐπιστραφήσεται — «если обратится Израиль, говорит Господь, ко Мне обратится»: повтор глагола ἐπιστρέφω сохранён. ἐὰν περιέλῃ τὰ βδελύγματα αὐτοῦ ἐκ στόματος αὐτοῦ — «если удалит мерзости свои из уст своих» (περιαιρέω — снимать, удалять; βδέλυγμα — мерзость, 偶像); слав. «отимеши мерзости твоя от уст твоих». καὶ ἀπὸ τοῦ προσώπου μου εὐλαβηθῇ — «и лица Моего убоится» (εὐλαβέομαι — благоговеть, страшиться). Стих обрывается на условии, продолжение — в 4:2, как в греч. Глава открывается словом Господа без вводной формулы — кавычки открываются здесь."
  2: "καὶ ὀμόσῃ Ζῇ κύριος — «и будешь клясться: жив Господь»: клятва — вложенная 『…』. μετὰ ἀληθείας καὶ ἐν κρίσει καὶ ἐν δικαιοσύνῃ — «в истине, и в суде, и в правде» (ἀλήθεια, κρίσις, δικαιοσύνη) — три члена, как в греч. εὐλογήσουσιν ἐν αὐτῇ ἔθνη — «благословятся в ней народы»; ἐν αὐτῷ αἰνέσουσιν τῷ θεῷ ἐν Ιερουσαλημ — «и в Нём восхвалят Бога в Иерусалиме»: слав. «в нем… во Иерусалиме». Местоимение ἐν αὐτῇ/αὐτῷ в тексте передано «主によって» (по смыслу ru); буквально — «в Нём/в ней». Кавычки закрываются."
  3: "τάδε λέγει κύριος τοῖς ἀνδράσιν Ιουδα — «так говорит Господь мужам Иуды»: дательный адресата, в японском обращение с よ. Νεώσατε ἑαυτοῖς νεώματα — «новите себе нови» (νεόω — обновлять, поднимать целину; νέωμα — новина, впервые вспаханное поле; слав. «поновите себе поля»). μὴ σπείρητε ἐπ᾽ ἀκάνθαις — «не сейте на терниях» (ἄκανθα — терние, 茨)."
  4: "περιτμήθητε τῷ θεῷ ὑμῶν — «обрежьтесь Богу вашему» (περιτέμνω — обрезать; дательный «для кого»); καὶ περιτέμεσθε τὴν σκληροκαρδίαν ὑμῶν — «и обрежьте жестокосердие ваше» (σκληροκαρδία — жёсткость сердца): двойное «обрезание» сохранено, это ключевое место. μὴ ἐξέλθῃ ὡς πῦρ ὁ θυμός μου καὶ ἐκκαυθήσεται — «да не выйдет, как огонь, гнев Мой и не возгорится» (ἐκκαίω). οὐκ ἔσται ὁ σβέσων — «не будет гасящего» (σβέννυμι); ἀπὸ προσώπου πονηρίας ἐπιτηδευμάτων ὑμῶν — «от лица злобы начинаний ваших»."
  5: "Ἀναγγείλατε ἐν τῷ Ιουδα — «объявите в Иудее»; ἀκουσθήτω ἐν Ιερουσαλημ — «да услышится в Иерусалиме». Σημάνατε ἐπὶ τῆς γῆς σάλπιγγι — «дайте знак трубою на земле» (σημαίνω — давать знак; σάλπιγξ — труба, 角笛). κεκράξατε μέγα — «возопите громко» (κράζω). Συνάχθητε καὶ εἰσέλθωμεν εἰς τὰς πόλεις τὰς τειχήρεις — «соберитесь, и войдём в города укреплённые» (τειχήρης — обнесённый стеной). Две вложенные цитаты 『…』 — приказы, которые надо объявить."
  6: "ἀναλαβόντες φεύγετε εἰς Σιων — «подняв [знамя], бегите в Сион»: в греч. причастие без дополнения, слав. дополняет «(знамение)» — в тексте 旗を掲げて, смысл из контекста и ru. σπεύσατε μὴ στῆτε — «спешите, не стойте» (σπεύδω — спешить). κακὰ ἐγὼ ἐπάγω ἀπὸ βορρᾶ — «Я навожу злое с севера» (ἐπάγω — наводить); καὶ συντριβὴν μεγάλην — «и сокрушение великое» (συντριβή — сокрушение, 破壊)."
  7: "ἀνέβη λέων ἐκ τῆς μάνδρας αὐτοῦ — «поднялся лев из логова своего» (μάνδρα — загон, логово; в тексте 棲みか). ἐξολεθρεύων ἔθνη ἐξῆρεν — «истребляющий народы поднялся» (ἐξολεθρεύω — истреблять; ἐξαίρω — поднимать). τοῦ θεῖναι τὴν γῆν εἰς ἐρήμωσιν — «чтобы обратить землю в опустошение» (ἐρήμωσις). αἱ πόλεις καθαιρεθήσονται παρὰ τὸ μὴ κατοικεῖσθαι αὐτάς — «города будут разрушены так, что в них не будут жить» (καθαιρέω — разрушать)."
  8: "ἐπὶ τούτοις περιζώσασθε σάκκους — «посему препояшьтесь вретищами» (σάκκος — вретище, грубая ткань, 粗布). κόπτεσθε καὶ ἀλαλάξατε — «плачьте [в грудь] и вопите» (κόπτομαι — бить себя в знак плача; ἀλαλάζω — вопить). διότι οὐκ ἀπεστράφη ὁ θυμὸς κυρίου ἀφ᾽ ὑμῶν — «ибо не отвратился гнев Господень от вас» (ἀποστρέφω); слав. «гнев ярости Господни»."
  9: "ἀπολεῖται ἡ καρδία τοῦ βασιλέως καὶ ἡ καρδία τῶν ἀρχόντων — «погибнет сердце царя и сердце князей» (ἀπόλλυμι); повтор «сердце» сохранён. οἱ ἱερεῖς ἐκστήσονται — «священники ужаснутся» (ἐξίστημι). οἱ προφῆται θαυμάσονται — «пророки изумятся» (θαυμάζω). λέγει κύριος внутри речи; кавычки закрываются в конце стиха."
  10: "Ропот пророка — прямая речь в 「…」. Ὦ δέσποτα κύριε — «о Владыко Господи» (δεσπότης; ср. 1:6). ἄρα γε ἀπατῶν ἠπάτησας — «неужели, обманывая, Ты обманул?» (ἀπατάω — обманывать; усиление повторением). Εἰρήνη ἔσται ὑμῖν — «мир будет вам»: слова, сказанные народу, — внутри речи. ἥψατο ἡ μάχαιρα ἕως τῆς ψυχῆς αὐτῶν — «меч коснулся до души их» (ἅπτομαι; ἕως — до)."
  11: "Πνεῦμα πλανήσεως ἐν τῇ ἐρήμῳ — «дух заблуждения в пустыне» (πλάνησις — блуждание, обман); ὁδὸς τῆς θυγατρὸς τοῦ λαοῦ μου — «путь дочери народа Моего». οὐκ εἰς καθαρὸν οὐδ᾽ εἰς ἅγιον — «не в чистое и не в святое», т. е. не для очищения и не для освящения (καθαρός, ἅγιος); у ru (МТ) «не для веяния и не для очищения» — иное чтение, держим LXX. Речь Господа о том, что будет сказано народу; слова, которые будут произнесены, в тексте не выделены отдельной цитатой, т. к. в греч. это одна фраза."
  12: "πνεῦμα πληρώσεως ἥξει μοι — «дух полноты придёт ко Мне» (πλήρωσις — наполнение, полнота); слав. «дух исполнения от сих приидет мне». νῦν δὲ ἐγὼ λαλῶ κρίματα πρὸς αὐτούς — «ныне же Я изреку суды против них» (κρίμα — суд, приговор). Темное место: πλήρωσις, вероятно, передаёт евр. «сильнее сего» (ru), но LXX и csl держат «полноту» — не сглажено."
  13: "ὡς νεφέλη ἀναβήσεται — «как облако поднимется» (νεφέλη). ὡς καταιγὶς τὰ ἅρματα αὐτοῦ — «как буря колесницы его» (καταιγίς — буря, вихрь; ἅρμα — колесница). κουφότεροι ἀετῶν οἱ ἵπποι αὐτοῦ — «легче орлов кони его» (κοῦφος — лёгкий, быстрый; ἀετός — орёл). οὐαὶ ἡμῖν, ὅτι ταλαιπωροῦμεν — «горе нам, ибо мы бедствуем»: голос народа внутри речи Господа — вложенная 『…』."
  14: "ἀπόπλυνε ἀπὸ κακίας τὴν καρδίαν σου — «омой от злобы сердце твоё» (ἀποπλύνω — отмывать; κακία — злоба). ἵνα σωθῇς — «чтобы спастись тебе» (σῴζω). ἕως πότε ὑπάρξουσιν ἐν σοὶ διαλογισμοὶ πόνων σου — «доколе будут в тебе помышления страданий твоих?» (διαλογισμός — помышление, 思い; πόνος — боль, страдание)."
  15: "φωνὴ ἀναγγέλλοντος ἐκ Δαν ἥξει — «голос возвещающего из Дана придёт» (ἀναγγέλλω — возвещать). ἀκουσθήσεται πόνος ἐξ ὄρους Εφραιμ — «услышится страдание с горы Ефремовой» (πόνος — боль, 苦しみ); слав. «болезнь от горы ефремли». Дан — северная граница, откуда идёт враг."
  16: "ἀναμνήσατε ἔθνη — «напомните народам» (ἀναμιμνῄσκω — напоминать); Ἰδοὺ ἥκασιν — «вот, они пришли»: первая вложенная 『…』. ἀναγγείλατε ἐν Ιερουσαλημ — «возвестите в Иерусалиме». Συστροφαὶ ἔρχονται ἐκ γῆς μακρόθεν — «отряды идут из земли далёкой» (συστροφή — сборище, отряд); ἔδωκαν ἐπὶ τὰς πόλεις Ιουδα φωνὴν αὐτῶν — «подали на города Иуды голос свой» — вторая вложенная 『…』."
  17: "ὡς φυλάσσοντες ἀγρὸν ἐγένοντο ἐπ᾽ αὐτὴν κύκλῳ — «они стали над ним кругом, как сторожа поля» (φυλάσσω — сторожить; ἀγρός — поле); слав. «аки стражы селнии быша над ним окрест». ὅτι ἐμοῦ ἠμέλησας — «ибо ты пренебрег Мною» (ἀμελέω — нерадеть)."
  18: "αἱ ὁδοί σου καὶ τὰ ἐπιτηδεύματά σου ἐποίησαν ταῦτά σοι — «пути твои и начинания твои сделали тебе это» (ἐπιτήδευμα — занятие, начинание). αὕτη ἡ κακία σου, ὅτι πικρά — «это злоба твоя, что горька» (πικρός). ὅτι ἥψατο ἕως τῆς καρδίας σου — «что коснулась до сердца твоего» (ἅπτομαι). Кавычки закрываются."
  19: "Вопль пророка — 「…」 до конца 4:21. τὴν κοιλίαν μου τὴν κοιλίαν μου ἀλγῶ — «утроба моя, утроба моя, я болею» (ἀλγέω — болеть; повтор сохранён). τὰ αἰσθητήρια τῆς καρδίας μου — «чувствилища сердца моего» (αἰσθητήριον — орган чувства). μαιμάσσει ἡ ψυχή μου — «мечется душа моя» (μαιμάσσω — биться, кипеть); σπαράσσεται ἡ καρδία μου — «разрывается сердце моё» (σπαράσσω). οὐ σιωπήσομαι — «не умолкну» (σιωπάω). φωνὴν σάλπιγγος ἤκουσεν ἡ ψυχή μου — «голос трубы услышала душа моя»; слав. добавляет «и беды» (вопль рати и беды) — нет в LXX, внесено без скобок (と災い)."
  20: "ταλαιπωρίαν συντριμμὸν ἐπικαλεῖται — «бедствие призывает сокрушение» (ταλαιπωρία — бедствие; συντριμμός — сокрушение; ἐπικαλέω — призывать); слав. «сотрение (на сотрение) призывается». τεταλαιπώρηκεν πᾶσα ἡ γῆ — «обеднела вся земля» (ταλαιπωρέω). ἄφνω τεταλαιπώρηκεν ἡ σκηνή — «внезапно обеднел шатёр мой» (ἄφνω — внезапно; σκηνή — шатёр, 天幕). διεσπάσθησαν αἱ δέρρεις μου — «расторглись покровы мои» (δέρρις — кожаный покров, палатка); слав. «расторгошася кожы моя»."
  21: "ἕως πότε ὄψομαι φεύγοντας — «доколе буду видеть бегущих?» (φεύγω — бежать); ἀκούων φωνὴν σαλπίγγων — «слыша голос труб» (σάλπιγξ). Вопрос без ответа; кавычки закрываются в конце стиха."
  22: "οἱ ἡγούμενοι τοῦ λαοῦ μου ἐμὲ οὐκ ᾔδεισαν — «вожди народа Моего не знали Меня» (ἡγέομαι — вести, начальствовать). υἱοὶ ἄφρονές εἰσιν καὶ οὐ συνετοί — «они сыны безумные и неразумные» (ἄφρων — безумный; συνετός — разумный). σοφοί εἰσιν τοῦ κακοποιῆσαι — «они мудры на злодеяние» (κακοποιέω); τὸ δὲ καλῶς ποιῆσαι οὐκ ἐπέγνωσαν — «а делать добро не познали». Контраст «мудры — не познали» сохранён."
  23: "ἐπέβλεψα ἐπὶ τὴν γῆν — «я воззрел на землю» (ἐπιβλέπω — взирать); καὶ ἰδοὺ οὐθέν — «и вот, ничего» (οὐθέν — ничто). εἰς τὸν οὐρανόν — «на небо»; οὐκ ἦν τὰ φῶτα αὐτοῦ — «не было светил его» (φῶτα — светила). Видение пророка, кавычек нет; ряд «смотрю — и вот» держит структуру 4:23–26."
  24: "εἶδον τὰ ὄρη, καὶ ἦν τρέμοντα — «я увидел горы, и они дрожали» (τρέμω — дрожать). πάντας τοὺς βουνοὺς ταρασσομένους — «все холмы колебались» (ταράσσω — колебать, смущать); слав. «вси холми возмутишася». Причастия переданы прошедшим длительным."
  25: "ἐπέβλεψα, καὶ ἰδοὺ οὐκ ἦν ἄνθρωπος — «я воззрел, и вот, не было человека». πάντα τὰ πετεινὰ τοῦ οὐρανοῦ ἐπτοεῖτο — «все птицы небесные трепетали» (πετεινόν — птица; πτοέω — пугать, приводить в трепет). У ru (МТ) «разлетелись» — иное понимание, в тексте по LXX/csl («ужасахуся»)."
  26: "εἶδον, καὶ ἰδοὺ ὁ Κάρμηλος ἔρημος — «я увидел, и вот, Кармил пуст» (ἔρημος — пустынный). πᾶσαι αἱ πόλεις ἐμπεπυρισμέναι πυρί — «все города сожжены огнём» (ἐμπυρίζω — сжигать). ἀπὸ προσώπου κυρίου — «от лица Господня»; ἀπὸ προσώπου ὀργῆς θυμοῦ αὐτοῦ — «от лица гнева ярости Его»: двойное «от лица» сохранено. ἠφανίσθησαν — «исчезли» (ἀφανίζω)."
  27: "Ἔρημος ἔσται πᾶσα ἡ γῆ — «пуста будет вся земля» (ἔρημος). συντέλειαν δὲ οὐ μὴ ποιήσω — «но полного истребления не сделаю» (συντέλεια — завершение, истребление); слав. «скончания же не сотворю». Стих начинается формулой «так говорит Господь» — она вне кавычек."
  28: "ἐπὶ τούτοις πενθείτω ἡ γῆ — «об этом да плачет земля» (πενθέω — плакать, скорбеть). συσκοτασάτω ὁ οὐρανὸς ἄνωθεν — «да помрачится небо свыше» (συσκοτάζω — помрачаться; ἄνωθεν — свыше). ἐλάλησα καὶ οὐ μετανοήσω — «Я сказал и не раскаюсь» (μετανοέω — раскаиваться, менять решение). ὥρμησα καὶ οὐκ ἀποστρέψω ἀπ᾽ αὐτῆς — «Я устремился и не отвращусь от этого» (ὁρμάω — устремляться). Кавычки закрываются."
  29: "ἀπὸ φωνῆς ἱππέως καὶ ἐντεταμένου τόξου — «от голоса всадника и натянутого лука» (ἱππεύς — всадник; ἐντείνω — натягивать; τόξος — лук). ἀνεχώρησεν πᾶσα χώρα — «отступила вся страна» (ἀναχωρέω). εἰσέδυσαν εἰς τὰ σπήλαια — «вошли в пещеры» (σπήλαιον); εἰς τὰ ἄλση ἐκρύβησαν — «в рощи скрылись» (ἄλσος); ἐπὶ τὰς πέτρας ἀνέβησαν — «на камни взошли». πᾶσα πόλις ἐγκατελείφθη — «всякий город оставлен» (ἐγκαταλείπω). Авторский текст."
  30: "καὶ σὺ τί ποιήσεις — «а ты что сделаешь?»; слав. добавляет «запустелая» («опустошённая») — нет в LXX, внесено без скобок (荒らされた者よ). ἐὰν περιβάλῃ κόκκινον — «если облечёшься в багряное» (κόκκινον — алая, червлёная ткань; 緋色). κοσμήσῃ κόσμῳ χρυσῷ — «украсишься убором золотым» (κόσμος — убор). ἐὰν ἐγχρίσῃ στίβι τοὺς ὀφθαλμούς σου — «если намажешь глаза свои сурьмой» (ἐγχρίω — намазывать; στίβι — сурьма, глазная краска; 化粧). εἰς μάτην ὁ ὡραισμός σου — «напрасно украшение твоё» (ὡραισμός — красота, украшение). ἀπώσαντό σε οἱ ἐρασταί σου — «отринули тебя любовники твои» (ἀπωθέω; ἐραστής — любовник). τὴν ψυχήν σου ζητοῦσιν — «души твоей ищут», т. е. жизни."
  31: "φωνὴν ὡς ὠδινούσης ἤκουσα — «голос, как у рождающей, я услышал» (ὠδίνω — мучиться родами). τοῦ στεναγμοῦ σου ὡς πρωτοτοκούσης — «стенания твоего, как у первородящей» (στεναγμός — стенание; πρωτοτοκέω — рожать впервые). ἐκλυθήσεται καὶ παρήσει τὰς χεῖρας αὐτῆς — «ослабеет и опустит руки свои» (ἐκλύω — ослабеть; παρίημι — опускать). Οἴμμοι ἐγώ — «о, горе мне!»; ἐκλείπει ἡ ψυχή μου ἐπὶ τοῖς ἀνῃρημένοις — «изнемогает душа моя при убитых» (ἐκλείπω; ἀναιρέω — убивать): голос дочери Сиона — вложенная 『…』; кавычки закрываются в конце."
