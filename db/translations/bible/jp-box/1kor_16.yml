# jp-box, Первое послание к Коринфянам, глава 16. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в notes.
# Глава 16: сбор для святых (1–4), планы Павла (5–12), заключение и приветствия (13–24).
# Красного и синего нет. 〔…〕: 16:24 — церковное ἀμήν (в базе стих кончается
# на ἐν Χριστῷ Ἰησοῦ, без ἀμήν). 16:22 μαράνα θά — транслитерацией マラナ・タ, пояснение в notes.
# Сносок ⟨…⟩ нет: 五旬節 и 聖なる接吻 уже пояснены при первых упоминаниях в корпусе
# (Деян 2:1; Рим 16:16). jp-ni не использовался.

tr_code: jp-box
book: 1kor
chapter: 16
draft: true

verses:
  1: "聖[せい]なる者[もの]たちのための献金[けんきん]については、わたしがガラテヤの諸教会[しょきょうかい]に命[めい]じたとおりに、あなたがたもそのようにしなさい。"
  2: "週[しゅう]の初[はじ]めの日[ひ]ごとに、あなたがたはそれぞれ、得[え]たところに応[おう]じてそれを蓄[たくわ]え、手元[てもと]に置[お]いておきなさい。わたしが行[い]ったとき、そのときになって集[あつ]めることのないようにするためである。"
  3: "わたしが行[い]ったときには、あなたがたが認[みと]めた者[もの]たちに手紙[てがみ]を添[そ]えて遣[つか]わし、あなたがたの恵[めぐ]みをエルサレムへ届[とど]けさせよう。"
  4: "もし、わたしも行[い]くのがふさわしければ、彼[かれ]らはわたしと一緒[いっしょ]に行[い]くであろう。"
  5: "わたしはマケドニアを通[とお]り抜[ぬ]けたら、あなたがたのところへ行[い]く。マケドニアは通[とお]り抜[ぬ]けるだけだからである。"
  6: "あなたがたのもとで、しばらく過[す]ごし、冬[ふゆ]を越[こ]すことになるかもしれない。あなたがたに、わたしが行[い]く先[さき]まで送[おく]ってもらうためである。"
  7: "なぜなら、わたしは今[いま]、途中[とちゅう]でちょっと会[あ]いたいとは思[おも]わないからである。主[しゅ]がお許[ゆる]しになるなら、しばらくあなたがたと一緒[いっしょ]にいたいと望[のぞ]んでいる。"
  8: "わたしは五旬節[ごじゅんせつ]までエフェソに滞在[たいざい]する。"
  9: "なぜなら、わたしのために、大[おお]きく、よく働[はたら]く門[とびら]が開[ひら]かれているからである。しかし、反対[はんたい]する者[もの]も多[おお]い。"
  10: "テモテが行[い]ったなら、彼[かれ]が恐[こわ]がることなくあなたがたのもとにいられるように、見[み]てやりなさい。彼[かれ]は、わたしと同じように主[しゅ]の業[わざ]をしているからである。"
  11: "だから、だれも彼[かれ]を軽[かろ]んじてはならない。彼[かれ]を平安[へいあん]のうちに送[おく]り出[だ]し、わたしのもとへ来[こ]られるようにしなさい。彼[かれ]が兄弟[きょうだい]たちと一緒[いっしょ]に来[く]るのを、わたしは待[ま]っているからである。"
  12: "兄弟[きょうだい]アポロについては、彼[かれ]が兄弟[きょうだい]たちと一緒[いっしょ]にあなたがたのところへ行[い]くよう、わたしは大[おお]いに勧[すす]めた。しかし、今[いま]すぐに行[い]くことは、彼[かれ]にはどうしても望[のぞ]まなかった。機会[きかい]があれば行[い]くであろう。"
  13: "目[め]を覚[さ]ましていなさい。信仰[しんこう]に立[た]ち、雄々[おお]しくし、強[つよ]くありなさい。"
  14: "すべてのことを、愛[あい]をもって行[おこな]いなさい。"
  15: "兄弟[きょうだい]たちよ、あなたがたに勧[すす]める。あなたがたは、ステファナの家[いえ]がアカイアの初穂[はつほ]であり、彼[かれ]らが聖[せい]なる者[もの]たちへの奉仕[ほうし]に自分[じぶん]をささげたことを知[し]っている。"
  16: "あなたがたも、そういう者[もの]たちに、また、ともに働[はたら]き労苦[ろうく]するすべての者[もの]に従[したが]いなさい。"
  17: "ステファナ、フォルトナト、アカイコが来[き]たことを喜[よろこ]んでいる。彼[かれ]らは、あなたがたの不足[ふそく]を補[おぎな]ってくれたからである。"
  18: "彼[かれ]らはわたしの霊[れい]と、あなたがたの霊[れい]を安[やす]めてくれたからである。それゆえ、そういう者[もの]たちを敬[うやま]いなさい。"
  19: "アジアの諸教会[しょきょうかい]が、あなたがたによろしくと言[い]っている。アクラとプリスキラが、彼[かれ]らの家[いえ]にある教会[きょうかい]とともに、主[しゅ]にあって心[こころ]からあなたがたによろしくと言[い]っている。"
  20: "すべての兄弟[きょうだい]たちが、あなたがたによろしくと言[い]っている。聖[せい]なる接吻[せっぷん]をもって、互[たが]いに挨拶[あいさつ]しなさい。"
  21: "この挨拶[あいさつ]は、わたしパウロが自分[じぶん]の手[て]で書[か]いたものである。"
  22: "主[しゅ]を愛[あい]さない者[もの]は、呪[のろ]われるがよい。マラナ・タ。"
  23: "主[しゅ]イエスの恵[めぐ]みが、あなたがたとともにありますように。"
  24: "わたしの愛[あい]が、キリスト・イエスにあって、あなたがたすべてとともにありますように。〔アーメン〕。"

notes:
  1: "λογεία — 献金 (сбор); εἰς τοὺς ἁγίους — 聖なる者たちのため. Γαλατία — ガラテヤ."
  2: "κατὰ μίαν σαββάτου — «в первый день недели»; 週の初めの日. θησαυρίζων — 蓄える; ὅ τι ἐὰν εὐοδῶται — 得たところに応じて."
  3: "δοκιμάσητε — 認める; δι᾿ ἐπιστολῶν — 手紙を添えて; χάρις — 恵み (о собранном)."
  5: "Μακεδονία — マケドニア; διέρχομαι — 通り抜ける."
  6: "παραχειμάσω — 冬を越す; προπέμψητε — 送り出す."
  7: "ἐν παρόδῳ — 途中で; ἐὰν ὁ κύριος ἐπιτρέψῃ — 主がお許しになるなら."
  8: "πεντηκοστή — 五旬節 (сноска уже при первом упоминании в корпусе, Деян 2:1)."
  9: "θύρα … ἀνέῳγεν μεγάλη καὶ ἐνεργής — 大きく、よく働く門; ἀντικείμενοι — 反対する者."
  10: "Τιμόθεος — テモテ; ἀφόβως — 恐がることなく."
  11: "ἐξουθενήσῃ — 軽んじる; προπέμψατε ἐν εἰρήνῃ — 平安のうちに送り出す."
  12: "Ἀπολλῶ — アポロ; πάντως οὐκ ἦν θέλημα — どうしても望まなかった; εὐκαιρήσῃ — 機会がある."
  13: "γρηγορεῖτε — 目を覚ます; στήκετε — 立つ; ἀνδρίζεσθε — 雄々しくする; κραταιοῦσθε — 強くある."
  15: "Στεφανᾶ — ステファナ; Ἀχαΐα — アカイア; ἀπαρχή — 初穂; διακονία — 奉仕."
  16: "ὑποτάσσησθε — 従う; συνεργοῦντι καὶ κοπιῶντι — ともに働き労苦する."
  17: "Στεφανᾶ, Φορτουνάτος, Ἀχαϊκός — ステファナ, フォルトナト, アカイコ; ὑστέρημα — 不足."
  18: "ἀνέπαυσαν — 安める; ἐπιγινώσκετε — 認める, 敬う."
  19: "Ἀσία — アジア; Ἀκύλας καὶ Πρίσκα — アクラとプリスキラ (имена выровнены по корпусу: в Деяниях アクラ, プリスキラ; здесь греч. Πρίσκα, но имя унифицировано, чтобы читатель узнавал тех же людей). κατ᾿ οἶκον ἐκκλησία — 家にある教会."
  20: "ἅγιον φίλημα — 聖なる接吻 (сноска уже при первом упоминании в корпусе, Рим 16:16)."
  21: "Ὁ ἀσπασμὸς τῇ ἐμῇ χειρὶ Παύλου — 自分の手で書いた挨拶."
  22: "ἀνάθεμα — «преданное проклятию, отлучённое»; 呪われるがよい. μαράνα θά — арам. «Господь наш, приди» (или «Господь пришёл»); оставлено транслитерацией マラナ・タ, как в церковной традиции."
  23: "ἡ χάρις τοῦ κυρίου Ἰησοῦ — 主イエスの恵み (в базе без Χριστός; не добавляем)."
  24: "В базе стих кончается ἐν Χριστῷ Ἰησοῦ, без ἀμήν; церковный текст (jp-joc「アミン」) прибавляет ἀμήν — 〔アーメン〕. Проверено по базе: ἀμήν в стихе — 0."
