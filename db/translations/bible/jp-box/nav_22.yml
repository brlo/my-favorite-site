# jp-box, Иисус Навин, глава 22. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в этой главе нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 22: отпуск заиорданских племён (1–8), их возвращение и жертвенник при
# Иордане (9–10), слух и сбор войска (11–12), посольство Финееса (13–15),
# обвинение в отступничестве (16–20), ответ племён (21–29), мирное решение (30–34).
# Нумерация совпадает с csl-ru: 34 стиха.
# Кавычки: речь Иисуса — 「…」 (2–5); речь посольства — 「…」 (16–20); ответ
# племён — 「…」 (22–29); слова, приводимые говорящими внутри речи, — 『…』
# (24, 26, 27, 28). Красного нет.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (сверено bracket_check.rb).
# Сноска ⟨…⟩ одна: サラミン в 22:29 — негреческое слово в LXX (вероятно, евр.
# שְׁלָמִים, «мирные жертвы»); в слав. оставлено без перевода «саламин», в ru опущено.
# Термины: θυσιαστήριον / βωμός — 祭壇; θυσία σωτηρίου — 酬恩祭; μαρτύριον — 証;
# χιλίαρχοι — 千人隊長.
# LXX: 22:7–8 в гр-тексте одно предложение, поэтому ст. 7 кончается на 「…とき、」,
# а ст. 8 продолжает его; вставки ru «то сказал им» в гр-тексте нет. 22:8 без «меди»
# (в слав. «и медь»). 22:10 Γαλγαλα τοῦ Ιορδάνου — Галгал Иорданский (в слав.
# «галилоф», в ru «окрестности Иордана»). 22:17 Φογωρ — Фогор (フォゴル, ср.
# Втор 4:46). 22:20 Αχαρ — Ахар (アハル, по брифу; в слав. «ахар», в ru «Ахан»).
# 22:28 в гр-тексте нет аподосиса («то мы скажем»), добавленного в ru.
# jp-ni не использовался.

