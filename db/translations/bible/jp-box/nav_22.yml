verses:
  1: "そのとき、ヨシュアはルベンの子[こ]らとガドの子らとマナセの部族[ぶぞく]の半分[はんぶん]を呼[よ]び集[あつ]めた。"
  2: "そして彼らに言[い]った。「あなたがたは、主[しゅ]のしもべモーセがあなたがたに命[めい]じたすべてのことを聞[き]き、わたしがあなたがたに命じたすべてのことについて、わたしの声[こえ]に聞[き]き従[したが]った。"
  3: "あなたがたは、これらの日々[ひび]、いや、それ以上の日々を、今日[きょう]に至[いた]るまで、あなたがたの兄弟[きょうだい]たちを捨[す]て去[さ]らなかった。あなたがたの神[かみ]である主[しゅ]の戒[いまし]めを守[まも]ったのである。"
  4: "しかし今[いま]、私たちの神[かみ]である主[しゅ]は、私たちの兄弟たちを、主が彼らに言[い]われたとおりに休[やす]ませられた。だから今、あなたがたは帰[かえ]って、自分の家[いえ]へ、また、ヨルダン川[がわ]の向[む]こう側[がわ]でモーセがあなたがたに与[あた]えた、あなたがたの所有[しょゆう]の地[ち]へ行[い]きなさい。"
  5: "ただ、あなたがたは、主[しゅ]のしもべモーセがあなたがたに命[めい]じた戒[いまし]めと律法[りっぽう]を、ひたすら守[まも]って行[おこな]いなさい。すなわち、あなたがたの神[かみ]である主を愛[あい]し、そのすべての道[みち]を歩[あゆ]み、その戒めを守り、主に寄[よ]り添[そ]い、思[おも]いを尽[つ]くし、魂[たましい]を尽くして主に仕[つか]えなさい。」"
  6: "そしてヨシュアは彼らを祝福[しゅくふく]し、彼らを送[おく]り出[だ]した。彼らは自分の家[いえ]へ帰[かえ]った。"
  7: "モーセはマナセの部族[ぶぞく]の半分[はんぶん]にバシャンで嗣業[しぎょう]を与[あた]え、残[のこ]りの半分にはヨシュアが、その兄弟[きょうだい]たちとともに、ヨルダン川[がわ]の向[む]こう側[がわ]、海[うみ]のほとりで与えた。ヨシュアが彼らを家[いえ]へ送[おく]り出[だ]して祝福[しゅくふく]したとき、"
  8: "彼らは多くの財[ざい]をもって自分の家[いえ]へ帰[かえ]った。すなわち、非常[ひじょう]に多くの家畜[かちく]、銀[ぎん]、金[きん]、鉄[てつ]、そして多くの衣[ころも]である。彼らは敵[てき]の分捕[ぶんど]り物[もの]を、その兄弟[きょうだい]たちと分[わ]けた。"
  9: "ルベンの子[こ]らとガドの子らとマナセの部族[ぶぞく]の半分[はんぶん]は、カナンの地[ち]のシロでイスラエルの子らと別[わか]れ、主[しゅ]の命令[めいれい]によってモーセの手[て]を通[とお]して嗣業[しぎょう]として受[う]け継[つ]いだ、自分[じぶん]たちの所有[しょゆう]の地[ち]、ギレアデの地へ行[い]くために帰[かえ]った。"
  10: "彼らはヨルダン川[がわ]のガルガル、すなわちカナンの地[ち]にある所[ところ]へ来[き]た。そしてガドの子[こ]らとルベンの子らとマナセの部族[ぶぞく]の半分[はんぶん]は、そこ、ヨルダン川のほとりに祭壇[さいだん]を建[た]てた。見[み]るに大[おお]きな祭壇であった。"
  11: "イスラエルの子[こ]らは、こう言[い]うのを聞[き]いた。「見[み]よ、ガドの子らとルベンの子らとマナセの部族[ぶぞく]の半分[はんぶん]が、カナンの地[ち]の境[さかい]に、ヨルダン川[がわ]のギレアデのところ、イスラエルの子らの向[む]こう側[がわ]に祭壇[さいだん]を建てた。」"
  12: "そこでイスラエルの子[こ]らは皆、彼らと戦[たたか]うために上[のぼ]ろうとして、シロに集[あつ]まった。"
  13: "イスラエルの子[こ]らは、ギレアデの地[ち]にいるルベンの子らとガドの子らとマナセの部族[ぶぞく]の半分[はんぶん]のもとへ、祭司[さいし]エレアザルの子[こ]である大祭司[だいさいし]アロンの子ピネハスを送[おく]った。"
  14: "また、彼とともに十[じゅう]人の長[かしら]たち、すなわちイスラエルのすべての部族[ぶぞく]から氏族[しぞく]の家[いえ]ごとに一[ひと]人の長を送った。彼らは氏族の家の長であり、イスラエルの千人[せんにん]の長たちである。"
  15: "彼らはギレアデの地[ち]にいるガドの子[こ]らとルベンの子らとマナセの部族[ぶぞく]の半分[はんぶん]のもとに来[き]て、彼らに語[かた]って言[い]った。"
  16: "「主[しゅ]の会衆[かいしゅう]はすべてこう言[い]う。あなたがたがイスラエルの神[かみ]の前[まえ]で犯[おか]したこの罪[つみ]は何[なに]か。すなわち、今日[きょう]、主[しゅ]から離[はな]れて、自分[じぶん]たちのために祭壇[さいだん]を建[た]て、主から背[そむ]く者[もの]となったことである。"
  17: "フォゴルの罪[つみ]は、私たちにとって小[ちい]さなことだったのか。私たちは今日[きょう]に至[いた]るまで、それから清[きよ]められず、主[しゅ]の会衆[かいしゅう]のうちに災[わざわ]いが起[お]きたではないか。"
  18: "そして、あなたがたは今日[きょう]、主[しゅ]から離[はな]れようとしている。もしあなたがたが今日、主から離れるなら、明日[あす]にはその怒[いか]りがイスラエル全体[ぜんたい]の上[うえ]に及[およ]ぶであろう。"
  19: "しかし、もしあなたがたの所有[しょゆう]の地[ち]が小[ちい]さいと思うなら、主[しゅ]の所有の地、すなわち主の幕屋[まくや]がそこに住[す]まう所[ところ]へ渡[わた]って、私たちの間[あいだ]で嗣業[しぎょう]を受[う]けなさい。ただ、あなたがたの神[かみ]である主[しゅ]の祭壇[さいだん]のほかに祭壇を建[た]てて、主に背[そむ]いたり、私たちから離[はな]れたりしてはならない。"
  20: "アハル、すなわちザラの子[こ]は、聖絶[せいぜつ]の物[もの]のことで罪[つみ]を犯[おか]し、その怒[いか]りがイスラエルの会衆[かいしゅう]全体[ぜんたい]に及[およ]んだではないか。彼は一人[ひとり]であったのに、彼は自分の罪によって死[し]んだのではないのか。」"
  21: "ルベンの子[こ]らとガドの子らとマナセの部族[ぶぞく]の半分[はんぶん]は答[こた]えて、イスラエルの千人[せんにん]の長[かしら]たちに言[い]った。"
  22: "「神[かみ]の神[かみ]である主[しゅ]、神の神である主ご自身[じしん]が知[し]っておられる。イスラエルもまた知[し]るであろう。もし私たちが背[そむ]きのうちに、主[しゅ]の前[まえ]で罪[つみ]を犯[おか]したのなら、この日[ひ]、どうか私たちを救[すく]い出[だ]さないでください。"
  23: "もし私たちが、主[しゅ]から離[はな]れるために、自分[じぶん]たちに祭壇[さいだん]を建[た]て、その上[うえ]に燔祭[はんさい]の犠牲[ぎせい]を上[のぼ]らせ、あるいはその上に酬恩祭[しゅうおんさい]を献[ささ]げたのなら、主[しゅ]ご自身がそれを問[と]いただされるであろう。"
  24: "そうではなく、私たちは警戒[けいかい]のゆえに、こう言[い]ってこれをしたのである。すなわち、明日[あす]、あなたがたの子[こ]らが私たちの子らに、『あなたがたはイスラエルの神[かみ]である主[しゅ]と、何[なん]の関[かか]わりがあるのか』と言[い]うことがないように。"
  25: "主[しゅ]は私たちとあなたがたの間[あいだ]に、ヨルダン川[がわ]を境[さかい]として置[お]かれた。あなたがたには主[しゅ]の分[ぶん]がない。こうして、あなたがたの子[こ]らは私たちの子らを遠[とお]ざけ、主を崇[あが]めないようにするであろう。"
  26: "そこで私たちは、こうしようと言[い]った。『この祭壇[さいだん]を建[た]てよう。ただし、捧[ささ]げ物[もの]のためでも犠牲[ぎせい]のためでもない。』"
  27: "それは、この祭壇[さいだん]が、私たちとあなたがたの間[あいだ]、また私たちの後[のち]の世代[せだい]とあなたがたとの間で、主[しゅ]の前[まえ]で、私たちの捧[ささ]げ物[もの]と犠牲[ぎせい]と酬恩祭[しゅうおんさい]によって主に仕[つか]えるための証[あかし]となるためである。そして、あなたがたの子[こ]らが明日[あす]、私たちの子らに『あなたがたには主[しゅ]の分[ぶん]がない』と言[い]うことがないためである。"
  28: "そして私たちは言[い]った。『もし、いつか彼らが私たちや、私たちの後[のち]の世代[せだい]に語[かた]り、明日[あす]、主[しゅ]の祭壇[さいだん]に似[に]たものを見[み]よと言[い]うなら。それは私たちの父[ちち]たちが建[た]てたものだが、捧[ささ]げ物[もの]のためでも犠牲[ぎせい]のためでもなく、あなたがたと私たちの間[あいだ]、また私たちの子[こ]らの間の証[あかし]である。』"
  29: "だから、私たちが主[しゅ]から離[はな]れ、この日[ひ]、主から背[そむ]いて、捧[ささ]げ物[もの]とサラミン⟨ヘブライ語「シュラミム」（酬恩祭）に由来するとみられる語。⟩の犠牲[ぎせい]と酬恩祭[しゅうおんさい]のために祭壇[さいだん]を建[た]てるなど、決[けっ]してあってはならない。ただ、主[しゅ]の祭壇[さいだん]、すなわちその幕屋[まくや]の前[まえ]にある祭壇のほかは、ない。」"
  30: "祭司[さいし]ピネハスと、彼とともにいた会衆[かいしゅう]のすべての長[かしら]たち、すなわちイスラエルの長たちは、ルベンの子[こ]らとガドの子らとマナセの部族[ぶぞく]の半分[はんぶん]が語[かた]ったその言葉[ことば]を聞[き]いて、それを良[よ]しとした。"
  31: "祭司[さいし]ピネハスは、ルベンの子[こ]らとガドの子らとマナセの部族[ぶぞく]の半分[はんぶん]に言[い]った。「今日[きょう]、私たちは、主[しゅ]が私たちとともにおられることを知[し]った。あなたがたが主の前[まえ]でこの罪[つみ]を犯[おか]さず、イスラエルの子[こ]らを主の手[て]から救[すく]い出[だ]したからである。」"
  32: "祭司[さいし]ピネハスと長[かしら]たちは、ルベンの子[こ]らとガドの子らとマナセの部族[ぶぞく]の半分[はんぶん]のもとから、ギレアデの地[ち]を出[で]てカナンの地[ち]へ、イスラエルの子らのもとへ帰[かえ]り、彼らにその言葉[ことば]を答[こた]えた。"
  33: "そのことはイスラエルの子[こ]らに良[よ]しとされた。そして彼らはイスラエルの子らに語[かた]り、イスラエルの子らの神[かみ]をほめたたえて、もはや、ルベンの子らの地[ち]、ガドの子らの地、マナセの部族[ぶぞく]の半分[はんぶん]の地を滅[ほろ]ぼすために、彼らに向[む]かって戦[たたか]いに上[のぼ]ることはない、と言った。そして彼らはその地[ち]に住[す]んだ。"
  34: "ヨシュアは、ルベンの子[こ]らとガドの子らとマナセの部族[ぶぞく]の半分[はんぶん]の祭壇[さいだん]に名[な]をつけて言[い]った。「これは、主[しゅ]が彼らの神[かみ]であることを、彼らの間[あいだ]で証[あかし]するものである。」"

notes:
  1: "συνεκάλεσεν — «созвал» (συγκαλέω). Три заиорданских племени: Рувим, Гад и половина Манассии (ср. 1:12–15; Числ 32)."
  2: "ἀκηκόατε πάντα ὅσα ἐνετείλατο — «вы слышали (послушались) всего, что заповедал» (ἀκούω в значении послушания). ἐπηκούσατε τῆς φωνῆς μου — «послушались голоса моего» (ἐπακούω). παῖς κυρίου — しもべ."
  3: "οὐκ ἐγκαταλελοίπατε — «не оставили» (ἐγκαταλείπω). ταύτας τὰς ἡμέρας καὶ πλείους — «эти дни и многие (более)». ἐφυλάξασθε τὴν ἐντολήν — «сохранили заповедь»."
  4: "κατέπαυσεν κύριος ὁ θεὸς ἡμῶν τοὺς ἀδελφοὺς ἡμῶν — «успокоил Господь Бог наш братьев наших»: в гр-тексте «наш», в слав. «Бог ваш… братию вашу». ὃν τρόπον εἶπεν αὐτοῖς — «как сказал им». γῆ τῆς κατασχέσεως — земля владения."
  5: "φυλάξασθε ποιεῖν σφόδρα — «старайтесь тщательно исполнять» (σφόδρα — «весьма»). προσκεῖσθαι αὐτῷ — «прилепляться к Нему» (πρόσκειμαι). ἐξ ὅλης τῆς διανοίας — «всем разумением» (διάνοια; слав. «от всего сердца»), ἐξ ὅλης τῆς ψυχῆς — «всею душою»."
  6: "ηὐλόγησεν … ἐξαπέστειλεν — благословил и отпустил (εὐλογέω, ἐξαποστέλλω). В гр-тексте стих кончается тире — знаком продолжения в ст. 7."
  7: "τῷ ἡμίσει φυλῆς Μανασση — половине племени Манассии. ἐν τῇ Βασανίτιδι — в Васанитиде (バシャン). παρὰ θάλασσαν — «при море», т. е. к западу от Иордана. Ἡνίκα ἐξαπέστειλεν … καὶ εὐλόγησεν — «когда отпустил… и благословил»; главное предложение — в ст. 8."
  8: "ἐν χρήμασιν πολλοῖς — «с большим имуществом» (χρῆμα). κτήνη πολλὰ σφόδρα — «скота весьма много». В гр-тексте нет «меди» (в слав. «и медь»). προνομή — добыча, награбленное (分捕り物). Стих продолжает предложение ст. 7; вставка ru «то сказал им» в гр-тексте отсутствует."
  9: "ἀπὸ τῶν υἱῶν Ισραηλ ἐκ Σηλω — «от сынов Израилевых, из Сило» (ἀπό с генитивом — «от»). εἰς γῆν Γαλααδ — в землю Галаад. διὰ προστάγματος κυρίου ἐν χειρὶ Μωυσῆ — «по повелению Господню рукою Моисея»."
  10: "Γαλγαλα τοῦ Ιορδάνου — Галгал Иорданский (ガルガル; в слав. «галилоф», в ru «окрестности Иордана»). βωμὸν ἐπὶ τοῦ Ιορδάνου — жертвенник при Иордане. βωμὸν μέγαν τοῦ ἰδεῖν — «жертвенник великий на вид» (τοῦ ἰδεῖν — «чтобы видеть»)."
  11: "ἐφ᾽ ὁρίων γῆς Χανααν — «на пределах земли Ханаанской». ἐπὶ τοῦ Γαλααδ τοῦ Ιορδάνου — «при Галааде Иордана» (Γαλααδ здесь как местность у реки). ἐν τῷ πέραν υἱῶν Ισραηλ — «на той стороне сынов Израилевых»."
  12: "συνηθροίσθησαν — «собрались» (συναθροίζω). εἰς Σηλω — в Силом. ὥστε ἀναβάντες ἐκπολεμῆσαι — «чтобы, поднявшись, воевать» (ἐκπολεμέω)."
  13: "ἀπέστειλαν … τὸν Φινεες υἱὸν Ελεαζαρ υἱοῦ Ααρων τοῦ ἀρχιερέως — «послали Финееса, сына Елеазара, сына Аарона первосвященника». εἰς γῆν Γαλααδ — в землю Галаад."
  14: "ἄρχων εἷς ἀπὸ οἴκου πατριᾶς — «по одному начальнику от дома отечества». χιλίαρχοι Ισραηλ — тысяченачальники Израиля (千人隊長)."
  15: "παρεγένοντο — «прибыли» (παραγίνομαι). πρὸς τοὺς ἡμίσεις φυλῆς Μανασση — «к половинам племени Манассии» (мн. ч.). ἐλάλησαν … λέγοντες — «говорили, сказав»."
  16: "Τάδε λέγει πᾶσα ἡ συναγωγὴ κυρίου — «так говорит весь сонм Господень». πλημμέλεια — преступление, проступок (πλημμέλεια). ἀποστραφῆναι … ἀποστάτας ὑμᾶς γενέσθαι — «отвратиться… стать отступниками» (ἀποστάτης)."
  17: "μὴ μικρὸν ἡμῖν τὸ ἁμάρτημα Φογωρ — «разве мало нам греха Фогора» (Φογωρ — Беф-Фегор; フォゴル, ср. Втор 4:46). οὐκ ἐκαθαρίσθημεν ἀπ᾽ αὐτοῦ — «мы не очистились от него» (καθαρίζω). πληγή — поражение, язва (災い)."
  18: "ἀποστραφήσεσθε — «отвращаетесь» (буд. в значении настоящего). ἐὰν ἀποστῆτε … αὔριον … ἔσται ἡ ὀργή — «если отступите… завтра… будет гнев»."
  19: "εἰ μικρὰ ὑμῖν ἡ γῆ τῆς κατασχέσεως ὑμῶν — «если мала вам земля владения вашего». οὗ κατασκηνοῖ ἐκεῖ ἡ σκηνὴ κυρίου — «где обитает скиния Господня» (κατασκηνόω). κατακληρονομήσατε ἐν ἡμῖν — «получите удел среди нас». ἀποστάται ἀπὸ θεοῦ — «отступники от Бога»."
  20: "Αχαρ ὁ τοῦ Ζαρα — Ахар, сын Зары (アハル; в слав. «ахар», в ru «Ахан», ср. Нав 7). πλημμελείᾳ ἐπλημμέλησεν ἀπὸ τοῦ ἀναθέματος — «преступлением преступил от заклятого» (ἀνάθεμα — 聖絶). εἷς μόνος ἦν — «он был один только». μὴ μόνος … ἀπέθανεν — «не один ли он умер» (риторический вопрос)."
  21: "ἀπεκρίθησαν … καὶ ἐλάλησαν τοῖς χιλιάρχοις — «отвечали… и говорили тысяченачальникам»."
  22: "Ὁ θεὸς θεός ἐστιν κύριος — «Бог богов есть Господь» (букв.; слав. «Бог Бог, Господь есть»). αὐτὸς οἶδεν — «Он знает». εἰ ἐν ἀποστασίᾳ ἐπλημμελήσαμεν — «если в отступлении мы согрешили». μὴ ῥύσαιτο ἡμᾶς — оптатив проклятия: «да не избавит нас» (ῥύομαι)."
  23: "ὥστε ἀναβιβᾶσαι … θυσίαν ὁλοκαυτωμάτων — «вознести жертву всесожжений» (ἀναβιβάζω). θυσία σωτηρίου — 酬恩祭 (ср. Лев 3:1). κύριος ἐκζητήσει — «Господь взыщет» (ἐκζητέω)."
  24: "ἕνεκεν εὐλαβείας ῥήματος — «ради благоговения (осторожности) слова» (εὐλάβεια; слав. «благоговения глагола»). Ἵνα μὴ εἴπωσιν … Τί ὑμῖν κυρίῳ τῷ θεῷ Ισραηλ — «чтобы не сказали…: что вам до Господа Бога Израилева?» (τί ὑμῖν — оборот «что вам до»)."
  25: "ὅρια ἔθηκεν κύριος … τὸν Ιορδάνην — «пределы положил Господь… Иордан». οὐκ ἔστιν ὑμῖν μερὶς κυρίου — «нет вам части у Господа». ἀπαλλοτριώσουσιν — «отчудят, лишат» (ἀπαλλοτριόω). σέβωνται — «чтут» (σέβω)."
  26: "εἴπαμεν ποιῆσαι οὕτως — «мы сказали сделать так». οὐχ ἕνεκεν καρπωμάτων οὐδὲ ἕνεκεν θυσιῶν — «не ради приношений и не ради жертв»."
  27: "μαρτύριον — свидетельство (証). ἀνὰ μέσον … τῶν γενεῶν ἡμῶν μεθ᾽ ἡμᾶς — «между… родами нашими после нас». λατρεύειν λατρείαν κυρίῳ — «служить служение Господу» (внутренний винительный). ἐν τοῖς καρπώμασιν … θυσίαις τῶν σωτηρίων — «приношениями… жертвами спасения»."
  28: "Ἐὰν γένηταί ποτε — «если когда-нибудь будет». ὁμοίωμα τοῦ θυσιαστηρίου — «подобие жертвенника» (ὁμοίωμα). В гр-тексте нет аподосиса («то мы скажем»), который добавлен в ru; поэтому конец стиха передан без вставки."
  29: "μὴ γένοιτο — «да не будет» (γίνομαι, оптатив). θυσίαις σαλαμιν — サラミン: негреческое слово (вероятно, евр. שְׁלָמִים, «мирные жертвы»); в слав. оставлено «саламин», в ru опущено. πλὴν τοῦ θυσιαστηρίου κυρίου — «кроме жертвенника Господня»."
  30: "ἀκούσας … τοὺς λόγους — «услышав слова» (причастие). ἤρεσεν αὐτοῖς — «понравилось им, они одобрили» (ἀρέσκω)."
  31: "Σήμερον ἐγνώκαμεν — «сегодня мы узнали» (perfect с настоящим значением). ἐρρύσασθε … ἐκ χειρὸς κυρίου — «вы избавили… от руки Господней» (ῥύομαι)."
  32: "ἀπέστρεψεν … ἐκ γῆς Γαλααδ εἰς γῆν Χανααν — «возвратился… из земли Галаад в землю Ханаан». ἀπεκρίθησαν αὐτοῖς τοὺς λόγους — «ответили им слова (сие)»."
  33: "ἤρεσεν τοῖς υἱοῖς Ισραηλ — «было угодно сынам Израилевым». ἐλάλησαν πρὸς τοὺς υἱοὺς Ισραηλ — «говорили сынам Израилевым» (в гр-тексте повтор, возможно, склейка). εὐλόγησαν τὸν θεόν — благословили Бога. ἐξολεθρεῦσαι — истребить (ἐξολεθρεύω). κατῴκησαν ἐπ᾽ αὐτῆς — «поселились на ней»."
  34: "ἐπωνόμασεν Ἰησοῦς τὸν βωμόν — «Иисус нарёк жертвенник» (имя в гр-тексте не названо; в евр. «Ед»). Μαρτύριόν ἐστιν ἀνὰ μέσον αὐτῶν — «свидетельство между ними». ὅτι κύριος ὁ θεὸς αὐτῶν ἐστιν — «что Господь Бог их есть»."
