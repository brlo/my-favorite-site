verses:
  1: "ソロモンが主[しゅ]の神殿[しんでん]と王[おう]の家[いえ]を建[た]て、ソロモンが望[のぞ]んだすべての仕事[しごと]を終[お]えたとき、"
  2: "主[しゅ]はソロモンに二度目[にどめ]に現[あらわ]れ、ギベオンで現[あらわ]れたときと同[おな]じようにされた。"
  3: "主[しゅ]は彼[かれ]に言[い]われた。「わたしはあなたの祈[いの]りの声[こえ]と、あなたがわたしの前[まえ]で願[ねが]ったその願[ねが]いを聞[き]いた。わたしはあなたの祈[いの]りにすべて従[したが]って事[こと]を行[おこな]い、あなたが建[た]てたこの神殿[しんでん]を聖別[せいべつ]して、わたしの名[な]をそこに永遠[えいえん]に置[お]いた。わたしの目[め]と心[こころ]はすべての日[ひ]々[び]そこにある。"
  4: "あなたが、父[ちち]ダビデが歩[あゆ]んだように、心[こころ]の聖[せい]さと真[ま]っ直[す]ぐさをもってわたしの前[まえ]を歩[あゆ]み、わたしが彼[かれ]に命[めい]じたすべてを行[おこな]い、わたしの定[さだ]めと戒[いまし]めを守[まも]るなら、"
  5: "わたしはあなたの王国[おうこく]の王座[おうざ]を、父[ちち]ダビデに語[かた]ったように、イスラエルの上[うえ]に永遠[えいえん]に立[た]てる。わたしは言[い]った。『あなたには、イスラエルを治[おさ]める者[もの]が断[た]たれることはない』と。"
  6: "しかし、あなたがたとあなたがたの子[こ]たちがわたしから離[はな]れて背[そむ]き、モーセがあなたがたの前[まえ]に与[あた]えたわたしの戒[いまし]めと定[さだ]めを守[まも]らず、行[い]ってほかの神[かみ]々[がみ]に仕[つか]え、それらを拝[おが]むなら、"
  7: "わたしはイスラエルを、わたしが彼[かれ]らに与[あた]えた地[ち]から断[た]ち切[き]り、わたしの名[な]のために聖別[せいべつ]したこの神殿[しんでん]をわたしの前[まえ]から投[な]げ捨[す]てる。イスラエルはすべての民[たみ]の間[あいだ]で、ののしりと物笑[ものわら]いの種[たね]となる。"
  8: "この高[たか]い神殿[しんでん]については、そこを通[とお]る者[もの]はだれでも驚[おどろ]き、口笛[くちぶえ]を吹[ふ]いて言[い]うだろう。『なぜ主[しゅ]はこの地[ち]とこの神殿[しんでん]にこのようなことをされたのか』と。"
  9: "人[ひと]々[びと]は答[こた]えるだろう。『彼[かれ]らが自分[じぶん]たちの神[かみ]、主[しゅ]を捨[す]てたからだ。主[しゅ]は彼[かれ]らの父祖[ふそ]たちをエジプトの地[ち]から、奴隷[どれい]の家[いえ]から導[みちび]き出[だ]したのに、彼[かれ]らはほかの神[かみ]々[がみ]に取[と]りすがり、それらを拝[おが]み、それらに仕[つか]えた。だから主[しゅ]はこの災[わざわ]いを彼[かれ]らの上[うえ]に下[くだ]したのだ』と。」"
  10: "ソロモンが二[ふた]つの家[いえ]、すなわち主[しゅ]の神殿[しんでん]と王[おう]の家[いえ]を建[た]てた二十[にじゅう]年[ねん]が過[す]ぎて、"
  11: "ツロの王[おう]ヒラムは、杉[すぎ]の木[き]と松[まつ]の木[き]と金[きん]、およびソロモンのすべての望[のぞ]みを満[み]たすものを送[おく]っていた。そこでソロモン王[おう]はヒラムにガリラヤの地[ち]の二十[にじゅう]の町[まち]を与[あた]えた。"
  12: "ヒラムはツロから出[で]て、ソロモンが彼[かれ]に与[あた]えた町[まち]々[まち]を見[み]にガリラヤへ行[い]ったが、それらは彼[かれ]の気[き]に入[い]らなかった。"
  13: "彼[かれ]は言[い]った。「兄弟[きょうだい]よ、わたしに与[あた]えたこの町[まち]々[まち]は何[なん]なのか。」そして彼[かれ]らを今日[きょう]に至[いた]るまで「境界[きょうかい]」と呼[よ]んだ。"
  14: "ヒラムはソロモンに金[きん]百二十[ひゃくにじゅう]タラントを送[おく]った。"
  15: "ソロモン王[おう]が課[か]した賦役[ふえき]の記録[きろく]は次[つぎ]のとおりである。主[しゅ]の神殿[しんでん]と自分[じぶん]の家[いえ]、ミロ、エルサレムの城壁[じょうへき]、ダビデの町[まち]の城壁[じょうへき]を囲[かこ]む城塞[じょうさい]、ハツォル、メギド、ゲゼルを建[た]てるためであった。"
  16: "ファラオ、エジプトの王[おう]は上[のぼ]って来[き]てゲゼルを取[と]り、これを火[ひ]で焼[や]き、町[まち]に住[す]んでいたカナン人[じん]を打[う]ち殺[ころ]し、その町[まち]を自分[じぶん]の娘[むすめ]、ソロモンの妻[つま]への贈[おく]り物[もの]として与[あた]えた。"
  17: "ソロモンはゲゼルと下[しも]のベト・ホロンを建[た]てた。"
  18: "また、バアラトと荒野[こうや]のタデモルを建[た]てた。"
  19: "また、ソロモンに属[ぞく]したすべての堅固[けんご]な町[まち]、戦車[せんしゃ]の町[まち]、騎兵[きへい]の町[まち]、およびソロモンがエルサレムとレバノンとその王国[おうこく]の全[ぜん]地[ち]に建[た]てることを望[のぞ]んだすべてのものを建[た]てた。"
  20: "アモリ人[じん]、ヘト人[びと]、ペリジ人[じん]、カナン人[じん]、ヒビ人[じん]、エブス人[じん]、ギルガシ人[じん]のうち、イスラエルの子[こ]らに属[ぞく]さない残[のこ]りの民[たみ]はすべて、"
  21: "すなわち、彼[かれ]らより後[あと]にこの地[ち]に残[のこ]り、イスラエルの子[こ]らが聖絶[せいぜつ]しきれなかった彼[かれ]らの子[こ]たちを、ソロモンは今日[きょう]に至[いた]るまで賦役[ふえき]につかせて貢[みつ]ぎを納[おさ]めさせた。"
  22: "しかしソロモンは、イスラエルの子[こ]らのうち誰[だれ]も奴隷[どれい]の仕事[しごと]には就[つ]かせなかった。彼[かれ]らは勇士[ゆうし]であり、彼[かれ]のしもべ、彼[かれ]の長[おさ]たち、彼[かれ]の戦車[せんしゃ]の長[おさ]たち、彼[かれ]の騎兵[きへい]たちであったからである。"
  23: "王[おう]の仕事[しごと]のために置[お]かれたソロモンの監督[かんとく]たちは、五百五十人[ごひゃくごじゅうにん]で、民[たみ]の仕事[しごと]をする者[もの]たちを指揮[しき]していた。"
  24: "ファラオの娘[むすめ]はダビデの町[まち]から、ソロモンが彼女[かのじょ]のために建[た]てた自分[じぶん]の家[いえ]へ移[うつ]った。そのときソロモンはミロを建[た]てた。"
  25: "ソロモンは年[とし]に三度[さんど]、自分[じぶん]が主[しゅ]のために建[た]てた祭壇[さいだん]の上[うえ]で燔祭[はんさい]と酬恩祭[しゅうおんさい]をささげ、主[しゅ]の前[まえ]で香[こう]をたいた。こうして彼[かれ]は神殿[しんでん]を完成[かんせい]させた。"
  26: "ソロモン王[おう]は、エドムの地[ち]の紅海[こうかい]の岸[きし]、エラトに接[せっ]するガシオン・ガベルで船[ふね]を造[つく]った。"
  27: "ヒラムは自分[じぶん]のしもべたちの中[なか]から、海[うみ]を知[し]る船乗[ふなの]りたちをその船[ふね]に乗[の]せ、ソロモンのしもべたちとともに遣[つか]わした。"
  28: "彼[かれ]らはオフィルへ行[い]き、そこから金[きん]四百二十[よんひゃくにじゅう]タラントを取[と]って、ソロモン王[おう]のもとへ持[も]って来[き]た。"

notes:
  1: "συνετέλεσεν οἰκοδομεῖν — окончил строить; πᾶσαν τὴν πραγματείαν — всё дело, предприятие; ὅσα ἠθέλησεν ποιῆσαι — что пожелал сделать. Слав. 9:1."
  2: "ὤφθη δεύτερον — явился во второй раз; ἐν Γαβαων — в Гаваоне (ギベオン). Слав. 9:2."
  3: "ἤκουσα τῆς φωνῆς — услышал голос; πεποίηκά σοι κατὰ πᾶσαν τὴν προσευχήν — сделал тебе по всей молитве; ἡγίακα — освятил (перфект); τοῦ θέσθαι τὸ ὄνομά μου ἐκεῖ εἰς τὸν αἰῶνα — положить имя Моё там вовек. Слав. 9:3."
  4: "ἐν ὁσιότητι καρδίας καὶ ἐν εὐθύτητι — в преподобии сердца и в правоте; ἃ ἐνετειλάμην αὐτῷ — что Я заповедал ему; φυλάξῃς — сохранишь. Слав. 9:4."
  5: "ἀναστήσω τὸν θρόνον — воздвигну престол; Οὐκ ἐξαρθήσεταί σοι ἀνήρ — не отнимется у тебя муж; ἡγούμενος ἐν Ισραηλ — вождь в Израиле. Слав. 9:5."
  6: "ἀποστραφέντες ἀποστραφῆτε — отвратившись отвратитесь; ἃ ἔδωκεν Μωϋσῆς ἐνώπιον ὑμῶν — которые дал Моисей пред вами; δουλεύσητε ... προσκυνήσητε — послужите и поклонитесь. Слав. 9:6."
  7: "ἐξαρῶ — исторгну; ἀπορρίψω ἐκ προσώπου μου — отвергну от лица Моего; εἰς ἀφανισμὸν καὶ εἰς λάλημα — в погибель и в притчу (слав. «в погубление и во глаголание»); εἰς πάντας τοὺς λαούς — у всех народов. Слав. 9:7."
  8: "ὁ οἶκος ὁ ὑψηλός — дом высокий; ἐκστήσεται — придёт в ужас; συριεῖ — свистнет (συρίζω); Ἕνεκα τίνος — из-за чего, за что. Слав. 9:8."
  9: "ἐγκατέλιπον — оставили; ἐξ οἴκου δουλείας — из дома рабства; ἀντελάβοντο — приняли, ухватились; ἐπήγαγεν ... τὴν κακίαν — навёл бедствие. В gr после стиха стоит «9a» (Τότε ἀνήγαγεν Σαλωμων τὴν θυγατέρα Φαραω ἐκ πόλεως Δαυιδ εἰς οἶκον αὐτοῦ...) — тот же текст, что в слав. 9:24; в основной текст не внесён."
  10: "Εἴκοσι ἔτη — двадцать лет; ἐν οἷς — в которые; τοὺς δύο οἴκους — два дома. Слав. 9:10 «И бысть по двадесяти летех»."
  11: "ἀντελάβετο τοῦ Σαλωμων — поддерживал Соломона; ξύλοις κεδρίνοις καὶ πευκίνοις — кедровыми и сосновыми деревами (πεύκινος — сосна); ἐν παντὶ θελήματι αὐτοῦ — во всяком желании его; εἴκοσι πόλεις ἐν τῇ γῇ τῇ Γαλιλαίᾳ — двадцать городов в земле Галилейской. Слав. 9:11."
  12: "ἐξῆλθεν ... εἰς τὴν Γαλιλαίαν — вышел в Галилею; οὐκ ἤρεσαν αὐτῷ — не понравились ему (ἀρέσκω). Слав. 9:12."
  13: "Τί αἱ πόλεις αὗται, ἃς ἔδωκάς μοι, ἀδελφέ; — вопрос; ἐκάλεσεν αὐτὰς Ὅριον — назвал их «пределом» (ὅριον); слав. 9:13 «И нарече я предел (хавуль)». В тексте 境界 по LXX/слав., пояснение «Кавул» — в notes."
  14: "ἑκατὸν καὶ εἴκοσι τάλαντα χρυσίου — 120 талантов золота. Слав. 9:14."
  15: "В gr-lxx-byz на месте стиха «.»; по csl 9:15 «Сие же есть число даяния...». «даяние» — подать, дань (賦役); «мелон» — Милло (ミロ); «краеградие» — крепость, цитадель (城塞); Ασορ, Μαγεδδω, Γαζερ — Хацор, Мегиддо, Гезер (ハツォル, メギド, ゲゼル)."
  16: "В gr «.»; по csl 9:16 «Фараон царь египетский взыде и взя газер и сожже и огнем, и ханаана живущаго во граде том погуби: и даде его в дар дщери своей, жене соломони»."
  17: "В gr «.»; по csl 9:17 «И согради соломон газер и вефорон нижний»."
  18: "В gr «.»; по csl 9:18 «и валааф и фамор в пустыни». Βααλαθ — Ваалаф (バアラト); Фамор — Фадмор (タデモル, ср. 2 Пар 8:4)."
  19: "В gr «.»; по csl 9:19 «И вся грады крепкия... и вся грады, идеже бяху колесницы... и все еже бысть угодно царю соломону, созда во Иерусалиме, и в ливане и во всей земли царства своего». «Грады крепкия» — укреплённые города (堅固な町)."
  20: "В gr «.»; по csl 9:20 «Всех людий оставшихся от аморреа и хеттеа, и ферезеа и хананеа, и евеа и иевусеа и гергесеа, не сущих от сынов израилевых»."
  21: "В gr «.»; по csl 9:21 «сынов их оставшихся по них на земли, ихже не возмогоша сынове израилевы потребити их, царь соломон поработи их даяти дань даже до дне сего»."
  22: "В gr «.»; по csl 9:22 «от сынов же израилевых не даде в работу соломон, яко тии бяху мужие храбрии, и отроцы его, и князи его, и тристаты его, и воеводы колесниц его, и конницы его». τριστάται — «тристаты», воины, стоящие третьими в колеснице; передано в ряду 戦車の長たち."
  23: "В gr «.»; по csl 9:23 «И бяху старейшины приставленным над делы царя соломона, пять сот пятьдесят повелевающии людем делающым дело»."
  24: "В gr «.»; по csl 9:24 «Дщерь же фараона прейде из града давидова в дом свой, егоже созда ей соломон, тогда созда мелон». Ср. «9a» при 9:9 — тот же текст."
  25: "В gr «.»; по csl 9:25 «И приношаше соломон трижды в год всесожжения и мирныя жертвы на олтарь, егоже созижде Господу, и кадяше фимиам пред Господем: и соверши храм»."
  26: "ναῦν — корабль; ἐν Γασιωνγαβερ — в Гасион-Гавере (ガシオン・ガベル; ср. Втор 2:8, 3 Цар 16:33; обычное エツヨン・ゲベル, ср. 3 Цар 22:49); ἐχομένην Αιλαθ — прилежащий к Елафу (エラト); ἐπὶ τοῦ χείλους τῆς ἐσχάτης θαλάσσης — на берегу последнего моря, то есть Красного (紅海); ἐν γῇ Εδωμ — в земле Едом. Слав. 9:26."
  27: "ἐν τῇ νηὶ τῶν παίδων αὐτοῦ — на корабле своих слуг; ἄνδρας ναυτικοὺς ἐλαύνειν εἰδότας θάλασσαν — моряков, умеющих управлять кораблём (ἐλαύνω — гнать, вести); μετὰ τῶν παίδων Σαλωμων — с людьми Соломона. Слав. 9:27."
  28: "εἰς Σωφηρα — в Софиру (LXX; слав. 9:28 «в софир»); χρυσίου ἑκατὸν καὶ εἴκοσι τάλαντα — 120 талантов (LXX); слав. 9:28 «четыре ста и двадесять талант» (420, по МТ/ru) — в тексте 420 по csl, вариант LXX 120 в notes. Имя места — オフィル, как в 3 Цар 10:11."
