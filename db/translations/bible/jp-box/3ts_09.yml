# jp-box, 3-я Царств, глава 9. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); второй свидетель церковного текста —
# церковнославянский (csl-ru), по паритету (docs/japanese-bible.md); ru
# (Синодальный) — только для понимания, не источник. jp-joc в книге нет;
# jp-ni (под авторским правом) не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 9: второе явление Господа Соломону (1–9), дела с Хирамом (10–14),
# подать и постройки (15–25), флот в Офир (26–28).
# Нумерация по gr: 28 стихов. В gr-lxx-byz стихи 9:15–25 стоят как «.»
# (текст в модуле утрачен); они переведены по csl 9:15–25 и входят в основной
# текст без скобок. В gr 9:9 после стиха стоит «9a» (Τότε ἀνήγαγεν Σαλωμων
# τὴν θυγατέρα Φαραω...) — тот же текст, что в слав. 9:24; в основной текст
# не внесён, чтобы не дублировать 9:24.
# Речи: Господь — 「…」 (3–9); внутри — слова Господа к Давиду 『…』 (5)
# и слова народов 『…』 (8, 9). Красного нет.
# 〔…〕 нет. Число в 9:28 (420 талантов) дано по csl, вариант LXX (120) — в notes.
# Сносок ⟨…⟩ нет: 神殿, 契約の箱, 燔祭, 酬恩祭, 祭司, 至聖所 уже в корпусе.

