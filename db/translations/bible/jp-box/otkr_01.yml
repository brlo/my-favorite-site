verses:
  1: "イエス・キリストの黙示[もくし]⟨神[かみ]によって明[あき]らかに示[しめ]された知識[ちしき]。⟩である。神[かみ]が、すぐに起[お]こるべき事[こと]がらをその僕[しもべ]たちに示[しめ]すために、イエス・キリストにお与[あた]えになったものである。キリストは、ご自身[じしん]の天使[てんし]を遣[つか]わして、その僕[しもべ]ヨハネに示[しめ]された。"
  2: "ヨハネは、神[かみ]の言葉[ことば]とイエス・キリストの証[あかし]と、自分[じぶん]が見[み]たすべての事[こと]について証[あか]しした。"
  3: "この預言[よげん]の言葉[ことば]を読[よ]む者[もの]、またそれを聞[き]いて、そこに書[か]かれていることを守[まも]る者[もの]たちは、幸[さいわ]いである。時[とき]が近[ちか]いからである。"
  4: "ヨハネから、アジアにある七[なな]つの教会[きょうかい]へ。今[いま]おられ、昔[むかし]おられ、やがて来[こ]られる方[かた]から、また、その御座[みくら]の前[まえ]にある七[なな]つの霊[れい]から、{恵[めぐ]み|恩寵[おんちょう]}と平和[へいわ]があなたがたにありますように。"
  5: "また、忠実[ちゅうじつ]な証人[しょうにん]、死者[ししゃ]の中[なか]からの長子[ちょうし]、地上[ちじょう]の王[おう]たちの支配者[しはいしゃ]であるイエス・キリストから。わたしたちを愛[あい]してくださり、その血[ち]によってわたしたちを罪[つみ]から洗[あら]ってくださった方[かた]に、"
  6: "わたしたちを王[おう]たちとし、その父[ちち]である神[かみ]のために祭司[さいし]としてくださった方[かた]に、栄光[えいごう]と力[ちから]が、世々[よよ]限[かぎ]りなくありますように。アーメン。"
  7: "「見[み]よ、彼[かれ]は雲[くも]とともに来[こ]られる。すべての目[め]が彼を見[み]る。彼を刺[さ]した者[もの]たちも見る。地[ち]のすべての族[ぞく]は彼のゆえに泣[な]く。」然[しか]り、アーメン。"
  8: "「わたしはアルファであり、オメガである。〔初[はじ]めであり、終[おわ]りである。〕」と、今[いま]おられ、昔[むかし]おられ、やがて来[こ]られる全能者[ぜんのうしゃ]である主[しゅ]なる神[かみ]は言[い]われる。"
  9: "わたし、ヨハネは、あなたがたの兄弟[きょうだい]であり、イエスにあって患難[かんなん]と王国[おうこく]と忍耐[にんたい]とを共[とも]にする者[もの]である。わたしは、神[かみ]の言葉[ことば]とイエスの証[あかし]のために、パトモスという名[な]の島[しま]にいた。"
  10: "わたしは主[しゅ]の日[ひ]に霊[れい]のうちにあった。すると、わたしの後[うしろ]に、ラッパのような大[おお]きな声[こえ]を聞[き]いた。"
  11: "その声[こえ]は言[い]った。「<j>〔わたしはアルファであり、オメガである。最初[さいしょ]の者[もの]であり、最後[さいご]の者[もの]である。〕あなたが見[み]ることを書物[しょもつ]に書[か]き記[しる]して、アジアにある七[なな]つの教会[きょうかい]、すなわち、エフェソ、スミルナ、ペルガモン、ティアティラ、サルデス、フィラデルフィア、ラオディキアに送[おく]りなさい。</j>」"
  12: "わたしは、わたしに語[かた]る声[こえ]を見[み]ようとして振[ふ]り向[む]いた。そして、振り向くと、七[なな]つの金[きん]の燭台[しょくだい]が見[み]えた。"
  13: "また、その燭台[しょくだい]の間[あいだ]に、人[ひと]の子[こ]のような方[かた]がおられた。長[なが]い衣[ころも]を着[き]、胸[むね]に金[きん]の帯[おび]を締[し]めておられた。"
  14: "その頭[あたま]と髪[かみ]は、白[しろ]い羊毛[ようもう]のように、雪[ゆき]のように白[しろ]く、目[め]は火[ひ]の炎[ほのお]のようであった。"
  15: "足[あし]は、炉[ろ]で焼[や]かれた真鍮[しんちゅう]のようであり、声[こえ]は多[おお]くの水[みず]の響[ひび]きのようであった。"
  16: "右手[みぎて]には七[なな]つの星[ほし]を持[も]ち、口[くち]からは両刃[もりは]の鋭[するど]い剣[つるぎ]が出[で]ていた。顔[かお]は、その力[ちから]のうちに輝[かがや]く太陽[たいよう]のようであった。"
  17: "わたしは彼を見[み]たとき、その足[あし]もとに死[し]んだ者のように倒[たお]れた。すると、彼は右手[みぎて]をわたしの上[うえ]に置[お]いて言[い]われた。「<j>恐[おそ]れるな。わたしは最初[さいしょ]の者[もの]であり、最後[さいご]の者[もの]である。</j>」"
  18: "「<j>そして、生[い]きている者[もの]である。わたしは死[し]んだが、見[み]よ、世々[よよ]限[かぎ]りなく生[い]きている。〔アーメン。〕そして、死[し]と陰府[よみ]の鍵[かぎ]を持[も]っている。</j>」"
  19: "「<j>だから、あなたが見[み]たこと、今[いま]あること、またこの後[あと]に起[お]こることを書[か]きなさい。</j>」"
  20: "「<j>あなたがわたしの右手[みぎて]に見[み]た七[なな]つの星[ほし]の奥義[おうぎ]と、七[なな]つの金[きん]の燭台[しょくだい]の奥義[おうぎ]は、こうである。七[なな]つの星[ほし]は七[なな]つの教会[きょうかい]の天使[てんし]であり、七[なな]つの燭台[しょくだい]は七[なな]つの教会[きょうかい]である。</j>」"

notes:
  1: "Ἀποκάλυψις Ἰησοῦ Χριστοῦ — イエス・キリストの黙示 (родительный принадлежности: откровение, данное Иисусом Христом). ἣν ἔδωκεν αὐτῷ ὁ θεός — 神が…お与えになった. δεῖξαι τοῖς δούλοις αὐτοῦ — その僕たちに示す. ἃ δεῖ γενέσθαι ἐν τάχει — すぐに起こるべき事がら. ἐσήμανεν — 示された (σημαίνω — давать знак). διὰ τοῦ ἀγγέλου αὐτοῦ — ご自身の天使を遣わして."
  2: "ὃς ἐμαρτύρησεν — 証しした. τὸν λόγον τοῦ θεοῦ — 神の言葉. τὴν μαρτυρίαν Ἰησοῦ Χριστοῦ — イエス・キリストの証 (μαρτυρία — свидетельство; ср. 1:9; 6:9). ὅσα εἶδεν — 自分が見たすべてのこと."
  3: "μακάριος ὁ ἀναγινώσκων — 読む者は幸い. τοὺς λόγους τῆς προφητείας — この預言の言葉. τηροῦντες — 守る者たち. ὁ καιρὸς ἐγγύς — 時が近い."
  4: "ταῖς ἑπτὰ ἐκκλησίαις ταῖς ἐν τῇ Ἀσίᾳ — アジアにある七つの教会. ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος — 今おられ、昔おられ、やがて来られる方 (формула имени Божия, ср. Исх 3:14). τῶν ἑπτὰ πνευμάτων — 七つの霊; πνεῦμα здесь без ἅγιον, поэтому 霊[れい], без пары {聖霊|聖神}. ἃ ἐνώπιον τοῦ θρόνου — 御座の前にある. В базе критический текст без ἐστιν — на перевод не влияет."
  5: "ὁ μάρτυς ὁ πιστός — 忠実な証人. ὁ πρωτότοκος τῶν νεκρῶν — 死者の中からの長子. ὁ ἄρχων τῶν βασιλέων τῆς γῆς — 地上の王たちの支配者. λύσαντι (база) / λούσαντι (церковный текст: Елизаветинская «омывшаго», jp-joc 「洗ひ」) — 洗って; это замена, а не добавление, поэтому без 〔…〕 (ср. 1 Кор 2:1). Проверено: λούσαντι в базе — НЕТ, λύσαντι — ЕСТЬ."
  6: "βασιλείαν, ἱερεῖς (база) / βασιλεῖς καὶ ἱερεῖς (церковный текст: «цари и иереи», jp-joc 「王と為し…祭司と為し」) — 王たちとし、祭司として; замена, поэтому без 〔…〕. εἰς τοὺς αἰῶνας τῶν αἰώνων — 世々限りなく; [τῶν αἰώνων] в базе в квадратных скобках — слово есть, 〔…〕 не ставятся."
  7: "Ἰδοὺ ἔρχεται μετὰ τῶν νεφελῶν — 見よ、彼は雲とともに来られる (Дан 7:13; Зах 12:10). ὄψεται αὐτὸν πᾶς ὀφθαλμός — すべての目が彼を見る. ἐξεκέντησαν — 刺した. κόψονται ἐπ᾽ αὐτὸν πᾶσαι αἱ φυλαὶ τῆς γῆς — 地のすべての族は彼のゆえに泣く. Цитата Писания — 「…」; ναί, ἀμήν — 然り、アーメン, вне цитаты."
  8: "Ἐγώ εἰμι τὸ Ἄλφα καὶ τὸ Ὦ — わたしはアルファであり、オメガである. λέγει κύριος ὁ θεός — 主なる神は言われる; это НЕ слова Христа в данном стихе (говорит Господь Бог, отождествление с Христом не выражено явно), поэтому <j> не ставится. ἀρχὴ καὶ τέλος — 初めであり、終わりである: в базе НЕТ (проверено: αρχη — НЕТ), церковный текст (Синодальный, jp-joc 「始及び終」) добавляет — 〔…〕. ὁ παντοκράτωρ — 全能者."
  9: "ἐγὼ Ἰωάννης — わたし、ヨハネは. ὁ ἀδελφὸς ὑμῶν καὶ συγκοινωνός — あなたがたの兄弟であり、共にする者. ἐν τῇ θλίψει καὶ βασιλείᾳ καὶ ὑπομονῇ — 患難と王国と忍耐. ἐν Ἰησοῦ — イエスにあって. διὰ τὸν λόγον τοῦ θεοῦ καὶ τὴν μαρτυρίαν Ἰησοῦ — 神の言葉とイエスの証のために. Πάτμος — パトモス."
  10: "ἐγενόμην ἐν πνεύματι — 霊のうちにあった (πνεῦμα без ἅγιον — 霊[れい]). ἐν τῇ κυριακῇ ἡμέρᾳ — 主の日に. ὀπίσω μου — わたしの後に. φωνὴν μεγάλην ὡς σάλπιγγος — ラッパのような大きな声."
  11: "λεγούσης — その声は言った. Ὃ βλέπεις — あなたが見ることを. γράψον εἰς βιβλίον — 書物に書き記して. πέμψον ταῖς ἑπτὰ ἐκκλησίαις — 七つの教会に送りなさい. Ἐγώ εἰμι τὸ Ἄλφα καὶ τὸ Ὦ, ὁ πρῶτος καὶ ὁ ἔσχατος — わたしはアルファであり、オメガである。最初の者であり、最後の者である: в базе этих слов НЕТ (проверено: αλφα — НЕТ), церковный текст (Синодальный; jp-joc ставит их в конце 1:10) читает их — 〔…〕; это голос Христа, поэтому красное. Имена церквей: エフェソ、スミルナ、ペルガモン、ティアティラ、サルデス、フィラデルフィア、ラオディキア."
  12: "ἐπέστρεψα βλέπειν τὴν φωνήν — 声を見ようとして振り向いた (смешение слуха и зрения сохранено). ἑπτὰ λυχνίας χρυσᾶς — 七つの金の燭台."
  13: "ὅμοιον υἱὸν ἀνθρώπου — 人の子のような方 (Дан 7:13; здесь не цитата, поэтому без 「」). ἐνδεδυμένον ποδήρη — 長い衣を着て. περιεζωσμένον πρὸς τοῖς μαστοῖς ζώνην χρυσᾶν — 胸に金の帯を締めて."
  14: "ἔριον λευκόν — 白い羊毛. ὡς χιών — 雪のように. φλὸξ πυρός — 火の炎."
  15: "χαλκολιβάνῳ — 真鍮 (неизвестный сплав, «блестящая медь»; у jp-joc 精銅). ὡς ἐν καμίνῳ πεπυρωμένης — 炉で焼かれた. φωνὴ ὑδάτων πολλῶν — 多くの水の響き."
  16: "ἀστέρας ἑπτά — 七つの星. ῥομφαία δίστομος ὀξεῖα — 両刃の鋭い剣. ἡ ὄψις αὐτοῦ ὡς ὁ ἥλιος φαίνει ἐν τῇ δυνάμει αὐτοῦ — 顔は、その力のうちに輝く太陽のよう."
  17: "ἔπεσα πρὸς τοὺς πόδας αὐτοῦ ὡς νεκρός — その足もとに死んだ者のように倒れた. ἐγώ εἰμι ὁ πρῶτος καὶ ὁ ἔσχατος — わたしは最初の者であり、最後の者である (Ис 44:6; 48:12): внутри речи Христа — 『…』. Μὴ φοβοῦ — 恐れるな."
  18: "καὶ ὁ ζῶν — そして、生きている者である. ἐγενόμην νεκρός — わたしは死んだが. εἰς τοὺς αἰῶνας τῶν αἰώνων — 世々限りなく. ἀμήν — 〔アーメン〕: в базе НЕТ (проверено), церковный текст (Синодальный, jp-joc 「アミン」) добавляет. κλεῖς τοῦ θανάτου καὶ τοῦ ᾅδου — 死と陰府の鍵."
  19: "γράψον οὖν — だから…書きなさい. ἃ εἶδες — あなたが見たこと. ἃ εἰσίν — 今あること. ἃ μέλλει γενέσθαι μετὰ ταῦτα — この後に起こること."
  20: "τὸ μυστήριον — 奥義 (ср. 1 Кор 2:7; Еф 1:9). ἐπὶ τῆς δεξιᾶς μου — わたしの右手に. οἱ ἑπτὰ ἀστέρες ἄγγελοι τῶν ἑπτὰ ἐκκλησιῶν — 七つの星は七つの教会の天使. αἱ λυχνίαι αἱ ἑπτὰ ἑπτὰ ἐκκλησίαι — 七つの燭台は七つの教会."
