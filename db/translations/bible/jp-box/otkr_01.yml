# jp-box, Откровение Иоанна, глава 1. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 1: надписание (1–3), приветствие семи церквам (4–6), грядущий Христос (7),
# слово Господа Бога (8), видение на Патмосе и явление Христа (9–16),
# «не бойся» и объяснение тайны семи звёзд (17–20).
# Красное <j> — только прямая речь Христа: 1:11 (голос за спиной) и 1:17–20.
# 1:8 — НЕ красное: «Я есмь Альфа и Омега» здесь говорит Господь Бог, и в этом стихе
# он явно не отождествлён с Христом; <j> не ставится (отмечено в notes).
# 〔…〕: 1:8 — церковное ἀρχή и τέλος; 1:11 — церковное «Я есмь Альфа и Омега,
# Первый и Последний»; 1:18 — церковное ἀμήν. Всё проверено запросом к gr-lxx-byz.
# 1:5 (λύσαντι/λούσαντι) и 1:6 (βασιλείαν/βασιλεῖς) — замена чтения, а не добавление,
# поэтому без 〔…〕, только в notes (ср. 1 Кор 2:1).
# Сноска ⟨…⟩ одна — 1:1 黙示, первое место в корпусе. jp-ni не использовался.

