verses:
  1: "それから十四年[じゅうよねん]の後[のち]、わたしはバルナバとともに、テトスも連[つ]れて、再[ふたた]びエルサレムへ上[のぼ]った。"
  2: "啓示[けいじ]によって上[のぼ]ったのである。そして、わたしが異邦人[いほうじん]の間[あいだ]で宣[の]べ伝[つた]えている福音[ふくいん]を彼[かれ]らに告[つ]げ、おもだった人[ひと]々[びと]には別[べつ]に告[つ]げた。それは、わたしが走[はし]ってきたこと、また走[はし]ろうとしていることが、むだにならないためである。"
  3: "しかし、わたしとともにあるテトスでさえ、ギリシア人[じん]であったのに、割礼[かつれい]を受[う]けさせられなかった。"
  4: "しかし、こっそり忍[しの]び込[こ]んだ偽[にせ]兄弟[きょうだい]たちのゆえに——彼[かれ]らは、わたしたちがキリスト・イエスにあって持[も]っている自由[じゆう]を窺[うかが]い、わたしたちを奴隷[どれい]にしようとして、入[はい]り込[こ]んできた者[もの]たちである——"
  5: "わたしたちは、福音[ふくいん]の真理[しんり]があなたがたの間[あいだ]にとどまるために、彼[かれ]らに一[いっ]時[じ]たりとも、服[ふく]して従[したが]おうとはしなかった。"
  6: "おもだった人[ひと]々[びと]については——かつて彼[かれ]らがどんな者[もの]であったとしても、わたしには何[なん]の違[ちが]いもない。神[かみ]は人[ひと]の顔[かお]によって人[ひと]を取[と]り扱[あつか]われない——実[じつ]に、おもだった人[ひと]々[びと]はわたしに何[なに]も加[くわ]えなかった。"
  7: "むしろ、ペトロが割礼[かつれい]を受[う]けた者[もの]たちへの福音[ふくいん]を委[ゆだ]ねられているように、わたしが割礼[かつれい]を受[う]けない者[もの]たちへの福音[ふくいん]を委[ゆだ]ねられているのを見[み]て、"
  8: "——というのは、ペトロのうちに働[はたら]いて割礼[かつれい]を受[う]けた者[もの]たちへの使徒[しと]職[しょく]を果[は]たさせた方[かた]は、わたしのうちにも働[はたら]いて異邦人[いほうじん]への使徒[しと]職[しょく]を果[は]たさせたからである——"
  9: "そして、わたしに与[あた]えられた恵[めぐ]みを知[し]った、柱[はしら]とも思[おも]われるヤコブ、ケファ、ヨハネは、わたしたちが異邦人[いほうじん]へ、彼[かれ]らが割礼[かつれい]を受[う]けた者[もの]たちへ行[い]くために、わたしとバルナバとに、交[まじ]わりのしるしとして右[みぎ]の手[て]を差[さ]し伸[の]べた。"
  10: "ただ、貧[まず]しい者[もの]たちを覚[おぼ]えていてほしいとだけ、彼[かれ]らは願[ねが]った。わたしも、まさにそのことを努[つと]めて行[おこな]ってきた。"
  11: "しかし、ケファがアンティオキアに来[き]たとき、わたしは彼[かれ]と面[めん]と向[む]かって対立[たいりつ]した。彼[かれ]には責[せ]められるべき点[てん]があったからである。"
  12: "というのは、ヤコブのもとからある人[ひと]々[びと]が来[く]る前[まえ]には、彼[かれ]は異邦人[いほうじん]とともに食事[しょくじ]をしていた。しかし、彼[かれ]らが来[き]ると、割礼[かつれい]を受[う]けた者[もの]たちを恐[おそ]れて、退[しりぞ]いて自分[じぶん]を遠[とお]ざけてしまったからである。"
  13: "そして、残[のこ]りのユダヤ人[じん]たちも彼[かれ]とともに偽[いつわ]りを行[おこな]い、バルナバさえも彼[かれ]らの偽[いつわ]りに引[ひ]き込[こ]まれた。"
  14: "しかし、彼[かれ]らが福音[ふくいん]の真理[しんり]に従[したが]ってまっすぐに歩[あゆ]んでいないのを見[み]て、わたしはみんなの前[まえ]でケファに言[い]った。「あなたはユダヤ人[じん]でありながら、異邦人[いほうじん]のように生活[せいかつ]し、ユダヤ人[じん]のように生活[せいかつ]していないのに、どうして異邦人[いほうじん]にユダヤ人[じん]のように生活[せいかつ]することを強[し]いるのか。」"
  15: "わたしたちは生[う]まれながらのユダヤ人[じん]であって、異邦人[いほうじん]の罪人[ざいにん]ではない。"
  16: "しかし、人[ひと]は律法[りっぽう]の行[おこな]いによってではなく、イエス・キリストへの信仰[しんこう]によって義[ぎ]とされることを知[し]って、わたしたちもキリスト・イエスを信[しん]じたのである。それは、律法[りっぽう]の行[おこな]いによってではなく、キリストへの信仰[しんこう]によって義[ぎ]とされるためである。なぜなら、律法[りっぽう]の行[おこな]いによっては、肉[にく]なる者[もの]はだれ一人[ひとり]義[ぎ]とされないからである。"
  17: "しかし、キリストにあって義[ぎ]とされようと求[もと]めているわたしたち自身[じしん]が罪人[ざいにん]であると見[み]出[だ]されたのなら、キリストは罪[つみ]の奉仕者[ほうししゃ]なのであろうか。決[けっ]してそうではない。"
  18: "なぜなら、もしわたしが壊[こわ]したものを再[ふたた]び建[た]てるなら、わたしは自分[じぶん]を違反者[いはんしゃ]としているからである。"
  19: "なぜなら、わたしは律法[りっぽう]によって律法[りっぽう]に対して死[し]んだからである。神[かみ]のために生[い]きるためである。わたしはキリストとともに十字架[じゅうじか]につけられた。"
  20: "もはやわたしが生[い]きているのではなく、キリストがわたしのうちに生[い]きているのである。わたしが今[いま]、肉[にく]にあって生[い]きているのは、わたしを愛[あい]し、わたしのためにご自分[じぶん]をお与[あた]えになった神[かみ]の子[こ]への信仰[しんこう]によって生[い]きているのである。"
  21: "わたしは神[かみ]の恵[めぐ]みを無[む]にしない。なぜなら、もし義[ぎ]が律法[りっぽう]によって得[え]られるのであれば、キリストはむだに死[し]んだことになるからである。"

notes:
  1: "διὰ δεκατεσσάρων ἐτῶν — «через четырнадцать лет». συμπαραλαβών — 連れて."
  2: "κατ᾽ ἀποκάλυψιν — 啓示によって. ἀνεθέμην — 告げた (букв. «положил перед»). τοῖς δοκοῦσιν — おもだった人々 (букв. «кажущимся [значительными]»). κατ᾽ ἰδίαν — 別に, наедине. εἰς κενὸν τρέχω ἢ ἔδραμον — むだに走る/走ってきた."
  3: "ἀλλ᾽ οὐδὲ Τίτος — しかし、テトスでさえ. Ἕλλην — ギリシア人 (то есть язычник). ἠναγκάσθη περιτμηθῆναι — 割礼を受けさせられなかった (пассив)."
  4: "παρείσακτοι ψευδάδελφοι — こっそり忍び込んだ偽兄弟. κατασκοπῆσαι — 窺い. ἐλευθερία — 自由. καταδουλώσουσιν — 奴隷にしようとして."
  5: "οὐδὲ πρὸς ὥραν εἴξαμεν — «ни на час не уступили»; 一時たりとも. τῇ ὑποταγῇ — 服して従うこと. διαμείνῃ — とどまる."
  6: "οἱ δοκοῦντες — おもだった人々. πρόσωπον θεὸς ἀνθρώπου οὐ λαμβάνει — «Бог не взирает на лицо человека»; 人の顔によって人を取り扱われない. В базе [ὁ] — слово есть, 〔〕 не ставятся. οὐδὲν προσανέθεντο — 何も加えなかった."
  7: "τοὐναντίον — むしろ、逆に. τὸ εὐαγγέλιον τῆς ἀκροβυστίας — 割礼を受けない者たちへの福音; ἀκροβυστία — «необрезание»."
  8: "ὁ ἐνεργήσας — 働いて…果たさせた方. εἰς ἀποστολὴν τῆς περιτομῆς — 割礼を受けた者たちへの使徒職."
  9: "στῦλοι — 柱. δεξιὰς ἔδωκαν κοινωνίας — «дали правые руки общения»; 交わりのしるしとして右手を差し伸べた. ἵνα ἡμεῖς εἰς τὰ ἔθνη — わたしたちが異邦人へ."
  10: "τῶν πτωχῶν μνημονεύωμεν — 貧しい者たちを覚えている. ἐσπούδασα — 努めて行ってきた."
  11: "κατὰ πρόσωπον αὐτῷ ἀντέστην — «противостал ему в лицо»; 面と向かって反対した. κατεγνωσμένος ἦν — «был осуждён»; 責められるべき点があった."
  12: "ὑπέστελλεν καὶ ἀφώριζεν ἑαυτόν — 退いて自分を遠ざけた. τοὺς ἐκ περιτομῆς — 割礼を受けた者たち."
  13: "συνυπεκρίθησαν — ともに偽りを行った. συναπήχθη τῇ ὑποκρίσει — 偽りに引き込まれた. В базе [καὶ] — слово есть, 〔〕 не ставятся."
  14: "ὀρθοποδοῦσιν — «ходят прямо»; まっすぐに歩む. ἐθνικῶς / Ἰουδαϊκῶς ζῇς — 異邦人のように/ユダヤ人のように生活する. Ἰουδαΐζειν — ユダヤ人式に生活する."
  15: "φύσει Ἰουδαῖοι — 生まれながらのユダヤ人. ἐξ ἐθνῶν ἁμαρτωλοί — 異邦人の罪人."
  16: "οὐ δικαιοῦται ἄνθρωπος ἐξ ἔργων νόμου ἐὰν μὴ διὰ πίστεως Ἰησοῦ Χριστοῦ — «человек не оправдывается делами закона, если не через веру в Иисуса Христа»; 律法の行いによってではなく、イエス・キリストへの信仰によって. В базе [δὲ] — слово есть. πᾶσα σάρξ — 肉なる者はだれも. ἐξ ἔργων νόμου οὐ δικαιωθήσεται — 律法の行いによっては義とされない."
  17: "ἆρα… μὴ γένοιτο — 決してそうではない. διάκονος ἁμαρτίας — 罪の奉仕者."
  18: "κατέλυσα — 壊した. οἰκοδομῶ — 建てる. παραβάτην — 違反者."
  19: "διὰ νόμου νόμῳ ἀπέθανον — «через закон умер для закона»; 律法によって律法に対して死んだ. συνεσταύρωμαι — ともに十字架につけられた (перфект)."
  20: "ζῶ δὲ οὐκέτι ἐγώ, ζῇ δὲ ἐν ἐμοὶ Χριστός — «уже не я живу, но живёт во мне Христос». ἐν πίστει ζῶ τῇ τοῦ υἱοῦ τοῦ θεοῦ — 神の子への信仰によって生きている."
  21: "ἀθετῶ — 無にする. ἄρα Χριστὸς δωρεὰν ἀπέθανεν — キリストはむだに死んだことになる."
