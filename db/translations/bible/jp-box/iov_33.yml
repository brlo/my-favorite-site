verses:
  1: "「しかし、ヨブよ、わたしの言葉[ことば]を聞[き]け。わたしの話[はなし]に耳[みみ]を傾[かたむ]けよ。"
  2: "見[み]よ、わたしは口[くち]を開[ひら]いた。わたしの舌[した]が語[かた]った。"
  3: "わたしの心[こころ]は言葉[ことば]において清[きよ]く、わたしの唇[くちびる]の分別[ふんべつ]は清く悟[さと]る。"
  4: "神[かみ]の霊[れい]がわたしを造[つく]り、全能者[ぜんのうしゃ]の息[いき]がわたしを教[おし]える。"
  5: "もしできれば、わたしに答[こた]えよ。耐[た]え忍[しの]んで、わたしと向[む]き合[あ]え。わたしもあなたと向[む]き合[あ]おう。"
  6: "見[み]よ、わたしも、あなたと同じく土[つち]から造[つく]られた。わたしたちは同[おな]じところから取[と]られたのだ。"
  7: "わたしの恐[おそ]れがあなたを脅[おびや]かすことはなく、わたしの手[て]があなたの上[うえ]に重[おも]くのしかかることもない。"
  8: "だが、あなたはわたしの耳[みみ]に語[かた]った。わたしはあなたの言葉[ことば]の声[こえ]を聞[き]いた。"
  9: "あなたはこう言[い]う。『わたしは清[きよ]く、罪[つみ]を犯[おか]していない。無垢[むく]で、不法[ふほう]を行[おこな]っていない。"
  10: "神[かみ]はわたしに対する咎[とが]めを探[さが]し出[だ]し、わたしを敵[てき]と見[み]なしている。"
  11: "わたしの足[あし]を木[き]の足枷[あしかせ]にかけ、わたしの道[みち]をすべて見張[みは]っている』。"
  12: "なぜ、あなたは『わたしは正[ただ]しい。神[かみ]はわたしの言[こと]を聞[き]かなかった』と言[い]うのか。人[ひと]の上[うえ]におられる方[かた]は永遠[えいえん]の方[かた]である。"
  13: "また、あなたは『なぜ、神[かみ]はわたしの訴[うった]えを、その一言[ひとこと]も聞[き]かれないのか』と言[い]う。"
  14: "まことに、神[かみ]は一度[いちど]語[かた]り、二度目[にどめ]には夢[ゆめ]をもって語[かた]る。"
  15: "すなわち、夜[よる]の思[おも]いのうちに、人[ひと]々[びと]の上[うえ]に恐[おそ]ろしい恐怖[きょうふ]が降[ふ]りかかり、寝床[ねどこ]のまどろみのうちに、"
  16: "そのとき、神[かみ]は人[ひと]の心[こころ]を開[ひら]き、このような恐怖[きょうふ]の幻[まぼろし]によって彼[かれ]らを恐[おそ]れさせ、"
  17: "人[ひと]を不正[ふせい]から遠[とお]ざけ、その体[からだ]を滅[ほろ]びから救[すく]い出[だ]すためである。"
  18: "神[かみ]は彼[かれ]の魂[たましい]を死[し]から惜[お]しみ、彼[かれ]が戦[いくさ]で倒[たお]れないようにされる。"
  19: "また、神[かみ]は寝床[ねどこ]の上[うえ]で病[やまい]をもって彼[かれ]を責[せ]め、その骨[ほね]の多[おお]くを鈍[にぶ]らせられる。"
  20: "小麦[こむぎ]のどんな食物[たべもの]も、彼[かれ]は受[う]け付[つ]けることができない。その魂[たましい]は食物[たべもの]を欲[ほっ]する。"
  21: "その肉[にく]が腐[くさ]り果[は]て、その骨[ほね]がむき出[だ]しになって空[うつろ]になるまで。"
  22: "その魂[たましい]は死[し]に近[ちか]づき、その命[いのち]はよみのうちにある。"
  23: "もし千[せん]の死[し]をもたらす天使[てんし]があっても、そのうちの一[ひと]りも彼[かれ]を傷[きず]つけない。もし彼[かれ]が心[こころ]で主[しゅ]に立[た]ち返[かえ]ることを思[おも]い、人[ひと]に自分[じぶん]の咎[とが]めを告[つ]げ、その愚[おろ]かさを明[あき]らかにするなら、"
  24: "神[かみ]は彼[かれ]を助[たす]け、死[し]に陥[おちい]らせまいとされ、彼[かれ]の体[からだ]を壁[かべ]の塗[ぬ]り直[なお]しのように新[あら]たにし、その骨[ほね]を髄[ずい]で満[み]たされる。"
  25: "彼[かれ]の肉[にく]は幼[おさな]い子[こ]のように柔[やわ]らかくなり、彼[かれ]は男[おとこ]として育[そだ]ち、人[ひと]々[びと]の間[あいだ]に立[た]つ。"
  26: "彼[かれ]が主[しゅ]に祈[いの]ると、主[しゅ]はこれを受[う]け入[い]れられる。彼[かれ]は清[きよ]い顔[かお]をもって、告白[こくはく]とともに進[すす]み入[い]り、神は人[ひと]に正[ただ]しさを返[かえ]される。"
  27: "その後[のち]、その人[ひと]は自分[じぶん]にこう言[い]う。『わたしは何[なん]ということをしてきたのか。わたしが罪[つみ]を犯[おか]したことに、ふさわしい罰[ばつ]は下[くだ]らなかった。"
  28: "わたしの魂[たましい]を、滅[ほろ]びに陥[おちい]らないように救[すく]い出[だ]してください。わたしの命[いのち]は光[ひかり]を見[み]る。』"
  29: "見[み]よ、力[ちから]ある方[かた]はこれらすべてを、人[ひと]とともに三[みっ]つの道[みち]において行[おこな]われる。"
  30: "しかし、神[かみ]はわたしの魂[たましい]を死[し]から救[すく]い出[だ]された。わたしの命[いのち]が光[ひかり]のうちで主[しゅ]をほめたたえるために。"
  31: "ヨブよ、耳[みみ]を傾[かたむ]け、わたしの言[い]うことを聞[き]け。黙[だま]れ。わたしが語[かた]ろう。"
  32: "もし言葉[ことば]があるなら、わたしに答[こた]えよ。語[かた]れ。わたしはあなたが正[ただ]しいと認[みと]められることを望[のぞ]む。"
  33: "もしなければ、あなたはわたしの言[い]うことを聞[き]け。黙[だま]れ。わたしがあなたに知恵[ちえ]を教[おし]えよう。」"

notes:
  1: "Елиуй (продолжение речи, начатой в 32:6): вводной формулы нет, поэтому здесь открывается цитата, а закрывается в 33:33. οὐ μὴν δὲ ἀλλά — «но однако же» (усиленный переход; ru сглаживает: «Итак»). ἄκουσον, Ιωβ, τὰ ῥήματά μου — «послушай, Иов, слов моих»; λαλιάν — «речь, беседа» (csl «беседу»); ἐνωτίζου — «склоняй ухо, внимай»."
  2: "Елиуй. ἰδοὺ γὰρ ἤνοιξα τὸ στόμα μου — «вот, я открыл уста мои»; ἐλάλησεν ἡ γλῶσσά μου — «возглаголал язык мой» (csl). Ἰδού передано 見[み]よ; параллелизм «уста — язык» сохранён."
  3: "Елиуй. καθαρά μου ἡ καρδία ῥήμασιν — «чисто сердце моё в словах»; σύνεσις δὲ χειλέων μου καθαρὰ νοήσει — тёмное: νοήσει можно читать и как датив от νόησις («разумением»), и как будущее от νοέω («уразумеет»); csl держит глагол: «разум же устну моею чистая уразумеет». Передано «清く悟る», двусмысленность не снята."
  4: "Елиуй. πνεῦμα θεῖον τὸ ποιῆσάν με — «Дух Божий, создавший меня» (не «ветер»: πνεῦμα здесь о Духе); πνοὴ δὲ παντοκράτορος ἡ διδάσκουσά με — «дыхание Вседержителя, научающее меня» (csl «дыхание же вседержителево поучающее мя»). В МТ сходная мысль о духе в человеке стоит в 32:8 («но вот, в человеке есть дух»); LXX говорит о Духе Божием — переведено по LXX."
  5: "Елиуй. ἐὰν δύνῃ, δός μοι ἀπόκρισιν πρὸς ταῦτα — «если можешь, дай мне ответ на это»; ὑπόμεινον, στῆθι κατ᾽ ἐμὲ καὶ ἐγὼ κατὰ σέ — «потерпи, стань против меня, и я против тебя» (csl «стани противу мене, и аз противу тебе»): взаимность («я против тебя») в переводе выражена вторым предложением; судебный образ спора сохранён."
  6: "Елиуй. ἐκ πηλοῦ διήρτισαι σὺ ὡς καὶ ἐγώ — «из брения образован ты, как и я» (διαρτίζω — «образовывать, устроять»); ἐκ τοῦ αὐτοῦ διηρτίσμεθα — «из того же созданы мы» (csl «от тогожде сотворения есмы»). В ru иной, масоретский текст («вместо Бога») — не внесён."
  7: "Елиуй. οὐχ ὁ φόβος μού σε στροβήσει — «не страх мой смутит тебя» (στροβέω — «крутить, смущать»); οὐδὲ ἡ χεὶρ μου βαρεῖα ἔσται ἐπὶ σοί — «и рука моя не будет тяжела на тебе» (csl «не страх мой тя смятет, ниже рука моя тяжка будет на тя»)."
  8: "Елиуй. πλὴν εἶπας ἐν ὠσίν μου — «впрочем, ты сказал в уши мои» (πλήν — «однако, но»; передано だが); φωνὴν ῥημάτων σου ἀκήκοα — «голос слов твоих я услышал». Слав. добавляет в конце «занеже глаголеши» — это вводка к цитате, которая в LXX стоит в начале 33:9 (διότι λέγεις), поэтому здесь не дублирована."
  9: "Елиуй. διότι λέγεις — «ибо ты говоришь» (в слав. эта вводка стоит в конце 33:8); Καθαρός εἰμι οὐχ ἁμαρτών — «чист я, не согрешив»; ἄμεμπτος — «непорочен» (csl «непорочен»); οὐ γὰρ ἠνόμησα — «ибо не беззаконновал». Начало цитаты слов Иова — 『…』: вводка 「あなたはこう言う」 стоит здесь, а закрывается цитата в 33:11 (в греч. прямая речь без кавычек)."
  10: "Елиуй. μέμψιν δὲ κατ᾽ ἐμοῦ εὗρεν — «обвинение же против меня нашёл» (μέμψις — «укор, обвинение»); ἥγηται δέ με ὥσπερ ὑπεναντίον — «и считает меня как противника» (csl «мнит мя, яко противника себе»; ὑπεναντίος — «супостат»). Продолжение слов Иова."
  11: "Елиуй. ἔθετο δὲ ἐν ξύλῳ τὸν πόδα μου — «поставил же в дереве ногу мою» (ξύλον — «дерево, колода», т. е. ножные колодки); ἐφύλαξέν δέ μου πάσας τὰς ὁδούς — «и сохранил/стерег все пути мои» (csl «вложи же ногу мою в древо и надсмотрял пути моя вся»). Здесь закрывается цитата слов Иова (33:9–11)."
  12: "Елиуй. πῶς γὰρ λέγεις — «как же ты говоришь»; Δίκαιός εἰμι — «я прав»; οὐκ ἐπακήκοέν μου — «Он не услышал меня» (ἐπακούω); αἰώνιος γάρ ἐστιν ὁ ἐπάνω βροτῶν — «ибо вечен Сущий над смертными» (βροτός — «смертный»; csl «вечен бо есть, иже над земными»). Краткая цитата слов Иова — 『…』; в ru здесь масоретский текст, не внесён."
  13: "Елиуй. λέγεις δέ — «ты же говоришь»; Διὰ τί τῆς δίκης μου οὐκ ἐπακήκοεν πᾶν ῥῆμα — «для чего правды моей не услышал всякое слово?» (δίκη — «тяжба, правое дело», не только «правда»; πᾶν ῥῆμα — «всякое слово»; csl «чесо ради правды моея не услыша всяко слово»). Слова Иова — 『…』."
  14: "Елиуй. ἐν γὰρ τῷ ἅπαξ λαλῆσαι ὁ κύριος — «ибо когда Господь говорит однажды» (ἐν τῷ + inf.); ἐν δὲ τῷ δευτέρῳ ἐνύπνιον — эллипсис: сказуемое опущено, «а во второй раз — сон». Слав. относит к этому стиху и «ἢ ἐν μελέτῃ νυκτερινῇ» (начало LXX 33:15) — держимся деления LXX, поэтому в 33:14 этого нет."
  15: "Елиуй. ἢ ἐν μελέτῃ νυκτερινῇ — «или в ночном размышлении» (μελέτη — «размышление, поучение»; csl «в поучении нощнем»); ὡς ὅταν ἐπιπίπτῃ δεινὸς φόβος ἐπ᾽ ἀνθρώπους — «когда нападает страшный страх на людей»; ἐπὶ νυσταγμάτων ἐπὶ κοίτης — «в дремоте на ложе» (νυσταγμός — «дремота»). Стих обрывается на запятой: продолжение в 33:16."
  16: "Елиуй. τότε ἀνακαλύπτει νοῦν ἀνθρώπων — «тогда открывает ум людей» (ἀνακαλύπτω — «снимать покров, открывать»; csl «открыет ум человеческий»); ἐν εἴδεσιν φόβου τοιούτοις αὐτοὺς ἐξεφόβησεν — «в таких видах страха их устрашил» (εἶδος — «вид, образ»). В ru «открывает у человека ухо» — масоретское чтение, в LXX «ум». Стих тоже обрывается: цель в 33:17."
  17: "Елиуй. ἀποστρέψαι ἄνθρωπον ἐξ ἀδικίας — «чтобы отвратить человека от неправды» (инфинитив цели); τὸ δὲ σῶμα αὐτοῦ ἀπὸ πτώματος ἐρρύσατο — «и тело его от падения избавил» (πτῶμα — «падение»; ῥύομαι — «избавлять»; csl «да возвратит человека от неправды, тело же его от падения избави»)."
  18: "Елиуй. ἐφείσατο δὲ τῆς ψυχῆς αὐτοῦ ἀπὸ θανάτου — «пощадил же душу его от смерти» (φείδομαι — «щадить»); καὶ μὴ πεσεῖν αὐτὸν ἐν πολέμῳ — «чтобы не пасть ему на войне» (csl «еже не пасти ему на брани»). ψυχή здесь — «душа, жизнь»."
  19: "Елиуй. πάλιν δὲ ἤλεγξεν αὐτὸν ἐν μαλακίᾳ ἐπὶ κοίτης — «и снова обличил его болезнью на ложе» (ἐλέγχω — «обличать»; μαλακία — «слабость, болезнь»); πλῆθος ὀστῶν αὐτοῦ ἐνάρκησεν — «множество костей его онемело» (ἐναρκέω — «делать онемелым»; csl «разслаби»)."
  20: "Елиуй. πᾶν βρωτὸν σίτου οὐ μὴ δύνηται προσδέξασθαι — «всякую снедь пшеничную не сможет принять» (βρωτός — «снедь»; προσδέχομαι — «принимать»); ἡ ψυχὴ αὐτοῦ βρῶσιν ἐπιθυμήσει — «душа его пищи возжелает». Противоречие LXX сохранено, как в csl («не возможет прияти, а душа его яди хощет»); в ru оно сглажено."
  21: "Елиуй. ἕως ἂν σαπῶσιν αὐτοῦ αἱ σάρκες — «доколе не сгниют плоти его» (σήπω — «гнить»); ἀποδείξῃ τὰ ὀστᾶ αὐτοῦ κενά — «покажет кости его пустыми» (κενός — «пустой»; csl «тощя»). Стих продолжает период 33:19–20: оборот с ἕως ἄν эллиптичен, сказуемое опущено, поэтому стих и в греческом, и в переводе обрывается на «до тех пор, пока…»."
  22: "Елиуй. ἤγγισεν δὲ εἰς θάνατον ἡ ψυχὴ αὐτοῦ — «приблизилась же к смерти душа его» (ἐγγίζω); ἡ δὲ ζωὴ αὐτοῦ ἐν ᾅδῃ — «жизнь же его в аде» (csl «во аде»; ᾅδης — よみ, как по всей книге Иов; в Псалтири стоит 陰府[よみ])."
  23: "Елиуй. ἐὰν ὦσιν χίλιοι ἄγγελοι θανατηφόροι — «если будут тысяча ангелов смертоносных»; εἷς αὐτῶν οὐ μὴ τρώσῃ αὐτόν — «ни один из них не уязвит его» (τιτρώσκω — «ранить»); ἐὰν νοήσῃ τῇ καρδίᾳ ἐπιστραφῆναι ἐπὶ κύριον — «если помыслит сердцем обратиться к Господу»; ἀναγγείλῃ … τὴν ἑαυτοῦ μέμψιν — «возвестит… свой укор» (μέμψις); τὴν ἄνοιαν αὐτοῦ δείξῃ — «безумие своё покажет» (ἄνοια). Тёмное место; период продолжается в 33:24."
  24: "Елиуй. ἀνθέξεται τοῦ μὴ πεσεῖν αὐτὸν εἰς θάνατον — «заступится, чтобы не пасть ему в смерть» (ἀντέχω — «поддерживать, заступаться»); ἀνανεώσει δὲ αὐτοῦ τὸ σῶμα ὥσπερ ἀλοιφὴν ἐπὶ τοίχου — «обновит тело его, как обмазку на стене» (ἀλοιφή — «обмазка, мазь»; csl «повапление» — побелка); τὰ ὀστᾶ αὐτοῦ ἐμπλήσει μυελοῦ — «кости его исполнит мозга» (μυελός). В ru/МТ здесь слова Бога («освободи его…»), в LXX и csl прямой речи нет — не внесена."
  25: "Елиуй. ἁπαλυνεῖ δὲ αὐτοῦ τὰς σάρκας ὥσπερ νηπίου — «смягчит плоть его, как у младенца» (ἁπαλύνω — «делать нежным»; νήπιος — «младенец»); ἀποκαταστήσει δὲ αὐτὸν ἀνδρωθέντα ἐν ἀνθρώποις — «и восстановит его возмужавшим среди людей» (ἀποκαθίστημι; ἀνδρόω — «возмужать»; csl «устроит его возмужавша в человецех»)."
  26: "Елиуй. εὐξάμενος δὲ πρὸς κύριον — «помолившись же Господу»; δεκτὰ αὐτῷ ἔσται — «приятен будет Ему» (δεκτός — «принятый, приятный»); εἰσελεύσεται δὲ προσώπῳ καθαρῷ σὺν ἐξηγορίᾳ — «войдёт с чистым лицом, с исповеданием» (ἐξηγορία — редкое слово, «изъяснение, исповедание»; csl «со исповеданием»); ἀποδώσει δὲ ἀνθρώποις δικαιοσύνην — «воздаст людям правду». В csl «лицем веселым» — по МТ («с радостью»); по исключению паритета взят LXX «чистым лицом», csl в notes."
  27: "Елиуй. εἶτα τότε ἀπομέμψεται ἄνθρωπος αὐτὸς ἑαυτῷ λέγων — «потом тогда укорит человек сам себя, говоря» (ἀπομέμφομαι); οἷα συνετέλουν — «какие дела я совершал!» (οἷα — восклицание, συντελέω — «совершать»); οὐκ ἄξια ἤτασέν με ὧν ἥμαρτον — «не по достоинству взыскал с меня за то, что я согрешил» (ἐτάζω — «взыскивать, испытывать»; csl «не по достоинству истяза мя»). Тёмное место, передано буквально. Начало речи кающегося — 『…』, продолжается в 33:28."
  28: "Елиуй. σῶσον ψυχήν μου τοῦ μὴ ἐλθεῖν εἰς διαφθοράν — «спаси душу мою, чтобы не войти ей в тление» (διαφθορά — «тление, погибель»); ἡ ζωή μου φῶς ὄψεται — «жизнь моя увидит свет». Продолжение и конец речи кающегося — 『…』."
  29: "Елиуй. ἰδοὺ πάντα ταῦτα ἐργᾶται ὁ ἰσχυρός — «вот, всё это делает Крепкий» (ὁ ἰσχυρός — о Боге; csl «крепкий (Бог)», пояснение в скобках); ὁδοὺς τρεῖς μετὰ ἀνδρός — «три пути с человеком» (ὁδούς — винитив, «пути»; слав. «пути три»). В ru/МТ «два-три раза» — иное чтение; держимся LXX («три пути»), смысл тёмен."
  30: "Елиуй. ἀλλ᾽ ἐρρύσατο τὴν ψυχήν μου ἐκ θανάτου — «но избавил душу мою от смерти» (ῥύομαι); ἵνα ἡ ζωή μου ἐν φωτὶ αἰνῇ αὐτόν — «чтобы жизнь моя во свете хвалила Его» (αἰνέω — «хвалить»). Речь Елиуя от лица человека (слав. тоже «мою»)."
  31: "Елиуй. ἐνωτίζου, Ιωβ, καὶ ἄκουέ μου — «внимай, Иов, и слушай меня»; κώφευσον — «молчи, замолчи» (κωφεύω — «хранить молчание»); ἐγώ εἰμι λαλήσω — гебраизм, «я — буду говорить» (csl «аз возглаголю»)."
  32: "Елиуй. εἰ εἰσὶν λόγοι, ἀποκρίθητί μοι — «если есть слова, ответь мне»; λάλησον — «говори»; θέλω γὰρ δικαιωθῆναί σε — «ибо хочу, чтобы ты был оправдан» (δικαιόω; csl «хощу бо оправдитися тебе»)."
  33: "Елиуй. εἰ μή, σὺ ἄκουσόν μου — «если же нет, ты послушай меня» (csl «аще же ни, ты послушай мене»); κώφευσον, καὶ διδάξω σε σοφίαν — «молчи, и научу тебя премудрости» (σοφία — 知恵). Здесь закрывается цитата всей речи (33:1–33); речь Елиуя продолжается в 34:1 новой формулой."
