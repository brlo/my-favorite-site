# jp-box, Иов, глава 33. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге только 1–2; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 33: продолжение речи Елиуя (начата в 32:6) — призыв слушать (1–7),
# пересказ слов Иова (8–11) и ответ на них (12–13), Бог говорит во сне (14–16)
# и через болезнь (17–22), ангел-заступник и помилование (23–28),
# итог: три пути Божиих (29–33).
# Голоса: вся глава — речь Елиуя, одна цитата 「…」 с 33:1 по 33:33 (вводной формулы
# нет: речь продолжается из гл. 32, поэтому кавычка открыта в начале главы и закрыта
# в конце). Слова Иова внутри речи — 『…』: 9–11, 12, 13; слова кающегося человека —
# 『…』: 27–28.
# Нумерация по gr: 33 стиха, как в csl-ru и ru. Расхождение только в 14/15: слав.
# относит «ἢ ἐν μελέτῃ νυκτερινῇ» к 33:14, в LXX это начало 33:15 — держимся LXX.
# 〔…〕 нет: все стихи есть в gr-lxx-byz. Сносок ⟨…⟩ нет.
# Имена — транслитерация греческого (LXX): ヨブ, エリフ.

