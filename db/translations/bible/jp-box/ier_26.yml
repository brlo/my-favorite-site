verses:
  1: "ヨヤキム、ヨシヤの子[こ]である王[おう]の治[ち]世[せい]の初[はじ]めに、この言葉[ことば]が主[しゅ]からあった。"
  2: "主[しゅ]はこう言[い]われた。「主[しゅ]の家[いえ]の庭[にわ]に立[た]ち、ユダヤ人[じん]すべてに、また礼拝[れいはい]しに主の家[いえ]へ来[く]るすべての者[もの]に、わたしがあなたに命[めい]じたすべての言葉[ことば]を語[かた]れ。ひと言[こと]も欠[か]いてはならない。"
  3: "もしかれらが聞[き]いて、それぞれ悪[わる]い道[みち]から離[はな]れ返[かえ]るなら、わたしは、彼らの悪[あく]い企[たくら]みのゆえに彼らに下[くだ]そうと考[かんが]えている災[わざわ]いをやめる。"
  4: "そして言[い]え。主[しゅ]はこう言[い]われる。もしあなたがたが、わたしがあなたがたの前[まえ]に与[あた]えたわたしの定[さだ]めに従[したが]って歩[あゆ]まず、"
  5: "朝[あさ]早[はや]くからあなたがたに遣[つか]わし、すでに遣わしたわたしのしもべである預言者[よげんしゃ]たちの言葉[ことば]に聞[き]き従[したが]わないなら、"
  6: "わたしはこの家[いえ]をシロのようにし、この町[まち]を地[ち]のすべての民[たみ]の呪[のろ]いとする。」"
  7: "祭司[さいし]たちと偽[ぎ]預言者[よげんしゃ]たち、民[たみ]はみな、エレミヤが主[しゅ]の家[いえ]でこれらの言葉[ことば]を語[かた]るのを聞[き]いた。"
  8: "エレミヤが、主[しゅ]がすべての民[たみ]に語[かた]るよう命[めい]じたすべてのことを語り終[お]えたとき、祭司[さいし]たちと偽[ぎ]預言者[よげんしゃ]たち、民[たみ]はみな、彼[かれ]を捕[つか]まえて言[い]った。「あなたは死[し]ななければならない。"
  9: "主[しゅ]の名[な]によって預言[よげん]して、『この家[いえ]はシロのようになり、この町[まち]は住[す]む者[もの]を失[うしな]って荒[あ]れ果[は]てる』と言[い]ったからである。」そして民[たみ]はみな、主[しゅ]の家[いえ]でエレミヤに集[あつ]まって来[き]た。"
  10: "ユダの君[きみ]たちはこの言葉[ことば]を聞[き]き、王[おう]の家[いえ]から主[しゅ]の家[いえ]へ上[のぼ]って、主の家[いえ]の新[あたら]しい門[もん]の入口[いりぐち]に座[すわ]った。"
  11: "祭司[さいし]たちと偽[ぎ]預言者[よげんしゃ]たちは、君[きみ]たちと民[たみ]すべてに言[い]った。「この人[ひと]には死[し]の判決[はんけつ]が下[くだ]るべきである。あなたがたが耳[みみ]で聞[き]いたとおり、この町[まち]に逆[さから]って預言[よげん]したからである。」"
  12: "エレミヤは君[きみ]たちと民[たみ]すべてに言[い]った。「主[しゅ]は、あなたがたが聞[き]いたこのすべての言葉[ことば]を、この家[いえ]とこの町[まち]に逆[さから]って預言[よげん]するために、わたしを遣[つか]わされた。"
  13: "さあ、あなたがたの道[みち]と行[おこな]いを改[あらた]め、あなたがたの神[かみ]である主[しゅ]の声[こえ]に聞[き]き従[したが]え。そうすれば、主はあなたがたに語[かた]られた災[わざわ]いをやめられる。"
  14: "見[み]よ、わたしはあなたがたの手[て]のうちにある。あなたがたに良[よ]いと思[おも]われるように、ふさわしいように、わたしにせよ。"
  15: "ただ、はっきりと知[し]っておけ。もしあなたがたがわたしを殺[ころ]すなら、罪[つみ]のない血[ち]を、自分[じぶん]たちの上[うえ]に、この町[まち]とその住[す]む者[もの]の上に注[そそ]ぐことになる。主[しゅ]は真実[しんじつ]に、あなたがたの耳[みみ]にこのすべての言葉を語[かた]るために、わたしをあなたがたに遣[つか]わされたのだから。」"
  16: "君[きみ]たちと民[たみ]すべては、祭司[さいし]たちと偽[ぎ]預言者[よげんしゃ]たちに言[い]った。「この人[ひと]に死[し]の判決[はんけつ]は下[くだ]らない。われわれの神[かみ]である主[しゅ]の名[な]によって、われわれに語[かた]ったのだから。」"
  17: "地[ち]の長老[ちょうろう]たちのうちから人[ひと]々[びと]が立[た]ち、民[たみ]の全会衆[かいしゅう]に言[い]った。"
  18: "「モラシ人[びと]ミカは、ユダの王[おう]ヒゼキヤの時代[じだい]に預言[よげん]し、ユダの民[たみ]すべてに言[い]った。『万軍[ばんぐん]の主[しゅ]はこう言[い]われる。シオンは畑[はたけ]のように耕[たがや]され、エルサレムは人[ひと]の住[す]まない所[ところ]となり、この家[いえ]の山[やま]は森[もり]の丘[おか]となる。"
  19: "ヒゼキヤとユダのすべての者が、彼[かれ]を殺[ころ]しただろうか。彼らは主[しゅ]を恐[おそ]れ、主の顔[かお]をなだめて、主が彼らに語[かた]られた災[わざわ]いをやめさせたのではないか。われわれは、自分[じぶん]たちの魂[たましい]に大[おお]きな悪[あく]を行[おこな]おうとしているのである。』」"
  20: "主[しゅ]の名[な]によって預言[よげん]する者[もの]がほかにもいた。キリアト・ヤリム出身[しゅっしん]のシェマヤの子[こ]ウリヤである。彼[かれ]はこの町[まち]とこの地[ち]について、エレミヤのすべての言葉[ことば]と同じように預言した。"
  21: "ヨヤキム王[おう]とすべての君[きみ]たちは彼のすべての言葉[ことば]を聞[き]き、彼を殺[ころ]そうとした。ウリヤはそれを聞[き]くと、恐[おそ]れてエジプトへ逃[に]げた。"
  22: "そこでヨヤキム王[おう]はエジプトへ人[ひと]々[びと]を遣[つか]わした。アハボルの子[こ]エルナタンと、彼と共[とも]の者[もの]たちである。"
  23: "彼らはウリヤをそこから連[つ]れ出[だ]し、王[おう]のもとへ連れて来[き]た。王は彼を剣[つるぎ]で打[う]ち、その民[たみ]の子[こ]らたちの墓[はか]に投[な]げ捨[す]てた。"
  24: "しかし、シャファンの子[こ]アヒカムの手[て]がエレミヤと共[とも]にあり、彼を民[たみ]の手[て]に渡[わた]して殺[ころ]させることはなかった。"

notes:
  1: "Ἐν ἀρχῇ βασιλέως Ιωακιμ υἱοῦ Ιωσια — «в начале [царствования] Иоакима, сына Иосии»: слав. «в начале царства иоакима сына иосиина». Греч. «βασιλέως» без «Иудейского» — добавление ru («царя Иудейского») не внесено (МТ). ἐγενήθη ὁ λόγος οὗτος παρὰ κυρίου — «было слово сие от Господа». Стих — надписание к речи в храме."
  2: "Στῆθι ἐν αὐλῇ οἴκου κυρίου — «стань во дворе дома Господня» (αὐλή — двор, ср. 2 Пар 20:5); χρηματιεῖς ἅπασι τοῖς Ιουδαίοις — «возвестишь всем иудеям» (χρηματίζω — возвещать, давать оракул). τοῖς ἐρχομένοις προσκυνεῖν ἐν οἴκῳ κυρίου — «приходящим поклониться в дом Господень»; ἅπαντας τοὺς λόγους, οὓς συνέταξά σοι — «все слова, какие Я заповедал тебе» (συντάσσω — приказывать, заповедовать); μὴ ἀφέλῃς ῥῆμα — «не убавь слова» (ἀφαιρέω — отнимать), слав. «не уйми словесе»."
  3: "ἴσως ἀκούσονται — «может быть, услышат» (ἴσως — может быть, едва ли не); ἀποστραφήσονται ἕκαστος ἀπὸ τῆς ὁδοῦ αὐτοῦ τῆς πονηρᾶς — «отвратится каждый от пути своего злого»; παύσομαι ἀπὸ τῶν κακῶν, ὧν ἐγὼ λογίζομαι τοῦ ποιῆσαι αὐτοῖς — «Я прекращу бедствия, которые замышляю сделать им» (λογίζομαι — замышлять, считать); ἕνεκεν τῶν πονηρῶν ἐπιτηδευμάτων αὐτῶν — «ради злых занятий (дел) их» (ἐπιτήδευμα — занятие, промысел)."
  4: "ἐὰν μὴ ἀκούσητέ μου τοῦ πορεύεσθαι ἐν τοῖς νομίμοις μου — «если не послушаете Меня, чтобы ходить в уставах Моих» (νόμιμα — установления, уставы; ср. νόμος — 律法); οἷς ἔδωκα κατὰ πρόσωπον ὑμῶν — «которые Я дал пред лицом вашим». Слав. «в законех моих, яже дах пред лицем вашим». Формула «и скажи: так говорит Господь» внутри речи не разрывает кавычек."
  5: "εἰσακούειν τῶν λόγων τῶν παίδων μου τῶν προφητῶν — «слушать слова рабов Моих, пророков»; οὓς ἐγὼ ἀποστέλλω πρὸς ὑμᾶς ὄρθρου καὶ ἀπέστειλα — «которых Я посылаю к вам с рассвета и послал» (ὄρθρου — на рассвете, рано утром; ср. 7:13,25); οὐκ εἰσηκούσατέ μου — «и вы не послушали Меня». Двойное «посылаю и послал» сохранено."
  6: "δώσω τὸν οἶκον τοῦτον ὥσπερ Σηλωμ — «сделаю дом сей как Силом» (Σηλωμ — Силом, где была скиния, разрушенная филистимлянами, 1 Цар 4:11; слав. «силом»); τὴν πόλιν δώσω εἰς κατάραν πᾶσιν τοῖς ἔθνεσιν — «город сей предам в проклятие всем народам» (κατάρα — проклятие, слав. «в клятву»); πάσης τῆς γῆς — «всей земли». Здесь закрывается слово Господа."
  7: "ἤκουσαν οἱ ἱερεῖς καὶ οἱ ψευδοπροφῆται — «услышали священники и лжепророки»; πᾶς ὁ λαὸς τοῦ Ιερεμιου λαλοῦντος — «весь народ, [когда] Иеремия говорил» (родительный при глаголе слушания). Слав. «иеремию глаголюща»."
  8: "παυσαμένου λαλοῦντος — «когда перестал говорить» (παύω); πάντα, ἃ συνέταξεν αὐτῷ κύριος λαλῆσαι παντὶ τῷ λαῷ — «всё, что заповедал ему Господь сказать всему народу». συνελάβοσαν αὐτὸν — «схватили его» (συλλαμβάνω); λέγων Θανάτῳ ἀποθανῇ — «говоря: смертью умрёшь» (гебраизм усиления: «непременно умрёшь»), слав. «смертию да умрет». С этих слов открывается речь обвинителей, продолжающаяся в 9."
  9: "ἐπροφήτευσας τῷ ὀνόματι κυρίου — «ты пророчествовал именем Господним»; Ὥσπερ Σηλωμ ἔσται ὁ οἶκος οὗτος — «как Силом будет дом сей»: внутри речи обвинителей это цитата слов Иеремии, дана вложенной речью 『…』. ἐρημωθήσεται ἀπὸ κατοικούντων — «опустеет от жителей». ἐξεκκλησιάσθη πᾶς ὁ λαὸς ἐπὶ Ιερεμιαν — «собрался весь народ против Иеремии» (ἐκκλησιάζω — собирать на собрание); слав. «собрашася... на иеремию»."
  10: "οἱ ἄρχοντες Ιουδα — «князья Иуды»; ἀνέβησαν ἐξ οἴκου τοῦ βασιλέως εἰς οἶκον κυρίου — «вошли из дома царя в дом Господень»; ἐκάθισαν ἐν προθύροις πύλης κυρίου τῆς καινῆς — «сели в преддверии (притворе) ворот Господних новых» (πρόθυρον — преддверие; πύλη — ворота); слав. «во преддверии врат дому Господня новых». Речь о северных воротах, построенных Иоафамом (4 Цар 15:35)."
  11: "Κρίσις θανάτου τῷ ἀνθρώπῳ τούτῳ — «смертный приговор человеку сему» (κρίσις θανάτου — суд смерти, т. е. достоин смерти); ὅτι ἐπροφήτευσεν κατὰ τῆς πόλεως ταύτης — «ибо он пророчествовал против города сего»; καθὼς ἠκούσατε ἐν τοῖς ὠσὶν ὑμῶν — «как вы слышали своими ушами» (ἐν τοῖς ὠσίν — гебраизм, «своими ушами»)."
  12: "Κύριος ἀπέστειλέν με προφητεῦσαι ἐπὶ τὸν οἶκον τοῦτον καὶ ἐπὶ τὴν πόλιν ταύτην — «Господь послал меня пророчествовать против дома сего и против города сего»; πάντας τοὺς λόγους τούτους, οὓς ἠκούσατε — «все слова сии, которые вы слышали». Начало ответной речи Иеремии (12–15)."
  13: "βελτίους ποιήσατε τὰς ὁδοὺς ὑμῶν καὶ τὰ ἔργα ὑμῶν — «сделайте лучше пути ваши и дела ваши» (βελτίων — лучший). Слав. добавляет «Бога вашего» при «гласа Господа» — нет в LXX, внесено в текст без скобок (あなたがたの神である主の声). παύσεται κύριος ἀπὸ τῶν κακῶν, ὧν ἐλάλησεν ἐφ' ὑμᾶς — «Господь отменит бедствия, которые изрёк на вас»."
  14: "ἰδοὺ ἐγὼ ἐν χερσὶν ὑμῶν — «вот, я в руках ваших»; ποιήσατέ μοι ὡς συμφέρει καὶ ὡς βέλτιον ὑμῖν — «сделайте мне, как угодно (полезно) и как лучше вам» (συμφέρει — полезно, идёт на пользу). Слав. «сотворите ми якоже угодно и якоже лучше вам является»."
  15: "ἀλλ' ἢ γνόντες γνώσεσθε — «но знанием узнаете» (усиление, «твёрдо знайте»); εἰ ἀναιρεῖτέ με — «если вы убиваете меня» (ἀναιρέω — убивать, уничтожать); αἷμα ἀθῷον δίδοτε ἐφ' ὑμᾶς — «кровь невинную даёте на себя» (ἀθῷος — невинный; ср. Мф 27:4); ἐπὶ τὴν πόλιν ταύτην καὶ ἐπὶ τοὺς κατοικοῦντας ἐν αὐτῇ — «на город сей и на живущих в нём». ἐν ἀληθείᾳ ἀπέσταλκέν με κύριος — «поистине послал меня Господь»; λαλῆσαι εἰς τὰ ὦτα ὑμῶν — «говорить в уши ваши»."
  16: "Οὐκ ἔστιν τῷ ἀνθρώπῳ τούτῳ κρίσις θανάτου — «нет человеку сему смертного приговора»; ἐπὶ τῷ ὀνόματι κυρίου τοῦ θεοῦ ἡμῶν ἐλάλησεν πρὸς ἡμᾶς — «именем Господа Бога нашего он говорил нам». Слав. «во имя Господа нашего» — при «Бога нашего» только в греч., в тексте по греч."
  17: "ἀνέστησαν ἄνδρες τῶν πρεσβυτέρων τῆς γῆς — «встали некоторые из старейшин земли» (πρεσβύτεροι — старейшины); πάσῃ τῇ συναγωγῇ τοῦ λαοῦ — «всему собранию народа» (συναγωγή — собрание, ср. 31:40). Речь старейшин — 18–19."
  18: "Μιχαιας ὁ Μωραθίτης — «Михей Морасфитянин» (Μωραθι, Морасфи; слав. «михеа морафитский»), в тексте モラシ人ミカ. ἦν ἐν ταῖς ἡμέραις Εζεκιου βασιλέως Ιουδα — «был во дни Езекии, царя Иудейского»; ἐπροφήτευσεν... παντὶ τῷ λαῷ Ιουδα — «пророчествовал... всему народу Иудейскому». Цитата пророчества (Мих 3:12) внутри речи старейшин дана вложенной речью 『…』. Σιων ὡς ἀγρὸς ἀροτριαθήσεται — «Сион будет вспахан, как поле» (ἀροτριάω — пахать); εἰς ἄβατον — «в непроходимое»; τὸ ὄρος τοῦ οἴκου εἰς ἄλσος δρυμοῦ — «гора дома — в лесную рощу» (ἄλσος — роща; δρυμός — дубрава, чаща); слав. «в луг дубравный»."
  19: "μὴ ἀνελὼν ἀνεῖλεν αὐτὸν Εζεκιας καὶ πᾶς Ιουδα; — «разве убил его Езекия и весь Иуда?» (двойной глагол — усиление); ἐφοβήθησαν τὸν κύριον — «убоялись Господа»; ἐδεήθησαν τοῦ προσώπου κυρίου — «умоляли лицо Господне» (δέομαι — умолять, просить); ἐπαύσατο κύριος ἀπὸ τῶν κακῶν — «Господь отменил бедствия». καὶ ἡμεῖς ἐποιήσαμεν κακὰ μεγάλα ἐπὶ ψυχὰς ἡμῶν — «а мы делаем великое зло против душ наших». Здесь закрывается речь старейшин (и вложенная цитата Михея)."
  20: "καὶ ἄνθρωπος ἦν προφητεύων τῷ ὀνόματι κυρίου — «был и человек, пророчествовавший именем Господним»; Ουριας υἱὸς Σαμαιου ἐκ Καριαθιαριμ — «Урия, сын Шемаии, из Кариаф-Иарима» (слав. «уриа сын самеов от кариафиарима»; евр. Шемаия). ἐπροφήτευσεν περὶ τῆς γῆς ταύτης — «пророчествовал об этой земле»; κατὰ πάντας τοὺς λόγους Ιερεμιου — «по всем словам Иеремии»; слав. добавляет «на град сей» — нет в LXX, в текст не внесено (町については前の文で言われている)."
  21: "ἤκουσεν ὁ βασιλεὺς Ιωακιμ καὶ πάντες οἱ ἄρχοντες — «услышал царь Иоаким и все князья»; ἐζήτουν ἀποκτεῖναι αὐτόν — «искали убить его». Слав. добавляет «и убояся, и бежа» — нет в LXX, внесено в текст без скобок (恐れて…逃げた); в греч. только «услышал Урия и вошёл в Египет»."
  22: "ἐξαπέστειλεν ὁ βασιλεὺς ἄνδρας εἰς Αἴγυπτον — «послал царь мужей в Египет»: в греч. стих обрывается, имён нет; они есть в слав. («елдафана сына ахорова и мужы с ним») по МТ и внесены в текст без скобок (アハボルの子エルナタン). Стих не дополнялся сверх слав."
  23: "ἐξηγάγοσαν αὐτὸν ἐκεῖθεν — «вывели его оттуда»; εἰσηγάγοσαν πρὸς τὸν βασιλέα — «привели к царю»; ἐπάταξεν αὐτὸν ἐν μαχαίρᾳ — «поразил его мечом»; ἔρριψεν αὐτὸν εἰς τὸ μνῆμα υἱῶν λαοῦ αὐτοῦ — «бросил его в гробницу сынов народа его», т. е. в общую могилу простонародья (μνῆμα — памятник, гробница); слав. «во гроб сынов людий своих»."
  24: "πλὴν χεὶρ Αχικαμ υἱοῦ Σαφαν ἦν μετὰ Ιερεμιου — «но рука Ахикама, сына Сафанова, была с Иеремией» (рука — покровительство, ср. 39:14); τοῦ μὴ παραδοῦναι αὐτὸν εἰς χεῖρας τοῦ λαοῦ — «чтобы не предать его в руки народа»; τοῦ μὴ ἀνελεῖν αὐτόν — «чтобы не убить его». Слав. «обаче рука ахикама сына сафаниина» — при «Сафан» в греч., в тексте シャファン."
