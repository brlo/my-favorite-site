verses:
  1: "エレミヤに臨[のぞ]んだ主[しゅ]の言葉[ことば]。諸[もろもろ]の民[たみ]について。"
  2: "エジプトについて、すなわち、エジプトの王[おう]ファラオ・ネカオの軍勢[ぐんぜい]について。その軍勢はユーフラテス川[がわ]のほとりのカルケミシュにいたが、バビロンの王ネブカドネツァルが、ユダの王ヨヤキム、ヨシヤの子[こ]の第四年[だいよねん]に、これを撃[う]った。"
  3: "武器[ぶき]と盾[たて]を取[と]り、戦[たたか]いへ進[すす]め。"
  4: "馬[うま]に鞍[くら]を着[つ]けよ。騎兵[きへい]たちよ、乗[の]れ。兜[かぶと]をかぶって立[た]て。槍[やり]を突[つ]き出[だ]せ。鎧[よろい]を着[き]よ。"
  5: "なぜ、彼[かれ]らは恐[おそ]れて後[うし]ろへ退[しりぞ]くのか。なぜ、その強[つよ]い者[もの]たちは打[う]ち倒[たお]されるのか。彼らは逃[に]げ去[さ]り、振[ふ]り向[む]かなかった。四方[しほう]から囲[かこ]まれて。――主[しゅ]は言[い]われる。"
  6: "足[あし]の速[はや]い者[もの]も逃[に]げてはならない。強[つよ]い者[もの]も救[すく]われてはならない。北[きた]のほうで、ユーフラテス川[がわ]のほとりで、彼らは弱[よわ]り、倒[たお]れた。"
  7: "川[かわ]のように上[のぼ]り、川々[かわかわ]のように水[みず]を波立[なみだ]たせる者[もの]は、だれか。"
  8: "エジプトの水[みず]は川[かわ]のように上[のぼ]り、川々のように水を波立[なみだ]てる。そして、彼[かれ]は言[い]った。「わたしは上[のぼ]って地[ち]を覆[おお]い、都[みやこ]とそこに住[す]む者[もの]を滅[ほろ]ぼす。」"
  9: "馬[うま]に乗[の]れ。戦車[せんしゃ]を整[ととの]えよ。出[で]て行[い]け。エチオピア人[じん]の戦士[せんし]たちよ、盾[たて]で身[み]を固[かた]めたリビア人[じん]たちよ。リディア人[じん]よ、上[のぼ]って弓[ゆみ]を引[ひ]け。"
  10: "その日[ひ]は、全能者[ぜんのうしゃ]である主[しゅ]なる神[かみ]の日[ひ]、復讐[ふくしゅう]の日[ひ]である。主はその敵[てき]に復讐される。剣[つるぎ]は食[く]らい、満[み]ち、彼[かれ]らの血[ち]で酔[よ]う。万軍[ばんぐん]の主[しゅ]への犠牲[ぎせい]が、北[きた]の地[ち]、ユーフラテス川[がわ]のほとりにあるからである。"
  11: "ガラデ[ち]へ上[のぼ]り、樹脂[じゅし]を取[と]れ。エジプトの娘[むすめ]、おとめよ。あなたは多[おお]くの薬[くすり]をいたずらに用[もち]いたが、あなたには癒[いや]しがない。"
  12: "諸国[しょこく]はあなたの声[こえ]を聞[き]き、あなたの叫[さけ]びで地[ち]は満[み]ちた。強[つよ]い者[もの]が強[つよ]い者とぶつかり、ふたりとも共[とも]に倒[たお]れたからである。"
  13: "主[しゅ]が預言者[よげんしゃ]エレミヤの手[て]によって語[かた]られた言葉[ことば]。すなわち、バビロンの王[おう]ネブカドネツァルが来[き]てエジプトの地[ち]を撃[う]つことについて。"
  14: "エジプトに告[つ]げ、マグドルに知[し]らせよ。メンフィスで呼[よ]ばわり、タフナヘスで告げよ。言[い]え。「立[た]って、備[そな]えよ。剣[つるぎ]が、あなたの周[まわ]りにあるものを食[く]い尽[つ]くしたからである。」"
  15: "なぜ、あなたのアピスは逃[に]げたのか。あなたの選[えら]ばれた子牛[こうし]はとどまらなかった。主[しゅ]がこれを砕[くだ]いたからである。"
  16: "あなたの多[おお]くの者[もの]たちは弱[よわ]り、倒[たお]れた。そして、それぞれが隣人[りんじん]に言[い]った。「立[た]って、われわれの民[たみ]のもとへ、生[う]まれ故郷[こきょう]へ帰[かえ]ろう。ギリシアの剣[つるぎ]のゆえに。」"
  17: "エジプトの王[おう]ファラオ・ネカオの名[な]を呼[よ]べ。「時[とき]を過[す]ぎ去[さ]らせた騒[さわ]ぎ」と。"
  18: "「わたしは生[い]きている、と王[おう]である主[しゅ]は言[い]われる。その名[な]は全能者[ぜんのうしゃ]。タボルが山々[やまやま]の間[あいだ]にあるように、カルメルが海[うみ]のほとりにあるように、彼[かれ]は必[かなら]ず来[く]る。」"
  19: "エジプトに住[す]む娘[むすめ]よ、捕囚[ほしゅう]の器[うつわ]を自分[じぶん]のために造[つく]れ。メンフィスは荒[あ]れ果[は]て、「ああ、わざわい」と呼[よ]ばれる。そこに住[す]む者[もの]がいなくなるからである。"
  20: "エジプトは美[うつく]しく飾[かざ]られた雌[めす]の子牛[こうし]。北[きた]からの破滅[はめつ]が、そのもとに来[き]た。"
  21: "その中[なか]の雇[やと]い人[びと]たちも、その中で育[そだ]てられた肥[こ]えた子牛のようである。彼らもまた背[そむ]き、共[とも]に逃[に]げ去[さ]り、立[た]ち止[ど]まらなかった。彼らの滅[ほろ]びの日[ひ]、罰[ばつ]の時[とき]が来[き]たからである。"
  22: "その声[こえ]は蛇[へび]がしゅうしゅうと鳴[な]くようである。彼らは砂[すな]の上[うえ]を行[ゆ]く。彼らは木[き]を切[き]る者[もの]のように、斧[おの]をもってそのもとに来[く]る。"
  23: "彼らはその森[もり]を切[き]り倒[たお]す、と主[しゅ]なる神[かみ]は言[い]われる。それは数[かぞ]えきれないからである。彼らはいなごよりも多[おお]く、その数[かず]はない。"
  24: "エジプトの娘[むすめ]は辱[はずかし]められ、北[きた]の民[たみ]の手[て]に渡[わた]された。"
  25: "全能者[ぜんのうしゃ]である主[しゅ]、イスラエルの神[かみ]は言[い]われる。「見[み]よ、わたしはエジプトのアモンと、その子[こ]とを罰[ばっ]する。ファラオとエジプトを、その神々[かみがみ]とその王[おう]たちを、ファラオと、彼に信頼[しんらい]する者[もの]たちを。"
  26: "わたしは彼[かれ]らを、その命[いのち]を求[もと]める者たちの手[て]に、バビロンの王[おう]ネブカドネツァルの手に、そのしもべたちの手に渡[わた]す。その後[のち]、彼らは以前[いぜん]のように住[す]むようになる」と主[しゅ]は言[い]われる。"
  27: "しかし、あなたは恐[おそ]れてはならない。わたしのしもべヤコブよ。イスラエルよ、おののいてはならない。見[み]よ、わたしは遠[とお]くからあなたを救[すく]い、あなたの子孫[しそん]をその捕囚[ほしゅう]の地[ち]から救[すく]う。ヤコブは帰[かえ]ってきて、安[やす]らかに住[す]み、栄[さか]え、眠[ねむ]る。これを煩[わずら]わす者[もの]はだれもいなくなる。"
  28: "恐[おそ]れるな、わたしのしもべヤコブよ、と主[しゅ]は言[い]われる。わたしはあなたと共[とも]にいる。わたしは、あなたを追[お]いやったすべての民[たみ]に全[まった]き終[おわ]りをもたらすが、あなたを絶[た]やしはしない。あなたを正[ただ]しく懲[こ]らしめ、罰[ばつ]を免[まぬが]れさせることはないからである。"

notes:
  1: "В модуле лакуна («.»). Слав. 46:1 — «Слово, еже бысть ко иеремии пророку от Господа на языки»: это надписание ко всей группе оракулов о народах (наши гл. 26–32 = слав. 46–51 и слав. 25), а не только к Египту; переведено по слав. без 〔…〕. Греч. «Λόγος κυρίου ἐπὶ τὰ ἔθνη» в модуле утрачен."
  2: "Τῇ Αἰγύπτῳ ἐπὶ δύναμιν Φαραω Νεχαω — «К Египту, о войске фараона Нехао»: дательный заголовка, как в 26:1 (слав. «ко египту противу силы фараона нехао»). ὃς ἦν ἐπὶ τῷ ποταμῷ Εὐφράτῃ ἐν Χαρχαμις — «которое было при реке Евфрате, в Кархамисе» (カルケミシュ, как в 4 Цар 23:29). ὃν ἐπάταξε Ναβουχοδονοσορ βασιλεὺς Βαβυλῶνος — «которое поразил Навуходоносор, царь Вавилонский» (ネブカドネツァル по корпусу). ἐν τῷ ἔτει τῷ τετάρτῳ Ιωακιμ — «в четвёртый год Иоакима»; слав. добавляет «сына иосиина» — нет в LXX, внесено без 〔…〕."
  3: "Ἀναλάβετε ὅπλα καὶ ἀσπίδας — «возьмите оружие и щиты» (ὅπλον — оружие, 武器; ἀσπίς — щит); προσαγάγετε εἰς πόλεμον — «приступите к войне» (戦いへ進め). Обращение к Египту; речь пророка без кавычек (ср. Ис 13–23)."
  4: "ἐπισάξατε τοὺς ἵππους — «оседлайте коней» (ἐπισάσσω — седлать, 鞍を着ける); ἐπίβητε, οἱ ἱππεῖς — «садитесь, всадники» (騎兵); κατάστητε ἐν ταῖς περικεφαλαίαις ὑμῶν — «станьте в шлемах ваших» (兜); προβάλετε τὰ δόρατα — «выставьте копья» (槍); ἐνδύσασθε τοὺς θώρακας — «облекитесь в брони» (鎧)."
  5: "τί ὅτι αὐτοὶ πτοοῦνται — «почему они страшатся?» (πτοέω — устрашать); ἀποχωροῦσιν ὀπίσω — «отступают назад». οἱ ἰσχυροὶ αὐτῶν κοπήσονται — «сильные их будут посечены» (打ち倒される). φυγῇ ἔφυγον — гебраизм «бегством побежали» (逃げ去り). περιεχόμενοι κυκλόθεν — «охваченные отовсюду» (四方から囲まれて; слав. «отвсюду страх»). λέγει κύριος — формула в конце стиха вне кавычек."
  6: "μὴ φευγέτω ὁ κοῦφος — «да не убежит лёгкий» (κοῦφος — быстрый, легконогий); μὴ ἀνασῳζέσθω ὁ ἰσχυρός — «да не спасётся сильный». ἐπὶ βορρᾶν — «на север» (слав. «на полунощь»); τὰ παρὰ τὸν Εὐφράτην ἠσθέντησαν πεπτώκασιν — «при Евфрате они изнемогли, пали»."
  7: "τίς οὗτος ὡς ποταμὸς ἀναβήσεται — «кто это, как река поднимется?»; ὡς ποταμοὶ κυμαίνουσιν ὕδωρ — «как реки волнуют воду» (κυμαίνω — волновать, 波立てる). Вопрос-загадка; ответ в 26:8."
  8: "ὕδατα Αἰγύπτου ὡσεὶ ποταμὸς ἀναβήσεται — «воды Египта, как река, поднимутся». καὶ εἶπεν Ἀναβήσομαι καὶ κατακαλύψω γῆν — «и сказал: поднимусь и покрою землю»: похвальба Египта, поэтому 「…」. ἀπολῶ κατοικοῦντας ἐν αὐτῇ — «погублю живущих в ней»; слав. добавляет «град» (都) — нет в LXX, внесено без 〔…〕."
  9: "ἐπίβητε ἐπὶ τοὺς ἵππους — «садитесь на коней»; παρασκευάσατε τὰ ἅρματα — «приготовьте колесницы» (戦車). οἱ μαχηταὶ Αἰθιόπων — «воины эфиопов» (エチオピア人); Λίβυες καθωπλισμένοι ὅπλοις — «ливийцы, вооружённые» (リビア人); Λυδοί — «лидийцы» (リディア人; слав. «лидяне»); ἀνάβητε ἐντείνατε τόξον — «взойдите, натяните лук» (弓を引け)."
  10: "ἡ ἡμέρα ἐκείνη κυρίῳ τῷ θεῷ ἡμῶν — «день тот Господу Богу нашему»; слав. читает «Господа Бога вседержителя» (παντοκράτορος вместо ἡμῶν) — по паритету взято csl (全能者である主なる神), вариант LXX в notes. ἡμέρα ἐκδικήσεως τοῦ ἐκδικῆσαι — «день отмщения, чтобы отмстить» (復讐の日). καταφάγεται ἡ μάχαιρα κυρίου καὶ ἐμπλησθήσεται καὶ μεθυσθήσεται ἀπὸ τοῦ αἵματος αὐτῶν — «пожрёт меч Господень, насытится и упиётся кровию их». θυσία τῷ κυρίῳ σαβαωθ — «жертва Господу Саваофу» (万軍の主への犠牲); ἀπὸ γῆς βορρᾶ ἐπὶ ποταμῷ Εὐφράτῃ — «в земле северной, при реке Евфрате»."
  11: "ἀνάβηθι, Γαλααδ, καὶ λαβὲ ῥητίνην — «взойди в Галаад и возьми смолу, бальзам» (ῥητίνη — смола, бальзам; слав. «ритину»; 樹脂); τῇ παρθένῳ θυγατρὶ Αἰγύπτου — «деве, дочери Египта» (エジプトの娘、おとめ). εἰς κενὸν ἐπλήθυνας ἰάματά σου — «напрасно умножила врачевания твои» (ἴαμα — лекарство, 薬); ὠφέλεια οὐκ ἔστιν σοί — «пользы нет тебе» (癒しがない)."
  12: "ἤκουσαν ἔθνη φωνήν σου — «услышали народы голос твой»; τῆς κραυγῆς σου ἐπλήσθη ἡ γῆ — «воплем твоим наполнилась земля» (叫び). μαχητὴς πρὸς μαχητὴν ἠσθέντησεν — «сильный с сильным изнемог»; ἐπὶ τὸ αὐτὸ ἔπεσαν ἀμφότεροι — «вместе пали оба»."
  13: "Ἃ ἐλάλησεν κύριος ἐν χειρὶ Ιερεμιου — «что изрёк Господь рукою Иеремии»: новое надписание внутри главы, открывает вторую часть оракула (о приходе Навуходоносора). τοῦ κόψαι τὴν γῆν Αἰγύπτου — «поразить землю Египетскую» (κόπτω — рубить, поражать). Слав. вставка «о сем: яко име приити» передана оборотом «すなわち…来て…撃つことについて»."
  14: "Ἀναγγείλατε εἰς Μάγδωλον — «возвестите в Магдоле» (マグドル); παραγγείλατε εἰς Μέμφιν — «объявите в Мемфисе» (メンフィス). εἴπατε Ἐπίστηθι καὶ ἑτοίμασον — «скажите: стань и приготовься»: короткая прямая речь, 「…」. κατέφαγεν μάχαιρα τὴν σμίλακά σου — «пожрал меч [то, что] вокруг тебя»: σμίλαξ — собств. «плющ, повойник», в LXX тёмное место; слав. «сия, яже окрест тебе суть», поэтому 周りにあるもの. Слав. добавляет «египту» и «во тафнасе поведите» (Тафнес) — нет в LXX, внесено без 〔…〕."
  15: "ὁ Ἆπις — Апис, священный бык Мемфиса (アピス, слав. «апис»); ὁ μόσχος ὁ ἐκλεκτός σου — «телец избранный твой» (選ばれた子牛); οὐκ ἔμεινεν — «не пребыл» (とどまらなかった); ὅτι κύριος παρέλυσεν αὐτόν — «ибо Господь расслабил его» (砕いた). В МТ имя Аписа не названо; держим LXX/csl."
  16: "τὸ πλῆθός σου ἠσθέντησεν καὶ ἔπεσεν — «множество твоё изнемогло и пало». ἕκαστος πρὸς τὸν πλησίον αὐτοῦ ἐλάλει — «каждый говорил ближнему своему»: речь наёмников, поэтому 「…」. Ἀναστῶμεν καὶ ἀναστρέψωμεν πρὸς τὸν λαὸν ἡμῶν εἰς τὴν πατρίδα ἡμῶν — «встанем и возвратимся к народу нашему, в отечество наше» (生まれ故郷). ἀπὸ προσώπου μαχαίρας Ἑλληνικῆς — «от лица меча эллинского» (ギリシアの剣): редкое для Иеремии выражение, повторяется в 27:16; оставлено буквально."
  17: "καλέσατε τὸ ὄνομα Φαραω Νεχαω βασιλέως Αἰγύπτου — «назовите имя фараона Нехао, царя Египта». Далее в LXX стоит транслитерация евр. («шум прошёл, [упущено] время»): Σαων — εσβι — εμωηδ, поэтому имя-прозвище передано по слав. «смятение преведе время» (時を過ぎ去らせた騒ぎ). ru (МТ) даёт смыслом: «фараон… смутился; он пропустил условленное время»."
  18: "ζῶ ἐγώ, λέγει κύριος ὁ θεός — «живу Я, говорит Господь Бог»: клятва, поэтому цитата 「…」. Слав. читает «глаголет Царь, Господь вседержитель имя его»: «Царь» и «имя его» нет в LXX, по паритету внесено (王である主、その名は全能者). ὡς τὸ Ἰταβύριον ἐν τοῖς ὄρεσιν — «как Итавирий (Фавор) в горах» (タボル); ὡς ὁ Κάρμηλος ἐν τῇ θαλάσσῃ — «как Кармил в море» (カルメル); ἥξει — «придёт» (必ず来る)."
  19: "σκεύη ἀποικισμοῦ ποίησον σεαυτῇ — «приготовь себе сосуды переселения» (σκεῦος — 器; ἀποικισμός — переселение, плен; слав. «сосуды пленения»); κατοικοῦσα θύγατερ Αἰγύπτου — «живущая дщерь Египта» (エジプトの娘). Μέμφις εἰς ἀφανισμὸν ἔσται — «Мемфис будет в запустение»; κληθήσεται οὐαὶ — «наречётся „увы“» (слав. «наречется, увы»), поэтому «ああ、わざわい» как имя."
  20: "δάμαλις κεκαλλωπισμένη Αἴγυπτος — «телица украшенная Египет» (雌の子牛); ἀπόσπασμα ἀπὸ βορρᾶ ἦλθεν ἐπ᾽ αὐτήν — «отторжение (отрыв) от севера пришло на неё»: ἀπόσπασμα — «отторгнутое», слав. «разорение», ru «погибель»; в тексте 破滅."
  21: "οἱ μισθωτοὶ αὐτῆς ἐν αὐτῇ — «наёмники её в ней» (雇い人); ὥσπερ μόσχοι σιτευτοὶ τρεφόμενοι — «как тельцы откормленные, вскормленные» (肥えた子牛). ἀπεστράφησαν καὶ ἔφυγον ὁμοθυμαδόν — «обратились и побежали единодушно»; οὐκ ἔστησαν — «не устояли» (立ち止まらなかった). ἡμέρα ἀπωλείας — «день погибели» (滅びの日); καιρὸς ἐκδικήσεως αὐτῶν — «время отмщения их» (罰の時)."
  22: "φωνὴ ὡς ὄφεως συρίζοντος — «голос, как змея шипящего» (συρίζω — шипеть); ἐν ἄμμῳ πορεύσονται — «по песку пойдут» (砂の上を行く). ἐν ἀξίναις ἥξουσιν ἐπ᾽ αὐτὴν ὡς κόπτοντες ξύλα — «с секирами придут на неё, как рубящие дрова» (斧)."
  23: "ἐκκόψουσιν τὸν δρυμὸν αὐτῆς — «вырубят лес (дубраву) её» (δρυμός — лес, 森); λέγει κύριος ὁ θεός — формула внутри стиха, вне кавычек. ὅτι οὐ μὴ εἰκασθῇ — «ибо не [может] быть исчислен» (εἰκάζω — уподоблять, исчислять; 数えきれない); πληθύνει ὑπὲρ ἀκρίδα — «умножились более саранчи» (いなご, 蝗は常用外のため仮名); οὐκ ἔστιν αὐτοῖς ἀριθμός — «нет им числа»."
  24: "κατῃσχύνθη θυγάτηρ Αἰγύπτου — «посрамлена дщерь Египта»; παρεδόθη εἰς χεῖρας λαοῦ ἀπὸ βορρᾶ — «предана в руки народа с севера» (北の民)."
  25: "ἰδοὺ ἐγὼ ἐκδικῶ τὸν Αμων τὸν υἱὸν αὐτῆς — «вот, Я посещу Аммона, сына её»: Αμων — фиванский бог Амон (Но-Амон; ru «который в Но»), «сын её» — тёмное место LXX, оставлено буквально. ἐπὶ Φαραω καὶ ἐπὶ τοὺς πεποιθότας ἐπ᾽ αὐτῷ — «на фараона и на уповающих на него» (信頼する者たち). Слав. добавляет «рече Господь вседержитель, Бог израилев» (внесено: 全能者である主、イスラエルの神は言われる) и «на египет, и на боги его и на цари его» — нет в LXX, внесено без 〔…〕."
  26: "В модуле лакуна («.»). Слав. 46:26: «и дам их в руце ищущих души их, и в руку навуходоносора царя вавилонска, и в руце слуг его: и посем поживут якоже и первее, глаголет Господь» — переведено по слав. без 〔…〕; этим закрывается слово Господа, открытое в 26:25. Обетование о восстановлении Египта — ср. Иез 29:13–14; Ис 19:22."
  27: "σὺ δὲ μὴ φοβηθῇς, δοῦλός μου Ιακωβ — «ты же не убойся, раб Мой Иаков»: обычная для Иеремии формула утешения (ср. 36:27–28 = слав. 30:10–11; 46:27–28 = слав. 39:27–28). ἀναστρέψει Ιακωβ καὶ ἡσυχάσει καὶ ὑπνώσει — «возвратится Иаков и успокоится и уснёт»; οὐκ ἔσται ὁ παρενοχλῶν αὐτόν — «не будет докучающего ему». Слав. добавляет «и благоуспеет» (栄え) — нет в LXX, внесено без 〔…〕."
  28: "μὴ φοβοῦ, παῖς μου Ιακωβ — «не бойся, отрок (раб) Мой Иаков» (παῖς — раб, отрок); μετὰ σοῦ ἐγώ εἰμι — «Я с тобою». ποιήσω συντέλειαν ἐν παντὶ ἔθνει — «сотворю конец во всяком народе» (全き終わり); σὲ δὲ οὐ μὴ ποιήσω ἐκλιπεῖν — «тебя же не сделаю оскудевать» (絶やしはしない). παιδεύσω σε εἰς κρίμα — «накажу тебя в суд (по правде)» (正しく懲らしめる); ἀθῷον οὐκ ἀθῳώσω σε — «невинным не оставлю тебя» (罰を免れさせない)."
