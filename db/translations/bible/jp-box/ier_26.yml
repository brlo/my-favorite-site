# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 26 = слав./ru 46: оракул о Египте, войске фараона Нехао, поражённом при
# Кархамисе. 1 надписание ко всей группе оракулов о народах; 2 заголовок о Египте;
# 3–12 гибель войска при Евфрате: оружие, отступление, воды Египта, наёмники,
# бальзам Галаада; 13–26 второе слово — приход Навуходоносора: Магдол, Мемфис,
# Тафнес, Апис, исход наёмников, вырубка «леса» Египта, Амон и фараон;
# 27–28 утешение Иакову (Я с тобою).
# Голоса: текст — пророческое слово о Египте и обращение к нему, без общих кавычек
# (как в Ис 13–23); в 「…」 даны только прямая речь: 26:8 (похвальба Египта),
# 26:16 (слова наёмников), 26:17 (имя-прозвище фараона), 26:18 (клятва Господа),
# 26:25–26 (слово Господа: «вот, Я посещу…», закрывается в конце 26:26);
# 26:14 «стань и приготовься» — короткая речь внутри стиха, тоже в 「…」.
# Нумерация по gr: 28 стихов; у слав. 46 тоже 28, номера совпадают стих в стих
# (gr 26:N = слав. 46:N). «Точки» модуля: 26:1 и 26:26 — переведены по слав.
# (надписание и конец оракула), в notes оговорено «в модуле лакуна».
# 〔…〕 нет. Слав. добавления внесены в основной текст без скобок и оговорены:
# 26:2 «сына Иосиина», 26:8 «град», 26:10 «вседержителя» (в LXX «Бога нашего»),
# 26:14 «Египту» и «в Тафнесе», 26:18 «Царь» и «имя его», 26:21 «благоуспеет»,
# 26:25 «Господь вседержитель, Бог Израилев» и «на Египет, богов его и царей его»,
# 26:28 — нет. Сносок ⟨…⟩ нет: 剣, 盾, 鎧, 兜, 戦車, 弓, 犠牲, 祭壇 уже в корпусе.
