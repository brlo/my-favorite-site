verses:
  1: "イエスはまた、湖[みずうみ]の岸[きし]で教[おし]え始[はじ]められた。すると、おびただしい群衆[ぐんしゅう]が集[あつ]まって来[き]たので、イエスは舟[ふね]に乗[の]って湖[みずうみ]の上[うえ]に腰[こし]を下[お]ろされた。群衆[ぐんしゅう]は皆[みな]、湖[みずうみ]に沿[そ]った陸[りく]の上[うえ]にいた。"
  2: "イエスは多[おお]くのことをたとえで教[おし]え、その教[おし]えの中[なか]で彼[かれ]らに言[い]われた。"
  3: "「<j>聞[き]きなさい。見[み]よ、種[たね]を蒔[ま]く者[もの]が蒔[ま]きに出[で]て来[き]た。</j>"
  4: "<j>蒔[ま]いていると、ある種[たね]は道端[みちばた]に落[お]ち、空[そら]の鳥[とり]が来[き]て食[た]べてしまった。</j>"
  5: "<j>ほかの種[たね]は岩[いわ]の多[おお]い所[ところ]に落[お]ちた。土[つち]が少[すく]なかったので、すぐに芽[め]を出[だ]した。</j>"
  6: "<j>しかし、日[ひ]が上[のぼ]ると焼[や]かれ、根[ね]が張[は]っていないので枯[か]れてしまった。</j>"
  7: "<j>ほかの種[たね]は茨[いばら]の中[なか]に落[お]ちた。茨[いばら]が伸[の]びてふさぎ、実[み]を結[むす]ばなかった。</j>"
  8: "<j>ほかの種[たね]は良[よ]い地[ち]に落[お]ち、育[そだ]って伸[の]び、実[み]を結[むす]んだ。三十倍[さんじゅうばい]、六十倍[ろくじゅうばい]、百倍[ひゃくばい]の実[み]を結[むす]んだのである。</j>」"
  9: "そして言[い]われた。「<j>耳[みみ]のある者[もの]は聞[き]きなさい。</j>」"
  10: "イエスが一人[ひとり]になられると、そばにいた者[もの]たちが十二人[じゅうににん]と一緒[いっしょ]に、たとえについて尋[たず]ねた。"
  11: "イエスは言[い]われた。「<j>あなたがたには神[かみ]の国[くに]の秘密[ひみつ]が与[あた]えられている。しかし、外[そと]の者[もの]たちには、すべてがたとえで語[かた]られる。</j>"
  12: "<j>見[み]るには見[み]るが決[けっ]して見[み]えず、聞[き]くには聞[き]くが決[けっ]して悟[さと]らない。彼[かれ]らが立[た]ち帰[かえ]って、〔罪[つみ]が〕赦[ゆる]されることのないように。</j>」"
  13: "また言[い]われた。「<j>このたとえが分[わ]からないのか。そうしたら、どうしてほかのすべてのたとえが分[わ]かるだろうか。</j>"
  14: "<j>種[たね]を蒔[ま]く者[もの]は、御言葉[みことば]を蒔[ま]くのである。</j>"
  15: "<j>道端[みちばた]とは、御言葉[みことば]が蒔[ま]かれる所[ところ]である。人々[ひとびと]がそれを聞[き]くとすぐ、サタンが来[き]て、彼[かれ]らの中[なか]に蒔[ま]かれた御言葉[みことば]を奪[うば]ってしまう。</j>"
  16: "<j>同[おな]じように、岩[いわ]の多[おお]い所[ところ]に蒔[ま]かれた者[もの]たちは、御言葉[みことば]を聞[き]くとすぐ、喜[よろこ]んでそれを受[う]け入[い]れる。</j>"
  17: "<j>しかし、自分[じぶん]の中[なか]に根[ね]がないので、しばらくの間[あいだ]だけで、御言葉[みことば]のために苦難[くなん]や迫害[はくがい]が降[ふ]りかかると、すぐにつまずいてしまう。</j>"
  18: "<j>ほかに、茨[いばら]の中[なか]に蒔[ま]かれた者[もの]たちがいる。これは、御言葉[みことば]を聞[き]いても、</j>"
  19: "<j>この世[よ]の心配[しんぱい]ごとや富[とみ]の誘[さそ]い、そのほかいろいろな欲[よく]が入[はい]り込[こ]んで御言葉[みことば]をふさぎ、実[み]を結[むす]ばない者[もの]のことである。</j>」"
  20: "「<j>良[よ]い地[ち]に蒔[ま]かれた者[もの]たちとは、御言葉[みことば]を聞[き]いて受[う]け入[い]れ、三十倍[さんじゅうばい]、六十倍[ろくじゅうばい]、百倍[ひゃくばい]の実[み]を結[むす]ぶ人々[ひとびと]のことである。</j>」"
  21: "また言[い]われた。「<j>ともし火[び]を持[も]ち込[こ]むのは、升[ます]の下[した]や寝床[ねどこ]の下[した]に据[す]えるためか。燭台[しょくだい]の上[うえ]に据[す]えるためではないか。</j>"
  22: "<j>隠[かく]れているものは明[あき]らかにされるためであり、秘[ひ]められているものは表[おもて]に出[で]るためである。</j>"
  23: "<j>耳[みみ]のある者[もの]は聞[き]きなさい。</j>」"
  24: "また言[い]われた。「<j>何[なに]を聞[き]くか、よく注意[ちゅうい]しなさい。あなたがたが量[はか]るその秤[はかり]で、あなたがたにも量[はか]られ、さらに加[くわ]えられる。</j>"
  25: "<j>持[も]っている者[もの]には、さらに与[あた]えられる。持[も]っていない者[もの]は、持[も]っているものまで取[と]り上[あ]げられる。</j>」"
  26: "また言[い]われた。「<j>神[かみ]の国[くに]は、人[ひと]が地[ち]に種[たね]を蒔[ま]くようなものである。</j>"
  27: "<j>夜[よる]は寝[ね]て、昼[ひる]は起[お]きているうちに、種[たね]は芽[め]を出[だ]して育[そだ]つが、その人[ひと]はどうしてそうなるのか知[し]らない。</j>"
  28: "<j>地[ち]はひとりでに実[み]を結[むす]ぶ。まず若芽[わかめ]、次[つぎ]に穂[ほ]、やがて穂[ほ]の中[なか]に麦[むぎ]が実[みの]る。</j>"
  29: "<j>実[み]が熟[じゅく]すると、すぐに鎌[かま]を入[い]れる。刈[か]り入[い]れの時[とき]が来[き]たからである。</j>」"
  30: "また言[い]われた。「<j>神[かみ]の国[くに]を何[なに]にたとえようか。どんなたとえで表[あらわ]そうか。</j>"
  31: "<j>からし種[だね]のようなものである。地[ち]に蒔[ま]かれるとき、地上[ちじょう]のどんな種[たね]よりも小[ちい]さい。</j>"
  32: "<j>しかし、蒔[ま]かれると育[そだ]ち、どの野菜[やさい]よりも大[おお]きくなって、大[おお]きな枝[えだ]を広[ひろ]げ、空[そら]の鳥[とり]がその木[き]の陰[かげ]に巣[す]を作[つく]るほどになる。</j>」"
  33: "イエスはこのような多[おお]くのたとえで、彼[かれ]らが聞[き]けるのに応[おう]じて御言葉[みことば]を語[かた]られた。"
  34: "たとえを使[つか]わずに語[かた]ることはなさらなかった。しかし、弟子[でし]たちだけになったところで、すべてを解[と]き明[あ]かされた。"
  35: "その日[ひ]、夕方[ゆうがた]になると、イエスは弟子[でし]たちに言[い]われた。「<j>向[む]こう岸[ぎし]へ渡[わた]ろう。</j>」"
  36: "弟子[でし]たちは群衆[ぐんしゅう]をそのままにして、舟[ふね]にいたイエスを舟[ふね]ごと連[つ]れて出[で]た。ほかにも舟[ふね]が何艘[なんそう]か一緒[いっしょ]だった。"
  37: "ところが、激[はげ]しい突風[とっぷう]が吹[ふ]き始[はじ]め、波[なみ]が舟[ふね]の中[なか]に打[う]ち込[こ]んで、舟[ふね]は今[いま]にも沈[しず]みそうになった。"
  38: "イエスは舟尾[ふなお]で枕[まくら]に頭[あたま]を置[お]いて眠[ねむ]っておられた。弟子[でし]たちはイエスを起[お]こして言[い]った。「先生[せんせい]。わたしたちが沈[しず]んでしまっても、どうでもよいのですか。」"
  39: "イエスは起[お]き上[あ]がり、風[かぜ]をお叱[しか]りになり、湖[みずうみ]に言[い]われた。「<j>黙[だま]れ。静[しず]まれ。</j>」すると、風[かぜ]はやみ、大[おお]きな凪[なぎ]になった。"
  40: "そして弟子[でし]たちに言[い]われた。「<j>なぜ怖[こわ]がるのか。まだ信仰[しんこう]がないのか。</j>」"
  41: "弟子[でし]たちはひどく恐[おそ]れ、互[たが]いに言[い]った。「いったいこの方[かた]はどなたなのだろう。風[かぜ]も湖[みずうみ]もこの方[かた]に従[したが]うとは。」"

notes:
  1: "πλεῖστος — «весьма многочисленный»; おびただしい. ὥστε … καθῆσθαι ἐν τῇ θαλάσσῃ — «так что Он сел в море»; 湖の上に腰を下ろされた."
  2: "ἐν παραβολαῖς πολλά — «в притчах многое»; 多くのことをたとえで."
  8: "Порядок у Марка: тридцать, шестьдесят, сто (у Матфея обратный). Сохранён порядок Марка. ἀναβαίνοντα καὶ αὐξανόμενα — «восходящий и возрастающий»; 育って伸び."
  9: "Формула ὁ ἔχων ὦτα ἀκούειν ἀκουέτω — 耳のある者は聞きなさい (в Мф 13:9 — 聞く耳を持つ者は)."
  11: "τὸ μυστήριον — 秘密 (не 機密, чтобы не путать с таинством). τοῖς ἔξω — «внешним»; 外の者たち."
  12: "Цитата Ис 6:9–10. В критическом тексте ἀφεθῇ αὐτοῖς без дополнения; Церковь читает τὰ ἁμαρτήματα (Елизаветинская «оставятся им греси», jp-joc 「其の罪の赦されん」) — 〔罪が〕. μήποτε — «как бы не», оставлено придаточным цели."
  15: "ὁ λόγος — 御言葉, как в Мф 13. αἴρει — «уносит»; 奪ってしまう."
  19: "αἱ μέριμναι τοῦ αἰῶνος — «заботы века»; この世の心配ごと. ἀπάτη τοῦ πλούτου — «обман богатства»; 富の誘い."
  21: "μόδιος — римская мера, около 8,7 л; 升. κλίνη — 寝床 (не 寝台: 寝台 оставлено за κράβαττος в гл. 2). τεθῇ — 据える, ἔρχεται ὁ λύχνος — 持ち込む."
  22: "κρυπτόν … ἀπόκρυφον — «скрытое … тайное»; 隠れているもの / 秘められているもの."
  24: "ἐν ᾧ μέτρῳ μετρεῖτε — «какой мерой мерите»; 量るその秤で. Страдательный залог сохранён: 量られ."
  26: "ὡς ἄνθρωπος βάλῃ τὸν σπόρον — «как человек бросит семя»; 人が地に種を蒔くようなもの."
  28: "αὐτομάτη ἡ γῆ καρποφορεῖ — «земля сама собой приносит плод»; 地はひとりでに実を結ぶ. χόρτος — 若芽."
  29: "δρέπανον — серп; 鎌."
  31: "κόκκος σινάπεως — からし種. Сноску не ставил: слово понятно (в Мф 13:31 её тоже нет)."
  36: "ὡς ἦν ἐν τῷ πλοίῳ — «как был, в лодке»; 舟ごと連れて."
  37: "λαῖλαψ — «вихрь, буря»; 激しい突風."
  38: "ἐπὶ τὸ προσκεφάλαιον — «на подушке»; 枕に頭を置いて. οὐ μέλει σοι — «Тебе нет дела»; どうでもよいのですか. Слова учеников — не красным."
  39: "Σιώπα, πεφίμωσο — «умолкни, замолчи»; 黙れ。静まれ. Слова обращены к ветру и морю, но это слова Христа — красным."
  41: "φόβον μέγαν — «страхом великим»; ひどく恐れ. Слова учеников — не красным."
