verses:
  0: "指揮者[しきしゃ]に。聖[せい]なる者[もの]たちから遠[とお]く離[はな]れた民[たみ]のために。ダビデの詩[うた]、碑[ひ]文[ぶん]として。ペリシテ人[じん]が彼[かれ]をガテで捕[と]らえたとき。"
  1: "主[しゅ]よ、わたしをあわれんでください。人[ひと]がわたしを踏[ふ]みにじり、日[ひ]中[なか]、戦[たたか]いながらわたしを苦[くる]しめている。"
  2: "敵[てき]は日[ひ]中[なか]、わたしを踏[ふ]みにじる。高[たか]い所[ところ]からわたしと戦[たたか]う者[もの]は多[おお]い。"
  3: "わたしが恐[おそ]れる日[ひ]には、あなたに望[のぞ]みを置[お]く。"
  4: "神[かみ]によって、わたしは日[ひ]中[なか]、わたしの言葉[ことば]をほめたたえる。神[かみ]に望[のぞ]みを置[お]いたので、わたしは恐[おそ]れない。肉[にく]がわたしに何[なに]をなしえようか。"
  5: "彼[かれ]らは日[ひ]中[なか]、わたしの言葉[ことば]を忌[い]み嫌[きら]い、その思[おも]いのすべてはわたしに悪[あく]を企[くわだ]てる。"
  6: "彼[かれ]らは寄[き]留[りゅう]して身[み]を隠[かく]し、わたしのかかとをうかがい、わたしの命[いのち]を狙[ねら]って待[ま]ち構[かま]える。"
  7: "神[かみ]よ、あなたは彼[かれ]らをいたずらに救[すく]われるのか。怒[いか]りのうちに、諸国[しょこく]の民[たみ]を倒[たお]されるのか。"
  8: "わたしの生[い]き方[かた]を、わたしはあなたに告[つ]げた。あなたはわたしの涙[なみだ]を、ご自分[じぶん]の前[まえ]に置[お]かれた。それは、あなたの約束[やくそく]のうちにもある。"
  9: "わたしがあなたを呼[よ]び求[もと]める日[ひ]には、敵[てき]は後[うし]ろへ退[しりぞ]く。見[み]よ、わたしは知[し]った。あなたはわたしの神[かみ]である。"
  10: "神[かみ]によって、わたしは御告[みつ]げをほめたたえ、主[しゅ]によって、わたしは御言葉[みことば]をほめたたえる。"
  11: "神[かみ]に望[のぞ]みを置[お]いた。わたしは恐[おそ]れない。人[ひと]がわたしに何[なに]をなしえようか。"
  12: "神[かみ]よ、あなたにささげるわたしの誓[ちか]いはわたしのうちにあり、わたしは賛美[さんび]をもってそれをあなたに返[かえ]す。"
  13: "あなたはわたしの魂[たましい]を死[し]から、わたしの足[あし]を滑[すべ]りから救[すく]い出[だ]された。それは、わたしが神[かみ]の御前[みまえ]で、生[い]ける者[もの]の光[ひかり]のうちに、神[かみ]に喜[よろこ]ばれて歩[あゆ]むためである。"

notes:
  0: "Εἰς τὸ τέλος, ὑπὲρ τοῦ λαοῦ τοῦ ἀπὸ τῶν ἁγίων μεμακρυμμένου· τῷ Δαυιδ εἰς στηλογραφίαν, ὁπότε ἐκράτησαν αὐτὸν οἱ ἀλλόφυλοι ἐν Γεθ — 指揮者に。聖なる者たちから遠く離れた民のために。ダビデの詩、碑文として。ペリシテ人が彼をガテで捕らえたとき. στηλογραφία — «столпописание», надпись на памятном столпе (евр. miktam); у jp-joc это место передано иначе (по евр. «о голуби немотствующем»), здесь — по греч. ἀλλόφυλοι — ペリシテ人; Γεθ — ガテ."
  1: "Ἐλέησόν με, κύριε, ὅτι κατεπάτησέν με ἄνθρωπος — 主よ、わたしをあわれんでください、人が踏みにじるので (καταπατέω — «попирать»). ὅλην τὴν ἡμέραν πολεμῶν ἔθλιψέν με — 日中、戦いながら苦しめている (θλίβω — «теснить»)."
  2: "κατεπάτησάν με οἱ ἐχθροί μου ὅλην τὴν ἡμέραν — 敵は日中わたしを踏みにじる. ὅτι πολλοὶ οἱ πολεμοῦντές με ἀπὸ ὕψους — 高い所からわたしと戦う者は多い (ἀπὸ ὕψους — «с высоты»; место тёмное, у jp-joc «至上者よ»)."
  3: "ἡμέρας φοβηθήσομαι, ἐγὼ δὲ ἐπὶ σοὶ ἐλπιῶ — わたしが恐れる日には、あなたに望みを置く (ἐλπίζω ἐπί — «надеяться на»)."
  4: "ἐν τῷ θεῷ ἐπαινέσω τοὺς λόγους μου — 神によって、わたしの言葉をほめたたえる (ἐπαινέω — «хвалить»; слав. «о Бозе похвалю словеса моя»). ἐπὶ τῷ θεῷ ἤλπισα, οὐ φοβηθήσομαι — 神に望みを置いたので、恐れない. τί ποιήσει μοι σάρξ — 肉がわたしに何をなしえようか (σάρξ — 肉, как в 56:4 и 64:2)."
  5: "τοὺς λόγους μου ἐβδελύσσοντο — わたしの言葉を忌み嫌い (βδελύσσομαι — «гнушаться»). κατ᾽ ἐμοῦ πάντες οἱ διαλογισμοὶ αὐτῶν εἰς κακόν — その思いのすべてはわたしに悪を企てる (διαλογισμός — «помышление»)."
  6: "παροικήσουσιν καὶ κατακρύψουσιν — 寄留して身を隠し (παροικέω — «жить пришлым»; κατακρύπτω — «скрываться»). τὴν πτέρναν μου φυλάξουσιν — かかとをうかがい (πτέρνα — «пята»). καθάπερ ὑπέμειναν τὴν ψυχήν μου — 命を狙って待ち構える (ὑπομένω — «поджидать»)."
  7: "ὑπὲρ τοῦ μηθενὸς σώσεις αὐτούς — 彼らをいたずらに救われるのか (ὑπὲρ τοῦ μηθενός — «ни за что», место тёмное; у jp-joc «не избегнут ли возмездия»). ἐν ὀργῇ λαοὺς κατάξεις — 怒りのうちに諸国の民を倒される (κατάγω — «низводить»)."
  8: "τὴν ζωήν μου ἐξήγγειλά σοι — わたしの生き方を告げた (ἐξαγγέλλω — «возвещать»; слав. «житие мое»). ἔθου τὰ δάκρυά μου ἐνώπιόν σου — 涙をご自分の前に置かれた. ὡς καὶ ἐν τῇ ἐπαγγελίᾳ σου — それはあなたの約束のうちにもある (ἐπαγγελία — «обещание»)."
  9: "ἐπιστρέψουσιν οἱ ἐχθροί μου εἰς τὰ ὀπίσω — 敵は後ろへ退く (εἰς τὰ ὀπίσω — «назад»). ἐν ᾗ ἂν ἡμέρᾳ ἐπικαλέσωμαί σε — あなたを呼び求める日には. ἰδοὺ ἔγνων ὅτι θεός μου εἶ σύ — 見よ、わたしは知った、あなたはわたしの神である."
  10: "ἐπὶ τῷ θεῷ αἰνέσω ῥῆμα, ἐπὶ τῷ κυρίῳ αἰνέσω λόγον — 神によって御告げを、主によって御言葉をほめたたえる. ῥῆμα и λόγος различаются: 御告げ (изречение) и 御言葉; по-японски различие проведено, как в слав. «словеса»/«слово»."
  11: "ἐπὶ τῷ θεῷ ἤλπισα, οὐ φοβηθήσομαι — 神に望みを置いた、恐れない. τί ποιήσει μοι ἄνθρωπος — 人がわたしに何をなしえようか (ср. ст. 4: σάρξ — 肉, здесь ἄνθρωπος — 人; различие сохранено)."
  12: "ἐν ἐμοί, ὁ θεός, αἱ εὐχαὶ ἃς ἀποδώσω αἰνέσεώς σοι — 神よ、あなたにささげる誓いはわたしのうちにあり、賛美をもって返す (εὐχή — «обет»; ἀποδίδωμι — «воздавать»). Место тёмное; у jp-joc «誓いは我に在り、讚美を以て償はん»."
  13: "ὅτι ἐρρύσω τὴν ψυχήν μου ἐκ θανάτου — 魂を死から救い出された. τοὺς πόδας μου ἐξ ὀλισθήματος — 足を滑りから (ὀλίσθημα — «скольжение, падение»); в церковном чтении здесь ещё «очи мои от слёз», в gr-lxx-byz этих слов нет — не добавлено. τοῦ εὐαρεστῆσαι ἐνώπιον τοῦ θεοῦ — 神に喜ばれて歩むため (εὐαρεστέω — «быть угодным»). ἐν φωτὶ ζώντων — 生ける者の光のうちに."
