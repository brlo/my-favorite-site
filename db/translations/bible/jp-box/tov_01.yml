verses:
  1: "トビトの言葉[ことば]の書[しょ]。トビトはトビエルの子[こ]、アナニエルの子[こ]、アドエルの子[こ]、ガバエルの子[こ]であり、アシエルの血筋[ちすじ]に連[つら]なり、ナフタリの部族[ぶぞく]の者[もの]である。"
  2: "この者[もの]は、アッシリアの王[おう]エネメッサルの時代[じだい]に、ティスベから捕囚[ほしゅう]された。ティスベは、ナフタリのキディオスの右方[うほう]、ガリラヤのアセルより上[うえ]にある。"
  3: "わたしはトビト。わたしは生涯[しょうがい]、真理[しんり]と義[ぎ]の道[みち]を歩[あゆ]み、アッシリアの国[くに]、ニネベへわたしとともに行[い]った兄弟[きょうだい]たちと、わたしの民[たみ]とに、多[おお]くの施[ほどこ]しをした。"
  4: "わたしがまだ若[わか]かったころ、自分[じぶん]の国[くに]、イスラエルの地[ち]にいたとき、父[ちち]の部族[ぶぞく]であるナフタリの全部族[ぜんぶぞく]は、エルサレムの家[いえ]から離[はな]れ去[さ]っていた。エルサレムは、すべての部族[ぶぞく]が犠牲[ぎせい]をささげるために、イスラエルのすべての部族[ぶぞく]のうちから選[えら]ばれた都[みやこ]である。そして、いと高[たか]い神[かみ]の住[す]まいの神殿[しんでん]は聖[せい]とされ、世[よ]のすべての代[よ]にわたって建[た]てられた。"
  5: "ともに離反[りはん]したすべての部族[ぶぞく]は、バアル、すなわち若[わか]い雌[めす]牛[うし]に犠牲[ぎせい]をささげていた。父[ちち]の家[いえ]であるナフタリの家[いえ]もまた、そうであった。"
  6: "しかし、わたしだけは何度[なんど]も、祭[まつ]りのたびにエルサレムへ行[い]き、すべてのイスラエルに永遠[えいえん]の定[さだ]めとして書[か]かれているとおり、実[みの]りの初穂[はつほ]と十分[じゅうぶん]の一[いち]、羊[ひつじ]の毛[け]の初[はつ]刈[が]りを携[たずさ]えていた。"
  7: "わたしはそれらを、すべての実[みの]りのうちから祭壇[さいだん]のために、アロンの子[こ]らである祭司[さいし]たちに与[あた]えた。すべての実[みの]りの十分[じゅうぶん]の一[いち]を、エルサレムで務[つと]めをするレビの子[こ]らに与[あた]えた。また、第二[だいに]の十分[じゅうぶん]の一[いち]は売[う]り、毎年[まいとし]エルサレムへ行[い]って、それを費[つい]やした。"
  8: "第三[だいさん]の十分[じゅうぶん]の一[いち]は、しかるべき者[もの]たちに与[あた]えた。父[ちち]の母[はは]であるデボラがわたしに命[めい]じたとおりである。わたしは父[ちち]を失[うしな]って孤児[みなしご]となったからである。"
  9: "一人前[いちにんまえ]の男[おとこ]になったとき、わたしは自分[じぶん]の氏族[しぞく]の血筋[ちすじ]からアンナを妻[つま]に迎[むか]え、彼女[かのじょ]からトビアをもうけた。"
  10: "ニネベへ捕囚[ほしゅう]となったとき、わたしの兄弟[きょうだい]たちも、わたしの一族[いちぞく]の者[もの]たちもみな、異邦人[いほうじん]のパンを食[た]べていた。"
  11: "しかし、わたしは自分[じぶん]の魂[たましい]を守[まも]って、それを食[た]べなかった。"
  12: "わたしは魂[たましい]を尽[つ]くして神[かみ]を覚[おぼ]えていたからである。"
  13: "いと高[たか]い神[かみ]は、エネメッサルの前[まえ]でわたしに{恵[めぐ]み|恩寵[おんちょう]}と美[うつく]しさを与[あた]え、わたしは彼[かれ]の買[か]い付[つ]け人[にん]となった。"
  14: "わたしはメディアへ行[い]き、メディアのラゲスで、ガブリの兄弟[きょうだい]ガバエルに銀[ぎん]十タラントを預[あず]けた。"
  15: "エネメッサルが死[し]ぬと、その子[こ]センナケリブが彼[かれ]に代[か]わって王[おう]となった。彼[かれ]の道[みち]は定[さだ]まらなくなったので、わたしはもはやメディアへ行[い]くことができなかった。"
  16: "エネメッサルの時代[じだい]には、わたしは兄弟[きょうだい]たちに多[おお]くの施[ほどこ]しをしていた。"
  17: "わたしは飢[う]えた者[もの]たちに自分[じぶん]のパンを与[あた]え、裸[はだか]の者[もの]たちに自分[じぶん]の衣服[いふく]を与[あた]えた。また、自分[じぶん]の一族[いちぞく]の者[もの]が死[し]んでニネベの城壁[じょうへき]の外[そと]に捨[す]てられているのを見[み]るたびに、その人[ひと]を葬[ほうむ]った。"
  18: "また、センナケリブ王[おう]がユダヤから逃[に]げて来[き]たとき、彼[かれ]が殺[ころ]した者[もの]たちを、わたしはこっそり葬[ほうむ]った。彼[かれ]は怒[いか]りで多[おお]くの者[もの]を殺[ころ]したからである。王[おう]はその遺体[いたい]を探[さが]させたが、見[み]つからなかった。"
  19: "ところが、ニネベの者[もの]の一人[ひとり]が王[おう]のもとへ行[い]き、わたしが彼[かれ]らを葬[ほうむ]っていることを告[つ]げた。そこで、わたしは身[み]を隠[かく]した。わたしが殺[ころ]されようとしていることを知[し]り、恐[おそ]れてそこを去[さ]った。"
  20: "そして、わたしのすべての財産[ざいさん]は奪[うば]い取[と]られ、妻[つま]のアンナと子[こ]のトビアのほかには、何[なに]もわたしに残[のこ]らなかった。"
  21: "五十日もたたないうちに、彼[かれ]の二人[ふたり]の子[こ]らが彼[かれ]を殺[ころ]し、アララトの山[やま]々[やま]へ逃[に]げた。そして、彼[かれ]の子[こ]サヘルドンが彼[かれ]に代[か]わって王[おう]となった。サヘルドンは、わたしの兄弟[きょうだい]の子[こ]であるアナエルの子[こ]アヒカルを、その王国[おうこく]のすべての会計[かいけい]と、すべての行政[ぎょうせい]の上[うえ]に任[まか]せた。"
  22: "アヒカルはわたしのために願[ねが]い出[で]てくれたので、わたしはニネベへ戻[もど]ることができた。アヒカルは酌人[くみびと]であり、指輪[ゆびわ]を預[あず]かる者[もの]、務[つと]めを司[つかさど]る者[もの]、会計[かいけい]を司[つかさど]る者[もの]であった。サヘルドンは彼[かれ]を第二[だいに]の位[くらい]に立[た]てた。彼[かれ]はわたしの親族[しんぞく]であった。"

notes:
  1: "Βίβλος λόγων Τωβιτ — «книга слов Товита», обычное надписание (слав. «Книга словес товита»). Далее цепь родительных: τοῦ Τωβιηλ τοῦ Ανανιηλ τοῦ Αδουηλ τοῦ Γαβαηλ — Товиил, Ананиил, Адуил, Гаваил (слав. «сына товиилева…»); ἐκ τοῦ σπέρματος Ασιηλ — из семени Асиила; ἐκ τῆς φυλῆς Νεφθαλιμ — из племени Неффалима. Имена даны в транслитерации LXX (トビエル, アナニエル, アドエル, ガバエル, アシエル)."
  2: "ᾐχμαλωτεύθη — «был отведён в плен» (αἰχμαλωτεύω); слав. «пленен бе». Ἐνεμεσσαρος — Енемессар, ассирийский царь (в 1:15 его сын Сеннахирим), он же Салманассар ассирийских источников. Θισβη — Фисва (ティスベ); ἐκ δεξιῶν Κυδιως τῆς Νεφθαλιμ — «справа от Кидия Неффалимова» (слав. «одесную кидиа неффалимля»), ὑπεράνω Ασηρ — «выше Асира»."
  3: "Ἐγὼ Τωβιτ — «я, Товит»: здесь начинается рассказ от первого лица. ὁδοῖς ἀληθείας ἐπορευόμην καὶ δικαιοσύνης — «ходил путями истины и правды». ἐλεημοσύνας πολλὰς ἐποίησα — «сотворил многие милостыни», 施し. В csl этот зачин стоит в конце 1:2 («Аз товит путем истины ходих и правды вся дни живота моего»), поэтому здесь он не повторён."
  4: "ἀπέστη ἀπὸ τοῦ οἴκου Ιεροσολύμων — «отступило от дома Иерусалима»: ὁ οἶκος здесь — храм в Иерусалиме (слав. «дом Иерусалимль»); τῆς ἐκλεγείσης ἀπὸ πασῶν τῶν φυλῶν Ισραηλ — «избранного из всех колен Израиля» (согласовано с Ιερουσαλημ, слав. «избраннаго от колен израилевых»). εἰς τὸ θυσιάζειν πάσας τὰς φυλάς — «чтобы приносить жертвы всем коленам». ἡγιάσθη ὁ ναὸς τῆς κατασκηνώσεως τοῦ ὑψίστου — «освящён был храм обитания Всевышнего»."
  5: "ἔθυον τῇ Βααλ τῇ δαμάλει — «приносили жертвы Ваалу, юнице»: дательный приложения при Βααλ (слав. «ваалове юнице»), отсюда バアル、すなわち若い雌牛. δάμαλις — молодая корова, телица. καὶ ὁ οἶκος Νεφθαλιμ τοῦ πατρός μου — «и дом Неффалима, отца моего»: сказуемое опущено (он тоже приносил жертвы)."
  6: "πλεονάκις — «многократно» (слав. «многажды»). ἐν προστάγματι αἰωνίῳ — «повелением вечным». τὰς ἀπαρχὰς καὶ τὰς δεκάτας τῶν γενημάτων — начатки и десятины плодов. τὰς πρωτοκουρίας — «первострижения» (слав.), т.е. первая стрижка овец, начатки шерсти (ru «начатки шерсти овец»); в тексте 羊の毛の初刈り."
  7: "ἐδίδουν — имперфект, «давал» (повторяющееся действие). πρὸς τὸ θυσιαστήριον πάντων τῶν γενημάτων — буквально «к жертвеннику всех произведений», т.е. от плодов для жертвенника. ἀπεπρατιζόμην — «продавал» (ἀποπρατίζομαι, редкая форма имперфекта). δευτέρα δεκάτη — вторая десятина, которую тратили в Иерусалиме (ср. Втор 14:22–27)."
  8: "τὴν τρίτην — «третью [десятину]»: слово δεκάτη опущено (ср. Втор 14:28–29; 26:12 — десятина для сирот, вдов и пришельцев). οἷς καθῆκει — «кому подобает» (καθήκω). ἡ μήτηρ τοῦ πατρός μου — «мать отца моего», бабка, Девора. ὀρφανὸς κατελείφθην — «я остался сиротою» (καταλείπω)."
  9: "ἐγενόμην ἀνήρ — «стал мужем», т.е. возмужал. ἐκ τοῦ σπέρματος τῆς πατριᾶς ἡμῶν — «из семени отечества нашего» (πατριά — род, 氏族). ἐγέννησα ἐξ αὐτῆς Τωβιαν — «родил от неё Товию»."
  10: "ᾐχμαλωτίσθην — «я был отведён в плен», единственное число; слав. «пленени быхом» — множественное, в японском число не выражено. ἄρτων τῶν ἐθνῶν — «хлебов язычников», т.е. пищи, нечистой по закону; слав. «хлебов языческих»."
  11: "συνετήρησα τὴν ψυχήν μου μὴ φαγεῖν — буквально «соблюл душу мою, чтобы не есть» (συντηρέω); слав. «соблюдох душу мою еже не ясти». Стих продолжает мысль 1:10."
  12: "καθότι — «так как, потому что». ἐμεμνήμην τοῦ θεοῦ ἐν ὅλῃ τῇ ψυχῇ μου — «помнил Бога всею душою моею» (слав. «памятствовах»)."
  13: "ὁ ὕψιστος — Всевышний (いと高い神). ἔδωκεν χάριν καὶ μορφὴν ἐνώπιον Ενεμεσσαρου — «дал благодать и доброту пред Енемессаром» (χάρις — милость (в тексте калька {恵み|恩寵}), μορφή — облик; слав. «благодать и доброту»). ἀγοραστής — «закупщик, поставщик» (слав. «купец»)."
  14: "παρεθέμην — «отдал на хранение» (παρατίθημι). Γαβαηλ τῷ ἀδελφῷ Γαβρια — Гаваил, брат Гаврия (слав. «гаваилу брату гавриеву»). ἐν Ραγοις τῆς Μηδίας — в Рагах Мидийских (ラゲス). ἀργυρίου τάλαντα δέκα — десять талантов серебра."
  15: "ἠκαταστάτησαν (ἀκαταστατέω) — «стали непостоянны, неустойчивы»; слав. «путие его непостоянни быша». ἀντ αὐτοῦ — «вместо него». οὐκέτι ἠδυνάσθην πορευθῆναι — «уже не мог идти»."
  16: "ἐν ταῖς ἡμέραις Ενεμεσσαρου — «во дни Енемессара». ἐλεημοσύνας πολλὰς ἐποίουν — имперфект от ποιέω, «делал многие милостыни»; слав. «милостыни многи творих»."
  17: "τοὺς ἄρτους μου ἐδίδουν τοῖς πεινῶσιν — «хлебы мои давал алчущим» (имперфект ἐδίδουν). ἱμάτια — одежды. ἐρριμμένον ὀπίσω τοῦ τείχους Νινευη — «брошенного за стеною Ниневии» (ῥίπτω). ἔθαπτον — «погребал» (θάπτω, имперфект)."
  18: "κλέπτων — «украдкой» (буквально «крадя»); слав. «отай». ἐν τῷ θυμῷ αὐτοῦ — «в ярости своей». ἐζητήθη ὑπὸ τοῦ βασιλέως τὰ σώματα — «исканы были царём тела» (ζητέω в страдательном); слав. «искома бываху… телеса»."
  19: "ὑπέδειξε τῷ βασιλεῖ περὶ ἐμοῦ — «донёс царю обо мне» (ὑποδείκνυμι). ἐκρύβην — «я скрылся». ἐπιγνοὺς ὅτι ζητοῦμαι ἀποθανεῖν — «узнав, что меня ищут убить». φοβηθεὶς ἀνεχώρησα — «убоявшись, удалился» (ἀναχωρέω); слав. «отидох»."
  20: "διηρπάγη πάντα τὰ ὑπάρχοντά μου — «расхищено было всё имущество моё» (διαρπάζω; τὰ ὑπάρχοντα — имущество). οὐ κατελείφθη μοι οὐδέν — «не осталось мне ничего»; слав. «не остася ми ничтоже»."
  21: "οὐ διῆλθον ἡμέραι πεντήκοντα — «не прошло пятидесяти дней». τὰ ὄρη Αραρατ — горы Араратские (アララト). Αχιαχαρον τὸν Αναηλ υἱὸν τοῦ ἀδελφοῦ μου — «Ахиахара, [сына] Анаила, сына брата моего»: Αναηλ — иное имя, чем Ανανιηλ в 1:1 (アナエル); слав. «ахиахара анаила». ἐκλογιστία — «счётная часть» (слав. «сочисление»), διοίκησις — управление."
  22: "ἠξίωσεν περὶ ἐμοῦ — «ходатайствовал обо мне» (ἀξιόω). οἰνοχόος — виночерпий (酌人). ἐπὶ τοῦ δακτυλίου — «над перстнем», т.е. хранитель царской печати-перстня. ἐκ δευτέρας — «во второй [степени]», вторым по себе. ἐξάδελφος — «родственник, двоюродный брат»; слав. «бе сын брата моего» (племянник) противоречит 1:21, где Ахикар — внук брата Товита, поэтому в тексте 親族, слав. чтение отмечено."
