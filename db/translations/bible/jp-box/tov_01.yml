# jp-box, Товит, глава 1. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc в книге нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 1: родословие и плен (1–2, третье лицо); с 1:3 Товит говорит о себе
# («わたし»): благочестие и десятины (3–9), милостыня и погребение убитых (10–18),
# донос, разграбление и Ахиакар (19–22). Прямой речи нет; красного нет.
# Нумерация по gr: 22 стиха, номера совпадают с csl; но csl 1:2 вбирает начало
# gr 1:3 («Аз товит путем истины ходих и правды вся дни живота моего»), поэтому
# этот текст в 1:3 не повторён — отмечено в notes.
# 〔…〕 нет: все стихи есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 施し, 初穂, 十分の一, タラント, 神殿, 異邦人 уже в корпусе.
# Имена — транслитерация греческого (LXX).

