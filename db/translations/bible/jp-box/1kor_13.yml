# jp-box, Первое послание к Коринфянам, глава 13. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в notes.
# Глава 13 — «гимн любви»: сохранены параллелизм и ритм перечисления (4–7, 13).
# Красного и синего нет: прямой речи Христа и Богородицы в 13–16 нет, <j>/<mo> не ставятся.
# 〔…〕: в главе нет. 13:3 — замена чтения (καυχήσωμαι / καυθήσομαι), а не добавление,
# поэтому без 〔〕 (ср. Рим 2:17; 1 Кор 2:1). Сносок ⟨…⟩ нет. jp-ni не использовался.

tr_code: jp-box
book: 1kor
chapter: 13
draft: true

verses:
  1: "たとえ、わたしが人[ひと]の異言[いげん]や天使[てんし]の異言[いげん]で語[かた]っても、愛[あい]がなければ、わたしは鳴[な]り響[ひび]く銅[あかがね]や、響[ひび]き渡[わた]るシンバルになってしまった。"
  2: "たとえ、わたしに預言[よげん]の力[ちから]があり、すべての奥義[おうぎ]とすべての知識[ちしき]を知[し]り、山[やま]を移[うつ]すほどの信仰[しんこう]をすべて持[も]っていても、愛[あい]がなければ、わたしは無[な]に等[ひと]しい。"
  3: "たとえ、わたしがすべての財産[ざいさん]を施[ほどこ]し、焼[や]かれるために自分[じぶん]の体[からだ]を渡[わた]しても、愛[あい]がなければ、わたしは何[なに]の益[えき]も受[う]けない。"
  4: "愛[あい]は寛容[かんよう]であり、愛[あい]は親切[しんせつ]である。愛[あい]は妬[ねた]まず、誇[ほこ]らず、高[たか]ぶらず、"
  5: "礼[れい]を失[しつ]せず、自分[じぶん]の利[り]を求[もと]めず、怒[おこ]り立[た]たず、悪[あく]を心[こころ]に記[き]さず、"
  6: "不義[ふぎ]を喜[よろこ]ばず、真理[しんり]とともに喜[よろこ]ぶ。"
  7: "すべてを耐[た]え忍[しの]び、すべてを信[しん]じ、すべてを望[のぞ]み、すべてを忍[しの]ぶ。"
  8: "愛[あい]は決[けっ]して滅[ほろ]びない。預言[よげん]は廃[すた]れ、異言[いげん]はやみ、知識[ちしき]も廃[すた]れる。"
  9: "なぜなら、わたしたちは一部[いちぶ]だけを知[し]り、一部[いちぶ]だけを預言[よげん]するからである。"
  10: "しかし、完全[かんぜん]なものが来[く]るとき、一部[いちぶ]のものは廃[すた]れる。"
  11: "わたしが幼子[おさなご]であったとき、幼子[おさなご]のように語[かた]り、幼子[おさなご]のように思[おも]い、幼子[おさなご]のように判断[はんだん]していた。大人[おとな]になったとき、幼子[おさなご]のことを捨[す]てたのである。"
  12: "今[いま]、わたしたちは鏡[かがみ]に映[うつ]る姿[すがた]を、謎[なぞ]のようにおぼろげに見[み]ている。しかし、そのときには顔[かお]と顔[かお]を合[あ]わせて見[み]る。今[いま]、わたしは一部[いちぶ]だけを知[し]っているが、そのときには、わたしが知[し]られているのと同[おな]じように、わたしも知[し]るであろう。"
  13: "しかし今[いま]、信仰[しんこう]、希望[きぼう]、愛[あい]、この三[みっ]つが残[のこ]る。このうちで最[もっと]も大[おお]きいものは愛[あい]である。"

notes:
  1: "γλῶσσαι — 異言. χαλκὸς ἠχῶν — «звенящая медь»; 鳴り響く銅. κύμβαλον ἀλαλάζον — «громко звучащий кимвал»; シンバル (у jp-joc 鈸)."
  2: "μυστήρια — 奥義. ὄρη μεθιστάνειν — «переставлять горы»; 山を移す."
  3: "ψωμίσω — «раздам как хлеб»; 施す. В критической базе ἵνα καυχήσωμαι («чтобы мне хвалиться»); церковный текст (Елизаветинская «во еже сожещи е», jp-joc「焚くに委ぬ」) читает ἵνα καυθήσομαι — «чтобы сгореть». Это замена, а не добавление, поэтому без 〔〕."
  4: "μακροθυμεῖ — 寛容; χρηστεύεται — 親切; περπερεύεται — 誇る; φυσιοῦται — 高ぶる."
  5: "ἀσχημονεῖ — 礼を失する; παροξύνεται — 怒り立つ; λογίζεται τὸ κακόν — «не вменяет зла»; 心に記さない."
  6: "ἀδικία — 不義; συγχαίρει — 共に喜ぶ."
  7: "στέγει — «покрывает, переносит»; 耐え忍ぶ."
  8: "πίπτει — «падает»; 滅びない. καταργεῖσθαι — 廃れる."
  9: "ἐκ μέρους — «отчасти»; 一部."
  11: "νήπιος — 幼子; ἀνήρ — 大人. κατήργηκα (perfect) — 捨てた."
  12: "ἔσοπτρον — 鏡; αἴνιγμα — 謎; ἐπιγνώσομαι / ἐπεγνώσθην — 知る / 知られていた."
  13: "νυνί — しかし今; μένει — 残る; μείζων — 最も大きい."
