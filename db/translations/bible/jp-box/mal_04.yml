# jp-box, Малахия, глава 4. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной (csl-ru): здесь 6 стихов; в gr-lxx-byz 4-й главы
# нет, её содержание — gr 3:19–24. Карта: слав. 4:1–3 = gr 3:19–21; слав. 4:4 = gr 3:24;
# слав. 4:5–6 = gr 3:22–23. В LXX порядок иной: сначала Илия (3:22), потом обращение
# сердец (3:23), потом закон Моисея (3:24); в слав. порядок МТ: закон (4:4), затем
# Илия (4:5–6). Стихи не дублируются; порядок и нумерация — славянские.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена: モーセ, ホレブ, エリヤ, イスラエル.
#
# Содержание: 1 день Господень, горящий как печь: иноплеменники и беззаконники —
# солома, ни корня, ни ветви; 2 боящимся имени Его — солнце правды и исцеление
# в крыльях его, тельцы, разрешённые от уз; 3 попрание беззаконных, пепел под ногами;
# 4 помните закон Моисея, повеления и оправдания на Хориве; 5 Илия Фесвитянин прежде
# дня Господня великого и славного; 6 обращение сердец отцов к детям, чтобы Господь
# не поразил землю вконец.
# Голоса: 4:1–6 — одно слово Господа в 「…» (в 1, 3 «говорит Господь» внутри);
# 4:4 — повеление внутри того же слова.
#
tr_code: jp-box
book: mal
chapter: 4
draft: true

verses:
  1: "「見[み]よ、炉[こうろ]のように燃[も]える日[ひ]が来[く]る。それは彼らを焼[や]き、すべての異邦人[いほうじん]も不法[ふほう]を行[おこな]う者[もの]も、わらのようになる。来[く]る主[しゅ]の日[ひ]が彼らを燃[も]やし、根[ね]も枝[えだ]も残[のこ]さない、と万軍[ばんぐん]の主[しゅ]は言[い]われる。"
  2: "あなたがた、わたしの名[な]を恐[おそ]れる者[もの]には、義[ぎ]の太陽[たいよう]が昇[のぼ]り、その翼[つばさ]に癒[いや]しがある。あなたがたは出[で]て、解[と]き放[はな]たれた子牛[こうし]のように跳[は]ねる。"
  3: "あなたがたは不法[ふほう]な者[もの]どもを踏[ふ]みつける。彼らはあなたがたの足[あし]の下[した]で灰[はい]となる。わたしが行[おこな]うその日[ひ]に、と万軍[ばんぐん]の主[しゅ]は言[い]われる。"
  4: "わたしのしもべモーセの律法[りっぽう]を覚[おぼ]えよ。ホレブでイスラエル全体[ぜんたい]に命[めい]じた定[さだ]めと裁[さば]きとを。"
  5: "見[み]よ、主[しゅ]の大[おお]いなる、輝[かがや]かしい日[ひ]が来[く]る前[まえ]に、わたしはテシベ人[びと]のエリヤをあなたがたに遣[つか]わす。"
  6: "彼は父[ちち]の心[こころ]を子[こ]に向[む]け、人[ひと]の心[こころ]をその隣人[りんじん]に向[む]けさせる。そうでなければ、わたしが来[き]て、地[ち]を全[まった]く打[う]ち滅[ほろ]ぼすであろう」。"

notes:
  1: "Карта: слав. 4:1 = gr 3:19. διότι ἰδοὺ ἡμέρα κυρίου ἔρχεται καιομένη ὡς κλίβανος — «ибо вот, день Господень приходит, горящий как печь» (κλίβανος — печь, 炉[こうろ]); φλέξει αὐτούς — «сожжёт их» (φλέγω — жечь); ἔσονται πάντες οἱ ἀλλογενεῖς καὶ πάντες οἱ ποιοῦντες ἄνομα καλάμη — «будут все иноплеменники и все делающие беззаконие как солома» (ἀλλογενής — чужеземец, 異邦人; καλάμη — стебель, солома); ἀνάψει αὐτοὺς ἡ ἡμέρα ἡ ἐρχομένη — «возжжёт их день грядущий»; οὐ μὴ ὑπολειφθῇ ἐξ αὐτῶν ῥίζα οὐδὲ κλῆμα — «не останется от них ни корня, ни ветви»."
  2: "Слав. 4:2 = gr 3:20. ἀνατελεῖ ὑμῖν τοῖς φοβουμένοις τὸ ὄνομά μου ἥλιος δικαιοσύνης — «взойдёт вам, боящимся имени Моего, солнце правды» (ἀνατέλλω — восходить); ἴασις ἐν ταῖς πτέρυξιν αὐτοῦ — «исцеление в крыльях (лучах) его» (ἴασις — исцеление; πτέρυξ — крыло); ἐξελεύσεσθε καὶ σκιρτήσετε ὡς μοσχάρια ἐκ δεσμῶν ἀνειμένα — «выйдете и взыграете, как тельцы, разрешённые от уз» (σκιρτάω — прыгать, скакать; δεσμός — узы). В ru/МТ «из стойла» — иное чтение, не внесено."
  3: "Слав. 4:3 = gr 3:21. καταπατήσετε ἀνόμους — «попрёте беззаконных» (καταπατέω — топтать); ἔσονται σποδὸς ὑποκάτω τῶν ποδῶν ὑμῶν — «будут пеплом под ногами вашими» (σποδός — пепел); ἐν τῇ ἡμέρᾳ, ᾗ ἐγὼ ποιῶ — «в день, который Я творю»."
  4: "Карта: слав. 4:4 = gr 3:24; в LXX этот стих стоит последним, после Илии (gr 3:22–23). Порядок держим по слав. μνήσθητε νόμου Μωυσῆ τοῦ δούλου μου — «помните закон Моисея, раба Моего»; καθότι ἐνετειλάμην αὐτῷ ἐν Χωρηβ — «как Я заповедал ему в Хориве» (Χωρηβ — Хорив, ホレブ); πρὸς πάντα τὸν Ισραηλ προστάγματα καὶ δικαιώματα — «всему Израилю — повеления и оправдания» (πρόσταγμα — повеление; δικαίωμα — устав, оправдание; в тексте 定[さだ]めと裁[さば]き)."
  5: "Карта: слав. 4:5 = gr 3:22. καὶ ἰδοὺ ἐγὼ ἀποστέλλω ὑμῖν Ηλιαν τὸν Θεσβίτην — «вот, Я посылаю вам Илию Фесвитянина» (Θεσβίτης — фесвитянин, от Фесвы; в тексте テシベ人[びと]); πρὶν ἐλθεῖν ἡμέραν κυρίου τὴν μεγάλην καὶ ἐπιφανῆ — «прежде чем придёт день Господень великий и славный (явный)» (ἐπιφανής — явный, славный). В ru/МТ добавлено «пророка» — нет в LXX и слав., не внесено."
  6: "Карта: слав. 4:6 = gr 3:23. ὃς ἀποκαταστήσει καρδίαν πατρὸς πρὸς υἱὸν — «который восстановит (обратит) сердце отца к сыну» (ἀποκαθίστημι — восстанавливать); καρδίαν ἀνθρώπου πρὸς τὸν πλησίον αὐτοῦ — «и сердце человека к ближнему его»; μὴ ἔλθω καὶ πατάξω τὴν γῆν ἄρδην — «чтобы Я не пришёл и не поразил землю вконец» (πατάσσω — поражать; ἄρδην — совершенно, вконец). Здесь книга закрывается."
