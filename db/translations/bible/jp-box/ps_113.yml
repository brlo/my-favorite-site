# jp-box, Псалтирь, псалом 113. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация — славяно-синодальная (csl-ru): в слав. надписание отдельным стихом
# не стоит, поэтому наш стих 0 (надписание) влит в начало стиха 1; дальше номера 1..26.
#
# ОСОБЫЙ СЛУЧАЙ — дефект модуля gr-lxx-byz. В базе у 113 стоят только строки 0–18,
# причём вторая половина псалма в них свёрнута: строка 8 содержит ст. 8 и следом
# ст. 9–16 с внутренней нумерацией 1–8 (μὴ ἡμῖν … ὅμοιοι), а строки 9–18 — это
# ст. 17–26 (οἶκος Ισραηλ … ἀλλ᾽ ἡμεῖς). Поэтому стихи расставлены по церковной (LXX)
# нумерации, как в ru / csl-ru / jp-joc: 9–16 взяты из склеенной строки 8, 17–26 —
# из строк 9–18 модуля. Греческий текст всех 26 стихов в модуле есть, поэтому 〔…〕
# нет ни в одном стихе: это не церковное добавление, а сдвиг нумерации в модуле.
# До перенумерации jp_box_check.rb для Пс 113 ждал набор 0..26; после перенумерации по csl-ru — 1..26.
#
# Красного и синего нет. Кавычки: слова народов в 10 — 「…」 (первый уровень).
# セラ (διάψαλμα) в этой главе нет.
# Сносок ⟨…⟩ нет. jp-ni не использовался.

tr_code: jp-box
book: ps
chapter: 113
draft: true

verses:
  1: "アレルヤ。イスラエルがエジプトから、ヤコブの家[いえ]が異[い]国[こく]の民[たみ]の中[なか]から出[で]たとき、"
  2: "ユダは主[しゅ]の聖所[せいしょ]となり、イスラエルはその領[りょう]地[ち]となった。"
  3: "海[うみ]はこれを見[み]て逃[に]げ、ヨルダンは後[うし]ろへ退[しりぞ]いた。"
  4: "山[やま]々[やま]は雄[お]羊[ひつじ]のように躍[おど]り、丘[おか]は小[こ]羊[ひつじ]のように躍[おど]った。"
  5: "海[うみ]よ、なぜあなたは逃[に]げたのか。ヨルダンよ、なぜあなたは後[うし]ろへ退[しりぞ]いたのか。"
  6: "山[やま]々[やま]よ、なぜあなたがたは雄[お]羊[ひつじ]のように躍[おど]るのか。丘[おか]よ、なぜあなたがたは小[こ]羊[ひつじ]のように躍[おど]るのか。"
  7: "地[ち]は主[しゅ]の前[まえ]で、ヤコブの神[かみ]の前[まえ]で震[ふる]えた。"
  8: "主[しゅ]は岩[いわ]を池[いけ]に、硬[かた]い岩[いわ]を水[みず]の泉[いずみ]に変[か]えられた。"
  9: "わたしたちにではなく、主[しゅ]よ、わたしたちにではなく、あなたの名[な]に栄光[えいこう]を帰[き]してください。あなたのあわれみと真実[しんじつ]のゆえに。"
  10: "もろもろの民[たみ]が「彼[かれ]らの神[かみ]はどこにいるのか」と言[い]うことがないように。"
  11: "しかし、わたしたちの神[かみ]は天[てん]におられ、天[てん]でも地[ち]でも、望[のぞ]まれたことをすべて行[おこな]われる。"
  12: "もろもろの民[たみ]の偶像[ぐうぞう]は銀[ぎん]と金[きん]、人[ひと]の手[て]のわざである。"
  13: "口[くち]があっても語[かた]らず、目[め]があっても見[み]ない。"
  14: "耳[みみ]があっても聞[き]かず、鼻[はな]があっても匂[にお]いをかがない。"
  15: "手[て]があっても触[さわ]れず、足[あし]があっても歩[ある]けず、喉[のど]から声[こえ]を出[だ]すこともない。"
  16: "これらを造[つく]る者[もの]も、これらに寄[よ]り頼[たの]む者[もの]も、みなこれらと同[おな]じものとなるがよい。"
  17: "イスラエルの家[いえ]は主[しゅ]に寄[よ]り頼[たの]んだ。主[しゅ]は彼[かれ]らの助[たす]け、彼[かれ]らの盾[たて]である。"
  18: "アロンの家[いえ]は主[しゅ]に寄[よ]り頼[たの]んだ。主[しゅ]は彼[かれ]らの助[たす]け、彼[かれ]らの盾[たて]である。"
  19: "主[しゅ]を畏[おそ]れる者[もの]たちは主[しゅ]に寄[よ]り頼[たの]んだ。主[しゅ]は彼[かれ]らの助[たす]け、彼[かれ]らの盾[たて]である。"
  20: "主[しゅ]はわたしたちを思[おも]い起[おこ]して祝福[しゅくふく]し、イスラエルの家[いえ]を祝福[しゅくふく]し、アロンの家[いえ]を祝福[しゅくふく]された。"
  21: "主[しゅ]を畏[おそ]れる者[もの]たちを、小[ちい]さな者[もの]も大[おお]きな者[もの]もともに祝福[しゅくふく]された。"
  22: "主[しゅ]があなたがたに、あなたがたにも、あなたがたの子[こ]らにも、さらに加[くわ]えてくださるように。"
  23: "あなたがたは、天[てん]と地[ち]を造[つく]られた主[しゅ]に祝福[しゅくふく]されている。"
  24: "天[てん]の天[てん]は主[しゅ]のものであり、地[ち]は人[ひと]の子[こ]らに与[あた]えられた。"
  25: "死[し]んだ者[もの]たちは、主[しゅ]よ、あなたを賛美[さんび]しない。陰府[よみ]に下[くだ]る者[もの]たちも、みな賛美[さんび]しない。"
  26: "しかし、生[い]けるわたしたちは、今[いま]からとこしえに至[いた]るまで主[しゅ]を祝福[しゅくふく]する。"

notes:
  1: "Αλληλουια — アレルヤ, как по корпусу (Откр 19:1). В ру-базе, csl-ru и jp-joc надписание стоит стихом 0 (в csl-ru отдельного стиха нет, влито в ст. 1). Ἐν ἐξόδῳ Ισραηλ ἐξ Αἰγύπτου — イスラエルがエジプトから…出たとき (ἔξοδος — «исход»). οἴκου Ιακωβ ἐκ λαοῦ βαρβάρου — ヤコブの家が異国の民の中から (βάρβαρος — «чужой, иноплеменный»; 異国の民, чтобы не читалось как «варварский народ»). Стих кончается на 、: предложение продолжается в ст. 2."
  2: "ἐγενήθη Ιουδαία ἁγίασμα αὐτοῦ — ユダは主の聖所となり (ἁγίασμα — «святыня»). Ισραηλ ἐξουσία αὐτοῦ — イスラエルはその領地となった (ἐξουσία здесь «владение, область власти»: в Елизаветинской «область», в Синодальном «владение»)."
  3: "ἡ θάλασσα εἶδεν καὶ ἔφυγεν — 海はこれを見て逃げ (Чермное море, ср. Исх 14:21). ὁ Ιορδάνης ἐστράφη εἰς τὰ ὀπίσω — ヨルダンは後ろへ退いた (ἀποστρέφω — «поворачивать назад», ср. Нав 3:16)."
  4: "τὰ ὄρη ἐσκίρτησαν ὡσεὶ κριοί — 山々は雄羊のように躍り (σκιρτάω — «прыгать, скакать»; κριός — «баран»). οἱ βουνοὶ ὡς ἀρνία προβάτων — 丘は小羊のように (ἀρνίον — «ягнёнок»)."
  5: "τί σοί ἐστιν, θάλασσα, ὅτι ἔφυγες — «что с тобою, море, что ты побежало»; буквальное «что тебе» по-японски невозможно, передано なぜ…のか. καὶ σοί, Ιορδάνη, ὅτι ἀνεχώρησας εἰς τὰ ὀπίσω — ヨルダンよ、なぜ…後ろへ退いたのか (ἀναχωρέω — «отступать»)."
  6: "τὰ ὄρη, ὅτι ἐσκιρτήσατε — вопрос продолжен к горам; глагол во 2 л. мн. ч. (ἐσκιρτήσατε), поэтому あなたがた. οἱ βουνοὶ ὡς ἀρνία προβάτων — повтор 4-го стиха сохранён."
  7: "ἀπὸ προσώπου κυρίου ἐσαλεύθη ἡ γῆ — 地は主の前で震えた (σαλεύω — «колебать, трясти»; аорист изъявит.). В Синодальном «трепещи, земля» — по евр. императиву, в Елизаветинской «подвижеся земля»; оставлено изъявительное по греч."
  8: "τοῦ στρέψαντος τὴν πέτραν εἰς λίμνας ὑδάτων — причастие относится к Господу из ст. 7; по-японски передано самостоятельным предложением 主は…変えられた. τὴν ἀκρότομον εἰς πηγὰς ὑδάτων — 硬い岩を水の泉に (ἀκρότομος — «утёс, скала»; λίμνη — «озеро, водоём»)."
  9: "μὴ ἡμῖν, κύριε, μὴ ἡμῖν — わたしたちにではなく、主よ、わたしたちにではなく; двойной повтор сохранён. ἀλλ᾽ ἢ τῷ ὀνόματί σου δὸς δόξαν — あなたの名に栄光を帰してください. ἐπὶ τῷ ἐλέει σου καὶ τῇ ἀληθείᾳ σου — あなたのあわれみと真実のゆえに."
  10: "μήποτε εἴπωσιν τὰ ἔθνη — чтобы не сказали народы (μήποτε — «как бы не»). Ποῦ ἐστιν ὁ θεὸς αὐτῶν; — слова народов, 「…」. Стих стоит в склеенной строке 8 модуля (внутренний номер 2), греч. текст есть."
  11: "ὁ δὲ θεὸς ἡμῶν ἐν τῷ οὐρανῷ ἄνω — わたしたちの神は天におられ. ἐν τοῖς οὐρανοῖς καὶ ἐν τῇ γῇ πάντα, ὅσα ἠθέλησεν, ἐποίησεν — 天でも地でも、望まれたことをすべて行われる (ἐν τοῖς οὐρανοῖς — «на небесах», собирательно 天)."
  12: "τὰ εἴδωλα τῶν ἐθνῶν ἀργύριον καὶ χρυσίον — もろもろの民の偶像は銀と金 (εἴδωλον — 偶像[ぐうぞう], как по корпусу). ἔργα χειρῶν ἀνθρώπων — 人の手のわざである."
  13: "στόμα ἔχουσιν καὶ οὐ λαλήσουσιν — 口があっても語らず. ὀφθαλμοὺς ἔχουσιν καὶ οὐκ ὄψονται — 目があっても見ない. Анафора «есть… но не» сохранена."
  14: "ὦτα ἔχουσιν καὶ οὐκ ἀκούσονται — 耳があっても聞かず. ῥῖνας ἔχουσιν καὶ οὐκ ὀσφρανθήσονται — 鼻があっても匂いをかがない (ὀσφραίνομαι — «обонять»)."
  15: "χεῖρας ἔχουσιν καὶ οὐ ψηλαφήσουσιν — 手があっても触れず (ψηλαφάω — «осязать»). πόδας ἔχουσιν καὶ οὐ περιπατήσουσιν — 足があっても歩けず. οὐ φωνήσουσιν ἐν τῷ λάρυγγι αὐτῶν — 喉から声を出すこともない (λάρυγξ — «гортань»)."
  16: "ὅμοιοι αὐτοῖς γένοιντο — да будут подобны им (оптатив) → …となるがよい. οἱ ποιοῦντες αὐτὰ καὶ πάντες οἱ πεποιθότες ἐπ᾽ αὐτοῖς — 造る者も、寄り頼む者も; πάντες передано みな."
  17: "οἶκος Ισραηλ ἤλπισεν ἐπὶ κύριον — イスラエルの家は主に寄り頼んだ (аорист изъявит.; в Синодальном превращено в увещание «уповай», в Елизаветинской «упова», поэтому оставлено изъявительное). βοηθὸς αὐτῶν καὶ ὑπερασπιστὴς αὐτῶν ἐστιν — 彼らの助け、彼らの盾 (ὑπερασπιστής — «защитник, заступник»)."
  18: "οἶκος Ααρων ἤλπισεν ἐπὶ κύριον — アロンの家は主に寄り頼んだ; та же формула, что в 17, повтор сохранён (формула «дом Аарона» — ср. 117:3)."
  19: "οἱ φοβούμενοι τὸν κύριον ἤλπισαν ἐπὶ κύριον — 主を畏れる者たちは主に寄り頼んだ (ἤλπισαν — аорист 3 л. мн. ч.). Третья ступень формулы: дом Израиля, дом Аарона, боящиеся Господа."
  20: "κύριος ἐμνήσθη ἡμῶν καὶ εὐλόγησεν ἡμᾶς — 主はわたしたちを思い起して祝福し (μιμνῄσκομαι — «вспоминать, помнить»). Тройное εὐλόγησεν (нас, дом Израиля, дом Аарона) сохранено тремя 祝福."
  21: "εὐλόγησεν τοὺς φοβουμένους τὸν κύριον — 主を畏れる者たちを祝福. τοὺς μικροὺς μετὰ τῶν μεγάλων — 小さな者も大きな者もともに (букв. «малых с великими»)."
  22: "προσθείη κύριος ἐφ᾽ ὑμᾶς — да приложит Господь вам (оптатив) → …さらに加えてくださるように. Повтор ἐφ᾽ ὑμᾶς, ἐφ᾽ ὑμᾶς сохранён: あなたがたに、あなたがたにも. ἐπὶ τοὺς υἱοὺς ὑμῶν — あなたがたの子らにも."
  23: "εὐλογημένοι ὑμεῖς τῷ κυρίῳ τῷ ποιήσαντι τὸν οὐρανὸν καὶ τὴν γῆν — あなたがたは、天と地を造られた主に祝福されている (τῷ κυρίῳ — датив деятеля при пассиве)."
  24: "ὁ οὐρανὸς τοῦ οὐρανοῦ τῷ κυρίῳ — 天の天は主のもの (букв. «небо небесе»). τὴν δὲ γῆν ἔδωκεν τοῖς υἱοῖς τῶν ἀνθρώπων — 地は人の子らに与えられた."
  25: "οὐχ οἱ νεκροὶ αἰνέσουσίν σε, κύριε — 死んだ者たちは、主よ、あなたを賛美しない. οὐδὲ πάντες οἱ καταβαίνοντες εἰς ᾅδου — 陰府に下る者たちも、みな賛美しない (ᾅδης — 陰府[よみ], как по корпусу)."
  26: "ἀλλ᾽ ἡμεῖς οἱ ζῶντες εὐλογήσομεν τὸν κύριον — しかし、生けるわたしたちは主を祝福する. ἀπὸ τοῦ νῦν καὶ ἕως τοῦ αἰῶνος — 今からとこしえに至るまで. В ру-базе стих кончается ещё «Аллилуия», в gr-lxx-byz его нет — не добавлено (иначе понадобились бы 〔…〕)."
