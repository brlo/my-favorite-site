  6: "また別[べつ]のたとえがある。都[みやこ]が建[た]てられ、野[の]の広[ひろ]い所[ところ]に置[お]かれ、すべての善[ぜん]に満[み]ちている。"
  7: "その入[い]り口[ぐち]は狭[せま]く、険[けわ]しい所[ところ]に置[お]かれ、右[みぎ]には火[ひ]があり、左[ひだり]には深[ふか]い水[みず]がある。"
  8: "その間[あいだ]、すなわち火[ひ]と水[みず]の間[あいだ]には、たった一[ひと]本[ぽん]の小径[こみち]が敷[し]かれているだけで、人[ひと]の足[あし]の一[ひと]歩[ぽ]だけを容[い]れることができる。"
  9: "そこで、この都[みやこ]が人[ひと]に嗣業[しぎょう]として与[あた]えられるとき、もし定[さだ]められた危[き]難[なん]を通[とお]らないなら、どうして自分[じぶん]の嗣業[しぎょう]を受[う]け取[と]れるだろうか。」"
  10: "わたしは言[い]った。「そのとおりです、主[しゅ]よ。」彼[かれ]はわたしに言[い]った。「イスラエルの分[わ]け前[まえ]も同[おな]じである。"
  11: "彼[かれ]らのためにわたしは世[よ]を造[つく]った。しかしアダムがわたしの定[さだ]めを犯[おか]したとき、造[つく]られたものについて定[さだ]めが下[くだ]された。"
  12: "それでこの世[よ]の入[い]り口[ぐち]は狭[せま]く、苦[くる]しく、労[ろう]苦[く]に満[み]ち、小[ちい]さく、悪[わる]く、災[わざわ]いに満[み]ち、大[おお]きな労[ろう]苦[く]によって固[かた]められたものとなった。"
  13: "大[おお]いなる世[よ]の入[い]り口[ぐち]は広[ひろ]く、安全[あんぜん]で、不死[ふし]の実[み]を結[むす]ぶ。"
  14: "だから、生[い]きている者[もの]たちが入[はい]る者[もの]として、この狭[せま]く空[むな]しいものの中[なか]に入[はい]らないなら、備[そな]えられたものを受[う]け取[と]ることはできない。"
  15: "それなのに、なぜあなたは朽[く]ちる者[もの]でありながら騒[さわ]ぎ立[た]ち、死[し]ぬべき者[もの]でありながら心[こころ]を乱[みだ]すのか。"
  16: "なぜあなたは、来[きた]るべきものを心[こころ]に受[う]け入[い]れず、今[いま]あるものを受[う]け入[い]れたのか。」"
  17: "わたしは答[こた]えて言[い]った。「主[しゅ]なる神[かみ]よ。見[み]てください。あなたは律法[りっぽう]によって、正[ただ]しい者[もの]たちがこれらを嗣業[しぎょう]として受[う]け、不敬[ふけい]な者[もの]たちは滅[ほろ]びると定[さだ]められました。"
  18: "正[ただ]しい者[もの]たちは広[ひろ]いものを望[のぞ]みながら狭[せま]いものに耐[た]え、不敬[ふけい]に生[い]きた者[もの]たちは狭[せま]いものを苦[くる]しんだ末[すえ]、広[ひろ]いものを見[み]ないのです。」"
  19: "彼[かれ]はわたしに言[い]った。「神[かみ]より大[おお]いなる裁[さば]き手[て]はなく、いと高[たか]き方[かた]より多[おお]く悟[さと]る者[もの]もない。"
  20: "なぜなら、今[いま]ある者[もの]たちの多[おお]くは、定[さだ]められた神[かみ]の律法[りっぽう]を軽[かろ]んじるゆえに滅[ほろ]びるからである。"
  21: "神[かみ]は来[く]る者[もの]たちに、来[き]たとき、何[なに]を行[おこな]えば生[い]き、何[なに]を守[まも]れば罰[ばっ]せられないかを、強[つよ]く命[めい]じられた。"
  22: "しかし彼らは聞[き]き入[い]れず、神[かみ]に逆[さか]らい、自分[じぶん]たちに空[むな]しい思[おも]いを抱[いだ]いた。"
  23: "罪[つみ]の道[みち]を自分[じぶん]たちの前[まえ]に置[お]き、いと高[たか]き方[かた]はないと言[い]い、その道[みち]を知[し]らなかった。"
  24: "その律法[りっぽう]を軽[かろ]んじ、その約束[やくそく]を退[しりぞ]け、その律法[りっぽう]のうちに信仰[しんこう]を持[も]たず、その業[わざ]を成[な]し遂[と]げなかった。"
  25: "だから、エズラ、空[むな]しいものは空[むな]しい者[もの]に、満[み]ちたものは満[み]ちた者[もの]に。"
  26: "見[み]よ、時[とき]が来[く]る。わたしがあなたに予[あらかじ]め告[つ]げたしるしが来[く]るとき、花嫁[はなよめ]が現[あらわ]れ、今[いま]地[ち]から隠[かく]されている彼女[かのじょ]が、現[あらわ]れて見[み]えるようになる。"
  27: "予[あらかじ]め告[つ]げられた災[わざわ]いから救[すく]い出[だ]された者[もの]は、だれでもわたしの驚[おどろ]くべき業[わざ]を見[み]る。"
  28: "わたしの子[こ]イエスが、彼[かれ]と共[とも]にいる者[もの]たちと共[とも]に現[あらわ]れ、残[のこ]された者[もの]たちは四百年[よんひゃくねん]の間[あいだ]、楽[たの]しみを得[え]る。"
  29: "これらの年[とし]が過[す]ぎると、わたしの子[こ]キリストは死[し]に、息[いき]あるすべての人[ひと]も死[し]ぬ。"
  30: "世[よ]は七日[なのか]のあいだ、初[はじ]めの沈黙[ちんもく]に戻[もど]る。かつての裁[さば]きのときのように、だれも残[のこ]らないほどである。"
  31: "七日[なのか]が過[す]ぎると、眠[ねむ]りについていた世[よ]は呼[よ]び起[お]こされ、朽[くち]ちたものは死[し]ぬ。"
  32: "地[ち]はその中[なか]で眠[ねむ]る者[もの]たちを、塵[ちり]はその中[なか]に沈黙[ちんもく]して住[す]む者[もの]たちを引[ひ]き渡[わた]し、倉[くら]は預[あず]けられた魂[たましい]たちを引[ひ]き渡[わた]す。"
  33: "いと高[たか]き方[かた]が裁[さば]きの座[ざ]に現[あらわ]れ、災[わざわ]いは過[す]ぎ去[さ]り、寛容[かんよう]は終[お]わりとなる。"
  34: "ただ一[ひと]つの裁[さば]きが残[のこ]り、真理[しんり]が立[た]ち、信仰[しんこう]が力[ちから]を持つ。"
  35: "業[わざ]がそれに従[したが]って行[おこな]われ、報[むく]いが現[あらわ]れ、正[ただ]しさが目[め]を覚[さ]まし、不[ふ]正[せい]はもはや支配[しはい]しない。」"
  36: "「そのとき、苦[くる]しみの湖[みずうみ]が現[あらわ]れ、その向[む]こうに安[やす]らぎの場所[ばしょ]がある。ゲヘナの炉[ろ]が見[み]え、その向[む]こうに甘美[かんび]の楽園[らくえん]がある。"
