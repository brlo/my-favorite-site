# jp-box, 3-я Ездры, глава 7. Черновик для приёмки.
#
# База: церковнославянский текст (csl-ru) — в Септуагинте (gr-lxx-byz) книги нет,
# греческого контроля нет. Для стихов 1–35 и 106–140 он источник (это слав.
# 7:1–35 и 7:36–70). Раздел 36–105 в слав. тексте этой редакции отсутствует,
# поэтому переведён по русскому Синодальному тексту (ru): другого полного текста
# этого раздела в проекте нет (в LXX книги нет вовсе, jp-joc в книге нет). Это
# единственное место книги, где ru взят источником; в остальном ru — только для
# понимания. jp-ni не использовался.
# Язык — современный 常体 (речь Ездры к Богу — です・ます, как в остальных главах);
# 〔…〕 нет; сносок ⟨…⟩ нет. Красного и синего в Ветхом Завете нет.
#
# КАРТА НУМЕРАЦИИ. В слав. тексте в гл. 7 — 70 стихов, в ru — 140:
#   слав. 7:1–35  = ru 7:1–35    — перевод по слав.
#   (нет в слав.) = ru 7:36–105  — перевод по ru
#   слав. 7:36–70 = ru 7:106–140 — перевод по слав.
# Почему взят Синодальный: раздел об озере мучения и месте покоя, дне суда без
# солнца и луны, семи путях мучений и семи степенях награды в слав. тексте этой
# редакции отсутствует, а греческого текста книги нет вовсе; полный объём главы
# (140 стихов, как в ru) можно дать только переводом с ru. Слав. стихи при этом
# не утрачены и не изменены: они перенумерованы в 106–140 по карте ru.
#
# Содержание: 1–2 явление ангела; 3–9 притча о море с тесным входом и о городе
# с огнём и водой по сторонам единой стези; 10–16 «такова и доля Израиля»:
# тесные входы века сего и пространные входы будущего; 17–18 правда наследует,
# нечестие гибнет; 19–25 нет судии выше Бога, погибают не радящие о законе;
# 26–35 невеста, Сын Мой Иисус, четыреста лет, смерть Христа, семь дней молчания,
# воскресение, престол суда, единый суд;
# 36–38 озеро мучения и место покоя, печь геенны и рай сладости; глас Всевышнего
# к пробудившимся народам; 39–43 день суда без солнца, луны и светил, без времён
# года и суток, длиной в седмицы лет; 44 «одному тебе Я открыл это»;
# 45–48 блаженны живущие, но злое сердце удалило почти всех; 49–52 два века,
# притча о редких драгоценных камнях и обилии свинца и глины; 53 «как это
# возможно?»; 54–59 земля как свидетель: редкое драгоценно; 60–61 радость о
# немногих спасённых, погибшие — пар, огонь и дым; 62–69 плач о разуме, вышедшем
# из праха: «что пользы»; 70–74 суд приготовлен прежде творения, долготерпение
# ради исполнения срока; 75–79 состояние души после смерти; 80–87 семь путей
# мучений; 88–99 семь степеней награды; 100–101 время видеть это и семь дней
# свободы; 102–105 ходатайство на суде невозможно, каждый принесёт своё;
# 106–111 ходатайства Авраама, Моисея, Давида, Соломона, Илии, Езекии — «вскую
# и ныне тако не будет?»; 112–115 нынешний век не конец, день суда — конец
# и начало; 116–126 плач об Адаме: «что пользы», рай показан, а мы не внидем;
# 127–131 помышление подвига, «избери себе живот»; 132–140 «вем, Господи, яко...
# милосерд» — если бы не миловал, не осталось бы и десятитысячной части.
# Голоса: ангел — 2, 3–9, 10–16, 19–35, 36–44, 49–52, 54–57, 59–61, 70–74,
# 76–99, 101, 104–105, 112–115, 127–131; Ездра — 3 (ответ), 10, 17–18, 45–48,
# 53, 58, 62–69, 75, 100, 102–103, 106–111, 116–126, 128, 132–140; в 37–38 слова
# Всевышнего — 『…』, в 52 и 55–56 — 『…』, в 129 слова Моисея — 『…』.
# Имена: エズラ, アブラハム, モーセ, ダビデ, ソロモン, エリヤ, エゼキヤ,
# センナヒリム, アハズ, サムエル, イエス, キリスト, ソドム; ゲヘナ.
# Термины: 苦しみの湖, 安らぎの場所, 甘美の楽園, 理性, 貴石, 鉛, 粘土, 至福.

