  42: "正午[しょうご]も夜[よる]も夜明[よあ]け前[まえ]の薄暗[うすぐら]さも輝[かがや]きも晴[は]れやかさも光[ひかり]もなく、ただ、いと高[たか]き方[かた]の光輝[こうき]の輝[かがや]きだけがあり、それによってすべての者[もの]が自分[じぶん]の前[まえ]にあるものを見[み]ることができる。"
