  55: "あなたは地[ち]に言[い]うだろう。『あなたは金[きん]と銀[ぎん]と銅[どう]を産[う]み、また鉄[てつ]と鉛[なまり]と粘土[ねんど]を産[う]む。"
  56: "しかし銀[ぎん]は金[きん]より多[おお]く、銅[どう]は銀[ぎん]より多[おお]く、鉄[てつ]は銅[どう]より多[おお]く、鉛[なまり]は鉄[てつ]より多[おお]く、粘土[ねんど]は鉛[なまり]より多[おお]い。』"
  57: "さて、何[なに]が尊[とうと]く、人[ひと]を引[ひ]きつけるのかを、あなた自身[じしん]で裁[さば]いてみなさい。多[おお]くあるものか、それとも珍[めずら]しいものか。」"
