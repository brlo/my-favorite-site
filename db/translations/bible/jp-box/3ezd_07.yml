verses:
  1: "わたしがこれらの言葉[ことば]を語[かた]り終[お]えると、先[さき]の夜[よる]にわたしのもとへ遣[つか]わされた天[てん]使[し]が、わたしに遣[つか]わされた。"
  2: "彼[かれ]はわたしに言[い]った。「立[た]て、エズラ。わたしがあなたに語[かた]るために来[き]た言葉[ことば]を聞[き]け。」"
  3: "わたしは言[い]った。「語[かた]ってください、わが主[しゅ]よ。」彼[かれ]はわたしに言[い]った。「海[うみ]は広[ひろ]い所[ところ]に置[お]かれ、深[ふか]く、測[はか]り知[し]れないほどである。"
  4: "しかし、その入[い]り口[ぐち]は狭[せま]い所[ところ]に置[お]かれ、川[かわ]に似[に]たものとなっている。"
