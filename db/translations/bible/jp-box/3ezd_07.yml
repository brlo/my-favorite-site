  128: "もし負[ま]けたなら、あなたが言[い]ったことを受[う]け、もし勝[か]ったなら、わたしが言[い]うものを受[う]け取[と]る。"
  129: "これこそ、モーセが生[い]きていたとき民[たみ]に語[かた]って言[い]った命[いのち]である。『あなたのため命[いのち]を選[えら]べ、そうして生[い]きよ』と。"
  130: "しかし彼らはモーセを信[しん]じず、彼[かれ]の後[あと]の預言[よげん]者[しゃ]たちも、彼らに語[かた]ったわたしも信[しん]じなかった。"
  131: "彼らの滅[ほろ]びについて悲[かな]しみはなく、救[すく]いの定[さだ]められた者[もの]たちには喜[よろこ]びがあるからである。」"
  132: "わたしは答[こた]えて言[い]った。「主[しゅ]よ、わたしは知[し]っています。いと高[たか]き方[かた]はあわれみ深[ぶか]いと言[い]われ、まだ世[よ]に来[こ]ない者[もの]たちをあわれみ、"
  133: "その律法[りっぽう]に従[したが]って生[い]きる者[もの]たちをあわれみ、"
  134: "寛容[かんよう]であって、罪[つみ]を犯[おか]した者[もの]たちを、御自分[おんじしん]の造[つく]られたものとして寛容[かんよう]に耐[た]え、"
  135: "惜[お]しみなく与[あた]える方[かた]であって、必要[ひつよう]に応[おう]じて与[あた]えようと望[のぞ]まれ、"
  136: "多[おお]くのあわれみを持[も]ち、今[いま]ある者[もの]たちにも、過[す]ぎ去[さ]った者[もの]たちにも、やがて来[く]る者[もの]たちにも、あわれみを増[ま]し加[くわ]えられるからです。"
  137: "もしあなたがあわれみを増[ま]し加[くわ]えられないなら、世[よ]はその中[なか]で嗣業[しぎょう]を受[う]ける者[もの]たちと共[とも]に生[い]きながらえることはなく、あなたが与[あた]えることもないでしょう。"
  138: "もしあなたがその善[ぜん]によって、不法[ふほう]を行[おこな]った者[もの]たちが自分[じぶん]の不法[ふほう]から軽[かる]くされるように与[あた]えられないなら、人[ひと]々[びと]の一万分[いちまんぶん]の一[いち]も生[い]きながらえることはできなかったでしょう。"
  139: "また、あなたがその言葉[ことば]によって癒[いや]された者[もの]たちを赦[ゆる]さず、多[おお]くの争[あらそ]いを絶[た]たれないなら、"
  140: "数[かぞ]え切[き]れないほどの多[おお]くの者[もの]のうち、残[のこ]る者[もの]はごくわずかであったでしょう。」"

notes:
  1: "«послан есть ко мне ангел, иже послан бе ко мне в прежния нощи» — «послан был ко мне ангел, который посылаем был ко мне в прежние ночи»."
  2: "«востани, ездро, и слыши словеса, яже приидох глаголати к тебе» — «встань, Ездра, и слушай слова, которые я пришёл говорить тебе»."
  3: "«море поставлено есть в пространне месте, дабы было глубоко и безмерно» — «море поставлено на пространном месте, чтобы быть глубоким и безмерным»."
  4: "«будет же ему вход в тесне месте поставлен, дабы подобно рекам было» — «вход же ему поставлен в тесном месте, чтобы было подобно рекам»."
  5: "«кто бо хотяй восхощет внити в море... аще не пройдет тесноты, в широту како приити может?» — «кто пожелает войти в море... если не пройдёт тесноты, как может прийти в широту?»"
  6: "«град создан есть и поставлен на месте полевом, есть же исполнен всеми благими» — «город построен и поставлен на месте полевом, и наполнен всеми благами»."
  7: "«вход его тесен и в стремнине поставлен, дабы одесную огнь был, ошуюю же вода глубока» — «вход его тесен и поставлен на крутизне, так что справа огонь, а слева глубокая вода»."
  8: "«стезя же есть едина токмо между има проложена... едину токмо ступень человечу могущая вместити» — «между ними проложена только одна стезя... могущая вместить лишь одну ступню человеческую»."
  9: "«егда убо дастся град сей человеку в достояние... како приимет достояние свое?» — «когда город сей будет дан человеку в наследие... как получит наследие своё?»"
  10: "«тако есть и израилева часть» — «такова и доля Израиля»."
  11: "«их бо ради сотворих век» — «для них Я сотворил век»; «егда преступил есть адам законоположения моя, суждено бысть еже сотворено есть» — «когда Адам преступил Мои постановления, было суждено то, что сотворено»."
  12: "«входи сего века тесни и болезненни и трудни, мали же и лукави, и бедств полни и трудом великим утвержденни» — «входы века сего тесны, болезненны, трудны, малы, лукавы, полны бедствий и утверждены великим трудом»."
  13: "«болшаго века входи пространни и безопасни и творящии безсмертный плод» — «входы большего века пространны, безопасны и творят бессмертный плод»."
  14: "«аще убо входящии не внидут, иже живут, в тесная и суетная сия, не возмогут прияти, яже суть уготована» — «если входящие, которые живут, не войдут в это тесное и суетное, не смогут принять уготованное»."
  15: "«егда еси тленен... егда еси смертен» — «когда ты тленен... когда ты смертен»."
  16: "«вскую не приял еси в сердцы твоем, еже есть будущее, но еже настоящее?» — «зачем ты принял в сердце не будущее, а настоящее?»"
  17: "«устроил еси законом твоим, яко праведнии наследят сия, нечестивии же погибнут» — «Ты установил законом Твоим, что праведники наследуют это, а нечестивые погибнут»."
  18: "«праведнии же понесут тесноту надеющеся пространных» — «праведники понесут тесноту, надеясь на пространное»; «иже бо нечестиво сотвориша, и тесноту пострадавше пространных не узрят» — «а сделавшие нечестиво, претерпев тесноту, не увидят пространного»."
  19: "«несть судия паче Бога, ни разумеваяй паче вышняго» — «нет судии выше Бога, нет разумеющего более Всевышнего»."
  20: "«погибают бо мнози настоящии, понеже не радят о предположеннем Божии законе» — «погибают многие из нынешних, потому что не радеют о предложенном Божием законе»."
  21: "«повелевая бо повеле Бог приходящим» — «ибо, повелевая, повелел Бог приходящим»; «что творяще живи будут, и что храняще казними не будут» — «что делая, будут живы, и что соблюдая, не будут наказаны»."
  22: "«тии бо не суть увещани, и противишася ему, и положиша себе помышление суетное» — «они не послушались, воспротивились Ему и положили себе помышление суетное»."
  23: "«представиша себе обхождение грехов» — «поставили себе хождение (образ жизни) грехов»; «глаголаша вышнему не быти» — «говорили, что Всевышнего нет»."
  24: "«в законех его веры не имеша, и дел его не совершиша» — «в законах Его веры не имели и дел Его не совершили»."
  25: "«тщетная тщетным и полная полным» — «суетное — суетным, а полное — полным»."
  26: "«явится невеста, и являющися покажется, яже ныне крыется от земли» — «явится невеста, и, являясь, покажется та, что ныне скрывается от земли»."
  27: "«всяк, иже избавлен есть от предреченных злых, той узрит дивная моя» — «всякий, кто избавлен от предречённых зол, увидит дивные дела Мои»."
  28: "«открыетбося сын мой Иисус с теми, иже с ним суть» — «откроется Сын Мой Иисус с теми, кто с Ним»; «насладятся, иже оставлени суть, в летех четырех стех» — «будут наслаждаться оставленные четыреста лет»."
  29: "«умрет сын мой христос, и вси иже дыхание имут человецы» — «умрёт Сын Мой Христос и все люди, имеющие дыхание»."
  30: "«обратится век в древнее молчание дний седмь... яко да никто останется» — «обратится век в древнее молчание на семь дней... так что никто не останется»."
  31: "«возбудится, иже не у бдит, век и умрет растленный» — «восстанет век, который не бодрствует (спит), и умрёт повреждённое»."
  32: "«земля издаст тех, иже в ней спят, и прах, иже в нем молчанием обитают» — «земля отдаст тех, кто в ней спит, и прах, в котором они молча обитают»; «хранилища издадут вданныя им души» — «хранилища отдадут вверенные им души»."
  33: "«открыется вышний на престоле суда, и пройдут беды, и долготерпение соберется» — «откроется Всевышний на престоле суда, пройдут беды, и долготерпение соберётся (завершится)»."
  34: "«суд же един пребудет, истина станет, и вера возможет» — «суд же один пребудет, истина станет, и вера получит силу»."
  35: "«дело последовати будет, и мзда покажется, и правды воспрянут, и неправды не возобладают» — «дело последует, мзда (награда) явится, правды воспрянут, и неправды не возобладают»."
  36: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «И откроется озеро мучения, а против него место покоя; видна будет печь геенны, а против нея рай сладости» — «откроется озеро мучения, а напротив — место покоя; будет видна печь геенны, а напротив — рай сладости». «ゲヘナ» — транслитерация греческого γέεννα; в слав. тексте этого раздела нет."
  37: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «И скажет тогда Всевышний пробудившимся народам...»; «пробудившимся» — воскрешённым. Речь Всевышнего внутри речи ангела — 『…』."
  38: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «Взгляните прямо перед собою и напротив... Вот что скажешь Ты им в день суда». В ru «Ты» с прописной — обращение к Богу; в японском оставлено нейтральное «あなた», поэтому возможны оба понимания (Бог говорит Ездре или Ездра — Богу)."
  39: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «Этот день таков, что не имеет ни солнца, ни луны, ни звезд»; перечисление продолжается до ст. 42."
  40: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «ни облака, ни грома, ни молнии, ни ветра, ни дождя, ни тумана, ни мрака, ни вечера, ни утра»."
  41: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «ни лета, ни весны, ни жары, ни зимы, ни мороза, ни холода, ни града, ни дождя, ни росы»; «дождь» в ru повторён дважды (ст. 40 и 41) — повтор сохранён."
  42: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «...кроме одного лишь сияния светлости Всевышнего, вследствие чего все могут видеть то, что пред ними»; «предрассветные сумерки» — 夜明け前の薄暗さ."
  43: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «Его длительность будет такая же, как седьмины лет»; «седьмины лет» — семилетия; передано как «年の七つの週», буквально по ru."
  44: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «Таков суд Мой и его порядок. Одному тебе Я открыл это»; это слова Бога в передаче ангела, отдельных кавычек в ru нет, поэтому и в японском они остаются в речи ангела."
  45: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «я говорил уже, и теперь скажу: блаженны живущие и исполняющие заповеданное Тобою»."
  46: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «найдется ли кто из живущих, чтобы не грешил, или найдется ли кто из родившихся, чтобы не нарушал Твоего завета?»"
  47: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «будущий век принесет сладости немногим, а мучения многим»."
  48: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «внутри нас выросло сердце злое... привело нас к тлению и путям смерти... не малое количество, но почти всех, кто был сотворен»."
  49: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «выслушай Меня, и Я наставлю тебя и вразумлю тебя относительно имеющего быть»."
  50: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «Бог и сотворил не один век, а два»; ср. слав. 7:11 «их бо ради сотворих век» — иной ход мысли."
  51: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «праведных не много, но мало, тогда как нечестивых множество»; в японском сохранена двойственность ru."
  52: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «если у тебя будет весьма немного драгоценных камней, то ты станешь складывать их у себя по числу их, свинца же и глины изобилие»; притча-цитата — 『…』."
  53: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «как же это возможно?»"
  54: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «не только это, но спроси землю, и та скажет тебе, подойди к ней с лестью, и та поведает тебе»; «с лестью» понято как «с льстивой, просительной речью» (в латинском тексте — obsecratio, «мольба»)."
  55: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «Ты скажешь ей: ты производишь золото, серебро и медь, а также железо, свинец и глину»; обращение к земле — 『…』 (открывается здесь, закрывается в ст. 56)."
  56: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «Серебра же больше, чем золота, меди больше, чем серебра, железа больше, чем меди, свинца больше, чем железа и глины больше, чем свинца»; перечисление сохранено."
  57: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «Посуди теперь сам, что драгоценно и влечет к себе? То ли, чего много, или то, что является редкостью»."
  58: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «Владыка Господи! Что встречается в избытке, то хуже, а что попадается реже, то драгоценнее»."
  59: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «кто владеет тем, что с трудом добывается, бывает рад больше того, кто обладает тем, что встречается в избытке»."
  60: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «Я рад буду немногим спасшимся, потому что они утвердили ныне владычество Моей славы и на них наречено ныне же Мое имя»; «наречено» — 名が唱えられている."
  61: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «...уподоблены пару и приравнены к огню и дыму. Вот они вспыхнули, запылали и погасли»."
  62: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «о, земля! Что же ты породила, если разум произошел из праха, как и остальная тварь?»; «разум» — 理性."
  63: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «Лучше было бы не появляться самому праху, чтобы из него не возник разум»."
  64: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «разум возрастает вместе с нами, и из-за этого мы мучимся, так как сознательно идем к гибели»."
  65: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «Пусть рыдает род человеческий, и радуются полевые звери; пусть рыдают все, кто родился, и веселятся четвероногие и скоты»; «пусть» передано формой 〜がよい."
  66: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «...они не ждут суда, им не ведомы ни мучения, ни блаженство, обещанные им после смерти»."
  67: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «Что нам пользы в том, что мы будем снова жить, но будем жестоко мучиться?»"
  68: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «все, кто родился, пропитаны беззакониями, полны грехов и отягчены преступлениями»."
  69: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «И быть может, лучше было бы нам, если бы нам не нужно было идти на суд»."
  70: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «раньше, чем Всевышний сотворил век с Адамом и всеми, происшедшими от него, Он приготовил суд и то, что приготовлено к суду»."
  71: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «Теперь же уразумей на основании своих собственных слов»."
  72: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «имея разум, они совершали беззакония и, получая заповеди, не исполняли их, и, будучи последователями закона, отвергали закон, полученный ими»."
  73: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «Что же они имеют сказать на суде, или какой ответ дадут они в ближайшее время?»"
  74: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «...не ради их самих, а ради исполнения предусмотренного Им срока»; в ru стих обрывается без точки, в японском закончен."
  75: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «Будем ли мы после смерти... пребывать в покое, пока не наступят те времена, когда Ты начнешь обновлять тварь, или же тотчас будем терпеть мучения?»"
  76: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «покажу тебе и это. Но ты не смешивай себя с теми, кто презирал, и не причисляй себя к тем, которые терпят мучения»."
  77: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «у тебя есть сокровище дел, сохраняемое у Всевышнего, но оно не будет показано тебе до наступления последнего времени»."
  78: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «...когда выйдет от Всевышнего приговор относительно срока, чтобы умереть человеку, и когда дух выйдет из тела, чтобы снова вернуться к Тому, Кто дал его, для поклонения прежде всего славе Всевышнего»."
  79: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «...души тех, кто презирал и не сохранял путей Всевышнего, пренебрегал Его законом и ненавидел боящихся Бога»."
  80: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «...не войдут в обители, но немедленно начнут в мучениях, в постоянной скорби и печали блуждать по семи путям»."
  81: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «Первый путь это то, что они презрели закон Всевышнего»."
  82: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «Второй путь: они уже не могут принести доброе раскаяние, чтобы жить»."
  83: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «Третий путь: они увидят награду, сохраняемую для тех, кто верен заветам Всевышнего»."
  84: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «Четвертый путь: они увидят мучения, сохраняемые для них на самое последнее время»."
  85: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «Пятый путь: они видят жилища других, охраняемые в глубочайшем молчании ангелами»."
  86: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «Шестой путь: они видят, что немедленно отсюда они перейдут на мучения»."
  87: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «Седьмой путь, превосходящий все названные выше пути... они тают от смятения, их снедает стыд, они изнемогают от страха, при виде славы Всевышнего, перед которой они грешили при жизни и пред которой им предстоит суд в последние времена»."
  88: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «...удел их по разлучению с тленным сосудом будет следующий»; «сосуд» — 器 (тело)."
  89: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «...с трудностями служили Всевышнему и каждый час подвергались опасностям, лишь бы всецело сохранить закон Законодателя»."
  90: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «Поэтому приговор о них будет такой»."
  91: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «Прежде всего они увидят с великою радостью славу Того, Кто принимает их к Себе; покой же они будут вкушать семи видов»; «видов» — 七つの種類."
  92: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «Первый вид это то, что они с великим трудом вели борьбу, с целью преодолеть помышление злое, созданное вместе с ними, чтобы оно не могло отвлекать их от жизни к смерти»."
  93: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «Второй вид: они созерцают смятение, в каком блуждают души нечестивых, и наказание, предстоящее им»."
  94: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «Третий вид: они созерцают данное им их Создателем свидетельство, что они при жизни сохранили закон, ввереный им» (в ru опечатка «ввереный»)."
  95: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «Четвертый вид: они сознают свой покой, которым они наслаждаются ныне, собравшись в своих хранилищах и оберегаемые в глубоком молчании ангелами, и прославление, ожидающее их в последние времена»."
  96: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «Пятый вид: они ликуют по поводу того, что покинули ныне тленное и получат будущее наследие... начинают чувствовать простор, блаженные и бессмертные»."
  97: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «Шестой вид: им показано будет, как лицо их засияет подобно солнцу и они уподобятся по блеску звездам, став тотчас же нетленными»."
  98: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «Седьмой вид, превосходящий все ранее названные: они будут ликовать с уверенностью, надеяться без посрамления и радоваться без страха...»"
  99: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «Таков удел душ праведников, возвещаемый им тотчас же. Ранее были названы пути тех мучений, которые терпят немедленно же грешники»; в ru кавычки речи ангела не закрыты — в японском закрыты здесь."
  100: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «...душам по разлучению их с телом будет дано время, чтобы видеть то, о чем Ты мне сказал?»"
  101: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «семь дней будет длиться их свобода, чтобы они за семь дней увидели то, о чем была выше речь, а после этого они соберутся в свои жилища»."
  102: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «...могут ли в день суда праведники достигнуть оправдания нечестивых или молить за них Всевышнего»."
  103: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «отцы за сыновей, сыновья за родителей, братья за братьев, родственники за своих близких или друзья за дорогих для них лиц»."
  104: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «День суда решительный, и являет всем печать истины. Подобно тому, как ныне отец не посылает сына... с тем, чтобы тот думал за него, или спал или ел, или лечился»."
  105: "В слав. тексте модуля этого раздела нет (слав. гл. 7 — 70 стихов); перевод по русскому Синодальному тексту (ru), стихи 106–140 — по слав. ru: «так никогда никто не будет за кого-либо ходатайствовать, но каждый принесет тогда свои правды или неправды»; в ru кавычки не закрыты — в японском закрыты в конце главы."
  106: "Слав. 7:36 = ru 7:106. Карта главы: слав. 7:1–35 = ru 7:1–35; слав. 7:36–70 = ru 7:106–140; раздел ru 7:36–105 переведён с ru (см. notes 36–105). «первый авраам о содомлянех молился, и моисей за отцы согрешшия в пустыни» — «первым Авраам молился о содомлянах, и Моисей — за отцов, согрешивших в пустыне»."
  107: "«иже по нем за израиля во дни ахаза и самуила» — «кто после него — за Израиля во дни Ахаза и Самуила». В ru список разделён иначе: «Иисус после него — за Израиля во дни Ахана», отдельно «Самуил и Давид»; «ахаза» — вероятно, искажение «Ахана», оставлено по слав."
  108: "«давид о сокрушении» — «Давид о сокрушённых (погубляемых)»; «иже приидоша во освящение» — «которые пришли на освящение»."
  109: "«илиа за тех, иже дождь прияша, и за мертва, да оживет» — «Илия — за тех, кто принял дождь, и за мёртвого, чтобы он ожил»."
  110: "«езекиа за люди во дни сеннахирима, и мнози за многих» — «Езекия — за народ во дни Сеннахирима, и многие — за многих»."
  111: "«аще убо ныне, егда тленное возрасте, и неправда умножена есть, и молишася праведнии за нечестивых, вскую и ныне тако не будет?» — «если ныне, когда тленное возросло и неправда умножилась, праведники молились за нечестивых, почему и ныне так не будет?»"
  112: "«настоящий век не есть конец, слава в нем частая пребывает: того ради молишася за немощных» — «настоящий век не есть конец, слава в нём часто пребывает: потому молились за немощных». ru: «славы в нем часто не бывает» — с отрицанием, иное чтение."
  113: "«день бо судный будет конец времене сего и начало времене будущаго безсмертия, в немже мимоиде тление» — «ибо день судный будет концом времени сего и началом времени будущего бессмертия, когда пройдёт тление»."
  114: "«разрушися невоздержность, отсечено есть неверие, возрасте же правда, возсия истина» — «разрушится невоздержанность, отсечётся неверие, возрастёт правда, воссияет истина»."
  115: "«тогда бо никтоже может спасти того, иже погибе, ни потопити того, иже победи» — «тогда никто не сможет спасти погибшего, ни потопить победившего»."
  116: "«сие есть слово мое первое и последнее» — «это слово моё первое и последнее»; «лучше бе не дати земли адаму, или... удержати его, да не согрешит» — «лучше было не давать земли Адаму или... удержать его, чтобы не согрешил»."
  117: "«что бо пользует человеком в настоящем веце жити в скорби, и мертвым чаяти казни?» — «какая польза людям в настоящем веке жить в скорби и мёртвым ожидать наказания?»"
  118: "«о, что сотворил еси, адаме? аще бо ты согрешил еси, не единаго тебе сотворися падение, но и наше, иже от тебе произыдохом» — «о, что сделал ты, Адам? когда ты согрешил, падение совершилось не одного тебя, но и наше, происшедших от тебя»."
  119: "«что бо пользует нам, аще обещано есть нам безсмертное время, мы же смертная дела соделахом?» — «какая польза нам, если обещано нам бессмертное время, а мы делали смертные дела?»"
  120: "«яко предреченно есть нам вечное упование, мы же строптивии суетни сотворихомся?» — «когда нам предречено вечное упование, а мы, строптивые, сделались суетными?»"
  121: "«яко отложена суть нам жилища здравия и покоя, мы же лукаво жили есмы?» — «когда отложены нам жилища здравия и покоя, а мы жили лукаво?»"
  122: "«яко предуготована есть слава вышняго защитити тех, иже позде пожиша» — «когда предуготована слава Всевышнего, чтобы защитить тех, кто поздно пожил»; «мы же по стропотным путем ходихом» — «а мы ходили по стропотным путям»."
  123: "«показан будет рай, егоже плод нерастлен пребывает, в немже есть покой и врачба» — «показан будет рай, плод которого пребывает нетленным, в котором покой и врачевание»."
  124: "«мы же не внидем, в неблагодарных бо местех пожихом?» — «а мы не войдём, ибо жили в местах неблагодарных?». ru: «в местах неплодных» — истолкование."
  125: "«яко паче звезд возблистают лица тех, иже воздержание имеяху, наша же лица паче тмы черна?» — «когда лица тех, кто имел воздержание, воссияют паче звёзд, а наши лица — чернее тьмы?»"
  126: "«не помышляхом живуще, егда беззаконие творихом, яко имамы по смерти терпети» — «мы, живя, не помышляли, когда творили беззаконие, что по смерти будем терпеть»."
  127: "«сие есть помышление подвига, имже подвизатися будет на земли рожденный человек» — «это помышление подвига, которым должен подвизаться на земле рождённый человек»."
  128: "«да аще побежден будет, претерпит еже рекл еси, аще же победит, восприимет еже глаголю» — «чтобы, если будет побеждён, претерпел то, что ты сказал, а если победит, получил то, что Я говорю»."
  129: "«сей есть живот, о немже моисей рече, егда живяше, к людем, глаголя: избери себе живот, да живеши» — «это жизнь, о которой Моисей сказал, когда жил, народу, говоря: избери себе жизнь, чтобы жить». Слова Моисея — 『…』."
  130: "«не вероваша же ему, но ни после его пророком, ниже мне, иже глаголал есмь им» — «не поверили ему, ни пророкам после него, ни Мне, говорившему им»."
  131: "«яко не была бы скорбь в погубление их, якоже будет радость тем, имже усоветовано есть спасние» — «ибо не было бы скорби о погибели их, как будет радость тем, кому уготовано спасение»."
  132: "«вем, Господи, яко назван есть вышний милосерд, понеже помилует тех, иже не у в век приидоша» — «знаю, Господи, что Всевышний назван милосердым, потому что помилует тех, кто ещё не пришёл в мир»."
  133: "«яко милует тех, иже житие творят по закону его» — «и милует тех, кто проводит жизнь по закону Его»."
  134: "«долготерпелив есть, яко долготерпит сим, иже согрешиша, яко своему творению» — «долготерпелив, ибо долготерпит согрешившим, как Своему творению»."
  135: "«щедр есть датель, яко даяти хощет по требованием» — «щедр как даятель, ибо хочет давать по потребностям»."
  136: "«многомилосерд, понеже умножает милосердие тем, иже и настоящии суть, и иже минуша, и иже будут» — «многомилостив, ибо умножает милость нынешним, и прошедшим, и будущим»."
  137: "«аще бо не умножит милосердия своего, не оживет век с теми, иже наследят в нем, и дарствует» — «ибо если не умножит милости Своей, не будет жить век с теми, кто наследует в нём, и дарует». Конец стиха в слав. тёмен («и дарствует»), вероятно, повтор начала ст. 138."
  138: "«аще бы не дарствовал от благости своея, да облегчатся сии, иже беззаконие сотвориша от своих беззаконий, то не возмогла бы десятотысящная часть жива быти человеков» — «если бы Он не даровал по благости Своей, чтобы облегчились те, кто сотворил беззаконие, от беззаконий своих, то не могла бы и десятитысячная часть людей остаться живой»."
  139: "«и судия, аще бы не простил оным, иже изцелени суть словом его, и потребил бы множество распрей» — «и Судия, если бы не простил тех, кто исцелён словом Его, и не истребил множество распрей»; ru: «которые сотворены словом Его» и «множества преступлений» — иные чтения."
  140: "«не бы осталися быша в безчисленнем множестве, разве мали зело» — «не осталось бы в бесчисленном множестве разве что весьма немногие»."
