  59: "彼[かれ]は答[こた]えてわたしに言[い]った。「あなたが思[おも]ったことを、心[こころ]の内[うち]で量[はか]ってみなさい。苦労[くろう]して手[て]に入[い]れるものを所有[しょゆう]する者[もの]は、あり余[あま]るほどあるものを所有[しょゆう]する者[もの]よりも、もっと喜[よろこ]ぶ。"
