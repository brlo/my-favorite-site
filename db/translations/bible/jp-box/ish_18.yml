verses:
  1: "エテロは、ミディアンの祭司[さいし]で、モーセのしゅうとであった。彼[かれ]は、主[しゅ]がイスラエルとご自分[じぶん]の民[たみ]のために行[おこな]われたすべてのこと、すなわち主[しゅ]がイスラエルをエジプトから導[みちび]き出[だ]されたことを聞[き]いた。"
  2: "エテロは、モーセの妻[つま]ツィポラを連[つ]れて来[き]た。彼女[かのじょ]は、かつてモーセのもとから送[おく]り返[かえ]されていたのである。"
  3: "そして、二人[ふたり]の子[こ]も連[つ]れて来[き]た。一[ひと]人[り]の名[な]はゲルションといい、彼[かれ]は言[い]った。「わたしは異国[いこく]の地[ち]に寄留[きりゅう]する者[もの]であった。」"
  4: "もう一[ひと]人[り]の名[な]はエリエゼルといい、彼[かれ]は言[い]った。「父[ちち]の神[かみ]がわたしの助[たす]け手[て]となり、ファラオの手[て]からわたしを救[すく]い出[だ]してくださった。」"
  5: "エテロは、モーセの子[こ]らと妻[つま]を連[つ]れて、荒[あ]れ野[の]へ、モーセが神[かみ]の山[やま]のふもとに宿営[しゅくえい]しているところへ来[き]た。"
  6: "モーセに告[つ]げる者[もの]があった。「見[み]よ、あなたのしゅうとエテロが、あなたの妻[つま]と二人[ふたり]の子[こ]らとともに、あなたのところへ来[き]ている。」"
  7: "モーセはしゅうとを迎[むか]えに出[で]て、彼[かれ]に礼[れい]をし、口[くち]づけをした。そして互[たがい]に挨拶[あいさつ]を交[か]わした後[あと]、彼[かれ]を天幕[てんまく]の中[なか]へ招[まね]き入[い]れた。"
  8: "モーセはしゅうとに、主[しゅ]がファラオとエジプト人[じん]たちにイスラエルのために行[おこな]われたすべてのこと、道[みち]で彼[かれ]らに起[お]こったすべての労苦[ろうく]、そして主[しゅ]が彼[かれ]らをファラオの手[て]とエジプト人[じん]たちの手[て]から救[すく]い出[だ]されたことを話[はな]した。"
  9: "エテロは、主[しゅ]がイスラエルに与[あた]えられたすべての善[よ]いこと、すなわち彼[かれ]らをエジプト人[じん]の手[て]とファラオの手[て]から救[すく]い出[だ]されたことに驚[おどろ]いた。"
  10: "エテロは言[い]った。「主[しゅ]は讃[ほめ]たたえられる。主[しゅ]は、ご自分[じぶん]の民[たみ]をエジプト人[じん]の手[て]とファラオの手[て]から救[すく]い出[だ]された。"
  11: "今[いま]、わたしは知[し]った。主[しゅ]はすべての神[かみ]々[がみ]よりも大[おお]きい。彼[かれ]らがイスラエルに高[たか]ぶって迫[せま]った、そのことのゆえに。」"
  12: "エテロは神[かみ]に燔祭[はんさい]と犠牲[ぎせい]を献[ささ]げた。アロンとイスラエルの長老[ちょうろう]たちはすべて来[き]て、モーセのしゅうととともに、神[かみ]の前[まえ]でパンを食[た]べた。"
  13: "その翌日[よくじつ]、モーセは民[たみ]を裁[さば]くために座[すわ]った。民[たみ]はすべて、朝[あさ]から夕[ゆう]べまでモーセの前[まえ]に立[た]っていた。"
  14: "しゅうとは、モーセが民[たみ]に行[おこな]っているすべてのことを見[み]て言[い]った。「あなたが民[たみ]に行[おこな]っているこれは何[なん]か。なぜ、あなたは一[ひと]人[り]で座[すわ]り、民[たみ]はすべて朝[あさ]から夕[ゆう]べまであなたの前[まえ]に立[た]っているのか。」"
  15: "モーセはしゅうとに言[い]った。「民[たみ]は、神[かみ]の裁[さば]きを求[もと]めて、わたしのところへ来[く]るからである。"
  16: "彼[かれ]らに争[あらそ]いごとが起[お]こると、わたしのところへ来[く]る。わたしはそれぞれの間[あいだ]を裁[さば]き、神[かみ]の定[さだ]めとその律法[りっぽう]を彼[かれ]らに告[つ]げる。」"
  17: "しゅうとは彼[かれ]に言[い]った。「あなたがしているこのことは、よくない。"
  18: "あなたは耐[た]え難[がた]い疲[つか]れによって、あなたも、あなたとともにいるこの民[たみ]も、すっかり衰[おとろ]えてしまう。このことはあなたにとって重[おも]すぎる。あなたは一[ひと]人[り]で行[おこな]うことはできない。"
  19: "今[いま]、わたしの言[い]うことを聞[き]きなさい。あなたに助言[じょげん]しよう。そうすれば、神[かみ]があなたとともにいてくださる。あなたは民[たみ]のために、神[かみ]に対する事[こと]柄[がら]の仲介者[ちゅうかいしゃ]となり、彼[かれ]らの言葉[ことば]を神[かみ]のもとへ携[たずさ]えて行[い]きなさい。"
  20: "そして、神[かみ]の定[さだ]めとその律法[りっぽう]を彼[かれ]らに証[あかし]し、彼[かれ]らが歩[あゆ]むべき道[みち]と、行[おこな]うべき業[わざ]を彼[かれ]らに示[しめ]しなさい。"
  21: "あなたはまた、民[たみ]すべての中[なか]から、神[かみ]を畏[おそ]れ、正[ただ]しく、高慢[こうまん]を憎[にく]む、力[ちから]ある人[ひと]々[びと]を選[えら]び出[だ]し、彼[かれ]らを民[たみ]の上[うえ]に、千人[せんにん]の長[ちょう]、百人[ひゃくにん]の長[ちょう]、五十人[ごじゅうにん]の長[ちょう]、十人[じゅうにん]の長[ちょう]として立[た]てなさい。"
  22: "彼[かれ]らが、どんなときにも民[たみ]を裁[さば]くようにしなさい。大[おお]きな事[こと]はすべてあなたのところへ持[も]って来[こ]させ、小[ちい]さな裁[さば]きは彼[かれ]ら自身[じしん]で行[おこな]わせなさい。そうすれば、あなたの負担[ふたん]は軽[かる]くなり、彼[かれ]らもあなたとともに荷[に]を負[お]う。"
  23: "もし、あなたがこのことを行[おこな]い、神[かみ]があなたを強[つよ]くし、あなたが耐[た]えられるなら、この民[たみ]はすべて、自分[じぶん]の場所[ばしょ]へ平和[へいわ]のうちに帰[かえ]って行[い]く。」"
  24: "モーセはしゅうとの言葉[ことば]を聞[き]き、彼[かれ]が言[い]ったすべてのことを行[おこな]った。"
  25: "モーセはイスラエルすべての中[なか]から、力[ちから]ある人[ひと]々[びと]を選[えら]び、彼[かれ]らを民[たみ]の上[うえ]に、千人[せんにん]の長[ちょう]、百人[ひゃくにん]の長[ちょう]、五十人[ごじゅうにん]の長[ちょう]、十人[じゅうにん]の長[ちょう]として立[た]てた。"
  26: "彼[かれ]らはどんなときにも民[たみ]を裁[さば]いた。大[おお]きな事[こと]はモーセのところへ持[も]って行[い]き、小[ちい]さな事[こと]はすべて自分[じぶん]たちで裁[さば]いた。"
  27: "モーセはしゅうとを送[おく]り出[だ]し、彼[かれ]は自分[じぶん]の地[ち]へ帰[かえ]って行[い]った。"

notes:
  1: "Ἤκουσεν δὲ Ιοθορ ὁ ἱερεὺς Μαδιαμ — エテロ (LXX Ἰοθόρ; евр. יִתְרוֹ; форма エテロ — японская традиция 口語訳). ὁ γαμβρὸς Μωυσῆ — тесть Моисея (γαμβρός; в LXX здесь именно тесть, しゅうと). ὁ ἱερεὺς Μαδιαμ — 祭司 мадиамский (Мадиам — ミディアン). ἐξήγαγεν γὰρ κύριος τὸν Ισραηλ — ибо вывел Господь Израиля."
  2: "Σεπφωραν — Сепфора (ツィポラ — японская форма; евр. Циппора). μετὰ τὴν ἄφεσιν αὐτῆς — после отпущения её (ἄφεσις — отпущение, освобождение)."
  3: "Γηρσαμ — Гирсам (LXX Γηρσάμ; ゲルション — японская форма). Πάροικος ἤμην ἐν γῇ ἀλλοτρίᾳ — «я был пришельцем в земле чужой» (πάροικος — пришелец, 寄留の者)."
  4: "Ελιεζερ — Елиезер. Ὁ γὰρ θεὸς τοῦ πατρός μου βοηθός μου — Бог отца моего — помощник мой (βοηθός). ἐξείλατό με ἐκ χειρὸς Φαραω — избавил меня от руки фараона (ἐξαιρέω)."
  5: "ἐξῆλθεν — вышел (Иофор выходит к Моисею; ср. 18:7). οὗ παρενέβαλεν ἐπ᾿ ὄρους τοῦ θεοῦ — где он расположился станом у горы Божией (παρεμβάλλω)."
  6: "ἀνηγγέλη … λέγοντες — возвещено было, говоря (безличная конструкция с прич. мн.). Ἰδοὺ ὁ γαμβρός σου … παραγίνεται — вот, тесть твой идёт (praesens, живая речь)."
  7: "ἐξῆλθεν εἰς συνάντησιν — вышел навстречу. προσεκύνησεν — поклонился (προσκυνέω). ἐφίλησεν — поцеловал (φιλέω). ἠσπάσαντο ἀλλήλους — приветствовали друг друга (ἀσπάζομαι). εἰς τὴν σκηνήν — в шатёр (σκηνή)."
  8: "διηγήσατο — рассказал (διηγέομαι). τὸν μόχθον τὸν γενόμενον αὐτοῖς — тяготы, бывшие им (μόχθος). ἐξείλατο … ἐκ χειρὸς Φαραω καὶ ἐκ χειρὸς τῶν Αἰγυπτίων — избавил от руки фараона и от руки египтян (LXX повторяет оба)."
  9: "ἐξέστη δὲ Ιοθορ ἐπὶ πᾶσι τοῖς ἀγαθοῖς — изумился Иофор всем благам (ἐξίστημι — изумляться; Синодальный «радовался» — по масоретскому чтению)."
  10: "Εὐλογητὸς κύριος — благословен, хвалим Господь (εὐλογητός). ἐξείλατο τὸν λαὸν αὐτοῦ — избавил народ Свой."
  11: "νῦν ἔγνων — ныне познал я. μέγας κύριος παρὰ πάντας τοὺς θεούς — велик Господь паче всех богов (παρά + вин. сравнения). ἕνεκεν τούτου ὅτι ἐπέθεντο αὐτοῖς — «потому что они налегли на них» (ἐπιτίθημι — нападать, надмеваться; слав. «налегоша»)."
  12: "ὁλοκαυτώματα καὶ θυσίας — всесожжения и жертвы. συμφαγεῖν ἄρτον — есть хлеб вместе (συνεσθαι). ἐναντίον τοῦ θεοῦ — пред Богом."
  13: "συνεκάθισεν Μωϋσῆς κρίνειν τὸν λαόν — сел Моисей судить народ (συγκαθίζω). παρειστήκει — предстоял (pluperf.). ἀπὸ πρωίθεν ἕως ἑσπέρας — с утра до вечера."
  14: "λέγει — говорит (praesens historicum, обычное в LXX). Τί τοῦτο, ὃ σὺ ποιεῖς — что это, что ты делаешь. ἀπὸ πρωίθεν ἕως δείλης — с утра до пополудни (δείλη)."
  15: "Παραγίνεται πρός με ὁ λαὸς ἐκζητῆσαι κρίσιν παρὰ τοῦ θεοῦ — приходит ко мне народ искать суда от Бога (ἐκζητέω, κρίσις)."
  16: "ἀντιλογία — распря, спор (ἀντιλογία). διακρίνω ἕκαστον — рассуждаю каждого. συμβιβάζω — вразумляю, объясняю (συμβιβάζω). τὰ προστάγματα τοῦ θεοῦ — повеления Божии (πρόσταγμα)."
  17: "Οὐκ ὀρθῶς σὺ ποιεῖς τὸ ῥῆμα τοῦτο — не хорошо ты делаешь это дело (ὀρθῶς — правильно)."
  18: "φθορᾷ καταφθαρήσῃ ἀνυπομονήτῳ — «тлением истлеешь несносным» (удвоение корня φθορ-; ἀνυπόμονος — невыносимый). βαρύ σοι τὸ ῥῆμα τοῦτο — тяжело тебе это дело. οὐ δυνήσῃ ποιεῖν μόνος — не сможешь делать один."
  19: "συμβουλεύσω σοι — дам тебе совет. γίνου σὺ τῷ λαῷ τὰ πρὸς τὸν θεόν — будь ты народу в том, что к Богу (т. е. посредником). ἀνοίσεις τοὺς λόγους αὐτῶν — вознесешь слова их (ἀναφέρω)."
  20: "διαμαρτυρῇ — засвидетельствуешь, научишь (διαμαρτύρομαι). σημανεῖς — укажешь (σημαίνω). τὰς ὁδοὺς ἐν αἷς πορεύσονται — пути, по которым пойдут."
  21: "σκέψαι — усмотри (σκέπτομαι). ἄνδρας δυνατοὺς θεοσεβεῖς — мужей сильных, богобоязненных (θεοσεβής). μισοῦντας ὑπερηφανίαν — ненавидящих гордость (ὑπερηφανία; в масоретском — «корысть», так в Синодальном). χιλιάρχους, ἑκατοντάρχους, πεντηκοντάρχους, δεκαδάρχους — тысяченачальники, стоначальники, пятидесятиначальники, десятиначальники."
  22: "τὸ ῥῆμα τὸ ὑπέρογκον — дело превышающее (ὑπέρογκος — чрезмерный). ἀνοίσουσιν ἐπὶ σέ — понесут к тебе. κουφιοῦσιν ἀπὸ σοῦ — облегчат тебя (κουφίζω). συναντιλήμψονταί σοι — понесут вместе с тобой (συναντιλαμβάνομαι)."
  23: "κατισχύσει σε ὁ θεός — укрепит тебя Бог (κατισχύω). δυνήσῃ παραστῆναι — сможешь устоять (παρίστημι). εἰς τὸν ἑαυτοῦ τόπον μετ᾿ εἰρήνης ἥξει — в своё место с миром придёт."
  24: "ἤκουσεν τῆς φωνῆς τοῦ γαμβροῦ — послушал голоса тестя (ἀκούω + род.). ἐποίησεν ὅσα αὐτῷ εἶπεν — сделал всё, что он сказал."
  25: "ἐπέλεξεν — избрал (ἐπιλέγω). ἀπὸ παντὸς Ισραηλ — из всего Израиля. ἐποίησεν αὐτοὺς ἐπ᾿ αὐτῶν — поставил их над ними."
  26: "ἐκρίνοσαν — судили (имперфект). ἀνεφέροσαν — приносили к Моисею. ἐλαφρόν — лёгкое (противоположно ὑπέρογκον)."
  27: "ἐξαπέστειλεν — отпустил (ἐξαποστέλλω). ἀπῆλθεν εἰς τὴν γῆν αὐτοῦ — пошёл в землю свою."
