verses:
  1: "そのころ、イスラエルには王がなかった。同[おな]じころ、ダンの部族[ぶぞく]は、住[す]むべき嗣業[しぎょう]を自分[じぶん]たちのために求[もと]めていた。その日[ひ]まで、イスラエルの部族の間[あいだ]で、嗣業がまだ彼[かれ]に割[わ]り当[あ]てられていなかったからである。"
  2: "ダンの子[こ]らは、自分[じぶん]たちの氏族[しぞく]のうちから、すなわちその一部[いちぶ]から、ツォルアとエシュタオルから五人[ごにん]の勇士[ゆうし]を遣[つか]わして、地[ち]を探[さぐ]り、詳[くわ]しく調[しら]べさせた。彼[かれ]らは言[い]った。「行[い]って、その地を調べなさい。」彼らはエフライムの山[やま]のミカの家[いえ]まで来[き]て、そこに泊[と]まった。"
  3: "彼[かれ]らがミカの家[いえ]のそばまで来[き]たとき、若[わか]いレビ人[びと]の声[こえ]を聞[き]き分[わ]け、そこへ向[む]きを変[か]えて、彼に尋[たず]ねた。「あなたをここまで連[つ]れて来たのはだれか。ここで何[なに]をしているのか。ここに何の用[よう]があるのか。」"
  4: "彼[かれ]は彼らに言[い]った。「ミカはわたしにこういうふうにしました。わたしを雇[やと]い、わたしは彼の祭司[さいし]になりました。」"
  5: "彼[かれ]らは彼に言[い]った。「どうか、神[かみ]に問[と]うてください。そうすれば、わたしたちが行[い]く道[みち]がうまく運[はこ]ぶかどうか、知[し]ることができるでしょう。」"
  6: "祭司[さいし]は彼[かれ]らに言[い]った。「平安[へいあん]のうちに行[い]きなさい。あなたがたが行く道[みち]は主[しゅ]の前[まえ]にある。」"
  7: "五人[ごにん]は行[い]って、ライシュに来[き]た。彼[かれ]らは、そこに住[す]む民[たみ]が、シドン人[じん]のならわしに従[したが]って望[のぞ]みのうちに住み、望みのうちに静[しず]かに、何[なに]ひとつ言[い]う力[ちから]もなくいるのを見[み]た。彼らはシドンから遠[とお]く離[はな]れ、シリアとの関[かか]わりもなかったからである。"
  8: "五人[ごにん]は自分[じぶん]たちの兄弟[きょうだい]たちのところ、ツォルアとエシュタオルへ帰[かえ]って来[き]た。兄弟たちは彼[かれ]らに言[い]った。「あなたがたはなぜまだ座[すわ]っているのか。」"
  9: "彼[かれ]らは言[い]った。「立[た]ち上[あ]がって、彼らに向[む]かって上[のぼ]ろう。わたしたちはこの地[ち]に入[はい]って、ライシュまで歩[ある]き回[まわ]った。見[み]よ、そこに住[す]む民[たみ]は、シドン人[じん]のならわしに従[したが]って望[のぞ]みのうちに安[やす]らかに暮[く]らし、シドンから遠[とお]く離[はな]れ、シリアとの関[かか]わりもない。しかし、立ち上がって上ろう。わたしたちはその地を見つけた。見よ、それは非常[ひじょう]に良[よ]い。あなたがたは黙[だま]っているのか。ためらわずに行[い]って、その地に入り、それを嗣業[しぎょう]として受[う]け継[つ]ごうではないか。"
  10: "あなたがたが入[はい]るとき、あなたがたは安心[あんしん]している民[たみ]のところへ行[い]く。その地[ち]は広[ひろ]く、神[かみ]はそれをあなたがたの手[て]に渡[わた]しておられる。そこは、地にあるすべてのものに乏[とぼ]しいことのない場所[ばしょ]である。」"
  11: "ダンの氏族[しぞく]から、ツォルアとエシュタオルから、武具[ぶぐ]を身[み]につけた六百人[ろくひゃくにん]の者[もの]たちが出[で]て行[い]った。"
  12: "彼[かれ]らは上[のぼ]って、ユダのキリアト・ヤリムに陣[じん]を張[は]った。それゆえ、その場所[ばしょ]は今日[こんにち]までダンの陣と呼[よ]ばれている。見[み]よ、それはキリアト・ヤリムの後[うし]ろにある。"
  13: "彼[かれ]らはそこから進[すす]み、エフライムの山[やま]まで来[き]て、ミカの家[いえ]に着[つ]いた。"
  14: "地[ち]を探[さぐ]りに行[い]った五人[ごにん]の者[もの]たちは言[い]った。「あなたがたは、この家々[いえいえ]にエフォドとテラフィム、彫[ほ]り物[もの]と鋳物[いもの]があるのを知[し]っているか。今[いま]、どうするかを考[かんが]えなさい。」"
  15: "彼[かれ]らはそこへ寄[よ]って、若[わか]いレビ人[びと]の家[いえ]、すなわちミカの家に入[はい]り、彼に挨拶[あいさつ]した。"
  16: "武具[ぶぐ]を身[み]につけた六百人[ろくひゃくにん]のダンの子[こ]らは、門[もん]の戸口[とぐち]に立[た]っていた。"
  17: "地[ち]を探[さぐ]りに行[い]った五人[ごにん]の者[もの]たちは上[のぼ]って行き、そこへ入[はい]って、彫[ほ]り物[もの]、エフォド、テラフィム、鋳物[いもの]を取[と]った。祭司[さいし]は門[もん]の戸口[とぐち]のそばに、武具[ぶぐ]を身[み]につけた六百人[ろくひゃくにん]とともに立[た]っていた。"
  18: "彼[かれ]らはミカの家[いえ]に入[はい]って、彫[ほ]り物[もの]、エフォド、テラフィム、鋳物[いもの]を取[と]った。祭司[さいし]は彼らに言[い]った。「あなたがたは何[なに]をしているのか。」"
  19: "彼[かれ]らは彼に言[い]った。「黙[だま]れ。あなたの手[て]を口[くち]に当[あ]てて、わたしたちとともに来[き]なさい。わたしたちの父[ちち]となり、祭司[さいし]となりなさい。一人[ひとり]の男[おとこ]の家[いえ]の祭司であるより、イスラエルの部族[ぶぞく]と氏族[しぞく]の祭司となるほうが、よくはないか。」"
  20: "祭司[さいし]の心[こころ]は喜[よろこ]び、彼[かれ]はエフォド、テラフィム、彫[ほ]り物[もの]、鋳物[いもの]を取[と]って、民[たみ]の中[なか]に入[はい]って行[い]った。"
  21: "彼[かれ]らは向[む]きを変[か]えて出[で]て行[い]った。そして、家[いえ]の者[もの]たち全員[ぜんいん]と、その尊[とうと]い財産[ざいさん]を自分[じぶん]たちの前[まえ]に進[すす]ませた。"
  22: "彼[かれ]らがミカの家[いえ]から遠[とお]く離[はな]れたとき、見[み]よ、ミカと、ミカとともにその家にいた者[もの]たちが、ダンの子[こ]らの後[あと]を追[お]って叫[さけ]んだ。"
  23: "ダンの子[こ]らは顔[かお]を向[む]け直[なお]して、ミカに言[い]った。「どうしたというのか。なぜ叫[さけ]ぶのか。」"
  24: "ミカは言[い]った。「あなたがたは、わたしが自分[じぶん]のために造[つく]ったわたしの彫[ほ]り物[もの]と祭司[さいし]を取[と]って行[い]った。わたしにまだ何[なに]が残[のこ]っているというのか。どうしてあなたがたは、わたしに『なぜ叫[さけ]ぶのか』と言うのか。」"
  25: "ダンの子[こ]らは彼[かれ]に言[い]った。「あなたの声[こえ]がわたしたちのもとで聞[こ]えてはならない。心[こころ]を痛[いた]めた者[もの]たちがあなたがたに襲[おそ]いかかり、あなたは自分[じぶん]の命[いのち]も、あなたの家[いえ]の命も失[うしな]うことになるかもしれない。」"
  26: "ダンの子[こ]らは自分[じぶん]たちの道[みち]を行[い]った。ミカは、彼[かれ]らが自分より強[つよ]いのを見[み]て、向[む]きを変[か]えて自分の家[いえ]に帰[かえ]った。"
  27: "彼[かれ]らはミカが造[つく]ったものと、彼のところにいた祭司[さいし]を取[と]って、ライシュへ行[い]き、安[やす]んじて暮[く]らす民[たみ]のところへ行って、彼らを剣[つるぎ]の刃[は]にかけて打[う]ち、その町[まち]を火[ひ]で焼[や]いた。"
  28: "そして、助[たす]ける者[もの]はなかった。彼[かれ]らはシドン人[じん]から遠[とお]く離[はな]れ、人々[ひとびと]との関[かか]わりもなく、またその町[まち]はロオブの家[いえ]の谷[たに]にあったからである。彼らはその町を建[た]て直[なお]して、そこに住[す]んだ。"
  29: "彼[かれ]らはその町[まち]の名[な]を、イスラエルに生[う]まれた自分[じぶん]たちの父[ちち]の名にちなんでダンと呼[よ]んだ。その町の名は、以前[いぜん]はライシュであった。"
  30: "ダンの子[こ]らは、ミカの彫[ほ]り物[もの]を自分[じぶん]たちのために立[た]てた。モーセの子ゲルソムの子ヨナタンと、その子らは、この地[ち]が移[うつ]される日[ひ]まで、ダンの部族[ぶぞく]の祭司[さいし]であった。"
  31: "彼[かれ]らはミカが造[つく]った彫[ほ]り物[もの]を、神[かみ]の家[いえ]がシロにあったすべての日々[ひび]、自分[じぶん]たちのために据[す]えていた。"

notes:
  1: "ἐζήτει ἡ φυλὴ τοῦ Δαν ἑαυτῇ κληρονομίαν — «искало колено Даново себе удел». οὐκ ἔπεσεν αὐτῇ … κληρονομία — «не выпал ему удел» (κλήρος, жребий); передано «не было отведено». ἕως τῶν ἡμερῶν ἐκείνων — «до тех дней»."
  2: "ἐκ τῶν συγγενειῶν αὐτῶν … ἀπὸ μέρους αὐτῶν — «из родов своих… из части своей». υἱοὺς δυνάμεως — «сынов силы», т. е. мужей крепких. ἐκ Σαραα καὶ Εσθαολ — из Цоры и Естаола (ツォルア, エシュタオル). τοῦ κατασκέψασθαι … καὶ ἐξιχνιᾶσαι — «осмотреть… и разведать» (κατασκέπτομαι, ἐξιχνιάζω — выследить). κατέπαυσαν ἐκεῖ — «остановились там»; в csl добавлено «в дому михи» (в гр. нет; отсюда не в 〔〕, а в notes)."
  3: "ἐπέγνωσαν τὴν φωνὴν τοῦ παιδαρίου τοῦ νεωτέρου τοῦ Λευίτου — «узнали голос юноши, младшего левита» (ἐπιγινώσκω — узнать по голосу). ἐξέκλιναν ἐκεῖ — «свернули туда». Τίς ἤγαγέν σε ὧδε — «кто привёл тебя сюда?»"
  4: "Οὕτως καὶ οὕτως ἐποίησέν μοι — «то и то сделал мне» (обычная формула неопределённого рассказа). ἐμισθώσατό με — «нанял меня» (μισθόω). γεγένημαι αὐτῷ εἰς ἱερέα — «стал ему священником»."
  5: "Ἐπερώτησον δὴ ἐν τῷ θεῷ — «спроси у Бога» (ἐπερωτάω; ἐν τῷ θεῷ — «у Бога», т. е. через святилище/ефод). εἰ κατευοδοῖ ἡ ὁδὸς ἡμῶν — «благоуспешен ли путь наш» (κατευοδόω)."
  6: "Πορεύεσθε εἰς εἰρήνην — «идите с миром» (формула; не безусловное обещание). ἐνώπιον κυρίου ἡ ὁδὸς ὑμῶν — «пред Господом путь ваш»."
  7: "καθῆσθαι ἐν ἐλπίδι κατὰ τὴν σύγκρισιν τῶν Σιδωνίων — «сидеть в надежде, по обычаю сидонян» (σύγκρισις — «устройство, обычай»); ἐν ἐλπίδι повторено дважды, как в гр. ἡσυχάζοντας — «пребывающих в покое». μὴ δυναμένους λαλῆσαι ῥῆμα — «не могущих сказать слова», т. е. беззащитных. λόγος οὐκ ἦν αὐτοῖς μετὰ Συρίας — «дела не было у них с Сирией»; csl добавляет «не бе устрашаяй, или посрамляй…» — этого в гр. нет."
  8: "Τί ὑμεῖς κάθησθε; — букв. «что вы сидите?» (κάθημαι). В масор. и ru иное чтение: «с чем вы (пришли)?»; держимся гр."
  9: "εἰσήλθαμεν καὶ ἐνεπεριεπατήσαμεν ἐν τῇ γῇ ἕως Λαισα — «вошли и исходили землю до Лаиса». ἐν ἐλπίδι κατὰ τὸ σύγκριμα τῶν Σιδωνίων — снова «в надежде, по обычаю сидонян». μακρὰν ἀπέχοντες ἐκ Σιδῶνος — «далеко отстоя от Сидона». ἀγαθὴ σφόδρα — «весьма хороша». μὴ ὀκνήσητε — «не медлите» (ὀκνέω)."
  10: "ἥξετε πρὸς λαὸν πεποιθότα — «придёте к народу уповающему», т. е. беспечному. εὐρύχωρος — «обширная». παρέδωκεν αὐτὴν ὁ θεὸς ἐν χειρὶ ὑμῶν — «предал её Бог в руки ваши». τόπος, οὗ οὐκ ἔστιν ἐκεῖ ὑστέρημα παντὸς ῥήματος — «место, где нет недостатка ни в чём» (ῥῆμα здесь «вещь, дело»)."
  11: "ἀπῆραν — «снялись (с места)». ἑξακόσιοι ἄνδρες περιεζωσμένοι σκεύη πολεμικά — «шестьсот мужей, опоясанных воинскими доспехами» (περιζώννυμι)."
  12: "παρενεβάλοσαν ἐν Καριαθιαριμ ἐν Ιουδα — «стали станом в Кириаф-Иариме в Иуде». Παρεμβολὴ Δαν — «стан Дан» (παρεμβολή). ἰδοὺ κατόπισθεν Καριαθιαριμ — «вот, позади Кириаф-Иарима»."
  13: "παρῆλθαν … ἦλθαν ἕως τοῦ ὄρους Εφραιμ καὶ ἦλθον ἕως οἴκου Μιχα — «прошли… до горы Ефремовой и пришли к дому Михи»."
  14: "οἱ πορευόμενοι κατασκέψασθαι τὴν γῆν — «ходившие осмотреть землю». Εἰ οἴδατε ὅτι — «знаете ли, что» (οἶδα в значении «знать»). γλυπτὸν καὶ χωνευτόν — «резное и литое». γνῶτε τί ποιήσετε — «узнайте (решите), что сделаете»."
  15: "ἐξέκλιναν ἐκεῖ — «свернули туда». εἰς τὸν οἶκον τοῦ παιδαρίου τοῦ Λευίτου εἰς τὸν οἶκον Μιχα — «в дом юноши левита, в дом Михи» (двойное уточнение). ἠσπάσαντο — «приветствовали»."
  16: "ἐστηλωμένοι παρὰ τὴν θύραν τοῦ πυλῶνος — «стоявшие у двери ворот» (ἐστηλωμένοι, perf. part. от ἵστημι). οἱ ἐκ τῶν υἱῶν Δαν — «из сынов Дановых»."
  17: "ἐπελθόντες ἐκεῖ ἔλαβον — «войдя туда, взяли». Перечисление: γλυπτόν, εφουδ, θεραφιν, χωνευτόν — 彫り物、エフォド、テラフィム、鋳物. ὁ ἱερεὺς ἐστηλωμένος παρὰ τῇ θύρᾳ — «священник, стоявший у двери»."
  18: "καὶ οὗτοι εἰσῆλθον εἰς οἶκον Μιχα — «и эти вошли в дом Михи» (οὗτοι — те же пять). Τί ὑμεῖς ποιεῖτε; — «что вы делаете?»"
  19: "Κώφευσον — «замолчи» (κωφεύω). ἐπίθες τὴν χεῖρά σου ἐπὶ τὸ στόμα σου — «положи руку на уста». εἰς πατέρα καὶ εἰς ἱερέα — «в отца и в священника». μὴ βέλτιον …; — вопрос, ожидающий утвердительного ответа: «разве не лучше…?» φυλῆς καὶ συγγενείας — «племени и рода»."
  20: "ἠγαθύνθη ἡ καρδία τοῦ ἱερέως — «возвеселилось сердце священника» (ἀγαθύνω). εἰσῆλθεν ἐν μέσῳ τοῦ λαοῦ — «вошёл в середину народа»."
  21: "ἐπέστρεψαν καὶ ἀπῆλθαν — «обратились и пошли». ἔταξαν τὴν πανοικίαν καὶ τὴν κτῆσιν αὐτοῦ τὴν ἔνδοξον ἔμπροσθεν αὐτῶν — «поставили всё семейство и имущество его славное перед ними» (πανοικία — «весь дом»; csl «чада и притяжание честное»)."
  22: "μεμακρυκότων ἀπὸ τοῦ οἴκου Μιχα — «когда удалились от дома Михи» (perfect part.). οἱ ἄνδρες οἱ σὺν τῷ οἴκῳ μετὰ Μιχα — «люди, бывшие с домом Михи». ἔκραζον κατοπίσω — «кричали вслед»."
  23: "ἐπέστρεψαν τὰ πρόσωπα αὐτῶν — «обратили лица свои». Τί ἐστίν σοι, ὅτι ἔκραξας; — «что тебе, что ты закричал?»"
  24: "Τὸ γλυπτόν μου, ὃ ἐποίησα ἐμαυτῷ — «истукан мой, который я сделал себе». τί ἐμοὶ ἔτι; — «что мне ещё?» (в масор. и ru «богов моих» — мн. ч.; в гр. ед. ч.). τί τοῦτο λέγετέ μοι Τί τοῦτο κράζεις; — «что это вы говорите мне: что ты кричишь?»"
  25: "Μὴ ἀκουσθήτω … ἡ φωνή σου μεθ᾿ ἡμῶν — «да не будет услышан голос твой при нас». ἄνδρες κατώδυνοι ψυχῇ — «мужи, огорчённые душой», т. е. раздражённые (κατώδυνος). προσθήσεις τὴν ψυχήν σου — букв. «приложишь душу свою» = погубишь жизнь (ἀπολλύναι); передано «потеряешь (жизнь)»."
  26: "ἐξένευσεν καὶ ἀνέστρεψεν εἰς τὸν οἶκον αὐτοῦ — «свернул и возвратился в дом свой»."
  27: "ἔλαβον ὅσα ἐποίησεν Μιχα — «взяли, что сделал Миха». ἐπὶ λαὸν ἡσυχάζοντα καὶ πεποιθότα — «на народ покоящийся и уповающий». ἐπάταξαν ἐν στόματι ῥομφαίας — «поразили остриём меча» (букв. «устами меча»; в корпусе 剣の刃にかけて). ἐνέπρησαν — «сожгли»."
  28: "οὐκ ἔστιν ἐξαιρούμενος — «нет избавляющего» (ἐξαιρέω). μακράν ἐστιν ἀπὸ Σιδωνίων — «далеко она от сидонян». λόγος οὐκ ἔστιν αὐτοῖς μετὰ ἀνθρώπων — «дела нет у них с людьми». ἐν κοιλάδι, ἥ ἐστιν τοῦ οἴκου Ροωβ — «в долине, которая [принадлежит] дому Роов»; в масор. Беф-Рехов, отсюда «ロオブの家». ᾠκοδόμησαν … καὶ κατῴκησαν — «построили и поселились» (в ru «построили снова»)."
  29: "κατὰ τὸ ὄνομα τοῦ πατρὸς αὐτῶν, ὃς ἐγενήθη τῷ Ισραηλ — «по имени отца их, который родился у Израиля». ἦν Λαις ὄνομα τῇ πόλει τὸ πρότερον — «прежде имя городу было Лаис»."
  30: "ἀνέστησαν ἑαυτοῖς … τὸ γλυπτὸν Μιχα — «поставили себе истукан Михи». Ιωναθαν υἱὸς Γηρσωμ υἱοῦ Μωυσῆ — Ионафан, сын Гирсома, сына Моисея; в масор. тексте стоит «Манассии» (с подвешенной нун), LXX и csl читают «Моисей». ἕως τῆς ἡμέρας τῆς μετοικεσίας τῆς γῆς — «до дня переселения земли» (μετοικεσία — «переселение, плен»)."
  31: "ἔταξαν ἑαυτοῖς τὸ γλυπτὸν Μιχα — «поставили себе истукан Михи». πάσας τὰς ἡμέρας, ὅσας ἦν ὁ οἶκος τοῦ θεοῦ ἐν Σηλω — «во все дни, сколько дом Божий был в Силоме»."
