# jp-box, Судьи, глава 18. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в этой главе нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 18: колено Дан ищет удел (1), разведка и ночлег у Михи (2–6), описание Лаиса (7),
# возвращение разведчиков (8–10), поход шестисот (11–13), похищение ефода, терафимов
# и священника (14–20), погоня Михи (21–26), взятие Лаиса и основание Дана (27–29),
# идол Михи и священство Ионафана (30–31).
# Речи — 「…」: данитян (2, 8–10, 14, 19, 23, 25), священника (4, 6, 18). Слова Михи — 「…」
# (24). Красного и синего нет.
# 〔…〕 нет: перевод по gr-lxx-byz; csl-добавления отмечены в notes (18:2 «в дому михи»,
# 18:7 «не бе устрашаяй…», 18:21 «чада» и др.).
# Сноска テラフィム уже дана при первом упоминании в 17:5; здесь без сноски.
# Имена: ツォルア (Σαραα), エシュタオル (Εσθαολ), ライシュ (Λαισα), キリアト・ヤリム
# (Καριαθιαριμ), ヨナタン (Ιωναθαν), ゲルソム (Γηρσωμ). jp-ni не использовался.

