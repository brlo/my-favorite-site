# jp-box, Исход, глава 6. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru).
# jp-joc в этой главе отсутствует; ru (с масоретского) — только для понимания, не источник.
# Язык — современный 常体, порядок членов и деление на клаузы — по греческому.
# Глава 6: обетование вывести народ (1–8), народ не слушает (9), повеление идти к фараону (10–13),
# родословие Рувима, Симеона и Левия (14–25), Аарон и Моисей (26–30).
# Красного и синего нет: говорит Бог, но это не прямая речь Христа во плоти; «<j>» не ставится.
# Кавычки: речь Бога — 「…」; слова Бога, которые Моисей передаёт народу, — 『…』 (6–8).
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено по базе); отличия csl/МТ — в notes.
# 6:20 — по LXX 132 года (слав. и Синодальный — 137); 6:22 — по LXX у Озиила два сына
# (слав. и МТ добавляют Мисаила); эти чтения не вносим, отличие в notes.
# Сносок ⟨…⟩ нет: 寄留, 契約, 一族 уже в корпусе; имена даны по формам LXX.
# jp-ni не использовался.

tr_code: jp-box
book: ish
chapter: 6
draft: true

verses:
  1: "主[しゅ]はモーセに言[い]われた。「わたしがファラオに何[なに]をするか、あなたは今[いま]にわかるだろう。強[つよ]い手[て]によって彼[かれ]は彼[かれ]らを去[さ]らせ、高[たか]い腕[うで]によって彼[かれ]らを自分[じぶん]の地[ち]から追[お]い出[だ]すからである。」"
  2: "神[かみ]はモーセに語[かた]って言[い]われた。「わたしは主[しゅ]である。"
  3: "わたしはアブラハム、イサク、ヤコブに現[あらわ]れて、彼[かれ]らの神[かみ]であったが、わたしの名[な]、すなわち主[しゅ]を彼[かれ]らに明[あき]らかにしなかった。"
  4: "わたしはまた、カナン人[じん]の地[ち]、すなわち彼[かれ]らが寄留[きりゅう]した地[ち]、彼[かれ]らがその中[なか]で寄留[きりゅう]した地[ち]を与[あた]えるために、彼[かれ]らとの契約[けいやく]を立[た]てた。"
  5: "わたしは、エジプト人[じん]が彼[かれ]らを奴隷[どれい]にしている、イスラエルの子[こ]らのうめきを聞[き]き、あなたがたとの契約[けいやく]を思[おも]い起[おこ]した。」"
  6: "だから、イスラエルの子[こ]らに言[い]いなさい。『わたしは主[しゅ]である。わたしはあなたがたをエジプト人[じん]の支配[しはい]から連[つ]れ出[だ]し、奴隷[どれい]の身[み]から救[すく]い出[だ]し、高[たか]く上[あ]げた腕[うで]と大[おお]きな裁[さば]きによって贖[あがな]い取[と]る。"
  7: "わたしはあなたがたをわたしの民[たみ]として取[と]り、あなたがたの神[かみ]となる。あなたがたは、わたしがあなたがたの神[かみ]である主[しゅ]であり、エジプト人[じん]の支配[しはい]からあなたがたを連[つ]れ出[だ]した者[もの]であることを知[し]る。"
  8: "わたしは、アブラハム、イサク、ヤコブに与[あた]えると誓[ちか]って手[て]を伸[の]べた地[ち]へ、あなたがたを導[みちび]き入[い]れ、それをあなたがたに割[わ]り当[あ]てとして与[あた]える。わたしは主[しゅ]である。』"
  9: "モーセはこのとおりイスラエルの子[こ]らに語[かた]ったが、彼[かれ]らは心[こころ]がくじけ、労苦[ろうく]が激[はげ]しかったため、モーセに聞[き]き従[したが]わなかった。"
  10: "主[しゅ]はモーセに言[い]われた。"
  11: "「ファラオのところへ行[い]き、エジプトの王[おう]ファラオに、イスラエルの子[こ]らをその地[ち]から去[さ]らせるよう語[かた]りなさい。」"
  12: "モーセは主[しゅ]の前[まえ]で言[い]った。「見[み]てください。イスラエルの子[こ]らでさえ、わたしの言[い]うことを聞[き]きません。ましてファラオが、言葉[ことば]の拙[つたな]いわたしの言[い]うことを聞[き]くでしょうか。」"
  13: "主[しゅ]はモーセとアロンに語[かた]り、イスラエルの子[こ]らをエジプトの地[ち]から導[みちび]き出[だ]すために、ファラオのところへ行[い]くよう彼[かれ]らに命[めい]じられた。"
  14: "これらは彼[かれ]らの父[ちち]の家[いえ]の長[かしら]たちである。イスラエルの長子[ちょうし]ルベンの子[こ]らは、エノク、ファルス、アスロン、ハルミ。これがルベンの一族[いちぞく]である。"
  15: "シメオンの子[こ]らは、イェムエル、ヤミン、アオド、ヤキン、サアル、およびフェニキア人[じん]の女[おんな]から生[う]まれたサウル。これらがシメオンの子[こ]らの氏族[しぞく]である。"
  16: "レビの子[こ]らの名[な]は、その一族[いちぞく]に従[したが]うと、次のとおりである。ゲルション、カアト、メラリ。レビの生涯[しょうがい]の年[とし]は百三十七[ひゃくさんじゅうなな]年[ねん]であった。"
  17: "ゲルションの子[こ]らは、ロベニとセメイ、および彼[かれ]らの父[ちち]の家[いえ]である。"
  18: "カアトの子[こ]らは、アムラム、イサアル、ヘブロン、オジエル。カアトの生涯[しょうがい]の年[とし]は百三十三[ひゃくさんじゅうさん]年[ねん]であった。"
  19: "メラリの子[こ]らは、モオリとオムシ。これらが、その一族[いちぞく]に従[したが]ったレビの父[ちち]の家[いえ]である。"
  20: "アムラムは、父[ちち]の兄弟[きょうだい]の娘[むすめ]ヨカベドを妻[つま]に迎[むか]え、彼女[かのじょ]は彼[かれ]にアロン、モーセ、およびその妹[いもうと]マリアムを産[う]んだ。アムラムの生涯[しょうがい]の年[とし]は百三十二[ひゃくさんじゅうに]年[ねん]であった。"
  21: "イサアルの子[こ]らは、コラ、ナフェク、ゼクリ。"
  22: "オジエルの子[こ]らは、エリサファンとセテリ。"
  23: "アロンは、アミナダブの娘[むすめ]でナアソンの妹[いもうと]であるエリサベトを妻[つま]に迎[むか]え、彼女[かのじょ]は彼[かれ]にナダブ、アビウド、エレアザル、イタマルを産[う]んだ。"
  24: "コラの子[こ]らは、アシル、エルカナ、アビアサフ。これらがコラの一族[いちぞく]である。"
  25: "アロンの子[こ]エレアザルは、フティエルの娘[むすめ]たちのうちから妻[つま]を迎[むか]え、彼女[かのじょ]は彼[かれ]にピネハスを産[う]んだ。これらが、その家系[かけい]に従[したが]ったレビ人[びと]の氏族[しぞく]の長[かしら]たちである。"
  26: "このアロンとモーセは、神[かみ]が「イスラエルの子[こ]らを、その力[ちから]とともにエジプトの地[ち]から導[みちび]き出[だ]せ」と言[い]われた者[もの]たちである。"
  27: "ファラオと語[かた]り合[あ]ったのは、この者[もの]たちである。彼[かれ]らはイスラエルの子[こ]らをエジプトから導[みちび]き出[だ]した。すなわち、アロンとモーセである。"
  28: "主[しゅ]がエジプトの地[ち]でモーセに語[かた]られたのは、その日である。"
  29: "主[しゅ]はモーセに言[い]われた。「わたしは主[しゅ]である。わたしがあなたに語[かた]るすべてのことを、エジプトの王[おう]ファラオに語[かた]りなさい。」"
  30: "モーセは主[しゅ]の前[まえ]で言[い]った。「見[み]てください。わたしは口[くち]が重[おも]いのに、どうしてファラオがわたしの言[い]うことを聞[き]くでしょうか。」"

notes:
  1: "Ἤδη ὄψει — 今に見る (ἤδη «уже», ὄψει будущее от ὁράω). ἐν χειρὶ κραταιᾷ — сильной рукой; ἐξαποστελεῖ — отпустит; ἐν βραχίονι ὑψηλῷ ἐκβαλεῖ — высокой мышцей изгонит (ἐκβάλλω «выбросить, выгнать»). Субъект — фараон, но рука — Господня."
  2: "Ἐλάλησεν δὲ ὁ θεὸς — 神は語って. Ἐγὼ κύριος — わたしは主, формула самораскрытия (ср. 3:14)."
  3: "ὤφθην — явился (ὁράω). θεὸς ὢν αὐτῶν — будучи их Богом (LXX; МТ и Синодальный читают «Бог Всемогущий», Эль-Шаддай, слав. «Бог сый их»). τὸ ὄνομά μου κύριος οὐκ ἐδήλωσα — имени «Господь» не открыл (δηλόω «объявлять»); держимся греческого."
  4: "ἔστησα τὴν διαθήκην — поставил завет (ἵστημι). ὥστε δοῦναι — чтобы дать. παρῳκήκασιν / παρῴκησαν — жили как пришельцы (παροικέω), отсюда 寄留[きりゅう]."
  5: "καταδουλοῦνται — порабощают (καταδουλόω). ἐμνήσθην τῆς διαθήκης ὑμῶν — вспомнил завет ваш (в греч. ὑμῶν «ваш»; слав. «мой»)."
  6: "βάδιζε εἰπὸν — иди, скажи. δυναστεία — власть, гнёт. ῥύσομαι — избавлю. λυτρώσομαι — искуплю (λύτρον «выкуп»). ἐν βραχίονι ὑψηλῷ καὶ κρίσει μεγάλῃ — высокой мышцей и великим судом."
  7: "λήμψομαι ἐμαυτῷ ὑμᾶς λαόν — возьму вас Себе в народ. ἔσομαι ὑμῶν θεός — буду вам Богом (формула завета). καταδυναστεία — угнетение; передано тем же 支配[しはい], что и δυναστεία в ст. 6."
  8: "ἐξέτεινα τὴν χεῖρά μου — простёр руку Мою (жест клятвы). ἐν κλήρῳ — в удел, как жребий (κλῆρος); отсюда 割り当て."
  9: "ὀλιγοψυχία — малодушие, упадок духа. ἔργα σκληρά — жестокие работы."
  10: "Εἶπεν δὲ κύριος — обычная формула введения речи."
  11: "Εἴσελθε λάλησον — войди и скажи. βασιλεῖ Αἰγύπτου — царю Египта (в LXX фараон назван царём)."
  12: "Ἰδοὺ … οὐκ εἰσήκουσάν μου — вот, не послушали меня. ἄλογος — бессловесный, неразумный (о речи), отсюда 言葉[ことば]の拙[つたな]い; ср. 6:30 ἰσχνόφωνος."
  13: "συνέταξεν — дал повеление (συντάσσω). В греч. только «к фараону»; Синодальный (с МТ) добавляет «к сынам Израилевым» — не вносим."
  14: "ἀρχηγοὶ οἴκων πατριῶν — начальники домов отцов. Ρουβην — ルベン. Ενωχ, Φαλλους, Ασρων, Χαρμι — エノク、ファルス、アスロン、ハルミ (формы по LXX и корпусу, ср. Быт 46:9)."
  15: "Συμεων — シメオン. Ιεμουηλ, Ιαμιν, Αωδ, Ιαχιν, Σααρ, Σαουλ — イェムエル、ヤミン、アオド、ヤキン、サアル、サウル (ср. Быт 46:10). ὁ ἐκ τῆς Φοινίσσης — от финикиянки. πατριαί — роды, семьи."
  16: "Γεδσων, Κααθ, Μεραρι — ゲルション、カアト、メラリ. ἑκατὸν τριάκοντα ἑπτά — 137 лет (LXX и слав.; в МТ тоже 137)."
  17: "Λοβενι, Σεμει — ロベニ、セメイ. οἶκοι πατριᾶς — дома отечества."
  18: "Αμβραμ, Ισσααρ, Χεβρων, Οζιηλ — アムラム、イサアル、ヘブロン、オジエル. ἑκατὸν τριάκοντα ἔτη — 133 года (LXX)."
  19: "Μοολι, Ομουσι — モオリ、オムシ. κατὰ συγγενείας — по родствам."
  20: "Ιωχαβεδ θυγάτηρ τοῦ ἀδελφοῦ τοῦ πατρός — дочь брата отца (двоюродная сестра; в МТ — тётка, сестра отца). ἑκατὸν τριάκοντα δύο — 132 года (LXX; слав. и Синодальный — 137, по МТ). Μαριαμ — マリアム."
  21: "Κορε, Ναφεκ, Ζεχρι — コラ、ナフェク、ゼクリ."
  22: "Ελισαφαν, Σετρι — エリサファン、セテリ. Слав. и МТ добавляют третьего сына (Мисаил); в LXX его нет, не вносим."
  23: "Ελισαβεθ — エリサベト. Αμιναδαβ, Ναασσων — アミナダブ、ナアソン. Ναδαβ, Αβιουδ, Ελεαζαρ, Ιθαμαρ — ナダブ、アビウド、エレアザル、イタマル."
  24: "Ασιρ, Ελκανα, Αβιασαφ — アシル、エルカナ、アビアサフ. γενέσεις — роды, поколения."
  25: "Φουτιηλ — フティエル. Φινεες — ピネハス. ἀρχαὶ πατριᾶς Λευιτῶν — главы родов левитов."
  26: "οὗτος Ααρων καὶ Μωϋσῆς — этот Аарон и Моисей. σὺν δυνάμει αὐτῶν — с силой их (LXX; МТ «по ополчениям их», слав. «с силою их»)."
  27: "οἱ διαλεγόμενοι πρὸς Φαραω — те, кто говорил с фараоном. αὐτὸς Ααρων καὶ Μωϋσῆς — сам Аарон и Моисей (порядок греч. сохранён)."
  28: "Ἧι ἡμέρᾳ — в тот день, когда; стих начинает предложение, продолженное в ст. 29."
  29: "Ἐγὼ κύριος — Я Господь. λάλησον πρὸς Φαραω — скажи фараону. ὅσα ἐγὼ λέγω — всё, что Я говорю."
  30: "ἰσχνόφωνός εἰμι — слаб голосом, косноязычен (ἰσχνός «слабый» + φωνή «голос»); ср. 6:12 ἄλογος. Синодальный «несловесен»."
