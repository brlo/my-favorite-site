# jp-box, Иов, глава 20. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге только 1–2; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 20: вторая речь Зофара (2–29): веселие нечестивых — падение (4–9),
# неправедное богатство изблюётся (10–19), гибель в самой полноте (20–23),
# меч, огонь и тьма (24–28), итог: удел нечестивого (29).
# Голоса: ст. 1 — вводная формула, повествование, вне кавычек; ст. 2–29 — речь
# Зофара, одна цитата 「…」 от начала ст. 2 до конца ст. 29. Внутри речи слова людей
# о нём самом — 『…』 (ст. 7). Красного и синего нет (Ветхий Завет).
# Нумерация по gr: 29 стихов; в csl-ru тоже 29, деление совпадает.
# 〔…〕 нет: все стихи есть в gr-lxx-byz. Сносок ⟨…⟩ нет: 全能者, 正しい者, 不敬な者,
# 知恵, 天使, 嗣業 уже в корпусе. Имена — транслитерация греческого (LXX).

