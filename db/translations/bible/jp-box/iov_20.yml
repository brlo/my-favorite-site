verses:
  1: "ミナ人[じん]ゾファルは答[こた]えて言[い]った。"
  2: "「わたしは、あなたがこれらに反論[はんろん]するとは思[おも]っていなかった。しかし、あなたがたはわたし以上[いじょう]に悟[さと]ってはいない。"
  3: "わたしは自分[じぶん]の恥[はじ]の懲[こ]らしめを聞[き]く。そして、悟[さと]りから出[で]る霊[れい]がわたしに答える。"
  4: "あなたはこれを、人[ひと]が地[ち]に置[お]かれたときから、すなわち遠[とお]い昔[むかし]から知[し]らなかったのか。"
  5: "不敬[ふけい]な者[もの]の喜[よろこ]びは恐[おそ]ろしい滅[ほろ]びであり、不法[ふほう]な者[もの]の楽[たの]しみは破滅[はめつ]である。"
  6: "たとえ彼の贈[おく]り物[もの]が天[てん]に上[のぼ]り、彼のいけにえが雲[くも]に触[ふ]れても、"
  7: "彼がもう確[たし]かに立[た]っていると思[おも]われるとき、彼は全[まった]く滅[ほろ]びる。彼を見[み]た者[もの]たちは言う。『どこにいるのか。』"
  8: "彼は飛[と]び去[さ]った夢[ゆめ]のように見[み]つからず、夜[よる]の幻[まぼろし]のように飛び去る。"
  9: "目[め]は彼を見たが、もはや見ることはない。彼の場所[ばしょ]も、もう彼を認[みと]めない。"
  10: "彼の子[こ]らを弱[よわ]い者[もの]たちが滅[ほろ]ぼすように。彼の手[て]が病[やまい]を燃[も]え上[あ]がらせるように。"
  11: "彼の骨[ほね]は若[わか]さの罪[つみ]で満[み]ち、彼とともに土[つち]の上[うえ]に眠[ねむ]る。"
  12: "悪[あく]が彼の口[くち]で甘[あま]くなると、彼はそれを自分[じぶん]の舌[した]の下[した]に隠[かく]す。"
  13: "彼はそれを惜[お]しまず、手放[てばな]さず、自分[じぶん]の喉[のど]の奥[おく]に押[お]しとどめる。"
  14: "しかし彼は自分[じぶん]を助[たす]けることができない。その腹[はら]には毒蛇[どくへび]の胆汁[たんじゅう]がある。"
  15: "不正[ふせい]に集[あつ]めた富[とみ]は吐[は]き出[だ]され、彼の家[いえ]から天使[てんし]が彼を引[ひ]き出[だ]す。"
  16: "彼は蛇[へび]たちの怒[いか]りを吸[す]い、蛇の舌[した]が彼を殺[ころ]すであろう。"
  17: "彼は群[む]れの乳[ちち]を見[み]ることも、蜜[みつ]とバターの牧場[ぼくじょう]を見ることもない。"
  18: "彼はむなしく、空[むな]しく富[とみ]のために労[ろう]した。その富を味[あじ]わうことはない。まるで噛[か]めず、飲[の]み込[こ]めない渋[しぶ]い実[み]のようである。"
  19: "彼は多[おお]くの弱[よわ]い者[もの]の家[いえ]を打[う]ち砕[くだ]き、住[す]まいを奪[うば]って、それを建[た]て直[なお]さなかったからである。"
  20: "彼の財産[ざいさん]には救[すく]いがない。彼は自分[じぶん]の欲[よく]によって救われない。"
  21: "彼の食[た]べ物[もの]には残[のこ]りがない。それゆえ、彼の幸[さいわ]いは花[はな]開[ひら]かない。"
  22: "彼がもう満[み]ち足[た]りたと思ったとき、彼は苦[くる]しめられ、あらゆる災[わざわ]いが彼に臨[のぞ]む。"
  23: "彼が腹[はら]を満たそうとするなら、神[かみ]は彼に激[はげ]しい怒りを送[おく]り、彼の上[うえ]に病[やまい]を雨[あめ]のように降[ふ]らせる。"
  24: "彼は鉄[てつ]の手[て]から逃[のが]れられない。青銅[せいどう]の弓[ゆみ]が彼を射抜[いぬ]く。"
  25: "そして矢[や]が彼の体[からだ]を貫[つらぬ]き、彼の住[す]まいの中[なか]を星[ほし]が歩[ある]き回[まわ]り、彼の上に恐[おそ]れが臨む。"
  26: "あらゆる闇[やみ]が彼の上にとどまる。燃[も]え尽[つ]きない火[ひ]が彼を食[く]い尽くし、寄留者[きりゅうしゃ]が彼の家[いえ]を荒[あ]らす。"
  27: "天[てん]は彼の不法[ふほう]をあらわにし、地[ち]は彼に逆[さか]らって立[た]ち上[あ]がる。"
  28: "滅[ほろ]びが彼の家[いえ]をことごとく引[ひ]き出[だ]し、怒[いか]りの日[ひ]が彼に臨[のぞ]む。"
  29: "これが不敬[ふけい]な者[もの]が主[しゅ]から受[う]ける分[わ]け前[まえ]、監視[かんし]する方[かた]から受ける彼の財産[ざいさん]の嗣業[しぎょう]である。」"

notes:
  1: "Ὑπολαβὼν δὲ Σωφαρ ὁ Μιναῖος λέγει — вводная формула, повествование, вне кавычек (как и во всех речах книги). Μιναῖος — ミナ人: по LXX; в евр. он нааматитянин (в ru «Наамитянин»). Слав. «Отвещав же софар минейский, рече». Речь Зофара — ст. 2–29, одна цитата."
  2: "Οὐχ οὕτως ὑπελάμβανον ἀντερεῖν σε ταῦτα — «не так я думал, что ты будешь возражать на это» (ὑπολαμβάνω — полагать, думать; ἀντερεῖν — возразить). καὶ οὐχὶ συνίετε μᾶλλον ἢ καὶ ἐγώ — «и не больше понимаете, чем я»: в греч. смена лица — σε (ед. ч.) и συνίετε (мн. ч.), обращение к Иову переходит в обращение к друзьям; смена сохранена. Слав. «не тако мнех сия тебе рещи противу, и не разумеете паче нежели и аз». Говорящий: Зофар."
  3: "παιδείαν ἐντροπῆς μου ἀκούσομαι — «наставление (наказание) посрамления моего услышу» (παιδεία — наставление, наказание; ἐντροπή — стыд, срам). πνεῦμα ἐκ τῆς συνέσεως ἀποκρίνεταί μοι — «дух от разумения отвечает мне»: не Святой Дух, а собственный дух разумения (ср. Исх 28:3; 31:3); слав. «дух от разума отвещавает ми». Говорящий: Зофар."
  4: "μὴ ταῦτα ἔγνως ἀπὸ τοῦ ἔτι ἀφ᾿ οὗ ἐτέθη ἄνθρωπος ἐπὶ τῆς γῆς — «разве ты не знал этого с того времени, как человек поставлен на земле»: ἀπὸ τοῦ ἔτι — усилительное «с самого начала», слав. «от века». Вопрос с μή предполагает утвердительный ответ. Говорящий: Зофар."
  5: "εὐφροσύνη γὰρ ἀσεβῶν πτῶμα ἐξαίσιον — «ибо веселие нечестивых — падение ужасное» (πτῶμα — падение; ἐξαίσιος — необычайный, страшный). χαρμονὴ δὲ παρανόμων ἀπώλεια — «радость беззаконных — погибель»: параллелизм сохранён. В МТ и ru здесь «кратковременно», «мгновенна» — иное чтение, не внесено. Говорящий: Зофар."
  6: "ἐὰν ἀναβῇ εἰς οὐρανὸν αὐτοῦ τὰ δῶρα — «если взойдут на небо дары его» (τὰ δῶρα — дары). ἡ δὲ θυσία αὐτοῦ νεφῶν ἅψηται — «жертва его коснётся облаков» (θυσία — жертва). В МТ «величие его» и «голова его»; LXX читает «дары» и «жертва», по LXX и слав. («дары его», «жертва его»). Говорящий: Зофар."
  7: "ὅταν γὰρ δοκῇ ἤδη κατεστηρίχθαι — «когда покажется, что он уже утверждён» (перф. κατεστηρίχθαι от καταστηρίζω). εἰς τέλος ἀπολεῖται — «вконец погибнет». οἱ δὲ ἰδόντες αὐτὸν ἐροῦσιν· Ποῦ ἐστιν — «видевшие его скажут: где он»: слова людей внутри речи Зофара, поэтому 『』. Слав. «видевшии же его рекут: где есть»."
  8: "ὥσπερ ἐνύπνιον ἐκπετασθέν — «как сон, улетевший» (ἐκπετάζω — распростирать крылья, улетать). ἔπτη δὲ ὥσπερ φάσμα νυκτερινόν — «улетел же, как видение ночное» (φάσμα — призрак, видение); слав. «якоже сон отлетевый… аки мечтание нощное». Говорящий: Зофар."
  9: "ὀφθαλμὸς παρέβλεψεν καὶ οὐ προσθήσει — «око взглянуло и не приложит», т. е. больше не увидит (προσβλέπω — смотреть; οὐ προσθήσει — гебраизм «не продолжит»). οὐκέτι προσνοήσει αὐτὸν ὁ τόπος αὐτοῦ — «уже не заметит его место его»: место как бы ищет его и не находит. Слав. «ктому не познает его место его». Говорящий: Зофар."
  10: "τοὺς υἱοὺς αὐτοῦ ὀλέσαισαν ἥττονες — «сынов его да погубят меньшие», т. е. слабейшие, низшие: ὀλέσαισαν — оптатив, пожелание-проклятие. αἱ δὲ χεῖρες αὐτοῦ πυρσεύσαισαν ὀδύνας — «руки его да воспламенят болезни» (πυρσεύω — зажигать). Слав. «да погубят меншии, и руце его возжгут болезни». В МТ и ru иное («будут заискивать у нищих»). Говорящий: Зофар."
  11: "ὀστᾶ αὐτοῦ ἐνεπλήσθησαν νεότητος αὐτοῦ — «кости его наполнились юности его», т. е. юношеской силы. Слав. добавляет «грехов» («наполнишася грехов юности его») — этого слова в LXX нет, но по паритету оно внесено в основной текст без скобок: 若さの罪. καὶ μετ᾿ αὐτοῦ ἐπὶ χώματος κοιμηθήσεται — «и с ним на прахе уснёт» (χῶμα — насыпь, прах). Говорящий: Зофар."
  12: "ἐὰν γλυκανθῇ ἐν στόματι αὐτοῦ κακία — «если усладится в устах его злоба» (γλυκαίνω — делать сладким). κρύψει αὐτὴν ὑπὸ τὴν γλῶσσαν αὐτοῦ — «скроет её под языком своим»: образ припрятанного зла. Слав. «аще усладится во устех его злоба, скрыет ю под языком своим». Говорящий: Зофар."
  13: "οὐ φείσεται αὐτῆς — «не пощадит её» (φείδομαι). οὐκ ἐγκαταλείψει — «не оставит». συνέξει αὐτὴν ἐν μέσῳ τοῦ λάρυγγος αὐτοῦ — «сожмёт (удержит) её посреди гортани своей» (λάρυγξ — горло): зло удерживается внутри, чтобы не вышло наружу. Говорящий: Зофар."
  14: "χολὴ ἀσπίδος ἐν γαστρὶ αὐτοῦ — «желчь аспида во чреве его» (χολή — желчь; ἀσπίς — аспид, ядовитая змея); слав. «желчь аспидов во чреве его». καὶ οὐ μὴ δυνηθῇ βοηθῆσαι ἑαυτῷ — «и не сможет помочь себе»: усиленное οὐ μή. Говорящий: Зофар."
  15: "πλοῦτος ἀδίκως συναγόμενος ἐξεμεσθήσεται — «богатство, неправедно собранное, изблюётся» (ἐξεμέω — изблевать). ἐξ οἰκίας αὐτοῦ ἐξελκύσει αὐτὸν ἄγγελος — «из дома его извлечёт его ангел» (ἐξελκύω — вытаскивать): ἄγγελος — 天使, вестник суда; слав. «из храмины его извлечет его ангел». Говорящий: Зофар."
  16: "θυμὸν δὲ δρακτόντων θηλάσειεν — «ярость змеев да сосёт» (δράκων — змей; θηλάζω — сосать). ἀνέλοι δὲ αὐτὸν γλῶσσα ὄφεως — «да убьёт его язык змеи» (ἀναιρέω — уничтожать); слав. «да убиет же его язык змиин». Пожелание-проклятие продолжается. Говорящий: Зофар."
  17: "μὴ ἴδοι ἄμελξιν νομάδων — «да не увидит доения стад» (ἄμελξις — доение; νομάς — пастушеский, кочевой). μηδὲ νομὰς μέλιτος καὶ βουτύρου — «ни пажитей мёда и масла» (βούτυρον — коровье масло); слав. «ниже прибытка меда и масла кравия»: образ изобилия, ср. Исх 3:8. Говорящий: Зофар."
  18: "εἰς κενὰ καὶ μάταια ἐκοπίασεν πλοῦτον — «в тщетное и пустое трудился он над богатством» (κοπιάω — трудиться до усталости). ὥσπερ στρίφνος ἀμάσητος ἀκατάποτος — «как терпкий плод, неразжёванный, непроглатываемый» (στρίφνος — терпкая слива, тёрн; ἀμάσητος — нежёванный; ἀκατάποτος — непроглатываемый); слав. «якоже клоки не сожваемы и не поглощаемы». Говорящий: Зофар."
  19: "πολλῶν γὰρ ἀδυνάτων οἴκους ἔθλασεν — «ибо дома многих немощных сокрушил» (θλάω — сокрушать). δίαιταν δὲ ἥρπασεν καὶ οὐκ ἔστησεν — «жилище разграбил и не поставил», т. е. не отстроил, не утвердил; слав. «жилище же разграби и не постави». Говорящий: Зофар."
  20: "οὐκ ἔστιν αὐτοῦ σωτηρία τοῖς ὑπάρχουσιν — «нет спасения имуществу его» (τὰ ὑπάρχοντα — имущество). ἐν ἐπιθυμίᾳ αὐτοῦ οὐ σωθήσεται — «в похоти своей не спасётся»; слав. «в вожделении своем не спасется». Говорящий: Зофар."
  21: "οὐκ ἔστιν ὑπόλειμμα τοῖς βρώμασιν αὐτοῦ — «нет остатка пище его» (ὑπόλειμμα — остаток; βρῶμα — пища). διὰ τοῦτο οὐκ ἀνθήσει αὐτοῦ τὰ ἀγαθά — «потому не процветут блага его» (ἀνθέω — цвести); слав. «сего ради не процветут ему благая». Говорящий: Зофар."
  22: "ὅταν δὲ δοκῇ ἤδη πεπληρῶσθαι — «когда покажется, что он уже наполнен» (перф. πεπληρῶσθαι). θλιβήσεται — «будет стеснён, в беде» (θλίβω). πᾶσα δὲ ἀνάγκη ἐπ᾿ αὐτὸν ἐπελεύσεται — «всякая нужда на него придёт» (ἀνάγκη — принуждение, беда); слав. «всяка беда нань приидет». Говорящий: Зофар."
  23: "εἴ πως πληρώσαι γαστέρα αὐτοῦ — «если бы как-нибудь наполнил чрево своё»: подлежащее меняется, действует Бог, в греч. не названный; в текст введено 神 без скобок, как требует смысл. ἐπαποστεῖλαι ἐπ᾿ αὐτὸν θυμὸν ὀργῆς — «пошлёт на него ярость гнева» (ἐπαποστέλλω). νίψαι ἐπ᾿ αὐτὸν ὀδύνας — «одождит на него болезни» (νίπτω здесь в значении орошать); слав. «одождит на него болезни». Говорящий: Зофар."
  24: "καὶ οὐ μὴ σωθῇ ἐκ χειρὸς σιδήρου — «и не спасётся от руки железа»: οὐ μή с конъюнктивом — решительное отрицание. τρώσαι αὐτὸν τόξον χάλκειον — «да поразит его лук медный» (τιτρώσκω — ранить, пронзать); слав. «да устрелит его лук медян». Говорящий: Зофар."
  25: "διεξέλθοι δὲ διὰ σώματος αὐτοῦ βέλος — «да пройдёт через тело его стрела» (βέλος). ἀστραπαὶ δὲ ἐν διαίταις αὐτοῦ περιπατήσαισαν — «молнии да ходят в жилищах его» (ἀστραπή — молния; δίαιτα — жилище); слав. читает «звезды» (ἀστέρες), по паритету взято слав. чтение 星, вариант LXX (молнии) отмечен здесь. ἐπ᾿ αὐτῷ φόβοι — «на нём ужасы». Говорящий: Зофар."
  26: "πᾶν δὲ σκότος αὐτῷ ὑπομείναι — «всякая тьма да пребудет на нём» (ὑπομένω — оставаться под). κατέδεται αὐτὸν πῦρ ἄκαυστον — «пожрёт его огонь несожигаемый» (ἄκαυστος — неугасимый, несожигаемый). κακώσαι δὲ αὐτοῦ ἐπήλυτος τὸν οἶκον — «и озлобит дом его пришлец» (ἐπήλυτος — пришлый, переселенец); слав. «да озлобит же пришлец дом его». Говорящий: Зофар."
  27: "ἀνακαλύψαι δὲ αὐτοῦ ὁ οὐρανὸς τὰς ἀνομίας — «да откроет небо беззакония его» (ἀνακαλύπτω — снимать покров, открывать). γῆ δὲ ἐπανασταίη αὐτῷ — «и земля да восстанет на него» (ἐπανίστημι); слав. «и земля да востанет нань». Говорящий: Зофар."
  28: "ἑλκύσαι τὸν οἶκον αὐτοῦ ἀπώλεια εἰς τέλος — «да извлечёт (увлечёт) дом его погибель вконец» (ἑλκύω — влечь). ἡμέρα ὀργῆς ἐπέλθοι αὐτῷ — «день гнева да придёт на него»; слав. «да извлечет дом его пагуба до конца, день гнева да приидет нань». Говорящий: Зофар."
  29: "αὕτη ἡ μερὶς ἀνθρώπου ἀσεβοῦς παρὰ κυρίου — «вот удел человека нечестивого от Господа» (μερίς — часть, удел). κτῆμα ὑπαρχόντων αὐτῷ παρὰ τοῦ ἐπισκόπου — «стяжание имущества его от Надзирателя»: ἐπίσκοπος здесь о Боге, «надзирающий, посещающий» (слав. «от надзирателя»), поэтому 監視する方. Закрывающая кавычка — конец речи Зофара."
