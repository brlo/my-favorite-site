# jp-box, Исход, глава 31. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — csl-ru, jp-joc и ru
# (с масоретского — только для понимания). У jp-joc в этой главе текста нет.
# Язык — современный 常体, порядок членов и деление на клаузы — по греческому.
# Глава 31: призвание Веселеила и Охолиава (1–11), заповедь о субботе как знамении
# завета (12–17), передача двух скрижалей (18).
# Красного и синего нет: речь Бога — в 「…」; внутри неё слова, которые Он велит
# передать Израилю, — в 『…』 (13–17). «<j>» не ставится.
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено по базе).
# Сносок ⟨…⟩ нет: 安息日 уже пояснён при первом упоминании (Исх 16:23), 幕屋, 燔祭,
# 祭壇, 祭司 — в корпусе; 石板, 注ぎの油 понятны по контексту.
# Имена: ベツァレル (Βεσελεηλ), オホリアブ (в LXX здесь Ελιάβ, евр. Ахолиав).
# jp-ni не использовался.

tr_code: jp-box
book: ish
chapter: 31
draft: true

verses:
  1: "主[しゅ]はモーセに言[い]われた。"
  2: "「見[み]よ、わたしは名[な]によってベツァレルを呼[よ]んだ。彼[かれ]はユダの部族[ぶぞく]のオルの子[こ]、ウリの子[こ]である。"
  3: "わたしは彼[かれ]を神[かみ]の霊[れい]で満[み]たし、すべての仕事[しごと]のために知恵[ちえ]と悟[さと]りと知識[ちしき]を与[あた]えた。"
  4: "金[きん]と銀[ぎん]と銅[どう]、青紫[あおむらさき]と紫[むらさき]の糸[いと]、紡[つむ]いだ緋[ひ]の糸[いと]、撚[よ]りをかけた亜麻布[あまぬの]を扱[あつか]い、考[かんが]え、設計[せっけい]して、"
  5: "石[いし]を切[き]り出[だ]して彫[ほ]り、木[き]を細工[さいく]して、あらゆる仕事[しごと]を成[な]し遂[と]げる。"
  6: "見[み]よ、わたしは彼[かれ]とともに、ダンの部族[ぶぞく]のアヒサマクの子[こ]オホリアブを置[お]いた。また、すべて心[こころ]に知恵[ちえ]ある者[もの]には、わたしは知恵[ちえ]を与[あた]えた。彼[かれ]らは、わたしがあなたに命[めい]じたすべてのものを造[つく]る。"
  7: "すなわち、証[あかし]の幕屋[まくや]、契約[けいやく]の箱[はこ]とその上[うえ]の贖[あがな]いの蓋[ふた]、幕屋[まくや]のすべての調度[ちょうど]、"
  8: "祭壇[さいだん]、机[つくえ]とそのすべての器[うつわ]、純金[じゅんきん]の燭台[しょくだい]とそのすべての器[うつわ]、"
  9: "洗[あら]い盤[ばん]とその台[だい]、"
  10: "務[つと]めの衣[ころも]、すなわちアロンが祭司[さいし]としてわたしに仕[つか]えるための聖[せい]なる衣[ころも]、またその子[こ]らが祭司[さいし]として仕[つか]えるための衣[ころも]、"
  11: "注[そそ]ぎの油[あぶら]と、聖所[せいしょ]のための調[ととの]えられた香[こう]。彼[かれ]らは、わたしがあなたに命[めい]じたすべてのとおりに造[つく]る。」"
  12: "主[しゅ]はモーセに言[い]われた。"
  13: "「あなたはイスラエルの子[こ]らに告[つ]げて言[い]え。『あなたがたはよく気[き]をつけて、わたしの安息日[あんそくび]を守[まも]らねばならない。これは、あなたがたの代々[よよ]の間[あいだ]、わたしとあなたがたとの間[あいだ]のしるしであり、あなたがたを聖[きよ]めるのがわたし、主[しゅ]であることを、あなたがたが知[し]るためである。"
  14: "あなたがたは安息日[あんそくび]を守[まも]らねばならない。これはあなたがたにとって聖[せい]なるものである。これを汚[けが]す者[もの]は必[かなら]ず死[し]に処[しょ]せられる。その日[ひ]に仕事[しごと]をする者[もの]は、だれでも、その魂[たましい]は民[たみ]の間[あいだ]から断[た]たれる。"
  15: "六日[むいか]の間[あいだ]は仕事[しごと]をせよ。七日目[なのかめ]は主[しゅ]に属[ぞく]する安息[あんそく]の日[ひ]、聖[きよ]い休[やす]みである。七日目[なのかめ]に仕事[しごと]をする者[もの]は、必[かなら]ず死[し]に処[しょ]せられる。"
  16: "イスラエルの子[こ]らは安息日[あんそくび]を守[まも]り、代々[よよ]にわたってこれを守[まも]って、永遠[えいえん]の契約[けいやく]とする。"
  17: "これは、わたしとイスラエルの子[こ]らとの間[あいだ]の永遠[えいえん]のしるしである。主[しゅ]が六日[むいか]の間[あいだ]に天[てん]と地[ち]を造[つく]り、七日目[なのかめ]に仕事[しごと]をやめて休[やす]まれたからである。』」"
  18: "主[しゅ]がシナイの山[やま]でモーセと語[かた]るのを終[お]えられたとき、神[かみ]は彼[かれ]に、証[あかし]の二枚[にまい]の石板[せきばん]、神[かみ]の指[ゆび]で書[か]かれた石[いし]の板[いた]をお渡[わた]しになった。"

notes:
  1: "ἐλάλησεν κύριος πρὸς Μωυσῆν λέγων — 主はモーセに言われた (формула введения речи; λέγων отдельно не переводим, ср. 31:12; 32:7)."
  2: "ἀνακέκλημαι ἐξ ὀνόματος — 名によって呼んだ (ἀνακαλέω — «призвать, назвать»; ἐξ ὀνόματος — «по имени», т. е. назвал его по имени). Βεσελεηλ τὸν τοῦ Ουριου τὸν Ωρ — オルの子、ウリの子ベツァレル (греч. цепочка родительных: «Веселеил, [сын] Урии, [сына] Ора»). φυλή — 部族."
  3: "πνεῦμα θεῖον — 神の霊 (не πνεῦμα ἅγιον; слав. «Духом Божиим»; ср. Быт 1:2). σοφία — 知恵, σύνεσις — 悟り, ἐπιστήμη — 知識. ἐν παντὶ ἔργῳ — すべての仕事のために: ст. 4–5 раскрывают, какие это работы."
  4: "διανοεῖσθαι — 考える, ἀρχιτεκτονῆσαι — 設計する (ἀρχιτέκτων — «главный строитель»). ἐργάζεσθαι — 扱う, работать с чем. ὑάκινθος — 青紫 (гиацинтовый, сине-фиолетовый цвет), πορφύρα — 紫, κόκκινον τὸ νηστόν — 紡いだ緋 (νηστός — «прядёный»), βύσσος κεκλωσμένη — 撚りをかけた亜麻布 (κλώθω — «крутить нить»)."
  5: "λιθουργικά — 石を切り出す仕事 (λίθος + ἔργον), τεκτονικά — 木細工 (τέκτων — «плотник»). κατὰ πάντα τὰ ἔργα — あらゆる仕事 (повтор, как в LXX и слав.)."
  6: "συνετὸς καρδίᾳ — 心に知恵ある者 (букв. «разумный сердцем»), δέδωκα σύνεσιν — 知恵を与えた (оба слова от σύνεσις — «разумение»; повтор корня, как в слав. «смысленному… дах смысл»). Ελιαβ τὸν τοῦ Αχισαμαχ — アヒサマクの子オホリアブ: в LXX здесь греч. форма Ελιάβ (слав. «Елиав»), евр. אָהֳלִיאָב — Ахолиав, отсюда церковное オホリアブ. ἐκ φυλῆς Δαν — ダンの部族."
  7: "σκηνὴ τοῦ μαρτυρίου — 証の幕屋 (μαρτύριον — «свидетельство»). κιβωτὸς τῆς διαθήκης — 契約の箱. ἱλαστήριον — 贖いの蓋 («очистилище», крышка ковчега). διασκευὴ τῆς σκηνῆς — 幕屋の調度 (διασκευή — «устроение, убранство»; слав. «утварь скинии»)."
  8: "θυσιαστήρια — 祭壇 (мн. ч.: здесь оба жертвенника — всесожжения и курения; по-японски собирательно). τράπεζα — 机 (стол хлебов предложения). λυχνία ἡ καθαρά — 純金の燭台 (καθαρός — «чистый», т. е. из чистого золота; слав. «светилник чистый»; в Синодальном «из чистого золота» — это пояснение, не текст LXX)."
  9: "λουτήρ — 洗い盤 (умывальница), βάσις — 台 (подножие; слав. «стояло»)."
  10: "στολαὶ λειτουργικαί — 務めの衣 (λειτουργικός — «служебный»). ἱερατεύειν μοι — 祭司としてわたしに仕える (ἱερατεύω — «священнодействовать»)."
  11: "ἔλαιον τῆς χρίσεως — 注ぎの油 (χρίσις — «помазание»). θυμίαμα τῆς συνθέσεως τοῦ ἁγίου — 聖所のための調えられた香 (σύνθεσις — «составление, смесь»; слав. «фимиам сложения святаго»). ἐνετειλάμην — 命じた (ἐντέλλομαι)."
  12: "Повтор формулы 31:1 — начало второй речи о субботе."
  13: "σύνταξον — 告げて言え (συντάσσω — «заповедовать, приказывать»); Ὁρᾶτε καί — よく気をつけて (двойной императив: «смотрите и соблюдайте»). τὰ σάββατά μου — わたしの安息日 (мн. ч., «субботы»; ср. 16:23). σημεῖον — しるし. ὁ ἁγιάζων ὑμᾶς — あなたがたを聖める者 (ἁγιάζω — «освящать»). εἰς τὰς γενεὰς ὑμῶν — 代々の間 (поколения)."
  14: "ὁ βεβηλῶν αὐτό — これを汚す者 (βεβηλόω — «осквернять, профанировать»). θανάτῳ θανατωθήσεται — 必ず死に処せられる (датив усиления: «смертью умрёт»; слав. «смертию умрет»). ἐξολεθρευθήσεται — 断たれる (ἐξολεθρεύω — «истреблять»); ἐκ μέσου τοῦ λαοῦ — 民の間から."
  15: "ἓξ ἡμέρας — 六日の間 (вин. времени). ἀνάπαυσις ἁγία τῷ κυρίῳ — 主に属する聖い休み (ἀνάπαυσις — «покой»). Ср. 35:2, где та же заповедь дана с τελευτάτω («да умрёт»)."
  16: "φυλάξουσιν — 守る (буд. вр. с силой заповеди; слав. «да сохранят»). διαθήκη αἰώνιος — 永遠の契約."
  17: "σημεῖον αἰώνιον — 永遠のしるし. ἐπαύσατο καὶ κατέπαυσεν — 仕事をやめて休まれた (два глагола: «перестал и успокоился»; ср. Быт 2:2). ἐν ἓξ ἡμέραις — 六日の間に."
  18: "ἡνίκα κατέπαυσεν λαλῶν — 語るのを終えられたとき. πλάκες τοῦ μαρτυρίου — 証の石板 (πλάξ — «доска, скрижаль»). γεγραμμένας τῷ δακτύλῳ τοῦ θεοῦ — 神の指で書かれた (датив орудия). Подлежащее ἔδωκεν в греч. не названо; слав. добавляет «(Бог)», по-японски подлежащее — 神."
