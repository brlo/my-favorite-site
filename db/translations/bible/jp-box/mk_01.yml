verses:
  1: "〔神[かみ]の子[こ]〕イエス・キリストの福音[ふくいん]の始[はじ]め。"
  2: "預言者[よげんしゃ]たちの書[しょ]に書[か]かれているとおりである。「見[み]よ、わたしはあなたの前[まえ]に使者[ししゃ]を遣[つか]わす。彼[かれ]はあなたの道[みち]を備[そな]える。」"
  3: "「荒[あ]れ野[の]に叫[さけ]ぶ者[もの]の声[こえ]がある。『主[しゅ]の道[みち]を整[ととの]えよ。その小道[こみち]をまっすぐにせよ。』」"
  4: "洗礼者[せんれいしゃ]ヨハネが荒[あ]れ野[の]に現[あらわ]れ、罪[つみ]の赦[ゆる]しへと導[みちび]く悔[く]い改[あらた]めの洗礼[せんれい]を宣[の]べ伝[つた]えていた。"
  5: "ユダヤの全土[ぜんど]とエルサレムの住民[じゅうみん]がこぞって彼[かれ]のもとへ出[で]かけ、ヨルダン川[がわ]で彼[かれ]から洗礼[せんれい]を受[う]けながら、自分[じぶん]の罪[つみ]を言[い]い表[あらわ]していた。"
  6: "ヨハネはらくだの毛衣[けごろも]をまとい、腰[こし]に革[かわ]の帯[おび]を締[し]め、いなごと野蜜[のみつ]を常食[じょうしょく]としていた。"
  7: "そして宣[の]べ伝[つた]えた。「わたしの後[あと]から、わたしより強[つよ]い方[かた]が来[く]る。わたしは屈[かが]んで、その方[かた]の履物[はきもの]のひもを解[と]く値打[ねう]ちもない。"
  8: "わたしが授[さず]けるのは水[みず]の洗礼[せんれい]だが、その方[かた]がお授[さず]けになるのは{聖霊[せいれい]|聖神[せいしん]}の洗礼[せんれい]である。」"
  9: "そのころ、イエスはガリラヤのナザレを発[た]ち、ヨハネから洗礼[せんれい]を受[う]けるためにヨルダン川[がわ]へ来[こ]られた。"
  10: "イエスが水[みず]から上[あ]がられるとすぐ、天[てん]が二[ふた]つに裂[さ]け、霊[れい]が鳩[はと]のようにご自身[じしん]の上[うえ]へ降[くだ]って来[く]るのをご覧[らん]になった。"
  11: "すると、天[てん]から声[こえ]が聞[き]こえた。「あなたはわたしの愛[あい]する子[こ]。わたしはあなたを喜[よろこ]びとする。」"
  12: "霊[れい]はすぐさまイエスを荒[あ]れ野[の]へ追[お]いやった。"
  13: "イエスは四十日[しじゅうにち]のあいだ荒[あ]れ野[の]にとどまり、サタンに試[こころ]みられた。野獣[やじゅう]たちもそばにいたが、天使[てんし]たちが仕[つか]えていた。"
  14: "ヨハネが捕[と]らえられてから、イエスはガリラヤに移[うつ]り、神[かみ]の国[くに]の福音[ふくいん]を告[つ]げ知[し]らせて、"
  15: "言[い]われた。「<j>時[とき]は満[み]ちた。神[かみ]の国[くに]はすぐそこまで来[き]ている。悔[く]い改[あらた]めて、福音[ふくいん]を信[しん]じなさい。</j>」"
  16: "ガリラヤ湖[みずうみ]の岸[きし]を歩[ある]いておられたとき、イエスはシモンとその兄弟[きょうだい]アンデレが湖[みずうみ]に網[あみ]を打[う]っているのをご覧[らん]になった。彼[かれ]らは漁師[りょうし]であった。"
  17: "イエスは言[い]われた。「<j>わたしの後[あと]について来[き]なさい。人[ひと]をとる漁師[りょうし]にしてあげよう。</j>」"
  18: "二人[ふたり]はすぐさま網[あみ]を捨[す]てて、イエスに従[したが]った。"
  19: "少[すこ]し進[すす]まれたところで、ゼベダイの子[こ]ヤコブとその兄弟[きょうだい]ヨハネが、舟[ふね]の中[なか]で網[あみ]を繕[つくろ]っているのをご覧[らん]になった。"
  20: "イエスはすぐに彼[かれ]らを呼[よ]ばれた。二人[ふたり]は父[ちち]ゼベダイと雇[やと]い人[びと]たちを舟[ふね]に残[のこ]したまま、イエスの後[あと]について行[い]った。"
  21: "一行[いっこう]はカファルナウムに着[つ]いた。イエスはすぐ、安息日[あんそくび]の会堂[かいどう]で教[おし]え始[はじ]められた。"
  22: "人々[ひとびと]はその教[おし]えに打[う]たれた。教[おし]え方[かた]に権威[けんい]があり、律法学者[りっぽうがくしゃ]たちとは違[ちが]っていたからである。"
  23: "そのとき、会堂[かいどう]には汚[けが]れた霊[れい]に取[と]りつかれた男[おとこ]がいて、叫[さけ]び声[ごえ]を上[あ]げた。"
  24: "「ナザレのイエス、あなたはわたしたちと何[なん]の関[かか]わりがあるのか。わたしたちを滅[ほろ]ぼしに来[き]たのか。あなたが誰[だれ]かは分[わ]かっている。神[かみ]の聖[せい]なる者[もの]だ。」"
  25: "イエスはその霊[れい]をお叱[しか]りになり、「<j>黙[だま]れ。この人[ひと]から出[で]て行[い]け</j>」と言[い]われた。"
  26: "汚[けが]れた霊[れい]はその人[ひと]を引[ひ]きつらせ、大[おお]きな声[こえ]を張[は]り上[あ]げて出[で]て行[い]った。"
  27: "人[ひと]は皆[みな]驚[おどろ]き、互[たが]いに話[はな]し合[あ]った。「いったいこれは何[なに]だ。権威[けんい]ある新[あたら]しい教[おし]えだ。汚[けが]れた霊[れい]どもに命[めい]じると、言[い]うことを聞[き]く。」"
  28: "イエスの評判[ひょうばん]は、またたく間にガリラヤの周辺[しゅうへん]一帯[いったい]へ広[ひろ]まった。"
  29: "会堂[かいどう]を出[で]ると、一行[いっこう]はすぐにヤコブとヨハネを連[つ]れて、シモンとアンデレの家[いえ]へ向[む]かった。"
  30: "シモンのしゅうとめが熱[ねつ]を出[だ]して寝込[ねこ]んでいると、すぐにそのことがイエスに伝[つた]えられた。"
  31: "イエスが近[ちか]づいて手[て]を取[と]り、起[お]こしてやると、熱[ねつ]は引[ひ]き、彼女[かのじょ]は一同[いちどう]に仕[つか]えるようになった。"
  32: "日[ひ]が沈[しず]んで夕方[ゆうがた]になると、人々[ひとびと]は病[やまい]に苦[くる]しむ者[もの]も悪霊[あくりょう]に憑[つ]かれた者[もの]も、残[のこ]らずイエスのもとへ連[つ]れて来[き]た。"
  33: "町[まち]の者[もの]がこぞって戸口[とぐち]に押[お]しかけた。"
  34: "イエスはさまざまな病[やまい]に悩[なや]む多[おお]くの人[ひと]を癒[いや]し、多[おお]くの悪霊[あくりょう]を追[お]い出[だ]された。悪霊[あくりょう]が口[くち]をきくことはお許[ゆる]しにならなかった。悪霊[あくりょう]はイエスが誰[だれ]かを知[し]っていたからである。"
  35: "夜[よ]がまだ明[あ]けきらないうちに、イエスは起[お]きて家[いえ]を出[で]、人気[ひとけ]のない所[ところ]へ行[い]って、そこで祈[いの]っておられた。"
  36: "シモンと、一緒[いっしょ]にいた者[もの]たちは、イエスの跡[あと]を追[お]って、"
  37: "見[み]つけると、「みんながあなたを捜[さが]しています」と言[い]った。"
  38: "イエスは言[い]われた。「<j>近[ちか]くの別[べつ]の村々[むらむら]や町々[まちまち]へ行[い]こう。そこでも宣[の]べ伝[つた]えるためだ。わたしが外[そと]へ出[で]て来[き]たのは、そのためなのだ。</j>」"
  39: "こうしてイエスは、ガリラヤの至[いた]るところの会堂[かいどう]を巡[めぐ]って宣[の]べ伝[つた]え、悪霊[あくりょう]を追[お]い出[だ]された。"
  40: "重[おも]い皮膚病[ひふびょう]の人[ひと]がイエスのところへ来[き]て、〔ひざまずき〕、「もしお望[のぞ]みでしたら、わたしを清[きよ]くすることがおできになります」と願[ねが]い出[で]た。"
  41: "イエスは胸[むね]を打[う]たれ、手[て]を伸[の]べてその人[ひと]に触[ふ]れ、「<j>わたしは望[のぞ]む。清[きよ]くなれ</j>」と言[い]われた。"
  42: "すると、重[おも]い皮膚病[ひふびょう]はたちまち引[ひ]いて、その人[ひと]は清[きよ]くなった。"
  43: "イエスはその人[ひと]を厳[きび]しく戒[いまし]めて、すぐに外[そと]へ出[だ]し、"
  44: "言[い]われた。「<j>だれにも何[なに]も漏[も]らさないように、よく気[き]をつけなさい。行[い]って祭司[さいし]に体[からだ]を見[み]せ、モーセが定[さだ]めた清[きよ]めの捧[ささ]げ物[もの]をしなさい。それが彼[かれ]らへの証[あかし]となる。</j>」"
  45: "ところが、その人[ひと]は出[で]て行[い]くと、盛[さか]んに語[かた]りふらし、この出来事[できごと]をあちこちに吹聴[ふいちょう]した。そのためイエスは、もはや町[まち]の中[なか]へ公然[こうぜん]と入[はい]れなくなり、町[まち]の外[そと]の人迹[ひとけ]ない所[ところ]にとどまられた。それでも人々[ひとびと]は、四方[しほう]からイエスのもとへ押[お]し寄[よ]せて来[き]た。"

notes:
  1: "В критической базе υἱοῦ θεοῦ под скобками; Церковь читает — 〔神の子〕."
  2: "Церковь (Елизаветинская «во пророцех», jp-joc 諸預言者に) читает ἐν τοῖς προφήταις; в критической базе ἐν τῷ Ἠσαΐᾳ τῷ προφήτῃ. Взято церковное чтение — «預言者たちの書に», без 〔〕 (замена, а не добавка)."
  10: "σχιζομένους — «раздираемые»; 二つに裂け. У jp-joc «天開け» без «надвое»."
  15: "ἤγγικεν — перфект «приблизилось»; すぐそこまで来ている, чтобы не терять совершенный вид."
  40: "καὶ γονυπετῶν в критической базе под скобками; Церковь читает — 〔ひざまずき〕."
