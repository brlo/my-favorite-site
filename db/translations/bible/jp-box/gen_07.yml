# jp-box, Бытие, глава 7. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru),
# русский Синодальный (ru) и jp-joc (1901, public domain).
# Язык — современный 常体, без 文語; порядок членов и деление на клаузы — по греческому.
# Глава 7: повеление войти в ковчег (1–4), вход (5–9), начало потопа (10–16),
# вода покрывает землю (17–23), сто пятьдесят дней (24).
# Красного и синего нет; речь Бога — 「…」 (1–4).
# 〔…〕 нет: все слова есть в gr-lxx-byz. 7:9 — слав. «(Господь) Бог» в скобках, у LXX ὁ θεός;
# следуем LXX (神), скобки не нужны. 7:11 и 8:4 — LXX даёт 27-й день, Синодальный 17-й.
# Сносок ⟨…⟩ нет. jp-ni не использовался.

tr_code: jp-box
book: gen
chapter: 7
draft: true

verses:
  1: "主[しゅ]なる神[かみ]はノアに言[い]われた。「あなたとあなたの全家[ぜんか]は箱舟[はこぶね]に入[はい]れ。この世代[せだい]の中で、わたしの前[まえ]に正[ただ]しい者[もの]と見[み]たのはあなただけだからである。"
  2: "清[きよ]い家畜[かちく]からは七[なな]つずつ、雄[おす]と雌[めす]、清[きよ]くない家畜[かちく]からは二[ふた]つずつ、雄[おす]と雌[めす]を連[つ]れ、"
  3: "また、天[てん]の鳥[とり]のうち清[きよ]いものからは七[なな]つずつ、雄[おす]と雌[めす]、清[きよ]くない鳥[とり]からは二[ふた]つずつ、雄[おす]と雌[めす]を連[つ]れよ。地[ち]の全面[ぜんめん]に種[たね]を残[のこ]すためである。"
  4: "まだ七[なな]日[にち]ある。わたしは地[ち]に四十[しじゅう]日[にち]四十[しじゅう]夜[や]、雨[あめ]を降[ふ]らせ、わたしが造[つく]ったすべての生[い]き物[もの]を、地[ち]の面[おもて]から拭[ぬぐ]い去[さ]る。」"
  5: "ノアは、主[しゅ]なる神[かみ]が命[めい]じられたすべてのことを行[おこな]った。"
  6: "ノアは六百歳[さい]であった。そのとき、洪水[こうずい]の水[みず]が地[ち]に来[き]た。"
  7: "ノアは、その息子[むすこ]たち、妻[つま]、息子[むすこ]たちの妻[つま]たちとともに、洪水[こうずい]の水[みず]のために箱舟[はこぶね]に入[はい]った。"
  8: "清[きよ]い鳥[とり]からも、清[きよ]くない鳥[とり]からも、清[きよ]い家畜[かちく]からも、清[きよ]くない家畜[かちく]からも、地[ち]のすべての這[は]うものからも、"
  9: "二[ふた]つずつ、雄[おす]と雌[めす]が、神[かみ]がノアに命[めい]じられたとおりに、ノアのところへ来[き]て箱舟[はこぶね]に入[はい]った。"
  10: "七[なな]日[にち]の後[のち]、洪水[こうずい]の水[みず]が地[ち]に来[き]た。"
  11: "ノアの生涯[しょうがい]の六百[ろっぴゃく]年[ねん]、第二[だいに]の月[つき]の二十七日[にじゅうしちにち]、その日[ひ]、深[ふか]い淵[ふち]のすべての源[みなもと]が裂[さ]け、天[てん]の窓[まど]が開[ひら]いた。"
  12: "雨[あめ]は四十[しじゅう]日[にち]四十[しじゅう]夜[や]、地[ち]に降[ふ]り続[つづ]けた。"
  13: "その日[ひ]、ノアと、ノアの息子[むすこ]たちセム、ハム、ヤフェト、ノアの妻[つま]、息子[むすこ]たちの三人[さんにん]の妻[つま]たちが、ともに箱舟[はこぶね]に入[はい]った。"
  14: "すべての獣[けもの]をその種類[しゅるい]に従[したが]って、すべての家畜[かちく]をその種類[しゅるい]に従[したが]って、地[ち]を這[は]うすべての這[は]うものをその種類[しゅるい]に従[したが]って、すべての鳥[とり]をその種類[しゅるい]に従[したが]って、"
  15: "命[いのち]の息[いき]を持つすべての肉[にく]から二[ふた]つずつ、ノアのところへ来[き]て箱舟[はこぶね]に入[はい]った。"
  16: "すべての肉[にく]から雄[おす]と雌[めす]が、神[かみ]がノアに命[めい]じられたとおりに入[はい]った。主[しゅ]なる神[かみ]は外[そと]から箱舟[はこぶね]を閉[と]ざされた。"
  17: "洪水[こうずい]は四十[しじゅう]日[にち]四十[しじゅう]夜[や]、地[ち]にあった。水[みず]は増[ふ]えて箱舟[はこぶね]を持[も]ち上[あ]げ、箱舟[はこぶね]は地[ち]から浮[うか]び上[あ]がった。"
  18: "水[みず]はますます勢[いきお]いを増[ま]して地[ち]に満[み]ち、箱舟[はこぶね]は水[みず]の面[おもて]を漂[ただよ]った。"
  19: "水[みず]は地[ち]の上[うえ]でさらに強[つよ]く勢[いきお]いを増[ま]し、天[てん]の下[した]にあるすべての高[たか]い山[やま]を覆[おお]った。"
  20: "水[みず]は山[やま]の上[うえ]に十五[じゅうご]キュビト高[たか]く上[あ]がり、すべての高[たか]い山[やま]を覆[おお]った。"
  21: "地[ち]の上[うえ]を動[うご]くすべての肉[にく]は死[し]んだ。鳥[とり]、家畜[かちく]、獣[けもの]、地[ち]を這[は]うすべてのもの、そして人[ひと]である。"
  22: "命[いのち]の息[いき]を持つすべてのもの、乾[かわ]いた地[ち]にいたすべてのものは死[し]んだ。"
  23: "地[ち]の全面[ぜんめん]にいたすべての生[い]き物[もの]は拭[ぬぐ]い去[さ]られた。人[ひと]から家畜[かちく]、這[は]うもの、天[てん]の鳥[とり]まで。それらは地[ち]から拭[ぬぐ]い去[さ]られた。残[のこ]ったのはノアと、彼[かれ]とともに箱舟[はこぶね]にいた者[もの]たちだけであった。"
  24: "水[みず]は百五十[ひゃくごじゅう]日[にち]の間[あいだ]、地[ち]の上[うえ]に高[たか]く上[あ]がっていた。"

notes:
  1: "Εἴσελθε — 入れ. πᾶς ὁ οἶκός σου — あなたの全家. δίκαιον ἐναντίον μου — わたしの前に正しい. ἐν τῇ γενεᾷ ταύτῃ — この世代で."
  2: "τῶν κτηνῶν τῶν καθαρῶν — 清い家畜 (καθαρός — «чистый» в ритуальном смысле). ἑπτὰ ἑπτά — 七つずつ. ἄρσεν καὶ θῆλυ — 雄と雌."
  3: "τῶν πετεινῶν τοῦ οὐρανοῦ τῶν καθαρῶν — 天の鳥の清いもの. διαθρέψαι σπέρμα — 種を残すため (διατρέφω)."
  4: "ἔτι γὰρ ἡμερῶν ἑπτά — まだ七日ある. ἐπάγω ὑετόν — 雨を降らせる (ὑετός). ἐξαλείψω πᾶσαν τὴν ἐξανάστασιν — すべての生き物を拭い去る (ἐξανάστασις — «восстание, всё возникшее»; слав. «востание»)."
  5: "ἐνετείλατο αὐτῷ κύριος ὁ θεός — 主なる神が命じられた."
  6: "ἑξακοσίων — 六百歳. ὁ κατακλυσμὸς… ὕδατος — 洪水の水."
  7: "διὰ τὸ ὕδωρ τοῦ κατακλυσμοῦ — 洪水の水のために."
  8: "τῶν πετεινῶν… τῶν κτηνῶν… τῶν ἑρπετῶν — 鳥、家畜、這うもの (LXX без «зверей»; слав. в скобках «и от зверей» — добавка, не переводим)."
  9: "δύο δύο — 二つずつ. καθὰ ἐνετείλατο — 命じられたとおり. κύριος в LXX нет (слав. «(Господь) Бог» — в скобках); 神 следует LXX."
  10: "μετὰ τὰς ἑπτὰ ἡμέρας — 七日の後. τὸ ὕδωρ τοῦ κατακλυσμοῦ — 洪水の水."
  11: "ἑξακοσιοστῷ ἔτει — 六百一年. τοῦ δευτέρου μηνός, ἑβδόμῃ καὶ εἰκάδι — 二月の二十七日 (LXX; масоретский/Син. — 17-й день). ἐρράγησαν πᾶσαι αἱ πηγαὶ τῆς ἀβύσσου — 深い淵の源がすべて裂けた (ῥήγνυμι). οἱ καταρράκται τοῦ οὐρανοῦ ἠνεῴχθησαν — 天の窓が開いた (καταρράκτης — «водопад, хлябь»)."
  12: "ὁ ὑετός — 雨. τεσσαράκοντα ἡμέρας καὶ τεσσαράκοντα νύκτας — 四十日四十夜."
  13: "ἐν τῇ ἡμέρᾳ ταύτῃ — その日に. αἱ τρεῖς γυναῖκες — 三人の妻たち."
  14: "κατὰ γένος — その種類に従って (повтор). ἑρπετὸν κινούμενον — 這い動くもの. πετεινόν — 鳥."
  15: "ἐν ᾧ ἐστιν πνεῦμα ζωῆς — 命の息があるもの (в LXX ед. ч. ᾧ; слав. «в нейже»)."
  16: "τὰ εἰσπορευόμενα — 入る者. ἔκλεισεν… ἔξωθεν αὐτοῦ — 外から閉ざされた (αὐτοῦ — «его», т. е. Ноя)."
  17: "ἐπληθύνθη τὸ ὕδωρ — 水は増えた. ἐπῆρεν… ὑψώθη — 持ち上げた…浮き上がった."
  18: "ἐπεκράτει — 勢いを増した (ἐπικρατέω). ἐπεφέρετο — 漂った (ἐπιφέρομαι)."
  19: "ἐπεκάλυψεν πάντα τὰ ὄρη τὰ ὑψηλά — すべての高い山を覆った."
  20: "δέκα πέντε πήχεις — 十五キュビト. ἐπάνω ὑψώθη — 上に高く上がった."
  21: "ἀπέθανεν πᾶσα σὰρξ κινουμένη — 動くすべての肉は死んだ. τῶν πετεινῶν καὶ τῶν κτηνῶν καὶ τῶν θηρίων — 鳥、家畜、獣."
  22: "πνοὴν ζωῆς — 命の息. ἐπὶ τῆς ξηρᾶς — 乾いた地に (ξηρά — «суша»)."
  23: "ἐξήλειψεν πᾶν τὸ ἀνάστημα — すべての生き物を拭い去った (ἀνάστημα — «восставшее, существо»). κατελείφθη μόνος Νωε — ノアだけが残った."
  24: "ὑψώθη τὸ ὕδωρ — 水は高く上がった. ἡμέρας ἑκατὸν πεντήκοντα — 百五十日."
