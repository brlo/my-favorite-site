verses:
  1: "「全能者[ぜんのうしゃ]である主[しゅ]、イスラエルの神[かみ]よ。狭[せま]い所[ところ]にある魂[たましい]と、倦[けん]怠[たい]の霊[れい]が、あなたに向[む]かって叫[さけ]んだ。"
  2: "主[しゅ]よ、聞[き]いて憐[あわ]れんでください。私たちはあなたの前[まえ]に罪[つみ]を犯[おか]しましたから。"
  3: "あなたは永遠[えいえん]に座[すわ]しておられ、私たちは永遠[えいえん]に滅[ほろ]びる者[もの]です。"
  4: "全能者[ぜんのうしゃ]である主[しゅ]、イスラエルの神[かみ]よ。イスラエルの死[し]んだ者[もの]たちの祈[いの]りを、あなたの前[まえ]に罪[つみ]を犯[おか]した子[こ]らの祈りをも聞[き]いてください。彼らは自分[じぶん]たちの神[かみ]である主[しゅ]の声[こえ]に聞[き]き従[したが]わず、災[わざわ]いが私たちに付[つ]きまとったのです。"
  5: "私たちの父[ちち]たちの不正[ふせい]を思[おも]い出[だ]さないでください。この時[とき]に、あなたの御手[みて]と御名[みな]を思[おも]い起[おこ]してください。"
  6: "あなたは私たちの神[かみ]である主[しゅ]であり、私たちはあなたを賛美[さんび]します、主[しゅ]よ。"
  7: "あなたは、私たちがあなたの名[な]を呼[よ]び求[もと]めるために、私たちの心[こころ]にあなたへの恐[おそ]れを置[お]かれました。それゆえ、私たちは移[うつ]された地[ち]でもあなたを賛美[さんび]します。私たちは、あなたの前[まえ]に罪[つみ]を犯[おか]した父[ちち]たちのすべての不正[ふせい]を、心[こころ]から退[しりぞ]けたからです。"
  8: "見[み]よ、今日[きょう]、私たちは私たちの移[うつ]された地[ち]にいます。あなたがそこへ私たちを散[ち]らして、嘲[あざけ]りと呪[のろ]いと負[お]い目[め]の的[まと]とされた地[ち]です。それは、あなたから離[はな]れた私たちの父[ちち]たちのすべての不正[ふせい]のためです。」"
  9: "イスラエルよ、命[いのち]の戒[いまし]めを聞[き]け。悟[さと]りを知[し]るために耳[みみ]を傾[かたむ]けよ。"
  10: "イスラエルよ、どうしたことか。なぜ、あなたは敵[てき]の地[ち]にいるのか。なぜ、異[い]なる地[ち]で古[ふる]びてしまったのか。"
  11: "あなたは死[し]んだ者[もの]たちとともに汚[けが]れ、陰府[よみ]に下[くだ]った者[もの]たちのうちに数[かぞ]えられた。"
  12: "あなたは知恵[ちえ]の泉[いずみ]を捨[す]てた。"
  13: "もしあなたが神[かみ]の道[みち]を歩[あゆ]んでいたなら、永遠[えいえん]に平和[へいわ]のうちに住[す]んでいたであろう。"
  14: "学[まな]べ。悟[さと]りはどこにあるのか。力[ちから]はどこにあるのか。共[とも]に知[し]る分別[ふんべつ]はどこにあるのか。長命[ちょうめい]と命[いのち]はどこにあるのか。目[め]の光[ひかり]と平和[へいわ]はどこにあるのか。"
  15: "だれが知恵[ちえ]の場所[ばしょ]を見[み]いだしたのか。だれがその宝庫[ほうこ]に入[はい]ったのか。"
  16: "国々[くにぐに]の君[きみ]たちはどこにいるのか。地[ち]の獣[けもの]たちを治[おさ]めた者[もの]たち、"
  17: "空[そら]の鳥[とり]を玩[もてあそ]び、人[ひと]々[びと]が頼[たよ]りにした銀[ぎん]と金[きん]を蓄[たくわ]え、その財産[ざいさん]に終[お]わりがなかった者[もの]たち、"
  18: "銀[ぎん]を打[う]ち、心[こころ]を煩[わずら]わせた者[もの]たちはどこにいるのか。彼らのわざは数[かぞ]え切[き]れなかった。"
  19: "彼らは消[き]え去[さ]り、陰府[よみ]に下[くだ]った。ほかの者[もの]たちが彼らに代[か]わって立[た]った。"
  20: "後[のち]に生[う]まれた者[もの]たちは光[ひかり]を見[み]、地[ち]に住[す]んだが、知識[ちしき]の道[みち]を知[し]らなかった。"
  21: "彼らは知恵[ちえ]の小径[こみち]を悟[さと]らず、これを受[う]け入[い]れもしなかった。その子[こ]らは自分[じぶん]たちの道[みち]から遠[とお]く離[はな]れてしまった。"
  22: "知恵[ちえ]のことはカナンでも聞[き]かれず、テマンでも見[み]られなかった。"
  23: "地[ち]で分別[ふんべつ]を求[もと]めるハガルの子[こ]らも、メランとテマンの商人[しょうにん]たちも、物語[ものがたり]を語[かた]る者[もの]たちも、分別を探[さが]し求める者[もの]たちも、知恵[ちえ]の道[みち]を知[し]らず、その小径[こみち]を思[おも]い出[だ]しもしなかった。"
  24: "ああ、イスラエルよ。神[かみ]の家[いえ]はなんと大[おお]きく、その所有[しょゆう]の場所[ばしょ]はなんと広[ひろ]いことか。"
  25: "大[おお]きくて終[お]わりがなく、高[たか]くて量[はか]り知[し]れない。"
  26: "そこには、昔[むかし]から名[な]の知[し]られた巨人[きょじん]たちが生[う]まれた。大[おお]きな体[からだ]を持[も]ち、戦[いくさ]を知[し]る者[もの]たちである。"
  27: "神[かみ]は彼らを選[えら]ばず、知識[ちしき]の道[みち]を彼らに与[あた]えなかった。"
  28: "彼らは悟[さと]りを持[も]たなかったために滅[ほろ]び、思慮[しりょ]のなさのために滅[ほろ]びた。"
  29: "だれが天[てん]に上[のぼ]って知恵[ちえ]を取[と]り、雲[くも]からそれを持[も]ち下[お]ろしたのか。"
  30: "だれが海[うみ]の向[む]こう岸[ぎし]へ渡[わた]ってそれを見[み]いだし、選[えら]ばれた金[きん]と引[ひ]き換[か]えにそれを手[て]に入[い]れるのか。"
  31: "その道[みち]を知[し]る者[もの]はなく、その小径[こみち]を思[おも]い巡[めぐ]らす者[もの]もいない。"
  32: "しかし、すべてを知[し]っておられる方[かた]が知恵[ちえ]を知[し]り、ご自身[じしん]の分別[ふんべつ]によってそれを見出[みいだ]された。地[ち]を永遠[えいえん]の時[とき]のために造[つく]られた方[かた]である。その方は地を、二[に]本足[ほんあし]のものと四[よ]つ足[あし]の獣[けもの]で満[み]たされた。"
  33: "光[ひかり]を送[おく]ると、それが進[すす]む方[かた]である。呼[よ]ばれると、光は震[ふる]えながらそれに従[したが]った。"
  34: "星[ほし]たちはそれぞれの見張[みは]り所[じょ]で輝[かがや]き、喜[よろこ]んだ。"
  35: "神[かみ]が彼らを呼[よ]ぶと、彼らは「ここにいます」と言[い]い、造[つく]られた方[かた]のために喜[よろこ]びをもって輝[かがや]いた。"
  36: "この方[かた]こそ私たちの神[かみ]である。ほかの者[もの]がこの方と並[なら]び数[かぞ]えられることはない。"
  37: "この方は知識[ちしき]のすべての道[みち]を見出[みいだ]し、それをご自分[じぶん]の僕[しもべ]ヤコブと、ご自分が愛[あい]されたイスラエルに与[あた]えられた。"
  38: "その後[のち]、この方は地[ち]の上[うえ]に現[あらわ]れ、人[ひと]々[びと]の間[あいだ]に住[す]まわれた。"

notes:
  1: "κύριε παντοκράτωρ ὁ θεὸς Ισραηλ — «Господи Вседержителю, Боже Израилев» (παντοκράτωρ — 全能者; слав. «вседержителю»); ψυχὴ ἐν στενοῖς — «душа в тесноте» (στενοί — 狭い所); πνεῦμα ἀκηδιῶν — «дух уныния» (ἀκηδία — уныние, 倦怠); κέκραγεν πρὸς σέ — «возопила к Тебе» (κράζω, перфект)."
  2: "ἄκουσον, κύριε, καὶ ἐλέησον — «услышь, Господи, и помилуй»; ὅτι ἡμάρτομεν ἐναντίον σου — «ибо мы согрешили пред Тобою». Слав. добавляет «яко еси Бог милосерд, и помилуй нас» — распространение, в LXX его нет; в текст не внесено."
  3: "σὺ καθήμενος τὸν αἰῶνα — «Ты, сидящий (пребывающий) в век» (κάθημαι; слав. «пребываяй во век»); ἡμεῖς ἀπολλύμενοι τὸν αἰῶνα — «мы, погибающие в век» (ἀπόλλυμι)."
  4: "ἄκουσον δὴ τῆς προσευχῆς τῶν τεθνηκότων Ισραηλ — «услышь же молитву умерших Израиля» (θνῄσκω; тёмное место: умершие в плену, ср. 3:11); υἱῶν τῶν ἁμαρτανόντων ἐναντίον σου — «сынов, согрешивших пред Тобою»; οἳ οὐκ ἤκουσαν τῆς φωνῆς κυρίου θεοῦ αὐτῶν — «которые не послушали гласа Господа Бога своего»; ἐκολλήθη ἡμῖν τὰ κακά — «прилепились к нам бедствия»."
  5: "μὴ μνησθῇς ἀδικιῶν πατέρων ἡμῶν — «не вспомни неправд отцов наших» (μνησθῇς — аорист в запрете); ἀλλὰ μνήσθητι χειρός σου καὶ ὀνόματός σου — «но вспомни руку Твою и имя Твоё»; ἐν τῷ καιρῷ τούτῳ — «в это время»."
  6: "ὅτι σὺ κύριος ὁ θεὸς ἡμῶν — «ибо Ты Господь Бог наш»; αἰνέσομέν σε, κύριε — «и прославим Тебя, Господи» (αἰνέω)."
  7: "διὰ τοῦτο ἔδωκας τὸν φόβον σου ἐπὶ καρδίαν ἡμῶν — «для того Ты дал страх Твой на сердце наше»; τοῦ ἐπικαλεῖσθαι τὸ ὄνομά σου — «чтобы призывать имя Твоё» (ἐπικαλέομαι); αἰνέσομέν σε ἐν τῇ ἀποικίᾳ ἡμῶν — «прославим Тебя в переселении нашем» (ἀποικία); ἀπεστρέψαμεν ἀπὸ καρδίας ἡμῶν πᾶσαν ἀδικίαν πατέρων ἡμῶν — «мы отвратили от сердца нашего всякую неправду отцов наших»."
  8: "ἰδοὺ ἡμεῖς σήμερον ἐν τῇ ἀποικίᾳ ἡμῶν — «вот, мы сегодня в переселении нашем»; οὗ διέσπειρας ἡμᾶς ἐκεῖ εἰς ὀνειδισμὸν καὶ εἰς ἀρὰν καὶ εἰς ὄφλησιν — «куда Ты рассеял нас в поношение, в клятву и в долг (взыскание)» (ὄφλησις — долг, повинность; слав. «удержание»; передано 負い目の的); κατὰ πάσας τὰς ἀδικίας πατέρων ἡμῶν — «за все неправды отцов наших»; οἳ ἀπέστησαν ἀπὸ κυρίου θεοῦ ἡμῶν — «которые отступили от Господа Бога нашего». Здесь молитва закрывается (」); дальше поэма о премудрости без внешних кавычек."
  9: "Начало поэмы о премудрости (3:9–4:4), авторская речь без кавычек; Ἄκουε, Ισραηλ, ἐντολὰς ζωῆς — «слушай, Израиль, заповеди жизни» (ἐντολή — 戒め); ἐνωτίσασθε γνῶναι φρόνησιν — «внемлите, чтобы уразуметь разумение» (ἐνωτίζομαι — внимать; φρόνησις — 悟り)."
  10: "τί ἐστιν, Ισραηλ, τί ὅτι ἐν γῇ τῶν ἐχθρῶν εἶ — «что это, Израиль, что ты в земле врагов» (риторический вопрос); ἐπαλαιώθης ἐν γῇ ἀλλοτρίᾳ — «состарился ты в земле чужой» (παλαιόω — старить)."
  11: "συνεμιάνθης τοῖς νεκροῖς — «ты осквернился с мёртвыми» (μιαίνω — осквернять); προσελογίσθης μετὰ τῶν εἰς ᾅδου — «причислен к находящимся в аде» (προσλογίζομαι — причислять; ᾅδης — 陰府)."
  12: "ἐγκατέλιπες τὴν πηγὴν τῆς σοφίας — «ты оставил источник премудрости» (ἐγκαταλείπω — оставлять; πηγή — 泉; σοφία — 知恵)."
  13: "τῇ ὁδῷ τοῦ θεοῦ εἰ ἐπορεύθης — «если бы ты ходил путём Божиим» (в LXX без ἄν, условие нереальное); κατῴκεις ἂν ἐν εἰρήνῃ τὸν αἰῶνα — «жил бы в мире вовеки» (κατοικέω)."
  14: "μάθε ποῦ ἐστιν φρόνησις — «научись, где разумение» (μανθάνω); ποῦ ἐστιν ἰσχύς — «где сила»; ποῦ ἐστιν σύνεσις τοῦ γνῶναι ἅμα — «где разумение, чтобы познать вместе» (σύνεσις — 分別; ἅμα — сразу, вместе); μακροβίωσις καὶ ζωή — «долгожитие и жизнь» (μακροβίωσις — 長命); φῶς ὀφθαλμῶν καὶ εἰρήνη — «свет очей и мир». Вопросы переданы раздельными предложениями, как в слав."
  15: "τίς εὗρεν τὸν τόπον αὐτῆς — «кто нашёл место её» (αὐτῆς — премудрости); τίς εἰσῆλθεν εἰς τοὺς θησαυροὺς αὐτῆς — «кто вошёл в сокровищницы её» (θησαυρός — 宝庫)."
  16: "ποῦ εἰσιν οἱ ἄρχοντες τῶν ἐθνῶν — «где князья народов»; οἱ κυριεύοντες τῶν θηρίων τῶν ἐπὶ τῆς γῆς — «владеющие зверями земными» (κυριεύω; θηρίον — 獣). Перечень продолжается в 17–18, сказуемое «где» — в 18."
  17: "οἱ ἐν τοῖς ὀρνέοις τοῦ οὐρανοῦ ἐμπαίζοντες — «забавляющиеся птицами небесными» (ἐμπαίζω — играть, издеваться); τὸ ἀργύριον θησαυρίζοντες καὶ τὸ χρυσίον — «собирающие серебро и золото»; ᾧ ἐπεποίθεισαν ἄνθρωποι — «на которое надеялись люди» (πείθω в перфекте — полагаться); οὐκ ἔστιν τέλος τῆς κτήσεως αὐτῶν — «нет конца приобретению их» (κτῆσις — 財産)."
  18: "οἱ τὸ ἀργύριον τεκταίνοντες — «обрабатывающие серебро» (τεκταίνω — мастерить, плавить; тёмное место); μεριμνῶντες — «заботящиеся»; οὐκ ἔστιν ἐξεύρεσις τῶν ἔργων αὐτῶν — «нет изыскания (счёта) делам их» (ἐξεύρεσις — изобретение, исчисление; передано 数え切れない). Здесь заканчивается перечень 16–18."
  19: "ἠφανίσθησαν — «исчезли» (ἀφανίζω); εἰς ᾅδου κατέβησαν — «сошли в ад»; ἄλλοι ἀντανέστησαν ἀντ᾽ αὐτῶν — «другие встали вместо них» (ἀντανίστημι)."
  20: "νεώτεροι εἶδον φῶς — «младшие (позднейшие) увидели свет» (νεώτερος; слав. «юнейшии»); κατῴκησαν ἐπὶ τῆς γῆς — «поселились на земле»; ὁδὸν δὲ ἐπιστήμης οὐκ ἔγνωσαν — «но пути знания не познали» (ἐπιστήμη — 知識)."
  21: "οὐδὲ συνῆκαν τρίβους αὐτῆς — «и не уразумели стезей её» (τρίβος — 小径); οὐδὲ ἀντελάβοντο αὐτῆς — «и не приняли её» (ἀντιλαμβάνομαι — держаться, принимать); οἱ υἱοὶ αὐτῶν ἀπὸ τῆς ὁδοῦ αὐτῶν πόρρω ἐγενήθησαν — «сыны их от пути своего далеко стали» (в LXX αὐτῶν — «их»; ru понимает «её», слав. «своего»; передано 自分たちの道)."
  22: "οὐδὲ ἠκούσθη ἐν Χανααν — «не слышно было в Ханаане» (Χανααν — カナン, форма корпуса; LXX держит непреческое написание); οὐδὲ ὤφθη ἐν Θαιμαν — «и не видно было в Фемане» (Θαιμαν — テマン, идумейский город)."
  23: "υἱοὶ Αγαρ οἱ ἐκζητοῦντες τὴν σύνεσιν ἐπὶ τῆς γῆς — «сыны Агари, ищущие разумения на земле» (Αγαρ — ハガル; ἐκζητέω — разыскивать); οἱ ἔμποροι τῆς Μερραν καὶ Θαιμαν — «купцы Меррана и Фемана» (Μερραν — メラン, тёмное имя); οἱ μυθολόγοι — «баснословы» (μυθολόγος — рассказчик басен, 物語を語る者); οἱ ἐκζητηταὶ τῆς συνέσεως — «искатели разумения»; ὁδὸν τῆς σοφίας οὐκ ἔγνωσαν — «пути премудрости не познали»; οὐδὲ ἐμνήσθησαν τὰς τρίβους αὐτῆς — «и не вспомнили стезей её»."
  24: "ὦ Ισραηλ — «о Израиль»; ὡς μέγας ὁ οἶκος τοῦ θεοῦ — «как велик дом Божий»; ἐπιμήκης ὁ τόπος τῆς κτήσεως αὐτοῦ — «пространно место владения Его» (ἐπιμήκης — длинный, обширный; κτῆσις — владение, 所有)."
  25: "μέγας καὶ οὐκ ἔχει τελευτήν — «велик и не имеет конца» (τελευτή — конец); ὑψηλὸς καὶ ἀμέτρητος — «высок и неизмерим» (ἀμέτρητος — 量り知れない)."
  26: "ἐκεῖ ἐγεννήθησαν οἱ γίγαντες οἱ ὀνομαστοὶ οἱ ἀπ᾽ ἀρχῆς — «там родились исполины, славные от начала» (γίγας — 巨人; ὀνομαστός — знаменитый); γενόμενοι εὐμεγέθεις — «ставшие весьма великими» (εὐμεγέθης); ἐπιστάμενοι πόλεμον — «умеющие воевать» (ἐπίσταμαι)."
  27: "οὐ τούτους ἐξελέξατο ὁ θεὸς — «не их избрал Бог» (ἐκλέγω); οὐδὲ ὁδὸν ἐπιστήμης ἔδωκεν αὐτοῖς — «и пути знания не дал им»."
  28: "ἀπώλοντο παρὰ τὸ μὴ ἔχειν φρόνησιν — «погибли из-за того, что не имели разумения» (παρά с acc. — по причине); ἀπώλοντο διὰ τὴν ἀβουλίαν αὐτῶν — «погибли из-за неразумия своего» (ἀβουλία — безрассудство, 思慮のなさ)."
  29: "τίς ἀνέβη εἰς τὸν οὐρανὸν καὶ ἔλαβεν αὐτὴν — «кто взошёл на небо и взял её»; κατεβίβασεν αὐτὴν ἐκ τῶν νεφελῶν — «свёл её с облаков» (καταβιβάζω — сводить; νεφέλη — 雲)."
  30: "τίς διέβη πέραν τῆς θαλάσσης — «кто перешёл за море» (διαβαίνω); εὗρεν αὐτὴν — «нашёл её»; οἴσει αὐτὴν χρυσίου ἐκλεκτοῦ — «принесёт её за отборное золото» (χρυσίον ἐκλεκτόν — 選ばれた金)."
  31: "οὐκ ἔστιν ὁ γινώσκων τὴν ὁδὸν αὐτῆς — «нет знающего путь её»; ὁ ἐνθυμούμενος τὴν τρίβον αὐτῆς — «помышляющий о стезе её» (ἐνθυμέομαι)."
  32: "ὁ εἰδὼς τὰ πάντα γινώσκει αὐτήν — «Знающий всё знает её»; ἐξεῦρεν αὐτὴν τῇ συνέσει αὐτοῦ — «нашёл её разумением Своим» (σύνεσις — 分別); ὁ κατασκευάσας τὴν γῆν εἰς τὸν αἰῶνα χρόνον — «устроивший землю на вечное время» (κατασκευάζω); ἐνέπλησεν αὐτὴν κτηνῶν τετραπόδων — «наполнил её четвероногими скотами» (κτῆνος — скот; τετράπους — четвероногий); слав. добавляет «двоножным и» (二本足のもの) — в LXX нет, внесено в текст, отмечено."
  33: "ὁ ἀποστέλλων τὸ φῶς, καὶ πορεύεται — «посылающий свет, и он идёт» (ἀποστέλλω); ἐκάλεσεν αὐτό, καὶ ὑπήκουσεν αὐτῷ τρόμῳ — «позвал его, и послушался он со трепетом» (ὑπακούω; τρόμος — трепет)."
  34: "οἱ δὲ ἀστέρες ἔλαμψαν ἐν ταῖς φυλακαῖς αὐτῶν — «звёзды воссияли в стражах (черёдах) своих» (φυλακή — стража, черёд; 見張り所); εὐφράνθησαν — «возвеселились»."
  35: "ἐκάλεσεν αὐτοὺς καὶ εἶπον Πάρεσμεν — «позвал их, и сказали: мы здесь» (πάρειμι — присутствовать); ἔλαμψαν μετ᾽ εὐφροσύνης τῷ ποιήσαντι αὐτούς — «воссияли с веселием Сотворившему их». Слова звёзд — 「…」; внешних кавычек нет, потому что поэма не в кавычках."
  36: "οὗτος ὁ θεὸς ἡμῶν — «сей есть Бог наш» (οὗτος указательное; jp-joc: 是は我が神なり); οὐ λογισθήσεται ἕτερος πρὸς αὐτόν — «не сочтётся (не сравнится) иной с Ним» (λογίζομαι — считать, вменять)."
  37: "ἐξεῦρεν πᾶσαν ὁδὸν ἐπιστήμης — «Он нашёл всякий путь знания» (ἐξευρίσκω — находить, изобретать); ἔδωκεν αὐτὴν Ιακωβ τῷ παιδὶ αὐτοῦ — «дал её Иакову, рабу Своему» (παῖς — 僕); Ισραηλ τῷ ἠγαπημένῳ ὑπ᾽ αὐτοῦ — «Израилю, возлюбленному Им» (ἀγαπάω)."
  38: "μετὰ τοῦτο — «после этого»; ἐπὶ τῆς γῆς ὤφθη — «на земле явился» (ὁράω в пассиве); ἐν τοῖς ἀνθρώποις συνανεστράφη — «с людьми обращался (жил вместе)» (συναναστρέφω — общаться, жить вместе; jp-joc: 人人の間に在せり); передано 住まわれた. Здесь кончается свидетельство jp-joc."
