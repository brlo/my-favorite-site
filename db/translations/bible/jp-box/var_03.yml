# jp-box, Варух, глава 3. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для книги есть только в 3:36–4:4 (7 стихов), здесь 3:36–38 —
# свидетель церковного чтения; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Нумерация по gr: 38 стихов; совпадает со слав. и Синодальным, точек-лакун нет.
# Глава 3: 1–8 конец молитвы-исповедания (1:15–3:8): «душа в тесноте и дух уныния
# воззвали», «Ты пребываешь в век, а мы погибаем», молитва об умерших Израиля,
# «не вспомни неправд отцов», страх Божий в сердце и прославление в переселении;
# 9–4:4 поэма о премудрости: 9–14 «слушай, Израиль, заповеди жизни», 10–13 плен
# и оставленный источник премудрости, 14–15 «где разумение, где сила», 16–23 князья,
# купцы и баснословы не нашли её, 24–28 дом Божий велик, исполины погибли без
# разумения, 29–31 никто не взошёл на небо и не перешёл моря, 32–35 Бог нашёл её
# разумением Своим, свет и звёзды слушают Его, 36–38 «сей Бог наш… явился на земле
# и жил с людьми».
# Голоса и кавычки: 3:1–8 — 「…» (конец молитвы, продолжение из главы 2 без новой
# формулы, закрывается в 3:8); 3:9–38 — авторская (поэтическая) речь без кавычек;
# 3:35 — слова звёзд в 「…」 (вложенности нет, поэма не в кавычках).
# 〔…〕 нет: все 38 стихов и все слова есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 全能者, 陰府, 知恵, 悟り, 分別, 知識, 巨人, 宝庫, 陰府 уже в корпусе
# или понятны; メラン, テマン, ハガル, カナン — транслитерации, оговорены в notes.
# Имена: イスラエル, ヤコブ, モーセ, カナン, テマン, メラン, ハガル — по корпусу
# (カナン — форма корпуса для LXX Χανααν; ハガル, テマン — новые в книге, но
# транслитерация обычная).

