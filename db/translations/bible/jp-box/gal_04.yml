verses:
  1: "わたしは言[い]う。相続人[そうぞくにん]は、まだ未成年[みせいねん]の間[あいだ]は、すべてのものの主[ぬし]でありながら、奴隷[どれい]と何[なに]も変[か]わらない。"
  2: "しかし、父[ちち]が定[さだ]めた時[とき]が来[く]るまで、後見人[こうけんにん]と家[いえ]の管理人[かんりにん]の下[もと]にあるのである。"
  3: "わたしたちも同じである。まだ未成年であったときには、世[よ]の基本[きほん]要素[ようそ]⟨この世[よ]を支配[しはい]する霊的[れいてき]な力[ちから]、または初歩[しょほ]の原理[げんり]を指[さ]す。⟩の下[もと]に奴隷[どれい]とされていたのである。"
  4: "しかし、時[とき]の満[み]ちるに至[いた]って、神[かみ]はご自分[じぶん]の子[こ]を遣[つか]わされた。子[こ]は女[おんな]から生[う]まれ、律法[りっぽう]の下[もと]に生[う]まれた。"
  5: "それは、律法[りっぽう]の下[もと]にある者[もの]たちを贖[あがな]い出[だ]すため、わたしたちが子[こ]としての身分[みぶん]を受[う]け取[と]るためであった。"
  6: "あなたがたが子[こ]であるからには、神[かみ]はその御子[みこ]の霊[れい]をあなたがたの心[こころ]に遣[つか]わされた。その霊[れい]が「アバ、父[ちち]よ」と叫[さけ]ばれるのである。"
  7: "だから、あなたはもはや奴隷[どれい]ではなく、子[こ]である。子[こ]であるなら、〔イエス・キリストによって〕神[かみ]の相続人[そうぞくにん]なのである。"
  8: "しかし、その当時[とうじ]、神[かみ]を知[し]らなかったあなたがたは、本性[ほんせい]において神[かみ]ではない者[もの]たちに仕[つか]えていた。"
  9: "ところが今[いま]、神[かみ]を知[し]ったあなたがたは——いや、神[かみ]に知[し]られたあなたがたは——どうしてまた、弱[よわ]く貧[まず]しい基本[きほん]要素[ようそ]に引[ひ]き返[かえ]し、もう一度[いちど]、その奴隷[どれい]になろうとするのか。"
  10: "あなたがたは日[ひ]と月[つき]と季節[きせつ]と年[とし]とを守[まも]っている。"
  11: "わたしはあなたがたのために恐[おそ]れている。あなたがたのために労[ろう]したことが、むだになってしまうのではないか、と。"
  12: "兄弟[きょうだい]たちよ、わたしはあなたがたに願[ねが]っている。わたしのようになりなさい。わたしもあなたがたのようになったのだから。あなたがたはわたしに何[なに]ひとつ不当[ふとう]なことをしなかった。"
  13: "あなたがたが知[し]っているとおり、わたしが初[はじ]めてあなたがたに福音[ふくいん]を宣[の]べ伝[つた]えたのは、肉[にく]の弱[よわ]さのためであった。"
  14: "そして、わたしの肉[にく]にあった、わたしの試練[しれん]を、あなたがたは見下[みくだ]しもせず、吐[は]き捨[す]てもせず、かえって神[かみ]の使[つか]いのように、キリスト・イエスのように、わたしを受[う]け入[い]れてくれた。"
  15: "それでは、あなたがたのあの祝福[しゅくふく]の言葉[ことば]は、どこへ行[い]ったのか。わたしはあなたがたに証[あかし]する。できれば、あなたがたは自分[じぶん]の目[め]をえぐり出[だ]して、わたしに与[あた]えたであろう。"
  16: "では、わたしは、あなたがたに真実[しんじつ]を語[かた]ったために、あなたがたの敵[てき]になったというのか。"
  17: "彼[かれ]らはあなたがたに熱心[ねっしん]だが、それは良[よ]い心[こころ]からではない。あなたがたが自分[じぶん]たちのために熱心[ねっしん]になるようにと、あなたがたを切[き]り離[はな]そうとしているのだ。"
  18: "善[よ]いことのために熱心[ねっしん]に求[もと]められるのは、いつでも良[よ]いことである。わたしがあなたがたと共[とも]にいる時[とき]に限[かぎ]らない。"
  19: "わたしの小[ちい]さな子[こ]たちよ。キリストがあなたがたの内[うち]に形[かたち]づくられるまで、わたしはもう一度[いちど]、あなたがたのために産[さん]の苦[くる]しみを味[あじ]わっているのである。"
  20: "わたしは今[いま]、あなたがたのそばにいて、声[こえ]を変[か]えたいと願[ねが]っている。あなたがたのことで、どうしてよいか分[わ]からなくなっているからである。"
  21: "律法[りっぽう]の下[もと]にありたいと願[ねが]っている者[もの]たちよ、わたしに言[い]ってみなさい。あなたがたは律法[りっぽう]を聞[き]いていないのか。"
  22: "というのは、アブラハムには二人[ふたり]の子[こ]があったと書[か]かれているからである。一人[ひとり]は女奴隷[おんなどれい]から、一人[ひとり]は自由[じゆう]な女[おんな]からである。"
  23: "しかし、女奴隷[おんなどれい]からの子[こ]は肉[にく]に従[したが]って生[う]まれ、自由[じゆう]な女[おんな]からの子[こ]は約束[やくそく]によって生[う]まれたのである。"
  24: "これらのことは、たとえて言[い]われているのである。というのは、この二人[ふたり]の女[おんな]は二[ふた]つの契約[けいやく]だからである。一[ひと]つはシナイ山[さん]から出[で]て、奴隷[どれい]となる者[もの]を生[う]む。それがハガルである。"
  25: "このハガルとは、アラビアにあるシナイ山[さん]のことである。そして、今[いま]のエルサレムに当[あた]る。彼女[かのじょ]はその子[こ]どもたちとともに奴隷[どれい]だからである。"
  26: "しかし、上[うえ]のエルサレムは自由[じゆう]であり、わたしたちの母[はは]である。"
  27: "というのは、こう書[か]かれているからである。「子[こ]を産[う]まない、不妊[ふにん]の女[おんな]よ、喜[よろこ]べ。産[さん]の苦[くる]しみを知[し]らない女[おんな]よ、声[こえ]をあげて叫[さけ]べ。荒[あ]れ果[は]てた女[おんな]の子[こ]どもは、夫[おっと]のある女[おんな]の子[こ]どもよりも多[おお]いからである。」"
  28: "兄弟[きょうだい]たちよ、わたしたちはイサクのように、約束[やくそく]の子[こ]どもなのである。"
  29: "しかし、当時[とうじ]、肉[にく]に従[したが]って生[う]まれた者[もの]が、霊[れい]に従[したが]って生[う]まれた者[もの]を迫害[はくがい]したように、今[いま]もまた、そのとおりである。"
  30: "しかし、聖書[せいしょ]は何[なに]と言[い]っているか。「女奴隷[おんなどれい]とその子[こ]を追[お]い出[だ]せ。女奴隷[おんなどれい]の子[こ]は、自由[じゆう]な女[おんな]の子[こ]とともに、決[けっ]して相続[そうぞく]することはないからである。」"
  31: "だから、兄弟[きょうだい]たちよ、わたしたちは女奴隷[おんなどれい]の子[こ]ではなく、自由[じゆう]な女[おんな]の子[こ]なのである。"

notes:
  1: "νήπιος — несовершеннолетний (未成年): юридическая метафора наследника. κύριος πάντων ὤν — «будучи господином всего»; 主[ぬし]."
  2: "ἐπίτροπος — 後見人; οἰκονόμος — 家の管理人; ἄχρι τῆς προθεσμίας τοῦ πατρός — до срока, назначенного отцом."
  3: "στοιχεῖα τοῦ κόσμου — 世の基本要素; сноска-пояснение (мест. 4:9). δεδουλωμένοι — perfect pass., 奴隷とされていた."
  4: "τὸ πλήρωμα τοῦ χρόνου — 時が満ちる. Двойное γενόμενον сохранено повтором 生まれ…生まれた (女から, 律法の下に)."
  5: "ἐξαγοράσῃ — 贖い出す; υἱοθεσία — 子としての身分 (ср. Рим 8:15). Два ἵνα переданы двумя ため."
  6: "В базе εἰς τὰς καρδίας ἡμῶν; церковный текст (слав. «в сердца ваша», Синодальный, jp-joc) читает ὑμῶν — あなたがたの心. Замена, без 〔〕. Αββα ὁ πατήρ — 「アバ、父よ」, как Рим 8:15."
  7: "В базе κληρονόμος διὰ θεοῦ («через Бога»); церковный текст (слав. «наследник Божий Иисус Христом», Синодальный «наследник Божий через Иисуса Христа», jp-joc) читает с Χριστοῦ — 〔イエス・キリストによって〕. Проверено: Ἰησοῦ/Χριστοῦ в стихе — 0."
  8: "φύσει μὴ οὖσιν θεοῖς — «тем, кто по природе не боги»; 本性において神ではない者たち."
  9: "γνόντες… μᾶλλον δὲ γνωσθέντες — «познав… вернее, будучи познаны»; тире сохранено. ἀσθενῆ καὶ πτωχά — 弱く貧しい."
  10: "παρατηρεῖσθε — «наблюдаете» (о днях); 守っている."
  11: "φοβοῦμαι ὑμᾶς μή πως εἰκῇ κεκοπίακα — むだになったのではないか, с вопросительным と."
  12: "γίνεσθε ὡς ἐγώ — わたしのようになりなさい (императив не смягчён). κἀγὼ ὡς ὑμεῖς — わたしもあなたがたのようになった. οὐδέν με ἠδικήσατε — 何ひとつ不当なことをしなかった."
  13: "δι' ἀσθένειαν τῆς σαρκός — «из-за немощи плоти»; 肉の弱さ."
  14: "В базе τὸν πειρασμὸν ὑμῶν («ваше искушение»); церковный текст (слав. «искушения моего», Синодальный, jp-joc) читает μου — わたしの肉にあった、わたしの試練. Замена, без 〔〕. ἐξεπτύσατε — «выплюнули, отвергли»; 吐き捨てる."
  15: "μακαρισμός — «провозглашение блаженным»; 祝福の言葉. ἐξορύξαντες — えぐり出す."
  16: "ἀληθεύων ὑμῖν — «говоря вам истину»; риторический вопрос сохранён."
  17: "ζηλοῦσιν ὑμᾶς οὐ καλῶς — 熱心だが良い心からではない. ἐκκλεῖσαι — «отрезать, запереть»; 切り離す. ἵνα αὐτοὺς ζηλοῦτε — 自分たちに熱心になるように."
  18: "ζηλοῦσθαι ἐν καλῷ πάντοτε — 善いことのために熱心に求められるのは、いつでも良いこと. Второй член эллиптичен, как в греческом."
  19: "τεκνία — 小さな子たち; ὠδίνω — «мучаюсь родами»; 産みの苦しみ. μορφωθῇ Χριστὸς ἐν ὑμῖν — キリストが…形づくられる."
  20: "ἀλλάξαι τὴν φωνήν — «переменить голос»; 声を変える. ἀποροῦμαι ἐν ὑμῖν — どうしてよいか分からない."
  21: "οἱ ὑπὸ νόμον θέλοντες εἶναι — 律法の下にありたいと願う者たち; τὸν νόμον οὐκ ἀκούετε — риторический вопрос."
  22: "παιδίσκη — 女奴隷; ἐλευθέρα — 自由な女."
  23: "κατὰ σάρκα… δι' ἐπαγγελίας — 肉に従って…約束によって; противопоставление сохранено."
  24: "ἀλληγορούμενα — たとえて言われている; αὗται — この二人の女 (Агарь и свободная); δύο διαθῆκαι — 二つの契約; εἰς δουλείαν γεννῶσα — 奴隷となる者を生む."
  25: "τὸ δὲ Ἁγὰρ Σινᾶ ὄρος — このハガルとは…シナイ山のこと; συστοιχεῖ — 今のエルサレムに当たる."
  26: "ἄνω Ἰερουσαλήμ — 上のエルサレム. Слав. «матерь всем нам» добавляет πάντων; в базе μήτηρ ἡμῶν — わたしたちの母, по базе."
  27: "Ис 54:1, 「…」. ῥῆξον — «разразись (песнью)»; 声をあげて叫べ. τῆς ἐρήμου — 荒れ果てた女; τῆς ἐχούσης τὸν ἄνδρα — 夫のある女."
  28: "В базе ὑμεῖς («вы»); церковный текст (слав. «Мы же», Синодальный, jp-joc) читает ἡμεῖς — わたしたち. Замена, без 〔〕. κατὰ Ἰσαάκ — イサクのように."
  29: "ὁ κατὰ σάρκα… ὁ κατὰ πνεῦμα — 肉に従って生まれた者…霊に従って生まれた者; ἐδίωκεν — 迫害した (Быт 21:9)."
  30: "Быт 21:10, 「…」. οὐ μὴ κληρονομήσει — усиленное отрицание, 決して…ない."
  31: "διό — だから; вывод к 4:28."
