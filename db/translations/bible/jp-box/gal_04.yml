# jp-box, Послание к Галатам, глава 4. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 4: детство и полнота времени (1–7), страх за галатов (8–20),
# Агарь и Сара (21–31).
# Красного (<j>) и синего (<mo>) нет: прямой речи Христа и Богородицы в главе нет.
# 〔…〕 одно: 4:7 — церковное διὰ Χριστοῦ (в базе κληρονόμος διὰ θεοῦ).
# Сноска ⟨…⟩ одна — 4:3 世の基本要素 (первое место; в 4:9 слово повторяется).
# Замены без скобок: 4:6 (в базе ἡμῶν, церковный текст ὑμῶν), 4:14 (в базе ὑμῶν,
# церковный μου), 4:28 (в базе ὑμεῖς, церковный ἡμεῖς). 4:26: слав. «всем нам»
# добавляет πάντων, в базе μήτηρ ἡμῶν — переведено по базе.
# jp-ni не использовался.

