chapter: 10
draft: true

verses:
  1: "その後[のち]、アンモン人[じん]の王[おう]が死[し]に、その子[こ]アンノンが彼[かれ]に代[か]わって王となった。"
  2: "ダビデは言[い]った。「ナアスの子[こ]アンノンに、その父[ちち]がわたしに施[ほどこ]したのと同[おな]じように、慈[いつく]しみを施そう。」そこでダビデは、その父のことで彼[かれ]を慰[なぐさ]めるために、自分[じぶん]の家来[けらい]たちの手[て]を遣[つか]わした。ダビデの家来たちはアンモン人[じん]の地[ち]に着[つ]いた。"
  3: "アンモン人[じん]の首長[しゅちょう]たちは、自分[じぶん]たちの主[あるじ]であるアンノンに言[い]った。「ダビデがあなたの父[ちち]をあなたの前[まえ]でほめたたえるために、あなたに慰[なぐさ]めの者[もの]たちを遣[つか]わしたのでしょうか。むしろ、この町[まち]を探[さぐ]り、見張[みは]り、探り出[だ]すために、ダビデは自分の家来[けらい]たちをあなたのもとへ遣わしたのではありませんか。」"
  4: "アンノンはダビデの家来[けらい]たちを捕[つか]まえ、彼[かれ]らのひげを半分[はんぶん]そり落[お]とし、上着[うわぎ]を半分、腰[こし]のあたりまで切[き]り取[と]って、彼らを帰[かえ]らせた。"
  5: "この人[ひと]たちのことがダビデに告[つ]げられると、彼[かれ]は彼らを迎[むか]えに人を遣[つか]わした。彼らはひどく辱[はずかし]められていたからである。王[おう]は言[い]った。「ひげが伸[の]びるまでエリコに座[すわ]っていなさい。それから帰[かえ]って来[き]なさい。」"
  6: "アンモン人[じん]は、自分[じぶん]たちがダビデに憎[にく]まれたのを見[み]て、ベト・ロオブのシリア人[じん]、スバとロオブのシリア人[じん]を歩兵[ほへい]二万人[にまんにん]で雇[やと]い、マアハの王[おう]から千人[せんにん]、イストブから一万二千人[いちまんにせんにん]を雇った。"
  7: "ダビデはこれを聞[き]くと、ヨアブと全軍[ぜんぐん]、すなわち勇士[ゆうし]たちを遣[つか]わした。"
  8: "アンモン人[じん]は出[で]て来[き]て、門[もん]の入口[いりぐち]で戦[いくさ]の陣[じん]を敷[し]いた。スバ、ロオブ、イストブ、マアハのシリア人[じん]は、ただ彼[かれ]らだけで野[の]にいた。"
  9: "ヨアブは、戦[いくさ]が自分[じぶん]の前[まえ]と後[うし]ろの両方[りょうほう]から迫[せま]っているのを見[み]て、イスラエルのすべての若者[わかもの]たちから選[えら]び出[だ]し、シリア人[じん]に向[む]かって陣[じん]を敷[し]いた。"
  10: "残[のこ]りの民[たみ]は、その兄弟[きょうだい]アベシャの手[て]に渡[わた]し、アンモン人[じん]に向かって陣を敷[し]いた。"
  11: "彼[かれ]は言[い]った。「もしシリア人[じん]がわたしに勝[か]つなら、あなたはわたしを救[すく]ってくれる。もしアンモン人[じん]があなたに勝つなら、わたしたちがあなたを救おう。"
  12: "勇[いさ]みなさい。わたしたちの民[たみ]と、わたしたちの神[かみ]の町々[まちまち]のために、強[つよ]く立[た]ちましょう。主[しゅ]はその目[め]に良[よ]いと思[おも]われることをなさる。」"
  13: "ヨアブと、彼[かれ]とともにいる民[たみ]は、シリア人[じん]との戦[いくさ]に近[ちか]づいた。すると彼らは彼の前[まえ]から逃[に]げた。"
  14: "アンモン人[じん]は、シリア人[じん]が逃[に]げたのを見[み]て、自分[じぶん]たちもアベシャの前[まえ]から逃げ、町[まち]に入[はい]った。ヨアブはアンモン人[じん]のところから引[ひ]き返[かえ]し、エルサレムに来[き]た。"
  15: "シリア人[じん]は、イスラエルの前[まえ]で敗[やぶ]れたのを見[み]て、一つに集[あつ]まった。"
  16: "アドラアザルは人を遣[つか]わして、川[かわ]ハラマクの向[む]こう側[がわ]のシリア人[じん]を集[あつ]めた。彼[かれ]らはアイラムに来[き]た。アドラアザルの軍[ぐん]の長[ちょう]ソバクが彼らの前[まえ]にいた。"
  17: "ダビデにこのことが告[つ]げられると、彼[かれ]はイスラエルのすべてを集[あつ]め、ヨルダン川[がわ]を渡[わた]ってアイラムに来[き]た。シリア人[じん]はダビデに向[む]かって陣[じん]を敷[し]き、彼と戦[たたか]った。"
  18: "シリア人[じん]はイスラエルの前[まえ]から逃[に]げた。ダビデはシリア人[じん]の戦車[せんしゃ]七百[ななひゃく]と騎兵[きへい]四万[よんまん]を討[う]ち取[と]り、その軍[ぐん]の長[ちょう]ソバクを打[う]った。彼[かれ]はそこで死[し]んだ。"
  19: "アドラアザルに仕[つか]えていたすべての王[おう]たちは、自分[じぶん]たちがイスラエルの前[まえ]で敗[やぶ]れたのを見[み]て、イスラエルに降[くだ]り、彼[かれ]らに仕えた。シリア人[じん]は、もはやアンモン人[じん]を救[すく]うことを恐[おそ]れた。"

notes:
  1: "ἐγένετο μετὰ ταῦτα — «было после сего», т. е. спустя время. ἐβασίλευσεν ἀντ᾿ αὐτοῦ — воцарился вместо него. Αννων — Аннон (アンノン), сын Нааса (Ναας, ナアス; тот же Наас, что в 1 Цар 11)."
  2: "Ποιήσω ἔλεος — сотворю милость (ἔλεος). ὃν τρόπον — каким образом. παρακαλέσαι — утешить (παρακαλέω). ἐν χειρὶ τῶν δούλων — рукою рабов. παῖδες — отроки, слуги (家来)."
  3: "οἱ ἄρχοντες — начальники, князья. Μὴ παρὰ τὸ δοξάζειν …; — «разве ради прославления…?» (вопрос с μή). ὅπως ἐρευνήσωσιν … κατασκοπήσωσιν … κατασκέψασθαι — чтобы исследовали, высмотрели, рассмотрели (ἐρευνάω, κατασκοπέω, κατασκέπτομαι)."
  4: "ἐξύρησεν τοὺς πώγωνας — обрил бороды (πώγων). ἀπέκοψεν τοὺς μανδύας ἐν τῷ ἡμίσει ἕως τῶν ἰσχίων — обрезал одежды наполовину до чресл (μανδύας — плащ, верхняя одежда; ἰσχίον — бедро). ἐξαπέστειλεν — отослал."
  5: "ἀπήγγειλαν … ὑπὲρ τῶν ἀνδρῶν — донесли о мужах. εἰς ἀπάντησιν αὐτῶν — навстречу им. ἠτιμασμένοι σφόδρα — сильно обесчещены (ἀτιμάζω). Καθίσατε — сядьте, оставайтесь; ἐπιστραφήσεσθε — возвратитесь."
  6: "κατῃσχύνθησαν — были посрамлены (καταισχύνω). ἐμισθώσαντο — наняли (μισθόω). τὴν Συρίαν Βαιθροωβ — Сирию Беф-Рехова (ベト・ロオブ); в csl добавлено «Сирию Сувску и Роовлю» (Сува и Рехов) — нет в LXX, внесено в текст по паритету. εἴκοσι χιλιάδας πεζῶν — двадцать тысяч пеших. τὸν βασιλέα Μααχα — царя Маахи (マアハ); в csl-ru здесь «царя амалика мааха» — «Амалик» на месте Маахи, вероятно порча (в LXX и МТ только Мааха), в текст не внесён. Ιστωβ — Истов (イストブ)."
  7: "τὴν δύναμιν, τοὺς δυνατούς — «силу, сильных» (δύναμις, δυνατός); слав. «всю силу сильных»."
  8: "παρετάξαντο πόλεμον παρὰ τῇ θύρᾳ τῆς πύλης — построились на бой у двери ворот. μόνοι ἐν ἀγρῷ — одни в поле. В csl здесь «амалик» вместо Μααχα (см. ст. 6) и вставка в скобках «(сташа)» — редакционное дополнение, в текст не внесено."
  9: "ἀντιπρόσωπον τοῦ πολέμου — «лицом к лицу войны», т. е. бой с фронта. ἐκ τοῦ κατὰ πρόσωπον … καὶ ἐκ τοῦ ὄπισθεν — спереди и сзади. ἐπέλεξεν — избрал (ἐπιλέγω). νεανίσκων — юношей (若者)."
  10: "τὸ κατάλοιπον τοῦ λαοῦ — остаток народа. ἐν χειρὶ Αβεσσα — в руку Авессы (アベシャ; то же имя в 1 Цар 26:6)."
  11: "κραταιωθῇ — одолеет, усилится (κραταιόω). ἔσεσθαί μοι εἰς σωτηρίαν — будешь мне во спасение."
  12: "ἀνδρίζου — мужайся (ἀνδρίζομαι). κραταιωθῶμεν — укрепимся. περὶ τῶν πόλεων τοῦ θεοῦ ἡμῶν — за города Бога нашего. κύριος ποιήσει τὸ ἀγαθὸν ἐν ὀφθαλμοῖς αὐτοῦ — Господь сотворит благое в очах Своих."
  13: "προσῆλθεν … εἰς πόλεμον — приступил на войну. ἔφυγαν ἀπὸ προσώπου αὐτοῦ — побежали от лица его."
  14: "εἶδαν ὅτι ἔφυγεν Συρία — увидели, что Сирия побежала. ἀνέστρεψεν — возвратился."
  15: "ἔπταισεν — «споткнулся», т. е. потерпел поражение (πταίω). συνήχθησαν ἐπὶ τὸ αὐτό — собрались вместе."
  16: "ἀπέστειλεν Αδρααζαρ — послал Адраазар (アドラアザル). τὴν Συρίαν τὴν ἐκ τοῦ πέραν τοῦ ποταμοῦ Χαλαμακ — Сирию, что за рекой Халамак (川ハラマク). Αιλαμ — Аилам (евр. Хелам, アイラム; в csl «елам»). Σωβακ ἄρχων τῆς δυνάμεως — Совак, начальник силы (ソバク)."
  17: "συνήγαγεν τὸν πάντα Ισραηλ — собрал весь Израиль. διέβη τὸν Ιορδάνην — перешёл Иордан. παρετάξατο Συρία ἀπέναντι Δαυιδ — Сирия построилась против Давида."
  18: "ἀνεῖλεν — истребил, убил (ἀναιρέω). ἑπτακόσια ἅρματα — семьсот колесниц; τεσσαράκοντα χιλιάδας ἱππέων — сорок тысяч всадников. ἐπάταξεν — поразил."
  19: "ηὐτομόλησαν — перебежали (αὐτομολέω). ἐδούλευσαν αὐτοῖς — служили им (降る здесь — переход на сторону Израиля, а не капитуляция). ἐφοβήθη Συρία τοῦ σῶσαι — убоялась Сирия спасать."
