# jp-box, 2-я Царств, глава 10. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); второй свидетель — церковнославянский
# (csl-ru); ru (Синодальный) — только для понимания, не источник. jp-joc и jp-ni в книге нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 10: смерть царя аммонитян и воцарение Аннона (1), посольство Давида и оскорбление
# послов (2–5), наём сирийцев (6), поход Иоава (7), две линии боя (8–10), речь Иоава
# (11–12), поражение Сирии (13–14), новый сбор сирийцев и победа Давида (15–19).
# Речи — 「…」: Давид (2), аммонитские князья (3), царь (5), Иоав (11–12). Красного нет.
# Паритет: csl-чтения в основном тексте без 〔…〕. В пользу csl взят более полный список
# наёмников в 10:6 («Сува и Рехов», нет в LXX). Порча csl-ru («амалик» на месте Маахи,
# вставки в скобках) в текст не внесена — см. notes 10:6, 10:8.
# 〔…〕 нет. Сносок ⟨…⟩ нет: アンモン人, シリア人, 戦車, 騎兵, 王, 町 уже в корпусе.
# jp-ni не использовался.

