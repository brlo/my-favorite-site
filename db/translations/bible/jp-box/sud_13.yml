verses:
  1: "イスラエルの子[こ]らは再[ふたた]び主[しゅ]の目[め]に悪[わる]を行[おこな]い、主[しゅ]は彼[かれ]らをペリシテ人[じん]の手[て]に四十年[よんじゅうねん]の間[あいだ]渡[わた]された。"
  2: "ツォルアから、ダンの部族[ぶぞく]の者[もの]で、マノアという名[な]の人[ひと]があった。妻[つま]は不妊[ふにん]で、子[こ]を産[う]まなかった。"
  3: "主[しゅ]の使[つか]いが女[おんな]のところに現[あらわ]れて言[い]った。「見[み]よ、あなたは不妊[ふにん]で、子[こ]を産[う]んだことがない。しかし、あなたは身[み]ごもり、男[おとこ]の子[こ]を産[う]であろう。"
  4: "今[いま]、慎[つつし]んで、ぶどう酒[しゅ]も強[つよ]い酒[さけ]も飲[の]んではならない。汚[けが]れたものは何[なに]も食[た]べてはならない。"
  5: "見[み]よ、あなたは身[み]ごもり、男[おとこ]の子[こ]を産[う]む。その頭[あたま]には鉄[てつ]が上[のぼ]らない。その子[こ]は胎[たい]から神[かみ]のナジル人[じん]だからである。彼[かれ]はペリシテ人[じん]の手[て]からイスラエルを救[すく]い始[はじ]めるであろう。」"
  6: "女[おんな]は夫[おっと]のところへ来[き]て言[い]った。「神[かみ]の人[ひと]がわたしのところに来[き]ました。その姿[すがた]は神[かみ]の使[つか]いの姿[すがた]のように、非常[ひじょう]に畏[おそ]れ多[おお]いものでした。どこから来[き]たのかと尋[たず]ねましたが、名[な]は告[つ]げてくれませんでした。"
  7: "彼[かれ]はわたしに言[い]いました。『見[み]よ、あなたは身[み]ごもり、男[おとこ]の子[こ]を産[う]む。今[いま]からは、ぶどう酒[しゅ]も強[つよ]い酒[さけ]も飲[の]んではならない。汚[けが]れたものは何[なに]も食[た]べてはならない。その子[こ]は胎[たい]から死[し]の日[ひ]まで神[かみ]のナジル人[じん]だからである。』」"
  8: "マノアは主[しゅ]に願[ねが]って言[い]った。「主[しゅ]よ、どうか。あなたがわたしたちに遣[つか]わされた神[かみ]の人[ひと]を、もう一度[いちど]わたしたちのところへ来[こ]させ、生[う]まれる子[こ]のために何[なに]をすべきかを教[おし]えてください。」"
  9: "神[かみ]はマノアの声[こえ]を聞[き]き入[い]れられた。神[かみ]の使[つか]いは、女[おんな]が畑[はたけ]に座[すわ]っているところへ再[ふたた]び来[き]た。夫[おっと]のマノアは彼女[かのじょ]と一緒[いっしょ]にいなかった。"
  10: "女[おんな]は急[いそ]いで走[はし]って行[ゆ]き、夫[おっと]に告[つ]げて言[い]った。「見[み]てください。あの日[ひ]わたしのところに来[き]た男[おとこ]が、わたしに現[あらわ]れました。」"
  11: "マノアは立[た]って妻[つま]の後[あと]を追[お]い、その人[ひと]のところへ行[ゆ]って言[い]った。「あなたが女[おんな]に語[かた]ったあの人[ひと]ですか。」使[つか]いは言[い]った。「わたしです。」"
  12: "マノアは言[い]った。「では、あなたの言葉[ことば]が実現[じつげん]するとき、その子[こ]の裁[さば]きと、そのわざはどうなるのでしょうか。」"
  13: "主[しゅ]の使[つか]いはマノアに言[い]った。「わたしが女[おんな]に語[かた]ったすべてのことから、彼女[かのじょ]は身[み]を慎[つつし]まねばならない。"
  14: "ぶどうの木[き]から出[で]るものは何[なに]も食[た]べてはならない。ぶどう酒[しゅ]も強[つよ]い酒[さけ]も飲[の]んではならない。汚[けが]れたものは何[なに]も食[た]べてはならない。わたしが彼女[かのじょ]に命[めい]じたすべてのことを、彼女[かのじょ]は守[まも]らねばならない。」"
  15: "マノアは主[しゅ]の使[つか]いに言[い]った。「どうか、あなたをここに引[ひ]き止[と]めさせてください。あなたの前[まえ]に山羊[やぎ]の子[こ]を一頭[いっとう]用[よう]意[い]したいのです。」"
  16: "主[しゅ]の使[つか]いはマノアに言[い]った。「たとえあなたがわたしを引[ひ]き止[と]めても、わたしはあなたのパンを食[た]べない。もし燔祭[はんさい]を捧[ささ]げるなら、主[しゅ]に捧[ささ]げなさい。」マノアは、それが主[しゅ]の使[つか]いであることを知[し]らなかった。"
  17: "マノアは主[しゅ]の使[つか]いに言[い]った。「あなたの名[な]は何[なん]ですか。あなたの言葉[ことば]が実現[じつげん]したとき、わたしたちがあなたをほめたたえるために。」"
  18: "主[しゅ]の使[つか]いは彼[かれ]に言[い]った。「なぜわたしの名[な]を尋[たず]ねるのか。わたしの名[な]は不思議[ふしぎ]である。」"
  19: "マノアは山羊[やぎ]の子[こ]と献[ささ]げ物[もの]を取[と]り、不思議[ふしぎ]なことを行[おこな]われる主[しゅ]に、岩[いわ]の上[うえ]でそれを捧[ささ]げた。マノアと妻[つま]は見[み]ていた。"
  20: "炎[ほのお]が祭壇[さいだん]の上[うえ]から天[てん]へ上[のぼ]ると、主[しゅ]の使[つか]いは炎[ほのお]の中[なか]で上[のぼ]って行[い]った。マノアと妻[つま]はそれを見[み]、顔[かお]を地[ち]につけて伏[ふ]した。"
  21: "主[しゅ]の使[つか]いは、もはやマノアとその妻[つま]に現[あらわ]れなかった。そのときマノアは、それが主[しゅ]の使[つか]いであることを知[し]った。"
  22: "マノアは妻[つま]に言[い]った。「わたしたちはきっと死[し]ぬ。神[かみ]を見[み]たのだから。」"
  23: "妻[つま]は彼[かれ]に言[い]った。「もし主[しゅ]がわたしたちを殺[ころ]そうとお思[おも]いだったなら、わたしたちの手[て]から燔祭[はんさい]と献[ささ]げ物[もの]をお受[う]けにならなかったでしょう。また、これらすべてをわたしたちに示[しめ]されなかったでしょうし、今[いま]のように、これらのことをわたしたちに聞[き]かせられなかったでしょう。」"
  24: "女[おんな]は男[おとこ]の子[こ]を産[う]み、その名[な]をサムソンと名[な]づけた。主[しゅ]は彼[かれ]を祝福[しゅくふく]され、その子[こ]は育[そだ]って行[い]った。"
  25: "主[しゅ]の霊[れい]が、ツォルアとエシュタオルの間[あいだ]にあるダンの陣営[じんえい]で、彼[かれ]とともに歩[あゆ]み始[はじ]めた。"

notes:
  1: "προσέθεντο ... ποιῆσαι τὸ πονηρόν — «приложили ещё делать злое», т.е. продолжали (слав. «приложиша еще»). παρέδωκεν ... ἐν χειρὶ ἀλλοφύλων — «предал в руку филистимлян»; ἀλλόφυλοι в LXX — обычное имя филистимлян, поэтому ペリシテ人. τεσσαράκοντα ἔτη — сорок лет."
  2: "ἐκ Σαραα — «из Сареа» (Цора; в LXX Σαραα, отсюда ツォルア). ἐκ τῆς φυλῆς τοῦ Δαν — «из племени Данова» (部族). στεῖρα καὶ οὐκ ἔτικτεν — «бесплодна и не рожала» (στεῖρα — 不妊; imperfect ἔτικτεν — «не рожала постоянно»)."
  3: "ὤφθη ἄγγελος κυρίου πρὸς τὴν γυναῖκα — «явился ангел Господень к жене» (ὀφθῆναι — быть видимым). Ἰδοὺ δὴ σὺ στεῖρα καὶ οὐ τέτοκας — «вот, ты неплодна и не рожала». ἐν γαστρὶ ἕξεις καὶ τέξῃ υἱόν — «во чреве зачнёшь и родишь сына»: будущее, не повеление."
  4: "φύλαξαι — «берегись, храни себя» (φυλάσσω в среднем залоге). οἶνον καὶ σικερα — ぶどう酒と強い酒 (σίκερα — крепкий напиток, как в Лев 10:9 и Числ 6:3). πᾶν ἀκάθαρτον — «всякое нечистое» (слав. «всякаго нечистаго»)."
  5: "σίδηρος — «железо» (слав. «железо»), не «бритва»; то же правило в Числ 6:5 передано словом 剃刀[かみそり], здесь оставлено по греческому. ἡγιασμένον ναζιραῖον — «освящённый назорей» (ナジル人; сноски нет — пояснено в Деян 18:18). ἄρξεται σῴζειν — «начнёт спасать» (ἄρχομαι с инфинитивом)."
  6: "ὅρασις ... ἐπιφανὴς σφόδρα — «вид весьма славный, блистательный» (ἐπιφανής); слав. «страшен зело». ἠρώτων, πόθεν ἐστίν — imperfect 1-го л.: «я спрашивала, откуда он». Начало речи жены, продолжение в ст. 7."
  7: "Прямая речь человека Божия внутри рассказа жены — 『…』. ἀπὸ τῆς γαστρὸς ἕως ἡμέρας θανάτου αὐτοῦ — «от чрева до дня смерти его» (у LXX назорейство на всю жизнь; ср. 16:17). πᾶσαν ἀκαθαρσίαν — «всякую нечистоту» (здесь существительное, в ст. 4 — прилагательное)."
  8: "ἐδεήθη τοῦ κυρίου — «умолял Господа» (δέομαι). Ἐν ἐμοί, κύριε — букв. «во мне, Господи»: еврейский оборот мольбы (слав. «во мне, Господи»), передан как 「どうか」. φωτισάτω ἡμᾶς — «просветит нас», т.е. научит (слав. «наставит ны»)."
  9: "ἐπήκουσεν ὁ θεὸς τῆς φωνῆς Μανωε — «услышал Бог голос Маноя» (ἐπακούω с род.). αὐτῆς καθημένης — родительный самостоятельный: «когда она сидела»; αὐτῆς вместо αὐτοῦ — особенность текста базы."
  10: "ἐτάχυνεν ... ἐξέδραμεν — «поспешила и выбежала» (ταχύνω, ἐκτρέχω). ὦπταί μοι — perfect от ὀράω: «явился мне»."
  11: "ὀπίσω τῆς γυναικὸς αὐτοῦ — «за женой своей». Εἰ σὺ εἶ ὁ ἀνήρ — «ты ли тот муж». Ἐγώ — «Я» (без глагола; так же слав. «аз»)."
  12: "Νῦν δὴ ἐλθόντος τοῦ ῥήματός σου — «итак, когда придёт (исполнится) слово твоё». κρίμα τοῦ παιδαρίου — «устав, суд о ребёнке» (κρίμα здесь — образ жизни, правило; слав. «кий будет суд отрочате»); Синодальный сглаживает: «как нам поступать»."
  13: "Ἀπὸ πάντων, ὧν εἶπα πρὸς τὴν γυναῖκα, φυλαξάσθω — «от всего, что я сказал жене, да хранит она»: подлежащее — жена, а не ребёнок (у Синодального «пусть он остерегается» — масоретское чтение)."
  14: "ἀπὸ πάντων, ὅσα ἐκπορεύεται ἐξ ἀμπέλου — «от всего, что исходит из винограда» (ср. Числ 6:4). πάντα, ὅσα ἐνετειλάμην αὐτῇ, φυλαξάσθω — «всё, что я заповедал ей, да хранит». Конец речи ангела."
  15: "Βιασώμεθα δή σε — «удержим же тебя» (βιάζομαι — принуждать, удерживать силой; 1-е л. мн. ч., приглашение). ἔριφον αἰγῶν — «козлёнка из коз» (слав. «козлище от коз»)."
  16: "Ἐὰν βιάσῃ με, οὐ φάγομαι τῶν ἄρτων σου — «если принудишь меня, не стану есть хлебов твоих». ὁλοκαύτωμα — 燔祭. ἀνοίσεις — «вознеси» (ἀναφέρω, язык жертвы). ὅτι οὐκ ἔγνω — «ибо не знал»."
  17: "Τί ὄνομά σοι — «каково имя твоё». ἵνα ... δοξάσωμέν σε — «чтобы нам прославить тебя» (ἵνα с сослагательным — цель)."
  18: "Ἵνα τί τοῦτο ἐρωτᾷς τὸ ὄνομά μου — «что ты спрашиваешь об имени моём» (ἵνα τί — «почему»). αὐτὸ ... ἐστιν θαυμαστόν — «оно чудно» (θαυμαστός — «дивный»); 不思議[ふしぎ] по брифу. Слав. «и то есть чудно»."
  19: "τὴν θυσίαν — «жертву» (не всесожжение; слав. «жертву»). τῷ θαυμαστὰ ποιοῦντι κυρίῳ — дательный приложения: «Господу, творящему чудеса», по-японски — определение перед глаголом. ἐθεώρουν — imperfect: «смотрели»."
  20: "φλόγα ἐπάνωθεν τοῦ θυσιαστηρίου — «пламя с жертвенника» (θυσιαστήριον — 祭壇). ἀνέβη ... ἐν τῇ φλογί — «взошёл в пламени»; слав. добавляет «олтаря», в греч. этого слова нет. ἔπεσον ἐπὶ πρόσωπον — «пали лицом на землю»."
  21: "οὐ προσέθηκεν ἔτι ... ὀφθῆναι — «не приложил более являться», т.е. больше не являлся (προστίθημι с инфинитивом). τότε ἔγνω — «тогда узнал»."
  22: "Θανάτῳ ἀποθανούμεθα — «смертью умрём» (усиление: dativus с будущим; слав. «смертию умрем»). θεὸν ἑωράκαμεν — «Бога видели» (perfect; видеть Бога — смерть, ср. Исх 33:20)."
  23: "Εἰ ἐβούλετο ... θανατῶσαι — «если бы хотел умертвить» (нереальное условие без ἄν в протасисе). οὐκ ἂν ἐδέξατο — «не принял бы». ἐφώτισεν — «просветил», т.е. показал. ἀκουστὰ ἐποίησεν — «сделал слышимым», т.е. возвестил."
  24: "ἐκάλεσεν τὸ ὄνομα αὐτοῦ Σαμψων — «нарекла имя ему Самсон» (Σαμψων; калька 伝統表記 даёт サムプソン). ηὐξήθη τὸ παιδάριον — «вырос ребёнок» (αὐξάνω); слав. «возмужа отроча»."
  25: "συμπορεύεσθαι αὐτῷ — «ходить вместе с ним» (συμπορεύομαι), т.е. действовать с ним; слав. «ходити с ним». ἐν παρεμβολῇ Δαν — «в стане Дановом» (παρεμβολή — лагерь, 陣営; слав. «в полце данове»). ἀνὰ μέσον Σαραα καὶ ... Εσθαολ — «между Цорой и Ештаолом» (ツォルア, エシュタオル)."
