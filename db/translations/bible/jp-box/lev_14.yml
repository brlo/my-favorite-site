# проказа в доме: осмотр, заключение, выломка камней, обмазка, обряд (33–53);
# итоговая формула закона (54–57).
# Речь Бога — 「…」 (2–32, 34–53), красного нет. Слова домохозяина внутри речи Бога — 『…』.
