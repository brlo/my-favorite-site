verses:
  1: "主[しゅ]はモーセに言[い]われた。"
  2: "「重[おも]い皮膚病[ひふびょう]の人[ひと]についての律法[りっぽう]はこうである。その人[ひと]が清[きよ]められる日[ひ]には、その人[ひと]を祭司[さいし]のところへ連[つ]れて来[こ]なさい。"
  3: "祭司[さいし]は宿営[しゅくえい]の外[そと]に出[で]なさい。祭司[さいし]が見[み]て、重[おも]い皮膚病[ひふびょう]の患部[かんぶ]がその人[ひと]から癒[いや]えていれば、"
  4: "祭司[さいし]は命[めい]じなさい。清[きよ]められる人[ひと]のために、生[い]きた清[きよ]い小鳥[ことり]二羽[にはわ]、杉[すぎ]の木[き]、緋色[ひいろ]の撚[よ]り糸[いと]、ヒソプを取[と]りなさい。"
  5: "祭司[さいし]は命[めい]じなさい。一羽[いちわ]の小鳥[ことり]を、生[い]き水[みず]を入[い]れた素焼[すや]きの器[うつわ]の上[うえ]で屠[ほふ]らせなさい。"
  6: "祭司[さいし]は、その生[い]きた小鳥[ことり]、杉[すぎ]の木[き]、緋色[ひいろ]の撚[よ]り糸[いと]、ヒソプを取[と]り、屠[ほふ]った小鳥[ことり]の血[ち]と生[い]き水[みず]の中[なか]に、それらと生きた小鳥を浸[ひた]しなさい。"
  7: "祭司[さいし]は、重[おも]い皮膚病[ひふびょう]から清[きよ]められる人[ひと]に七回[ななかい]振[ふ]りかけなさい。その人[ひと]は清[きよ]くなる。そして、生[い]きた小鳥[ことり]を野[の]に放[はな]ちなさい。"
  8: "清[きよ]められた人[ひと]は衣[ころも]を洗[あら]い、その毛[け]をすべて剃[そ]り、水[みず]で体[からだ]を洗[あら]いなさい。そうすれば清[きよ]くなる。その後[あと]、その人[ひと]は宿営[しゅくえい]に入[はい]り、七日間[なぬかかん]は自分[じぶん]の家[いえ]の外[そと]にとどまりなさい。"
  9: "七日目[なぬかめ]になると、その人[ひと]は毛[け]をすべて剃[そ]らねばならない。頭[あたま]の毛[け]、ひげ、眉[まゆ]をはじめ、すべての毛[け]を剃[そ]り、衣[ころも]を洗[あら]い、水[みず]で体[からだ]を洗[あら]いなさい。そうすれば清[きよ]くなる。"
  10: "八日目[ようかめ]にその人[ひと]は、傷[きず]のない一歳[いっさい]の小羊[こひつじ]二匹[にひき]と、傷[きず]のない一歳[いっさい]の羊[ひつじ]一匹[いっぴき]、油[あぶら]で練[ね]った素祭[そさい]のための小麦粉[こむぎこ]十分[じゅうぶん]の三[さん]、および油[あぶら]一[ひと]コトゥレーを取[と]りなさい。"
  11: "清[きよ]める祭司[さいし]は、清[きよ]められる人[ひと]とこれらのものを、証[あかし]の幕屋[まくや]の入口[いりぐち]で、主[しゅ]の前[まえ]に立[た]たせなさい。"
  12: "祭司[さいし]は一匹[いっぴき]の小羊[こひつじ]を取[と]り、それを愆祭[けんさい]として献[ささ]げ、また油[あぶら]のコトゥレーを取[と]り、それを主[しゅ]の前[まえ]に差[さ]し出[だ]す捧[ささ]げ物[もの]として取[と]り分[わ]けなさい。"
  13: "その小羊[こひつじ]を、燔祭[はんさい]や贖罪祭[しょくざいさい]を屠[ほふ]る場所[ばしょ]、すなわち聖[せい]なる場所[ばしょ]で屠[ほふ]りなさい。贖罪祭[しょくざいさい]は愆祭[けんさい]と同[おな]じく祭司[さいし]のものであり、最[もっと]も聖[せい]なるものだからである。"
  14: "祭司[さいし]は愆祭[けんさい]の血[ち]を取[と]り、清[きよ]められる人[ひと]の右[みぎ]の耳[みみ]たぶ、右[みぎ]の手[て]の親指[おやゆび]、右[みぎ]の足[あし]の親指[おやゆび]に塗[ぬ]りなさい。"
  15: "祭司[さいし]はその油[あぶら]のコトゥレーから取[と]り、自分[じぶん]の左[ひだり]の手[て]のひらに注[そそ]ぎなさい。"
  16: "そして、左[ひだり]の手[て]のひらにある油[あぶら]に右[みぎ]の指[ゆび]を浸[ひた]し、その指[ゆび]で主[しゅ]の前[まえ]に七回[ななかい]振[ふ]りかけなさい。"
  17: "祭司[さいし]は手[て]のひらに残[のこ]った油[あぶら]を、清[きよ]められる人[ひと]の右[みぎ]の耳[みみ]たぶ、右[みぎ]の手[て]の親指[おやゆび]、右[みぎ]の足[あし]の親指[おやゆび]の、愆祭[けんさい]の血[ち]を塗[ぬ]ったところに塗[ぬ]りなさい。"
  18: "祭司[さいし]の手[て]のひらに残[のこ]った油[あぶら]は、清[きよ]められた人[ひと]の頭[あたま]に塗[ぬ]りなさい。祭司[さいし]は主[しゅ]の前[まえ]でその人[ひと]のために贖[あがな]いをしなさい。"
  19: "祭司[さいし]は贖罪祭[しょくざいさい]をささげなさい。祭司[さいし]は、その罪[つみ]から清[きよ]められる汚[けが]れた者[もの]のために贖[あがな]いをしなさい。その後[あと]で、祭司[さいし]は燔祭[はんさい]を屠[ほふ]りなさい。"
  20: "祭司[さいし]は燔祭[はんさい]と素祭[そさい]を、主[しゅ]の前[まえ]で祭壇[さいだん]の上[うえ]に捧[ささ]げなさい。祭司[さいし]はその人[ひと]のために贖[あがな]いをし、その人[ひと]は清[きよ]くなる。"
  21: "しかし、その人[ひと]が貧[まず]しく、手[て]が届[とど]かないなら、自分[じぶん]が犯[おか]した罪[つみ]のための愆祭[けんさい]、すなわち差[さ]し出[だ]しの捧[ささ]げ物[もの]として、小羊[こひつじ]一匹[いっぴき]を取り、油[あぶら]で練[ね]った素祭[そさい]のための小麦粉[こむぎこ]十分[じゅうぶん]の一[いち]、および油[あぶら]一[ひと]コトゥレーを取[と]りなさい。"
  22: "また、手[て]の届[とど]くかぎりの山鳩[やまばと]二羽[にはわ]、あるいは家鳩[いえばと]のひな二羽[にはわ]を取[と]りなさい。一羽[いちわ]は贖罪祭[しょくざいさい]、もう一羽[いちわ]は燔祭[はんさい]とする。"
  23: "八日目[ようかめ]にその人[ひと]は、自分[じぶん]が清[きよ]められるために、それらを祭司[さいし]のところへ、証[あかし]の幕屋[まくや]の入口[いりぐち]で主[しゅ]の前[まえ]に持[も]って来[こ]なさい。"
  24: "祭司[さいし]はその愆祭[けんさい]の小羊[こひつじ]と油[あぶら]のコトゥレーを取[と]り、主[しゅ]の前[まえ]に差[さ]し出[だ]しの捧[ささ]げ物[もの]として献[ささ]げなさい。"
  25: "祭司[さいし]は愆祭[けんさい]の小羊[こひつじ]を屠[ほふ]り、その愆祭[けんさい]の血[ち]を取[と]って、清[きよ]められる人[ひと]の右[みぎ]の耳[みみ]たぶ、右[みぎ]の手[て]の親指[おやゆび]、右[みぎ]の足[あし]の親指[おやゆび]に塗[ぬ]りなさい。"
  26: "祭司[さいし]はその油[あぶら]を自分[じぶん]の左[ひだり]の手[て]のひらに注[そそ]ぎなさい。"
  27: "祭司[さいし]は左[ひだり]の手[て]のひらにある油[あぶら]を右[みぎ]の指[ゆび]に取[と]り、その指[ゆび]で主[しゅ]の前[まえ]に七回[ななかい]振[ふ]りかけなさい。"
  28: "祭司[さいし]は自分[じぶん]の手[て]のひらにある油[あぶら]を、清[きよ]められる人[ひと]の右[みぎ]の耳[みみ]たぶ、右[みぎ]の手[て]の親指[おやゆび]、右[みぎ]の足[あし]の親指[おやゆび]の、愆祭[けんさい]の血[ち]を塗[ぬ]ったところに塗[ぬ]りなさい。"
  29: "祭司[さいし]の手[て]のひらに残[のこ]った油[あぶら]は、清[きよ]められた人[ひと]の頭[あたま]に塗[ぬ]りなさい。祭司[さいし]は主[しゅ]の前[まえ]でその人[ひと]のために贖[あがな]いをしなさい。"
  30: "手[て]の届[とど]くかぎり、山鳩[やまばと]の一羽[いちわ]、あるいは家鳩[いえばと]のひな一羽[いちわ]を用意[ようい]しなさい。"
  31: "一羽[いちわ]を贖罪祭[しょくざいさい]、もう一羽[いちわ]を燔祭[はんさい]として、素祭[そさい]とともにささげなさい。祭司[さいし]は主[しゅ]の前[まえ]で、清[きよ]められる人[ひと]のために贖[あがな]いをしなさい。"
  32: "これが、重[おも]い皮膚病[ひふびょう]の患部[かんぶ]があり、清[きよ]めるために手[て]の届[とど]かない者[もの]についての律法[りっぽう]である。」"
  33: "主[しゅ]はモーセとアロンに言[い]われた。"
  34: "「あなたがたが、わたしがあなたがたに所有[しょゆう]として与[あた]えるカナン人[じん]の地[ち]に入[はい]るとき、わたしはあなたがたが所有する地[ち]の家々[いえいえ]に、重[おも]い皮膚病[ひふびょう]の患部[かんぶ]を生[しょう]じさせる。"
  35: "その家[いえ]の主[ぬし]は来[き]て、祭司[さいし]に告[つ]げなさい。『家[いえ]の中[なか]に、重[おも]い皮膚病[ひふびょう]のようなものが見[み]える』と。"
  36: "祭司[さいし]は、自分[じぶん]が入[はい]って患部[かんぶ]を見[み]る前[まえ]に、家[いえ]の中[なか]のものをすべて外[そと]へ運[はこ]び出[だ]させなさい。家の中にあるものが汚[けが]れないようにするためである。その後[あと]で、祭司[さいし]は家[いえ]を調[しら]べるために入[はい]りなさい。"
  37: "祭司[さいし]が家[いえ]の壁[かべ]の患部[かんぶ]を見[み]ると、それが緑[みどり]がかった、あるいは赤[あか]みがかったくぼみで、その見[み]た目[め]が壁[かべ]よりくぼんでいれば、"
  38: "祭司[さいし]はその家[いえ]から出[で]て入口[いりぐち]に立[た]ち、その家[いえ]を七日間[なぬかかん]隔離[かくり]しなさい。"
  39: "七日目[なぬかめ]に祭司[さいし]は戻[もど]って来[き]て、その家[いえ]を見[み]なさい。見[み]ると、患部[かんぶ]は家[いえ]の壁[かべ]に広[ひろ]がっていない。"
  40: "祭司[さいし]は命[めい]じなさい。患部[かんぶ]のある石[いし]を抜[ぬ]き取[と]らせ、町[まち]の外[そと]の汚[けが]れた場所[ばしょ]に捨[す]てさせなさい。"
  41: "また、家[いえ]の内側[うちがわ]を周[まわ]りに沿[そ]って削[けず]り落[お]とさせ、削[けず]り取[と]った壁土[かべつち]を町[まち]の外[そと]の汚[けが]れた場所[ばしょ]に捨[す]てさせなさい。"
  42: "そして、別[べつ]の削[けず]り整[ととの]えた石[いし]を取[と]って、その石[いし]の代[か]わりに据[す]え、別[べつ]の壁土[かべつち]を取[と]って家[いえ]を塗[ぬ]り直[なお]させなさい。"
  43: "しかし、石[いし]を抜[ぬ]き取り、家[いえ]を削[けず]り、塗[ぬ]り直[なお]した後[あと]で、患部[かんぶ]が再[ふたた]び家[いえ]に生[しょう]じ、芽生[めば]えたなら、"
  44: "祭司[さいし]が入[はい]って見[み]なさい。患部[かんぶ]が家[いえ]の中[なか]に広[ひろ]がっていれば、それは家[いえ]にしつこく残[のこ]る重[おも]い皮膚病[ひふびょう]であり、その家[いえ]は汚[けが]れている。"
  45: "その家[いえ]を取[と]り壊[こわ]させなさい。その木材[もくざい]、石[いし]、壁土[かべつち]のすべてを町[まち]の外[そと]の汚[けが]れた場所[ばしょ]に運[はこ]び出[だ]させなさい。"
  46: "その家[いえ]が隔離[かくり]されている間[あいだ]、その家[いえ]に入[はい]る者[もの]はすべて、夕方[ゆうがた]まで汚[けが]れている。"
  47: "その家[いえ]で眠[ねむ]る者[もの]は衣[ころも]を洗[あら]わなければならず、夕方[ゆうがた]まで汚[けが]れている。その家[いえ]で食[た]べる者[もの]も衣[ころも]を洗[あら]わなければならず、夕方[ゆうがた]まで汚[けが]れている。"
  48: "しかし、祭司[さいし]が来[き]て入[はい]り、見[み]て、家[いえ]を塗[ぬ]り直[なお]した後[あと]に患部[かんぶ]が家[いえ]の中[なか]で少[すこ]しも広[ひろ]がっていなければ、祭司[さいし]はその家[いえ]を清[きよ]いものと宣言[せんげん]しなさい。患部[かんぶ]が癒[いや]されたからである。"
  49: "家[いえ]を清[きよ]めるために、生[い]きた清[きよ]い小鳥[ことり]二羽[にはわ]、杉[すぎ]の木[き]、緋色[ひいろ]の撚[よ]り糸[いと]、ヒソプを取[と]りなさい。"
  50: "一羽[いちわ]の小鳥[ことり]を、生[い]き水[みず]を入[い]れた素焼[すや]きの器[うつわ]の上[うえ]で屠[ほふ]りなさい。"
  51: "杉[すぎ]の木[き]、緋色[ひいろ]の撚[よ]り糸[いと]、ヒソプ、生[い]きた小鳥[ことり]を取[と]り、屠[ほふ]った小鳥[ことり]の血[ち]と生[い]き水[みず]の中[なか]に浸[ひた]し、それらで家[いえ]に七回[ななかい]振[ふ]りかけなさい。"
  52: "小鳥[ことり]の血[ち]、生[い]き水[みず]、生[い]きた小鳥[ことり]、杉[すぎ]の木[き]、ヒソプ、緋色[ひいろ]の撚[よ]り糸[いと]によって、その家[いえ]を清[きよ]めなさい。"
  53: "そして、生[い]きた小鳥[ことり]を町[まち]の外[そと]の野[の]に放[はな]ちなさい。こうして家[いえ]のために贖[あがな]いをしなさい。家[いえ]は清[きよ]くなる。」"
  54: "これが、重[おも]い皮膚病[ひふびょう]のあらゆる患部[かんぶ]と、かさぶた状[じょう]の患部[かんぶ]についての律法[りっぽう]である。"
  55: "また、衣[ころも]や家[いえ]の重[おも]い皮膚病[ひふびょう]、"
  56: "傷跡[きずあと]、しるし、輝[かがや]くものについての律法[りっぽう]であり、"
  57: "いつそれが汚[けが]れているか、いつ清[きよ]められるかを示[しめ]すためのものである。これが重[おも]い皮膚病[ひふびょう]についての律法[りっぽう]である。"

notes:
  1: "ἐλάλησεν κύριος πρὸς Μωυσῆν λέγων — 主はモーセに言われた. Как 13:1, но без Аарона (ср. 14:33)."
  2: "οὗτος ὁ νόμος τοῦ λεπροῦ — «вот закон о прокажённом» (τοῦ λεπροῦ — род. принадлежности). ᾗ ἂν ἡμέρᾳ καθαρισθῇ — «в какой бы день он ни очистился». προσαχθήσεται — «будет приведён» (pass.)."
  3: "ἐξελεύσεται ἔξω τῆς παρεμβολῆς — «выйдет вне стана». ἰᾶται — «исцеляется» (praes. в значении perfect). ἀπὸ τοῦ λεπροῦ — «от прокажённого»."
  4: "λήμψονται — «возьмут» (мн. ч.; безличное «пусть возьмут»). ὀρνίθια — «птички» (уменьш. от ὄρνις). ξύλον κέδρινον — «кедровое дерево». κεκλωσμένον κόκκινον — «скрученная красная [нить]» (κλώθω «прясть»). ὕσσωπος — «иссоп»."
  5: "σφάξουσιν — «заколют». εἰς ἀγγεῖον ὀστράκινον — «в глиняный сосуд» (ὀστράκινος «глиняный»). ἐφ᾽ ὕδατι ζῶντι — «над живой водой», т.е. над сосудом с проточной водой."
  6: "κλωστὸν κόκκινον — «пряденое красное» (κλωστός, ср. κεκλωσμένον ст. 4). βάψει — «погрузит, омочит» (βάπτω). εἰς τὸ αἷμα… ἐφ᾽ ὕδατι ζῶντι — «в кровь заколотой птицы с живой водой»."
  7: "περιρρανεῖ — «покропит вокруг» (περιρραίνω). ἑπτάκις — «семь раз». ἐξαποστελεῖ — «отпустит» (ἐξαποστέλλω). εἰς τὸ πεδίον — «в поле»."
  8: "πλυνεῖ τὰ ἱμάτια — «омоет одежды». ξυρηθήσεται πᾶσαν τὴν τρίχα — «обреет все волосы». λούσεται — «омоется» (λούω). διατρίψει ἔξω τοῦ οἴκου — «пробудет вне дома»; по LXX «дом», в евр. «шатёр»."
  9: "ξυρηθήσεται πᾶσαν τὴν τρίχα — снова «обреет все волосы»: голову, бороду, брови (ὀφρύες). πλυνεῖ τὰ ἱμάτια — «омоет одежды». λούσεται τὸ σῶμα — «омоет тело»."
  10: "δύο ἀμνοὺς ἐνιαυσίους ἀμώμους — «двух однолетних агнцев без порока». πρόβατον ἐνιαύσιον — «овцу однолетнюю». τρία δέκατα σεμιδάλεως — «три десятых [ефы] муки». κοτύλη ἐλαίου — «котила масла» (мера около 0,3 л)."
  11: "στήσει — «поставит». ὁ καθαρίζων — «очищающий [священник]». ἔναντι κυρίου — «пред Господом». ἐπὶ τὴν θύραν τῆς σκηνῆς τοῦ μαρτυρίου — «у входа скинии свидетельства»."
  12: "τῆς πλημμελείας — «жертва повинности» (πλημμέλεια). ἀφοριεῖ αὐτὸ ἀφόρισμα — «отделит его в отделяемое» (ἀφόρισμα, евр. תְּנוּפָה, «возношение»; слав. «отлучит во отлучение»)."
  13: "ἐν τόπῳ οὗ σφάζουσιν τὰ ὁλοκαυτώματα καὶ τὰ περὶ ἁμαρτίας — «на месте, где закалают всесожжения и жертвы за грех». ἔστιν τῷ ἱερεῖ — «принадлежит священнику». ἅγια ἁγίων — «святое святых»."
  14: "λοβὸς τοῦ ὠτός — «мочка уха». ἄκρον τῆς χειρός — «край руки», т.е. большой палец (слав. «край руки»). ἄκρον τοῦ ποδός — «край ноги», большой палец ноги."
  15: "κοτύλη τοῦ ἐλαίου — «котила масла». ἐπιχεεῖ — «возольёт» (ἐπιχέω). χεῖρα τὴν ἀριστερὰν — «левую руку, ладонь»."
  16: "βάψει τὸν δάκτυλον τὸν δεξιόν — «омочит правый перст». ῥανεῖ ἑπτάκις — «покропит семь раз» (ῥαίνω)."
  17: "τὸ καταλειφθέν — «оставшееся» (καταλείπω). ἐπὶ τὸν τόπον τοῦ αἵματος — «на место крови», т.е. поверх уже помазанного кровью."
  18: "ἐξιλάσεται περὶ αὐτοῦ — «совершит умилостивление за него» (ἐξιλάσκομαι). ἐπὶ τὴν κεφαλήν — «на голову»."
  19: "ποιήσει τὸ περὶ τῆς ἁμαρτίας — «совершит жертву за грех». ἐξιλάσεται περὶ τοῦ ἀκαθάρτου τοῦ καθαριζομένου ἀπὸ τῆς ἁμαρτίας αὐτοῦ — «умилостивит о нечистом, очищаемом от греха его»."
  20: "ἀνοίσει — «вознесёт» (ἀναφέρω). τὴν θυσίαν — «хлебное приношение» (θυσία). καθαρισθήσεται — «будет чист»."
  21: "πένηται — «беден» (πένομαι). ἡ χεὶρ αὐτοῦ μὴ εὑρίσκῃ — «рука его не достанет», т.е. нет средств. εἰς ὃ ἐπλημμέλησεν εἰς ἀφαίρεμα — «в то, в чём согрешил, в отделяемое» (ἀφαίρεμα — редкое слово LXX, ср. ἀφόρισμα ст. 12)."
  22: "τρυγόνες — «горлицы», νεοσσοὶ περιστερῶν — «птенцы голубей». ὅσα εὗρεν ἡ χεὶρ αὐτοῦ — «сколько достала рука его»."
  23: "προσοίσει — «принесёт». εἰς τὸ καθαρίσαι αὐτόν — «чтобы очистить его». ἐπὶ τὴν θύραν… — «ко входу скинии»."
  24: "ἐπιθήσει αὐτὰ ἐπίθεμα — «возложит их возложением» (ἐπίθεμα, евр. תְּנוּפָה; ср. ἀφόρισμα ст. 12)."
  25: "σφάξει τὸν ἀμνὸν τῆς πλημμελείας — «заколет агнца повинности». ἐπιθήσει ἐπὶ τὸν λοβὸν… — как ст. 14."
  26: "ἐπιχεεῖ… ἐπὶ τὴν χεῖρα τὴν ἀριστερὰν — как ст. 15."
  27: "ῥανεῖ τῷ δακτύλῳ τῷ δεξιῷ — «покропит правым перстом». ἑπτάκις ἔναντι κυρίου — «семь раз пред Господом»."
  28: "ἐπιθήσει ἀπὸ τοῦ ἐλαίου… ἐπὶ τὸν τόπον τοῦ αἵματος — «возложит масло на место крови» (ср. ст. 17)."
  29: "τὸ καταλειφθὲν ἀπὸ τοῦ ἐλαίου — «оставшееся от масла». ἐξιλάσεται — «умилостивит»."
  30: "ποιήσει μίαν τῶν τρυγόνων — «сделает, принесёт одну из горлиц». καθότι εὗρεν αὐτοῦ ἡ χείρ — «как достала рука его»."
  31: "τὴν μίαν περὶ ἁμαρτίας καὶ τὴν μίαν εἰς ὁλοκαύτωμα σὺν τῇ θυσίᾳ — «одну в жертву за грех, другую во всесожжение с хлебным приношением»."
  32: "τοῦ μὴ εὑρίσκοντος τῇ χειρί — «того, у кого рука не достаёт» (род. при νόμος). εἰς τὸν καθαρισμὸν αὐτοῦ — «для очищения его»."
  33: "ἐλάλησεν κύριος πρὸς Μωυσῆν καὶ Ααρων — ср. 13:1; здесь снова оба."
  34: "ὡς ἂν εἰσέλθητε — «когда войдёте». ἐν κτήσει — «во владение» (κτῆσις). ἔγκτητος — «приобретённый, ваш» (слав. «притяжанный»). δώσω ἁφὴν λέπρας — «пошлю язву проказы» (букв. «дам»)."
  35: "ἥξει τίνος αὐτοῦ ἡ οἰκία — «придёт тот, чей дом» (букв. «чей-нибудь дом его»). ὥσπερ ἁφὴ ἑώραταί μου — «как бы язва показалась мне»."
  36: "ἀποσκευάσαι τὴν οἰκίαν — «вынести [вещи] из дома» (ἀποσκευάζω). πρὸ τοῦ εἰσελθόντα ἰδεῖν — «прежде чем войдёт и увидит». οὐ μὴ ἀκάθαρτα γένηται — «чтобы не стало нечистым». καταμαθεῖν — «рассмотреть» (καταμανθάνω)."
  37: "κοιλάδας χλωριζούσας ἢ πυρριζούσας — «впадины зеленоватые или красноватые» (κοιλάς «впадина»). ταπεινοτέρα τῶν τοίχων — «ниже стен»."
  38: "ἐπὶ τὴν θύραν τῆς οἰκίας — «к дверям дома». ἀφοριεῖ τὴν οἰκίαν — «заключит дом» (не человека)."
  39: "ἐπανήξει — «вернётся» (ἐπανήκω). οὐ διεχύθη — «не распространилась»; в слав. «разсыпася» (без «не»), в Синодальном «распространилась» — расхождение с LXX, где есть οὐ."
  40: "ἐξελοῦσιν τοὺς λίθους — «вынут камни» (ἐξαιρέω). εἰς τόπον ἀκάθαρτον — «на место нечистое»."
  41: "ἀποξύσουσιν — «соскоблят» (ἀποξύω). κύκλῳ — «вокруг». χοῦν — «пыль, обмазку» (χοῦς). ἐκχεοῦσιν — «высыплют» (ἐκχέω)."
  42: "λίθους ἀπεξυσμένους — «отёсанные камни» (ἀποξύω, ср. ст. 41). ἀντιθήσουσιν ἀντί — «поставят вместо». ἐξαλείψουσιν — «обмажут» (ἐξαλείφω)."
  43: "ἐπέλθῃ πάλιν ἁφή — «придёт снова язва». ἀνατείλῃ — «взойдёт, появится» (ἀνατέλλω). μετὰ τὸ ἐξελεῖν… ἀποξυσθῆναι… ἐξαλειφθῆναι — «после того как вынули, соскоблили, обмазали»."
  44: "εἰ διακέχυται — «если распространилась» (perfect). λέπρα ἔμμονος — «упорная проказа» (ср. 13:51). ἀκάθαρτός ἐστιν — «он, дом, нечист»."
  45: "καθελοῦσιν τὴν οἰκίαν — «разрушат дом» (καθαιρέω). ξύλα, λίθους, χοῦν — дерево, камни, обмазку."
  46: "ἀφωρισμένη ἐστίν — «заключён [дом]» (ἀφορίζω, ср. 13:4). ἕως ἑσπέρας — «до вечера»."
  47: "ὁ κοιμώμενος — «спящий» (κοιμάομαι). ὁ ἔσθων — «едящий». Оба омывают одежды и нечисты до вечера."
  48: "παραγενόμενος — «придя» (παραγίνομαι). διαχύσει οὐ διαχεῖται — усиление: «совсем не распространяется». ἰάθη ἡ ἁφή — «язва исцелела»."
  49: "ἀφαγνίσαι — «очистить [обрядом]» (ἁφαγνίζω, ср. ἁγνίζω). ὀρνίθια… ξύλον κέδρινον… κόκκινον… ὕσσωπον — как 14:4."
  50: "σκεῦος ὀστράκινον — «глиняный сосуд» (ср. ἀγγεῖον ст. 5). ἐφ᾽ ὕδατι ζῶντι — «над живой водой»."
  51: "τὸ κεκλωσμένον κόκκινον — «скрученная красная [нить]». περιρρανεῖ ἐν αὐτοῖς ἐπὶ τὴν οἰκίαν — «покропит ими дом»."
  52: "ἀφαγνιεῖ — «очистит» (ἁφαγνίζω). Перечисление: кровь, живая вода, живая птица, кедр, иссоп, красная нить."
  53: "ἐξαποστελεῖ — «отпустит» (ср. ст. 7). ἐξιλάσεται περὶ τῆς οἰκίας — «умилостивит о доме». καθαρὰ ἔσται — «будет чист»."
  54: "κατὰ πᾶσαν ἁφὴν λέπρας καὶ θραύσματος — «о всякой язве проказы и парши» (θραῦσμα, см. 13:30)."
  55: "λέπρας ἱματίου καὶ οἰκίας — «проказы одежды и дома» (род. объектный)."
  56: "οὐλῆς — «рубца» (см. 13:2), σημασίας — «знака» (13:6), τοῦ αὐγάζοντος — «сияющего» (13:38; прич. субстантивир.). Синодальный переводит по евр.: «опухоль, лишаи, пятна»."
  57: "ἐξηγήσασθαι — «объяснить, показать» (ἐξηγέομαι). ᾗ ἡμέρᾳ — «в какой день». οὗτος ὁ νόμος τῆς λέπρας — «вот закон проказы»."
