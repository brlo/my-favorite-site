verses:
  1: "「ところが、息子[むすこ]が自分[じぶん]の婚礼[こんれい]の間[ま]に入[はい]ると、倒[たお]れて死[し]んだ。"
  2: "わたしたちは灯[あか]りという灯[あか]りを覆[くつがえ]した。町[まち]の人[ひと]々[びと]はみな、わたしを慰[なぐさ]めようとして立[た]ち、わたしは翌日[よくじつ]の夜[よる]まで眠[ねむ]った。"
  3: "人[ひと]々[びと]がみな、わたしを慰[なぐさ]めて休[やす]ませようと眠[ねむ]っているうちに、わたしは夜[よる]に起[お]き出[だ]し、逃[に]げて、ご覧[らん]のとおりこの野[の]に来[き]た。"
  4: "そしてもう町[まち]には戻[もど]らず、ここにとどまり、食[た]べもせず飲[の]みもせず、死[し]ぬまで絶[た]えず泣[な]き、断食[だんじき]しようと思[おも]っている。」"
  5: "わたしはこれらの言葉[ことば]をやめ、怒[いか]りをもって彼女[かのじょ]に答[こた]えて言[い]った。"
  6: "「女[おんな]たちのうちで最[もっと]も愚[おろ]かな者[もの]よ。あなたはわたしたちの泣[な]きと、わたしたちに起[お]こったことを見[み]ないのか。"
  7: "シオンはわたしたちの母[はは]であり、あらゆる悲[かな]しみのうちに悲[かな]しみ、深[ふか]く辱[はずか]しめられて、ひどく泣[な]いている。"
  8: "そして今[いま]、わたしたちはみな嘆[なげ]き、悲[かな]しんでいる。すべてが悲[かな]しみに包[つつ]まれているのに、あなたは一人[ひとり]の息子[むすこ]のことで悲[かな]しむのか。"
  9: "地[ち]に尋[たず]ねなさい。地[ち]はあなたに、『わたしこそ、わたしの上[うえ]に生[う]まれる多[おお]くの者[もの]の転落[てんらく]を泣[な]くべき者[もの]である』と言[い]うであろう。"
  10: "地[ち]からは初[はじ]めからすべてのものが生[う]まれ、またこれからも生[う]まれるであろう。そして見[み]よ、ほとんどすべての者が滅[ほろ]びへと去[さ]り、多[おお]くの者[もの]が絶[た]やされる。"
  11: "それでは、これほど多[おお]くの者[もの]を失[うしな]った地[ち]と、一人[ひとり]の子[こ]のために苦[くる]しむあなたと、どちらがより泣[な]くべきであろうか。"
  12: "もしあなたがわたしに、『わたしの泣[な]くのは地[ち]の泣[な]くのとは同[おな]じではない。わたしは自分[じぶん]の胎[たい]の実[み]を失[うしな]ったのだ。それはわたしが悲[かな]しみのうちに宿[やど]し、苦[くる]しみのうちに産[くる]んだ子[こ]である。"
  13: "地[ち]は地[ち]の道[みち]を行[い]くものであり、その上[うえ]の今[いま]の多[おお]くの者[もの]も、起[お]こったとおりに去[さ]って行[い]く。』と言[い]うなら、"
  14: "わたしはあなたに言[い]う。あなたが苦[くる]しみのうちに産[くる]んだように、地[ち]もまた、初[はじ]めからそれを耕[たがや]す人[ひと]にその実[み]を与[あた]える。"
  15: "だから今[いま]、あなたは自分[じぶん]のうちで悲[かな]しみを抑[おさ]え、あなたに降[ふ]りかかった転落[てんらく]を力強[ちからづよ]く担[にな]いなさい。"
  16: "もしあなたが神[かみ]の定[さだ]めとその計[はか]りを正[ただ]しいと認[みと]めるなら、時[とき]が来[き]て子[こ]を受[う]け、そのような女[おんな]たちの間[あいだ]でほめたたえられるであろう。"
  17: "だから、町[まち]へ、あなたの夫[おっと]のもとへ帰[かえ]りなさい。」"
  18: "彼女[かのじょ]はわたしに言[い]った。「いいえ、そんなことはしない。町[まち]へは帰[かえ]らない。ここで死[し]ぬ。」"
  19: "わたしはさらに彼女[かのじょ]に語[かた]り続[つづ]けて言[い]った。"
  20: "「そんなことを言[い]ってはいけない。わたしの勧[すす]めに従[したが]いなさい。シオンの倒[たお]れはどれほど大[おお]きいことか。エルサレムの苦[くる]しみのゆえに、慰[なぐさ]めを得[え]なさい。"
  21: "見[み]なさい。わたしたちの聖所[せいしょ]は荒[あ]れ果[は]て、わたしたちの祭壇[さいだん]は打[う]ち砕[くだ]かれ、わたしたちの神殿[しんでん]は壊[こわ]され、"
  22: "わたしたちの竪琴[たてごと]は卑[いや]しめられ、歌[うた]は絶[た]え、わたしたちの喜[よろこ]びは砕[くだ]かれ、わたしたちの灯[あか]りの光[ひかり]は消[き]え、わたしたちの契約[けいやく]の箱[はこ]は奪[うば]われ、わたしたちの聖[せい]なるものは汚[けが]され、わたしたちの上[うえ]に呼[よ]ばれた御名[みな]さえ汚[けが]されようとし、わたしたちの子[こ]どもは辱[はずか]しめを受[う]け、わたしたちの祭司[さいし]たちは焼[や]かれ、わたしたちのレビ人[びと]たちは捕囚[ほしゅう]となって行[い]き、わたしたちの処女[おとめ]たちは汚[けが]され、わたしたちの妻[つま]たちは暴[ぼう]行[こう]を受[う]け、わたしたちの正[ただ]しい者[もの]たちは奪[うば]い去[さ]られ、わたしたちの幼[おさな]子[ご]たちは滅[ほろ]び、わたしたちの若者[わかもの]たちは奴隷[どれい]となり、わたしたちの強[つよ]い者[もの]たちは力[ちから]を失[うしな]った。"
  23: "そして何[なに]より重[おも]いのは、シオンのしるしがその栄光[えいこう]から落[お]ちたことである。それはわたしたちを憎[にく]む者[もの]たちの手[て]に渡[わた]されたからである。"
  24: "だから、あなたの大[おお]きな悲[かな]しみを振[ふ]り払[はら]い、多[おお]くの苦[くる]しみをあなたから取[と]り除[のぞ]きなさい。そうすれば、力[ちから]ある者[もの]があなたをあわれみ、いと高[たか]き方[かた]があなたに平安[へいあん]と、労苦[ろうく]の憩[いこ]いをお与[あた]えになるであろう。」"
  25: "わたしが彼女[かのじょ]に語[かた]っていると、彼女[かのじょ]の顔[かお]とまなざしが突然[とつぜん]輝[かがや]き、その見[み]た目[め]は光[ひかり]を放[はな]った。わたしは彼女[かのじょ]をひどく恐[おそ]れて、これは何[なに]ごとかと思[おも]った。"
  26: "見[み]よ、彼女[かのじょ]は突然[とつぜん]、恐[おそ]ろしい大[おお]きな声[こえ]を発[はっ]した。その女[おんな]の声[こえ]で地[ち]が揺[ゆ]れたほどである。"
  27: "わたしが見[み]ると、見[み]よ、女[おんな]はもはやわたしに現[あらわ]れず、町[まち]が建[た]てられ、大[おお]きな礎[いしずえ]の上[うえ]にその場所[ばしょ]が示[しめ]されていた。わたしは恐[おそ]れて、大[おお]きな声[こえ]で叫[さけ]んで言[い]った。"
  28: "「ウリエル天使[てんし]はどこにいるのか。初[はじ]めにわたしのもとへ来[き]たあの者[もの]は。この心[こころ]の激[はげ]しい混乱[こんらん]のあまり、わたしをこんな状態[じょうたい]にしたからだ。わたしの終[お]わりは滅[ほろ]びとなり、わたしの祈[いの]りは辱[はずか]しめとなった。」"
  29: "わたしがこう言[い]っていると、見[み]よ、彼がわたしのもとへ来[き]て、わたしを見[み]た。"
  30: "見[み]よ、わたしは死[し]んだ者のように横[よこ]たわり、我[わ]を失[うしな]っていた。彼はわたしの右[みぎ]の手[て]を取[と]って力[ちから]づけ、わたしを立[た]たせて言[い]った。"
  31: "「どうしたのか。なぜ理性[りせい]と心[こころ]の感情[かんじょう]が乱[みだ]れているのか。なぜ動揺[どうよう]しているのか。」わたしは言[い]った。「わたしを去[さ]ったのは、あなただからです。"
  32: "わたしはあなたの言葉[ことば]どおりにして野[の]へ出[で]て、見[み]ました。そして今[いま]も見[み]ていますが、それを語[かた]ることができません。」"
  33: "彼はわたしに言[い]った。「男[おとこ]のように立[た]ちなさい。わたしはあなたに告[つ]げよう。」わたしは言[い]った。"
  34: "「語[かた]ってください、わたしの主人[しゅじん]よ。どうかわたしを去[さ]らず、むなしく死[し]ぬことのないようにしてください。"
  35: "わたしは知[し]らなかったことを見[み]、知[し]らないことを聞[き]いています。わたしの感覚[かんかく]が偽[いつわ]っているのか、わたしの魂[たましい]が幻想[げんそう]を見[み]ているのか。"
  36: "だから、わたしはあなたに願[ねが]います。この恐[おそ]ろしいことを、あなたの僕[しもべ]に告[つ]げてください。」"
  37: "彼はわたしに答[こた]えて言[い]った。"
  38: "「わたしに聞[き]きなさい。わたしはあなたに教[おし]え、あなたが恐[おそ]れていることについて告[つ]げよう。いと高[たか]き方[かた]はあなたに多[おお]くの秘密[ひみつ]を開[ひら]かれるからである。"
  39: "彼はあなたの道[みち]の正[ただ]しさをご覧[らん]になった。あなたが絶[た]えずあなたの民[たみ]のために悲[かな]しみ、シオンのためにひどく泣[な]いていることを。"
  40: "先[さき]ほどあなたに現[あらわ]れたこの幻[まぼろし]の意味[いみ]はこうである。"
  41: "あなたが見[み]た、泣[な]いている女[おんな]、あなたが慰[なぐさ]めようとした者[もの]、"
  42: "今[いま]はもう女[おんな]の顔[かお]を見[み]ないで、建[た]てられる町[まち]があなたに現[あらわ]れた。それが、"
  43: "彼女[かのじょ]があなたに自分[じぶん]の子[こ]の死[し]について語[かた]ったこと、それがその解[かい]である。"
  44: "あなたが見[み]たこの女[おんな]こそシオンである。あなたが今[いま]、建[た]てられた町[まち]としてそれを見[み]るであろう、と彼女[かのじょ]があなたに語[かた]ったのは、"
  45: "また、三十年[さんじゅうねん]の間[あいだ]、彼女[かのじょ]が子[こ]を産[う]まない者[もの]であった、と語[かた]ったのは、すなわち、その中[なか]でまだいけにえがささげられていなかった三十年[さんじゅうねん]の間[あいだ]のことである。"
  46: "そしてその三十年[さんじゅうねん]が過[す]ぎたとき、ソロモンが町[まち]を建[た]て、そのときささげ物[もの]を献[ささ]げた。これが、子[こ]を産[う]まない女[おんな]が男[おとこ]の子[こ]を産[う]んだ時[とき]である。"
  47: "彼女[かのじょ]がその子[こ]を苦労[くろう]して育[そだ]てたと言[い]ったことは、エルサレムにおける住[す]まいのことであった。"
  48: "彼女[かのじょ]が、息子[むすこ]は自分[じぶん]の婚礼[こんれい]の間[ま]に入[はい]って倒[たお]れ、死[し]んだと言[い]ったことは、エルサレムに起[お]こった倒壊[とうかい]のことであった。"
  49: "そして見[み]よ、あなたは彼女[かのじょ]の似姿[にすがた]を見[み]、彼女[かのじょ]が子[こ]のために泣[な]くのを見[み]て慰[なぐさ]め始[はじ]めた。起[お]こったこれらのことについては、これがあなたに明[あき]らかにされるべきであった。"
  50: "そして今[いま]、いと高[たか]き方[かた]は、あなたが魂[たましい]に苦[くる]しみ、心[こころ]を尽[つ]くしてそのことで耐[た]えているのをご覧[らん]になり、あなたにその栄光[えいこう]の輝[かがや]きと、その麗[うるわ]しさの美[うつく]しさとをお示[しめ]しになった。"
  51: "それゆえにわたしはあなたに、家[いえ]の建[た]てられていない野[の]に住[す]めと言[い]ったのである。"
  52: "いと高[たか]き方[かた]があなたにこれらのことを示[しめ]始[はじ]めるのを、わたしは知[し]っていたからである。"
  53: "それゆえにわたしはあなたに、建[た]物[もの]の礎[いしずえ]のない野[の]に来[く]るようにと言[い]った。"
  54: "いと高[たか]き方[かた]の町[まち]が示[しめ]され始[はじ]める所[ところ]に、人[ひと]の建[た]てるものがあることはできなかったからである。"
  55: "だから、恐[おそ]れてはならない。心[こころ]を恐[おそ]れさせてもならない。入[はい]って、建[た]てられるものの輝[かがや]きと大[だい]いなることを、あなたの目[め]が見[み]ることのできるかぎり見[み]なさい。"
  56: "その後[あと]で、あなたの耳[みみ]が聞[き]くことのできるかぎりのことを聞[き]くであろう。"
  57: "あなたは多[おお]くの者[もの]よりも幸[しあわ]せであり、少[すく]ない者[もの]だけがするように、いと高[たか]き方[かた]のもとへ召[め]されているからである。"
  58: "しかし、明日[あす]の夜[よる]はここにとどまりなさい。"
  59: "そうすれば、いと高[たか]き方[かた]は、終[お]わりの日[ひ]々[び]に地[ち]に住[す]む者[もの]たちのために、いと高[たか]き方[かた]がなさる大[おお]いなることを、あなたに示[しめ]されるであろう。」"
  60: "わたしは彼が言[い]ったとおりに、その夜[よる]と次[つぎ]の夜[よる]を眠[ねむ]って過[す]ごした。"

notes:
  1: "«вниде сын мой в чертог свой» — «вошёл сын мой в чертог свой»; чертог — брачный покой, 婚礼[こんれい]の間[ま]. ru: «вошел в брачный чертог свой». Речь жены, начатая в 9:43, продолжается; кавычка на границе глав закрыта и открыта снова."
  2: "«превратихом вся светлая» — «мы опрокинули всё светлое», т. е. светильники (ru: «опрокинули все мы светильники»); «восташа вси граждане мои во утешение мое» — «встали все сограждане мои на утешение моё»; «почих даже до другаго дне до нощи» — «я почила до ночи другого дня»."
  3: "«егда вси почиваху, да мя утешат, да покоюся» — «когда все почивали, чтобы утешить меня, чтобы я успокоилась» (двойное «да»); «бежах» — «я побежала»."
  4: "«не ясти, ниже пити, но безпрестани рыдати и поститися дондеже умру» — «не есть, ни пить, но непрестанно рыдать и поститься, доколе не умру»."
  5: "Вводка ответа Ездры (10:6–17) — вне кавычек; «с яростию» — «с яростью, гневом»."
  6: "«буя паче всех жен» — «безумная более всех жён» (буий — глупый, безумный); «не видиши ли плача нашего и яже нам случишася» — «не видишь ли плача нашего и того, что нам случилось»."
  7: "«всякою скорбию скорбитъ и смирением смирена есть» — «всякою скорбью скорбит и смирением смирена (унижена)»; слав. figura etymologica сохранена: 悲しみのうちに悲しみ、辱しめられて辱しめられ. ru: «печалится безмерно, крайне унижена»."
  8: "«понеже вси рыдаем и скорбни есмы, яко вси прискорбни есмы» — «поскольку все мы рыдаем и скорбны, ибо все мы опечалены»; «ты же скорбиши о единем сыне» — «ты же скорбишь об одном сыне» — вопрос."
  9: "«вопроси бо земли, и речет тебе, яко сия есть, ейже подобает рыдати падения толикихъ на ней раждающихся» — «спроси землю, и скажет тебе, что это она, которой подобает оплакивать падение столь многих, на ней рождающихся»; ответ земли передан вложенной цитатой 『…』."
  10: "«и от нея от начала вси рождени, инии же приидут» — «и от неё от начала все рождены, и иные придут»; «едва не вси в погибель отходят, и истребление бывает множеству их» — «едва не все в погибель отходят, и истребление бывает множеству их»."
  11: "«кто убо имать рыдати паче сея, яже толь велие множество погубила, нежели ты, яже о единем болезнуеши?» — «кто должен рыдать более, чем она, погубившая столь великое множество, нежели ты, болящая об одном?»"
  12: "«аще же речеши мне» — «если же ты скажешь мне»; вложенная речь жены 『…』 начинается здесь и закрывается в 10:13; «егоже в печалех породих и с болезнию родих» — «которого я в печалях носила и с болезнью родила»."
  13: "«земля же по пути земли, отиде же в ней множество настоящее, якоже случися» — тёмное: «земля же по пути земли; отошло же в ней множество настоящее, как случилось». ru: «а земля — по свойству земли; на ней настоящее множество как отходит, так и приходит». Здесь вложенная речь закрывается."
  14: "Тёмное: «якоже ты с трудомъ родила еси, тако и земля дает плод свой человеку от начала ему, иже сотворил ю» — букв. «как ты с трудом родила, так и земля даёт плод свой человеку от начала, тому, кто создал её». ru: «как ты с трудом родила, так и земля дает плод свой человеку, который от начала возделывает ее». Принято ru (耕す人), так как слав. оборот невнятен; слав. «иже сотворил ю» отмечено."
  15: "«воздержи сама у себе болезнь твою и крепко носи яже тебе случишася падения» — «удержи в себе самой болезнь твою и крепко неси случившиеся тебе падения»."
  16: "«аще бо оправдиши предел Божий и советъ его» — «ибо если ты оправдаешь предел Божий и совет Его»; «приимеши во время и в таковых похвалишися» — «приимешь во время и в таких (женах) похвалишься»; ru: «в свое время получишь сына, и между женами будешь прославлена»."
  17: "«вниди убо во град к мужу твоему» — «войди же в город к мужу твоему». Здесь речь Ездры закрывается."
  18: "«не сотворю, ни вниду во град, но зде умру» — «не сделаю, не войду в город, но здесь умру»."
  19: "«приложих еще глаголати к ней» — «я приложил (продолжил) ещё говорить к ней»."
  20: "«не твори сего словесе, но соизволи совету моему» — «не делай этого слова, но соизволь совету моему»; «колико бо падение сиону?» — «ибо сколь велико падение Сиону?»; «утешися ради болезни Иерусалима» — «утешься ради болезни Иерусалима»."
  21: "«освящение наше опусте» — «святилище (освящение) наше опустело» (ru: «святилище наше опустошено»); «олтарь наш сотрен есть» — «алтарь наш сокрушён»; «церковь наша разорена есть» — «храм (церковь) наш разрушен»."
  22: "Длинный перечень; «псалтир наш смирен есть» — «псалтирь (струнный инструмент) наш уничижён», передано 竪琴[たてごと]; «песнь умолче» — «песнь умолкла»; «свет светилника нашего угашен есть» — «свет светильника нашего угашен»; «кивот завета нашего расхищен есть» — «ковчег завета нашего расхищен»; «имя, еже воззвано есть над нами, едва не осквернено есть» — «имя, которое наречено над нами, едва не осквернено»; «чада наша укорение претерпеша» — «чада наши претерпели укорение»; «священницы наши сожжени суть» — «священники наши сожжены»; «левити наши в пленение отидоша» — «левиты наши пошли в плен»; «девицы наша осквернены суть» — «девицы наши осквернены»; «жены наша насилие пострадаша» — «жёны наши потерпели насилие»; «праведнии наши восхищени суть» — «праведники наши восхищены (унесены)»; «отроцы наши изгибнуша» — «отроки наши погибли»; «юноши наши служиша» — «юноши наши служили (в рабстве)»; «крепцыи наши изнемогоша» — «крепкие наши изнемогли»."
  23: "«а сие всех паче знамение сиону, яко испаде от славы своея» — «а это более всего — знамение Сиону, что пало от славы своей»; «знамение» может значить и «знамя» (ru: «знамя Сиона»), в тексте оставлено しるし; «предан есть в руки ненавидящих ны» — «предано в руки ненавидящих нас»."
  24: "«оттряси твою печаль многую и отложи от себе множество болезней» — «отряси многую печаль твою и отложи от себя множество болезней»; «да тя помилует крепкий, и покой сотворит тебе вышний, упокоение трудов» — «да помилует тебя Крепкий, и покой сотворит тебе Вышний, упокоение трудов». Здесь речь Ездры закрывается."
  25: "«лице ея возсия внезапу и зрак, блисташе видение ея» — «лицо её воссияло внезапно, и взор, блистало видение её»; «яко бых ужасен зело от нея» — «так что я стал весьма устрашён ею»."
  26: "«испусти шум гласа великий, страха полный» — «испустила шум гласа великого, полного страха»; «яко поколебатися земли от шума жены» — «так что поколебалась земля от шума жены»."
  27: "«ктому жена не являшеся мне, но град созидашеся» — «более жена не являлась мне, но город созидался»; «место показовашеся от оснований великих» — «место показывалось от оснований великих»."
  28: "«где есть уриил ангел, иже от начала прииде ко мне?» — «где Уриил ангел, который от начала пришёл ко мне?»; «понеже той мя сотвори приити во множестве ужаса ума сего» — «ибо он сделал, что я пришёл в великое исступление ума сего»; «бысть конец мой в растление, и молитва моя в поношение» — «стал конец мой в погибель, и молитва моя в поношение»."
  29: "«се, прииде ко мне и виде мя» — «вот, пришёл ко мне и увидел меня»."
  30: "«бых лежащь яко мертв, и разумъ мой отчужден бысть» — «я был лежащ как мёртвый, и разум мой отчуждён был»; «удержа десницу мою, и укрепи мя, и постави мя на нозе мои» — «он удержал правую руку мою, укрепил меня и поставил меня на ноги мои»."
  31: "«что тебе есть? и вскую смущен есть разум твой и чувства сердца твоего? и вскую смущаешися?» — «что с тобою? и почему смущён разум твой и чувства сердца твоего? и почему смущаешься?»; «И рекох: яко оставил мя еси» — «я сказал: ибо Ты оставил меня» — ответ начинается в конце стиха и продолжается в 10:32."
  32: "«и аз убо сотворих по словесем твоим, и изыдох на поле, и се, видех и вижду, яко не могу провещати» — «и я сделал по словам твоим, и вышел на поле, и вот, увидел и вижу, но не могу говорить»."
  33: "«стани яко муж, и возвещу ти» — «стань как муж, и я возвещу тебе»; вводка ответа Ездры (10:34–36) — вне кавычек."
  34: "«глаголи, господи мой, ты ко мне и не остави мя, яко да не всуе умру» — «говори мне, господин мой, ты ко мне, и не оставь меня, чтобы я не умер напрасно»."
  35: "«яко видех, яже не ведях, и слышу, яже не вем» — «ибо я увидел, чего не знал, и слышу, чего не знаю»; «или чувство мое лжет, и душа моя мечтание видит?» — «или чувство моё лжёт, и душа моя видит мечтание?» (в ru «Чувство ли мое обманывает меня…» стоит в 10:36 — держим слав. деление)."
  36: "«ныне убо молю тя, да скажеши рабу твоему о ужасе сем» — «итак молю тебя, скажи рабу твоему об этом ужасе» (ru: «это исступление ума моего» — прибавлено)."
  37: "Вводка речи ангела (10:38–59) — вне кавычек; ru ставит сюда же конец просьбы Ездры («Отвечая мне, сказал он»), слав. короче — держим слав."
  38: "«слыши мя, и научу тя, и реку тебе о коихъ боишися» — «послушай меня, и я научу тебя, и скажу тебе о том, чего ты боишься»; «яко вышний откры тебе тайны многи» — «ибо Вышний открыл тебе многие тайны»."
  39: "«виде прав путь твой, яко безпрестани скорбиши о людех твоих и зело рыдаеши сиона ради» — «он видит правый путь твой, что ты непрестанно скорбишь о народе твоём и сильно рыдаешь о Сионе»."
  40: "«сей убо разум видения, еже тебе явися мало прежде» — «таково значение видения, которое явилось тебе немного прежде»; «разум» — смысл, значение."
  41: "«юже видел еси рыдающую, начал еси утешати ю» — «которую ты видел рыдающей и начал утешать её»; слав. предложение продолжается в 10:42–43."
  42: "«ныне же уже лица женска не видиши, но явися тебе град созидаемый» — «ныне же уже лица женского не видишь, но явился тебе город созидаемый»."
  43: "«и яко возвещаше тебе о падении сына своего, сие есть решение» — «и как она возвещала тебе о падении сына своего, вот решение (истолкование)»."
  44: "«сия жена … сия есть сион» — «жена сия … это Сион»; «и понеже рече тебе, юже и ныне узриши яко град создан» — «и так как она сказала тебе, что ты и ныне увидишь её как город созданный» — слав. оборот обрывается, продолжение в 10:45."
  45: "«яко безплодна бяше лет тридесять: сиречь, за еже бяху летъ тридесять, егда не бысть в нем еще жертва приношена» — «что она была неплодна тридцать лет: то есть за то, что было тридцать лет, когда в нём ещё не была приносима жертва»."
  46: "«созда соломонъ град и принесе приношения тогда, егда роди неплоды сына» — «создал Соломон город и принёс приношения тогда, когда неплодная родила сына»."
  47: "«еже рече тебе, яко воспита его с трудом, сие бяше обитание во Иерусалиме» — «что она сказала тебе, что воспитала его с трудом, это было обитание в Иерусалиме»."
  48: "«яко сын мой грядый в свой чертог мертв бысть, и случися ему падение, то бяше, еже сотворено есть падение Иерусалиму» — «что сын мой, входя в свой чертог, стал мёртв, и случилось ему падение, это было то, что сделано падением Иерусалиму»."
  49: "«видел еси подобие ея, и яко сына рыдаше, начал еси утешати ю» — «ты видел подобие её, и как она рыдала о сыне, начал утешать её»; «о сих, яже случишася, сия подобаше тебе открыти» — «об этих случившихся [вещах] это подобало тебе открыть»."
  50: "«яви тебе светлость славы его и красоту лепоты его» — «явил тебе светлость славы его и красоту лепоты (красы) его»."
  51: "«сего бо ради рекох тебе, да живеши в поли, идеже несть дом создан» — «ибо ради сего я сказал тебе, чтобы ты жил в поле, где нет созданного дома»."
  52: "«ведях бо аз, яко вышний начинаше тебе показовати сия» — «ибо я знал, что Вышний начинал показывать тебе это»."
  53: "«да приидеши на ниву, идеже несть основания зданию» — «чтобы ты пришёл на ниву, где нет основания зданию»."
  54: "«ниже бо можаше дело здания человеческаго содержатися на месте, идеже начинаше вышняго град показоватися» — «ибо не могло дело человеческого здания держаться на месте, где начинал показываться город Вышнего»."
  55: "«не бойся, ниже да устрашится сердце твое» — «не бойся, и да не устрашится сердце твоё»; «вниди и виждь светлость и величество созидания, колико возможно есть тебе видениемъ очес (видети)» — «войди и увидь светлость и величие созидания, сколько возможно тебе видеть очами»; слав. в скобках «(видети)» — редакционное, не переведено."
  56: "«колико приемлет слышание ушес твоих слышати» — «сколько может слышание ушей твоих слышать»."
  57: "«ты бо блажен еси паче многих и званъ еси пред вышняго яко не мнози» — «ибо ты блажен более многих и призван к Вышнему, как немногие»; слав. оборот тёмный, передан по смыслу."
  58: "«в нощи же, яже заутра будет, пребуди зде» — «в ночь же, которая будет завтра, пребудь здесь»."
  59: "«покажет тебе вышний оная видения вышших, яже сотворит вышний обитающим на земли въ последния дни» — «покажет тебе Вышний те видения высших [дел], которые сотворит Вышний обитающим на земле в последние дни». Здесь речь ангела закрывается."
  60: "«спах ту нощь и другую, якоже рече мне» — «спал я ту ночь и другую, как он сказал мне»."
