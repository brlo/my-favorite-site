# jp-box, 3-я Ездры, глава 10. Черновик для приёмки.
#
# База: церковнославянский текст (csl-ru) — в Септуагинте книги нет; ru — для понимания.
# Нумерация — славянская. Язык — современный 常体; 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1–4 продолжение рассказа жены: сын умер, входя в брачный чертог, она
# ночью ушла в поле и решила не возвращаться; 5–17 ответ Ездры: Сион — мать наша,
# плач земли о падении столь многих; 18 отказ жены вернуться; 19–24 увещание Ездры
# (святилище опустело, алтарь сокрушён, храм разрушен, священники сожжены, левиты в
# плену); 25–28 жена просияла, испустила страшный глас и стала созидаемым городом,
# Ездра в исступлении зовёт Уриила; 29–33 Уриил укрепляет его; 34–36 просьба
# истолковать; 37–59 толкование: жена — Сион, тридцать лет — время до Соломона, сын —
# падение Иерусалима; 60 Ездра спит две ночи.
# Голоса: 10:1–4 — жена 「…」 (продолжение её речи из 9:43; на границе глав кавычка
# закрыта и открыта снова); 10:6–17 — Ездра 「…」, внутри 10:9 ответ земли 『…』,
# в 10:12–13 предполагаемые слова жены 『…』; 10:18 — жена 「…」; 10:20–24 — Ездра 「…»;
# 10:28 — Ездра 「…»; 10:31 — ангел 「…», затем ответ Ездры 「…» до 10:32;
# 10:33 — ангел 「…»; 10:34–36 — Ездра 「…»; 10:38–59 — ангел, одна речь 「…».
# Вводки «и рече ко мне», «и рекох» — вне кавычек.
# Термины: 婚礼[こんれい]の間[ま] — чертог (брачный); 竪琴[たてごと] — псалтирь;
# 聖所[せいしょ] — освящение/святилище; 祭壇[さいだん], 神殿[しんでん], 契約[けいやく]の
# 箱[はこ] — кивот завета; 御名[みな] — имя, наречённое над нами; 捕囚[ほしゅう] — плен;
# 処女[おとめ] — девицы; 幼[おさな]子[ご] — отроки; 力[ちから]ある者[もの] — Крепкий;
# 幻[まぼろし] — видение; 理性[りせい] — разум; 崩壊[ほうかい]/倒壊[とうかい] — падение.
# Имена: エズラ, ウリエル, シオン, エルサレム, ソロモン.
# Язык: речь Ездры к ангелу (10:31–36) — です・ます, как обращения к ангелам в корпусе
# (Лк 1, Дан 10); речь к жене и речь жены — 常体.
#
