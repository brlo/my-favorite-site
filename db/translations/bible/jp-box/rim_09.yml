# jp-box, Послание к Римлянам, глава 9. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный 常体, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 9: скорбь Павла об Израиле (1–5), слово Божие не отпало (6–13),
# Бог милует и ожесточает (14–18), образ горшечника (19–24), призвание язычников (25–29),
# праведность по вере и камень преткновения (30–33).
# Красного и синего в главе нет; <j>/<mo> не ставятся. Цитаты Писания — в 『』.
# jp-ni не использовался.

tr_code: jp-box
book: rim
chapter: 9
draft: true

verses:
  1: "わたしはキリストにあって真実[しんじつ]を語[かた]り、偽[いつわ]りを言[い]わない。わたしの良心[りょうしん]も、{聖霊[せいれい]|聖神[せいしん]}にあってわたしとともに証[あかし]する。"
  2: "すなわち、わたしには大[おお]きな悲[かな]しみがあり、心[こころ]には絶[た]え間[ま]ない痛[いた]みがある。"
  3: "兄弟[きょうだい]たち、すなわち肉[にく]によればわたしの親族[しんぞく]である者[もの]たちのために、わたし自身[じしん]がキリストから呪[のろ]われ、滅[ほろ]びに定[さだ]められた者[もの]となることを、願[ねが]っているからである。"
  4: "彼[かれ]らはイスラエル人[じん]であり、子[こ]としての身分[みぶん]、栄光[えいこう]、契約[けいやく]、律法[りっぽう]の制定[せいてい]、礼拝[れいはい]、約束[やくそく]は、彼[かれ]らのものである。"
  5: "先祖[せんぞ]たちも彼[かれ]らのものであり、肉[にく]によればキリストも彼[かれ]らから出[で]た。すべての上[うえ]にある神[かみ]、とこしえにほめたたえられる方[かた]。アーメン。"
  6: "しかし、神[かみ]の言葉[ことば]が廃[すた]れた、というのではない。というのは、イスラエルから出[で]た者[もの]が皆[みな]、イスラエルなのではないからである。"
  7: "また、アブラハムの子孫[しそん]だからといって、皆[みな]が子[こ]なのではない。むしろ、「イサクにあって、あなたの子孫[しそん]が名[な]づけられる」とある。"
  8: "すなわち、肉[にく]の子[こ]どもが神[かみ]の子[こ]どもなのではなく、約束[やくそく]の子[こ]どもが子孫[しそん]として数[かぞ]えられるのである。"
  9: "というのは、約束[やくそく]の言葉[ことば]はこうである。「定[さだ]められた時[とき]にわたしは来[き]て、サラに男[おとこ]の子[こ]がある。」"
  10: "それだけではない。わたしたちの父[ちち]イサクによって一人[ひとり]の者[もの]から身[み]ごもったリベカの場合[ばあい]も、そうである。"
  11: "というのは、子[こ]どもがまだ生[う]まれず、善[よ]いことも悪[あし]いことも行[おこな]っていなかったとき、神[かみ]の選[えら]びによるご計画[けいかく]が保[たも]たれるためであった。"
  12: "すなわち、行[おこな]いによるのではなく、召[め]す方[かた]によるのである。「兄[あに]は弟[おとうと]に仕[つか]える」と、彼女[かのじょ]に告[つ]げられた。"
  13: "「わたしはヤコブを愛[あい]し、エサウを憎[にく]んだ」と書[か]いてあるとおりである。"
  14: "それでは、わたしたちは何[なに]を言[い]おうか。神[かみ]に不義[ふぎ]があるのだろうか。決[けっ]してそうではない。"
  15: "というのは、モーセに言[い]われる。「わたしは、憐[あわ]れもうとする者[もの]を憐[あわ]れみ、慈[いつく]しもうとする者[もの]を慈[いつく]しむ。」"
  16: "それゆえ、これは願[ねが]う者[もの]によるのでも、走[はし]る者[もの]によるのでもなく、憐[あわ]んでくださる神[かみ]によるのである。"
  17: "というのは、聖書[せいしょ]はファラオに言[い]う。「わたしがあなたを起[お]こしたのは、あなたによってわたしの力[ちから]を示[しめ]し、わたしの名[な]が全地[ぜんち]に告[つ]げ知[し]らされるためである。」"
  18: "それゆえ、神[かみ]は、憐[あわ]れもうとする者[もの]を憐[あわ]れみ、かたくなにしようとする者[もの]をかたくなにされる。"
  19: "あなたはわたしにこう言[い]うだろう。「それなら、何[なに]ゆえ、なお責[せ]められるのか。だれが神[かみ]の御心[みこころ]に逆[さか]らうことができようか。」"
  20: "ああ、人[ひと]よ。神[かみ]に言[い]い返[かえ]すあなたは、いったい、だれなのか。造[つく]られた者[もの]が、造[つく]った者[もの]に「なぜ、わたしをこのように造[つく]ったのか」と言[い]うだろうか。"
  21: "それとも、陶工[とうこう]は粘土[ねんど]の上[うえ]に権[けん]を持[も]っていて、同[おな]じかたまりから、一[ひと]つの器[うつわ]を尊[とうと]い用[よう]のために、別[べつ]の器[うつわ]を卑[いや]しい用[よう]のために造[つく]ることはできないのか。"
  22: "しかし、もし神[かみ]が、怒[いか]りを現[あらわ]し、その力[ちから]を知[し]らせようとして、滅[ほろ]びに備[そな]えられた怒[いか]りの器[うつわ]を、大[おお]きな寛容[かんよう]をもって耐[た]え忍[しの]ばれたのだとすれば、"
  23: "また、栄光[えいこう]のために備[そな]えられた憐[あわ]れみの器[うつわ]に、その栄光[えいこう]の富[とみ]を知[し]らせようとされたのだとすれば、"
  24: "ユダヤ人[じん]からだけではなく、異邦人[いほうじん]からも召[め]された者[もの]、すなわちわたしたちを召[め]されたのだとすれば、いったい、どうであろうか。"
  25: "ホセアの書[しょ]にも言[い]われているとおりである。「わたしは、わたしの民[たみ]でなかった者[もの]を『わたしの民[たみ]』と呼[よ]び、愛[あい]されなかった者[もの]を『愛[あい]される者[もの]』と呼[よ]ぶ。」"
  26: "「また、『あなたがたはわたしの民[たみ]ではない』と言[い]われたその場所[ばしょ]で、彼[かれ]らは生[い]ける神[かみ]の子[こ]と呼[よ]ばれる。」"
  27: "イザヤはイスラエルのことを叫[さけ]んで言[い]う。「たとえイスラエルの子[こ]らが海[うみ]の砂[すな]のように多[おお]くても、残[のこ]りの者[もの]が救[すく]われる。」"
  28: "主[しゅ]は地[ち]の上[うえ]で、言葉[ことば]を成[な]し遂[と]げ、断[た]ち切[き]り〔義[ぎ]のうちに〕、〔断[た]ち切[き]られた言葉[ことば]を〕行[おこな]われるからである。"
  29: "また、イザヤが前[まえ]もって言[い]ったとおりである。「もし万軍[ばんぐん]の主[しゅ]がわたしたちに子孫[しそん]を残[のこ]さなかったなら、わたしたちはソドムのようになり、ゴモラに似[に]た者[もの]となっていたであろう。」"
  30: "それでは、何[なに]を言[い]おうか。義[ぎ]を追[お]い求[もと]めていなかった異邦人[いほうじん]が義[ぎ]を、すなわち信仰[しんこう]による義[ぎ]を、得[え]たのである。"
  31: "しかし、義[ぎ]の律法[りっぽう]を追[お]い求[もと]めたイスラエルは、その〔義[ぎ]の〕律法[りっぽう]には達[たっ]しなかった。"
  32: "なぜか。信仰[しんこう]によらず、〔律法[りっぽう]の〕行[おこな]いによるかのように追[お]い求[もと]めたからである。彼[かれ]らは、つまずきの石[いし]につまずいた。"
  33: "「見[み]よ、わたしはシオンに、つまずきの石[いし]、妨[さまた]げの岩[いわ]を置[お]く。彼[かれ]に信[しん]じる者[もの]は、辱[はずかし]めを受[う]けない」と書[か]いてあるとおりである。"

notes:
  1: "συμμαρτυρούσης μοι τῆς συνειδήσεώς μου ἐν πνεύματι ἁγίῳ — «свидетельствует мне совесть моя в Духе Святом»; 良心が聖霊にあってともに証しする, порядок сохранён."
  3: "ἀνάθεμα — «отлучённое, преданное погибели»; передал 呪われ、滅びに定められた者 (по значению слова, ср. jp-joc「ハリストスより絕たれん」). ηὐχόμην — imperfect, «желал бы»; 願っている. Оборот с γάρ — «ибо» — сохранён."
  4: "υἱοθεσία — «усыновление»; 子としての身分 (как в 8:15; сноска там уже дана). νομοθεσία — «законоположение»; 律法の制定. λατρεία — 礼拝. Перечисление из шести даров сохранено без перестройки."
  5: "Двусмысленность не разрешена: в греч. нет пунктуации, и ὁ ὢν ἐπὶ πάντων θεὸς εὐλογητὸς εἰς τοὺς αἰῶνας можно читать и как приложение к Христу («Христос по плоти, сущий над всем Бог, благословенный»), и как славословие Отцу. По-японски сохранён греческий порядок без связки (…神、とこしえにほめたたえられる方。), так что оба чтения остаются возможными. В notes — только объяснение; текст не сглажен."
  6: "ἐκπέπτωκεν — «выпало, пропало»; 廃れた. οὐχ οἷον δὲ ὅτι — «не то, чтобы»; というのではない."
  7: "Ἐν Ἰσαὰκ κληθήσεταί σοι σπέρμα — Быт 21:12; イサクにあって…名づけられる."
  9: "Катὰ τὸν καιρὸν τοῦτον — «в это (определённое) время»; 定められた時に. Быт 18:10."
  10: "ἐξ ἑνὸς κοίτην ἔχουσα — «имевшая зачатие от одного»; 一人の者から身ごもった."
  11: "ἡ κατ᾿ ἐκλογὴν πρόθεσις τοῦ θεοῦ — «изволение Божие по избранию»; 神の選びによるご計画 (πρόθεσις — ご計画, как в 8:28; 予定 — προορίζω, 8:29–30). Стих в базе кончается на μένῃ («пребывало»); οὐκ ἐξ ἔργων ἀλλ᾽ ἐκ τοῦ καλοῦντος относится уже к ст. 12 — деление по базе (у jp-joc иначе)."
  13: "Мал 1:2–3."
  15: "Исх 33:19. ἐλεέω/οἰκτίρω — «милую/жалею»; 憐[あわ]む/慈しむ."
  17: "Исх 9:16. ἐξήγειρά σε — «поставил, воздвиг тебя»; 起こした."
  19: "В базе [οῦν] стоит в квадратных скобках — слово есть, 〔…〕 не ставится; なお."
  20: "μενοῦνγε — усилительная частица; いったい. ὦ ἄνθρωπε — ああ、人よ. Ис 29:16; 45:9."
  21: "κεραμεύς — 陶工; πηλός — 粘土; φύραμα — かたまり (смесь). εἰς τιμὴν / εἰς ἀτιμίαν — «в честь / в бесчестие»; 尊い用 / 卑しい用."
  22: "μακροθυμία — «долготерпение»; 寛容. Стихи 22–24 в греч. — один период без аподосиса; по-японски он сохранён: 22–23 кончаются на 「とすれば、», развязка — в ст. 24."
  24: "οὓς καὶ ἐκέλεσεν ἡμᾶς — «которых Он и призвал, нас»; すなわちわたしたちを召された. Аподосис периода 22–24 подразумевается («что же?»), поэтому いったい、どうであろうか — как у jp-joc「何ぞや」."
  25: "Ос 2:23. τῶν οὐ λαόν μου — «не народ Мой»; わたしの民でなかった者."
  26: "Ос 1:10."
  27: "Ис 10:22. κράζει ὑπὲρ τοῦ Ἰσραήλ — «взывает об Израиле»; イスラエルのことを叫んで."
  28: "Ис 10:23 (LXX). В базе только λόγον συντελῶν καὶ συντέμνων ποιήσει κύριος ἐπὶ τῆς γῆς; церковный текст (Елизаветинская «в правде… слово сокращенно», jp-joc「義に遵ひて…斷じたる事」) добавляет ἐν δικαιοσύνῃ и λόγον συντετμημένον — 〔義のうちに〕〔断ち切られた言葉を〕. Проверено по базе: ἐν δικαιοσύνῃ — 0 вхождений, συντετμημένον — 0."
  29: "Ис 1:9. κύριος Σαβαώθ — титул, букв. «Господь воинств»; 万軍の主."
  31: "В базе второго δικαιοσύνης при νόμον нет; церковный текст (Синодальный «до закона праведности», jp-joc「義の律法」) читает νόμον δικαιοσύνης — 〔義の〕. Проверено по базе: «νόμον δικαιοσύνης» — 1 вхождение (только первое)."
  32: "ὡς ἐξ ἔργων — «как бы от дел»; в базе без νόμου, церковный текст (Синодальный «в делах закона», jp-joc「律法の行」) читает νόμου — 〔律法の〕. Проверено: νόμου в стихе — 0. Ис 8:14; 28:16."
  33: "Ис 28:16. καταισχυνθήσεται — «постыдится»; 辱めを受ける."
