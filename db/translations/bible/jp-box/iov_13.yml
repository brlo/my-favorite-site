verses:
  1: "「見[み]よ、これらすべてをわたしの目[め]が見、わたしの耳[みみ]が聞[き]いた。"
  2: "あなたがたが知[し]っていることは、わたしも知っている。わたしはあなたがたより愚[おろ]かではない。"
  3: "しかし、わたしは主[しゅ]に語[かた]ろう。主がお望[のぞ]みになるなら、主の前[まえ]でわたしは訴[うった]えよう。"
  4: "しかし、あなたがたはみな、不正[ふせい]な医者[いしゃ]、悪[わる]を癒[いや]す医者である。"
  5: "あなたがたが黙[だま]っていればよいのに。そうすれば、それがあなたがたの知恵[ちえ]となる。"
  6: "わたしの口[くち]の訴[うった]えを聞[き]け。わたしの唇[くちびる]の裁[さば]きに心[こころ]を留[と]めよ。"
  7: "あなたがたは主[しゅ]の前[まえ]で語[かた]っているのではないか。主の前で偽[いつわ]りを口[くち]にしているのではないか。"
  8: "あなたがたは身[み]をかわそうとするのか。あなたがた自身[じしん]が裁[さば]き手[て]となれ。"
  9: "神[かみ]があなたがたを探[さぐ]り出[だ]されるなら、それは結構[けっこう]なことだ。あなたがたはすべてを行[おこな]い、神に加[くわ]えられるのだから。"
  10: "あなたがたが密[ひそ]かに人[ひと]の顔色[かおいろ]をうかがうとしても、神[かみ]はそれでもあなたがたを責[せ]められる。"
  11: "神[かみ]の恐[おそ]ろしいことがあなたがたをかき乱[みだ]し、神からのおののきがあなたがたに降[ふ]りかかるのではないか。"
  12: "あなたがたの誇[ほこ]りは灰[はい]のようになり、あなたがたのからだは泥[どろ]のものとなる。"
  13: "黙[だま]っていてくれ。わたしが語[かた]り、怒[いか]りから休[やす]むことができるように。"
  14: "わたしは歯[は]で自分[じぶん]の肉[にく]をかみ、自分の魂[たましい]を手[て]に握[にぎ]ろう。"
  15: "力[ちから]ある者[もの]がわたしに手[て]をかけるなら、すでに始[はじ]められているのだから、わたしは必[かなら]ず語り、彼[かれ]の前[まえ]で訴[うった]える。"
  16: "これがわたしの救[すく]いとなる。偽[いつわ]りは神[かみ]の前[まえ]に入[はい]れないからだ。"
  17: "わたしの言葉[ことば]を聞[き]け、聞け。聞いているあなたがたに、わたしは告[つ]げ知[し]らせる。"
  18: "見[み]よ、わたしは自分[じぶん]の裁[さば]きに近[ちか]づいている。わたしは正[ただ]しい者[もの]として現[あらわ]れることを知[し]っている。"
  19: "わたしと争[あらそ]って裁[さば]かれる者[もの]が、いるだろうか。今[いま]、わたしが黙[だま]っていれば、消[き]え去[さ]るだけだ。"
  20: "ただ二[ふた]つのことだけ、わたしにしてほしい。そうすれば、わたしはあなたの顔[かお]から隠[かく]れない。"
  21: "あなたの手[て]をわたしから遠[とお]ざけてください。あなたの恐[おそ]れがわたしを打[う]ちのめさないように。"
  22: "そうすれば、あなたが呼[よ]ばれ、わたしは従[したが]う。あるいは、あなたが語[かた]られ、わたしが答[こた]えを返[かえ]す。"
  23: "わたしの罪[つみ]と不法[ふほう]は、いくつあるのか。それが何[なん]であるか、わたしに教[おし]えてください。"
  24: "なぜ、あなたはわたしから顔[かお]を隠[かく]されるのか。なぜ、わたしをあなたの敵[てき]と見[み]なされるのか。"
  25: "あなたは、風[かぜ]に揺[ゆ]れる葉[は]を恐[おそ]れるのか。風に吹[ふ]き流[さ]れる草[くさ]のように、わたしに立[た]ち向[む]かうのか。"
  26: "あなたはわたしに不利[ふり]なことを書[か]き記[しる]し、若[わか]い頃[ころ]の罪[つみ]をわたしに負[お]わせられたからだ。"
  27: "あなたはわたしの足[あし]を足枷[あしかせ]にかけ、わたしのすべてのわざを見張[みは]り、わたしの足の根[ね]にまで及[およ]ばれた。"
  28: "それは皮袋[かわぶくろ]のように古[ふる]び、虫[むし]に食[く]われた衣[ころも]のようになる。」"

notes:
  1: "Иов; продолжение речи (12:2–14:22) — глава снова открывается цитатой без вводной формулы. ἰδοὺ ταῦτα ἑώρακέν μου ὁ ὀφθαλμός — «вот, это видел глаз мой»; ἀκήκοέν μου τὸ οὖς — «и услышало ухо мое». Слав. 13:1 совпадает."
  2: "Иов. καὶ οἶδα ὅσα καὶ ὑμεῖς ἐπίστασθε — «и знаю, сколько и вы знаете»; οὐκ ἀσυνετώτερός εἰμι ὑμῶν — «я не неразумнее вас» (ἀσύνετος — «непонимающий»). Син. добавляет «не ниже я вас» (по МТ), в LXX этого нет."
  3: "Иов. οὐ μὴν δὲ ἀλλ᾽ ἐγὼ πρὸς κύριον λαλήσω — «но однако же я к Господу буду говорить»; ἐλέγξω δὲ ἐναντίον αὐτοῦ ἐὰν βούληται — «и обличу пред ним, если он пожелает» (ἐλέγχω — «обличать, изобличать»)."
  4: "Иов. ὑμεῖς δέ ἐστε ἰατροὶ ἄδικοι — «вы — врачи неправедные»; ἰαταὶ κακῶν πάντες — «и целители зол все» (ἰατήρ — «врачеватель»). Ирония сохранена."
  5: "Иов. εἴη δὲ ὑμῖν κωφεῦσαι — «о если бы вам онеметь» (κωφεύω — «молчать, быть немым»; оптатив); ἀποβήσεται ὑμῖν εἰς σοφίαν — «это обратится вам в мудрость» (ἀποβαίνω)."
  6: "Иов. ἀκούσατε ἔλεγχον στόματός μου — «услышьте обличение уст моих» (ἔλεγχος); κρίσιν δὲ χειλέων μου προσέχετε — «и суду уст моих внимайте»."
  7: "Иов. πότερον οὐκ ἔναντι κυρίου λαλεῖτε — «разве не пред Господом вы говорите»; ἔναντι δὲ αὐτοῦ φθέγγεσθε δόλον — «и пред ним произносите коварство» (φθέγγομαι — «изрекать»; δόλος — «обман»)."
  8: "Иов. ἦ ὑποστελεῖσθε — «или вы уклонитесь» (ὑποστέλλομαι — «устраняться, скрываться»); ὑμεῖς δὲ αὐτοὶ κριταὶ γένεσθε — «и сами будьте судьями». Тёмное место, передано близко к греч.; Син. иначе (по МТ)."
  9: "Иов. καλόν γε, ἐὰν ἐξιχνιάσῃ ὑμᾶς — «хорошо, если он выследит вас» (ἐξιχνιάζω — «разыскивать»); εἰ γὰρ τὰ πάντα ποιοῦντες προστεθήσεσθε αὐτῷ — «ибо если вы все делаете, приложитесь к нему» (προστίθημι — «прилагать, присоединять»): тёмное место, возможно «будете всецело преданы Ему»; слав. «аще бо вси творящии приложитеся к нему»; Син. иначе (по МТ)."
  10: "Иов. οὐθὲν ἧττον ἐλέγξει ὑμᾶς — «нисколько не меньше он обличит вас» (ἥττον — «меньше»); εἰ δὲ καὶ κρυφῇ πρόσωπα θαυμάσετε — «если и тайно лицам удивляться будете», т. е. лицеприятствовать (θαυμάζω πρόσωπα). Слав. относит первую половину к 13:9 — сдвиг отмечен в шапке."
  11: "Иов. πότερον οὐχὶ δεινὰ αὐτοῦ στροβήσει ὑμᾶς — «разве не ужасы его смутят вас» (στροβέω — «крутить, приводить в смятение»); φόβος δὲ παρ᾽ αὐτοῦ ἐπιπεσεῖται ὑμῖν — «и страх от него нападет на вас»."
  12: "Иов. ἀποβήσεται δὲ ὑμῶν τὸ ἀγαυρίαμα ἴσα σποδῷ — «обратится похвальба ваша в пепел» (ἀγαυρίαμα — «хвастовство», σποδός — «пепел»); τὸ δὲ σῶμα πήλινον — «и тело глиняное» (πηλός — «глина»)."
  13: "Иов. κωφεύσατε, ἵνα λαλήσω — «замолчите, чтобы я говорил»; ἀναπαύσωμαι θυμοῦ — «и успокоился от гнева» (ἀναπαύομαι с род. — «отдыхать от»)."
  14: "Иов. ἀναλαβὼν τὰς σάρκας μου τοῖς ὀδοῦσιν — «взяв плоть мою зубами»; ψυχὴν δέ μου θήσω ἐν χειρί — «и душу мою положу в руке [моей]»: тёмный образ (ср. Суд 12:3; 1 Цар 19:5; 28:21) — «рисковать жизнью»; оставлено буквально, без пояснения."
  15: "Иов. ἐάν με χειρώσηται ὁ δυνάστης — «если сильный наложит на меня руку» (χειρόω — «брать рукой»); ἐπεὶ καὶ ἦρκται — «поскольку и начал»; ἦ μὴν λαλήσω — «воистину буду говорить». В LXX и слав. здесь нет слов «но я буду надеяться» (это МТ и Син.); перевод по греч., знаменитое чтение отмечено."
  16: "Иов. τοῦτό μοι ἀποβήσεται εἰς σωτηρίαν — «это обратится мне во спасение»; οὐ γὰρ ἐναντίον αὐτοῦ δόλος εἰσελεύσεται — «ибо не войдет пред ним коварство»."
  17: "Иов. ἀκούσατε ἀκούσατε τὰ ῥήματά μου — «услышьте, услышьте слова мои» (повтор сохранён); ἀναγγελῶ γὰρ ὑμῶν ἀκουόντων — «ибо возвещу при вас слышащих»."
  18: "Иов. ἐγὼ ἐγγύς εἰμι τοῦ κρίματός μου — «я близок к суду моему»; οἶδα ὅτι δίκαιος ἀναφανοῦμαι — «знаю, что праведным явлюсь» (ἀναφαίνομαι — «являться»)."
  19: "Иов. τίς ἐστιν ὁ κριθησόμενός μοι — «кто тот, кто будет судиться со мной» (κρίνομαι); ὅτι νῦν κωφεύσω καὶ ἐκλείψω — «ибо теперь замолчу и исчезну» (ἐκλείπω); слав. «да ныне умолчу и изчезну»."
  20: "Иов. δυεῖν δέ μοι χρήσῃ — «двух только сделай мне» (χράομαι — «пользоваться, делать»); τότε ἀπὸ τοῦ προσώπου σου οὐ κρυβήσομαι — «тогда от лица твоего не скроюсь». Просьбы названы в ст. 21."
  21: "Иов. τὴν χεῖρα ἀπ᾽ ἐμοῦ ἀπέχου — «руку от меня отстрани» (ἀπέχω); ὁ φόβος σου μή με καταπλησσέτω — «и страх твой пусть не поражает меня» (καταπλήσσω — «ужасать»)."
  22: "Иов. εἶτα καλέσεις, ἐγὼ δέ σοι ὑπακούσομαι — «тогда позовешь, и я послушаю тебя» (ὑπακούω); ἢ λαλήσεις, ἐγὼ δέ σοι δώσω ἀνταπόκρισιν — «или скажешь, и я дам тебе ответ» (ἀνταπόκρισις — «ответ»). Слав. то же."
  23: "Иов. πόσαι εἰσὶν αἱ ἁμαρτίαι μου καὶ αἱ ἀνομίαι μου — «сколько грехов моих и беззаконий моих»; δίδαξόν με τίνες εἰσίν — «научи меня, каковы они»."
  24: "Иов. διὰ τί ἀπ᾽ ἐμοῦ κρύπτῃ — «зачем скрываешься от меня» (κρύπτω); ἥγησαι δέ με ὑπεναντίον σοι — «и счел меня противником твоим» (ἡγέομαι — «считать»; ὑπεναντίος — «противный»)."
  25: "Иов. ἦ ὡς φύλλον κινούμενον ὑπὸ ἀνέμου εὐλαβηθήσῃ — «разве листа, ветром движимого, убоишься» (εὐλαβέομαι — «бояться, остерегаться»); ὡς χόρτῳ φερομένῳ ὑπὸ πνεύματος ἀντίκεισαί μοι — «или как траве, ветром носимой, противоборствуешь мне» (ἀντίκειμαι)."
  26: "Иов. κατέγραψας κατ᾽ ἐμοῦ κακά — «ты написал против меня худое» (καταγράφω — «записывать»); περιέθηκας δέ μοι νεότητος ἁμαρτίας — «и возложил на меня грехи юности» (περιτίθημι)."
  27: "Иов. ἔθου μου τὸν πόδα ἐν κωλύματι — «поставил ногу мою в препятствие» (κώλυμα — «задержка, колодка»; слав. «в возбранение», Син. «в колоду»); ἐφύλαξας πάντα τὰ ἔργα — «сохранил все дела»; εἰς ῥίζας τῶν ποδῶν μου ἀφίκου — «до корней ног моих достиг»: тёмное место, передано буквально."
  28: "Иов. ὃ παλαιοῦται ἴσα ἀσκῷ — «который обветшает, как мех» (ἀσκός — «мех, бурдюк»); ὥσπερ ἱμάτιον σητόβρωτον — «как одежда, молью изъеденная» (σητόβρωτος — «изъеденный молью»). Слав. «якоже мех, или якоже риза молием изядена». Речь продолжается в гл. 14."
