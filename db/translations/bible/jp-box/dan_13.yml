verses:
  1: "バビロンに一人[ひとり]の男[おとこ]が住[す]んでいた。名[な]はヨアキムといった。"
  2: "彼[かれ]は妻[つま]を迎[むか]えた。名[な]はスサンナといい、ヒルキヤの娘[むすめ]で、非常[ひじょう]に美[うつく]しく、神[かみ]を畏[おそ]れていた。"
  3: "彼女[かのじょ]の両親[りょうしん]は正[ただ]しい人[ひと]たちで、娘[むすめ]をモーセの律法[りっぽう]に従[したが]って教[おし]えた。"
  4: "ヨアキムは非常[ひじょう]に富[と]んでいた。家[いえ]の近[ちか]くに庭[にわ]があり、ユダヤ人[じん]たちは彼[かれ]のもとへ集[あつ]まって来[き]た。彼[かれ]が誰[だれ]よりも尊敬[そんけい]されていたからである。"
  5: "その年[とし]、民[たみ]の中[なか]から二人[ふたり]の長老[ちょうろう]がさばき人[びと]に選[えら]ばれた。彼[かれ]らについて主[しゅ]は、不法[ふほう]がバビロンから出[で]た、しかもそれは民[たみ]を治[おさ]めているように見[み]える長老[ちょうろう]たち、すなわちさばき人[びと]たちから出[で]た、と言[い]われた。"
  6: "彼[かれ]らはしばしばヨアキムの家[いえ]に通[かよ]い、争[あらそ]い事[ごと]のある者[もの]たちは皆[みな]、彼[かれ]らのところへ来[き]た。"
  7: "民[たみ]が正午[しょうご]ごろに帰[かえ]ると、スサンナは夫[おっと]の庭[にわ]に入[はい]って散歩[さんぽ]した。"
  8: "二人[ふたり]の長老[ちょうろう]は毎日[まいにち]、彼女[かのじょ]が出入[でい]りするのを眺[なが]め、彼女[かのじょ]への欲情[よくじょう]に捕[と]らわれた。"
  9: "彼[かれ]らは心[こころ]を歪[ゆが]め、天[てん]を見[み]ないように、また正[ただ]しい裁[さば]きを思[おも]い起[おこ]さないようにと、目[め]をそらした。"
  10: "二人[ふたり]とも彼女[かのじょ]への欲情[よくじょう]に傷[きず]つけられていたが、互[たが]いに自分[じぶん]の苦[くる]しみを打[う]ち明[あ]けなかった。"
  11: "自分[じぶん]の欲望[よくぼう]を告白[こくはく]するのを恥[は]じていたからである。彼[かれ]らは彼女[かのじょ]と交[まじ]わりたいと願[ねが]っていた。"
  12: "彼[かれ]らは毎日[まいにち]、彼女[かのじょ]を見[み]ようと切[せつ]に待[ま]ち構[かま]えて、互[たが]いに言[い]った。"
  13: "「さあ、家[いえ]へ帰[かえ]ろう。昼食[ちゅうしょく]の時[とき]だ。」そして二人[ふたり]は外[そと]へ出[で]て、互[たが]いに別[わか]れた。"
  14: "そして引[ひ]き返[かえ]して同[おな]じ場所[ばしょ]に来[く]ると、互[たが]いにその理由[りゆう]を問[と]いただし、自分[じぶん]の欲望[よくぼう]を打[う]ち明[あ]け合[あ]った。そこで二人[ふたり]は一緒[いっしょ]に、彼女[かのじょ]を一人[ひとり]で見[み]つけられる時[とき]を定[さだ]めた。"
  15: "都合[つごう]のよい日[ひ]を待[ま]ち構[かま]えていたとき、スサンナは昨日[きのう]も一昨日[おととい]もそうだったように、二人[ふたり]の侍女[じじょ]だけを伴[ともな]って入[はい]って来[き]て、庭[にわ]で体[からだ]を洗[あら]いたいと思[おも]った。暑[あつ]かったからである。"
  16: "そこには、身[み]を隠[かく]して彼女[かのじょ]を待[ま]ち伏[ぶ]せしていた二人[ふたり]の長老[ちょうろう]のほか、誰[だれ]もいなかった。"
  17: "「油[あぶら]と石[せっ]けんを持[も]って来[き]て、庭[にわ]の戸[と]を閉[し]めてください。体[からだ]を洗[あら]いますから。」"
  18: "侍女[じじょ]たちは彼女[かのじょ]の言[い]ったとおりにして、庭[にわ]の戸[と]を閉[し]め、命[めい]じられた物[もの]を持[も]って来[く]るために裏口[うらぐち]から出[で]て行[い]った。長老[ちょうろう]たちが身[み]を隠[かく]していたので、彼[かれ]らを見[み]なかった。"
  19: "侍女[じじょ]たちが出[で]て行[い]くと、二人[ふたり]の長老[ちょうろう]は立[た]ち上[あ]がり、彼女[かのじょ]のもとへ走[はし]り寄[よ]って言[い]った。"
  20: "「見[み]てのとおり、庭[にわ]の戸[と]は閉[と]ざされ、誰[だれ]もわたしたちを見[み]ていない。わたしたちはあなたへの欲情[よくじょう]に駆[か]られている。だからわたしたちに応[おう]じ、わたしたちと交[まじ]わりなさい。"
  21: "そうでなければ、あなたに不利[ふり]な証言[しょうげん]をしよう。あなたと一緒[いっしょ]に若者[わかもの]がいた。だから侍女[じじょ]たちを帰[かえ]したのだ、と。」"
  22: "スサンナは嘆[なげ]いて言[い]った。「わたしはどちらからも追[お]い詰[つ]められている。これをすればわたしは死[し]ぬ。しなければあなたがたの手[て]から逃[のが]れられない。"
  23: "何[なに]もせずにあなたがたの手[て]に落[お]ちることを、わたしは選[えら]ぶ。神[かみ]の前[まえ]で罪[つみ]を犯[おか]すよりは。」"
  24: "スサンナは大[おお]きな声[こえ]を上[あ]げた。二人[ふたり]の長老[ちょうろう]も彼女[かのじょ]に向[む]かって大[おお]きな声[こえ]を上[あ]げた。"
  25: "一人[ひとり]が走[はし]って庭[にわ]の戸[と]を開[あ]けた。"
  26: "家[いえ]の者[もの]たちが庭[にわ]の叫[さけ]び声[ごえ]を聞[き]くと、彼女[かのじょ]に何[なに]が起[お]きたのか見[み]ようと、裏口[うらぐち]から飛[と]び出[だ]した。"
  27: "長老[ちょうろう]たちが自分[じぶん]の言葉[ことば]を語[かた]ると、彼女[かのじょ]の召使[めしつか]いたちはひどく恥[は]じた。スサンナについてそのようなことが語[かた]られたことは一度[いちど]もなかったからである。"
  28: "翌日[よくじつ]、民[たみ]が彼女[かのじょ]の夫[おっと]ヨアキムのもとへ集[あつ]まったとき、二人[ふたり]の長老[ちょうろう]も、スサンナを殺[ころ]そうという不法[ふほう]な企[たくら]みに満[み]ちてやって来[き]た。"
  29: "そして民[たみ]の前[まえ]で言[い]った。「ヒルキヤの娘[むすめ]、ヨアキムの妻[つま]であるスサンナを呼[よ]びにやれ。」そこで人[ひと]をやった。"
  30: "彼女[かのじょ]は、両親[りょうしん]、子[こ]どもたち、そしてすべての親族[しんぞく]とともに来[き]た。"
  31: "スサンナはまだとても若[わか]く、姿[すがた]も美[うつく]しかった。"
  32: "不法[ふほう]な者[もの]たちは彼女[かのじょ]の顔[かお]をあらわにさせた。彼女[かのじょ]は覆[おお]いをかけられていたからである。彼[かれ]らがその美[うつく]しさを思[おも]う存分[ぞんぶん]見[み]るためであった。"
  33: "彼女[かのじょ]のそばにいた者[もの]たちも、彼女[かのじょ]を知[し]るすべての者[もの]も泣[な]いた。"
  34: "二人[ふたり]の長老[ちょうろう]は民[たみ]の真[ま]ん中[なか]に立[た]って、彼女[かのじょ]の頭[あたま]に手[て]を置[お]いた。"
  35: "彼女[かのじょ]は泣[な]きながら天[てん]を見上[みあ]げた。その心[こころ]は主[しゅ]に信頼[しんらい]していたからである。"
  36: "二人[ふたり]の長老[ちょうろう]は言[い]った。「わたしたち二人[ふたり]が庭[にわ]を歩[ある]いていたとき、この女[おんな]が二人[ふたり]の侍女[じじょ]とともに入[はい]って来[き]て、庭[にわ]の戸[と]を閉[し]め、侍女[じじょ]たちを帰[かえ]しました。"
  37: "すると、そこに隠[かく]れていた若者[わかもの]が彼女[かのじょ]のところへ来[き]て、彼女[かのじょ]と寝[ね]たのです。"
  38: "わたしたちは庭[にわ]の隅[すみ]にいて、その不法[ふほう]を目撃[もくげき]したので、二人[ふたり]のもとへ走[はし]り寄[よ]りました。"
  39: "そして二人[ふたり]が交[まじ]わっているのを見[み]ましたが、あの男[おとこ]はわたしたちよりも力[ちから]が強[つよ]く、戸[と]を開[あ]けて跳[と]び出[で]したので、捕[つか]まえられませんでした。"
  40: "この女[おんな]を捕[つか]まえて、『その若者[わかもの]は誰[だれ]か』と尋問[じんもん]しましたが、話[はな]そうとしませんでした。このことをわたしたちは証言[しょうげん]します。」"
  41: "集[あつ]まった者[もの]たちは、二人[ふたり]を民[たみ]の長老[ちょうろう]、またさばき人[びと]として信[しん]じ、彼女[かのじょ]に死[し]刑[けい]の判決[はんけつ]を下[くだ]した。"
  42: "スサンナは大[おお]きな声[こえ]を上[あ]げて言[い]った。「永遠[えいえん]の神[かみ]、隠[かく]れたことを知[し]る方[かた]、すべてのことが起[お]こる前[まえ]から知[し]っておられる方。"
  43: "あなたは、二人[ふたり]がわたしに不利[ふり]な偽[いつわ]りの証言[しょうげん]をしたことをご存[ぞん]じです。見[み]てください。わたしは、この者[もの]たちがわたしに邪悪[じゃあく]に企[たくら]んだことを何[なに]一つ[ひとつ]行[おこな]わないまま、死[し]にます。」"
  44: "主[しゅ]は彼女[かのじょ]の声[こえ]を聞[き]かれた。"
  45: "彼女[かのじょ]が死[し]に引[ひ]かれて行[い]くとき、神[かみ]は聖霊[せいれい]によって、ダニエルという名[な]の若[わか]い少年[しょうねん]を奮[ふる]い立[た]たせた。"
  46: "彼[かれ]は大[おお]きな声[こえ]で叫[さけ]んだ。「わたしはこの女[おんな]の血[ち]について潔白[けっぱく]だ。」"
  47: "民[たみ]は皆[みな]彼[かれ]のほうを向[む]いて言[い]った。「それは何[なん]という言葉[ことば]か。あなたは今[いま]、何[なに]を言[い]ったのか。」"
  48: "彼[かれ]は彼[かれ]らの真[ま]ん中[なか]に立[た]って言[い]った。「イスラエルの子[こ]らよ、あなたがたはそんなにも愚[おろ]かなのか。調[しら]べもせず、真実[しんじつ]も知[し]らないまま、イスラエルの娘[むすめ]を裁[さば]いたのか。"
  49: "法廷[ほうてい]に戻[もど]りなさい。この者[もの]たちは彼女[かのじょ]に不利[ふり]な偽[いつわ]りの証言[しょうげん]をしたのだから。」"
  50: "民[たみ]は皆[みな]、急[いそ]いで戻[もど]った。長老[ちょうろう]たちは彼[かれ]に言[い]った。「こちらへ来[き]て、わたしたちの中[なか]に座[すわ]り、わたしたちに告[つ]げなさい。神[かみ]があなたに長老[ちょうろう]の務[つと]めをお与[あた]えになったのだから。」"
  51: "ダニエルは彼[かれ]らに言[い]った。「二人[ふたり]を遠[とお]く離[はな]しなさい。わたしが尋問[じんもん]する。」"
  52: "二人[ふたり]が互[たが]いに遠[とお]く離[はな]されると、彼[かれ]はその一人[ひとり]を呼[よ]んで言[い]った。「悪[わる]い日々[ひび]を重[かさ]ねて老[お]いた者[もの]よ。今[いま]、あなたが以前[いぜん]に犯[おか]した罪[つみ]が露[あら]わになった。"
  53: "あなたは不[ふ]正[せい]な裁[さば]きを行[おこな]い、無実[むじつ]の者[もの]を罪[つみ]に処[しょ]し、罪[つみ]ある者[もの]を許[ゆる]してきた。だが、神[かみ]は『無実[むじつ]の者[もの]と正[ただ]しい者[もの]を殺[ころ]すな』と言[い]われている。"
  54: "今[いま]、もしあなたがあの女[おんな]を見[み]たのなら言[い]いなさい。どの木[き]の下[した]で二人[ふたり]が語[かた]り合[あ]っているのを見[み]たのか。」彼[かれ]は言[い]った。「マスティックの木[き]の下[した]です。」"
  55: "ダニエルは言[い]った。「あなたは確[たし]かに自分[じぶん]の頭[あたま]に嘘[うそ]をついた。見[み]よ、神[かみ]の使[つか]いが神[かみ]から宣告[せんこく]を受[う]けて、あなたを真[ま]っ二[ふた]つに裂[さ]く。」"
  56: "彼[かれ]を帰[かえ]すと、ダニエルはもう一人[ひとり]を連[つ]れて来[こ]させて言[い]った。「カナン[の]血筋[ちすじ]であって、ユダの血筋[ちすじ]ではない。その美[うつく]しさがあなたを惑[まど]わせ、欲情[よくじょう]があなたの心[こころ]を歪[ゆが]めた。"
  57: "あなたがたはイスラエルの娘[むすめ]たちにそうしてきた。彼女[かのじょ]たちは恐[おそ]れながらあなたがたと暮[く]らしていた。しかしユダの娘[むすめ]はあなたがたの不法[ふほう]に耐[た]えなかった。"
  58: "今[いま]、わたしに言[い]いなさい。どの木[き]の下[した]で二人[ふたり]が語[かた]り合[あ]っているのを見[み]たのか。」彼[かれ]は言[い]った。「樫[かし]の木[き]の下[した]です。」"
  59: "ダニエルは彼[かれ]に言[い]った。「あなたも確[たし]かに自分[じぶん]の頭[あたま]に嘘[うそ]をついた。神[かみ]の使[つか]いが剣[つるぎ]を持[も]って、あなたがたを滅[ほろ]ぼすために、あなたを真[ま]っ二[ふた]つに裂[さ]こうと待[ま]っている。」"
  60: "集[あつ]まった者[もの]たちは皆[みな]、大[おお]きな声[こえ]を上[あ]げ、主[しゅ]に望[のぞ]みを置[お]く者[もの]を救[すく]う神[かみ]をほめたたえた。"
  61: "そして二人[ふたり]の長老[ちょうろう]に立[た]ち向[む]かった。ダニエルが彼[かれ]ら自身[じしん]の口[くち]によって、彼[かれ]らが偽[いつわ]りの証言[しょうげん]をしたことを暴[あば]いたからである。"
  62: "彼[かれ]らは、隣人[りんじん]に企[たくら]んだとおりのことを二人[ふたり]にした。モーセの律法[りっぽう]に従[したが]ってそうしたのである。こうして二人[ふたり]は殺[ころ]され、その日[ひ]、無実[むじつ]の血[ち]は救[すく]われた。"
  63: "ヒルキヤとその妻[つま]は、夫[おっと]ヨアキムやすべての親族[しんぞく]とともに、娘[むすめ]スサンナのことで神[かみ]をほめたたえた。彼女[かのじょ]に恥[は]ずべきことは何[なに]も見[み]つからなかったからである。"
  64: "ダニエルはその日[ひ]から後[のち]、民[たみ]の前[まえ]で偉大[いだい]な者[もの]となった。"

notes:
  1: "csl: «И бе муж живый в вавилоне, имя же ему иоаким»; «живый» — живущий. ru: «В Вавилоне жил муж, по имени Иоаким» — то же. В gr-lxx-byz глав 13–14 нет вовсе (в модуле 12 глав), поэтому перевод по csl."
  2: "«И поя жену» — взял жену; «добра зело и боящися Бога» — очень красива и богобоязненна. Хелкия — ヒルキヤ по корпусу (4 Цар 22)."
  3: "«родителя же ея праведна» — двойственное число (оба родителя); «научиста» — научили; «по закону моисеову» — モーセの律法. ru: «научили дочь свою закону Моисееву»."
  4: "«вертоград» — сад, передан как 庭[にわ]; «славнее всех» — почетнейший, 誰よりも尊敬されていた. ru: «почетнейший из всех»."
  5: "«избрана быста два старца… в судии» — двойственное; «мняхуся управляти людий» — казались управляющими народом. Слова Господа переданы косвенно (яко), кавычек нет. Старцы — 長老[ちょうろう] (как πρεσβύτεροι в корпусе)."
  6: "«прящиися» — тяжущиеся, имеющие спорные дела; «прихождаста часто» — двойственное. ru: «приходили все, имевшие спорные дела»."
  7: "«о полудни» — около полудня; «хождаше» — гуляла; «во вертограде мужа своего» — в саду своего мужа."
  8: "«смотряста» — двойственное; «быста в похотении ея» — пришли в похоть к ней. Похоть — 欲情[よくじょう], как в корпусе (Рим 1:27)."
  9: "«развратиста ум свой» — извратили ум; «уклоноста очи» — уклонили глаза; «судеб праведных» — праведных судов, 正しい裁き."
  10: "«уязвлена похотию на ню» — уязвлены похотью к ней; «не возвестиста дру другу болезни своея» — не открыли друг другу своей боли."
  11: "«стыдястася исповедати вожделение свое»; «хотяста быти с нею» — эвфемизм «быть с ней», передан 交[まじ]わる; ru: «хотели совокупиться с нею»."
  12: "«наблюста жадающа по вся дни зрети ю» — прилежно сторожили, желая видеть её; вводка к речи, кавычка открывается в 13."
  13: "«пойдем убо в дом, яко обеда час есть»; «изшедша разыдостася» — выйдя, разошлись. ru: «пойдем домой, потому что час обеда»."
  14: "«во едино (место)» — скобки редакционные csl, не переносились; «истязавша друг от друга вины» — допытывались друг у друга причины; «обще устависта время» — вместе назначили время."
  15: "«дне угоднаго» — удобного дня; «якоже вчера и третияго дне»; «со двема точию отроковицами» — только с двумя служанками; «зной бяше» — было жарко. Отроковицы — 侍女[じじょ]."
  16: "«кроме двою старцев сокровенных и стрегущих ея» — кроме двух скрытых старцев, стерегущих её. ru: «которые спрятались и сторожили её»."
  17: "«масло и мыло» — масло и мыло (石けん); «двери вертоградныя затворите» — заприте садовые двери; «да измыюся» — чтобы мне помыться."
  18: "«сотвористе» — двойственное; «задними дверьми» — задними (боковыми) дверями, 裏口[うらぐち]; «принести повеленное има» — принести повеленное им."
  19: "«востаста… текоста… реста» — двойственное; вводка, речь старцев — 20–21."
  20: "«двери оградныя» — садовые двери; «а в похотении твоем есмы» — мы в похоти к тебе; «соизволи нам, и буди с нами» — эвфемизм, передан 交[まじ]わりなさい."
  21: "«аще же ни» — если же нет; «послушествуем на тя» — будем свидетельствовать против тебя; «юноша» — 若者[わかもの]; «отпустила еси отроковиц»."
  22: "«тесно ми отвсюду» — тесно мне отовсюду; «смерть ми есть»; «не избегну от рук ваших». ru: «тесно мне отовсюду»."
  23: "«изволение ми есть» — я предпочитаю; «не сотворившей» — дат. пад. ж. р. (мне, не сделавшей); «согешити» — форма/опечатка вместо «согрешити». ru: «лучше для меня не сделать этого»."
  24: "«возопи гласом великим»; «возописта же и оба старца противу ей» — закричали и оба старца против неё (заглушая). Крик без слов — кавычек нет."
  25: "«тек един, отверзе двери вертоградныя» — один побежал и открыл садовые двери."
  26: "«кличь» — крик; «домашнии» — домашние; «вскочиша задними дверьми» — выскочили задними дверями; «видети случившееся ей» — увидеть случившееся с ней."
  27: "«поведаста старцы словеса своя» — рассказали старцы свои слова; «устыдешася раби ея зело» — сильно пристыжены слуги её; «николиже речеся таково слово» — никогда не говорилось такого слова."
  28: "«наутрие» — на другой день; «полна беззаконнаго помышления» — двойственное, полные беззаконного умысла; «еже уморити ю» — чтобы умертвить её."
  29: "«послите по сосанну дщерь хелкиеву, яже есть жена иоакимля» — пошлите за Сусанной, дочерью Хелкия, женой Иоакима; «послаша» — послали."
  30: "«прииде та и родителя ея, и чада ея и вси ужики ея» — пришла она, и родители, и дети, и все родственники. «Ужики» — 親族[しんぞく]."
  31: "«млада зело и добра образом» — очень молода и красива видом. ru: «очень нежна и красива лицем» — «нежна» иное (МТ), в текст не внесено."
  32: "«повелеста открыти ю» — двойственное; «бяше бо покровена» — была покрыта (покрывалом); «яко да насытятся доброты ея» — чтобы насытиться её красотой."
  33: "«плакаху же сущии при ней и вси знающии ю» — плакали бывшие при ней и все знающие её."
  34: "«возложиста руце на главу ея» — возложили руки на голову её: судебный жест, ср. Лев 24:14. Двойственное число."
  35: "«воззре на небо» — взглянула на небо; «бяше сердце ея уповая на Господа» — сердце её уповало на Господа."
  36: "Начало показания обоих старцев (36–40 — одна речь). «ходящым нам обоим» — когда мы оба ходили; «вниде сия» — вошла эта; «отпусти отроковицы»."
  37: "«юноша, иже бяше сокровен» — юноша, который был скрыт; «возлеже с нею» — лёг с нею (эвфемизм)."
  38: "«во угле вертограда» — в углу сада; «видевше беззаконие» — увидев беззаконие; «текохом на ня» — побежали на них."
  39: "«смешающихся» — совокупляющихся; «онаго убо не могохом яти» — того не могли схватить; «паче нас можаше» — был сильнее нас; «изскочи» — выскочил."
  40: "«сию же емше, вопрошахом, кто бе юноша?» — эту схватив, спрашивали: кто был юноша. Вложенная речь — 『…』; «о сем послушествуем» — об этом свидетельствуем."
  41: "«сонм» — собрание; «аки старцем людским и судиям» — как старейшинам народным и судьям; «осудиша ю на умертвие» — приговорили её к смерти."
  42: "Начало молитвы (42–43), в 「…」. «Боже вечиый» — в csl-ru опечатка, = вечный; «сокровенных ведателю» — ведающий сокровенное; «сведый вся прежде бытия их» — знающий всё прежде бытия их."
  43: "«веси» — знаешь; «лжу послушествоваста на мя» — солгали свидетельством против меня; «не сотворши ничесоже» — не сделав ничего; «слукавноваста» — умыслили зло. ru: «злостно выдумали»."
  44: "«послуша Господь гласа ея» — услышал Господь голос её. Короткий переходный стих, ru так же."
  45: "«ведомей ей на погубление» — когда её вели на погибель; «воздвиже Бог духом стым отрока юна»: csl даёт творительный падеж — «Духом Святым воздвиг юного отрока»; так и переведено (聖霊によって). ru/Феодотион понимают иначе: «возбудил святой дух юноши» (винительный); вариант отмечен. О «помазании» здесь речи нет: это Дух, не χρίω."
  46: "«чист аз от крове сея» — идиома: «я чист от крови её», т. е. не виновен в её смерти. Передано 潔白[けっぱく]."
  47: "«что слово сие, еже ты глаголеши?» — что это за слово, которое ты говоришь. ru: «что это за слово, которое ты сказал?»"
  48: "«сице ли юродиви, сынове израилевы» — так ли вы неразумны, сыны Израилевы; «не испытавше, ни истины разумевше» — не исследовав и не уразумев истины; «осудисте дщерь израилеву»."
  49: "«возвратитеся на судище» — возвратитесь в суд (место суда); «лжу бо сии послушествоваста на ню» — ибо эти ложно засвидетельствовали против неё."
  50: "«с потщанием» — поспешно; «гряди, сяди посреде нас» — иди, сядь посреди нас; «яко тебе даде Бог старейшинство» — ибо Бог дал тебе старейшинство (первенство). Передано 長老の務め."
  51: "«разведите я друг от друга далече» — разделите их друг от друга далеко; «вопрошу их» — буду допрашивать их."
  52: "«обетшалый злыми денми» — состарившийся в злых днях; «приспеша греси твои, яже творил еси прежде» — постигли (открылись) грехи твои, которые ты делал прежде."
  53: "«судя суды неправедны» — судя неправедные суды; «неповинныя осуждая, прощая повинныя» — осуждая невинных и прощая виновных; цитата Исх 23:7 в 『…』."
  54: "«под киим древом» — под каким деревом; «беседующих к себе» — беседующих друг с другом; «под терном» — под терном. Греч. σχῖνος (мастика); в 55 игра слов σχῖνος/σχίσει («рассечёт»), в японском не передаётся — отсюда マスティックの木."
  55: "«право солгал еси на твою главу» — воистину солгал на свою голову (т. е. на свою погибель); «приим ответ от Бога» — приняв решение от Бога; «расторгнет тя полма» — рассечёт тебя пополам."
  56: "«племя ханаане, а не иудино» — семя Ханаана, а не Иуды (не отродье Иуды); «доброта прельсти тя» — красота прельстила тебя; «похотение разврати сердце твое»."
  57: "«сице творили есте дщерем израилевым» — так вы делали дочерям Израиля; «оныя же бояшяся живяху с вами» — они, боясь, жили с вами; «не претерпе беззакония вашего» — не потерпела беззакония вашего."
  58: "«под чресминою» — под чресминой. Греч. πρῖνος (каменный дуб); в 59 игра слов πρῖνος/πρίσει («перепилит»), в японском не передаётся — отсюда 樫[かし]の木."
  59: "«право солгал еси и ты на свою главу»; «ждет бо ангел Божий мечем разсещи тя полма» — ждёт ангел Божий с мечом рассечь тебя пополам; «яко да потребит вы» — чтобы истребить вас."
  60: "«возопи весь сонм гласом великим» — вскричало всё собрание громким голосом; «благослови Бога спасающаго надеющыяся на него» — благословило Бога, спасающего надеющихся на Него."
  61: "«восташа на оба старца» — восстали на обоих старцев; «яко обличи их даниил от уст их» — ибо обличил их Даниил их же устами; «лжу послушествовавших» — ложно свидетельствовавших."
  62: "«сотвориша има якоже слукавноваста ближнему» — сделали с ними так, как они умыслили против ближнего (закон возмездия); «по закону моисеову»; «спасеся кровь неповинна» — спасена кровь невинная."
  63: "«похвалиша Бога о дщери своей» — прославили Бога за дочь свою; «со ужиками всеми» — со всеми родственниками; «не обретеся в ней студная вещь» — не нашлось в ней постыдного дела."
  64: "«бысть велик пред людьми от дне того и потом» — стал велик перед людьми с того дня и потом. Заключительная формула главы."
