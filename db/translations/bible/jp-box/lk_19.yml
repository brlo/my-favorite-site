verses:
  1: "イエスはエリコに入[はい]り、町[まち]の中[なか]を通[とお]って行[い]かれた。"
  2: "そこに、ザアカイという名[な]の男[おとこ]がいた。彼[かれ]は徴税人[ちょうぜいにん]の頭[かしら]で、富[とみ]を持[も]っていた。"
  3: "イエスがどんな人[ひと]なのかを見[み]ようとしたが、群衆[ぐんしゅう]に遮[さえぎ]られて見[み]ることができなかった。背[せ]が低[ひく]かったからである。"
  4: "そこで、先[さき]に走[はし]って行[い]き、イエスを見[み]ようと、いちじくの木[き]に上[のぼ]った。イエスがそのそばを通[とお]られることになっていたからである。"
  5: "イエスはその場所[ばしょ]に来[き]て、見上[みあ]げて彼[かれ]に言[い]われた。「<j>ザアカイ、急[いそ]いで下[お]りて来[き]なさい。今日[きょう]、わたしはあなたの家[いえ]に泊[と]まらなければならない。</j>」"
  6: "彼[かれ]は急[いそ]いで下[お]りて来[き]て、喜[よろこ]んでイエスを迎[むか]え入[い]れた。"
  7: "人々[ひとびと]はみな、これを見[み]てつぶやき始[はじ]めた。「あの男[おとこ]は罪人[ざいにん]の家[いえ]に泊[と]まるために入[はい]って行[い]った。」"
  8: "ザアカイは立[た]って、主[しゅ]に言[い]った。「主[しゅ]よ、ご覧[らん]ください。わたしは持[も]ち物[もの]の半[なか]ばを貧[まず]しい人[ひと]たちに施[ほどこ]します。また、だれかから不当[ふとう]に取[と]り立[た]てたものがあれば、四倍[よんばい]にして返[かえ]します。」"
  9: "イエスは彼[かれ]に言[い]われた。「<j>今日[きょう]、救[すく]いがこの家[いえ]に来[き]た。この人[ひと]もアブラハムの子[こ]だからである。</j>"
  10: "<j>人[ひと]の子[こ]は、失[うしな]われた者[もの]を尋[たず]ねて救[すく]うために来[き]たのだ。</j>」"
  11: "彼[かれ]らがこれらのことを聞[き]いていると、イエスはさらに一[ひと]つのたとえを語[かた]られた。エルサレムに近[ちか]づいておられ、人々[ひとびと]は、神[かみ]の国[くに]がすぐにでも現[あらわ]れると思[おも]っていたからである。"
  12: "「<j>ある高貴[こうき]な家柄[いえがら]の人[ひと]が、王[おう]の位[くらい]を受[う]けて帰[かえ]って来[く]るために、遠[とお]い国[くに]へ旅[たび]立[だ]った。</j>"
  13: "<j>そして、自分[じぶん]の僕[しもべ]を十人[じゅうにん]呼[よ]んで、十[じゅう]ミナ⟨銀[ぎん]の目方[めかた]の単位[たんい]。一[ひと]ミナは労働者[ろうどうしゃ]のおよそ百日分[ひゃくにちぶん]の賃金[ちんぎん]にあたる。⟩を渡[わた]し、言[い]った。『わたしが帰[かえ]って来[く]るまで、これで商[あきな]いをしなさい』。</j>"
  14: "<j>しかし、この国[くに]の市民[しみん]たちは彼[かれ]を憎[にく]み、後[あと]から使者[ししゃ]を送[おく]って言[い]った。『わたしたちは、この人[ひと]に王[おう]として治[おさ]められたくない』。</j>"
  15: "<j>彼[かれ]が王位[おうい]を受[う]けて帰[かえ]って来[く]ると、銀[ぎん]を渡[わた]しておいた僕[しもべ]たちを呼[よ]び出[だ]して、それぞれ何[なに]をもうけたかを確[たし]かめようとした。</j>"
  16: "<j>第一[だいいち]の者[もの]が来[き]て言[い]った。『ご主人[しゅじん]さま、あなたの一[ひと]ミナが十[じゅう]ミナもうけました』。</j>"
  17: "<j>主人[しゅじん]は言[い]った。『よくやった、良[よ]い僕[しもべ]よ。わずかなものによく忠実[ちゅうじつ]だったので、十[じゅう]の町[まち]を治[おさ]める権[けん]を与[あた]えよう』。</j>"
  18: "<j>第二[だいに]の者[もの]が来[き]て言[い]った。『ご主人[しゅじん]さま、あなたの一[ひと]ミナが五[いつ]つもうけました』。</j>"
  19: "<j>これにも言[い]った。『あなたも五[いつ]つの町[まち]を治[おさ]めなさい』。</j>"
  20: "<j>もう一人[ひとり]が来[き]て言[い]った。『ご主人[しゅじん]さま、ご覧[らん]ください。あなたの一[ひと]ミナです。わたしはこれを布[ぬの]に包[つつ]んでしまっておきました。</j>"
  21: "<j>あなたが厳[きび]しい方[かた]で、置[お]かなかったものをも取[と]り、蒔[ま]かなかったものをも刈[か]り取[と]られるのが怖[こわ]かったからです』。</j>"
  22: "<j>主人[しゅじん]は言[い]った。『悪[わる]い僕[しもべ]よ、おまえの口[くち]から言[い]った言葉[ことば]で、おまえを裁[さば]こう。おまえは、わたしが厳[きび]しい人間[にんげん]で、置[お]かなかったものをも取[と]り、蒔[ま]かなかったものをも刈[か]り取[と]ることを知[し]っていたのか。</j>"
  23: "<j>それなら、なぜわたしの銀[ぎん]を両替商[りょうがえしょう]に預[あず]けておかなかったのか。そうすれば、わたしは帰[かえ]って来[き]たとき、利子[りし]をつけてそれを受[う]け取[と]れたものを』。</j>"
  24: "<j>そして、そばに立[た]っている者[もの]たちに言[い]った。『この者[もの]からミナを取[と]り上[あ]げて、十[じゅう]ミナを持[も]っている者[もの]に渡[わた]しなさい』。</j>"
  25: "〔<j>すると、彼[かれ]らは言[い]った。『ご主人[しゅじん]さま、あの者[もの]はもう十[じゅう]ミナ持[も]っています』。</j>〕"
  26: "<j>わたしはあなたがたに言[い]う。持[も]つ者[もの]にはさらに与[あた]えられ、持[も]たない者[もの]からは、持[も]っているものさえも取[と]り上[あ]げられる。</j>"
  27: "<j>『ただし、わたしに王[おう]として治[おさ]められるのを望[のぞ]まなかったあの敵[てき]どもを、ここへ連[つ]れて来[き]て、わたしの前[まえ]で殺[ころ]してしまえ』。</j>」"
  28: "こう言[い]ってから、イエスは先[さき]に立[た]って、エルサレムへ上[のぼ]って行[い]かれた。"
  29: "ベツファゲとベタニアに近[ちか]づき、オリーブ山[やま]と呼[よ]ばれる山[やま]のそばまで来[き]たとき、イエスは弟子[でし]を二人[ふたり]遣[つか]わして、"
  30: "言[い]われた。「<j>向[む]こうの村[むら]へ行[い]きなさい。入[はい]って行[い]くと、まだ誰[だれ]も乗[の]ったことのない子[こ]ろばが、つないであるのに出会[であ]う。それを解[と]いて、ここへ連[つ]れて来[き]なさい。</j>"
  31: "<j>もし誰[だれ]かが『なぜ解[と]くのか』と尋[たず]ねたら、『主[しゅ]がそれを必要[ひつよう]としておられるからだ』と言[い]いなさい。</j>」"
  32: "遣[つか]わされた二人[ふたり]は行[い]って、イエスの言[い]われたとおりに見[み]つけた。"
  33: "子[こ]ろばを解[と]いていると、その持[も]ち主[ぬし]たちが言[い]った。「なぜ、子[こ]ろばを解[と]くのか。」"
  34: "二人[ふたり]は言[い]った。「主[しゅ]がそれを必要[ひつよう]としておられるのです。」"
  35: "二人[ふたり]は子[こ]ろばをイエスのところへ連[つ]れて来[き]て、自分[じぶん]たちの上着[うわぎ]を子[こ]ろばの上[うえ]にかけ、イエスをそれに乗[の]せた。"
  36: "イエスが進[すす]んで行[い]かれると、人々[ひとびと]は自分[じぶん]たちの上着[うわぎ]を道[みち]に敷[し]いた。"
  37: "イエスがすでにオリーブ山[やま]の下[くだ]り道[みち]に近[ちか]づかれたとき、弟子[でし]たちの大[おお]きな群[む]れが、自分[じぶん]たちの見[み]たすべての奇跡[きせき]のゆえに、喜[よろこ]んで大[おお]きな声[こえ]で神[かみ]を賛美[さんび]し始[はじ]めた。"
  38: "「主[しゅ]の名[な]によって来[こ]られる王[おう]に、祝福[しゅくふく]があるように。天[てん]には平和[へいわ]、いと高[たか]き所[ところ]に栄光[えいこう]があるように。」"
  39: "群衆[ぐんしゅう]の中[なか]からファリサイ派[は]の人々[ひとびと]が、イエスに言[い]った。「先生[せんせい]、あなたの弟子[でし]たちをお黙[だま]らせください。」"
  40: "イエスはお答[こた]えになった。「<j>あなたがたに言[い]う。もしこの者[もの]たちが黙[だま]るなら、石[いし]が叫[さけ]ぶだろう。</j>」"
  41: "イエスは近[ちか]づいて、町[まち]をご覧[らん]になると、その町[まち]のためにお泣[な]きになった。"
  42: "言[い]われた。「<j>おお、あなたも、この〔あなたの〕日[ひ]に、〔あなたの〕平和[へいわ]に属[ぞく]することを知[し]っていたなら。しかし、今[いま]はそれがあなたの目[め]から隠[かく]されている。</j>"
  43: "<j>あなたの上[うえ]に日[ひ]が来[く]る。敵[てき]があなたの周[まわ]りに陣[じん]を敷[し]き、あなたを囲[かこ]み、四方[しほう]から追[お]い詰[つ]める。</j>"
  44: "<j>あなたも、あなたの中[なか]にいる子[こ]どもたちも、地[ち]に平[た]らげてしまい、あなたの中[なか]に石[いし]を石[いし]の上[うえ]に残[のこ]さない。あなたが、訪[おとず]れの時[とき]を知[し]らなかったからである。</j>」"
  45: "イエスは神殿[しんでん]に入[はい]り、売[う]る者[もの]たちと〔買[か]う者[もの]たち〕を追[お]い出[だ]し始[はじ]められた。"
  46: "彼[かれ]らに言[い]われた。「<j>『わたしの家[いえ]は祈[いの]りの家[いえ]となる』と書[か]いてある。ところが、あなたがたはそれを盗賊[とうぞく]の巣[す]にしてしまった。</j>」"
  47: "イエスは毎日[まいにち]、神殿[しんでん]で教[おし]えておられた。祭司長[さいしちょう]たち、律法学者[りっぽうがくしゃ]たち、また民[たみ]のおもだった者[もの]たちは、イエスを殺[ころ]そうとねらっていた。"
  48: "しかし、どうすることもできなかった。民[たみ]がみな、イエスの話[はなし]に聞[き]き入[い]っていたからである。"

notes:
  2: "ἀρχιτελώνης — 徴税人の頭; 彼は富める者でもあった (καὶ αὐτὸς πλούσιος)."
  4: "συκομορέα — сикомор (фикус); передано いちじくの木, чтобы не вводить редкое イチジクグワ. В 17:6 συκάμινος — 桑."
  5: "δεῖ με μεῖναι — «надлежит Мне остаться»; 泊まらなければならない."
  7: "καταλῦσαι — «остановиться, приютиться»; 泊まるために入って行った, без сглаживания."
  8: "ἡμίσεια τῶν ὑπαρχόντων — 持ち物の半ば; τετραπλοῦν — 四倍 (не «вдвое»), как требует Закон для присвоенного (Исх 22:1)."
  9: "υἱὸς Ἀβραάμ — アブラハムの子, без сглаживания в «иудей» или «честный человек». Σήμερον σωτηρία τῷ οἴκῳ τούτῳ — 今日、救いがこの家に来た; «дом» — и сам Закхей, и его семья."
  11: "παραχρῆμα — «сразу»; すぐにも. Притча о минах (11–27) сказана из-за близости Иерусалима."
  12: "εὐγενής — «знатного рода»; 高貴な家柄. λαβεῖν ἑαυτῷ βασιλείαν — 王の位を受けて."
  13: "μνᾶ — ミナ; сноска при первом упоминании в корпусе: мера серебра, около ста дневных плат. δέκα δοῦλοι — десять рабов (у Мф 25:14 — трое и таланты, притча иная)."
  14: "πολῖται — 市民; «враждебные граждане» сохранены, без сглаживания."
  16: "ἡ μνᾶ σου δέκα προσηργάσατο μνᾶς — «мина твоя принесла десять мин»; 十ミナもうけました."
  20: "σουδάριον — 布 (платок); 布に包んで."
  22: "ἐκ τοῦ στόματός σου κρίνω σε — «твоими устами сужу тебя»; おまえの口から言った言葉で裁こう."
  23: "τράπεζα — стол менялы; 両替商 (не 銀行, чтобы не вносить анахронизм)."
  25: "Стих отсутствует в критическом тексте (Byz/TR); церковное чтение — весь стих в 〔…〕, включая слова стоявших рядом."
  26: "Речение Христа к слушателям, вне 『』 (как 18:14); 19:27 продолжает речь царя."
  28: "ἐπορεύετο ἔμπροσθεν — «шёл впереди»; 先に立って."
  29: "Βηθφαγή — ベツファゲ, Βηθανία — ベタニア, Ὄρος τῶν Ἐλαιῶν — オリーブ山 (как Мф 21:1 и Мк 11:1; в задании «オリーブ山», но в корпусе принято オリーブ山)."
  30: "πῶλος — 子ろば (молодой осёл); ἐφ᾽ ὃν οὐδεὶς πώποτε ἀνθρώπων ἐκάθισεν — まだ誰も乗ったことのない."
  31: "Ὁ κύριος αὐτοῦ χρείαν ἔχει — «Господь имеет нужду в нём»; 主がそれを必要としておられる. В Мк 11:3 — «主がお入り用です»."
  37: "περὶ πασῶν ὧν εἶδον δυνάμεων — «за все чудеса, которые видели»; 見たすべての奇跡のゆえに."
  38: "Слова учеников и толпы — не красные. У Луки нет «Осанна»; 祝福があるように. Порядок: мир на небе, слава в вышних."
  42: "Апозиопеза: εἰ ἔγνως… — «о, если бы и ты узнал…»; оборвано на 知っていたなら, как в греческом. τὰ πρὸς εἰρήνην — 平和に属するもの. Церковь добавляет σου к «дню» и «миру» (jp-joc 此の爾の日に、爾の平安に) — отмечено 〔あなたの〕."
  43: "χάραξ — осадный вал; 陣を敷く. συνέξουσίν σε πάντοθεν — 四方から追い詰める."
  44: "ἐδαφιοῦσίν σε καὶ τὰ τέκνα σου ἐν σοί — あなたも、あなたの中にいる子どもたちも、地に平らげて; ἐπισκοπή — «посещение» (свыше), 訪れの時, без сглаживания в «помощь»."
  45: "В критическом тексте только «продающих»; церковное чтение добавляет «и покупающих» (jp-joc 貿易する者) — 売る者たちと〔買う者たち〕."
  46: "Цитата Ис 56:7 и Иер 7:11; 『…』 внутри красного, как в Мк 11:17."
