verses:
  1: "イスラエルの王[おう]、エラの子[こ]ホシェアの第三[だいさん]年[ねん]に、アハズの子[こ]ヒゼキヤがユダの王[おう]となった。"
  2: "彼[かれ]は二十[にじゅう]五[ご]歳[さい]で王[おう]となり、エルサレムで二十九[にじゅうきゅう]年[ねん]治[おさ]めた。母[はは]の名[な]はアブといい、ゼカリヤの娘[むすめ]であった。"
  3: "彼[かれ]は、父[ちち]ダビデが行[おこな]ったすべてのとおりに、主[しゅ]の目[め]に正[ただ]しいことを行[おこな]った。"
  4: "彼[かれ]は高[たか]い所[ところ]を除[のぞ]き、すべての石柱[せきちゅう]を打[う]ち砕[くだ]き、木立[こだち]を切[き]り倒[たお]し、モーセが造[つく]った青銅[せいどう]の蛇[へび]を砕[くだ]いた。イスラエルの子[こ]らがそのころまで、その蛇[へび]に香[こう]をたき続[つづ]けていたからである。それはネエスタンと呼[よ]ばれていた。"
  5: "彼[かれ]はイスラエルの神[かみ]である主[しゅ]に望[のぞ]みを置[お]いた。彼[かれ]の後[あと]にも前[まえ]にも、ユダの王[おう]たちのうちに、彼[かれ]に似[に]た者[もの]はなかった。"
  6: "彼[かれ]は主[しゅ]に寄[よ]り添[そ]い、主[しゅ]から離[はな]れず、主[しゅ]がモーセに命[めい]じた戒[いまし]めを守[まも]った。"
  7: "主[しゅ]は彼[かれ]とともにおられ、彼[かれ]は行[おこな]うすべてのことを悟[さと]っていた。彼[かれ]はアッシリアの王[おう]に背[そむ]き、これに仕[つか]えなかった。"
  8: "彼[かれ]はペリシテ人[じん]をガザに至[いた]るまで、またその境[さかい]に至[いた]るまで、見張[みは]り櫓[やぐら]から堅固[けんご]な町[まち]に至[いた]るまで打[う]った。"
  9: "ヒゼキヤ王[おう]の第四[だいし]年[ねん]、すなわちイスラエルの王[おう]、エラの子[こ]ホシェアの第七[だいしち]年[ねん]に、アッシリアの王[おう]サルマナサルがサマリアに攻[せ]め上[のぼ]って、これを包囲[ほうい]した。"
  10: "三年[さんねん]の終[お]わりにこれを取[と]り、すなわちヒゼキヤの第六[だいろく]年[ねん]、イスラエルの王[おう]ホシェアの第九[だいきゅう]年[ねん]に、サマリアは取[と]られた。"
  11: "アッシリアの王[おう]はサマリアの人[ひと]々[びと]をアッシリアへ移[うつ]し、アラエとアボル、ゴザン川[がわ]のほとり、またメディアの山[やま]々[やま]に置[お]いた。"
  12: "彼[かれ]らが自分[じぶん]たちの神[かみ]である主[しゅ]の声[こえ]を聞[き]かず、主[しゅ]の契約[けいやく]に背[そむ]き、主[しゅ]のしもべモーセが命[めい]じたすべてのことを、聞[き]きもせず行[おこな]いもしなかったからである。"
  13: "ヒゼキヤ王[おう]の第十四[だいじゅうし]年[ねん]に、アッシリアの王[おう]センナケリブがユダの堅固[けんご]な町[まち]々[まち]に攻[せ]め上[のぼ]って、これを取[と]った。"
  14: "ユダの王[おう]ヒゼキヤは、ラキシュにいるアッシリアの王[おう]に使[つか]いを遣[つか]わして言[い]った。「わたしは罪[つみ]を犯[おか]した。わたしから手[て]を引[ひ]いてくれ。あなたがわたしに負[お]わせるものは、何[なん]でも負[お]う。」アッシリアの王[おう]はユダの王[おう]ヒゼキヤに、銀[ぎん]三百[さんびゃく]タラントと金[きん]三十[さんじゅう]タラントを負[お]わせた。"
  15: "ヒゼキヤは、主[しゅ]の家[いえ]と王[おう]の家[いえ]の宝[たから]の中[なか]に見[み]つかった銀[ぎん]をすべて渡[わた]した。"
  16: "そのとき、ヒゼキヤは主[しゅ]の神殿[しんでん]の扉[とびら]と、自分[じぶん]が金[きん]をかぶせたその支柱[しちゅう]を切[き]り取[と]り、アッシリアの王[おう]に与[あた]えた。"
  17: "アッシリアの王[おう]は、タルタン、ラフィス、ラブサケをラキシュからヒゼキヤ王[おう]のもとへ、大[おお]きな軍勢[ぐんぜい]とともにエルサレムへ遣[つか]わした。彼[かれ]らは上[のぼ]ってエルサレムに来[き]て、上[うえ]の池[いけ]の水道[すいどう]のそば、すなわち布[ぬの]さらしの野[の]へ行[ゆ]く道[みち]にある所[ところ]に立[た]った。"
  18: "彼[かれ]らがヒゼキヤに呼[よ]びかけると、家令[かれい]エリアキム、書記[しょき]ソムナス、記録官[きろくかん]ヨアスが出[で]て来[き]た。エリアキムはヘルキヤの子[こ]、ヨアスはアサフの子[こ]であった。"
  19: "ラブサケは彼[かれ]らに言[い]った。「ヒゼキヤにこう言[い]いなさい。大[おお]きな王[おう]、アッシリアの王[おう]がこう言[い]う。あなたが頼[たよ]りにしているこの信頼[しんらい]は何[なん]なのか。"
  20: "あなたは『唇[くちびる]の言葉[ことば]だけが、戦[たたか]いのための策[さく]と力[ちから]だ』と言[い]った。しかし今[いま]、あなたは何[なに]を頼[たよ]りにして、わたしに背[そむ]いたのか。"
  21: "今[いま]、あなたが頼[たよ]りにしているのは、この折[お]れた葦[あし]の杖[つえ]、すなわちエジプトだ。人[ひと]がこれに寄[よ]りかかれば、それはその手[て]に突[つ]き刺[さ]さり、手[て]を刺[さ]し貫[つらぬ]く。エジプトの王[おう]ファラオは、彼[かれ]に頼[たよ]るすべての者[もの]にとって、そのようなものだ。"
  22: "また、あなたがたがわたしに『わたしたちは主[しゅ]である神[かみ]に頼[たよ]っている』と言[い]うのなら、その主[しゅ]とは、ヒゼキヤが高[たか]い所[ところ]と祭壇[さいだん]を取[と]り除[りのぞ]き、ユダとエルサレムに、この祭壇[さいだん]の前[まえ]で、エルサレムで礼拝[れいはい]せよと言[い]った、その方[かた]ではないのか。"
  23: "さあ、わたしの主[しゅ]であるアッシリアの王[おう]と取[と]り決[き]めをしなさい。わたしはあなたに二千[にせん]の馬[うま]を与[あた]える。あなたはその上[うえ]に乗[の]る者[もの]たちをそろえることができるか。"
  24: "あなたはどうして、わたしの主[しゅ]の最[もっと]も小[ちい]さいしもべのひとりの太守[たいしゅ]の顔[かお]をそむけられようか。それなのに、あなたはエジプトに、戦車[せんしゃ]と騎兵[きへい]を頼[たよ]りにしている。"
  25: "そのうえ、わたしが主[しゅ]の許[もと]なしにこの場所[ばしょ]へ上[のぼ]って来[き]て、これを滅[ほろ]ぼそうとしたのだろうか。主[しゅ]がわたしに『この地[ち]に上[のぼ]って、これを滅[ほろ]ぼせ』と言[い]われたのだ。」"
  26: "エリアキム、ソムナス、ヨアスはラブサケに言[い]った。「どうか、しもべたちにはアラム語[ご]で話[はな]してほしい。わたしたちには分[わ]かるから。わたしたちにユダの言葉[ことば]で話[はな]さないでほしい。城壁[じょうへき]の上[うえ]にいる民[たみ]が聞[き]いている。」"
  27: "ラブサケは彼[かれ]らに言[い]った。「わたしの主[しゅ]は、あなたの主[しゅ]とあなたにだけ、これらの言葉[ことば]を語[かた]らせるためにわたしを遣[つか]わしたのだろうか。城壁[じょうへき]の上[うえ]に座[すわ]っている者[もの]たちにも、あなたがたと一緒[いっしょ]に自分[じぶん]の糞[ふん]を食[た]べ、自分[じぶん]の尿[にょう]を飲[の]むためではないか。」"
  28: "ラブサケは立[た]ち、ユダの言葉[ことば]で大[おお]きな声[こえ]をあげて語[かた]り、言[い]った。「大[おお]きな王[おう]、アッシリアの王[おう]の言葉[ことば]を聞[き]け。"
  29: "王[おう]がこう言[い]っている。『ヒゼキヤにだまされてはならない。彼[かれ]はあなたがたをわたしの手[て]から救[すく]い出[だ]すことはできない。"
  30: "また、ヒゼキヤが、主[しゅ]は必[かなら]ずわたしたちを救[すく]い出[だ]し、この町[まち]はアッシリアの王[おう]の手[て]に渡[わた]されることはない、と言[い]って、あなたがたに主[しゅ]を頼[たよ]らせてはならない。"
  31: "ヒゼキヤの言[い]うことを聞[き]いてはならない。アッシリアの王[おう]がこう言[い]っている。わたしと和[わ]を結[むす]んで、わたしのところへ出[で]て来[き]なさい。そうすれば、おのおの自分[じぶん]のぶどうの木[き]のものを飲[の]み、自分[じぶん]のいちじくの木[き]のものを食[た]べ、自分[じぶん]の井戸[いど]の水[みず]を飲[の]むことができる。"
  32: "やがてわたしが来[き]て、あなたがたを、あなたがたの地[ち]のような地[ち]、すなわち麦[むぎ]とぶどう酒[しゅ]とパンとぶどう畑[ばたけ]の地[ち]、オリーブの油[あぶら]と蜂蜜[はちみつ]の地[ち]へ連[つ]れて行[い]く。あなたがたは生[い]きながらえ、死[し]ぬことはない。ヒゼキヤの言[い]うことを聞[き]いてはならない。彼[かれ]は、主[しゅ]がわたしたちを救[すく]い出[だ]す、と言[い]ってあなたがたを欺[あざむ]いている。"
  33: "国[くに]々[ぐに]の神[かみ]々[がみ]は、それぞれ自分[じぶん]の地[ち]をアッシリアの王[おう]の手[て]から救[すく]い出[だ]したことがあるか。"
  34: "ハマトの神[かみ]、アルパドの神[かみ]はどこにいるのか。セパルワイムの神[かみ]、アナとアワの神[かみ]はどこにいるのか。サマリアをわたしの手[て]から救[すく]い出[だ]した者[もの]がいたか。"
  35: "この国[くに]々[ぐに]のすべての神[かみ]々[がみ]のうち、だれがその地[ち]をわたしの手[て]から救[すく]い出[だ]したというのか。主[しゅ]がどうしてエルサレムをわたしの手[て]から救[すく]い出[だ]せるというのか。』」"
  36: "しかるに民[たみ]は黙[だま]り込[こ]み、彼[かれ]にひと言[こと]も答[こた]えなかった。王[おう]が彼[かれ]らに『彼[かれ]に答[こた]えてはならない』と命[めい]じていたからである。"
  37: "家令[かれい]エリアキム、書記[しょき]ソムナス、記録官[きろくかん]ヨアスは、衣[ころも]を裂[さ]いてヒゼキヤのもとへ来[き]、ラブサケの言葉[ことば]を彼[かれ]に告[つ]げた。"

notes:
  1: "ἐν ἔτει τρίτῳ τῷ Ωσηε υἱῷ Ηλα βασιλεῖ Ισραηλ — в третий год Осии, сына Илы, царя Израильского; ἐβασίλευσεν Εζεκιας υἱὸς Αχαζ — воцарился Езекия, сын Ахаза."
  2: "υἱὸς εἴκοσι καὶ πέντε ἐτῶν — сын двадцати пяти лет; εἴκοσι καὶ ἐννέα ἔτη ἐβασίλευσεν — двадцать девять лет царствовал; ὄνομα τῇ μητρὶ αὐτοῦ Αβου θυγάτηρ Ζαχαριου — имя матери его Аву, дочь Захарии (Αβου; csl «авуфа»; ru «Ави»; アブ)."
  3: "ἐποίησεν τὸ εὐθὲς ἐν ὀφθαλμοῖς κυρίου — делал правое в очах Господних; κατὰ πάντα, ὅσα ἐποίησεν Δαυιδ — по всему, что сделал Давид."
  4: "ἐξῆρεν τὰ ὑψηλά — убрал высоты (ἐξαίρω); συνέτριψεν τὰς στήλας — сокрушил столпы; ἐξωλέθρευσεν τὰ ἄλση — истребил рощи (ἐξολεθρεύω); csl «сокруши вся капища» — «сокрушил все капища» (вместо «столпы», как в гр.); τὸν ὄφιν τὸν χαλκοῦν — змея медного; ἦσαν ... θυμιῶντες αὐτῷ — кадили ему; ἐκάλεσεν αὐτὸν Νεεσθαν — назвал его Неестан (נְחֻשְׁתָּן, «медный»; csl «неестан»)."
  5: "ἐν κυρίῳ θεῷ Ισραηλ ἤλπισεν — на Господа Бога Израилева уповал (ἐλπίζω); οὐκ ἐγενήθη ὅμοιος αὐτῷ — не было подобного ему; ἐν τοῖς γενομένοις ἔμπροσθεν αὐτοῦ — среди бывших прежде него."
  6: "ἐκολλήθη τῷ κυρίῳ — прилепился (κολλάω) к Господу; οὐκ ἀπέστη ὄπισθεν αὐτοῦ — не отступил от Него; ἐφύλαξεν τὰς ἐντολὰς αὐτοῦ, ὅσας ἐνετείλατο Μωυσῇ — сохранил заповеди Его, какие заповедал Моисею."
  7: "ἦν κύριος μετ᾿ αὐτοῦ — был Господь с ним; ἐν πᾶσιν, οἷς ἐποίει, συνῆκεν — во всём, что делал, преуспевал (συνίημι — «понимать, быть разумным»; csl «смысляше»); ἠθέτησεν ἐν τῷ βασιλεῖ Ἀσσυρίων — отложился от царя Ассирийского (ἀθετέω); οὐκ ἐδούλευσεν αὐτῷ — не служил ему."
  8: "ἐπάταξεν τοὺς ἀλλοφύλους — поразил иноплеменников (ἀλλόφυλοι — филистимляне); ἕως Γάζης καὶ ἕως ὁρίου αὐτῆς — до Газы и до предела её; ἀπὸ πύργου φυλασσόντων ἕως πόλεως ὀχυρᾶς — от башни сторожей до города укреплённого."
  9: "ἐν τῷ ἔτει τῷ τετάρτῳ βασιλεῖ Εζεκια — в четвёртый год царя Езекии; αὐτὸς ἐνιαυτὸς ὁ ἕβδομος τῷ Ωσηε — тот же год седьмой Осии (в гр. в квадратных скобках — пояснение LXX); ἀνέβη Σαλαμανασσαρ ... ἐπολιόρχει ἐπ᾽ αὐτήν — поднялся Салманассар и осаждал её."
  10: "κατελάβετο αὐτὴν ἀπὸ τέλους τριῶν ἐτῶν — овладел ею по окончании трёх лет (ἀπὸ τέλους — «от конца»); ἐν ἔτει ἕκτῳ τῷ Εζεκια — в шестой год Езекии; αὐτὸς ἐνιαυτὸς ἔνατος τῷ Ωσηε — тот же год девятый Осии; συνελήμφθη Σαμάρεια — взята была Самария."
  11: "ἀπῴκισεν ... τὴν Σαμάρειαν εἰς Ἀσσυρίους — переселил Самарию к ассириянам; ἔθηκεν αὐτοὺς ἐν Αλαε καὶ ἐν Αβωρ ποταμῷ Γωζαν καὶ Ορη Μήδων — поставил их в Алае и в Аворе, реке Гозан, и в горах Мидийских (ср. 17:6; здесь ποταμῷ в ед. ч.)."
  12: "ἀνθ᾿ ὧν ὅτι — «за то, что»; οὐκ ἤκουσαν τῆς φωνῆς κυρίου — не послушали гласа Господа; παρέβησαν τὴν διαθήκην — преступили завет; πάντα ὅσα ἐνετείλατο Μωϋσῆς ὁ δοῦλος κυρίου — всё, что заповедал Моисей, раб Господень; οὐκ ἤκουσαν καὶ οὐκ ἐποίησαν — не послушали и не сделали."
  13: "τῷ τεσσαρεσκαιδεκάτῳ ἔτει — в четырнадцатый год; ἀνέβη Σενναχηριμ — поднялся Сеннахирим (Σενναχηριμ, センナケリブ; csl «сеннахирим»); ἐπὶ τὰς πόλεις Ιουδα τὰς ὀχυράς — на города Иуды укреплённые; συνέλαβεν αὐτὰς — взял их."
  14: "Ἡμάρτηκα — я согрешил (перфект); ἀποστράφητι ἀπ᾿ ἐμοῦ — отступи от меня; ὃ ἐὰν ἐπιθῇς ἐπ᾿ ἐμέ, βαστάσω — что ни возложишь на меня, понесу (βαστάζω); τριακόσια τάλαντα ἀργυρίου καὶ τριάκοντα τάλαντα χρυσίου — триста талантов серебра и тридцать талантов золота."
  15: "ἔδωκεν ... πᾶν τὸ ἀργύριον τὸ εὑρεθὲν ἐν οἴκῳ κυρίου — отдал всё серебро, найденное в доме Господнем; ἐν θησαυροῖς οἴκου τοῦ βασιλέως — в сокровищницах дома царя."
  16: "συνέκοψεν τὰς θύρας ναοῦ κυρίου — отсёк двери храма Господня (ναός — 神殿); τὰ ἐστηριγμένα — «утверждения» (στηρίζω), т. е. укрепления, столбы; ἃ ἐχρύσωσεν — которые он позолотил (χρυσόω); ἔδωκεν αὐτὰ βασιλεῖ Ἀσσυρίων — отдал их царю Ассирийскому."
  17: "τὸν Θαρθαν καὶ τὸν Ραφις καὶ τὸν Ραψακην — Тартана, Рафиса и Рабсака (Θαρθαν — タルタン; Ραφις — ラフィス, у ru «Рабсарис»; Ραψακης — ラブサケ); ἐν δυνάμει βαρείᾳ — с силою тяжкою; ἐν τῷ ὑδραγωγῷ τῆς κολυμβήθρας τῆς ἄνω — у водопровода верхней купальни (ὑδραγωγός, κολυμβήθρα); ἐν τῇ ὁδῷ τοῦ ἀγροῦ τοῦ γναφέως — на дороге поля валяльщика (γναφεύς — «белильщик»; 布さらし)."
  18: "ἐβόησαν πρὸς Εζεκιαν — воззвали к Езекии; Ελιακιμ υἱὸς Χελκιου ὁ οἰκονόμος — Елиаким, сын Хелкии, домоправитель; Σομνας ὁ γραμματεύς — Сомнас, писец; Ιωας υἱὸς Ασαφ ὁ ἀναμιμνῄσκων — Иоас, сын Асафа, «напоминающий» (т. е. дееписатель; csl «воспоминатель»)."
  19: "Τάδε λέγει ὁ βασιλεὺς ὁ μέγας — так говорит царь великий; Τίς ἡ πεποίθησις αὕτη, ἣν πέποιθας — какое это упование, на которое ты уповал (πείθω, перфект)."
  20: "εἶπας — ты сказал; Πλὴν λόγοι χειλέων — «только слова уст»; βουλὴ καὶ δύναμις εἰς πόλεμον — совет и сила для войны; τίνι πεποιθὼς ἠθέτησας ἐν ἐμοί — на кого понадеявшись, ты отложился от меня. Слова, которые Рабсак приписывает Езекии, — в 『…』."
  21: "ῥάβδον καλαμίνην τεθλασμένην — трость камышовую надломленную (κάλαμος, θλάω); ὃς ἂν στηριχθῇ ... εἰσελεύσεται εἰς τὴν χεῖρα αὐτοῦ καὶ τρήσει αὐτήν — кто опрётся на неё, войдёт ему в руку и проколет её (τιτράω); οὕτως Φαραω ... πᾶσιν τοῖς πεποιθόσιν ἐπ᾽ αὐτόν — таков фараон для всех уповающих на него."
  22: "Ἐπὶ κύριον θεὸν πεποίθαμεν — на Господа Бога мы уповали; οὐχὶ αὐτὸς οὗτος, οὗ ἀπέστησεν Εζεκιας τὰ ὑψηλὰ αὐτοῦ — не Он ли тот, чьи высоты убрал Езекия; Ἐνώπιον τοῦ θυσιαστηρίου τούτου προσκυνήσετε — пред жертвенником этим поклонитесь. Слова народа — в 『…』."
  23: "μίχθητε δὴ τῷ κυρίῳ μου — «смешайся с господином моим» (μίγνυμι), т. е. вступи в соглашение, померяйся силами; csl «соединитеся»; δισχιλίους ἵππους — две тысячи коней; ἐπιβάτας ἐπ᾿ αὐτούς — всадников на них."
  24: "ἀποστρέψεις τὸ πρόσωπον τοπάρχου ἑνός — повернёшь (обратишь в бегство) лицо одного топарха (τοπάρχης — областеначальник; csl «топарх»); τῶν δούλων τοῦ κυρίου μου τῶν ἐλαχίστων — из рабов господина моего малейших; ἤλπισας ... ἐπ᾿ Αἴγυπτον εἰς ἅρματα καὶ ἱππεῖς — понадеялся на Египет ради колесниц и всадников."
  25: "μὴ ἄνευ κυρίου ἀνέβημεν — разве без Господа мы поднялись; τοῦ διαφθεῖραι αὐτόν — чтобы погубить его (διαφθείρω); Ἀνάβηθι ἐπὶ τὴν γῆν ταύτην καὶ διάφθειρον αὐτήν — взойди на землю эту и погуби её."
  26: "Λάλησον ... Συριστί — говори по-сирийски (арамейски); ὅτι ἀκούομεν ἡμεῖς — ибо мы слышим; οὐ λαλήσεις μεθ᾿ ἡμῶν Ιουδαιστί — не будешь говорить с нами по-иудейски (еврейски); ἵνα τί λαλεῖς ἐν τοῖς ὠσὶν τοῦ λαοῦ — зачем говоришь в уши народа; τοῦ ἐπὶ τοῦ τείχους — который на стене."
  27: "Μὴ ἐπὶ τὸν κύριόν σου καὶ πρὸς σὲ ἀπέστειλέν με — разве к господину твоему и к тебе послал меня; οὐχὶ ἐπὶ τοὺς ἄνδρας τοὺς καθημένους ἐπὶ τοῦ τείχους — не к мужам ли, сидящим на стене; τοῦ φαγεῖν τὴν κόπρον αὐτῶν καὶ πιεῖν τὸ οὖρον αὐτῶν — чтобы есть помёт (κόπρος) свой и пить мочу (οὖρον) свою."
  28: "ἔστη ... ἐβόησεν φωνῇ μεγάλῃ Ιουδαιστί — встал и воззвал громким голосом по-иудейски; Ἀκούσατε τοὺς λόγους τοῦ μεγάλου βασιλέως — слушайте слова царя великого."
  29: "ἐπαιρέτω ὑμᾶς Εζεκιας λόγοις — пусть не поднимает (ἐπαίρω) вас Езекия словами; οὐ μὴ δύνηται ... ἐξελέσθαι ἐκ χειρός μου — не сможет избавить вас из руки моей (ἐξαιρέω). С этого стиха — слова ассирийского царя в 『…』."
  30: "ἐπελπιζέτω — пусть не обнадёживает (ἐπελπίζω); Ἐξαιρούμενος ἐξελεῖται ἡμᾶς κύριος — «избавляя, избавит нас Господь» (усилительный оборот); οὐ μὴ παραδοθῇ ἡ πόλις αὕτη — не будет предан город этот."
  31: "Ποιήσατε μετ᾿ ἐμοῦ εὐλογίαν — «сотворите со мною благословение» (εὐλογία — формула покорности и мира, евр. בְּרָכָה); ἐξέλθατε πρός με — выйдите ко мне; πίεται ἀνὴρ τὴν ἄμπελον αὐτοῦ — «будет пить каждый виноградник свой»; φάγεται ... τὴν συκῆν αὐτοῦ — будет есть смоковницу свою; ὕδωρ τοῦ λάκκου — воду из ямы, колодца (λάκκος)."
  32: "ἕως ἔλθω καὶ λάβω ὑμᾶς εἰς γῆν ὡς γῆ ὑμῶν — доколе не приду и не возьму вас в землю, как земля ваша; γῆ σίτου καὶ οἴνου καὶ ἄρτου καὶ ἀμπελώνων — земля пшеницы, вина, хлеба и виноградников; ἐλαίας ἐλαίου καὶ μέλιτος — маслины, елея и мёда; ζήσετε καὶ οὐ μὴ ἀποθάνητε — будете жить и не умрёте; ἀπατᾷ ὑμᾶς — обманывает вас (ἀπατάω); Κύριος ῥύσεται ἡμᾶς — Господь избавит нас."
  33: "μὴ ῥυόμενοι ἐρρύσαντο — «избавляя, избавили ли» (усилительный оборот); οἱ θεοὶ τῶν ἐθνῶν — боги народов; ἕκαστος τὴν ἑαυτοῦ χώραν — каждый свою страну (χώρα)."
  34: "ποῦ ἐστιν ὁ θεὸς Αιμαθ καὶ Αρφαδ — где бог Емафа и Арпада (Αιμαθ — ハマト; Αρφαδ — ארפד, アルパド); ποῦ ἐστιν ὁ θεὸς Σεπφαρουαιν — где бог Сепарваима; ἐξείλαντο Σαμάρειαν — избавили ли Самарию. Csl добавляет «ана и ава» — «Ана и Авва» (города, ср. 17:24); в гр. только бог Сепарваима. Добавление внесено в текст."
  35: "τίς ἐν πᾶσιν τοῖς θεοῖς τῶν γαιῶν — кто из всех богов земель; οἳ ἐξείλαντο τὰς γᾶς αὐτῶν — которые избавили земли свои; ὅτι ἐξελεῖται κύριος τὴν Ιερουσαλημ — что Господь избавит Иерусалим."
  36: "ἐκώφευσαν — умолкли (κωφεύω — «молчать, глухнуть»); οὐκ ἀπεκρίθησαν αὐτῷ λόγον — не ответили ему слова; ἐντολὴ τοῦ βασιλέως λέγων — повеление царя, говорящее; Οὐκ ἀποκριθήσεσθε αὐτῷ — не отвечайте ему. Csl «заповеда им царь» добавляет «им» («повелел им царь»); внесено в текст."
  37: "εἰσῆλθεν ... πρὸς Εζεκιαν — вошёл к Езекии; διερρηχότες τὰ ἱμάτια — разодрав одежды (διαρρήγνυμι); ἀνήγγειλαν αὐτῷ τοὺς λόγους Ραψακου — возвестили ему слова Рабсака."
