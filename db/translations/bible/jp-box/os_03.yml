# jp-box, Осия, глава 3. Черновик для приёмки.
#
# Нумерация — по славяно-синодальной (решение автора): главы 1–2 и 11–12
# переразбиты относительно гр. модуля (слав. 1:10–11 = прежние 2:1–2;
# слав. 11:12 = прежний 12:1). Текст — с Септуагинты, слав. контроль.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# --- прежние заметки (нумерация по гр.) ---
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по gr-lxx-byz (= jp-ni); в этой главе совпадает со славяно-синодальной.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: 1 повеление снова полюбить жену-прелюбодейку, как Бог любит Израиля;
# 2 покупка её за пятнадцать серебра, хомер ячменя и мевел вина; 3 «многие дни
# оставайся у меня»; 4 Израиль многие дни без царя, жертвы, священства и явлений;
# 5 обращение, взыскание Господа и Давида, страх пред благом в последние дни.
# Голоса: 1 — формула «И сказал Господь мне» + 「…」 (закрывается в 1); 2–3 —
# повествование, слова пророка к женщине в 「…」 (3); 4–5 — слово Господа в 「…」,
# без новой формулы (объяснение символа).
# 3:2: меры — греч. γομορ (хомер) и νεβελ (мех, сосуд вина); в ru/МТ «полхомера
# ячменя», в тексте — греч. чтение, отмечено.
# 3:4: «δήλων» — «явлений» (Урим, знаки откровения); в евр. «ефод и терафим».
#
tr_code: jp-box
book: os
chapter: 3
draft: true

verses:
  1: "主[しゅ]はわたしに言[い]われた。「また行[い]って、悪[わる]を愛[あい]し、姦淫[かんいん]する女[おんな]を愛[あい]せよ。イスラエルの子[こ]らを神[かみ]が愛[あい]されるように。彼らはほかの神[かみ]たちに目[め]を向[む]け、干[ほ]しぶどうの菓子[かし]を愛[あい]している」。"
  2: "わたしは彼女[かのじょ]を銀[ぎん]十五[じゅうご]と、大麦[おおむぎ]一[ひと]ホメルと、ぶどう酒[しゅ]一[ひと]瓶[びん]で買[か]い取[と]った。"
  3: "わたしは彼女[かのじょ]に言[い]った。「あなたは長[なが]い間[あいだ]、わたしのもとに留[とど]まり、淫行[いんこう]をしてはならない。ほかの男[おとこ]のものになってはならない。わたしもまた、あなたに対してそうする」。"
  4: "「イスラエルの子[こ]らは長[なが]い間[あいだ]、王[おう]もなく、君[きみ]もなく、いけにえもなく、祭壇[さいだん]もなく、祭司[さいし]の務[つと]めもなく、託宣[たくせん]もなく座[すわ]っている。"
  5: "その後[あと]、イスラエルの子[こ]らは帰[かえ]って来[き]て、彼らの神[かみ]である主[しゅ]と、ダビデという王[おう]を求[もと]める。終[おわ]りの日[ひ]々[び]に、彼らは主[しゅ]とその恵[めぐ]みに驚[おどろ]き畏[おそ]れる」。"

notes:
  1: "Ἔτι πορεύθητι καὶ ἀγάπησον γυναῖκα ἀγαπῶσαν πονηρὰ καὶ μοιχαλίν — «ещё иди и возлюби жену, любящую зло и прелюбодейную» (слав. «возлюби жену любящую зло и любодейцу»); καθὼς ἀγαπᾷ ὁ θεὸς τοὺς υἱοὺς Ισραηλ — «как любит Бог сынов Израилевых»; ἀποβλέπουσιν ἐπὶ θεοὺς ἀλλοτρίους — «взирают на богов чужих»; φιλοῦσιν πέμματα μετὰ σταφίδων — «любят печения с изюмом» (πέμμα — печенье; слав. «варения с коринками»)."
  2: "ἐμισθωσάμην ἐμαυτῷ — «нанял (приобрёл) её себе» (μισθόω — нанимать; слав. «наях себе оную»); πεντεκαίδεκα ἀργυρίου — «за пятнадцать серебра» (五, 十五); γομορ κριθῶν — «хомер ячменя» (ホメル; слав. «гомором ячменя»); νεβελ οἴνου — «невел вина» (νεβελ — мех, сосуд для вина; слав. «невелем вина»); в ru/МТ «полхомера ячменя» — иное чтение, в текст не внесено."
  3: "Ἡμέρας πολλὰς καθίσῃ ἐπ᾿ ἐμοί — «многие дни сиди при мне» (κάθημαι — сидеть, оставаться); οὐ μὴ πορνεύσῃς — «не блуди»; οὐδὲ μὴ γένῃ ἀνδρὶ ἑτέρῳ — «и не будь за иным мужем»; καὶ ἐγὼ ἐπὶ σοί — «и Я при тебе» (слав. «и аз у тебе»), т.е. так же буду относиться к тебе."
  4: "ἡμέρας πολλὰς καθίσονται οἱ υἱοὶ Ισραηλ — «многие дни будут сидеть сыны Израилевы»; οὐκ ὄντος βασιλέως οὐδὲ ἄρχοντος — «не имея царя и князя»; οὐδὲ θυσίας οὐδὲ θυσιαστηρίου — «ни жертвы, ни жертвенника»; οὐδὲ ἱερατείας — «ни священства»; οὐδὲ δήλων — «ни явлений»: δῆλοι — Урим, знаки откровения (слав. «ниже явлением»), передано 託宣[たくせん]; в евр. «ефод и терафим»."
  5: "ἐπιστρέψουσιν οἱ υἱοὶ Ισραηλ — «обратятся сыны Израилевы»; ἐπιζητήσουσιν κύριον τὸν θεὸν αὐτῶν — «взыщут Господа Бога своего»; καὶ Δαυιδ τὸν βασιλέα αὐτῶν — «и Давида, царя своего»; ἐκστήσονται ἐπὶ τῷ κυρίῳ καὶ ἐπὶ τοῖς ἀγαθοῖς αὐτοῦ — «ужаснутся (изумятся) о Господе и о благах Его» (ἐξίστημι; слав. «почудятся»); ἐπ᾿ ἐσχάτων τῶν ἡμερῶν — «в последние дни»."
