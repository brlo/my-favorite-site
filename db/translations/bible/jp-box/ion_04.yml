# jp-box, Иона, глава 4. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 4 (совпадает, 11 стихов).
# Язык — современный 常体 (просьба к Богу — ください, как в Пс и Дан 9);
# порядок членов и клаузы — по греческому. 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1–3 огорчение Ионы и молитва: «знал, что Ты милостив»,
# «возьми душу мою»; 4 вопрос Господа; 5 Иона вне города, куща, ожидание;
# 6 горлянка (ヒョウタン) и радость; 7–8 червь, знойный ветер, «лучше мне умереть»;
# 9–10 вопрос о горлянке и ответ Ионы; 11 «Мне ли не пожалеть Ниневии».
# Голоса: 1, 5–8 — повествование; молитва Ионы 2–3 — 「…」; 4 — слово Господа
# в 「…」; 8 — слова Ионы в 「…」; 9 — два 「…» подряд (вопрос Бога и ответ Ионы,
# не вложенные); 10–11 — слово Господа в 「…」 до конца главы.
# κολόκυνθα передано ヒョウタン (тыква-горлянка, так в 口語訳; в 新共同訳 とうごま
# с еврейского) — см. notes 6.
#
tr_code: jp-box
book: ion
chapter: 4
draft: true

verses:
  1: "ヨナはそれを非常[ひじょう]に悲[かな]しみ、怒[いか]った。"
  2: "彼は主[しゅ]に祈[いの]って言[い]った。「ああ、主[しゅ]よ。わたしがまだ自分[じぶん]の国[くに]にいたとき、このことを言[い]ったのではありませんか。それでわたしは先[さき]に、タルシシュへ逃[に]げようとしたのです。あなたがあわれみ深[ぶか]く、情[なさ]け深[ぶか]く、怒[いか]りを遅[おそ]くし、多[おお]くをあわれみ、災[わざわ]いを思[おも]い直[なお]される神[かみ]であることを、わたしは知[し]っていました。"
  3: "それゆえ今[いま]、主[しゅ]よ、わたしの魂[たましい]を取[と]ってください。生[い]きるより死[し]ぬほうが良[よ]いのです。」"
  4: "主[しゅ]は言[い]われた。「あなたはそれをひどく悲[かな]しんでいるのか。」"
  5: "ヨナは都[みやこ]から出[で]て、都[みやこ]の真[ま]ん前[まえ]に座[すわ]り、そこに自分[じぶん]のために小屋[こや]を造[つく]って、その陰[かげ]に座[すわ]り、都[みやこ]に何[なに]が起[お]こるかを見[み]ようとした。"
  6: "主[しゅ]である神[かみ]は、一本[いっぽん]のヒョウタンに命[めい]じてヨナの頭[あたま]の上[うえ]に生[は]えさせ、彼の災[わざわ]いから守[まも]るために、その頭[あたま]を陰[かげ]で覆[おお]わせた。ヨナはそのヒョウタンのゆえに大[おお]いに喜[よろこ]んだ。"
  7: "しかし、神[かみ]は翌日[よくじつ]の朝[あさ]、一匹[いっぴき]の虫[むし]に命[めい]じてヒョウタンをかみ切らせた。ヒョウタンは枯[か]れてしまった。"
  8: "日[ひ]が上[のぼ]ると、神[かみ]は焼[や]けつくような熱風[ねっぷう]に命[めい]じ、日[ひ]がヨナの頭[あたま]を照[て]りつけたので、彼は気[き]を失[うしな]い、自分[じぶん]の命[いのち]を否[いな]んで言[い]った。「生[い]きるより死[し]ぬほうがましだ。」"
  9: "神[かみ]はヨナに言[い]われた。「あなたはヒョウタンのことで、そこまで怒[いか]っているのか。」ヨナは言[い]った。「わたしは死[し]ぬほどに怒[いか]っている。」"
  10: "主[しゅ]は言[い]われた。「あなたは、自分[じぶん]が労[ろう]もせず、育[そだ]てもしなかったヒョウタンを惜[お]しむ。それは一夜[いちや]のうちに生[は]え、一夜[いちや]のうちに滅[ほろ]びたものではないか。"
  11: "わたしは、十二万[じゅうにまん]を超[こ]える人[ひと]々[びと]が住[す]み、右[みぎ]も左[ひだり]も知[し]らない大[おお]きな都[みやこ]ニネベを、また多[おお]くの家畜[かちく]を、惜[お]しまないでいられようか。」"

notes:
  1: "ἐλυπήθη Ιωνας λύπην μεγάλην — «опечалился Иона печалью великою» (слав. «опечалися иона печалию великою»); συνεχύθη — «смутился» (συγχέω — приходить в смятение, быть потрясённым)."
  2: "Ὦ κύριε — «о Господи»; οὐχ οὗτοι οἱ λόγοι μου ἔτι ὄντος μου ἐν τῇ γῇ μου — «не эти ли слова мои, когда я ещё был в земле моей»; προέφθασα τοῦ φυγεῖν — «я поспешил (успел прежде) бежать» (προφθάνω — упредить); ἐλεήμων καὶ οἰκτίρμων, μακρόθυμος καὶ πολυέλεος — «милостив и щедр, долготерпелив и многомилостив» (слав. «милостив ты еси и щедр, долготерпелив и многомилостив»); μετανοῶν ἐπὶ ταῖς κακίαις — «отменяющий решение о злобах». Слав. в скобках добавляет «(человеческих)» — редакционная скобка, в текст не внесена."
  3: "δέσποτα κύριε — «Владыко Господи» (δεσπότης — владыка, господин); λαβὲ τὴν ψυχήν μου ἀπ᾽ ἐμοῦ — «возьми душу мою от меня»; καλὸν τὸ ἀποθανεῖν με ἢ ζῆν με — «лучше мне умереть, нежели жить»."
  4: "Εἰ σφόδρα λελύπησαι σύ — «неужели сильно огорчился ты?» (εἰ вводит вопрос; λυπέομαι — огорчаться, скорбеть; слав. «аще зело опечалился еси ты?»)."
  5: "ἐξῆλθεν Ιωνας ἐκ τῆς πόλεως — «вышел Иона из города»; ἐκάθισεν ἀπέναντι τῆς πόλεως — «сел напротив города» (слав. «седе прямо града»; в ru «с восточной стороны» — масоретское уточнение, в LXX его нет, в текст не внесено); ἐποίησεν ἑαυτῷ ἐκεῖ σκηνήν — «сделал себе там кущу»; ἐν σκιᾷ — «в тени»; ἕως οὗ ἀπίδῃ τί ἔσται τῇ πόλει — «доколе не увидит, что будет городу»."
  6: "προσέταξεν κύριος ὁ θεὸς κολοκύνθῃ — «повелел Господь Бог горлянке»: κολόκυνθα — тыква-горлянка, так LXX передаёт евр. קִיקָיוֹן (клещевина, とうごま); в тексте ヒョウタン (как в 口語訳; в 新共同訳 — とうごま, с масоретского). ἀνέβη ὑπὲρ κεφαλῆς τοῦ Ιωνα — «взошла над головою Ионы»; τοῦ σκιάζειν αὐτῷ ἀπὸ τῶν κακῶν αὐτοῦ — «чтобы осенять его от зол его» (слав. «еже осенити его от злых его»); ἐχάρη Ιωνας … χαρὰν μεγάλην — «обрадовался Иона радостью великою»."
  7: "σκώληκι ἑωθινῇ τῇ ἐπαύριον — «червю раннему на следующий день» (ἑωθινός — утренний; слав. «червию раннему во утрие»); ἐπάταξεν τὴν κολόκυνθαν — «поразил горлянку»; ἀπεξηράνθη — «засохла»."
  8: "πνεύματι καύσωνος συγκαίοντι — «ветру знойному, палящему» (καύσων — знойный ветер; συγκαίω — сожигать); ἐπάταξεν ὁ ἥλιος ἐπὶ τὴν κεφαλὴν Ιωνα — «поразило солнце голову Ионы»; ὠλιγοψύχησεν — «изнемог, пал духом» (ὀλιγοψυχέω; слав. «малодушствоваше»); ἀπελέγετο τὴν ψυχὴν αὐτοῦ — «отказывался от души своей» (ἀπολέγομαι — отрекаться; слав. «отрицашеся души своея»); Καλόν μοι ἀποθανεῖν με ἢ ζῆν — «лучше мне умереть, нежели жить»."
  9: "Εἰ σφόδρα λελύπησαι σὺ ἐπὶ τῇ κολοκύνθῃ — «неужели сильно огорчился ты из-за горлянки?»; Σφόδρα λελύπημαι ἐγὼ ἕως θανάτου — «сильно огорчился я даже до смерти». В слав. перед ответом стоит «(иона)» в скобках — редакционная вставка, не перенесена. Два «…» подряд: вопрос Бога и ответ Ионы."
  10: "Σὺ ἐφείσω ὑπὲρ τῆς κολοκύνθης — «ты пожалел горлянку» (φείδομαι — щадить, жалеть); ὑπὲρ ἧς οὐκ ἐκακοπάθησας ἐπ᾽ αὐτὴν — «над которой ты не потрудился» (κακοπαθέω — трудиться до усталости); οὐκ ἐξέθρεψας αὐτήν — «и не возрастил её»; ἣ ἐγενήθη ὑπὸ νύκτα καὶ ὑπὸ νύκτα ἀπώλετο — «которая в ночь явилась и в ночь погибла»."
  11: "ἐγὼ δὲ οὐ φείσομαι ὑπὲρ Νινευη τῆς πόλεως τῆς μεγάλης — «а Я не пожалею Ниневии, города великого?»; πλείους ἢ δώδεκα μυριάδες ἀνθρώπων — «более двенадцати мириад человек» (μυριάς — 10 000, т. е. более 120 000; слав. «множайшии неже дванадесять тем человек»); οἵτινες οὐκ ἔγνωσαν δεξιὰν αὐτῶν ἢ ἀριστερὰν αὐτῶν — «которые не познали правой своей и левой своей»; καὶ κτήνη πολλά — «и скот многочисленный»."
