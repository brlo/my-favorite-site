verses:
  1: "「なぜ、主[しゅ]から時[とき]が隠[かく]れているのか。"
  2: "不敬[ふけい]な者[もの]たちは境[さかい]を越[こ]え、羊[ひつじ]の群[む]れを羊飼[ひつじか]いもろとも奪[うば]い去[さ]った。"
  3: "彼らは孤児[こじ]の荷[に]を負[お]う動物[どうぶつ]を連[つ]れ去[さ]り、やもめの牛[うし]を担保[たんぽ]に取[と]る。"
  4: "彼らは弱[よわ]い者[もの]を義[ぎ]の道[みち]から押[お]しのけ、地[ち]の柔和[にゅうわ]な者[もの]たちはこぞって身[み]を隠[かく]した。"
  5: "彼らは野[の]の驢馬[ろば]のように、自分[じぶん]の仕事[しごと]に出[で]て行[い]った。パンは若[わか]い者[もの]たちにとって甘[あま]かった。"
  6: "彼らは自分[じぶん]のものでない畑[はたけ]を、時[とき]が来[く]る前[まえ]に刈[か]り取[と]った。弱[よわ]い者[もの]たちは不敬[ふけい]な者[もの]のぶどう畑[ばたけ]を、賃金[ちんぎん]もなく、食[た]べ物[もの]もなく耕[たがや]した。"
  7: "彼らは多[おお]くの裸[はだか]の者[もの]を衣[ころも]もなく眠[ねむ]らせ、その魂[たましい]の衣を奪[うば]った。"
  8: "彼らは山[やま]の霧雨[きりさめ]に濡[ぬ]れ、覆[おお]うものがないので、岩[いわ]をまとう。"
  9: "彼らは乳飲[ちの]み子[ご]を乳[ちち]から引[ひ]き離[はな]して奪[うば]い、倒[たお]れた者[もの]をさらに低[ひく]くした。"
  10: "彼らは不正[ふせい]にも裸[はだか]の者[もの]を眠[ねむ]らせ、飢[うえ]えた者[もの]からパンを取[と]り上[あ]げた。"
  11: "彼らは狭[せま]い所[ところ]で不正[ふせい]にも待[ま]ち伏[ぶ]せし、義[ぎ]の道[みち]を知[し]らなかった。"
  12: "彼らは町[まち]から、自分[じぶん]の家[いえ]から追[お]い出[だ]された。幼子[おさなご]たちの魂[たましい]は大声[おおごえ]で呻[うめ]いた。しかし神[かみ]は、どうして彼らを顧[かえり]みないのか。"
  13: "彼らは地[ち]にいたとき、これを知[し]らず、義[ぎ]の道[みち]をも知らず、その小道[こみち]を歩[あゆ]むこともなかった。"
  14: "彼らの行[おこな]いを知[し]って、神は彼らを闇[やみ]に渡[わた]された。その者[もの]は夜[よる]になると盗人[ぬすびと]のようになる。"
  15: "姦通[かんつう]する者[もの]の目[め]は闇[やみ]をうかがい、言う。『だれの目[め]もわたしを見[み]ない』と。そして、顔[かお]に覆[おお]いを置[お]く。"
  16: "彼らは闇[やみ]の中[なか]で家[いえ]に穴[あな]を掘[ほ]る。昼[ひる]は自分[じぶん]たちを閉[と]じこめて、光[ひかり]を知[し]らない。"
  17: "朝[あさ]には彼らにとって一様[いちよう]に死[し]の陰[かげ]であり、彼は死の陰[かげ]の騒[さわ]ぎを知[し]るからである。"
  18: "彼は水[みず]の面[おもて]の上[うえ]で軽[かる]やかである。彼らの分[わ]け前[まえ]は地[ち]の上[うえ]で呪[のろ]われるように。"
  19: "彼らの若枝[わかえだ]は地[ち]の上[うえ]に枯[か]れて現[あらわ]れるように。彼らは孤児[こじ]の抱[だ]くものを奪[うば]ったからである。"
  20: "その後[あと]、彼の罪[つみ]は思[おも]い起[おこ]され、露[つゆ]の霧[きり]のように消[き]え去[さ]る。彼が行[おこな]ったことが彼に報[むく]いられ、すべての不正[ふせい]な者[もの]は癒[い]やしえない木[き]のように砕[くだ]かれるように。"
  21: "彼は不妊[ふにん]の女[おんな]に良[よ]くせず、女をあわれまなかった。"
  22: "彼は怒[いか]りによって弱[よわ]い者[もの]を倒[たお]した。それゆえ、彼が立[た]ち上[あ]がっても、自分[じぶん]の命[いのち]を信[しん]じることはない。"
  23: "彼は弱[よわ]り果[は]てて、癒[い]やされることを望[のぞ]んではならない。病[やまい]によって倒[たお]れるからである。"
  24: "彼の高[たか]ぶりは多[おお]くの者[もの]を苦[くる]しめた。彼は炎熱[えんねつ]の中[なか]の葵[あおい]のように、また茎[くき]からひとりでに落[お]ちた穂[ほ]のように枯[か]れた。"
  25: "そうでないなら、だれがわたしの偽[いつわ]りを言[い]う者[もの]であろうか。だれがわたしの言葉[ことば]を無[む]に帰[き]するのか。」"

notes:
  1: "διὰ τί δὲ κύριον ἔλαθον ὧραι — «почему же от Господа утаились времена» (λανθάνω — утаиться; ὧραι — времена, часы); слав. «почто же Господа утаишася часы». В LXX стих обрывается на этой половине; в МТ и ru добавлено «и знающие Его не видят дней Его» — масоретское дополнение, по паритету не внесено. Кавычка открыта в начале главы: речь Иова продолжается из гл. 23."
  2: "ἀσεβεῖς δὲ ὅριον ὑπερέβησαν — «нечестивые же предел преступили» (ὅριον — межа, граница; ὑπερβαίνω — переступать). ποίμνιον σὺν ποιμένι ἁρπάσαντες — «стадо с пастухом похитив» (ποίμνιον — стадо; ἁρπάζω — похищать); слав. «предел преидоша, стадо с пастырем разграбивше». Говорящий: Иов."
  3: "ὑποζύγιον ὀρφανῶν ἀπήγαγον — «вьючное животное сирот увели» (ὑποζύγιον — осёл, вьючный скот; ἀπάγω). βοῦν χήρας ἠνεχύρασαν — «вола вдовы взяли в залог» (ἐνεχυράζω — брать залог); слав. «подяремника сирых отведоша и вола вдовича в залог взяша». Говорящий: Иов."
  4: "ἐξέκλιναν ἀδυνάτους ἐξ ὁδοῦ δικαίας — «отклонили немощных с пути правого» (ἐκκλίνω — отклонять). ὁμοθυμαδὸν ἐκρύβησαν πραεῖς γῆς — «вместе скрылись кроткие земли» (ὁμοθυμαδόν — единодушно; πραΰς — кроткий); слав. «уклониша немощных от пути праведнаго, вкупе же скрышася кротцыи земли». Говорящий: Иов."
  5: "ἀπέβησαν δὲ ὥσπερ ὄνοι ἐν ἀγρῷ — «вышли же, как дикие ослы в поле» (ὄνος — осёл; ἀγρός — поле). ὑπὲρ ἐμοῦ ἐξελθόντες τὴν ἑαυτῶν πρᾶξιν — «за меня (?) выйдя на своё дело»: в LXX и слав. («на мя… изступивше своего чина») место тёмное, передан общий смысл — выходят на свою работу (πρᾶξις — дело). ἡδύνθη αὐτῷ ἄρτος εἰς νεωτέρους — «сладок был ему хлеб ради юных» (ἡδύνω — делать сладким); слав. «сладок бысть хлеб им ради юных». Говорящий: Иов."
  6: "ἀγρὸν πρὸ ὥρας οὐκ αὐτῶν ὄντα ἐθέρισαν — «поле до времени, не своё, пожали» (θερίζω — жать). ἀδύνατοι δὲ ἀμπελῶνας ἀσεβῶν ἀμισθὶ καὶ ἀσιτὶ ἠργάσαντο — «и немощные виноградники нечестивых без платы и без еды возделали» (ἄμισθος — без платы; ἄσιτος — без пищи); слав. «ниву прежде времене не свою сущу пожаша… без мзды и без брашна возделаша». Говорящий: Иов."
  7: "γυμνοὺς πολλοὺς ἐκοίμισαν ἄνευ ἱματίων — «многих нагих уложили спать без одежд» (ἱμάτιον — одежда). ἀμφίασιν δὲ ψυχῆς αὐτῶν ἀφείλαντο — «и одеяние души их отняли»; слав. «нагих многих успиша без риз, одежду же души их отяша». Говорящий: Иов."
  8: "ἀπὸ ψεκάδων ὀρέων ὑγραίνονται — «от капель (дождей) горных намокают» (ψεκάς — капля, морось; ὑγραίνω — увлажнять). παρὰ τὸ μὴ ἔχειν αὐτοὺς σκέπην πέτραν περιεβάλοντο — «за то, что нет у них покрова, в камень облеклись» (σκέπη — кров); слав. «каплями горскими мокнут… в камение облекошася». Говорящий: Иов."
  9: "ἥρπασαν ὀρφανὸν ἀπὸ μαστοῦ — «похитили сироту от груди» (μαστός — грудь). ἐκπεπτωκότα δὲ ἐταπείνωσαν — «и падшего унизили» (ἐκπίπτω — выпадать); слав. «восхитиша сироту от сосца, падшаго же смириша». Говорящий: Иов."
  10: "γυμνοὺς δὲ ἐκοίμισαν ἀδίκως — «и нагих уложили спать неправедно». πεινώντων δὲ τὸν ψωμὸν ἀφείλαντο — «и у голодных кусок отняли» (ψωμός — кусок); слав. «нагия же успиша неправедно, от алчущих же хлеб отяша». Говорящий: Иов."
  11: "ἐν στενοῖς ἀδίκως ἐνήδρευσαν — «в теснинах неправедно засели в засаду» (στενά — теснина; ἐνεδρεύω — подстерегать). ὁδὸν δὲ δικαίαν οὐκ ᾔδεισαν — «и пути правого не знали»; слав. «в теснинах неправедно заседоша, пути же праведнаго не ведеша». В МТ и ru здесь иное (выжимают масло, топчут в точилах). Говорящий: Иов."
  12: "οἳ ἐκ πόλεως καὶ οἴκων ἰδίων ἐξεβάλλοντο — «которые из города и из домов своих изгонялись» (ἐκβάλλω — изгонять). ψυχὴ δὲ νηπίων ἐστέναξεν μέγα — «и душа младенцев громко стонала» (νήπιος — младенец; στενάζω — стенать). αὐτὸς δὲ διὰ τί τούτων ἐπισκοπὴν οὐ πεποίηται — «и Он — почему не сделал посещения их» (ἐπισκοπή — посещение, попечение); слав. «Бог же почто сих посещения не сотвори?». Говорящий: Иов."
  13: "ἐπὶ γῆς ὄντων αὐτῶν καὶ οὐκ ἐπέγνωσαν — «пока они были на земле, не познали» (ἐπιγινώσκω). ὁδὸν δὲ δικαιοσύνης οὐκ ᾔδεισαν — «и пути правды не знали». οὐδὲ ἀτραποὺς αὐτῆς ἐπορεύθησαν — «и стезями её не ходили» (ἀτραπός — тропа); слав. «на земли сущым им, и не разумеша… ни по стезям его ходиша». Говорящий: Иов."
  14: "γνοὺς δὲ αὐτῶν τὰ ἔργα παρέδωκεν αὐτοὺς εἰς σκότος — «узнав их дела, предал их тьме» (παραδίδωμι — предавать). καὶ νυκτὸς ἔσται ὡς κλέπτης — «и ночью будет как вор» (κλέπτης — вор): смена подлежащего (Бог — они) сохранена, поэтому その者は; слав. «и в нощи будет яко тать». Говорящий: Иов."
  15: "ὀφθαλμὸς μοιχοῦ ἐφύλαξεν σκότος — «око прелюбодея подстерегло тьму» (μοιχός — прелюбодей; φυλάσσω — стеречь). Οὐ προσνοήσει με ὀφθαλμός — «не заметит меня око»: слова прелюбодея, поэтому 『』. ἀποκρυβὴν προσώπου ἔθετο — «покрывало на лицо положил» (ἀποκρυβή — укрытие); слав. «и покрывало лицу наложи». Говорящий: Иов."
  16: "διώρυξεν ἐν σκότει οἰκίας — «подкопал в темноте дома» (διορύσσω — подкапывать). ἡμέρας ἐσφράγισαν ἑαυτούς — «днём запечатали себя» (σφραγίζω — запечатывать, запирать). οὐκ ἐπέγνωσαν φῶς — «не познали света»; слав. «прокопа в нощи храмины, во днех же запечаташа себе, не познаша света». Говорящий: Иов."
  17: "ὅτι ὁμοθυμαδὸν τὸ πρωῒ αὐτοῖς σκιὰ θανάτου — «ибо вместе утро для них — тень смерти» (σκιά — тень). ὅτι ἐπιγνώσεται ταραχὰς σκιᾶς θανάτου — «ибо познает смятения тени смертной» (ταραχή — смятение); слав. «яко абие заутра им сень смерти, понеже познает мятеж сени смертныя». Место тёмное, передано буквально. Говорящий: Иов."
  18: "ἐλαφρός ἐστιν ἐπὶ πρόσωπον ὕδατος — «лёгок он на поверхности воды» (ἐλαφρός — лёгкий). καταραθείη ἡ μερὶς αὐτῶν ἐπὶ γῆς — «да будет проклята часть их на земле» (καταράομαι — проклинать); слав. 24:18 вбирает также начало нашего ст. 19 («да явятся же садовия их на земли суха») — деление иное, держимся gr. Говорящий: Иов."
  19: "ἀναφανείη δὲ τὰ φυτὰ αὐτῶν ἐπὶ γῆς ξηρά — «да явятся растения их на земле сухими» (ἀναφαίνω — являть; φυτόν — растение). ἀγκαλίδα γὰρ ὀρφανῶν ἥρπασαν — «ибо объятие (ношу) сирот расхитили» (ἀγκαλίς — охапка, ноша на руках); слав. в 24:19 оставляет только «рукоятие бо сирых разграбиша» — первая половина у него в ст. 18. Говорящий: Иов."
  20: "εἶτ ἀνεμνήσθη αὐτοῦ ἡ ἁμαρτία — «потом вспомянут был ему грех его» (ἀναμιμνῄσκω — напоминать). ὥσπερ δὲ ὁμίχλη δρόσου ἀφανὴς ἐγένετο — «и, как туман росы, стал невидим» (ὁμίχλη — туман; δρόσος — роса); слав. «якоже мгла росы изчезе». ἀποδοθείη δὲ αὐτῷ ἃ ἔπραξεν — «да будет воздано ему, что он сделал». συντριβείη δὲ πᾶς ἄδικος ἴσα ξύλῳ ἀνιάτῳ — «и да будет сокрушён всякий неправедный, как дерево неисцельное» (ξύλον — дерево; ἀνίατος — неисцелимый); слав. «сокрушен же буди всяк неправдив яко древо неизцельно». Говорящий: Иов."
  21: "στεῖραν γὰρ οὐκ εὖ ἐποίησεν — «ибо бесплодной не добро сотворил» (στεῖρα — бесплодная; εὖ ποιέω — благотворить). γύναιον οὐκ ἠλέησεν — «и женщины не помиловал» (ἐλεάω — миловать); слав. «неплодней бо не добро сотвори и жены не помилова». Говорящий: Иов."
  22: "θυμῷ δὲ κατέστρεψεν ἀδυνάτους — «яростью же низверг немощных» (καταστρέφω — низвергать). ἀναστὰς τοιγαροῦν οὐ μὴ πιστεύσῃ κατὰ τῆς ἑαυτοῦ ζωῆς — «встав, итак, не поверит своей жизни»: то есть не будет уверен в своей жизни (πιστεύω — верить); слав. «востав убо не имать веры яти о своем житии». Говорящий: Иов."
  23: "μαλακισθεὶς μὴ ἐλπιζέτω ὑγιασθῆναι — «ослабев, да не надеется выздороветь» (μαλακίζομαι — расслабляться, болеть; ὑγιάζω — исцелять). ἀλλὰ πεσεῖται νόσῳ — «но падёт от болезни» (νόσος); слав. «егда же разболится, да не надеется здрав быти, но падет недугом». В МТ и ru здесь иное (Бог даёт ему безопасность). Говорящий: Иов."
  24: "πολλοὺς γὰρ ἐκάκωσεν τὸ ὕψωμα αὐτοῦ — «ибо многих озлобила высота его» (ὕψωμα — высота, высокомерие). ἐμαράνθη δὲ ὥσπερ μολόχη ἐν καύματι — «и увял, как мальва (просвирник) в зное» (μολόχη — мальва, 葵; καῦμα — зной). ἢ ὥσπερ στάχυς ἀπὸ καλάμης αὐτόματος ἀποπεσών — «или как колос, с соломины сам собою упавший» (στάχυς — колос; κάλαμος — стебель; αὐτόματος — сам собою); слав. «увяде же яко злак в знои, или якоже клас от стебла сам отпад». Говорящий: Иов."
  25: "εἰ δὲ μή — «если же нет» (то есть если это не так). τίς ἐστιν ὁ φάμενος ψευδῆ με λέγειν — «кто есть говорящий, что я лгу» (ψευδῆ λέγειν — говорить ложь). θήσει εἰς οὐδὲν τὰ ῥήματά μου — «обратит в ничто слова мои» (τίθημι εἰς οὐδέν); слав. «и положит ни во чтоже глаголы моя». Закрывающая кавычка — конец речи Иова, начатой в гл. 23."
