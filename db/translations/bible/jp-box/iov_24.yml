# jp-box, Иов, глава 24. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге только 1–2; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 24: продолжение речи Иова (2–25): почему нечестивые не наказаны (1),
# их притеснения — межи, стада, залоги, бедняки (2–12), тьма и свет (13–17),
# их гибель (18–24), вызов друзьям (25).
# Голоса: это продолжение речи из гл. 23 (23:2–17), поэтому в начале главы кавычка
# снова открыта (ст. 1) и закрыта в конце (ст. 25); внутри главы кавычки
# сбалансированы. Внутри речи слова прелюбодея (15) — 『…』.
# Красного и синего нет (Ветхий Завет).
# Нумерация по gr: 25 стихов; в csl-ru 25, но ст. 18–19 поделены иначе (см. notes).
# 〔…〕 нет: все стихи есть в gr-lxx-byz. Сносок ⟨…⟩ нет: よみ, 正しい者, 不敬な者
# уже в корпусе. Имена — транслитерация греческого (LXX).

