verses:
  1: "「見[み]よ、わたしはわたしの使[つか]いを遣[つか]わす。彼はわたしの前[まえ]に道[みち]を備[そな]える。あなたがたが求[もと]めている主[しゅ]は、突然[とつぜん]、ご自分の神殿[しんでん]に来[こ]られる。あなたがたが望[のぞ]んでいる契約[けいやく]の使[つか]いも、見[み]よ、来[く]る、と万軍[ばんぐん]の主[しゅ]は言[い]われる。"
  2: "だれが彼[かれ]の来[く]る日[ひ]に耐[た]えられようか。だれが彼[かれ]の現[あらわ]れを見[み]て立[た]っていられようか。彼[かれ]は銀[ぎん]を溶[と]かす火[ひ]のようであり、布[ぬの]を洗[あら]う者[もの]の灰汁[あく]のようである。"
  3: "彼[かれ]は銀[ぎん]を溶[と]かし清[きよ]める者[もの]として座[すわ]り、レビの子[こ]らを清[きよ]めて、金[きん]や銀[ぎん]のように彼らを練[ね]る。そして彼らは主[しゅ]に、正[ただ]しさのうちにささげ物[もの]をささげる者[もの]となる。"
  4: "そのとき、ユダとエルサレムのささげ物[もの]は、昔[むかし]の日[ひ]々[び]のように、過[す]ぎ去[さ]った年[とし]々[とし]のように、主[しゅ]に喜[よろこ]ばれる。"
  5: "わたしはあなたがたのところに裁[さば]きのために来[き]て、魔術[まじゅつ]を行[おこな]う者[もの]、姦淫[かんいん]する者[もの]、偽[いつわ]りによってわたしの名[な]で誓[ちか]う者[もの]、雇[やと]い人[びと]の賃金[ちんぎん]をかすめ取[と]る者[もの]、やもめと孤児[こじ]をしいたげる者[もの]、寄[き]留[りゅう]者の裁[さば]きを曲[ま]げる者[もの]、わたしを恐[おそ]れない者[もの]に、速[すみ]やかな証人[しょうにん]となる、と万軍[ばんぐん]の主[しゅ]は言[い]われる」。"
  6: "「実[じつ]に、わたしはあなたがたの神[かみ]、主[しゅ]である。わたしは変[か]わらない。あなたがたヤコブの子[こ]らは、父[ちち]たちの罪[つみ]から離[はな]れない。"
  7: "あなたがたはわたしの掟[おきて]から離[はな]れて、それを守[まも]らなかった。わたしに帰[かえ]れ、そうすればわたしもあなたがたに帰[かえ]る、と万軍[ばんぐん]の主[しゅ]は言[い]われる。あなたがたは言[い]う。『どのようにして、わたしたちは帰[かえ]ればよいのか』と。"
  8: "人[ひと]は神[かみ]を欺[あざむ]けるだろうか。あなたがたはわたしを欺[あざむ]いている。あなたがたは言[い]う。『どのようにして、わたしたちはあなたを欺[あざむ]いているのか』と。十分[じゅうぶん]の一[いち]と初穂[はつほ]においてである。"
  9: "あなたがたは目[め]を注[そそ]いでいるのに、わたしを欺[あざむ]いている。"
  10: "年[とし]は終[お]わった。あなたがたはすべての産物[さんぶつ]を倉[くら]に納[おさ]めよ。そうすれば、その家[いえ]に分捕[ぶんど]り物[もの]がある。このことに心[こころ]を向[む]けよ、と万軍[ばんぐん]の主[しゅ]は言[い]われる。わたしがあなたがたに天[てん]の窓[まど]を開[ひら]き、あなたがたが満[み]ち足[た]りるまで祝福[しゅくふく]を注[そそ]がないことがあろうか。"
  11: "わたしはあなたがたに食物[しょくもつ]を分[わ]け与[あた]え、あなたがたの地[ち]の実[み]を腐[くさ]らせず、畑[はたけ]のぶどうの木[き]も弱[よわ]らせない、と万軍[ばんぐん]の主[しゅ]は言[い]われる。"
  12: "すべての国民[こくみん]はあなたがたを幸[しあわ]せな者[もの]と呼[よ]ぶ。あなたがたは喜[よろこ]ばしい地[ち]となるからである、と万軍[ばんぐん]の主[しゅ]は言[い]われる」。"
  13: "「あなたがたはわたしに向[む]かって言葉[ことば]を重[おも]くしている、と主[しゅ]は言[い]われる。あなたがたは言[い]う。『わたしたちはあなたに向[む]かって何[なに]を語[かた]ったのか』と。"
  14: "あなたがたは言[い]う。『神[かみ]に仕[つか]えることはむだである。わたしたちが彼[かれ]の戒[いまし]めを守[まも]り、万軍[ばんぐん]の主[しゅ]の前[まえ]を願[ねが]い求[もと]める者[もの]として歩[あゆ]んでも、何[なに]の益[えき]があるのか。"
  15: "今[いま]、わたしたちは高[たか]ぶる者[もの]を幸[しあわ]せと見[み]なす。悪[わる]を行[おこな]う者[もの]は栄[さか]え、神[かみ]に逆[さか]らっても救[すく]われる』と」。"
  16: "そのとき、主[しゅ]を恐[おそ]れる者[もの]たちは互[たが]いに語[かた]り合[あ]った。主[しゅ]は耳[みみ]を傾[かたむ]けて聞[き]き、主[しゅ]を恐[おそ]れ、その名[な]を尊[とうと]ぶ者[もの]たちのために、記念[きねん]の書[しょ]を御前[ごぜん]に書[か]かれた。"
  17: "「彼らはわたしのものとなる、と万軍[ばんぐん]の主[しゅ]は言[い]われる。わたしが所有[しょゆう]として備[そな]える日[ひ]に、わたしは彼らを選[えら]ぶ。人[ひと]が自分[じぶん]によく仕[つか]える子[こ]を選[えら]ぶように、わたしは彼らを選[えら]ぶ。"
  18: "あなたがたは立[た]ち返[かえ]って、正[ただ]しい者[もの]と不法[ふほう]な者[もの]、神[かみ]に仕[つか]える者[もの]と仕[つか]えない者[もの]との間[あいだ]の違[ちが]いを見[み]よ」。"

notes:
  1: "ἰδοὺ ἐγὼ ἐξαποστέλλω τὸν ἄγγελόν μου — «вот, Я посылаю Ангела (вестника) Моего»; ἐπιβλέψεται ὁδὸν πρὸ προσώπου μου — «Он усмотрит (приготовит) путь пред лицом Моим» (ἐπιβλέπω — смотреть, усматривать); ἐξαίφνης ἥξει εἰς τὸν ναὸν ἑαυτοῦ κύριος — «внезапно придёт в храм Свой Господь»; ὁ ἄγγελος τῆς διαθήκης — «Ангел завета» (в тексте 契約[けいやく]の使[つか]い, не 天使)."
  2: "τίς ὑπομενεῖ ἡμέραν εἰσόδου αὐτοῦ — «кто выдержит день входа Его» (ὑπομένω — выдерживать); τίς ὑποστήσεται ἐν τῇ ὀπτασίᾳ αὐτοῦ — «кто устоит в явлении Его» (ὀπτασία — явление, видение); πῦρ χωνευτηρίου — «огонь плавильни» (χωνευτήριον — плавильная печь); πόα πλυνόντων — «щёлок (трава) моющих» (πλύντης — мывший; слав. «мыло перущих»; в тексте 灰汁[あく])."
  3: "καθιεῖται χωνεύων καὶ καθαρίζων ὡς τὸ ἀργύριον καὶ ὡς τὸ χρυσίον — «сядет плавя и очищая, как серебро и как золото»; καθαρίσει τοὺς υἱοὺς Λευι — «очистит сынов Левия»; χεεῖ αὐτοὺς ὡς τὸ χρυσίον — «изольёт (расплавит) их как золото» (χέω — лить, плавить); προσάγοντες θυσίαν ἐν δικαιοσύνῃ — «приносящие жертву в правде»."
  4: "καὶ ἀρέσει τῷ κυρίῳ θυσία Ιουδα καὶ Ιερουσαλημ — «и будет угодна Господу жертва Иуды и Иерусалима» (ἀρέσκω — быть угодным); καθὼς αἱ ἡμέραι τοῦ αἰῶνος — «как дни века»; καθὼς τὰ ἔτη τὰ ἔμπροσθεν — «как годы прежние»."
  5: "προσάξω πρὸς ὑμᾶς ἐν κρίσει — «приду к вам на суд»; ἔσομαι μάρτυς ταχὺς ἐπὶ τοὺς φαρμακοὺς — «буду свидетелем скорым на чародеев» (φαρμακός — чародей, отравитель); ἐπὶ τοὺς μοιχαλίδας — «на прелюбодеев» (μοιχαλίς); τοὺς ὀμνύοντας τῷ ὀνόματί μου ἐπὶ ψεύδει — «клянущихся именем Моим ложно»; ἀποστεροῦντας μισθὸν μισθωτοῦ — «удерживающих плату наёмника» (ἀποστερέω — лишать); καταδυναστεύοντας χήραν — «притесняющих вдову»; κονδυλίζοντας ὀρφανούς — «бьющих кулаками сирот» (κονδυλίζω — бить кулаком); ἐκκλίνοντας κρίσιν προσηλύτου — «отвращающих суд пришельца»."
  6: "Διότι ἐγὼ κύριος ὁ θεὸς ὑμῶν, καὶ οὐκ ἠλλοίωμαι — «ибо Я Господь Бог ваш, и не изменился» (ἀλλοιόω — изменять); καὶ ὑμεῖς, υἱοὶ Ιακωβ, οὐκ ἀπέχεσθε — «и вы, сыны Иакова, не удерживаетесь». В LXX слова ἀπὸ τῶν ἀδικιῶν τῶν πατέρων ὑμῶν открывают 3:7; слав. относит их к 3:6 («не удаляетеся от грех отец ваших»). Границу держим по слав."
  7: "ἀπὸ τῶν ἀδικιῶν τῶν πατέρων ὑμῶν, ἐξεκλίνατε νόμιμά μου καὶ οὐκ ἐφυλάξασθε — «от неправд отцов ваших вы уклонились от уставов Моих и не сохранили их»; ἐπιστρέψατε πρός με, καὶ ἐπιστραφήσομαι πρὸς ὑμᾶς — «обратитесь ко Мне, и Я обращусь к вам»; Ἐν τίνι ἐπιστρέψωμεν — «как нам обратиться». Слав. 3:7 начинается с «Уклонистеся от законов моих» (без «от неправд отцов»)."
  8: "εἰ πτερνιεῖ ἄνθρωπος θεόν — «обманет ли человек Бога» (πτερνίζω — запинать, обманывать, обкрадывать); ὅτι τὰ ἐπιδέκατα καὶ αἱ ἀπαρχαὶ μεθ᾽ ὑμῶν εἰσιν — «ибо десятины и начатки с вами» (ἐπιδέκατον — десятина; ἀπαρχή — начаток,初穂)."
  9: "καὶ ἀποβλέποντες ὑμεῖς ἀποβλέπετε, καὶ ἐμὲ ὑμεῖς πτερνίζετε — «смотря, вы смотрите, и Меня вы обкрадываете» (ἀποβλέπω — взирать); τὸ ἔθνος συνετελέσθη — «народ доведён до конца (погиб)». В слав. этого добавления нет: 3:9 короткий; слав. «Лето скончася» стоит в начале 3:10 (в gr-lxx-swete τὸ ἔτος συνετελέσθη — «год завершился»). В тексте — слав."
  10: "εἰσενέγκατε πάντα τὰ ἐκφόρια εἰς τοὺς θησαυρούς — «внесите все произведения в сокровищницы» (ἐκφόριον — произведение, плод; θησαυρός — сокровищница); ἡ διαρπαγὴ αὐτοῦ ἐν τῷ οἴκῳ αὐτοῦ — «расхищение его в доме его» (тёмное место LXX, вероятно передача евр. «пища в доме Моём»; в тексте «分捕[ぶんど]り物[もの]», слав. «расхищение»); ἐπισκέψασθε δὴ ἐν τούτῳ — «испытайте в этом»; τοὺς καταρράκτας τοῦ οὐρανοῦ — «отверстия (водопады) небесные» (καταρράκτης); ἕως τοῦ ἱκανωθῆναι — «доколе не насытитесь». Слав. добавляет в начале «Лето скончася» — нет в gr-lxx-byz (ср. Swete), внесено без 〔…〕."
  11: "διαστελῶ ὑμῖν εἰς βρῶσιν — «отделю (назначу) вам в пищу» (διαστέλλω — разделять, назначать; в тексте 食物[しょくもつ]を分[わ]け与[あた]える); в ru/МТ «запрещу пожирающему» — иное чтение, не внесено; οὐ μὴ διαφθείρω ὑμῶν τὸν καρπὸν τῆς γῆς — «не истреблю (не испорчу) плода земли вашей» (διαφθείρω — портить, губить); οὐ μὴ ἀσθενήσῃ ὑμῶν ἡ ἄμπελος ἡ ἐν τῷ ἀγρῷ — «не ослабеет виноград ваш на поле»."
  12: "μακαριοῦσιν ὑμᾶς πάντα τὰ ἔθνη — «ублажат вас все народы» (μακαρίζω — ублажать, называть счастливым); ἔσεσθε ὑμεῖς γῆ θελητή — «вы будете земля желанная» (θελητός — желанный). Здесь слово 3:6–12 закрывается."
  13: "Ἐβαρύνατε ἐπ᾽ ἐμὲ τοὺς λόγους ὑμῶν — «отяготили на Меня слова ваши» (βαρύνω — отягощать); Ἐν τίνι κατελαλήσαμεν κατὰ σοῦ — «чем мы наговорили против Тебя» (καταλαλέω — клеветать, говорить против)."
  14: "Μάταιος ὁ δουλεύων θεῷ — «тщетен служащий Богу» (μάταιος — напрасный, пустой); τί πλέον ὅτι ἐφυλάξαμεν τὰ φυλάγματα αὐτοῦ — «что больше (пользы), что мы сохранили хранения Его» (φύλαγμα — хранение, заповедь); ἐπορεύθημεν ἱκέται πρὸ προσώπου κυρίου παντοκράτορος — «ходили просителями пред лицом Господа Вседержителя» (ἱκέτης — проситель, молящий)."
  15: "μακαρίζομεν ἀλλοτρίους — «ублажаем чужих (надменных)» (ἀλλότριος — чужой); ἀνοικοδομοῦνται πάντες ποιοῦντες ἄνομα — «созидаются все делающие беззаконие» (ἀνοικοδομέω — отстраивать); ἀντέστησαν θεῷ καὶ ἐσώθησαν — «воспротивились Богу и спаслись». Здесь слово 3:13–15 закрывается."
  16: "Ταῦτα κατελάλησαν οἱ φοβούμενοι τὸν κύριον, ἕκαστος πρὸς τὸν πλησίον αὐτοῦ — «это говорили боящиеся Господа, каждый к ближнему своему»; προσέσχεν κύριος καὶ εἰσήκουσεν — «внял Господь и услышал» (προσέχω — внимать); ἔγραψεν βιβλίον μνημοσύνου ἐνώπιον αὐτοῦ — «написал книгу памяти пред Собою» (μνημόσυνον — память); εὐλαβουμένοις τὸ ὄνομα αὐτοῦ — «благоговеющим пред именем Его»."
  17: "ἔσονταί μοι… εἰς ἡμέραν, ἣν ἐγὼ ποιῶ εἰς περιποίησιν — «будут Мне… в день, который Я творю в приобретение» (περιποίησις — приобретение, собственность; в тексте 所有[しょゆう]); αἱρετιῶ αὐτοὺς ὃν τρόπον αἱρετίζει ἄνθρωπος τὸν υἱὸν αὐτοῦ — «изберу их, как человек избирает сына своего» (αἱρετίζω — избирать); τὸν δουλεύοντα αὐτῷ — «служащего ему». В LXX нет «помилую» (это ru/МТ), в тексте только «изберу»."
  18: "ἐπιστραφήσεσθε καὶ ὄψεσθε — «обратитесь и увидите»; ἀνὰ μέσον δικαίου καὶ ἀνὰ μέσον ἀνόμου — «между праведным и между беззаконным»; ἀνὰ μέσον τοῦ δουλεύοντος θεῷ καὶ τοῦ μὴ δουλεύοντος — «между служащим Богу и не служащим». Здесь слово книги (3:17–18) закрывается перед 4-й главой."
