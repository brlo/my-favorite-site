# jp-box, Малахия, глава 3. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной (csl-ru): здесь 18 стихов; в gr-lxx-byz эта глава
# продолжается до 3:24. Слав. 3:1–18 = gr 3:1–18; gr 3:19–24 — это слав. 4:1–6
# (карта — в шапке 4-й главы). Стихи не дублируются.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена: ヤコブ, レビ, ユダ, エルサレム, モーセ, エリヤ.
#
# Содержание: 1–5 Ангел и внезапное пришествие Господа в храм; кто выдержит день Его;
# огонь плавильни и щёлок; очищение сынов Левия; жертва Иуды угодна; суд над
# чародеями, прелюбодеями, клянущимися ложно, удерживающими плату, притесняющими
# вдову и сироту; 6–12 «Я не изменяюсь», возвращение, десятины и начатки, «испытайте
# Меня», отверзтые окна небесные; 13–15 «тщетно служить Богу»; 16 книга памяти;
# 17–18 «они будут Моими», различие праведного и нечестивого.
# Голоса: 1–5 — 「…» (новое слово; «говорит Господь» внутри); 6–12 — 「…» (слова
# народа — 『…』); 13–15 — 「…» (слова народа — 『…』), закрывается в 15;
# 16 — повествование; 17–18 — 「…».
# 3:6: в LXX 3:6 кончается на οὐκ ἀπέχεσθε, а слова ἀπὸ τῶν ἀδικιῶν τῶν πατέρων ὑμῶν
# открывают 3:7; слав. относит их к 3:6 («не удаляетеся от грех отец ваших»), и 3:7
# начинается с «Уклонистеся от законов моих». Границу держим по слав.
# 3:9: в gr-lxx-byz добавлено τὸ ἔθνος συνετελέσθη, в слав. опущено; слав. «Лето
# скончася» стоит в начале 3:10 (ср. Swete τὸ ἔτος συνετελέσθη). В тексте — слав.
#
