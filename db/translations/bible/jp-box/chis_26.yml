# jp-box, Числа, глава 26. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в этой главе нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 26: вторая перепись после поражения (1–4), роды Рувима (5–11), Симеона (12–14),
# Иуды (15–18), Иссахара (19–21), Завулона (22–23), Гада (24–27), Асира (28–31),
# Иосифа: Манассия (32–38) и Ефрем (39–41), Вениамина (42–45), Дана (46–47),
# Неффалима (48–50), итог (51), закон о разделе земли (52–56), перепись левитов
# (57–62), заключение и исключение Халева и Иисуса (63–65).
# Числа по LXX: Рувим 43 730; Симеон 22 200; Гад 40 500; Иуда 76 500; Иссахар 64 300;
# Завулон 60 500; Ефрем 32 500; Манассия 52 700; Вениамин 45 600; Дан 64 400;
# Асир 53 400; Неффалим 45 400; всего 601 730; левиты 23 000.
# Имена кланов транслитерированы с греческого и держатся единообразно: суффикс -ι
# в формах вроде Ασρωνι, Σηλωνι не передаётся отдельно, клан называется по родоначальнику
# (アスロンの氏族). Где то же лицо есть в Быт 46, взята форма корпуса: エノク, ファルス,
# アスロン, ハルミ, ペレツ, シェラ, ゼラ, トラ, プア, ヤシュブ, サフォン, セレド, マキル,
# ギレアデ. Αλλων передано エロン, чтобы не смешивать с Аароном (アロン).
# Красного и синего нет. Кавычки: речь Бога — 「…」 (2, 53–56).
# 〔…〕 нет: все слова есть в gr-lxx-byz (сверено bracket_check.rb).
# Отличия LXX: в csl-ru/ru нумерация этой главы смещена (ru идёт по масоретскому счёту),
# поэтому контроль вёлся по греческому тексту; в 26:15 LXX называет только Ира и Аунана,
# а роды Иуды перечисляет с 16-го стиха; в 26:10 — 250 погибших, в 26:62 — 23 000 левитов
# (не 22 000, как в гл. 3).
# Сносок ⟨…⟩ нет: 氏族, 嗣業, 数え上げ, くじ понятны по контексту; 幕屋, 祭司, 会衆,
# 荒野 уже пояснены в корпусе. jp-ni не использовался.

