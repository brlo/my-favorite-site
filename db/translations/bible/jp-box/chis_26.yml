verses:
  1: "災[わざわ]いの後[のち]、主[しゅ]はモーセと祭司[さいし]エレアザルに語[かた]って言[い]われた。"
  2: "「イスラエルの子[こ]らの会衆[かいしゅう]すべてを、二十歳[さい]以上[いじょう]の者[もの]について、その父[ちち]の家[いえ]ごとに数[かぞ]え上[あ]げなさい。イスラエルで軍勢[ぐんせい]として出[で]て行[い]く者[もの]すべてを。」"
  3: "モーセと祭司[さいし]エレアザルは、ヨルダン川[がわ]のほとり、エリコの向[む]かい側[がわ]にあるモアブのアラボトで、語[かた]って言[い]った。"
  4: "二十歳[さい]以上[いじょう]の者[もの]を、主[しゅ]がモーセに命[めい]じられたとおりに。エジプトから出[で]て来[き]たイスラエルの子[こ]らは、次[つぎ]のとおりである。"
  5: "ルベンはイスラエルの長子[ちょうし]。ルベンの子[こ]らは、エノク、およびエノクの氏族[しぞく]、ファルス、およびファルスの氏族。"
  6: "アスロンの氏族[しぞく]、ハルミの氏族。"
  7: "これらはルベンの氏族[しぞく]である。その数[かず]は四万三千七百三十人[にん]であった。"
  8: "ファルスの子[こ]らはエリアブ。"
  9: "エリアブの子[こ]らはナムエル、ダタン、アビラン。これらは会衆[かいしゅう]の名[な]だたる者[もの]、モーセとアロンに逆[さから]って立[た]った者たちであり、コラの集[あつ]まりのときに主[しゅ]に逆らって立った者たちである。"
  10: "地[ち]は口[くち]を開[ひら]いて、彼[かれ]らとコラを飲[の]み込[こ]んだ。コラの集[あつ]まりが死[し]んだとき、火[ひ]が二百五十人[にん]を食[く]い尽[つ]くし、彼らはしるしとなった。"
  11: "しかし、コラの子[こ]らは死[し]ななかった。"
  12: "シメオンの子[こ]らは、その氏族[しぞく]ごとに、ナムエルの氏族、ヤミンの氏族、ヤキンの氏族。"
  13: "ゼラの氏族[しぞく]、サウルの氏族。"
  14: "これらはシメオンの氏族[しぞく]である。その数[かず]は二万二千二百人[にん]であった。"
  15: "ユダの子[こ]らはエルとオナン。エルとオナンはカナンの地[ち]で死[し]んだ。"
  16: "ユダの子[こ]らは、その氏族[しぞく]ごとに、シェラの氏族、ペレツの氏族、ゼラの氏族であった。"
  17: "ペレツの子[こ]らは、アスロンの氏族[しぞく]、ヤムンの氏族であった。"
  18: "これらはユダの氏族[しぞく]である。その数[かず]は七万六千五百人[にん]であった。"
  19: "イッサカルの子[こ]らは、その氏族[しぞく]ごとに、トラの氏族、プアの氏族。"
  20: "ヤシュブの氏族[しぞく]、サマランの氏族。"
  21: "これらはイッサカルの氏族[しぞく]である。その数[かず]は六万四千三百人[にん]であった。"
  22: "ゼブルンの子[こ]らは、その氏族[しぞく]ごとに、セレドの氏族、エロンの氏族、アレルの氏族。"
  23: "これらはゼブルンの氏族[しぞく]である。その数[かず]は六万五百人[にん]であった。"
  24: "ガドの子[こ]らは、その氏族[しぞく]ごとに、サフォンの氏族、アンギの氏族、スニの氏族。"
  25: "アゼニの氏族[しぞく]、アディの氏族。"
  26: "アロアディの氏族[しぞく]、アリエルの氏族。"
  27: "これらはガドの子[こ]らの氏族[しぞく]である。その数[かず]は四万五百人[にん]であった。"
  28: "アシェルの子[こ]らは、その氏族[しぞく]ごとに、ヤミンの氏族、イェスの氏族、バリアの氏族。"
  29: "ホベルの氏族[しぞく]、メルキエルの氏族。"
  30: "アシェルの娘[むすめ]の名[な]はサラといった。"
  31: "これらはアシェルの氏族[しぞく]である。その数[かず]は五万三千四百人[にん]であった。"
  32: "ヨセフの子[こ]らは、その氏族[しぞく]ごとに、マナセとエフライム。"
  33: "マナセの子[こ]らは、マキルの氏族[しぞく]。マキルはギレアデを生[う]んだ。ギレアデの氏族。"
  34: "これらはギレアデの子[こ]らである。アキエゼルの氏族[しぞく]、ヘレグの氏族。"
  35: "エスリエルの氏族[しぞく]、シケムの氏族。"
  36: "スマエルの氏族[しぞく]、オフェルの氏族。"
  37: "オフェルの子[こ]サルパアデには、息子[むすこ]がなく、娘[むすめ]たちだけであった。サルパアデの娘たちの名[な]は、マフラ、ノア、ホグラ、ミルカ、ティルツァであった。"
  38: "これらはマナセの氏族[しぞく]である。その数[かず]は五万二千七百人[にん]であった。"
  39: "エフライムの子[こ]らは、その氏族[しぞく]ごとに、スタラの氏族、タナハの氏族。"
  40: "スタラの子[こ]らは、エデムの氏族[しぞく]。"
  41: "これらはエフライムの氏族[しぞく]である。その数[かず]は三万二千五百人[にん]であった。これらはヨセフの子[こ]らの氏族である。"
  42: "ベニヤミンの子[こ]らは、その氏族[しぞく]ごとに、バレの氏族、アスビルの氏族、ヤキランの氏族。"
  43: "ソファンの氏族[しぞく]。"
  44: "バレの子[こ]らはアダルとノエマンとなった。アダルの氏族[しぞく]、ノエマンの氏族。"
  45: "これらはベニヤミンの子[こ]らの氏族[しぞく]である。その数[かず]は四万五千六百人[にん]であった。"
  46: "ダンの子[こ]らは、その氏族[しぞく]ごとに、サミの氏族。これらはダンの氏族である。"
  47: "サミの氏族[しぞく]はすべて、その数[かず]は六万四千四百人[にん]であった。"
  48: "ナフタリの子[こ]らは、その氏族[しぞく]ごとに、アシエルの氏族、ガウニの氏族。"
  49: "イェセルの氏族[しぞく]、セレムの氏族。"
  50: "これらはナフタリの氏族[しぞく]である。その数[かず]は四万五千四百人[にん]であった。"
  51: "これがイスラエルの子[こ]らの数[かぞ]え上[あ]げである。六十万一千七百三十人[にん]。"
  52: "主[しゅ]はモーセに語[かた]って言[い]われた。"
  53: "「この者[もの]たちに、名[な]の数[かず]に従[したが]って、地[ち]を嗣業[しぎょう]として分[わ]け与[あた]えなさい。"
  54: "多[おお]い者[もの]にはその嗣業[しぎょう]を多[おお]くし、少[すく]ない者にはその嗣業を少[すく]なくしなさい。数[かぞ]え上[あ]げられたとおりに、それぞれにその嗣業を与[あた]えなさい。"
  55: "地[ち]はくじで分[わ]け与[あた]えなさい。父[ちち]の部族[ぶぞく]の名[な]に従[したが]って、彼[かれ]らは嗣業[しぎょう]を受[う]け継[つ]ぐ。"
  56: "彼[かれ]らの嗣業[しぎょう]は、多[おお]い者[もの]と少[すく]ない者との間[あいだ]で、くじによって分[わ]けなさい。」"
  57: "レビの子[こ]らは、その氏族[しぞく]ごとに、ゲルションの氏族、カアトの氏族、メラリの氏族。"
  58: "これらはレビの子[こ]らの氏族[しぞく]である。ロベニの氏族、ヘブロンの氏族、コラの氏族、オムシの氏族。カアトはアムラムを生[う]んだ。"
  59: "アムラムの妻[つま]の名[な]はヨカベドといい、レビの娘[むすめ]であった。彼女[かのじょ]はエジプトで、レビにこれらを産[う]んだ。彼女はアムラムにアロンとモーセ、およびその姉妹[しまい]ミリアムを産んだ。"
  60: "アロンにはナダブ、アビウ、エレアザル、イタマルが生[う]まれた。"
  61: "ナダブとアビウは、主[しゅ]の前[まえ]で異[こと]なる火[ひ]を献[ささ]げたとき、シナの荒野[こうや]で死[し]んだ。"
  62: "彼[かれ]らの数[かず]は二万三千人[にん]であった。すなわち、一[ひと]か月[げつ]以上[いじょう]の男子[だんし]すべてである。彼らはイスラエルの子[こ]らの間[あいだ]で数[かぞ]え上[あ]げられなかった。イスラエルの子らの間では、彼らにくじの嗣業[しぎょう]が与[あた]えられないからである。"
  63: "これが、モーセと祭司[さいし]エレアザルが、ヨルダン川[がわ]のほとり、エリコの向[む]かい側[がわ]にあるモアブのアラボトで、イスラエルの子[こ]らを数[かぞ]え上[あ]げた数[かず]である。"
  64: "この中[なか]には、モーセとアロンがシナの荒野[こうや]でイスラエルの子[こ]らを数[かぞ]え上[あ]げたときの、数[かぞ]えられた者[もの]は一人[ひとり]もいなかった。"
  65: "主[しゅ]が彼[かれ]らに、「彼らは荒野[こうや]で死[し]ぬであろう」と言[い]われたからである。彼らのうち、イェフォンネの子[こ]カレブと、ヌンの子ヨシュアのほかは、一人[ひとり]も残[のこ]らなかった。"

notes:
  1: "μετὰ τὴν πληγήν — после поражения (πληγή, 災い). Формула «сказал Господь Моисею и Елеазару, говоря»; в LXX Елеазар назван просто ὁ ἱερεύς, без «сын Аарона» (это добавление ru)."
  2: "Λαβὲ τὴν ἀρχὴν πάσης συναγωγῆς — «возьми начало (итог) всего общества», т. е. произведи счисление (ἀρχή здесь «начаток, сумма»; отсюда 数え上げなさい). ἀπὸ εἰκοσαετοῦς καὶ ἐπάνω — от двадцатилетнего и выше. κατ᾿ οἴκους πατριῶν — по домам отцов. πᾶς ὁ ἐκπορευόμενος παρατάξασθαι — «всякий, выходящий встать в строй» (παρατάσσω)."
  3: "ἐν Αραβωθ Μωαβ — на равнинах Моавитских (Аравоф). ἐπὶ τοῦ Ιορδάνου κατὰ Ιεριχω — при Иордане, против Иерихона. λέγων вводит содержание ст. 4, поэтому в японском стоит «言った» с точкой. В csl добавлено «к ним», чего в греч. нет, — не внесено."
  4: "ἀπὸ εἰκοσαετοῦς καὶ ἐπάνω — повтор условия; ὃν τρόπον συνέταξεν κύριος τῷ Μωυσῇ — как повелел Господь Моисею. οἱ ἐξελθόντες ἐξ Αἰγύπτου — вышедшие из Египта; с них начинается список родов."
  5: "Ρουβην πρωτότοκος Ισραηλ — Рувим, первенец Израиля. υἱοὶ δὲ Ρουβην· Ενωχ καὶ δῆμος τοῦ Ενωχ — Енох и род Енохов (δῆμος, 氏族). τῷ Φαλλου δῆμος τοῦ Φαλλουι — Фаллу — род Фаллуев (суффикс -ι в греч. образует притяжательную форму рода; отдельно не передаётся)."
  6: "τῷ Ασρων δῆμος τοῦ Ασρωνι· τῷ Χαρμι δῆμος τοῦ Χαρμι — Асрону род Асронов, Хармию род Хармиев; в японском оба члена сведены к единой формуле «Xの氏族»."
  7: "οὗτοι δῆμοι Ρουβην — вот роды Рувимовы. ἡ ἐπίσκεψις αὐτῶν — счисление их (ἐπίσκεψις). τρεῖς καὶ τεσσαράκοντα χιλιάδες καὶ ἑπτακόσιοι καὶ τριάκοντα — 43 730 (букв. «три и сорок тысяч, семьсот и тридцать»)."
  8: "υἱοὶ Φαλλου· Ελιαβ — сыны Фаллу: Елиав (в LXX здесь именительный Ελιαβ, без артикля)."
  9: "Ναμουηλ, Δαθαν, Αβιρων — Намуил, Дафан, Авирон. ἐπίκλητοι τῆς συναγωγῆς — «призванные (известные) в собрании» (ἐπίκλητος; слав. «нарочитии»). οἱ ἐπισυστάντες ἐπὶ Μωυσῆν καὶ Ααρων — восставшие на Моисея и Аарона (ἐφίστημι). ἐν τῇ συναγωγῇ Κορε — в собрании Корея. ἐν τῇ ἐπισυστάσει κυρίου — в возмущении против Господа."
  10: "ἀνοίξασα ἡ γῆ τὸ στόμα αὐτῆς κατέπιεν — земля, открыв уста, поглотила (καταπίνω). ἐν τῷ θανάτῳ τῆς συναγωγῆς αὐτοῦ — «в смерти собрания его», т. е. когда погибло его сборище. κατέφαγεν τὸ πῦρ τοὺς πεντήκοντα καὶ διακοσίους — огонь пожрал двести пятьдесят. ἐγενήθησαν ἐν σημείῳ — стали знамением (σημεῖον)."
  11: "οἱ δὲ υἱοὶ Κορε οὐκ ἀπέθανον — сыны Корея не умерли; слав. «не измроша»."
  12: "ὁ δῆμος τῶν υἱῶν Συμεων — род сынов Симеона. τῷ Ναμουηλ δῆμος ὁ Ναμουηλι — Намуилу род Намуилов; далее Ιαμιν, Ιαχιν (Ямин, Якин; ср. Исх 6:15)."
  13: "τῷ Ζαρα δῆμος ὁ Ζαραι — Заре род Зарин. τῷ Σαουλ δῆμος ὁ Σαουλι — Саулу род Саулов."
  14: "οὗτοι δῆμοι Συμεων ἐκ τῆς ἐπισκέψεως αὐτῶν — вот роды Симеоновы по счислению их. δύο καὶ εἴκοσι χιλιάδες καὶ διακόσιοι — 22 200."
  15: "Υἱοὶ δὲ Ιουδα· Ηρ καὶ Αυναν — сыны Иуды: Ир и Аунан. ἀπέθανεν — в LXX глагол в единственном числе при двух подлежащих (ср. Быт 46:12). В этом стихе LXX не перечисляет родов Иуды — они начинаются со ст. 16."
  16: "ἐγένοντο δὲ οἱ υἱοὶ Ιουδα κατὰ δήμους αὐτῶν — «стали сыны Иуды по родам их». τῷ Σηλων δῆμος ὁ Σηλωνι — Шеле род Шелин (в корпусе シェラ, ср. Быт 46:12). Φαρες — ペレツ, Ζαρα — ゼラ: формы корпуса, в LXX Φαρες, Ζαρα."
  17: "υἱοὶ Φαρες — сыны Фареса. τῷ Ασρων δῆμος ὁ Ασρωνι — Асрону род Асронов. τῷ Ιαμουν δῆμος ὁ Ιαμουνι — Иамуну род Иамунов (в Быт 46:12 то же лицо названо Ιεμουηλ)."
  18: "οὗτοι δῆμοι τῷ Ιουδα κατὰ τὴν ἐπισκοπὴν αὐτῶν — вот роды Иуды по счислению их. ἓξ καὶ ἑβδομήκοντα χιλιάδες καὶ πεντακόσιοι — 76 500."
  19: "Υἱοὶ Ισσαχαρ κατὰ δήμους αὐτῶν — сыны Иссахара по родам их. τῷ Θωλα δῆμος ὁ Θωλαι — Фоле род Фолин (в корпусе トラ). τῷ Φουα δῆμος ὁ Φουαι — Фуве род Фувин (プア)."
  20: "τῷ Ιασουβ δῆμος ὁ Ιασουβι — Иашуву род Иашувов (ヤシュブ). τῷ Σαμαραν δῆμος ὁ Σαμαρανι — Самарану род Самаранов."
  21: "οὗτοι δῆμοι Ισσαχαρ ἐξ ἐπισκέψεως αὐτῶν — вот роды Иссахара по счислению их. τέσσαρες καὶ ἑξήκοντα χιλιάδες καὶ τριακόσιοι — 64 300."
  22: "Υἱοὶ Ζαβουλων κατὰ δήμους αὐτῶν — сыны Завулона по родам их. Σαρεδ — セレド (в Быт 46:14 Σερεδ). Αλλων — エロン (в LXX Αλλων; чтобы не смешивать с Аароном, アロン). Αλληλ — アレル."
  23: "οὗτοι δῆμοι Ζαβουλων ἐξ ἐπισκέψεως αὐτῶν — вот роды Завулона по счислению их: 60 500 (ἑξήκοντα χιλιάδες καὶ πεντακόσιοι)."
  24: "Υἱοὶ Γαδ κατὰ δήμους αὐτῶν — сыны Гада по родам их. Σαφων (サフォン), Αγγι (アンギ), Σουνι (スニ) — в Быт 46:16 те же имена даны в иных греческих формах (Αγγις, Σαυνις)."
  25: "τῷ Αζενι δῆμος ὁ Αζενι — Озни род Озниев. τῷ Αδδι δῆμος ὁ Αδδι — Адди род Аддиев."
  26: "τῷ Αροαδι δῆμος ὁ Αροαδι — Ароди род Ародиев. τῷ Αριηλ δῆμος ὁ Αριηλι — Ариилу род Ариилов."
  27: "οὗτοι δῆμοι υἱῶν Γαδ ἐξ ἐπισκέψεως αὐτῶν — вот роды сынов Гада по счислению их. τεσσαράκοντα χιλιάδες καὶ πεντακόσιοι — 40 500."
  28: "Υἱοὶ Ασηρ κατὰ δήμους αὐτῶν — сыны Асира по родам их. Ιαμιν (ヤミン), Ιεσου (イェス), Βαρια (バリア). В LXX Ιεσου — краткая форма; в Быт 46:17 Ιεσουα."
  29: "τῷ Χοβερ δῆμος ὁ Χοβερι — Ховеру род Ховеров. τῷ Μελχιηλ δῆμος ὁ Μελχιηλι — Мелхиилу род Мелхиилов."
  30: "καὶ τὸ ὄνομα θυγατρὸς Ασηρ Σαρα — имя дочери Асира Сара (единственная женщина, названная в переписи, кроме дочерей Салпаада)."
  31: "οὗτοι δῆμοι Ασηρ ἐξ ἐπισκέψεως αὐτῶν — вот роды Асира по счислению их: 53 400 (τρεῖς καὶ πεντήκοντα χιλιάδες καὶ τετρακόσιοι)."
  32: "Υἱοὶ Ιωσηφ κατὰ δήμους αὐτῶν· Μανασση καὶ Εφραιμ — сыны Иосифа по родам их: Манассия и Ефрем."
  33: "υἱοὶ Μανασση· τῷ Μαχιρ δῆμος ὁ Μαχιρι — Махиру род Махиров. καὶ Μαχιρ ἐγέννησεν τὸν Γαλααδ — Махир родил Галаада (ギレアデ, форма корпуса). τῷ Γαλααδ δῆμος ὁ Γαλααδι — Галааду род Галаадов."
  34: "καὶ οὗτοι υἱοὶ Γαλααδ — и вот сыны Галаада. Αχιεζερ (アキエゼル), Χελεγ (ヘレグ)."
  35: "τῷ Εσριηλ δῆμος ὁ Εσριηλι — Есриилу род Есриилов. τῷ Συχεμ δῆμος ὁ Συχεμι — Сихему род Сихемов."
  36: "τῷ Συμαερ δῆμος ὁ Συμαερι — Сумаеру род Сумаеров. καὶ τῷ Οφερ δῆμος ὁ Οφερι — и Оферу род Оферов."
  37: "τῷ Σαλπααδ υἱῷ Οφερ οὐκ ἐγένοντο αὐτῷ υἱοί, ἀλλ᾿ ἢ θυγατέρες — у Салпаада, сына Офера, не было сыновей, а только дочери. Имена дочерей в LXX: Μαλα, Νουα, Εγλα, Μελχα, Θερσα; в тексте — マフラ, ノア, ホグラ, ミルカ, ティルツァ (формы, принятые в этой книге, ср. гл. 27)."
  38: "οὗτοι δῆμοι Μανασση ἐξ ἐπισκέψεως αὐτῶν — вот роды Манассии по счислению их: 52 700 (δύο καὶ πεντήκοντα χιλιάδες καὶ ἑπτακόσιοι)."
  39: "καὶ οὗτοι υἱοὶ Εφραιμ — и вот сыны Ефрема. τῷ Σουταλα δῆμος ὁ Σουταλαι — Сутале род Суталин (в Быт 46:20 Σουταλααμ). τῷ Ταναχ δῆμος ὁ Ταναχι — Танаху род Танахов."
  40: "οὗτοι υἱοὶ Σουταλα· τῷ Εδεν δῆμος ὁ Εδενι — вот сыны Суталы: Едену род Еденов (в Быт 46:20 Εδεμ)."
  41: "οὗτοι δῆμοι Εφραιμ ἐξ ἐπισκέψεως αὐτῶν — 32 500. οὗτοι δῆμοι υἱῶν Ιωσηφ κατὰ δήμους αὐτῶν — вот роды сынов Иосифа по родам их."
  42: "Υἱοὶ Βενιαμιν κατὰ δήμους αὐτῶν — сыны Вениамина по родам их. Βαλε (バレ; в Быт 46:21 Βαλα), Ασυβηρ (アスビル), Ιαχιραν (ヤキラン)."
  43: "τῷ Σωφαν δῆμος ὁ Σωφανι — Софану род Софанов. В csl этот стих слит с предыдущим (нумерация csl смещена)."
  44: "καὶ ἐγένοντο οἱ υἱοὶ Βαλε Αδαρ καὶ Νοεμαν — и стали сыны Вале: Адар и Ноеман. τῷ Αδαρ δῆμος ὁ Αδαρι — Адару род Адаров. τῷ Νοεμαν δῆμος ὁ Νοεμανι — Ноеману род Ноеманов."
  45: "οὗτοι υἱοὶ Βενιαμιν κατὰ δήμους αὐτῶν ἐξ ἐπισκέψεως αὐτῶν — вот сыны Вениамина по родам их, по счислению: 45 600 (πέντε καὶ τεσσαράκοντα χιλιάδες καὶ ἑξακόσιοι)."
  46: "Υἱοὶ Δαν κατὰ δήμους αὐτῶν — сыны Дана по родам их. τῷ Σαμι δῆμος ὁ Σαμι — Сами род Самиев. οὗτοι δῆμοι Δαν κατὰ δήμους αὐτῶν — вот роды Дана по родам их."
  47: "πάντες οἱ δῆμοι Σαμι κατ᾿ ἐπισκοπὴν αὐτῶν — все роды Сами по счислению их, 64 400 (τέσσαρες καὶ ἑξήκοντα χιλιάδες καὶ τετρακόσιοι)."
  48: "Υἱοὶ Νεφθαλι κατὰ δήμους αὐτῶν — сыны Неффалима по родам их. Ασιηλ (アシエル), Γαυνι (ガウニ)."
  49: "τῷ Ιεσερ δῆμος ὁ Ιεσερι — Иесеру род Иесеров. τῷ Σελλημ δῆμος ὁ Σελλημι — Селлему род Селлемов."
  50: "οὗτοι δῆμοι Νεφθαλι ἐξ ἐπισκέψεως αὐτῶν — вот роды Неффалима по счислению их: 45 400 (πέντε καὶ τεσσαράκοντα χιλιάδες καὶ τετρακόσιοι)."
  51: "Αὕτη ἡ ἐπίσκεψις υἱῶν Ισραηλ — вот счисление сынов Израиля. ἑξακόσιαι χιλιάδες καὶ χίλιοι καὶ ἑπτακόσιοι καὶ τριάκοντα — 601 730."
  52: "Формула ἐλάλησεν κύριος πρὸς Μωυσῆν λέγων; речь — с 53-го стиха."
  53: "Τούτοις μερισθήσεται ἡ γῆ — «им разделится земля» (μερίζω, будущее). κληρονομεῖν ἐξ ἀριθμοῦ ὀνομάτων — в наследие по числу имён (ἀριθμός, ὄνομα)."
  54: "τοῖς πλείουσιν πλεονάσεις τὴν κληρονομίαν — «большим умножишь удел» (πλεονάζω). τοῖς ἐλάττοσιν ἐλαττώσεις — меньшим уменьшишь (ἐλαττόω). ἑκάστῳ καθὼς ἐπεσκέπησαν δοθήσεται — каждому, как был исчислен, дастся."
  55: "διὰ κλήρων μερισθήσεται ἡ γῆ — по жребиям разделится земля (κλῆρος, くじ). τοῖς ὀνόμασιν κατὰ φυλὰς πατριῶν αὐτῶν — «по именам, по племенам отцов их»."
  56: "ἐκ τοῦ κλήρου μεριεῖς τὴν κληρονομίαν αὐτῶν — «от жребия разделишь удел их». ἀνὰ μέσον πολλῶν καὶ ὀλίγων — между многими и малыми."
  57: "Υἱοὶ Λευι κατὰ δήμους αὐτῶν — сыны Левия по родам их: Γεδσων (ゲルション), Κααθ (カアト), Μεραρι (メラリ); формы корпуса, ср. Исх 6:16."
  58: "οὗτοι δῆμοι υἱῶν Λευι — вот роды сынов Левия. Λοβενι (ロベニ), Χεβρωνι (ヘブロン), Κορε (コラ), Μουσι (オムシ; в Исх 6:19 Ομουσι, ср. Числ 3:20). καὶ Κααθ ἐγέννησεν τὸν Αμραμ — и Кааф родил Амрама."
  59: "τὸ ὄνομα τῆς γυναικὸς αὐτοῦ Ιωχαβεδ θυγάτηρ Λευι — имя жены его Иохаведа, дочь Левия. ἣ ἔτεκεν τούτους τῷ Λευι ἐν Αἰγύπτῳ — она родила их Левию в Египте. ἔτεκεν τῷ Αμραμ τὸν Ααρων καὶ Μωυσῆν καὶ Μαριαμ — родила Амраму Аарона, Моисея и Мариам."
  60: "ἐγεννήθησαν τῷ Ααρων ὅ τε Ναδαβ καὶ Αβιουδ καὶ Ελεαζαρ καὶ Ιθαμαρ — у Аарона родились Надав, Авиуд, Елеазар и Ифамар."
  61: "ἐν τῷ προσφέρειν αὐτοὺς πῦρ ἀλλότριον — когда они приносили чуждый огонь (ἀλλότριος). ἔναντι κυρίου — пред Господом. ἐν τῇ ἐρήμῳ Σινα — в пустыне Сина."
  62: "ἐγενήθησαν ἐξ ἐπισκέψεως αὐτῶν τρεῖς καὶ εἴκοσι χιλιάδες — 23 000 по счислению их (не 22 000, как в гл. 3: здесь считаются все мужского пола от месяца). πᾶν ἀρσενικὸν ἀπὸ μηνιαίου καὶ ἐπάνω — всё мужское от месячного возраста и выше. οὐ γὰρ συνεπεσκέπησαν — ибо не были исчислены вместе (συνεπισκέπτομαι). οὐ δίδοται αὐτοῖς κλῆρος — не даётся им жребий."
  63: "Καὶ αὕτη ἡ ἐπίσκεψις Μωυσῆ καὶ Ελεαζαρ — и вот счисление Моисея и Елеазара. οἳ ἐπεσκέψαντο — которые исчислили. ἐν Αραβωθ Μωαβ ἐπὶ τοῦ Ιορδάνου κατὰ Ιεριχω — на равнинах Моава при Иордане против Иерихона."
  64: "καὶ ἐν τούτοις οὐκ ἦν ἄνθρωπος τῶν ἐπεσκεμμένων — и в этих не было человека из исчисленных (perfect от ἐπισκέπτομαι). ὑπὸ Μωυσῆ καὶ Ααρων — Моисеем и Аароном. ἐν τῇ ἐρήμῳ Σινα — в пустыне Сина."
  65: "Θανάτῳ ἀποθανοῦνται — «смертью умрут» (внутренний винительный при ἀποθνήσκω, усилительно). οὐ κατελείφθη ἐξ αὐτῶν οὐδὲ εἷς — не остался из них ни один (καταλείπω). πλὴν Χαλεβ υἱὸς Ιεφοννη καὶ Ἰησοῦς ὁ τοῦ Ναυη — кроме Халева, сына Иефоннии, и Иисуса, сына Навина (ヌンの子ヨシュア, ср. Исх 17:9)."
