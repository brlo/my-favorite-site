# jp-box, 1-я Паралипоменон, глава 1. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); церковнославянский (csl-ru) — второй свидетель
# церковного текста: слав. чтения и добавки входят в основной текст без 〔…〕,
# вариант LXX — в notes. ru (Синодальный) — только для понимания, не источник.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 1: от Адама до Ноя (1–4); сыны Иафета (5–7), Хама (8–16), Сима (17–23);
# от Сима до Авраама (24–27); сыны Авраама — Измаил (28–31) и Хеттура (32–33);
# Исаак и Исав (34); сыны Исава (35–37); сыны Сеира (38–42); цари Едома (43–50)
# и его старейшины (51–54).
# Глава почти целиком повторяет Быт 10 (народы), 11:10–26, 25:1–16 и 36 (Едом),
# поэтому имена взяты в формах корпуса; греческие формы 1 Пар, где они расходятся,
# приведены в notes. Имена, которых в корпусе нет, транслитерированы с греческого.
# Дефект модуля: в gr-lxx-byz на месте стихов 11–16 и 18–23 стоит «.» (лакуна);
# они переведены по csl-ru с опорой на параллель Быт 10:13–29 — сказано в notes.
# Речи нет; красного нет.
# Сносок ⟨…⟩ нет: 巨人, 側女, 族長 уже пояснены в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: 1par
chapter: 1
draft: true

verses:
  1: "アダム、セツ、エノシュ。"
  2: "ケナン、マハラレル、イエレド。"
  3: "エノク、メトシェラ、レメク。"
  4: "ノア。ノアの子[こ]らは、セム、ハム、ヤフェトである。"
  5: "ヤフェトの子[こ]らは、ガメル、マゴグ、マダイ、ヨワン、エリサ、トベル、モソク、ティラスである。"
  6: "ガメルの子[こ]らは、アスカナズ、リファト、トルガマである。"
  7: "ヨワンの子[こ]らは、エリサ、タルシス、キティム人[じん]、ロドス人[じん]である。"
  8: "ハムの子[こ]らは、クシュ、ミツライム、プト、カナンである。"
  9: "クシュの子[こ]らは、セバ、エビラ、サバタ、レグマ、サバカタである。レグマの子[こ]らは、セバ、ダダンである。"
  10: "クシュはニムロデを生[う]んだ。彼[かれ]は地[ち]の上[うえ]で巨人[きょじん]の狩人[かりゅうど]となり始[はじ]めた。"
  11: "ミツライムはルディム、エネメティム、ラビム、ネフタリムを生[う]んだ。"
  12: "またファフェロイム、パトロソニム、カスロニムを生[う]んだ。フィリスティムはそこから出[で]た。またカフトリムを生[う]んだ。"
  13: "カナンは長子[ちょうし]シドンとヘト人[じん]を生[う]んだ。"
  14: "またエブス人[じん]、アモル人[じん]、ゲルゲシ人[じん]、"
  15: "またエビ人[じん]、アルキ人[じん]、アセンナイ人[じん]、"
  16: "またアラディ人[じん]、サマライ人[じん]、アマティ人[じん]を生[う]んだ。"
  17: "セムの子[こ]らは、エラム、アシュル、アルファクサド、ルド、アラム、オス、ウル、ガテル、モソクである。"
  18: "アルファクサドはカイナンを生[う]み、カイナンはサラを生[う]み、サラはエベルを生[う]んだ。"
  19: "エベルには二人[ふたり]の子[こ]が生[う]まれた。一人[ひとり]の名[な]はペレグといった。彼[かれ]の日[ひ]に地[ち]が分[わ]かれたからである。兄弟[きょうだい]の名[な]はヨクタンといった。"
  20: "ヨクタンはエルモダド、サレフ、アサルモト、ヤラハ、"
  21: "オドラ、アイゼル、デクラ、"
  22: "アビメエル、サベウ、"
  23: "オフィル、エビラ、ヨバブを生[う]んだ。これらはすべてヨクタンの子[こ]たちである。"
  24: "セムの子[こ]らは、アルファクサド、カイナン、サラである。"
  25: "エベル、ペレグ、ラガウ、"
  26: "セルフ、ナホル、テラ、"
  27: "アブラム、すなわちアブラハムである。"
  28: "アブラハムの子[こ]らは、イサクとイシュマエルである。"
  29: "これが長子[ちょうし]イシュマエルの系図[けいず]である。ナバイオト、次[つぎ]にケダル、ナブデエル、マッサム、"
  30: "マスマ、イドマ、マッセ、ホダド、テマン、"
  31: "イェトル、ナフェス、ケドマである。これらはイシュマエルの子[こ]たちである。"
  32: "アブラハムの側女[そばめ]ケトゥラの子[こ]らは、ゼムラン、イェクサン、マダン、ミディアム、イェスボク、ソエである。イェクサンの子[こ]らは、サバ、デダンである。デダンの子[こ]らは、ラグエル、ナブデエル、アスリム、ラトシム、ロオミムである。"
  33: "ミディアムの子[こ]らは、ガイファ、アフェル、エノク、アビラ、エルラガである。これらはすべてケトゥラの子[こ]たちである。"
  34: "アブラハムはイサクを生[う]んだ。イサクの子[こ]らは、エサウ、イスラエルである。"
  35: "エサウの子[こ]らは、エリファズ、レウエル、イエウシュ、ヤラム、コラである。"
  36: "エリファズの子[こ]らは、テマン、オマル、ツェフォ、ガタム、ケナズ。ティムナはエリファズの側女[そばめ]で、彼[かれ]にアマレクを産[う]んだ。"
  37: "レウエルの子[こ]らは、ナハト、ゼラ、シャンマ、ミザである。"
  38: "セイルの子[こ]らは、ロタン、ショバル、ツィブオン、アナ、ディション、エツェル、ディシャンである。"
  39: "ロタンの子[こ]らは、ホリとヘマンである。ロタンの妹[いもうと]はティムナであった。"
  40: "ショバルの子[こ]らは、アルワン、マナハト、エバル、シェフォ、オナムである。ツィブオンの子[こ]らは、アヤ、アナである。"
  41: "アナの子[こ]はディションである。ディションの子[こ]らは、ヘムダン、エシュバン、イトラン、ケラハである。"
  42: "エツェルの子[こ]らは、ビルハン、ザアワン、アカンである。ディシャンの子[こ]らは、ウツ、アランである。"
  43: "これらは、イスラエルの子[こ]らに王[おう]が治[し]める前[まえ]に、エドムの地[ち]を治めた王[おう]たちである。ベオルの子[こ]ベラ、その町[まち]の名[な]はディンハバであった。"
  44: "ベラが死[し]ぬと、代[か]わって、ボツラから来[き]たザラの子[こ]ヨバブが治[し]めた。"
  45: "ヨバブが死ぬと、代わって、テマン人[じん]の地[ち]から来たフシャムが治めた。"
  46: "フシャムが死ぬと、代わって、ベダドの子[こ]ハダドが治めた。彼[かれ]はモアブの野[の]でミディアン人[じん]を打[う]ち破[やぶ]った者[もの]で、その町[まち]の名[な]はゲッタイムであった。"
  47: "ハダドが死ぬと、代わって、マスレカから来たサムラが治めた。"
  48: "サムラが死ぬと、代わって、川[かわ]のほとりのレホボトから来たシャウルが治めた。"
  49: "シャウルが死ぬと、代わって、アフボルの子[こ]バアル・ハナンが治めた。"
  50: "バアル・ハナンが死ぬと、代わって、ハダルが治めた。その町[まち]の名[な]はパウ、妻[つま]の名[な]はメヘタブエルで、マトレドの娘[むすめ]、メザハブの孫[まご]にあたる。"
  51: "ハダルが死[し]んだ。エドムには族長[ぞくちょう]たちがいた。族長ティムナ、族長アルワ、族長エテル、"
  52: "族長オホリバマ、族長エラ、族長ピノン、"
  53: "族長ケナズ、族長テマン、族長ミブツァル、"
  54: "族長マグディエル、族長イラム。これらはエドムの族長[ぞくちょう]たちである。"

notes:
  1: "Αδαμ, Σηθ, Ενως — アダム、セツ、エノシュ. 1 Пар 1:1–4 сокращает Быт 5; имена даны в формах корпуса (Быт 5:3–9): греч. Σηθ там セツ, Ενως — エノシュ (в 1 Пар эти же формы читались бы セト, エノス). В греч. нет глаголов — только перечень, как и в японском."
  2: "Καιναν, Μαλελεηλ, Ιαρεδ — ケナン、マハラレル、イエレド: формы Быт 5:9–15; в Быт 11:12 то же имя Καιναν передано カイナン. Греч. Μαλελεηλ — евр. Малелеил."
  3: "Ενωχ, Μαθουσαλα, Λαμεχ — エノク、メトシェラ、レメク (Быт 5:18–25). Греч. Μαθουσαλα передано формой корпуса メトシェラ, Λαμεχ — レメク."
  4: "Νωε. υἱοὶ Νωε· Σημ, Χαμ, Ιαφεθ — «Ной. Сыны Ноя: Сим, Хам, Иафет». В гр. «Νωε» завершает список ст. 3 и начинает новый раздел; слав. «ное, сим, хам, иафеф» даёт сплошной перечень. Имена — Быт 10:1."
  5: "Υἱοὶ Ιαφεθ· Γαμερ, Μαγωγ, Μαδαι, Ιωυαν, Ελισα, Θοβελ, Μοσοχ καὶ Θιρας — ガメル、マゴグ、マダイ、ヨワン、エリサ、トベル、モソク、ティラス (Быт 10:2). В евр. и Синод. иные формы: Гомер, Иаван, Фувал, Мешех."
  6: "καὶ υἱοὶ Γαμερ· Ασχαναζ καὶ Ριφαθ καὶ Θοργαμα — アスカナズ、リファト、トルガマ (Быт 10:3). Καί связывает стихи в один ряд, поэтому без нового зачина."
  7: "καὶ υἱοὶ Ιωυαν· Ελισα καὶ Θαρσις, Κιτιοι καὶ Ροδιοι — エリサ、タルシス、キティム人、ロドス人. В LXX названы народы (Κιτιοι, Ροδιοι), а не лица; слав. «хеттим и доданим» следует иному чтению (МТ: Киттим и Доданим). Имя Елиса повторено из ст. 5, как в гр."
  8: "Καὶ υἱοὶ Χαμ· Χους καὶ Μεστραιμ, Φουδ καὶ Χανααν — クシュ、ミツライム、プト、カナン (Быт 10:6). Μεστραιμ — евр. Мицраим (Египет), Φουδ — Фут."
  9: "καὶ υἱοὶ Χους· Σαβα καὶ Ευιλατ καὶ Σαβαθα καὶ Ρεγμα καὶ Σεβεκαθα. καὶ υἱοὶ Ρεγμα· Σαβα καὶ Ουδαδαν — セバ、エビラ、サバタ、レグマ、サバカタ; сыны Регмы: セバ、ダダン. В 1 Пар греч. Ευιλατ и Ουδαδαν (в Быт 10:7 — Ευιλα, Δαδαν), поэтому взяты формы корпуса エビラ, ダダン."
  10: "καὶ Χους ἐγέννησεν τὸν Νεβρωδ· οὗτος ἤρξατο τοῦ εἶναι γίγας κυνηγὸς ἐπὶ τῆς γῆς — «Хуш родил Нимрода; он начал быть исполином-охотником на земле» (γίγας — исполин, κυνηγός — охотник). Слав. «исполин ловец», Синод. «сильный на земле»."
  11: "В gr-lxx-byz на месте стиха «.» — лакуна (дефект модуля). Перевод по csl-ru: «Месраим же роди Лудиима и Анамиима, и Лавиима и Неффосеимы»; имена даны в формах Быт 10:13 — ルディム、エネメティム、ラビム、ネフタリム (евр. Лудим, Анамим, Легавим, Нафтухим). Настоящее историческое: «родил» — о народе-предке."
  12: "На месте стиха «.» — лакуна. По csl-ru: «и Фафероимы и Патросониимы, и Хаслоимы, от нихже изыдоша Филистими, и Каффоримы» — ファフェロイム、パトロソニム、カスロニム, от них フィリスティム, и カフトリム. Имена パトロソニム, カスロニム даны в формах Быт 10:14; слав. «фафероимы» (Φεττορειμ, Патрусим) — вероятно, дубль того же народа."
  13: "На месте стиха «.» — лакуна. По csl-ru: «Ханаан же роди Сидона первенца своего и Хеттеа» — シドン, ヘト人 (Быт 10:15: Χανααν ἐγέννησεν τὸν Σιδωνα τὸν πρωτότοκον αὐτοῦ καὶ τὸν Χετταῖον)."
  14: "На месте стиха «.» — лакуна. По csl-ru: «и Иевусеа и Аморреа, и Гергесеа» — エブス人、アモル人、ゲルゲシ人 (Быт 10:16)."
  15: "На месте стиха «.» — лакуна. По csl-ru: «и Евеа, и Арукеа и Асенеа» — エビ人、アルキ人、アセンナイ人 (Быт 10:17)."
  16: "На месте стиха «.» — лакуна. По csl-ru: «и Арадиа и Самареа и Амафиа» — アラディ人、サマライ人、アマティ人 (Быт 10:18)."
  17: "Υἱοὶ Σημ· Αιλαμ καὶ Ασσουρ καὶ Αρφαξαδ — エラム、アシュル、アルファクサド. Греч. стих на этом обрывается (запятая); продолжение есть только в csl: «и Луд и Арам. Сынове же Арамли: Уз и Ул, и Гефер и Мосох» — ルド、アラム、オス、ウル、ガテル、モソク (Быт 10:22–23). По паритету внесено в текст."
  18: "На месте стиха «.» — лакуна. По csl-ru: «Арфаксад же роди Каинана, Каинан же роди Салу, Сала же роди Евера» — アルファクサド、カイナン、サラ、エベル (Быт 10:24). Второй Каинан есть в LXX (и у Лк 3:36), в евр. и Синод. его нет."
  19: "На месте стиха «.» — лакуна. По csl-ru: «Еверу же родистася два сына: имя единому Фалек, яко бо дни его разделена бысть земля, и имя брату его Иектан» — ペレグ、ヨクタン (Быт 10:25). Φαλεκ — евр. Пелег, «разделение»."
  20: "На месте стиха «.» — лакуна. По csl-ru: «Иектан же роди Елмодада и Салефа, и Асермофа и Иадера» — エルモダド、サレフ、アサルモト、ヤラハ (Быт 10:26)."
  21: "На месте стиха «.» — лакуна. По csl-ru: «и Адорама и Узала, и Деклу» — オドラ、アイゼル、デクラ (Быт 10:27; слав. «адорама» передаёт евр. Хадорам)."
  22: "На месте стиха «.» — лакуна. По csl-ru: «и Гамаала, и Авимеила и Саву» — アビメエル、サベウ (Быт 10:28)."
  23: "На месте стиха «.» — лакуна. По csl-ru: «и Уфира и Евилата и Иоава: вси сии сынове Иектановы» — オフィル、エビラ、ヨバブ; итоговая формула (Быт 10:29)."
  24: "Σαλα — サラ. Греч. стих содержит только это имя (продолжение списка после ст. 17); в csl он полнее: «Сынове же симовы: Арфаксад, Каинан, Сала» — по паритету внесено в текст. Ср. Быт 11:10–12."
  25: "Εβερ, Φαλεκ, Ραγαυ — エベル、ペレグ、ラガウ (Быт 11:14–18)."
  26: "Σερουχ, Ναχωρ, Θαρα — セルフ、ナホル、テラ (Быт 11:20–24)."
  27: "Αβρααμ — アブラム, «он же Авраам» (слав. «той есть авраам»). В гр. только Αβρααμ; слав. и Синод. сохраняют оба имени, поэтому в тексте оба."
  28: "Υἱοὶ δὲ Αβρααμ· Ισαακ καὶ Ισμαηλ — イサク、イシュマエル (Быт 25:9, 12). δέ — противительно-соединительное, в японском не передаётся."
  29: "αὗται δὲ αἱ γενέσεις πρωτοτόκου Ισμαηλ· Ναβαιωθ καὶ Κηδαρ, Ναβδεηλ, Μαβσαν — «вот поколения первенца Измаила: Наваиоф, Кедар, Навдеил, Мавсан» (γένεσις — происхождение, родословие; πρωτότοκος — первенец). Измаил — первенец Авраама (Быт 16:15); имена — Быт 25:13."
  30: "Μασμα, Ιδουμα, Μασση, Χοδδαδ, Θαιμαν — マスマ、イドマ、マッセ、ホダド、テマン (Быт 25:14). Греч. Ιδουμα — евр. Дума."
  31: "Ιεττουρ, Ναφες καὶ Κεδμα. οὗτοί εἰσιν υἱοὶ Ισμαηλ — イェトル、ナフェス、ケドマ; «это сыны Измаила» (Быт 25:15). Слав. «иетур», Синод. «Иетур»."
  32: "καὶ υἱοὶ Χεττουρας παλλακῆς Αβρααμ· καὶ ἔτεκεν αὐτῷ τὸν Ζεμβραν, Ιεξαν, Μαδαν, Μαδιαμ, Σοβακ, Σωε. καὶ υἱοὶ Ιεξαν· Σαβα καὶ Δαιδαν — ケトゥラ, её сыны: ゼムラン、イェクサン、マダン、ミディアム、イェスボク、ソエ; сыны Иексана: サバ、デダン (Быт 25:1–3). παλλακή — 側女 (наложница), слав. «подложница». Слав. добавляет ещё «Сынове же дедановы: рагуил и навдеил, и ассуриим и латусиим и асомин» — в гр. 1 Пар этого нет; по паритету внесено в текст, имена — Быт 25:3."
  33: "καὶ υἱοὶ Μαδιαμ· Γαιφα καὶ Οφερ καὶ Ενωχ καὶ Αβιδα καὶ Ελδαα. πάντες οὗτοι υἱοὶ Χεττουρας — ガイファ、アフェル、エノク、アビラ、エルラガ (Быт 25:4). Слав. в конце добавляет «Роди же авраам исаака» — дубль начала ст. 34, в текст не внесён."
  34: "Καὶ ἐγέννησεν Αβρααμ τὸν Ισαακ. καὶ υἱοὶ Ισαακ· Ησαυ καὶ Ιακωβ — «Авраам родил Исаака. Сыны Исаака: Исав и Иаков». В гр. Ιακωβ, в слав. «исав и израиль»; по паритету в тексте イスラエル, греч. вариант — ヤコブ."
  35: "Υἱοὶ Ησαυ· Ελιφας καὶ Ραγουηλ καὶ Ιεουλ καὶ Ιεγλομ καὶ Κορε — エリファズ、レウエル、イエウシュ、ヤラム、コラ (формы Быт 36:4–5; греч. 1 Пар: Ελιφας, Ραγουηλ, Ιεουλ, Ιεγλομ, Κορε; слав. «иевул», «иеглом», «корей»)."
  36: "υἱοὶ Ελιφας· Θαιμαν καὶ Ωμαρ, Σωφαρ καὶ Γοωθαμ καὶ Κενεζ καὶ τῆς Θαμνα Αμαληκ — テマン、オマル、ツェフォ、ガタム、ケナズ, и от Тимны — Амалек. Греч. сжато: «и Тимны Амалик»; слав. разворачивает: «Фамна же подложница елифазова роди ему амалика» — по нему и переведено (ср. Быт 36:11–12)."
  37: "καὶ υἱοὶ Ραγουηλ· Ναχεθ, Ζαρε, Σομε καὶ Μοζε — ナハト、ゼラ、シャンマ、ミザ (Быт 36:13)."
  38: "υἱοὶ Σηιρ· Λωταν, Σωβαλ, Σεβεγων, Ανα, Δησων, Ωσαρ, Δαισων — ロタン、ショバル、ツィブオン、アナ、ディション、エツェル、ディシャン (Быт 36:20–21). Сеир — хоррей, а не едомлянин; его родословие приводится отдельно."
  39: "καὶ υἱοὶ Λωταν· Χορρι καὶ Αιμαν καὶ Αιλαθ καὶ Ναμνα — ホリ、ヘマン. Слав. «и сестре лотаня фамна» — «сестра Лотана Тимна» (Быт 36:22); греч. вместо сестры даёт ещё два имени (Αιλαθ, Ναμνα), вероятно, из испорченного текста. По паритету в тексте чтение csl, греч. вариант — здесь."
  40: "υἱοὶ Σωβαλ· Γωλαμ, Μαναχαθ, Γαιβηλ, Σωβ καὶ Ωναμ. υἱοὶ δὲ Σεβεγων· Αια καὶ Ανα — アルワン、マナハト、エバル、シェフォ、オナム; сыны Цивеона: アヤ、アナ (Быт 36:23–24). Греч. Γωλαμ — евр. Алван, Σωβ — Шефо."
  41: "υἱοὶ Ανα· Δαισων. υἱοὶ δὲ Δησων· Εμερων καὶ Εσεβαν καὶ Ιεθραν καὶ Χαρραν — ディション; ヘムダン、エシュバン、イトラン、ケラハ (Быт 36:25–26)."
  42: "καὶ υἱοὶ Ωσαρ· Βαλααν καὶ Ζουκαν καὶ Ιωκαν. υἱοὶ Δαισων· Ως καὶ Αρραν — ビルハン、ザアワン、アカン; ウツ、アラン (Быт 36:27–28). В греч. 1 Пар у Ецера три сына, в Быт 36:27 — четыре (ещё Укан)."
  43: "Καὶ οὗτοι οἱ βασιλεῖς αὐτῶν· Βαλακ υἱὸς Βεωρ, καὶ ὄνομα τῇ πόλει αὐτοῦ Δενναβα — «И вот цари их: Валак, сын Веора, и имя городу его Деннава». Греч. Βαλακ (евр. Бела), поэтому в тексте форма корпуса ベラ (Быт 36:32). Слав. добавляет «прежде неже бысть царь над сыны израилевыми» — по паритету внесено в текст."
  44: "καὶ ἀπέθανεν Βαλακ, καὶ ἐβασίλευσεν ἀντ αὐτοῦ Ιωβαβ υἱὸς Ζαρα ἐκ Βοσορρας — ヨバブ, сын Зераха, из Боцры (Быт 36:33); греч. Ζαρα, форма корпуса ザラ (в ст. 37 ゼラ — иное лицо, сын Реуила). ἀντ αὐτοῦ — «вместо него»."
  45: "καὶ ἀπέθανεν Ιωβαβ, καὶ ἐβασίλευσεν ἀντ αὐτοῦ Ασομ ἐκ τῆς γῆς Θαιμανων — フシャム, из земли теманитян (Быт 36:34). Греч. Ασομ, евр. Хушам; слав. «асом»."
  46: "καὶ ἀπέθανεν Ασομ, καὶ ἐβασίλευσεν ἀντ αὐτοῦ Αδαδ υἱὸς Βαραδ ὁ πατάξας Μαδιαμ ἐν τῷ πεδίῳ Μωαβ, καὶ ὄνομα τῇ πόλει αὐτοῦ Γεθθαιμ — ハダド, сын Бедада, поразивший Мадиама на поле Моава (Быт 36:35). Греч. Γεθθαιμ, слав. «гетфем», Синод. «Авив»; в Быт 36:35 — アビト."
  47: "καὶ ἀπέθανεν Αδαδ, καὶ ἐβασίλευσεν ἀντ αὐτοῦ Σαμαα ἐκ Μασεκκας — サムラ, из Масреки (Быт 36:36). Греч. Σαμαα, слав. «самаа»."
  48: "καὶ ἀπέθανεν Σαμαα, καὶ ἐβασίλευσεν ἀντ αὐτοῦ Σαουλ ἐκ Ροωβωθ τῆς παρὰ ποταμόν — シャウル, из Реховота, что при реке (Быт 36:37). παρὰ ποταμόν — «при реке» (Евфрат)."
  49: "καὶ ἀπέθανεν Σαουλ, καὶ ἐβασίλευσεν ἀντ αὐτοῦ Βαλαεννων υἱὸς Αχοβωρ — バアル・ハナン, сын Ахбора (Быт 36:38). Греч. Βαλαεννων — евр. Баал-Ханан."
  50: "καὶ ἀπέθανεν Βαλαεννων υἱὸς Αχοβωρ, καὶ ἐβασίλευσεν ἀντ αὐτοῦ Αδαδ υἱὸς Βαραδ, καὶ ὄνομα τῇ πόλει αὐτοῦ Φογωρ — ハダル, его город パウ, жена メヘタブエル, дочь Матреда (Быт 36:39). Греч. Αδαδ, Φογωρ, Μετεβεηλ, Ματραιθ; слав. «фогор», «метевеиль», «матраиф»."
  51: "καὶ ἀπέθανεν Αδαδ. καὶ ἦσαν ἡγεμόνες Εδωμ· ἡγεμὼν Θαμανα, ἡγεμὼν Γωλα, ἡγεμὼν Ιεθετ — ハダル умер; 族長 ティムナ、アルワ、エテル (Быт 36:40). ἡγεμών — 族長 (князь, старейшина); слав. «князь»."
  52: "ἡγεμὼν Ελιβαμας, ἡγεμὼν Ηλας, ἡγεμὼν Φινων — オホリバマ、エラ、ピノン (Быт 36:41). Греч. Ελιβαμας — евр. Оливема."
  53: "ἡγεμὼν Κενεζ, ἡγεμὼν Θαιμαν, ἡγεμὼν Μαβσαρ — ケナズ、テマン、ミブツァル (Быт 36:42)."
  54: "ἡγεμὼν Μεγεδιηλ, ἡγεμὼν Ηραμ. οὗτοι ἡγεμόνες Εδωμ — マグディエル、イラム; итоговая формула (Быт 36:43). Греч. Μεγεδιηλ — евр. Магдиил."
