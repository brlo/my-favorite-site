verses:
  0: "ダビデの詩[うた]。その地[ち]が整[ととの]えられたときのもの。"
  1: "主[しゅ]は王[おう]となられた。地[ち]は喜[よろこ]び躍[おど]れ。多[おお]くの島[しま]々[じま]は喜[よろこ]べ。"
  2: "雲[くも]と暗[やみ]が主[しゅ]を囲[かこ]み、義[ぎ]と裁[さば]きがその王座[おうざ]の基[もと]である。"
  3: "火[ひ]はその前[まえ]を先[さき]に行[ゆ]き、周[まわ]りにいる敵[てき]を焼[や]き払[はら]う。"
  4: "その稲妻[いなずま]は世界[せかい]を照[て]らし、地[ち]は見[み]て震[ふる]えた。"
  5: "山[やま]は主[しゅ]の顔[かお]の前[まえ]で、全地[ぜんち]の主[しゅ]の顔[かお]の前[まえ]で、蝋[ろう]のように溶[と]けた。"
  6: "天[てん]はその義[ぎ]を告[つ]げ知[し]らせ、すべての民[たみ]はその栄光[えいこう]を見[み]た。"
  7: "彫[ほ]り物[もの]を拝[おが]み、偶像[ぐうぞう]を誇[ほこ]る者[もの]はみな恥[はじ]を受[う]けよ。その天使[てんし]たちはみな、主[しゅ]を拝[おが]め。"
  8: "シオンは聞[き]いて喜[よろこ]び、ユダの娘[むすめ]たちは、主[しゅ]よ、あなたの裁[さば]きのゆえに喜[よろこ]び躍[おど]った。"
  9: "主[しゅ]よ、あなたは全地[ぜんち]の上[うえ]にいます至高[しこう]の主[しゅ]、すべての神[かみ]々[がみ]の上[うえ]に、はるかに高[たか]く上[あ]げられている。"
  10: "主[しゅ]を愛[あい]する者[もの]たちよ、悪[わる]を憎[にく]め。主[しゅ]はその聖[せい]なる者[もの]たちの魂[たましい]を守[まも]り、罪[つみ]人[びと]の手[て]から彼[かれ]らを救[すく]い出[だ]される。"
  11: "光[ひかり]は正[ただ]しい者[もの]に、喜[よろこ]びは心[こころ]の正[ただ]しい者[もの]に、昇[のぼ]り出[で]た。"
  12: "正[ただ]しい者[もの]たちよ、主[しゅ]によって喜[よろこ]べ。その聖[せい]なる名[な]を覚[おぼ]えてほめたたえよ。"

notes:
  0: "Τῷ Δαυιδ, ὅτε ἡ γῆ αὐτοῦ καθίσταται — «Давиду, когда земля его устрояется» (καθίσταμαι — «устрояться, приходить в порядок»). Надписание — стих 0."
  1: "ὁ κύριος ἐβασίλευσεν — 主は王となられた (βασιλεύω — «царствовать»). ἀγαλλιάσθω ἡ γῆ — 地は喜び躍れ (ἀγαλλιάομαι — «ликовать»). εὐφρανθήτωσαν νῆσοι πολλαί — 多くの島々は喜べ (νῆσος — 島)."
  2: "νεφέλη καὶ γνόφος κύκλῳ αὐτοῦ — 雲と暗が主を囲み (γνόφος — «мрак»; κύκλῳ — «вокруг»). δικαιοσύνη καὶ κρίμα κατόρθωσις τοῦ θρόνου αὐτοῦ — 義と裁きがその王座の基である (κατόρθωσις — «утверждение, основание»)."
  3: "πῦρ ἐναντίον αὐτοῦ προπορεύσεται — 火はその前を先に行き (προπορεύομαι — «идти впереди»). φλογιεῖ κύκλῳ τοὺς ἐχθροὺς αὐτοῦ — 周りにいる敵を焼き払う (φλογίζω — «воспламенять, жечь»)."
  4: "ἔφαναν αἱ ἀστραπαὶ αὐτοῦ τῇ οἰκουμένῃ — その稲妻は世界を照らし (ἀστραπή — 稲妻; οἰκουμένη — 世界). εἶδεν καὶ ἐσαλεύθη ἡ γῆ — 地は見て震えた (σαλεύω — «колебать»)."
  5: "τὰ ὄρη ἐτάκησαν ὡσεὶ κηρὸς — 山は蝋のように溶けた (τήκω — «расплавлять»; κηρός — 蝋). ἀπὸ προσώπου κυρίου, ἀπὸ προσώπου κυρίου πάσης τῆς γῆς — 主の顔の前で、全地の主の顔の前で (повтор сохранён)."
  6: "ἀνήγγειλαν οἱ οὐρανοὶ τὴν δικαιοσύνην αὐτοῦ — 天はその義を告げ知らせ (ἀναγγέλλω — «возвещать»). εἴδοσαν πάντες οἱ λαοὶ τὴν δόξαν αὐτοῦ — すべての民はその栄光を見た (δόξα — 栄光)."
  7: "αἰσχυνθήτωσαν πάντες οἱ προσκυνοῦντες τοῖς γλυπτοῖς — 彫り物を拝む者はみな恥を受けよ (αἰσχύνομαι — «стыдиться»; γλυπτόν — «изваяние»). οἱ ἐγκαυχώμενοι ἐν τοῖς εἰδώλοις αὐτῶν — 偶像を誇る者 (εἴδωλον — 偶像; ἐγκαυχάομαι — «хвалиться»). προσκυνήσατε αὐτῷ, πάντες οἱ ἄγγελοι αὐτοῦ — その天使たちはみな、主を拝め."
  8: "ἤκουσεν καὶ εὐφράνθη Σιων — シオンは聞いて喜び (εὐφραίνω — «веселить»). ἠγαλλιάσαντο αἱ θυγατέρες τῆς Ιουδαίας — ユダの娘たちは…喜び躍った (θυγάτηρ — 娘). ἕνεκεν τῶν κριμάτων σου, κύριε — 主よ、あなたの裁きのゆえに."
  9: "σὺ εἶ κύριος ὁ ὕψιστος ἐπὶ πᾶσαν τὴν γῆν — 主よ、あなたは全地の上にいます至高の主 (ὕψιστος — 至高). σφόδρα ὑπερυψώθης ὑπὲρ πάντας τοὺς θεούς — すべての神々の上に、はるかに高く上げられている (ὑπερυψόω — «превозносить превыше»)."
  10: "οἱ ἀγαπῶντες τὸν κύριον, μισεῖτε πονηρόν — 主を愛する者たちよ、悪を憎め (μισεῖτε — императив). φυλάσσει κύριος τὰς ψυχὰς τῶν ὁσίων αὐτοῦ — 主はその聖なる者たちの魂を守り (ὅσιος — 聖なる者). ἐκ χειρὸς ἁμαρτωλῶν ῥύσεται αὐτούς — 罪人の手から彼らを救い出される (ῥύομαι — «избавлять»)."
  11: "φῶς ἀνέτειλεν τῷ δικαίῳ — 光は正しい者に昇り出た (ἀνατέλλω — «восходить, сиять»). τοῖς εὐθέσι τῇ καρδίᾳ εὐφροσύνη — 喜びは心の正しい者に (εὐφροσύνη — «веселие, радость»)."
  12: "εὐφράνθητε, δίκαιοι, ἐπὶ τῷ κυρίῳ — 正しい者たちよ、主によって喜べ. ἐξομολογεῖσθε τῇ μνήμῃ τῆς ἁγιωσύνης αὐτοῦ — その聖なる名を覚えてほめたたえよ (μνήμη — «память»; ἁγιωσύνη — «святость»)."
