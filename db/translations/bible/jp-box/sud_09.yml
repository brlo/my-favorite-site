verses:
  1: "エルバアルの子[こ]アビメレクはシケムへ行[い]き、母[はは]の兄弟[きょうだい]たちと、母の家[いえ]の全[すべ]ての親族[しんぞく]に語[かた]って、こう言[い]った。"
  2: "「シケムの人[ひと]々[びと]の耳[みみ]に語[かた]りなさい。『あなたがたには、エルバアルの子[こ]ら七十人[にん]がすべてあなたがたを治[おさ]めるのと、一人[ひとり]の男[おとこ]があなたがたを治めるのと、どちらがよいのか』と。また、わたしがあなたがたの骨[ほね]と肉[にく]であることを思[おも]い出[だ]しなさい。」"
  3: "母[はは]の兄弟[きょうだい]たちは、これらすべての言葉[ことば]をシケムの人[ひと]々[びと]の耳[みみ]に語[かた]り、彼[かれ]らは心[こころ]をアビメレクに傾[かたむ]けた。「彼[かれ]はわたしたちの兄弟[きょうだい]だ」と言[い]ったからである。"
  4: "彼[かれ]らはバアル・ベリトの家[いえ]から銀七十シケルを彼[かれ]に与[あた]えた。アビメレクはそれでならず者[もの]たちを雇[やと]い、彼[かれ]らは彼[かれ]に従[したが]った。"
  5: "彼[かれ]は父[ちち]の家[いえ]であるオフラへ行[い]き、兄弟[きょうだい]であるエルバアルの子[こ]ら七十人[にん]を一[ひと]つの石[いし]の上[うえ]で殺[ころ]した。ただ、末[すえ]の子[こ]ヨタムだけが残[のこ]った。彼[かれ]が身[み]を隠[かく]したからである。"
  6: "シケムの人[ひと]々[びと]とマロの家[いえ]はみな集[あつ]まって、シケムの樫[かし]の木[き]のそばへ行[い]き、アビメレクを王[おう]とした。"
  7: "ヨタムにそのことが告[つ]げられると、彼[かれ]は行[い]って、ゲリジム山[やま]の頂[いただき]に立[た]ち、声[こえ]を上[あ]げて呼[よ]びかけて言[い]った。「シケムの人[ひと]々[びと]よ、わたしの言[こと]うことを聞[き]きなさい。そうすれば神[かみ]もあなたがたの声[こえ]を聞[き]いてくださるであろう。"
  8: "木[き]々[ぎ]は、自分[じぶん]たちの王[おう]に油[あぶら]を注[そそ]ごうとして出[で]かけ、オリーブの木[き]に言[い]った。『わたしたちの上[うえ]に王[おう]となってください』と。"
  9: "オリーブの木[き]は彼[かれ]らに言[い]った。『神[かみ]と人[ひと]がわたしのうちで尊[たっと]んだ、この油[あぶら]の豊[ゆた]かさを捨[す]てて、木[き]々[ぎ]の上[うえ]に立[た]つために行[い]くというのか』と。"
  10: "木[き]々[ぎ]はいちじくの木[き]に言[い]った。『あなたが来[き]て、わたしたちの王[おう]になってください』と。"
  11: "いちじくの木[き]は彼[かれ]らに言[い]った。『わたしの甘[あま]さと良[よ]い実[み]を捨[す]てて、木[き]々[ぎ]の上[うえ]に立[た]つために行[い]くというのか』と。"
  12: "木[き]々[ぎ]はぶどうの木[き]に言[い]った。『あなたが来[き]て、わたしたちの王[おう]になってください』と。"
  13: "ぶどうの木[き]は彼[かれ]らに言[い]った。『神[かみ]と人[ひと]に喜[よろこ]びを与[あた]えるこのぶどう酒[しゅ]を捨[す]てて、木[き]々[ぎ]の上[うえ]に立[た]つために行[い]くというのか』と。"
  14: "そこで木[き]々[ぎ]はみな、いばらに言[い]った。『あなたが来[き]て、わたしたちの王[おう]になってください』と。"
  15: "いばらは木[き]々[ぎ]に言[い]った。『もしあなたがたが真実[しんじつ]にわたしに油[あぶら]を注[そそ]いで自分[じぶん]たちの王[おう]とするなら、来[き]て、わたしの陰[かげ]に身[み]を寄[よ]せなさい。もしそうでないなら、いばらから火[ひ]が出[で]て、レバノンの杉[すぎ]を焼[や]き尽[つ]くすであろう。』"
  16: "そして今[いま]、あなたがたが真実[しんじつ]と誠実[せいじつ]をもって行[おこな]い、アビメレクを王[おう]としたのなら、また、あなたがたがエルバアルとその家[いえ]を親切[しんせつ]に扱[あつか]い、彼[かれ]の手[て]の働[はたら]きに報[むく]いたのなら、"
  17: "わたしの父[ちち]はあなたがたのために戦[たたか]い、自分[じぶん]の命[いのち]を投[な]げ出[だ]して、あなたがたをミディアンの手[て]から救[すく]い出[だ]した。"
  18: "ところが、あなたがたは今日[きょう]、父[ちち]の家[いえ]に立[た]ち向[む]かい、その子[こ]ら七十人[にん]を一[ひと]つの石[いし]の上[うえ]で殺[ころ]し、彼[かれ]のはしための子[こ]アビメレクを、あなたがたの兄弟[きょうだい]であるという理由[りゆう]で、シケムの人[ひと]々[びと]の王[おう]とした。"
  19: "もしあなたがたが今日[きょう]、真実[しんじつ]と誠実[せいじつ]をもってエルバアルとその家[いえ]に接[せっ]したのなら、あなたがたは祝福[しゅくふく]され、アビメレクを喜[よろこ]ぶであろう。彼[かれ]もまた、あなたがたを喜[よろこ]ぶであろう。"
  20: "もしそうでないなら、アビメレクから火[ひ]が出[で]て、シケムの人[ひと]々[びと]とマロの家[いえ]を焼[や]き尽[つ]くし、シケムの人[ひと]々[びと]とマロの家から火が出て、アビメレクを焼き尽くすであろう。」"
  21: "ヨタムは逃[に]げてララへ走[はし]り、そこに住[す]んで、兄[あに]アビメレクの顔[かお]を避[さ]けた。"
  22: "アビメレクはイスラエルを三年[ねん]の間[あいだ]、治[おさ]めた。"
  23: "神[かみ]はアビメレクとシケムの人[ひと]々[びと]の間[あいだ]に悪[わる]い霊[れい]を送[おく]られ、シケムの人[ひと]々[びと]はアビメレクの家[いえ]に背[そむ]いた。"
  24: "それは、エルバアルの子[こ]ら七十人[にん]への不[ふ]義[ぎ]とその血[ち]が、彼[かれ]らを殺[ころ]した兄弟[きょうだい]アビメレクと、彼[かれ]の手[て]を強[つよ]めて兄弟を殺[ころ]させたシケムの人[ひと]々[びと]の上[うえ]に及[およ]ぶためであった。"
  25: "シケムの人[ひと]々[びと]は彼[かれ]に逆[さか]らって、山[やま]の頂[いただき]に伏兵[ふくへい]を置[お]き、彼[かれ]らのところを通[とお]り過[す]ぎる者[もの]をみな襲[おそ]った。そのことがアビメレクに告[つ]げられた。"
  26: "エベドの子[こ]ガアルとその兄弟[きょうだい]たちがシケムへ来[き]たので、シケムの人[ひと]々[びと]は彼[かれ]に信頼[しんらい]を置[お]いた。"
  27: "彼[かれ]らは野[の]へ出[で]て、ぶどう畑[ばたけ]のぶどうを取[と]り入[い]れ、踏[ふ]みつぶし、踊[おど]りの輪[わ]を組[く]んだ。そして自分[じぶん]たちの神[かみ]の家[いえ]へ行[い]って食[た]べ飲[の]みし、アビメレクを呪[のろ]った。"
  28: "エベドの子[こ]ガアルは言[い]った。「アビメレクとは何者[なにもの]か。シケムの子[こ]とは何者か。わたしたちが彼[かれ]に仕[つか]えなければならないとは。彼[かれ]はエルバアルの子[こ]ではないか。ゼブルは彼[かれ]の代官[だいかん]で、シケムの父[ちち]エモルの人[ひと]々[びと]とともにいる彼[かれ]のしもべではないか。わたしたちがなぜ彼[かれ]に仕えなければならないのか。」"
  29: "「この民[たみ]をわたしの手[て]に与[あた]えてくれる者[もの]があればよいのに。そうすればわたしはアビメレクを退[しりぞ]け、アビメレクに『おまえの軍[ぐん]を増[ふ]やして出[で]て来[こ]い』と言[い]ってやるものを。」"
  30: "町[まち]の首長[しゅちょう]ゼブルは、エベドの子[こ]ガアルの言葉[ことば]を聞[き]いて、激[はげ]しく怒[いか]った。"
  31: "彼[かれ]は贈[おく]り物[もの]を添[そ]えて使者[ししゃ]をアビメレクのもとへ送[おく]り、言[い]った。「見[み]よ、エベドの子[こ]ガアルとその兄弟[きょうだい]たちがシケムへ来[き]て、この者[もの]たちはあなたに逆[さか]らってこの町[まち]を押[お]さえています。"
  32: "そこで今[いま]、夜[よる]のうちに立[た]ち上[あ]がって、あなたとともにいる民[たみ]とともに野[の]に伏[ふ]せなさい。"
  33: "朝[あさ]、日[ひ]が上[のぼ]るとともに、あなたは早[はや]く起[お]きて町[まち]へ攻[せ]めかかりなさい。見[み]よ、彼[かれ]と彼[かれ]とともにいる民[たみ]があなたのところへ出[で]て来[こ]たら、あなたの手[て]にかなうとおりに彼[かれ]らにしなさい。」"
  34: "アビメレクと彼[かれ]とともにいる民[たみ]はみな、夜[よる]のうちに立[た]ち上[あ]がり、シケムに逆[さか]らって四[よっ]つの隊[たい]を伏[ふ]せた。"
  35: "朝[あさ]になると、エベドの子[こ]ガアルは出[で]て来[き]て、町[まち]の門[もん]の戸口[とぐち]に立[た]った。アビメレクと彼[かれ]とともにいる民[たみ]は伏兵[ふくへい]のところから立[た]ち上[あ]がった。"
  36: "ガアルは民[たみ]を見[み]てゼブルに言[い]った。「見[み]よ、民[たみ]が山[やま]の頂[いただき]から下[お]りて来[き]ます。」ゼブルは彼[かれ]に言[い]った。「あなたは山[やま]の影[かげ]を人[ひと]のように見[み]ているのです。」"
  37: "ガアルはさらに語[かた]り続[つづ]けて言[い]った。「見[み]よ、民[たみ]は海[うみ]の方[ほう]へ、地[ち]のへそに接[せっ]するあたりから下[お]りて来[き]ます。もう一[ひと]つの隊[たい]は、見張[みは]る者[もの]たちの樫[かし]の木[き]の道[みち]から来[き]ます。」"
  38: "ゼブルは彼[かれ]に言[い]った。「おまえの口[くち]は今[いま]どこにあるのか。『アビメレクとは何者[なにもの]か。わたしたちが彼[かれ]に仕[つか]えなければならないとは』と言[い]った、あの口は。見[み]よ、これがおまえが見下[みくだ]した民[たみ]ではないか。さあ、出[で]て行[い]って彼[かれ]と戦[たたか]いなさい。」"
  39: "ガアルはシケムの人[ひと]々[びと]の先[さき]に立[た]って出[で]て、アビメレクと戦[たたか]った。"
  40: "アビメレクは彼[かれ]を追[お]った。彼[かれ]はその前[まえ]から逃[に]げ、町[まち]の門[もん]に至[いた]るまで、傷[きず]ついて倒[たお]れた者[もの]が多[おお]かった。"
  41: "アビメレクはアリマに住[す]み、ゼブルはガアルとその兄弟[きょうだい]たちを追[お]い出[だ]して、シケムに住[す]めないようにした。"
  42: "翌日[よくじつ]、民[たみ]が野[の]へ出[で]て来[き]たので、そのことがアビメレクに告[つ]げられた。"
  43: "彼[かれ]は民[たみ]を連[つ]れて三[みっ]つの隊[たい]に分[わ]け、野[の]に伏[ふ]せた。見[み]よ、民[たみ]が町[まち]から出[で]て来[き]たので、彼[かれ]は彼[かれ]らに立[た]ち向[む]かって打[う]った。"
  44: "アビメレクと彼[かれ]とともにいる隊[たい]は進[すす]み出[で]て、町[まち]の門[もん]のそばに立[た]った。ほかの二[ふた]つの隊[たい]は野[の]にいるすべての者[もの]に襲[おそ]いかかって、彼[かれ]らを打[う]った。"
  45: "アビメレクはその日[ひ]一[いち]日[にち]、町[まち]と戦[たたか]い、町[まち]を取[と]って、その中[なか]の民[たみ]を打[う]ち殺[ころ]し、町[まち]を壊[こわ]して、そこに塩[しお]をまいた。"
  46: "シケムのやぐらの人[ひと]々[びと]はみな、これを聞[き]いて、バアル・ベリトの家[いえ]のとりでに入[はい]った。"
  47: "アビメレクには、シケムのやぐらの人[ひと]々[びと]がみな集[あつ]まったことが告[つ]げられた。"
  48: "アビメレクは自分[じぶん]とともにいる民[たみ]すべてとともにセルモン山[やま]へ上[のぼ]り、手[て]に斧[おの]を取[と]って木[き]の枝[えだ]を切[き]り、それを担[かつ]いで肩[かた]に載[の]せ、ともにいる民[たみ]に言[い]った。「わたしがしていることを見[み]たであろう。急[いそ]いで、わたしがしたとおりにしなさい。」"
  49: "民[たみ]もまた、おのおの枝[えだ]を切[き]ってアビメレクの後[あと]に従[したが]い、それらをとりでの上[うえ]に積[つ]み上[あ]げ、そのとりでに火[ひ]を放[はな]って燃[も]やした。シケムのやぐらの人[ひと]々[びと]は、男女[だんじょ]およそ千人[にん]が死[し]んだ。"
  50: "アビメレクはテベツへ行[い]き、テベツを包囲[ほうい]して取[と]った。"
  51: "町[まち]の中[なか]には堅[かた]いやぐらがあり、町[まち]の人[ひと]々[びと]は男[おとこ]も女[おんな]も、また町[まち]の指導[しどう]者[しゃ]たちもみな、そこへ逃[に]げ込[こ]み、戸[と]を閉[と]ざして、やぐらの屋上[おくじょう]へ上[のぼ]った。"
  52: "アビメレクはやぐらのところへ来[き]た。彼[かれ]らはこれと戦[たたか]った。アビメレクはこれを火[ひ]で焼[や]こうとして、やぐらの戸口[とぐち]に近[ちか]づいた。"
  53: "一女[いちじょ]が臼[うす]の石[いし]の欠[か]けらをアビメレクの頭[あたま]に投[な]げつけ、彼[かれ]の頭蓋[ずがい]を砕[くだ]いた。"
  54: "彼[かれ]は急[いそ]いで、武具[ぶぐ]を運[はこ]ぶ若者[わかもの]を呼[よ]んで言[い]った。「おまえの剣[つるぎ]を抜[ぬ]いて、わたしを殺[ころ]せ。『女[おんな]がわたしを殺した』と言[い]われないために。」若者[わかもの]が彼[かれ]を刺[さ]すと、アビメレクは死[し]んだ。"
  55: "イスラエルの人[ひと]々[びと]はアビメレクが死[し]んだのを見[み]て、おのおの自分[じぶん]の場所[ばしょ]へ帰[かえ]った。"
  56: "こうして神[かみ]は、アビメレクが父[ちち]にした悪[あく]、すなわち兄弟[きょうだい]七十人[にん]を殺[ころ]したことを、彼[かれ]に報[むく]いられた。"
  57: "また神[かみ]は、シケムの人[ひと]々[びと]のすべての悪[あく]を彼[かれ]らの頭[あたま]に返[かえ]された。こうしてエルバアルの子[こ]ヨタムの呪[のろ]いが彼[かれ]らに及[およ]んだ。"

notes:
  1: "ἐπορεύθη ... εἰς Σικιμα — пошёл в Сихем. ἀδελφοὺς τῆς μητρὸς αὐτοῦ — братьев матери своей. πᾶσαν τὴν συγγένειαν τοῦ οἴκου τῆς μητρός — всё родство дома матери. λέγων — «говоря»: речь начинается в ст. 2, поэтому 9:1 открытой кавычки не имеет."
  2: "Λαλήσατε ἐν ὠσὶν — скажите в уши, т. е. внушите. Ποῖον βέλτιόν ἐστιν — что лучше. κυριεύειν ὑμῶν ἄνδρα ἕνα — владеть вами одному мужу. σὰρξ ὑμῶν καὶ ὀστοῦν ὑμῶν ἐγώ εἰμι — «я плоть ваша и кость ваша» (ср. Быт 2:23)."
  3: "ἐλάλησαν περὶ αὐτοῦ — говорили о нём. ἔκλινεν καρδία αὐτῶν ὀπίσω Αβιμελεχ — склонилось сердце их к Авимелеху. Ἀδελφὸς ἡμῶν ἐστιν — «брат наш он»: речь в 「…」 внутри повествования."
  4: "ἑβδομήκοντα ἀργυρίου — семьдесят серебра (сиклей). οἶκος Βααλ διαθήκης — дом Ваал-Верифа (ср. 8:33). ἄνδρας κενοὺς καὶ θαμβουμένους — мужей пустых и дерзких (θαμβέομαι, «ошеломлённых»); слав. «праздных и скитающихся»."
  5: "ἐπὶ λίθον ἕνα — на одном камне. ἀπελείφθη Ιωαθαμ ὁ νεώτερος — остался Иофам младший (в корпусе ヨタム). ὅτι ἐκρύβη — потому что скрылся."
  6: "οἶκος Μααλλων — дом Маалон; вероятно укрепление Милло (МТ), в gr транслитерация, поэтому マロ. ἐπὶ τῇ βαλάνῳ τῆς στάσεως — у дуба «стояния» (στάσις — восстание, ср. слав. «дуб стана»); в корпусе 樫の木. ἐβασίλευσαν — поставили царём."
  7: "ἐπὶ τῆς κορυφῆς τοῦ ὄρους Γαριζιν — на вершине горы Гаризим (в корпусе ゲリジム山). ἐπῆρεν τὴν φωνὴν αὐτοῦ — возвысил голос. ἀκοῦσαι ὑμῶν ὁ θεός — да услышит вас Бог (оптатив). Здесь открывается речь Иофама, она идёт до конца ст. 20."
  8: "πορευόμενα ἐπορεύθησαν — «идя пошли» (усилительный оборот LXX). τοῦ χρῖσαι ἑαυτοῖς βασιλέα — чтобы помазать себе царя. ἐλαία — маслина. Βασίλευσον ἐφ᾽ ἡμῶν — царствуй над нами (вложенная речь 『…』)."
  9: "πιότης — тук, жирность (масло). ἣν ἐν ἐμοὶ ἐδόξασεν ὁ θεὸς καὶ ἄνθρωποι — которым во мне прославился Бог и люди. πορευθῶ ἄρχειν τῶν ξύλων — пойду ли владеть деревьями (ἄρχω с род.)."
  10: "συκῆ — смоковница, いちじく. Δεῦρο βασίλευσον — иди, царствуй."
  11: "γλυκύτης — сладость. γένημα — плод, произведение (γένημα). τὸ ἀγαθόν — добрый."
  12: "ἄμπελος — виноградная лоза."
  13: "τὸν οἶνόν μου, τὴν εὐφροσύνην τὴν παρὰ τοῦ θεοῦ τῶν ἀνθρώπων — «вино моё, веселие от Бога людям»; место тёмное, слав. «веселящее Бога и человеки». Принят смысл «радость, которую Бог даёт людям»."
  14: "ῥάμνος — терновник, куст колючки (いばら). Все деревья обращаются к нему последним."
  15: "Εἰ ἐν ἀληθείᾳ ... χρίετέ με — если во истине помазуете меня. πεποίθατε ἐν τῇ σκέπῃ μου — «уповайте (утешайтесь) в тени моей» (πείθω, перфект). ἐξέλθοι πῦρ ἐκ τῆς ῥάμνου — да выйдет огонь из терновника (оптатив). κέδροι τοῦ Λιβάνου — кедры Ливанские."
  16: "εἰ ἐν ἀληθείᾳ καὶ ἐν τελειότητι ἐποιήσατε — если в истине и совершенстве поступили (τελειότης). κατὰ τὸ ἀνταπόδομα τῆς χειρὸς αὐτοῦ — по воздаянию руки его (ἀνταπόδομα). Условное предложение продолжается до ст. 17, главное — в ст. 19."
  17: "ἔρριψεν τὴν ψυχὴν αὐτοῦ ἐξ ἐναντίας — бросил душу свою навстречу (опасности); слав. «поверже душу свою в страну». ἐξείλατο — изъял, избавил (ἐξαιρέω)."
  18: "ἐπανέστητε ἐπὶ τὸν οἶκον — восстали на дом. υἱὸν τῆς παιδίσκης αὐτοῦ — сына служанки его (παιδίσκη). ὅτι ἀδελφὸς ὑμῶν ἐστιν — потому что брат ваш."
  19: "εὐλογηθείητε ... εὐφρανθείητε — да будете благословенны и да возвеселитесь (оптативы). ἐν Αβιμελεχ — об Авимелехе. Здесь главная часть условия 16–18."
  20: "εἰ δὲ μή — если же нет. ἐξέλθοι πῦρ ἐξ Αβιμελεχ — да выйдет огонь от Авимелеха (оптатив); ср. притчу 15. Закрывается речь Иофама."
  21: "ἀπέδρα — убежал (ἀποδιδράσκω). εἰς Ραρα — в Рару (gr); слав. «в виру», Син. «в Беэр» — отождествление места спорно, оставлена форма gr ララ. ἀπὸ προσώπου Αβιμελεχ — от лица Авимелеха."
  22: "ἦρξεν ἐπὶ Ισραηλ τρία ἔτη — владел Израилем три года (ἄρχω)."
  23: "πνεῦμα πονηρόν — злой дух (не «нечистый»); ἀνὰ μέσον — между. ἠθέτησαν — отложились, изменили (ἀθετέω); слав. «возгнушашася»."
  24: "τοῦ ἐπαγαγεῖν τὴν ἀδικίαν — чтобы навести неправду (ἐπάγω). τὸ αἷμα αὐτῶν ἐπιθεῖναι ἐπὶ — возложить кровь их на (ἐπιτίθημι). τοὺς κατισχύσαντας τὰς χεῖρας αὐτοῦ — укрепивших руки его (κατισχύω)."
  25: "ἔθεντο ... ἔνεδρα ἐπὶ τὰς κεφαλὰς τῶν ὀρέων — поставили засады на вершинах гор (ἔνεδρα). ἀνήρπαζον — расхищали, хватали (ἁρπάζω). τοὺς διαπορευομένους ἐπ᾽ αὐτοὺς ἐν τῇ ὁδῷ — проходящих мимо них по дороге."
  26: "Γααλ υἱὸς Αβεδ — Гаал, сын Еведа (в корпусе ガアル, エベド). ἐπεποίθησαν ἐν αὐτῷ — положились на него (πείθω, плюсквамперфект)."
  27: "ἐτρύγησαν τοὺς ἀμπελῶνας — собрали виноградники (τρυγάω). κατεπάτουν — топтали (в точиле). ἐποίησαν χορούς — устроили хороводы (χορός). κατηρῶντο — проклинали (καταράομαι)."
  28: "Τί ἐστιν Αβιμελεχ — «что такое Авимелех». υἱὸς Συχεμ — сын Сихема (в gr сбивчиво; слав. «сын сихемль»). ἐπίσκοπος — надзиратель, начальник (ἐπίσκοπος), поэтому 代官. σὺν τοῖς ἀνδράσιν Εμμωρ πατρὸς Συχεμ — с людьми Еммора, отца Сихема: место тёмное."
  29: "καὶ τίς δῴη — «и кто даст» (оптатив): если бы кто дал. μεταστήσω — отставлю, удалю (μεθίστημι). Πλήθυνον τὴν δύναμίν σου καὶ ἔξελθε — «умножь силу твою и выйди»; в gr это слова, будто бы обращённые Гаалом к Авимелеху, слав. и Син. понимают как вызов."
  30: "ἐθυμώθη ὀργῇ — воспылал гневом (θυμόω)."
  31: "μετὰ δώρων — с дарами; слав. «отай» (тайно) — иное чтение. πολιορκοῦσιν τὴν πόλιν ἐπὶ σέ — «держат город в осаде против тебя», т. е. возмущают город против тебя (πολιορκέω)."
  32: "ἀνάστηθι νυκτός — встань ночью. ἐνέδρευσον ἐν τῷ ἀγρῷ — засядь в поле (ἐνεδρεύω)."
  33: "ὀρθρίσεις καὶ ἐκτενεῖς ἐπὶ τὴν πόλιν — встав рано, прострись (устремись) на город (ἐκτείνω). ποιήσεις αὐτῷ καθάπερ ἐὰν εὕρῃ ἡ χείρ σου — сделаешь ему, как найдёт рука твоя. Здесь закрывается речь Зевула."
  34: "ἐνήδρευσαν ἐπὶ Σικιμα τέσσαρας ἀρχάς — поставили против Сихема четыре отряда (ἀρχή)."
  35: "πρὸς τῇ θύρᾳ τῆς πύλης τῆς πόλεως — у двери городских ворот. ἐκ τῶν ἐνέδρων — из засады."
  36: "λαὸς καταβαίνων ἀπὸ τῶν κορυφῶν τῶν ὀρέων — народ, сходящий с вершин гор. τὴν σκιὰν τῶν ὀρέων σὺ ὁρᾷς ὡς ἄνδρας — «тень гор ты видишь как мужей»."
  37: "κατὰ θάλασσαν — «к морю», со стороны моря. ἀπὸ τοῦ ἐχόμενα τοῦ ὀμφαλοῦ τῆς γῆς — от прилежащего к пупу земли (ὀμφαλός). ὁδοῦ δρυὸς ἀποβλεπόντων — дорогой дуба «смотрящих» (ἀποβλέπω): евр. топоним «дуб Меонним», т. е. гадателей; слав. «дубрава маоненим»."
  38: "Ποῦ ἐστιν νῦν τὸ στόμα σου — где теперь уста твои. ὃν ἐξουδένωσας — которого ты уничижил (ἐξουδενόω). ἔξελθε νῦν καὶ πολέμει — выйди теперь и воюй."
  39: "ἐξῆλθεν ... ἀπὸ προσώπου τῶν ἀνδρῶν Σικιμων — вышел пред лицом мужей Сихемских, т. е. во главе их. ἐπολέμησεν ἐν Αβιμελεχ — сразился с Авимелехом (ἐν = с)."
  40: "κατεδίωξεν αὐτόν — погнался за ним. ἔπεσον τραυματίαι πολλοί — пало много раненых (τραυματίας). ἕως θυρῶν τῆς πόλεως — до ворот города."
  41: "ἐκάθισεν ἐν Αριμα — остался (сел) в Ариме (в корпусе アリマ). ἐξέβαλεν — изгнал (ἐκβάλλω). τοῦ μὴ οἰκεῖν ἐν Σικιμοις — чтобы не жить в Сихеме."
  42: "τῇ ἐπαύριον — на другой день. ἐξῆλθεν ὁ λαὸς εἰς τὸ πεδίον — вышел народ в поле. ἀπηγγέλη — было донесено (ἀπαγγέλλω)."
  43: "παρέλαβεν τὸν λαόν — взял народ. διεῖλεν τρεῖς ἀρχάς — разделил на три отряда. ἐνήδρευσεν ἐν αὐτῷ — устроил засаду в нём (в поле). ἐπανέστη αὐτοῖς — восстал на них."
  44: "ἐξετάθησαν — простёрлись, устремились (ἐκτείνω). παρὰ τὴν πύλην — у ворот. ἐξεχύθησαν ἐπὶ πάντας τοὺς ἐν τῷ ἀγρῷ — излились на всех, кто в поле (ἐκχέω)."
  45: "ἐπολέμει ἐν τῇ πόλει — воевал с городом. ἀνεῖλεν — истребил (ἀναιρέω). καθεῖλεν — низверг, разрушил (καθαιρέω). ἔσπειρεν αὐτὴν ἅλας — засеял его солью."
  46: "οἱ ἄνδρες πύργου Σικιμων — люди башни Сихемской. τὸ ὀχύρωμα οἴκου τοῦ Βααλ διαθήκης — укрепление дома Ваал-Верифа (ὀχύρωμα); слав. «твердь дому вефилвериф»."
  47: "συνήχθησαν — собрались (συνάγω)."
  48: "εἰς ὄρος Σελμων — на гору Селмон. ἀξίνην — топор (ἀξίνη). φορτίον ξύλων — вязанку, ношу дров (φορτίον). ἐπὶ τοὺς ὤμους — на плечи. Τί εἴδετέ με ποιοῦντα — что видели вы меня делающим."
  49: "ἕκαστος φορτίον — каждый ношу. ἐπέθηκαν ἐπὶ τὸ ὀχύρωμα — положили к укреплению. ἐνέπρησαν ... ἐν πυρί — зажгли огнём (ἐμπίμπρημι). ὡσεὶ χίλιοι ἄνδρες καὶ γυναῖκες — около тысячи мужчин и женщин."
  50: "εἰς Θεβες — в Тевец (в корпусе テベツ). περιεκάθισεν ἐπ᾽ αὐτήν — обложил его (περιεδρεύω, περιεκάθισα). προκατελάβετο — предварительно овладел (προκαταλαμβάνω)."
  51: "πύργος ὀχυρός — крепкая башня. οἱ ἡγούμενοι τῆς πόλεως — начальствующие города (ἡγέομαι). ἀπέκλεισαν ἐφ᾽ ἑαυτούς — заперлись (ἀποκλείω). ἐπὶ τὸ δῶμα τοῦ πύργου — на кровлю башни (δῶμα)."
  52: "ἕως τοῦ πύργου — до башни. ἐξεπολέμησαν αὐτόν — сражались с ним. ἤγγισεν ἕως τῆς θύρας — приблизился к двери. ἐμπρῆσαι αὐτὸν ἐν πυρί — чтобы сжечь её огнём."
  53: "κλάσμα μύλου — обломок жёрнова (κλάσμα, μύλος). συνέθλασεν τὸ κρανίον — раздробила череп (συνθλάω, κρανίον)."
  54: "τὸ παιδάριον τὸν αἴροντα τὰ σκεύη αὐτοῦ — отрока, носящего оружие (сосуды) его. Σπάσαι τὴν μάχαιραν — извлеки меч. θανάτωσόν με — умертви меня. μήποτε εἴπωσιν — чтобы не сказали; слова «женщина убила его» — 『…』. ἐξεκέντησεν — пронзил (ἐκκεντέω)."
  55: "εἶδεν ἀνὴρ Ισραηλ — увидел муж Израиля (собирательно). ἀπῆλθον ἀνὴρ εἰς τὸν τόπον αὐτοῦ — пошли каждый в своё место."
  56: "ἀπέστρεψεν ὁ θεὸς τὴν κακίαν — возвратил, воздал Бог зло (ἀποστρέφω). ἀποκτεῖναι τοὺς ἑβδομήκοντα ἀδελφοὺς αὐτοῦ — убить семьдесят братьев своих: в gr «отцу своему» (τῷ πατρὶ αὐτοῦ), т. е. зло против дома отца."
  57: "πᾶσαν κακίαν ἀνδρῶν Σικιμων — всё зло мужей Сихемских. ἐπέστρεψεν ... εἰς τὴν κεφαλὴν αὐτῶν — обратил на голову их. ἐπῆλθεν ἐπ᾽ αὐτοὺς ἡ κατάρα Ιωαθαμ — пришло на них проклятие Иофама (κατάρα)."
