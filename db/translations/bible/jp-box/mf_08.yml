verses:
  1: "山[やま]を下[くだ]りて行[ゆ]かれるイエスに、多[おお]くの群衆[ぐんしゅう]がついて来[き]た。"
  2: "すると、重[おも]い皮膚病[ひふびょう]の人[ひと]が近[ちか]づき、イエスにひざまずいて言[い]った。「主[しゅ]よ。お望[のぞ]みでしたら、わたしを清[きよ]くしていただけます。」"
  3: "イエスは手[て]を伸[の]ばしてその人[ひと]に触[ふ]れ、「<j>よろしい。清[きよ]くなれ。</j>」と告[つ]げた。すると、重[おも]い皮膚病[ひふびょう]はたちどころに消[き]え去[さ]った。"
  4: "イエスは言[い]われた。「<j>このことは、だれにも口外[こうがい]してはならない。ただし、祭司[さいし]のところへ行[い]って姿[すがた]を見[み]せ、モーセが命[めい]じた献[ささ]げ物[もの]を差[さ]し出[だ]しなさい。それが、彼[かれ]らへの証[あかし]となる。</j>」"
  5: "イエスがカファルナウムの町[まち]に入[はい]られると、百人隊長[ひゃくにんたいちょう]が一人[ひとり]、そばへ寄[よ]って来[き]て願[ねが]い出[で]た。"
  6: "「主[しゅ]よ。わたしの僕[しもべ]が中風[ちゅうふう]で寝[ね]たきりになり、ひどく苦[くる]しんでおります。」"
  7: "イエスは言[い]われた。「<j>わたしが行[い]って、癒[いや]そう。</j>」"
  8: "百人隊長[ひゃくにんたいちょう]は答[こた]えた。「主[しゅ]よ、この屋根[やね]の下[した]にあなたをお入[い]れするなど、わたしにはとてもできません。ただ、お言葉[ことば]ひとつで結構[けっこう]です。それで僕[しもべ]は癒[いや]されます。"
  9: "このわたし自身[じしん]も、上[うえ]の者[もの]の命令[めいれい]を受[う]ける立場[たちば]で、手[て]もとには兵[へい]がおります。『行[い]け』と命[めい]じればその兵[へい]は行[い]き、『来[こ]い』と言[い]えば来[き]ます。僕[しもべ]に『これをせよ』と申[もう]しつければ、そのとおりにいたします。」"
  10: "イエスはこれを聞[き]いて驚[おどろ]き、ついて来[き]ていた人々[ひとびと]に言[い]われた。「<j>はっきり言[い]っておく。イスラエルの中[なか]でも、これほどまでの信仰[しんこう]に出会[であ]ったことはない。</j>"
  11: "<j>あなたがたに言[い]うが、多[おお]くの者[もの]が東[ひがし]から西[にし]から来[き]て、天[てん]の国[くに]でアブラハム、イサク、ヤコブと共[とも]に宴会[えんかい]の席[せき]に着[つ]く。</j>"
  12: "<j>しかし、御国[みくに]の子[こ]らは外[そと]の暗[くら]がりへ放[ほう]り出[だ]される。そこで彼[かれ]らは泣[な]き叫[さけ]び、歯[は]を噛[か]み鳴[な]らす。</j>」"
  13: "イエスは百人隊長[ひゃくにんたいちょう]に言[い]われた。「<j>帰[かえ]りなさい。あなたが信[しん]じたとおりにしてあげよう。</j>」すると、それと同[おな]じ時[とき]、僕[しもべ]は癒[いや]された。"
  14: "ペトロの家[いえ]に着[つ]いたイエスは、しゅうとめが熱[ねつ]を出[だ]して横[よこ]になっているのをご覧[ごらん]になった。"
  15: "イエスが彼女[かのじょ]の手[て]に触[ふ]れると、熱[ねつ]は引[ひ]いた。彼女[かのじょ]は身[み]を起[お]こし、イエスに仕[つか]えるようになった。"
  16: "夕方[ゆうがた]になると、悪霊[あくりょう]につかれた者[もの]たちが大勢[おおぜい]、イエスのもとへ運[はこ]ばれて来[き]た。イエスは言葉[ことば]ひとつで悪霊[あくりょう]を追[お]い払[はら]い、病人[びょうにん]をすべて癒[いや]した。"
  17: "これは、預言者[よげんしゃ]イザヤによって語[かた]られた言葉[ことば]が果[は]たされるためであった。「この方[かた]はわたしたちの患[わずら]いを引[ひ]き受[う]け、わたしたちの病[やまい]を背負[せお]った。」"
  18: "自分[じぶん]のまわりに群衆[ぐんしゅう]が集[あつ]まっているのを目[め]にしたイエスは、向[む]こう岸[ぎし]へ渡[わた]れと命[めい]じられた。"
  19: "そこへ、一人[ひとり]の律法学者[りっぽうがくしゃ]がやって来[き]て言[い]った。「先生[せんせい]。あなたが向[む]かわれる先[さき]なら、どこへなりともお供[とも]します。」"
  20: "イエスはその人[ひと]に言[い]われた。「<j>狐[きつね]には住[す]みかがあり、空[そら]の鳥[とり]には巣[す]がある。しかし、人[ひと]の子[こ]には、頭[あたま]を横[よこ]たえる所[ところ]さえない。</j>」"
  21: "別[べつ]の弟子[でし]が言[い]った。「主[しゅ]よ。まず、亡[な]くなった父[ちち]を葬[ほうむ]らせてください。」"
  22: "イエスは言[い]われた。「<j>わたしについて来[き]なさい。自分[じぶん]たちの死者[ししゃ]を葬[ほうむ]ることは、死者[ししゃ]たちに任[まか]せておきなさい。</j>」"
  23: "イエスが舟[ふね]に乗[の]り込[こ]むと、弟子[でし]たちもあとについて行[い]った。"
  24: "すると、湖[みずうみ]に激[はげ]しい嵐[あらし]が起[お]こり、舟[ふね]は波[なみ]に覆[おお]われるほどであった。イエスは眠[ねむ]っておられた。"
  25: "弟子[でし]たちはそばに寄[よ]って来[き]てイエスを起[お]こし、叫[さけ]んだ。「主[しゅ]よ、お助[たす]けください。このままでは溺[おぼ]れてしまいます。」"
  26: "イエスは言[い]われた。「<j>どうして、そんなに怯[おび]えているのか。信仰[しんこう]の乏[とぼ]しい者[もの]たちよ。</j>」そう言[い]って立[た]ち上[あ]がり、風[かぜ]と湖[みずうみ]とを叱[しか]りつけると、湖[みずうみ]は大[おお]きく凪[なぎ]になった。"
  27: "人々[ひとびと]は感嘆[かんたん]して言[い]った。「いったい、この人[ひと]は何者[なにもの]なのか。風[かぜ]も湖[みずうみ]も、この人[ひと]の言[い]うことを聞[き]くとは。」"
  28: "向[む]こう岸[ぎし]、ガダラ人[びと]の地[ち]にイエスが着[つ]かれると、墓場[はかば]から悪霊[あくりょう]に憑[つ]かれた者[もの]が二人[ふたり]、イエスの前[まえ]に現[あらわ]れた。二人[ふたり]はたいそう荒々[あらあら]しく、その道[みち]はだれも通[とお]り抜[ぬ]けられないほどだった。"
  29: "すると、彼[かれ]らは叫[さけ]んで言[い]った。「神[かみ]の子[こ]よ、わたしたちとあなたと何[なん]の関[かか]わりがあるのか。まだその時[とき]ではないのに、ここに来[き]て、わたしたちを苦[くる]しめるのか。」"
  30: "それよりずっと離[はな]れた所[ところ]に、大[おお]きな豚[ぶた]の群[む]れがえさを食[た]べていた。"
  31: "悪霊[あくりょう]どもはイエスに願[ねが]って言[い]った。「わたしたちを追[お]い出[だ]すのなら、あの豚[ぶた]の群[む]れの中[なか]に送[おく]り込[こ]んでくれ。」"
  32: "イエスが「<j>行[い]け。</j>」と言[い]うと、悪霊[あくりょう]どもは二人[ふたり]から抜[ぬ]け出[で]て豚[ぶた]の群[む]れに乗[の]り移[うつ]った。すると、豚[ぶた]は群[む]れをなして崖[がけ]から湖[みずうみ]へと転[ころ]げ落[お]ち、水[みず]に溺[おぼ]れて死[し]んだ。"
  33: "豚[ぶた]を飼[か]っていた者[もの]たちは逃[に]げ出[だ]し、町[まち]へ行[い]って、悪霊[あくりょう]につかれた者[もの]の身[み]に起[こ]きたこととともに、一部始終[いちぶしじゅう]を告[つ]げた。"
  34: "すると、町[まち]の人[ひと]がこぞってイエスを迎[むか]えに出[で]て来[き]た。そして、イエスの姿[すがた]を見[み]るなり、この地[ち]から立[た]ち去[さ]ってくれるよう頼[たの]んだ。"

