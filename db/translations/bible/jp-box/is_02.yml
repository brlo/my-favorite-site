# jp-box, Исаия, глава 2. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для главы есть, сверен; в текст не копировался; jp-ni не
# использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 2: 1 надписание; 2–4 гора Господня в последние дни и слово народов, мечи
# на орала; 5 призыв ходить в свете Господнем; 6–11 обличение: гадания, серебро,
# кони, идолы, день Господень; 12–17 день Господа Саваофа на всё высокое;
# 18–21 идолы брошены, люди скрываются в скалах; 22 «оставьте человека, у которого
# дыхание в ноздрях его» (стих есть у слав. и ru, в LXX отсутствует).
# Голоса: 2:3 — 「…」 (слова народов, одна цитата в пределах стиха); 2:9б — короткая
# 「…」 (в LXX это слово Господа от 1-го лица, у ru/МТ — 2-е лицо); остальное —
# авторский текст и пророческие возгласы без кавычек. Вводных формул, кроме 2:1,
# нет.
# Нумерация — славяно-синодальная (csl-ru), как и во всей книге: 22 стиха
# (в gr-lxx-byz — 21: стиха 2:22 там нет, лакуна модуля). Наш 2:22 переведён
# по csl 2:22 без 〔…〕 (паритет, п. 3), содержание — МТ 2:22; в LXX его нет.
# Остальные стихи совпадают по номерам с gr: наш 2:N = gr 2:N при N ≤ 21.
# 〔…〕 нет. Слав. добавлений, отсутствующих в LXX, в главе нет; слав. «дом иаковль»
# в 2:6 против «дом Израиля» в LXX — в notes, в тексте по csl.
# Сносок ⟨…⟩ нет: 杉, 樫, 洞窟, こうもり, 戦車 уже в корпусе.
# Имена: イザヤ, アモス, ヤコブ, シオン, レバノン, バシャン, ソドム/ゴモラ (1:9–10).

