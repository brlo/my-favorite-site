verses:
  1: "アモスの子[こ]イザヤに、主[しゅ]から臨[のぞ]んだ言葉[ことば]。ユダヤとエルサレムについてのものである。"
  2: "末[すえ]の日[ひ]に、主[しゅ]の山[やま]と神[かみ]の家[いえ]が、もろもろの山[やま]の頂[いただき]に現[あらわ]れ、丘[おか]よりも高[たか]く上[あ]げられる。そして、すべての民[たみ]がそこへ来[く]る。"
  3: "多[おお]くの民[たみ]が行[い]き、こう言[い]う。「さあ、主[しゅ]の山[やま]へ、ヤコブの神[かみ]の家[いえ]へ上[のぼ]ろう。主はわれわれにその道[みち]を告[つ]げ知[し]らせ、われわれはその道を歩[あゆ]む。律法[りっぽう]はシオンから、主[しゅ]の言葉[ことば]はエルサレムから出[で]るからである。」"
  4: "主[しゅ]はもろもろの民[たみ]の間[あいだ]を裁[さば]き、多[おお]くの民を責[せ]める。彼[かれ]らは剣[つるぎ]を打[う]ち鍛[きた]えて鋤[すき]とし、槍[やり]を鎌[かま]とする。民[たみ]は民に向[む]かって剣を上[あ]げず、もはや戦[たたか]いを学[まな]ばない。"
  5: "ヤコブの家[いえ]よ、来[こ]い。われわれは主[しゅ]の光[ひかり]のうちを歩[あゆ]もう。"
  6: "主[しゅ]はご自分[じぶん]の民[たみ]、ヤコブの家[いえ]を捨[す]てた。彼[かれ]らの地[ち]は初[はじ]めの時[とき]のように、異邦[いほう]の者[もの]たちの地と同じように、占[うらな]いで満[み]ち、彼[かれ]らには多[おお]くの異邦の子[こ]らが生[う]まれたからである。"
  7: "彼[かれ]らの地[ち]は銀[ぎん]と金[きん]で満[み]ち、その宝[たから]には数[かず]がない。地[ち]は馬[うま]で満ち、その戦車[せんしゃ]には数がない。"
  8: "地[ち]は彼[かれ]らの手[て]の業[わざ]の忌[い]まわしい物[もの]で満ち、彼らは自分[じぶん]の指[ゆび]が造[つく]ったものにひれ伏[ふ]した。"
  9: "人[ひと]はかがみ、男[おとこ]は低[ひく]くなった。そして、「わたしは彼らを赦[ゆる]さない。」"
  10: "さあ、岩[いわ]の中に入[はい]り、地[ち]の中に身[み]を隠[かく]せよ。主[しゅ]の恐[おそ]れと、その力[ちから]の栄光[えいこう]を避[さ]けて。主が立[た]ち上[あ]がって地[ち]を砕[くだ]くときに。"
  11: "主[しゅ]の目[め]は高[たか]く、人[ひと]は低[ひく]い。人[ひと]の高[たか]ぶりは低くされ、その日[ひ]には主だけが高く上[あ]げられる。"
  12: "万軍[ばんぐん]の主[しゅ]の日[ひ]が、すべての横暴[おうぼう]な者[もの]、すべて高[たか]ぶる者、すべて高[たか]い者、すべて空[そら]高[たか]くそびえる者[もの]の上[うえ]に臨[のぞ]み、彼[かれ]らは低[ひく]くされるからである。"
  13: "レバノンのすべての高[たか]くそびえる杉[すぎ]の木[き]、バシャンのすべての樫[かし]の木[き]、"
  14: "すべての高[たか]い山[やま]、すべて高くそびえる丘[おか]、"
  15: "すべての高[たか]い塔[とう]、すべての高[たか]い城壁[じょうへき]、"
  16: "すべての海[うみ]の船[ふね]、すべての美[うつく]しい船の姿[すがた]。"
  17: "人[ひと]はすべて低[ひく]くされ、人[ひと]の高[たか]ぶりは倒[たお]れ、その日[ひ]には主[しゅ]だけが高く上[あ]げられる。"
  18: "人々[ひとびと]は、手[て]で造[つく]ったすべてのものを隠[かく]す。"
  19: "すなわち、彼[かれ]らはそれを洞窟[どうくつ]へ、岩[いわ]の裂[さ]け目[め]へ、地[ち]の穴[あな]へ運[はこ]び込[こ]む。主[しゅ]の恐[おそ]れと、その力[ちから]の栄光[えいこう]を避[さ]けて。主が立[た]ち上[あ]がって地[ち]を砕[くだ]くときに。"
  20: "その日[ひ]、人[ひと]は、自分[じぶん]が拝[おが]むために造[つく]った銀[ぎん]の忌[い]まわしい物[もの]と金[きん]の忌まわしい物を、空[むな]しい者[もの]どもと、こうもりとに投[な]げ捨[す]てる。"
  21: "彼[かれ]らは、堅[かた]い岩[いわ]の穴[あな]へ、岩の裂[さ]け目[め]へ入[はい]ろうとする。主[しゅ]の恐[おそ]れと、その力[ちから]の栄光[えいこう]を避[さ]けて。主[しゅ]が立[た]ち上[あ]がって地[ち]を砕[くだ]くときに。"
  22: "あなたがたは、人[ひと]を当[あ]てにするのをやめよ。鼻[はな]の穴[あな]に息[いき]がある者[もの]を。彼[かれ]は何[なん]と数[かぞ]えられるのか。"

notes:
  1: "Ὁ λόγος ὁ γενόμενος παρὰ κυρίου πρὸς Ησαιαν υἱὸν Αμως — «слово, бывшее от Господа к Исаии, сыну Амосову»; слав. «слово бывшее от Господа ко исаии сыну амосову». περὶ τῆς Ιουδαίας καὶ περὶ Ιερουσαλημ — «об Иудее и об Иерусалиме». У ru (МТ) добавлено «в видении» — этого нет в LXX, не внесено. Стих — надписание, прямой речи нет."
  2: "ἐν ταῖς ἐσχάταις ἡμέραις — «в последние дни»; ἐμφανὲς τὸ ὄρος κυρίου καὶ ὁ οἶκος τοῦ θεοῦ — «явлена гора Господня и дом Божий» (ἐμφανής — явный, видимый): два подлежащих при одном сказуемом, соединены через と. ἐπ᾽ ἄκρων τῶν ὀρέων — «на вершинах гор» (ἄκρον — вершина); ὑψωθήσεται ὑπεράνω τῶν βουνῶν — «возвысится выше холмов». ἥξουσιν ἐπ᾽ αὐτὸ πάντα τὰ ἔθνη — «придут к нему все народы»; слав. «приидут к ней вси языцы» (род столицы/горы колеблется, в тексте そこへ)."
  3: "καὶ πορεύσονται ἔθνη πολλὰ καὶ ἐροῦσιν — «и пойдут народы многие и скажут»: прямая речь народов в 「…」, одна цитата в пределах стиха. Δεῦτε καὶ ἀναβῶμεν — «придите, взойдём» (сослагательное 1-го л. мн. ч.). ἀναγγελεῖ ἡμῖν τὴν ὁδὸν αὐτοῦ — «возвестит нам путь Свой»; πορευσόμεθα ἐν αὐτῇ — «будем ходить в нём (по нему)». ἐκ γὰρ Σιων ἐξελεύσεται νόμος καὶ λόγος κυρίου ἐξ Ιερουσαλημ — «ибо от Сиона выйдет закон и слово Господне из Иерусалима»: этот член тоже входит в слова народов, цитата закрывается в конце стиха."
  4: "κρινεῖ ἀνὰ μέσον τῶν ἐθνῶν — «будет судить между народами» (ἀνὰ μέσον — посреди, между); ἐλέγξει λαὸν πολύν — «обличит народ многий» (ἐλέγχω — обличать). συγκόψουσιν τὰς μαχαίρας αὐτῶν εἰς ἄροτρα — «перекуют мечи свои в плуги» (συγκόπτω — сковывать, перековывать; ἄροτρον — плуг, 鋤); τὰς ζιβύνας αὐτῶν εἰς δρέπανα — «копия свои в серпы» (ζιβύνη — копьё, дротик; δρέπανον — серп, 鎌). οὐ λήμψεται ἔτι ἔθνος ἐπ᾽ ἔθνος μάχαιραν — «не поднимет более народ на народ меча»; οὐ μὴ μάθωσιν ἔτι πολεμεῖν — «не научатся более воевать»."
  5: "Καὶ νῦν, ὁ οἶκος τοῦ Ιακωβ, δεῦτε πορευθῶμεν τῷ φωτὶ κυρίου — «и ныне, дом Иакова, придите, пойдём светом Господним» (τῷ φωτί — датив средства/образа действия); слав. «пойдем светом Господним». Это пророческий призыв, не чужая речь, поэтому без кавычек; им начинается новая часть главы."
  6: "ἀνῆκεν γὰρ τὸν λαὸν αὐτοῦ — «ибо Он оставил народ Свой» (ἀνίημι — отпускать, оставлять). τὸν οἶκον τοῦ Ισραηλ — «дом Израиля» в LXX; слав. читает «дом иаковль» (как МТ); по паритету в тексте csl (ヤコブの家), вариант LXX — здесь. ἐνεπλήσθη ὡς τὸ ἀπ᾽ ἀρχῆς ἡ χώρα αὐτῶν κληδονισμῶν — «наполнилась, как и в начале, земля их волхвований (гаданий)» (κληδονισμός — гадание, 占い); ὡς ἡ τῶν ἀλλοφύλων — «как [земля] иноплеменников» (ἀλλόφυλοι — обычно филистимляне). καὶ τέκνα πολλὰ ἀλλόφυλα ἐγενήθη αὐτοῖς — «и детей много иноплеменных родилось у них». ru (МТ) «переняли от востока» — иное чтение, не внесено."
  7: "ἐνεπλήσθη γὰρ ἡ χώρα αὐτῶν ἀργυρίου καὶ χρυσίου — «ибо наполнилась земля их серебром и золотом» (родительный наполнения). οὐκ ἦν ἀριθμὸς τῶν θησαυρῶν αὐτῶν — «не было числа сокровищам их». ἐνεπλήσθη ἡ γῆ ἵππων — «наполнилась земля конями»; οὐκ ἦν ἀριθμὸς τῶν ἁρμάτων αὐτῶν — «не было числа колесницам их» (ἅρμα — колесница, 戦車). Двойной повтор «наполнилась… нет числа» сохранён."
  8: "ἐνεπλήσθη ἡ γῆ βδελυγμάτων τῶν ἔργων τῶν χειρῶν αὐτῶν — «наполнилась земля мерзостей — дел рук их» (βδέλυγμα — мерзость, 忌まわしい物). προσεκύνησαν οἷς ἐποίησαν οἱ δάκτυλοι αὐτῶν — «поклонились тому, что сделали персты их» (προσκυνέω — поклоняться; δάκτυλος — перст); слав. «поклонишася тем, яже сотвориша персты их»."
  9: "καὶ ἔκυψεν ἄνθρωπος, καὶ ἐταπεινώθη ἀνήρ — «и поник человек, и унизился муж» (κύπτω — наклоняться; ταπεινόω — смирять). καὶ οὐ μὴ ἀνήσω αὐτούς — «и не отпущу (не пощажу) их»: 1-е лицо, слово Господа, поэтому короткая цитата. Слав. «не претерплю им» («не потерплю их») — иное понимание ἀνίημι; ru (МТ) «Ты не простишь их» — 2-е лицо, иное чтение, не внесено."
  10: "εἰσέλθετε εἰς τὰς πέτρας καὶ κρύπτεσθε εἰς τὴν γῆν — «войдите в скалы и скрывайтесь в землю» (повелительное мн. ч.). ἀπὸ προσώπου τοῦ φόβου κυρίου — «от лица страха Господня» (букв. «от лица», т. е. прочь от); ἀπὸ τῆς δόξης τῆς ἰσχύος αὐτοῦ — «от славы крепости Его». ὅταν ἀναστῇ θραῦσαι τὴν γῆν — «когда Он восстанет сокрушить землю» (θραύω — дробить, сокрушать); слав. «егда востанет сокрушити землю»."
  11: "οἱ ὀφθαλμοὶ κυρίου ὑψηλοί — «очи Господни высоки»; ὁ δὲ ἄνθρωπος ταπεινός — «человек же смирен (низок)». ταπεινωθήσεται τὸ ὕψος τῶν ἀνθρώπων — «смирится высота человеческая» (ὕψος — высота, высокомерие); ὑψωθήσεται κύριος μόνος ἐν τῇ ἡμέρᾳ ἐκείνῃ — «возвысится Господь один в день тот». Формула «в день тот» повторяется в 2:11, 17, 20 — рефрен сохранён."
  12: "ἡμέρα γὰρ κυρίου σαβαωθ — «ибо день Господа Саваофа» (первое появление 主の日 в книге). ἐπὶ πάντα ὑβριστὴν καὶ ὑπερήφανον — «на всякого наглеца и гордого» (ὑβριστής — дерзкий, наглый; ὑπερήφανος — высокомерный); ἐπὶ πάντα ὑψηλὸν καὶ μετέωρον — «на всякого высокого и превознесённого» (μετέωρος — парящий, надменный); καὶ ταπεινωθήσονται — «и смирятся». Перечисление 12–17 идёт без глагола в каждом члене — сохранено."
  13: "ἐπὶ πᾶσαν κέδρον τοῦ Λιβάνου τῶν ὑψηλῶν καὶ μετεώρων — «на всякий кедр Ливана, высокий и превознесённый» (κέδρος — кедр, 杉); ἐπὶ πᾶν δένδρον βαλάνου Βασαν — «на всякое дерево дуба Васанского» (βάλανος — жёлудь, дуб; Βασαν — горная область за Иорданом, バシャン); слав. «древо желудя васанска». Стих — член общего перечня, поэтому кончается запятой."
  14: "ἐπὶ πᾶν ὄρος καὶ ἐπὶ πάντα βουνὸν ὑψηλόν — «на всякую гору и на всякий холм высокий»; слав. «на всякую гору высокую и на всякий холм высокий». Порядок «гора — холм» сохранён (ср. 2:2, где наоборот: вершины гор выше холмов)."
  15: "ἐπὶ πάντα πύργον ὑψηλὸν καὶ ἐπὶ πᾶν τεῖχος ὑψηλόν — «на всякую башню высокую и на всякую стену высокую» (πύργος — башня, 塔; τεῖχος — городская стена, 城壁). Пара «башня — стена» соответствует паре «гора — холм» предыдущего стиха."
  16: "ἐπὶ πᾶν πλοῖον θαλάσσης — «на всякий корабль морской» (πλοῖον — корабль); ἐπὶ πᾶσαν θέαν πλοίων κάλλους — «на всякое зрелище красоты кораблей» (θέα — вид, зрелище; κάλλος — красота); слав. «на всяко видение доброты кораблей». ru (МТ) «корабли Фарсисские» — иное чтение, не внесено."
  17: "καὶ ταπεινωθήσεται πᾶς ἄνθρωπος, καὶ πεσεῖται ὕψος ἀνθρώπων — «и смирится всякий человек, и падёт высота человеческая» (πίπτω — падать); слав. «падется высота человеча». καὶ ὑψωθήσεται κύριος μόνος ἐν τῇ ἡμέρᾳ ἐκείνῃ — «и возвысится Господь один в день тот»: почти дословный повтор 2:11, рефрен сохранён."
  18: "καὶ τὰ χειροποίητα πάντα κατακρύψουσιν — «и рукотворённое всё скроют» (χειροποίητος — сделанный руками; κατακρύπτω — скрывать). При 3-м л. мн. ч. подлежащее не названо; в тексте 人々. ru (МТ) «идолы совсем исчезнут» — иное чтение; в LXX речь о том, что люди спрячут сделанное руками, и это продолжается в 2:19–20."
  19: "εἰσενέγκαντες εἰς τὰ σπήλαια καὶ εἰς τὰς σχισμὰς τῶν πετρῶν καὶ εἰς τὰς τρώγλας τῆς γῆς — «внеся в пещеры, в расселины скал и в норы земли»: аористный причастный оборот продолжает 2:18 («скроют, внеся…»), поэтому すなわち. σπήλαιον — пещера, σχισμή — расселина, τρώγλη — нора, пещерка. Далее — повтор рефрена 2:10 (страх Господень, слава крепости, восстание на сокрушение земли); слав. «в вертепы земныя»."
  20: "τῇ γὰρ ἡμέρᾳ ἐκείνῃ ἐκβαλεῖ ἄνθρωπος τὰ βδελύγματα αὐτοῦ τὰ ἀργυρᾶ καὶ τὰ χρυσᾶ — «ибо в день тот выбросит человек мерзости свои серебряные и золотые» (ἐκβάλλω — выбрасывать). ἃ ἐποίησαν προσκυνεῖν — «которые сделали, чтобы поклоняться [им]». τοῖς ματαίοις καὶ ταῖς νυκτερίσιν — «суетным и летучим мышам» (μάταιος — пустой, суетный; νυκτερίς — летучая мышь, こうもり); слав. «суетным и нетопырем». В тексте 空しい者ども передаёт «суетных» (т. е. ничтожных идолов), к которым бросают серебро и золото."
  21: "τοῦ εἰσελθεῖν εἰς τὰς τρώγλας τῆς στερεᾶς πέτρας — «чтобы войти в норы твёрдой скалы» (στερεός — твёрдый); καὶ εἰς τὰς σχισμὰς τῶν πετρῶν — «и в расселины скал»; далее повтор рефрена 2:10.19. Стих кончается здесь, как у слав.; слав. 2:22 (в gr-lxx-byz его нет) — отдельный стих, наш 2:22.\""
  22: "Стиха нет в LXX (в модуле лакуна). csl 2:22: «Оставите (убо) вам человека, емуже есть дыхание в ноздрех его: яко в чем вменися сей?» — «оставьте себе человека, у которого дыхание в ноздрях его: ибо в чём он сочтён?» (πνοή — дыхание; ῥίς — нос; λογίζομαι — считать, вменять). Переведено с csl без 〔…〕 (паритет, п. 3). МТ 2:22 у ru: «Перестаньте вы надеяться на человека, которого дыхание в ноздрях его: ибо что он значит?» — чтение иное, в текст не внесено; в тексте «人を当てにするのをやめよ» — по смыслу csl/ru, «鼻の穴に息がある者を。彼は何と数えられるのか» — по csl.\""
