verses:
  1: "主[しゅ]の怒[いか]りは再[ふたた]びイスラエルに燃[も]え上がり、主は彼[かれ]らの中[なか]でダビデをそそのかして言[い]われた。「行[い]って、イスラエルとユダを数[かぞ]えよ。」"
  2: "王[おう]は自分[じぶん]とともにいる軍[ぐん]の長[ちょう]ヨアブに言[い]った。「さあ、イスラエルのすべての部族[ぶぞく]、ユダの部族をダンからベエル・シェバまで巡[めぐ]り、民[たみ]を数[かぞ]えよ。民の数[かず]を知[し]ろう。」"
  3: "ヨアブは王[おう]に言[い]った。「あなたの神[かみ]である主[しゅ]が、あなたの民[たみ]を今[いま]の百倍[ひゃくばい]に増[ふ]やしてくださるように。わが主[あるじ]である王[おう]の目[め]が、それをご覧[らん]になるように。しかし、わが主である王は、なぜこのことを望[のぞ]まれるのか。」"
  4: "しかし、王[おう]の言葉[ことば]はヨアブと軍[ぐん]の長[ちょう]たちに勝[か]った。ヨアブと軍の長たちは、イスラエルの民[たみ]を数[かぞ]えるために王の前[まえ]から出[で]て行[い]った。"
  5: "彼[かれ]らはヨルダン川[がわ]を渡[わた]り、アロエルに陣[じん]を取[と]った。それはガドとエリエゼルの谷[たに]の真[ま]ん中[なか]にある町[まち]の右側[みぎがわ]である。"
  6: "そしてガラデとファバソンの地[ち]へ行[い]き、イストンとダサへ行って、ダニダンに入[はい]り、シドンを巡[めぐ]った。"
  7: "彼らはツロの要害[ようがい]と、ヒビ人[じん]とカナン人[じん]のすべての町[まち]へ行き、ユダの南[みなみ]へ下[くだ]ってベエル・シェバに至[いた]った。"
  8: "彼らは全[ぜん]国[こく]を巡[めぐ]り回[まわ]って、九[きゅう]か月[げつ]と二十日[はつか]の後[のち]にエルサレムに来[き]た。"
  9: "ヨアブは数[かぞ]えた民の数[かず]を王[おう]に渡[わた]した。イスラエルには剣[けん]を取[と]る力[ちから]ある男[おとこ]が八十万[はちじゅうまん]人[にん]、ユダの男[おとこ]たちは戦[たたか]う者[もの]が五十万[ごじゅうまん]人[にん]であった。"
  10: "民[たみ]を数[かぞ]えた後[のち]、ダビデの心[こころ]は恐[おそ]れに打[う]たれた。ダビデは主[しゅ]に言[い]った。「わたしはこの言葉[ことば]を行[おこな]って、ひどく罪[つみ]を犯[おか]した。主[しゅ]よ、どうか今[いま]、しもべの不法[ふほう]を過[す]ぎ越[こ]させてほしい。わたしはひどく愚[おろ]かであったからである。」"
  11: "ダビデは朝[あさ]に起[お]きた。主[しゅ]の言葉[ことば]が、預言者[よげんしゃ]ガド、すなわちダビデの先見者[せんけんしゃ]に臨[のぞ]んで言[い]われた。"
  12: "「行[い]って、ダビデに言[い]え。主[しゅ]はこう言[い]われる。わたしはお前[まえ]に三[みっ]つのことを課[か]す。その中[なか]から一[ひと]つを選[えら]べ。わたしはそれを、お前のために行[おこな]う。」"
  13: "ガドはダビデのところに来[き]て、彼[かれ]に告[つ]げて言[い]った。「あなたの地[ち]に三年[さんねん]の飢[き]饉[きん]が来[く]るのと、あなたが敵[てき]の前[まえ]から三[みっ]か月[げつ]逃[に]げて、彼らがあなたを追[お]いかけるのと、あなたの地に三日[みっか]の死[し]が臨[のぞ]むのと、どれを選[えら]ぶのか。さあ、考[かんが]えて、わたしを遣[つか]わした方[かた]に何[なに]と答[こた]えるかを定[さだ]めよ。」"
  14: "ダビデはガドに言[い]った。「わたしはこの三[みっ]つ、どれも非常[ひじょう]に苦[くる]しい。主[しゅ]の手[て]に落[お]ちよう。主の憐[あわ]れみは大[おお]きいから。人[ひと]の手には落ちたくない。」そしてダビデは死[し]と、小麦[こむぎ]の刈[か]り入[い]れの日々[ひび]を選[えら]んだ。"
  15: "主[しゅ]はイスラエルに死[し]を与[あた]え、それは朝[あさ]から昼[ひる]の食事[しょくじ]の時[とき]まで続[つづ]いた。災[わざわ]いが民[たみ]の間[あいだ]に始[はじ]まり、主[しゅ]の民のうち、ダンからベエル・シェバまで七万[しちまん]人[にん]の男[おとこ]が死[し]んだ。"
  16: "神[かみ]の使[つか]いはエルサレムに向[む]かって手[て]を伸[の]べ、それを滅[ほろ]ぼそうとした。主[しゅ]はその災[わざわ]いを悔[く]やみ、民[たみ]を滅ぼしている使[つか]いに言[い]われた。「もう十分[じゅうぶん]だ。手[て]を下[お]ろせ。」主[しゅ]の使いはエブス人[じん]オルナの脱穀場[だっこくじょう]のそばにいた。"
  17: "ダビデは、民[たみ]を打[う]つ使[つか]いを見[み]て、主[しゅ]に言[い]った。「見[み]よ、罪[つみ]を犯[おか]したのはこのわたしであり、悪[わる]いことをしたのは、この羊飼[ひつじか]いである。この羊[ひつじ]たちは何[なに]をしたというのか。どうか、あなたの手[て]がわたしと、わたしの父[ちち]の家[いえ]の上[うえ]に下[くだ]るように。」"
  18: "その日[ひ]、ガドはダビデのところに来[き]て言[い]った。「上[のぼ]って、エブス人[じん]オルナの脱穀場[だっこくじょう]に、主[しゅ]のための祭壇[さいだん]を築[きず]きなさい。」"
  19: "ダビデは、主[しゅ]が命[めい]じられたとおり、ガドの言葉[ことば]に従[したが]って上[のぼ]った。"
  20: "オルナはのぞいて、王[おう]と、自分[じぶん]のところへ歩[あゆ]み寄[よ]る若者[わかもの]たちを見[み]た。オルナは出[で]て行[い]き、顔[かお]を地[ち]につけて王を拝[おが]んだ。"
  21: "オルナは言[い]った。「わが主[あるじ]である王[おう]が、なぜしもべのところへおいでになったのか。」ダビデは言[い]った。「この脱穀場[だっこくじょう]をあなたから買[か]い取[と]り、主[しゅ]のために祭壇[さいだん]を築[きず]いて、災[わざわ]いが民[たみ]の上[うえ]で止[と]まるようにするためである。」"
  22: "オルナはダビデに言[い]った。「わが主[あるじ]である王[おう]は、自分[じぶん]の目[め]に良[よ]いと思[おも]われるものを取[と]って、主[しゅ]に捧[ささ]げられるがよい。見[み]よ、燔祭[はんさい]のための牛[うし]、薪[たきぎ]のための脱穀[だっこく]の車輪[しゃりん]と牛の用具[ようぐ]がある。」"
  23: "すべてのものを、オルナは王[おう]に与[あた]えた。オルナはまた王に言[い]った。「あなたの神[かみ]である主[しゅ]が、あなたを祝福[しゅくふく]してくださるように。」"
  24: "王[おう]はオルナに言[い]った。「いや、どうしても買[か]い取[と]る。あなたから代価[だいか]を払[はら]って買わなければ、主[しゅ]であるわたしの神[かみ]に、ただで燔祭[はんさい]を捧[ささ]げはしない。」ダビデは脱穀場[だっこくじょう]と牛[うし]を、銀[ぎん]五十[ごじゅう]シケルで買[か]い取[と]った。"
  25: "ダビデはそこに主[しゅ]のために祭壇[さいだん]を築[きず]き、燔祭[はんさい]と酬恩祭[しゅうおんさい]を捧[ささ]げた。ソロモンは、初[はじ]めは小[ちい]さかったので、後[のち]にこの祭壇[さいだん]に加[くわ]えた。主[しゅ]はその地[ち]に答[こた]えられ、災[わざわ]いはイスラエルの上[うえ]から除[のぞ]かれた。"

notes:
  1: "προσέθετο ὀργὴ κυρίου ἐκκαῆναι — 主の怒りは再び燃え上がり (προστίθημι — прибавлять, «опять»). ἐπέσεισεν τὸν Δαυιδ ἐν αὐτοῖς — 彼らの中でダビデをそそのかした (ἐπισείω — потрясать, возбуждать). В 1 Пар 21:1 возбуждает сатана; здесь, по LXX и csl, — Господь; не сглажено. λέγων — говоря; слова Бога в 「…」."
  2: "ἄρχοντα τῆς ἰσχύος — 軍の長 (ἰσχύς — сила). Δίελθε δὴ πάσας φυλὰς Ισραηλ — イスラエルのすべての部族を巡れ. ἀπὸ Δαν καὶ ἕως Βηρσαβεε — ダンからベエル・シェバまで (здесь Βηρσαβεε — город, не Вирсавия-женщина). В csl добавлено «и иудина» (и Иудина) — нет в LXX, по паритету в тексте. ἐπίσκεψαι — 数えよ (перепись)."
  3: "προσθείη κύριος — да приложит Господь (оптатив). ὥσπερ αὐτοὺς καὶ ὥσπερ αὐτοὺς ἑκατονταπλασίονα — 今の百倍に増やして (букв. «как они и как они, стократно»); в csl «к людем твоим» — добавлено «твоим», по паритету в тексте (あなたの民). ὀφθαλμοὶ τοῦ κυρίου μου τοῦ βασιλέως ὁρῶντες — わが主である王の目が、それをご覧になるように. ἵνα τί βούλεται ἐν τῷ λόγῳ τούτῳ — なぜこのことを望まれるのか."
  4: "ὑπερίσχυσεν ὁ λόγος τοῦ βασιλέως — 王の言葉が勝った (ὑπερισχύω). εἰς τοὺς ἄρχοντας τῆς δυνάμεως — 軍の長たちに. ἐξῆλθεν… ἐνώπιον τοῦ βασιλέως — 王の前から出て行った. ἐπισκέψασθαι — 数えるために."
  5: "διέβησαν τὸν Ιορδάνην — ヨルダン川を渡り. παρενέβαλον ἐν Αροηρ — アロエルに陣を取った (παρεμβάλλω). ἐκ δεξιῶν τῆς πόλεως — 町の右側に. τῆς ἐν μέσῳ τῆς φάραγγος Γαδ καὶ Ελιεζερ — ガドとエリエゼルの谷の真ん中にある (Γαδ καὶ Ελιεζερ — названия, возможно искажённые)."
  6: "Γαλααδ — ガラデ. γῆν Θαβασων — ファバソンの地. ἥ ἐστιν Αδασαι — LXX «которая есть Адасаи»; в csl «и истон и в дасу» (Истон и Даса) — по паритету в тексте. Δανιδαν καὶ Ουδαν — ダニダンとウダン; в csl только «данидан». ἐκύκλωσαν εἰς Σιδῶνα — シドンを巡った."
  7: "Μαψαρ Τύρου — ツロの要害 (Μαψαρ — «укрепление»; слав. «мапсар тирский»). πόλεις τοῦ Ευαίου καὶ τοῦ Χαναναίου — ヒビ人とカナン人のすべての町 (Ευαῖος — евеи, хиввеи). κατὰ νότον Ιουδα — ユダの南へ. εἰς Βηρσαβεε — ベエル・シェバに."
  8: "περιώδευσαν — 巡り回った (περιοδεύω). ἀπὸ τέλους ἐννέα μηνῶν καὶ εἴκοσι ἡμερῶν — 九か月と二十日の後に (букв. «от конца девяти месяцев и двадцати дней»)."
  9: "ὀκτακόσιαι χιλιάδες ἀνδρῶν δυνάμεως — 八十万人の力ある男たち. σπωμένων ῥομφαίαν — 剣を取る者 (σπάω — обнажать). ἀνὴρ Ιουδα πεντακόσιαι χιλιάδες — ユダの男たち五十万人. μαχητῶν — 戦う者."
  10: "ἐπάταξεν καρδία Δαυιδ αὐτὸν — «поразило сердце Давида»; в csl «убояся сердце давидово» — «устрашилось»; передано 恐れに打たれた, чтобы совместить оба чтения. μετὰ τὸ ἀριθμῆσαι — 数えた後. Ἥμαρτον σφόδρα ὃ ἐποίησα — ひどく罪を犯した; в csl добавлено «глагол сей» (слово сие) — по паритету в тексте. παραβίβασον τὴν ἀνομίαν — 不法を過ぎ越させてほしい (παραβαίνω — переступить, простить). ἐμωράνθην σφόδρα — ひどく愚かであった (μωραίνω)."
  11: "τὸ πρωί — 朝に. λόγος κυρίου ἐγένετο πρὸς Γαδ — 主の言葉がガドに臨んだ. τὸν προφήτην τὸν ὁρῶντα Δαυιδ — 預言者、ダビデの先見者 (ὁ ὁρῶν — «видящий»; слав. «прозорливец»)."
  12: "Τρία ἐγώ εἰμι αἴρω ἐπὶ σέ — わたしはお前に三つのことを課す (αἴρω — поднимать, наводить; слав. «трое аз наведу на тя»). ἔκλεξαι σεαυτῷ ἓν ἐξ αὐτῶν — その中から一つを選べ. ποιήσω σοι — お前のために行う."
  13: "τρία ἔτη λιμός — 三年の飢饉; в Синодальном «семь лет» по масоретскому тексту — не вносим. φεύγειν σε ἔμπροσθεν τῶν ἐχθρῶν — 敵の前から逃げる. τρεῖς ἡμέρας θάνατον — 三日の死 (мор). γνῶθι καὶ ἰδέ — 考えて見定めよ. τί ἀποκριθῶ τῷ ἀποστείλαντί με — 遣わした方に何と答えるか."
  14: "Στενά μοι πάντοθεν σφόδρα — わたしはこの三つ、どれも非常に苦しい (στενός — тесный; πάντοθεν — отовсюду, т.е. все три наказания тесны); в csl добавлено «три сия» — нет в LXX, по паритету в тексте. ἐμπεσοῦμαι ἐν χειρὶ κυρίου — 主の手に落ちよう. πολλοὶ οἱ οἰκτιρμοὶ αὐτοῦ — 憐れみは大きい (οἰκτιρμός). εἰς χεῖρας ἀνθρώπου οὐ μὴ ἐμπέσω — 人の手には落ちたくない. ἐξελέξατο ἑαυτῷ τὸν θάνατον — 死を選んだ; в csl добавлено «и дни жатвенныя пшеницы» — в LXX эти слова стоят в начале ст. 15; по паритету (порядок csl) они в конце ст. 14."
  15: "ἡμέραι θερισμοῦ πυρῶν — 小麦の刈り入れの日々 (в LXX — начало стиха). ἀπὸ πρωίθεν ἕως ὥρας ἀρίστου — 朝から昼の食事の時まで (ἄριστον — обед). ἡ θραῦσις — 災い, поражение (θραύω — сокрушать). ἀπὸ Δαν καὶ ἕως Βηρσαβεε — ダンからベエル・シェバまで. ἑβδομήκοντα χιλιάδες ἀνδρῶν — 七万人. В csl «от людий Господних» — добавлено «Господних», нет в LXX; по паритету в тексте."
  16: "ἐξέτεινεν ὁ ἄγγελος τοῦ θεοῦ τὴν χεῖρα — 神の使いは手を伸べた. τοῦ διαφθεῖραι — 滅ぼすために. παρεκλήθη κύριος ἐπὶ τῇ κακίᾳ — 主はその災いを悔やみ (παρακαλέω — смягчиться, сжалиться; слав. «раскаяся»). Πολὺ νῦν, ἄνες τὴν χεῖρά σου — もう十分だ、手を下ろせ (ἀνίημι — отпускать). παρὰ τῷ ἅλῳ Ορνα τοῦ Ιεβουσαίου — エブス人オルナの脱穀場のそば (ἅλων — гумно)."
  17: "ἐν τῷ ἰδεῖν αὐτὸν τὸν ἄγγελον τύπτοντα — 民を打つ使いを見て (τύπτω — поражать). Ἰδοὺ ἐγώ εἰμι ἠδίκησα — 見よ、罪を犯したのはこのわたし (ἀδικέω). ὁ ποιμὴν ἐκακοποίησα — 悪いことをしたのは、この羊飼い (κακοποιέω). τὰ πρόβατα τί ἐποίησαν — この羊たちは何をしたのか. γενέσθω ἡ χεῖρ σου ἐν ἐμοὶ καὶ ἐν τῷ οἴκῳ τοῦ πατρός μου — あなたの手がわたしと父の家の上に下るように."
  18: "Ἀνάβηθι — 上れ. στῆσον τῷ κυρίῳ θυσιαστήριον — 主のために祭壇を築け (ἵστημι — ставить). ἐν τῷ ἅλωνι Ορνα — オルナの脱穀場に."
  19: "κατὰ τὸν λόγον Γαδ — ガドの言葉に従って. καθ᾽ ὃν τρόπον ἐνετείλατο αὐτῷ κύριος — 主が命じられたとおりに (ἐντέλλομαι)."
  20: "διέκυψεν — のぞいて (διακύπτω — выглядывать; слав. «преклонися»). τοὺς παῖδας αὐτοῦ παραπορευομένους ἐπάνω αὐτοῦ — 自分のところへ歩み寄る若者たち (παραπορεύομαι — проходить мимо, приближаться). προσεκύνησεν ἐπὶ πρόσωπον ἐπὶ τὴν γῆν — 顔を地につけて拝んだ."
  21: "Τί ὅτι ἦλθεν ὁ κύριός μου ὁ βασιλεύς — なぜわが主である王がおいでになったのか. Κτήσασθαι παρὰ σοῦ τὸν ἅλωνα — 脱穀場をあなたから買い取るため (κτάομαι — приобретать). συσχεθῇ ἡ θραῦσις — 災いが止まるように (συνέχω/συσχέω — сдерживать, останавливать). В csl в скобках добавлено «(приидох)» — вставка, нет в LXX, не переведена."
  22: "Λαβέτω καὶ ἀνενεγκέτω — 取って捧げよ (ἀναφέρω — возносить). τὸ ἀγαθὸν ἐν ὀφθαλμοῖς αὐτοῦ — 自分の目に良いと思うもの. οἱ βόες εἰς ὁλοκαύτωμα — 燔祭のための牛. οἱ τροχοὶ καὶ τὰ σκεύη τῶν βοῶν εἰς ξύλα — 脱穀の車輪と牛の用具を薪に (τροχός — колесо; слав. «колеса и сосуди волов»). В csl в скобках «(Богу)» — вставка, не переведена."
  23: "τὰ πάντα ἔδωκεν Ορνα τῷ βασιλεῖ — すべてをオルナは王に与えた. εὐλογήσαι σε — あなたを祝福してくださるように (оптатив)."
  24: "Οὐχί — いや. κτώμενος κτήσομαι παρὰ σοῦ ἐν ἀλλάγματι — 代価を払って買い取る (ἀλλάγμα — плата, обмен). ὁλοκαύτωμα δωρεάν — ただで燔祭を (δωρεάν — даром). ἐν ἀργυρίῳ σίλκων πεντήκοντα — 銀五十シケルで. В 1 Пар 21:25 — 600 сиклей золота; здесь, по LXX и csl, — 50 сиклей серебра."
  25: "ᾠκοδόμησεν θυσιαστήριον — 祭壇を築いた. ἀνήνεγκεν ὁλοκαυτώσεις καὶ εἰρηνικάς — 燔祭と酬恩祭を捧げた (εἰρηνικός — мирная жертва). προσέθηκεν Σαλωμων ἐπὶ τὸ θυσιαστήριον ἐπ᾽ ἐσχάτῳ — ソロモンは後にこの祭壇に加えた (ἐπ᾽ ἔσχατον — «в конце, после»). ὅτι μικρὸν ἦν ἐν πρώτοις — 初めは小さかったからである. ἐπήκουσεν κύριος τῇ γῇ — 主はその地に答えられた (букв. «услышал землю»). συνεσχέθη ἡ θραῦσις ἐπάνωθεν Ισραηλ — 災いはイスラエルの上から除かれた."
