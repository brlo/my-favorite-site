# jp-box, 2-я Царств, глава 24. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); церковнославянский (csl-ru) — второй
# свидетель церковного текста (новый паритет, docs/japanese-bible.md):
# слав. чтения и добавки входят в основной текст без 〔…〕, вариант LXX — в notes.
# ru (Синодальный) — только для понимания, не источник.
# Глава 24: перепись (1–9), мор (10–17), жертвенник на гумне Орны (18–25).
# Речь — 常体; слова Бога и людей — 「…」.
# Особенности паритета: 1 — «возбудил Давида» (LXX/csl, не сатана, как в 1 Пар 21:1);
# 2 — «и Иудина» добавлено в csl (нет в LXX) — в тексте; 14–15 — порядок
# «смерть и дни жатвы пшеницы» по csl; 15 — «от людий Господних» добавлено в csl.
# 〔…〕 нет. Сносок ⟨…⟩ нет: 祭壇, 燔祭, 酬恩祭, 脱穀場, 預言者 уже в корпусе.
# jp-ni не использовался (в 2 Цар его нет).

