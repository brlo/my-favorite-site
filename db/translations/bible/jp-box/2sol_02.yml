# jp-box, 2-е Послание к Фессалоникийцам, глава 2. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 2: мольба не смущаться вестью о дне Господнем (1–2), пока не придут
# отступление и «человек беззакония» (3–4), напоминание (5), «удерживающее» и
# «удерживающий», тайна беззакония (6–7), явление беззаконника и его гибель (8–10),
# попущенное заблуждение (11–12), благодарение и призвание (13–14), стойкость (15),
# благословение (16–17).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет, <j>/<mo> не ставятся.
# 〔…〕 в главе нет: 2:8 [Ἰησοῦς] и 2:16 [ὁ] стоят в базе в квадратных скобках — слово есть,
# поэтому не оборачивается.
# Тёмные места не сглажены: 不法の人 (ὁ ἄνθρωπος τῆς ἀνομίας), 抑制するもの/者 (τὸ κατέχον /
# ὁ κατέχων), 不法の秘密 (τὸ μυστήριον τῆς ἀνομίας), ὅπως… 中から取り除かれるまで — все
# оставлены как в греческом, без отождествлений; разбор — в notes. Сносок ⟨…⟩ в главе нет.
# jp-ni не использовался.

tr_code: jp-box
book: 2sol
chapter: 2
draft: true

verses:
  1: "さて、兄弟[きょうだい]たち、わたしたちの主[しゅ]イエス・キリストの来臨[らいりん]と、わたしたちが彼[かれ]のもとに集[あつ]められることについては、あなたがたに願[ねが]う。"
  2: "主[しゅ]の日[ひ]がすでに来[き]ている、と、霊[れい]によるとか、言葉[ことば]によるとか、わたしたちからのものに見[み]える手紙[てがみ]によるとか言[い]って、あなたがたがすぐに心[こころ]を揺[ゆ]り動[うご]かされ、おびえることのないように。"
  3: "だれにも、どんな仕方[しかた]でも、あなたがたは欺[あざむ]かれてはならない。なぜなら、まず背教[はいきょう]が起[お]こり、不法[ふほう]の人[ひと]、滅[ほろ]びの子[こ]が現[あらわ]れなければならないからである。"
  4: "この者[もの]は、神[かみ]と呼[よ]ばれるもの、また礼拝[れいはい]されるものすべてに逆[さから]い、自[みずか]らを高[たか]くし、ついには神[かみ]の神殿[しんでん]に座[ざ]して、自分[じぶん]こそ神[かみ]であると示[しめ]す者[もの]である。"
  5: "わたしがまだあなたがたのところにいたとき、これらのことをあなたがたに話[はな]したのを、覚[おぼ]えていないのか。"
  6: "そして今[いま]、彼[かれ]が自分[じぶん]の時[とき]に現[あらわ]れるために、何[なに]が抑制[よくせい]しているのかを、あなたがたは知[し]っている。"
  7: "なぜなら、不法[ふほう]の秘密[ひみつ]はすでに働[はたら]いている。ただ、今[いま]抑制[よくせい]している者[もの]が、中[なか]から取[と]り除[のぞ]かれるまでは。"
  8: "そのとき、不法[ふほう]の者[もの]が現[あらわ]れる。主[しゅ]イエスは、ご自分[じぶん]の口[くち]の息[いき]をもって彼[かれ]を殺[ころ]し、ご自分[じぶん]の来臨[らいりん]の現[あらわ]れをもって彼[かれ]を無[む]にされる。"
  9: "この者[もの]の来臨[らいりん]は、サタンの働[はたら]きに従[したが]い、あらゆる力[ちから]と、偽[にせ]のしるしと奇跡[きせき]とによって行[おこな]われる。"
  10: "また、その来臨[らいりん]は、滅[ほろ]び行[ゆ]く者[もの]たちに対して、あらゆる不義[ふぎ]の欺[あざむ]きをもって行[おこな]われる。彼[かれ]らが、救[すく]われるために真理[しんり]への愛[あい]を受[う]け入[い]れなかったからである。"
  11: "それゆえ、神[かみ]は彼[かれ]らに惑[まど]いの働[はたら]きを送[おく]って、彼[かれ]らが偽[いつわ]りを信[しん]じるようにされる。"
  12: "それは、真理[しんり]を信[しん]じず、不義[ふぎ]を喜[よろこ]んだ者[もの]たちすべてが、裁[さば]かれるためである。"
  13: "しかし、主[しゅ]に愛[あい]されている兄弟[きょうだい]たち、わたしたちは、あなたがたのためにいつも神[かみ]に感謝[かんしゃ]すべきである。神[かみ]があなたがたを、{聖霊[せいれい]|聖神[せいしん]}による聖[きよ]めと真理[しんり]への信仰[しんこう]とによって、救[すく]いの初穂[はつほ]として選[えら]ばれたからである。"
  14: "このために、神[かみ]はわたしたちの福音[ふくいん]によってあなたがたを召[め]された。あなたがたが、わたしたちの主[しゅ]イエス・キリストの栄光[えいこう]を得[え]るためである。"
  15: "だから、兄弟[きょうだい]たち、しっかりと立[た]ち、わたしたちの言葉[ことば]によってであれ、手紙[てがみ]によってであれ、あなたがたが教[おし]えられた言[い]い伝[つた]えを堅[かた]く守[まも]りなさい。"
  16: "しかし、わたしたちの主[しゅ]イエス・キリストご自身[じしん]と、わたしたちを愛[あい]し、{恵[めぐ]み|恩寵[おんちょう]}によって永遠[えいえん]の慰[なぐさ]めと良[よ]き希望[きぼう]とを与[あた]えてくださった、わたしたちの父[ちち]である神[かみ]が、"
  17: "あなたがたの心[こころ]を慰[なぐさ]め、あらゆる善[よ]い行[おこな]いと言葉[ことば]とにおいて、あなたがたを強[つよ]めてくださいますように。"

notes:
  1: "Ἐρωτῶμεν δέ — さて…願う («просим»; δέ связка, не «но»). παρουσία — 来臨, термин (в 2:8.9 им же названо пришествие беззаконника — параллель сохранена). ἐπισυναγωγή ἐπ᾿ αὐτόν — 彼のもとに集められること."
  2: "εἰς τὸ μὴ ταχέως σαλευθῆναι ὑμᾶς ἀπὸ τοῦ νοός — «чтобы вам скоро не поколебаться умом»; すぐに心を揺り動かされ. θροεῖσθαι — おびえる. μήτε διὰ πνεύματος μήτε διὰ λόγου μήτε δι᾿ ἐπιστολῆς — 霊によるとか、言葉によるとか、手紙によるとか: три источника ложной вести. ὡς δι᾿ ἡμῶν — «как бы через нас», то есть поддельное письмо. ἐνέστηκεν — すでに来ている (perfect, «наступил»)."
  3: "ἐξαπατήσῃ — 欺く. κατὰ μηδένα τρόπον — どんな仕方でも. ἀποστασία — 背教 (религиозное отпадение, не просто уход). ὁ ἄνθρωπος τῆς ἀνομίας — 不法の人; ὁ υἱὸς τῆς ἀπωλείας — 滅びの子. Описание продолжается в 4-м стихе; ὁ υἱὸς τῆς ἀπωλείας — приложение к «человеку беззакония», поэтому 不法の人、滅びの子."
  4: "ὁ ἀντικείμενος καὶ ὑπεραιρόμενος — 逆らい、自らを高くし. ἐπὶ πάντα λεγόμενον θεὸν ἢ σέβασμα — «на всё, что называется Богом или святыней»; 神と呼ばれるもの、また礼拝されるもの. εἰς τὸν ναὸν τοῦ θεοῦ καθίσαι — 神の神殿に座して (aor. inf., «сесть»). ἀποδεικνύντα ἑαυτὸν ὅτι ἔστιν θεός — 自分こそ神であると示す. Ни храм, ни время не отождествлены — как и в тексте."
  5: "οὐ μνημονεύετε ὅτι — 覚えていないのか; риторический вопрос, ответ подразумевается положительный."
  6: "τὸ κατέχον — средний род: «то, что удерживает»; 抑制しているもの. οἴδατε — знаете; что именно — не сказано, и это намеренно: в тексте нет ни имени, ни отождествления. εἰς τὸ ἀποκαλυφθῆναι αὐτὸν ἐν τῷ ἑαυτοῦ καιρῷ — 彼が自分の時に現れるために."
  7: "τὸ μυστήριον τῆς ἀνομίας — 不法の秘密, без смягчения. ἤδη ἐνεργεῖται — уже действует (praes.). ὁ κατέχων — мужской род: «тот, кто удерживает»; 抑制している者 (в 6-м — 抑制しているもの, средний; различие родов сохранено). ἄρτι — 今. ἕως ἐκ μέσου γένηται — «доколе не будет взят из среды»; 中から取り除かれるまで. Решение по 2:6–7: не отождествлять удерживающего (Римское государство, проповедь Евангелия, Святой Дух, архангел — толкования расходятся) и не сглаживать неясность; поэтому 何が…のか (6) остаётся вопросом, а 7-й стих обрывается на までは, как и греческий. γένηται (не ἄρθῃ) допускает и «выйдет из среды», но 取り除かれる точнее передаёт ἐκ μέσου γίνεσθαι."
  8: "ὁ ἄνομος — 不法の者 (тот же, что 不法の人 в 3-м ст.). ἀνελεῖ τῷ πνεύματι τοῦ στόματος αὐτοῦ — 口の息をもって殺し (ср. Ис 11:4). καταργήσει — 無にする («упразднит»). ἐπιφάνεια τῆς παρουσίας — 来臨の現れ. В базе [Ἰησοῦς] в квадратных скобках — слово есть, 〔〕 не ставятся."
  9: "οὗ ἐστιν ἡ παρουσία — この者の来臨. κατ᾿ ἐνέργειαν τοῦ Σατανᾶ — サタンの働きに従い. σημεῖα καὶ τέρατα ψεύδους — 偽りのしるしと奇跡; ψεύδους относится к обоим (род. качества)."
  10: "ἐν πάσῃ ἀπάτῃ ἀδικίας — あらゆる不義の欺き; その来臨は добавлено повторно, чтобы стих читался отдельно (в греческом 9–10 — одно предложение). τοῖς ἀπολλυμένοις — 滅び行く者たち (praes., «погибающим»). ἀνθ᾿ ὧν — «за то, что»; そのゆえ. ἀγάπην τῆς ἀληθείας — 真理への愛 (род. объектный); οὐκ ἐδέξαντο — 受け入れなかった."
  11: "διὰ τοῦτο — それゆえ. πέμπει — посылает (praes.; ср. Рим 1:24.26). ἐνέργειαν πλάνης — 惑いの働き. εἰς τὸ πιστεῦσαι αὐτοὺς τῷ ψεύδει — 偽りを信じるように. Не сглажено: Бог посылает действие заблуждения."
  12: "κριθῶσιν — 裁かれる (pass. от κρίνω). οἱ μὴ πιστεύσαντες τῇ ἀληθεία ἀλλὰ εὐδοκήσαντες τῇ ἀδικίᾳ — 真理を信じず、不義を喜んだ者たち; ἀλλά передано противопоставлением 信じず…喜んだ, без отдельного «но»."
  13: "ἀδελφοὶ ἠγαπημένοι ὑπὸ κυρίου — 主に愛されている兄弟たち. εἵλατο — 選ばれた. ἀπαρχὴν εἰς σωτηρίαν — 救いの初穂 (в базе ἀπαρχήν; вариант ἀπ᾿ ἀρχῆς «от начала» отражён у jp-joc 始めより, но он не чтение базы). ἐν ἁγιασμῷ πνεύματος — 聖霊による聖め; πνεῦμα здесь — Святой Дух, поэтому {聖霊|聖神} по кальке. πίστει ἀληθείας — 真理への信仰 (род. объектный)."
  14: "εἰς ὃ ἐκάλεσεν ὑμᾶς διὰ τοῦ εὐαγγελίου ἡμῶν — このために、わたしたちの福音によって召された. εἰς περιποίησιν δόξης — «в приобретение славы»; 栄光を得る."
  15: "ἄρα οὖν — だから (вывод; оба слова переданы). στήκετε — しっかりと立ち. κρατεῖτε τὰς παραδόσεις — 言い伝えを堅く守る. εἴτε διὰ λόγου εἴτε δι᾿ ἐπιστολῆς ἡμῶν — わたしたちの言葉によってであれ、手紙によってであれ."
  16: "ὁ ἀγαπήσας ἡμᾶς καὶ δούς — 私たちを愛し…与えてくださった方. παράκλησις αἰωνία — 永遠の慰め (ср. 2 Кор 1:3–7). ἐλπὶς ἀγαθή — 良き希望. Предложение продолжается в 17-м стихе, как в греческом, поэтому стих кончается на が、. В базе [ὁ] в квадратных скобках — слово есть, 〔〕 не ставятся."
  17: "παρακαλέσαι… καὶ στηρίξαι — 慰め…強めてくださるように (два оптатива). ἐν παντὶ ἔργῳ καὶ λόγῳ ἀγαθῷ — あらゆる善い行いと言葉とにおいて; порядок ἔργον/λόγος сохранён."
