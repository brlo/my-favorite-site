verses:
  1: "彼[かれ]はわたしを神殿[しんでん]へ連[つ]れて行[い]き、その玄関[げんかん]の間[ま]を測[はか]った。幅[はば]は六[ろく]キュビト、こちら側[がわ]も六キュビト、玄関の間の幅はあちら側にも六キュビトであった。"
  2: "玄関[げんかん]の間[ま]の幅[はば]は十[じゅう]キュビト、玄関の間の側面[そくめん]はこちら側[がわ]に五[ご]キュビト、あちら側にも五キュビトであった。彼[かれ]はその長[なが]さを四十[よんじゅう]キュビト、幅を二十[にじゅう]キュビトと測[はか]った。"
  3: "彼[かれ]は内庭[ないてい]に入[はい]り、入口[いりぐち]の玄関[げんかん]の間[ま]を二[に]キュビト、入口を六[ろく]キュビト、入口の側面[そくめん]をこちら側[がわ]に七[なな]キュビト、あちら側にも七キュビトと測[はか]った。"
  4: "彼[かれ]は入口[いりぐち]の長[なが]さを四十[よんじゅう]キュビト、幅[はば]を二十[にじゅう]キュビトと、神殿[しんでん]の正面[しょうめん]に測[はか]った。そしてわたしに言[い]った。「これは至聖所[しせいしょ]である。」"
  5: "彼[かれ]は神殿[しんでん]の壁[かべ]を六[ろく]キュビト、側房[そくぼう]の幅[はば]を周[まわ]りに四[よん]キュビトと測[はか]った。"
  6: "側房[そくぼう]は側房[そくぼう]に次[つ]いで三十三[さんじゅうさん]あり、それが二[ふた]組[ぐみ]あった。神殿[しんでん]の壁[かべ]には、側房[そくぼう]の周[まわ]りに隙間[すきま]があり、入[はい]る者[もの]がそこから見[み]ることができるようになっていた。側房が神殿の壁に全[まった]く触[ふ]れないためである。"
  7: "上[うえ]の側房[そくぼう]の幅[はば]は、神殿[しんでん]の周[まわ]りの上[うえ]の側房[そくぼう]に向[む]かって壁[かべ]からの張[は]り出[だ]しに従[したが]って広[ひろ]くなり、上[うえ]から広がるようになっていた。下[した]の側房から上[うえ]の間[ま]へ、中[なか]の側房から三階[さんがい]の間[ま]へ上[のぼ]るのである。"
  8: "わたしは神殿[しんでん]の高[たか]さを見[み]た。周[まわ]りの側房[そくぼう]の区切[くぎ]りは測[はか]り竿[ざお]に等[ひと]しく、六[ろく]キュビトの区切りであった。"
  9: "外側[そとがわ]の側房[そくぼう]の壁[かべ]の幅[はば]は五[ご]キュビト、神殿[しんでん]の側房[そくぼう]の間[あいだ]の残[のこ]りは空地[くうち]であった。"
  10: "部屋[へや]の間[あいだ]の幅[はば]は二十[にじゅう]キュビトで、神殿[しんでん]を周[まわ]りに巡[めぐ]っていた。"
  11: "部屋[へや]の戸[と]は、北[きた]に面[めん]した一[ひと]つの戸[と]の残[のこ]りの方[ほう]へ向[む]いていた。一つの戸は南[みなみ]に向かい、残りの空地[くうち]の光[ひかり]の幅[はば]は周[まわ]りに五[ご]キュビトであった。"
  12: "残[のこ]りの空地[くうち]に面[めん]した区切[くぎ]りの建物[たてもの]は、海[うみ]の方[ほう]へ七十[ななじゅう]キュビトであった。区切りの建物の壁[かべ]の幅[はば]は周[まわ]りに五[ご]キュビト、その長[なが]さは九十[きゅうじゅう]キュビトであった。"
  13: "彼[かれ]は神殿[しんでん]の前[まえ]の長[なが]さを百[ひゃく]キュビト、残[のこ]りの空地[くうち]と区切[くぎ]りの建物[たてもの]とその壁[かべ]の長[なが]さも百[ひゃく]キュビトと測[はか]った。"
  14: "神殿[しんでん]の正面[しょうめん]の幅[はば]と、それに向[む]かい合[あ]う残[のこ]りの空地[くうち]の幅[はば]は百[ひゃく]キュビトであった。"
  15: "彼[かれ]はあの神殿[しんでん]の後[うしろ]にある残[のこ]りの空地[くうち]に面[めん]した区切[くぎ]りの建物[たてもの]の長[なが]さを測[はか]った。こちら側[がわ]とあちら側[がわ]の残りの空地の長さも百[ひゃく]キュビトであった。神殿[しんでん]と隅[すみ]々と、外[そと]の玄関[げんかん]の間[ま]は板[いた]で覆[おお]われていた。"
  16: "窓[まど]は格子[こうし]造[づく]りで、三方[さんぽう]に周[まわ]りから光[ひかり]を受[う]けてのぞき込[こ]めるようになっていた。神殿[しんでん]とその近[ちか]くのものは周[まわ]りを木[き]で覆[おお]われ、床[ゆか]も、床から窓[まど]に至[いた]るまでそうであった。窓は三方[さんぽう]に開[ひら]いてのぞき込めるようになっていた。"
  17: "内[うち]のものの近[ちか]くまで、また外[そと]のものに至[いた]るまで、周[まわ]りの壁[かべ]全体[ぜんたい]に、内側[うちがわ]にも外側[そとがわ]にも刻[きざ]みが施[ほどこ]されていた。"
  18: "ケルビムと棕櫚[しゅろ]が刻[きざ]まれ、棕櫚はケルビムとケルビムの間[あいだ]にあった。ケルビムには二[ふた]つの顔[かお]があった。"
  19: "人間[にんげん]の顔[かお]はこちら側[がわ]にもあちら側[がわ]にも棕櫚[しゅろ]に向[む]かい、獅子[しし]の顔もこちら側にもあちら側にも棕櫚に向かっていた。神殿[しんでん]全体[ぜんたい]が周[まわ]りに刻[きざ]まれていた。"
  20: "床[ゆか]から天井[てんじょう]まで、ケルビムと棕櫚[しゅろ]が刻[きざ]まれていた。"
  21: "聖所[せいしょ]と神殿[しんでん]の入口[いりぐち]は四[よん]方[ほう]に開[ひら]く四角[しかく]であった。聖所[せいしょ]の正面[しょうめん]には、木[き]の祭壇[さいだん]の姿[すがた]のようなものが見[み]えた。"
  22: "木[き]の祭壇[さいだん]は高[たか]さ三[さん]キュビト、長[なが]さ二[に]キュビト、幅[はば]も二キュビトであった。それには角[つの]があり、その基[き]とその壁[かべ]は木[き]であった。そしてわたしに言[い]った。「これは主[しゅ]の御前[みまえ]にある食卓[しょくたく]である。」"
  23: "神殿[しんでん]にも聖所[せいしょ]にも、二[ふた]つの入口[いりぐち]があった。"
  24: "入口[いりぐち]は回[まわ]る二[ふた]つの扉[とびら]からなり、一方[いっぽう]の入口に二枚[にまい]、第二[だいに]の入口にも二枚[にまい]の扉[とびら]があった。"
  25: "その上[うえ]、神殿[しんでん]の入口[いりぐち]の上[うえ]に、聖所[せいしょ]の刻[きざ]みに従[したが]って、ケルビムと棕櫚[しゅろ]が刻[きざ]まれていた。外[そと]の玄関[げんかん]の間[ま]の正面[しょうめん]には、良[よ]い木[き]があった。"
  26: "隠[かく]れた窓[まど]があった。彼[かれ]はこちら側[がわ]にもあちら側[がわ]にも、玄関[げんかん]の間[ま]の天井[てんじょう]と、木[き]で組[く]み合[あ]わされた神殿[しんでん]の側房[そくぼう]を測[はか]った。"

notes:
  1: "εἰσήγαγέν με εἰς τὸν ναόν — «ввёл меня в храм»; ᾧ διεμέτρησεν τὸ αιλαμ — «у которого измерил притвор» (αιλαμ — притвор, 玄関の間, как в 8:16; слав. «аилам»); πηχῶν ἓξ τὸ πλάτος ἔνθεν — «шесть локтей ширины с этой стороны». Слав. «о сию страну… об ону» — по сторонам; πῆχυς — キュビト."
  2: "τὸ εὖρος τοῦ πυλῶνος — «ширина притвора (ворот)» (πυλών — вход, 玄関の間; слав. «врата»); ἐπωμίδες — «плечи», боковые выступы (слав. «бока», 側面); μῆκος 40, εὖρος 20 — размеры святилища. В ru «в столбах» — иное членение (МТ)."
  3: "τὴν αὐλὴν τὴν ἐσωτέραν — «внутренний двор» (内庭); τὸ αιλ τοῦ θυρώματος — «притвор входа» (αιλ — то же αιλαμ, слав. «аилам»); θύρωμα — вход, дверной проём (入口); ἐπωμίδες τοῦ θυρώματος — боковые выступы входа, по 7 локтей."
  4: "διεμέτρησεν τὸ μῆκος τῶν θυρῶν πηχῶν τεσσαράκοντα — «измерил длину входов — сорок локтей»; κατὰ πρόσωπον τοῦ ναοῦ — «пред лицом храма»; Τοῦτο τὸ ἅγιον τῶν ἁγίων — «это святое святых» (至聖所). В ru «двадцать локтей в длину» (МТ), в LXX и слав. — сорок; держим LXX/слав."
  5: "τὸν τοῖχον τοῦ οἴκου — «стену дома» (神殿の壁); τὸ εὖρος τῆς πλευρᾶς — «ширина боковой пристройки» (πλευρά — ребро, боковая комната, 側房); κυκλόθεν — «кругом»."
  6: "τὰ πλευρὰ πλευρὸν ἐπὶ πλευρόν — «боковые [комнаты] бок подле бока»; τριάκοντα καὶ τρεῖς δίς — «тридцать три дважды» (по 33 с двух сторон?); διάστημα ἐν τῷ τοίχῳ — «промежуток в стене»; ἐπιλαμβανομένοις ὁρᾶν — «чтобы входящим видеть» (слав. «на прозрак»); ὅπως μὴ ἅπτωνται — «чтобы вовсе не касались стен»."
  7: "τῆς ἀνωτέρας τῶν πλευρῶν — «верхних боковых [комнат]»; κατὰ τὸ πρόσθεμα ἐκ τοῦ τοίχου — «по прибавлению от стены» (πρόσθεμα — пристройка, выступ); διαπλατύνηται ἄνωθεν — «расширяется сверху»; ἐκ τῶν κάτωθεν ἀναβαίνωσιν ἐπὶ τὰ ὑπερῷα — «с нижних восходят в верхние [покои]» (ὑπερῷα — верхние комнаты); ἐκ τῶν μέσων ἐπὶ τὰ τριώροφα — «из средних в третьи ярусы» (τριώροφος — трёхъярусный)."
  8: "τὸ θραελ τοῦ οἴκου ὕψος — тёмное место: θραελ (возможно, искажённое евр. слово) понято как «верх, высота дома» (слав. «высота»); διάστημα τῶν πλευρῶν ἴσον τῷ καλάμῳ — «промежуток боковых [комнат], равный трости» (κάλαμος — трость, 測り竿); πήχεων ἓξ διάστημα — «промежуток в шесть локтей»."
  9: "εὖρος τοῦ τοίχου τῆς πλευρᾶς ἔξωθεν — «ширина стены боковой [комнаты] снаружи»; τὰ ἀπόλοιπα ἀνὰ μέσον τῶν πλευρῶν — «остающееся между боковыми [комнатами]» (ἀπόλοιπον — остаток, свободное место; слав. «прочая»). Синтаксис LXX переходит в ст. 10."
  10: "ἀνὰ μέσον τῶν ἐξεδρῶν — «между покоями» (ἐξέδρα — комната, 部屋; слав. «преграда»); τὸ περιφερὲς τῷ οἴκῳ κύκλῳ — «окружность (обвод) дома кругом»; 20 локтей — свободное пространство вокруг храма."
  11: "αἱ θύραι τῶν ἐξεδρῶν ἐπὶ τὸ ἀπόλοιπον — «двери покоев к остатку (свободному месту)»; τῆς θύρας τῆς μιᾶς τῆς πρὸς βορρᾶν — «одной двери, что к северу»; τὸ εὖρος τοῦ φωτὸς τοῦ ἀπολοίπου — «ширина света остатка» (φῶς — свет, просвет; слав. «свет»), 5 локтей."
  12: "τὸ διορίζον — «отделяющее [здание]» (διορίζω — разделять; 区切りの建物; слав. «раздел»); ὡς πρὸς θάλασσαν — «как к морю», т. е. к западу (θάλασσα — море, запад); πλάτος τοῦ τοίχου 5, μῆκος 90."
  13: "κατέναντι τοῦ οἴκου — «напротив дома»; τὰ ἀπόλοιπα καὶ τὰ διορίζοντα — «остатки и отделяющие [здания]»; μῆκος 100 локтей."
  14: "τὸ εὖρος κατὰ πρόσωπον τοῦ οἴκου — «ширина пред лицом дома»; τὰ ἀπόλοιπα κατέναντι — «остатки напротив»; 100 локтей. Слав. «противу ста лактей»."
  15: "μῆκος τοῦ διορίζοντος … τῶν κατόπισθεν τοῦ οἴκου ἐκείνου — «длина отделяющего [здания]… что позади того дома»; τὰ ἀπόλοιπα ἔνθεν καὶ ἔνθεν — «остатки с обеих сторон»; αἱ γωνίαι — «углы» (隅); τὸ αιλαμ τὸ ἐξώτερον — «внешний притвор» (外の玄関の間). Слав. добавляет «доски постланы» (πεφατνωμένα из ст. 16) — сохранено в конце стиха."
  16: "πεφατνωμένα — «обшитые досками, панели» (φατνόω); θυρίδες δικτυωταί — «окна решётчатые» (δικτυωτός — сетчатый); ὑποφαύσεις κύκλῳ τοῖς τρισίν — «просветы кругом в трёх [ярусах]»; διακύπτειν — «выглядывать»; ἐξυλωμένα — «обшитые деревом»; ἀναπτυσσόμεναι τρισσῶς — «открывающиеся втрое» (в трёх створах)."
  17: "ἕως πλησίον τῆς ἐσωτέρας — «до близкого к внутреннему»; ἐφ᾿ ὅλον τὸν τοῖχον κύκλῳ — «по всей стене кругом»; ἐν τῷ ἔσωθεν καὶ ἔξωθεν — «внутри и снаружи». Синтаксис переходит в ст. 18 (γεγλυμμένα)."
  18: "γεγλυμμένα χερουβιν — «вырезанные херувимы» (γλύφω — вырезать; ケルビム); φοίνικες ἀνὰ μέσον — «пальмы между» (棕櫚); δύο πρόσωπα τῷ χερουβ — «два лица у херувима» (в LXX и слав.; в МТ четыре, но ru здесь тоже «два»)."
  19: "πρόσωπον ἀνθρώπου — «лицо человеческое»; πρὸς τὸν φοίνικα ἔνθεν καὶ ἔνθεν — «к пальме с той и другой стороны»; πρόσωπον λέοντος — «лицо льва»; διαγεγλυμμένος ὅλος ὁ οἶκος — «весь дом изваян»."
  20: "ἐκ τοῦ ἐδάφους ἕως τοῦ φατνώματος — «от пола до потолка (обшивки)» (φάτνωμα — кессон, потолок; 天井); διαγεγλυμμένοι — «изваяны»."
  21: "τὸ ἅγιον καὶ ὁ ναὸς ἀναπτυσσόμενος τετράγωνα — «святое и храм, открывающиеся четырёхугольно» (ἀναπτύσσω — раскрывать; τετράγωνος — четырёхугольный); κατὰ πρόσωπον τῶν ἁγίων ὅρασις ὡς ὄψις — «пред лицом святых видение, как вид»; в LXX далее продолжается: θυσιαστηρίου ξυλίνου (ст. 22). Слав. ставит «требника древяна» в конце ст. 21."
  22: "θυσιαστήριον ξύλινον — «жертвенник деревянный» (祭壇); ὕψος 3, μῆκος 2, εὖρος 2; κέρατα — «рога» (角); βάσις — «основание»; Αὕτη ἡ τράπεζα ἡ πρὸ προσώπου κυρίου — «это трапеза пред лицом Господним» (食卓)."
  23: "δύο θυρώματα τῷ ναῷ καὶ τῷ ἁγίῳ — «двое входов у храма и у святого» (θύρωμα — вход, 入口)."
  24: "θυρώματα … στροφωτοῖς — «входы с вращающимися [створками]» (στροφωτός — вращающийся); δύο θυρώματα τῷ ἑνὶ — «два [полотна] у одного»; слав. «вереи» — створки."
  25: "γλυφὴ ἐπ᾿ αὐτῶν — «резьба на них»; κατὰ τὴν γλυφὴν τῶν ἁγίων — «по резьбе святых [мест]»; σπουδαῖα ξύλα — «хорошее (крепкое) дерево» (σπουδαῖος — годный, добротный; слав. «древеса потребна»); κατὰ πρόσωπον τοῦ αιλαμ ἔξωθεν — «пред лицом внешнего притвора»."
  26: "θυρίδες κρυπταί — «окна скрытые» (κρυπτός — тайный); εἰς τὰ ὀροφώματα τοῦ αιλαμ — «в потолки притвора» (ὀρόφωμα — кровля, потолок); τὰ πλευρὰ τοῦ οἴκου ἐζυγωμένα — «боковые [комнаты] дома, соединённые [деревом]» (ζυγόω — соединять; слав. «древами сопряжены»)."
