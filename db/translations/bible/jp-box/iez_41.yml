# jp-box, Иезекииль, глава 41. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 41 (совпадает; см. карту 20/21).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: измерения храма (видение 40–48, продолжение). 1–4 вход, притвор,
# святилище и «святое святых»; 5–11 стена, боковые комнаты (33 дважды), уступы,
# свободное место вокруг; 12–15 отделяющее здание к западу, сто локтей;
# 16–20 окна, деревянная обшивка, резьба: херувимы и пальмы, два лица;
# 21–26 четырёхугольные входы, деревянный жертвенник-«трапеза», створчатые двери,
# резьба на дверях, скрытые окна. Размеры — キュビト, числа кандзи, формулы
# («и измерил») держатся одинаково.
# Голоса: 1–3 авторское описание; 4 — слова спутника в 「…」 («это святое святых»);
# 5–21 описание; 22 — слова спутника в 「…」 («это трапеза пред Господом»);
# 23–26 описание. Речи Бога в главе нет.
# «Точка»: в этой главе нет.
# Имена и термины: 神殿[しんでん] (ναός, οἶκος), 玄関[げんかん]の間[ま] (αιλαμ/πυλών,
# притвор; решение 8:16), 至聖所[しせいしょ] (ἅγιον τῶν ἁγίων), 内庭[ないてい] (αὐλὴ ἐσωτέρα),
# 側房[そくぼう] (πλευρά), 部屋[へや] (ἐξέδρα), 祭壇[さいだん] (θυσιαστήριον),
# 食卓[しょくたく] (τράπεζα), ケルビム, 棕櫚[しゅろ] (φοίνιξ), キュビト (πῆχυς),
# 測[はか]り竿[ざお] (κάλαμος), 区切[くぎ]りの建物[たてもの] (τὸ διορίζον),
# 残[のこ]りの空地[くうち] (τὸ ἀπόλοιπον).
#
