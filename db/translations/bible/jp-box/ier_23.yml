# jp-box, Иеремия, глава 23. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc по Иеремии почти отсутствует (гл. 11, 12,
# 31), в выгрузку не входил; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 23: 1–4 обличение пастырей и возвращение стада; 5–6 праведная отрасль Давиду
# («отрасль праведную» по LXX, слав. «восток праведный»); 7–8 новое исшествие из земли
# северной; 9–14 сердце пророка сокрушено, беззакония пророков Самарии и Иерусалима;
# 15 полынь и горькая вода; 16–22 не слушайте слов пророков, совет Господень;
# 23–24 Бог близкий и дальний; 25–32 ложные сны; 33–40 «бремя Господне» (игра слов).
# Нумерация по gr: 40 стихов, совпадает со слав. и ru. «Точки» 7 и 8 закрыты по слав.:
# в модуле на их месте стоит «.», но греч. текст 7–8 приложен в выгрузке к концу 23:40
# и совпадает со слав.; стихи не добавлялись и не делились.
# Голоса: 1 「…» (слав. добавляет «рече Господь»); 2–4 「…»; 5–6 「…»; 7–8 「…»;
# 9–14 речь пророка от первого лица, без кавычек; 15 「…»; 16–17 「…»; 18–20 речь
# пророка без кавычек; 21–24 「…»; 25–32 「…» (в 25 вложенное 『…』); 33–40 「…»
# (вложенные 『…』 — вопрос народа, ответ пророку, слова пророка).
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX) по корпусу:
# ダビデ, サマリア, ソドム, ゴモラ, バアル, イスラエル, ユダ, エルサレム; ヨセデク
# (Ιωσεδεκ) передан по смыслу, как в слав.: 「主はわれらの義」.

