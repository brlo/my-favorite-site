verses:
  1: "主[しゅ]は言[い]われる。「災[わざわ]いだ、わたしの牧[まき]場[ば]の羊[ひつじ]を散[ち]らし、滅[ほろ]ぼす牧者[ぼくしゃ]たちは。」"
  2: "それゆえ、わたしの民[たみ]を飼[か]う牧者[ぼくしゃ]たちについて、主[しゅ]はこう言[い]われる。「あなたがたはわたしの羊[ひつじ]を散[ち]らし、追[お]いやって顧[かえり]みなかった。見[み]よ、わたしはあなたがたの悪[わる]い行[おこな]いのゆえに、あなたがたを罰[ばっ]する。"
  3: "わたしは、わたしの民[たみ]の残[のこ]りを、わたしが彼[かれ]らを追[お]いやったすべての地[ち]から集[あつ]め、彼らを自分[じぶん]の牧[まき]場[ば]に戻[もど]す。彼らは増[ふ]え、多[おお]くなる。"
  4: "わたしは彼[かれ]らに牧者[ぼくしゃ]たちを立[た]てて、彼らを飼[か]わせる。彼らはもはや恐[おそ]れず、おののかず、一人[ひとり]も数[かず]から失[うしな]われない、と主[しゅ]は言[い]われる。」"
  5: "主[しゅ]は言[い]われる。「見[み]よ、日[ひ]が来[く]る。わたしはダビデに正[ただ]しい若枝[わかえだ]を起[お]こす。王[おう]が王[おう]として治[おさ]め、悟[さと]りを得[え]て、地[ち]の上[うえ]で裁[さば]きと正[ただ]しさを行[おこな]う。"
  6: "彼[かれ]の日[ひ]々[び]にユダは救[すく]われ、イスラエルは望[のぞ]みのうちに住[す]む。主[しゅ]が彼[かれ]を呼[よ]ばれる名[な]は、『主[しゅ]はわれらの義[ぎ]』である。」"
  7: "それゆえ、見[み]よ、日[ひ]が来[く]る、と主[しゅ]は言[い]われる。「人[ひと]はもはや『イスラエルの家[いえ]をエジプトの地[ち]から導[みちび]き上[あ]げた主[しゅ]は生[い]きておられる』と言[い]わず、"
  8: "『イスラエルのすべての種[たね]を北[きた]の地[ち]から、また、追[お]いやられたすべての地[ち]から導[みちび]き出[だ]し、連[つ]れ帰[かえ]った主[しゅ]は生きておられる』と言[い]う。彼[かれ]らは自分[じぶん]たちの地[ち]に住[す]む。」"
  9: "預言者[よげんしゃ]たちのことで、わたしの心[こころ]は打[う]ち砕[くだ]かれ、わたしの骨[ほね]はすべて震[ふる]えた。わたしは酔[よ]った者[もの]のように、ぶどう酒[ぶどうしゅ]に打[う]ち負[ま]かされた人[ひと]のようになった。主[しゅ]の前[まえ]で、その栄光[えいこう]の美[うつく]しさの前[まえ]で。"
  10: "地[ち]は姦淫[かんいん]で満[み]ちているからである。彼[かれ]らのゆえに地[ち]は嘆[なげ]き、荒[あ]れ野[の]の牧[まき]場[ば]は乾[かわ]き果[は]てた。彼[かれ]らの歩[あゆ]みは悪[わる]くなり、彼[かれ]らの力[ちから]も、そうではない。"
  11: "祭司[さいし]も預言者[よげんしゃ]も汚[けが]れた。わたしの家[いえ]の中[なか]で、わたしは彼[かれ]らの悪[わる]いことを見[み]た、と主[しゅ]は言[い]われる。"
  12: "それゆえ、彼[かれ]らの道[みち]は暗[くら]やみの中[なか]の滑[すべ]る所[ところ]となり、彼らはその中[なか]でつまずいて倒[たお]れる。わたしが彼らの訪[おとず]れの年[とし]に、彼らの上[うえ]に災[わざわ]いを下[くだ]すからである、と主[しゅ]は言[い]われる。"
  13: "また、サマリアの預言者[よげんしゃ]たちのうちに、わたしは不法[ふほう]を見[み]た。彼[かれ]らはバアルによって預言[よげん]し、わたしの民[たみ]イスラエルを迷[まよ]わせた。"
  14: "また、エルサレムの預言者[よげんしゃ]たちのうちに、わたしは恐[おそ]るべきことを見[み]た。彼[かれ]らは姦淫[かんいん]を行[おこな]い、偽[いつわ]りの中[なか]を歩[あゆ]み、悪[わる]い者[もの]の手[て]を強[つよ]めて、だれも自分[じぶん]の悪[わる]い道[みち]から引[ひ]き返[かえ]さないようにしている。彼[かれ]らはみな、わたしにとってソドムのようになり、そこに住[す]む者[もの]たちはゴモラのようになった。"
  15: "それゆえ、主[しゅ]はこう言[い]われる。「見[み]よ、わたしは彼[かれ]らに苦[にが]よもぎを食[た]べさせ、胆汁[たんじゅう]を飲[の]ませる。エルサレムの預言者[よげんしゃ]たちから、汚[けが]れが全地[ぜんち]に広[ひろ]がったからである。」"
  16: "万軍[ばんぐん]の主[しゅ]はこう言[い]われる。「預言者[よげんしゃ]たちの言葉[ことば]を聞[き]くな。彼[かれ]らは自分[じぶん]のために空[むな]しい幻[まぼろし]を造[つく]り、自分[じぶん]の心[こころ]から語[かた]るのであって、主[しゅ]の口[くち]から語るのではない。"
  17: "彼[かれ]らは主[しゅ]の言葉[ことば]を退[しりぞ]ける者[もの]たちに『主[しゅ]は語[かた]られた。あなたがたに平和[へいわ]がある』と言[い]い、自分[じぶん]の欲[よく]するままに歩[あゆ]むすべての者[もの]に、自分[じぶん]の心[こころ]の迷[まよ]いの中[なか]を歩むすべての者に『あなたに災[わざわ]いは来[こ]ない』と言[い]う。」"
  18: "だれが主[しゅ]の議会[ぎかい]に立[た]って、その言葉[ことば]を見[み]たのか。だれが耳[みみ]を傾[かたむ]けて聞[き]いたのか。"
  19: "見[み]よ、主[しゅ]からの嵐[あらし]と怒[いか]りが、激[はげ]しい揺[ゆ]れとなって出[で]て来[く]る。それは渦[うず]を巻[ま]きながら、不敬[ふけい]な者[もの]たちの上[うえ]に来[く]る。"
  20: "主[しゅ]の怒[いか]りは、ご自分[じぶん]の心[こころ]の企[くわだ]てを成[な]し遂[と]げるまで、終[お]わることはない。終[お]わりの日[ひ]々[び]に、あなたがたはこれを悟[さと]る。"
  21: "「わたしはあの預言者[よげんしゃ]たちを遣[つか]わさなかったのに、彼[かれ]らは走[はし]った。わたしは彼らに語[かた]らなかったのに、彼らは預言[よげん]した。"
  22: "もし彼[かれ]らがわたしの議会[ぎかい]に立[た]っていたなら、わたしの言葉[ことば]をわたしの民[たみ]に聞[き]かせ、彼らをその悪[わる]い道[みち]と悪[わる]い行[おこな]いから立[た]ち返[かえ]らせていただろう。"
  23: "わたしは近[ちか]くにいる神[かみ]であり、遠[とお]くにいる神でもある、と主[しゅ]は言[い]われる。"
  24: "人[ひと]が隠[かく]れ場[ばしょ]に身[み]を隠[かく]しても、わたしに彼[かれ]が見[み]えないことがあろうか、と主[しゅ]は言[い]われる。わたしは天[てん]と地[ち]を満[み]たしてはいないか、と主[しゅ]は言[い]われる。」"
  25: "「わたしは、わたしの名[な]によって偽[いつわ]りを預言[よげん]する預言者[よげんしゃ]たちが語[かた]ることを聞[き]いた。彼[かれ]らは『夢[ゆめ]を見[み]た』と言[い]っている。"
  26: "偽[いつわ]りを預言[よげん]し、自分[じぶん]の心[こころ]の欲[よく]するままに預言する預言者[よげんしゃ]たちの心[こころ]に、いつまでこのことがあるのか。"
  27: "彼[かれ]らは、自分[じぶん]の夢[ゆめ]によってわたしの律法[りっぽう]を忘[わす]れさせようと企[くわだ]てている。彼らが互[たが]いに語[かた]り合[あ]うその夢によって。それは、彼らの父祖[ふそ]たちがバアルのゆえにわたしの名[な]を忘[わす]れたのと同[おな]じである。"
  28: "夢[ゆめ]を持[も]つ預言者[よげんしゃ]はその夢を語[かた]れ。わたしの言葉[ことば]を受[う]けた者[もの]は、わたしの言葉を真実[しんじつ]に語れ。もみ殻[がら]と小麦[こむぎ]と、何[なん]の関[かか]わりがあろうか、と主[しゅ]は言[い]われる。わたしの言葉[ことば]も、そのとおりである。"
  29: "わたしの言葉[ことば]は、燃[も]え上[あ]がる火[ひ]のようであり、岩[いわ]を打[う]ち砕[くだ]く槌[つち]のようなものではないか、と主[しゅ]は言[い]われる。"
  30: "それゆえ、見[み]よ、わたしは、わたしの言葉[ことば]をそれぞれ隣人[りんじん]から盗[ぬす]む預言者[よげんしゃ]たちに立[た]ち向[む]かう、と主[しゅ]は言[い]われる。"
  31: "見[み]よ、わたしは、自分[じぶん]の舌[した]で預言[よげん]を語[かた]り出[だ]し、自分[じぶん]のまどろみにふける預言者[よげんしゃ]たちに立[た]ち向[む]かう、と主[しゅ]は言[い]われる。"
  32: "見[み]よ、わたしは、偽[いつわ]りの夢[ゆめ]を預言[よげん]して語[かた]り、それを話[はな]して、その偽[いつわ]りと惑[まど]わしとによってわたしの民[たみ]を迷[まよ]わせる預言者[よげんしゃ]たちに立[た]ち向[む]かう、と主[しゅ]は言[い]われる。わたしは彼[かれ]らを遣[つか]わさず、彼らに命[めい]じもしなかった。彼らはこの民[たみ]に何[なに]の益[えき]ももたらさない、と主[しゅ]は言[い]われる。」"
  33: "「この民[たみ]か、祭司[さいし]か、預言者[よげんしゃ]が、『主[しゅ]の重荷[おもに]は何[なん]か』とあなたに尋[たず]ねるなら、彼[かれ]らに言[い]え。『あなたがたこそ重荷[おもに]である。わたしはあなたがたを投[な]げ捨[て]る』と、主[しゅ]は言[い]われる。"
  34: "預言者[よげんしゃ]でも、祭司[さいし]でも、民[たみ]でも、『主[しゅ]の重荷[おもに]』と言[い]う者[もの]があれば、わたしはその人[ひと]とその家[いえ]を罰[ばっ]する。"
  35: "あなたがたはそれぞれ、隣人[りんじん]にも兄弟[きょうだい]にもこう言[い]え。『主[しゅ]は何[なん]と答[こた]えられたか。主[しゅ]は何[なん]を語[かた]られたか。』"
  36: "もはや『主[しゅ]の重荷[おもに]』という言葉[ことば]を口[くち]にしてはならない。その人[ひと]にとって重荷[おもに]となるのは、自分[じぶん]の言葉[ことば]だからである。あなたがたは、生[い]ける神[かみ]、万軍[ばんぐん]の主[しゅ]、われらの神[かみ]の言葉[ことば]を曲[ま]げている。"
  37: "預言者[よげんしゃ]にはこう言[い]え。『主[しゅ]はあなたに何[なん]と答[こた]えられたか。主[しゅ]は何[なん]を語[かた]られたか。』"
  38: "それゆえ、主[しゅ]である神[かみ]はこう言[い]われる。あなたがたが『主[しゅ]の重荷[おもに]』という言葉[ことば]を語[かた]り、わたしがあなたがたに『主[しゅ]の重荷[おもに]』と言[い]ってはならないと遣[つか]わしを送[おく]ったのに、"
  39: "それゆえ、見[み]よ、わたしはあなたがたを、また、あなたがたとあなたがたの父祖[ふそ]たちに与[あた]えたこの都[みやこ]をも取[と]り上[あ]げて、わたしの前[まえ]から投[な]げ捨[て]る。"
  40: "わたしはあなたがたの上[うえ]に、決[けっ]して忘[わす]れられることのない永遠[えいえん]のそしりと永遠[えいえん]の恥[はじ]を置[お]く。」"

notes:
  1: "Ὦ οἱ ποιμένες οἱ διασκορπίζοντες καὶ ἀπολλύοντες — «о пастыри, рассеивающие и губящие» (διασκορπίζω, ἀπολλύω); τὰ πρόβατα τῆς νομῆς μου — «овцы паствы Моей» (νομή — пастбище, 牧場); Ὦ — восклицание, 災いだ. Слав. добавляет в конце «рече Господь» — в gr формулы нет; внесено как と主は言われる, поэтому стих целиком в 「…」."
  2: "ἐπὶ τοὺς ποιμαίνοντας τὸν λαόν μου — «о пасущих народ Мой»; слав. добавляет «Бог израилев» (в gr только κύριος) — внесено. Ὑμεῖς διεσκορπίσατε — «вы рассеяли»; ἐξώσατε — «изгнали» (ἐξωθέω); οὐκ ἐπεσκέψασθε — «не посетили, не попечились»; ἐκδικῶ ἐφ᾿ ὑμᾶς κατὰ τὰ πονηρὰ ἐπιτηδεύματα ὑμῶν — «взыщу с вас по злым делам вашим» (ἐκδικέω — взыскивать, мстить)."
  3: "εἰσδέξομαι τοὺς καταλοίπους τοῦ λαοῦ μου — «прииму остатки народа Моего» (εἰσδέχομαι); ἀπὸ πάσης τῆς γῆς, οὗ ἐξῶσα αὐτοὺς ἐκεῖ — «из всей земли, куда Я изгнал их»; καταστήσω αὐτοὺς εἰς τὴν νομὴν αὐτῶν — «поставлю их в паству их», т. е. на их пастбище; слав. «возвращу их к селением их» (иное понимание νομή) — отмечено, в тексте 牧場. αὐξηθήσονται καὶ πληθυνθήσονται — «возрастут и умножатся»."
  4: "ἀναστήσω αὐτοῖς ποιμένας — «поставлю им пастырей»; οἳ ποιμανοῦσιν αὐτούς — «которые упасут их»; οὐ φοβηθήσονται ἔτι οὐδὲ πτοηθήσονται — «не убоятся более и не устрашатся» (πτοέω). Слав. добавляет «и ни един погибнет от числа» — нет в gr, внесено без скобок (一人も数から失われない)."
  5: "ἀναστήσω τῷ Δαυιδ ἀνατολὴν δικαίαν — «восставлю Давиду отрасль праведную»: ἀνατολή значит и «восход, восток», и «отрасль, побег»; слав. «восток праведный», МТ/ru «Отрасль праведная». По брифу взято «отрасль» (若枝), двойной смысл отмечен здесь. βασιλεύσει βασιλεὺς καὶ συνήσει — «воцарится Царь и уразумеет» (συνίημι — понимать, быть мудрым); ποιήσει κρίμα καὶ δικαιοσύνην ἐπὶ τῆς γῆς — «сотворит суд и правду на земле»."
  6: "ἐν ταῖς ἡμέραις αὐτοῦ σωθήσεται Ιουδας — «в дни Его спасётся Иуда»; Ισραηλ κατασκηνώσει πεποιθώς — «Израиль будет обитать с уверенностью»; слав. «пребудет в надежди» — тот же смысл, в тексте 望みのうちに住む. ὃ καλέσει αὐτὸν κύριος Ιωσεδεκ — «которым назовёт Его Господь: Иоседек»: евр. имя-предложение «Господь — оправдание наше»; слав. переводит («Господь праведен наш»), в тексте «主はわれらの義». Слав. «имже нарекут его» — 3-е л. мн. ч., в gr субъект — Господь."
  7: "«Точка» в модуле (лакуна): стих переведён по слав. 23:7. Διὰ τοῦτο ἰδοὺ ἡμέραι ἔρχονται — «посему вот, приходят дни»; οὐκ ἐροῦσιν ἔτι — «не скажут более»; Ζῇ κύριος ὃς ἀνήγαγεν τὸν οἶκον Ισραηλ ἐκ γῆς Αἰγύπτου — «жив Господь, Который вывел дом Израилев из земли Египетской» (τὸν οἶκον — «дом»; слав. «сыны израилевы»). Греч. текст 7–8 в выгрузке приложен к концу 23:40 (артефакт модуля) и совпадает со слав."
  8: "«Точка» в модуле (лакуна): по слав. 23:8. ὃς συνήγαγεν ἅπαν τὸ σπέρμα Ισραηλ — «Который собрал всё семя Израиля»; ἀπὸ γῆς βορρᾶ καὶ ἀπὸ πασῶν τῶν χωρῶν — «из земли северной и из всех стран»; οὗ ἐξῶσεν αὐτοὺς ἐκεῖ — «куда изгнал их»; ἀπεκατέστησεν αὐτοὺς εἰς τὴν γῆν αὐτῶν — «возвратил их в землю их»."
  9: "Ἐν τοῖς προφήταις — «о пророках»: заголовочный оборот, в слав. «О пророцех». συνετρίβη ἡ καρδία μου — «сокрушилось сердце моё» (συντρίβω); ἐσαλεύθη πάντα τὰ ὀστᾶ μου — «поколебались все кости мои» (σαλεύω); ἐγενήθην ὡς ἀνὴρ συντετριμμένος — «стал я как муж сокрушённый»; ὡς ἄνθρωπος συνεχόμενος ἀπὸ οἴνου — «как человек, одолеваемый вином»; ἀπὸ προσώπου κυρίου καὶ ἀπὸ προσώπου εὐπρεπείας δόξης αὐτοῦ — «от лица Господа и от лица благолепия славы Его». Речь пророка от первого лица, без кавычек (ср. 22:10)."
  10: "ἀπὸ προσώπου τούτων ἐπένθησεν ἡ γῆ — «от лица их восплакала земля» (πενθέω); ἐξηράνθησαν αἱ νομαὶ τῆς ἐρήμου — «иссохли пастбища пустыни»; ὁ δρόμος αὐτῶν πονηρός — «путь их зол»; ἡ ἰσχὺς αὐτῶν οὐχ οὕτως — «сила их не такова»: тёмное место, слав. «и крепость их такожде» (т. е. тоже зла), ru «сила их — неправда»; оставлено буквально. Слав. в начале добавляет «яко прелюбодеяньми исполнена есть земля» — нет в gr (чтение МТ), внесено без скобок."
  11: "ἱερεὺς καὶ προφήτης ἐμολύνθησαν — «священник и пророк осквернились» (μολύνω); ἐν τῷ οἴκῳ μου εἶδον πονηρίας αὐτῶν — «в доме Моём увидел Я злодеяния их». Слав. добавляет «рече Господь» в конце — в gr формулы нет, внесено."
  12: "γενέσθω ἡ ὁδὸς αὐτῶν αὐτοῖς εἰς ὀλίσθημα ἐν γνόφῳ — «да будет путь их им в скользкое место во тьме» (ὀλίσθημα — скольжение, падение); ὑποσκελισθήσονται καὶ πεσοῦνται — «подскользнутся и падут» (ὑποσκελίζω); ἐν ἐνιαυτῷ ἐπισκέψεως αὐτῶν — «в год посещения их»."
  13: "ἐν τοῖς προφήταις Σαμαρείας εἶδον ἀνομήματα — «в пророках Самарии увидел Я беззакония»; ἐπροφήτευσαν διὰ τῆς Βααλ — «пророчествовали чрез Ваала» (διά с род. — «через, именем»); ἐπλάνησαν τὸν λαόν μου Ισραηλ — «ввели в заблуждение народ Мой, Израиля» (πλανάω)."
  14: "ἐν τοῖς προφήταις Ιερουσαλημ ἑώρακα φρικτά — «в пророках Иерусалима увидел Я ужасное» (φρικτά); μοιχωμένους — «прелюбодействующих»; πορευομένους ἐν ψεύδεσι — «ходящих во лжи»; ἀντιλαμβανομένους χειρῶν πονηρῶν — «поддерживающих руки злодеев» (букв. «берущих за руки»), т. е. укрепляющих; τοῦ μὴ ἀποστραφῆναι ἕκαστον ἀπὸ τῆς ὁδοῦ αὐτοῦ τῆς πονηρᾶς — «чтобы никто не обратился от пути своего злого». ἐγενήθησάν μοι πάντες ὡς Σοδομα — «стали Мне все как Содом»; οἱ κατοικοῦντες αὐτὴν ὥσπερ Γομορρα — «живущие в нём как Гоморра» (город в ж. р. в греч.: αὐτήν)."
  15: "ψωμιῶ αὐτοὺς ὀδύνην — «накормлю их болью» (ψωμίζω — кормить); ποτιῶ αὐτοὺς ὕδωρ πικρόν — «напою их горькой водой»; слав. «пелынем и желчию» — чтение МТ («полынь и желчь»), отмечено; в тексте по слав. (苦よもぎ、胆汁). ἀπὸ τῶν προφητῶν Ιερουσαλημ ἐξῆλθεν μολυσμὸς πάσῃ τῇ γῇ — «от пророков Иерусалима произошло осквернение на всю землю» (μολυσμός). Слав. «Господь сил» — в gr только κύριος."
  16: "οὕτως λέγει κύριος παντοκράτωρ — «так говорит Господь Вседержитель» (万軍の主). μὴ ἀκούετε τοὺς λόγους τῶν προφητῶν — «не слушайте слов пророков»; ματαιοῦσιν ἑαυτοῖς ὅρασιν — «делают себе тщетным видение» (ματαιόω); ἀπὸ καρδίας αὐτῶν λαλοῦσιν — «от сердца своего говорят»; οὐκ ἀπὸ στόματος κυρίου — «не от уст Господних». Слав. добавляет «иже пророчествуют вам и прельщают вас» — нет в gr, отмечено."
  17: "λέγουσιν τοῖς ἀπωθουμένοις τὸν λόγον κυρίου — «говорят отвергающим слово Господне» (ἀπωθέω — отталкивать); Εἰρήνη ἔσται ὑμῖν — «мир будет вам»; слав. добавляет внутри «глагола Господь» — внесено (主は語られた). πᾶσιν τοῖς πορευομένοις τοῖς θελήμασιν αὐτῶν — «всем ходящим по желаниям своим»; παντὶ τῷ πορευομένῳ πλάνῃ καρδίας αὐτοῦ — «всякому ходящему в заблуждении сердца своего»; Οὐχ ἥξει ἐπὶ σὲ κακά — «не придёт на тебя зло»."
  18: "τίς ἔστη ἐν ὑποστήματι κυρίου — «кто стоял в совете (основании) Господнем» (ὑπόστημα — основание, опора; в LXX передаёт евр. סוד «совет, сокровенное»); слав. «в совете Господни», 議会. καὶ εἶδεν τὸν λόγον αὐτοῦ — «и видел слово Его»; τίς ἐνωτίσατο καὶ ἤκουσεν — «кто внимал и слышал» (ἐνωτίζομαι — внимать)."
  19: "σεισμὸς παρὰ κυρίου — «сотрясение от Господа» (σεισμός); ὀργὴ ἐκπορεύεται εἰς συσσεισμόν — «гнев исходит в потрясение»; συστρεφομένη ἐπὶ τοὺς ἀσεβεῖς ἥξει — «крутясь, придёт на нечестивых» (συστρέφω — скручивать, вихрем). Слав. «буря от Господа и ярость исходит в сотрясение, устремившися приидет на нечестивыя»."
  20: "οὐκέτι ἀποστρέψει ὁ θυμὸς κυρίου — «не отвратится уже ярость Господня»; ἕως ἂν ποιήσῃ αὐτὸ καὶ… ἀναστήσῃ αὐτὸ ἀπὸ ἐγχειρήματος καρδίας αὐτοῦ — «доколе не сотворит и не утвердит его, замысел сердца Своего» (ἐγχείρημα — предприятие, замысел); ἐπ᾽ ἐσχάτου τῶν ἡμερῶν νοήσουσιν αὐτά — «в последние дни уразумеют это» (3-е л. мн. ч.; слав. «уразумеете» — 2-е л.), в тексте по слав. あなたがたは悟る."
  21: "οὐκ ἀπέστελλον τοὺς προφήτας, καὶ αὐτοὶ ἔτρεχον — «Я не посылал пророков, а они бежали»: имперфект с оттенком «не посылал (и не посылаю)»; οὐκ ἐλάλησα πρὸς αὐτούς, καὶ αὐτοὶ ἐπροφήτευον — «Я не говорил им, а они пророчествовали»."
  22: "καὶ εἰ ἔστησαν ἐν τῇ ὑποστάσει μου — «если бы они стояли в совете Моём» (нереальное условие); εἰσήκουσαν τῶν λόγων μου — «слушали слова Мои»; τὸν λαόν μου ἂν ἀπέστρεφον — «обратили бы народ Мой»; ἀπὸ τῶν πονηρῶν ἐπιτηδευμάτων αὐτῶν — «от злых дел их»."
  23: "θεὸς ἐγγίζων ἐγώ εἰμι — «Я Бог близкий» (ἐγγίζων — приближающийся); οὐχὶ θεὸς πόρρωθεν — «не Бог ли издалека» (πόρρωθεν)."
  24: "εἰ κρυβήσεται ἄνθρωπος ἐν κρυφαίοις — «скроется ли человек в тайниках» (κρυφαῖα); μὴ οὐχὶ τὸν οὐρανὸν καὶ τὴν γῆν ἐγὼ πληρῶ; — «не Я ли наполняю небо и землю?» (πληρόω). Двойное «говорит Господь» сохранено (と主は言われる дважды)."
  25: "ἤκουσα ἃ λαλοῦσιν οἱ προφῆται — «Я слышал, что говорят пророки»; ἐπὶ τῷ ὀνόματί μου ψευδῆ λέγοντες — «именем Моим говорящие ложь»; Ἠνυπνιασάμην ἐνύπνιον — «я видел сон» (букв. «сновидел сновидение»); слав. повторяет «видех сон, (видех сон)» — повтор в скобках редакционный, в тексте один раз."
  26: "ἕως πότε ἔσται ἐν καρδίᾳ τῶν προφητῶν… — «доколе будет в сердце пророков…»; τῶν προφητευόντων ψευδῆ — «пророчествующих ложь»; ἐν τῷ προφητεύειν αὐτοὺς τὰ θελήματα καρδίας αὐτῶν — «когда они пророчествуют желания сердца своего»."
  27: "τῶν λογιζομένων τοῦ ἐπιλαθέσθαι τοῦ νόμου μου — «помышляющих, чтобы забыт был закон Мой» (λογίζομαι — замышлять); ἐν τοῖς ἐνυπνίοις αὐτῶν, ἃ διηγοῦντο ἕκαστος τῷ πλησίον αὐτοῦ — «в снах своих, которые рассказывают друг другу»; καθάπερ ἐπελάθοντο οἱ πατέρες αὐτῶν τοῦ ὀνόματός μου ἐν τῇ Βααλ — «как забыли отцы их имя Моё ради Ваала»."
  28: "ὁ προφήτης, ἐν ᾧ τὸ ἐνύπνιόν ἐστιν — «пророк, у которого есть сон»; διηγησάσθω τὸ ἐνύπνιον αὐτοῦ — «пусть рассказывает сон свой» (повелительное 3-го л.); ἐν ᾧ ὁ λόγος μου πρὸς αὐτόν — «у кого слово Моё»; ἐπ᾽ ἀληθείας — «по истине». τί τὸ ἄχυρον πρὸς τὸν σῖτον; — «что мякина к пшенице?» (ἄχυρον — мякина, もみ殻); οὕτως οἱ λόγοι μου — «таковы слова Мои»."
  29: "πῦρ φλέγον — «огонь пылающий» (φλέγω); πέλυξ κόπτων πέτραν — «молот, разбивающий скалу» (πέλυξ — секира, молот; κόπτω — ударять, разбивать)."
  30: "τοὺς κλέπτοντας τοὺς λόγους μου ἕκαστος παρὰ τοῦ πλησίον αὐτοῦ — «крадущих слова Мои каждый у ближнего своего»."
  31: "τοὺς ἐκβάλλοντας προφητείας γλώσσης — «производящих пророчества языком своим» (ἐκβάλλω — выбрасывать, износить); νυστάζοντας νυσταγμὸν ἑαυτῶν — «дремлющих дреманием своим» (νυστάζω — дремать); слав. «износящыя пророчествия языком и дремлющыя дремание свое»."
  32: "τοὺς προφητεύοντας ἐνύπνια ψευδῆ — «пророчествующих сны ложные»; διηγοῦντο αὐτὰ — «рассказывают их»; ἐπλάνησαν τὸν λαόν μου ἐν τοῖς ψεύδεσιν αὐτῶν καὶ ἐν τοῖς πλάνοις αὐτῶν — «ввели народ Мой в заблуждение ложью и обольщением своим» (πλάνος — обман); οὐκ ἀπέστειλα αὐτοὺς καὶ οὐκ ἐνετειλάμην αὐτοῖς — «Я не посылал их и не заповедал им»; ὠφέλειαν οὐκ ὠφελήσουσιν — «пользы не принесут» (усиление, гебраизм); слав. добавляет «рече Господь» в конце — внесено."
  33: "λῆμμα κυρίου — «бремя Господне» (λῆμμα; евр. מַשָּׂא — и «бремя», и «пророчество, изречение»): игра слов, в тексте 重荷. Ὑμεῖς ἐστε τὸ λῆμμα — «вы — бремя»; ῥάξω ὑμᾶς — «повергну (отброшу) вас» (ῥάσσω — бросать, разбивать); слав. «вы есте бремя, и повергу вас»."
  34: "καὶ ὁ προφήτης καὶ ὁ ἱερεὺς καὶ ὁ λαός, οἳ ἂν εἴπωσιν Λῆμμα κυρίου — «пророк, священник и народ, кто скажет: бремя Господне»; ἐκδικήσω τὸν ἄνθρωπον ἐκεῖνον καὶ τὸν οἶκον αὐτοῦ — «взыщу с того человека и с дома его»."
  35: "οὕτως ἐρεῖτε ἕκαστος πρὸς τὸν πλησίον αὐτοῦ — «так говорите каждый ближнему своему»; Τί ἀπεκρίθη κύριος, καὶ Τί ἐλάλησεν κύριος; — «что ответил Господь? и что сказал Господь?»"
  36: "καὶ Λῆμμα κυρίου μὴ ὀνομάζετε ἔτι — «и „бремя Господне“ не называйте более»; τὸ λῆμμα τῷ ἀνθρώπῳ ἔσται ὁ λόγος αὐτοῦ — «бременем будет человеку слово его»; слав. добавляет «и превратисте словеса Бога живаго, Господа сил, Бога нашего» (чтение МТ) — внесено без скобок."
  37: "В gr стих фрагментарен: καὶ διὰ τί ἐλάλησεν κύριος ὁ θεὸς ἡμῶν; — «и почему говорил Господь Бог наш?». Слав. (и МТ) дают полный стих: «Сия рцы ко пророку: что отвеща тебе Господь? и что глагола Господь?» — по нему и переведено."
  38: "Ἀνθ᾿ ὧν εἴπατε τὸν λόγον τοῦτον Λῆμμα κυρίου — «за то, что вы говорите слово сие: бремя Господне»; ἀπέστειλα πρὸς ὑμᾶς λέγων Οὐκ ἐρεῖτε Λῆμμα κυρίου — «Я послал к вам, говоря: не говорите „бремя Господне“»."
  39: "ἰδοὺ ἐγὼ λαμβάνω καὶ ῥάσσω ὑμᾶς — «вот, Я беру и отбрасываю вас»: игра слов с евр. נָשָׂא («поднимать» и «прощать»); καὶ τὴν πόλιν, ἣν ἔδωκα ὑμῖν καὶ τοῖς πατράσιν ὑμῶν — «и город, который Я дал вам и отцам вашим»; слав. добавляет «от лица моего» — нет в gr, внесено (わたしの前から)."
  40: "ὀνειδισμὸν αἰώνιον καὶ ἀτιμίαν αἰώνιον — «поношение вечное и бесчестие вечное» (ὀνειδισμός, ἀτιμία); ἥτις οὐκ ἐπιλησθήσεται — «которое не забудется» (ἐπιλανθάνομαι)."
