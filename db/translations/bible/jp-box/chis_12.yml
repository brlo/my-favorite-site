# jp-box, Числа, глава 12. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в этой главе нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Фуригана — при первом появлении слова в стихе.
# Глава 12: Мириам и Аарон против Моисея из-за эфиоплянки (1–3), Господь призывает
# троих к скинии (4–5), «устами к устам» — о Моисее, пророках и видениях (6–8),
# гнев Господа и проказа Мириам (9–10), ходатайство Аарона и Моисея (11–13),
# семидневное изгнание вне стана (14–15).
# Кавычки: речь Бога — 「…」 (4, 6–8, 14); речь Мириам и Аарона — 「…」 (2);
# речь Аарона — 「…」 (11–12); речь Моисея — 「…」 (13). Красного нет.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (проверено по базе).
# Сносок ⟨…⟩ нет: 重い皮膚病 уже пояснено в корпусе (Лев 13), остальное понятно.
# Нумерация — славяно-синодальная: 15 стихов, как в csl и ru. В gr-lxx-byz 16:
# gr 12:16 (выступление из Асирофа и стан в Фаране) — это слав. 13:1, поэтому
# стих перенесён в начало 13-й главы (см. chis_13.yml, note 1). Деление 12:4/5
# иное: слав. переносит «и вышли трое в скинию свидения» из конца ст. 4 в начало
# ст. 5; в LXX это конец ст. 4 (в notes).
# LXX/масоретские отличия: 12:1 Αἰθιόπισσα — эфиоплянка; 12:3 πραΰς — кроткий;
# 12:8 «славу Господню видел»; 12:12 ἔκτρωμα — выкидыш; 12:14 — сравнение
# с оплеванием отцом. Всё в notes.
# jp-ni не использовался.

