chapter: 12
draft: true

verses:
  1: "ミリアムとアロンは、モーセが娶[めと]ったエチオピア人[じん]の女[おんな]のことでモーセを非難[ひなん]した。モーセがエチオピア人の女を娶ったからである。"
  2: "二人[ふたり]は言[い]った。「主[しゅ]はモーセだけに語[かた]られたのだろうか。わたしたちにも語られたではないか。」主はこれを聞[き]かれた。"
  3: "モーセという人[ひと]は、地[ち]の上[うえ]にいるすべての人のうちで、非常[ひじょう]に柔和[にゅうわ]な人であった。"
  4: "主[しゅ]はただちにモーセとミリアムとアロンに言[い]われた。「あなたがた三人[さんにん]は証[あかし]の幕屋[まくや]へ出[で]て来[き]なさい。」三人は証の幕屋へ出て来た。"
  5: "主[しゅ]は雲[くも]の柱[はしら]のうちに降[お]りて、幕屋[まくや]の入口[いりぐち]に立[た]たれた。そしてアロンとミリアムが呼[よ]ばれ、二人[ふたり]とも出[で]て来[き]た。"
  6: "主[しゅ]は言[い]われた。「わたしの言葉[ことば]を聞[き]きなさい。あなたがたのうちに主の預言[よげん]者[しゃ]が出るなら、わたしは幻[まぼろし]のうちでその人[ひと]に自分[じぶん]を示[しめ]し、夢[ゆめ]のうちでその人に語[かた]る。"
  7: "わたしの僕[しもべ]モーセはそうではない。彼[かれ]はわたしの家[いえ]のすべてにおいて忠実[ちゅうじつ]である。"
  8: "わたしは彼[かれ]と口[くち]を合[あ]わせて語り、なぞによらず、明[あき]らかに示[しめ]す。彼は主[しゅ]の栄光[えいこう]を見[み]ている。それなのに、あなたがたはなぜ、わたしの僕[しもべ]モーセを非難[ひなん]することを恐[おそ]れなかったのか。」"
  9: "主[しゅ]の怒[いか]りが彼[かれ]らに向[む]かって燃[も]え上[あ]がり、主は去[さ]って行[い]かれた。"
  10: "雲[くも]が幕屋[まくや]から離[はな]れると、見[み]よ、ミリアムは雪[ゆき]のように白[しろ]い重[おも]い皮膚病[ひふびょう]にかかっていた。アロンがミリアムを見ると、見よ、彼女[かのじょ]は重い皮膚病にかかっていた。"
  11: "アロンはモーセに言[い]った。「わが主[しゅ]よ、お願[ねが]いします。わたしたちは無知[むち]のうちに罪[つみ]を犯[おか]しました。どうか、その罪をわたしたちに負[お]わせないでください。"
  12: "この女[おんな]が死[し]んだ者[もの]と同[おな]じようになりませんように。母[はは]の胎[たい]から出[で]て、その肉[にく]の半[はん]分[ぶん]を食[た]べ尽[つ]くす流産[りゅうざん]児[じ]のようになりませんように。」"
  13: "モーセは主[しゅ]に向[む]かって叫[さけ]んで言[い]った。「神[かみ]よ、お願いです。この女[おんな]を癒[いや]してください。」"
  14: "主[しゅ]はモーセに言[い]われた。「もし彼女[かのじょ]の父[ちち]がその顔[かお]に唾[つば]を吐[は]いたなら、彼女は七日[なぬか]の間[あいだ]恥[は]じるではないか。七日の間、宿営[しゅくえい]の外[そと]に隔離[かくり]しなさい。そうすれば、その後[あと]で戻[もど]って来[こ]られる。」"
  15: "ミリアムは七日[なぬか]の間[あいだ]、宿営[しゅくえい]の外[そと]に隔離[かくり]された。民[たみ]は、ミリアムが清[きよ]められるまで旅[たび]立[だ]たなかった。"

notes:
  1: "ἐλάλησεν … κατὰ Μωυσῆ — говорили против Моисея (λαλέω κατά + род. — «говорить против»; при подлежащем из двух имён глагол в единственном числе). ἕνεκεν τῆς γυναικὸς τῆς Αἰθιοπίσσης — из-за жены эфиоплянки (Αἰθιόπισσα — «эфиоплянка»). ἣν ἔλαβεν — которую взял (λαμβάνω — «брать в жёны»). Повтор «что взял жену эфиоплянку» — особенность LXX, сохранён."
  2: "Μὴ Μωυσῇ μόνῳ λελάληκεν κύριος — разве Моисею одному говорил Господь (μή перед вопросом). οὐχὶ καὶ ἡμῖν ἐλάλησεν — не и нам ли говорил. καὶ ἤκουσεν κύριος — и услышал Господь."
  3: "πραὺς σφόδρα — кроткий весьма (πραΰς — «кроткий, тихий»). παρὰ πάντας τοὺς ἀνθρώπους τοὺς ὄντας ἐπὶ τῆς γῆς — более всех людей, живущих на земле (παρά + винительный — сравнение)."
  4: "παραχρῆμα — тотчас (наречие). Ἐξέλθατε ὑμεῖς οἱ τρεῖς — выйдите вы трое. εἰς τὴν σκηνὴν τοῦ μαρτυρίου — в скинию свидетельства. καὶ ἐξῆλθον οἱ τρεῖς — и вышли трое: у LXX это конец ст. 4, а слав. переносит эту фразу в начало ст. 5."
  5: "κατέβη κύριος ἐν στύλῳ νεφέλης — сошёл Господь в столпе облачном (στῦλος — «столп»). ἔστη ἐπὶ τῆς θύρας — стал у двери. ἐκλήθησαν Ααρων καὶ Μαριαμ — были позваны Аарон и Мариам (καλέω в страд.). ἐξήλθοσαν ἀμφότεροι — вышли оба."
  6: "Ἀκούσατε τῶν λόγων μου — послушайте слов Моих (ἀκούω + род.). ἐὰν γένηται προφήτης ὑμῶν κυρίῳ — если будет у вас пророк Господень (κυρίῳ — датив принадлежности). ἐν ὁράματι αὐτῷ γνωσθήσομαι — в видении ему откроюсь (ὅραμα — «видение»; γινώσκομαι в страд. — «быть узнанным»). ἐν ὕπνῳ λαλήσω αὐτῷ — во сне буду говорить ему."
  7: "οὐχ οὕτως ὁ θεράπων μου Μωϋσῆς — не так раб Мой Моисей (θεράπων — «слуга»). ἐν ὅλῳ τῷ οἴκῳ μου πιστός ἐστιν — во всём доме Моём верен (πιστός — «верный»)."
  8: "στόμα κατὰ στόμα λαλήσω αὐτῷ — устами к устам буду говорить ему (букв. «рот против рта»). ἐν εἴδει καὶ οὐ δι᾽ αἰνιγμάτων — явно, а не через загадки (εἶδος — «вид, явление»; αἴνιγμα — «загадка»; слав. «яве, и не гаданием»). τὴν δόξαν κυρίου εἶδεν — славу Господню видел. καταλαλῆσαι κατὰ τοῦ θεράποντός μου — злословить раба Моего (καταλαλέω — «говорить против, злословить»)."
  9: "ὀργὴ θυμοῦ κυρίου ἐπ᾿ αὐτοῖς — гнев ярости Господней на них (удвоение θυμός/ὀργή). ἀπῆλθεν — отошёл."
  10: "ἡ νεφέλη ἀπέστη ἀπὸ τῆς σκηνῆς — облако отступило от скинии (ἀφίστημι). ἰδοὺ Μαριαμ λεπρῶσα ὡσεὶ χιών — вот Мариам прокажённая, как снег (λεπράω — «покрываться проказой»). ἐπέβλεψεν Ααρων ἐπὶ Μαριαμ — взглянул Аарон на Мариам (ἐπιβλέπω). λεπρῶσα — прокажённая (повтор, как в LXX)."
  11: "Δέομαι, κύριε — прошу, господин (δέομαι — «умолять»; κύριε здесь обращение к Моисею, а не к Богу). μὴ συνεπιθῇ ἡμῖν ἁμαρτίαν — не возложи на нас греха (συνεπιτίθημι — «возлагать вместе»). διότι ἠγνοήσαμεν καθότι ἡμάρτομεν — потому что мы не ведали, как согрешили (ἀγνοέω — «не знать»; καθότι — «сообразно тому, что»)."
  12: "μὴ γένηται ὡσεὶ ἴσον θανάτῳ — да не будет как равное смерти (ἴσος — «равный»; оборот LXX, слав. «яко мертва»). ὡσεὶ ἔκτρωμα — как выкидыш (ἔκτρωμα — «недоношенный плод»). ἐκπορευόμενον ἐκ μήτρας μητρός — выходящий из чрева матери (μήτρα — «матка»). κατεσθίει τὸ ἥμισυ τῶν σαρκῶν αὐτῆς — съедает половину плоти её."
  13: "ἐβόησεν Μωϋσῆς πρὸς κύριον — возопил Моисей к Господу (βοάω). Ὁ θεός — о Боже (звательный). δέομαί σου — прошу Тебя. ἴασαι αὐτήν — исцели её (ἰάομαι, императив)."
  14: "εἰ ὁ πατὴρ αὐτῆς πτύων ἐνέπτυσεν εἰς τὸ πρόσωπον αὐτῆς — если бы отец её, плюя, плюнул ей в лицо (πτύω — «плевать»; усиление причастием). οὐκ ἐντραπήσεται ἑπτὰ ἡμέρας — не устыдится ли семь дней (ἐντρέπομαι — «стыдиться»). ἀφορισθήτω — да будет отделена (ἀφορίζω — «отделять, отлучать»). ἔξω τῆς παρεμβολῆς — вне стана. εἰσελεύσεται — войдёт (вернётся)."
  15: "ἀφωρίσθη Μαριαμ — была отделена Мариам. ὁ λαὸς οὐκ ἐξῆρεν — народ не выступал (ἐξαίρω). ἕως ἐκαθαρίσθη — пока не очистилась (καθαρίζω в страд.)."
