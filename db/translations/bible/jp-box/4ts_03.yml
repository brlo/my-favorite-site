verses:
  1: "アハブの子[こ]ヨラムは、ユダの王[おう]ヨシャファトの第十八年[だいじゅうはちねん]に、サマリアでイスラエルの王[おう]となり、十二年[じゅうにねん]治[おさ]めた。"
  2: "彼は主[しゅ]の目[め]に悪[わる]いことを行[おこな]ったが、父[ちち]のようでも、母[はは]のようでもなかった。彼は、父[ちち]が造[つく]ったバアルの石柱[せきちゅう]を取[と]り除[のぞ]いた。"
  3: "ただ、イスラエルに罪[つみ]を犯[おか]させたネバトの子[こ]ヤロブアムの罪[つみ]には、彼は固[かた]く結[むす]びついて離[はな]れなかった。"
  4: "モアブの王[おう]メシャは羊飼[ひつじか]いであった。彼はイスラエルの王[おう]に、十万[じゅうまん]の子羊[こひつじ]と、毛[け]のついた十万[じゅうまん]の雄羊[おひつじ]を納[おさ]めていた。"
  5: "アハブが死[し]ぬと、モアブの王[おう]はイスラエルの王[おう]から離反[りはん]した。"
  6: "その日[ひ]、ヨラム王[おう]はサマリアを出[で]て、イスラエルを数[かぞ]え上[あ]げた。"
  7: "そして行[い]って、ユダの王[おう]ヨシャファトに使者[ししゃ]を送[おく]り、言[い]った。「モアブの王[おう]はわたしから離反[りはん]した。わたしと一緒[いっしょ]にモアブへ戦[たたか]いに出[で]てくれるか。」ヨシャファトは言[い]った。「わたしは上[のぼ]って行[い]こう。わたしはあなたと同[おな]じだ。わたしの民[たみ]はあなたの民[たみ]と同[おな]じ、わたしの馬[うま]はあなたの馬[うま]と同[おな]じだ。」"
  8: "そこで彼は言[い]った。「どの道[みち]から上[のぼ]ろうか。」すると、こう言[い]った。「エドムの荒野[こうや]の道[みち]からだ。」"
  9: "イスラエルの王[おう]、ユダの王[おう]、エドムの王[おう]は出[で]て行[い]き、七日[なのか]の道[みち]を回[まわ]り道[みち]して進[すす]んだ。しかし、陣営[じんえい]にも、彼らに従[したが]う家畜[かちく]にも、水[みず]がなかった。"
  10: "イスラエルの王[おう]は家来[けらい]たちに言[い]った。「ああ、主[しゅ]が道[みち]を行[い]くこの三人[さんにん]の王[おう]たちを呼[よ]び集[あつ]めて、モアブの手[て]に渡[わた]そうとしておられるとは。」"
  11: "ヨシャファトは言[い]った。「ここには、彼を通[とお]して主[しゅ]に問[と]うことのできる主[しゅ]の預言者[よげんしゃ]がいないのか。」イスラエルの王[おう]のしもべの一人[ひとり]が答[こた]えて言[い]った。「ここに、エリヤの手[て]に水[みず]を注[そそ]いだシャファトの子[こ]エリシャがいる。」"
  12: "ヨシャファトは言[い]った。「彼には主[しゅ]の言葉[ことば]がある。」そこで、イスラエルの王[おう]、ユダの王[おう]ヨシャファト、エドムの王[おう]は彼のもとへ下[くだ]った。"
  13: "エリシャはイスラエルの王[おう]に言[い]った。「わたしとあなたに何[なん]の関[かか]わりがあるのか。あなたの父[ちち]の預言者[よげんしゃ]たち、あなたの母[はは]の預言者[よげんしゃ]たちのところへ行[い]け。」イスラエルの王[おう]は彼に言[い]った。「いいや。主[しゅ]がこの三人[さんにん]の王[おう]たちを呼[よ]び集[あつ]め、モアブの手[て]に渡[わた]そうとしておられるのだ。」"
  14: "エリシャは言[い]った。「わたしがその前[まえ]に立[た]つ万軍[ばんぐん]の主[しゅ]は生[い]きておられる。もしわたしがユダの王[おう]ヨシャファトの顔[かお]を尊[とうと]ばなかったなら、あなたを見[み]ることも、あなたに目[め]を留[と]めることもなかったであろう。」"
  15: "「しかし今[いま]、わたしに琴弾[ことび]きを連[つ]れて来[き]なさい。」琴弾[ことび]きが弾[ひ]いていると、主[しゅ]の手[て]が彼の上[うえ]にあった。"
  16: "そして言[い]った。「主[しゅ]はこう言[い]われる。『この谷川[たにがわ]に、溝[みぞ]また溝[みぞ]と掘[ほ]りなさい。"
  17: "主[しゅ]はこう言[い]われる。あなたがたは風[かぜ]を見[み]ず、雨[あめ]をも見[み]ない。しかし、この谷川[たにがわ]は水[みず]で満[み]ち、あなたがたも、あなたがたの財産[ざいさん]も、あなたがたの家畜[かちく]も飲[の]む。"
  18: "そして、これは主[しゅ]の目[め]には軽[かろ]いことだ。わたしはモアブをあなたがたの手[て]に渡[わた]す。"
  19: "あなたがたはすべての堅固[けんご]な町[まち]を打[う]ち、すべての良[よ]い木[き]を切[き]り倒[たお]し、すべての水[みず]の源[みなもと]をふさぎ、すべての良[よ]い土地[とち]を石[いし]で台無[だいな]しにする。』」"
  20: "朝[あさ]、犠牲[ぎせい]が捧[ささ]げられるころ、見[み]よ、エドムの道[みち]から水[みず]が流[なが]れて来[き]て、地[ち]は水[みず]で満[み]ちた。"
  21: "モアブの人々[ひとびと]は皆[みな]、王[おう]たちが自分[じぶん]たちと戦[たたか]うために上[のぼ]って来[き]たと聞[き]いて、帯[おび]を締[し]めた者[もの]も、それより年上[としうえ]の者[もの]も、すべて呼[よ]び集[あつ]められ、国境[こっきょう]に立[た]った。"
  22: "彼らは朝早[あさはや]く起[お]き上[あ]がった。日[ひ]が水[みず]の上[うえ]に昇[のぼ]ると、モアブの人々[ひとびと]は向[む]こうの水[みず]が血[ち]のように赤[あか]いのを見[み]た。"
  23: "彼らは言[い]った。「これは剣[つるぎ]の血[ち]だ。王[おう]たちが戦[たたか]い合[あ]い、互[たが]いに殺[ころ]し合[あ]ったのだ。さあ、モアブよ、獲物[えもの]を取[と]りに行[い]こう。」"
  24: "モアブの人々[ひとびと]がイスラエルの陣営[じんえい]に入[はい]って来[き]たとき、イスラエルは立[た]ち上[あ]がってモアブを打[う]った。モアブは彼らの前[まえ]から逃[に]げた。イスラエルはそこへ入[はい]って行[い]き、モアブを打[う]ち続[つづ]けた。"
  25: "彼らは町々[まちまち]を倒[たお]し、良[よ]い土地[とち]には一人[ひとり]ごとに石[いし]を投[な]げてそれを埋[う]め尽[く]し、すべての水[みず]の源[みなもと]をふさぎ、すべての良[よ]い木[き]を切[き]り倒[たお]した。ついに、石垣[いしがき]の石[いし]だけが崩[くず]れたまま残[のこ]った。そして、石投[いしな]げの者[もの]たちがそれを囲[かこ]んで打[う]った。"
  26: "モアブの王[おう]は、戦[たたか]いが自分[じぶん]に不利[ふり]になったのを見[み]て、剣[つるぎ]を抜[ぬ]く七百人[ななひゃくにん]を連[つ]れて、エドムの王[おう]のところへ斬[き]り込[こ]もうとしたが、できなかった。"
  27: "そこで彼は、自分[じぶん]の後[あと]を継[つ]いで王[おう]となるべき長子[ちょうし]を取[と]って、城壁[じょうへき]の上[うえ]で燔祭[はんさい]として捧[ささ]げた。すると、イスラエルに大[おお]きな憤[いきどお]りが起[お]こり、彼らは彼から離[はな]れて、自分[じぶん]の地[ち]へ帰[かえ]った。"

notes:
  1: "ἐβασίλευσεν ἐν Ισραηλ ἐν ἔτει ὀκτωκαιδεκάτῳ Ιωσαφατ βασιλεῖ Ιουδα — «воцарился над Израилем в восемнадцатый год Иосафата, царя Иудейского» (датив). ἔτη δώδεκα — «двенадцать лет». В гр нет «в Самарии»; слав. добавляет «в самарии» — внесено. Та же формула стоит в LXX 1:18a (в слав. 1-й главе её нет — см. notes к 4Цар 1:18)."
  2: "ἐποίησεν τὸ πονηρὸν ἐν ὀφθαλμοῖς κυρίου — «делал злое в очах Господних». πλὴν οὐχ ὡς ὁ πατὴρ αὐτοῦ — «но не как отец его»; ср. LXX 1:19 («не как братья его»; в слав. 1-й главе этого стиха нет). μετέστησεν τὰς στήλας τοῦ Βααλ — «снял, убрал столпы Ваала» (μεθίστημι; στήλη — 石柱); слав. «разруши капища ваалова» — иное понимание (по МТ «столбы»). ἃς ἐποίησεν ὁ πατὴρ αὐτοῦ — «которые сделал отец его»."
  3: "ἐν τῇ ἁμαρτίᾳ Ιεροβοαμ υἱοῦ Ναβατ — «в грехе Иеровоама, сына Навата». ὃς ἐξήμαρτεν τὸν Ισραηλ — «который ввёл в грех Израиля» (каузативное ἐξαμαρτάνω). ἐκολλήθη — «прилепился» (κολλάω). οὐκ ἀπέστη ἀπ᾿ αὐτῆς — «не отступил от неё» (ἁμαρτία — ж. р.); слав. «прилепися и не отступи от него»."
  4: "Μωσα — Меса (メシャ; в слав. «моса»). ἦν νωκηδ — «был нокед»: непереведённое евр. נֹקֵד «скотовод, овцевод» (слав. «нокид»); передано 羊飼い. ἐπέστρεφεν — «возвращал, отдавал» (ἐπιστρέφω в значении уплаты); слав. «даяше дань». ἐν τῇ ἐπαναστάσει — «в восстании, при возмущении»: неясное место, в слав. и ru не передано. ἀρνῶν — агнцев, κριῶν — баранов; ἐπὶ πόκων — «с рунами», т. е. неостриженных (слав. «с рунами»)."
  5: "ἠθέτησεν βασιλεὺς Μωαβ ἐν βασιλεῖ Ισραηλ — «отложился царь Моава от царя Израиля» (ἐν в смысле «против»); ср. 1:1. Причина — смерть Ахава."
  6: "ἐξῆλθεν … ἐκ Σαμαρείας — «вышел из Самарии». ἐπεσκέψατο τὸν Ισραηλ — «посетил, пересчитал Израиля» (ἐπισκέπτομαι), т. е. произвёл смотр войска (слав. «согляда»). ἐν τῇ ἡμέρᾳ ἐκείνῃ — «в тот день» (слав. «во дни оны»)."
  7: "ἐξαπέστειλεν πρὸς Ιωσαφατ — «послал к Иосафату» (ἐξαποστέλλω). ἠθέτησεν ἐν ἐμοί — «отложился от меня» (слав. «отвержеся мене»). εἰ πορεύσῃ μετ᾿ ἐμοῦ εἰς πόλεμον — «пойдёшь ли со мной на войну». Ἀναβήσομαι — «взойду» (будущее). ὅμοιός μοι ὅμοιός σοι — «подобен мне, подобен тебе» (слав. «сице мне, якоже и тебе»). ὡς οἱ ἵπποι μου οἱ ἵπποι σου — «как кони мои — кони твои» (ср. 3Цар 22:4)."
  8: "Ποίᾳ ὁδῷ ἀναβῶ — «каким путём взойти». Ὁδὸν ἔρημον Εδωμ — «дорогою пустыни Едом» (винительный в роли ответа). Подлежащие в гр не названы: спрашивает Иосафат, отвечает Иорам (так и в слав.)."
  9: "ἐκύκλωσαν ὁδὸν ἑπτὰ ἡμερῶν — «обошли кругом путь семи дней», т. е. шли обходным путём. οὐκ ἦν ὕδωρ τῇ παρεμβολῇ — «не было воды стану». τοῖς κτήνεσιν τοῖς ἐν τοῖς ποσὶν αὐτῶν — «скоту, [шедшему] в ногах их» (слав. «скотом сущым с ними»)."
  10: "Ὦ ὅτι — «о, что…» (слав. «о, яко»). κέκληκεν — перфект «созвал». τοὺς τρεῖς βασιλεῖς παρερχομένους — «трёх царей проходящих» (παρέρχομαι); передано 道を行く. δοῦναι αὐτοὺς ἐν χειρὶ Μωαβ — «предать их в руку Моава». Слав. добавляет «отроком своим» («слугам своим») — внесено (家来たちに)."
  11: "Οὐκ ἔστιν ὧδε προφήτης τοῦ κυρίου — «нет ли здесь пророка Господня». ἐπιζητήσωμεν τὸν κύριον παρ᾿ αὐτοῦ — «вопросим Господа через него». Слав. добавляет «к нему царь иудин» (обращение) — не внесено. ὃς ἐπέχεεν ὕδωρ ἐπὶ χεῖρας Ηλιου — «который возливал воду на руки Илии», т. е. прислуживал ему (ἐπιχέω)."
  12: "Ἔστιν αὐτῷ ῥῆμα κυρίου — «есть у него слово Господне». κατέβη πρὸς αὐτόν — «сошёл к нему» (к пророку идут вниз). В гр перечисление: царь Израиля, Иосафат царь Иуды, царь Едома; в японском порядке царь Иуды назван первым по имени."
  13: "Τί ἐμοὶ καὶ σοί — «что мне и тебе» (формула отстранения). δεῦρο πρὸς τοὺς προφήτας τοῦ πατρός σου — «пойди к пророкам отца твоего»; слав. добавляет «и ко пророком матере твоея» — внесено. Μή — «нет, не так» (евр. אַל־כֵּן), возражение пророку; слав. понял как вопрос «еда созва…?» («разве созвал…?»), в тексте принято «нет». κέκληκεν … τοῦ παραδοῦναι — «созвал… чтобы предать»."
  14: "Ζῇ κύριος τῶν δυνάμεων — «жив Господь сил» (万軍の主). ᾧ παρέστην ἐνώπιον αὐτοῦ — «которому я предстою пред ним» (παρίστημι, перфект). εἰ μὴ πρόσωπον Ιωσαφατ … λαμβάνω — «если бы я не принимал лица Иосафата», т. е. не оказывал почтения (λαμβάνω πρόσωπον; слав. «аще бых не лице… приял»). εἰ ἐπέβλεψα … καὶ εἶδόν σε — «взглянул ли бы… и увидел ли бы» (аподосис без ἄν)."
  15: "νυνὶ δέ — «ныне же». λαβέ μοι ψάλλοντα — «приведи мне играющего» (ψάλλω — играть на струнном), 琴弾き; слав. «певца». ὡς ἔψαλλεν ὁ ψάλλων — «когда играл играющий». ἐγένετο ἐπ᾿ αὐτὸν χεὶρ κυρίου — «была на нём рука Господня» (формула пророческого наития)."
  16: "Ποιήσατε τὸν χειμάρρουν τοῦτον βοθύνους βοθύνους — «сделайте этот поток рвами, рвами» (χειμάρρους — поток, сухое русло, 谷川; βοθύνος — ров, яма); удвоение передаёт множество: 溝また溝. Слав. «рвами рвами». С этого стиха открыта речь, закрываемая в ст. 19."
  17: "Οὐκ ὄψεσθε πνεῦμα καὶ οὐκ ὄψεσθε ὑετόν — «не увидите ветра и не увидите дождя» (πνεῦμα здесь «ветер»; слав. «духа» — двусмысленно). πλησθήσεται ὕδατος — «наполнится воды». αἱ κτήσεις ὑμῶν — «имущество ваше» (слав. «стяжания»); τὰ κτήνη — «скот». Повтор «так говорит Господь» (τάδε λέγει κύριος) сохранён."
  18: "κούφη αὕτη ἐν ὀφθαλμοῖς κυρίου — «легко это в очах Господа» (слав. «легко сие»). παραδώσω τὴν Μωαβ ἐν χειρὶ ὑμῶν — «предам Моава в руку вашу» (в гр ед. ч. χειρί при мн. ч. ὑμῶν)."
  19: "πατάξετε πᾶσαν πόλιν ὀχυράν — «поразите всякий город укреплённый». πᾶν ξύλον ἀγαθὸν καταβαλεῖτε — «всякое дерево доброе срубите». πάσας πηγὰς ὕδατος ἐμφράξετε — «все источники вод заградите» (ἐμφράσσω). πᾶσαν μερίδα ἀγαθὴν ἀχρειώσετε ἐν λίθοις — «всякий участок добрый сделаете негодным камнями» (ἀχρειόω), т. е. забросаете камнями; слав. «разбиете камением». Здесь же закрыта речь."
  20: "τὸ πρωΐ — «утром». ἀναβαινούσης τῆς θυσίας — «при восхождении жертвы» (утренняя жертва; слав. «восходящей жертве»). ἐξ ὁδοῦ Εδωμ — «от пути Едома». ἐπλήσθη ἡ γῆ ὕδατος — «наполнилась земля воды»."
  21: "πᾶσα Μωαβ ἤκουσαν — «весь Моав услышали» (собирательное подлежащее с глаголом мн. ч.). ἀνεβόησαν — «возопили» (ἀναβοάω); здесь клич сбора, поэтому 呼び集められ (слав. «возопиша... и реша: ох», ru «собраны были» — по МТ). ἐκ παντὸς περιεζωσμένου ζώνην καὶ ἐπάνω — «от всякого, опоясанного поясом, и выше», т. е. все способные носить оружие и старше; передано описательно. ἐπὶ τοῦ ὁρίου — «на границе» (слав. «у предела»)."
  22: "ὤρθρισαν τὸ πρωί — «встали рано утром» (ὀρθρίζω). ἀνέτειλεν ἐπὶ τὰ ὕδατα — «взошло над водами». πυρρά — «рыжие, красные» (слав. «чермны»). ὡσεὶ αἷμα — «как кровь»."
  23: "Αἷμα τοῦτο τῆς ῥομφαίας — «это кровь меча» (ῥομφαία; слав. «оружие»). ἐμαχέσαντο — «сразились» (μάχομαι). ἐπάταξαν ἀνὴρ τὸν πλησίον αὐτοῦ — «поразили каждый ближнего своего». ἐπὶ τὰ σκῦλα — «на добычу» (σκῦλον; слав. «корысти», с редакторским «(гряди)» в скобках — не переведено); «Моав» в обращении — собирательно."
  24: "εἰσῆλθον εἰς τὴν παρεμβολὴν Ισραηλ — «вошли в стан Израиля» (подлежащее — моавитяне из ст. 23). ἀνέστησαν — «встали». ἔφυγον ἀπὸ προσώπου αὐτῶν — «побежали от лица их». εἰσπορευόμενοι καὶ τύπτοντες — деепричастия «входя и поражая» (слав. «входяще и биюще»); передано «вошли и продолжали бить»."
  25: "καθεῖλον — «низвергли» (καθαιρέω). ἀνὴρ τὸν λίθον — «каждый по камню». ἐνέπλησαν αὐτήν — «наполнили её». ἕως τοῦ καταλιπεῖν τοὺς λίθους τοῦ τοίχου καθῃρημένους — «доколе не оставили камни стены разрушенными». σφενδονῆται — «пращники» (石投げの者). ru добавляет «Кир-Харешете» (по МТ) — в гр нет, не внесено."
  26: "ἐκραταίωσεν ὑπὲρ αὐτὸν ὁ πόλεμος — «усилилась над ним война», т. е. стала сильнее его. ἑπτακοσίους ἄνδρας ἐσπασμένους ῥομφαίαν — «семьсот мужей, обнаживших меч» (σπάω). διακόψαι πρὸς βασιλέα Εδωμ — «прорубиться к царю Едома» (διακόπτω). οὐκ ἠδυνήθησαν — «не смогли»."
  27: "τὸν υἱὸν αὐτοῦ τὸν πρωτότοκον — «сына своего первенца» (πρωτότοκος). ὃς ἐβασίλευσεν ἀντ αὐτοῦ — «который царствовал вместо него» (слав. «егоже воцари вместо себе»; по смыслу — которому надлежало царствовать). ἀνήνεγκεν αὐτὸν ὁλοκαύτωμα ἐπὶ τοῦ τείχους — «вознёс его во всесожжение на стене». μετάμελος μέγας ἐπὶ Ισραηλ — «великое раскаяние (сожаление) на Израиля» (слав. «раскаяние великое»; ru «негодование»). ἀπῆραν ἀπ᾿ αὐτοῦ — «отступили, ушли от него» (ἀπαίρω). ἐπέστρεψαν εἰς τὴν γῆν — «возвратились в землю [свою]»."
