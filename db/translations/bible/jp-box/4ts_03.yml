# jp-box, 4-я Царств, глава 3. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc для книги нет;
# jp-ni не использовался.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 3: воцарение Иорама и его нечестие (1–3), Меса и отложение Моава (4–5),
# смотр войска и союз с Иосафатом (6–8), поход трёх царей и безводье (9–10),
# вопрошение Господа и Елисей (11–15), пророчество о воде в долине (16–19),
# вода от Едома (20), поражение Моава (21–25), первенец на стене (26–27).
# Нумерация совпадает с csl/ru (3:1–27).
# Паритет: слав. чтения внесены в текст без скобок — 1 («в Самарии»),
# 10 («отроком своим» — 家来たちに), 13 («и ко пророком матере твоея»);
# вариант LXX — в notes. Скобочное пояснение csl «(гряди)» в 23 —
# редакторское, не переведено.
# Речь — 「…」 первого уровня, вложенная — 『…』. Пророчество 16–19 идёт единым
# блоком: речь открыта в ст. 16 и закрыта в ст. 19 (как длинные речи в 2Цар 7).
# Красного и синего нет. 〔…〕 нет: все стихи есть в гр.
# Сносок ⟨…⟩ нет: 主, 預言者, 祭壇, 燔祭 уже в корпусе.

