verses:
  0: "指揮者[しきしゃ]に。ダビデの詩[うた]。"
  1: "わたしは主[しゅ]に寄[よ]り頼[たの]んでいる。あなたがたは皆[みな]、わたしの魂[たましい]に言[い]う。「鳥[とり]のように山[やま]へ移[うつ]れ」と。"
  2: "見[み]よ、罪[つみ]人[びと]たちは弓[ゆみ]を張[は]り、暗[くら]がりの中[なか]で心[こころ]のまっすぐな者[もの]を射抜[いぬ]こうと、矢[や]を筒[つつ]に備[そな]えた。"
  3: "彼[かれ]らはあなたが建[た]てられたものを壊[こわ]した。しかし、正[ただ]しい者[もの]は何[なに]をしたというのか。"
  4: "主[しゅ]はその聖[せい]なる宮[みや]におられ、主[しゅ]の王座[おうざ]は天[てん]にある。その目[め]は貧[まず]しい者[もの]を眺[なが]め、そのまぶたは人[ひと]の子[こ]らを試[こころ]みる。"
  5: "主[しゅ]は正[ただ]しい者[もの]と悪[わる]い者[もの]とを試[こころ]みる。不義[ふぎ]を愛[あい]する者[もの]は、自分[じぶん]の魂[たましい]を憎[にく]んでいる。"
  6: "主[しゅ]は罪[つみ]人[びと]の上[うえ]に網[あみ]を降[ふ]らせ、火[ひ]と硫黄[いおう]と激[はげ]しい風[かぜ]を降[ふ]らせる。それが彼[かれ]らの杯[さかずき]の分[ぶん]である。"
  7: "主[しゅ]は正[ただ]しく、義[ぎ]を愛[あい]されたからである。その顔[かお]は正[しょう]直[じき]なものを見[み]る。"

notes:
  0: "Εἰς τὸ τέλος· ψαλμὸς τῷ Δαυιδ — 指揮者に。ダビデの詩. Надписание — стих 0."
  1: "Ἐπὶ τῷ κυρίῳ πέποιθα — わたしは主に寄り頼んでいる (πέποιθα, perfect от πείθω — «положился и полагаюсь»). πᾶς ἐρεῖτε τῇ ψυχῇ μου — あなたがたは皆、わたしの魂にどうして言うのか (греч. πᾶς при ἐρεῖτε — несогласовано; передано あなたがたは皆). Μεταναστεύου ἐπὶ τὰ ὄρη ὡς στρουθίον — 「鳥のように山へ移れ」 (μεταναστεύω — «переселяться»; στρουθίον — «воробей, пташка»). Слова советующих — 「」."
  2: "ὅτι ἰδοὺ οἱ ἁμαρτωλοὶ ἐνέτειναν τόξον — 見よ、罪人たちは弓を張り (ἐντείνω — «натягивать»). ἡτοίμασαν βέλη εἰς φαρέτραν — 矢を筒に備えた (φαρέτρα — «колчан»). τοῦ κατατοξεῦσαι ἐν σκοτομήνῃ τοὺς εὐθεῖς τῇ καρδίᾳ — 暗がりの中で心のまっすぐな者を射抜こうと (κατατοξεύω — «расстреливать»; σκοτομήνη — «темнота, безлунная ночь»; εὐθής τῇ καρδίᾳ — «правый сердцем»)."
  3: "ὅτι ἃ κατηρτίσω, καθεῖλον — 彼らはあなたが建てられたものを壊した (καταρτίζω — «устроять»; καθαιρέω — «разрушать»). ὁ δὲ δίκαιος τί ἐποίησεν — しかし、正しい者は何をしたというのか (вопрос без ответа, оставлен вопросом)."
  4: "κύριος ἐν ναῷ ἁγίῳ αὐτοῦ — 主はその聖なる宮におられ (ναός — «храм»). κύριος, ἐν οὐρανῷ ὁ θρόνος αὐτοῦ — 主の王座は天にある (θρόνος — 王座; повтор 主 сохранён). οἱ ὀφθαλμοὶ αὐτοῦ εἰς τὸν πένητα ἀποβλέπουσιν — その目は貧しい者を眺め (ἀποβλέπω — «взирать»; πένης — «нищий»). τὰ βλέφαρα αὐτοῦ ἐξετάζει τοὺς υἱοὺς τῶν ἀνθρώπων — そのまぶたは人の子らを試みる (βλέφαρον — «веко»; ἐξετάζω — «испытывать»)."
  5: "κύριος ἐξετάζει τὸν δίκαιον καὶ τὸν ἀσεβῆ — 主は正しい者と悪い者とを試みる. ὁ δὲ ἀγαπῶν ἀδικίαν μισεῖ τὴν ἑαυτοῦ ψυχήν — 不義を愛する者は、自分の魂を憎んでいる (ἀδικία — «неправда»; ἑαυτοῦ — «свою собственную»)."
  6: "ἐπιβρέξει ἐπὶ ἁμαρτωλοὺς παγίδας — 主は罪人の上に網を降らせ (ἐπιβρέχω — «орошать, проливать»; παγίς — «сеть, ловушка»). πῦρ καὶ θεῖον καὶ πνεῦμα καταιγίδος — 火と硫黄と激しい風 (θεῖον — «сера»; πνεῦμα καταιγίδος — «дух бури»). ἡ μερὶς τοῦ ποτηρίου αὐτῶν — それが彼らの杯の分である (μερὶς τοῦ ποτηρίου — «часть чаши», образ судьбы)."
  7: "ὅτι δίκαιος κύριος καὶ δικαιοσύνας ἠγάπησεν — 主は正しく、義を愛されたからである (plural δικαιοσύνας — «правды», усиление). εὐθύτητα εἶδεν τὸ πρόσωπον αὐτοῦ — その顔は正直なものを見る (εὐθύτης — «прямота»; «лицо Его» — т. е. Его благоволение обращено к правым)."
