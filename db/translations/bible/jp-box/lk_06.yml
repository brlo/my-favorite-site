verses:
  1: "〔過越[すぎこし]の祭[まつ]りが明[あ]けて最初[さいしょ]の安息日[あんそくび]〕に、イエスが麦畑[むぎばたけ]を通[とお]り抜[ぬ]けられた。弟子[でし]たちは穂[ほ]を摘[つ]み、手[て]でもんで食[た]べ始[はじ]めた。"
  2: "ファリサイ派[は]の人々[ひとびと]の幾人[いくにん]かが言[い]った。「なぜ、安息日[あんそくび]にしてはならないことをするのか。」"
  3: "イエスは答[こた]えて言[い]われた。「<j>ダビデが自分[じぶん]も供[とも]の者[もの]たちも飢[う]えたとき、何[なに]をしたか、読[よ]んだことがないのか。</j>"
  4: "<j>神[かみ]の家[いえ]に入[はい]って、供[そな]えのパンを取[と]って食[た]べ、一緒[いっしょ]にいた者[もの]たちにも与[あた]えた。祭司[さいし]たちのほかは、だれもそれを食[た]べてはならないのに。</j>"
  5: "<j>人の子[こ]は安息日[あんそくび]の主[しゅ]である。</j>」"
  6: "またほかの安息日[あんそくび]に、イエスは会堂[かいどう]に入[はい]って教[おし]えておられた。そこに、右[みぎ]の手[て]の萎[な]えた人[ひと]がいた。"
  7: "律法学者[りっぽうがくしゃ]たちとファリサイ派[は]の人々[ひとびと]は、イエスが安息日[あんそくび]に癒[いや]すかどうかを見張[みは]っていた。イエスを訴[うった]える口実[こうじつ]を得[え]るためであった。"
  8: "イエスは彼[かれ]らの思[おも]いを見[み]抜[ぬ]いて、手[て]の萎[な]えた人[ひと]に言[い]われた。「<j>起[お]きて、真[ま]ん中[なか]に立[た]ちなさい。</j>」その人[ひと]は起[お]き上[あ]がって立[た]った。"
  9: "イエスは彼[かれ]らに言[い]われた。「<j>あなたがたに尋[たず]ねる。安息日[あんそくび]にしてよいのは、善[ぜん]を行[おこな]うことか、悪[あく]を行[おこな]うことか。命[いのち]を救[すく]うことか、滅[ほろ]ぼすことか。</j>」"
  10: "イエスは一同[いちどう]を見回[みまわ]されてから、その人[ひと]に言[い]われた。「<j>手[て]を伸[の]べなさい。</j>」その人[ひと]がそうすると、手[て]は〔もう一方[いっぽう]の手[て]と同[おな]じように〕元[もと]どおりになった。"
  11: "彼[かれ]らは怒[いか]りに狂[くる]い、イエスをどうしようかと互[たが]いに話[はな]し合[あ]った。"
  12: "そのころ、イエスは祈[いの]るために山[やま]へ行[い]き、夜通[よどお]し神[かみ]に祈[いの]っておられた。"
  13: "夜[よ]が明[あ]けると、弟子[でし]たちを呼[よ]び寄[よ]せ、その中[なか]から十二人[じゅうににん]を選[えら]んで、使徒[しと]と名[な]づけられた。"
  14: "シモン（イエスはこの人[ひと]をペトロと名[な]づけられた）、その兄弟[きょうだい]アンデレ、ヤコブ、ヨハネ、フィリポ、バルトロマイ、"
  15: "マタイ、トマス、アルファイの子[こ]ヤコブ、そして「熱心党[ねっしんとう]」と呼[よ]ばれたシモン、"
  16: "ヤコブの子[こ]ユダ、そしてイスカリオテのユダ。このユダが裏切[うらぎ]り者[もの]となった。"
  17: "イエスは彼[かれ]らと一緒[いっしょ]に山[やま]を下[くだ]り、平[ひら]たい所[ところ]に立[た]たれた。そこには多[おお]くの弟子[でし]たちと、ユダヤ全土[ぜんど]、エルサレム、またティルスとシドンの海岸[かいがん]地方[ちほう]から集[あつ]まった大[おお]勢[ぜい]の民[たみ]がいた。"
  18: "彼[かれ]らはイエスの話[はなし]を聞[き]き、また病[やまい]を癒[いや]してもらうために来[き]ていた。汚[けが]れた霊[れい]に苦[くる]しめられていた者[もの]たちも癒[いや]された。"
  19: "群衆[ぐんしゅう]は皆[みな]、イエスに触[ふ]れようとした。イエスから力[ちから]が出[で]て、すべての人[ひと]を癒[いや]していたからである。"
  20: "イエスは弟子[でし]たちに目[め]を向[む]けて言[い]われた。「<j>貧[まず]しい人々[ひとびと]は幸[さいわ]いである。神[かみ]の国[くに]はあなたがたのものだからである。</j>"
  21: "<j>今[いま]、飢[う]えている人々[ひとびと]は幸[さいわ]いである。あなたがたは満[み]たされるからである。今[いま]、泣[な]いている人々[ひとびと]は幸[さいわ]いである。あなたがたは笑[わら]うからである。</j>"
  22: "<j>人[ひと]の子[こ]のために、人々[ひとびと]があなたがたを憎[にく]み、あなたがたを除[の]け者[もの]にし、ののしり、あなたがたの名[な]を悪[わる]い者[もの]として退[しりぞ]けるとき、あなたがたは幸[さいわ]いである。</j>"
  23: "<j>その日[ひ]には喜[よろこ]び踊[おど]れ。天[てん]にこそ、あなたがたへの大[おお]きな報[むく]いが蓄[たくわ]えられている。彼[かれ]らの先祖[せんぞ]たちも、預言者[よげんしゃ]たちに同[おな]じことをしたのだ。</j>」"
  24: "「<j>しかし、富[と]んでいるあなたがたは災[わざわ]いである。あなたがたはすでに慰[なぐさ]めを受[う]けているからである。</j>"
  25: "<j>今[いま]、満腹[まんぷく]しているあなたがたは災[わざわ]いである。あなたがたは飢[う]えるからである。今[いま]、笑[わら]っているあなたがたは災[わざわ]いである。あなたがたは悲[かな]しみ、泣[な]くからである。</j>"
  26: "<j>人々[ひとびと]が皆[みな]あなたがたのことを良[よ]く言[い]うとき、あなたがたは災[わざわ]いである。彼[かれ]らの先祖[せんぞ]たちも、偽預言者[ぎよげんしゃ]たちに同[おな]じことをしたのだ。</j>」"
  27: "「<j>しかし、聞[き]いているあなたがたにわたしは言[い]う。あなたがたの敵[てき]を愛[あい]し、あなたがたを憎[にく]む者[もの]に善[ぜん]を行[おこな]いなさい。</j>"
  28: "<j>あなたがたを呪[のろ]う者[もの]を祝福[しゅくふく]し、あなたがたを虐[しいた]げる者[もの]のために祈[いの]りなさい。</j>"
  29: "<j>頬[ほお]を打[う]つ者[もの]には、もう一方[いっぽう]の頬[ほお]も差[さ]し出[だ]しなさい。上着[うわぎ]を取[と]る者[もの]には、下着[したぎ]も取[と]らせなさい。</j>"
  30: "<j>求[もと]める者[もの]にはだれにでも与[あた]えなさい。あなたの物[もの]を取[と]る者[もの]に、返[かえ]せと求[もと]めてはならない。</j>"
  31: "<j>人[ひと]からしてほしいとあなたがたが思[おも]うことを、あなたがたも人[ひと]にしなさい。</j>」"
  32: "「<j>自分[じぶん]を愛[あい]してくれる人[ひと]を愛[あい]したところで、あなたがたに何[なん]の恵[めぐ]みがあろうか。罪人[ざいにん]でさえ、自分[じぶん]を愛[あい]してくれる人[ひと]を愛[あい]する。</j>"
  33: "<j>自分[じぶん]に善[ぜん]を行[おこな]う人[ひと]に善[ぜん]を行[おこな]ったところで、あなたがたに何[なん]の恵[めぐ]みがあろうか。罪人[ざいにん]でさえ、同[おな]じことをしている。</j>"
  34: "<j>返[かえ]してもらうことを当[あ]てにして貸[か]したところで、あなたがたに何[なん]の恵[めぐ]みがあろうか。罪人[ざいにん]でさえ、同[おな]じだけ返[かえ]してもらおうと、罪人[ざいにん]に貸[か]すのである。</j>"
  35: "<j>だが、あなたがたは敵[てき]を愛[あい]し、善[ぜん]を行[おこな]い、何[なに]も当[あ]てにせずに貸[か]しなさい。そうすれば、あなたがたの報[むく]いは大[おお]きく、あなたがたは、いと高[たか]き方[かた]の子[こ]となる。この方[かた]は、恩[おん]を知[し]らない者[もの]にも悪[わる]い者[もの]にも、いつくしみ深[ぶか]いからである。</j>"
  36: "<j>あなたがたの父[ちち]が憐[あわ]れみ深[ぶか]いように、あなたがたも憐[あわ]れみ深[ぶか]くなりなさい。</j>」"
  37: "「<j>人[ひと]を裁[さば]いてはならない。あなたがたも裁[さば]かれないためである。人[ひと]を罪[つみ]に定[さだ]めてはならない。あなたがたも罪[つみ]に定[さだ]められないためである。人[ひと]を赦[ゆる]しなさい。あなたがたも赦[ゆる]されるためである。</j>"
  38: "<j>与[あた]えなさい。そうすれば、あなたがたにも与[あた]えられる。押[お]し入[い]れ、揺[ゆ]すり入[い]れ、あふれ出[で]るほどに満[み]ちた良[よ]い升[ます]を、人々[ひとびと]はあなたがたのふところに注[そそ]ぎ入[い]れる。あなたがたが量[はか]るその升[ます]で、あなたがたにも量[はか]られるからである。</j>」"
  39: "また、イエスは彼[かれ]らにたとえを話[はな]された。「<j>盲人[もうじん]が盲人[もうじん]を導[みちび]くことができるだろうか。二人[ふたり]とも穴[あな]に落[お]ちるではないか。</j>"
  40: "<j>弟子[でし]は師[し]にまさる者[もの]ではない。だが、十分[じゅうぶん]に教[おし]えを受[う]けた者[もの]は皆[みな]、その師[し]のようになる。</j>"
  41: "<j>なぜ、あなたは兄弟[きょうだい]の目[め]にあるちりを見[み]ながら、自分[じぶん]の目[め]にある梁[はり]に気[き]づかないのか。</j>"
  42: "<j>自分[じぶん]の目[め]にある梁[はり]を見[み]もしないで、どうして兄弟[きょうだい]に『兄弟[きょうだい]よ、目[め]のちりを取[と]らせてくれ』と言[い]えるのか。偽善者[ぎぜんしゃ]よ。まず自分[じぶん]の目[め]から梁[はり]を取[と]り除[のぞ]け。そうしてから、兄弟[きょうだい]の目[め]のちりを取[と]り除[のぞ]くことができる。</j>」"
  43: "「<j>良[よ]い木[き]が悪[わる]い実[み]を結[むす]ぶことはなく、悪[わる]い木[き]が良[よ]い実[み]を結[むす]ぶこともない。</j>"
  44: "<j>木[き]はそれぞれ、その実[み]によって見分[みわ]けられる。いばらからいちじくは取[と]れず、あざみからぶどうは摘[つ]めない。</j>"
  45: "<j>善[よ]い人[ひと]は心[こころ]の善[よ]い宝[たから]から善[よ]いものを取[と]り出[だ]し、悪[わる]い人[ひと]は悪[わる]い宝[たから]から悪[わる]いものを取[と]り出[だ]す。心[こころ]に満[み]ちていることが口[くち]から出[で]るからである。</j>」"
  46: "「<j>なぜ、あなたがたはわたしを『主[しゅ]よ、主[しゅ]よ』と呼[よ]びながら、わたしの言[い]うことを行[おこな]わないのか。</j>"
  47: "<j>わたしのもとへ来[き]て、わたしの言葉[ことば]を聞[き]き、それを実行[じっこう]する者[もの]が、どんな人[ひと]に似[に]ているかを、あなたがたに示[しめ]そう。</j>"
  48: "<j>その人[ひと]は、家[いえ]を建[た]てるときに、深[ふか]く掘[ほ]り下[さ]げて岩[いわ]の上[うえ]に土台[どだい]を据[す]えた人[ひと]に似[に]ている。洪水[こうずい]が起[こ]こって川[かわ]がその家[いえ]に押[お]し寄[よ]せても、家[いえ]を揺[ゆ]るがすことはできなかった。堅[かた]く建[た]てられていたからである。</j>"
  49: "<j>しかし、聞[き]いても行[おこな]わない者[もの]は、土台[どだい]を据[す]えずに地面[じめん]の上[うえ]へ家[いえ]を建[た]てた人[ひと]に似[に]ている。川[かわ]が押[お]し寄[よ]せると、その家[いえ]はたちまち倒[たお]れ、その崩[くず]れ方[かた]はひどいものだった。</j>」"

