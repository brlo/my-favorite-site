verses:
  1: "王[おう]は、地[ち]にも海[うみ]にも、その王国[おうこく]に税[ぜい]を課[か]して書[か]き記[しる]した。"
  2: "また、彼[かれ]の力[ちから]と勇敢[ゆうかん]なわざ、彼の王国[おうこく]の富[とみ]と栄光[えいこう]は、見[み]よ、記念[きねん]のためにペルシア人[じん]とメディア人の王[おう]たちの書[しょ]に書[か]かれている。"
  3: "モルデカイはアルタシャスタ王[おう]に次[つ]ぐ者[もの]となり、王国[おうこく]で大[おお]いなる者となり、ユダヤ人[じん]たちから崇[あが]められていた。また、愛[あい]されながら、自分[じぶん]の民[たみ]のすべてに自分の行[おこな]いを語[かた]り聞[き]かせた。モルデカイは言[い]った。「これらのことは神[かみ]から起[お]こったのである。わたしは、これらのことについて見[み]た夢[ゆめ]のことを思[おも]い出[だ]したからである。その言葉[ことば]のうち、一[ひと]つも過[す]ぎ去[さ]らなかった。小[ちい]さな泉[いずみ]が川[かわ]となり、光[ひかり]と太陽[たいよう]と多[おお]くの水[みず]となった。その川とはエステルである。王は彼女[かのじょ]を妻[つま]に迎[むか]え、王妃[おうひ]とした。また、二匹[にひき]の竜[りゅう]とは、わたしとアマンである。また、集[あつ]められた諸国民[しょこくみん]とは、ユダヤ人の名[な]を滅[ほろ]ぼそうとした者たちである。また、わたしの民とは、神に向[む]かって叫[さけ]んで救[すく]われたイスラエルである。主[しゅ]はご自分の民を救い、主はこれらすべての災[わざわ]いからわたしたちを救い出し、神は諸国民の間[あいだ]で起こったことのない大きな印[しるし]と不思議[ふしぎ]を行われた。それゆえ、神は二[ふた]つのくじを作[つく]られた。一つは神の民のため、一つはすべての諸国民のためである。そして、この二つのくじは、神の前[まえ]で、またすべての諸国民の前で、時[とき]と季節[きせつ]と裁[さば]きの日[ひ]に至[いた]った。神はご自分の民を思い起[おこ]し、ご自分の嗣業[しぎょう]を正[ただ]しいとされた。そして、彼らにとってこれらの日は、アダルの月[つき]の十四日[じゅうよっか]と、同[おな]じ月の十五日[じゅうごにち]に、集[つど]いと喜[よろこ]びと楽[たの]しみをもって、神の前で、代々[よよ]にわたり、永遠[とこしえ]に、神の民イスラエルのうちにあるであろう。」プトレマイオスとクレオパトラの治世[ちせい]の第四年[だいよねん]に、自分は祭司[さいし]でありレビ人[びと]であると言ったドシテオスと、その子[こ]プトレマイオスが、このプリムの書簡[しょかん]を携[たずさ]えて来[き]た。人々[ひとびと]は、それをエルサレムにいる者たちのうちのプトレマイオスの子リシマコスが解釈[かいしゃく]したものだとも言った。"

notes:
  1: "Ἔγραψεν … τέλη ἐπὶ τὴν βασιλείαν τῆς τε γῆς καὶ τῆς θαλάσσης — «написал подати на царство земли и моря» (τέλος — «подать, налог»); ἔγραψεν здесь значит «установил, записал», отсюда 課して書き記した. Слав. «написа же царь по всему царствию своему, еже на земли и на мори» — «написал по всему царству своему, что на земле и на море». Син. «наложил подать на землю и на острова морские» — с евр., в текст не внесено."
  2: "τὴν ἰσχὺν αὐτοῦ καὶ ἀνδραγαθίαν — «силу его и доблесть» (ἀνδραγαθία — «мужество, доблестные дела»); 勇敢なわざ. πλοῦτόν τε καὶ δόξαν τῆς βασιλείας αὐτοῦ — «богатство и славу царства его» (πλοῦτος, δόξα). ἰδοὺ γέγραπται ἐν βιβλίῳ βασιλέων Περσῶν καὶ Μήδων εἰς μνημόσυνον — «вот, написано в книге царей Персидских и Мидийских в память» (βιβλίον, μνημόσυνον); слав. «в книзе царей персских и мидских, на память». Син. добавляет «и обстоятельное показание о величии Мардохея» — с евр., в LXX этого нет."
  3: "Ст. 3 = основной стих (ὁ δὲ Μαρδοχαῖος διεδέχετο τὸν βασιλέα Ἀρταξέρξην… παντὶ τῷ ἔθνει αὐτοῦ) + Добавление F, подстихи 3a–3l; подстихи и квадратные скобки в текст не выведены. Основной стих: διεδέχετο τὸν βασιλέα — «наследовал царю», т. е. был вторым после него (слав. «вторый бе по цари»); μέγας ἦν ἐν τῇ βασιλείᾳ — «был велик в царстве»; δεδοξασμένος ὑπὸ τῶν Ιουδαίων — «славен у Иудеев»; φιλούμενος διηγεῖτο τὴν ἀγωγὴν παντὶ τῷ ἔθνει αὐτοῦ — «будучи любим, рассказывал о своём образе жизни всему народу своему» (ἀγωγή — «поведение, образ жизни»), слав. «поведаше содеянная» — «соделанное», в тексте 行ない (по csl; LXX ἀγωγή — «образ жизни»). Далее F: 3a παρὰ τοῦ θεοῦ ἐγένετο ταῦτα — «от Бога это было»; 3b ἐμνήσθην περὶ τοῦ ἐνυπνίου — «я вспомнил о сне»; 3c ἡ μικρὰ πηγή … ἐγένετο ποταμός — «малый источник стал рекой», река — Есфирь; 3d οἱ δύο δράκοντες — «два дракона», это Мардохей и Аман; 3e τὰ ἔθνη τὰ ἐπισυναχθέντα — «собравшиеся народы»; 3f τὸ ἔθνος τὸ ἐμόν … Ισραηλ — «народ мой — Израиль»; 3g κλήρους δύο — «два жребия»; 3h εἰς ὥραν καὶ καιρὸν καὶ εἰς ἡμέραν κρίσεως — «в час и время и в день суда»; 3i ἐδικαίωσεν τὴν κληρονομίαν αὐτοῦ — «оправдал наследие Своё»; 3k μετὰ συναγωγῆς καὶ χαρᾶς καὶ εὐφροσύνης — «с собранием и радостью и веселием». 3l — колофон (не речь): Ἔτους τετάρτου βασιλεύοντος Πτολεμαίου καὶ Κλεοπάτρας — «в четвёртый год царствования Птолемея и Клеопатры»; εἰσήνεγκεν Δωσίθεος, ὃς ἔφη εἶναι ἱερεὺς καὶ Λευίτης, καὶ Πτολεμαῖος ὁ υἱὸς αὐτοῦ — «принёс Досифей, который называл себя иереем и левитом, и Птолемей, сын его»; τὴν προκειμένην ἐπιστολὴν τῶν Φρουραι — «предлежащее послание о Пуриме»; ἣν ἔφασαν … ἑρμηνευκέναι Λυσίμαχον Πτολεμαίου τῶν ἐν Ιερουσαλημ — «о котором говорили, что истолковал Лисимах, сын Птолемея, из тех, что в Иерусалиме». Слав. 10:3 вбирает F целиком и совпадает по составу."
