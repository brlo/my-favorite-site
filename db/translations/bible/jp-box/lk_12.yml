verses:
  1: "その間[あいだ]に、幾万[いくまん]という群衆[ぐんしゅう]が集[あつ]まって、互[たが]いに踏[ふ]みつけるほどになった。イエスはまず弟子[でし]たちに話[はな]し始[め]られた。「<j>ファリサイ派[は]の人々[ひとびと]のパン種[だね]、すなわち偽善[ぎぜん]に気[き]をつけなさい。</j>"
  2: "<j>覆[おお]われているもので、明[あき]らかにされないものはない。隠[かく]されているもので、知[し]られないものはない。</j>"
  3: "<j>だから、あなたがたが暗[くら]やみで言[い]ったことは何[なん]でも光[ひかり]の下[した]で聞[き]かれ、密室[みっしつ]で耳[みみ]もとでささやいたことは、屋根[やね]の上[うえ]で告[つ]げ知[ら]らされるであろう。</j>」"
  4: "「<j>わたしの友[とも]であるあなたがたに言[い]う。体[からだ]を殺[ころ]しても、その後[あと]は何[なに]もできない者[もの]たちを恐[おそ]れてはならない。</j>"
  5: "<j>恐[おそ]れるべき者[もの]がだれかを、あなたがたに示[しめ]そう。殺[ころ]した後[あと]で地獄[じごく]に投[な]げ込[こ]む力[ちから]を持[も]つ方[かた]を恐[おそ]れなさい。そう、あなたがたに言[い]う。その方[かた]を恐[おそ]れなさい。</j>"
  6: "<j>五羽[ごわ]の雀[すずめ]は、二[に]アサリオンで売[う]られているではないか。その一羽[いちわ]さえも、神[かみ]の前[まえ]に忘[わす]れられてはいない。</j>"
  7: "<j>あなたがたの頭[あたま]の髪[かみ]の毛[け]さえ、すべていただ数[かず]えられている。恐[おそ]れてはならない。あなたがたは多[おお]くの雀[すずめ]よりも値打[ねう]ちがある。</j>」"
  8: "「<j>あなたがたに言[い]う。だれでも、人々[ひとびと]の前[まえ]でわたしを認[みと]める者[もの]を、人[ひと]の子[こ]も神[かみ]の天使[てんし]たちの前[まえ]で認[みと]める。</j>"
  9: "<j>しかし、人々[ひとびと]の前[まえ]でわたしを否[いな]む者[もの]は、神[かみ]の天使[てんし]たちの前[まえ]で否[いな]まれる。</j>"
  10: "<j>人[ひと]の子[こ]に逆[さか]らう言葉[ことば]を語[かた]る者[もの]は、だれでも赦[ゆる]される。しかし、{聖霊[せいれい]|聖神[せいしん]}を冒涜[ぼうとく]する者[もの]は赦[ゆる]されない。</j>"
  11: "<j>あなたがたが会堂[かいどう]や、支配者[しはいしゃ]たちや権力[けんりょく]ある者[もの]たちの前[まえ]へ引[ひ]き出[だ]されるとき、どう答[こた]えようか、何[なに]を言[い]おうかと思[おも]い悩[なや]んではならない。</j>"
  12: "<j>そのとき、言[い]うべきことは、{聖霊[せいれい]|聖神[せいしん]}があなたがたに教[おし]えてくださるからである。</j>」"
  13: "群衆[ぐんしゅう]の中[なか]の一人[ひとり]がイエスに言[い]った。「先生[せんせい]。わたしと遺産[いさん]を分[わ]けるように、わたしの兄[あに]に言[い]ってください。」"
  14: "イエスは彼[かれ]に言[い]われた。「<j>人[ひと]よ、だれがわたしを、あなたがたの裁判官[さいばんかん]や分配[ぶんぱい]者[しゃ]に立[た]てたのか。</j>」"
  15: "そして彼[かれ]らに言[い]われた。「<j>よく注意[ちゅうい]して、あらゆる欲張[よくば]りから身[み]を守[まも]りなさい。人[ひと]の命[いのち]は、持[も]ち物[もの]の豊[ゆた]かさにあるのではない。</j>」"
  16: "そして、たとえを話[はな]された。「<j>ある富[とみ]ある人[ひと]の畑[はたけ]が、豊[ゆた]かに実[みの]った。</j>"
  17: "<j>その人[ひと]は自分[じぶん]の中[なか]で考[かんが]えた。『どうしようか。作物[さくもつ]を納[おさ]める所[ところ]がない。』</j>"
  18: "<j>そして言[い]った。『こうしよう。倉[くら]を壊[こわ]して、もっと大[おお]きな倉[くら]を建[た]て、そこに穀物[こくもつ]と財産[ざいさん]をすべて納[おさ]めよう。</j>"
  19: "<j>そして、わたしの魂[たましい]にこう言[い]おう。「魂[たましい]よ、これから何年[なんねん]も食[た]べていけるだけの財産[ざいさん]が、たくさん蓄[たくわ]えてある。ゆっくり休[やす]め。食[た]べ、飲[の]め、楽[たのし]しめ。」』</j>"
  20: "<j>しかし、神[かみ]は彼[かれ]に言[い]われた。</j>『愚[おろ]か者[もの]よ。今夜[こんや]、あなたの魂[たましい]はあなたから取[と]り上[あ]げられる。すると、あなたが備[そな]えたものは、だれのものになるのか。』"
  21: "<j>自分[じぶん]のために財[たから]を積[つ]みながら、神[かみ]に対[たい]して富[とみ]まない者[もの]は、このようである。</j>」"
  22: "そして弟子[でし]たちに言[い]われた。「<j>だから、あなたがたに言[い]う。命[いのち]のために何[なに]を食[た]べようか、体[からだ]のために何[なに]を着[き]ようかと思[おも]い悩[なや]んではならない。</j>"
  23: "<j>命[いのち]は食[た]べ物[もの]よりも、体[からだ]は衣服[いふく]よりも大切[たいせつ]である。</j>"
  24: "<j>カラスをよく見[み]なさい。種[たね]を蒔[ま]かず、刈[か]り入[れ]もせず、倉[くら]も納屋[なや]も持[も]っていない。だが、神[かみ]は彼[かれ]らを養[やしな]ってくださる。あなたがたは、鳥[とり]たちよりもはるかに優[すぐ]れているではないか。</j>"
  25: "<j>あなたがたのうち、だれが思[おも]い悩[なや]んだからといって、自分[じぶん]の背丈[せたけ]を一[いっ]キュビト伸[の]ばすことができるだろうか。</j>"
  26: "<j>この最[もっと]も小[ちい]さなことさえできないのなら、なぜほかのことを思[おも]い悩[なや]むのか。</j>"
  27: "<j>ゆりがどう育[そだ]つかを見[み]なさい。働[はたら]きもせず、糸[いと]を紡[つむ]ぎもしない。だが、わたしはあなたがたに言[い]う。栄華[えいが]の極[きわ]みにあったソロモンでさえ、この花[はな]のどれ一[ひと]つほどにも装[よそお]ってはいなかった。</j>"
  28: "<j>今日[きょう]は野[の]にあって明日[あした]には炉[ろ]へ投[な]げ込[こ]まれる草[くさ]でさえ、神[かみ]はこうして装[よそお]ってくださる。ましてあなたがたには、なおさらのことではないか、信仰[しんこう]の薄[うす]い者[もの]たちよ。</j>"
  29: "<j>あなたがたは、何[なに]を食[た]べようか、何[なに]を飲[の]もうかと求[もと]めてはならない。また、心[こころ]を騒[さわ]がせてもならない。</j>"
  30: "<j>これらのものはすべて、この世[よ]の異邦人[いほうじん]たちが求[もと]めているからである。あなたがたの父[ちち]は、これらのものがあなたがたに必要[ひつよう]であることを知[し]っておられる。</j>"
  31: "<j>ただ、〔神[かみ]の〕国[くに]を求[もと]めなさい。そうすれば、これらのものはすべてあなたがたに加[くわ]えられる。</j>"
  32: "<j>小[ちい]さな群[む]れよ、恐[おそ]れてはならない。あなたがたの父[ちち]は、国[くに]をあなたがたにお与[あた]えになることを喜[よろこ]ばれたからである。</j>"
  33: "<j>あなたがたの持[も]ち物[もの]を売[う]って、施[ほどこ]しをしなさい。古[ふる]びない財布[さいふ]を自分[じぶん]のために作[つく]り、天[てん]に尽[つ]きない宝[たから]を蓄[たくわ]えなさい。そこでは盗人[ぬすびと]が近[ちか]づくことも、虫[むし]が食[く]い壊[こわ]すこともない。</j>"
  34: "<j>あなたがたの宝[たから]の置[お]かれた所[ところ]へ、あなたの心[こころ]もついて行[い]くからである。</j>」"
  35: "「<j>あなたがたの腰[こし]には帯[おび]を締[し]め、ともし火[び]を燃[も]やしておきなさい。</j>"
  36: "<j>そして、あなたがたは、主人[しゅじん]が婚礼[こんれい]から帰[かえ]って来[き]て戸[と]を叩[たた]くとき、すぐに開[あ]けるために待[ま]っている人々[ひとびと]のようでありなさい。</j>"
  37: "<j>主人[しゅじん]が帰[かえ]って来[き]て、僕[しもべ]たちが目[め]を覚[さ]ましているのを見[み]るなら、その僕[しもべ]たちは幸[さいわ]いである。はっきりあなたがたに言[い]う。主人[しゅじん]は自分[じぶん]で腰[こし]に帯[おび]を締[し]め、僕[しもべ]たちを席[せき]に着[つ]かせ、そばに来[き]て仕[つか]えてくれるであろう。</j>"
  38: "<j>主人[しゅじん]が第二[だいに]の夜回[よまわ]り⟨夜[よる]を四[よっ]つに分[わ]けた区切[くぎ]りの一[ひと]つ。⟩にも、第三[だいさん]の夜回[よまわ]りにも来[き]て、そうしているのを見[み]るなら、その僕[しもべ]たちは幸[さいわ]いである。</j>"
  39: "<j>このことを知[し]っておきなさい。もし家[いえ]の主人[しゅじん]が、盗人[ぬすびと]の来[く]る時[とき]を知[し]っていたなら、目[め]を覚[さ]まして、自分[じぶん]の家[いえ]に穴[あな]を掘[ほ]らせはしなかったであろう。</j>"
  40: "<j>だから、あなたがたも用[よう]意[い]しておきなさい。思[おも]いがけない時[とき]に、人[ひと]の子[こ]が来[く]るからである。</j>」"
  41: "ペトロが言[い]った。「主[しゅ]よ、このたとえをわたしたちに話[はな]しておられるのですか。それとも、すべての人[ひと]にですか。」"
  42: "主[しゅ]は言[い]われた。「<j>忠実[ちゅうじつ]で賢[かしこ]い家[いえ]宰[かさい]とは、だれのことか。主人[しゅじん]が、決[き]まった時[とき]に定[さだ]めの糧[かて]を僕[しもべ]たちに配[くば]らせるために、自分[じぶん]の僕[しもべ]たちの上[うえ]に立[た]てる者[もの]である。</j>"
  43: "<j>主人[しゅじん]が帰[かえ]って来[き]たとき、そうしているのを見[み]られた僕[しもべ]は幸[さいわ]いである。</j>"
  44: "<j>あなたがたに真[まこと]に言[い]う。主人[しゅじん]は、自分[じぶん]の全[すべ]ての財産[ざいさん]をその僕[しもべ]に任[まか]せるであろう。</j>"
  45: "<j>しかし、その僕[しもべ]が心[こころ]の中[なか]で『わたしの主人[しゅじん]はなかなか帰[かえ]って来[こ]ない』と言[い]い、僕[しもべ]や女中[じょちゅう]を打[う]ちたたき、食[た]べたり飲[の]んだりして酔[よ]っぱらうなら、</j>"
  46: "<j>その僕[しもべ]の主人[しゅじん]は、思[おも]いがけない日[ひ]に、知[し]らない時[とき]に帰[かえ]って来[き]て、彼[かれ]を真[ま]っ二[ふた]つに切[き]り裂[さ]き、不忠実[ふちゅうじつ]な者[もの]たちと同[おな]じ運命[うんめい]に置[お]くであろう。</j>"
  47: "<j>主人[しゅじん]の心[こころ]を知[し]りながら、用[よう]意[い]もせず、その心[こころ]に従[したが]っても行[おこな]わなかった僕[しもべ]は、多[おお]く打[う]たれるであろう。</j>"
  48: "<j>しかし、知[し]らずにいて、打[う]たれるに値[あたい]することをした者[もの]は、少[すこ]ししか打[う]たれない。多[おお]く与[あた]えられた者[もの]からは多[おお]く求[もと]められ、多[おお]く託[たく]された者[もの]からは、さらに多[おお]く求[もと]められるからである。</j>」"
  49: "「<j>わたしは火[ひ]を地[ち]に投[な]げるために来[き]た。この火[ひ]がすでに燃[も]えていることを、わたしはどれほど願[ねが]っていることか。</j>"
  50: "<j>わたしには受[う]けるべき洗礼[せんれい]がある。それが終[おわ]るまでは、わたしはどれほど苦[くる]しみに迫[せま]られていることか。</j>"
  51: "<j>あなたがたは、わたしが平和[へいわ]を地[ち]に与[あた]えるために来[き]たと思[おも]っているのか。いいや、あなたがたに言[い]う。平和[へいわ]ではなく、分裂[ぶんれつ]である。</j>"
  52: "<j>これから後[のち]、一[ひと]つの家[いえ]に五人[ごにん]の者[もの]が、三人[さんにん]は二人[ふたり]に、二人[ふたり]は三人[さんにん]に分[わか]れて対立[たいりつ]する。</j>"
  53: "<j>父[ちち]は子[こ]に、子[こ]は父[ちち]に、母[はは]は娘[むすめ]に、娘[むすめ]は母[はは]に、姑[しゅうとめ]は嫁[よめ]に、嫁[よめ]は姑[しゅうとめ]に対立[たいりつ]する。</j>」"
  54: "イエスは群衆[ぐんしゅう]にも言[い]われた。「<j>あなたがたは、雲[くも]が西[にし]にわき起[お]こるのを見[み]ると、すぐに『雨[あめ]が降[ふ]る』と言[い]い、そうなる。</j>"
  55: "<j>南風[みなみかぜ]が吹[ふ]くのを見[み]ると、『暑[あつ]くなる』と言[い]い、そうなる。</j>"
  56: "<j>偽善者[ぎぜんしゃ]たちよ。あなたがたは地[ち]と天[てん]の様子[ようす]を見[み]分[わ]けることを知[し]っている。どうして、この時[とき]を見[み]分[わ]けることを知[し]らないのか。</j>」"
  57: "「<j>また、どうして自分[じぶん]で正[ただ]しいことを裁[さば]かないのか。</j>"
  58: "<j>あなたがたが相手[あいて]と一緒[いっしょ]に役人[やくにん]のところへ行[い]くときは、道々[みちみち]、その人[ひと]から離[はな]れようと努[つと]めなさい。そうしないと、相手[あいて]があなたを裁判官[さいばんかん]に引[ひ]き出[だ]し、裁判官[さいばんかん]があなたを下役[したやく]に渡[わた]し、下役[したやく]があなたを牢[ろう]に入[い]れてしまう。</j>"
  59: "<j>あなたがたに言[い]う。最後[さいご]のレプタ銅貨[どうか]まで返[かえ]し終[お]えるまで、あなたはそこから決[けっ]して出[で]られない。</j>」"

notes:
  1: "ζύμη τῶν Φαρισαίων, ἥτις ἐστὶν ὑπόκρισις — パン種…すなわち偽善; сноски нет: パン種 пояснён при первом упоминании (Мк 8:15)."
  5: "γέεννα — 地獄, как везде в jp-box (ᾅδης — 陰府)."
  15: "πλεονεξία — «любостяжание»; 欲張り. οὐκ ἐν τῷ περισσεύειν τινὶ ἡ ζωὴ αὐτοῦ ἐστιν ἐκ τῶν ὑπαρχόντων αὐτῷ — 命は持ち物の豊かさにあるのではない."
  25: "ἡλικία здесь можно понять и как «возраст/жизнь», и как «рост»; выбрал рост (背丈), как Мф 6:27. πῆχυς — локоть, 一キュビト; сноска дана при первом упоминании (Мф 6:27)."
  31: "В критической базе τὴν βασιλείαν αὐτοῦ («Его Царство»); Церковь (Елизаветинская «Царствия Божия», jp-joc 神の國) читает τοῦ θεοῦ — добавление 神の в 〔〕, как Мф 6:33."
  38: "φυλακή — ночная стража; 夜回り. В базе «вторая или третья стража»."
  42: "οἰκονόμος — 家宰. σιτομέτριον — 定めの糧."
  46: "διχοτομήσει — «рассечёт»; 真っ二つに切り裂く, без сглаживания. τὸ μέρος αὐτοῦ μετὰ τῶν ἀπίστων — 不忠実な者たちと同じ運命."
  50: "συνέχομαι — «стеснён, томлюсь»; 苦しみに迫られている."
