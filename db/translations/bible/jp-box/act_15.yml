# jp-box, Деяния апостолов, глава 15. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный 常体, без 文語.
# Критический греческий (gr-lxx-byz) — свидетель; расхождения — в 〔…〕 и notes.
# jp-ni не использовался.
#
# Глава 15: спор о обрезании (1–5), Апостольский собор — речь Петра (6–11),
# свидетельство Варнавы и Павла (12), речь Иакова и постановление (13–21),
# посольство и письмо (22–29), возвращение в Антиохию (30–35), раздор
# Павла и Варнавы (36–41).
# Красного в главе нет: Христос здесь не говорит. Речи Петра (7–11),
# Иакова (13–21), фарисеев (5) и иудеев (1) — не красные.
# 〔…〕: только 15:34 — в критической базе на месте стиха стоит «.», поэтому
# стих целиком в 〔…〕 (церковное чтение: Сила остаётся, Иуда возвращается).
# Слова в квадратных скобках (15:24 ἐξελθόντες) в базе есть — не оборачиваются.
# Сноска одна — 15:20 (絞め殺した動物, πνικτός).

