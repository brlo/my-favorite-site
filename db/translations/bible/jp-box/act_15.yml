verses:
  1: "さて、ユダヤから下[くだ]って来[き]た人々[ひとびと]が、兄弟[きょうだい]たちにこう教[おし]えていた。「モーセの慣[なら]わしに従[したが]って割礼[かつれい]を受けなければ、あなたがたは救[すく]われない。」"
  2: "パウロとバルナバが彼[かれ]らと少[すこ]しならぬ争[あらそ]いと議論[ぎろん]をしたので、人々[ひとびと]は、パウロとバルナバ、また彼[かれ]らのうちの幾人[いくにん]かが、この問題[もんだい]のためにエルサレムへ上[のぼ]って、使徒[しと]たちと長老[ちょうろう]たちを訪[たず]ねることに決[き]めた。"
  3: "そこで、教会[きょうかい]に送[おく]り出[だ]された一行[いっこう]は、フェニキアとサマリアを通[とお]り、異邦人[いほうじん]が改宗[かいしゅう]したことを詳[くわ]しく語[かた]って、兄弟[きょうだい]たちを大[おお]いに喜[よろこ]ばせた。"
  4: "エルサレムに着[つ]くと、教会[きょうかい]と使徒[しと]たちと長老[ちょうろう]たちに迎[むか]えられ、神[かみ]が自分[じぶん]たちとともに行[おこな]われたすべてのことを報告[ほうこく]した。"
  5: "しかし、ファリサイ派[は]の者[もの]で信[しん]じた者[もの]たちのうちの何人[なんにん]かが立[た]ち上[あ]がって、「彼[かれ]らに割礼[かつれい]を行[おこな]わせ、モーセの律法[りっぽう]を守[まも]らせるように命[めい]じるべきである」と言[い]った。"
  6: "そこで、使徒[しと]たちと長老[ちょうろう]たちは、この問題[もんだい]を検討[けんとう]するために集[あつ]まった。"
  7: "多[おお]くの議論[ぎろん]が交[か]わされた後[のち]、ペトロが立[た]ち上[あ]がって言[い]った。「兄弟[きょうだい]たち、あなたがたはよく知[し]っているとおり、神[かみ]は早[はや]くからあなたがたの中[なか]からわたしをお選[えら]びになり、異邦人[いほうじん]がわたしの口[くち]から福音[ふくいん]の言葉[ことば]を聞[き]いて信[しん]じるようにされた。"
  8: "人[ひと]の心[こころ]を察[さっ]する神[かみ]は、わたしたちに与[あた]えられたのと同[おな]じく{聖霊[せいれい]|聖神[せいしん]}を彼[かれ]らにもお与[あた]えになり、彼[かれ]らに証[あか]しされた。"
  9: "わたしたちと彼[かれ]らとの間[あいだ]に何[なん]の区別[くべつ]も置[お]かれず、信仰[しんこう]によって彼[かれ]らの心[こころ]を清[きよ]められたのである。"
  10: "それなら、なぜあなたがたは神[かみ]を試[こころ]みるのか。わたしたちの先祖[せんぞ]もわたしたちも負[お]いきれなかったくびきを、弟子[でし]たちの首[くび]に載[の]せようというのか。"
  11: "そうではなく、わたしたちは、彼[かれ]らと同[おな]じように、主[しゅ]イエスの恵[めぐ]みによって救[すく]われると信[しん]じている。」"
  12: "すると、全会衆[ぜんかいしゅう]が黙[だま]り込[こ]み、バルナバとパウロが、神[かみ]が自分[じぶん]たちを通[とお]して異邦人[いほうじん]の中[なか]で行[おこな]われたしるしと奇跡[きせき]について語[かた]るのを聞[き]いていた。"
  13: "二人[ふたり]が話[はな]し終[お]わると、ヤコブが答[こた]えて言[い]った。「兄弟[きょうだい]たち、わたしの話[はなし]を聞[き]いてください。"
  14: "シメオンは、神[かみ]が初[はじ]めに異邦人[いほうじん]の中[なか]から、御自身[ごじしん]の名[な]のために民[たみ]を取[と]り集[あつ]めようと顧[かえり]みられた次第[しだい]を語[かた]りました。"
  15: "預言者[よげんしゃ]たちの言葉[ことば]も、これと一致[いっち]しています。こう書[か]かれているとおりです。"
  16: "『その後[のち]、わたしは戻[もど]って来[き]て、倒[たお]れたダビデの幕屋[まくや]を建[た]て直[なお]す。その壊[こわ]されたところを建[た]て直[なお]し、これを起[お]こす。"
  17: "そうして、残[のこ]りの人々[ひとびと]と、わたしの名[な]が呼[よ]ばれているすべての異邦人[いほうじん]とが、主[しゅ]を求[もと]めるようになるためである。これを成[な]し遂[と]げる主[しゅ]が、こう言[い]っておられる。"
  18: "これは、昔[むかし]から知[し]られていることである。』"
  19: "だから、わたしの判断[はんだん]では、異邦人[いほうじん]から神[かみ]に転[てん]じる者[もの]たちを煩[わずら]わせてはならない。"
  20: "ただ、彼[かれ]らに手紙[てがみ]を書[か]いて、偶像[ぐうぞう]に汚[けが]された物[もの]、淫[いん]らな行[おこな]い、絞[し]め殺[ころ]した動物[どうぶつ]⟨血[ち]を抜[ぬ]かないで殺[ころ]した動物[どうぶつ]。⟩、血[ち]から遠[とお]ざかるように命[めい]じるべきである。"
  21: "昔[むかし]からどの町[まち]にもモーセを宣[の]べ伝[つた]える者[もの]があり、モーセの律法[りっぽう]は安息日[あんそくび]ごとに会堂[かいどう]で読[よ]まれているからである。」"
  22: "そこで、使徒[しと]たちと長老[ちょうろう]たちは、全[ぜん]教会[きょうかい]とともに、自分[じぶん]たちの中[なか]から人[ひと]を選[えら]んで、パウロとバルナバに同行[どうこう]させてアンティオキアへ遣[つか]わすことに決[き]めた。すなわち、バルサバと呼[よ]ばれるユダとシラスである。二人[ふたり]は兄弟[きょうだい]たちの間[あいだ]の指導者[しどうしゃ]であった。"
  23: "そして、彼[かれ]らの手[て]に手紙[てがみ]を託[たく]して、こう書[か]いた。「使徒[しと]たちと長老[ちょうろう]たちである兄弟[きょうだい]たちから、アンティオキア、シリア、キリキアに住[す]む異邦人[いほうじん]の兄弟[きょうだい]たちへ。挨拶[あいさつ]を送[おく]る。"
  24: "わたしたちは、ある者[もの]たちがわたしたちの中[なか]から出[で]て行[い]き、言葉[ことば]であなたがたをかき乱[みだ]し、あなたがたの心[こころ]を動揺[どうよう]させたことを聞[き]いた。わたしたちは彼[かれ]らにそのようなことを命[めい]じてはいない。"
  25: "そこで、わたしたちは心[こころ]を一[ひと]つにして集[あつ]まり、選[えら]んだ人[ひと]たちを、わたしたちの愛[あい]するバルナバとパウロに同行[どうこう]させて、あなたがたのところへ遣[つか]わすことに決[き]めた。"
  26: "この二人[ふたり]は、わたしたちの主[しゅ]イエス・キリストの名[な]のために、自分[じぶん]たちの命[いのち]をささげた人々[ひとびと]である。"
  27: "そこで、わたしたちはユダとシラスを遣[つか]わした。彼[かれ]らも口[くち]で同[おな]じことを伝[つた]える。"
  28: "{聖霊[せいれい]|聖神[せいしん]}とわたしたちとは、次[つぎ]の必要[ひつよう]な事[こと]がらのほかは、あなたがたにこれ以上[いじょう]の負担[ふたん]を負[お]わせないことに決[き]めた。"
  29: "すなわち、偶像[ぐうぞう]に供[そな]えた物[もの]、血[ち]、絞[し]め殺[ころ]した動物[どうぶつ]、淫[いん]らな行[おこな]いから遠[とお]ざかることである。あなたがたがこれらのことを慎[つつし]んで守[まも]るなら、あなたがたは幸[しあわ]せである。では、元気[げんき]で。」"
  30: "こうして一行[いっこう]は送[おく]り出[だ]されてアンティオキアへ下[くだ]り、人々[ひとびと]を集[あつ]めて手紙[てがみ]を手渡[てわた]した。"
  31: "人々[ひとびと]はそれを読[よ]んで、その励[はげ]ましに喜[よろこ]んだ。"
  32: "ユダとシラスも預言者[よげんしゃ]であったので、多[おお]くの言葉[ことば]で兄弟[きょうだい]たちを励[はげ]まし、強[つよ]めた。"
  33: "しばらく過[す]ごしてから、二人[ふたり]は兄弟[きょうだい]たちから平安[へいあん]のうちに送[おく]り出[だ]され、自分[じぶん]たちを遣[つか]わした人々[ひとびと]のところへ帰[かえ]って行[い]った。"
  34: "〔しかし、シラスはそこにとどまることにした。ユダだけがエルサレムへ帰[かえ]って行[い]った。〕"
  35: "パウロとバルナバはアンティオキアにとどまり、ほかにも多[おお]くの者[もの]たちとともに、主[しゅ]の言葉[ことば]を教[おし]え、福音[ふくいん]を告[つ]げ知[し]らせていた。"
  36: "幾日[いくにち]か後[のち]、パウロはバルナバに言[い]った。「わたしたちが主[しゅ]の言葉[ことば]を告[つ]げ知[し]らせたすべての町[まち]へ戻[もど]って、兄弟[きょうだい]たちがどうしているかを訪[たず]ねてみよう。」"
  37: "バルナバは、マルコと呼[よ]ばれるヨハネも一緒[いっしょ]に連[つ]れて行[い]くことを望[のぞ]んだ。"
  38: "しかしパウロは、パンフィリアで彼[かれ]らから離[はな]れ、働[はたら]きに同行[どうこう]しなかった者[もの]を連[つ]れて行[い]くのはよくないと考[かんが]えた。"
  39: "そこで激[はげ]しい対立[たいりつ]が生[しょう]じ、二人[ふたり]は互[たが]いに別[わか]れることになった。バルナバはマルコを連[つ]れてキプロスへ船出[ふなで]し、"
  40: "パウロはシラスを選[えら]んで出[で]発[はつ]した。兄弟[きょうだい]たちは彼[かれ]を主[しゅ]の恵[めぐ]みに委[ゆだ]ねた。"
  41: "彼[かれ]はシリアとキリキアを通[とお]って、諸[しょ]教会[きょうかい]を強[つよ]めて行[い]った。"

notes:
  1: "ἔθει τῷ Μωϋσέως — «по обычаю Моисееву»; モーセの慣わし. Речь иудеев — не красная."
  2: "στάσις καὶ ζήτησις — «разногласие и рассуждение»; 争いと議論."
  3: "ἐπιστροφή — «обращение» язычников; 改宗."
  5: "αἵρεσις τῶν Φαρισαίων — «толк фарисейский»; ファリサイ派. Слова фарисеев — не красные."
  7: "Речь Петра (7–11) — не красная. ἀφ᾽ ἡμερῶν ἀρχαίων — «из дней древних»; 早くから."
  8: "καρδιογνώστης — «ведающий сердца»; 人の心を察する神."
  10: "ζυγός — «иго»; в тексте каной くびき (軛), чтобы не выходить за 常用漢字."
  11: "καθ᾽ ὃν τρόπον κἀκεῖνοι — «таким же образом, как и они»; 彼らと同じように."
  14: "Συμεῶν — здесь о Петре (Симон); в тексте シメオン, как в 15:14 греч."
  16: "Ам 9:11–12 (LXX); цитата внутри речи Иакова — 『…』 до конца 15:18. σκηνὴ Δαυίδ — ダビデの幕屋."
  18: "γνωστὰ ἀπ᾽ αἰῶνος — «известное от века»; в базе только эти слова (у jp-joc распространено: «Бог знает все дела Свои»), поэтому переведено кратко."
  20: "ἀλισγήματα τῶν εἰδώλων — «осквернённое идолами», то есть идоложертвенное; 偶像に汚された物, без сглаживания. πνικτός — удавленина, мясо неудавленного животного; 絞め殺した動物, сноска. Перечень постановления не смягчён: идоложертвенное, блуд, удавленина, кровь."
  21: "Моисей читается в синагогах каждый субботу — потому и требуется письменное решение для язычников."
  22: "Ἰούδας ὁ καλούμενος Βαρσαββᾶς — バルサバと呼ばれるユダ; Σίλας — シラス (в посланиях — シルワノ)."
  23: "Письмо собора: от 15:23 до 15:29 — прямая речь письма в 「…」. χαίρειν — эпистолярное приветствие; 挨拶を送る."
  24: "В критическом тексте ἐξελθόντες в квадратных скобках — слово в базе есть, 〔…〕 не ставится."
  26: "παραδεδωκόσι τὰς ψυχάς — «предавшие души свои»; 命をささげた."
  28: "ἔδοξεν τῷ πνεύματι τῷ ἁγίῳ καὶ ἡμῖν — «угодно Святому Духу и нам»; {聖霊|聖神}."
  29: "Порядок постановления иной, чем в 15:20: идоложертвенное, кровь, удавленина, блуд — как в греч. Ἔρρωσθε — «будьте здоровы»; では、元気で."
  34: "В критической базе на месте стиха стоит «.» — стиха нет, поэтому он целиком в 〔…〕. Церковное чтение (Елизаветинская, jp-joc): Сила остаётся, Иуда один возвращается в Иерусалим."
  36: "ἐπιστρέψαντες ἐπισκεψώμεθα — «возвратившись, посетим»; 戻って…訪ねてみよう. Речь Павла — не красная."
  38: "ἀποστάντα ἀπ᾽ αὐτῶν ἀπὸ Παμφυλίας — «отпавшего от них в Памфилии» (13:13); パンフィリアで彼らから離れ."
  39: "παροξυσμός — «раздражение, острое разногласие»; 激しい対立, без сглаживания."
