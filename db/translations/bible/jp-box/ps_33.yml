verses:
  0: "ダビデの詩[うた]。アビメレクの前[まえ]で顔[かお]つきを変[か]え、彼[かれ]に追[お]い払[はら]われて去[さ]ったときのもの。"
  1: "わたしはどのときにも主[しゅ]をたたえる。主[しゅ]への賛美[さんび]は、いつもわたしの口[くち]にある。"
  2: "わたしの魂[たましい]は主[しゅ]にあって誇[ほこ]る。柔和[にゅうわ]な者[もの]らは聞[き]いて喜[よろこ]べ。"
  3: "わたしと共[とも]に主[しゅ]を大[おお]いなる方[かた]としてあがめ、共[とも]にその名[な]を高[たか]く上[あ]げよう。"
  4: "わたしは主[しゅ]を求[もと]め、主[しゅ]はわたしに答[こた]え、わたしのすべての恐[おそ]れからわたしを救[すく]い出[だ]された。"
  5: "主[しゅ]に近[ちか]づいて、光[ひかり]を受[う]けよ。あなたがたの顔[かお]は恥[は]じを受[う]けない。"
  6: "この貧[まず]しい者[もの]が呼[よ]ぶと、主[しゅ]は聞[き]き、そのすべての苦[くる]しみから彼[かれ]を救[すく]われた。"
  7: "主[しゅ]の使[つか]いが、主[しゅ]を恐[おそ]れる者[もの]らを囲[かこ]んで陣[じん]を敷[し]き、彼[かれ]らを救[すく]い出[だ]す。"
  8: "味[あじ]わって見[み]よ、主[しゅ]がどれほど良[よ]い方[かた]かを。幸[さいわ]いなのは、主[しゅ]に望[のぞ]みを置[お]く人[ひと]である。"
  9: "主[しゅ]の聖[せい]なる者[もの]らよ、主[しゅ]を恐[おそ]れよ。主[しゅ]を恐[おそ]れる者[もの]には、何[なに]も欠[か]けることがないからである。"
  10: "富[とみ]ある者[もの]も貧[まず]しくなり、飢[う]える。しかし、主[しゅ]を求[もと]める者[もの]は、どんな良[よ]いものにも欠[か]けることがない。"
  11: "子[こ]らよ、来[き]て、わたしの話[はなし]を聞[き]け。わたしはあなたがたに主[しゅ]を恐[おそ]れることを教[おし]えよう。"
  12: "生[い]きることを望[のぞ]み、良[よ]い日[ひ]を見[み]ることを愛[あい]する人[ひと]は、だれか。"
  13: "あなたの舌[した]を悪[あく]から遠[とお]ざけ、あなたの唇[くちびる]を偽[いつわ]りを語[かた]ることから遠[とお]ざけよ。"
  14: "悪[あく]を避[さ]けて善[ぜん]を行[おこな]い、平和[へいわ]を求[もと]めて、それを追[お]い求[もと]めよ。"
  15: "主[しゅ]の目[め]は正[ただ]しい者[もの]の上[うえ]にあり、その耳[みみ]は彼[かれ]らの願[ねが]いに傾[かたむ]く。"
  16: "しかし、主[しゅ]の顔[かお]は悪[わる]を行[おこな]う者[もの]に向[む]かい、彼[かれ]らの名[な]の記憶[きおく]を地[ち]から消[け]し去[さ]られる。"
  17: "正[ただ]しい者[もの]らが呼[よ]ぶと、主[しゅ]は聞[き]き、そのすべての苦[くる]しみから彼[かれ]らを救[すく]い出[だ]された。"
  18: "主[しゅ]は心[こころ]の砕[くだ]けた者[もの]に近[ちか]く、霊[れい]のへりくだる者[もの]を救[すく]われる。"
  19: "正[ただ]しい者[もの]たちの苦[くる]しみは多[おお]い。しかし、主[しゅ]はそのすべてから彼[かれ]らを救[すく]い出[だ]される。"
  20: "主[しゅ]は彼[かれ]らの骨[ほね]をすべて守[まも]られる。その一[ひと]つも砕[くだ]けない。"
  21: "罪[つみ]人[びと]の死[し]はわざわいであり、正[ただ]しい者[もの]を憎[にく]む者[もの]は罰[ばつ]を負[お]う。"
  22: "主[しゅ]はその僕[しもべ]たちの魂[たましい]を贖[あがな]い出[だ]される。主[しゅ]に望[のぞ]みを置[お]く者[もの]は、ひとりも罰[ばつ]を負[お]わない。"

notes:
  0: "Τῷ Δαυιδ, ὁπότε ἠλλοίωσεν τὸ πρόσωπον αὐτοῦ ἐναντίον Αβιμελεχ, καὶ ἀπέλυσεν αὐτόν, καὶ ἀπῆλθεν — ダビデの詩、アビメレクの前で顔つきを変え、彼に追い払われて去ったときのもの (ἀλλοιόω — «изменять»; речь о притворном безумии, ср. 1 Цар 21). Надписание — стих 0."
  1: "Εὐλογήσω τὸν κύριον ἐν παντὶ καιρῷ — わたしはどのときにも主をたたえる (εὐλογέω — «благословлять, хвалить»). διὰ παντὸς ἡ αἴνεσις αὐτοῦ ἐν τῷ στόματί μου — 主への賛美は、いつもわたしの口にある (αἴνεσις — «хвала»)."
  2: "ἐν τῷ κυρίῳ ἐπαινεσθήσεται ἡ ψυχή μου — わたしの魂は主にあって誇る (ἐπαινέω — «хвалить»). ἀκουσάτωσαν πραεῖς καὶ εὐφρανθάτωσαν — 柔和な者らは聞いて喜べ (πραΰς — «кроткий»); пожелание сохранено."
  3: "μεγαλύνατε τὸν κύριον σὺν ἐμοί — わたしと共に主を大いなる方としてあがめ (μεγαλύνω — «величать»). ὑψώσωμεν τὸ ὄνομα αὐτοῦ ἐπὶ τὸ αὐτό — 共にその名を高く上げよう (ἐπὶ τὸ αὐτό — «вместе»)."
  4: "ἐξεζήτησα τὸν κύριον, καὶ ἐπήκουσέν μου — わたしは主を求め、主はわたしに答え (ἐπακούω — «услышать»). ἐκ πασῶν τῶν παροικιῶν μου ἐρρύσατό με — わたしのすべてもろもろの恐れからわたしを救い出された (παροικία — «странствование, пришельство»; Синодальный «от всех опасностей моих»)."
  5: "προσέλθατε πρὸς αὐτὸν καὶ φωτίσθητε — 主に近づいて、光を受けよ (φωτίζω — «просвещать»); слав. «приступите к Нему и просветитеся», Синодальный по евр. «кто обращал взор к Нему». τὰ πρόσωπα ὑμῶν οὐ μὴ καταισχυνθῇ — あなたがたの顔は恥じを受けない."
  6: "οὗτος ὁ πτωχὸς ἐκέκραξεν — この貧しい者が呼ぶと (πτωχός — «нищий»). ὁ κύριος εἰσήκουσεν αὐτοῦ — 主は聞き. ἐκ πασῶν τῶν θλίψεων αὐτοῦ ἔσωσεν αὐτόν — そのすべてもろもろの苦しみから彼を救われた (θλῖψις — «скорбь»)."
  7: "παρεμβαλεῖ ἄγγελος κυρίου κύκλῳ τῶν φοβουμένων αὐτὸν — 主の使いが、主を恐れる者らを囲んで陣を敷き (παρεμβάλλω — «располагать стан»; κύκλῳ — «вокруг»). ῥύσεται αὐτούς — 彼らを救い出す."
  8: "γεύσασθε καὶ ἴδετε ὅτι χρηστὸς ὁ κύριος — 味わって見よ、主がどれほど良い方かを (γεύομαι — «вкушать»; χρηστός — «благ»). μακάριος ἀνήρ, ὃς ἐλπίζει ἐπ᾿ αὐτόν — 幸いなのは、主に望みを置く人である."
  9: "φοβήθητε τὸν κύριον, οἱ ἅγιοι αὐτοῦ — 主の聖なる者らよ、主を恐れよ. οὐκ ἔστιν ὑστέρημα τοῖς φοβουμένοις αὐτόν — 主を恐れる者には、何も欠けることがない (ὑστέρημα — «недостаток»)."
  10: "πλούσιοι ἐπτώχευσαν καὶ ἐπείνασαν — 富ある者も貧しくなり、飢える (πτωχεύω — «нищать»); слав. «богатии обнищаша и взалкаша», Синодальный по евр. «скимны» (львы). οἱ ἐκζητοῦντες τὸν κύριον οὐκ ἐλαττωθήσονται παντὸς ἀγαθοῦ — 主を求める者は、どんな良いものにも欠けることがない (ἐλαττόω — «умалять»). διάψαλμα в конце стиха не передаётся."
  11: "δεῦτε, τέκνα, ἀκούσατέ μου — 子らよ、来て、わたしの話を聞け (δεῦτε — «идите сюда»). φόβον κυρίου διδάξω ὑμᾶς — わたしはあなたがたに主を恐れることを教えよう."
  12: "τίς ἐστιν ἄνθρωπος ὁ θέλων ζωὴν ἀγαπῶν ἡμέρας ἰδεῖν ἀγαθάς — 生きることを望み、良い日を見ることを愛する人はだれか (вопрос без ответа, как в греческом)."
  13: "παῦσον τὴν γλῶσσάν σου ἀπὸ κακοῦ — あなたの舌を悪から遠ざけ (παύω — «останавливать»). χείλη σου τοῦ μὴ λαλῆσαι δόλον — あなたの唇を偽りを語ることから遠ざけよ (δόλος — «лукавство»)."
  14: "ἔκκλινον ἀπὸ κακοῦ καὶ ποίησον ἀγαθόν — 悪を避けて善を行い (ἐκκλίνω — «уклоняться»). ζήτησον εἰρήνην καὶ δίωξον αὐτήν — 平和を求めて、それを追い求めよ (διώκω — «гнаться»)."
  15: "ὀφθαλμοὶ κυρίου ἐπὶ δικαίους — 主の目は正しい者の上にあり. τὰ ὦτα αὐτοῦ εἰς δέησιν αὐτῶν — その耳は彼らの願いに傾く (δέησις — «моление»)."
  16: "πρόσωπον δὲ κυρίου ἐπὶ ποιοῦντας κακά — しかし、主の顔は悪を行う者に向かい. τοῦ ἐξολεθρεῦσαι ἐκ γῆς τὸ μνημόσυνον αὐτῶν — 彼らの名の記憶を地から消し去られる (ἐξολεθρεύω — «истреблять»; μνημόσυνον — «память»)."
  17: "ἐκέκραξαν οἱ δίκαιοι — 正しい者らが呼ぶと. ὁ κύριος εἰσήκουσεν αὐτῶν — 主は聞き. ἐκ πασῶν τῶν θλίψεων αὐτῶν ἐρρύσατο αὐτούς — そのすべてもろもろの苦しみから彼らを救い出された."
  18: "ἐγγὺς κύριος τοῖς συντετριμμένοις τὴν καρδίαν — 主は心の砕けた者に近く (συντρίβω — «сокрушать»). τοὺς ταπεινοὺς τῷ πνεύματι σώσει — 霊のへりくだる者を救われる (πνεῦμα — 霊[れい], по правилу корпуса; ταπεινός — «смиренный»)."
  19: "πολλαὶ αἱ θλίψεις τῶν δικαίων — 正しい者たちの苦しみは多い. ἐκ πασῶν αὐτῶν ῥύσεται αὐτούς — そのすべてから彼らを救い出される."
  20: "κύριος φυλάσσει πάντα τὰ ὀστᾶ αὐτῶν — 主は彼らの骨をすべて守られる (φυλάσσω — «хранить»). ἓν ἐξ αὐτῶν οὐ συντριβήσεται — その一つも砕けない (συντρίβω — «сокрушать»)."
  21: "θάνατος ἁμαρτωλῶν πονηρός — 罪人の死はわざわいであり (πονηρός — «злой, лютый»). οἱ μισοῦντες τὸν δίκαιον πλημμελήσουσιν — 正しい者を憎む者は罰を負う (πλημμελέω — «провиниться, подлежать наказанию»)."
  22: "λυτρώσεται κύριος ψυχὰς δούλων αὐτοῦ — 主はその僕たちの魂を贖い出される (λυτρόω — «искупать»). οὐ μὴ πλημμελήσωσιν πάντες οἱ ἐλπίζοντες ἐπ᾿ αὐτόν — 主に望みを置く者は、ひとりも罰を負わない."
