verses:
  1: "その後[のち]、アンモン人[じん]の王[おう]ナアスが死[し]に、その子[こ]アナンが彼[かれ]に代[か]わって王となった。"
  2: "ダビデは言[い]った。「ナアスの子[こ]アナンに、その父[ちち]がわたしに施[ほどこ]したのと同[おな]じ慈[いつく]しみを施そう。」そこでダビデは、その父のことで彼[かれ]を慰[なぐさ]めるために使者[ししゃ]たちを遣[つか]わした。ダビデの家来[けらい]たちはアンモン人の地[ち]、アナンのもとへ着[つ]いた。"
  3: "アンモン人[じん]の首長[しゅちょう]たちはアナンに言[い]った。「ダビデがあなたの父[ちち]をあなたの前[まえ]でほめたたえるために、あなたに慰[なぐさ]めの者[もの]たちを遣[つか]わしたのでしょうか。いいえ、この町[まち]を探[さぐ]り、地[ち]を偵察[ていさつ]するために、彼の家来[けらい]たちはあなたのもとへ来[き]たのです。」"
  4: "アナンはダビデの家来[けらい]たちを捕[つか]まえ、彼[かれ]らのひげをそり落[お]とし、着物[きもの]を半分[はんぶん]、腰[こし]のあたりまで切[き]り取[と]って、彼らを帰[かえ]らせた。"
  5: "この人[ひと]たちのことがダビデに告[つ]げられると、彼[かれ]は彼らを迎[むか]えに人を遣[つか]わした。彼らはひどく辱[はずかし]められていたからである。王[おう]は言[い]った。「ひげが伸[の]びるまでエリコに座[すわ]っていなさい。それから帰[かえ]って来[き]なさい。」"
  6: "アンモン人[じん]は、ダビデの民[たみ]が辱[はずかし]められたのを見[み]て、アナンとアンモン人は銀[ぎん]一千[いっせん]タラントを送[おく]り、シリア・メソポタミア、シリア・マアハ、スバから戦車[せんしゃ]と騎兵[きへい]を雇[やと]おうとした。"
  7: "そして、戦車[せんしゃ]三万二千[さんまんにせん]と、マアハの王[おう]およびその民[たみ]を雇[やと]った。彼らは来[き]て、メデバの前[まえ]に陣[じん]を敷[し]いた。アンモン人[じん]もまた、自分[じぶん]たちの町々[まちまち]から集[あつ]まって戦[たたか]いに来た。"
  8: "ダビデはこれを聞[き]くと、ヨアブと全軍[ぜんぐん]、すなわち勇士[ゆうし]たちを遣[つか]わした。"
  9: "アンモン人[じん]は出[で]て来[き]て、町[まち]の門[もん]の入口[いりぐち]で戦[いくさ]の陣[じん]を敷[し]いた。来[き]ていた王[おう]たちは、彼[かれ]らだけで野[の]に陣を敷いた。"
  10: "ヨアブは、戦[いくさ]が自分[じぶん]の前[まえ]と後[うし]ろの両方[りょうほう]から迫[せま]っているのを見[み]て、イスラエルのすべての若者[わかもの]たちから選[えら]び出[だ]し、シリア人[じん]に向[む]かって陣[じん]を敷[し]いた。"
  11: "残[のこ]りの民[たみ]は、その兄弟[きょうだい]アベシャの手[て]に渡[わた]し、アンモン人[じん]に向かって陣を敷いた。"
  12: "彼[かれ]は言[い]った。「もしシリア人[じん]がわたしに勝[か]つなら、あなたはわたしを救[すく]ってくれる。もしアンモン人[じん]があなたに勝つなら、わたしがあなたを救おう。"
  13: "勇[いさ]みなさい。わたしたちの民[たみ]と、わたしたちの神[かみ]の町々[まちまち]のために、強[つよ]く立[た]ちましょう。主[しゅ]はその目[め]に良[よ]いと思[おも]われることをなさる。」"
  14: "ヨアブと、彼[かれ]とともにいる民[たみ]は、シリア人[じん]との戦[いくさ]に近[ちか]づいた。すると彼らは彼の前[まえ]から逃[に]げた。"
  15: "アンモン人[じん]は、シリア人[じん]が逃[に]げたのを見[み]て、自分[じぶん]たちもヨアブの前[まえ]から、またその兄弟[きょうだい]アベシャの前から逃げ、町[まち]に入[はい]った。ヨアブはエルサレムに来[き]た。"
  16: "シリア人[じん]は、イスラエルが自分[じぶん]たちを破[やぶ]ったのを見[み]て、使者[ししゃ]たちを遣[つか]わし、川[かわ]の向[む]こう側[がわ]からシリア人を連[つ]れ出[だ]させた。アドラアザルの軍[ぐん]の長[ちょう]ソファクが彼[かれ]らの前[まえ]にいた。"
  17: "ダビデにこのことが告[つ]げられると、彼[かれ]はイスラエルのすべてを集[あつ]め、ヨルダン川[がわ]を渡[わた]って彼[かれ]らのところへ来[き]、彼らに向[む]かって陣[じん]を敷[し]いた。ダビデはシリア人[じん]に向かって陣を敷いて戦[たたか]った。"
  18: "シリア人[じん]はイスラエルの前[まえ]から逃[に]げた。ダビデはシリア人の戦車[せんしゃ]七千[ななせん]と歩兵[ほへい]四万[よんまん]を殺[ころ]し、その軍[ぐん]の長[ちょう]ソファクを殺した。"
  19: "アドラアザルのしもべたちは、自分[じぶん]たちがイスラエルの前[まえ]で敗[やぶ]れたのを見[み]て、ダビデと和[やわ]らぎ、彼[かれ]に仕[つか]えた。シリア人[じん]は、もはやアンモン人[じん]を助[たす]けようとはしなかった。"

notes:
  1: "μετὰ ταῦτα — после сего. ἀπέθανεν Ναας — умер Наас (ナアス). ἐβασίλευσεν Αναν υἱὸς αὐτοῦ ἀντ᾿ αὐτοῦ — воцарился Анан, сын его, вместо него. В LXX здесь Αναν (アナン), в 2 Цар 10:1 Αννων (アンノン) — одно лицо."
  2: "Ποιήσω ἔλεος — сотворю милость. ὡς ἐποίησεν ὁ πατὴρ αὐτοῦ … ἔλεος — как оказал отец его милость. ἀπέστειλεν ἀγγέλους — послал послов (使者). παρακαλέσαι — утешить (慰める). παῖδες — отроки, слуги (家来). В csl добавлено «ко анану» — внесено アナンのもとへ."
  3: "ἄρχοντες Αμμων — начальники Аммона (首長). Μὴ δοξάζων … ἀπέστειλέν σοι παρακαλοῦντας; — разве, прославляя, послал он к тебе утешителей? οὐχ ὅπως ἐξερευνήσωσιν τὴν πόλιν — не для того ли, чтобы исследовать город; csl «никако: но да испытают» превращает в утверждение — принято csl. κατασκοπῆσαι τὴν γῆν — высмотреть землю (偵察)."
  4: "ἐξύρησεν αὐτούς — обрил их (ξυρέω). ἀφεῖλεν τῶν μανδυῶν αὐτῶν τὸ ἥμισυ — отнял половину одежд их (μανδύας — плащ, 着物). ἕως τῆς ἀναβολῆς — до накидки; по csl «до чресл» — до пояса (腰). ἀπέστειλεν — отослал."
  5: "ἦλθον ἀπαγγεῖλαι — пришли возвестить. εἰς ἀπάντησιν αὐτοῖς — навстречу им. ἠτιμωμένοι σφόδρα — сильно обесчещены (辱められる). Καθίσατε ἐν Ιεριχω — останьтесь в Иерихоне. ἕως τοῦ ἀνατεῖλαι τοὺς πώγωνας ὑμῶν — пока не отрастут бороды ваши (πώγων — ひげ). ἀνακάμψατε — возвратитесь."
  6: "ᾐσχύνθη λαὸς Δαυιδ — посрамился народ Давида. ἀπέστειλεν … χίλια τάλαντα ἀργυρίου — послал тысячу талантов серебра (タラント). τοῦ μισθώσασθαι — чтобы нанять (雇う). ἐκ Συρίας Μεσοποταμίας — из Сирии Месопотамской, ἐκ Συρίας Μοοχα — из Сирии Мааха (マアハ), ἐκ Σωβα — из Сувы (スバ). ἅρματα καὶ ἱππεῖς — колесницы и всадников."
  7: "δύο καὶ τριάκοντα χιλιάδας ἁρμάτων — тридцать две тысячи колесниц. τὸν βασιλέα Μωχα — царя Мааха (в csl «мааха»). παρενέβαλον κατέναντι Μαιδαβα — расположились станом против Медевы (メデバ). συνήχθησαν ἐκ τῶν πόλεων — собрались из городов."
  8: "ἤκουσεν Δαυιδ — услышал Давид. ἀπέστειλεν τὸν Ιωαβ καὶ πᾶσαν τὴν στρατιὰν τῶν δυνατῶν — послал Иоава и всё войско сильных (勇士)."
  9: "ἐξῆλθον οἱ υἱοὶ Αμμων — вышли сыны Аммона. παρατάσσονται εἰς πόλεμον — строятся на войну. παρὰ τὸν πυλῶνα τῆς πόλεως — у ворот города (πυλών — 門の入口). οἱ βασιλεῖς οἱ ἐλθόντες — пришедшие цари. καθ᾽ ἑαυτοὺς ἐν τῷ πεδίῳ — отдельно, в поле."
  10: "ἀντιπρόσωποι τοῦ πολεμεῖν — лицом к лицу для войны (спереди и сзади). ἐξελέξατο ἐκ παντὸς νεανίου — избрал из всех юношей (若者). παρετάξαντο ἐναντίον τοῦ Σύρου — построились против Сирийца."
  11: "τὸ κατάλοιπον τοῦ λαοῦ — остаток народа. ἔδωκεν ἐν χειρὶ Αβεσσα — отдал в руку Авессы. ἐξ ἐναντίας υἱῶν Αμμων — против сынов Аммона."
  12: "Ἐὰν κρατήσῃ ὑπὲρ ἐμὲ Σύρος — если одолеет меня Сирия (κρατέω). ἔσῃ μοι εἰς σωτηρίαν — будешь мне во спасение. σώσω σε — спасу тебя."
  13: "ἀνδρίζου — мужайся (ἀνδρίζομαι). ἐνισχύσωμεν — укрепимся. περὶ τοῦ λαοῦ ἡμῶν καὶ περὶ τῶν πόλεων τοῦ θεοῦ ἡμῶν — за народ наш и за города Бога нашего. κύριος τὸ ἀγαθὸν ἐν ὀφθαλμοῖς αὐτοῦ ποιήσει — Господь сотворит благое в очах Своих."
  14: "παρετάξατο … κατέναντι Σύρων εἰς πόλεμον — построился против Сирии на войну. ἔφυγον ἀπ᾿ αὐτοῦ — побежали от него."
  15: "εἶδον ὅτι ἔφυγον Σύροι — увидели, что Сирия побежала. ἔφυγον καὶ αὐτοὶ ἀπὸ προσώπου Ιωαβ — побежали и они от лица Иоава. ἀπὸ προσώπου Αβεσσα τοῦ ἀδελφοῦ αὐτοῦ — от лица Авессы, брата его; в csl порядок обратный — «от лица Авессы и от лица Иоава брата его», что путает родство (Иоав — брат Авессы), поэтому оставлен порядок LXX. ἦλθεν Ιωαβ εἰς Ιερουσαλημ — пришёл Иоав в Иерусалим."
  16: "ἐτροπώσατο αὐτὸν Ισραηλ — Израиль обратил его в бегство. ἀπέστειλεν ἀγγέλους — послал послов. ἐξήγαγον τὸν Σύρον ἐκ τοῦ πέραν τοῦ ποταμοῦ — вывели Сирию из-за реки (川の向こう側). Σωφαχ ἀρχιστράτηγος δυνάμεως Αδρααζαρ — Софах, военачальник силы Адраазара (ソファク; в 2 Цар 10:16 Σωβακ — ソバク). ἔμπροσθεν αὐτῶν — пред ними."
  17: "ἀπηγγέλη τῷ Δαυιδ — возвещено было Давиду. συνήγαγεν τὸν πάντα Ισραηλ — собрал весь Израиль. διέβη τὸν Ιορδάνην — перешёл Иордан (ヨルダン川). παρετάξατο ἐπ᾿ αὐτούς — построился против них. καὶ παρατάσσεται Σύρος ἐξ ἐναντίας Δαυιδ καὶ ἐπολέμησαν αὐτόν — и построилась Сирия против Давида, и воевали с ним; csl «ополчися давид противу сира … и воева нань» — принято csl (ダビデは…陣を敷いて戦った)."
  18: "ἔφυγεν Σύρος ἀπὸ προσώπου Δαυιδ — побежала Сирия от лица Давида; csl «от лица израилева» — принято イスラエルの前から. ἀπέκτεινεν … ἑπτὰ χιλιάδας ἁρμάτων — убил семь тысяч колесниц. τεσσαράκοντα χιλιάδας πεζῶν — сорок тысяч пеших; в 2 Цар 10:18 иные числа: семьсот колесниц и сорок тысяч всадников. τὸν Σωφαχ … ἀπέκτεινεν — Софаха умертвил."
  19: "ἐπταίκασιν — споткнулись, потерпели поражение (πταίω). διέθεντο μετὰ Δαυιδ — заключили с Давидом [мир] (διατίθεμαι). ἐδούλευσαν αὐτῷ — служили ему. οὐκ ἠθέλησεν Σύρος τοῦ βοηθῆσαι — не захотела Сирия помогать."
