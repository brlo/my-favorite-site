# jp-box, 1-я Паралипоменон, глава 19. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); по паритету csl-ru — второй свидетель церковного
# текста: его чтения и добавления входят в основной текст без 〔…〕, отличия LXX — в notes.
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет,
# jp-ni (943 стиха, под авторским правом) источником не был.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 19: смерть Нааса и воцарение Анана (1), посольство Давида и оскорбление
# послов (2–5), наём сирийцев за тысячу талантов (6–7), поход Иоава (8–9),
# две линии боя и речь Иоава (10–13), поражение Сирии (14–15), новый сбор
# сирийцев и победа Давида (16–19). Параллель — 2 Цар 10.
# Речи — 「…」: Давид (2), аммонитские начальники (3), царь (5), Иоав (12–13).
# Красного нет.
# 〔…〕 нет. csl-добавление внесено: 19:2 «ко анану». Слав. порядок в 19:15
# («от лица Авессы и от лица Иоава брата его») путает родство — оставлен порядок LXX.
# Сносок ⟨…⟩ нет: アンモン人, シリア人, 戦車, 騎兵, 王, 町, 使者 уже в корпусе.
# Отличия LXX/csl: 19:1 Αναν (в 2 Цар 10:1 Αννων); 19:3 слав. «никако: но да
# испытают» (в LXX второй вопрос); 19:7 тридцать две тысячи колесниц (в 2 Цар 10:6
# иной список наёмников); 19:16 Σωφαχ (в 2 Цар 10:16 Σωβακ); 19:17 слав. подлежащее
# «Давид» (в LXX «Сирия»); 19:18 семь тысяч колесниц и сорок тысяч пеших
# (в 2 Цар 10:18 семьсот колесниц и сорок тысяч всадников). jp-ni не использовался.

