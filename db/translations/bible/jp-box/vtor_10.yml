# jp-box, Второзаконие, глава 10. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — csl-ru; ru — только для понимания.
# jp-joc есть только в 10:14–21 (старый язык, свидетель церковного чтения);
# перевод по gr-lxx-byz, jp-joc в текст не вносился.
# Глава 10: вторые скрижали и ковчег (1–5), стоянки и отделение левитов (6–9),
# продолжение ходатайства (10–11), призыв к страху Божию и любви (12–22).
# Речь Моисея — 「…」 (1–22). Слова Бога внутри неё — 『…』 (1–2, 11).
# 〔…〕 нет: jp-joc покрывает только 14–21 и полностью совпадает по содержанию
# с gr-lxx-byz; расхождений, требующих скобок, нет.
# Сносок ⟨…⟩ нет: 契約の箱, 石板, 割礼, 寄留者 уже в корпусе или понятны.
# LXX-особенности: 10:4 «десять слов» (十の言葉); 10:6 имена стоянок переданы
# по-гречески (Βηρωθ υἱῶν Ιακιμ, Μισαδαι), как в Числ 33; 10:8 ἐπεύχεσθαι —
# «благословлять (призывать) именем»; 10:16 в базе σκληροκαρδία — «жестокосердие»,
# а «крайняя плоть сердца» — масоретское чтение (см. notes); 10:22 слав.
# «седмидесятих и пяти» (75) — в базе ἑβδομήκοντα (70).
# Речь Моисея в файле открыта 「 в начале главы и закрыта 」 в конце: она продолжается
# и в следующей главе, поэтому кавычки балансируются внутри файла.
# jp-ni не использовался.

tr_code: jp-box
book: vtor
chapter: 10
draft: true

verses:
  1: "「そのとき、主[しゅ]はわたしに言[い]われた。『あなたのために、はじめのものと同[おな]じ二枚[にまい]の石[いし]の板[いた]を切[き]り出[だ]し、山[やま]のわたしのところへ上[のぼ]って来[き]なさい。また、あなたのために木[き]の箱[はこ]を造[つく]りなさい。"
  2: "わたしは、あなたが砕[くだ]いたはじめの板[いた]にあった言葉[ことば]を、その板[いた]に書[か]く。あなたはそれを箱[はこ]に入[い]れなさい。』"
  3: "わたしはアカシアの木[き]で箱[はこ]を造[つく]り、はじめのものと同[おな]じ二枚[にまい]の石[いし]の板[いた]を切[き]り出[だ]し、山[やま]に上[のぼ]った。二枚[にまい]の板[いた]はわたしの手[て]にあった。"
  4: "主[しゅ]はその板[いた]に、はじめの書[か]き方[かた]どおりに、十[とお]の言葉[ことば]を書[か]かれた。それは主[しゅ]が山[やま]で、火[ひ]の中[なか]からあなたがたに語[かた]られたものである。主[しゅ]はそれをわたしに与[あた]えられた。"
  5: "わたしは向[む]きを変[か]えて山[やま]を下[くだ]り、造[つく]った箱[はこ]にその板[いた]を入[い]れた。板[いた]は今[いま]もそこにある。主[しゅ]がわたしに命[めい]じられたとおりである。"
  6: "イスラエルの子[こ]らは、ベロト・ベネ・ヤキムからミサダイへ旅立[たびだ]った。そこでアロンは死[し]に、葬[ほうむ]られた。彼[かれ]の代[か]わりに、その子[こ]エレアザルが祭司[さいし]となった。"
  7: "そこから彼[かれ]らはガドガドへ、ガドガドからエテバタへ、すなわち水[みず]の流[なが]れの地[ち]へ旅立[たびだ]った。"
  8: "そのとき、主[しゅ]はレビの部族[ぶぞく]を分[わ]けて、主[しゅ]の契約[けいやく]の箱[はこ]を運[はこ]ばせ、主[しゅ]の前[まえ]に立[た]って主に仕[つか]えさせ、主[しゅ]の御名[みな]によって祝福[しゅくふく]させられた。これは今日[きょう]に至[いた]るまで続[つづ]いている。"
  9: "それゆえ、レビ人[びと]には兄弟[きょうだい]たちの間[あいだ]に分[ぶん]も嗣業[しぎょう]もない。主[しゅ]ご自身[じしん]が彼[かれ]の嗣業[しぎょう]だからである。主が彼[かれ]に言[い]われたとおりである。"
  10: "わたしは、はじめのときと同[おな]じように、山[やま]に四十日[しじゅうにち]四十夜[しじゅうや]立[た]っていた。主[しゅ]はこのときもまた、わたしの声[こえ]を聞[き]かれた。主[しゅ]はあなたがたを滅[ほろ]ぼし尽[つ]くすことを望[のぞ]まれなかった。"
  11: "主[しゅ]はわたしに言[い]われた。『立[た]って、民[たみ]の前[まえ]を進[すす]みなさい。彼[かれ]らが入[はい]って行[ゆ]き、わたしが彼[かれ]らの父[ちち]たちに彼[かれ]らに与[あた]えると誓[ちか]った地[ち]を嗣業[しぎょう]として受[う]け継[つ]ぐようにしなさい。』"
  12: "そして今[いま]、イスラエルよ。あなたの神[かみ]である主[しゅ]があなたに求[もと]めておられることは何[なに]か。ただ、あなたの神[かみ]である主[しゅ]を畏[おそ]れ、そのすべての道[みち]を歩[あゆ]み、主を愛[あい]し、あなたの神[かみ]である主[しゅ]に、心[こころ]を尽[つ]くし、魂[たましい]を尽[つ]くして仕[つか]え、"
  13: "主[しゅ]の戒[いまし]めと、わたしが今日[きょう]あなたに命[めい]じるその定[さだ]めを守[まも]ることであり、それはあなたが幸[しあわ]せになるためではないか。"
  14: "見[み]よ、天[てん]と、その天[てん]の天[てん]、地[ち]と、そこにあるすべてのものは、あなたの神[かみ]である主[しゅ]のものである。"
  15: "しかし主[しゅ]は、あなたがたの父[ちち]たちを愛[あい]することを選[えら]び、彼[かれ]らの後[のち]のその裔[すえ]、すなわちあなたがたを、今日[きょう]のように、すべての民[たみ]のうちから選[えら]ばれた。"
  16: "あなたがたの心[こころ]の包皮[ほうひ]を切[き]り捨[す]て、もはや首[くび]をかたくなにしてはならない。"
  17: "あなたがたの神[かみ]である主[しゅ]は、神々[かみがみ]の神[かみ]、主[しゅ]の主[しゅ]、大[おお]きく強[つよ]く、畏[おそ]るべき神[かみ]であり、人[ひと]の顔[かお]を偏[かたよ]り見[み]ず、賄賂[わいろ]を取[と]らない。"
  18: "寄留者[きりゅうしゃ]と孤児[みなしご]とやもめのために裁[さば]きを行[おこな]い、寄留者[きりゅうしゃ]を愛[あい]して、彼[かれ]にパンと衣[ころも]を与[あた]えられる。"
  19: "あなたがたも寄留者[きりゅうしゃ]を愛[あい]しなさい。あなたがたもエジプトの地[ち]では寄留者[きりゅうしゃ]であったからである。"
  20: "あなたの神[かみ]である主[しゅ]を畏[おそ]れ、主[しゅ]に仕[つか]え、主[しゅ]に寄[よ]り添[そ]い、主[しゅ]の御名[みな]によって誓[ちか]いなさい。"
  21: "主[しゅ]はあなたの誉[ほま]れ、主[しゅ]はあなたの神[かみ]である。主[しゅ]はあなたのために、あなたの目[め]が見[み]たこれらの大[おお]きな輝[かがや]かしい業[わざ]を行[おこな]われた。"
  22: "あなたの父[ちち]たちは七十人[ななじゅうにん]でエジプトに下[くだ]った。しかし今[いま]、あなたの神[かみ]である主[しゅ]は、あなたを天[てん]の星[ほし]のように多[おお]くされた。」"

notes:
  1: "Ἐν ἐκείνῳ τῷ καιρῷ — в то время. Λάξευσον σεαυτῷ — вытеши себе (λαξεύω — «высекать»). ὥσπερ τὰς πρώτας — как первые. κιβωτὸν ξυλίνην — деревянный ковчег (ящик)."
  2: "γράψω ἐπὶ τὰς πλάκας — Я напишу на скрижалях (Бог говорит о Себе; слав. «напишу»). ἃ ἦν ἐν ταῖς πλαξὶν ταῖς πρώταις — что было на первых скрижалях. ἐμβαλεῖς εἰς τὴν κιβωτόν — положишь в ковчег."
  3: "ξύλων ἀσήπτων — дерева негниющего (ἄσηπτος; акация, евр. ситтим). ἐλάξευσα — вытесал. ὡς αἱ πρῶται — как первые."
  4: "κατὰ τὴν γραφὴν τὴν πρώτην — по первому написанию. τοὺς δέκα λόγους — десять слов (十の言葉, ср. 4:13). ἐκ μέσου τοῦ πυρός — из среды огня (ср. 9:10, где этого нет). ἔδωκεν αὐτὰς κύριος ἐμοί — дал их Господь мне."
  5: "ἐνέβαλον — положил (ἐμβάλλω). καθὰ ἐνετείλατό μοι κύριος — как повелел мне Господь."
  6: "Βηρωθ υἱῶν Ιακιμ — «Беерот сынов Иакима» (греч. передаёт евр. Беероф-Бене-Яакан); Μισαδαι — Мозер. ἀπῆραν — отправились. ἐτάφη — погребён. ἱεράτευσεν — стал священником (ἱερατεύω). ἀντ᾽ αὐτοῦ — вместо него."
  7: "ἐκεῖθεν ἀπῆραν εἰς Γαδγαδ — оттуда в Гадгад (в Числ 33 — ガドガド). Ετεβαθα — Етевава (エテバタ). γῆ χείμαρροι ὑδάτων — земля потоков вод."
  8: "διέστειλεν — отделил (διαστέλλω). αἴρειν τὴν κιβωτὸν τῆς διαθήκης — носить ковчег завета. παρεστάναι ἔναντι κυρίου — предстоять пред Господом. λειτουργεῖν — служить. ἐπεύχεσθαι ἐπὶ τῷ ὀνόματι αὐτοῦ — благословлять (призывать) именем Его (слав. добавляет «благословляти»). ἕως τῆς ἡμέρας ταύτης — до сего дня."
  9: "μερὶς καὶ κλῆρος — часть и удел. κύριος αὐτὸς κλῆρος αὐτοῦ — Сам Господь удел его. καθὰ εἶπεν αὐτῷ — как сказал ему (Господь Левию)."
  10: "κἀγὼ εἱστήκειν — и я стоял (ἵστημι, plusquamperfect). εἰσήκουσεν κύριος ἐμοῦ — услышал меня Господь. οὐκ ἠθέλησεν ἐξολεθρεῦσαι — не захотел истребить."
  11: "Βάδιζε ἄπαρον ἐναντίον τοῦ λαοῦ — иди, поднимись пред народом (ἀπαίρω — «сниматься, отправляться»). εἰσπορευέσθωσαν καὶ κληρονομείτωσαν — пусть войдут и наследуют. ὤμοσα τοῖς πατράσιν — клялся отцам."
  12: "τί κύριος ὁ θεός σου αἰτεῖται παρὰ σοῦ — чего требует от тебя Господь. ἀλλ᾽ ἢ — кроме, только. φοβεῖσθαι, πορεύεσθαι, ἀγαπᾶν, λατρεύειν — инфинитивы-перечисления. ἐξ ὅλης τῆς καρδίας… ψυχῆς — от всего сердца и всей души."
  13: "φυλάσσεσθαι τὰς ἐντολὰς… καὶ τὰ δικαιώματα — соблюдать заповеди и постановления. ἵνα εὖ σοι ᾖ — чтобы тебе было хорошо (вопрос продолжается)."
  14: "ὁ οὐρανὸς καὶ ὁ οὐρανὸς τοῦ οὐρανοῦ — небо и небо небес. ἡ γῆ καὶ πάντα, ὅσα ἐστὶν ἐν αὐτῇ — земля и всё, что на ней."
  15: "πλὴν — однако. προείλατο — предпочёл, избрал (προαιρέω). ἀγαπᾶν αὐτούς — любить их. ἐξελέξατο τὸ σπέρμα αὐτῶν μετ᾽ αὐτούς — избрал семя их после них. παρὰ πάντα τὰ ἔθνη — из всех народов."
  16: "περιτεμεῖσθε τὴν σκληροκαρδίαν ὑμῶν — букв. «обрежьте жестокосердие ваше» (σκληροκαρδία); масор. עָרְלַת לְבַבְכֶם «крайняя плоть сердца», отсюда 心の包皮 (Синодальный, ср. Иер 4:4). τράχηλον οὐ σκληρυνεῖτε ἔτι — шеи не будете делать жёсткими более."
  17: "θεὸς τῶν θεῶν καὶ κύριος τῶν κυρίων — Бог богов и Господь господ. ὁ μέγας καὶ ἰσχυρὸς καὶ ὁ φοβερός — великий, сильный и страшный. οὐ θαυμάζει πρόσωπον — не взирает на лицо (нелицеприятен). οὐ μὴ λάβῃ δῶρον — не берёт дара."
  18: "ποιῶν κρίσιν προσηλύτῳ καὶ ὀρφανῷ καὶ χήρᾳ — творящий суд пришельцу, сироте и вдове. ἀγαπᾷ τὸν προσήλυτον — любит пришельца. ἄρτον καὶ ἱμάτιον — хлеб и одежду."
  19: "ἀγαπήσετε τὸν προσήλυτον — возлюбите пришельца. προσήλυτοι γὰρ ἦτε ἐν γῇ Αἰγύπτῳ — ибо пришельцами были в земле Египетской."
  20: "φοβηθήσῃ, λατρεύσεις, κολληθήσῃ, ὀμῇ — будешь бояться, служить, прилепишься, будешь клясться. πρὸς αὐτὸν κολληθῆναι — прилепиться к Нему."
  21: "καύχημά σου — хвала твоя. τὰ μεγάλα καὶ τὰ ἔνδοξα — великое и славное. ἃ εἴδοσαν οἱ ὀφθαλμοί σου — что видели глаза твои."
  22: "ἐν ἑβδομήκοντα ψυχαῖς — в семидесяти душах (слав. «седмидесятих и пяти», 75 — иное чтение). ὡσεὶ τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει — как звёзды небесные по множеству."
