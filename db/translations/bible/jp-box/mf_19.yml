verses:
  1: "話[はな]しを終[お]えたイエスはガリラヤを発[た]ち、ヨルダン川[がわ]の向[む]こうにあるユダヤの地[ち]へ向[む]かわれた。"
  2: "大勢[おおぜい]の群衆[ぐんしゅう]がイエスに従[したが]った。イエスはそこで彼[かれ]らを癒[いや]された。"
  3: "ファリサイ派[は]の人々[ひとびと]がイエスに近[ちか]づいて来[き]て、試[こころ]みようとして言[い]った。「どんな理由[りゆう]があっても、夫[おっと]が妻[つま]を離縁[りえん]することは律法[りっぽう]にかなっているでしょうか。」"
  4: "イエスはお答[こた]えになった。「<j>あなたがたは読[よ]まなかったのか。人[ひと]を造[つく]られた方[かた]は、初[はじ]めから男[おとこ]と女[おんな]とに造[つく]られた。</j>"
  5: "<j>そして、『それゆえ、人[ひと]は父[ちち]と母[はは]を離[はな]れ、妻[つま]と結[むす]ばれて、二人[ふたり]は一体[いったい]となる』と言[い]われた。</j>"
  6: "<j>それゆえ、二人[ふたり]はもはや二人[ふたり]ではなく、一体[いったい]である。だから、神[かみ]が結[むす]び合[あ]わせたものを、人[ひと]は離[はな]してはならない。</j>」"
  7: "彼[かれ]らは言[い]った。「では、モーセはなぜ、離縁状[りえんじょう]を渡[わた]して妻[つま]を離縁[りえん]するように命[めい]じたのですか。」"
  8: "イエスは言[い]われた。「<j>あなたがたの心[こころ]が頑固[がんこ]なので、モーセは妻[つま]を離縁[りえん]することをあなたがたに許[ゆる]した。しかし、初[はじ]めからそうだったのではない。</j>"
  9: "<j>わたしはあなたがたに言[い]う。淫[いん]らな行[おこな]いの理由[りゆう]がないのに妻[つま]を離縁[りえん]して、ほかの女[おんな]を妻[つま]にする者[もの]は、姦淫[かんいん]の罪[つみ]を犯[おか]すのである。〔また、離縁[りえん]された女[おんな]を娶[めと]る者[もの]も、姦淫[かんいん]の罪[つみ]を犯[おか]す。〕</j>」"
  10: "弟子[でし]たちは言[い]った。「夫[おっと]と妻[つま]の間[あいだ]がそのようなものであるなら、結婚[けっこん]しないほうがよいということになります。」"
  11: "イエスは言[い]われた。「<j>この言葉[ことば]を納[おさ]められる者[もの]は、すべての人[ひと]ではない。授[さず]けられた者[もの]だけである。</j>"
  12: "<j>母[はは]の胎[はら]から宦官[かんがん]として生[う]まれた者[もの]もあり、人[ひと]によって宦官[かんがん]にされた者[もの]もあり、天[てん]の国[くに]のために自分[じぶん]を宦官[かんがん]にした者[もの]もある。納[おさ]められる者[もの]は納[おさ]めなさい。</j>」"
  13: "そのとき、人々[ひとびと]は子供[こども]たちをイエスのもとへ連[つ]れて来[き]て、手[て]を置[お]いて祈[いの]ってくださるように願[ねが]った。弟子[でし]たちは彼[かれ]らを叱[しか]った。"
  14: "イエスは言[い]われた。「<j>子供[こども]たちを邪魔[じゃま]してはならない。わたしのもとへ来[こ]させなさい。天[てん]の国[くに]は、こういう者[もの]たちのものだからだ。</j>」"
  15: "イエスは彼[かれ]らに手[て]を置[お]いてから、そこを立[た]ち去[さ]られた。"
  16: "すると、一人[ひとり]の者[もの]が近[ちか]づいて来[き]て言[い]った。「先生[せんせい]、永遠[えいえん]の命[いのち]を得[え]るには、どんな善[よ]いことをすればよいのでしょうか。」"
  17: "イエスは言[い]われた。「<j>なぜ、わたしを『善[よ]い』と言[い]うのか。善[よ]い者[もの]は神[かみ]おひとりのほかにいない。命[いのち]に入[はい]りたいのなら、掟[おきて]を守[まも]りなさい。</j>」"
  18: "「どの戒[いまし]めでしょうか」と彼[かれ]が問[と]うと、イエスは言[い]われた。「<j>『殺[ころ]すな』『姦淫[かんいん]するな』『盗[ぬす]むな』『偽証[ぎしょう]するな』</j>"
  19: "<j>『父[ちち]と母[はは]を敬[うやま]え』、また『隣人[りんじん]を自分[じぶん]のように愛[あい]せよ』である。</j>」"
  20: "若者[わかもの]は言[い]った。「そのようなことはみな、子供[こども]の時[とき]から守[まも]ってきました。まだ何[なに]が足[た]りないのでしょうか。」"
  21: "イエスは言[い]われた。「<j>完全[かんぜん]な者[もの]になりたいのなら、持[も]ち物[もの]をすべて売[う]り、その金[かね]を貧[まず]しい人[ひと]たちに分[わ]けなさい。そうすれば天[てん]に宝[たから]を蓄[たくわ]えることになる。そして、わたしの後[あと]について来[き]なさい。</j>」"
  22: "若者[わかもの]はこの言葉[ことば]を聞[き]いて、悲[かな]しみながら去[さ]って行[い]った。多[おお]くの財産[ざいさん]を持[も]っていたからである。"
  23: "イエスは弟子[でし]たちに言[い]われた。「<j>はっきりあなたがたに言[い]っておく。富[とみ]のある者[もの]が天[てん]の国[くに]に入[はい]るのは難[むずか]しい。</j>"
  24: "<j>もう一度[いちど]言[い]う。金持[かねも]ちが神[かみ]の国[くに]に入[はい]るよりも、らくだが針[はり]の穴[あな]を通[とお]るほうがまだやさしい。</j>」"
  25: "弟子[でし]たちはこれを聞[き]いて、ひどく驚[おどろ]いて言[い]った。「それでは、だれが救[すく]われるのでしょうか。」"
  26: "イエスは彼[かれ]らを見[み]つめて言[い]われた。「<j>人[ひと]にはできないが、神[かみ]には何[なん]でもできる。</j>」"
  27: "そこで、ペトロが言[い]った。「このとおり、わたしたちは何[なに]もかも捨[す]ててあなたに従[したが]って参[まい]りました。それで、わたしたちはどうなるのでしょうか。」"
  28: "イエスは言[い]われた。「<j>はっきりあなたがたに言[い]っておく。わたしに従[したが]って来[き]たあなたがたは、すべてのものが生[う]まれ変[か]わる時[とき]、人[ひと]の子[こ]がその栄光[えいこう]の座[ざ]に着[つ]くとき、十二[じゅうに]の座[ざ]に着[つ]いて、イスラエルの十二[じゅうに]の部族[ぶぞく]を裁[さば]くのである。</j>"
  29: "<j>わたしの名[な]のゆえに、家[いえ]や兄弟[きょうだい]、姉妹[しまい]、父[ちち]、母[はは]、〔妻[つま]、〕子[こ]ども、畑[はたけ]を手放[てばな]した者[もの]は、だれでも百倍[ひゃくばい]のものを受[う]け取り、永遠[えいえん]の命[いのち]を受け継[つ]ぐのである。</j>"
  30: "<j>だが、先[さき]に立[た]つ多[おお]くの者[もの]は後[あと]ろへ回[まわ]り、後[あと]ろの者[もの]が先[さき]へ出[で]る。</j>」"

notes:
  9: "Церковь читает и вторую половину: καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται (jp-joc: 出されたる婦を娶る者も…). В критической базе её нет — добавление в 〔〕. παρεκτὸς λόγου πορνείας — «кроме слова блудного», т.е. кроме измены."
  12: "εὐνοῦχοι — «скопцы»; передал прямым 宦官, не сглаживая и не заменяя иносказанием, как и jp-joc (閹者). Три разряда перечислены без толкования."
  17: "В критической базе τί με ἐρωτᾷς περὶ τοῦ ἀγαθοῦ; εἷς ἐστιν ὁ ἀγαθός. Церковь (Елизаветинская, jp-joc 何ぞ我を善と稱ふる…獨り神より外に善なる者なし) читает τί με λέγεις ἀγαθόν; οὐδεὶς ἀγαθός… — взято церковное чтение, как в Мк 10:18."
  28: "παλιγγενεσία — «возрождение/обновление»; оставил «всё рождается заново», не сужая до одного смысла. θρόνου δόξης — «престол славы»."
  29: "Церковь добавляет γυναῖκα (jp-joc: 妻) в перечне; в критической базе нет — 〔妻〕."
