verses:
  1: "ダビデの賛歌[さんか]。いと高[たか]き者[もの]の助[たす]けのうちに住[す]む者[もの]は、天[てん]の神[かみ]の陰[かげ]の下[した]に宿[やど]る。"
  2: "その人[ひと]は主[しゅ]に言[い]う。「あなたはわたしの逃[に]げ場[ば]、わたしの砦[とりで]、わたしの神[かみ]。この方[かた]にわたしは寄[よ]り頼[たの]む」と。"
  3: "主[しゅ]は、狩人[かりうど]の罠[わな]から、災[わざわ]いをもたらす言葉[ことば]から、あなたを救[すく]い出[だ]される。"
  4: "主[しゅ]はその背[せな]の陰[かげ]であなたを覆[おお]い、あなたはその翼[つばさ]の下[した]に身[み]を寄[よ]せる。その真実[しんじつ]は武具[ぶぐ]となってあなたを囲[かこ]む。"
  5: "あなたは夜[よる]の恐[おそ]れにも、昼[ひる]に飛[と]んでくる矢[や]にも、"
  6: "暗[くら]やみを行[ゆ]く災[わざわ]いにも、不意[ふい]に襲[おそ]う災[わざわ]いにも、真昼[まひる]に荒[あ]らす悪[あく]霊[れい]にも、恐[おそ]れることはない。"
  7: "あなたの側[かたわ]らでは千[せん]人[にん]が、あなたの右[みぎ]では万[まん]人[にん]が倒[たお]れる。しかし、それはあなたに近[ちか]づかない。"
  8: "ただ、あなたは目[め]を凝[こ]らして見[み]、罪[つみ]人[びと]の報[むく]いを見[み]るだけである。"
  9: "主[しゅ]よ、あなたはわたしの望[のぞ]みである。あなたは至高[しこう]の者[もの]を、あなたの逃[に]げ場[ば]とされた。"
  10: "災[わざわ]いはあなたに近[ちか]づかず、災[わざわ]いの鞭[むち]もあなたの住[す]まいに及[およ]ばない。"
  11: "主[しゅ]はあなたのために天使[てんし]たちに命[めい]じて、あなたのすべての道[みち]であなたを守[まも]らせる。"
  12: "彼[かれ]らは手[て]であなたを運[はこ]び、あなたの足[あし]が石[いし]につまずかないようにする。"
  13: "あなたは蝮[まむし]と毒蛇[どくじゃ]を踏[ふ]み、獅子[しし]と大蛇[だいじゃ]を踏[ふ]みにじる。"
  14: "「その人[ひと]はわたしに寄[よ]り頼[たの]んだので、わたしは彼[かれ]を救[すく]い出[だ]す。彼[かれ]はわたしの名[な]を知[し]ったので、わたしは彼[かれ]を覆[おお]う。"
  15: "彼[かれ]がわたしを呼[よ]べば、わたしは答[こた]える。苦難[くなん]のうちでわたしは彼[かれ]とともにあり、彼[かれ]を救[すく]い出[だ]して栄光[えいこう]を与[あた]える。"
  16: "わたしは長[なが]い日[ひ]々[び]で彼[かれ]を満[み]たし、わたしの救[すく]いを彼[かれ]に示[しめ]す」。"

notes:
  1: "Надписание (прежний ст. 0, влит в этот стих): Αἶνος ᾠδῆς τῷ Δαυιδ — «Хвала песни Давиду»; 賛歌[さんか], как в Пс 47 и 94. Надписание влито в ст. 1. Стих: ὁ κατοικῶν ἐν βοηθείᾳ τοῦ ὑψίστου — いと高き者の助けのうちに住む者は (κατοικέω — «обитать»; ὕψιστος — いと高き者, как по корпусу). ἐν σκέπῃ τοῦ θεοῦ τοῦ οὐρανοῦ αὐλισθήσεται — 天の神の陰の下に宿る (σκέπη — «кров, защита»; αὐλίζομαι — «ночевать, вселяться»; слав. «в крове Бога небеснаго водворится»)."
  2: "ἐρεῖ τῷ κυρίῳ — その人は主に言う (вводит речь человека — 「」). Ἀντιλήμπτωρ μου εἶ καὶ καταφυγή μου — あなたはわたしの逃げ場、わたしの砦 (ἀντιλήμπτωρ — «заступник»; καταφυγή — 逃げ場). ὁ θεός μου, ἐλπιῶ ἐπ᾿ αὐτόν — わたしの神、この方にわたしは寄り頼む (ἐλπίζω — 寄り頼む, как по корпусу; в греч. третье лицо «на Него»)."
  3: "αὐτὸς ῥύσεταί με ἐκ παγίδος θηρευτῶν — 主は狩人の罠から…あなたを救い出される (παγίς — «сеть, петля»; θηρευτής — «ловчий»; в греч. модуле με «меня», церковное чтение σε «тебя» — по слав., Синодальному и jp-joc). ἀπὸ λόγου ταραχώδους — 災いをもたらす言葉から (ταραχώδης — «смутный, мятежный»)."
  4: "ἐν τοῖς μεταφρένοις αὐτοῦ ἐπισκιάσει σοι — 主はその背の陰であなたを覆い (μετάφρενον — «хребет, плечи»; ἐπισκιάζω — «осенять»). ὑπὸ τὰς πτέρυγας αὐτοῦ ἐλπιεῖς — あなたはその翼の下に身を寄せる (πτέρυξ — 翼). ὅπλῳ κυκλώσει σε ἡ ἀλήθεια αὐτοῦ — その真実は武具となってあなたを囲む (ὅπλον — «оружие, броня»; κυκλόω — «окружать»)."
  5: "οὐ φοβηθήσῃ ἀπὸ φόβου νυκτερινοῦ — あなたは夜の恐れにも…恐れることはない (φοβηθήσῃ — будущее, передано общим отрицанием в 5–6). ἀπὸ βέλους πετομένου ἡμέρας — 昼に飛んでくる矢にも (βέλος — «стрела»; πέτομαι — «летать»)."
  6: "ἀπὸ πράγματος διαπορευομένου ἐν σκότει — 暗やみを行く災いにも (πρᾶγμα — «вещь, дело»; σκότος — «тьма»). ἀπὸ συμπτώματος — 不意に襲う災いにも (σύμπτωμα — «падение, напасть»; слав. «от сряща»). δαιμονίου μεσημβρινοῦ — 真昼に荒らす悪霊にも (δαιμόνιον — 悪霊, как по корпусу; μεσημβρινός — «полуденный»)."
  7: "πεσεῖται ἐκ τοῦ κλίτους σου χιλιάς — あなたの側らでは千人が倒れる (κλίτος — «бок, сторона»). μυριὰς ἐκ δεξιῶν σου — あなたの右では万人が (μυριάς — «десятки тысяч, тьма»; jp-joc 萬人). πρὸς σὲ δὲ οὐκ ἐγγιεῖ — しかし、それはあなたに近づかない."
  8: "πλὴν τοῖς ὀφθαλμοῖς σου κατανοήσεις — ただ、あなたは目を凝らして見 (κατανοέω — «внимательно смотреть»). ἀνταπόδοσιν ἁμαρτωλῶν ὄψῃ — 罪人の報いを見るだけである (ἀνταπόδοσις — «воздаяние»)."
  9: "ὅτι σύ, κύριε, ἡ ἐλπίς μου — 主よ、あなたはわたしの望みである (ἐλπίς — 望み). τὸν ὕψιστον ἔθου καταφυγήν σου — あなたは至高の者を、あなたの逃げ場とされた (τίθημι — «полагать»; 2-е лицо сохранено)."
  10: "οὐ προσελεύσεταί πρὸς σὲ κακά — 災いはあなたに近づかず (κακός — «зло»). μάστιξ οὐκ ἐγγιεῖ τῷ σκηνώματί σου — 災いの鞭もあなたの住まいに及ばない (μάστιξ — «бич, язва»; σκήνωμα — «жилище»)."
  11: "τοῖς ἀγγέλοις αὐτοῦ ἐντελεῖται περὶ σοῦ — 主はあなたのために天使たちに命じて (ἐντέλλομαι — «заповедать»). τοῦ διαφυλάξαι σε ἐν πάσαις ταῖς ὁδοῖς σου — あなたのすべての道であなたを守らせる (διαφυλάσσω — «охранять»)."
  12: "ἐπὶ χειρῶν ἀροῦσίν σε — 彼らは手であなたを運び (αἴρω — «поднимать, нести»). μήποτε προσκόψῃς πρὸς λίθον τὸν πόδα σου — あなたの足が石につまずかないようにする (προσκόπτω — «спотыкаться»)."
  13: "ἐπ᾿ ἀσπίδα καὶ βασιλίσκον ἐπιβήσῃ — あなたは蝮と毒蛇を踏み (ἀσπίς — «аспид»; βασιλίσκος — «василиск», мифический змей; передано обобщённо, как у jp-joc). καταπατήσεις λέοντα καὶ δράκοντα — 獅子と大蛇を踏みにじる (καταπατέω — «попирать»; δράκων — «дракон, змей»)."
  14: "ὅτι ἐπ᾿ ἐμὲ ἤλπισεν — その人はわたしに寄り頼んだ. С 14-го стиха говорит Бог (в тексте это не вводится, но меняется говорящий) — слова Бога в 「」. ῥύσομαι αὐτόν — わたしは彼を救い出す. σκεπάσω αὐτόν — わたしは彼を覆う (σκεπάζω — «покрывать»). ἔγνω τὸ ὄνομά μου — 彼はわたしの名を知った."
  15: "ἐπικαλέσεταί με, καὶ εἰσακούσομαι αὐτοῦ — 彼がわたしを呼べば、わたしは答える (εἰσακούω — «услышать»). μετ᾿ αὐτοῦ εἰμι ἐν θλίψει — 苦難のうちでわたしは彼とともにあり (θλῖψις — 苦難). ἐξελοῦμαι καὶ δοξάσω αὐτόν — 彼を救い出して栄光を与える (ἐξαιρέω — «избавлять»; δοξάζω — «прославлять»)."
  16: "μακρότητα ἡμερῶν ἐμπλήσω αὐτόν — わたしは長い日々で彼を満たし (μακρότης — «долгота»). δείξω αὐτῷ τὸ σωτήριόν μου — わたしの救いを彼に示す (σωτήριον — 救い). Речь Божия закрывается 」."
