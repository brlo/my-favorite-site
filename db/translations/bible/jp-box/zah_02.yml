# jp-box, Захария, глава 2. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной.
# Граница глав 1/2: здесь 13 стихов по слав.; это gr 2:5–17. Четыре стиха gr 2:1–4
# (рога и плотники) стоят в слав. 1:18–21 и здесь не повторяются. Наш 2:1 = gr 2:5.
# Язык — современный 常体; 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1–2 муж с землемерной вервью идёт измерять Иерусалим; 3–4 Ангел велит
# возвестить юноше, что город населится множеством людей и скота; 5 Господь — огненная
# стена и слава посреди него; 6–7 бегство из северной земли, спасение Сиона;
# 8–9 посланный Господом, зеница ока, добыча рабам; 10–12 «ликуй, дщерь Сиона»,
# народы прибегут, Господь наследует Иуду; 13 «да благоговеет всякая плоть».
# Голоса: 1–4 рассказ и диалог (речь Ангела в 「…» с поручением в 『…』); 5–7 слово
# Господа в 「…» с рефренами «говорит Господь» внутри; 8–9 «так говорит Господь»
# вне кавычек + 「…»; 10–13 слово Господа в 「…» (в 13 заключительный призыв).
# Термины: 測[はか]り縄[なわ] — σχοινίον γεωμετρικόν; 火[ひ]の壁[かべ] — τεῖχος πυρός;
# 嗣業[しぎょう] — κληρονομία; 聖[せい]なる雲[くも] — νεφέλαι ἅγιαι.
#
tr_code: jp-box
book: zah
chapter: 2
draft: true

verses:
  1: "わたしは目[め]を上[あ]げて見[み]た。見[み]よ、一人[ひとり]の男[ひと]がいて、その手[て]に測[はか]り縄[なわ]があった。"
  2: "わたしは言[い]った。「どこへ行[い]くのですか。」彼はわたしに言[い]った。「エルサレムを測[はか]り、その幅[はば]がどれほどで、長[なが]さがどれほどであるかを見[み]るためである。」"
  3: "見[み]よ、わたしのうちに語[かた]る天使[てんし]が出[で]て行[い]き、ほかにもう一人[ひとり]の天使[てんし]が彼に会[あ]いに出[で]た。"
  4: "彼はこの者[もの]に言[い]った。「急[いそ]いで行[い]き、あの若者[わかもの]に言[い]え。『エルサレムは、その中[なか]の多[おお]くの人[ひと]と家畜[かちく]のゆえに、豊[ゆた]かに住[す]む者[もの]で満[み]ちる』」と。"
  5: "「わたしはその周[まわ]りに火[ひ]の壁[かべ]となり、その中[なか]で栄光[えいこう]となる、と主[しゅ]は言[い]われる。"
  6: "さあ、さあ、北[きた]の地[ち]から逃[に]げよ、と主[しゅ]は言[い]われる。わたしはあなたがたを天[てん]の四[よっ]つの風[かぜ]から集[あつ]めるからである、と主[しゅ]は言[い]われる。"
  7: "シオンよ、バビロンの娘[むすめ]のもとに住[す]む者[もの]よ、救[すく]われよ。」"
  8: "万軍[ばんぐん]の主[しゅ]はこう言[い]われる。「栄光[えいこう]のために、主は、あなたがたを奪[うば]った民[たみ]たちのもとへわたしを遣[つか]わされた。あなたがたに触[ふ]れる者[もの]は、主の目[め]の瞳[ひとみ]に触[ふ]れる者だからである。"
  9: "見[み]よ、わたしは彼らの上[うえ]に手[て]を挙[あ]げる。彼らは自分[じぶん]に仕[つか]える者[もの]たちの獲物[えもの]となる。あなたがたは、万軍[ばんぐん]の主[しゅ]がわたしを遣[つか]わしたことを知[し]るであろう。」"
  10: "「シオンの娘[むすめ]よ、喜[よろこ]び、楽[たの]しめ。見[み]よ、わたしは来[き]て、あなたの中[なか]に住[す]む、と主[しゅ]は言[い]われる。"
  11: "その日[ひ]、多[おお]くの民[たみ]が主[しゅ]に帰[かえ]り、わたしの民[たみ]となる。彼らはあなたの中[なか]に住[す]む。あなたは、万軍[ばんぐん]の主[しゅ]がわたしをあなたに遣[つか]わしたことを知[し]るであろう。"
  12: "主[しゅ]はユダを、聖[せい]なる地[ち]におけるご自分[じぶん]の嗣業[しぎょう]として受[う]け継[つ]がれ、再[ふたた]びエルサレムを選[えら]ばれる。"
  13: "すべての肉[にく]なる者[もの]は、主[しゅ]の前[まえ]に慎[つつし]み恐[おそ]れよ。主[しゅ]はその聖[せい]なる雲[くも]から起[お]ち上[あ]がられたからである。」"

notes:
  1: "Слав. 2:1 = gr 2:5 (после четырёх рогов, см. гл. 1): ἀνὴρ… σχοινίον γεωμετρικόν — «муж… землемерная вервь»; слав. «уже землемерно» — вервь, не наречие."
  2: "Διαμετρῆσαι… πηλίκον — «измерить… какова»; слав. «размерити»."
  3: "ἄγγελος ἕτερος — «другой Ангел»; εἱστήκει — «стоял»."
  4: "Δρὰμε — «беги» (слав. «тецы»); νεανίαν — «юноша»; Κατακάρπως κατοικηθήσεται — «плодовито населится»; слав. «от множества человеков и скотов»."
  5: "τεῖχος πυρὸς κυκλόθεν — «стена огненная вокруг»; εἰς δόξαν ἔσομαι — «в славу буду»."
  6: "ὦ ὦ φεύγετε — «о, о, бегите» (двойной зов); ἐκ τῶν τεσσάρων ἀνέμων συνάξω ὑμᾶς — «от четырёх ветров соберу вас» (слав.; в ru «рассеял» — МТ, не внесено)."
  7: "εἰς Σιων ἀνασῴζεσθε — «в Сион спасайтесь»; οἱ κατοικοῦντες θυγατέρα Βαβυλῶνος — «живущие у дочери Вавилона»."
  8: "Ὀπίσω δόξης ἀπέσταλκέν με — «за славою послал Меня» (слав. «вслед славы»); κόρης τοῦ ὀφθαλμοῦ — «зеница ока». Смена лица («послал Меня») — как в тексте, не сглажена."
  9: "ἐπιφέρω τὴν χεῖρά μου — «наношу руку Мою»; σκῦλα τοῖς δουλεύουσιν — «добыча служащим им»."
  10: "τέρπου καὶ εὐφραίνου — «ликуй и веселись»; κατασκηνώσω ἐν μέσῳ σου — «поселюсь посреди тебя»."
  11: "καταφεύξονται ἔθνη πολλά — «прибегут народы многие»; εἰς λαόν — «в народ»."
  12: "κατακληρονομήσει… τὴν μερίδα αὐτοῦ — «получит в наследие удел Свой»; γῆν τὴν ἁγίαν — «земля святая»."
  13: "εὐλαβείσθω πᾶσα σάρξ — «да благоговеет всякая плоть» (слав.; в ru «да молчит» — МТ, не внесено); ἐκ νεφελῶν ἁγίων — «из облаков святых» (слав.; в ru «от святого жилища» — МТ, не внесено)."
