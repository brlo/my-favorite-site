# jp-box, Есфирь, глава 9. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для Есфири нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 9: страх на врагов (1–4), избиение врагов (5–6), пятьсот мужей и десять
# сыновей Амана в Сузах (7–10), число убитых, просьба Есфири и четырнадцатый день
# (11–16), празднование (17–19), установление Пурима (20–28), письма и запись (29–31).
# Прямая речь: царь (12) и Есфирь (13). Красного и синего нет.
# Нумерация — славяно-синодальная (csl): 31 стих. Карта: прежний 9:3 разделён по
# слав. границе на 9:3 (csl 9:3) и 9:4 (csl 9:4); наш 9:5 = csl 9:5; прежний 9:5
# в слав. отсутствует (csl 9:5 = гр. 9:4), поэтому он соединён с прежним 9:6
# в одном ст. 9:6; далее 9:7–9:28 совпадают с csl; наш 9:29 = LXX 9:29 + 9:30
# (в слав. стиха 9:30 нет: csl 9:29 = только «И написа есфирь царица…»), оба
# соединены в 9:29; наш 9:30 = csl 9:30, наш 9:31 = csl 9:31.
# Особенность модуля: gr 9:5 и 9:30 стоят как «.» — текст потерян (дефект модуля);
# оба восстановлены по ru (церковный текст LXX) без 〔…〕, в слав. им соответствия нет.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).

