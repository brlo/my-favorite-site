verses:
  1: "第十二[だいじゅうに]の月[つき]、すなわちアダルの月の十三日[じゅうさんにち]に、王[おう]によって書[か]かれた文書[ぶんしょ]が届[とど]いたのである。"
  2: "その同[おな]じ日[ひ]に、ユダヤ人[じん]に敵対[てきたい]する者[もの]たちは滅[ほろ]びた。彼[かれ]らを恐[おそ]れて、だれも立[た]ち向[む]かわなかったからである。"
  3: "というのは、太守[たいしゅ]たちの長[かしら]たちも、権力者[けんりょくしゃ]たちも、王[おう]の書記[しょき]たちもユダヤ人[じん]を敬[うやま]ったのである。"
  4: "モルデカイへの恐[おそ]れが彼[かれ]らに迫[せま]っていたからである。"
  5: "王[おう]の命令[めいれい]が下[くだ]って、彼[かれ]の名[な]が王国全体[おうこくぜんたい]で呼[よ]ばれるようになったからである。"
  6: "ユダヤ人[じん]はすべての敵[てき]を撃[う]ち、剣[けん]にかけて殺[ころ]し、滅[ほろ]ぼし尽[つ]くして、自分[じぶん]たちを憎[にく]む者[もの]たちに対して自分たちの望[のぞ]むままに振[ふ]る舞[ま]った。スサの都[みやこ]でも、ユダヤ人[じん]は五百人[ごひゃくにん]の男[おとこ]を殺[ころ]した。"
  7: "すなわち、ファルサンネスタイン、デルフォン、ファスガ、"
  8: "ファルダタ、バレア、サルバカ、"
  9: "マルマシマ、アルファイオン、アルサイオン、ザブタイタン、"
  10: "ユダヤ人[じん]は、その敵[てき]であるアマダトの子[こ]、ブガイ人でファルマフェアの者[もの]であるアマンの十人[じゅうにん]の息子[むすこ]たちを殺[ころ]した。そして、その日[ひ]、ユダヤ人は彼[かれ]らの財産[ざいさん]を略奪[りゃくだつ]した。"
  11: "その同[おな]じ日[ひ]に、スサで滅[ほろ]ぼされた者[もの]の数[かず]が王[おう]に報告[ほうこく]された。"
  12: "そこで王[おう]はエステルに言[い]った。「ユダヤ人[じん]はスサの都[みやこ]で五百人[ごひゃくにん]の男[おとこ]を滅[ほろ]ぼした。地方[ちほう]では、彼[かれ]らがどれほどの者[もの]を滅ぼしたと思[おも]うか。それで、ほかに何[なに]を願[ねが]うのか。それはかなえられる。」"
  13: "エステルは王[おう]に言[い]った。「ユダヤ人[じん]に、明日[あした]も同[おな]じように行[おこな]って、アマンの十人[じゅうにん]の息子[むすこ]たちを吊[つ]るすことをお許[ゆる]しください。」"
  14: "王[おう]はそうすることを許[ゆる]し、都[みやこ]のユダヤ人[じん]に、アマンの息子[むすこ]たちの死体[したい]を都の外[そと]で吊[つ]るすよう命[めい]じた。"
  15: "スサのユダヤ人[じん]はアダルの十四日[じゅうよっか]に集[あつ]まり、三百人[さんびゃくにん]の男[おとこ]を殺[ころ]したが、何[なに]も略奪[りゃくだつ]しなかった。"
  16: "王国[おうこく]のほかのユダヤ人[じん]たちは集[あつ]まり、自分[じぶん]の身[み]を助[たす]けて、敵[てき]から安[やす]らかになった。彼[かれ]らはアダルの十三日[じゅうさんにち]に、敵のうち一万五千人[いちまんごせんにん]を滅[ほろ]ぼしたが、何[なに]も略奪[りゃくだつ]しなかった。"
  17: "そして、同[おな]じ月[つき]の十四日[じゅうよっか]に安[やす]らかになり、その日[ひ]を喜[よろこ]びと楽[たの]しみの休[やす]みの日として過[す]ごした。"
  18: "スサの都[みやこ]のユダヤ人[じん]は、十四日[じゅうよっか]にも集[あつ]まったが、休[やす]まなかった。そして十五日[じゅうごにち]を喜[よろこ]びと楽[たの]しみをもって過[す]ごした。"
  19: "それゆえ、外[そと]のすべての地方[ちほう]に散[ち]らされているユダヤ人[じん]は、アダルの十四日[じゅうよっか]を、それぞれ隣人[りんじん]に贈[おく]り物[もの]を送[おく]りながら、楽[たの]しみの良[よ]い日として過[す]ごす。また、主[おも]な都[みやこ]に住[す]む者[もの]は、アダルの十五日[じゅうごにち]も、隣人に贈り物を送りながら、良い喜[よろこ]びの日として過ごす。"
  20: "モルデカイはこれらの言葉[ことば]を書物[しょもつ]に書[か]き記[しる]し、アルタシャスタの王国[おうこく]にいるすべてのユダヤ人[じん]、近[ちか]い者[もの]にも遠[とお]い者にも送[おく]った。"
  21: "すなわち、これらの日[ひ]を定[さだ]めて、アダルの十四日[じゅうよっか]と十五日[じゅうごにち]を良[よ]い日として祝[いわ]うこと、"
  22: "これらの日[ひ]にユダヤ人[じん]は敵[てき]から安[やす]らかになったからである。また、彼[かれ]らの悲[かな]しみが喜[よろこ]びに、苦[くる]しみが良[よ]い日に変[か]えられた月[つき]、すなわちアダルの月を、祝宴[しゅくえん]と喜びの良い日々[ひび]として月の全体[ぜんたい]にわたって過[す]ごし、友人[ゆうじん]にも貧[まず]しい者[もの]にも贈[おく]り物[もの]を送[おく]るのである。"
  23: "ユダヤ人[じん]は、モルデカイが彼[かれ]らに書[か]いたとおりに受[う]け入[い]れた。"
  24: "すなわち、アマダトの子[こ]でマケドニア人[じん]であるアマンが、どのように彼[かれ]らと戦[たたか]い、彼らを滅[ほろ]ぼすために決議[けつぎ]とくじを定[さだ]めたか、"
  25: "また、モルデカイを吊[つ]るすようにと言[い]って王[おう]のところへ入[はい]ったとき、彼[かれ]がユダヤ人[じん]に及[およ]ぼそうとしたすべての悪[あく]は彼自身[かれじしん]に及んで、彼もその子供[こども]たちも吊るされた。"
  26: "それゆえ、これらの日[ひ]は、くじのゆえにプリムと呼[よ]ばれた。彼[かれ]らの言葉[ことば]でくじはプリムと呼ばれるからである。この書簡[しょかん]の言葉のゆえに、また、これらのことのゆえに彼らが受[う]けたこと、また彼らに起[お]こったことのゆえに、"
  27: "モルデカイはこれを定[さだ]め、ユダヤ人[じん]は、自分[じぶん]たちとその子孫[しそん]、また自分たちに加[くわ]えられる者[もの]たちのために、これを固[かた]く受[う]け入[い]れた。すなわち、彼[かれ]らは決[けっ]して別[べつ]のようには行[おこな]わない。これらの日[ひ]は、代々[よよ]、町[まち]ごと、氏族[しぞく]ごと、地方[ちほう]ごとに行われる記念[きねん]となるのである。"
  28: "これらのプリムの日[ひ]は、すべての時代[じだい]にわたって祝[いわ]われ、その記念[きねん]は代々[よよ]の者[もの]たちから決[けっ]して絶[た]えることはない。"
  29: "王妃[おうひ]エステル、アミナダブの娘[むすめ]、およびユダヤ人[じん]モルデカイは、彼[かれ]らが行[おこな]ったことすべてと、プリムの書簡[しょかん]を確[たし]かにすることを書[か]き記[しる]した。アルタシャスタの王国[おうこく]の百二十七[ひゃくにじゅうなな]の地方[ちほう]にいるすべてのユダヤ人[じん]に、平和[へいわ]と真実[しんじつ]の言葉[ことば]をもって手紙[てがみ]を送[おく]った。"
  30: "モルデカイと王妃[おうひ]エステルは、自分[じぶん]たちのために、自分たちの上[うえ]にこれを定[さだ]め、そのとき、自分たちの断食[だんじき]と自分たちの計画[けいかく]についても定めた。"
  31: "そしてエステルは、言葉[ことば]をもってこれを永遠[とこしえ]に定[さだ]めた。そしてそれは記念[きねん]として書[か]き記[しる]された。"

notes:
  1: "Ἐν γὰρ τῷ δωδεκάτῳ μηνὶ τρισκαιδεκάτῃ τοῦ μηνός — «в двенадцатый месяц, в тринадцатый день месяца» (ἐν с дативом времени); γάρ связывает с концом гл. 8, в тексте передано のである. ὅς ἐστιν Αδαρ — «который есть Адар», пояснение месяца (アダル). παρῆν τὰ γράμματα τὰ γραφέντα ὑπὸ τοῦ βασιλέως — «пришли письма, написанные царём» (πάρειμι — «быть при, приходить»; γράμματα — «письма, грамота»); слав. «приидоша писания от царя». Син. здесь даёт пространное чтение с евр. («в который пришло время исполниться повелению…») — в LXX/слав. его нет, в текст не внесено."
  2: "ἐν αὐτῇ τῇ ἡμέρᾳ — «в тот самый день». ἀπώλοντο οἱ ἀντικείμενοι τοῖς Ιουδαίοις — «погибли противящиеся Иудеям» (ἀπόλλυμι — «губить»; ἀντίκειμαι — «противолежать, противиться»). οὐδεὶς γὰρ ἀντέστη φοβούμενος αὐτούς — «ибо никто не воспротивился, боясь их» (ἀνθίστημι). Син. 9:2 передаёт евр. текст о сборе Иудеев в городах — это иное чтение, не LXX; держимся LXX и слав."
  3: "οἱ ἄρχοντες τῶν σατραπῶν — «начальники сатрапов» (太守たちの長たち); слав. «началствующии странам». οἱ τύραννοι — «властители, правители» (τύραννος здесь не обязательно «тиран»), 権力者たち. οἱ βασιλικοὶ γραμματεῖς — «царские писцы» (γραμματεύς, 書記). ἐτίμων — «почитали» (τιμάω). Слав. делит прежний стих на csl 9:3–9:4; здесь граница по слав.: 9:3 кончается на «почитаху иудей» («…ユダヤ人を敬ったのである»), вторая половина — в 9:4."
  4: "ὁ γὰρ φόβος Μαρδοχαίου ἐνέκειτο αὐτοῖς — «ибо страх Мардохея належал на них» (ἔγκειμαι — «лежать на, теснить»). Это вторая половина прежнего стиха (gr 9:3), по слав. делению — csl 9:4; грамматически продолжает 9:3 («…потому что»)."
  5: "προσέπεσεν γὰρ τὸ πρόσταγμα τοῦ βασιλέως ὀνομασθῆναι ἐν πάσῃ τῇ βασιλείᾳ — «ибо пришло повеление царя, чтобы он был именуем во всём царстве» (προσπίπτω — «припадать, приходить»; ὀνομάζω — «именовать»; πρόσταγμα — 命令). Слав. «приложися бо повеление царево именоватися ему по всему царствию»; csl 9:5 — этот стих."
  6: "Ст. 6 = LXX 9:5 + LXX 9:6. Первая часть (LXX 9:5) в gr-lxx-byz стоит как «.» — текст потерян (дефект модуля); восстановлена по ru (Синодальный, церковный текст LXX): «И избивали Иудеи всех врагов своих, побивая мечом, умерщвляя и истребляя, и поступали с неприятелями своими по своей воле», — поэтому 〔…〕 не ставится и стих не считается добавлением. В слав. этого стиха нет (csl 9:5 = гр. 9:4), поэтому по слав. нумерации он соединён со следующим: csl 9:6 = «И в сусех граде избиша иудее пять сот мужей». Тройное πληγῇ μαχαίρας καὶ ἀναιρέσει καὶ ἀπωλείᾳ передано 撃ち・剣にかけて殺し・滅ぼし尽くして. Вторая часть: καὶ ἐν Σούσοις τῇ πόλει ἀπέκτειναν … ἄνδρας πεντακοσίους — «и в Сузах, городе, убили пятьсот мужей» (ἀποκτείνω); слав. «в сусех граде… пять сот мужей». Далее 9:7–9 — перечень имён, 9:10 — их общее обозначение; сказуемое ἀπέκτειναν одно на все стихи."
  7: "τὸν τε Φαρσαννεσταιν καὶ Δελφων καὶ Φασγα — винительный падеж, продолжение списка убитых (сказуемое ἀπέκτειναν в 9:6); τε… καί связывает имена. Имена даны по LXX; слав. «Фарсана, нестанна и делфона, и фасгана» — иные огласовки и деление имён."
  8: "Φαρδαθα, Βαρεα, Σαρβαχα — продолжение списка; слав. «фардафана, вареа и сарвакана», с добавлением -н- в конце имён. Перечень имён идёт без сказуемого, как в греческом."
  9: "Μαρμασιμα, Αρουφαιον, Αρσαιον, Ζαβουθαιθαν — продолжение списка; слав. «мармасима и руфеа, и арсеа и завуфефама». В LXX десять имён (9:7–9), в 9:10 они названы сыновьями Амана; подстихов и добавлений здесь нет."
  10: "τοὺς δέκα υἱοὺς Αμαν Αμαδαθου Βουγαίου τοῦ ἐχθροῦ τῶν Ιουδαίων — «десять сыновей Амана, сына Амадафа, вугаинина, врага Иудеев»: винительный падеж, продолжение ἀπέκτειναν. καὶ διήρπασαν — «и разграбили»; слав. «и разграбиша в той день (имения их)» — добавления «в той день» и «имения их» внесены в текст по паритету. Син. с евр. читает «а на грабеж не простерли руки своей» — отрицания в LXX/слав. нет, поэтому 略奪した; ср. 9:15–16, где стоит οὐδὲν διήρπασαν. Слав. добавляет «иже от фармафеа» (ファルマフェアの者) — в LXX нет, внесено по паритету; точное место неясно, возможно искажение."
  11: "ἐν αὐτῇ τῇ ἡμέρᾳ — «в тот самый день». ἐπεδόθη ὁ ἀριθμὸς τῷ βασιλεῖ — «было подано число царю» (ἐπιδίδωμι — «подавать, представлять»); слав. «сказаша число избиенных царю». τῶν ἀπολωλότων ἐν Σούσοις — «погибших в Сузах» (ἀπόλλυμι)."
  12: "εἶπεν δὲ ὁ βασιλεὺς πρὸς Εσθηρ — вводит прямую речь (「…」). Ἀπώλεσαν … ἄνδρας πεντακοσίους — «погубили пятьсот мужей». ἐν δὲ τῇ περιχώρῳ πῶς οἴει ἐχρήσαντο; — «а в окрестной стране как, думаешь, поступили?» (οἴει — «думаешь»; χράομαι — «поступать»); слав. «колико, мниши, погубиша?» — «сколько, думаешь, погубили?» — по паритету в тексте csl (どれほどの者を滅ぼした), вариант LXX — в notes. τί οὖν ἀξιοῖς ἔτι καὶ ἔσται σοι; — «чего же ещё просишь? и будет тебе». Син. добавляет «и десятерых сыновей Амана» — в LXX этого нет."
  13: "Δοθήτω — импер. пасс. от δίδωμι, «да будет дано». χρῆσθαι ὡσαύτως τὴν αὔριον — «поступать так же завтра» (χράομαι; αὔριον — «завтра»). ὥστε τοὺς δέκα υἱοὺς κρεμάσαι Αμαν — «чтобы повесить десять сыновей Амана» (κρεμάννυμι — «вешать»); слав. «да повесят десять сынов амановых». Просьба передана お許しください (вежливая просьба, допустимая в 常体)."
  14: "ἐπέτρεψεν οὕτως γενέσθαι — «позволил так быть» (ἐπιτρέπω). ἐξέθηκε — «выставил, обнародовал» (ἐκτίθημι), т. е. дал распоряжение; отсюда 命じた. τοῖς Ιουδαίοις τῆς πόλεως — «Иудеям города». τὰ σώματα … κρεμάσαι — «повесить тела» (σῶμα). Слав. добавляет «вне града» — в LXX нет, внесено в текст по паритету (都の外で)."
  15: "συνήχθησαν — «собрались» (συνάγω). τῇ τεσσαρεσκαιδεκάτῃ τοῦ Αδαρ — «в четырнадцатый день Адара» (十四日). ἀπέκτειναν ἄνδρας τριακοσίους — «убили триста мужей». οὐδὲν διήρπασαν — «ничего не разграбили» (διαρπάζω); слав. совпадает. Слово «Сузы» в стихе уже было в 9:6, здесь повторено по греч."
  16: "οἱ λοιποὶ τῶν Ιουδαίων οἱ ἐν τῇ βασιλείᾳ — «остальные Иудеи, которые в царстве». ἑαυτοῖς ἐβοήθουν — «себе помогали» (βοηθέω). ἀνεπαύσαντο ἀπὸ τῶν πολεμίων — «успокоились от врагов» (ἀναπαύω). ἀπώλεσαν … μυρίους πεντακισχιλίους — «погубили пятнадцать тысяч» (μύριοι — десять тысяч, πεντακισχίλιοι — пять тысяч); слав. «пятьнадесять тысящ» — 15 000; Син. с евр. «семьдесят пять тысяч» — в текст не внесено. τῇ τρισκαιδεκάτῃ τοῦ Αδαρ — «в тринадцатый день Адара»."
  17: "ἀνεπαύσαντο τῇ τεσσαρεσκαιδεκάτῃ τοῦ αὐτοῦ μηνός — «успокоились в четырнадцатый день того же месяца». ἦγον αὐτὴν ἡμέραν ἀναπαύσεως — «проводили его как день покоя» (ἄγω — «проводить, праздновать»). μετὰ χαρᾶς καὶ εὐφροσύνης — «с радостью и веселием» (χαρά, εὐφροσύνη)."
  18: "οἱ ἐν Σούσοις … συνήχθησαν καὶ τῇ τεσσαρεσκαιδεκάτῃ καὶ οὐκ ἀνεπαύσαντο — «сущие в Сузах собрались и в четырнадцатый [день] и не успокоились». Слав. читает «и в четвертыйнадесять почиша» (без отрицания), что расходится и с LXX, и с контекстом (покой у них — 15-го), поэтому держимся LXX: 休まなかった. ἦγον δὲ καὶ τὴν πεντεκαιδεκάτην — «проводили и пятнадцатый [день]»."
  19: "οἱ διεσπαρμένοι ἐν πάσῃ χώρᾳ τῇ ἔξω — «рассеянные по всей стране внешней» (διασπείρω). ἄγουσιν τὴν τεσσαρεσκαιδεκάτην … ἡμέραν ἀγαθὴν μετ᾿ εὐφροσύνης — «проводят четырнадцатый день благий с веселием». ἀποστέλλοντες μερίδας ἕκαστος τῷ πλησίον — «посылая части каждый ближнему» (μερίς — «часть, доля»), отсюда 贈り物. οἱ κατοικοῦντες ἐν ταῖς μητροπόλεσιν — «живущие в митрополиях», т. е. в главных городах (μητρόπολις), 主な都. καὶ τὴν πεντεκαιδεκάτην … ἄγουσιν — «проводят и пятнадцатый [день]»."
  20: "Ἔγραψεν … εἰς βιβλίον — «написал в книгу/свиток» (βιβλίον), 書物. ἐξαπέστειλεν — «разослал» (ἐξαποστέλλω). ὅσοι ἦσαν ἐν τῇ Ἀρταξέρξου βασιλείᾳ — «сколько было в царстве Артаксеркса». τοῖς ἐγγὺς καὶ τοῖς μακράν — «близким и дальним» (ἐγγύς, μακράν)."
  21: "στῆσαι τὰς ἡμέρας ταύτας ἀγαθάς — «установить эти дни благими» (ἵστημι — «ставить, устанавливать»). ἄγειν τε τὴν τεσσαρεσκαιδεκάτην καὶ τὴν πεντεκαιδεκάτην τοῦ Αδαρ — «проводить четырнадцатый и пятнадцатый [день] Адара». Инфинитивы зависят от ἔγραψεν/ἐξαπέστειλεν (9:20); стих обрывается на «、», продолжение — в 9:22."
  22: "ἐν γὰρ ταύταις ταῖς ἡμέραις ἀνεπαύσαντο — «ибо в эти дни успокоились». τὸν μῆνα, ἐν ᾧ ἐστράφη αὐτοῖς … ἀπὸ πένθους εἰς χαρὰν καὶ ἀπὸ ὀδύνης εἰς ἀγαθὴν ἡμέραν — «месяц, в который обратилось им … из печали в радость и из боли в благой день» (στρέφω; πένθος — «плач, траур»; ὀδύνη — «боль»). ἄγειν ὅλον ἀγαθὰς ἡμέρας γάμων καὶ εὐφροσύνης — «проводить его весь как благие дни браков и веселия»; γάμοι — «брачные пиры, пиршества», в слав. этого слова нет («радости и веселия»), Син. «пиршества»; поэтому в тексте 祝宴, а не «свадьбы». ἐξαποστέλλοντας μερίδας τοῖς φίλοις καὶ τοῖς πτωχοῖς — «посылая части друзьям и нищим»."
  23: "προσεδέξαντο — «приняли» (προσδέχομαι). καθὼς ἔγραψεν αὐτοῖς ὁ Μαρδοχαῖος — «как написал им Мардохей». Слав. совпадает: «прияша иудее, якоже написа им мардохей»."
  24: "πῶς Αμαν Αμαδαθου ὁ Μακεδὼν ἐπολέμει αὐτούς — «как Аман, сын Амадафа, македонянин, воевал против них» (πολεμέω); слав. «македонянин», в евр. он «агагитянин», Син. «Вугеянин». καθὼς ἔθετο ψήφισμα καὶ κλῆρον ἀφανίσαι αὐτούς — «как положил постановление и жребий, чтобы истребить их» (τίθεμαι — «полагать»; ψήφισμα — «решение, постановление»; κλῆρος — «жребий», くじ; ἀφανίζω — «истреблять»)."
  25: "ὡς εἰσῆλθεν πρὸς τὸν βασιλέα λέγων κρεμάσαι τὸν Μαρδοχαῖον — «как он вошёл к царю, говоря: повесить Мардохея»: подлежащее — Аман. ὅσα δὲ ἐπεχεῖρησεν ἐπάξαι … κακά — «сколько же он ни замышлял навести зла» (ἐπιχειρέω — «предпринимать»; ἐπάγω — «наводить»). ἐπ᾿ αὐτὸν ἐγένοντο — «на него обратились». ἐκρεμάσθη αὐτὸς καὶ τὰ τέκνα αὐτοῦ — «повешен был он и дети его» (κρεμάννυμι). Син. передаёт евр. версию с Есфирью и новым письмом — в LXX иначе."
  26: "διὰ τοῦτο ἐπεκλήθησαν αἱ ἡμέραι αὗται Φρουραι — «потому названы дни эти Фрураи» (ἐπικαλέω), т. е. Пурим (プリム); евр. פורים. διὰ τοὺς κλήρους — «из-за жребиев» (κλῆρος, くじ). τῇ διαλέκτῳ αὐτῶν καλοῦνται Φρουραι — «на их наречии называются Фрураи» (διάλεκτος). διὰ τοὺς λόγους τῆς ἐπιστολῆς ταύτης — «ради слов этого письма» (ἐπιστολή, 書簡). καὶ ὅσα πεπόνθασιν … καὶ ὅσα αὐτοῖς ἐγένετο — «и что они претерпели… и что с ними произошло» (πάσχω, γίνομαι). Фраза продолжается в 9:27."
  27: "καὶ ἔστησεν — «и установил» (ἵστημι; подлежащее — Мардохей). προσεδέχοντο οἱ Ιουδαῖοι ἐφ᾿ ἑαυτοῖς καὶ ἐπὶ τῷ σπέρματι αὐτῶν — «принимали Иудеи на себя и на семя своё» (προσδέχομαι). ἐπὶ τοῖς προστεθειμένοις ἐπ᾿ αὐτῶν — «на присоединившихся к ним» (προστίθημι). οὐδὲ μὴν ἄλλως χρήσονται — «и не будут поступать иначе» (χράομαι). μνημόσυνον ἐπιτελούμενον κατὰ γενεὰν καὶ γενεὰν καὶ πόλιν καὶ πατριὰν καὶ χώραν — «память, совершаемая по роду и роду, и по городу, и по племени, и по области» (μνημόσυνον, ἐπιτελέω)."
  28: "αἱ ἡμέραι αὗται τῶν Φρουραι ἀχθήσονται εἰς τὸν ἅπαντα χρόνον — «дни эти Фрураи будут проводимы во всё время» (ἄγω, буд. пасс.; ἅπας — «весь»). τὸ μνημόσυνον αὐτῶν οὐ μὴ ἐκλίπῃ ἐκ τῶν γενεῶν — «память их не исчезнет из родов» (ἐκλείπω; усиленное οὐ μή). Слав. совпадает по смыслу."
  29: "Ст. 29 = LXX 9:29 + LXX 9:30. Первая часть: ἔγραψεν Εσθηρ ἡ βασίλισσα θυγάτηρ Αμιναδαβ — «написала Есфирь царица, дочь Аминадава»; в евр. отец Есфири — Авихаил, в LXX — Аминадав (アミナダブ). ὅσα ἐποίησαν — «что они сделали». τό τε στερέωμα τῆς ἐπιστολῆς τῶν Φρουραι — «и утверждение письма о Пуриме» (στερέωμα — «утверждение, подтверждение»); слав. «во утверждение епистолии о днех фурим». Вторая часть (LXX 9:30) в gr-lxx-byz стоит как «.» — текст потерян (дефект модуля); восстановлена по ru: «и послали письма ко всем Иудеям в сто двадцать семь областей царства Артаксерксова со словами мира и правды»; 〔…〕 не ставится. В слав. этого стиха нет (csl 9:29 — только первая часть), поэтому оба соединены в одном ст. 9:29; число областей (127) дано по ru."
  30: "καὶ Μαρδοχαῖος καὶ Εσθηρ ἡ βασίλισσα ἔστησαν ἑαυτοῖς καθ᾿ ἑαυτῶν — «и Мардохей и Есфирь царица постановили себе о себе» (ἵστημι; καθ᾿ ἑαυτῶν — «на себя»). τότε στήσαντες κατὰ τῆς ὑγιείας αὐτῶν καὶ τὴν βουλὴν αὐτῶν — «тогда постановив о здоровье/благополучии своём и совет свой»; ὑγίεια — «здоровье, благополучие», тёмное место. Слав. «в посте своем совет свой» — иное чтение (пост, вероятно νηστεία); по паритету принято церковное 断食; Син. «в дни пощения и воплей» (с евр.). csl 9:30 — этот стих."
  31: "καὶ Εσθηρ λόγῳ ἔστησεν εἰς τὸν αἰῶνα — «и Есфирь словом постановила в век» (λόγῳ — «словом»; εἰς τὸν αἰῶνα — «в век», 永遠に). ἐγράφη εἰς μνημόσυνον — «написано в память» (γράφω, μνημόσυνον). csl 9:31 — этот стих: «И есфирь слово постави во веки, и написано бысть в память»."
