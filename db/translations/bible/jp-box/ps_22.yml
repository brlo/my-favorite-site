verses:
  0: "ダビデの詩[うた]。"
  1: "主[しゅ]はわたしの牧者[ぼくしゃ]である。わたしは何[なに]も欠[か]かない。"
  2: "主[しゅ]はわたしを緑[みどり]の牧[まき]場[ば]に伏[ふ]させ、静[しず]かな水[みず]のそばに連[つ]れて行[い]き、わたしを養[やしな]う。"
  3: "主[しゅ]はわたしの魂[たましい]を立[た]ち返[かえ]らせ、その名[な]のために、義[ぎ]の道[みち]へわたしを導[みちび]く。"
  4: "たとえ、わたしが死[し]の陰[かげ]の谷[たに]を歩[あゆ]んでも、悪[わる]いことを恐[おそ]れない。あなたがわたしとともにおられるからである。あなたの杖[つえ]とあなたの支[ささ]えの棒[ぼう]とが、わたしを慰[なぐさ]める。"
  5: "あなたはわたしを苦[くる]しめる者[もの]たちの前[まえ]に、わたしのために食卓[しょくたく]を整[ととの]え、わたしの頭[あたま]に油[あぶら]を注[そそ]いで潤[うるお]し、あなたの杯[さかずき]は、最[もっと]も良[よ]いもののように、わたしを酔[よ]わせるほどに満[み]ちている。"
  6: "あなたの恵[めぐ]みは、わたしの命[いのち]の日[ひ]々[び]の間[あいだ]、わたしを追[お]いかける。わたしは主[しゅ]の家[いえ]に、長[なが]い日[ひ]々[び]の間[あいだ]、住[す]む。"

notes:
  0: "Ψαλμὸς τῷ Δαυιδ — ダビデの詩. Надписание — стих 0."
  1: "Κύριος ποιμαίνει με — 主はわたしの牧者である. οὐδέν με ὑστερήσει — 何も欠かない."
  2: "εἰς τόπον χλόης — 緑の牧場. ἐκεῖ με κατεσκήνωσεν — 伏させ (букв. «поселил»; пастушеский образ). ἐπὶ ὕδατος ἀναπαύσεως — 静かな水. ἐξέθρεψέν με — 養う."
  3: "ἐπέστρεψεν τὴν ψυχήν — 魂を立ち返らせ. τρίβους δικαιοσύνης — 義の道. ἕνεκεν τοῦ ὀνόματος — 名のために."
  4: "σκιὰ θανάτου — 死の陰. ῥάβδος καὶ βακτηρία — 杖と支えの棒. παρεκάλεσαν — 慰める."
  5: "τράπεζα ἐξ ἐναντίας — 前の食卓. ἐλίπανας ἐν ἐλαίῳ — 油を注いで潤し. ποτήριον μεθύσκον ὡς κράτιστον — 酔わせる杯、最良のもののように."
  6: "ἔλεος καταδιώξεταί με — 恵みが追いかける. οἶκος κυρίου — 主の家. εἰς μακρότητα ἡμερῶν — 長い日々の間."
