# jp-box, Притчи, глава 5. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для Притчей есть (гл. 4–6) — контроль церковного чтения;
# jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 5: вступление-обращение (1–2), предостережение от чужой жены: её мёд и горечь
# (3–6), увещание (7–8), цена распутства (9–11), речь кающегося (12–14),
# наставление о своей жене и источнике (15–19), запрет чужой (20),
# всё открыто Богу, грех уловляет (21–23).
# Прямая речь: кающийся в 5:12–14 — 「…」 (одна цитата); остальное — наставление,
# без кавычек.
# Нумерация по gr: 23 стиха (5:1–23; gr, csl-ru, ru и jp-joc дают здесь 23).
# Слав. 5:11 оканчивается «и речеши» (введение к речи
# 5:12) — по gr это начало 5:12; слав. 5:15 добавляет «Сыне» (в LXX нет).
# 5:16: в gr запрет (μὴ ὑπερεκχείσθω), в csl положительное чтение («да преизливаются»);
# принято csl, вариант LXX — в notes.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).

tr_code: jp-box
book: pr
chapter: 5
draft: true

verses:
  1: "わが子[こ]よ、わが知恵[ちえ]に心[こころ]を向[む]け、わが言葉[ことば]に耳[みみ]を傾[かたむ]けよ。"
  2: "良[よ]い思[おも]いを保[たも]つためである。わが唇[くちびる]の語[かた]ることを悟[さと]るように、わたしはあなたに命[めい]じる。"
  3: "悪[あ]しき女[おんな]に心[こころ]を向[む]けるな。遊女[ゆうじょ]の唇[くちびる]からは蜜[みつ]が滴[したた]り、その女はしばらくあなたの喉[のど]を滑[なめ]らかにする。"
  4: "しかし後[のち]には、胆汁[たんじゅう]よりも苦[にが]く、両刃[りょうば]の剣[つるぎ]よりも鋭[するど]いものを、あなたは見出[みいだ]す。"
  5: "愚[おろ]かさの足[あし]は、それを用[もち]いる者[もの]を死[し]とともに陰府[よみ]へと下[くだ]らせる。その足跡[あしあと]は定[さだ]まらない。"
  6: "彼女[かのじょ]は命[いのち]の道[みち]を歩[あゆ]まない。その道筋[みちすじ]は滑[すべ]りやすく、よくは知[し]れない。"
  7: "そこで、わが子[こ]よ、わたしの言[い]うことを聞[き]け。わが言葉[ことば]を無[む]効[こう]にするな。"
  8: "あなたの道[みち]を彼女[かのじょ]から遠[とお]ざけよ。彼女の家[いえ]の戸口[とぐち]に近[ちか]づくな。"
  9: "あなたの命[いのち]を他人[たにん]に、あなたの暮[く]らしを無慈悲[むじひ]な者[もの]に与[あた]えないためである。"
  10: "他人[たにん]があなたの力[ちから]で満[み]たされ、あなたの労苦[ろうく]が他人の家[いえ]に入[はい]り込[こ]まないためである。"
  11: "そして終[お]わりには、あなたの体[からだ]の肉[にく]がすり減[へ]るとき、悔[く]いることになる。"
  12: "そしてあなたは言[い]う。「どうしてわたしは戒[いまし]めを憎[にく]み、わが心[こころ]が叱責[しっせき]を退[しりぞ]けたのか。"
  13: "わたしを戒[いまし]め、教[おし]える者[もの]の声[こえ]を聞[き]かず、その声に耳[みみ]を傾[かたむ]けなかった。"
  14: "わたしは集会[しゅうかい]と会衆[かいしゅう]のただ中[なか]で、あらゆる悪[あく]に陥[おちい]るところだった。」"
  15: "わが子[こ]よ、あなたの器[うつわ]から、あなたの井戸[いど]の泉[いずみ]から水[みず]を飲[の]め。"
  16: "あなたの泉[いずみ]の水[みず]があなたのためにあふれ、あなたの水があなたの大通[おおどお]りを流[なが]れるようにせよ。"
  17: "それはあなたひとりのものとせよ。他人[たにん]がそれに与[あずか]ることがないように。"
  18: "あなたの水[みず]の泉[いずみ]をあなた自身[じしん]のものとせよ。あなたの若[わか]い日[ひ]の妻[つま]とともに喜[よろこ]べ。"
  19: "愛[あい]の雌鹿[めじか]、あなたの恵[めぐ]みの子馬[こうま]があなたと語[かた]らうように。あなた自身[じしん]の妻[つま]があなたを導[みちび]き、いつもあなたとともにいるように。彼女[かのじょ]との愛の交[まじ]わりに身[み]を置[お]くなら、あなたは幾倍[いくばい]にもなるからである。"
  20: "他人[たにん]の女[おんな]と深[ふか]く交[まじ]わるな。あなたのものでない女の腕[うで]に抱[だ]かれるな。"
  21: "人[ひと]の道[みち]は神[かみ]の目[め]の前[まえ]にある。神はそのすべての道筋[みちすじ]を見張[みは]っておられる。"
  22: "不法[ふほう]な行[おこな]いが人[ひと]を捕[とら]え、それぞれが自分[じぶん]の罪[つみ]の綱[つな]に縛[しば]られる。"
  23: "この者[もの]は戒[いまし]めのない者[もの]たちとともに死[し]ぬ。自分の富[とみ]の多[おお]さのゆえに投[な]げ出[だ]され、愚[おろ]かさのゆえに滅[ほろ]びる。"

notes:
  1: "ἐμῇ σοφίᾳ πρόσεχε — わが知恵に心を向けよ (σοφία — «премудрость»). ἐμοῖς λόγοις παράβαλλε σὸν οὖς — わが言葉に耳を傾けよ."
  2: "φυλάξῃς ἔννοιαν ἀγαθήν — 良い思いを保つ (ἔννοια — «мысль, помысел»). αἴσθησιν ἐμῶν χειλέων ἐντέλλομαί σοι — わが唇の語ることを悟るように命じる (αἴσθησις — «чувство, восприятие»; слав. «чувство же моих устен заповедает тебе»)."
  3: "μὴ πρόσεχε φαύλῃ γυναικί — 悪しき女に心を向けるな (φαῦλος — «дурной, низкий»). μέλι ἀποστάζει ἀπὸ χειλέων γυναικὸς πόρνης — 遊女の唇から蜜が滴る (ἀποστάζω — «капать»; πόρνη — «блудница»). πρὸς καιρὸν λιπαίνει σὸν φάρυγγα — しばらく喉を滑らかにする (λιπαίνω — «умащать»; φάρυγξ — «гортань»)."
  4: "ὕστερον μέντοι πικρότερον χολῆς εὑρήσεις — しかし後には胆汁よりも苦いものを見出す (χολή — «желчь»). ἠκονημένον μᾶλλον μαχαίρας διστόμου — 両刃の剣よりも鋭い (ἀκονάω — «точить»; δίστομος — «обоюдоострый»)."
  5: "τῆς ἀφροσύνης οἱ πόδες κατάγουσιν… εἰς τὸν ᾅδην — 愚かさの足は陰府へ下らせる (κατάγω — «низводить»; ᾅδης — «ад, преисподняя»; ἀφροσύνη олицетворена). τὰ ἴχνη αὐτῆς οὐκ ἐρείδεται — その足跡は定まらない (ἐρείδω — «утверждать»)."
  6: "ὁδοὺς ζωῆς οὐκ ἐπέρχεται — 命の道を歩まない. σφαλεραὶ αἱ τροχιαὶ αὐτῆς — その道筋は滑りやすい (σφαλερός — «шаткий, скользкий»). οὐκ εὔγνωστοι — よくは知れない (εὔγνωστος — «легко познаваемый»; ru «непостоянны» — МТ)."
  7: "νῦν οὖν, υἱέ — そこで、わが子よ. μὴ ἀκύρους ποιήσῃς ἐμοὺς λόγους — わが言葉を無効にするな (ἄκυρος — «недействительный»; слав. «не отриновенна сотвори»)."
  8: "μακρὰν ποίησον ἀπ᾽ αὐτῆς σὴν ὁδόν — あなたの道を彼女から遠ざけよ (μακράν — «далеко»). μὴ ἐγγίσῃς πρὸς θύραις οἴκων αὐτῆς — 彼女の家の戸口に近づくな (θύρα — «дверь»)."
  9: "ἵνα μὴ πρῴῃς ἄλλοις ζωήν σου — あなたの命を他人に与えないため (προΐημι — «предавать, отдавать»). σὸν βίον ἀνελεήμοσιν — あなたの暮らしを無慈悲な者に (βίος — «жизнь, средства к жизни»; ἀνελεήμων — «немилостивый»)."
  10: "πλησθῶσιν ἀλλότριοι σῆς ἰσχύος — 他人があなたの力で満たされる (ἰσχύς — «сила, крепость»). οἱ σοὶ πόνοι εἰς οἴκους ἀλλοτρίων εἰσέλθωσιν — あなたの労苦が他人の家に入り込む (πόνος — «труд»)."
  11: "μεταμεληθήσῃ ἐπ᾽ ἐσχάτων — 終わりには悔いる (μεταμέλομαι — «раскаиваться»; ἐπ᾽ ἐσχάτων — «в конце»). κατατριβῶσιν σάρκες σώματός σου — 体の肉がすり減る (κατατρίβω — «истирать»). Слав. 5:11 оканчивается «и речеши» — введение к речи 5:12; у нас по gr оно в 5:12."
  12: "Πῶς ἐμίσησα παιδείαν — どうして戒めを憎んだのか. ἐλέγχους ἐξέκλινεν ἡ καρδία μου — 心が叱責を退けた (ἔλεγχος — «обличение»; ἐκκλίνω — «уклонять»). Речь кающегося — 「」, одна цитата 5:12–14."
  13: "οὐκ ἤκουον φωνὴν παιδεύοντός με — 戒め、教える者の声を聞かなかった (παιδεύω — «наставлять»). οὐδὲ παρέβαλλον τὸ οὖς μου — 耳を傾けなかった (παραβάλλω — «прилагать»)."
  14: "παρ᾽ ὀλίγον ἐγενόμην ἐν παντὶ κακῷ — あらゆる悪に陥るところだった (παρ᾽ ὀλίγον — «едва не»). ἐν μέσῳ ἐκκλησίας καὶ συναγωγῆς — 集会と会衆のただ中で (ἐκκλησία καὶ συναγωγή — «церковь и сонмище», т. е. народное собрание). Цитата закрывается."
  15: "πῖνε ὕδατα ἀπὸ σῶν ἀγγείων — あなたの器から水を飲め (ἀγγεῖον — «сосуд»). ἀπὸ σῶν φρεάτων πηγῆς — あなたの井戸の泉から (φρέαρ — «колодец»). Слав. добавляет «Сыне» (в LXX нет)."
  16: "В gr μὴ ὑπερεκχείσθω — запрет: «да не переливаются»; в csl «да преизливаются тебе» — положительное чтение, как в МТ. Принято csl; вариант LXX (запрет) — в notes. πλατεῖαι — «улицы, площади» (слав. «пути»)."
  17: "ἔστω σοι μόνῳ ὑπάρχοντα — それはあなたひとりのものとせよ (ὑπάρχοντα — «имущество»). μηδεὶς ἀλλότριος μετασχέτω σοι — 他人が与らないように (μετέχω — «участвовать»; слав. «да никтоже чуждь причастится тебе»)."
  18: "ἡ πηγή σου τοῦ ὕδατος ἔστω σοι ἰδία — あなたの水の泉をあなた自身のものとせよ (ἴδιος — «свой, собственный»). συνευφραίνου μετὰ γυναικὸς τῆς ἐκ νεότητός σου — 若い日の妻とともに喜べ (συνευφραίνομαι — «веселиться вместе»)."
  19: "ἔλαφος φιλίας — 愛の雌鹿 (ἔλαφος — «лань»; φιλία — «любовь, дружба»). πῶλος σῶν χαρίτων — あなたの恵みの子馬 (πῶλος — «жеребёнок»). πολλοστὸς ἔσῃ — 幾倍にもなる (πολλοστός — «умноженный»; слав. «в дружбе бо сея спребываяй умножен будеши»)."
  20: "μὴ πολὺς ἴσθι πρὸς ἀλλοτρίαν — 他人の女と深く交わるな (букв. «не будь мног к»). μηδὲ συνέχου ἀγκάλαις τῆς μὴ ἰδίας — あなたのものでない女の腕に抱かれるな (ἀγκάλαι — «объятия»; συνέχω — «держать»)."
  21: "ἐνώπιον τῶν τοῦ θεοῦ ὀφθαλμῶν — 神の目の前 (ὀφθαλμός — «глаз»). εἰς πάσας τὰς τροχιὰς αὐτοῦ σκοπεύει — すべての道筋を見張る (σκοπεύω — «наблюдать»; слав. «назирает»)."
  22: "παρανομίαι ἄνδρα ἀγρεύουσιν — 不法な行いが人を捕らえる (ἀγρεύω — «ловить»). σειραῖς τῶν ἑαυτοῦ ἁμαρτιῶν ἕκαστος σφίγγεται — それぞれ自分の罪の綱に縛られる (σειρά — «верёвка, путы»; σφίγγω — «сжимать, связывать»)."
  23: "οὗτος τελευτᾷ μετὰ ἀπαιδεύτων — この者は戒めのない者たちとともに死ぬ (ἀπαίδευτος — «необученный, невежда»). ἐκ πλήθους τῆς ἑαυτοῦ βιότητος ἐξερρίφη — 自分の富の多さのゆえに投げ出される (βιότης — «достаток, средства к жизни»; ἐκρίπτω — «выбрасывать»; ru «от множества безумия» — МТ)."
