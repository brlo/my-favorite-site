# jp-box, 4-я Царств, глава 2. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc для книги нет;
# jp-ni не использовался.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 2: Галгал, Вефиль и Иерихон — «останься здесь» и клятва Елисея (1–6),
# пятьдесят сынов пророческих и Иордан (7–8), просьба о двойной доле духа (9–10),
# колесница огня и вознесение Илии (11), вопль Елисея и раздранные одежды
# (12), милоть и воды Иордана (13–14), сыны пророческих в Иерихоне и поиски
# Илии (15–18), исцеление воды (19–22), дети и медведицы (23–24), возвращение
# в Самарию (25).
# Нумерация совпадает с csl/ru (2:1–25).
# Паритет: слав. пояснения в скобках («(от тебе)» в 3, «(узриши)» в 10,
# «(вторицею)» в 14) — редакторские вставки переводчика, в текст не внесены;
# слав. чтение ст. 19 («как ты, господин, видишь») принято в текст, потому что
# κύριος здесь — обращение «господин», а не «Господь»; вариант LXX отмечен
# в notes. Прочие отличия — в notes.
# Речь — 「…」 первого уровня, вложенная — 『…』. Красного и синего нет.
# 〔…〕 нет: все стихи есть в гр.
# Сносок ⟨…⟩ нет: 預言者, 外套, 山, 水, 主 уже в корпусе.

