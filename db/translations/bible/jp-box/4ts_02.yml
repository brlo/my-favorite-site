verses:
  1: "主[しゅ]がエリヤを旋風[せんぷう]の中[なか]で天[てん]へと上[あ]げようとされたとき、エリヤはエリシャとともにギルガルから出[で]て行[い]った。"
  2: "エリヤはエリシャに言[い]った。「ここに留[とど]まっていなさい。主[しゅ]はわたしをベテルまで遣[つか]わされたのだから。」エリシャは言[い]った。「主[しゅ]は生[い]きておられる。あなたの魂[たましい]も生[い]きている。わたしはあなたを離[はな]れない。」こうして二人[ふたり]はベテルへ来[き]た。"
  3: "ベテルにいる預言者[よげんしゃ]の子[こ]らがエリシャのところへ出[で]て来[き]て、彼に言[い]った。「今日[きょう]、主[しゅ]があなたの頭[あたま]の上[うえ]から、あなたの主人[しゅじん]を取[と]り上[あ]げられることを知[し]っているか。」彼は言[い]った。「わたしも知[し]っている。黙[だま]っていなさい。」"
  4: "エリヤはエリシャに言[い]った。「ここに留[とど]まっていなさい。主[しゅ]はわたしをエリコへ遣[つか]わされたのだから。」エリシャは言[い]った。「主[しゅ]は生[い]きておられる。あなたの魂[たましい]も生[い]きている。わたしはあなたを離[はな]れない。」こうして二人[ふたり]はエリコへ来[き]た。"
  5: "エリコにいる預言者[よげんしゃ]の子[こ]らがエリシャに近[ちか]づいて言[い]った。「今日[きょう]、主[しゅ]があなたの頭[あたま]の上[うえ]から、あなたの主人[しゅじん]を取[と]り上[あ]げられることを知[し]っているか。」彼は言[い]った。「わたしもよく知[し]っている。黙[だま]っていなさい。」"
  6: "エリヤは彼に言[い]った。「ここに留[とど]まっていなさい。主[しゅ]はわたしをヨルダン川[がわ]まで遣[つか]わされたのだから。」エリシャは言[い]った。「主[しゅ]は生[い]きておられる。あなたの魂[たましい]も生[い]きている。わたしはあなたを離[はな]れない。」こうして二人[ふたり]はともに歩[あゆ]んで行[い]った。"
  7: "預言者[よげんしゃ]の子[こ]らのうちの五十人[ごじゅうにん]も、遠[とお]く離[はな]れて二人[ふたり]の向[む]かいに立[た]った。二人[ふたり]はヨルダン川[がわ]のほとりに立[た]っていた。"
  8: "エリヤは自分[じぶん]の外套[がいとう]を取[と]って巻[ま]き、それで水[みず]を打[う]つと、水[みず]は右[みぎ]にも左[ひだり]にも分[わ]かれた。二人[ふたり]は乾[かわ]いた地[ち]を渡[わた]った。"
  9: "渡[わた]り終[お]わると、エリヤはエリシャに言[い]った。「わたしがあなたから取[と]り去[さ]られる前[まえ]に、あなたのために何[なに]をしてやろうか、求[もと]めなさい。」エリシャは言[い]った。「あなたの霊[れい]が、わたしの上[うえ]に二倍[にばい]注[そそ]がれるように。」"
  10: "エリヤは言[い]った。「あなたは難[むずか]しいことを求[もと]めた。もしわたしがあなたから取[と]り去[さ]られるのを見[み]るなら、そのとおりになろう。見[み]ないなら、ならない。」"
  11: "二人[ふたり]が歩[ある]きながら語[かた]り合[あ]っていると、見[み]よ、火[ひ]の戦車[せんしゃ]と火[ひ]の馬[うま]が現[あらわ]れ、二人[ふたり]の間[あいだ]を分[わ]けた。エリヤは旋風[せんぷう]の中[なか]で天[てん]へと上[あ]げられた。"
  12: "エリシャは見[み]ながら叫[さけ]んだ。「父[ちち]よ、父[ちち]よ、イスラエルの戦車[せんしゃ]とその騎兵[きへい]よ。」そして、彼をもう見[み]ることはなかった。エリシャは自分[じぶん]の衣[ころも]をつかんで、二[ふた]つに引[ひ]き裂[さ]いた。"
  13: "エリシャは、自分[じぶん]の上[うえ]に落[お]ちてきたエリヤの外套[がいとう]を拾[ひろ]い上[あ]げ、引[ひ]き返[かえ]して、ヨルダン川[がわ]の岸[きし]に立[た]った。"
  14: "彼は、自分[じぶん]の上[うえ]に落[お]ちてきたエリヤの外套[がいとう]を取[と]って水[みず]を打[う]ったが、水[みず]は分[わ]かれなかった。そこで彼は言[い]った。「エリヤの神[かみ]はどこにおられるのか。」そして水[みず]をもう一度[いちど]打[う]つと、水[みず]は右[みぎ]にも左[ひだり]にも分[わ]かれ、エリシャは渡[わた]った。"
  15: "エリコにいる預言者[よげんしゃ]の子[こ]らは、向[む]こうに彼を見[み]て言[い]った。「エリヤの霊[れい]はエリシャの上[うえ]にとどまった。」彼らは彼に会[あ]いに来[き]て、地[ち]にひれ伏[ふ]して拝[おが]んだ。"
  16: "彼らは彼に言[い]った。「見[み]なさい。あなたのしもべたちのところには、力[ちから]ある者[もの]が五十人[ごじゅうにん]いる。どうか、彼らを遣[つか]わして、あなたの主人[しゅじん]を探[さが]させてほしい。もしかすると、主[しゅ]の霊[れい]が彼を上[あ]げて、ヨルダン川[がわ]か、山[やま]の一[ひと]つ、あるいは丘[おか]の一[ひと]つに投[な]げ落[お]としたのかもしれない。」エリシャは言[い]った。「遣[つか]わしてはならない。」"
  17: "しかし彼らは、彼が恥[は]じるまで強[し]いたてたので、彼は言[い]った。「それでは遣[つか]わしなさい。」そこで彼らは五十人[ごじゅうにん]を遣[つか]わし、三日間[みっかかん]探[さが]したが、見[み]つからなかった。"
  18: "そして彼のところへ戻[もど]って来[き]た。彼はイエリコにとどまっていた。エリシャは彼らに言[い]った。「わたしがあなたがたに、行[い]ってはならないと言[い]わなかったか。」"
  19: "その町[まち]の人々[ひとびと]はエリシャに言[い]った。「見[み]なさい。この町[まち]の住[す]みかげんは良[よ]い。ご主人[しゅじん]さまがご覧[らん]のとおりだ。ただ、水[みず]が悪[わる]く、土地[とち]は子[こ]を産[う]まない。」"
  20: "エリシャは言[い]った。「わたしに新[あたら]しい水差[みずさ]しを持[も]って来[き]て、そこに塩[しお]を入[い]れなさい。」彼らは取[と]って、彼のもとへ持[も]って来[き]た。"
  21: "彼は水[みず]の源[みなもと]へ出[で]て行[い]って、そこに塩[しお]を投[な]げ入[い]れ、言[い]った。「主[しゅ]はこう言[い]われる。『わたしはこの水[みず]を癒[いや]した。ここからはもはや死[し]も、不妊[ふにん]も起[お]こらない。』」"
  22: "水[みず]は、エリシャが語[かた]った言葉[ことば]のとおりに、今日[きょう]に至[いた]るまで良[よ]くなった。"
  23: "彼はそこからベテルへ上[のぼ]って行[い]った。道[みち]を上[のぼ]っていると、小[ちい]さな子[こ]どもたちが町[まち]から出[で]て来[き]て、彼を嘲[あざ]わらい、こう言[い]った。「上[のぼ]って行[い]け、禿[はげ]頭[あたま]。上[のぼ]って行[い]け。」"
  24: "彼は振[ふ]り向[む]いて彼らを見[み]、主[しゅ]の名[な]によって彼らを呪[のろ]った。すると、森[もり]から二頭[にとう]の雌熊[めぐま]が出[で]て来[き]て、そのうちの四十二人[よんじゅうににん]の子[こ]どもを引[ひ]き裂[さ]いた。"
  25: "彼はそこからカルメル山[やま]へ行[い]き、そこからサマリアへ戻[もど]った。"

notes:
  1: "ἐγένετο ἐν τῷ ἀνάγειν κύριον τὸν Ηλιου — «было, когда Господь возводил Илию» (ἀνάγω). συσσεισμός — «вихрь, потрясение» (слав. «вихрь»); ὡς εἰς τὸν οὐρανόν — «как бы на небо». ἐκ Γαλγαλων — «из Галгалов» (мн. ч.); ギルガル, как в 1–2 Цар (в Нав — ガルガル)."
  2: "Κάθου δὴ ἐνταῦθα — «посиди же здесь» (κάθημαι, императив). ἕως Βαιθηλ — «до Вефиля» (слав. «до вефиля»). Ζῇ κύριος καὶ ζῇ ἡ ψυχή σου, εἰ καταλείψω σε — клятвенная формула «жив Господь и жива душа твоя, если оставлю тебя» (эллипсис: «пусть так мне будет, если…»), т. е. «не оставлю»; передано утверждением. ἦλθον εἰς Βαιθηλ — «пришли в Вефиль»."
  3: "υἱοὶ τῶν προφητῶν — «сыны пророков» (預言者の子ら), т. е. ученики пророческих школ. Εἰ ἔγνως — «знаешь ли» (γινώσκω, аорист в значении «узнал»). ἐπάνωθεν τῆς κεφαλῆς σου — «свыше головы твоей», т. е. «от тебя»; слав. в скобках «(от тебе)» — пояснение переводчика, не переведено. Κἀγὼ ἔγνωκα — «и я узнал» (перфект). σιωπᾶτε — «молчите» (императив мн. ч.)."
  4: "Повтор формулы ст. 2 с «Иерихон» вместо «Вефиль» (εἰς Ιεριχω). ἐγκαταλείψω — «оставлю» (ἐγκαταλείπω; в ст. 2 — καταλείψω): вариация в гр."
  5: "ἤγγισαν — «приблизились» (ἐγγίζω). Καί γε ἐγὼ ἔγνων — «и я также узнал» (καί γε — усиление; в ст. 3 перфект ἔγνωκα)."
  6: "ἕως τοῦ Ιορδάνου — «до Иордана». ἐγκαταλείψω — как в ст. 4. ἐπορεύθησαν ἀμφότεροι — «пошли оба»; здесь глагол «пошли» есть (в ст. 2 и 4 — «пришли»)."
  7: "πεντήκοντα ἄνδρες υἱοὶ τῶν προφητῶν — «пятьдесят человек, сыны пророков»: в гр нет глагола «пошли» (ru добавляет «пошли и» — не внесено). ἐξ ἐναντίας μακρόθεν — «напротив, вдали». ἐπὶ τοῦ Ιορδάνου — «при Иордане»."
  8: "μηλωτή — милоть, овчинная накидка (外套; ср. 3Цар 19:13). εἵλησεν — «свернул» (εἱλέω). ἐπάταξεν τὸ ὕδωρ — «ударил по воде». διῃρέθη — «разделилась» (διαιρέω). ἔνθα καὶ ἔνθα — «туда и сюда». ἐν ἐρήμῳ — «по пустыне», т. е. посуху (слав. «по суху»)."
  9: "Αἴτησαι τί ποιήσω σοι — «попроси, что сделать тебе». πρὶν ἢ ἀναλημφθῆναί με ἀπὸ σοῦ — «прежде нежели я буду взят от тебя» (ἀναλαμβάνω — глагол Вознесения). διπλᾶ ἐν πνεύματί σου ἐπ᾿ ἐμέ — «двойное (двойная доля) от духа твоего на мне» (слав. «дух, иже в тебе, сугуб во мне»); передано 二倍."
  10: "Ἐσκλήρυνας τοῦ αἰτήσασθαι — букв. «ожесточил просить», т. е. «трудного попросил» (σκληρύνω; слав. «ожесточил еси просити»). ἐὰν ἴδῃς με ἀναλαμβανόμενον — «если увидишь меня вземлемого». οὐ μὴ γένηται — «не будет» (усиленное отрицание); слав. «аще ли не (узриши), и будет» — с пропуском отрицания, скобки редакторские."
  11: "ἅρμα πυρός καὶ ἵπποι πυρός — «колесница огня и кони огня» (слав. «кони огненнии»). διέστειλαν ἀνὰ μέσον ἀμφοτέρων — «разделили между обоими» (διαστέλλω). ἀνελήμφθη — «был взят» (ἀναλαμβάνω). ἐν συσσεισμῷ ὡς εἰς τὸν οὐρανόν — как в ст. 1."
  12: "ἑώρα — имперфект «смотрел»; ἐβόα — «взывал» (βοάω). Πάτερ πάτερ — двойное обращение (слав. «отче, отче»). ἅρμα Ισραηλ καὶ ἱππεὺς αὐτοῦ — «колесница Израиля и всадник его»: в гр ед. ч. ἱππεύς (слав. и ru «конница»). εἰς δύο ῥήγματα — «на две раздирины» (ῥῆγμα)."
  13: "ὕψωσεν — «поднял» (ὑψόω). ἐπάνωθεν Ελισαιε — «свыше Елисея», т. е. с него (слав. «верху его»). χεῖλος τοῦ Ιορδάνου — «губа (берег) Иордана»."
  14: "καὶ οὐ διέστη — «и не разделилась». Ποῦ ὁ θεὸς Ηλιου αφφω — «где Бог Илии, аффо?»: ἀφφώ — непереведённое евр. אַף־הוּא («и Он»), в слав. «аффо», в ru «Он Самый»; в тексте вопрос передан без этого слова. ἐπάταξεν τὰ ὕδατα — «ударил по водам» (вторично; слав. в скобках «(вторицею)» — пояснение, не переведено). διερράγησαν — «разорвались» (διαρρήγνυμι)."
  15: "ἐπαναπέπαυται — перфект «почил, покоится» (ἐπαναπαύομαι). ἐξ ἐναντίας — «напротив». προσεκύνησαν ἐπὶ τὴν γῆν — «поклонились до земли»."
  16: "παῖδες — «слуги, отроки» (здесь «рабы твои»). υἱοὶ δυνάμεως — «сыны силы», т. е. крепкие, сильные (слав. «сынове сильнии»); передано 力ある者. πορευθέντες δὴ ζητησάτωσαν — «пусть пойдут и поищут» (3-е л. императива; передано просьбой). μήποτε — «может быть». ἦρεν — «поднял, унёс» (αἴρω). βουνός — «холм» (丘). Οὐκ ἀποστελεῖτε — «не пошлёте» (будущее в значении запрета)."
  17: "παρεβιάσαντο — «принудили» (παραβιάζομαι). ἕως ὅτου ᾐσχύνετο — «доколе он не устыдился» (αἰσχύνομαι), т. е. пока не стало неловко; ru «наскучили ему» — по МТ. τρεῖς ἡμέρας — три дня."
  18: "ἀνέστρεψαν — «возвратились» (ἀναστρέφω). ἐκάθητο ἐν Ιεριχω — «сидел в Иерихоне», т. е. оставался там. Οὐκ εἶπον πρὸς ὑμᾶς Μὴ πορευθῆτε — «не говорил ли я вам: не ходите?»."
  19: "κατοίκησις — «жительство, место обитания» (住まい). καθὼς ὁ κύριος βλέπει — «как господин видит»: κύριος здесь обращение к Елисею («господин»), как в слав. «якоже ты, господине, видиши», а не «Господь» (в LXX двусмысленно). ἀτεκνουμένη — «делающая бездетной», т. е. бесплодная (ἀτεκνόω)."
  20: "ὑδρίσκη — «водонос, кувшин для воды» (слав. «водонос»); καινή — новый. θέατε ἐκεῖ ἅλα — «положите туда соли». ἔλαβον πρὸς αὐτόν — «взяли к нему» (слав. «взяша, и принесоша к нему»)."
  21: "διέξοδος τῶν ὑδάτων — «выход (исток) вод» (слав. «исходища водная»). Ἴαμαι — перфект «Я исцелил» (ἰάομαι; слав. «изцелих»). οὐκ ἔσται ἔτι ἐκεῖθεν θάνατος καὶ ἀτεκνουμένη — «не будет более оттуда смерти и бесплодия»."
  22: "ἰάθησαν — «исцелились» (аорист). ἕως τῆς ἡμέρας ταύτης — «до сего дня». κατὰ τὸ ῥῆμα Ελισαιε — «по слову Елисея». В конце стиха в выгрузке стоит «—» — разделитель, не текст."
  23: "παιδάρια μικρά — «малые дети» (слав. «дети малы»). κατέπαιζον — «насмехались» (καταπαίζω). Ἀνάβαινε, φαλακρέ, ἀνάβαινε — «взойди, плешивый, взойди» (φαλακρός — плешивый); двукратное повторение сохранено. Ирония: Елисей шёл в гору."
  24: "ἐξένευσεν ὀπίσω αὐτῶν — «обернулся за ними» (ἐκνεύω). κατηράσατο — «проклял» (καταράομαι). ἄρκοι — «медведицы» (ἄρκος; слав. «медведицы»). ἀνέρρηξαν ἐξ αὐτῶν — «растерзали из них» (ἀναρρήγνυμι). τεσσαράκοντα καὶ δύο παῖδας — сорок два ребёнка."
  25: "τὸ ὄρος τὸ Καρμήλιον — гора Кармил (カルメル山). ἐπέστρεψεν εἰς Σαμάρειαν — «возвратился в Самарию»."
