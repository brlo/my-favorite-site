chapter: 4
draft: true

verses:
  1: "また、青銅[せいどう]の祭壇[さいだん]を造[つく]った。長[なが]さ二十[にじゅう]キュビト、幅[はば]二十キュビト、高[たか]さ十[じゅう]キュビトであった。"
  2: "また、鋳物[いもの]の海[うみ]を造った。縁[ふち]から縁まで十[じゅう]キュビトで、周[まわ]りは全[まった]く円[えん]く、高さは五[ご]キュビト、その周りは三十[さんじゅう]キュビトであった。"
  3: "その下[した]には子牛[こうし]の形[かたち]があり、周[まわ]りに海[うみ]を取り囲[かこ]んでいた。十[じゅう]キュビトにわたって洗[あら]い盤[ばん]を周[まわ]りから囲[かこ]み、その鋳造[いちゅう]のときに二種類[にしゅるい]の子牛が鋳[い]られた。"
  4: "彼[かれ]らは十二[じゅうに]頭[とう]の子牛[こうし]を造[つく]った。三[さん]頭[とう]は北[きた]を、三頭は西[にし]を、三頭は南[みなみ]を、三頭は東[ひがし]を向[む]いていた。海[うみ]はその上[うえ]にあり、彼らの後[しり]の部分[ぶぶん]は内側[うちがわ]を向いていた。"
  5: "その厚[あつ]さは手[て]のひらほどで、その縁[ふち]は杯[さかずき]の縁のように、百合[ゆり]の花[はな]の形[かたち]に彫[ほ]られていた。それは三千[さんぜん]バトを入[い]れることができた。こうして彼[かれ]はそれを完成[かんせい]させた。"
  6: "また、洗[あら]い盤[ばん]を十[じゅう]個[こ]造[つく]り、五[いつ]つを右[みぎ]に、五つを左[ひだり]に置[お]いて、その中[なか]で燔祭[はんさい]のためのものを洗[あら]い、その中でゆすぎ清[きよ]めた。海[うみ]は祭司[さいし]たちがその中で身[み]を洗[あら]うためのものであった。"
  7: "また、金[きん]の燭台[しょくだい]を十[じゅう]個[こ]、その定[さだ]めに従[したが]って造り、それを神殿[しんでん]に置[お]いた。五つを右に、五つを左にである。"
  8: "また、机[つくえ]を十[じゅう]個[こ]造って神殿[しんでん]に置いた。五つを右[みぎ]に、五つを左[ひだり]にである。また、金[きん]の鉢[はち]を百[ひゃく]個[こ]造った。"
  9: "また、祭司[さいし]たちの庭[にわ]と大[おお]きな庭、また庭の戸[と]とその戸口[とぐち]を造り、それらを青銅[せいどう]で覆[おお]った。"
  10: "また、海[うみ]を家[いえ]の右[みぎ]の角[かど]から、東[ひがし]に向[む]かう側[がわ]に置[お]いた。"
  11: "ヒラムは肉[にく]刺[さ]しと火皿[ひざら]と祭壇[さいだん]の炉[ろ]と、そのすべての器[うつわ]を造[つく]った。こうしてヒラムは、神[かみ]の家[いえ]でソロモン王[おう]のために行[おこな]ったすべての仕事[しごと]を終[お]えた。"
  12: "すなわち、二本[にほん]の柱[はしら]と、その上[うえ]の丸[まる]い柱頭[ちゅうとう]、柱の頭[あたま]にある二[ふた]つの冠[かんむり]、また、柱の頭にある冠を覆[おお]う二つの網[あみ]、"
  13: "また、二[ふた]つの網[あみ]に四百[よんひゃく]の金[きん]の鈴[すず]と、二種類[にしゅるい]のざくろを一[ひと]つの網に付け、柱[はしら]の上[うえ]にある冠[かんむり]の二つの丸[まる]い柱頭[ちゅうとう]を覆[おお]った。"
  14: "また、台座[だいざ]を十[じゅう]個[こ]造[つく]り、その台座の上[うえ]に洗[あら]い盤[ばん]を造った。"
  15: "また、一[ひと]つの海[うみ]と、その下[した]の十二[じゅうに]頭[とう]の子牛[こうし]、"
  16: "また、灰[はい]取[と]りと、火[ひ]挟[ばさ]みと、大釜[おおがま]と、肉[にく]刺[さ]しと、そのすべての器[うつわ]を、ヒラムが主[しゅ]の家[いえ]のためにソロモン王[おう]に造[つく]って納[おさ]めた。それは純粋[じゅんすい]な青銅[せいどう]であった。"
  17: "王[おう]はそれらをヨルダン川[がわ]の周辺[しゅうへん]、スコトとシルダタの間[あいだ]の土[つち]の厚[あつ]みの中[なか]で鋳造[いちゅう]した。"
  18: "ソロモンはこれらすべての器[うつわ]を非常[ひじょう]に多[おお]く造[つく]ったので、青銅[せいどう]の重[おも]さは尽[つ]きることがなかった。"
  19: "ソロモンは主[しゅ]の家[いえ]のすべての器[うつわ]を造[つく]った。すなわち、金[きん]の祭壇[さいだん]と、供[そな]えのパンを載[の]せる机[つくえ]、"
  20: "また、燭台[しょくだい]と、その光[ひかり]のともし火[び]を、定[さだ]めに従[したが]い、至聖所[しせいしょ]の前[まえ]に純金[じゅんきん]で造[つく]った。"
  21: "また、その火[ひ]挟[ばさ]みと、そのともし火[び]と、鉢[はち]と、香炉[こうろ]と、火皿[ひざら]を純金[じゅんきん]で造った。"
  22: "また、家[いえ]の内[うち]の戸[と]、すなわち至聖所[しせいしょ]への戸と、神殿[しんでん]の家の戸を金[きん]で造った。こうして、ソロモンが主[しゅ]の家[いえ]で行[おこな]ったすべての仕事[しごと]は完成[かんせい]した。"

notes:
  1: "θυσιαστήριον χαλκοῦν — медный (бронзовый) жертвенник (青銅の祭壇); 20×20, высота 10. В 3 Цар 7 этот жертвенник не описан; ср. 3 Цар 8:64; 9:25."
  2: "θάλασσα χυτή — литое море (青銅の海); πήχεων δέκα τὴν διαμέτρησιν — 10 локтей в поперечнике; στρογγύλην κυκλόθεν — круглое вокруг; τὸ κύκλωμα πήχεων τριάκοντα — обвод 30 локтей. = 3 Цар 7:23 (там в LXX 33 локтя, в csl 30; здесь 30 в gr и csl)."
  3: "ὁμοίωμα μόσχων ὑποκάτωθεν αὐτῆς — подобие тельцов под нею; κύκλῳ κυκλοῦσιν αὐτήν — вокруг обступают её; πήχεις δέκα περιέχουσιν τὸν λουτῆρα — десять локтей охватывают умывальницу (λουτήρ — 洗い盤); δύο γένη ἐχώνευσαν τοὺς μόσχους — два рода (ряда) тельцов отлили. В 3 Цар 7:24 — «два ряда»; здесь δύο γένη, поэтому 二種類."
  4: "ᾗ ἐποίησαν αὐτούς — тёмное место: «которым сделали их» (рассогласование в gr; слав. «имже сотвориша их»); δώδεκα μόσχους — двенадцать тельцов; οἱ τρεῖς βλέποντες βορρᾶν ... δυσμάς ... νότον ... κατ᾽ ἀνατολάς — по три к северу, западу, югу и востоку; ὀπίσθια αὐτῶν ἔσω — зады их внутрь."
  5: "τὸ πάχος ... παλαιστής — толщина в ладонь (παλαιστής); χεῖλος ὡς χεῖλος ποτηρίου — край как край чаши; διαγεγλυμμένα βλαστοὺς κρίνου — изваянные побеги лилии (百合); χωροῦσαν μετρητὰς τρισχιλίους — вмещающее 3000 метретов (μετρητής, バト); ἐξετέλεσεν — завершил. В 3 Цар 7:26 — 2000 батов; здесь 3000."
  6: "λουτῆρας δέκα — десять умывальниц (洗い盤); τοὺς πέντε ἐκ δεξιῶν καὶ τοὺς πέντε ἐξ ἀριστερῶν — пять справа и пять слева; πλύνειν ... τὰ ἔργα τῶν ὁλοκαυτωμάτων — омывать то, что относится к всесожжениям; ἀποκλύζειν — ополаскивать (ゆすぐ); ἡ θάλασσα εἰς τὸ νίπτεσθαι τοὺς ἱερεῖς — море для омовения священников."
  7: "λυχνίας χρυσᾶς δέκα — десять золотых светильников (燭台); κατὰ τὸ κρίμα αὐτῶν — по чину их (定め); ἐν τῷ ναῷ — в храме (神殿)."
  8: "τραπέζας δέκα — десять столов (机); φιάλας χρυσᾶς ἑκατόν — сто золотых чаш (鉢)."
  9: "αὐλὴν τῶν ἱερέων — двор священников; αὐλὴν τὴν μεγάλην — великий двор; θύρας τῇ αὐλῇ καὶ θυρώματα αὐτῶν κατακεχαλκωμένα χαλκῷ — двери двора и полотна их, обложенные медью. Ср. 3 Цар 6:36; 7:12."
  10: "ἀπὸ γωνίας τοῦ οἴκου ἐκ δεξιῶν — от угла дома справа; ὡς πρὸς ἀνατολὰς κατέναντι — обращённое к востоку напротив; в ru/МТ — «к юго-востоку», в csl — «прямо к востоку»."
  11: "κρεάγρας — мясные крюки (肉刺し); πυρεῖα — совки, жаровни (火皿); ἐσχάραν τοῦ θυσιαστηρίου — очаг жертвенника (祭壇の炉); συνετέλεσεν — завершил. В 3 Цар 7:40 иной набор: λέβητες, θερμάστρεις, φιάλαι."
  12: "στύλους δύο — два столпа; γωλαθ — вероятно евр. גלגלת, круглые капители (丸い柱頭; слав. «окружилия»); χωθαρεθ — евр. כותרות, венцы (冠; слав. «венцы»); δίκτυα δύο — две сети (網); συγκαλύψαι — чтобы покрыть."
  13: "κώδωνας χρυσοῦς τετρακοσίους — четыреста золотых колокольчиков (鈴; слав. «звонцев»); в ru/МТ — 400 гранатовых яблок, в LXX/csl — колокольчики; δύο γένη ῥοίσκων — два рода гранатов (ざくろ); ἐν τῷ δικτύῳ τῷ ἑνί — в одной сети; γωλαθ τῶν χωθαρεθ — округлые венцы."
  14: "μεχωνωθ — подставы, основания (台座; слав. «мехонофы»; ср. 3 Цар 7:27–38); λουτῆρας ἐπὶ τῶν μεχωνωθ — умывальницы на подставах."
  15: "θάλασσαν μίαν — одно море; μόσχους τοὺς δώδεκα ὑποκάτω αὐτῆς — двенадцать тельцов под ним (в csl «волов»)."
  16: "ποδιστῆρας — лопатки, совки (灰取り); ἀναλημπτῆρας — щипцы (火挟み); λέβητας — котлы (大釜); κρεάγρας — мясные крюки (肉刺し); χαλκοῦ καθαροῦ — чистой меди (純粋な青銅)."
  17: "ἐν τῷ περιχώρῳ τοῦ Ιορδάνου — в окрестности Иордана; ἐν τῷ πάχει τῆς γῆς — в толще земли (土の厚み); ἐν οἴκῳ Σοκχωθ καὶ ἀνὰ μέσον Σιρδαθα — в доме Сокхофа и между Саридафом (スコト; シルダタ; слав. «саридаф», ru «Цереда»; в 3 Цар 7:46 — Сира)."
  18: "εἰς πλῆθος σφόδρα — в великом множестве; οὐκ ἐξέλιπεν ὁλκὴ τοῦ χαλκοῦ — «не оскудел вес меди», т. е. её нельзя было взвесить (ἐκλείπω — иссякать; ὁλκή — вес)."
  19: "σκεύη οἴκου κυρίου — сосуды дома Господня; θυσιαστήριον τὸ χρυσοῦν — золотой жертвенник; τραπέζας [καὶ ἐπ᾽ αὐτῶν ἄρτοι προθέσεως] — столы, и на них хлебы предложения; в gr клауза в квадратных скобках, в csl без скобок — внесена в текст."
  20: "λυχνίας καὶ τοὺς λύχνους τοῦ φωτός — светильники и лампады света; κατὰ τὸ κρίμα — по чину; κατὰ πρόσωπον τοῦ δαβιρ — пред лицом давира, т. е. 至聖所; χρυσίου καθαροῦ — чистого золота."
  21: "λαβίδες — щипцы (火挟み); λύχνοι — лампады (ともし火); φιάλαι — чаши (鉢); θυίσκαι — кадильницы (香炉); πυρεῖα — совки (火皿); χρυσίου καθαροῦ — чистого золота."
  22: "θύρα τοῦ οἴκου ἡ ἐσωτέρα εἰς τὰ ἅγια τῶν ἁγίων — внутренняя дверь дома в Святое Святых; θύρας τοῦ οἴκου τοῦ ναοῦ — двери дома храма; χρυσᾶς — золотые. Слав. добавление «И совершися все дело, еже сотвори соломон в дому Господни» (こうして…すべての仕事は完成した) внесено в текст; в gr его нет (ср. 3 Цар 7:51)."
