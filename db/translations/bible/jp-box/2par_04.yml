# jp-box, 2-я Паралипоменон, глава 4. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); церковнославянский (csl-ru) — второй
# свидетель церковного текста: слав. чтения и добавки входят в основной текст
# без 〔…〕, вариант LXX — в notes. ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге нет; jp-ni (под авторским правом) не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 4: жертвенник (1), море (2–5), омывальницы (6), светильники (7),
# столы и чаши (8), дворы (9–10), работа Хирама (11–18), золотая утварь (19–22).
# Нумерация по gr совпадает с csl: 22 стиха. Параллель — 3 Цар 7:23–51,
# но порядок и состав утвари иные; отличия отмечены в notes.
# Слав. добавление в 4:22 («И совершися все дело...») внесено в текст.
# Речи нет; красного нет.
# 〔…〕 нет. Сносок ⟨…⟩ нет: 祭壇, 青銅の海, 洗い盤, 台座, 燭台, 至聖所 уже в корпусе.

