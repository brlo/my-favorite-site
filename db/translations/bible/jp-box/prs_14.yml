verses:
  1: "また、ある人[ひと]が船出[ふなで]を準備[じゅんび]し、荒[あ]れ狂[くる]う波[なみ]を渡[わた]ろうとするとき、自分[じぶん]の乗[の]る舟[ふね]よりももろい木[き]に向[む]かって叫[さけ]ぶ。"
  2: "その舟[ふね]は、富[とみ]を得[え]たいという願[ねが]いが考[かんが]え出[だ]したものであり、技[わざ]に長[た]けた知恵[ちえ]が造[つく]ったものである。"
  3: "しかし、父[ちち]よ、あなたの摂理[せつり]がその舵[かじ]を取[と]る。あなたは海[うみ]にも道[みち]を与[あた]え、波[なみ]の中[なか]にも安全[あんぜん]な小道[こみち]を与えられたからである。"
  4: "あなたがあらゆることから救[すく]うことができることを示[しめ]すためであり、技[わざ]がなくても人[ひと]が舟[ふね]に乗[の]れるようにするためである。"
  5: "あなたは、知恵[ちえ]のわざがむだであることを望[のぞ]まない。それゆえ、人[ひと]はごく小[ちい]さな木[き]に命[いのち]を託[たく]し、波[なみ]を渡[わた]って小舟[こぶね]で救[すく]われる。"
  6: "そもそも、高慢[こうまん]な巨人[きょじん]たちが滅[ほろ]びた初[はじ]めにも、世界[せかい]の希望[きぼう]は小舟[こぶね]に逃[のが]れ、あなたの手[て]に操[あやつ]られて、世代[せだい]の種[たね]を世[よ]に残[のこ]した。"
  7: "というのは、正義[せいぎ]が生[しょう]じる木[き]は祝福[しゅくふく]されているからである。"
  8: "しかし、手[て]で造[つく]られたものは、それ自体[じたい]も、それを造った者[もの]も呪[のろ]われている。造った者はそれをこしらえ、朽[く]ちるものが神[かみ]と呼[よ]ばれたからである。"
  9: "神[かみ]にとっては、不敬虔[ふけいけん]な者[もの]も、その不敬虔も、等[ひと]しく憎[にく]まれる。"
  10: "なされたものは、なした者[もの]とともに罰[ばつ]せられるからである。"
  11: "それゆえ、諸国[しょこく]の偶像[ぐうぞう]にも裁[さば]きが来[く]る。神[かみ]の造[つく]られたものの中[なか]で、それらは忌[い]まわしいものとなり、人[ひと]の魂[たましい]のつまずきとなり、愚[おろ]かな者[もの]の足[あし]の罠[わな]となったからである。"
  12: "偶像[ぐうぞう]を思[おも]いつくことが淫行[いんこう]の始[はじ]まりであり、それを見[み]いだすことが命[いのち]の腐敗[ふはい]である。"
  13: "それらは初[はじ]めからあったのではなく、永遠[えいえん]に続[つづ]くものでもない。"
  14: "それは人[ひと]の虚栄[きょえい]によってこの世[よ]に入[はい]り、それゆえ、その終[お]わりは短[みじか]いと定[さだ]められた。"
  15: "というのは、時[とき]ならぬ悲[かな]しみにさいなまれた父[ちち]が、早[はや]く奪[うば]われた子[こ]の像[ぞう]を作[つく]り、かつて死[し]んだ人間[にんげん]を今[いま]は神[かみ]として敬[うやま]い、配下[はいか]の者[もの]たちに秘儀[ひぎ]と祭礼[さいれい]を伝[つた]えたからである。"
  16: "その後[のち]、時[とき]がたつうちに、この不敬虔[ふけいけん]な習慣[しゅうかん]は強[つよ]められ、律法[りっぽう]のように守[まも]られた。"
  17: "また、彫[ほ]り物[もの]は暴君[ぼうくん]たちの命令[めいれい]によって崇拝[すうはい]された。人[ひと]々[びと]は、遠[とお]くに住[す]んでいるために、目[め]の前[まえ]にいる王[おう]を敬[うやま]うことができず、その遠[とお]い姿[すがた]を写[うつ]し取[と]り、敬[うやま]われる王の目に見える像[ぞう]を作った。それは、その場[ば]にいない王を、熱心[ねっしん]さによって、あたかも目の前[まえ]にいるかのようにへつらうためであった。"
  18: "また、崇拝[すうはい]がさらに進[すす]むにつれて、知[し]らない者[もの]たちも工匠[こうしょう]の名誉欲[めいよよく]に駆[か]り立[た]てられた。"
  19: "工匠[こうしょう]は、おそらく支配者[しはいしゃ]に気[き]に入[はい]られようとして、技[わざ]によって似姿[にすがた]をさらに美[うつく]しく仕上[しあ]げた。"
  20: "そして民[たみ]は、その仕事[しごと]の美[うつく]しさに引[ひ]かれて、少[すこ]し前[まえ]に人[ひと]として敬[うやま]われていた者[もの]を、今[いま]は崇拝[すうはい]の対象[たいしょう]と考[かんが]えた。"
  21: "これが人[ひと]々[びと]の生活[せいかつ]を陥[おとしい]れるものとなった。人[ひと]は災難[さいなん]や暴政[ぼうせい]に仕[つか]えるうちに、決[けっ]して分[わ]かち合[あ]えない御名[みな]を石[いし]や木[き]に付[つ]けたからである。"
  22: "さらに、神[かみ]についての知識[ちしき]の点[てん]で迷[まよ]うだけでは足[た]りず、大[おお]きな無知[むち]の戦[たたか]いの中[なか]に生[い]きながら、それほど多[おお]くの悪[あく]を平和[へいわ]と呼[よ]んでいる。"
  23: "というのは、彼[かれ]らは子殺[こごろ]しの祭儀[さいぎ]を行[おこな]い、秘密[ひみつ]の秘儀[ひぎ]を営[いとな]み、他国[たこく]の定[さだ]めから出[で]た狂気[きょうき]の宴[うたげ]を催[もよお]しながら、"
  24: "彼[かれ]らはもはや生活[せいかつ]も結婚[けっこん]も清[きよ]く守[まも]らず、互[たが]いに、ある者[もの]は待[ま]ち伏[ぶ]せして殺[ころ]し、ある者は姦淫[かんいん]して苦[くる]しめる。"
  25: "すべては入[い]り混[ま]じっている。血[ち]と殺人[さつじん]、盗[ぬす]みと欺[あざむ]き、腐敗[ふはい]、不信仰[ふしんこう]、混乱[こんらん]、偽[いつわ]りの誓[ちか]い、"
  26: "善[よ]きものの喧騒[けんそう]、恵[めぐ]みの忘恩[ぼうおん]、魂[たましい]の汚[けが]れ、生[う]まれの取[と]り替[か]え、結婚[けっこん]の無秩序[むちつじょ]、姦淫[かんいん]と好色[こうしょく]。"
  27: "名[な]もない偶像[ぐうぞう]の崇拝[すうはい]は、すべての悪[あく]の始[はじ]まりであり、原因[げんいん]であり、終[お]わりである。"
  28: "というのは、彼[かれ]らは喜[よろこ]びながら気[き]を狂[くる]わせ、あるいは偽[いつわ]りを預言[よげん]し、あるいは不正[ふせい]に生[い]き、あるいはすぐに誓[ちか]いを破[やぶ]るからである。"
  29: "彼[かれ]らは魂[たましい]のない偶像[ぐうぞう]を頼[たの]みとして、不正[ふせい]な誓[ちか]いをしても、罰[ばつ]せられることを受[う]け入[い]れない。"
  30: "しかし、その両方[りょうほう]のゆえに、正[ただ]しい裁[さば]きが彼[かれ]らに及[およ]ぶ。神[かみ]について悪[わる]く考[かんが]えて偶像[ぐうぞう]に心[こころ]を寄[よ]せたからであり、また、狡猾[こうかつ]にも聖[せい]なるものを軽[かろ]んじて不正[ふせい]に誓[ちか]ったからである。"
  31: "誓[ちか]われるものの力[ちから]ではなく、罪[つみ]を犯[おか]す者[もの]たちへの裁[さば]きが、いつも不正[ふせい]な者たちの背[そむ]きに追[お]い迫[せま]るのである。"

notes:
  1: "Πλοῦν στελλόμενος — «снаряжая плавание» (στέλλομαι — «готовить, снаряжать»); ἄγρια κύματα — «дикие волны»; τοῦ φέροντος αὐτὸν πλοίου σαθρότερον ξύλον — «дерево, более дряхлое, чем несущий его корабль» (σαθρός — «ветхий, ненадёжный»); ἐπιβοᾶται — «взывает» (о помощи). Ирония: взывают к куску дерева — идолу — вместо корабля."
  2: "ὄρεξις πορισμῶν — «стремление к приобретениям»; ἐπενόησεν — «выдумало, изобрело»; τεχνῖτις σοφία — «искусная, художественная премудрость» (τεχνῖτις — «мастерица»); κατεσκεύασεν — «устроила». Корабль — произведение Премудрости, а не идола."
  3: "ἡ σὴ … πρόνοια — «Твой Промысл» (πρόνοια); διακυβερνᾷ — «ведёт через, управляет» (κυβερνάω — «править кораблём»); τρίβον ἀσφαλῆ — «путь безопасный» (τρίβος — «тропа»). Обращение πάτερ — 父よ (звательный падеж)."
  4: "δεικνὺς ὅτι δύνασαι ἐκ παντὸς σῴζειν — «показывая, что можешь от всего спасать»; ἵνα κἂν ἄνευ τέχνης τις ἐπιβῇ — «чтобы даже без искусства кто-нибудь мог взойти на корабль» (ἐπιβαίνω — «вступать на борт»). Мысль: спасение не от мореходного умения, а от Промысла."
  5: "θέλεις δὲ μὴ ἀργὰ εἶναι τὰ τῆς σοφίας σου ἔργα — «хочешь, чтобы дела Твоей премудрости не были праздны» (ἀργός — «бездельный, бесплодный»); ἐλαχίστῳ ξύλῳ — «малейшему дереву»; πιστεύουσιν … ψυχάς — «вверяют души/жизни»; σχεδίᾳ — «на плоту, лодке» (σχεδία); διεσώθησαν — «спаслись». csl «кораблецем избавлени суть»."
  6: "ἀρχῆς … ἀπολλυμένων ὑπερηφάνων γιγάντων — «в начале, когда погибали гордые исполины» (Быт 6–7); ἡ ἐλπὶς τοῦ κόσμου — «надежда мира», т. е. Ной с ковчегом; ἐπὶ σχεδίας καταφυγοῦσα — «прибегнув к плоту/ковчегу»; ἀπέλιπεν αἰῶνι σπέρμα γενέσεως — «оставила веку семя рождения»; τῇ σῇ κυβερνηθεῖσα χειρί — «управляемая Твоей рукой»."
  7: "εὐλόγηται γὰρ ξύλον, δι᾿ οὗ γίνεται δικαιοσύνη — «ибо благословенно дерево, через которое бывает правда»; речь о дереве ковчега, а в церковном прочтении — о древе креста; в тексте оставлено буквально, без пояснений."
  8: "τὸ χειροποίητον — «рукотворенное» (手で造られたもの); ἐπικατάρατον αὐτὸ καὶ ὁ ποιήσας αὐτό — «проклято и само, и сделавший его»; ὁ μὲν ἠργάζετο — «он работал [над ним]»; τὸ δὲ φθαρτὸν θεὸς ὠνομάσθη — «а тленное названо богом»."
  9: "ἐν ἴσῳ — «наравне, одинаково»; μισητὰ θεῷ — «ненавистны Богу»; ὁ ἀσεβῶν καὶ ἡ ἀσέβεια αὐτοῦ — «нечестивец и нечестие его»: оба, делатель и дело."
  10: "τὸ πραχθὲν σὺν τῷ δράσαντι κολασθήσεται — «сделанное вместе со сделавшим будет наказано» (κολάζω — «карать»). Стих продолжает мысль ст. 9: произведение нечестия разделяет его участь."
  11: "ἐν εἰδώλοις ἐθνῶν ἐπισκοπὴ ἔσται — «на идолов языческих будет посещение» (ἐπισκοπή — «посещение», здесь в значении суда); ἐν κτίσματι θεοῦ — «среди создания Божия»; εἰς βδέλυγμα — «в мерзость»; εἰς σκάνδαλα ψυχαῖς — «в соблазн душам»; εἰς παγίδα ποσίν — «в петлю ногам» (παγίς — «ловушка»)."
  12: "Ἀρχὴ πορνείας ἐπίνοια εἰδώλων — «начало блуда — помысел об идолах» (πορνεία здесь о духовном блуде, идолослужении; поэтому 淫行); εὕρεσις δὲ αὐτῶν φθορὰ ζωῆς — «а изобретение их — растление жизни» (φθορά — «порча, гибель»)."
  13: "οὔτε γὰρ ἦν ἀπ᾿ ἀρχῆς οὔτε εἰς τὸν αἰῶνα ἔσται — «ибо не было их от начала, и не будет в век»: отрицание предвечности и вечности идолов. csl «ниже бо быша… ниже будут во веки» — множественное число."
  14: "κενοδοξίᾳ ἀνθρώπων — «тщеславием человеческим» (κενοδοξία — «пустая слава»); εἰσῆλθεν εἰς τὸν κόσμον — «вошло в мир» (ед. ч., подлежащее — «изобретение/идолослужение»); σύντομον τὸ τέλος — «краткий конец»; ἐπενοήθη — «был придуман, установлен»."
  15: "ἀώρῳ πένθει τρυχόμενος — «терзаемый безвременной скорбью» (ἄωρος — «безвременный, преждевременный»); τοῦ ταχέως ἀφαιρεθέντος τέκνου — «скоро отнятого ребёнка»; εἰκόνα ποιήσας — «сделав изображение»; τὸν ποτε νεκρὸν ἄνθρωπον νῦν ὡς θεὸν ἐτίμησεν — «того, кто некогда был мёртвым человеком, теперь почтил как бога»; τοῖς ὑποχειρίοις — «подвластным» (ὑποχείριος — «под рукой»); μυστήρια καὶ τελετάς — «тайны и обряды посвящения» (τελετή — «обряд, мистерия»)."
  16: "εἶτα ἐν χρόνῳ κρατυνθὲν τὸ ἀσεβὲς ἔθος — «затем, со временем, утвердившийся нечестивый обычай» (κρατύνω — «укреплять»); ὡς νόμος ἐφυλάχθη — «соблюдался как закон». csl в этом стихе добавляет начало гр. 14:17 («и мучителей повелением почитаема бяху изваянная») — у нас эта клауза в ст. 17 по гр."
  17: "τυράννων ἐπιταγαῖς ἐθρησκεύετο τὰ γλυπτά — «по приказам тиранов почитались изваяния» (θρησκεύω — «религиозно чтить»; γλυπτά — «резные изображения»); οὓς ἐν ὄψει μὴ δυνάμενοι τιμᾶν — «которых не могли чтить в лицо» (οὓς относится к царям); διὰ τὸ μακρὰν οἰκεῖν — «потому что жили далеко»; τὴν πόρρωθεν ὄψιν ἀνατυπωσάμενοι — «воспроизведя издалека [виденный] облик»; ἵνα ὡς παρόντα τὸν ἀπόντα κολακεύωσιν — «чтобы льстить отсутствующему, как присутствующему» (κολακεύω — «льстить»)."
  18: "εἰς ἐπίτασιν θρησκείας — «к усилению почитания» (ἐπίτασις — «напряжение, усиление»); τοὺς ἀγνοοῦντας — «незнающих»; ἡ τοῦ τεχνίτου φιλοτιμία — «честолюбие/соревновательность художника» (φιλοτιμία — «любовь к почёту»), отсюда 名誉欲; προετρέψατο — «побудило». csl «в продолжение злочестия» — истолковательное чтение вместо θρησκεία."
  19: "κρατοῦντι βουλόμενος ἀρέσαι — «желая угодить власть имущему»; ἐξεβιάσατο τῇ τέχνῃ τὴν ὁμοιότητα ἐπὶ τὸ κάλλιον — «принудил искусством подобие к лучшему», т. е. насильно сделал изображение красивее (ἐκβιάζομαι — «вынуждать»)."
  20: "τὸ πλῆθος ἐφελκόμενον — «толпа, увлекаемая» (ἐφέλκω — «привлекать»); διὰ τὸ εὔχαρι τῆς ἐργασίας — «из-за приятности/изящества работы» (εὔχαρις — «приятный, изящный»); τὸν πρὸ ὀλίγου τιμηθέντα ἄνθρωπον — «недавно почтённого человека»; σέβασμα — «предмет почитания»; ἐλογίσαντο — «сочли». csl «в бога вмениша» — истолкование σέβασμα."
  21: "εἰς ἔνεδρον — «в засаду, в сеть» (ἔνεδρον — «засада»); ἢ συμφορᾷ ἢ τυραννίδι δουλεύσαντες — «послужив или несчастью, или тирании» (συμφορά — «бедствие»); τὸ ἀκοινώνητον ὄνομα — «несообщимое имя», т. е. имя Божие, которое нельзя передавать твари; λίθοις καὶ ξύλοις περιέθεσαν — «возложили на камни и деревья» (περιτίθημι — «возлагать»). csl «в прельщение» — истолковательное чтение ἔνεδρον."
  22: "Εἶτα οὐκ ἤρκεσεν — «потом не довольно было»; τὸ πλανᾶσθαι περὶ τὴν τοῦ θεοῦ γνῶσιν — «блуждать в познании Бога»; ἐν μεγάλῳ … ἀγνοίας πολέμῳ — «в великой войне неведения»; τὰ τοσαῦτα κακὰ εἰρήνην προσαγορεύουσιν — «столь великие зла называют миром». csl «толикая злая мир именуют»."
  23: "τεκνοφόνους τελετάς — «детоубийственные обряды»; κρύφια μυστήρια — «тайные мистерии»; ἐμμανεῖς ἐξάλλων θεσμῶν κώμους — «неистовые пиршества по чужим установлениям» (ἐξάλλων θεσμῶν — «из иных законов»; κῶμος — «шествие, пирушка»); ἄγοντες — «совершая». Синтаксис гр. тянется в ст. 24 (φυλάσσουσιν), поэтому стих кончается 催しながら."
  24: "οὔτε βίους οὔτε γάμους καθαροὺς ἔτι φυλάσσουσιν — «уже не хранят ни жизни, ни браков чистых»; ἕτερος δ᾿ ἕτερον — «один другого»; λοχῶν ἀναιρεῖ — «подстерегая, убивает» (λοχάω — «устраивать засаду»); νοθεύων ὀδυνᾷ — «развращая, мучит» (νοθεύω — «подделывать, развращать»)."
  25: "πάντα δ᾿ ἐπιμὶξ ἔχει — «всё смешано» (ἐπιμίξ — «вперемешку»); перечень: αἷμα καὶ φόνος (кровь и убийство), κλοπὴ καὶ δόλος (кража и коварство), φθορά (растление), ἀπιστία (неверность), τάραχος (смятение), ἐπιορκία (клятвопреступление). Список завершается в ст. 26; в csl конец ст. 25 иной («заклинание, молва благих»), у нас — по гр."
  26: "θόρυβος ἀγαθῶν — «смятение благ» (тёмное место; csl «молва благих», Син. «забвение благодарности» — последнее относится уже к следующему члену); χάριτος ἀμνηστία — «забвение благодати/благодарности»; ψυχῶν μιασμός — «осквернение душ»; γενέσεως ἐναλλαγή — «изменение рождения» (церковное понимание — извращение естества, ср. Син. «превращение полов»); γάμων ἀταξία — «бесчиние браков»; μοιχεία καὶ ἀσέλγεια — «прелюбодеяние и распутство»."
  27: "τῶν ἀνωνύμων εἰδώλων — «безымянных идолов» (ἀνώνυμος — «не имеющий имени»), слав. «недостойных имене»; θρησκεία — «почитание, религия»; παντὸς ἀρχὴ κακοῦ καὶ αἰτία καὶ πέρας — «начало всякого зла, и причина, и конец»: три сказуемых сохранены."
  28: "εὐφραινόμενοι μεμήνασιν — «веселясь, безумствуют» (μαίνομαι — «неистовствовать»); προφητεύουσιν ψευδῆ — «пророчествуют ложное»; ζῶσιν ἀδίκως — «живут неправедно»; ἐπιορκοῦσιν ταχέως — «быстро клятвопреступают». Четыре ἤ сохранены как あるいは."
  29: "ἀψύχοις … εἰδώλοις πεποιθότες — «положившись на бездушных идолов»; κακῶς ὀμόσαντες — «плохо/неправедно поклявшись»; ἀδικηθῆναι οὐ προσδέχονται — «не ожидают, что будут наказаны» (ἀδικέω здесь «карать», ср. csl «казними быти не чают»)."
  30: "ἀμφότερα … τὰ δίκαια — «и то и другое — правые [суды]»; μετελεύσεται — «постигнет» (μετέρχομαι — «приходить, преследовать»); κακῶς ἐφρόνησαν περὶ θεοῦ — «нечестиво мыслили о Боге»; ἐν δόλῳ — «с коварством»; καταφρονήσαντες ὁσιότητος — «презрев святость/благочестие» (ὁσιότης)."
  31: "ἡ τῶν ὀμνυμένων δύναμις — «сила тех, кем клянутся», т. е. идолов; ἡ τῶν ἁμαρτανόντων δίκη — «суд/кара согрешающих»; ἐπεξέρχεται … τὴν τῶν ἀδίκων παράβασιν — «преследует преступление неправедных» (ἐπεξέρχομαι — «идти против, карать»)."
