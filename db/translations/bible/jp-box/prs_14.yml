# jp-box, Премудрость Соломона, глава 14. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для Премудрости нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 14: мореплавание и Промысл (1–7): мореход взывает к дереву, более дряхлому,
# чем его корабль, но корабль строит Премудрость, а правит им Промысл; благословенно
# дерево, через которое бывает правда. Происхождение идолослужения (8–21):
# рукотворенное проклято; идолы — мерзость и сеть; начало блуда — вымысел идолов;
# они вошли в мир по тщеславию, от скорби отца об умершем сыне, затем по приказу
# царей. Последствия нечестия (22–31): помрачение нравов, всякое зло, суд за клятвы
# идолами.
# Прямой речи нет; вся глава — авторский текст. Красного и синего нет.
# Нумерация по gr: 31 стих; деление совпадает с csl-ru и ru. В 14:16 csl вбирает
# начало гр. 14:17 («и мучителей повелением почитаема бяху изваянная»), у нас —
# по гр.; конец ст. 25 / начало ст. 26 у csl тоже иной (θόρυβος ἀγαθῶν).
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 偶像, 工匠, 律法 и пр. уже в корпусе.
# Имена — транслитерация греческого (LXX).

