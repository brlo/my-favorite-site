# jp-box, Евангелие от Марка, глава 2. Переписано по новому конвейеру.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# jp-ni не использовался.

tr_code: jp-box
book: mk
chapter: 2
draft: true

verses:
  1: "数日[すうじつ]たって、イエスはまたカファルナウムに入[はい]られた。家[いえ]にいるとの噂[うわさ]が広[ひろ]がったのである。"
  2: "すぐに多[おお]くの人[ひと]が集[あつ]まって、戸口[とぐち]のあたりにも入[はい]る場所[ばしょ]がないほどになった。イエスは彼[かれ]らに御言葉[みことば]を語[かた]っておられた。"
  3: "人々[ひとびと]は、四[よ]人[にん]に担[かつ]がれた中風[ちゅうぶ]の人[ひと]をイエスのもとへ連[つ]れて来[き]た。"
  4: "群衆[ぐんしゅう]のため、イエスのそばへ近[ちか]づけないので、イエスがおられる屋根[やね]を剥[は]がし、穴[あな]を開[あ]けて、中風[ちゅうぶ]の人[ひと]が寝[ね]ている寝台[しんだい]を吊[つ]り下[おろ]した。"
  5: "イエスは彼[かれ]らの信仰[しんこう]をご覧[らん]になって、中風[ちゅうぶ]の人[ひと]に言[い]われた。「<j>子[こ]よ、あなたの罪[つみ]は赦[ゆる]された。</j>」"
  6: "そこには律法学者[りっぽうがくしゃ]が幾人[いくにん]か座[すわ]っていて、心[こころ]の中[なか]で思[おも]い巡[めぐ]らせていた。"
  7: "「この者[もの]はなぜ、そんなことを言[い]うのか。神[かみ]を冒涜[ぼうとく]している。罪[つみ]を赦[ゆる]すことができるのは、神[かみ]ひとりだけではないか。」"
  8: "イエスはすぐ、ご自身[じしん]の霊[れい]によって、彼[かれ]らがそう思[おも]い巡[めぐ]らせているのを知[し]り、言[い]われた。「<j>なぜ、そんなことを心[こころ]の中[なか]で思[おも]い巡[めぐ]らせているのか。</j>」"
  9: "「<j>どちらがたやすいか。中風[ちゅうぶ]の人[ひと]に『あなたの罪[つみ]は赦[ゆる]された』と言[い]うことか、それとも『起[お]き上[あ]がって、寝台[しんだい]を取[と]り、歩[ある]け』と言[い]うことか。</j>"
  10: "<j>だが、人[ひと]の子[こ]が地[ち]の上[うえ]で罪[つみ]を赦[ゆる]す権威[けんい]を持[も]っていることを、あなたがたに知[し]ってもらおう。</j>」こう言[い]って、中風[ちゅうぶ]の人[ひと]に言[い]われた。"
  11: "「<j>あなたに言[い]う。起[お]きて、寝台[しんだい]を取[と]り、家[いえ]へ帰[かえ]りなさい。</j>」"
  12: "その人[ひと]は起[お]き上[あ]がり、すぐに寝台[しんだい]を取[と]って、皆[みな]の前[まえ]を出[で]て行[い]った。人々[ひとびと]は驚[おどろ]いて神[かみ]を賛美[さんび]し、「このようなことは、これまで見[み]たことがない」と言[い]った。"
  13: "イエスはまた湖[みずうみ]の岸[きし]へ出[で]て行[い]かれた。群衆[ぐんしゅう]がこぞってそばへ寄[よ]って来[き]たので、イエスは彼[かれ]らを教[おし]えておられた。"
  14: "そこを通[とお]りかかると、アルファイの子[こ]レビが徴税所[ちょうぜいしょ]に座[すわ]っているのをご覧[らん]になり、言[い]われた。「<j>わたしについて来[き]なさい。</j>」レビは立[た]ち上[あ]がってイエスに従[したが]った。"
  15: "イエスはレビの家[いえ]で食卓[しょくたく]に着[つ]いておられた。多[おお]くの徴税人[ちょうぜいにん]や罪人[ざいにん]たちも、イエスや弟子[でし]たちと一緒[いっしょ]に食卓[しょくたく]に着[つ]いていた。その数[かず]は多[おお]かった。彼[かれ]らはイエスに従[したが]って来[き]ていたのである。"
  16: "ファリサイ派[は]の律法学者[りっぽうがくしゃ]たちは、イエスが罪人[ざいにん]や徴税人[ちょうぜいにん]と一緒[いっしょ]に食事[しょくじ]をしているのを見[み]て、弟子[でし]たちに言[い]った。「あの人[ひと]はなぜ、徴税人[ちょうぜいにん]や罪人[ざいにん]と一緒[いっしょ]に食事[しょくじ]をするのか。」"
  17: "イエスはこれを聞[き]いて、彼[かれ]らに言[い]われた。「<j>医者[いしゃ]を必要[ひつよう]とするのは、丈夫[じょうぶ]な者[もの]ではなく、病気[びょうき]の人[ひと]である。わたしが来[き]たのは、正[ただ]しい人[ひと]を呼[よ]ぶためではなく、罪人[ざいにん]を〔悔[く]い改[あらた]めへと導[みちび]くために〕呼[よ]ぶためである。</j>」"
  18: "洗礼者[せんれいしゃ]ヨハネの弟子[でし]たちとファリサイ派[は]の人々[ひとびと]は断食[だんじつ]していた。人々[ひとびと]が来[き]てイエスに言[い]った。「ヨハネの弟子[でし]たちもファリサイ派[は]の弟子[でし]たちも断食[だんじつ]しているのに、あなたの弟子[でし]たちはなぜ断食[だんじつ]しないのですか。」"
  19: "イエスは言[い]われた。「<j>花婿[はなむこ]が一緒[いっしょ]にいる間[あいだ]、婚礼[こんれい]の客[きゃく]たちが断食[だんじつ]できるだろうか。花婿[はなむこ]が一緒[いっしょ]にいる間[あいだ]は、断食[だんじつ]できない。</j>"
  20: "<j>しかし、花婿[はなむこ]が彼[かれ]らから取[と]り去[さ]られる日[ひ]が来[く]る。その日[ひ]には、彼[かれ]らも断食[だんじつ]する。</j>」"
  21: "「<j>だれも、縮[ちぢ]んでいない布[ぬの]切[き]れを古[ふる]い衣[ころも]に縫[ぬ]い付[つ]けはしない。そんなことをすれば、その当[あ]て布[ぎれ]が衣[ころも]から引[ひ]きはがれて、破[やぶ]れ目[め]はもっとひどくなる。</j>"
  22: "<j>また、新[あたら]しいぶどう酒[さけ]を古[ふる]い革袋[かわぶくろ]に入[い]れる者[もの]もいない。そうすれば、ぶどう酒[さけ]が革袋[かわぶくろ]を破[やぶ]り、ぶどう酒[さけ]も革袋[かわぶくろ]もだめになる。新[あたら]しいぶどう酒[さけ]は、新[あたら]しい革袋[かわぶくろ]に入[い]れるものである。</j>」"
  23: "ある安息日[あんそくび]に、イエスは麦畑[むぎばたけ]の中[なか]を通[とお]り抜[ぬ]けられた。弟子[でし]たちは歩[ある]きながら穂[ほ]を摘[つ]み始[はじ]めた。"
  24: "ファリサイ派[は]の人々[ひとびと]がイエスに言[い]った。「ご覧[らん]なさい。安息日[あんそくび]にしてはならないことを、あの人[ひと]たちはしているではありませんか。」"
  25: "イエスは言[い]われた。「<j>ダビデが自分[じぶん]も供[とも]の者[もの]たちも困[こま]り、空腹[くうふく]だったとき、何[なに]をしたかを、あなたがたは読[よ]んだことがないのか。</j>"
  26: "<j>アビアタルが祭司長[さいしちょう]のとき、ダビデがどのように神[かみ]の家[いえ]に入[はい]り、祭司[さいし]のほかはだれも食[た]べてはならない供[そな]えのパンを食[た]べ、一緒[いっしょ]にいた者[もの]たちにも与[あた]えたか。</j>」"
  27: "そして言[い]われた。「<j>安息日[あんそくび]は人[ひと]のために設[もう]けられたのであって、人[ひと]が安息日[あんそくび]のために設[もう]けられたのではない。</j>"
  28: "<j>だから、人[ひと]の子[こ]は安息日[あんそくび]の主[しゅ]でもある。</j>」"

notes:
  1: "δι᾽ ἡμερῶν — «через несколько дней»; передал 数日たって. ἠκούσθη ὅτι ἐν οἴκῳ ἐστίν — «услышано, что Он в доме»; 家にいるとの噂が広がった."
  2: "τὸν λόγον — «слово»; 御言葉 (как в Мф 13), без «Божие»."
  4: "ἀπεστέγασαν τὴν στέγην — «сняли кровлю»; 屋根を剥がし. χαλῶσι — «опускают»; 吊り下げた. κράβαττος передаю 寝台 (носилки-постель), κλίνη в 4:21 — 寝床: разные греческие слова переданы по-разному."
  5: "ἀφίενται — настоящее время, «прощаются»; по-японски естественнее прошедшее 赦された. τέκνον — «чадо»; 子よ."
  7: "βλασφημεῖ — «богохульствует»; 冒涜している. Речь книжников — вне красного."
  8: "τῷ πνεύματι αὐτοῦ — «духом Своим»; родительный принадлежности, не «силой Духа»: ご自身の霊によって."
  10: "Речь Христа прервана повествованием (λέγει τῷ παραλυτικῷ), поэтому кавычки закрыты в 10 и открыты заново в 11."
  16: "Византийский текст: οἱ γραμματεῖς τῶν Φαρισαίων — «книжники фарисейские»; у jp-joc две группы (學士等とファリセイ等). Взято византийское чтение — одна группа."
  17: "εἰς μετάνοιαν в критическом тексте отсутствует; Церковь читает (Елизаветинская «на покаяние», jp-joc 悔改せしめん爲) — 〔、悔い改めへと導くため〕."
  18: "νηστεύοντες — имперфект, «постились»; 断食していた. Вопрос фарисеев — вне красного."
  19: "υἱοὶ τοῦ νυμφῶνος — «сыны брачного чертога», т.е. гости; 婚礼の客. Речь Христа открывается здесь и закрывается в 20."
  21: "πλήρωμα — «заплата, прибавка»; τὸ καινὸν τοῦ παλαιοῦ — «новое от старого»: 当て布が衣から引きはがれる, как в jp-joc («新しき者は舊きを壞りて»)."
  22: "ἀσκοί — мехи; 革袋. ἀπόλλυται — «погибает»; だめになる."
  23: "σπόριμα — засеянные поля; 麦畑. ὁδὸν ποιεῖν τίλλοντες — «в дороге срывали колосья»; 歩きながら穂を摘み始めた."
  25: "χρείαν ἔσχεν καὶ ἐπείνασεν — «имел нужду и взалкал»; 困り、空腹だった."
  26: "ἄρτοι τῆς προθέσεως — хлебы предложения; 供えのパン. ἐπὶ Ἀβιαθὰρ ἀρχιερέως — «при Авиатаре первосвященнике», оставлено придаточным, как в греч."
  28: "κύριος … καὶ τοῦ σαββάτου — «господин и субботы»; 主[しゅ]."
