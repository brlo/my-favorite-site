verses:
  1: "そのとき、弟子[でし]たちがイエスのもとに来[き]て言[い]った。「天[てん]の国[くに]では、いったいだれが一番[いちばん]大[おお]きい者[もの]なのでしょうか。」"
  2: "イエスは一人[ひとり]の子[こ]どもを呼[よ]び寄[よ]せて、彼[かれ]らの真[ま]ん中[なか]に立[た]たせ、"
  3: "言[い]われた。「<j>はっきり言[い]っておく。あなたがたが悔[く]い改[あらた]めて子[こ]どものようにならなければ、天[てん]の国[くに]へ入[はい]ることはできない。</j>"
  4: "<j>だから、この子[こ]どものように自分[じぶん]を低[ひく]くする者[もの]が、天[てん]の国[くに]で一番[いちばん]大[おお]きい者[もの]である。</j>"
  5: "<j>だれでも、わたしの名[な]のためにこのような子[こ]どもを一人[ひとり]でも受[う]け入[い]れるなら、その人[ひと]はわたしを受[う]け入[い]れているのである。</j>」"
  6: "「<j>わたしを信[しん]じるこの小[ちい]さな者[もの]の一人[ひとり]をつまずかせる者[もの]は、ろばの引[ひ]く大[おお]きな石臼[いしうす]を首[くび]に懸[か]けられて、海[うみ]の深[ふか]みに沈[しず]められたほうがよい。</j>"
  7: "<j>つまずきのゆえに、世[よ]は不幸[ふこう]である。つまずきは必[かなら]ず来[く]るものだが、つまずきをもたらすその人[ひと]は不幸[ふこう]である。</j>"
  8: "<j>もし、あなたの手[て]や足[あし]があなたをつまずかせるなら、それを切[き]り落[お]として、あなたから捨[す]ててしまいなさい。手足[てあし]の不自由[ふじゆう]な者[もの]になって命[いのち]に入[はい]るほうが、両手[りょうて]両足[りょうあし]のまま永遠[えいえん]の火[ひ]に投[な]げ込[こ]まれるより、あなたにとってよい。</j>"
  9: "<j>もし、あなたの目[め]があなたをつまずかせるなら、それを抜[ぬ]き出[だ]して、あなたから捨[す]ててしまいなさい。片目[かため]で命[いのち]に入[はい]るほうが、両目[りょうめ]のまま火[ひ]の地獄[じごく]に投[な]げ込[こ]まれるより、あなたにとってよい。</j>」"
  10: "「<j>この小[ちい]さな者[もの]の一人[ひとり]をも見下[みくだ]してはならない。言[い]っておく。彼[かれ]らの天使[てんし]たちは天[てん]で、いつも天[てん]におられるわたしの父[ちち]の顔[かお]を仰[あお]いでいる。</j>"
  11: "〔<j>人[ひと]の子[こ]は、滅[ほろ]びる者[もの]を救[すく]うために来[き]たのである。</j>〕"
  12: "<j>あなたがたはどう思[おも]うか。ある人[ひと]に百匹[ひゃっぴき]の羊[ひつじ]がいて、その一匹[いっぴき]が迷[まよ]い出[で]たら、その人[ひと]は九十九匹[くじゅうきゅうひき]を山[やま]に残[のこ]して、迷[まよ]い出[で]た一匹[いっぴき]を捜[さが]しに行[い]かないだろうか。</j>"
  13: "<j>そして、見[み]つけたなら、はっきり言[い]っておく。彼[かれ]は、迷[まよ]わなかった九十九匹[くじゅうきゅうひき]よりも、その一匹[いっぴき]のことを喜[よろこ]ぶのである。</j>"
  14: "<j>そのように、この小[ちい]さな者[もの]の一人[ひとり]が滅[ほろ]びることは、天[てん]におられるあなたがたの父[ちち]の御心[みこころ]ではない。</j>」"
  15: "「<j>もし、あなたの兄弟[きょうだい]が〔あなたに対して〕罪[つみ]を犯[おか]したなら、行[い]って、二人[ふたり]だけのところでその人[ひと]を戒[いまし]めなさい。その人[ひと]が聞[き]き入[い]れるなら、あなたは兄弟[きょうだい]を得[え]たのである。</j>"
  16: "<j>聞[き]き入れないなら、もう一人[ひとり]か二人[ふたり]を伴[ともな]って行[い]きなさい。『二人[ふたり]また三人[さんにん]の証人[しょうにん]の口[くち]によって、すべての事[こと]が定[さだ]まる』ためである。</j>"
  17: "<j>彼[かれ]らに聞[き]き入れないなら、教会[きょうかい]に告[つ]げなさい。教会[きょうかい]にも聞[き]き入れないなら、その人[ひと]を異邦人[いほうじん]や徴税人[ちょうぜいにん]のように扱[あつか]いなさい。</j>"
  18: "<j>はっきり言[い]っておく。あなたがたが地[ち]で縛[しば]ることは何[なん]でも天[てん]でも縛[しば]られ、あなたがたが地[ち]で解[と]くことは何[なん]でも天[てん]でも解[と]かれる。</j>"
  19: "<j>また言[い]っておく。あなたがたのうち二人[ふたり]が、地[ち]の上[うえ]でどんなことでも心[こころ]を合[あ]わせて求[もと]めるなら、天[てん]におられるわたしの父[ちち]がそれをかなえてくださる。</j>"
  20: "<j>わたしの名[な]のために二人[ふたり]、三人[さんにん]が集[あつ]まる所[ところ]には、わたしも彼[かれ]らの真[ま]ん中[なか]にいるからである。</j>」"
  21: "そのとき、ペトロが近[ちか]づいて来[き]て言[い]った。「主[しゅ]よ、兄弟[きょうだい]がわたしに罪[つみ]を犯[おか]したら、何度[なんど]まで赦[ゆる]すべきでしょうか。七[なな]度[たび]までですか。」"
  22: "イエスは言[い]われた。「<j>七度[ななたび]までと言[い]うのではない。七十[しちじゅう]の七倍[ななばい]までである。</j>」"
  23: "「<j>だから、天[てん]の国[くに]は、自分[じぶん]の僕[しもべ]たちと決算[けっさん]をしようとした王[おう]に似[に]ている。</j>"
  24: "<j>決算[けっさん]を始[はじ]めると、一万[いちまん]タラント⟨大[おお]きな金額[きんがく]の単位[たんい]。一[いち]タラントは労働者[ろうどうしゃ]の六千日分[ろくせんにちぶん]の賃金[ちんぎん]に当[あ]たる。⟩の借金[しゃっきん]がある者[もの]が一人[ひとり]、王[おう]の前[まえ]に引[き]き出[だ]された。</j>"
  25: "<j>返[かえ]すことができなかったので、王[おう]は、この人[ひと]とその妻[つま]と子[こ]ども、そして持[も]っているすべてのものを売[う]って、返[かえ]させるように命[めい]じた。</j>"
  26: "<j>そこで、僕[しもべ]はひれ伏[ふ]して、『どうか、しばらくお待[ま]ちください。すべてお返[かえ]しします』と言[い]った。</j>"
  27: "<j>僕[しもべ]の主人[しゅじん]は深[ふか]く憐[あわ]れみ、その人[ひと]を放[はな]してやり、借金[しゃっきん]も免除[めんじょ]した。</j>"
  28: "<j>ところが、その僕[しもべ]は外[そと]へ出[で]ると、自分[じぶん]に百[ひゃく]デナリオン⟨ローマの銀貨[ぎんか]。労働者[ろうどうしゃ]の一日分[いちにちぶん]の賃金[ちんぎん]。⟩の借[か]りがある同[おな]じ僕[しもべ]の一人[ひとり]に出会[であ]い、その人[ひと]を捕[つか]まえて首[くび]を絞[し]め、『借[か]りを返[かえ]せ』と言[い]った。</j>"
  29: "<j>同[おな]じ僕[しもべ]はひれ伏[ふ]して、『どうか、しばらくお待[ま]ちください。お返[かえ]しします』と頼[たの]んだ。</j>"
  30: "<j>しかし、その僕[しもべ]は応[おう]じず、むしろ行[い]って、借金[しゃっきん]を返[かえ]すまでその人[ひと]を牢[ろう]に入[い]れた。</j>"
  31: "<j>ほかの僕[しもべ]たちは、この一部始終[いちぶしじゅう]を見[み]て非常[ひじょう]に心[こころ]を痛[いた]め、王[おう]のところへ行[い]って、起[お]こったことをすべて告[つ]げた。</j>"
  32: "<j>そこで、王[おう]はその僕[しもべ]を呼[よ]びつけて言[い]った。『悪[わる]い僕[しもべ]よ。お前[まえ]が頼[たの]んだので、あの借金[しゃっきん]はすべて免除[めんじょ]してやったのだ。</j>"
  33: "<j>わたしがお前[まえ]を憐[あわ]れんだように、お前[まえ]も同[おな]じ僕[しもべ]を憐[あわ]れむべきではなかったか。』</j>"
  34: "<j>王[おう]は怒[いか]って、その僕[しもべ]を拷問[ごうもん]する者[もの]たちに引[き]き渡[わた]し、借金[しゃっきん]をすべて返[かえ]すまで責[せ]め苦[くる]しめさせた。</j>"
  35: "<j>わたしの天[てん]の父[ちち]も、あなたがたがそれぞれ心[こころ]から兄弟[きょうだい]を赦[ゆる]さなければ、あなたがたに同[おな]じことをなさるであろう。</j>」"

notes:
  3: "στραφῆτε — «обратитесь, повернитесь»; передал 悔い改めて (в переводе 悔い改め — μετάνοια), иначе по-японски «повернуться» без объекта не читается как обращение."
  6: "μύλος ὀνικός — «жёрнов, который вращает осёл»; ろばの引く大きな石臼 — точнее, чем просто 大きな石臼 в Мк 9:42."
  7: "οὐαὶ τῷ κόσμῳ ἀπὸ τῶν σκανδάλων — «горе миру от соблазнов»; 不幸, как в 11:21 (οὐαί)."
  8: "κυλλὸν ἢ χωλόν — «увечным или хромым»; 手足の不自由な者, как 15:30 (κυλλούς/χωλούς). εἰς τὴν ζωήν — 命に入る, не 天の国."
  9: "γέεννα τοῦ πυρός — 火の地獄, как 5:22."
  10: "βλέπουσι τὸ πρόσωπον τοῦ πατρός μου — «видят лицо Отца Моего»; 顔を仰いでいる, без сглаживания."
  11: "Стиха нет в критической базе (как Мк 9:44); Церковь читает (Елизаветинская, jp-joc) — весь стих в 〔…〕."
  15: "εἰς σὲ в критической базе под скобками; Церковь читает «согрешит против тебя» (Елизаветинская, jp-joc) — 〔あなたに対して〕."
  16: "Цитата Втор 19:15 в 『』 (речь Христа 「」 → Писание 『』), как 15:8–9."
  17: "ἐκκλησία — 教会; здесь и в 16:18 единственные места в Мф, где слово значит собрание общины. ἐθνικὸς καὶ τελώνης — 異邦人や徴税人."
  22: "ἑβδομηκοντάκις ἑπτά можно понять и как «семьдесят семь»; держусь церковного чтения (Елизаветинская «седмьдесят крат седмерицею», jp-joc 七十次の七倍) — 七十の七倍."
  24: "μυρίων ταλάντων — «десять тысяч талантов»; タラント — сноска при первом упоминании в книге, с масштабом (талант ≈ 6000 дневных плат работника)."
  26: "Μακροθύμησον ἐπ᾽ ἐμοί — «потерпи на мне»; しばらくお待ちください, без сглаживания в «прости». Вложенная речь притчи — 『』."
  28: "σύνδουλος — 同[おな]じ僕. ἑκατὸν δηνάρια — 百デナリオン, сноска (первое упоминание в Мф; в Мк 6:37 сноска уже была). ἐπνιγεν — имперфект «душил»; 首を絞め."
  34: "βασανισταί — «истязатели, тюремщики»; 拷問する者たち, не «слуги»."
  35: "ἀπὸ τῶν καρδιῶν ὑμῶν — «от сердец ваших»; 心から, без ослабления."
