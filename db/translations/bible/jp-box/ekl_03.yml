# jp-box, Екклесиаст, глава 3. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru); ru (Синодальный)
# только для понимания. jp-joc в Екклесиасте отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 3: времена и сроки (1–8), труд человека (9–11), благо в труде и дар Божий (12–15),
# суд Божий и участь человека наравне со скотом (16–22).
# Красного и синего нет: речь Екклесиаста от первого лица — без кавычек; его собственные
# слова, приведённые в тексте (17), — в 「…」; чужая речь — 「…」 (в этой главе нет).
# В 18 речь передана косвенно (ὅτι), поэтому без кавычек.
# 〔…〕 нет: все слова в gr-lxx-byz есть; славянские добавления («тамо» в 17) отмечены в notes.
# Параллелизм 1–8 сохранён: каждая пара — 時…時.
# πνεῦμα: в 19 — «дух/дыхание» (霊), в 21 — «дух человека» (人の霊); это не «ветер».
# jp-ni не использовался.

tr_code: jp-box
book: ekl
chapter: 3
draft: true

verses:
  1: "すべてのものに時[とき]があり、天[てん]の下[した]のすべての事[こと]に、それぞれの時[とき]がある。"
  2: "生[う]む時[とき]があり、死[し]ぬ時[とき]がある。植[う]える時[とき]があり、植[う]えたものを引[ひ]き抜[ぬ]く時[とき]がある。"
  3: "殺[ころ]す時[とき]があり、癒[いや]す時[とき]がある。壊[こわ]す時[とき]があり、建[た]てる時[とき]がある。"
  4: "泣[な]く時[とき]があり、笑[わら]う時[とき]がある。嘆[なげ]く時[とき]があり、踊[おど]る時[とき]がある。"
  5: "石[いし]を投[な]げる時[とき]があり、石[いし]を集[あつ]める時[とき]がある。抱[だ]く時[とき]があり、抱[だ]くことを遠[とお]ざける時[とき]がある。"
  6: "探[さが]す時[とき]があり、失[うしな]う時[とき]がある。保[たも]つ時[とき]があり、捨[す]てる時[とき]がある。"
  7: "裂[さ]く時[とき]があり、縫[ぬ]う時[とき]がある。黙[だま]る時[とき]があり、語[かた]る時[とき]がある。"
  8: "愛[あい]する時[とき]があり、憎[にく]む時[とき]がある。戦[たたか]いの時[とき]があり、平和[へいわ]の時[とき]がある。"
  9: "働[はたら]く者[もの]は、自分[じぶん]が労苦[ろうく]する中[なか]で、何[なに]の益[えき]を持[も]つのか。"
  10: "わたしは、神[かみ]が人[ひと]の子[こ]らに与[あた]えられた務[つと]めを見[み]た。それは、人[ひと]の子[こ]らがそれに携[たずさ]わるためである。"
  11: "神[かみ]はすべてを、それぞれの時[とき]に美[うつく]しく造[つく]られた。また、永遠[えいえん]を人[ひと]の心[こころ]に置[お]かれた。それは、人[ひと]が、神[かみ]のなさった業[わざ]を、始[はじ]めから終[お]わりまで見[み]極[きわ]めることができないためである。"
  12: "わたしは知[し]った。人[ひと]には、喜[よろこ]ぶこと、その命[いのち]のうちに善[よ]いことを行[おこな]うことのほかに、善[よ]いことはない。"
  13: "また、すべての人[ひと]が食[た]べ、飲[の]み、そのすべての労苦[ろうく]のうちに善[よ]いものを見[み]るなら、それは神[かみ]の賜[たま]物[もの]である。"
  14: "わたしは知[し]った。神[かみ]がなさったすべては、永遠[えいえん]に至[いた]るまで、そのままである。それに加[くわ]えることはできず、それから取[と]り去[さ]ることもできない。神[かみ]は、ご自分[じぶん]の御前[みまえ]で人[ひと]が畏[おそ]れるように、そうされたのである。"
  15: "すでにあったことは今[いま]もある。これから生[しょう]じることも、すでに生[しょう]じている。神[かみ]は、追[お]われた者[もの]を求[もと]めておられる。"
  16: "また、わたしは日[ひ]の下[もと]で見[み]た。裁[さば]きの場所[ばしょ]があり、そこには悪[わる]い者[もの]がいる。正[ただ]しい者[もの]の場所[ばしょ]があり、そこにも悪[わる]い者[もの]がいる。"
  17: "わたしは心[こころ]のうちに言[い]った。「神[かみ]は正[ただ]しい者[もの]も悪[わる]い者[もの]も裁[さば]かれる。すべての事[こと]に時[とき]があり、すべての業[わざ]にも時[とき]があるからである」と。"
  18: "わたしは人[ひと]の子[こ]らの語[かた]りについて、心[こころ]のうちに言[い]った。神[かみ]が彼[かれ]らを裁[さば]き分[わ]け、彼[かれ]ら自身[じしん]が獣[けもの]にすぎないことを示[しめ]される、と。"
  19: "人[ひと]の子[こ]らの成[な]り行[ゆ]きと獣[けもの]の成[な]り行[ゆ]きは同[おな]じである。一[ひと]つの成[な]り行[ゆ]きが彼[かれ]らにある。一方[いっぽう]が死[し]ぬように、他方[たほう]も死[し]ぬ。霊[れい]もすべてのものに一[ひと]つである。人[ひと]は獣[けもの]にまさって何[なに]の益[えき]があるのか。何[なに]もない。すべては空[むな]しいからである。"
  20: "すべては一[ひと]つの場所[ばしょ]へ行[い]く。すべては塵[ちり]から生[う]まれ、すべては塵[ちり]に帰[かえ]る。"
  21: "人[ひと]の子[こ]らの霊[れい]が上[うえ]へ昇[のぼ]るのか、獣[けもの]の霊[れい]が下[した]へ、地[ち]へ降[お]りるのか、だれが知[し]ろうか。"
  22: "わたしは見[み]た。人[ひと]がその業[わざ]のうちで喜[よろこ]ぶことのほかに、善[よ]いことはない。それがその人[ひと]の受[う]け持[も]ち分[ぶん]だからである。その人[ひと]の後[あと]に何[なに]が起[お]こるかを、だれがその人[ひと]に見[み]せてくれるだろうか。"

notes:
  1: "Τοῖς πᾶσιν χρόνος, καὶ καιρὸς τῷ παντὶ πράγματι — всему время, и время всякой вещи. χρόνος — «время» (длительность), καιρός — «пора, срок» (時, ср. 3:17); в японском оба переданы 時, различие оговорено здесь."
  2: "καιρὸς τοῦ τεκεῖν — время рождать (τίκτω). καιρὸς τοῦ ἀποθανεῖν — время умирать. ἐκτῖλαι πεφυτευμένον — вырвать посаженное (ἐκτίλλω — выдёргивать)."
  3: "ἀποκτεῖναι — убить; ἰάσασθαι — исцелить (ἰάομαι; 癒[いや]す). καθελεῖν — разрушить (καθαιρέω); οἰκοδομῆσαι — построить."
  4: "κλαῦσαι — плакать; γελᾶσαι — смеяться. κόψασθαι — бить себя в грудь, рыдать (κόπτομαι; 嘆[なげ]く); ὀρχήσασθαι — плясать (ὀρχέομαι; 踊[おど]る)."
  5: "βαλεῖν λίθους… συναγαγεῖν λίθους — бросать камни… собирать камни; обычай не поясняется, двусмысленность сохранена. περιλαβεῖν — обнять; μακρυνθῆναι ἀπὸ περιλήμψεως — удалиться от объятия."
  6: "ζητῆσαι — искать; ἀπολέσαι — погубить, потерять. φυλάξαι — хранить; ἐκβαλεῖν — выбросить (слав. «отреяти»)."
  7: "ῥῆξαι — разодрать; ῥάψαι — сшить. σιγᾶν — молчать; λαλεῖν — говорить."
  8: "φιλῆσαι — любить (φιλέω, о любви-дружбе); μισῆσαι — ненавидеть. καιρὸς πολέμου καὶ καιρὸς εἰρήνης — время войны и время мира (без глагола, как в греч.)."
  9: "τίς περισσεία τοῦ ποιοῦντος — какая прибыль делающему (περισσεία — 益; ср. 1:3; 2:11). ἐν οἷς αὐτὸς μοχθεῖ — в том, над чем он трудится."
  10: "τὸν περισπασμόν — занятие, заботу (περισπασμός; слав. «попечение»). τοῦ περισπᾶσθαι ἐν αὐτῷ — чтобы упражняться в нём. Ср. 1:13."
  11: "σὺν τὰ πάντα ἐποίησεν καλὰ ἐν καιρῷ αὐτοῦ — всё соделал прекрасным в своё время. τὸν αἰῶνα ἔδωκεν ἐν καρδίᾳ αὐτῶν — «век/вечность вложил в сердце их» (αἰών — 永遠; слав. «всякий век дал есть в сердце их»; Синодальный «вложил мир» — по масоретскому עֹלָם). ὅπως μὴ εὕρῃ — чтобы не постиг (εὑρίσκω — находить). ἀπ᾽ ἀρχῆς καὶ μέχρι τέλους — от начала и до конца."
  12: "οὐκ ἔστιν ἀγαθὸν ἐν αὐτοῖς — нет блага в них. εἰ μὴ τοῦ εὐφρανθῆναι — кроме как веселиться (εὐφραίνομαι; 喜[よろこ]び). ποιεῖν ἀγαθὸν ἐν ζωῇ αὐτοῦ — делать доброе в жизни своей."
  13: "ὃς φάγεται καὶ πίεται καὶ ἴδῃ ἀγαθὸν ἐν παντὶ μόχθῳ αὐτοῦ — кто ест и пьёт и видит доброе во всяком труде своём. δόμα θεοῦ — дар Божий (δόμα; 賜[たま]物[もの])."
  14: "αὐτὰ ἔσται εἰς τὸν αἰῶνα — то будет в век. ἐπ᾽ αὐτῷ οὐκ ἔστιν προσθεῖναι — к тому нельзя прибавить; ἀπ᾽ αὐτοῦ οὐκ ἔστιν ἀφελεῖν — от того нельзя отнять. ἵνα φοβηθῶσιν ἀπὸ προσώπου αὐτοῦ — чтобы убоялись от лица Его; передано 御前[みまえ]で畏[おそ]れる (φοβεῖσθαι τὸν θεόν — 神を畏れる, ср. 5:6; 7:18)."
  15: "τὸ γενόμενον ἤδη ἐστίν — бывшее уже есть. ὅσα τοῦ γίνεσθαι — что имеет быть. ὁ θεὸς ζητήσει τὸν διωκόμενον — «Бог взыщет гонимого» (διώκω — гнать); тёмное место LXX, слав. то же; Синодальный по масоретскому «Бог воззовёт прошедшее». Переведено буквально."
  16: "τόπον τῆς κρίσεως… τόπον τοῦ δικαίου — место суда… место праведного. В греч. дважды ὁ ἀσεβής («нечестивый»), слав. во втором случае «благочестивый» — расхождение; повтор греч. сохранён. Синодальный: «место правды, а там неправда»."
  17: "σὺν τὸν δίκαιον καὶ σὺν τὸν ἀσεβῆ κρινεῖ ὁ θεός — праведного и нечестивого будет судить Бог. καιρὸς τῷ παντὶ πράγματι καὶ ἐπὶ παντὶ τῷ ποιήματι — время всякой вещи и над всяким делом (эллипсис; слав. добавляет «тамо»). Собственные слова — в 「…」."
  18: "περὶ λαλιᾶς υἱῶν τοῦ ἀνθρώπου — о речах сынов человеческих (λαλιά — речь, разговор; слав. «о глаголании»). διακρινεῖ αὐτοὺς ὁ θεός — Бог различит (рассудит) их (διακρίνω). τοῦ δεῖξαι ὅτι αὐτοὶ κτήνη εἰσίν — чтобы показать, что они сами — скоты (κτῆνος — 獣)."
  19: "συνάντημα ἓν αὐτοῖς — одна участь им (см. 2:14). ὡς ὁ θάνατος τούτου, οὕτως ὁ θάνατος τούτου — как смерть того, так смерть этого. πνεῦμα ἓν τοῖς πᾶσιν — дух (дыхание) один у всех; здесь πνεῦμα — не «ветер», а жизненное дыхание, поэтому 霊[れい], ср. 3:21. τί ἐπερίσσευσεν ὁ ἄνθρωπος παρὰ τὸ κτῆνος — какое преимущество у человека перед скотом."
  20: "τὰ πάντα πορεύεται εἰς τόπον ἕνα — всё идёт в одно место. ἀπὸ τοῦ χοός… εἰς τὸν χοῦν — из праха… в прах (χοῦς — 塵[ちり]; ср. Быт 3:19)."
  21: "τίς οἶδεν πνεῦμα υἱῶν τοῦ ἀνθρώπου εἰ ἀναβαίνει… — кто знает, дух сынов человеческих восходит ли… Здесь πνεῦμα — «дух человека» (人の霊[れい]), не ветер; ср. 2:11, 17, 26 и 4:4, 6, 16, где πνεῦμα — ветер (風[かぜ]). εἰ — вводное «ли»."
  22: "οὐκ ἔστιν ἀγαθὸν εἰ μὴ ὃ εὐφρανθήσεται ὁ ἄνθρωπος ἐν ποιήμασιν αὐτοῦ — нет блага, кроме того, что человек будет веселиться в делах своих. μερὶς αὐτοῦ — доля его (受[う]け持[も]ち分[ぶん]). τίς ἄξει αὐτὸν τοῦ ἰδεῖν… — кто приведёт его увидеть, что будет после него (ἄγω — вести)."
