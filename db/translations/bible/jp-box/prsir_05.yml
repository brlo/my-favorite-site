# jp-box, Сирах, глава 5. Черновик для приёмки.
#
# --- ПЕРЕНОМЕРОВАНО под славяно-синодальную нумерацию (csl-ru) ---
# Глава 5: 18 стихов (было 15 по LXX).
# Соответствие: наш 6 → csl 6, 7; наш 7 → csl 8, 9; наш 8 → csl 10; наш 9 → csl 11; наш 10 → csl 12; наш 11 → csl 13; наш 12 → csl 14; наш 13 → csl 15; наш 14 → csl 16, 17; наш 15 → csl 18.
# Текст сохранён: стихи разрезаны/соединены по границам csl; где csl
# короче LXX, стихи LXX сохранены при соседнем csl-стихе (отмечено в notes).
# Ниже — прежняя шапка: номера в ней — прежние (по LXX/gr), notes — по прежним номерам.
#
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для книги нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 5: не полагаться на богатство и не откладывать обращения (1–8); язык,
# двоязычие и дурная слава (9–15).
# Прямая речь — слова, которых не должно говорить: 5:1, 3, 4, 6, в 「…」; прочее —
# авторский текст без кавычек. Красного и синего нет.
# Нумерация по gr: 15 стихов. У csl 18: он дробит gr 5:6 (csl 6–7), 5:7 (8–9),
# 5:14 (16–17), а gr 5:15 слав. делит между 5:18 и 6:1. Лишние слав. стихи влиты
# в соседние греческие: csl 5:7 → 5:6, csl 5:9 → 5:7, csl 5:17 → 5:14, csl 5:18 →
# 5:15; вторая половина gr 5:15 стоит у слав. в 6:1 (где в gr «.»), поэтому наш
# 5:15 переведён по гр целиком; в 6:1 тот же текст переведён по csl 6:1 — дубль, отмечено в notes.
# 〔…〕 нет: все 15 стихов есть в gr-lxx-byz. Сносок ⟨…⟩ нет: 悟り, 寛容, 隣人,
# 財産 уже в корпусе. Имён и топонимов в главе нет.

tr_code: jp-box
book: prsir
chapter: 5
draft: true

verses:
  1: "自分[じぶん]の財産[ざいさん]に頼[たよ]るな。「わたしにはこれで十分[じゅうぶん]だ」と言[い]ってはならない。"
  2: "自分[じぶん]の魂[たましい]と力[ちから]に従[したが]って、心[こころ]の欲[よく]のままに歩[あゆ]むな。"
  3: "「だれがわたしを力[ちから]で支配[しはい]するのか」と言[い]ってはならない。主[しゅ]は報[むく]いをする方[かた]であり、必[かなら]ず報いられるからである。"
  4: "「わたしは罪[つみ]を犯[おか]したが、わたしに何[なに]が起[お]こったのか」と言ってはならない。主[しゅ]は寛容[かんよう]な方[かた]であるからである。"
  5: "贖[あがな]いがあるからといって、罪[つみ]の上[うえ]に罪を重[かさ]ねることを恐[おそ]れない者[もの]となってはならない。"
  6: "「そのあわれみは多[おお]きいので、わたしの多[おお]くの罪[つみ]を贖[あがな]ってくださる」と言ってはならない。"
  7: "その方[かた]にはあわれみも怒[いか]りもあり、罪人[つみびと]たちの上[うえ]にその憤[いきどお]りがとどまるからである。"
  8: "主[しゅ]に立[た]ち返[かえ]るのをためらうな。日[ひ]から日[ひ]へと延[の]ばすな。"
  9: "主の怒[いか]りは突然[とつぜん]に現[あらわ]れ、報[むく]いの時[とき]にあなたは滅[ほろ]ぼされるからである。"
  10: "不[ふ]正[せい]な財産[ざいさん]に頼[たよ]るな。それは災[わざわ]いの日[ひ]に何[なに]の役[やく]にも立[た]たないからである。"
  11: "あらゆる風[かぜ]に自分[じぶん]をさらすな。あらゆる小道[こみち]を歩[あゆ]むな。二枚舌[にまいじた]の罪人[つみびと]はそのような者[もの]である。"
  12: "自分[じぶん]の悟[さと]りにおいて堅[かた]く立[た]ち、あなたの言葉[ことば]を一[ひと]つにせよ。"
  13: "聞[き]くことには速[はや]くあれ、答[こた]えは寛容[かんよう]をもって語[かた]れ。"
  14: "あなたに悟[さと]りがあるなら、隣人[りんじん]に答[こた]えよ。ないなら、あなたの手を口[くち]に当[あ]てよ。"
  15: "語[かた]りの中[なか]に栄光[えいこう]も辱[はずかし]めもあり、人[ひと]の舌[した]はその人[ひと]の堕落[だらく]となる。"
  16: "陰[かげ]で囁[ささや]く者[もの]と呼ばれるな。あなたの舌[した]で人[ひと]を陥[おとしい]れようと待[ま]ち伏[ぶ]せるな。"
  17: "盗人[ぬすびと]には恥[はじ]があり、二枚舌[にまいじた]の者[もの]には悪[わる]い非難[ひなん]がつきまとうからである。"
  18: "大[おお]きなことにも小[ちい]さなことにも無知[むち]であってはならない。友[とも]に代[か]わって敵[てき]となってはならない。悪[わる]い名[な]は恥[はじ]とそしりを受[う]け継[つ]ぐからである。二枚舌[にまいじた]の罪人[つみびと]はそのような者[もの]である。"

notes:
  1: "Μὴ ἔπεχε ἐπὶ τοῖς χρήμασίν σου — «не полагайся на имущество твоё» (ἐπέχω τινί — держаться за что-л., полагаться); χρήματα — имущество, деньги; Αὐτάρκη μοί ἐστιν — «достаточно мне» (αὐτάρκης — довольный, достаточный), слова, которых не должно говорить, — в 「…」."
  2: "μὴ ἐξακολούθει τῇ ψυχῇ σου — «не следуй душе твоей» (ἐξακολουθέω — следовать); τῇ ἰσχύι σου — «крепости твоей»; πορεύεσθαι ἐν ἐπιθυμίαις καρδίας σου — «ходить в похотях сердца твоего» (ἐπιθυμία — вожделение, желание)."
  3: "Τίς με δυναστεύσει — «кто мною овладеет, кто будет господствовать надо мной» (δυναστεύω — господствовать, иметь власть), слав. «кто мя преможет»; ὁ κύριος ἐκδικῶν ἐκδικήσει — «Господь мстящий отмстит» (ἐκδικέω — мстить, взыскивать), усилительный оборот с однокоренным причастием и глаголом."
  4: "Ἥμαρτον, καὶ τί μοι ἐγένετο — «согрешил, и что мне было»; ὁ κύριός ἐστιν μακρόθυμος — «Господь долготерпелив» (μακρόθυμος), передано 寛容な方. Слова мнимой безнаказанности — в 「…」."
  5: "περὶ ἐξιλασμοῦ — «об умилостивлении» (ἐξιλασμός — умилостивление, очищение); μὴ ἄφοβος γίνου — «не будь бесстрашен» (ἄφοβος); προσθεῖναι ἁμαρτίαν ἐφ᾽ ἁμαρτίαις — «приложить грех к грехам» (προστίθημι)."
  6: "Ὁ οἰκτιρμὸς αὐτοῦ πολύς — «милосердие Его велико» (οἰκτιρμός); τὸ πλῆθος τῶν ἁμαρτιῶν μου ἐξιλάσεται — «множество грехов моих умилостивит» (πλῆθος); ἔλεος γὰρ καὶ ὀργὴ παρ᾽ αὐτῷ — «ибо милость и гнев у Него»; ἐπὶ ἁμαρτωλοὺς καταπαύσει ὁ θυμὸς αὐτοῦ — «на грешников почиет ярость Его» (καταπαύω — успокаиваться, почивать). Слав. делит стих на csl 5:6–7."
  7: "Продолжение ст. 6 (тот же стих по-гречески)."
  8: "μὴ ἀνάμενε ἐπιστρέψαι πρὸς κύριον — «не медли обратиться к Господу» (ἀναμένω — ждать, медлить); μὴ ὑπερβάλλου ἡμέραν ἐξ ἡμέρας — «не отлагай день от дня» (ὑπερβάλλω — перекладывать, откладывать); ἐξάπινα — «внезапно»; ἐν καιρῷ ἐκδικήσεως ἐξολῇ — «во время отмщения погибнешь» (ἐξόλλυμι — истреблять). Слав. делит стих на csl 5:8–9."
  9: "Продолжение ст. 8 (тот же стих по-гречески)."
  10: "ἐπὶ χρήμασιν ἀδίκοις — «на имущество неправедное» (ἄδικος — неправедный); οὐδὲν ὠφελήσει σε — «ничем не поможет тебе» (ὠφελέω); ἐν ἡμέρᾳ ἐπαγωγῆς — «в день наведения», т. е. бедствия."
  11: "μὴ λίκμα ἐν παντὶ ἀνέμῳ — «не вейся (не рассеивайся) при всяком ветре» (λίκμα — веять, рассеивать); μὴ πορεύου ἐν πάσῃ ἀτραπῷ — «не ходи всякою тропою» (ἀτραπός — тропа); ὁ δίγλωσσος — «двоязычный», двуличный, передано 二枚舌 (как в 6:1 и по корпусу)."
  12: "ἴσθι ἐστηριγμένος ἐν συνέσει σου — «будь утверждён в разумении твоём» (στηρίζω — утверждать; σύνεσις — разумение); εἷς ἔστω σου ὁ λόγος — «одно да будет слово твоё»."
  13: "Γίνου ταχὺς ἐν ἀκροάσει σου — «будь скор в слушании твоём» (ἀκρόασις — слушание); ἐν μακροθυμίᾳ φθέγγου ἀπόκρισιν — «с долготерпением произноси ответ» (φθέγγομαι — говорить, произносить; ἀπόκρισις — ответ)."
  14: "εἰ ἔστιν σοι σύνεσις — «если есть тебе разумение»; ἀποκρίθητι τῷ πλησίον — «ответь ближнему» (πλησίον — ближний); ἡ χείρ σου ἔστω ἐπὶ τῷ στόματί σου — «рука твоя да будет на устах твоих», знак молчания."
  15: "δόξα καὶ ἀτιμία ἐν λαλιᾷ — «слава и бесчестие в беседе» (λαλιά — речь, беседа); γλῶσσα ἀνθρώπου πτῶσις αὐτῷ — «язык человека — падение ему» (πτῶσις — падение)."
  16: "Μὴ κληθῇς ψίθυρος — «не назовись шепотником, наушником» (ψίθυρος — шепчущий, клеветник); τῇ γλώσσῃ σου μὴ ἐνέδρευε — «языком твоим не подстерегай» (ἐνεδρεύω — устраивать засаду); ἐπὶ τῷ κλέπτῃ αἰσχύνη — «на воре стыд» (κλέπτης — вор); κατάγνωσις πονηρὰ ἐπὶ διγλώσσου — «злое порицание на двоязычного» (κατάγνωσις — осуждение). Слав. делит стих на csl 5:16–17."
  17: "Продолжение ст. 16 (тот же стих по-гречески)."
  18: "ἐν μεγάλῳ καὶ ἐν μικρῷ μὴ ἀγνόει — «в великом и малом не невежествуй» (ἀγνοέω — не знать); ἀντὶ φίλου μὴ γίνου ἐχθρός — «вместо друга не стань врагом» (ἐχθρός — враг); ὄνομα πονηρὸν αἰσχύνην καὶ ὄνειδος κληρονομήσει — «злое имя наследует стыд и поношение» (ὄνειδος — поношение); οὕτως ὁ ἁμαρτωλὸς ὁ δίγλωσσος — «таков грешник двоязычный». Слав. 5:18 содержит только первую половину («О велице и о мале не неразумевай»), остальное стоит у слав. в 6:1 (где в gr «.»); наш стих переведён по гр целиком ради полноты базы; в главе 6 тот же текст переведён в 6:1 по csl 6:1 (в gr там «.»), поэтому 5:15 и 6:1 дают дубль — при приёмке решить, оставить оба свидетельства или снять один из них."
