verses:
  0: "指揮者[しきしゃ]のために。ダビデの詩[うた]。"
  1: "主[しゅ]が苦[くる]しみの日[ひ]にあなたに答[こた]え、ヤコブの神[かみ]の名[な]があなたを守[まも]られるように。"
  2: "主[しゅ]が聖所[せいしょ]からあなたに助[たす]けを送[おく]り、シオンからあなたを支[ささ]えられるように。"
  3: "主[しゅ]があなたのすべての供[そな]え物[もの]を覚[おぼ]え、あなたの焼[や]き尽[つ]くす供[そな]え物[もの]を肥[こ]えたものとなさるように。"
  4: "主[しゅ]があなたの心[こころ]にかなうものを与[あた]え、あなたのすべての計画[けいかく]を満[み]たされるように。"
  5: "わたしたちはあなたの救[すく]いを喜[よろこ]び、わたしたちの神[かみ]の名[な]によって高[たか]く上[あ]げられる。主[しゅ]があなたのすべての願[ねが]いを満[み]たされるように。"
  6: "今[いま]、わたしは知[し]った。主[しゅ]はその油[あぶら]を注[そそ]がれた者[もの]を救[すく]われた。主[しゅ]はその聖[せい]なる天[てん]から彼[かれ]に答[こた]えられる。その右[みぎ]の手[て]の救[すく]いは、力[ちから]のうちにある。"
  7: "ある者[もの]は戦車[せんしゃ]に、ある者[もの]は馬[うま]に頼[たよ]る。しかし、わたしたちは、わたしたちの神[かみ]である主[しゅ]の名[な]によって高[たか]く上[あ]げられる。"
  8: "彼[かれ]らはつまずいて倒[たお]れ、わたしたちは起[お]き上[あ]がって立[た]ち直[なお]った。"
  9: "主[しゅ]よ、あなたの王[おう]を救[すく]ってください。わたしたちがあなたを呼[よ]び求[もと]める日[ひ]に、わたしたちに答[こた]えてください。"

notes:
  0: "Εἰς τὸ τέλος· ψαλμὸς τῷ Δαυιδ — 指揮者のために。ダビデの詩. Надписание — стих 0."
  1: "Ἐπακούσαι — да услышит (оптатив). θλῖψις — 苦しみ. ὑπερασπίσαι — да защитит. θεὸς Ιακωβ — ヤコブの神."
  2: "ἐξαποστείλαι — да пошлёт. ἐξ ἁγίου — 聖所から. ἐκ Σιων — シオンから. ἀντιλάβοιτο — да поддержит."
  3: "μνησθείη — да вспомнит. θυσία — 供え物. ὁλοκαύτωμα — 焼き尽くす供え物. πιανάτω — да сделает тучным, т. е. да примет благосклонно (Синодальный «тучно буди»). «セラ» не передаётся."
  4: "δῴη — да даст. κατὰ τὴν καρδίαν — 心にかなう. βουλή — 計画. πληρώσαι — да исполнит."
  5: "ἀγαλλιασόμεθα — 喜び. σωτήριον — 救い. μεγαλυνθησόμεθα — 高く上げられる (возвеличимся). πληρώσαι — да исполнит."
  6: "ἔσωσεν τὸν χριστὸν αὐτοῦ — 油を注がれた者を救われた (χριστός — титул, не имя). ἐξ οὐρανοῦ ἁγίου — 聖なる天から. ἐν δυναστείαις — 力のうちに."
  7: "ἅρματα… ἵπποι — 戦車…馬. μεγαλυνθησόμεθα — 高く上げられる."
  8: "συνεποδίσθησαν — つまずいて. ἀνέστημεν καὶ ἀνωρθώθημεν — 起き上がって立ち直った."
  9: "σῶσον τὸν βασιλέα — あなたの王を救ってください. ἐν ᾗ ἂν ἡμέρᾳ — 呼び求める日に."
