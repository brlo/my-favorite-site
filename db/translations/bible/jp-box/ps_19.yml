# jp-box, Псалтирь, псалом 19. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0.
# Псалом 19: молитва о царе пред жертвой и упование на помощь Божию.
# Красного и синего нет. Кавычек нет: молитва и пожелания, а не чужая речь.
# 〔…〕 нет: все слова в gr-lxx-byz есть.
# セラ (διάψαλμα, в конце ст. 3) не передаётся — по решению пользователя, как у jp-joc.
# Сносок ⟨…⟩ нет: 焼き尽くす供え物, 聖所, シオン понятны или уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
