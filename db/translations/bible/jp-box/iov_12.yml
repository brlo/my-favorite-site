chapter: 12
draft: true

verses:
  1: "ヨブは答[こた]えて言[い]った。"
  2: "「まことに、あなたがたこそ人[ひと]である。知恵[ちえ]もあなたがたとともに終[お]わるというのか。"
  3: "わたしにも、あなたがたと同じ心[こころ]がある。"
  4: "正[ただ]しい者[もの]、非[そし]りのない者[もの]が、嘲[あざけ]り笑[わら]いの的[まと]となった。"
  5: "定[さだ]められた時[とき]に、彼[かれ]は他[ほか]の者[もの]の下[もと]に倒[たお]れるために備[そな]えられ、その家[いえ]は不法[ふほう]な者[もの]たちに荒[あ]らされるために備えられていた。"
  6: "しかし、主[しゅ]を怒[いか]らせる者[もの]は、だれも、自分に罰[ばつ]の訪[おとず]れはないかのように、悪[わる]い者[もの]でありながら無罪[むざい]だと安心[あんしん]してはならない。"
  7: "四足[しそく]の獣[けもの]に問[と]え。彼[かれ]らはあなたに語[かた]る。天[てん]の鳥[とり]に問え。彼らはあなたに告[つ]げる。"
  8: "地[ち]に語[かた]って聞[き]かせよ。それはあなたに告げる。海[うみ]の魚[さかな]も、あなたに説[と]き明[あ]かす。"
  9: "これらすべてのもののうちに、主[しゅ]の手[て]がこれらを造[つく]ったことを知[し]らない者[もの]が、いるだろうか。"
  10: "すべて生[い]きる者[もの]の魂[たましい]も、すべての人[ひと]の霊[れい]も、彼[かれ]の手[て]のうちにあるのではないか。"
  11: "耳[みみ]は言葉[ことば]を見分[みわ]け、喉[のど]は食物[しょくもつ]を味[あじ]わう。"
  12: "長[なが]い時[とき]のうちに知恵[ちえ]があり、長い生涯[しょうがい]のうちに知識[ちしき]がある。"
  13: "神[かみ]には知恵[ちえ]と力[ちから]がある。神には計[はか]らいと悟[さと]りがある。"
  14: "神[かみ]が倒[たお]すなら、だれが建[た]てるだろうか。神が人々[ひとびと]に対[たい]して閉[と]ざすなら、だれが開[ひら]くだろうか。"
  15: "神[かみ]が水[みず]をせき止[と]めれば、地[ち]は乾[かわ]き上[あ]がる。神が水を放[はな]てば、それは地を覆[くつがえ]して滅[ほろ]ぼす。"
  16: "神[かみ]には支配[しはい]と力[ちから]がある。神には知識[ちしき]と悟[さと]りがある。"
  17: "神[かみ]は計[はか]らいをめぐらす者[もの]たちを捕囚[ほしゅう]として連[つ]れ去[さ]り、地[ち]の裁[さば]き手[て]たちをうろたえさせる。"
  18: "神[かみ]は王[おう]たちを王座[おうざ]に着[つ]かせ、その腰[こし]を帯[おび]で縛[しば]る。"
  19: "神[かみ]は祭司[さいし]たちを捕囚[ほしゅう]として送[おく]り出[だ]し、地[ち]の権力者[けんりょくしゃ]たちを覆[くつがえ]す。"
  20: "神[かみ]は信[しん]ある者[もの]たちの唇[くちびる]を変[か]え、年寄[としよ]りたちの悟[さと]りを知[し]られる。"
  21: "神[かみ]は支配者[しはいしゃ]たちの上[うえ]に辱[はずかし]めを注[そそ]ぎ、へりくだる者[もの]たちを癒[いや]される。"
  22: "神[かみ]は深[ふか]いことを闇[やみ]から明[あき]らかにし、死[し]の影[かげ]を光[ひかり]の中[なか]へ導[みちび]き出[だ]される。"
  23: "神[かみ]は国民[こくみん]たちを迷[まよ]わせ、また滅[ほろ]ぼし、国民たちを打[う]ち倒[たお]し、また導[みちび]かれる。"
  24: "神[かみ]は地[ち]の支配者[しはいしゃ]たちの心[こころ]を変[か]え、彼[かれ]らを知[し]らない道[みち]へ迷[まよ]い込[こ]ませる。"
  25: "彼[かれ]らは闇[やみ]を手探[てさぐ]りして光[ひかり]を見[み]ず、酔[よ]った者[もの]のようによろめき歩[ある]く。」"

notes:
  1: "Иов; вводная формула — повествование, вне кавычек (Ὑπολαβὼν δὲ Ιωβ λέγει). Здесь начинается одна речь Иова 12:2–14:22; цитата открыта в ст. 2 и закрыта в ст. 25, речь продолжается в следующей главе."
  2: "Иов, начало речи. Εἶτα ὑμεῖς ἐστε ἄνθρωποι — «итак, вы — люди»; ἦ μεθ᾽ ὑμῶν τελευτήσει σοφία — «разве с вами умрет премудрость» (τελευτάω — «умирать, оканчиваться»). Сарказм сохранён."
  3: "Иов. κἀμοὶ μὲν καρδία καθ᾽ ὑμᾶς ἐστιν — «и у меня сердце, как у вас». В LXX стих короткий; Син. длиннее (по МТ) — добавка не внесена."
  4: "Иов. δίκαιος γὰρ ἀνὴρ καὶ ἄμεμπτος ἐγενήθη εἰς χλεύασμα — «ибо праведный муж и непорочный стал посмешищем» (χλεύασμα — «насмешка»)."
  5: "Иов. εἰς χρόνον γὰρ τακτὸν ἡτοίμαστο πεσεῖν ὑπὸ ἄλλους — «ибо к определенному времени он приготовлен пасть от других»: тёмное место, передано буквально; οἴκους τε αὐτοῦ ἐκπορθεῖσθαι ὑπὸ ἀνόμων — «и дома его опустошены быть беззаконными» (ἐκπορθέω — «разорять»). Слав. 12:5 включает и начало ст. 6 (обаче никтоже да уповает…); держимся деления gr, эта половина — в нашем ст. 6."
  6: "Иов. οὐ μὴν δὲ ἀλλὰ μηδεὶς πεποιθέτω πονηρὸς ὢν ἀθῷος ἔσεσθαι — «однако пусть никто, будучи злым, не надеется быть невинным» (πείθω, ἀθῷος); ὅσοι παροργίζουσιν τὸν κύριον — «все, кто прогневляет Господа»; ὡς οὐχὶ καὶ ἔτασις αὐτῶν ἔσται — «будто и посещения им не будет» (ἔτασις — «дознание, кара»)."
  7: "Иов. ἐπερώτησον τετράποδα — «спроси четвероногих» (τετράπους); ἐὰν σοι εἴπωσιν — «если они скажут тебе»: ἐάν с конъюнктивом здесь — приглашение, а не условие; передано будущим («они скажут»), как и в ст. 8."
  8: "Иов. ἐκδιήγησαι δὲ γῇ — «и расскажи земле» (ἐκδιηγέομαι); ἐξηγήσονταί σοι οἱ ἰχθύες τῆς θαλάσσης — «и возвестят тебе рыбы морские» (ἐξηγέομαι). Приглашение-условие (ἐὰν σοι φράσῃ) передано так же, как в ст. 7."
  9: "Иов. τίς οὐκ ἔγνω ἐν πᾶσι τούτοις — «кто не познал во всех этих»; ὅτι χεὶρ κυρίου ἐποίησεν ταῦτα — «что рука Господня сотворила это»."
  10: "Иов. εἰ μὴ ἐν χειρὶ αὐτοῦ ψυχὴ πάντων τῶν ζώντων — «не в руке ли его душа всех живущих»; πνεῦμα παντὸς ἀνθρώπου — «и дух всякого человека». Слав. «не в руце ли его»."
  11: "Иов. οὖς μὲν γὰρ ῥήματα διακρίνει — «ибо ухо различает слова» (διακρίνω); λάρυγξ δὲ σῖτα γεύεται — «и гортань вкушает пищу» (λάρυγξ — «гортань»; γεύομαι — «пробовать»)."
  12: "Иов. ἐν πολλῷ χρόνῳ σοφία — «во многом времени — премудрость»; ἐν δὲ πολλῷ βίῳ ἐπιστήμη — «и во многой жизни — знание» (ἐπιστήμη). Син. «в старцах — мудрость» (по МТ); в LXX именно «время / жизнь», это чтение и переведено."
  13: "Иов. παρ᾽ αὐτῷ σοφία καὶ δύναμις — «у него премудрость и сила»; αὐτῷ βουλὴ καὶ σύνεσις — «его — совет и разумение» (βουλή — 計らい, σύνεσις — 悟り). Двойной датив αὐτῷ сохранён повтором."
  14: "Иов. ἐὰν καταβάλῃ, τίς οἰκοδομήσει — «если он низложит, кто построит» (καταβάλλω); ἐὰν κλείσῃ κατὰ ἀνθρώπων, τίς ἀνοίξει — «если затворит против людей, кто откроет»."
  15: "Иов. ἐὰν κωλύσῃ τὸ ὥδωρ, ξηρανεῖ τὴν γῆν — «если он удержит воду, иссушит землю» (κωλύω — «препятствовать»); ἐὰν δὲ ἐπαφῇ, ἀπώλεσεν αὐτὴν καταστρέψας — «если же пустит, погубит ее, ниспровергнув» (ἐπαφίημι — «отпускать»)."
  16: "Иов. παρ᾽ αὐτῷ κράτος καὶ ἰσχύς — «у него держава и крепость»; αὐτῷ ἐπιστήμη καὶ σύνεσις — «его — знание и разумение». Пара к ст. 13, повтор сохранён."
  17: "Иов. διάγων βουλευτὰς αἰχμαλώτους — «уводящий советников пленными» (διάγω — «уводить»); κριτὰς δὲ γῆς ἐξέστησεν — «и судей земли вывел из себя» (ἐξίστημι); слав. «ужаси» — в тексте うろたえさせる."
  18: "Иов. καθιζάνων βασιλεῖς ἐπὶ θρόνους — «сажающий царей на престолы» (καθιζάνω); περιέδησεν ζώνῃ ὀσφύας αὐτῶν — «и обвязал поясом чресла их» (ζώνη — «пояс», ὀσφύς — «чресла»). Син. иначе (по МТ: «лишает перевязей»)."
  19: "Иов. ἐξαποστέλλων ἱερεῖς αἰχμαλώτους — «отсылающий священников пленными»; δυνάστας δὲ γῆς κατέστρεψεν — «и сильных земли низверг» (καταστρέφω)."
  20: "Иов. διαλλάσσων χείλη πιστῶν — «изменяющий уста верных» (διαλλάσσω — «переменять»); σύνεσιν δὲ πρεσβυτέρων ἔγνω — «и разумение старцев познал»: тёмное место; слав. «разум же старцев уразуме»; Син. «старцев лишает смысла» (по МТ) — в тексте LXX."
  21: "Иов. ἐκχέων ἀτιμίαν ἐπ᾽ ἄρχοντας — «изливающий бесчестие на князей» (ἐκχέω); ταπεινοὺς δὲ ἰάσατο — «и смиренных исцелил» (ἰάομαι — «врачевать»)."
  22: "Иов. ἀνακαλύπτων βαθέα ἐκ σκότους — «открывающий глубокое из тьмы» (ἀνακαλύπτω); ἐξήγαγεν δὲ εἰς φῶς σκιὰν θανάτου — «и вывел на свет тень смерти»."
  23: "Иов. πλανῶν ἔθνη καὶ ἀπολλύων αὐτά — «вводящий в заблуждение народы и губящий их»; καταστρωννύων ἔθνη καὶ καθοδηγῶν αὐτά — «низлагающий народы и наставляющий их» (καταστρωννύω — «повергать», καθοδηγέω — «вести»). Парадокс (то же слово и губит, и ведёт) сохранён, как в греч. и слав."
  24: "Иов. διαλλάσσων καρδίας ἀρχόντων γῆς — «изменяющий сердца князей земных»; ἐπλάνησεν δὲ αὐτοὺς ὁδῷ, ᾗ οὐκ ᾔδεισαν — «и ввёл их в заблуждение на пути, которого они не знали»."
  25: "Иов. ψηλαφήσαισαν σκότος καὶ μὴ φῶς — «пусть осязают тьму, а не свет» (ψηλαφάω — «ощупывать»): оптативы LXX переданы как следствие предыдущего стиха; πλανηθείησαν δὲ ὥσπερ ὁ μεθύων — «и пусть заблудят, как пьяный». Речь Иова продолжается в гл. 13."
