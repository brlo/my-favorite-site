# jp-box, Иов, глава 12. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге только 1–2; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 12: ответ Иова, 25 стихов. 12:1 — вводная формула — повествование, вне
# кавычек; 12:2–25 — цитата 「…」. Этой цитатой начинается одна речь Иова
# 12:2–14:22, переходящая через границы глав: в гл. 12 кавычка открыта в ст. 2
# и закрыта в ст. 25, в гл. 13 и 14 снова открыта в первом стихе и закрыта
# в последнем. Вложенных речей в главе нет.
# Содержание: ирония над друзьями (2–3), праведник стал посмешищем (4–5),
# у Бога премудрость и сила (6–16), Он низлагает и возвышает (17–25).
# Нумерация по gr: 25 стихов. Слав. делит иначе на границе 5/6: в csl 12:5
# вошло начало гр 12:6 («обаче никтоже да уповает, лукав сый, неповинен быти»);
# держимся деления gr, сдвиг отмечен в notes 5–6.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz. Сносок ⟨…⟩ нет.
# Имена — транслитерация греческого (LXX).

