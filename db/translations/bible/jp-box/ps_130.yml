# jp-box, Псалтирь, псалом 130. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация — славяно-синодальная (csl-ru): в слав. надписание отдельным стихом
# не стоит, поэтому наш стих 0 (надписание) влит в начало стиха 1; дальше номера 1..3.
# Псалом 130: невысокое сердце и несмелый взор (1), душа как дитя у груди матери (2),
# призыв Израилю уповать (3).
# Красного и синего нет. Кавычек нет: в псалме нет прямой речи.
# 〔…〕 нет: перевод сделан по gr-lxx-byz, добавлений Церкви не вносилось.
# セラ (διάψαλμα) в этой главе нет.
# Сносок ⟨…⟩ нет: 心, 目, 魂 уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: ps
chapter: 130
draft: true

verses:
  1: "登[とう]上[じょう]の歌[うた]。ダビデのもの。主[しゅ]よ、わたしの心[こころ]は高[たか]ぶらず、わたしの目[め]も高[たか]くならず、わたしは大[おお]きなこと、わたしの及[およ]ばない驚[おどろ]くべきことには踏[ふ]み入[はい]らなかった。"
  2: "わたしは自分[じぶん]の魂[たましい]を静[しず]めて、安[やす]らかにしなかっただろうか。母[はは]から乳[ちち]を離[はな]された子[こ]のように、わたしの魂[たましい]はわたしのうちで、乳[ちち]を離[はな]された子[こ]のようである。その報[むく]いは、わたしの魂[たましい]の上[うえ]にある。"
  3: "イスラエルは、今[いま]からとこしえに至[いた]るまで、主[しゅ]を待[ま]ち望[のぞ]むように。"

notes:
  1: "Ὠιδὴ τῶν ἀναβαθμῶν — 登[とう]上[じょう]の歌. В gr-lxx-byz имя отсутствует, в ru-базе и у jp-joc стоит «Давида»; надписание добавлено по ru-базе, без 〔…〕 (надписания скобками не маркируются). В csl-ru отдельного стиха 0 нет — надписание влито в ст. 1. Κύριε, οὐχ ὑψώθη μου ἡ καρδία — 主よ、わたしの心は高ぶらず (ὑψόω — «возвышать»; ср. 130:1 и 101:1). οὐδὲ ἐμετεωρίσθησαν οἱ ὀφθαλμοί μου — わたしの目も高くならず (μετεωρίζω — «поднимать ввысь, заноситься»; образ надменного взгляда). οὐδὲ ἐπορεύθην ἐν μεγάλοις οὐδὲ ἐν θαυμασίοις ὑπὲρ ἐμέ — 大きなこと、わたしの及ばない驚くべきことには踏み入らなかった (πορεύομαι ἐν — «ходить в чём-либо», т. е. браться за что-либо; θαυμάσιος — «дивный»; ὑπὲρ ἐμέ — «выше меня»). Три отрицания сохранены."
  2: "εἰ μὴ ἐταπεινοφρόνουν — わたしは…静めて、安らかにしなかっただろうか (εἰ μή в клятвенной формуле и риторический вопрос; ταπεινοφρονέω — «смиренномудрствовать», передано 静めて安らかにする, как в jp-joc «鎮め之を安んず」). ὡς τὸ ἀπογεγαλακτισμένον ἐπὶ τὴν μητέρα αὐτοῦ — 母から乳を離された子のように (ἀπογαλακτίζω — «отнимать от груди»; ἐπί + acc. — «при, у»). ὡς ἀνταπόδοσις ἐπὶ τὴν ψυχήν μου — その報いは、わたしの魂の上にある (ἀνταπόδοσις — «воздаяние»; греч. фраза тёмная, в церковном чтении «яко воздаяние на душу мою»; сохранена без сглаживания, порядок членов греч. соблюдён)."
  3: "ἐλπισάτω Ισραηλ ἐπὶ τὸν κύριον — イスラエルは…主を待ち望むように (ἐλπίζω ἐπί — «надеяться на»; императив 3 л., отсюда ように). ἀπὸ τοῦ νῦν καὶ ἕως τοῦ αἰῶνος — 今からとこしえに至るまで (формула, ср. 120:8; 124:2)."
