book: neem
chapter: 4
draft: true

verses:
  1: "サンバラトとトビヤ、アラビア人[じん]たち、アンモン人[じん]たちは、エルサレムの城壁[じょうへき]が築[きず]き上[あ]げられてきたこと、すなわち破[やぶ]れ口[くち]がふさがれ始[はじ]めたことを聞[き]いて、非常[ひじょう]に不[ふ]快[かい]に思[おも]った。"
  2: "彼[かれ]らは皆[みな]、エルサレムに攻[せ]め上[のぼ]って戦[たたか]い、それを破[やぶ]るために共[とも]に集[あつ]まった。"
  3: "私[わたし]たちは自分[じぶん]たちの神[かみ]に祈[いの]って、彼[かれ]らに備[そな]える見張[みは]りを昼[ひる]も夜[よる]も置[お]いた。"
  4: "ユダの人[ひと]々[びと]は言[い]った。「運[はこ]び手[て]の力[ちから]は尽[つ]き、土[つち]は多[おお]い。私[わたし]たちはもはや城壁[じょうへき]を建[た]てられない。」"
  5: "私[わたし]たちを苦[くる]しめる者[もの]たちは言[い]った。「彼[かれ]らは知[し]ることも、見[み]ることもないうちに、私[わたし]たちは彼[かれ]らの真[ま]ん中[なか]に入[はい]り、彼[かれ]らを殺[ころ]して、この仕事[しごと]をやめさせる。」"
  6: "そばに住[す]むユダの人[ひと]々[びと]が来[き]て、私[わたし]たちに言[い]った。「彼[かれ]らはあらゆる場所[ばしょ]から私[わたし]たちに攻[せ]め上[のぼ]って来[く]る。」"
  7: "私[わたし]は、城壁[じょうへき]の後[うし]ろの低[ひく]い所[ところ]、隠[かく]れ場[ば]に、民[たみ]を氏族[しぞく]ごとに、剣[けん]、槍[やり]、弓[ゆみ]を持[も]たせて立[た]たせた。"
  8: "私[わたし]は見[み]て、立[た]ち上[あ]がり、貴人[きじん]たち、役人[やくにん]たち、民[たみ]の残[のこ]りの者[もの]たちに言[い]った。「彼[かれ]らを恐[おそ]れてはならない。大[おお]いなる、恐[おそ]るべき主[しゅ]である私[わたし]たちの神[かみ]を思[おも]い起[お]こし、あなたがたの兄弟[きょうだい]、息子[むすこ]たち、娘[むすめ]たち、妻[つま]たち、家[いえ]のために戦[たたか]え。」"
  9: "私[わたし]たちの敵[てき]は、そのことが私[わたし]たちに知[し]られ、神[かみ]が彼[かれ]らの計[はかり]をくじかれたことを聞[き]いた。そこで私[わたし]たちは皆[みな]、それぞれ自分[じぶん]の仕事[しごと]のために城壁[じょうへき]へ戻[もど]った。"
  10: "その日[ひ]から、働[はたら]く者[もの]たちの半[はんぶん]は仕事[しごと]をし、半[はんぶん]は槍[やり]、盾[たて]、弓[ゆみ]、鎧[よろい]を取[と]って、ユダの家[いえ]のすべての後[うし]ろに立[た]った。"
  11: "城壁[じょうへき]にいる建[た]てる者[もの]たちと荷[に]を負[お]う者[もの]たちは武具[ぶぐ]を着[つ]け、一方[いっぽう]の手[て]で仕事[しごと]をし、もう一方[いっぽう]の手[て]で投[な]げ槍[やり]を握[にぎ]っていた。"
  12: "建[た]てる者[もの]たちは、それぞれ腰[こし]に剣[けん]を帯[お]びて建[た]てた。角笛[つのぶえ]を吹[ふ]く者[もの]は私[わたし]のそばにいた。"
  13: "私[わたし]は貴人[きじん]たち、長[おさ]たち、民[たみ]の残[のこ]りの者[もの]たちに言[い]った。「この仕事[しごと]は広[ひろ]く、多[おお]い。そして私[わたし]たちは城壁[じょうへき]の上[うえ]で、互[たが]いに遠[とお]く離[はな]れて散[ち]らばっている。"
  14: "だから、角笛[つのぶえ]の音[ね]を聞[き]く場所[ばしょ]に、あなたがたは私[わたし]たちのところへ集[あつ]まれ。私[わたし]たちの神[かみ]が、私[わたし]たちのために戦[たたか]ってくださる。」"
  15: "こうして私[わたし]たちは仕事[しごと]を続[つづ]け、半[はんぶん]の者[もの]たちは夜明[よあ]けから星[ほし]の出[で]るまで槍[やり]を握[にぎ]っていた。"
  16: "そのとき、私[わたし]は民[たみ]に言[い]った。「あなたがたは、それぞれ自分[じぶん]の僕[しもべ]とともに、エルサレムの真[ま]ん中[なか]で夜[よる]を過[す]ごせ。夜[よる]は見張[みは]り、昼[ひる]は仕事[しごと]となるように。」"
  17: "私[わたし]も、私[わたし]の兄弟[きょうだい]たちも、私[わたし]の若者[わかもの]たちも、私[わたし]の後[うし]ろにいる見張[みは]りの者[もの]たちも、誰[だれ]ひとりとして衣[ころも]を脱[ぬ]がなかった。"

notes:
  1: "ἀνέβη φυή — «взошёл росток» (φυή), т. е. стена начала подниматься; слав. «взыде отрасль». αἱ διασφαγαὶ ἀναφράσσεσθαι — «проломы заделываться» (διασφαγά — разрыв, пролом; ἀναφράσσω — заграждать). καὶ οἱ Ἄραβες καὶ οἱ Αμμανῖται — арабы и аммонитяне; в ру добавлены «Азотяне» (по масоретскому тексту), в греч. и слав. их нет."
  2: "συνήχθησαν πάντες ἐπὶ τὸ αὐτό — «собрались все вместе». ἐλθεῖν παρατάξασθαι — «прийти сразиться» (παρατάσσομαι — строиться в боевой порядок); слав. добавляет «и разорят его» (ру «и разрушить его»)."
  3: "προσηυξάμεθα — «мы помолились» (1-е л. мн. ч.). ἐστήσαμεν προφύλακας ἐπ᾽ αὐτούς — «поставили стражу против них» (προφύλαξ — передовой караул). ἀπὸ προσώπου αὐτῶν — «от лица их», т. е. из-за них."
  4: "εἶπεν Ιουδας — «сказал Иуда», собирательно о жителях Иудеи. Συνετρίβη ἡ ἰσχὺς τῶν ἐχθρῶν — «сокрушилась сила врагов»; слав. «истомлена есть сила (от) враг»; по смыслу масоретского текста речь о носильщиках (ру «ослабела сила у носильщиков»), поэтому 運び手. ὁ χοῦς πολύς — «праха/земли много». οὐ δυνησόμεθα οἰκοδομεῖν — «не сможем строить»."
  5: "οἱ θλίβοντες ἡμᾶς — «теснящие нас» (θλίβω — теснить, притеснять). Οὐ γνώσονται καὶ οὐκ ὄψονται — «не узнают и не увидят». ἕως ὅτου ἔλθωμεν εἰς μέσον αὐτῶν — «доколе мы не войдём в середину их». φονεύσωμεν — «убьём»; καταπαύσωμεν τὸ ἔργον — «остановим дело»."
  6: "οἱ οἰκοῦντες ἐχόμενα αὐτῶν — «живущие подле них». Ἀναβαίνουσιν ἐκ πάντων τῶν τόπων ἐφ᾽ ἡμᾶς — «восходят из всех мест на нас»; слав. «от всех язык на ны». Ру добавляет «раз десять» — в греч. и слав. числа нет."
  7: "εἰς τὰ κατώτατα τοῦ τόπου — «в низшие места места [сего]», т. е. в низину. κατόπισθεν τοῦ τείχους — «позади стены». ἐν τοῖς σκεπεινοῖς — «в укрытиях» (σκεπεινός — закрытый, укрытый). κατὰ δήμους — «по родам/племенам» (δῆμος), слав. «по племеном»; 氏族. ῥομφαία — большой меч, 剣; λόγχη — копьё; τόξα — луки."
  8: "εἶδον καὶ ἀνέστην — «увидел и встал». τοὺς ἐντίμους καὶ τοὺς στρατηγοὺς καὶ τοὺς καταλοίπους τοῦ λαοῦ — знатные, военачальники и остаток народа (ср. 2:16). Μὴ φοβηθῆτε ἀπὸ προσώπου αὐτῶν — «не бойтесь их». μνήσθητε τοῦ θεοῦ ἡμῶν τοῦ μεγάλου καὶ φοβεροῦ — «вспомните Бога нашего, великого и страшного». παρατάξασθε περὶ τῶν ἀδελφῶν ὑμῶν — «сразитесь за братьев ваших»."
  9: "ἐγνώσθη ἡμῖν — «стало известно нам». διεσκέδασεν ὁ θεὸς τὴν βουλὴν αὐτῶν — «рассеял Бог замысел их» (διασκεδάννυμι). ἐπεστρέψαμεν πάντες… ἀνὴρ εἰς τὸ ἔργον αὐτοῦ — «возвратились все… каждый к делу своему»."
  10: "ἥμισυ τῶν ἐκτετιναγμένων — «половина отряжённых [на работы]» (ἐκτινάσσω — вытрясать, здесь: выставлять); слав. «пол вчинених». ἀντείχοντο — «держались [оружия]» (ἀντέχω). θυρεός — щит; θώραξ — панцирь, 鎧. οἱ ἄρχοντες ὀπίσω παντὸς οἴκου Ιουδα — «начальники позади всего дома Иуды»: предложение переходит в ст. 11."
  11: "τῶν οἰκοδομούντων ἐν τῷ τείχει — «из строящих на стене»: продолжение ст. 10. οἱ αἴροντες ἐν τοῖς ἀρτῆρσιν — «носящие на плечах/в связках» (ἀρτήρ — ремень, сумка; слав. «носящии бремена»). ἐν μιᾷ χειρὶ ἐποίει… καὶ μία ἐκράτει τὴν βολίδα — «одною рукою делал… а другою держал дротик» (βολίς)."
  12: "οἱ οἰκοδόμοι — строители. ἀνὴρ ῥομφαίαν αὐτοῦ ἐζωσμένος ἐπὶ τὴν ὀσφὺν αὐτοῦ — «каждый, опоясанный мечом своим по чреслам своим» (ὀσφύς — чресла). ὁ σαλπίζων ἐν τῇ κερατίνῃ — «трубящий в рог» (κερατίνη — рог), 角笛."
  13: "Τὸ ἔργον πλατὺ καὶ πολύ — «дело обширно и велико» (πλατύς — широкий). σκορπιζόμεθα — «мы рассеяны» (σκορπίζω). μακρὰν ἀνὴρ ἀπὸ τοῦ ἀδελφοῦ αὐτοῦ — «далеко один от брата своего»."
  14: "ἐν τόπῳ, οὗ ἐὰν ἀκούσητε τὴν φωνὴν τῆς κερατίνης — «в месте, где услышите голос рога». συναχθήσεσθε πρὸς ἡμᾶς — «соберитесь к нам». ὁ θεὸς ἡμῶν πολεμήσει περὶ ἡμῶν — «Бог наш будет сражаться за нас» (πολεμέω)."
  15: "ἀπὸ ἀναβάσεως τοῦ ὄρθρου ἕως ἐξόδου τῶν ἄστρων — «от восхода зари до выхода звёзд», т. е. от рассвета до появления звёзд; 夜明けから星の出るまで."
  16: "Αὐλίσθητε ἐν μέσῳ Ιερουσαλημ — «ночуйте среди Иерусалима» (αὐλίζομαι — проводить ночь под открытым небом). ἡ νὺξ προφυλακὴ καὶ ἡ ἡμέρα ἔργον — «ночь — стража, день — работа». Слав. добавляет «кийждо со отроком своим» (каждый со слугою своим), поэтому それぞれ自分の僕とともに."
  17: "οἱ ἄνδρες τῆς προφυλακῆς ὀπίσω μου — «мужи стражи позади меня». οὐκ ἦν ἐξ ἡμῶν ἐκδιδυσκόμενος ἀνὴρ τὰ ἱμάτια αὐτοῦ — «не было из нас никого, снимавшего одежды свои» (ἐκδύω); слав. «не снимахом одеяний наших… ни един от нас». Ру добавляет «у каждого были под рукою меч и вода» — в греч. и слав. этого нет."
