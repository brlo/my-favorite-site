# jp-box, Неемия, глава 4. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# слав. чтения и добавки входят в основной текст без 〔…〕, вариант LXX — в notes.
# ru (Синодальный) — только для понимания, не источник.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 4: заговор окрестных народов (1–3), молитва и стража (4), уныние
# строителей (5), замысел врагов (6), вооружение и речь Неемии (7–8), возвращение
# к работе (9–12), распоряжения о страже и ночлеге (13–16), одежда не снимается (17).
# Нумерация: глава соответствует ezd 14, в слав. и ру это Неем 4:7–23 (сдвиг +6).
# Речь: «Иуды» — 「…」 (4); теснящих — 「…」 (5); соседей-иудеев — 「…」 (6);
# Неемии — 「…」 (8, 13–14, 16).
# Красного нет. 〔…〕 нет.
# Сносок ⟨…⟩ нет: 城壁, 門, 見張り, 角笛 уже в корпусе.
# jp-ni не использовался.

