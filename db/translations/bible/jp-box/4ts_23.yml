# jp-box, 4-я Царств, глава 23. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); церковнославянский (csl-ru) — второй
# свидетель церковного текста: слав. чтения и добавки входят в основной текст
# без 〔…〕, вариант LXX — в notes.
# ru (Синодальный) — только для понимания, не источник.
# Глава 23: реформа Иосии (1–20), Пасха (21–23), истребление мерзостей (24),
# смерть Иосии (25–30), Иоахаз и Иоаким (31–37).
# Речь — 常体; слова людей и Бога — 「…」.
# Особенности паритета: 1 — «и возвестили эти слова царю» добавлено в csl
# (в LXX фраза стоит в конце 22:20); 17 — «что ты сделал ныне» добавлено в csl;
# 33 — «Ривла» при LXX Δεβλαθα и слав. «ревлаам».
# 〔…〕 нет. Сносок ⟨…⟩ нет: 神殿, 契約, 祭壇, 預言者, 高き所 уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: 4ts
chapter: 23
draft: true

verses:
  1: "王[おう]にこの言葉[ことば]が伝[つた]えられた。そこで王は人[ひと]を遣[つか]わし、ユダとエルサレムの長老[ちょうろう]たちをすべて自分[じぶん]のもとに集[あつ]めた。"
  2: "王[おう]は主[しゅ]の家[いえ]へ上[のぼ]り、ユダの人[ひと]すべて、エルサレムに住[す]むすべての人、祭司[さいし]たち、預言者[よげんしゃ]たち、小[ちい]さい者[もの]から大[おお]きい者[もの]までの民[たみ]すべてが、彼[かれ]とともに上った。王は彼らに、主の家で見[み]つかった契約[けいやく]の書[しょ]のすべての言葉[ことば]を読[よ]み聞[き]かせた。"
  3: "王[おう]は柱[はしら]のそばに立[た]ち、主[しゅ]の前[まえ]で契約[けいやく]を結[むす]んで、主に従[したが]って歩[あゆ]み、その戒[いまし]めと証[あかし]と掟[おきて]を心[こころ]を尽[つ]くし魂[たましい]を尽くして守[まも]り、この書[しょ]に書[か]かれているこの契約の言葉[ことば]を成[な]し遂[と]げると誓[ちか]った。民[たみ]はすべてこの契約に立[た]った。"
  4: "王[おう]は大祭司[だいさいし]ヒルキヤと次席[じせき]の祭司[さいし]たちと門[もん]を守[まも]る者[もの]たちに命[めい]じて、主[しゅ]の神殿[しんでん]から、バアルとアシェラと天[てん]の万軍[ばんぐん]のために造[つく]られたすべての用具[ようぐ]を運[はこ]び出[だ]させ、エルサレムの外[そと]、ケデロンのサデモトでそれらを焼[や]き、その灰[はい]をベテルへ持[も]って行[い]かせた。"
  5: "彼は、ユダの王[おう]たちが立[た]て、高[たか]い所[ところ]、ユダの町々[まちまち]、エルサレムの周[まわ]りで香[こう]をたいた祭司[さいし]たちをやめさせ、バアル、太陽[たいよう]、月[つき]、星座[せいざ]、天[てん]の万軍[ばんぐん]すべてに香をたく者[もの]たちをやめさせた。"
  6: "彼は主[しゅ]の家[いえ]からアシェラをエルサレムの外[そと]へ運[はこ]び出[だ]し、ケデロンの谷[たに]の流[なが]れでそれを焼[や]き、粉[こな]に砕[くだ]き、その粉を民[たみ]の子[こ]らが葬[ほうむ]られている墓[はか]にまいた。"
  7: "また、主[しゅ]の家[いえ]にあった神殿[しんでん]男娼[だんしょう]たちの家[いえ]を壊[こわ]した。そこでは女[おんな]たちがアシェラのために衣[ころも]を織[お]っていた。"
  8: "彼はユダの町々[まちまち]から祭司[さいし]たちをすべて連[つ]れて上[のぼ]り、祭司たちが香[こう]をたいた高[たか]い所[ところ]をギブアからベエル・シェバまで汚[けが]した。また、町の長[おさ]ヨシュアの門[もん]の入口[いりぐち]のそばにあり、町の門に入[はい]る者[もの]の左側[ひだりがわ]にある門の建物[たてもの]を壊[こわ]した。"
  9: "ただ、高[たか]い所[ところ]の祭司[さいし]たちは、エルサレムにある主[しゅ]の祭壇[さいだん]に上[のぼ]ることはなかった。彼らはただ兄弟[きょうだい]たちの間[あいだ]で種[たね]なしパンを食[た]べた。"
  10: "彼は、ベン・ヒノムの谷[たに]にあるトフェトを汚[けが]し、だれも自分[じぶん]の息子[むすこ]や娘[むすめ]をモレクのために火[ひ]の中[なか]を通[とお]らせないようにした。"
  11: "彼は、ユダの王[おう]たちが太陽[たいよう]のために与[あた]え、主[しゅ]の家[いえ]の入口[いりぐち]、王[おう]の宦官[かんがん]ナタンの金庫室[きんこしつ]のそば、ファルリムに置[お]いていた馬[うま]を除[のぞ]き、太陽の車[くるま]を火[ひ]で焼[や]いた。"
  12: "また、アハズの高[たか]い間[ま]の屋上[おくじょう]にあった祭壇[さいだん]、すなわちユダの王[おう]たちが造[つく]ったもの、およびマナセが主[しゅ]の家[いえ]の二[ふた]つの中庭[なかにわ]に造った祭壇を、王は打[う]ち壊[こわ]してそこから引[ひ]き倒[たお]し、その灰[はい]をケデロンの谷[たに]の流[なが]れに捨[す]てた。"
  13: "また、エルサレムの前[まえ]、モソアトの山[やま]の右側[みぎがわ]にある高[たか]い所[ところ]、すなわちイスラエルの王[おう]ソロモンが、シドン人[じん]の憎[にく]むべきものアスタルテ、モアブ人[じん]の憎むべきものケモシュ、アンモンの子[こ]らの忌[い]むべきものミルコムのために建[た]てたものを、王は汚[けが]した。"
  14: "彼は石柱[せきちゅう]を砕[くだ]き、アシェラの木立[こだち]を切[き]り倒[たお]し、その場所[ばしょ]を人[ひと]の骨[ほね]で満[み]たした。"
  15: "また、ベテルにある祭壇[さいだん]、すなわちイスラエルを罪[つみ]に陥[おとしい]れたネバトの子[こ]ヤロブアムが造[つく]った高[たか]い所[ところ]を、彼は打[う]ち壊[こわ]した。その祭壇と高い所を引き倒[たお]し、その石[いし]を砕いて粉[こな]にし、アシェラの木立[こだち]を焼[や]いた。"
  16: "ヨシヤは振[ふ]り向[む]いて、町[まち]の中[なか]にある墓[はか]を見[み]た。彼は人[ひと]を遣[つか]わして墓から骨[ほね]を取[と]り出[だ]させ、祭壇[さいだん]の上[うえ]でそれを焼[や]いて祭壇を汚[けが]した。それは、ヤロブアムが祭壇の前[まえ]に立[た]っていたとき、神[かみ]の人[ひと]が告[つ]げた主[しゅ]の言葉[ことば]のとおりであった。そして彼は振り返って、これらの言葉を告げた神の人の墓に目[め]を上[あ]げた。"
  17: "そして言[い]った。「わたしが見[み]ているあの記念[きねん]の石[いし]は何[なん]か。」町[まち]の人[ひと]たちは彼に言った。「それは神[かみ]の人[ひと]の墓[はか]です。この人はユダから来[き]て、あなたが今ベテルの祭壇[さいだん]に行[おこな]ったことについて、これらの言葉を告[つ]げた者です。」"
  18: "彼は言[い]った。「その人[ひと]をそのままにしておけ。だれも彼の骨[ほね]を動[うご]かしてはならない。」そこで彼らは彼の骨を、サマリアから来[き]た預言者[よげんしゃ]の骨とともにそのままにした。"
  19: "また、サマリアの町々[まちまち]にあった高[たか]い所[ところ]のすべての家[いえ]、イスラエルの王[おう]たちが主[しゅ]を怒[いか]らせるために造[つく]ったものを、ヨシヤは取[と]り除[のぞ]き、ベテルで行[おこな]ったと同じことをそれらに行った。"
  20: "彼はそこにいた高[たか]い所[ところ]の祭司[さいし]たちをすべて祭壇[さいだん]の上[うえ]で殺[ころ]し、その上[うえ]で人[ひと]の骨[ほね]を焼[や]いた。そしてエルサレムに戻[もど]った。"
  21: "王[おう]は民[たみ]すべてに命[めい]じて言[い]った。「あなたがたの神[かみ]である主[しゅ]に過越[すぎこし]を行[おこな]いなさい。この契約[けいやく]の書[しょ]に書[か]かれているとおりに行いなさい。」"
  22: "このような過越[すぎこし]は、イスラエルを裁[さば]いた士師[しし]たちの日[ひ]から、イスラエルの王[おう]たちとユダの王たちのすべての日[ひ]まで、行[おこな]われたことがなかった。"
  23: "ただ、ヨシヤの王[おう]の第十八年目[だいじゅうはちねんめ]に、この過越[すぎこし]がエルサレムで主[しゅ]に行[おこな]われた。"
  24: "また、ヨシヤは、霊媒[れいばい]と占[うらな]い師[し]、テラフィム、偶像[ぐうぞう]、およびユダの地[ち]とエルサレムにあったすべての憎[にく]むべきものを取[と]り除[のぞ]いた。それは、ヒルキヤが主[しゅ]の家[いえ]で見[み]つけた書[しょ]に書[か]かれている律法[りっぽう]の言葉[ことば]を成[な]し立[た]てるためであった。"
  25: "ヨシヤのように、心[こころ]を尽[つ]くし、魂[たましい]を尽くし、力[ちから]を尽くして主[しゅ]に立[た]ち返[かえ]り、モーセの律法[りっぽう]すべてに従[したが]った王[おう]は、彼の前[まえ]にも後[のち]にもいなかった。"
  26: "しかし、主[しゅ]は、ユダに対[たい]して燃[も]え上[あ]がったその大[おお]きな怒[いか]りの激[はげ]しさを、引[ひ]き返[かえ]されなかった。マナセが主を怒[いか]らせたその憤[いきどお]りのゆえであった。"
  27: "主[しゅ]は言[い]われた。「わたしはユダをわたしの前[まえ]からも退[しりぞ]ける。イスラエルを退けたように。わたしは、わたしが選[えら]んだこの町[まち]エルサレムと、『わたしの名[な]がそこにある』と言[い]った家[いえ]を捨[す]てる。」"
  28: "ヨシヤの残[のこ]りの言葉[ことば]、彼が行[おこな]ったすべてのことは、ユダの王[おう]たちの日誌[にっし]の書[しょ]に書[か]かれているではないか。"
  29: "彼の日[ひ]に、エジプトの王[おう]ファラオ・ネカオは、アッシリアの王[おう]に対[たい]してユーフラテス川[がわ]へ上[のぼ]った。ヨシヤ王は彼に会[あ]いに出[で]て行[い]き、ネカオはメギドで彼を殺[ころ]した。彼がヨシヤを見[み]たときであった。"
  30: "彼のしもべたちは、彼を死[し]んだままメギドから車[くるま]に載[の]せてエルサレムへ運[はこ]び、ダビデの町[まち]にある彼の墓[はか]に葬[ほうむ]った。民[たみ]の地[ち]の人[ひと]たちはヨシヤの子[こ]ヨアハズを連[つ]れて来[き]て、彼に油[あぶら]を注[そそ]ぎ、父[ちち]の代[か]わりに彼を王[おう]とした。"
  31: "ヨアハズは二十三歳[さい]で王[おう]となり、エルサレムで三[みっ]か月[げつ]治[おさ]めた。母[はは]の名[な]はハムタルといい、リブナのエレミヤの娘[むすめ]であった。"
  32: "彼は主[しゅ]の目[め]に悪[わる]いことを行[おこな]い、父[ちち]たちが行ったすべてに従[したが]った。"
  33: "ファラオ・ネカオは彼をハマテの地[ち]のリブラに閉[と]じ込[こ]め、エルサレムで王[おう]として治[おさ]めさせなかった。そしてその地[ち]に銀[ぎん]百[ひゃく]タラント、金[きん]百タラントの罰金[ばっきん]を課[か]した。"
  34: "ファラオ・ネカオは、ヨシヤの子[こ]エルヤキムを、父[ちち]ヨシヤの代[か]わりに王[おう]とした。そして彼の名[な]をヨヤキムに変[か]えた。彼はヨアハズを捕[と]らえてエジプトへ連[つ]れて行[い]き、ヨアハズはそこで死[し]んだ。"
  35: "ヨヤキムは銀[ぎん]と金[きん]をファラオに渡[わた]した。ただ、彼はその地[ち]に課税[かぜい]して、ファラオの命[めい]のとおりに銀を納[おさ]めさせた。すなわち、民[たみ]の地[ち]の人[ひと]たちは、それぞれの評価[ひょうか]に従[したが]って銀と金を出[だ]し、ファラオ・ネカオに納めた。"
  36: "ヨヤキムは二十五歳[さい]で王[おう]となり、エルサレムで十一年[じゅういちねん]治[おさ]めた。母[はは]の名[な]はゼブダといい、ルマのペダヤの娘[むすめ]であった。"
  37: "彼は主[しゅ]の目[め]に悪[わる]いことを行[おこな]い、父[ちち]たちが行ったすべてに従[したが]った。"

notes:
  1: "В csl стих начинается словами «И возвестиша сия глаголы цареви» — «И возвестили эти слова царю»; в LXX этой фразы нет (там она завершает 22:20) — по паритету оставлена в тексте. συνήγαγεν πρὸς ἑαυτόν — собрал к себе. πρεσβυτέρους — старейшин."
  2: "ἀνέβη εἰς οἶκον κυρίου — взошёл в дом Господень. ἀπὸ μικροῦ καὶ ἕως μεγάλου — от малого до великого. ἀνέγνω ἐν ὠσὶν αὐτῶν — прочитал вслух их (букв. «в уши их»). βιβλίου τῆς διαθήκης — книги завета."
  3: "ἔστη πρὸς τὸν στῦλον — стал у столпа. διέθετο διαθήκην — заключил завет (διατίθεμαι). τὰ μαρτύρια — свидетельства; τὰ δικαιώματα — уставы, оправдания. τοῦ ἀναστῆσαι — чтобы восстановить, исполнить. ἔστη πᾶς ὁ λαὸς ἐν τῇ διαθήκῃ — весь народ вступил в завет."
  4: "ἱερεῦσιν τῆς δευτερώσεως — священникам второго порядка (слав. «жерцем вторым»). φυλάσσουσιν τὸν σταθμόν — стражам порога. τῷ ἄλσει — «роще» (Ашера). σαδημωθ Κεδρων — поля Кедрона (слав. «в садимофе кедрсте»). χοῦν — прах, пепел."
  5: "κατέπαυσεν — прекратил, отставил. χωμαριμ — жрецы-идолослужители (транслитерация евр. כְּמָרִים; слав. «хомаримы»). μαζουρωθ — созвездия (слав. «планетам»). ἡ δύναμις τοῦ οὐρανοῦ — воинство небесное. В csl «и сожже хомаримы» (сжёг) — иное чтение; в тексте по LXX «отставил»."
  6: "τὸ ἄλσος — роща, идол Ашеры. χειμάρρους Κεδρων — поток Кедрон. ἐλέπτυνεν εἰς χοῦν — истёр в прах. τάφος τῶν υἱῶν τοῦ λαοῦ — могила «сынов народа», общее кладбище."
  7: "καδησιμ — посвящённые блудники (слав. «кадисимы»). ὕφαινον — ткали. χεττιιν — одежды, покровы (слав. «ризы»). τῷ ἄλσει — для рощи (Ашеры)."
  8: "ἀνήγαγεν — вывел, возвёл. ἐμίανεν — осквернил. ἀπὸ Γαβαα καὶ ἕως Βηρσαβεε — от Гевы до Беер-Шевы. οἶκος τῶν πυλῶν — дом у ворот (слав. «храм врат»). τῶν ἐξ ἀριστερῶν ἀνδρός — «слева от входящего» (слав. «ошуюю входящым»)."
  9: "πλὴν οὐκ ἀνέβησαν — «впрочем не восходили». ἄζυμα — опресноки (слав. «опресноки»); ели их «среди братьев», т.е. не служили у жертвенника."
  10: "Ταφεθ — Тофет. φάραγξ υἱοῦ Εννομ — долина сына Еннома (геенна). τοῦ διάγειν — проводить (через огонь). τῷ Μολοχ ἐν πυρί — Молоху в огне."
  11: "τοὺς ἵππους — коней. γαζοφυλάκιον — сокровищница (слав. «влагалище»). Ναθαν βασιλέως τοῦ εὐνούχου — Нафана, царского евнуха. ἐν φαρουριμ — в Фаруриме (неясное место). τὸ ἅρμα τοῦ ἡλίου — колесницу солнца. В csl «и сожже кони» (сжёг коней) — иное чтение; в тексте по LXX «отменил»."
  12: "ἐπὶ τοῦ δώματος τοῦ ὑπερῴου Αχαζ — на кровле горницы Ахаза. κατέσπασεν — низверг. χοῦν — прах. Дворов храма — два (слав. «во двою двору»)."
  13: "ἐπὶ πρόσωπον Ιερουσαλημ — перед лицом Иерусалима. τοῦ ὄρους τοῦ Μοσοαθ — гора Мосоат (слав. «горы мосфаф»; вероятно, Масличная). προσοχθίσματι — мерзость, предмет отвращения (слав. «мерзость»). βδέλυγμα — мерзость. Ἀστάρτη, Χαμως, Μολχολ — Астарта, Хамос, Милхом."
  14: "στήλας — столбы, статуи. ἐξωλέθρευσεν — истребил. ἄλση — рощи (Ашеры). ἔπλησεν τοὺς τόπους αὐτῶν ὀστέων — наполнил места их костями."
  15: "τὸ θυσιαστήριον τὸ ἐν Βαιθηλ — жертвенник в Вефиле. Ιεροβοαμ υἱὸς Ναβατ — Иеровоам, сын Навата. ὃς ἐξήμαρτεν τὸν Ισραηλ — который ввёл Израиля в грех. ἐλέπτυνεν εἰς χοῦν — истёр в прах."
  16: "ἐξένευσεν — свернул, обернулся. κατὰ τὸ ῥῆμα κυρίου, ὃ ἐλάλησεν ὁ ἄνθρωπος τοῦ θεοῦ ἐν τῷ ἑστάναι Ιεροβοαμ ἐν τῇ ἑορτῇ — по слову Господню, которое изрёк человек Божий, когда Иеровоам стоял у жертвенника в праздник (ср. 3 Цар 13:2). ἐπιστρέψας ἦρεν τοὺς ὀφθαλμούς — обратившись, поднял глаза."
  17: "σκόπελον — возвышение, памятник (слав. «могила»). ὁ ἐξεληλυθὼς ἐξ Ιουδα — вышедший из Иуды. ἐπικαλεσάμενος — воззвавший, предрёкший. В csl добавлено «яже сотворил еси ныне» («что ты сделал ныне») — нет в LXX; по паритету в тексте."
  18: "Ἄφετε αὐτόν — оставьте его. ἀνὴρ μὴ κινησάτω τὰ ὀστᾶ — никто да не двинет костей. ἐρρύσθησαν — были сбережены (слав. «оставиша»). μετὰ τῶν ὀστῶν τοῦ προφήτου τοῦ ἥκοντος ἐκ Σαμαρείας — с костями пророка, пришедшего из Самарии."
  19: "τοὺς οἴκους τῶν ὑψηλῶν — дома высот, капища. παροργίζειν κύριον — прогневлять Господа. ἀπέστησεν — удалил, отставил."
  20: "ἐθυσίασεν — заклал (θύω). ἐπὶ τῶν θυσιαστηρίων — на жертвенниках. κατέκαυσεν τὰ ὀστᾶ — сжёг кости. ἐπεστράφη — возвратился."
  21: "τὸ πασχα — Пасха (πασχα — несклоняемое). καθὼς γέγραπται ἐπὶ βιβλίου τῆς διαθήκης ταύτης — как написано в книге завета сего."
  22: "ἀφ᾿ ἡμερῶν τῶν κριτῶν — от дней судей. οἳ ἔκρινον τὸν Ισραηλ — которые судили Израиля. πάσας τὰς ἡμέρας βασιλέων — во все дни царей."
  23: "ὅτι ἀλλ᾿ ἢ — «но только». τῷ ὀκτωκαιδεκάτῳ ἔτει — в восемнадцатый год. ἐγενήθη τὸ πασχα τῷ κυρίῳ — совершена Пасха Господу."
  24: "θελητάς — вызывателей мёртвых (слав. «волшебники»). γνωριστάς — знахарей, гадателей (слав. «вражбиты»). θεραφιν — терафимы. εἴδωλα — идолы. ἐξῆρεν — удалил, истребил."
  25: "ὅμοιος αὐτῷ οὐκ ἐγενήθη — подобного ему не было. ἐπέστρεψεν πρὸς κύριον — обратился к Господу. ἐν ὅλῃ ἰσχύι — всею крепостию. μετ᾿ αὐτὸν οὐκ ἀνέστη — после него не восстал."
  26: "οὐκ ἀπεστράφη κύριος ἀπὸ θυμοῦ ὀργῆς — не отвратился Господь от ярости гнева. ἐθυμώθη — воспылал. ἐπὶ τοὺς παροργισμούς — за прогневления (слав. «на прогневания»)."
  27: "ἀποστήσω — удалю. ἀπώσομαι — отвергну. ἣν ἐξελεξάμην — который избрал. οὗ εἶπον Ἔσται τὸ ὄνομά μου ἐκεῖ — о котором сказал: «будет имя Моё там» (ср. 3 Цар 8:29)."
  28: "τὰ λοιπὰ τῶν λόγων — прочее словес. βιβλίῳ λόγων τῶν ἡμερῶν — книге слов дней, летописи. οὐχὶ ταῦτα γεγραμμένα — не это ли написано."
  29: "Φαραω Νεχαω — фараон Нехао. ἐπὶ βασιλέα Ἀσσυρίων — против царя Ассирийского. εἰς ἀπαντὴν αὐτοῦ — навстречу ему. ἐθανάτωσεν — умертвил. ἐν τῷ ἰδεῖν αὐτόν — когда увидел его."
  30: "ἐπεβίβασαν — посадили, положили на. νεκρόν — мёртвого. ἔθαψαν — погребли. ἔχρισαν — помазали. ἐβασίλευσαν ἀντὶ τοῦ πατρός — воцарили вместо отца."
  31: "τρίμηνον — три месяца. Αμιταλ — Хамуталь (слав. «амитала»). ἐκ Λεμνα — из Ливны."
  32: "τὸ πονηρὸν ἐν ὀφθαλμοῖς κυρίου — злое в очах Господних. κατὰ πάντα, ὅσα ἐποίησαν οἱ πατέρες αὐτοῦ — по всему, что делали отцы его."
  33: "μετέστησεν — перевёл, задержал (слав. «пресели»). ἐν Δεβλαθα ἐν γῇ Εμαθ — в Деблафе, земле Емаф (слав. «в ревлаам»; обычное русское «Ривла», в тексте — リブラ). τοῦ μὴ βασιλεύειν — чтобы не царствовал. ζημίαν — пеню, дань (слав. «дань»). ἑκατὸν τάλαντα — сто талантов."
  34: "Ελιακιμ — Елиаким. ἀντὶ Ιωσιου τοῦ πατρὸς αὐτοῦ — вместо Иосии, отца его. ἐπέστρεψεν τὸ ὄνομα — переменил имя. εἰσήνεγκεν εἰς Αἴγυπτον — ввёл в Египет."
  35: "ἐτιμογράφησεν — оценил, обложил (τιμογραφέω; слав. «написа землю»). ἐπὶ στόματος Φαραω — по приказу фараона (букв. «по устам»). ἀνὴρ κατὰ τὴν συντίμησιν αὐτοῦ — каждый по своей оценке."
  36: "Ιελδαφ — Зебудда (слав. «иелдаф»). Φεδεια — Педая. ἐκ Ρουμα — из Румы."
  37: "Формула та же, что в 23:32: «делал злое в очах Господних, во всём, как делали отцы его»; слав. «по всем елика сотвориша отцы его»."
