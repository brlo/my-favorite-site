verses:
  0: "指揮者[しきしゃ]に。なおも変[か]えられてゆく者[もの]たちのために。ダビデの詩[うた]、碑[ひ]文[ぶん]として、教[おし]えとして。アラム・ナハライムとアラム・ツォバを焼[や]いたとき、ヨアブが帰[かえ]ってきて、塩[しお]の谷[たに]で一万二千人を打[う]ち倒[たお]したとき。"
  1: "神[かみ]よ、あなたはわたしたちを退[しりぞ]け、打[う]ち倒[たお]された。あなたは怒[いか]られたが、わたしたちをあわれまれた。"
  2: "あなたは地[ち]を揺[ゆ]るがし、震[ふる]えさせた。その破[やぶ]れを直[なお]してください。地[ち]は揺[ゆ]らいでいるからである。"
  3: "あなたはご自分[じぶん]の民[たみ]に厳[きび]しいことを見[み]せ、わたしたちに酔[よ]わせる酒[さけ]を飲[の]ませた。"
  4: "あなたを恐[おそ]れる者[もの]に、弓[ゆみ]から逃[に]げるための旗[はた]を与[あた]えられた。"
  5: "あなたに愛[あい]された者[もの]たちが救[すく]われるために、あなたの右[みぎ]の手[て]で救[すく]い、わたしの声[こえ]を聞[き]いてください。"
  6: "神[かみ]はその聖所[せいしょ]で言[い]われた。「わたしは喜[よろこ]び、シケムを分[わ]け、幕[まく]の谷[たに]を測[はか]る。"
  7: "ギルアデはわたしのもの、マナセもわたしのもの。エフライムはわたしの頭[あたま]の守[まも]り、ユダはわたしの王[おう]。"
  8: "モアブはわたしの望[のぞ]みの洗[あら]い盤[ばん]。エドムの上[うえ]に、わたしの履[は]き物[もの]を伸[の]べ広[ひろ]げる。ペリシテ人[じん]はわたしに服[ふく]した。」"
  9: "だれがわたしを、堅[かた]い都[みやこ]へ連[つ]れて行[ゆ]くのか。だれがわたしをエドムまで導[みちび]くのか。"
  10: "神[かみ]よ、わたしたちを退[しりぞ]けたのは、あなたではないか。神[かみ]よ、あなたはわたしたちの軍[ぐん]とともに出[で]て行[ゆ]かれない。"
  11: "苦[くる]しみのうちで、わたしたちに助[たす]けを与[あた]えてください。人[ひと]の救[すく]いは空[むな]しい。"
  12: "わたしたちは神[かみ]によって力[ちから]を現[あらわ]す。神[かみ]はわたしたちを苦[くる]しめる者[もの]を軽[かろ]んじられる。"

notes:
  0: "Εἰς τὸ τέλος· τοῖς ἀλλοιωθησομένοις ἔτι, εἰς στηλογραφίαν τῷ Δαυιδ, εἰς διδαχήν… — 指揮者に。なおも変えられてゆく者たちのために。ダビデの詩、碑文として、教えとして. ἀλλοιωθησομένοις ἔτι — «имеющим ещё измениться» (слав. «о имеющих изменитися еще»), т. е. о будущем перевороте; στηλογραφία — 碑文 (см. Пс 55:0); διδαχή — 教え. ὁπότε ἐνεπύρισεν τὴν Μεσοποταμίαν Συρίας καὶ τὴν Συρίαν Σωβα — アラム・ナハライムとアラム・ツォバを焼いたとき: в греч. Μεσοποταμία Συρίας и Συρία Σωβα, т. е. евр. Арам-Нахараим и Арам-Цова; топонимы оставлены именами. ἐπέστρεψεν Ιωαβ — ヨアブが帰り; τὴν φάραγγα τῶν ἁλῶν, δώδεκα χιλιάδας — 塩の谷で一万二千人 (в греч. без «Идумеи», которая есть в евр. и слав.)."
  1: "Ὁ θεός, ἀπώσω ἡμᾶς καὶ καθεῖλες ἡμᾶς — 神よ、あなたはわたしたちを退け、打ち倒された (ἀπωθέω — «отринуть»; καθαιρέω — «низвергать»). ὠργίσθης καὶ οἰκτίρησας ἡμᾶς — あなたは怒られたが、わたしたちをあわれまれた (аористы; слав. «разгневался еси и помиловал ны еси»)."
  2: "συνέσεισας τὴν γῆν καὶ συνετάραξας αὐτήν — 地を揺るがし、震えさせた (σείω — «трясти»). ἴασαι τὰ συντρίμματα αὐτῆς — その破れを直してください (σύντριμμα — «разлом, рана»). ὅτι ἐσαλεύθη — 地は揺らいでいる (σαλεύω — «колебать»)."
  3: "ἔδειξας τῷ λαῷ σου σκληρά — ご自分の民に厳しいことを見せ (σκληρός — «жестокий»). ἐπότισας ἡμᾶς οἶνον κατανύξεως — 酔わせる酒を飲ませた (ποτίζω — «поить»; κατανύξις — «оцепенение, сокрушение»; слав. «вино умиления»)."
  4: "ἔδωκας τοῖς φοβουμένοις σε σημεῖωσιν τοῦ φυγεῖν ἀπὸ προσώπου τόξου — 恐れる者に、弓から逃げるための旗を与えられた (σημεῖωσις — «знамя»; слав. «знамение»)."
  5: "ὅπως ἂν ῥυσθῶσιν οἱ ἀγαπητοί σου — 愛された者たちが救われるために (ῥύομαι; ἀγαπητός — «возлюбленный»). σῶσον τῇ δεξιᾷ σου — 右の手で救い. ἐπάκουσόν μου — わたしの声を聞いてください."
  6: "ὁ θεὸς ἐλάλησεν ἐν τῷ ἁγίῳ αὐτοῦ — 神はその聖所で言われた (ἐν τῷ ἁγίῳ — «во святыне Своей»). Ἀγαλλιάσομαι καὶ διαμεριῶ Σικιμα — わたしは喜び、シケムを分け (ἀγαλλιάομαι — «ликовать»; διαμερίζω — «делить»). τὴν κοιλάδα τῶν σκηνῶν διαμετρήσω — 幕の谷を測る (κοιλάς — «долина»; σκηναί — «шатры», евр. Суккот; μετρέω — «измерять»). С этого места говорит Бог — 「」."
  7: "ἐμός ἐστιν Γαλααδ, καὶ ἐμός ἐστιν Μανασση — ギルアデはわたしのもの、マナセもわたしのもの (повтор ἐμός сохранён). Εφραιμ κραταίωσις τῆς κεφαλῆς μου — エフライムは頭の守り (κραταίωσις — «утверждение, крепость»). Ιουδας βασιλεύς μου — ユダはわたしの王 (в евр. «скипетр»; в греч. βασιλεύς)."
  8: "Μωαβ λέβης τῆς ἐλπίδος μου — モアブは望みの洗い盤 (λέβης — «таз, котёл»; слав. «коноб упования моего»). ἐπὶ τὴν Ιδουμαίαν ἐκτενῶ τὸ ὑπόδημά μου — エドムの上に、わたしの履を伸べ広げる (ἐκτείνω — «простирать»; ὑπόδημα — «обувь», знак владения). ἐμοὶ ἀλλόφυλοι ὑπετάγησαν — ペリシテ人はわたしに服した (ὑποτάσσω — «покорять»). Здесь речь Бога заканчивается."
  9: "τίς ἀπάξει με εἰς πόλιν περιοχῆς — だれがわたしを堅い都へ連れて行くのか (περιοχή — «ограда, укрепление»). τίς ὁδηγήσει με ἕως τῆς Ιδουμαίας — だれがエドムまで導くのか (ὁδηγέω — «вести»). Говорит псалмопевец (ср. 2 Цар 8; в Синодальном это ст. 10)."
  10: "οὐχὶ σύ, ὁ θεός, ὁ ἀπωσάμενος ἡμᾶς — 神よ、あなたではないか、退けたのは (ἀπωθέω — «отринуть»; вопрос с ожиданием «да»). οὐκ ἐξελεύσῃ… ἐν ταῖς δυνάμεσιν ἡμῶν — わたしたちの軍とともに出て行かれない (δυνάμεις — «силы, войска»)."
  11: "δὸς ἡμῖν βοήθειαν ἐκ θλίψεως — 苦しみのうちで助けを与えてください. ματαία σωτηρὶα ἀνθρώπου — 人の救いは空しい (ματαῖος — «тщетный»; σωτηρία — 救い)."
  12: "ἐν δὲ τῷ θεῷ ποιήσομεν δύναμιν — わたしたちは神によって力を現す (ποιέω δύναμιν — «сотворить силу», слав. «о Бозе сотворим силу»). αὐτὸς ἐξουδενώσει τοὺς θλίβοντας ἡμᾶς — 苦しめる者を軽んじられる (ἐξουδενόω — «уничижать»)."
