# jp-box, Псалтирь, псалом 59. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный 常体, без 文語.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0.
# Псалом 59: поражение и молитва о восстановлении (1–5), слово Божие о земле (6–8),
# вопрос псалмопевца (9–10), помощь от Бога, а не от человека (11–12).
# Красного и синего нет. Кавычки: слова Бога в 6–8 — 「…」 (первый уровень);
# в 9 уже говорит псалмопевец, поэтому кавычки закрыты в конце 8.
# 〔…〕 нет: все слова в gr-lxx-byz есть (сверено с выгрузкой).
# セラ (διάψαλμα, в 4) не передаётся — по решению пользователя, как у jp-joc.
# Сносок ⟨…⟩ нет: 旗, 洗い盤, 履き物 пояснены в notes; 嗣業 уже в корпусе.
# jp-ni не использовался.

