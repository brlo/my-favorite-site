# jp-box, 1-я Царств, глава 1. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в 1 Царств нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 1: бесплодие Анны и соперница Феннана (1–8), молитва и обет в Силоме,
# встреча с Илием (9–18), рождение Самуила (19–20), ежегодная жертва и воспитание
# (21–23), приведение Самуила в Силом (24–28).
# Речь людей — 「…」: 8, 11, 14, 15, 17, 18, 22, 23, 26; молитва Анны — 「…」: 11.
# Красного и синего нет.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (проверено по базе). Славянский
# в ст. 16, 24, 28 добавляет слова, которых в греческом нет; они не переведены,
# поэтому скобки не ставятся.
# Сносок ⟨…⟩ нет: глава не вводит новых терминов корпуса.
# jp-ni не использовался.

