verses:
  1: "エフライムの山地[さんち]のラマタイム・ツォフィムに、一人[ひとり]の男[おとこ]がいた。名[な]はエルカナといい、イェレメエルの子[こ]、エリウの子、トケの子で、ナシブ・エフライムの者[もの]であった。"
  2: "彼には二人[ふたり]の妻[つま]があった。一人[ひとり]の名[な]はアンナ、もう一人の名はペンナナといった。ペンナナには子[こ]どもたちがいたが、アンナには子がなかった。"
  3: "この人[ひと]は年[とし]ごとに、自分の町[まち]ラマタイムから、万軍[ばんぐん]の主[しゅ]なる神[かみ]を拝[おが]み、いけにえを献[ささ]げるためにシロへ上[のぼ]った。そこにはエリと、その二人の子[こ]ホフニとピネハスがいて、主の祭司[さいし]であった。"
  4: "ある日[ひ]、エルカナはいけにえを献[ささ]げ、その妻[つま]ペンナナと、その息子[むすこ]たち、娘[むすめ]たちに分[わ]け前[まえ]を与[あた]えた。"
  5: "アンナには一[ひと]つの分け前を与えた。彼女[かのじょ]には子[こ]がなかったからである。しかしエルカナは、この女[おんな]よりもアンナを愛[あい]していた。主[しゅ]は彼女の胎[たい]を閉[と]ざしておられた。"
  6: "主[しゅ]が彼女に子[こ]を与えなかったからである。それは彼女の苦[くる]しみに応[おう]じ、その苦しみの失意[しつい]に応じた。彼女が心[こころ]を沈[しず]めたのは、主が彼女の胎[たい]を閉ざして、子を与えなかったからである。"
  7: "彼女は年[とし]ごとに、主[しゅ]の家[いえ]に上[のぼ]るとき、いつもこうした。そして心[こころ]を沈め、泣[な]いて、食[た]べなかった。"
  8: "夫[おっと]エルカナは彼女[かのじょ]に言[い]った。「アンナ。」彼女は言った。「はい、ご主人[しゅじん]さま。」彼は言った。「なぜ泣[な]いているのか。なぜ食[た]べないのか。なぜ心[こころ]を痛[いた]めているのか。わたしはあなたにとって十人[じゅうにん]の子[こ]どもよりも良[よ]い者ではないか。」"
  9: "彼らがシロで食[た]べ終[お]えた後[のち]、アンナは立[た]ち上[あ]がって、主[しゅ]の前[まえ]に立った。祭司[さいし]エリは主の神殿[しんでん]の戸口[とぐち]にある椅子[いす]に座[すわ]っていた。"
  10: "彼女[かのじょ]は心[こころ]に苦[にが]みを抱[かか]えて主[しゅ]に祈[いの]り、激[はげ]しく泣[な]いた。"
  11: "彼女は誓[ちか]いを立てて言[い]った。「万軍[ばんぐん]の主[しゅ]よ、もしあなたが女中[おんなちゅう]の苦[くる]しみを顧[かえり]みて、わたしを思[おも]い起[おこ]し、女中に男[おとこ]の子[こ]を与[あた]えてくださるなら、その子を生涯[しょうがい]あなたに献[ささ]げる。その子はぶどう酒[しゅ]もお酒[さけ]も飲[の]まず、剃刀[かみそり]もその頭[あたま]には触[ふ]れない。」"
  12: "彼女が主[しゅ]の前[まえ]で長[なが]く祈[いの]り続[つづ]けていると、祭司[さいし]エリは彼女の口[くち]をじっと見[み]つめていた。"
  13: "彼女は心[こころ]のうちで語[かた]り、唇[くちびる]は動[うご]いていたが、声[こえ]は聞[き]こえなかった。エリは彼女を酔[よ]っている者[もの]と思[おも]った。"
  14: "エリは彼女に言[い]った。「いつまで酔[よ]っているのか。そのぶどう酒[しゅ]を取[と]り上[あ]げて、主[しゅ]の前[まえ]から出[で]て行[ゆ]け。」"
  15: "アンナは答[こた]えて言った。「いいえ、ご主人[しゅじん]さま。わたしは心[こころ]の苦[くる]しい女[おんな]だ。ぶどう酒[しゅ]もお酒[さけ]も飲[の]んではいない。主[しゅ]の前[まえ]に、自分の魂[たましい]を注[そそ]ぎ出[だ]しているのだ。"
  16: "女中[おんなちゅう]を悪[わる]い女[おんな]と見[み]なさないでほしい。あまりに長[なが]く語[かた]り続[つづ]けたために、今[いま]に至[いた]るまでこうしているのだ。」"
  17: "エリは答[こた]えて言[い]った。「安心[あんしん]して帰[かえ]りなさい。イスラエルの神[かみ]が、あなたが神に願[ねが]った願いをすべてかなえてくださるように。」"
  18: "彼女は言った。「女中[おんなちゅう]があなたの目[め]にかなう恵[めぐ]みを得[え]るように。」女は自分の道[みち]を行[い]き、宿[やど]に戻[もど]って夫[おっと]とともに食[た]べ、飲[の]んだ。もう顔[かお]を伏[ふ]せてはいなかった。"
  19: "朝早[あさはや]く彼らは起[お]きて主[しゅ]を拝[おが]み、自分[じぶん]たちの道[みち]を行[い]った。エルカナは自分の家[いえ]、ラマタイムに入[はい]り、妻[つま]アンナを知[し]った。主は彼女を思[おも]い起[おこ]された。"
  20: "彼女は身[み]ごもった。月[つき]が満[み]ちると男[おとこ]の子[こ]を産[う]み、その名[な]をサムエルと呼[よ]んで言った。「わたしがこの子を万軍[ばんぐん]の主[しゅ]なる神[かみ]から願[ねが]い求[もと]めたからである。」"
  21: "その人[ひと]エルカナは、家[いえ]の者[もの]すべてとともにシロへ上[のぼ]り、年[とし]ごとのいけにえと自分の誓[ちか]いの捧[ささ]げ物[もの]、地[ち]のすべていくにんの十分[じゅうぶん]の一[いち]を献[ささ]げた。"
  22: "アンナは彼とともに上[のぼ]らなかった。夫[おっと]に言[い]ったからである。「子[こ]どもが上って行[い]くまで、すなわち乳[ちち]を離[はな]れるまで、待[ま]とう。そうすれば、この子は主[しゅ]の前[まえ]に現[あらわ]れ、そこに永遠[えいえん]にとどまる。」"
  23: "夫エルカナは彼女に言った。「あなたの目[め]に良[よ]いと思[おも]うことをしなさい。乳を離すまで、ここにいなさい。ただ、主[しゅ]があなたの口[くち]から出[で]た言葉[ことば]を成[な]し遂[と]げてくださるように。」女はとどまり、息子[むすこ]が乳を離れるまで乳[ちち]を与[あた]えて育[そだ]てた。"
  24: "彼女は子[こ]どもとともにシロへ上[のぼ]った。三歳[さんさい]の雄[おす]の子牛[こうし]と、パンと、上等[じょうとう]の小麦粉[こむぎこ]一[いち]エファと、ぶどう酒[しゅ]の革袋[かわぶくろ]を持[も]って行[い]き、シロの主[しゅ]の家[いえ]に入[はい]った。子どもも彼[かれ]らとともにいた。"
  25: "彼らは子[こ]どもを主[しゅ]の前[まえ]に連[つ]れて来[き]た。父[ちち]は、年[とし]ごとに主に献[ささ]げていたいけにえを屠[ほふ]り、子どもを進[すす]み出[で]させて、子牛[こうし]を屠った。子の母[はは]アンナは、子をエリのもとへ連れて行[い]き、"
  26: "言った。「ああ、ご主人[しゅじん]さま。あなたの魂[たましい]にかけて申[もう]しあげる。わたしは、あなたの前[まえ]に立[た]って主[しゅ]に祈[いの]ったあの女[おんな]だ。"
  27: "この子[こ]のためにわたしは祈[いの]った。主[しゅ]は、わたしが主に願[ねが]い求[もと]めた願いを、わたしに与[あた]えてくださった。"
  28: "それで、わたしもこの子を、生きている限[かぎ]りのすべていのちの日[ひ]、主[しゅ]にお貸[か]しする。この子は主に仕[つか]える者[もの]だ。」"

notes:
  1: "Ἄνθρωπος ἦν — был человек: зачин книги. ἐξ Αρμαθαιμ Σιφα — из Армафема-Сифы, т. е. Рамафаим-Цофим (в LXX название раздвоено; слав. «от армафем сифы»). ἐξ ὄρους Εφραιμ — с горы Ефремовой, т. е. из ефремова нагорья. ἐν Νασιβ Εφραιμ — в Насиве Ефремовом: тёмное место, вероятно искажение или дублет; слав. «в насиве». Родословие по LXX: Елкана — сын Иеремеила (в евр. и ru Иерохам), сына Илия (Елиу), сына Тохе (Тоху); в евр. цепочка длиннее (Цуф и др.)."
  2: "δύο γυναῖκες — две жены: многожёнство эпохи судей, без оценки. Φεννανα — Феннана, соперница Анны. παιδία — дети (мн. ч.; не «сыновья»), παιδίον — ребёнок, дитя."
  3: "ἀνέβαινεν… ἐξ ἡμερῶν εἰς ἡμέρας — восходил изо дня в день, т. е. ежегодно в положенные дни (ср. ст. 21). κυρίῳ θεῷ σαβαωθ — Господу Богу Саваофу (Σαβαωθ — транслитерация евр. «воинств»). εἰς Σηλω — в Силом. Сыновья названы священниками при живом отце."
  4: "ἐγενήθη ἡμέρᾳ — «настал день» (букв. «был днём»). μερίδας — доли жертвенной трапезы (μερίς — часть, порция)."
  5: "μερὶδα μίαν — одну долю: Анна получает долю наравне, хотя детей у неё нет. ἠγάπα ὑπὲρ ταύτην — любил больше неё, т. е. больше Феннаны. ἀπέκλεισεν τὰ περὶ τὴν μήτραν — заключил утробу (ἀποκλείω — затворять)."
  6: "В евр. тексте Анну раздражает соперница; LXX говорит об унынии самой Анны и дважды повторяет причину — закрытую утробу. κατὰ τὴν θλῖψιν αὐτῆς — по скорби её, соразмерно скорби. ἀθυμία — уныние, упадок духа (ἀθυμέω — падать духом)."
  7: "ἐνιαυτὸν κατ᾽ ἐνιαυτόν — год за годом. εἰς οἶκον κυρίου — в дом Господень, т. е. к скинии в Силоме. οὐκ ἤσθιεν — не ела: пост от горя."
  8: "Ἰδοὺ ἐγώ, κύριε — «вот я, господин»: в LXX это ответ Анны на оклик мужа (в евр. стих иначе; слав. чтение сохраняет ответ). τί ἐστίν σοι — что с тобою. τύπτει σε ἡ καρδία σου — бьёт тебя сердце твоё, т. е. терзается. οὐκ ἀγαθὸς ἐγώ σοι ὑπὲρ δέκα τέκνα — разве я не лучше для тебя десяти детей."
  9: "μετὰ τὸ φαγεῖν αὐτοὺς — после того как они ели. ἐπὶ τῶν φλιῶν — у дверных косяков, т. е. у входа в скинию. δίφρος — седалище, кресло."
  10: "κατώδυνος ψυχῇ — скорбная душой (κατώδυνος — удручённый, от δύω). κλαίουσα ἔκλαυσεν — усилительный оборот: плакала горько (букв. «плача восплакала»)."
  11: "εὔξατο εὐχήν — дала обет (внутренняя этимология: «обетовала обет»). Αδωναι κύριε ελωαι σαβαωθ — транслитерации евр. имён: «Адонаи, Господи, Боже Саваоф»; передано 万軍の主よ. ἐπιβλέπων ἐπιβλέψῃς — «призрев призришь» (усиление). σπέρμα ἀνδρῶν — семя мужей, т. е. сын. δοτὸν ἕως ἡμέρας θανάτου αὐτοῦ — отданного до дня смерти его. οἶνον καὶ μέθυσμα — вино и сикер (хмельной напиток). σίδηρος οὐκ ἀναβήσεται ἐπὶ τὴν κεφαλήν — железо не поднимется на голову его: формула обета назорейства (Числ 6:5), передано 剃刀も…触れない."
  12: "ἐπλήθυνεν προσευχομένη — умножала молитву, долго молилась. ἐφύλαξεν τὸ στόμα αὐτῆς — стерёг, наблюдал уста её (φυλάσσω — стеречь)."
  13: "ἐλάλει ἐν τῇ καρδίᾳ αὐτῆς — говорила в сердце своём: беззвучная молитва. ἐλογίσατο αὐτὴν… εἰς μεθύουσαν — счёл её за пьяную."
  14: "τὸ παιδάριον Ηλι — букв. «отрок Илия»: странное выражение, вероятно порча текста; слав. читает просто «Илий». ἕως πότε μεθυσθήσῃ — до каких пор будешь пьянеть. περιελοῦ τὸν οἶνόν σου — сними с себя вино твоё, т. е. протрезвись."
  15: "Οὐχί, κύριε — нет, господин (Αнна отвергает упрёк). γυνή, ᾗ σκληρὰ ἡμέρα — женщина, у которой тяжёлый день (слав. «в жесток день»). οὐ πέπωκα — perfect: не пила и не пью. ἐκχέω τὴν ψυχήν μου — изливаю душу мою (ср. Пс 61:9), классическая формула молитвы."
  16: "θυγατέρα λοιμήν — дочь погибели, т. е. негодная, беспутная женщина (λοιμός — гибельный, негодный). ἐκ πλήθους ἀδολεσχίας μου — от многого многословия моего (ἀδολεσχία — пустословие, долгая речь). ἐκτέτακα ἕως νῦν — простёрлась, продолжалась доныне. Слав. добавляет «и от множества сетования моего» — в греческом этого нет, поэтому не переведено."
  17: "εἰς εἰρήνην — с миром (формула благословения при расставании). δῴη σοι πᾶν αἴτημα — да даст тебе всякое прошение твоё."
  18: "εὗρεν ἡ δούλη σου χάριν ἐν ὀφθαλμοῖς σου — обрела раба твоя благодать в очах твоих: формула благодарности и покорности. οὐ συνέπεσεν ἔτι — не пало более (лицо), т. е. перестало быть печальным; слав. «лице ея не испаде ктому»."
  19: "ὀρθρίζουσιν τὸ πρωΐ — встают рано утром. ἔγνω τὴν Ανναν — познал её (эвфемизм супружеского общения). ἐμνήσθη αὐτῆς κύριος — вспомнил о ней Господь, т. е. посетил милостью (ср. Быт 30:22)."
  20: "συνέλαβεν — зачала. τῷ καιρῷ τῶν ἡμερῶν — по исполнении дней, в срок. Σαμουηλ — Самуил; игра слов: ᾐτησάμην (испросила) от евр. שָׁאַל «просить». θεοῦ σαβαωθ — Бога Саваофа."
  21: "ἀνέβη… θῦσαι τὴν θυσίαν τῶν ἡμερῶν — принести жертву дней, т. е. годовую. τὰς εὐχὰς αὐτοῦ — обеты его. δεκάτας τῆς γῆς — десятины земли."
  22: "ἕως τοῦ ἀναβῆναι τὸ παιδάριον — до восхождения отрока. ἐὰν ἀπογαλακτίσω αὐτό — когда отниму его от груди (ἀπογαλακτίζω). ὀφθήσεται τῷ προσώπῳ κυρίου — явится пред лицом Господним. ἕως αἰῶνος — до века, навсегда."
  23: "ποίει τὸ ἀγαθὸν ἐν ὀφθαλμοῖς σου — делай доброе в глазах твоих. στὴσαι κύριος τὸ ἐξελθὸν ἐκ τοῦ στόματός σου — да утвердит Господь вышедшее из уст твоих (обет, ср. ст. 11). ἐθήλασεν — кормила грудью."
  24: "ἐν μόσχῳ τριετίζοντι — с трёхлетним тельцом (ед. ч.; в евр. и ru «три тельца» — иное чтение). οἰφὶ σεμιδάλεως — ефа пшеничной муки (οἰφί — ефа, мера объёма). νεβελ οἴνου — мех вина. Слав. добавляет «егда отдои его» — в греческом этого нет, поэтому не переведено."
  25: "προσήγαγον — привели, представили пред Господа. ἔσφαξεν ὁ πατήρ — заколол отец (не священник). τὴν θυσίαν ἣν ἐποίει ἐξ ἡμερῶν εἰς ἡμέρας — жертву, которую приносил изо дня в день, т. е. ежегодную."
  26: "Ἐν ἐμοί, κύριε — «о мне, господи»: тёмное место, слав. «во мне, Господи»; по смыслу — клятвенное обращение. ζῇ ἡ ψυχή σου — жива душа твоя: клятвенная формула (ср. 17:55; 20:3), передана あなたの魂にかけて."
  27: "ὑπὲρ τοῦ παιδαρίου τούτου — об этом ребёнке. τὸ αἴτημά μου ὃ ᾐτησάμην παρ᾽ αὐτοῦ — прошение моё, которое я испросила у Него: повтор корня, как в ст. 20."
  28: "κἀγὼ κιχρῶ αὐτόν — и я отдаю его в пользование (κιχράω — давать взаймы, ссужать); слав. «отдаю е». χρῆσιν τῷ κυρίῳ — в пользование Господу, т. е. на служение. В конце слав. добавляет «и поклонися тамо Господеви» — в греческом этого нет."
