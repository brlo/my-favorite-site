# jp-box, 2-я Паралипоменон, глава 30. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru), по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»); ru (Синодальный) —
# только для понимания, не источник. jp-joc в книге нет; jp-ni (под авторским правом)
# не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 30: решение о Пасхе во второй месяц (1–5), послание и гонцы (6–12),
# праздник опресноков и очищение (13–22), вторые семь дней и итог (23–27).
# Речь: послание гонцов — 「…」 (6–9); молитва Езекии — 「…」 (18–19).
# Красного нет.
# Нумерация по gr: 27 стихов, совпадает с csl. Молитва в гр. начата в 18 и
# продолжена в 19 (в слав. целиком в 19) — деление сохранено.
# 〔…〕 нет: csl-чтения (30:6 «Господу», «Иаков»; 30:11 «и в Иудею») внесены
# в основной текст без скобок; расхождения с LXX оговорены в notes.
# Сносок ⟨…⟩ нет: 過越祭, 除酵祭, 祭壇, 会衆, 寄留者 уже в корпусе.
# jp-ni не использовался.

