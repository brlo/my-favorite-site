verses:
  1: "ヒゼキヤはイスラエルとユダのすべてに人[ひと]を遣[つか]わし、エフライムとマナセに手紙[てがみ]を書[か]いて、エルサレムにある主[しゅ]の家[いえ]に来[き]て、イスラエルの神[かみ]である主[しゅ]に過越祭[すぎこしまつり]を行[おこな]うよう勧[すす]めた。"
  2: "王[おう]と長[かしら]たちとエルサレムの全会衆[ぜんかいしゅう]は、第二[だいに]の月[つき]に過越祭[すぎこしまつり]を行[おこな]うことを決[き]めた。"
  3: "祭司[さいし]たちが十分[じゅうぶん]に身[み]を清[きよ]めておらず、民[たみ]もエルサレムに集[あつ]まっていなかったので、その時[とき]には行[おこな]うことができなかったからである。"
  4: "このことは王[おう]と全会衆[ぜんかいしゅう]の前[まえ]に良[よ]いとされた。"
  5: "彼[かれ]らは、ベエルシェバからダンまでイスラエルのすべてに触[ふ]れを出[だ]し、人々[ひとびと]がエルサレムに来[き]て、イスラエルの神[かみ]である主[しゅ]に過越祭[すぎこしまつり]を行[おこな]うよう定[さだ]めた。多[おお]くの者[もの]が定[さだ]められたとおりに行[おこな]っていなかったからである。"
  6: "使者[ししゃ]たちは、王[おう]と長[かしら]たちからの手紙[てがみ]を持[も]って、王[おう]の命[めい]に従[したが]い、イスラエルとユダのすべてを巡[めぐ]って言[い]った。「イスラエルの子[こ]らよ、主[しゅ]であるアブラハム、イサク、ヤコブの神[かみ]に立[た]ち返[かえ]りなさい。そうすれば、主[しゅ]は、アッシリアの王[おう]の手[て]から逃[のが]れて残[のこ]った者[もの]たちを、あなたがたのもとへ連[つ]れ戻[もど]される。"
  7: "あなたがたの父[ちち]たちや兄弟[きょうだい]たちのようになってはならない。彼[かれ]らは自分[じぶん]たちの父祖[ふそ]の神[かみ]である主[しゅ]から離[はな]れたので、主[しゅ]は彼[かれ]らを荒廃[こうはい]に渡[わた]し、あなたがたが目[め]で見[み]ているとおりになった。"
  8: "今[いま]、うなじを固[かた]くしてはならない。主[しゅ]なる神[かみ]に栄光[えいこう]を帰[き]し、主[しゅ]がとこしえに聖別[せいべつ]されたその聖所[せいしょ]に入[はい]り、あなたがたの神[かみ]である主[しゅ]に仕[つか]えなさい。そうすれば、主[しゅ]はその激[はげ]しい怒[いか]りをあなたがたから遠[とお]ざけてくださる。"
  9: "あなたがたが主[しゅ]に立[た]ち返[かえ]るなら、あなたがたの兄弟[きょうだい]たちと子[こ]どもたちは、彼[かれ]らを捕[と]らえた者[もの]たちの前[まえ]で憐[あわ]れみを受[う]け、この地[ち]に戻[もど]ることができる。あなたがたの神[かみ]である主[しゅ]は、恵[めぐ]み深[ふか]く、あわれみ深[ふか]く、あなたがたが主[しゅ]に立[た]ち返[かえ]るなら、顔[かお]をあなたがたから背[そむ]けられることはないからである。」"
  10: "使者[ししゃ]たちはエフライムとマナセの山地[さんち]で、町[まち]から町[まち]へと巡[めぐ]り、ゼブルンまで行[い]ったが、人々[ひとびと]は彼[かれ]らを笑[わら]い、あざけた。"
  11: "しかし、アシェルとマナセとゼブルンから来[き]た人々[ひとびと]はへりくだり、エルサレムとユダに来[き]た。"
  12: "また、ユダでは主[しゅ]の手[て]が働[はたら]き、彼[かれ]らに一[ひと]つの心[こころ]を与[あた]えて、王[おう]と長[かしら]たちの命[めい]を、主[しゅ]の言葉[ことば]に従[したが]って行[おこな]わせた。"
  13: "第二[だいに]の月[つき]に、除酵祭[じょこうさい]を行[おこな]うために多[おお]くの民[たみ]がエルサレムに集[あつ]まった。それは非常[ひじょう]に大[おお]きな会衆[かいしゅう]であった。"
  14: "彼[かれ]らは立[た]ち上[あ]がり、エルサレムにある祭壇[さいだん]たちを取[と]り除[のぞ]き、偽[いつわ]りの神々[かみがみ]に香[こう]をたいたすべてのものを取[と]り壊[こわ]して、ケドロン川[がわ]に投[な]げ込[こ]んだ。"
  15: "そして、第二[だいに]の月[つき]の十四日[じゅうよっか]に過越祭[すぎこしまつり]の小羊[こひつじ]を屠[ほふ]った。祭司[さいし]たちとレビ人[びと]たちは恥[は]じて身[み]を清[きよ]め、主[しゅ]の家[いえ]に燔祭[はんさい]を携[たずさ]えて来[き]た。"
  16: "そして、神[かみ]の人[ひと]モーセの定[さだ]めに従[したが]い、自分[じぶん]たちの順序[じゅんじょ]にしたがって自分[じぶん]の場所[ばしょ]に立[た]った。祭司[さいし]たちはレビ人[びと]の手[て]から血[ち]を受[う]けた。"
  17: "会衆[かいしゅう]のうち多[おお]くの者[もの]が身[み]を清[きよ]めていなかったので、レビ人[びと]たちが、主[しゅ]に対して身[み]を清[きよ]めることのできないすべての者[もの]のために過越祭[すぎこしまつり]の小羊[こひつじ]を屠[ほふ]った。"
  18: "民[たみ]の大半[たいはん]は、エフライム、マナセ、イッサカル、ゼブルンから来[き]た者[もの]たちで、身[み]を清[きよ]めておらず、定[さだ]めに反[はん]して過越祭[すぎこしまつり]の小羊[こひつじ]を食[た]べた。ヒゼキヤは彼[かれ]らのために祈[いの]って言[い]った。「善[よ]い方[かた]である主[しゅ]が、"
  19: "聖所[せいしょ]の清[きよ]めによらずとも、自分[じぶん]たちの父祖[ふそ]の神[かみ]である主[しゅ]を尋[たず]ね求[もと]めようと心[こころ]を向[む]けるすべての者[もの]のために、贖[あがな]ってくださるように。」"
  20: "主[しゅ]はヒゼキヤの祈[いの]りを聞[き]き入[い]れ、民[たみ]を癒[いや]された。"
  21: "エルサレムにいたイスラエルの子[こ]らは、大[おお]きな喜[よろこ]びのうちに七日間[なのかかん]、除酵祭[じょこうさい]を祝[いわ]った。祭司[さいし]たちとレビ人[びと]たちは日[ひ]ごとに主[しゅ]をほめたたえ、主[しゅ]のために楽器[がっき]を奏[かな]でた。"
  22: "ヒゼキヤは、主[しゅ]に良[よ]い悟[さと]りを持[も]つレビ人[びと]たちすべてを励[はげ]ました。彼[かれ]らは七日間[なのかかん]、酬恩祭[しゅうおんさい]のいけにえをささげ、自分[じぶん]たちの父祖[ふそ]の神[かみ]である主[しゅ]に感謝[かんしゃ]をささげつつ、祭[まつ]りを終[お]えた。"
  23: "全会衆[ぜんかいしゅう]は、さらに七日間[なのかかん]、祝[いわ]うことを決[き]め、その七日間[なのかかん]を喜[よろこ]びのうちに過[す]ごした。"
  24: "ヒゼキヤ、ユダの王[おう]は会衆[かいしゅう]に雄牛[おうし]千頭[せんとう]と羊[ひつじ]七千頭[ななせんとう]を提供[ていきょう]し、長[かしら]たちは民[たみ]に雄牛[おうし]千頭[せんとう]と羊[ひつじ]一万頭[いちまんとう]を提供[ていきょう]した。祭司[さいし]たちは多[おお]くが身[み]を清[きよ]めた。"
  25: "ユダの全会衆[ぜんかいしゅう]、祭司[さいし]たち、レビ人[びと]たち、イスラエルから来[き]た者[もの]たちすべて、イスラエルの地[ち]から来[き]た寄留者[きりゅうしゃ]たち、ユダに住[す]む者[もの]たちは皆[みな]、喜[よろこ]んだ。"
  26: "エルサレムには大[おお]きな喜[よろこ]びがあった。イスラエルの王[おう]ダビデの子[こ]ソロモンの日[ひ]々[び]以来[いらい]、エルサレムにこのような祭[まつ]りはなかったからである。"
  27: "祭司[さいし]たちとレビ人[びと]たちは立[た]ち上[あ]がって民[たみ]を祝福[しゅくふく]した。その声[こえ]は聞[き]かれ、彼[かれ]らの祈[いの]りは天[てん]にある主[しゅ]の聖[せい]なる住[す]まいに届[とど]いた。"

notes:
  1: "ἀπέστειλεν ἐπὶ πάντα Ισραηλ καὶ Ιουδαν — послал ко всему Израилю и Иуде; ἐπιστολὰς ἔγραψεν ἐπὶ τὸν Εφραιμ καὶ Μανασση — письма написал к Ефрему и Манассии (ἐπί с вин. — «к»); ἐλθεῖν εἰς οἶκον κυρίου — прийти в дом Господень; ποιῆσαι τὸ φασεκ — совершить пасху (φασεκ, евр. פֶּסַח; 過越祭)."
  2: "ἐβουλεύσατο — держал совет (βουλεύομαι); οἱ ἄρχοντες — начальники (長たち); πᾶσα ἡ ἐκκλησία — всё собрание (会衆); τῷ μηνὶ τῷ δευτέρῳ — во второй месяц (ср. Числ 9:10–11 — для нечистых и находящихся в пути)."
  3: "οὐ γὰρ ἠδυνάσθησαν — ибо не могли; οἱ ἱερεῖς οὐχ ἡγνίσθησαν ἱκανοί — священники не освятились в достаточном числе; ὁ λαὸς οὐ συνήχθη — народ не собрался. Слав. «не очистишася доволни»."
  4: "ἤρεσεν ὁ λόγος ἐναντίον τοῦ βασιλέως καὶ ἐναντίον τῆς ἐκκλησίας — слово было угодно царю и собранию (ἀρέσκω)."
  5: "ἔστησαν λόγον — постановили слово; διελθεῖν κήρυγμα — чтобы прошло провозглашение (κῆρυγμα); ἀπὸ Βηρσαβεε ἕως Δαν — от Вирсавии до Дана; ὅτι πλῆθος οὐκ ἐποίησεν κατὰ τὴν γραφήν — ибо множество не сделало по писанию (γραφή — предписание, 定め)."
  6: "οἱ τρέχοντες — гонцы (τρέχω — бежать); σὺν ταῖς ἐπιστολαῖς — с письмами; κατὰ τὸ πρόσταγμα — по повелению; ἐπιστρέψατε πρὸς θεὸν Αβρααμ καὶ Ισαακ καὶ Ισραηλ — обратитесь к Богу Авраама, Исаака и Израиля (слав. «ко Господу Богу … и иаковлю» — в тексте 主…ヤコブ по слав.); ἐπιστρέψει τοὺς ἀνασεσῳσμένους — обратит спасшихся (3 л. ед.; слав. «обратите» — 2 л. мн.); τοὺς καταλειφθέντας ἀπὸ χειρὸς βασιλέως Ασσουρ — оставшихся от руки царя Ассура."
  7: "οἳ ἀπέστησαν ἀπὸ κυρίου — которые отступили от Господа; παρέδωκεν αὐτοὺς εἰς ἐρήμωσιν — предал их в опустошение (ἐρήμωσις); καθὼς ὑμεῖς ὁρᾶτε — как вы видите."
  8: "μὴ σκληρύνητε τοὺς τραχήλους ὑμῶν — не ожесточите шей ваших (τράχηλος — шея; слав. «сердец»); δότε δόξαν κυρίῳ τῷ θεῷ — воздайте славу Господу Богу; τὸ ἁγίασμα αὐτοῦ — святилище Его (ἁγίασμα); ὃ ἡγίασεν εἰς τὸν αἰῶνα — которое освятил навек; ἀποστρέψει θυμὸν ὀργῆς — отвратит ярость гнева."
  9: "ἐν τῷ ἐπιστρέφειν ὑμᾶς — когда вы обратитесь; ἐν οἰκτιρμοῖς — в милостях (οἰκτιρμός); ἔναντι πάντων τῶν αἰχμαλωτισάντων — пред всеми пленившими; ἐλεήμων καὶ οἰκτίρμων — милостив и щедр; οὐκ ἀποστρέψει τὸ πρόσωπον — не отвратит лица."
  10: "οἱ τρέχοντες διαπορευόμενοι — гонцы, проходящие (διαπορεύομαι); ἐν τῷ ὄρει Εφραιμ — по горе Ефремовой; ἕως Ζαβουλων — до Завулона; ἐγένοντο ὡς καταγελῶντες αὐτῶν καὶ καταμωκώμενοι — стали как смеющиеся над ними и издевающиеся (καταγελάω, καταμωκάομαι)."
  11: "ἐνετράπησαν — устыдились, смирились (ἐντρέπω); ἦλθον εἰς Ιερουσαλημ — пришли в Иерусалим; слав. добавляет «и во иудею» — внесено в текст (ユダ)."
  12: "χεὶρ κυρίου — рука Господня; δοῦναι αὐτοῖς καρδίαν μίαν — дать им сердце единое; ἐλθεῖν τοῦ ποιῆσαι — прийти, чтобы сделать; ἐν λόγῳ κυρίου — по слову Господню."
  13: "συνήχθησαν λαὸς πολύς — собралось много народа; ἡ ἑορτὴ τῶν ἀζύμων — праздник опресноков (除酵祭); ἐκκλησία πολλὴ σφόδρα — собрание весьма многочисленное."
  14: "καθεῖλαν τὰ θυσιαστήρια — низвергли жертвенники (καθαιρέω); ἐν οἷς ἐθυμιῶσαν τοῖς ψευδέσιν — на которых кадили ложным (ψευδής — ложный, т. е. идолам); κατέσπασαν — разрушили; ἔρριψαν εἰς τὸν χειμάρρουν Κεδρων — бросили в поток Кедрон."
  15: "ἔθυσαν τὸ φασεκ — заклали пасху; τῇ τεσσαρεσκαιδεκάτῃ τοῦ μηνὸς τοῦ δευτέρου — в четырнадцатый день второго месяца; ἐνετράπησαν καὶ ἡγνίσθησαν — устыдились и освятились; εἰσήνεγκαν ὁλοκαυτώματα — принесли всесожжения."
  16: "ἔστησαν ἐπὶ τὴν στάσιν αὐτῶν — стали на своём месте (στάσις); κατὰ τὸ κρίμα αὐτῶν — по уставу своему (κρίμα — определение, чин); κατὰ τὴν ἐντολὴν Μωυσῆ ἀνθρώπου τοῦ θεοῦ — по заповеди Моисея, человека Божия; ἐδέςοντο τὰ αἵματα ἐκ χειρός — принимали кровь из руки (δέχομαι)."
  17: "πλῆθος τῆς ἐκκλησίας οὐχ ἡγνίσθη — множество собрания не освятилось; οἱ Λευῖται ἦσαν τοῦ θύειν τὸ φασεκ — левиты были те, кто закалал пасху (ἦσαν τοῦ + инф.); παντὶ τῷ μὴ δυναμένῳ ἁγνισθῆναι τῷ κυρίῳ — всякому, кто не мог освятиться Господу."
  18: "τὸ πλεῖστον τοῦ λαοῦ — большая часть народа; ἀπὸ Εφραιμ καὶ Μανασση καὶ Ισσαχαρ καὶ Ζαβουλων — из Ефрема, Манассии, Иссахара и Завулона; παρὰ τὴν γραφήν — вопреки писанию; προσηύξατο … λέγων — помолился, говоря. В гр. молитва начата здесь и продолжена в 19; слав. ставит её целиком в 19."
  19: "πάσης καρδίας κατευθυνούσης — всякого сердца, направленного (κατευθύνω); ἐκζητῆσαι κύριον — взыскать Господа; οὐ κατὰ τὴν ἁγνείαν τῶν ἁγίων — не по очищению святынь (ἁγνεία — чистота; τὰ ἅγια — святыни, 聖所)."
  20: "ἐπήκουσεν κύριος τῷ Εζεκια — услышал Господь Езекию; ἰάσατο τὸν λαόν — исцелил народ (ἰάομαι). Ru «простил» — по МТ; в гр. и слав. «исцелил»."
  21: "ἐποίησαν τὴν ἑορτὴν τῶν ἀζύμων ἑπτὰ ἡμέρας — совершили праздник опресноков семь дней; ἐν εὐφροσύνῃ μεγάλῃ — в веселии великом; καθυμνοῦντες — воспевая (καθυμνέω); ἡμέραν καθ᾽ ἡμέραν — день за днём; ἐν ὀργάνοις τῷ κυρίῳ — на орудиях Господу."
  22: "ἐλάλησεν ἐπὶ πᾶσαν καρδίαν — говорил ко всякому сердцу (т. е. ободрял); τῶν συνιόντων σύνεσιν ἀγαθήν — имеющих доброе разумение (συνίημι); συνετέλεσαν τὴν ἑορτήν — завершили праздник; θύοντες θυσίας σωτηρίου — принося жертвы спасения (σωτήριον — 酬恩祭); ἐξομολογούμενοι — исповедуясь, благодаря."
  23: "ἐβουλεύσατο ἡ ἐκκλησία ἅμα — собрание решило вместе (ἅμα); ποιῆσαι ἑπτὰ ἡμέρας ἄλλας — провести ещё семь дней."
  24: "ἀπήρξατο — дал начатки (ἀπάρχομαι); τῷ Ιουδα τῇ ἐκκλησίᾳ — Иуде, собранию; μόσχους χιλίους καὶ ἑπτακισχίλια πρόβατα — 1000 тельцов и 7000 овец (ru «десять тысяч» — по МТ); οἱ ἄρχοντες ἀπήρξαντο τῷ λαῷ — начальники дали народу; τὰ ἅγια τῶν ἱερέων εἰς πλῆθος — святыни священников во множестве (освятившихся священников много)."
  25: "ηὐφράνθη πᾶσα ἡ ἐκκλησία — возрадовалось всё собрание; οἱ προσήλυτοι — пришельцы (寄留者); οἱ ἐλθόντες ἀπὸ γῆς Ισραηλ — пришедшие из земли Израиля; слав. «обретшиися из Иерусалима» — вместо «из Израиля»."
  26: "ἀπὸ ἡμερῶν Σαλωμων — со дней Соломона; οὐκ ἐγένετο τοιαύτη ἑορτή — не было такого праздника."
  27: "ἀνέστησαν οἱ ἱερεῖς οἱ Λευῖται — встали священники, левиты (член при Λευῖται избыточен); ηὐλόγησαν τὸν λαόν — благословили народ; ἐπηκούσθη ἡ φωνή — услышан был голос; τὸ κατοικητήριον τὸ ἅγιον — святое жилище (κατοικητήριον)."
