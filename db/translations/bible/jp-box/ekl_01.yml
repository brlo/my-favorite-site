# jp-box, Екклесиаст, глава 1. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru); ru (Синодальный)
# только для понимания. jp-joc в Екклесиасте отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 1: надписание (1), «суета сует» (2), круговорот мира (3–11),
# опыт Екклесиаста (12–18).
# Красного и синего нет: это не речь Христа. Речь Екклесиаста — от первого лица, без кавычек;
# его слова о себе в 16 — в 「…」.
# 〔…〕 нет: все слова в gr-lxx-byz есть.
# Сноска одна — 1:1 コヘレト (Ἐκκλησιαστής).
# jp-ni не использовался.

tr_code: jp-box
book: ekl
chapter: 1
draft: true

verses:
  1: "コヘレト⟨ヘブライ語で「集会[しゅうかい]を招[まね]く者[もの]」の意[い]。伝道者[でんどうしゃ]とも訳[やく]される。⟩の言葉[ことば]。ダビデの子[こ]、エルサレムのイスラエルの王[おう]の言葉[ことば]である。"
  2: "空[むな]しさの空[むな]しさ、とコヘレトは言[い]う。空[むな]しさの空[むな]しさ、すべては空[むな]しい。"
  3: "人[ひと]は、日[ひ]の下[もと]でするすべての労苦[ろうく]によって、何[なに]の益[えき]を得[え]るのか。"
  4: "世代[せだい]は去[さ]り、世代[せだい]は来[く]る。しかし地[ち]は永遠[えいえん]に立[た]ち続[つづ]ける。"
  5: "太陽[たいよう]は昇[のぼ]り、太陽[たいよう]は沈[しず]み、自分の場所[ばしょ]へと引[ひ]かれて行[い]く。そこからまた昇[のぼ]るために。"
  6: "風[かぜ]は南[みなみ]へ向[む]かって進[すす]み、北[きた]へ巡[めぐ]って行[い]き、巡[めぐ]りながら進[すす]み、その巡[めぐ]る所[ところ]へ帰[かえ]って来[く]る。"
  7: "すべての谷川[たにがわ]は海[うみ]へ流[なが]れ込[こ]むが、海[うみ]は満[み]ちることがない。谷川[たにがわ]が流[なが]れ込[こ]む所[ところ]へ、また流[なが]れ込[こ]むために帰[かえ]って行[ゆ]く。"
  8: "すべての言葉[ことば]は人[ひと]を疲[つか]れさせる。人[ひと]は語[かた]り尽[つ]くすことができない。目[め]は見[み]て満[み]ち足[た]りず、耳[みみ]は聞[き]いて満[み]ち足[た]りない。"
  9: "かつてあったことは、またある。かつてなされたことは、またなされる。日[ひ]の下[もと]に新[あたら]しいものは何[なに]もない。"
  10: "「見[み]よ、これは新[あたら]しい」と言[い]う者[もの]があっても、それはすでに、わたしたちより前[まえ]の時代[じだい]にあったのである。"
  11: "昔[むかし]のことを思[おも]い起[おこ]す者[もの]はなく、後[のち]に来[く]る者[もの]も、さらに後[のち]に来[く]る者[もの]たちの間[あいだ]では、忘[わす]れられてしまう。"
  12: "わたし、コヘレトは、エルサレムでイスラエルの王[おう]であった。"
  13: "わたしは心[こころ]を尽[つ]くして、天[てん]の下[した]で行[おこな]われるすべてのことを、知恵[ちえ]によって探[さぐ]り調[しら]べようとした。神[かみ]はこの苦[くる]しい務[つと]めを人[ひと]の子[こ]らに与[あた]えて、それに携[たずさ]わらせておられる。"
  14: "わたしは日[ひ]の下[もと]で行[おこな]われるすべての業[わざ]を見[み]た。すると、見[み]よ、すべては空[むな]しく、風[かぜ]を追[お]うようなものだった。"
  15: "曲[ま]がったものは直[なお]すことができず、欠[か]けているものは数[かぞ]えることができない。"
  16: "わたしは心[こころ]のうちに語[かた]った。「見[み]よ、わたしは偉大[いだい]になり、わたしより前[まえ]にエルサレムにいたすべての者[もの]よりも、多[おお]くの知恵[ちえ]を得[え]た」と。そしてわたしの心[こころ]は、多[おお]くの知恵[ちえ]と知識[ちしき]を見[み]た。"
  17: "わたしは知恵[ちえ]と知識[ちしき]を知[し]ろうと心[こころ]を向[む]け、たとえ話[ばなし]と学問[がくもん]を知[し]った。これもまた、風[かぜ]を追[お]うようなものだと分[わ]かった。"
  18: "知恵[ちえ]が多[おお]いところには、多[おお]くの悩[なや]みがあり、知識[ちしき]を増[ふ]やす者[もの]は、苦[くる]しみを増[ふ]やすからである。"

notes:
  1: "Ῥήματα Ἐκκλησιαστοῦ — コヘレトの言葉 (ῥῆμα — «слово, изречение»). Ἐκκλησιαστής — «созывающий собрание» (ἐκκλησία — собрание); в еврейском тексте קֹהֶלֶת (Кохелет). Передаём コヘレト с пояснением, чтобы не смешивать с «проповедником» (伝道者) как конфессиональным термином. υἱοῦ Δαυιδ βασιλέως Ισραηλ ἐν Ιερουσαλημ — ダビデの子、エルサレムのイスラエルの王."
  2: "Ματαιότης ματαιοτήτων — 空しさの空しさ (ματαιότης — «пустота, тщета»; конструкция превосходной степени, как «святое святых»). τὰ πάντα ματαιότης — すべては空しい. 空[むな]しい — постоянное соответствие ματαιότης в книге."
  3: "τίς περισσεία τῷ ἀνθρώπῳ — 何の益を得るのか (περισσεία — «излишек, прибыль»). ἐν παντὶ μόχθῳ αὐτοῦ — すべての労苦によって (μόχθος — 労苦). ὑπὸ τὸν ἥλιον — 日の下で (букв. «под солнцем»; устойчивое выражение книги, передаётся 日[ひ]の下[もと])."
  4: "γενεὰ πορεύεται καὶ γενεὰ ἔρχεται — 世代は去り、世代は来る. ἡ γῆ εἰς τὸν αἰῶνα ἕστηκεν — 地は永遠に立ち続ける (ἵστημι — «стоять»)."
  5: "ἀνατέλλει ὁ ἥλιος καὶ δύνει — 太陽は昇り、沈み. εἰς τὸν τόπον αὐτοῦ ἕλκει — 自分の場所へと引かれて行く (ἕλκω — «влечь»; слав. «влечется», не «спешит», как в Синодальном по масоретскому)."
  6: "ἀνατέλλων αὐτὸς ἐκεῖ πορεύεται πρὸς νότον — 南へ向かって進み (νότος — «юг»). κυκλοῖ πρὸς βορρᾶν — 北へ巡って行き. κυκλοῖ κυκλῶν — 巡りながら進み (усиление). τὸ πνεῦμα — здесь «ветер» (не Дух), поэтому 風[かぜ], а не 霊; в notes отмечено."
  7: "πάντες οἱ χείμαρροι — すべての谷川 (χείμαρρος — «зимний поток, ручей»). ἡ θάλασσα οὐκ ἔσται ἐμπιμπλαμένη — 海は満ちることがない. εἰς τόπον, οὗ οἱ χείμαρροι πορεύονται — 谷川が流れ込む所へ."
  8: "πάντες οἱ λόγοι ἔγκοποι — すべての言葉は人を疲れさせる (ἔγκοπος — «утомительный»; слав. «трудны»). οὐ δυνήσεται ἀνὴρ τοῦ λαλεῖν — 語り尽くすことができない. οὐκ ἐμπλησθήσεται ὀφθαλμὸς τοῦ ὁρᾶν — 目は見て満ち足りず."
  9: "τί τὸ γεγονός, αὐτὸ τὸ γενησόμενον — かつてあったことは、またある (дословно «что было — то и будет»). οὐκ ἔστιν πᾶν πρόσφατον ὑπὸ τὸν ἥλιον — 日の下に新しいものは何もない (πρόσφατος — «недавний, новый»)."
  10: "ὃς λαλήσει καὶ ἐρεῖ Ἰδὲ τοῦτο καινόν ἐστιν — 「見よ、これは新しい」と言う者があっても. ἤδη γέγονεν ἐν τοῖς αἰῶσιν τοῖς γενομένοις ἀπὸ ἔμπροσθεν ἡμῶν — すでに、わたしたちより前の時代にあった (αἰών — «век»)."
  11: "οὐκ ἔστιν μνήμη τοῖς πρώτοις — 昔のことを思い起こす者はなく. καί γε τοῖς ἐσχάτοις γενομένοις οὐκ ἔσται αὐτοῖς μνήμη — 後に来る者も忘れられる. μετὰ τῶν γενησομένων εἰς τὴν ἐσχάτην — さらに後に来る者たちの間で."
  12: "Ἐγὼ Ἐκκλησιαστὴς ἐγενόμην βασιλεὺς ἐπὶ Ισραηλ ἐν Ιερουσαλημ — わたし、コヘレトは、エルサレムでイスラエルの王であった (ἐγενόμην — «стал, был»)."
  13: "ἔδωκα τὴν καρδίαν μου τοῦ ἐκζητῆσαι — 心を尽くして探り調べようとした (ἐκζητέω — «разыскивать»). κατασκέψασθαι ἐν τῇ σοφίᾳ — 知恵によって調べる (κατασκέπτομαι — «обозревать, исследовать»). περισπασμὸν πονηρόν — 苦しい務め (περισπασμός — «занятие, отвлечение»; πονηρός — «тяжкий, злой»). τοῦ περισπᾶσθαι ἐν αὐτῷ — それに携わる."
  14: "εἶδον σὺν πάντα τὰ ποιήματα — すべての業を見た (ποίημα — «дело, творение»). ματαιότης καὶ προαίρεσις πνεύματος — 空しく、風を追うようなもの (προαίρεσις — «стремление, выбор»; πνεῦμα — «ветер»; слав. «произволение духа»; в notes: буквально «порыв ветра»)."
  15: "διεστραμμένον οὐ δυνήσεται τοῦ ἐπικοσμηθῆναι — 曲がったものは直すことができない (ἐπικοσμέω — «приводить в порядок»). ὑστέρημα οὐ δυνήσεται τοῦ ἀριθμηθῆναι — 欠けているものは数えることができない (ὑστέρημα — «недостаток»)."
  16: "ἐλάλησα ἐγὼ ἐν καρδίᾳ μου — 心のうちに語った. ἐμεγαλύνθην καὶ προσέθηκα σοφίαν — 偉大になり、知恵を得た (προστίθημι — «прибавлять»). καρδία μου εἶδεν πολλά, σοφίαν καὶ γνῶσιν — 心は多くの知恵と知識を見た. Слова о себе — в 「…」."
  17: "ἔδωκα καρδίαν μου τοῦ γνῶναι σοφίαν καὶ γνῶσιν — 知恵と知識を知ろうと心を向け. παραβολὰς καὶ ἐπιστήμην ἔγνων — たとえ話と学問を知った (παραβολή — «притча»; ἐπιστήμη — «знание»). προαίρεσις πνεύματος — 風を追うようなもの (см. 1:14)."
  18: "ἐν πλήθει σοφίας πλῆθος γνώσεως — 知恵が多いところには多くの悩み (πλῆθος — «множество»). ὁ προστιθεὶς γνῶσιν προσθήσει ἄλγημα — 知識を増やす者は苦しみを増やす (ἄλγημα — «боль, страдание»; hapax)."
