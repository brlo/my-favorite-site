# jp-box, 2-я Паралипоменон, глава 12. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); второй свидетель — церковнославянский
# (csl-ru); ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет,
# jp-ni не источник (только проверка tmp/sim_jp.rb).
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 12: Сусаким и покаяние Ровоама (1–8), разграбление храма и медные щиты (9–11),
# помилование (12), итог царствования (13–16); параллель — 3 Цар 14:21–31.
# Речи — 「…」: Самея (5), начальники и царь (6); слово Господне к Самее (7–8);
# слова Господа внутри речи Самеи — 『…』 (5). Красного нет.
# Паритет: csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes.
# Нумерация — по gr-lxx-byz, 16 стихов; совпадает с csl.
# 〔…〕 нет. Сносок ⟨…⟩ нет: 盾, 近衛, 武具庫 уже в корпусе (ср. 3 Цар 14).
# jp-ni не использовался.

tr_code: jp-box
book: 2par
chapter: 12
draft: true

verses:
  1: "レハブアムの王国[おうこく]が固[かた]まり、彼が強[つよ]くなったとき、彼は主[しゅ]の戒[いまし]めを捨[す]てた。イスラエルもすべて、彼とともにそうした。"
  2: "彼の王国[おうこく]の第五[だいご]年[ねん]に、エジプトの王[おう]シシャクがエルサレムに上[のぼ]って来[き]た。彼らが主[しゅ]の前[まえ]に罪[つみ]を犯[おか]したからである。"
  3: "彼とともにエジプトから来[き]た戦車[せんしゃ]は千二百[せんにひゃく]台[だい]、騎兵[きへい]は六万[ろくまん]であった。彼とともに来た民[たみ]の数[かず]は限[かぎ]りがなく、リビア人[じん]、トログロディテ人[じん]、エチオピア人[じん]であった。"
  4: "彼はユダにある要害[ようがい]の町[まち]々[まち]を取[と]り、エルサレムにまで来[き]た。"
  5: "預言者[よげんしゃ]サメヤは、シシャクの前[まえ]からエルサレムに集[あつ]まっていたレハブアムとユダの長[おさ]たちのもとに来[き]て、彼らに言[い]った。「主[しゅ]はこう言われる。『あなたがたはわたしを捨[す]てた。だからわたしもあなたがたを捨てて、シシャクの手[て]に渡[わた]す。』」"
  6: "イスラエルの長[おさ]たちと王[おう]は恥[は]じ入[い]って言[い]った。「主[しゅ]は正[ただ]しい。」"
  7: "主[しゅ]が、彼らが恥[は]じ入[い]ったのを見[み]られたとき、主の言葉[ことば]がサメヤに臨[のぞ]んで言[い]った。「彼らは恥じ入った。わたしは彼らを滅[ほろ]ぼさない。彼らに少[すこ]しの救[すく]いを与[あた]え、わたしの怒[いか]りをエルサレムに注[そそ]ぐことはしない。"
  8: "しかし彼らは僕[しもべ]となる。わたしに仕[つか]えることと、地[ち]の王国[おうこく]に仕えることとを知[し]るためである。」"
  9: "エジプトの王[おう]シシャクはエルサレムに上[のぼ]って来[き]て、主[しゅ]の家[いえ]の宝[たから]と王の家の宝を取[と]った。彼はすべてを取った。ソロモンが造[つく]った金[きん]の盾[たて]も取った。"
  10: "レハブアム王[おう]は、その代[か]わりに青銅[せいどう]の盾[たて]を造[つく]った。シシャクは彼[かれ]の上[うえ]に、王の門[もん]を守[まも]る近衛[このえ]の長[ちょう]たちを置[お]いた。"
  11: "王[おう]が主[しゅ]の家[いえ]に入[はい]るたびに、門[もん]を守[まも]る者[もの]たちと近衛[このえ]の者たちは入り、また自分[じぶん]たちの武具庫[ぶぐこ]へ戻[もど]って行[い]った。"
  12: "彼が恥[は]じ入[い]ったとき、主[しゅ]の怒[いか]りは彼から離[はな]れ、彼を最後[さいご]まで滅[ほろ]ぼすには至[いた]らなかった。ユダにも良[よ]いものがあったからである。"
  13: "レハブアム王[おう]はエルサレムで強[つよ]くなり、王として治[おさ]めた。彼は四十一歳[よんじゅういっさい]で王となり、エルサレムで十七年[じゅうななねん]治めた。エルサレムは、主[しゅ]がイスラエルの子[こ]らのすべての部族[ぶぞく]の中[なか]から選[えら]んで、そこにご自分[じぶん]の名[な]を置[お]かれた町[まち]である。母[はは]の名はナアマといい、アンモン人[じん]であった。"
  14: "彼は悪[わる]を行[おこな]った。主[しゅ]を求[もと]めるために心[こころ]を向[む]けなかったからである。"
  15: "レハブアムの言葉[ことば]の初[はじ]めのものも後[のち]のものも、見[み]よ、預言者[よげんしゃ]サメヤと先見者[せんけんしゃ]アッドの言葉のうちに、また彼の行[おこな]いが書[か]かれているではないか。レハブアムとヤロブアムの間[あいだ]には、いつも戦[たたか]いがあった。"
  16: "レハブアムは父[ちち]たちとともに眠[ねむ]り、ダビデの町[まち]に葬[ほうむ]られた。そしてその子[こ]アビヤが彼の代[か]わりに王[おう]となった。"

notes:
  1: "ὡς ἡτοιμάσθη — когда устроилось (ἑτοιμάζω); ὡς κατεκρατήθη — когда утвердился (κατακρατέω); ἐγκατέλιπεν τὰς ἐντολὰς κυρίου — оставил заповеди Господни (ἐντολή, 戒め); πᾶς Ισραηλ μετ᾿ αὐτοῦ — весь Израиль с ним."
  2: "ἐν τῷ πέμπτῳ ἔτει τῆς βασιλείας Ροβοαμ — в пятый год царствования Ровоама; ἀνέβη Σουσακιμ βασιλεὺς Αἰγύπτου — взошёл Сусаким, царь Египетский (Σουσακιμ = Шешонк I; シシャク, форма корпуса, ср. 3 Цар 14:25); ὅτι ἥμαρτον — ибо согрешили; ἐναντίον κυρίου — пред Господом."
  3: "ἐν χιλίοις καὶ διακοσίοις ἅρμασιν — с 1200 колесницами; ἑξήκοντα χιλιάσιν ἵππων — 60 000 конницы (всадников; ἵππος); οὐκ ἦν ἀριθμός — не было числа; Λίβυες — ливийцы (リビア人); Τρωγλοδύται — троглодиты (トログロディテ人, «пещерные жители»); Αἰθίοπες — эфиопы (エチオピア人). В ru «Сукхитам» — по МТ, в LXX и csl «троглодитяне»."
  4: "κατεκράτησαν τῶν πόλεων τῶν ὀχυρῶν — овладели укреплёнными городами (κατακρατέω); αἳ ἦσαν ἐν Ιουδα — которые были в Иудее; ἦλθεν εἰς Ιερουσαλημ — пришёл (дошёл) до Иерусалима."
  5: "ἀπὸ προσώπου Σουσακιμ — от лица Сусакима; τοὺς συναχθέντας εἰς Ιερουσαλημ — собравшихся в Иерусалим; Οὕτως εἶπεν κύριος — так сказал Господь; Ὑμεῖς ἐγκατελίπετέ με, κἀγὼ ἐγκαταλείψω ὑμᾶς — вы оставили Меня, и Я оставлю вас (ἐγκαταλείπω дважды); ἐν χειρὶ Σουσακιμ — в руку Сусакима."
  6: "ᾐσχύνθησαν — устыдились, были посрамлены (αἰσχύνω; слав. «посрамишася»); οἱ ἄρχοντες Ισραηλ — начальники Израиля; Δίκαιος ὁ κύριος — праведен Господь (正しい). В ru «смирились» — по МТ; в LXX и csl «устыдились»; та же тема в 12:7, 12 (ἐντρέπω)."
  7: "ἐν τῷ ἰδεῖν κύριον ὅτι ἐνετράπησαν — когда увидел Господь, что они устыдились; ἐγένετο λόγος κυρίου πρὸς Σαμαιαν — было слово Господне к Самее; οὐ καταφθερῶ αὐτούς — не истреблю их (καταφθείρω); δώσω αὐτοὺς ὡς μικρὸν εἰς σωτηρίαν — дам им «как немногое» во спасение (слав. «вмале спасение»), т. е. небольшую и скорую помощь; οὐ μὴ στάξῃ ὁ θυμός μου — не «капнет», не прольётся гнев Мой (στάζω); ἐν Ιερουσαλημ — в Иерусалиме (слав. «на Иерусалим»). В ru добавлено «рукою Сусакима» — в LXX и csl нет."
  8: "ἔσονται εἰς παῖδας — будут рабами (παῖς); γνώσονται τὴν δουλείαν μου — познают работу Мою, т. е. служение Мне (δουλεία); τὴν δουλείαν τῆς βασιλείας τῆς γῆς — работу царства земли (служение земным царствам)."
  9: "θησαυροί — сокровища; οἶκος κυρίου — дом Господень (神殿); οἶκος τοῦ βασιλέως — дом царя; τὰ πάντα ἔλαβεν — всё взял; θυρεοὺς τοὺς χρυσοῦς — золотые (большие) щиты; οὓς ἐποίησεν Σαλωμων — которые сделал Соломон (см. 9:15–16)."
  10: "θυρεοὺς χαλκοῦς ἀντ αὐτῶν — медные (бронзовые) щиты вместо них; κατέστησεν ἐπ᾿ αὐτὸν Σουσακιμ ἄρχοντας παρατρεχόντων — Сусаким поставил над ним начальников телохранителей (παρατρέχω); τοὺς φυλάσσοντας τὸν πυλῶνα τοῦ βασιλέως — охраняющих вход (ворота) царя (πυλών). В csl «постави на ним сусаким царь египетский началников предходящих» — то же; в ru «отдал их на руки начальникам телохранителей» — по МТ, без Сусакима."
  11: "εἰσεπορεύοντο οἱ φυλάσσοντες καὶ οἱ παρατρέχοντες — входили стражи и телохранители; οἱ ἐπιστρέφοντες — возвращающиеся; εἰς ἀπάντησιν τῶν παρατρεχόντων — навстречу телохранителям (тёмное место LXX); в csl добавлено «ко оружехранителнице своей» — в свою оружейную (武具庫), внесено в текст; в LXX этой части нет."
  12: "ἐν τῷ ἐντραπῆναι αὐτὸν — когда он устыдился; ἀπεστράφη ἀπ᾿ αὐτοῦ ὀργὴ κυρίου — отвратился от него гнев Господень; οὐκ εἰς καταφθορὰν εἰς τέλος — не в истребление до конца (καταφθορά, τέλος); λόγοι ἀγαθοί — слова добрые (доброе)."
  13: "κατίσχυσεν — укрепился (κατισχύω); τεσσαράκοντα καὶ ἑνὸς ἐτῶν — сорока одного года (41); ἑπτακαίδεκα ἔτη — 17 лет; ἐπονομάσαι τὸ ὄνομα αὐτοῦ — назвать имя Своё; Νοομμα ἡ Αμμανῖτις — Наама Аммонитянка (в LXX Νοομμα, в csl «ноома»; форма корпуса ナアマ, ср. 3 Цар 14:21)."
  14: "ἐποίησεν τὸ πονηρόν — сотворил лукавое; οὐ κατεύθυνεν τὴν καρδίαν αὐτοῦ — не направил сердца своего (κατευθύνω); ἐκζητῆσαι τὸν κύριον — взыскать Господа."
  15: "λόγοι οἱ πρῶτοι καὶ οἱ ἔσχατοι — слова первые и последние, т. е. дела; γεγραμμένοι — записаны (γράφω); ἐν τοῖς λόγοις Σαμαια τοῦ προφήτου καὶ Αδδω τοῦ ὁρῶντος — в словах Самеи пророка и Адды прозорливца (アッド; слав. «адда», ru «Адды»); πράξεις αὐτοῦ — деяния его; ἐπολέμει — воевал (имперфект); πάσας τὰς ἡμέρας — во все дни."
  16: "ἀπέθανεν — умер; ἐτάφη μετὰ τῶν πατρῶν αὐτοῦ — погребён с отцами своими; ἐν πόλει Δαυιδ — в городе Давида; ἐβασίλευσεν Αβια υἱὸς αὐτοῦ ἀντ αὐτοῦ — воцарился Авия, сын его, вместо него."
