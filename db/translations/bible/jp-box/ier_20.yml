chapter: 20
draft: true

verses:
  1: "祭司[さいし]パスクルは、エメルの子[こ]で、主[しゅ]の家[いえ]の監督[かんとく]に任[にん]じられていた者[もの]である。彼[かれ]は、エレミヤがこれらの言葉[ことば]を預言[よげん]するのを聞[き]いた。"
  2: "そして、パスクルは預言者[よげんしゃ]エレミヤを打[う]ちたたき、木[き]の台[だい]にはめ込[こ]んだ。それは、主[しゅ]の家[いえ]にあるベニヤミンの上[うえ]の門[もん]のそばにあった。"
  3: "翌日[よくじつ]、パスクルはエレミヤをその木[き]の台[だい]から出[だ]した。エレミヤは彼[かれ]に言[い]った。「主[しゅ]はあなたの名[な]を『パスクル』ではなく、『いたるところから移[うつ]り住[す]む者[もの]』と呼[よ]ばれた。"
  4: "なぜなら主[しゅ]はこう言[い]われる。『見[み]よ、わたしはあなたを、あなたのすべての友[とも]とともに移[うつ]す。彼らは敵[てき]の剣[つるぎ]で倒[たお]れ、あなたの目[め]はそれを見[み]る。わたしはあなたとユダのすべてをバビロンの王[おう]の手[て]に渡[わた]す。彼らは捕[と]らえられてバビロンへ移[うつ]され、剣[つるぎ]で切[き]り殺[ころ]される。"
  5: "また、わたしはこの都[みやこ]のすべての力[ちから]、そのすべての労苦[ろうく]、ユダの王[おう]のすべての宝[たから]を、その敵[てき]の手[て]に渡[わた]す。彼らはそれらを奪[うば]い、取[と]り上[あ]げ、バビロンへ運[はこ]び去[さ]る。"
  6: "あなたも、パスクル、あなたの家[いえ]に住[す]むすべての者[もの]も捕囚[ほしゅう]となって行[い]き、あなたはバビロンで死[し]に、そこに葬[ほうむ]られる。あなたも、あなたが偽[いつわ]りを預言[よげん]したすべての友[とも]も。』」"
  7: "「主[しゅ]よ、あなたはわたしを欺[あざむ]き、わたしは欺かれた。あなたはわたしより強[つよ]く、わたしを押[お]さえつけた。わたしは日[ひ]中[なか]笑[わら]い者[もの]となり、すべての人[ひと]がわたしを嘲[あざけ]る。"
  8: "わたしは苦[にが]い言葉[ことば]で笑[わら]い、無法[むほう]と悲惨[ひさん]を呼[よ]び求[もと]める。主[しゅ]の言葉[ことば]が、日[ひ]中[なか]、わたしの辱[はずかし]めと嘲[あざけ]りになったからである。"
  9: "わたしは言[い]った。『もう主[しゅ]の名[な]を唱[とな]えず、その名[な]によって語[かた]ることもやめよう。』しかし、それはわたしの心[こころ]の中[なか]、骨[ほね]の中で燃[も]えさかる火[ひ]のようになり、わたしは四方[しほう]から弱[よわ]り果[は]てて、それに耐[た]えることができない。"
  10: "わたしは多[おお]くの者[もの]の罵[ののし]りを聞[き]いた。周[まわ]りに集[あつ]まった者[もの]たちが言[い]う。『攻[せ]めかかれ。彼[かれ]を攻めよう。彼の友[とも]である者[もの]はみな、彼の企[くわだ]てを見張[みは]れ。彼が惑[まど]わされて、われわれが彼を捕[と]らえ、復讐[ふくしゅう]を遂[と]げられるように。』"
  11: "しかし、主[しゅ]は強[つよ]い戦士[せんし]のようにわたしとともにおられる。だから、わたしを追[お]う者[もの]はつまずき、悟[さと]ることができない。彼らは大[おお]いに恥[はじ]を受[う]ける。彼らは自分[じぶん]の辱[はずかし]めを悟らず、その辱めは永遠[えいえん]に忘れられないからである。"
  12: "万軍[ばんぐん]の主[しゅ]よ、あなたは正[ただ]しい者[もの]を試[ため]し、腎臓[じんぞう]と心[こころ]をご覧[らん]になる。彼らへのあなたの復讐[ふくしゅう]を見[み]させてください。あなたにわたしの訴[うった]えを明[あ]かしたからである。"
  13: "主[しゅ]に歌[うた]え、主をほめたたえよ。主は貧[まず]しい者[もの]の魂[たましい]を悪[わる]い者[もの]の手[て]から救[すく]い出[だ]したからである。"
  14: "わたしが生[う]まれた日[ひ]は呪[のろ]われているように。母[はは]がわたしを産[う]んだ日は、祝福[しゅくふく]された日とならないように。"
  15: "わたしの父[ちち]に『男[おとこ]の子[こ]が生[う]まれた』と告[つ]げて、喜[よろこ]びに沸[わ]かせたその人[ひと]は、呪[のろ]われているように。"
  16: "その人[ひと]は、主[しゅ]が怒[いか]りをもって滅[ほろ]ぼし、悔[く]いなかった町[まち]々[まち]のようになるように。その人は朝[あさ]に叫[さけ]び声[ごえ]を、昼[ひる]に嘆[なげ]き声[ごえ]を聞[き]くように。"
  17: "母[はは]の胎[たい]の中[なか]で、わたしは殺[ころ]されなかったからである。そうなっていれば、母[はは]はわたしの墓[はか]となり、その胎[たい]は永遠[えいえん]に身[み]ごもったままであった。"
  18: "なぜわたしは胎[たい]から出[で]て、労苦[ろうく]と病[やまい]を見[み]るのか。わたしの日[ひ]々[び]は恥[はじ]の中で尽[つ]きた。」"

notes:
  1: "Πασχωρ υἱὸς Εμμηρ ὁ ἱερεύς — «Пасхор, сын Еммера, священник»: имя отца — エメル (греч. Εμμηρ; слав. «еммеров»). οὗτος ἦν καθεσταμένος ἡγούμενος οἴκου κυρίου — «он был поставлен начальником (надзирателем) дома Господня» (καθίστημι — ставить, назначать; ἡγούμενος — начальствующий). τοῦ Ιερεμιου προφητεύοντος — «когда Иеремия пророчествовал» (родительный самостоятельный). Пасхор — パスクル; он же священник и начальник храмовой стражи."
  2: "ἐπάταξεν αὐτόν — «ударил его» (πατάσσω); ἐνέβαλεν αὐτὸν εἰς τὸν καταρράκτην — «вверг его в колоду» (καταρράκτης — колода, деревянная колодка для ног и рук; слав. «клада»); ὃς ἦν ἐν πύλῃ οἴκου ἀποτεταγμένου τοῦ ὑπερῴου — «что была в воротах дома отделённого (назначенного), верхнего» (ἀποτεταγμένος — отделённый; ὑπερῷον — верхняя горница). Слав. добавляет «вениаминих» (верхние ворота Вениаминовы) — в LXX нет (чтение МТ); внесено (ベニヤミン). В тексте 木の台 («деревянная колодка») — редкое слово, пояснено здесь."
  3: "ἐξήγαγεν Πασχωρ τὸν Ιερεμιαν ἐκ τοῦ καταρράκτου — «вывел Пасхор Иеремию из колоды»; Οὐχὶ Πασχωρ ἐκάλεσεν κύριος τὸ ὄνομά σου, ἀλλ᾽ ἢ Μέτοικον — «не „Пасхор“ назвал Господь имя твоё, но „Метойкос“» (μέτοικος — переселенец, пришлый). У МТ имя звучит «Магор Миссавив» («ужас вокруг»), LXX переводит его смыслом; слав. «но преселника отвсюду» (добавляет «отовсюду») — внесено (いたるところから移り住む者). У ru имя транслитерировано — не внесено. Имя в 『』 — как цитата имени."
  4: "διότι τάδε λέγει κύριος — «ибо так говорит Господь»; δίδωμί σε εἰς μετοικίαν σὺν πᾶσι τοῖς φίλοις σου — «отдаю тебя в переселение со всеми друзьями твоими» (μετοικία — переселение); πεσοῦνται ἐν μαχαίρᾳ ἐχθρῶν αὐτῶν — «падут мечом врагов своих»; οἱ ὀφθαλμοί σου ὄψονται — «очи твои увидят»; δώσω εἰς χεῖρας βασιλέως Βαβυλῶνος — «отдам в руки царя Вавилонского»; μετοικιοῦσιν αὐτοὺς καὶ κατακόψουσιν ἐν μαχαίραις — «переселят их и посекут мечами» (κατακόπτω — посекать); в LXX актив 3-го л. мн. (вавилоняне), в тексте — страдательный оборот, чтобы «彼らは彼らを» не читалось двусмысленно. Слав. добавляет «и преведут их в вавилон» — в LXX нет; внесено (バビロンへ移し). Слово Господа внутри речи пророка — 『…』."
  5: "δώσω τὴν πᾶσαν ἰσχὺν τῆς πόλεως ταύτης — «отдам всю силу (крепость) города сего»; πάντας τοὺς πόνους αὐτῆς — «все труды его» (πόνος — труд, страдание); θησαυροὺς τοῦ βασιλέως Ιουδα — «сокровища царя Иудина»; ἄξουσιν αὐτοὺς εἰς Βαβυλῶνα — «отнесут их в Вавилон». Слав. добавляет «и расхитят их и возмут» — в LXX нет; внесено без 〔…〕 (奪い、取り上げ)."
  6: "σὺ καὶ πάντες οἱ κατοικοῦντες ἐν τῷ οἴκῳ σου πορεύσεσθε ἐν αἰχμαλωσίᾳ — «ты и все живущие в доме твоём пойдёте в плен» (αἰχμαλωσία — плен); ἐν Βαβυλῶνι ἀποθανῇ καὶ ἐκεῖ ταφήσῃ — «в Вавилоне умрёшь и там будешь похоронен»; οἷς ἐπροφήτευσας αὐτοῖς ψευδῆ — «которым ты пророчествовал ложь». Слав. вставляет в начале имя «пасхор» — в LXX нет; внесено (パスクル). Здесь закрываются 『…』 и 「…」 речи пророка к Пасхору."
  7: "Ἠπάτησάς με, κύριε, καὶ ἠπατήθην — «Ты обманул (обольстил) меня, Господи, и я обманут» (ἀπατάω — обманывать, обольщать; слав. «прельстил мя еси… и прельщен есмь»); ἐκράτησας καὶ ἠδυνάσθης — «Ты овладел [мною] и превозмог» (κρατέω — держать, овладевать; δύναμαι — быть сильным); ἐγενόμην εἰς γέλωτα — «я стал посмешищем»; πᾶσαν ἡμέραν διετέλεσα μυκτηριζόμενος — «весь день провёл я в поругании» (μυκτηρίζω — издеваться). У ru (МТ) «Ты влек меня» — иное чтение, не внесено. Место не сглаживается: пророк говорит Богу об обмане; это одна из вершин книги."
  8: "πικρῷ λόγῳ μου γελάσομαι — «горьким словом моим засмеюсь» (πικρός — горький; γελάω — смеяться), слав. «горьким словом моим посмеюся»; ἀθεσίαν καὶ ταλαιπωρίαν ἐπικαλέσομαι — «беззаконие и бедствие призову» (ἀθεσία — беззаконие, отвержение; ταλαιπωρία — бедствие), слав. «отвержение и бедность наведу»; ἐγενήθη λόγος κυρίου εἰς ὀνειδισμόν μοι — «слово Господне стало мне в поношение»; εἰς χλευασμόν — «в насмешку» (χλευασμός). Место тёмное: у ru (МТ) «лишь только начну говорить — кричу о насилии, вопию о разорении»; держим LXX/csl, вариант МТ не внесён."
  9: "Οὐ μὴ ὀνομάσω τὸ ὄνομα κυρίου — «не буду именовать имя Господне» (ὀνομάζω — именовать); οὐ μὴ λαλήσω ἔτι ἐπὶ τῷ ὀνόματι αὐτοῦ — «не буду более говорить во имя Его»; ἐγένετο ὡς πῦρ καιόμενον φλέγον ἐν τοῖς ὀστέοις μου — «стало как огонь горящий, пылающий в костях моих» (καίω — жечь; φλέγω — пылать); слав. добавляет «в сердцы моем» — в LXX нет (чтение МТ); внесено (心の中、骨の中で). παρεῖμαι πάντοθεν — «я ослаблен отовсюду» (παρίημι — ослаблять); οὐ δύναμαι φέρειν — «не могу нести». Собственные слова пророка — 『…』."
  10: "ἤκουσα ψόγον πολλῶν — «я слышал злословие многих» (ψόγος — поношение); συναθροιζομένων κυκλόθεν — «собирающихся вокруг»; Ἐπισύστητε καὶ ἐπισυστῶμεν αὐτῷ — «нападите, и нападём на него» (ἐπισυνίστημι — собираться против); πάντες ἄνδρες φίλοι αὐτοῦ — «все мужи, друзья его»; τηρήσατε τὴν ἐπίνοιαν αὐτοῦ — «наблюдайте замысел его» (ἐπίνοια); εἰ ἀπατηθήσεται — «не обольстится ли (не попадётся ли)»; δυνησόμεθα αὐτῷ — «одолеем его»; λημψόμεθα τὴν ἐκδίκησιν ἡμῶν ἐξ αὐτοῦ — «возьмём отмщение наше от него». Слова толпы — 『…』; у ru «заявите, и мы сделаем донос» — МТ, не внесено."
  11: "κύριος μετ᾽ ἐμοῦ καθὼς μαχητὴς ἰσχύων — «Господь со мною, как сильный воин» (μαχητής — воин, ратоборец; ἰσχύω — быть сильным); ἐδίωξαν καὶ νοῆσαι οὐκ ἠδύναντο — «гнали и уразуметь не могли»; ᾐσχύνθησαν σφόδρα — «постыдились весьма»; ὅτι οὐκ ἐνόησαν ἀτιμίας αὐτῶν — «ибо не уразумели бесчестия своего» (ἀτιμία); αἳ δι᾽ αἰῶνος οὐκ ἐπιλησθήσονται — «которое вовеки не забудется»."
  12: "κύριε δοκιμάζων δίκαια — «Господи, испытующий праведное» (δοκιμάζω — испытывать); συνίων νεφροὺς καὶ καρδίας — «разумеющий почки и сердца» (συνίημι — понимать; νεφροί — почки, внутренности); ἴδοιμι τὴν παρὰ σοῦ ἐκδίκησιν ἐν αὐτοῖς — «да увижу от Тебя отмщение в них»; ὅτι πρὸς σὲ ἀπεκάλυψα τὰ ἀπολογήματά μου — «ибо Тебе открыл я оправдания (защиту) мою» (ἀπολόγημα). Слав. добавляет «Господи сил» и «(молютися,)» — в LXX нет; «сил» внесено (万軍の主)."
  13: "ᾄσατε τῷ κυρίῳ, αἰνέσατε αὐτῷ — «пойте Господу, хвалите Его»; ὅτι ἐξείλατο ψυχὴν πένητος ἐκ χειρὸς πονηρευομένων — «ибо избавил душу бедного от руки злодеев» (ἐξαιρέω — избавлять; πένης — бедный; πονηρεύομαι — делать зло). Слав. «яко избави душу убогаго от руки лукавых»."
  14: "ἐπικατάρατος ἡ ἡμέρα, ἐν ᾗ ἐτέχθην ἐν αὐτῇ — «проклят день, в который я родился»; ἡ ἡμέρα, ἐν ᾗ ἔτεκέν με ἡ μήτηρ μου, μὴ ἔστω ἐπευκτή — «день, в который родила меня мать моя, да не будет вожделенным» (ἐπευκτός — желанный, благословенный); слав. «да не будет благословен». Ср. Иов 3:3–10."
  15: "ἐπικατάρατος ὁ ἄνθρωπος ὁ εὐαγγελισάμενος τῷ πατρί μου — «проклят человек, принёсший весть отцу моему» (εὐαγγελίζομαι — приносить весть); λέγων Ἐτέχθη σοι ἄρσεν — «говоря: родился тебе младенец мужеского пола» (ἄρσεν — мужского пола); εὐφραινόμενος — «радуясь»; слав. «и яко радостию возвесели его»."
  16: "ἔστω ὁ ἄνθρωπος ἐκεῖνος ὡς αἱ πόλεις, ἃς κατέστρεψεν κύριος ἐν θυμῷ καὶ οὐ μετεμελήθη — «да будет человек тот как города, которые разрушил Господь в гневе и не раскаялся» (καταστρέφω — ниспровергать); ἀκουσάτω κραυγῆς τὸ πρωῒ καὶ ἀλαλαγμοῦ μεσημβρίας — «да услышит вопль утром и клик (рыдание) в полдень» (ἀλαλαγμός — вопль, боевой клик); слав. «да слышит вопль заутра и рыдание во время полуденное». Намёк на Содом и Гоморру."
  17: "ὅτι οὐκ ἀπέκτεινέν με ἐν μήτρᾳ μητρός — «ибо не умертвил меня в утробе матери» (ἀποκτείνω); ἐγένετό μοι ἡ μήτηρ μου τάφος μου — «была бы мне мать моя гробом моим»; ἡ μήτρα συλλήμψεως αἰωνίας — «утроба — [зачатия] вечного» (σύλλημψις — зачатие). Слав. «яко не убил мене в ложеснах матере, и была бы мне мати моя гроб мой и ложесна зачатия вечнаго». Сослагательность передана оборотом そうなっていれば…あった."
  18: "ἵνα τί τοῦτο ἐξῆλθον ἐκ μήτρας — «для чего я вышел из утробы?» (ἵνα τί — для чего); τοῦ βλέπειν κόπους καὶ πόνους — «чтобы видеть труды и болезни» (κόπος — труд; πόνος — боль, страдание); διετέλεσαν ἐν αἰσχύνῃ αἱ ἡμέραι μου — «проведены в стыде дни мои» (διατελέω — проводить; αἰσχύνη — стыд). Слав. «Вскую изыдох из ложесн, да вижду труды и болезни, и скончашася в постыдении дние мои?» Конец исповеди; 「…」 закрывается здесь."
