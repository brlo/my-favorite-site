# jp-box, Исаия, глава 4. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для главы есть, сверен; в текст не копировался; jp-ni не
# использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 4: 1 семь женщин хватаются за одного мужчину; 2–6 лирический оракул о дне
# Господнем: Бог воссияет, остаток Израиля прославлен, остаток в Сионе назван
# святым, скверна омыта духом суда и жжения, над Сионом — облако и огонь, шатёр
# от зноя и дождя.
# Голоса: 4:1 — слова женщин в 「…」 (одна цитата в пределах стиха). 4:2–6 — не
# прямая речь: в брифе этот отрывок назван в ряду «песен», но в греч. тексте он
# целиком в 3-м лице (Бог, остаток, Господь), первого лица нет, поэтому кавычек
# нет — по правилу «авторский текст и пророческие возгласы без кавычек». Если
# приёмка решит иначе, менять только 4:2–6.
# Нумерация по gr: 6 стихов, совпадает с csl и ru. Внутри стихов деление то же.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz. Слав. добавления «кровь
# Иерусалимску» (4:4) и «Господь» при ἥξει (4:5) внесены в основной текст без
# скобок, в notes отмечено «нет в LXX».
# Сносок ⟨…⟩ нет: 汚れ, 霊, 裁き, 栄光, 雲, 煙 уже в корпусе.
# Имена: シオン, イスラエル, エルサレム; новых имён нет.

tr_code: jp-box
book: is
chapter: 4
draft: true

verses:
  1: "その日[ひ]、七人[ななにん]の女[おんな]が一人[ひとり]の男[おとこ]をつかんで言[い]う。「自分[じぶん]のパンは自分で食[た]べ、自分[じぶん]の着物[きもの]は自分で着[き]る。ただ、あなたの名[な]で、われわれが呼[よ]ばれるようにしてくれ。われわれの恥[はじ]を取[と]り除[のぞ]いてくれ。」"
  2: "その日[ひ]、神[かみ]は地[ち]の上[うえ]で、栄光[えいこう]とともに、その計[はか]らいのうちに輝[かがや]き、イスラエルの残[のこ]りの者[もの]を高[たか]め、栄光を与[あた]える。"
  3: "そして、シオンに残[のこ]された者[もの]、エルサレムに残された者は聖[せい]なる者[もの]と呼[よ]ばれる。エルサレムで命[いのち]に記[しる]された者[もの]すべてである。"
  4: "主[しゅ]がシオンの息子[むすこ]たちと娘[むすめ]たちの汚[けが]れを洗[あら]い流[なが]し、その中[なか]からエルサレムの血[ち]を、裁[さば]きの霊[れい]と焼[や]く霊[れい]とによって清[きよ]めるからである。"
  5: "主[しゅ]は来[こ]られる。そして、シオンの山[やま]のすべての場所[ばしょ]と、その周[まわ]りのすべてのものの上[うえ]に、昼[ひる]は雲[くも]が、夜[よる]は煙[けむり]のように、燃[も]える火[ひ]の光[ひかり]のように、覆[おお]いかかる。すべての栄光[えいこう]によって覆[おお]われる。"
  6: "そして、それは暑[あつ]さから守[まも]る陰[かげ]となり、激[はげ]しさと雨[あめ]から守る覆[おお]い、また隠[かく]れ場[ば]となる。"

notes:
  1: "ἐπιλήμψονται ἑπτὰ γυναῖκες ἀνθρώπου ἑνός — «ухватятся семь женщин за одного человека» (ἐπιλαμβάνομαι — хватать). Τὸν ἄρτον ἡμῶν φαγόμεθα — «хлеб наш будем есть» (будущее); τὰ ἱμάτια ἡμῶν περιβαλούμεθα — «в одежды наши облечёмся» (περιβάλλω). πλὴν τὸ ὄνομα τὸ σὸν κεκλήσθω ἐφ᾽ ἡμᾶς — «только имя твоё да будет названо на нас», т. е. пусть нас называют твоим именем (о браке); слав. «точию имя твое да наречется на нас». ἄφελε τὸν ὀνειδισμὸν ἡμῶν — «сними позор наш» (ὀνειδισμός — поношение, 恥). Слова женщин — 「…」."
  2: "ἐπιλάμψει ὁ θεὸς ἐν βουλῇ μετὰ δόξης ἐπὶ τῆς γῆς — «воссияет Бог в совете со славою на земле»: ἐν βουλῇ — «в совете, в решении» (βουλή), место тёмное, передано その計らいのうちに; слав. «в совете». τοῦ ὑψῶσαι καὶ δοξάσαι τὸ καταλειφθὲν τοῦ Ισραηλ — «чтобы возвысить и прославить оставшееся Израиля» (ὑψόω, δοξάζω; καταλείπω — оставлять). У ru (МТ) «отрасль Господа явится в красоте и чести, и плод земли…» — иное чтение (צֶמַח, «отрасль»), в текст не внесено; это место отмечено и в шапке."
  3: "τὸ ὑπολειφθὲν ἐν Σιων καὶ τὸ καταλειφθὲν ἐν Ιερουσαλημ — «оставшееся в Сионе и оставленное в Иерусалиме»: разные приставки ὑπο- и κατα- сохранены двумя глаголами. ἅγιοι κληθήσονται — «святыми назовутся» (ἅγιος — святой, 聖なる). πάντες οἱ γραφέντες εἰς ζωὴν ἐν Ιερουσαλημ — «все записанные в жизнь в Иерусалиме» (γράφω — писать; εἰς ζωήν — «в жизнь»); слав. «написаннии в жизнь»; у ru (МТ) «в книгу для житья» — слово «книга» добавлено, не внесено."
  4: "ὅτι ἐκπλυνεῖ κύριος τὸν ῥύπον — «ибо отмоет Господь грязь» (ἐκπλύνω — отмывать; ῥύπος — грязь, скверна); τῶν υἱῶν καὶ τῶν θυγατέρων Σιων — «сынов и дочерей Сиона». τὸ αἷμα ἐκκαθαριεῖ ἐκ μέσου αὐτῶν — «кровь очистит из среды их» (ἐκκαθαρίζω). ἐν πνεύματι κρίσεως καὶ πνεύματι καύσεως — «духом суда и духом жжения (зноя)» (καῦσις — жжение, зной; слав. «духом зноя»). Слав. добавляет при «кровь» слово «Иерусалимску» — в LXX только «кровь»; по паритету внесено в основной текст без скобок (エルサレムの血), в notes отмечено как «нет в LXX»."
  5: "καὶ ἥξει — «и придёт»: подлежащее в греч. не названо; слав. добавляет «Господь» («и приидет Господь») — этого нет в LXX, но по паритету внесено в основной текст без скобок (主は来られる). πᾶς τόπος τοῦ ὄρους Σιων καὶ πάντα τὰ περικύκλῳ αὐτῆς — «всякое место горы Сиона и всё вокруг неё» (περικύκλῳ — кругом). σκιάσει νεφέλη ἡμέρας — «осенит облако днём» (σκιάζω — осенять, покрывать тенью; νεφέλη — облако); ὡς καπνοῦ καὶ ὡς φωτὸς πυρὸς καιομένου νυκτός — «как дыма и как света огня горящего ночью»: родительные сравнения сохранены. πάσῃ τῇ δόξῃ σκεπασθήσεται — «всякою славою покроется» (σκεπάζω — покрывать)."
  6: "εἰς σκιὰν ἀπὸ καύματος — «в тень от зноя» (καῦμα — зной); ἐν σκέπῃ καὶ ἐν ἀποκρύφῳ — «в покрове и в сокровении» (σκέπη — кров, покров; ἀπόκρυφον — укрытие); ἀπὸ σκληρότητος καὶ ὑετοῦ — «от жестокости и дождя» (σκληρότης — суровость, непогода; ὑετός — дождь); слав. «от жестости и дождя». Три образа — тень, покров, укрытие — при одном сказуемом, как в греч."
