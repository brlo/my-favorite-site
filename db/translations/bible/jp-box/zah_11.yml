# jp-box, Захария, глава 11. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной (совпадает с gr: 17 стихов).
# Язык — современный 常体; 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1–3 плач о Ливане, кедрах, кипарисе, дубах Васанских, голос пастырей
# и львов; 4–6 «паси овец заклания», покупатели и продавцы, «благословен Господь»,
# предание людей в руки ближнего и царя; 7 два жезла — «благоволение» и «узы»;
# 8–11 три пастыря, «не буду пасти вас», жезл переломлен, бедные овцы узнают слово;
# 12–13 тридцать сребреников, горнило (в МТ — сокровищница и горшечник; цит. Мф 27);
# 14 второй жезл переломлен; 15–17 негодный пастырь, меч на руку и правый глаз.
# Голоса: 1–3 плач пророка (без кавычек); 4–6 слово Господа в 「…», слова покупателей
# в 『…』; 7–12 рассказ пророка от первого лица (9 и 12 — его прямая речь в 「…»);
# 13 слово Господа в 「…»; 14 рассказ; 15–17 слово Господа в 「…».
# Термины: 羊飼[ひつじか]い — ποιμήν; 契約[けいやく] — διαθήκη; 炉[ろ] — χωνευτήριον
# (плавильня); 銀[ぎん]三十[さんじゅう]枚[まい] — τριάκοντα ἀργυροῦς.
#
tr_code: jp-box
book: zah
chapter: 11
draft: true

verses:
  1: "レバノンよ、あなたの門[もん]を開[ひら]け。火[ひ]があなたの杉[すぎ]を焼[や]き尽[つ]くすように。"
  2: "松[まつ]よ、泣[な]き叫[さけ]べ。杉[すぎ]が倒[たお]れたからである。高[たか]い位[くらい]の者[もの]たちも滅[ほろ]びたからである。バシャンの樫[かし]の木[き]よ、泣[な]き叫[さけ]べ。生[い]い茂[しげ]った森[もり]が切[き]り倒[たお]されたからである。"
  3: "羊飼[ひつじか]いたちの泣[な]き声[ごえ]が聞[き]こえる。彼らの豊[ゆた]かさが荒[あ]らされたからである。若[わか]い獅子[しし]のほえる声[こえ]が聞[こえる]。ヨルダンの茂[しげ]みが荒[あ]らされたからである。"
  4: "万軍[ばんぐん]の主[しゅ]はこう言[い]われる。「ほふられるために定[さだ]められた羊[ひつじ]を飼[か]え。"
  5: "これを買[か]い取[と]った者[もの]たちは悔[く]いることもなく殺[ころ]し、売[う]った者[もの]たちは『主[しゅ]はほめたたえられますように。わたしは富[とみ]を得[え]た』と言[い]い、その羊飼[ひつじか]いたちも彼らを憐[あわ]れまない。"
  6: "それゆえ、わたしはこの地[ち]に住[す]む者[もの]たちをもはや憐[あわ]れまない、と主[しゅ]は言[い]われる。見[み]よ、わたしは人[ひと]々[びと]を、それぞれ隣人[りんじん]の手[て]に、また王[おう]の手[て]に渡[わた]す。彼らはこの地[ち]を打[う]ち砕[くだ]き、わたしは彼らの手[て]から救[すく]い出[だ]さない。」"
  7: "わたしは、ほふられるために定[さだ]められた羊[ひつじ]たちを、カナンの地[ち]で飼[か]った。わたしは自分[じぶん]のために二[ふた]本[ほん]の杖[つえ]を取[と]り、一[ひと]つを「恵[めぐ]み」と名[な]づけ、もう一[ひと]つを「結[むす]び」と名[づ]け、それらで羊[ひつじ]を飼[か]った。"
  8: "わたしは一[ひと]月[つき]のうちに三[さん]人[にん]の羊飼[ひつじか]いを取[と]り除[のぞ]いた。わたしの魂[たましい]は彼らを嫌[きら]い、彼らの魂[たましい]もまたわたしを嫌[きら]った。"
  9: "わたしは言[い]った。「わたしはあなたがたを飼[か]わない。死[し]ぬ者[もの]は死[し]に、滅[ほろ]びる者[もの]は滅[ほろ]びよ。残[のこ]った者[もの]たちは互[たが]いに、隣人[りんじん]の肉[にく]を食[た]べ合[あ]え。」"
  10: "わたしはわたしの杖[つえ]、「恵[めぐ]み」を取[と]って折[お]り、すべての民[たみ]と結[むす]んだわたしの契約[けいやく]を破[やぶ]った。"
  11: "その日[ひ]、それは破[やぶ]られた。わたしのために守[まも]られている羊[ひつじ]、すなわちカナン人[じん]たちは、これが主[しゅ]の言葉[ことば]であることを知[し]った。"
  12: "わたしは彼らに言[い]った。「もしあなたがたの目[め]に良[よ]いことなら、わたしの報酬[ほうしゅう]をくれ。そうでなければ、やめよ。」そして彼らはわたしの報酬[ほうしゅう]として、銀[ぎん]三十[さんじゅう]枚[まい]を量[はか]った。"
  13: "主[しゅ]はわたしに言[い]われた。「彼らを炉[ろ]に投[な]げ入[い]れ、それが試[ため]されたものかどうか見[み]よ。わたしが彼らのために試[ため]されたように。」わたしは銀[ぎん]三十[さんじゅう]枚[まい]を取り、それを主[しゅ]の家[いえ]の炉[ろ]に投[な]げ入[い]れた。"
  14: "わたしは第二[だいに]の杖[つえ]、「結[むす]び」を折[お]り、ユダとイスラエルの間[あいだ]の契約[けいやく]を破[やぶ]った。"
  15: "主[しゅ]はわたしに言[い]われた。「もう一度[いちど]、愚[おろ]かな羊飼[ひつじか]いの道具[どうぐ]を取[と]れ。"
  16: "見[み]よ、わたしはこの地[ち]に羊飼[ひつじか]いを立[た]てる。彼は滅[ほろ]びる者[もの]を顧[かえり]みず、散[ち]らされた者[もの]を尋[たず]ねず、傷[きず]ついた者[もの]を癒[いや]さず、健[すこ]やかな者[もの]を導[みちび]かず、肥[こ]えた者[もの]の肉[にく]を食[た]べ、その足首[あしくび]を捻[ひね]る。」"
  17: "「空[むな]しいものを飼[か]い、羊[ひつじ]を捨[す]て去[さ]る羊飼[ひつじか]いよ、災[わざわ]いが彼の上[うえ]にある。剣[つるぎ]はその腕[うで]に、その右[みぎ]の目[め]に下[くだ]れ。その腕[うで]はすっかり枯[か]れ、その右[みぎ]の目[め]はすっかり暗[くら]くなる。」"

notes:
  1: "Διάνοιξον, ὁ Λίβανος, τὰς θύρας σου — «открой, Ливан, двери твои»; καταφαγέτω πῦρ τὰς κέδρους — «да пожрёт огонь кедры»."
  2: "ὀλολυξάτω πίτυς — «да возрыдает сосна (пихта)» (слав. «питис», 松; в ru «кипарис» — иное чтение); ὅτι μεγάλως μεγιστᾶνες ἐταλαιπώρησαν — «ибо вельможи тяжко пострадали»; δρύες τῆς Βασανίτιδος — «дубы Васанские»."
  3: "φωνὴ θρηνούντων ποιμένων — «голос рыдающих пастырей»; ἡ μεγαλωσύνη αὐτῶν — «величие их»; τὸ φρύαγμα τοῦ Ιορδάνου — «надменность (краса) Иордана»."
  4: "Ποιμαίνετε τὰ πρόβατα τῆς σφαγῆς — «пасите овец заклания»."
  5: "οἱ κτησάμενοι κατέσφαζον — «приобретшие закалали»; οὐ μετεμέλοντο — «не раскаивались»; Εὐλογητὸς κύριος — «благословен Господь»; πεπλουτήκαμεν — «обогатились»; οὐκ ἔπασχον οὐδέν — «ничего не терпели (не жалели)»."
  6: "οὐ φείσομαι — «не пощажу»; παραδίδωμι… εἰς χεῖρας — «предаю… в руки»; κατακόψουσιν — «изсекут»; οὐ μὴ ἐξέλωμαι — «не изъиму»."
  7: "εἰς τὴν Χαναανῖτιν — «в землю Ханаанскую» (слав.; в ru «овец поистине бедных» — МТ, не внесено); Κάλλος — «красота, благоволение» (恵み); Σχοίνισμα — «узы, вервь» (結び)."
  8: "ἐξαρῶ τοὺς τρεῖς ποιμένας — «изъиму трёх пастырей»; βαρυνθήσεται ἡ ψυχή μου — «отяготится душа Моя»; ἐπωρύοντο — «рыкали (гневались)»."
  9: "Οὐ ποιμανῶ ὑμᾶς — «не буду пасти вас»; τὸ ἀποθνῇσκον ἀποθνῃσκέτω — «умирающее пусть умирает»; τὰς σάρκας τοῦ πλησίον — «плоть ближнего»."
  10: "τὴν ῥάβδον… τὴν καλήν — «жезл… добрый (красоту)»; διασκεδάσαι τὴν διαθήκην — «разрушить завет»; διεθέμην — «завещал, заключил»."
  11: "διασκεδασθήσεται — «разрушится»; οἱ Χαναναῖοι τὰ πρόβατα τὰ φυλασσόμενα — тёмное: «хананеи, овцы хранимые» (カナン人である守られている羊); в ru «бедные из овец» — иное чтение."
  12: "δότε… τὸν μισθόν μου — «дайте плату Мою»; ἔστησαν τριάκοντα ἀργυροῦς — «отвесили тридцать сребреников»."
  13: "Κάθες αὐτοὺς εἰς τὸ χωνευτήριον — «брось их в плавильню (горнило)» (слав. «в горнило»; в ru «в церковное хранилище… для горшечника» — МТ, не внесено); цитата Мф 27:9–10 идёт по МТ («горшечник»), у нас чтение LXX/слав."
  14: "τὴν ῥάβδον τὴν δευτέραν, τὸ Σχοίνισμα — «жезл второй, Узы»; τὴν κατάσχεσιν — «владение, братство»."
  15: "σκεύη ποιμενικά — «сосуды (снаряд) пастырские»; ποιμένος ἀπείρου — «пастыря неискусного (глупого)»."
  16: "τὸ ἐκλιμπάνον οὐ μὴ ἐπισκέψηται — «погибающее не посетит»; τὸ συντετριμμένον οὐ μὴ ἰάσηται — «сокрушённое не исцелит»; ἀστραγάλους ἐκστρέψει — «лодыжки вывернет» (足首を捻る)."
  17: "ὦ οἱ ποιμαίνοντες τὰ μάταια — «о, пасущие пустое»; μάχαιρα ἐπὶ τοὺς βραχίονας — «меч на мышцы (руки)»; ἐκτυφλούμενος ἐκτυφλωθήσεται — «ослепляясь ослепнет» (усиление)."
