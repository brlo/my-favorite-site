verses:
  1: "二人[ふたり]の天使[てんし]は夕[ゆう]べ、ソドムに来[き]た。ロトはソドムの門[もん]のそばに座[すわ]っていた。ロトは彼[かれ]らを見[み]るや、立[た]って迎[むか]えに出[で]、顔[かお]を地[ち]につけて拝[おが]んだ。"
  2: "そして言[い]った。「ご主人[しゅじん]がた、どうか、しもべの家[いえ]にお立[た]ち寄[よ]りになって、お泊[と]まりください。足[あし]をお洗[あら]いになって、朝[あさ]早[はや]くお立[た]ちになり、道[みち]をお進[すす]みください。」彼[かれ]らは言[い]った。「いいえ、わたしたちは通[とお]りで野宿[のじゅく]します。」"
  3: "しかし彼[かれ]は強[し]いて彼[かれ]らを引[ひ]き止[と]めた。彼[かれ]らは彼[かれ]のところへ立[た]ち寄[よ]り、家[いえ]に入[はい]った。彼[かれ]は彼[かれ]らのために飲[の]み物[もの]を用意[ようい]し、種[たね]なしパンを焼[や]いた。彼[かれ]らは食[た]べた。"
  4: "彼[かれ]らが寝[ね]る前[まえ]に、町[まち]の男[おとこ]たち、ソドムの人々[ひとびと]が、若[わか]い者[もの]から年寄[としよ]りまで、民[たみ]のすべてが一[いっ]緒[しょ]になって、その家[いえ]を取[と]り囲[かこ]んだ。"
  5: "彼[かれ]らはロトを呼[よ]び出[だ]して言[い]った。「今夜[こんや]、おまえのところへ入[はい]った男[おとこ]たちはどこにいる。彼[かれ]らをわたしたちのところへ連[つ]れ出[だ]せ。わたしたちは彼[かれ]らと寝[ね]るのだ。」"
  6: "ロトは彼[かれ]らのところへ、入口[いりぐち]の戸口[とぐち]まで出[で]て行[い]き、自分[じぶん]の後[うし]ろの戸[と]を閉[し]めた。"
  7: "そして言[い]った。「兄弟[きょうだい]たちよ、どうか、悪[わる]いことをしないでください。"
  8: "わたしには、まだ男[おとこ]を知[し]らない娘[むすめ]が二人[ふたり]いる。彼女[かのじょ]らをあなたがたのところへ連[つ]れ出[だ]すから、あなたがたの好[この]むままにしてください。ただ、この男[おとこ]たちには、何[なに]一つ不正[ふせい]なことをしないでください。彼[かれ]らはわたしの屋根[やね]の下[した]に入[はい]ったのですから。」"
  9: "彼[かれ]らは言[い]った。「そこへ退[の]け。おまえは一人[ひとり]で来[き]て寄留[きりゅう]しているくせに、裁[さば]きまでしようというのか。今[いま]、わたしたちはあの者[もの]たちよりも、おまえをひどい目[め]にあわせてやる。」彼[かれ]らはロトという男[おとこ]を激[はげ]しく押[お]し迫[せま]り、戸[と]を打[ぶ]ち壊[こわ]そうとして近[ちか]づいた。"
  10: "しかし、あの男[おとこ]たちは手[て]を伸[の]ばしてロトを家[いえ]の中[なか]へ引[ひ]き入[い]れ、戸[と]を閉[し]めた。"
  11: "家[いえ]の戸口[とぐち]にいた男[おとこ]たちを、小[ちい]さい者[もの]から大[おお]きい者[もの]まで打[う]ち、目[め]を見[み]えなくさせた。彼[かれ]らは戸[と]を探[さが]し求[もと]めて、疲[つか]れ果[は]てた。"
  12: "あの男[おとこ]たちはロトに言[い]った。「ここに、あなたの者[もの]がほかにいるか。娘婿[むすめむこ]でも、息子[むすこ]でも、娘[むすめ]でも、町[まち]の中[なか]にあなたの者[もの]がほかにいるなら、この場所[ばしょ]から連[つ]れ出[だ]しなさい。"
  13: "わたしたちはこの場所[ばしょ]を滅[ほろ]ぼすからである。彼[かれ]らの叫[さけ]びが主[しゅ]の前[まえ]に届[とど]いて大[おお]きくなり、主[しゅ]がそれを滅[ほろ]ぼすために、わたしたちを遣[つか]わしたのだ。」"
  14: "ロトは出[で]て行[い]き、自分[じぶん]の娘[むすめ]たちを娶[めと]った娘婿[むすめむこ]たちに言[い]った。「立[た]って、この場所[ばしょ]から出[で]なさい。主[しゅ]がこの町[まち]を滅[ほろ]ぼされる。」しかし、娘婿[むすめむこ]たちには、彼[かれ]が冗談[じょうだん]を言[い]っているように思[おも]えた。"
  15: "夜[よ]が明[あ]けてくると、天使[てんし]たちはロトをせき立[た]てて言[い]った。「立[た]って、あなたの妻[つま]と、あなたのところにいる二人[ふたり]の娘[むすめ]を連[つ]れて出[で]なさい。この町[まち]の不法[ふほう]とともに滅[ほろ]びないためだ。」"
  16: "しかし、彼[かれ]らは心[こころ]を乱[みだ]した。そこで天使[てんし]たちは彼[かれ]の手[て]、妻[つま]の手[て]、二人[ふたり]の娘[むすめ]の手[て]を取[と]って引[ひ]き、彼[かれ]を外[そと]へ連[つ]れ出[だ]した。主[しゅ]が彼[かれ]をあわれまれたからである。"
  17: "彼[かれ]らを外[そと]へ連[つ]れ出[だ]したとき、彼[かれ]らは言[い]った。「命[いのち]がけで、自分[じぶん]の命[いのち]を救[すく]いなさい。後[うし]ろを振[ふ]り向[む]いてはいけない。このあたりのどこにも立[た]ち止[ど]まってはいけない。山[やま]へ逃[に]げなさい。あなたも滅[ほろ]ぼされないために。」"
  18: "ロトは彼[かれ]らに言[い]った。「主[しゅ]よ、お願[ねが]いです。"
  19: "しもべはあなたの前[まえ]に恵[めぐ]みを見[み]いだし、あなたはわたしの命[いのち]を生[い]かすために、わたしに対して大[おお]きな義[ぎ]を行[おこな]ってくださいました。しかし、わたしは山[やま]へは逃[に]げられません。災[わざわ]いがわたしを襲[おそ]って、死[し]んでしまうかもしれません。"
  20: "見[み]てください、あの町[まち]はわたしが逃[に]げ込[こ]むのに近[ちか]く、小[ちい]さいではありませんか。そこへ逃[に]げれば、わたしは助[たす]かります。あの町[まち]は小[ちい]さいではありませんか。そうすれば、わたしの命[いのち]は生[い]きます。」"
  21: "彼[かれ]は言[い]った。「見[み]よ、わたしはあなたの顔[かお]を立[た]てて、このことばをも聞[き]き入[い]れ、あなたが言[い]った町[まち]を滅[ほろ]ぼさないでおこう。"
  22: "だから、急[いそ]いでそこへ逃[に]げなさい。あなたがそこへ入[はい]るまでは、わたしは何[なに]もできないのだ。」それゆえ、その町[まち]の名[な]はツォアルと呼[よ]ばれた。"
  23: "日[ひ]が地[ち]の上[うえ]に昇[のぼ]ったとき、ロトはツォアルに入[はい]った。"
  24: "主[しゅ]はソドムとゴモラの上[うえ]に、主[しゅ]のもとから、天[てん]から、硫黄[いおう]と火[ひ]を降[ふ]らせた。"
  25: "こうして彼[かれ]はこれらの町[まち]と、その周辺[しゅうへん]のすべて、また町[まち]に住[す]むすべての者[もの]、地[ち]から生[は]え出[で]るすべてのものを滅[ほろ]ぼした。"
  26: "彼[かれ]の妻[つま]は後[うし]ろを振[ふ]り返[かえ]り、塩[しお]の柱[はしら]になった。"
  27: "アブラハムは朝[あさ]早[はや]く起[お]きて、自分[じぶん]が主[しゅ]の前[まえ]に立[た]っていた場所[ばしょ]へ行[い]った。"
  28: "彼[かれ]はソドムとゴモラの方[ほう]、また周辺[しゅうへん]の地[ち]の方[ほう]を見[み]た。すると、見[み]よ、地[ち]から炎[ほのお]が上[のぼ]り、かまどの煙[けむり]のようであった。"
  29: "こうして、主[しゅ]が周辺[しゅうへん]の町[まち]をすべて滅[ほろ]ぼされたとき、神[かみ]はアブラハムを思[おも]い起[お]こされた。そして、主[しゅ]がロトの住[す]んでいた町[まち]を滅[ほろ]ぼされたとき、その滅[ほろ]びの中[なか]からロトを送[おく]り出[だ]された。"
  30: "ロトはツォアルを出[で]て山[やま]に上[のぼ]り、住[す]んだ。二人[ふたり]の娘[むすめ]も彼[かれ]とともにいた。ツォアルに住[す]むのを恐[おそ]れたからである。彼[かれ]は洞窟[どうくつ]に住[す]み、二人[ふたり]の娘[むすめ]も彼[かれ]とともにいた。"
  31: "姉[あね]は妹[いもうと]に言[い]った。「わたしたちの父[ちち]は年[とし]を取[と]っている。そして、全[ぜん]地[ち]のならわしに従[したが]ってわたしたちのところへ入[はい]って来[く]る者[もの]は、地[ち]には誰[だれ]もいない。"
  32: "さあ、父[ちち]にぶどう酒[さけ]を飲[の]ませ、父[ちち]と寝[ね]て、父[ちち]から子孫[しそん]を起[お]こそう。」"
  33: "その夜[よる]、彼女[かのじょ]らは父[ちち]にぶどう酒[さけ]を飲[の]ませた。姉[あね]が入[はい]って行[い]き、その夜[よる]、父[ちち]と寝[ね]た。父[ちち]は、娘[むすめ]が寝[ね]たときも、起[お]きたときも、知[し]らなかった。"
  34: "翌日[よくじつ]、姉[あね]は妹[いもうと]に言[い]った。「見[み]よ、わたしは昨日[きのう]、父[ちち]と寝[ね]た。今夜[こんや]も父[ちち]にぶどう酒[さけ]を飲[の]ませなさい。そして、あなたが入[はい]って行[い]き、父[ちち]と寝[ね]なさい。そうして、父[ちち]から子孫[しそん]を起[お]こそう。」"
  35: "その夜[よる]も彼女[かのじょ]らは父[ちち]にぶどう酒[さけ]を飲[の]ませた。妹[いもうと]が入[はい]って行[い]き、父[ちち]と寝[ね]た。父[ちち]は、娘[むすめ]が寝[ね]たときも、起[お]きたときも、知[し]らなかった。"
  36: "こうして、ロトの二人[ふたり]の娘[むすめ]は、父[ちち]によって身[み]ごもった。"
  37: "姉[あね]は男[おとこ]の子[こ]を産[う]み、その名[な]をモアブと名[な]づけて言[い]った。「わたしの父[ちち]から。」彼[かれ]は今日[こんにち]までモアブ人[じん]の父[ちち]である。"
  38: "妹[いもうと]も男[おとこ]の子[こ]を産[う]み、その名[な]をアンモンと名[な]づけて言[い]った。「わたしの一族[いちぞく]の子[こ]。」彼[かれ]は今日[こんにち]までアンモン人[じん]の父[ちち]である。"

notes:
  1: "Ἦλθον δὲ οἱ δύο ἄγγελοι — 二人の天使が来た (ἄγγελος — «посланник»). ἑσπέρας — 夕べ (родительный времени). ἐκάθητο παρὰ τὴν πύλην — 門のそばに座っていた (πύλη — «ворота»). ἐξανέστη εἰς συνάντησιν — 立って迎えに出た. προσεκύνησεν τῷ προσώπῳ ἐπὶ τὴν γῆν — 顔を地につけて拝んだ."
  2: "κύριοι — ご主人がた (мн. ч.; Лот ещё не знает, кто они). ἐκκλίνατε εἰς τὸν οἶκον — 家にお立ち寄りになって. καταλύσατε — お泊まりください (καταλύω — «останавливаться»). νίψασθε τοὺς πόδας — 足をお洗いになって. ὀρθρίσαντες — 朝早く. Οὐχί, ἀλλ᾿ ἐν τῇ πλατείᾳ καταλύσομεν — いいえ、通りで野宿します (πλατεῖα — «улица, площадь»)."
  3: "κατεβιάζετο — 強いて引き止めた (καταβιάζομαι — «принуждать»). ἐποίησεν αὐτοῖς πότον — 飲み物を用意した (πότον — «питьё, пир»). ἀζύμους ἔπεψεν — 種なしパンを焼いた (ἄζυμος — «пресный»; πέσσω — «печь»). ἔφαγον — 食べた."
  4: "πρὸ τοῦ κοιμηθῆναι — 寝る前に. οἱ ἄνδρες τῆς πόλεως οἱ Σοδομῖται — 町の男たち、ソドム人. περιεκύκλωσαν τὴν οἰκίαν — 家を取り囲んだ. ἀπὸ νεανίσκου ἕως πρεσβυτέρου — 若い者から年寄りまで. ἅπας ὁ λαὸς ἅμα — 民のすべてが一緒に."
  5: "ἐξεκαλοῦντο — 呼び出した (ἐκκαλέομαι). Ποῦ εἰσιν οἱ ἄνδρες ... τὴν νύκτα; — 今夜入った男たちはどこにいる. ἐξάγαγε αὐτούς — 連れ出せ. ἵνα συγγενώμεθα αὐτοῖς — 彼らと寝るのだ (συγγίνομαι — «вступать в связь»; евр. ידע, «познать»; не смягчаем)."
  6: "πρὸς τὸ πρόθυρον — 入口の戸口まで (πρόθυρον — «преддверие»). τὴν θύραν προσέῳξεν ὀπίσω αὐτοῦ — 自分の後ろの戸を閉めた."
  7: "Μηδαμῶς, ἀδελφοί — 兄弟たちよ、どうか (μηδαμῶς — «никак»). μὴ πονηρεύσησθε — 悪いことをしないでください (πονηρεύομαι — «делать зло»)."
  8: "αἳ οὐκ ἔγνωσαν ἄνδρα — まだ男を知らない (ἔγνων — «познать», эвфемизм). χρήσασθε αὐταῖς — 好むままにしてください (χράομαι — «обращаться»). μηδὲν ἄδικον — 何一つ不正なこと. ὑπὸ τὴν σκέπην τῶν δοκῶν μου — わたしの屋根の下に (букв. «под кровлю балок моих»)."
  9: "Ἀπόστα ἐκεῖ — そこへ退け. εἷς ἦλθες παροικεῖν — 一人で来て寄留している. μὴ καὶ κρίσιν κρίνειν; — 裁きまでするのか (κρίσιν κρίνω — внутренний объект). παρεβιάζοντο — 激しく押し迫った (παραβιάζομαι — «теснить»). ἤγγισαν συντρῖψαι τὴν θύραν — 戸を打ち壊そうと近づいた."
  10: "ἐκτείναντες τὰς χεῖρας — 手を伸ばして. εἰσεσπάσαντο — 引き入れた (εἰσπάω). ἀπέκλεισαν — 閉めた."
  11: "ἐπάταξαν ἀορασίᾳ — 目を見えなくさせた (ἀορασία — «слепота»). ἀπὸ μικροῦ ἕως μεγάλου — 小さい者から大きい者まで. παρελύθησαν — 疲れ果てた (παραλύω — «ослабевать»). ζητοῦντες τὴν θύραν — 戸を探し求めて."
  12: "γαμβροὶ ἢ υἱοὶ ἢ θυγατέρες — 娘婿でも、息子でも、娘でも. ἐξάγαγε ἐκ τοῦ τόπου τούτου — この場所から連れ出しなさい."
  13: "ἀπόλλυμεν ἡμεῖς τὸν τόπον — わたしたちはこの場所を滅ぼす. ὑψώθη ἡ κραυγὴ αὐτῶν — 叫びが大きくなり (ὑψόω — «возвышать»). ἐκτρῖψαι αὐτήν — それを滅ぼす (ἐκτρίβω — «истреблять»; αὐτήν — город)."
  14: "τοὺς γαμβροὺς ... τοὺς εἰληφότας τὰς θυγατέρας — 娘たちを娶った娘婿たち. Ἀνάστητε καὶ ἐξέλθατε — 立って出なさい. ἐκτρίβει κύριος τὴν πόλιν — 主がこの町を滅ぼされる. ἔδοξεν γελοιάζειν — 冗談を言っているように思えた (γελοιάζω — «шутить»)."
  15: "ἡνίκα ὄρθρος ἐγίνετο — 夜が明けてくると (ὄρθρος — «рассвет»). ἐπεσπούδαζον — せき立てた. Ἀναστὰς λαβὲ τὴν γυναῖκά σου — 立って、妻を連れて. ἵνα μὴ συναπόλῃ ταῖς ἀνομίαις — 不法とともに滅びないため (συναπόλλυμαι — «погибать вместе»)."
  16: "ἐταράχθησαν — 心を乱した (ταράσσω — «приводить в смятение»; ср. «медлил» в Синодальном). ἐκράτησαν ... τῆς χειρός — 手を取って引いた. ἐν τῷ φείσασθαι κύριον αὐτοῦ — 主があわれまれたから (φείδομαι — «щадить»)."
  17: "Σῴζων σῷζε τὴν σεαυτοῦ ψυχήν — 命がけで自分の命を救いなさい (датив усиления). μὴ περιβλέψῃς εἰς τὰ ὀπίσω — 後ろを振り向いてはいけない. μηδὲ στῇς ἐν πάσῃ τῇ περιχώρῳ — このあたりのどこにも立ち止まってはいけない (περίχωρος — «окрестность»). εἰς τὸ ὄρος σῴζου — 山へ逃げなさい. μήποτε συμπαραλημφθῇς — あなたも滅ぼされないために."
  18: "Δέομαι, κύριε — 主よ、お願いです (δέομαι — «умолять»; ед. ч. κύριε, как в 18:3)."
  19: "εὗρεν ὁ παῖς σου ἔλεος — しもべは恵みを見いだし. ἐμεγάλυνας τὴν δικαιοσύνην σου — あなたの義を大きくされた (δικαιοσύνη — «правда, милость»). τοῦ ζῆν τὴν ψυχήν μου — わたしの命を生かすために. μὴ καταλάβῃ με τὰ κακά — 災いがわたしを襲わないように (καταλαμβάνω — «постигать»)."
  20: "ἡ πόλις αὕτη ἐγγὺς τοῦ καταφυγεῖν με — あの町は逃げ込むのに近い. ἥ ἐστιν μικρά — 小さい. οὐ μικρά ἐστιν; — 小さいではないか (повтор сохранён). ζήσεται ἡ ψυχή μου — わたしの命は生きる (σωθήσομαι — 助かる, о телесном спасении)."
  21: "Ἰδοὺ ἐθαύμασά σου τὸ πρόσωπον — 見よ、わたしはあなたの顔を立てた (букв. «подивился лицу твоему», т. е. уважил). ἐπὶ τῷ ῥήματι τούτῳ — このことばをも. τοῦ μὴ καταστρέψαι τὴν πόλιν — 町を滅ぼさないこと (καταστρέφω — «ниспровергать»)."
  22: "σπεῦσον ... τοῦ σωθῆναι — 急いで逃げなさい. οὐ δυνήσομαι ποιῆσαι πρᾶγμα — 何もできない. ἕως τοῦ σε εἰσελθεῖν ἐκεῖ — あなたがそこへ入るまでは. Σηγωρ — ツォアル (слав. Сигор; евр. צוֹעַר)."
  23: "ὁ ἥλιος ἐξῆλθεν ἐπὶ τὴν γῆν — 日が地の上に昇った. εἰσῆλθεν εἰς Σηγωρ — ツォアルに入った."
  24: "ἔβρεξεν ... θεῖον καὶ πῦρ — 硫黄と火を降らせた (βρέχω — «проливать дождём»; θεῖον — «сера»). παρὰ κυρίου ἐκ τοῦ οὐρανοῦ — 主のもとから、天から (повтор κύριος сохранён)."
  25: "κατέστρεψεν — 滅ぼした (καταστρέφω — «ниспровергать»). τὴν περίοικον — 周辺 (περίοικος — «окрестность»). τὰ ἀνατέλλοντα ἐκ τῆς γῆς — 地から生え出るもの (ἀνατέλλω — «произрастать»)."
  26: "ἐπέβλεψεν εἰς τὰ ὀπίσω — 後ろを振り返った. στὴλη ἁλός — 塩の柱 (στήλη — «столп»; ἅλς — «соль»)."
  27: "Ὤρθρισεν ... τὸ πρωΐ — 朝早く起きた. εἰς τὸν τόπον, οὗ εἱστήκει — 立っていた場所へ."
  28: "ἐπέβλεψεν ἐπὶ πρόσωπον — の方を見た (πρόσωπον — «лицо», здесь «сторона»). ἀνέβαινεν φλὸξ τῆς γῆς — 地から炎が上った. ὡσεὶ ἀτμὶς καμίνου — かまどの煙のように (ἀτμίς — «пар, дым»; κάμινος — «печь»)."
  29: "ἐν τῷ ἐκτρῖψαι κύριον — 主が滅ぼされたとき. ἐμνήσθη ὁ θεὸς τοῦ Αβρααμ — 神はアブラハムを思い起こされた (μιμνῄσκομαι). ἐξαπέστειλεν τὸν Λωτ ἐκ μέσου τῆς καταστροφῆς — 滅びの中からロトを送り出された (καταστροφή — «ниспровержение»)."
  30: "Ἀνέβη ... ἐκ Σηγωρ — ツォアルを出て. ἐκάθητο ἐν τῷ ὄρει — 山に住んだ. ἐφοβήθη γὰρ κατοικῆσαι — 住むのを恐れたから. ᾤκησεν ἐν τῷ σπηλαίῳ — 洞窟に住んだ (σπήλαιον — «пещера»)."
  31: "ἡ πρεσβυτέρα πρὸς τὴν νεωτέραν — 姉は妹に. οὐδείς ἐστιν ἐπὶ τῆς γῆς — 地には誰もいない. ὡς καθῆκει πάσῃ τῇ γῇ — 全地のならわしに従って (καθήκω — «подобать»)."
  32: "δεῦρο καὶ ποτίσωμεν — さあ、飲ませよう (ποτίζω — «поить»). κοιμηθῶμεν μετ᾿ αὐτοῦ — 父と寝て (κοιμάομαι — эвфемизм). ἐξαναστήσωμεν σπέρμα — 子孫を起こそう."
  33: "ἐπότισαν ... οἶνον — ぶどう酒を飲ませた. ἐκοιμήθη μετὰ τοῦ πατρός — 父と寝た. οὐκ ᾔδει ἐν τῷ κοιμηθῆναι αὐτὴν καὶ ἀναστῆναι — 娘が寝たときも起きたときも知らなかった."
  34: "ἐγένετο δὲ τῇ ἐπαύριον — 翌日 (ἐπαύριον — «на следующий день»). ἐκοιμήθην ἐχθές — 昨日寝た. ποτίσωμεν αὐτὸν οἶνον — ぶどう酒を飲ませなさい (переход к 1 л. мн. ч. в обращении)."
  35: "ἐπότισαν δὲ καὶ ἐν τῇ νυκτὶ ἐκείνῃ — その夜も飲ませた. ἡ νεωτέρα — 妹. οὐκ ᾔδει — 知らなかった (повтор 33-го стиха сохранён)."
  36: "συνέλαβον — 身ごもった (συλλαμβάνω). ἐκ τοῦ πατρὸς αὐτῶν — 父によって."
  37: "ἔτεκεν ... υἱόν — 男の子を産んだ. ἐκάλεσεν τὸ ὄνομα αὐτοῦ Μωαβ — 名をモアブと名づけた. Ἐκ τοῦ πατρός μου — わたしの父から (объяснение имени). πατὴρ Μωαβιτῶν ἕως τῆς σήμερον ἡμέρας — 今日までモアブ人の父."
  38: "Αμμαν — アンモン (греч. Ἀμμάν; евр. בֶּן־עַמִּי, «сын народа моего»). υἱὸς τοῦ γένους μου — わたしの一族の子. πατὴρ Αμμανιτῶν — アンモン人の父."
