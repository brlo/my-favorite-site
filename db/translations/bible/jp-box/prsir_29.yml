verses:
  1: "憐[あわ]れみを行[おこな]う者[もの]は隣人[りんじん]に貸[か]し、手[て]を強[つよ]くする者は戒[いまし]めを守[まも]る。"
  2: "隣人[りんじん]が必要[ひつよう]なとき、その隣人に貸[か]し、時[とき]が来[き]たら隣人に返[かえ]せ。"
  3: "言葉[ことば]を固[かた]く守[まも]って彼[かれ]と信[しん]実[じつ]であれ。そうすれば、いつでもあなたの必要[ひつよう]は満[み]たされる。"
  4: "多[おお]くの人[ひと]は借[かり]を思[おも]いがけない儲[もう]けと考[かんが]え、助[たす]けてくれた人に苦労[くろう]をかけた。"
  5: "受[う]け取[と]るまでは、相手[あいて]の手[て]に口[くち]づけし、隣人[りんじん]の金[かね]のことで声[こえ]を低[ひく]くする。しかし返[かえ]す時[とき]になると、時を引[ひ]き延[の]ばし、気[き]の進[すす]まない言葉[ことば]を返し、時のせいにする。"
  6: "力[ちから]があれば、やっと半分[はんぶん]を返[かえ]し、それを思[おも]いがけない儲[もう]けとみなす。もし力がなければ、相手の金[かね]を奪[うば]い、ただで彼[かれ]を敵[てき]にしてしまう。呪[のろ]いと罵[ののし]りを返し、栄光[えいこう]の代[か]わりに不名誉[ふめいよ]を与[あた]える。"
  7: "多[おお]くの人[ひと]は悪[わる]さのゆえではなく、ただで奪[うば]われることを恐[おそ]れて貸[か]すのをやめた。"
  8: "しかも、身分[みぶん]の低[ひく]い者[もの]には寛[かん]容[よう]にし、施[ほどこ]しを遅[おく]らせてはならない。"
  9: "戒[いまし]めのゆえに貧[まず]しい者[もの]を助[たす]け、その乏[とぼ]しさに応[おう]じて、彼を空[から]の手[て]で帰[かえ]してはならない。"
  10: "兄[きょう]弟[だい]や友[とも]のために銀[ぎん]を費[つい]やせ。それを石[いし]の下[した]に置[お]いて錆[さ]びさせ、滅[ほろ]びさせるな。"
  11: "あなたの宝[たから]をいと高[たか]き方[かた]の戒[いまし]めに従[したが]って置[お]け。そうすれば、金[きん]よりもあなたの益[えき]となる。"
  12: "施[ほどこ]しをあなたの倉[くら]に納[おさ]めよ。それはあらゆる災[わざわ]いからあなたを救[すく]い出[だ]す。"
  13: "それは強[つよ]い盾[たて]にも、重[おも]い槍[やり]にもまさって、敵[てき]に向[む]かってあなたのために戦[たたか]う。"
  14: "良[よ]い人[ひと]は隣人[りんじん]の保証人[ほしょうにん]になる。しかるに、恥[はじ]を失[うしな]った者[もの]は彼[かれ]を見捨[みす]てる。"
  15: "保証人[ほしょうにん]の恩[おん]を忘[わす]れてはならない。彼[かれ]はあなたのために自分[じぶん]の命[いのち]を与[あた]えたからである。"
  16: "罪[つみ]深[ぶか]い者[もの]は保証人[ほしょうにん]の善[ぜん]意[い]を覆[くつがえ]し、恩[おん]知[し]らずは心[こころ]のうちで自分を救[すく]った者を見捨てる。"
  17: "保証[ほしょう]は多[おお]くの正[ただ]しく歩[あゆ]む者[もの]を滅[ほろ]ぼし、海[うみ]の波[なみ]のように彼らを揺[ゆ]り動[うご]かした。"
  18: "それは力[ちから]ある人[ひと]たちを住[す]み慣[な]れた地[ち]から移[うつ]し、彼らは異[い]国[こく]の民[たみ]の間[あいだ]をさまよった。"
  19: "罪[つみ]深[ぶか]い者[もの]は保証[ほしょう]に陥[おちい]り、利[り]を求[もと]めて争[あらそ]いに巻[ま]き込[こ]まれる。"
  20: "隣人[りんじん]を力[ちから]の及[およ]ぶかぎり助[たす]け、自分[じぶん]が陥[おちい]らないように気[き]をつけよ。"
  21: "命[いのち]の始[はじ]めは水[みず]とパンと衣[ころも]、そして恥[はじ]を覆[おお]う家[いえ]である。"
  22: "貧[まず]しい者[もの]が板[いた]の屋根[やね]の下[した]で暮[く]らすほうが、他人[たにん]の家[いえ]で豪[ごう]華[か]な食[しょく]事[じ]をするより良[よ]い。"
  23: "少[すこ]しのことも多[おお]きことも喜[よろこ]んで受[う]け入[い]れよ。そうすれば、寄留[きりゅう]の辱[はずかし]めを聞[き]くことはない。"
  24: "悪[わる]い暮[く]らしは家[いえ]から家へと移[うつ]ることである。寄留[きりゅう]する先[さき]では、口[くち]を開[ひら]くこともできない。"
  25: "もてなし、飲[の]み物[もの]を与[あた]えても、感謝[かんしゃ]はなく、その上[うえ]に苦[にが]い言葉[ことば]を聞[き]くことになる。"
  26: "「さあ、寄留[きりゅう]の者[もの]よ、こちらへ来[き]て食卓[しょくたく]を整[ととの]えよ。手[て]に何[なに]かあれば、わたしに食[く]わせよ。」"
  27: "「去[さ]れ、寄留[きりゅう]の者よ、誇[ほこ]らしい顔[かお]の前[まえ]から。兄[きょう]弟[だい]がわたしに客[きゃく]として来[き]た。家[いえ]が要[い]るのだ。」"
  28: "これらは悟[さと]りのある人[ひと]にとって重[おも]い。すなわち、家[いえ]での叱責[しっせき]と貸[か]し主[ぬし]の嘲[あざけ]りである。"

notes:
  1: "Ὁ ποιῶν ἔλεος δανιεῖ τῷ πλησίον — 憐れみを行う者は隣人に貸す (ἔλεος — милость; δανείζω — давать взаймы; слав. «взаим даст»). ὁ ἐπισχύων τῇ χειρὶ αὐτοῦ τηρεῖ ἐντολάς — 手を強くする者は戒めを守る (ἐπισχύω — укреплять, поддерживать)."
  2: "δάνεισον τῷ πλησίον ἐν καιρῷ χρείας αὐτοῦ — 隣人が必要なとき貸せ (χρεία — нужда). πάλιν ἀπόδος τῷ πλησίον εἰς τὸν καιρόν — 時が来たら隣人に返せ (ἀποδίδωμι — возвращать)."
  3: "στερέωσον λόγον καὶ πιστώθητι μετ᾿ αὐτοῦ — 言葉を固く守って彼と信実であれ (στερεόω — утверждать; πιστόω — быть верным). ἐν παντὶ καιρῷ εὑρήσεις τὴν χρείαν σου — いつでもあなたの必要は満たされる (χρεία — потребность)."
  4: "πολλοὶ ὡς εὕρεμα ἐνόμισαν δάνος — 多くの人は借りを思いがけない儲けと考え (εὕρεμα — находка; δάνος — заём; слав. «яко обретение»). παρέσχον κόπον τοῖς βοηθήσασιν αὐτοῖς — 助けてくれた人に苦労をかけた (κόπος — труд, тягота)."
  5: "ἕως οὗ λάβῃ, καταφιλήσει χεῖρας αὐτοῦ — 受け取るまでは相手の手に口づけし (καταφιλέω — целовать; слав. «облобызает руце его»). ἐπὶ τῶν χρημάτων τοῦ πλησίον ταπεινώσει φωνήν — 隣人の金のことで声を低くする (χρῆμα — деньги, имущество). ἐν καιρῷ ἀποδόσεως παρελκύσει χρόνον — 返す時になると時を引き延ばす (παρελκύω — затягивать). ἀποδώσει λόγους ἀκηδίας — 気の進まない言葉を返す (ἀκηδία — уныние, нерадение). τὸν καιρὸν αἰτιάσεται — 時のせいにする (αἰτιάομαι — обвинять)."
  6: "ἐὰν ἰσχύσῃ, μόλις κομίσεται τὸ ἥμισυ — 力があればやっと半分を返す (μόλις — едва; κομίζω — получать, приносить). λογιεῖται αὐτὸ ὡς εὕρεμα — それを思いがけない儲けとみなす. εἰ δὲ μή, ἀπεστέρησεν αὐτὸν τῶν χρημάτων αὐτοῦ — もし力がなければ相手の金を奪う (ἀποστερέω — лишать). ἐκτήσατο αὐτὸν ἐχθρὸν δωρεάν — ただで彼を敵にする (κτάομαι — приобретать; δωρεάν — даром). κατάρας καὶ λοιδορίας ἀποδώσει αὐτῷ — 呪いと罵りを返す (κατάρα — проклятие; λοιδορία — брань). ἀντὶ δόξης ἀποδώσει αὐτῷ ἀτιμίαν — 栄光の代わりに不名誉を与える."
  7: "πολλοὶ οὐ χάριν πονηρίας ἀπέστρεψαν — 多くの人は悪さのゆえではなく貸すのをやめた (ἀποστρέφω — отвращаться; слав. «за лукавство отвергошася»). ἀποστερηθῆναι δωρεὰν εὐλαβήθησαν — ただで奪われることを恐れた (εὐλαβέομαι — страшиться)."
  8: "Πλὴν ἐπὶ ταπεινῷ μακροθύμησον — しかも身分の低い者には寛容にせよ (ταπεινός — униженный, бедный; μακροθυμέω — долготерпеть). ἐπ᾿ ἐλεημοσύνῃ μὴ παρελκύσῃς αὐτόν — 施しを遅らせてはならない (ἐλεημοσύνη — милостыня; παρελκύω — затягивать)."
  9: "χάριν ἐντολῆς ἀντιλαβοῦ πένητος — 戒めのゆえに貧しい者を助けよ (ἀντιλαμβάνομαι — поддерживать; πένης — бедняк). κατὰ τὴν ἔνδειαν αὐτοῦ μὴ ἀποστρέψῃς αὐτὸν κενόν — 乏しさに応じて空の手で帰すな (ἔνδεια — недостаток; κενός — пустой)."
  10: "ἀπόλεσον ἀργύριον δι᾿ ἀδελφὸν καὶ φίλον — 兄弟や友のために銀を費やせ (ἀπόλλυμι — тратить, терять; ἀδελφός — брат). μὴ ἰωθήτω ὑπὸ τὸν λίθον εἰς ἀπώλειαν — 石の下で錆びさせて滅ぼすな (ἰόω — ржаветь; ἀπώλεια — погибель; слав. «да не оржавеет под каменем во пагубу»)."
  11: "θὲς τὸν θησαυρόν σου κατ᾿ ἐντολὰς ὑψίστου — 宝をいと高き方の戒めに従って置け (θησαυρός — сокровище). λυσιτελήσει σοι μᾶλλον ἢ τὸ χρυσίον — 金よりもあなたの益となる (λυσιτελέω — приносить пользу)."
  12: "σύγκλεισον ἐλεημοσύνην ἐν τοῖς ταμιείοις σου — 施しを倉に納めよ (συγκλείω — заключать; ταμεῖον — хранилище, кладовая). αὕτη ἐξελεῖταί σε ἐκ πάσης κακώσεως — あらゆる災いから救い出す (ἐξαιρέω — избавлять; κάκωσις — бедствие)."
  13: "ὑπὲρ ἀσπίδα κράτους — 強い盾にもまさって (ἀσπίς — щит; κράτος — сила, крепость). ὑπὲρ δόρυ ὁλκῆς — 重い槍にもまさって (δόρυ — копьё; ὁλκή — вес, тяга). κατέναντι ἐχθροῦ πολεμήσει ὑπὲρ σοῦ — 敵に向かってあなたのために戦う (πολεμέω — воевать)."
  14: "Ἀνὴρ ἀγαθὸς ἐγγυήσεται τὸν πλησίον — 良い人は隣人の保証人になる (ἐγγυάομαι — ручаться; ἐγγύη — поручительство). ὁ ἀπολωλεκὼς αἰσχύνην ἐγκαταλείψει αὐτόν — 恥を失った者は彼を見捨てる (ἀπόλλυμι — терять; ἐγκαταλείπω — оставлять)."
  15: "χάριτας ἐγγύου μὴ ἐπιλάθῃ — 保証人の恩を忘れるな (χάρις — благодеяние; ἐπιλανθάνομαι — забывать). ἔδωκεν γὰρ τὴν ψυχὴν αὐτοῦ ὑπὲρ σοῦ — 彼はあなたのために命を与えた (ψυχή — душа, жизнь)."
  16: "ἀγαθὰ ἐγγύου ἀνατρέψει ἁμαρτωλός — 罪深い者は保証人の善意を覆す (ἀνατρέπω — ниспровергать). ἀχάριστος ἐν διανοίᾳ ἐγκαταλείψει ῥυσάμενον — 恩知らずは心のうちで救った者を見捨てる (ἀχάριστος — неблагодарный; διάνοια — мысль, намерение; ῥύομαι — избавлять)."
  17: "ἐγγύη πολλοὺς ἀπώλεσεν κατευθύνοντας — 保証は多くの正しく歩む者を滅ぼした (κατευθύνω — направлять прямо; слав. «благоуправляющих»). ἐσάλευσεν αὐτοὺς ὡς κῦμα θαλάσσης — 海の波のように彼らを揺り動かした (κῦμα — волна)."
  18: "ἄνδρας δυνατοὺς ἀπῴκισεν — 力ある人たちを移した (ἀποικίζω — выселять; δυνατός — сильный). ἐπλανήθησαν ἐν ἔθνεσιν ἀλλοτρίοις — 異国の民の間をさまよった (πλανάομαι — блуждать; ἀλλότριος — чужой)."
  19: "ἁμαρτωλὸς ἐμπεσὼν εἰς ἐγγύην — 罪深い者は保証に陥り (ἐμπίπτω — впадать). διώκων ἐργολαβίας ἐμπεσεῖται εἰς κρίσεις — 利を求めて争いに巻き込まれる (ἐργολαβία — корысть, нажива; κρίσις — суд, тяжба)."
  20: "ἀντιλαβοῦ τοῦ πλησίον κατὰ δύναμίν σου — 隣人を力の及ぶかぎり助けよ. πρόσεχε σεαυτῷ μὴ ἐμπέσῃς — 自分が陥らないように気をつけよ (προσέχω — внимать, беречься)."
  21: "Ἀρχὴ ζωῆς ὕδωρ καὶ ἄρτος καὶ ἱμάτιον — 命の始めは水とパンと衣 (ἀρχή — начало; ἱμάτιον — одежда; слав. «начало жития»). οἶκος καλύπτων ἀσχημοσύνην — 恥を覆う家 (καλύπτω — покрывать; ἀσχημοσύνη — нагота, срам)."
  22: "κρείσσων βίος πτωχοῦ ὑπὸ σκέπην δοκῶν — 貧しい者が板の屋根の下で暮らすほうが良い (σκέπη — кров; δοκός — бревно, балка; слав. «под кровом бервенным»). ἢ ἐδέσματα λαμπρὰ ἐν ἀλλοτρίοις — 他人の家で豪華な食事をするより (ἔδεσμα — яства; λαμπρός — блестящий, роскошный)."
  23: "ἐπὶ μικρῷ καὶ μεγάλῳ εὐδοκίαν ἔχε — 少しのことも大きなことも喜んで受け入れよ (εὐδοκία — благоволение, довольство). ὀνειδισμὸν παροικίας οὐ μὴ ἀκούσῃς — 寄留の辱めを聞くことはない (ὀνειδισμός — поношение; παροικία — странничество)."
  24: "ζωὴ πονηρὰ ἐξ οἰκίας εἰς οἰκίαν — 悪い暮らしは家から家へ移ること (πονηρός — злой, тяжкий). οὗ παροικήσεις, οὐκ ἀνοίξεις στόμα — 寄留する先では口を開くこともできない (παροικέω — жить на чужбине)."
  25: "ξενιεῖς καὶ ποτιεῖς εἰς ἀχάριστα — もてなし、飲み物を与えても感謝はない (ξενίζω — принимать гостя; ποτίζω — поить; ἀχάριστος — неблагодарный). πρὸς ἐπὶ τούτοις πικρὰ ἀκούσῃ — その上に苦い言葉を聞く (πρός — сверх того; πικρός — горький)."
  26: "Πάρελθε, πάροικε, κόσμησον τράπεζαν — さあ、寄留の者よ、こちらへ来て食卓を整えよ (πάρειμι, императив — приди; κοσμέω — убирать, украшать; τράπεζα — стол; слав. «приступи, пришелче, украси трапезу»). εἴ τι ἐν τῇ χειρί σου, ψώμισόν με — 手に何かあれば、わたしに食わせよ (ψωμίζω — кормить кусками). Слова хозяина — 「」."
  27: "ἔξελθε, πάροικε, ἀπὸ προσώπου δόξης — 去れ、寄留の者よ、誇らしい顔の前から (ἀπὸ προσώπου δόξης — «от лица славы», т. е. ради почётного лица; слав. «от лица славы»). ἐπεξένωταί μοι ὁ ἀδελφός — 兄弟がわたしに客として来た (ἐπεξενόομαι — приходить гостем). χρεία τῆς οἰκίας — 家が要る (χρεία — нужда). Слова хозяина — 「」."
  28: "βαρέα ταῦτα ἀνθρώπῳ ἔχοντι φρόνησιν — これらは悟りのある人にとって重い (βαρύς — тяжкий; φρόνησις — разумение). ἐπιτίμησις οἰκίας — 家での叱責 (ἐπιτίμησις — укор, наказание). ὀνειδισμὸς δανειστοῦ — 貸し主の嘲り (δανειστής — заимодавец; ὀνειδισμός — поношение)."
