verses:
  1: "シモンは、トリュフォンがユダヤの地[ち]へ来[き]て、それを滅[ほろ]ぼそうと大[おお]きな軍勢[ぐんぜい]を集[あつ]めたと聞[き]いた。"
  2: "彼[かれ]は民[たみ]がおののき、恐[おそ]れているのを見[み]て、エルサレムへ上[のぼ]り、民[たみ]を集[あつ]めた。"
  3: "彼[かれ]は彼[かれ]らを励[はげ]まして言[い]った。「あなたがたは、わたしとわたしの兄弟[きょうだい]たち、わたしの父[ちち]の家[いえ]が、律法[りっぽう]と聖所[せいしょ]のためにどれほどのことを行[おこな]ったか、またわれわれが見[み]た戦[たたか]いと苦[くる]しみを、自分[じぶん]で知[し]っている。"
  4: "このために、わたしの兄弟[きょうだい]たちは皆[みな]、イスラエルのために滅[ほろ]び、わたしだけが残[のこ]った。"
  5: "今[いま]、苦難[くなん]のどのような時[とき]にも、わたしが自分[じぶん]の命[いのち]を惜[お]しむようなことは、決[けっ]してあってはならない。わたしは兄弟[きょうだい]たちにまさる者[もの]ではないからである。"
  6: "しかし、わたしは自分[じぶん]の民族[みんぞく]のため、聖所[せいしょ]のため、あなたがたの妻[つま]と子[こ]らのために復讐[ふくしゅう]する。すべての民族[みんぞく]が、憎[にく]しみのゆえにわれわれを滅[ほろ]ぼそうと集[あつ]まったからである。」"
  7: "民[たみ]の霊[れい]は、これらの言葉[ことば]を聞[き]くとともに燃[も]え上[あ]がった。"
  8: "彼[かれ]らは大[おお]きな声[こえ]で答[こた]えて言[い]った。「あなたは、兄弟[きょうだい]ユダとヨナタンの代[か]わりに、われわれの指導者[しどうしゃ]である。"
  9: "われわれの戦[たたか]いを戦[たたか]ってください。あなたがわれわれに言[い]うことは何[なに]でも、われわれは行[おこな]う。」"
  10: "シモンは戦[たたか]う者[もの]たちをすべて集[あつ]め、エルサレムの城壁[じょうへき]を完成[かんせい]させようと急[いそ]ぎ、周[まわ]りを堅固[けんご]にした。"
  11: "彼[かれ]はアブサロムの子[こ]ヨナタンと十分[じゅうぶん]な軍勢[ぐんぜい]をヤッファへ送[おく]り、そこにいた者[もの]たちを追[お]い出[だ]し、自分[じぶん]はそこにとどまった。"
  12: "トリュフォンはプトレマイスから大[おお]きな軍勢[ぐんぜい]とともにユダヤの地[ち]へ来[く]るために発[た]ち、ヨナタンは彼[かれ]とともに監禁[かんきん]されていた。"
  13: "シモンは平地[へいち]に面[めん]してアディダに陣[じん]を敷[し]いた。"
  14: "トリュフォンは、シモンが兄弟[きょうだい]ヨナタンの代[か]わりに立[た]ち、彼[かれ]と戦[たたか]いを交[ま]えようとしているのを知[し]り、彼[かれ]に使者[ししゃ]を送[おく]って言[い]った。"
  15: "「あなたの兄弟[きょうだい]ヨナタンが、自分[じぶん]の必要[ひつよう]のために王[おう]に負[お]っている銀[ぎん]のゆえに、われわれは彼[かれ]を拘束[こうそく]している。"
  16: "今[いま]、銀[ぎん]百[ひゃく]タラントと、彼[かれ]の息子[むすこ]たちのうち二人[ふたり]を人質[ひとじち]として送[おく]れ。彼[かれ]が解放[かいほう]されてわれわれから離反[りはん]しないためである。そうすれば、われわれは彼[かれ]を解放[かいほう]する。」"
  17: "シモンは、彼[かれ]らが自分[じぶん]に欺[あざむ]いて語[かた]っているのを知[し]ったが、民[たみ]に対[たい]して大[おお]きな恨[うら]みが生[しょう]じないように、銀[ぎん]と子[こ]どもたちを送[おく]った。"
  18: "人[ひと]々[びと]が「彼[かれ]に銀[ぎん]も子[こ]どもたちも送[おく]らなかったので、あの人[ひと]は死[し]んだのだ」と言[い]うことのないようにするためであった。"
  19: "彼[かれ]は子[こ]どもたちと百[ひゃく]タラントを送[おく]った。しかしトリュフォンは偽[いつわ]って、ヨナタンを解放[かいほう]しなかった。"
  20: "これらの後[あと]、トリュフォンはその地方[ちほう]に入[はい]ってそれを滅[ほろ]ぼそうと来[き]て、アドラへの道[みち]を回[まわ]り込[こ]んだ。シモンとその陣営[じんえい]は、彼[かれ]が行[い]く先々[さきざき]で彼[かれ]に向[む]かって進[すす]んだ。"
  21: "アクラの者[もの]たちは、荒野[こうや]を通[とお]って自分[じぶん]たちのところへ来[く]るよう、また食糧[しょくりょう]を送[おく]るようトリュフォンを促[うなが]す使者[ししゃ]を彼[かれ]に送[おく]った。"
  22: "トリュフォンは自分[じぶん]の騎兵[きへい]すべてをその夜[よる]のうちに行[い]かせようと準備[じゅんび]したが、非常[ひじょう]に大[おお]きな雪[ゆき]が降[ふ]ったので、雪[ゆき]のゆえに来[こ]なかった。彼[かれ]は発[た]ってガラアディティスへ行[い]った。"
  23: "彼[かれ]がバスカマに近[ちか]づくと、ヨナタンを殺[ころ]し、彼[かれ]はそこに葬[ほうむ]られた。"
  24: "トリュフォンは戻[もど]って自分[じぶん]の地[ち]へ去[さ]った。"
  25: "シモンは人[ひと]を送[おく]って兄弟[きょうだい]ヨナタンの骨[ほね]を取[と]り、父[ちち]たちの町[まち]モディンに葬[ほうむ]った。"
  26: "イスラエルは皆[みな]、彼[かれ]を大[おお]きな嘆[なげ]きをもって悼[いた]み、多[おお]くの日[ひ]彼[かれ]のために悲[かな]しんだ。"
  27: "シモンは自分[じぶん]の父[ちち]と兄弟[きょうだい]たちの墓[はか]の上[うえ]に建物[たてもの]を建[た]て、前後[ぜんご]を切[き]り石[いし]で高[たか]く、見栄[みば]えよく築[きず]いた。"
  28: "彼[かれ]はその上[うえ]に七[なな]つのピラミッドを、一[ひと]つを一[ひと]つに向[む]かい合[あ]わせて、父[ちち]と母[はは]と四人[よにん]の兄弟[きょうだい]のために立[た]てた。"
  29: "彼[かれ]はそれらに飾[かざ]りを施[ほどこ]し、周[まわ]りに大[おお]きな柱[はしら]を巡[めぐ]らせ、柱[はしら]の上[うえ]に永遠[えいえん]の記念[きねん]として全身[ぜんしん]甲冑[かっちゅう]を置[お]き、甲冑[かっちゅう]のそばに、海[うみ]を渡[わた]るすべての者[もの]に見[み]えるよう、船[ふね]を刻[きざ]みつけた。"
  30: "モディンに建[た]てたこの墓[はか]は、今日[きょう]まで残[のこ]っている。"
  31: "トリュフォンは幼[おさな]い王[おう]アンティオコスとともに欺[あざむ]きをもって進[すす]み、彼[かれ]を殺[ころ]した。"
  32: "彼[かれ]は彼[かれ]の代[か]わりに王[おう]となり、アジアの冠[かんむり]を置[お]き、地[ち]に大[おお]きな災[わざわ]いをもたらした。"
  33: "シモンはユダヤの要塞[ようさい]を建[た]て、高[たか]い塔[とう]と大[おお]きな城壁[じょうへき]、門[もん]と貫[つらぬ]き棒[ぼう]で囲[かこ]み、要塞[ようさい]に食糧[しょくりょう]を置[お]いた。"
  34: "シモンは幾人[いくにん]かの者[もの]を選[えら]び、デメトリオス王[おう]に送[おく]って、国[くに]に免除[めんじょ]を与[あた]えるよう求[もと]めた。トリュフォンのすべての行[おこな]いは略奪[りゃくだつ]であったからである。"
  35: "デメトリオス王[おう]はこれらの言葉[ことば]とともに彼[かれ]に送[おく]り、彼[かれ]に答[こた]えて、次[つぎ]のような手紙[てがみ]を書[か]いた。"
  36: "「王[おう]デメトリオス、大祭司[だいさいし]シモン、王[おう]たちの友[とも]、および長老[ちょうろう]たちとユダヤ人[じん]の民族[みんぞく]に挨拶[あいさつ]を送[おく]る。"
  37: "あなたがたが送[おく]った金[きん]の冠[かんむり]と棕櫚[しゅろ]の枝[えだ]を受[う]け取[と]った。われわれはあなたがたと大[おお]きな和[わ]を結[むす]び、あなたがたに免除[めんじょ]を許[ゆる]すよう務[つと]めにある者[もの]たちに書[か]く用意[ようい]がある。"
  38: "われわれがあなたがたに対[たい]して定[さだ]めたことはすべて固[かた]く立[た]ち、あなたがたが建[た]てた要塞[ようさい]はあなたがたのものとする。"
  39: "われわれは今日[きょう]まで知[し]らずに行[おこな]ったことと罪[つみ]を許[ゆる]す。また、あなたがたが負[お]うていた冠[かんむり]の税[ぜい]も、エルサレムで他[ほか]に取[と]り立[た]てられていたものがあれば、もはや取[と]り立[た]てない。"
  40: "また、あなたがたのうちでわれわれの側[がわ]に加[くわ]わるのにふさわしい者[もの]があれば、登録[とうろく]させよ。われわれの間[あいだ]に和[わ]があるように。」"
  41: "百七十年[ひゃくななじゅうねん]に、諸民族[しょみんぞく]のくびきがイスラエルから取[と]り去[さ]られた。"
  42: "民[たみ]は書[か]き物[もの]や契約[けいやく]に、「シモンが大祭司[だいさいし]、将軍[しょうぐん]、ユダヤ人[じん]の指導者[しどうしゃ]となった最初[さいしょ]の年[とし]」と書[か]き始[はじ]めた。"
  43: "その日々[ひび]にシモンはガザに陣[じん]を敷[し]き、陣営[じんえい]でこれを包囲[ほうい]し、攻城塔[こうじょうとう]を造[つく]って町[まち]に近[ちか]づけ、一[ひと]つの塔[とう]を打[う]ち、これを取[と]った。"
  44: "攻城塔[こうじょうとう]にいた者[もの]たちは町[まち]へ躍[おど]り込[こ]み、町[まち]の中[なか]に大[おお]きな動揺[どうよう]が生[しょう]じた。"
  45: "町[まち]の者[もの]たちは妻[つま]や子[こ]らとともに城壁[じょうへき]に上[のぼ]り、衣[ころも]を裂[さ]いて、大[おお]きな声[こえ]で叫[さけ]び、シモンに和[わ]を許[ゆる]すよう求[もと]めた。"
  46: "彼[かれ]らは言[い]った。「われわれに、われわれの悪[あく]に従[したが]ってではなく、あなたのあわれみに従[したが]って行[おこな]ってください。」"
  47: "シモンは彼[かれ]らをあわれみ、彼[かれ]らと戦[たたか]わなかった。彼[かれ]は彼[かれ]らを町[まち]から追[お]い出[だ]し、偶像[ぐうぞう]のあった家々[いえいえ]を清[きよ]め、こうして賛美[さんび]と祝福[しゅくふく]のうちにそこへ入[はい]った。"
  48: "彼[かれ]はそこからすべての汚[けが]れを除[のぞ]き、律法[りっぽう]を行[おこな]う者[もの]たちをそこに住[す]まわせ、これを堅固[けんご]にし、自分[じぶん]のためにそこに住[す]まいを造[つく]った。"
  49: "エルサレムのアクラの者[もの]たちは、外[そと]へ出[で]てその地方[ちほう]に入[はい]ること、買[か]うこと、売[う]ることを禁[きん]じられ、非常[ひじょう]に飢[う]え、そのうち多[おお]くの者[もの]が飢[う]えで滅[ほろ]びた。"
  50: "彼[かれ]らはシモンに和[わ]を求[もと]めて叫[さけ]び、彼[かれ]はそれを許[ゆる]した。彼[かれ]は彼[かれ]らをそこから追[お]い出[だ]し、アクラを汚[けが]れから清[きよ]めた。"
  51: "彼[かれ]らは百七十一年[ひゃくななじゅういちねん]の第二[だいに]の月[つき]の二十三日[にじゅうさんにち]に、賛美[さんび]と棕櫚[しゅろ]の枝[えだ]、琴[こと]とシンバルと竪琴[たてごと]、賛歌[さんか]と歌[うた]をもってそこへ入[はい]った。イスラエルから大[おお]きな敵[てき]が砕[くだ]かれたからである。"
  52: "彼[かれ]は毎年[まいとし]この日[ひ]を喜[よろこ]びをもって祝[いわ]うことを定[さだ]め、アクラのそばの神殿[しんでん]の山[やま]を堅固[けんご]にし、自分[じぶん]とその者[もの]たちはそこに住[す]んだ。"
  53: "シモンは自分[じぶん]の子[こ]ヨハネが一人前[いちにんまえ]の男[おとこ]であるのを見[み]て、すべての軍勢[ぐんぜい]の長[ちょう]とした。彼[かれ]はガザラに住[す]んだ。"

notes:
  3: "ὅσα ἐγὼ καὶ οἱ ἀδελφοί μου καὶ ὁ οἶκος τοῦ πατρός μου ἐποιήσαμεν περὶ τῶν νόμων — «что сделали я, братья мои и дом отца моего ради законов»; στενοχωρίαι — «тесноты, притеснения» (слав. «тесноты»)."
  4: "τούτου χάριν — «ради этого»; κατελείφθην ἐγὼ μόνος — «оставлен я один»."
  5: "μὴ γένοιτό μοι φείσασθαι τῆς ψυχῆς μου — «да не будет мне пощадить души моей»; οὐ γάρ εἰμι κρείσσων — «ибо я не лучше»."
  6: "ἐκδικήσω περὶ τοῦ ἔθνους — «отмщу за народ»; ἔχθρας χάριν — «ради вражды»."
  7: "ἀνεζωπύρησεν τὸ πνεῦμα τοῦ λαοῦ — «возгорелся (ожил) дух народа» (слав. «возгорешася духом людие»)."
  10: "τοὺς ἄνδρας τοὺς πολεμιστάς — «мужей ратных»; ἐτάχυνεν τοῦ τελέσαι — «поспешил окончить»."
  11: "Ἰωναθαν τὸν τοῦ Αψαλωμου — ヨナタン, сын Авессалома (не Ионатан Маккавей); δύναμιν ἱκανήν — «силу достаточную»."
  12: "ἐν φυλακῇ — «под стражею»."
  15: "εἰς τὸ βασιλικὸν — «в царскую (казну)»; δι᾽ ἃς εἶχεν χρείας — «по нуждам, какие имел»."
  16: "ἀργυρίου τάλαντα ἑκατὸν καὶ δύο — «сто талантов серебра и двух (сыновей)»; ὅπως μὴ ἀφεθεὶς ἀποστατήσῃ — «чтобы, отпущенный, не отложился»."
  17: "δόλῳ λαλοῦσιν — «с хитростью говорят»; μήποτε ἔχθραν ἄρῃ μεγάλην — «как бы не навлечь большой вражды»."
  18: "λέγοντες ὅτι οὐκ ἀπέστειλα αὐτῷ τὸ ἀργύριον — «говоря: не послал я ему серебра»; слав. «глаголющих: яко не посла ему сребра» — клауза «глаголющих» у слав. в конце 17."
  20: "ἐκύκλωσαν ὁδὸν τὴν εἰς Αδωρα — «пошли обходным путём на Адору»; ἀντιπαρῆγεν αὐτῷ — «шёл против него (следовал)»."
  21: "ἀπὸ τῆς ἄκρας — «из крепости» (アクラ); κατασπεύδοντας — «понуждающих»; τροφάς — «пропитание», 食糧."
  22: "χιὼν πολλὴ σφόδρα — «снег весьма большой»; Γαλααδῖτιν — ガラアディティス."
  23: "Βασκαμα — バスカマ; ἐτάφη ἐκεῖ — «погребён был там»."
  25: "τὰ ὀστᾶ — «кости»; Μωδειν πόλις τῶν πατέρων — «Модин, город отцов»."
  27: "ὕψωσεν αὐτὸν τῇ ὁράσει — «возвысил его на вид»; λίθῳ ξεστῷ — «камнем тёсаным»."
  28: "ἑπτὰ πυραμίδας — «семь пирамид»; μίαν κατέναντι τῆς μίας — «одну против другой»."
  29: "μηχανήματα — «украшения (устройства)» (слав. «ограды»); πανοπλίαι — «полные доспехи», 全身甲冑; πλοῖα ἐγγεγλυμμένα — «корабли изваянные»."
  31: "ἐπορεύετο δόλῳ μετὰ Ἀντιόχου — «шёл с хитростью с Антиохом»; ἀπέκτεινεν αὐτόν — «убил его» (Антиоха VI)."
  32: "πληγὴ μεγάλη — «поражение (язва) великое»."
  33: "περιετείχισεν πύργοις ὑψηλοῖς — «обвёл стенами с высокими башнями»; μοχλοί — 貫き棒; βρώματα — «снеди», 食糧."
  34: "ἄφεσιν τῇ χώρᾳ — «освобождение (льготу) стране»; ἁρπαγαί — «грабежи»."
  37: "τὸν στέφανον τὸν χρυσοῦν καὶ τὴν βαίνην — «венец золотой и ваию (пальмовую ветвь)»; τὰ ἀφέματα — «льготы»."
  39: "ἀγνοήματα καὶ τὰ ἁμαρτήματα — «неведения и согрешения»; ἐτελωνεῖτο — «взималось (облагалось пошлиной)»."
  41: "Ἔτους ἑβδομηκοστοῦ καὶ ἑκατοστοῦ — 170-й год; ὁ ζυγὸς τῶν ἐθνῶν — «иго народов»."
  42: "συγγραφαί — «письмена, документы»; συναλλάγματα — «договоры (сделки)»; ἐπὶ Σιμωνος ἀρχιερέως μεγάλου — «при Симоне, великом первосвященнике»."
  43: "В LXX: παρενέβαλεν ἐπὶ Γαζαρα («на Газару»); слав. «прииде Симон в газу», ru «на Газу» — по паритету держим слав. (ガザ). ἐλεόπολιν — «градопленительницу», осадная башня, 攻城塔."
  44: "ἐξήλλοντο — «выскакивали» (слав. «вскачаху»); κίνημα μέγα — «движение (смятение) великое»."
  45: "διερρηχότες τὰ ἱμάτια — «разодрав одежды»; δεξιάς — «десницу», т.е. мир (和)."
  46: "Μὴ ἡμῖν χρήσῃ κατὰ τὰς πονηρίας ἡμῶν — «не поступи с нами по злобам нашим»; κατὰ τὸ ἔλεός σου — «по милости твоей»."
  47: "συνελύθη αὐτοῖς — «смилостивился (уступил) им»; ὑμνῶν καὶ εὐλογῶν — «воспевая и благословляя» (слав. добавляет «Господа»)."
  48: "πᾶσαν ἀκαθαρσίαν — «всякую нечистоту»; οἵτινες τὸν νόμον ποιήσωσιν — «которые закон исполнят»; οἴκησιν — «жилище»."
  49: "ἐκωλύοντο ἐκπορεύεσθαι — «возбранялось выходить»; ἐπείνασαν σφόδρα — «взалкали весьма»."
  51: "τῇ τρίτῃ καὶ εἰκάδι τοῦ δευτέρου μηνός — «23-го второго месяца»; ἐν κινύραις καὶ ἐν κυμβάλοις καὶ ἐν νάβλαις — 琴・シンバル・竪琴; βαΐα — «ваии», пальмовые ветви."
  53: "Ἰωάννην υἱὸν αὐτοῦ — ヨハネ (Гиркан); ᾤκει ἐν Γαζαροις — «жил в Газаре» (ガザラ)."
