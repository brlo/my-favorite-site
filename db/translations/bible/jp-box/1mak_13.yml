# jp-box, 1 Маккавейская, глава 13. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; совпадает с gr (53 стиха).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: 1–6 речь Симона (братья погибли за Израиль, он не пожалеет жизни);
# 7–9 народ избирает его вождём; 10–11 укрепление Иерусалима, Иоппия;
# 12–24 Трифон с пленённым Ионатаном, выкуп, снег, убийство Ионатана в Васкаме,
# погребение в Модине; 25–30 надгробие с семью пирамидами; 31–32 Трифон
# убивает Антиоха и царствует; 33–40 грамота Димитрия (41–42 — начало
# летосчисления «первого года при Симоне»); 43–53 взятие Газы, очищение
# крепости, вход 23 адара 171 г., Иоанн — начальник войск, Газара.
# Голоса: 3–6 (речь Симона), 8–9 (ответ народа), 15–16 (слова Трифона),
# 18, 36–40 (грамота Димитрия), 46 (слова горожан) — 「…»; 42 — датировка
# документа в 「…».
# 13:43 — у слав. (и ru) «прииде Симон в газу», в LXX Γαζαρα; по паритету
# держим слав. (ガザ), вариант LXX — в notes.
#
