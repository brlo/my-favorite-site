# jp-box, Послание к Ефесянам, глава 2. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 2: от смерти по преступлениям к жизни благодатью (1–10), разделяющая стена
# и мир Христов, «два в одном новом человеке» (11–22).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет.
# 〔…〕 в главе нет: расхождений с базой, требующих скобок, нет.
# Цитата: 2:17 (Ис 57:19) — в 「…」. Сносок ⟨…⟩ в главе нет.
# jp-ni не использовался.

tr_code: jp-box
book: ef
chapter: 2
draft: true

verses:
  1: "あなたがたもまた、自分の罪[つみ]と背[そむ]きとによって死[し]んでいた者[もの]であった。"
  2: "かつてあなたがたは、それらの罪のうちにあって、この世[よ]の習[なら]わしに従[したが]って歩[あゆ]み、空中[くうちゅう]の権[けん]の君[きみ]、すなわち、今[いま]、不従順[ふじゅうじゅん]の子[こ]どもたちのうちに働[はたら]いている霊[れい]に従[したが]って歩[あゆ]んでいたのである。"
  3: "わたしたちも皆[みな]、かつてはその中[なか]にあって、肉[にく]の欲[よく]に従[したが]って生活[せいかつ]し、肉[にく]と心[こころ]の思[おも]いが欲[ほっ]するままを行[おこな]い、ほかの者[もの]たちと同じく、生[う]まれながらにして怒[いか]りの子[こ]であった。"
  4: "しかし、憐[あわ]れみに富[と]む神[かみ]は、わたしたちを愛[あい]してくださった大[おお]きな愛[あい]のゆえに、"
  5: "罪[つみ]によって死[し]んでいたわたしたちを、キリストとともに生[い]かしてくださったのである。（あなたがたは恵[めぐ]みによって救[すく]われたのである。）"
  6: "また、キリスト・イエスにあって、わたしたちをキリストとともに復活[ふっかつ]させ、天[てん]において、ともに座[すわ]らせてくださった。"
  7: "それは、来[きた]るべき世々[よよ]において、キリスト・イエスにあってわたしたちに与[あた]えられた、その{恵[めぐ]み|恩寵[おんちょう]}の測[はか]り知[し]れない富[とみ]を、その優[やさ]しさによって示[しめ]すためである。"
  8: "というのは、あなたがたは、恵[めぐ]みによって、信仰[しんこう]を通[とお]して救[すく]われたからである。そして、これはあなたがたから出[で]たものではなく、神[かみ]の賜物[たまもの]である。"
  9: "行[おこな]いから出[で]たものではない。だれも誇[ほこ]ることがないためである。"
  10: "というのは、わたしたちは神[かみ]の作品[さくひん]であり、キリスト・イエスにあって、良[よ]い行[おこな]いのために造[つく]られた者[もの]である。神[かみ]は、わたしたちがその行[おこな]いのうちを歩[あゆ]むために、あらかじめそれを備[そな]えておられたのである。"
  11: "それゆえ、あなたがたが、かつて肉[にく]において異邦人[いほうじん]であり、肉[にく]において手[て]で造[つく]られた割礼[かつれい]と称[とな]えられる者[もの]たちから、無割礼[むかつれい]と称[とな]えられていた者[もの]であったことを、思[おも]い出[だ]しなさい。"
  12: "そのころ、あなたがたはキリストなく、イスラエルの民[たみ]の共同体[きょうどうたい]から遠[とお]ざけられ、約束[やくそく]の諸[しょ]契約[けいやく]において他国人[たこくじん]であり、希望[きぼう]を持[も]たず、世[よ]にあって神[かみ]のない者[もの]であった。"
  13: "しかし、今[いま]は、キリスト・イエスにあって、あなたがたは、かつては遠[とお]くにいた者[もの]が、キリストの血[ち]によって近[ちか]い者[もの]となったのである。"
  14: "というのは、キリストご自身[じしん]がわたしたちの平和[へいわ]であり、二[ふた]つのものを一[ひと]つにし、隔[へだ]ての壁[かべ]、すなわち、敵意[てきい]を、ご自身[じしん]の肉[にく]において壊[こわ]し、"
  15: "律法[りっぽう]の諸[しょ]命令[めいれい]をその定[さだ]めとともに廃[はい]し、ご自身[じしん]のうちで、二[ふた]つのものから一[ひと]人[り]の新[あたら]しい人[ひと]を造[つく]り、平和[へいわ]を実現[じつげん]し、"
  16: "また、十字架[じゅうじか]によって敵意[てきい]を殺[ころ]し、それによって、一[ひと]つの体[からだ]において、二[ふた]つのものを神[かみ]と和解[わかい]させてくださったのである。"
  17: "そして、来[き]て、「遠[とお]くにいる者[もの]にも平和[へいわ]を、近[ちか]くにいる者[もの]にも平和[へいわ]を」と、あなたがたに宣[の]べ伝[つた]えられたのである。"
  18: "というのは、この方[かた]によって、わたしたち二[ふた]つの者[もの]は、一[ひと]つの霊[れい]において、父[ちち]のもとへ近[ちか]づくことができるからである。"
  19: "それゆえ、あなたがたは、もはや他国人[たこくじん]でも寄留者[きりゅうしゃ]でもなく、聖[せい]なる者[もの]たちと同国民[どうこくみん]であり、神[かみ]の家族[かぞく]なのである。"
  20: "あなたがたは、使徒[しと]たちと預言者[よげんしゃ]たちという土台[どだい]の上[うえ]に建[た]てられており、キリスト・イエスご自身[じしん]がその隅[すみ]の親石[おやいし]である。"
  21: "この方[かた]にあって、建物[たてもの]全体[ぜんたい]が組[く]み合[あ]わされ、主[しゅ]にあって聖[せい]なる神殿[しんでん]へと成長[せいちょう]していく。"
  22: "この方[かた]にあって、あなたがたもまた、霊[れい]において神[かみ]の住[す]まいとなるために、ともに建[た]てられていくのである。"

notes:
  1: "Καὶ ὑμᾶς ὄντας νεκροὺς — висячий аккузатив, разрешающийся только в 5 ст. (συνεζωοποίησεν). По-японски 1 ст. — самостоятельное предложение, а 5 ст. повторяет «罪によって死んでいたわたしたち», как в греч. повторено ὄντας ἡμᾶς νεκρούς. παραπτώμασιν καὶ ἁμαρτίαις — 背きと罪 (два разных слова)."
  2: "κατὰ τὸν αἰῶνα τοῦ κόσμου τούτου — この世の習わし. ἄρχων τῆς ἐξουσίας τοῦ ἀέρος — 空中の権の君 (ἀήρ — воздух; ср. jp-joc 空気中の権ある君). τοῦ πνεύματος τοῦ νῦν ἐνεργοῦντος — 今…働いている霊. υἱοὶ τῆς ἀπειθείας — 不従順の子たち."
  3: "ἀνεστράφημεν — 生活し. τὰ θελήματα τῆς σαρκὸς καὶ τῶν διανοιῶν — 肉と心の思いとの欲するまま (διάνοια — 思い). τέκνα φύσει ὀργῆς — 生まれながらにして怒りの子. ὡς καὶ οἱ λοιποί — ほかの者たちと同じく."
  4: "πλούσιος ὢν ἐν ἐλέει — 憐れみに富む. διὰ τὴν πολλὴν ἀγάπην — 大きな愛のゆえに. Стих обрывается на причине — сказуемое в 5 ст."
  5: "συνεζωοποίησεν τῷ Χριστῷ — キリストとともに生かしてくださった. χάριτί ἐστε σεσῳσμένοι — 恵みによって救われた (в скобках, как у jp-joc: «恩寵を以て救はれたり»)."
  6: "συνήγειρεν καὶ συνεκάθισεν — ともに復活させ、ともに座らせ. ἐν τοῖς ἐπουρανίοις ἐν Χριστῷ Ἰησοῦ — 天において、キリスト・イエスにあって."
  7: "ἐνδείξηται — 示す. τὸ ὑπερβάλλον πλοῦτος — 測り知れない富. ἐν χρηστότητι ἐφ᾿ ἡμᾶς — その優しさによって (χρηστότης — благость, милость)."
  8: "τῇ χάριτί ἐστε σεσῳσμένοι διὰ πίστεως — 恵みによって、信仰を通して救われた (χάρις — основание, πίστις — средство). καὶ τοῦτο — そして、これは (ср. род; относится и к спасению, и к вере — не разрешено). θεοῦ τὸ δῶρον — 神の賜物."
  9: "οὐκ ἐξ ἔργων — 行いから出たものではない. ἵνα μή τις καυχήσηται — だれも誇ることがないため."
  10: "ποίημα — 作品 (изделие, ср. Рим 1:20). κτισθέντες ἐν Χριστῷ Ἰησοῦ — キリスト・イエスにあって造られた. ἐπὶ ἔργοις ἀγαθοῖς — 良い行いのために. προητοίμασεν — あらかじめ備えておられた. ἐν αὐτοῖς περιπατήσωμεν — その行いのうちを歩む."
  11: "Διὸ μνημονεύετε — それゆえ、思い出しなさい. τὰ ἔθνη ἐν σαρκί — 肉において異邦人. ἀκροβυστία / περιτομή — 無割礼／割礼. χειροποιήτου — 手で造られた (о внешнем обрезании)."
  12: "χωρὶς Χριστοῦ — キリストなく. πολιτεία τοῦ Ἰσραήλ — イスラエルの民の共同体 (πολιτεία — гражданство, уклад). ξένοι τῶν διαθηκῶν τῆς ἐπαγγελίας — 約束の諸契約の他国人. ἐλπίδα μὴ ἔχοντες — 希望を持たず. ἄθεοι ἐν τῷ κόσμῳ — 世にあって神のない者."
  13: "νυνὶ δέ — しかし、今は. οἵ ποτε ὄντες μακράν — かつては遠くにいた者. ἐγενήθητε ἐγγύς — 近い者となった. ἐν τῷ αἵματι τοῦ Χριστοῦ — キリストの血によって."
  14: "Αὐτὸς γάρ — というのは、キリストご自身が. ἡ εἰρήνη ἡμῶν — わたしたちの平和. τὰ ἀμφότερα ἕν — 二つのものを一つに. μεσότοιχον τοῦ φραγμοῦ — 隔ての壁. τὴν ἔχθραν — 敵意 (приложение к «стене»); ἐν τῇ σαρκὶ αὐτοῦ — ご自身の肉において."
  15: "τὸν νόμον τῶν ἐντολῶν ἐν δόγμασιν — 律法の諸命令をその定めとともに (δόγματα — предписания). καταργήσας — 廃し. ἕνα καινὸν ἄνθρωπον — 一人の新しい人 (καινός — новый по качеству). ποιῶν εἰρήνην — 平和を実現し."
  16: "ἀποκαταλλάξῃ — 和解させ. ἐν ἑνὶ σώματι — 一つの体において. τῷ θεῷ — 神と. διὰ τοῦ σταυροῦ — 十字架によって. ἀποκτείνας τὴν ἔχθραν ἐν αὐτῷ — 敵意を殺し (ἐν αὐτῷ — «в нём», то есть в кресте или в Себе; двусмысленность сохранена: それによって)."
  17: "ἐλθὼν εὐηγγελίσατο — 来て…宣べ伝えられた. Ис 57:19: εἰρήνην ὑμῖν τοῖς μακρὰν καὶ εἰρήνην τοῖς ἐγγύς — цитата в 「…」, обращение ὑμῖν вынесено за кавычки: あなたがたに."
  18: "ὅτι δι᾿ αὐτοῦ — というのは、この方によって. προσαγωγή — 近づくこと (доступ). οἱ ἀμφότεροι — わたしたち二つの者は. ἐν ἑνὶ πνεύματι — 一つの霊において. πρὸς τὸν πατέρα — 父のもとへ."
  19: "ἄρα οὖν — それゆえ. ξένοι καὶ πάροικοι — 他国人でも寄留者でもなく. συμπολῖται τῶν ἁγίων — 聖なる者たちと同国民. οἰκεῖοι τοῦ θεοῦ — 神の家族 (свои в доме Божием)."
  20: "ἐπὶ τῷ θεμελίῳ τῶν ἀποστόλων καὶ προφητῶν — 使徒たちと預言者たちという土台の上に (род. основания). ἀκρογωνιαῖος — 隅の親石 (ср. 1 Пет 2:6). αὐτοῦ Χριστοῦ Ἰησοῦ — キリスト・イエスご自身."
  21: "πᾶσα οἰκοδομή — 建物全体. συναρμολογουμένη — 組み合わされ. αὔξει — 成長していく. εἰς ναὸν ἅγιον ἐν κυρίῳ — 主にあって聖なる神殿へと."
  22: "συνοικοδομεῖσθε — ともに建てられていく. εἰς κατοικητήριον τοῦ θεοῦ — 神の住まい. ἐν πνεύματι — 霊において."
