chapter: 10
draft: true

verses:
  1: "彼[かれ]の父[ちち]トビトは、毎日[まいにち]、日[ひ]を数[かぞ]えていた。旅[たび]の日数[にっすう]が満[み]ちても、彼らは来[こ]なかった。"
  2: "そこで彼は言[い]った。「もしかすると、彼らは辱[はずかし]められたのではないか。あるいは、ガバエルが死[し]んで、彼に銀[ぎん]を渡[わた]す者[もの]がないのではないか。」"
  3: "そして彼はひどく悲[かな]しんだ。"
  4: "妻[つま]が彼に言[い]った。「あの子は死[し]んだ。もう長[なが]いことたっているからだ。」そして、彼女[かのじょ]はその子のために泣[な]き悲[かな]しみ始[はじ]め、こう言[い]った。"
  5: "「子[こ]よ、わたしがあなたを、わたしの目[め]の光[ひかり]を、手放[てばな]してしまったことは、わたしにとって何[なん]でもないことなのか。」"
  6: "トビトは彼女に言[い]った。「黙[だま]れ。気[き]にかけるな。彼は無事[ぶじ]だ。」"
  7: "「黙[だま]れ。わたしを欺[あざむ]くな。わたしの子は死[し]んだ。」そして彼女は毎日、外[そと]へ出[で]て、彼が出[で]て行[い]った道[みち]へ向[む]かった。昼[ひる]はパンを食[た]べず、夜[よる]は、ラグエルが彼をそこで過[す]ごさせると誓[ちか]った婚礼[こんれい]の十四日[じゅうよっか]が終[お]わるまで、自分[じぶん]の息子[むすこ]トビアのことを泣[な]き続けてやまなかった。"
  8: "そこでトビアはラグエルに言[い]った。「わたしを送[おく]り出[だ]してほしい。父[ちち]と母[はは]は、もうわたしに会[あ]えるとは思[おも]っていないからだ。」"
  9: "そこで彼のしゅうとが彼に言[い]った。「わたしのもとに留[とど]まっていなさい。わたしがあなたの父[ちち]のもとへ人[ひと]を遣[つか]わして、あなたのことを知[し]らせよう。」トビアは言った。「いいえ。わたしを父のもとへ送り出してほしい。」"
  10: "そこでラグエルは立[た]ち上[あ]がり、彼の妻[つま]サラと、財産[ざいさん]の半分[はんぶん]、すなわち奴隷[どれい]たちと家畜[かちく]と銀[ぎん]を彼に与[あた]えた。"
  11: "そして彼らを祝福[しゅくふく]して送[おく]り出[だ]し、言[い]った。「子[こ]らよ、天[てん]の神[かみ]が、わたしが死[し]ぬ前[まえ]に、あなたがたを無事[ぶじ]に導[みちび]いてくださるように。」"
  12: "そして自分[じぶん]の娘[むすめ]に言[い]った。「しゅうととしゅうとめを敬[うやま]いなさい。今、彼らはあなたの親[おや]なのだから。あなたについて良[よ]い評判[ひょうばん]を聞[き]きたい。」そして彼女に口[くち]づけした。"
  13: "そしてエドナはトビアに言[い]った。「愛[あい]する兄弟[きょうだい]よ、天[てん]の主[しゅ]があなたを帰[かえ]らせ、わたしに、わたしの娘[むすめ]サラによるあなたの子[こ]どもを見[み]させてくださるように。わたしが主の前[まえ]で喜[よろこ]べるように。見[み]なさい、わたしは娘をあなたに預[あず]け物[もの]として委[ゆだ]ねる。彼女を悲[かな]しませてはならない。」"
  14: "その後[あと]、トビアは神[かみ]をほめたたえながら旅[たび]を続[つづ]けた。神が彼の道[みち]を栄[さか]えさせたからである。そして、ラグエルとその妻[つま]エドナを祝福[しゅくふく]した。"

notes:
  1: "ἐλογίζετο ἑκάστης ἡμέρας — «считал каждый день» (λογίζομαι; слав. «сочисляше кийждо день»). αἱ ἡμέραι τῆς πορείας — дни пути (πορεία); ἐπληρώθησαν — исполнились (πληρόω). οὐκ ἤρχοντο — не приходили (imperfect, длительное ожидание)."
  2: "εἶπεν — сказал; подлежащее не названо, это Товит. Μήποτε κατῄσχυνται — «не посрамлены ли они?» (καταισχύνω, perfect pass.; слав. «еда како посрамлени суть»); речь о том, что их могло задержать. ἢ μήποτε ἀπέθανεν Γαβαηλ — или, может быть, умер Гаваил (Γαβαηλ, ガバエル). οὐδεὶς δίδωσιν αὐτῷ τὸ ἀργύριον — никто не даёт ему серебра."
  3: "ἐλυπεῖτο λίαν — очень скорбел (λυπέω, pass.; слав. «скорбяше зело»). λίαν — «весьма»."
  4: "Ἀπώλετο τὸ παιδίον — «погибло дитя» (ἀπόλλυμι; слав. «погибе отрочищь»); ἀπώλετο значит «пропало, погибло», не просто «умерло». κεχρόνικεν — «замедлил, долго нет» (χρονίζω, perfect). ἤρξατο θρηνεῖν — начала оплакивать (θρηνέω); καὶ εἶπεν вводит речь ст. 5."
  5: "Οὐ μέλει μοι — «разве мне не важно?» (μέλει с дат. лица); риторический вопрос горя. τέκνον — дитя (обращение). ἀφῆκά σε τὸ φῶς τῶν ὀφθαλμῶν μου — «я отпустила тебя, свет очей моих» (ἀφίημι; слав. «лишихся тя света очию моею»)."
  6: "Σίγα — «молчи» (повелит.). μὴ λόγον ἔχε — букв. «не имей слова», т. е. «не думай об этом, не тревожься» (слав. «не печалися»; Синод. «не тревожься»). ὑγιαίνει — здоров (ὑγιαίνω). Греч. λέγει — исторический презенс."
  7: "Σίγα, μὴ πλάνᾳ με — «молчи, не обманывай меня» (πλανάω; слав. «не прельщай мене») — резкий ответ Анны. ἐπορεύετο καθ᾽ ἡμέραν εἰς τὴν ὁδὸν ἔξω — ходила ежедневно на дорогу вне [города]. ἄρτον οὐκ ἤσθιεν — хлеба не ела. τὰς νύκτας οὐ διέλιμπανεν θρηνοῦσα — ночами не переставала плакать (διαλείπω). αἱ δέκα τέσσαρες ἡμέραι τοῦ γάμου — четырнадцать дней брака (γάμος, 婚礼); ὤμοσεν Ραγουηλ ποιῆσαι αὐτὸν ἐκεῖ — Рагуил поклялся, что он проведёт их там (ὄμνυμι). В csl 10:7 входит также gr 10:8."
  8: "Ἐξαποστειλόν με — «отпусти меня» (ἐξαποστέλλω, повелит.). ὁ πατήρ μου καὶ ἡ μήτηρ μου — отец мой и мать моя. οὐκέτι ἐλπίζουσιν ὄψεσθαί με — уже не надеются увидеть меня (ἐλπίζω + inf.). В csl этот стих — конец 10:7 (нумерация сдвинута)."
  9: "ὁ πενθερὸς αὐτοῦ — тесть (πενθερός, しゅうと). Μεῖνον παρ᾽ ἐμοί — «останься у меня» (μένω). κἀγὼ ἐξαποστελῶ — и я пошлю. δηλώσουσιν αὐτῷ τὰ κατὰ σέ — возвестят ему о тебе (δηλόω). Οὐχί — нет. В csl это 10:8 (слова тестя) и 10:9 (ответ Товии)."
  10: "ἀναστὰς δὲ Ραγουηλ — встав, Рагуил. τὰ ἥμισυ τῶν ὑπαρχόντων — половину имущества (ὕπαρξις; слав. «пол имений»). σώματα — «тела», т. е. рабы (слав. «рабы»); κτήνη — скот; ἀργύριον — серебро."
  11: "εὐλογήσας αὐτοὺς ἐξαπέστειλεν — благословив их, отпустил. Εὐοδώσει ὑμᾶς — «даст вам добрый путь, устроит вас» (εὐοδόω; слав. «да благопоспешит вам»). ὁ θεὸς τοῦ οὐρανοῦ — Бог небесный. πρὸ τοῦ με ἀποθανεῖν — прежде чем мне умереть."
  12: "Τίμα τοὺς πενθερούς σου — почитай свёкра и свекровь (τιμάω; πενθεροί мн. — родители супруга). αὐτοὶ νῦν γονεῖς σού εἰσιν — они теперь твои родители. ἀκούσαιμί σου ἀκοὴν καλήν — оптитив: «да услышу о тебе добрый слух» (ἀκοή). ἐφίλησεν — поцеловал (φιλέω)."
  13: "Ἄδελφε ἀγαπητέ — возлюбленный брат (обращение к зятю). ἀποκαταστήσαι σε ὁ κύριος τοῦ οὐρανοῦ — оптитив: «да восстановит, вернёт тебя Господь неба» (ἀποκαθίστημι; слав. «да возвратит тя»). δῴη μοι ἰδεῖν σου παιδία ἐκ Σαρρας — даст мне увидеть детей твоих от Сарры. ἵνα εὐφρανθῶ ἐνώπιον τοῦ κυρίου — чтобы мне возрадоваться пред Господом (εὐφραίνω). παρατίθεμαί σοι … ἐν παρακαταθήκῃ — «отдаю тебе на сохранение, как вклад» (παρακαταθήκη; слав. «в залог»). μὴ λυπήσῃς αὐτήν — не огорчай её."
  14: "μετὰ ταῦτα ἐπορεύετο — после этого шёл (imperfect). εὐλογῶν τὸν θεόν — благословляя Бога. ὅτι εὐόδωσεν τὴν ὁδὸν αὐτοῦ — что Он устроил путь его (εὐοδόω). κατευλόγει — благословлял (imperfect). В csl/ru это 10:13; слав. 10:13 добавляет «и идяше, дондеже приближитися им к ниневии» — это начало gr 11:1."
