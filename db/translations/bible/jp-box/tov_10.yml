# jp-box, Товит, глава 10. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc в книге нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 10: ожидание родителей в Ниневии и плач Анны (1–7), Товия просит Рагуила
# отпустить его (8), ответ тестя и настояние Товии (9), Рагуил отдаёт Сарру и
# половину имущества (10), благословение на дорогу (11), наставление дочери и
# прощание Едны (12–13), обратный путь с благословением Бога (14).
# Прямая речь — 「…」: 2, 6 (Товит), 5, 7 (Анна), 8–9 (Товия и Рагуил),
# 11–12 (Рагуил), 13 (Една). Красного и синего нет (ВЗ).
# Нумерация по gr: 14 стихов. Сдвиги csl: csl 10:7 вбирает gr 10:7–8; csl 10:8 =
# gr 10:9a, csl 10:9 = gr 10:9b; csl 10:10–11 = gr 10:10–11; csl 10:12 вбирает
# gr 10:12–13; csl 10:13 = gr 10:14 (в него же входит начало gr 11:1).
# 〔…〕 нет: все стихи есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 婚礼, しゅうと, しゅうとめ, 奴隷, 家畜 уже в корпусе.
# Имена — транслитерация греческого (LXX).

