# jp-box, Левит, глава 18. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в Левите отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 18: увещание не поступать по обычаям Египта и Ханаана (1–5),
# запреты брачных связей (6–18), иные половые запреты (19–23),
# увещание и угроза изгнания из земли (24–30).
# Формулы единообразны: 「…の裸[はだか]を現[あらわ]してはならない」
# (ἀποκαλύψαι ἀσχημοσύνην) и 「…と寝[ね]てはならない」 (κοιμηθῆναι).
# Речь Бога — 「…」 (2–30), красного нет.
# 〔…〕 нет: все слова есть в gr-lxx-byz. В 18:21 (и 20:2–5) LXX вместо имени
# Молоха ставит ἄρχων/ἄρχοντες («правитель») — это эвфемизм евр. מֹלֶךְ;
# передан сам референт (モロク), как в Деян 7:43; сносок нет (モロク уже в корпусе).
# jp-ni не использовался.

tr_code: jp-box
