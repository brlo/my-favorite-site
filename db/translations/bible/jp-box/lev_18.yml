chapter: 18
draft: true

verses:
  1: "主[しゅ]はモーセに言[い]われた。"
  2: "「イスラエルの子[こ]らに語[かた]って言[い]いなさい。わたしは主[しゅ]、あなたがたの神[かみ]である。"
  3: "あなたがたが住[す]んでいたエジプトの地[ち]の行[おこな]いをしてはならない。わたしがあなたがたを導[みちび]き入[い]れるカナンの地の行いもしてはならない。また、その定[さだ]めに従[したが]って歩[あゆ]んではならない。"
  4: "わたしの掟[おきて]を行[おこな]い、わたしの戒[いまし]めを守[まも]って、そのうちを歩[あゆ]みなさい。わたしは主[しゅ]、あなたがたの神[かみ]である。"
  5: "あなたがたはわたしの戒[いまし]めをすべて、わたしの掟[おきて]をすべて守[まも]り、それを行[おこな]わなければならない。人[ひと]はこれを行えば、それによって生[い]きる。わたしは主[しゅ]、あなたがたの神[かみ]である。"
  6: "だれも、肉[にく]による近親[きんしん]のだれにも近[ちか]づいて、その裸[はだか]を現[あらわ]してはならない。わたしは主[しゅ]である。"
  7: "あなたの父[ちち]の裸[はだか]、あなたの母[はは]の裸を現[あらわ]してはならない。彼女[かのじょ]はあなたの母であるから、その裸を現してはならない。"
  8: "あなたの父[ちち]の妻[つま]の裸[はだか]を現[あらわ]してはならない。それはあなたの父の裸である。"
  9: "あなたの姉妹[しまい]、父[ちち]の娘[むすめ]であれ母[はは]の娘であれ、家[いえ]のうちで生[う]まれた者[もの]も外[そと]で生まれた者も、その裸[はだか]を現[あらわ]してはならない。"
  10: "あなたの息子[むすこ]の娘[むすめ]、あなたの娘の娘の裸[はだか]を現[あらわ]してはならない。それはあなた自身[じしん]の裸である。"
  11: "あなたの父[ちち]の妻[つま]の娘[むすめ]の裸[はだか]を現[あらわ]してはならない。彼女[かのじょ]は父を同[おな]じくするあなたの姉妹[しまい]である。"
  12: "父[ちち]の姉妹[しまい]の裸[はだか]を現[あらわ]してはならない。彼女[かのじょ]は父の近親[きんしん]である。"
  13: "母[はは]の姉妹[しまい]の裸[はだか]を現[あらわ]してはならない。彼女[かのじょ]は母の近親[きんしん]である。"
  14: "父[ちち]の兄弟[きょうだい]の裸[はだか]を現[あらわ]してはならず、その妻[つま]に近[ちか]づいてはならない。彼女[かのじょ]はあなたの親族[しんぞく]である。"
  15: "あなたの嫁[よめ]の裸[はだか]を現[あらわ]してはならない。彼女[かのじょ]はあなたの息子[むすこ]の妻[つま]であるから、その裸を現してはならない。"
  16: "あなたの兄弟[きょうだい]の妻[つま]の裸[はだか]を現[あらわ]してはならない。それはあなたの兄弟の裸である。"
  17: "女[おんな]とその娘[むすめ]の裸[はだか]を現[あらわ]してはならない。その息子[むすこ]の娘、その娘の娘を取[と]って、その裸を現してはならない。彼女[かのじょ]らはあなたの近親[きんしん]であり、それは不敬虔[ふけいけん]である。"
  18: "妻[つま]の姉妹[しまい]を、妻と争[あらそ]わせるために取[と]って、妻がまだ生[い]きている間[あいだ]に、その裸[はだか]を現[あらわ]してはならない。"
  19: "女[おんな]がその汚[けが]れのために隔[へだ]てられている間[あいだ]、その女に近[ちか]づいて、裸[はだか]を現[あらわ]してはならない。"
  20: "隣人[りんじん]の妻[つま]と寝[ね]て精[せい]を注[そそ]ぎ、彼女[かのじょ]によって汚[けが]れてはならない。"
  21: "あなたの子孫[しそん]のうちから、だれもモロクに仕[つか]えさせてはならない。あなたの神[かみ]の聖[せい]なる名[な]を汚[けが]してはならない。わたしは主[しゅ]である。"
  22: "女[おんな]と寝[ね]るように男[おとこ]と寝てはならない。それは忌[いま]むべきものである。"
  23: "どんな家畜[かちく]とも寝[ね]て精[せい]を注[そそ]いではならない。女[おんな]も、家畜と交[まじ]わるためにその前[まえ]に立[た]ってはならない。それは忌[いま]わしいことである。"
  24: "あなたがたはこれらのことのどれによっても汚[けが]れてはならない。わたしがあなたがたの前[まえ]から追[お]い出[だ]す民[たみ]は、これらのことすべてによって汚れたからである。"
  25: "その地[ち]も汚[けが]れた。わたしはその地のゆえに彼[かれ]らに不正[ふせい]の報[むく]いを返[かえ]したので、その地はそこに住[す]む者[もの]たちを忌[い]み嫌[いと]った。"
  26: "あなたがたはわたしの定[さだ]めとわたしの戒[いまし]めをすべて守[まも]り、これらの忌[いま]むべきことのどれも行[おこな]ってはならない。その地[ち]の生[う]まれの者[もの]も、あなたがたの間[あいだ]に来[き]て住[す]む寄留者[きりゅうしゃ]も同[おな]じである。"
  27: "あなたがたより前[まえ]にいたこの地[ち]の人[ひと]々[びと]は、これらの忌[いま]むべきことをすべて行[おこな]って、その地を汚[けが]したからである。"
  28: "あなたがたがその地[ち]を汚[けが]すとき、その地が、あなたがたより前[まえ]にいた民[たみ]を忌[い]み嫌[いと]ったのと同[おな]じように、あなたがたを忌み嫌わないためである。"
  29: "これらの忌[いま]むべきことをどれか一[ひと]つでも行[おこな]う者[もの]は、その魂[たましい]が民[たみ]のうちから断[た]たれるからである。"
  30: "あなたがたはわたしの戒[いまし]めを守[まも]り、あなたがたより前[まえ]に行[おこな]われていた忌[いま]むべき定[さだ]めをどれも行わず、それらによって汚[けが]れてはならない。わたしは主[しゅ]、あなたがたの神[かみ]である。」"

notes:
  1: "εἶπεν κύριος πρὸς Μωυσῆν λέγων — 主はモーセに言われた (ср. 15:1)."
  2: "Ἐγὼ κύριος ὁ θεὸς ὑμῶν — わたしは主、あなたがたの神である: формула, повторяющаяся в ст. 4, 5 и 30."
  3: "τὰ ἐπιτηδεύματα — дела, обычаи, нравы (ἐπιτήδευμα); κατὰ + вин. — «по»; νόμιμα — установления; οὐ πορεύσεσθε — «не будете ходить»."
  4: "κρίματα — суды, уставы (в яп. 掟); προστάγματα — повеления (в яп. 戒め); πορεύεσθαι ἐν αὐτοῖς — «ходить в них», т. е. поступать по ним."
  5: "φυλάξεσθε … καὶ ποιήσετε — соблюдёте и исполните; ἃ ποιήσας ἄνθρωπος ζήσεται ἐν αὐτοῖς — «исполнив которые, человек будет жив в них» (ср. Рим 10:5; Гал 3:12)."
  6: "Ἄνθρωπος ἄνθρωπος — дистрибутивный повтор (ср. 15:2); οἰκεῖα σαρκός — «родня плоти», ближайшие родственники; ἀποκαλύψαι ἀσχημοσύνην — «открыть наготу» (ἀσχημοσύνη «нагота, срамота»); ἐγὼ κύριος — «Я Господь» (без «Бог»)."
  7: "ἀσχημοσύνην πατρός … καὶ μητρός — нагота отца и матери; речь идёт о матери (ср. ст. 8 о жене отца); μήτηρ γάρ σού ἐστιν — «ибо она мать твоя»."
  8: "γυνὴ πατρός — жена отца, мачеха; ἀσχημοσύνη πατρός — нагота отца: посягательство на мачеху есть посягательство на отца."
  9: "ἀδελφή ἐκ πατρός … ἢ ἐκ μητρός — сестра по отцу или по матери; ἐνδογενής — «рождённая в доме», γεγεννημένη ἔξω — «рождённая вне» (законная или нет; слав. «в дому рожденныя или вне»)."
  10: "θυγάτηρ υἱοῦ … θυγάτηρ θυγατρός — дочь сына и дочь дочери, т. е. внучки; ὅτι σὴ ἀσχημοσύνη ἐστίν — «ибо это нагота твоя»."
  11: "θυγάτηρ γυναικὸς πατρός σου — дочь жены отца твоего, т. е. сводная сестра; ὁμοπατρία ἀδελφή — «единокровная по отцу» (ὁμοπάτριος)."
  12: "ἀδελφὴ πατρός — сестра отца, тётка; οἰκεία πατρός — «родня отцу» (слав. «своя отцу»)."
  13: "ἀδελφὴ μητρός — сестра матери; οἰκεία μητρός — родня матери."
  14: "ἀδελφὸς πατρός — брат отца, дядя; πρὸς τὴν γυναῖκα αὐτοῦ οὐκ εἰσελεύσῃ — «к жене его не войдёшь» (ср. ст. 6); συγγενής — родственница (Синодальный: «тетка твоя»)."
  15: "νύμφη — невестка, жена сына; γυνὴ γὰρ υἱοῦ σού ἐστιν — «ибо она жена сына твоего»."
  16: "γυνὴ ἀδελφοῦ — жена брата; ἀσχημοσύνη ἀδελφοῦ — нагота брата."
  17: "γυνὴ καὶ θυγάτηρ αὐτῆς — жена и дочь её; θυγάτηρ υἱοῦ … θυγάτηρ θυγατρός — внучки; οἰκεῖαι — близкие родственницы; ἀσέβημα — нечестие, безбожие (в яп. 不敬虔)."
  18: "γυναῖκα ἐπὶ ἀδελφῇ αὐτῆς — «жену на сестре её»; ἀντίζηλος — соперница (ζῆλος); ἔτι ζώσης αὐτῆς — «пока она ещё жива»; слав. «в наложницу» передаёт иначе."
  19: "ἐν χωρισμῷ ἀκαθαρσίας — «в отделении нечистоты», о менструации (χωρισμός «отделение»); ср. 15:19–24."
  20: "κοίτην σπέρματος — «ложе семени»; ἐκμιανθῆναι πρὸς αὐτήν — «оскверниться с ней» (ἐκμιαίνω, ср. ст. 23)."
  21: "ἀπὸ τοῦ σπέρματός σου — «из семени твоего», т. е. из детей; λατρεύειν ἄρχοντι — «служить правителю»: LXX смягчает имя Молоха (מֹלֶךְ) словом ἄρχων, слав. читает прямо «молоху». В тексте передан референт — モロク (как в Деян 7:43), без сноски: слово уже встречается в корпусе; эвфемизм LXX отмечен здесь; βεβηλόω — осквернять, профанировать."
  22: "μετὰ ἄρσενος οὐ κοιμηθήσῃ κοίτην γυναικώς — «с мужчиной не ляжешь ложем женским»; βδέλυγμα — мерзость (в яп. 忌むべきもの)."
  23: "πρὸς πᾶν τετράπουν — «со всяким четвероногим»; εἰς σπερματισμόν — «для излияния семени»; οὐ στήσεται … βιβασθῆναι — «не станет, чтобы быть покрытой» (βιβάζω); μυσερόν — гнусное (иное слово, чем βδέλυγμα)."
  24: "μὴ μιαίνεσθε — не оскверняйтесь (μιαίνω); τὰ ἔθνη, ἃ ἐγὼ ἐξαποστέλλω πρὸ προσώπου ὑμῶν — «народы, которых Я отсылаю пред лицом вашим», т. е. изгоняю."
  25: "ἀνταπέδωκα ἀδικίαν αὐτοῖς δι᾽ αὐτήν — «воздал им неправду за неё»; προσώχθισεν ἡ γῆ — «земля возгнушалась» (προσοχθίζω); ἐγκαθήμενοι — живущие на ней."
  26: "νόμιμα … προστάγματα — установления и повеления (ср. ст. 3–5); βδελύγματα — мерзости; ἐγχώριος — туземец; προσγενόμενος προσήλυτος — «присоединившийся пришелец»."
  27: "οἱ ἄνθρωποι τῆς γῆς οἱ ὄντες πρότεροι ὑμῶν — «люди земли, бывшие прежде вас»; ἐμιάνθη ἡ γῆ — земля осквернилась."
  28: "ἵνα μὴ προσοχθίσῃ ὑμῖν ἡ γῆ — «чтобы не возгнушалась вами земля»; ὃν τρόπον — «как»."
  29: "ἐξολεθρευθήσονται αἱ ψυχαὶ αἱ ποιοῦσαι — «истребятся души делающие» (ἐξολεθρεύω); ὅτι — «ибо»."
  30: "τὰ προστάγματά μου — повеления (в яп. 戒め); τῶν νομίμων τῶν ἐβδελυγμένων — «уставов мерзких» (ἐβδελυγμένος, прич. от βδελύσσομαι); ἃ γέγονεν πρὸ τοῦ ὑμᾶς — «что было прежде вас»; формула ἐγὼ κύριος ὁ θεὸς ὑμῶν завершает главу."
