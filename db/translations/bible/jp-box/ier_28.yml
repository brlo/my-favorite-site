# Глава 28 = слав./ru 51: большой оракул о Вавилоне. 1–2 губительный ветер на Вавилон;
# 3–4 поражённые в Халдее; 5–6 «бегите из среды»; 7–8 чаша, внезапное падение, бальзам;
# 9–10 врачевали Вавилон — не исцелился, «выйдем каждый в землю свою»; 11–14 цари
# мидийские, знамя на стенах, конец твой; 15–19 Творец и доля Иакова («Господь — часть
# моя»); 20–23 молот, «рассею в тебе» народы; 24–26 воздаяние, «гора погибельная»;
# 27–33 знамя, Арарат и Асканаз, гумно; 34–35 плач Сиона; 36–44 суд над Вавилоном,
# «выйди из среды его, народ Мой» (45–48 — лакуна модуля, по слав.); 49–58 падение
# и конец; 59–64 повествование о Сарае и свитке, брошенном в Евфрат.
# Голоса: 28:1–58 — одна цитата 「…」 (сплошное слово Господа, как в Ис 47), открывается
# в 28:1, закрывается в конце 28:58; внутри неё вложенная речь — 『…』: 28:34–35 (плач
# Сиона). 28:59–64 — повествование вне кавычек; речь Иеремии к Сарае — 「…» (61–64),
# внутри неё молитва, которую велено прочитать, — 『…』 (62), и слово о погружении
# свитка — 『…』 (64). Формулы «так говорит Господь» / «говорит Господь» внутри
# большой цитаты её не разрывают.
# Нумерация по gr: 64 стиха; у слав. 51 тоже 64, номера совпадают (gr 28:N = слав. 51:N).
# «Точки» модуля: 28:45, 46, 47, 48 — переведены по слав. 51:45–48 (текст дан в выгрузке),
# без 〔…〕, в notes оговорено «в модуле лакуна».
# 〔…〕 нет. Слав. добавления внесены в основной текст без скобок и оговорены:
# 28:11 «сил», 28:19 «(а израиль) жезл достояния его» — в скобках у слав., отдельно
# не переводилось; 28:22 «стара и отрока», 28:28 «всея земли области его», 28:33
# «вседержитель, Бог израилев», 28:37 «жилище змием, в чудо и позвиздание», 28:41
