# вавилон падати язвеным во израили», 28:57 «вои его и сильныя его», 28:64 «и разорится.
# Даже до зде словеса иеремиина». 28:38 «зарыкают» (ru/МТ) не внесено — в LXX глагола нет.
# Сносок ⟨…⟩ нет: 杯, 弓, 矢, 剣, 城壁, 嗣業, 聖所, 神殿, 龍 уже в корпусе.
