# jp-box, Судьи, глава 12. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в главе отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 12: война с Ефремом (1–4), переправы и «шибболет» (5–6),
# смерть Ефтая (7), судьи Есевон (8–10), Елон (11–12) и Лавдон (13–15).
# Речь — 「…」: 1, 2–3 (одна речь), 5, 6.
# Пароль 12:6 — «シボレト»: в гр. σύνθημα («пароль»), слово дано как раскрытие реалии.
# Красного и синего нет.
# 〔…〕 нет: церковных чтений, отсутствующих в gr-lxx-byz, в главе нет (проверено по базе).
# Сносок ⟨…⟩ нет: новых для корпуса терминов глава не вводит.
# jp-ni не использовался.

tr_code: jp-box
book: sud
chapter: 12
draft: true

verses:
  1: "エフライムの子[こ]らは集[あつ]まり、セフィナに来[き]た。彼[かれ]らはエフタに言[い]った。「なぜ、あなたはアンモンの子らと戦[たたか]いに行[ゆ]くとき、私たちを呼[よ]んで、一緒[いっしょ]に行[ゆ]かせなかったのか。私たちはあなたの家[いえ]を火[ひ]で焼[や]き払[はら]う。」"
  2: "エフタは彼[かれ]らに言った。「私と私の民[たみ]は、アンモンの子[こ]らとひどく争[あらそ]っていた。彼らは私をひどく苦[くる]しめた。そこで、私はあなたがたに叫[さけ]んだが、あなたがたは彼らの手[て]から私を救[すく]わなかった。"
  3: "自分[じぶん]を救[すく]う者[もの]がないのを見[み]て、私は自分の命[いのち]を自分の手[て]に置[お]き、アンモンの子[こ]らに向かって渡[わた]って行[い]き、主[しゅ]は彼らを私の手に渡された。それなのに、なぜ、あなたがたは今日[きょう]、私と戦[たたか]おうとして上[のぼ]って来[き]たのか。」"
  4: "エフタはギレアデの者[もの]たちをことごとく集[あつ]め、エフライムと戦[たたか]った。ギレアデの人々[ひとびと]はエフライムを打[う]った。エフライムの人々が「あなたがたはエフライムから逃[に]げ延[の]びた者で、ギレアデはエフライムとマナセの間[あいだ]にある」と言[い]ったからである。"
  5: "ギレアデの人々は、エフライムに通[かよ]うヨルダン川[がわ]の渡[わた]し場[ば]を先[さき]に押[お]さえた。エフライムから逃れ延びた者[もの]たちが「渡[わた]らせてくれ」と言[い]うと、ギレアデの人々は彼[かれ]らに「あなたがたはエフライムの者ではないか」と尋[たず]ね、彼らは「違[ちが]う」と答[こた]えた。"
  6: "彼[かれ]らはその者[もの]に言[い]った。「では、『シボレト』と言[い]ってみよ。」すると、その者[もの]はそのとおりに発音[はつおん]できなかった。そこで、彼らはその者を捕[つか]まえ、ヨルダン川[がわ]の渡[わた]し場[ば]で刺[さ]し殺[ころ]した。そのとき、エフライムから四万二千人[よんまんにせんにん]が倒[たお]れた。"
  7: "エフタは六年[ろくねん]の間[あいだ]、イスラエルを裁[さば]いた。ギレアデ人[びと]エフタは死[し]に、自分[じぶん]の町[まち]であるギレアデに葬[ほうむ]られた。"
  8: "彼[かれ]の後[あと]に、ベツレヘム出身[しゅっしん]のエセボンがイスラエルを裁[さば]いた。"
  9: "彼[かれ]には三十人[さんじゅうにん]の息子[むすこ]と三十人の娘[むすめ]があり、娘たちは外[そと]へ嫁[とつ]がせ、息子たちには外から三十人の妻[つま]を迎[むか]えた。彼は七年[ななねん]の間[あいだ]、イスラエルを裁[さば]いた。"
  10: "エセボンは死[し]に、ベツレヘムに葬[ほうむ]られた。"
  11: "彼[かれ]の後[あと]に、ゼブルン人[びと]エロンがイスラエルを裁[さば]いた。彼は十年[じゅうねん]の間[あいだ]、イスラエルを裁いた。"
  12: "ゼブルン人[びと]エロンはアイリムで死[し]に、ゼブルンの地[ち]に葬[ほうむ]られた。"
  13: "彼[かれ]の後[あと]に、フラアトン人[びと]であるセレムの子[こ]ラブドンがイスラエルを裁[さば]いた。"
  14: "彼[かれ]には四十人[よんじゅうにん]の息子[むすこ]と三十人の孫[まご]がいて、彼らは七十頭[ななじゅうとう]の若[わか]いろばに乗[の]っていた。彼は八年[はちねん]の間[あいだ]、イスラエルを裁[さば]いた。"
  15: "フラアトン人[びと]セレムの子[こ]ラブドンは死[し]に、エフライムの地[ち]、ラナクの山[やま]にあるフラアトンに葬[ほうむ]られた。"

notes:
  1: "συνήχθησαν — собрались (συνάγω). εἰς Σεφινα — в Сефину (Σεφινα; セフィナ). Τί ὅτι — «почему что», т. е. почему. οὐ κέκληκας — не позвал (καλέω). ἐμπρήσομεν ἐν πυρί — сожжём огнём (ἐμπίμπρημι). Речь в 「」."
  2: "Ἀνὴρ ἀντιδικῶν ἤμην ἐγὼ καὶ ὁ λαός μου — «я был человеком тяжбы, я и народ мой» (ἀντιδικέω — вести тяжбу); 争っていた. ἐταπείνουν με σφόδρα — смиряли меня весьма (ταπεινόω). ἐβόησα — воззвал (βοάω). οὐκ ἐσώσατέ με — не спасли. Речь продолжается в ст. 3."
  3: "εἶδον ὅτι οὐκ ἦν ὁ σῴζων — увидел, что нет спасающего. ἐθέμην τὴν ψυχήν μου ἐν τῇ χειρί μου — «положил душу мою в руку мою», т. е. рискнул жизнью; буквально, без сглаживания. ἵνα τί ἀνέβητε — для чего вы поднялись. Конец речи — 「」."
  4: "συνήθροισεν — собрал (ἀθροίζω). ἐπολέμει τὸν Εφραιμ — воевал с Ефремом. ἐπάταξαν — поразили. οἱ διασεσῳσμένοι τοῦ Εφραιμ — уцелевшие, спасшиеся из Ефрема (διασῴζω); 逃げ延びた者. εἶπαν — говорили ефремляне, насмехаясь над галаадитянами. Γαλααδ ἐν μέσῳ Εφραιμ καὶ ἐν μέσῳ Μανασση — Галаад посреди Ефрема и посреди Манассии."
  5: "προκατελάβοντο τὰς διαβάσεις — заняли прежде переправы (προκαταλαμβάνω; διάβασις). Μὴ ὑμεῖς ἐκ τοῦ Εφραιμ; — «не вы ли из Ефрема?». Οὔκ ἐσμεν — «нет». Речь в 「」."
  6: "Εἴπατε δὴ Σύνθημα — «скажите же пароль» (σύνθημα): самого слова «шибболет» в гр. нет; оно дано в тексте как раскрытие реалии (ср. モロク в Лев 18:21), не в 〔…〕, и пояснено здесь. οὐ κατηύθυναν τοῦ λαλῆσαι οὕτως — не смогли так произнести (κατευθύνω). ἐπελάβοντο — схватили (ἐπιλαμβάνομαι). ἔσφαξαν — закололи (σφάζω). δύο τεσσαράκοντα χιλιάδες — 42 000."
  7: "ἓξ ἔτη — шесть лет. ἐν τῇ πόλει αὐτοῦ Γαλααδ — в городе его, Галааде; слав. «во граде своем в галааде»."
  8: "Ἐσεβων ἐκ Βαιθλεεμ — Есевон из Вифлеема: это имя судьи (в евр. Ивцан), в греч. совпадает с названием города Есевон; エセボン, отличие отмечено здесь."
  9: "τριάκοντα θυγατέρες ἐξαπεσταλμέναι ἔξω — тридцать дочерей, выданных вовне, замуж. τριάκοντα γυναῖκας εἰσήγαγεν τοῖς υἱοῖς αὐτοῦ ἔξωθεν — тридцать женщин ввёл сыновьям своим извне; у ру «тридцать дочерей взял» — неточно. ἑπτὰ ἔτη — семь лет."
  10: "ἀπέθανεν ... ἐτάφη ἐν Βηθλεεμ — умер и погребён в Вифлееме."
  11: "Αιλων ὁ Ζαβουλωνίτης — Елон Завулонянин (ゼブルン人; в корпусе ゼブルン). δέκα ἔτη — десять лет."
  12: "ἐν Αιλιμ — в Аилиме (Αιλιμ; アイリム); слав. «во елиме», ру «в Аиалоне» — по МТ. ἔθαψαν αὐτὸν ἐν γῇ Ζαβουλων — похоронили его в земле Завулона; в японском страдательная конструкция."
  13: "Λαβδων υἱὸς Σελλημ ὁ Φρααθωνίτης — Лавдон, сын Селлема, Фраафонитянин (Φρααθων; フラアトン)."
  14: "τεσσαράκοντα υἱοὶ καὶ τριάκοντα υἱοὶ τῶν υἱῶν αὐτοῦ — сорок сыновей и тридцать сыновей сыновей его, т. е. внуков. ἐπιβεβηκότες ἐπὶ ἑβδομήκοντα πώλους — сидевшие на семидесяти молодых ослах. ὀκτὼ ἔτη — восемь лет."
  15: "ἐν Φρααθων ἐν γῇ Εφραιμ ἐν ὄρει Λανακ — в Фраафоне, в земле Ефрема, на горе Ланак (Λανακ; слав. «в горе амаликове», ру «на горе Амаликовой» — иное чтение)."
