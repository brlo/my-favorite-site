verses:
  0: "ダビデの詩[うた]。"
  1: "主[しゅ]よ、わたしを裁[さば]いてください。わたしは無垢[むく]な心[こころ]で歩[あゆ]み、主[しゅ]に寄[よ]り頼[たの]んで、揺[ゆ]るがないからである。"
  2: "主[しゅ]よ、わたしを試[ため]し、わたしを確[たし]かめ、わたしの内[うち]と心[こころ]とを火[ひ]で試[ため]してください。"
  3: "あなたのあわれみはわたしの目[め]の前[まえ]にあり、わたしはあなたの真理[しんり]のうちで、あなたに喜[よろこ]ばれる者となったからである。"
  4: "わたしはむなしい者[もの]の集[つど]いの中[なか]に座[すわ]らず、不法[ふほう]な者[もの]たちとともに入[はい]らない。"
  5: "わたしは悪[わる]を行[おこな]う者[もの]の集[つど]いを憎[にく]み、悪[わる]い者[もの]たちとともに座[すわ]らない。"
  6: "主[しゅ]よ、わたしは無垢[むく]な者[もの]たちとともに手[て]を洗[あら]い、あなたの祭壇[さいだん]の周[まわ]りを巡[めぐ]る。"
  7: "わたしは賛美[さんび]の声[こえ]を聞[き]き、あなたのすべての不思議[ふしぎ]なわざを告[つ]げる。"
  8: "主[しゅ]よ、わたしはあなたの家[いえ]の美[うつく]しさと、あなたの栄光[えいこう]の幕屋[まくや]の所[ところ]とを愛[あい]した。"
  9: "わたしの魂[たましい]を悪[わる]い者[もの]たちとともに、わたしの命[いのち]を血[ち]を流[なが]す者[もの]たちとともに滅[ほろ]ぼさないでください。"
  10: "彼[かれ]らの手[て]には不法[ふほう]があり、その右[みぎ]の手[て]は賄賂[わいろ]に満[み]ちている。"
  11: "しかし、わたしは無垢[むく]な心[こころ]で歩[あゆ]む。わたしを贖[あがな]い出[だ]し、あわれんでください。"
  12: "わたしの足[あし]はまっすぐな所[ところ]に立[た]っている。主[しゅ]よ、わたしは集[つど]いの中[なか]であなたをたたえる。"

notes:
  0: "Ψαλμὸς τῷ Δαυιδ — ダビデの詩. Надписание — стих 0."
  1: "κρῖνόν με — 裁いてください (в смысле «рассуди, защити»). ἀκακία — 無垢. ἐλπίζων οὐ μὴ ἀσθενήσω — 寄り頼んで揺るがない."
  2: "δοκίμασον — 試してください. πείρασον — 確かめてください. πύρωσον — 火で試してください. νεφροί — 内 (внутренности, средоточие чувств)."
  3: "κατέναντι τῶν ὀφθαλμῶν — 目の前に. εὐηρέστησα — 喜ばれる者となった. ἀλήθεια — 真理."
  4: "συνεδρίου ματαιότητος — むなしい者の集い. παρανομούντων — 不法な者たち."
  5: "ἐκκλησίαν πονηρευομένων — 悪を行う者の集い. ἀσεβῶν — 悪い者たち."
  6: "νίψομαι ἐν ἀθῴοις — 無垢な者たちとともに手を洗い. κυκλώσω τὸ θυσιαστήριον — 祭壇の周りを巡る."
  7: "φωνὴ αἰνέσεως — 賛美の声. θαυμάσια — 不思議なわざ."
  8: "εὐπρέπεια οἴκου — 家の美しさ. σκήνωμα δόξης — 栄光の幕屋."
  9: "μὴ συναπολέσῃς — ともに滅ぼさないでください. ἄνδρες αἱμάτων — 血を流す者たち."
  10: "ἀνομίαι — 不法. ἐπλήσθη δώρων — 賄賂に満ちている."
  11: "ἐν ἀκακίᾳ — 無垢な心で. λύτρωσαι — 贖い出してください."
  12: "πούς μου ἔστη ἐν εὐθύτητι — 足はまっすぐな所に立つ. ἐν ἐκκλησίαις — 集いの中で. εὐλογήσω — たたえる."
