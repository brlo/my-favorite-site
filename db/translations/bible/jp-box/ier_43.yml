verses:
  1: "ユダの王[おう]、ヨシヤの子[こ]ヨヤキムの第四年[だいよねん]に、主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  2: "「あなたは巻物[まきもの]を取[と]り、その上[うえ]に、わたしがあなたに語[かた]ったすべての言葉[ことば]を書[か]き記[しる]せ。それは、わたしがあなたに語り始[はじ]めた日[ひ]、すなわちユダの王[おう]ヨシヤの時代[じだい]から今日[きょう]まで、イスラエルとユダとすべての諸国民[しょこくみん]について語ったすべての言葉である。"
  3: "もしかれらが、わたしが彼らに行[おこな]おうと考[かんが]えているすべての災[わざわ]いを聞[き]いて、それぞれ悪[わる]い道[みち]から離[はな]れ返[かえ]るなら、わたしは彼らの不法[ふほう]と罪[つみ]を赦[ゆる]す。」"
  4: "そこでエレミヤは、ネリヤの子[こ]バルクを呼[よ]び、バルクはエレミヤの口[くち]から、主[しゅ]が彼に語[かた]ったすべての言葉[ことば]を巻物[まきもの]に書[か]き記[しる]した。"
  5: "エレミヤはバルクに命[めい]じて言[い]った。「わたしは監視[かんし]されていて、主[しゅ]の家[いえ]に入[はい]ることができない。"
  6: "だから、あなたは行[い]って、わたしの口[くち]からあなたが書き記[しる]したこの巻物[まきもの]を、断食[だんき]の日[ひ]に主[しゅ]の家[いえ]で民[たみ]の耳[みみ]に読[よ]み聞[き]かせよ。また、あなたはそれを、彼らの都[みやこ]々[みやこ]から来[く]るすべてのユダヤ人[じん]の耳にも読[よ]み聞[き]かせよ。"
  7: "もしかれらの祈[いの]りが主[しゅ]の前[まえ]に届[とど]き、彼らがそれぞれ悪[わる]い道[みち]から離[はな]れ返[かえ]るなら。主[しゅ]がこの民[たみ]に告[つ]げた怒[いか]りと憤[いきどお]りは大[おお]きいからである。」"
  8: "バルクは、主[しゅ]の家[いえ]で主の言葉[ことば]を巻物[まきもの]から読[よ]むために、エレミヤが自分[じぶん]に命[めい]じたすべてのことを行[おこな]った。"
  9: "ヨヤキム王[おう]の第五年[だいごねん]、第九[だいきゅう]の月[つき]に、エルサレムにいる民[たみ]すべてとユダの家[いえ]は、主[しゅ]の前[まえ]に断食[だんき]を布告[ふこく]した。"
  10: "そしてバルクは、主[しゅ]の家[いえ]で、書記[しょき]シャファンの子[こ]ガマリヤの家[いえ]にある部屋[へや]、すなわち上[うえ]の庭[にわ]にある、主[しゅ]の家の新[あたら]しい門[もん]の入口[いりぐち]で、民[たみ]すべての耳[みみ]に、巻物[まきもの]にあるエレミヤの言葉[ことば]を読[よ]み聞[き]かせた。"
  11: "シャファンの子[こ]ガマリヤの子[こ]ミカは、巻物[まきもの]から主[しゅ]のすべての言葉[ことば]を聞[き]いた。"
  12: "彼は王[おう]の家[いえ]にある書記[しょき]の部屋[へや]へ下[お]りて行[い]った。すると、そこにはすべての君[きみ]たちが座[すわ]っていた。書記[しょき]エリシャマ、シェレミヤの子[こ]デラヤ、アハボルの子[こ]エルナタン、シャファンの子[こ]ガマリヤ、ハナニヤの子[こ]ゼデキヤ、およびすべての君たちである。"
  13: "ミカは、バルクが民[たみ]に読[よ]み聞[き]かせたとき耳[みみ]にしたすべての言葉[ことば]を、彼らに告[つ]げた。"
  14: "そこで君[きみ]たちはみな、クシの子[こ]シェレミヤの子[こ]ナタニヤの子[こ]ユディンをバルクのもとへ遣[つか]わして言[い]った。「あなたが民[たみ]の耳[みみ]に読[よ]んでいる巻物[まきもの]を、手[て]に取[と]って来[き]なさい。」そこでバルクは巻物を手に取り、彼らのもとへ下[お]りて行[い]った。"
  15: "彼らはバルクに言[い]った。「もう一度[いちど]、わたしたちの耳[みみ]に読[よ]み聞[き]かせなさい。」するとバルクは彼らの耳に読み聞かせた。"
  16: "彼らはすべての言葉[ことば]を聞[き]くと、互[たが]いに相談[そうだん]してバルクに言[い]った。「わたしたちは、これらのすべての言葉を必[かなら]ず王[おう]に告[つ]げよう。」"
  17: "そして、バルクに尋[たず]ねて言[い]った。「どうして、これらのすべての言葉[ことば]を書[か]き記[しる]したのか。」"
  18: "バルクは彼らに言[い]った。「エレミヤがその口[くち]でわたしにこれらのすべての言葉[ことば]を告[つ]げ、わたしがそれを巻物[まきもの]に書[か]き記[しる]した。」"
  19: "君[きみ]たちはバルクに言[い]った。「あなたとエレミヤは行[い]って身[み]を隠[かく]せ。どこにいるか、だれにも知[し]られるな。」"
  20: "そして彼らは王[おう]のもとへ、庭[にわ]へ入[はい]って行[い]き、巻物[まきもの]は書記[しょき]エリシャマの家[いえ]に預[あず]けておき、すべての言葉[ことば]を王に告[つ]げた。"
  21: "王[おう]はユディンを遣[つか]わして巻物[まきもの]を取[と]りに行[い]かせ、彼はそれをエリシャマの家[いえ]から取って来[き]た。そしてユディンは王[おう]の耳[みみ]に、また王のそばに立[た]つすべての君[きみ]たちの耳にそれを読[よ]んだ。"
  22: "王[おう]は冬[ふゆ]の家[いえ]に座[すわ]っていた。その前[まえ]には火[ひ]の入[はい]った火鉢[ひばち]があった。"
  23: "ユディンが三枚[さんまい]、四枚[よまい]の紙[かみ]を読[よ]み終[お]えるたびに、王[おう]は書記[しょき]の小刀[こがたな]でそれを切[き]り取[と]り、火鉢[ひばち]の火[ひ]に投[な]げ入[い]れた。ついに巻物[まきもの]はすべて、火鉢の火の中[なか]で消[き]え去[さ]った。"
  24: "王[おう]も、これらのすべての言葉[ことば]を聞[き]いたすべての家来[けらい]たちも、恐[おそ]れず、衣[ころも]を裂[さ]きもしなかった。"
  25: "エルナタンとデラヤとガマリヤとゲダルヤは、巻物[まきもの]を焼[や]かないようにと王[おう]に懇願[こんがん]したが、王は聞[き]き入[い]れなかった。"
  26: "王[おう]は、王[おう]の子[こ]イエラメエル、エズリエルの子[こ]セラヤ、アブデエルの子[こ]シェレミヤに命[めい]じて、書記[しょき]バルクと預言者[よげんしゃ]エレミヤを捕[つか]まえさせた。しかし、主[しゅ]は彼らを隠[かく]された。"
  27: "王[おう]が、バルクがエレミヤの口[くち]から書き記[しる]したすべての言葉[ことば]を巻物[まきもの]ごと焼[や]き払[はら]った後[あと]、主[しゅ]の言葉[ことば]がエレミヤに臨[のぞ]んで言[い]った。"
  28: "「もう一度[いちど]、あなたは別[べつ]の巻物[まきもの]を取[と]り、ヨヤキム王[おう]が焼[や]いた前[まえ]の巻物にあったすべての言葉[ことば]を書[か]き記[しる]せ。"
  29: "そしてヨヤキム王[おう]について言[い]え。主[しゅ]はこう言[い]われる。『あなたはこの巻物[まきもの]を焼[や]いて、「なぜ、そこに、バビロンの王[おう]は必[かなら]ず来[き]てこの地[ち]を滅[ほろ]ぼし、人[ひと]も家畜[かちく]も絶[た]えると書[か]いたのか」と言[い]った。"
  30: "それゆえ、ユダの王[おう]ヨヤキムについて、主[しゅ]はこう言[い]われる。彼にはダビデの王座[おうざ]に座[すわ]る者[もの]がない。その死体[したし]は昼[ひる]の暑[あつ]さと夜[よる]の霜[しも]の上[うえ]に投[な]げ捨[す]てられる。"
  31: "わたしは彼とその子孫[しそん]とそのしもべたちを罰[ばっ]し、彼らと、エルサレムに住[す]む者[もの]とユダの地[ち]に、わたしが彼らに告[つ]げたすべての災[わざわ]いを下[くだ]す。彼らは聞[き]かなかったからである。』」"
  32: "そこでバルクは別[べつ]の巻物[まきもの]を取[と]り、エレミヤの口[くち]から、ヨヤキムが焼[や]いた巻物のすべての言葉[ことば]を書き記[しる]した。そして、これらに加[くわ]えて、以前[いぜん]よりも多[おお]くの言葉が付け加[くわ]えられた。"

notes:
  1: "ἐν τῷ ἐνιαυτῷ τῷ τετάρτῳ Ιωακιμ υἱοῦ Ιωσια βασιλέως Ιουδα — «в четвёртый год Иоакима, сына Иосии, царя Иудейского»; ἐγενήθη λόγος κυρίου πρός με λέγων. Слав. «в лето четвертое иоакима, сына иосиина». Надписание; далее слово Господа."
  2: "Λαβὲ σεαυτῷ χαρτίον βιβλίου — «возьми себе лист книги» (χαρτίον — папирус, 書き物; слав. «свиток книжный»); γράψον ἐπ' αὐτοῦ πάντας τοὺς λόγους — «напиши на нём все слова»; οὓς ἐχρημάτισα πρὸς σὲ — «которые Я изрёк тебе» (χρηματίζω — возвещать, давать оракул); ἐπὶ Ιερουσαλημ καὶ ἐπὶ Ιουδαν καὶ ἐπὶ πάντα τὰ ἔθνη — «об Иерусалиме, и об Иуде, и о всех народах»; слав. читает «на израиля и на иуду и на вся языки» — в тексте по csl (イスラエル), LXX отмечен; ἀφ' ἧς ἡμέρας λαλήσαντός μου πρός σε — «с того дня, как Я начал говорить тебе»."
  3: "ἴσως ἀκούσεται ὁ οἶκος Ιουδα — «может быть, услышит дом Иудин» (ἴσως — может быть, ср. 33:3); πάντα τὰ κακά, ἃ ἐγὼ λογίζομαι ποιῆσαι αὐτοῖς — «все бедствия, которые Я замышляю сделать им» (λογίζομαι); ἵνα ἀποστρέψωσιν ἀπὸ ὁδοῦ... πονηρᾶς; ἵλεως ἔσομαι ταῖς ἀδικίαις καὶ ταῖς ἁμαρτίαις — «буду милостив к неправдам и грехам» (ἵλεως — милостивый). Здесь закрывается слово Господа."
  4: "ἐκάλεσεν Ιερεμιας τὸν Βαρουχ υἱὸν Νηριου — «призвал Иеремия Варуха, сына Нирии» (バルク、ネリヤ); ἔγραψεν ἀπὸ στόματος Ιερεμιου — «написал из уст Иеремии»; εἰς χαρτίον βιβλίου — «в лист книги». Слав. «вписа варух от уст иеремииных вся словеса Господня»."
  5: "Ἐγὼ φυλάσσομαι — «я стерегом (под стражей)» (φυλάσσω — стеречь); οὐ μὴ δύνωμαι εἰσελθεῖν εἰς οἶκον κυρίου — «не могу войти в дом Господень». Слав. «мене стрегут, и не могу внити в дом Господень». С этих слов речь пророка к Варуху (5–7)."
  6: "ἀναγνώσῃ ἐν τῷ χαρτίῳ τούτῳ εἰς τὰ ὦτα τοῦ λαοῦ — «прочитаешь в этом свитке вслух народа» (εἰς τὰ ὦτα — в уши, вслух); ἐν ἡμέρᾳ νηστείας — «в день поста»; ἐν ὠσὶ παντὸς Ιουδα τῶν ἐρχομένων ἐκ πόλεως αὐτῶν — «в уши всех Иудеев, приходящих из городов их»."
  7: "ἴσως πεσεῖται ἔλεος αὐτῶν κατὰ πρόσωπον κυρίου — «может быть, падёт моление их пред лицом Господним» (ἔλεος здесь — моление о милости, слав. «молитва их»); ἀποστρέψουσιν ἐκ τῆς ὁδοῦ αὐτῶν τῆς πονηρᾶς; μέγας ὁ θυμὸς καὶ ἡ ὀργὴ κυρίου — «велик гнев и ярость Господня» (θυμός, ὀργή); ἣν ἐλάλησεν ἐπὶ τὸν λαὸν τοῦτον. Здесь речь пророка закрывается."
  8: "ἐποίησεν Βαρουχ κατὰ πάντα, ἃ ἐνετείλατο αὐτῷ Ιερεμιας — «сделал Варух по всему, что заповедал ему Иеремия»; τοῦ ἀναγνῶναι ἐν τῷ βιβλίῳ λόγους κυρίου ἐν οἴκῳ κυρίου — «чтобы прочитать в книге слова Господни в доме Господнем»."
  9: "ἐν τῷ ἔτει τῷ ὀγδόῳ — «в восьмой год» (LXX); слав./ru читают «в пятое лето» (по МТ) — в тексте по csl (第五年), LXX отмечен здесь. ἐξεκλησίασαν νηστείαν — «созвали (объявили) пост» (ἐκκλησιάζω — собирать собрание); ἐν τῷ μηνὶ τῷ ἐνάτῳ — «в девятый месяц»; πᾶς ὁ λαὸς ἐν Ιερουσαλημ καὶ οἶκος Ιουδα — «весь народ в Иерусалиме и дом Иуды»."
  10: "ἐν οἴκῳ Γαμαριου υἱοῦ Σαφαν τοῦ γραμματέως — «в доме Гамарии, сына Сафана, писца» (書記; Σαφαν — シャファン по корпусу 4 Цар 22 и ier_36; в ier_33 стоит シャファン — расхождение внутри книги); ἐν τῇ αὐλῇ τῇ ἐπάνω — «во дворе верхнем» (上の庭); ἐν προθύροις πύλης τοῦ οἴκου κυρίου τῆς καινῆς — «в преддверии новых ворот дома Господня» (πρόθυρον — преддверие)."
  11: "Μιχαιας υἱὸς Γαμαριου υἱοῦ Σαφαν — «Михей, сын Гамарии, сына Сафана» (ミカ — не пророк Михей, а сын Гамарии); ἤκουσεν... ἅπαντας τοὺς λόγους κυρίου ἐκ τοῦ βιβλίου — «услышал все слова Господни из книги»."
  12: "κατέβη εἰς οἶκον τοῦ βασιλέως εἰς τὸν οἶκον τοῦ γραμματέως — «сошёл в дом царя, в дом писца»; Ελισαμα ὁ γραμματεύς — エリシャマ; Δαλαιας υἱὸς Σελεμιου — デラヤ; Ελναθαν υἱὸς Ακχοβωρ — エルナタン、アハボルの子; Γαμαριας υἱὸς Σαφαν — ガマリヤ; Σεδεκιας υἱὸς Ανανιου — ゼデキヤ、ハナニヤの子."
  13: "ἀνήγγειλεν αὐτοῖς Μιχαιας πάντας τοὺς λόγους, οὓς ἤκουσεν ἀναγινώσκοντος τοῦ Βαρουχ — «возвестил им Михей все слова, которые слышал, когда читал Варух» (родительный самостоятельный); εἰς τὰ ὦτα τοῦ λαοῦ — «вслух народа»."
  14: "τὸν Ιουδιν υἱὸν Ναθανιου υἱοῦ Σελεμιου υἱοῦ Χουσι — «Иегудия, сына Нафании, сына Селемии, сына Хусии» (ユディン — от Ιουδιν, евр. Иегудий; ナタニヤ, シェレミヤ, クシ); τὸ χαρτίον, ἐν ᾧ σὺ ἀναγινώσκεις — «свиток, в котором ты читаешь»; λαβὲ αὐτὸ εἰς τὴν χεῖρά σου καὶ ἧκε — «возьми его в руку твою и приди»."
  15: "Πάλιν ἀνάγνωθι εἰς τὰ ὦτα ἡμῶν — «снова прочитай вслух нас» (πάλιν — опять, снова); ru (МТ) «сядь, и прочитай» — иное чтение."
  16: "συνεβουλεύσαντο ἕκαστος πρὸς τὸν πλησίον αὐτοῦ — «совещались каждый с ближним своим»; Ἀναγγέλλοντες ἀναγγείλωμεν — «возвещая возвестим» (усиление); слав. добавляет «варуху» при «реша» — нет в LXX, внесено (バルクに). В gr-lxx-byz стих полный, лакуны модуля здесь нет («точка» 36:16 стоит в gr 36 = слав. 29, другой главе)."
  17: "Πόθεν ἔγραψας πάντας τοὺς λόγους τούτους; — «откуда (как) ты написал все слова сии?»; ἐρώτησαν — «спросили»."
  18: "Ἀπὸ στόματος αὐτοῦ ἀνήγγειλέν μοι Ιερεμιας — «из уст его возвестил мне Иеремия»; ἔγραφον ἐν βιβλίῳ — «я писал в книге» (имперфект, о процессе); ru (МТ) добавляет «чернилами» — нет в LXX."
  19: "Βάδισον κατακρύβηθι, σὺ καὶ Ιερεμιας — «иди, скройся, ты и Иеремия» (κατακρύβω — скрывать); ἄνθρωπος μὴ γνώτω ποῦ ὑμεῖς — «пусть человек не знает, где вы»."
  20: "εἰσῆλθον πρὸς τὸν βασιλέα εἰς τὴν αὐλήν — «вошли к царю во двор»; τὸ χαρτίον ἔδωκαν φυλάσσειν ἐν οἴκῳ Ελισαμα — «свиток отдали хранить в доме Елисама»; ἀνήγγειλαν... πάντας τοὺς λόγους."
  21: "ἀπέστειλεν ὁ βασιλεὺς τὸν Ιουδιν λαβεῖν τὸ χαρτίον — «послал царь Иегудия взять свиток»; ἀνέγνω Ιουδιν εἰς τὰ ὦτα τοῦ βασιλέως — «читал Иегудий вслух царя»; τῶν ἑστηκότων περὶ τὸν βασιλέα — «стоявших около царя»."
  22: "ὁ βασιλεὺς ἐκάθητο ἐν οἴκῳ χειμερινῷ — «царь сидел в зимнем доме» (χειμερινός — зимний); ἐσχάρα πυρὸς κατὰ πρόσωπον αὐτοῦ — «жаровня огня пред лицом его» (ἐσχάρα — очаг, жаровня; 火鉢)."
  23: "ἀναγινώσκοντος Ιουδιν τρεῖς σελίδας καὶ τέσσαρας — «когда Иегудий прочитывал три листа и четыре» (σελίς — столбец, лист; 紙); ἀπέτεμνεν αὐτὰς τῷ ξυρῷ τοῦ γραμματέως — «отрезал их ножом писца» (ξυρόν — бритва, ножик; 小刀); ἔρριπτεν εἰς τὸ πῦρ τὸ ἐπὶ τῆς ἐσχάρας — «бросал в огонь на жаровне»; ἕως ἐξέλιπεν πᾶς ὁ χάρτης — «доколе не истребился весь свиток»."
  24: "οὐκ ἐζήτησαν — «не взыскали» (ζητέω; слав. «не ужасошася» — иное понимание, в тексте 恐れず); οὐ διέρρηξαν τὰ ἱμάτια αὐτῶν — «не разодрали одежд своих» (διαρρήγνυμι); ὁ βασιλεὺς καὶ οἱ παῖδες αὐτοῦ — «царь и отроки (слуги) его» (家来)."
  25: "Ελναθαν καὶ Γοδολιας καὶ Γαμαριας — в LXX три имени: Елнафан, Годолия, Гамария (ゲダルヤ); слав. добавляет «далеа» (Делаия) — четвёртое имя, внесено (エルナタン、デラヤ、ガマリヤ、ゴドリヤ); ru (МТ) даёт три имени без Годолии; ὑπέθεντο τῷ βασιλεῖ — «упрашивали (подстрекали) царя» (ὑποτίθημι); πρὸς τὸ μὴ κατακαῦσαι τὸ χαρτίον — «чтобы не сожигать свиток»."
  26: "ἐνετείλατο ὁ βασιλεὺς τῷ Ιερεμεηλ υἱῷ τοῦ βασιλέως καὶ τῷ Σαραια υἱῷ Εσριηλ — «повелел царь Иерамеилу, сыну царя, и Сераии, сыну Азриила» (イエラメエル, セラヤ, エズリエル); слав. добавляет третье имя «селемию сыну авдеилеву» и «но сокры я Господь» — нет в LXX, внесено (シェレミヤ、アブデエルの子; 主は彼らを隠された); συλλαβεῖν — «схватить»; κατεκρύβησαν — «скрылись»."
  27: "μετὰ τὸ κατακαῦσαι τὸν βασιλέα τὸ χαρτίον — «после того как царь сжёг свиток»; πάντας τοὺς λόγους οὓς ἔγραψεν Βαρουχ ἀπὸ στόματος Ιερεμιου — «все слова, которые написал Варух из уст Иеремии»; λέγων — вводит слово Господа (28–31)."
  28: "Πάλιν λαβὲ σὺ χαρτίον ἕτερον — «возьми себе опять другой лист (свиток)»; γράψον πάντας τοὺς λόγους τοὺς ὄντας ἐπὶ τοῦ χαρτίου — «напиши все слова, бывшие на свитке»; οὓς κατέκαυσεν ὁ βασιλεὺς Ιωακιμ — «которые сжёг царь Иоаким»."
  29: "καὶ ἐρεῖς — «и скажи» (Иоакиму); Σὺ κατέκαυσας τὸ χαρτίον τοῦτο λέγων — «ты сжёг свиток сей, говоря»; Εἰσπορευόμενος εἰσπορεύσεται ὁ βασιλεὺς Βαβυλῶνος — «входя войдёт царь Вавилонский» (усиление, «непременно придёт»); ἐξολεθρεύσει τὴν γῆν — «истребит землю»; ἐκλείψει ἀπ' αὐτῆς ἄνθρωπος καὶ κτήνη — «исчезнет с неё человек и скот»."
  30: "Οὐκ ἔσται αὐτῷ καθήμενος ἐπὶ θρόνου Δαυιδ — «не будет ему сидящего на престоле Давидовом» (θρόνος — престол, 王座); τὸ θνησιμαῖον αὐτοῦ ἔσται ἐρριμμένον — «труп его будет брошен» (θνησιμαῖον — труп; ῥίπτω); ἐν τῷ καύματι τῆς ἡμέρας καὶ ἐν τῷ παγετῷ τῆς νυκτός — «на зное дня и на морозе ночи» (καῦμα — зной; παγετός — мороз)."
  31: "ἐπισκέψομαι ἐπ' αὐτὸν καὶ ἐπὶ τὸ γένος αὐτοῦ καὶ ἐπὶ τοὺς παῖδας αὐτοῦ — «посещу его, и род его, и отроков его» (ἐπισκέπτομαι — посещать, взыскивать); ἐπάξω ἐπ' αὐτοὺς... πάντα τὰ κακά — «наведу на них... всё зло»; ἃ ἐλάλησα πρὸς αὐτοὺς καὶ οὐκ ἤκουσαν — «которое Я изрёк им, а они не послушали». Здесь закрываются 『…』 и 「…」."
  32: "ἔλαβεν Βαρουχ χαρτίον ἕτερον — «взял Варух другой лист (свиток)»; ἔγραψεν... ἅπαντας τοὺς λόγους τοῦ βιβλίου, οὗ κατέκαυσεν Ιωακιμ — «написал все слова книги, которую сжёг Иоаким»; ἔτι προσετέθησαν αὐτῷ λόγοι πλείονες ὡς οὗτοι — «ещё прибавились к нему слова многие, как эти» (LXX); слав. «еще приложишася ему словеса множайша неже первая» («больше прежних») — в тексте по csl, LXX отмечен здесь. ru (МТ) «много подобных тем слов»."
