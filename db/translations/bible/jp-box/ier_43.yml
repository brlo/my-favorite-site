# jp-box, Иеремия, глава 43. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для книги почти нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 43 = слав./ru 36: свиток Варуха и его сожжение. 1–3 слово Господа: взять
# книжный свиток и написать всё, что сказано от дней Иосии; 4–8 Варух пишет свиток
# из уст пророка и читает его в доме Господнем; 9–10 пост и чтение в доме Гамарии;
# 11–14 Михей и князья; 15–19 чтение князьям и вопросы Варуху; 20–21 свиток приносят
# к царю, Иегудий читает; 22–26 царь отрезает листы и сжигает свиток, пророка и писца
# ищут; 27–32 слово Господа: «возьми другой свиток», суд над Иоакимом, новый свиток.
# Голоса: 1 — вводная формула; 2–3 — 「…」 (слово Господа); 4 — авторский текст;
# 5–7 — 「…」 (речь пророка к Варуху); 8–13 — авторский текст; 14 — речь князей 「…」;
# 15–19 — «…» (краткие речи князей и Варуха); 20–27 — авторский текст; 28–31 — 「…»
# (слово Господа; в 29 слова царя — 「…」 внутри 『…』, так как это слово, которое
# пророк должен передать царю); 32 — авторский текст.
# Нумерация по gr: 32 стиха, совпадает со слав. 36:1–32 и ru. «Точек» в главе нет:
# ст. 16–20 в gr-lxx-byz полные (лакуны модуля здесь нет; «точки» 36:16–20 относятся
# к gr 36 = слав. 29, другой главе).
# 〔…〕 нет. Слав. расхождения и добавления внесены без скобок: 2 «на израиля» (LXX «об Иерусалиме»),
# 9 «в пятое лето» (LXX «в восьмой год»), 16 «варуху», 19 «князи», 25 четвёртое имя
# (Делаия), 26 третье имя (Селемия, сын Авдеила) и «но сокры я Господь»,
# 32 «множайша неже первая» (LXX «как эти»).
# Сносок ⟨…⟩ нет: 巻物, 書記, 断食, 火鉢, 王座, 家来 уже в корпусе.
# Имена: ヨヤキム, バルク, ネリヤ, ガマリヤ, シャファン (по корпусу 4 Цар 22 и по всей книге), ミカ, エリシャマ,
# デラヤ, エルナタン, アハボル, ゼデキヤ, ハナニヤ, ユディン (Ιουδιν), ナタニヤ,
# シェレミヤ, クシ, イエラメエル, セラヤ, エズリエル, アブデエル.

