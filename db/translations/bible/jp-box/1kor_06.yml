# jp-box, Первое послание к Коринфянам, глава 6. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 6: тяжбы у неверных (1–8), список неправедных (9–11),
# «всё мне позволено» и тело для Господа (12–20).
# Красного (<j>) и синего (<mo>) нет: прямой речи Христа в главе нет.
# 〔…〕: 6:20 — церковное окончание «и в душах ваших, яже суть Божия»;
# в gr-lxx-byz его нет (стих кончается ἐν τῷ σώματι ὑμῶν), поэтому в скобках.
# В 6:7 [οὖν] и в 6:16 [ἢ] стоят в базе — скобки не ставятся.
# Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

tr_code: jp-box
book: 1kor
chapter: 6
draft: true

verses:
  1: "あなたがたのうちに、兄弟[きょうだい]と争[あらそ]い事[ごと]がある者[もの]が、聖[せい]なる者[もの]たちの前[まえ]ではなく、不正[ふせい]な者[もの]たちの前[まえ]で裁[さば]きを求[もと]めるとは、何[なん]という大胆[だいたん]さであろうか。"
  2: "あなたがたは知[し]らないのか。聖[せい]なる者[もの]たちが世[よ]を裁[さば]くということを。もし世[よ]があなたがたによって裁[さば]かれるのなら、あなたがたは、この上[うえ]なく小[ちい]さな裁[さば]き事[ごと]さえ行[おこな]うに値[あたい]しない者[もの]なのか。"
  3: "あなたがたは知[し]らないのか。わたしたちが天[てん]使[し]たちを裁[さば]くということを。この世[よ]の生活[せいかつ]の事[こと]など、なおさらではないか。"
  4: "それで、もしこの世[よ]の生活[せいかつ]の事[こと]で裁[さば]きを求[もと]めるなら、あなたがたは、教会[きょうかい]の中[なか]で軽[かろ]んじられている者[もの]たちを、その裁判[さいばん]の座[ざ]に着[つ]かせるのか。"
  5: "あなたがたを恥[は]じさせるために言[い]う。あなたがたの間[あいだ]には、兄弟[きょうだい]の間[あいだ]の争[あらそ]いを裁[さば]き分[わ]けることのできる知恵[ちえ]ある者[もの]が、一人[ひとり]もいないのか。"
  6: "しかし、兄弟[きょうだい]が兄弟[きょうだい]を訴[うった]え、しかもそれを信[しん]じていない者[もの]たちの前[まえ]で行[おこな]うのか。"
  7: "そもそも、あなたがたが互[たが]いに訴[うった]え合[あ]うこと自体[じたい]が、すでにあなたがたの完全[かんぜん]な負[ま]けである。なぜ、むしろ不正[ふせい]を受[う]けることをしないのか。なぜ、むしろ奪[うば]い取[と]られることをしないのか。"
  8: "ところが、あなたがたは自分[じぶん]で不正[ふせい]を行[おこな]い、奪[うば]い取[と]り、しかもそれを兄弟[きょうだい]たちに対して行[おこな]っているのである。"
  9: "あなたがたは知[し]らないのか。不正[ふせい]を行[おこな]う者[もの]たちは神[かみ]の国[くに]を継[つ]ぐことがないということを。惑[まど]わされてはならない。淫[いん]らな行[おこな]いをする者[もの]も、偶像[ぐうぞう]を拝[おが]む者[もの]も、姦淫[かんいん]する者[もの]も、男娼[だんしょう]も、男色[だんしょく]をする者[もの]も、"
  10: "盗[ぬす]む者[もの]も、貪欲[どんよく]な者[もの]も、酒[さけ]に酔[よ]う者[もの]も、人[ひと]を罵[ののし]る者[もの]も、奪[うば]い取[と]る者[もの]も、神[かみ]の国[くに]を継[つ]ぐことはない。"
  11: "あなたがたの中[なか]にも、かつてはそのような者[もの]がいた。しかし、あなたがたは洗[あら]われた。しかし、聖[せい]とされた。しかし、義[ぎ]とされたのである。わたしたちの主[しゅ]イエス・キリストの名[な]によって、またわたしたちの神[かみ]の霊[れい]によって。"
  12: "すべてのことがわたしには許[ゆる]されている。しかし、すべてのことが益[えき]になるのではない。すべてのことがわたしには許[ゆる]されている。しかし、わたしは何[なに]ものにも支配[しはい]されない。"
  13: "食物[しょくもつ]は腹[はら]のため、腹[はら]は食物[しょくもつ]のためにある。しかし、神[かみ]はこの両方[りょうほう]を無[む]にされる。体[からだ]は淫[いん]らな行[おこな]いのためではなく、主[しゅ]のためであり、主[しゅ]も体[からだ]のためである。"
  14: "神[かみ]は主[しゅ]を復活[ふっかつ]させ、また、ご自身[じしん]の力[ちから]によってわたしたちをも復活[ふっかつ]させてくださる。"
  15: "あなたがたは知[し]らないのか。あなたがたの体[からだ]はキリストの肢[えだ]であるということを。それなら、キリストの肢[えだ]を取[と]って娼婦[しょうふ]の肢[えだ]にするのか。決[けっ]してそうではない。"
  16: "それとも、あなたがたは知[し]らないのか。娼婦[しょうふ]に結[むす]びつく者[もの]は、その者[もの]と一[ひと]つの体[からだ]であるということを。「二人[ふたり]は一[ひと]つの肉[にく]となる」と聖書[せいしょ]に言[い]われているからである。"
  17: "しかし、主[しゅ]に結[むす]びつく者[もの]は、主[しゅ]と一[ひと]つの霊[れい]となるのである。"
  18: "淫[いん]らな行[おこな]いを避[さ]けなさい。人[ひと]が犯[おか]す罪[つみ]は、どれも体[からだ]の外[そと]にある。しかし、淫[いん]らな行[おこな]いをする者[もの]は、自分[じぶん]の体[からだ]に対して罪[つみ]を犯[おか]すのである。"
  19: "あなたがたは知[し]らないのか。あなたがたの体[からだ]は、あなたがたの内[うち]に住[す]んでいる{聖霊[せいれい]|聖神[せいしん]}の神殿[しんでん]であり、その{聖霊[せいれい]|聖神[せいしん]}をあなたがたは神[かみ]から受[う]けている、ということを。そして、あなたがたは自分[じぶん]自身[じしん]のものではない。"
  20: "あなたがたは代価[だいか]を払[はら]って買[か]い取[と]られたのである。だから、あなたがたの体[からだ]で神[かみ]に栄光[えいこう]を帰[き]しなさい。〔また、あなたがたの霊[れい]によっても。体[からだ]も霊[れい]も神[かみ]のものだからである。〕"

notes:
  1: "Τολμᾷ — 大胆さ; риторический вопрос сохранён. ἐπὶ τῶν ἀδίκων / ἐπὶ τῶν ἁγίων — 不正な者たちの前 / 聖なる者たちの前."
  2: "κριτήρια ἐλάχιστα — 最も小さな裁き事; ἀνάξιοι — 値しない者."
  3: "ἀγγέλους κρινοῦμεν — 天使たちを裁く; μήτιγε βιωτικά — ましてこの世の生活の事."
  4: "Ирония сохранена: τοὺς ἐξουθενημένους ἐν τῇ ἐκκλησίᾳ — 教会で軽んじられている者たち; вопрос, не утверждение. μὲν οὖν — それで."
  5: "πρὸς ἐντροπὴν ὑμῖν λέγω — あなたがたを恥じさせるために言う. διακρῖναι — 裁き分ける."
  6: "ἀλλὰ… καὶ τοῦτο ἐπὶ ἀπίστων — しかもそれを信じていない者たちの前で; вопрос сохранён."
  7: "ἥττημα — 完全な負け; две риторические вопросы с μᾶλλον — なぜ、むしろ…しないのか."
  9: "μαλακοί — 男娼; ἀρσενοκοῖται — 男色をする者; список не смягчён. οὐ κληρονομήσουσιν — 継ぐことはない. Стих обрывается на перечислении, как в греческом; сказуемое в 6:10."
  10: "Перечисление продолжается из 6:9; сказуемое одно на оба стиха."
  11: "Тройное ἀλλά сохранено тремя しかし. ἀπελούσασθε — 洗われた; ἡγιάσθητε — 聖とされた; ἐδικαιώθητε — 義とされた. πνεῦμα τοῦ θεοῦ — 神の霊, не 聖霊: в тексте нет ἅγιον (ср. Рим 8:9)."
  12: "Коринфские лозунги (πάντα μοι ἔξεστιν) повторены дважды, как в греческом, без кавычек; ἀλλά — しかし."
  13: "τὰ βρώματα τῇ κοιλίᾳ — 食物は腹のため. καταργήσει — 無にされる. τὸ σῶμα οὐ τῇ πορνείᾳ ἀλλὰ τῷ κυρίῳ — 体は淫らな行いのためではなく主のため."
  14: "ἐξεγερεῖ — 復活させてくださる (буд.); διὰ τῆς δυνάμεως αὐτοῦ — ご自身の力によって."
  15: "μέλη Χριστοῦ — キリストの肢. μὴ γένοιτο — 決してそうではない."
  16: "Быт 2:24 в 「」. ἓν σῶμά ἐστιν — 一つの体; εἰς σάρκα μίαν — 一つの肉 (ср. Мк 10:8 — 一つの肉, в Мф 19:5 — 一体; здесь сохранён переход тело/плоть/дух в 6:17)."
  17: "ἓν πνεῦμά ἐστιν — 一つの霊."
  18: "φεύγετε — 避けなさい. ἐκτὸς τοῦ σώματός ἐστιν — 体の外にある; εἰς τὸ ἴδιον σῶμα ἁμαρτάνει — 自分の体に対して罪を犯す."
  19: "ναὸς τοῦ ἁγίου πνεύματος — 聖霊の神殿; ἅγιον πνεῦμα → {聖霊|聖神}. οὐκ ἐστὲ ἑαυτῶν — 自分自身のものではない."
  20: "В критической базе стих кончается ἐν τῷ σώματι ὑμῶν; церковный текст (Елизаветинская «и в душах ваших, яже суть Божия», jp-joc) добавляет «и в душах ваших» —〔また、あなたがたの霊によっても。体も霊も神のものだからである。〕. ἠγοράσθητε τιμῆς — 代価を払って買い取られた."
