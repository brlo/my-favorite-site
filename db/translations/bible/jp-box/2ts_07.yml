verses:
  1: "王[おう]が自分[じぶん]の家[いえ]に住[す]むようになり、主[しゅ]が四方[しほう]のすべての敵[てき]から彼[かれ]に安[やす]らぎを与[あた]えておられたとき、"
  2: "王[おう]は預言者[よげんしゃ]ナタンに言[い]った。「見[み]よ、わたしは杉[すぎ]の家[いえ]に住[す]んでいるのに、神[かみ]の箱[はこ]は天幕[てんまく]の中[なか]に置[お]かれている。」"
  3: "ナタンは王[おう]に言[い]った。「あなたの心[こころ]にあることは何[なに]でも、行[い]ってそのとおりにしなさい。主[しゅ]があなたとともにおられるからだ。」"
  4: "その夜[よる]、主[しゅ]の言葉[ことば]がナタンに臨[のぞ]んで言[い]った。"
  5: "『行[い]って、わたしのしもべダビデに言[い]いなさい。主[しゅ]はこう言われる。あなたがわたしの住[す]むための家[いえ]を建[た]てるのではない。"
  6: "わたしは、イスラエルの子[こ]らをエジプトから導[みちび]き上[あ]げた日[ひ]から今日[きょう]まで、家[いえ]に住[す]んだことがない。かえって、天幕[てんまく]と幕屋[まくや]を渡[わた]り歩[ある]いていた。"
  7: "わたしがイスラエルのすべてとともに歩[あゆ]んだすべての所[ところ]で、わたしはイスラエルの一[ひと]つの部族[ぶぞく]にでも、なぜ、わたしに杉[すぎ]の家[いえ]を建[た]てないのかと言[い]ったことがあるか。"
  8: "今[いま]、わたしのしもべダビデにこう言[い]いなさい。万軍[ばんぐん]の主[しゅ]はこう言われる。わたしはあなたを羊[ひつじ]の囲[かこ]いから取[と]って、わたしの民[たみ]イスラエルの上[うえ]に立[た]つ者[もの]とした。"
  9: "わたしはあなたが行[い]くすべての所[ところ]であなたとともにいた。あなたの前[まえ]からすべての敵[てき]を滅[ほろ]ぼし、あなたの名[な]を、地上[ちじょう]の大[おお]いなる者[もの]たちの名のように名高[なだか]くした。"
  10: "わたしはわたしの民[たみ]イスラエルのために場所[ばしょ]を定[さだ]め、彼[かれ]らを植[う]え付[つ]ける。彼らは自分[じぶん]たちの所[ところ]に落[お]ち着[つ]いて住[す]み、もはや心配[しんぱい]することもない。不正[ふせい]の子[こ]が、初[はじ]めのときのように彼らを卑[ひく]くすることも、もはやない。"
  11: "すなわち、わたしがわたしの民イスラエルの上[うえ]に裁[さば]き人[びと]たちを立[た]てた日[ひ]からそうである。わたしはあなたをすべての敵[てき]から安[やす]らかにする。主[しゅ]はあなたに、あなたが主のために家[いえ]を建[た]てることを告[つ]げる。"
  12: "あなたの日[ひ]々が満[み]ちて、あなたが父祖[ふそ]たちとともに眠[ねむ]るとき、わたしはあなたの後[あと]に、あなたの胎[たい]から出[で]るあなたの子孫[ししそん]を立[た]ち上[あ]がらせ、その王国[おうこく]を整[ととの]える。"
  13: "彼[かれ]がわたしの名[な]のために家[いえ]を建[た]てる。わたしは彼の王座[おうざ]を永遠[えいえん]に確[かた]くする。"
  14: "わたしは彼[かれ]の父[ちち]となり、彼はわたしの子[こ]となる。もし彼に不正[ふせい]が生[しょう]じるなら、わたしは人[ひと]の杖[つえ]と人の子たちの打[う]ち傷[きず]で彼を懲[こら]しめる。"
  15: "しかし、わたしは彼[かれ]からわたしの慈[いつく]しみを取[と]り去[さ]らない。わたしの前[まえ]から退[しりぞ]けた者[もの]たちから取り去ったようにはしない。"
  16: "彼[かれ]の家[いえ]と彼の王国[おうこく]は、わたしの前[まえ]で永遠[えいえん]に確[かた]くされ、彼の王座[おうざ]も永遠に堅[かた]く立[た]つ。』"
  17: "ナタンはこれらのすべての言葉[ことば]と、このすべての幻[まぼろし]のとおりに、ダビデに語[かた]った。"
  18: "ダビデ王[おう]は入[はい]って、主[しゅ]の前[まえ]に座[すわ]り、言[い]った。「わたしの主よ、主よ。わたしは何者[なにもの]か。わたしの家[いえ]は何[なん]か。あなたがわたしをここまで愛[あい]してくださるとは。"
  19: "そして、これはあなたの目[め]には小[ちい]さなことにすぎなかった。それなのに、あなたはあなたのしもべの家[いえ]について遠[とお]くまで語[かた]られた。わたしの主[しゅ]よ、主よ。これこそ人[ひと]の法[のり]である。"
  20: "ダビデはこれ以上[いじょう]、あなたに何[なに]を言[い]い足[た]せるだろうか。わたしの主[しゅ]よ、主よ。あなたはあなたのしもべを知[し]っておられる。"
  21: "あなたのしもべのゆえに、あなたは心[こころ]のままに、このすべての大[おお]いなることを行[おこな]い、あなたのしもべに知[し]らせてくださった。"
  22: "あなたの偉大[いだい]さのゆえに、わたしの主[しゅ]よ、主よ。わたしたちが耳[みみ]で聞[き]いたすべてのことにおいても、あなたのような方[かた]はなく、あなたのほかに神[かみ]はいない。"
  23: "地上[ちじょう]に、あなたの民[たみ]イスラエルのようなほかの民があるだろうか。神[かみ]がご自分[じぶん]のために民を贖[あがな]い出[だ]すために彼[かれ]を導[みちび]かれたのは、あなたがご自分のために名[な]を置[お]き、大[おお]いなることと輝[かがや]きを行[おこな]い、あなたがエジプトからご自分のために贖い出したあなたの民の前[まえ]から、諸国民[しょこくみん]とその住[す]まいを追[お]い出すためであった。"
  24: "あなたはあなたの民[たみ]イスラエルをご自分のために、永遠[えいえん]の民として備[そな]え、主[しゅ]よ、あなたは彼[かれ]らの神[かみ]となられた。"
  25: "わたしの主[しゅ]よ、主よ。あなたがあなたのしもべとその家[いえ]について語[かた]られたその言葉[ことば]を、永遠[えいえん]に確[かた]くしてください。万軍[ばんぐん]の主、イスラエルの神[かみ]よ。どうか、あなたが語られたとおりに行[おこな]ってください。"
  26: "あなたの名[な]が永遠[えいえん]に大[おお]いなるものとなり、人[ひと]々[びと]が『万軍[ばんぐん]の主[しゅ]はイスラエルの神[かみ]』と言[い]い、あなたのしもべダビデの家[いえ]があなたの前[まえ]に確[かた]くされるように。"
  27: "万軍[ばんぐん]の主[しゅ]、イスラエルの神[かみ]よ。あなたはあなたのしもべの耳[みみ]を開[ひら]き、『わたしはあなたのために家[いえ]を建[た]てる』と言[い]われた。それゆえ、あなたのしもべはこの祈[いのり]をあなたにささげる心[こころ]を得[え]た。"
  28: "わたしの主[しゅ]よ、主よ。あなたこそ神[かみ]であり、あなたの言葉[ことば]は真実[しんじつ]となる。あなたはあなたのしもべについて、これらの良[よ]いことを語[かた]られた。"
  29: "どうか、今[いま]、あなたのしもべの家[いえ]を祝福[しゅくふく]し、それが永遠[えいえん]にあなたの前[まえ]にあるようにしてください。わたしの主[しゅ]よ、主よ。あなたが語[かた]られたのだから。あなたの祝福によって、あなたのしもべの家は永遠に祝福され、あなたの前にあるように。」"

notes:
  1: "καὶ ἐγένετο ὅτε ἐκάθισεν — «и было, когда сел»; ἐκάθισεν — сел, воссел. κατεκληρονόμησεν — букв. «дал в наследие, унаследил» (слав. «унаследи»); по смыслу речи — даровал покой от врагов (ср. 7:11 ἀναπαύσω); в ru «успокоил» — по МТ. κύκλῳ … τῶν κύκλῳ — «окрест … окрестных» (повтор)."
  2: "Ναθαν τὸν προφήτην — Нафан пророк. Ἰδοὺ δή — «вот же». οἴκῳ κεδρίνῳ — дом кедровый (κέδρος — кедр; слав. «в дому кедрове»). κιβωτὸς τοῦ θεοῦ — ковчег Божий (契約の箱). κάθηται — «сидит, стоит»; ἐν μέσῳ τῆς σκηνῆς — посреди скинии (σκηνή — 天幕, 幕屋)."
  3: "Πάντα, ὅσα ἂν ἐν τῇ καρδίᾳ σου — всё, что в сердце твоём. βάδιζε καὶ ποίει — иди и делай. ὅτι κύριος μετὰ σοῦ — ибо Господь с тобою."
  4: "τῇ νυκτὶ ἐκείνῃ — в ту ночь. ἐγένετο ῥῆμα κυρίου — было слово Господне (обычная формула; слав. «бысть слово Господне»). λέγων — говоря."
  5: "Πορεύου — иди (императив). εἰπὸν πρὸς τὸν δοῦλόν μου Δαυιδ — скажи рабу Моему Давиду. Τάδε λέγει κύριος — «так говорит Господь» (пророческая формула). Οὐ σὺ οἰκοδομήσεις μοι οἶκον τοῦ κατοικῆσαί με — «не ты построишь Мне дом, чтобы Мне обитать [в нём]»; в ru «ты ли построишь» — вопросительная передача того же чтения. С этого стиха до 16 — слова Господа, переданные Нафаном: 『…』."
  6: "οὐ κατῴκηκα ἐν οἴκῳ — не обитал в доме. ἀφ᾽ ἧς ἡμέρας ἀνήγαγον — с того дня, как вывел. ἐμπεριπατῶν — «ходя внутри, странствуя»; ἐν καταλύματι καὶ ἐν σκηνῇ — «в обиталище и в скинии» (слав. «во обиталищи и в кущи»); κατάλυμα — временное жильё, σκηνή — шатёр (天幕と幕屋)."
  7: "ἐν πᾶσιν, οἷς διῆλθον ἐν παντὶ Ισραηλ — во всех [местах], где Я проходил со всем Израилем. εἰ λαλῶν ἐλάλησα — «сказал ли Я, говоря» (усиление). πρὸς μίαν φυλὴν τοῦ Ισραηλ — «к одному колену Израиля» (слав. «ко единому колену»); μία — «один, какой-либо». ᾧ ἐνετειλάμην ποιμαίνειν — которому повелел пасти. οἶκον κέδρινον — дом кедровый."
  8: "Τάδε λέγει κύριος παντοκράτωρ — «так говорит Господь Вседержитель» (万軍の主). Ἔλαβόν σε ἐκ τῆς μάνδρας τῶν προβάτων — взял тебя из овчей ограды (μάνδρα — загон). τοῦ εἶναί σε εἰς ἡγούμενον — чтобы ты был вождём (ἡγούμενος). ἐπὶ τὸν λαόν μου ἐπὶ τὸν Ισραηλ — над народом Моим, над Израилем."
  9: "ἤμην μετὰ σοῦ — был с тобою. ἐξωλέθρευσα — истребил (ἐξολεθρεύω). ἀπὸ προσώπου σου — от лица твоего. ἐποίησά σε ὀνομαστόν — сделал тебя именитым (ὀνομαστός). κατὰ τὸ ὄνομα τῶν μεγάλων τῶν ἐπὶ τῆς γῆς — как имя великих на земле."
  10: "θήσομαι τόπον — поставлю, устрою место. καταφυτεύσω — насажу (καταφυτεύω). κατασκηνώσει καθ᾽ ἑαυτὸν — «поселится сам по себе» (слав. «вселятся о себе сами»). οὐ μεριμνήσει οὐκέτι — не будет более заботиться. υἱὸς ἀδικίας — «сын неправды», нечестивый. ταπεινῶσαι — унизить, притеснить. καθὼς ἀπ᾽ ἀρχῆς — как от начала."
  11: "ἀπὸ τῶν ἡμερῶν, ὧν ἔταξα κριτάς — от дней, когда поставил судей (продолжение 10). ἀναπαύσω σε — дам тебе покой. ἀπαγγελεῖ σοι κύριος — возвестит тебе Господь. ὅτι οἶκον οἰκοδομήσεις αὐτῷ — «что ты построишь дом Ему» (так в LXX и слав.; в ru и МТ «Он устроит тебе дом»)."
  12: "ἐὰν πληρωθῶσιν αἱ ἡμέραι σου — когда исполнятся дни твои. κοιμηθήσῃ μετὰ τῶν πατέρων σου — почиешь с отцами. ἀναστήσω τὸ σπέρμα σου — восставлю семя твоё. ὃς ἔσται ἐκ τῆς κοιλίας σου — который будет из чрева твоего (子孫). ἑτοιμάσω τὴν βασιλείαν — уготовлю царство."
  13: "αὐτὸς οἰκοδομήσει μοι οἶκον τῷ ὀνόματί μου — он построит Мне дом имени Моему. ἀνορθώσω — утвержу, восстановлю (слав. «управлю»). ἕως εἰς τὸν αἰῶνα — до века."
  14: "ἐγὼ ἔσομαι αὐτῷ εἰς πατέρα — Я буду ему отцом. ἐὰν ἔλθῃ ἡ ἀδικία αὐτοῦ — если придёт неправда его, т. е. если согрешит. ἐλέγξω — обличу, накажу. ἐν ῥάβδῳ ἀνδρῶν — жезлом мужей. ἐν ἁφαῖς υἱῶν ἀνθρώπων — «язвами сынов человеческих» (ἁφή — касание, удар, язва; слав. «язвами»)."
  15: "τὸ ἔλεός μου οὐκ ἀποστήσω — милости Моей не отниму. ἀφ᾽ ὧν ἀπέστησα ἐκ προσώπου μου — «от тех, которых Я отставил от лица Моего»; в LXX и слав. имени Саула нет, в ru «от Саула» — по МТ."
  16: "πιστωθήσεται — будет утверждён, верен (πιστόω). ἐνώπιον ἐμοῦ — предо Мною. ἀνωρθωμένος — утверждённый, поставленный прямо. В LXX и слав. «дом его» (3-е л.), в ru «дом твой» — по МТ."
  17: "κατὰ πάντας τοὺς λόγους τούτους — по всем словам этим. ὅρασις — видение (幻). οὕτως ἐλάλησεν — так сказал."
  18: "εἰσῆλθεν … ἐκάθισεν ἐνώπιον κυρίου — вошёл и сел пред Господом. Τίς εἰμι ἐγώ — кто я. κύριέ μου κύριε — «Господи мой, Господи» (обращение, повтор). ἠγάπηκάς με ἕως τούτων — «возлюбил меня до сего», т. е. так возвеличил; слав. «возлюбил мя еси даже до сих». С 18 по 29 — молитва Давида: 「…」."
  19: "κατεσμικρύνθη μικρὸν ἐνώπιόν σου — «умалилось малое пред Тобою», т. е. показалось малым. ἐλάλησας … εἰς μακράν — говорил вдаль, о будущем. οὗτος ὁ νόμος τοῦ ἀνθρώπου — «сей закон человека» (слав.); тёмное место, в ru «это уже по-человечески». κύριέ μου κύριε — повтор обращения."
  20: "τί προσθήσει Δαυιδ ἔτι τοῦ λαλῆσαι — что ещё прибавит Давид говорить. σὺ οἶδας τὸν δοῦλόν σου — Ты знаешь раба Твоего."
  21: "διὰ τὸν λόγον σου — «ради слова Твоего» (LXX); в csl «раба твоего ради» — принято церковное чтение. κατὰ τὴν καρδίαν σου — по сердцу Твоему. μεγαλωσύνη — величие. γνωρίσαι — показать, дать знать."
  22: "ἕνεκεν τοῦ μεγαλῦναί σε — «ради возвеличения Тебя» (слав. «величия ради твоего»). οὐκ ἔστιν ὡς σύ — нет как Ты. οὐκ ἔστιν θεὸς πλὴν σοῦ — нет Бога кроме Тебя. ἐν πᾶσιν, οἷς ἠκούσαμεν ἐν τοῖς ὠσὶν ἡμῶν — во всём, что слышали ушами нашими."
  23: "τίς ὡς ὁ λαός σου Ισραηλ ἔθνος ἄλλο ἐν τῇ γῇ — кто как народ Твой Израиль, иной народ на земле. ὡς ὡδήγησεν αὐτὸν ὁ θεός — как Бог вёл его. τοῦ λυτρώσασθαι αὐτῷ λαόν — чтобы искупить Себе народ. τοῦ θέσθαι σε ὄνομα — «положить Тебе имя», т. е. утвердить имя. μεγαλωσύνη καὶ ἐπιφάνεια — величие и явление (слав. «величие и просвещение»). ἐκβαλεῖν … ἔθνη καὶ σκηνώματα — изгнать народы и их жилища (σκήνωμα; слав. «языки и селения»)."
  24: "ἡτοίμασας σεαυτῷ τὸν λαόν — уготовал Себе народ. λαὸν ἕως αἰῶνος — народ до века. ἐγένου αὐτοῖς εἰς θεόν — стал им Богом."
  25: "πίστωσον — утверди (πιστόω). ἕως αἰῶνος — до века. κύριε παντοκράτωρ θεὲ τοῦ Ισραηλ — Господи Вседержитель, Боже Израилев. καὶ νῦν καθὼς ἐλάλησας — «и ныне, как Ты сказал»; в csl добавлено «сотвори» (сделай) — внесено в основной текст, в LXX этого слова нет."
  26: "μεγαλυνθείη τὸ ὄνομά σου — да возвеличится имя Твоё. В LXX только эта половина стиха; вторая половина («Господь Вседержитель — Бог над Израилем, и дом раба Твоего Давида да будет утверждён пред Тобою») есть в csl и следует МТ — внесена в основной текст без 〔…〕, в LXX её нет."
  27: "ἀπεκάλυψας τὸ ὠτίον — открыл ухо (слав. «отверзл еси ухо»), т. е. открыл, возвестил. Οἶκον οἰκοδομήσω σοι — «дом созижду тебе» (слова Бога в молитве Давида: 『…』). εὗρεν … τὴν καρδίαν ἑαυτοῦ — «обрете сердце своё», т. е. решился. προσευχή — молитва."
  28: "σὺ εἶ ὁ θεός — Ты Бог. οἱ λόγοι σου ἔσονται ἀληθινοί — слова Твои будут истинны. τὰ ἀγαθὰ ταῦτα — эти блага."
  29: "ἄρξαι καὶ εὐλόγησον — «начни и благослови» (гебраистический оборот; передано «благослови»). τοῦ εἶναι εἰς τὸν αἰῶνα ἐνώπιόν σου — чтобы быть вовеки пред Тобою. ὅτι σύ εἶ … ἐλάλησας — ибо Ты … сказал. ἀπὸ τῆς εὐλογίας σου εὐλογηθήσεται — от благословения Твоего благословится. В csl в конце добавлено «еже быти во век пред тобою» — внесено в основной текст, в LXX этого повтора нет."
