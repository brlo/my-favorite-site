# jp-box, 2-я Царств, глава 7. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); по новому паритету церковнославянский (csl-ru) —
# второй свидетель церковного текста: его чтения и добавления входят в основной
# текст без 〔…〕, отличия LXX — в notes. ru (Синодальный) — только для понимания.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 7: пророчество Натана о доме и престоле. 1–3 — намерение Давида,
# 4–16 — слово Господа Натану (『…』), 17 — пересказ Давиду, 18–29 — молитва
# Давида (「…»); в 26 — слова народа 『…』, в 27 — слово Бога 『…』.
# Красного нет.
# 〔…〕 нет: csl-добавления (7:25 «сотвори», 7:26 вторая половина стиха,
# 7:29 «еже быти во век пред тобою») внесены в основной текст, см. notes.
# Сносок ⟨…⟩ нет: 預言者, 契約の箱, 天幕, 幕屋, 燔祭 уже в корпусе.
# Отличия LXX/csl: 7:1 κατεκληρονόμησεν — «дал в наследие» (слав. «унаследи»),
# по смыслу — даровал покой; 7:11 в LXX и csl «ты построишь дом Ему», в ru/МТ
# «Он устроит тебе дом»; 7:15 в LXX/csl нет имени Саула; 7:16 в LXX/csl 3-е лицо
# («дом его»), в ru 2-е («дом твой»); 7:21 в LXX «ради слова Твоего», в csl
# «раба Твоего ради». jp-ni не использовался.

