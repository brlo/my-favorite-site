# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0.
# Псалом 79: молитва о Пастыре Израиля (1–3), «доколе» и хлеб слёз (4–6),
# припев-рефрен (7), притча о виноградной лозе (8–13), просьба посетить её (14–16),
# рука на «сыне человеческом» и обет не отступать (17–19).
# Красного и синего нет. Прямой речи нет: кавычек в главе нет.
# 〔…〕 нет: всё переведено по gr-lxx-byz, добавлений Церкви не вносилось.
# セラ (διάψαλμα, в конце ст. 7) не передаётся — по решению пользователя, как у jp-joc.
# Сносок ⟨…⟩ нет: ケルビム уже пояснено в корпусе (Евр 9:5), 万軍, 嗣業 — термины корпуса.
