verses:
  0: "指揮者[しきしゃ]に。変[か]えられる者[もの]たちについて。アサフへの証[あかし]、アッシリア人[じん]についての詩[うた]。"
  1: "イスラエルを牧[ぼく]する方[かた]よ、耳[みみ]を傾[かたむ]けてください。ヨセフを羊[ひつじ]のように導[みちび]く方[かた]、ケルビムの上[うえ]に座[すわ]る方[かた]よ、現[あらわ]れてください。"
  2: "エフライムとベニヤミンとマナセの前[まえ]に、あなたの力[ちから]を起[お]こし、来[き]てわたしたちを救[すく]ってください。"
  3: "神[かみ]よ、わたしたちを立[た]ち返[かえ]らせ、あなたの御顔[みかお]を輝[かがや]かせてください。そうすれば、わたしたちは救[すく]われます。"
  4: "万軍[ばんぐん]の神[かみ]、主[しゅ]よ、いつまで、あなたの僕[しもべ]の祈[いの]りに怒[いか]られるのか。"
  5: "あなたはわたしたちに涙[なみだ]のパンを食[た]べさせ、量[はか]りを決[き]めて涙[なみだ]を飲[の]ませられるのか。"
  6: "あなたはわたしたちを、隣[となり]の人[ひと]々[びと]の争[あらそ]いの種[たね]とし、わたしたちの敵[てき]はわたしたちを嘲[あざけ]った。"
  7: "万軍[ばんぐん]の神[かみ]、主[しゅ]よ、わたしたちを立[た]ち返[かえ]らせ、あなたの御顔[みかお]を輝[かがや]かせてください。そうすれば、わたしたちは救[すく]われます。"
  8: "あなたはエジプトからぶどうの木[き]を移[うつ]し、諸国[しょこく]の民[たみ]を追[お]い出[だ]して、それを植[う]えられた。"
  9: "あなたはその前[まえ]に道[みち]を備[そな]え、その根[ね]を深[ふか]く植[う]え付[つ]け、地[ち]はそれで満[み]ちた。"
  10: "その陰[かげ]は山[やま]々[やま]を覆[おお]い、その枝[えだ]は神[かみ]の杉[すぎ]の木[き]を覆[おお]った。"
  11: "それはその枝[えだ]を海[うみ]まで、そのひこばえを川[かわ]まで伸[の]ばした。"
  12: "なぜ、あなたはその垣[かき]を取[と]り壊[こわ]し、道[みち]を通[とお]る者[もの]がみな、それを摘[つ]み取[と]るにまかせられたのか。"
  13: "森[もり]の猪[いのしし]がそれを荒[あ]らし、野[の]の獣[けもの]がそれを食[く]い尽[つ]くした。"
  14: "万軍[ばんぐん]の神[かみ]よ、どうか立[た]ち返[かえ]ってください。天[てん]から目[め]を注[そそ]ぎ、見[み]て、このぶどうの木[き]を顧[かえり]みてください。"
  15: "あなたの右[みぎ]の手[て]が植[う]えたその木[き]を、そして、あなたがご自分[じぶん]のために強[つよ]くされた人[ひと]の子[こ]を、整[ととの]え直[なお]してください。"
  16: "それは火[ひ]に焼[や]かれ、掘[ほ]り返[かえ]された。あなたの御顔[みかお]のとがめによって、彼[かれ]らは滅[ほろ]びる。"
  17: "あなたの手[て]が、あなたの右[みぎ]の手[て]の人[ひと]の上[うえ]に、あなたがご自分[じぶん]のために強[つよ]くされた人[ひと]の子[こ]の上[うえ]にあるようにしてください。"
  18: "そうすれば、わたしたちはあなたから離[はな]れない。わたしたちを生[い]かしてください。そうすれば、わたしたちはあなたの名[な]を呼[よ]び求[もと]めます。"
  19: "万軍[ばんぐん]の神[かみ]、主[しゅ]よ、わたしたちを立[た]ち返[かえ]らせ、あなたの御顔[みかお]を輝[かがや]かせてください。そうすれば、わたしたちは救[すく]われます。"

notes:
  0: "Εἰς τὸ τέλος, ὑπὲρ τῶν ἀλλοιωθησομένων· μαρτύριον τῷ Ασαφ, ψαλμὸς ὑπὲρ τοῦ Ἀσσυρίου — 指揮者に。変えられる者たちについて。アサフへの証、アッシリア人についての詩 (Εἰς τὸ τέλος — 指揮者に, как в Пс 4, 44; ἀλλοιωθησομένων — «имеющих измениться», слав. «о изменшихся»; μαρτύριον — 証; ὑπὲρ τοῦ Ἀσσυρίου — アッシリア人について, как в надписании Пс 75). Надписание — стих 0."
  1: "Ὁ ποιμαίνων τὸν Ισραηλ, πρόσχες — イスラエルを牧する方よ、耳を傾けてください (ποιμαίνω — 牧する). ὁ ὁδηγῶν ὡσεὶ πρόβατα τὸν Ιωσηφ — ヨセフを羊のように導く方 (ὁδηγέω — «водить»). ὁ καθήμενος ἐπὶ τῶν χερουβιν — ケルビムの上に座る方 (χερουβιν — ケルビム, Евр 9:5). ἐμφάνηθι — 現れてください (ἐμφανής — «явный»)."
  2: "ἐναντίον Εφραιμ καὶ Βενιαμιν καὶ Μανασση — エフライムとベニヤミンとマナセの前に (три колена, шедшие за ковчегом, ср. Числ 2:17–24). ἐξέγειρον τὴν δυναστείαν σου — あなたの力を起こし (δυναστεία — «могущество»). ἐλθὲ εἰς τὸ σῶσαι ἡμᾶς — 来てわたしたちを救ってください."
  3: "ὁ θεός, ἐπίστρεψον ἡμᾶς — 神よ、わたしたちを立ち返らせ (ἐπιστρέφω — «обращать»). ἐπίφανον τὸ πρόσωπόν σου — あなたの御顔を輝かせてください (ἐπιφαίνω — «озарять»). καὶ σωθησόμεθα — そうすれば、わたしたちは救われます. Рефрен повторён в 7 и 19 почти дословно."
  4: "κύριε ὁ θεὸς τῶν δυνάμεων — 万軍の神、主よ (δυνάμεις — 万軍, как в Пс 45:8). ἕως πότε ὀργίζῃ ἐπὶ τὴν προσευχὴν τοῦ δούλου σου — いつまで、あなたの僕の祈りに怒られるのか (ἐπί + дат. — «на, против»)."
  5: "ψωμιεῖς ἡμᾶς ἄρτον δακρύων — あなたはわたしたちに涙のパンを食べさせ (ψωμίζω — «кормить»; ἄρτος δακρύων — «хлеб слёз»). ποτιεῖς ἡμᾶς ἐν δάκρυσιν ἐν μέτρῳ — 量りを決めて涙を飲ませられるのか (ποτίζω — «поить»; ἐν μέτρῳ — «мерою», слав. «в меру»; Синодальный «в большой мере» — не по греч.)."
  6: "ἔθου ἡμᾶς εἰς ἀντιλογίαν τοῖς γείτοσιν ἡμῶν — わたしたちを隣の人々の争いの種とし (ἀντιλογία — «пререкание, предмет спора»). οἱ ἐχθροὶ ἡμῶν ἐμυκτήρισαν ἡμᾶς — 敵はわたしたちを嘲った (μυκτηρίζω — «издеваться»). διάψαλμα в конце ст. 7 не передаётся."
  7: "Рефрен ст. 3 с добавлением κύριε; в греческом здесь стоит διάψαλμα — не передаётся (как и везде, по решению пользователя)."
  8: "ἄμπελον ἐξ Αἰγύπτου μετῆρας — あなたはエジプトからぶどうの木を移し (ἄμπελος — ぶどうの木; μεταίρω — «переносить»). ἐξέβαλες ἔθνη καὶ κατεφύτευσας αὐτήν — 諸国の民を追い出して、それを植えられた (καταφυτεύω — «насаждать»)."
  9: "ὡδοποίησας ἔμπροσθεν αὐτῆς — その前に道を備え (ὁδοποιέω — «прокладывать путь, готовить место»). κατεφύτευσας τὰς ῥίζας αὐτῆς — その根を深く植え付け. ἐπλήσθη ἡ γῆ — 地はそれで満ちた."
  10: "ἐκάλυψεν ὄρη ἡ σκιὰ αὐτῆς — その陰は山々を覆い. αἱ ἀναδενδράδες αὐτῆς τὰς κέδρους τοῦ θεοῦ — その枝は神の杉の木を覆った (ἀναδενδράς — «побег, отпрыск»; κέδρος τοῦ θεοῦ — «кедры Божии», образ величия)."
  11: "ἐξέτεινεν τὰ κλήματα αὐτῆς ἕως θαλάσσης — その枝を海まで伸ばし (κλῆμα — «лоза, ветвь»). ἕως ποταμοῦ τὰς παραφυάδας αὐτῆς — そのひこばえを川まで (παραφυάς — «отпрыск, боковой побег»; ひこばえ — побег от корня)."
  12: "ἵνα τί καθεῖλες τὸν φραγμὸν αὐτῆς — なぜ、あなたはその垣を取り壊し (καθαιρέω — «разрушать»; φραγμός — «ограда»). τρυγῶσιν αὐτὴν πάντες οἱ παραπορευόμενοι τὴν ὁδόν — 道を通る者がみな、それを摘み取るにまかせられたのか (τρυγάω — «собирать виноград, обирать»)."
  13: "ἐλυμήνατο αὐτὴν σῦς ἐκ δρυμοῦ — 森の猪がそれを荒らし (λυμαίνομαι — «опустошать»; σῦς — «вепрь»). μονιὸς ἄγριος κατενεμήσατο αὐτήν — 野の獣がそれを食い尽くした (μονιός — «дикий зверь»; катенемомай — «поедать на пастбище»)."
  14: "ὁ θεὸς τῶν δυνάμεων, ἐπίστρεψον δή — 万軍の神よ、どうか立ち返ってください. ἐπίβλεψον ἐξ οὐρανοῦ καὶ ἰδὲ — 天から目を注ぎ、見て (ἐπιβλέπω — «призирать»). ἐπίσκεψαι τὴν ἄμπελον ταύτην — このぶどうの木を顧みてください (ἐπισκέπτομαι — «посещать, призирать»)."
  15: "καὶ κατάρτισαι αὐτήν, ἣν ἐφύτευσεν ἡ δεξιά σου — あなたの右手が植えたその木を整え直してください (καταρτίζω — «приводить в порядок, восстанавливать»). ἐπὶ υἱὸν ἀνθρώπου, ὃν ἐκραταίωσας σεαυτῷ — あなたがご自分のために強くされた人の子を (υἱὸς ἀνθρώπου — «сын человеческий»; ἐκραταίωσας — «укрепил»; у jp-joc «芽» — по образу лозы, здесь по греч. «человек/сын человеческий», мессианское чтение Церкви)."
  16: "ἐμπεπυρισμένη πυρὶ καὶ ἀνεσκαμμένη — それは火に焼かれ、掘り返された (ἐμπυρίζω — «сожигать»; ἀνασκάπτω — «разрывать, выкапывать»). ἀπὸ ἐπιτιμήσεως τοῦ προσώπου σου ἀπολοῦνται — あなたの御顔のとがめによって、彼らは滅びる (ἐπιτίμησις — «прещение»; переход от ед. ч. лозы к мн. ч. сохранён, как в греч.)."
  17: "γενηθήτω ἡ χείρ σου ἐπ᾽ ἄνδρα δεξιᾶς σου — あなたの手が、あなたの右手の人に…あるようにしてください (ἀνὴρ δεξιᾶς — «муж десницы», слав. «на мужа десницы Твоея»). ἐπὶ υἱὸν ἀνθρώπου, ὃν ἐκραταίωσας σεαυτῷ — あなたがご自分のために強くされた人の子に (повтор ст. 15 сохранён)."
  18: "καὶ οὐ μὴ ἀποστῶμεν ἀπὸ σοῦ — そうすれば、わたしたちはあなたから離れない (οὐ μή — усиленное отрицание). ζωώσεις ἡμᾶς — わたしたちを生かしてください (ζωόω — «оживлять»). τὸ ὄνομά σου ἐπικαλεσόμεθα — あなたの名を呼び求めます."
  19: "Рефрен ст. 3 и 7; здесь с κύριε. Глава кончается рефреном, как и начиналась молитва о восстановлении."
