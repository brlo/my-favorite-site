# jp-box, Иудифь, глава 4. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге нет; jp-ni (под авторским правом) не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 4: Израиль слышит о разорении (1–2), недавно вернувшиеся из плена (3),
# письма в Самарию и города (4), укрепления и запасы (5), письмо первосвященника
# Иоакима в Вефилию (6–7), исполнение (8), молитва и пост, вретище и пепел (9–12),
# Господь слышит (13), священники приносят всесожжение (14–15). Прямой речи нет;
# красного и синего нет.
# Нумерация по gr: 15 стихов; деление совпадает с csl.
# 〔…〕 нет: все стихи есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 神殿, 祭壇, 燔祭, 聖所, 粗布, 灰, 断食 уже в корпусе;
# 長老会 (γερουσία) — термин брифа.
# Имена — транслитерация греческого (LXX).

