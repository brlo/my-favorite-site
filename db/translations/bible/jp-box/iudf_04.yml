verses:
  1: "ユダに住[す]むイスラエルの子[こ]らは、アッシリアの王[おう]ネブカドネツァルの総大将[そうだいしょう]ホロフェルネスが諸国民[しょこくみん]に行[おこな]ったすべてのこと、すなわち、彼[かれ]がすべての聖所[せいしょ]を略奪[りゃくだつ]し、それらを滅[ほろ]びに渡[わた]したその様子[ようす]を聞[き]いた。"
  2: "彼[かれ]のゆえに、彼[かれ]らはひどく、ひどく恐[おそ]れ、エルサレムと、自分[じぶん]たちの神[かみ]である主[しゅ]の神殿[しんでん]のことで心[こころ]を乱[みだ]した。"
  3: "というのは、彼[かれ]らは捕囚[ほしゅう]から上[のぼ]って来[き]たばかりであり、ユダヤの民[たみ]すべてがつい先[さき]ごろ集[あつ]まり、また器[うつわ]と祭壇[さいだん]と家[いえ]が、冒涜[ぼうとく]から聖別[せいべつ]されていたからである。"
  4: "彼[かれ]らはサマリアの全[ぜん]領域[りょういき]と、コナ、ベトホロン、ベルマイン、エリコ、またホバ、アイソラ、サレムの谷[たに]に人[ひと]を遣[つか]わした。"
  5: "また、彼[かれ]らは高[たか]い山[やま]の頂[いただき]をすべて先[さき]に占[おさ]め、その中[なか]にある村々[むらむら]を城壁[じょうへき]で囲[かこ]み、戦[いくさ]の用意[ようい]のために食糧[しょくりょう]を蓄[たくわ]えた。彼[かれ]らの畑[はたけ]はつい先[さき]ごろ刈[か]り入[い]れられたばかりであったからである。"
  6: "また、大祭司[だいさいし]ヨヤキム──そのころエルサレムにいた者[もの]──は、エスドレロンの前[まえ]にあり、ドタンに近[ちか]い平野[へいや]の正面[しょうめん]にあるベトリアとベトメスタイムの住[す]む者[もの]たちに書[か]き送[おく]った。"
  7: "すなわち、山地[さんち]の上[のぼ]り口[ぐち]を押[お]さえるように、というのである。そこを通[とお]ってユダヤへの入口[いりぐち]となるからであり、また、上[のぼ]って来[く]る者[もの]たちを妨[さまた]げるのは容易[ようい]であった。上[のぼ]り道[みち]は狭[せま]く、二人[ふたり]の男[おとこ]がやっと通[とお]れるほどだったからである。"
  8: "イスラエルの子[こ]らは、大祭司[だいさいし]ヨヤキムと、エルサレムに座[すわ]っていたイスラエルの民[たみ]すべての長老会[ちょうろうかい]が命[めい]じたとおりに行[おこな]った。"
  9: "イスラエルの男[おとこ]はすべて、大[おお]きな熱意[ねつい]をもって神[かみ]に向[む]かって叫[さけ]び、大[おお]きな熱意[ねつい]をもって自分[じぶん]の魂[たましい]を低[ひく]くした。"
  10: "彼[かれ]ら自身[じしん]も、その妻[つま]たちも、その幼[おさな]い子[こ]らも、その家畜[かちく]も、また彼[かれ]らの寄留[きりゅう]の者[もの]、雇[やと]われ人[びと]、銀[ぎん]で買[か]い取[と]られた者[もの]も、すべて腰[こし]に粗布[あらぬの]を当[あ]てた。"
  11: "イスラエルの男[おとこ]も女[おんな]も子[こ]どもも、すなわちエルサレムに住[す]む者[もの]たちは皆[みな]、神殿[しんでん]の前[まえ]にひれ伏[ふ]し、自分[じぶん]の頭[あたま]に灰[はい]をまき、主[しゅ]の前[まえ]に自分[じぶん]の粗布[あらぬの]を広[ひろ]げた。"
  12: "また、祭壇[さいだん]に粗布[あらぬの]を掛[か]け、イスラエルの神[かみ]に向[む]かって、心[こころ]を一[ひと]つにして熱心[ねっしん]に、自分[じぶん]たちの幼[おさな]い子[こ]らを略奪[りゃくだつ]に、妻[つま]たちを分捕[ぶんど]りに、嗣業[しぎょう]の町々[まちまち]を滅[ほろ]びに、聖[せい]なるものを冒涜[ぼうとく]と嘲[あざ]けりに、諸国民[しょこくみん]の喜[よろこ]びの的[まと]に渡[わた]さないようにと叫[さけ]んだ。"
  13: "主[しゅ]は彼[かれ]らの声[こえ]を聞[き]き、彼[かれ]らの苦難[くなん]に目[め]を留[と]められた。民[たみ]はユダヤ全土[ぜんど]とエルサレムで、全能[ぜんのう]の主[しゅ]の聖所[せいしょ]の前[まえ]で、幾日[いくにち]も断食[だんじき]していた。"
  14: "大祭司[だいさいし]ヨヤキムと、主[しゅ]の前[まえ]に立[た]つ祭司[さいし]たちすべて、および主[しゅ]に奉仕[ほうし]する者[もの]たちは、腰[こし]に粗布[あらぬの]を帯[お]びて、絶[た]え間[ま]ない燔祭[はんさい]と、民[たみ]の誓願[せいがん]と自発[じはつ]の捧[ささ]げ物[もの]を献[ささ]げていた。"
  15: "また、彼[かれ]らの頭巾[ずきん]の上[うえ]には灰[はい]があった。彼[かれ]らは力[ちから]の限[かぎ]りを尽[つ]くして主[しゅ]に叫[さけ]び、イスラエルの家[いえ]すべてを善[よ]きために顧[かえり]みてくださるよう願[ねが]った。"

notes:
  1: "ἤκουσαν οἱ υἱοὶ Ισραηλ — услышали сыны Израиля; πάντα ὅσα ἐποίησεν — всё, что сделал (ὅσα при πάντα). ἀρχιστράτηγος — 総大将, главнокомандующий (слав. «вождоначалник» — редкое сложение). ἐσκύλευσεν — «обобрал, снял доспехи» (σκυλεύω; слав. «расхити»); τὰ ἱερά — святыни, святилища (ἱερόν), отсюда 聖所. εἰς ἀφανισμόν — «на уничтожение» (ἀφανισμός), слав. «во истребление»."
  2: "ἐφοβήθησαν σφόδρα σφόδρα — устрашились «весьма, весьма»: удвоение наречия сохранено. ἀπὸ προσώπου αὐτοῦ — «от лица его», т. е. из страха перед ним. ἐταράχθησαν — «пришли в смятение» (ταράσσω); предмет страха — Иерусалим и храм (ναός — 神殿) их Бога."
  3: "προσφάτως ἦσαν ἀναβεβηκότες ἐκ τῆς αἰχμαλωσίας — «недавно взошли из плена» (перфект при προσφάτως; слав. «недавно изыдоша от пленения»). νεωστὶ ... συνελέλεκτο — «недавно собрался» (плюсквамперфект от συλλέγω). ἐκ τῆς βεβηλώσεως ἡγιασμένα ἦν — «от осквернения были освящены» (βεβήλωσις, ἁγιάζω): речь о сосудах, жертвеннике и доме."
  4: "ἀπέστειλαν — послали [людей] (подразумевается); ὅριον — предел, область. αὐλὼν Σαλημ — «долина (ущелье) Салим» (αὐλών); слав. «юдоль салимская». Имена по LXX: Κωνα — コナ (слав. «конии»), Βαιθωρων — ベトホロン, Βελμαιν — ベルマイン, Ιεριχω — エリコ, Χωβα — ホバ, Αισωρα — アイソラ."
  5: "προκατελάβοντο — «заняли заранее» (προκαταλαμβάνω); ἐτείχισαν — «обнесли стеной» (τειχίζω). παρέθεντο εἰς ἐπισιτισμὸν εἰς παρασκευὴν πολέμου — «положили в продовольствие для приготовления войны» (ἐπισιτισμός — снабжение пищей); τεθερισμένα — «сжаты» (θερίζω, перфект пассив; слав. «пожата»)."
  6: "ὁ ἱερεὺς ὁ μέγας — «великий священник», т. е. первосвященник (大祭司); слав. «иерей великий». ὃς ἦν ἐν ταῖς ἡμέραις — «бывший в те дни» (в японском вставка в тире). ἥ ἐστιν ἀπέναντι Εσδρηλων — относительное к Βαιτομεσθαιμ (ж. р.): エスドレロン (слав. «есдрилоиа»), Δωθαιμ — ドタン. κατὰ πρόσωπον τοῦ πεδίου — «напротив равнины»."
  7: "λέγων διακατασχεῖν — «говоря: удержать»: инфинитив при глаголе письма, поэтому в японском косвенная речь (…ように). αἱ ἀναβάσεις τῆς ὀρεινῆς — «восходы нагорной страны» (ἀνάβασις); εἴσοδος — вход; εὐχερῶς — «легко». στενῆς τῆς προσβάσεως οὔσης — genitivus absolutus «так как подъём узок»; ἐπ᾿ ἄνδρας τοὺς πάντας δύο — «всего на двух мужей», слав. добавляет «(проити)»."
  8: "καθὰ συνέταξεν — «как повелел» (συντάσσω). ἡ γερουσία παντὸς δήμου Ισραηλ — «старейшинство всего народа Израиля» (γερουσία — 長老会); οἳ ἐκάθηντο ἐν Ιερουσαλημ — «которые сидели (пребывали) в Иерусалиме». Слав. «старейшинство всего сонма израилева»."
  9: "ἀνεβόησαν — «возопили» (ἀναβοάω); ἐν ἐκτενείᾳ μεγάλῃ — «в великом усердии» (ἐκτένεια), повторено дважды, как в греческом. ἐταπείνωσαν τὰς ψυχὰς αὐτῶν — «смирили души свои» (ταπεινόω), слав. «смириша душы своя»."
  10: "Перечисление: αὐτοί, жёны, νήπια (младенцы), κτήνη (скот). πᾶς πάροικος καὶ μισθωτὸς καὶ ἀργυρώνητος — «всякий пришлец, наёмник и купленный за серебро» (ἀργυρώνητος, слав. «сребром купленый»). ἐπέθεντο σάκκους ἐπὶ τὰς ὀσφύας — «возложили вретища на чресла» (σάκκος — 粗布, ὀσφύς — чресла)."
  11: "ἔπεσον κατὰ πρόσωπον τοῦ ναοῦ — «пали пред лицом храма»; ἐσποδώσαντο τὰς κεφαλάς — «посыпали головы пеплом» (σποδόω; σποδός — 灰, слав. «перстию»). ἐξέτειναν τοὺς σάκκους — «разостлали вретища» (ἐκτείνω); κατὰ πρόσωπον κυρίου — «пред лицом Господа»."
  12: "περιέβαλον — «облекли» (περιβάλλω); ὁμοθυμαδὸν ἐκτενῶς — «единодушно усердно». διαρπαγή — расхищение, προνομή — добыча (слав. «пленение»), ἀφανισμός — уничтожение, βεβήλωσις — осквернение (冒涜), ὀνειδισμός — поношение, ἐπίχαρμα — «предмет радости, посмешище» (слав. «обрадование»). Цель выражена оборотом τοῦ μὴ δοῦναι — «чтобы не предать»."
  13: "εἰσήκουσεν τῆς φωνῆς — «услышал голос» (генитив при ἀκούω); εἰσεῖδεν τὴν θλῖψιν — «призрел на скорбь» (θλῖψις). ἦν ὁ λαὸς νηστεύων — «народ постился» (описательный оборот). κατὰ πρόσωπον τῶν ἁγίων — «пред лицом святынь» (ἅγια — 聖所); παντοκράτωρ — Вседержитель."
  14: "οἱ παρεστηκότες ἐνώπιον κυρίου ἱερεῖς — «предстоящие пред Господом священники»; οἱ λειτουργοῦντες — «служащие» (λειτουργέω, 奉仕). περιεζωσμένοι τὰς ὀσφύας — «препоясав чресла» (περιζώννυμι). ἡ ὁλοκαύτωσις τοῦ ἐνδελεχισμοῦ — «всесожжение постоянное» (ἐνδελεχισμός — непрестанность; слав. «непрестанное»). εὐχαί — обеты, ἑκούσια δόματα — добровольные дары."
  15: "κιδάρεις — кидары, головные уборы (κίδαρις; слав. «кидари»), отсюда 頭巾. σποδός — пепел (灰). ἐκ πάσης δυνάμεως — «от всей силы»; εἰς ἀγαθὸν ἐπισκέψασθαι — «посетить во благо» (ἐπισκέπτομαι), слав. «да посетит во благо». πᾶν οἶκον Ισραηλ — «весь дом Израиля»."
