verses:
  1: "一行[いっこう]がエルサレムに近[ちか]づき、オリーブ山[やま]のふもとのベツファゲに来[き]たとき、イエスは二人[ふたり]の弟子[でし]を遣[つか]わして、"
  2: "言[い]われた。「<j>向[む]こうの村[むら]へ行[い]きなさい。すぐに、ろばがつながれ、子[こ]ろばも一緒[いっしょ]にいるのが見[み]つかる。それらをほどいて、わたしのところへ連[つ]れて来[き]なさい。</j>"
  3: "<j>だれかが何[なに]か言[い]って来[き]たら、『主[しゅ]がお必要[ひつよう]としているのです』と答[こた]えなさい。そう言[い]えば、すぐに渡[わた]してくれる。</j>」"
  4: "これは、預言者[よげんしゃ]によって語[かた]られた言葉[ことば]が成就[じょうじゅ]するためであった。こう言[い]われている。"
  5: "「『シオンの娘[むすめ]に告[つ]げよ。見[み]よ、あなたの王[おう]が、柔和[にゅうわ]な者[もの]として、ろばに乗[の]り、荷[に]を負[お]う者[もの]の子[こ]である子[こ]ろばに乗[の]って、あなたのもとへ来[こ]られる。』」"
  6: "弟子[でし]たちは出[で]かけて行[い]き、イエスに言[い]われたとおりのことをした。"
  7: "そして、ろばと子[こ]ろばを連[つ]れて来[き]、その上[うえ]に自分[じぶん]の服[ふく]をかけた。イエスはその上[うえ]にお乗[の]りになった。"
  8: "群衆[ぐんしゅう]の大[だい]部分[ぶぶん]は自分[じぶん]の服[ふく]を道[みち]に敷[し]き、ほかの者[もの]たちは木[き]の枝[えだ]を切[き]って道[みち]に敷[し]いた。"
  9: "前[まえ]を行[ゆ]く群衆[ぐんしゅう]も後[あと]に従[したが]う群衆[ぐんしゅう]も叫[さけ]んだ。「ダビデの子[こ]にホサナ⟨「救[すく]ってください」の意[い]。⟩。主[しゅ]の名[な]によって来[こ]られる方[かた]に祝福[しゅくふく]があるように。いと高[たか]き所[ところ]にホサナ。」"
  10: "イエスがエルサレムに入[はい]られると、都[みやこ]全体[ぜんたい]が騒[さわ]ぎ立[た]ち、「この人[ひと]はだれか」と言[い]った。"
  11: "群衆[ぐんしゅう]は言[い]った。「ガリラヤのナザレから来[き]た預言者[よげんしゃ]イエスである。」"
  12: "イエスは神殿[しんでん]の境内[けいだい]に入[はい]り、境内[けいだい]で売[う]り買[か]いしている者[もの]をすべて追[お]い出[だ]し、両替人[りょうがえにん]の台[だい]と鳩[はと]を売[う]る者[もの]の腰掛[こしか]けをひっくり返[かえ]された。"
  13: "そして、彼[かれ]らに言[い]われた。「<j>『わたしの家[いえ]は祈[いの]りの家[いえ]と呼[よ]ばれる』と書[か]いてある。しかし、あなたがたはそれを強盗[ごうとう]の巣[す]にしている。</j>」"
  14: "境内[けいだい]では、盲人[もうじん]や足[あし]の不自由[ふじゆう]な人[ひと]たちがイエスのところへ来[き]た。イエスは彼[かれ]らを癒[いや]された。"
  15: "祭司長[さいしちょう]たちや律法学者[りっぽうがくしゃ]たちは、イエスが行[おこな]われた不思議[ふしぎ]なわざと、境内[けいだい]で「ダビデの子[こ]よ、ホサナ」と叫[さけ]んでいる子供[こども]たちを見[み]て、腹[はら]を立[た]て、"
  16: "イエスに言[い]った。「この者[もの]たちが何[なに]と言[い]っているか、聞[き]こえますか。」イエスは言[い]われた。「<j>聞[き]いている。『幼[おさな]い者[もの]と乳飲[ちの]み子[ご]の口[くち]から、あなたは讃美[さんび]を備[そな]えられた』と書[か]いてあるのを、まだ読[よ]んだことがないのか。</j>」"
  17: "イエスは彼[かれ]らを残[のこ]して都[みやこ]の外[そと]へ出[で]て、ベタニアへ行[い]き、そこで夜[よ]を過[す]ごされた。"
  18: "夜[よ]が明[あ]けると、イエスは都[みやこ]へ戻[もど]る道[みち]すがら腹[はら]を空[す]かせておられた。"
  19: "道端[みちばた]にいちじくの木[き]が一本[いっぽん]あるのを見[み]て、そばに寄[よ]られたが、葉[は]のほかには何[なに]も見[み]つからなかった。そこで、イエスはその木[き]に言[い]われた。「<j>今[いま]から後[のち]、いつまでもお前[まえ]に実[み]がならないように。</j>」すると、いちじくの木[き]はたちまち枯[か]れた。"
  20: "弟子[でし]たちはこれを見[み]て驚[おどろ]き、「いちじくの木[き]が、どうしてこんなに早[はや]く枯[か]れたのですか」と言[い]った。"
  21: "イエスはお答[こた]えになって言[い]われた。「<j>はっきりあなたがたに言[い]っておく。もし信仰[しんこう]があって疑[うたが]わなければ、このいちじくの木[き]にしたことを、ただそれだけにとどめず、この山[やま]に向[む]かって『動[うご]いて海[うみ]に飛[と]び込[こ]め』と言[い]っても、そのとおりになる。</j>"
  22: "<j>また、祈[いの]りの中で求[もと]めるものは何[なん]でも、信[しん]じるなら、受[う]け取[と]るのである。</j>」"
  23: "イエスが神殿[しんでん]の境内[けいだい]で教[おし]えておられると、祭司長[さいしちょう]たちと民[たみ]の長老[ちょうろう]たちがそばへ来[き]て、「あなたは何[なん]の権威[けんい]によってこうしたことをしているのか。その権威[けんい]をあなたに与[あた]えたのはだれか」と問[と]いかけた。"
  24: "イエスはお答[こた]えになって言[い]われた。「<j>わたしも一言[ひとこと]、あなたがたに尋[たず]ねよう。それに答[こた]えるなら、わたしが何[なん]の権威[けんい]でこのようなことをするのか、あなたがたに言[い]おう。</j>"
  25: "<j>ヨハネの洗礼[せんれい]は、どこから出[で]たものか。天[てん]からか、それとも人[ひと]からか。</j>」彼[かれ]らは互[たが]いに論[ろん]じ合[あ]った。「『天[てん]からだ』と言[い]えば、『では、なぜ彼[かれ]を信[しん]じなかったのか』と言[い]うだろう。"
  26: "だが『人[ひと]からだ』と言[い]おうものなら、群衆[ぐんしゅう]が恐[こわ]い。民[たみ]はこぞってヨハネを預言者[よげんしゃ]と見[み]ているからだ。」"
  27: "そこで、彼[かれ]らはイエスに「分[わ]かりません」と答[こた]えた。イエスも言[い]われた。「<j>それなら、わたしも、何[なん]の権威[けんい]でこのようなことをするのか、あなたがたに言[い]うまい。</j>」"
  28: "「<j>あなたがたはどう思[おも]うか。ある人[ひと]に二人[ふたり]の息子[むすこ]がいた。父[ちち]は兄[あに]のところへ行[い]って言[い]った。『子[こ]よ、今日[きょう]、ぶどう園[えん]へ行[い]って働[はたら]きなさい。』</j>"
  29: "<j>兄[あに]は『いや、行[い]きません』と断[ことわ]ったものの、あとで心[こころ]を変[か]えて出[で]かけて行[い]った。</j>"
  30: "<j>父[ちち]は次[つぎ]の息子[むすこ]のところへも行[い]って、同[おな]じことを言[い]った。次男[じなん]は『お父[とう]さん、行[い]きます』と答[こた]えたが、行[い]かなかった。</j>"
  31: "<j>二人[ふたり]のうち、どちらが父[ちち]の思[おも]いを行[おこな]ったのか。</j>」彼[かれ]らは言[い]った。「兄[あに]です。」イエスは言[い]われた。「<j>はっきりあなたがたに言[い]っておく。徴税人[ちょうぜいにん]や娼婦[しょうふ]たちが、あなたがたより先[さき]に神[かみ]の国[くに]に入[はい]る。</j>"
  32: "<j>ヨハネは義[ぎ]の道[みち]を歩[あゆ]んであなたがたのところへ来[き]たのに、あなたがたは彼[かれ]を信[しん]じなかった。しかし、徴税人[ちょうぜいにん]や娼婦[しょうふ]たちは彼[かれ]を信[しん]じた。あなたがたはそれを見[み]ても、後[あと]で思[おも]い直[なお]して彼[かれ]を信[しん]じようとしなかった。</j>」"
  33: "「<j>別[べつ]のたとえを聞[き]きなさい。家[いえ]の主人[しゅじん]が、ぶどう園[えん]を造[つく]って垣[かき]で囲[かこ]み、その中[なか]に搾[しぼ]り場[ば]を掘[ほ]り、見張[みは]りやぐらを建[た]て、農夫[のうふ]たちに貸[か]してから、遠[とお]くへ旅立[たびだ]った。</j>"
  34: "<j>収穫[しゅうかく]の時[とき]が近[ちか]づくと、主人[しゅじん]は自分[じぶん]の僕[しもべ]たちを農夫[のうふ]たちのところへ送[おく]って、収穫[しゅうかく]の分[ぶん]を受[う]け取[と]らせようとした。</j>"
  35: "<j>ところが、農夫[のうふ]たちは僕[しもべ]たちを捕[つか]まえ、一人[ひとり]は打[う]ちたたき、一人[ひとり]は殺[ころ]し、一人[ひとり]は石[いし]で打[う]ち殺[ころ]した。</j>"
  36: "<j>主人[しゅじん]はまた、前[まえ]よりも多[おお]くの僕[しもべ]たちを送[おく]ったが、農夫[のうふ]たちは同[おな]じように扱[あつか]った。</j>"
  37: "<j>最後[さいご]に、主人[しゅじん]は『わたしの息子[むすこ]なら敬[うやま]うだろう』と言[い]って、息子[むすこ]を送[おく]った。</j>"
  38: "<j>ところが、農夫[のうふ]たちは息子[むすこ]を見[み]ると、互[たが]いに言[い]った。『あれは跡取[あとと]りだ。さあ、殺[ころ]して、財産[ざいさん]を手[て]に入[い]れよう。』</j>"
  39: "<j>そして、ぶどう園[えん]の外[そと]へ息子[むすこ]を引[ひ]きずり出[だ]し、そこで殺[ころ]してしまった。</j>"
  40: "<j>それでは、このぶどう園[えん]の主人[しゅじん]が戻[もど]って来[き]たなら、あの農夫[のうふ]たちをどう扱[あつか]うだろうか。</j>」"
  41: "彼[かれ]らは言[い]った。「その悪[わる]い者[もの]たちを容赦[ようしゃ]なく滅[ほろ]ぼし、ぶどう園[えん]は、季節[きせつ]になると収穫[しゅうかく]を納[おさ]めるほかの農夫[のうふ]たちに貸[か]すでしょう。」"
  42: "イエスは言[い]われた。「<j>あなたがたは、『家[いえ]を建[た]てる者[もの]たちが捨[す]てた石[いし]が、隅[すみ]の親石[おやいし]となった。これは主[しゅ]がなさったことで、わたしたちの目[め]には不思議[ふしぎ]である』と聖書[せいしょ]に書[か]いてあるのを、読[よ]んだことがないのか。</j>"
  43: "<j>だから、あなたがたに言[い]う。神[かみ]の国[くに]はあなたがたから取[と]り上[あ]げられ、その実[み]を結[むす]ぶ民[たみ]に与[あた]えられる。</j>"
  44: "〔<j>この石[いし]の上[うえ]に倒[たお]れる者[もの]は砕[くだ]かれ、この石[いし]がその上[うえ]に落[お]ちる者[もの]は粉々[こなごな]にされる。</j>〕」"
  45: "祭司長[さいしちょう]たちとファリサイ派[は]の人々[ひとびと]は、イエスのたとえを聞[き]いて、自分[じぶん]たちのことを言[い]っているのだと悟[さと]った。"
  46: "イエスを捕[つか]まえようとしたものの、群衆[ぐんしゅう]を恐[おそ]れて手[て]を出[だ]せなかった。人々[ひとびと]がイエスを預言者[よげんしゃ]と見[み]なしていたからである。"

notes:
  9: "Ὡσαννά — «спаси же»; оставлено как литургическое ホサナ, сноска при первом упоминании в Мф (в Мк 11:9 уже была)."
  16: "Цитата Пс 8:3 (по LXX: ἐκ στόματος νηπίων καὶ θηλαζόντων)."
  42: "Цитата Пс 118:22-23. κεφαλὴ γωνίας — «глава угла», краеугольный камень; передал 隅の親石, как в Мк 12:10."
  44: "В критической базе стих в квадратных скобках (западное опускание); Церковь читает его (jp-joc), поэтому целиком в 〔〕."
