# jp-box, Иезекииль, глава 47. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 47 (совпадает; см. карту 20/21).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: 1–12 — поток из-под храма: вода выходит из-под основания храма к востоку,
# течёт мимо жертвенника, муж с мерной вервью ведёт пророка: тысяча локтей — «вода
# отпущения», ещё тысяча — до колен, ещё — до чресл, далее не перейти; вода исцеляет
# море, множество рыбы, рыболовы от Ен-Гадди до Ен-Еглаима, болота остаются солёными;
# на берегах деревья, листья не вянут, плоды не оскудевают, вода из святилища, плоды
# в пищу, рост во исцеление; 13–23 — границы земли: двенадцать колен, «прибавление
# верви» (Иосифу два удела — по МТ, в LXX иначе); север, восток, юг, запад; раздел
# по жребию вместе с пришельцами, родившими детей в Израиле.
# Голоса: 1–7 — повествование, в 6 короткая речь Господа в 「…」; 8–12 — речь Господа
# в 「…」 (после «и сказал мне»); 13 — формула «так говорит Господь Бог» вне кавычек,
# 13б–23 — слово Господа в 「…」 (закрывается в 23 на формуле «говорит Господь Бог»).
# «Точек» (лакун) в главе нет.
# Термины: 神殿[しんでん] — οἶκος; 祭壇[さいだん] — θυσιαστήριον; キュビト — πῆχυς;
# 赦[ゆる]しの水[みず] — ὕδωρ ἀφέσεως (тёмное место, буквально); 癒[いや]す — ὑγιάζω;
# 漁師[りょうし] — ἁλεεύς; 網[あみ]を干[ほ]す所[ところ] — ψυγμὸς σαγηνῶν; 初穂[はつほ] —
# ἀπαρχή; 嗣業[しぎょう] — κληρονομία; 寄留者[きりゅうしゃ] — προσήλυτος;
# 土着[どちゃく]の者[もの] — αὐτόχθων; 測[はか]り縄[なわ] — σχοινίσμα.
# Имена: ハマト, ダマスコ, セダダ, ベロタ, セブライム, エリアム, サウナン, アウラニティス,
# ギレアデ, ヨルダン川[がわ], テマン, マリモト・カデス, エナン, エン・ガディ,
# エン・エグライム, ガリラヤ, アラビア.
