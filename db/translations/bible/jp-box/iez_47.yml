verses:
  1: "彼[かれ]はわたしを神殿[しんでん]の入口[いりぐち]へ連[つ]れて行[い]った。見[み]よ、水[みず]が神殿[しんでん]の覆[おお]いのない所[ところ]の下[した]から東[ひがし]へ流[なが]れ出[で]ていた。神殿[しんでん]の正面[しょうめん]が東[ひがし]に面[めん]していたからである。水[みず]は右[みぎ]の側[がわ]から、南[みなみ]から祭壇[さいだん]へと下[くだ]って行[い]った。"
  2: "彼[かれ]はわたしを北[きた]に面[めん]した門[もん]の道[みち]から連[つ]れ出[だ]し、外[そと]の道[みち]を巡[めぐ]らせて、東[ひがし]に面[めん]した庭[にわ]の門[もん]へ行[い]かせた。見[み]よ、水[みず]は右[みぎ]の側[がわ]から流[なが]れ下[くだ]っていた。"
  3: "その人[ひと]が真[ま]っ直[す]ぐ前[まえ]へ出[で]て行[ゆ]くとき、その手[て]に測[はか]り縄[なわ]があった。彼[かれ]はその縄[なわ]で千[せん]キュビトを測[はか]り、わたしを水[みず]の中[なか]を渡[わた]らせた。水[みず]は赦[ゆる]しの水[みず]であった。"
  4: "また千[せん]キュビトを測[はか]り、わたしを水[みず]の中[なか]を渡[わた]らせた。水[みず]は膝[ひざ]に達[たっ]した。また千[せん]キュビトを測[はか]り、水[みず]は腰[こし]に達[たっ]した。"
  5: "また千[せん]キュビトを測[はか]った。しかし、わたしは渡[わた]ることができなかった。水[みず]が奔流[ほんりゅう]のとどろきのように荒[あ]れ狂[くる]い、渡[わた]ることのできない川[かわ]になったからである。"
  6: "彼[かれ]はわたしに言[い]った。「見[み]たか、人[ひと]の子[こ]よ。」そして、わたしを川[かわ]の岸[きし]へ連[つ]れて行[い]った。"
  7: "わたしが引[ひ]き返[かえ]すと、見[み]よ、川[かわ]の岸[きし]には、こちら側[がわ]にもあちら側[がわ]にも、非常[ひじょう]に多[おお]くの木[き]があった。"
  8: "彼[かれ]はわたしに言[い]った。「この水[みず]は東[ひがし]のガリラヤへ流[なが]れ出[で]て、アラビアへ下[くだ]り、海[うみ]、すなわち流[なが]れ出[で]る水[みず]に至[いた]る。そして、その水[みず]を癒[いや]す。"
  9: "川[かわ]がそこへ行[い]くすべての所[ところ]では、群[む]れ動[うご]く生[い]き物[もの]のすべての魂[たましい]が生[い]きる。そこには非常[ひじょう]に多[おお]くの魚[さかな]がいる。この水[みず]がそこへ来[き]て癒[いや]すからである。すべてのものが生[い]きる。川[かわ]がそこへ行[い]くすべての所[ところ]では、すべてのものが生[い]きる。"
  10: "そこには漁師[りょうし]たちが立[た]ち、エン・ガディからエン・エグライムまで、網[あみ]を干[ほ]す所[ところ]となる。それはそれ自身[じしん]のままである。その魚[さかな]は大[おお]きな海[うみ]の魚[さかな]のように、非常[ひじょう]に多[おお]い。"
  11: "その流[なが]れ出[で]る所[ところ]、その引[ひ]き返[かえ]す所[ところ]、その高[たか]まる所[ところ]の浅瀬[あさせ]は癒[いや]されず、塩[しお]に渡[わた]される。"
  12: "川[かわ]の岸[きし]には、こちら側[がわ]にもあちら側[がわ]にも、食[た]べられる木[き]がすべて生[は]え上[あ]がる。それは衰[おとろ]えず、その実[み]も尽[つ]きない。その新[あたら]しさのゆえに初[はつ]なりの実[み]を結[むす]ぶ。その水[みず]が聖所[せいしょ]から流[なが]れ出[で]ているからである。その実[み]は食[た]べ物[もの]となり、その芽生[めば]えは癒[いや]しとなる。」"
  13: "主[しゅ]なる神[かみ]はこう言[い]われる。「これが、あなたがたがイスラエルの子[こ]らの十二[じゅうに]の部族[ぶぞく]に、土地[とち]を嗣業[しぎょう]として分[わ]け与[あた]える境界[きょうかい]である。測[はか]り縄[なわ]の加[くわ]えがある。"
  14: "あなたがたはそれを、兄弟[きょうだい]それぞれ同[おな]じようにして嗣業[しぎょう]とする。わたしは彼[かれ]らの父[ちち]たちにこれを与[あた]えると、手[て]を上[あ]げて誓[ちか]った。この土地[とち]はあなたがたに嗣業[しぎょう]として落[お]ちる。"
  15: "これが北[きた]の土地[とち]の境界[きょうかい]である。大[おお]きな海[うみ]から、下[くだ]って行[い]き、ハマトの入口[いりぐち]を分[わ]かつセダダに至[いた]るまで。"
  16: "ベロタ、セブライム、エリアム、ダマスコの境界[きょうかい]とハマトの境界[きょうかい]の間[あいだ]、サウナンの庭[にわ]、すなわちアウラニティスの境界[きょうかい]の上[うえ]にあるもの。"
  17: "海[うみ]からエナンの庭[にわ]までがこの境界[きょうかい]である。ダマスコの境界[きょうかい]、北[きた]に面[めん]する所[ところ]、ハマトの境界[きょうかい]、そして北[きた]の境界[きょうかい]である。"
  18: "東[ひがし]の境界[きょうかい]は、アウラニティスとダマスコの間[あいだ]、ギレアデとイスラエルの地[ち]の間[あいだ]である。ヨルダン川[がわ]が、東[ひがし]にある棕櫚[しゅろ]の海[うみ]に至[いた]るまで境[さかい]を分[わ]かつ。これが東[ひがし]の側[がわ]である。"
  19: "南[みなみ]の側[がわ]、すなわち南西[なんせい]の側[がわ]は、テマンと棕櫚[しゅろ]の所[ところ]から、マリモト・カデスの水[みず]に至[いた]るまで、大[おお]きな海[うみ]に及[およ]ぶ。これが南[みなみ]の側[がわ]、すなわち南西[なんせい]の側[がわ]である。"
  20: "これが大[おお]きな海[うみ]の側[がわ]である。ハマトの入口[いりぐち]の真[ま]向[む]かいまで、その入口[いりぐち]までを境[さかい]とする。これが海[うみ]に面[めん]する所[ところ]、ハマトである。"
  21: "あなたがたはこの土地[とち]を、あなたがた自身[じしん]のために、イスラエルの部族[ぶぞく]たちに分[わ]け与[あた]えなさい。"
  22: "あなたがたはこれを、あなたがたと、あなたがたの間[あいだ]に住[す]む寄留者[きりゅうしゃ]たちのために、くじで分[わ]けなさい。彼らはあなたがたの間[あいだ]に子[こ]らを生[う]んだ者[もの]たちである。彼らはイスラエルの子[こ]らの間[あいだ]で、あなたがたにとって土着[どちゃく]の者[もの]のようになる。彼らはあなたがたとともに、イスラエルの部族[ぶぞく]の間[あいだ]で嗣業[しぎょう]にあずかって食[た]べる。"
  23: "彼らは、ともにいる寄留者[きりゅうしゃ]たちとともに、寄留者[きりゅうしゃ]の部族[ぶぞく]のうちにいる。そこであなたがたは彼らに嗣業[しぎょう]を与[あた]えなさい、と主[しゅ]なる神[かみ]は言[い]われる。」"

notes:
  1: "εἰσήγαγέν με ἐπὶ τὰ πρόθυρα τοῦ οἴκου — «привёл меня к преддверию дома (храма)» (神殿[しんでん]の入口[いりぐち]); ὕδωρ ἐξεπορεύετο ὑποκάτωθεν τοῦ αἰθρίου — «вода выходила из-под открытой части» (αἴθριον — открытое, непокрытое место; слав. «из-под непокровеннаго храма»); τὸ πρόσωπον τοῦ οἴκου ἔβλεπεν κατ' ἀνατολάς — «лицо дома смотрело на восток»; ἀπὸ τοῦ κλίτους τοῦ δεξιοῦ ἀπὸ νότου ἐπὶ τὸ θυσιαστήριον — «с правой стороны, от юга, к жертвеннику» (祭壇[さいだん])."
  2: "κατὰ τὴν ὁδὸν τῆς πύλης τῆς πρὸς βορρᾶν — «путём северных ворот»; τὴν ὁδὸν ἔξωθεν πρὸς τὴν πύλην τῆς αὐλῆς τῆς βλεπούσης κατ' ἀνατολάς — «внешним путём к воротам двора, смотрящего на восток»; τὸ ὕδωρ κατεφέρετο ἀπὸ τοῦ κλίτους τοῦ δεξιοῦ — «вода неслась (текла) с правой стороны» (καταφέρομαι)."
  3: "καθὼς ἔξοδος ἀνδρὸς ἐξ ἐναντίας — «когда муж выходил прямо (напротив)» (ἐξ ἐναντίας — напротив, вперёд; слав. «противу»), т. е. вперёд, на восток; μέτρον ἐν τῇ χειρὶ αὐτοῦ — «мера (мерная вервь) в руке его» (測[はか]り縄[なわ]); διεμέτρησεν χιλίους — «отмерил тысячу» (локтей); ὕδωρ ἀφέσεως — «вода отпущения (прощения)»: тёмное место, вероятно искажение евр. «воды по щиколотку»; слав. «воду оставления»; оставлено буквально 赦[ゆる]しの水[みず]."
  4: "διεμέτρησεν χιλίους — «отмерил тысячу»; ὕδωρ ἕως τῶν μηρῶν — «вода до бёдер»; ὕδωρ ἕως ὀσφύος — «вода до чресл (поясницы)». Слав. в первом случае читает «до колен» (膝[ひざ]), в тексте слав.; LXX-вариант «до бёдер» отмечен."
  5: "ἐξύβριζεν τὸ ὕδωρ ὡς ῥοῖζος χειμάρρου — «вода бушевала, как шум потока» (ῥοῖζος — шум, свист; χείμαρρος — поток, 奔流[ほんりゅう]); ὃν οὐ διαβήσονται — «который не перейдут»; в тексте 渡[わた]ることのできない川[かわ]."
  6: "Εἰ ἑώρακας, υἱὲ ἀνθρώπου; — «видел ли ты, сын человеческий?» (人[ひと]の子[こ]); ἤγαγέν με ἐπὶ τὸ χεῖλος τοῦ ποταμοῦ — «привёл меня на берег реки» (岸[きし]). Слав. в конце стиха добавляет «во обращении моем» (ἐν τῇ ἐπιστροφῇ μου), что в LXX стоит началом 47:7; держим деление LXX."
  7: "ἐν τῇ ἐπιστροφῇ μου — «когда я обратился (обернулся)»; ἐπὶ τοῦ χείλους τοῦ ποταμοῦ δένδρα πολλὰ σφόδρα ἔνθεν καὶ ἔνθεν — «на берегу реки деревьев весьма много с той и другой стороны» (こちら側[がわ]にもあちら側[がわ]にも)."
  8: "εἰς τὴν Γαλιλαίαν τὴν πρὸς ἀνατολάς — «в Галилею, что к востоку»: здесь Γαλιλαία, вероятно, «округ, область» (евр. הַגְּלִילָה), а не северная Галилея; слав. «галилею»; оставлено как имя ガリラヤ; ἐπὶ τὴν Ἀραβίαν — «на Аравию»: речь о пустынной равнине (Арава), не о стране; слав. «аравию»; ἐπὶ τὸ ὕδωρ τῆς διεκβολῆς — «к воде исхода (устья)» (διεκβολή — выход, устье); ὑγιάσει τὰ ὕδατα — «исцелит воды» (癒[いや]す). Море — Мёртвое."
  9: "πᾶσα ψυχὴ τῶν ζῴων τῶν ἐκζεόντων — «всякая душа животных, кишащих (роящихся)» (ἐκζέω — кипеть, кишеть; слав. «вреющих»), 這[は]い回[まわ]る生[い]き物[もの]; ἐφ' ἃ ἂν ἐπέλθῃ ἐκεῖ ὁ ποταμός — «на что придёт туда река»; ἰχθὺς πολὺς σφόδρα — «рыбы весьма много»; ἥκει ἐκεῖ τὸ ὕδωρ τοῦτο, καὶ ὑγιάσει — «пришла туда вода сия и исцелит»; повтор «πᾶν, ἐφ' ὃ ἂν ἐπέλθῃ ὁ ποταμός … ζήσεται» сохранён."
  10: "ἁλεεῖς — «рыболовы» (漁師[りょうし]); ἀπὸ Αινγαδιν ἕως Αιναγαλιμ — «от Ен-Гадди до Ен-Еглаима» (греч. Αινγαδιν, Αιναγαλιμ; エン・ガディ, エン・エグライム — формы корпуса); ψυγμὸς σαγηνῶν ἔσται — «сушение (место для сушки) сетей будет» (網[あみ]を干[ほ]す所[ところ]); καθ' αὑτὴν ἔσται — тёмное место, букв. «сама по себе будет» (слав. «о себе будет»); ru (МТ) «рыба будет в своём виде»; оставлено буквально; οἱ ἰχθύες αὐτῆς ὡς οἱ ἰχθύες τῆς θαλάσσης τῆς μεγάλης — «рыбы её, как рыбы великого моря»."
  11: "ἐν τῇ διεκβολῇ αὐτοῦ καὶ ἐν τῇ ἐπιστροφῇ αὐτοῦ καὶ ἐν τῇ ὑπεράρσει αὐτοῦ — «в исходе его, и в обращении его, и в возвышении его» (ὑπέραρσις — поднятие, возвышение); οὐ μὴ ὑγιάσωσιν — «не исцелятся»; εἰς ἅλας δέδονται — «в соль отданы» (塩[しお]). Слав. добавляет «мелины ея» (отмели, мели) — внесено (浅瀬[あさせ]), в LXX этого слова нет."
  12: "πᾶν ξύλον βρώσιμον — «всякое дерево съедобное (плодовое)» (食[た]べられる木[き]); οὐ μὴ παλαιωθῇ ἐπ' αὐτοῦ — «не обветшает на нём» (παλαιόω — стареть); οὐδὲ μὴ ἐκλίπῃ ὁ καρπὸς αὐτοῦ — «и не оскудеет плод его»; τῆς καινότητος αὐτοῦ πρωτοβολήσει — «новизною своею даст ранний плод» (πρωτοβολέω — давать первый росток/плод); τὰ ὕδατα αὐτῶν ἐκ τῶν ἁγίων ἐκπορεύεται — «воды их из святынь исходят» (聖所[せいしょ]); ἀνάβασις αὐτῶν εἰς ὑγίειαν — «восхождение (рост) их во исцеление» (слав. «прозябение»; ru «листья» по МТ; в тексте 芽生[めば]え)."
  13: "Ταῦτα τὰ ὅρια κατακληρονομήσετε — «сии пределы наследуете» (境界[きょうかい]); ταῖς δώδεκα φυλαῖς τῶν υἱῶν Ισραηλ — «двенадцати коленам сынов Израилевых» (部族[ぶぞく]); πρόσθεσις σχοινίσματος — «прибавление верви (мерной)»: слав. «приложение ужа»; евр. «Иосифу два удела»; ru вносит МТ («Иосифу два удела»), в текст не внесено."
  14: "ἕκαστος καθὼς ὁ ἀδελφὸς αὐτοῦ — «каждый, как брат его» (兄弟[きょうだい]それぞれ同[おな]じように); εἰς ἣν ἦρα τὴν χεῖρά μου — «на которую Я поднял руку Мою», т. е. клялся (手[て]を上[あ]げて誓[ちか]う); πεσεῖται ἡ γῆ αὕτη ὑμῖν ἐν κληρονομίᾳ — «падёт земля сия вам в наследие» (嗣業[しぎょう])."
  15: "ἀπὸ τῆς θαλάσσης τῆς μεγάλης τῆς καταβαινούσης καὶ περισχιζούσης τῆς εἰσόδου Ημαθ Σεδδαδα — «от великого моря, спускающегося и разделяющего вход Емафа, Седада»: тёмное место; слав. сливает «имаселдам» (ハマト и セダダ); в тексте оба имени по LXX. Великое море — Средиземное."
  16: "Βηρωθα, Σεβραιμ, Ηλιαμ — «Берофа, Себраим, Елиам» (ベロタ, セブライム, エリアム); ἀνὰ μέσον ὁρίων Δαμασκοῦ καὶ ἀνὰ μέσον ὁρίων Ημαθ — «между пределами Дамаска и между пределами Емафа»; αὐλὴ τοῦ Σαυναν — «двор Саунана» (サウナン; ru «Гацар-Тихон» по МТ); αἵ εἰσιν ἐπάνω τῶν ὁρίων Αυρανίτιδος — «которые выше пределов Авранитиды» (アウラニティス). Слав. читает первые имена слитно: «маавфирас, еврамилиам»."
  17: "ἀπὸ τῆς αὐλῆς τοῦ Αιναν — «от двора Енана» (エナンの庭[にわ]; евр. Хацар-Енон; ru «Гацар-Енон»); ὅρια Δαμασκοῦ καὶ τὰ πρὸς βορρᾶν — «пределы Дамаска и то, что к северу». Слав. добавляет «и предел емафов, и предел северск» — нет в LXX, внесено без 〔…〕 (ハマトの境界[きょうかい], 北[きた]の境界[きょうかい]; «северск» — дублет к «к северу»)."
  18: "ἀνὰ μέσον τῆς Αυρανίτιδος καὶ ἀνὰ μέσον Δαμασκοῦ — «между Авранитидой и Дамаском»; ἀνὰ μέσον τῆς Γαλααδίτιδος — «между Галаадом» (ギレアデ); ὁ Ιορδάνης διορίζει — «Иордан разделяет» (ヨルダン川[がわ]); ἐπὶ τὴν θάλασσαν τὴν πρὸς ἀνατολὰς Φοινικῶνος — «до моря, что на востоке Фиников»: Φοινικών — «пальмовая роща» (棕櫚[しゅろ]) или «Финикия»; море — Мёртвое; слав. «морю, еже на востоки фиников»."
  19: "τὰ πρὸς νότον καὶ λίβα — «то, что к югу и юго-западу» (λίψ — юго-запад; слав. «лив»); ἀπὸ Θαιμαν καὶ Φοινικῶνος — «от Фемана и [пальмовой рощи]» (テマン, 棕櫚[しゅろ]の所[ところ]; слав. «фиников»); ἕως ὕδατος Μαριμωθ Καδης — «до воды Меривот-Кадес» (マリモト・カデス; евр. «воды пререкания при Кадесе»); παρεκτεῖνον ἐπὶ τὴν θάλασσαν τὴν μεγάλην — «простираясь до великого моря»; τοῦτο τὸ μέρος νότος καὶ λίψ — «это часть юг и юго-запад» (слав. относит к 47:20)."
  20: "τοῦτο τὸ μέρος τῆς θαλάσσης τῆς μεγάλης — «это часть великого моря» (западный предел); ὁρίζει ἕως κατέναντι τῆς εἰσόδου Ημαθ — «определяет до напротив входа Емафа» (真[ま]向[む]かい); ἕως εἰσόδου αὐτοῦ — «до входа его»; ταῦτά ἐστιν τὰ πρὸς θάλασσαν Ημαθ — «это то, что к морю, Емаф». Слав. начинает стих «сия страна юга и лива» — в LXX это конец 47:19; держим деление LXX."
  21: "διαμερίσετε τὴν γῆν ταύτην αὐτοῖς — «разделите землю сию им» (племенам); слав. «вам» (себе) — иное чтение, в тексте слав. (あなたがた自身[じしん]のために); LXX-вариант «им» отмечен."
  22: "βαλεῖτε αὐτὴν ἐν κλήρῳ ὑμῖν — «бросьте её в жребий себе» (くじで分[わ]ける); τοῖς προσηλύτοις τοῖς παροικοῦσιν ἐν μέσῳ ὑμῶν — «пришельцам, живущим среди вас» (寄留者[きりゅうしゃ]); οἵτινες ἐγέννησαν υἱοὺς ἐν μέσῳ ὑμῶν — «которые родили сыновей среди вас»; ὡς αὐτόχθονες — «как туземцы» (土着[どちゃく]の者[もの]); μεθ' ὑμῶν φάγονται ἐν κληρονομίᾳ — «с вами будут есть в наследии» (嗣業[しぎょう]にあずかって食[た]べる)."
  23: "ἐν φυλῇ προσηλύτων — «в колене пришельцев» (寄留者[きりゅうしゃ]の部族[ぶぞく]): тёмное место, слав. «в племени пришелцев»; ἐν τοῖς προσηλύτοις τοῖς μετ' αὐτῶν — «с пришельцами, которые с ними»; ἐκεῖ δώσετε κληρονομίαν αὐτοῖς — «там дадите наследие им»; λέγει κύριος θεός — «говорит Господь Бог», формула в конце речи."
