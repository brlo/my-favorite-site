verses:
  1: "ダビデの祈[いの]り。主[しゅ]よ、あなたの耳[みみ]を傾[かたむ]けて、わたしに答[こた]えてください。わたしは貧[まず]しく、乏[とぼ]しい者[もの]だからです。"
  2: "わたしの魂[たましい]を守[まも]ってください。わたしはあなたに忠実[ちゅうじつ]です。わたしの神[かみ]よ、あなたに望[のぞ]みを置[お]く僕[しもべ]を救[すく]ってください。"
  3: "主[しゅ]よ、わたしをあわれんでください。わたしは一日中[いちにちじゅう]、あなたに呼[よ]び求[もと]めています。"
  4: "あなたの僕[しもべ]の魂[たましい]を喜[よろこ]ばせてください。主[しゅ]よ、わたしはあなたに魂[たましい]を上[あ]げているからです。"
  5: "主[しゅ]よ、あなたは善[よ]く、寛[かん]容[よう]で、あなたを呼[よ]び求[もと]めるすべての者[もの]にあわれみ深[ふか]い方[かた]です。"
  6: "主[しゅ]よ、わたしの祈[いの]りに耳[みみ]を傾[かたむ]け、わたしの願[ねが]いの声[こえ]を聞[き]いてください。"
  7: "わたしの苦[くる]しみの日[ひ]に、わたしはあなたに呼[よ]びました。あなたはわたしに答[こた]えてくださいます。"
  8: "主[しゅ]よ、神[かみ]々[がみ]の中[なか]であなたに似[に]る者[もの]はなく、あなたのわざに及[およ]ぶものはない。"
  9: "主[しゅ]よ、あなたが造[つく]られたすべての諸国[しょこく]の民[たみ]は来[き]て、あなたの前[まえ]に伏[ふ]し、あなたの名[な]をあがめる。"
  10: "あなたは大[おお]きな方[かた]、驚[おどろ]くべきわざを行[おこな]う方[かた]。あなただけが神[かみ]である。"
  11: "主[しゅ]よ、わたしをあなたの道[みち]に導[みちび]いてください。わたしはあなたの真[しん]理[り]を歩[あゆ]みます。わたしの心[こころ]を、あなたの名[な]を恐[おそ]れることで喜[よろこ]ばせてください。"
  12: "主[しゅ]、わたしの神[かみ]よ、わたしは心[こころ]を尽[つ]くしてあなたに感謝[かんしゃ]し、とこしえにあなたの名[な]をあがめる。"
  13: "あなたのあわれみはわたしに大[おお]きく、あなたはわたしの魂[たましい]を最[もっと]も深[ふか]い陰府[よみ]から救[すく]い出[だ]されたからである。"
  14: "神[かみ]よ、不法[ふほう]の者[もの]たちがわたしに立[た]ち向[む]かい、力[ちから]ある者[もの]の集[つど]いがわたしの命[いのち]を求[もと]めている。彼[かれ]らはあなたを自分[じぶん]たちの前[まえ]に置[お]かなかった。"
  15: "しかし、主[しゅ]である神[かみ]よ、あなたはあわれみ深[ふか]く、恵[めぐ]み深[ふか]く、寛[かん]忍[にん]で、あわれみに富[と]み、真[しん]実[じつ]である。"
  16: "わたしに目[め]を留[と]めて、あわれんでください。あなたの力[ちから]をあなたの僕[しもべ]に与[あた]え、あなたの婢女[はしため]の子[こ]を救[すく]ってください。"
  17: "わたしに善[ぜん]のしるしを行[おこな]ってください。わたしを憎[にく]む者[もの]たちが見[み]て、恥[は]じるように。主[しゅ]よ、あなたがわたしを助[たす]け、慰[なぐさ]めてくださったからです。"

notes:
  1: "Надписание (прежний ст. 0, влит в этот стих): Προσευχὴ τῷ Δαυιδ — ダビデの祈り (προσευχή — 祈り; надписание влито в ст. 1, как в ru-базе и у jp-joc). Стих: Κλῖνον, κύριε, τὸ οὖς σου — 主よ、あなたの耳を傾けて (κλίνω — «наклонять»). ἐπάκουσόν μου — わたしに答えてください (ἐπακούω — «услышать, внять»). ὅτι πτωχὸς καὶ πένης εἰμὶ ἐγώ — わたしは貧しく、乏しい者だからです (πτωχός — 貧しい; πένης — 乏しい, ср. Пс 81:3)."
  2: "φύλαξον τὴν ψυχήν μου — わたしの魂を守ってください (φυλάσσω — «хранить»). ὅτι ὅσιός εἰμι — わたしはあなたに忠実です (ὅσιος — «преподобный, верный»). σῶσον τὸν δοῦλόν σου — あなたの僕を救ってください. τὸν ἐλπίζοντα ἐπὶ σέ — あなたに望みを置く者を (ἐλπίζω — «уповать»)."
  3: "ἐλέησόν με, κύριε — 主よ、わたしをあわれんでください. ὅτι πρὸς σὲ κεκράξομαι ὅλην τὴν ἡμέραν — わたしは一日中、あなたに呼び求めています (κράζω — «взывать»; perfect с настоящим значением)."
  4: "εὔφρανον τὴν ψυχὴν τοῦ δούλου σου — あなたの僕の魂を喜ばせてください (εὐφραίνω — «веселить»). ὅτι πρὸς σέ, κύριε, ἦρα τὴν ψυχήν μου — 主よ、わたしはあなたに魂を上げているからです (αἴρω — «возносить»)."
  5: "ὅτι σὺ, κύριε, χρηστὸς καὶ ἐπιεικής — 主よ、あなたは善く、寛容で (χρηστός — «благой»; ἐπιεικής — «кроткий, снисходительный»). πολυέλεος πᾶσι τοῖς ἐπικαλουμένοις σε — あなたを呼び求めるすべての者にあわれみ深い方です (πολυέλεος — «многомилостивый»)."
  6: "ἐνώτισαι, κύριε, τὴν προσευχήν μου — 主よ、わたしの祈りに耳を傾け (ἐνωτίζομαι — «внимать»). πρόσχες τῇ φωνῇ τῆς δεήσεώς μου — わたしの願いの声を聞いてください (δέησις — «моление»)."
  7: "ἐν ἡμέρᾳ θλίψεώς μου ἐκέκραξα πρὸς σέ — わたしの苦しみの日に、わたしはあなたに呼びました (θλῖψις — 苦しみ). ὅτι εἰσήκουσάς μου — あなたはわたしに答えてくださいます (аорист в значении уверенности)."
  8: "οὐκ ἔστιν ὅμοιός σοι ἐν θεοῖς, κύριε — 主よ、神々の中であなたに似る者はなく (ὅμοιος — «подобный»). οὐκ ἔστιν κατὰ τὰ ἔργα σου — あなたのわざに及ぶものはない (ἔργον — わざ)."
  9: "πάντα τὰ ἔθνη, ὅσα ἐποίησας, ἥξουσιν — あなたが造られたすべての諸国の民は来て (ἥκω — «приходить»). προσκυνήσουσιν ἐνώπιόν σου — あなたの前に伏し (προσκυνέω — «поклоняться»). δοξάσουσιν τὸ ὄνομά σου — あなたの名をあがめる (δοξάζω)."
  10: "ὅτι μέγας εἶ σὺ καὶ ποιῶν θαυμάσια — あなたは大きな方、驚くべきわざを行う方 (θαυμάσιον — «чудо»). σὺ εἶ ὁ θεὸς μόνος ὁ μέγας — あなただけが神である (μόνος — «единственный»; порядок греч. сохранён)."
  11: "ὁδήγησόν με, κύριε, τῇ ὁδῷ σου — 主よ、わたしをあなたの道に導いてください (ὁδηγέω — «водить»). πορεύσομαι ἐν τῇ ἀληθείᾳ σου — わたしはあなたの真理を歩みます (ἀλήθεια — 真理). εὐφρανθήτω ἡ καρδία μου τοῦ φοβεῖσθαι τὸ ὄνομά σου — わたしの心を、あなたの名を恐れることで喜ばせてください (инфинитив цели)."
  12: "ἐξομολογήσομαί σοι, κύριε ὁ θεός μου, ἐν ὅλῃ καρδίᾳ μου — 主、わたしの神よ、わたしは心を尽くしてあなたに感謝し (ἐξομολογέομαι — «исповедовать, благодарить»). δοξάσω τὸ ὄνομά σου εἰς τὸν αἰῶνα — とこしえにあなたの名をあがめる."
  13: "ὅτι τὸ ἔλεός σου μέγα ἐπ᾽ ἐμὲ — あなたのあわれみはわたしに大きく. ἐρρύσω τὴν ψυχήν μου ἐξ ᾅδου κατωτάτου — あなたはわたしの魂を最も深い陰府から救い出された (ῥύομαι — «избавлять»; ᾅδης — 陰府; κατώτατος — «преисподнейший»)."
  14: "παράνομοι ἐπανέστησαν ἐπ᾽ ἐμέ — 不法の者たちがわたしに立ち向かい (παράνομος — «беззаконник»; ἐπανίστημι — «восставать»). συναγωγὴ κραταιῶν ἐζήτησαν τὴν ψυχήν μου — 力ある者の集いがわたしの命を求めている (συναγωγή — 集い; κραταιός — «сильный»). οὐ προέθεντό σε ἐνώπιον αὐτῶν — 彼らはあなたを自分たちの前に置かなかった (προτίθημι — «полагать пред»)."
  15: "καὶ σύ, κύριε ὁ θεός — しかし、主である神よ. οἰκτίρμων καὶ ἐλεήμων — あわれみ深く、恵み深く (οἰκτίρμων — «милосердный»; ἐλεήμων — «милостивый»). μακρόθυμος καὶ πολυέλεος καὶ ἀληθινός — 寛忍で、あわれみに富み、真実である (μακρόθυμος — «долготерпеливый»; ἀληθινός — «истинный»)."
  16: "ἐπίβλεψον ἐπ᾽ ἐμὲ καὶ ἐλέησόν με — わたしに目を留めて、あわれんでください (ἐπιβλέπω — «призирать»). δὸς τὸ κράτος σου τῷ παιδί σου — あなたの力をあなたの僕に与え (κράτος — «крепость, сила»; παῖς — 僕). σῶσον τὸν υἱὸν τῆς παιδίσκης σου — あなたの婢女の子を救ってください (παιδίσκη — 婢女, ср. Пс 115:7)."
  17: "ποίησον μετ᾽ ἐμοῦ σημεῖον εἰς ἀγαθόν — わたしに善のしるしを行ってください (σημεῖον — しるし). ἰδέτωσαν οἱ μισοῦντές με καὶ αἰσχυνθήτωσαν — わたしを憎む者たちが見て、恥じるように (αἰσχύνομαι — «стыдиться»). ὅτι σύ, κύριε, ἐβοήθησάς μοι καὶ παρεκάλεσάς με — 主よ、あなたがわたしを助け、慰めてくださったからです (παρακαλέω — «утешать»)."
