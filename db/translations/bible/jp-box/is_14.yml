# jp-box, Исаия, глава 14. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для гл. 13–14 есть фрагментом, но в выгрузку
# не входил и не использовался; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 14: 1–3 помилование Иакова и возвращение; 4–21 песнь на царя Вавилонского
# (вся в 「…」; вложенные 『…』 в 14:8, 10, 13–14, 16–17); 22–27 слова Господа о Вавилоне
# и Ассирии (в 「…」, формулы «говорит Господь» — вне кавычек); 28–32 пророчество
# о филистимлянах. Красного и синего нет.
# Нумерация по gr: 32 стиха; число совпадает с csl, но слав. делит иначе внутри главы:
# 14:1 начинается с конца нашего 13:22 («Скоро идет и не умедлит»); слав. 14:6 включает
# начало нашего 14:7 («почи уповающи»); слав. 14:20 начинается с конца нашего 14:19
# («Якоже риза в крови намочена...»). Номера стихов от этого не сдвигаются.
# 〔…〕 нет. Слав. «(всю)» и подобные пометы в скобках — редакционные, не внесены.
# Сносок ⟨…⟩ нет: 軛, 巨人, 王座, 明けの明星, 栄誉, 軍勢, 泥 уже в корпусе;
# 悲しみの歌 (θρῆνος) — новая передача, но слово понятное.
# Имена — транслитерация греческого (LXX): バビロン, カルデア人, ヤコブ, イスラエル,
# アッシリア人, ペリシテ人, アハズ, レバノン, ソドム, ゴモラ.

