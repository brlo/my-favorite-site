verses:
  1: "主[しゅ]はヤコブをあわれみ、再[ふたた]びイスラエルを選[えら]ばれる。彼[かれ]らは自分[じぶん]たちの地[ち]に安[やす]らう。寄留[きりゅう]の者[もの]は彼らに加[くわ]わり、ヤコブの家[いえ]に加[くわ]わる。"
  2: "諸国[しょこく]の民[たみ]は彼[かれ]らを受[う]け入[い]れ、彼らの場所[ばしょ]へ連[つ]れて行[い]く。イスラエルの家[いえ]は神[かみ]の地[ち]で彼らを所有[しょゆう]とし、男[おとこ]も女[おんな]も奴隷[どれい]とするほどに増[ふ]え広[ひろ]がる。彼らを捕[と]らえた者[もの]たちが捕らえられ、彼らを支配[しはい]した者たちが支配される。"
  3: "その日[ひ]、主[しゅ]はあなたを、その苦[くる]しみと憤[いきどお]りと、あなたが彼[かれ]らに仕[つか]えた厳[きび]しい奴隷[どれい]の務[つと]めから休[やす]ませてくださる。"
  4: "あなたはバビロンの王[おう]についてこの悲[ひ]しみの歌[うた]を歌[うた]い、その日[ひ]に言[い]う。「どうして、取[と]り立[た]てる者[もの]はやみ、責[せ]め立[た]てる者[もの]はやんだのか。"
  5: "神[かみ]は罪人[つみびと]たちの軛[くびき]を、支配者[しはいしゃ]たちの軛[くびき]を砕[くだ]かれた。"
  6: "憤[いきどお]りをもって民[たみ]を癒[いや]しえない打[う]ち傷[きず]で打[う]ち、怒[いか]りの打ち傷で民[たみ]を打ち、あわれむことのなかった者[もの]は、"
  7: "安[やす]んじて休[やす]んだ。全[ぜん]地[ち]は喜[よろこ]びの声[こえ]を上[あ]げる。"
  8: "レバノンの木々[きぎ]も、レバノンの杉[すぎ]も、あなたのことで喜[よろこ]ぶ。『あなたが眠[ねむ]ってから、わたしたちを切[き]る者[もの]は上[のぼ]って来[こ]ない。』"
  9: "よみは下[した]からあなたを迎[むか]えて苦[にが]くなり、あなたとともに、地[ち]を治[おさ]めた巨人[きょじん]たちがすべても呼[よ]び起[お]こされた。彼らはその王座[おうざ]からすべての国々[くにぐに]の王[おう]たちを立[た]たせた。"
  10: "彼[かれ]らはみな答[こた]えてあなたに言[い]う。『あなたもまた、わたしたちと同じように捕[と]らえられた。あなたもわたしたちの仲間[なかま]に数[かぞ]えられた。』"
  11: "あなたの栄光[えいこう]はよみに下[くだ]り、あなたの多[おお]くの喜[よろこ]びも下った。あなたの下[した]には腐[くさ]ったものが敷[し]かれ、あなたを覆[おお]うものは虫[むし]である。"
  12: "どうして、明[あ]けの明星[みょうじょう]、暁[あかつき]に昇[のぼ]る者[もの]が天[てん]から落[お]ちたのか。すべての国々[くにぐに]の民[たみ]に使[つか]いを遣[つか]わした者[もの]が、地[ち]に打[う]ち砕[くだ]かれた。"
  13: "あなたは心[こころ]のうちに言[い]った。『わたしは天[てん]に上[のぼ]る。わたしの王座[おうざ]を天[てん]の星[ほし]々[ぼし]の上[うえ]に置[お]く。わたしは高[たか]い山[やま]に、北[きた]に向[む]かう高[たか]い山々[やまやま]の上[うえ]に座[すわ]る。"
  14: "わたしは雲[くも]の上[うえ]に上[のぼ]り、至高[しこう]の者[もの]に似[に]た者[もの]となる。』"
  15: "しかし今[いま]、あなたはよみに下[くだ]り、地[ち]の基[もと]にまで落[お]ちる。"
  16: "あなたを見[み]る者[もの]たちは、あなたのことで驚[おどろ]き、言[い]う。『これが、地[ち]をかき乱[みだ]し、王[おう]たちを震[ふる]えさせたあの人間[にんげん]か。"
  17: "全[ぜん]世界[せかい]を荒[あ]れ果[は]てたものとし、その都[みやこ]々[みやこ]を打[う]ち壊[こわ]し、捕[と]らわれた者[もの]たちを解[と]き放[はな]たなかった者[もの]か。』"
  18: "国々[くにぐに]の王[おう]たちはみな、栄誉[えいよ]のうちに、それぞれ自分[じぶん]の家[いえ]で眠[ねむ]った。"
  19: "しかしあなたは山々[やまやま]に投[な]げ捨[す]てられ、剣[つるぎ]で刺[さ]し貫[つらぬ]かれてよみに下[くだ]る多[おお]くの死者[ししゃ]とともに、忌[い]むべき死人[しにん]のようになる。血[ち]にまみれた衣[ころも]が清[きよ]くなりえないように、"
  20: "あなたもまた清[きよ]くはならない。あなたがわたしの地[ち]を滅[ほろ]ぼし、わたしの民[たみ]を殺[ころ]したからだ。あなたは永遠[えいえん]に残[のこ]ることはない。悪[わる]い種[たね]よ。"
  21: "あなたの子[こ]どもを、あなたの父[ちち]の罪[つみ]のゆえに殺[ころ]されるために備[そな]えよ。彼らが立[た]ち上[あ]がって地[ち]を受け継[つ]ぎ、地[ち]を軍勢[ぐんぜい]で満[み]たすことのないように。」"
  22: "「わたしは彼[かれ]らに立[た]ち向[む]かう」と万軍[ばんぐん]の主[しゅ]は言[い]われる。「わたしは彼らの名[な]も、残[のこ]りも、子孫[ししそん]も滅[ほろ]ぼす」と主[しゅ]は言われる。"
  23: "「わたしはバビロニアを荒[あ]れ地[ち]とし、ハリネズミの住[す]みかとする。わたしはそれを無[む]に等[ひと]しいものとし、滅[ほろ]びのための泥[どろ]の穴[あな]とする。」"
  24: "万軍[ばんぐん]の主[しゅ]はこう言[い]われる。「わたしが語[かた]ったとおりに、そうなる。わたしが定[さだ]めたとおりに、それはとどまる。"
  25: "アッシリア人[じん]をわたしの地[ち]で、わたしの山々[やまやま]で滅[ほろ]ぼすためである。彼らは踏[ふ]みつけられ、彼らの軛[くびき]は彼らから取[と]り去[さ]られ、その威光[いこう]もその肩[かた]から取[と]り去られる。"
  26: "これが、主[しゅ]が全[ぜん]世界[せかい]について定[さだ]めた計画[けいかく]であり、これが、全[ぜん]世界[せかい]のすべての民[たみ]の上[うえ]に伸[の]べられた高[たか]い手[て]である。"
  27: "聖[せい]なる神[かみ]が定[さだ]めたことを、だれが覆[くつがえ]せるのか。高[たか]く上[あ]げられたその手[て]を、だれが退[しりぞ]けられるのか。」"
  28: "アハズ王[おう]が死[し]んだ年[とし]に、この言葉[ことば]があった。"
  29: "ペリシテ人[じん]よ、あなたがたはみな喜[よろこ]んではならない。あなたがたを打[う]つ軛[くびき]が砕[くだ]かれたからである。蛇[へび]の種[たね]から蝮[まむし]の子[こ]らが出[で]、その子らから飛[と]ぶ蛇[へび]が出[で]る。"
  30: "貧[まず]しい者[もの]たちは彼によって養[やしな]われ、貧[まず]しい人々[ひとびと]は平和[へいわ]のうちに休[やす]む。しかし、飢[うえ]えによってあなたの種[たね]は滅[ほろ]ぼされ、あなたの残[のこ]りも滅[ほろ]ぼされる。"
  31: "都[みやこ]の門[もん]よ、泣[な]き叫[さけ]べ。騒[さわ]ぎ立[た]つ都[みやこ]々[みやこ]よ、声[こえ]を上[あ]げよ。ペリシテ人[じん]よ、あなたがたはみな。北[きた]から煙[けむり]が来[く]る。逃[に]げ延[の]びる者[もの]は一人[ひとり]もいない。"
  32: "国々[くにぐに]の王[おう]たちは何[なに]と答[こた]えるのか。主[しゅ]がシオンを据[す]え、その方[かた]によって民[たみ]のへりくだる者[もの]たちが救[すく]われる、と。"

notes:
  1: "ἐλεήσει κύριος τὸν Ιακωβ — «помилует Господь Иакова»; ἐκλέξεται ἔτι τὸν Ισραηλ — «изберёт ещё Израиля» (再び選ぶ). ἀναπαύσονται ἐπὶ τῆς γῆς αὐτῶν — «успокоятся на земле своей». ὁ γιώρας (γείωρας) — «пришелец, переселенец» (寄留の者); προστεθήσεται πρὸς αὐτούς, καὶ προστεθήσεται πρὸς τὸν οἶκον Ιακωβ — «приложится к ним и приложится к дому Иакова»: повтор сохранён. Слав. 14:1 начинается с конца нашего 13:22 («Скоро идет и не умедлит»)."
  2: "λήμψονται αὐτοὺς ἔθνη — «возьмут их народы» (примут); εἰσάξουσιν εἰς τὸν τόπον αὐτῶν — «введут на место их». κατακληρονομήσουσιν — «наследуют, овладеют»: подлежащее в греч. не названо; в ru «дом Израиля» — по МТ, поэтому в тексте названо イスラエルの家 для ясности. πληθυνθήσονται ἐπὶ τῆς γῆς τοῦ θεοῦ — «умножатся на земле Божией»; εἰς δούλους καὶ δούλας — «в рабов и рабынь». ἔσονται αἰχμάλωτοι οἱ αἰχμαλωτεύσαντες αὐτούς — «будут пленены пленившие их»; κυριευθήσονται οἱ κυριεύσαντες — «будут под властью те, кто властвовал» (страд.)."
  3: "ἀναπαύσει σε ὁ θεός — «успокоит тебя Бог»; слав. «Господь» — в LXX θεός, взято слав. чтение (主), вариант LXX — 神; ὀδύνη — «боль, страдание» (苦しみ; слав. «болезнь»); θυμός — «ярость» (憤り); δουλεία σκληρά — «жестокое рабство»; ἧς ἐδούλευσας αὐτοῖς — «которому ты служил им»."
  4: "θρῆνος — «плач, погребальная песнь» (悲しみの歌); ἐπὶ τὸν βασιλέα Βαβυλῶνος — «на царя Вавилонского». ἀναπέπαυται ὁ ἀπαιτῶν — «успокоился, перестал взыскующий» (perfect; ἀπαιτέω — «требовать, взыскивать», 取立てる者); ὁ ἐπισπουδαστής — «понуждающий, надзиратель» (слав. «понуждаяй»; 責め立てる者). С 14:4 по 14:21 — песнь в 「…」."
  5: "συνέτριψεν ὁ θεός — «сокрушил Бог»; ζυγός — «ярмо» (軛); τῶν ἁμαρτωλῶν — «грешников» (罪人); τῶν ἀρχόντων — «князей, правителей» (支配者たち)."
  6: "πατάξας — «поразив» (причастие; подлежащее — тот, о ком песнь); πληγῇ ἀνιάτῳ — «ударом неисцельным»; παίων — «поражая»; ἣ οὐκ ἐφείσατο — «который не пощадил». Слав. присоединяет сюда «почи уповающи» (ἀνεπαύσατο πεποιθώς) — по gr это начало 14:7; деление держим по gr, поэтому 14:6 кончается запятой, а 14:7 начинается 安んじて休んだ."
  7: "ἀνεπαύσατο πεποιθώς — «успокоился, [будучи] уверен» (πεποίθηκα; слав. «почи уповающи»), слав. относит к 14:6. πᾶσα ἡ γῆ βοᾷ μετ᾽ εὐφροσύνης — «вся земля вопиет с веселием»."
  8: "τὰ ξύλα τοῦ Λιβάνου — «деревья Ливана»; ἡ κέδρος τοῦ Λιβάνου — «кедр Ливанский»; ἀφ᾽ οὗ σὺ κεκοίμησαι — «с тех пор как ты уснул» (perfect); ὁ κόπτων ἡμᾶς — «рубящий нас». Слова деревьев — вложенные 『…』: в LXX нет λέγοντες, но первое лицо «нас» показывает, что это их речь."
  9: "ὁ ᾅδης κάτωθεν — «ад, преисподняя снизу» (よみ); ἐπικράνθη — «огорчился, стал горек»; συναντήσας σοι — «встретив тебя». συνηγέρθησάν σοι πάντες οἱ γίγαντες — «восстали с тобой все исполины» (巨人); οἱ ἄρξαντες τῆς γῆς — «владевшие землёй»; οἱ ἐγείραντες ἐκ τῶν θρόνων πάντας βασιλεῖς — «поднявшие с престолов всех царей»."
  10: "ἀποκριθήσονται — «ответят»; ἑάλως — «ты взят, пленён» (ἁλίσκομαι); ἐν ἡμῖν δὲ κατελογίσθης — «к нам причислен» (καταλογίζομαι). Слова царей — 『…』."
  11: "κατέβη εἰς ᾅδου ἡ δόξα σου — «сошла в ад слава твоя»; ἡ πολλή σου εὐφροσύνη — «многое веселие твоё» (喜び). στρώσουσιν σῆψιν — «постелют гниение» (腐ったもの); κατακάλυμμα — «покров»; σκώληξ — «червь» (虫)."
  12: "ἑωσφόρος — «денница, утренняя звезда» (Венера); ὁ πρωῒ ἀνατέλλων — «восходящий утром»; в LXX и слав. «денница», это не имя «Люцифер» (его в тексте нет), поэтому 明けの明星. συνετρίβη εἰς τὴν γῆν — «сокрушился о землю»; ὁ ἀποστέλλων πρὸς πάντα τὰ ἔθνη — «посылающий ко всем народам»."
  13: "διανοία — «мысль, ум» (心); θήσω τὸν θρόνον μου — «поставлю престол мой»; καθιῶ — «сяду». ἐν ὄρει ὑψηλῷ ἐπὶ τὰ ὄρη τὰ ὑψηλὰ τὰ πρὸς βορρᾶν — «на горе высокой, на горах высоких, обращённых к северу»: повтор сохранён. Слова царя в сердце — 『…』 (13–14)."
  14: "ἀναβήσομαι ἐπάνω τῶν νεφελῶν — «взойду выше облаков»; ἔσομαι ὅμοιος τῷ ὑψίστῳ — «буду подобен Всевышнему» (至高の者). Здесь закрывается вложенная речь 『…』."
  15: "νῦν δέ — «ныне же»; εἰς ᾅδου καταβήσῃ — «сойдёшь в ад» (よみ); εἰς τὰ θεμέλια τῆς γῆς — «в основания земли»."
  16: "οἱ ἰδόντες σε — «видевшие тебя»; θαυμάσουσιν ἐπὶ σοί — «ужаснутся, удивятся о тебе» (驚く); ὁ παροξύνων τὴν γῆν — «раздражающий, возмущающий землю» (かき乱す); σείων βασιλεῖς — «потрясающий царей» (震えさせる). Их слова — 『…』 (16–17)."
  17: "θεὶς τὴν οἰκουμένην ὅλην ἔρημον — «положивший всю вселенную пустой»; τὰς πόλεις καθεῖλεν — «города разрушил»; τοὺς ἐν ἐπαγωγῇ — «тех, кто в пленении, в наведении» (捕らわれの身); οὐκ ἔλυσεν — «не освободил» (解き放つ)."
  18: "πάντες οἱ βασιλεῖς τῶν ἐθνῶν ἐκοιμήθησαν ἐν τιμῇ — «все цари народов почили в чести»; ἄνθρωπος ἐν τῷ οἴκῳ αὐτοῦ — «каждый в доме своём», т. е. в своей гробнице."
  19: "ῥιφήσῃ ἐν τοῖς ὄρεσιν — «будешь брошен в горах»; ὡς νεκρὸς ἐβδελυγμένος — «как мертвец мерзкий, отверженный»; ἐκκεκεντημένων μαχαίραις — «пронзённых мечами»; καταβαινόντων εἰς ᾅδου — «сходящих в ад». ὃν τρόπον ἱμάτιον ἐν αἵματι πεφυρμένον οὐκ ἔσται καθαρόν — «как одежда, в крови замаранная, не будет чиста»; слав. переносит эту фразу в начало 14:20, поэтому слав. 14:20 начинается с неё."
  20: "οὕτως οὐδὲ σὺ ἔσῃ καθαρός — «так и ты не будешь чист»; ὅτι τὴν γῆν μου ἀπώλεσας — «ибо землю Мою погубил»; τὸν λαόν μου ἀπέκτεινας — «народ Мой убил». οὐ μὴ μείνῃς εἰς τὸν αἰῶνα χρόνον — «не пребудешь в вечное время»; σπέρμα πονηρόν — «семя злое» (обращение: 悪い種よ)."
  21: "ἑτοίμασον — «приготовь»; σφαγῆναι — «быть закланными»; ταῖς ἁμαρτίαις τοῦ πατρός σου — «за грехи отца твоего»; ἵνα μὴ ἀναστῶσιν — «чтобы не восстали»; κληρονομήσωσιν τὴν γῆν — «наследовали землю». ἐμπλήσωσι τὴν γῆν πόλεων — «наполнили землю городами»; слав. «ратьми» (полками, войсками) — взято слав. чтение (軍勢), вариант LXX — «городами». Стих закрывает песнь 「…」."
  22: "ἐπαναστήσομαι αὐτοῖς — «восстану на них»; ἀπολῶ ὄνομα καὶ κατάλειμμα καὶ σπέρμα — «истреблю имя, остаток и семя» (名も、残りも、子孫も). λέγει κύριος σαβαωθ и τάδε λέγει κύριος — вводные формулы, вне кавычек; поэтому в стихе две короткие цитаты."
  23: "θήσω τὴν Βαβυλωνίαν ἔρημον — «положу Вавилонию пустой»; ὥστε κατοικεῖν ἐχίνους — «так что поселятся ежи» (ハリネズミ); ἔσται εἰς οὐδέν — «будет ни во что» (無に等しい). πηλοῦ βάραθρον — «яма грязи, болото» (泥の穴); εἰς ἀπώλειαν — «на погибель»."
  24: "ὃν τρόπον εἴρηκα, οὕτως ἔσται — «как Я сказал, так и будет»; ὃν τρόπον βεβούλευμαι, οὕτως μενεῖ — «как Я определил, так и пребудет» (βεβούλευμαι — perfect от βουλεύομαι)."
  25: "τοῦ ἀπολέσαι τοὺς Ἀσσυρίους — «чтобы погубить ассириян»: инфинитив цели, продолжает 14:24. ἀπὸ τῆς γῆς τῆς ἐμῆς καὶ ἀπὸ τῶν ὀρέων μου — «с земли Моей и с гор Моих»; ἔσονται εἰς καταπάτημα — «будут в попрание» (踏みつけられ); ἀφαιρεθήσεται ὁ ζυγός — «отнимется ярмо»; τὸ κῦδος — «слава, величие» (威光); ἀπὸ τῶν ὤμων — «с плеч»."
  26: "αὕτη ἡ βουλή — «этот совет, определение» (計画); ἣν βεβούλευται κύριος — «которое определил Господь»; ἡ χεὶρ ἡ ὑψηλή — «рука высокая, простёртая»; ἐπὶ πάντα τὰ ἔθνη τῆς οἰκουμένης — «на все народы вселенной»."
  27: "ἃ ὁ θεὸς ὁ ἅγιος βεβούλευται — «что определил Бог Святой»; τίς διασκεδάσει — «кто разорит, рассеет» (覆す); τὴν χεῖρα τὴν ὑψηλὴν τίς ἀποστρέψει — «высокую руку кто отвратит» (退ける). ru «Господь Саваоф» — по МТ, не внесено."
  28: "τοῦ ἔτους οὗ ἀπέθανεν Αχαζ ὁ βασιλεύς — «в год, когда умер царь Ахаз»; ἐγενήθη τὸ ῥῆμα τοῦτο — «было слово это». Надписание, не речь; кавычек нет."
  29: "μὴ εὐφρανθείητε — оптатив запрета «не радуйтесь»; πάντες οἱ ἀλλόφυλοι — «все иноплеменники», т. е. филистимляне (ペリシテ人 по корпусу). συνετρίβη ὁ ζυγὸς τοῦ παίοντος ὑμᾶς — «сокрушилось ярмо биющего вас»; ἐκ σπέρματος ὄφεων — «из семени змей»; ἔκγονα ἀσπίδων — «порождения аспидов» (蝮の子ら); ὄφεις πετόμενοι — «летучие змеи» (飛ぶ蛇)."
  30: "βοσκηθήσονται πτωχοὶ δι᾽ αὐτοῦ — «упасутся нищие через него»: неясно, о ком αὐτοῦ, сохранено 彼によって; ἄνδρες ἐπ᾽ εἰρήνης ἀναπαύσονται — «мужи в мире успокоятся» (平和のうちに休む). ἀνελεῖ λιμῷ τὸ σπέρμα σου — «истребит голодом семя твоё»; κατάλειμμα — «остаток» (残り). Подлежащее ἀνελεῖ не названо, поэтому в тексте страдательный оборот."
  31: "ὀλολύζετε, πύλαι πόλεων — «рыдайте, врата городов»; κεκραγέτωσαν πόλεις τεταραγμέναι — «пусть взывают города смущённые» (騒ぎ立つ都々). καπνὸς ἀπὸ βορρᾶ ἔρχεται — «дым с севера идёт»; οὐκ ἔστιν τοῦ εἶναι — «нет [никого], чтобы быть», т. е. не останется никого (слав. «несть, иже пребудет»)."
  32: "τί ἀποκριθήσονται βασιλεῖς ἐθνῶν — «что ответят цари народов» (ru «вестники народа» — по МТ). ὅτι κύριος ἐθεμελίωσεν Σιων — «что Господь основал Сион»; δι᾽ αὐτοῦ σωθήσονται οἱ ταπεινοὶ τοῦ λαοῦ — «через Него спасутся смиренные народа»; ταπεινοί — «смиренные, бедные» (へりくだる者)."
