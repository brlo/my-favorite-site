# jp-box, Амос, глава 6. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 6 (совпадает).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1–3 горе беспечным на Сионе и надеющимся на Самарию; Калне, Емаф,
# Геф; 4–6 роскошь: ложа из слоновой кости, козлята и телята, гусли, вино,
# масти — «не болезнуют о бедствии Иосифа»; 7 плен; 8 клятва Господа, город предан;
# 9–10 десять в доме, кости, «молчи»; 11 дома разбиты; 12–13 суд превращён
# в ярость, «не своей ли силою»; 14 народ против Израиля от Емафа до потока.
# Голоса: 1–7 — речь пророка; 8 — клятва и слово Господа в 「…»; 9–10 —
# повествование и диалог в 「…» (три реплики); 11–12 — речь пророка;
# 13 — речь пророка, слова народа в 「…»; 14 — слово Господа (формула в конце).
# Термины: 寝台 (κλίνη), 象牙 (ἐλεφάντινος), 香油 (μύρον), 捕囚 (αἰχμάλωτος),
# 誓う (ὀμνύω), 高ぶり (ὕβρις), 残りの者 (κατάλοιποι), 割れ目 (ῥάγμα).
# Имена: シオン, サマリア, カルネ, ハマト, ガテ, ペリシテ, ヨセフ, エフライム,
# ヤコブ, イスラエル.
#
tr_code: jp-box
book: am
chapter: 6
draft: true

verses:
  1: "シオンで安[やす]んじて暮[く]らし、サマリアの山[やま]を頼[たよ]りにする者[もの]たちは、わざわいだ。彼らは諸国民[しょこくみん]の初穂[はつほ]を取[と]り入[い]れ、自分[じぶん]たちもそこへ入[はい]って行[い]った、イスラエルの家[いえ]よ。"
  2: "カルネへ行[い]って見[み]よ。そこから大[おお]いなるハマトへ行き、そこからペリシテ人[じん]のガテへ下[くだ]れ。あなたがたはこれらの王国[おうこく]のうちの最[もっと]も強[つよ]い者[もの]たちよりも勝[まさ]っているのか。彼らの国境[こっきょう]はあなたがたの国境より広[ひろ]いのか。"
  3: "あなたがたは災[わざわ]いの日[ひ]を遠[とお]ざけ、偽[いつわ]りの安息日[あんそくび]を近[ちか]づける者[もの]たちである。"
  4: "あなたがたは象牙[ぞうげ]の寝台[ねだい]に横[よこ]たわり、寝床[ねどこ]の上[うえ]で贅沢[ぜいたく]にふるまい、群[む]れの中[なか]から子山羊[こやぎ]を、牛舎[ぎゅうしゃ]の中から乳飲[ちのみ]みの子牛[こうし]を取[と]って食[た]べる。"
  5: "あなたがたは竪琴[たてごと]の音[ね]に合[あ]わせて手[て]を打[う]ち、それを永[なが]く立[た]つものと考[かんが]え、過[す]ぎ去[さ]るものとは思[おも]わない。"
  6: "あなたがたは鉢[はち]でぶどう酒[しゅ]を飲[の]み、最[もっと]も良[よ]い香油[こうゆ]を塗[ぬ]り、ヨセフの破滅[はめつ]を悲[かな]しまない。"
  7: "それゆえ、今[いま]、彼らは力[ちから]ある者[もの]たちの先頭[せんとう]に立[た]って捕囚[ほしゅう]となり、エフライムから馬[うま]のいななきが絶[た]える。"
  8: "主[しゅ]である神[かみ]はご自身[じしん]にかけて誓[ちか]われた、と全能者[ぜんのうしゃ]である主[しゅ]は言[い]われる。「わたしはヤコブのすべての高[たか]ぶりを忌[い]み嫌[きら]い、その館[やかた]を憎[にく]む。わたしは町[まち]をそのすべての住[す]む者[もの]とともに渡[わた]す。」"
  9: "もし一[ひと]つの家[いえ]に十人[じゅうにん]が残[のこ]っても、彼らは死[し]に、残[のこ]りの者[もの]だけが残る。"
  10: "家[いえ]の親族[しんぞく]と焼[や]く者[もの]がその骨[ほね]を家から運[はこ]び出[だ]そうとして、家の主人[しゅじん]に言[い]う。「まだ、あなたのそばにいる者[もの]はいるか。」その者[もの]が「もういない」と言[い]うと、彼は言[い]う。「黙[だま]れ。主[しゅ]の名[な]を唱[とな]えてはならない。」"
  11: "見[み]よ、主[しゅ]は命[めい]じて、大[おお]きな家[いえ]を砕[くだ]き、小[ちい]さな家を裂[さ]かれる。"
  12: "馬[うま]が岩[いわ]の上[うえ]を駆[か]けるだろうか。雌牛[めうし]が黙[だま]って耕[たがや]すだろうか。あなたがたは裁[さば]きを怒[いか]りに、正[ただ]しさの実[み]を苦[にが]さに変[か]えた。"
  13: "あなたがたは取[と]るに足[た]らないことで喜[よろこ]び、「わたしたちは自分[じぶん]の力[ちから]で角[つの]を手[て]に入[い]れたではないか」と言[い]う。"
  14: "見[み]よ、わたしはあなたがたに対して一[ひと]つの民[たみ]を起[お]こす、と全能者[ぜんのうしゃ]である主[しゅ]は言[い]われる。それはあなたがたを圧迫[あっぱく]し、ハマトの入口[いりぐち]から西[にし]の流[なが]れまで、通[とお]り抜[ぬ]けられなくする。"

notes:
  1: "Οὐαὶ τοῖς ἐξουθενοῦσιν Σιων — «горе уничижающим Сион» (ἐξουθενέω — презирать, 軽んじる; シオン); τοῖς πεποιθόσιν ἐπὶ τὸ ὄρος Σαμαρείας — «надеющимся на гору Самарийскую» (πείθω — полагаться, 頼る); ἀπετρύγησαν ἀρχὰς ἐθνῶν — «пожали начатки народов» (τρυγάω — собирать виноград/жатву, 取り入れる; ἀρχή — начало/первенство, 初穂; место тёмное); εἰσῆλθον αὐτοί — «вошли сами»; οἶκος τοῦ Ισραηλ — обращение «дом Израилев». В ru (МТ) «именитым первенствующего народа» — иное понимание."
  2: "διὰβητε πάντες καὶ ἴδετε — «пройдите все и посмотрите» (διαβαίνω — переходить; ὁράω — 見る); в csl добавлено «халану» (Калне) — в LXX имени нет, внесено по паритету (カルネ); εἰς Εμαθ Ραββα — «в Емаф великий» (Εμαθ — ハマト; Ραββα — «великий», 大いなる); εἰς Γεθ ἀλλοφύλων — «в Геф иноплеменников» (Γεθ — ガテ; ἀλλόφυλοι — ペリシテ人); τὰς κρατίστας ἐκ πασῶν τῶν βασιλειῶν τούτων — «сильнейшие из всех царств сих» (κράτιστος — сильнейший, 最も強い者); εἰ πλείονα τὰ ὅρια αὐτῶν ἐστιν τῶν ὑμετέρων ὁρίων — «больше ли пределы их пределов ваших» (ὅρια — 国境)."
  3: "οἱ ἐρχόμενοι εἰς ἡμέραν κακήν — «приходящие в день злой» (ἔρχομαι — приходить; κακός — злой, 災いの日); οἱ ἐγγίζοντες καὶ ἐφαπτόμενοι σαββάτων ψευδῶν — «приближающиеся и прикасающиеся к субботам ложным» (ἐγγίζω — приближаться; ἐφάπτομαι — касаться; σάββατον — 安息日; ψευδής — ложный, 偽りの). В ru (МТ) «приближаете торжество насилия» — иное чтение, не внесено; место тёмное."
  4: "οἱ καθεύδοντες ἐπὶ κλινῶν ἐλεφαντίνων — «спящие на ложах слоновых» (κλίνη — ложе, 寝台; ἐλεφάντινος — 象牙の); κατασπαταλῶντες ἐπὶ ταῖς στρωμναῖς αὐτῶν — «роскошествующие на постелях своих» (κατασπαταλάω — жить в роскоши, 贅沢にふるまう; στρωμνή — постель, 寝床); ἔσθοντες ἐρίφους ἐκ ποιμνίων — «ядущие козлят из стад» (ἔριφος — козлёнок, 子山羊); μοσχάρια ἐκ μέσου βουκολίων γαλαθηνά — «телят из среды стад молочных» (μοσχάριον — телёнок, 子牛; γαλαθηνός — сосущий молоко, 乳飲みの)."
  5: "οἱ ἐπικροτοῦντες πρὸς τὴν φωνὴν τῶν ὀργάνων — «рукоплещущие при звуке орудий» (ἐπικροτέω — ударять/хлопать; ὄργανον — инструмент, 楽器; φωνή — 音); ὡς ἑστῶτα ἐλογίσαντο καὶ οὐχ ὡς φεύγοντα — «как стоящее (постоянное) помыслили, а не как бегущее» (ἵστημι — стоять; φεύγω — бежать/проходить; ἐλογίσαντο — 考えている). В ru (МТ) «как Давид» — добавка МТ, не внесена; место тёмное."
  6: "οἱ πίνοντες τὸν διυλισμένον οἶνον — «пьющие процеженное вино» (διυλίζω — процеживать, 澄んだ; csl «процеженое»); τὰ πρῶτα μύρα χριόμενοι — «первыми мастями мажущиеся» (μύρον — 香油; χρίω — мазать, 塗る); οὐκ ἔπασχον οὐδὲν ἐπὶ τῇ συντριβῇ Ιωσηφ — «нисколько не страдали о сокрушении Иосифа» (πάσχω — страдать, 悲しむ; συντριβή — сокрушение, 破滅)."
  7: "νῦν αἰχμάλωτοι ἔσονται ἀπ' ἀρχῆς δυναστῶν — «ныне пленниками будут от начала сильных» (αἰχμάλωτος — 捕囚; δυνάστης — властелин, 力ある者); ἐξαρθήσεται χρεμετισμὸς ἵππων ἐξ Εφραιμ — «отнимется ржание коней от Ефрема» (ἐξαίρω — отнимать; χρεμετισμός — ржание, いななき; Εφραιμ — エフライム). В ru (МТ) «кончится ликование изнеженных» — иное чтение, не внесено."
  8: "ὅτι ὤμοσεν κύριος καθ' ἑαυτοῦ — «ибо поклялся Господь Собою» (ὀμνύω — 誓う; καθ' ἑαυτοῦ — ご自身にかけて); βδελύσσομαι ἐγὼ πᾶσαν τὴν ὕβριν Ιακωβ — «гнушаюсь Я всяким высокомерием Иакова» (βδελύσσομαι — 忌み嫌う; ὕβρις — высокомерие, 高ぶり); τὰς χώρας αὐτοῦ μεμίσηκα — «села его возненавидел» (χώρα — 館/область; μισέω — 憎む); ἐξαρῶ πόλιν σὺν πᾶσιν τοῖς κατοικοῦσιν αὐτήν — «исторгну (предам) город со всеми живущими в нём» (ἐξαίρω — 渡す)."
  9: "ἐὰν ὑπολειφθῶσιν δέκα ἄνδρες ἐν οἰκίᾳ μιᾷ — «если останутся десять мужей в одном доме» (ὑπολείπω — оставлять, 残る); ἀποθανοῦνται — «умрут» (ἀποθνῄσκω — 死ぬ); ὑπολειφθήσονται οἱ κατάλοιποι — «останутся остальные» (κατάλοιποι — 残りの者)."
  10: "οἱ οἰκεῖοι αὐτῶν — «домашние их» (οἰκεῖος — родственник, 親族); παραβιῶνται — «сожигатели» (παραβιῶνται — редкое/гапакс, вероятно «погребатели», 焼く者); τοῦ ἐξενέγκαι τὰ ὀστᾶ αὐτῶν ἐκ τοῦ οἴκου — «вынести кости их из дома» (ἐκφέρω — выносить; ὀστᾶ — 骨); ἐρεῖ τοῖς προεστηκόσι τῆς οἰκίας — «скажет стоящим во главе дома» (προΐστημι — начальствовать, 家の主人); Εἰ ἔτι ὑπάρχει παρὰ σοί — «есть ли ещё у тебя» (ὑπάρχω — быть, いる); Οὐκέτι — «уже нет» (もういない); Σίγα — «молчи» (σιγάω — 黙る); ἕνεκα τοῦ μὴ ὀνομάσαι τὸ ὄνομα κυρίου — «ради того, чтобы не назвать имя Господне» (ὀνομάζω — называть, 唱える)."
  11: "ἰδοὺ κύριος ἐντέλλεται — «вот, Господь повелевает» (ἐντέλλομαι — повелевать, 命じる); πατάξει τὸν οἶκον τὸν μέγαν θλάσμασιν — «поразит дом большой сокрушениями (трещинами)» (πατάσσω — ударять, 砕く; θλάσμα — трещина/ушиб); τὸν οἶκον τὸν μικρὸν ῥάγμασιν — «дом малый разрывами» (ῥάγμα — разрыв/трещина, 裂け目)."
  12: "εἰ διώξονται ἐν πέτραις ἵπποι — «побегут ли по камням кони» (διώκω — гнать/бежать; πέτρα — 岩); εἰ παρασιωπήσονται ἐν θηλείαις — «будут ли молчать при самках (коровах)» (παρασιωπάω — молчать; θήλεια — самка, 雌牛; вероятно, искажение «пахать на коровах», ср. ru; тёмное место — передано «黙って耕す»); ὅτι ὑμεῖς ἐξεστρέψατε εἰς θυμὸν κρίμα — «ибо вы обратили в ярость суд» (ἐκστρέφω — извращать, 変える; θυμός — 怒り; κρίμα — 裁き); καρπὸν δικαιοσύνης εἰς πικρίαν — «плод правды в горечь» (καρπός — 実; δικαιοσύνη — 正しさ; πικρία — 苦さ)."
  13: "οἱ εὐφραινόμενοι ἐπ' οὐδενὶ λόγῳ — «веселящиеся о ничтожном слове» (εὐφραίνομαι — радоваться, 喜ぶ; οὐδεὶς λόγος — 取るに足らないこと); οἱ λέγοντες Οὐκ ἐν τῇ ἰσχύι ἡμῶν ἔσχομεν κέρατα — «говорящие: не в крепости ли нашей мы получили рога» (ἰσχύς — 力; κέρας — рог, 角 — о могуществе). Слова их — 「…」."
  14: "ἰδοὺ ἐγὼ ἐπεγείρω ἐφ' ὑμᾶς, οἶκος τοῦ Ισραηλ, ἔθνος — «вот, Я воздвигну на вас, дом Израилев, народ» (ἐπεγείρω — воздвигать, 起こす; ἔθνος — 民); ἐκθλίψουσιν ὑμᾶς — «будут теснить вас» (ἐκθλίβω — сжимать, 圧迫する); τοῦ μὴ εἰσελθεῖν εἰς Εμαθ — «так что не войти в Емаф» (εἰσέρχομαι — входить; Εμαθ — ハマト); ἕως τοῦ χειμάρρου τῶν δυσμῶν — «до потока западного» (χείμαρρος — 流れ; δυσμή — запад, 西)."
