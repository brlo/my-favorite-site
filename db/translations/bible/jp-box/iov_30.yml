verses:
  1: "「今[いま]や、わたしは嘲笑[あざわら]われる。最[もっと]も卑[いや]しい者[もの]たちが、今、わたしを一部[いちぶ]ながら戒[いまし]めている。わたしがその父[ちち]たちを侮[あなど]り、わたしの群[む]れの犬[いぬ]とともにするに値[あたい]しないとさえ思[おも]っていた者[もの]たちである。"
  2: "彼[かれ]らの手[て]の力[ちから]が、わたしにとって何[なん]の役[やく]に立[た]つというのか。彼らにあっては、終[お]わりさえも滅[ほろ]び去[さ]っている。"
  3: "乏[とぼ]しさと飢[う]えのうちに、彼[かれ]らは実[み]を結[むす]ばない。水[みず]のない荒[あ]れ地[ち]へと昨日[きのう]逃[に]げた者[もの]たち、その身[み]には迫[せま]りと惨[みじ]めさがある。"
  4: "彼[かれ]らは茂[しげ]みの塩草[しおくさ]を摘[つ]み取[と]り、塩草が彼らの食[た]べ物[もの]であった。彼らは辱[はずかし]められ、蔑[さげす]まれ、すべての善[よ]きものに乏[とぼ]しく、大[おお]きな飢[う]えのゆえに木[き]の根[ね]さえ噛[か]じっていた。"
  5: "盗人[ぬすびと]たちが、わたしに立[た]ち向[む]かった。"
  6: "その住[す]まいは岩[いわ]の洞[ほら]であった。"
  7: "彼[かれ]らはよく響[ひび]く茂[しげ]みの間[あいだ]で叫[さけ]び、野[の]の藪[やぶ]の下[した]に住[す]んでいた。"
  8: "愚[おろ]かな者[もの]の子[こ]ら、辱[はずかし]められた者[もの]たち、その名[な]も栄[は]えも地[ち]から消[き]え失[う]せている。"
  9: "しかし今[いま]、わたしは彼[かれ]らの竪琴[たてごと]となり、わたしは彼らの語[かた]り草[ぐさ]となっている。"
  10: "彼[かれ]らはわたしを忌[い]み嫌[きら]って遠[とお]くへ退[の]き、わたしの顔[かお]に向[む]かって唾[つば]を吐[は]くことさえためらわない。"
  11: "神[かみ]はご自分[じぶん]の矢筒[やづつ]を開[ひら]いてわたしを打[う]ち痛[いた]めると、彼[かれ]らはわたしの顔[かお]の手綱[たづな]を外[はず]して放[はな]った。"
  12: "彼[かれ]らは若枝[わかえだ]の右[みぎ]に立[た]ち、足[あし]を伸[の]ばし、わたしに向[む]かって破滅[はめつ]の道[みち]を造[つく]った。"
  13: "わたしの道[みち]は踏[ふ]みにじられ、彼[かれ]らはわたしの衣[ころも]を剥[は]ぎ取[と]った。"
  14: "神[かみ]はご自分[じぶん]の矢[や]でわたしを射抜[いぬ]き、思[おも]うままにわたしを扱[あつか]われた。わたしは苦痛[くつう]のうちに揉[も]みくしゃにされている。"
  15: "わたしの苦痛[くつう]は巡[めぐ]り来[く]る。わたしの希望[きぼう]は風[かぜ]のように消[き]え去[さ]り、わたしの救[すく]いは雲[くも]のように消[き]えた。"
  16: "今[いま]、わたしの魂[たましい]はわたしの上[うえ]に注[そそ]ぎ出[だ]され、苦痛[くつう]の日々[ひび]がわたしを捕[と]らえている。"
  17: "夜[よる]にはわたしの骨[ほね]が焼[や]け、わたしの筋[すじ]は解[と]け崩[くず]れる。"
  18: "神[かみ]は力[ちから]強[づよ]くわたしの衣[ころも]を掴[つか]み、上着[うわぎ]の襟[えり]のようにわたしを締[し]め付[つ]ける。"
  19: "あなたはわたしを土[つち]くれと同[おな]じものと見[み]なし、わたしの分[ぶん]は地[ち]と灰[はい]の中[なか]にある。"
  20: "わたしはあなたに向[む]かって叫[さけ]ぶのに、あなたはわたしに耳[みみ]を貸[か]されない。彼[かれ]らは立[た]ってわたしを見[み]つめている。"
  21: "あなたはあわれみなくわたしに襲[おそ]いかかり、強[つよ]い手[て]でわたしを打[う]ち据[す]えられた。"
  22: "あなたはわたしを苦痛[くつう]のうちに置[お]き、救[すく]いから遠[とお]ざけて投[な]げ捨[す]てられた。"
  23: "わたしは知[し]っている。死[し]がわたしを打[う]ち滅[ほろ]ぼすことを。すべて死[し]すべき者[もの]の家[いえ]は地[ち]だからである。"
  24: "わたしが自分[じぶん]に手[て]をかけることができたなら、どれほどよかっただろう。あるいは、他[た]の者[もの]に願[ねが]って、それをしてもらえたなら。"
  25: "わたしはすべての無力[むりょく]な者[もの]のために泣[な]き、困[こま]っている人[ひと]を見[み]て嘆[なげ]いたではないか。"
  26: "しかしわたしは善[よ]いことを待[ま]っていたのに、見[み]よ、かえって災[わざわ]いの日々[ひび]がわたしに降[ふ]りかかった。"
  27: "わたしの腹[はら]は煮[に]え立[た]って黙[だま]らない。貧[まず]しさの日々[ひび]がわたしに先[さき]んじて来[き]た。"
  28: "わたしは口[くち]を縛[しば]るものもなく、嘆[なげ]きながら歩[ある]き、集[つど]いのただ中[なか]に立[た]って叫[さけ]んでいる。"
  29: "わたしはセイレーンの兄弟[きょうだい]、鳥[とり]たちの友[とも]となった。"
  30: "わたしの皮膚[ひふ]はひどく黒[くろ]ずみ、骨[ほね]は熱[あつ]さに焼[や]かれた。"
  31: "わたしの竪琴[たてごと]は嘆[なげ]きに変[か]わり、わたしの歌[うた]はわたしにとって泣[な]き声[ごえ]となった。」"

notes:
  1: "Иов (продолжение речи с 29:2; цитата открывается здесь без вводной формулы и закрывается в 30:31). νυνὶ δὲ κατεγέλασάν μου — 今や、わたしは嘲笑われる; ἐλάχιστοι — 最も卑しい者たち; νουθετοῦσίν με ἐν μέρει — 一部ながら戒めている (ἐν μέρει — «отчасти»). ὧν ἐξουδένουν πατέρας αὐτῶν — その父たちを侮り (ἐξουδενόω — «ни во что ставить»); ἀξίους κυνῶν τῶν ἐμῶν νομάδων — わたしの群れの犬とともにするに値しない (νομάς — «пастуший, кочевой»; слав. «псов моих стад»)."
  2: "Иов. καί γε ἰσχὺς χειρῶν αὐτῶν ἵνα τί μοι; — 彼らの手の力が、わたしにとって何の役に立つというのか. ἐπ᾿ αὐτοὺς ἀπώλετο συντέλεια — 彼らにあっては終わりさえも滅び去っている (συντέλεια — «завершение, конец»; слав. «у них погибаше скончание»; тёмное место: вероятно, «их сила и конец погибли»)."
  3: "Иов. ἐν ἐνδείᾳ καὶ λιμῷ ἄγονος — 乏しさと飢えのうちに実を結ばない (ἄγονος — «бесплодный, одинокий»; слав. «безплоден»). οἱ φεύγοντες ἄνυδρον ἐχθὲς συνοχὴν καὶ ταλαιπωρίαν — 水のない荒れ地へ昨日逃げた者たち、その身には迫りと惨めさがある (ἐχθές — «вчера», здесь, вероятно, «недавно»; ἄνυδρον — безводное; συνοχή — «сжатие, стеснение»)."
  4: "Иов. οἱ περικλῶντες ἅλιμα ἐπὶ ἠχοῦντι — 茂みの塩草を摘み取り (ἅλιμα — «солёные травы, солерос»; ἐπὶ ἠχοῦντι — «у шумящего», тёмное место; слав. «обхождаху былие в дебрех», поэтому 茂み). οἵτινες ἅλιμα ἦν αὐτῶν τὰ σῖτα — 塩草が彼らの食べ物であった. ῥίζας ξύλων ἐμασῶντο ὑπὸ λιμοῦ μεγάλου — 大きな飢えのゆえに木の根さえ噛じっていた (μασάομαι — «жевать»)."
  5: "Иов. ἐπανέστησάν μοι κλέπται — 盗人たちが、わたしに立ち向かった (ἐπανίστημι — «восставать»; слав. «восташа на мя татие»). Синодальный здесь иначе («изгоняют их»), по масоретскому тексту; не вносим."
  6: "Иов. ὧν οἱ οἶκοι αὐτῶν ἦσαν τρῶγλαι πετρῶν — その住まいは岩の洞であった (τρώγλη — «пещера, нора»; слав. «пещеры каменны»)."
  7: "Иов. ἀνὰ μέσον εὐήχων βοήσονται — よく響く茂みの間で彼らは叫び (εὐήχων — «благозвучных»; слав. «от среды доброгласных»; тёмное место, возможно, «между кустами»). οἳ ὑπὸ φρύγανα ἄγρια διῃτῶντο — 野の藪の下に住んでいた (φρύγανον — «хворост, кустарник»)."
  8: "Иов. ἀφρόνων υἱοὶ καὶ ἀτίμων — 愚かな者の子ら、辱められた者たち (ἄφρων — «безумный»). ὄνομα καὶ κλέος ἐσβεσμένον ἀπὸ γῆς — その名も栄えも地から消え失せている (σβέννυμι — «гасить»)."
  9: "Иов. νυνὶ δὲ κιθάρα ἐγώ εἰμι αὐτῶν — 今や、わたしは彼らの竪琴となり (κιθάρα — 竪琴; слав. «гусли»). ἐμὲ θρύλημα ἔχουσιν — わたしは彼らの語り草となっている (θρύλημα — «притча, поговорка»)."
  10: "Иов. ἐβδελύξαντό με ἀποστάντες μακράν — 彼らはわたしを忌み嫌って遠くへ退き (βδελύσσομαι — «гнушаться»). ἀπὸ προσώπου μου οὐκ ἐφείσαντο πτύελον — わたしの顔に向かって唾を吐くことさえためらわない (φείδομαι — «щадить»; πτύελον — «плевок»)."
  11: "Иов. ἀνοίξας γὰρ φαρέτραν αὐτοῦ ἐκάκωσέν με — 神がご自分の矢筒を開いてわたしを打ち痛めると (φαρέτρα — «колчан»). χαλινὸν τοῦ προσώπου μου ἐξαπέστειλαν — 彼らはわたしの顔の手綱を外して放った: в LXX мн. ч. («они»), слав. «узду устам моим наложи» (ед. ч., «наложил»); взят LXX, т. к. дальше речь о «них» (30:12–14), слав. в notes."
  12: "Иов. ἐπὶ δεξιῶν βλαστοῦ ἐπανέστησαν — 彼らは若枝の右に立ち (βλαστός — «отпрыск, побег»; слав. «на десную отрасли»; тёмное место). πόδα αὐτῶν ἐξέτειναν — 足を伸ばし. ὡδοποίησαν ἐπ᾿ ἐμὲ τρίβους ἀπ᾿ ὠλείας αὐτῶν — わたしに向かって破滅の道を造った (ὠλεία — «погибель»; букв. «от погибели их»)."
  13: "Иов. ἐξετρίβησαν τρίβοι μου — わたしの道は踏みにじられ (ἐκτρίβω — «стирать, истреблять»). ἐξέδυσεν γάρ μου τὴν στολήν — 彼らはわたしの衣を剥ぎ取った: в LXX ед. ч. (ἐξέδυσεν, «он»), в слав. мн. ч. («совлекоша»); взят слав., как в церковном чтении."
  14: "Иов. βέλεσιν αὐτοῦ κατηκόντισέν με — 神はご自分の矢でわたしを射抜き (κατακοντίζω — «пронзать копьём/стрелой»). κέχρηταί μοι ὡς βούλεται — 思うままにわたしを扱われた. ἐν ὀδύναις πέφυρμαι — 苦痛のうちに揉みくしゃにされている (φύρω — «мешать, смешивать»; слав. «в болезнех скисохся»). Слав. 30:14 включает начало гр. 30:15 («обращаются же ми скорби»)."
  15: "Иов. ἐπιστρέφονται δέ μου αἱ ὀδύναι — わたしの苦痛は巡り来る (ἐπιστρέφω — «возвращаться»; в слав. эта строка в 14-м стихе). ᾤχετό μου ἡ ἐλπὶς ὥσπερ πνεῦμα — 希望は風のように消え去り. ὥσπερ νέφος ἡ σωτηρία μου — 救いは雲のように消えた (νέφος — облако)."
  16: "Иов. καὶ νῦν ἐπ᾿ ἐμὲ ἐκχυθήσεται ἡ ψυχή μου — 今、わたしの魂はわたしの上に注ぎ出され (ἐκχέω — «изливать»). ἔχουσίν με ἡμέραι ὀδυνῶν — 苦痛の日々がわたしを捕らえている."
  17: "Иов. νυκτὶ δέ μου τὰ ὀστᾶ συγκέκαυται — 夜にはわたしの骨が焼け (συγκαίω — «сжигать»; слав. «смятошася» — иное чтение). τὰ δὲ νεῦρά μου διαλέλυται — わたしの筋は解け崩れる (νεῦρον — «жила, сухожилие»; διαλύω — «разлагать»)."
  18: "Иов. ἐν πολλῇ ἰσχύι ἐπελάβετό μου τῆς στολῆς — 神は力強くわたしの衣を掴み (ἐπιλαμβάνομαι — «хватать»). ὥσπερ τὸ περιστόμιον τοῦ χιτῶνός μου περιέσχεν με — 上着の襟のようにわたしを締め付ける (περιστόμιον — «ворот, обшивка»; χιτών — «хитон»)."
  19: "Иов. ἥγησαι δέ με ἴσα πηλῷ — あなたはわたしを土くれと同じものと見なし (ἡγέομαι — «считать»; πηλός — «глина»). ἐν γῇ καὶ σποδῷ μου ἡ μερίς — わたしの分は地と灰の中にある (σποδός — 灰)."
  20: "Иов. κέκραγα δὲ πρὸς σὲ καὶ οὐκ εἰσακούεις μου — わたしはあなたに向かって叫ぶのに、あなたはわたしに耳を貸されない (εἰσακούω — «слышать, внимать»). ἔστησαν καὶ κατενόησάν με — 彼らは立ってわたしを見つめている (κατανοέω — «всматриваться»)."
  21: "Иов. ἐπέβης δέ μοι ἀνελεημόνως — あなたはあわれみなくわたしに襲いかかり (ἐπιβαίνω — «наступать»; ἀνελεημόνως — «без милости»; слав. «наидоша» — мн. ч., взят LXX ед. ч., т. к. речь к Богу). χειρὶ κραταιᾷ με ἐμαστίγωσας — 強い手でわたしを打ち据えられた (μαστιγόω — «бичевать»)."
  22: "Иов. ἔταξας δέ με ἐν ὀδύναις — あなたはわたしを苦痛のうちに置き (τάσσω — «ставить»). ἀπέρριψάς με ἀπὸ σωτηρίας — 救いから遠ざけて投げ捨てられた (ἀπορρίπτω — «отбрасывать»). Синодальный иначе («поднял меня и заставил носиться по ветру»), по масоретскому тексту."
  23: "Иов. οἶδα γὰρ ὅτι θάνατός με ἐκτρίψει — わたしは知っている、死がわたしを打ち滅ぼすことを (ἐκτρίβω — «стирать»). οἰκία γὰρ παντὶ θνητῷ γῆ — すべて死すべき者の家は地だからである (θνητός — «смертный»)."
  24: "Иов. εἰ γὰρ ὄφελον δυναίμην ἐμαυτὸν χειρώσασθαι — わたしが自分に手をかけることができたなら (χειρόομαι — «овладеть, схватить»; ὄφελον усиливает желание). ἢ δεηθείς γε ἑτέρου, καὶ ποιήσει μοι τοῦτο — あるいは他の者に願って、それをしてもらえたなら (δέομαι — «просить»)."
  25: "Иов. ἐγὼ δὲ ἐπὶ παντὶ ἀδυνάτῳ ἔκλαυσα — わたしはすべての無力な者のために泣き (ἀδύνατος — «бессильный, немощный»). ἐστέναξα δὲ ἰδὼν ἄνδρα ἐν ἀνάγκαις — 困っている人を見て嘆いた (στενάζω — «стенать»; ἀνάγκη — «нужда, теснота»)."
  26: "Иов. ἐγὼ δὲ ἐπέχων ἀγαθοῖς — しかしわたしは善いことを待っていたのに (ἐπέχω — «ждать, держаться»). ἰδοὺ συνήντησάν μοι μᾶλλον ἡμέραι κακῶν — 見よ、かえって災いの日々がわたしに降りかかった (συναντάω — «встречать»; μᾶλλον — «скорее»)."
  27: "Иов. ἡ κοιλία μου ἐξέζεσεν καὶ οὐ σιωπήσεται — わたしの腹は煮え立って黙らない (ἐκζέω — «вскипать»). προέφθασάν με ἡμέραι πτωχείας — 貧しさの日々がわたしに先んじて来た (προφθάνω — «предупреждать, опережать»; πτωχεία — «нищета»)."
  28: "Иов. στένων πεπόρευμαι ἄνευ φιμοῦ — わたしは口を縛るものもなく、嘆きながら歩き (φιμός — «намордник, узда»; слав. «без обуздания»). ἕστηκα δὲ ἐν ἐκκλησίᾳ κεκραγώς — 集いのただ中に立って叫んでいる (ἐκκλησία — «собрание»)."
  29: "Иов. ἀδελφὸς γέγονα σειρήνων — わたしはセイレーンの兄弟となった (σειρήν — «сирена», в LXX — пустынное существо, вероятно шакал или сова; слав. «сиринам»). ἑταῖρος δὲ στρουθῶν — 鳥たちの友となった (στρουθός — «воробей», также страус; у Синодального «страусам» по масоретскому тексту)."
  30: "Иов. τὸ δὲ δέρμα μου ἐσκότωται μεγάλως — わたしの皮膚はひどく黒ずみ (σκοτόω — «затемнять»). τὰ δὲ ὀστᾶ μου ἀπὸ καύματος — 骨は熱さに焼かれた (καῦμα — «жар»; слав. «сгореша от зноя»)."
  31: "Иов. ἀπέβη δὲ εἰς πάθος μου ἡ κιθάρα — わたしの竪琴は嘆きに変わり (πάθος — «страдание»; слав. «в плачь»). ὁ δὲ ψαλμός μου εἰς κλαυθμὸν ἐμοί — わたしの歌はわたしにとって泣き声となった (ψαλμός — «псалом, песнь»). Цитата закрывается здесь; 31:1 — продолжение речи Иова без формулы."
