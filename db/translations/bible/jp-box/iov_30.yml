# jp-box, Иов, глава 30. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc в книге только 1–2; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 30: продолжение речи Иова (с 29:2) — жалоба на презрение «меньших» (1–8),
# их насмешки и травля (9–15), страдание и оставленность Богом (16–23),
# прежнее сострадание и нынешнее горе (24–31). Вводной формулы нет: цитата
# открывается в ст. 1 и закрывается в ст. 31; в notes каждого стиха — Иов.
# Нумерация по gr: 31 стих; сдвиг csl только в 14–15 (слав. 14 включает начало гр. 15).
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).

