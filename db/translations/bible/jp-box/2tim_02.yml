# jp-box, 2-е Послание к Тимофею, глава 2. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 2: укрепляйся в благодати (1), передай учение верным людям (2),
# образы воина, атлета, земледельца (3–7), помни Христа и мои узы (8–10),
# «верно слово» — гимн (11–13), напоминание и делатель слова (14–15),
# пустословие и его расползание (16–18), основание Божие и его печать (19),
# сосуды в доме (20–21), бегство от юношеских похотей (22), кротость служителя (23–26).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет, <j>/<mo> не ставятся.
# 〔…〕 в главе нет: все слова в базе gr-lxx-byz есть. 2:14 — в базе ἐνώπιον τοῦ θεοῦ,
# поэтому 神の前で; церковный текст (jp-joc «主の前») читает κυρίου — замена, не добавление,
# 〔…〕 не ставится (ср. Деян 8:39), вариант отмечен в notes.
# 2:11–13 — «この言葉は真実である» и гимн: как гимн в 1 Тим 3:16 и Флп 2:6–11, без кавычек,
# не красное. 2:19 — две цитаты Писания (Числ 16:5; Ис 52:11) — в 「…」.
# Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

