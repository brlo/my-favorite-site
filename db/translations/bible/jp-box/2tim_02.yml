verses:
  1: "そこで、わたしの子[こ]よ、あなたはキリスト・イエスにある恵[めぐ]みによって強[つよ]くなりなさい。"
  2: "また、あなたが多[おお]くの証人[しょうにん]たちの前[まえ]でわたしから聞[き]いたことを、ほかの人[ひと]たちをも教[おし]える力[ちから]のある忠実[ちゅうじつ]な人[ひと]たちに委[ゆだ]ねなさい。"
  3: "あなたは、キリスト・イエスの良[よ]い兵士[へいし]として、わたしとともに苦[くる]しみを忍[しの]びなさい。"
  4: "兵[へい]として務[つと]めている者[もの]は、自分[じぶん]を募[つの]った者[もの]を喜[よろこ]ばせようとして、生活[せいかつ]の事[こと]に巻[ま]き込[こ]まれない。"
  5: "また、競技[きょうぎ]をする者[もの]でも、決[き]まった通[とお]りに競技[きょうぎ]をしなければ、冠[かんむり]を受[う]けることはできない。"
  6: "まず実[み]にあずかるべきは、働[はたら]く農夫[のうふ]である。"
  7: "わたしが言[い]っていることを考[かんが]えなさい。主[しゅ]はすべてのことについて、あなたに悟[さと]りを与[あた]えてくださるからである。"
  8: "イエス・キリストを思[おも]い起[おこ]しなさい。この方[かた]はダビデの子孫[しそん]として、死者[ししゃ]の中[なか]から復活[ふっかつ]された。これがわたしの福音[ふくいん]である。"
  9: "わたしはこの福音[ふくいん]のために、犯罪人[はんざいにん]のように鎖[くさり]につながれるほどに苦[くる]しんでいる。しかし、神[かみ]の言葉[ことば]は鎖[くさり]につながれてはいない。"
  10: "だから、わたしは選[えら]ばれた者[もの]たちのために、すべてのことを耐[た]え忍[しの]んでいる。彼[かれ]らもまた、キリスト・イエスにある救[すく]いを、永遠[えいえん]の栄光[えいこう]とともに得[え]るためである。"
  11: "この言葉[ことば]は真実[しんじつ]である。わたしたちは、もし彼[かれ]とともに死[し]んだのなら、彼[かれ]とともに生[い]きる。"
  12: "もし耐[た]え忍[しの]ぶなら、彼[かれ]とともに王[おう]として治[おさ]める。もし彼[かれ]を否[いな]むなら、彼[かれ]もわたしたちを否[いな]まれる。"
  13: "わたしたちが信[しん]じない者[もの]であっても、彼[かれ]は信[しんじつ]な方[かた]のままでいてくださる。ご自身[じしん]を否[いな]むことはできないからである。"
  14: "これらのことを思[おも]い起[おこ]させ、神[かみ]の前[まえ]で、言葉[ことば]について争[あらそ]わないように厳[おごそ]かに命[いの]じなさい。それは何[なに]の役[やく]にも立[た]たず、聞[き]く者[もの]たちを滅[ほろ]ぼすだけである。"
  15: "あなたは、自分[じぶん]を神[かみ]に認[みと]められる者[もの]、恥[は]じるところのない働[はたら]き人[びと]、真理[しんり]の言葉[ことば]を正[ただ]しく切[き]り分[わ]ける者[もの]として示[しめ]すように努[つと]めなさい。"
  16: "しかし、俗[ぞく]な、むなしいおしゃべりを避[さ]けなさい。人[ひと]々[びと]はますます不敬[ふけい]へと進[すす]んで行[い]くからである。"
  17: "彼[かれ]らの言葉[ことば]は、腐[くさ]れ病[やまい]のように広[ひろ]がって行[い]く。その中[なか]にヒメナイとピレトがいる。"
  18: "彼[かれ]らは真理[しんり]から外[はず]れ、復活[ふっかつ]はすでに起[お]こったと言[い]って、ある人[ひと]々[びと]の信仰[しんこう]を覆[くつがえ]している。"
  19: "しかし、神[かみ]の堅[かた]い基盤[きばん]は立[た]っていて、この印[しるし]を持[も]っている。「主[しゅ]はご自身[じしん]に属[ぞく]する者[もの]たちを知[し]っておられる。」また、「主[しゅ]の名[な]を唱[とな]える者[もの]はだれでも、不義[ふぎ]から離[はな]れよ。」"
  20: "大[おお]きな家[いえ]には、金[きん]や銀[ぎん]の器[うつわ]だけでなく、木[き]や土[つち]の器[うつわ]もあり、尊[とうと]い用[よう]のものもあれば、卑[いや]しい用[よう]のものもある。"
  21: "だから、だれでもこれらのものから自分[じぶん]を清[きよ]めるなら、聖[せい]とされ、主[しゅ]の用[よう]に適[かな]い、すべての善[ぜん]い働[はたら]きのために備[そな]えられた、尊[とうと]い用[よう]の器[うつわ]となる。"
  22: "また、若[わか]い時[とき]の欲[よく]を避[さ]け、義[ぎ]と信仰[しんこう]と愛[あい]と、清[きよ]い心[こころ]から主[しゅ]を呼[よ]び求[もと]める人[ひと]々[びと]との平和[へいわ]を追[お]い求[もと]めなさい。"
  23: "愚[おろ]かで、教養[きょうよう]のない論争[ろんそう]を避[さ]けなさい。それが争[あらそ]いを生[う]むことを知[し]っているからである。"
  24: "主[しゅ]の僕[しもべ]は争[あらそ]ってはならない。むしろ、すべての人[ひと]に対[たい]して柔和[にゅうわ]で、よく教[おし]え、耐[た]え忍[しの]び、"
  25: "逆[さか]らう者[もの]たちを柔和[にゅうわ]さをもって戒[いまし]めなさい。もしかすると、神[かみ]が彼[かれ]らに悔[く]い改[あらた]めを与[あた]え、真理[しんり]の知識[ちしき]に至[いた]らせてくださるかもしれない。"
  26: "そして、悪魔[あくま]に捕[とら]えられてその思[おも]いのままにされている彼[かれ]らが、目[め]を覚[さ]まして、悪魔[あくま]の罠[わな]から抜[ぬ]け出[だ]すかもしれない。"

notes:
  1: "Σὺ οὖν, τέκνον μου — そこで、わたしの子よ. ἐνδυναμοῦ — 強くなりなさい (imper. praes. pass.; «продолжай укрепляться»). ἐν τῇ χάριτι τῇ ἐν Χριστῷ Ἰησοῦ — キリスト・イエスにある恵みによって."
  2: "διὰ πολλῶν μαρτύρων — 多くの証人たちの前で (ручательство при передаче учения). παράθου — 委ねなさい (ср. 1:12, 1:14 παραθήκη — тот же корень). πιστοῖς ἀνθρώποις — 忠実な人たち. ἱκανοὶ ἔσονται καὶ ἑτέρους διδάξαι — ほかの人たちをも教える力のある."
  3: "συγκακοπάθησον — わたしとともに苦しみを忍びなさい (συν- — «вместе», ср. 1:8). ὡς καλὸς στρατιώτης Χριστοῦ Ἰησοῦ — キリスト・イエスの良い兵士として."
  4: "οὐδεὶς στρατευόμενος ἐμπλέκεται ταῖς τοῦ βίου πραγματείαις — 兵として務めている者は…生活の事に巻き込まれない (ἐμπλέκομαι — «запутываться»). τῷ στρατολογήσαντι — 自分を募った者. ἵνα…ἀρέσῃ — 喜ばせようとして."
  5: "ἐὰν δὲ καὶ ἀθλῇ τις — また、競技をする者でも. οὐ στεφανοῦται ἐὰν μὴ νομίμως ἀθλήσῃ — 決まった通りに競技をしなければ、冠を受けることはできない (νομίμως — «по правилам»)."
  6: "τὸν κοπιῶντα γεωργὸν δεῖ πρῶτον τῶν καρπῶν μεταλαμβάνειν — まず実にあずかるべきは、働く農夫である (δεῖ — «должно»; передано предикатом べき)."
  7: "νόει ὃ λέγω — わたしが言っていることを考えなさい. δώσει γάρ σοι ὁ κύριος σύνεσιν ἐν πᾶσιν — 主はすべてのことについて、あなたに悟りを与えてくださる (γάρ — からである)."
  8: "Μνημόνευε Ἰησοῦν Χριστόν — イエス・キリストを思い起こしなさい. ἐγηγερμένον ἐκ νεκρῶν — 死者の中から復活された (perfect). ἐκ σπέρματος Δαυίδ — ダビデの子孫として. κατὰ τὸ εὐαγγέλιόν μου — これがわたしの福音である (κατά — «согласно», передано утверждением)."
  9: "ἐν ᾧ κακοπαθῶ μέχρι δεσμῶν — 鎖につながれるほどに苦しんでいる. ὡς κακοῦργος — 犯罪人のように. ὁ λόγος τοῦ θεοῦ οὐ δέδεται — 神の言葉は鎖につながれてはいない (игра с δέσμιοι/δέδεται сохранена)."
  10: "διὰ τοῦτο πάντα ὑπομένω διὰ τοὺς ἐκλεκτούς — 選ばれた者たちのために、すべてのことを耐え忍んでいる. σωτηρίας τυχεῖν — 救いを得る. μετὰ δόξης αἰωνίου — 永遠の栄光とともに."
  11: "πιστὸς ὁ λόγος — この言葉は真実である (та же формула, что 1 Тим 1:15; 3:1; 4:9; Тит 3:8; здесь вводит гимн 11–13, гимн — без кавычек, как 1 Тим 3:16). εἰ γὰρ συναπεθάνομεν — もし彼とともに死んだのなら: в греч. аорист, но по-японски условная форма прошедшего. καὶ συζήσομεν — 彼とともに生きる (futurum — 生きる)."
  12: "εἰ ὑπομένομεν — もし耐え忍ぶなら. συμβασιλεύσομεν — 彼とともに王として治める (соцарствование). εἰ ἀρνησόμεθα — もし彼を否むなら. κἀκεῖνος ἀρνήσεται ἡμᾶς — 彼もわたしたちを否まれる (взаимность отрицания не смягчена)."
  13: "εἰ ἀπιστοῦμεν — わたしたちが信じない者であっても (противопоставление πίστις/ἀπιστία). ἐκεῖνος πιστὸς μένει — 彼は信実な方のままでいてくださる. ἀρνήσασθαι γὰρ ἑαυτὸν οὐ δύναται — ご自身を否むことはできない (не «не может солгать», а именно ἑαυτόν)."
  14: "Ταῦτα ὑπομίμνῃσκε — これらのことを思い起こさせ. διαμαρτυρόμενος ἐνώπιον τοῦ θεοῦ — 神の前で厳かに命じなさい (в базе θεοῦ; церковный текст читает κυρίου — замена без 〔…〕, ср. Деян 8:39). μὴ λογομαχεῖν — 言葉について争わない. ἐπ᾿ οὐδὲν χρήσιμον — 何の役にも立たず. ἐπὶ καταστροφῇ τῶν ἀκουόντων — 聞く者たちを滅ぼすだけ."
  15: "σπούδασον σεαυτὸν δόκιμον παραστῆσαι τῷ θεῷ — 自分を神に認められる者として示すように努めなさい. ἐργάτην ἀνεπαίσχυντον — 恥じるところのない働き人. ὀρθοτομοῦντα τὸν λόγον τῆς ἀληθείας — 真理の言葉を正しく切り分ける (ὀρθοτομέω — «прямо резать», образ делателя)."
  16: "βεβήλους κενοφωνίας — 俗な、むなしいおしゃべり. περιΐστασο — 避けなさい. ἐπὶ πλεῖον γὰρ προκύψουσιν ἀσεβείας — ますます不敬へと進んで行く (ἀσέβεια — противоположность εὐσέβεια 3:5, 3:12)."
  17: "ὡς γάγγραινα νομὴν ἕξει — 腐れ病のように広がって行く (γάγγραινα — «гангрена, антонов огонь»; редкое слово передано описательно, чтобы не ставить вне 常用漢字). Ὑμέναιος — ヒメナイ, Φίλητος — ピレト."
  18: "περὶ τὴν ἀλήθειαν ἠστόχησαν — 真理から外れ (ἀστοχέω — «промахнуться»). τὴν ἀνάστασιν ἤδη γεγονέναι — 復活はすでに起こった. ἀνατρέπουσιν τήν τινων πίστιν — ある人々の信仰を覆している."
  19: "στερεὸς θεμέλιος τοῦ θεοῦ ἕστηκεν — 神の堅い基盤は立っていて (perfect — стоит и стоит). σφραγίς — 印. Числ 16:5: Ἔγνω κύριος τοὺς ὄντας αὐτοῦ — 主はご自身に属する者たちを知っておられる; Ис 52:11: Ἀποστήτω ἀπὸ ἀδικίας πᾶς ὁ ὀνομάζων τὸ ὄνομα κυρίου — 主の名を唱える者はだれでも、不義から離れよ. Обе цитаты в 「…」, союз καί передан また."
  20: "σκεύη χρυσᾶ καὶ ἀργυρᾶ…ξύλινα καὶ ὀστράκινα — 金や銀の器…木や土の器 (ὀστράκινος — глиняный). ἃ μὲν εἰς τιμήν, ἃ δὲ εἰς ἀτιμίαν — 尊い用のものもあれば、卑しい用のものもある (τιμή/ἀτιμία — честь/бесчестие)."
  21: "ἐκκαθάρῃ ἑαυτὸν ἀπὸ τούτων — これらのものから自分を清める. σκεῦος εἰς τιμήν — 尊い用の器. ἡγιασμένον — 聖とされ. εὔχρηστον τῷ δεσπότῃ — 主の用に適い (δεσπότης — «владыка», 主[しゅ]). εἰς πᾶν ἔργον ἀγαθὸν ἡτοιμασμένον — すべての善い働きのために備えられた."
  22: "νεωτερικὰς ἐπιθυμίας — 若い時の欲. φεῦγε — 避け. δίωκε — 追い求めなさい (образ погони, как в 4:7). δικαιοσύνην, πίστιν, ἀγάπην — 義と信仰と愛. εἰρήνην μετὰ τῶν ἐπικαλουμένων τὸν κύριον ἐκ καθαρᾶς καρδίας — 清い心から主を呼び求める人々との平和 (μετά отнесено к εἰρήνην, как у jp-joc; возможно и при δίωκε — двусмысленность отмечена, не разрешена)."
  23: "μωρὰς καὶ ἀπαιδεύτους ζητήσεις — 愚かで、教養のない論争 (ζήτησις — «изыскание, спор»). παραιτοῦ — 避けなさい. γεννῶσιν μάχας — 争いを生む."
  24: "δοῦλον δὲ κυρίου οὐ δεῖ μάχεσθαι — 主の僕は争ってはならない. ἤπιον — 柔和. πρὸς πάντας — すべての人に対して. διδακτικόν — よく教え. ἀνεξίκακον — 耐え忍び (букв. «терпящий зло»); предложение продолжается в 25 ст."
  25: "ἐν πραΰτητι παιδεύοντα τοὺς ἀντιδιατιθεμένους — 逆らう者たちを柔和さをもって戒めなさい (παιδεύω — «вразумлять», не «наказывать»). μήποτε δώῃ αὐτοῖς ὁ θεὸς μετάνοιαν — もしかすると、神が彼らに悔い改めを与え…かもしれない (μήποτε — «не даст ли»). εἰς ἐπίγνωσιν ἀληθείας — 真理の知識に至らせる."
  26: "ἀνανήψωσιν — 目を覚ます (букв. «прийти в себя», как после опьянения). ἐκ τῆς τοῦ διαβόλου παγίδος — 悪魔の罠から. ἐζωγρημένοι ὑπ᾿ αὐτοῦ — 悪魔に捕えられて (ζωγρέω — «брать живым»). εἰς τὸ ἐκείνου θέλημα — その思いのままにされている."
