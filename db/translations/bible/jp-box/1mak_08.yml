verses:
  1: "ユダはローマ人[じん]の名[な]を聞[き]いた。彼らは力[ちから]において強[つよ]く、自分[じぶん]に加[くわ]わる者[もの]すべてを喜[よろこ]んで受[う]け入[い]れ、彼らのもとへ来[く]る者[もの]とは誰[だれ]とでも友情[ゆうじょう]を結[むす]び、また力[ちから]において強[つよ]いというのである。"
  2: "人[ひと]々[びと]は彼に、彼らの戦[たたか]いと、ガラティア人[じん]に対して行[おこな]った武勇[ぶゆう]のわざを語[かた]った。すなわち、彼らを打[う]ち負[ま]かして貢[みつ]ぎの下[した]に置[お]いたこと、"
  3: "また、イスパニアの地[ち]で、そこにある銀[ぎん]と金[きん]の鉱山[こうざん]を手[て]に入[い]れるために行[おこな]ったことを語[かた]った。"
  4: "彼らはその知恵[ちえ]と忍耐[にんたい]によってその地方[ちほう]のすべてを手[て]に入[い]れた。その地方[ちほう]は彼らから非常[ひじょう]に遠[とお]く離[はな]れていたにもかかわらず、また地[ち]の果[は]てから彼らに攻[せ]めかかって来[き]た王[おう]たちをも砕[くだ]き、大[おお]きな打撃[だげき]を与[あた]え、残[のこ]った者[もの]たちは年[とし]ごとに彼らに貢[みつ]ぎを納[おさ]めている。"
  5: "彼らはまた、フィリッポスとキティオンの王[おう]ペルセウス、および彼らに立[た]ち向[む]かった者[もの]たちを戦[たたか]いで砕[くだ]き、彼らを支配[しはい]した。"
  6: "また、アジアの大王[だいおう]アンティオコスが百二十[ひゃくにじゅう]の象[ぞう]、騎兵[きへい]、戦車[せんしゃ]、そしてきわめて多[おお]くの軍勢[ぐんぜい]を率[ひき]いて彼らに戦[たたか]いを仕掛[しか]けて来[き]たが、彼は彼らに砕[くだ]かれた。"
  7: "彼らは彼を生[い]けどりにし、彼と彼の後[あと]に王[おう]となる者[もの]たちに大[おお]きな貢[みつ]ぎを納[おさ]めさせ、人質[ひとじち]を出[だ]させ、国境[こっきょう]の画定[かくてい]を認[みと]めさせた。"
  8: "また、インド、メディア、リュディアの地方[ちほう]、すなわち彼の最[もっと]も良[よ]い地方[ちほう]を彼から取[と]り上[あ]げて、王[おう]エウメネスに与[あた]えた。"
  9: "また、ギリシアから出[で]た者[もの]たちが彼らを滅[ほろ]ぼそうと企[くわだ]てたが、"
  10: "その計画[けいかく]が彼らに知[し]らされると、彼らは一[ひと]人[り]の将軍[しょうぐん]を彼らに遣[つか]わして戦[たたか]い、彼らのうち多[おお]くの者[もの]が傷[きず]ついて倒[たお]れ、彼らはその妻[つま]たちと子[こ]どもたちを捕[と]らえ、彼らを略奪[りゃくだつ]してその地[ち]を支配[しはい]し、その要害[ようがい]を壊[こわ]して、今日[きょう]まで彼らを奴隷[どれい]としている。"
  11: "また、かつて彼らに逆[さか]らった残[のこ]りの王国[おうこく]と島[しま]々[じま]を滅[ほろ]ぼして奴隷[どれい]とした。"
  12: "しかし、自分[じぶん]たちの友[とも]と、自分[じぶん]たちに信頼[しんらい]を寄[よ]せる者[もの]との間[あいだ]では友情[ゆうじょう]を保[たも]った。彼らは近[ちか]くも遠[とお]くの王[おう]たちを支配[しはい]し、その名[な]を聞[き]く者[もの]は皆[みな]、彼らを恐[おそ]れた。"
  13: "彼らが助[たす]け、王[おう]として立[た]てようと思[おも]う者[もの]は王[おう]となり、望[のぞ]む者[もの]は退[しりぞ]けられる。彼らは非常[ひじょう]に高[たか]く上[あ]げられた。"
  14: "しかし、このすべてのうちで、彼らのうち誰[だれ]ひとりとして王冠[おうかん]をかぶらず、紫[むらさき]の衣[ころも]をまとってこれを誇[ほこ]ることもなかった。"
  15: "彼らは自分[じぶん]たちのために議会[ぎかい]を設[もう]け、三百二十[さんびゃくにじゅう]人[にん]の議員[ぎいん]が毎日[まいにち]、絶[た]えず民[たみ]のことをよく整[ととの]えるために相談[そうだん]した。"
  16: "そして一年[いちねん]ごとに一[ひと]人[り]の人[ひと]に自分[じぶん]たちを治[おさ]めることと、その全土[ぜんど]を支配[しはい]することを任[まか]せ、すべての者[もの]がその一[ひと]人[り]に従[したが]った。彼らの間[あいだ]には妬[ねた]みも嫉[そね]みもなかった。"
  17: "ユダはヨハネ（アッコスの子[こ]）の子[こ]エウポレモスと、エレアザルの子[こ]ヤソンを選[えら]び、友情[ゆうじょう]と同盟[どうめい]を結[むす]ぶために彼らをローマへ遣[つか]わした。"
  18: "すなわち、彼らからくびきを取[と]り除[のぞ]くためであった。ギリシア人[じん]の王国[おうこく]がイスラエルを奴隷[どれい]の状態[じょうたい]に従属[じゅうぞく]させているのを見[み]たからである。"
  19: "彼らはローマへ行[い]った。道[みち]は非常[ひじょう]に長[なが]かったが、彼らは議会[ぎかい]に入[はい]って答[こた]えて言[い]った。"
  20: "「ユダ・マッカバイオスとその兄弟[きょうだい]たち、およびユダヤ人[じん]の多[おお]くの者[もの]たちが、あなたがたと同盟[どうめい]と平和[へいわ]を結[むす]び、わたしたちをあなたがたの同盟者[どうめいしゃ]また友[とも]として記[き]してもらうために、わたしたちをあなたがたのもとへ遣[つか]わした。」"
  21: "この言葉[ことば]は彼らの前[まえ]で良[よ]いと認[みと]められた。"
  22: "これが、彼らが青銅[せいどう]の板[いた]に書[か]き記[しる]してエルサレムへ送[おく]った手紙[てがみ]の写[うつ]しであり、平和[へいわ]と同盟[どうめい]の記念[きねん]としてそこに置[お]かれたものである。"
  23: "「ローマ人[じん]とユダヤ人[じん]の民[たみ]に、海[うみ]においても陸[りく]においても、永遠[えいえん]に良[よ]いことがあるように。剣[つるぎ]と敵[てき]が彼らから遠[とお]ざけられるように。"
  24: "もしローマに、あるいはその全[ぜん]支配[しはい]のうちにあるそのすべての同盟者[どうめいしゃ]に、まず戦[たたか]いが起[お]こったなら、"
  25: "ユダヤ人[じん]の民[たみ]は、時[とき]が彼らに示[しめ]すとおりに、満[み]ちた心[こころ]をもって彼らのために戦[たたか]う。"
  26: "また彼らは、ローマが定[さだ]めたとおりに、戦[たたか]う者[もの]たちに麦[むぎ]、武器[ぶき]、銀[ぎん]、船[ふね]を与[あた]えず、援助[えんじょ]もしない。そして何[なに]も受[う]け取[と]らずにその務[つと]めを守[まも]る。"
  27: "同じように、もしユダヤ人[じん]の民[たみ]にまず戦[たたか]いが起[こ]こったなら、ローマ人[じん]は心[こころ]から、時[とき]が彼らに示[しめ]すとおりに彼らのために戦[たたか]う。"
  28: "また、戦[たたか]う者[もの]たちには、ローマが定[さだ]めたとおりに麦[むぎ]、武器[ぶき]、銀[ぎん]、船[ふね]は与[あた]えられない。そして彼らはこの務[つと]めを、偽[いつわ]りなく守[まも]る。」"
  29: "これらの言葉[ことば]どおりに、ローマ人[じん]はユダヤ人[じん]の民[たみ]と定[さだ]めた。"
  30: "もしこれらの言葉[ことば]の後[のち]に、双方[そうほう]が何[なに]かを加[くわ]えるか除[のぞ]くかを相談[そうだん]するなら、自分[じぶん]たちの選択[せんたく]によってそうし、加[くわ]えたものも除[のぞ]いたものも有効[ゆうこう]とする。"
  31: "また、王[おう]デメトリオスが彼らに対して行[おこな]っている悪[あく]については、わたしたちは彼にこう書[か]き送[おく]った。「なぜあなたは、わたしたちの友[とも]である同盟者[どうめいしゃ]ユダヤ人[じん]の上[うえ]に、あなたのくびきを重[おも]くしたのか。"
  32: "もし彼らが再[ふたた]びあなたについてわたしたちに訴[うった]えて来[く]るなら、わたしたちは彼らのために裁[さば]きを行[おこな]い、海[うみ]からも陸[りく]からもあなたと戦[たたか]う。」"

notes:
  1: "τὸ ὄνομα τῶν Ῥωμαίων — «имя Римлян» (ローマ人[じん]); δυνατοὶ ἰσχύι — «сильные крепостью»; εὐδοκοῦσιν ἐν πᾶσιν τοῖς προστιθεμένοις αὐτοῖς — «благоволят ко всем присоединяющимся к ним» (προστίθημι); ἱστῶσιν αὐτοῖς φιλίαν — «устанавливают с ними дружбу» (φιλία — 友情[ゆうじょう]). В конце греч. повтор «δυνατοὶ ἰσχύι» — сохранён."
  2: "διηγήσαντο αὐτῷ τοὺς πολέμους — «рассказали ему войны их»; τὰς ἀνδραγαθίας, ἃς ποιοῦσιν ἐν τοῖς Γαλάταις — «мужества, которые оказывают на Галатах» (ἀνδραγαθία — 武勇[ぶゆう]; ガラティア人[じん]); κατεκράτησαν αὐτῶν — «одолели их»; ἤγαγον αὐτοὺς ὑπὸ φόρον — «привели их под дань» (φόρος — 貢[みつ]ぎ)."
  3: "ὅσα ἐποίησαν ἐν χώρᾳ Σπανίας — «что сделали в стране Испании» (イスパニア); τοῦ κατακρατῆσαι τῶν μετάλλων τοῦ ἀργυρίου καὶ τοῦ χρυσίου — «чтобы овладеть рудниками серебра и золота» (μέταλλον — 鉱山[こうざん]). Слав. включает сюда также «и одержаша всяко место…» — в LXX это начало 8:4, отмечено."
  4: "κατεκράτησαν τοῦ τόπου παντὸς τῇ βουλῇ αὐτῶν καὶ τῇ μακροθυμίᾳ — «овладели всем краем разумом своим и долготерпением» (βουλή — 知恵[ちえ]; μακροθυμία — 忍耐[にんたい]); ἀπέχων μακρὰν ἀπ' αὐτῶν σφόδρα — «отстоящий далеко от них весьма»; ἀπ' ἄκρου τῆς γῆς — «от края земли»; ἕως συνέτριψαν αὐτοὺς — «доколе не сокрушили их»; ἐπάταξαν ἐν αὐτοῖς πληγὴν μεγάλην — «поразили в них поражением великим»."
  5: "τὸν Φίλιππον — フィリッポス; τὸν Περσέα Κιτιέων βασιλέα — «Персея, царя Китийского» (ペルセウス; Κίτιον — キティオン); τοὺς ἐπηρμένους ἐπ' αὐτούς — «поднявшихся на них» (ἐπαίρω); συνετρίψαν… ἐν πολέμῳ — «сокрушили… на войне»."
  6: "Ἀντίοχον τὸν μέγαν βασιλέα τῆς Ἀσίας — «Антиоха, великого царя Азии» (アンティオコス大王); ἑκατὸν εἴκοσι ἐλέφαντας — «сто двадцать слонов»; ἵππον καὶ ἅρματα — «конницу и колесницы»; δύναμιν πολλὴν σφόδρα — «силу весьма великую»; συνετρίβη ὑπ' αὐτῶν — «сокрушён был ими»."
  7: "ἔλαβον αὐτὸν ζῶντα — «взяли его живым»; ἔστησαν… διδόναι… φόρον μέγαν — «постановили… давать… дань великую»; ὅμηρα — «заложников» (ὅμηρα — 人質[ひとじち]); διαστολήν — «разграничение (раздел)» (διαστολή — 国境[こっきょう]の画定[かくてい])."
  8: "χώραν τὴν Ἰνδικὴν καὶ Μηδίαν καὶ Λυδίαν — «страну Индийскую, Мидию и Лидию» (メディア, リュディア); ἀπὸ τῶν καλλίστων χωρῶν αὐτῶν — «из прекраснейших стран его»; ἔδωκαν αὐτὰς Εὐμένει τῷ βασιλεῖ — «отдали их царю Евмену» (エウメネス)."
  9: "οἱ ἐκ τῆς Ἑλλάδος — «бывшие из Еллады» (ギリシア); ἐβουλεύσαντο ἐλθεῖν καὶ ἐξᾶραι αὐτούς — «замыслили прийти и истребить их»."
  10: "ἐγνώσθη ὁ λόγος αὐτοῖς — «стало известно им (дело)»; στρατηγὸν ἕνα — «одного военачальника» (στρατηγός — 将軍[しょうぐん]); ἔπεσον… τραυματίαι πολλοί — «пали… раненых многие»; ᾐχμαλώτισαν — «взяли в плен» (αἰχμαλωτίζω); ἐπρονόμευσαν — «разграбили» (προνομεύω); κατεδουλώσαντο — «поработили» (καταδουλόω)."
  11: "τὰς ἐπιλοίπους βασιλείας καὶ τὰς νήσους — «остальные царства и острова»; ὅσοι ποτὲ ἀντέστησαν αὐτοῖς — «которые когда-либо восстали против них»; κατέφθειραν καὶ ἐδούλωσαν — «истребили и поработили» (καταφθείρω, δουλόω). Слав. относит «μετὰ δὲ τῶν φίλων…» сюда, в LXX — начало 8:12, отмечено."
  12: "μετὰ δὲ τῶν φίλων αὐτῶν καὶ τῶν ἐπαναπαυομένων αὐτοῖς συνετήρησαν φιλίαν — «с друзьями своими и уповающими на них сохранили дружбу» (ἐπαναπαύομαι — опираться); κατεκράτησαν τῶν βασιλέων τῶν ἐγγὺς καὶ τῶν μακράν — «овладели царями близкими и дальними»; ὅσοι ἤκουον τὸ ὄνομα αὐτῶν, ἐφοβοῦντο — «кто слышал имя их, боялись»."
  13: "οἷς δ' ἂν βούλωνται βοηθεῖν καὶ βασιλεύειν, βασιλεύουσιν — «кому захотят помочь и воцарить, те царствуют»; οὓς δ' ἂν βούλωνται, μεθιστῶσιν — «кого захотят, тех смещают» (μεθίστημι — 退[しりぞ]ける); ὑψώθησαν σφόδρα — «возвысились весьма»."
  14: "οὐκ ἐπέθεντο αὐτῶν οὐδὲ εἷς διάδημα — «не возложил из них ни один венца» (ἐπιτίθημι; διάδημα — 王冠[おうかん]); περιεβάλοντο πορφύραν — «не облеклись в порфиру» (πορφύρα — 紫[むらさき]の衣[ころも]); ἁδρυνθῆναι ἐν αὐτῇ — «чтобы величаться ею» (ἁδρύνω)."
  15: "βουλευτήριον ἐποίησαν ἑαυτοῖς — «сделали себе совет (сенат)» (βουλευτήριον — 議会[ぎかい]); καθ' ἡμέραν ἐβουλεύοντο τριακόσιοι καὶ εἴκοσι — «ежедневно совещались триста двадцать» (βουλεύομαι); περὶ τοῦ πλήθους τοῦ εὐκοσμεῖν αὐτούς — «о народе, чтобы благоустроять его» (εὐκοσμέω)."
  16: "πιστεύουσιν ἑνὶ ἀνθρώπῳ ἄρχειν αὐτῶν κατ' ἐνιαυτόν — «вверяют одному человеку начальствовать над ними на год» (πιστεύω — вверять); κυριεύειν πάσης τῆς γῆς αὐτῶν — «владеть всею землёю их»; οὐκ ἔστιν φθόνος οὐδὲ ζῆλος — «нет ни зависти, ни ревности» (φθόνος, ζῆλος)."
  17: "ἐπελέξατο Ιουδας τὸν Εὐπόλεμον υἱὸν Ιωαννου τοῦ Ακκως — «избрал Иуда Евполема, сына Иоанна, сына Аккоса» (エウポレモス); Ἰάσονα υἱὸν Ελεαζαρου — «Иасона, сына Елеазара» (ヤソン); στῆσαι φιλίαν καὶ συμμαχίαν — «установить дружбу и союз» (συμμαχία — 同盟[どうめい])."
  18: "ἆραι τὸν ζυγὸν ἀπ' αὐτῶν — «снять с них иго (ярмо)» (ζυγός — くびき); εἶδον τὴν βασιλείαν τῶν Ἑλλήνων καταδουλουμένους τὸν Ισραηλ δουλείᾳ — «увидели, что царство Еллинов порабощает Израиля в рабство» (καταδουλόω; δουλεία — 奴隷[どれい]の状態[じょうたい])."
  19: "ἡ ὁδὸς πολλὴ σφόδρα — «путь весьма долгий»; εἰσήλθοσαν εἰς τὸ βουλευτήριον — «вошли в совет (сенат)»; ἀπεκρίθησαν — «отвечали» (ἀποκρίνομαι)."
  20: "Ιουδας ὁ καὶ Μακκαβαῖος — «Иуда, он же Маккавей»; τὸ πλῆθος τῶν Ιουδαίων — «множество Иудеев»; στῆσαι μεθ' ὑμῶν συμμαχίαν καὶ εἰρήνην — «установить с вами союз и мир»; γραφῆναι ἡμᾶς συμμάχους καὶ φίλους — «чтобы мы были записаны союзниками и друзьями». Речь послов — 「…」."
  21: "ἤρεσεν ὁ λόγος ἐνώπιον αὐτῶν — «угодно было слово пред ними»."
  22: "τὸ ἀντίγραφον τῆς ἐπιστολῆς — «список письма» (ἀντίγραφον); ἐπὶ δέλτοις χαλκαῖς — «на досках медных» (δέλτος — 板[いた]; χαλκοῦς — 青銅[せいどう]の); μνημόσυνον εἰρήνης καὶ συμμαχίας — «памятник мира и союза» (μνημόσυνον — 記念[きねん])."
  23: "Καλῶς γένοιτο — «да будет хорошо» (пожелание); ἐν τῇ θαλάσσῃ καὶ ἐπὶ τῆς ξηρᾶς — «на море и на суше» (ξηρά — 陸[りく]); εἰς τὸν αἰῶνα — «в век»; ῥομφαία καὶ ἐχθρὸς μακρυνθείη — «меч и враг да удалятся» (μακρύνω). Начало договора — 「…」."
  24: "ἐὰν δὲ ἐνστῇ πόλεμος — «если настанет война» (ἐνίστημι); Ῥώμῃ προτέρᾳ — «Риму первому»; ἐν πάσῃ τῇ κυριείᾳ αὐτῶν — «во всём владычестве их» (κυριεία)."
  25: "συμμαχήσει τὸ ἔθνος τῶν Ιουδαίων — «будет союзно воевать народ Иудейский» (συμμαχέω); ὡς ἂν ὁ καιρὸς ὑπογράφῃ αὐτοῖς — «как время предпишет (укажет) им» (ὑπογράφω); καρδίᾳ πλήρει — «сердцем полным»."
  26: "οὐ δώσουσιν οὐδὲ ἐπαρκέσουσιν — «не дадут и не доставят» (ἐπαρκέω); σῖτον, ὅπλα, ἀργύριον, πλοῖα — «хлеб, оружие, серебро, корабли»; ὡς ἔδοξεν Ῥώμῃ — «как угодно было Риму» (δοκέω); φυλάξονται τὰ φυλάγματα αὐτῶν — «будут соблюдать обязанности свои» (φύλαγμα); οὐθὲν λαβόντες — «ничего не взяв»."
  27: "συμμαχήσουσιν οἱ Ῥωμαῖοι ἐκ ψυχῆς — «будут союзно воевать Римляне от души»; ὡς ἂν αὐτοῖς ὁ καιρὸς ὑπογράφῃ — «как время им предпишет». В конце стиха в модуле стоит вопросительный знак — вероятно, механическая порча; в тексте утверждение, отмечено."
  28: "τοῖς συμμαχοῦσιν οὐ δοθήσεται — «соратникам не будет дано» (συμμαχέω); ὡς ἔδοξεν Ῥώμῃ — «как угодно Риму»; φυλάξονται τὰ φυλάγματα ταῦτα — «будут соблюдать эти обязанности»; οὐ μετὰ δόλου — «не с коварством (без обмана)». Конец договора — закрывающая 」."
  29: "κατὰ τοὺς λόγους τούτους — «по этим словам»; οὕτως ἔστησαν Ῥωμαῖοι τῷ δήμῳ τῶν Ιουδαίων — «так постановили Римляне народу Иудейскому» (δῆμος — 民[たみ])."
  30: "βουλεύσωνται… προσθεῖναι ἢ ἀφελεῖν — «совещаются… прибавить или убавить» (προστίθημι, ἀφαιρέω); ποιήσονται ἐξ αἱρέσεως αὐτῶν — «сделают по своему выбору (произволению)» (αἵρεσις — 選択[せんたく]); ἔσται κύρια — «будет действительно (иметь силу)» (κύριος)."
  31: "περὶ τῶν κακῶν, ὧν ὁ βασιλεὺς Δημήτριος συντελεῖται εἰς αὐτούς — «о злодеяниях, которые царь Димитрий совершает против них» (συντελέω); ἐγράψαμεν αὐτῷ — «мы написали ему»; Διὰ τί ἐβάρυνας τὸν ζυγόν σου — «для чего ты отяготил иго твоё» (βαρύνω); τοὺς φίλους ἡμῶν τοὺς συμμάχους Ιουδαίους — «друзей наших, союзников Иудеев». Письмо — 「…」 до 32."
  32: "ἐὰν οὖν ἔτι ἐντύχωσιν κατὰ σοῦ — «если ещё обратятся (с жалобой) против тебя» (ἐντυγχάνω); ποιήσομεν αὐτοῖς τὴν κρίσιν — «сотворим им суд (правду)»; πολεμήσομέν σε διὰ τῆς θαλάσσης καὶ διὰ τῆς ξηρᾶς — «будем воевать против тебя морем и сушею». Здесь письмо закрывается."
