# jp-box, 1 Маккавейская, глава 8. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz и csl-ru глава 8 имеет 32 стиха (совпадает).
