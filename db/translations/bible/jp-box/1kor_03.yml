# jp-box, Первое послание к Коринфянам, глава 3. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 3: плотские разделения в Коринфе (1–4), сослужители Божии (5–9),
# строение на едином основании и огонь испытания (10–15), храм Божий (16–17),
# мудрость мира сего и «всё ваше» (18–23).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет, <j>/<mo> не ставятся.
# 〔…〕: 3:3 — церковное καὶ διχοστασίαι.
# Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

tr_code: jp-box
book: 1kor
chapter: 3
draft: true

verses:
  1: "兄弟[きょうだい]たちよ、わたしはあなたがたに、霊[れい]に属[ぞく]する者[もの]たちに対[たい]してするようには語[かた]ることができず、肉[にく]に属[ぞく]する者[もの]たちに対[たい]してするように、キリストにある幼[おさな]い者[もの]たちに対[たい]してするように語[かた]った。"
  2: "わたしはあなたがたに乳[ちち]を飲[の]ませ、固[かた]い食物[しょくもつ]を与[あた]えなかった。あなたがたは、まだそれを受[う]け入[い]れることができなかったからである。いや、今[いま]でもまだできない。"
  3: "あなたがたは、まだ肉[にく]に属[ぞく]しているからである。あなたがたの間[あいだ]に妬[ねた]みと争[あらそ]い〔と分裂[ぶんれつ]〕がある以上[いじょう]、あなたがたは肉[にく]に属[ぞく]し、人[ひと]の考[かんが]えに従[したが]って歩[あゆ]んでいるのではないか。"
  4: "なぜなら、ある者[もの]が「わたしはパウロのものだ」と言[い]い、ほかの者[もの]が「わたしはアポロのものだ」と言[い]うとき、あなたがたはただの人[ひと]にすぎないではないか。"
  5: "では、アポロとは何[なに]か。パウロとは何[なに]か。あなたがたが信仰[しんこう]に入[はい]るために仕[つか]えた者[もの]たちであり、それぞれ主[しゅ]がお与[あた]えになったとおりの者[もの]である。"
  6: "わたしは植[う]え、アポロは水[みず]を注[そそ]いだが、育[そだ]てたのは神[かみ]である。"
  7: "それゆえ、植[う]える者[もの]も水[みず]を注[そそ]ぐ者[もの]も何[なに]でもなく、育[そだ]てる神[かみ]こそ、すべてなのである。"
  8: "植[う]える者[もの]と水[みず]を注[そそ]ぐ者[もの]とは一[ひと]つである。それぞれ、自分[じぶん]の労苦[ろうく]に応[おう]じて、自分[じぶん]の報[むく]いを受[う]ける。"
  9: "なぜなら、わたしたちは神[かみ]の同労者[どうろうしゃ]であり、あなたがたは神[かみ]の畑[はたけ]、神[かみ]の建物[たてもの]である。"
  10: "わたしは、神[かみ]から自分[じぶん]に与[あた]えられた恵[めぐ]みに従[したが]って、賢[かしこ]い建築家[けんちくか]のように土台[どだい]を据[す]えた。ほかの者[もの]がその上[うえ]に建[た]てている。しかし、それぞれがどのように建[た]てるかをよく見[み]なさい。"
  11: "なぜなら、すでに据[す]えられた土台[どだい]であるイエス・キリストのほかに、だれも別[べつ]の土台[どだい]を据[す]えることはできないからである。"
  12: "もしだれかが、この土台[どだい]の上[うえ]に、金[きん]、銀[ぎん]、宝石[ほうせき]、木[き]、草[くさ]、藁[わら]を建[た]て重[かさ]ねるなら、"
  13: "それぞれの仕事[しごと]は明[あき]らかになる。その日[ひ]がそれを明[あき]らかにするからである。その日[ひ]は火[ひ]によって現[あらわ]れ、火[ひ]がそれぞれの仕事[しごと]のどのようなものかを試[ため]すのである。"
  14: "もしだれかの建[た]てた仕事[しごと]が残[のこ]るなら、その人[ひと]は報[むく]いを受[う]ける。"
  15: "もしだれかの仕事[しごと]が焼[や]けてしまえば、その人[ひと]は損[そん]を被[こうむ]る。しかし、その人[ひと]自身[じしん]は、火[ひ]の中[なか]を通[とお]るようにして救[すく]われる。"
  16: "あなたがたは知[し]らないのか。あなたがたこそ神[かみ]の神殿[しんでん]であり、神[かみ]の霊[れい]があなたがたのうちに住[す]んでおられるということを。"
  17: "もしだれかが神[かみ]の神殿[しんでん]を壊[こわ]すなら、神[かみ]はその人[ひと]を壊[こわ]される。神[かみ]の神殿[しんでん]は聖[せい]だからである。その神殿[しんでん]とは、ほかならぬあなたがたである。"
  18: "だれも自分[じぶん]を欺[あざむ]いてはいけない。もしあなたがたのうちに、この世[よ]で自分[じぶん]を賢[かしこ]いと思[おも]う者[もの]がいるなら、その人[ひと]は愚[おろ]かになるがよい。そうしてこそ、賢[かしこ]くなれるからである。"
  19: "なぜなら、この世[よ]の知恵[ちえ]は神[かみ]の前[まえ]では愚[おろ]かさだからである。「神[かみ]は知恵[ちえ]ある者[もの]たちを、その悪[わる]だくみのうちで捕[と]らえられる」と書[か]かれているからである。"
  20: "また、「主[しゅ]は知恵[ちえ]ある者[もの]たちの思[おも]いが空[むな]しいことを知[し]っておられる」とある。"
  21: "それゆえ、だれも人[ひと]を誇[ほこ]りとしてはならない。すべてはあなたがたのものだからである。"
  22: "パウロも、アポロも、ケファも、世界[せかい]も、生[いのち]も、死[し]も、現在[げんざい]のものも、将来[しょうらい]のものも、すべてはあなたがたのものである。"
  23: "あなたがたはキリストのものであり、キリストは神[かみ]のものである。"

notes:
  1: "σαρκίνοις — «плотяные»; 肉に属する者たち. νήπιοι ἐν Χριστῷ — キリストにある幼い者たち; νήπιος — 幼子."
  3: "В базе ζῆλος καὶ ἔρις; церковный текст (Елизаветинская «зависть, и рвение, и распри», jp-joc「媢嫉と爭鬪と分離」) добавляет καὶ διχοστασίαι — 〔分裂〕. Проверено по базе: διχοστασία в стихе — 0. κατὰ ἄνθρωπον περιπατεῖτε — 人の考えに従って歩んでいる."
  5: "διάκονος — служитель; 仕えた者たち. ἑκάστῳ ὡς ὁ κύριος ἔδωκεν — それぞれ主がお与えになったとおり."
  7: "οὔτε … οὔτε … ἀλλὰ ὁ αὐξάνων θεός — «ни… ни… но Бог возращающий»; 何でもなく…育てる神こそ、すべて."
  9: "συνεργοί — 同労者; γεώργιον — 畑; οἰκοδομή — 建物."
  10: "ἀρχιτέκτων — 建築家; θεμέλιον ἔθηκα — 土台を据えた; ἐποικοδομεῖ — その上に建てる."
  12: "χρυσός, ἄργυρος, λίθοι τίμιοι, ξύλα, χόρτος, καλάμη — 金・銀・宝石・木・草・藁."
  13: "ἡ ἡμέρα — その日 (день Господень). δοκιμάσει — 試す. В базе [αὐτό] стоит в квадратных скобках — слово есть, 〔〕 не ставятся."
  15: "ζημιωθήσεται — 損を被る; οὕτως ὡς διὰ πυρός — 火の中を通るように."
  16: "ναός — 神殿 (не ἱερόν, ср. 9:13); οἰκεῖ ἐν ὑμῖν — あなたがたのうちに住んでおられる."
  17: "φθείρει / φθερεῖ — 壊す / 壊される: игра слов сохранена. οἵτινές ἐστε ὑμεῖς — その神殿とは、ほかならぬあなたがた."
  18: "μωρὸς γενέσθω — 愚かになるがよい; ἵνα γένηται σοφός — そうしてこそ、賢くなれる."
  19: "Иов 5:13 (LXX). В LXX подлежащее — ὁ δρασσόμενος («уловляющий»); по-японски подлежащее 神, как у jp-joc (彼は…拘ふ). πανουργία — 悪だくみ."
  20: "Пс 93:11 (LXX). διαλογισμοί — 思い; μάταιοι — 空しい."
  21: "καυχάσθω ἐν ἀνθρώποις — 人を誇りとする. πάντα γὰρ ὑμῶν ἐστιν — すべてはあなたがたのもの."
  22: "ἐνεστῶτα / μέλλοντα — 現在のもの / 将来のもの. Перечисление сохранено без сокращения."
  23: "ὑμεῖς δὲ Χριστοῦ, Χριστὸς δὲ θεοῦ — あなたがたはキリストのもの、キリストは神のもの."
