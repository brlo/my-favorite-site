# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Греческий сайта (критический) — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 10: ангел с раскрытой книжкой и клятва о конце времени (1–7);
# Иоанн съедает книжку и получает повеление пророчествовать (8–11).
