verses:
  1: "また、わたしは、力[ちから]ある別[べつ]の天使[てんし]が、雲[くも]をまとって天[てん]から降[お]りてくるのを見[み]た。その頭[あたま]には虹[にじ]があり、顔[かお]は太陽[たいよう]のようで、足[あし]は火[ひ]の柱[はしら]のようであった。"
  2: "その手[て]には、開[ひら]かれた小[ちい]さな巻物[まきもの]があった。彼[かれ]は右[みぎ]の足[あし]を海[うみ]に、左[ひだり]の足[あし]を地[ち]に置[お]いた。"
  3: "彼[かれ]はライオンがほえるような大[おお]きな声[こえ]で叫[さけ]んだ。彼[かれ]が叫[さけ]ぶと、七[なな]つの雷[かみなり]がそれぞれの声[こえ]を響[ひび]かせた。"
  4: "七[なな]つの雷[かみなり]が語[かた]ったとき、わたしはそれを書[か]こうとした。すると、天[てん]から声[こえ]がして言[い]った。「七[なな]つの雷[かみなり]が語[かた]ったことを封[ふう]じて、書[か]いてはならない。」"
  5: "わたしが見[み]た、海[うみ]と地[ち]に立[た]っている天使[てんし]は、右[みぎ]の手[て]を天[てん]に挙[あ]げて、"
  6: "天[てん]とその中[なか]のもの、地[ち]とその中[なか]のもの、海[うみ]とその中[なか]のものを造[つく]られた、永遠[えいえん]に生[い]きておられる方[かた]を指[さ]して誓[ちか]って言[い]った。「もう時[とき]はない。"
  7: "しかし、第七[だいしち]の天使[てんし]がラッパを吹[ふ]こうとしているとき、神[かみ]の奥義[おうぎ]は、神[かみ]がご自分[じぶん]の僕[しもべ]である預言者[よげんしゃ]たちに告[つ]げ知[し]らせたとおりに成就[じょうじゅ]する。」"
  8: "天[てん]から聞[き]こえたあの声[こえ]が、再[ふたた]びわたしに語[かた]りかけて言[い]った。「行[い]って、海[うみ]と地[ち]に立[た]っている天使[てんし]の手[て]から、開[ひら]かれた巻物[まきもの]を受[う]け取[と]りなさい。」"
  9: "そこで、わたしは天使[てんし]のところへ行[い]き、小[ちい]さな巻物[まきもの]を渡[わた]してくれるように頼[たの]んだ。すると、天使[てんし]は言[い]った。「取[と]って、食[た]べなさい。それはあなたの腹[はら]を苦[にが]くするが、あなたの口[くち]では蜜[みつ]のように甘[あま]い。」"
  10: "わたしは天使[てんし]の手[て]から小[ちい]さな巻物[まきもの]を受[う]け取[と]り、食[た]べた。それはわたしの口[くち]では蜜[みつ]のように甘[あま]かったが、食[た]べてしまうと、わたしの腹[はら]は苦[にが]くなった。"
  11: "すると、わたしに言[い]った。「あなたは、多[おお]くの民[たみ]、民族[みんぞく]、言語[げんご]、王[おう]たちについて、再[ふたた]び預言[よげん]しなければならない。」"

notes:
  1: "ἄλλον ἄγγελον ἰσχυρόν — 力ある別の天使. περιβεβλημένον νεφέλην — 雲をまとって. ἶρις — 虹; στῦλοι πυρός — 火の柱."
  2: "βιβλαρίδιον ἠνεῳγμένον — 開かれた小さな巻物 (в 10:2 и 9–10; в 10:8 — βιβλίον). Правую ногу на море, левую на землю — 右足を海に、左足を地に."
  3: "ὥσπερ λέων μυκᾶται — ライオンがほえるように. αἱ ἑπτὰ βρονταί — 七つの雷; ἑαυτῶν φωνάς — それぞれの声."
  4: "ἔμελλον γράφειν — 書こうとした. φωνὴν ἐκ τοῦ οὐρανοῦ — 天からの声; не красная (голос с неба, не Христос). Σφράγισον — 封じよ; μὴ αὐτὰ γράψῃς — 書いてはならない."
  5: "ἦρεν τὴν χεῖρα … εἰς τὸν οὐρανόν — 右手を天に挙げて."
  6: "ὤμοσεν ἐν τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων — 永遠に生きておられる方を指して誓った. χρόνος οὐκέτι ἔσται — もう時はない (χρόνος — «промежуток времени», не καιρός)."
  7: "τὸ μυστήριον τοῦ θεοῦ — 神の奥義. ὡς εὐηγγέλισεν — 告げ知らせたとおりに. ἐτελέσθη — 成就する (aor. в греч., по смыслу — будущее)."
  8: "ἡ φωνὴ ἣν ἤκουσα — 聞こえたあの声; πάλιν λαλοῦσαν μετ᾿ ἐμοῦ — 再びわたしに語りかけて. Ὕπαγε λάβε — 行って受け取りなさい."
  9: "Λάβε καὶ κατάφαγε — 取って食べなさい. πικρανεῖ σου τὴν κοιλίαν — 腹を苦くする; γλυκὺ ὡς μέλι — 蜜のように甘い."
  10: "κατέφαγον — 食べた; ἐπικράνθη ἡ κοιλία — 腹は苦くなった. Сладость во рту и горечь в животе сохранены."
  11: "Δεῖ σε πάλιν προφητεῦσαι — 再び預言しなければならない. ἐπὶ λαοῖς καὶ ἔθνεσιν καὶ γλώσσαις καὶ βασιλεῦσιν πολλοῖς — 多くの民、民族、言語、王たちについて (ἐπί — «о, против»)."
