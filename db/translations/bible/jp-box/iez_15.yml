verses:
  1: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  2: "「人[ひと]の子[こ]よ、ぶどうの木[き]は、森[もり]の木[き]々[ぎ]の間[あいだ]にある枝[えだ]のうちで、何[なに]になろうか。"
  3: "人[ひと]はそれから木[き]を取[と]って、何[なに]かを作[つく]るために用[もち]いるだろうか。また、それから杭[くい]を取[と]って、何[なに]かの器[うつわ]を掛[か]けるだろうか。"
  4: "ただ、それは火[ひ]に与[あた]えられて焼[や]かれる。火[ひ]は年[とし]ごとにそれを切[き]り落[お]とした枝[えだ]を焼[や]き尽[つ]くし、それはついには消[き]えうせる。それは何[なに]かの仕事[しごと]に役立[やくだ]つだろうか。"
  5: "見[み]よ、それがまだ完全[かんぜん]であったときでさえ、何[なに]かの仕事[しごと]にはならなかった。まして、火[ひ]がそれを全[まった]く焼[や]き尽[つ]くした後[あと]、なお何[なに]かの仕事[しごと]になるだろうか。"
  6: "それゆえ、主[しゅ]なる神[かみ]はこう言[い]われる。森[もり]の木[き]々[ぎ]の間[あいだ]にあるぶどうの木[き]を、わたしが火[ひ]に与[あた]えて焼[や]かせたように、わたしはエルサレムの住人[じゅうにん]たちも火[ひ]に与[あた]えた。"
  7: "わたしは彼[かれ]らにわたしの顔[かお]を向[む]ける。彼[かれ]らは火[ひ]から出[で]て来[く]るが、火[ひ]が彼[かれ]らを食[く]い尽[つ]くす。わたしが彼[かれ]らに顔[かお]を向[む]けるとき、あなたがたはわたしが主[しゅ]であることを知[し]る。"
  8: "わたしはこの地[ち]を荒廃[こうはい]とする。彼[かれ]らが背[そむ]いて罪[つみ]に陥[おちい]ったからである、と主[しゅ]なる神[かみ]は言[い]われる。」"

notes:
  1: "Вводная формула; начинается речь 2–8."
  2: "τί ἂν γένοιτο τὸ ξύλον τῆς ἀμπέλου — «чем бы стало дерево винограда (лозы)» (ἄν с оптативом — потенциальное); ἐκ πάντων τῶν ξύλων τῶν κλημάτων — «из всех деревьев ветвей» (κλῆμα — ветвь, лоза); τοῖς ξύλοις τοῦ δρυμοῦ — «деревьями дубравы (леса)» (δρυμός)."
  3: "εἰ λήμψονται ἐξ αὐτῆς ξύλον — «возьмут ли от неё дерево»; εἰς ἐργασίαν — «на дело (изделие)»; πάσσαλον — «кол (гвоздь)»; τοῦ κρεμάσαι ... πᾶν σκεῦος — «чтобы повесить всякий сосуд (вещь)»."
  4: "πυρὶ δέδοται εἰς ἀνάλωσιν — «огню предано на сожжение» (ἀνάλωσις); τὴν κατ᾽ ἐνιαυτὸν κάθαρσιν — «ежегодное очищение (обрезку)»: слав. «летнее очищение»; ἐκλείπει εἰς τέλος — «исчезает до конца»; μὴ χρήσιμον — «не годно ли?» (вопрос)."
  5: "ὁλοκλήρου — «целого» (ὁλόκληρος); μὴ ὅτι ἐὰν ... πῦρ αὐτὸ ἀναλώσῃ — «тем более если огонь его истребит»; εἰ ἔσται ἔτι εἰς ἐργασίαν — «будет ли ещё на дело?»."
  6: "Ὃν τρόπον ... οὕτως — «как... так»; ὃ δέδωκα αὐτὸ τῷ πυρὶ εἰς ἀνάλωσιν — «которое Я дал огню на сожжение»; τοὺς κατοικοῦντας Ιερουσαλημ — «жителей Иерусалима»."
  7: "δώσω τὸ πρόσωπόν μου ἐπ᾽ αὐτούς — «дам лицо Моё на них (обращу)»; ἐκ τοῦ πυρὸς ἐξελεύσονται, καὶ πῦρ αὐτοὺς καταφάγεται — «из огня выйдут, и огонь их пожрёт»; ἐν τῷ στηρῖσαι με τὸ πρόσωπόν μου — «когда утвержу лицо Моё»."
  8: "εἰς ἀφανισμόν — «в опустошение»; ἀνθ᾽ ὧν παρέπεσον παραπτώματι — «за то, что отпали отпадением» (παραπίπτω); здесь закрывается речь."
