# jp-box, 3-я Ездры, глава 6. Черновик для приёмки.
#
# База: церковнославянский текст (csl-ru) — в Септуагинте (gr-lxx-byz) книги нет;
# ru (Синодальный) — только для понимания, не источник; у ru другое деление стихов,
# сверка по содержанию. Нумерация — славянская. Язык — современный 常体; 〔…〕 нет;
# сносок ⟨…⟩ нет. Красного и синего в Ветхом Завете нет.
# jp-joc в книге нет; jp-ni не использовался.
#
# Содержание: 1–6 ответ ангела о предвечном замысле — прежде всего сотворённого
# «тогда Я помыслил»; 7–10 вопрос о разделении времён и притча об Иакове и Исаве;
# 11–16 просьба показать конец знамений и глас, исполненный шума;
# 17–28 голос с неба: последние знамения (книги, однолетние младенцы, труба,
# оскудение источников, спасение оставшихся, изменение сердца);
# 29–34 ангел: «приидох показати время будущия нощи», ещё семь дней поста;
# 35–37 третий пост и восьмая ночь; 38–59 молитва Ездры о творении: день первый —
# небо и земля, свет; второй — твердь; третий — воды и растения; четвёртый — светила;
# пятый — животные, Левиафан и «Енох»; шестой — скоты и Адам; ропот о язычниках.
# Голоса: 1–6, 8–10, 13–16, 30–34 — ангел 「…」; 7, 11–12 — Ездра; 18–28 — голос
# с неба 「…」; 38–59 — молитва Ездры 「…」 (в 38 слова Бога — 『…』).
# Редакционные скобки слав. («(глаголющь)», «(сотворенъ)», «(будутъ)») не переносились.
# Имена: エズラ, アブラハム, イサク, ヤコブ, エサウ, モーセ, アダム; エノク — по слав.
# (в ru «бегемот»); リヴァイアタン — слав. «левиафам».

