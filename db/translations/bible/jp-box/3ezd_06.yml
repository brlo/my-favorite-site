verses:
  1: "彼[かれ]はわたしに言[い]った。「地[ち]の圏[けん]の始[はじ]めから、世[よ]の果[は]ての基[きそ]が据[す]えられる前[まえ]、息[いき]をする風[かぜ]の集[あつ]まりが生[しょう]じる前[まえ]、"
  2: "雷[かみなり]の声[こえ]が響[ひび]く前[まえ]、稲妻[いなずま]の光[ひかり]が輝[かがや]く前[まえ]、楽園[らくえん]の基[きそ]が固[かた]められる前[まえ]、"
  3: "美[うつく]しい花[はな]が見[み]られる前[まえ]、動[うご]く力[ちから]が強[つよ]められる前[まえ]、数[かぞ]え切[き]れない天[てん]使[し]の軍[ぐん]勢[せい]が集[あつ]められる前[まえ]、"
  4: "空気[くうき]の高[たか]みが上[あ]げられる前[まえ]、大空[おおぞら]の測[はか]りが名[な]づけられる前[まえ]、シオンで炉[ろ]が燃[も]え上[あ]がる前[まえ]、"
  5: "今[いま]の時[とき]が究[きわ]められる前[まえ]、今[いま]罪[つみ]を犯[おか]す者[もの]たちの企[くわだ]てが除[のぞ]かれる前[まえ]、信仰[しんこう]を宝[たから]として蓄[たくわ]えた者[もの]たちが印[しるし]を押[お]される前[まえ]、"
  6: "そのとき、わたしは思[おも]い定[さだ]め、すべてはわたし一人[ひとり]によって造[つく]られ、他[ほか]の者[もの]によってではない。終[お]わりもわたしによってあり、他[ほか]の者[もの]によってではない。」"
  7: "わたしは答[こた]えて言[い]った。「時[とき]の分[わ]けられ方[かた]はどうなるのですか。いつ、前者[ぜんしゃ]に終[お]わりが、後者[こうしゃ]に始[はじ]めがあるのですか。」"
  8: "彼[かれ]はわたしに言[い]った。「アブラハムからイサクに至[いた]るまで、彼[かれ]からヤコブとエサウが生[う]まれたとき、ヤコブの手[て]は初[はじ]めからエサウのかかとを握[にぎ]っていた。"
  9: "この世[よ]の終[お]わりはエサウであり、次[つぎ]の世[よ]の始[はじ]めはヤコブである。"
  10: "人[ひと]の手[て]はかかとと手[て]の間[あいだ]にある。ほかのことを求[もと]めるな、エズラ。」"
  11: "わたしは答[こた]えて言[い]った。「ああ、主[しゅ]なる神[かみ]よ。もしあなたの目[め]の前[まえ]に恵[めぐ]みを得[え]たのなら、"
  12: "お願[ねが]いします。あなたが過[す]ぎ去[さ]った夜[よる]にその一部[いちぶ]をわたしに示[しめ]された、あなたのしるしの終[お]わりを、僕[しもべ]に示[しめ]してください。」"
  13: "彼[かれ]は答[こた]えて言[い]った。「あなたの足[あし]で立[た]ち上[あ]がり、騒[さわ]ぎに満[み]ちた声[こえ]を聞[き]け。"
  14: "揺[ゆ]れのようなことが起こるが、あなたが立[た]っている場所[ばしょ]は揺[ゆ]れない。"
  15: "だから、それが語[かた]るとき、あなたは驚[おどろ]いてはならない。終[お]わりについての言葉[ことば]であり、地[ち]の基[きそ]が示[しめ]されるのだから。"
  16: "これらのことについての言葉[ことば]であるから、地[ち]は震[ふる]え動[うご]く。地[ち]は、自分[じぶん]の終[お]わりが変[か]わることを知[し]っているからである。」"
  17: "わたしはこれを聞[き]くと、足[あし]の上[うえ]に立[た]った。そして聞[き]いた。見[み]よ、語[かた]る声[こえ]があり、その響[ひび]きは多[おお]くの水[みず]の響[ひび]きのようであった。"
  18: "それは言[い]った。「見[み]よ、日[ひ]が来[く]る。わたしが近[ちか]づき始[はじ]め、地[ち]に住[す]む者[もの]たちを訪[おとず]れるとき、"
  19: "わたしは、その不[ふ]正[せい]によって不正[ふせい]に害[がい]を加[くわ]えた者[もの]たちから、求[もと]め始[はじ]める。シオンが低[ひく]くされる時[とき]が満[み]ちるとき、"
  20: "過[す]ぎ去[さ]り始[はじ]める世[よ]が印[しるし]を付[つ]けられるとき、わたしはこれらのしるしを行[おこな]う。書物[しょもつ]が大空[おおぞら]の面[おもて]の前[まえ]で開[ひら]かれ、すべての者[もの]が一[ひと]つに集[つど]って見[み]る。"
  21: "一歳[いっさい]の幼[おさな]い子[こ]たちが自分[じぶん]たちの声[こえ]で語[かた]り、妊[にん]娠[しん]した女[おんな]たちが三か月[さんかげつ]、四か月[よんかげつ]の未熟[みじゅく]な子[こ]を産[う]み、その子[こ]らは生[い]き延[の]びて起[お]き上[あ]がる。"
  22: "種[たね]を蒔[ま]かれた所[ところ]がたちまち蒔[ま]かれていないかのように現[あらわ]れ、満[み]ちた倉[くら]が突然[とつぜん]空[から]になって見[み]いだされる。"
  23: "ラッパが騒[さわ]がしく鳴[な]り響[ひび]き、すべての者[もの]がそれを聞[き]くと、たちまち驚[おどろ]き恐[おそ]れる。"
  24: "その時[とき]、友[とも]は友[とも]に敵[てき]のように武[ぶ]器[き]を取[と]り、地[ち]は彼らと共[とも]に恐[おそ]れおののく。泉[いずみ]の流[なが]れは止[と]まり、三時間[さんじかん]のあいだ流[なが]れない。"
  25: "わたしがあなたに予[あらかじ]め告[つ]げたこれらのすべての後[あと]に残[のこ]される者[もの]は、だれでも救[すく]われ、わたしの救[すく]いとあなたがたの世[よ]の終[お]わりを見[み]る。"
  26: "選[えら]ばれた民[たみ]、すなわち生[う]まれてから死[し]を味[あじ]わっていない者[もの]たちが見[み]る。住[す]む者[もの]たちの心[こころ]は変[か]えられ、別[べつ]の感覚[かんかく]に変[か]わる。"
  27: "悪[あく]は消[き]え去[さ]り、欺[あざむ]きは消[け]される。"
  28: "信仰[しんこう]が花[はな]咲[さ]き、朽[くち]ちることが打[う]ち負[ま]かされ、これまで長[なが]いあいだ実[み]を結[むす]ばなかった真理[しんり]が現[あらわ]れる。」"
  29: "彼[かれ]がわたしに語[かた]っているとき、見[み]よ、わたしは自[みずか]らがその前[まえ]に立[た]っている方[かた]を、静[しず]かに見[み]つめていた。"
  30: "彼[かれ]はわたしにこう言[い]った。「わたしは来[きた]る夜[よる]の時[とき]をあなたに示[しめ]すために来[き]た。"
  31: "だから、もしあなたが再[ふたた]び祈[いの]り、再[ふたた]び七日[なのか]の断食[だんじき]をするなら、わたしが聞[き]いたその日[ひ]に、これらよりもさらに大[おお]きいことをあなたに告[つ]げよう。"
  32: "あなたの声[こえ]はいと高[たか]き方[かた]の前[まえ]に聞[き]かれたからである。力[ちから]ある方[かた]はあなたの正[ただ]しい行[おこな]いを見[み]、あなたが若[わか]い時[とき]から持[も]っていた清[きよ]さを予[あらかじ]め見[み]ておられた。"
  33: "それゆえ、わたしを遣[つか]わして、これらのすべてのことをあなたに示[しめ]し、あなたに言[い]わせた。勇[いさ]みなさい、恐[おそ]れてはならない。"
  34: "初[はじ]めの時[とき]と共[とも]に空[むな]しいことを思[おも]い巡[めぐ]らそうと急[いそ]いではならない。そうすれば、後[あと]の時[とき]についても早[はや]まって語[かた]らないであろう。」"
  35: "その後[あと]、わたしは再[ふたた]び泣[な]き、同[おな]じように七日[なのか]の断食[だんじき]をして、わたしに告[つ]げられた三[みっ]つの週[しゅう]を満[み]たした。"
  36: "八日目[ようかめ]の夜[よる]、わたしの心[こころ]は再[ふたた]び内[うち]に騒[さわ]ぎ立ち、わたしはいと高[たか]き方[かた]の前[まえ]で語[かた]り始[はじ]めた。"
  37: "わたしの霊[れい]はひどく燃[も]え上[あ]がり、魂[たましい]は衰[おとろ]えていたからである。"
  38: "わたしは言[い]った。「ああ、主[しゅ]よ。あなたは造[つく]りの初[はじ]めから、第一[だいいち]の日[ひ]に語[かた]られた。『天[てん]と地[ち]ができよ』と言[い]われ、あなたの言葉[ことば]は完全[かんぜん]な業[わざ]となった。"
  39: "そのとき霊[れい]があり、闇[やみ]が周[まわ]りを漂[ただよ]い、沈黙[ちんもく]があった。人[ひと]の声[こえ]の響[ひび]きは、まだあなたによって造[つく]られていなかった。"
  40: "そのときあなたは、あなたの宝庫[ほうこ]から明[あか]るい光[ひかり]が出[で]て、それによってあなたの業[わざ]が現[あらわ]れるように語[かた]られた。"
  41: "第二[だいに]の日[ひ]にあなたは大空[おおぞら]の霊[れい]を造[つく]り、それが水[みず]の間[あいだ]に分[わ]け隔[へだ]てを造[つく]るように命[めい]じられた。一[ひと]つの部分[ぶぶん]は上[うえ]に上[のぼ]り、第二[だい]の部分[ぶぶん]は下[した]にとどまる。"
  42: "第三[だいさん]の日[ひ]にあなたは水[みず]が地[ち]の七分[しちぶん]の一[いち]に集[あつ]まるように命[めい]じ、六分[ろくぶん]を乾[かわ]かせて保[たも]たれ、それらがあなたの前[まえ]で、神[かみ]によって蒔[ま]かれ、耕[たがや]されて仕[つか]えるようにされた。"
  43: "あなたの言葉[ことば]が出[で]ると、業[わざ]はたちまち成[な]った。"
  44: "たちまち無数[むすう]の実[み]が、さまざまに味[あじ]わうべき喜[よろこ]びと共[とも]に出[で]て来[き]た。花[はな]はその姿[すがた]を変[か]えず、香[かお]りは測[はか]り知[し]れないほどであった。これらは第三[だいさん]の日[ひ]に造[つく]られた。"
  45: "第四[だいし]の日[ひ]にあなたは、太陽[たいよう]の光[ひかり]、月[つき]の光[ひかり]、星[ほし]の配[はい]列[れつ]があるように命[めい]じられた。"
  46: "そして、これから造[つく]られる人[ひと]に仕[つか]えるように命[めい]じられた。"
  47: "第五[だいいつ]の日[ひ]にあなたは、水[みず]が集[あつ]められた七分[しちぶん]の一[いち]に、生[い]き物[もの]、飛[と]ぶもの、魚[さかな]を産[う]み出[だ]すように言[い]われた。そのとおりになった。"
  48: "物言[ものい]わぬ命[いのち]なき水[みず]が、神[かみ]の合図[あいず]によって命[めい]じられて生[い]き物[もの]を産[う]み出[だ]した。それは、そこからもろもろの世代[せだい]があなたの驚[おどろ]くべき業[わざ]を告[つ]げ知[し]らせるためである。"
  49: "そのときあなたは二[ふた]つの生[い]き物[もの]を保[たも]たれた。一[ひと]つの名[な]をエノクと呼[よ]び、第二[だい]の名[な]をリヴァイアタンと呼[よ]ばれた。"
  50: "あなたはそれらを互[たが]いに分[わ]け離[はな]された。水[みず]の集[あつ]められた七分[しちぶん]の一[いち]は、それらを共[とも]に容[い]れることができなかったからである。"
  51: "あなたはエノクに、第三[だいさん]の日[ひ]に乾[かわ]かされた一[ひと]つの部分[ぶぶん]を与[あた]え、千[せん]の山[やま]のあるそこに住[す]まわせられた。"
  52: "リヴァイアタンには湿[しめ]った七分[しちぶん]の一[いち]を与[あた]え、それを保[たも]たれた。あなたが望[のぞ]む者[もの]に、望[のぞ]むとき、それを食[た]べ物[もの]とするためである。"
  53: "第六[だいろく]の日[ひ]にあなたは、地[ち]があなたの前[まえ]で家畜[かちく]、獣[けもの]、地[ち]をはうものを造[つく]り出[だ]すように命[めい]じられた。"
  54: "これらの上[うえ]にあなたはアダムを造[つく]り、あなたが造[つく]られたすべてのものの上[うえ]に彼を導[みちび]き手[て]、また君[きみ]として据[す]えられた。彼[かれ]からわたしたちすべてが生[う]まれ、あなたはその民[たみ]を選[えら]ばれた。"
  55: "主[しゅ]よ、わたしがあなたの前[まえ]でこれらのすべてを語[かた]ったのは、あなたがわたしたちのために世[よ]を造[つく]られたからです。"
  56: "しかし、アダムから生[う]まれた他[ほか]のもろもろの民[たみ]については、あなたはそれらを無[む]に等[ひと]しいと言[い]われました。それらは唾[つば]に似[に]せられ、その多[おお]くは器[うつわ]から滴[したた]るしずくにたとえられています。"
  57: "それなのに今[いま]、主[しゅ]よ、無[む]に等[ひと]しいとされたあのもろもろの民[たみ]が、わたしたちを支[し]配[はい]し始[はじ]め、わたしたちを食[く]い尽[つ]くしています。"
  58: "わたしたちはあなたの民[たみ]、あなたが御自分[おんじしん]の長子[ちょうし]、ひとり子[ご]、愛[あい]する者[もの]と呼[よ]ばれた者[もの]なのに、彼らの手[て]に引[ひ]き渡[わた]されています。"
  59: "もし世[よ]がわたしたちのために造[つく]られたのなら、なぜわたしたちは世[よ]と共[とも]に嗣業[しぎょう]を受[う]け継[つ]がないのですか。これはいつまで続[つづ]くのですか。」"

notes:
  1: "«от начала круга земнаго и прежде основания исходов века» — «от начала круга земного и прежде основания исходов века»; «прежде неже быша дышуще собрания ветров» — «прежде нежели стали дышать собрания ветров». ru: «прежде нежели установлены были пределы века»."
  2: "«прежде неже возшумеша гласи громнии» — «прежде нежели зашумели голоса громов»; «основания райская» — «основания райские»."
  3: "«силы подвиженыя» — «силы подвижные»; «безчисленная воинства ангелская» — «бесчисленные ангельские воинства»."
  4: "«высоты воздушныя» — «высоты воздушные»; «меры твердей» — «меры твердей»; «пещи в сионе» — «печи (горнила) в Сионе»; ru: «огни на Сионе»."
  5: "«настоящая лета» — «нынешние времена»; «отчуждишася сих, иже ныне согрешают, начинания» — «отчуждены были начинания тех, кто ныне грешит»; «назнаменани быша тии, иже веру сокровиществоваша» — «получили знамение те, кто веру сокровиществовал»."
  6: "«тогда аз помыслих, и сотворена суть чрез мене единаго» — «тогда Я помыслил, и сотворено было чрез Меня одного»; «конец будет мною, а не иным» — «конец будет Мною, а не иным»."
  7: "«кое будет разделение времен? или когда первому конец, а другому начало?» — «каково будет разделение времён? и когда первому конец, а другому начало?»"
  8: "«от авраама даже до исаака... рука иаковля держаше от начала пяту исавову» — «от Авраама до Исаака... рука Иакова держала от начала пяту Исава»."
  9: "«конец бо века сего исав, а другаго начало иаков» — «конец века сего — Исав, а другого начало — Иаков»."
  10: "«человека рука между пятою и рукою, иного не ищи, ездро» — «рука человека между пятой и рукой; другого не ищи, Ездра». ru истолковывает: «Рука человека — начало его, а конец — пята его»; в тексте по слав."
  11: "«аще обретох благодать пред очима твоима» — «если я обрёл благодать пред очами Твоими»."
  12: "«конец знамений твоих, ихже часть показал еси мне нощи прешедшия» — «конец знамений Твоих, которых часть Ты показал мне в прошедшую ночь»."
  13: "«востани на ноги твоя и услыши глас исполнен шума» — «встань на ноги твои и услышь голос, исполненный шума»."
  14: "«будет аки колебание, а не поколеблется место, на немже стоиши» — «будет как бы колебание, но место, на котором ты стоишь, не поколеблется»."
  15: "«о концы слово и основание земли разумеется» — «о конце слово, и основание земли разумеется»."
  16: "«о сих вещех слово, трясется и колеблется: весть бо, яко конец их имать изменитися» — «о сих вещах слово, [земля] трясётся и колеблется: ибо знает, что конец их имеет измениться»."
  17: "«глас глаголющь, и шум его яко шум вод многих» — «голос говорящий, и шум его как шум многих вод»."
  18: "«внегда приближатися начну, да посещу обитающих на земли» — «когда начну приближаться, чтобы посетить живущих на земле»."
  19: "«искати начну от сих, иже неправедно повредиша неправдою своею» — «начну взыскивать с тех, кто неправедно повредил неправдой своей»; «исполнится смирение сионе» — «исполнится уничижение Сиона»."
  20: "«егда назнаменается век, иже начинает преходити» — «когда ознаменуется век, который начинает проходить»; «книги разгнутся пред лицем тверди» — «книги раскроются пред лицем тверди»."
  21: "«единолетнии младенцы возглаголют гласы своими» — «однолетние младенцы заговорят своими голосами»; «чреватыя недозрелых родят младенцев, триех и четырех месяцей» — «беременные родят незрелых младенцев трёх и четырёх месяцев»; «поживут и воздвижутся» — «останутся живы и встанут»."
  22: "«места насеянная ненасеяна» — «засеянные места — как незасеянные»; «полная хранилища внезапу обрящутся праздна» — «полные хранилища внезапно окажутся пустыми»."
  23: "«труба вострубит с шумом» — «труба вострубит с шумом»; «абие ужаснутся» — «тотчас ужаснутся»."
  24: "«вооружатся приятеле на приятелей аки врази» — «друзья вооружатся на друзей как враги»; «жилы источников станут и не стекут в часех триех» — «жилы источников остановятся и не потекут три часа»."
  25: "«всяк, иже оставлен будет от всех сих... той спасется» — «всякий, кто будет оставлен после всего этого... тот спасётся»; «узрит спасние мое и конец века вашего» — «увидит спасение Моё и конец века вашего»."
  26: "«иже прияти суть людие» — «которые приняты (избраны) люди»; «иже смерти не вкусиша от рождения своего» — «которые не вкусили смерти от рождения своего»; «обратится в чувство иное» — «обратится в иное чувство»."
  27: "«загладитбося лукавое» — «изгладится лукавое»; «погасится лесть» — «угаснет лесть (обман)»."
  28: "«процветет вера, и победится растление» — «процветёт вера, и будет побеждено тление»; «явится истина, яже без плода бяше дни толики» — «явится истина, которая без плода была столько дней»."
  29: "«тихо смотрех нань, пред нимже стоях» — «тихо смотрел на Него, пред Кем стоял»."
  30: "«приидох к тебе показати время будущия нощи» — «я пришёл показать тебе время будущей ночи»."
  31: "«паки тебе возвещу от сих болшия вещи, в день в оньже слышах» — «ещё возвещу тебе большее сего, в день, в который я услышал»."
  32: "«слышан бо есть глас твой пред вышним» — «ибо услышан голос твой пред Всевышним»; «виде бо крепкий исправление твое и провиде чистоту» — «ибо увидел Крепкий исправление твоё и провидел чистоту»."
  33: "«посла мя показати тебе вся вещи сия и рещи тебе: дерзай и не бойся» — «послал меня показать тебе все эти вещи и сказать тебе: дерзай и не бойся»."
  34: "«не тщися с первыми времены мыслити суетная» — «не спеши с первыми временами помышлять суетное»; «да не поспешиши от последних времен» — «чтобы не поспешить тебе и с последними временами»."
  35: "«плакахся паки и такожде постяхся седмь дний, да исполню три седмицы» — «я снова плакал и так же постился семь дней, чтобы исполнить три седмицы»."
  36: "«во осмую нощь» — «в восьмую ночь»; «сердце мое смущашеся паки во мне» — «сердце моё снова смущалось во мне»."
  37: "«распалашеся бо дух мой зело, и душа моя унываше» — «ибо дух мой сильно воспламенялся, и душа моя унывала»."
  38: "«глаголя глаголал еси от начала сотворения в первый день» — «говоря, Ты сказал от начала творения в первый день»; «да будет небо и земля, и твое слово дело совершенно» — «да будет небо и земля, и слово Твоё — дело совершённое»; редакционное «(глаголющь)» не переносилось."
  39: "«и бысть тогда дух, и тма окрест ношашеся и молчание» — «тогда был дух, и тьма носилась окрест, и молчание»; «шум гласа человеча еще не бе от тебе» — «шума голоса человеческого ещё не было от Тебя»; «(сотворенъ)» — редакционная скобка, не переносилась."
  40: "«да от сокровищ твоих произнесется свет светлый» — «да из сокровищ Твоих произнесётся свет светлый»."
  41: "«создал еси дух тверди и повелел еси ей, да разделит» — «сотворил Ты дух тверди и повелел ей, чтобы разделила»; «часть некая выше уступит и часть вторая низу пребывает» — «некая часть выше отступит, а вторая часть внизу пребудет»."
  42: "«повелел еси водам собратися в седмую часть земли» — «повелел Ты водам собраться в седьмую часть земли»; «еже бы пред тобою служили насеяны от Бога и устроены» — «чтобы пред Тобою служили насеянные и устроенные Богом»; ru: «к обсеменению и обработанию»."
  43: "«слово бо твое изыде, и дело абие творяшеся» — «ибо слово Твоё исходило, и дело тотчас творилось»."
  44: "«изыде бо абие плод множества безмернаго» — «ибо тотчас вышел плод множества безмерного»; «желания вкушения различная» — «различные желания вкушения»; «цвети видом непременным» — «цветы с неизменным видом»; «благовоние обоняния неизследованнаго» — «благоухание неисследимого обоняния»."
  45: "«повелел еси солнечней быти светлости, лунному свету и звезд расположению» — «повелел Ты быть солнечному сиянию, лунному свету и расположению звёзд»."
  46: "«да служат имущему быти созданному человеку» — «чтобы служили имеющему быть созданным человеку»."
  47: "«рекл еси седмей части, идеже бяше вода собрана, да произведет животная и летающая и рыбы» — «сказал Ты седьмой части, где была собрана вода, чтобы произвела животных, летающих и рыб»."
  48: "«вода нема и бездушна» — «вода немая и бездушная»; «Божиим мановением повелевахуся» — «Божиим мановением была повелеваема»; «да от сего дивная твоя родове возвещают» — «чтобы от сего роды возвещали дивные дела Твои»."
  49: "«сохранил еси две души: имя единей назвал еси енох, и имя вторей назвал еси левиафам» — «сохранил Ты две души: имя одной назвал Ты Енох, а имя второй — Левиафан». В слав. «енох», вероятно, искажение имени «бегемот» (ru: «бегемот»); по слав. оставлено エノク."
  50: "«не бо можаше седмая часть... вместити их» — «ибо не могла седьмая часть... вместить их»."
  51: "«дал еси еноху едину часть, яже осушена есть в третий день... идеже суть гор тысяща» — «дал Ты Еноху одну часть, осушённую в третий день... где тысячи гор»."
  52: "«левиафаму же дал еси седмую часть мокрую... да будет в снедь, имже хощеши и когда хощеши» — «Левиафану же дал Ты седьмую часть влажную... чтобы был в снедь тем, кому хочешь и когда хочешь»."
  53: "«в шестый день повелел еси земли, да сотворит... скоты и звери и гады» — «в шестой день повелел Ты земле, чтобы произвела... скотов, зверей и гадов»."
  54: "«и свыше сих адама, егоже поставил еси вожда и князя над всеми сотворенными» — «и выше сих — Адама, которого поставил Ты вождём и князем над всеми сотворёнными»; «от него родимся мы вси, ихже избрал еси люди» — «от него родились все мы, которых Ты избрал в народ»."
  55: "«яко ради нас создал еси век» — «ибо для нас создал Ты век»."
  56: "«прочия же языки от адама рождены, рекл еси оныя ничтоже быти» — «о прочих же народах, рождённых от Адама, Ты сказал, что они ничто»; «яко слине уподоблени суть, и яко капление от сосуда» — «они уподоблены слюне и каплям из сосуда»."
  57: "«тии языцы, иже ни во чтоже вменени суть, начаша владети нами и пожирати нас» — «эти народы, признанные ни за что, начали владеть нами и пожирать нас»."
  58: "«ихже нарекл еси первенцем единородным возлюбленным твоим» — «которых Ты назвал первенцем, единородным, возлюбленным Твоим»; «предани есмы в руки их» — «преданы мы в руки их»."
  59: "«аще ради нас сотворен бысть век, вскую достояния не одержим с веком? доколе сия?» — «если для нас создан век, почему не получаем наследия вместе с веком? доколе это?». Редакционная скобка «(будутъ)» не переносилась."
