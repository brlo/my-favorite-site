# jp-box, 1-я Царств, глава 31. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет,
# jp-ni (811 стихов, под авторским правом) источником не был.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 31: поражение при Гелвуе, смерть сыновей Саула (1–2); Саул и оруженосец
# (3–6); филистимляне занимают города, тела в Беф-Сане (7–10); жители Иависа
# Галаадского забирают тела и постятся (11–13).
# Речь — 「…」 (4, слова Саула). Красного нет.
# Нумерация по gr: 13 стихов, совпадает с csl/ru.
# 〔…〕 нет: в gr-lxx-byz на месте каждого стиха есть текст, знака «.» нет.
# Сносок ⟨…⟩ нет: ペリシテ人, 剣, 断食, ギルボア山 уже в корпусе.

tr_code: jp-box
book: 1ts
chapter: 31
draft: true

verses:
  1: "ペリシテ人[じん]はイスラエルと戦[たたか]った。イスラエルの男[おとこ]たちはペリシテ人[じん]の前[まえ]から逃[に]げ、ギルボア山[やま]で傷[きず]ついて倒[たお]れた。"
  2: "ペリシテ人[じん]はサウルとその息子[むすこ]たちに迫[せま]り、サウルの子[こ]ヨナタン、アミナダブ、メルキサを打[う]ち殺[ころ]した。"
  3: "戦[たたか]いはサウルにますます激[はげ]しくなり、槍[やり]を投[な]げる者[もの]たちと弓[ゆみ]を射[い]る者[もの]たちが彼[かれ]を見[み]つけて、彼[かれ]は腹[はら]のあたりに傷[きず]を負[お]った。"
  4: "サウルは武具[ぶぐ]を担[かつ]ぐ者[もの]に言[い]った。「おまえの剣[つるぎ]を抜[ぬ]いて、それでわたしを刺[さ]し殺[ころ]せ。この無[む]割礼[かつれい]の者[もの]たちが来[き]て、わたしを刺[さ]し、わたしを辱[はずか]しめてはならない。」しかし武具[ぶぐ]を担[かつ]ぐ者[もの]は、ひどく恐[おそ]れて、そうしようとしなかった。そこでサウルは剣[つるぎ]を取[と]って、その上[うえ]に倒[たお]れた。"
  5: "武具[ぶぐ]を担[かつ]ぐ者[もの]は、サウルが死[し]んだのを見[み]て、自分[じぶん]も剣[つるぎ]の上[うえ]に倒[たお]れて、彼[かれ]とともに死[し]んだ。"
  6: "こうしてサウルとその三人[さんにん]の息子[むすこ]たち、そして武具[ぶぐ]を担[かつ]ぐ者[もの]が、その日[ひ]、ともに死[し]んだ。"
  7: "谷[たに]の向[む]こう側[がわ]、ヨルダンの向[む]こう側[がわ]にいるイスラエルの男[おとこ]たちは、イスラエルが逃[に]げたこと、サウルとその息子[むすこ]たちが死[し]んだことを見[み]て、自分[じぶん]たちの町[まち]を捨[す]てて逃[に]げた。ペリシテ人[じん]は来[き]て、それらの町[まち]に住[す]んだ。"
  8: "翌日[よくじつ]、ペリシテ人[じん]は死[し]んだ者[もの]たちの着[き]物[もの]をはぎ取[と]ろうとして来[き]、サウルとその三人[さんにん]の息子[むすこ]たちがギルボアの山[やま]々[やま]に倒[たお]れているのを見[み]つけた。"
  9: "彼[かれ]らはサウルを回[まわ]して武具[ぶぐ]をはぎ取[と]り、それをペリシテの地[ち]の周[まわ]り中[じゅう]に送[おく]って、自分[じぶん]たちの偶像[ぐうぞう]と民[たみ]に知[し]らせた。"
  10: "彼[かれ]らはその武具[ぶぐ]をアスタルテの神殿[しんでん]に置[お]き、その体[からだ]をベトシャンの城壁[じょうへき]に打[う]ち付[つ]けた。"
  11: "ギレアデのヤビシュに住[す]む者[もの]たちは、ペリシテ人[じん]がサウルにしたことを聞[き]いた。"
  12: "力[ちから]ある者[もの]たちはみな立[た]ち上[あ]がり、夜[よる]通[どお]し歩[ある]いて、サウルの体[からだ]とその息子[むすこ]ヨナタンの体[からだ]をベトシャンの城壁[じょうへき]から取[と]り下[お]ろし、ヤビシュへ運[はこ]んで、そこで彼[かれ]らを焼[や]いた。"
  13: "彼[かれ]らはその骨[ほね]を取[と]り、ヤビシュの畑[はたけ]の下[した]に葬[ほうむ]り、七日間[なのかかん]断食[だんじき]した。"

notes:
  1: "ἐπολέμουν ἐπὶ Ισραηλ — воевали против Израиля (имперфект, длительное действие). ἔφυγον ἐκ προσώπου — побежали от лица. τραυματίαι — поражённые, израненные (τραυματίας). ἐν τῷ ὄρει τῷ Γελβουε — на горе Гелвуе (ギルボア山)."
  2: "συνάπτουσιν ἀλλόφυλοι τῷ Σαουλ — филистимляне сближаются, вступают в бой с Саулом (συνάπτω). τύπτουσιν — поражают. Ιωναθαν, Αμιναδαβ, Μελχισα — Ионафан, Аминадав, Мелхиса (так LXX; в евр. Авинадав и Малхисуа)."
  3: "βαρύνεται ὁ πόλεμος ἐπὶ Σαουλ — война тяжелеет против Саула. ἀκοντισταί, ἄνδρες τοξόται — копейщики, мужи-лучники (ἀκοντιστής — метатель дротика). ἐτραυματίσθη εἰς τὰ ὑποχόνδρια — «был изранен в подреберье» (ὑποχόνδρια — область под рёбрами, живот), 腹のあたり."
  4: "τὸν αἴροντα τὰ σκεύη αὐτοῦ — носящего оружие его, оруженосца (武具を担ぐ者). Σπάσαι τὴν ῥομφαίαν σου — обнажи меч твой (σπάω). ἀποκέντησόν με ἐν αὐτῇ — проколи меня им (ἀποκεντέω). οἱ ἀπερίτμητοι — необрезанные. ἐμπαίξωσίν μοι — поиздеваются надо мной. ἐπέπεσεν ἐπ᾽ αὐτήν — упал на него, на меч."
  5: "ὁ αἴρων τὰ σκεύη αὐτοῦ — оруженосец (σκεύη — оружие, доспехи). ἐπέπεσεν καὶ αὐτὸς ἐπὶ τὴν ῥομφαίαν αὐτοῦ — и сам упал на меч свой. ἀπέθανεν μετ᾽ αὐτοῦ — умер с ним."
  6: "οἱ τρεῖς υἱοὶ αὐτοῦ — три сына его. ἐν τῇ ἡμέρᾳ ἐκείνῃ κατὰ τὸ αὐτό — в тот день вместе, в одно время. В csl/ru добавлено «и все люди его» (по евр.), в gr этого нет."
  7: "οἱ ἐν τῷ πέραν τῆς κοιλάδος — те, кто за долиной (κοιλάς). οἱ ἐν τῷ πέραν τοῦ Ιορδάνου — те, кто за Иорданом. καταλείπουσιν τὰς πόλεις αὐτῶν — оставляют города свои. κατοικοῦσιν ἐν αὐταῖς — поселяются в них."
  8: "τῇ ἐπαύριον — на следующий день. ἐκδιδύσκειν τοὺς νεκρούς — обдирать, снимать одежды с мёртвых (ἐκδιδύσκω). πεπτωκότας ἐπὶ τὰ ὄρη Γελβουε — павших на горах Гелвуйских."
  9: "ἀποστρέφουσιν αὐτὸν — «обращают его», поворачивают (ἀποστρέφω); в csl добавлено «и отсекли главу его» (по евр.), в gr этого нет. ἐξέδυσαν τὰ σκεύη αὐτοῦ — сняли оружие его. κύκλῳ εὐαγγελίζοντες — вокруг возвещая (εὐαγγελίζω). τοῖς εἰδώλοις αὐτῶν — идолам их."
  10: "τὸ Ἀσταρτεῖον — храм Астарты (Ἀσταρτεῖον), アスタルテの神殿. ἀνέθηκαν — положили, посвятили (ἀνατίθημι). κατέπηξαν ἐν τῷ τείχει — воткнули, прибили к стене (καταπήγνυμι). Βαιθσαν — Беф-Сан (ベトシャン)."
  11: "οἱ κατοικοῦντες Ιαβις τῆς Γαλααδίτιδος — жители Иависа Галаадского (ギレアデのヤビシュ). ἃ ἐποίησαν οἱ ἀλλόφυλοι τῷ Σαουλ — что сделали филистимляне с Саулом."
  12: "πᾶς ἀνὴρ δυνάμεως — всякий муж силы, 力ある者. ὅλην τὴν νύκτα — всю ночь. ἀπὸ τείχους Βαιθσαν — со стены Беф-Сана. κατακαίουσιν αὐτοὺς ἐκεῖ — сожигают их там."
  13: "τὰ ὀστᾶ αὐτῶν — кости их. ὑπὸ τὴν ἄρουραν τὴν Ιαβις — «под поле Иависа» (ἄρουρα — пашня; слав. «в дубраве»). ἐνήστευσαν ἑπτὰ ἡμέρας — постились семь дней."
