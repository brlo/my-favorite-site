# jp-box, Даниил, глава 6. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной: 28 стихов. В gr-lxx-byz глава — 6:1–29; наш стих
# = gr стих + 1 (наш 6:1 = gr 6:2 … наш 6:27 = gr 6:28, наш 6:28 = gr 6:29).
# gr 6:1 не имеет отдельного слав. стиха: это «Артаксеркс Мидянин принял царство;
# и Дарий, полный дней и славный в старости» — содержание уже дано в нашем 5:31.
# Наш 6:28 слит по смыслу из двух: слав. (МТ 6:28) «Даниил же управляше во царстве
# дариеве и во царстве кира персянина» + gr 6:29 «и царь Дарий приложился к роду
# своему, и Даниил поставлен над царством Дария; и Кир Перс принял его царство».
# «Точек» в этой главе нет: все стихи есть в gr-lxx-byz.
# Язык — современный 常体; порядок членов и клаузы — по греческому/слав.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 6:1–3 сто двадцать сатрапов, три начальника, Даниил; 6:4–5 ищут вины
# и не находят; 6:6–8 заговор и запрет молиться тридцать дней; 6:9 царь подписал;
# 6:10 Даниил молится трижды в день при открытых окнах; 6:11–13 донос;
# 6:14–15 царь скорбит, закон Мидян и Персов; 6:16–17 Даниил во рву, камень и печать;
# 6:18 ночь царя, уста львов заключены; 6:19–21 царь у рва, «данииле, рабе Бога живаго»;
# 6:22–23 ответ Даниила и избавление; 6:24 обвинители и их семьи во рву;
# 6:25–27 письмо Дария всем народам; 6:28 Даниил при Дарии и Кире, кончина Дария.
# Голоса: 6:6–8 — речь заговорщиков 「…»; 6:12 — их слова 「…» и ответ царя 「…»;
# 6:13 — их слова 「…»; 6:15 — их слова 「…»; 6:16 — слова царя 「…」;
# 6:20 — возглас царя 「…」; 6:21–22 — ответ Даниила 「…»;
# 6:25–27 — письмо Дария 「…」. 6:1–5, 9–11, 14, 17–19, 23–24, 28 — повествование.
# Термины: 太守[たいしゅ] — σατράπης («князи»); 長官[ちょうかん] — ἄρχων («чиновники»);
# 将軍[しょうぐん] — στρατηγός («воеводы»); 禁令[きんれい] — ὁρισμός/δόγμα («предел»);
# 法令[ほうれい] — δόγμα («заповедь мидска и перска»); 獅子[しし]の穴[あな] — λάκκος τῶν
# λεόντων («ров львиный»); 屋上[おくじょう]の部屋[へや] — ὑπερῷον («горница»);
# 指輪[ゆびわ] — δακτύλιος («перстень»); 御使[みつか]い — ἄγγελος.
# Имена: ダリウス, ダニエル, バルタザル, クロス, メディア人[じん], ペルシア人[じん],
# バビロン — по брифу и корпусу.

