verses:
  1: "ダリウスは、自分の王国[おうこく]の全[ぜん]土[ど]に百二十人[ひゃくにじゅうにん]の太守[たいしゅ]を置[お]くことをよしとした。"
  2: "また、その上[うえ]に三[さん]人[にん]の長官[ちょうかん]を置[お]いた。その一人[ひとり]がダニエルであった。太守[たいしゅ]たちがこの者[もの]たちに報告[ほうこく]して、王[おう]に煩[わずら]いがかからないようにするためである。"
  3: "ダニエルは彼らよりも抜[ぬ]きんでていた。すぐれた霊[れい]が彼のうちにあったからである。そこで王[おう]は彼を王国[おうこく]の全体[ぜんたい]の上[うえ]に立[た]てようと考えた。"
  4: "そこで長官[ちょうかん]たちと太守[たいしゅ]たちは、ダニエルを訴[うった]える口実[こうじつ]を探[さが]した。しかし、どんな口実[こうじつ]も過[あやま]ちも罪[つみ]も見[み]つからなかった。彼が忠実[ちゅうじつ]だったからである。"
  5: "そこでこの者[もの]たちは言[い]った。「ダニエルを訴[うった]える口実[こうじつ]は見[み]つからない。彼の神[かみ]の律法[りっぽう]に関[かん]することでなければ。」"
  6: "そこで長官[ちょうかん]たちと太守[たいしゅ]たちは王[おう]の前[まえ]に進[すす]み出[で]て言[い]った。「ダリウス王[おう]よ、永遠[えいえん]に生[い]きよ。"
  7: "あなたの王国[おうこく]のすべての将軍[しょうぐん]たち、長官[ちょうかん]たち、太守[たいしゅ]たち、国[くに]々[ぐに]を治[おさ]める者[もの]たちは、王[おう]の定[さだ]めを設[もう]け、禁令[きんれい]を固[かた]くすることを議[はか]りました。すなわち、三十日[さんじゅうにち]の間[あいだ]、王[おう]であるあなた以外[いがい]の、どの神[かみ]にも人[ひと]にも願[ねが]い事[ごと]をする者[もの]は、獅子[しし]の穴[あな]に投[な]げ込[こ]まれる、というものです。"
  8: "そこで今[いま]、王[おう]よ、この禁令[きんれい]を定[さだ]めて書[か]き記[しる]してください。メディア人[じん]とペルシア人[じん]の法令[ほうれい]は変[か]えられないものとなるためです。」"
  9: "そこでダリウス王[おう]は、その禁令[きんれい]を書[か]き記[しる]すように命[めい]じた。"
  10: "ダニエルは、その禁令[きんれい]が記[しる]されたことを知[し]ると、家[いえ]に帰[かえ]った。その屋上[おくじょう]の部屋[へや]の窓[まど]はエルサレムに向[む]かって開[あ]け放[はな]たれていた。彼は日[ひ]に三度[さんど]、ひざまずいて、自分の神[かみ]に祈[いの]り、告白[こくはく]した。以前[いぜん]からそうしていたとおりである。"
  11: "そこでこの者[もの]たちは見張[みは]っていて、ダニエルが自分の神[かみ]に願[ねが]い、祈[いの]っているのを見[み]つけた。"
  12: "そして彼らは来[き]て、王[おう]の前[まえ]で言[い]った。「王[おう]よ、あなたは禁令[きんれい]を定[さだ]められました。三十日[さんじゅうにち]の間[あいだ]、あなた以外[いがい]のどの神[かみ]にも人[ひと]にも願[ねが]い事[ごと]をする者[もの]は、獅子[しし]の穴[あな]に投[な]げ込[こ]まれる、と。」王[おう]は答[こた]えて言[い]った。「その言葉[ことば]は確[たし]かである。メディア人[じん]とペルシア人[じん]の法令[ほうれい]は過[す]ぎ去[さ]ることはない。」"
  13: "彼らは王[おう]に答[こた]えて言[い]った。「ユダヤの捕囚[ほしゅう]の子[こ]らであるダニエルは、あなたにも、あなたが定[さだ]めた禁令[きんれい]にも従[したが]いません。彼は日[ひ]に三度[さんど]、自分の神[かみ]に願[ねが]い事[ごと]をしています。」"
  14: "王[おう]はこの言葉[ことば]を聞[き]いて、ダニエルのことでひどく心[こころ]を痛[いた]め、彼を救[すく]い出[だ]そうと努[つと]めた。日[ひ]の暮[く]れまで、彼を救[すく]い出[だ]すために努[つと]め続[つづ]けた。"
  15: "するとあの者[もの]たちは王[おう]に言[い]った。「王[おう]よ、ご存[ぞん]じのとおり、メディア人[じん]とペルシア人[じん]の法[ほう]では、王[おう]が定[さだ]めたどのような禁令[きんれい]も定[さだ]めも変[か]えることはできません。」"
  16: "そこで王[おう]は命[めい]じ、人[ひと]々[びと]はダニエルを連[つ]れて来[き]て獅子[しし]の穴[あな]に投[な]げ込[こ]んだ。王[おう]はダニエルに言[い]った。「あなたがいつも仕[つか]えているあなたの神[かみ]が、あなたを救[すく]い出[だ]してくださるように。」"
  17: "一[ひと]つの石[いし]が運[はこ]ばれて来[き]て、穴[あな]の口[くち]に置[お]かれた。王[おう]は自分の指輪[ゆびわ]と貴[き]人[じん]たちの指輪[ゆびわ]でそれを封[ふう]じた。ダニエルについての取[と]り決[き]めが変[か]わらないようにするためである。"
  18: "王[おう]は自分の宮[みや]に帰[かえ]り、夕食[ゆうしょく]もとらずに床[とこ]についた。食[たべ]べ物[もの]も彼のところへ運[はこ]ばせず、眠[ねむ]りは彼から去[さ]った。そして神[かみ]は獅子[しし]たちの口[くち]を閉[と]ざされ、彼らはダニエルを悩[なや]まさなかった。"
  19: "夜[よ]が明[あ]けると、王[おう]は起[お]きて、急[いそ]いで獅子[しし]の穴[あな]へ行[い]った。"
  20: "穴[あな]に近[ちか]づくと、彼は強[つよ]い声[こえ]で叫[さけ]んだ。「ダニエル、生[い]ける神[かみ]の僕[しもべ]よ。あなたがいつも仕[つか]えているあなたの神[かみ]は、獅子[しし]の口[くち]からあなたを救[すく]い出[だ]すことができたか。」"
  21: "ダニエルは王[おう]に言[い]った。「王[おう]よ、永遠[えいえん]に生[い]きよ。"
  22: "わが神[かみ]は御使[みつか]いを遣[つか]わして獅子[しし]たちの口[くち]を閉[と]ざされました。彼らはわたしを傷[きず]つけませんでした。わたしが神[かみ]の前[まえ]に正[ただ]しいと認[みと]められ、また王[おう]よ、あなたの前[まえ]にも罪[つみ]を犯[おか]さなかったからです。」"
  23: "そこで王[おう]はダニエルのことで大[おお]いに喜[よろこ]び、ダニエルを穴[あな]から引[ひ]き上[あ]げるように命[めい]じた。ダニエルは穴[あな]から引[ひ]き上[あ]げられたが、どこにも傷[きず]はなかった。彼が自分の神[かみ]を信[しん]じたからである。"
  24: "王[おう]は命[めい]じた。ダニエルを訴[うった]えた者[もの]たちは連[つ]れて来[こ]られ、獅子[しし]の穴[あな]に投[な]げ込[こ]まれた。彼らもその子[こ]どもたちも妻[つま]たちもである。彼らが穴[あな]の底[そこ]に達[たっ]しないうちに、獅子[しし]たちが彼らに襲[おそ]いかかり、その骨[ほね]をすべて砕[くだ]いた。"
  25: "その後[のち]、ダリウス王[おう]は、全[ぜん]地[ち]に住[す]むすべての民[たみ]、部族[ぶぞく]、言[こと]語[ご]の者[もの]たちに書[か]き送[おく]った。「あなたがたに平和[へいわ]が豊[ゆた]かに増[ま]し加[くわ]わりますように。"
  26: "わたしの命[めい]によって、わが王国[おうこく]の全[ぜん]土[ど]にこの命令[めいれい]が定[さだ]められる。すべての者[もの]がダニエルの神[かみ]の前[まえ]に震[ふる]え恐[おそ]れるように。この方[かた]は生[い]ける神[かみ]、世[よ]々[よ]に絶[た]えることのない方[かた]、その王国[おうこく]は砕[くだ]かれず、その支[し]配[はい]は終[お]わりがない。"
  27: "この方[かた]は救[すく]い上[あ]げ、救[すく]い出[だ]し、天[てん]にも地[ち]にもしるしと奇[き]跡[せき]を行[おこな]われる。この方[かた]がダニエルを獅子[しし]の口[くち]から救[すく]い出[だ]したのである。」"
  28: "ダニエルはダリウスの治世[ちせい]にも、ペルシア人[じん]クロスの治世[ちせい]にも、栄[さか]えた。ダリウス王[おう]は自分の民[たみ]に加[くわ]えられ、ダニエルはダリウスの王国[おうこく]の上[うえ]に据[す]えられ、ペルシア人[じん]クロスがその王国[おうこく]を受[う]け取[と]った。"

notes:
  1: "καὶ κατέστησε σατράπας ἑκατὸν εἴκοσι ἑπτὰ ἐπὶ πάσης τῆς βασιλείας αὐτοῦ — «и поставил сатрапов сто двадцать семь над всем царством своим» (gr 6:2; наш 6:1 = gr 6:2, сдвиг +1). В LXX-модуле «сто двадцать семь» (ἑπτά — «семь»); слав. (МТ 6:1): «и бысть угодно пред царем, и постави во царстве князей сто и двадесять, еже быти им во всем царстве его» — сто двадцать; по паритету взят слав. Перед этим в модуле стоит gr 6:1 (слав. стиха нет): καὶ Ἀρταξέρξης ὁ τῶν Μήδων παρέλαβε τὴν βασιλείαν. Καὶ Δαρεῖος πλήρης τῶν ἡμερῶν καὶ ἔνδοξος ἐν γήρει — «и Артаксеркс Мидянин принял царство; и Дарий, полный дней и славный в старости»; это содержание нашего 5:31."
  2: "καὶ ἐπ' αὐτῶν ἄνδρας τρεῖς ἡγουμένους αὐτῶν, καὶ Δανιηλ εἷς ἦν τῶν τριῶν ἀνδρῶν — «и над ними трёх мужей, начальствующих над ними, и Даниил был один из трёх мужей» (gr 6:3). Слав. (МТ 6:2): «над ними же три чиновники, от нихже бе даниил един, дабы отдавали им князи слово, яко да царю не стужают»; по паритету взят слав. 長官[ちょうかん] — «чиновники» (ἄρχοντες)."
  3: "καὶ Δανιηλ ἦν ἐνδεδυμένος πορφύραν καὶ μέγας καὶ ἔνδοξος ἔναντι Δαρείου τοῦ βασιλέως… καὶ πνεῦμα ἅγιον ἐν αὐτῷ… τότε ὁ βασιλεὺς ἐβουλεύσατο καταστῆσαι τὸν Δανιηλ ἐπὶ πάσης τῆς βασιλείας αὐτοῦ — «и Даниил был облечён в порфиру, и велик и славен пред Дарием царём… и дух святой в нём… тогда царь решил поставить Даниила над всем царством своим» (gr 6:4). Слав. (МТ 6:3): «и бе даниил над ними, яко дух бяше преизюбилен в нем, и царь постави его над всем царством своим»; по паритету взят слав.; LXX-прибавка о порфире и славе в текст не внесена."
  4: "ὅτε δὲ ἐβουλεύσατο ὁ βασιλεὺς καταστῆσαι τὸν Δανιηλ… τότε βουλὴν καὶ γνώμην ἐβουλεύσαντο ἐν ἑαυτοῖς οἱ δύο νεανίσκοι… ἐπεὶ οὐδεμίαν ἁμαρτίαν οὐδὲ ἄγνοιαν ηὕρισκον κατὰ τοῦ Δανιηλ — «когда же царь решил поставить Даниила… тогда совет и мнение держали между собою те два юноши… так как не находили никакого греха или неведения против Даниила» (gr 6:5). Слав. (МТ 6:4): «чиновницы же и князи искаху вины обрести на даниила: и всякия вины и соблазна и греха не обретоша на него, яко верен бяше»; по паритету взят слав. (ищут все, а не «два юноши» — LXX-чтение отмечено здесь)."
  5: "Слав. (МТ 6:5): «и реща чиновницы не обрящем на даниила вины, аще не в законех Бога его» — «не найдём против Даниила вины, если не в законах Бога его». LXX (gr 6:6) излагает сразу замысел: καὶ εἶπαν· Δεῦτε στήσωμεν ὁρισμὸν καθ' ἑαυτῶν ὅτι πᾶς ἄνθρωπος οὐκ ἀξιώσει ἀξίωμα καὶ οὐ μὴ εὔξηται εὐχὴν ἀπὸ παντὸς θεοῦ ἕως ἡμερῶν τριάκοντα, ἀλλ' ἢ παρὰ Δαρείου… ᾔδεισαν γὰρ ὅτι Δανιηλ προσεύχεται καὶ δεῖται κυρίου τοῦ θεοῦ αὐτοῦ τρὶς τῆς ἡμέρας — «придите, поставим определение… всякий человек не будет просить ни у какого бога тридцать дней, кроме Дария… ибо знали, что Даниил молится Господу Богу своему трижды в день». По паритету взят слав., LXX — здесь."
  6: "τότε προσήλθοσαν οἱ ἄνθρωποι ἐκεῖνοι καὶ εἶπαν ἐναντίον τοῦ βασιλέως — «тогда те люди приступили и сказали пред царём» (gr 6:7). Слав. (МТ 6:6): «тогда чиновницы и князи предсташа царю и реша ему: дарие царю, во веки живи»; приветствие — слав./МТ, в LXX его нет. Здесь начинается речь заговорщиков; она идёт до конца 6:8."
  7: "В gr-lxx-byz стих — продолжение определения: Ὁρισμὸν καὶ στάσιν ἐστήσαμεν ὅτι πᾶς ἄνθρωπος, ὃς ἂν εὔξηται εὐχὴν ἢ ἀξιώσῃ ἀξίωμά τι παρὰ παντὸς θεοῦ ἕως ἡμερῶν τριάκοντα ἀλλ' ἢ παρὰ Δαρείου τοῦ βασιλέως, ῥιφήσεται εἰς τὸν λάκκον τῶν λεόντων (gr 6:8). Слав. (МТ 6:7): «совещаша вси иже во царстве твоем воеводы и князи, ипати и обладающии странами, еже уставити устав царский и укрепити предел, яко аще кто попросит прошения от всякаго бога и человека до дний тридесяти, разве точию от тебе, царю, да ввержен будет в ров левский»; по паритету взят слав. (перечень сановников). 獅子[しし]の穴[あな] — «ров львиный» (λάκκος τῶν λεόντων)."
  8: "καὶ ἠξίωσαν τὸν βασιλέα ἵνα στήσῃ τὸν ὁρισμὸν καὶ μὴ ἀλλοιώσῃ αὐτόν, διότι ᾔδεισαν ὅτι Δανιηλ προσεύχεται… — «и просили царя, чтобы он утвердил определение и не изменял его, потому что знали, что Даниил молится…» (gr 6:9). Слав. (МТ 6:8): «ныне убо, царю, устави предел и положи писание, яко да не изменится заповедь мидска и персска, (да никтоже преступит ея)»; по паритету взят слав. Речь заговорщиков закрывается."
  9: "καὶ οὕτως ὁ βασιλεὺς Δαρεῖος ἔστησε καὶ ἐκύρωσεν — «и так царь Дарий утвердил и узаконил» (gr 6:10). Слав. (МТ 6:9): «тогда царь дарий повеле вписати заповедь»; по паритету взят слав."
  10: "ἐπιγνοὺς δὲ Δανιηλ τὸν ὁρισμόν… θυρίδας ἤνοιξεν ἐν τῷ ὑπερῴῳ αὐτοῦ κατέναντι Ιερουσαλημ καὶ ἔπιπτεν ἐπὶ πρόσωπον αὐτοῦ τρὶς τῆς ἡμέρας, καθὼς ἐποίει ἔμπροσθεν, καὶ ἐδεῖτο — «узнав об определении… окна открыл в горнице своей против Иерусалима и падал на лицо своё трижды в день, как делал прежде, и молился» (gr 6:11). Слав. (МТ 6:10): «даниил же егда уведе, яко заповедь вчинися, вниде в дом свой: дверцы же отверсты ему в горнице его противу Иерусалима, в три же времена дне бяше прекланяя колена своя, моляся и исповедаяся пред Богом своим, якоже бе творя прежде»; по паритету взят слав. (преклонение колен, исповедание). 屋上[おくじょう]の部屋[へや] — ὑπερῷον («горница»)."
  11: "καὶ αὐτοὶ ἐτήρησαν τὸν Δανιηλ καὶ κατελάβοσαν αὐτὸν εὐχόμενον τρὶς τῆς ἡμέρας καθ' ἑκάστην ἡμέραν — «и сами наблюдали за Даниилом и застали его молящимся трижды в день каждый день» (gr 6:12). Слав. (МТ 6:11): «тогда мужие онии наблюдоша и обретоша даниила просяща и молящася Богу своему»; по паритету взят слав."
  12: "τότε οὗτοι οἱ ἄνθρωποι ἐνέτυχον τῷ βασιλεῖ… οὐχ ὁρισμὸν ὡρίσω ἵνα πᾶς ἄνθρωπος μὴ εὔξηται… ἀποκριθεὶς δὲ ὁ βασιλεὺς εἶπεν αὐτοῖς· Ἀκριβὴς ὁ λόγος, καὶ μενεῖ ὁ ὁρισμός. 13a καὶ εἶπον αὐτῷ· Ὁρκίζομέν σε τοῖς Μήδων καὶ Περσῶν δόγμασιν, ἵνα μὴ ἀλλοιώσῃς τὸ πρόσταγμα — «тогда эти люди обратились к царю… не ты ли определил, чтобы всякий человек не просил…? и, отвечая, царь сказал им: слово точно, и определение останется. И сказали ему: заклинаем тебя определениями Мидян и Персов, чтобы не изменил повеления» (gr 6:13). Слав. (МТ 6:12): «и пришедше реша пред царем: царю, не вчинил ли еси ты предела, яко да всяк человек… да ввержется в ров левск? И рече царь: истинно слово, и заповедь мидска и персска не мимоидет»; по паритету взят слав.; заклятие LXX (13a) в текст не внесено."
  13: "καὶ εἶπαν· Ἰδοὺ εὕρομεν Δανιηλ τὸν φίλον σου εὐχόμενον καὶ δεόμενον τοῦ προσώπου τοῦ θεοῦ αὐτοῦ τρὶς τῆς ἡμέρας — «и сказали: вот, мы нашли Даниила, друга твоего, молящимся и умоляющим лицо Бога своего трижды в день» (gr 6:14). Слав. (МТ 6:13): «тогда отвещаша пред царем и глаголаша: даниил, иже от сынов плена иудейска, не покорися заповеди твоей (и не раде) о пределе, егоже вчинил еси: в три бо времена дне просит у Бога своего прошений своих»; по паритету взят слав. («от сынов плена иудейска» — 捕囚[ほしゅう]の子[こ]ら), LXX-«друг твой» не внесено."
  14: "καὶ λυπούμενος ὁ βασιλεὺς εἶπεν ῥιφῆναι τὸν Δανιηλ εἰς τὸν λάκκον τῶν λεόντων κατὰ τὸν ὁρισμόν… τότε ὁ βασιλεὺς σφόδρα ἐλυπήθη ἐπὶ τῷ Δανιηλ καὶ ἐβοήθει τοῦ ἐξελέσθαι αὐτὸν ἕως δυσμῶν ἡλίου ἀπὸ τῶν χειρῶν τῶν σατραπῶν — «и, скорбя, царь сказал бросить Даниила в львиный ров по определению… тогда царь сильно опечалился о Данииле и помогал избавить его до захода солнца от рук сатрапов» (gr 6:15). Слав. (МТ 6:14): «тогда царь, яко слышав слово сие, зело опечалися о нем, и о данииле пряшеся еже избавити его, и бе даже до вечера пряся еже избавити его»; по паритету взят слав.; повеление бросить (LXX) — в 6:16."
  15: "καὶ οὐκ ἠδύνατο ἐξελέσθαι αὐτὸν ἀπ' αὐτῶν — «и не мог избавить его от них» (gr 6:16). Слав. (МТ 6:15): «тогда мужие онии глаголаша царю: веждь, царю яко мидом и персом не леть есть пременити всякаго предела и устава, егоже царь уставит»; по паритету взят слав. (обращение заговорщиков), LXX-краткое чтение — здесь."
  16: "ἀναβοήσας δὲ Δαρεῖος ὁ βασιλεὺς εἶπε τῷ Δανιηλ· Ὁ θεός σου, ᾧ σὺ λατρεύεις ἐνδελεχῶς τρὶς τῆς ἡμέρας, αὐτὸς ἐξελεῖταί σε ἐκ χειρὸς τῶν λεόντων· ἕως πρωῒ θάρρει — «возопив, царь Дарий сказал Даниилу: Бог твой, которому ты служишь непрестанно трижды в день, Он избавит тебя от руки львов; до утра дерзай» (gr 6:17). Слав. (МТ 6:16): «тогда царь рече, и приведоша даниила и ввергоша его в ров левск. И рече царь даниилу: Бог твой, емуже ты служиши присно, той избавит тя»; по паритету взят слав. (повеление и бросание — здесь), LXX-«до утра дерзай» не внесено."
  17: "τότε Δανιηλ ἐρρίφη εἰς τὸν λάκκον τῶν λεόντων, καὶ ἠνέχθη λίθος καὶ ἐτέθη εἰς τὸ στόμα τοῦ λάκκου, καὶ ἐσφραγίσατο ὁ βασιλεὺς ἐν τῷ δακτυλίῳ ἑαυτοῦ καὶ ἐν τοῖς δακτυλίοις τῶν μεγιστάνων αὐτοῦ, ὅπως μὴ ἀπ' αὐτῶν ἀρθῇ ὁ Δανιηλ — «тогда Даниил был брошен в львиный ров, и принесён был камень и положен в уста рва, и запечатал царь перстнем своим и перстнями вельмож своих, чтобы не был взят от них Даниил» (gr 6:18). Слав. (МТ 6:17): «и принесоша камень един и возложиша на устие рва, и запечата царь перстнем своим и перстнем вельмож своих, да не изменится деяние о данииле»; по паритету взят слав. 指輪[ゆびわ] — δακτύλιος («перстень»)."
  18: "τότε ὑπέστρεψεν ὁ βασιλεὺς εἰς τὰ βασίλεια αὐτοῦ καὶ ηὐλίσθη νῆστις καὶ ἦν λυπούμενος περὶ τοῦ Δανιηλ. τότε ὁ θεὸς τοῦ Δανιηλ πρόνοιαν ποιούμενος αὐτοῦ ἀπέκλεισε τὰ στόματα τῶν λεόντων, καὶ οὐ παρηνώχλησαν τῷ Δανιηλ — «тогда царь вернулся в свои палаты и провёл ночь без пищи и был печален о Данииле. Тогда Бог Даниила, промышляя о нём, заключил уста львов, и они не досаждали Даниилу» (gr 6:19). Слав. (МТ 6:18): «и отиде царь в дом свой и ляже без вечери, и яди не внесоша к нему: и сон отступи от него. И заключи Бог уста львом, и не стужиша даниилу»; по паритету взят слав."
  19: "καὶ ὁ βασιλεὺς Δαρεῖος ὤρθρισε πρωῒ καὶ παρέλαβε μεθ' ἑαυτοῦ τοὺς σατράπας καὶ πορευθεὶς ἔστη ἐπὶ τοῦ στόματος τοῦ λάκκου τῶν λεόντων — «и царь Дарий встал рано утром, и взял с собою сатрапов, и, придя, стал у устья рва львиного» (gr 6:20). Слав. (МТ 6:19): «тогда царь воста заутра на свете и со тщанием прииде ко рву левску»; по паритету взят слав. (LXX: со сатрапами)."
  20: "τότε ὁ βασιλεὺς ἐκάλεσε τὸν Δανιηλ φωνῇ μεγάλῃ μετὰ κλαυθμοῦ λέγων· Ὦ Δανιηλ, εἰ ἄρα ζῇς, καὶ ὁ θεός σου, ᾧ λατρεύεις ἐνδελεχῶς, σέσωκέ σε ἀπὸ τῶν λεόντων, καὶ οὐκ ἠχρείωκάν σε; — «тогда царь воззвал Даниила громким голосом с плачем, говоря: о Даниил, жив ли ты ещё, и Бог твой, которому ты служишь непрестанно, спас ли тебя от львов и не повредил ли тебе?» (gr 6:21). Слав. (МТ 6:20): «и егда приближися ко рву, возопи гласом крепким: данииле, рабе Бога живаго! Бог твой, емуже ты служиши присно, возможе ли избавити тя из уст львовых?»; по паритету взят слав. (исповедание «рабе Бога живаго»), плач LXX — здесь."
  21: "τότε Δανιηλ ἐπήκουσε φωνῇ μεγάλῃ καὶ εἶπεν· Βασιλεῦ, ἔτι εἰμὶ ζῶν — «тогда Даниил услышал громкий голос и сказал: царь, я ещё жив» (gr 6:22). Слав. (МТ 6:21): «и рече даниил цареви: царю, во веки живи»; по паритету взят слав. Здесь начинается ответ Даниила; он закрывается в конце 6:22."
  22: "καὶ σέσωκέ με ὁ θεὸς ἀπὸ τῶν λεόντων, καθότι δικαιοσύνη ἐν ἐμοὶ εὑρέθη ἐναντίον αὐτοῦ· καὶ ἐναντίον δὲ σοῦ, βασιλεῦ, οὔτε ἄγνοια οὔτε ἁμαρτία εὑρέθη ἐν ἐμοί· σὺ δὲ ἤκουσας ἀνθρώπων πλανώντων βασιλεῖς καὶ ἔρριψάς με εἰς τὸν λάκκον τῶν λεόντων εἰς ἀπώλειαν — «и спас меня Бог от львов, так как праведность во мне нашлась пред Ним; и пред тобою, царь, ни неведения, ни греха не нашлось во мне; а ты послушал людей, обольщающих царей, и бросил меня в львиный ров на погибель» (gr 6:23). Слав. (МТ 6:22): «Бог мой посла ангела своего и затвори уста львов, и не вредиша мене, яко обретеся пред ним правда моя, и пред тобою, царю, согрешения не сотворих»; по паритету взят слав.; обличение царю («послушал людей, обольщающих царей») — только LXX, в текст не внесено. 御使[みつか]い — ἄγγελος."
  23: "τότε συνήχθησαν πᾶσαι αἱ δυνάμεις καὶ εἶδον τὸν Δανιηλ, ὡς οὐ παρηνώχλησαν αὐτῷ οἱ λέοντες — «тогда собрались все силы и увидели Даниила, что львы не повредили ему» (gr 6:24). Слав. (МТ 6:23): «тогда царь вельми возвеселися о нем и рече даниила извести из рва. И изведен бысть даниил из рва, и всякаго тления не обретеся на нем яко верова в Бога своего»; по паритету взят слав. (радость царя и изведение из рва), LXX — здесь."
  24: "τότε οἱ δύο ἄνθρωποι ἐκεῖνοι οἱ καταμαρτυρήσαντες τοῦ Δανιηλ, αὐτοὶ καὶ αἱ γυναῖκες αὐτῶν καὶ τὰ τέκνα αὐτῶν, ἐρρίφησαν τοῖς λέουσι, καὶ οἱ λέοντες ἀπέκτειναν αὐτοὺς καὶ ἔθλασαν τὰ ὀστᾶ αὐτῶν — «тогда те два человека, лжесвидетельствовавшие против Даниила, сами и жёны их и дети их, брошены были львам, и львы убили их и раздробили кости их» (gr 6:25). Слав. (МТ 6:24): «и рече царь, и приведоша мужы оклеветавшыя даниила и в ров левск ввергоша я и сыны их и жены их: и не доидоша дна рва, даже соодолеша им львы и вся кости их истончиша»; по паритету взят слав. (не дошли до дна рва)."
  25: "τότε Δαρεῖος ἔγραψε πᾶσι τοῖς ἔθνεσι καὶ χώραις καὶ γλώσσαις, τοῖς οἰκοῦσιν ἐν πάσῃ τῇ γῇ αὐτοῦ λέγων — «тогда Дарий написал всем народам и странам и языкам, живущим по всей земле его, говоря» (gr 6:26). Слав. (МТ 6:25): «тогда дарий царь написа всем людем, племеном, языком, живущым во всей земли: мир вам да умножится»; по паритету взят слав. (приветствие — здесь). Здесь начинается письмо Дария; оно закрывается в конце 6:27."
  26: "Πάντες οἱ ἄνθρωποι οἱ ὄντες ἐν τῇ βασιλείᾳ μου ἔστωσαν προσκυνοῦντες καὶ λατρεύοντες τῷ θεῷ τοῦ Δανιηλ, αὐτὸς γάρ ἐστι θεὸς μένων καὶ ζῶν εἰς γενεὰς γενεῶν ἕως τοῦ αἰῶνος — «все люди, сущие в царстве моём, да поклоняются и служат Богу Даниила, ибо Он Бог пребывающий и живой в роды родов до века» (gr 6:27). Слав. (МТ 6:26): «от лица моего заповедася заповедь сия во всей земли царства моего, да будут трепещуще и боящеся от лица Бога даниилова, яко той есть Бог живый и пребываяй во веки, и Царство его не разсыплется, и власть его до конца»; по паритету взят слав. (трепет и благоговение)."
  27: "Слав. (МТ 6:27): «подемлет и избавляет, и творит знамения и чудеса на небеси и на земли, иже избави даниила от уст львовых» — «Он избавляет и спасает, и творит знамения и чудеса на небе и на земле, Он избавил Даниила от уст львовых». LXX (gr 6:28) иначе: ἐγὼ Δαρεῖος ἔσομαι αὐτῷ προσκυνῶν καὶ δουλεύων πάσας τὰς ἡμέρας μου, τὰ γὰρ εἴδωλα τὰ χειροποίητα οὐ δύνανται σῶσαι, ὡς ἐλυτρώσατο ὁ θεὸς τοῦ Δανιηλ τὸν Δανιηλ — «я, Дарий, буду поклоняться Ему и служить все дни мои, ибо рукотворённые идолы не могут спасать, как избавил Бог Даниила Даниила». По паритету взят слав., LXX-чтение — здесь. Письмо Дария закрывается."
  28: "Слито из двух: слав. (МТ 6:28) «даниил же управляше во царстве дариеве и во царстве кира персянина» — «Даниил же управлял в царстве Дария и в царстве Кира Персянина», и gr 6:29: καὶ ὁ βασιλεὺς Δαρεῖος προσετέθη πρὸς τὸ γένος αὐτοῦ, καὶ Δανιηλ κατεστάθη ἐπὶ τῆς βασιλείας Δαρείου· καὶ Κῦρος ὁ Πέρσης παρέλαβε τὴν βασιλείαν αὐτοῦ — «и царь Дарий приложился к роду своему, и Даниил поставлен был над царством Дария; и Кир Перс принял его царство». По брифу gr 6:29 входит в наш 6:28, отдельного 6:29 нет. «Приложился к роду своему» — эвфемизм смерти (ср. Быт 25:8); переведено 自分[じぶん]の民[たみ]に加[くわ]えられ, без пояснения в тексте. クロス — Κῦρος, ペルシア人[じん] — ὁ Πέρσης."
