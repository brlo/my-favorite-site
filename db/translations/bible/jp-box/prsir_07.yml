verses:
  1: "悪[わる]いことをするな。そうすれば、悪[あく]があなたを捕[と]らえることはない。"
  2: "不正[ふせい]から離[はな]れよ。そうすれば、それはあなたから遠[とお]ざかる。"
  3: "子[こ]よ、不正[ふせい]の畝[うね]に種[たね]を蒔[ま]くな。刈[か]り取[と]っても七倍[ななばい]にはならない。"
  4: "主[しゅ]から支配[しはい]の座[ざ]を求[もと]めるな。王[おう]から栄光[えいこう]の席[せき]を求めるな。"
  5: "主[しゅ]の前[まえ]で自分[じぶん]を正[ただ]しいとするな。王[おう]の前で賢[かしこ]ぶるな。"
  6: "裁[さば]き手[て]になろうとするな。あなたは不正[ふせい]を取[と]り除[のぞ]く力[ちから]がないかもしれない。権力者[けんりょくしゃ]の前[まえ]で恐[おそ]れを抱[いだ]き、あなたの正[ただ]しさのうちにつまずきを置[お]くことになるかもしれない。"
  7: "町[まち]の多[おお]くの人[ひと]に対して罪[つみ]を犯[おか]すな。群衆[ぐんしゅう]の中[なか]で自分[じぶん]を落[お]とすな。"
  8: "罪[つみ]を二度[にど]重[かさ]ねるな。一[ひと]つの罪でも、あなたは無罪[むざい]ではないからである。"
  9: "「わたしの贈[おく]り物[もの]の多[おお]さを、神[かみ]は顧[かえり]みてくださるだろう。いと高[たか]い神に献[ささ]げ物をするとき、神はそれを受[う]け入[い]れてくださる」と言[い]ってはならない。"
  10: "あなたの祈[いの]りで気[き]を落[おと]すな。施[ほどこ]しをすることを怠[おこた]るな。"
  11: "魂[たましい]の苦[くる]しみのうちにある人[ひと]を嘲[あざけ]るな。低[ひく]くする方[かた]も、高[たか]くする方もおられるからである。"
  12: "あなたの兄弟[きょうだい]に対して偽[いつわ]りを耕[たがや]すな。友[とも]にも同[おな]じことをするな。"
  13: "どんな偽[いつわ]りでも、進[すす]んで語[かた]ろうとするな。その繰[く]り返[かえ]しは良[よ]い結果[けっか]をもたらさないからである。"
  14: "多[おお]くの長老[ちょうろう]の前[まえ]で無駄話[むだばなし]をするな。あなたの祈[いの]りで同[おな]じ言葉[ことば]を繰[く]り返[かえ]すな。"
  15: "労[ろう]苦[く]の多[おお]い仕事[しごと]を憎[にく]むな。いと高[たか]い神[かみ]が造[つく]られた農業[のうぎょう]を憎むな。"
  16: "罪人[つみびと]の群[む]れに自分[じぶん]を加[くわ]えるな。"
  17: "あなたの魂[たましい]を大[おお]いに低[ひく]くせよ。"
  18: "怒[いか]りは遅[おく]れずに来[く]ることを覚[おぼ]えておけ。"
  19: "不敬[ふけい]な者[もの]への報[むく]いは火[ひ]と虫[むし]であるからである。"
  20: "どんな利益[りえき]のためにも友[とも]を替[か]えるな。まことの兄弟[きょうだい]をスフィルの金[きん]と引[ひ]き換[か]えるな。"
  21: "賢[かしこ]く良[よ]い妻[つま]を失[うしな]ってはならない。その恵[めぐ]みは金[きん]にまさるからである。"
  22: "真実[しんじつ]に働[はたら]く僕[しもべ]を苦[くる]しめるな。自分[じぶん]の魂[たましい]を注[そそ]いで働く雇[やと]い人[びと]も苦しめるな。"
  23: "悟[さと]りのある僕[しもべ]を、あなたの魂[たましい]を込[こ]めて愛[あい]せよ。その者[もの]から自由[じゆう]を奪[うば]うな。"
  24: "家畜[かちく]がいるなら、それを世話[せわ]せよ。役[やく]に立[た]つなら、あなたのもとにとどめておけ。"
  25: "子[こ]どもがいるなら、それを教[おし]え戒[いまし]めよ。若[わか]い時[とき]からその首[くび]を曲[ま]げさせよ。"
  26: "娘[むすめ]がいるなら、その体[からだ]に気[き]を配[くば]れ。その前[まえ]で明[あか]るい顔[かお]を見[み]せるな。"
  27: "娘[むすめ]を嫁[よめ]にやれ。そうすれば、あなたは大[おお]きな仕事[しごと]を成[な]し遂[と]げた者[もの]となる。悟[さと]りのある男[おとこ]に娘を与[あた]えよ。"
  28: "あなたの魂[たましい]にかなう妻[つま]がいるなら、彼女[かのじょ]を追[お]い出[だ]すな。憎[にく]まれている女[おんな]に自分[じぶん]を委[ゆだ]ねるな。"
  29: "あなたの心[こころ]を尽[つ]くして父[ちち]を敬[うやま]え。母[はは]の産[う]みの苦[くる]しみを忘[わす]れるな。"
  30: "あなたは彼[かれ]らによって生[う]まれたのだから、そのことを覚[おぼ]えておけ。彼らがあなたにしたように、あなたは何[なに]を返[かえ]せるというのか。"
  31: "あなたの魂[たましい]を尽[つ]くして主[しゅ]を敬[うやま]い、主の祭司[さいし]たちを敬い尊[とうと]べ。"
  32: "あなたの力[ちから]を尽[つ]くして、あなたを造[つく]った方[かた]を愛[あい]せよ。その奉仕者[ほうししゃ]たちを捨[す]てるな。"
  33: "主[しゅ]を恐[おそ]れ、祭司[さいし]を敬[うやま]え。命[めい]じられたとおりに、その分[ぶん]を与[あた]えよ。"
  34: "初穂[はつほ]、罪[つみ]のための分、肩[かた]の分、聖[せい]なる犠牲[ぎせい]、聖なるものの初穂である。"
  35: "貧[まず]しい者[もの]に手[て]を差[さ]し伸[の]べよ。そうすれば、あなたの祝福[しゅくふく]が完成[かんせい]する。"
  36: "贈[おく]り物[もの]の恵[めぐ]みは、すべていのちある者[もの]の前[まえ]にある。死[し]んだ者にも、その恵みを閉[と]ざすな。"
  37: "泣[な]く者[もの]たちから離[はな]れるな。悲[かな]しむ者たちとともに悲しめ。"
  38: "病[や]む人[ひと]を訪[おとず]れることを怠[おこた]るな。そのようなことによって、あなたは愛[あい]されるからである。"
  39: "あなたのすべての言葉[ことば]のうちで、自分[じぶん]の終[お]わりを思[おも]い出[だ]せ。そうすれば、永遠[えいえん]に罪[つみ]を犯[おか]すことはない。"

notes:
  1: "μὴ ποίει κακά — «не делай зла»; οὐ μή σε καταλάβῃ — «не постигнет тебя» (καταλαμβάνω). Слав. «не твори зла, и не постигнет тя зло»."
  2: "ἀπόστηθι ἀπὸ ἀδίκου — «отступи от неправды, от неправедного»; ἐκκλινεῖ ἀπὸ σοῦ — «уклонится от тебя» (ἐκκλίνω). Слав. «отступи от неправды, и уклонится от тебе»."
  3: "μὴ σπεῖρε ἐπ᾽ αὔλακας ἀδικίας — «не сей по бороздам неправды» (αὖλαξ — борозда, слав. «бразда»); οὐ μὴ θερίσῃς αὐτὰ ἑπταπλασίως — «не пожнёшь их семикратно» (θερίζω, ἑπταπλάσιος). Смысл: неправда не принесёт семикратного урожая."
  4: "ἡγεμονία — «владычество, начальство»; καθέδρα δόξης — «седалище славы» (слав. «седалище славы»). Запрет домогаться власти и почётного места."
  5: "μὴ δικαιοῦ ἔναντι κυρίου — «не оправдывай себя пред Господом» (δικαιόω); μὴ σοφίζου — «не мудрствуй, не умничай» (σοφίζομαι). Слав. «не оправдай себе пред Богом… не мудрися»."
  6: "μὴ ζήτει γενέσθαι κριτής — «не ищи стать судьёй»; ἐξᾶραι ἀδικίας — «устранить неправду» (ἐξαίρω); εὐλαβηθῇς ἀπὸ προσώπου δυνάστου — «убоишься лица сильного»; σκάνδαλον ἐν εὐθύτητί σου — «соблазн, преткновение в правоте твоей»."
  7: "μὴ ἁμάρτανε εἰς πλῆθος πόλεως — «не греши против множества города»; μὴ καταβάλῃς σεαυτὸν ἐν ὄχλῳ — «не низлагай себя в толпе» (καταβάλλω)."
  8: "μὴ καταδεσμεύσῃς δὶς ἁμαρτίαν — «не свяжи дважды греха», т. е. не прилагай греха ко греху (καταδεσμεύω); ἀθῷος — «невиновный, свободный от наказания» (слав. «неповинен»)."
  9: "μὴ εἴπῃς — «не говори» вводит прямую речь: внутреннюю самоуверенную мысль о дарах. ἐπόψεται — «призрит, посмотрит» (ἐφοράω); προσδέξεται — «примет» (προσδέχομαι). По гр. это речь, поэтому в 「…」; слав. «не рцы: на множество даров моих воззрит…»."
  10: "μὴ ὀλιγοψυχήσῃς ἐν τῇ προσευχῇ σου — «не малодушествуй в молитве твоей» (ὀλιγοψυχέω); ἐλεημοσύνην ποιῆσαι μὴ παρίδῃς — «не пренебреги творить милостыню» (παροράω)."
  11: "μὴ καταγέλα — «не осмеивай» (καταγελάω); ἐν πικρίᾳ ψυχῆς — «в горечи души» (πικρία); ὁ ταπεινῶν καὶ ἀνυψῶν — «смиряющий и возвышающий», о Боге, поэтому 方."
  12: "μὴ ἀροτρία ψεῦδος — «не вспахивай лжи» (ἀροτριάω); ἐπ᾽ ἀδελφῷ σου — «на брата твоего»; τὸ ὅμοιον ποίει — «делай то же»."
  13: "μὴ θέλε ψεύδεσθαι πᾶν ψεῦδος — «не желай лгать всякую ложь»; ἐνδελεχισμός — «постоянство, повторение» (слав. «учащение»); οὐκ εἰς ἀγαθόν — «не на благо»."
  14: "μὴ ἀδολέσχει — «не пустословь» (ἀδολεσχέω); ἐν πλήθει πρεσβυτέρων — «пред множеством старцев»; μὴ δευτερώσῃς λόγον — «не повторяй слова» (δευτερόω). Слав. «не буди велеречив… не повтори слова»."
  15: "ἐπίπονος ἐργασία — «тяжёлый труд»; γεωργία — «земледелие» (слав. «земледелие»); ὑπὸ ὑψίστου ἐκτισμένην — «созданное Вышним» (κτίζω)."
  16: "μὴ προσλογίζου σεαυτόν — «не причисляй себя» (προσλογίζομαι); ἐν πλήθει ἁμαρτωλῶν — «к множеству грешников»; ὀργὴ οὐ χρονιεῖ — «гнев не замедлит» (χρονίζω), т. е. придёт скоро. Слав. 7:16 и 7:18 делят этот стих; здесь обе половины."
  17: "ταπείνωσον σφόδρα τὴν ψυχήν σου — «весьма смири душу твою»; ἐκδίκησις ἀσεβοῦς — «отмщение нечестивому»; πῦρ καὶ σκώληξ — «огонь и червь» (слав. «огнь и червь»). Слав. 7:17 и 7:19 делят стих; здесь обе половины."
  18: "Продолжение ст. 16 (тот же стих по-гречески)."
  19: "Продолжение ст. 17 (тот же стих по-гречески)."
  20: "μὴ ἀλλάξῃς φίλον ἕνεκεν διαφόρου — «не променяй друга ради чего-либо иного» (ἀλλάσσω, διάφορον — различие, выгода); ἀδελφὸν γνήσιον — «брата родного, подлинного»; χρυσίῳ Σουφιρ — «золотом Суфира» (Офир), передано スフィルの金."
  21: "μὴ ἀστόχει γυναικὸς σοφῆς καὶ ἀγαθῆς — «не промахнись мимо жены мудрой и доброй», т. е. не лишись её (ἀστοχέω); χάρις — «благодать, прелесть» (слав. «благодать»); ὑπὲρ τὸ χρυσίον — «более золота»."
  22: "μὴ κακώσῃς οἰκέτην — «не обижай слугу» (κακόω); ἐργαζόμενον ἐν ἀληθείᾳ — «работающего в истине, верно»; μίσθιον — «наёмник» (слав. «наемник»); διδόντα τὴν ψυχὴν αὐτοῦ — «отдающего душу свою», т. е. трудящегося до изнеможения."
  23: "οἰκέτην συνετὸν — «слугу разумного»; ἀγαπάτω σου ἡ ψυχή — «да любит душа твоя»; μὴ στερήσῃς αὐτὸν ἐλευθερίας — «не лиши его свободы» (στερέω). Слав. «раба разумива да любит душа твоя»."
  24: "κτήνη — «скот, домашние животные»; ἐπισκέπτου — «присматривай, заботься» (ἐπισκέπτομαι); ἐμμενέτω σοι — «пусть остаётся у тебя» (ἐμμένω). Слав. «есть ли ти скот, призирай его»."
  25: "τέκνα — дети; παίδευσον — «наставь, воспитай»; κάμψον ἐκ νεότητος τὸν τράχηλον αὐτῶν — «согни от юности шею их», образ воспитания (κάμπτω). Слав. «накажи я и преклони от юности выю их»."
  26: "θυγατέρες — дочери; πρόσεχε τῷ σώματι αὐτῶν — «блюди тело их», т. е. целомудрие; μὴ ἱλαρώσῃς τὸ πρόσωπόν σου — «не делай весёлого лица» (ἱλαρόω). Слав. «внимай телу их и не являй веселаго к ним лица твоего»."
  27: "ἔκδου θυγατέρα — «выдай дочь» (ἐκδίδωμι); τετελεκὼς ἔργον μέγα — «совершивший великое дело» (τελέω); ἀνδρὶ συνετῷ δώρησαι — «мужу разумному подари» (δωρέομαι)."
  28: "γυνή σοί ἐστιν κατὰ ψυχήν — «есть у тебя жена по душе»; μὴ ἐκβάλῃς — «не изгони» (ἐκβάλλω); μισουμένῃ μὴ ἐμπιστεύσῃς σεαυτόν — «ненавидимой не доверь себя»; вторая половина стиха есть только в LXX, слав. её не имеет; место тёмное."
  29: "ἐν ὅλῃ καρδίᾳ σου δόξασον τὸν πατέρα σου — «всем сердцем прославь отца твоего»; μητρὸς ὠδῖνας — «родильные боли матери» (ὠδίν); μὴ ἐπιλάθῃ — «не забудь» (ἐπιλανθάνομαι)."
  30: "δι᾽ αὐτῶν ἐγεννήθης — «через них ты рождён» (γεννάω); τί ἀνταποδώσεις — «что воздашь» (ἀνταποδίδωμι); καθὼς αὐτοὶ σοί — «как они тебе»."
  31: "ἐν ὅλῃ ψυχῇ σου εὐλαβοῦ τὸν κύριον — «всей душою благоговей пред Господом» (εὐλαβέομαι); τοὺς ἱερεῖς αὐτοῦ θαύμαζε — «священников Его чти, дивись им» (θαυμάζω)."
  32: "ἐν ὅλῃ δυνάμει ἀγάπησον τὸν ποιήσαντά σε — «всей силой возлюби Сотворившего тебя»; λειτουργούς — «служители, священнослужители» (слав. «служители»); μὴ ἐγκαταλίπῃς — «не оставляй» (ἐγκαταλείπω)."
  33: "φοβοῦ τὸν κύριον καὶ δόξασον ἱερέα — «бойся Господа и прославь священника»; μερὶς — «часть, доля»; ἀπαρχή — «начаток, первый плод»; περὶ πλημμελείας — «за прегрешение»; δόσις βραχιόνων — «даяние плеч, лопаток» (жертвенная часть); θυσία ἁγιασμοῦ — «жертва освящения»; ἀπαρχὴ ἁγίων — «начаток святых». Слав. 7:33–34 делят стих; здесь обе половины."
  34: "Продолжение ст. 33 (тот же стих по-гречески)."
  35: "πτωχῷ ἔκτεινον τὴν χεῖρα — «бедному простри руку»; ἵνα τελειωθῇ ἡ εὐλογία σου — «чтобы исполнилось, завершилось благословение твоё» (τελειόω). Слав. «да совершится благословение твое»."
  36: "χάρις δόματος — «благодать дара»; ἔναντι παντὸς ζῶντος — «пред всяким живым»; ἐπὶ νεκρῷ μὴ ἀποκωλύσῃς χάριν — «над мёртвым не возбрани благодати, милости» (ἀποκωλύω)."
  37: "μὴ ὑστέρει ἀπὸ κλαιόντων — «не отставай от плачущих» (ὑστερέω); μετὰ πενθούντων πένθησον — «с сетующими сетуй» (πενθέω). Слав. «с сетующими сетуй»."
  38: "μὴ ὄκνει ἐπισκέπτεσθαι ἄρρωστον — «не ленись посещать больного» (ὀκνέω); ἐκ γὰρ τῶν τοιούτων ἀγαπηθήσῃ — «ибо за такое будешь возлюблен» (ἀγαπάω)."
  39: "μιμνῄσκου τὰ ἔσχατά σου — «помни последнее твоё», т. е. конец, смерть (μιμνῄσκομαι); εἰς τὸν αἰῶνα οὐχ ἁμαρτήσεις — «вовеки не согрешишь». Слав. «поминай последняя твоя»."
