verses:
  1: "あなたは知恵[ちえ]を宣[の]べ伝[つた]えよ。そうすれば分別[ふんべつ]があなたに従[したが]う。"
  2: "知恵[ちえ]は高[たか]い峰[みね]の上[うえ]にあり、道[みち]の真[ま]ん中[なか]に立[た]っている。"
  3: "知恵は権力者[けんりょくしゃ]の門[もん]のそばに座[すわ]り、出入口[でいりぐち]で歌[うた]われる。"
  4: "「人々[ひとびと]よ、わたしはあなたがたに呼[よ]びかける。わたしの声[こえ]は人[ひと]の子[こ]らに向[む]かう。"
  5: "無邪気[むじゃき]な者[もの]よ、賢[かしこ]さを悟[さと]れ。無知[むち]な者よ、心[こころ]を得[え]よ。"
  6: "わたしに聞[き]け。わたしは尊[とうと]いことを語[かた]り、唇[くちびる]から正[ただ]しいことを述[の]べる。"
  7: "わたしの口[くち]は真理[しんり]を語り、偽[いつわ]りの唇[くちびる]はわたしの前[まえ]に忌[い]むべきものだからである。"
  8: "わたしの口[くち]の言葉[ことば]はすべて正[ただ]しく、その中[なか]に曲[ま]がったものも、ねじれたものもない。"
  9: "それらはすべて、悟[さと]る者[もの]には明[あき]らかであり、知識[ちしき]を得[え]た者には正しい。"
  10: "銀[ぎん]ではなく、わたしの戒[いまし]めを受[う]けよ。えり抜[ぬ]きの金[きん]よりも知識を、純[じゅん]な金よりも分別[ふんべつ]を選[えら]べ。"
  11: "知恵[ちえ]は高価[こうか]な石[いし]よりも優[すぐ]れており、どんなに貴[とうと]いものも知恵に値[あたい]しない。"
  12: "わたしは知恵である。わたしは助言[じょげん]のうちに住[す]まいを定[さだ]め、知識[ちしき]と悟[さと]りを呼[よ]び求[もと]めた。"
  13: "主[しゅ]を恐[おそ]れることは不正[ふせい]を憎[にく]むことである。わたしは横柄[おうへい]と高慢[こうまん]と悪[わる]い道[みち]、悪い者[もの]の曲[ま]がった道を憎んだ。"
  14: "わたしには計画[けいかく]と確[かく]かな守[まも]りがある。わたしには分別[ふんべつ]があり、わたしには力[ちから]がある。"
  15: "わたしによって王[おう]たちは治[おさ]め、支配者[しはいしゃ]たちは正義[せいぎ]を定[さだ]める。"
  16: "わたしによって大[おお]いなる者[もの]たちは大[おお]きくなり、君主[くんしゅ]たちはわたしによって地[ち]を治[おさ]める。"
  17: "わたしはわたしを愛[あい]する者[もの]を愛し、わたしを求[もと]める者[もの]は恵[めぐ]みを見[み]いだす。"
  18: "富[とみ]と栄光[えいこう]はわたしとともにあり、多[おお]くの財産[ざいさん]と正義[せいぎ]もある。"
  19: "わたしから実[み]を得[え]ることは金[きん]よりも、純[じゅん]な金よりも良[よ]く、わたしの産[う]み出[だ]すものは選[え]り抜[ぬ]きの銀[ぎん]よりも優[すぐ]れている。"
  20: "わたしは正義[せいぎ]の道[みち]を歩[あゆ]み、裁[さば]きの小径[こみち]の真[ま]ん中[なか]を行[ゆ]く。"
  21: "わたしを愛[あい]する者[もの]に財産[ざいさん]を分[わ]け与[あた]え、その宝[たから]を善[よ]いもので満[み]たすためである。もしわたしが、日々[ひび]起[お]こることをあなたがたに告[つ]げるなら、永遠[えいえん]からのことを思[おも]い起[おこ]して数[かぞ]え上[あ]げよう。"
  22: "主[しゅ]はわたしを、その道[みち]の始[はじ]めとして、そのわざのために造[つく]られた。"
  23: "世々[よよ]の前[まえ]、初[はじ]めに、わたしは据[す]えられた。"
  24: "地[ち]を造[つく]る前[まえ]、深淵[しんえん]を造る前、水[みず]の泉[いずみ]が湧[わ]き出[で]る前に、"
  25: "山[やま]々が据[す]えられる前、すべての丘[おか]より先[さき]に、わたしを産[う]んだ。"
  26: "主[しゅ]は国[くに]々と荒[あ]れ野[の]を、また天[てん]の下[した]の住[す]むべき果[は]てを造[つく]られた。"
  27: "主が天[てん]を備[そな]えられたとき、わたしはそこにいた。主が風[かぜ]の上[うえ]にその王座[おうざ]を据[す]えたとき、"
  28: "主が上[うえ]の雲[くも]を強[つよ]くし、天の下[した]の泉[いずみ]を堅[かた]く据[す]えたとき、"
  29: "海[うみ]にその境[さかい]を定[さだ]め、水[みず]がその定めを越[こ]えないようにされたとき、地[ち]の基[もと]を強[つよ]くされたとき、"
  30: "わたしは主[しゅ]のそばにあって事[こと]を整[ととの]えていた。わたしは主が喜[よろこ]ぶ者[もの]であった。日[ひ]ごとに主の前[まえ]で喜び、"
  31: "世界[せかい]を造[つく]り終[お]えて主が喜[よろこ]ばれたとき、わたしも人[ひと]の子[こ]らの中[なか]で喜んだ。"
  32: "さて、子[こ]よ、わたしの言[い]うことを聞[き]け。わたしの道[みち]を守[まも]る者[もの]は幸[さいわ]いである。"
  33: "知恵[ちえ]を聞[き]け。そうすれば知恵ある者[もの]になろう。拒[こば]んではならない。"
  34: "わたしに聞[き]き従[したが]う人[ひと]、日[ひ]ごとにわたしの門[もん]の前[まえ]で見張[みは]り、わたしの入口[いりぐち]の番[ばん]を守[まも]る人[ひと]は幸[さいわ]いである。"
  35: "わたしから出[で]るものはいのちへの出口[でぐち]であり、主[しゅ]によって願[ねが]いが備[そな]えられる。"
  36: "わたしに対して罪[つみ]を犯[おか]す者[もの]は自分[じぶん]の魂[たましい]を害[そこな]い、わたしを憎[にく]む者[もの]は死[し]を愛[あい]する。」"

notes:
  1: "Σὺ τὴν σοφίαν κηρύξεις — ты возвестишь премудрость (κηρύσσω — провозглашать; будущее в значении повеления, слав. «проповеждь»). ἵνα φρόνησίς σοι ὑπακούσῃ — чтобы разум послушал тебя (ὑπακούω — слушаться). Син. и jp-joc дают вопрос «Не премудрость ли взывает?» (по МТ) — держимся LXX."
  2: "ἐπὶ γὰρ τῶν ὑψηλῶν ἄκρων ἐστίν — ибо она на высоких вершинах (ἄκρον — вершина, край). ἀνὰ μέσον δὲ τῶν τρίβων ἕστηκεν — и стоит посреди троп (τρίβος — тропа; ἵστημι — стоять)."
  3: "παρὰ γὰρ πύλαις δυναστῶν παρεδρεύει — ибо при вратах владык она сидит (παρεδρεύω — сидеть при). ἐν δὲ εἰσόδοις ὑμνεῖται — и при входах воспевается (ὑμνέω — воспевать)."
  4: "Ὑμᾶς, ὦ ἄνθρωποι, παρακαλῶ — вас, люди, призываю (παρακαλέω — призывать, просить). προίεμαι ἐμὴν φωνὴν υἱοῖς ἀνθρώπων — простираю голос мой к сынам человеческим (προΐημι — выпускать, посылать). Здесь начинается речь Премудрости — 「…」 до конца главы (8:36)."
  5: "νοήσατε, ἄκακοι, πανουργίαν — уразумейте, незлобивые, разумность (πανουργία — здесь «искусность, разумность»; слав. «коварство» — по другому значению слова). οἱ δὲ ἀπαίδευτοι, ἔνθεσθε καρδίαν — а невоспитанные, вложите сердце (ἐντίθημι — вкладывать)."
  6: "εἰσακούσατέ μου — послушайте меня. σεμνὰ γὰρ ἐρῶ — ибо скажу важное (σεμνός — достойный, важный). ἀνοίσω ἀπὸ χειλέων ὀρθά — изнесу из уст правое (ἀναφέρω — выносить; ὀρθός — правый)."
  7: "ὅτι ἀλήθειαν μελετήσει ὁ φάρυγξ μου — ибо истину будет размышлять гортань моя (μελετάω — упражняться, размышлять; φάρυγξ — гортань). ἐβδελυγμένα δὲ ἐναντίον ἐμοῦ χείλη ψευδῆ — мерзки предо мною уста лживые (βδελύσσομαι — гнушаться)."
  8: "μετὰ δικαιοσύνης πάντα τὰ ῥήματα τοῦ στόματός μου — с правдою все слова уст моих. οὐδὲν ἐν αὐτοῖς σκολιὸν οὐδὲ στραγγαλῶδες — нет в них ничего кривого или запутанного (σκολιός — кривой; στραγγαλώδης — извилистый)."
  9: "πάντα ἐνώπια τοῖς συνιοῦσιν — всё ясно понимающим (ἐνώπιος — явный, наглядный). ὀρθὰ τοῖς εὑρίσκουσι γνῶσιν — и право находящим знание. Оба прилагательных — сказуемые без глагола."
  10: "λάβετε παιδείαν καὶ μὴ ἀργύριον — приимите наказание, а не серебро (παιδεία — наставление, 戒め). γνῶσιν ὑπὲρ χρυσίον δεδοκιμασμένον — знание лучше испытанного золота (δοκιμάζω — испытывать). ἀνθαιρεῖσθε δὲ αἴσθησιν χρυσίου καθαροῦ — избирайте разумение лучше чистого золота (αἴσθησις — восприятие, понимание)."
  11: "κρείσσων γὰρ σοφία λίθων πολυτελῶν — ибо мудрость лучше драгоценных камней (κρείσσων — лучше; λίθος πολυτελής — драгоценный камень). πᾶν δὲ τίμιον οὐκ ἄξιον αὐτῆς ἐστιν — и всё ценное недостойно её (ἄξιος — достойный)."
  12: "ἐγὼ ἡ σοφία κατεσκήνωσα βουλήν — я, премудрость, поселил совет (κατασκηνόω — поселять, обитать; βουλή — совет, решение; аорист). καὶ γνῶσιν καὶ ἔννοιαν ἐγὼ ἐπεκαλεσάμην — и знание и мысль я призвал (ἐπικαλέομαι — призывать)."
  13: "φόβος κυρίου μισεῖ ἀδικίαν — страх Господень ненавидит неправду (μισεῖ — 3 л. ед. ч. от μισέω). ὕβριν τε καὶ ὑπερηφανίαν καὶ ὁδοὺς πονηρῶν — наглость и гордость и пути злых (ὕβρις — дерзость). μεμίσηκα δὲ ἐγὼ διεστραμμένας ὁδοὺς κακῶν — возненавидел я извращённые пути злых (διαστρέφω — извращать)."
  14: "ἐμὴ βουλὴ καὶ ἀσφάλεια — мой совет и безопасность (ἀσφάλεια — надёжность). ἐμὴ φρόνησις, ἐμὴ δὲ ἰσχύς — моё разумение и моя сила. Именные предложения без глагола; повтор сохранён."
  15: "δι᾽ ἐμοῦ βασιλεῖς βασιλεύουσιν — мною цари царствуют. οἱ δυνάσται γράφουσιν δικαιοσύνην — владыки пишут правду (γράφω — записывать, устанавливать)."
  16: "δι᾽ ἐμοῦ μεγιστᾶνες μεγαλύνονται — мною вельможи величаются (μεγιστάν — вельможа; μεγαλύνω — возвеличивать). τύραννοι δι᾽ ἐμοῦ κρατοῦσι γῆς — тираны мною держат землю (κρατέω с род. — владеть)."
  17: "ἐγὼ τοὺς ἐμὲ φιλοῦντας ἀγαπῶ — я любящих меня люблю. οἱ δὲ ἐμὲ ζητοῦντες εὑρήσουσιν — и ищущие меня найдут. Слав. добавляет «благодать» («обрящут благодать»); в LXX только εὑρήσουσιν — слав. слово внесено в текст, отмечено здесь."
  18: "πλοῦτος καὶ δόξα ἐμοὶ ὑπάρχει — богатство и слава мне принадлежат (ὑπάρχω — быть в наличии). καὶ κτῆσις πολλῶν καὶ δικαιοσύνη — и стяжание многих и правда (κτῆσις — приобретение, владение)."
  19: "βέλτιον ἐμὲ καρπίζεσθαι ὑπὲρ χρυσίον — лучше плодоносить мною, нежели золотом (καρπίζομαι — получать плод, пользоваться). τὰ δὲ ἐμὰ γενήματα κρείσσω ἀργυρίου ἐκλεκτοῦ — плоды мои лучше избранного серебра (γένημα — плод, произведение)."
  20: "ἐν ὁδοῖς δικαιοσύνης περιπατῶ — по путям правды хожу (περιπατέω — ходить). ἀνὰ μέσον τρίβων δικαιώματος ἀναστρέφομαι — посреди троп правды обращаюсь (ἀναστρέφομαι — вращаться, жить)."
  21: "ἵνα μερίσω τοῖς ἐμὲ ἀγαπῶσιν ὕπαρξιν — чтобы разделить любящим меня имущество (μερίζω — делить; ὕπαρξις — имущество). τοὺς θησαυροὺς αὐτῶν ἐμπλήσω ἀγαθῶν — сокровища их наполнить благами. 21a ἐὰν ἀναγγείλω ὑμῖν τὰ καθ᾽ ἡμέραν γινόμενα — если возвещу вам происходящее ежедневно (ἀναγγέλλω — возвещать). μνημονεύσω τὰ ἐξ αἰῶνος ἀριθμῆσαι — вспомню, чтобы исчислить то, что от века."
  22: "κύριος ἔκτισέν με ἀρχὴν ὁδῶν αὐτοῦ — Господь создал меня началом путей своих (κτίζω — создавать, творить). εἰς ἔργα αὐτοῦ — для дел его. Слав. добавляет глоссу «(Евр.: стяжа мя)» — редакторское примечание, не переводится."
  23: "πρὸ τοῦ αἰῶνος ἐθεμελίωσέν με — прежде века основал меня (θεμελιόω — полагать основание). ἐν ἀρχῇ — в начале. Слав. 8:23 вбирает слова гр. 8:24 «прежде неже землю сотворити»; по делению gr они остаются в ст. 24."
  24: "πρὸ τοῦ τὴν γῆν ποιῆσαι — прежде неже сотворить землю. πρὸ τοῦ τὰς ἀβύσσους ποιῆσαι — прежде неже сотворить бездны (ἄβυσσος — бездна). πρὸ τοῦ προελθεῖν τὰς πηγὰς τῶν ὑδάτων — прежде неже выйти источникам вод (προέρχομαι — выходить). Повтор πρό сохранён."
  25: "πρὸ τοῦ ὄρη ἑδρασθῆναι — прежде неже горам утвердиться (ἑδράζω — утверждать, ставить). πρὸ δὲ πάντων βουνῶν γεννᾷ με — прежде всех холмов рождает меня (γεννάω — рождать; в греч. наст. время, передано прошедшим по смыслу ряда)."
  26: "κύριος ἐποίησεν χώρας καὶ ἀοικήτους — Господь сотворил страны и необитаемые места (ἄοικος — необитаемый). ἄκρα οἰκούμενα τῆς ὑπ᾽ οὐρανόν — обитаемые края поднебесной (ἄκρον — край)."
  27: "ἡνίκα ἡτοίμαζεν τὸν οὐρανόν, συμπαρήμην αὐτῷ — когда Он готовил небо, я была при Нём (συμπάρειμι — быть вместе). ὅτε ἀφώριζεν τὸν ἑαυτοῦ θρόνον ἐπ᾽ ἀνέμων — когда отделял престол свой на ветрах (ἀφορίζω — отделять, назначать)."
  28: "ἡνίκα ἰσχυρὰ ἐποίει τὰ ἄνω νέφη — когда делал крепкими верхние облака (νέφος — облако). ὡς ἀσφαλεῖς ἐτίθει πηγὰς τῆς ὑπ᾽ οὐρανόν — и полагал как надёжные источники поднебесной (ἀσφαλής — твёрдый, надёжный)."
  29: "καὶ ἰσχυρὰ ἐποίει τὰ θεμέλια τῆς γῆς — и делал крепкими основания земли (θεμέλιον — основание). Слав. здесь пространнее: «егда полагаше морю предел его, да воды не мимо идут уст его» — этого нет в gr-lxx-byz; по паритету внесено в основной текст без скобок. В конце слав. добавляет «бех при нем устрояющи» — это начало гр. 8:30, оставлено в ст. 30."
  30: "ἤμην παρ᾽ αὐτῷ ἁρμόζουσα — я была при Нём устрояющей (ἁρμόζω — прилаживать, соединять; слав. «устрояющи»). ἐγὼ ἤμην ᾗ προσέχαιρεν — я была та, которой Он радовался (προσχαίρω — радоваться чему-л.). καθ᾽ ἡμέραν δὲ εὐφραινόμην ἐν προσώπῳ αὐτοῦ ἐν παντὶ καιρῷ — ежедневно веселилась пред лицом Его во всякое время. jp-joc по МТ: «творец» (ἀμών); держимся LXX ἁρμόζουσα."
  31: "ὅτε ἐυφραίνετο τὴν οἰκουμένην συντελέσας — когда Он веселился, совершив вселенную (συντελέω — завершать). ἐνευφραίνετο ἐν υἱοῖς ἀνθρώπων — и веселился среди сынов человеческих."
  32: "νῦν οὖν, υἱέ, ἄκουέ μου — итак, сын, послушай меня. Слав. добавляет «и блажени, иже пути моя сохранят» — в LXX этого нет; внесено без скобок. Далее речь Премудрости продолжается до конца главы."
  33: "В gr-lxx-byz на месте стиха стоит «.» — дефект модуля. Стих переведён по csl-ru (единственный свидетель): «Услышите премудрость, и умудритеся, и не отмещите». jp-joc даёт иное, по МТ: «敎訓を聽きて智慧を得よ、之に離るる毋れ»."
  34: "μακάριος ἀνήρ, ὃς εἰσακούσεταί μου — блажен муж, который послушает меня. ὃς τὰς ἐμὰς ὁδοὺς φυλάξει — который пути мои сохранит. ἀγρυπνῶν ἐπ᾽ ἐμαῖς θύραις καθ᾽ ἡμέραν — бодрствуя при дверях моих ежедневно (ἀγρυπνέω — бодрствовать). τηρῶν σταθμοὺς ἐμῶν εἰσόδων — соблюдая стоянки входов моих (σταθμός — место стояния)."
  35: "αἱ γὰρ ἔξοδοί μου ἔξοδοι ζωῆς — ибо исходы мои — исходы жизни (ἔξοδος — выход). ἑτοιμάζεται θέλησις παρὰ κυρίου — уготовляется хотение от Господа (θέλησις — воля, желание). Тёмное место; смысл — благоволение Божие готовится любящему премудрость."
  36: "οἱ δὲ εἰς ἐμὲ ἁμαρτάνοντες ἀσεβοῦσιν τὰς ἑαυτῶν ψυχάς — согрешающие против меня нечествуют против своих душ (ἀσεβέω — нечествовать). οἱ μισοῦντές με ἀγαπῶσιν θάνατον — ненавидящие меня любят смерть. Речь Премудрости кончается."
