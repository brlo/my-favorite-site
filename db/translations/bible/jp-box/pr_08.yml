# jp-box, Притчи, глава 8. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc есть для всей главы, кроме 8:31, —
# контроль церковного чтения (в 8:1 и 8:30 он следует МТ, отмечено в notes);
# jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 8: воззвание Премудрости (1–3); речь Премудрости — 「…」 4–36: призыв (4–11),
# её сила и богатство (12–21), она от начала при творении (22–31), призыв слушать (32–36).
# Вложенной речи нет, поэтому 『…』 не употребляются.
# Нумерация по gr: 36 стихов. Дефект: 8:33 в gr-lxx-byz — «.», переведён по csl-ru.
# Слав. добавления без опоры в LXX: 8:17 («благодать»), 8:32 (блаженство), море в 8:29;
# сдвиги: 8:23 вбирает начало гр. 8:24, 8:29 переносит начало гр. 8:30 в свой конец.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).

