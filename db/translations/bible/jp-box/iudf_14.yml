# jp-box, Иудифь, глава 14. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для Иудифи нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 14: план Иудифи (1–5, её речь), Ахиора приводят (6), он падает и уверует,
# обрезание (7–10), голова на стене и выступление (11), ассирийцы у шатра (12–13),
# Багоас входит (14–15), вопль (16–18), смятение в стане (19).
# Речь — 「…」: 1–5 (Иудифь, одна цитата на пять стихов), 7–8 (Ахиор), 13 (ассирийцы
# к начальнику), 18 (Багоас). Вложенной речи и 『…』 нет. Красного и синего нет.
# Нумерация по gr: 19 стихов; деление совпадает с csl.
# 〔…〕 нет: все стихи есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 割礼, 包皮, 千人隊の長, 集会, 戸口 уже в корпусе или в брифе.
# Имена — транслитерация греческого (LXX): ユディト, ホロフェルネス, バゴアス, アヒオル,
# オジヤ, ネブカドネツァル.

