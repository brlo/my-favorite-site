verses:
  1: "ユディトは彼らに言[い]った。「わたしの言[い]うことを聞[き]きなさい、兄弟[きょうだい]たちよ。そして、この頭[あたま]を取[と]って、あなたがたの城壁[じょうへき]の上[うえ]に掛[か]けなさい。"
  2: "朝[あさ]が明[あ]けて日[ひ]が地[ち]の上[うえ]に昇[のぼ]ったなら、あなたがたはそれぞれ自分の武具[ぶぐ]を取[と]り、力[ちから]ある者[もの]は皆[みな]、町[まち]の外[そと]へ出[で]なさい。そして、アッシリアの子[こ]らの前哨[ぜんしょう]に向[む]かって野[の]に下[くだ]るかのように、彼らの先[さき]に立[た]つ者[もの]を定[さだ]めなさい。ただし、下[くだ]ってはならない。"
  3: "彼らは自分の全身[ぜんしん]の武具[ぶぐ]を取[と]って、自分たちの陣営[じんえい]へ行[い]き、アッシリアの軍勢[ぐんぜい]の将軍[しょうぐん]たちを起[お]こす。そして、ホロフェルネスの天幕[てんまく]へ駆[か]け集[あつ]まり、彼を見[み]つけられないであろう。すると、恐[おそ]れが彼らの上[うえ]に落[お]ち、彼らはあなたがたの前[まえ]から逃[に]げる。"
  4: "あなたがたは彼らを追[お]い、またイスラエルのすべての領域[りょういき]に住[す]む者[もの]たちも皆[みな]、彼らの道[みち]で彼らを打[う]ち倒[たお]せ。"
  5: "しかし、これらのことを行[おこな]う前[まえ]に、アンモン人[じん]アヒオルをわたしのところへ呼[よ]びなさい。彼が見[み]て、イスラエルの家[いえ]を侮[あなど]り、この人[ひと]を死[し]に至[いた]らせるかのようにわたしたちのもとへ送[おく]った者[もの]を知[し]るためである。」"
  6: "人々はオジヤの家[いえ]からアヒオルを呼[よ]んだ。彼が来[き]て、民[たみ]の集会[しゅうかい]のうちで、一人[ひとり]の男[おとこ]の手[て]にホロフェルネスの頭[あたま]があるのを見[み]ると、顔[かお]を地[ち]に伏[ふ]せて倒[たお]れ、彼の霊[れい]は力[ちから]を失[うしな]った。"
  7: "彼らが彼を起[お]こすと、彼はユディトの足[あし]もとにくずおれ、その顔[かお]の前[まえ]にひれ伏[ふ]して言[い]った。「ユダのすべての住[す]まいのうちで、また、あなたの名[な]を聞[き]いて恐[おそ]れおののくすべての国民[こくみん]のうちで、あなたは祝福[しゅくふく]されている。"
  8: "そして今[いま]、この日々[ひび]にあなたがしたことをすべて、わたしに告[つ]げなさい。」ユディトは民[たみ]の真[ま]ん中[なか]で、自分が外[そと]へ出[で]た日[ひ]から、こうして彼らに語[かた]っている今[いま]までのすべてのことを、彼に告げた。"
  9: "彼女が語[かた]り終[お]えると、民[たみ]は大[おお]きな声[こえ]を上[あ]げて叫[さけ]び、自分たちの町[まち]に喜[よろこ]びの声[こえ]を響[ひび]かせた。"
  10: "アヒオルは、イスラエルの神[かみ]がなさったすべてのことを見[み]て、神を強[つよ]く信[しん]じ、包皮[ほうひ]を切[き]り取[と]って割礼[かつれい]を受[う]け、この日[ひ]までイスラエルの家[いえ]に加[くわ]えられた。"
  11: "夜[よ]が明[あ]けると、人々はホロフェルネスの頭[あたま]を城壁[じょうへき]に掛[か]けた。イスラエルの男[おとこ]たちは皆[みな]、自分の武器[ぶき]を取[と]り、隊[たい]ごとに山[やま]の登[のぼ]り道[みち]へ出[で]て行[い]った。"
  12: "アッシリアの人々[ひとびと]は彼らを見[み]ると、自分たちの長[かしら]たちへ人[ひと]を送[おく]った。長たちは将軍[しょうぐん]たち、千人隊[せんにんたい]の長[ちょう]たち、そして自分たちのすべての支配者[しはいしゃ]のもとへ来[き]た。"
  13: "彼らはホロフェルネスの天幕[てんまく]のところへ来[き]て、彼のすべてのものの上[うえ]に立[た]つ者[もの]に言[い]った。「わたしたちの主人[しゅじん]を起[お]こしてくれ。しもべたちが大胆[だいたん]にも、全[まった]く滅[ほろ]ぼし尽[つ]くされるために、わたしたちに戦[いくさ]を仕掛[しか]けようと下[くだ]って来[き]たからである。」"
  14: "バゴアスは入[はい]って行[い]き、天幕[てんまく]の垂[た]れ幕[まく]を叩[たた]いた。彼はホロフェルネスがユディトとともに寝[ね]ていると思[おも]っていたからである。"
  15: "しかし、だれも答[こた]えなかったので、彼は幕を押[お]し開[ひら]いて寝室[しんしつ]に入[はい]り、戸口[とぐち]に死[し]んで転[ころ]がっている彼を見[み]つけた。彼の頭[あたま]は取[と]り去[さ]られていた。"
  16: "彼は大[おお]きな声[こえ]で、泣[な]き叫[さけ]び、うめき、強[つよ]い叫[さけ]びとともに叫[さけ]んだ。そして自分の衣[ころも]を引[ひ]き裂[さ]いた。"
  17: "彼はユディトが宿[やど]っている天幕[てんまく]に入[はい]ったが、彼女を見[み]つけられなかった。彼は民[たみ]のところへ飛[と]び出[で]して叫[さけ]んだ。"
  18: "「しもべたちは背[そむ]いた。ヘブライ人[じん]の女[おんな]が一人[ひとり]、ネブカドネツァル王[おう]の家[いえ]を辱[はずかし]めた。見[み]よ、ホロフェルネスは地[ち]に伏[ふ]し、その上[うえ]に頭[あたま]がない。」"
  19: "アッシリアの軍勢[ぐんぜい]の支配者[しはいしゃ]たちがこれらの言葉[ことば]を聞[き]くと、自分たちの衣[ころも]を引[ひ]き裂[さ]き、その魂[たましい]はひどく乱[みだ]れた。そして陣営[じんえい]の真[ま]ん中[なか]に、彼らの叫[さけ]びと非常[ひじょう]に大[おお]きな叫[さけ]び声[ごえ]が起[こ]った。"

notes:
  1: "Ἀκούσατε δή μου — послушайте же меня (ἀκούω, δή усиливает). ἀδελφοί — обращение, 兄弟たち. ἐπάλξεως τοῦ τείχους — зубец, гребень стены (ἔπαλξις); слав. «забрало», Син. «зубцы»; в тексте 城壁の上. κρεμάσατε — повесьте (κρεμάννυμι)."
  2: "διαφαύσῃ ὁ ὄρθρος — рассветёт заря (διαφαύσκω; ὄρθρος — рассвет). ἀναλήμψεσθε — возьмёте (ἀναλαμβάνω). σκεύη τὰ πολεμικά — воинские доспехи, оружие. πᾶς ἀνὴρ ἰσχύων — всякий муж сильный, 力ある者は皆. δώσετε ἀρχηγὸν εἰς αὐτούς — дадите вождя над ними (ἀρχηγός); слав. «воеводе». ὡς καταβαίνοντες ἐπὶ τὸ πεδίον — как бы сходящие на поле. προφυλακή — передовая стража, 前哨 (как в 10:11); слав. «первая стража». οὐ καταβήσεσθε — не сходите: запрет, важный для замысла."
  3: "πανοπλίαι — всеоружие (πανοπλία), 全身の武具. ἐγεροῦσι — разбудят (ἐγείρω, буд.). στρατηγούς — военачальников, 将軍 (по корпусу). συνδραμοῦνται ἐπὶ τὴν σκηνήν — сбегутся к шатру (συντρέχω). οὐχ εὑρήσουσιν — не найдут. ἐπιπεσεῖται ἐπ᾽ αὐτοὺς φόβος — нападёт на них страх (ἐπιπίπτω). φεύξονται ἀπὸ προσώπου ὑμῶν — побегут от лица вашего."
  4: "ἐπακολουθήσαντες — последовав (ἐπακολουθέω). οἱ κατοικοῦντες πᾶν ὅριον Ισραηλ — все живущие во всяком пределе Израиля (ὅριον — граница, область), 領域. καταστρώσατε — постилайте, повергайте (καταστρώννυμι); Син. «поражайте». ἐν ταῖς ὁδοῖς αὐτῶν — на путях их."
  5: "πρὸ δὲ τοῦ ποιῆσαι ταῦτα — но прежде чем сделать это. καλέσατέ μοι — призовите мне. Αμμανίτης — аммонитянин, アンモン人. ἵνα ἰδὼν ἐπιγνοῖ — чтобы, увидев, узнал (ἐπιγινώσκω). ἐκφαυλίσαντα τὸν οἶκον τοῦ Ισραηλ — обесценившего, уничижившего дом Израиля (ἐκφαυλίζω). ὡς εἰς θάνατον ἀποστείλαντα εἰς ἡμᾶς — пославшего его к нам как бы на смерть; оба причастия относятся к Олоферну."
  6: "ἐκ τοῦ οἴκου Οζια — из дома Озии. ἐν τῇ ἐκκλησίᾳ τοῦ λαοῦ — в собрании народа (ἐκκλησία — 集会). ἔπεσεν ἐπὶ πρόσωπον — пал на лицо. ἐξελύθη τὸ πνεῦμα αὐτοῦ — ослаб, разрешился дух его (ἐκλύω, аор. пасс.); Син. «ослабел духом», поэтому 霊は力を失った."
  7: "προσέπεσεν τοῖς ποσίν — припал к ногам (προσπίπτω). προσεκύνησεν τῷ προσώπῳ αὐτῆς — поклонился лицу её (προσκυνέω). ἐν παντὶ σκηνώματι Ιουδα — во всяком селении Иуды (σκήνωμα — жилище, шатёр). ἐν παντὶ ἔθνει — во всяком народе. ταραχθήσονται — смутятся, придут в смятение (ταράσσω); слав. «смятутся»."
  8: "ἀνάγγειλόν μοι — возвести мне (ἀναγγέλλω, импер. аор.). ἀπήγγειλεν — возвестила (ἀπαγγέλλω). ἐν μέσῳ τοῦ λαοῦ — среди народа. ἀφ᾽ ἧς ἡμέρας ἐξῆλθεν — с того дня, как вышла. ἕως οὗ ἐλάλει αὐτοῖς — до того, как говорила им (импф. λαλέω), т. е. до настоящего момента."
  9: "ἐπαύσατο λαλοῦσα — перестала говорить (παύω, прич. ж. р.). ἠλάλαξεν — воскликнул, издал клик (ἀλαλάζω). ἔδωκεν φωνὴν εὐφρόσυνον — издал радостный голос; слав. «дадоша глас веселый»."
  10: "ἐπίστευσεν τῷ θεῷ σφόδρα — уверовал в Бога весьма (πιστεύω + дат.). περιετέμετο τὴν σάρκα τῆς ἀκροβυστίας αὐτοῦ — обрезал плоть крайнюю свою (περιτέμνομαι; ἀκροβυστία — крайняя плоть), 包皮を切り取って割礼を受けた. προσετέθη εἰς τὸν οἶκον Ισραηλ — присоединился к дому Израилеву (προστίθημι, аор. пасс.); ср. Быт 34:15–16 (условие брака в Сихеме) и Исх 12:48 (пришелец и Пасха)."
  11: "ὁ ὄρθρος ἀνέβη — взошла заря. ἐκρέμασαν — повесили (κρεμάννυμι). ἀνέλαβεν πᾶς ἀνὴρ τὰ ὅπλα — взял всякий муж оружие своё (ὅπλον). κατὰ σπείρας — отрядами (σπεῖρα — 隊). ἀναβάσεις τοῦ ὄρους — восходы, подъёмы горы (ἀνάβασις). Слав. добавляет «израилев» при «всяк муж» — нет в LXX; в тексте отражено イスラエルの男たち."
  12: "υἱοὶ Ασσουρ — сыны Ассура, т. е. ассирийцы. διέπεμψαν ἐπὶ τοὺς ἡγουμένους — разослали к начальникам (διαπέμπω). οἱ δὲ ἦλθον ἐπὶ τοὺς στρατηγοὺς καὶ χιλιάρχους — те пришли к военачальникам и тысяцким (χιλίαρχος — 千人隊の長). ἐπὶ πάντα ἄρχοντα αὐτῶν — ко всякому начальнику своему."
  13: "τῷ ὄντι ἐπὶ πάντων τῶν αὐτοῦ — тому, кто над всем, что у него (Багоас). Ἔγειρον — разбуди (ἐγείρω, импер. наст.). ἐτόλμησαν — дерзнули (τολμάω). καταβαίνειν ἐφ᾽ ἡμᾶς εἰς πόλεμον — сходить на нас войною. ἵνα ἐξολεθρευθῶσιν εἰς τέλος — чтобы быть истреблёнными вконец (ἐξολεθρεύω); цель сохранена."
  14: "ἔκρουσε τὴν αὐλαίαν — постучал в завесу, полог (κρούω; αὐλαία — дверная завеса). ὑπενόει — подозревал, думал (ὑπονοέω). καθεύδειν αὐτὸν μετὰ Ιουδιθ — что он спит с Иудифью."
  15: "διαστείλας — раздвинув [завесу] (διαστέλλω). κοιτών — спальня. ἐπὶ τῆς χελωνίδος ἐρριμμένον νεκρόν — у порога брошенного мёртвым; χελωνίς буквально «черепаха», здесь выступ у ложа, порог; слав. «при празе» (порог), Син. «у порога», поэтому 戸口. ἀφῄρητο — была отнята (плюскв. ἀφαιρέω)."
  16: "ἐβόησεν — возопил (βοάω). μετὰ κλαυθμοῦ καὶ στεναγμοῦ καὶ βοῆς ἰσχυρᾶς — с плачем, стенанием и крепким воплем. διέρρηξεν τὰ ἱμάτια — разодрал одежды (διαρρήγνυμι)."
  17: "καταλύουσα — останавливающаяся, жившая (καταλύω). ἐξεπήδησεν εἰς τὸν λαόν — выскочил к народу (ἐκπηδάω). Стих обрывается на «и закричал», речь — в ст. 18."
  18: "Ἠθέτησαν — отверглись, поступили вероломно (ἀθετέω); слав. «отвергошася», Син. «поступили вероломно». ἐποίησεν αἰσχύνην — сделала позор, посрамила (αἰσχύνη). μία γυνὴ τῶν Εβραίων — одна женщина из евреев. εἰς τὸν οἶκον τοῦ βασιλέως — дому царя. χαμαί — на полу, долу. ἡ κεφαλὴ οὐκ ἔστιν ἐπ᾽ αὐτῷ — головы нет на нём."
  19: "οἱ ἄρχοντες τῆς δυνάμεως Ασσουρ — начальники силы Ассура. τοὺς χιτῶνας διέρρηξαν — разодрали хитоны свои (χιτών — нижняя одежда). ἐταράχθη ἡ ψυχή — смутилась душа (ταράσσω). κραυγὴ καὶ βοή — крик и вопль. ἐν μέσῳ τῆς παρεμβολῆς — среди стана."
