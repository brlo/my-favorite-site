# jp-box, Послание к Римлянам, глава 5. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 5: плоды оправдания — мир с Богом и надежда (1–11), Адам и Христос (12–21).
# Красного (<j>) и синего (<mo>) нет: прямой речи Христа и Богородицы в главе нет.
# 〔…〕 в главе нет: все стихи в базе gr-lxx-byz есть; чтение 5:2 τῇ πίστει стоит в базе
# в квадратных скобках — по правилу не обёрнуто.
# Период 5:12–21 не дробится: 5:12 обрывается так же, как у Павла (ὥσπερ без οὕτως),
# 5:13–14 продолжают его как пояснение, 5:18–19 подхватывают параллель.
# jp-ni не использовался.

tr_code: jp-box
book: rim
chapter: 5
draft: true

verses:
  1: "そこで、信仰[しんこう]によって義[ぎ]とされたわたしたちは、わたしたちの主[しゅ]イエス・キリストによって、神[かみ]との平和[へいわ]を持[も]っている。"
  2: "また、この方[かた]によって、信仰[しんこう]により、今[いま]立[た]っているこの{恵[めぐ]み|恩寵[おんちょう]}へと導[みちび]き入[い]れていただいた。そして、神[かみ]の栄光[えいこう]の希望[きぼう]を誇[ほこ]りとしている。"
  3: "それだけではない。わたしたちは苦難[くなん]をも誇[ほこ]りとしている。苦難[くなん]が耐[た]え忍[しの]ぶことを生[う]み、"
  4: "耐[た]え忍[しの]ぶことが鍛[きた]えられた確[たし]かさを生[う]み、その確[たし]かさが希望[きぼう]を生[う]む。"
  5: "そして、希望[きぼう]は人[ひと]を裏切[うらぎ]らない。なぜなら、わたしたちに与[あた]えられた{聖霊[せいれい]|聖神[せいしん]}によって、神[かみ]の愛[あい]がわたしたちの心[こころ]に注[そそ]がれているからである。"
  6: "なぜなら、わたしたちがまだ弱[よわ]かったとき、キリストは、定[さだ]められた時[とき]に、不[ふ]敬[けい]な者[もの]たちのために死[し]なれたからである。"
  7: "実際[じっさい]、義[ぎ]人[じん]のために死[し]ぬ者[もの]は、ほとんどいない。善[ぜん]い人[ひと]のためなら、あえて死[し]のうとする者[もの]も、あるいはいるかもしれない。"
  8: "しかし、神[かみ]は、わたしたちに対するご自身[じしん]の愛[あい]をこのように示[しめ]された。わたしたちがまだ罪人[ざいにん]であったとき、キリストがわたしたちのために死[し]なれたのである。"
  9: "それゆえ、今[いま]、キリストの血[ち]によって義[ぎ]とされたわたしたちが、なおさら、この方[かた]によって怒[いか]りから救[すく]われるのは確[たし]かである。"
  10: "もし、敵[てき]であったとき、その子[こ]の死[し]によって神[かみ]と和解[わかい]したのであれば、まして、和解[わかい]した今[いま]、その方[かた]の命[いのち]によって救[すく]われることは、なおさら確[たし]かである。"
  11: "それだけではない。わたしたちは、今[いま]、和解[わかい]を与[あた]えてくださったわたしたちの主[しゅ]イエス・キリストによって、神[かみ]を誇[ほこ]りとしている。"
  12: "それゆえ、ちょうど、一人[ひとり]の人[ひと]によって罪[つみ]がこの世[よ]に入[はい]り、罪[つみ]によって死[し]が入[はい]ったように、死[し]もまた、すべての人[ひと]に及[およ]んだ。その一人[ひとり]において、すべての人[ひと]が罪[つみ]を犯[おか]したのである——"
  13: "というのは、律法[りっぽう]が与[あた]えられるまで、罪[つみ]は世[よ]にあった。しかし、律法[りっぽう]がないときには、罪[つみ]が問[と]われることはない。"
  14: "しかし、死[し]は、アダムからモーセに至[いた]るまで、アダムの背[そむ]きと同[おな]じ形[かたち]の罪[つみ]を犯[おか]さなかった者[もの]たちの上[うえ]にも、王[おう]として君臨[くんりん]した。アダムは、来[きた]るべき方[かた]の型[かた]である。"
  15: "しかし、賜[たま]物[もの]は、背[そむ]きとは同[おな]じではない。もし一人[ひとり]の背[そむ]きによって多[おお]くの者[もの]が死[し]んだのであれば、まして、神[かみ]の{恵[めぐ]み|恩寵[おんちょう]}と、一人[ひとり]の人[ひと]イエス・キリストの{恵[めぐ]み|恩寵[おんちょう]}による賜[たま]物[もの]とは、多[おお]くの者[もの]に満[み]ちあふれて余[あま]りある。"
  16: "また、賜[たま]物[もの]は、一人[ひとり]の罪[つみ]を犯[おか]した者[もの]の場合[ばあい]とは同[おな]じではない。というのは、裁[さば]きは一[ひと]つの罪[つみ]から断罪[だんざい]に至[いた]り、賜[たま]物[もの]は多[おお]くの背[そむ]きから義[ぎ]とされることに至[いた]るからである。"
  17: "もし、一人[ひとり]の背[そむ]きによって、その一人[ひとり]を通[とお]して死[し]が王[おう]として君臨[くんりん]したのであれば、まして、{恵[めぐ]み|恩寵[おんちょう]}と、義[ぎ]の賜[たま]物[もの]との満[み]ちあふれを受[う]ける者[もの]たちは、一人[ひとり]の人[ひと]イエス・キリストによって、命[いのち]のうちに王[おう]として君臨[くんりん]するであろう。"
  18: "そこで、一人[ひとり]の背[そむ]きによってすべての人[ひと]に断罪[だんざい]が及[およ]んだように、一人[ひとり]の義[ぎ]の行[おこな]いによっても、すべての人[ひと]に、命[いのち]へと至[いた]る義[ぎ]とされることが及[およ]んだのである。"
  19: "というのは、一人[ひとり]の人[ひと]の不[ふ]従[じゅう]によって多[おお]くの者[もの]が罪人[ざいにん]とされたように、一人[ひとり]の方[かた]の従順[じゅうじゅん]によっても、多[おお]くの者[もの]が義[ぎ]とされる者[もの]となるからである。"
  20: "律法[りっぽう]が入[はい]って来[き]たのは、背[そむ]きが多[おお]くなるためであった。しかし、罪[つみ]が多[おお]くなったところでは、{恵[めぐ]み|恩寵[おんちょう]}はなおさら溢[あふ]れかえった。"
  21: "それは、罪[つみ]が死[し]において王[おう]として君臨[くんりん]したように、{恵[めぐ]み|恩寵[おんちょう]}もまた、義[ぎ]によって王[おう]として君臨[くんりん]し、わたしたちの主[しゅ]イエス・キリストによって、永遠[えいえん]の命[いのち]に至[いた]るためである。"

notes:
  1: "δικαιωθέντες — «быв оправданы»; 義とされた. В базе византийское ἔχομεν «имеем»; критическое издание — ἔχωμεν «будем иметь/имели бы», для японского неразличимо, поэтому скобок нет."
  2: "προσαγωγή — «доступ, введение»; передал 導き入れていただいた (у jp-joc 至るを得). τῇ πίστει стоит в критическом издании в квадратных скобках, но в базе gr-lxx-byz есть — не обёрнуто."
  3: "θλῖψις — 苦難 (у jp-joc 患難; 患難 оставлено для Откр). ὑπομονή — 耐え忍ぶこと, глаголом-существительным, чтобы не вводить отсутствующего в тексте «силы»."
  4: "δοκιμή — «испытанность, проверенное качество»; передал 鍛えられた確かさ (у jp-joc 練達), чтобы не повторять 新共同訳 «練られた品性»."
  5: "ἐκκέχυται — «излилась»; 注がれている. Связка γάρ передана явно: なぜなら…からである."
  6: "ἔτι… ἔτι κατὰ καιρόν — двойное «ещё»: まだ弱かったとき / 定められた時に. ἀσεβῶν — 不敬な者."
  7: "Двойное γάρ: первое передано 実に, второе — 善い人のためなら…も. μόλις — ほとんどいない; τάχα — あるいは…かもしれない. Риторика не сглажена."
  8: "συνίστησιν — «показывает, являет»; 示された. Стих держит контраст с 5:7: у людей едва ли, у Бога — за нечестивых."
  9: "πολλῷ οὖν μᾶλλον — なおさら…確かである. ὀργή — 怒り (не «гнев Божий»: в тексте нет θεοῦ)."
  10: "καταλλαγή — 和解; у jp-joc 和睦. «Смертью Сына» и «жизнью Его» — その子の死 / その方の命."
  11: "В базе καυχώμενοι (причастие, анаколуф), не καυχώμεθα: сохранил оборванность — 神を誇りとしている, без подлежащего-сказуемого выравнивания."
  12: "Ключевой стих. ὥσπερ «как» без парного οὕτως (он появится только в 5:18) — период намеренно оборван тире. ἐφ' ᾧ понимаю по церковному чтению «в нём» (Елизаветинская «о нёмже вси согрешиша», jp-joc 「彼の中に在りて皆罪を犯せり」) — その一人において; «все согрешили» не сглажено в «стали грешниками» и не переведено причинным «потому что». Смерть названа прошедшей на всех людей, а не только на потомков Адама по плоти."
  13: "ἐλλογεῖται — «вменяется, ставится в счёт»; 問われる. Стих продолжает период 5:12 как пояснение (γάρ → というのは)."
  14: "ὁμοίωμα τῆς παραβάσεως — 背きと同じ形. τύπος τοῦ μέλλοντος — 来るべき方の型. ἐβασίλευσεν — 王として君臨した; βασιλεύω в главе передаётся одним словом везде (5:14, 17, 21), как у Павла."
  15: "χάρισμα и δωρεά оба переданы 賜物: в японском два слова для «дара» разошлись бы искусственно. οὐχ ὡς… οὕτως — 背きとは同じではない, контраст сохранён."
  16: "κρῖμα… εἰς κατάκριμα / χάρισμα… εἰς δικαίωμα — 裁きは…断罪に至り、賜物は…義とされることに至る. ἐξ ἑνός — 一つの罪から."
  17: "περισσεία τῆς χάριτος καὶ τῆς δωρεᾶς τῆς δικαιοσύνης — 恵みと、義の賜物との満ちあふれ. ἐν ζωῇ — 命にあって."
  18: "Ἄρα οὖν — そこで. δικαίωμα — «праведный поступок»; 義の行い (не «оправдание», чтобы не смешать с δικαίωσις рядом). δικαίωσις ζωῆς — 命へと至る義とされること."
  19: "παρακοή — 不従; ὑπακοή — 従順. οἱ πολλοί — 多くの者, без сглаживания в «все»."
  20: "παρεισῆλθεν — «вошёл сверх, привзошёл»; 入って来た. ὑπερεπερρίσσευσεν — なおさら溢れかえった."
  21: "ἐν τῷ θανάτῳ — 死において (не «через смерть»). εἶναι-подразумеваемое: 至るためである."
