# jp-box, 2-я Паралипоменон, глава 13. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc для книги нет,
# jp-ni (под авторским правом) не использовался.
# Язык — современный 常体 (в речи тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 13: война Авии с Иеровоамом (1–3), речь Авии на горе Соморон (4–12),
# засада и поражение Иеровоама (13–20), итог правления Авии (21–22).
# Речь Авии — 「…」: открывается в 4, закрывается в 12. Красного нет.
# Нумерация — славяно-синодальная: 22 стиха, как в csl и ru. В gr-lxx-byz 23:
# gr 13:23 (смерть Авии и воцарение Асы) у слав. и в ru — 14:1, поэтому стих
# перенесён в начало 14-й главы (см. 2par_14.yml, note 1).
# Паритет: слав. чтения входят в основной текст без 〔…〕, вариант LXX — в notes
# (13:4 «на горе», 13:5 «завет вечен», 13:12 запрет вместо будущего).
# 〔…〕 нет: текст всех стихов есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 王, 祭司, レビ人, 燔祭, 預言者, 契約 уже в корпусе.
# jp-ni не использовался.

