chapter: 13
draft: true

verses:
  1: "ヤロブアムの治世[ちせい]の第十八年[だいじゅうはちねん]に、アビヤはユダの王[おう]となった。"
  2: "彼[かれ]はエルサレムで三年[さんねん]治[おさ]めた。母[はは]の名[な]はマアハといい、ウリエルの娘[むすめ]で、ギバオンから出[で]た者[もの]であった。アビヤとヤロブアムの間[あいだ]には戦[たたか]いがあった。"
  3: "アビヤは四十万[よんじゅうまん]人[にん]の勇士[ゆうし]からなる軍[ぐん]を整[ととの]え、ヤロブアムは八十万[はちじゅうまん]人[にん]の勇士[ゆうし]をもって、これに向[む]かって軍を整えた。"
  4: "アビヤは、エフライムの山地[さんち]にあるソモロン山[やま]に立[た]ち、言[い]った。「ヤロブアムとイスラエル全体[ぜんたい]よ、聞[き]きなさい。"
  5: "あなたがたは知[し]らないのか。イスラエルの神[かみ]である主[しゅ]が、ダビデとその子[こ]らに、永遠[えいえん]の契約[けいやく]によってイスラエルの王国[おうこく]をとこしえに与[あた]えられたことを。"
  6: "しかし、ナバトの子[こ]ヤロブアム、ダビデの子ソロモンの僕[しもべ]が立[た]ち上[あ]がり、自分[じぶん]の主人[しゅじん]に背[そむ]いた。"
  7: "そして、いかがわしい者[もの]たち、不法[ふほう]の者たちが彼のもとに集[あつ]まり、ソロモンの子レハブアムに逆[さか]らって立[た]ち上[あ]がった。レハブアムは若[わか]く、心[こころ]が弱[よわ]かったので、彼らの前[まえ]に立[た]ち向[む]かうことができなかった。"
  8: "そして今[いま]、あなたがたはダビデの子らの手[て]にある主の王国[おうこく]に立[た]ち向[む]かおうとしている。あなたがたは大軍[たいぐん]であり、ヤロブアムがあなたがたのために神々[かみがみ]として造[つく]った金[きん]の子牛[こうし]が、あなたがたとともにいる。"
  9: "あなたがたは、主の祭司[さいし]であるアロンの子らとレビ人[びと]を追[お]い出[だ]し、地[ち]の民[たみ]のうちから自分[じぶん]たちのために祭司を立[た]てたではないか。牛[うし]の群[む]れから取[と]った子牛[こうし]と七頭[ななとう]の雄羊[おひつじ]をもって手[て]を満[み]たす者[もの]はだれでも、神[かみ]でないものの祭司になった。"
  10: "私たちは、自分[じぶん]たちの神である主を捨[す]てなかった。アロンの子らとレビ人が、その組[くみ]ごとに主に仕[つか]えている。"
  11: "彼らは朝[あさ]と夕[ゆう]べに主に燔祭[はんさい]をささげ、香[こう]の調[しら]べ物[もの]をささげ、清[きよ]い机[つくえ]の上[うえ]に供[そな]えのパンを並[なら]べ、金[きん]の燭台[しょくだい]とそのともし火を夕べにともす。私たちは、自分たちの父祖[ふそ]の神である主の務[つと]めを守[まも]っているが、あなたがたは主を捨てた。"
  12: "見[み]よ、主[しゅ]は私たちとともにいて、先頭[せんとう]に立[た]たれる。その祭司たちと、あなたがたに向[む]かって合図[あいず]を鳴[な]らすラッパも、ともにいる。イスラエルの子らよ、あなたがたの父祖の神である主と戦[たたか]ってはならない。あなたがたは成功[せいこう]しないからである。」"
  13: "ヤロブアムは伏兵[ふくへい]を回[まわ]して、彼らの背後[はいご]から来[こ]させた。こうして、ユダの前[まえ]にはヤロブアムが、背後には伏兵がいた。"
  14: "ユダは向[む]きを変[か]えた。見[み]よ、戦[たたか]いは前からも後[うし]ろからも迫[せま]っていた。そこで彼らは主に向[む]かって叫[さけ]び、祭司たちはラッパを吹[ふ]き鳴[な]らした。"
  15: "ユダの人[ひと]々[びと]は叫[さけ]んだ。ユダの人々が叫[さけ]ぶと、主はアビヤとユダの前[まえ]でヤロブアムとイスラエルを打[う]たれた。"
  16: "イスラエルの子らはユダの前[まえ]から逃[に]げ、主[しゅ]なる神[かみ]は彼らをユダの手[て]に渡[わた]された。"
  17: "アビヤとその民[たみ]は彼らを大[おお]きく打[う]ち破[やぶ]り、イスラエルのうちから五十万[ごじゅうまん]人[にん]の勇士[ゆうし]が傷[きず]ついて倒[たお]れた。"
  18: "その日[ひ]、イスラエルの子らは低[ひく]くされ、ユダの子らは強[つよ]くなった。彼らが自分[じぶん]たちの父祖の神である主に望[のぞ]みを置[お]いたからである。"
  19: "アビヤはヤロブアムを追撃[ついげき]し、彼から町々[まちまち]を奪[うば]い取[と]った。すなわち、ベテルとその村々[むらむら]、イエシナとその村々、エフロンとその村々である。"
  20: "ヤロブアムはアビヤのすべての日[ひ]々[び]の間[あいだ]、もはや力[ちから]を得[え]ることがなかった。主は彼を打[う]ち、彼は死[し]んだ。"
  21: "アビヤは強[つよ]くなり、十四人[じゅうよにん]の妻[つま]を娶[めと]って、二十二[にじゅうに]人[にん]の子[こ]と十六人[じゅうろくにん]の娘[むすめ]をもうけた。"
  22: "アビヤの残[のこ]りの言葉[ことば]、その行[おこな]い、その言葉は、預言者[よげんしゃ]アドの書[しょ]に記[しる]されている。"

notes:
  1: "Ἐν τῷ ὀκτωκαιδεκάτῳ ἔτει τῆς βασιλείας Ιεροβοαμ — в восемнадцатый год царства Иеровоама; ἐβασίλευσεν Αβια ἐπὶ Ιουδαν — воцарился Авия над Иудой. Слав. «в лето осмоенадесять царства иеровоамля» и ru «в восемнадцатый год» — те же числа. Форма имени ヤロブアム — по корпусу (3 Цар 15:1)."
  2: "ἔτη τρία ἐβασίλευσεν ἐν Ιερουσαλημ — три года царствовал в Иерусалиме; ὄνομα τῇ μητρὶ αὐτοῦ Μααχα θυγάτηρ Ουριηλ ἀπὸ Γαβαων — имя матери его Мааха, дочь Уриила, из Гаваона; слав. то же. ru: «Михаия, дочь Уриилова, из Гивы» — иное чтение по МТ; в тексте гр. и csl. καὶ πόλεμος ἦν ἀνὰ μέσον Αβια καὶ ἀνὰ μέσον Ιεροβοαμ — и война была между Авией и Иеровоамом; слав. называет Иеровоама первым."
  3: "παρετάξατο τὸν πόλεμον — выстроил войну, т. е. построил войско (παρατάσσω); ἐν δυνάμει πολεμισταῖς δυνάμεως τετρακοσίαις χιλιάσιν ἀνδρῶν δυνατῶν — с силою, воинами силы, четырьмястами тысячами мужей сильных; ἐν ὀκτακοσίαις χιλιάσιν — с восемьюстами тысяч. Числа совпадают у csl и ru."
  4: "ἀνέστη ἀπὸ τοῦ ὄρους Σομορων — встал с горы Соморон (ἀπό — «с»); слав. «ста... на горе сомори» — на горе; в тексте csl. ὅ ἐστιν ἐν τῷ ὄρει Εφραιμ — которая в горе Ефремовой. ru «на вершине горы Цемараимской» — по МТ; LXX даёт Σομορων. Ἀκούσατε — слушайте; здесь открывается речь Авии, закрывается в 13:12."
  5: "οὐχ ὑμῖν γνῶναι — разве вам не знать (риторический вопрос); ἔδωκεν βασιλείαν ἐπὶ τὸν Ισραηλ εἰς τὸν αἰῶνα — дал царство над Израилем в век; διαθήκην ἁλός — завет соли (ἅλς — соль), т. е. нерушимый завет; слав. «в завет вечен» — вечный завет, в тексте csl (永遠の契約), вариант гр. отмечен здесь."
  6: "ἀνέστη — восстал; ὁ παῖς Σαλωμων τοῦ Δαυιδ — раб Соломона, сына Давидова; ἀπέστη ἀπὸ τοῦ κυρίου αὐτοῦ — отступил от господина своего (ἀφίστημι); слав. «отвержеся», ru «возмутился»."
  7: "ἄνδρες λοιμοί — люди негодные (λοιμός — мор, язва; перен. «пустые»); υἱοὶ παράνομοι — сыны беззаконные; ἀντέστη πρὸς Ροβοαμ τὸν τοῦ Σαλωμων — восстал против Ровоама, сына Соломонова; νεώτερος καὶ δειλὸς τῇ καρδίᾳ — моложе и робок сердцем; οὐκ ἀντέστη κατὰ πρόσωπον αὐτοῦ — не устоял пред лицом его."
  8: "καὶ νῦν λέγετε ὑμεῖς — и ныне вы говорите; ἀντιστῆναι κατὰ πρόσωπον βασιλείας κυρίου διὰ χειρὸς υἱῶν Δαυιδ — противостать лицу царства Господня рукою сынов Давидовых; πλῆθος πολύ — множество великое; μόσχοι χρυσοῖ — золотые тельцы; οὓς ἐποίησεν ὑμῖν Ιεροβοαμ εἰς θεούς — которых сделал вам Иеровоам в богов."
  9: "ἦ οὐκ ἐξεβάλετε — разве не изгнали вы (ἐκβάλλω); ἱερεῖς ἐκ τοῦ λαοῦ τῆς γῆς — священников из народа земли; πᾶς ὁ προσπορευόμενος πληρῶσαι τὰς χεῖρας — всякий приходящий наполнить руки, т. е. посвятить себя; ἐν μόσχῳ ἐκ βοῶν καὶ κριοῖς ἑπτά — с тельцом из волов и семью овнами; ἐγίνετο εἰς ἱερέα τῷ μὴ ὄντι θεῷ — становился священником не сущему богу."
  10: "οὐκ ἐγκατελίπομεν — не оставили (ἐγκαταλείπω); λειτουργοῦσιν τῷ κυρίῳ — служат Господу (λειτουργέω); ἐν ταῖς ἐφημερίαις αὐτῶν — в чредах своих (ἐφημερία — очередь служения); слав. относит «по чредам» к началу 13:11."
  11: "θυμιῶσιν — кадят, приносят (θυμιάω); ὁλοκαυτώματα πρωῒ καὶ δείλης — всесожжения утром и вечером; θυμίαμα συνθέσεως — фимиам составления (слав. «фимиам сложения»); προθέσεις ἄρτων ἐπὶ τῆς τραπέζης τῆς καθαρᾶς — предложение хлебов на трапезе чистой; λυχνία ἡ χρυσῆ καὶ οἱ λυχνοὶ τῆς καύσεως — светильник золотой и лампады горения; ἀνάψαι δείλης — возжигать вечером; φυλάσσομεν τὰς φυλακάς — храним стражи, т. е. обязанности; ὑμεῖς ἐγκατελίπετε αὐτόν — вы оставили Его."
  12: "μεθ᾽ ἡμῶν ἐν ἀρχῇ κύριος — с нами в начале Господь, т. е. во главе; αἱ σάλπιγγες τῆς σημασίας τοῦ σημαίνειν ἐφ᾽ ὑμᾶς — трубы знамения, чтобы трубить против вас; πολεμήσετε — «будете воевать» (буд. вр.); слав. и ru передают как запрет («не ратуйте», «не воюйте») — в тексте csl; ὅτι οὐκ εὐοδωθήσεται ὑμῖν — ибо не будет успеха вам. Здесь речь Авии закрывается."
  13: "ἀπέστρεψεν τὸ ἔνεδρον — повернул засаду (ἔνεδρον); ἐλθεῖν αὐτῶν ἐκ τῶν ὄπισθεν — прийти им сзади; ἐγένετο ἔμπροσθεν Ιουδα — оказался впереди Иуды; слав. «(сам)» в скобках — редакционная вставка, не внесена."
  14: "ἀπέστρεψεν Ιουδας — обратился Иуда; ἰδοὺ αὐτοῖς ὁ πόλεμος ἐκ τῶν ἔμπροσθεν καὶ ἐκ τῶν ὄπισθεν — вот им война спереди и сзади; ἐβόησαν πρὸς κύριον — возопили к Господу; ἐσάλπισαν ταῖς σάλπιγξιν — вострубили трубами."
  15: "ἐβόησαν ἄνδρες Ιουδα — возопили мужи Иуды; ἐγένετο ἐν τῷ βοᾶν — и было, когда возопили; κύριος ἐπάταξεν τὸν Ιεροβοαμ καὶ τὸν Ισραηλ — Господь поразил Иеровоама и Израиля; ἐναντίον Αβια καὶ Ιουδα — пред Авией и Иудой. ru: «Бог поразил» — в гр. κύριος."
  16: "ἔφυγον ἀπὸ προσώπου Ιουδα — побежали от лица Иуды; παρέδωκεν αὐτοὺς κύριος εἰς τὰς χεῖρας αὐτῶν — предал их Господь в руки их; слав. добавляет «Бог» (Господь Бог) — внесено (主なる神)."
  17: "ἐπάταξεν ἐν αὐτοῖς πληγὴν μεγάλην — поразил их поражением великим; ἔπεσον τραυματίαι — пали раненые (τραυματίας); πεντακόσιαι χιλιάδες ἄνδρες δυνατοί — пятьсот тысяч мужей сильных. Числа те же у csl и ru."
  18: "ἐταπεινώθησαν — были унижены (ταπεινόω); κατίσχυσαν — укрепились (κατισχύω); ὅτι ἤλπισαν ἐπὶ κύριον θεὸν τῶν πατέρων αὐτῶν — ибо уповали на Господа Бога отцов своих."
  19: "κατεδίωξεν ὀπίσω Ιεροβοαμ — погнался вслед Иеровоама; προκατελάβετο παρ᾽ αὐτοῦ πόλεις — захватил у него города (προκαταλαμβάνω); Βαιθηλ — ベテル; Ισανα — イエシナ (слав. «иесина», Синод. «Иешана»); Εφρων — エフロン; κώμας αὐτῆς — сёла её."
  20: "οὐκ ἔσχεν ἰσχὺν ἔτι — не имел силы более; πάσας τὰς ἡμέρας Αβια — все дни Авии; ἐπάταξεν αὐτὸν κύριος — поразил его Господь; ἐτελεύτησεν — скончался."
  21: "κατίσχυσεν — укрепился; ἔλαβεν ἑαυτῷ γυναῖκας δέκα τέσσαρας — взял себе жён четырнадцать; υἱοὺς εἴκοσι δύο καὶ θυγατέρας δέκα ἕξ — сыновей двадцать два и дочерей шестнадцать."
  22: "οἱ λοιποὶ λόγοι Αβια — прочие слова Авии; αἱ πράξεις αὐτοῦ — деяния его; γεγραμμένοι ἐπὶ βιβλίῳ τοῦ προφήτου Αδδω — записанные в книге пророка Аддо (Αδδω; евр. Иддо; слав. «адды»); アド — передача греч. формы."
