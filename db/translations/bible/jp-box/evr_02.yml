# jp-box, Послание к Евреям, глава 2. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 2: увещание не пренебрегать слышанным (1–4); будущий мир подчинён не ангелам (5);
# Пс 8:4–6 (6–8), уничижение и смерть Иисуса (9), совершение через страдания (10),
# единство Освящающего и освящаемых (11–13), вочеловечение ради освобождения от
# рабства смерти (14–15), помощь семени Авраама (16), милосердный и верный
# Первосвященник (17–18).
# Красного нет: 2:12–13 — слова Христа, но это цитата Писания, поэтому 「…」 без <j>
# (так в корпусе: цитаты Писания в посланиях не красные).
# 〔…〕: 2:7 — церковное καὶ κατέστησας αὐτὸν ἐπὶ τὰ ἔργα τῶν χειρῶν σου
# (в базе нет, проверено запросом к gr-lxx-byz; есть у Елизаветинской, Синодального, jp-joc).
# Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

tr_code: jp-box
book: evr
chapter: 2
draft: true

verses:
  1: "それゆえ、わたしたちは、聞[き]いたことによっていっそう注意[ちゅうい]を払[はら]わなければならない。いつしか流[なが]れ去[さ]ってしまわないように。"
  2: "というのは、天使[てんし]たちによって語[かた]られた言葉[ことば]が確[たし]かなものとなり、すべての違反[いはん]と不従順[ふじゅう]とが、それにふさわしい当然[とうぜん]の報[むく]いを受[う]けたのであれば、"
  3: "わたしたちは、これほど大[おお]きな救[すく]いを軽[かろ]んじたのだから、どうして逃[のが]れることができようか。この救[すく]いは、まず主[しゅ]によって語[かた]られ、それを聞[き]いた人[ひと]たちによって、わたしたちに確[たし]かなものとされたのである。"
  4: "神[かみ]もまた、しるしと奇[き]跡[せき]とさまざまな力[ちから]ある業[わざ]と、{聖霊[せいれい]|聖神[せいしん]}の配[はい]分[ぶん]とによって、ご自身[じしん]の御心[みこころ]に従[したが]って、これに証[あかし]をされた。"
  5: "というのは、神[かみ]は、わたしたちが語[かた]っている来[きた]るべき世[よ]を、天使[てんし]たちに服[ふく]させられたのではないからである。"
  6: "しかし、どこかで、ある人[ひと]がこう証[あかし]している。「人[ひと]とは何[なに]ものか、あなたが彼[かれ]を心[こころ]に留[と]められるとは。人[ひと]の子[こ]とは何[なに]ものか、あなたが彼[かれ]を顧[かえり]みられるとは。"
  7: "あなたは、彼[かれ]をしばらくの間[あいだ]、天使[てんし]たちより少[すこ]し低[ひく]くされ、栄光[えいこう]と誉[ほま]れとを冠[かんむり]として彼[かれ]に与[あた]え、〔彼[かれ]をあなたの手[て]の業[わざ]の上[うえ]に立[た]てられた。〕"
  8: "すべてを彼[かれ]の足[あし]の下[した]に服[ふく]させられた」のである。というのは、すべてを彼[かれ]に服[ふく]させられたのだから、神[かみ]は何[なに]一つとして、彼[かれ]に服[ふく]さないものをお残[のこ]しにならなかった。しかし、今[いま]わたしたちは、まだすべてが彼[かれ]に服[ふく]させられているのを見[み]ていない。"
  9: "しかし、わたしたちは、しばらくの間、天使[てんし]たちより少[すこ]し低[ひく]くされていたイエスが、死[し]の苦[くる]しみのゆえに、栄光[えいこう]と誉[ほま]れとを冠[かんむり]として受[う]けられたのを見[み]ている。それは、神[かみ]の{恵[めぐ]み|恩寵[おんちょう]}によって、すべての人[ひと]のために死[し]を味[あじ]わうためである。"
  10: "というのは、すべてのものがその方[かた]のためにあり、その方[かた]によってある神[かみ]が、多[おお]くの子[こ]たちを栄光[えいこう]へと導[みちび]き、彼[かれ]らの救[すく]いの導[みちび]き手[て]を苦[くる]しみによって完成[かんせい]されるのは、ふさわしいことであった。"
  11: "というのは、聖[せい]とする方[かた]も、聖[せい]とされる者[もの]たちも、すべて一[ひと]つから出[で]ているからである。それゆえ、この方[かた]は、彼[かれ]らを兄弟[きょうだい]と呼[よ]ぶことを恥[は]じられない。"
  12: "こう言[い]われた。「わたしは、あなたの御名[みな]を、わたしの兄弟[きょうだい]たちに告[つ]げ知[し]らせ、会衆[かいしゅう]の中[なか]で、あなたをほめたたえよう」と。"
  13: "また、「わたしはこの方[かた]に信頼[しんらい]しよう」と言[い]われ、また、「見[み]よ、わたしと、神[かみ]がわたしに与[あた]えられた子[こ]たちが、ここにいる」と言[い]われた。"
  14: "ところで、子[こ]たちが血[ち]と肉[にく]とを共[とも]にしているのだから、この方[かた]もまた、同[おな]じように血[ち]と肉[にく]とを共[とも]にされた。それは、死[し]によって、死[し]の力[ちから]を握[にぎ]っている者[もの]、すなわち悪魔[あくま]を無力[むりょく]にし、"
  15: "また、死[し]の恐[おそ]れのゆえに、一生[いっしょう]の間[あいだ]、奴隷[どれい]の身[み]にあった者[もの]たちを解放[かいほう]するためである。"
  16: "確[たし]かに、御子[みこ]が助[たす]けられるのは、天使[てんし]たちではなく、アブラハムの子孫[しそん]なのである。"
  17: "それゆえ、この方[かた]は、すべての点[てん]で兄弟[きょうだい]たちと同[おな]じようにならなければならなかった。神[かみ]への務[つと]めにおいて、あわれみ深[ふか]く忠実[ちゅうじつ]な大祭司[だいさいし]となり、民[たみ]の罪[つみ]を贖[あがな]うためである。"
  18: "というのは、この方[かた]ご自身[じしん]が試[こころ]みを受[う]けて苦[くる]しみを味[あじ]わわれたからこそ、試[こころ]みを受[う]ける者[もの]たちを助[たす]けることができるのである。"

notes:
  1: "Διὰ τοῦτο — それゆえ. δεῖ περισσοτέρως προσέχειν — いっそう注意を払わなければならない. τοῖς ἀκουσθεῖσιν — 聞いたこと (dat. объекта внимания). παραρυῶμεν — 流れ去る (букв. «проскользнуть мимо», ср. jp-joc 離れ落ちん)."
  2: "ὁ δι' ἀγγέλων λαληθεὶς λόγος — 天使たちによって語られた言葉 (о Законе; ср. Деян 7:53; Гал 3:19). βέβαιος — 確かな. παράβασις καὶ παρακοή — 違反と不従順. ἔνδικος μισθαποδοσία — 当然の報い (ἔνδικος — «праведный, заслуженный»)."
  3: "τηλικαύτη σωτηρία — これほど大きな救い. ἀμελήσαντες — 軽んじた (пренебрегши). ἀρχὴν λαβοῦσα λαλεῖσθαι — まず語られ (букв. «получив начало быть возвещаемой»). εἰς ἡμᾶς ἐβεβαιώθη — わたしたちに確かなものとされた."
  4: "συνεπιμαρτυροῦντος τοῦ θεοῦ — 神もまた…証しをされた (со-свидетельство). σημεῖα, τέρατα, δυνάμεις — しるし、奇跡、力ある業. πνεύματος ἁγίου μερισμοῖς — 聖霊の配分 (раздаяния даров; ср. 1 Кор 12:11). κατὰ τὴν αὐτοῦ θέλησιν — 御心に従って."
  5: "οἰκουμένη ἡ μέλλουσα — 来るべき世. οὐ γὰρ ἀγγέλοις ὑπέταξεν — 天使たちに服させられたのではない."
  6: "Цитата Пс 8:4–6 (в LXX 8:5–7). διεμαρτύρατο δέ πού τις — どこかで、ある人がこう証ししている (πού — «где-то», без указания места). μιμνῄσκῃ — 心に留められる; ἐπισκέπτῃ — 顧みられる."
  7: "ἠλάττωσας βραχύ τι παρ' ἀγγέλους — しばらくの間、天使たちより少し低く (βραχύ τι допускает и «на малое время», и «немного ниже»; оба смысла сохранены). В базе нет καὶ κατέστησας αὐτὸν ἐπὶ τὰ ἔργα τῶν χειρῶν σου; церковный текст (Елизаветинская, Синодальный, jp-joc) имеет — 〔彼をあなたの手の業の上に立てられた〕. ἐστεφάνωσας — 冠として与えた."
  8: "πάντα ὑπέταξας ὑποκάτω τῶν ποδῶν αὐτοῦ — すべてを彼の足の下に服させられた (закрытие цитаты). ἀφῆκεν… ἀνυπότακτον — 服さないものをお残しにならなかった. νῦν δὲ οὔπω ὁρῶμεν — しかし今、まだ…見ていない."
  9: "βλέπομεν Ἰησοῦν… ἐστεφανωμένον — イエスが…冠として受けられたのを見ている. διὰ τὸ πάθημα τοῦ θανάτου — 死の苦しみのゆえに. χάριτι θεοῦ — 神の恵みによって. ὑπὲρ παντὸς γεύσηται θανάτου — すべての人のために死を味わう (ὑπέρ — «за»)."
  10: "ἔπρεπεν — ふさわしいことであった. δι' ὃν τὰ πάντα καὶ δι' οὗ τὰ πάντα — すべてのものがその方のためにあり、その方によってある (о Боге). ἀρχηγός — 導き手 (ср. Деян 3:15 命の導き手). τελειῶσαι διὰ παθημάτων — 苦しみによって完成される."
  11: "ὁ ἁγιάζων — 聖とする方 (Христос); οἱ ἁγιαζόμενοι — 聖とされる者たち. ἐξ ἑνὸς πάντες — すべて一つから出ている (ἐξ ἑνός — «от одного»; возможно, от Адама или одного рода; двусмысленность не разрешена). οὐκ ἐπαισχύνεται — 恥じられない."
  12: "Цитата Пс 22:23 (21:23 LXX). ἀπαγγελῶ — 告げ知らせる. ἐκκλησία здесь — 会衆 (собрание, не 教会: речь о ветхозаветном собрании). ὑμνήσω — ほめたたえよう."
  13: "Две цитаты: Ис 8:17 (Ἐγὼ ἔσομαι πεποιθώς…) и Ис 8:18 (Ἰδοὺ ἐγὼ καὶ τὰ παιδία…). πεποιθώς — 信頼しよう (perfect с будущим значением). τὰ παιδία ἅ μοι ἔδωκεν ὁ θεός — 神がわたしに与えられた子たち."
  14: "κεκοινώνηκεν αἵματος καὶ σαρκός — 血と肉とを共にしている (perfect). παραπλησίως μετέσχεν τῶν αὐτῶν — 同じように血と肉とを共にされた. καταργήσῃ — 無力にする (упразднил). τὸ κράτος τοῦ θανάτου — 死の力. διάβολος — 悪魔."
  15: "ἀπαλλάξῃ — 解放する. φόβῳ θανάτου — 死の恐れのゆえに. διὰ παντὸς τοῦ ζῆν — 一生の間. ἔνοχοι δουλείας — 奴隷の身にあった (букв. «подлежащие рабству»)."
  16: "ἐπιλαμβάνεται — «берёт, принимает» (Синодальный «восприемлет»); по-японски 助ける, потому что буквальное «取る» не передаёт смысла; ср. 2:18 βοηθῆσαι. οὐ γὰρ δήπου — 確かに…のではない. σπέρμα Ἀβραάμ — アブラハムの子孫."
  17: "ὤφειλεν — ならなければならなかった. κατὰ πάντα ὁμοιωθῆναι — すべての点で同じようになる. ἐλεήμων καὶ πιστὸς ἀρχιερεύς — あわれみ深く忠実な大祭司. τὰ πρὸς τὸν θεόν — 神への務めにおいて. ἱλάσκεσθαι τὰς ἁμαρτίας — 罪を贖う (ἱλασμός — умилостивление)."
  18: "πέπονθεν πειρασθείς — 試みを受けて苦しみを味わわれた. δύναται… βοηθῆσαι — 助けることができる. τοῖς πειραζομένοις — 試みを受ける者たち."
