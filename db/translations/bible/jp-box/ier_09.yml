# jp-box, Иеремия, глава 9. Черновик для приёмки.
#
# Нумерация — по славянской и Синодальной Библии (масоретский порядок глав):
# так привычнее читателю. В Септуагинте (gr-lxx-byz) эта глава — 9 (+ 8:23).
# База: Септуагинта; контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# --- прежние заметки (написаны при нумерации по гр.; номера в них — греческие) ---
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc по Иеремии — только фрагменты (гл. 11, 12, 31); в гл. 9 его нет.
# jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 9: 1–2 пророк — «кто даст мне пристанище в пустыне», измена и ложь; 3–5 слово
# Господа — не доверять брату, «лихва на лихву»; 6–10 Господь — испытание, «стрела
# язык их», плач по земле, Иерусалим в запустение; 11 вопрос пророка; 12–15 Господь —
# причина погибели, рассеяние; 16–21 плакальщицы, смерть через окна, трупы как трава;
# 22–25 «да не хвалится мудрый», «хвались тем, что знаешь Господа», обрезанные и
# необрезанные.
# ВАЖНО о нумерации: по gr в главе 25 стихов; слав./ru в гл. 9 имеют 26 стихов.
# Слав. 9:1 = gr 8:23 («кто даст голове моей воду»), поэтому весь слав. ряд сдвинут на
# один стих: gr 9:1 = слав. 9:2, gr 9:2 = слав. 9:3 … gr 9:25 = слав. 9:26. В выгрузке
# `csl9:N` поэтому соответствует gr 9:(N−1). В notes к каждому стиху указан слав. номер.
# Голоса: 9:1–2 — без кавычек (пророк от первого лица); 9:3–5 — 「…» (слово Господа);
# 9:6–10 — 「…» (после вводной формулы); 9:11 — без кавычек (вопрос пророка);
# 9:12–15 — 「…» (после «主はわたしに言われた»); 9:16–21 — 「…» (со вложенной 『…』
# в 9:18 — вопль народа); 9:22–25 — 「…» (после вводной формулы).
# 〔…〕 нет. Точных точек в модуле в этой главе нет. Сносок ⟨…⟩ нет: 竜, 割礼,
# 無割礼, 泣き女 уже в корпусе или пояснены в notes.
# Имена — транслитерация греческого (LXX): シオン, エルサレム, ユダ, エジプト, ユダヤ,
# エドム, アンモン, モアブ; エンノム/トフェト в этой главе не встречаются.
# 
