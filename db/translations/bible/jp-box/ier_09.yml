verses:
  1: "だれが、わたしの頭[あたま]に水[みず]を、わたしの目[め]に涙[なみだ]の泉[いずみ]を与[あた]えるだろうか。そうすれば、わたしはわが民[たみ]の娘[むすめ]の殺[ころ]された者[もの]たちのために、昼[ひる]も夜[よる]も泣[な]くことができるのに。"
  2: "だれが、わたしに荒野[こうや]の最後[さいご]の宿[やど]を与[あた]えるだろうか。そうすれば、わたしは自分の民[たみ]を捨[す]てて、彼らから離[はな]れることができるのに。彼らはみな姦淫[かんいん]し、背[そむ]く者[もの]の集[つど]いとなっているからである。"
  3: "彼らは自分[じぶん]の舌[した]を弓[ゆみ]のように構[かま]えた。偽[いつわ]りと不実[ふじつ]がこの地[ち]で力[ちから]を増[ま]し、彼らは悪[あく]から悪[あく]へと進[すす]んで、わたしを知[し]らなかった。"
  4: "「おのおの自分[じぶん]の隣[となり]から身[み]を守[まも]れ。兄弟[きょうだい]たちを信[しん]じてはならない。すべての兄弟はかかとでつまずかせ、すべての友[とも]は欺[あざむ]きながら歩[あゆ]むからである。"
  5: "おのおの自分[じぶん]の友[とも]を侮[あなど]り、真実[しんじつ]を語[かた]ろうとしない。彼らは舌[した]に偽[いつわ]りを語ることを学[まな]び、不正[ふせい]を行[おこな]って、立[た]ち返[かえ]ることをやめなかった。"
  6: "利[り]に利を重[かさ]ね、欺[あざむ]きに欺きを重ねる。彼らはわたしを知[し]ろうとしなかった。」"
  7: "まことに、万軍[ばんぐん]の主[しゅ]はこう言[い]われる。「見[み]よ、わたしは彼らを溶[と]かして試[ため]す。わが民[たみ]の娘[むすめ]の悪[あく]のゆえに、ほかに何[なに]をしようか。"
  8: "彼らの舌[した]は人[ひと]を傷[きず]つける矢[や]である。彼らの口[くち]の言葉[ことば]は欺[あざむ]きである。彼は隣[となり]に平和[へいわ]を語[かた]りながら、心[こころ]の内[うち]に敵意[てきい]を抱[かか]えている。"
  9: "これらのことのゆえに、わたしは彼らを罰[ばっ]しないだろうか、と主[しゅ]は言[い]われる。このような民[たみ]に、わたしの魂[たましい]は復讐[ふくしゅう]しないだろうか。"
  10: "山[やま]の上[うえ]で嘆[なげ]きを、荒野[こうや]の道[みち]で悲[かな]しみの声[こえ]をあげよ。だれも通[とお]らないほどに、彼らは消[き]え失[う]せたからである。住[す]まいの声[こえ]も聞[き]こえず、天[てん]の鳥[とり]から獣[けもの]まで、逃[に]げ去[さ]って、いなくなった。"
  11: "わたしはエルサレムを移住[いじゅう]の地[ち]とし、竜[りゅう]の住[す]みかとする。ユダの町々[まちまち]を、だれも住[す]まない荒[あ]れ地[ち]とする。」"
  12: "だれが知恵[ちえ]ある人[ひと]で、これを悟[さと]るだろうか。主[しゅ]の口[くち]の言葉[ことば]が彼に告[つ]げる。なぜ、この地[ち]は滅[ほろ]び、だれも通[とお]らない荒野[こうや]のように焼[や]かれたのか。"
  13: "主[しゅ]はわたしに言[い]われた。「彼らが、わたしが彼らの前[まえ]に与[あた]えたわたしの律法[りっぽう]を捨[す]て、わたしの声[こえ]を聞[き]かなかったからである。"
  14: "また、自分[じぶん]の悪[わる]い心[こころ]の好[この]むままに、父[ちち]たちが教[おし]えた偶像[ぐうぞう]に従[したが]って歩[あゆ]んだからである。"
  15: "それゆえ、イスラエルの神[かみ]である主[しゅ]はこう言[い]われる。見[み]よ、わたしはこの民[たみ]に苦[くる]しみを食[た]べさせ、苦[にが]い水[みず]を飲[の]ませる。"
  16: "わたしは彼らを、彼らもその父[ちち]たちも知[し]らなかった諸国民[しょこくみん]の間[あいだ]に散[ち]らし、彼らの後に剣[つるぎ]を送[おく]って、彼らを滅[ほろ]ぼし尽[つく]す。」"
  17: "万軍[ばんぐん]の主[しゅ]はこう言[い]われる。「泣[な]き女[おんな]たちを呼[よ]び、彼らを来[こ]させよ。知恵[ちえ]ある女たちに人[ひと]を遣[つか]わし、彼らを来[こ]させよ。"
  18: "そして、彼らにあなたがたの上[うえ]で嘆[なげ]きを取[と]らせ、あなたがたの目[め]から涙[なみだ]を流[なが]させ、あなたがたのまぶたから水[みず]を滴[したた]らせよ。"
  19: "シオンで嘆[なげ]きの声[こえ]が聞[き]こえた。『われわれはなんと惨[みじ]めなのか。ひどく恥[はじ]を見[み]た。われわれはこの地[ち]を捨[す]て、自分[じぶん]の天幕[てんまく]を投[な]げ捨[す]てたからである。』"
  20: "女[おんな]たちよ、主[しゅ]の言葉[ことば]を聞[き]け。あなたがたの耳[みみ]で、その口[くち]の言葉[ことば]を受[う]け止[と]めよ。あなたがたの娘[むすめ]たちに嘆[なげ]きを、おのおの隣[となり]の女[おんな]に悲[かな]しみの歌[うた]を教[おし]えよ。"
  21: "死[し]があなたがたの窓[まど]から上[のぼ]り、あなたがたの地[ち]に入[はい]って、外[そと]の幼[おさな]い子[こ]たちと、広場[ひろば]の若者[わかもの]たちを滅[ほろ]ぼすからである。"
  22: "人々の死体[したい]は、あなたがたの地[ち]の野[の]の面[おもて]の見[み]せ物[もの]となり、刈[か]る者[もの]の後[あと]の草[くさ]のようになる。集[あつ]める者[もの]はいない。」"
  23: "主[しゅ]はこう言[い]われる。「知者[ちしゃ]は自分[じぶん]の知恵[ちえ]を誇[ほこ]ってはならない。強[つよ]い者[もの]は自分[じぶん]の強[つよ]さを誇ってはならない。富[とみ]ある者[もの]は自分[じぶん]の富[とみ]を誇ってはならない。"
  24: "誇[ほこ]る者[もの]は、主[しゅ]を知[し]り、悟[さと]ることを誇れ。主[しゅ]が地[ち]の上[うえ]でいつくしみと裁[さば]きと義[ぎ]とを行[おこな]う者[もの]であることを。これらのことにこそ、わたしの望[のぞ]みがある、と主[しゅ]は言[い]われる。"
  25: "見[み]よ、日[ひ]が来[く]る、と主[しゅ]は言[い]われる。わたしは肉[にく]に割礼[かつれい]を受[う]けた者[もの]のすべてを罰[ばっ]する。"
  26: "すなわち、エジプト、ユダヤ、エドム、アンモンの子[こ]ら、モアブの子ら、荒野[こうや]に住[す]む、顔[かお]の毛[け]を刈[か]り込[こ]めたすべての者[もの]である。すべての民[たみ]は肉[にく]に無割礼[むかつれい]であり、イスラエルの全家[ぜんか]は心[こころ]に無割礼であるからである。」"

notes:
  1: "τίς δώσει κεφαλῇ μου ὕδωρ καὶ ὀφθαλμοῖς μου πηγὴν δακρύων — «кто даст голове моей воду и глазам моим источник слёз» (πηγή — источник, 泉; δάκρυον — слеза, 涙); κλαύσομαι — «буду плакать» (κλαίω); τοὺς τετραυματισμένους — «поражённых, израненных» (τραυματίζω — ранить). В слав. этот стих — 9:1 (нумерация сдвинута: гр 8:23 = слав. 9:1), поэтому слав. 8:23 пуст; здесь он оставлен при 8:23 по гр. (см. шапку гл. 9)."
  2: "Слав. номер: 9:2. τίς δῴη μοι — «кто даст мне» (оптатив 3-го л.); ἐν τῇ ἐρήμῳ σταθμὸν ἔσχατον — «в пустыне стоянку последнюю» (ἔρημος — пустыня, 荒野; σταθμός — стоянка, пристанище, 宿; ἔσχατος — последний); слав. «виталище последнее». καταλείψω — «оставлю» (καταλείπω); ἀπελεύσομαι — «отойду» (ἀπέρχομαι). ὅτι πάντες μοιχῶνται — «ибо все прелюбодействуют» (μοιχάομαι); σύνοδος ἀθετούντων — «сборище отступников» (σύνοδος — собрание; ἀθετέω — отвергать, 背く)."
  3: "Слав. номер: 9:3. ἐνέτειναν τὴν γλῶσσαν ὡς τόξον — «напрягли язык свой как лук» (ἐντείνω — натягивать; τόξον — лук); ψεῦδος καὶ οὐ πίστις ἐνίσχυσεν — «ложь и неверность усилились» (πίστις — верность, 不実; ἐνισχύω); ἐκ κακῶν εἰς κακὰ ἐξήλθοσαν — «от зла к злу вышли», т. е. переходят от зла ко злу; ἐμὲ οὐκ ἔγνωσαν — «Меня не познали»."
  4: "Слав. номер: 9:4. ἕκαστος ἀπὸ τοῦ πλησίον αὐτοῦ φυλάξασθε — «каждый от ближнего своего берегитесь» (φυλάσσω — охранять, 身を守る); ἐπ᾽ ἀδελφοῖς μὴ πεποίθατε — «на братьев не полагайтесь» (πείθω, перфект). πτέρνῃ πτερνιεῖ — «пятой запнёт» (πτέρνα — пятка; πτερνίζω — подставлять ногу, つまずかせる); слав. «запинанием запнет». πᾶς φίλος δολίως πορεύσεται — «всякий друг лукаво будет ходить» (δόλιος — коварный)."
  5: "Слав. номер: 9:5. καταπαίξεται — «посмеётся, обманет» (καταπαίζω — насмехаться, обманывать; слав. «посмеется»); ἀλήθειαν οὐ μὴ λαλήσωσιν — «истины не скажут» (сильное отрицание). μεμάθηκεν ἡ γλῶσσα αὐτῶν λαλεῖν ψευδῆ — «научился язык их говорить ложь» (μανθάνω, перфект); ἠδίκησαν — «поступали несправедливо» (ἀδικέω); οὐ διέλιπον τοῦ ἐπιστρέψαι — «не перестали обращаться» (διαλείπω)."
  6: "Слав. номер: 9:6. τόκος ἐπὶ τόκῳ — «рост на рост» (τόκος — рост, лихва, 利); δόλος ἐπὶ δόλῳ — «коварство на коварство» (δόλος — обман, 欺き); οὐκ ἤθελον εἰδέναι με — «не захотели знать Меня». Кавычки закрываются в конце стиха."
  7: "Слав. номер: 9:7. πυρώσω αὐτοὺς καὶ δοκιμῶ αὐτούς — «расплавлю их и испытаю их» (πυρόω — жечь, плавить; δοκιμάζω — испытывать); слав. «разжегу их и искушу их». Слав. добавляет «сил» (Саваоф) — нет в LXX, внесено без скобок. ὅτι ποιήσω ἀπὸ προσώπου πονηρίας… — «ибо что сделаю из-за злобы дочери народа Моего?» (ἀπὸ προσώπου — «из-за»)."
  8: "Слав. номер: 9:8. βολὶς τιτρώσκουσα — «стрела ранящая» (βολίς — стрела, 矢; τιτρώσκω — ранить); слав. «стрела уязвляющая». δόλια τὰ ῥήματα — «коварны слова» (δόλιος). λαλεῖ εἰρηνικά — «говорит мирное»; ἐν ἑαυτῷ ἔχει τὴν ἔχθραν — «в себе имеет вражду» (ἔχθρα — вражда, 敵意)."
  9: "Слав. номер: 9:9. μὴ ἐπὶ τούτοις οὐκ ἐπισκέψομαι — «разве за это не посещу?» (ἐπισκέπτομαι — посещать, взыскивать); ἢ ἐν λαῷ τῷ τοιούτῳ οὐκ ἐκδικήσει ἡ ψυχή μου — «или такому народу не отомстит душа Моя?» (ἐκδικέω — мстить, 復讐する). Двойной вопрос сохранён; «と主は言われる» внутри речи."
  10: "Слав. номер: 9:10. Ἐπὶ τὰ ὄρη λάβετε κοπετόν — «на горах возьмите плач» (κοπετός — рыдание, 嘆き); ἐπὶ τὰς τρίβους τῆς ἐρήμου θρῆνον — «на стезях пустыни плач» (θρῆνος — плач). ὅτι ἐξέλιπον παρὰ τὸ μὴ εἶναι ἀνθρώπους — «ибо исчезли, так что нет людей» (παρά с инфинитивом — «из-за того что»); οὐκ ἤκουσαν φωνὴν ὑπάρξεως — «не слышали голоса существования», т. е. жизни (ὕπαρξις — существование, 住まい); слав. «не слышаша гласа обитания». ἀπὸ πετεινῶν τοῦ οὐρανοῦ καὶ ἕως κτηνῶν — «от птиц небесных и до скотов»; ἐξέστησαν, ᾤχοντο — «исчезли, ушли» (ἐξίστημι, οἴχομαι)."
  11: "Слав. номер: 9:11. δώσω τὴν Ιερουσαλημ εἰς μετοικίαν — «отдам Иерусалим в переселение» (μετοικία — переселение, 移住); εἰς κατοικητήριον δρακόντων — «в жилище драконов» (κατοικητήριον — жилище; δράκων — дракон, 竜; слав. «в жилище змием»); τὰς πόλεις Ιουδα εἰς ἀφανισμὸν θήσομαι — «города Иуды обращу в уничтожение» (ἀφανισμός — истребление, 荒れ地); παρὰ τὸ μὴ κατοικεῖσθαι — «так что не будут обитаемы». Кавычки закрываются."
  12: "Слав. номер: 9:12. τίς ὁ ἄνθρωπος ὁ συνετός — «кто человек разумный» (συνετός — понимающий, 知恵ある); συνέτω τοῦτο — «пусть уразумеет это» (συνίημι, императив); ᾧ λόγος στόματος κυρίου πρὸς αὐτόν — «к кому слово уст Господних», т. е. кому оно было; ἀναγγειλάτω ὑμῖν — «пусть возвестит вам» (ἀναγγέλλω). ἕνεκεν τίνος — «из-за чего»; ἀπώλετο ἡ γῆ — «погибла земля»; ἀνήφθη ὡς ἔρημος — «возжжена как пустыня» (ἀνάπτω — зажигать); παρὰ τὸ μὴ διοδεύεσθαι αὐτήν — «так что никто не проходит по ней» (διοδεύω — проходить)."
  13: "Слав. номер: 9:13. Вводная формула вне кавычек: καὶ εἶπεν κύριος πρός με — «и сказал Господь мне». Διὰ τὸ ἐγκαταλιπεῖν αὐτοὺς τὸν νόμον μου — «за то, что они оставили закон Мой» (ἐγκαταλείπω — оставлять, 捨てる); ὃν ἔδωκα πρὸ προσώπου αὐτῶν — «который Я дал пред лицом их»; οὐκ ἤκουσαν τῆς φωνῆς μου — «не послушали голоса Моего». Причина продолжается в 9:13."
  14: "Слав. номер: 9:14. τῶν ἀρεστῶν τῆς καρδίας αὐτῶν — «угодного сердцу их» (ἀρεστός — угодный, 好む); ὀπίσω τῶν εἰδώλων — «за идолами» (εἴδωλον — идол, 偶像); ἃ ἐδίδαξαν αὐτοὺς οἱ πατέρες αὐτῶν — «которым научили их отцы их». В слав. порядок иной, держим гр."
  15: "Слав. номер: 9:15. ψωμιῶ αὐτοὺς ἀνάγκας — «накормлю их нуждами (теснотами)» (ψωμίζω — кормить; ἀνάγκη — нужда, теснота, 苦しみ); слав. «напитаю люди сия теснотами»; ποτιῶ αὐτοὺς ὕδωρ χολῆς — «напою их водою желчи» (ποτίζω — поить; χολή — желчь, горечь, 苦い水)."
  16: "Слав. номер: 9:16. διασκορπιῶ — «рассею» (διασκορπίζω); εἰς οὓς οὐκ ἐγίνωσκον — «к которым не знали»; ἐπαποστελῶ ἐπ᾽ αὐτοὺς τὴν μάχαιραν — «пошлю на них меч» (ἐπαποστέλλω; μάχαιρα — меч); ἕως τοῦ ἐξαναλῶσαι αὐτοὺς ἐν αὐτῇ — «доколе не истреблю их в нём» (ἐξαναλίσκω — истреблять). Кавычки закрываются в конце стиха."
  17: "Слав. номер: 9:17. Καλέσατε τὰς θρηνούσας — «позовите плачущих (плакальщиц)» (θρηνέω — оплакивать, 泣く); καὶ ἐλθέτωσαν — «и пусть придут»; πρὸς τὰς σοφὰς ἀποστείλατε — «к мудрым пошлите» (σοφός — мудрый, искусный); φθεγξάσθωσαν — «пусть возгласят» (φθέγγομαι — издавать голос). Слав. «призовите плачевниц… и ко женам премудрым послите»."
  18: "Слав. номер: 9:18. λαβέτωσαν ἐφ᾽ ὑμᾶς θρῆνον — «пусть возьмут над вами плач» (λαμβάνω); καταγαγέτωσαν οἱ ὀφθαλμοὶ ὑμῶν δάκρυα — «пусть сведут очи ваши слёзы» (κατάγω — низводить; δάκρυον — слеза, 涙); τὰ βλέφαρα ὑμῶν ῥεῖτω ὕδωρ — «пусть веки ваши источают воду» (βλέφαρον — веко; ῥέω — течь)."
  19: "Слав. номер: 9:19. φωνὴ οἴκτου ἠκούσθη ἐν Σιων — «голос рыдания услышан в Сионе» (οἶκτος — плач, жалость); Πῶς ἐταλαιπωρήσαμεν — «как мы бедствуем!» (ταλαιπωρέω); κατησχύνθημεν σφόδρα — «постыдились весьма»; ἐγκατελίπομεν τὴν γῆν — «оставили землю»; ἀπερρίψαμεν τὰ σκηνώματα ἡμῶν — «отвергли шатры наши» (ἀπορρίπτω; σκήνωμα — шатёр, 天幕). Вопль народа — вложенная цитата 『…』."
  20: "Слав. номер: 9:20. ἀκούσατε δή, γυναῖκες, λόγον θεοῦ — «слушайте, жёны, слово Божие» (δέ — усилительная частица); δεξάσθω τὰ ὦτα ὑμῶν — «пусть примут уши ваши» (δέχομαι — принимать). διδάξατε τὰς θυγατέρας ὑμῶν οἶκτον — «научите дочерей ваших плачу»; γυνὴ τὴν πλησίον αὐτῆς θρῆνον — «жена ближнюю свою плачу», т. е. одна другую."
  21: "Слав. номер: 9:21. ἀνέβη θάνατος διὰ τῶν θυρίδων ὑμῶν — «взошла смерть через окна ваши» (θυρίς — окно, 窓); εἰσῆλθεν εἰς τὴν γῆν ὑμῶν — «вошла в землю вашу»; τοῦ ἐκτρῖψαι — «чтобы истребить» (ἐκτρίβω — стирать, истреблять); νήπια ἔξωθεν — «младенцев вне», т. е. на улице (νήπιος, 幼い子); νεανίσκους ἀπὸ τῶν πλατειῶν — «юношей с площадей» (πλατεῖα — широкая улица, 広場)."
  22: "Слав. номер: 9:22. εἰς παράδειγμα — «в позор» (παράδειγμα — выставленное на позор, 見せ物); ἐπὶ προσώπου τοῦ πεδίου — «на лице поля» (πεδίον — поле, равнина); ὡς χόρτος ὀπίσω θερίζοντος — «как трава позади жнущего» (θερίζω — жать, 刈る); οὐκ ἔσται ὁ συνάγων — «не будет собирающего» (συνάγω — собирать). Кавычки закрываются."
  23: "Слав. номер: 9:23. Τάδε λέγει κύριος — вводная формула вне кавычек. καυχάσθω — «пусть хвалится» (καυχάομαι — хвалиться, 誇る); в LXX трижды μή с императивом — три запрета, сохранены. ὁ σοφός — мудрец (知者); ὁ ἰσχυρός — сильный (強い者); ὁ πλούσιος — богатый (富ある者). Слав. в начале добавляет «(Глаголи:)» — в LXX нет, не внесено."
  24: "Слав. номер: 9:24. ἐν τούτῳ καυχάσθω ὁ καυχώμενος — «этим пусть хвалится хвалящийся»; συνίειν καὶ γινώσκειν — «разуметь и знать» (два инфинитива); ποιῶν ἔλεος καὶ κρίμα καὶ δικαιοσύνην — «творящий милость, суд и правду» (ἔλεος — милость, いつくしみ; κρίμα — суд, 裁き; δικαιοσύνη — правда, 義); ὅτι ἐν τούτοις τὸ θέλημά μου — «ибо в этом воля Моя» (θέλημα — воля, 望み). «と主は言われる» в конце — внутри речи."
  25: "Слав. номер: 9:25. περιτετμημένους ἀκροβυστίας αὐτῶν — «обрезанных с крайнею плотию их» (περιτέμνω — обрезать; ἀκροβυστία — крайняя плоть), т. е. обрезанных только по плоти; слав. «иже обрезаную имут плоть свою». ἐπισκέψομαι ἐπί — «посещу, взыщу» (ἐπισκέπτομαι). Перечень народов начинается в 9:25 без сказуемого — в тексте он присоединён словами «すなわち…である», чтобы связать стихи (отмечено)."
  26: "Слав. номер: 9:26. ἐπ᾽ Αἴγυπτον καὶ ἐπὶ τὴν Ιουδαίαν καὶ ἐπὶ Εδωμ καὶ ἐπὶ υἱοὺς Αμμων καὶ ἐπὶ υἱοὺς Μωαβ — «на Египет, и на Иудею, и на Едом, и на сынов Аммона, и на сынов Моава»; ἐπὶ πάντα περικειρόμενον τὰ κατὰ πρόσωπον αὐτοῦ — «на всех стригущих [волосы] на лице своём» (περικείρω — обстригать кругом; обычай язычников); τοὺς κατοικοῦντας ἐν τῇ ἐρήμῳ — «живущих в пустыне»; ὅτι πάντα τὰ ἔθνη ἀπερίτμητα σαρκί — «ибо все народы необрезаны плотию» (ἀπερίτμητος, 無割礼); πᾶς οἶκος Ισραηλ ἀπερίτμητοι καρδίας αὐτῶν — «весь дом Израилев необрезан сердцем их». Кавычки закрываются в конце главы."
