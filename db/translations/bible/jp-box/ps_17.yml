verses:
  0: "指揮者[しきしゃ]のために。主[しゅ]の僕[しもべ]ダビデが、主[しゅ]がすべての敵[てき]の手[て]とサウルの手[て]から彼[かれ]を救[すく]い出[だ]された日[ひ]に、主[しゅ]に向[む]かってこの歌[うた]の言葉[ことば]を語[かた]ったもの。"
  1: "主[しゅ]よ、わたしの力[ちから]よ、わたしはあなたを愛[あい]する。"
  2: "主[しゅ]はわたしの岩[いわ]、わたしの砦[とりで]、わたしを救[すく]い出[だ]す方[かた]。わたしの神[かみ]、わたしの助[たす]け。わたしはこの方[かた]に寄[よ]り頼[たの]む。わたしの盾[たて]、わたしの救[すく]いの角[つの]、わたしの逃[に]げ場[ば]。"
  3: "わたしは賛美[さんび]しながら主[しゅ]を呼[よ]び求[もと]める。こうして、わたしは敵[てき]から救[すく]われる。"
  4: "死[し]の苦[くる]しみがわたしを取[と]り囲[かこ]み、不法[ふほう]の奔流[ほんりゅう]がわたしをかき乱[みだ]した。"
  5: "陰府[よみ]の苦[くる]しみがわたしを囲[かこ]み、死[し]の網[あみ]がわたしに先回[さきまわ]りした。"
  6: "わたしは苦[くる]しみの中[なか]で主[しゅ]を呼[よ]び、わたしの神[かみ]に向[む]かって叫[さけ]んだ。主[しゅ]はその聖[せい]なる神殿[しんでん]からわたしの声[こえ]を聞[き]かれた。わたしの叫[さけ]びは主[しゅ]の前[まえ]で、その耳[みみ]に届[とど]く。"
  7: "地[ち]は揺[ゆ]れ動[うご]き、震[ふる]え上がった。山[やま]々[やま]の基[もと]も揺[ゆ]さぶられ、震[ふる]えた。神[かみ]が彼[かれ]らに怒[いか]りを燃[も]やされたからである。"
  8: "その怒[いか]りのうちに煙[けむり]が上[のぼ]り、その御前[みまえ]から火[ひ]が燃[も]え出[で]て、炭[すみ]がその方[かた]から燃[も]え上[あ]がった。"
  9: "主[しゅ]は天[てん]を傾[かたむ]けて降[お]り、その足[あし]の下[もと]には暗[くら]やみがあった。"
  10: "主[しゅ]はケルビムに乗[の]って飛[と]び、風[かぜ]の翼[つばさ]に乗[の]って飛[と]んだ。"
  11: "主[しゅ]は暗[くら]やみをその隠[かく]れ場[ば]とし、その周[まわ]りにある幕屋[まくや]は、空[そら]の雲[くも]の中[なか]の暗[くら]い水[みず]であった。"
  12: "その御前[みまえ]の輝[かがや]きから、雲[くも]が過[す]ぎ去[さ]った。雹[ひょう]と火[ひ]の炭[すみ]とが。"
  13: "主[しゅ]は天[てん]から雷[かみなり]を鳴[な]らし、いと高[たか]き方[かた]はその声[こえ]を響[ひび]かせられた。"
  14: "主[しゅ]は矢[や]を放[はな]って彼[かれ]らを散[ち]らし、稲妻[いなずま]を多[おお]くして彼[かれ]らをかき乱[みだ]された。"
  15: "主[しゅ]よ、あなたの叱責[しっせき]により、あなたの怒[いか]りの息[いき]が吹[ふ]くことにより、水[みず]の泉[いずみ]が現[あらわ]れ、世界[せかい]の基[もと]が露[あら]わになった。"
  16: "主[しゅ]は高[たか]みから手[て]を伸[の]べてわたしを取[と]り、多[おお]くの水[みず]からわたしを引[ひ]き上[あ]げられた。"
  17: "主[しゅ]はわたしを強[つよ]い敵[てき]から、わたしを憎[にく]む者[もの]から救[すく]い出[だ]される。彼[かれ]らはわたしより強[つよ]かったからである。"
  18: "彼[かれ]らはわたしの苦[くる]しみの日[ひ]に先[さき]に襲[おそ]ったが、主[しゅ]はわたしの支[ささ]えとなられた。"
  19: "主[しゅ]はわたしを広[ひろ]い所[ところ]へ連[つ]れ出[だ]し、わたしを救[すく]い出[だ]された。主[しゅ]がわたしを喜[よろこ]ばれたからである。"
  20: "主[しゅ]はわたしの義[ぎ]に応[おう]じて、わたしの手[て]の清[きよ]さに応[おう]じて、わたしに報[むく]いを与[あた]えられる。"
  21: "わたしは主[しゅ]の道[みち]を守[まも]り、わたしの神[かみ]から離[はな]れて悪[わる]いことをしなかったからである。"
  22: "主[しゅ]の裁[さば]きはすべてわたしの前[まえ]にあり、わたしはその定[さだ]めを遠[とお]ざけなかったからである。"
  23: "わたしは主[しゅ]の前[まえ]で傷[きず]のない者[もの]となり、自分[じぶん]の不法[ふほう]から身[み]を守[まも]った。"
  24: "主[しゅ]はその目[め]の前[まえ]で、わたしの義[ぎ]に応[おう]じて、わたしの手[て]の清[きよ]さに応[おう]じて、わたしに報[むく]いを与[あた]えられる。"
  25: "あなたは恵[めぐ]み深[ふか]い者[もの]には恵[めぐ]み深[ふか]く、傷[きず]のない者[もの]には傷[きず]なく接[せっ]する。"
  26: "選[えら]ばれた者[もの]には選[えら]ばれた者[もの]として、曲[ま]がった者[もの]には、その曲[ま]がりに応[おう]じて接[せっ]する。"
  27: "あなたはへりくだる民[たみ]を救[すく]い、高[たか]ぶる者[もの]の目[め]を低[ひく]くされるからである。"
  28: "主[しゅ]よ、あなたはわたしの灯[ともしび]をともされる。わたしの神[かみ]はわたしの暗[くら]やみを照[て]らされる。"
  29: "あなたによって、わたしは軍勢[ぐんぜい]から救[すく]い出[だ]され、わたしの神[かみ]によって、わたしは城壁[じょうへき]を越[こ]える。"
  30: "わたしの神[かみ]よ。その道[みち]は傷[きず]がなく、主[しゅ]の言葉[ことば]は火[ひ]で試[ため]されたもの。主[しゅ]は、すべて寄[よ]り頼[たの]む者[もの]の盾[たて]である。"
  31: "主[しゅ]のほかに、だれが神[かみ]であろうか。わたしたちの神[かみ]のほかに、だれが神[かみ]であろうか。"
  32: "わたしに力[ちから]を帯[お]びさせ、わたしの道[みち]を傷[きず]なくされる方[かた]、それが神[かみ]である。"
  33: "わたしの足[あし]を鹿[しか]のようにし、わたしを高[たか]い所[ところ]に立[た]たせる方[かた]。"
  34: "わたしの手[て]を戦[たたか]いに鍛[きた]え、わたしの腕[うで]を青銅[せいどう]の弓[ゆみ]とする方[かた]。"
  35: "あなたはわたしに救[すく]いの盾[たて]を与[あた]え、あなたの右[みぎ]の手[て]がわたしを支[ささ]えた。あなたの戒[いまし]めはわたしを終[おわ]りまで立[た]たせ、その戒[いまし]めがわたしを教[おし]える。"
  36: "あなたはわたしの下[した]に歩[あゆ]みを広[ひろ]くし、わたしの足[あし]は弱[よわ]らなかった。"
  37: "わたしは敵[てき]を追[お]い、追[お]いついて、彼[かれ]らが滅[ほろ]びるまで引[ひ]き返[かえ]さない。"
  38: "わたしは彼[かれ]らを打[う]ちのめす。彼[かれ]らは立[た]つことができず、わたしの足[あし]の下[もと]に倒[たお]れる。"
  39: "あなたは力[ちから]を帯[お]びさせてわたしを戦[たたか]いに備[そな]えさせ、わたしに立[た]ち向[む]かう者[もの]をすべて、わたしの足[あし]の下[もと]に伏[ふ]させられた。"
  40: "あなたはわたしの敵[てき]に背[せ]を向[む]けさせ、わたしを憎[にく]む者[もの]を滅[ほろ]ぼされた。"
  41: "彼[かれ]らは叫[さけ]んだが、救[すく]う者[もの]はなかった。主[しゅ]に呼[よ]び求[もと]めても、主[しゅ]は彼[かれ]らに答[こた]えられなかった。"
  42: "わたしは彼[かれ]らを風[かぜ]の前[まえ]の塵[ちり]のように細[こま]かくし、広[ひろ]い道[みち]の泥[どろ]のように踏[ふ]みならす。"
  43: "あなたは民[たみ]の争[あらそ]いからわたしを救[すく]い出[だ]し、諸国民[しょこくみん]の頭[かしら]とされる。わたしが知[し]らなかった民[たみ]が、わたしに仕[つか]える。"
  44: "彼[かれ]らは、耳[みみ]にしたとたん、わたしに従[したが]う。異[い]国[こく]の者[もの]たちは、わたしにへつらう。"
  45: "異[い]国[こく]の者[もの]たちは衰[おとろ]え、その道[みち]から足[あし]をひきずる。"
  46: "主[しゅ]は生[い]きておられる。わたしの神[かみ]はたたえられる。わたしの救[すく]いの神[かみ]は高[たか]く上[あ]げられる。"
  47: "わたしに復讐[ふくしゅう]を与[あた]え、もろもろの民[たみ]をわたしの下[した]に従[したが]わせる神[かみ]である。"
  48: "わたしを怒[いか]る敵[てき]から救[すく]い出[だ]す方[かた]は、わたしを、わたしに立[た]ち向[む]かう者[もの]の上[うえ]に高[たか]く上[あ]げ、不法[ふほう]な人[ひと]からわたしを救[すく]い出[だ]される。"
  49: "それゆえ、主[しゅ]よ、わたしは諸国民[しょこくみん]の中[なか]であなたをほめたたえ、あなたの名[な]をほめ歌[うた]う。"
  50: "主[しゅ]はその王[おう]の救[すく]いを大[おお]きくし、その油[あぶら]を注[そそ]がれた者[もの]、ダビデとその子孫[しそん]に、とこしえに恵[めぐ]みを施[ほどこ]される。"

notes:
  0: "Εἰς τὸ τέλος — 指揮者のために (в LXX-Псалтири обычное надписание; jp-joc 伶長に歌はしむ). τῷ παιδὶ κυρίου τῷ Δαυιδ — 主の僕ダビデの詩 (παῖς — «раб, слуга»). Содержание: песнь, которую Давид сказал Господу в день избавления от всех врагов и от руки Саула; ср. 2 Цар 22. Надписание — стих 0."
  1: "Ἀγαπήσω σε, κύριε ἡ ἰσχύς μου — 主よ、わたしの力よ、わたしはあなたを愛する. ἰσχύς — 力[ちから]. Порядок греческого сохранён: обращение, затем «сила моя» как второе обращение (ср. jp-joc 主我の力よ)."
  2: "κύριος στερέωμά μου — 主はわたしの岩 (στερέωμα — твердыня). καταφυγή — 砦 (убежище). ῥύστης — 救い出す方. βοηθός — 助け. ἐλπιῶ ἐπ᾽ αὐτόν — この方に寄り頼む. ὑπερασπιστής — 盾. κέρας σωτηρίας — 救いの角 (рог — символ силы). ἀντιλήμπτωρ — 逃げ場 (заступник)."
  3: "αἰνῶν ἐπικαλέσομαι κύριον — 賛美しながら主を呼び求める; αἰνῶν можно понять и как «призывая Достойного хвалы». σωθήσομαι — 救われる."
  4: "ὠδῖνες θανάτου — 死の苦しみ (букв. «родовые боли смерти»). χείμαρροι ἀνομίας — 不法の奔流 (χείμαρρος — зимний поток, паводок). ἐξετάραξάν με — かき乱した."
  5: "ὠδῖνες ᾅδου — 陰府の苦しみ; ᾅδης — 陰府[よみ]. παγίδες θανάτου — 死の網. προέφθασάν με — 先回りした."
  6: "ἐν τῷ θλίβεσθαί με — 苦しみの中で. ἐπεκαλεσάμην… ἐκέκραξα — 呼び…叫んだ. ἐκ ναοῦ ἁγίου — 聖なる神殿から. ἡ κραυγή μου… εἰσελεύσεται εἰς τὰ ὦτα — 叫びは耳に届く (греч. будущее; по-японски настоящее естественнее)."
  7: "ἐσαλεύθη καὶ ἔντρομος ἐγενήθη ἡ γῆ — 地は揺れ動き、震え上がった. θεμέλια τῶν ὀρέων — 山々の基. ὠργίσθη αὐτοῖς ὁ θεός — 神が彼らに怒られた; αὐτοῖς — «на них» (на землю и горы или на врагов), по-японски 彼らに."
  8: "ἀνέβη καπνὸς ἐν ὀργῇ αὐτοῦ — その怒りのうちに煙が上り. πῦρ ἀπὸ προσώπου αὐτοῦ κατεφλόγισεν — 御前から火が燃え出て. ἄνθρακες ἀνήφθησαν ἀπ᾽ αὐτοῦ — 炭がその方から燃え上がった."
  9: "ἔκλινεν οὐρανὸν καὶ κατέβη — 天を傾けて降り. γνόφος ὑπὸ τοὺς πόδας αὐτοῦ — 足の下に暗やみ."
  10: "ἐπέβη ἐπὶ χερουβιν — ケルビムに乗り. ἐπετάσθη — 飛んだ (повтор в греч. сохранён). πτέρυγες ἀνέμων — 風の翼."
  11: "ἔθετο σκότος ἀποκρυφὴν αὐτοῦ — 暗やみを隠れ場とし. σκηνή — 幕屋. σκοτεινὸν ὕδωρ ἐν νεφέλαις ἀέρων — 空の雲の中の暗い水; приложение сохранено."
  12: "ἀπὸ τῆς τηλαυγήσεως — 輝きから (τηλαύγησις — яркий свет). αἱ νεφέλαι διῆλθον — 雲が過ぎ去った. χάλαζα καὶ ἄνθρακες πυρός — 雹と火の炭; назывное предложение сохранено."
  13: "ἐβρόντησεν ἐξ οὐρανοῦ κύριος — 主は天から雷を鳴らし. ἔδωκεν φωνὴν αὐτοῦ — その声を響かせられた."
  14: "βέλη — 矢. ἐσκόρπισεν — 散らし. ἀστραπὰς ἐπλήθυνεν — 稲妻を多くし. συνετάραξεν — かき乱した."
  15: "πηγαὶ τῶν ὑδάτων — 水の泉. θεμέλια τῆς οἰκουμένης — 世界の基. ἀπὸ ἐπιτιμήσεώς σου — あなたの叱責により. ἐμπνεύσεως πνεύματος ὀργῆς — 怒りの息の吹くこと (πνεῦμα здесь не «Святой Дух», поэтому 霊[れい] не поставлено)."
  16: "ἐξαπέστειλεν ἐξ ὕψους — 高みから手を伸べて (букв. «послал с высоты»). ἐξ ὑδάτων πολλῶν — 多くの水から."
  17: "δυνατῶν — 強い. ἐστερεώθησαν ὑπὲρ ἐμέ — 彼らはわたしより強かった."
  18: "προέφθασάν με — 先に襲った. ἀντιστήριγμα — 支え."
  19: "ἐξήγαγέν με εἰς πλατυσμόν — 広い所へ連れ出し. ἠθέλησέν με — わたしを喜ばれた. В gr-lxx-byz в квадратных скобках повтор «ῥύσεταί με…»; в церковном тексте (Елизаветинская, jp-joc) его нет, поэтому не переведён; слова в базе есть — 〔…〕 не ставятся."
  20: "ἀνταποδώσει — 報いを与えられる (повтор в конце греч. стиха; по-японски один глагол). δικαιοσύνη — 義. καθαριότης — 清さ."
  21: "ἐφύλαξα τὰς ὁδοὺς κυρίου — 主の道を守り. οὐκ ἠσέβησα ἀπὸ τοῦ θεοῦ μου — 神から離れて悪いことをしなかった."
  22: "κρίματα — 裁き. δικαιώματα — 定め. οὐκ ἀπέστησα — 遠ざけなかった."
  23: "ἄμωμος — 傷のない. φυλάξομαι ἀπὸ τῆς ἀνομίας μου — 自分の不法から身を守った."
  24: "ἐνώπιον τῶν ὀφθαλμῶν αὐτοῦ — その目の前で. Повтор ἀνταποδώσει, как в ст. 20."
  25: "μετὰ ὁσίου ὁσιωθήσῃ — 恵み深い者には恵み深く; ὅσιος — «верный, благочестивый»; букв. «со святым станешь святым». Передано по смыслу: Бог отвечает человеку в меру его пути."
  26: "ἐκλεκτοῦ ἐκλεκτὸς ἔσῃ — 選ばれた者には選ばれた者として. στρεβλοῦ διαστρέψεις — 曲がった者には曲がって接する; антропоморфизм «с лукавым — по лукавству его»; не сглажен (ср. Синодальный «и со строптивым развратишися»)."
  27: "λαὸν ταπεινὸν — へりくだる民. ὀφθαλμοὺς ὑπερηφάνων ταπεινώσεις — 高ぶる者の目を低くされる."
  28: "φωτιεῖς λύχνον μου — 灯をともされる. σκότος — 暗やみ."
  29: "πειρατήριον — 軍勢 (πειρατήριον — «разбойничья шайка, набег»; Синодальный «от искушения», jp-joc 軍). ὑπερβήσομαι τεῖχος — 城壁を越える."
  30: "ἄμωμος ἡ ὁδὸς αὐτοῦ — その道は傷がない. λόγια πεπυρωμένα — 火で試された言葉. ὑπερασπιστής — 盾."
  31: "τίς θεὸς πλὴν τοῦ κυρίου — 主のほかに、だれが神であろうか; повтор сохранён."
  32: "περιζωννύων με δύναμιν — 力で帯びさせ. ἔθετο ἄμωμον τὴν ὁδόν — 道を傷なくされた."
  33: "καταρτιζόμενος τοὺς πόδας ὡς ἐλάφου — 足を鹿のようにし. ἐπὶ τὰ ὑψηλὰ ἱστῶν — 高い所に立たせる."
  34: "διδάσκων χεῖρας εἰς πόλεμον — 手を戦いに鍛え. τόξον χαλκοῦν τοὺς βραχίονάς μου — 腕を青銅の弓とする."
  35: "ὑπερασπισμὸν σωτηρίας — 救いの盾. ἀντελάβετό μου — 支えた. παιδεία — 戒め (наставление, воспитание). ἀνώρθωσέν με εἰς τέλος — 最後まで立たせ. ἡ παιδεία σου αὐτὴ με διδάξει — その戒めが教える."
  36: "ἐπλάτυνας τὰ διαβήματα — 歩みを広くし. ἴχνη — 足."
  37: "καταδιώξω… καταλήμψομαι — 追い、追いついて. ἕως ἂν ἐκλίπωσιν — 滅びるまで."
  38: "ἐκθλίψω — 打ちのめす. πεσοῦνται ὑπὸ τοὺς πόδας — 足の下に倒れる."
  39: "περιέζωσάς με δύναμιν — 力で帯びさせ. συνεπόδισας — 足の下に伏させた. ἐπανιστανομένους ἐπ᾽ ἐμέ — 立ち向かう者."
  40: "νῶτον — 背 (обратить в бегство). ἐξωλέθρευσας — 滅ぼされた."
  41: "ἐκέκραξαν — 叫んだ. οὐκ ἦν ὁ σῴζων — 救う者はなかった. οὐκ εἰσήκουσεν — 答えられなかった."
  42: "λεπτυνῶ — 細かくする. χοῦν κατὰ πρόσωπον ἀνέμου — 風の前の塵. πηλὸν πλατειῶν — 広い道の泥 (πλατεῖα — улица, площадь)."
  43: "ἀντιλογιῶν λαοῦ — 民の争い. κεφαλὴν ἐθνῶν — 諸国民の頭. λαός, ὃν οὐκ ἔγνων — 知らなかった民."
  44: "εἰς ἀκοὴν ὠτίου — 耳にしたとたん (букв. «в слух уха»). υἱοὶ ἀλλότριοι — 異国の者たち. ἐψεύσαντό μοι — へつらう (букв. «лгали мне»)."
  45: "ἐπαλαιώθησαν — 衰えた. ἐχώλαναν ἀπὸ τῶν τρίβων — 道から足をひきずる (хромота, бегство)."
  46: "ζῇ κύριος — 主は生きておられる. εὐλογητός — たたえられる. ὑψωθήτω — 高く上げられる."
  47: "ἐκδικήσεις — 復讐. ὑποτάξας λαοὺς ὑπ᾽ ἐμέ — もろもろの民を下に従わせ."
  48: "ἐξ ἐχθρῶν ὀργίλων — 怒る敵から. ὑψώσεις με — 高く上げ. ἀνδρὸς ἀδίκου — 不法な人."
  49: "ἐξομολογήσομαί σοι — ほめたたえる (букв. «исповедаю Тебя»). ἐν ἔθνεσιν — 諸国民の中で. ψαλῶ — ほめ歌う."
  50: "μεγαλύνων τὰς σωτηρίας — 救いを大きくし. χριστῷ αὐτοῦ — 油を注がれた者 (титул, не имя). Δαυιδ καὶ σπέρματι — ダビデとその子孫. ἕως αἰῶνος — とこしえに. В gr-lxx-byz и в русской базе сайта (ru) псалом кончается стихом 50 (славословие); в печатном Синодальном это 17:51, потому что там надписание — стих 1."
