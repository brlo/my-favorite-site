# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный 常体, без 文語.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0.
# Псалом 17: благодарственная песнь Давида (ср. 2 Цар 22) — призыв любви (1),
# явление Бога в буре (2–20), правота Давида (21–31), победа над врагами (32–46),
# обет хвалы среди народов (47–50).
# Красного и синего нет: прямой речи Христа и Богородицы в псалме нет.
