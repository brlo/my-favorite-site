verses:
  1: "民[たみ]は主[しゅ]の前[まえ]で悪[わる]いことをつぶやいていた。主はそれを聞[き]いて激[はげ]しく怒[いか]られた。主からの火[ひ]が彼[かれ]らのうちに燃[も]え上[あ]がり、宿営[しゅくえい]の一[いち]部[ぶ]を焼[や]き尽[つ]くした。"
  2: "民[たみ]がモーセに叫[さけ]ぶと、モーセが主[しゅ]に祈[いの]ったので、火[ひ]は鎮[しず]まった。"
  3: "その場所[ばしょ]の名[な]は「燃[も]え上[あ]がり」と名[な]づけられた。主[しゅ]からの火[ひ]が彼[かれ]らのうちに燃え上がったからである。"
  4: "彼[かれ]らの間[あいだ]にいた混[ま]じり合[あ]った民[たみ]が、食[た]べ物[もの]への激[はげ]しい欲[よく]にかられた。イスラエルの子[こ]らもまた座[すわ]り込[こ]んで泣[な]き、言[い]った。「だれがわたしたちに肉[にく]を食[た]べさせてくれるのか。"
  5: "わたしたちは、エジプトでただで食[た]べた魚[さかな]、きゅうり、メロン、長[なが]ねぎ、玉[たま]ねぎ、にんにくのことを思[おも]い出[だ]します。"
  6: "しかし今[いま]は、わたしたちの心[こころ]は干[ひ]からびています。わたしたちの目[め]には、マナのほか何[なに]もないのです。」"
  7: "マナはコリアンダーの種[たね]のようで、その色[いろ]は水晶[すいしょう]のようであった。"
  8: "民[たみ]は歩[ある]き回[まわ]ってそれを集[あつ]め、石[いし]臼[うす]でひくか、臼ですりつぶし、鍋[なべ]で煮[に]て、焼[や]き菓子[がし]にした。その味[あじ]は、油[あぶら]を混[ま]ぜた焼き菓子の味のようであった。"
  9: "夜[よる]、宿営[しゅくえい]に露[つゆ]が降[お]りると、その露の上[うえ]にマナが降りた。"
  10: "モーセは、民[たみ]が氏族[しぞく]ごとに、おのおの自分[じぶん]の天幕[てんまく]の入口[いりぐち]で泣[な]いているのを聞[き]いた。主[しゅ]の怒[いか]りは激[はげ]しく燃[も]え上[あ]がり、モーセにとってもそれは苦[にが]いことであった。"
  11: "モーセは主[しゅ]に言[い]った。「なぜ、あなたはこの僕[しもべ]を苦[くる]しめるのですか。なぜ、わたしはあなたの前[まえ]に恵[めぐ]みを見[み]いだせないのですか。この民[たみ]の重[おも]荷[に]をわたしに負[お]わせるとは。"
  12: "わたしがこの民[たみ]をすべて胎[たい]に宿[やど]したのでしょうか。わたしが彼[かれ]らを産[う]んだのでしょうか。それなのに、あなたはわたしに『乳[ち]を飲[の]ませる子[こ]を抱[だ]く乳母[うば]のように、それをあなたのふところに抱いて、あなたが父[ちち]たちに誓[ちか]った地[ち]へ運[はこ]べ』と言[い]われるのですか。"
  13: "この民[たみ]すべてに肉[にく]をどこから手[て]に入[い]れてやればよいのですか。彼[かれ]らはわたしに向[む]かって『肉を食[た]べさせてくれ』と泣[な]きながら言[い]うのです。"
  14: "わたし一[ひと]人[り]では、この民[たみ]を負[お]いきれません。彼[かれ]らはわたしにとって重[おも]すぎるからです。"
  15: "もし、あなたがわたしにそうなさるのなら、わたしを殺[ころ]してください。あなたの前[まえ]に恵[めぐ]みを見[み]いだしているのなら、わたしが自分[じぶん]の惨[みじ]めな姿[すがた]を見[み]ないようにしてください。」"
  16: "主[しゅ]はモーセに言[い]われた。「イスラエルの長老[ちょうろう]たちのうちから、七十人[ななじゅうにん]の者[もの]をわたしのために集[あつ]めなさい。それは、あなた自身[じしん]が民[たみ]の長老[ちょうろう]であり、その書記[しょき]でもあると知[し]っている者[もの]たちである。彼[かれ]らを証[あかし]の幕屋[まくや]に連[つ]れて来[き]て、そこであなたとともに立[た]たせなさい。"
  17: "わたしは降[お]りて行[い]き、そこであなたと語[かた]ろう。あなたの上[うえ]にある霊[れい]のうちから取[と]って、彼[かれ]らの上に置[お]く。彼らはあなたとともに民[たみ]の重[おも]荷[に]を負[お]い、あなたはそれを一人[ひとり]で負わなくてよくなる。"
  18: "民[たみ]にはこう言[い]いなさい。明日[あす]のために身[み]を清[きよ]めなさい。肉[にく]を食[た]べることになる。あなたがたは主[しゅ]の前[まえ]で泣[な]いて、『だれがわたしたちに肉を食べさせてくれるのか。エジプトにいたほうがよかった』と言[い]った。それゆえ、主はあなたがたに肉を与[あた]えて、あなたがたは肉を食べる。"
  19: "あなたがたは一日[いちにち]だけでなく、二日[ふつか]でも、五日[いつか]でも、十日[とおか]でも、二十日[はつか]でもなく、"
  20: "一[ひと]月[つき]の間[あいだ]、それを食[た]べ、ついにはあなたがたの鼻[はな]の穴[あな]から出[で]てくるようになり、それはあなたがたにとって忌[い]まわしいものとなる。あなたがたは、自分[じぶん]たちの間[あいだ]におられる主[しゅ]に背[そむ]き、その前[まえ]で『なぜ、わたしたちはエジプトから出[で]て来[き]たのか』と言[い]って泣[な]いたからである。」"
  21: "モーセは言[い]った。「わたしが共[とも]にいるこの民[たみ]は、歩[ある]ける者[もの]が六十万[ろくじゅうまん]人[にん]いるのに、あなたは『わたしは彼らに肉[にく]を与[あた]えて食[た]べさせる。彼らは一[ひと]月[つき]の間[あいだ]食べる』と言[い]われるのですか。"
  22: "羊[ひつじ]や牛[うし]を屠[ほふ]って彼[かれ]らに与えても、足[た]りるでしょうか。海[うみ]のすべての魚[さかな]を集[あつ]めても、足りるでしょうか。」"
  23: "主[しゅ]はモーセに言[い]われた。「主の手[て]が届[とど]かないことがあるだろうか。わたしの言葉[ことば]があなたに届くかどうか、今[いま]にあなたは知[し]るであろう。」"
  24: "モーセは出[で]て行[い]き、主[しゅ]の言葉[ことば]を民[たみ]に告[つ]げた。彼[かれ]は民の長老[ちょうろう]たちのうちから七十人[ななじゅうにん]の者[もの]を集[あつ]め、幕屋[まくや]の周[まわ]りに立[た]たせた。"
  25: "主[しゅ]は雲[くも]の中[なか]に降[お]りて、彼[かれ]と語[かた]り、彼の上[うえ]にある霊[れい]のうちから取って、七十人[ななじゅうにん]の長老[ちょうろう]たちの上に置[お]かれた。霊が彼ら[かれ]らの上にとどまると、彼らは預言[よげん]した。しかし、それきり預言することはなかった。"
  26: "しかも、二人[ふたり]の者[もの]が宿営[しゅくえい]に残[のこ]っていた。一[ひと]人[り]の名[な]はエルダド、もう一人の名はメダドといった。彼[かれ]らの上[うえ]にも霊[れい]がとどまった。この二人は名簿[めいぼ]に記[しる]された者[もの]であったが、幕屋[まくや]のところへは来[こ]なかった。彼らも宿営のうちで預言[よげん]した。"
  27: "若[わか]い者[もの]が走[はし]って来[き]て、モーセに告[つ]げて言[い]った。「エルダドとメダドが宿営[しゅくえい]で預言[よげん]しています。」"
  28: "モーセに仕[つか]えていた、選[えら]ばれた者[もの]の一人[ひとり]であるヌンの子[こ]ヨシュアが答[こた]えて言[い]った。「わが主[しゅ]モーセよ、彼[かれ]らを止[と]めてください。」"
  29: "モーセは彼[かれ]に言[い]った。「あなたはわたしのために妬[ねた]んでいるのか。主[しゅ]の民[たみ]がみな預言[よげん]者[しゃ]となり、主がその霊[れい]を彼らの上[うえ]に置[お]かれるなら、どんなによいことだろう。」"
  30: "モーセは、イスラエルの長老[ちょうろう]たちとともに宿営[しゅくえい]へ戻[もど]った。"
  31: "主[しゅ]から風[かぜ]が吹[ふ]き出[で]て、海[うみ]からうずらを運[はこ]び、宿営[しゅくえい]の上[うえ]に、こちらの側[がわ]へ一日[いちにち]の道[みち]、あちらの側へ一日の道、宿営の周[まわ]りに、地[ち]からおよそ二キュビトの高[たか]さまで積[つ]み上[あ]げた。"
  32: "民[たみ]は立[た]ち上[あ]がって、その日[ひ]は一日中[じゅう]、夜[よる]も一晩中[ひとばんじゅう]、次[つぎ]の日も一日中、うずらを集[あつ]めた。少[すく]なく集めた者[もの]でも十[じゅう]コルに達[たっ]した。彼[かれ]らはそれを宿営[しゅくえい]の周[まわ]りに広[ひろ]げて干[ほ]した。"
  33: "肉[にく]がまだ彼[かれ]らの歯[は]の間[あいだ]にあり、食[た]べ尽[つ]くさないうちに、主[しゅ]は民[たみ]に向[む]かって怒[いか]りを燃[も]やし、主は民を非常[ひじょう]に大[おお]きな災[わざ]いで打[う]たれた。"
  34: "その場所[ばしょ]の名[な]は「欲[よく]の墓[はか]」と名[な]づけられた。そこに、欲にかられた民[たみ]を葬[ほうむ]ったからである。"
  35: "民[たみ]は「欲[よく]の墓[はか]」から旅[たび]立[だ]ってアシロトへ行[い]き、民はアシロトにとどまった。"

notes:
  1: "γογγύζων — ропща (γογγύζω — «ворчать, роптать»; держим つぶやく). πονηρὰ ἔναντι κυρίου — злое пред Господом. ἐθυμώθη ὀργῇ — воспламенился гневом (θυμόω + датив ὀργῇ — «гневом»). ἐξεκαύθη … πῦρ παρὰ κυρίου — возгорелся огонь от Господа (ἐκκαίω). κατέφαγεν μέρος τι τῆς παρεμβολῆς — пожрал часть стана."
  2: "ἐκέκραξεν ὁ λαὸς πρὸς Μωυσῆν — возопил народ к Моисею (κραυγάζω/κράζω). ηὔξατο — помолился (εὔχομαι). ἐκόπασεν τὸ πῦρ — утих огонь (κοπάζω — «утихать»)."
  3: "Ἐμπυρισμός — «возгорание» (ἐμπυρισμός от ἐμπυρίζω). LXX передаёт имя места как нарицательное; в масоретском тексте и Синодальном — Тавера. ὅτι ἐξεκαύθη ἐν αὐτοῖς πῦρ — ибо возгорелся в них огонь."
  4: "ὁ ἐπίμικτος ὁ ἐν αὐτοῖς — сброд (смешанный люд) среди них (ἐπίμικτος — «смешанный»). ἐπεθύμησαν ἐπιθυμίαν — возжелали желания (винительный внутреннего объекта, евр. усиление). καθίσαντες ἔκλαιον — сидя плакали. Τίς ἡμᾶς ψωμιεῖ κρέα — кто накормит нас мясом (ψωμίζω — «кормить»)."
  5: "ἐμνήσθημεν — мы вспомнили (μιμνῄσκομαι). ἰχθύας — рыбы. δωρεάν — даром. σικύας — огурцы. πέπονας — дыни. πράσα — порей (長ねぎ). κρόμμυα — лук репчатый. σκόρδα — чеснок."
  6: "νυνὶ δέ — а ныне. ἡ ψυχὴ ἡμῶν κατάξηρος — душа наша иссохла (κατάξηρος — «совершенно сухой»). οὐδὲν πλὴν εἰς τὸ μαννα οἱ ὀφθαλμοὶ ἡμῶν — ничего, кроме манны, [не видят] глаза наши (ἔλλειψις глагола)."
  7: "ὡσεὶ σπέρμα κορίου — как семя кориандра (κόριον — кориандр). τὸ εἶδος αὐτοῦ εἶδος κρυστάλλου — вид его — вид кристалла (в Синодальном «бдолах» по масоретскому тексту)."
  8: "διεπορεύετο ὁ λαός — народ расхаживал (διαπορεύομαι). συνέλεγον — собирали. ἤληθον ἐν τῷ μύλῳ — мололи на мельнице (ἀλέω; μύλος — «жернов»). ἔτριβον ἐν τῇ θυίᾳ — толкли в ступе (θυία — «ступа»). ἥψουν ἐν τῇ χύτρᾳ — варили в котле (χύτρα — «горшок»). ἐγκρυφίας — лепёшки, печённые в углях. ἡδονή — вкус, приятность (ἡδονή — «наслаждение»). γεῦμα ἐγκρὶς ἐξ ἐλαίου — вкус лепёшки на масле (ἐγκρίς — «оладья, лепёшка»)."
  9: "δρόσος — роса. κατέβαινεν τὸ μαννα ἐπ᾿ αὐτῆς — сходила манна на неё, т. е. на росу (ἐπ᾿ αὐτῆς — на ней)."
  10: "κατὰ δήμους αὐτῶν — по племенам (родам) своим (δῆμος — «народ, род»). ἕκαστον ἐπὶ τῆς θύρας αὐτοῦ — каждый у двери своей. ἐθυμώθη ὀργῇ κύριος σφόδρα — воспламенился Господь гневом весьма. ἔναντι Μωυσῆ ἦν πονηρόν — пред Моисеем было зло, т. е. и ему это было тяжко."
  11: "Ἵνα τί ἐκάκωσας τὸν θεράποντά σου — для чего Ты озлобил раба Твоего (κακόω — «делать зло, мучить»; θεράπων — «слуга, раб»). οὐχ εὕρηκα χάριν ἐναντίον σου — я не обрёл благодати пред Тобою. ἐπιθεῖναι τὴν ὁρμὴν τοῦ λαοῦ τούτου ἐπ᾿ ἐμέ — возложить на меня порыв (бремя) народа сего (ὁρμή — «стремление, натиск», здесь — тяжесть)."
  12: "μὴ ἐγὼ ἐν γαστρὶ ἔλαβον — разве я зачал во чреве (λαμβάνω ἐν γαστρί). ἢ ἐγὼ ἔτεκον — или я родил (τίκτω). Λαβὲ αὐτὸν εἰς τὸν κόλπον σου — возьми его в недро (объятия) твоё (κόλπος). ὡσεὶ ἄραι τιθηνὸς τὸν θηλάζοντα — как поднять кормилице сосунка (τιθηνός — «кормилица»; θηλάζων — «сосунок»). ἣν ὤμοσας τοῖς πατράσιν αὐτῶν — которую Ты поклялся отцам их."
  13: "πόθεν μοι κρέα δοῦναι — откуда мне дать мяса. κλαίουσιν ἐπ᾿ ἐμοί — плачут надо мной (ἐπί + датив — «против, на»). Δὸς ἡμῖν κρέα, ἵνα φάγωμεν — дай нам мяса, чтобы поесть."
  14: "οὐ δυνήσομαι ἐγὼ μόνος φέρειν — не смогу я один нести. βαρύτερόν μοί ἐστιν τὸ ῥῆμα τοῦτο — тяжелее мне слово (дело) это (ῥῆμα — «слово, вещь»)."
  15: "ἀπόκτεινόν με ἀναιρέσει — убей меня убиением (винительный внутреннего объекта; слав. «убий мя убиением»). εἰ εὕρηκα ἔλεος παρὰ σοί — если я обрёл милость у Тебя. ἵνα μὴ ἴδω μου τὴν κάκωσιν — чтобы не увидеть мне моего зла (κάκωσις — «угнетение, бедствие»)."
  16: "Συνάγαγέ μοι ἑβδομήκοντα ἄνδρας — собери Мне семьдесят мужей. ἀπὸ τῶν πρεσβυτέρων Ισραηλ — из старейшин Израилевых. οὓς αὐτὸς σὺ οἶδας — которых ты сам знаешь. γραμματεῖς αὐτῶν — писцы (книжники) их (γραμματεύς; в масоретском тексте — «надзиратели»). ἄξεις — приведёшь (ἄγω). στήσονται ἐκεῖ μετὰ σοῦ — станут там с тобою."
  17: "καταβήσομαι — сойду (καταβαίνω). ἀφελῶ ἀπὸ τοῦ πνεύματος τοῦ ἐπὶ σοί — убавлю (отниму) от Духа, что на тебе (ἀφαιρέω). ἐπιθήσω ἐπ᾿ αὐτούς — возложу на них. συναντιλήμψονται — будут поддерживать (συναντιλαμβάνομαι — «помогать нести»). ὁρμή — бремя (см. ст. 11)."
  18: "Ἁγνίσασθε εἰς αὔριον — освятитесь к завтрашнему дню (ἁγνίζω). φάγεσθε κρέα — будете есть мясо. ἐκλαύσατε ἔναντι κυρίου — вы плакали пред Господом. καλὸν ἡμῖν ἐστιν ἐν Αἰγύπτῳ — хорошо нам было в Египте. καὶ δώσει κύριος … καὶ φάγεσθε — и даст Господь … и будете есть."
  19: "οὐχ ἡμέραν μίαν … οὐδὲ δύο … οὐδὲ πέντε … οὐδὲ δέκα … οὐδὲ εἴκοσι — не один день, ни два, ни пять, ни десять, ни двадцать (перечисление продолжается в ст. 20: ἕως μηνὸς ἡμερῶν)."
  20: "ἕως μηνὸς ἡμερῶν φάγεσθε — будете есть до месяца дней (т. е. целый месяц). ἕως ἂν ἐξέλθῃ ἐκ τῶν μυκτήρων ὑμῶν — пока не выйдет из ноздрей ваших (μυκτήρ). εἰς χολέραν — в отвращение (χολέρα — «желчь, тошнота»; слав. «в мерзость»). ἠπειθήσατε κυρίῳ — вы не покорились Господу (ἀπειθέω). ὅς ἐστιν ἐν ὑμῖν — Который среди вас. Ἵνα τί ἡμῖν ἐξελθεῖν ἐξ Αἰγύπτου — для чего нам было выходить из Египта."
  21: "Ἑξακόσιαι χιλιάδες πεζῶν — шестьсот тысяч пеших (πεζός — «пеший»). ἐν οἷς εἰμι ἐν αὐτοῖς — среди которых я нахожусь. σὺ εἶπας — Ты сказал. φάγονται μῆνα ἡμερῶν — будут есть месяц дней."
  22: "μὴ πρόβατα καὶ βόες σφαγήσονται — разве заколют овец и волов (σφάζω). ἀρκέσει — будет достаточно (ἀρκέω). ἢ πᾶν τὸ ὄψος τῆς θαλάσσης — или всё [из] глубины (рыба) морской (ὄψος — «съестное, рыба»; слав. «вся рыбы морския»). συναχθήσεται — соберётся."
  23: "Μὴ χεὶρ κυρίου οὐκ ἐξαρκέσει — разве рука Господня не достанет (ἐξαρκέω — «быть достаточным»). ἤδη γνώσει — теперь узнаешь. εἰ ἐπικαταλήμψεταί σε ὁ λόγος μου ἢ οὔ — постигнет ли тебя слово Моё или нет (ἐπικαταλαμβάνω)."
  24: "ἐξῆλθεν Μωϋσῆς — вышел Моисей. τὰ ῥήματα κυρίου — слова Господни. συνήγαγεν ἑβδομήκοντα ἄνδρας — собрал семьдесят мужей. ἔστησεν αὐτοὺς κύκλῳ τῆς σκηνῆς — поставил их вокруг скинии."
  25: "κατέβη κύριος ἐν νεφέλῃ — сошёл Господь в облаке. παρείλατο ἀπὸ τοῦ πνεύματος τοῦ ἐπ᾿ αὐτῷ — взял от Духа, что на нём (παραιρέω). ὡς δὲ ἐπανεπαύσατο τὸ πνεῦμα ἐπ᾿ αὐτούς — когда почил Дух на них (ἐπαναπαύομαι). ἐπροφήτευσαν — пророчествовали. οὐκέτι προσέθεντο — более не прилагали, т. е. перестали (προστίθημι)."
  26: "κατελείφθησαν δύο ἄνδρες ἐν τῇ παρεμβολῇ — остались два мужа в стане. ὄνομα τῷ ἑνὶ Ελδαδ — имя одному Елдад. Μωδαδ — Модад (в Синодальном Модад). ἐπανεπαύσατο ἐπ᾿ αὐτοὺς τὸ πνεῦμα — почил на них Дух. τῶν καταγεγραμμένων — из записанных (καταγράφω — «вписывать в список»). οὐκ ἦλθον πρὸς τὴν σκηνήν — не пришли к скинии."
  27: "προσδραμὼν ὁ νεανίσκος — прибежав, юноша (προστρέχω; νεανίσκος — «юноша, слуга»). ἀπήγγειλεν — возвестил (ἀπαγγέλλω). προφητεύουσιν — пророчествуют."
  28: "ἀποκριθεὶς Ἰησοῦς ὁ τοῦ Ναυη — отвечая, Иисус (Иошуа), сын Навин. ὁ παρεστηκὼς Μωυσῇ — предстоящий Моисею (παρίστημι). ὁ ἐκελεκτός — избранный (ἐκλεκτός). Κύριε Μωυσῆ — господин мой Моисей (обращение κύριε). κώλυσον — запрети, останови (κωλύω)."
  29: "Μὴ ζηλοῖς σύ μοι — разве ты ревнуешь (завидуешь) мне (ζηλόω + датив). τίς δῴη — кто дал бы, о если бы (оптатив δῴη). πάντα τὸν λαὸν κυρίου προφήτας — весь народ Господень пророками. ὅταν δῷ κύριος τὸ πνεῦμα — когда даст Господь Духа."
  30: "ἀπῆλθεν Μωϋσῆς εἰς τὴν παρεμβολήν — отошёл Моисей в стан. αὐτὸς καὶ οἱ πρεσβύτεροι Ισραηλ — он и старейшины Израилевы."
  31: "πνεῦμα ἐξῆλθεν παρὰ κυρίου — ветер вышел от Господа (πνεῦμα здесь — «ветер», не Дух). ἐξεπέρασεν ὀρτυγομήτραν — принёс перепелов (ὀρτυγομήτρα — «перепелиная мать», перепела). ὁδὸν ἡμέρας ἐντεῦθεν … ἐντεῦθεν — на день пути по одну и по другую сторону. ὡσεὶ δίπηχυ ἀπὸ τῆς γῆς — около двух локтей (キュビト) от земли (δίπηχυς)."
  32: "ἀναστὰς ὁ λαός — встав народ. ὅλην τὴν ἡμέραν … ὅλην τὴν νύκτα … τὴν ἐπαύριον — весь день, всю ночь и на следующий день. ὁ τὸ ὀλίγον συνήγαγεν δέκα κόρους — кто мало собрал — десять коров (κόρος — мера, хомер). ἔψυξαν ἑαυτοῖς ψυγμούς — сушили (раскладывали) себе для сушки (ψυγμός — «сушка»)."
  33: "τὰ κρέα ἔτι ἦν ἐν τοῖς ὀδοῦσιν αὐτῶν — мясо ещё было в зубах их. πρὶν ἢ ἐκλείπειν — прежде нежели исчезнуть (ἐκλείπω — «оскудевать»). ἐθυμώθη εἰς τὸν λαόν — воспламенился на народ. ἐπάταξεν … πληγὴν μεγάλην σφόδρα — поразил … язвою великою весьма (πληγή — 災い)."
  34: "Μνήματα τῆς ἐπιθυμίας — «гробы похоти» (μνῆμα — «могила», ἐπιθυμία — «похоть, желание»). ἐκεῖ ἔθαψαν — там похоронили (θάπτω). τὸν λαὸν τὸν ἐπιθυμητήν — народ похотливый (ἐπιθυμητής — «алчущий»)."
  35: "Ἀπὸ Μνημάτων ἐπιθυμίας ἐξῆρεν — от «гробов похоти» выступил. εἰς Ασηρωθ — в Асироф. ἐγένετο ὁ λαὸς ἐν Ασηρωθ — народ был (остановился) в Асирофе."
