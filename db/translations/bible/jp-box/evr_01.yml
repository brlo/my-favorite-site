# jp-box, Послание к Евреям, глава 1. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 1: Бог говорил в Сыне (1–2); Сын — сияние славы и образ ипостаси,
# очищение грехов и седение одесную (3), превосходство над ангелами (4);
# затем цепь Писания: Пс 2:7; 2 Цар 7:14 (5), Втор 32:43 (6), Пс 104:4 (7),
# Пс 45:6–7 (8–9), Пс 102:25–27 (10–12), Пс 110:1 (13); служение ангелов (14).
# Красного и синего нет: слова Отца к Сыну и цитаты Писания не красные.
# 〔…〕: 1:3 — церковные δι' ἑαυτοῦ и ἡμῶν (в базе слов нет, проверено запросом
# к gr-lxx-byz); оба стоят в одних скобках. Цитаты Писания — в 「…」.
# Сносок ⟨…⟩ в главе нет: 天使, 御子, 嗣業 уже встречались в корпусе. jp-ni не использовался.

tr_code: jp-box
book: evr
chapter: 1
draft: true

verses:
  1: "神[かみ]は、昔[むかし]、預言者[よげんしゃ]たちによって先祖[せんぞ]たちに、さまざまな形[かたち]で、さまざまな方法[ほうほう]で語[かた]られたが、"
  2: "この末[すえ]の日[ひ]々[び]に、御子[みこ]によってわたしたちに語[かた]られた。神[かみ]は、御子[みこ]をすべてのものの嗣業[しぎょう]を継[つ]ぐ者[もの]として立[た]て、また、御子[みこ]によって、もろもろの世[よ]を造[つく]られたのである。"
  3: "御子[みこ]は、神[かみ]の栄光[えいこう]の輝[かがや]きであり、神[かみ]の本体[ほんたい]の刻印[こくいん]であり、力[ちから]ある御言葉[みことば]によってすべてのものを支[ささ]えておられる。そして、〔ご自身[じしん]によってわたしたちの〕罪[つみ]の清[きよ]めを成[な]し遂[と]げて、高[たか]い所[ところ]で、大[おお]いなる威光[いこう]の右[みぎ]の座[ざ]に着[つ]かれた。"
  4: "御子[みこ]は、天使[てんし]たちよりも、はるかに優[すぐ]れた御名[みな]を嗣[つ]がれたので、その分[ぶん]だけ、天使[てんし]たちよりも高[たか]い者[もの]となられた。"
  5: "いったい、神[かみ]はこれまで、どの天使[てんし]に、「あなたはわたしの子[こ]である。わたしは今日[きょう]、あなたを生[う]んだ」と言[い]われたことがあるだろうか。また、「わたしは彼[かれ]の父[ちち]となり、彼[かれ]はわたしの子[こ]となる」と言[い]われたことがあるだろうか。"
  6: "さらに、神[かみ]が長子[ちょうし]を世[よ]に導[みちび]き入[い]れられるとき、こう言[い]われる。「神[かみ]の天使[てんし]たちは、すべてこの方[かた]を礼拝[れいはい]するように」と。"
  7: "また、天使[てんし]たちについては、こう言[い]われる。「神[かみ]は、ご自身[じしん]の天使[てんし]たちを風[かぜ]とし、ご自身[じしん]の仕[つか]える者[もの]たちを炎[ほのお]とする」と。"
  8: "しかし、御子[みこ]については、こう言[い]われる。「神[かみ]よ、あなたの御座[みくら]は世々[よよ]に限[かぎ]りなく続[つづ]く。正[ただ]しさの杖[つえ]は、あなたの国[くに]の杖[つえ]である」と。"
  9: "あなたは義[ぎ]を愛[あい]し、不法[ふほう]を憎[にく]んだ。それゆえ、神[かみ]、あなたの神[かみ]は、あなたの仲間[なかま]たちにまさって、あなたに喜[よろこ]びの油[あぶら]を注[そそ]がれた。"
  10: "また、「主[しゅ]よ、あなたは初[はじ]めに地[ち]を据[す]えられた。天[てん]は、あなたの手[て]の業[わざ]である。"
  11: "それらは滅[ほろ]びるが、あなたはいつまでも変[か]わらずにおられる。それらはすべて、衣[ころも]のように古[ふる]びる。"
  12: "あなたはそれらを衣[ころも]のように巻[ま]き、それらは取[と]り替[か]えられる。しかし、あなたは同[おな]じ方[かた]でおられ、あなたの年[とし]は尽[つ]きることがない」と。"
  13: "また、神[かみ]はこれまで、どの天使[てんし]に、「わたしがあなたの敵[てき]たちをあなたの足[あし]の台[だい]とするまで、わたしの右[みぎ]に座[すわ]っていなさい」と言[い]われたことがあるだろうか。"
  14: "天使[てんし]たちはみな、救[すく]いを嗣[つ]ぐ者[もの]たちのための務[つと]めに遣[つか]わされる、仕[つか]える霊[れい]ではないか。"

notes:
  1: "Πολυμερῶς καὶ πολυτρόπως — «многими частями и многими способами»; さまざまな形で、さまざまな方法で (ср. jp-joc 屢多方を以て; Синодальный «многократно и многообразно»). πατράσιν — 先祖たち. ἐν τοῖς προφήταις — 預言者たちによって (орудие)."
  2: "ἐπ' ἐσχάτου τῶν ἡμερῶν τούτων — この末の日々に. ἐν υἱῷ — 御子によって, без артикля: «в Сыне», не «в одном из сынов». ὃν ἔθηκεν κληρονόμον πάντων — すべてのものの嗣業を継ぐ者として立てられ. δι' οὗ καὶ ἐποίησεν τοὺς αἰῶνας — もろもろの世を造られた (αἰῶνες — «веки», совокупность веков)."
  3: "ἀπαύγασμα — 輝き (сияние, отблеск); χαρακτήρ — 刻印 (точный оттиск, образ); ὑπόστασις — 本体. φέρων — 支えておられる (держа). ῥῆμα τῆς δυνάμεως — 力ある御言葉. В базе нет δι' ἑαυτοῦ и ἡμῶν; церковный текст (Елизаветинская «Собою… грехов наших», Синодальный, jp-joc 己を以て…我等の罪) их имеет — 〔ご自身によってわたしたちの〕. ἐκάθισεν ἐν δεξιᾷ τῆς μεγαλωσύνης — 大いなる威光の右の座に着かれた."
  4: "τοσούτῳ κρείττων… ὅσῳ — その分だけ…それだけ. διαφορώτερον ὄνομα — はるかに優れた御名. κεκληρονόμηκεν — 嗣がれた (perfect). ὄνομα — 御名[みな] (в корпусе так; ср. задание «み名»)."
  5: "Цитата Пс 2:7 (Υἱός μου εἶ σύ…) и 2 Цар 7:14 (Ἐγὼ ἔσομαι αὐτῷ εἰς πατέρα…). γεγέννηκα — 生んだ (perfect: «Я родил», не «рождаю»). Вопрос риторический: τίνι… εἶπέν ποτε."
  6: "Цитата Втор 32:43 (в LXX: καὶ προσκυνησάτωσαν αὐτῷ πάντες υἱοὶ θεοῦ; здесь ἄγγελοι — так в Евр 1:6). πρωτότοκος — 長子; εἰσαγάγῃ — 導き入れられるとき. προσκυνησάτωσαν — 礼拝するように (3-е лицо повеления, не обращение)."
  7: "Цитата Пс 104:4. πνεύματα здесь — 風 (ветры), не «духи»: параллель πυρὸς φλόγα. λειτουργοί — 仕える者たち."
  8: "Цитата Пс 45:6–7. ὁ θρόνος σου ὁ θεός — 神よ、あなたの御座は: звательный ὁ θεός обращён к Сыну (так в Евр; ср. jp-joc 神よ). εἰς τὸν αἰῶνα τοῦ αἰῶνος — 世々に限りなく. ῥάβδος τῆς εὐθύτητος — 正しさの杖."
  9: "Продолжение Пс 45:7. ἠγάπησας… ἐμίσησας — 愛し…憎んだ. ἔλαιον ἀγαλλιάσεως — 喜びの油. παρὰ τοὺς μετόχους — 仲間たちにまさって (μέτοχοι — «участники»; ср. 3:1,14)."
  10: "Цитата Пс 102:25–27. ἐθεμελίωσας — 据えられた (основал). ἔργα τῶν χειρῶν σού — あなたの手の業."
  11: "Продолжение Пс 102. ἀπολοῦνται — 滅びる; διαμένεις — いつまでもお変わりにならない (пребываешь). ἱμάτιον — 衣."
  12: "ἑλίξεις — 巻き; ἀλλαγήσονται — 取り替えられる. σὺ δὲ ὁ αὐτός — 同じ方でおられ (ср. Евр 13:8). τὰ ἔτη σου οὐκ ἐκλείψουσιν — あなたの年は尽きることがない."
  13: "Цитата Пс 110:1. κάθου ἐκ δεξιῶν μου — わたしの右に座っていなさい. ἕως ἂν θῶ — とするまで. ὑποπόδιον τῶν ποδῶν — 足の台."
  14: "οὐχὶ πάντες…; — риторический вопрос с ожиданием «да». λειτουργικὰ πνεύματα — 仕える霊; εἰς διακονίαν ἀποστελλόμενα — 務めに遣わされる. κληρονομεῖν σωτηρίαν — 救いを嗣ぐ."
