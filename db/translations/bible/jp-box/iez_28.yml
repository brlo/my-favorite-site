# jp-box, Иезекииль, глава 28. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 28 (совпадает; см. карту 20/21).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: три слова. 1–10 — о князе Тирском: «я бог, сижу на седалище божием
# в сердце морей», мнимая мудрость (Даниил), богатство от торговли, гибель
# от иноземцев; 11–19 — плач о царе Тирском: «ты печать подобия и венец красоты»,
# Едем и драгоценные камни, херувим на святой горе, «непорочен… доколе не нашлось
# беззакония», изгнание, огонь из среды, пепел; 20–26 — о Сидоне и восстановлении
# дома Израилева.
# Голоса: 1 — формула вне кавычек; 2–10 — слово Господа в 「…」, в 2 и 9 слова
# князя (『わたしは神である』) в 『…』; 11 — формула; 12–19 — слово Господа в 「…」
# (плач о царе, произносимый пророком); 20 — формула; 21–26 — слово Господа в 「…»
# (формула «так говорит Господь» в 25 внутри речи).
# «Точка»: в этой главе нет.
# Имена и термины: ツロ, シドン, ダニエル, ヤコブ, イスラエル; 君[きみ] — ἄρχων (28:2),
# 王[おう] — βασιλεύς (28:12, как в слав./Синодальном «царь Тирский»); ケルビム — χερουβ;
# 似[に]姿[すがた]の印[しるし] — ἀποσφράγισμα ὁμοιώσεως (28:12); 火[ひ]の石[いし] — λίθοι πύρινοι.
