verses:
  1: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  2: "「人[ひと]の子[こ]よ、ツロの君[きみ]に言[い]え。主[しゅ]なる神[かみ]はこう言[い]われる。あなたの心[こころ]が高[たか]ぶり、あなたは言[い]った。『わたしは神[かみ]である。わたしは海[うみ]の真[ま]ん中[なか]で神[かみ]の住[す]まいに住[す]んでいる』と。あなたは人[ひと]であって神[かみ]ではなく、あなたの心[こころ]を神[かみ]の心[こころ]のようにした。"
  3: "見[み]よ、あなたはダニエルよりも賢[かしこ]いのか。知[ち]恵[え]ある者[もの]たちが、その知識[ちしき]によってあなたを教[おし]えなかったとでもいうのか。"
  4: "あなたは自分[じぶん]の知識[ちしき]によって、また自分[じぶん]の思慮[しりょ]によって、自分[じぶん]のために力[ちから]を造[つく]り、自分の宝[たから]の倉[くら]に銀[ぎん]と金[きん]を蓄[たくわ]えたのか。"
  5: "あなたは大[おお]きな知識[ちしき]と商[あきな]いとによって力[ちから]を増[ふ]やし、その力[ちから]によって心[こころ]が高[たか]ぶった。"
  6: "それゆえ、主[しゅ]なる神[かみ]はこう言[い]われる。あなたが自分[じぶん]の心[こころ]を神[かみ]の心[こころ]のようにしたから、"
  7: "それに代[か]えて、見[み]よ、わたしはあなたの上[うえ]に、諸国民[しょこくみん]から来[く]る見知[みし]らぬ滅[ほろ]ぼす者[もの]たちを連[つ]れて来[く]る。彼らはその剣[つるぎ]を抜[ぬ]いて、あなたの知識[ちしき]の美[うつく]しさに向[む]け、あなたの美[うつく]しさを滅[ほろ]びのために地[ち]に散[ち]らす。"
  8: "彼らはあなたを下[くだ]らし、あなたは海[うみ]の真[ま]ん中[なか]で、傷[きず]ついた者[もの]の死[し]に死[し]ぬ。"
  9: "あなたを殺[ころ]す者[もの]たちの前[まえ]で、あなたは『わたしは神[かみ]である』と言[い]うのか。あなたは殺[ころ]す者[もの]の手[て]のうちで、人[ひと]であって神[かみ]ではない。"
  10: "あなたは異邦[いほう]人[じん]の手[て]のうちで、無割礼[むかつれい]の者[もの]の死[し]に死[し]ぬ。主[しゅ]が語[かた]ったからである、と主[しゅ]なる神[かみ]は言[い]われる。」"
  11: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  12: "「人[ひと]の子[こ]よ、ツロの王[おう]について泣[な]き歌[うた]を唱[とな]え、彼に言[い]え。主[しゅ]なる神[かみ]はこう言[い]われる。あなたは似[に]姿[すがた]の印[しるし]、知恵[ちえ]に満[み]ち、美[うつく]しさの冠[かんむり]である。"
  13: "あなたは神[かみ]の楽園[らくえん]の快[こころよ]さのうちにいた。あなたはあらゆる良[よ]い石[いし]で飾[かざ]られた。サルディオス、トパズ、エメラルド、紅玉[こうぎょく]、サファイア、碧玉[へきぎょく]、銀[ぎん]、金[きん]、リグリオン、瑪瑙[めのう]、紫水晶[むらさきずいしょう]、黄玉[きぎょく]、ベリル、オニキスである。あなたが造[つく]られた日[ひ]から、あなたは金[きん]で自分の宝[たから]の倉[くら]と蓄[たくわ]えを自分のうちに満[み]たした。"
  14: "あなたはケルビムとともに、神[かみ]の聖[せい]なる山[やま]に置[お]かれ、火[ひ]の石[いし]の間[あいだ]を歩[ある]んだ。"
  15: "あなたは自分[じぶん]が造[つく]られた日[ひ]から、あなたの日[ひ]々[び]のうちで、咎[とが]があなたのうちに見[み]いだされるまで、非[きず]のない者[もの]であった。"
  16: "あなたの商[あきな]いの多[おお]さによって、あなたの内[うち]は不法[ふほう]で満[み]ち、あなたは罪[つみ]を犯[おか]した。あなたは神[かみ]の山[やま]から傷[きず]つけられ、あなたを覆[おお]うケルビムが、火[ひ]の石[いし]の間[あいだ]からあなたを連[つ]れ去[さ]った。"
  17: "あなたの美[うつく]しさのゆえに心[こころ]が高[たか]ぶり、あなたの美[うつく]しさとともに知識[ちしき]が損[そこ]なわれた。わたしはあなたを地[ち]に投[な]げ、王[おう]たちの前[まえ]にさらした。"
  18: "あなたの罪[つみ]の多[おお]さと、あなたの商[あきな]いの不正[ふせい]のゆえに、あなたは自分の聖所[せいしょ]を汚[けが]した。わたしはあなたの真[ま]ん中[なか]から火[ひ]を出[だ]し、それがあなたを食[く]い尽[つ]くす。わたしはあなたを、すべて見[み]る者[もの]の前[まえ]で地[ち]の上の灰[はい]とする。"
  19: "諸国民[しょこくみん]のうちであなたを知[し]る者[もの]たちはみな、あなたについて驚[おどろ]く。あなたは滅[ほろ]びとなり、永遠[えいえん]にいなくなる。」"
  20: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  21: "「人[ひと]の子[こ]よ、顔[かお]をシドンに向[む]け、これに向[む]かって預言[よげん]せよ。"
  22: "そう言[い]え。主[しゅ]なる神[かみ]はこう言[い]われる。見[み]よ、わたしはあなたに対[たい]する、シドンよ。わたしはあなたのうちで栄光[えいこう]を受[う]け、あなたのうちにさばきを行[おこな]い、あなたのうちで聖[せい]なる者[もの]とされる時[とき]、彼らはわたしが主[しゅ]であることを知[し]る。"
  23: "わたしはあなたに死[し]を送[おく]る。あなたの広[ひろ]い通[とお]りに血[ち]がある。あなたの真[ま]ん中[なか]で、あなたの周[まわ]りで、剣[つるぎ]によって傷[きず]つけられた者[もの]たちが倒[たお]れる。彼らはわたしが主[しゅ]であることを知[し]る。"
  24: "周[まわ]りのすべての者[もの]たちのうち、イスラエルの家[いえ]を苦[にが]く刺[さ]す茨[いばら]も、痛[いた]く刺[さ]す棘[とげ]も、もはやない。彼らはイスラエルを卑[ひく]しめた者[もの]たちである。彼らはわたしが主[しゅ]なる神[かみ]であることを知[し]る。"
  25: "主[しゅ]なる神[かみ]はこう言[い]われる。わたしがイスラエルの家[いえ]を、彼らが散[ち]らされた諸国民[しょこくみん]の間[あいだ]から集[あつ]め、彼らのうちで、もろもろの民[たみ]と国民[こくみん]の前[まえ]に聖[せい]なる者[もの]とされる時[とき]、彼らはわたしがしもべヤコブに与[あた]えた自分[じぶん]たちの地[ち]に住[す]む。"
  26: "彼らはその上[うえ]に望[のぞ]みをもって住[す]み、家[いえ]を建[た]て、ぶどう畑[ばたけ]を植[う]え、望[のぞ]みをもって住[す]む。わたしが、彼らの周[まわ]りのすべての者[もの]たちのうちで彼らを卑[ひく]しめた者[もの]たちにさばきを行[おこな]う時[とき]である。彼らは、わたしが彼らの主[しゅ]なる神[かみ]、彼らの父[ちち]たちの神[かみ]であることを知[し]る。」"

notes:
  1: "Καὶ ἐγένετο λόγος κυρίου πρός με λέγων — формула вне кавычек, как в 1:3; 3:16 и далее."
  2: "εἰπὸν τῷ ἄρχοντι Τύρου — «скажи князю (ἄρχων) Тира» (君[きみ]; в 28:12 тот же назван βασιλεύς — 王[おう], как в слав. и Синодальном). ἀνθ᾽ ὧν ὑψώθη σου ἡ καρδία — «за то, что вознеслось сердце твоё»; Θεός εἰμι ἐγώ — «я Бог»: слова князя в 『…』; κατοικίαν θεοῦ κατῴκηκα ἐν καρδίᾳ θαλάσσης — «в жилище Божием поселился я в сердце моря» (κατοικία — жилище); σὺ δὲ εἶ ἄνθρωπος καὶ οὐ θεός — «ты же человек, а не бог»; ἔδωκας τὴν καρδίαν σου ὡς καρδίαν θεοῦ — «дал сердце твоё как сердце Божие». τάδε λέγει κύριος — слав. «адонаи Господь» (主[しゅ]なる神[かみ])."
  3: "μὴ σοφώτερος εἶ σὺ τοῦ Δανιηλ — «разве ты мудрее Даниила?» (ダニエル — форма корпуса): ирония, ср. Дан 2; 5. σοφοὶ οὐκ ἐπαίδευσάν σε τῇ ἐπιστήμῃ αὐτῶν — «разве мудрецы не научили тебя знанием их?» (ἐπιστήμη — знание, 知識[ちしき]); в Синодальном «нет тайны, сокрытой от тебя» (МТ) — иное чтение, не внесено."
  4: "μὴ ἐν τῇ ἐπιστήμῃ σου ἢ ἐν τῇ φρονήσει σου — «разве в знании твоём или в разуме твоём» (φρόνησις — 思慮[しりょ], слав. «смысл»); ἐποίησας σεαυτῷ δύναμιν — «сделал ты себе силу»; χρυσίον καὶ ἀργύριον ἐν τοῖς θησαυροῖς σου — «золото и серебро в сокровищницах твоих» (θησαυρός — 宝[たから]の倉[くら])."
  5: "ἐν τῇ πολλῇ ἐπιστήμῃ σου καὶ ἐμπορίᾳ σου — «в многом знании твоём и торговле твоей» (ἐμπορία — 商[あきな]い); ἐπλήθυνας δύναμίν σου — «умножил силу твою»; ὑψώθη ἡ καρδία σου ἐν τῇ δυνάμει σου — «вознеслось сердце твоё в силе твоей»."
  6: "διὰ τοῦτο τάδε λέγει κύριος — «посему так говорит Господь» (слав. «адонаи Господь»); Ἐπειδὴ δέδωκας τὴν καρδίαν σου ὡς καρδίαν θεοῦ — «так как ты дал сердце твоё как сердце Божие». Предложение продолжается в 7-м стихе."
  7: "ἐπάγω ἐπὶ σὲ ἀλλοτρίους λοιμοὺς ἀπὸ ἐθνῶν — «наведу на тебя чужих губителей из народов» (λοιμός — чума, губитель; слав. «чуждыя губители»); ἐκκενώσουσιν τὰς μαχαίρας αὐτῶν ἐπὶ σέ — «обнажат (букв. опорожнят) мечи свои на тебя»; ἐπὶ τὸ κάλλος τῆς ἐπιστήμης σου — «на красоту знания твоего»; στρώσουσιν τὸ κάλλος σου εἰς ἀπώλειαν — «повергнут (букв. постелют) красоту твою в погибель»."
  8: "καταβιβάσουσίν σε — «низведут тебя»; ἀποθανῇ θανάτῳ τραυματιῶν — «умрёшь смертью раненых» (cognatus, 傷[きず]ついた者[もの]の死[し]に死[し]ぬ); ἐν καρδίᾳ θαλάσσης — формула «в сердце моря» (海[うみ]の真[ま]ん中[なか])."
  9: "Греч. текст стиха обрывается на ἐν πλήθει («во множестве…»); окончание («в руке убивающих тебя») есть в слав. — «в руце убивающих тя» — и внесено в основной текст без 〔…〕. μὴ λέγων ἐρεῖς Θεός εἰμι ἐγώ — «скажешь ли, говоря: я Бог?» (слова князя — 『…』); ἐνώπιον τῶν ἀναιρούντων σε — «пред убивающими тебя»; σὺ δὲ εἶ ἄνθρωπος καὶ οὐ θεός — «ты же человек, а не бог»."
  10: "ἀπεριτμήτων ἀπολῇ — «погибнешь [смертью] необрезанных» (ἀπερίτμητος); ἐν χερσὶν ἀλλοτρίων — «в руках чужих»; ὅτι ἐγὼ ἐλάλησα, λέγει κύριος — «ибо Я сказал, говорит Господь». Здесь слово Господа о князе закрывается."
  11: "Καὶ ἐγένετο λόγος κυρίου πρός με λέγων — формула вне кавычек; начинает новое слово (плач о царе)."
  12: "λαβὲ θρῆνον ἐπὶ τὸν ἄρχοντα Τύρου — «возьми плач о князе Тира»; слав./Синодальный называют его «царь Тирский» — βασιλεύς (в тексте 王[おう]). Σὺ ἀποσφράγισμα ὁμοιώσεως καὶ στέφανος κάλλους — «ты отпечаток (печать) подобия и венец красоты»: ἀποσφράγισμα — оттиск печати (似[に]姿[すがた]の印[しるし]); в Синодальном «печать совершенства» — по МТ (חוֹתֵם תָּכְנִית), не внесено. Слав. добавляет «исполнен премудрости» (知恵[ちえ]に満[み]ち) — нет в LXX, внесено без 〔…〕."
  13: "ἐν τῇ τρυφῇ τοῦ παραδείσου τοῦ θεοῦ — «в неге (сладости) рая Божия» (τρυφή — 快[こころよ]さ, слав. «сладость»); πᾶν λίθον χρηστὸν ἐνδέδεσαι — «всяким хорошим камнем ты обложен (убран)» (ἐνδέω — вдевать, оправлять); далее список: σάρδιον, τοπάζιον, σμάραγδος, ἄνθραξ (紅玉[こうぎょく], «карбункул»), σάπφειρος, ἴασπις, ἀργύριον, χρυσίον, λιγύριον (リグリオン — тёмное слово, «лигурий»), ἀχάτης, ἀμέθυστος, χρυσόλιθος, βηρύλλιον, ὀνύχιον. χρυσίου ἐνέπλησας τοὺς θησαυρούς σου καὶ τὰς ἀποθήκας σου — «золотом наполнил сокровищницы твои и хранилища твои» (слав. добавляет «и житницы твоя»). ἀφ᾽ ἧς ἡμέρας ἐκτίσθης σύ — «с того дня, как ты был создан»."
  14: "μετὰ τοῦ χερουβ ἔθηκά σε ἐν ὄρει ἁγίῳ θεοῦ — «с херувимом поставил Я тебя на святой горе Божией» (ケルビム, как в корпусе); ἐγενήθης ἐν μέσῳ λίθων πυρίνων — «ты был среди камней огненных» (火[ひ]の石[いし]). В Синодальном «помазанным херувимом» (МТ), в LXX и слав. — просто «с херувимом»."
  15: "ἐγενήθης ἄμωμος σὺ ἐν ταῖς ἡμέραις σου — «ты был непорочен в дни твои» (ἄμωμος — непорочный, 非[きず]のない者[もの]); ἀφ᾽ ἧς ἡμέρας σὺ ἐκτίσθης — «с того дня, как ты был создан»; ἕως εὑρέθη τὰ ἀδικήματα ἐν σοί — «доколе не нашлись беззакония в тебе» (ἀδίκημα — 咎[とが])."
  16: "ἀπὸ πλήθους τῆς ἐμπορίας σου — «от множества торговли твоей»; ἔπλησας τὰ ταμίειά σου ἀνομίας — «наполнил хранилища твои беззаконием» (ταμίειον — сокровищница; ἀνομία — 不法[ふほう]); ἥμαρτες — «согрешил»; ἐτραυματίσθης ἀπὸ ὄρους τοῦ θεοῦ — «уязвлён (поражён) с горы Божией»; ἤγαγέν σε τὸ χερουβ ἐκ μέσου λίθων πυρίνων — «извёл тебя херувим из среды камней огненных». Слав. добавляет «осеняяй» (覆[おお]う) при херувиме — нет в LXX, внесено без 〔…〕."
  17: "ὑψώθη ἡ καρδία σου ἐπὶ τῷ κάλλει σου — «вознеслось сердце твоё из-за красоты твоей»; διεφθάρη ἡ ἐπιστήμη σου μετὰ τοῦ κάλλους σου — «повредилось (растлилось) знание твоё вместе с красотой твоей» (διαφθείρω — растлевать); ἐπὶ τὴν γῆν ἔρριψά σε — «на землю поверг Я тебя»; ἐναντίον βασιλέων ἔδωκά σε παραδειγματισθῆναι — «пред царями дал тебя на позор (в пример)» (παραδειγματίζω — выставлять на позор)."
  18: "διὰ τὸ πλῆθος τῶν ἁμαρτιῶν σου καὶ τῶν ἀδικιῶν τῆς ἐμπορίας σου — «за множество грехов твоих и неправд торговли твоей»; ἐβεβήλωσας τὰ ἱερά σου — «осквернил святыни твои» (βεβηλόω; 聖所[せいしょ]); ἐξάξω πῦρ ἐκ μέσου σου, τοῦτο καταφάγεταί σε — «изведу огонь из среды твоей, он пожрёт тебя»; δώσω σε εἰς σποδόν — «дам тебя в пепел» (σποδός — 灰[はい])."
  19: "πάντες οἱ ἐπιστάμενοί σε ἐν τοῖς ἔθνεσιν — «все знающие тебя среди народов»; στυγνάσουσιν ἐπὶ σέ — «поникнут (ужаснутся) о тебе» (στυγνάζω); ἀπώλεια ἐγένου — «погибелью ты стал»; οὐχ ὑπάρξεις ἔτι εἰς τὸν αἰῶνα — «не будешь более в век». Здесь плач и слово Господа закрываются."
  20: "Καὶ ἐγένετο λόγος κυρίου πρός με λέγων — формула вне кавычек; начинает слово о Сидоне."
  21: "στήρισον τὸ πρόσωπόν σου ἐπὶ Σιδῶνα — «утверди лицо твоё на Сидон» (シドン); προφήτευσον ἐπ᾽ αὐτήν — «пророчествуй на него» (греч. ж. р., по городу)."
  22: "Τάδε λέγει κύριος Ἰδοὺ ἐγὼ ἐπὶ σέ, Σιδών — «так говорит Господь: вот, Я — на тебя, Сидон»; ἐνδοξασθήσομαι ἐν σοί — «прославлюсь в тебе»; ἐν τῷ ποιῆσαί με ἐν σοὶ κρίματα — «когда сотворю в тебе суды» (κρίμα — さばき); ἁγιασθήσομαι ἐν σοί — «освящусь (явлю святость) в тебе» (ἁγιάζω — 聖[せい]なる者[もの]とする)."
  23: "αἷμα καὶ θάνατος ἐν ταῖς πλατείαις σου — «кровь и смерть на улицах твоих»; πεσοῦνται τετραυματισμένοι ἐν μαχαίραις — «падут уязвлённые мечами» (τετραυματισμένοι — израненные); περικύκλῳ σου — «вокруг тебя». Слав. добавляет в начале «послю на тя смерть» (わたしはあなたに死[し]を送[おく]る) — нет в LXX, внесено без 〔…〕."
  24: "σκόλοψ πικρίας καὶ ἄκανθα ὀδύνης — «колючка горечи и терн боли» (σκόλοψ — шип, ср. 2 Кор 12:7; ἄκανθα — 棘[とげ]); ἀπὸ πάντων τῶν περικύκλῳ αὐτῶν τῶν ἀτιμασάντων αὐτούς — «от всех окрестных их, обесчестивших их» (ἀτιμάζω — 卑[ひく]しめる); γνώσονται ὅτι ἐγώ εἰμι κύριος — слав. «адонаи Господь» (主[しゅ]なる神[かみ])."
  25: "τάδε λέγει κύριος κύριος — «так говорит Господь Бог» (слав. «адонаи Господь»); συνάξω τὸν Ισραηλ ἐκ τῶν ἐθνῶν, οὗ διεσκορπίσθησαν ἐκεῖ — «соберу Израиля из народов, где они рассеялись там» (διασκορπίζω — рассеивать); ἁγιασθήσομαι ἐν αὐτοῖς ἐνώπιον τῶν λαῶν — «освящусь в них пред народами»; ἣν δέδωκα τῷ δούλῳ μου Ιακωβ — «которую дал рабу Моему Иакову» (しもべヤコブ)."
  26: "κατοικήσουσιν ἐπ᾽ αὐτῆς ἐν ἐλπίδι — «будут жить на ней в надежде (безопасно)» (ἐλπίς — 望[のぞ]み); οἰκοδομήσουσιν οἰκίας καὶ φυτεύσουσιν ἀμπελῶνας — «построят домы и насадят виноградники» (ぶどう畑[ばたけ]); ὅταν ποιήσω κρίμα ἐν πᾶσιν τοῖς ἀτιμάσασιν αὐτοὺς ἐν τοῖς κύκλῳ αὐτῶν — «когда сотворю суд над всеми обесчестившими их в окрестностях их»; ὁ θεὸς αὐτῶν καὶ ὁ θεὸς τῶν πατέρων αὐτῶν — «Бог их и Бог отцов их» (父[ちち]たちの神[かみ])."
