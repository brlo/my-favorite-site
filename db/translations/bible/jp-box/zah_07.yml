# jp-box, Захария, глава 7. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной (совпадает с gr: 14 стихов).
# Язык — современный 常体; 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1–3 дата (4-й год Дария, 4-й день 9-го месяца Хаслева), посольство
# в Вефиль спросить священников и пророков о посте пятого месяца; 4–7 ответ Господа:
# «для Меня ли вы постились?», ели и пили для себя, слова прежних пророков;
# 8–14 слово Господне: суд, милость, вдовы, сироты, пришельцы, бедные; отцы не слушали,
# окаменили сердце, за то гнев и рассеяние, земля запустела.
# Голоса: 1–2 рассказ; 3 вопрос посланных в 「…»; 4 формула; 5–7 слово Господа
# в 「…»; 8 формула; 9–14 слово Господа в 「…» («так говорил тогда» — внутри).
# Термины: 断食[だんじき] — νηστεία; 万軍[ばんぐん]の主[しゅ] — κύριος παντοκράτωρ;
# 裁[さば]き — κρίμα; 憐[あわ]れみ — ἔλεος; 慈[いつく]しみ — οἰκτιρμός.
#
tr_code: jp-box
book: zah
chapter: 7
draft: true

verses:
  1: "ダリウス王[おう]の第四年[だいよねん]、第九[だいきゅう]の月[つき]、すなわちキスレウの月[つき]の四日[よっか]に、主[しゅ]の言葉[ことば]がゼカリヤに臨[のぞ]んだ。"
  2: "王[おう]はベテルへ、サラサルとアルベセエル、およびその家[け]の者[もの]たちを遣[つか]わし、主[しゅ]の怒[いか]りをなだめさせようとした。"
  3: "そして、万軍[ばんぐん]の主[しゅ]の家[いえ]にいる祭司[さいし]たちと預言者[よげんしゃ]たちに尋[たず]ねさせた。「第五[だいご]の月[つき]の聖[せい]なる務[つと]めは、もうここに来[き]ているのでしょうか。わたしはもう長[なが]い年[とし]の間[あいだ]、泣[な]き、断食[だんじき]してきたのですが。」"
  4: "万軍[ばんぐん]の主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  5: "「この地[ち]のすべての民[たみ]と祭司[さいし]たちに言[い]え。あなたがたが第五[だいご]の月[つき]と第七[だいしち]の月[つき]に断食[だんじき]し、泣[な]いたのは、この七十年[ななじゅうねん]の間[あいだ]、わたしのために断食[だんじき]したのか。わたしのためであったのか。"
  6: "あなたがたが食[た]べ、飲[の]むとき、自分[じぶん]のために食[た]べ、自分[じぶん]のために飲[の]んでいるのではないか。"
  7: "これらは、かつての預言者[よげんしゃ]たちの手[て]によって主[しゅ]が語[かた]られた言葉[ことば]ではないか。そのとき、エルサレムは人[ひと]が住[す]み、栄[さか]えており、その周[まわ]りの町[まち]々[まち]、高地[こうち]と低地[ていち]も住[す]まれていた。」"
  8: "主[しゅ]の言葉[ことば]がゼカリヤに臨[のぞ]んで言[い]った。"
  9: "「万軍[ばんぐん]の主[しゅ]はこう言[い]われた。正[ただ]しい裁[さば]きをし、互[たが]いに憐[あわ]れみと慈[いつく]しみを行[おこな]え。"
  10: "やもめと孤児[こじ]と寄留[きりゅう]の者[もの]と貧[まず]しい者[もの]を虐[しいた]げてはならない。互[たが]いに心[こころ]のうちで悪[わる]を思[おも]ってはならない。"
  11: "しかし、彼らは聞[き]こうとせず、背[そむ]いて行[い]き、聞[き]かないように耳[みみ]を重[おも]くした。"
  12: "また、律法[りっぽう]と、万軍[ばんぐん]の主[しゅ]がその霊[れい]によってかつての預言者[よげんしゃ]たちの手[て]によって送[おく]られた言葉[ことば]を聞[き]かないように、心[こころ]を固[かた]くした。それゆえ、万軍[ばんぐん]の主[しゅ]から大[おお]きな怒[いか]りが下[くだ]った。"
  13: "そして、主[しゅ]が語[かた]られたのに彼らが聞[き]かなかったように、彼らが呼[よ]んでもわたしは聞[き]かない、と万軍[ばんぐん]の主[しゅ]は言[い]われる。"
  14: "わたしは彼らを、彼らが知[し]らないすべての民[たみ]の間[あいだ]に吹[ふ]き散[ち]らした。その後[あと]、この地[ち]は荒[あ]れ果[は]てて、行[い]き来[き]する者[もの]もなくなった。彼らは麗[うるわ]しい地[ち]を荒[あ]れ地[ち]としたのである。」"

notes:
  1: "ἐν τῷ τετάρτῳ ἔτει ἐπὶ Δαρείου — «в четвертый год при Дарии»; τετράδι τοῦ μηνὸς τοῦ ἐνάτου, ὅς ἐστιν Χασελευ — «в четвертый день девятого месяца, Хаслева»; キスレウ — как в корпусе (Неемия)."
  2: "εἰς Βαιθηλ Σαρασαρ καὶ Αρβεσεερ ὁ βασιλεὺς καὶ οἱ ἄνδρες αὐτοῦ — тёмное место: «в Вефиль Сарасар и Арвесеер, царь и мужи его»; слав. так же; передано «王はベテルへ…遣わし». ἐξιλάσασθαι τὸν κύριον — «умилостивить Господа»."
  3: "Εἰσελήλυθεν ὧδε ἐν τῷ μηνὶ τῷ πέμπτῳ τὸ ἁγίασμα — тёмное: «вошло ли сюда в пятый месяц освящение» (слав. «святыня»); καθότι ἐποίησα ἤδη ἱκανὰ ἔτη — «как я делал уже довольно лет». В ru вопрос о плаче и посте (МТ) — смысл передан, но без масоретских добавлений."
  4: "ἐγένετο λόγος κυρίου τῶν δυνάμεων — «было слово Господа сил (Саваофа)»."
  5: "Ἐὰν νηστεύσητε ἢ κόψησθε — «если постились или плакали»; ἐν ταῖς πέμπταις ἢ ταῖς ἑβδόμαις — «в пятые или седьмые [месяцы]»; μὴ νηστείαν νενηστεύκατέ μοι — «постом ли постились Мне?»."
  6: "οὐχ ὑμεῖς ἔσθετε καὶ ὑμεῖς πίνετε — «не вы ли едите и пьёте?»."
  7: "οὐχ οὗτοι οἱ λόγοι — «не эти ли слова»; ἐν χερσὶν τῶν προφητῶν τῶν ἔμπροσθεν — «руками прежних пророков»; ἡ ὀρεινή… ἡ πεδινή — «нагорная… равнинная»."
  8: "ἐγένετο λόγος κυρίου πρὸς Ζαχαριαν — «было слово Господне к Захарии»."
  9: "Κρίμα δίκαιον κρίνατε — «суд праведный судите»; ἔλεος καὶ οἰκτιρμόν — «милость и щедроты»."
  10: "χήραν καὶ ὀρφανὸν καὶ προσήλυτον καὶ πένητα — «вдову, сироту, пришельца, бедного»; μὴ μνησικακείτω — «да не злопамятствует»."
  11: "ἠπείθησαν — «не покорились»; ἔδωκαν νῶτον παραφρονοῦντα — «дали плечи непокорные (безумные)»; τὰ ὦτα ἐβάρυναν — «уши отяготили»."
  12: "τὴν καρδίαν ἔταξαν ἀπειθῆ — «сердце поставили непокорным»; ἐν πνεύματι αὐτοῦ — «Духом Своим»; ὀργὴ μεγάλη — «гнев великий»."
  13: "ὃν τρόπον εἶπεν καὶ οὐκ εἰσήκουσαν — «как Он говорил, а они не слушали»; κεκράξονται καὶ οὐ μὴ εἰσακούσω — «воззовут, и не услышу»."
  14: "ἐκβαλῶ… εἰς πάντα τὰ ἔθνη — «извергну… во все народы»; γῆ ἐκλεκτή — «земля избранная (вожделенная)»; εἰς ἀφανισμόν — «в запустение»."
