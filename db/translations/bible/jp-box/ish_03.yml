# jp-box, Исход, глава 3. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — csl-ru и jp-joc (1901, PD; ст. 1–8).
# ru (с масоретского) — только для понимания, его чтения не вносим.
# Язык — современный 常体; речь Бога — в 「…」, вложенная речь — 『…』.
# Глава 3: горящий куст (1–6), призвание Моисея (7–12), имя Бога (13–15),
# поручение к старейшинам (16–17), слово к фараону (18), исход и добыча (19–22).
# Красного и синего нет: Бог говорит, но это не прямая речь Христа во плоти.
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено по базе). В 3:1 слав. и jp-joc
# добавляют «Божия» (гора Божия), но у LXX здесь только ὄρος Χωρηβ — добавку не вносим.
# 3:4 — по LXX Моисей отвечает Τί ἐστιν; («что?»), а не «вот я» (масоретский текст).
# 3:14 — ἐγώ εἰμι ὁ ὤν: «わたしはある者である»; ὁ ὢν ἀπέσταλκέν με: «『ある者』が…遣わした».
# Имя Яхве не транслитерируется: в LXX стоит κύριος, переводим 主[しゅ] (см. notes 3:14–15).
# Сноcок ⟨…⟩ нет: 柴 уже в корпусе (Деян 7:30), 長老, 奇跡, 犠牲 понятны.
# jp-ni не использовался.

tr_code: jp-box
book: ish
chapter: 3
draft: true

verses:
  1: "モーセは、しゅうとであるミディアンの祭司[さいし]エテロの羊[ひつじ]を飼[か]っていた。彼[かれ]は羊[ひつじ]を荒野[こうや]の奥[おく]まで追[お]って行[い]き、ホレブの山[やま]に来[き]た。"
  2: "主[しゅ]の天使[てんし]が、柴[しば]から出[で]る炎[ほのお]の中[なか]に彼[かれ]に現[あらわ]れた。彼[かれ]が見[み]ると、柴[しば]は火[ひ]で燃[も]えているのに、その柴[しば]は焼[や]けていなかった。"
  3: "モーセは言[い]った。「わたしは行[い]って、この大[おお]きな光景[こうけい]を見[み]よう。なぜ柴[しば]が焼[や]けないのか。」"
  4: "主[しゅ]は、彼[かれ]が近[ちか]づいて見[み]ようとしているのをご覧[らん]になると、柴[しば]の中[なか]から彼[かれ]を呼[よ]んで言[い]われた。「モーセよ、モーセよ。」彼[かれ]は言[い]った。「何[なん]でしょうか。」"
  5: "そして言[い]われた。「ここに近[ちか]づいてはならない。あなたの足[あし]から靴[くつ]を脱[ぬ]げ。あなたが立[た]っているこの場所[ばしょ]は聖[せい]なる地[ち]だからである。」"
  6: "また言[い]われた。「わたしはあなたの父[ちち]の神[かみ]、アブラハムの神[かみ]、イサクの神[かみ]、ヤコブの神[かみ]である。」モーセは顔[かお]を背[そむ]けた。神[かみ]を仰[あお]ぎ見[み]るのを畏[おそ]れたからである。"
  7: "主[しゅ]は言[い]われた。「わたしは、エジプトにいるわたしの民[たみ]の苦[くる]しみをよく見[み]、監督[かんとく]たちのゆえの彼[かれ]らの叫[さけ]びを聞[き]いた。わたしは彼[かれ]らの痛[いた]みを知[し]っている。"
  8: "そして、エジプト人[じん]の手[て]から彼[かれ]らを救[すく]い出[だ]し、この地[ち]から彼[かれ]らを導[みちび]き出[だ]して、良[よ]い広[ひろ]い地[ち]、乳[ちち]と蜜[みつ]の流[なが]れる地[ち]へ連[つ]れて行[い]こうとして降[くだ]った。すなわち、カナン人[じん]、ヘト人[じん]、アモリ人[じん]、ペリジ人[じん]、ギルガシ人[じん]、ヒビ人[じん]、エブス人[じん]の地[ち]である。"
  9: "見[み]よ、イスラエルの子[こ]らの叫[さけ]びがわたしに届[とど]いた。わたしは、エジプト人[じん]が彼[かれ]らを苦[くる]しめているその苦[くる]しみも見[み]た。"
  10: "さあ、行[い]け。わたしはあなたをファラオのところへ遣[つか]わす。あなたは、わたしの民[たみ]であるイスラエルの子[こ]らをエジプトから導[みちび]き出[だ]せ。」"
  11: "モーセは神[かみ]に言[い]った。「わたしが何者[なにもの]なので、ファラオのところへ行[い]き、イスラエルの子[こ]らをエジプトから導[みちび]き出[だ]すのでしょうか。」"
  12: "神[かみ]は言[い]われた。「わたしがあなたとともにいる。これが、わたしがあなたを遣[つか]わしたしるしである。あなたが民[たみ]をエジプトから導[みちび]き出[だ]したとき、あなたがたはこの山[やま]で神[かみ]に仕[つか]える。」"
  13: "モーセは神[かみ]に言[い]った。「わたしがイスラエルの子[こ]らのところへ行[い]き、『あなたがたの父[ちち]たちの神[かみ]がわたしをあなたがたへ遣[つか]わした』と言[い]うと、彼[かれ]らは『その名[な]は何[なに]か』と尋[たず]ねるでしょう。何[なん]と言[い]えばよいのでしょうか。」"
  14: "神[かみ]はモーセに言[い]われた。「わたしはある者[もの]である。」そして言[い]われた。「あなたはイスラエルの子[こ]らにこう言[い]いなさい。『ある者[もの]』がわたしをあなたがたへ遣[つか]わした、と。」"
  15: "神[かみ]はさらにモーセに言[い]われた。「あなたはイスラエルの子[こ]らにこう言[い]いなさい。『主[しゅ]、あなたがたの父[ちち]たちの神[かみ]、アブラハムの神[かみ]、イサクの神[かみ]、ヤコブの神[かみ]が、わたしをあなたがたへ遣[つか]わした』と。これが永遠[えいえん]にわたるわたしの名[な]、代々[だいだい]の記念[きねん]である。」"
  16: "「行[い]って、イスラエルの子[こ]らの長老[ちょうろう]たちを集[あつ]め、こう言[い]いなさい。『あなたがたの父[ちち]たちの神[かみ]、主[しゅ]、アブラハムの神[かみ]、イサクの神[かみ]、ヤコブの神[かみ]が、わたしに現[あらわ]れて言[い]われた。「わたしはあなたがたを顧[かえり]み、エジプトであなたがたに起[お]こったすべてのことを見[み]た。"
  17: "そして、わたしはあなたがたをエジプト人[じん]の苦[くる]しみから導[みちび]き上[あ]げ、カナン人[じん]、ヘト人[じん]、アモリ人[じん]、ペリジ人[じん]、ギルガシ人[じん]、ヒビ人[じん]、エブス人[じん]の地[ち]、乳[ちち]と蜜[みつ]の流[なが]れる地[ち]へ連[つ]れて行[い]く。」』"
  18: "彼[かれ]らはあなたの声[こえ]に聞[き]き従[したが]う。あなたはイスラエルの長老[ちょうろう]たちとともに、エジプトの王[おう]ファラオのところへ行[い]き、彼[かれ]に言[い]いなさい。『ヘブライ人[じん]の神[かみ]がわたしたちを呼[よ]ばれた。わたしたちは荒野[こうや]へ三日[みっか]の道[みち]のりを行[い]き、わたしたちの神[かみ]に犠牲[ぎせい]を献[ささ]げましょう。』"
  19: "わたしは知[し]っている。エジプトの王[おう]ファラオは、強[つよ]い手[て]によらなければ、あなたがたを行[い]かせない。"
  20: "わたしは手[て]を伸[の]ばし、エジプト人[じん]を、わたしが彼[かれ]らの間[あいだ]で行[おこな]うすべての奇跡[きせき]をもって打[う]つ。その後[あと]、彼[かれ]はあなたがたを去[さ]らせる。"
  21: "わたしはこの民[たみ]に、エジプト人[じん]の前[まえ]で恵[めぐ]みを得[え]させる。あなたがたが去[さ]るとき、空[から]の手[て]で去[さ]ることはない。"
  22: "女[おんな]はそれぞれ、隣人[りんじん]や同居[どうきょ]する女[おんな]から、銀[ぎん]の器[うつわ]、金[きん]の器[うつわ]、衣服[いふく]を求[もと]め、それをあなたがたの息子[むすこ]や娘[むすめ]に着[つ]けさせなさい。あなたがたはエジプト人[じん]を奪[うば]い取[と]るのである。」"

notes:
  1: "ποιμαίνων τὰ πρόβατα Ιοθορ τοῦ γαμβροῦ αὐτοῦ — しゅうとであるエテロの羊を飼っていた (γαμβρός — «зять, тесть»). ὑπὸ τὴν ἔρημον — 荒野の奥まで (букв. «под пустыню»). εἰς τὸ ὄρος Χωρηβ — ホレブの山 (слав. и jp-joc добавляют «Божия», у LXX этого слова здесь нет)."
  2: "ἐν φλογὶ πυρὸς ἐκ τοῦ βάτου — 柴から出る炎の中に (βάτος — «терновый куст»). ὁ βάτος καίεται πυρί, ὁ δὲ βάτος οὐ κατεκαίετο — 燃えているのに焼けない (κατακαίω — «сжигать»)."
  3: "τὸ ὅραμα τὸ μέγα — 大きな光景 (ὅραμα — «видение»). τί ὅτι οὐ κατακαίεται — なぜ焼けないのか."
  4: "ὡς δὲ εἶδεν κύριος ὅτι προσάγει ἰδεῖν — 近づいて見ようとしているのをご覧になると. ἐκ τοῦ βάτου — 柴の中から. Τί ἐστιν; — 何でしょうか (LXX буквально «что?»; в масоретском тексте «вот я», это чтение не берём; слав. добавляет «Господи»)."
  5: "Μὴ ἐγγίσῃς ὧδε — ここに近づいてはならない. λῦσαι τὸ ὑπόδημα ἐκ τῶν ποδῶν σου — 靴を脱げ (ὑπόδημα — «сандалия»). γῆ ἁγία — 聖なる地."
  6: "Ἐγώ εἰμι ὁ θεὸς τοῦ πατρός σου — わたしはあなたの父の神. ἀπέστρεψεν τὸ πρόσωπον — 顔を背けた. εὐλαβεῖτο γὰρ κατεμβλέψαι ἐνώπιον τοῦ θεοῦ — 神を仰ぎ見るのを畏れた (εὐλαβέομαι — «благоговеть, бояться»)."
  7: "Ἰδὼν εἶδον — よく見た (удвоение глагола, усилительная конструкция). τῆς κραυγῆς αὐτῶν ἀκήκοα ἀπὸ τῶν ἐργοδιωκτῶν — 監督たちのゆえの叫びを聞いた (ἐργοδιώκτης — «приставник работ»). οἶδα τὴν ὀδύνην — 痛みを知っている (ὀδύνη)."
  8: "κατέβην ἐξελέσθαι — 救い出すために降った (ἐξαιρέομαι). γῆν ῥέουσαν γάλα καὶ μέλι — 乳と蜜の流れる地. Семь народов: Χαναναῖοι, Χετταῖοι, Αμορραῖοι, Φερεζαῖοι, Γεργεσαῖοι, Ευαῖοι, Ιεβουσαῖοι (Γεργεσαῖοι есть у LXX, в Синодальном их нет)."
  9: "ἰδοὺ κραυγὴ… ἥκει πρός με — 叫びがわたしに届いた. τὸν θλιμμόν, ὃν οἱ Αἰγύπτιοι θλίβουσιν αὐτούς — エジプト人が苦しめているその苦しみ (θλῖψις/θλίβω)."
  10: "δεῦρο ἀποστείλω σε — さあ、行け、わたしはあなたを遣わす. ἐξάξεις τὸν λαόν μου — 民を導き出せ (ἐξάγω)."
  11: "Τίς εἰμι, ὅτι πορεύσομαι… — わたしが何者なので…行くのか."
  12: "Ἔσομαι μετὰ σοῦ — わたしがあなたとともにいる. τοῦτό σοι τὸ σημεῖον — これが…しるし. λατρεύσετε τῷ θεῷ — 神に仕える (λατρεύω — «служить»; слав. «помолитеся»)."
  13: "Ὁ θεὸς τῶν πατέρων ὑμῶν ἀπέσταλκέν με — あなたがたの父たちの神が…遣わした. Τί ὄνομα αὐτῷ; — その名は何か."
  14: "Ἐγώ εἰμι ὁ ὤν — わたしはある者である (ὁ ὤν — причастие εἰμί, «Сущий»). Ὁ ὢν ἀπέσταλκέν με πρὸς ὑμᾶς — 「ある者」がわたしを…遣わした. Имя Яхве (היה) здесь не транслитерируется: в LXX стоит ὁ ὤν, а далее κύριος — поэтому 主[しゅ] (3:15), а не транслитерация."
  15: "Κύριος ὁ θεὸς τῶν πατέρων ὑμῶν — 主、あなたがたの父たちの神 (κύριος — передача Имени; слав. «Господь Бог отец наших»). ὄνομα αἰώνιον — 永遠にわたる名. μνημόσυνον γενεῶν γενεαῖς — 代々の記念."
  16: "τὴν γερουσίαν — 長老たち (γερουσία — «совет старейшин»). Ἐπισκοπῇ ἐπέσκεμμαι ὑμᾶς — あなたがたを顧みた (удвоение: «посещением посетил»; ἐπισκοπέω — «посещать, призирать»). ὅσα συμβέβηκεν ὑμῖν — あなたがたに起こったすべてのこと."
  17: "Ἀναβιβάσω ὑμᾶς — 導き上げる (ἀναβιβάζω). ἐκ τῆς κακώσεως τῶν Αἰγυπτίων — エジプト人の苦しみから (κάκωσις — «угнетение»). καὶ εἶπον — «и сказал Я»: продолжение речи Бога, в японском слито с そして."
  18: "εἰσακούσονταί σου τῆς φωνῆς — あなたの声に聞き従う. ὁ θεὸς τῶν Εβραίων προσκέκληται ἡμᾶς — ヘブライ人の神が…呼ばれた (προσκαλέομαι). ὁδὸν τριῶν ἡμερῶν — 三日の道のり. ἵνα θύσωμεν τῷ θεῷ ἡμῶν — わたしたちの神に犠牲を献げる (θύω; «отпусти нас» — добавка масоретского текста и Синодального)."
  19: "οὐ προήσεται ὑμᾶς — 行かせない (προΐημι — «отпускать»). ἐὰν μὴ μετὰ χειρὸς κραταιᾶς — 強い手によらなければ (χείρ κραταιά — «рука крепкая»)."
  20: "ἐκτείνας τὴν χεῖρα πατάξω — 手を伸ばし…打つ. ἐν πᾶσι τοῖς θαυμασίοις μου — すべての奇跡をもって (θαυμάσιος — «дивный»). ἐξαποστελεῖ ὑμᾶς — 去らせる."
  21: "δώσω χάριν τῷ λαῷ τούτῳ ἐναντίον τῶν Αἰγυπτίων — エジプト人の前で恵みを得させる (χάρις — «милость»). οὐκ ἀπελεύσεσθε κενοί — 空の手で去ることはない (κενός — «пустой»)."
  22: "αἰτήσει γυνὴ παρὰ γείτονος καὶ συσκήνου αὐτῆς — 隣人や同居する女から求める (σύσκηνος — «живущий в одном шатре»). σκεύη ἀργυρᾶ καὶ χρυσᾶ — 銀の器、金の器. ἐπιθήσετε ἐπὶ τοὺς υἱοὺς ὑμῶν — 息子や娘に着けさせる (букв. «возложите на»). σκυλεύσετε τοὺς Αἰγυπτίους — エジプト人を奪い取る (σκυλεύω — «снимать доспехи, обирать»)."
