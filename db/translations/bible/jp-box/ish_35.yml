# jp-box, Исход, глава 35. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — csl-ru и ru
# (с масоретского — только для понимания). У jp-joc в этой главе текста нет.
# Язык — современный 常体, порядок членов и деление на клаузы — по греческому.
# Глава 35: суббота (1–3), сбор приношений (4–19), щедрость народа (20–29),
# призвание Веселеила и Охолиава (30–35).
# Красного и синего нет: речь Моисея — в 「…」, слова Господа внутри неё — в 『…』.
# ВАЖНО о нумерации: в gr-lxx-byz стихам 8, 15, 17, 18 соответствует «.» — в этом
# списке у LXX их нет, а церковнославянский текст (и Синодальный с масоретского)
# держит их. Они переведены по церковнославянскому тексту и целиком стоят в 〔…〕.
# В ст. 12 модуль слил в один стих часть, которая в церковном счёте стоит стихами
# 15 и 17 (помета «12a» в базе) — отсюда повторение «опон двора», «столпов»,
# «елея и фимиама» в ст. 12 и в 〔15〕, 〔17〕; в славянском те же слова при ст. 12
# стоят в скобках именно как не-греческие. В ст. 11, 13, 14, 16, 23 славянский
# список длиннее греческого: добавки не внесены, они в notes.
# Сноски ⟨…⟩: 胸当て (35:27) — слово, неочевидное нехристианину; エフォド уже
# пояснён при первом упоминании (25:7).
# 幕屋, 祭壇, 安息日, 祭司, 初子 уже в корпусе.
# jp-ni не использовался.

