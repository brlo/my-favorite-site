verses:
  1: "モーセはイスラエルの子[こ]らの会衆[かいしゅう]をすべて集[あつ]めて言[い]った。「これが、主[しゅ]が行[おこな]えと命[めい]じられた言葉[ことば]である。"
  2: "『六日[むいか]の間[あいだ]は仕事[しごと]をせよ。七日目[なのかめ]はあなたがたにとって聖[きよ]い日[ひ]、主[しゅ]に捧[ささ]げる安息[あんそく]の日[ひ]である。この日[ひ]に仕事[しごと]をする者[もの]は死[し]に処[しょ]せられよ。"
  3: "安息日[あんそくび]には、あなたがたのどの住[す]まいでも火[ひ]をたいてはならない。わたしは主[しゅ]である。』」"
  4: "モーセはイスラエルの子[こ]らの会衆[かいしゅう]すべてに言[い]った。「これが、主[しゅ]が命[めい]じて言[い]われた言葉[ことば]である。"
  5: "『あなたがたのうちから主[しゅ]への献[ささ]げ物[もの]を取[と]れ。心[こころ]から喜[よろこ]んでささげる者[もの]は皆[みな]、主[しゅ]への初[はつ]物[もの]を持[も]って来[こ]い。金[きん]、銀[ぎん]、銅[どう]、"
  6: "青紫[あおむらさき]と紫[むらさき]の糸[いと]、二重[にじゅう]に撚[よ]った緋[ひ]の糸[いと]、撚[よ]りをかけた亜麻布[あまぬの]、やぎの毛[け]、"
  7: "赤[あか]く染[そ]めた雄羊[おひつじ]の皮[かわ]、青[あお]い皮[かわ]、朽[く]ちない木[き]、"
  8: "〔ともしびのための油[あぶら]、注[そそ]ぎの油[あぶら]に用[もち]いる香[こう]、香[こう]を調[ととの]えるための香料[こうりょう]〕"
  9: "赤[あか]い宝石[ほうせき]と、エフォドと長[なが]い衣[ころも]に彫[ほ]り込[こ]む石[いし]、"
  10: "あなたがたのうち、心[こころ]に知恵[ちえ]ある者[もの]は皆[みな]、来[き]て、主[しゅ]が命[めい]じたすべてのものを造[つく]れ。"
  11: "幕屋[まくや]と、その幕[まく]と覆[おお]い、その留[と]め具[ぐ]と横木[よこぎ]、その柱[はしら]、"
  12: "契約[けいやく]の箱[はこ]とその棒[ぼう]、贖[あがな]いの蓋[ふた]、垂[た]れ幕[まく]、庭[にわ]の幕[まく]とその柱[はしら]、緑玉[りょくぎょく]の石[いし]、香[こう]と注[そそ]ぎの油[あぶら]、"
  13: "机[つくえ]とそのすべての器[うつわ]、"
  14: "光[ひかり]の燭台[しょくだい]とそのすべての器[うつわ]、"
  15: "〔香[こう]の祭壇[さいだん]とその棒[ぼう]、注[そそ]ぎの油[あぶら]と調[ととの]えられた香[こう]、幕屋[まくや]の入口[いりぐち]の垂[た]れ幕[まく]〕"
  16: "焼[や]き尽[つ]くす供[そな]えの祭壇[さいだん]とそのすべての器[うつわ]、"
  17: "〔庭[にわ]の幕[まく]とその柱[はしら]と台[だい]、庭[にわ]の入口[いりぐち]の垂[た]れ幕[まく]〕"
  18: "〔幕屋[まくや]の杭[くい]と庭[にわ]の杭[くい]、その綱[つな]〕"
  19: "アロンの祭司[さいし]のための聖[せい]なる衣[ころも]、彼[かれ]らが聖所[せいしょ]で務[つと]めをするときに着[き]る衣[ころも]、およびその子[こ]らアロンの祭司[さいし]の務[つと]めのための衣[ころも]、注[そそ]ぎの油[あぶら]と調[ととの]えられた香[こう]。』」"
  20: "イスラエルの子[こ]らの会衆[かいしゅう]は皆[みな]、モーセのもとから出[で]て行[ゆ]った。"
  21: "おのおの、その心[こころ]が促[うなが]すままに、また魂[たましい]が良[よ]しとするままに、証[あかし]の幕屋[まくや]の仕事[しごと]、そのすべての細工[さいく]、聖[せい]なる衣[ころも]のために、主[しゅ]への献[ささ]げ物[もの]を持[も]って来[き]た。"
  22: "男[おとこ]たちは妻[つま]たちのもとから持[も]って来[き]た。心[こころ]に良[よ]しとする者[もの]は皆[みな]、印[しるし]の指輪[ゆびわ]、耳飾[みみかざ]り、指輪[ゆびわ]、首飾[くびかざ]り、腕輪[うでわ]、あらゆる金[きん]の器[うつわ]を持[も]って来[き]た。主[しゅ]への金[きん]の献[ささ]げ物[もの]を持[も]って来[き]た者[もの]は、皆[みな]、そうした。"
  23: "亜麻布[あまぬの]、青[あお]い皮[かわ]、赤[あか]く染[そ]めた雄羊[おひつじ]の皮[かわ]が見[み]つかった者[もの]は、それを持[も]って来[き]た。"
  24: "銀[ぎん]や銅[どう]を献[ささ]げ物[もの]としてささげる者[もの]は皆[みな]、その献[ささ]げ物[もの]を主[しゅ]に持[も]って来[き]た。朽[く]ちない木[き]が見[み]つかった者[もの]は皆[みな]、幕屋[まくや]のあらゆる仕事[しごと]のためにそれを持[も]って来[き]た。"
  25: "心[こころ]に知恵[ちえ]ある女[おんな]たちは皆[みな]、手[て]で紡[つむ]ぎ、紡[つむ]いだもの、すなわち青紫[あおむらさき]と紫[むらさき]と緋[ひ]の糸[いと]、亜麻布[あまぬの]を持[も]って来[き]た。"
  26: "また、心[こころ]に良[よ]しとして知恵[ちえ]ある女[おんな]たちは皆[みな]、やぎの毛[け]を紡[つむ]いだ。"
  27: "長[おさ]たちは、緑玉[りょくぎょく]の石[いし]と、エフォドと胸当[むねあ]て⟨裁[さば]きの胸当[むねあ]て。十二部族[じゅうにぶぞく]の名[な]を刻[きざ]んだ石[いし]をはめ込み、祭司[さいし]が胸[むね]に着[き]けた。⟩に込[こ]める石[いし]を持[も]って来[き]た。"
  28: "また、混[ま]ぜ合[あ]わせのもの、注[そそ]ぎの油[あぶら]、香[こう]の調[ととの]えのためのものを持[も]って来[き]た。"
  29: "男[おとこ]も女[おんな]も、心[こころ]に促[うなが]されて、主[しゅ]がモーセを通[とお]して命[めい]じたすべての仕事[しごと]のために進[すす]んで持[も]って来[き]た。イスラエルの子[こ]らはこうして、主[しゅ]に献[ささ]げ物[もの]をささげた。"
  30: "モーセはイスラエルの子[こ]らに言[い]った。「見[み]よ、神[かみ]は名[な]によってベツァレルを呼[よ]ばれた。彼[かれ]はユダの部族[ぶぞく]のオルの子[こ]、ウリの子[こ]である。"
  31: "神[かみ]は彼[かれ]を神[かみ]の霊[れい]で満[み]たし、知恵[ちえ]と悟[さと]りとすべての知識[ちしき]を与[あた]え、"
  32: "設計[せっけい]して、その設計[せっけい]のすべての仕事[しごと]を行[おこな]い、金[きん]と銀[ぎん]と銅[どう]を扱[あつか]い、"
  33: "石[いし]を彫[ほ]って細工[さいく]し、木[き]を加工[かこう]して、あらゆる知恵[ちえ]の仕事[しごと]を成[な]し遂[と]げるようにされた。"
  34: "また、教[おし]え導[みちび]く力[ちから]を彼[かれ]の心[こころ]に与[あた]えられた。彼[かれ]にも、ダンの部族[ぶぞく]のアヒサマクの子[こ]オホリアブにも。"
  35: "神[かみ]は彼[かれ]らを、知恵[ちえ]と悟[さと]りと心[こころ]の分別[ふんべつ]で満[み]たし、聖所[せいしょ]のすべての仕事[しごと]を理解[りかい]して行[おこな]えるようにされた。すなわち、織[お]り物[もの]と、緋[ひ]の糸[いと]と亜麻布[あまぬの]で織[お]り上[あ]げる刺繍[ししゅう]の仕事[しごと]、あらゆる巧[たくみ]な仕事[しごと]である。」"

notes:
  1: "συνήθροισεν — 集めて (συναθροίζω). πᾶσαν συναγωγὴν υἱῶν Ισραηλ — イスラエルの子らの会衆のすべて (συναγωγή — «собрание»). Οὗτοι οἱ λόγοι, οὓς εἶπεν κύριος ποιῆσαι αὐτούς — これが…行えと命じられた言葉である (букв. «слова, которые сказал Господь, чтобы исполнять их»)."
  2: "κατάπαυσις, ἅγιον, σάββατα, ἀνάπαυσις κυρίῳ — 聖い日、主に捧げる安息の日 (перечисление без связок, как в LXX). τελευτάτω — 死に処せられよ (ср. 31:15 θανάτῳ θανατωθήσεται — там иначе)."
  3: "οὐ καύσετε πῦρ — 火をたいてはならない (καίω). ἐν πάσῃ κατοικίᾳ ὑμῶν — どの住まいでも (κατοικία). ἐγὼ κύριος — わたしは主である (в Синодальном этого нет — масоретский текст)."
  4: "εἶπεν…λέγων — 言った (формула введения речи). Τοῦτο τὸ ῥῆμα, ὃ συνέταξεν κύριος — これが、主が命じて言われた言葉である (ῥῆμα — «слово, дело»)."
  5: "ἀφαίρεμα κυρίῳ — 主への献げ物 (ἀφαίρεμα — «отделение, приношение»). πᾶς ὁ καταδεχόμενος τῇ καρδίᾳ — 心から喜んでささげる者は (καταδέχομαι — «принимать, соизволять»). ἀπαρχάς — 初物 (начатки)."
  6: "ὑάκινθος, πορφύρα — 青紫と紫. κόκκινον διπλοῦν διανενησμένον — 二重に撚った緋の糸 (διπλοῦς — «двойной», διανένησμαι — «быть скрученным»). βύσσος κεκλωσμένη — 撚りをかけた亜麻布. τρίχες αἴγειαι — やぎの毛."
  7: "δέρματα κριῶν ἠρυθροδανωμένα — 赤く染めた雄羊の皮 (ῥυθροδανόω — «красить в красное»; κριός — «баран»). δέρματα ὑακίνθινα — 青い皮. ξύλα ἄσηπτα — 朽ちない木 (ἄσηπτος — «негниющий»; порода не названа, ср. Синодальный «дерево ситтим»)."
  8: "В gr-lxx-byz на месте стиха «.»: в этом списке у LXX нет масла и благовоний. Стих переведён по церковнославянскому тексту (там он есть) и целиком стоит в 〔…〕: ἔλαιον εἰς φῶς — ともしびのための油, θυμίαμα — 香, σύνθεσις — 香料 (состав)."
  9: "λίθους σαρδίου — 赤い宝石 (σάρδιον — сердолик). λίθους εἰς τὴν γλυφήν — 彫り込む石 (γλυφή — «резьба»). ἐπωμίς — エフォド (нарамник), ποδήρης — 長い衣 (длинная до пят одежда; слав. «подир»)."
  10: "πᾶς σοφὸς τῇ καρδίᾳ — 心に知恵ある者は皆 (σοφός). ἐργαζέσθω — 造れ (императив 3 л.)."
  11: "παραρρύματα — 幕 (завесы скинии), καλύμματα — 覆い (покровы). διατόνια — 留め具: слово редкое и неясное (слав. «разворы»); μοχλοί — 横木 (шесты), στύλοι — 柱. В слав. добавлено «и стояла» (подножия), в базе его нет — не внесено."
  12: "ἀναφορεῖς — 棒 (шесты для ношения ковчега; ἀναφορεύς — «носило»). ἱλαστήριον — 贖いの蓋. καταπέτασμα — 垂れ幕 (завеса). В базе посреди стиха стоит помета «12a»: модуль слил в ст. 12 часть, которая в церковном счёте стоит стихами 15 и 17 (опоны двора, столпы, камни, фимиам, елей); помета не переводится. σμάραγδος — 緑玉 (изумруд)."
  13: "τράπεζα — 机 (стол хлебов предложения). В слав. добавлено «и хлебы предложения» (ἄρτοι τῆς προθέσεως), в базе нет — не внесено."
  14: "λυχνία τοῦ φωτός — 光の燭台 (светильник для света). В слав. добавлено «и светила его и елей светилный», в базе нет."
  15: "В gr-lxx-byz на месте стиха «.»; стих переведён по церковнославянскому тексту и целиком стоит в 〔…〕: θυσιαστήριον τοῦ θυμιάματος — 香の祭壇 (жертвенник курений), ἀναφορεῖς — 棒, ἔλαιον τῆς χρίσεως — 注ぎの油, θυμίαμα τῆς συνθέσεως — 調えられた香, καταπέτασμα τῆς θύρας — 入口の垂れ幕."
  16: "θυσιαστήριον — 焼き尽くす供えの祭壇 (жертвенник всесожжения; в этой строке — без уточнения, по смыслу списка). В слав. добавлено «огнище его медяно и носила его… и умывалницу, и стояло ея»; в базе только «жертвенник и все сосуды его»."
  17: "В gr-lxx-byz «.»; стих по церковнославянскому тексту, целиком в 〔…〕: ἱστία τῆς αὐλῆς — 庭の幕 (завесы двора), στύλοι — 柱, βάσεις — 台 (подножия), καταπέτασμα τῆς πύλης — 入口の垂れ幕."
  18: "В gr-lxx-byz «.»; стих по церковнославянскому тексту, целиком в 〔…〕: πάσσαλοι — 杭 (колья), σχοινία — 綱 (верёвки)."
  19: "στολαὶ ἅγιαι — 聖なる衣. λειτουργήσουσιν ἐν αὐταῖς — 務めをするときに着る (λειτουργέω). χιτῶνες — 衣 (хитоны). В этом стихе есть и ἔλαιον χρίσματος, и θυμίαμα συνθέσεως: слав. держит их в скобках, но в греч. они есть — поэтому без 〔…〕."
  20: "ἐξῆλθεν πᾶσα συναγωγή — 会衆は皆…出て行った (ἐξέρχομαι). ἀπὸ Μωυσῆ — モーセのもとから."
  21: "ἕκαστος ὧν ἔφερεν αὐτῶν ἡ καρδία — おのおの、その心が促すままに (φέρω — «нести, влечь»). ὅσοις ἔδοξεν τῇ ψυχῇ — 魂に良しとする者 (δοκέω — «казаться»). εἰς πάντα τὰ ἔργα τῆς σκηνῆς τοῦ μαρτυρίου — 証の幕屋の仕事のために. κάτεργα — 用い (κατεργασία — «изделие»)."
  22: "οἱ ἄνδρες παρὰ τῶν γυναικῶν — 男たちは妻たちのもとから (παρὰ + род.; слав. «мужие от жен своих»; возможно и «мужья вместе с жёнами» — двусмысленность LXX сохранена). σφραγῖδες — 印の指輪 (перстни-печати), ἐμπλόκια — 首飾り, περιδέξια — 腕輪. σκεῦος χρυσοῦν — 金の器."
  23: "βύσσος — 亜麻布. δέρματα ὑακίνθινα — 青い皮, δέρματα κριῶν ἠρυθροδανωμένα — 赤く染めた雄羊の皮. В слав. список длиннее (шерсть голубая, пурпур, червленица, козьи кожи) — в базе их нет, не внесены."
  24: "ἀφαιρῶν ἀφαίρεμα — 献げ物としてささげる者 (ἀφαιρέω). ξύλα ἄσηπτα — 朽ちない木. εἰς πάντα τὰ ἔργα τῆς κατασκευῆς — 幕屋のあらゆる仕事のために (κατασκευή — «устроение»)."
  25: "γυνὴ σοφὴ τῇ διανοίᾳ — 心に知恵ある女 (διάνοια — «помышление»). ταῖς χερσὶν νήθειν — 手で紡ぎ (νήθω). νενησμένα — 紡いだもの (perfect pass.)."
  26: "αἷς ἔδοξεν τῇ διανοίᾳ αὐτῶν ἐν σοφίᾳ — 心に良しとして知恵ある女たち (δοκέω + датив). ἔνησαν — 紡いだ (νήθω). τρίχες αἴγειαι — やぎの毛."
  27: "οἱ ἄρχοντες — 長たち (князья). λίθοι τῆς σμαράγδου — 緑玉の石. λίθοι τῆς πληρώσεως — 込み石 (πλήρωσις — «наполнение», камни для оправы). ἐπωμίς — エフォド, λογεῖον — 胸当て («наперсник»; в этом значении слово в корпусе впервые, поэтому пояснено)."
  28: "συνθέσεις — 混ぜ合わせのもの (состав благовоний). ἔλαιον τῆς χρίσεως — 注ぎの油. σύνθεσις τοῦ θυμιάματος — 香の調えのためのもの."
  29: "ὧν ἔφερεν ἡ διάνοια αὐτῶν — 心に促されて (φέρω + διάνοια). εἰσελθόντας ποιεῖν — 進んで行うために (εἰσέρχομαι — «входить, приступать»). διὰ Μωυσῆ — モーセを通して. ἀφαίρεμα κυρίῳ — 主への献げ物."
  30: "ἀνακέκληκεν ὁ θεὸς ἐξ ὀνόματος — 神は名によって…呼ばれた (в 31:2 — κύριος «Господь»; здесь ὁ θεός). Βεσελεηλ τὸν τοῦ Ουριου τὸν Ωρ — オルの子、ウリの子ベツァレル."
  31: "ἐνέπλησεν αὐτὸν πνεῦμα θεῖον σοφίας… — 神の霊で満たし、知恵を…与え (ср. 31:3; здесь ἐπιστήμη πάντων — «знание всего»)."
  32: "ἀρχιτεκτονεῖν κατὰ πάντα τὰ ἔργα τῆς ἀρχιτεκτονίας — 設計して、その設計のすべての仕事を行い (ἀρχιτεκτονία — «зодчество»)."
  33: "λιθουργῆσαι τὸν λίθον — 石を彫って細工し (λιθουργέω). κατεργάζεσθαι τὰ ξύλα — 木を加工し. ἐν παντὶ ἔργῳ σοφίας — あらゆる知恵の仕事を."
  34: "προβιβάσαι — 教え導く力 (προβιβάζω — «продвигать, учить»; слав. «преуспевати»). ἔδωκεν αὐτῷ ἐν τῇ διανοίᾳ — 彼の心に与えられた. αὐτῷ τε καὶ Ελιαβ — 彼にも…オホリアブにも (ср. 31:6)."
  35: "ἐνέπλησεν αὐτοὺς σοφίας καὶ συνέσεως διανοίας — 知恵と悟りと心の分別で満たし (букв. «премудрости и разума помышления»). συνιέναι — 理解して (συνίημι). τὰ ἔργα τοῦ ἁγίου — 聖所のすべての仕事. ὑφαντά — 織り物, ποικιλτά — 刺繍 (ποικίλος — «пёстрый»). ἀρχιτεκτονία ποικιλίας — 巧な仕事."
