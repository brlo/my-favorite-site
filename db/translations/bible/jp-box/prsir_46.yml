verses:
  1: "戦[いくさ]に強[つよ]いヨシュアは、預言[よげん]においてモーセの後[あと]を継[つ]ぐ者[もの]であった。"
  2: "彼[かれ]はその名[な]に応[おう]じて大[おお]きな者となり、選[えら]ばれた者たちを救[すく]い、立[た]ち上[あ]がる敵[てき]に報[むく]い、イスラエルに遺[い]産[さん]を継がせるために戦[たたか]った。"
  3: "彼[かれ]は、手[て]を上[あ]げ、町々[まちまち]に剣[つるぎ]を伸[の]べたとき、どれほど栄光[えいこう]を受[う]けたことか。"
  4: "彼[かれ]より先[さき]に、だれがこのように立[た]っただろうか。彼こそ主[しゅ]の戦[いくさ]を導[みちび]いたのである。"
  5: "彼[かれ]の手[て]によって太陽[たいよう]が止[と]められ、一[いち]日[にち]が二[ふた]日[か]のように長[なが]くなったのではないか。"
  6: "敵[てき]が四方[しほう]から彼[かれ]を攻[せ]めるとき、彼はいと高[たか]き支[し]配[はい]者[しゃ]を呼[よ]び求[もと]めた。すると、大[おお]いなる主[しゅ]は、強[つよ]い力[ちから]の雹[ひょう]の石[いし]をもって彼の声[こえ]を聞[き]かれた。"
  7: "主[しゅ]は民[たみ]の上[うえ]に戦[いくさ]を降[ふ]らし、下[くだ]りゆく中[なか]で立[た]ち向[む]かう者[もの]を滅[ほろ]ぼした。"
  8: "それによって諸[しょ]国[こく]の民は、彼[かれ]の武[ぶ]具[ぐ]のすべてを知[し]るであろう。彼の戦は主の前[まえ]にあるからである。彼[かれ]は支[し]配[はい]者[しゃ]の後[あと]に従[したが]った。"
  9: "モーセの時代[じだい]に、彼とイェフォンネの子[こ]カレブは、あわれみのわざを行[おこな]った。すなわち、集[しゅう]会[かい]の前[まえ]に立[た]って民[たみ]を罪[つみ]から引[ひ]き止[と]め、悪[わる]い呟[つぶや]きを静[しず]めた。"
  10: "彼[かれ]らは二[ふた]人[り]だけで、六[ろく]十[じゅう]万[まん]の歩[ほ]兵[へい]の中[なか]から救[すく]われ、彼らを遺[い]産[さん]の地[ち]、乳[ちち]と蜜[みつ]の流[なが]れる地へ導[みちび]き入[い]れることになった。"
  11: "主[しゅ]はカレブに力[ちから]を与[あた]え、その力は老[ろう]いるまで彼[かれ]のうちに保[たも]たれた。それによって彼は地[ち]の高[たか]みに上[のぼ]り、その子孫[しそん]は遺[い]産[さん]を受[う]け継[つ]いだ。"
  12: "それは、すべてイスラエルの子[こ]らが、主[しゅ]に従[したが]って歩[あゆ]むことが良[よ]いと知[し]るためであった。"
  13: "また、裁[さば]き手[て]たち、それぞれその名[な]に応[おう]じた者[もの]たち、その心[こころ]が淫[いん]らに走[はし]らず、主[しゅ]から背[そむ]かなかった者たち。その思[おも]い出[だ]が祝福[しゅくふく]のうちにあるように。"
  14: "彼[かれ]らの骨[ほね]がその場[ば]所[しょ]から芽[め]を出[だ]し、"
  15: "その名[な]が、栄光[えいこう]を受[う]けたその子[こ]らに受け継[つ]がれるように。"
  16: "主[しゅ]に愛[あい]された者[もの]、主の預言[よげん]者[しゃ]サムエルは、王国[おうこく]を定[さだ]め、その民[たみ]の上[うえ]に指[し]導[どう]者たちを油[あぶら]注[そそ]ぎした。"
  17: "彼[かれ]は主[しゅ]の律法[りっぽう]に従[したが]って民[たみ]の集[あつ]まりを裁[さば]いた。主はヤコブに目[め]を留[と]められた。"
  18: "彼[かれ]はその信[しん]によって預言[よげん]者[しゃ]として確[たし]かな者[もの]とされ、その言葉[ことば]のうちで、幻[まぼろし]に忠[ちゅう]実[じつ]な者として知[し]られた。"
  19: "敵[てき]が四方[しほう]から彼[かれ]を攻[せ]めるとき、彼は主[しゅ]なる支[し]配[はい]者[しゃ]を呼[よ]び求め、乳[ちち]を飲[の]む小[こ]羊[ひつじ]を献[ささ]げ物[もの]とした。"
  20: "主[しゅ]は天[てん]から雷[かみなり]を鳴[な]らし、大[おお]きな響[ひび]きをもってその声[こえ]を聞[き]こえさせられた。"
  21: "そして、ティルスの指[し]導[どう]者[しゃ]たちと、フィリスティ人のすべての長[おさ]たちを滅[ほろ]ぼされた。"
  22: "彼[かれ]は永遠[えいえん]の眠[ねむ]りに入[はい]る時[とき]の来[く]る前[まえ]に、主[しゅ]とその油[あぶら]注[そそ]がれた者[もの]の前で証[あかし]した。「財[ざい]産[さん]も、履[は]き物[もの]に至[いた]るまで、わたしはすべても肉[にく]から何[なに]も受[う]け取[と]っていない。」そして、だれひとり彼を責[せ]めた者はいなかった。"
  23: "彼[かれ]は眠[ねむ]りについた後[あと]も預言[よげん]し、王[おう]にその終[お]わりを示[しめ]した。また、預言によって地[ち]からその声[こえ]を上[あ]げ、民[たみ]の不[ふ]法[ほう]を消[け]し去[さ]ることを告[つ]げた。"

notes:
  1: "Κραταιὸς ἐν πολέμῳ Ἰησοῦς Ναυη — «крепкий в войне Иисус Навин» (κραταιός — крепкий; πόλεμος — война). διάδοχος Μωυσῆ ἐν προφητείαις — «преемник Моисея в пророчествах» (διάδοχος — преемник)."
  2: "ὃς ἐγένετο κατὰ τὸ ὄνομα αὐτοῦ μέγας — «который стал по имени своему велик». ἐπὶ σωτηρίᾳ ἐκλεκτῶν αὐτοῦ — «для спасения избранных Его». ἐκδικῆσαι ἐπεγειρομένους ἐχθρούς — «отомстить восстающих врагов» (ἐκδικέω — мстить; ἐπεγείρω — поднимать). ὅπως κατακληρονομήσῃ τὸν Ισραηλ — «чтобы дать Израилю наследовать» (κατακληρονομέω — наделять наследием)."
  3: "ὡς ἐδοξάσθη — «как он прославлен» (δοξάζω — прославлять). ἐν τῷ ἐπᾶραι χεῖρας αὐτοῦ — «когда поднял руки свои» (ἐπαίρω — поднимать). ἐν τῷ ἐκτεῖναι ῥομφαίαν ἐπὶ πόλεις — «когда простёр меч на города» (ῥομφαία — меч; ἐκτείνω — простирать)."
  4: "τίς πρότερος αὐτοῦ οὕτως ἔστη — «кто прежде него так стал» (πρότερος — прежний). τοὺς πολέμους κυρίου αὐτὸς ἐπήγαγεν — «ибо войны Господни он вёл» (ἐπάγω — наводить, вести)."
  5: "οὐχὶ ἐν χειρὶ αὐτοῦ ἐνεποδίσθη ὁ ἥλιος — «не его ли рукою остановлено солнце» (ἐμποδίζω — задерживать, останавливать). μία ἡμέρα ἐγενήθη πρὸς δύο — «один день стал как два» (ср. Нав 10:13)."
  6: "ἐπεκαλέσατο τὸν ὕψιστον δυνάστην — «он призвал Всевышнего Владыку» (ἐπικαλέομαι — призывать; δυνάστης — властелин). ἐν τῷ θλῖψαι αὐτὸν ἐχθροὺς κυκλόθεν — «когда стеснили его враги вокруг» (θλίβω — теснить; κυκλόθεν — кругом). ἐπήκουσεν αὐτοῦ μέγας κύριος — «услышал его великий Господь» (ἐπακούω — внимать). ἐν λίθοις χαλάζης δυνάμεως κραταιᾶς — «камнями града силы крепкой» (χάλαζα — град; κραταιός — крепкий)."
  7: "κατέρραξεν ἐπ᾿ ἔθνος πόλεμον — «он низверг на народ войну» (καταρράσσω — низвергать). ἐν καταβάσει ἀπώλεσεν ἀνθεστηκότας — «при спуске погубил противящихся» (κατάβασις — спуск; ἀνθίστημι — противостоять)."
  8: "ἵνα γνῶσιν ἔθνη πανοπλίαν αὐτοῦ — «чтобы познали народы всеоружие его» (πανοπλία — полное вооружение). ἐναντίον κυρίου ὁ πόλεμος αὐτοῦ — «пред Господом война его». ἐπηκολούθησεν ὀπίσω δυνάστου — «он последовал за Властелином» (ἐπακολουθέω — следовать); слав. относит это к концу 46:8."
  9: "ἐν ἡμέραις Μωυσέως ἐποίησεν ἔλεος — «во дни Моисея он сотворил милость» (ἔλεος — милость). Χαλεβ υἱὸς Ιεφοννη — «Халев, сын Иефонни» (в тексте формы корпуса カレブ, イェフォンネ). ἀντιστῆναι ἔναντι ἐκκλησίας — «стать против собрания» (ἐκκλησία — собрание). κωλῦσαι λαὸν ἀπὸ ἁμαρτίας — «удержать народ от греха» (κωλύω — препятствовать). κοπάσαι γογγυσμὸν πονηρίας — «утишить ропот злобы» (γογγυσμός — ропот; πονηρία — злоба)."
  10: "καὶ αὐτοὶ δύο ὄντες — «и они, двое будучи». διεσώθησαν ἀπὸ ἑξακοσίων χιλιάδων πεζῶν — «спаслись от шестисот тысяч пеших» (διασῴζω — спасать; πεζός — пеший). εἰσαγαγεῖν αὐτοὺς εἰς κληρονομίαν — «чтобы ввести их в наследие». εἰς γῆν ῥέουσαν γάλα καὶ μέλι — «в землю, текущую молоком и мёдом» (ῥέω — течь)."
  11: "ἔδωκεν ὁ κύριος τῷ Χαλεβ ἰσχύν — «дал Господь Халеву силу» (ἰσχύς — сила). ἕως γήρους διέμεινεν αὐτῷ — «до старости она пребыла у него» (γῆρας — старость; διαμένω — пребывать). ἐπιβῆναι αὐτὸν ἐπὶ τὸ ὕψος τῆς γῆς — «взойти ему на высоту земли» (ἐπιβαίνω — восходить). τὸ σπέρμα αὐτοῦ κατέσχεν κληρονομίαν — «семя его получило наследие» (κατέχω — получать)."
  12: "ὅπως ἴδωσιν πάντες οἱ υἱοὶ Ισραηλ — «чтобы увидели все сыны Израиля». ὅτι καλὸν τὸ πορεύεσθαι ὀπίσω κυρίου — «что хорошо ходить вслед Господа» (πορεύομαι — идти)."
  13: "Καὶ οἱ κριταί — «и судии» (κριτής — судья). ἕκαστος τῷ αὐτοῦ ὀνόματι — «каждый по имени своему». ὅσων οὐκ ἐξεπόρνευσεν ἡ καρδία — «которых сердце не прелюбодействовало» (ἐκπορνεύω — блудодействовать). ὅσοι οὐκ ἀπεστράφησαν ἀπὸ κυρίου — «которые не отвратились от Господа» (ἀποστρέφω — отвращать). εἴη τὸ μνημόσυνον αὐτῶν ἐν εὐλογίαις — «да будет память их в благословениях» (εὐλογία — благословение)."
  14: "τὰ ὀστᾶ αὐτῶν ἀναθάλοι ἐκ τοῦ τόπου αὐτῶν — «кости их да процветут из места их» (ὀστέον — кость; ἀναθάλλω — расцветать)."
  15: "τὸ ὄνομα αὐτῶν ἀντικαταλλασσόμενον ἐφ᾿ υἱοῖς — «имя их, передаваемое сынам» (ἀντικαταλλάσσομαι — передавать вместо); δεδοξασμένων αὐτῶν — «прославленных их»."
  16: "Ἠγαπημένος ὑπὸ κυρίου αὐτοῦ Σαμουηλ — «возлюбленный Господом своим Самуил» (ἀγαπάω — любить). προφήτης κυρίου — «пророк Господень». κατέστησεν βασιλείαν — «учредил царство» (καθίστημι — ставить, учреждать). ἔχρισεν ἄρχοντας ἐπὶ τὸν λαὸν αὐτοῦ — «помазал начальников над народом Своим» (χρίω — помазывать; ἄρχων — начальник)."
  17: "ἐν νόμῳ κυρίου ἔκρινεν συναγωγήν — «в законе Господа судил собрание» (κρίνω — судить). ἐπεσκέψατο κύριος τὸν Ιακωβ — «посетил Господь Иакова» (ἐπισκέπτομαι — посещать, призирать)."
  18: "ἐν πίστει αὐτοῦ ἠκριβάσθη προφήτης — «в вере своей он был испытан как пророк» (ἀκριβάζω — испытывать, удостоверять). ἐγνώσθη ἐν ῥήμασιν αὐτοῦ πιστὸς ὁράσεως — «познан в словах своих верным видения» (ὅρασις — видение)."
  19: "ἐπεκαλέσατο τὸν κύριον δυνάστην — «призвал Господа Владыку». ἐν τῷ θλῖψαι ἐχθροὺς αὐτοῦ κυκλόθεν — «когда стеснили его враги вокруг». ἐν προσφορᾷ ἀρνὸς γαλαθηνοῦ — «приношением агнца млекопитающегося» (προσφορά — приношение; ἀρνός — агнец; γαλαθηνός — сосущий молоко)."
  20: "ἐβρόντησεν ἀπ᾽ οὐρανοῦ ὁ κύριος — «возгремел с неба Господь» (βροντάω — греметь). ἐν ἤχῳ μεγάλῳ ἀκουστὴν ἐποίησεν τὴν φωνὴν αὐτοῦ — «в великом шуме сделал слышным голос Свой» (ἦχος — шум; ἀκουστός — слышимый)."
  21: "ἐξέτριψεν ἡγουμένους Τυρίων — «истребил вождей Тира» (ἐκτρίβω — истреблять; ἡγούμενος — вождь). πάντας ἄρχοντας Φυλιστιιμ — «всех начальников филистимских» (в тексте フィリスティ人 — форма корпуса)."
  22: "πρὸ καιροῦ κοιμήσεως αἰῶνος — «прежде времени вечного сна» (κοίμησις — сон, успение). ἐπεμαρτύρατο ἔναντι κυρίου καὶ χριστοῦ αὐτοῦ — «засвидетельствовал пред Господом и помазанником Его» (ἐπιμαρτύρομαι — свидетельствовать; χριστός — помазанник). Χρήματα καὶ ἕως ὑποδημάτων ἀπὸ πάσης σαρκὸς οὐκ εἴληφα — «имущества и до обуви от всякой плоти я не взял» (χρήματα — имущество; ὑπόδημα — обувь). οὐκ ἐνεκάλεσεν αὐτῷ ἄνθρωπος — «не обвинил его человек» (ἐγκαλέω — обвинять). Прямая речь — 「」."
  23: "μετὰ τὸ ὑπνῶσαι αὐτὸν προεφήτευσεν — «после того как он уснул, он пророчествовал» (ὑπνόω — спать). ὑπέδειξεν βασιλεῖ τὴν τελευτὴν αὐτοῦ — «показал царю кончину его» (ὑποδείκνυμι — показывать; τελευτή — кончина). ἀνύψωσεν ἐκ γῆς τὴν φωνὴν αὐτοῦ — «возвысил от земли голос свой» (ἀνυψόω — возвышать). ἐξαλεῖψαι ἀνομίαν λαοῦ — «истребить беззаконие народа» (ἐξαλείφω — изглаживать; ἀνομία — беззаконие)."
