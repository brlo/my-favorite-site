verses:
  1: "サムエルはイスラエルのすべての男[おとこ]たちに言[い]った。「見[み]よ、わたしはあなたがたの声[こえ]を、あなたがたがわたしに言[い]ったすべてのことについて聞[き]き入れ、あなたがたの上[うえ]に王[おう]を立[た]てた。"
  2: "今[いま]、見よ、王[おう]はあなたがたの前[まえ]を歩[あゆ]んでいる。わたしは年[とし]を取[と]って、ここに座[すわ]っている。見よ、わたしの息子[むすこ]たちはあなたがたとともにいる。わたしは若[わか]いときから今日[きょう]まで、あなたがたの前を歩いてきた。"
  3: "見よ、わたしがここにいる。主[しゅ]の前[まえ]、主[しゅ]が油[あぶら]を注[そそ]がれた者[もの]の前で、わたしに対して答[こた]えなさい。わたしはだれの子牛[こうし]を取[と]ったか。だれのろばを取ったか。だれを虐[しいた]げ、だれを苦[くる]しめただろうか。だれの手[て]から贖[あがない]の金[かね]や履[は]き物[もの]を受[う]け取[と]ったか。わたしに対して答えなさい。そうすれば、わたしはあなたがたに返[かえ]す。」"
  4: "彼[かれ]らは言[い]った。「あなたはわたしたちを虐[しいた]げず、圧[あっ]迫[ぱく]せず、打[う]ち砕[くだ]かず、だれの手[て]からも何[なに]も取[と]らなかった。」"
  5: "サムエルは民[たみ]に言[い]った。「今日[きょう]、主[しゅ]はあなたがたの間[あいだ]で証人[しょうにん]であり、主[しゅ]が油[あぶら]を注[そそ]がれた者[もの]も証人である。あなたがたはわたしの手[て]に何[なに]も見[み]いださなかった。」民[たみ]は言[い]った。「証人[しょうにん]だ。」"
  6: "サムエルは民[たみ]に言[い]った。「主[しゅ]は証人[しょうにん]である。主[しゅ]はモーセとアロンを立[た]て、わたしたちの父祖[ふそ]たちをエジプトから上[のぼ]らせた方[かた]である。"
  7: "今[いま]、立[た]ちなさい。わたしは主[しゅ]の前[まえ]であなたがたと論[ろん]じ合[あ]い、主[しゅ]があなたがたとあなたがたの父祖[ふそ]たちに対して行[おこな]われた、すべての正[ただ]しいわざをあなたがたに告[つ]げよう。"
  8: "ヤコブとその子[こ]らがエジプトへ入[はい]ったとき、エジプトは彼[かれ]らを苦[くる]しめた。そこで、わたしたちの父祖[ふそ]たちが主[しゅ]に叫[さけ]ぶと、主[しゅ]はモーセとアロンを遣[つか]わし、彼[かれ]らをエジプトから導[みちび]き出[だ]して、この場所[ばしょ]に住[す]まわせた。"
  9: "しかし、彼[かれ]らは自分[じぶん]たちの神[かみ]である主[しゅ]を忘[わす]れた。そこで主は彼らを、アソルの王[おう]ヤビンの軍[ぐん]の長[ちょう]シセラの手[て]、ペリシテ人[じん]の手、モアブの王[おう]の手に売[う]り渡[わた]された。彼らはイスラエルと戦[たたか]った。"
  10: "彼[かれ]らは主[しゅ]に叫[さけ]んで言[い]った。『わたしたちは罪[つみ]を犯[おか]した。主[しゅ]を捨[す]ててバアル[ばある]と聖[せい]なる木立[こだち]に仕[つか]えたからだ。今[いま]、わたしたちを敵[てき]の手[て]から救[すく]い出[だ]してほしい。そうすれば、あなたに仕える。』"
  11: "主[しゅ]はエルバアル、バラク、エフタ、サムエルを遣[つか]わし、あなたがたを周[まわ]りの敵[てき]の手[て]から救[すく]い出[だ]された。あなたがたは安[やす]んじて住[す]んでいた。"
  12: "あなたがたは、アンモンの子[こ]らの王[おう]ナアスがあなたがたに攻[せ]めて来[き]たのを見[み]て、わたしに言[い]った。『いいえ、王[おう]がわたしたちの上[うえ]に王[おう]として立[た]つべきだ』と。しかし、わたしたちの神[かみ]である主[しゅ]こそ、わたしたちの王[おう]である。"
  13: "今[いま]、見[み]よ、あなたがたが選[えら]んだ王[おう]がここにいる。見よ、主[しゅ]はあなたがたの上[うえ]に王を立[た]てられた。"
  14: "もしあなたがたが主[しゅ]を恐[おそ]れ、主[しゅ]に仕[つか]え、その声[こえ]を聞[き]き、主[しゅ]の口[くち]に逆[さか]らわず、あなたがたも、あなたがたの上[うえ]に王[おう]として立[た]つ王も、あなたがたの神[かみ]である主[しゅ]に従[したが]って歩[あゆ]むのなら。"
  15: "しかし、もしあなたがたが主[しゅ]の声[こえ]を聞[き]かず、主[しゅ]の口[くち]に逆[さか]らうなら、主[しゅ]の手[て]はあなたがたの上[うえ]に、またあなたがたの王[おう]の上[うえ]に下[くだ]る。"
  16: "今[いま]、立[た]ちなさい。主[しゅ]があなたがたの目[め]の前[まえ]で行[おこな]われる、この大[おお]きなことを見[み]なさい。"
  17: "今日[きょう]は小麦[こむぎ]の刈[か]り入[い]れではないか。わたしが主[しゅ]を呼[よ]び求[もと]めると、主は雷[かみなり]と雨[あめ]を下[くだ]さる。あなたがたは、自分[じぶん]たちのために王[おう]を求[もと]めて主[しゅ]の前[まえ]で犯[おか]した悪[あく]が大[おお]きいことを、知[し]って見[み]なさい。」"
  18: "サムエルは主[しゅ]を呼[よ]び求[もと]めた。すると主[しゅ]はその日[ひ]、雷[かみなり]と雨[あめ]を下[くだ]さった。民[たみ]はみな、主[しゅ]を、またサムエルを大[おお]いに恐[おそ]れた。"
  19: "民[たみ]はみなサムエルに言[い]った。「あなたのしもべたちのために、あなたの神[かみ]である主[しゅ]に祈[いの]ってください。そうすれば、わたしたちは死[し]なない。わたしたちはすべての罪[つみ]の上[うえ]に、さらに悪[あく]を加[くわ]えて、自分[じぶん]たちのために王[おう]を求[もと]めたからだ。」"
  20: "サムエルは民[たみ]に言[い]った。「恐[おそ]れるな。あなたがたはこのすべての悪[あく]を行[おこな]った。ただ、主[しゅ]から離[はな]れて背[そむ]いてはならない。あなたがたの心[こころ]をすべて尽[つ]くして主[しゅ]に仕[つか]えなさい。"
  21: "また、何[なに]もない者[もの]たちに従[したが]って、それてはならない。彼[かれ]らは何[なに]の役[やく]にも立[た]たず、救[すく]い出[だ]すこともできない。彼らは何でもないからだ。"
  22: "主[しゅ]はご自分[じぶん]の大[おお]きな名[な]のゆえに、ご自分の民[たみ]を捨[す]てられない。主[しゅ]があなたがたを、ご自分[じぶん]の民[たみ]として恵[めぐ]み深[ぶか]く受け入れられたからだ。"
  23: "わたしもまた、あなたがたのために祈[いの]ることをやめて主[しゅ]に罪[つみ]を犯[おか]すようなことは、決[けっ]してしない。わたしは主[しゅ]に仕[つか]え、あなたがたに良[よ]く正[ただ]しい道[みち]を示[しめ]す。"
  24: "ただ、主[しゅ]を恐[おそ]れ、真実[しんじつ]をもって、あなたがたの心[こころ]をすべて尽[つ]くして主[しゅ]に仕[つか]えなさい。主[しゅ]があなたがたに対してなさった大[おお]きなことを、あなたがたは見[み]たからだ。"
  25: "もしあなたがたが悪[あく]をもって悪[あく]を行[おこな]うなら、あなたがたも、あなたがたの王[おう]も、ともに滅[ほろ]びに加[くわ]えられる。」"

notes:
  1: "ἤκουσα φωνῆς ὑμῶν εἰς πάντα — послушал голоса вашего во всём (ἀκούω с род.). ἐβασίλευσα ἐφ᾽ ὑμᾶς βασιλέα — поставил над вами царя (βασιλεύω — «воцарять»)."
  2: "διαπορεύεται ἐνώπιον ὑμῶν — ходит, идёт перед вами. γεγήρακα καὶ καθήσομαι — состарился и сижу (в ru «поседел» — по МТ). οἱ υἱοί μου … ἐν ὑμῖν — сыновья мои с вами. ἐκ νεότητός μου — от юности моей."
  3: "ἀποκρίθητε κατ᾽ ἐμοῦ — отвечайте против меня, т. е. свидетельствуйте. χριστοῦ αὐτοῦ — помазанника Его (χριστός). μόσχον τίνος εἴληφα — чьего тельца я взял. κατεδυνάστευσα — притеснил (καταδυναστεύω). ἐξεπίεσα — «выжал», угнетал (ἐκπιέζω). ἐξίλασμα καὶ ὑπόδημα — выкуп и обувь (слав. «мзду или обущу»; в ru «дар…» — по МТ). ἀποδώσω ὑμῖν — возвращу вам."
  4: "ἠδίκησας — обидел (ἀδικέω). κατεδυνάστευσας — притеснил. ἔθλασας — сокрушил (θλάω). οὐκ εἴληφας … οὐδέν — ничего не взял."
  5: "Μάρτυς κύριος ἐν ὑμῖν — свидетель Господь среди вас (против вас). χριστὸς αὐτοῦ — помазанник Его. οὐχ εὑρήκατε ἐν χειρί μου οὐθέν — не нашли в руке моей ничего. Μάρτυς — свидетель (ответ народа)."
  6: "Μάρτυς κύριος ὁ ποιήσας τὸν Μωυσῆν καὶ τὸν Ααρων — свидетель Господь, «сотворивший» Моисея и Аарона, т. е. поставивший их (ποιέω; слав. «сотворивый»). ὁ ἀναγαγὼν τοὺς πατέρας ἡμῶν — выведший отцов наших."
  7: "κατάστητε — предстаньте, станьте (καθίστημι). δικάσω ὑμᾶς — буду судиться, вести тяжбу с вами (δικάζω). τὴν πᾶσαν δικαιοσύνην κυρίου — всю правду, все праведные дела Господни (δικαιοσύνη; слав. «оправдания»)."
  8: "ὡς εἰσῆλθεν Ιακωβ — когда вошёл Иаков. ἐταπείνωσεν αὐτοὺς Αἴγυπτος — смирил их Египет. ἐβόησαν — возопили. κατῴκισεν — поселил (κατοικίζω). В ru «отцы ваши возопили» — по МТ."
  9: "ἀπέδοτο — предал, продал (ἀποδίδωμι). Σισαρα ἀρχιστρατήγου Ιαβιν βασιλέως Ασωρ — Сисары, военачальника Иавина, царя Асорского (アソル). εἰς χεῖρας ἀλλοφύλων — в руки филистимлян. ἐπολέμησαν ἐν αὐτοῖς — воевали с ними."
  10: "Ἡμάρτομεν — согрешили мы. ἐγκατελίπομεν — оставили (ἐγκαταλείπω). τοῖς Βααλιμ καὶ τοῖς ἄλσεσιν — Ваалам и рощам (ἄλσος — священная роща; в ru «Астартам» — по МТ). ἐξελοῦ — избавь (ἐξαιρέω)."
  11: "Ιεροβααλ — Иероваал (в корпусе Суд 6–7 — エルバアル). Βαρακ — Варак (バラク). Ιεφθαε — Иеффай (エフタ). ἐξείλατο — избавил. τῶν κυκλόθεν — окрестных. κατῳκεῖτε πεποιθότες — жили в безопасности, уповая (πείθω, перфект)."
  12: "Ναας βασιλεὺς υἱῶν Αμμων — Наас, царь сынов Аммона. Οὐχί, ἀλλ᾽ ἤ — «нет, но только». βασιλεὺς βασιλεύσει ἐφ᾽ ἡμῶν — царь будет царствовать над нами. κύριος ὁ θεὸς ἡμῶν βασιλεὺς ἡμῶν — Господь Бог наш — царь наш (в ru «ваш»)."
  13: "ὃν ἐξελἐξασθε — которого вы избрали (ἐκλέγομαι). δέδωκεν κύριος ἐφ᾽ ὑμᾶς βασιλέα — дал Господь над вами царя."
  14: "ἐὰν φοβηθῆτε — если убоитесь. ἀκούσητε τῆς φωνῆς — послушаете гласа (род.). μὴ ἐρίσητε τῷ στόματι κυρίου — не препирайтесь с устами Господа (ἐρίζω — спорить, противиться). ὀπίσω κυρίου πορευόμενοι — ходя вслед Господа. Аподосиса в gr нет: стих обрывается на условии; в csl добавлено «то рука Господня не будет на вас» — в текст не внесено."
  15: "ἐὰν δὲ μή — если же нет. ἔσται χεὶρ κυρίου ἐπὶ ὑμᾶς — будет рука Господня на вас. В ru добавлено «как была против отцов ваших» — по МТ."
  16: "κατάστητε καὶ ἴδετε — станьте и увидьте. τὸ ῥῆμα τὸ μέγα — великое слово, дело (ῥῆμα). ἐν ὀφθαλμοῖς ὑμῶν — пред глазами вашими."
  17: "θερισμὸς πυρῶν — жатва пшеницы (θερισμός, πυρός). ἐπικαλέσομαι — воззову (ἐπικαλέω). φωνὰς καὶ ὑετόν — громы и дождь (φωνή — «голос», здесь гром; ὑετός — дождь). ἡ κακία ὑμῶν μεγάλη — злоба ваша велика."
  18: "ἐπεκαλέσατο — воззвал. ἔδωκεν … φωνὰς καὶ ὑετόν — дал громы и дождь. ἐφοβήθησαν … τὸν κύριον σφόδρα καὶ τὸν Σαμουηλ — сильно убоялись Господа и Самуила."
  19: "Πρόσευξαι ὑπὲρ τῶν δούλων σου — помолись о рабах твоих. οὐ μὴ ἀποθάνωμεν — да не умрём (усиленное отрицание). προστεθείκαμεν … κακίαν — прибавили злобу (προστίθημι). αἰτήσαντες ἑαυτοῖς βασιλέα — просив себе царя."
  20: "Μὴ φοβεῖσθε — не бойтесь. πεποιήκατε τὴν πᾶσαν κακίαν — сделали всё это зло. μὴ ἐκκλίνητε ἀπὸ ὄπισθεν κυρίου — не уклоняйтесь от следования за Господом (ἐκκλίνω). ἐν ὅλῃ καρδίᾳ — всем сердцем."
  21: "τοὺς μηθὲν ὄντας — тех, которые ничто (μηδέν). παραβῆτε — переступите, уклонитесь (παραβαίνω). οὐ περανοῦσιν οὐθέν — ничего не принесут, не помогут (περαίνω — доводить до конца). οὐκ ἐξελοῦνται — не избавят."
  22: "οὐκ ἀπώσεται — не отвергнет (ἀπωθέω). διὰ τὸ ὄνομα αὐτοῦ τὸ μέγα — ради великого имени Своего. ἐπιεικέως — кротко, благосклонно (ἐπιεικής; слав. «кротце»). προσελάβετο ὑμᾶς αὑτῷ εἰς λαόν — принял вас Себе в народ (προσλαμβάνω)."
  23: "μηδαμῶς τοῦ ἁμαρτεῖν — да не будет греха. ἀνιέναι τοῦ προσεύχεσθαι — оставить молиться (ἀνίημι). δουλεύσω τῷ κυρίῳ — буду служить Господу. δείξω … ὁδὸν τὴν ἀγαθὴν καὶ τὴν εὐθεῖαν — покажу путь добрый и прямой."
  24: "πλὴν φοβεῖσθε — только бойтесь. ἐν ἀληθείᾳ — в истине. εἴδετε ἃ ἐμεγάλυνεν μεθ᾽ ὑμῶν — видели, что Он совершил великое с вами (μεγαλύνω)."
  25: "κακίᾳ κακοποιήσητε — злом будете делать зло. προστεθήσεσθε — «будете приложены» (к отцам, т. е. погибнете; слав. «погибнете»)."
