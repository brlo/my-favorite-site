# jp-box, 1-я Царств, глава 12. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc и jp-ni в книге нет.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы — по греческому.
# Глава 12: Самуил свидетельствует о своей непорочности (1–5), напоминает
# о благодеяниях Божиих от Иакова до судей (6–11), народ просил царя (12–15),
# знамение — гром и дождь (16–18), исповедание народа и ободрение (19–25).
# Речи — 「…」: Самуил (1–3, 5, 6–17, 20–25), народ (4, 5, 19). Слова народа,
# приводимые Самуилом, — 『…』 (10, 12). Красного нет.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (проверено по базе); слав.
# аподосис в 12:14 в текст не внесён — см. notes.
# Сносок ⟨…⟩ нет: все термины (契約, 王, 預言者, 嗣業) уже пояснены в корпусе.
# Отличия LXX: 12:2 — γεγήρακα καὶ καθήσομαι «состарился и сижу» (в ru «поседел»);
# 12:3 — ἐξίλασμα καὶ ὑπόδημα «выкуп и обувь» (слав. «мзду или обущу», в ru «дар…»);
# 12:6 — «сотворивший Моисея и Аарона», т. е. поставивший их; 12:9 — Сисара,
# военачальник Иавина, царя Асорского; 12:10 — ἄλσεσιν «рощам» (в ru «Астартам»);
# 12:11 — Ιεροβααλ (в корпусе Суд — エルバアル); 12:12 — gr «наш» (ἡμῶν), в ru «ваш»;
# 12:14 — в csl добавлено «то рука Господня не будет на вас», в gr аподосиса нет;
# 12:15 — в ru добавлено «как была против отцов ваших» (по МТ).

