verses:
  1: "聖[せい]なる都[みやこ]がまったき平和[へいわ]のうちに住[す]まわれ、律法[りっぽう]がたいそうよく守[まも]られていたのは、大祭司[だいさいし]オニアスの敬虔[けいけん]さと悪[あく]を憎[にく]む心[こころ]のゆえであった。"
  2: "そのため、王[おう]たち自身もこの場所[ばしょ]を敬[うやま]い、神殿[しんでん]を最[さい]上の贈[おく]り物[もの]で輝[かがや]かせた。"
  3: "アジアの王[おう]セレウコスさえ、自分の収入[しゅうにゅう]から、犠牲[ぎせい]の務[つと]めに必要[ひつよう]なすべての出費[しゅっぴ]を支[ささ]えていた。"
  4: "さて、ベニヤミンの部族[ぶぞく]の者[もの]で、神殿[しんでん]の守[まも]りとして立[た]てられたシモンという者[もの]が、都[みやこ]の市場[いちば]の監督[かんとく]をめぐって大祭司[だいさいし]と争[あらそ]った。"
  5: "そして、オニアスに勝[か]つことができなかったので、そのころケレ・シリアとフェニキアの将軍[しょうぐん]であったタルセウの子[こ]アポロニオスのもとへ行[い]った。"
  6: "そして、エルサレムの宝物庫[ほうもつこ]が言[い]い表[あらわ]せない富[とみ]で満[み]ち、さまざまな品[しな]の数[かず]は数[かぞ]えきれず、それらは犠牲[ぎせい]のためのものではないこと、また、それらが王[おう]の権力[けんりょく]の下[した]に落[お]ちることもありうると告[つ]げた。"
  7: "アポロニオスは王[おう]に会[あ]って、自分に知[し]らされた富[とみ]のことを明[あき]らかにした。王は、政務[せいむ]をつかさどるヘリオドロスを選[えら]んで遣[つか]わし、先[さき]に述[の]べた富[とみ]を運[はこ]び出[だ]すように命[めい]じた。"
  8: "ヘリオドロスはただちに旅[たび]立[だ]った。見[み]かけはケレ・シリアとフェニキアの町[まち]々[まち]を見[み]て回[まわ]るためであったが、実際[じっさい]には王[おう]の意図[いと]を果[は]たすためであった。"
  9: "エルサレムに着[つ]き、都[みやこ]の大祭司[だいさいし]に親[した]しく迎[むか]えられた彼[かれ]は、自分に示[しめ]されたことを語[かた]り、何[なん]のために来[き]たのかを明[あき]らかにした。そして、本当[ほんとう]にそうなのかと尋[たず]ねた。"
  10: "大祭司[だいさいし]は、それがやもめたちと孤児[こじ]たちの預[あず]け物[もの]であることを示[しめ]した。"
  11: "またその一部[いちぶ]は、たいそう名[な]の高[たか]い人[ひと]であるトビアの子[こ]ヒルカノスのものであった。不敬[ふけい]なシモンはそのように中傷[ちゅうしょう]していたのである。そして、すべてを合[あ]わせると銀[ぎん]四百[よんひゃく]タラント、金[きん]二百[にひゃく]タラントであった。"
  12: "この場所[ばしょ]の聖[せい]なることと、全[ぜん]世[せ]界[かい]で尊[たっと]ばれている神殿[しんでん]の威厳[いげん]と不可侵[ふかしん]を信[しん]じている者[もの]たちをだますことは、まったくできないことであった。"
  13: "しかしヘリオドロスは、自分が持[も]っている王[おう]の命令[めいれい]のゆえに、これらは必[かなら]ず王の宝庫[ほうこ]に納[おさ]められるべきだと言[い]い張[は]った。"
  14: "そして日[ひ]を定[さだ]めて、これらを検査[けんさ]しようとして入[はい]った。都[みやこ]の全体[ぜんたい]には少[すこ]しならぬ動揺[どうよう]が起[お]こった。"
  15: "祭司[さいし]たちは祭壇[さいだん]の前[まえ]で祭司の衣[ころも]をまとって身[み]を投[な]げ出[だ]し、預[あず]け物[もの]について律法[りっぽう]を定[さだ]められた方[かた]を天[てん]に呼[よ]び求[もと]めて、これを預けた者[もの]たちのために無事[ぶじ]に守[まも]られるようにと願[ねが]った。"
  16: "大祭司[だいさいし]の姿[すがた]を見[み]る者[もの]は、その心[こころ]を深[ふか]く傷[きず]つけられた。顔[かお]つきと変[か]わった色[いろ]が、魂[たましい]の苦[くる]しみを現[あらわ]していたからである。"
  17: "その人[ひと]には恐怖[きょうふ]と体[からだ]の震[ふる]えがまとわりつき、それによって、見[み]る者[もの]たちにその心[こころ]にある苦[くる]しみがありありと示[しめ]された。"
  18: "また人[ひと]々[びと]は家[いえ]から群[む]れになって飛[と]び出[だ]し、この場所[ばしょ]が侮[あなど]られることになるというので、こぞって嘆願[たんがん]した。"
  19: "女[おんな]たちは胸[むね]の下[した]に粗布[あらぬの]を帯[お]びて通[とお]りに満[み]ちあふれ、閉[と]じ込[こ]められた処女[しょじょ]たちは、ある者[もの]は門[もん]へ、ある者は城壁[じょうへき]へと駆[か]け寄[よ]り、ある者は窓[まど]から身[み]を乗[の]り出[だ]した。"
  20: "彼女[かのじょ]たちはみな天[てん]へ向[む]かって手[て]を差[さ]し伸[の]べ、祈[いの]りをささげた。"
  21: "民[たみ]の混[こ]んざり合[あ]ったひれ伏[ふ]しと、ひどく苦[くる]しむ大祭司[だいさいし]の待[ま]ち望[のぞ]む様[さま]は、あわれみを誘[さそ]うものであった。"
  22: "彼らは全能[ぜんのう]の主[しゅ]に、預[あず]けられたものを預けた者[もの]たちのために、まったき安全[あんぜん]をもって無事[ぶじ]に守[まも]られるようにと願[ねが]った。"
  23: "ヘリオドロスは決[けっ]めたことを実行[じっこう]していた。"
  24: "彼[かれ]が護衛[ごえい]たちとともにすでに宝物庫[ほうもつこ]のそばにいたとき、霊[れい]とすべての権威[けんい]の主[ぬし]は大[おお]きな現[あら]われを見[み]せられた。それで、一緒[いっしょ]に入[はい]ろうと大胆[だいたん]にも企[くわだ]てた者[もの]たちはみな、神[かみ]の力[ちから]に打[う]たれて、力[ちから]を失[うしな]い恐[おそ]れに変[か]えられた。"
  25: "というのは、彼らに、恐[おそ]ろしい騎手[きしゅ]を乗[の]せた、最[さい]上の飾[かざ]りで装[よそお]われた馬[うま]が現[あら]われ、激[はげ]しく駆[か]けて来[き]て、前[まえ]足[あし]でヘリオドロスを打[う]ったからである。その上[うえ]にまたがる者[もの]は金色[きんいろ]の武具[ぶぐ]をつけているように見[み]えた。"
  26: "また、力[ちから]にあふれ、顔[かお]かたちも心[こころ]も美[うつく]しく、衣[ころも]もきらびやかな二人[ふたり]の若者[わかもの]が彼[かれ]に現[あら]われ、彼の両[りょう]側[がわ]に立[た]って絶[た]え間[ま]なくむち打[う]ち、多[おお]くの打[う]ち傷[きず]を負[お]わせた。"
  27: "彼[かれ]は突然[とつぜん]地[ち]に倒[たお]れ、濃[こ]い闇[やみ]に包[つつ]まれた。そこで人[ひと]々[びと]は彼を抱[だ]き起[お]こして担架[たんか]に載[の]せ、"
  28: "たった今[いま]、大[おお]きな従者[じゅうしゃ]とすべての護衛[ごえい]を連[つ]れてあの宝物庫[ほうもつこ]に入[はい]った者[もの]を、何[なに]の助[たす]けもないまま運[はこ]び出[だ]した。彼らはそこではっきりと神[かみ]の力を知[し]ったのである。"
  29: "そして彼[かれ]は、神[かみ]の働[はたら]きによって口[くち]もきけず、すべての希望[きぼう]と救[すく]いを奪[うば]われて横[よこ]たわっていた。"
  30: "人[ひと]々[びと]は、自分[じぶん]の場所[ばしょ]に栄光[えいこう]を現[あら]わされた主[しゅ]をほめたたえた。つい先[さき]まで恐怖[きょうふ]と動揺[どうよう]に満[み]ちていた神殿[しんでん]は、全能[ぜんのう]の主[しゅ]の現[あら]われによって喜[よろこ]びと楽しみに満ちた。"
  31: "やがて、ヘリオドロスの身[み]近[ぢか]な者[もの]たちの幾人[いくにん]かが、オニアスに、いまにも息[いき]が絶[た]えようとしているこの人[ひと]のために、いと高[たか]い方[かた]を呼[よ]び求め、命[いのち]を授[さず]けてくださるようにと頼[たの]んだ。"
  32: "大祭司[だいさいし]は、王[おう]が、ユダヤ人[じん]がヘリオドロスに対して何[なに]か悪[わる]だくらみをしたと考[かんが]えるのではないかと心配[しんぱい]して、この人[ひと]の救[すく]いのために犠牲[ぎせい]を捧[ささ]げた。"
  33: "大祭司[だいさいし]がとりなしをしていると、あの二人[ふたり]の若者[わかもの]が、同[おな]じ衣[ころも]をまとって再[ふたた]びヘリオドロスの前に現[あら]われ、立[た]って言[い]った。「大祭司[だいさいし]オニアスに大[おお]きな感謝[かんしゃ]をささげなさい。彼[かれ]のゆえに、主[しゅ]はあなたに命[いのち]を授[さず]けられたのだから。"
  34: "しかし、あなたは天[てん]から打[う]たれた者[もの]として、すべての人[ひと]に神[かみ]の大[おお]いなる力[ちから]を告[つ]げ知[し]らせなさい。」こう言[い]って、彼らは見[み]えなくなった。"
  35: "ヘリオドロスは主[しゅ]に犠牲[ぎせい]を捧[ささ]げ、命[いのち]を保[たも]たれた方[かた]に最[さい]大[だい]の誓[ちか]いを立[た]て、オニアスに感謝[かんしゃ]してから、軍[ぐん]を率[ひき]いて王[おう]のもとへ帰[かえ]った。"
  36: "そして、最[さい]大[だい]なる神[かみ]の行[おこな]いのうち、自分[じぶん]が目[め]の当[あ]たりにしたことを、すべての人[ひと]に証[あかし]した。"
  37: "王[おう]がヘリオドロスに、もう一度[いちど]エルサレムへ遣[つか]わすのにふさわしい者[もの]はだれかと尋[たず]ねると、彼は言[い]った。"
  38: "「もし敵[てき]や、あなたの政務[せいむ]をねらう者[もの]がいたら、その者をそこへ遣[つか]わしなさい。たとえ命[いのち]が助[たす]かったとしても、むち打たれて帰[かえ]って来[く]るでしょう。この場所[ばしょ]にはほんとうに神[かみ]の力[ちから]があるのですから。"
  39: "天[てん]に住[す]まいを持[も]たれる方[かた]ご自身が、あの場所[ばしょ]の見張[みは]り人[びと]、助[たす]け主[ぬし]であって、害[がい]を加[くわ]えようとして来[く]る者[もの]を打[う]って滅[ほろ]ぼされるのです。」"
  40: "ヘリオドロスと宝物庫[ほうもつこ]の守[まも]りのことは、このように運[はこ]んだのである。"

notes:
  1: "Τῆς ἁγίας πόλεως κατοικουμένης μετὰ πάσης εἰρήνης — «святому городу обитаему быть со всяким миром»: генитив с причастием, передано «…ので»; τῶν νόμων ὅτι κάλλιστα συντηρουμένων — «законы наилучшим образом соблюдались»; διὰ τὴν Ονιου τοῦ ἀρχιερέως εὐσέβειάν τε καὶ μισοπονηρίαν — «ради благочестия и ненависти ко злу первосвященника Онии» (μισοπονηρία — ненависть к пороку)."
  2: "συνέβαινεν καὶ αὐτοὺς τοὺς βασιλεῖς τιμᾶν τὸν τόπον — «случалось, что и сами цари чтили место»; ἀποστολαῖς ταῖς κρατίσταις δοξάζειν — «отличнейшими приношениями прославлять» (ἀποστολή — посылка, доставка даров)."
  3: "Σέλευκον τὸν τῆς Ἀσίας βασιλέα — «Селевка, царя Азии» (セレウコス); χορηγεῖν ἐκ τῶν ἰδίων προσόδων — «доставлять из собственных доходов»; πάντα τὰ πρὸς τὰς λειτουργίας τῶν θυσιῶν ἐπιβάλλοντα δαπανήματα — «все надлежащие издержки на служения жертв»."
  4: "προστάτης τοῦ ἱεροῦ καθεσταμένος — «поставленный предстоятелем (попечителем) храма»; διηνέχθη τῷ ἀρχιερεῖ — «был в раздоре с первосвященником»; περὶ τῆς κατὰ τὴν πόλιν ἀγορανομίας — «о надзоре за рынком (порядком) в городе» (ἀγορανομία); ru понял иначе («о нарушении законов»), в текст не внесено."
  5: "νικῆσαι τὸν Ονιαν μὴ δυνάμενος — «не могши победить Онию»; Ἀπολλώνιον Θαρσεου — «Аполлония, сына Фарсея» (патронимик, タルセウの子); Κοίλης Συρίας καὶ Φοινίκης στρατηγόν — «военачальника Келе-Сирии и Финикии» (στρατηγός — 将軍[しょうぐん])."
  6: "χρημάτων ἀμυθήτων γέμειν τὸ γαζοφυλάκιον — «сокровищница полна несказанных богатств» (γαζοφυλάκιον — 宝物庫[ほうもつこ]); τὸ πλῆθος τῶν διαφόρων ἀναρίθμητον — «множество [ценного] неисчислимо» (τὰ διάφορα — ценности); μὴ προσήκειν αὐτὰ πρὸς τὸν τῶν θυσιῶν λόγον — «не относятся они к счёту жертв»; ὑπὸ τὴν τοῦ βασιλέως ἐξουσίαν πεσεῖν — «подпасть под власть царя»."
  7: "συμμείξας… τῷ βασιλεῖ — «сойдясь (встретившись) с царём»; ἐνεφάνισεν — «известил, представил» (ἐμφανίζω); ὁ ἐπὶ τῶν πραγμάτων — «поставленный над делами» (глава финансов); τὴν… ἐκκομιδὴν ποιήσασθαι — «вывоз произвести» (ἐκκομιδή)."
  8: "τῇ μὲν ἐμφάσει — «по видимости (изъявлению)»; τῷ πράγματι δέ — «на деле же»; τὴν τοῦ βασιλέως πρόθεσιν ἐπιτελεῖν — «намерение царя исполнить»."
  9: "φιλοφρόνως ὑπὸ τοῦ ἀρχιερέως ἀποδεχθείς — «дружелюбно первосвященником принят»; ἀνέθετο περὶ τοῦ γεγονότος ἐμφανισμοῦ — «сообщил о бывшем изъявлении (доносе)»; εἰ ταῖς ἀληθείαις ταῦτα οὕτως ἔχοντα τυγχάνει — «действительно ли это так есть»."
  10: "ὑποδείξαντος — «показавшего»; παρακαταθήκας εἶναι χηρῶν τε καὶ ὀρφανῶν — «что это вклады (вверенное на хранение) вдов и сирот» (παρακαταθήκη — 預[あず]け物[もの])."
  11: "Ὑρκανοῦ τοῦ Τωβιου σφόδρα ἀνδρὸς ἐν ὑπεροχῇ κειμένου — «Гиркана, сына Товии, мужа весьма в превосходстве (знатного)» (ヒルカノス, トビア); οὕτως ἦν διαβάλλων ὁ δυσσεβὴς Σιμων — «так клеветал нечестивый Симон»: вставка автора; τετρακόσια τάλαντα… διακόσια — «четыреста талантов… двести»."
  12: "τοὺς πεπιστευκότας τῇ τοῦ τόπου ἁγιωσύνῃ — «поверивших святости места»; τῇ τοῦ… ἱεροῦ σεμνότητι καὶ ἀσυλίᾳ — «достоинству и неприкосновенности (асилии) храма» (ἀσυλία — право убежища, 不可侵[ふかしん]); ἀμήχανον — «невозможно»."
  13: "δι' ἃς εἶχεν βασιλικὰς ἐντολάς — «ради имевшихся у него царских повелений»; πάντως ἔλεγεν — «решительно говорил»; εἰς τὸ βασιλικὸν ἀναλημπτέα — «в царское [хранилище] подлежит взять»."
  14: "ταξάμενος ἡμέραν — «назначив день»; τὴν περὶ τούτων ἐπίσκεψιν οἰκονομήσων — «чтобы устроить осмотр этого» (ἐπίσκεψις — осмотр, 検査[けんさ]); ἀγωνία — «борьба, смятение» (動揺[どうよう])."
  15: "ἐν ταῖς ἱερατικαῖς στολαῖς — «в священнических облачениях»; ῥίψαντες ἑαυτούς — «повергшись» (ῥίπτω); τὸν περὶ παρακαταθήκης νομοθετήσαντα — «Законодателя о вверенном»; σῶα διαφυλάξαι — «в целости сохранить»."
  16: "τιτρώσκεσθαι τὴν διάνοιαν — «быть уязвляему в мыслях» (τιτρώσκω — ранить, 傷[きず]つける); τὸ τῆς χρόας παρηλλαγμένον — «изменение цвета [лица]» (χρόα — цвет кожи); τὴν κατὰ ψυχὴν ἀγωνίαν — «душевное борение»."
  17: "περιεκέχυτο… δέος τι καὶ φρικασμὸς σώματος — «объял его некий страх и трепет тела» (φρικασμός — содрогание); τὸ κατὰ καρδίαν ἐνεστὸς ἄλγος — «настоящая в сердце боль» (ἄλγος — боль, 苦[くる]しみ)."
  18: "ἀγεληδὸν ἐξεπήδων — «толпами выбегали» (ἀγεληδόν — стаями); ἐπὶ πάνδημον ἱκετείαν — «на всенародное моление» (ἱκετεία — 嘆願[たんがん]); εἰς καταφρόνησιν ἔρχεσθαι τὸν τόπον — «месту прийти в презрение (поругание)»."
  19: "ὑπεζωσμέναι ὑπὸ τοὺς μαστοὺς… σάκκους — «опоясанные под грудью вретищами» (σάκκος — 粗布[あらぬの]); αἱ κατάκλειστοι τῶν παρθένων — «затворницы из дев»; διὰ τῶν θυρίδων διεξέκυπτον — «через окна выглядывали» (θυρίς — оконце)."
  20: "προτείνουσαι τὰς χεῖρας εἰς τὸν οὐρανόν — «простирая руки к небу»; ἐποιοῦντο τὴν λιτανείαν — «совершали моление» (λιτανεία — литания)."
  21: "ἐλεεῖν δ' ἦν — «жалко было видеть» (ἐλεέω — жалеть); τὴν τοῦ πλήθους παμμιγῆ πρόπτωσιν — «всесмешанное падение (повержение) народа» (παμμιγής — всесмешанный); τὴν… τοῦ μεγάλως ἀγωνιῶντος ἀρχιερέως προσδοκίαν — «ожидание сильно смущающегося первосвященника»."
  22: "τὸν παγκρατῆ κύριον — «вседержителя Господа» (παγκρατής — всесильный, 全能[ぜんのう]); τὰ πεπιστευμένα τοῖς πεπιστευκόσιν σῶα διαφυλάσσειν — «вверенное вверившим в целости сохранить»; μετὰ πάσης ἀσφαλείας — «со всякой безопасностью»."
  23: "τὸ διεγνωσμένον ἐπετέλει — «решённое исполнял» (διαγινώσκω — решать). Стих короткий, как и в gr."
  24: "ὁ τῶν πνευμάτων καὶ πάσης ἐξουσίας δυνάστης — «Владыка духов и всякой власти»; ἐπιφάνειαν μεγάλην ἐποίησεν — «сотворил великое явление»; τοὺς κατατολμήσαντας συνελθεῖν — «дерзнувших вместе войти» (κατατολμάω); εἰς ἔκλυσιν καὶ δειλίαν τραπῆναι — «обратиться в расслабление и трусость» (ἔκλυσις — расслабление)."
  25: "ἵππος… φοβερὸν ἔχων τὸν ἐπιβάτην — «конь, имеющий страшного всадника»; καλλίστῃ σαγῇ διακεκοσμημένος — «украшенный прекраснейшей попоной» (σαγή — попона); φερόμενος ῥύδην ἐνέσεισεν… τὰς ἐμπροσθίους ὁπλάς — «несясь стремительно, ударил передними копытами» (ὁπλή — копыто); χρυσῆν πανοπλίαν — «золотое всеоружие» (πανοπλία)."
  26: "νεανίαι τῇ ῥώμῃ μὲν ἐκπρεπεῖς — «юноши, силой выдающиеся»; κάλλιστοι δὲ τὴν δόξαν — «прекраснейшие по виду (славе)»; διαπρεπεῖς τὴν περιβολήν — «отличные одеянием» (περιβολή); ἐμαστίγουν ἀδιαλείπτως — «непрестанно бичевали»."
  27: "ἄφνω… πεσόντα πρὸς τὴν γῆν — «внезапно упавшего на землю»; πολλῷ σκότει περιχυθέντα — «объятого великой тьмой»; εἰς φορεῖον ἐνθέντες — «положив на носилки» (φορεῖον — 担架[たんか])."
  28: "μετὰ πολλῆς παραδρομῆς — «с великим разбегом (свитой)» (παραδρομή — набег, сопровождение); πάσης δορυφορίας — «всякой охраны» (δορυφορία — копьеносцы); ἀβοήθητον ἑαυτῷ καθεστῶτα — «ставшего себе беспомощным»; φανερῶς τὴν τοῦ θεοῦ δυναστείαν ἐπεγνωκότες — «явно познав силу Божию» (δυναστεία)."
  29: "διὰ τὴν θείαν ἐνέργειαν — «по божественному действию»; ἄφωνος — «безгласный»; πάσης ἐστερημένος ἐλπίδος καὶ σωτηρίας — «лишённый всякой надежды и спасения»; ἔρριπτο — «лежал поверженный»."
  30: "τὸν παραδοξάζοντα τὸν ἑαυτοῦ τόπον — «прославляющего (делающего дивным) Своё место»; τὸ μικρῷ πρότερον δέους καὶ ταραχῆς γέμον ἱερόν — «храм, незадолго прежде полный страха и смятения»; χαρᾶς καὶ εὐφροσύνης ἐπεπλήρωτο — «исполнился радости и веселия»."
  31: "τῶν τοῦ Ἡλιοδώρου συνήθων — «из близких (знакомых) Илиодора»; ἠξίουν τὸν Ονιαν ἐπικαλέσασθαι τὸν ὕψιστον — «просили Онию призвать Всевышнего»; τὸ ζῆν χαρίσασθαι τῷ… ἐν ἐσχάτῃ πνοῇ κειμένῳ — «даровать жизнь лежащему при последнем дыхании» (πνοή — дыхание)."
  32: "ὕποπτος γενόμενος… μήποτε διάλημψιν ὁ βασιλεὺς σχῇ — «заподозрив, как бы царь не получил мнения» (διάλημψις — мнение); κακουργίαν τινὰ περὶ τὸν Ἡλιόδωρον… συντετελέσθαι — «что некое злодейство против Илиодора совершено»; προσήγαγεν θυσίαν ὑπὲρ τῆς τοῦ ἀνδρὸς σωτηρίας — «принёс жертву за спасение мужа»."
  33: "τὸν ἱλασμὸν — «умилостивление» (ἱλασμός); ἐν ταῖς αὐταῖς ἐσθήσεσιν ἐστολισμένοι — «облечённые в те же одежды»; Πολλὰς… χάριτας ἔχε — «великую благодарность воздай»; διὰ γὰρ αὐτὸν σοι κεχάρισται τὸ ζῆν ὁ κύριος — «ибо ради него Господь даровал тебе жизнь». Слова юношей в 「…」, продолжаются в 34."
  34: "ἐξ οὐρανοῦ μεμαστιγωμένος — «с неба бичеванный (наказанный)»; διάγγελλε πᾶσι τὸ μεγαλεῖον τοῦ θεοῦ κράτος — «возвещай всем великое могущество Бога»; ἀφανεῖς ἐγένοντο — «стали невидимы». Здесь речь юношей закрывается."
  35: "θυσίαν ἀνενέγκας τῷ κυρίῳ — «принеся жертву Господу»; εὐχὰς μεγίστας εὐξάμενος — «дав величайшие обеты» (εὐχή — обет); τῷ τὸ ζῆν περιποιήσαντι — «Сохранившему жизнь» (περιποιέω); ἀνεστρατοπέδευσεν πρὸς τὸν βασιλέα — «отправился с войском к царю»."
  36: "ἐξεμαρτύρει δὲ πᾶσιν — «свидетельствовал всем» (ἐκμαρτυρέω); ἅπερ ἦν ὑπ' ὄψιν τεθεαμένος — «что видел своими глазами»; ἔργα τοῦ μεγίστου θεοῦ — «дела величайшего Бога»."
  37: "ποῖός τις εἴη ἐπιτήδειος ἔτι ἅπαξ διαπεμφθῆναι — «кто был бы пригоден ещё раз быть послан»; ἔφησεν — «сказал»."
  38: "Εἴ τινα ἔχεις πολέμιον ἢ πραγμάτων ἐπίβουλον — «если имеешь какого врага или противника делам»; μεμαστιγωμένον αὐτὸν προσδέξῃ — «примешь его избитым»; ἐάνπερ καὶ διασωθῇ — «если только и спасётся»; εἶναί τινα θεοῦ δύναμιν — «есть некая сила Божия»."
  39: "ὁ τὴν κατοικίαν ἐπουράνιον ἔχων — «имеющий жилище на небесах»; ἐπόπτης ἐστὶν καὶ βοηθὸς ἐκείνου τοῦ τόπου — «есть надзиратель и помощник того места» (ἐπόπτης — надзиратель, 見張[みは]り人[びと]); τοὺς παραγινομένους ἐπὶ κακώσει τύπτων ἀπολλύει — «приходящих на зло, поражая, губит»."
  40: "καὶ τὰ μὲν κατὰ Ἡλιόδωρον καὶ τὴν τοῦ γαζοφυλακίου τήρησιν οὕτως ἐχώρησεν — «и дела по Илиодору и по охранению сокровищницы так произошли»: заключительная формула, ср. 15:37."
