# jp-box, 2 Маккавейская, глава 3. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной: 40 стихов, совпадает с gr.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1–3 мир в Иерусалиме при первосвященнике Онии, цари чтут храм,
# Селевк даёт на жертвы; 4–6 Симон из колена Вениаминова спорит с Онией и доносит
# Аполлонию о сокровищах; 7–14 царь посылает Илиодора вывезти их; 15–23 моление
# города; 24–30 явление коня и двух юношей, Илиодор вынесен безгласным,
# храм исполняется радости; 31–39 Илиодор приносит жертву, юноши говорят ему,
# он свидетельствует перед царём; 40 заключительная формула.
# Голоса: слова юношей 33–34 — 「…」 (закрывается в конце 34); речь Илиодора
# перед царём 38–39 — 「…」。 3:1 — генитив «при ...» (в тексте «…ので»).
# Имена: オニアス, ヘリオドロス, アポロニオス, セレウコス, シモン, ヒルカノス,
# トビア, ベニヤミン — новое; エルサレム, イスラエル, ケレ・シリア, フェニキア.
# Термины: 大祭司[だいさいし], 神殿[しんでん], 祭壇[さいだん], 犠牲[ぎせい],
# 異邦人[いほうじん], 嗣業[しぎょう], 聖所[せいしょ], 宝物庫[ほうもつこ].

