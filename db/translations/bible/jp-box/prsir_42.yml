verses:
  1: "次[つぎ]のことについて恥[は]じてはならない。罪[つみ]を犯[おか]すために、人[ひと]の顔[かお]をうかがってもならない。"
  2: "いと高[たか]き者[もの]の律法[りっぽう]と契[けい]約[やく]について、また、不[ふ]敬[けい]な者を正[ただ]しいとする裁[さば]きについて。"
  3: "仲[なか]間[ま]の言葉[ことば]と旅[たび]人[びと]について、また、友[とも]に遺[い]産[さん]を与[あた]えることについて。"
  4: "秤[はかり]と分[ぶん]量[りょう]の正[せい]確[かく]さについて、また、多[おお]くのものと少[すく]ないものの取[と]得[とく]について。"
  5: "商[しょう]人[にん]の売[う]り買[か]いの違[ちが]いについて、子[こ]どもへの十[じゅう]分[ぶん]な教[きょう]育[いく]について、また、悪[わる]い僕[しもべ]の脇腹[わきばら]を血[ち]まみれにすることについて。"
  6: "悪[わる]い妻[つま]のもとでは、封[ふう]印[いん]が良[よ]い。手[て]が多[おお]いところでは、鍵[かぎ]をかけておけ。"
  7: "何[なに]を渡[わた]すにも、数[かず]と重[おも]さを量[はか]って渡せ。与[あた]えることも受[う]け取[と]ることも、すべて書[しょ]面[めん]にしておけ。"
  8: "思慮[しりょ]のない者[もの]と愚[おろ]かな者、また、若[わか]い者たちと争[あらそ]う老[ろう]人[じん]を教[きょう]え導[みちび]くことについて。そうすれば、あなたは真[しん]に教[おし]えを受[う]けた者となり、すべていきとし生[い]ける者の前[まえ]で認[みと]められる。"
  9: "娘[むすめ]は父[ちち]にとって隠[かく]れた眠[ねむ]らぬ夜[よる]であり、その心配[しんぱい]は眠りを遠[とお]ざける。娘が若[わか]い時[とき]には朽[く]ちてしぼまないように、嫁[とつ]いだ後[あと]には憎[にく]まれないように。"
  10: "処[しょ]女[じょ]の時[とき]には汚[けが]されず、父[ちち]の家[いえ]で身[み]ごもらないように。夫[おっと]とともにいる時には道[みち]を踏[ふ]み外[はず]さず、嫁[とつ]いだ後[あと]には子[こ]を宿[やど]せなくならないように。"
  11: "厚[あつ]かましい娘[むすめ]には見張[みは]りを固[かた]めよ。娘があなたを敵[てき]の喜[よろこ]びとし、町[まち]の噂[うわさ]と民[たみ]から追[お]い出[だ]された者[もの]とし、多[おお]くの者の間[あいだ]であなたを辱[はずかし]めないように。"
  12: "どんな人[ひと]の美[うつく]しさにも目[め]を向[む]けず、女[おんな]たちの中[なか]に座[すわ]ってはならない。"
  13: "衣[い]服[ふく]からは虫[むし]が、女[おんな]からは女の悪[わる]だくみが生[う]まれるからである。"
  14: "男[おとこ]の悪[わる]さは、善[よ]い行[おこな]いをする女[おんな]よりもましであり、辱[はずかし]めをもたらす女はなおさらである。"
  15: "わたしは今[いま]、主[しゅ]のわざを思[おも]い起[おこ]し、見[み]たことを語[かた]ろう。主の言葉[ことば]のうちに、そのわざがある。"
  16: "光[ひかり]を放[はな]つ太陽[たいよう]はすべても見[み]渡[わた]し、主[しゅ]のわざはその栄光[えいこう]に満[み]ちている。"
  17: "主[しゅ]は、その聖[せい]なる者[もの]たちに、驚[おどろ]くべきわざをすべても語[かた]り尽[つ]くさせはしなかった。全能者[ぜんのうしゃ]である主が、すべてのものがその栄光[えいこう]のうちに立[た]つようにと定[さだ]めた、そのわざを。"
  18: "主[しゅ]は深[しん]淵[えん]と心[こころ]を探[さぐ]り、彼[かれ]らの計[けい]略[りゃく]のうちを見[み]通[とお]した。いと高[たか]き者[もの]はすべての知識[ちしき]を知[し]り、世[よ]の時[とき]のしるしに目[め]を注[そそ]いだからである。"
  19: "過[か]去[こ]のことをも、これからのことをも告[つ]げ知[し]らせ、隠[かく]されたものの足[あし]跡[あと]を現[あら]わす。"
  20: "どんな思[おも]いも主[しゅ]を通[とお]り過[す]ぎることはなく、一[ひと]つの言葉[ことば]も主から隠[かく]れない。"
  21: "主[しゅ]は知恵[ちえ]の偉[い]大[だい]さを整[ととの]えられた。それは世[よ]の始[はじ]めより前[まえ]から、世の終[お]わりまで変[か]わらない。"
  22: "主は増[ふ]えもせず、減[へ]りもせず、だれの助言[じょげん]も要[い]しなかった。"
  23: "そのわざはすべて、なんと慕[した]わしく、見[み]る者[もの]には火花[ひばな]のように思われることか。"
  24: "これらはすべて生[い]き、あらゆる必要[ひつよう]のために永遠[えいえん]に保[たも]たれ、すべては従[したが]う。"
  25: "すべてのものは二[に]つずつ、一[ひと]つが他[ほか]の一つと向[む]かい合[あ]う。何[なに]ひとつ足[た]りないものは造[つく]られなかった。"
  26: "一[ひと]つは他[ほか]の一つによって善[ぜん]を固[かた]める。その栄光[えいこう]を見[み]て、だれが満[み]たされるだろうか。"

notes:
  1: "Μὴ περὶ τούτων αἰσχυνθῇς — «не стыдись этого»: περί с род. указывает предмет стыда; далее идёт перечень (1–8). μὴ λάβῃς πρόσωπον τοῦ ἁμαρτάνειν — «не прими лица, чтобы грешить» (λαμβάνειν πρόσωπον — быть лицеприятным; слав. «не приими лица»)."
  2: "περὶ νόμου ὑψίστου καὶ διαθήκης — «о законе Всевышнего и завете». περὶ κρίματος δικαιῶσαι τὸν ἀσεβῆ — «о суде — оправдать нечестивого» (κρίμα — суд; δικαιόω — оправдывать, признавать правым)."
  3: "λόγου κοινωνοῦ καὶ ὁδοιπόρων — «слова товарища и путников» (ὁδοιπόρος — путник). δόσεως κληρονομίας ἑταίρων — «даяния наследства друзьям» (ἑταῖρος — товарищ, друг; слав. «другов»)."
  4: "ἀκριβείας ζυγοῦ καὶ σταθμίων — «точности весов и мер» (ζυγός — весы; στάθμιον — гиря, мера). κτήσεως πολλῶν καὶ ὀλίγων — «приобретения многого и малого» (κτῆσις — приобретение, стяжание)."
  5: "διαφόρου πράσεως ἐμπόρων — «различной продажи торговцев» (πρᾶσις — продажа; ἔμπορος — купец). παιδείας τέκνων πολλῆς — «многого наставления детей». οἰκέτῃ πονηρῷ πλευρὰν αἱμάξαι — «окровавить бок злому рабу» (οἰκέτης — домочадец, раб; πλευρά — бок, ребро; αἱμάσσω — окровавливать)."
  6: "ἐπὶ γυναικὶ πονηρᾷ καλὸν σφραγίς — «при злой жене хороша печать» (σφραγίς — печать). ὅπου χεῖρες πολλαί, κλεῖσον — «где рук много, запри» (κλείω — запирать); образ недоверия к домашним."
  7: "ὃ ἐὰν παραδιδῷς, ἐν ἀριθμῷ καὶ σταθμῷ — «что ни передаёшь — числом и весом» (παραδίδωμι — передавать). δόσις καὶ λῆμψις, πάντα ἐν γραφῇ — «даяние и принятие — всё по записи» (γραφή — запись, письмо; слав. «все писанием»)."
  8: "παιδείας ἀνοήτου καὶ μωροῦ — «наставления неразумного и глупого» (ἀνόητος — неразумный; μωρός — глупый). ἐσχατογήρως κρινομένου πρὸς νέους — «престарелого, судящегося с юными» (κρίνομαι πρός — судиться с кем-либо). ἔσῃ πεπαιδευμένος ἀληθινῶς καὶ δεδοκιμασμένος — «будешь истинно наставлен и испытан» (δοκιμάζω — испытывать, одобрять)."
  9: "Θυγάτηρ πατρὶ ἀπόκρυφος ἀγρυπνία — «дочь для отца — тайное бдение» (ἀγρυπνία — бодрствование, бессонница). ἡ μέριμνα αὐτῆς ἀφιστᾷ ὕπνον — «забота о ней отгоняет сон» (μέριμνα — забота; ἀφίστημι — отгонять). ἐν νεότητι αὐτῆς, μήποτε παρακμάσῃ — «в юности её — как бы не отцвела» (παρακμάζω — увядать); συνῳκηκυῖα, μήποτε μισηθῇ — «вышедшая замуж — как бы не стала ненавистной» (συνοικέω — жить вместе, быть замужем)."
  10: "ἐν παρθενίᾳ, μήποτε βεβηλωθῇ — «в девстве — как бы не осквернилась» (βηλόω — осквернять). ἐν τοῖς πατρικοῖς αὐτῆς ἔγκυος γένηται — «в отчем доме не стала беременной» (πατρικά — отчий дом; ἔγκυος — беременная). μετὰ ἀνδρὸς οὖσα, μήποτε παραβῇ — «будучи с мужем, как бы не преступила» (παραβαίνω — преступать); στειρωθῇ — «не стала бесплодной» (στειρόω)."
  11: "ἐπὶ θυγατρὶ ἀδιατρέπτῳ στερέωσον φυλακήν — «над бесстыдной дочерью утверди стражу» (ἀδιάτρεπτος — не знающий стыда; φυλακή — стража). ἐπίχαρμα ἐχθροῖς — «предмет злорадства для врагов» (ἐπίχαρμα). λαλιὰν ἐν πόλει — «молву в городе» (λαλιά — болтовня, молва). ἔκκλητον λαοῦ — «отвергнутый народом»: ἔκκλητος — «вызванный, отверженный», слав. «отлученаго от людий»."
  12: "παντὶ ἀνθρώπῳ μὴ ἔμβλεπε ἐν κάλλει — «ни на какого человека не смотри на красоту» (ἐμβλέπω — вглядываться; κάλλος — красота). ἐν μέσῳ γυναικῶν μὴ συνέδρευε — «среди женщин не сиди» (συνεδρεύω — сидеть вместе)."
  13: "ἀπὸ ἱματίων ἐκπορεύεται σής — «от одежд исходит моль» (σής — моль; ἱμάτιον — одежда). ἀπὸ γυναικὸς πονηρία γυναικός — «от женщины — лукавство женское» (πονηρία — злоба, лукавство); повтор слова «женщина» сохранён."
  14: "κρείσσων πονηρία ἀνδρὸς ἢ ἀγαθοποιὸς γυνή — «лучше злоба мужа, чем добрая женщина»: сравнительная конструкция передана буквально, как в LXX и слав. («лучше злоба мужеска, нежели добродетельная жена»). καὶ γυνὴ καταισχύνουσα εἰς ὀνειδισμόν — «и жена, посрамляющая в поношение» (καταισχύνω — посрамлять; ὀνειδισμός — поношение)."
  15: "Μνησθήσομαι δὴ τὰ ἔργα κυρίου — «вспомню же дела Господа». ἃ ἑόρακα, ἐκδιηγήσομαι — «что я видел, расскажу» (ἐκδιηγέομαι — возвещать подробно). ἐν λόγοις κυρίου τὰ ἔργα αὐτοῦ — «в словах Господа — дела Его»."
  16: "ἥλιος φωτίζων κατὰ πᾶν ἐπέβλεψεν — «солнце, светящее, на всё воззрело» (φωτίζω — освещать; ἐπιβλέπω — взирать). τῆς δόξης κυρίου πλῆρες τὸ ἔργον αὐτοῦ — «славы Господа полно дело Его»."
  17: "οὐκ ἐξεποίησεν τοῖς ἁγίοις κυρίου ἐκδιηγήσασθαι πάντα τὰ θαυμάσια αὐτοῦ — «Он не дал святым Господа возвестить все чудеса Его» (ἐκποιέω — давать возможность, быть в силах; θαυμάσιος — дивный). Слав. «не сотвори ли святым…» читает как вопрос с обратным смыслом; здесь держимся LXX и ru, где отрицание относится к Богу. ἃ ἐστερέωσεν κύριος ὁ παντοκράτωρ — «которые утвердил Господь Вседержитель»; στηριχθῆναι ἐν δόξῃ αὐτοῦ τὸ πᾶν — «чтобы всё утвердилось в славе Его»."
  18: "ἄβυσσον καὶ καρδίαν ἐξίχνευσεν — «бездну и сердце Он исследил» (ἐξιχνιάζω — выслеживать, исследовать). ἐν πανουργεύμασιν αὐτῶν διενοήθη — «в коварствах их уразумел» (παννούργευμα — коварство). ἔγνω ὁ ὕψιστος πᾶσαν εἴδησιν — «познал Всевышний всякое знание»; ἐνέβλεψεν εἰς σημεῖον αἰῶνος — «воззрел на знамение века»."
  19: "ἀπαγγέλλων τὰ παρεληλυθότα καὶ τὰ ἐσόμενα — «возвещая прошедшее и будущее» (παρέρχομαι — проходить; ὁ ἐσόμενος — будущий). ἀποκαλύπτων ἴχνη ἀποκρύφων — «открывая следы сокровенного» (ἴχνος — след; ἀπόκρυφος — сокрытый)."
  20: "οὐ παρῆλθεν αὐτὸν πᾶν διανόημα — «не прошло мимо Него ни одно помышление» (διανόημα — мысль, замысел). οὐκ ἐκρύβη ἀπ᾽ αὐτοῦ οὐδὲ εἷς λόγος — «не укрылось от Него ни одно слово»."
  21: "τὰ μεγαλεῖα τῆς σοφίας αὐτοῦ ἐκόσμησεν — «величие премудрости Своей Он устроил» (μεγαλεῖον — величие; κοσμέω — устроять, украшать). ὡς ἔστιν πρὸ τοῦ αἰῶνος καὶ εἰς τὸν αἰῶνα — «как есть прежде века и в век»."
  22: "οὔτε προσετέθη οὔτε ἠλαττώθη — «ни прибавился, ни умалился» (προστίθημι / ἐλαττόω); οὐ προσεδεήθη οὐδενὸς συμβούλου — «не нуждался ни в каком советнике»."
  23: "ὡς πάντα τὰ ἔργα αὐτοῦ ἐπιθυμητά — «как все дела Его вожделенны» (ἐπιθυμητός — желанный). ὡς σπινθῆρός ἐστιν θεωρῆσαι — «как искра — созерцать» (σπινθήρ — искра; θεωρέω — созерцать); слав. «даже до искры есть видети»."
  24: "πάντα ταῦτα ζῇ καὶ μένει εἰς τὸν αἰῶνα — «всё это живёт и пребывает вовеки». ἐν πάσαις χρείαις — «во всех нуждах» (χρεία — нужда, потребность); πάντα ὑπακούει — «всё слушается», без названного объекта, как в греч."
  25: "πάντα δισσά — «всё двояко» (δισσός — двойной). ἓν κατέναντι τοῦ ἑνός — «одно против другого» (κατέναντι — напротив). οὐκ ἐποίησεν οὐδὲν ἐλλεῖπον — «ничего не сделал недостающим» (ἐλλείπω — недоставать)."
  26: "ἓν τοῦ ἑνὸς ἐστερέωσεν τὰ ἀγαθά — «одно от другого утвердило блага» (ἐν τοῦ ἑνός — «от одного», т. е. одно через другое). τίς πλησθήσεται ὁρῶν δόξαν αὐτοῦ — «кто насытится, видя славу Его» (πίμπλημι — наполнять, насыщать)."
