# Глава 42: чего не надо стыдиться (1–8); забота отца о дочери (9–11);
# осторожность с женщинами (12–14); переход к хвале дел Господних (15);
# творение и непостижимость Божия (16–26).
# Прямой речи нет; основной текст — поучение и хвала, без внешних кавычек.
