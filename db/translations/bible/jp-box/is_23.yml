# jp-box, Исаия, глава 23. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для главы отсутствует; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 23: 1–3 плач кораблей Карфагена/Фарсиса, купцы Финикии; 4–5 слово моря о Сидоне,
# страх Египта; 6–9 бегство в Карфаген, замысел Господа о Тире; 10–14 рука Тиры, Сидон,
# Киттим и Халдея; 15–18 семьдесят лет, песнь блудницы, возвращение Тира и его торговля.
# Прямая речь: слова моря — 23:4; слова «скажут» — 23:12–13; песнь блудницы — 23:16.
# Нумерация по gr: 18 стихов; деление совпадает с csl-ru и ru.
# LXX на месте Тарсиса/Фарсиса (МТ) читает Καρχηδών, т. е. Карфаген; слав. «кархидон».
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).

