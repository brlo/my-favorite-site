verses:
  1: "ツロの幻[まぼろし]。カルタゴの船[ふね]よ、泣[な]き叫[さけ]べ。それは滅[ほろ]びたからである。もはやキティム人[じん]の地[ち]から来[く]ることはない。それは捕[と]らえられて連[つ]れて行[い]かれた。"
  2: "島[しま]に住[す]む者[もの]たち、フェニキアの商人[しょうにん]たち、海[うみ]を渡[わた]る者たちは、だれに似[に]ているのか。"
  3: "大水[おおみず]の上[うえ]に、商人[しょうにん]たちの種[たね]が運[はこ]ばれる。刈[か]り入[い]れが運[はこ]び入[い]れられるように、諸国民[しょこくみん]の商人たちが来[く]る。"
  4: "シドンよ、恥[は]じよ。海[うみ]が言[い]ったからである。海の力[ちから]が言った。「わたしは産[う]みの苦[くる]しみを受[う]けず、産むこともなく、若[わか]い男[おとこ]たちを育[そだ]てることもなく、処女[おとめ]たちを高[たか]めることもなかった。」"
  5: "エジプトにその知[し]らせが届[とど]くと、彼[かれ]らはツロのことで苦しみに捕[と]らえられる。"
  6: "カルタゴへ行[い]け。この島[しま]に住[す]む者[もの]たちよ、泣[な]き叫[さけ]べ。"
  7: "これは、この町[まち]が引[ひ]き渡[わた]される前[まえ]から、あなたがたが初[はじ]めから持[も]っていた高[たか]ぶりではなかったか。"
  8: "だれがツロに対してこのことを決[き]めたのか。それは劣[おと]った者[もの]なのか、力[ちから]を欠[か]いているのか。その商人[しょうにん]たちは栄[は]えある者たち、地[ち]の君[きみ]たちであった。"
  9: "万軍[ばんぐん]の主[しゅ]がこれを決めた。すべての栄[は]えある者の高[たか]ぶりを崩[くず]し、地のすべての栄えある者を辱[はずかし]めるためである。"
  10: "あなたの土地[とち]を耕[たがや]せ。カルタゴからはもはや船[ふね]が来[こ]ないからである。"
  11: "王[おう]たちを怒[いか]らせるあなたの手[て]は、もはや海[うみ]に対して強[つよ]くない。万軍[ばんぐん]の主[しゅ]はカナンについて命[めい]じ、その力[ちから]を滅[ほろ]ぼす。"
  12: "そして彼[かれ]らは言[い]う。「あなたがたはもはや、シドンの娘[むすめ]を辱[はずかし]め、虐[しいた]げることを重[かさ]ねない。たとえあなたがキティム人[じん]のところへ行[い]っても、そこであなたに安[やす]らぎはない。"
  13: "そしてカルデア人[じん]の地[ち]へ。そこもまたアッシリア人[じん]によって荒[あ]らされた。そこでもあなたに安[やす]らぎはない。その城壁[じょうへき]が倒[たお]れたからである。」"
  14: "カルタゴの船[ふね]よ、泣[な]き叫[さけ]べ。あなたがたの砦[とりで]が滅[ほろ]びたからである。"
  15: "その日[ひ]、ツロは七十年[ななじゅうねん]の間[あいだ]、一人[ひとり]の王[おう]の時代[じだい]のように、人[ひと]の時代のように見捨[みす]てられる。七十年の後[のち]、ツロは遊女[ゆうじょ]の歌[うた]のようになる。"
  16: "「琴[こと]を取[と]り、町[まち]々を巡[めぐ]れ。忘[わす]れられた遊女[ゆうじょ]よ。よく弾[ひ]き、多[おお]く歌[うた]え。あなたが思[おも]い起[お]こされるために。」"
  17: "七十年の後[のち]、神[かみ]はツロを顧[かえり]み、ツロは再[ふたた]び元[もと]の状態[じょうたい]に戻[もど]され、世界[せかい]のすべての王国[おうこく]にとっての市場[いちば]となる。"
  18: "その交易[こうえき]と報酬[ほうしゅう]は主[しゅ]への聖[せい]なるものとなる。それは彼[かれ]らのために集[あつ]められるのではなく、主の御前[みまえ]に住[す]む者[もの]たちに、主の御前での記念[きねん]として、食[た]べ、飲[の]み、満[み]ち足[た]りるために、その交易のすべてが帰[き]する。"

notes:
  1: "Τὸ ὅραμα Τύρου — «видение Тира». Ὀλολύζετε, πλοῖα Καρχηδόνος — «рыдайте, корабли Карфагена»: LXX читает здесь Καρχηδών (Карфаген), тогда как МТ и ru называют Тарсис/Фарсис (タルシシュ); слав. «корабли кархидонстии». ὅτι ἀπώλετο — «ибо погиб» (погиб Тир); οὐκέτι ἔρχονται ἐκ γῆς Κιτιαίων — «больше не приходят из земли китийцев» (Κιτιεῖς — Киттим, キティム人); ἦκται αἰχμάλωτος — «отведён пленником» (ἄγω — вести; αἰχμάλωτος — пленник). ru/МТ добавляют «нет домов и некому входить», чего в LXX и слав. нет."
  2: "τίνι ὅμοιοι γεγόνασιν οἱ ἐνοικοῦντες ἐν τῇ νήσῳ — «кому уподобились живущие на острове»; μεταβόλοι Φοινίκης — «торговцы Финикии» (μετάβολος — торговец, перекупщик; Φοινίκη — Финикия); διαπερῶντες τὴν θάλασσαν — «переплывающие море». Слав. «кому подобни быша живущии во острове, купцы финичестии, преходящии море?»; вопрос сохранён без перестановки."
  3: "ἐν ὕδατι πολλῷ, σπέρμα μεταβόλων — «в воде многой семя торговцев»: греч. фраза без сказуемого (продолжение вопроса 23:2); в японском сказуемые «運ばれる/来る» добавлены для связи, содержание не расширено. ὡς ἀμητοῦ εἰσφερομένου — «как жатва приносимая» (ἀμητός — жатва; εἰσφέρω — вносить); οἱ μεταβόλοι τῶν ἐθνῶν — «торговцы народов». Слав. «в воде мнозе семя купеческо, аки жатве вносимей купцы язычестии»."
  4: "αἰσχύνθητι, Σιδών — «устыдись, Сидон»; εἶπεν ἡ θάλασσα — «сказало море»; ἡ δὲ ἰσχὺς τῆς θαλάσσης εἶπεν — «крепость морская сказала» (ἰσχύς — сила, крепость). Речь моря: Οὐκ ὤδινον οὐδὲ ἔτεκον — «я не мучилась родами и не рожала» (ὠδίνω — мучиться родами; τίκτω — рожать); οὐδὲ ἐξέθρεψα νεανίσκους — «не воспитала юношей»; οὐδὲ ὕψωσα παρθένους — «не возвысила девиц». Олицетворение моря сохранено, речь в 「…」."
  5: "ὅταν δὲ ἀκουστὸν γένηται Αἰγύπτῳ — «когда станет слышно Египту» (ἀκουστός — слышимый); λήμψεται αὐτοὺς ὀδύνη περὶ Τύρου — «охватит их боль о Тире» (ὀδύνη — боль, мука). Слав. «егда же слышано будет во египте, приимет я болезнь о тире»."
  6: "ἀπέλθατε εἰς Καρχηδόνα — «уйдите в Карфаген»; ὀλολύξατε — «рыдайте» (ὀλολύζω — вопить, рыдать); οἱ ἐνοικοῦντες ἐν τῇ νήσῳ ταύτῃ — «живущие на этом острове». Императив пророка, поэтому вне кавычек."
  7: "οὐχ αὕτη ἦν ὑμῶν ἡ ὕβρις ἡ ἀπ᾽ ἀρχῆς — «не это ли было ваше высокомерие от начала» (ὕβρις — надменность, насилие); πρὶν ἢ παραδοθῆναι αὐτήν — «прежде чем она была предана» (παραδίδωμι — передавать, предавать). ru/МТ дают «ликующий город… ноги его несут скитаться», чего в LXX нет."
  8: "τίς ταῦτα ἐβούλευσεν ἐπὶ Τύρον — «кто это решил о Тире» (βουλεύω — держать совет, решать); μὴ ἥσσων ἐστὶν ἢ οὐκ ἰσχύει — «разве он меньше/слабее или не имеет силы» (ἥσσων — меньший, слабейший); οἱ ἔμποροι αὐτῆς ἔνδοξοι, ἄρχοντες τῆς γῆς — «торговцы её славны, князья земли»."
  9: "κύριος σαβαωθ ἐβουλεύσατο — «Господь Саваоф решил»; παραλῦσαι πᾶσαν τὴν ὕβριν τῶν ἐνδόξων — «разрушить всякую надменность славных» (παραλύω — расслаблять, разрушать); ἀτιμᾶσαι πᾶν ἔνδοξον ἐπὶ τῆς γῆς — «обесчестить всякого славного на земле» (ἀτιμάζω — бесчестить)."
  10: "ἐργάζου τὴν γῆν σου — «возделывай землю твою» (ἐργάζομαι — обрабатывать); καὶ γὰρ πλοῖα οὐκέτι ἔρχεται ἐκ Καρχηδόνος — «ибо корабли больше не приходят из Карфагена». ru/МТ дают «ходи по земле твоей, дочь Фарсиса, как река: нет более препоны» — иное чтение (МТ)."
  11: "ἡ δὲ χείρ σου οὐκέτι ἰσχύει κατὰ θάλασσαν — «рука твоя уже не крепка на море»: подлежащее — рука Тира (слав. так же); ἡ παροξύνουσα βασιλεῖς — «та, что раздражает царей» (παροξύνω — раздражать, возбуждать). κύριος σαβαωθ ἐνετείλατο περὶ Χανααν — «Господь Саваоф повелел о Ханаане»; ἀπολέσαι αὐτῆς τὴν ἰσχύν — «погубить силу его». ru/МТ ставят подлежащим Бога («Он простёр руку Свою на море»), в LXX и слав. — рука Тира."
  12: "καὶ ἐροῦσιν — «и скажут»: далее речь в 「…」 до конца 23:13. Οὐκέτι μὴ προσθῆτε τοῦ ὑβρίζειν καὶ ἀδικεῖν — «вы больше не будете продолжать глумиться и обижать» (προστίθημι — прибавлять, продолжать; ὑβρίζω — глумиться); τὴν θυγατέρα Σιδῶνος — «дочь Сидона». ἐὰν ἀπέλθῃς εἰς Κιτιεῖς — «если пойдёшь к китийцам»; οὐδὲ ἐκεῖ σοι ἀνάπαυσις ἔσται — «и там тебе не будет покоя» (ἀνάπαυσις — покой, отдых)."
  13: "καὶ εἰς γῆν Χαλδαίων — «и в землю Халдеев» (продолжение речи 23:12); καὶ αὕτη ἠρήμωται ἀπὸ τῶν Ἀσσυρίων — «и она опустошена ассирийцами» (ἐρημόω — опустошать); οὐδὲ ἐκεῖ σοι ἀνάπαυσις ἔσται — «и там тебе не будет покоя»; ὅτι ὁ τοῖχος αὐτῆς πέπτωκεν — «ибо стена её пала». ru/МТ пространно говорят о начале Халдеи и башнях, чего в кратком тексте LXX и слав. нет."
  14: "ὀλολύζετε, πλοῖα Καρχηδόνος — «рыдайте, корабли Карфагена» (повтор 23:1); ὅτι ἀπώλετο τὸ ὀχύρωμα ὑμῶν — «ибо погибла твердыня ваша» (ὀχύρωμα — укрепление, твердыня); слав. «твердыня ваша»."
  15: "καταλειφθήσεται Τύρος ἔτη ἑβδομήκοντα — «Тир будет оставлен на семьдесят лет»; ὡς χρόνος βασιλέως, ὡς χρόνος ἀνθρώπου — «как время царя, как время человека»: срок одного царствования; слав. добавляет в скобках «(единаго) царя», в LXX этого слова нет. ἔσται Τύρος ὡς ᾆσμα πόρνης — «Тир будет как песнь блудницы» (ᾆσμα — песнь; πόρνη — блудница)."
  16: "Λαβὲ κιθάραν — «возьми кифару» (κιθάρα — струнный инструмент, лира); ῥέμβευσον πόλεις — «обойди города» (ῥεμβεύω — бродить, кружить); πόρνη ἐπιλελησμένη — «забытая блудница». καλῶς κιθάρισον, πολλὰ ᾆσον — «хорошо играй, много пой»; ἵνα σου μνεία γένηται — «чтобы память о тебе была» (μνεία — упоминание, память). Это слова песни, поэтому в 「…」."
  17: "ἐπισκοπὴν ποιήσει ὁ θεὸς Τύρου — «Бог посетит Тир» (ἐπισκοπή — посещение, попечение); слав. «присещение сотворит Бог тиру»; ru/МТ ставят «Господь», но в LXX и слав. — «Бог». πάλιν ἀποκατασταθήσεται εἰς τὸ ἀρχαῖον — «снова восстановится в прежнее» (ἀποκαθίστημι — восстанавливать); ἔσται ἐμπόριον πάσαις ταῖς βασιλείαις τῆς οἰκουμένης — «будет торжищем всем царствам вселенной» (ἐμπόριον — торговое место, рынок)."
  18: "ἡ ἐμπορία καὶ ὁ μισθὸς ἅγιον τῷ κυρίῳ — «торговля и плата — святыня Господу» (μισθός — плата, прибыль); οὐκ αὐτοῖς συναχθήσεται — «не им соберётся», т. е. не для них самих; ἀλλὰ τοῖς κατοικοῦσιν ἔναντι κυρίου — «но живущим пред Господом». φαγεῖν καὶ πιεῖν καὶ ἐμπλησθῆναι — «есть, пить и насытиться»; εἰς συμβολὴν μνημόσυνον ἔναντι κυρίου — тёмное место: «в собрание/приношение, память пред Господом» (συμβολή — вклад, собрание; μνημόσυνον — память, памятник); слав. «и в сытость, на память пред Господем»."
