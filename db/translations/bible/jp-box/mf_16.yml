# jp-box, Евангелие от Матфея, глава 16. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, «ru», jp-joc).
# Греческий сайта (критический) — свидетель; расхождения с ним — в 〔…〕.
# Красным только слова Христа; речь фарисеев и саддукеев, учеников и Петра — не красная.

