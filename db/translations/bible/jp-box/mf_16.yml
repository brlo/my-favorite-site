verses:
  1: "ファリサイ派[は]とサドカイ派[は]の人々[ひとびと]がイエスのもとに来[き]て、彼[かれ]を試[こころ]みようと、天[てん]からのしるしを自分[じぶん]たちに示[しめ]してくださるよう求[もと]めた。"
  2: "イエスはお答[こた]えになって言[い]われた。「<j>〔夕方[ゆうがた]になると、あなたがたは『晴[は]れになる』と言[い]う。空[そら]が赤[あか]く染[そ]まるからである。〕</j>"
  3: "<j>〔朝[あさ]には『今日[きょう]は荒[あ]れ模様[もよう]だ』と言[い]う。空[そら]が赤[あか]く、曇[くも]っているからである。偽善者[ぎぜんしゃ]たちよ。あなたがたは空[そら]の様子[ようす]を見分[みわ]けることはできるのに、時代[じだい]のしるしを見分[みわ]けることはできないのか。〕</j>"
  4: "<j>悪[わる]い、姦淫[かんいん]の時代[じだい]の者[もの]たちはしるしを求[もと]める。だが、預言者[よげんしゃ]ヨナのしるしのほかに、しるしが与[あた]えられることはない。</j>」そして、彼[かれ]らを残[のこ]して去[さ]って行[い]かれた。"
  5: "一行[いっこう]が向[む]こう岸[ぎし]に渡[わた]ると、弟子[でし]たちはパンを持[も]って来[く]るのを忘[わす]れていた。"
  6: "イエスは彼[かれ]らに言[い]われた。「<j>ファリサイ派[は]とサドカイ派[は]のパン種[ぱんだね]に、よくよく気[き]をつけなさい。</j>」"
  7: "弟子[でし]たちは、「わたしたちはパンを持[も]って来[こ]なかったからだ」と、互[たが]いに論[ろん]じ合[あ]っていた。"
  8: "イエスはそれに気[き]づいて言[い]われた。「<j>信仰[しんこう]の薄[うす]い者[もの]たちよ、パンがないことで、なぜ互[たが]いに論[ろん]じ合[あ]うのか。</j>"
  9: "<j>まだ分[わ]からないのか。五[いつ]つのパンで五千人[ごせんにん]を養[やしな]ったとき、幾[いく]つの籠[かご]を集[あつ]めたか、覚[おぼ]えていないのか。</j>"
  10: "<j>七[なな]つのパンで四千人[よんせんにん]を養[やしな]ったとき、幾[いく]つの籠[かご]を集[あつ]めたか。</j>"
  11: "<j>パンのことではないと、どうして分[わ]からないのか。ファリサイ派[は]とサドカイ派[は]のパン種[ぱんだね]によく気[き]をつけなさい。</j>」"
  12: "そこで弟子[でし]たちは、イエスがパン種[ぱんだね]に気[き]をつけよと言[い]われたのは、パンのことではなく、ファリサイ派[は]とサドカイ派[は]の教[おし]えを指[さ]すのだと分[わ]かった。"
  13: "フィリポ・カイサリアの地方[ちほう]に入[はい]ったイエスは、弟子[でし]たちに、「<j>人々[ひとびと]は、人[ひと]の子[こ]をだれだと言[い]っているか</j>」と問[と]われた。"
  14: "弟子[でし]たちは答[こた]えた。「ある人[ひと]たちは『洗礼者[せんれいしゃ]ヨハネだ』と言[い]い、ほかの人[ひと]たちは『エリヤだ』と言[い]い、またほかの人[ひと]たちは『エレミヤだ』とか『預言者[よげんしゃ]の一人[ひとり]だ』と言[い]っています。」"
  15: "イエスは言[い]われた。「<j>では、あなたがたは、わたしのことをだれだと言[い]うのか。</j>」"
  16: "シモン・ペトロが答[こた]えて言[い]った。「あなたこそ、キリストです。生[い]ける神[かみ]の子[こ]です。」"
  17: "イエスはお答[こた]えになった。「<j>シモン、ヨナの子[こ]よ、あなたは幸[さいわ]いである。これをあなたに示[しめ]したのは、血肉[けつにく]ではなく、天[てん]におられるわたしの父[ちち]だからである。</j>"
  18: "<j>わたしも言[い]っておく。あなたはペトロ。わたしはこの岩[いわ]の上[うえ]に自分[じぶん]の教会[きょうかい]を建[た]て、陰府[よみ]の門[もん]も、この教会[きょうかい]に勝[か]つことはない。</j>"
  19: "<j>わたしはあなたに天[てん]の国[くに]の鍵[かぎ]を授[さず]ける。あなたが地[ち]で縛[しば]ることは何[なん]でも天[てん]でも縛[しば]られ、あなたが地[ち]で解[と]くことは何[なん]でも天[てん]でも解[と]かれる。</j>」"
  20: "そのとき、イエスは、ご自分[じぶん]がキリストであることをだれにも話[はな]してはならない、と弟子[でし]たちを戒[いまし]められた。"
  21: "そのころから、イエスは弟子[でし]たちに、ご自分[じぶん]が必[かなら]ずエルサレムへ行[い]って、長老[ちょうろう]、祭司長[さいしちょう]、律法学者[りっぽうがくしゃ]たちから多[おお]くの苦[くる]しみを受[う]け、殺[ころ]され、三日目[みっかめ]に復活[ふっかつ]されることを示[しめ]し始[はじ]められた。"
  22: "そこで、ペトロはイエスをわきへ引[ひ]き寄[よ]せて、いさめ始[はじ]めた。「主[しゅ]よ、ご自分[じぶん]をお憐[あわ]れみください。そんなことは決[けっ]してあなたに起[お]こりません。」"
  23: "イエスは振[ふ]り返[かえ]ってペトロに言[い]われた。「<j>サタン、わたしの後[うし]ろに退[さが]れ。あなたはわたしのつまずきである。あなたは神[かみ]のことを思[おも]わず、人[ひと]のことを思[おも]っているからである。</j>」"
  24: "それから、イエスは弟子[でし]たちに言[い]われた。「<j>わたしの後[あと]に従[したが]おうとする者[もの]は、自分[じぶん]を捨[す]て、自分[じぶん]の十字架[じゅうじか]を負[お]って、わたしに従[したが]いなさい。</j>"
  25: "<j>自分[じぶん]の命[いのち]を救[すく]おうとする者[もの]はそれを失[うしな]い、わたしのために自分[じぶん]の命[いのち]を失[うしな]う者[もの]はそれを見出[みいだ]すのである。</j>"
  26: "<j>人[ひと]は、たとえ全世界[ぜんせかい]を得[え]ても、自分[じぶん]の命[いのち]を損[そこな]ったなら、何[なん]の益[えき]があるだろうか。人[ひと]は自分[じぶん]の命[いのち]の代[か]わりに、何[なに]を差[さ]し出[だ]せるだろうか。</j>"
  27: "<j>人[ひと]の子[こ]は、父[ちち]の栄光[えいこう]を帯[お]びて、自分[じぶん]の天使[てんし]たちと共[とも]に来[く]ることになっている。そのとき、それぞれの行[おこな]いに応[おう]じて報[むく]いるのである。</j>"
  28: "<j>はっきり言[い]っておく。ここに立[た]っている者[もの]の中[なか]には、人[ひと]の子[こ]がその国[くに]に来[く]るのを見[み]るまで、決[けっ]して死[し]を味[あじ]わわない者[もの]がいる。</j>」"

notes:
  2: "Ст. 2б–3 («вечером вы говорите…») в критической базе отсутствуют; Церковь читает их (Елизаветинская, jp-joc) — оба стиха целиком в 〔…〕, пара скобок в каждом стихе."
  12: "τῶν ἄρτων в критической базе под скобками; Церковь читает («закваски хлебной», jp-joc 餅の酵). По-японски パン種 уже содержит パン, поэтому отдельного маркера нет: 〔パンの〕パン種 дало бы тавтологию."
  16: "ὁ Χριστός — по глоссарию キリスト (не メシア), чтобы работал переключатель ハリストス. Речь Петра — не красная."
  18: "ᾅδης — 陰府[よみ], как в 11:23; 地獄 в переводе оставлено за γέεννα. Игра слов Πέτρος/πέτρα передана именами (ペトロ/岩), без пояснения в тексте."
  19: "δεδεμένον/λελυμένον — perfectum passivum: «будет связано/разрешено», без сглаживания в «свяжешь/разрешишь»."
  21: "δεῖ — «должно, непременно»; передано 必ず …されることを示し始められた (без «так написано» и без сглаживания в «предсказал»). Порядок: страдания, смерть, третьего дня воскресение — как в греческом."
  22: "Ἵλεώς σοι, κύριε — идиома «будь милостив (к Себе), Господи»; передал ご自分をお憐れみください, не заменяя на «не дай Бог»."
  23: "σκάνδαλον εἶ ἐμοῦ — «ты соблазн Мне»; つまずき, а не «помеха». ὀπίσω μου в Мф есть, поэтому わたしの後ろに退れ (в Мк 8:33 — サタン、引き下がれ)."
  25: "ἕνεκεν ἐμοῦ — у Матфея без «и Евангелия» (в Мк 8:35 добавлено); сохранён состав Мф."
  26: "ζημιωθῇ — «понесёт урон»; 損った. ἀντάλλαγμα — «выкуп, обмен»; 代わりに差し出せる."
  28: "ἐν τῇ βασιλείᾳ αὐτοῦ — «в Царстве Своём»; その国に来る, без уточнений о Втором приходе."
