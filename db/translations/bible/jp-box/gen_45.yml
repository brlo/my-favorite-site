# jp-box, Бытие, глава 45. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru)
# и, где есть, jp-joc (1901, public domain). ru — только для понимания, не источник.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 45: Иосиф открывается братьям (1–15), фараон посылает за Иаковом (16–24),
# братья возвращаются к Иакову, и он решает идти (25–28).
# Красного и синего нет: говорят люди, не Христос; «<j>» не ставится.
# Кавычки: речь первого уровня — 「…」, вложенная весть отцу (9–11) — 『…』.
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено по базе).
# jp-joc в этой главе есть только до ст. 16; дальше контроль по csl-ru.
# Сносок ⟨…⟩ нет: 荷車, 家畜, 銀, 飢饉, 髄 понятны или уже в корпусе. jp-ni не использовался.

