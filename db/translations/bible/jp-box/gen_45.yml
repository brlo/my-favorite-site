verses:
  1: "ヨセフは、自分[じぶん]のそばに立[た]つすべての人[ひと]々[びと]の前[まえ]で、もはや自分[じぶん]を抑[おさ]えることができず、「皆[みな]、わたしの前[まえ]から出[で]て行[い]け」と言[い]った。ヨセフが兄弟[きょうだい]たちに自分[じぶん]を明[あき]かしたとき、そばに立[た]つ者[もの]はもはや誰[だれ]もいなかった。"
  2: "彼[かれ]は泣[な]きながら声[こえ]を上[あ]げた。エジプト人[じん]は皆[みな]それを聞[き]き、ファラオの家[いえ]にも聞[こ]こえた。"
  3: "ヨセフは兄弟[きょうだい]たちに言[い]った。「わたしはヨセフです。父[ちち]はまだ生[い]きていますか。」兄弟[きょうだい]たちは彼[かれ]に答[こた]えることができなかった。彼[かれ]らは驚[おどろ]き恐[おそ]れたからである。"
  4: "ヨセフは兄弟[きょうだい]たちに言[い]った。「わたしに近[ちか]づきなさい。」彼[かれ]らが近[ちか]づくと、彼[かれ]は言[い]った。「わたしは、あなたがたがエジプトに売[う]ったあなたがたの兄弟[きょうだい]ヨセフです。"
  5: "今[いま]は、わたしをここに売[う]ったことを悲[かな]しんだり、心[こころ]を痛[いた]めたりしてはならない。神[かみ]はあなたがたの命[いのち]を救[すく]うために、わたしをあなたがたより先[さき]に遣[つか]わされたからである。"
  6: "この二年[にねん]の間[あいだ]、飢饉[ききん]が地[ち]にあり、なお五年[ごねん]が残[のこ]っている。その間[あいだ]は耕[たがや]すことも刈[か]り入[い]れることもない。"
  7: "神[かみ]は、あなたがたのために地[ち]に残[のこ]る者[もの]を残[のこ]し、大[おお]いなる救[すく]いによってあなたがたの命[いのち]を救[すく]うために、わたしをあなたがたより先[さき]に遣[つか]わされたのである。"
  8: "だから今[いま]、わたしをここに遣[つか]わしたのはあなたがたではなく、神[かみ]である。神[かみ]はわたしをファラオの父[ちち]のような者[もの]とし、その全[ぜん]家[か]の主[あるじ]とし、エジプト全土[ぜんど]の支配者[しはいしゃ]とされた。"
  9: "急[いそ]いで父[ちち]のもとへ上[のぼ]って行[い]き、こう言[い]いなさい。『あなたの子[こ]ヨセフがこう言[い]っています。神[かみ]はわたしをエジプト全土[ぜんど]の主[あるじ]とされました。ためらわずに、わたしのもとへ下[くだ]って来[き]てください。"
  10: "あなたはアラビアのゴシェンの地[ち]に住[す]み、わたしの近[ちか]くにいるでしょう。あなたも、あなたの子[こ]らも、孫[まご]たちも、羊[ひつじ]も牛[うし]も、あなたのすべてのものも。"
  11: "まだ五年[ごねん]の飢饉[ききん]があるからです。わたしはそこであなたを養[やしな]います。あなたも、あなたの子[こ]らも、あなたのすべてのものが滅[ほろ]びないためです。』"
  12: "見[み]なさい。あなたがたの目[め]も、わたしの兄弟[きょうだい]ベニヤミンの目[め]も、あなたがたに語[かた]っているのがわたしの口[くち]であるのを見[み]ている。"
  13: "だから、エジプトでのわたしの栄光[えいこう]と、あなたがたが見[み]たすべてのことを父[ちち]に告[つ]げ、急[いそ]いで父[ちち]をここへ連[つ]れて来[き]なさい。」"
  14: "彼[かれ]は弟[おとうと]ベニヤミンの首[くび]を抱[いだ]いて泣[な]き、ベニヤミンも彼[かれ]の首[くび]を抱[いだ]いて泣[な]いた。"
  15: "また、兄弟[きょうだい]たちすべてに口[くち]づけして彼[かれ]らの上[うえ]で泣[な]いた。その後[のち]、兄弟[きょうだい]たちは彼[かれ]と語[かた]った。"
  16: "ファラオの家[いえ]に「ヨセフの兄弟[きょうだい]たちが来[き]た」という知[し]らせが届[とど]き、ファラオとそのしもべたちは喜[よろこ]んだ。"
  17: "ファラオはヨセフに言[い]った。「兄弟[きょうだい]たちにこう言[い]いなさい。『こうしなさい。あなたがたの袋[ふくろ]を満[み]たして、カナンの地[ち]へ行[い]き、"
  18: "父[ちち]と家財[かざい]を連[つ]れて、わたしのもとへ来[き]なさい。わたしはあなたがたにエジプトのすべての良[よ]いものを与[あた]え、あなたがたは地[ち]の髄[ずい]を食[た]べるであろう。』"
  19: "あなたはこう命[めい]じなさい。『あなたがたの子[こ]らと妻[つま]らのために、エジプトの地[ち]から荷車[にぐるま]を取[と]り、父[ちち]を連[つ]れて来[き]なさい。"
  20: "あなたがたの道具[どうぐ]のために惜[お]しんではならない。エジプトのすべての良[よ]いものがあなたがたのものになるからである。』」"
  21: "イスラエルの子[こ]らはそうした。ヨセフはファラオ王[おう]の言葉[ことば]に従[したが]って彼[かれ]らに荷車[にぐるま]を与[あた]え、道[みち]のための食糧[しょくりょう]を与[あた]えた。"
  22: "またすべての者[もの]に二組[ふたくみ]の衣[ころも]を与[あた]え、ベニヤミンには三百[さんびゃく]の金貨[きんか]と五組[ごくみ]の衣[ころも]を与[あた]えた。"
  23: "また父[ちち]には、同[おな]じように、エジプトのすべての良[よ]いものを載[の]せた十頭[じゅっとう]のろばと、父[ちち]の道[みち]のためのパンを載[の]せた十頭[じゅっとう]のラバを送[おく]った。"
  24: "そして兄弟[きょうだい]たちを送[おく]り出[だ]した。彼[かれ]らは行[い]った。彼[かれ]は彼[かれ]らに言[い]った。「道[みち]で怒[いか]ってはならない。」"
  25: "彼[かれ]らはエジプトから上[のぼ]って、カナンの地[ち]にいる父[ちち]ヤコブのもとへ来[き]た。"
  26: "そして告[つ]げた。「あなたの子[こ]ヨセフは生[い]きています。しかも彼[かれ]はエジプト全土[ぜんど]を治[おさ]めています。」ヤコブの心[こころ]は驚[おどろ]き、彼[かれ]は彼[かれ]らを信[しん]じなかった。"
  27: "彼[かれ]らはヨセフの語[かた]ったすべてのことばを彼[かれ]に語[かた]った。ヨセフが彼[かれ]を連[つ]れて行[い]くために送[おく]った荷車[にぐるま]を見[み]て、父[ちち]ヤコブの霊[れい]は生[い]き返[かえ]った。"
  28: "イスラエルは言[い]った。「十分[じゅうぶん]だ。わたしの子[こ]ヨセフがまだ生[い]きているとは。死[し]ぬ前[まえ]に、行[い]って彼[かれ]に会[あ]おう。」"

notes:
  1: "οὐκ ἠδύνατο ἀνέχεσθαι — 抑えることができず (ἀνέχομαι «терпеть, сдерживаться»). Ἐξαποστείλατε πάντας ἀπ᾽ ἐμοῦ — 皆、わたしの前から出て行け. ἀνεγνωρίζετο τοῖς ἀδελφοῖς — 兄弟たちに自分を明かした (ἀναγνωρίζω, пассив «был узнаваем»; по-японски активнее)."
  2: "ἀφῆκεν φωνὴν μετὰ κλαυθμοῦ — 泣きながら声を上げた (букв. «испустил голос с плачем»). ἀκουστὸν ἐγένετο εἰς τὸν οἶκον Φαραω — ファラオの家にも聞こえた."
  3: "Ἐγώ εἰμι Ιωσηφ — わたしはヨセフです. ἔτι ὁ πατήρ μου ζῇ; — 父はまだ生きていますか. ἐταράχθησαν — 驚き恐れた (ταράσσω «смутились»)."
  4: "Ἐγγίσατε πρός με — わたしに近づきなさい. ὃν ἀπέδοσθε εἰς Αἴγυπτον — あなたがたがエジプトに売った (ἀποδίδωμι «продать»)."
  5: "μὴ λυπεῖσθε μηδὲ σκληρὸν ὑμῖν φανήτω — 悲しんだり、心を痛めたりしてはならない (σκληρός «жестокий, тяжкий»). εἰς ζωὴν ἀπέστειλέν με ὁ θεός — 命を救うために…遣わされた."
  6: "δεύτερον ἔτος λιμός — 二年の間、飢饉. ἀροτρίασις οὐδὲ ἄμητος — 耕すことも刈り入れることもない (ἄμητος «жатва»)."
  7: "ὑπολείπεσθαι ὑμῶν κατάλειμμα — 残る者を残し (κατάλειμμα «остаток»). ἐκθρέψαι… κατάλειψιν μεγάλην — 大いなる救いによって…救う (ἐκτρέφω «вскормить, сохранить»)."
  8: "οὐχ ὑμεῖς με ἀπεστάλκατε — 遣わしたのはあなたがたではなく. ὡς πατέρα Φαραω — ファラオの父のような者 (титул везиря). κύριον παντὸς τοῦ οἴκου αὐτοῦ — 全家の主. ἄρχοντα πάσης γῆς Αἰγύπτου — エジプト全土の支配者."
  9: "Τάδε λέγει ὁ υἱός σου Ιωσηφ — あなたの子ヨセフがこう言っています (формула посольской речи). κατάβηθι — 下って来てください (из Ханаана в Египет «снизойти»). μὴ μείνῃς — ためらわずに."
  10: "ἐν γῇ Γεσεμ Ἀραβίας — アラビアのゴシェン (LXX добавляет «Аравии»; слав. «гесемли аравийстей»). τὰ πρόβατά σου καὶ αἱ βόες σου — 羊も牛も."
  11: "ἐκθρέψω σε ἐκεῖ — そこであなたを養います. ἵνα μὴ ἐκτριβῇς — 滅びないため (ἐκτρίβω «истреблять»)."
  12: "ἰδοὺ οἱ ὀφθαλμοὶ ὑμῶν βλέπουσιν… ὅτι τὸ στόμα μου τὸ λαλοῦν πρὸς ὑμᾶς — あなたがたの目も…わたしの口であることを見ている (букв.)."
  13: "πᾶσαν τὴν δόξαν μου τὴν ἐν Αἰγύπτῳ — エジプトでのわたしの栄光. ταχύναντες καταγάγετε — 急いで…連れて来なさい (κατάγω «свести вниз»)."
  14: "ἐπιπεσὼν ἐπὶ τὸν τράχηλον — 首を抱いて (ἐπιπίπτω «пасть на»). ἔκλαυσεν ἐπ᾽ αὐτῷ — 泣いた."
  15: "καταφιλήσας πάντας — すべてに口づけして (καταφιλέω). μετὰ ταῦτα ἐλάλησαν — その後…語った."
  16: "διεβοήθη ἡ φωνὴ εἰς τὸν οἶκον Φαραω — 知らせが届き (διαβοάω «разгласиться»). ἡ θεραπεία αὐτοῦ — そのしもべたち (θεραπεία «прислуга, двор»)."
  17: "γεμίσατε τὰ πορεῖα ὑμῶν — 袋を満たして (πορεῖα «дорожные мешки, вьюки»; слав. «сосуды»)."
  18: "τὸν μυελὸν τῆς γῆς — 地の髄 (μυελός «костный мозг»; образ тука, лучшего)."
  19: "ἔντειλαι — 命じなさい. ἁμάξας — 荷車 (ἅμαξα). τοῖς παιδίοις… καὶ ταῖς γυναιξίν — 子らと妻らのために."
  20: "μὴ φείσησθε τοῖς ὀφθαλμοῖς τῶν σκευῶν ὑμῶν — 道具のために惜しんではならない (букв. «не пощадите очами сосудов ваших», евр. оборот)."
  21: "κατὰ τὰ εἰρημένα ὑπὸ Φαραω — ファラオ王の言葉に従って. ἐπισιτισμὸν εἰς τὴν ὁδόν — 道のための食糧 (ἐπισιτισμός «провиант»)."
  22: "δισσὰς στολάς — 二組の衣 (δισσός «двойной»). τριακοσίους χρυσοῦς — 三百の金貨 (LXX χρυσοῦς; в ru «сребренники» — иное чтение, не источник). πέντε ἐξαλλασσούσας στολάς — 五組の衣 (ἐξαλλάσσω «сменять», т. е. перемены одежд)."
  23: "δέκα ὄνους… καὶ δέκα ἡμιόνους — 十頭のろばと十頭のラバ (ἡμίονος «мул»). ἄρτους τῷ πατρὶ αὐτοῦ εἰς ὁδόν — 父の道のためのパン."
  24: "Μὴ ὀργίζεσθε ἐν τῇ ὁδῷ — 道で怒ってはならない (слав. «не гневайтеся»; ru «не ссорьтесь» — толковательно)."
  25: "ἀνέβησαν ἐξ Αἰγύπτου — エジプトから上って (Египет ниже Ханаана)."
  26: "Ὁ υἱός σου Ιωσηφ ζῇ — あなたの子ヨセフは生きています. ἐξέστη ἡ διάνοια Ιακωβ — ヤコブの心は驚き (διάνοια «мысль, ум»). οὐ γὰρ ἐπίστευσεν αὐτοῖς — 彼らを信じなかった."
  27: "πάντα τὰ ῥηθέντα ὑπὸ Ιωσηφ — ヨセフの語ったすべてのことば. ἀνεζωπύρησεν τὸ πνεῦμα Ιακωβ — ヤコブの霊は生き返った (ἀναζωπυρέω «разжечь, оживить»)."
  28: "Μέγα μοί ἐστιν — 十分だ (букв. «велико мне», т. е. довольно). πορευθεὶς ὄψομαι αὐτὸν πρὸ τοῦ ἀποθανεῖν με — 死ぬ前に、行って彼に会おう."
