verses:
  1: "「わたしに聞[き]け、義[ぎ]を追[お]い求[もと]め、主[しゅ]を尋[たず]ね求[もと]める者[もの]たちよ。あなたがたが切[き]り出[だ]した堅[かた]い岩[いわ]、あなたがたが掘[ほ]った穴[あな]の底[そこ]を見[み]よ。"
  2: "あなたがたの父[ちち]アブラハムと、あなたがたを生[う]んだサラを見[み]よ。彼[かれ]は一人[ひとり]であったが、わたしは彼を呼[よ]び、彼を祝福[しゅくふく]し、彼を愛[あい]し、彼を増[ふ]やした。"
  3: "シオンよ、わたしは今[いま]、あなたを慰[なぐさ]める。わたしはすでに、そのすべての荒[あ]れ果[は]てた所[ところ]を慰めた。そして、その荒れ野を主[しゅ]の園[その]のようにし、その西[にし]の側[がわ]も主の園のようにする。彼[かれ]らはそこに喜[よろこ]びと楽[たの]しみ、感謝[かんしゃ]と賛美[さんび]の声[こえ]を見[み]いだす。"
  4: "わたしに聞[き]け、聞[き]け、わたしの民[たみ]よ。王[おう]たちよ、わたしに耳[みみ]を傾[かたむ]けよ。律法[りっぽう]はわたしから出[で]て、わたしの裁[さば]きが諸国[しょこく]の民[たみ]の光[ひかり]となるからである。"
  5: "わたしの義[ぎ]は速[すみ]やかに近[ちか]づき、わたしの救[すく]いは光[ひかり]のように出[で]て行[い]く。諸国[しょこく]の民[たみ]はわたしの腕[うで]に望[のぞ]みをかける。島[しま]々[じま]はわたしを待[ま]ち望[のぞ]み、わたしの腕に望みをかける。"
  6: "あなたがたの目[め]を天[てん]に上[あ]げ、下[した]の地[ち]を見[み]よ。天[てん]は煙[けむり]のように固[かた]められ、地[ち]は衣[ころも]のように古[ふる]びる。地[ち]に住[す]む者[もの]たちも、これらと同[おな]じように死[し]ぬ。しかし、わたしの救[すく]いは永遠[えいえん]にあり、わたしの義[ぎ]は尽[つ]きることがない。"
  7: "裁[さば]きを知[し]る者[もの]たち、心[こころ]にわたしの律法[りっぽう]があるわたしの民[たみ]よ、わたしに聞[き]け。人[ひと]の辱[はずかし]めを恐[おそ]れるな。彼[かれ]らの侮[あなど]りに負[ま]けるな。"
  8: "衣[ころも]が時[とき]によって食[く]い尽[つ]くされ、羊毛[ようもう]が虫[むし]に食い尽くされるからである。しかし、わたしの義[ぎ]は永遠[えいえん]にあり、わたしの救[すく]いは代[よ]々[よ]に及[およ]ぶ。」"
  9: "目[め]を覚[さ]ませ、目を覚ませ、エルサレムよ。あなたの腕[うで]の力[ちから]を身[み]にまとえ。目を覚ませ、初[はじ]めの日[ひ]のように、昔[むかし]の代[よ]のように。傲慢[ごうまん]な者[もの]を打[う]ち負[ま]かし、竜[りゅう]を裂[さ]いたのは、あなたではなかったか。"
  10: "海[うみ]と深[ふか]い淵[ふち]の大水[おおみず]を干[ひ]上がらせ、海の深[ふか]みを、贖[あがな]われた者[もの]たちが通[とお]る道[みち]としたのは、あなたではなかったか。"
  11: "主[しゅ]によって、彼[かれ]らは帰[かえ]って来[く]る。喜[よろこ]びと永遠[えいえん]の楽[たの]しみをもってシオンへ来[き]、その頭[あたま]の上[うえ]には喜[よろこ]びと賛美[さんび]があり、喜[よろこ]びが彼らを襲[おそ]う。苦[くる]しみも悲[かな]しみも嘆[なげ]きも逃[に]げ去[さ]った。"
  12: "「わたしである、わたしである、あなたを慰[なぐさ]める者[もの]は。あなたが恐[おそ]れておののいた相手[あいて]がだれなのか、知[し]るがよい。草[くさ]のように枯[か]れた死[し]すべき人間[にんげん]、人[ひと]の子[こ]なのだ。"
  13: "あなたは、あなたを造[つく]り、天[てん]を造り、地[ち]を据[す]え付[すえつ]けた神[かみ]を忘[わす]れ、虐[しいた]げる者[もの]の怒[いか]りの面[かお]を、いつも、日[ひ]ごとに恐[おそ]れてきた。彼[かれ]がどんなにあなたを取[と]り去[さ]ろうと望[のぞ]んだことか。しかし今[いま]、あなたを虐げる者の怒りはどこにあるのか。"
  14: "あなたが救[すく]われるとき、立[た]ち止[ど]まることも、遅[おそ]れることもない。"
  15: "わたしはあなたの神[かみ]、海[うみ]をかき乱[みだ]し、その波[なみ]をとどろかせる者[もの]である。わたしの名[な]は万軍[ばんぐん]の主[しゅ]である。"
  16: "わたしはわたしの言葉[ことば]をあなたの口[くち]に置[お]き、わたしの手[て]の陰[かげ]であなたを覆[おお]う。それによってわたしは天[てん]を据[す]え、地[ち]を据え付[すえつ]けた。そして、シオンに言[い]う。『あなたはわたしの民[たみ]である。』」"
  17: "目[め]を覚[さ]ませ、目を覚ませ、立[た]ち上[あ]がれ、エルサレムよ。主[しゅ]の手[て]から怒[いか]りの杯[さかずき]を飲[の]んだ者[もの]よ。倒[たお]れの杯[さかずき]、怒りの鉢[はち]を、あなたは飲[の]み干[ほ]した。"
  18: "あなたが産[う]んだすべての子[こ]らのうち、あなたを慰[なぐさ]める者[もの]は一人[ひとり]もいなかった。あなたが育[そだ]てたすべての子らのうち、あなたの手[て]を取[と]って支[ささ]える者もいなかった。"
  19: "この二[ふた]つのことが、あなたに敵[てき]して起[お]こっている。だれがあなたとともに悲[かな]しむのか。倒[たお]れることと砕[くだ]かれること、飢[う]えと剣[つるぎ]である。だれがあなたを慰[なぐさ]めるのか。"
  20: "あなたの子[こ]らは力[ちから]を失[うしな]い、すべての通[とお]り道[みち]の端[はし]で、半分[はんぶん]煮[に]えたビートのように眠[ねむ]っている。彼[かれ]らは主[しゅ]の怒[いか]りに満[み]ち、主[しゅ]なる神[かみ]によって力[ちから]を失った者[もの]たちである。"
  21: "だから、聞[き]け。卑[いや]しめられ、ぶどう酒によらずに酔[よ]った者[もの]よ。"
  22: "ご自分[じぶん]の民[たみ]を裁[さば]く主[しゅ]なる神[かみ]は、こう言[い]われる。「見[み]よ、わたしはあなたの手[て]から倒[たお]れの杯[さかずき]、わたしの怒[いか]りの鉢[はち]を取[と]り上[あ]げた。あなたはもう、それを飲[の]むことはない。"
  23: "わたしはそれを、あなたを虐[しいた]げ、あなたを辱[はずかし]めた者[もの]たちの手[て]に渡[わた]す。彼[かれ]らはあなたの魂[たましい]に『身[み]をかがめよ、わたしたちが通[とお]るために』と言[い]った。あなたは背中[せなか]を地[ち]のようにし、外[そと]を通[とお]り過[す]ぎる者[もの]たちのための通[とお]り道[みち]とした。」"

notes:
  1: "Ἀκούσατέ μου — «послушайте меня»; διώκοντες τὸ δίκαιον — «гонящие правду» (διώκω — «преследовать, стремиться»), слав. «гонящии правду». στερεὰ πέτρα — «твёрдая скала» (слав. «твердый камень»); ἐλατομήσατε — «вы высекли» (λατομέω). βόθυνος τοῦ λάκκου — «яма рва/водоёма» (βόθυνος — «яма», λάκκος — «ров, цистерна»); слав. «юдоль потока» поняла λάκκος иначе. ὠρύξατε — «вы выкопали» (ὀρύσσω). Речь о Аврааме и Сарре: скала и ров — откуда вы взяты."
  2: "ὠδίνουσαν — «мучившуюся родами» (ὠδίνω), слав. «породившую»; в тексте 生んだ, оттенок родовых мук — в этой заметке. εἷς ἦν — «он был один»: Авраам один, а потомство многочисленно. Четыре глагола — ἐκάλεσα, εὐλόγησα, ἠγάπησα, ἐπλήθυνα («призвал, благословил, возлюбил, умножил») — сохранены все; Синодальный опускает «возлюбил»."
  3: "παρακαλέσω — «утешу» (παρακαλέω), рядом παρεκάλεσα — аорист «утешил»; смена времён сохранена. θήσω τὰ ἔρημα αὐτῆς ὡς παράδεισον κυρίου — «сделаю пустыни её как рай Господень»; слав. удваивает: «и яже ко западом его аки рай Господень». Этой половины в gr-lxx-byz нет, но она есть у Свита (τὰ πρὸς δυσμὰς ὡς παράδεισον Κυρίου), поэтому внесена в текст (西の側); слав. — тот же текст. ἐξομολόγησιν καὶ φωνὴν αἰνέσεως — «исповедание и глас хваления» (ἐξομολόγησις; в псалмах — хвала, благодарение, отсюда 感謝). Тире в конце стиха в модуле — редакторская помета, не перенесена."
  4: "ἀκούσατέ μου ἀκούσατε — двойной призыв сохранён. λαός μου — «народ Мой»; καὶ οἱ βασιλεῖς — «и цари» (в Синодальном по МТ «племя Моё»). ἐνωτίσασθε — «внимайте ушами» (ἐνωτίζομαι). νόμος παρ᾿ ἐμοῦ ἐξελεύσεται — «закон от Меня изойдёт»; εἰς φῶς ἐθνῶν — «в свет народов»."
  5: "ἐγγίζει ταχύ — «близко, скоро» (ταχύς). ὡς φῶς τὸ σωτήριόν μου — «как свет спасение Моё». εἰς τὸν βραχίονά μου ἔθνη ἐλπιοῦσιν — «на мышцу Мою народы будут надеяться»; ἐλπιοῦσιν повторено дважды, как и в слав. («надеятися будут… уповати будут»), повтор сохранён. νῆσοι — «острова», т. е. дальние народы."
  6: "ἄρατε εἰς τὸν οὐρανὸν τοὺς ὀφθαλμούς — «поднимите на небо глаза». ὁ οὐρανὸς ὡς καπνὸς ἐστερεώθη — «небо как дым утвердилось» (στερεόω — «уплотнять, утверждать»); чтение странное, слав. «яко дым утвердися», в МТ «исчезнут, как дым» — держим LXX и слав. ὥσπερ ταῦτα ἀποθανοῦνται — «как это умрут», т. е. как небо и земля (слав. «якоже сия изомрут»); в МТ «как мошки». οὐ μὴ ἐκλίπῃ — усиленное отрицание."
  7: "οἱ εἰδότες κρίσιν — «знающие суд» (слав. «ведящии суд»). οὗ ὁ νόμος μου ἐν τῇ καρδίᾳ ὑμῶν — «у которых закон Мой в сердце вашем» (смешение числа, как в греч.). φαυλισμός — «презрение, хула»; ἡττᾶσθε — «быть побеждённым, уступать» (слав. «не покаряйтеся»), отсюда 負ける."
  8: "ὥσπερ ἱμάτιον βρωθήσεται ὑπὸ χρόνου — «как одежда будет съедена временем» (βιβρώσκω, χρόνος); в МТ «молью». σητός — «моль» (σής), ὡς ἔρια — «как шерсть»; слав. «яко сукно изястся мольми». εἰς γενεὰς γενεῶν — «в роды родов», отсюда 代々に."
  9: "Ἐξεγείρου ἐξεγείρου — двойной призыв, и третий раз ἐξεγείρου внутри стиха; все три сохранены. В LXX и слав. призыв обращён к Иерусалиму (Ιερουσαλημ), в МТ — к мышце Господней («облекись крепостью, мышца Господня»); держим LXX и слав., вариант МТ — здесь. ὡς ἐν ἀρχῇ ἡμέρας — «как в начале дня»; ὡς γενεὰ αἰῶνος — «как род века» (слав. «яко род века»). οὐ σὺ εἶ — «не ты ли», вопрос без сказуемого, продолжается в 51:10. Слав. здесь добавляет «не ты ли еси победил гордаго и расторгнул змиа?» — этого нет ни в gr-lxx-byz, ни у Свита; добавка внесена в текст без 〔…〕 по паритету (чтение Церкви) и отмечена здесь."
  10: "ἡ ἐρημοῦσα θάλασσαν — «опустошающая море» (ἐρημόω), речь об исходе, отсюда 干上がらせ; ὕδωρ ἀβύσσου πλῆθος — «воду бездны, множество». ἡ θεῖσα τὰ βάθη τῆς θαλάσσης ὁδὸν διαβάσεως — «положившая глубины моря путём перехода». ῥυομένοις — «избавленным, спасённым» (ῥύομαι). В начале 51:11 стоит ещё λελυτρωμένοις («искупленным») — продолжение того же вопроса; слав. переносит его сюда («изятым и избавленым»), деление держим по gr, слово передано один раз (贖われた者たち)."
  11: "ὑπὸ κυρίου ἀποστραφήσονται — «Господом возвратятся» (ἀποστρέφω). ἀγαλλίαμα αἰώνιον — «веселие вечное». ἐπὶ τῆς κεφαλῆς αὐτῶν ἀγαλλίασις καὶ αἴνεσις — «на голове их веселие и хвала». ἀπέδρα — «убежала» (ἀποδιδράσκω); ὀδύνη καὶ λύπη καὶ στεναγμός — «болезнь, печаль и воздыхание», три члена сохранены."
  12: "ἐγώ εἰμι ἐγώ εἰμι — «Я есмь, Я есмь», удвоение (слав. «Аз есмь, аз есмь»). ὁ παρακαλῶν σε — «утешающий тебя». γνῶθι τίνα … ἐφοβήθης — «узнай, кого ты убоялась»; у Свита τίς οὖσα («кто ты, что…»), в gr-lxx-byz τίνα; порядок слов в яп. перестроен для ясности, смысл тот же. θνητός — «смертный»; ὡσεὶ χόρτος ἐξηράνθησαν — «как трава иссохли»."
  13: "ἐπελάθου θεὸν τὸν ποιήσαντά σε — «забыла Бога, создавшего тебя». τὸ πρόσωπον τοῦ θυμοῦ — «лицо ярости», т. е. ярость, обращённая на тебя. ὃν τρόπον γὰρ ἐβουλεύσατο τοῦ ἆραί σε — «ибо как он замыслил взять тебя» (βουλεύομαι, αἴρω); оборот оборван, передан как どんなに…望んだことか. καὶ νῦν ποῦ ὁ θυμός — «и где же ярость», риторический вопрос."
  14: "ἐν γὰρ τῷ σῴζεσθαί σε οὐ στήσεται οὐδὲ χρονιεῖ — «ибо когда ты спасаешься, не станет и не замедлит» (χρονίζω); подлежащее не выражено (спасение? притеснитель?), поэтому в тексте без подлежащего и двусмысленность сохранена. Стих короткий и в LXX оборван; в Синодальном по МТ «скоро освобождён будет пленный…» — иное чтение, не внесено."
  15: "ὁ ταράσσων τὴν θάλασσαν — «возмущающий море» (ταράσσω; слав. «возмущаяй»). ἠχῶν τὰ κύματα — «шумящий волнами» (ἠχέω). κύριος σαβαωθ ὄνομά μοι — «Господь Саваоф имя Мне», формула сохранена (万軍の主)."
  16: "θήσω τοὺς λόγους μου εἰς τὸ στόμα σου — «положу слова Мои в уста твои». ὑπὸ τὴν σκιὰν τῆς χειρός μου σκεπάσω σε — «под сенью руки Моей покрою тебя» (σκεπάζω). ἐν ᾗ ἔστησα τὸν οὐρανόν — «которою поставил небо» (у Свита ἔστηκα «стою»); слав. «еюже поставих». καὶ ἐρεῖ Σιων Λαός μου εἶ σύ — «и скажет Сиону: народ Мой ты»; подлежащее не выражено, в тексте Господь говорит о Себе в 3-м лице (シオンに言う), слова к Сиону — 『…』."
  17: "Ἐξεγείρου ἐξεγείρου ἀνάστηθι — три призыва (ἐξεγείρου дважды и ἀνάστηθι), все сохранены. ἡ πιοῦσα τὸ ποτήριον τοῦ θυμοῦ — «испившая чашу ярости». τὸ ποτήριον τῆς πτώσεως — «чашу падения» (πτῶσις). κόνδυ — «глубокая чаша, кубок» (слав. «фиал»), передано 鉢. ἐξέπιες καὶ ἐξεκένωσας — «испила и истощила»."
  18: "ἀντιλαμβανόμενος τῆς χειρός — «поддерживающий за руку» (ἀντιλαμβάνομαι). ὧν ὕψωσας — «которых ты возвысила» (ὑψόω). В Синодальном по МТ род мужской («его»), в LXX и слав. — женский (Иерусалим); держим LXX."
  19: "δύο ταῦτα ἀντικείμενά σοι — «две эти беды против тебя» (ἀντίκειμαι); далее перечислены четыре (πτῶμα καὶ σύντριμμα, λιμὸς καὶ μάχαιρα), счёт «два» не сглажен. συλλυπηθήσεται — «будет сострадать» (συλλυπέομαι). σύντριμμα — «сокрушение» (συντρίβω). Оба вопроса сохранены; в Синодальном второй вопрос иной («кем я утешу тебя»)."
  20: "οἱ ἀπορούμενοι — «находящиеся в нужде, обессилевшие» (ἀπορέω). οἱ καθεύδοντες ἐπ᾿ ἄκρου πάσης ἐξόδου — «спящие на краю всякого выхода», т. е. на углах улиц (слав. «седяще»). σευτλίον ἡμίεφθον — «свёкла недоваренная» (σευτλίον — свёкла, мангольд), отсюда 半分煮えたビート; в Синодальном по МТ «как серна в тенетах». ἐκλελυμένοι — «расслабленные» (ἐκλύω); διά + винитив — «из-за Господа Бога»."
  21: "τεταπεινωμένη — «униженная, смиренная» (ταπεινόω). μεθύουσα οὐκ ἀπὸ οἴνου — «упившаяся не от вина»; образ сохранён: опьянение от чаши ярости."
  22: "οὕτως λέγει κύριος ὁ θεὸς ὁ κρίνων τὸν λαὸν αὐτοῦ — формула вне кавычек: «так говорит Господь Бог, судящий народ Свой» (в Синодальном по МТ «Господь твой… отмщающий за Свой народ»). τὸ κόνδυ τοῦ θυμοῦ — «кубок ярости»; слав. добавляет «моея» («фиал ярости моея»), и это чтение есть у Свита (τοῦ θυμοῦ μου), поэтому в тексте わたしの怒りの鉢. οὐ προσθήσῃ ἔτι πιεῖν αὐτό — «не приложишь более пить его»."
  23: "ἐμβαλῶ αὐτὸ εἰς τὰς χεῖρας — «вложу его в руки» (ἐμβάλλω). τῶν ἀδικησάντων σε — «обидевших тебя» (ἀδικέω). οἳ εἶπαν τῇ ψυχῇ σου — «которые сказали душе твоей»; речь притеснителей — 『…』. Κύψον, ἵνα παρέλθωμεν — «склонись, чтобы нам пройти» (κύπτω). ἔθηκας ἴσα τῇ γῇ τὰ μετάφρενά σου — «ты положила спину твою наравне с землёй» (μετάφρενον — «спина, хребет»); ἔξω τοῖς παραπορευομένοις — «вне, для проходящих»."
