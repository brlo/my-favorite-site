# jp-box, Исаия, глава 51. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный, с МТ) — только для понимания,
# не источник. jp-joc в гл. 51 нет; jp-ni не использовался. Разночтения сверены по
# второму греческому свидетелю gr-lxx-swete (Свит) — в notes.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 51: 1–8 слово Господа «послушайте Меня, стремящиеся к правде»: скала Авраама
# и ров Сарры, утешение Сиона, закон и суд — свет народам, небо как дым и страх
# человеческий; 9–11 призыв «восстань, восстань»: рука, море и бездна, возвращение
# искупленных; 12–16 ответ Господа «Я, Я — утешающий тебя»: забытый Творец, слова
# в уста, Сион — «народ Мой»; 17–23 чаша ярости, нет утешающего, «вот, Я взял чашу
# из руки твоей», чаша переходит к притеснителям.
# Голоса: 51:1–8 — 「…」 (слово Господа, одна цитата); 51:9–11 — пророческий призыв,
# без кавычек (в LXX призыв обращён к Иерусалиму, в МТ — к мышце Господней); 51:12–16
# — 「…» (ответ Господа; в 51:16 слова к Сиону — 『…』); 51:17–21 — призыв пророка,
# без кавычек; 51:22–23 — 「…» после формулы «так говорит Господь Бог» вне кавычек,
# в 51:23 речь притеснителей — 『…』.
# Нумерация по gr: 23 стиха, как у csl и ru. Слав. делит и местами добавляет:
# 51:3 «и поставлю пустыню его яко рай, и яже ко западом его аки рай Господень» —
# второй половины нет в gr-lxx-byz, но она есть у Свита (τὰ πρὸς δυσμὰς…); 51:9 слав.
# добавляет «победил гордаго и расторгнул змиа» (нет ни в byz, ни у Свита); λελυτρωμένοις
# (начало 51:11) слав. переносит в конец 51:10 («и избавленым»). Деление держим по gr,
# карта — в notes 3, 9–11.
# 〔…〕 нет. Сносок ⟨…⟩ нет: 杯, 鉢, 竜, ビート уже в корпусе или понятны.
# Имена — транслитерация греческого (LXX).

