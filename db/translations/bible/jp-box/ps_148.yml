tr_code: jp-box
book: ps
chapter: 148
draft: true

verses:
  1: "アレルヤ。ハガイとゼカリヤの詩[うた]。天[てん]から主[しゅ]をほめたたえよ。高[たか]いところで主[しゅ]をほめたたえよ。"
  2: "主[しゅ]のすべての天使[てんし]たちよ、主[しゅ]をほめたたえよ。主[しゅ]のすべての軍[ぐん]勢[せい]よ、主[しゅ]をほめたたえよ。"
  3: "太陽[たいよう]と月[つき]よ、主[しゅ]をほめたたえよ。すべての輝[かがや]く星[ほし]よ、主[しゅ]をほめたたえよ。"
  4: "天[てん]の天[てん]よ、天[てん]の上[うえ]の水[みず]よ、主[しゅ]をほめたたえよ。"
  5: "彼[かれ]らが主[しゅ]の名[な]をほめたたえるように。主[しゅ]が語[かた]られると、彼[かれ]らは生[う]まれ、主[しゅ]が命[めい]じられると、彼[かれ]らは造[つく]られたからである。"
  6: "主[しゅ]は彼[かれ]らをとこしえに、代[よ]々[よ]にわたって立[た]たせ、越[こ]えることのできない定[さだ]めを置[お]かれた。"
  7: "地[ち]から主[しゅ]をほめたたえよ。大[おお]きな魚[さかな]たちよ、すべての淵[ふち]よ。"
  8: "火[ひ]よ、雹[ひょう]よ、雪[ゆき]よ、氷[こおり]よ、主[しゅ]の言葉[ことば]を行[おこな]う嵐[あらし]の風[かぜ]よ。"
  9: "山[やま]よ、すべての丘[おか]よ、実[み]を結[むす]ぶ木[き]よ、すべての杉[すぎ]の木[き]よ。"
  10: "野[や]獣[じゅう]よ、もろもろの家畜[かちく]よ、地[ち]を這[は]うものよ、翼[つばさ]ある鳥[とり]よ。"
  11: "地[ち]の王[おう]たちよ、すべての民[たみ]よ、支[し]配[はい]者[しゃ]たちよ、地[ち]のすべての裁[さば]き人[びと]よ。"
  12: "若[わか]い男[おとこ]たちも処女[しょじょ]たちも、老[お]いた者[もの]も若[わか]い者[もの]も。"
  13: "彼[かれ]らが主[しゅ]の名[な]をほめたたえるように。ただ主[しゅ]の名[な]だけが高[たか]く上[あ]げられ、その栄光[えいこう]は地[ち]にも天[てん]にも及[およ]ぶ。"
  14: "主[しゅ]はご自分[じぶん]の民[たみ]の角[つの]を高[たか]く上[あ]げられる。これは、そのすべての聖[せい]なる者[もの]たち、主[しゅ]に近[ちか]づく民[たみ]であるイスラエルの子[こ]らへの賛美[さんび]である。"

notes:
  1: "Αλληλουια· Αγγαιου καὶ Ζαχαριου — アレルヤ。ハガイとゼカリヤの詩. Надписание — стих 0 (в csl-ru отдельного стиха нет, влито в ст. 1). Αἰνεῖτε τὸν κύριον ἐκ τῶν οὐρανῶν — 天から主をほめたたえよ (ἐκ — «из»). αἰνεῖτε αὐτὸν ἐν τοῖς ὑψίστοις — 高いところで主をほめたたえよ (ὕψιστος — «высочайший»)."
  2: "πάντες οἱ ἄγγελοι αὐτοῦ — 主のすべての天使たち (ἄγγελος — 天使). πᾶσαι αἱ δυνάμεις αὐτοῦ — 主のすべての軍勢 (δύναμις — «сила», здесь «воинство»)."
  3: "ἥλιος καὶ σελήνη — 太陽と月 (σελήνη — «луна»). πάντα τὰ ἄστρα καὶ τὸ φῶς — すべての輝く星 (ἄστρον — «звезда»; φῶς — «свет»)."
  4: "οἱ οὐρανοὶ τῶν οὐρανῶν — 天の天 (двойное небо, как в евр. превосходная степень). τὸ ὕδωρ τὸ ὑπεράνω τῶν οὐρανῶν — 天の上の水 (ὑπεράνω — «выше»)."
  5: "αἰνεσάτωσαν τὸ ὄνομα κυρίου — 彼らが主の名をほめたたえるように. αὐτὸς εἶπεν, καὶ ἐγενήθησαν — 主が語られると、彼らは生まれ (γίνομαι — «бывать, становиться»). αὐτὸς ἐνετείλατο, καὶ ἐκτίσθησαν — 主が命じられると、彼らは造られた (ἐντέλλομαι — «заповедать»; κτίζω — «творить»)."
  6: "ἔστησεν αὐτὰ εἰς τὸν αἰῶνα — 主は彼らをとこしえに立たせ (ἵστημι — «ставить»). πρόσταγμα ἔθετο, καὶ οὐ παρελεύσεται — 越えることのできない定めを置かれた (πρόσταγμα — «повеление»; παρέρχομαι — «преходить»)."
  7: "αἰνεῖτε τὸν κύριον ἐκ τῆς γῆς — 地から主をほめたたえよ. δράκοντες καὶ πᾶσαι ἄβυσσοι — 大きな魚たちよ、すべての淵よ (δράκων — «дракон, морское чудовище»; ἄβυσσος — «бездна»; передано 大きな魚, как у jp-joc)."
  8: "πῦρ, χάλαζα, χιών, κρύσταλλος — 火よ、雹よ、雪よ、氷よ (χάλαζα — «град»). πνεῦμα καταιγίδος — 嵐の風 (καταιγίς — «буря»; πνεῦμα здесь — «ветер», поэтому 風). τὰ ποιοῦντα τὸν λόγον αὐτοῦ — 主の言葉を行うものたちよ."
  9: "τὰ ὄρη καὶ πάντες οἱ βουνοί — 山よ、すべての丘よ (βουνός — «холм»). ξύλα καρποφόρα — 実を結ぶ木よ (καρποφόρος — «плодоносный»). πᾶσαι κέδροι — すべての杉の木よ (κέδρος — «кедр»)."
  10: "τὰ θηρία καὶ πάντα τὰ κτήνη — 野獣よ、もろもろの家畜よ (θηρίον — «зверь»; κτῆνος — «скот»). ἑρπετὰ καὶ πετεινὰ πτερωτά — 地を這うものよ、翼ある鳥よ (ἑρπετόν — «пресмыкающееся»; πτερωτός — «пернатый»)."
  11: "βασιλεῖς τῆς γῆς καὶ πάντες λαοί — 地の王たちよ、すべての民よ. ἄρχοντες καὶ πάντες κριταὶ γῆς — 支配者たちよ、地のすべての裁き人よ (κριτής — «судья»)."
  12: "νεανίσκοι καὶ παρθένοι — 若い男たちも処女たちも (νεανίσκος — «юноша»; παρθένος — «дева»). πρεσβῦται μετὰ νεωτέρων — 老いた者も若い者も (πρεσβύτης — «старец»)."
  13: "αἰνεσάτωσαν τὸ ὄνομα κυρίου — 彼らが主の名をほめたたえるように. ὑψώθη τὸ ὄνομα αὐτοῦ μόνου — ただ主の名だけが高く上げられ (ὑψόω — «возвышать»). ἡ ἐξομολόγησις αὐτοῦ ἐπὶ γῆς καὶ οὐρανοῦ — その栄光は地にも天にも及ぶ (ἐξομολόγησις — «славословие», здесь «слава, хвала»)."
  14: "καὶ ὑψώσει κέρας λαοῦ αὐτοῦ — 主はご自分の民の角を高く上げられる (κέρας — «рог», символ силы и достоинства). ὕμνος πᾶσι τοῖς ὁσίοις αὐτοῦ — これは、そのすべての聖なる者たちへの賛美 (ὕμνος — «гимн, хвала»). τοῖς υἱοῖς Ισραηλ, λαῷ ἐγγίζοντι αὐτῷ — 主に近づく民であるイスラエルの子らすべてへの (ἐγγίζω — «приближаться»)."
