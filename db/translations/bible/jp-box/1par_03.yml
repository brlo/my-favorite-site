# jp-box, 1-я Паралипоменон, глава 3. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); церковнославянский (csl-ru) — второй свидетель
# церковного текста: слав. чтения и добавки входят в основной текст без 〔…〕,
# вариант LXX — в notes. ru (Синодальный) — только для понимания, не источник.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 3: сыны Давида в Хевроне (1–4) и в Иерусалиме (5–9); род Соломона
# до Седекии (10–16); сыны Иехонии и род Зоровавеля после плена (17–24).
# Имена царей даны в формах 1–4 Цар (レハブアム, アビヤ, アサ, ヨシャファト,
# ヨラム, アハズヤ, ヨアシュ, アマツヤ, ヨタム, アハズ, エゼキヤ, マナセ, アモン,
# ヨシヤ, ヨアハズ, ヨヤキム, ゼデキヤ, エホヤキン); сыновей Давида — по 2 Цар
# (アムノン, アブサロム, アドニヤ, サファティア, イエテラアム, タマル).
# Греческие формы 1 Пар и расхождения с csl/Синод. — в notes.
# Речи нет; красного нет. 〔…〕 нет: в gr-lxx-byz на месте всех стихов есть текст.
# Сносок ⟨…⟩ нет: 側女, 長子, 系図 уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: 1par
chapter: 3
draft: true

verses:
  1: "ダビデの子[こ]らで、ヘブロンで彼[かれ]に生[う]まれた者[もの]は次[つぎ]のとおりである。長子[ちょうし]はイズレエル人[じん]アヒノアムによるアムノン、次[つぎ]はカルメル人[じん]アビガイルによるダルイア、"
  2: "第三[だいさん]は、ゲシルの王[おう]トルミの娘[むすめ]マアカの子[こ]アブサロム、第四[だいし]はアギトの子[こ]アドニヤ、"
  3: "第五[だいご]はアビタルによるサファティア、第六[だいろく]は彼[かれ]の妻[つま]エグラによるイエテラアム、"
  4: "ヘブロンで彼[かれ]に生[う]まれた者[もの]は六人[ろくにん]。彼[かれ]はそこで七年[ななねん]六[ろっ]か月[げつ]治[おさ]め、エルサレムで三十三年[さんじゅうさんねん]治[おさ]めた。"
  5: "エルサレムで彼[かれ]に生[う]まれた者[もの]は次[つぎ]のとおりである。サマア、ショバブ、ナタン、ソロモン、すなわちアミエルの娘[むすめ]バテ・シェバによる四人[よにん]、"
  6: "またイバアル、エリシャマ、エリファレト、"
  7: "またナゲ、ナファグ、ヤヌエ、"
  8: "またエリシャマ、エリアダ、エリファレト。合[あ]わせて九人[きゅうにん]である。"
  9: "これらはみなダビデの子[こ]らで、側女[そばめ]たちによる子[こ]らを除[のぞ]く。彼[かれ]らの姉妹[しまい]はタマルである。"
  10: "ソロモンの子[こ]らは、レハブアム、その子[こ]アビヤ、その子[こ]アサ、その子[こ]ヨシャファト、"
  11: "その子[こ]ヨラム、その子[こ]アハズヤ、その子[こ]ヨアシュ、"
  12: "その子[こ]アマツヤ、その子[こ]アザリヤ、その子[こ]ヨタム、"
  13: "その子[こ]アハズ、その子[こ]エゼキヤ、その子[こ]マナセ、"
  14: "その子[こ]アモン、その子[こ]ヨシヤである。"
  15: "ヨシヤの子[こ]らは、長子[ちょうし]ヨアハズ、次[つぎ]はヨヤキム、第三[だいさん]はゼデキヤ、第四[だいし]はシャルムである。"
  16: "ヨヤキムの子[こ]らは、その子[こ]ヨヤキン、その子[こ]ゼデキヤである。"
  17: "ヨヤキンの子[こ]らは、アシル、その子[こ]サラティエル、"
  18: "メルキラム、ファダイア、サネサル、イェケミヤ、オサモ、デネティである。"
  19: "サラティエルの子[こ]らは、ゾロバベルとシェメイ。ゾロバベルの子[こ]らは、モソラム、ハナニヤ、およびその姉妹[しまい]サロミト、"
  20: "またアシュベ、オエル、バラキヤ、アサデヤ、アショバエスド。合[あ]わせて五人[ごにん]である。"
  21: "ハナニヤの子[こ]らは、ファレテヤ、その子[こ]イシャヤ、その子[こ]ラファヤ、その子[こ]オルナ、その子[こ]オバデヤ、その子[こ]シェカニヤである。"
  22: "シェカニヤの子[こ]はシェマヤ、シェマヤの子[こ]らは、ハトゥシュ、ヨエル、マリ、ノアデヤ、シャファト。合[あ]わせて六人[ろくにん]である。"
  23: "ノアデヤの子[こ]らは、エリテナン、エゼキヤ、エズリカム、三人[さんにん]である。"
  24: "エリテナンの子[こ]らは、オドヤ、エリアシブ、ファラヤ、アクン、ヨアナン、デラヤ、アナニ。合[あ]わせて七人[しちにん]である。"

notes:
  1: "Καὶ οὗτοι ἦσαν υἱοὶ Δαυιδ οἱ τεχθέντες αὐτῷ ἐν Χεβρων· ὁ πρωτότοκος Αμνων τῇ Αχινααμ τῇ Ιεζραηλίτιδι, ὁ δεύτερος Δανιηλ τῇ Αβιγαια τῇ Καρμηλίᾳ — «и вот сыны Давида, рождённые ему в Хевроне: первенец Амнон от Ахиноамы Изреелитянки, второй — Даниил от Авигеи Кармилитянки». Греч. Δανιηλ, слав. «далуиа» (Далуия) — по паритету в тексте ダルイア, греч. вариант ダニエル. Амнон, Ахиноама, Авигея — формы 2 Цар 3:2–3."
  2: "ὁ τρίτος Αβεσσαλωμ υἱὸς Μωχα θυγατρὸς Θολμαι βασιλέως Γεδσουρ, ὁ τέταρτος Αδωνια υἱὸς Αγγιθ — 第三 アブサロム, マアカ, トルミ, ゲシル, 第四 アドニヤ, アギト (2 Цар 3:3–4). Греч. Γεδσουρ — Гессур; в 2 Цар 3:3 форма корпуса ゲシル."
  3: "ὁ πέμπτος Σαφατια τῆς Αβιταλ, ὁ ἕκτος Ιεθρααμ τῇ Αγλα γυναικὶ αὐτοῦ — サファティア (от Авиталы), イエテラアム (от Аглаи, жены его). Греч. Ιεθρααμ, Αγλα; формы 2 Цар 3:4–5 — イエテラアム, エグラ."
  4: "ἓξ ἐγεννήθησαν αὐτῷ ἐν Χεβρων, καὶ ἐβασίλευσεν ἐκεῖ ἑπτὰ ἔτη καὶ ἑξάμηνον. καὶ τριάκοντα καὶ τρία ἔτη ἐβασίλευσεν ἐν Ιερουσαλημ — шесть сыновей в Хевроне; «царствовал там семь лет и шесть месяцев, а тридцать три года — в Иерусалиме» (ἑξάμηνον — полугодие). Слав. «седмь лет и шесть месяц»."
  5: "καὶ οὗτοι ἐτέχθησαν αὐτῷ ἐν Ιερουσαλημ· Σαμαα, Σωβαβ, Ναθαν καὶ Σαλωμων, τέσσαρες τῇ Βηρσαβεε θυγατρὶ Αμιηλ — サマア、ショバブ、ナタン、ソロモン, «четверо от Вирсавии, дочери Аммиила». Греч. Σαμαα (в 2 Цар 5:14 — Σαμμους, форма корпуса サムス), Βηρσαβεε — バテ・シェバ (1–2 Цар)."
  6: "καὶ Ιβααρ καὶ Ελισαμα καὶ Ελιφαλετ — イバアル、エリシャマ、エリファレト. В 2 Цар 5:15 те же лица: エベア、エリシュス、イフィエス — греч. формы там иные; держимся греч. 1 Пар."
  7: "καὶ Ναγε καὶ Ναφαγ καὶ Ιανουε — ナゲ、ナファグ、ヤヌエ. Слав. «нагис, нафек и иафие»; в 2 Цар 5:15 — ナフェク."
  8: "καὶ Ελισαμα καὶ Ελιαδα καὶ Ελιφαλετ, ἐννέα — エリシャマ、エリアダ、エリファレト; «девять» — итог всех сыновей в Иерусалиме (ст. 5–8). Имя Елисама повторено (ст. 6), как в гр."
  9: "πάντες υἱοὶ Δαυιδ πλὴν τῶν υἱῶν τῶν παλλακῶν, καὶ Θημαρ ἀδελφὴ αὐτῶν — «все сыны Давида, кроме сыновей наложниц; и Фамарь, сестра их» (πλήν — кроме, παλλακή — 側女). Греч. Θημαρ — タマル (2 Цар 13:1)."
  10: "Υἱοὶ Σαλωμων· Ροβοαμ, Αβια υἱὸς αὐτοῦ, Ασα υἱὸς αὐτοῦ, Ιωσαφατ υἱὸς αὐτοῦ — レハブアム、アビヤ、アサ、ヨシャファト; далее формула «сын его» (υἱὸς αὐτοῦ) повторяется в каждом стихе, как в гр. Формы 1–4 Цар: 3 Цар 11:43; 15:8, 24."
  11: "Ιωραμ υἱὸς αὐτοῦ, Οχοζια υἱὸς αὐτοῦ, Ιωας υἱὸς αὐτοῦ — ヨラム、アハズヤ、ヨアシュ (4 Цар 8:24; 12:1). Греч. Οχοζια — Охозия, в корпусе アハズヤ."
  12: "Αμασιας υἱὸς αὐτοῦ, Αζαρια υἱὸς αὐτοῦ, Ιωαθαν υἱὸς αὐτοῦ — アマツヤ、アザルヤ、ヨタム (4 Цар 14:1; 15:1, 32). Αζαρια — царь, названный также Озией (ウジヤ); в 4 Цар 15:1 форма корпуса アザリヤ."
  13: "Αχαζ υἱὸς αὐτοῦ, Εζεκιας υἱὸς αὐτοῦ, Μανασσης υἱὸς αὐτοῦ — アハズ、エゼキヤ、マナセ (4 Цар 16:1; 18:1; 21:1)."
  14: "Αμων υἱὸς αὐτοῦ, Ιωσια υἱὸς αὐτοῦ — アモン、ヨシヤ (4 Цар 21:19, 24)."
  15: "καὶ υἱοὶ Ιωσια· πρωτότοκος Ιωαναν, ὁ δεύτερος Ιωακιμ, ὁ τρίτος Σεδεκια, ὁ τέταρτος Σαλουμ — ヨアハズ、ヨヤキム、ゼデキヤ、シャルム. Греч. Ιωαναν (Иоанан), слав. «иоахаз» — по паритету в тексте ヨアハズ (4 Цар 23:30); Σαλουμ — シャルム, он же Иоахаз (Иер 22:11)."
  16: "καὶ υἱοὶ Ιωακιμ· Ιεχονιας υἱὸς αὐτοῦ, Σεδεκιας υἱὸς αὐτοῦ — エホヤキン、ゼデキヤ (4 Цар 24:8, 17). Греч. Ιεχονιας — Иехония; в корпусе ヨヤキン (4 Цар 24:8)."
  17: "καὶ υἱοὶ Ιεχονια — ασιρ· Σαλαθιηλ υἱὸς αὐτοῦ — ヨヤキンの子ら: アシル, «Салафиил, сын его» (в гр. ασιρ — Асир, возможно «узник»; слав. «асир»). Греч. Σαλαθιηλ — サラティエル (Лк 3:27)."
  18: "Μελχιραμ καὶ Φαδαιας καὶ Σανεσαρ καὶ Ιεκεμια καὶ Ωσαμω καὶ Δενεθι — メルキラム、ファダイア、サネサル、イェケミヤ、オサモ、デネティ. Греч. Σανεσαρ — евр. Шенацар; слав. «анесар» (порча)."
  19: "καὶ υἱοὶ Σαλαθιηλ· Ζοροβαβελ καὶ Σεμει. καὶ υἱοὶ Ζοροβαβελ· Μοσολλαμος καὶ Ανανια, καὶ Σαλωμιθ ἀδελφὴ αὐτῶν — ゾロバベル、シェメイ; モソラム、ハナニヤ, сестра их サロミト. Греч. Μοσολλαμος — Мешуллам; форма モソラム (ср. 1 Пар 8:17)."
  20: "καὶ Ασουβε καὶ Οολ καὶ Βαραχια καὶ Ασαδια καὶ Ασοβαεσδ, πέντε — アシュベ、オエル、バラキヤ、アサデヤ、アショバエスド; «пять». Это сыны Зоровавеля (продолжение ст. 19), а не Хашавы."
  21: "καὶ υἱοὶ Ανανια· Φαλλετια, καὶ Ισαια υἱὸς αὐτοῦ, Ραφαια υἱὸς αὐτοῦ, Ορνα υἱὸς αὐτοῦ, Αβδια υἱὸς αὐτοῦ, Σεχενια υἱὸς αὐτοῦ — ファレテヤ、イシャヤ、ラファヤ、オルナ、オバデヤ、シェカニヤ; цепочка «сын его» (υἱὸς αὐτοῦ) передана повтором その子. Ορνα здесь — не иевусеянин Орна (1 Пар 21), а сын Ханании."
  22: "καὶ υἱὸς Σεχενια· Σαμαια. καὶ υἱοὶ Σαμαια· Χαττους καὶ Ιωηλ καὶ Μαρι καὶ Νωαδια καὶ Σαφαθ, ἕξ — シェマヤ; ハトゥシュ、ヨエル、マリ、ノアデヤ、シャファト; в гр. сказано «шесть» (ἕξ), но перечислено пять имён. Слав. тоже «шесть». В евр. счёт иной (шестым, вероятно, считался сам Шемаия или утраченное имя)."
  23: "καὶ υἱοὶ Νωαδια· Ελιθεναν καὶ Εζεκια καὶ Εζρικαμ, τρεῖς — エリテナン、エゼキヤ、エズリカム; «трое». Греч. Ελιθεναν — Елиоенай."
  24: "καὶ υἱοὶ Ελιθεναν· Οδουια καὶ Ελιασιβ καὶ Φαλαια καὶ Ακουν καὶ Ιωαναν καὶ Δαλαια καὶ Ανανι, ἑπτά — オドヤ、エリアシブ、ファラヤ、アクン、ヨアナン、デラヤ、アナニ; «семь». Греч. Οδουια — Годавия, Ακουν — Аккув."
