# jp-box, Иисус Навин, глава 14. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в главах 13–15 нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 14: раздел земли к западу от Иордана по жребию (1–5); Халев просит и получает
# Хеврон (6–15).
# Кавычки: речь Халева — 「…」 (6б–12), слова Моисея внутри неё — 『…』 (9).
# 〔…〕 — 14:3: греческий стих оборван («от заиорданья, и левитам не дал жребия...»),
# начало фразы есть только в церковнославянском («даде бо моисей наследие...»),
# поэтому оно восстановлено в 〔…〕 как слова церковного чтения, отсутствующие в gr-lxx-byz;
# проверено: μωυσης / κληρονομια в 14:3 отсутствуют.
# Сносок ⟨…⟩ нет: 嗣業, くじ, 氏族, 祭司 уже пояснены в корпусе.
# Топонимы: ヘブロン, ガルガル, カデシュ・バルネア — формы брифа; エナク (как в Числ).

