verses:
  1: "カナンの地[ち]でイスラエルの子[こ]らが嗣業[しぎょう]として受[う]け継[つ]いだものは次[つぎ]のとおりである。祭司[さいし]エレアザル、ヌンの子ヨシュア、およびイスラエルの子らの部族[ぶぞく]の父[ちち]たちの長[かしら]たちが、彼[かれ]らにこれを分[わ]け与[あた]えた。"
  2: "彼[かれ]らはくじによって嗣業[しぎょう]を受[う]け継[つ]いだ。主[しゅ]がヨシュアの手[て]を借[か]りて、九[ここの]つの部族[ぶぞく]と半分[はんぶん]の部族とに命[めい]じたとおりである。"
  3: "〔モーセはすでに、ヨルダン川[がわ]の向[む]こう側[がわ]で、二[ふた]つの部族[ぶぞく]と半分[はんぶん]の部族に嗣業[しぎょう]を与えていた。〕ただ、レビ人[びと]には彼[かれ]らの間[あいだ]でくじは与[あた]えられなかった。"
  4: "ヨセフの子[こ]らが二[ふた]つの部族[ぶぞく]、マナセとエフライムであったからである。レビ人[びと]には地[ち]のうちで分[わ]け前[まえ]は与[あた]えられず、ただ住[す]むための町々[まちまち]と、その家畜[かちく]のための放牧地[ぼくぼくち]、およびその家畜が与えられただけであった。"
  5: "主[しゅ]がモーセに命[めい]じたとおりに、イスラエルの子[こ]らは行[おこな]い、その地[ち]を分[わ]けた。"
  6: "ユダの子[こ]らはガルガルでヨシュアのもとに来[き]た。ケネズ人[じん]イェフォンネの子カレブが彼[かれ]に言[い]った。「あなたは、主[しゅ]が神[かみ]の人[ひと]モーセに、わたしとあなたについてカデシュ・バルネアで語[かた]られたその言葉[ことば]をご存[ぞん]じです。"
  7: "わたしは四十歳[さい]のとき、神[かみ]のしもべモーセが、この地[ち]を探[さぐ]るためにわたしをカデシュ・バルネアから遣[つか]わしました。わたしは彼[かれ]に、その心[こころ]にかなう報告[ほうこく]を返[かえ]しました。"
  8: "しかし、わたしとともに上[のぼ]った兄弟[きょうだい]たちは民[たみ]の心[こころ]を変[か]えてしまいました。しかし、わたしは主[しゅ]なるわたしの神[かみ]に従[したが]い続[つづ]けました。"
  9: "モーセはその日[ひ]、誓[ちか]って言[い]った。『あなたが足[あし]を踏[ふ]み入[い]れた地[ち]は、あなたとあなたの子[こ]どもとのくじの嗣業[しぎょう]となり、永遠[えいえん]に至[いた]るであろう。あなたが主[しゅ]なるわたしたちの神[かみ]の後[あと]に従[したが]い続[つづ]けたからである。』"
  10: "そして今[いま]、主[しゅ]は言[い]われたとおりに、わたしを生[い]き長[なが]らえさせてくださいました。主がこの言葉[ことば]をモーセに語られ、イスラエルが荒野[こうや]を歩[あゆ]んだときから、今年[ことし]で四十五[よんじゅうご]年[ねん]になります。そして今、見[み]よ、わたしは今日[きょう]八十五歳[さい]です。"
  11: "今日[きょう]もわたしは、モーセがわたしを遣[つか]わしたときと同[おな]じく力[ちから]があります。戦[いくさ]に出[で]て行[い]くにも、入[はい]って行くにも、今[いま]も同じ力があるのです。"
  12: "そこで今[いま]、わたしはこの山[やま]を求[もと]めます。主[しゅ]があの日[ひ]に言[い]われたとおりです。あなたもあの日にこの言葉[ことば]を聞[き]いておられます。今、そこにはエナク人[じん]がいて、町々[まちまち]は堅固[けんご]で大[おお]きいのです。しかし、もし主がわたしとともにおられるなら、主がわたしに言われたとおりに、わたしは彼[かれ]らを滅[ほろ]ぼし尽[つ]くします。」"
  13: "ヨシュアは彼[かれ]を祝福[しゅくふく]し、ケネズの子[こ]イェフォンネの子カレブに、ヘブロンをくじの嗣業[しぎょう]として与[あた]えた。"
  14: "それゆえ、ヘブロンは今日[きょう]まで、ケネズ人[じん]イェフォンネの子[こ]カレブのくじの嗣業[しぎょう]となった。彼[かれ]がイスラエルの神[かみ]である主[しゅ]の命令[めいれい]に従[したが]ったからである。"
  15: "ヘブロンの名[な]は以前[いぜん]、アルボクの町[まち]であった。そこはエナク人[じん]の母[ぼ]都[と]である。そして、地[ち]は戦[いくさ]から休[やす]んだ。"

notes:
  1: "οἱ κατακληρονομήσαντες — получившие в удел. οἷς κατεκληρονόμησεν αὐτοῖς — которым дали в удел: Елеазар, Иисус и начальники. ἄρχοντες πατριῶν φυλῶν — начальники отцов племён, т. е. главы родов (父たちの長). Сказуемое греч. фразы стоит в конце; по-японски вынесено вперёд."
  2: "κατὰ κλήρους ἐκληρονόμησαν — по жребиям получили в удел (κλῆρος — くじ). ἐν χειρὶ Ἰησοῦ — «рукою Иисуса»: в слав. здесь «моисеом»; в тексте по греч. (через Иисуса). ταῖς ἐννέα φυλαῖς καὶ τῷ ἡμίσει φυλῆς — девяти племенам и половине племени."
  3: "Греч. стих оборван: «от заиорданья, и левитам не дал жребия между ними» — без начала, которое сохранилось только в слав.: «даде бо моисей наследие дву племеном и полплемени манассиину об ону страну иордана». Это начало взято в 〔…〕. κλῆρον ἐν αὐτοῖς — жребия между ними."
  4: "ὅτι ἦσαν οἱ υἱοὶ Ιωσηφ δύο φυλαί — ибо сыны Иосифа — два племени. οὐκ ἐδόθη μερὶς — не дана часть (μερίς, 分け前). ἀλλ᾿ ἢ πόλεις κατοικεῖν — а только города для жительства. τὰ ἀφωρισμένα τοῖς κτήνεσιν — отделённое для скота, т. е. пастбища (放牧地, ср. Числ 35)."
  5: "ὃν τρόπον ἐνετείλατο κύριος τῷ Μωυσῇ — как заповедал Господь Моисею. ἐμέρισαν τὴν γῆν — разделили землю."
  6: "προσήλθοσαν — пришли (προσέρχομαι). ὁ Κενεζαῖος — Кенезеянин (ケネズ人; слав. «кенезей»). Σὺ ἐπίστῃ τὸ ῥῆμα — «ты знаешь слово» (ἐπίσταμαι, 2-е л. ед. ч.). ἄνθρωπον τοῦ θεοῦ — человека Божия. ἐν Καδης Βαρνη — в Кадес-Варни (カデシュ・バルネア). Стих открывает речь Халева (6–12)."
  7: "τεσσαράκοντα ἐτῶν ἤμην — был сорока лет. κατασκοπεῦσαι τὴν γῆν — осмотреть землю (κατασκοπεύω, ср. Числ 13). ἀπεκρίθην αὐτῷ λόγον κατὰ τὸν νοῦν αὐτοῦ — «ответил ему слово по уму его», т. е. дал ответ, согласный с его мыслью."
  8: "μετέστησαν τὴν καρδίαν τοῦ λαοῦ — «переменили сердце народа» (μεθίστημι), т. е. привели народ в страх. προσετέθην ἐπακολουθῆσαι — «приложился последовать», усилительный оборот (προστίθημι + инфинитив): всецело последовал; передано 従い続けました."
  9: "ὤμοσεν Μωϋσῆς — поклялся Моисей. ἡ γῆ, ἐφ᾿ ἣν ἐπέβης — земля, на которую ты вступил (ἐπιβαίνω). εἰς τὸν αἰῶνα — навек. ὀπίσω κυρίου — вслед Господа. Слова Моисея внутри речи Халева — 『…』 (вложенная речь)."
  10: "διέθρεψέν με κύριος — «вскормил меня Господь», т. е. сохранил мне жизнь (διατρέφω). τοῦτο τεσσαρακοστὸν καὶ πέμπτον ἔτος — «это сорок пятый год». ἐπορεύθη Ισραηλ ἐν τῇ ἐρήμῳ — Израиль ходил в пустыне. ὀγδοήκοντα καὶ πέντε ἐτῶν — восьмидесяти пяти лет."
  11: "ἔτι εἰμὶ σήμερον ἰσχύων — ещё и сегодня я крепок (ἰσχύω). ὡσεὶ ὅτε ἀπέστειλέν με Μωϋσῆς — как тогда, когда послал меня Моисей. ἐξελθεῖν καὶ εἰσελθεῖν εἰς τὸν πόλεμον — выходить и входить на войну, т. е. воевать."
  12: "αἰτοῦμαί σε τὸ ὄρος τοῦτο — прошу у тебя эту гору (αἰτέω). ὅτι σὺ ἀκήκοας τὸ ῥῆμα — «ибо ты слышал слово». οἱ Ενακιμ ἐκεῖ εἰσιν — там енакимы (エナク人, форма Числ). πόλεις ὀχυραὶ καὶ μεγάλαι — города укреплённые и большие. ἐὰν κύριος μετ᾿ ἐμοῦ ᾖ — если Господь со мною. ἐξολεθρεύσω — истреблю, изгоню. Конец речи Халева."
  13: "εὐλόγησεν αὐτὸν Ἰησοῦς — благословил его Иисус. ἔδωκεν τὴν Χεβρων τῷ Χαλεβ... ἐν κλήρῳ — дал Хеврон Халеву в жребий. υἱοῦ Κενεζ — сына Кенеза (родительный при имени)."
  14: "ἐγενήθη ἡ Χεβρων τῷ Χαλεβ... ἐν κλήρῳ ἕως τῆς ἡμέρας ταύτης — Хеврон стал уделом Халева и остаётся до сего дня. ἐπακολουθῆσαι τῷ προστάγματι — последовать повелению (πρόσταγμα, 命令)."
  15: "τὸ ὄνομα τῆς Χεβρων ἦν τὸ πρότερον πόλις Αρβοκ — имя Хеврона прежде было «город Арбок» (Αρβοκ; слав. и Синодальный — Кириаф-Арбы). μητρόπολις τῶν Ενακιμ — метрополия, главный город енакимов (母都). ἡ γῆ ἐκόπασεν τοῦ πολέμου — земля успокоилась от войны (κοπάζω). Конец главы; с гл. 15 начинается удел Иуды."
