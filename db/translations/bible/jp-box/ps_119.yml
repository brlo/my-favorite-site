# jp-box, Псалтирь, псалом 119. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация — славяно-синодальная (csl-ru): в слав. надписание отдельным стихом
# не стоит, поэтому наш стих 0 (надписание) влит в начало стиха 1; дальше номера 1..7.
# Разбивка — славяно-синодальная (csl-ru): слав. 6 = гр. 6 + первая половина
# гр. 7, слав. 7 = вторая половина гр. 7 (см. notes 6–7).
# Псалом 119: вопль в тесноте (1–2), гибельный язык (3–4), жизнь среди чужих (5–7).
# Красного и синего нет: прямой речи Христа и Богородицы в псалме не звучит.
# Кавычек нет: чужая речь в стихах не приводится.
# 〔…〕 нет: перевод сделан по gr-lxx-byz, добавлений Церкви не вносилось.
# セラ (διάψαλμα) в этой главе нет.
# Сносок ⟨…⟩ нет: 寄留, 天幕, 炭火 понятны; ケダル — имя из Писания.
# jp-ni не использовался.

tr_code: jp-box
book: ps
chapter: 119
draft: true

verses:
  1: "登[とう]上[じょう]の歌[うた]。苦[くる]しみのうちで、わたしは主[しゅ]に呼[よ]び求[もと]めた。主[しゅ]はわたしに答[こた]えてくださった。"
  2: "主[しゅ]よ、わたしの魂[たましい]を、不正[ふせい]な唇[くちびる]から、偽[いつわ]りの舌[した]から救[すく]い出[だ]してください。"
  3: "偽[いつわ]りの舌[した]よ、あなたには何[なに]が与[あた]えられ、何[なに]が加[くわ]えられるだろうか。"
  4: "力[ちから]ある者[もの]の研[と]ぎすました矢[や]、荒野[こうや]の燃[も]える炭火[すみび]である。"
  5: "ああ、わたしの寄留[きりゅう]は長[なが]く続[つづ]いた。わたしはケダルの天幕[てんまく]の間[あいだ]に住[す]んでいる。"
  6: "わたしの魂[たましい]は、あまりに長[なが]く寄留[きりゅう]してきた。わたしは平和[へいわ]を憎[にく]む者[もの]たちとともに、平和[へいわ]を保[たも]ってきた。"
  7: "わたしが彼[かれ]らに語[かた]ると、彼[かれ]らは理由[りゆう]もなくわたしと戦[たたか]った。"

notes:
  1: "Ὠιδὴ τῶν ἀναβαθμῶν — 登[とう]上[じょう]の歌 (ἀναβαθμός — «ступень, восхождение»; песнь паломников, восходящих в Иерусалим, — первая из пятнадцати «песен восхождений», Пс 119–133 по LXX). Надписание — стих 0 (в csl-ru отдельного стиха нет, влито в ст. 1), как в русской базе сайта; скобками надписания не маркируются. Πρὸς κύριον ἐν τῷ θλίβεσθαί με ἐκέκραξα — 苦しみのうちで、わたしは主に呼び求めた (θλίβω — «теснить, сжимать», отсюда 苦しみ; κράζω — «взывать», не «кричать» в бытовом смысле). καὶ εἰσήκουσέν μου — 主はわたしに答えてくださった (εἰσακούω — «услышать, внять»; рус. «услышал мя»). Прошедшее время сохранено: это уже исполненная молитва."
  2: "κύριε, ῥῦσαι τὴν ψυχήν μου — 主よ、わたしの魂を…救い出してください (ῥύομαι — «избавлять, вырывать»; ψυχή — 魂, как по всему корпусу). ἀπὸ χειλέων ἀδίκων καὶ ἀπὸ γλώσσης δολίας — 不正な唇から、偽りの舌から (χεῖλος — «губа»; γλῶσσα — «язык» как орган речи; δόλιος — «коварный, лживый»). Два члена параллелизма сохранены раздельно."
  3: "τί δοθεῖη σοι καὶ τί προστεθείη σοι πρὸς γλῶσσαν δολίαν — 偽りの舌よ、あなたには何が与えられ、何が加えられるだろうか (оптатив δοθείη/προστεθείη — «что будет дано/прибавлено тебе»; πρός + acc. — «против»). Обращение к самому языку, как в рус. «Что дастся тебе…»; поставлено звательное 偽りの舌よ."
  4: "τὰ βέλη τοῦ δυνατοῦ ἠκονημένα — 力ある者の研ぎすました矢 (βέλος — 矢; ἀκονάω — «точить, острить»; δυνατός — «сильный, могучий», в церковном чтении «сильного»). σὺν τοῖς ἄνθραξιν τοῖς ἐρημικοῖς — 荒野の燃える炭火 (ἄνθραξ — «уголь»; ἐρημικός — «пустынный»; у jp-joc «金雀枝の爇炭» — дроковый уголь). Это ответ на вопрос ст. 3: вот что уготовано лживому языку."
  5: "οἴμμοι, ὅτι ἡ παροικία μου ἐμακρύνθη — ああ、わたしの寄留は長く続いた (οἴμμοι — «горе мне, увы»; παροικία — «странничество, жизнь на чужбине»; μακρύνω — «удлинять»). κατεσκήνωσα μετὰ τῶν σκηνωμάτων Κηδαρ — ケダルの天幕の間に住んでいる (κατασκηνόω — «ставить шатёр, обитать»; Κηδαρ — Кедар, кочевое племя Аравии, ср. Быт 25:13)."
  6: "πολλὰ παρῴκησεν ἡ ψυχή μου — わたしの魂は、あまりに長く寄留してきた (πολλά — «много, долго»; тот же корень παροικέω, что в ст. 5, повтор сохранён). В греч. стих обрывается на половине фразы и продолжается в ст. 7; по-японски дан законченный член, чтобы стих читался отдельно. μετὰ τῶν μισούντων τὴν εἰρήνην ἤμην εἰρηνικός — わたしは平和を憎む者たちとともに、平和を保ってきた (εἰρηνικός — «мирный, миролюбивый»; игра однокоренных εἰρήνη/εἰρηνικός передана повтором 平和). Слав. ст. 6 = гр. 6 + первая половина гр. 7."
  7: "ὅταν ἐλάλουν αὐτοῖς, ἐπολέμουν με δωρεάν — わたしが彼らに語ると、彼らは理由もなくわたしと戦った (πολεμέω — «воевать»; δωρεάν — «даром, без причины»). Слав. ст. 7 — вторая половина гр. 7."
