# jp-box, Соборное послание Иакова, глава 5. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 5: обличение богатых (1–6), долготерпение до пришествия Господа (7–11),
# клятва (12), молитва, елеопомазание и исповедание грехов (13–18),
# обращение заблудшего (19–20).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет.
# 〔…〕 в главе нет: [τοῦ] (5:14) и [αὐτοῦ] (5:20) стоят в базе в квадратных скобках,
# слова есть, поэтому не оборачиваются. 5:7: в базе только прилагательные
# πρόϊμον καὶ ὄψιμον («ранний и поздний»), существительное «дождь» подразумевается
# и добавлено по-японски, как у jp-joc (前後の雨) — см. notes, 〔〕 не ставятся.
# 5:11 отсылает к книге Иова, но цитуемого текста не содержит — 「」 нет.
# Сносок ⟨…⟩ нет: 長老, 油を塗る, 万軍の主 уже встречались в корпусе. jp-ni не использовался.

tr_code: jp-box
book: iak
chapter: 5
draft: true

verses:
  1: "さあ、今[いま]、富[とみ]む者[もの]たちよ。あなたがたに迫[せま]ってくる苦難[くなん]のために、声[こえ]を上[あ]げて泣[な]き叫[さけ]びなさい。"
  2: "あなたがたの富[とみ]は腐[くさ]り、あなたがたの衣[ころも]は虫[むし]に食[く]われた。"
  3: "あなたがたの金[きん]や銀[ぎん]はさび、そのさびがあなたがたに対[たい]する証[あかし]となり、火[ひ]のようにあなたがたの肉[にく]を食[く]い尽[つ]くす。あなたがたは、終[お]わりの日[ひ]々[び]のうちに宝[たから]を蓄[たくわ]えたのである。"
  4: "見[み]なさい。あなたがたが支払[しはら]わなかった、畑[はたけ]を刈[か]り取[と]った労働者[ろうどうしゃ]たちの賃金[ちんぎん]が叫[さけ]び、刈[か]り取[と]った者[もの]たちの叫[さけ]び声[ごえ]が、万軍[ばんぐん]の主[しゅ]の耳[みみ]に届[とど]いている。"
  5: "あなたがたは地[ち]の上[うえ]でぜいたくに暮[く]らし、快楽[かいらく]にふけり、屠[ほふ]られる日[ひ]に自分[じぶん]の心[こころ]を肥[こや]してきた。"
  6: "あなたがたは、義[ぎ]なる者[もの]を罪[つみ]に定[さだ]めて殺[ころ]した。その人[ひと]はあなたがたに反抗[はんこう]しない。"
  7: "だから、兄弟[きょうだい]たちよ、主[しゅ]が来[こ]られるまで、耐[た]え忍[しの]びなさい。見[み]なさい。農夫[のうふ]は、地[ち]の尊[とうと]い実[みのり]を待[ま]ち、地[ち]が初[はじ]めの雨[あめ]と後[あと]の雨[あめ]を受[う]けるまで、長[なが]く耐[た]え忍[しの]ぶ。"
  8: "あなたがたも耐[た]え忍[しの]び、心[こころ]を強[つよ]くしなさい。主[しゅ]の来[こ]られる時[とき]が近[ちか]づいているからである。"
  9: "兄弟[きょうだい]たちよ、互[たがい]に不平[ふへい]を言[い]ってはならない。裁[さば]きを受[う]けないためである。見[み]なさい。審判者[しんぱんしゃ]が戸口[とぐち]の前[まえ]に立[た]っている。"
  10: "兄弟[きょうだい]たちよ、主[しゅ]の名[な]によって語[かた]った預言者[よげんしゃ]たちを、苦難[くなん]と耐[た]え忍[しの]びとの手本[てほん]としなさい。"
  11: "見[み]なさい。わたしたちは、耐[た]え忍[しの]んだ者[もの]たちを幸[さいわ]いであると言[い]う。あなたがたはヨブの忍耐[にんたい]を聞[き]き、主[しゅ]がどう終[お]わらせてくださったかを知[し]った。主[しゅ]はとても深[ふか]いあわれみをもち、情[なさ]け深[ぶか]い方[かた]である。"
  12: "何[なに]より、わたしの兄弟[きょうだい]たちよ、天[てん]によっても地[ち]によっても、そのほかの何[なに]によっても誓[ちか]ってはならない。あなたがたの「はい」は「はい」、「いいえ」は「いいえ」でありなさい。裁[さば]きに陥[おちい]らないためである。"
  13: "あなたがたのうちに苦[くる]しんでいる者[もの]があるか。その人[ひと]は祈[いの]るようにしなさい。喜[よろこ]んでいる者[もの]があるか。その人[ひと]は賛美[さんび]を歌[うた]うようにしなさい。"
  14: "あなたがたのうちに病[やまい]にある者[もの]があるか。その人[ひと]は教会[きょうかい]の長老[ちょうろう]たちを呼[よ]びなさい。長老[ちょうろう]たちが、主[しゅ]の名[な]によってその人[ひと]に油[あぶら]を塗[ぬ]り、その人[ひと]のために祈[いの]るようにしなさい。"
  15: "信仰[しんこう]による祈[いの]りは、病[や]んでいる者[もの]を救[すく]い、主[しゅ]はその人[ひと]を起[お]こしてくださる。たとえ罪[つみ]を犯[おか]していたとしても、その罪[つみ]は赦[ゆる]される。"
  16: "だから、あなたがたは互[たがい]に罪[つみ]を告白[こくはく]し、互[たがい]のために祈[いの]りなさい。そうすれば、癒[いや]される。義[ぎ]なる人[ひと]の熱心[ねっしん]な祈[いの]りは、大[おお]きな力[ちから]がある。"
  17: "エリヤは、わたしたちと同[おな]じようによわさを抱[かか]えた人[ひと]であった。そして、雨[あめ]が降[ふ]らないようにと熱心[ねっしん]に祈[いの]ったところ、地[ち]には三年[さんねん]六[ろっ]か月[げつ]の間[あいだ]、雨[あめ]が降[ふ]らなかった。"
  18: "そして、再[ふたた]び祈[いの]ると、天[てん]は雨[あめ]を与[あた]え、地[ち]はその実[みのり]を芽[め]生[ば]えさせた。"
  19: "わたしの兄弟[きょうだい]たちよ。もし、あなたがたのうちのだれかが真理[しんり]から迷[まよ]い出[で]て、だれかがその人[ひと]を連[つ]れ戻[もど]すなら、"
  20: "知[し]っておきなさい。罪人[ざいにん]をその迷[まよ]いの道[みち]から連[つ]れ戻[もど]した者[もの]は、その魂[たましい]を死[し]から救[すく]い、多[おお]くの罪[つみ]を覆[おお]うのである。"

notes:
  1: "Ἄγε νῦν οἱ πλούσιοι — さあ、富む者たちよ (ἄγε — побудительная частица, ср. 4:13). κλαύσατε ὀλολύζοντες — 声を上げて泣き叫びなさい (ὀλολύζω — вопить, рыдать в голос; причастие усиливает глагол). ἐπὶ ταῖς ταλαιπωρίαις ὑμῶν ταῖς ἐπερχομέναις — 迫ってくる苦難のために (ταλαιπωρία — бедствие; ἐπέρχομαι — надвигаться)."
  2: "ὁ πλοῦτος ὑμῶν σέσηπεν — 富は腐り (σήπω — гнить; перфект: уже сгнило). τὰ ἱμάτια ὑμῶν σητόβρωτα γέγονεν — 衣は虫に食われた (σητόβρωτος — изъеденный молью)."
  3: "ὁ χρυσὸς… καὶ ὁ ἄργυρος κατίωται — 金や銀はさび (κατιόομαι — покрываться ржавчиной). ὁ ἰὸς αὐτῶν εἰς μαρτύριον ὑμῖν ἔσται — そのさびがあなたがたに対する証となる (ἰός — ржавчина; μαρτύριον — свидетельство, εἰς с вин. — «в свидетельство»). φάγεται τὰς σάρκας ὑμῶν ὡς πῦρ — 火のように肉を食い尽くす. ἐθησαυρίσατε ἐν ἐσχάταις ἡμέραις — 終わりの日々のうちに宝を蓄えた."
  4: "ὁ μισθὸς τῶν ἐργατῶν τῶν ἀμησάντων τὰς χώρας ὑμῶν — 畑を刈り取った労働者たちの賃金 (ἀμάω — жать; χώρα — поле, земля). ὁ ἀφυστερημένος ἀφ' ὑμῶν — あなたがたが支払わなかった (ἀφυστερέω — удерживать, недоплачивать). κράζει — 叫ぶ. αἱ βοαὶ τῶν θερισάντων — 刈り取った者たちの叫び声 (θερίζω — жать). εἰς τὰ ὦτα κυρίου Σαβαώθ — 万軍の主の耳に (Σαβαώθ — титул, ср. Рим 9:29)."
  5: "ἐτρυφήσατε ἐπὶ τῆς γῆς καὶ ἐσπαταλήσατε — 地の上でぜいたくに暮らし、快楽にふけり (τρυφάω — роскошествовать; σπαταλάω — предаваться излишествам). ἐθρέψατε τὰς καρδίας ὑμῶν ἐν ἡμέρᾳ σφαγῆς — 屠られる日に自分の心を肥やしてきた (τρέφω — кормить, откармливать; образ откормленного скота в день заклания, ср. jp-joc 屠宰の日に備ふるが如し). σφαγή — заклание."
  6: "κατεδικάσατε, ἐφονεύσατε τὸν δίκαιον — 義なる者を罪に定めて殺した (καταδικάζω — осуждать; ὁ δίκαιος — возможно, о Христе, но и о праведнике вообще; двусмысленность не разрешена). οὐκ ἀντιτάσσεται ὑμῖν — その人はあなたがたに反抗しない (настоящее время в базе)."
  7: "Μακροθυμήσατε οὖν… ἕως τῆς παρουσίας τοῦ κυρίου — 主が来られるまで、耐え忍びなさい (μακροθυμέω — долготерпеть; παρουσία — пришествие). ὁ γεωργὸς ἐκδέχεται τὸν τίμιον καρπὸν τῆς γῆς — 農夫は地の尊い実を待つ (τίμιος — драгоценный). ἕως λάβῃ πρόϊμον καὶ ὄψιμον — 初めの雨と後の雨を受けるまで: в базе только прилагательные («ранний и поздний»), существительное «дождь» подразумевается и добавлено по-японски, как у jp-joc (前後の雨); это не разночтение, поэтому 〔〕 не ставятся."
  8: "μακροθυμήσατε καὶ ὑμεῖς — あなたがたも耐え忍び. στηρίξατε τὰς καρδίας ὑμῶν — 心を強くしなさい (στηρίζω — утверждать, укреплять, ср. Лк 22:32). ἡ παρουσία τοῦ κυρίου ἤγγικεν — 主の来られる時が近づいている (перфект ἤγγικεν)."
  9: "μὴ στενάζετε… κατ' ἀλλήλων — 互いに不平を言ってはならない (στενάζω — вздыхать, роптать; κατά с род. — «против»). ἵνα μὴ κριθῆτε — 裁かれないため. ὁ κριτὴς πρὸ τῶν θυρῶν ἕστηκεν — 審判者が戸口の前に立っている (перфект ἕστηκεν: уже стоит)."
  10: "ὑπόδειγμα λάβετε… τοὺς προφήτας — 預言者たちを手本としなさい (ὑπόδειγμα — образец, ср. Евр 4:11). τῆς κακοπαθείας καὶ τῆς μακροθυμίας — 苦難と耐え忍びとの (κακοπάθεια — страдание). οἳ ἐλάλησαν ἐν τῷ ὀνόματι κυρίου — 主の名によって語った."
  11: "μακαρίζομεν τοὺς ὑπομείναντας — 耐え忍んだ者たちを幸いであると言う (μακαρίζω — ублажать). τὴν ὑπομονὴν Ἰὼβ ἠκούσατε — ヨブの忍耐を聞いた (Иов 1–2; 42). τὸ τέλος κυρίου εἴδετε — 主がどう終わらせてくださったか (τέλος — конец, исход). πολύσπλαγχνος… καὶ οἰκτίρμων — とても深いあわれみをもち、情け深い (σπλάγχνον — «внутренности», глубина милосердия). Цитуемого текста нет, только отсылка к книге Иова, поэтому 「」 не ставятся."
  12: "μὴ ὀμνύετε, μήτε τὸν οὐρανὸν μήτε τὴν γῆν μήτε ἄλλον τινὰ ὅρκον — 天によっても地によっても、そのほかの何によっても誓ってはならない. ἤτω δὲ ὑμῶν τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ — あなたがたの「はい」は「はい」、「いいえ」は「いいえ」でありなさい (ср. Мф 5:37). ἵνα μὴ ὑπὸ κρίσιν πέσητε — 裁きに陥らないため (κρίσις — осуждение)."
  13: "Κακοπαθεῖ τις ἐν ὑμῖν; προσευχέσθω — 苦しんでいる者があるか。その人は祈りなさい (κακοπαθέω — страдать, ср. 5:10). εὐθυμεῖ τις; ψαλλέτω — 喜んでいる者があるか。賛美を歌いなさい (εὐθυμέω — быть в хорошем расположении духа; ψάλλω — петь, славословить)."
  14: "ἀσθενεῖ τις ἐν ὑμῖν — 病にある者 (ἀσθενέω — болеть, быть немощным). τοὺς πρεσβυτέρους τῆς ἐκκλησίας — 教会の長老たち (πρεσβύτερος — старейшина). ἀλείψαντες ἐλαίῳ — 油を塗り (ἀλείφω — мазать, помазывать). ἐν τῷ ὀνόματι [τοῦ] κυρίου — 主の名によって; [τοῦ] в базе есть, 〔〕 не ставятся."
  15: "ἡ εὐχὴ τῆς πίστεως — 信仰による祈り (εὐχή — молитва). σώσει τὸν κάμνοντα — 病んでいる者を救う (κάμνω — изнемогать, болеть). ἐγερεῖ αὐτὸν ὁ κύριος — 主はその人を起こす. κἂν ἁμαρτίας ᾖ πεποιηκώς, ἀφεθήσεται αὐτῷ — たとえ罪を犯していたとしても、赦される."
  16: "ἐξομολογεῖσθε… ἀλλήλοις τὰς ἁμαρτίας — 互いに罪を告白し (ἐξομολογέομαι — открыто признавать, исповедовать). εὔχεσθε ὑπὲρ ἀλλήλων, ὅπως ἰαθῆτε — 互いのために祈りなさい。そうすれば、癒される (ἰάομαι — исцелять). πολὺ ἰσχύει δέησις δικαίου ἐνεργουμένη — 義なる人の熱心な祈りは大きな力がある (δέησις — прошение; ἐνεργουμένη — действенная, энергичная)."
  17: "Ἠλίας ἄνθρωπος ἦν ὁμοιοπαθὴς ἡμῖν — エリヤは、わたしたちと同じようによわさを抱えた人であった (ὁμοιοπαθής — подверженный тем же страстям, ср. Деян 14:15). προσευχῇ προσηύξατο — 熱心に祈った (семитская конструкция: «молитвой помолился», т.е. усиленно). τοῦ μὴ βρέξαι — 雨が降らないように (βρέχω — идти дождю). ἐνιαυτοὺς τρεῖς καὶ μῆνας ἕξ — 三年六か月 (3 Цар 17–18)."
  18: "καὶ πάλιν προσηύξατο — そして、再び祈ると. ὁ οὐρανὸς ὑετὸν ἔδωκεν — 天は雨を与えた (ὑετός — дождь; здесь слово есть в базе). ἡ γῆ ἐβλάστησεν τὸν καρπὸν αὐτῆς — 地はその実を芽生えさせた (βλαστάνω — произрастать)."
  19: "ἐάν τις ἐν ὑμῖν πλανηθῇ ἀπὸ τῆς ἀληθείας — 真理から迷い出て (πλανάω — вводить в заблуждение, ср. 1:16). ἐπιστρέψῃ τις αὐτόν — だれかがその人を連れ戻すなら (ἐπιστρέφω — обращать)."
  20: "γινώσκετε ὅτι — 知っておきなさい. ὁ ἐπιστρέψας ἁμαρτωλὸν ἐκ πλάνης ὁδοῦ αὐτοῦ — 罪人をその迷いの道から連れ戻した者. σώσει ψυχὴν [αὐτοῦ] ἐκ θανάτου — その魂を死から救う ([αὐτοῦ] в базе есть). καλύψει πλῆθος ἁμαρτιῶν — 多くの罪を覆う (καλύπτω — покрывать, ср. 1 Пет 4:8; Притч 10:12)."
