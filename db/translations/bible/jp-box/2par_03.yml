# jp-box, 2-я Паралипоменон, глава 3. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); церковнославянский (csl-ru) — второй
# свидетель церковного текста: слав. чтения и добавки входят в основной текст
# без 〔…〕, вариант LXX — в notes. ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге нет; jp-ni (под авторским правом) не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 3: начало постройки (1–2), размеры дома (3–4), убранство (5–9),
# херувимы (10–13), завеса (14), столпы (15–17).
# Нумерация по gr совпадает с csl: 17 стихов.
# Размеры: притвор 20×120 (gr/csl), столпы 35 локтей (gr/csl); в 3 Цар 6:3
# притвор 20×10, столпы 18 локтей — отличия отмечены в notes.
# Речи нет; красного нет.
# 〔…〕 нет. Слав. добавления внесены в текст: 3:7 «праги и окна»,
# 3:10 «от древ негниюших».
# Сносок ⟨…⟩ нет: 神殿, 至聖所, ケルビム, 垂れ幕 уже в корпусе.

tr_code: jp-box
book: 2par
chapter: 3
draft: true

verses:
  1: "ソロモンはエルサレムで、主[しゅ]の家[いえ]を建[た]て始[はじ]めた。すなわち、主が彼[かれ]の父[ちち]ダビデに現[あらわ]れたアモリアの山[やま]、エブス人[じん]オルナの脱穀場[だっこくじょう]にある、ダビデが用意[ようい]した場所[ばしょ]である。"
  2: "彼[かれ]は、自分[じぶん]の治世[ちせい]の第四[だいよん]年[ねん]、第二[だいに]の月[つき]に建[た]て始[はじ]めた。"
  3: "ソロモンが神[かみ]の家[いえ]を建[た]て始[はじ]めた寸法[すんぽう]は次[つぎ]のとおりである。長[なが]さは最初[さいしょ]の測[はか]りで六十[ろくじゅう]キュビト、幅[はば]は二十[にじゅう]キュビト。"
  4: "また、家[いえ]の前[まえ]にある前廊[ぜんろう]は、家の幅[はば]に沿[そ]って長[なが]さ二十[にじゅう]キュビト、高[たか]さは百二十[ひゃくにじゅう]キュビトであった。彼[かれ]はそれを内側[うちがわ]から純金[じゅんきん]で覆[おお]った。"
  5: "また、大[おお]きな家[いえ]を杉[すぎ]の木[き]で覆[おお]い、純金[じゅんきん]で覆って、その上[うえ]に棕櫚[しゅろ]と鎖[くさり]の飾[かざ]りを彫[ほ]った。"
  6: "また、栄光[えいこう]のために家[いえ]を貴重[きちょう]な石[いし]で飾[かざ]った。金[きん]はパルワイムの金であった。"
  7: "彼[かれ]は家[いえ]とその壁[かべ]、門[もん]と敷居[しきい]、天井[てんじょう]と窓[まど]、戸口[とぐち]を金[きん]で覆い、壁にケルビムを彫[ほ]った。"
  8: "また、至聖所[しせいしょ]の家[いえ]を造[つく]った。その長[なが]さは家の幅[はば]に沿[そ]って二十[にじゅう]キュビト、幅[はば]も二十キュビトであった。彼[かれ]はそれを純金[じゅんきん]で覆い、ケルビムのために六百[ろっぴゃく]タラントの金を用[もち]いた。"
  9: "また、釘[くぎ]の重[おも]さは、一[ひと]つの釘が金[きん]五十[ごじゅう]シェケルであった。また、上[うえ]の間[ま]を金で覆った。"
  10: "彼[かれ]は至聖所[しせいしょ]の家[いえ]に、木[き]の細工[さいく]で二[ふた]つのケルビムを造[つく]り、それを金[きん]で覆った。"
  11: "ケルビムの翼[つばさ]の長[なが]さは二十[にじゅう]キュビトであった。一[ひと]つの翼は五[ご]キュビトで、家[いえ]の壁[かべ]に触[ふ]れ、もう一つの翼も五キュビトで、もう一つのケルビムの翼に触れていた。"
  12: "もう一[ひと]つのケルビムの翼も五[ご]キュビトで家[いえ]の壁[かべ]に触[ふ]れ、そのもう一つの翼も五キュビトで、他[ほか]のケルビムの翼に触れていた。"
  13: "また、ケルビムの翼[つばさ]は広[ひろ]げられて二十[にじゅう]キュビトであった。彼[かれ]らは自分[じぶん]の足[あし]の上[うえ]に立[た]ち、その顔[かお]は家[いえ]のほうを向[む]いていた。"
  14: "また、垂[た]れ幕[まく]を青[あお]と紫[むらさき]と緋[ひ]と亜麻[あま]の布[ぬの]で造[つく]り、その上[うえ]にケルビムを織[お]り込[こ]んだ。"
  15: "また、家[いえ]の前[まえ]に二本[にほん]の柱[はしら]を造[つく]った。高[たか]さは三十五[さんじゅうご]キュビト、その柱頭[ちゅうとう]は五[ご]キュビトであった。"
  16: "また、至聖所[しせいしょ]に鎖[くさり]の飾[かざ]りを造[つく]り、それを柱[はしら]の頭[あたま]に置[お]いた。また、ざくろ百[ひゃく]個[こ]を造って、それを鎖の飾りに付[つ]けた。"
  17: "彼[かれ]は神殿[しんでん]の前[まえ]に柱[はしら]を立[た]てた。一[ひと]つは右[みぎ]に、一[ひと]つは左[ひだり]にである。彼[かれ]は右の柱の名[な]を「正[ただ]しく据[す]えること」、左の柱の名を「力[ちから]」と呼[よ]んだ。"

notes:
  1: "ἐν ὄρει τοῦ Αμορια — на горе Амория (アモリア; слав. «амориа»); в ru/МТ — Мориа (Быт 22:2), в LXX 2 Пар имя передано иначе. οὗ ὤφθη κύριος τῷ Δαυιδ — где явился Господь Давиду (в csl этой клаузы нет). ἅλῳ Ορνα τοῦ Ιεβουσαίου — на гумне Орны Иевусеянина (オルナ; 脱穀場; エブス人); ᾧ ἡτοίμασεν Δαυιδ — которое приготовил Давид."
  2: "ἐν τῷ μηνὶ τῷ δευτέρῳ ἐν τῷ ἔτει τῷ τετάρτῳ τῆς βασιλείας αὐτοῦ — во второй месяц, в четвёртый год царствования его. В ru/МТ добавлен «второй день» — в gr и csl его нет."
  3: "μῆκος πήχεων ἡ διαμέτρησις ἡ πρώτη πήχεων ἑξήκοντα — длина в локтях, размер первый, 60 локтей; εὖρος πήχεων εἴκοσι — ширина 20. В 3 Цар 6:2 (gr) дом 40×20×25; здесь 60×20 — иное чтение LXX/csl (ср. 3 Цар 6:2 в слав. 60×20×30)."
  4: "αιλαμ — притвор (前廊); μῆκος ἐπὶ πρόσωπον πλάτους — длина по лицу ширины; ὕψος πήχεων ἑκατὸν εἴκοσι — высота 120 локтей (в 3 Цар 6:3 притвор 20×10); κατεχρύσωσεν ἔσωθεν χρυσίῳ καθαρῷ — обложил внутри чистым золотом."
  5: "ἐξύλωσεν ξύλοις κεδρίνοις — обшил кедровыми деревами (杉); ἔγλυψεν ... φοίνικας καὶ χαλαστά — вырезал пальмы (棕櫚) и цепи (χαλαστά; слав. «яко мрежицы»). В ru «кипарисовым» — иное, чем gr/csl «кедровым»."
  6: "ἐκόσμησεν ... λίθοις τιμίοις εἰς δόξαν — украсил дорогими камнями в славу; χρυσίῳ χρυσίου τοῦ ἐκ Φαρουαιμ — золотом золота из Фаруаим (パルワイム; слав. «фаруим»)."
  7: "ἐχρύσωσεν τὸν οἶκον καὶ τοὺς τοίχους καὶ τοὺς πυλῶνας καὶ τὰ ὀροφώματα καὶ τὰ θυρώματα — обложил дом, стены, врата, потолки и двери; ἔγλυψεν χερουβιν ἐπὶ τῶν τοίχων — вырезал херувимов на стенах. Слав. добавление «праги и окна» (敷居と窓) внесено в текст; в gr его нет."
  8: "τὸν οἶκον τοῦ ἁγίου τῶν ἁγίων — дом Святого Святых (至聖所); μῆκος ... ἐπὶ πρόσωπον πλάτους ... 20; τὸ εὖρος ... 20; εἰς χερουβιν εἰς τάλαντα ἑξακόσια — на херувимов, 600 талантов (τάλαντον)."
  9: "ὁλκὴ τῶν ἥλων — вес гвоздей (ἧλος); ὁλκὴ τοῦ ἑνὸς πεντήκοντα σίκλοι χρυσίου — вес одного 50 сиклей золота (σίκλος — シェケル); τὸ ὑπερῷον — горница, верхняя комната (上の間)."
  10: "ἔργον ἐκ ξύλων — работа из дерева; ἐχρύσωσεν αὐτὰ χρυσίῳ — обложил их золотом. Слав. добавление «от древ негниюших» (朽ちない木) внесено в текст."
  11: "αἱ πτέρυγες τῶν χερουβιν τὸ μῆκος πήχεων εἴκοσι — крылья херувимов длиной 20 локтей; ἁπτομένη τοῦ τοίχου — касающееся стены; τῆς πτέρυγος τοῦ χερουβ τοῦ ἑτέρου — крыла другого херувима."
  12: "καὶ ἡ πτέρυξ τοῦ χερουβ τοῦ ἑνὸς — и крыло одного херувима; повтор конструкции 3:11 о втором херувиме (в LXX стихи почти дублируются)."
  13: "διαπεπετασμέναι — распростёртые (διαπετάννυμι); ἑστηκότα ἐπὶ τοὺς πόδας αὐτῶν — стоящие на ногах своих; τὰ πρόσωπα αὐτῶν εἰς τὸν οἶκον — лица их к дому (т. е. к святилищу)."
  14: "καταπέτασμα — завеса (垂れ幕); ἐξ ὑακίνθου καὶ πορφύρας καὶ κοκκίνου καὶ βύσσου — из гиацинта, пурпура, червлени и виссона (青・紫・緋・亜麻); ὕφανεν ἐν αὐτῷ χερουβιν — выткал на ней херувимов."
  15: "στύλους δύο — два столпа; πήχεων τριάκοντα πέντε τὸ ὕψος — высотой 35 локтей (в 3 Цар 7:15 — 18 локтей и обвод 14; здесь иное чтение LXX/csl); κεφαλάς — капители (柱頭)."
  16: "σερσερωθ — транслитерация евр. «цепи» (слав. «чепи»); ἐν τῷ δαβιρ — в давире, т. е. в 至聖所; ἐπὶ τῶν κεφαλῶν τῶν στύλων — на головах столпов; ῥοίσκους ἑκατόν — 100 гранатов (ざくろ); ἐπὶ τῶν χαλαστῶν — на цепочках."
  17: "ἔστησεν τοὺς στύλους κατὰ πρόσωπον τοῦ ναοῦ — поставил столпы пред лицом храма; ἕνα ἐκ δεξιῶν καὶ τὸν ἕνα ἐξ εὐωνύμων — одного справа, одного слева; ἐκάλεσεν τὸ ὄνομα ... Κατόρθωσις ... Ἰσχύς — нарёк имя «Исправление» (κατόρθωσις, 正しく据えること) и «Сила» (ἰσχύς, 力). LXX переводит евр. имена Яхин и Боаз; в 3 Цар 7:21 (gr-lxx-byz) они переданы как ヤフム и バアズ (Ιαχουμ, Βααζ), а в ru/МТ транслитерированы (ヤヒン, ボアズ)."
