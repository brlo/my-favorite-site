verses:
  1: "富[とみ]を気[き]にかけることは肉[にく]を衰[おとろ]えさせ、その心配[しんぱい]は眠[ねむ]りを遠[とお]ざける。"
  2: "眠[ねむ]りを妨[さまた]げる心配[しんぱい]はまどろみさえ遠[とお]ざけ、重[おも]い病[やまい]は眠りを奪[うば]い去[さ]る。"
  3: "富[とみ]ある者[もの]は財[ざい]を集[あつ]めることに骨[ほね]を折[お]り、憩[いこ]いのときには自分[じぶん]の贅沢[ぜいたく]に満[み]ち足[た]りる。"
  4: "貧[まず]しい者[もの]は暮[く]らしの乏[とぼ]しさのうちに骨を折り、憩いのときにもなお乏しい。"
  5: "金[きん]を愛[あい]する者[もの]は正[ただ]しいとされず、様々[さまざま]な富を追[お]い求[もと]める者はそれに迷[まよ]わされる。"
  6: "多[おお]くの者[もの]が金[きん]のゆえに倒[たお]れに渡[わた]され、その滅[ほろ]びは彼らの面前[めんぜん]にあった。"
  7: "金[きん]は、それに心[こころ]を奪[うば]われる者[もの]にとってつまずきの木[き]であり、愚[おろ]かな者[もの]はみなそれに捕[と]らえられる。"
  8: "咎[とが]めなく歩[あゆ]み、金[きん]の後[あと]を追[お]わなかった富[とみ]ある者[もの]は幸[さいわ]いである。"
  9: "そのような者[もの]は誰[だれ]か。わたしたちは彼をほめたたえよう。彼は民[たみ]のうちに驚[おどろ]くべきことを行[おこな]ったからである。"
  10: "誰[だれ]がそれによって試[ため]され、完全[かんぜん]な者[もの]とされたか。それは彼の誇[ほこ]りとなる。"
  11: "誰が踏[ふ]み外[はず]すことができて踏み外さず、悪[あく]を行[おこな]うことができて行わなかったか。"
  12: "その財[ざい]は堅[かた]く据[す]えられ、その施[ほどこ]しは集会[しゅうかい]で語[かた]り伝[つた]えられる。"
  13: "大[おお]きな食卓[しょくたく]に着[つ]いたなら、その上[うえ]に喉[のど]を開[ひら]いてはならない。"
  14: "「たくさんある」と言[い]ってもならない。悪[わる]い目[め]が悪[あく]であることを思[おも]い起[お]こせ。"
  15: "目[め]ほど悪[わる]いものがほかに造[つく]られたか。それゆえ、目はどんな顔[かお]を見[み]ても涙[なみだ]ぐむ。"
  16: "その目[め]が向[む]いた先[さき]に、手[て]を伸[の]ばしてはならない。その者[もの]とともに皿[さら]に手を突[つ]き込[こ]んではならない。"
  17: "隣人[りんじん]のことを自分[じぶん]に引[ひ]き寄[よ]せて考[かんが]え、どんな事[こと]がらについても思[おも]いを巡[めぐ]らせ。"
  18: "人[ひと]として、自分[じぶん]の前[まえ]に置[お]かれたものを食[た]べよ。食[た]べすぎて憎[にく]まれてはならない。"
  19: "礼儀[れいぎ]のゆえに、誰[だれ]よりも先[さき]に食[た]べやめるがよい。むさぼってはならない。つまずくことがないためである。"
  20: "多[おお]くの者[もの]の間[あいだ]に着[つ]いたなら、彼らより先[さき]に手[て]を伸[の]ばしてはならない。"
  21: "教[おし]えられた人[ひと]には少[すこ]しで足[た]りる。そのため、床[とこ]の上[うえ]でも息[いき]苦[ぐる]しくなることはない。"
  22: "腹[はら]がほどよく満[み]ちていると、眠[ねむ]りは健康[けんこう]をもたらす。朝[あさ]早[はや]く目[め]が覚[さ]め、心[こころ]もともに爽[さわ]やかである。"
  23: "不眠[ふみん]の苦[くる]しみ、胆[たん]の病[やまい]、腹[はら]の痛[いた]みは、むさぼる者[もの]とともにある。"
  24: "食[た]べ物[もの]で無理[むり]をさせられたなら、立[た]って離[はな]れた所[ところ]で吐[は]き出[だ]せ。そうすれば楽[らく]になる。"
  25: "子[こ]よ、わたしの言葉[ことば]を聞[き]け。わたしを軽[かろ]んじてはならない。終[お]わりに、あなたはわたしの言葉を見[み]いだすだろう。"
  26: "すべてのわざにおいて敏[びん]であれ。そうすれば、どんな病[やまい]もあなたに降[ふ]りかからない。"
  27: "パンに関[かん]して気前[きまえ]のよい者[もの]を、人[ひと]の口[くち]は祝福[しゅくふく]する。その美[うつく]しさについての証[あか]しは確[たし]かである。"
  28: "パンに乏[とぼ]しい者[もの]については町[まち]がつぶやき、その悪[あく]についての証[あか]しは正確[せいかく]である。"
  29: "ぶどう酒[しゅ]のことで強[つよ]がってはならない。ぶどう酒は多[おお]くの者を滅[ほろ]ぼしたからである。"
  30: "炉[ろ]が焼[や]き入[い]れによって鋼[はがね]を試[ため]すように、ぶどう酒は高[こう]ぶった者[もの]の争[あらそ]いのうちで心[こころ]を試す。"
  31: "ぶどう酒は、量[りょう]を守[まも]って飲[の]むなら、人[ひと]の命[いのち]に益[やく]となる。"
  32: "酒[さけ]が足[た]りないとは、どんな生[い]き方[かた]か。それは人を喜[よろこ]ばせるために造[つく]られたのである。"
  33: "心[こころ]の喜[よろこ]び、魂[たましい]の楽しみとなるのは、時[とき]にふさわしく、ほどよく飲[の]むぶどう酒である。"
  34: "多[おお]く飲[の]むぶどう酒は魂[たましい]を苦[にが]くし、いらだちとつまずきを生[しょう]じる。"
  35: "酔[よ]いは愚[おろ]かな者[もの]の怒[いか]りを増[ま]して、つまずきにいたらせる。力[ちから]を弱[よ]め、傷[きず]を増[ふ]やすのである。"
  36: "ぶどう酒の宴[うたげ]で隣人[りんじん]を責[せ]めてはならない。その喜[よろこ]びのうちに彼を蔑[さげす]んではならない。"
  37: "非難[ひなん]の言葉[ことば]を彼に語[かた]ってはならない。無理[むり]な要求[ようきゅう]で彼を苦[くる]しめてはならない。"

notes:
  1: "Ἀγρυπνία πλούτου — «бдение над богатством», т. е. бессонные заботы о нём (ἀγρυπνία — бодрствование, бессонница). ἐκτήκει σάρκας — «растопляет, истощает плоть» (τήκω — плавить, изнурять); слав. «растлевает плоти». ἡ μέριμνα αὐτοῦ ἀφιστᾷ ὕπνον — «забота его отгоняет сон» (ἀφίστημι — удалять)."
  2: "μέριμνα ἀγρυπνίας — «забота бодрствования», родительный качества. ἀποστήσει νυσταγμόν — «удалит дремоту» (νυσταγμός — дремота, сонливость). ἀρρώστημα βαρύ — «тяжкая болезнь»; ἐκνήψει ὕπνον — «отрезвит, прогонит сон» (ἐκνήφω — протрезвляться, пробуждаться); слав. «недуг лют отимает сон»."
  3: "ἐκοπίασεν — «потрудился, устал» (κοπιάω). ἐν συναγωγῇ χρημάτων — «в собирании денег, имущества» (χρήματα). ἐν τῇ ἀναπαύσει — «в покое, на отдыхе». ἐμπίμπλαται τῶν τρυφημάτων αὐτοῦ — «насыщается своих роскошеств» (τρύφημα — роскошь, нега; слав. «сладостей своих»)."
  4: "ἐν ἐλαττώσει βίου — «в умалении жития», т. е. в скудости средств (ἐλάττωσις — уменьшение; слав. «во умалении жития»). ἐπιδεὴς γίνεται — «становится нуждающимся» (ἐπιδεής — нуждающийся). Антитеза богатому из ст. 3 сохранена."
  5: "Ὁ ἀγαπῶν χρυσίον οὐ δικαιωθήσεται — «любящий золото не будет оправдан». ὁ διώκων διάφορα ἐν αὐτοῖς πλανηθήσεται — «стремящийся к различному (к разнообразию наживы) в них заблудится» (διάφορα — разное, переменчивое; πλανάω — вводить в заблуждение). Слав. «гоняй растление сим насытится» и ru «наполнится им» следуют иному чтению (φθορά, ἐμπίπλημι), близкому к МТ; в тексте держимся LXX, вариант — здесь."
  6: "πολλοὶ ἐδόθησαν εἰς πτῶμα χάριν χρυσίου — «многие преданы падению ради золота» (χάριν — ради, из-за; πτῶμα — падение). ἐγενήθη ἡ ἀπώλεια αὐτῶν κατὰ πρόσωπον αὐτῶν — «погибель их была пред лицом их», т. е. на глазах, явно (слав. «прямо лицу их»)."
  7: "ξύλον προσκόμματος — «дерево преткновения»: золото как идол, ср. Прем 14. τοῖς ἐνθουσιάζουσιν αὐτῷ — «тем, кто в исступлении (одержимости) перед ним» (ἐνθουσιάζω); слав. «жрущым ему» и ru «приносящих ему жертвы» поняли как θύουσιν — иное чтение. ἁλώσεται — «будет уловлен» (ἁλίσκομαι)."
  8: "μακάριος πλούσιος — «блажен богатый»: единственный случай, когда богатство названо блаженным, — при непорочности. ἄμωμος — «непорочный, безукоризненный» (слав. «без порока»). ὀπίσω χρυσίου οὐκ ἐπορεύθη — «за золотом не пошёл»."
  9: "τίς ἐστιν; — «кто он?», риторический вопрос-восклицание. μακαριοῦμεν αὐτόν — «ублажим, прославим его» (μακαρίζω). ἐποίησεν γὰρ θαυμάσια ἐν λαῷ αὐτοῦ — «ибо сотворил чудеса в народе своём»; слав. «дивная в людех своих»."
  10: "τίς ἐδοκιμάσθη ἐν αὐτῷ — «кто был испытан им (золотом)» (δοκιμάζω — испытывать, пробовать как металл). ἐτελειώθη — «достиг совершенства, стал цельным» (τελειόω). ἔσται αὐτῷ εἰς καύχησιν — «будет ему в похвалу»."
  11: "По csl стих разделён: 10 — «кто искушен им и совершен бысть, и будет на похваление», 11 — «кто могл преступити, и не преступи, и зло сотворити, и не сотвори?». В LXX это один стих (наш прежний 10), поэтому у второй половины нет отдельного греч. текста."
  12: "στερεωθήσεται — «будет утверждено, укреплено» (στερεόω); τὰ ἀγαθά — «блага, добро, имущество» (слав. «благая его»). τὰς ἐλεημοσύνας αὐτοῦ ἐκδιηγήσεται ἐκκλησία — «милостыни его возвестит собрание» (ἐκδιηγέομαι — рассказывать подробно; ἐκκλησία — собрание)."
  13: "Ἐπὶ τραπέζης μεγάλης ἐκάθισας; — «за большим столом сел?» (вопрос-условие). μὴ ἀνοίξῃς ἐπ᾽ αὐτῆς φάρυγγά σου — «не открывай на него гортани своей», т. е. не разевай рот от жадности (φάρυγξ — гортань, глотка); слав. «не разверзи гортани твоего»."
  14: "Πολλά γε τὰ ἐπ᾽ αὐτῆς — «многое на нём», прямая речь в 「…」. μνήσθητι ὅτι κακὸν ὀφθαλμὸς πονηρός — «помни, что зол злой глаз»: поговорка о завистливом, жадном глазе (слав. «зло есть око лукаво»)."
  15: "πονηρότερον ὀφθαλμοῦ τί ἔκτισται; — «что создано хуже глаза?» διὰ τοῦτο ἀπὸ παντὸς προσώπου δακρύει — «потому он плачет от всякого лица», т. е. зависть плачет обо всём, что видит (слав. «о коей либо вещи слезит»)."
  16: "οὗ ἐὰν ἐπιβλέψῃ — «на что бы он ни посмотрел» (ἐπιβλέπω). μὴ ἐκτείνῃς χεῖρα — «не протягивай руки». μὴ συνθλίβου αὐτῷ ἐν τρυβλίῳ — «не теснись с ним в блюде» (συνθλίβω — сжимать, теснить; τρύβλιον — блюдо, чаша; слав. «солило»)."
  17: "νόει τὰ τοῦ πλησίον ἐκ σεαυτοῦ — «понимай дела ближнего из себя самого», т. е. суди по себе (νοέω — понимать, замечать); слав. «разсуждай, яже суть искренняго, от тебе самаго». ἐπὶ παντὶ πράγματι διανοοῦ — «о всяком деле размышляй» (διανοέομαι)."
  18: "φάγε ὡς ἄνθρωπος — «ешь как человек», т. е. по-человечески, с достоинством. τὰ παρακείμενά σοι — «предложенное тебе» (παράκειμαι — лежать перед). μὴ διαμασῶ — «не пережёвывай (жадно, с чавканьем)»; слав. «не пресыщайся» читает иначе (ἐμπίπλασο), вариант — здесь. μὴ μισηθῇς — «чтобы не стать ненавистным»."
  19: "παῦσαι πρῶτος χάριν παιδείας — «перестань первым ради наставления (воспитанности)»; слав. «престани первый ради наказания». μὴ ἀπληστεύου — «не будь ненасытным» (ἄπληστος — несытый). μήποτε προσκόψῃς — «как бы не преткнуться»; слав. «да не преткнешися»."
  20: "ἀνὰ μέσον πλειόνων — «посреди многих» (слав. «посреде многих»). πρότερος αὐτῶν μὴ ἐκτείνῃς τὴν χεῖρά σου — «прежде них не протягивай руки твоей»."
  21: "Ὡς ἱκανὸν ἀνθρώπῳ πεπαιδευμένῳ τὸ ὀλίγον — «как достаточно человеку воспитанному немногого» (ἱκανόν — достаточное; παιδευμένος — обученный, воспитанный); слав. «коль доволно человеку наказанному малое». ἐπὶ τῆς κοίτης αὐτοῦ οὐκ ἀσθμαίνει — «на ложе своём не страдает одышкой» (ἀσθμαίνω — тяжело дышать), т. е. спит спокойно."
  22: "ὕπνος ὑγιείας ἐπὶ ἐντέρῳ μετρίῳ — «сон здоровья — при умеренном чреве» (ἔντερον — внутренности, желудок); слав. «сон здравый от чрева умеренна». ἀνέστη πρωί, καὶ ἡ ψυχὴ αὐτοῦ μετ᾽ αὐτοῦ — «встал рано, и душа его с ним», т. е. встаёт бодрым."
  23: "πόνος ἀγρυπνίας καὶ χολέρας καὶ στρόφος μετὰ ἀνδρὸς ἀπλήστου — «мучение бессонницы, и холера, и колики — с мужем ненасытным» (χόλερα — разлитие желчи; στρόφος — рези, колики)."
  24: "καὶ εἰ ἐβιάσθης ἐν ἐδέσμασιν — «если был принуждён в яствах», т. е. переел поневоле (βιάζομαι — принуждать). ἀνάστα ἔμεσον πόρρω — «встань, изблюй подальше» (ἐμέω — рвать); слав. смягчает: «востани от трапезы и почиеши». ἀναπαύσῃ — «отдохнёшь, тебе станет легче»."
  25: "ἄκουσόν μου, τέκνον — «послушай меня, дитя». ἐπ᾽ ἐσχάτων εὑρήσεις τοὺς λόγους μου — «в конце (в последние дни) найдёшь слова мои», т. е. поймёшь их потом."
  26: "ἐν πᾶσι τοῖς ἔργοις σου γίνου ἐντρεχής — «во всех делах твоих будь ловок, искусен» (ἐντρεχής — расторопный); слав. «тщателен». πᾶν ἀρρώστημα οὐ μή σοι ἀπαντήσῃ — «никакая болезнь не встретит тебя»."
  27: "λαμπρὸν ἐπ᾽ ἄρτοις εὐλογήσει χείλη — «уста благословят светлого (щедрого) над хлебами»; слав. «щедраго хлебами благословят устне». ἡ μαρτυρία τῆς καλλονῆς αὐτοῦ πιστή — «свидетельство о красоте (доброте) его верно» (μαρτυρία — свидетельство)."
  28: "πονηρῷ ἐπ᾽ ἄρτῳ διαγογγύσει πόλις — «на злого по хлебу (скупого) возропщет город» (διαγογγύζω — роптать); слав. «на скупаго в хлебех поропщет град». ἡ μαρτυρία τῆς πονηρίας αὐτοῦ ἀκριβής — «свидетельство о злобе его точно» (ἀκριβής — точный)."
  29: "Ἐν οἴνῳ μὴ ἀνδρίζου — «в вине не мужайся», т. е. не храбрись вином (ἀνδρίζομαι — вести себя по-мужски, показывать силу). πολλοὺς γὰρ ἀπώλεσεν ὁ οἶνος — «ибо многих погубило вино»."
  30: "κάμινος δοκιμάζει στόμωμα ἐν βαφῇ — «печь испытывает закалку при погружении» (στόμωμα — закалка, навар стали; βαφή — погружение, закалка); слав. «пещь искушает железо в калении». οὕτως οἶνος καρδίας ἐν μάχῃ ὑπερηφάνων — «так вино — сердца в борьбе надменных»; слав. «вино сердца гордых во пиянстве» читает ἐν μέθῃ — иное чтение, вариант в тексте LXX."
  31: "ἔφισον ζωῆς οἶνος ἀνθρώποις — «вино — [подкрепление] жизни людям»; редкое ἔφισον, вероятно ὠφέλιμον/ἐπαρκές, слав. «полезно вино животу человечу». ἐὰν πίνῃς αὐτὸν ἐν μέτρῳ αὐτοῦ — «если пьёшь его в меру его»."
  32: "τίς ζωὴ ἐλασσουμένῳ οἴνῳ; — «что за жизнь тому, у кого недостаёт вина?» (ἐλασσόω — уменьшать). αὐτὸς ἔκτισται εἰς εὐφροσύνην ἀνθρώποις — «оно создано в радость людям»."
  33: "ἀγαλλίαμα καρδίας καὶ εὐφροσύνη ψυχῆς — «ликование сердца и веселие души» (ἀγαλλίαμα — радостный крик, ликование). οἶνος πινόμενος ἐν καιρῷ αὐτάρκης — «вино, пиемое в своё время, достаточное (умеренное)» (αὐτάρκης — достаточный); слав. «во время прилично»."
  34: "πικρία ψυχῆς οἶνος πινόμενος πολύς — «горечь души — вино, пиемое много». ἐν ἐρεθισμῷ καὶ ἀντιπτώματι — «в раздражении и преткновении» (ἐρεθισμός — озлобление, раздражение; ἀντίπτωμα — падение); слав. «в распри и клевете» — иное чтение."
  35: "πληθύνει μέθη θυμὸν ἄφρονος εἰς πρόσκομμα — «умножает опьянение ярость глупого в преткновение» (μέθη — опьянение; θυμός — ярость). ἐλαττῶν ἰσχὺν καὶ προσποιῶν τραύματα — «умаляя силу и прибавляя (причиняя) раны» (ἐλαττόω, προσποιέω; τραῦμα — рана); слав. «умаляя крепость и сотворяя струпия»."
  36: "ἐν συμποσίῳ οἴνου — «на пиру вина» (συμπόσιον — пиршество). μὴ ἐλέγξῃς τὸν πλησίον — «не обличи ближнего» (ἐλέγχω). ἐν εὐφροσύνῃ αὐτοῦ — «в его веселии»."
  37: "λόγον ὀνειδισμοῦ — «слово укора, поношения» (ὀνειδισμός). μὴ αὐτὸν θλίψῃς ἐν ἀπαιτήσει — «не тесни его требованием» (θλίβω — теснить; ἀπαίτησις — требование)."
