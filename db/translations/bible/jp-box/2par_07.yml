verses:
  1: "ソロモンが祈[いの]り終[お]えると、火[ひ]が天[てん]から下[くだ]って燔祭[はんさい]と犠牲[ぎせい]を焼[や]き尽[つ]くし、主[しゅ]の栄光[えいこう]が神殿[しんでん]を満[み]たした。"
  2: "祭司[さいし]たちはそのとき、主[しゅ]の神殿[しんでん]に入[はい]ることができなかった。主[しゅ]の栄光[えいこう]が神殿[しんでん]を満[み]たしたからである。"
  3: "イスラエルの子[こ]らはみな、火[ひ]が下[くだ]り、主[しゅ]の栄光[えいこう]が神殿[しんでん]の上[うえ]にあるのを見[み]て、石畳[いしじき]の上[うえ]で地[ち]にひれ伏[ふ]し、主[しゅ]を拝[おが]み、「主[しゅ]は良[よ]い方[かた]、その慈[いつく]しみは永遠[えいえん]に絶[た]えない」と言[い]って主[しゅ]をほめたたえた。"
  4: "王[おう]と民[たみ]はすべて、主[しゅ]の前[まえ]で犠牲[ぎせい]をささげた。"
  5: "ソロモンは犠牲[ぎせい]をささげた。すなわち、牛[うし]二万二千[にまんにせん]頭[とう]、羊[ひつじ]十二万[じゅうにまん]頭[とう]である。こうして王[おう]と民[たみ]はすべて、神[かみ]の神殿[しんでん]を奉献[ほうけん]した。"
  6: "祭司[さいし]たちはそれぞれの務[つと]めの場所[ばしょ]に立[た]ち、レビ人[びと]は、主[しゅ]の歌[うた]の楽器[がっき]、すなわちダビデ王[おう]が主[しゅ]の前[まえ]で「その慈[いつく]しみは永遠[えいえん]に絶[た]えない」と感謝[かんしゃ]するために作[つく]った楽器[がっき]を手[て]にして立[た]っていた。ダビデの賛歌[さんか]を彼[かれ]らの手[て]によって奏[かな]で、祭司[さいし]たちは彼[かれ]らの前[まえ]でラッパを吹[ふ]き、イスラエルはすべて立[た]っていた。"
  7: "ソロモンは主[しゅ]の神殿[しんでん]にある庭[にわ]の中央[ちゅうおう]を聖別[せいべつ]した。そこに燔祭[はんさい]と酬恩祭[しゅうおんさい]の脂肪[しぼう]をささげたからである。ソロモンが作[つく]った青銅[せいどう]の祭壇[さいだん]は、燔祭[はんさい]と捧[ささ]げ物[もの]と脂肪[しぼう]を受[う]け入[い]れるには小[ちい]さすぎたのである。"
  8: "そのときソロモンは七日間[なのかかん]の祭[まつ]りを行[おこな]い、イスラエルはすべて彼[かれ]とともに、ハマトの入口[いりぐち]からエジプトの川[かわ]までという大[おお]きな会衆[かいしゅう]として集[あつ]まった。"
  9: "八日目[ようかめ]には解散[かいさん]の儀[ぎ]を行[おこな]った。祭壇[さいだん]の奉献[ほうけん]のために七日間[なのかかん]の祭[まつ]りをしたからである。"
  10: "そして第七[だいしち]の月[つき]の二十三[にじゅうさん]日[にち]に、ソロモンは民[たみ]をそれぞれの天幕[てんまく]へ帰[かえ]らせた。彼[かれ]らは、主[しゅ]がダビデとソロモンとご自分[じぶん]の民[たみ]イスラエルに与[あた]えたすべての良[よ]いことのゆえに、喜[よろこ]び、心[こころ]を明[あか]るくして帰[かえ]って行[い]った。"
  11: "ソロモンは主[しゅ]の神殿[しんでん]と王[おう]の家[いえ]を建[た]て終[お]えた。そして、ソロモンが心[こころ]に望[のぞ]んで主[しゅ]の神殿[しんでん]と自分[じぶん]の家[いえ]で行[おこな]おうとしたすべてのことは、成功[せいこう]した。"
  12: "主[しゅ]はソロモンに夜[よる]、現[あらわ]れて言[い]われた。「わたしはあなたの祈[いの]りを聞[き]いた。また、この場所[ばしょ]を、わたしのために犠牲[ぎせい]をささげる家[いえ]として選[えら]んだ。"
  13: "もしわたしが天[てん]を閉[と]ざして雨[あめ]が降[ふ]らず、また、いなごに命[めい]じて木[き]を食[く]わせ、また、わたしの民[たみ]のうちに死[し]を送[おく]るなら、"
  14: "わたしの名[な]が呼[よ]ばれているわたしの民[たみ]が、もし恥[は]じ入[い]って祈[いの]り、わたしの顔[かお]を求[もと]め、その悪[わる]い道[みち]から立[た]ち返[かえ]るなら、わたしは天[てん]から聞[き]き、彼[かれ]らの罪[つみ]を赦[ゆる]し、彼[かれ]らの地[ち]を癒[いや]す。"
  15: "今[いま]、わたしの目[め]は開[ひら]かれ、わたしの耳[みみ]はこの場所[ばしょ]の祈[いの]りに傾[かたむ]けられている。"
  16: "今[いま]、わたしはこの神殿[しんでん]を選[えら]び、聖別[せいべつ]して、わたしの名[な]がそこに永遠[えいえん]にあるようにした。わたしの目[め]と心[こころ]はすべての日[ひ]々[び]そこにある。"
  17: "あなたが、父[ちち]ダビデが歩[あゆ]んだようにわたしの前[まえ]を歩[あゆ]み、わたしがあなたに命[めい]じたすべてを行[おこな]い、わたしの定[さだ]めとわたしの裁[さば]きを守[まも]るなら、"
  18: "わたしはあなたの王国[おうこく]の王座[おうざ]を、父[ちち]ダビデに語[かた]ったように立[た]てる。わたしは言[い]った。『あなたには、イスラエルを治[おさ]める者[もの]が断[た]たれることはない』と。"
  19: "しかし、もしあなたがたが背[そむ]いて、わたしがあなたがたの前[まえ]に与[あた]えたわたしの定[さだ]めと戒[いまし]めを捨[す]て、行[い]ってほかの神[かみ]々[がみ]に仕[つか]え、それらを拝[おが]むなら、"
  20: "わたしはあなたがたを、わたしが彼[かれ]らに与[あた]えた地[ち]から断[た]ち切[き]り、わたしの名[な]のために聖別[せいべつ]したこの神殿[しんでん]をわたしの前[まえ]から投[な]げ捨[す]て、それをすべての民[たみ]の間[あいだ]で、たとえ話[ばなし]と語[かた]り草[ぐさ]にする。"
  21: "この高[たか]い神殿[しんでん]については、そこを通[とお]る者[もの]はだれでも驚[おどろ]き、言[い]うだろう。『なぜ主[しゅ]はこの地[ち]とこの神殿[しんでん]にこのようなことをされたのか』と。"
  22: "人[ひと]々[びと]は答[こた]えるだろう。『彼[かれ]らが自分[じぶん]たちの父祖[ふそ]の神[かみ]、主[しゅ]を捨[す]てたからだ。主[しゅ]は彼[かれ]らをエジプトの地[ち]から導[みちび]き出[だ]したのに、彼[かれ]らはほかの神[かみ]々[がみ]に取[と]りすがり、それらを拝[おが]み、それらに仕[つか]えた。だから主[しゅ]はこのすべての災[わざわ]いを彼[かれ]らの上[うえ]に下[くだ]したのだ』と。」"

notes:
  1: "ὡς συνετέλεσεν ... προσευχόμενος — когда окончил молиться; κατέβη ἐκ τοῦ οὐρανοῦ — сошёл с неба; κατέφαγεν — пожрал; ὁλοκαυτώματα καὶ θυσίας — всесожжения и жертвы; δόξα κυρίου ἔπλησεν τὸν οἶκον — слава Господня наполнила дом. В 3 Цар 8 огня с неба нет — особенность 2 Пар. Слав. 7:1."
  2: "οὐκ ἠδύναντο ... εἰσελθεῖν — не могли войти; ἐν τῷ καιρῷ ἐκείνῳ — в то время; ὅτι ἔπλησεν δόξα κυρίου τὸν οἶκον — ибо слава Господня наполнила дом. Ср. 5:14 (священники не могли стоять). Слав. 7:2."
  3: "ἑώρων καταβαῖνον τὸ πῦρ — видели сходящий огонь; ἐπὶ τὸ λιθόστρωτον — на каменный помост (λιθόστρωτος, 石畳); ἔπεσον ἐπὶ πρόσωπον ἐπὶ τὴν γῆν — пали лицем на землю; ᾔνουν — восхваляли; формула «ибо благ... вовек милость Его» (ср. 5:13; 1 Пар 16:34). Слав. 7:3."
  4: "θύοντες θύματα — принося жертвы (θῦμα — жертва); ἔναντι κυρίου — пред Господом. Слав. 7:4."
  5: "ἐθυσίασεν ... τὴν θυσίαν — принёс жертву; μόσχων εἴκοσι καὶ δύο χιλιάδας — 22 000 тельцов; βοσκημάτων ἑκατὸν καὶ εἴκοσι χιλιάδας — 120 000 овец (βόσκημα — скот); ἐνεκαίνισεν — освятил, обновил (ἐγκαινίζω; 奉献); οἶκος τοῦ θεοῦ — дом Божий. Те же числа в 3 Цар 8:63. Слав. 7:5."
  6: "ἐπὶ τὰς φυλακὰς αὐτῶν — на своих стражах (φυλακή — стража, пост); ἐν ὀργάνοις ᾠδῶν κυρίου — на орудиях песней Господних; τοῦ ἐξομολογεῖσθαι ἔναντι κυρίου — чтобы благодарить пред Господом; ἐν ὕμνοις Δαυιδ — в гимнах Давида; διὰ χειρὸς αὐτῶν — руками их; σαλπίζοντες — трубя. Слав. 7:6 с добавками «(яко благ)» и «(поюще)»."
  7: "ἡγίασεν τὸ μέσον τῆς αὐλῆς — освятил середину двора; στέατα τῶν σωτηρίων — тук мирных (酬恩祭); μαναα — хлебное приношение (слав. «жертвы»; передано 捧げ物); οὐκ ἐξεποίει δέξασθαι — не мог вместить. Ср. 3 Цар 8:64. Слав. 7:7."
  8: "ἑορτὴν ... ἑπτὰ ἡμέραις — праздник семь дней; ἐκκλησία μεγάλη σφόδρα — собрание весьма большое; ἀπὸ εἰσόδου Αιμαθ ἕως χειμάρρου Αἰγύπτου — от входа Емафа (ハマト) до потока Египетского. Ср. 3 Цар 8:65. Слав. 7:8."
  9: "ἐξόδιον — выход, отпуст (слав. «торжество»); ἐγκαινισμὸν τοῦ θυσιαστηρίου — освящение жертвенника; ἑπτὰ ἡμέρας ἑορτήν — семь дней праздника. Слав. 7:9."
  10: "τῇ τρίτῃ καὶ εἰκοστῇ τοῦ μηνὸς τοῦ ἑβδόμου — в двадцать третий день седьмого месяца (в 3 Цар 8:66 — в восьмой день); εἰς τὰ σκηνώματα αὐτῶν — в шатры их (天幕); ἀγαθῇ καρδίᾳ — с добрым сердцем. Слав. 7:10."
  11: "συνετέλεσεν τὸν οἶκον κυρίου καὶ τὸν οἶκον τοῦ βασιλέως — окончил дом Господень и дом царя; ὅσα ἠθέλησεν ἐν τῇ ψυχῇ — что пожелал в душе; εὐοδώθη — было успешно (εὐοδόω). Ср. 3 Цар 9:1. Слав. 7:11."
  12: "ὤφθη ... τὴν νύκτα — явился ночью; Ἤκουσα τῆς προσευχῆς σου — услышал молитву твою; ἐξελεξάμην ἐν τῷ τόπῳ τούτῳ ἐμαυτῷ εἰς οἶκον θυσίας — избрал Себе место сие в дом жертвы. В gr θεός — 神, в слав. «Господь» — в тексте 主 по csl (ср. 3 Цар 9:2). Слав. 7:12."
  13: "συσχῶ τὸν οὐρανόν — заключу небо (συσχῶ, συσχεῖν); ἐντείλωμαι τῇ ἀκρίδι καταφαγεῖν τὸ ξύλον — повелю саранче съесть дерево (ἀκρίς — いなご); ἀποστείλω θάνατον — пошлю смерть (слав. «губителство»). Слав. 7:13."
  14: "ἐντραπῇ — устыдится, смирится (ἐντρέπω); ἐφ᾿ οὓς τὸ ὄνομά μου ἐπικέκληται — на которых наречено имя Моё; ζητήσωσιν τὸ πρόσωπόν μου — взыщут лица Моего; ἀποστρέψωσιν ἀπὸ τῶν ὁδῶν αὐτῶν τῶν πονηρῶν — обратятся от путей своих злых; ἰάσομαι τὴν γῆν αὐτῶν — исцелю землю их. Слав. 7:14."
  15: "ἔσονται ἀνεῳγμένοι — будут отверсты; ἐπήκοα — внимательны (ἐπήκοος); τῇ προσευχῇ τοῦ τόπου τούτου — к молитве места сего. Слав. 7:15."
  16: "ἐξελεξάμην καὶ ἡγίακα — избрал и освятил (перфект); τοῦ εἶναι ὄνομά μου ἐκεῖ ἕως αἰῶνος — чтобы имя Моё было там до века; οἱ ὀφθαλμοί μου καὶ ἡ καρδία μου ἐκεῖ — очи Мои и сердце Моё там. Ср. 3 Цар 9:3. Слав. 7:16."
  17: "ἐὰν πορευθῇς ἐναντίον μου ὡς Δαυιδ ὁ πατήρ σου — если будешь ходить предо Мною, как Давид, отец твой; ἃ ἐνετειλάμην σοι — что Я заповедал тебе; προστάγματα καὶ κρίματα — повеления и суды. Ср. 3 Цар 9:4. Слав. 7:17."
  18: "ἀναστήσω τὸν θρόνον τῆς βασιλείας σου — воздвигну престол царства твоего; ὡς διεθέμην Δαυιδ — как Я обещал Давиду (διατίθημι); Οὐκ ἐξαρθήσεταί σοι ἀνήρ — не отнимется у тебя муж; ἡγούμενος ἐν Ισραηλ — вождь в Израиле. Ср. 3 Цар 9:5. Слав. 7:18."
  19: "ἀποστρέψητε ὑμεῖς — если вы отвратитесь; ἐγκαταλίπητε — оставите; ἃς ἔδωκα ἐναντίον ὑμῶν — которые Я дал пред вами; λατρεύσητε ... προσκυνήσητε — послужите и поклонитесь. Ср. 3 Цар 9:6. Слав. 7:19."
  20: "ἐξαρῶ ὑμᾶς ἀπὸ τῆς γῆς, ἧς ἔδωκα αὐτοῖς — исторгну вас из земли, которую Я дал им (в слав. «вам»; в 3 Цар 9:7 «им»); εἰς παραβολὴν καὶ εἰς διήγημα — в притчу и в повествование (たとえ話と語り草); ἐν πᾶσιν τοῖς ἔθνεσιν — у всех народов. Слав. 7:20."
  21: "ὁ οἶκος οὗτος ὁ ὑψηλός — дом сей высокий; πᾶς ὁ διαπορευόμενος αὐτὸν ἐκστήσεται — всякий проходящий мимо него ужаснётся (ἐξίστημι); Χάριν τίνος — из-за чего, за что. В слав. добавлено «(в притчу)» — не внесено. Слав. 7:21."
  22: "ἐγκατέλιπον κύριον τὸν θεὸν τῶν πατέρων αὐτῶν — оставили Господа, Бога отцов их (в 3 Цар 9:9 — «Бога своего»); ἀντελάβοντο — приняли, ухватились (ἀντιλαμβάνομαι); ἐδούλευσαν — служили; ἐπήγαγεν ἐπ᾿ αὐτοὺς πᾶσαν τὴν κακίαν ταύτην — навёл на них всё это зло. Слав. 7:22."
