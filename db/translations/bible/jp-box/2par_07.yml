# jp-box, 2-я Паралипоменон, глава 7. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); второй свидетель церковного текста —
# церковнославянский (csl-ru), по паритету (docs/japanese-bible.md); ru
# (Синодальный) — только для понимания, не источник. jp-joc в книге нет;
# jp-ni (под авторским правом) не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 7: огонь с неба и слава (1–3), жертвы и освящение двора (4–7),
# праздник кущей и отпуск народа (8–10), второе явление Господа Соломону
# (11–22). 7:11–22 — параллель 3 Цар 9:1–9; 7:1–10 — собственная традиция
# Паралипоменон (в 3 Цар огня с неба нет).
# Речи: Господь — 「…」 (12–22); слова Господа к Давиду внутри — 『…』 (18);
# слова народов — 『…』 (21, 22). Красного нет.
# 〔…〕 нет. Отличия от 3 Цар отмечены в notes (7:10 — 23-й день, 7:20 — «дал
# им», 7:22 — «Бог отцов их»). Слав. 7:21 добавляет «(в притчу)» — не внесено.
# Сносок ⟨…⟩ нет: 神殿, 祭壇, 燔祭, 酬恩祭, 奉献, レビ人, 至聖所 уже в корпусе.

