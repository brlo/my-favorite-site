verses:
  1: "あなたがたを苦[くる]しめる者[もの]たちは、災[わざわ]いだ。あなたがたを苦しめる者は誰[だれ]もいない。あなたがたを退[しりぞ]ける者[もの]も、退けるのではない。退ける者たちは捕[と]らえられ、引[ひ]き渡[わた]され、衣[ころも]の上[うえ]の蛾[が]のように、こうして打[う]ち負[ま]かされる。"
  2: "「主[しゅ]よ、わたしたちをあわれんでください。わたしたちはあなたに頼[たの]んでいるからである。不従順[ふじゅうじゅん]な者[もの]たちの種[たね]は滅[ほろ]びとなった。わたしたちの救[すく]いは苦難[くなん]の時[とき]にある。」"
  3: "あなたの恐[おそ]ろしい声[こえ]のゆえに、民[たみ]はおののき、あなたの恐[おそ]れのゆえに、国々[くにぐに]は散[ち]らされた。"
  4: "今[いま]、小[ちい]さな者[もの]の分[ぶん]も大[おお]きな者の分も、あなたがたの分捕[ぶんど]り物[もの]は集[あつ]められる。人[ひと]がいなごを集めるように、彼[かれ]らはあなたがたをあざ笑[わら]う。"
  5: "高[たか]い所[ところ]に住[す]む神[かみ]は聖[せい]なる方[かた]である。シオンは裁[さば]きと義[ぎ]に満[み]ちた。"
  6: "彼[かれ]らは律法[りっぽう]のうちに委[ゆだ]ねられ、わたしたちの救[すく]いは宝[たから]のうちにある。そこには知恵[ちえ]と知識[ちしき]と、主[しゅ]への敬虔[けいけん]がある。これらが義[ぎ]の宝[たから]である。"
  7: "見[み]よ、あなたがたの恐[おそ]れのうちで、彼[かれ]らは恐[おそ]れる。あなたがたが恐れていた者[もの]たちは、あなたがたから恐れて叫[さけ]ぶ。平和[へいわ]を求[もと]める使者[ししゃ]たちが遣[つか]わされ、苦[にが]く泣[な]きながら平和を願[ねが]うからである。"
  8: "彼[かれ]らの道[みち]は荒[あ]れ果[は]てるからである。国々[くにぐに]の恐[おそ]れはやみ、彼らとの契約[けいやく]は取[と]り上[あ]げられ、あなたがたは彼らを人[ひと]と見[み]なさない。"
  9: "地[ち]は嘆[なげ]き、レバノンは辱[はずかし]められ、シャロンは沼[ぬま]となった。ガリラヤとカルメルはあらわになる。"
  10: "「今[いま]、わたしは立[た]ち上[あ]がる」——主[しゅ]は言[い]われる——「今、わたしは栄光[えいこう]を受[う]け、今、高[たか]く上[あ]げられる。"
  11: "今、あなたがたは見[み]る。今、あなたがたは悟[さと]る。あなたがたの霊[れい]の力[ちから]はむなしく、火[ひ]があなたがたを食[く]い尽[つ]くす。"
  12: "国々[くにぐに]は焼[や]かれ、畑[はたけ]に投[な]げ捨[す]てられて焼かれた茨[いばら]のようになる。"
  13: "遠[とお]くの者[もの]たちは、わたしが行[おこな]ったことを聞[き]く——主[しゅ]は言[い]われる——。近[ちか]くの者たちは、わたしの力[ちから]を知[し]る。」"
  14: "シオンにいる不法[ふほう]な者[もの]たちは退[しりぞ]き、不敬虔[ふけいけん]な者[もの]たちは震[ふる]えに捕[と]らわれる。火[ひ]が燃[も]えていることを、誰[だれ]があなたがたに告[つ]げるのか。永遠[えいえん]の場所[ばしょ]を、誰があなたがたに告げるのか。"
  15: "義[ぎ]をもって歩[あゆ]み、正[ただ]しい道[みち]を語[かた]り、不法[ふほう]と不正[ふせい]を憎[にく]み、贈[おく]り物[もの]から手[て]を引[ひ]き、血[ち]の裁[さば]きを聞[き]かないように耳[みみ]を重[おも]くし、不正を見[み]ないように目[め]を閉[と]じる者[もの]。"
  16: "その者[もの]は高[たか]い所[ところ]、強[つよ]い岩[いわ]の洞窟[どうくつ]に住[す]む。パンは彼[かれ]に与[あた]えられ、その水[みず]は確[たし]かである。"
  17: "あなたがたは栄光[えいこう]のうちに王[おう]を見[み]る。あなたがたの目[め]は遠[とお]くの地[ち]を見る。"
  18: "あなたがたの魂[たましい]は主[しゅ]への恐[おそ]れを思[おも]いめぐらす。書記[しょき]たちはどこにいるのか。助言[じょげん]する者[もの]たちはどこにいるのか。養[やしな]われる者[もの]を数[かぞ]える者はどこにいるのか。"
  19: "小[ちい]さな者[もの]も大[おお]きな者[もの]もいる民[たみ]を。ともに謀[はか]ることのなかった民を。深[ふか]い声[こえ]を、聞[き]こえないほどに知[し]らなかった民を。見下[みくだ]された民[たみ]であり、聞[き]く者[もの]に悟[さと]りはない。"
  20: "見[み]よ、シオン、わたしたちの救[すく]いの都[みやこ]を。あなたの目[め]はエルサレムを見[み]る。富[とみ]ある都[みやこ]、揺[ゆ]るがない幕屋[まくや]、その幕屋の杭[くい]は永遠[えいえん]の時[とき]まで動[うご]かず、その綱[つな]は切[き]れない。"
  21: "主[しゅ]の名[な]はあなたがたにとって大[おお]きい。あなたがたには場所[ばしょ]があり、川[かわ]と広[ひろ]くゆったりとした水路[すいろ]がある。あなたはこの道[みち]を行[い]かない。漕[こ]ぎ進[すす]む船[ふね]も行かない。"
  22: "わたしの神[かみ]は大[おお]きい方[かた]である。主[しゅ]はわたしを過[す]ぎ去[さ]らない。主はわたしたちの裁[さば]き手[て]、主はわたしたちの君[きみ]、主はわたしたちの王[おう]、この方[かた]がわたしたちを救[すく]う。"
  23: "あなたの綱[つな]は切[き]れた。強[つよ]くはなかったからである。あなたの帆柱[ほばしら]は傾[かたむ]き、帆[ほ]を広[ひろ]げることもない。しるしを掲[かか]げることもない。捕[と]らえられて略奪[りゃくだつ]に渡[わた]されるまで。それゆえ、多[おお]くの足[あし]の不自由[ふじゆう]な者[もの]たちが略奪をする。"
  24: "その中[なか]に住[す]む民[たみ]は「わたしは疲[つか]れた」と言[い]わない。彼[かれ]らの罪[つみ]は赦[ゆる]されたからである。"

notes:
  1: "Οὐαὶ τοῖς ταλαιπωροῦσιν ὑμᾶς — «горе удручающим вас»: ταλαιπωρέω — удручать, мучить (слав. «обидящым вас»); ὑμᾶς δὲ οὐδεὶς ποιεῖ ταλαιπώρους — «а вас никто не удручает» (ποιέω с прилагательным — делать кого-л. каким-л.). ὁ ἀθετῶν ὑμᾶς οὐκ ἀθετεῖ — «и отвергающий вас не отвергает» (ἀθετέω — отвергать, отметать; слав. «отвергаяй вас не отвержет»). ἁλώσονται οἱ ἀθετοῦντες καὶ παραδοθήσονται — «будут взяты отвергающие и преданы»; ὡς σὴς ἐπὶ ἱματίου οὕτως ἡττηθήσονται — «как моль на одежде, так будут побеждены» (σής — моль; ἱμάτιον — одежда, риза; слав. «яко молие в ризе»). Син. по МТ даёт образ опустошителя и грабителя («Горе тебе, опустошитель…»); чтение LXX/слав. сохранено."
  2: "κύριε, ἐλέησον ἡμᾶς — «Господи, помилуй нас»: молитва, в 「…」. ἐπὶ σοὶ γὰρ πεποίθαμεν — «ибо на Тебя уповали мы» (соверш. время — состояние доверия); слав. «на тя бо уповахом» (аорист). ἐγενήθη τὸ σπέρμα τῶν ἀπειθούντων εἰς ἀπώλειαν — «стало семя непокорных в погибель»: место тёмное, сохранено буквально (ἀπειθέω — не покоряться; ἀπώλεια — погибель); слав. «бысть племя непокаряющихся в пагубу». ἡ δὲ σωτηρία ἡμῶν ἐν καιρῷ θλίψεως — «спасение же наше во время скорби» (θλῖψις — скорбь, теснота)."
  3: "διὰ φωνὴν τοῦ φόβου σου ἐξέστησαν λαοί — «от гласа страха Твоего изумились народы» (ἐξίστημι — ужасаться, выходить из себя); греч. повторяет ἀπὸ τοῦ φόβου σου — «от страха Твоего»; слав. «Гласом страха твоего ужасошася людие от страха твоего». διεσπάρησαν τὰ ἔθνη — «рассеялись народы» (διασπείρω — рассеивать)."
  4: "συναχθήσεται τὰ σκῦλα ὑμῶν μικροῦ καὶ μεγάλου — «соберётся добыча ваша, малого и великого» (σκῦλον — добыча, слав. «корысти»; род. без предлога — «от малого до великого»). ὃν τρόπον ἐάν τις συναγάγῃ ἀκρίδας — «как если кто соберёт саранчу» (ἀκρίς — саранча, слав. «пруги»); οὕτως ἐμπαίξουσιν ὑμῖν — «так будут глумиться над вами» (ἐμπαίζω — насмехаться)."
  5: "ἅγιος ὁ θεὸς ὁ κατοικῶν ἐν ὑψηλοῖς — «свят Бог, живущий в вышних» (ὑψηλός — высокий); слав. «свят Бог живый в вышних». ἐνεπλήσθη Σιων κρίσεως καὶ δικαιοσύνης — «наполнился Сион суда и правды» (aor. pass. от ἐμπίπλημι)."
  6: "ἐν νόμῳ παραδοθήσονται — «в законе предадутся»: место тёмное, сохранено буквально; слав. «В законе предадятся». ἐν θησαυροῖς ἡ σωτηρία ἡμῶν — «в сокровищах спасение наше» (θησαυρός — сокровище); ἐπιστήμη — знание, умение (слав. «хитрость» в смысле искусности). οὗτοί εἰσιν θησαυροὶ δικαιοσύνης — «это сокровища правды»; слав. «сия суть сокровища правды». Син. по МТ: «настанут безопасные времена твои, изобилие спасения, мудрости и ведения»."
  7: "ἐν τῷ φόβῳ ὑμῶν αὐτοὶ φοβηθήσονται — «в страхе вашем они убоятся»; слав. «во страсе вашем тии убоятся». οὓς ἐφοβεῖσθε, φοβηθήσονται ἀφ᾿ ὑμῶν — «кого вы боялись, убоятся от вас»; слав. «ихже боястеся, возопиют от вас» (глагол передан иначе). ἄγγελοι γὰρ ἀποσταλήσονται — «ибо посланники будут посланы» (ἄγγελος здесь — посол, вестник, поэтому 使者); ἀξιοῦντες εἰρήνην — «просящие мира» (ἀξιόω — просить, требовать); πικρῶς κλαίοντες — «горько плача» (πικρῶς — горько)."
  8: "ἐρημωθήσονται αἱ τούτων ὁδοί — «опустеют дороги их» (ἐρημόω — опустошать); слав. «Опустеют бо сих путие». πέπαυται ὁ φόβος τῶν ἐθνῶν — «прекратился страх народов»; слав. «преста страх языков». ἡ πρὸς τούτους διαθήκη αἴρεται — «завет с ними отнимается» (αἴρω — поднимать, отнимать); οὐ μὴ λογίσησθε αὐτοὺς ἀνθρώπους — «не сочтёте их людьми» (2 л. мн.; λογίζομαι — считать); слав. «не вмените их в человеки»."
  9: "ἐπένθησεν ἡ γῆ — «восплакала земля» (πενθέω — оплакивать). ᾐσχύνθη ὁ Λίβανος — «посрамлён Ливан» (αἰσχύνω — позорить); слав. «посрамлен ливан». ἕλη ἐγένετο ὁ Σαρων — «болотом стал Сарон» (ἕλος — болото, слав. «блато»). φανερὰ ἔσται ἡ Γαλιλαία καὶ ὁ Κάρμηλος — «явной будет Галилея и Кармил» (φανερός — открытый, обнажённый). В МТ на месте Галилеи — «Васа́н» (у Син. «обнажены… Васан и Кармил»); чтение LXX/слав. (Γαλιλαία) сохранено."
  10: "νῦν ἀναστήσομαι … νῦν δοξασθήσομαι … νῦν ὑψωθήσομαι — троекратное «ныне»: восстану, прославлюсь, вознесусь (анафора); слав. «Ныне воскресну… ныне прославлюся, ныне вознесуся». λέγει κύριος стоит в греч. и у слав. внутри речи, после первого члена; формула вне кавычек — в тексте она вынесена между двумя частями речи через ——."
  11: "νῦν ὄψεσθε, νῦν αἰσθηθήσεσθε — «ныне увидите, ныне ощутите» (αἰσθάνομαι — воспринимать, чувствовать); слав. «Ныне узрите, ныне ощутите». ματαία ἔσται ἡ ἰσχὺς τοῦ πνεύματος ὑμῶν — «тщетна будет крепость духа вашего» (ματαῖος — тщетный; ἰσχύς — сила, крепость; πνεῦμα — дыхание, дух). πῦρ ὑμᾶς κατέδεται — «огонь вас поест» (κατεσθίω — съедать). Речь Господа, открытая в ст. 10, продолжается."
  12: "ἔθνη κατακεκαυμένα ὡς ἄκανθα ἐν ἀγρῷ ἐρριμμένη καὶ κατακεκαυμένη — «народы сожжённые, как тёрн в поле брошенный и сожжённый» (κατακαίω — сжигать дотла; ῥίπτω — бросать); слав. «аки терние на ниве разметано и пожжено». Син. иначе: «как горящая известь» (МТ)."
  13: "ἀκούσονται οἱ πόρρωθεν ἃ ἐποίησα — «услышат дальние, что Я сделал» (πόρρωθεν — издалека); γνώσονται οἱ ἐγγίζοντες τὴν ἰσχύν μου — «узнают приближающиеся силу Мою» (ἐγγίζω — приближаться). Слав. добавляет в середине «(глаголет Господь,)» — в LXX этого нет; по паритету внесено в основной текст, формула 主は言われる стоит вне кавычек речи, между двумя частями стиха. Здесь речь Господа закрывается, дальше — авторский текст."
  14: "ἀπέστησαν οἱ ἐν Σιων ἄνομοι — «отступили беззаконные, что в Сионе» (ἀφίστημι — отступать); слав. «Отступиша, иже в сионе, беззаконницы». λήμψεται τρόμος τοὺς ἀσεβεῖς — «возьмёт трепет нечестивых» (τρόμος — дрожь, трепет; ἀσεβής — нечестивый); слав. «приимет трепет нечестивыя». τίς ἀναγγελεῖ ὑμῖν ὅτι πῦρ καίεται — «кто возвестит вам, что огонь горит» (ἀναγγέλλω — объявлять; καίω — гореть, жечь); τίς … τὸν τόπον τὸν αἰώνιον — «кто [возвестит] вам место вечное». Син. по МТ: «кто из нас может жить при огне пожирающем? кто из нас может жить при вечном пламени?» — иное чтение (в МТ «огонь поядающий»); у LXX/слав. «горит» (καίεται), поэтому 燃えている."
  15: "πορευόμενος ἐν δικαιοσύνῃ — «ходящий в правде»; λαλῶν εὐθεῖαν ὁδόν — «говорящий правый путь» (εὐθύς — прямой, правый); μισῶν ἀνομίαν καὶ ἀδικίαν — «ненавидящий беззаконие и неправду»; τὰς χεῖρας ἀποσειόμενος ἀπὸ δώρων — «руки отрясающий от даров» (ἀποσείω — стряхивать; δῶρον — дар, взятка); βαρύνων τὰ ὦτα — «утяжеляющий уши» (βαρύνω — делать тяжёлым); καμμύων τοὺς ὀφθαλμούς — «смыкающий глаза» (καμμύω — закрывать). Все — причастия без сказуемого: главное сказуемое в ст. 16 (οὗτος οἰκήσει), поэтому стих кончается именным оборотом на 者, а 16 начинается с その者は."
  16: "οὗτος οἰκήσει ἐν ὑψηλῷ σπηλαίῳ πέτρας ἰσχυρᾶς — «этот будет жить в высокой пещере крепкой скалы» (σπήλαιον — пещера; πέτρα ἰσχυρά — крепкая скала); слав. «сей вселится во высоце пещере камене крепкаго». ἄρτος αὐτῷ δοθήσεται — «хлеб ему дан будет»; τὸ ὕδωρ αὐτοῦ πιστόν — «вода его верна», т. е. не иссякнет (πιστός — верный, надёжный); слав. «хлеб ему дастся и вода его верна»."
  17: "βασιλέα μετὰ δόξης ὄψεσθε — «царя со славою увидите»; слав. «Царя со славою узрите». Син. «Царя в красоте Его» — по МТ (בְּיָפְיוֹ, «в красоте его»); чтение LXX/слав. сохранено, вариант МТ в текст не внесён. οἱ ὀφθαλμοὶ ὑμῶν ὄψονται γῆν πόρρωθεν — «очи ваши увидят землю издалека» (πόρρωθεν — издали)."
  18: "ἡ ψυχὴ ὑμῶν μελετήσει φόβον — «душа ваша будет размышлять о страхе» (μελετάω — упражняться, размышлять). Слав. добавляет «Господню» («поучится страху Господню») — в LXX этого слова нет, внесено по паритету (в тексте 主への恐れ). οἱ γραμματικοί — книжники, писцы (слав. «книгочии»); οἱ συμβουλεύοντες — советующие, советники; ὁ ἀριθμῶν τοὺς τρεφομένους — «считающий питаемых» (ἀριθμέω — считать; τρέφω — кормить, содержать). Вопросы риторические, в тексте без кавычек. Слав. добавляет в конце «малы и велики люди» — эти слова по gr начинают ст. 19, деление держим по gr."
  19: "μικρὸν καὶ μέγαν λαόν — «народ малый и великий»: продолжение вопроса ст. 18 (потому стих начинается с 民); слав. относит эти слова к концу своего 33:18. ᾧ οὐ συνεβουλεύσαντο — «с которым не совещались» (дат. относительное при συμβουλεύομαι); οὐδὲ ᾔδει βαθύφωνον — «и не знал глубокогласного» (βαθύφωνος — с низким, глубоким голосом); ὥστε μὴ ἀκοῦσαι — «так что не слышать»; λαὸς πεφαυλισμένος — «народ уничижённый» (φαυλίζω — уничижать, презирать); οὐκ ἔστιν τῷ ἀκούοντι σύνεσις — «нет у слушающего разумения». Фраза тёмная и сильно расходится с МТ (у Син. «Не увидишь более народа свирепого, народа с глухою, невнятною речью»); сохранена буквально, порядок членов греческий."
  20: "ἰδοὺ Σιων ἡ πόλις τὸ σωτήριον ἡμῶν — «вот Сион, город спасения нашего» (σωτήριον — спасение). σκηναὶ αἳ οὐ μὴ σεισθῶσιν — «кущи, которые не поколеблются» (σκηνή — шатёр, куща; σείω — колебать); слав. «кущы не поколеблются». οἱ πάσσαλοι τῆς σκηνῆς αὐτῆς — «колья шатра её» (πάσσαλος — кол, слав. «колие»); οὐδὲ τὰ σχοινία αὐτῆς οὐ μὴ διαρραγῶσιν — «и верви её не порвутся» (σχοινίον — вервь; διαρρήγνυμι — разрывать); слав. «и ужя его не преторгнутся»."
  21: "τὸ ὄνομα κυρίου μέγα ὑμῖν — «имя Господне велико для вас»; слав. «Яко имя Господне велико вам есть». τόπος ὑμῖν ἔσται — «место вам будет»; ποταμοὶ καὶ διώρυγες πλατεῖς καὶ εὐρύχωροι — «реки и каналы широкие и просторные» (διῶρυξ — ров, канал; εὐρύχωρος — просторный). οὐ πορεύσῃ ταύτην τὴν ὁδόν — «не пойдёшь этим путём» (2 л. ед. ч.); οὐδὲ πορεύσεται πλοῖον ἐλαῦνον — «и не пройдёт корабль плывущий» (ἐλαύνω — гнать, грести); слав. «ниже пойдет корабль пловущь»."
  22: "ὁ γὰρ θεός μου μέγας ἐστίν — «ибо Бог мой велик»; οὐ παρελεύσεταί με κύριος — «не минует меня Господь» (παρέρχομαι — проходить мимо; место тёмное, сохранено буквально; слав. «не минет мене Господь»). κριτὴς ἡμῶν κύριος, ἄρχων ἡμῶν κύριος, βασιλεὺς ἡμῶν κύριος — троекратное «Господь» с титулами: судия, князь, царь (анафора сохранена); οὗτος ἡμᾶς σώσει — «Он нас спасёт»."
  23: "ἐρράγησαν τὰ σχοινία σου — «порвались верви твои» (ῥήγνυμι — рвать); ὅτι οὐκ ἐνίσχυσεν — «ибо не укрепилось» (подлежащее не выражено); слав. «Прервашася ужя твоя, яко не укрепишася». ὁ ἱστός σου ἔκλινεν — «мачта твоя наклонилась» (ἱστός — мачта; κλίνω — наклонять); οὐ χαλάσει τὰ ἱστία — «не ослабит, не спустит парусов» (χαλάω — ослаблять, опускать; ἱστίον — парус); слав. «не распустит ветрил» — иная передача, в тексте 帆を広げる по слав. οὐκ ἀρεῖ σημεῖον — «не поднимет знамени» (αἴρω — поднимать; σημεῖον — знак, знамя); ἕως οὗ παραδοθῇ εἰς προνομήν — «доколе не предано будет на разграбление» (προνομή — добыча, грабёж); τοίνυν πολλοὶ χωλοὶ προνομὴν ποιήσουσιν — «итак, многие хромые произведут разграбление» (χωλός — хромой), т. е. и хромые пойдут на добычу."
  24: "οὐ μὴ εἴπῃ Κοπιῶ — «не скажет: я утрудился» (κοπιάω — трудиться, уставать); слав. «не рекут: труждаемся»; слово народа — в 「…」. ὁ λαὸς ὁ ἐνοικῶν ἐν αὐτοῖς — «народ, живущий в них» (ἐν αὐτοῖς — в городах, местах; слав. «в них»). ἀφέθη γὰρ αὐτοῖς ἡ ἁμαρτία — «ибо прощён им грех» (ἀφίημι — отпускать, прощать)."
