# jp-box, Исаия, глава 33. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для Исаии есть фрагментами (гл. 3, 5–10,
# 13–14, 19, 25–29, 37–38, 40–43, 45, 48–50, 52, 54, 58, 60, 62–66) — главы 33 нет;
# jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 33: 1 горе удручающим; 2 молитва «Господи, помилуй»; 3–6 страх народов,
# добыча, святой Бог в вышних, закон и сокровища правды; 7–9 плач послов, опустелые
# дороги, сетование земли; 10–13 речь Господа: «ныне восстану», огонь поест,
# народы сожжены, дальние и ближние; 14–16 трепет нечестивых в Сионе, «кто возвестит
# вам» о огне, портрет праведника и его обиталище; 17–24 Царь в славе, вопросы
# о книжниках, Сион — спасение наше, Господь судия и царь, обрывки вервей, прощение
# греха.
# Голоса: 2 молитва — 「…」; 10–13 речь Господа — 「…」 (в 10 и 13 формула «говорит
# Господь» стоит внутри речи, вынесена вне кавычек через ——); 14–24 авторский текст
# (риторические вопросы без кавычек; в 24 слово народа — в 「…」).
# Нумерация по gr: 24 стиха; у csl тоже 24, но внутри иначе: слав. относит слова
# «малы и велики люди» (по gr — начало 33:19) к концу своего 33:18. Держимся gr.
# 〔…〕 нет: все стихи есть в gr-lxx-byz. Слав. добавления внесены в основной текст
# без скобок по паритету: 33:13 «глаголет Господь» (нет в LXX), 33:18 «Господню»
# (нет в LXX).
# 33:14: LXX/слав. читают καίεται «горит», а не МТ «поядающий» — в тексте 燃えている,
# вариант МТ в notes.
# Сносок ⟨…⟩ нет: 蛾, 律法, 敬虔, 幕屋, 帆柱 уже в корпусе или объяснены в notes.
# Имена — транслитерация греческого (LXX): シオン, エルサレム, レバノン, シャロン,
# ガリラヤ, カルメル.

