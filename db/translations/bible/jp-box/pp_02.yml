# jp-box, Песнь Песней, глава 2. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 2: полевой цветок и лилия (1), лилия между терниями (2), яблоня между
# деревьями (3), дом вина (4), подкрепление плодами (5), объятия (6), заклинание
# дочерей Иерусалима (7), голос возлюбленного и он за стеною (8–9), весенний
# призыв (10–14), «ловите лисиц» (15), «он мой, а я его» (16), «доколе не повеет
# день» (17). Поэзия: параллелизмы и повторы (2:10/13, 2:13/15) не сглажены;
# телесные образы (5–6) переданы по-гречески, без эвфемизмов и без вульгарности.
# Голоса: женщина — без кавычек (1, 3–9, 16–17); возлюбленный — 「…」 (2, 10–14);
# хор/братья — 「…」 (15). В 2:10–14 речь возлюбленного открывается в ст. 10 и
# закрывается в конце ст. 14.
# Нумерация по gr: 17 стихов; деление совпадает с csl-ru (csl 2:1 = gr 2:1).
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz. Сносок ⟨…⟩ нет.
# Имена — транслитерация греческого (LXX).

