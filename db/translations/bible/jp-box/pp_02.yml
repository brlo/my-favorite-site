book: pp
chapter: 2
draft: true

verses:
  1: "わたしは野[の]の花[はな]、谷[たに]のゆり。"
  2: "「ゆりが茨[いばら]の間[あいだ]にあるように、わが伴[とも]なる者[もの]も娘[むすめ]たちの間にある。」"
  3: "林[はやし]の木々[きぎ]の間[あいだ]にりんごの木[き]があるように、わが愛[あい]する者[もの]は息子[むすこ]たちの間にいる。わたしはその木陰[こかげ]を切[せつ]に望[のぞ]んで座[すわ]った。その実[み]はわたしののどに甘[あま]い。"
  4: "わたしをぶどう酒[しゅ]の家[いえ]に連[つ]れて行[い]き、わたしの上[うえ]に愛[あい]を掲[かか]げてほしい。"
  5: "香[かお]りのある果実[かじつ]でわたしを支[ささ]え、りんごでわたしを覆[おお]ってほしい。わたしは愛のゆえに傷[きず]ついているから。"
  6: "その左[ひだり]の手[て]はわたしの頭[あたま]の下[した]にあり、その右[みぎ]の手はわたしを抱[だ]きしめる。"
  7: "エルサレムの娘たち、わたしはあなたがたを、野[の]の力[ちから]と野の強[つよ]さにかけて誓[ちか]わせる。愛[あい]が自[みずか]ら望[のぞ]むまで、あなたがたは愛を起[お]こさず、目覚[めざ]めさせてもならない。"
  8: "わが愛[あい]する者[もの]の声[こえ]だ。見よ、あの人は山[やま]を跳[は]ね、丘[おか]を飛[と]び越[こ]えて来[く]る。"
  9: "わが愛[あい]する者[もの]は、ベテルの山々[やまやま]にいるかもしか、あるいは子鹿[こじか]のようだ。見よ、あの人はわたしたちの壁[かべ]の後[うし]ろに立[た]ち、窓[まど]から覗[のぞ]き込[み]、格子[こうし]の間からうかがっている。"
  10: "わが愛[あい]する者[もの]が答[こた]えて言[い]う。「起[た]って、来[き]てほしい。わが伴[とも]なる者[もの]、わが美[うつく]しい者[もの]、わが鳩[はと]よ。"
  11: "見よ、冬[ふゆ]は過[す]ぎ去り、雨[あめ]は去[さ]り、おのずから去[さ]って行[い]った。"
  12: "花[はな]が地[ち]に現[あら]われ、枝[えだ]を切[き]る時[とき]が来[き]た。山鳩[やまばと]の声[こえ]がわたしたちの地に聞[き]こえた。"
  13: "いちじくの木[き]はその青[あお]い実[み]を実[みの]らせ、ぶどうの木[き]は花を咲[さ]かせて香[かお]りを放[はな]つ。立[た]ち上[あ]がって、来てほしい。わが伴[とも]なる者[もの]、わが美[うつく]しい者[もの]、わが鳩[はと]よ。"
  14: "そして、あなたも来てほしい。岩[いわ]の陰[かげ]、砦[とりで]の壁[かべ]のそばにいる、わが鳩よ。あなたの顔[かお]をわたしに見[み]せ、あなたの声をわたしに聞[き]かせてほしい。あなたの声は心地[ここち]よく、あなたの顔は美しいから。」"
  15: "「わたしたちのために、ぶどう畑[ばたけ]を荒[あ]らす小[ちい]さなきつねを捕[つか]まえよ。わたしたちのぶどうの木は花を咲かせているのだから。」"
  16: "わが愛[あい]する者[もの]はわたしのもの、わたしは彼[かれ]のもの。彼はゆりの間[あいだ]で羊[ひつじ]を飼[か]う。"
  17: "日[ひ]が息[いき]を吹[ふ]き、影[かげ]が移[うつ]るまで。わが愛[あい]する者[もの]よ、向[む]きを変[か]え、谷間[たにま]の山々にいるかもしか、あるいは子鹿[こじか]のようになってほしい。"

notes:
  1: "Говорящая — женщина. ἄνθος τοῦ πεδίου — «цвет поля» (слав. «цвет польный»); κρίνον τῶν κοιλάδων — «лилия долин» (слав. «крин удольный»). В Синодальном «нарцисс Саронский» — по МТ (שָׁרוֹן), не внесено: держимся LXX и слав."
  2: "Говорящий — возлюбленный, поэтому 「…」. ὡς κρίνον ἐν μέσῳ ἀκανθῶν — «как лилия между терниями» (ἄκανθα — 茨); ἀνὰ μέσον τῶν θυγατέρων — «между дочерьми» (слав. «посреде дщерей»), т. е. между девицами."
  3: "Говорящая — женщина. μῆλον — яблоко и яблоня (слав. «яблонь»); δρυμός — «лес, дубрава»; τῶν υἱῶν — «сынов», т. е. юношей. ἐπεθύμησα καὶ ἐκάθισα — «возжелала и села» (ἐπιθυμέω; слав. «восхотех и седох»); λάρυγξ — «гортань», のど."
  4: "Говорящая — женщина; εἰσαγάγετε, τάξατε — импер. мн. ч., обращение к окружающим (дочерям, свите), поэтому её речь остаётся без кавычек. οἶκος τοῦ οἴνου — «дом вина» (слав. «дом вина»; Синодальный «дом пира»). τάξατε ἐπ᾿ ἐμὲ ἀγάπην — «поставьте надо мною любовь», образ знамени (τάσσω); слав. «вчините ко мне любовь»."
  5: "Говорящая — женщина. στηρίσατε — «утвердите, подкрепите»; στοιβάσατε — «уложите, обложите» (στοιβάζω). ἀμόραις — тёмное слово-гапакс (ἀμόρα), вероятно ароматные плоды; слав. «в мирех» (в ароматах), Синодальный «вином» — по МТ, не внесено. τετρωμένη ἀγάπης — «раненная любовью» (τιτρώσκω; слав. «уязвлена есмь любовию»)."
  6: "Говорящая — женщина. εὐώνυμος — «левая [рука]» (эвфемизм, слав. «шуйца»); δεξιά — правая; περιλήμψεταί με — «охватит, обнимет меня» (περιλαμβάνω). Образ сохранён без сглаживания."
  7: "Говорящая — женщина; она заклинает дочерей Иерусалима, её речь без кавычек. ὥρκισα — аор. «заклял» (ὁρκίζω); ἐν ταῖς δυνάμεσιν καὶ ἐν ταῖς ἰσχύσεσιν τοῦ ἀγροῦ — «силами и мощями поля» (слав. «в силах и крепостех села»), в Синодальном «сернами или ланями» — по МТ, иное чтение. ἐὰν ἐγείρητε — в клятвенной формуле значит «не будите»; ἕως οὗ θελήσῃ — «доколе не пожелает [сама]»."
  8: "Говорящая — женщина. φωνὴ ἀδελφιδοῦ μου — «голос возлюбленного моего» (слав. «глас брата моего»); πηδῶν — «скача» (πηδάω), διαλλόμενος — «перепрыгивая» (διάλλομαι), слав. «прескача»."
  9: "Говорящая — женщина. δορκάς — かもしか (косуля, серна); νεβρὸς ἐλάφων — «оленёнок оленей», 子鹿 (по брифу); ὄρη Βαιθηλ — «горы Вефиля» (LXX; слав. «горы вефильские»; в Синодальном уточнения нет). παρακύπτων — «выглядывая» (παρακύπτω), ἐκκύπτων — «высовываясь» (ἐκκύπτω); δίκτυα — «сети, решётки» (слав. «мрежи»), поэтому 格子."
  10: "Женщина передаёт слова возлюбленного: ἀποκρίνεται λέγει μοι — «отвечает и говорит мне» (исторический наст.). С этого стиха до конца ст. 14 — его речь в 「…」. Ἀνάστα ἐλθέ — «встань, приди»; περιστερά μου — わが鳩 (по брифу), обращение к женщине."
  11: "Говорящий — возлюбленный (продолжение речи 2:10, внутри 「…」). χειμών — «зима»; ὑετός — «дождь»; ἐπορεύθη ἑαυτῷ — «ушёл себе» (датив «для себя», слав. «отиде себе»), передан おのずから; повтор «прошёл/ушёл» сохранён."
  12: "Говорящий — возлюбленный (та же речь). ἄνθη — цветы; καιρὸς τῆς τομῆς — «время срезания, обрезания» (τομή), т. е. подрезки лозы, поэтому 枝を切る時; слав. «время обрезания приспе», в Синодальном «время пения» — по МТ, не внесено. τρυγών — горлица, 山鳩."
  13: "Говорящий — возлюбленный (та же речь). ὄλυνθοι — незрелые смоквы (гапакс); κυπρίζουσιν — «благоухают, цветут» (κυπρίζω), слав. «зреюще даша воню». Повтор ἀνάστα ἐλθέ из 2:10 сохранён."
  14: "Говорящий — возлюбленный; здесь его речь закрывается. σκέπη τῆς πέτρας — «покров скалы»; ἐχόμενα τοῦ προτειχίσματος — «примыкая к передовой стене» (ἔχομαι с род.; προτείχισμα — внешняя стена); ἀκούτισον — «дай услышать» (ἀκουτίζω, слав. «услышан сотвори»). ἡδεῖα — «сладкий, приятный». Слав. 2:13 оканчивается «и прииди»; по делению gr это начало 2:14, поэтому そして、あなたも来てほしい стоит здесь, а не в конце 2:13."
  15: "Голос — хор/братья (по брифу), поэтому 「…」. πιάσατε — импер. «поймайте» (πιάζω); ἀλώπεκας μικρούς — «лисиц малых» (м. р.; слав. «лисы малыя», Синодальный «лисенят»); ἀφανίζοντας — «погубляющих, опустошающих» (ἀφανίζω). Конец стиха повторяет 2:13 дословно."
  16: "Говорящая — женщина. ἀδελφιδός μου ἐμοί, κἀγὼ αὐτῷ — дативы принадлежности с эллипсисом: «возлюбленный мой — мне, и я — ему» (слав. «брат мой мне, и аз ему»). ὁ ποιμαίνων ἐν τοῖς κρίνοις — «пасущий между лилиями» (ποιμαίνω)."
  17: "Говорящая — женщина. ἕως οὗ διαπνεύσῃ ἡ ἡμέρα — «доколе не повеет день» (διαπνέω, слав. «дондеже дхнет день»); κινηθῶσιν αἱ σκιαί — «двинутся тени». ἀπόστρεψον — «обратись, поверни»; ὁμοιώθητι — импер. пасс. «уподобься»; ὄρη κοιλωμάτων — «горы ущелий (впадин)» (κοίλωμα), слав. «горы юдолий»."
