# jp-box, 3-я Ездры, глава 2. Черновик для приёмки.
#
# База: церковнославянский текст (csl-ru) — в Септуагинте (gr-lxx-byz) книги нет;
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет;
# jp-ni не использовался. Нумерация — славянская.
# Язык — современный 常体; порядок членов и клаузы — по славянскому.
# 〔…〕 нет (слав. — церковное чтение); сносок ⟨…⟩ нет.
#
# Содержание главы 2: суд и Сион. 1–9 слово Господа: «Я вывел народ сей из работы»,
# плач матери-Сиона (2–4), «горе тебе, Ассур», Содом и Гоморра; 10–32 слово
# Господа к Ездре и к матери-Сиону: царство Иерусалимское, древо жизни, «идите
# и приимите», воскрешение мёртвых, Исаия и Иеремия, двенадцать дерев и семь гор,
# дела милосердия (20–23), «не изнемогай», «руки Мои покроют тебя»; 33–41 голос
# самого Ездры: повеление на горе Хорив, обращение к язычникам, «ждите Пастыря»,
# свет вечный, число знаменованных, «приими число твоё, Сион»; 42–48 видение
# горы Сион: юноша, возлагающий венцы, «сей есть Сын Божий».
# Голоса: 1 — 「…」; 2–4 — речь матери в 「…」; 5–9 — 「…» (слова Господа);
# 10–32 — 「…» (обращение к Ездре и к Сиону, формулы «глаголет Господь» внутри);
# 33 — повествование Ездры без кавычек; 34–41 — его обращение к язычникам в 「…»;
# 42–43 — повествование; 44, 46 — вопросы в 「…」; 45, 47, 48 — ответы в 「…».
# Слав. 2:12 «древо жизни будет им в благовоние масти» — темно; переведено
# по смыслу с опорой на ru (см. notes).
#
