verses:
  1: "「主[しゅ]はこう言[い]われる。わたしはこの民[たみ]を奴隷[どれい]の状態[じょうたい]から導[みちび]き出[だ]し、わたしのしもべである預言者[よげんしゃ]たちによって彼らに戒[いまし]めを与[あた]えた。しかし彼らは聞[き]こうとせず、わたしの計[はか]りを退[しりぞ]けた。」"
  2: "彼らを生[う]んだ母[はは]が彼らに言[い]う。「子[こ]らよ、行[い]け。わたしはやもめであり、見捨[みす]てられているからである。"
  3: "わたしはあなたがたを喜[よろこ]びをもって育[そだ]てたが、泣[な]きと悲[かな]しみをもってあなたがたを失[うしな]った。あなたがたはあなたがたの神[かみ]である主[しゅ]の前[まえ]に罪[つみ]を犯[おか]し、主の前[まえ]に悪[あく]とされることを行[おこな]ったからである。"
  4: "それなのに、今[いま]、わたしはあなたがたに何[なに]をしようか。わたしはやもめであり、見捨[みす]てられている。子[こ]らよ、行[い]って主[しゅ]に憐[あわ]れみを求[もと]めよ。」"
  5: "「父[ちち]よ、わたしはあなたを、わたしの契約[けいやく]を守[まも]ろうとしなかった子[こ]らたちの母[はは]に対する証人[しょうにん]として呼[よ]び求[もと]める。"
  6: "あなたが彼らに恥[はじ]を与[あた]え、その母[はは]を略奪[りゃくだつ]に渡[わた]し、彼らの一族[いちぞく]が絶[た]えるように。"
  7: "彼らの名[な]が諸国[しょこく]の間[あいだ]に散[ち]らされ、地[ち]から消[け]し去[さ]られるように。彼らはわたしの契約[けいやく]を蔑[さげす]んだからである。"
  8: "わざわいだ、アッシリアよ。おまえは不義[ふぎ]の者[もの]たちを自分のもとに隠[かく]している。悪[あ]しき世代[せだい]よ、わたしがソドムとゴモラに何[なに]をしたかを思[おも]い起[おこ]せ。"
  9: "彼らの地[ち]は硫黄[いおう]の塊[かたまり]と灰[はい]の丘[おか]となって横[よこ]たわっている。わたしを聞[き]かなかった者[もの]たちにも、わたしはそのようにする、と全能者[ぜんのうしゃ]である主[しゅ]は言[い]われる。」"
  10: "主[しゅ]はエズラにこう言[い]われる。「わたしの民[たみ]に告[つ]げよ。わたしは彼らにエルサレムの国[くに]を与[あた]える。それはわたしがイスラエルに与[あた]えようとしていたものである。"
  11: "わたしは彼らの栄光[えいこう]をわたしのもとに取[と]り、彼らに、わたしが彼らのために備[そな]えた永遠[えいえん]の住[す]まいを与[あた]える。"
  12: "命[いのち]の木[き]が彼らに香[こう]ばしい油[あぶら]の香[かお]りとなり、彼らは労[ろう]することも疲[つか]れることもない。"
  13: "行[い]って受[う]け取[と]れ。自分[じぶん]たちのためにわずかな日[ひ]を求[もと]めよ。その日々[ひび]が遅[おく]れることのないように。あなたがたのためにはすでに国[くに]が備[そな]えられている。目[め]を覚[さ]ましていよ。"
  14: "天[てん]と地[ち]とをもって証[あかし]せよ。わたしは悪[あく]を砕[くだ]き、善[ぜん]を行[おこな]った。わたしは生[い]きている、と主[しゅ]は言[い]われる。"
  15: "母[はは]よ、あなたの子[こ]らを抱[だ]きしめ、喜[よろこ]びをもって彼らを育[そだ]てよ。鳩[はと]のように彼らの足[あし]を強[つよ]くせよ。わたしはあなたを選[えら]んだからである、と主[しゅ]は言[い]われる。"
  16: "わたしは死者[ししゃ]たちをその場所[ばしょ]から起[お]こし、墓[はか]から導[みちび]き出[だ]す。わたしはイスラエルのうちにわたしの名[な]を知[し]ったからである。"
  17: "恐[おそ]れるな、子[こ]らたちの母[はは]よ。わたしはあなたを選[えら]んだからである、と主[しゅ]は言[い]われる。"
  18: "わたしはあなたに助[たす]けとして、わたしのしもべイザヤとエレミヤを遣[つか]わす。彼らの勧[すす]めに従[したが]って、わたしはあなたのために、さまざまな実[み]をたわわに付[つ]けた十二[じゅうに]の木[き]を聖別[せいべつ]して備[そな]えた。"
  19: "また、乳[ちち]と蜜[みつ]を流[なが]す同[おな]じ数[かず]の泉[いずみ]、および薔薇[ばら]と百合[ゆり]を咲[さ]かせる七[なな]つの高[たか]い山[やま]を。それらによって、わたしはあなたの子[こ]らを喜[よろこ]びで満[み]たす。"
  20: "やもめを弁護[べんご]し、孤児[こじ]の裁[さば]きをし、貧[まず]しい者[もの]に与[あた]え、みなしごを守[まも]り、裸[はだか]の者[もの]に着[き]せよ。"
  21: "打[う]ち砕[くだ]かれた者[もの]と弱[よわ]い者[もの]を顧[かえり]み、足[あし]の不自由[ふじゆう]な者[もの]を嘲[あざけ]るな。手[て]のない者[もの]を守[まも]り、目[め]の見[み]えない者[もの]をわたしの光[ひかり]を見[み]ることに招[まね]き入[い]れよ。"
  22: "老[お]いた者[もの]も若[わか]い者[もの]も、あなたの城壁[じょうへき]のうちに隠[かく]まえよ。"
  23: "死者[ししゃ]はどこで見[み]つけても、しるしを付[つ]けて墓[はか]に納[おさ]めよ。わたしはわたしの復活[ふっかつ]のとき、あなたに第一[だいいち]の座[ざ]を与[あた]える。"
  24: "わたしの民[たみ]よ、静[しず]まり、安[やす]らげ。あなたがたの安息[あんそく]が来[く]るからである。"
  25: "良[よ]い乳母[うば]よ、あなたの子[こ]らを養[やしな]い、その足[あし]を強[つよ]くせよ。"
  26: "わたしがあなたに与[あた]えたしもべたちのうち、一人[ひとり]も滅[ほろ]びる者はない。わたしはあなたの数[かず]から彼らを求[もと]めるからである。"
  27: "弱[よわ]り果[は]てるな。悲[かな]しみと苦[くる]しみの日[ひ]が来[く]るとき、ほかの者[もの]たちは泣[な]き、悲[かな]しむが、あなたは喜[よろこ]びに満[み]ち、豊[ゆた]かになる。"
  28: "異邦人[いほうじん]はあなたを妬[ねた]むが、あなたに逆[さか]らう力[ちから]はない、と主[しゅ]は言[い]われる。"
  29: "わたしの手[て]があなたを覆[おお]う。あなたの子[こ]らがゲヘナを見[み]ないために。"
  30: "母[はは]よ、あなたの子[こ]らとともに慰[なぐさ]められよ。わたしはあなたを救[すく]い出[だ]すからである、と主[しゅ]は言[い]われる。"
  31: "眠[ねむ]っているあなたの子[こ]らを思[おも]い出[だ]せ。わたしは彼らを地[ち]の果[は]てから導[みちび]き出[だ]し、彼らに憐[あわ]れみを行[おこな]う。わたしは憐[あわ]れみ深[ぶか]いからである、と全能者[ぜんのうしゃ]である主[しゅ]は言[い]われる。"
  32: "わたしが来[き]て彼らに憐[あわ]れみを行[おこな]うまで、あなたの子[こ]らを抱[だ]きしめよ。わたしの泉[いずみ]は豊[ゆた]かにあふれ、わたしの恵[めぐ]みは尽[つ]きることがないからである。」"
  33: "わたしエズラは、ホレブの山[やま]で主[しゅ]から命[めい]じを受[う]け、イスラエルのもとへ行[い]くことになった。しかしわたしが彼らのもとへ行[い]くと、彼らはわたしを退[しりぞ]け、主[しゅ]の戒[いまし]めを蔑[さげす]んだ。"
  34: "それゆえ、聞[き]いて悟[さと]る異邦人[いほうじん]であるあなたがたに言[い]う。「あなたがたの牧[ぼく]者[しゃ]を待[ま]て。その方[かた]はあなたがたに永遠[えいえん]の安息[あんそく]を与[あた]える。その方[かた]はすでに近[ちか]く、世[よ]の終[お]わりに来[く]るからである。"
  35: "国[くに]の報[むく]いを受[う]ける備[そな]えをせよ。永遠[えいえん]の光[ひかり]があなたがたの上[うえ]に、とこしえに輝[かがや]くからである。"
  36: "この世[よ]の影[かげ]から逃[に]げよ。あなたがたの栄光[えいこう]の喜[よろこ]びを受[う]け取[と]れ。わたしはわたしの救[すく]い主[ぬし]について、明[あき]らかに証[あかし]する。"
  37: "委[ゆだ]ねられた賜[たま]物[もの]を受[う]け取[と]り、あなたがたを天[てん]の国[くに]に招[まね]いた方[かた]に感謝[かんしゃ]しながら喜[よろこ]べ。"
  38: "立[た]ち上[あ]がって立[た]ち、主[しゅ]の祝宴[しゅくえん]でしるしを付[つ]けられた者[もの]たちの数[かず]をよく見[み]よ。"
  39: "彼らはこの世[よ]の影[かげ]から移[うつ]され、主[しゅ]から光[ひかり]輝[かがや]く衣[ころも]を受[う]け取[と]った。"
  40: "シオンよ、あなたの数[かず]を受[う]け取[と]り、白[しろ]い衣[ころも]をまとったあなたの者[もの]たち、主[しゅ]の律法[りっぽう]を満[み]たした者[もの]たちを囲[かこ]い込[こ]め。"
  41: "あなたが望[のぞ]んだ子[こ]らの数[かず]は満[み]ちている。主[しゅ]の国[くに]を祈[いの]り求[もと]めよ。あなたの民[たみ]、初[はじ]めから招[まね]かれた者[もの]たちが聖[せい]とされるために。」"
  42: "わたしエズラはシオンの山[やま]で、数[かぞ]えきれないほどのおびただしい民[たみ]を見[み]た。彼らはみな歌[うた]をもって主[しゅ]をほめたたえていた。"
  43: "彼らの真[ま]ん中[なか]には、そのすべての者[もの]たちよりも背[せ]が高[たか]い若者[わかもの]がいた。彼は一人[ひとり]ひとりの頭[あたま]に冠[かんむり]を置[お]き、ますます高[たか]く上[のぼ]った。わたしは大[おお]いに驚[おどろ]いた。"
  44: "そこでわたしは天使[てんし]に尋[たず]ねた。「この者[もの]たちは何[なん]ですか、ご主人[しゅじん]さま。」"
  45: "彼は答[こた]えた。「この者[もの]たちは、死[し]ぬべき衣[ころも]を脱[ぬ]ぎ、不死[ふし]の衣[ころも]を着[き]、神[かみ]の名[な]を告白[こくはく]した者[もの]たちである。今[いま]、彼らは冠[かんむり]を受[う]け、棕櫚[しゅろ]の枝[えだ]を受[う]け取[と]る。」"
  46: "わたしは天使[てんし]に、その若者[わかもの]について尋[たず]ねた。「彼らの上[うえ]に冠[かんむり]を置[お]き、手[て]に棕櫚[しゅろ]の枝[えだ]を与[あた]えるあの若者[わかもの]は誰[だれ]か。」"
  47: "彼はわたしに答[こた]えた。「この方[かた]こそ神[かみ]の子[こ]である。彼らはこの世[よ]でこの方[かた]を告白[こくはく]した。」そこでわたしは、主[しゅ]の名[な]のために雄々[おお]しく戦[たたか]った者[もの]たちをほめたたえ始[はじ]めた。"
  48: "そこで天使[てんし]はわたしに言[い]った。「行[い]って、わたしの民[たみ]に、あなたが見[み]た主[しゅ]なる神[かみ]のどれほど大[おお]きな奇[き]跡[せき]を告[つ]げよ。」"
notes:
  1: "слав. «Сия глаголет Господь: аз изведох люди сия из работы, имже повеления дах рабы моими пророки, ихже слушати не восхотеша, но отвергоша моя советы» — «работы» здесь рабство, плен; «повеления дах рабы моими пророки» — дал повеления через рабов Моих пророков (твор. падеж орудия); «советы» — замыслы, решения. В ru «дал им повеление через рабов Моих, пророков»."
  2: "слав. «Мати, яже их роди, глаголет им: идите, сынове, понеже аз вдовица есмь и оставлена» — «мати, яже их роди» — мать, которая их родила; «оставлена» — покинута. В ru здесь открывается прямая речь матери, закрывающаяся в ст. 4; в слав. кавычек нет, в японском речь матери выделена 「…」."
  3: "слав. «воспитах вы с радостию и лишихся вас со плачем и скорбию» — «лишихся вас» — лишилась вас; ru «отпустила с плачем и горестью» передаёт тот же смысл потери. «Яко согрешисте пред Господем Богом вашим» — ибо согрешили пред Господом Богом вашим."
  4: "слав. «ныне же что сотворю вам? аз вдова есмь и оставлена: идите, сынове, и просите от Господа милости» — конец речи матери (в ru здесь закрывается кавычка). «От Господа» — у Господа; «просите» — просите, умоляйте."
  5: "слав. «Аз же тебе, оч~е, свидетеля призываю на матерь сынов, иже не восхотеша завета моего хранити» — сокращение «оч~е» = отче (звательный падеж; тильда в csl-ru — знак выносной буквы). Говорящий — Господь: призывает Отца в свидетели против матери сынов. В ru «Тебя, Отче, призываю во свидетеля на мать сыновей»."
  6: "слав. «да даси им посрамление и матерь их на расхищение, да рода их не будет» — «да даси» = чтобы Ты дал (да + аорист 2 л.); «на расхищение» — на разграбление. В ru «Предай их посрамлению и мать их — на расхищение, чтобы не было рода их»."
  7: "слав. «да расточатся во языки имена их, да изгладятся от земли, зане презреша завет мой» — «во языки» — по народам; «зане» — ибо; «изгладятся» — будут изглажены. В ru то же."
  8: "слав. «Горе тебе, ассур, иже сокрываеши неправедныя у себе. Роде лукавый, воспомяни, что сотворих содому и гоморре» — «ассур» здесь не столько историческая Ассирия, сколько образ враждебной державы, поэтому оставлено アッシリア по слав.; «содому и гоморре» — дат. падеж: что сделал Содому и Гоморре."
  9: "слав. «ихже земля лежит в жупелней груде и въ холмех пепелных» — «жупел» — сера, смола; «груда» — куча; ru «Земля их лежит в смоляных глыбах и холмах пепельных». «Тако дам тех, иже мя не слушаша» — так поступлю с теми, кто не слушал Меня."
  10: "слав. «Сия глаголет Господь ко ездре: возвести людем моим, яко дам им царство Иерусалимское, еже дати имех израилю» — «еже дати имех» = которое намеревался дать (имати — иметь в намерении); ru «которое обещал Израилю». Здесь начинается слово Господа, идущее до ст. 32."
  11: "слав. «и возму мне славу их и дам им селения вечная» — «возму мне славу их» = возьму Себе славу их (дат. «мне» — при глаголе); ru иначе: «прииму славу от них». Переведено по слав.: слава их переходит к Богу."
  12: "слав. «древо жизни будет им в благовоние масти, и не имут труждатися, ниже утрудятся» — «в благовоние масти» = в благоухание масти (миро, елей); «не имут труждатися» — не будут трудиться; «ниже утрудятся» — и не изнемогут. Тёмное место; смысл — по ru: «Древо жизни будет для них мастью благовонною»."
  13: "слав. «Идите и приимите, просите себе дний малых, да закоснят: уже готово есть вам царство, бдите» — «да закоснят» = чтобы они замедлили; ru «дабы они не замедлили» добавляет отрицание по смыслу (дни малы, чтобы не медлить). Держим слав. форму; «бдите» — бодрствуйте."
  14: "слав. «Засвидетелствуй небом и землею: сотрох бо злое и сотворих благое, яко живу аз, глаголет Господь» — «сотрох» — стёр, сокрушил; «яко живу аз» — клятвенная формула «живу Я». В ru «Свидетельствуй, небо и земля, ибо Я стер злое и сотворил доброе»."
  15: "слав. «Мати, обыми сыны твоя, воспитай их со веселием, яко голубица утверди нозе их, зане тебе избрах» — «обыми» — обними; «яко голубица» — как голубица; «утверди» — утверди, укрепи; «тебе избрах» — избрал тебя (вин.)."
  16: "слав. «И воскр~шу мертвыя от мест своих и из гробов изведу их: познах бо имя мое во израили» — сокращение «воскр~шу» = воскрешу. «Познах имя мое во израили» — познал имя Моё в Израиле (Израиль познал имя Божие); ru «потому что Я познал имя Мое в Израиле»."
  17: "слав. «Не бойся, мати сынов, зане тебе избрах, глаголет Господь» — «тебе» — вин. падеж (тебя), не дательный."
  18: "слав. «Послю тебе помощь отроки моя, исаию и иеремию, по ихже совету освятих и уготовах тебе древес дванадесять отягченых различными плоды» — «отроки моя» — рабов Моих (вин. мн.); «отягченых» — отягощённых, обременённых плодами. Здесь и далее образы рая."
  19: "слав. «и толикожде источников текущих млеком и медом, и гор превысоких седмь имеющих шипок и крин, на нихже веселием исполню сыны твоя» — «толикожде» — столько же; «шипок» — шиповник, роза; «крин» — лилия; «на нихже» = через них. Числа — кандзи (十二, 七), как в корпусе."
  20: "слав. «Вдову оправдай, сиру суди, нищему дай, сироту защити, нагаго одей» — «сиру» — сирому, бедному (сир — сирота и бедняк); ru «дай суд бедному»; «одей» — одень."
  21: "слав. «о сокрушеннем и немощнем попецыся, хромому не посмейся, защити безрукаго, а слепаго къ видению света моего припусти» — «сокрушеннем» — сокрушённом, расслабленном; «припусти» — допусти, приведи. В ru «о расслабленном и немощном попекись»."
  22: "слав. «стараго и младаго между стенами твоими сокрый» — «сокрый» — сокрой, укрой; «между стенами» — в стенах города. В ru «старца и юношу в стенах твоих сохрани»."
  23: "слав. «мертвыя идеже обрящеши, назнаменав отдай гробу, и дам тебе первое седение в воскресние мое» — «назнаменав» — отметив, запечатлев знаком; «первое седение» — первое место, седалище; «в воскресние мое» — в воскресение Моё."
  24: "слав. «И утишитеся и препокойтеся, людие мои, зане приидет покой ваш» — «утишитеся» — умолкните, успокойтесь; в слав. множественное число, в ru единственное («Отдыхай и покойся, народ Мой»). Переведено по слав. множественным."
  25: "слав. «Кормилице благая, корми сыны твоя, утверждай нозе их» — звательный падеж «кормилице»; «утверждай» — укрепляй. В ru «Корми сынов твоих, добрая кормилица»."
  26: "слав. «Рабов, ихже тебе дах, ни един от них погибнет, их бо аз взыщу от числа твоего» — «от числа твоего» — из числа твоего; ru «Я взыщу их от тебя». Смысл: никто из вверенных не потеряется, Бог спросит за них."
  27: "слав. «Не изнемогай: егда бо приидет день печали и тесноты, инии восплачутся и печальни будут, ты же радостна и обилна будеши» — «теснота» — стеснение, скорбь; «обилна» — изобильна. В ru «другие будут плакать и сокрушаться, а ты будешь весела и изобильна»."
  28: "слав. «Поревнуют (тебе) языцы и ничтоже противу тебе возмогут» — «поревнуют» — будут завидовать; скобки вокруг «(тебе)» в слав. редакционные (в рукописях чтение колеблется), в текст не переносились; ru «Язычники будут завидовать тебе»."
  29: "слав. «Руце мои покрыют тя, да сынове твои геенны не узрят» — «тя» — тебя; «геенна» — ゲヘナ; в корпусе слово новое, оставлено катаканой без сноски (понятно из контекста). В ru «чтобы сыны твои не видели геенны»."
  30: "слав. «Утешайся, мати, с сыны твоими, зане аз тя избавлю, глаголет Господь» — «тя» — тебя; «избавлю» — избавлю, спасу."
  31: "слав. «Воспомяни чада твоя спящия, понеже аз изведу их из боков земли и милость с ними сотворю: милостив бо есмь» — «из боков земли» = от краёв земли; «спящия» — почивающих (об умерших); «да» в ru отсутствует."
  32: "слав. «Обыми чада твоя, дондеже аз прииду и сотворю им милосердие: источницы бо мои изобилуют и благодать моя не оскудеет» — «дондеже» — доколе, пока; «источницы» — источники. Здесь слово Господа заканчивается."
  33: "слав. «Аз ездра взях повеление от Господа на горе орив, да иду ко израили» — здесь впервые говорит сам Ездра; «орив» — Хорив (гора законодательства), передано ホレブ; «взях повеление» — получил повеление. «Отринуша мя и уничижиша заповедь Господню» — отвергли меня и презрели заповедь."
  34: "слав. «И сего ради вам глаголю, языцы, иже слышите и разумеете: ждите пастыря вашего, иже даст вам покой вечный» — «языцы» — народы, язычники; «иже слышите» — которые слышите. Здесь начинается обращение Ездры к язычникам, идущее до ст. 41."
  35: "слав. «Будите готови к воздаянием царствия, свет бо вечный возсияет на вы во веки» — «к воздаянием» — к воздаяниям (дат. мн.); «на вы» — на вас; ru «свет немерцающий воссияет вам на вечное время»."
  36: "слав. «бежите сени века сего, приимите наслаждение славы вашея, аз яве свидетелствую спасителем моим» — «сень» — тень; «спасителем моим» — твор. падеж мн. ч., форма тёмная; ru читает единственное: «о Спасителе моем». Переведено по смыслу ru: свидетельствую о Спасителе; слав. форму см. в notes."
  37: "слав. «Вверенный дар приимите и веселитеся, благодаряще призвавшаго вы в царство небесное» — «вверенный» — вверенный, доверенный; «призвавшаго» — призвавшего (вин.). В ru «Вверенный дар приимите, и наслаждайтесь»."
  38: "слав. «Востаните и стойте, и смотряйте число знаменаных на пиру Господнем» — «знаменаных» — отмеченных, запечатлённых; «пир» — вечеря, трапеза; ru «какое число знаменованных на вечери Господней»."
  39: "слав. «иже преселишася от сени века сего, восприяша светлая одеяния от Господа» — «преселишася» — переселились; «светлая одеяния» — светлые одежды. В ru «получили от Господа светлые одежды»."
  40: "слав. «Восприими число твое, сионе, и заключи одеянных твоих в белая, иже исполниша закон Господень» — «заключи» здесь «заключи в круг, собери», а не «запри»; ru «заключи твоих, одетых в белые одеяния». Место тёмное, переведено по смыслу ru."
  41: "слав. «Исполнено есть число чад твоих, ихже желал еси: моли царства Господня, да будут освящени людие твои, призваннии из начала» — «моли» — проси; «призваннии из начала» — призванные от начала. Здесь обращение Ездры заканчивается."
  42: "слав. «Аз ездра видех на горе сионстей народ мног, ихже исчислити не могох, и вси песньми хваляху Господа» — «сионстей» — Сионской; видение горы Сион (2:42–48; в западной традиции 5 Ездры 2:42–48). «Песньми хваляху» — песнями славили."
  43: "слав. «посреде же их бе юноша высочае возрастом паче всех оных, иже полагаше венцы на главу коегождо и паче возвышашеся» — «высочае возрастом» — выше ростом; «паче возвышашеся» — тем более возвышался. В ru «юноша величественный, превосходящий всех их»."
  44: "слав. «что суть сии, господи?» — обращение к ангелу: «господи» = господин мой; передано ご主人[しゅじん]さま, как в корпусе для κύριέ μου, чтобы не смешивать с обращением к Богу 主[しゅ]. В ru «кто сии, господин мой?»."
  45: "слав. «сии суть, иже совлекошася одеяния смертнаго и облекошася в безсмертное и исповедаша имя Божие: ныне венчаются и приемлют финики» — «совлекошася» — совлекли с себя; «финики» — пальмовые ветви (знак победы), отсюда 棕櫚[しゅろ]の枝[えだ]."
  46: "слав. «кто есть оный юноша, иже возлагает на них венцы и финики в руце дает?» — «оный» — тот; «в руце дает» — даёт в руки. В ru «который возлагает на них венцы и вручает им пальмы?»"
  47: "слав. «сей есть сын Божий, егоже исповедаша в веце сем. Аз же начах величати их, иже крепко за имя Господне вооружашася» — «егоже исповедаша» — Которого исповедали; «вооружашася» — вооружались, ополчались. В ru «мужественно стоявших за имя Господне»."
  48: "слав. «иди и возвести людем моим, каковая и коликая чудеса Господа Бога видел еси» — «каковая и коликая» — какие и сколь великие; «видел еси» — ты видел. В ru «какие видел ты дивные дела Господа Бога»."
