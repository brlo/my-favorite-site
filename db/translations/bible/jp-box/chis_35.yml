verses:
  1: "主[しゅ]は、モアブの西[にし]、ヨルダン川[がわ]のほとり、エリコに面[めん]した所[ところ]で、モーセに語[かた]って言[い]われた。"
  2: "「イスラエルの子[こ]らに命[めい]じて、彼[かれ]らに、その嗣業[しぎょう]のくじから、レビ人[びと]へ住[す]むための町々[まちまち]を与[あた]えさせなさい。また、その町々の周[まわ]りの放牧地[ぼくぼくち]をレビ人に与えなさい。"
  3: "その町々は彼[かれ]らが住[す]むためであり、その割[わ]り当[あ]てられた土地[とち]は、彼らの家畜[かちく]とすべての四足[しそく]の動物[どうぶつ]のためである。"
  4: "あなたがたがレビ人[びと]に与[あた]える町々に付[つ]き添[そ]う土地[とち]は、町の城壁[じょうへき]から外[そと]へ、周[まわ]り二千[にせん]キュビトとする。"
  5: "あなたは町の外[そと]で、東[ひがし]の側[がわ]を二千キュビト、南[みなみ]の側を二千キュビト、海[うみ]の側を二千キュビト、北[きた]の側を二千キュビトと測[はか]りなさい。町はその真[ま]ん中[なか]にある。これが町々の周辺[しゅうへん]の土地[とち]である。"
  6: "あなたがたはレビ人[びと]に町々[まちまち]を与[あた]えなさい。すなわち、人[ひと]を殺[ころ]した者[もの]がそこへ逃[に]げ込[こ]むための六[むっ]つの避難[ひなん]の町、またこれに加[くわ]えて四十二[よんじゅうに]の町である。"
  7: "レビ人[びと]に与[あた]える町[まち]は全部[ぜんぶ]で四十八[よんじゅうはち]の町、すなわちこれらの町々とその放牧地[ぼくぼくち]である。"
  8: "イスラエルの子[こ]らの所有[しょゆう]から与[あた]える町々[まちまち]については、多[おお]く持[も]つ者[もの]からは多く、少[すく]ない者からは少なくしなさい。おのおの、自分[じぶん]が受[う]け継[つ]ぐ嗣業[しぎょう]に応[おう]じて、その町々からレビ人[びと]に与えなさい。」"
  9: "主[しゅ]はモーセに語[かた]って言[い]われた。"
  10: "「イスラエルの子[こ]らに語[かた]って言[い]いなさい。あなたがたはヨルダン川[がわ]を渡[わた]ってカナンの地[ち]に入[はい]ろうとしている。"
  11: "あなたがたのために町々[まちまち]を選[えら]び分[わ]けなさい。それらは、人[ひと]を殺[ころ]した者[もの]、すなわち思[おも]わず人の命[いのち]を打[う]った者がだれでもそこへ逃[に]げ込[こ]める避難所[ひなんじょ]となる。"
  12: "これらの町[まち]は、血[ち]の復讐者[ふくしゅうしゃ]から逃[に]げるための避難所[ひなんじょ]となる。そして、人を殺した者[もの]は、会衆[かいしゅう]の前[まえ]に立[た]って裁[さば]きを受[う]けるまで死[し]ぬことはない。"
  13: "あなたがたが与[あた]える町のうち、六[むっ]つの町は避難所[ひなんじょ]となる。"
  14: "三[みっ]つの町をヨルダン川[がわ]の向[む]こう側[がわ]に、三つの町をカナンの地[ち]に与[あた]えなさい。"
  15: "これらの町[まち]は、イスラエルの子[こ]らにも、寄留者[きりゅうしゃ]にも、あなたがたの間[あいだ]に移[わた]り住[す]む者[もの]にも、思[おも]わず人[ひと]の命[いのち]を打[う]った者がだれでもそこへ逃[に]げ込[こ]むための避難所[ひなんじょ]となる。"
  16: "しかし、もし鉄[てつ]の道具[どうぐ]で彼[かれ]を打[う]って死[し]なせたなら、その者[もの]は人殺[ひとごろ]しである。その人殺しは必[かなら]ず死[し]に処[しょ]せよ。"
  17: "もし手[て]から投[な]げた石[いし]で、それに当たれば死[し]ぬような石で彼を打って死なせたなら、その者は人殺しである。その人殺しは必ず死に処せよ。"
  18: "もし手[て]から用[もち]いる木[き]の道具[どうぐ]で、それによって死ぬようなもので彼を打って死なせたなら、その者は人殺しである。その人殺しは必ず死に処せよ。"
  19: "血[ち]の復讐者[ふくしゅうしゃ]が、その人殺しを殺[ころ]す。彼がその者に出会[であ]うとき、その者が彼を殺すのである。"
  20: "もし憎[にく]しみのゆえに彼[かれ]を突[つ]き飛[と]ばし、待[ま]ち伏[ぶ]せて彼の上[うえ]に何[なに]かの道具[どうぐ]を投[な]げつけ、そのために死[し]なせたなら、"
  21: "あるいは怒[いか]りのゆえに手[て]で彼を打って死なせたなら、打った者[もの]は必[かなら]ず死に処[しょ]せよ。その者は人殺[ひとごろ]しである。人を殺[ころ]す者は必ず死に処せよ。血[ち]の復讐者[ふくしゅうしゃ]は、彼に出会[であ]ったとき、その人殺しを殺す。"
  22: "しかし、もし不意[ふい]に、憎[にく]しみのゆえでなく彼[かれ]を突[つ]き飛[と]ばし、待[ま]ち伏[ぶ]せによらず彼の上[うえ]に何[なに]かの道具[どうぐ]を投[な]げつけ、"
  23: "あるいは、当たれば死[し]ぬような石[いし]を、気[き]づかずに彼[かれ]の上[うえ]に落[お]とし、そのために死なせたなら、しかも彼がその者の敵[てき]でもなく、害[がい]を加[くわ]えようとしていたのでもなければ、"
  24: "会衆[かいしゅう]はこれらの裁[さば]きに従[したが]って、打[う]った者[もの]と血[ち]の復讐者[ふくしゅうしゃ]との間[あいだ]を裁[さば]く。"
  25: "会衆は、その人殺しを血の復讐者の手[て]から救[すく]い出[だ]し、彼が逃[に]げ込[こ]んだ自分[じぶん]の避難[ひなん]の町[まち]へ連[つ]れ戻[もど]す。彼はそこに住む。聖[せい]なる油[あぶら]を注[そそ]がれた大祭司[だいさいし]が死[し]ぬまでである。"
  26: "しかし、もしその人殺しが、逃[に]げ込んだ町の境[さかい]の外[そと]へ出[で]て行[い]けば、"
  27: "血[ち]の復讐者[ふくしゅうしゃ]が彼をその避難の町の境の外で見[み]つけ、血の復讐者がその人殺しを殺しても、その者[もの]は血の罪[つみ]を負[お]わない。"
  28: "彼は大祭司[だいさいし]が死[し]ぬまで避難[ひなん]の町[まち]に住まなければならない。大祭司が死んだ後[のち]、その人殺しは自分[じぶん]の所有[しょゆう]の地[ち]へ帰[かえ]ることができる。"
  29: "これらは、あなたがたのすべての住[す]まいのうちで、代々[よよ]あなたがたの裁[さば]きの定[さだ]めとなるであろう。"
  30: "人[ひと]の命[いのち]を打[う]った者[もの]はだれでも、証人[しょうにん]たちの言葉[ことば]によってその人殺しを殺[ころ]さなければならない。ただ一人[ひとり]の証人だけで、人を死[し]に処[しょ]するために証言[しょうげん]してはならない。"
  31: "死[し]に処[しょ]せられるべき罪[つみ]のある人殺しから、その命[いのち]のために贖[あがな]い金[きん]を取[と]ってはならない。彼は必ず死に処せられるからである。"
  32: "また、避難[ひなん]の町[まち]へ逃[に]げて、大祭司[だいさいし]が死ぬまで再[ふたた]びその地[ち]に住[す]めるようにするための贖[あがな]い金を取ってはならない。"
  33: "あなたがたが住[す]む地[ち]を、血[ち]を流[なが]して汚[けが]してはならない。血はその地を汚すからである。地は、その上[うえ]に流された血から、血を流した者[もの]の血によってでなければ贖[あがな]われない。"
  34: "あなたがたが住[す]み、わたしがあなたがたの間[あいだ]に住まう地[ち]を汚[けが]してはならない。わたしはイスラエルの子[こ]らの真[ま]ん中[なか]に住む主[しゅ]であるからである。」"

notes:
  1: "Формула с указанием места: ἐπὶ δυσμῶν Μωαβ παρὰ τὸν Ιορδάνην κατὰ Ιεριχω (ср. 33:50)."
  2: "Σύνταξον — «заповедай» (συντάσσω). ἀπὸ τῶν κλήρων κατασχέσεως αὐτῶν — «из жребиев владения их» (κατάσχεσις). προάστεια — «предградия», здесь 放牧地 (пастбища при городах). κύκλῳ αὐτῶν — вокруг них."
  3: "ἀφορίσματα — «выделенные (участки)» (ἀφόρισμα; слав. «участия»). κτῆνος — скот, 家畜; τετράπους — четвероногое (四足の動物)."
  4: "τὰ συγκυροῦντα τῶν πόλεων — «прилежащее (примыкающее) к городам» (συγκυρέω). ἀπὸ τείχους … καὶ ἔξω — «от стены и наружу» (τεῖχος — городская стена). δισχιλίους πήχεις κύκλῳ — две тысячи локтей вокруг (πῆχυς — локоть; キュビト)."
  5: "μετρήσεις — отмеришь (μετρέω). κλῖτος — сторона (ср. 34:3). πρὸς θάλασσαν — «к морю», т. е. к западу. ἡ πόλις μέσον τούτου — «город посреди этого». ὅμορα — «смежное, пограничное» (ὅμορος)."
  6: "φυγαδευτήρια — «места убежища» (φυγαδευτήριον; 避難所). τῷ φονεύσαντι — «убившему» (φονεύω). τεσσαράκοντα καὶ δύο — сорок два. Слав. вставляет «(да будут)» — глосса-связка."
  7: "τεσσαράκοντα καὶ ὀκτὼ πόλεις — сорок восемь городов. ταύτας καὶ τὰ προάστεια αὐτῶν — «их и предградия их»."
  8: "ἀπὸ τῶν τὰ πολλὰ πολλὰ καὶ ἀπὸ τῶν ἐλαττόνων ἐλάττω — «от имеющих много — много, от меньших — меньше» (ἐλάσσων). ἕκαστος κατὰ τὴν κληρονομίαν αὐτοῦ — каждый по уделу своему."
  9: "Формула ἐλάλησεν κύριος πρὸς Μωυσῆν λέγων; речь — с 10-го стиха."
  10: "Ὑμεῖς διαβαίνετε τὸν Ιορδάνην — «вы переходите Иордан» (praesens); речь Бога — с 10-го стиха."
  11: "διαστελεῖτε — «отделите, назначьте» (δια στέλλω). πᾶς ὁ πατάξας ψυχὴν ἀκουσίως — «всякий, поразивший душу невольно» (πατάσσω; ἀκουσίως — 思わず)."
  12: "ἀπὸ ἀγχιστεύοντος τὸ αἷμα — «от мстящего за кровь» (ἀγχιστεύω — «быть близким родственником», отсюда 血の復讐者). ἕως ἂν στῇ ἔναντι τῆς συναγωγῆς εἰς κρίσιν — «доколе не предстанет пред обществом на суд»."
  13: "τὰς ἓξ πόλεις — шесть городов (повтор). φυγαδευτήρια ἔσονται ὑμῖν — «будут вам убежищем»."
  14: "ἐν τῷ πέραν τοῦ Ιορδάνου — «на той стороне Иордана» (заиорданские города); ἐν γῇ Χανααν — в земле Ханаан."
  15: "φυγάδιον — «убежище» (вариант φυγαδευτήριον). πρόσηλυτος — пришелец (寄留者); πάροικος — поселенец (移り住む者, ср. Лев 25:35). πατάξαντι ψυχὴν ἀκουσίως — ср. ст. 11."
  16: "ἐν σκεύει σιδήρου — «железным орудием» (σκεῦος — сосуд, орудие; σίδηρος — железо). θανάτῳ θανατούσθω — «смертью да умрёт», т. е. да будет предан смерти (3-е л. повелительного)."
  17: "ἐν λίθῳ ἐκ χειρός — «камнем из руки», т. е. брошенным (ἐκ χειρός). ἐν ᾧ ἀποθανεῖται ἐν αὐτῷ — «от которого можно умереть» (плеоназм с ἐν)."
  18: "σκεῦος ξύλινον — деревянное орудие (ξύλινος). ἐξ οὗ ἀποθανεῖται — «от которого умрёт»."
  19: "ὁ ἀγχιστεύων τὸ αἷμα — мститель за кровь. ὅταν συναντήσῃ αὐτῷ — «когда встретит его» (συναντάω + дат.). οὗτος ἀποκτενεῖ — «он убьёт» (повтор подлежащего)."
  20: "δι᾿ ἔχθραν — по вражде (ἔχθρα). ὤσῃ — толкнёт (ὠθέω). ἐπιρρίψῃ — бросит на (ἐπιρρίπτω). ἐξ ἐνέδρου — «из засады», с умыслом (ἐνέδρα)."
  21: "διὰ μῆνιν — из-за гнева (μῆνις). θανάτῳ θανατούσθω — ср. ст. 16; формула повторена дважды (ὁ πατάξας … ὁ φονεύων). ἐν τῷ συναντῆσαι αὐτῷ — «при встрече с ним»."
  22: "ἐξάπινα — внезапно (ἐξάπινα). οὐ δι᾿ ἔχθραν — не по вражде. οὐκ ἐξ ἐνέδρου — не из засады."
  23: "ἐπιπέσῃ ἐπ᾿ αὐτόν — «упадёт на него» (ἐπιπίπτω). οὐκ εἰδώς — не зная. οὐκ ἐχθρὸς αὐτοῦ ἦν — не был врагом его. ζητῶν κακοποιῆσαι — «ища сделать зло»."
  24: "κρινεῖ ἡ συναγωγή — «рассудит общество» (κρίνω). ἀνὰ μέσον … κατὰ τὰ κρίματα ταῦτα — «между … по этим судам»."
  25: "ἐξελεῖται — «избавит» (ἐξαιρέω). ἀποκαταστήσουσιν — «возвратят, поставят обратно» (ἀποκαθίστημι). ἕως ἂν ἀποθάνῃ ὁ ἱερεὺς ὁ μέγας — доколе не умрёт великий священник. ὃν ἔχρισαν … τῷ ἐλαίῳ τῷ ἁγίῳ — «которого помазали святым елеем» (χρίω)."
  26: "ἐξόδῳ ἐξέλθῃ — «выйдет выходом» (усилительный оборот, ср. слав. «исходом изыдет»). τὰ ὅρια τῆς πόλεως — пределы города."
  27: "εὕρῃ — найдёт (εὑρίσκω). καταφυγή — убежище (καταφυγή). οὐκ ἔνοχός ἐστιν — «не повинен» (ἔνοχος), т. е. не подлежит кровной мести."
  28: "ἐν γὰρ τῇ πόλει τῆς καταφυγῆς κατοικείτω — «ибо в городе убежища пусть живёт» (3-е л. повелительного). ἐπαναστραφήσεται — «возвратится» (ἐπαναστρέφω). γῆ τῆς κατασχέσεως αὐτοῦ — земля владения его."
  29: "δικαίωμα κρίσεως — «постановление суда» (δικαίωμα; ср. 27:11). εἰς τὰς γενεὰς ὑμῶν — в роды ваши. κατοικία — жилище, поселение."
  30: "διὰ μαρτύρων φονεύσεις — «при (по словам) свидетелях убьёшь», т. е. по показаниям свидетелей. μάρτυς εἷς οὐ μαρτυρήσει ἐπὶ ψυχὴν ἀποθανεῖν — «один свидетель не засвидетельствует против души к смерти»."
  31: "λύτρα περὶ ψυχῆς — «выкуп за душу» (λύτρον; 贖い金, ср. Исх 21:30). τοῦ ἐνόχου ὄντος ἀναιρεθῆναι — «подлежащего убиению» (ἀναιρέω). θανάτῳ γὰρ θανατωθήσεται — «ибо смертью умрёт» (буд.)."
  32: "οὐ λήμψεσθε λύτρα τοῦ φυγεῖν … τοῦ πάλιν κατοικεῖν — «не возьмёте выкупа, чтобы убежать … чтобы снова жить». ἕως ἂν ἀποθάνῃ ὁ ἱερεὺς ὁ μέγας — до смерти великого священника."
  33: "φονοκτονήσητε/φονοκτονεῖ — «убивать» (φονοκτονέω, редкий глагол; слав. «да не убиете земли… кровь сия убивает землю»). οὐκ ἐξιλασθήσεται — «не умилостивится, не очистится» (ἐξιλάσκομαι). ἀλλ᾿ ἐπὶ τοῦ αἵματος τοῦ ἐκχέοντος — «но кровью проливающего», т. е. кровью самого убийцы. В тексте передано 汚す по смыслу клаузы об очищении; буквальное «убивать землю» отмечено здесь."
  34: "μιανεῖτε — оскверните (μιαίνω). κατασκηνώσω ἐν ὑμῖν — «вселюсь (поставлю скинию) среди вас» (κατασκηνόω; ср. σκηνή). ἐγὼ γάρ εἰμι κύριος κατασκηνῶν ἐν μέσῳ — «ибо Я Господь, обитающий среди»."
