# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в этой главе нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 35: левитские города и пастбища (1–8), шесть городов убежища и три
# заиорданских (9–15), различие умышленного убийства и невольного (16–24),
# суд общества и жизнь в городе убежища до смерти первосвященника (25–29),
# свидетели и выкуп (30–34).
# Речь Бога — 「…」 (2–8, 10–34). Красного нет.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (сверено bracket_check.rb);
# слав. скобочные связки «(да будут)» (35:6) — глосса, не чтение.
# Сносок ⟨…⟩ нет: новые слова (避難所, 人殺し, 血の復讐者) понятны по контексту,
# а レビ人, 会衆, 嗣業, 祭司 уже пояснены в корпусе.
# Термины: φυγαδευτήριον — 避難所 / 避難の町 (не 逃れの町); προάστεια — 放牧地
# (пастбища при городах); ἀγχιστεύων τὸ αἷμα — 血の復讐者; πρόσηλυτος — 寄留者,
# πάροικος — 移り住む者 (ср. Лев 25:35); πῆχυς — キュビト (ср. 11:31).
# LXX: 35:5 θάλασσα — «море», т. е. западная сторона; 35:33 φονοκτονέω — букв.
