# jp-box, Иов, глава 21. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге только 1–2; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 21: ответ Иова Зофару (2–34): просьба выслушать (2–6), почему нечестивые
# живут и старятся в богатстве (7–13), их слова Богу (14–16), их гибель (17–21),
# Бог — учитель разума (22), смерть обоих (23–26), обличение друзей (27–34).
# Голоса: ст. 1 — формула, повествование, вне кавычек; ст. 2–34 — речь Иова, одна
# цитата 「…」 от начала ст. 2 до конца ст. 34. Внутри речи слова нечестивых о Боге
# (14–15) и слова друзей (28) — 『…』. Красного и синего нет (Ветхий Завет).
# Нумерация по gr: 34 стиха; в csl-ru тоже 34, деление совпадает.
# 〔…〕 нет: все стихи есть в gr-lxx-byz. Сносок ⟨…⟩ нет: 全能者, 正しい者, 不敬な者,
# 知恵, よみ, 鞭 уже в корпусе. Имена — транслитерация греческого (LXX).

