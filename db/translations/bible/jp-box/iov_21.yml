verses:
  1: "ヨブは答[こた]えて言[い]った。"
  2: "「わたしの言葉[ことば]を、よくよく聞[き]いてくれ。そうすれば、あなたがたの慰[なぐさ]めが、わたしへの慰めとなることはない。"
  3: "わたしを耐[た]え忍[しの]んでくれ、わたしは語[かた]る。その後[あと]で、わたしを嘲[あざけ]うがよい。"
  4: "何[なに]か。わたしの訴[うった]えは人[ひと]に向[む]かうものなのか。それなら、なぜわたしが怒[いか]らずにいられようか。"
  5: "わたしを見[み]て驚[おどろ]き、手[て]を頬[ほお]に当[あ]てよ。"
  6: "わたしは思[おも]い出[だ]すだけで恐[おそ]れおののき、病[やまい]がわたしの肉[にく]を捕[と]らえる。"
  7: "なぜ、不敬[ふけい]な者[もの]たちは生[い]き、しかも富[とみ]のうちに年老[としお]いるのか。"
  8: "彼らの子孫[しそん]は心[こころ]のままにあり、その子[こ]らは目[め]の前[まえ]にいる。"
  9: "彼らの家[いえ]は栄[さか]え、どこにも恐[おそ]れはなく、主[しゅ]からの鞭[むち]は彼らの上[うえ]にない。"
  10: "彼らの牛[うし]は流産[りゅうざん]せず、身[み]ごもった者[もの]は無事[ぶじ]に産[う]み、子[こ]を失[うしな]わない。"
  11: "彼らは永遠[えいえん]の羊[ひつじ]のようにとどまり、その子[こ]どもたちは遊[あそ]びまわる。"
  12: "彼らは琴[こと]と竪琴[たてごと]を取[と]って、歌[うた]の声[こえ]で喜[よろこ]び楽[たの]しむ。"
  13: "彼らは幸[さいわ]いのうちに生涯[しょうがい]を終[お]え、よみの安[やす]らぎに眠[ねむ]る。"
  14: "彼らは主[しゅ]に言う。『わたしたちから離[はな]れてくれ。あなたの道[みち]を知[し]ることを、わたしたちは望[のぞ]まない。"
  15: "全能者[ぜんのうしゃ]とは何[なに]ものか。わたしたちがこれに仕[つか]えるとは。これに近[ちか]づいても、何[なん]の益[えき]になろうか。』"
  16: "彼らの手[て]には幸[さいわ]いがあった。しかし、神[かみ]は不敬[ふけい]な者[もの]の業[わざ]を顧[かえり]みられない。"
  17: "しかし、不敬[ふけい]な者[もの]の灯[ともしび]も消[き]え、破滅[はめつ]が彼らに臨[のぞ]み、苦[くる]しみが怒[いか]りによって彼らを捕[と]らえる。"
  18: "彼らは風[かぜ]の前[まえ]の籾殻[もみがら]のようになり、つむじ風[かぜ]に奪[うば]われる塵[ちり]のようになる。"
  19: "その財産[ざいさん]は彼の子[こ]らから絶[た]え、神は彼自身[じしん]に報[むく]い、彼はそれを知[し]るであろう。"
  20: "彼の目[め]が自分[じぶん]の滅[ほろ]びを見[み]るように。主[しゅ]から救[すく]い出[だ]されることがないように。"
  21: "彼の後[あと]に、彼の家[いえ]に彼の願[ねが]いが何[なに]か残[のこ]るだろうか。彼の月[つき]の数[かず]はすでに分[わ]けられた。"
  22: "知恵[ちえ]と知識[ちしき]を教[おし]えるのは主[しゅ]ではないか。この方[かた]が賢[かしこ]い者[もの]たちを裁[さば]かれる。"
  23: "ある者[もの]は自分[じぶん]の無垢[むく]の力[ちから]のうちに、すべて穏[おだ]やかに、栄[さか]えつつ死[し]ぬ。"
  24: "その内臓[ないぞう]は脂[あぶら]で満[み]ち、骨髄[こつずい]は溶[と]け出[で]している。"
  25: "しかし別[べつ]の者[もの]は、何[なん]の幸[さいわ]いも味[あじ]わわずに、魂[たましい]の苦[にが]さのうちに死ぬ。"
  26: "二人[ふたり]はともに地[ち]に眠[ねむ]り、腐敗[ふはい]が彼らを覆[おお]う。"
  27: "わたしは知[し]っている。あなたがたが厚[あつ]かましくもわたしに迫[せま]っていることを。"
  28: "あなたがたは言うからである。『支配者[しはいしゃ]の家[いえ]はどこにあるのか。不敬[ふけい]な者[もの]の天幕[てんまく]の覆[おお]いはどこにあるのか。』"
  29: "道[みち]を行[ゆ]く者[もの]たちに尋[たず]ねてみよ。彼らのしるしをないがしろにしてはならない。"
  30: "悪[わる]い者[もの]は滅[ほろ]びの日[ひ]のために取[と]っておかれ、怒[いか]りの日に連[つ]れ去[さ]られる。"
  31: "だれが彼の面前[めんぜん]で彼の道[みち]を告[つ]げるのか。彼が行[おこな]ったことを、だれが彼に報[むく]いるのか。"
  32: "彼は墓[はか]へと運[はこ]ばれ、墓の上[うえ]で夜[よる]を明[あ]かす。"
  33: "谷川[たにがわ]の小石[こいし]は彼に甘[あま]く、すべての人[ひと]が彼の後[あと]に従[したが]い、彼の前[まえ]には数[かぞ]えきれない者[もの]がいた。"
  34: "あなたがたは、どうしてむなしい慰[なぐさ]めをわたしに与[あた]えるのか。あなたがたの答[こた]えには、わたしを休[やす]ませるものが何[なに]もない。」"

notes:
  1: "Ὑπολαβὼν δὲ Ιωβ λέγει — вводная формула, повествование, вне кавычек. Слав. «Отвещав же иов, рече». Речь Иова — ст. 2–34, одна цитата; в ст. 14–15 и 28 внутри неё чужая речь, поэтому 『』."
  2: "Ἀκούσατε ἀκούσατέ μου τῶν λόγων — «послушайте, послушайте слов моих»: удвоение императива сохранено. ἵνα μὴ ᾗ μοι παρ᾿ ὑμῶν αὕτη ἡ παράκλησις — «чтобы не было мне от вас этого утешения»: в LXX и слав. отрицание μή («да не будет ми от вас сие утешение»), в МТ и ru без отрицания («это будет мне утешением от вас»). Держимся LXX, тёмное место отмечено. Говорящий: Иов."
  3: "ἄρατέ με — букв. «поднимите меня», в значении «потерпите меня» (слав. «потерпите ми»; αἴρω — поднимать, здесь по евр. обороту). ἐγὼ δὲ λαλήσω — «я же буду говорить». εἶτ οὐ καταγελάσετέ μου — «затем… не посмеётесь ли надо мной»: вопрос или дозволение, двусмысленность сохранена. Говорящий: Иов."
  4: "τί γάρ — «что же?» (риторическое). μὴ ἀνθρώπου μου ἡ ἔλεγξις — «разве моё обличение (тяжба) от человека» (ἔλεγξις — обличение, спор); слав. «еда человеческо ми обличение». ἢ διὰ τί οὐ θυμωθήσομαι — «или почему мне не разгневаться»; слав. «почто не возярюся». Говорящий: Иов."
  5: "εἰσβλέψαντες εἰς ἐμὲ θαυμάσατε — «взглянув на меня, удивитесь» (εἰσβλέπω — взирать). χεῖρα θέντες ἐπὶ σιαγόνι — «положив руку на щёку» (σιαγών — челюсть, щека): жест ужаса и молчания; слав. «руку положше на ланите». Говорящий: Иов."
  6: "ἐάν τε γὰρ μνησθῶ, ἐσπούδακα — «ибо если я вспомню, я содрогнулся» (σπεύδω здесь в значении трепетать, слав. «ужаснуся»). ἔχουσιν δέ μου τὰς σάρκας ὀδύναι — «и болезни овладевают моей плотью» (σάρξ — плоть); слав. «обдержат бо плоть мою болезни». Говорящий: Иов."
  7: "διὰ τί ἀσεβεῖς ζῶσιν — «почему нечестивые живут»: главный вопрос главы. πεπαλαίωνται δὲ καὶ ἐν πλούτῳ — «и состарились в богатстве» (παλαιόω — старить); слав. «обетшаша же в богатстве»; в ru добавлено «и силами крепки» (с евр.), в LXX этого нет. Говорящий: Иов."
  8: "ὁ σπόρος αὐτῶν κατὰ ψυχήν — «семя их — по душе», т. е. по желанию, как хотят (σπόρος — семя, потомство). τὰ δὲ τέκνα αὐτῶν ἐν ὀφθαλμοῖς — «и дети их перед глазами», т. е. при них, живы; слав. «семя их по души, чада же их пред очима». Говорящий: Иов."
  9: "οἱ οἶκοι αὐτῶν εὐθηνοῦσιν — «домы их благоденствуют» (εὐθηνέω — процветать). φόβος δὲ οὐδαμοῦ — «страха же нигде». μάστιξ δὲ παρὰ κυρίου οὐκ ἔστιν ἐπ᾿ αὐτοῖς — «и бича от Господа нет на них» (μάστιξ — бич, казнь); слав. «раны же от Господа несть на них». Говорящий: Иов."
  10: "ἡ βοῦς αὐτῶν οὐκ ὠμοτόκησεν — «корова их не выкинула» (ὠμοτοκέω — рожать преждевременно, выкидывать). διεσώθη δὲ αὐτῶν ἐν γαστρὶ ἔχουσα καὶ οὐκ ἔσφαλεν — «уцелела их беременная и не погрешила», т. е. не потеряла плод (σφάλλω — ошибаться, падать); слав. «спасена же бысть их имущая во чреве и не лишися». Говорящий: Иов."
  11: "μένουσιν δὲ ὡς πρόβατα αἰώνια — «пребывают же, как овцы вечные» (αἰώνιος — вечный; вероятно, «стада» — слав. «яко овцы вечныя»). τὰ δὲ παιδία αὐτῶν προσπαίζουσιν — «и дети их играют» (προσπαίζω); слав. «дети же их предиграют». Говорящий: Иов."
  12: "ἀναλαβόντες ψαλτήριον καὶ κιθάραν — «взяв псалтирь и кифару» (ψαλτήριον — 琴; κιθάρα — 竪琴). εὐφραίνονται φωνῇ ψαλμοῦ — «веселятся голосом псалма»; слав. «вземше псалтирь и гусли, и веселятся гласом песни». Говорящий: Иов."
  13: "συνετέλεσαν δὲ ἐν ἀγαθοῖς τὸν βίον αὐτῶν — «окончили в благах жизнь свою» (συντελέω — завершать; βίος — жизнь, житие). ἐν δὲ ἀναπαύσει ᾅδου ἐκοιμήθησαν — «и в покое ада уснули»: ᾅδης — よみ, как по всему корпусу; слав. «в покои же адове успоша». Говорящий: Иов."
  14: "λέγει δὲ κυρίῳ — «говорит же Господу» (ед. ч. в греч., при собирательном смысле; слав. «глаголют же Господеви»). Ἀπόστα ἀπ᾿ ἐμοῦ — «отойди от меня»: с этого стиха чужие слова, поэтому 『』. ὁδούς σου εἰδῆναι οὐ βούλομαι — «путей твоих знать не хочу». Говорящий: Иов."
  15: "τί ἱκανός — «что [Он] за достаточный (великий)», т. е. что такое Вседержитель (ἱκανός — достаточный, способный; слав. «что достоин»). ὅτι δουλεύσομεν αὐτῷ — «что мы будем служить Ему». τίς ὠφέλεια — «какая польза»; слав. «кая польза, яко да взыщем его». Продолжение 『』 из ст. 14, закрывается здесь. Говорящий: Иов."
  16: "ἐν χερσὶν γὰρ ἦν αὐτῶν τὰ ἀγαθά — «ибо в руках их были блага»: продолжение мысли о том, что они получили желаемое (γάρ — «ибо», в переводе без союза). ἔργα δὲ ἀσεβῶν οὐκ ἐφορᾷ — «дел же нечестивых не взирает» (ἐφοράω — надзирать); слав. «дел же нечестивых не надзирает». Стих — снова речь Иова, вне 『』."
  17: "οὐ μὴν δὲ ἀλλὰ καὶ — «но однако же и»: сильный противительный оборот. ἀσεβῶν λύχνος σβεσθήσεται — «светильник нечестивых угаснет» (σβέννυμι — гасить). ἐπελεύσεται δὲ αὐτοῖς ἡ καταστροφή — «найдёт на них разрушение» (καταστροφή). ὠδῖνες δὲ αὐτοὺς ἕξουσιν ἀπὸ ὀργῆς — «и муки охватят их от гнева» (ὠδίν — родовые боли); слав. «болезни же их оымут от гнева». Говорящий: Иов."
  18: "ἔσονται δὲ ὥσπερ ἄχυρα πρὸ ἀνέμου — «будут же, как мякина перед ветром» (ἄχυρον — мякина, плевелы). ἢ ὥσπερ κονιορτός, ὃν ὑφείλατο λαῖλαψ — «или как прах, который унёс вихрь» (κονιορτός — пыль; λαῖλαψ — буря, вихрь); слав. «аки плевы пред ветром… егоже взя вихр». Говорящий: Иов."
  19: "ἐκλίποι υἱοὺς τὰ ὑπάρχοντα αὐτοῦ — «да оскудеет для сыновей имущество его» (ἐκλείπω — оставлять, иссякать). ἀνταποδώσει πρὸς αὐτὸν καὶ γνώσεται — «воздаст ему, и он узнает» (ἀνταποδίδωμι — воздавать); слав. «да оскудеют сыном имения его: воздаст противу ему, и уразумеет». Говорящий: Иов."
  20: "ἴδοισαν οἱ ὀφθαλμοὶ αὐτοῦ τὴν ἑαυτοῦ σφαγήν — «да увидят очи его своё убиение» (σφαγή — заклание); оптатив-пожелание. ἀπὸ δὲ κυρίου μὴ διασωθείη — «от Господа же да не спасётся»; слав. «от Господа же да не спасется». Говорящий: Иов."
  21: "τί θέλημα αὐτοῦ ἐν οἴκῳ αὐτοῦ μετ᾿ αὐτόν — «что его желание в доме его после него», т. е. какая ему забота о доме после смерти (θέλημα — воля, желание). ἀριθμοὶ μηνῶν αὐτοῦ διῃρέθησαν — «числа месяцев его разделились», т. е. срок его разделён, кончен (διαιρέω — разделять); слав. «и числа месяцей его разделишася». Говорящий: Иов."
  22: "πότερον οὐχὶ ὁ κύριός ἐστιν ὁ διδάσκων σύνεσιν καὶ ἐπιστήμην — «не Господь ли есть учащий разуму и ведению» (σύνεσις — разумение; ἐπιστήμη — знание). αὐτὸς δὲ φόνους διακρινεῖ — «Он же убийства рассудит» (φόνος — убийство); слав. читает иначе: «тойже мудрых разсуждает», по паритету взято слав. (賢い者たちを裁く), вариант LXX отмечен здесь. Говорящий: Иов."
  23: "οὗτος ἀποθανεῖται ἐν κράτει ἁπλοσύνης αὐτοῦ — «этот умрёт в силе простоты своей» (κράτος — сила; ἁπλότης — простота, непорочность). ὅλος δὲ εὐπαθῶν καὶ εὐθηνῶν — «весь благодушествуя и благоденствуя» (εὐπαθέω — жить в довольстве); слав. «всецел же благодушествуяй и благоуспеваяй». Говорящий: Иов."
  24: "τὰ δὲ ἔγκατα αὐτοῦ πλήρη στέατος — «внутренности его полны тука» (ἔγκατα — внутренности; στέαρ — жир, тук). μυελὸς δὲ αὐτοῦ διαχεῖται — «и мозг его разливается» (μυελός — костный мозг); слав. «утроба же его исполнена тука, мозг же его разливается». Говорящий: Иов."
  25: "ὁ δὲ τελευτᾷ ὑπὸ πικρίας ψυχῆς — «а тот умирает от горечи души» (πικρία — горечь). οὐ φαγὼν οὐδὲν ἀγαθόν — «не вкусив ничего благого»; слав. «не ядый ничтоже блага». Говорящий: Иов."
  26: "ὁμοθυμαδὸν δὲ ἐπὶ γῆς κοιμῶνται — «вместе же на земле спят» (ὁμοθυμαδόν — единодушно, вместе). σαπρία δὲ αὐτοὺς ἐκάλυψεν — «и гнилость покрыла их» (σαπρία — гниль); слав. «вкупе же на земли спят, гнилость же их покры». Говорящий: Иов."
  27: "ὥστε οἶδα ὑμᾶς — «итак знаю вас» (ὥστε — так что). ὅτι τόλμῃ ἐπίκεισθέ μοι — «что вы с дерзостью належите на меня» (τόλμα — дерзость; ἐπίκειμαι — напирать); слав. «темже вем вас, яко дерзостию належите ми». Говорящий: Иов."
  28: "ποῦ ἐστιν οἶκος ἄρχοντος — «где дом князя (правителя)» (ἄρχων — начальник, князь). ἡ σκέπη τῶν σκηνωμάτων τῶν ἀσεβῶν — «покров селений нечестивых» (σκέπη — кров, покров; σκήνωμα — жилище, шатёр). Это слова друзей, которые Иов приводит, — 『』."
  29: "ἐρωτήσατε παραπορευομένους ὁδόν — «спросите мимоходящих путём» (παραπορεύομαι — проходить мимо). τὰ σημεῖα αὐτῶν οὐκ ἀπαλλοτριώσετε — «знамений их не отчуждите», т. е. не отвергайте их свидетельства (ἀπαλλοτριόω — отчуждать); слав. «знамения их не чужда сотворите». Говорящий: Иов."
  30: "εἰς ἡμέραν ἀπωλείας κουφίζεται ὁ πονηρός — «на день погибели щадится злой» (κουφίζω — облегчать, щадить); слав. «на день пагубы соблюдается нечестивый». εἰς ἡμέραν ὀργῆς αὐτοῦ ἀπαχθήσονται — «в день гнева его будут отведены» (ἀπάγω — уводить). Говорящий: Иов."
  31: "τίς ἀπαγγελεῖ ἐπὶ προσώπου αὐτοῦ τὴν ὁδὸν αὐτοῦ — «кто возвестит в лицо ему путь его» (ἀπαγγέλλω — возвещать). καὶ αὐτὸς ἐποίησεν, τίς ἀνταποδώσει αὐτῷ — «и что он сделал — кто воздаст ему»; слав. «и еже той сотвори, кто воздаст ему». Говорящий: Иов."
  32: "καὶ αὐτὸς εἰς τάφους ἀπηνέχθη — «и он к могилам отнесён был» (τάφος — могила). ἐπὶ σορῷ ἠγρύπνησεν — «при гробнице бодрствовал» (σορός — погребальные носилки, гробница; ἀγρυπνέω — бодрствовать); слав. «и на гробищих побде». Говорящий: Иов."
  33: "ἐγλυκάνθησαν αὐτῷ χάλικες χειμάρρου — «усладились ему камешки потока» (χάλιξ — камешек; χείμαρρος — поток). ὀπίσω αὐτοῦ πᾶς ἄνθρωπος ἀπελεύσεται — «за ним всякий человек пойдёт». ἔμπροσθεν αὐτοῦ ἀναρίθμητοι — «перед ним бесчисленные»; слав. «пред ним безчисленнии». Говорящий: Иов."
  34: "πῶς δὲ παρακαλεῖτέ με κενά — «как же вы утешаете меня пустым» (κενά — пустое, тщетное). τὸ δὲ ἐμὲ καταπαύσασθαι ἀφ᾿ ὑμῶν οὐδέν — «а чтобы мне успокоиться от вас — ничего»: то есть ваши ответы не дают покоя; слав. «а еже бы мне почити от вас, ничтоже». Закрывающая кавычка — конец речи Иова."
