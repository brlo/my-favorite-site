# jp-box, Амос, глава 2. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 2 (совпадает).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1–3 Моав (сожжение костей царя Едомского); 4–5 Иуда (отвергли закон,
# пошли за суетными); 6–16 Израиль: продают правого за серебро, попирают бедных,
# отец и сын к одной девице, одежды залога у жертвенника, вино обвинённых;
# Господь истребил Аморрея, вывел из Египта, поставил пророков и назореев —
# а вы поили назореев вином; потому ни один не устоит, «нагой побежит».
# Голоса: 1–3, 4–5, 6–16 — слово Господа в 「…»; формулы «так говорит Господь»
# вне кавычек, закрывающее «говорит Господь» — вне кавычек. В 12 слова,
# запрещающие пророчествовать, — 『…』. В 11 «говорит Господь» внутри речи
# (кавычки не закрываются), речь продолжается в 12.
# Рефрен: 「…の三つの罪、いや四つの罪のゆえに、わたしはその裁きを取り消さない».
# Термины: 不敬/罪 (ἀσέβεια), 律法 (νόμος), 戒め (πρόσταγμα), 嗣業 (κληρονομία),
# 聖別された者 (ἁγιασμός — назорей), 魂 (ψυχή).
# Имена: モアブ, エドム, ユダ, エルサレム, イスラエル, アモリ人, エジプト, ヨセフ.
#
tr_code: jp-box
book: am
chapter: 2
draft: true

verses:
  1: "主[しゅ]はこう言[い]われる。「モアブの三[みっ]つの罪[つみ]、いや四[よっ]つの罪のゆえに、わたしはその裁[さば]きを取[と]り消[け]さない。彼らがエドムの王[おう]の骨[ほね]を焼[や]いて灰[はい]にしたからである。"
  2: "わたしはモアブに火[ひ]を送[おく]り、それはその町[まち]々[まち]の基[もとい]を食[く]い尽[つ]くす。モアブは叫[さけ]び声[ごえ]と角笛[つのぶえ]の音[ね]とともに、無力[むりょく]のうちに死[し]ぬ。"
  3: "わたしはその中[なか]から裁[さば]き手[て]を滅[ほろ]ぼし、すべての君[きみ]たちを彼とともに殺[ころ]す。」と主[しゅ]は言[い]われる。"
  4: "主[しゅ]はこう言[い]われる。「ユダの三[みっ]つの罪[つみ]、いや四[よっ]つの罪のゆえに、わたしはその裁[さば]きを取[と]り消[け]さない。彼らが主[しゅ]の律法[りっぽう]を退[しりぞ]け、その戒[いまし]めを守[まも]らず、自分[じぶん]たちが造[つく]った空[むな]しいものに惑[まど]わされ、父[ちち]たちがそれに従[したが]ったからである。"
  5: "わたしはユダに火[ひ]を送[おく]り、それはエルサレムの基[もとい]を食[く]い尽[つ]くす。」と主[しゅ]は言[い]われる。"
  6: "主[しゅ]はこう言[い]われる。「イスラエルの三[みっ]つの罪[つみ]、いや四[よっ]つの罪のゆえに、わたしはその裁[さば]きを取[と]り消[け]さない。彼らが銀[ぎん]のために正[ただ]しい者[もの]を、一足[いっそく]のサンダルのために貧[まず]しい者を売[う]ったからである。"
  7: "彼らは地[ち]の塵[ちり]を踏[ふ]みつけ、貧しい者[もの]の頭[あたま]を拳[こぶし]で打[う]ち、弱[よわ]い者[もの]の道[みち]を曲[ま]げる。父[ちち]と息子[むすこ]が同[おな]じ若[わか]い女[おんな]のところへ通[かよ]い、自分[じぶん]たちの神[かみ]の名[な]を汚[けが]す。"
  8: "彼らは取[と]り上[あ]げた衣[ころも]を縄[なわ]で縛[しば]って祭壇[さいだん]のそばの幕[まく]とし、ゆすり取[と]ったぶどう酒[しゅ]を自分たちの神の家[いえ]で飲[の]む。"
  9: "わたしは彼らの前[まえ]でアモリ人[じん]を滅[ほろ]ぼした。その高[たか]さは杉[すぎ]の木[き]のようであり、その強[つよ]さは樫[かし]の木のようであった。わたしは上[うえ]ではその実[み]を、下[した]ではその根[ね]を枯[か]らした。"
  10: "わたしはあなたがたをエジプトの地[ち]から導[みちび]き出[だ]し、四十年[よんじゅうねん]の間[あいだ]、荒[あ]れ野[の]であなたがたを歩[あゆ]ませ、アモリ人[じん]の地を嗣業[しぎょう]として受[う]け継[つ]がせた。"
  11: "わたしはあなたがたの息子[むすこ]たちの中[なか]から預言者[よげんしゃ]を、若者[わかもの]たちの中から聖別[せいべつ]された者[もの]を選[えら]んだ。イスラエルの子[こ]らよ、そうではないのか、と主[しゅ]は言[い]われる。"
  12: "しかし、あなたがたは聖別[せいべつ]された者[もの]たちにぶどう酒[しゅ]を飲[の]ませ、預言者[よげんしゃ]たちに命[めい]じて『預言[よげん]してはならない』と言[い]わせた。"
  13: "見[み]よ、わたしは藁[わら]を満載[まんさい]した車[くるま]が軋[きし]むように、あなたがたの下[した]で押[お]しつぶす。"
  14: "速[はや]い者[もの]から逃[に]げる力[ちから]が奪[うば]われ、強[つよ]い者[もの]はその力[ちから]を保[たも]てず、勇士[ゆうし]も自分[じぶん]の魂[たましい]を救[すく]えない。"
  15: "弓[ゆみ]を射[い]る者[もの]は立[た]ち向[む]かえず、足[あし]の速[はや]い者[もの]は逃[に]げ延[の]びず、馬[うま]に乗[の]る者[もの]も自分[じぶん]の魂[たましい]を救えない。"
  16: "その日[ひ]、勇[いさ]みある者[もの]も自分[じぶん]の心[こころ]を強[つよ]さの中[なか]に見[み]いだせず、裸[はだか]で逃[に]げる。」と主[しゅ]は言[い]われる。"

notes:
  1: "Ἐπὶ ταῖς τρισὶν ἀσεβείαις Μωαβ — «за три нечестия Моава» (モアブ); ἀνθ' ὧν κατέκαυσαν τὰ ὀστᾶ βασιλέως τῆς Ιδουμαίας εἰς κονίαν — «за то, что сожгли кости царя Идумейского в известь» (κατακαίω — сжигать; ὀστᾶ — 骨; κονία — известь/прах, csl «в пепел», 灰)."
  2: "ἐξαποστελῶ πῦρ ἐπὶ Μωαβ — «пошлю огонь на Моава»; καταφάγεται θεμέλια τῶν πόλεων αὐτῆς — «поест основания городов его» (θεμέλια — 基); ἀποθανεῖται ἐν ἀδυναμίᾳ Μωαβ — «умрёт в бессилии Моав» (ἀδυναμία — бессилие, 無力); μετὰ κραυγῆς καὶ μετὰ φωνῆς σάλπιγγος — «с воплем и гласом трубным» (κραυγή — 叫び; σάλπιγξ — 角笛)."
  3: "ἐξολεθρεύσω κριτὴν ἐξ αὐτῆς — «истреблю судью из него» (κριτής — судья, 裁き手); πάντας τοὺς ἄρχοντας αὐτῆς ἀποκτενῶ μετ' αὐτοῦ — «всех князей его умерщвлю с ним» (ἄρχοντες — 君たち)."
  4: "Ἐπὶ ταῖς τρισὶν ἀσεβείαις υἱῶν Ιουδα — «за три нечестия сынов Иуды»; ἕνεκα τοῦ ἀπώσασθαι αὐτοὺς τὸν νόμον κυρίου — «за то, что отвергли закон Господень» (ἀπωθέω — отталкивать, 退ける; νόμος — 律法); τὰ προστάγματα αὐτοῦ οὐκ ἐφυλάξαντο — «повелений Его не сохранили» (πρόσταγμα — 戒め); ἐπλάνησεν αὐτοὺς τὰ μάταια αὐτῶν, ἃ ἐποίησαν — «прельстили их суетные их, которые они сделали» (μάταια — суетное/идолы, 空しいもの); οἷς ἐξηκολούθησαν οἱ πατέρες αὐτῶν ὀπίσω αὐτῶν — «которым последовали отцы их вслед их»."
  5: "ἐξαποστελῶ πῦρ ἐπὶ Ιουδαν — «пошлю огонь на Иуду»; καταφάγεται θεμέλια Ιερουσαλημ — «поест основания Иерусалима»."
  6: "Ἐπὶ ταῖς τρισὶν ἀσεβείαις Ισραηλ — «за три нечестия Израиля»; ἀνθ' ὧν ἀπέδοντο ἀργυρίου δίκαιον — «за то, что продали за серебро праведного» (ἀποδίδωμι — продавать; δίκαιος — 正しい者); πένητα ἕνεκεν ὑποδημάτων — «бедного за сандалии» (πένης — бедный, 貧しい者; ὑπόδημα — сандалия, 一足のサンダル)."
  7: "τὰ πατοῦντα ἐπὶ τὸν χοῦν τῆς γῆς — «попирающие прах земли» (χοῦς — прах, 塵; πατέω — топтать); ἐκονδύλιζον εἰς κεφαλὰς πτωχῶν — «били кулаками в головы бедных» (κονδυλίζω — бить кулаком, 拳で打つ); ὁδὸν ταπεινῶν ἐξέκλιναν — «путь смиренных совращали» (ταπεινός — смиренный/слабый, 弱い者); υἱὸς καὶ πατὴρ αὐτοῦ εἰσεπορεύοντο πρὸς τὴν αὐτὴν παιδίσκην — «сын и отец его входили к одной и той же девице» (παιδίσκη — девица/служанка, 若い女); ὅπως βεβηλώσωσιν τὸ ὄνομα τοῦ θεοῦ αὐτῶν — «чтобы осквернить имя Бога их» (βεβηλόω — осквернять, 汚す). В ru (МТ) «святое имя Моё» — иное чтение."
  8: "τὰ ἱμάτια αὐτῶν δεσμεύοντες σχοινίοις — «одежды их, связывая верёвками» (ἱμάτιον — 衣; σχοινίον — 縄); παραπετάσματα ἐποίουν ἐχόμενα τοῦ θυσιαστηρίου — «делали завесы (покрывала), держащиеся жертвенника» (παραπέτασμα — завеса, 幕; θυσιαστήριον — 祭壇; в МТ/ru «возлежат при всяком жертвеннике» — иное чтение); οἶνον ἐκ συκοφαντιῶν ἔπινον — «вино от обвинений (вымогательства) пили» (συκοφαντία — вымогательство, ゆすり); ἐν τῷ οἴκῳ τοῦ θεοῦ αὐτῶν — «в доме Бога их»."
  9: "ἐγὼ ἐξῆρα τὸν Αμορραῖον ἐκ προσώπου αὐτῶν — «Я истребил Аморрея от лица их» (ἐξαίρω — убирать/истреблять; Αμορραῖος — アモリ人); οὗ ἦν καθὼς ὕψος κέδρου τὸ ὕψος αὐτοῦ — «которого высота была как высота кедра» (κέδρος — 杉); ἰσχυρὸς ἦν ὡς δρῦς — «крепок был как дуб» (δρῦς — 樫); ἐξῆρα τὸν καρπὸν αὐτοῦ ἐπάνωθεν καὶ τὰς ῥίζας αὐτοῦ ὑποκάτωθεν — «иссушил плод его сверху и корни его снизу» (καρπός — 実; ῥίζα — 根)."
  10: "ἀνήγαγον ὑμᾶς ἐκ γῆς Αἰγύπτου — «вывел вас из земли Египетской» (ἀνάγω — выводить); περιήγαγον ὑμᾶς ἐν τῇ ἐρήμῳ τεσσαράκοντα ἔτη — «водил вас в пустыне сорок лет» (περιάγω — водить кругом; 四十年); τοῦ κατακληρονομῆσαι τὴν γῆν τῶν Αμορραίων — «чтобы наследовать землю Аморреев» (κατακληρονομέω — получать в наследие, 嗣業として受け継ぐ)."
  11: "ἔλαβον ἐκ τῶν υἱῶν ὑμῶν εἰς προφήτας — «взял из сынов ваших в пророки» (λαμβάνω — брать, избирать); ἐκ τῶν νεανίσκων ὑμῶν εἰς ἁγιασμόν — «из юношей ваших в освящение», т.е. в назореи (ἁγιασμός — освящение; в корпусе ナジル人, здесь буквально 聖別された者); μὴ οὐκ ἔστιν ταῦτα, υἱοὶ Ισραηλ — «не так ли это, сыны Израиля» (риторический вопрос). «Говорит Господь» внутри речи — кавычки не закрываются, речь продолжается в 12."
  12: "ἐποτίζετε τοὺς ἡγιασμένους οἶνον — «поили освящённых (назореев) вином» (ποτίζω — поить); τοῖς προφήταις ἐνετέλλεσθε λέγοντες — «пророкам приказывали, говоря» (ἐντέλλομαι — повелевать, 命じる); Οὐ μὴ προφητεύσητε — «не пророчествуйте» (слова народа — 『…』, вложенная речь в слове Господа)."
  13: "ἰδοὺ ἐγὼ κυλίω ὑποκάτω ὑμῶν — «вот, Я качу (опрокидываю) под вами» (κυλίω — катить; csl «повращу под вами»); ὃν τρόπον κυλίεται ἡ ἅμαξα ἡ γέμουσα καλάμης — «как катится телега, полная соломы» (ἅμαξα — 車; κάλαμη — солома, 藁). В ru (МТ) «как давит колесница, нагруженная снопами» — иное чтение."
  14: "ἀπολεῖται φυγὴ ἐκ δρομέως — «погибнет бегство от скорохода» (φυγή — бегство; δρομεύς — бегун, 速い者); ὁ κραταιὸς οὐ μὴ κρατήσῃ τῆς ἰσχύος αὐτοῦ — «крепкий не удержит крепости своей» (κραταιός — 強い者; ἰσχύς — 力); ὁ μαχητὴς οὐ μὴ σώσῃ τὴν ψυχὴν αὐτοῦ — «воин не спасёт души своей» (μαχητής — 勇士; ψυχή — 魂)."
  15: "ὁ τοξότης οὐ μὴ ὑποστῇ — «стрелок не устоит» (τοξότης — 弓を射る者; ὑφίστημι — выдерживать); ὁ ὀξὺς τοῖς ποσὶν αὐτοῦ οὐ μὴ διασωθῇ — «быстрый ногами своими не спасётся» (ὀξύς — быстрый, 足の速い); ὁ ἱππεὺς οὐ μὴ σώσῃ τὴν ψυχὴν αὐτοῦ — «всадник не спасёт души своей»."
  16: "καὶ εὑρήσει τὴν καρδίαν αὐτοῦ ἐν δυναστείαις — «и найдёт сердце своё в крепостях (силах)»; ὁ γυμνὸς διώξεται ἐν ἐκείνῃ τῇ ἡμέρᾳ — «нагой побежит в тот день» (γυμνός — 裸; διώκω — бежать/гнать). Место тёмное: csl «крепкий не обрящет сердца своего в силах, наг побегнет»; ru «самый отважный из храбрых убежит нагой» — иное понимание; передано по смыслу LXX/csl."
