# jp-box, Бытие, глава 12. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru),
# русский Синодальный (ru) и, где есть, jp-joc (1901, public domain).
# Язык — современный 常体, без 文語; порядок членов и деление на клаузы — по греческому.
# Глава 12: призвание Аврама и обетование (1–9), голод и уход в Египет (10),
# Сара как «сестра» и бедствия фараона (11–20).
# Красного и синего нет: речь Господа (1–3, 7) и людей (11–13, 18–19) — 「…」, без <j>.
# Вложенная речь (слова египтян и слова Аврама внутри его речи) — 『…』.
# 〔…〕 нет: все слова есть в gr-lxx-byz.
# Отличие LXX: в 12:19 «возьми и уйди» — без «жену твою» (это есть в слав.); в 12:20
# LXX добавляет «и Лота с ним». Отличия — в notes. jp-ni не использовался.

tr_code: jp-box
book: gen
chapter: 12
draft: true

verses:
  1: "主[しゅ]はアブラムに言[い]われた。「あなたの地[ち]から、あなたの親族[しんぞく]から、あなたの父[ちち]の家[いえ]から出[で]て、わたしがあなたに示[しめ]す地[ち]へ行[ゆ]け。"
  2: "わたしはあなたを大[おお]きな民[たみ]とし、あなたを祝福[しゅくふく]し、あなたの名[な]を大[おお]きくする。あなたは祝福[しゅくふく]された者[もの]となる。"
  3: "わたしはあなたを祝福[しゅくふく]する者[もの]たちを祝福[しゅくふく]し、あなたを呪[のろ]う者[もの]たちを呪[のろ]う。あなたによって、地[ち]のすべての氏族[しぞく]が祝福[しゅくふく]される。」"
  4: "アブラムは主[しゅ]が彼[かれ]に語[かた]られたとおりに出[で]た。ロトも彼[かれ]とともに出[で]た。アブラムはハランを出[で]たとき、七十五歳[ななじゅうごさい]であった。"
  5: "アブラムは妻[つま]サライ、兄弟[きょうだい]の子[こ]ロト、自分[じぶん]たちが蓄[たくわ]えたすべての財産[ざいさん]、ハランで得[え]たすべての人[ひと]を連[つ]れて、カナンの地[ち]へ行[ゆ]くために出[で]た。そして、カナンの地[ち]に来[き]た。"
  6: "アブラムはその地[ち]を縦[たて]に通[とお]り、シケムの場所[ばしょ]、高[たか]い樫[かし]の木[き]のところまで来[き]た。そのとき、カナン人[じん]がその地[ち]に住[す]んでいた。"
  7: "主[しゅ]はアブラムに現[あらわ]れて言[い]われた。「わたしはこの地[ち]をあなたの子孫[しそん]に与[あた]える。」そこでアブラムは、自分[じぶん]に現[あらわ]れた主[しゅ]のために祭壇[さいだん]を築[きず]いた。"
  8: "彼[かれ]はそこからベテルの東[ひがし]の山[やま]へ移[うつ]り、そこに天幕[てんまく]を張[は]った。ベテルは西[にし]、アガイは東[ひがし]であった。彼[かれ]はそこに主[しゅ]のために祭壇[さいだん]を築[きず]き、主[しゅ]の名[な]を呼[よ]び求[もと]めた。"
  9: "アブラムは旅立[たびだ]ち、進[すす]んで荒野[こうや]に陣[じん]を張[は]った。"
  10: "地[ち]に飢饉[ききん]が起[お]こった。アブラムはそこに寄留[きりゅう]するためにエジプトへ下[くだ]った。地[ち]の飢饉[ききん]が激[はげ]しかったからである。"
  11: "エジプトに入[はい]ろうとしたとき、アブラムは妻[つま]サライに言[い]った。「わたしは知[し]っている。あなたは美[うつく]しい女[おんな]である。"
  12: "エジプト人[じん]があなたを見[み]て、『これは彼[かれ]の妻[つま]だ』と言[い]い、わたしを殺[ころ]して、あなたを生[い]かしておくだろう。"
  13: "あなたは『わたしは彼[かれ]の妹[いもうと]だ』と言[い]ってほしい。あなたのおかげでわたしはよくしてもらい、あなたによって、わたしの命[いのち]は生[い]き延[の]びるだろう。」"
  14: "アブラムがエジプトに入[はい]ると、エジプト人[じん]は、その女[おんな]が非常[ひじょう]に美[うつく]しいのを見[み]た。"
  15: "ファラオの高官[こうかん]たちも彼女[かのじょ]を見[み]て、ファラオにほめたたえた。そして、彼女[かのじょ]はファラオの家[いえ]に連[つ]れて行[ゆ]かれた。"
  16: "アブラムは彼女[かのじょ]のおかげでよく遇[あつか]われ、羊[ひつじ]、若[わか]い牛[うし]、ろば、男[おとこ]の奴隷[どれい]と女[おんな]の奴隷[どれい]、ラバ、ラクダを手[て]に入[い]れた。"
  17: "神[かみ]はファラオとその家[いえ]を、アブラムの妻[つま]サライのことで、大[おお]きな激[はげ]しい災[わざわ]いで打[う]たれた。"
  18: "ファラオはアブラムを呼[よ]んで言[い]った。「あなたはわたしに何[なに]をしたのか。彼女[かのじょ]があなたの妻[つま]であることを、なぜわたしに告[つ]げなかったのか。"
  19: "なぜ『彼女[かのじょ]はわたしの妹[いもうと]だ』と言[い]ったのか。わたしは彼女[かのじょ]を自分[じぶん]の妻[つま]にした。今[いま]、見[み]よ、あなたの妻[つま]はあなたの前[まえ]にいる。連[つ]れて行[ゆ]け。」"
  20: "ファラオはアブラムについて人々[ひとびと]に命[めい]じ、彼[かれ]とその妻[つま]、彼[かれ]のすべてのもの、ロトをも送[おく]り出[だ]させた。"

notes:
  1: "Ἔξελθε ἐκ τῆς γῆς σου — あなたの地から出て. ἐκ τῆς συγγενείας σου — 親族から (συγγένεια). ἐκ τοῦ οἴκου τοῦ πατρός σου — 父の家から. εἰς τὴν γῆν, ἣν ἄν σοι δείξω — わたしがあなたに示す地へ (ἄν с будущим — место ещё не названо)."
  2: "ποιήσω σε εἰς ἔθνος μέγα — あなたを大きな民とする. μεγαλυνῶ τὸ ὄνομά σου — 名を大きくする. ἔσῃ εὐλογητός — 祝福された者となる (LXX пассив; у jp-joc «祝福の基»)."
  3: "τοὺς εὐλογοῦντάς σε — あなたを祝福する者たち. τοὺς καταρωμένους σε καταράσομαι — 呪う者たちを呪う (καταράομαι). ἐνευλογηθήσονται ἐν σοὶ πᾶσαι αἱ φυλαὶ τῆς γῆς — あなたによって地のすべての氏族が祝福される (ἐνευλογέομαι — «получать благословение в ком-то»; ср. 18:18; 22:18)."
  4: "καθάπερ ἐλάλησεν αὐτῷ κύριος — 主が彼に語られたとおり. ᾤχετο μετ᾽ αὐτοῦ Λωτ — ロトも彼とともに. ἐτῶν ἑβδομήκοντα πέντε — 七十五歳."
  5: "τὰ ὑπάρχοντα αὐτῶν — 財産. πᾶσαν ψυχήν, ἣν ἐκτήσαντο — 得たすべての人 (ψυχή — «душа», здесь «человек»). ἐξήλθοσαν πορευθῆναι εἰς γῆν Χανααν — カナンの地へ行くために出た."
  6: "διώδευσεν… εἰς τὸ μῆκος αὐτῆς — 縦に通った (μῆκος — «длина»). Συχεμ — シケム. ἐπὶ τὴν δρῦν τὴν ὑψηλήν — 高い樫の木のところまで (δρῦς — «дуб»). οἱ Χαναναῖοι τότε κατῴκουν τὴν γῆν — そのときカナン人がその地に住んでいた."
  7: "ὤφθη κύριος τῷ Αβραμ — 主はアブラムに現れて. Τῷ σπέρματί σου δώσω τὴν γῆν ταύτην — この地をあなたの子孫に与える. θυσιαστήριον κυρίῳ τῷ ὀφθέντι αὐτῷ — 自分に現れた主のために祭壇."
  8: "εἰς τὸ ὄρος κατ᾽ ἀνατολὰς Βαιθηλ — ベテルの東の山へ. ἔστησεν τὴν σκηνὴν αὐτοῦ — 天幕を張った (ἵστημι). Βαιθηλ κατὰ θάλασσαν καὶ Αγγαι κατ᾽ ἀνατολάς — ベテルは西、アガイは東 (θάλασσα — «море», т. е. запад). ἐπεκαλέσατο ἐπὶ τῷ ὀνόματι κυρίου — 主の名を呼び求めた."
  9: "ἀπῆρεν — 旅立った (αἴρω — «снимать шатёр»). ἐστρατοπέδευσεν ἐν τῇ ἐρήμῳ — 荒野に陣を張った (στρατοπεδεύω)."
  10: "λιμὸς ἐπὶ τῆς γῆς — 地の飢饉. παροικῆσαι ἐκεῖ — そこに寄留するために (παροικέω). ἐνίσχυσεν ὁ λιμός — 飢饉が激しくなった."
  11: "ἡνίκα ἤγγισεν… εἰσελθεῖν — 入ろうとしたとき (ἐγγίζω). γυνὴ εὐπρόσωπος — 美しい女 (εὐπρόσωπος — «с прекрасным лицом»)."
  12: "ἔσται ὡς ἂν ἴδωσίν σε — あなたを見ると. Γυνὴ αὐτοῦ αὕτη — これは彼の妻だ (слова египтян — 『』, вложенная речь). σὲ δὲ περιποιήσονται — あなたを生かしておく (περιποιέομαι — «сохранять»)."
  13: "εἰπὸν ὅτι Ἀδελφή μού ἐστιν — 彼の妹だと言ってほしい. ὅπως ἂν εὖ μοι γένηται διὰ σέ — あなたのおかげでよくしてもらうため. ζήσεται ἡ ψυχή μου ἕνεκεν σοῦ — わたしの命はあなたによって生き延びる."
  14: "ἰδόντες οἱ Αἰγύπτιοι τὴν γυναῖκα ὅτι καλὴ ἦν σφόδρα — エジプト人はその女が非常に美しいのを見た."
  15: "οἱ ἄρχοντες Φαραω — ファラオの高官たち (ἄρχων). ἐπῄνεσάν αὐτὴν πρὸς Φαραω — ファラオにほめたたえた. εἰσήγαγον αὐτὴν εἰς τὸν οἶκον Φαραω — ファラオの家に連れて行った."
  16: "εὖ ἐχρήσαντο δι᾽ αὐτήν — 彼女のおかげでよく遇われた. πρόβατα, μόσχοι, ὄνοι, παῖδες, παιδίσκαι, ἡμίονοι, κάμηλοι — 羊、若い牛、ろば、男女の奴隷、ラバ、ラクダ."
  17: "ἤτασεν ὁ θεὸς τὸν Φαραω ἐτασμοῖς μεγάλοις καὶ πονηροῖς — 神はファラオを大きな激しい災いで打たれた (ἐτασμός — «казнь, поражение»). περὶ Σαρας — サライのことで."
  18: "καλέσας δὲ Φαραω — ファラオは呼んで. Τί τοῦτο ἐποίησάς μοι — あなたはわたしに何をしたのか. οὐκ ἀπήγγειλάς μοι — なぜ告げなかったのか."
  19: "ἵνα τί εἶπας — なぜ言ったのか. ἔλαβον αὐτὴν ἐμαυτῷ εἰς γυναῖκα — 自分の妻にした (аорист: взял её себе в жёны). λαβὼν ἀπότρεχε — 連れて行け (букв. «взяв, уходи»; в слав. добавлено «ю», т. е. «её», — в LXX этого нет)."
  20: "ἐνετείλατο… ἀνδράσιν περὶ Αβραμ — アブラムについて人々に命じた. συμπροπέμψαι — 送り出させた (συμπροπέμπω — «провожать»; LXX добавляет Λωτ μετ᾽ αὐτοῦ — «и Лота с ним»)."
