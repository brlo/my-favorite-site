verses:
  1: "アルタシャスタ王[おう]の第二十[だいにじゅう]年[ねん]、ニサンの月[つき]に、私[わたし]の前[まえ]にぶどう酒[しゅ]があった。私[わたし]はそのぶどう酒[しゅ]を取[と]って王[おう]に差[さ]し出[だ]した。彼[かれ]の前[まえ]には、私[わたし]のほかに誰[だれ]もいなかった。"
  2: "王[おう]は私[わたし]に言[い]った。「なぜ、あなたの顔[かお]は暗[くら]いのか。あなたは元気[げんき]がないではないか。これはきっと心[こころ]の苦[くる]しみにちがいない。」私[わたし]は非常[ひじょう]に恐[おそ]れた。"
  3: "私[わたし]は王[おう]に言[い]った。「王[おう]よ、永遠[えいえん]に生[い]きてください。どうして私[わたし]の顔[かお]が暗[くら]くならないというのか。私[わたし]の父祖[ふそ]たちの墓[はか]の家[いえ]である都[みやこ]が荒[あ]らされ、その門[もん]が火[ひ]に食[く]い尽[つ]くされているからである。」"
  4: "王[おう]は私[わたし]に言[い]った。「それで、あなたは何[なに]を求[もと]めているのか。」私[わたし]は天[てん]の神[かみ]に祈[いの]った。"
  5: "私[わたし]は王[おう]に言[い]った。「もし王[おう]によしとされるなら、あなたの僕[しもべ]があなたの前[まえ]で恵[めぐ]みを得[え]るなら、私[わたし]をユダへ、私[わたし]の父祖[ふそ]たちの墓[はか]の町[まち]へ遣[つか]わしてください。私[わたし]はそれを建[た]て直[なお]す。」"
  6: "王[おう]は、そばに座[すわ]っていた側女[そばめ]とともに私[わたし]に言[い]った。「あなたの旅[たび]はいつまでかかり、いつ帰[かえ]って来[く]るのか。」王[おう]はそれをよしとし、私[わたし]を遣[つか]わした。私[わたし]は王[おう]に期限[きげん]を定[さだ]めた。"
  7: "私[わたし]は王[おう]に言[い]った。「もし王[おう]によしとされるなら、川[かわ]の向[む]こうの太守[たいしゅ]たちに宛[あ]てた手紙[てがみ]を私[わたし]にください。ユダに着[つ]くまで、私[わたし]が通[とお]り抜[ぬ]けられるように。"
  8: "また、王[おう]の森[もり]を守[まも]るアサフに宛[あ]てた手紙[てがみ]もください。私[わたし]に材木[ざいもく]を与[あた]えて、門[もん]に屋根[やね]を架[か]け、町[まち]の城壁[じょうへき]と、私[わたし]が入[はい]る家[いえ]のために用[もち]いさせてください。」王[おう]は、私[わたし]の神[かみ]の良[よ]き手[て]が私[わたし]の上[うえ]にあったので、それを与[あた]えてくれた。"
  9: "私[わたし]は川[かわ]の向[む]こうの太守[たいしゅ]たちのところへ行[い]き、王[おう]の手紙[てがみ]を彼[かれ]らに渡[わた]した。王[おう]は軍[ぐん]の長[ちょう]たちと騎兵[きへい]たちを私[わたし]とともに遣[つか]わしていた。"
  10: "ホロン人[じん]サンバラトと、アンモン人[じん]の僕[しもべ]トビヤがこれを聞[き]いた。イスラエルの子[こ]らに良[よ]いことを求[もと]める者[もの]が来[き]たことで、彼[かれ]らは非常[ひじょう]に不[ふ]快[かい]に思[おも]った。"
  11: "私[わたし]はエルサレムに来[き]て、そこに三日[みっか]いた。"
  12: "私[わたし]は夜[よる]に、わずかな者[もの]たちとともに立[た]ち上[あ]がった。私[わたし]の心[こころ]に神[かみ]が与[あた]えられた、イスラエルのために行[おこな]うことを、私[わたし]は誰[だれ]にも告[つ]げなかった。私[わたし]が乗[の]っている獣[けもの]のほかには、私[わたし]とともに獣[けもの]はいなかった。"
  13: "私[わたし]は谷[たに]の門[もん]を出[で]て、いちじくの泉[いずみ]のほとりへ、また肥[こや]の門[もん]へ行[い]った。そしてエルサレムの城壁[じょうへき]を調[しら]べた。それは彼[かれ]らが崩[くず]したものであり、その門[もん]は火[ひ]に食[く]い尽[つ]くされていた。"
  14: "さらに泉[いずみ]の門[もん]と王[おう]の池[いけ]のところへ進[すす]んだが、私[わたし]の下[した]の獣[けもの]が通[とお]る場所[ばしょ]がなかった。"
  15: "私[わたし]は夜[よる]、谷川[たにがわ]に沿[そ]った城壁[じょうへき]を上[のぼ]って調[しら]べ、谷[たに]の門[もん]のところで引[ひ]き返[かえ]した。"
  16: "見張[みは]りの者[もの]たちは、私[わたし]がどこへ行[い]き、何[なに]をしているかを知[し]らなかった。私[わたし]はそのときまで、ユダの人[ひと]々[びと]にも、祭司[さいし]たちにも、貴人[きじん]たちにも、役人[やくにん]たちにも、工事[こうじ]をする残[のこ]りの者[もの]たちにも告[つ]げなかった。"
  17: "私[わたし]は彼[かれ]らに言[い]った。「あなたがたは、私[わたし]たちが置[お]かれている災[わざわ]いを見[み]ている。エルサレムが荒[あ]れ果[は]て、その門[もん]が火[ひ]に渡[わた]されているのを。さあ、エルサレムの城壁[じょうへき]を建[た]て直[なお]そう。そうすれば、私[わたし]たちはもはや恥[はじ]を受[う]けない。」"
  18: "私[わたし]は彼[かれ]らに、私[わたし]の上[うえ]にある神[かみ]の良[よ]き手[て]と、王[おう]が私[わたし]に語[かた]った言葉[ことば]を告[つ]げ、そして言[い]った。「立[た]ち上[あ]がって建[た]てよう。」彼[かれ]らの手[て]は良[よ]いことのために強[つよ]められた。"
  19: "しかし、ホロン人[じん]サンバラト、アンモン人[じん]の僕[しもべ]トビヤ、アラビア人[じん]ゲシェムがこれを聞[き]いて、私[わたし]たちを嘲笑[あざけ]った。彼[かれ]らは私[わたし]たちのところへ来[き]て言[い]った。「あなたがたがしているこのことは何[なん]だ。あなたがたは王[おう]に背[そむ]こうとしているのか。」"
  20: "私[わたし]は彼[かれ]らに答[こた]えて言[い]った。「天[てん]の神[かみ]が、ご自身[じしん]で私[わたし]たちを幸[さいわ]いならしめる。私[わたし]たちは神[かみ]の清[きよ]い僕[しもべ]であり、建[た]てるのだ。あなたがたには、エルサレムに受[う]け持[も]ちも、権利[けんり]も、記念[きねん]もない。」"

notes:
  1: "μηνὶ Νισαν — месяц нисан (март–апрель). ἔτους εἰκοστοῦ Αρθασασθα — 20-й год Артаксеркса (ср. 1:1). ὁ οἶνος ἐνώπιον ἐμοῦ — «вино предо мною». οὐκ ἦν ἕτερος ἐνώπιον αὐτοῦ — «не было иного пред ним» (слав. «не бе ин пред ним»); в масоретском тексте иначе: «и не был я печален пред ним» (ru), откуда и продолжение ст. 2."
  2: "τὸ πρόσωπόν σου πονηρόν — «лицо твоё худо/печально» (πονηρός здесь — дурной, скорбный; слав. «прискорбно»). οὐκ εἶ μετριάζων — «ты не держишься ровно», т. е. «вид у тебя нездоровый» (μετριάζω — быть умеренным, спокойным). οὐκ ἔστιν τοῦτο εἰ μὴ πονηρία καρδίας — «это не что иное, как злоба сердца», т. е. печаль; слав. «несть сие, разве скорбь сердца». ἐφοβήθην πολὺ σφόδρα — «я сильно испугался»."
  3: "Ὁ βασιλεὺς εἰς τὸν αἰῶνα ζήτω — «царь вовеки да живёт» (приветствие). διὰ τί οὐ μὴ γένηται πονηρόν… — «как не быть печальным…» (двойное отрицание). οἶκος μνημείων πατέρων μου — «дом гробниц отцов моих»; ἠρημώθη — «опустел» (ἐρημόω). αἱ πύλαι αὐτῆς κατεβρώθησαν ἐν πυρί — «ворота его съедены огнём» (κατεσθίω)."
  4: "Περὶ τίνος τοῦτο σὺ ζητεῖς — «о чём ты просишь/ищешь?» (ζητέω); слав. «почто о сем ты вопрошаеши?» — спрашивает о причине, ру «чего же ты желаешь?». προσηυξάμην πρὸς τὸν θεὸν τοῦ οὐρανοῦ — «помолился Богу небесному»: краткая молитва перед ответом."
  5: "Εἰ ἐπὶ τὸν βασιλέα ἀγαθόν — «если царю угодно». ἀγαθυνθήσεται ὁ παῖς σου ἐνώπιόν σου — «если раб твой обретёт благоволение в очах твоих» (ἀγαθύνω в страд. — быть угодным). ἀνοικοδομήσω — «отстрою» (ἀνοικοδομέω), слав. «возсозижду»."
  6: "ἡ παλλακὴ ἡ καθημένη ἐχόμενα αὐτοῦ — «наложница, сидевшая подле него» (παλλακή); в масоретском тексте здесь «царица» (ru). Ἕως πότε ἔσται ἡ πορεία σου — «доколе будет путь твой». καὶ ἠγαθύνθη ἐνώπιον τοῦ βασιλέως — «и было угодно царю». ἔδωκα αὐτῷ ὅρον — «я дал ему срок» (ὅρος — предел, срок)."
  7: "ἐπάρχους πέραν τοῦ ποταμοῦ — «начальники заречные» (ἔπαρχος; слав. «воеводы стран за рекою»), т. е. наместники провинции Заречье; 太守. ὥστε παραγαγεῖν με — «чтобы препроводили/пропустили меня» (παράγω — проводить мимо, пропускать). ἕως ἔλθω ἐπὶ Ιουδαν — «доколе не приду в Иудею»."
  8: "Ασαφ φύλακα τοῦ παραδείσου — «Асаф, страж [царского] леса/парка» (παράδεισος здесь — лес, парк; слав. «страж дубравы царевы»). ξύλα στεγάσαι τὰς πύλας — «деревья, чтобы покрыть ворота» (στεγάζω); слав. добавляет «врата столпа дому», чего в греч. нет. εἰς τὸ τεῖχος τῆς πόλεως — «для стены городской». εἰς οἶκον, ὃν εἰσελεύσομαι — «для дома, в который войду». ὡς χεὶρ θεοῦ ἡ ἀγαθή — «как благая рука Бога» (слав. «якоже рука Божия благая»); ср. 2:18."
  9: "ἀρχηγοὺς δυνάμεως καὶ ἱππεῖς — «начальников войска и всадников» (ἀρχηγός — вождь, начальник; слав. «началники силы и конницы»)."
  10: "Σαναβαλλατ ὁ Αρωνι — «Санаваллат Хоронит» (слав. «аронитин»); Τωβια ὁ δοῦλος ὁ Αμμωνι — «Товия, раб Аммонитский» (титул или происхождение; слав. «раб аммонитин»). ἥκει — perfect «пришёл». ζητῆσαι ἀγαθόν — «искать блага». πονηρὸν αὐτοῖς ἐγένετο — «стало им досадно»."
  11: "ἤμην ἐκεῖ ἡμέρας τρεῖς — «был там три дня» (винительный времени)."
  12: "ἀνέστην νυκτός — «встал ночью». ἄνδρες ὀλίγοι — «немногие мужи». τί ὁ θεὸς δίδωσιν εἰς καρδίαν μου — «что Бог влагает в сердце моё». κτῆνος — вьючное/ездовое животное, 獣. εἰ μὴ τὸ κτῆνος, ᾧ ἐγὼ ἐπιβαίνω — «кроме животного, на котором я еду»."
  13: "πύλῃ τοῦ γωληλα — «ворота Долины» (слав. «врата юдоли»). στόμα πηγῆς τῶν συκῶν — «устье источника смоковниц» (слав. «ко устию источника смоковничнаго»; ру «источник Драконов» — иная традиция). πύλη τῆς κοπρίας — Навозные ворота (слав. «врата гнойная»), 肥の門. ἤμην συντρίβων — букв. «я сокрушал», в контексте — «я осматривал/обследовал» (слав. «бых размышляя»); глагол выбран в LXX неточно, но повторяется в ст. 15."
  14: "πύλην τοῦ Αιν — «ворота Источника» (עַיִן — источник; слав. «ко вратом источника»). κολυμβήθραν τοῦ βασιλέως — «царский водоём/купель» (слав. «купель царева»). οὐκ ἦν τόπος τῷ κτήνει παρελθεῖν ὑποκάτω μου — «не было места животному пройти подо мною»."
  15: "χειμάρρους — поток, зимний ручей, 谷川 (слав. «поток»). ἤμην ἀναβαίνων ἐν τῷ τείχει — «я поднимался по стене». ἐπέστρεψα — «повернул назад». Ночной объезд описан кольцом: от западных ворот к югу, затем на восток и обратно."
  16: "οἱ φυλάσσοντες — «стерегущие» (стража). τοῖς ἐντίμοις — «почтенным, знатным» (ἔντιμος); слав. «честным». τοῖς στρατηγοῖς — «военачальникам/правителям» (στρατηγός); слав. «воеводам». τοῖς καταλοίποις τοῖς ποιοῦσιν τὰ ἔργα — «остальным, делающим работы». ἕως τότε — «до того [времени]»."
  17: "ἐν ᾗ ἐσμεν ἐν αὐτῇ — «в которой мы находимся» (плеоназм LXX). ἔρημος — «пуст, разорён». ἐδόθησαν πυρί — «преданы огню». δεῦτε καὶ διοικοδομήσωμεν — «давайте отстроим» (διοικοδομέω). ὄνειδος — поношение, 恥. οὐκ ἐσόμεθα ἔτι ὄνειδος — «не будем более поношением»."
  18: "τὴν χεῖρα τοῦ θεοῦ…ἀγαθήν — «руку Бога благую» (ср. 2:8). ἐκραταιώθησαν αἱ χεῖρες αὐτῶν εἰς ἀγαθόν — «укрепились руки их на доброе» (κραταιόω); слав. «укрепишася руцы их во благое». Слова Неемии «встанем и построим» — внутри его же речи, поэтому в кавычках же."
  19: "Γησαμ ὁ Αραβι — Гешем Аравитянин (слав. «гисам аравитин»). ἐξεγέλασαν — «осмеяли» (ἐκγελάω). ἦ ἐπὶ τὸν βασιλέα…ἀποστατεῖτε — «не против ли царя вы отступаете?» (ἀποστατέω); вопросительная частица ἦ. Слав. добавляет «и уничижиша» (ру «с презрением говорили»)."
  20: "εὐοδώσει ἡμῖν — «дарует успех нам» (εὐοδόω). δοῦλοι αὐτοῦ καθαροί — «рабы Его чистые» (слав. «раби его чистии»). μερὶς καὶ δικαιοσύνη καὶ μνημόσυνον — «часть, правда и память» (слав. «часть и правда и память»): формула отказа в участии; ср. 1 Езд 9:11 и Деян 8:21."
