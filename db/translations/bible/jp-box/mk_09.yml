verses:
  1: "また、イエスは言[い]われた。「<j>はっきり言[い]っておく。ここに立[た]っている者[もの]の中[なか]には、死[し]を味[あじ]わうことなく、神[かみ]の国[くに]が力[ちから]をもって来[く]るのを見[み]る者[もの]がいる。</j>」"
  2: "六日[むいか]の後[のち]、イエスはペトロ、ヤコブ、ヨハネだけを連[つ]れて、ほかの者[もの]たちと離[はな]れて高[たか]い山[やま]へ登[のぼ]られた。そして、彼[かれ]らの前[まえ]で姿[すがた]を変[か]えられた。"
  3: "その衣[ころも]はきわだって白[しろ]く、この世[よ]の布[ぬの]さらしがどんなに白[しろ]くしても及[およ]ばないほど輝[かがや]いていた。"
  4: "エリヤがモーセとともに彼[かれ]らの前[まえ]に現[あらわ]れ、イエスと語[かた]り合[あ]っていた。"
  5: "ペトロがイエスに言[い]った。「ラビ⟨「先生[せんせい]」の意[い]のヘブライ語[ご]の尊称[そんしょう]。⟩、わたしたちがここにいるのは、よいことです。小屋[こや]を三[みっ]つ造[つく]りましょう。一[ひと]つはあなたのため、一[ひと]つはモーセのため、一[ひと]つはエリヤのためです。」"
  6: "どう答[こた]えてよいのか、ペトロには分[わ]からなかった。彼[かれ]らは皆[みな]、恐[おそ]れに捕[と]らわれていたからである。"
  7: "すると、雲[くも]が湧[わ]き起[お]こって彼[かれ]らを覆[おお]い、その雲[くも]の中[なか]から声[こえ]が聞[き]こえた。「これはわたしの愛[あい]する子[こ]。彼[かれ]の言[い]うことを聞[き]きなさい。」"
  8: "ふと見回[みまわ]すと、もはや誰[だれ]の姿[すがた]もなく、ただイエスだけが彼[かれ]らとともにおられた。"
  9: "一同[いちどう]が山[やま]を下[くだ]りながら、イエスは彼[かれ]らに命[めい]じられた。「<j>人[ひと]の子[こ]が死人[しにん]の中[なか]から復活[ふっかつ]するまで、見[み]たことを誰[だれ]にも語[かた]ってはならない。</j>」"
  10: "彼[かれ]らはその言葉[ことば]を胸[むね]に収[おさ]め、「死[し]から復活[ふっかつ]するとは、どういうことか」と互[たが]いに問[と]い合[あ]った。"
  11: "彼[かれ]らはイエスに尋[たず]ねた。「なぜ、律法学者[りっぽうがくしゃ]たちは『エリヤがまず来[く]る』と言[い]っているのですか。」"
  12: "イエスは言[い]われた。「<j>確[たし]かに、エリヤはまず来[き]て、すべてを整[ととの]える。だが、人[ひと]の子[こ]が多[おお]くの苦難[くなん]を受[う]け、軽[かろ]んじられると書[か]かれているのは、なぜか。</j>"
  13: "<j>しかし、言[い]っておく。エリヤはすでに来[き]た。そして人々[ひとびと]は、彼[かれ]について書[か]かれているとおりに、思[おも]いのままのことを彼[かれ]にした。</j>」"
  14: "そこへ行[い]くと、弟子[でし]たちの周[まわ]りに大[おお]きな群衆[ぐんしゅう]が集[あつ]まり、律法学者[りっぽうがくしゃ]たちが彼[かれ]らと問[と]い答[こた]えしていた。"
  15: "群衆[ぐんしゅう]は皆[みな]、イエスを見[み]るとすぐに驚[おどろ]き、駆[か]け寄[よ]って挨拶[あいさつ]した。"
  16: "イエスは、「<j>あなたがたは、彼[かれ]らと何[なに]を論[ろん]じているのか</j>」とお尋[たず]ねになった。"
  17: "群衆[ぐんしゅう]の中[なか]の一人[ひとり]が答[こた]えた。「先生[せんせい]、物[もの]を言[い]えない霊[れい]に憑[つ]かれた息子[むすこ]を、あなたのもとへ連[つ]れて来[き]ました。"
  18: "この霊[れい]が息子[むすこ]を捕[つか]まえると、どこでも地[じ]べたに投[な]げ倒[たお]します。すると、口[くち]から泡[あわ]を吹[ふ]き、歯[は]ぎしりし、体[からだ]をこわばらせてしまいます。お弟子[でし]たちに追[お]い出[だ]していただくよう頼[たの]みましたが、できませんでした。」"
  19: "イエスはお答[こた]えになった。「<j>ああ、なんと不信仰[ふしんこう]な世代[せだい]だ。いつまでわたしはあなたがたのそばにいればよいのか。いつまで、あなたがたを耐[た]え忍[しの]ばねばならないのか。その子[こ]をここへ連[つ]れて来[き]なさい。</j>」"
  20: "人々[ひとびと]はその子[こ]を連[つ]れて来[き]た。霊[れい]はイエスを見[み]るとすぐ、子[こ]どもを引[ひ]きつらせた。子[こ]どもは地[ち]に倒[たお]れ、泡[あわ]を吹[ふ]いて転[ころ]げ回[まわ]った。"
  21: "イエスは父親[ちちおや]に、「<j>いつから、こうなのか</j>」とお尋[たず]ねになった。父親[ちちおや]は言[い]った。「幼[おさな]い時[とき]からです。"
  22: "火[ひ]の中[なか]や水[みず]の中[なか]に投[な]げ込[こ]んで、殺[ころ]そうとしたことも何度[なんど]もありました。もしおできになるなら、わたしたちを憐[あわ]れんで、お助[たす]けください。」"
  23: "イエスは言[い]われた。「<j>『もしおできになるなら』とは。信[しん]じる者[もの]には、どんなことでもできる。</j>」"
  24: "子[こ]どもの父[ちち]は、すぐさま叫[さけ]んだ。「信[しん]じます。この不信仰[ふしんこう]を、どうかお助[たす]けください。」"
  25: "イエスは、群衆[ぐんしゅう]が駆[か]け寄[よ]って来[く]るのをご覧[らん]になり、汚[けが]れた霊[れい]をお叱[しか]りになって言[い]われた。「<j>物[もの]を言[い]えず、耳[みみ]も聞[き]こえぬ霊[れい]よ。わたしが命[めい]じる。この子[こ]から出[で]て行[い]け。二度[にど]と入[はい]ってはならない。</j>」"
  26: "霊[れい]は叫[さけ]び声[ごえ]を上[あ]げ、激[はげ]しく子[こ]どもを引[ひ]きつらせて出[で]て行[い]った。子[こ]どもは死[し]んだ者のようになり、多[おお]くの人[ひと]が「死[し]んでしまった」と言[い]うほどだった。"
  27: "イエスはその手[て]を取[と]って起[おこ]された。すると、子[こ]どもは立[た]ち上[あ]がった。"
  28: "イエスが家[いえ]に入[はい]られると、弟子[でし]たちは人[ひと]目[め]を避[さ]けて尋[たず]ねた。「なぜ、わたしたちにはこの霊[れい]を追[お]い出[だ]せなかったのでしょうか。」"
  29: "イエスは言[い]われた。「<j>この種[しゅ]の霊[れい]は、祈[いの]りと〔断食[だんじつ]〕によらなければ、出[で]て行[い]かない。</j>」"
  30: "一行[いっこう]はそこを発[た]って、ガリラヤを通[とお]られた。イエスは、それを誰[だれ]にも知[し]らせたくなかった。"
  31: "イエスは弟子[でし]たちに教[おし]えながら、こう言[い]われた。「<j>人[ひと]の子[こ]は人々[ひとびと]の手[て]に渡[わた]され、殺[ころ]される。しかし、殺[ころ]されて三日[みっか]の後[のち]に復活[ふっかつ]する。</j>」"
  32: "弟子[でし]たちにはその言葉[ことば]が分[わ]からず、イエスに尋[たず]ねるのも恐[こわ]かった。"
  33: "一行[いっこう]はカファルナウムに着[つ]いた。家[いえ]に入[はい]られると、イエスは弟子[でし]たちに、「<j>道[みち]で何[なに]を話[はな]し合[あ]っていたのか</j>」とお尋[たず]ねになった。"
  34: "彼[かれ]らは黙[だま]り込[こ]んだ。道[みち]で、誰[だれ]が一番[いちばん]偉[えら]いかと論[ろん]じていたからである。"
  35: "イエスは座[すわ]って十二人[じゅうににん]を呼[よ]ばれ、言[い]われた。「<j>誰[だれ]でも先[さき]になりたいと思[おも]っている者[もの]は、すべての者[もの]の末[すえ]となり、すべての者[もの]に仕[つか]える者[もの]になる。</j>」"
  36: "イエスは子[こ]どもを一人[ひとり]取[と]って、彼[かれ]らの真[ま]ん中[なか]に立[た]たせ、その子[こ]を抱[だ]き寄[よ]せて言[い]われた。「"
  37: "<j>このような子[こ]どもを一人[ひとり]でも、わたしの名[な]のゆえに受[う]け入[い]れる者[もの]は、わたしを受[う]け入[い]れるのである。わたしを受[う]け入[い]れる者[もの]は、わたしではなく、わたしを遣[つか]わした方[かた]を受[う]け入[い]れるのである。</j>」"
  38: "ヨハネが言[い]った。「先生[せんせい]、わたしたちは、あなたの名[な]によって悪霊[あくりょう]を追[お]い出[だ]している人[ひと]を見[み]かけました。でも、その人[ひと]はわたしたちに従[したが]っていないので、止[と]めさせました。」"
  39: "イエスは言[い]われた。「<j>止[と]めてはならない。わたしの名[な]で奇跡[きせき]を行[おこな]った者[もの]が、すぐにわたしを悪[わる]く言[い]うことはできない。</j>"
  40: "<j>わたしたちに反[はん]しない者[もの]は、わたしたちの味方[みかた]である。</j>"
  41: "<j>あなたがたがキリストに属[ぞく]する者[もの]だからというだけで、水[みず]を一杯[いっぱい]飲[の]ませてくれる者[もの]は、はっきり言[い]っておくが、決[けっ]してその報[むく]いを失[うしな]わない。</j>"
  42: "<j>〔わたしを〕信[しん]じるこの小[ちい]さな者[もの]たちの一人[ひとり]でも、つまずかせる者[もの]は、大[おお]きな石臼[いしうす]を首[くび]に巻[ま]きつけられて海[うみ]に投[な]げ込[こ]まれるほうが、その人[ひと]にはよい。</j>"
  43: "<j>もし片手[かたて]があなたをつまずかせるなら、それを切[き]り落[お]としなさい。両手[りょうて]そろえて地獄[じごく]の消[き]えない火[ひ]に落[お]ちるより、片手[かたて]のまま命[いのち]に入[はい]るほうがよい。</j>"
  44: "〔<j>そこでは、彼[かれ]らを食[く]らう虫[むし]も死[し]なず、火[ひ]も消[き]えない。</j>〕"
  45: "<j>もし足[あし]があなたをつまずかせるなら、それを切[き]り落[お]としなさい。両足[りょうあし]そろえて地獄[じごく]〔の消[き]えない火[ひ]〕に投[な]げ込[こ]まれるより、足[あし]の不自由[ふじゆう]なまま命[いのち]に入[はい]るほうがよい。</j>"
  46: "〔<j>そこでは、彼[かれ]らを食[く]らう虫[むし]も死[し]なず、火[ひ]も消[き]えない。</j>〕"
  47: "<j>もし目[め]があなたをつまずかせるなら、それを抜[ぬ]き出[だ]しなさい。両目[りょうめ]そろえて〔火[ひ]の〕地獄[じごく]に投[な]げ込[こ]まれるより、片目[かため]のまま神[かみ]の国[くに]に入[はい]るほうがよい。</j>"
  48: "<j>そこでは、彼[かれ]らを食[く]らう虫[むし]も死[し]なず、火[ひ]も消[き]えない。</j>"
  49: "<j>すべての人[ひと]は火[ひ]によって塩[しお]をまぶされる。〔すべてのいけにえも、塩[しお]をまぶされる。〕</j>"
  50: "<j>塩[しお]はよいものである。だが、塩[しお]が塩気[しおけ]を失[うしな]ったら、何[なに]でその味[あじ]をつけるのか。あなたがたの内[うち]に塩[しお]を持[ち]、互[たが]いに平和[へいわ]に暮[く]らしなさい。</j>」"

notes:
  2: "κατ᾽ ἰδίαν μόνους — «отдельно, одних»; ほかの者たちと離れて高い山へ, с сохранением «только их». У jp-joc 獨彼等のみを率ゐて."
  3: "γναφεύς — валяльщик, белильщик сукна; 布さらし."
  7: "Слова Отца — не красные, по правилу книги (красное только у Христа)."
  12: "ἀποκαθιστάνει πάντα — «восстанавливает всё»; すべてを整える, как у jp-joc 萬事を整ふ, без сглаживания в «всё вернёт на место»."
  29: "В критической базе только ἐν προσευχῇ; Церковь (TR, jp-joc 祈禱と齋と) читает καὶ νηστείᾳ — добавление в 〔断食〕."
  42: "εἰς ἐμέ в критической базе под скобками; Церковь читает — 〔わたしを〕."
  43: "εἰς τὸ πῦρ τὸ ἄσβεστον есть в критической базе — 〔〕 не ставлю; в 45-м этого добавления нет (см. ниже)."
  44: "Стиха нет в критическом издании (повтор 9:48); Церковь читает — весь стих в 〔…〕."
  45: "Церковь (TR, jp-joc 滅えざる火) добавляет καὶ εἰς τὸ πῦρ τὸ ἄσβεστον; в критической базе только εἰς τὴν γέενναν — 〔の消えない火〕."
  46: "Стиха нет в критическом издании (повтор 9:48); Церковь читает — весь стих в 〔…〕."
  47: "Церковь читает γέενναν τοῦ πυρός (jp-joc 火の地獄); в критической базе только τὴν γέενναν — 〔火の〕."
  49: "Церковь (TR, jp-joc 凡の祭物は鹽を以て鹽せられん) добавляет καὶ πᾶσα θυσία ἁλὶ ἁλισθήσεται — в 〔…〕."
  50: "εἰρηνεύετε ἐν ἀλλήλοις — «будьте в мире друг с другом»; 平和に暮らしなさい."
