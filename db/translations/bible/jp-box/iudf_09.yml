verses:
  1: "ユディトは顔[かお]を地[ち]につけ、頭[あたま]に灰[はい]を載[の]せ、身[み]に着[き]ていた粗布[あらぬの]を脱[ぬ]いだ。ちょうどそのとき、エルサレムの主[しゅ]の家[いえ]では、その夕[ゆう]べの香[こう]がささげられていた。ユディトは大声[おおごえ]で主[しゅ]に叫[さけ]んで言[い]った。"
  2: "「主[しゅ]よ、わたしの父[ちち]シメオンの神[かみ]よ。あなたは異邦[いほう]の者[もの]たちへの復讐[ふくしゅう]のために、彼[かれ]の手[て]に剣[つるぎ]を与[あた]えられた。彼らは処女[しょじょ]の胎[たい]を汚[けが]し、恥[はじ]のために腿[もも]をさらし、そしりのために胎[たい]を汚[けが]した。あなたは『そうはならない』と言[い]われたが、彼らはしてしまった。"
  3: "それゆえ、あなたは彼らの支配者[しはいしゃ]たちを殺[ころ]されるために引[ひ]き渡[わた]し、彼らの寝床[ねどこ]を血[ち]に変[か]えられた。その寝床は彼らの欺[あざむ]きを恥[はじ]としたが、欺[だま]されて血[ち]となった。あなたは奴隷[どれい]を主人[しゅじん]たちの上[うえ]に、主人[しゅじん]たちをその王座[おうざ]の上[うえ]に撃[う]たれた。"
  4: "あなたは彼らの妻[つま]たちを略奪[りゃくだつ]に、娘[むすめ]たちを捕囚[ほしゅう]に、彼らのすべての戦利品[せんりひん]を、あなたに愛[あい]された子[こ]らへの分[わ]け前[まえ]に与[あた]えられた。彼らはあなたの熱心[ねっしん]をもって熱心[ねっしん]となり、自分[じぶん]たちの血[ち]の汚[けが]れを忌[い]み嫌[きら]い、あなたを助[たす]け手[て]として呼[よ]び求[もと]めた。わたしの神[かみ]、わたしの神よ、やもめであるわたしの願[ねが]いを聞[き]き入[い]れてください。"
  5: "あなたは彼らに先立[さきだ]つことをも、それらをも、その後[のち]のことをも行[おこな]い、今[いま]のことも、来[きた]るべきことも思[おも]い図[はか]られた。そして、あなたが思[おも]い図[はか]られたことは実現[じつげん]した。"
  6: "あなたが定[さだ]められたことは現[あらわ]れて、『見[み]よ、わたしたちはここにいる』と言[い]った。あなたの道[みち]はすべて備[そな]わっており、あなたの裁[さば]きは予知[よち]のうちにあるからである。"
  7: "見[み]よ、アッシリア人[じん]はその力[ちから]を増[ま]し、馬[うま]と騎手[きしゅ]によって高[たか]くされ、徒歩[かち]の兵[へい]の腕[うで]によって誇[ほこ]り、盾[たて]と槍[やり]と弓[ゆみ]と石[いし]つぶてに望[のぞ]みを置[お]いた。しかし彼らは、あなたが戦[いくさ]を砕[くだ]く主[しゅ]であることを知[し]らなかった。"
  8: "主[しゅ]よ、あなたの名[な]は主[しゅ]である。あなたの力[ちから]によって彼らの強[つよ]さを打[う]ち砕[くだ]き、あなたの怒[いか]りによって彼らの支配[しはい]を打[う]ち倒[たお]してください。彼らはあなたの聖[せい]なるもの[もの]を冒涜[ぼうとく]し、あなたの栄光[えいこう]の名[な]の安[やす]らぎの住[す]まいを汚[けが]し、あなたの祭壇[さいだん]の角[つの]を鉄[てつ]で倒[たお]そうと企[くわだ]てたからである。"
  9: "彼らの傲慢[ごうまん]に目[め]を注[そそ]ぎ、あなたの怒[いか]りを彼らの頭[あたま]の上[うえ]に送[おく]り、わたしが思[おも]い図[はか]った力[ちから]を、やもめであるわたしの手[て]に与[あた]えてください。"
  10: "わたしの欺[あざむ]きの唇[くちびる]によって、奴隷[どれい]を支配者[しはいしゃ]の上[うえ]に、支配者[しはいしゃ]をその僕[しもべ]の上[うえ]に撃[う]ってください。彼らの力[ちから]を女[おんな]の手[て]で砕[くだ]いてください。"
  11: "あなたの力[ちから]は多[おお]くの者のうちにあるのではなく、あなたの支配[しはい]も強[つよ]い者[もの]たちのうちにあるのではない。あなたはへりくだる者[もの]の神[かみ]、小[ちい]さくされた者[もの]の助[たす]け手[て]、弱[よわ]い者[もの]の支[ささ]え手[て]、絶望[ぜつぼう]した者[もの]の覆[おお]い手[て]、望[のぞ]みを失[うしな]った者[もの]の救[すく]い主[ぬし]である。"
  12: "そのとおり、そのとおり。わたしの父[ちち]の神[かみ]、イスラエルの嗣業[しぎょう]の神[かみ]、天[てん]と地[ち]の主[しゅ]よ、水[みず]の造[つく]り主[ぬし]よ、あなたが造[つく]られたすべてのもの[もの]の王[おう]よ。あなたこそ、わたしの願[ねが]いを聞[き]き入[い]れてください。"
  13: "わたしの言葉[ことば]と欺[あざむ]きを、彼らへの傷[きず]と打[う]ち身[み]としてください。彼らはあなたの契約[けいやく]と、あなたの聖[せい]別[べつ]された家[いえ]、シオンの頂[いただき]、あなたの子[こ]らが受[う]け継[つ]ぐ家[いえ]に逆[さか]らって、かたくななことを企[くわだ]てたからである。"
  14: "あなたのすべての国民[こくみん]とすべての部族[ぶぞく]の上[うえ]に、あなたこそ神[かみ]、すべての力[ちから]と支配[しはい]の神[かみ]であり、イスラエルの民[たみ]を守[まも]る者[もの]はあなたのほかにいない、ということを知[し]るための認識[にんしき]を生[しょう]じさせてください。」"

notes:
  1: "θυμίαμα τῆς ἑσπέρας — «вечернее каждение» (θυμίαμα — фимиам, 香), в тексте 夕べの香. ἐγύμνωσεν ὃν ἐνεδεδύκει σάκκον — «обнажила [сняла] вретище, в которое была одета» (γυμνόω, ἐνδύω): она снимает одежду покаяния, чтобы предстать пред Богом. Слав. читает «в дому Господни» вместо гр. εἰς τὸν οἶκον τοῦ θεοῦ («в дом Бога»); по паритету в тексте церковное 主の家, вариант LXX — в notes. ἦν ἄρτι προσφερόμενον — «как раз приносилось» (ἄρτι — только что, в этот час; προσφέρω)."
  2: "ᾧ ἔδωκας ἐν χειρὶ ῥομφαίαν εἰς ἐκδίκησιν ἀλλογενῶν — «которому Ты дал в руку меч на отмщение иноплеменных» (ῥομφαία — 剣, ἀλλογενής — чужеземец); речь о Симеоне и мщении за Дину, ср. Быт 34. οἳ ἔλυσαν μήτραν παρθένου εἰς μίασμα — «которые растлили ложесна девы в осквернение» (λύω — разрешать, растлевать; μίασμα — скверна): передано буквально, без сглаживания. ἐγύμνωσαν μηρὸν εἰς αἰσχύνην — «обнажили бедро в срам» (μηρός — бедро, 腿); ἐβεβήλωσαν μήτραν εἰς ὄνειδος — «осквернили ложесна в поношение» (βεβηλόω). εἶπας γάρ Οὐχ οὕτως ἔσται, καὶ ἐποίησαν — «ибо Ты сказал: да не будет так; а они сделали»; слав. относит эту фразу к ст. 3, держимся деления gr."
  3: "ἀνθ᾿ ὧν — «за то» (ἀντί с род. в причинном значении). ἔδωκας ἄρχοντας αὐτῶν εἰς φόνον — «предал князей их на убиение» (φόνος — убийство). τὴν στρωμνὴν αὐτῶν, ἣ ᾐδέσατο τὴν ἀπάτην αὐτῶν, ἀπατηθεῖσαν εἰς αἷμα — тёмное место: «постель их, которая устыдилась обмана их, [будучи] обманута, — в кровь» (στρωμνή — ложе, αἰδέομαι — стыдиться; слав. «яже ведяше прельщение их» — иное понимание). ἐπάταξας δούλους ἐπὶ δυνάσταις καὶ δυνάστας ἐπὶ θρόνους αὐτῶν — «поразил рабов над владыками и владык на престолах их» (δυνάστης — властелин); порядок сохранён."
  4: "εἰς προνομήν — «в расхищение» (προνομή — добыча, грабёж). εἰς διαίρεσιν υἱῶν ἠγαπημένων ὑπὸ σοῦ — «в раздел сынам, возлюбленным Тобою» (διαίρεσις — раздел добычи). ἐζήλωσαν τὸν ζῆλόν σου — «возревновали ревностью Твоею»: винительный внутреннего содержания, передан 熱心をもって熱心となる. ἐβδελύξαντο μίασμα αἵματος αὐτῶν — «возгнушались скверной крови своей» (βδελύσσομαι). εἰσάκουσον ἐμοῦ τῆς χήρας — «услышь меня, вдову» (χήρα — やもめ)."
  5: "τὰ πρότερα ἐκείνων — «прежнее, бывшее до них» (πρότερος). τὰ μετέπειτα — «последующее» (μετέπειτα). διενοήθης — «Ты замыслил» (διανοέομαι); ἐγενήθησαν ἃ ἐνενοήθης — «произошло то, что Ты помыслил» (ἐννοέομαι). Слав. «проразумел еси» передаёт предвидение; в тексте сохранён ряд «и то, и последующее, и нынешнее, и грядущее»."
  6: "παρέστησαν ἃ ἐβουλεύσω — «предстали [явились] то, что Ты определил» (παρίστημι, βουλεύομαι). εἶπαν Ἰδοὺ πάρεσμεν — «сказали: вот, мы здесь» (πάρειμι): вложенная речь внутри молитвы, поэтому 『…』. πᾶσαι αἱ ὁδοί σου ἕτοιμοι — «все пути Твои готовы». ἡ κρίσις σου ἐν προγνώσει — «суд Твой в предвидении» (πρόγνωσις — 予知): мысль о том, что суд Божий основан на предведении."
  7: "ἐπληθύνθησαν ἐν δυνάμει αὐτῶν — «умножились в силе своей» (πληθύνω). ὑψώθησαν ἐφ᾿ ἵππῳ καὶ ἀναβάτῃ — «вознеслись на коне и всаднике» (ἀναβάτης — всадник). ἐγαυρίασαν ἐν βραχίονι πεζῶν — «возвеличались мышцею пеших» (γαυριάω — хвалиться; βραχίων — мышца, сила; πεζός — пеший). ἀσπίς — 盾, γαῖσος — тяжёлое копьё (слав. «копие», 槍), σφενδόνη — праща. συντρίβων πολέμους — «сокрушающий брани» (συντρίβω)."
  8: "κύριος ὄνομά σοι — «Господь имя Тебе»: исповедание имени в начале прошения. ῥάξον … κάταξον — импер. аор. от ῥήγνυμι («разбей») и κατάγνυμι («сокруши, низложи»). τὸ σκήνωμα τῆς καταπαύσεως — «селение упокоения» (σκήνωμα — жилище, скиния; κατάπαυσις — покой): храм как место покоя имени Божия. κέρας θυσιαστηρίου — «рог жертвенника» (κέρας), слав. «рог олтаря»; образ силы и неприкосновенности (ср. 3 Цар 1:50)."
  9: "βλέψον εἰς ὑπερηφανίαν αὐτῶν — «воззри на гордость их» (ὑπερηφανία). δὸς ἐν χειρί μου τῆς χήρας … κράτος — «дай в руку мою, вдовы, силу» (κράτος — крепость, держава); слав. «даждь в руку мою вдовию… крепость» передаёт иначе, в тексте по гр. ὃ διενοήθην — «которую я замыслила» (относительное ср. рода относится к κράτος)."
  10: "πάταξον δοῦλον ἐκ χειλέων ἀπάτης μου ἐπ᾿ ἄρχοντι — «порази раба устами обмана моего — [о] начальнике»: орудие — её лукавые слова (χεῖλος — губы, ἀπάτη — обман). θραῦσον αὐτῶν τὸ ἀνάστεμα ἐν χειρὶ θηλείας — «сокруши их силу [высоту] рукою женскою»: ἀνάστεμα — «высота, надменность» (слав. «гордыню»), в тексте 力 по решению; θῆλυς — женский. Двойное ἐπί («на») сохранено: раб — на князя, князь — на раба."
  11: "οὐ γὰρ ἐν πλήθει τὸ κράτος σου — «не во множестве сила Твоя» (πλῆθος — множество). οὐδὲ ἡ δυναστεία σου ἐν ἰσχύουσιν — «и не в сильных держава Твоя» (δυναστεία, ἰσχύων — сильный). ταπεινῶν … ἐλαττόνων … ἀντιλήμπτωρ ἀσθενούντων … ἀπεγνωσμένων σκεπαστής … ἀπηλπισμένων σωτήρ — пять определений: смиренных, малых, немощных, отчаявшихся, безнадёжных (ἀντιλήμπτωρ — заступник, σκεπαστής — покровитель, σωτήρ — спаситель)."
  12: "ναὶ ναὶ — «да, да», усиленное подтверждение (слав. «ей, ей»). θεὸς κληρονομίας Ισραηλ — «Бог наследия Израилева» (κληρονομία — 嗣業). δέσποτα τῶν οὐρανῶν καὶ τῆς γῆς — «Владыка небес и земли» (δεσπότης). κτίστα τῶν ὑδάτων — «Творец вод» (κτίστης). βασιλεῦ πάσης κτίσεώς σου — «Царь всего создания Твоего» (κτίσις). εἰσάκουσον τῆς δεήσεώς μου — «услышь моление моё» (δέησις)."
  13: "δὸς λόγον μου καὶ ἀπάτην εἰς τραῦμα καὶ μώλωπα αὐτῶν — «дай слово моё и обман мой в язву и рану им» (τραῦμα — рана, μώλωψ — рубец от удара): её слово становится оружием. οἳ κατὰ τῆς διαθήκης σου … ἐβουλεύσαντο σκληρά — «которые против завета Твоего… замыслили жестокое» (σκληρός — жёсткий, жестокий). κορυφὴ Σιων — «вершина Сиона»; οἶκος κατασχέσεως υἱῶν σου — «дом владения сынов Твоих» (κατάσχεσις — владение)."
  14: "ποίησον ἐπὶ παντὸς ἔθνους σου … ἐπίγνωσιν — «сотвори над всем народом Твоим… познание» (ἐπίγνωσις — познание, признание). τοῦ εἰδῆσαι — «чтобы знать» (цель). ὁ θεὸς θεὸς πάσης δυνάμεως καὶ κράτους — «Бог Бог всякой силы и державы»: повтор θεός передан дважды (神、…の神). ὑπερασπίζων τοῦ γένους Ισραηλ — «защитник рода Израилева» (ὑπερασπίζω); εἰ μὴ σύ — «кроме Тебя»."
