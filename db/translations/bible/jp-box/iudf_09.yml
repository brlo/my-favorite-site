# Глава 9: молитва Иудифи. 1 — она падает ниц, посыпает голову пеплом, снимает
# вретище; в час вечернего каждения взывает к Господу. 2–4 — Симеон и мщение за Дину
# (Быт 34); 5–6 — Бог, творящий бывшее и будущее; 7–8 — гордость ассирийцев;
# 9–11 — просьба о силе; 12–14 — славословие и просьба. Прямая речь 2–14 — одна
