verses:
  0: "合唱[がっしょう]の長[ちょう]に歌[うた]わせる。主[しゅ]の僕[しもべ]ダビデの詩[うた]。"
  1: "悪[わる]い者[もの]は、自分[じぶん]の内[うち]で罪[つみ]を犯[おか]そうと言[い]う。その目[め]の前[まえ]に、神[かみ]を恐[おそ]れる恐[おそ]れはない。"
  2: "彼[かれ]は自分[じぶん]の目[め]の前[まえ]で自[みずか]らを欺[あざむ]き、自分[じぶん]の不[ふ]法[ほう]を見[み]つけて憎[にく]むことをしない。"
  3: "その口[くち]の言葉[ことば]は不[ふ]法[ほう]と欺[あざむ]き。彼[かれ]は悟[さと]って善[ぜん]を行[おこな]おうとしなかった。"
  4: "彼[かれ]は床[とこ]の上[うえ]で不[ふ]法[ほう]を企[くわだ]て、善[よ]くない道[みち]には必[かなら]ず立[た]ち、悪[あく]を憎[にく]まない。"
  5: "主[しゅ]よ、あなたのあわれみは天[てん]にあり、あなたの真実[しんじつ]は雲[くも]にまで及[およ]ぶ。"
  6: "あなたの義[ぎ]は神[かみ]の山[やま]のようであり、あなたの裁[さば]きは深[ふか]い淵[ふち]のようである。主[しゅ]よ、あなたは人[ひと]も家畜[かちく]も救[すく]われる。"
  7: "神[かみ]よ、あなたはなんと豊[ゆた]かに、あわれみを注[そそ]がれることか。人[ひと]の子[こ]らは、あなたの翼[つばさ]の陰[かげ]に寄[よ]り頼[たの]む。"
  8: "彼[かれ]らはあなたの家[いえ]の豊[ゆた]かさに酔[よ]いしれ、あなたは楽[たの]しみの流[なが]れで彼[かれ]らを潤[うるお]す。"
  9: "命[いのち]の泉[いずみ]はあなたのもとにあり、あなたの光[ひかり]によって、わたしたちは光[ひかり]を見[み]る。"
  10: "あなたを知[し]る者[もの]に、あなたのあわれみを広[ひろ]げてください。心[こころ]の直[す]ぐな者[もの]に、あなたの義[ぎ]を。"
  11: "高[たか]ぶる者[もの]の足[あし]がわたしに及[およ]ばず、罪[つみ]人[びと]の手[て]がわたしを揺[ゆ]るがさないように。"
  12: "そこでは、不[ふ]法[ほう]を行[おこな]う者[もの]たちが倒[たお]れた。彼[かれ]らは追[お]い払[はら]われ、立[た]つことができない。"

notes:
  0: "Εἰς τὸ τέλος· τῷ δούλῳ κυρίου τῷ Δαυιδ — 合唱の長に歌わせる、主の僕ダビデの詩. εἰς τὸ τέλος букв. «в конец»; церковное понимание — «начальнику хора» (Синодальный; jp-joc 伶長に歌はしむ). 合唱の長 поставлено вместо 伶長 (伶 вне 常用漢字). τῷ δούλῳ κυρίου — 主の僕 (δοῦλος «раб, слуга»). Надписание — стих 0, скобками не маркируется."
  1: "Φησὶν ὁ παράνομος τοῦ ἁμαρτάνειν ἐν ἑαυτῷ — 悪い者は自分の内で罪を犯そうと言う (φησί «говорит»; τοῦ ἁμαρτάνειν — род. цели, «чтобы грешить»; ἐν ἑαυτῷ «в себе»). οὐκ ἔστιν φόβος θεοῦ ἀπέναντι τῶν ὀφθαλμῶν αὐτοῦ — в его глазах нет страха Божия (ἀπέναντι «напротив, перед»). Косвенная речь, кавычек нет."
  2: "ὅτι ἐδόλωσεν ἐνώπιον αὐτοῦ — ибо он лукавил перед собою (δολόω «обманывать, льстить»). τοῦ εὑρεῖν τὴν ἀνομίαν αὐτοῦ καὶ μισῆσαι — чтобы найти беззаконие своё и возненавидеть; смысл: самообольщение мешает ему увидеть и возненавидеть грех. 不[ふ]法[ほう] — ἀνομία, как по корпусу."
  3: "τὰ ῥήματα τοῦ στόματος αὐτοῦ ἀνομία καὶ δόλος — слова уст его — беззаконие и обман (ῥῆμα «слово, изречение»). οὐκ ἐβουλήθη συνιέναι τοῦ ἀγαθῦναι — не захотел уразуметь, чтобы делать добро (συνίημι «понимать»; ἀγαθύνω «делать добро»)."
  4: "ἀνομίαν διελογίσατο ἐπὶ τῆς κοίτης αὐτοῦ — беззаконие замыслил на постели своей (διαλογίζομαι «обдумывать, замышлять»; κοίτη «ложе»). παρέστη πάσῃ ὁδῷ οὐκ ἀγαθῇ — стал на всяком пути недобром. τῇ δὲ κακίᾳ οὐ προσώχθισεν — и злом не возгнушался (προσοχθίζω «гневаться, гнушаться»)."
  5: "κύριε, ἐν τῷ οὐρανῷ τὸ ἔλεός σου — Господи, на небе милость Твоя. ἡ ἀλήθειά σου ἕως τῶν νεφελῶν — истина Твоя до облаков (ἀλήθεια — 真実[しんじつ], как в корпусе; νεφέλη «облако»)."
  6: "ἡ δικαιοσύνη σου ὡσεὶ ὄρη θεοῦ — правда Твоя как горы Божии (ὄρη θεοῦ — высокие горы, ср. Синодальный «горы Божии»). τὰ κρίματά σου ἄβυσσος πολλή — суды Твои — бездна великая (κρίμα — 裁き; ἄβυσσος — 深い淵[ふち]). ἀνθρώπους καὶ κτήνη σώσεις — человеков и скотов спасаешь (κτῆνος «скот, домашнее животное»)."
  7: "ὡς ἐπλήθυνας τὸ ἔλεός σου, ὁ θεός — как умножил Ты милость Твою, Боже. οἱ υἱοὶ τῶν ἀνθρώπων — 人の子ら. ἐν σκέπῃ τῶν πτερύγων σου ἐλπιοῦσιν — в тени крыл Твоих будут уповать (σκέπη «кров, сень»; πτέρυξ «крыло»)."
  8: "μεθυσθήσονται ἀπὸ πιότητος τοῦ οἴκου σου — насытятся от тука дома Твоего (μεθύσκω «напоять допьяна»; πιότης «тук, изобилие»). τὸν χειμάρρουν τῆς τρυφῆς σου ποτιεῖς αὐτούς — потоком сладости Твоей напоишь их (χείμαρρος «поток»; τρυφή «наслаждение»; ποτίζω «поить»)."
  9: "ὅτι παρὰ σοὶ πηγὴ ζωῆς — ибо у Тебя источник жизни (πηγή «источник»). ἐν τῷ φωτί σου ὀψόμεθα φῶς — во свете Твоём узрим свет; повтор 光[ひかり] сохранён."
  10: "παράτεινον τὸ ἔλεός σου τοῖς γινώσκουσίν σε — простри милость Твою на знающих Тебя (παρατείνω «простирать»). καὶ τὴν δικαιοσύνην σου τοῖς εὐθέσι τῇ καρδίᾳ — и правду Твою на правых сердцем (εὐθύς «прямой, правый»); по-японски сказуемое не повторено, как и в греч. эллипсис."
  11: "μὴ ἐλθέτω μοι ποὺς ὑπερηφανίας — да не придёт мне нога гордыни (ὑπερηφανία «гордость, надменность»). καὶ χεὶρ ἁμαρτωλῶν μὴ σαλεύσαι με — и рука грешников да не поколеблет меня (σαλεύω «колебать, потрясать»)."
  12: "ἐκεῖ ἔπεσον οἱ ἐργαζόμενοι τὴν ἀνομίαν — там пали делающие беззаконие (ἐργάζομαι «делать, совершать»). ἐξώσθησαν καὶ οὐ μὴ δύνωνται στῆναι — изринуты и не смогут встать (ἐξωθέω «выталкивать, изгонять»; οὐ μή — решительное отрицание)."
