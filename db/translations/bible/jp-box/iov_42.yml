verses:
  1: "ヨブは主[しゅ]に答[こた]えて言[い]った。"
  2: "「あなたはすべてのことをなし得[え]ることを、わたしは知[し]っている。あなたにできないことは何[なに]もない。"
  3: "『だれが、あなたから計画[けいかく]を隠[かく]し、言葉[ことば]を惜[お]しんで、あなたからも隠[かく]せると考[かんが]えるのか。』だれが、わたしが知[し]らなかった大[おお]いなる驚[おどろ]くべきことを、わたしに告[つ]げるのか。"
  4: "主[しゅ]よ、わたしが語[かた]るために、聞[き]いてください。わたしはあなたに問[と]う。あなたはわたしに教[おし]えてください。"
  5: "以前[いぜん]は、わたしはあなたについての話[はなし]を耳[みみ]で聞[き]いていた。しかし今[いま]は、わたしの目[め]があなたを見[み]た。"
  6: "それゆえ、わたしは自分[じぶん]を軽[かろ]んじ、溶[と]け消[き]えた。わたしは自分を土[つち]と灰[はい]だと思っている。」"
  7: "主[しゅ]がこれらのすべての言葉[ことば]をヨブに語[かた]り終[お]えられた後[のち]、主はテマン人[じん]エリファズに言[い]われた。「あなたは罪[つみ]を犯[おか]した。あなたの二人[ふたり]の友[とも]もそうだ。あなたがたは、わたしの僕[しもべ]ヨブのように、わたしの前[まえ]で真実[しんじつ]を何[なに]も語[かた]らなかったからである。"
  8: "今[いま]、七頭[ななとう]の雄[お]の子牛[こうし]と七頭[ななとう]の雄羊[おひつじ]を取[と]り、わたしの僕[しもべ]ヨブのもとへ行[い]け。彼があなたがたのためにいけにえをささげる。わたしの僕ヨブがあなたがたのために祈[いの]る。わたしはただ彼[かれ]の顔[かお]を受[う]け入[い]れるからである。もし彼のゆえでなければ、わたしはあなたがたを滅[ほろ]ぼしていたであろう。あなたがたは、わたしの僕ヨブに対して真実[しんじつ]を語[かた]らなかったからである。」"
  9: "テマン人[じん]エリファズ、シュヒ人[じん]ビルダド、ミナ人[じん]ゾファルは行[い]って、主[しゅ]が彼[かれ]らに命[めい]じたとおりに行った。主はヨブのゆえに、彼らの罪[つみ]を赦[ゆる]された。"
  10: "主[しゅ]はヨブを大[おお]きくされた。ヨブが友[とも]たちのためにも祈[いの]ったとき、主は彼らの罪[つみ]を赦[ゆる]された。主はヨブに、以前[いぜん]持[も]っていたものの二倍[にばい]を与[あた]え、すべてを倍[ばい]にされた。"
  11: "ヨブの兄弟[きょうだい]たち、姉妹[しまい]たちはみな、彼[かれ]に起[お]こったすべてのことを聞[き]いて、彼のもとに来[き]た。以前[いぜん]から彼を知[し]っていた者[もの]もみな来た。彼らはヨブの家[いえ]で食[た]べ飲[の]みして彼を慰[なぐさ]め、神[かみ]が彼の上[うえ]に下[くだ]したすべてのことに驚[おどろ]いた。そして、それぞれ一頭[いっとう]の小羊[こひつじ]と、刻印[こくいん]された金[きん]の四[よ]ドラクメを彼に与[あた]えた。"
  12: "主[しゅ]はヨブの終[お]わりを、初[はじ]めよりも祝福[しゅくふく]された。彼の家畜[かちく]は、羊[ひつじ]一万四千頭[いちまんよんせんとう]、らくだ六千頭[ろくせんとう]、牛[うし]のつがい千組[せんくみ]、雌[めす]ろば千頭[せんとう]であった。"
  13: "彼には七人[しちにん]の息子[むすこ]と三人[さんにん]の娘[むすめ]が生[う]まれた。"
  14: "彼は最初[さいしょ]の娘[むすめ]をヘメラ、二番目[にばんめ]をカシア、三番目[さんばんめ]をアマルテイアの角[つの]と名[な]づけた。"
  15: "天[てん]の下[した]に、ヨブの娘[むすめ]たちに匹敵[ひってき]する美[うつく]しい者[もの]は見[み]つからなかった。父[ちち]は彼女[かのじょ]たちに、兄弟[きょうだい]たちの間[あいだ]で嗣業[しぎょう]を与[あた]えた。"
  16: "ヨブは災[わざわ]いの後[のち]、百七十年[ひゃくななじゅうねん]生[い]きた。生涯[しょうがい]は全部[ぜんぶ]で二百四十八年[にひゃくよんじゅうはちねん]であった。ヨブは自分[じぶん]の息子[むすこ]たちと、その子[こ]らの子ら、四代目[よんだいめ]までを見[み]た。"
  17: "ヨブは老[お]いて、日[ひ]に満[み]ちて死[し]んだ。書[か]かれていることには、彼は主[しゅ]がよみがえらせる者[もの]たちとともに、再[ふたた]びよみがえる。彼については、シリアの書[しょ]にこう解[と]き明[あ]かされている。すなわち、彼はアウシティスの地[ち]、エドムとアラビアの境[さかい]に住[す]んでいた。以前[いぜん]は、彼の名[な]はヨバブであった。彼はアラビア人[じん]の妻[つま]をめとって、子[こ]をもうけた。その名[な]はエノンといった。彼の父[ちち]はザレであり、彼はエサウの子[こ]らの中[なか]の子[こ]であった。母[はは]はボソラであった。こうして、彼はアブラハムから五番目[ごばんめ]であった。エドムで王[おう]として治[おさ]めた王たちは、次[つぎ]のとおりである。彼もまた、その地[ち]を治めていた。最初[さいしょ]はバラク、ベオルの子[こ]で、その都[みやこ]の名[な]はデンナバであった。バラクの後[のち]は、ヨブと呼ばれるヨバブ。その後は、テマニティスの地[ち]から来[き]た支配者[しはいしゃ]アソム。その後は、アダド、バラドの子[こ]で、モアブの野[の]でミディアンを打[う]ち破[やぶ]った者[もの]である。その都の名はゲッタイムであった。彼のもとに来た友[とも]たちは、エリファズ（ソファンの子[こ]、エサウの子[こ]らの中[なか]のテマン人[じん]の王[おう]）、ビルダド（アムノン・ホバルの子[こ]、シュヒ人[じん]の支配者[しはいしゃ]）、ゾファル（ミナ人[じん]の王[おう]）であった。"

notes:
  1: "Повествование. Ὑπολαβὼν δὲ Ιωβ λέγει τῷ κυρίῳ — «И отвечал Иов Господу и говорит» (csl «Отвещав же иов, рече ко Господу»). Вводная формула, повествование, вне кавычек."
  2: "Иов. Οἶδα ὅτι πάντα δύνασαι — «знаю, что всё можешь» (οἶδα — «знать»; δύναμαι — «мочь»). ἀδυνατεῖ δέ σοι οὐθέν — «и невозможно Тебе ничто» (ἀδυνατέω — «быть невозможным»); csl «вем, яко вся можеши, невозможно же тебе ничтоже». Начало ответа Иова, цитата 「…」."
  3: "Иов. τίς γάρ ἐστιν ὁ κρύπτων σε βουλήν — «ибо кто есть скрывающий от Тебя совет» (κρύπτω — «скрывать»; βουλή — «совет, замысел»). φειδόμενος δὲ ῥημάτων καὶ σὲ οἴεται κρύπτειν — «щадящий слова, и от Тебя думает утаить» (φείδομαι — «щадить»; οἴομαι — «думать»); это слова Господа (ср. 38:2), которые Иов повторяет, поэтому 『…』. τίς δὲ ἀναγγελεῖ μοι ἃ οὐκ ᾔδειν — «кто возвестит мне, чего я не знал» (ἀναγγέλλω — «возвещать»); μεγάλα καὶ θαυμαστὰ ἃ οὐκ ἠπιστάμην — «великое и чудное, чего я не знал» (θαυμαστός — «дивный»)."
  4: "Иов. ἄκουσον δέ μου, κύριε, ἵνα κἀγὼ λαλήσω — «послушай же меня, Господи, чтобы и я говорил» (ἀκούω — «слушать»; ἵνα — «чтобы»). ἐρωτήσω δέ σε, σὺ δέ με δίδαξον — «я спрошу Тебя, а Ты меня научи» (ἐρωτάω — «спрашивать»; διδάσκω — «учить»); это слова Господа из 38:3 и 40:7, повторяемые Иовом, но здесь они уже его собственное обращение, поэтому остаются в 「…」."
  5: "Иов. ἀκοὴν μὲν ὠτὸς ἤκουόν σου τὸ πρότερον — «слухом уха я слышал о Тебе прежде» (ἀκοή — «слух»; οὖς — «ухо»; πρότερον — «прежде»). νυνὶ δὲ ὁ ὀφθαλμός μου ἑόρακέν σε — «ныне же око моё увидело Тебя» (ὀφθαλμός — «глаз»; ὁράω — «видеть»)."
  6: "Иов. διὸ ἐφαύλισα ἐμαυτὸν καὶ ἐτάκην — «поэтому я презрел себя и растаял» (φαυλίζω — «считать ничтожным»; τήκομαι — «таять»). ἥγημαι δὲ ἐμαυτὸν γῆν καὶ σποδόν — «и считаю себя землёй и пеплом» (ἡγέομαι — «считать»; σποδός — «пепел»); csl «темже укорих себе сам, и истаях, и мню себе землю и пепел». Син. «в прахе и пепле» — иное чтение, не внесено. Ответ Иова кончается."
  7: "Повествование; далее Господь. Ἐγένετο δὲ μετὰ τὸ λαλῆσαι τὸν κύριον πάντα τὰ ῥήματα ταῦτα τῷ Ιωβ — «было же после того, как Господь сказал все эти слова Иову» (ῥῆμα — «слово»). εἶπεν ὁ κύριος Ελιφας τῷ Θαιμανίτῃ — «сказал Господь Елифазу Феманитянину» (Θαιμανίτης — テマン人). Ἥμαρτες σὺ καὶ οἱ δύο φίλοι σου — «согрешил ты и два друга твои» (ἁμαρτάνω — «грешить»; в LXX именно два, не три). οὐ γὰρ ἐλαλήσατε ἐνώπιόν μου ἀληθὲς οὐδὲν ὥσπερ ὁ θεράπων μου Ιωβ — «ибо вы не говорили предо Мной ничего истинного, как раб Мой Иов» (θεράπων — «слуга, раб»). Повествование и формула вне кавычек, затем речь Господа 「…」, которая продолжается в 42:8. Син. добавляет «горит гнев Мой» — в LXX этого нет."
  8: "Господь. νῦν δὲ λάβετε ἑπτὰ μόσχους καὶ ἑπτὰ κριοὺς — «ныне возьмите семь тельцов и семь овнов» (μόσχος — «телец»; κριός — «баран»). πορεύθητε πρὸς τὸν θεράποντά μου Ιωβ — «идите к рабу Моему Иову»; ποιήσει κάρπωσιν περὶ ὑμῶν — «он принесёт жертву за вас» (3 л. ед. ч., подлежащее — Иов; κάρπωσις — «жертва»), не вы: жертву приносит Иов, как и молится он же. ὅτι εἰ μὴ πρόσωπον αὐτοῦ λήμψομαι — «ибо если не приму лица его» (λαμβάνω — «принимать»); εἰ μὴ γὰρ δι᾿ αὐτόν, ἀπώλεσα ἂν ὑμᾶς — «ибо если бы не он, Я погубил бы вас» (ἀπόλλυμι — «губить»). Речь Господа, продолжение; здесь она закрывается."
  9: "Повествование. ἐπορεύθη δὲ Ελιφας ὁ Θαιμανίτης καὶ Βαλδαδ ὁ Σαυχίτης καὶ Σωφαρ ὁ Μιναῖος — «пошли Елифаз Феманитянин, Валдад Савхеянин и Софар Минаит» (Σαυχίτης — シュヒ人; Μιναῖος — ミナ人). ἐποίησαν καθὼς συνέταξεν αὐτοῖς ὁ κύριος — «сделали, как повелел им Господь» (συντάσσω — «повелевать»). καὶ ἔλυσεν τὴν ἁμαρτίαν αὐτοῖς διὰ Ιωβ — «и отпустил грехи им ради Иова» (λύω — «разрешать, отпускать»); csl «И отпусти грехи им иова ради». Повествование, вне кавычек."
  10: "Повествование. ὁ δὲ κύριος ηὔξησεν τὸν Ιωβ — «Господь же возрастил Иова» (αὐξάνω — «умножать, возвеличивать»; csl «возрасти иова»). εὐξαμένου δὲ αὐτοῦ καὶ περὶ τῶν φίλων αὐτοῦ — «когда он помолился и о друзьях своих» (εὔχομαι — «молиться»); ἀφῆκεν αὐτοῖς τὴν ἁμαρτίαν — «отпустил им грех» (ἀφίημι — «отпускать»). ἔδωκεν δὲ ὁ κύριος διπλᾶ ὅσα ἦν ἔμπροσθεν Ιωβ εἰς διπλασιασμόν — «дал Господь вдвое больше того, что было прежде у Иова, в удвоение» (διπλοῦς — «двойной»; διπλασιασμός — «удвоение»)."
  11: "Повествование. ἤκουσαν δὲ πάντες οἱ ἀδελφοὶ αὐτοῦ καὶ αἱ ἀδελφαὶ αὐτοῦ — «услышали все братья его и сёстры его» (ἀδελφός / ἀδελφή). φαγόντες δὲ καὶ πιόντες παρ᾿ αὐτῷ παρεκάλεσαν αὐτόν — «евши и пивши у него, утешили его» (παρακαλέω — «утешать»). ἐθαύμασαν ἐπὶ πᾶσιν, οἷς ἐπήγαγεν αὐτῷ ὁ κύριος — «дивились всему, что навёл на него Господь» (ἐπάγω — «наводить»; csl «яже наведе нань Бог» — «Бог»; в LXX ὁ κύριος — «Господь»; по паритету взято csl). ἔδωκεν δὲ αὐτῷ ἕκαστος ἀμνάδα μίαν — «дал ему каждый по одной агнице» (ἀμνάς — «агница, овца»); καὶ τετράδραχμον χρυσοῦν ἄσημον — «и золотую тетрадрахму без клейма» (τετράδραχμον — «четыре драхмы»; ἄσημος — «без знака, неклеймёный»); csl «четыре драхмы злата назнаменована» — «с клеймом»; по паритету взято csl, поэтому в тексте 刻印された."
  12: "Повествование. ὁ δὲ κύριος εὐλόγησεν τὰ ἔσχατα Ιωβ ἢ τὰ ἔμπροσθεν — «Господь благословил последнее Иова более, чем прежнее» (εὐλογέω — «благословлять»; ἔσχατος — «последний»). ἦν δὲ τὰ κτήνη αὐτοῦ — «и было стадо его» (κτῆνος — «скот»): πρόβατα μύρια τετρακισχίλια — «овец четырнадцать тысяч» (μύριοι — «десять тысяч»), κάμηλοι ἑξακισχίλιαι — «верблюдов шесть тысяч», ζεύγη βοῶν χίλια — «пар волов тысяча» (ζεῦγος — «пара, упряжка»), ὄνοι θήλειαι νομάδες χίλιαι — «ослиц стадных тысяча» (νομάς — «пастбищный, бродячий»)."
  13: "Повествование. γεννῶνται δὲ αὐτῷ υἱοὶ ἑπτὰ καὶ θυγατέρες τρεῖς — «родились ему семь сыновей и три дочери» (γεννάω — «рождать»; θυγάτηρ — «дочь»); csl «Родишажеся ему сынове седмь и дщери три»."
  14: "Повествование. καὶ ἐκάλεσεν τὴν μὲν πρώτην Ἡμέραν — «и назвал первую День» (καλέω — «называть»; ἡμέρα — «день»; в LXX имя переведено, отсюда ヘメラ). τὴν δὲ δευτέραν Κασίαν — «вторую Касия» (κασία — «касия, коричное дерево»). τὴν δὲ τρίτην Ἀμαλθείας κέρας — «третью Рог Амалфеи» (κέρας — «рог»; Амалфея — коза, вскормившая Зевса, рог изобилия); csl «амалфеев рог», Син. «Керенгаппух» — по евр., не внесено."
  15: "Повествование. καὶ οὐχ εὑρέθησαν κατὰ τὰς θυγατέρας Ιωβ βελτίους αὐτῶν ἐν τῇ ὑπ᾿ οὐρανόν — «и не нашлись подобные дочерям Иова, лучшие их, под небом» (βελτίων — «лучший»); csl «не обретошася подобны в лепоте дщерем иовлевым в поднебесней». ἔδωκεν δὲ αὐταῖς ὁ πατὴρ κληρονομίαν ἐν τοῖς ἀδελφοῖς — «и дал им отец наследство между братьями» (κληρονομία — «наследие, удел»)."
  16: "Повествование. ἔζησεν δὲ Ιωβ μετὰ τὴν πληγὴν ἔτη ἑκατὸν ἑβδομήκοντα — «жил же Иов после язвы сто семьдесят лет» (πληγή — «язва, поражение»); слав. «лет сто седмьдесят», Син. «сто сорок» — по МТ, не внесено. τὰ δὲ πάντα ἔζησεν ἔτη διακόσια τεσσαράκοντα ὀκτώ — «а всего жил двести сорок восемь лет». καὶ εἶδεν Ιωβ τοὺς υἱοὺς αὐτοῦ καὶ τοὺς υἱοὺς τῶν υἱῶν αὐτοῦ τετάρτην γενεάν — «и видел Иов сыновей своих и сыновей сынов своих до четвёртого рода» (γενεά — «род»)."
  17: "Повествование. καὶ ἐτελεύτησεν Ιωβ πρεσβύτερος καὶ πλήρης ἡμερῶν — «и скончался Иов старый и исполненный дней» (τελευτάω — «умирать»; πρεσβύτερος — «старый»; πλήρης ἡμερῶν — «исполненный дней»); csl «И скончася иов стар и исполнь дний». Стих включает и смерть, и подстих 17a (γέγραπται...); метка не выводится. Повествование. γέγραπται δὲ αὐτὸν πάλιν ἀναστήσεσθαι μεθ᾿ ὧν ὁ κύριος ἀνίστησιν — «написано же, что ему снова восстать с теми, кого Господь воскрешает» (γράφω — «писать»; ἀνίστημι — «воскрешать, поднимать»); в gr это подстих 17a при 42:17, в csl входит в 42:17. Οὗτος ἑρμηνεύεται ἐκ τῆς Συριακῆς βίβλου — «он толкуется из Сирийской книги» (ἑρμηνεύω — «толковать, переводить»; Συριακός — «сирийский»). ἐν μὲν γῇ κατοικῶν τῇ Αυσίτιδι — «живя в земле Авситидийской» (Αὐσῖτις — アウシティス, земля Уц); ἐπὶ τοῖς ὁρίοις τῆς Ιδουμαίας καὶ Ἀραβίας — «на пределах Идумеи и Аравии» (ὅριον — «предел, граница»). προυπῆρχεν δὲ αὐτῷ ὄνομα Ιωβαβ — «прежде было ему имя Иовав» (προϋπάρχω — «существовать прежде»); csl «прежде же бяше имя ему иовав». Повествование. λαβὼν δὲ γυναῖκα Ἀράβισσαν γεννᾷ υἱόν, ᾧ ὄνομα Εννων — «взяв жену аравитянку, родил сына, которому имя Еннон» (Ἀράβισσα — «аравитянка»; Εννων — エノン). ἦν δὲ αὐτὸς πατρὸς μὲν Ζαρε, τῶν Ησαυ υἱῶν υἱός, μητρὸς δὲ Βοσορρας — «он был от отца Заре, сын сынов Исава, матери же Босорры» (Ζαρε — ザレ; Ἡσαῦ — エサウ; Βοσορρα — ボソラ); ὥστε εἶναι αὐτὸν πέμπτον ἀπὸ Αβρααμ — «так что был он пятым от Авраама». καὶ οὗτοι οἱ βασιλεῖς οἱ βασιλεύσαντες ἐν Εδωμ — «и сии цари, царствовавшие в Едоме»: в gr здесь метка 18, не выводится. Далее список: Βαλακ ὁ τοῦ Βεωρ (バラク, сын Веора; город Δενναβα — デンナバ), Ιωβαβ ὁ καλούμενος Ιωβ (ヨバブ, называемый Иовом), Ασομ (アソム, вождь из Феманитиды), Αδαδ υἱὸς Βαραδ, истребивший Мадиама на поле Моава (アダド, сын Барада; город Γεθθαιμ — ゲッタイム). οἱ ἐλθόντες πρὸς αὐτὸν φίλοι — «пришедшие к нему друзья»: Ελιφας (царь Феманитян), Βαλδαδ ὁ Σαυχαίων τύραννος (シュヒ人の支配者), Σωφαρ ὁ Μιναίων βασιλεύς (ミナ人の王); csl добавляет при них «сын Софана» и «сын Амнона Ховарского» — внесено в основной текст без 〔…〕."
