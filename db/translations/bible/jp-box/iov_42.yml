# jp-box, Иов, глава 42. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге только 1–2; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 42: ответ Иова (1–6), гнев Господа на Елифаза и двух друзей, жертва и
# молитва Иова (7–9), восстановление и вдвое большее (10–12), сыновья и дочери,
# имена дочерей (13–15), 170 лет и смерть (16), колофон из Сирской книги (17).
# Голоса: 42:1 — вводная формула Иова, повествование, вне кавычек; 42:2–6 — ответ
# Иова, одна цитата 「…」; в 42:3 слова Господа, которые Иов повторяет, — 『…』;
# 42:7 — повествование и формула, затем речь Господа к Елифазу 「…», одна цитата,
# которая продолжается в 42:8 и закрывается в конце 42:8; 42:9–17 — повествование,
# вне кавычек.
# Нумерация — славяно-синодальная (по csl-ru): 17 стихов. Наш 42:1–16 = csl 42:1–16;
# наш 42:17 = csl 42:17 целиком: смерть Иова («исполнь дний»), подстих 17a
# (восстание, Сирская книга, Иовав, Еннон, Заре, Босорра) и список царей Едома.
# В gr 42:17 после «исполнь дний» стоит подстих 17a, в gr 42:19 — метка 18;
# метки 17a и 18 не выводятся. csl 42:18 пуст.
# 〔…〕 нет: все стихи есть в gr-lxx-byz. Сносок ⟨…⟩ нет.
# Имена — транслитерация греческого (LXX): ヨブ, エリファズ, ビルダド, ゾファル;
# ヨバブ, エノン, ザレ, ボソラ; дочери — ヘメラ, カシア, アマルテイアの角 (по гр.).
