# jp-box, Неемия, глава 11. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); церковнославянский (csl-ru) — второй
# свидетель церковного текста (новый паритет, docs/japanese-bible.md):
# слав. чтения входят в основной текст без 〔…〕, вариант LXX — в notes.
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет;
# jp-ni (под авторским правом) не использовался.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление
# на клаузы — по греческому.
# Глава 11: жители Иерусалима — жребий о десятой части (1–2), главы страны
# и список жителей: иудеи и вениамитяне (3–9), священники (10–14),
# левиты (15–18), привратники (19), прочие и нефинеи (20–21), начальник
# левитов и певцы (22–24), селения Иуды (25–30), селения Вениамина (31–36).
# Речи нет; красного нет.
# Нумерация по gr: 36 стихов, совпадает с csl/ru.
# Особенность базы: в gr-lxx-byz ст. 16, 20, 21, 28, 29, 32–35 стоят «.»
# (пустые стихи, дефект модуля), а ряд стихов (12–17, 22–27, 30–31) полнее
# в csl. По паритету недостающее взято из csl в основной текст, отмечено
# в notes; 〔…〕 не ставим.
# Сносок ⟨…⟩ нет: 神殿, 祭司, レビ人, 門衛, 歌い手, 嗣業, 初穂 уже в корпусе.
# Имена и названия — транслитерация греческого (LXX) в катакане, а где LXX
# пуст — славянского текста; расхождения названы в notes.
# jp-ni не использовался.

tr_code: jp-box
book: neem
chapter: 11
draft: true

verses:
  1: "民[たみ]の首長[しゅちょう]たちはエルサレムに住[す]んだ。残[のこ]りの民[たみ]は、十人[じゅうにん]に一人[ひとり]を選[えら]んで聖[せい]なる都[みやこ]エルサレムに住[す]まわせ、十[じゅう]のうち九[ここの]つの部分[ぶぶん]は町[まち]々[まち]にとどまらせるために、くじを投[な]げた。"
  2: "民[たみ]は、自[みずか]ら進[すす]んでエルサレムに住[す]むことを望[のぞ]んだすべての人[ひと]々[びと]を祝福[しゅくふく]した。"
  3: "これらはその地方[ちほう]の首長[しゅちょう]たちで、エルサレムに住[す]んだ者[もの]たちである。ユダの町[まち]々[まち]では、イスラエル人[じん]、祭司[さいし]、レビ人[びと]、神殿[しんでん]の奉仕[ほうし]に任[まか]された者[もの]たち、ソロモンのしもべたちの子孫[しそん]が、それぞれ自分[じぶん]の所有地[しょゆうち]の、自分[じぶん]の町[まち]に住[す]んだ。"
  4: "エルサレムには、ユダの子[こ]らとベニヤミンの子[こ]らのうちから住[す]んだ者[もの]があった。ユダの子[こ]らのうちからは、アタイア、すなわちアザイヤの子[こ]、ゼカリヤの子[こ]、アマリヤの子[こ]、サファテヤの子[こ]、マレレルの子[こ]。ファレスの子[こ]らのうちからである。"
  5: "またマアシヤ、すなわちバルクの子[こ]、ハラザの子[こ]、オジヤの子[こ]、アダイヤの子[こ]、ヨアリブの子[こ]、テジヤの子[こ]、シロニの子[こ]。"
  6: "エルサレムに住[す]んだファレスの子[こ]らは全部[ぜんぶ]で四百六十八人[よんひゃくろくじゅうはちにん]の、力[ちから]ある男[おとこ]たちであった。"
  7: "また、ベニヤミンの子[こ]らは次[つぎ]のとおりである。サロ、メスラムの子[こ]、ヨアデの子[こ]、フェダイヤの子[こ]、コラヤの子[こ]、マアセヤの子[こ]、イフィエルの子[こ]、イシャヤの子[こ]。"
  8: "また彼[かれ]の後[あと]にはゲビ、セリがいた。全部[ぜんぶ]で九百二十八人[きゅうひゃくにじゅうはちにん]である。"
  9: "ヨエル、すなわちゼクリの子[こ]が彼[かれ]らの監督[かんとく]であり、ユダ、すなわちアサナの子[こ]が、その町[まち]の第二位[だいい]の者[もの]であった。"
  10: "祭司[さいし]のうちからは、イアディア、すなわちヨアリブの子[こ]、またイアキン。"
  11: "またセラヤ、すなわちヘルキヤの子[こ]、メシュラムの子[こ]、サドクの子[こ]、メラヨトの子[こ]、アヒトブの子[こ]で、神[かみ]の家[いえ]の指導[しどう]者[しゃ]。"
  12: "また彼[かれ]らの兄弟[きょうだい]たちは、神[かみ]の家[いえ]の務[つと]めを行[おこな]う者[もの]たちで、八百二十二[はっぴゃくにじゅうに]人[にん]。またアダイヤ、すなわちイラアムの子[こ]、ファラルの子[こ]、アミジの子[こ]、ゼカリヤの子[こ]、パシュルの子[こ]、マルキヤの子[こ]。"
  13: "また彼[かれ]の兄弟[きょうだい]たちは、氏族[しぞく]の長[かしら]で二百四十二人[にひゃくよんじゅうににん]。またアメッサイ、すなわちエズリエルの子[こ]、サキヤの子[こ]、マサリモトの子[こ]、エメルの子[こ]。"
  14: "また彼[かれ]の兄弟[きょうだい]たちは、戦[いくさ]の力[ちから]ある者[もの]たちで百二十八人[ひゃくにじゅうはちにん]。彼[かれ]らの監督[かんとく]はバディエルであった。"
  15: "レビ人[びと]のうちからは、サマイア、すなわちアスブの子[こ]、エズリカムの子[こ]、アサビアの子[こ]、ブンニの子[こ]。"
  16: "またシャブタイとヨザバドは、レビ人[びと]の長[かしら]たちのうちから、神[かみ]の家[いえ]の外[そと]の務[つと]めを司[つかさど]った。"
  17: "またマタニヤ、すなわちミカの子[こ]、ゼクリの子[こ]、アサフの子[こ]で、賛美[さんび]の始[はじ]めを司[つかさど]る者[もの]、また祈[いの]りのためのユダ、また彼[かれ]の兄弟[きょうだい]のうちで二番目[にばんめ]のバクブキヤ、またアブデヤ、すなわちシャムアの子[こ]、ガラルの子[こ]、エドトンの子[こ]。"
  18: "聖[せい]なる都[みやこ]にいるレビ人[びと]は全部[ぜんぶ]で二百八十四人[にひゃくはちじゅうよんにん]であった。"
  19: "門衛[もんえい]はアクブ、テラミン、および彼[かれ]らの兄弟[きょうだい]たちで、門[もん]を守[まも]る者[もの]たち、百七十二人[ひゃくななじゅうににん]であった。"
  20: "イスラエルの残[のこ]りの者[もの]たち、すなわち祭司[さいし]とレビ人[びと]は、ユダのすべての町[まち]々[まち]で、それぞれ自分[じぶん]の嗣業[しぎょう]のうちに住[す]んだ。"
  21: "神殿[しんでん]の奉仕[ほうし]に任[まか]された者[もの]たちはオフェルに住[す]み、ツィハとギシュパもその者[もの]たちのうちにいた。"
  22: "エルサレムにいるレビ人[びと]の監督[かんとく]は、オジ、すなわちバニの子[こ]、アサビアの子[こ]、マタニヤの子[こ]、ミカの子[こ]であった。彼[かれ]はアサフの子[こ]らのうちの歌[うた]い手[て]で、神[かみ]の家[いえ]の務[つと]めに携[たずさ]わった。"
  23: "それは王[おう]の命令[めいれい]が彼[かれ]らにあったからである。すなわち、歌[うた]い手[て]たちのために、日[ひ]ごとにその日[ひ]の分[ぶん]が確[かく]かに定[さだ]められていた。"
  24: "またペタヒヤ、すなわちメシェザベルの子[こ]、ゼラの子[こ]、ユダの子[こ]のうちの者[もの]が、民[たみ]のためのすべての事[こと]について王[おう]の手[て]のそばにいた。"
  25: "また、彼[かれ]らの野[の]にある村[むら]々[むら]では、ユダの子[こ]らのうちから、キリアト・アルバとその村[むら]々[むら]、ディボンとその村[むら]々[むら]、エカブツエルとその村[むら]々[むら]に住[す]んだ。"
  26: "またイエシュア、モラダ、ベト・パレト、"
  27: "またハツァル・シュアル、ベエル・シェバとその村[むら]々[むら]、"
  28: "またツィクラグ、メコナとその村[むら]々[むら]、"
  29: "またエン・リモン、ツォルア、ヤルムト、"
  30: "またザノア、オドラムとその村[むら]々[むら]、ラキシュとその畑[はたけ]、アゼカとその村[むら]々[むら]に住[す]んだ。彼[かれ]らはベエル・シェバからエノンの谷[たに]まで陣[じん]を敷[し]いた。"
  31: "またベニヤミンの子[こ]らは、ゲバから、ミフマス、ベテルとその村[むら]々[むら]、"
  32: "アナトト、ノブ、アナニヤ、"
  33: "ハツォル、ラマ、ギタイム、"
  34: "ハディド、ツェボイム、ネバラト、"
  35: "ロド、オノ、ハラシムの谷[たに]に住[す]んだ。"
  36: "またレビ人[びと]のうちには、ユダとベニヤミンの割[わ]り当[あ]ての地[ち]に住[す]む者[もの]たちがいた。"

notes:
  1: "ἐκάθισαν — сели, поселились. ἐβάλοσαν κλήρους — бросили жребии (слав. «метнуша жребия»). ἐνέγκαι ἕνα ἀπὸ τῶν δέκα — «привести одного из десяти»; слав. «взяти единаго от десяти». καθίσαι — сесть, т. е. поселиться. ἐννέα μέρη — девять частей."
  2: "εὐλόγησεν — благословил. ἑκουσιαζομένους — добровольно изъявивших желание (ἑκουσιάζομαι); слав. «иже сами произволиша». Смысл: народ благословил добровольцев, поселившихся в Иерусалиме."
  3: "οἱ ἄρχοντες τῆς χώρας — главы страны (χώρα — область). κατασχέσεις — владения, уделы. ναθιναῖοι — нефинеи, храмовые служители; в корпусе термина нет, передано описательно (ср. 1 Пар 9:2). υἱοὶ δούλων Σαλωμων — сыновья рабов Соломоновых."
  4: "ἀπὸ υἱῶν Ιουδα καὶ ἀπὸ υἱῶν Βενιαμιν — из сыновей Иуды и Вениамина. Αθαια — Афаия (слав. «афаиа»); далее цепь: Азаия, Захария, Амария, Сафатия, Малелеил. Слав. даёт иные формы: «озиин», «самариин», «масеиль» — вероятно, порча; держимся LXX. καὶ ἀπὸ υἱῶν Φαρες — и из сыновей Фареса."
  5: "Μαασια — Маасия (слав. «маасиа»). Цепь: Варух, Халаза, Озия, Адаия, Иоарив, Тозия, Шилони. Θηζια — тёмное имя (слав. «захариев»); передано как Тозия. υἱὸς τοῦ Σηλωνι — сын Шилони, т. е. из рода Шилония."
  6: "πάντες υἱοὶ Φαρες οἱ καθήμενοι — все сыновья Фареса, жившие. τετρακόσιοι ἑξήκοντα ὀκτώ — 468. ἄνδρες δυνάμεως — мужи силы, крепкие (слав. «мужие крепцы»)."
  7: "Σηλω — Сало (слав. «силон»). Μεσουλαμ — Мешуллам. Ιωαδ — Иоад (слав. «иоадов»). Φαδαια — Федаия. Κωλια — Колаия (слав. «колиев»). Μασαια — Маасея. Αιθιηλ — Ифиил (слав. «ефииль»). Ιεσια — Исаия (слав. «иессиев»)."
  8: "Γηβι — Геби (слав. «гевеил»). Σηλι — Сели (слав. «силиев»; Синод. «Саллай»). ἐννακόσιοι εἴκοσι ὀκτώ — 928. Оба имени — главы родов, число — итог вениамитян."
  9: "Ιωηλ — Иоиль. ἐπίσκοπος ἐπ᾿ αὐτούς — надзиратель над ними (слав. «настоятель»). Ιουδας υἱὸς Ασανα — Иуда, сын Асаны (Синод. «Сенуи»). ἐπὶ τῆς πόλεως δεύτερος — второй над городом, т. е. помощник начальника."
  10: "ἀπὸ τῶν ἱερέων — из священников. Ιαδια — Иадия (слав. «иадиа»); Ιωριβ — Иоарив. Ιαχιν — Иахин (слав. «иахинь»). Стих открывает список священников."
  11: "Σαραια — Сераия; Ελκια — Хелкия; Μεσουλαμ — Мешуллам; Σαδδουκ — Садок; Μαριωθ — Мераиоф; Αιτωβ — Ахитув. ἀπέναντι οἴκου τοῦ θεοῦ — напротив дома Божия; слав. «началник дому Божия» (иное чтение). В тексте — по слав., LXX-вариант отмечен здесь."
  12: "Слав. добавляет число 822 и цепь Адаии (Иерохам, Фалалия, Амций, Захария, Пашхур, Малхия) — в LXX этого нет: там только Амаси, сын Захарии, сына Пашхура, сына Малхии. По паритету внесено по слав.; LXX-чтение отмечено."
  13: "ἄρχοντες πατριῶν — главы отечеств; διακόσιοι τεσσαράκοντα δύο — 242. Слав. продолжает цепь Амессая: Сакхий, Масаримоф, Иммер (в LXX только «сын Ездриэля»). Внесено по слав."
  14: "δυνατοὶ παρατάξεως — сильные в строю, т. е. воины (слав. «сильнии во бранех»). ἑκατὸν εἴκοσι ὀκτώ — 128. ἐπίσκοπος ἐπ᾿ αὐτῶν Βαδιηλ — надзиратель над ними Вадиил; слав. «сохриил, сын великих» — порча, в тексте LXX-форма."
  15: "Σαμαια — Шемаия (слав. «самаиа»). LXX обрывает цепь на «Езри»; слав. продолжает: Езрикам, Асавия, Вунний (ср. 1 Пар 9:15). По паритету внесено."
  16: "В gr-lxx-byz на месте стиха стоит «.» (пустой стих). По слав.: Шавфай и Иозавад — над внешними делами дома Божия, из начальников левитских."
  17: "В LXX только «Матфания, сын Михи, и Овид, сын Самуи»; слав. даёт полный список: Матфания (сын Михи, Зехрия, Асафа) — начальник хвалы, Иуда молитвы, Вакхия второй из братьев, Авдия (сын Самея, Галала, Идифуна). Внесено по слав."
  18: "διακόσιοι ὀγδοήκοντα τέσσαρες — 284. Слав. «всех левитов во граде святем». Итог левитов."
  19: "πυλωροί — привратники, 門衛. Ακουβ — Аккув; Τελαμιν — Теламин (слав. «теламин»; Синод. «Талмон»). ἑκατὸν ἑβδομήκοντα δύο — 172."
  20: "В gr-lxx-byz стих пуст («.»). По слав.: прочие израильтяне, священники и левиты жили по всем городам Иудеи, каждый в своём уделе."
  21: "В gr-lxx-byz стих пуст («.»). По слав.: нефинеи жили в Офеле; Циха и Гишфа — из нефинеев (слав. «сиай и гесф от нафинеев»; Синод. «Циха и Гишфа»), т. е. сами принадлежали к ним."
  22: "ἐπίσκοπος Λευιτῶν — надзиратель левитов. Οζι — Уззий (слав. «озий»). Слав. добавляет в цепь Матфанию (Хашавия, Матфания, Миха); в LXX — Ваний, Хашавия, Миха. Внесено по слав. ἀπέναντι ἔργου οἴκου τοῦ θεοῦ — напротив дела дома Божия, т. е. при его служении."
  23: "ἐντολὴ τοῦ βασιλέως ἐπ᾽ αὐτούς — заповедь царя о них. Слав. добавляет: «и пребываше верно над певцами оброк коегождо дне в день свой» (ежедневное содержание певцам) — в LXX нет, внесено по паритету."
  24: "Παθαια — Петахия; Βασηζα — Васеза (слав. «массизавил»; Синод. «Мешезавел»). πρὸς χεῖρα τοῦ βασιλέως — при руке царя, т. е. доверенное лицо. Слав. добавляет «от сынов Зары, сына Иуды» — в LXX нет, внесено."
  25: "ἐπαύλεις — селения, дворы. Καριαθαρβοκ — Кириаф-Арба (слав. «кариафарвоце»). Слав. добавляет Дивон и Иекавцеил с селами — в LXX только Кириаф-Арба; внесено по паритету."
  26: "LXX даёт только «и в Иешуе»; по слав. добавлены Молада и Веффалат (Беф-Палет). Внесено по паритету."
  27: "LXX даёт только Беэр-Шеву; слав. добавляет Хацар-Шуал (Асерсоал) и села Вирсавии. Внесено по паритету."
  28: "В gr-lxx-byz стих пуст («.»). По слав.: Секелаг, Мавне (Синод. «Мехона») и села его."
  29: "В gr-lxx-byz стих пуст («.»). По слав.: Ремаон (Ен-Риммон), Сара (Цора), Иеримуф."
  30: "LXX: «и селения их, Лахис и поля его; и расположились станом в Беэр-Шеве». Слав. добавляет Заноах, Одоллам, Азику с селами и «до долины Еннома»; внесено по паритету. Λαχις — Лахис; Αζηκα — Азека."
  31: "Γαβα — Гева (слав. «гаваи»). Μαχαμας — Михмас. Слав. добавляет Вефиль и его села — в LXX нет, внесено."
  32: "В gr-lxx-byz стих пуст («.»). По слав.: Анатоф, Нов, Ания (Анания)."
  33: "В gr-lxx-byz стих пуст («.»). По слав.: Асор (Хацор), Рама, Гефаим (Гиффаим)."
  34: "В gr-lxx-byz стих пуст («.»). По слав.: Адод (Хадид), Севоим (Цевоим), Навалат (Неваллат)."
  35: "В gr-lxx-byz стих пуст («.»). По слав.: Лидда (Лод), Оно и Харашим (Синод. «в долине Харашиме»)."
  36: "καὶ ἀπὸ τῶν Λευιτῶν μερίδες Ιουδα τῷ Βενιαμιν — «и из левитов — части Иуды Вениамину», т. е. левиты жили в уделах Иуды и Вениамина. Слав. «части иудины и вениамини»."
