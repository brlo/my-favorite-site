# jp-box, Исход, глава 40. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — csl-ru (jp-joc в гл. 40
# есть только в ст. 1–5, 9–10, 16 и 34–35). Русский Синодальный — только для понимания.
# Язык — современный 常体. Нумерация LXX (эта глава совпадает с евр. 40).
# Глава 40: повеление поставить скинию и освятить её (1–16), постановка (17–33),
# облако и слава Господня (34–35), водительство облаком в пути (36–38).
# Дефекты греческого модуля (проверено по базе): в gr-lxx-byz ст. 7, 11, 28, 30, 31, 32
# стоят как «.», ст. 20 и 29 оборваны, ст. 8 искажён. Отсутствующие стихи переведены
# по csl-ru (церковный текст LXX) и целиком стоят в 〔…〕 — по правилу книги
# (ср. 25:6; 28:23–28). В ст. 20 и 29 в 〔…〕 взято только церковное окончание.
# Ст. 8 переведён по словам gr-lxx-byz буквально, без скобок; расхождение — в notes.
# Красного и синего нет: речь Бога — в 「…」, «<j>» не ставится.
# Сносок ⟨…⟩ нет: 幕屋, 雲, 栄光, 油 объяснены в гл. 25–30.

