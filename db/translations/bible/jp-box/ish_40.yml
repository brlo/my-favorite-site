verses:
  1: "主[しゅ]はモーセに告[つ]げて言[い]われた。"
  2: "「第一[だいいち]の月[つき]の一日[ついたち]、すなわち新月[しんげつ]の日[ひ]に、あなたは証[あかし]の幕屋[まくや]を建[た]てよ。"
  3: "その中[なか]に証[あかし]の箱[はこ]を置[お]き、垂[た]れ幕[まく]でその箱[はこ]を覆[おお]え。"
  4: "机[つくえ]を運[はこ]び入[い]れて、その上[うえ]に供[そな]えのパンを並[なら]べ、燭台[しょくだい]を運[はこ]び入[い]れて、その灯[ともしび]をともせ。"
  5: "また、香[こう]をたくための金[きん]の祭壇[さいだん]を箱[はこ]の前[まえ]に置[お]き、幕屋[まくや]の入口[いりぐち]に垂[た]れ幕[まく]の覆[おお]いを掛[か]けよ。"
  6: "焼[や]き尽[つ]くす供[そな]えの祭壇[さいだん]を、証[あかし]の幕屋[まくや]の入口[いりぐち]のそばに置[お]け。"
  7: "〔洗[あら]い盤[ばん]を証[あかし]の幕屋[まくや]と祭壇[さいだん]の間[あいだ]に置[お]き、それに水[みず]を注[そそ]げ。〕"
  8: "幕屋[まくや]の周[まわ]りを囲[かこ]い、そのすべてを周[まわ]りにわたって聖[せい]なるものとせよ。"
  9: "聖[せい]なる油[あぶら]を取[と]り、幕屋[まくや]とその中[なか]のすべてに塗[ぬ]り、それを聖[せい]なるものとせよ。そうすれば、それは聖[せい]となる。"
  10: "焼[や]き尽[つ]くす供[そな]えの祭壇[さいだん]とそのすべての器[うつわ]に塗[ぬ]り、祭壇[さいだん]を聖[せい]なるものとせよ。そうすれば、その祭壇[さいだん]は聖[せい]なるもののうちの聖[せい]なるものとなる。"
  11: "〔洗[あら]い盤[ばん]とその台[だい]にも塗[ぬ]り、それを聖[せい]なるものとせよ。〕"
  12: "アロンとその子[こ]らを証[あかし]の幕屋[まくや]の入口[いりぐち]に連[つ]れて来[き]て、水[みず]で彼[かれ]らを洗[あら]え。"
  13: "アロンに聖[せい]なる衣服[いふく]を着[き]せ、彼[かれ]に油[あぶら]を注[そそ]いで聖[せい]なる者[もの]とせよ。そうすれば、彼[かれ]はわたしに祭司[さいし]として仕[つか]える。"
  14: "また、その子[こ]らを連[つ]れて来[き]て、衣[ころも]を着[き]せよ。"
  15: "そして、彼[かれ]らに油[あぶら]を注[そそ]げ。あなたがその父[ちち]に注[そそ]いだように。そうすれば、彼[かれ]らはわたしに祭司[さいし]として仕[つか]える。彼[かれ]らの祭司[さいし]の油[あぶら]は、代々[だいだい]、永遠[えいえん]に彼[かれ]らのものとなる。」"
  16: "モーセは、主[しゅ]が命[めい]じたすべてをそのとおりに行[おこな]った。そのとおりに行[おこな]ったのである。"
  17: "エジプトを出[で]て二年目[にねんめ]の第一[だいいち]の月[つき]、新月[しんげつ]の日[ひ]に、幕屋[まくや]は建[た]てられた。"
  18: "モーセは幕屋[まくや]を建[た]て、その柱[はしら]の頭[かしら]を据[す]え、横木[よこぎ]を渡[わた]し、柱[はしら]を立[た]て、"
  19: "幕屋[まくや]の上[うえ]に幕[まく]を広[ひろ]げ、その上[うえ]に幕屋[まくや]の覆[おお]いを掛[か]けた。主[しゅ]がモーセに命[めい]じたとおりである。"
  20: "また、証[あかし]の板[いた]を取[と]って箱[はこ]に入[い]れ、箱[はこ]の下[した]に担[にな]い棒[ぼう]を差[さ]し、〔箱[はこ]の上[うえ]に贖[あがな]いの座[ざ]を置[お]いた。〕"
  21: "箱[はこ]を幕屋[まくや]に運[はこ]び入[い]れ、垂[た]れ幕[まく]の覆[おお]いを掛[か]けて、証[あかし]の箱[はこ]を覆[おお]った。主[しゅ]がモーセに命[めい]じたとおりである。"
  22: "机[つくえ]を証[あかし]の幕屋[まくや]の中[なか]、幕屋[まくや]の北[きた]側[がわ]、垂[た]れ幕[まく]の外[そと]に置[お]いた。"
  23: "机[つくえ]の上[うえ]に、主[しゅ]の前[まえ]に供[そな]えのパンを並[なら]べた。主[しゅ]がモーセに命[めい]じたとおりである。"
  24: "燭台[しょくだい]を証[あかし]の幕屋[まくや]の中[なか]、幕屋[まくや]の南[みなみ]側[がわ]に置[お]いた。"
  25: "燭台[しょくだい]の灯[ともしび]を主[しゅ]の前[まえ]にともした。主[しゅ]がモーセに命[めい]じたとおりである。"
  26: "金[きん]の祭壇[さいだん]を証[あかし]の幕屋[まくや]の中[なか]、垂[た]れ幕[まく]の前[まえ]に置[お]き、"
  27: "その上[うえ]で香[こう]の調[ととの]え物[もの]をたいた。主[しゅ]がモーセに命[めい]じたとおりである。"
  28: "〔幕屋[まくや]の入口[いりぐち]に垂[た]れ幕[まく]を掛[か]けた。〕"
  29: "焼[や]き尽[つ]くす供[そな]えの祭壇[さいだん]を証[あかし]の幕屋[まくや]の入口[いりぐち]のそばに置[お]き、〔その上[うえ]で焼[や]き尽[つ]くす供[そな]えと供[そな]え物[もの]をささげ、主[しゅ]がモーセに命[めい]じたとおりに行[おこな]った。〕"
  30: "〔洗[あら]い盤[ばん]を証[あかし]の幕屋[まくや]と祭壇[さいだん]の間[あいだ]に置[お]き、そこに水[みず]を注[そそ]いだ。〕"
  31: "〔モーセとアロン、およびその子[こ]らは、そこから手[て]と足[あし]を洗[あら]った。すなわち、証[あかし]の幕屋[まくや]に入[はい]るとき、〕"
  32: "〔また祭壇[さいだん]に近[ちか]づいて務[つと]めを果[は]たすとき、そこから洗[あら]った。主[しゅ]がモーセに命[めい]じたとおりである。〕"
  33: "また、幕屋[まくや]と祭壇[さいだん]の周[まわ]りに庭[にわ]を巡[めぐ]らした。こうしてモーセはすべての仕事[しごと]を終[お]えた。"
  34: "すると、雲[くも]が証[あかし]の幕屋[まくや]を覆[おお]い、主[しゅ]の栄光[えいこう]が幕屋[まくや]に満[み]ちた。"
  35: "モーセは証[あかし]の幕屋[まくや]に入[はい]ることができなかった。雲[くも]がその上[うえ]を覆[おお]い、主[しゅ]の栄光[えいこう]が幕屋[まくや]に満[み]ちていたからである。"
  36: "雲[くも]が幕屋[まくや]から上[あ]がるたびに、イスラエルの子[こ]らは、そのすべての荷[に]とともに旅立[たびだ]った。"
  37: "もし雲[くも]が上[あ]がらなければ、それが上[あ]がる日[ひ]まで、彼[かれ]らは旅立[たびだ]たなかった。"
  38: "昼[ひる]は幕屋[まくや]の上[うえ]に雲[くも]があり、夜[よる]はその上[うえ]に火[ひ]があった。イスラエルすべての者[もの]の前[まえ]で、そのすべての旅立[たびだ]ちの間[あいだ]、そうであった。"

notes:
  1: "ἐλάλησεν κύριος πρὸς Μωυσῆν λέγων — 主はモーセに告げて言われた (формула введения речи)."
  2: "Ἐν ἡμέρᾳ μιᾷ τοῦ μηνὸς τοῦ πρώτου νουμηνίᾳ — 第一の月の一日、新月の日に (νουμηνία — новомесячие, первый день месяца). στήσεις — поставишь (буд. вр. в значении повеления). σκηνὴ τοῦ μαρτυρίου — 証の幕屋."
  3: "κιβωτὸς τοῦ μαρτυρίου — 証の箱. καταπέτασμα — 垂れ幕 (завеса, закрывающая ковчег)."
  4: "πρόθεσις — 供えのパン (хлебы предложения; ср. 25:30). λυχνία — 燭台. ἐπιθήσεις τοὺς λύχνους — 灯をともせ (поставишь лампады)."
  5: "θυσιαστήριον τὸ χρυσοῦν εἰς τὸ θυμιᾶν — 香をたくための金の祭壇 (жертвенник курения). κάλυμμα καταπετάσματος — 垂れ幕の覆い (покров завесы)."
  6: "τὸ θυσιαστήριον τῶν καρπωμάτων — 焼き尽くす供えの祭壇 (жертвенник всесожжения; καρπώματα — всесожжения)."
  7: "В gr-lxx-byz стих стоит как «.»; целиком в 〔…〕, перевод по csl-ru: λουτήρ — 洗い盤 (умывальница), ἀνὰ μέσον — 間."
  8: "περιθήσεις τὴν σκηνήν — 幕屋の周りを囲い (περιτίθημι — «обносить, окружать»). В gr-lxx-byz стих искажён: вместо αὐλήν («двор») стоит σκηνήν, и нет слов о завесе ворот; csl-ru и текст Раля: «и поставь двор кругом и повесь завесу в воротах двора». Переведено по словам гр. буквально, без 〔…〕; искажение отмечено."
  9: "ἔλαιον τοῦ χρίσματος — 聖なる油 (елей помазания; ср. 30:22–33). χρίσεις — помажешь. ἁγιάσεις — освятишь. ἔσται ἁγία — будет свята."
  10: "θυσιαστήριον τῶν καρπωμάτων — 焼き尽くす供えの祭壇. ἅγιον τῶν ἁγίων — 聖なるもののうちの聖なるもの (святое святых, «святыня великая»)."
  11: "В gr-lxx-byz «.»; целиком в 〔…〕, перевод по csl-ru: χρίσεις τὸν λουτῆρα καὶ τὴν βάσιν — 洗い盤とその台に塗り."
  12: "προσάξεις — приведёшь, приблизишь. λούσεις ὕδατι — 水で洗え."
  13: "στολὰς τὰς ἁγίας — 聖なる衣服. ἱερατεύσει μοι — わたしに祭司として仕える (будет священствовать Мне)."
  14: "χιτῶνας — 衣 (хитоны)."
  15: "ἀλείψεις — помажешь (ἀλείφω). χρῖσμα ἱερατείας — 祭司の油 (помазание священства). εἰς τὸν αἰῶνα εἰς τὰς γενεὰς αὐτῶν — 代々、永遠に."
  16: "ἐνετείλατο — заповедал. οὕτως ἐποίησεν — так и сделал (формула послушания; ср. 39:22–23)."
  17: "ἐν τῷ μηνὶ τῷ πρώτῳ τῷ δευτέρῳ ἔτει — 二年目の第一の月に (второй год по выходе из Египта). ἐκπορευομένων αὐτῶν ἐξ Αἰγύπτου — при выходе их из Египта (род. самостоятельный). ἐστάθη — была поставлена."
  18: "ἔστησεν — поставил. ἐπέθηκεν τὰς κεφαλίδας — 柱の頭を据え. διενέβαλεν τοὺς μοχλούς — 横木を渡し. ἔστησεν τοὺς στύλους — 柱を立て."
  19: "ἐξέτεινεν τὰς αὐλαίας — 幕を広げ. κατακάλυμμα — 覆い. ἄνωθεν — 上に."
  20: "λαβὼν τὰ μαρτύρια — 証の板を取って (скрижали откровения). ὑπέθηκεν τοὺς διωστῆρας — 箱の下に担い棒を差し. В gr-lxx-byz стих обрывается; окончание «и положил очистилище над ковчегом» (csl-ru, текст Раля) взято в 〔…〕."
  21: "εἰσήνεγκεν — внёс. κατακάλυμμα τοῦ καταπετάσματος — 垂れ幕の覆い. ἐσκέπασεν — покрыл."
  22: "κλῖτος — сторона. πρὸς βορρᾶν — 北側. ἔξωθεν τοῦ καταπετάσματος — 垂れ幕の外."
  23: "ἄρτοι τῆς προθέσεως — 供えのパン. ἔναντι κυρίου — 主の前に."
  24: "πρὸς νότον — 南側."
  25: "ἐπέθηκεν τοὺς λύχνους — 灯をともした (поставил лампады)."
  26: "θυσιαστήριον τὸ χρυσοῦν — 金の祭壇. ἀπέναντι τοῦ καταπετάσματος — 垂れ幕の前に."
  27: "ἐθυμίασεν — たいた (воскурил). θυμίαμα τῆς συνθέσεως — 香の調え物."
  28: "В gr-lxx-byz «.»; целиком в 〔…〕, перевод по csl-ru: καταπέτασμα τῆς θύρας — 入口の垂れ幕."
  29: "В gr-lxx-byz стих обрывается на «παρὰ τὰς θύρας τῆς σκηνῆς»; окончание по csl-ru взято в 〔…〕. ὁλοκαυτώματα — 焼き尽くす供え, θυσίαι — 供え物."
  30: "В gr-lxx-byz «.»; целиком в 〔…〕, перевод по csl-ru: λουτὴρ ἀνὰ μέσον σκηνῆς καὶ θυσιαστηρίου — 幕屋と祭壇の間の洗い盤."
  31: "В gr-lxx-byz «.»; целиком в 〔…〕, перевод по csl-ru: ἐνίπτοντο — 洗った. εἰσπορευομένων — когда входили."
  32: "В gr-lxx-byz «.»; целиком в 〔…〕, перевод по csl-ru: ὅταν προσπορεύωνται — когда подходили к жертвеннику."
  33: "ἔστησεν τὴν αὐλήν — 庭を巡らした. συνετέλεσεν πάντα τὰ ἔργα — すべての仕事を終えた (ср. Быт 2:2)."
  34: "ἐκάλυψεν ἡ νεφέλη — 雲が覆い. δόξης κυρίου ἐπλήσθη — 主の栄光が満ちた (род. как наполнение; ср. 3 Цар 8:10–11)."
  35: "οὐκ ἠδυνάσθη — не мог. ἐπεσκίαζεν — осеняло."
  36: "ἡνίκα δ᾿ ἂν ἀνέβη — 上がるたびに. ἀνεζεύγνυσαν — отправлялись в путь. ἀπαρτία — 荷, снаряжение."
  37: "εἰ δὲ μή — если же нет. ἕως τῆς ἡμέρας ἧς — до дня, когда."
  38: "νεφέλη… ἡμέρας καὶ πῦρ… νυκτός — 昼は雲、夜は火. ἐναντίον παντὸς Ισραηλ — イスラエルすべての者の前で. ἀναζυγαί — 旅立ち."
