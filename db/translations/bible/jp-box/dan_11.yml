notes:
  1: "καὶ ἐν τῷ ἐνιαυτῷ τῷ πρώτῳ Κύρου τοῦ βασιλέως εἶπέν μοι ἐνισχῦσαι καὶ ἀνδρίζεσθαι — «и в первый год Кира царя он сказал мне: укрепись и мужайся» (LXX); слав. «Аз же в первое лето кирово стах в державу и крепость» — «я стал на власть и крепость», по паритету 彼の支配と力となって立った. ru: «с первого года Дария Мидянина стал ему подпорою» — масоретское чтение, в текст не внесено."
  2: "τρεῖς βασιλεῖς ἀνθεστήκασιν ἐν τῇ Περσίδι — «три царя восстали в Персии»; ὁ τέταρτος πλουτήσει πλοῦτον μέγαν — «четвёртый обогатится великим богатством»; ἐπαναστήσεται παντὶ βασιλεῖ Ἑλλήνων — «восстанет на всякого царя Греции»; слав. «на вся царства еллинская» (все греческие царства), по паритету ギリシアのすべての王国."
  3: "στήσεται βασιλεὺς δυνατός — «восстанет царь сильный» (Александр); κυριεύσει κυρ[ι]είας πολλῆς — «возобладает великим владычеством»; ποιήσει καθὼς ἂν βούληται — «сотворит, как захочет»."
  4: "συντριβήσεται ἡ βασιλεία αὐτοῦ — «сокрушится царство его»; μερισθήσεται εἰς τοὺς τέσσαρας ἀνέμους τοῦ οὐρανοῦ — «разделится на четыре ветра небесных»; οὐ κατὰ τὴν ἀλκὴν αὐτοῦ οὐδὲ κατὰ τὴν κυριείαν — «не по силе его и не по власти его»; слав. «не в последняя своя, ниже по власти своей» — «не к потомкам его и не по власти», по паритету 子孫に渡るのでも…権力によるのでもない; ἑτέρους διδάξει ταῦτα — «других научит сему»."
  5: "ἐνισχύσει βασιλείαν Αἰγύπτου — «укрепит царство Египетское» (LXX; подлежащее не названо); слав. «укрепится царь южский» (Феодотион), по паритету 南の王. εἷς ἐκ τῶν δυναστῶν κατισχύσει αὐτόν — «один из князей одолеет его»; δυναστεία μεγάλη ἡ δυναστεία αὐτοῦ — «велико владычество его»."
  6: "εἰς συντέλειαν ἐνιαυτῶν ἄξει αὐτούς — «по исполнении лет приведёт их»; εἰσελεύσεται βασιλεὺς Αἰγύπτου εἰς τὴν βασιλείαν τὴν βορρᾶ — «войдёт царь Египетский в царство северное» (LXX); слав. «дщи царя южска внидет к северску царю» — «дочь царя южного придёт к царю северному» (Феодотион), по паритету 南の王の娘. οὐ μὴ κατισχύσῃ — «не удержится»; ὁ βραχίων αὐτοῦ ναρκήσει — «мышца его онемеет»; слав. добавляет «и дева и укрепляяй ю» — 乙女と支えた者."
  7: "ἀναστήσεται φυτὸν ἐκ τῆς ῥίζης αὐτοῦ καθ' ἑαυτόν — «восстанет отрасль от корня его сам по себе» (LXX: αὐτοῦ, муж.); слав. «от цвета корене ея» — «от цвета корня её», по паритету 彼女の根; ἥξει ἐπὶ τὴν δύναμιν αὐτοῦ — «придёт на силу его»; εἰσελεύσεται εἰς τὰς ὀχυρότητας — «войдёт в укрепления»."
  8: "τοὺς θεοὺς αὐτῶν καταστρέψει μετὰ τῶν χωνευτῶν — «богов их ниспровергнет с литыми идолами»; τὸ ἀργύριον καὶ τὸ χρυσίον ἐν αἰχμαλωσίᾳ ἀποίσουσιν εἰς Αἴγυπτον — «серебро и золото унесут в плен в Египет»; καὶ ἔσται ἔτος βασιλεῖ βορρᾶ — «и будет год царю северному» (тёмное; LXX); слав. «той востанет паче царя северска» — «он восстанет выше царя северного», по паритету."
  9: "εἰσελεύσεται εἰς βασιλείαν Αἰγύπτου ἡμέρας — «войдёт в царство Египетское на дни»; слав. «в царство царя южскаго» (без «Египет»), по паритету 南の王の国; ἐπιστρέψει ἐπὶ τὴν γῆν αὐτοῦ — «возвратится в землю свою»."
  10: "καὶ ὁ υἱὸς αὐτοῦ — «и сын его» (LXX, ед. ч.; фраза оборвана); слав. «сынове его» (мн. ч.), по паритету 子ら; ἐρεθισθήσεται — «возбудится»; συνάξει συναγωγὴν ὄχλου πολλοῦ — «соберёт собрание многого народа»; εἰσελεύσεται κατασύρων — «войдёт, увлекая (потоком)»; παρελεύσεται καὶ ἐπιστρέψει — «пройдёт и возвратится», слав. «мимо прейдет и сядет» — 通り過ぎて座り."
  11: "ὀργισθήσεται βασιλεὺς Αἰγύπτου — «разгневается царь Египетский»; πολεμήσει μετὰ βασιλέως βορρᾶ — «будет воевать с царём северным»; παραδοθήσεται ἡ συναγωγὴ εἰς τὰς χεῖρας αὐτοῦ — «предано будет собрание в руки его»; слав. добавляет «и поставит народ мног» — 多くの民を並べる (нет в LXX)."
  12: "λήψεται τὴν συναγωγήν — «возьмёт собрание»; ὑψωθήσεται ἡ καρδία αὐτοῦ — «вознесётся сердце его»; ταράξει πολλοὺς — «смутит многих»; οὐ μὴ φοβηθῇ — «не устрашится» (LXX); слав. «соодолеет тмам, и не укрепеет» — «одолеет тьмы (множества), но не укрепится», по паритету 幾万にも打ち勝つが強くはならない."
  13: "ἐπιστρέψει βασιλεὺς βορρᾶ — «возвратится царь северный»; συνάξει πόλεως συναγωγὴν μείζονα — «соберёт собрание города большее» (тёмное); слав. «приведет народ мног паче прежняго» — 前よりも多くの民; κατὰ συντέλειαν καιροῦ ἐνιαυτοῦ — «по исполнении времени года»; εἰσελεύσεται ἐν ὄχλῳ πολλῷ καὶ ἐν χρήμασι πολλοῖς — «войдёт с многим множеством и многим имуществом»."
  14: "διάνοιαι ἀναστήσονται ἐπὶ τὸν βασιλέα Αἰγύπτου — «помышления восстанут на царя Египетского» (LXX); слав. «мнози востанут на царя южска» — 多くの者が南の王に逆らう; ἀνοικοδομήσει τὰ πεπτωκότα τοῦ ἔθνους σου — «восстановит падшее народа твоего» (LXX); слав. «сынове губителей людий твоих воздвигнутся» — 民を滅ぼす者の子ら, по паритету; ἀναστήσεται εἰς τὸ ἀναστῆσαι τὴν προφητείαν — «восстанет, чтобы воздвигнуть пророчество»; слав. «еже поставити видение» — 幻を成就しようとして; προσκόψουσι — «преткнутся»."
  15: "ἐπελεύσεται βασιλεὺς βορρᾶ — «придёт царь северный»; ἐπιστρέψει τὰ δόρατα αὐτοῦ — «обратит копья свои»; слав. «сотворит окоп» — 包囲の土手; λήψεται τὴν πόλιν τὴν ὀχυράν — «возьмёт город укреплённый»; οἱ βραχίονες βασιλέως Αἰγύπτου στήσονται μετὰ τῶν δυναστῶν αὐτοῦ — «мышцы царя Египетского станут с князьями его» (LXX); слав. «не станут и востанут избраннии его» — 腕は立ち向かえず…選ばれた者たちも立ち上がる; οὐκ ἔσται αὐτῷ ἰσχὺς εἰς τὸ ἀντιστῆναι — «не будет ему силы противостать»."
  16: "ὁ εἰσπορευόμενος ἐπ' αὐτὸν ποιήσει κατὰ τὸ θέλημα αὐτοῦ — «входящий к нему сотворит по воле своей»; οὐκ ἔσται ὁ ἀνθεστηκὼς — «не будет противостоящего»; στήσεται ἐν τῇ χώρᾳ — «станет в земле»; ἐπιτελεσθήσεται πάντα ἐν ταῖς χερσὶν αὐτοῦ — «всё совершится в руках его». Слав. «на земли савеи» (тёмное; вероятно евр. צבי «красота», ср. 11:45); переведено как имя サウェイ, вариант — «прекрасная земля» (ru)."
  17: "δώσει τὸ πρόσωπον αὐτοῦ ἐπελθεῖν βίᾳ πᾶν τὸ ἔργον αὐτοῦ — «обратит лицо своё, чтобы прийти с силой на всё дело своё»; συνθήκας μετ' αὐτοῦ ποιήσεται — «заключит с ним договор»; слав. «праве вся сотворит с ним» — «правое всё сотворит с ним», по паритету すべてを正しく行う; θυγατέρα ἀνθρώπου δώσει αὐτῷ εἰς τὸ φθεῖραι αὐτήν — «дочь человека даст ему, чтобы растлить её»; слав. «дщерь жен» — 女たちの娘; οὐ πείσεται — «не удастся»."
  18: "δώσει τὸ πρόσωπον αὐτοῦ ἐπὶ τὴν θάλασσαν — «обратит лицо своё на море»; λήψεται πολλούς — «возьмёт многих»; ἐπιστρέψει ὀργὴν ὀνειδισμοῦ αὐτῶν ἐν ὅρκῳ — «обратит гнев поношения их в клятве» (тёмное); слав. «погубит князи укоризны своея… укоризна его возвратится ему» — 自分を辱めた君たちを滅ぼす…辱めは彼に返る."
  19: "ἐπιστρέψει τὸ πρόσωπον αὐτοῦ εἰς τὸ κατισχῦσαι τὴν χώραν αὐτοῦ — «обратит лицо своё, чтобы укрепить землю свою»; προσκόψει καὶ πεσεῖται καὶ οὐχ εὑρεθήσεται — «преткнётся, падёт и не найдётся»."
  20: "ἀναστήσεται ἐκ τῆς ῥίζης αὐτοῦ φυτὸν βασιλείας — «восстанет от корня его отрасль царства»; ἀνὴρ τύπτων δόξαν βασιλέως — «муж, поражающий славу царя»; слав. «производяй творяй славу царства» — 王国の栄光を現し出す者; ἐν ἡμέραις ἐσχάταις συντριβήσεται — «в последние дни сокрушится»; οὐκ ἐν ὀργῇ οὐδὲ ἐν πολέμῳ — «не в гневе и не в войне»; слав. «не в лицах, ни в рати» — 顔を合わせるのでも、戦いでもない (тёмное; возможно, «не явно и не в войне»)."
  21: "ἀναστήσεται ἐπὶ τὸν τόπον αὐτοῦ εὐκαταφρόνητος — «восстанет на место его презренный»; οὐ δοθήσεται ἐπ' αὐτὸν δόξα βασιλέως — «не дана будет ему слава царская»; ἥξει ἐξάπινα — «придёт внезапно»; κατισχύσει βασιλεὺς ἐν κληροδοσίᾳ αὐτοῦ — «возобладает царь в наследии его»; слав. «приидет со обилием и соодолеет царству лестьми» — 豊かな富を携え、甘い言葉で王国を奪い取る."
  22: "τοὺς βραχίονας τοὺς συντριβέντας συντρίψει — «мышцы сокрушённые сокрушит»; слав. «мышцы потопляющаго потопятся» (Феодотион) — 押し寄せる者の腕は押し流され; ἀπὸ προσώπου αὐτοῦ — «от лица его»; ἄρχων διαθήκης — «вождь завета», слав. «старейшина завета» — 契約の君."
  23: "μετὰ τῆς διαθήκης καὶ δήμου συνταγέντος μετ' αὐτοῦ — «с заветом и народом, собранным с ним»; ποιήσει ψεῦδος — «сотворит ложь»; ἐπὶ ἔθνος ἰσχυρὸν ἐν ὀλιγοστῷ ἔθνει — «на народ сильный с малым народом»; слав. «от совокуплений к нему сотворит лесть… в мале языце» — 彼に加わった者たちと共に欺きを行い、小さな民で."
  24: "ἐξάπινα ἐρημώσει πόλιν — «внезапно опустошит город» (LXX); слав. «во обилие и в тучныя страны приидет» — 豊かな国々、肥えた地に入り; προνομὴν καὶ σκῦλα καὶ χρήματα αὐτοῖς δώσει — «добычу, добычу и имение им даст»; ἐπὶ τὴν πόλιν τὴν ἰσχυρὰν διανοηθήσεται — «о городе крепком помыслит»; слав. «на египта помыслит» — エジプトに思いを巡らす; οἱ λογισμοὶ αὐτοῦ εἰς μάτην — «помышления его тщетны»."
  25: "ἐγερθήσεται ἡ ἰσχὺς αὐτοῦ καὶ ἡ καρδία αὐτοῦ — «возбудится сила его и сердце его»; ἐπὶ τὸν βασιλέα Αἰγύπτου — «на царя Египетского»; слав. «на царя южскаго» — 南の王; ὁ βασιλεὺς Αἰγύπτου ἐρεθισθήσεται εἰς πόλεμον — «царь Египетский возбудится на войну»; οὐ στήσεται — «не устоит»; διανοηθήσεται ἐπ' αὐτὸν διανοίᾳ — «умыслит против него замысел»."
  26: "καταναλώσουσιν αὐτὸν μέριμναι αὐτοῦ — «поядят его заботы его»; слав. «изядят потребная его» — 彼の糧を食い尽くす者たち; ἀποστρέψουσιν αὐτόν — «отвратят его»; παρελεύσεται καὶ κατασυριεῖ — «пройдёт и просвистит (сметёт)»; слав. «силы разсыплет» — 軍勢を散らす; πεσοῦνται τραυματίαι πολλοί — «падут многие раненые»."
  27: "δύο βασιλεῖς μόνοι δειπνήσουσιν ἐπὶ τὸ αὐτό — «два царя только будут есть вместе»; ἐπὶ μιᾶς τραπέζης φάγονται — «за одним столом будут есть»; ψευδολογήσουσι — «будут лгать»; οὐκ εὐοδωθήσονται — «не преуспеют»; ἔτι γὰρ συντέλεια εἰς καιρόν — «ибо ещё конец на время»; слав. «сердца их на лукавство» — 心を悪に傾け."
  28: "ἐπιστρέψει εἰς τὴν χώραν αὐτοῦ ἐν χρήμασι πολλοῖς — «возвратится в землю свою с многим имуществом»; ἡ καρδία αὐτοῦ ἐπὶ τὴν διαθήκην τοῦ ἁγίου — «сердце его на завет святого»; ποιήσει καὶ ἐπιστρέψει — «сотворит и возвратится»."
  29: "εἰς καιρόν — «на время»; εἰσελεύσεται εἰς Αἴγυπτον — «войдёт в Египет»; слав. «приидет на юг» — 南へ向かう; οὐκ ἔσται ὡς ἡ πρώτη καὶ ἡ ἐσχάτη — «не будет как первая и последняя» (о походе); 初めの時…終わりの時…でない."
  30: "ἥξουσι Ῥωμαῖοι — «придут римляне» (LXX); слав. «исходящии китяне» — «выходящие из Киттима» (キティム), по паритету; ἐξώσουσιν αὐτὸν — «изгонят его»; ἐμβριμήσονται αὐτῷ — «погрозят ему»; слав. «смирится» — 打ちひしがれ; ἐπιστρέψει καὶ ὀργισθήσεται ἐπὶ τὴν διαθήκην τοῦ ἁγίου — «возвратится и разгневается на завет святого»; ἐπιστρέψει καὶ διανοηθήσεται ἐπ' αὐτούς — «обратится и умыслит на них»."
  31: "βραχίονες παρ' αὐτοῦ στήσονται — «мышцы от него станут»; μιανοῦσι τὸ ἅγιον τοῦ φόβου — «осквернят святыню страха» (LXX); слав. «святыню могутства» — 力の聖所; ἀποστήσουσι τὴν θυσίαν — «отставят жертву»; δώσουσι βδέλυγμα ἐρημώσεως — «дадут мерзость запустения»; в корпусе 荒廃の憎むべきもの (Мк 13:14)."
  32: "ἐν ἁμαρτίαις διαθήκης μιανοῦσιν — «в грехах завета осквернят»; ἐν σκληρῷ λαῷ — «в жёстком народе»; слав. «беззаконнующии завет наведут со прелестию» — нарушающие завет будут вовлекать с лестью, отсюда 甘い言葉で人を引き込む; ὁ δῆμος ὁ γινώσκων ταῦτα — «народ, знающий это»; слав. «людие ведуще Бога своего» — 自分の神を知る民; κατισχύσουσι καὶ ποιήσουσι — «укрепятся и сотворят»."
  33: "οἱ ἐννοούμενοι τοῦ ἔθνους — «размышляющие из народа» (смыслящие); συνήσουσιν εἰς πολλούς — «уразумеют для многих»; προσκόψουσι ῥομφαίᾳ — «преткнутся (падут) от меча»; παλαιωθήσονται ἐν αὐτῇ — «обветшают в нём»; ἐν αἰχμαλωσίᾳ καὶ ἐν προνομῇ ἡμερῶν — «в плену и в расхищении дней»; слав. «в мечи и в пламени» — 剣と炎."
  34: "ὅταν συντρίβωνται — «когда сокрушатся»; συνάξουσιν ἰσχὺν βραχεῖαν — «соберут малую силу»; ἐπισυναχθήσονται ἐπ' αὐτοὺς πολλοὶ — «присоединятся к ним многие»; ἐπὶ πόλεως καὶ πολλοὶ ὡς ἐν κληροδοσίᾳ — «на город и многие как в наследии» (тёмное); слав. «со прелестию» — 偽りをもって."
  35: "ἐκ τῶν συνιέντων — «из разумеющих»; διανοηθήσονται εἰς τὸ καθαρίσαι ἑαυτοὺς — «умыслят очистить себя»; ἐκλεγῆναι — «избрать»; καθαρισθῆναι — «очиститься»; ἕως καιροῦ συντελείας — «до времени конца»; ἔτι καιρὸς εἰς ὥρας — «ещё время на часы»; слав. «еже разжещи я» — 火で焼き (LXX «очистить»)."
  36: "ποιήσει κατὰ τὸ θέλημα αὐτοῦ ὁ βασιλεύς — «сотворит по воле своей царь»; ὑψωθήσεται ἐπὶ πάντα θεόν — «возвысится над всяким богом»; ἐπὶ τὸν θεὸν τῶν θεῶν ἔξαλλα λαλήσει — «на Бога богов скажет чуждое (хульное)»; εὐοδωθήσεται — «будет успешен»; ἕως ἂν συντελεσθῇ ἡ ὀργή — «доколе не совершится гнев»; εἰς αὐτὸν γὰρ συντέλεια γίνεται — «ибо на него конец бывает»."
  37: "ἐπὶ τοὺς θεοὺς τῶν πατέρων αὐτοῦ οὐ μὴ προνοηθῇ — «о богах отцов его не помыслит»; ἐν ἐπιθυμίᾳ γυναικὸς οὐ μὴ προνοηθῇ — «и о желании женщины не помыслит» (LXX; вероятно, о культе Адониса/Таммуза); слав. «и рачении жен» — 女への望み; ὅτι ἐν παντὶ ὑψωθήσεται — «ибо во всём возвысится»; ὑποταγήσεται αὐτῷ ἔθνη ἰσχυρά — «покорятся ему народы сильные», у слав. нет — внесено."
  38: "ἐπὶ τὸν τόπον αὐτοῦ κινήσει καὶ θεόν — «на месте его подвигнет и бога» (LXX, тёмное); слав. «бога маозима на месте своем прославит» — マオジムの神; ὃν οὐκ ἔγνωσαν οἱ πατέρες αὐτοῦ — «которого не знали отцы его»; τιμήσει ἐν χρυσίῳ καὶ ἀργυρίῳ καὶ λίθῳ πολυτελεῖ — «почтит золотом, серебром и драгоценным камнем»."
  39: "ποιήσει πόλεων — «сотворит городам» (LXX, тёмное); εἰς ὀχύρωμα ἰσχυρὸν ἥξει — «придёт в крепкое укрепление»; μετὰ θεοῦ ἀλλοτρίου — «с чужим богом»; πληθυνεῖ δόξαν — «умножит славу»; κατακυριεύσει αὐτοῦ ἐπὶ πολύ — «возобладает им надолго»; χώραν ἀπομεριεῖ εἰς δωρεάν — «землю разделит в дар»; слав. «тверделем убежищ» — 砦を備えた避難所."
  40: "καθ' ὥραν συντελείας — «в час конца»; συγκερατισθήσεται αὐτῷ ὁ βασιλεὺς Αἰγύπτου — «сразится с ним царь Египетский» (LXX; подлежащее — южный царь); слав. «сразится ратию с царем южским» (подлежащее — северный); в тексте по LXX, чтобы подлежащее не терялось: 南の王が彼と戦いを交える; ἐποργισθήσεται — «устремится в ярости»; ἐν ἅρμασι καὶ ἵπποις πολλοῖς καὶ πλοίοις πολλοῖς — «с колесницами, конями и кораблями»."
  41: "ἐπελεύσεται εἰς τὴν χώραν μου — «придёт в землю мою» (LXX; «мою» — от лица Бога/пророка); слав. «на землю саваимску» — サワイムの地 (тёмное); πολλοὶ ἐξασθενήσουσιν — «многие изнемогут»; σωθήσονται ἀπὸ τῆς χειρὸς αὐτοῦ — «спасутся от руки его»; Εδωμ καὶ Μωαβ καὶ ἀρχὴ υἱῶν Αμμων — «Едом, Моав и начало сынов Аммона»."
  42: "ἐν χώρᾳ Αἰγύπτου οὐκ ἔσται ἐν αὐτῇ διασῳζόμενος — «в земле Египетской не будет в ней спасаемого» (LXX); слав. «прострет руку свою на землю, и земля египетска не будет во спасение» — 手を地に伸ばし、エジプトの地は救いを得ない."
  43: "κρατήσει τοῦ τόπου τοῦ χρυσίου καὶ τοῦ τόπου τοῦ ἀργυρίου — «овладеет местом золота и местом серебра»; πάσης τῆς ἐπιθυμίας Αἰγύπτου — «всего вожделенного Египта»; Λίβυες καὶ Αἰθίοπες ἔσονται ἐν τῷ ὄχλῳ αὐτοῦ — «ливийцы и эфиопы будут в полчище его» (LXX); слав. «в тверделех их» — その砦ごと, по паритету."
  44: "ἀκοὴ ταράξει αὐτὸν ἀπὸ ἀνατολῶν καὶ βορρᾶ — «слух встревожит его с востока и севера»; ἐξελεύσεται ἐν θυμῷ ἰσχυρῷ — «выйдет в сильной ярости»; ῥομφαίᾳ ἀφανίσαι καὶ ἀποκτεῖναι πολλούς — «мечом истребить и убить многих»; слав. «слышания и поткщания» — 知らせ (неясное слово, возможно «помыслы»)."
  45: "στήσει αὐτοῦ τὴν σκηνὴν ἀνὰ μέσον τῶν θαλασσῶν — «поставит шатёр свой между морями»; τοῦ ὄρους τῆς θελήσεως τοῦ ἁγίου — «горы воли святого» (LXX); слав. «на горе святей савеи» — 聖なるサウェイの山 (тёмное, вероятно евр. צבי «красота»); слав. «ефадано» при «кущи» — неясное слово, в тексте не передано; ἥξει ὥρα τῆς συντελείας αὐτοῦ — «придёт час конца его»; слав. «приидет даже до части ея» — 山の分のところまで来る; οὐκ ἔσται ὁ βοηθῶν αὐτῷ — «не будет помогающего ему»."
