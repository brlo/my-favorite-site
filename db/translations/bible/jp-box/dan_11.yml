verses:
  1: "「わたしはクロス王[おう]の第一年[だいいちねん]に、彼[かれ]の支配[しはい]と力[ちから]となって立[た]った。」"
  2: "「今[いま]、わたしはあなたに真実[しんじつ]を告[つ]げる。見[み]よ、ペルシアにはなお三人[さんにん]の王[おう]が立[た]つ。四人目[よにんめ]はすべての者[もの]をはるかに越[こ]える大[おお]きな富[とみ]を得[え]、その富[とみ]によって強[つよ]くなると、ギリシアのすべての王国[おうこく]に立[た]ち向[む]かう。"
  3: "そして、強[つよ]い王[おう]が立[た]ち、大[おお]きな支配[しはい]を握[にぎ]って、思[おも]いのままに行[おこな]う。"
  4: "彼[かれ]が立[た]つと、その王国[おうこく]は砕[くだ]かれ、天[てん]の四方[しほう]の風[かぜ]に分[わ]けられる。それは彼[かれ]の子孫[しそん]に渡[わた]るのでも、彼[かれ]が握[にぎ]った権力[けんりょく]によるのでもない。その王国[おうこく]は引[ひ]き抜[ぬ]かれ、これら以外[いがい]の者[もの]たちに与[あた]えられるからである。」"
  5: "「南[みなみ]の王[おう]は強[つよ]くなる。しかし、その君[きみ]たちの一人[ひとり]が彼[かれ]にまさって強[つよ]くなり、彼[かれ]の支配[しはい]を越[こ]える大[おお]きな支配[しはい]を握[にぎ]る。"
  6: "幾年[いくとせ]かたつと、彼[かれ]らは結[むす]びつく。南[みなみ]の王[おう]の娘[むすめ]が北[きた]の王[おう]のもとへ行[い]き、彼[かれ]と契約[けいやく]を結[むす]ぼうとする。しかし、彼女[かのじょ]は腕[うで]の力[ちから]を保[たも]てず、その子孫[しそん]も立[た]たない。彼女[かのじょ]は引[ひ]き渡[わた]される。彼女[かのじょ]を連[つ]れて来[き]た者[もの]たちも、乙女[おとめ]も、時[とき]の間[あいだ]彼女[かのじょ]を支[ささ]えた者[もの]も同[おな]じである。"
  7: "しかし、彼女[かのじょ]の根[ね]から一[ひと]つの芽[め]が立[た]ち、彼[かれ]の備[そな]えの場所[ばしょ]へ来[き]て、力[ちから]を帯[お]び、北[きた]の王[おう]の砦[とりで]に入[はい]り、そこで事[こと]を行[おこな]って勝[か]ちを得[え]る。"
  8: "彼[かれ]は彼[かれ]らの神々[かみがみ]と鋳物[いもの]の像[かたち]、銀[ぎん]と金[きん]のすべての望[のぞ]ましい器[うつわ]を、捕[と]らわれた者[もの]たちと共[とも]にエジプトへ運[はこ]ぶ。彼[かれ]は北[きた]の王[おう]よりも強[つよ]く立[た]つ。"
  9: "彼[かれ]は南[みなみ]の王[おう]の国[くに]に入[はい]り、自分[じぶん]の地[ち]へ帰[かえ]る。"
  10: "彼[かれ]の子[こ]らは強[つよ]い多[おお]くの民[たみ]を集[あつ]める。来[く]る者[もの]は入[はい]って来[き]て押[お]し流[なが]し、通[とお]り過[す]ぎて座[すわ]り、ついには彼[かれ]の砦[とりで]にまで下[くだ]る。"
  11: "南[みなみ]の王[おう]は激[はげ]しく怒[いか]って出[で]て行[い]き、北[きた]の王[おう]と戦[たたか]い、多[おお]くの民[たみ]を並[なら]べる。その民[たみ]は彼[かれ]の手[て]に渡[わた]される。"
