  15: "北[きた]の王[おう]は来[き]て包囲[ほうい]の土手[どて]を築[きず]き、堅[かた]い町[まち]々[まち]を取[と]る。南[みなみ]の王[おう]の腕[うで]は立[た]ち向[む]かえず、その選[えら]ばれた者[もの]たちも起[お]こり立[た]つが、立[た]ち向[む]かう力[ちから]はない。"
