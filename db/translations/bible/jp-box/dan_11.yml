# jp-box, Даниил, глава 11. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 11 (совпадает).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX) или
# слав. чтения (Маозим, савеи/саваимску); особые случаи оговорены в notes.
#
# Содержание: 1 ангел укрепляет Кира в первый год; 2–4 три царя Персии, четвёртый
# богач, сильный царь (Александр) и разделение его царства на четыре ветра;
# 5–9 царь южный и князь, дочь южного царя у северного, её гибель, отрасль её корня;
# 10–20 войны юга и севера: сыновья, многолюдные войска, укреплённые города,
# «прекрасная земля», дочь женщин, острова, гибель у крепости своей земли;
# 21–24 презренный, лесть, малый народ, богатые страны; 25–28 война с южным царём,
# заговор в трапезе, возвращение с богатством, завет святого; 29–35 второй поход,
# китяне, осквернение святыни, прекращение жертвы, мерзость запустения, разумные;
# 36–39 царь, возвышающийся над всяким богом, Маозим, чуждый бог;
# 40–45 последний поход, Едом/Моав/Аммон, Египет, Ливия и Эфиопия, шатёр между
# морями, конец без помощника.
# Голоса: 1–45 — непрерывная речь ангела в 「…» (она началась в 10:20–21 и
# продолжается в 12:1–4); для чтения разбита на пять абзацев: 1; 2–4; 5–20;
# 21–35; 36–45. Формул «и сказал» в главе нет; вложенной речи нет.
# Термины: 南[みなみ]の王[おう]/北[きた]の王[おう] (βασιλεὺς Αἰγύπτου / βορρᾶ),
# 契約[けいやく] (διαθήκη), 聖所[せいしょ] (ἅγιον), 常[じょう]の犠牲[ぎせい] (θυσία),
# 荒廃[こうはい]の憎[にく]むべきもの (βδέλυγμα ἐρημώσεως, как Мк 13:14),
# キティム (Κίτιοι/Ῥωμαῖοι), マオジム (μαωζείμ/מָעוּזִּים).
#
