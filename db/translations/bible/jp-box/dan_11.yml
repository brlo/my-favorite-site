  21: "「彼[かれ]の備[そな]えの場所[ばしょ]に、蔑[さげす]まれた者[もの]が立[た]つ。人[ひと]々[びと]は彼[かれ]に王国[おうこく]の栄光[えいこう]を与[あた]えない。しかし、彼[かれ]は豊[ゆた]かな富[とみ]を携[たずさ]えて来[き]て、甘[あま]い言葉[ことば]で王国[おうこく]を奪[うば]い取[と]る。"
