# jp-box, Иезекииль, глава 43. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 43 (совпадает; см. карту 20/21).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: возвращение славы Господней в храм. 1–5 слава идёт с востока и
# наполняет дом; 6–12 голос из дома: место престола и стоп, обличение
# осквернения имени, повеление показать дом и его устройство, «закон храма»;
# 13–17 размеры жертвенника (локоть с ладонью, углубление, уступы, ариэль, рога,
# ступени); 18–27 уставы жертвенника: тельцы и козлы за грех, соль, семь дней
# очищения, с восьмого дня — всесожжения и жертвы спасения.
# Голоса: 1–5 авторское описание; 6 — описание (голос из дома); 7–12 — слово
# Господа в 「…」 (закрывается в 12); 13–17 описание; 18–27 — слово Господа
# в 「…」 (открывается словами «и сказал мне», закрывается в 27).
# «Точка»: в этой главе нет.
# Имена и термины: 主[しゅ]の栄光[えいこう] (δόξα κυρίου), 至聖[しせい] (ἅγια ἁγίων),
# 祭壇[さいだん] (θυσιαστήριον), アリエル (αριηλ), 角[つの] (κέρατα),
# 台[だい] (ἱλαστήριον — уступ жертвенника), 燔祭[はんさい] (ὁλοκαύτωμα),
# 犠牲[ぎせい] (θυσία), 救[すく]いの犠牲[ぎせい] (σωτήριον), キュビト (πῆχυς),
# 手幅[てはば] (παλαιστή), スパン (σπιθαμή), サドク (Σαδδουκ).
#
