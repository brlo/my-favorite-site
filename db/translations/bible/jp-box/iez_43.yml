verses:
  1: "彼[かれ]はわたしを東[ひがし]に面[めん]した門[もん]へ連[つ]れて行[い]き、わたしを連[つ]れ出[だ]した。"
  2: "見[み]よ、イスラエルの神[かみ]の栄光[えいこう]が、東[ひがし]に面[めん]した門[もん]の道[みち]に沿[そ]って来[き]た。その陣営[じんえい]の声[こえ]は多[おお]くの者[もの]が声[こえ]を倍[ばい]にするような声[こえ]であり、地[ち]はその栄光[えいこう]によって周[まわ]りに光[ひかり]を放[はな]った。"
  3: "わたしが見[み]た幻[まぼろし]は、わたしが都[みやこ]に油[あぶら]を塗[ぬ]るために行[い]ったとき見た幻のようであり、わたしが見た車[くるま]の幻は、ケバル川[がわ]のほとりで見た幻のようであった。わたしは顔[かお]を地[ち]に付[つ]けて倒[たお]れた。"
  4: "主[しゅ]の栄光[えいこう]は、東[ひがし]に面[めん]した門[もん]の道[みち]に沿[そ]って神殿[しんでん]に入[はい]った。"
  5: "霊[れい]がわたしを取[と]り上[あ]げ、わたしを内庭[ないてい]へ連[つ]れて行[い]った。見[み]よ、主[しゅ]の家[いえ]は主の栄光[えいこう]で満[み]ちていた。"
  6: "わたしは立[た]った。見[み]よ、神殿[しんでん]からわたしに語[かた]る声[こえ]があり、あの男[おとこ]はわたしのそばに立[た]っていた。"
  7: "彼[かれ]はわたしに言[い]った。「人[ひと]の子[こ]よ、わたしの王座[おうざ]の場所[ばしょ]と、わたしの足[あし]の裏[うら]の場所[ばしょ]を見[み]たか。そこにわたしの名[な]が、イスラエルの家[いえ]の真[ま]ん中[なか]に、とこしえに住[す]まう。イスラエルの家[いえ]は、彼[かれ]らもその君[きみ]たちも、淫行[いんこう]と、彼らの間[あいだ]で君たちが行[おこな]った殺害[さつがい]とによって、もはやわたしの聖[せい]なる名[な]を汚[けが]さない。"
  8: "彼[かれ]らがわたしの前庭[まえにわ]を自分[じぶん]たちの前庭[まえにわ]に置[お]き、わたしの戸口[とぐち]の柱[はしら]を自分たちの戸口の柱[はしら]のそばに置[お]いて、わたしと彼らとの間[あいだ]に一[ひと]つの壁[かべ]があるだけにしたとき、彼らはその行[おこな]った不法[ふほう]によって、わたしの聖なる名を汚した。そこでわたしは怒[いか]りと殺戮[さつりく]の中[なか]で彼らを滅[ほろ]ぼした。"
  9: "今[いま]、彼らは自分[じぶん]たちの淫行[いんこう]と、君[きみ]たちの殺害[さつがい]をわたしから遠[とお]ざけよ。そうすれば、わたしは彼らの真[ま]ん中[なか]にとこしえに住[す]まう。"
  10: "人[ひと]の子[こ]よ、あなたはイスラエルの家[いえ]にこの神殿[しんでん]を示[しめ]せ。そうすれば、彼らは自分[じぶん]の罪[つみ]から離[はな]れる。その姿[すがた]とその配置[はいち]をも示せ。"
  11: "彼[かれ]らは、自分[じぶん]が行[おこな]ったすべてのことについて、その罰[ばつ]を受[う]ける。あなたは神殿[しんでん]とその出口[でぐち]とその入口[いりぐち]とその造[つく]りと、そのすべての規定[きてい]とそのすべての掟[おきて]を彼らに知[し]らせ、彼らの前[まえ]に描[えが]け。そうすれば、彼らはわたしのすべての定[さだ]めとすべての規定[きてい]を守[まも]り、それを行[おこな]う。"
  12: "山[やま]の頂[いただき]にある神殿[しんでん]の図面[ずめん]はこうである。その周[まわ]りのすべての境界[きょうかい]は至聖[しせい]である。」"
  13: "これが神殿[しんでん]の法則[ほうそく]であり、これが祭壇[さいだん]の寸法[すんぽう]である。一[いっ]キュビトは一キュビトと一手幅[てはば]とする。基[もと]のくぼみの深[ふか]さは一キュビト、幅[はば]も一キュビト、その縁[ふち]の周[まわ]りの張[は]り出[だ]しは一[ひと]スパンである。これが祭壇[さいだん]の高[たか]さである。"
  14: "そのくぼみの底[そこ]から下[した]の大[おお]きな台[だい]まで二[に]キュビト、幅[はば]は一[いっ]キュビト。小[ちい]さな台から大きな台まで四[よん]キュビト、幅[はば]は一キュビトである。"
  15: "アリエルは四[よん]キュビト、アリエルから上[うえ]の角[つの]の上[うえ]までは一[いっ]キュビトである。"
  16: "アリエルは長[なが]さ十二[じゅうに]キュビト、幅[はば]十二キュビトで、四方[しほう]に四角[しかく]であった。"
  17: "台[だい]は長[なが]さ十四[じゅうよん]キュビト、幅[はば]十四キュビトで、四方[しほう]に四角[しかく]であった。その周[まわ]りを巡[めぐ]る縁[ふち]は半[はん]キュビト、その周囲[しゅうい]の帯[おび]は一[いっ]キュビトであった。その階段[かいだん]は東[ひがし]に面[めん]していた。"
  18: "彼[かれ]はわたしに言[い]った。「人[ひと]の子[こ]よ、イスラエルの神[かみ]である主[しゅ]なる神[かみ]はこう言[い]われる。これが祭壇[さいだん]の規定[きてい]である。祭壇が造[つく]られて、その上[うえ]に燔祭[はんさい]をささげ、それに血[ち]を注[そそ]ぐ日[ひ]のためのものである。"
  19: "あなたは、レビ人[びと]の祭司[さいし]たち、すなわちわたしに近[ちか]づき、わたしに仕[つか]えるためにサドクの血筋[ちすじ]から出[で]た者[もの]たちに、罪[つみ]のための雄牛[おうし]の子[こ]を与[あた]えよ、と主[しゅ]なる神[かみ]は言[い]われる。"
  20: "彼らはその血[ち]を取[と]り、祭壇[さいだん]の四[よっ]つの角[つの]と、台[だい]の四[よっ]つの隅[すみ]と、周[まわ]りの基[もと]に付[つ]ける。こうして彼らは祭壇を贖[あがな]い、清[きよ]める。"
  21: "彼らは罪[つみ]のための雄牛[おうし]の子[こ]を取[と]り、神殿[しんでん]の定[さだ]められた場所[ばしょ]で、聖[せい]なる所[ところ]の外[そと]で焼[や]く。"
  22: "第二[だいに]の日[ひ]には、罪[つみ]のために、傷[きず]のない山羊[やぎ]の子[こ]二[に]匹[ひき]を取[と]り、雄牛[おうし]の子で贖[あがな]ったときと同[おな]じように、祭壇[さいだん]を贖う。"
  23: "あなたが贖[あがな]いを終[お]えた後[あと]、彼らは傷[きず]のない雄牛[おうし]の子[こ]と、傷のない雄羊[おひつじ]を群[む]れから連[つ]れて来[き]る。"
  24: "あなたがたはそれらを主[しゅ]の前[まえ]にささげよ。祭司[さいし]たちはその上[うえ]に塩[しお]をまき、それらを主への燔祭[はんさい]としてささげる。"
  25: "七[なな]日[か]の間[あいだ]、あなたは罪[つみ]のために日[ひ]ごとに山羊[やぎ]の子[こ]をささげ、雄牛[おうし]の子[こ]と雄羊[おひつじ]を群[む]れから取[と]って、傷[きず]のないものをささげよ。彼らは七日の間そうする。"
  26: "七[なな]日[か]の間、彼らは祭壇[さいだん]を贖[あがな]って清[きよ]め、自分[じぶん]の手[て]を満[み]たす。"
  27: "彼らが七日の間[あいだ]を終[お]えると、八日目[ようかめ]から後[あと]、祭司[さいし]たちは祭壇[さいだん]の上[うえ]であなたがたの燔祭[はんさい]と、あなたがたの救[すく]いの犠牲[ぎせい]をささげる。わたしはあなたがたを受[う]け入[い]れる、と主[しゅ]は言[い]われる。」"

notes:
  1: "ἤγαγέν με ἐπὶ τὴν πύλην τὴν βλέπουσαν κατὰ ἀνατολάς — «привёл меня к воротам, смотрящим на восток»; ἐξήγαγέν με — «вывел меня». Слав. «веде мя… и изведе мя»."
  2: "δόξα θεοῦ Ισραηλ — «слава Бога Израилева»; ἤρχετο κατὰ τὴν ὁδὸν τῆς πύλης — «шла по пути ворот»; φωνὴ τῆς παρεμβολῆς — «голос стана (ополчения)» (παρεμβολή); ὡς φωνὴ διπλασιαζόντων πολλῶν — «как голос многих, удваивающих [голос]» (διπλασιάζω); ἐξέλαμπεν — «просияла» (ἐκλάμπω); φέγγος — «сияние» (слав. «свет»)."
  3: "ἡ ὅρασις, ἣν εἶδον — «видение, которое я видел»; ὅτε εἰσεπορευόμην τοῦ χρῖσαι τὴν πόλιν — «когда я входил, чтобы помазать город» (χρίω — помазывать; тёмное место, ср. 9:4, где ставится знак; слав. «помазати град»); ἡ ὅρασις τοῦ ἅρματος — «видение колесницы» (車); ἐπὶ τοῦ ποταμοῦ τοῦ Χοβαρ — «у реки Ховар» (ケバル川, форма корпуса); πίπτω ἐπὶ πρόσωπόν μου — «падаю на лицо моё»."
  4: "δόξα κυρίου — «слава Господня» (主の栄光); εἰσῆλθεν εἰς τὸν οἶκον — «вошла в дом»; κατὰ τὴν ὁδὸν τῆς πύλης — «по пути ворот»."
  5: "ἀνέλαβέν με πνεῦμα — «поднял меня дух» (πνεῦμα, 霊); εἰς τὴν αὐλὴν τὴν ἐσωτέραν — «во внутренний двор» (内庭); πλήρης δόξης κυρίου ὁ οἶκος — «полон славы Господней дом»."
  6: "φωνὴ ἐκ τοῦ οἴκου λαλοῦντος πρός με — «голос из дома, говорящего ко мне»; ὁ ἀνὴρ εἱστήκει ἐχόμενός μου — «муж стоял подле меня» (ἔχομαι — держаться, быть рядом)."
  7: "τὸν τόπον τοῦ θρόνου μου — «место престола Моего» (王座); τὸν τόπον τοῦ ἴχνους τῶν ποδῶν μου — «место следа ног Моих» (ἴχνος — след); κατασκηνώσει τὸ ὄνομά μου — «будет обитать имя Моё» (κατασκηνόω — ставить шатёр, обитать); τὸν αἰῶνα — «в век, навсегда»; βεβηλόω — «осквернять» (汚す); οἱ ἡγούμενοι — «вожди, князья» (君たち); ἐν τῇ πορνείᾳ — «в блужении» (淫行); ἐν τοῖς φόνοις τῶν ἡγουμένων — «в убийствах вождей» (φόνος; слав. «во убийствах старейшин»; ru «трупами царей» — иное чтение)."
  8: "τὸ πρόθυρόν μου ἐν τοῖς προθύροις αὐτῶν — «преддверие Моё в преддвериях их» (πρόθυρον); φλιάς — «косяки, столбы дверей» (戸口の柱); ἔδωκαν τὸν τοῖχόν μου ὡς συνεχόμενον ἐμοῦ καὶ αὐτῶν — «сделали стену Мою как бы смежною Мне и им»; ἐβεβήλωσαν — «осквернили»; ἐξέτριψα — «истребил, стёр» (ἐκτρίβω); ἐν θυμῷ καὶ ἐν φόνῳ — «в ярости и в убийстве» (殺戮)."
  9: "ἀπωσάσθωσαν — «да отринут» (ἀπωθέω); τὴν πορνείαν — «блужение»; τοὺς φόνους τῶν ἡγουμένων — «убийства вождей»; κατασκηνώσω ἐν μέσῳ αὐτῶν τὸν αἰῶνα — «вселюсь среди них навсегда»."
  10: "δεῖξον τῷ οἴκῳ Ισραηλ τὸν οἶκον — «покажи дому Израилеву дом»; κοπάσουσιν ἀπὸ τῶν ἁμαρτιῶν — «перестанут от грехов» (κοπάζω — прекращать); τὴν ὅρασιν αὐτοῦ — «вид его»; τὴν διάταξιν — «расположение, устройство» (配置)."
  11: "λήμψονται τὴν κόλασιν αὐτῶν — «примут наказание своё» (κόλασις; слав. «казнь»); διαγράψεις τὸν οἶκον — «опишешь (начертаешь) дом»; τὰς ἐξόδους — «выходы» (出口); τὴν ὑπόστασιν — «основание, состав» (слав. «уготование», «бытие»); τὰ προστάγματα — «повеления» (規定); τὰ νόμιμα — «уставы, законы» (掟); δικαιώματα — «оправдания, уставы» (定め); γνωριεῖς — «дашь знать»; φυλάξονται — «сохранят». Слав. добавляет «и входы его» (入口) — нет в LXX, внесено."
  12: "διαγραφὴ τοῦ οἴκου ἐπὶ τῆς κορυφῆς τοῦ ὄρους — «описание (чертёж) дома на вершине горы» (図面); πάντα τὰ ὅρια αὐτοῦ κυκλόθεν ἅγια ἁγίων — «все пределы его кругом — святое святых» (至聖). Здесь слово Господа закрывается."
  13: "τὰ μέτρα τοῦ θυσιαστηρίου — «меры жертвенника» (祭壇); ἐν πήχει τοῦ πήχεος καὶ παλαιστῆς — «локтем локтя и ладони» (παλαιστή — ладонь, 手幅), т. е. локоть с прибавлением ладони; κόλπωμα — «углубление, недро» (基のくぼみ); βάθος ἐπὶ πῆχυν — «глубина в локоть»; γεῖσος — «выступ, карниз» (縁の張り出し); σπιθαμή — «пядь» (スパン); καὶ τοῦτο τὸ ὕψος τοῦ θυσιαστηρίου — «и это высота жертвенника» (これが祭壇の高さ). Слав. добавляет в начале «сей закон храма» (これが神殿の法則; нет в LXX, внесено) и ставит «сия высота требника» в начало ст. 14 — здесь, по LXX, в конце ст. 13."
  14: "ἀπὸ βάθους τῆς ἀρχῆς τοῦ κοιλώματος — «от глубины начала углубления»; ἱλαστήριον τὸ μέγα τὸ ὑποκάτωθεν — «великое очистилище, что внизу» (ἱλαστήριον здесь — уступ жертвенника; слав. «очистилище»; 台); πηχῶν δύο — «два локтя»; τὸ εὖρος πήχεος — «ширина локоть»; ἀπὸ τοῦ ἱλαστηρίου τοῦ μικροῦ ἐπὶ τὸ μέγα — «от малого уступа к великому»; τέσσαρες — «четыре»."
  15: "τὸ αριηλ — «ариэль» (евр. огненный очаг, жертвенник; アリエル, транслитерация; слав. «ариил»); πηχῶν τεσσάρων — «четыре локтя»; ἀπὸ τοῦ αριηλ καὶ ὑπεράνω τῶν κεράτων πῆχυς — «от ариэля и выше рогов — локоть»."
  16: "τὸ αριηλ πηχῶν δώδεκα — «ариэль двенадцати локтей»; μήκους ἐπὶ πήχεις δώδεκα πλάτους — «длины на двенадцать локтей ширины»; τετράγωνον ἐπὶ τὰ τέσσαρα μέρη — «четырёхугольный на четыре стороны»."
  17: "τὸ ἱλαστήριον — «уступ (площадка)»; 14×14; γεῖσος κυκλούμενον ἥμισυ πήχεος — «карниз, обходящий кругом, в поллоктя»; κύκλωμα — «окружение, обвод» (帯); κλιμακτῆρες — «ступени» (階段); βλέποντες κατ᾽ ἀνατολάς — «обращённые к востоку»."
  18: "τάδε λέγει κύριος ὁ θεὸς Ισραηλ — «так говорит Господь Бог Израилев» (слав. «Господь Бог израилев»); προστάγματα τοῦ θυσιαστηρίου — «уставы жертвенника»; ἐν ἡμέρᾳ ποιήσεως αὐτοῦ — «в день создания его»; ἀναφέρειν ὁλοκαυτώματα — «возносить всесожжения» (燔祭); προσχέειν αἷμα — «возливать кровь» (血を注ぐ)."
  19: "τοῖς ἱερεῦσι τοῖς Λευίταις — «священникам-левитам» (レビ人の祭司); τοῖς ἐκ τοῦ σπέρματος Σαδδουκ — «из семени Садока» (サドク); τοῖς ἐγγίζουσι πρός με — «приближающимся ко Мне»; τοῦ λειτουργεῖν μοι — «служить Мне»; μόσχον ἐκ βοῶν — «тельца из волов» (雄牛の子); περὶ ἁμαρτίας — «за грех»."
  20: "λήμψονται ἐκ τοῦ αἵματος — «возьмут крови»; ἐπιθήσουσιν — «возложат» (слав. «да возложат», затем «окропиши» — разночтение); τέσσαρα κέρατα — «четыре рога» (角); τέσσαρας γωνίας τοῦ ἱλαστηρίου — «четыре угла уступа» (隅); βάσις — «основание» (基); ἐξιλάσονται — «совершат очищение, умилостивление» (贖う); καθαριοῦσιν — «очистят» (清める)."
  21: "τὸν μόσχον τὸν περὶ ἁμαρτίας — «тельца за грех»; κατακαυθήσεται — «сожжён будет» (焼く); ἐν τῷ ἀποκεχωρισμένῳ τοῦ οἴκου — «на отделённом [месте] дома» (ἀποκεχωρισμένος — отделённый; 定められた場所); ἔξωθεν τῶν ἁγίων — «вне святых [мест]»."
  22: "τῇ ἡμέρᾳ τῇ δευτέρᾳ — «во второй день»; ἐρίφους δύο αἰγῶν — «двух козлов» (山羊の子二匹); ἀμώμους — «непорочных» (傷のない); ἐξιλάσονται τὸ θυσιαστήριον — «очистят жертвенник»; καθότι ἐξιλάσαντο ἐν τῷ μόσχῳ — «как очистили тельцом». В ru один козёл (МТ), в LXX и слав. — два."
  23: "μετὰ τὸ συντελέσαι σε τὸν ἐξιλασμόν — «после того как ты завершишь очищение»; προσοίσουσι — «принесут»; μόσχον ἐκ βοῶν ἄμωμον — «тельца из волов непорочного»; κριὸν ἐκ προβάτων — «овна из овец» (雄羊)."
  24: "προσοίσετε ἐναντίον κυρίου — «принесёте пред Господа»; ἐπιρρίψουσιν ἅλα — «бросят соль» (塩); ἀνοίσουσιν ὁλοκαυτώματα — «вознесут всесожжения»."
  25: "ἑπτὰ ἡμέρας — «семь дней»; ποιήσεις ἔριφον ὑπὲρ ἁμαρτίας καθ᾽ ἡμέραν — «совершишь козла за грех каждый день»; μόσχον ἐκ βοῶν καὶ κριὸν ἐκ προβάτων — «тельца из волов и овна из овец»; ἄμωμα — «непорочных»; ποιήσουσιν — «сделают»."
  26: "ἑπτὰ ἡμέρας — «семь дней»; ἐξιλάσονται τὸ θυσιαστήριον — «очистят жертвенник»; καθαριοῦσιν — «освятят, очистят»; πλήσουσιν χεῖρας αὐτῶν — «наполнят руки свои» (идиома посвящения; слав. «наполнят руки своя»)."
  27: "ἀπὸ τῆς ἡμέρας τῆς ὀγδόης καὶ ἐπέκεινα — «с восьмого дня и далее» (八日目から後); τὰ ὁλοκαυτώματα ὑμῶν — «всесожжения ваши»; τὰ τοῦ σωτηρίου ὑμῶν — «[жертвы] спасения вашего» (σωτήριον — мирная/спасительная жертва; 救いの犠牲); προσδέξομαι ὑμᾶς — «приму вас» (受け入れる). Слав. добавляет в начале «и скончают седмь дний» (彼らが七日の間を終えると) — нет в LXX, внесено."
