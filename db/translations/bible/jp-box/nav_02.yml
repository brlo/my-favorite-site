verses:
  1: "ヌンの子[こ]ヨシュアは、サティンから二人[ふたり]の若者[わかもの]を斥候[せっこう]として送[おく]り、言[い]った。「上[のぼ]って行[ゆ]き、あの地[ち]とエリコを見[み]よ。」二人の若者は出[で]かけてエリコに入[はい]り、ラハブという名[な]の娼婦[しょうふ]の家[いえ]に入って、そこに宿[やど]った。"
  2: "エリコの王[おう]に告[つ]げる者[もの]があって言[い]った。「イスラエルの子[こ]らの男[おとこ]たちが、この地[ち]を探[さぐ]るために、ここに入[はい]り込[こ]んでいます。」"
  3: "エリコの王[おう]はラハブに使者[ししゃ]を遣[つか]わして言[い]った。「あなたの家[いえ]に夜[よる]入[はい]って来[き]た者[もの]たちを引[ひ]き出[だ]せ。彼[かれ]らはこの地[ち]を探[さぐ]るために来たのだ。」"
  4: "女[おんな]はその人[ひと]たちを連[つ]れて行[い]って隠[かく]し、彼[かれ]らに言[い]った。「その男[おとこ]たちはわたしのところに来[き]ました。"
  5: "夕暗[ゆうやみ]になって町[まち]の門[もん]が閉[と]じられるころ、あの男[おとこ]たちは出[で]て行[い]きました。どこへ行ったのか、わたしには分[わ]かりません。彼[かれ]らの後[あと]を追[お]ってください。あなたがたは追いつくでしょう。」"
  6: "彼女[かのじょ]は彼[かれ]らを屋上[おくじょう]に上[のぼ]らせ、屋上に積[つ]み上[あ]げてあった亜麻[あま]の茎[くき]の中[なか]に隠[かく]した。"
  7: "その人[ひと]たちは、ヨルダン川[がわ]へ向[む]かう道[みち]、渡[わた]し場[ば]へと彼[かれ]らの後[あと]を追[お]って行[い]った。そして門[もん]は閉[と]じられた。"
  8: "追[お]う者[もの]たちが出[で]て行[い]くと、若者[わかもの]たちがまだ眠[ねむ]らないうちに、彼女[かのじょ]は屋上[おくじょう]の彼[かれ]らのところへ上[のぼ]って行った。"
  9: "そして彼[かれ]らに言[い]った。「主[しゅ]があなたがたにこの地[ち]を与[あた]えられたことを、わたしは知[し]っています。あなたがたへの恐[おそ]れが、わたしたちに打[う]ち寄[よ]せているからです。"
  10: "あなたがたがエジプトの地[ち]から出[で]て来[き]たとき、主[しゅ]なる神[かみ]があなたがたの前[まえ]で紅海[こうかい]を干[ひ]からしたこと、またヨルダン川[がわ]の向[む]こうにいたアモリ人[じん]の二人[ふたり]の王[おう]、シホンとオグにあなたがたがしたこと、その王たちをあなたがたが聖絶[せいぜつ]したことを、わたしたちは聞[き]きました。"
  11: "それを聞[き]いて、わたしたちは心[こころ]が挫[くじ]けました。あなたがたのゆえに、あなたがたに立[た]ち向[む]かう気力[きりょく]は、もはやわたしたちのうちの誰[だれ]にもありません。あなたがたの神[かみ]である主[しゅ]は、上[うえ]の天[てん]にも、下[した]の地[ち]にもおられる神だからです。"
  12: "ですから今[いま]、わたしがあなたがたに恩[おん]を施[ほどこ]したように、あなたがたもわたしの父[ちち]の家[いえ]に恩を施すことを、主[しゅ]なる神[かみ]によってわたしに誓[ちか]ってください。"
  13: "そして、わたしの父[ちち]の家[いえ]と母[はは]と兄弟[きょうだい]たち、わたしの家のすべての者[もの]、彼[かれ]らに属[ぞく]するすべてのものを生[い]かし、わたしの命[いのち]を死[し]から救[すく]い出[だ]してください。」"
  14: "その人[ひと]たちは彼女[かのじょ]に言[い]った。「あなたがたに代[か]わって、わたしたちの命[いのち]は死[し]に渡[わた]ります。」彼女は言った。「主[しゅ]があなたがたにこの町[まち]を渡すとき、わたしに真実[しんじつ]の恩[おん]を施[ほどこ]してください。」"
  15: "そして、彼女[かのじょ]は窓[まど]から彼[かれ]らをつり下[お]ろした。"
  16: "そして彼[かれ]らに言[い]った。「あなたがたを追[お]う者[もの]たちがあなたがたに出会[であ]わないように、山[やま]の方[ほう]へ行[い]きなさい。そして、あなたがたを追う者たちが引[ひ]き返[かえ]すまで、三日[みっか]の間[あいだ]、そこに隠[かく]れていなさい。その後[あと]、あなたがたは自分[じぶん]の道[みち]へ行きなさい。」"
  17: "その人[ひと]たちは彼女[かのじょ]に言[い]った。「わたしたちは、あなたのこの誓[ちか]いについて責[せき]を負[お]いません。"
  18: "見[み]よ、わたしたちがこの町[まち]の一部[いちぶ]に入[はい]るとき、あなたはしるしを置[お]きなさい。すなわち、わたしたちをそれでつり下[お]ろした窓[まど]に、この緋[ひ]の紐[ひも]を結[むす]びつけなさい。また、あなたの父[ちち]と母[はは]と兄弟[きょうだい]たち、あなたの父の家[いえ]のすべての者[もの]を、あなたの家に、自分[じぶん]のもとに集[あつ]めなさい。"
  19: "あなたの家[いえ]の戸口[とぐち]から外[そと]に出[で]る者[もの]は、すべて自分[じぶん]の責任[せきにん]となる。わたしたちは、あなたのこの誓[ちか]いについて責[せき]を負[お]わない。しかし、あなたとともにあなたの家にいる者については、わたしたちが責を負う。"
  20: "もしだれかがわたしたちを害[そこ]ない、あるいはわたしたちのこれらの話[はなし]を漏[も]らすなら、わたしたちは、あなたのこの誓[ちか]いについて責[せき]を負[お]わない。」"
  21: "彼女[かのじょ]は言[い]った。「あなたがたの言葉[ことば]のとおりに、そのようになりますように。」そして彼女は彼[かれ]らを送[おく]り出[だ]した。"
  22: "彼[かれ]らは行[ゆ]って山[やま]に入[はい]り、そこに三日[みっか]とどまった。追[お]う者[もの]たちはすべての道[みち]を探[さが]し回[まわ]ったが、見[み]つからなかった。"
  23: "二人[ふたり]の若者[わかもの]は引[ひ]き返[かえ]して山[やま]を下[お]り、渡[わた]ってヌンの子[こ]ヨシュアのところへ行[ゆ]き、自分[じぶん]たちに起[お]こったすべてのことを彼[かれ]に話[はな]した。"
  24: "彼[かれ]らはヨシュアに言[い]った。「主[しゅ]はこの地[ち]すべてをわたしたちの手[て]に渡[わた]されました。この地に住[す]む者[もの]はみな、わたしたちを恐[おそ]れて震[ふる]えています。」"

notes:
  1: "κατασκοπεῦσαι — «высмотреть, разведать» (κατασκοπεύω); в слав. добавлено «втай», в греч. этого слова нет. ἐκ Σαττιν — «из Саттина» (слав. «из саттина»; у Синодального «из Ситтима» — масоретская форма). οἰκίαν γυναικὸς πόρνης — «дом женщины-блудницы»; 娼婦. κατέλυσαν — «остановились на ночлег» (καταλύω)."
  2: "ἀπηγγέλη τῷ βασιλεῖ — «донесено было царю» (безличная форма; ἀπαγγέλλω). λέγοντες — «говоря» (слав. «глаголюще»). εἰσπεπόρευνται — perfect: «вошли, проникли»; в слав. добавлено «в сию нощь», в греч. нет. τῶν υἱῶν Ισραηλ — «из сынов Израиля»."
  3: "ἀπέστειλεν ὁ βασιλεὺς ... καὶ εἶπεν πρὸς Ρααβ — «послал царь ... и сказал Раав»: приказ передаётся через посыльных. ἐξάγαγε — «выведи» (ἐξάγω). τοὺς εἰσπεπορευμένους ... τὴν νύκτα — «вошедших ... ночью». ἥκασιν — «пришли» (ἥκω)."
  4: "λαβοῦσα ἡ γυνὴ τοὺς ἄνδρας ἔκρυψεν — «взяв женщина мужей, скрыла их» (слав. «поемши жена ... сокры»). В LXX ст. 4 кончается на «вошли ко мне мужи»; слов «но не знаю, откуда они» здесь нет — это добавление слав. и Синодального (масоретский текст), в LXX они в ст. 5."
  5: "ὡς δὲ ἡ πύλη ἐκλείετο ἐν τῷ σκότει — «когда же ворота затворялись в темноте» (σκότος; слав. «в сумраки»). οὐκ ἐπίσταμαι ποῦ πεπόρευνται — «не знаю, куда пошли» (ἐφίστημι — знать). καταδιώξατε — «гонитесь» (καταδιώκω). εἰ καταλήμψεσθε — «если настигнете»: условная форма при повелении, по-японски передана утверждением «настигнете»."
  6: "δῶμα — кровля, 屋上. λινοκαλάμη — «льняная солома, стебли льна» (слав. «паздере льняне»); 亜麻の茎. ἐστοιβασμένῃ — «сложенной в ряд, в копну» (στοιβάζω)."
  7: "ὁδὸν τὴν ἐπὶ τοῦ Ιορδάνου ἐπὶ τὰς διαβάσεις — «дорогою к Иордану, к переправам» (διάβασις — переправа, брод); 渡し場. ἡ πύλη ἐκλείσθη — «ворота затворились»; «тотчас» у Синодального — добавка."
  8: "πρὶν ἢ κοιμηθῆναι αὐτούς — «прежде нежели они легли спать» (κοιμάομαι). Ст. 8 в LXX обрывается без «и сказала им»; речь начинается в ст. 9, поэтому по-японски здесь конец предложения, а не ввод речи."
  9: "Ἐπίσταμαι ὅτι δέδωκεν ὑμῖν κύριος τὴν γῆν — «знаю, что предал вам Господь землю». ἐπιπέπτωκεν ὁ φόβος ὑμῶν ἐφ᾿ ἡμᾶς — «напал страх ваш на нас» (ἐπιπίπτω; слав. «нападе бо страх ваш на ны»)."
  10: "κατεξήρανεν — «иссушил» (καταξηραίνω); ἐρυθρὰ θάλασσα — 紅海, букв. «Чермное море». τοῖς δυσὶ βασιλεῦσιν τῶν Αμορραίων — «двум царям Аморрейским»; τῷ Σηων καὶ Ωγ — «Сигону и Огу» (в LXX греческие формы Σηων, Ωγ). ἐξωλεθρεύσατε — «истребили, предали заклятию» (ἐξολεθρεύω; слав. «потребисте»)."
  11: "ἐξέστημεν τῇ καρδίᾳ ἡμῶν — «изумились сердцем нашим» (ἐξίστημι; слав. «ужасохомся в сердцы нашем»). οὐκ ἔστη ἔτι πνεῦμα ἐν οὐδενὶ ἡμῶν — букв. «не встал уже дух ни в ком из нас», т. е. не осталось мужества. ἀπὸ προσώπου ὑμῶν — «от лица вашего». θεὸς ἐν οὐρανῷ ἄνω καὶ ἐπὶ τῆς γῆς κάτω — «Бог на небе вверху и на земле внизу»."
  12: "ὀμόσατέ μοι κύριον τὸν θεόν — «поклянитесь мне Господом Богом» (ὀμνύω с вин.). ὅτι ποιῶ ὑμῖν ἔλεος — «что я делаю вам милость» (ἔλεος — милость). В LXX ст. 12 кончается здесь; «и дадите мне знамение истинно» — добавление слав. и Синодального (масоретский текст)."
  13: "ζωγρήσετε — «оставите живыми» (ζωγρέω — брать живым; слав. «оживите»). В LXX нет «сестёр моих» — они есть в слав. и Синодальном. ἐξελεῖσθε τὴν ψυχήν μου ἐκ θανάτου — «избавите душу мою от смерти»: в греч. единственное число, в слав. «душы нашя». Конец речи Рахаб."
  14: "ἡ ψυχὴ ἡμῶν ἀνθ᾿ ὑμῶν εἰς θάνατον — «душа наша вместо вас на смерть» (ἀντί — вместо). ποιήσετε εἰς ἐμὲ ἔλεος καὶ ἀλήθειαν — «сотворите мне милость и истину» (устойчивая пара, слав. «милость и истину»). В LXX нет условия «если не объявишь нас» — оно в слав. и Синодальном."
  15: "κατεχάλασεν αὐτοὺς διὰ τῆς θυρίδος — «спустила их через окно» (χαλάω — опускать; θυρίς — оконце). Ст. 15 в LXX короткий: «ибо дом её при стене» и «привязала верёвку» — добавления слав. и Синодального (масоретский текст)."
  16: "τὴν ὀρεινήν — «нагорную страну» (山地). μὴ συναντήσωσιν ὑμῖν οἱ καταδιώκοντες — «чтобы не встретили вас преследующие». ἕως ἂν ἀποστρέψωσιν — «доколе не возвратятся» (ἀποστρέφω). κρυβήσεσθε — «скроетесь» (κρύπτω)."
  17: "Ἀθῷοί ἐσμεν τῷ ὅρκῳ σου τούτῳ — «неповинны мы в клятве твоей сей» (ἀθῷος — невиновный; ὅρκος — клятва; слав. «неповинни есмы клятве сей твоей»). В LXX стих обрывается на двоеточии, продолжение — в ст. 18."
  18: "θήσεις τὸ σημεῖον — «положишь знамение»: знамением служит сама верёвка. τὸ σπαρτίον τὸ κόκκινον — «шнур багряный» (σπαρτίον — верёвка, шнур; κόκκινος — багряный); 緋の紐. ἐκδήσεις εἰς τὴν θυρίδα — «привяжешь к окну» (ἐκδέω). συνάξεις πρὸς σεαυτήν — «соберёшь к себе» (συνάγω)."
  19: "ἔνοχος ἑαυτῷ ἔσται — «повинен будет самому себе», т. е. сам и ответит (ἔνοχος — виновный). ἡμεῖς δὲ ἀθῷοι — «мы же неповинны». В LXX в конце просто «мы будем повинны»; слов «если рука коснётся его» нет — это добавка слав. и Синодального."
  20: "ἀδικήσῃ — «обидит» (ἀδικέω). ἀποκαλύψῃ τοὺς λόγους ἡμῶν τούτους — «откроет слова наши сии» (ἀποκαλύπτω — раскрыть, выдать). ἐσόμεθα ἀθῷοι — «будем неповинны». Конец речи мужей."
  21: "Κατὰ τὸ ῥῆμα ὑμῶν οὕτως ἔστω — «по слову вашему да будет так» (ἔστω — повелительное 3-го л.). ἐξαπέστειλεν — «отпустила» (ἐξαποστέλλω). В LXX ст. 21 кончается здесь; «и привязала верёвку червлёную у окна» — добавление слав. и Синодального (масоретский текст)."
  22: "κατέμειναν ἐκεῖ τρεῖς ἡμέρας — «пробыли там три дня» (καταμένω). ἐξεζήτησαν πάσας τὰς ὁδούς — «обыскали все дороги» (ἐκζητέω). οὐχ εὕροσαν — «не нашли»."
  23: "διέβησαν πρὸς Ἰησοῦν — «перешли к Иисусу»: в LXX не сказано «Иордан», слово добавлено в слав. в скобках. διηγήσαντο — «рассказали» (διηγέομαι). τὰ συμβεβηκότα αὐτοῖς — «случившееся с ними» (συμβαίνω)."
  24: "Παρέδωκεν κύριος πᾶσαν τὴν γῆν ἐν χειρὶ ἡμῶν — «предал Господь всю землю в руку нашу». κατέπτηκεν — «пришли в страх, оробели» (καταπτήσσω). ἀφ᾿ ἡμῶν — «от нас», т. е. из-за нас (слав. «от нас»)."
