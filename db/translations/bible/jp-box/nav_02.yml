# jp-box, Иисус Навин, глава 2. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в этой главе нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 2: соглядатаи и Рахаб (1), донесение царю и его посыльные (2–7),
# исповедание Рахаб и договор (8–14), спуск по верёвке и наставление (15–16),
# клятва мужей и знак — червлёная верёвка (17–21), возвращение и донесение (22–24).
# Речь людей — 「…」: 1, 2, 3, 4–5, 9–13, 14 (дважды), 16, 17–20, 21, 24.
# Красного и синего нет.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (проверено по базе).
# Сносок ⟨…⟩ нет: 娼婦, 亜麻, 屋上, 緋, 紐, 斥候 уже есть в корпусе; новых терминов нет.
