verses:
  0: "指揮者[しきしゃ]のために。賛美[さんび]のうちに。アサフの詩[うた]、アッシリア人[じん]のための歌[うた]。"
  1: "神[かみ]はユダで知[し]られ、その名[な]はイスラエルで大[おお]きい。"
  2: "その住[す]まいは平和[へいわ]のうちにあり、その住[す]みかはシオンにある。"
  3: "そこで彼[かれ]は弓[ゆみ]の力[ちから]、盾[たて]、剣[つるぎ]、戦[いくさ]を砕[くだ]かれた。"
  4: "あなたは永遠[えいえん]の山[やま]から、驚[おどろ]くほどに光[ひかり]を放[はな]つ。"
  5: "心[こころ]の愚[おろ]かな者[もの]たちはみな動揺[どうよう]し、自分[じぶん]たちの眠[ねむ]りに眠[ねむ]った。富[とみ]を手[て]にした者[もの]たちも、何[なに]も見[み]いだせなかった。"
  6: "ヤコブの神[かみ]よ、あなたの叱[しか]りによって、馬[うま]に乗[の]る者[もの]たちもまどろみに落[お]ちた。"
  7: "あなたは恐[おそ]るべき方[かた]であり、あなたの怒[いか]りのとき、誰[だれ]があなたの前[まえ]に立[た]てようか。"
  8: "あなたは天[てん]から裁[さば]きを告[つ]げ知[ら]せ、地[ち]は恐[おそ]れて静[しず]まった。"
  9: "神[かみ]が裁[さば]きのために立[た]ち上[あ]がり、地[ち]のすべての柔和[にゅうわ]な者[もの]を救[すく]うとき。"
  10: "人[ひと]の思[おも]いはあなたに感謝[かんしゃ]をささげ、思[おも]いの残[のこ]りもあなたを祝[いわ]う。"
  11: "あなたがたは誓[ちか]いをし、あなたがたの神[かみ]である主[しゅ]に果[は]たしなさい。主[しゅ]の周[まわ]りにいる者[もの]たちはみな、恐[おそ]るべき方[かた]に贈[おく]り物[もの]をささげる。"
  12: "君主[くんしゅ]たちの霊[れい]を取[と]り去[さ]る恐[おそ]るべき方[かた]に。地[ち]の王[おう]たちにとって、その方[かた]は恐[おそ]るべきである。"

notes:
  0: "Εἰς τὸ τέλος, ἐν ὕμνοις — «в конец, в песнях», т. е. начальнику хора, на гимновый лад; ψαλμὸς τῷ Ασαφ, ᾠδὴ πρὸς τὸν Ἀσσύριον — アサフの詩、アッシリア人のための歌 (πρός — «к, для»; смысл ремарки тёмен). Надписание — стих 0."
  1: "Γνωστὸς ἐν τῇ Ιουδαίᾳ ὁ θεός — 神はユダで知られ. ἐν τῷ Ισραηλ μέγα τὸ ὄνομα αὐτοῦ — その名はイスラエルで大きい."
  2: "ἐγενήθη ἐν εἰρήνῃ ὁ τόπος αὐτοῦ — その住まいは平和のうちにあり (εἰρήνη — «мир»). τὸ κατοικητήριον αὐτοῦ ἐν Σιων — その住みかはシオンにある. Церк. чтение «в Салиме» (Σαλημ) в gr-lxx-byz отсутствует; переведено по gr, 〔…〕 не ставятся."
  3: "ἐκεῖ συνέτριψεν τὰ κράτη τῶν τόξων — そこで弓の力を砕いた (κράτος — «сила, крепость»). ὅπλον καὶ ῥομφαίαν καὶ πόλεμον — 盾、剣、戦 (ὅπλον — «оружие, щит»; по церковному чтению 盾; ῥομφαία — «меч, палаш»)."
  4: "φωτίζεις σὺ θαυμαστῶς ἀπὸ ὀρέων αἰωνίων — 永遠の山から驚くほどに光を放つ (φωτίζω — «светить, просвещать»; ὄρη αἰώνια — «горы вечные»)."
  5: "ἐταράχθησαν πάντες οἱ ἀσύνετοι τῇ καρδίᾳ — 心の愚かな者たちはみな動揺した (ἀσύνετος — «неразумный»). ὕπνωσαν ὕπνον αὐτῶν — 自分たちの眠りに眠った. οὐχ εὗρον οὐδὲν πάντες οἱ ἄνδρες τοῦ πλούτου ταῖς χερσὶν αὐτῶν — 富を手にした者たちも何も見いだせなかった."
  6: "ἀπὸ ἐπιτιμήσεώς σου, ὁ θεὸς Ιακωβ — ヤコブの神よ、あなたの叱りによって (ἐπιτίμησις — «прещение»). ἐνύσταξαν οἱ ἐπιβεβηκότες τοὺς ἵππους — 馬に乗る者たちもまどろみに落ちた (νυστάζω — «дремать»)."
  7: "σὺ φοβερὸς εἶ — あなたは恐るべき方. τίς ἀντιστήσεταί σοι — 誰が立ち向かえようか (ἀνθίστημι — «противостоять»). ἀπὸ τότε ἡ ὀργή σου — «с того времени гнев Твой»; передано 怒りのとき, смысл сохранён."
  8: "ἐκ τοῦ οὐρανοῦ ἠκούτισας κρίσιν — 天から裁きを告げ知らせた (ἀκουτίζω — «возвещать»). γῆ ἐφοβήθη καὶ ἡσύχασεν — 地は恐れて静まった (ἡσυχάζω — «успокаиваться»)."
  9: "ἐν τῷ ἀναστῆναι εἰς κρίσιν τὸν θεόν — 神が裁きのために立ち上がるとき. τοῦ σῶσαι πάντας τοὺς πραεῖς τῆς γῆς — 地のすべての柔和な者を救うために (πραΰς — «кроткий»). Стих продолжает ст. 8, поэтому оставлен придаточным."
  10: "ἐνθύμιον ἀνθρώπου ἐξομολογήσεταί σοι — 人の思いはあなたに感謝をささげる (ἐνθύμιον — «помышление»). ἐγκατάλειμμα ἐνθυμίου ἑορτάσει σοι — 思いの残りもあなたを祝う (ἐγκατάλειμμα — «остаток»; ἑορτάζω — «праздновать»). В евр. здесь «ярость человека», LXX — ἐνθύμιον; следуем LXX."
  11: "εὔξασθε καὶ ἀπόδοτε κυρίῳ τῷ θεῷ ὑμῶν — 誓いをし、あなたがたの神である主に果たしなさい (εὔχομαι — «давать обет»; ἀποδίδωμι — «воздавать»). πάντες οἱ κύκλῳ αὐτοῦ οἴσουσιν δῶρα — 主の周りにいる者たちはみな贈り物をささげる."
  12: "τῷ φοβερῷ καὶ ἀφαιρουμένῳ πνεύματα ἀρχόντων — 君主たちの霊を取り去る恐るべき方に (ἀφαιρέω — «отнимать»; ἀρχή — «начальство, князь»). φοβερῷ παρὰ τοῖς βασιλεῦσι τῆς γῆς — 地の王たちにとって恐るべき方. Датив продолжает ст. 11 (кому приносят дары)."
