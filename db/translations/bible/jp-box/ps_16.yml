verses:
  0: "ダビデの祈[いの]り。"
  1: "主[しゅ]よ、わたしの正[ただ]しさに耳[みみ]を傾[かたむ]け、わたしの願[ねが]いに心[こころ]を向[む]け、欺[あざむ]く唇[くちびる]によらないわたしの祈[いの]りに聞[き]き入[い]れてください。"
  2: "わたしの裁[さば]きがあなたの顔[かお]から出[で]てくるように。あなたの目[め]がまっすぐなことを見[み]るように。"
  3: "あなたはわたしの心[こころ]を試[ため]し、夜[よる]に訪[おとず]れて、わたしを火[ひ]で試[ため]された。しかし、わたしのうちに不義[ふぎ]は見[み]つからなかった。"
  4: "わたしの口[くち]が人[ひと]のわざを語[かた]らないために、あなたの唇[くちびる]の言葉[ことば]によって、わたしは厳[きび]しい道[みち]を守[まも]った。"
  5: "わたしの歩[あゆ]みをあなたの道[みち]に据[す]えてください。わたしの足[あし]が揺[ゆ]らがないように。"
  6: "神[かみ]よ、わたしはあなたに叫[さけ]んだ。あなたはわたしの声[こえ]を聞[き]いてくださった。あなたの耳[みみ]をわたしに傾[かたむ]け、わたしの言葉[ことば]を聞[き]いてください。"
  7: "あなたに寄[よ]り頼[たの]む者[もの]を、あなたの右[みぎ]の手[て]に逆[さから]う者[もの]から救[すく]う方[かた]よ。あなたのあわれみを驚[おどろ]くべきものとして示[しめ]してください。"
  8: "わたしを、目[め]の瞳[ひとみ]のように守[まも]ってください。あなたの翼[つばさ]の陰[かげ]で、わたしを覆[おお]ってください。"
  9: "わたしを苦[くる]しめる悪[わる]い者[もの]の顔[かお]から。わたしの敵[てき]はわたしの魂[たましい]を取[と]り囲[かこ]んだ。"
  10: "彼[かれ]らは自分[じぶん]の脂[あぶら]を閉[と]じ込[こ]め、その口[くち]で高[たか]ぶりを語[かた]った。"
  11: "今[いま]、彼[かれ]らはわたしを追[お]い出[だ]して取[と]り囲[かこ]み、その目[め]を地[ち]に傾[かたむ]けようと構[かま]えた。"
  12: "彼[かれ]らはわたしを捕[つか]まえた。獲物[えもの]に備[そな]えた獅子[しし]のように、隠[かく]れ場[ば]に住[す]む小[こ]獅子[じし]のように。"
  13: "主[しゅ]よ、立[た]ち上[あ]がって、彼[かれ]らに先[さき]んじて彼[かれ]らの足[あし]を折[お]り、あなたの剣[つるぎ]をもって、わたしの魂[たましい]を悪[わる]い者[もの]から、あなたの手[て]の敵[てき]から救[すく]い出[だ]してください。"
  14: "主[しゅ]よ、彼[かれ]らを地[ち]から、わずかな者[もの]から、その生[せい]のうちに分[わ]け離[はな]してください。彼[かれ]らの腹[はら]はあなたの隠[かく]したもので満[み]たされ、子[こ]らに飽[あ]き足[た]りて、その残[のこ]りを幼[おさな]い者[もの]たちに残[のこ]した。"
  15: "しかし、わたしは義[ぎ]をもってあなたの顔[かお]の前に現[あらわ]れる。あなたの栄[えい]光[こう]が現[あらわ]れるとき、わたしは満[み]ち足[た]りる。"

notes:
  0: "Προσευχὴ τοῦ Δαυιδ — ダビデの祈り. Надписание — стих 0."
  1: "Εἰσάκουσον, κύριε, τῆς δικαιοσύνης μου — 主よ、わたしの正しさに耳を傾け (εἰσακούω + род. — «услышать»). πρόσχες τῇ δεήσει μου — わたしの願いに心を向け (προσέχω — «внимать»; δέησις — «прошение»). ἐνώτισαι τῆς προσευχῆς μου οὐκ ἐν χείλεσιν δολίοις — 欺く唇によらないわたしの祈りに聞き入れてください (ἐνωτίζομαι — «внимать»; χείλη δόλια — «уста льстивые»)."
  2: "ἐκ προσώπου σου τὸ κρίμα μου ἐξέλθοι — わたしの裁きがあなたの顔から出てくるように (κρίμα — «суд, приговор»; оптатив передан 〜ように). οἱ ὀφθαλμοί μου ἰδέτωσαν εὐθύτητας — あなたの目がまっすぐなことを見るように (εὐθύτης — «прямота»; plural — まっすぐなこと)."
  3: "ἐδοκίμασας τὴν καρδίαν μου — あなたはわたしの心を試し (δοκιμάζω — «испытывать»). ἐπεσκέψω νυκτός — 夜に訪れて (ἐπισκέπτομαι — «посещать»). ἐπύρωσάς με — わたしを火で試された (πυρόω — «прокаливать, испытывать огнём»). καὶ οὐχ εὑρέθη ἐν ἐμοὶ ἀδικία — しかし、わたしのうちに不義は見つからなかった."
  4: "ὅπως ἂν μὴ λαλήσῃ τὸ στόμα μου τὰ ἔργα τῶν ἀνθρώπων — わたしの口が人のわざを語らないために (ἔργα τῶν ἀνθρώπων — «дела человеческие»). διὰ τοὺς λόγους τῶν χειλέων σου — あなたの唇の言葉によって. ἐγὼ ἐφύλαξα ὁδοὺς σκληράς — わたしは厳しい道を守った (σκληρός — «жёсткий, жестокий»; смысл тёмный: хранил себя от жестоких путей; передано буквально)."
  5: "κατάρτισαι τὰ διαβήματά μου ἐν ταῖς τρίβοις σου — わたしの歩みをあなたの道に据えてください (καταρτίζω — «устроять, утверждать»; διάβημα — «шаг»; τρίβος — «тропа»). ἵνα μὴ σαλευθῶσιν τὰ διαβήματά μου — わたしの足が揺らがないように (σαλεύω — «колебать»)."
  6: "ἐγὼ ἐκέκραξα, ὅτι ἐπήκουσάς μου, ὁ θεός — 神よ、わたしはあなたに叫んだ、あなたはわたしの声を聞いてくださった (κράζω — «взывать»; ἐπακούω — «услышать»). κλῖνον τὸ οὖς σου ἐμοὶ καὶ εἰσάκουσον τῶν ῥημάτων μου — あなたの耳をわたしに傾け、わたしの言葉を聞いてください (κλίνω τὸ οὖς — «приклонить ухо»; ῥῆμα — «слово»)."
  7: "θαυμάστωσον τὰ ἐλέη σου — あなたのあわれみを驚くべきものとして示してください (θαυμαστόω — «делать дивным»; ἔλεος — あわれみ). ὁ σῴζων τοὺς ἐλπίζοντας ἐπὶ σὲ ἐκ τῶν ἀνθεστηκότων τῇ δεξιᾷ σου — あなたに寄り頼む者を、あなたの右の手に逆らう者から救う方よ (ἀνθίστημι — «противиться»; δεξιά — «правая рука», образ силы)."
  8: "φύλαξόν με ὡς κόραν ὀφθαλμοῦ — わたしを、目の瞳のように守ってください (κόρη ὀφθαλμοῦ — «зеница ока»; 瞳). ἐν σκέπῃ τῶν πτερύγων σου σκεπάσεις με — あなたの翼の陰で、わたしを覆ってください (σκέπη — «покров, сень»; πτέρυξ — 翼; σκεπάζω — «покрывать»)."
  9: "ἀπὸ προσώπου ἀσεβῶν τῶν ταλαιπωρησάντων με — わたしを苦しめる悪い者の顔から (ταλαιπωρέω — «мучить, угнетать»; продолжает ст. 8, поэтому стих начинается с «…から»). οἱ ἐχθροί μου τὴν ψυχήν μου περιέσχον — わたしの敵はわたしの魂を取り囲んだ (περιέχω — «окружать, обступать»)."
  10: "τὸ στέαρ αὐτῶν συνέκλεισαν — 彼らは自分の脂を閉じ込め (στέαρ — «тук, жир»; συνκλείω — «затворять»; образ сытого, закрытого сердца, ср. церковнослав. «тук свой затвориша»). τὸ στόμα αὐτῶν ἐλάλησεν ὑπερηφανίαν — その口で高ぶりを語った (ὑπερηφανία — «гордость, надменность»)."
  11: "ἐκβάλλοντές με νυνὶ περιεκύκλωσάν με — 今、彼らはわたしを追い出して取り囲み (ἐκβάλλω — «выгонять»; κυκλόω — «окружать»). τοὺς ὀφθαλμοὺς αὐτῶν ἔθεντο ἐκκλῖναι ἐν τῇ γῇ — その目を地に傾けようと構えた (ἐκκλίνω — «склонять»; образ: смотрят в землю, чтобы не быть узнанными, или чтобы наброситься)."
  12: "ὑπέλαβόν με ὡσεὶ λέων ἕτοιμος εἰς θήραν — 彼らはわたしを捕まえた、獲物に備えた獅子のように (ὑπολαμβάνω — «подхватывать, принимать»; θήρα — «охота, лов»). ὡσεὶ σκύμνος οἰκῶν ἐν ἀποκρύφοις — 隠れ場に住む小獅子のように (σκύμνος — «львёнок»; ἀπόκρυφος — «сокровенное место»)."
  13: "ἀνάστηθι, κύριε, πρόφθασον αὐτοὺς — 主よ、立ち上がって、彼らに先んじて (προφθάνω — «предупреждать, опережать»). ὑποσκέλισον αὐτούς — 彼らの足を折り (ὑποσκελίζω — «подсекать ноги», ед. в LXX, гапакс; передано 足を折る, чтобы не смешивать с くじく «растянуть»). ῥῦσαι τὴν ψυχήν μου ἀπὸ ἀσεβοῦς — わたしの魂を悪い者から救い出してください (ῥύομαι — «избавлять»). ῥομφαίαν σου ἀπὸ ἐχθρῶν τῆς χειρός σου — あなたの剣をもって、あなたの手の敵から (ῥομφαία — «меч»; τῆς χειρός σου — «руки Твоей»)."
  14: "κύριε, ἀπὸ ὀλίγων ἀπὸ γῆς διαμέρισον αὐτοὺς ἐν τῇ ζωῇ αὐτῶν — 主よ、彼らを地から、わずかな者から、その生のうちに分け離してください (διαμερίζω — «разделять, наделять»; место тёмное и спорное: «от немногих на земле отдели их в жизни их», т. е. дай им долю только здесь; передано буквально, без выбора толкования). τῶν κεκρυμμένων σου ἐπλήσθη ἡ γαστὴρ αὐτῶν — 彼らの腹はあなたの隠したもので満たされ (γαστήρ — «чрево»; κεκρυμμένα — «сокрытое»). ἐχορτάσθησαν υἱῶν — 子らに飽き足りて (χορτάζω — «насыщать»). ἀφῆκαν τὰ κατάλοιπα τοῖς νηπίοις αὐτῶν — その残りを幼い者たちに残した (κατάλοιπα — «остатки»; νήπιος — «младенец»)."
  15: "ἐγὼ δὲ ἐν δικαιοσύνῃ ὀφθήσομαι τῷ προσώπῳ σου — しかし、わたしは義をもってあなたの顔の前に現れる (ὀφθήσομαι — «явлюсь»). χορτασθήσομαι ἐν τῷ ὀφθῆναι τὴν δόξαν σου — あなたの栄光が現れるとき、わたしは満ち足りる (χορτάζω — «насыщаться»; δόξα — 栄光)."
