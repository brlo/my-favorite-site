# jp-box, Псалтирь, псалом 16. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0.
# Псалом 16 (LXX; евр. 17): «Услышь, Господи, правду мою» — молитва о суде (1–2),
# испытание сердца ночью (3), хранение от дел человеческих (4), утверждение стоп (5),
# просьба услышать (6), дивная милость спасающего (7), хранение как зеницы (8–9),
# гордость и жадность врагов (10–12), восстание Господа (13),
# часть нечестивых в сей жизни (14), насыщение лицезрением (15).
# Красного и синего нет. Прямой речи людей и Бога нет; кавычек в главе нет.
# 〔…〕 нет: все слова в gr-lxx-byz есть.
# セラ в этом псалме нет; διάψαλμα не передаётся — по решению пользователя, как у jp-joc.
# Сносок ⟨…⟩ нет: 陰府, 瞳, 翼 уже в корпусе или понятны.
# jp-ni не использовался.

