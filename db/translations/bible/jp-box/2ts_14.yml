# jp-box, 2-я Царств, глава 14. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет,
# jp-ni (под авторским правом) не использовался.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 14: замысел Иоава и женщина из Фекои (1–3), её притча о двух сыновьях
# (4–11), речь о царе и изгнаннике (12–17), царь узнаёт руку Иоава (18–20),
# возвращение Авессалома без права видеть лицо царя (21–24), красота Авессалома
# и его волосы (25–27), два года в Иерусалиме и поджог поля Иоава (28–32),
# примирение с царём (33).
# Речь — 「…」: Иоав (2–3, 22), женщина (4, 5–7, 9, 11, 12, 13–17, 18, 19–20),
# царь (5, 8, 10, 12, 18, 21, 24), Авессалом (30, 32), слуги Иоава (30).
# Непрерывная речь женщины 13–17 не закрывается на границах стихов; в 17 внутри
# неё — 『…』 (её же слова).
# Красного нет.
# Гл. 14 — по новому паритету. Слав. вставок, которых нет в LXX, здесь нет;
# расхождения csl/LXX отмечены в notes (14:1, 14:5, 14:14, 14:17). Где csl и LXX
# расходятся по слову, взят csl; вариант LXX — в notes. 〔…〕 не ставим.
# Сносок ⟨…⟩ нет: やもめ, 相続地, 復讐, シケル уже в корпусе.
# jp-ni не использовался.

