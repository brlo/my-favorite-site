verses:
  1: "ツルヤの子[こ]ヨアブは、王[おう]の心[こころ]がアブサロムに傾[かたむ]いているのを知[し]った。"
  2: "ヨアブはテコアに人[ひと]を遣[つか]わし、そこから賢[かしこ]い女[おんな]を連[つ]れて来させて言[い]った。「どうか、嘆[なげ]き悲[かな]しみ、喪[も]の衣[ころも]を着[き]なさい。油[あぶら]を塗[ぬ]ってはならない。長[なが]い間[あいだ]、死[し]んだ者のために嘆いている女のようにしなさい。"
  3: "そして、王のところへ行[い]って、このとおりに彼に語[かた]りなさい。」ヨアブは彼女[かのじょ]の口[くち]に言葉[ことば]を置[お]いた。"
  4: "テコアの女[おんな]は王のところへ入[はい]って行き、地[ち]にひれ伏して彼を拝[おが]み、言[い]った。「お救[すく]いください、王よ、お救いください。」"
  5: "王は彼女に言った。「どうしたのか。」彼女は言った。「わたしは昔[むかし]からのやもめだ。夫[おっと]は死[し]んだ。"
  6: "あなたのはしためには二人[ふたり]の息子[むすこ]がいる。二人は野[の]で争[あらそ]い、間[あいだ]に割[わ]って入[はい]る者[もの]がいなかったので、一人[ひとり]がもう一人の兄弟[きょうだい]を打[う]ち、殺[ころ]してしまった。"
  7: "すると、親族[しんぞく]が皆[みな]、あなたのはしために立[た]ち向[む]かって言った。『兄弟を打った者を渡[わた]せ。兄弟の命[いのち]の代[か]わりに、その者を殺そう。あなたがたの跡取[あとと]りまでも断[た]ち滅[ほろ]ぼそう。』こうして彼らは、わたしに残[のこ]された炭火[すみび]を消[け]し、夫に、地の面[おもて]に残る者も名[な]も残さないようにしようとしている。」"
  8: "王は言った。「無事[ぶじ]に、自分の家[いえ]へ帰[かえ]りなさい。わたしがあなたのことで命[めい]じよう。」"
  9: "テコアの女は王に言った。「ご主人[しゅじん]である王よ、罪[つみ]はわたしと、わたしの父[ちち]の家にあるように。王とその王座[おうざ]には罪がないように。」"
  10: "王は言った。「あなたに話[はな]しかけてくる者[もの]はだれか。その者をわたしのところへ連[つ]れて来なさい。もう二度[にど]と、あなたに手[て]を触[ふ]れはしない。」"
  11: "彼女は言った。「どうか、王よ、あなたの神である主[しゅ]を思[おも]い起[おこ]してください。血[ち]の復讐[ふくしゅう]をする者が増[ふ]えて、わたしの息子を滅[ほろ]ぼすことのないように。」王は言った。「主は生[い]きておられる。あなたの息子の髪[かみ]の一筋[ひとすじ]も地[ち]に落[お]ちることはない。」"
  12: "女は言った。「どうか、あなたのはしためが、ご主人である王に一言[ひとこと]語[かた]らせてください。」王は言った。「語りなさい。」"
  13: "女は言った。「なぜ、あなたは神[かみ]の民[たみ]に対してこのようなことをお考[かんが]えになったのですか。王が今語られたこの言葉によって、王ご自身が、自分[じぶん]が追[お]い出[だ]した者を連[つ]れ戻[もど]さないという過[あやま]ちを負[お]うことになったではないか。"
  14: "わたしたちは必[かなら]ず死[し]ぬ。地に注[そそ]がれて集[あつ]められない水[みず]のようだ。しかし、神は命[いのち]を取[と]り上[あ]げる方であり、ご自分から追い出された者をも救[すく]い出[だ]そうと考[かんが]えておられる。"
  15: "そして今[いま]、わたしがご主人である王にこのことを語りに来[き]たのは、民[たみ]がわたしを見[み]ているからだ。あなたのはしためは、王に話[はな]してみよう、もしかすると王ははしための願[ねが]いをかなえてくださるかもしれない、と思[おも]った。"
  16: "王は聞[き]いて、わたしと息子を神の相続地[そうぞくち]から断[た]ち滅[ほろ]ぼそうとしている者の手[て]から、はしためを救[すく]い出[だ]してくださるだろう。"
  17: "あなたのはしためはこう言う。『どうか、ご主人である王の言葉[ことば]が、いけにえとして受[う]け入[い]れられるように。ご主人である王は神の使[つか]いのように、善[よ]いことも悪[わる]いことも聞[き]き分[わ]けることができる。あなたの神である主があなたとともにおられるように。』」"
  18: "王は答[こた]えて女に言った。「わたしが尋[たず]ねることを、わたしから隠[かく]してはならない。」女は言った。「ご主人である王よ、お話[はな]しください。」"
  19: "王は言った。「ヨアブの手[て]が、このすべてのことにあなたとともにあるのではないか。」女は王に言った。「ご主人である王よ、あなたは生[い]きておられる。ご主人である王が語られたことのうち、右[みぎ]にも左[ひだり]にも、何[なに]ひとつとして違[ちが]いはない。あなたの僕[しもべ]ヨアブがわたしに命[めい]じ、彼がこのすべての言葉をはしための口[くち]に置[お]いたのだ。"
  20: "この言葉の見[み]かけを変[か]えるために、あなたの僕ヨアブがこのことをしたのだ。ご主人である王は、神の使いの知恵[ちえ]のように賢[かしこ]く、地[ち]にあるすべてのことを知[し]っておられる。」"
  21: "王はヨアブに言った。「よし、わたしはあなたのこの言葉どおりにした。行[い]って、若者[わかもの]アブサロムを連[つ]れ戻[もど]しなさい。」"
  22: "ヨアブは地にひれ伏して拝[おが]み、王を祝福[しゅくふく]して言った。「ご主人である王よ、今日[きょう]、あなたの僕は、あなたの目[め]に恵[めぐ]みを得[え]たことを知[し]った。ご主人である王が、僕の言葉どおりにしてくださったからだ。」"
  23: "ヨアブは立[た]ってゲシュルへ行[い]き、アブサロムをエルサレムへ連[つ]れて来[き]た。"
  24: "王は言った。「彼は自分の家[いえ]へ帰[かえ]るがよい。ただし、わたしの顔[かお]を見[み]てはならない。」アブサロムは自分の家へ帰ったが、王の顔を見ることはなかった。"
  25: "アブサロムのように、非常[ひじょう]にほめたたえられる男[おとこ]は、イスラエル中[じゅう]にいなかった。彼の足[あし]の裏[うら]から頭[あたま]の頂[いただき]まで、彼には何[なん]の傷[きず]もなかった。"
  26: "彼は初[はじ]めの日から日が経[た]つごとに、頭[あたま]の髪[かみ]を刈[か]った。髪が彼にとって重[おも]かったからである。彼が刈った髪を量[はか]ると、王[おう]の分銅[ぶんどう]で二百[にひゃく]シケルあった。"
  27: "アブサロムには三人[さんにん]の息子[むすこ]と一人[ひとり]の娘[むすめ]が生[う]まれた。娘の名[な]はタマルといい、非常に美[うつく]しい女[おんな]であった。彼女[かのじょ]はソロモンの子[こ]レハブアムの妻[つま]となり、彼にアビヤを産[う]んだ。"
  28: "アブサロムはエルサレムに二年[にねん]の間[あいだ]住[す]んだが、王の顔を見ることはなかった。"
  29: "アブサロムは、自分を王のところへ遣[つか]わしてくれるようにとヨアブに人を送[おく]ったが、ヨアブは彼のところへ来[こ]ようとしなかった。もう一度[いちど]人を送ったが、彼は来ようとしなかった。"
  30: "アブサロムは自分の家来[けらい]たちに言った。「見[み]よ、ヨアブの畑[はたけ]の区画[くかく]はわたしのそばにあり、そこに彼の大麦[おおむぎ]がある。行[い]って、それに火[ひ]を付[つ]けよ。」アブサロムの家来たちはそれを焼[や]いた。ヨアブの僕[しもべ]たちは衣[ころも]を裂[さ]いて彼のところへ来て言った。「アブサロムの家来たちがあなたの区画に火を付[つ]けた。」"
  31: "ヨアブは立って、アブサロムの家へ行き、彼に言った。「なぜ、あなたの家来たちはわたしの区画に火を付けたのか。」"
  32: "アブサロムはヨアブに言った。「見よ、わたしはあなたに人を送って言った。『ここへ来[き]てくれ。王のところへ遣わして、なぜわたしがゲシュルから来たのかを王に言ってもらいたい。まだそこにいたほうがよかったのだ』と。今、わたしは王の顔を見ていない。もしわたしに不正[ふせい]があるなら、わたしを殺[ころ]してくれ。」"
  33: "ヨアブは王のところへ入って行って彼に告[つ]げた。王はアブサロムを呼[よ]んだ。アブサロムは王のところへ入って行き、王の前[まえ]で地にひれ伏して彼を拝み、王はアブサロムに口[くち]づけした。"

notes:
  1: "ἔγνω — узнал. ἡ καρδία τοῦ βασιλέως ἐπὶ Αβεσσαλωμ — «сердце царя [обращено] к Авессалому»; слав. добавляет «преклонися», это толкование, не отдельное чтение."
  2: "γυναῖκα σοφήν — женщину мудрую (слав. «жену мудру»). Πένθησον — «плачь, сетуй» (πενθέω). ἱμάτια πενθικά — одежды плача. μὴ ἀλείψῃ ἔλαιον — «не умащайся елеем» (знак траура — не умащаться). τοῦτο ἡμέρας πολλάς — «так многие дни»."
  3: "κατὰ τὸ ῥῆμα τοῦτο — «по слову сему». ἔθηκεν … τοὺς λόγους ἐν τῷ στόματι αὐτῆς — «положил слова в уста её», т. е. вложил речь."
  4: "ἡ Θεκωῖτις — фекоитянка (жительница Фекои, テコア). Σῶσον, βασιλεῦ, σῶσον — «спаси, царь, спаси»; в ru один раз, у LXX и csl двойное обращение."
  5: "Τί ἐστίν σοι; — «что с тобою?» Καὶ μάλα — «и вправду, совершенно» (LXX); слав. «издавна» (καὶ πάλαι) — в тексте по csl. χήρα — вдова."
  6: "ἐμαχέσαντο — сразились, поссорились (μάχομαι). οὐκ ἦν ὁ ἐξαιρούμενος — «не было избавляющего (разнимающего)». ἔπαισεν — ударил."
  7: "ἐπανέστη — восстало. πατριά — род, родство (слав. «отечество»). ἀντὶ τῆς ψυχῆς — «вместо души», т. е. жизни. ἐξαροῦμεν — истребим. ἄνθραξ — уголь, искра. κατάλειμμα καὶ ὄνομα — «остаток и имя», т. е. потомство и память."
  8: "Ὑγιαίνουσα βάδιζε — «иди здоровая», т. е. с миром. ἐντελοῦμαι περὶ σοῦ — «распоряжусь о тебе»."
  9: "Ἐπ᾽ ἐμέ … ἡ ἀνομία — «на мне беззаконие (вина)». ἀθῷος — неповинен, чист. θρόνος — престол."
  10: "Τίς ὁ λαλῶν πρὸς σέ; — «кто говорящий тебе?» ἄξεις — приведёшь. οὐ προσθήσει ἔτι ἅψασθαι — «не приложит более коснуться»."
  11: "Μνημονευσάτω … τὸν κύριον θεὸν αὐτοῦ — «пусть вспомнит Господа Бога своего». πληθυνθῆναι ἀγχιστέα τοῦ αἵματος — «чтобы умножился мститель за кровь» (ἀγχιστεύς — ближайший родственник, мститель); слав. «ужика крове». τοῦ διαφθεῖραι — «чтобы погубить». Ζῇ κύριος, εἰ πεσεῖται — клятва: «жив Господь, (не) упадёт»."
  12: "Λαλησάτω … ῥῆμα — «пусть скажет слово». Λάλησον — «говори»."
  13: "Ἵνα τί ἐλογίσω τοιοῦτο — «почему ты замыслил такое». ἦ ἐκ στόματος τοῦ βασιλέως …; — «разве не из уст царя слово сие?» πλημμέλεια — преступление, проступок. τοῦ μὴ ἐπιστρέψαι — «чтобы не возвратить»."
  14: "θανάτῳ ἀποθανούμεθα — «смертью умрём» (усиление). ὡς τὸ ὕδωρ τὸ καταφερόμενον — «как вода, уносимая (проливаемая)». ὃ οὐ συναχθήσεται — «которая не соберётся». λήμψεται ὁ θεὸς ψυχήν — «приимет Бог душу». λογιζόμενος τοῦ ἐξῶσαι ἀπ᾽ αὐτοῦ ἐξωσμένον — «замышляя изгнать от Него изгнанного» (ἐξῶσαι); слав. читает «помышляяй спасти» (σῶσαι). В тексте взято церковное (csl) чтение, вариант LXX отмечен здесь."
  15: "ὃ ἦλθον λαλῆσαι — «что я пришла сказать». ὄψεταί με ὁ λαός — «увидит меня народ»; ru «народ пугает меня» — иное понимание. Λαλησάτω … εἴ πως ποιήσει — «пусть скажет… не сделает ли»."
  16: "ῥύσασθαι — избавить (ῥύομαι). ἐξᾶραι — истребить. κληρονομία θεοῦ — «наследие Божие», т. е. народ Божий; в тексте 神の相続地."
  17: "Εἴη … εἰς θυσίαν — «да будет… в жертву» (εἰς θυσίαν); слав. «на жертву», ru «в утешение» — иное чтение (МТ). καθὼς ἄγγελος θεοῦ — «как ангел Божий». Стих начат у csl «и речет раба твоя» (продолжение её речи), в LXX — «и сказала женщина»; взято csl, поэтому речь женщины не прерывается."
  18: "Μὴ δὴ κρύψῃς — «не скрой же». Λαλησάτω … ὁ βασιλεύς — «пусть говорит царь»."
  19: "Μὴ ἡ χεὶρ Ιωαβ …; — «не рука ли Иоава…?» Ζῇ ἡ ψυχή σου — клятва «жива душа твоя». εἰ ἔστιν εἰς τὰ δεξιὰ ἢ εἰς τὰ ἀριστερά — «есть ли направо или налево», т. е. нет никакого уклонения. ἔθετο ἐν τῷ στόματι — «положил в уста»."
  20: "ἕνεκεν τοῦ περιελθεῖν τὸ πρόσωπον τοῦ ῥήματος — «чтобы обойти лицо слова», т. е. придать делу иной вид (слав. «за еже приити лицу глагола сего»). σοφὸς καθὼς σοφία ἀγγέλου — «мудр, как мудрость ангела»."
  21: "ἐποίησά σοι κατὰ τὸν λόγον σου — «сделал тебе по слову твоему». πορεύου ἐπίστρεψον τὸ παιδάριον — «иди, возврати отрока»."
  22: "ἐπὶ πρόσωπον αὐτοῦ ἐπὶ τὴν γῆν — «лицом своим на землю». εὗρον χάριν — «обрел благодать (милость)»."
  23: "ἤγαγεν — привёл (ἄγω). Γεδσουρ — Гессур (ゲシュル)."
  24: "Ἀποστραφήτω — «пусть возвратится» (ἀποστρέφω). τὸ πρόσωπόν μου μὴ βλεπέτω — «лица моего пусть не видит»."
  25: "αἰνετός — хвалимый (αἰνέω). ἀπὸ ἴχνους ποδὸς ἕως κορυφῆς — «от следа ноги до темени». μῶμος — порок, изъян (слав. «порок»)."
  26: "ἐν τῷ κείρεσθαι αὐτόν — «когда он стригся». ἀπ᾽ ἀρχῆς ἡμερῶν εἰς ἡμέρας — «от начала дней до дней», т. е. из года в год (ru «каждый год»). κατεβαρύνετο ἐπ᾽ αὐτόν — «тяжело было ему от них». σίκλος — сикль; «сикль царский» — царская весовая мера."
  27: "ἐτέχθησαν — родились. γίνεται γυνὴ τῷ Ροβοαμ … καὶ τίκτει τὸν Αβια — «стала женой Ровоама… и родила Авию»; в ru этой части нет, у LXX и csl есть."
  28: "ἐκάθισεν — «сидел», т. е. оставался. δύο ἔτη ἡμερῶν — «два года дней»."
  29: "ἀποστεῖλαι αὐτὸν πρὸς τὸν βασιλέα — «послать его к царю». ἐκ δευτέρου — «во второй раз». παραγενέσθαι — прийти."
  30: "μερὶς ἐν ἀγρῷ — «участок в поле». κριθαί — ячмень. ἐμπρήσατε — сожгите (ἐμπίπρημι). διερρηχότες τὰ ἱμάτια — «разодрав одежды» (знак возмущения)."
  31: "Ἵνα τί … ἐνεπύρισαν — «зачем сожгли»."
  32: "Ἧκε ὧδε — «приди сюда». ἀγαθόν μοι ἦν τοῦ ἔτι εἶναί με ἐκεῖ — «лучше мне было ещё быть там». εἰ δέ ἐστιν ἐν ἐμοὶ ἀδικία — «если же есть во мне неправда». θανάτωσόν με — «убей меня»."
  33: "κατεφίλησεν — поцеловал (καταφιλέω). προσεκύνησεν … ἔπεσεν ἐπὶ πρόσωπον — поклонился и пал лицом."
