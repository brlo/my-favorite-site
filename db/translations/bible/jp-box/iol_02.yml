# jp-box, Иоиль, глава 2. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной. ВАЖНО: в gr-lxx-byz книга делится на 4 главы;
# наша глава 2 = gr 2:1–27 + gr 3:1–5 (ст. 28–32, излияние Духа). Поэтому ст. 28–32
# в модуле стоят как отдельная греческая глава 3 — в notes это отмечено.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1–11 день Господень и нашествие саранчи-войска: труба на Сионе,
# тьма, огонь, кони, колесницы, потрясение неба и земли; 12–17 призыв обратиться
# всем сердцем, разодрать сердца, пост и собрание, молитва священников; 18–27 ответ
# Господа: ревность о земле, хлеб, вино и елей, изгнание северного врага, «не бойся,
# земля», ранний и поздний дождь, возмещение за годы саранчи, «излию Дух Мой»;
# 28–32 излияние Духа на всякую плоть (цит. Деян 2:17–21), знамения, день Господень,
# «всякий, кто призовёт имя Господне, спасётся».
# Голоса: 12–14 — слово Господа в 「…」 (формула «так говорит Господь» вне кавычек);
# 15–17 — призыв пророка, слова священников в 17 — 「…」, слова народов внутри них —
# 『…』; 18 — повествование; 19–27 — ответ Господа в 「…」 (открывается в 19,
# закрывается в 27); 28–32 — новое слово Господа в 「…» (продолжение речи 19–27,
# кавычки сбалансированы по главе).
# Рефрены: 1:14/2:15 «断食を聖別し、礼拝を告げ知らせよ»; 2:25 порядок насекомых
# тот же, что в 1:4.
# Термины: 角笛 (σάλπιγξ), 粗布 (σάκκος), 燔祭/供え物 (θυσία), 注ぎの供え物 (σπονδή),
# 嗣業 (κληρονομία), 霊 (πνεῦμα), 預言 (προφητεύω), 幻 (ὅρασις), 夢 (ἐνύπνιον).
# Имена: シオン, エルサレム, イスラエル, ユダ, ヨシャファトの谷 (3:2), ヨエル.
#
