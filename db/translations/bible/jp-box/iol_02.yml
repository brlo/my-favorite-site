verses:
  1: "シオンで角笛[つのぶえ]を吹[ふ]き鳴[な]らせ、わたしの聖[せい]なる山[やま]で告[つ]げ知[し]らせよ。地[ち]に住[す]むすべての者[もの]は震[ふる]えおののけ。主[しゅ]の日[ひ]がそこに来[き]ているからである。それは近[ちか]い。"
  2: "闇[やみ]と暗[くら]さの日[ひ]、雲[くも]と霧[きり]の日である。大[おお]きく強[つよ]い民[たみ]が、暁[あかつき]のように山[やま]々[やま]をおおう。このような民は昔[むかし]からなかった。今後[こんご]も、代々[だいだい]の年[とし]々[とし]にわたって再[ふたた]び起[お]こらない。"
  3: "その前[まえ]では火[ひ]が食[く]らい尽[つ]くし、その後[あと]では炎[ほのお]が燃[も]え上[あ]がる。その前の地[ち]は喜[よろこ]びの園[その]のようだが、その後[うしろ]は荒[あ]れた野[の]となり、何[なに]ひとつ逃[のが]れられない。"
  4: "その姿[すがた]は馬[うま]のようで、騎兵[きへい]のように駆[か]け巡[めぐ]る。"
  5: "山[やま]の頂[いただき]を跳[は]ね越[こ]える音[おと]は、戦車[せんしゃ]の響[ひび]きのようであり、刈[か]り取[と]った藁[わら]を焼[や]く炎の音のようであり、戦[いくさ]のために並[なら]んだ強[つよ]い大軍[たいぐん]のようである。"
  6: "その前[まえ]で民[たみ]々[たみ]は打[う]ち砕[くだ]かれ、すべての顔[かお]は土鍋[つなべ]を焼[や]いたように黒[くろ]くなる。"
  7: "彼らは戦士[せんし]のように走[はし]り、兵士[へいし]のように城壁[じょうへき]を上[のぼ]る。おのおの自分[じぶん]の道[みち]を進[すす]み、その小道[こみち]を曲[ま]がらない。"
  8: "互[たが]いに兄弟[きょうだい]から離[はな]れず、武具[ぶぐ]の重[おも]さに耐[た]えて進[すす]み、矢[や]の中[なか]に倒[たお]れても、全[まった]く滅[ほろ]びない。"
  9: "町[まち]に押[お]し入[はい]り、城壁[じょうへき]を駆[か]け上[あ]がり、家[いえ]々[いえ]に上[のぼ]り、窓[まど]から盗人[ぬすびと]のように入[はい]る。"
  10: "彼らの前[まえ]で地[ち]は震[ふる]え、天[てん]は揺[ゆ]れる。太陽[たいよう]と月[つき]は暗[くら]くなり、星[ほし]はその光[ひかり]を失[うしな]う。"
  11: "主[しゅ]はご自分[じぶん]の軍[ぐん]の前[まえ]に声[こえ]を放[はな]たれる。その陣営[じんえい]は非常[ひじょう]に多[おお]く、その言葉[ことば]を行[おこな]う者は強[つよ]い。主[しゅ]の日[ひ]は大[おお]きく、しかも非常[ひじょう]に輝[かがや]かしい。だれがそれに耐[た]えられるだろうか。"
  12: "しかし、今[いま]でも、あなたがたの神[かみ]である主[しゅ]は言[い]われる。「断食[だんじき]と泣[な]くことと嘆[なげ]きをもって、心[こころ]を尽[つ]くしてわたしに帰[かえ]れ。"
  13: "衣[ころも]を裂[さ]くのではなく、心[こころ]を裂[さ]け。あなたがたの神である主に帰れ。主は恵[めぐ]み深[ぶか]く、あわれみ深く、怒[いか]りをおそくし、慈[いつく]しみに富[と]み、災[わざわ]いを思[おも]い直[なお]される方[かた]であるからである。"
  14: "もしかすると、主は立[た]ち返[かえ]って悔[く]い、ご自身[じしん]の後[あと]に祝福[しゅくふく]を、すなわちあなたがたの神[かみ]である主への供[そな]え物[もの]と注[そそ]ぎの供え物を残[のこ]されるかもしれない。」"
  15: "シオンで角笛[つのぶえ]を吹[ふ]き鳴[な]らせ。断食[だんじき]を聖別[せいべつ]し、礼拝[れいはい]を告[つ]げ知[し]らせよ。"
  16: "民[たみ]を集[あつ]め、会衆[かいしゅう]を聖別[せいべつ]せよ。長老[ちょうろう]たちを選[えら]び出[だ]せ。乳飲[ちのみ]み子[ご]たちまで集めよ。花婿[はなむこ]は自室[じしつ]から、花嫁[はなよめ]は婚礼[こんれい]の部屋[へや]から出[で]て来[こ]させよ。"
  17: "主[しゅ]に仕[つか]える祭司[さいし]たちは、祭壇[さいだん]の基[もとい]のあたりで泣[な]き、言[い]え。「主[しゅ]よ、あなたの民[たみ]を惜[お]しんでください。あなたの嗣業[しぎょう]を、諸国民[しょこくみん]が支配[しはい]する辱[はずかし]めに渡[わた]さないでください。なぜ、諸国民の間[あいだ]で『彼らの神[かみ]はどこにいるのか』と言[い]わせるのですか。」"
  18: "主[しゅ]はご自分[じぶん]の地[ち]のために熱心[ねっしん]になり、ご自分の民[たみ]をあわれまれた。"
  19: "主[しゅ]は答[こた]えて、ご自分の民に言[い]われた。「見[み]よ、わたしはあなたがたに穀物[こくもつ]とぶどう酒[しゅ]と油[あぶら]を送[おく]る。あなたがたはそれらで満[み]ち足[た]りる。わたしはもはや、あなたがたを諸国民[しょこくみん]の間[あいだ]で辱[はずかし]めに渡[わた]さない。"
  20: "わたしは北[きた]から来[く]る者[もの]をあなたがたから遠[とお]ざけ、水[みず]のない荒[あ]れた地[ち]へ追[お]いやる。その前[まえ]の者[もの]を東[ひがし]の海[うみ]へ、その後[うしろ]の者を西[にし]の海へ追いやる。その悪臭[あくしゅう]が上[のぼ]り、その臭[にお]いが立[た]ち上[のぼ]る。それは大[おお]きなことをしたからである。"
  21: "地[ち]よ、恐[おそ]れるな。喜[よろこ]び、楽しめ。主[しゅ]が大[おお]きなことをなさったからである。"
  22: "野[の]の獣[けもの]たちよ、恐れるな。荒[あ]れ野[の]牧[まき]場[ば]が芽[め]を吹[ふ]き、木[き]が実[み]を結[むす]び、ぶどうの木といちじくの木が力[ちから]を出[だ]すからである。"
  23: "シオンの子[こ]らよ、あなたがたの神[かみ]である主[しゅ]によって喜[よろこ]び、楽しめ。主はあなたがたに、義[ぎ]をもって食[た]べ物[もの]を与[あた]え、前[まえ]のように、初[はつ]めの雨[あめ]と後[のち]の雨を降[ふ]らせてくださるからである。"
  24: "脱穀[だっこく]場[じょう]は穀物[こくもつ]で満[み]ち、ぶどう搾[しぼ]り場[ば]はぶどう酒と油[あぶら]であふれる。"
  25: "わたしは、いなごと毛虫[けむし]とばったと芋虫[いもむし]が食[く]った年[とし]々[とし]の埋[う]め合[あ]わせを、あなたがたに返[かえ]す。それはわたしの大[おお]きな力[ちから]であり、わたしがあなたがたに送[おく]ったものである。"
  26: "あなたがたは食[た]べて満[み]ち足[た]り、あなたがたの神[かみ]である主[しゅ]の名[な]をほめたたえる。主はあなたがたに不思議[ふしぎ]なことをなさったからである。わたしの民[たみ]は永遠[えいえん]に辱[はずかし]められない。"
  27: "あなたがたは、わたしがイスラエルのただ中[なか]にいること、わたしがあなたがたの神[かみ]である主[しゅ]であり、わたしのほかに神[かみ]はいないことを知[し]る。わたしの民[たみ]は永遠[えいえん]に辱[はずかし]められない。」"
  28: "「その後[のち]、わたしはわたしの霊[れい]をすべての肉[にく]なる者[もの]の上[うえ]に注[そそ]ぐ。あなたがたの息子[むすこ]たちと娘[むすめ]たちは預言[よげん]し、あなたがたの年[とし]を取[と]った者[もの]たちは夢[ゆめ]を見[み]、若[わか]い者[もの]たちは幻[まぼろし]を見[み]る。"
  29: "その日[ひ]には、わたしは僕[しもべ]たちにも、はしためたちにも、わたしの霊[れい]を注[そそ]ぐ。"
  30: "わたしは天[てん]と地[ち]にしるしを現[あらわ]す。血[ち]と火[ひ]と煙[けむり]の柱[はしら]である。"
  31: "太陽[たいよう]は暗[くら]やみに、月[つき]は血[ち]に変[か]わる。主[しゅ]の大[おお]いなる輝[かがや]かしい日[ひ]が来[く]る前[まえ]に。"
  32: "そして、主[しゅ]の名[な]を呼[よ]ぶ者[もの]は、すべて救[すく]われる。主が言[い]われたとおり、シオンの山[やま]とエルサレムに救[すく]いがあり、主が呼[よ]び寄[よ]せた者[もの]たちがそこにいるからである。」"

notes:
  1: "Σαλπίσατε σάλπιγγι ἐν Σιων — «вострубите трубою на Сионе» (σαλπίζω + cognatus dativus, 角笛を吹き鳴らせ); κηρύξατε — «проповедуйте» (告げ知らせよ); συγχυθήτωσαν πάντες οἱ κατοικοῦντες τὴν γῆν — «да смятутся все живущие на земле» (震えおののけ); πάρεστιν ἡμέρα κυρίου, ὅτι ἐγγύς — «предстоит день Господень, ибо близок»."
  2: "ἡμέρα σκότους καὶ γνόφου — «день тьмы и мрака» (σκότος — 闇, γνόφος — густая тьма/暗さ); νεφέλης καὶ ὁμίχλης — «облака и тумана» (雲と霧); ὡς ὄρθρος χυθήσεται ἐπὶ τὰ ὄρη λαὸς πολὺς καὶ ἰσχυρός — «как утренняя заря разольётся по горам народ многочисленный и сильный» (χέω — лить, おおう); ὅμοιος αὐτῷ οὐ γέγονεν ἀπὸ τοῦ αἰῶνος — «подобного ему не было от века»; ἕως ἐτῶν εἰς γενεὰς γενεῶν — «до лет, в роды родов»."
  3: "τὰ ἔμπροσθεν αὐτοῦ πῦρ ἀναλίσκον — «перед ним огонь поедающий» (ἀναλίσκω — истреблять); τὰ ὀπίσω αὐτοῦ ἀναπτομένη φλόξ — «позади него зажигающееся пламя»; ὡς παράδεισος τρυφῆς ἡ γῆ — «как рай сладости земля» (τρυφή — наслаждение; ru «сад Едемский» — МТ, не внесено; передано 喜びの園); πεδίον ἀφανισμοῦ — «поле опустошения»; ἀνασῳζόμενος οὐκ ἔσται αὐτῷ — «спасающегося не будет у него», т.е. никто не спасётся."
  4: "ὡς ὅρασις ἵππων ἡ ὄψις αὐτῶν — «как видение коней — вид их» (ὄψις — вид, 姿); ὡς ἱππεῖς οὕτως καταδιώξονται — «как всадники так погонят» (καταδιώκω — преследовать, 駆け巡る)."
  5: "ὡς φωνὴ ἁρμάτων ἐπὶ τὰς κορυφὰς τῶν ὀρέων ἐξαλοῦνται — «как звук колесниц по вершинам гор поскачут» (ἐξάλλομαι — вскакивать); ὡς φωνὴ φλογὸς πυρὸς κατεσθιούσης καλάμην — «как звук пламени огня, поедающего солому» (κάλαμος — тростник/солома); ὡς λαὸς πολὺς καὶ ἰσχυρὸς παρατασσόμενος εἰς πόλεμον — «как народ многочисленный и сильный, строящийся на войну»."
  6: "ἀπὸ προσώπου αὐτοῦ συντριβήσονται λαοί — «от лица его сокрушатся народы» (συντρίβω — сокрушать); πᾶν πρόσωπον ὡς πρόσκαυμα χύτρας — «всякое лицо как обожжённый горшок» (πρόσκαυμα — ожог; χύτρα — глиняный сосуд, 土鍋). В ru (МТ) «побледнеют» — иное чтение, не внесено."
  7: "ὡς μαχηταὶ δραμοῦνται — «как борцы побегут» (μαχητής — воин/борец, 戦士); ὡς ἄνδρες πολεμισταὶ ἀναβήσονται ἐπὶ τὰ τείχη — «как мужи воины взойдут на стены»; ἕκαστος ἐν τῇ ὁδῷ αὐτοῦ πορεύσεται — «каждый по дороге своей пойдёт»; οὐ μὴ ἐκκλίνωσιν τὰς τρίβους αὐτῶν — «не совратят троп своих» (τρίβος — тропа, 小道)."
  8: "ἕκαστος ἀπὸ τοῦ ἀδελφοῦ αὐτοῦ οὐκ ἀφέξεται — «каждый от брата своего не отступит» (ἀπέχω — отстоять, отделяться); καταβαρυνόμενοι ἐν τοῖς ὅπλοις αὐτῶν πορεύσονται — «отягощённые оружием своим пойдут» (καταβαρύνω — отягощать); ἐν τοῖς βέλεσιν αὐτῶν πεσοῦνται καὶ οὐ μὴ συντελεσθῶσιν — «в стрелах своих падут и не скончаются» (βέλος — стрела; συντελέω — уничтожать)."
  9: "τῆς πόλεως ἐπιλήμψονται — «городом овладеют» (ἐπιλαμβάνομαι — захватывать, 押し入る); ἐπὶ τῶν τειχέων δραμοῦνται — «по стенам побегут»; διὰ θυρίδων εἰσελεύσονται ὡς κλέπται — «через окна войдут, как воры» (θυρίς — окно)."
  10: "πρὸ προσώπου αὐτῶν συγχυθήσεται ἡ γῆ — «от лица их смятётся земля»; σεισθήσεται ὁ οὐρανός — «потрясётся небо» (σείω); ὁ ἥλιος καὶ ἡ σελήνη συσκοτάσουσιν — «солнце и луна померкнут»; τὰ ἄστρα δύσουσιν τὸ φέγγος αὐτῶν — «звёзды зайдут (потеряют) свет свой» (δύω — заходить)."
  11: "κύριος δώσει φωνὴν αὐτοῦ — «Господь даст голос Свой»; πρὸ προσώπου δυνάμεως αὐτοῦ — «пред лицом силы (войска) Своей»; πολλὴ σφόδρα ἡ παρεμβολὴ αὐτοῦ — «весьма многочислен стан (ополчение) Его» (παρεμβολή — 陣営); ἰσχυρὰ ἔργα λόγων αὐτοῦ — «крепки дела слов Его» (csl «дела словес его»); μεγάλη καὶ ἐπιφανὴς σφόδρα — «велик и весьма славен/явен» (ἐπιφανής; csl «светел», ru «страшен»); τίς ἔσται ἱκανὸς αὐτῇ — «кто будет достаточен для него», т.е. кто выдержит."
  12: "καὶ νῦν λέγει κύριος ὁ θεὸς ὑμῶν — «и ныне говорит Господь Бог ваш» (формула вне кавычек); Ἐπιστράφητε πρός με ἐξ ὅλης τῆς καρδίας ὑμῶν — «обратитесь ко Мне всем сердцем вашим» (ἐπιστρέφω — обращаться, 帰れ); ἐν νηστείᾳ καὶ ἐν κλαυθμῷ καὶ ἐν κοπετῷ — «в посте, плаче и рыдании» (κοπετός — рыдание, 嘆き)."
  13: "διαρρήξατε τὰς καρδίας ὑμῶν καὶ μὴ τὰ ἱμάτια ὑμῶν — «разодрайте сердца ваши, а не одежды ваши» (διαρρήγνυμι — разрывать); ἐλεήμων καὶ οἰκτίρμων — «милостив и щедр» (あわれみ深い); μακρόθυμος καὶ πολυέλεος — «долготерпелив и многомилостив» (怒りをおそくし、慈しみに富み); μετανοῶν ἐπὶ ταῖς κακίαις — «раскаивающийся о злобах», т.е. отменяющий бедствие (災いを思い直される)."
  14: "τίς οἶδεν εἰ ἐπιστρέψει καὶ μετανοήσει — «кто знает, обратится ли и раскается ли» (τίς οἶδεν — «может быть»); ὑπολείψεται ὀπίσω αὐτοῦ εὐλογίαν — «оставит за Собою благословение» (ὑπολείπω — оставлять); θυσίαν καὶ σπονδὴν κυρίῳ τῷ θεῷ ἡμῶν — «жертву и возлияние Господу Богу нашему»; в csl «Богу вашему» — по паритету взято «вашему» (あなたがたの神), греч. ἡμῶν в notes."
  15: "Повтор 1:14 и 2:1: σαλπίσατε σάλπιγγι ἐν Σιων, ἁγιάσατε νηστείαν, κηρύξατε θεραπείαν — «вострубите трубою на Сионе, освятите пост, проповедуйте служение». Формула призыва к собранию; θεραπεία — служение/богослужение (礼拝), csl «цельба»."
  16: "συναγάγετε λαόν, ἁγιάσατε ἐκκλησίαν — «соберите народ, освятите собрание» (ἐκκλησία — собрание, 会衆); ἐκλέξασθε πρεσβυτέρους — «изберите старейшин»; συναγάγετε νήπια θηλάζοντα μαστούς — «соберите младенцев, сосущих грудь» (乳飲み子); ἐξελθάτω νυμφίος ἐκ τοῦ κοιτῶνος αὐτοῦ καὶ νύμφη ἐκ τοῦ παστοῦ αὐτῆς — «пусть выйдет жених из спальни своей и невеста из брачного чертога» (κοιτών — спальня, 自室; παστός — брачный покой, 婚礼の部屋)."
  17: "ἀνὰ μέσον τῆς κρηπῖδος τοῦ θυσιαστηρίου — «между основанием (ступенью) жертвенника» (κρηπίς — основание/ступень, 階段); κλαύσονται οἱ ἱερεῖς — «заплачут священники»; Φεῖσαι, κύριε, τοῦ λαοῦ σου — «пощади, Господи, народ Твой» (φείδομαι — щадить, 惜しむ); μὴ δῷς τὴν κληρονομίαν σου εἰς ὄνειδος — «не дай наследия Твоего на поругание» (κληρονομία — 嗣業, ὄνειδος — 辱め); τοῦ κατάρξαι αὐτῶν ἔθνη — «чтобы владели ими народы» (κατάρχω — начальствовать); Ποῦ ἐστιν ὁ θεὸς αὐτῶν; — «где Бог их?» (слова народов — 『…』)."
  18: "καὶ ἐζήλωσεν κύριος τὴν γῆν αὐτοῦ — «и возревновал Господь о земле Своей» (ζηλόω — ревновать, 熱心になる); ἐφείσατο τοῦ λαοῦ αὐτοῦ — «и пощадил народ Свой» (φείδομαι, あわれむ). Здесь начинается ответ Господа; далее Его речь."
  19: "ἀπεκρίθη κύριος καὶ εἶπεν τῷ λαῷ αὐτοῦ — «ответил Господь и сказал народу Своему» (формула вне кавычек); ἐξαποστέλλω ὑμῖν τὸν σῖτον καὶ τὸν οἶνον καὶ τὸ ἔλαιον — «посылаю вам пшеницу, вино и елей» (穀物・ぶどう酒・油); ἐμπλησθήσεσθε αὐτῶν — «насытитесь ими»; οὐ δώσω ὑμᾶς οὐκέτι εἰς ὀνειδισμὸν ἐν τοῖς ἔθνεσι — «не отдам вас более на поругание народам»."
  20: "τὸν ἀπὸ βορρᾶ ἐκδιώξω ἀφ' ὑμῶν — «северного изгоню от вас» (ἐκδιώκω — изгонять); εἰς γῆν ἄνυδρον — «в землю безводную»; ἀφανιῶ τὸ πρόσωπον αὐτοῦ εἰς τὴν θάλασσαν τὴν πρώτην — «истреблю лицо его в море первое» (т.е. восточное, Мёртвое); τὰ ὀπίσω αὐτοῦ εἰς τὴν θάλασσαν τὴν ἐσχάτην — «заднее его в море последнее» (западное, Средиземное; в тексте 東の海/西の海); ἀναβήσεται ἡ σαπρία αὐτοῦ καὶ ὁ βρόμος αὐτοῦ — «поднимется гнилость его и смрад его» (σαπρία — гниль, 悪臭; βρόμος — смрад); ὅτι ἐμεγάλυνεν τὰ ἔργα αὐτοῦ — «ибо возвеличил дела свои» (ирония)."
  21: "θάρσει, γῆ — «дерзай, земля» (θαρσέω — не бояться, 恐れるな); χαῖρε καὶ εὐφραίνου — «радуйся и веселись»; ὅτι ἐμεγάλυνεν κύριος τοῦ ποιῆσαι — «ибо возвеличил Господь, чтобы сотворить» (т.е. явил великое)."
  22: "θαρσεῖτε, κτῆνη τοῦ πεδίου — «дерзайте, звери поля»; βεβλάστηκεν πεδία τῆς ἐρήμου — «прозябли (дали побеги) поля пустыни» (βλαστάνω — прорастать); ξύλον ἤνεγκεν τὸν καρπὸν αὐτοῦ — «дерево принесло плод свой»; ἄμπελος καὶ συκῆ ἔδωκαν τὴν ἰσχὺν αὐτῶν — «виноград и смоковница дали силу свою»."
  23: "τὰ τέκνα Σιων — «чада Сиона» (シオンの子ら); χαίρετε καὶ εὐφραίνεσθε ἐπὶ τῷ κυρίῳ θεῷ ὑμῶν — «радуйтесь и веселитесь о Господе Боге вашем»; ἔδωκεν ὑμῖν τὰ βρώματα εἰς δικαιοσύνην — «дал вам пищу в правду» (義をもって食物を与え; ru «дождь в меру» — МТ, не внесено); βρέξει ὑμῖν ὑετὸν πρόιμον καὶ ὄψιμον καθὼς ἔμπροσθεν — «одождит вам дождь ранний и поздний, как прежде» (初めの雨と後の雨)."
  24: "πλησθήσονται αἱ ἅλωνες σίτου — «наполнятся гумна пшеницы» (ἅλων — гумно, 脱穀場); ὑπερεκχυθήσονται αἱ ληνοὶ οἴνου καὶ ἐλαίου — «перельются точила вином и елеем» (ληνός — давильня, ぶどう搾り場; ὑπερεκχέω — переливаться)."
  25: "ἀνταποδώσω ὑμῖν ἀντὶ τῶν ἐτῶν, ὧν κατέφαγεν ἡ ἀκρὶς καὶ ὁ βροῦχος καὶ ἡ ἐρυσίβη καὶ ἡ κάμπη — «воздам вам за годы, которые поела саранча, червь, ржавчина (вид саранчи) и гусеница» (порядок 1:4 сохранён: いなご・毛虫・ばった・芋虫); ἡ δύναμίς μου ἡ μεγάλη — «сила Моя великая» (в МТ/ru «великое войско Моё» — иное чтение, в notes)."
  26: "φάγεσθε ἐσθίοντες καὶ ἐμπλησθήσεσθε — «будете есть, вкушая, и насытитесь» (усиление); αἰνέσετε τὸ ὄνομα κυρίου τοῦ θεοῦ ὑμῶν — «восхвалите имя Господа Бога вашего»; ἃ ἐποίησεν μεθ' ὑμῶν εἰς θαυμάσια — «что сотворил с вами в чудеса» (θαυμάσιος — дивный, 不思議な); οὐ μὴ καταισχυνθῇ ὁ λαός μου εἰς τὸν αἰῶνα — «не постыдится народ Мой вовек»."
  27: "ἐπιγνώσεσθε ὅτι ἐν μέσῳ τοῦ Ισραηλ ἐγώ εἰμι — «узнаете, что Я посреди Израиля» (ἐν μέσῳ — ただ中); ἐγὼ κύριος ὁ θεὸς ὑμῶν — «Я Господь Бог ваш»; οὐκ ἔστιν ἔτι πλὴν ἐμοῦ — «нет иного кроме Меня» (ἔτι — более); οὐ μὴ καταισχυνθῶσιν οὐκέτι πᾶς ὁ λαός μου — «не постыдится более весь народ Мой». Здесь слово Господа (19–27) закрывается."
  28: "ВАЖНО ПО НУМЕРАЦИИ: в gr-lxx-byz это 3:1 (глава 3 = 5 стихов), в слав.-синод. — 2:28. Стих открывает новое слово Господа (продолжение речи 19–27; кавычки по главе сбалансированы). Καὶ ἔσται μετὰ ταῦτα — «и будет после того» (その後); ἐκχεῶ ἀπὸ τοῦ πνεύματός μου ἐπὶ πᾶσαν σάρκα — «излию от Духа Моего на всякую плоть» (πᾶσα σάρξ — すべての肉なる者); προφητεύσουσιν οἱ υἱοὶ ὑμῶν καὶ αἱ θυγατέρες ὑμῶν — «будут пророчествовать сыны ваши и дочери ваши»; οἱ πρεσβύτεροι ὑμῶν ἐνύπνια ἐνυπνιασθήσονται — «старцы ваши сны увидят» (ἐνύπνιον — сон, 夢); οἱ νεανίσκοι ὑμῶν ὁράσεις ὄψονται — «юноши ваши видения увидят» (ὅρασις — 幻). Цит. Деян 2:17 (там порядок «юноши/старцы» иной)."
  29: "καὶ ἐπὶ τοὺς δούλους καὶ ἐπὶ τὰς δούλας — «и на рабов и на рабынь» (僕たち・はしためたち); ἐν ταῖς ἡμέραις ἐκείναις ἐκχεῶ ἀπὸ τοῦ πνεύματός μου — «в те дни излию от Духа Моего». Слав. добавляет «ибо» (γάρ) — в LXX нет, не внесено. Цит. Деян 2:18."
  30: "δώσω τέρατα ἐν τῷ οὐρανῷ καὶ ἐπὶ τῆς γῆς — «дам знамения (чудеса) на небе и на земле» (τέρας — знамение, しるし); αἷμα καὶ πῦρ καὶ ἀτμίδα καπνοῦ — «кровь и огонь и пар (столп) дыма» (ἀτμίς — пар, 煙の柱). Цит. Деян 2:19."
  31: "ὁ ἥλιος μεταστραφήσεται εἰς σκότος καὶ ἡ σελήνη εἰς αἷμα — «солнце превратится в тьму и луна в кровь» (μεταστρέφω — превращать); πρὶν ἐλθεῖν ἡμέραν κυρίου τὴν μεγάλην καὶ ἐπιφανῆ — «прежде чем придёт день Господень великий и славный/явный» (ἐπιφανής; csl «просвещённый», ru «страшный»). Цит. Деян 2:20."
  32: "πᾶς, ὃς ἂν ἐπικαλέσηται τὸ ὄνομα κυρίου, σωθήσεται — «всякий, кто призовёт имя Господне, спасётся» (ἐπικαλέομαι — призывать); ἐν τῷ ὄρει Σιων καὶ ἐν Ιερουσαλημ ἔσται ἀνασῳζόμενος — «на горе Сионе и в Иерусалиме будет спасаемый» (ἀνασῴζω — спасать); καθότι εἶπεν κύριος — «как сказал Господь»; καὶ εὐαγγελιζόμενοι, οὓς κύριος προσκέκληται — «и благовествуемые, которых Господь призвал» (εὐαγγελιζόμενοι — тёмное место: «те, кому благовествуют»; csl «благовествуемии»; ru «остальные/у остальных» — иное понимание, в тексте 主が呼び寄せた者たち). Цит. Деян 2:21. Здесь слово Господа (28–32) закрывается."
