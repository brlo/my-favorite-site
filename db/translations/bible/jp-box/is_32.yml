# jp-box, Исаия, глава 32. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для Исаии есть фрагментами (гл. 3, 5–10,
# 13–14, 19, 25–29, 37–38, 40–43, 45, 48–50, 52, 54, 58, 60, 62–66) — главы 32 нет;
# jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 32: 1–8 царь правды и князья, слух и язык народа, глупый и благочестивый;
# 9–14 обращение к богатым женщинам и запустение города; 15–20 обетование Духа
# свыше, суда и правды в пустыне, мира и безопасности, блаженство сеющих при водах.
# Голоса: 1–8 авторский текст; 5 внутри него — чужие слова в 「…」 («начальствуй»,
# «молчи»); 9–12 пророческое обращение без кавычек; 13–20 авторский текст.
# Нумерация по gr: 20 стихов; деление совпадает с csl и ru.
# 〔…〕 нет: все стихи есть в gr-lxx-byz.
# 32:15: слав. читает «дондеже найдет на ны» (на нас), LXX — ἐφ᾿ ὑμᾶς (на вас);
# по паритету в тексте 1 л. мн. ч., вариант LXX — в notes. 32:15–16 LXX даёт
# Χερμελ (в 15) и Κάρμηλος (в 16) — оба переданы как カルメル, различие в notes.
# Сносок ⟨…⟩ нет: 粗布, 雹, 洞窟, 羊飼い уже в корпусе.
# Имена — транслитерация греческого (LXX): シオン, エルサレム, カルメル.

