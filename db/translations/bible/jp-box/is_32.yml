verses:
  1: "見[み]よ、義[ぎ]なる王[おう]が王として治[おさ]め、君[きみ]たちは裁[さば]きをもって治める。"
  2: "その人[ひと]は自分[じぶん]の言葉[ことば]を隠[かく]す者[もの]となり、流[なが]れる水[みず]から身[み]を隠すように隠[かく]れる。そしてシオンに、渇[かわ]いた地[ち]に流れる輝[かがや]かしい川[かわ]のように現[あらわ]れる。"
  3: "彼[かれ]らはもはや人[ひと]に頼[たの]まず、耳[みみ]を傾[かたむ]けて聞[き]く。"
  4: "弱[よわ]っている者[もの]たちの心[こころ]は聞くことに心を向[む]け、もつれた舌[した]はすぐに平和[へいわ]を語[かた]ることを学[まな]ぶ。"
  5: "もはや愚[おろ]かな者[もの]に「治[おさ]めよ」と言[い]う者はなく、もはやあなたのしもべたちが「黙[だま]れ」と言うこともない。"
  6: "愚[おろ]かな者[もの]は愚かなことを語[かた]り、その心[こころ]はむなしいことを考[かんが]える——不法[ふほう]を行[おこな]い、主[しゅ]に向[む]かって迷[まよ]わすことを語り、飢[うえ]えた魂[たましい]を散[ち]らし、渇[かわ]いた魂を空[から]にするために。"
  7: "悪[わる]い者[もの]たちの謀[はかりごと]は不法[ふほう]なことを謀[はか]る——不正[ふせい]な言葉[ことば]でへりくだる者[もの]を滅[ほろ]ぼし、裁[さば]きの場[ば]でへりくだる者の言葉を打[う]ち散[ち]らすために。"
  8: "しかし、敬虔[けいけん]な者[もの]たちは思慮[しりょ]あることを謀[はか]り、その謀[はかりごと]は保[たも]たれる。"
  9: "富[とみ]ある女[おんな]たちよ、立[た]ち上[あ]がって、わたしの声[こえ]を聞[き]け。望[のぞ]みのうちにある娘[むすめ]たちよ、わたしの言葉[ことば]を聞け。"
  10: "一年[いちねん]の日[ひ]を、痛[いた]みのうちに、望[のぞ]みとともに思[おも]い起[おこ]せ。ぶどうの収穫[しゅうかく]は尽[つ]き、種[たね]まきはやみ、もはや来[こ]ない。"
  11: "おののけ、悲[かな]しめ、確[たし]かに頼[たの]みとしていた者[もの]たちよ。衣[ころも]を脱[ぬ]ぎ、裸[はだか]になれ。腰[こし]に粗布[あらぬの]をまとえ。"
  12: "胸[むね]を打[う]て。好[この]ましい畑[はたけ]と、ぶどうの実[み]のために。"
  13: "わたしの民[たみ]の地[ち]には茨[いばら]と草[くさ]が生[は]え上[の]がり、すべての家[いえ]から喜[よろこ]びは取[と]り去[さ]られる。富[とみ]ある都[みやこ]よ。"
  14: "捨[す]てられた家[いえ]々[いえ]は都[みやこ]の富[とみ]を、望[のぞ]ましい家[いえ]々をも捨[す]て去[さ]る。村[むら]々[むら]は永遠[えいえん]に洞窟[どうくつ]となり、野生[やせい]のろばの喜[よろこ]び、羊飼[ひつじか]いの牧[まき]場[ば]となる。"
  15: "高[たか]い所[ところ]から霊[れい]がわたしたちの上[うえ]に下[くだ]るまで。そうすれば、荒野[こうや]はカルメルとなり、カルメルは森[もり]と見[み]なされる。"
  16: "荒野[こうや]には裁[さば]きが憩[いこ]い、カルメルには義[ぎ]が住[す]む。"
  17: "義[ぎ]のわざは平和[へいわ]となり、義は安[やす]らぎを保[たも]ち、彼[かれ]らは永遠[えいえん]に確[たし]かな者[もの]となる。"
  18: "その民[たみ]は平和[へいわ]の都[みやこ]に住[す]み、確[たし]かさのうちに住み、富[とみ]とともに憩[いこ]う。"
  19: "雹[ひょう]が降[ふ]っても、あなたがたには来[こ]ない。森[もり]に住[す]む者[もの]たちは、平野[へいや]にいる者[もの]のように確[たし]かになる。"
  20: "牛[うし]とろばが踏[ふ]む、すべての水[みず]のほとりに、種[たね]をまく者[もの]たちは幸[さいわ]いである。"

notes:
  1: "ἰδοὺ γὰρ βασιλεὺς δίκαιος βασιλεύσει — «ибо вот, царь праведный воцарится» (γάρ — «ибо», у слав. «Се бо»); βασιλεύω — царствовать. ἄρχοντες μετὰ κρίσεως ἄρξουσιν — «князья с судом будут начальствовать» (κρίσις — суд, правосудие; ἄρχω — начальствовать, править); слав. «князи со судом владети начнут»."
  2: "ὁ ἄνθρωπος κρύπτων τοὺς λόγους αὐτοῦ — «человек, скрывающий слова свои»; слав. «человек сокрываяй словеса своя». καὶ κρυβήσεται ὡς ἀφ᾿ ὕδατος φερομένου — «и скроется, как от воды несущейся» (φέρομαι — нестись, стремиться; ὕδωρ — вода); слав. «скрыется, аки от воды носимыя». φανήσεται ἐν Σιων ὡς ποταμὸς φερόμενος ἔνδοξος ἐν γῇ διψώσῃ — «явится в Сионе, как река текущая, славная в земле жаждущей» (ἔνδοξος — славный, великолепный; διψάω — жаждать). LXX здесь расходится с МТ: у Син. «каждый из них будет как защита от ветра и покров от непогоды, как источники вод в степи, как тень от высокой скалы в земле жаждущей»; чтение LXX/слав. сохранено, вариант МТ в текст не внесён."
  3: "οὐκέτι ἔσονται πεποιθότες ἐπ᾿ ἀνθρώποις — «уже не будут надеющимися на людей» (οὐκέτι — уже не); слав. «ксему не будут уповающе на человеки». ἀλλὰ τὰ ὦτα δώσουσιν ἀκούειν — «но уши дадут слушать», т. е. будут внимать (δίδωμι τὰ ὦτα — обращать слух); слав. «но ушы вдадят на слышание». У Син. по МТ иное: «очи видящих не будут закрываемы, и уши слышащих будут внимать»."
  4: "ἡ καρδία τῶν ἀσθενούντων προσέξει τοῦ ἀκούειν — «сердце изнемогающих внемлет слушать» (ἀσθενέω — болеть, изнемогать; προσέχω — внимать, обращаться к); слав. «сердце изнемогших вонмет послушати». αἱ γλῶσσαι αἱ ψελλίζουσαι — «языки косноязычные, запинающиеся» (ψελλίζω — говорить невнятно, лепетать); ταχὺ μαθήσονται λαλεῖν εἰρήνην — «скоро научатся говорить мир» (ταχύς — скорый); слав. «языцы немотствующии скоро научатся глаголати мир»."
  5: "οὐκέτι μὴ εἴπωσιν τῷ μωρῷ ἄρχειν — «уже не скажут глупому: начальствуй» (μωρός — глупый, слав. «юрод»); οἱ ὑπηρέται σου Σίγα — «слуги твои: молчи» (Σίγα — молчи, от σιγάω); слав. «слуги твои: молчи». Оба чужих слова — в 「…」. Син. по МТ даёт иное: «Невежду уже не будут называть почтенным, и о коварном не скажут, что он честный»."
  6: "ὁ γὰρ μωρὸς μωρὰ λαλήσει — «ибо глупый глупое скажет»: внутренняя этимология μωρός / μωρά сохранена (愚かな者 / 愚かなこと). ἡ καρδία αὐτοῦ μάταια νοήσει — «сердце его пустое помыслит» (μάταιος — пустой, тщетный). τοῦ συντελεῖν ἄνομα — «чтобы совершать беззаконие» (συντελέω — доводить до конца, совершать). λαλεῖν πρὸς κύριον πλάνησιν — «говорить против Господа заблуждение» (πλάνησις — обман, прельщение; слав. «прелесть»). τοῦ διασπεῖραι ψυχὰς πεινώσας — «чтобы рассеять души алчущие» (διασπείρω — рассеивать; πεινάω — голодать); слав. читает «растлити», т. е. погубить, — иная передача того же места, в тексте 散らす по LXX. καὶ τὰς ψυχὰς τὰς διψώσας κενὰς ποιῆσαι — «и души жаждущие сделать пустыми» (κενός — пустой)."
  7: "ἡ βουλὴ τῶν πονηρῶν ἄνομα βουλεύσεται — «совет злых беззаконное замыслит»; слав. «Совет бо злых беззаконная совещавает». καταφθεῖραι ταπεινοὺς ἐν λόγοις ἀδίκοις — «погубить смиренных словами неправедными» (ταπεινός — смиренный, униженный; ἄδικος — неправедный). διασκεδάσαι λόγους ταπεινῶν ἐν κρίσει — «рассеять слова смиренных на суде» (διασκεδάννυμι — разгонять, рассеивать)."
  8: "οἱ εὐσεβεῖς συνετὰ ἐβουλεύσαντο — «благочестивые разумное замыслили» (εὐσεβής — благочестивый; συνετός — разумный, рассудительный); слав. «Благочестивии же смысленне совещаша». αὕτη ἡ βουλὴ μενεῖ — «этот совет пребудет» (μένω — оставаться, пребывать); слав. «той совет пребудет»."
  9: "Γυναῖκες πλούσιαι — «жёны богатые» (πλούσιος — богатый); слав. «Жены богатыя». В МТ здесь «беспечные» (שַׁאֲנַנּוֹת), у Син. «Женщины беспечные»; LXX читает πλούσιαι — чтение сохранено. θυγατέρες ἐν ἐλπίδι — «дочери в надежде» (ἐλπίς — надежда); в МТ «дочери беззаботные», у Син. «дочери беззаботные»; слав. «дщери, с надеждею» — чтение LXX. ἀκούσατε τῆς φωνῆς μου — «услышьте голос мой»."
  10: "ἡμέρας ἐνιαυτοῦ μνείαν ποιήσασθε — «дня года память сотворите», т. е. вспомните день годичный (μνεία — память, упоминание); слав. «дня летняго память сотворите». ἐν ὀδύνῃ μετ᾿ ἐλπίδος — «в боли с надеждою» (ὀδύνη — боль, мука). ἀνήλωται ὁ τρύγητος — «истреблён сбор винограда» (ἀναλίσκω — истреблять; τρύγητος — виноградная жатва); πέπαυται ὁ σπόρος — «прекратился посев» (παύω — прекращать; σπόρος — сев); слав. добавляет в скобках «(собирание)» — редакционная глосса."
  11: "ἔκστητε, λυπήθητε — «изумитесь, опечальтесь» (ἐξίστημι — выходить из себя, ужасаться; λυπέω — печалить); слав. «Ужаснитеся, сжалитеся». αἱ πεποιθυῖαι — «уповавшие», т. е. самоуверенные (соверш. причастие от πείθω — доверять); ἐκδύσασθε, γυμναὶ γένεσθε — «совлекитесь, нагими станьте» (ἐκδύω — снимать одежду; γυμνός — нагой); περιζώσασθε σάκκους τὰς ὀσφύας — «препояшьте чресла вретищами» (σάκκος — вретище, грубая ткань; ὀσφύς — чресла, поясница)."
  12: "ἐπὶ τῶν μαστῶν κόπτεσθε — «в груди бейте себя» (μαστός — грудь; κόπτομαι — бить себя в знак плача); слав. «в перси бийтеся». ἀπὸ ἀγροῦ ἐπιθυμήματος — «о поле вожделенном» (ἐπιθύμημα — предмет желания); ἀμπέλου γενήματος — «о рождении винограда», т. е. об урожае лозы (γένημα — плод, урожай); слав. «о селе желаемем и о винограднем рождении»."
  13: "ἡ γῆ τοῦ λαοῦ μου ἄκανθα καὶ χόρτος ἀναβήσεται — «земля народа Моего тернием и травою произрастёт» (ἄκανθα — тёрн, колючка; χόρτος — трава); слав. «терние и былие возникнет». ἐκ πάσης οἰκίας εὐφροσύνη ἀρθήσεται — «из всякого дома веселие будет взято» (αἴρω — поднимать, уносить); слав. «от всего дому радость восхитится». πόλις πλουσία — «город богатый»: восклицание-обращение, продолжающееся в ст. 14 (у слав. так же: «град богат,»), поэтому в конце стиха — 富ある都よ."
  14: "οἶκοι ἐγκαταλελειμμένοι πλοῦτον πόλεως … ἀφήσουσιν — «дома оставленные богатство города… оставят»: греч. оборот тёмный, сохранён буквально; слав. «домове оставленнии, богатство града и домы вожделения оставят». κῶμαι σπήλαια ἕως τοῦ αἰῶνος — «сёла пещерами до века» (κώμη — село; σπήλαιον — пещера); слав. «веси пещеры до века». εὐφροσύνη ὄνων ἀγρίων — «веселие ослов диких» (ὄνος ἄγριος — дикий осёл); βοσκήματα ποιμένων — «паствы пастухов» (βόσκημα — пастбище, скот)."
  15: "ἕως ἂν ἐπέλθῃ ἐφ᾿ ὑμᾶς πνεῦμα ἀφ᾿ ὑψηλοῦ — «доколе не найдёт на вас Дух от вышнего» (ἐπέρχομαι — находить, приходить на; ὕψος — высота); слав. читает «на ны» (на нас) — по паритету в тексте わたしたち, вариант LXX ὑμᾶς отмечен здесь. ἔσται ἔρημος ὁ Χερμελ — «пустыня станет Хермелем»: LXX транслитерирует евр. כַּרְמֶל («плодоносное поле, сад»), в ст. 16 то же слово дано как Κάρμηλος (Кармил, гора); слав. «хермель», в тексте оба раза カルメル. ὁ Χερμελ εἰς δρυμὸν λογισθήσεται — «Хермель в лес вменится» (δρυμός — дубрава, лес; λογίζομαι — считаться); Син. «пустыня не сделается садом, а сад не будут считать лесом» (МТ)."
  16: "ἀναπαύσεται ἐν τῇ ἐρήμῳ κρίμα — «почиет в пустыне суд» (ἀναπαύω — успокаивать, давать покой; κρίμα — суд, приговор); слав. «И почиет в пустыни суд». δικαιοσύνη ἐν τῷ Καρμήλῳ κατοικήσει — «правда в Кармиле вселится» (κατοικέω — обитать). Здесь Κάρμηλος — уже имя горы/местности, в отличие от Χερμελ ст. 15."
  17: "τὰ ἔργα τῆς δικαιοσύνης εἰρήνη — «дела правды — мир»; слав. «дела правды мир». κρατήσει ἡ δικαιοσύνη ἀνάπαυσιν — «правда удержит покой» (κρατέω — держать, овладевать; ἀνάπαυσις — покой); слав. «одержит правда покой». πεποιθότες ἕως τοῦ αἰῶνος — «уповающие до века»: придаток без сказуемого, сохранён."
  18: "κατοικήσει ὁ λαὸς αὐτοῦ ἐν πόλει εἰρήνης — «будет жить народ Его в городе мира»; αὐτοῦ — Божий, поэтому その民. ἐνοικήσει πεποιθώς — «обитать будет уповая», т. е. в безопасности (ἐνοικέω — вселяться); ἀναπαύσονται μετὰ πλούτου — «почиют с богатством» (μετά с род. — вместе с). Син.: «в обители мира и в селениях безопасных, и в покоищах блаженных» (МТ)."
  19: "ἡ δὲ χάλαζα ἐὰν καταβῇ, οὐκ ἐφ᾿ ὑμᾶς ἥξει — «град же, если сойдёт, не на вас придёт» (χάλαζα — град); слав. «Град же, аще снидет, то не на вы приидет». οἱ ἐνοικοῦντες ἐν τοῖς δρυμοῖς — «живущие в дубравах»; ὡς οἱ ἐν τῇ πεδινῇ — «как [живущие] на равнине» (πεδινή — равнина, поле; слав. «на полях»). Син. по МТ: «И град будет падать на лес, и город спустится в долину» — иное чтение."
  20: "μακάριοι οἱ σπείροντες ἐπὶ πᾶν ὕδωρ — «блаженны сеющие при всякой воде» (σπείρω — сеять); слав. «Блажени сеющии при всяцей воде». οὗ βοῦς καὶ ὄνος πατεῖ — «где вол и осёл ступает» (πατέω — топтать, ходить по); слав. «идеже вол и осел попирает». Место читается как обетование плодородия и свободного доступа к воде."
