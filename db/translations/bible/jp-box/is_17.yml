verses:
  1: "ダマスコについての言葉[ことば]。見[み]よ、ダマスコは町々[まちまち]の数[かず]から取[と]り除[のぞ]かれ、崩[くず]れ落[お]ちるものとなる。"
  2: "それは永遠[えいえん]に捨[す]てられ、羊[ひつじ]の群[む]れの寝床[ねどこ]となり、憩[いこ]いの場[ば]となる。追[お]い払[はら]う者[もの]はいない。"
  3: "エフライムには、逃[に]げ込[こ]むべき要塞[ようさい]がもはやなく、ダマスコには王国[おうこく]がもはやない。シリアの残[のこ]りの者[もの]は滅[ほろ]びる。あなたはイスラエルの子[こ]らと、その栄光[えいこう]にまさる者[もの]ではないからである。万軍[ばんぐん]の主[しゅ]はこう言[い]われる。"
  4: "その日[ひ]、ヤコブの栄光[えいこう]は薄[うす]れ、その栄光の肥[こ]えた部分[ぶぶん]は震[ふる]える。"
  5: "それは、人[ひと]が立[た]っている刈[か]り入[い]れを集[あつ]め、その腕[うで]で穂[ほ]の実[み]を刈[か]り取[と]るようなものになる。また、堅[かた]い谷[たに]で穂[ほ]を集[あつ]めるようなものになる。"
  6: "そこには茎[くき]だけが残[のこ]る。また、オリーブの実[み]が、高[たか]い頂[いただき]に二[ふた]つ三[みっ]つ、その枝[えだ]に四[よっ]つ五[いつ]つ残るようにもなる。イスラエルの神[かみ]である主[しゅ]はこう言[い]われる。"
  7: "その日[ひ]、人[ひと]は自分[じぶん]を造[つく]った方[かた]に信頼[しんらい]し、その目[め]はイスラエルの聖[せい]なる方[かた]を仰[あお]ぎ見[み]る。"
  8: "彼らは高[たか]い所[ところ]にも、自分の手[て]のわざにも、自分の指[ゆび]が造[つく]ったものにも、もはや信頼[しんらい]しない。彼らは自分[じぶん]たちの木立[こだち]や、忌[いま]むべきものを見[み]ない。"
  9: "その日[ひ]、あなたの町々[まちまち]は捨[す]てられる。イスラエルの子[こ]らの前[まえ]からアモリ人[じん]とエビ人[じん]が捨[す]て去[さ]ったときのように、町々は荒[あ]れ果[は]てる。"
  10: "あなたは自分[じぶん]を救[すく]う神[かみ]を捨[す]て、自分を助[たす]ける主[しゅ]を思[おも]い起[おこ]さなかったからである。それゆえ、あなたは不実[ふじつ]な植[う]え物[もの]を植[う]え、不実な種[たね]をまく。"
  11: "あなたが植[う]える日[ひ]には、あなたは欺[あざむ]かれる。朝[あさ]に種[たね]をまけば、それが花[はな]咲[さ]いて刈[か]り入[い]れとなる、あなたが嗣業[しぎょう]を受[う]け取[と]るその日[ひ]に。そして、人[ひと]の父[ちち]のように、あなたは自分の子[こ]らに嗣業[しぎょう]を分[わ]け与[あた]える。"
  12: "ああ、多[おお]くの民[たみ]の群[む]れよ。あなたがたは波立[なみだ]つ海[うみ]のように騒[さわ]ぎ立[た]つ。多[おお]くの民[たみ]の群[む]れは水[みず]のように響[ひび]く。"
  13: "もろもろの民[たみ]は多[おお]い水[みず]のようであり、力[ちから]ずくで押[お]し流[なが]される多[おお]い水のようである。しかし、それは退[しりぞ]けられ、遠[とお]くへ追[お]い払[はら]われる。風[かぜ]の前[まえ]で、もみ殻[がら]をふるい分[わ]ける者[もの]が、その塵[ちり]を飛[と]ばすように。車輪[しゃりん]の塵[ちり]を、突風[とっぷう]が運[はこ]び去[さ]るように。"
  14: "夕[ゆう]べには嘆[なげ]きがある。朝[あさ]になる前[まえ]には、もうない。これが、あなたがたを略奪[りゃくだつ]した者[もの]たちの受[う]ける分[ぶん]であり、あなたがたを奪[うば]った者[もの]たちの嗣業[しぎょう]である。"

notes:
  1: "Τὸ ῥῆμα τὸ κατὰ Δαμασκοῦ — «слово на Дамаск», заголовок: слав. его опускает и начинает с «се, дамаск», в тексте дан по LXX. ἀρθήσεται ἀπὸ πόλεων — «будет взят из [числа] городов», т. е. перестанет быть городом (слав. «возмется от градов»). ἔσται εἰς πτῶσιν — «будет в падение», т. е. обратится в развалины (πτῶσις — «падение, обломки»)."
  2: "καταλελειμμένη εἰς τὸν αἰῶνα — «оставленная навек» (καταλείπω; причастие ж. р. — о городе или стране). εἰς κοίτην ποιμνίων καὶ ἀνάπαυσιν — «в ложе стад и покой» (κοίτη — «ложе»; слав. «в ложе стадам и в покой»). οὐκ ἔσται ὁ διώκων — «не будет гонящего», т. е. пугающего стадо."
  3: "ὀχυρὰ τοῦ καταφυγεῖν Εφραιμ — «твердыня, чтобы убежать Ефрему» (ὀχυρός — «крепкий»; слав. «укреплен, еже вбегнути тамо ефрему»). τὸ λοιπὸν τῶν Σύρων — «остаток сирийцев» (Σύροι; слав. «сирян»). οὐ γὰρ σὺ βελτίων εἶ τῶν υἱῶν Ισραηλ — «ибо не ты лучше сынов Израиля» (βελτίων — сравн. степ. от ἀγαθός). τάδε λέγει κύριος σαβαωθ — формула вне кавычек."
  4: "ἔκλειψις τῆς δόξης Ιακωβ — «оскудение славы Иакова» (ἔκλειψις — «исчезновение, убыль»; слав. «помрачение»). τὰ πίονα τῆς δόξης αὐτοῦ — «тучное славы его» (πίων — «жирный, тучный»), т. е. полнота, дородство; образ сохранён. σεισθήσεται — «потрясётся» (σείω)."
  5: "ὃν τρόπον ἐάν τις συναγάγῃ ἀμητὸν ἑστηκότα — «как если кто соберёт стоящую жатву»: ἀμητός — «жатва»; ἑστηκότα — «стоящий», т. е. ещё не сжатый хлеб на корню. σπέρμα σταχύων ἐν τῷ βραχίονι αὐτοῦ ἀμήσῃ — «семя колосьев в мышце своей пожнёт» (βραχίων — «мышца, рука»; слав. «семя класов пожинает»). φάραγξ στερεά — «ущелье твёрдое, скалистое» (φάραγξ — «ущелье»; слав. «дебрь тверда»)."
  6: "καλάμη — «стерня, соломина» (слав. «стеблие»). ῥῶγες ἐλαίας — «ягоды маслины» (ῥώξ — «ягода»); ἐπ᾿ ἄκρου μετεώρου — «на высокой вершине» (μετέωρος — «поднятый, высокий»). καταλειφθῇ повторено в конце стиха; повтор сохранён. τάδε λέγει κύριος ὁ θεὸς Ισραηλ — формула вне кавычек."
  7: "πεποιθὼς ἔσται ἄνθρωπος ἐπὶ τῷ ποιήσαντι αὐτόν — «человек будет уповая на Сотворившего его»: πεποιθώς — причастие перфекта от πείθω, перифрастическое будущее (слав. «уповая будет»). εἰς τὸν ἅγιον τοῦ Ισραηλ ἐμβλέψονται — «на Святого Израилева воззрят» (ἐμβλέπω — «смотреть на»)."
  8: "ἐπὶ τοῖς βωμοῖς — «на жертвенники, высоты» (βωμός; слав. «требища»). ἔργα τῶν χειρῶν … ἃ ἐποίησαν οἱ δάκτυλοι αὐτῶν — «дела рук… что сделали персты их»; параллелизм сохранён. τὰ δένδρα αὐτῶν — «деревья их»; слав. «дубравы» («рощи»), по паритету в тексте 木立. βδελύγματα — «мерзости», т. е. идолы (слав. «мерзости»)."
  9: "αἱ πόλεις σου ἐγκαταλελειμμέναι — «города твои оставленные» (ἐγκαταλείπω). ὃν τρόπον ἐγκατέλιπον οἱ Αμορραῖοι καὶ οἱ Ευαῖοι ἀπὸ προσώπου τῶν υἱῶν Ισραηλ — «как оставили аморреи и евеи от лица сынов Израиля»: Αμορραῖοι — аморреи, Ευαῖοι — евеи (слав. «аморрее и евее»). ἔσονται ἔρημοι — «будут пусты»."
  10: "κατέλιπες τὸν θεὸν τὸν σωτῆρά σου — «ты оставил Бога, Спасителя твоего». κυρίου τοῦ βοηθοῦ σου οὐκ ἐμνήσθης — «Господа, Помощника твоего, не вспомнил» (ἐμνήσθης от μιμνῄσκομαι). φυτεύσεις φύτευμα ἄπιστον καὶ σπέρμα ἄπιστον — «насадишь насаждение неверное и семя неверное» (ἄπιστος — «неверный, ненадёжный»); слав. «сад неверен и семя неверно»."
  11: "τῇ δὲ ἡμέρᾳ, ᾗ ἂν φυτεύσῃς, πλανηθήσῃ — «в день, когда посадишь, обманешься» (πλανάω — «вводить в заблуждение»; слав. «прельстишися»). τὸ δὲ πρωί, ἐὰν σπείρῃς, ἀνθήσει εἰς ἀμητόν — «а утром, если посеешь, расцветёт к жатве». ᾗ ἂν ἡμέρᾳ κληρώσῃ — «в какой день получишь в удел» (κληρόω — «наделять жребием»). ὡς πατὴρ ἀνθρώπου κληρώσῃ τοῖς υἱοῖς σου — тёмное место: «как отец человека, дашь удел сынам твоим»; буквально, без сглаживания."
  12: "Οὐαὶ πλῆθος ἐθνῶν πολλῶν — «горе множеству народов многих» (слав. «о, люте множеству языков многих»), передано ああ. ὡς θάλασσα κυμαίνουσα — «как море волнующееся» (κυμαίνω — «вздымать волны»). ταραχθήσεσθε — «смутитесь, взволнуетесь». νῶτος ἐθνῶν πολλῶν — «хребет народов многих» (νῶτος — «спина, хребет»), т. е. их масса; образ сохранён."
  13: "ὡς ὕδωρ πολὺ ἔθνη πολλά — «как вода многая — народы многие». βίᾳ καταφερομένου — «силою уносимой» (βία — «насилие, сила»; καταφέρομαι — «уноситься вниз»). ἀποσκορακιεῖ — «отвергнет, отгонит» (ἀποσκορακίζω, букв. «посылать к воронам»; слав. «отвержет»); подлежащее в греч. не названо, в тексте страдательный оборот. χνοῦς ἀχύρου — «пыль мякины» (χνοῦς — «пыль, пух»; ἄχυρον — «мякина»). λικμώντων ἀπέναντι ἀνέμου — «веющих против ветра» (λικμάω — «веять»). κονιορτὸς τροχοῦ — «пыль колеса»; καταιγίς — «буря, вихрь»."
  14: "πρὸς ἑσπέραν ἔσται πένθος — «к вечеру будет плач» (ἑσπέρα — «вечер»). πρὶν ἢ πρωῒ καὶ οὐκ ἔσται — «прежде утра — и не будет»: внезапность гибели, без глагола; слав. «прежде заутрия, и не будет». μερίς — «участь, доля»; κληρονομία — «наследие»; τῶν ὑμᾶς προνομευσάντων — «ограбивших вас» (προνομεύω), τοῖς ὑμᾶς κληρονομήσασιν — «получившим вас в наследие»."
