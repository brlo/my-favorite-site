# jp-box, Иона, глава 3. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 3 (совпадает, 10 стихов).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1–2 второе повеление идти в Ниневию; 3–4 Иона входит в город на день
# пути и проповедует: «ещё три дня, и Ниневия разрушится»; 5 вера ниневитян, пост,
# вретище; 6 царь сходит с престола, вретище и пепел; 7–9 указ: ни люди, ни скот
# ничего не вкушают, вретище на всех, «кто знает, не раскается ли Бог»;
# 10 Бог видит обращение и отменяет бедствие.
# Голоса: 1 — формула вне кавычек; 2 — слово Господа в 「…」; 3, 5–6, 10 —
# повествование; 4 — проповедь Ионы в 「…」; 7 — указ царя и вельмож
# в 「…」 (открывается и закрывается в стихе); 8 — повествование (аористы:
# облеклись, возопили, обратились); 9 — слова ниневитян в 「…».
# Важно: в 3:4 по LXX и слав. — «ещё три дня» (в ru/МТ «сорок дней»); держим
# церковное чтение, разница в notes.
#
tr_code: jp-box
book: ion
chapter: 3
draft: true

verses:
  1: "主[しゅ]の言葉[ことば]が再[ふたた]びヨナに臨[のぞ]んで言[い]った。"
  2: "「立[た]って、大[おお]きな都[みやこ]ニネベへ行[き]、わたしがあなたに語[かた]ったとおりに、その都[みやこ]に向[む]かって叫[さけ]べ。」"
  3: "ヨナは立[た]って、主[しゅ]の言葉[ことば]どおりにニネベへ行[い]った。ニネベは神[かみ]の前[まえ]に大[おお]きな都[みやこ]で、三日[みっか]の道[みち]の広[ひろ]さがあった。"
  4: "ヨナは都[みやこ]に入[はい]り、一日[いちにち]の道[みち]を歩[ある]いて叫[さけ]んだ。「あと三日[みっか]で、ニネベは滅[ほろ]ぼされる。」"
  5: "ニネベの人[ひと]々[びと]は神[かみ]を信[しん]じ、断食[だんじき]を布告[ふこく]し、大[おお]きい者[もの]から小[ちい]さい者[もの]まで粗布[あらぬの]を身[み]にまとった。"
  6: "その言葉[ことば]がニネベの王[おう]に届[とど]くと、王[おう]は王座[おうざ]から立[た]ち、外套[がいとう]を脱[ぬ]ぎ、粗布[あらぬの]をまとって灰[はい]の上[うえ]に座[すわ]った。"
  7: "王[おう]とその重臣[じゅうしん]たちは、ニネベで宣[の]べ伝[つた]えさせた。「人[ひと]も家畜[かちく]も、牛[うし]も羊[ひつじ]も、何[なに]も味[あじ]わってはならない。牧[まき]草[くさ]を食[は]んでもいけないし、水[みず]も飲[の]んではならない。」"
  8: "人[ひと]も家畜[かちく]も粗布[あらぬの]をまとって、力[ちから]を尽[つ]くして神[かみ]に叫[さけ]び、それぞれ悪[わる]い道[みち]から、また手[て]にある不[ふ]法[ほう]から離[はな]れた。"
  9: "「もしかすると、神[かみ]は思[おも]い直[なお]して、その激[はげ]しい怒[いか]りを収[おさ]め、わたしたちが滅[ほろ]びないようにされるかもしれない。」"
  10: "神[かみ]は彼らの行[おこな]いを見[み]た。すなわち、彼らが悪[わる]い道[みち]から離[はな]れたことを。そして神[かみ]は、彼らに下[くだ]そうと言[い]われた災[わざわ]いについて思[おも]い直[なお]し、それをされなかった。"

notes:
  1: "ἐκ δευτέρου — «во второй раз» (слав. «вторицею»)."
  2: "κατὰ τὸ κήρυγμα τὸ ἔμπροσθεν, ὃ ἐγὼ ἐλάλησα πρὸς σέ — «по прежней проповеди, которую Я говорил тебе» (слав. «по проповеди преждней, юже аз глаголах тебе»); в ru «что Я повелел тебе» — иное чтение, в текст не внесено."
  3: "ἡ δὲ Νινευη ἦν πόλις μεγάλη τῷ θεῷ — «Ниневия была город великий у Бога», т. е. весьма великий (слав. «град велик Богу»); ὡσεὶ πορείας ὁδοῦ ἡμερῶν τριῶν — «как на три дня пути» (слав. «яко шествия пути триех дний»)."
  4: "ἤρξατο Ιωνας τοῦ εἰσελθεῖν εἰς τὴν πόλιν — «начал Иона входить в город»; ὡσεὶ πορείαν ἡμέρας μιᾶς — «как на день пути»; Ἔτι τρεῖς ἡμέραι καὶ Νινευη καταστραφήσεται — «ещё три дня, и Ниневия будет разрушена»: в LXX и слав. «три дня», в ru/МТ «сорок дней»; держим церковное чтение, расхождение отмечено здесь."
  5: "ἐνεπίστευσαν οἱ ἄνδρες Νινευη τῷ θεῷ — «уверовали мужи Ниневийские в Бога»; ἐκήρυξαν νηστείαν — «проповедали пост» (слав. «заповедаша пост»); ἐνεδύσαντο σάκκους — «облеклись во вретища» (σάκκος — 粗布 по корпусу); ἀπὸ μεγάλου αὐτῶν ἕως μικροῦ αὐτῶν — «от большого их до малого их»."
  6: "ἤγγισεν ὁ λόγος πρὸς τὸν βασιλέα — «дошло слово до царя» (слав. «дойде слово ко царю»); ἐξανέστη ἀπὸ τοῦ θρόνου αὐτοῦ — «встал с престола своего»; περιείλατο τὴν στολὴν αὐτοῦ ἀφ᾽ ἑαυτοῦ — «снял с себя облачение своё» (στολή; слав. «сверже ризы своя»); περιεβάλετο σάκκον — «облекся во вретище»; ἐκάθισεν ἐπὶ σποδοῦ — «сел на пепле» (σποδός — пепел)."
  7: "ἐκηρύχθη καὶ ἐρρέθη ἐν τῇ Νινευη παρὰ τοῦ βασιλέως καὶ παρὰ τῶν μεγιστάνων αὐτοῦ — «провозглашено и сказано в Ниневии от царя и от вельмож его» (μεγιστάν — вельможа; слав. «от царя и вельмож его»); μὴ γευσάσθωσαν μηδὲν — «да не вкусят ничего»; μηδὲ νεμέσθωσαν — «и да не пасутся» (νέμομαι — пастись); μηδὲ ὕδωρ πιέτωσαν — «и воды да не пьют»."
  8: "περιεβάλοντο σάκκους οἱ ἄνθρωποι καὶ τὰ κτήνη — «облеклись во вретища люди и скот»; ἀνεβόησαν πρὸς τὸν θεὸν ἐκτενῶς — «возопили к Богу прилежно» (ἐκτενῶς — усиленно, настойчиво); ἀπέστρεψαν ἕκαστος ἀπὸ τῆς ὁδοῦ αὐτοῦ τῆς πονηρᾶς — «обратился каждый от пути своего злого»; ἀπὸ τῆς ἀδικίας τῆς ἐν χερσὶν αὐτῶν — «от неправды, что в руках их»."
  9: "Слова ниневитян (в LXX вводятся причастием «говоря» в конце 8). Τίς οἶδεν εἰ μετανοήσει ὁ θεός — «кто знает, не переменит ли Бог решения» (εἰ в косвенном вопросе); ἀποστρέψει ἐξ ὀργῆς θυμοῦ αὐτοῦ — «отвратит от гнева ярости Своей»; οὐ μὴ ἀπολώμεθα — «и не погибнем»."
  10: "εἶδεν ὁ θεὸς τὰ ἔργα αὐτῶν — «увидел Бог дела их»; ὅτι ἀπέστρεψαν ἀπὸ τῶν ὁδῶν αὐτῶν τῶν πονηρῶν — «что обратились от путей своих злых»; μετενόησεν ὁ θεὸς ἐπὶ τῇ κακίᾳ — «переменил решение Бог о зле» (μετανοέω о Боге — «отменять сказанное», в тексте 思い直す; 悔い改める оставлено для людей; слав. «раскаяся Бог о зле»); ἧς ἐλάλησεν τοῦ ποιῆσαι αὐτοῖς — «о котором сказал, что сделает им»; καὶ οὐκ ἐποίησεν — «и не сделал»."
