# jp-box, Откровение Иоанна, глава 8. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий (gr-lxx-byz) — свидетель; чего в нём нет, то в 〔…〕.
# Глава 8: седьмая печать и тишина (1–2), ангел с кадилом (3–5), первые четыре трубы (6–12),
# полёт орла с троекратным «горе» (13).
# Красного <j> в главе нет: прямой речи Христа нет. Слова ангела (8:13, устами птицы) — в «…»,
# не красные; ангельских речей в 8:1–12 нет вообще.
# 〔…〕 в главе нет: все слова в базе есть. 8:13 — в базе ἀετοῦ («орёл»), поэтому 鷲;
# у jp-joc здесь 天使 (то есть ἀγγέλου), это чтение не принято — см. notes.
# Сноска ⟨…⟩ одна: 苦よもぎ (8:11), первое упоминание в корпусе. jp-ni не использовался.

tr_code: jp-box
book: otkr
chapter: 8
draft: true

verses:
  1: "第七[だいしち]の封印[ふういん]が開[ひら]かれると、天[てん]は半時間[はんじかん]ほど静[しず]まり返[かえ]った。"
  2: "神[かみ]の前[まえ]に立[た]つ七[なな]人[にん]の天使[てんし]たちが、わたしの目[め]に留[と]まった。彼[かれ]らに七[なな]つのラッパが渡[わた]された。"
  3: "また、別[べつ]の天使[てんし]が来[き]て、祭壇[さいだん]のそばに立[た]った。彼[かれ]は金[きん]の香炉[こうろ]を持[も]っていた。そして、すべての聖[せい]なる者[もの]たちの祈[いの]りと共[とも]に、御座[みくら]の前[まえ]にある金[きん]の祭壇[さいだん]の上[うえ]にささげるために、多[おお]くの香[こう]が彼[かれ]に与[あた]えられた。"
  4: "香[こう]の煙[けむり]は、聖[せい]なる者[もの]たちの祈[いの]りと共[とも]に、天使[てんし]の手[て]から神[かみ]の前[まえ]へ上[のぼ]って行[い]った。"
  5: "天使[てんし]は香炉[こうろ]を取[と]って、祭壇[さいだん]の火[ひ]をその中[なか]に満[み]たし、地[ち]に投[な]げた。すると、雷[かみなり]と声[こえ]と稲妻[いなずま]と地震[じしん]が起[こ]った。"
  6: "七[なな]つのラッパを持[も]つ七[なな]人の天使[てんし]たちは、それを吹[ふ]く用意[ようい]をした。"
  7: "第一[だいいち]の天使[てんし]がラッパを吹[ふ]いた。すると、雹[ひょう]と火[ひ]とが血[ち]に混[ま]じり合[あ]って地[ち]に投[な]げられ、地[ち]の三分[さんぶん]の一[いち]と、木[き]の三分[さんぶん]の一[いち]とが焼[や]かれ、青[あお]い草[くさ]もすべて焼[や]かれた。"
  8: "第二[だいに]の天使[てんし]がラッパを吹[ふ]いた。すると、炎[ほのお]に包[つつ]まれた大[おお]きな山[やま]のようなものが海[うみ]に投[な]げ込[こ]まれ、海[うみ]の三分[さんぶん]の一[いち]が血[ち]に変[か]わった。"
  9: "海[うみ]に住[す]む生[い]き物[もの]の三分[さんぶん]の一[いち]が死[し]に絶[た]え、船[ふね]も三分[さんぶん]の一[いち]が失[うしな]われた。"
  10: "第三[だいさん]の天使[てんし]がラッパを吹[ふ]いた。すると、松明[たいまつ]のように燃[も]える大[おお]きな星[ほし]が天[てん]から落[お]ちて来[き]て、川[かわ]と水[みず]の泉[いずみ]の三分[さんぶん]の一[いち]の上[うえ]に落[お]ちた。"
  11: "その星[ほし]の名[な]は苦[にが]よもぎ⟨苦[にが]い味[あじ]のする草[くさ]。⟩と呼[よ]ばれる。水[みず]の三分[さんぶん]の一[いち]が苦[にが]よもぎのようになり、水[みず]が苦[にが]くなったため、多[おお]くの人[ひと]々[びと]が死[し]んだ。"
  12: "第四[だいよん]の天使[てんし]がラッパを吹[ふ]くと、太陽[たいよう]と月[つき]と星[ほし]のそれぞれ三分[さんぶん]の一[いち]が打[う]たれ、その三分[さんぶん]の一[いち]が暗[くら]くなった。こうして昼[ひる]も夜[よる]も、その三分[さんぶん]の一[いち]は光[ひかり]を失[うしな]った。"
  13: "わたしは見[み]て、聞[き]いた。一羽[いちわ]の鷲[わし]が空[そら]の真[ま]ん中[なか]を飛[と]びながら、大[おお]きな声[こえ]で言[い]う。「災[わざわ]いだ、災[わざわ]いだ、災[わざわ]いだ、地[ち]に住[す]む者[もの]たちに。まだ三人[さんにん]の天使[てんし]が吹[ふ]こうとしているラッパの残[のこ]りの音[ね]のゆえに。」"

notes:
  1: "ἡμίωρον — 半時間. σιγή — 静けさ; 静まり返った передаёт полную тишину."
  2: "σάλπιγξ — ラッパ. ἑστήκασιν — 立つ (perfect, «предстоят»). ἐδόθησαν αὐτοῖς — 渡された."
  3: "λιβανωτὸς χρυσοῦς — 金の香炉. θυμιάματα — 香. ἐπὶ τοῦ θυσιαστηρίου — у жертвенника (род. п.). ἵνα δώσει ταῖς προσευχαῖς — 祈りと共にささげる."
  4: "καπνὸς τῶν θυμιαμάτων — 香の煙. ἐκ χειρὸς τοῦ ἀγγέλου — 天使の手から."
  5: "ἐγέμισεν αὐτὸν ἐκ τοῦ πυρός — 祭壇の火を満たす. βρονταὶ καὶ φωναὶ καὶ ἀστραπαὶ καὶ σεισμός — 雷と声と稲妻と地震 (порядок базы)."
  6: "ἡτοίμασαν ἑαυτούς — 用意をした. ἵνα σαλπίσωσιν — 吹くために."
  7: "χάλαζα — 雹. μεμιγμένα ἐν αἵματι — 血に混じり合って. τὸ τρίτον τῆς γῆς — 地の三分の一. χόρτος χλωρός — 青い草."
  8: "ὡς ὄρος μέγα πυρὶ καιόμενον — 炎に包まれた大きな山のようなもの. ἐγένετο… αἷμα — 血に変わった."
  9: "κτίσματα — 生き物. πλοῖα — 船. διεφθάρησαν — 失われた (погибли)."
  10: "λαμπάς — 松明. πηγαὶ τῶν ὑδάτων — 水の泉. τὸ τρίτον τῶν ποταμῶν — 川の三分の一."
  11: "Ἄψινθος — 苦よもぎ (полынь); слово редкое, сноска при первом упоминании. ἐπικράνθησαν — 苦くなった."
  12: "ἐπλήγη — 打たれた. σκοτισθῇ — 暗くなる. ἡ ἡμέρα… τὸ τρίτον αὐτῆς — 昼もその三分の一. ἡ νὺξ ὁμοίως — 夜も同じように."
  13: "ἀετοῦ — 鷲: в базе ἀετός (проверено: αετου — ЕСТЬ, αγγελου — НЕТ); у jp-joc здесь 天使, чтение ἀγγέλου не принято. μεσουράνημα — 空の真ん中. οὐαί — 災い, троекратно. Слова птицы — «…», не красные."
