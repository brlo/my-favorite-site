# jp-box, Иисус Навин, глава 24. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в гл. 24 отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 24: завет в Силоме (по LXX; традиционно — в Сихеме). Собрание колен (1), речь Иисуса со словами Бога
# от Авраама до завоевания (2–13), призыв служить Господу и «я и дом мой» (14–15),
# ответ народа (16–18), «не сможете служить» и условие (19–20), исповедание народа
# (21), свидетельство (22), «отвергните чужих богов» (23), ответ народа (24),
# завет и камень свидетельства (25–27), отпуск народа (28), смерть и погребение
# Иисуса (29–31), кости Иосифа (32), смерть Елеазара и Финеес (33), отступление
# и Еглон (34).
# НУМЕРАЦИЯ: в gr-lxx-byz 34 стиха, в csl-ru — 36. Соответствие: gr 1–28 = csl 1–28;
# gr 29 = csl 29 (Израиль служил Господу); gr 30 = csl 30 (смерть Иисуса); gr 31 =
# csl 31 (погребение; внутри gr 31 стоит добавление 31a о каменных ножах); gr 32 =
# csl 32 (кости Иосифа); gr 33 = csl 33 (смерть Елеазара; внутри gr 33 стоит
# добавление 33a о ковчеге и Финеесе — в csl это отдельный ст. 34); gr 34 = csl 35–36
# (уход каждого в своё место и служение Астарте, пленение Еглоном). В ru ст. 29–31
# переставлены: 29 — смерть, 30 — погребение, 31 — служение Израиля. Держимся gr.
# Кавычки: 1 — повествование; 2–13 — речь Иисуса 「…」 со словами Бога 『…』 (2b–13);
# 14–15 — Иисус 「…」; 16–18 — ответ народа 「…」; 19–20 — Иисус; 21 — народ; 22 — Иисус;
# 23 — Иисус; 24 — народ; 25–26 — повествование; 27 — Иисус; 28–34 — повествование.
# Красного нет.
# 〔…〕 нет: csl-добавления (24:5 «послах Моисеа и аарона», 24:22 «и рекоша:
# свидетели мы») в gr-lxx-byz отсутствуют и в текст не внесены — см. notes.
# Сносок ⟨…⟩ нет: 契約の箱, 幕屋, 祭司, 割礼, 嗣業 уже пояснены в корпусе.
# Отличия LXX: 24:1 и 24:25 — Σηλω (Силом, シロ), в csl и ru «Сихем»; 24:12 —
# «двенадцать царей» (δώδεκα), в csl и ru «два»; 24:4–5 — «озлобили египтяне»
# открывает в gr ст. 5 (в csl это конец ст. 4), а «послал Моисея и Аарона» есть
# только в csl; 24:8 — «вы истребили» (2 л. мн.), в ru «Я истребил»; 24:17 — csl
# добавляет «от дому работы… знамения велия»; 24:18 — gr «Аморрея и все народы»,
# csl «вся языки и аморреа»; 24:24 — gr «Господу», csl «Господу Богу нашему»;
# 24:27 — gr «Богу моему» (μου), csl «вашему». jp-ni не использовался.

