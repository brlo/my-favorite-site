verses:
  1: "ヨシュアはイスラエルのすべての部族[ぶぞく]をシロに集[あつ]め、その長老[ちょうろう]たち、その書記[しょき]たち、その裁[さば]き人[びと]たちを呼[よ]び集[あつ]めて、彼[かれ]らを神[かみ]の前[まえ]に立[た]たせた。"
  2: "ヨシュアは民[たみ]すべてに言[い]った。「イスラエルの神[かみ]であられる主[しゅ]はこう言[い]われる。『あなたがたの父祖[ふそ]たちは、昔[むかし]から川[かわ]の向[む]こうに住[す]んでいた。テラはアブラハムの父[ちち]、またナホルの父であり、彼らは他[ほか]の神々[かみがみ]に仕[つか]えていた。"
  3: "わたしはあなたがたの父[ちち]アブラハムを川[かわ]の向[む]こうから取[と]り、彼[かれ]をその地[ち]の至[いた]る所[ところ]へ導[みちび]き、彼の子孫[しそん]を多[おお]くし、彼にイサクを与[あた]えた。"
  4: "イサクにはヤコブとエサウを与[あた]えた。エサウにはセイルの山[やま]を嗣業[しぎょう]として与えたが、ヤコブとその子[こ]らはエジプトに下[くだ]って行[い]き、そこで大[おお]きく、多[おお]く、強[つよ]い民[たみ]となった。"
  5: "エジプト人[じん]は彼[かれ]らを苦[くる]しめた。そこで主[しゅ]は、彼らになさった数々[かずかず]のわざによってエジプトを撃[う]たれ、その後[のち]、あなたがたを導[みちび]き出[だ]された。"
  6: "エジプトから出[で]たあなたがたは、紅海[こうかい]に入[はい]った。エジプト人[じん]は、あなたがたの父祖[ふそ]たちの後[あと]を、戦車[せんしゃ]と馬[うま]で紅海まで追[お]って来た。"
  7: "わたしたちは主[しゅ]に叫[さけ]んだ。すると主は、わたしたちとエジプト人[じん]との間[あいだ]に雲[くも]と暗[くら]やみを置[お]き、彼らの上[うえ]に海[うみ]を押[お]し寄[よ]せて、彼らを覆[おお]われた。あなたがたの目[め]は、主がエジプトの地[ち]でなさったことをすべて見[み]た。そしてあなたがたは、多[おお]くの日[ひ]を荒野[こうや]で過[す]ごした。"
  8: "わたしはあなたがたを、ヨルダン川[がわ]の向[む]こうに住[す]むアモリ人[じん]の地[ち]へ導[みちび]いた。彼らはあなたがたと戦[たたか]ったが、主[しゅ]は彼らをあなたがたの手[て]に渡[わた]された。あなたがたは彼らの地を嗣業[しぎょう]として受[う]け継[つ]ぎ、彼らをあなたがたの前[まえ]から滅[ほろ]ぼした。"
  9: "モアブの王[おう]、セポルの子[こ]バラクは立[た]ち上[あ]がり、イスラエルと戦[たたか]った。彼は人[ひと]を送[おく]ってバラムを呼[よ]び、あなたがたを呪[のろ]わせようとした。"
  10: "しかし、あなたの神[かみ]であられる主[しゅ]は、あなたを滅[ほろ]ぼすことを望[のぞ]まれなかった。かえって、祝福[しゅくふく]をもってあなたがたを祝福し、あなたがたを彼らの手[て]から救[すく]い出[だ]して、彼らを渡[わた]された。"
  11: "あなたがたはヨルダン川[がわ]を渡[わた]って、エリコに来[き]た。エリコの住民[じゅうみん]、アモリ人[じん]、カナン人[じん]、ペリジ人[じん]、ヒビ人[じん]、エブス人[じん]、ヘテ人[じん]、ゲルガシ人[じん]は、あなたがたと戦[たたか]ったが、主[しゅ]は彼らをあなたがたの手[て]に渡[わた]された。"
  12: "また、わたしはあなたがたの前[まえ]に蜂[はち]を送[おく]り、アモリ人[じん]の十二人[じゅうににん]の王[おう]たちを、あなたがたの前から追[お]い払[はら]った。それはあなたの剣[けん]によってでも、あなたの弓[ゆみ]によってでもなかった。"
  13: "そして、あなたがたが耕[たがや]さなかった地[ち]と、あなたがたが建[た]てなかった町[まち]をあなたがたに与[あた]え、あなたがたはそこに住[す]んでいる。あなたがたが植[う]えなかったぶどう園[えん]とオリーブ園[えん]から、あなたがたは食[た]べている。』」"
  14: "「今[いま]、主[しゅ]を恐[おそ]れ、まっすぐな心[こころ]と正[ただ]しさをもって主に仕[つか]えなさい。あなたがたの父祖[ふそ]たちが川[かわ]の向[む]こうとエジプトで仕[つか]えた他[ほか]の神々[かみがみ]を取[と]り除[のぞ]き、主に仕えなさい。"
  15: "もし主[しゅ]に仕[つか]えることがあなたがたにとって好[この]ましくないなら、今日[きょう]、あなたがたがどちらに仕えるかを、あなたがた自身[じしん]で選[えら]びなさい。川[かわ]の向[む]こうにいたあなたがたの父祖[ふそ]たちの神々[かみがみ]か、それとも、あなたがたがその地[ち]に住[す]んでいるアモリ人[じん]の神々か。このわたしと、わたしの家[いえ]の者[もの]たちは、主[しゅ]に仕える。主は聖[せい]なる方[かた]だからである。」"
  16: "民[たみ]は答[こた]えて言[い]った。「わたしたちが主[しゅ]を捨[す]てて、他[ほか]の神々[かみがみ]に仕[つか]えるなど、決[けっ]してあってはならない。"
  17: "わたしたちの神[かみ]であられる主[しゅ]こそ神である。この方[かた]が、わたしたちとわたしたちの父祖[ふそ]たちをエジプトから導[みちび]き上[あ]げ、わたしたちが歩[あゆ]んだすべての道[みち]と、わたしたちが通[とお]ってきたすべての民[たみ]の間[あいだ]で、わたしたちを守[まも]ってくださった。"
  18: "主[しゅ]はアモリ人[じん]と、この地[ち]に住[す]んでいたすべての民[たみ]を、わたしたちの前[まえ]から追[お]い出[だ]された。だから、わたしたちも主に仕[つか]える。この方こそわたしたちの神[かみ]だからである。」"
  19: "ヨシュアは民[たみ]に言[い]った。「あなたがたは主[しゅ]に仕[つか]えることはできない。この方[かた]は聖[せい]なる神[かみ]、ねたみを抱[いだ]く方[かた]であり、あなたがたの罪[つみ]と不法[ふほう]をそのままにされないからである。"
  20: "あなたがたが主[しゅ]を捨[す]てて他[ほか]の神々[かみがみ]に仕[つか]えるなら、主はあなたがたに臨[のぞ]んで災[わざわ]いを下[くだ]し、あなたがたを滅[ほろ]ぼし尽[つ]くされる。あなたがたに良[よ]くしてくださったのに、その代[か]わりに、そうされるのである。」"
  21: "民[たみ]はヨシュアに言[い]った。「いいえ、わたしたちは主[しゅ]に仕[つか]える。」"
  22: "ヨシュアは民[たみ]に言[い]った。「あなたがたは自分自身[じしん]に不利[ふり]な証人[しょうにん]である。あなたがたが主[しゅ]を選[えら]んで、主に仕[つか]えることにしたのだから。"
  23: "今[いま]、あなたがたのうちにある他[ほか]の神々[かみがみ]を取[と]り除[のぞ]き、あなたがたの心[こころ]をイスラエルの神[かみ]であられる主[しゅ]に向[む]けてまっすぐにしなさい。」"
  24: "民[たみ]はヨシュアに言[い]った。「わたしたちはわたしたちの神[かみ]であられる主[しゅ]に仕[つか]え、その声[こえ]に聞[き]き従[したが]う。」"
  25: "その日[ひ]、ヨシュアは民[たみ]と契約[けいやく]を結[むす]び、シロで、イスラエルの神[かみ]の幕屋[まくや]の前[まえ]で、彼らに律法[りっぽう]と裁[さば]きを授[さず]けた。"
  26: "ヨシュアはこれらの言葉[ことば]を神[かみ]の律法[りっぽう]の書[しょ]に書[か]き記[しる]した。そして大[おお]きな石[いし]を取[と]り、主[しゅ]の前[まえ]にあるテレビンの木[き]の下[した]にそれを立[た]てた。"
  27: "ヨシュアは民[たみ]に言[い]った。「見[み]よ、この石[いし]はあなたがたに対する証[あかし]となる。この石は、主[しゅ]が今日[きょう]わたしたちに語[かた]られたすべての言葉[ことば]を聞[き]いたからである。この石は、あなたがたがわたしの神[かみ]である主に偽[いつわ]りを言[い]う終[お]わりの日[ひ]々に、あなたがたに対する証となる。」"
  28: "ヨシュアは民[たみ]を去[さ]らせ、彼[かれ]らはそれぞれ自分[じぶん]の場所[ばしょ]へ帰[かえ]った。"
  29: "イスラエルは、ヨシュアのすべての日[ひ]々、また、ヨシュアとともに長[なが]らえ、主[しゅ]がイスラエルになさったすべての御業[みわざ]を見[み]た長老[ちょうろう]たちのすべての日々、主に仕[つか]えた。"
  30: "これらのことの後[のち]、ヌンの子[こ]ヨシュア、主[しゅ]の僕[しもべ]は死[し]んだ。百十歳[ひゃくじゅっさい]であった。"
  31: "彼[かれ]を、その嗣業[しぎょう]の領界[りょうかい]のうち、エフライムの山地[さんち]にあるガアシ山[やま]の北[きた]、ティムナト・セラに葬[ほうむ]った。そこでは、彼を葬った墓[はか]に、彼とともに石[いし]の刀[かたな]を置[お]いた。それは、彼がエジプトから導[みちび]き出[だ]したとき、主[しゅ]が彼[かれ]らに命[めい]じられたとおりに、ガルガルでイスラエルの子[こ]らに割礼[かつれい]を施[ほどこ]した刀である。それらは今日[きょう]までそこにある。"
  32: "イスラエルの子[こ]らは、エジプトから携[たずさ]えて来[き]たヨセフの骨[ほね]を、シェケムに葬[ほうむ]った。それは、ヤコブがシェケムに住[す]むアモリ人[じん]から百匹[ひゃっぴき]の子羊[こひつじ]で買[か]い取[と]った畑[はたけ]の一部[いちぶ]で、ヨセフに分[わ]け与[あた]えられたものである。"
  33: "これらのことの後[のち]、アロンの子[こ]である大祭司[だいさいし]エレアザルは死[し]に、エフライムの山地[さんち]で彼に与[あた]えられた、その子ピネハスのギベアに葬[ほうむ]られた。その日[ひ]、イスラエルの子らは神[かみ]の契約[けいやく]の箱[はこ]を取[と]って、自分[じぶん]たちとともに運[はこ]び回[まわ]った。ピネハスは父[ちち]エレアザルの代[か]わりに祭司[さいし]として仕[つか]えた。彼が死んで自分のギベアに葬られるまで、そうであった。"
  34: "イスラエルの子[こ]らは、それぞれ自分[じぶん]の場所[ばしょ]、自分の町[まち]へ去[さ]った。そしてイスラエルの子らは、アシュタルテとアスタロト、および自分たちの周[まわ]りにある諸国[しょこく]の民[たみ]の神々[かみがみ]に仕[つか]えた。主[しゅ]は彼らをモアブの王[おう]エグロンの手[て]に渡[わた]し、エグロンは彼らを十八年[じゅうはちねん]の間[あいだ]支配[しはい]した。"

notes:
  1: "συνήγαγεν … εἰς Σηλω — собрал в Силом (Σηλω); в csl и ru «в Сихем» — характерное расхождение LXX и масоретского текста (ср. 24:25). συνεκάλεσεν — созвал. πρεσβύτεροι — старейшины. γραμματεῖς — писцы (書記), δικασταί — судьи (裁き人). В csl добавлено «князи их» (ἄρχοντες), в gr этого стиха их нет. ἔστησεν ἀπέναντι τοῦ θεοῦ — поставил пред Богом."
  2: "Τάδε λέγει κύριος — «так говорит Господь» (формула пророческой речи). Πέραν τοῦ ποταμοῦ — за рекою (Евфрат). τὸ ἀπ᾽ ἀρχῆς — издревле. Θαρα — Фарра (テラ), отец Авраама и Нахора. ἐλάτρευσαν θεοῖς ἑτέροις — служили иным богам. С 2b по 13 — слова Господа, переданные Иисусом: 『…』."
  3: "ἔλαβον … ἐκ τοῦ πέραν — взял из-за реки. ὡδήγησα ἐν πάσῃ τῇ γῇ — водил по всей земле (в csl «Ханаанстей» — добавление). ἐπλήθυνα τὸ σπέρμα — умножил семя. ἔδωκα αὐτῷ τὸν Ισαακ — дал ему Исаака."
  4: "τῷ Ισαακ τὸν Ιακωβ καὶ τὸν Ησαυ — Исааку Иакова и Исава (двойной винительный). τὸ ὄρος τὸ Σηιρ — гора Сеир. κληρονομῆσαι αὐτῷ — в наследие ему. κατέβησαν εἰς Αἴγυπτον — сошли в Египет. ἐγένοντο … εἰς ἔθνος μέγα — стали народом великим. В csl в конце добавлено «и озлобиша их египтяне» — в gr это начало ст. 5."
  5: "ἐκάκωσαν αὐτοὺς οἱ Αἰγύπτιοι — египтяне озлобили их (в csl — конец ст. 4). ἐπάταξεν κύριος τὴν Αἴγυπτον ἐν οἷς ἐποίησεν αὐτοῖς — поразил Господь Египет тем, что сделал им (слав. «во знамениих, яже сотворих в них»). В csl добавлено «послах Моисеа и аарона» — в gr нет. ἐξήγαγεν ὑμᾶς — вывел вас; стих переходит в 6."
  6: "εἰσήλθατε εἰς τὴν θάλασσαν τὴν ἐρυθράν — вошли в Чермное море (紅海). κατεδίωξαν … ἐν ἅρμασιν καὶ ἐν ἵπποις — погнались на колесницах и конях. ὀπίσω τῶν πατέρων ὑμῶν — вслед отцов ваших."
  7: "ἀνεβοήσαμεν — возопили мы (1 л. мн., как в слав.). νεφέλη καὶ γνόφος — облако и мрак. ἀνὰ μέσον ἡμῶν — между нами (смешение 1 и 2 л.). ἐπήγαγεν ἐπ᾽ αὐτοὺς τὴν θάλασσαν — навёл на них море. εἴδοσαν οἱ ὀφθαλμοὶ ὑμῶν — видели глаза ваши (2 л.). ἦτε ἐν τῇ ἐρήμῳ ἡμέρας πλείους — были в пустыне дни многие."
  8: "ἤγαγεν ὑμᾶς εἰς γῆν Αμορραίων — привёл вас в землю Аморреев. παρετάξαντο ὑμῖν — ополчились против вас. παρέδωκεν … εἰς τὰς χεῖρας ὑμῶν — предал в руки ваши. ἐξωλεθρεύσατε — вы истребили (2 л. мн.; в ru «Я истребил» — по масоретскому тексту)."
  9: "ἀνέστη Βαλακ ὁ τοῦ Σεπφωρ — восстал Валак, сын Сепфора (в евр. «сын Беора»; バラク, セポル). παρετάξατο τῷ Ισραηλ — ополчился против Израиля. ἀποστείλας ἐκάλεσεν τὸν Βαλααμ — послав, призвал Валаама (バラム). ἀράσασθαι ὑμῖν — проклясть вас."
  10: "οὐκ ἠθέλησεν … ἀπολέσαι σε — не захотел погубить тебя (ед. ч., далее мн.). εὐλογίαν εὐλόγησεν ὑμᾶς — благословением благословил вас (гебраистический оборот). ἐξείλατο — избавил (ἐξαιρέω). παρέδωκεν αὐτούς — предал их."
  11: "διέβητε τὸν Ιορδάνην — перешли Иордан. ἐπολέμησαν πρὸς ὑμᾶς — воевали против вас. οἱ κατοικοῦντες Ιεριχω — жители Иерихона. Перечень: Αμορραῖος, Χαναναῖος, Φερεζαῖος, Ευαῖος, Ιεβουσαῖος, Χετταῖος, Γεργεσαῖος — アモリ, カナン, ペリジ, ヒビ, エブス, ヘテ, ゲルガシ (порядок gr)."
  12: "ἐξαπέστειλεν … τὴν σφηκιάν — послал осиный рой, шершней (σφηκιά; слав. «шершни»). ἐξέβαλεν — изгнал. δώδεκα βασιλεῖς τῶν Αμορραίων — двенадцать царей Аморрейских (в csl и ru «два» — по масоретскому). οὐκ ἐν τῇ ῥομφαίᾳ σου οὐδὲ ἐν τῷ τόξῳ σου — не мечом твоим и не луком твоим."
  13: "γῆν, ἐφ᾽ ἣν οὐκ ἐκοπιάσατε — землю, над которой вы не трудились. πόλεις, ἃς οὐκ ᾠκοδομήσατε — города, которых не строили. κατῳκίσθητε — поселились. ἀμπελῶνας καὶ ἐλαιῶνας — виноградники и масличные сады. ἔδεσθε — едите. Конец слов Господа: 『…』 закрывается, вместе с ним — речь Иисуса 「…」."
  14: "φοβήθητε — убойтесь (императив). ἐν εὐθύτητι καὶ ἐν δικαιοσύνῃ — в прямоте и правде. περιέλεσθε — отнимите, отвергните (περιαιρέω). θεοὺς ἀλλοτρίους — чужих богов. ἐν τῷ πέραν τοῦ ποταμοῦ καὶ ἐν Αἰγύπτῳ — за рекою и в Египте. λατρεύετε κυρίῳ — служите Господу."
  15: "εἰ δὲ μὴ ἀρέσκει ὑμῖν — если не угодно вам. ἕλεσθε … τίνι λατρεύσητε — изберите, кому служить. ἐγὼ δὲ καὶ ἡ οἰκία μου — я же и дом мой. λατρεύσομεν κυρίῳ — будем служить Господу. ὅτι ἅγιός ἐστιν — ибо Он свят (в ru опущено)."
  16: "ἀποκριθεὶς ὁ λαὸς εἶπεν — отвечал народ и сказал. Μὴ γένοιτο — да не будет. καταλιπεῖν κύριον — оставить Господа. ὥστε λατρεύειν — чтобы служить. Ответ народа — 「…」 до конца ст. 18."
  17: "κύριος ὁ θεὸς ἡμῶν, αὐτὸς θεός ἐστιν — Господь Бог наш, Он есть Бог. ἀνήγαγεν — вывел (ἀνάγω). διεφύλαξεν — сохранил. ἐν πάσῃ τῇ ὁδῷ — на всём пути. В csl добавлено «от дому работы… знамения велия» — в gr нет."
  18: "ἐξέβαλεν κύριος τὸν Αμορραῖον καὶ πάντα τὰ ἔθνη — изгнал Господь Аморрея и все народы (в csl порядок «вся языки и аморреа»). ἀλλὰ καὶ ἡμεῖς λατρεύσομεν — но и мы будем служить. οὗτος γὰρ θεὸς ἡμῶν ἐστιν — ибо Он Бог наш."
  19: "Οὐ μὴ δύνησθε — не сможете (усиленное отрицание). θεὸς ἅγιός ἐστιν — Бог свят. ζηλώσας — ревнитель (ζηλόω). οὐκ ἀνήσει — не оставит без внимания, не потерпит. ἁμαρτήματα καὶ ἀνομήματα — грехи и беззакония."
  20: "ἡνίκα ἐὰν ἐγκαταλίπητε — когда оставите. ἐπελθὼν κακώσει — придя, озлобит. ἐξαναλώσει — истребит (ἐξαναλίσκω). ἀνθ᾽ ὧν εὖ ἐποίησεν ὑμᾶς — вместо того что благотворил вам, т. е. в воздаяние за благодеяния."
  21: "Οὐχί — нет. κυρίῳ λατρεύσομεν — Господу будем служить."
  22: "Μάρτυρες ὑμεῖς καθ᾽ ὑμῶν — свидетели вы против самих себя. ἐξελἐξασθε — избрали. В csl добавлено «И рекоша: свидетели мы» (ответ народа) — в gr отсутствует."
  23: "περιέλεσθε τοὺς θεοὺς τοὺς ἀλλοτρίους — отвергните чужих богов. εὐθύνατε τὴν καρδίαν — направьте, исправьте сердце. πρὸς κύριον θεὸν Ισραηλ — к Господу Богу Израилеву."
  24: "Κυρίῳ λατρεύσομεν — Господу будем служить. τῆς φωνῆς αὐτοῦ ἀκουσόμεθα — гласа Его послушаем (генитив при ἀκούω). В csl «Господеви Богу нашему» — добавление."
  25: "διέθετο … διαθήκην — поставил завет (διατίθημι). ἔδωκεν αὐτῷ νόμον καὶ κρίσιν — дал ему закон и суд. ἐν Σηλω — в Силоме (ср. 24:1; в csl и ru «в Сихеме»). ἐνώπιον τῆς σκηνῆς τοῦ θεοῦ Ισραηλ — пред скиниею Бога Израилева."
  26: "ἔγραψεν … εἰς βιβλίον, νόμον τοῦ θεοῦ — написал в книгу, закон Божий. λίθον μέγαν — большой камень. ὑπὸ τὴν τερέμινθον — под теревинфом (テレビンの木). ἀπέναντι κυρίου — пред Господом."
  27: "Ἰδοὺ ὁ λίθος οὗτος — вот камень сей. εἰς μαρτύριον — во свидетельство. ἀκήκοεν πάντα τὰ λεχθέντα αὐτῷ ὑπὸ κυρίου — слышал всё, сказанное ему (камню) Господом. ὅ τι ἐλάλησεν πρὸς ἡμᾶς σήμερον — что Он изрёк нам сегодня. ἐπ᾽ ἐσχάτων τῶν ἡμερῶν — в последние дни. ψεύσησθε — солжёте. κυρίῳ τῷ θεῷ μου — Господу Богу моему (в csl «вашему»)."
  28: "ἀπέστειλεν τὸν λαόν — отпустил народ. ἕκαστος εἰς τὸν τόπον αὐτοῦ — каждый в своё место."
  29: "ἐλάτρευσεν Ισραηλ τῷ κυρίῳ — служил Израиль Господу. πάσας τὰς ἡμέρας Ἰησοῦ — во все дни Иисуса. ὅσοι ἐφείλκυσαν τὸν χρόνον μετὰ Ἰησοῦ — которые продлили время с Иисусом, т. е. пережили его (в ru «жизнь продлилась после Иисуса»). ἔργα κυρίου — дела Господни."
  30: "ἀπέθανεν Ἰησοῦς υἱὸς Ναυη δοῦλος κυρίου — умер Иисус, сын Навин, раб Господень. ἑκατὸν δέκα ἐτῶν — ста десяти лет (родительный возраста)."
  31: "ἔθαψαν αὐτὸν πρὸς τοῖς ὁρίοις τοῦ κλήρου αὐτοῦ — погребли его при пределах удела его. Θαμναθασαχαρα — Фамнаф-Сараи (евр. Тимнат-Серах; ティムナト・セラ). ὄρος Γαας — гора Гаас. 31a (в gr внутри того же стиха): ἐκεῖ ἔθηκαν … τὰς μαχαίρας τὰς πετρίνας — там положили с ним каменные ножи. ἐν αἷς περιέτεμεν — которыми обрезал. ἐν Γαλγαλοις — в Галгалах. καθὰ συνέταξεν — как заповедал. ἕως τῆς σήμερον ἡμέρας — до сего дня."
  32: "τὰ ὀστᾶ Ιωσηφ ἀνήγαγον — кости Иосифа вынесли. κατώρυξαν — погребли. ἐν Σικιμοις — в Сихеме (здесь Σικιμοις, в отличие от Σηλω в 24:1 и 25). ἐν τῇ μερίδι τοῦ ἀγροῦ — в части поля. ἐκτήσατο … παρὰ τῶν Αμορραίων — приобрёл у Аморреев. ἀμνάδων ἑκατὸν — за сто агниц (в евр. «за сто кесит»; слав. «стом агниц»). ἔδωκεν αὐτὴν Ιωσηφ ἐν μερίδι — дал её Иосифу в часть."
  33: "Ελεαζαρ … ὁ ἀρχιερεύς — Елеазар, первосвященник. ἐτελεύτησεν — скончался. ἐτάφη ἐν Γαβααθ Φινεες — погребён в Гаваафе Финееса (ギベア). ἣν ἔδωκεν αὐτῷ — которую дал ему. 33a (в gr внутри ст. 33; в csl — ст. 34): λαβόντες τὴν κιβωτὸν τοῦ θεοῦ περιεφέροσαν — взяв ковчег Божий, носили с собою. ἱεράτευσεν ἀντὶ Ελεαζαρ — священствовал вместо Елеазара. ἕως ἀπέθανεν — доколе не умер."
  34: "ἀπήλθοσαν ἕκαστος εἰς τὸν τόπον αὐτῶν — разошлись каждый в своё место (в csl — ст. 35). ἐσέβοντο — чтили, служили (σέβομαι). τὴν Ἀστάρτην καὶ Ασταρωθ — Астарту и Астароф (アシュタルテ, アスタロト). θεοὺς τῶν ἐθνῶν τῶν κύκλῳ — богов окрестных народов. παρέδωκεν … εἰς χεῖρας Εγλωμ — предал в руки Еглона (モアブの王). ἐκυρίευσεν ἔτη δέκα ὀκτὼ — владел восемнадцать лет (в csl — ст. 36)."
