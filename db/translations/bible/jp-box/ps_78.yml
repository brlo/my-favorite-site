verses:
  1: "アサフの詩[うた]。神[かみ]よ、諸国[しょこく]の民[たみ]があなたの嗣業[しぎょう]に入[はい]り、あなたの聖[せい]なる神殿[しんでん]を汚[けが]した。"
  2: "エルサレムを果樹園[かじゅえん]の見張[みは]り小屋[ごや]とした。あなたの僕[しもべ]たちの屍[しかばね]を空[そら]の鳥[とり]の餌[えさ]とし、あなたの聖[せい]なる者[もの]たちの肉[にく]を地[ち]の獣[けもの]に与[あた]えた。"
  3: "彼[かれ]らの血[ち]を水[みず]のようにエルサレムの周[まわ]りに流[なが]し、葬[ほうむ]る者[もの]はだれもいなかった。"
  4: "わたしたちは隣[となり]の人[ひと]々[びと]の恥[はじ]となり、周[まわ]りにいる者[もの]たちの侮[あなど]りと嘲[あざけ]りとなった。"
  5: "主[しゅ]よ、いつまで怒[いか]り続[つづ]けられるのか。あなたのねたみは火[ひ]のように燃[も]え上[あ]がるのか。"
  6: "あなたの怒[いか]りを、あなたを知[し]らない諸国[しょこく]の民[たみ]に、あなたの名[な]を呼[よ]ばない国[くに]々[ぐに]に注[そそ]いでください。"
  7: "彼[かれ]らはヤコブを食[く]い尽[つ]くし、その住[す]まいを荒[あ]れ果[は]てさせたからである。"
  8: "わたしたちの先祖[せんぞ]の罪[つみ]を、わたしたちのために思[おも]い出[だ]さないでください。あなたのあわれみが速[すみ]やかにわたしたちを迎[むか]えますように。わたしたちはひどく貧[まず]しくなったからです。"
  9: "わたしたちの救[すく]いである神[かみ]よ、わたしたちを助[たす]けてください。主[しゅ]よ、あなたの名[な]の栄光[えいこう]のためにわたしたちを救[すく]い出[だ]し、あなたの名[な]のためにわたしたちの罪[つみ]を赦[ゆる]してください。"
  10: "「彼[かれ]らの神[かみ]はどこにいるのか」と、諸国[しょこく]の民[たみ]が言[い]うことのないように。あなたの僕[しもべ]たちの流[なが]された血[ち]の報[むく]いを、わたしたちの目[め]の前[まえ]で、諸国[しょこく]の民[たみ]の間[あいだ]に知[し]らせてください。"
  11: "囚[とら]われの者[もの]たちのうめきがあなたの前[まえ]に届[とど]きますように。あなたの腕[うで]の大[おお]きさによって、死[し]に定[さだ]められた者[もの]たちの子[こ]らを守[まも]ってください。"
  12: "主[しゅ]よ、わたしたちの隣[となり]の人[ひと]々[びと]があなたをそしったそのそしりを、七倍[ななばい]にして彼[かれ]らのふところに返[かえ]してください。"
  13: "しかし、わたしたちはあなたの民[たみ]、あなたの牧[まき]場[ば]の羊[ひつじ]。わたしたちはとこしえにあなたをたたえ、代[よ]々[よ]にあなたの賛美[さんび]を告[つ]げ知[し]らせる。"

notes:
  1: "Надписание (прежний ст. 0, влит в этот стих): Ψαλμὸς τῷ Ασαφ — アサフの詩 (Ασαφ — Асаф, начальник певцов при Давиде). Надписание влито в ст. 1, как в ru-базе и у jp-joc; скобками не маркируется. Стих: Ὁ θεός, ἤλθοσαν ἔθνη εἰς τὴν κληρονομίαν σου — 神よ、諸国の民があなたの嗣業に入り (ἔθνη — 諸国の民, как в Пс 2:1; κληρονομία — 嗣業). ἐμίαναν τὸν ναόν — 神殿を汚し (μιαίνω — «осквернять»). Часть стиха по делению слав. — в ст. 2."
  2: "Перенесено из ст. 1 (по делению слав.): ἔθεντο Ιερουσαλημ εἰς ὀπωροφυλάκιον — エルサレムを果樹園の見張り小屋とした (ὀπωροφυλάκιον — «сторожка для плодов»; слав. «яко овощное хранилище»; Синодальный сглаживает «в развалины» — образ сохранён). ἔθεντο τὰ θνησιμαῖα τῶν δούλων σου βρῶματα τοῖς πετεινοῖς τοῦ οὐρανοῦ — 僕たちの屍を空の鳥の餌とし (θνησιμαῖον — «мертвечина, труп»; βρῶμα — «пища»). τὰς σάρκας τῶν ὁσίων σου τοῖς θηρίοις τῆς γῆς — 聖なる者たちの肉を地の獣に与えた (ὅσιος — 聖なる者, как в Пс 49:5)."
  3: "ἐξέχεαν τὸ αἷμα αὐτῶν ὡς ὕδωρ κύκλῳ Ιερουσαλημ — 血を水のようにエルサレムの周りに流し (ἐκχέω — «выливать»). καὶ οὐκ ἦν ὁ θάπτων — 葬る者はだれもいなかった (θάπτω — «погребать»)."
  4: "ἐγενήθημεν ὄνειδος τοῖς γείτοσιν ἡμῶν — 隣の人々の恥となり (ὄνειδος — «поношение, позор»). μυκτηρισμὸς καὶ χλευασμὸς τοῖς κύκλῳ ἡμῶν — 周りにいる者たちの侮りと嘲り (μυκτηρισμός — «поругание»; χλευασμός — «насмешка»)."
  5: "ἕως πότε, κύριε, ὀργισθήσῃ εἰς τέλος — 主よ、いつまで怒り続けられるのか (εἰς τέλος — «до конца»). ἐκκαυθήσεται ὡς πῦρ ὁ ζῆλός σου — あなたのねたみは火のように燃え上がるのか (ζῆλος — «ревность, ревнивая любовь»; ねたみ хираганой, как в Пс 72:3)."
  6: "ἔκχεον τὴν ὀργήν σου ἐπὶ ἔθνη τὰ μὴ γινώσκοντά σε — 怒りを、あなたを知らない諸国の民に注いでください. ἐπὶ βασιλείας, αἳ τὸ ὄνομά σου οὐκ ἐπεκαλέσαντο — あなたの名を呼ばない国々に (ἐπικαλέομαι — «призывать имя»; βασιλεία — 国)."
  7: "ὅτι κατέφαγον τὸν Ιακωβ — 彼らはヤコブを食い尽くし (κατεσθίω — «пожирать»). τὸν τόπον αὐτοῦ ἠρήμωσαν — その住まいを荒れ果てさせた (ἐρημόω — «опустошать»)."
  8: "μὴ μνησθῇς ἡμῶν ἀνομιῶν ἀρχαίων — 先祖の罪を、わたしたちのために思い出さないでください (μνησθῇς + род. — «не вспомни нам»). ταχὺ προκαταλαβέτωσαν ἡμᾶς οἱ οἰκτιρμοί σου — あなたのあわれみが速やかにわたしたちを迎えますように (προκαταλαμβάνω — «предварять, встречать»; οἰκτιρμός — «щедроты»). ὅτι ἐπτωχεύσαμεν σφόδρα — わたしたちはひどく貧しくなった (πτωχεύω — «обнищать»)."
  9: "βοήθησον ἡμῖν, ὁ θεὸς ὁ σωτὴρ ἡμῶν — わたしたちの救いである神よ、助けてください. ἕνεκα τῆς δόξης τοῦ ὀνόματός σου — あなたの名の栄光のために. ῥῦσαι ἡμᾶς καὶ ἱλάσθητι ταῖς ἁμαρτίαις ἡμῶν ἕνεκα τοῦ ὀνόματός σου — あなたの名のために、わたしたちを救い出し、罪を赦してください (ῥύομαι — «избавлять»; ἱλάσκομαι — «умилостивлять, прощать»; повтор «ради имени» сохранён)."
  10: "μήποτε εἴπωσιν τὰ ἔθνη· Ποῦ ἐστιν ὁ θεὸς αὐτῶν; — 「彼らの神はどこにいるのか」と諸国の民が言うことのないように (слова язычников — 「」, первый уровень). γνωσθήτω ἐν τοῖς ἔθνεσιν... ἡ ἐκδίκησις τοῦ αἵματος τῶν δούλων σου τοῦ ἐκκεχυμένου — 僕たちの流された血の報いが、諸国の民の間に知られるように (ἐκδίκησις — «отмщение»; ἐκκέχυμαι — «пролита»)."
  11: "εἰσελθάτω ἐνώπιόν σου ὁ στεναγμὸς τῶν πεπεδημένων — 囚われの者たちのうめきがあなたの前に届きますように (στεναγμός — «стон»; πεπεδημένος — «закованный»). κατὰ τὴν μεγαλωσύνην τοῦ βραχίονός σου — あなたの腕の大きさによって (μεγαλωσύνη — «величие»). περιποίησαι τοὺς υἱοὺς τῶν τεθανατωμένων — 死に定められた者たちの子らを守ってください (περιποιέομαι — «сохранять, сберегать»; τεθανατωμένος — «умерщвлённый»)."
  12: "ἀπόδος τοῖς γείτοσιν ἡμῶν ἑπταπλασίονα εἰς τὸν κόλπον αὐτῶν — 隣の人々に七倍にして彼らのふところに返してください (ἀποδίδωμι — «воздавать»; ἑπταπλασίων — «семеричный»). τὸν ὀνειδισμὸν αὐτῶν, ὃν ὠνείδισάν σε, κύριε — 彼らがあなたをそしったそのそしりを、主よ (ὀνειδίζω — «поносить»)."
  13: "ἡμεῖς δὲ λαός σου καὶ πρόβατα τῆς νομῆς σου — わたしたちはあなたの民、あなたの牧場の羊. ἀνθομολογησόμεθά σοι εἰς τὸν αἰῶνα — とこしえにあなたをたたえ (ἀνθομολογέομαι — «исповедовать, воздавать хвалу»). εἰς γενεὰν καὶ γενεὰν ἐξαγγελοῦμεν τὴν αἴνεσίν σου — 代々にあなたの賛美を告げ知らせる (ἐξαγγέλλω — «возвещать»)."
