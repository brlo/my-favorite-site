verses:
  1: "医者[いしゃ]を、その必要[ひつよう]に応[おう]じて敬[うやま]い、その働[はたら]きにふさわしい敬意[けいい]を払[はら]え。医者をも主[しゅ]が造[つく]られたからである。"
  2: "癒[いや]しは、いと高[たか]き者[もの]から来[く]る。医者は王[おう]から贈[おく]り物[もの]を受[う]け取[と]る。"
  3: "医者[いしゃ]の知識[ちしき]はその頭[あたま]を上[あ]げ、大[おお]いなる者[もの]たちの前[まえ]で驚[おどろ]きをもって見[み]られる。"
  4: "主[しゅ]は地[ち]から薬[くすり]を造[つく]られた。思慮[しりょ]ある人[ひと]はそれを疎[うと]んじない。"
  5: "木[き]によって水[みず]が甘[あま]くなり、その力[ちから]が知[し]られるようになったではないか。"
  6: "主[しゅ]は人[ひと]に知識[ちしき]を与[あた]え、ご自分[じぶん]の驚[おどろ]くべきわざのうちでほめたたえられるようにされた。"
  7: "その薬[くすり]によって癒[いや]し、痛[いた]みを取[と]り除[のぞ]く。油[あぶら]を調[ととの]える者[もの]はそれらから混[ま]ぜ合[あ]わせたものを作[つく]る。"
  8: "そのわざは尽[つ]きることがなく、その方[かた]から出[で]る平和[へいわ]が地[ち]の面[おもて]にある。"
  9: "子[こ]よ、病[やまい]のときにも軽[かる]んじ見[み]てはならない。主[しゅ]に祈[いの]りなさい。そうすれば、主があなたを癒[いや]してくださる。"
  10: "過[あやま]ちから遠[とお]ざかり、手[て]を正[ただ]しくし、すべての罪[つみ]から心[こころ]を清[きよ]めよ。"
  11: "香[かおり]と小麦粉[こむぎこ]の記念[きねん]の供[そな]え物[もの]をささげ、油[あぶら]を注[そそ]いで供え物を豊[ゆたか]にせよ。もはや生[い]きていないかのように。"
  12: "医者[いしゃ]に場所[ばしょ]を与[あた]えよ。医者をも主[しゅ]が造[つく]られたからである。その者を遠[とお]ざけてはならない。あなたには医者が必要[ひつよう]だからである。"
  13: "彼らの手[て]のうちに道[みち]が開[ひら]ける時[とき]もある。"
  14: "彼らもまた主[しゅ]に祈[いの]る。暮[く]らしを続[つづ]けるために、憩[いこ]いと癒[いや]しを与[あた]えてくださるように。"
  15: "自分[じぶん]を造[つく]った方[かた]の前[まえ]で罪[つみ]を犯[おか]す者[もの]は、医者[いしゃ]の手[て]に落[お]ちるがよい。"
  16: "子[こ]よ、死者[ししゃ]の前[まえ]で涙[なみだ]を流[なが]し、ひどく苦[くる]しんでいる者のように泣[な]き始[はじ]めよ。その者[もの]にふさわしく遺体[いたい]を整[ととの]え、その埋葬[まいそう]を軽[かる]んじ見[み]てはならない。"
  17: "泣[な]き声[ごえ]を強[つよ]くし、嘆[なげ]きを熱[あつ]くし、その者[もの]にふさわしい葬[とむら]いを一[いち]日[にち]か二[ふつ]日[か]行[おこな]え。人[ひと]の咎[とが]めを避[さ]けるためである。そして、悲[かな]しみのゆえに慰[なぐさ]めを得[え]よ。"
  18: "悲[かな]しみから死[し]が出[で]て来[く]るからである。心[こころ]の悲しみは力[ちから]を折[お]る。"
  19: "災[わざわ]いが臨[のぞ]むときにも、悲[かな]しみは残[のこ]る。貧[まず]しい者[もの]の暮[く]らしは、その心[こころ]に重[おも]くのしかかる。"
  20: "あなたの心[こころ]を悲[かな]しみに委[ゆだ]ねてはならない。終[お]わりのことを思[おも]い起[おこ]して、それを遠[とお]ざけよ。"
  21: "忘[わす]れてはならない。戻[もど]りはないからである。あなたはその者[もの]に益[えき]を与[あた]えず、かえって自分[じぶん]を苦[くる]しめることになる。"
  22: "わたしの裁[さば]きを思[おも]い起[おこ]せ。あなたの裁きも同[おな]じだからである。わたしには昨日[きのう]、あなたには今日[きょう]。"
  23: "死者[ししゃ]の憩[いこ]いのうちで、その者[もの]の記憶[きおく]を静[しず]め、その霊[れい]の出[で]て行[い]くときに、その者によって慰[なぐさ]めを得[え]よ。"
  24: "律法[りっぽう]の学者[がくしゃ]の知恵[ちえ]は、学[まな]びの暇[ひま]にある。仕事[しごと]を少[すく]なくする者[もの]は知恵を得[え]る。"
  25: "鋤[すき]を握[にぎ]り、牛[うし]を追[お]う突[つ]き棒[ぼう]を誇[ほこ]り、そのわざのうちに暮[く]らし、若[わか]い牛[うし]のことを語[かた]る者[もの]が、どうして知恵[ちえ]を得[え]るだろうか。"
  26: "彼は心[こころ]を込[こ]めて畝[うね]を引[ひ]き、寝[ね]ずに若[わか]い雌牛[めうし]の飼[か]い葉[ば]のことを考[かんが]える。"
  27: "同[おな]じように、すべての大工[だいく]や建築[けんちく]の棟梁[とうりょう]も、夜[よる]を昼[ひる]のように過[す]ごす。印[いん]を彫[ほ]る者[もの]たちは、その手[て]を変[か]えてさまざまな模様[もよう]を刻[きざ]むことに専念[せんねん]する。彼は心を込めて絵[え]に似[に]せ、寝ずにその仕事[しごと]を仕上[しあ]げる。"
  28: "同[おな]じように、金床[かなとこ]のそばに座[すわ]って鉄[てつ]のわざを学[まな]ぶ鍛冶[かじ]も。火[ひ]の蒸気[じょうき]は彼の肉[にく]を溶[と]かし、炉[ろ]の熱[ねつ]のうちで彼は戦[たたか]う。槌[つち]の音[おと]に耳[みみ]を傾[かたむ]け、目[め]は器[うつわ]の形[かたち]に注[そそ]がれる。彼は心を込めてわざを仕上げ、寝ずにそれを飾[かざ]り立[た]てる。"
  29: "同[おな]じように、自分[じぶん]のわざに座[すわ]り、足[あし]でろくろを回[まわ]す陶工[とうこう]も。彼はいつも自分[じぶん]のわざを気[き]にかけており、その仕事[しごと]はみな数[かず]が定[さだ]まっている。"
  30: "彼は腕[うで]で粘土[ねんど]を形[かたち]づくり、足[あし]もとでその力[ちから]をこめる。彼は心を込めて器[うつわ]の仕上[しあ]げをし、寝ずに窯[かま]を清[きよ]める。"
  31: "これらの者[もの]はみな、自分[じぶん]の手[て]に信[しん]を置[お]き、それぞれ自分[じぶん]のわざのうちで知恵[ちえ]を得[え]る。"
  32: "彼らなしには都[みやこ]は築[きず]かれず、人[ひと]は住[す]みつくことも、行[ゆ]き来[き]することもできない。"
  33: "しかし、民[たみ]の評議[ひょうぎ]に彼らは求[もと]められず、集会[しゅうかい]に招[まね]かれることもない。裁[さば]きの座[ざ]に座ることもなく、裁きの定[さだ]めを悟[さと]ることもない。"
  34: "彼らは教[おし]えと裁[さば]きを明[あき]らかにせず、たとえ話のうちに見[み]いだされることもない。しかし、彼らは世[よ]の造[つく]られたものを支[ささ]え、その祈[いの]りは技[わざ]のわざのうちにある。"

notes:
  1: "Τίμα ἰατρὸν πρὸς τὰς χρείας αὐτοῦ τιμαῖς αὐτοῦ — «почитай врача по потребности в нём, почестями его» (τιμάω — почитать; χρεία — нужда, потребность; τιμή — честь); слав. «почитай врача противу потреб честию его». καὶ γὰρ αὐτὸν ἔκτισεν κύριος — «ибо и его создал Господь» (κτίζω — создавать)."
  2: "παρὰ γὰρ ὑψίστου ἐστὶν ἴασις — «ибо от Всевышнего исцеление» (ἴασις — исцеление; ὕψιστος — Всевышний); слав. «от вышняго бо есть изцеление». παρὰ βασιλέως λήμψεται δόμα — «от царя примет дар» (δόμα — дар); слав. «от царя приимет дар»."
  3: "ἐπιστήμη ἰατροῦ ἀνυψώσει κεφαλὴν αὐτοῦ — «знание врача возвысит голову его» (ἐπιστήμη — знание, умение; ἀνυψόω — возвышать); слав. «художество врача вознесет главу его». ἔναντι μεγιστάνων θαυμασθήσεται — «пред вельможами вызовет удивление» (μεγιστάν — вельможа; θαυμάζω — удивляться); слав. «пред вельможами удивимь будет»."
  4: "κύριος ἔκτισεν ἐκ γῆς φάρμακα — «Господь создал из земли лекарства» (φάρμακον — лекарство, снадобье); слав. «Господь созда от земли врачевания». ἀνὴρ φρόνιμος οὐ προσοχθιεῖ αὐτοῖς — «муж разумный не погнушается ими» (φρόνιμος — разумный; προσοχθίζω — гнушаться, досадовать); слав. «муж мудрый не возгнушается ими»."
  5: "οὐκ ἀπὸ ξύλου ἐγλυκάνθη ὕδωρ — «не от дерева ли вода сделалась сладкой» (ξύλον — дерево; γλυκαίνω — делать сладким); слав. «не от древа ли осладися вода». εἰς τὸ γνωσθῆναι τὴν ἰσχὺν αὐτοῦ — «чтобы познана была сила Его» (ἰσχύς — сила); слав. «да познана будет сила его». Речь об исцелении вод в Меррах (Исх 15:23–25)."
  6: "καὶ αὐτὸς ἔδωκεν ἀνθρώποις ἐπιστήμην — «и Он дал людям знание» (ἐπιστήμη — знание); слав. «и той дал есть художество человеком». ἐνδοξάζεσθαι ἐν τοῖς θαυμασίοις αὐτοῦ — «прославляться в чудесах Его» (ἐνδοξάζομαι — прославляться; θαυμάσιον — чудо); слав. «да славится в чудесех своих»."
  7: "ἐν αὐτοῖς ἐθερράπευσεν καὶ ἦρεν τὸν πόνον αὐτοῦ — «ими он исцелил и унял боль его» (θεραπεύω — лечить; αἴρω — унимать, уносить; πόνος — боль); слав. «теми уврачева и отят болезни их». μυρεψὸς ἐν τούτοις ποιήσει μεῖγμα — «мировар из них составит смесь» (μυρεψός — приготовляющий масти; μεῖγμα — смесь); слав. «мироварец сими состроит смешение». Слав. относит эту часть к ст. 8."
  8: "καὶ οὐ μὴ συντελεσθῇ ἔργα αὐτοῦ — «и не окончатся дела Его» (συντελέω — завершать); слав. «и не скончаются дела его». εἰρήνη παρ᾿ αὐτοῦ ἐστιν ἐπὶ προσώπου τῆς γῆς — «мир от Него на лице земли» (εἰρήνη — мир; πρόσωπον τῆς γῆς — лицо земли); слав. «и мир от него есть на лицы земли»."
  9: "Τέκνον, ἐν ἀρρωστήματί σου μὴ παράβλεπε — «сын, в болезни твоей не пренебрегай» (ἀρρώστημα — болезнь; παραβλέπω — пренебрегать, не замечать); слав. «чадо, в болезни твоей не презирай». εὖξαι κυρίῳ, καὶ αὐτὸς ἰάσεταί σε — «помолись Господу, и Он исцелит тебя» (εὔχομαι — молиться; ἰάομαι — исцелять)."
  10: "ἀπόστησον πλημμέλειαν — «отстрани прегрешение» (πλημμέλεια — прегрешение, проступок); слав. «отступи от прегрешения». εὔθυνον χεῖρας — «исправь (выпрями) руки» (εὐθύνω — выпрямлять); ἀπὸ πάσης ἁμαρτίας καθάρισον καρδίαν — «от всякого греха очисти сердце» (ἁμαρτία — грех; καθαρίζω — очищать)."
  11: "δὸς εὐωδίαν καὶ μνημόσυνον σεμιδάλεως — «дай благоухание и память семидала» (εὐωδία — благоухание; μνημόσυνον — память, поминовение; σεμίδαλις — лучшая пшеничная мука); слав. «даждь благоухание и память семидала». λίπανον προσφορὰν — «тучное приношение» (λίπανος — жирный, тучный; προσφορά — приношение); ὡς μὴ ὑπάρχων — «как не существующий», т. е. как будто тебя уже нет; слав. «акибы не первее приносяй» понято иначе. Место тёмное."
  12: "καὶ ἰατρῷ δὸς τόπον — «и врачу дай место» (τόπος — место); слав. «и даждь место врачу». καὶ γὰρ αὐτὸν ἔκτισεν κύριος — «ибо и его создал Господь»; καὶ μὴ ἀποστήτω σου, καὶ γὰρ αὐτοῦ χρεία — «и да не отступит от тебя, ибо в нём нужда» (ἀφίστημι — отступать; χρεία — нужда); слав. «и да не удалится от тебе, потребен бо ти есть»."
  13: "ἔστιν καιρὸς ὅτε καὶ ἐν χερσὶν αὐτῶν εὐοδία — «есть время, когда и в руках их успех» (καιρός — время; εὐοδία — успех, благополучие); слав. «есть время, егда в руку его благоухание»: εὐοδία понято как εὐωδία, «благоухание»."
  14: "καὶ γὰρ αὐτοὶ κυρίου δεηθήσονται — «ибо и они помолятся Господу» (δέομαι — молить); слав. «ибо и тии Господеви молятся». ἵνα εὐοδώσῃ αὐτοῖς ἀνάπαυσιν καὶ ἴασιν — «чтобы Он дал им покой и исцеление» (ἀνάπαυσις — покой; ἴασις — исцеление); χάριν ἐμβιώσεως — «ради продолжения жизни» (ἐμβίωσις — проживание); слав. «ради оздравления»."
  15: "ὁ ἁμαρτάνων ἔναντι τοῦ ποιήσαντος αὐτὸν ἐμπέσοι εἰς χεῖρας ἰατροῦ — «согрешающий пред Сотворившим его да впадёт в руки врача» (ἁμαρτάνω — грешить; ἐμπίπτω — впадать); слав. «согрешаяй пред сотворшим его впадет в руце врачу». Увещание не откладывать лечение."
  16: "Τέκνον, ἐπὶ νεκρῷ κατάγαγε δάκρυα — «сын, над мёртвым пролей слёзы» (νεκρός — мёртвый; κατάγω — низводить, проливать); слав. «чадо, над мертвецем источи слезы». ὡς δεινὰ πάσχων ἔναρξαι θρήνου — «как тяжко страдающий, начни плач» (δεινά — тяжкое; θρῆνος — плач, причитание); слав. «якоже зле страждущь начни плачь». κατὰ τὴν κρίσιν αὐτοῦ περίστειλον τὸ σῶμα αὐτοῦ — «по суду (должному) его обряди тело его» (κρίσις — суд, должное; περιστέλλω — обряжать); слав. «якоже достоит ему, соскутай тело его»."
  17: "πίκρανον κλαυθμὸν καὶ θέρμανον κοπετόν — «сделай плач горьким и рыдание тёплым» (πικραίνω — делать горьким; κλαυθμός — плач; θερμαίνω — согревать; κοπετός — рыдание); слав. «горек сотвори плачь и рыдание тепло». ποίησον τὸ πένθος κατὰ τὴν ἀξίαν αὐτοῦ — «соверши сетование по достоинству его» (πένθος — сетование, траур; ἀξία — достоинство); ἡμέραν μίαν καὶ δύο — «день один и два»; χάριν διαβολῆς — «ради нарекания (злословия)» (διαβολή — клевета); слав. «хуления ради». καὶ παρακλήθητι λύπης ἕνεκα — «и утешься ради печали» (παρακαλέω — утешать)."
  18: "ἀπὸ λύπης γὰρ ἐκβαίνει θάνατος — «ибо от печали исходит смерть» (λύπη — печаль; ἐκβαίνω — выходить); слав. «от печали бо смерть бывает». λύπη καρδίας κάμψει ἰσχύν — «печаль сердца согнёт силу» (κάμπτω — сгибать; ἰσχύς — сила); слав. «печаль сердечная слячет крепость»."
  19: "ἐν ἐπαγωγῇ παραμένει καὶ λύπη — «при наведении (бедствии) остаётся и печаль» (ἐπαγωγή — наведение, бедствие; παραμένω — оставаться); слав. «в нанесении пребывает и печаль». βίος πτωχοῦ κατὰ καρδίας — «жизнь бедного — по сердцу» (βίος — жизнь; πτωχός — бедный; κατὰ καρδίας — по сердцу); слав. «житие нищаго в сердцы», ru «жизнь нищего тяжела для сердца». Смысл тёмный; в тексте — «心に重くのしかかる»."
  20: "μὴ δῷς εἰς λύπην τὴν καρδίαν σου — «не давай сердцу твоему [уйти] в печаль» (δίδωμι — давать); слав. «не даждь в печаль сердца твоего». ἀπόστησον αὐτὴν μνησθεὶς τὰ ἔσχατα — «отстрани её, вспомнив последнее» (ἀφίστημι — отстранять; ἔσχατος — последний); слав. «остави ю помянув последняя»."
  21: "μὴ ἐπιλάθῃ, οὐ γάρ ἐστιν ἐπάνοδος — «не забудь, ибо нет возврата» (ἐπιλανθάνομαι — забывать; ἐπάνοδος — возвращение); слав. «не забуди, несть бо возвращения». τοῦτον οὐκ ὠφελήσεις καὶ σεαυτὸν κακώσεις — «тому не поможешь и себя озлобишь» (ὠφελέω — помогать; κακόω — вредить); слав. «ему пользы не сотвориши, и себе озлобиши»."
  22: "μνήσθητι τὸ κρίμα μου — «помни суд (участь) мой» (κρίμα — суд, приговор, участь); слав. «помяни суд его» (слав. читает «его»). ὅτι οὕτως καὶ τὸ σόν — «ибо так и твой»; ἐμοὶ ἐχθὲς καὶ σοὶ σήμερον — «мне вчера, а тебе сегодня»; слав. «мне вчера, а тебе днесь»."
  23: "ἐν ἀναπαύσει νεκροῦ κατάπαυσον τὸ μνημόσυνον αὐτοῦ — «в покое мёртвого упокой память его» (ἀνάπαυσις — покой; καταπαύω — успокаивать; μνημόσυνον — память); слав. «в покои мертвеца упокой память его». παρακλήθητι ἐν αὐτῷ ἐν ἐξόδῳ πνεύματος αὐτοῦ — «утешься о нём при исходе духа его» (ἔξοδος — исход; πνεῦμα — дух); слав. «утешися о нем во исходе духа его»."
  24: "Σοφία γραμματέως ἐν εὐκαιρίᾳ σχολῆς — «мудрость книжника — в досуге школы (учения)» (γραμματεύς — книжник, писец; εὐκαιρία — удобное время, досуг; σχολή — досуг, школа); слав. «премудрость книжника во благовремении празднества». ὁ ἐλασσοούμενος πράξει αὐτοῦ σοφισθήσεται — «умаляющий дела свои умудрится» (ἐλασσόω — уменьшать; πρᾶξις — дело); слав. «умаляяйся деянием своим упремудрится»."
  25: "τί σοφισθήσεται ὁ κρατῶν ἀρότρου — «как умудрится держащий плуг» (σοφίζω — делать мудрым; ἄροτρον — плуг; κρατέω — держать); слав. «чим умудрится держай орало». καὶ καυχώμενος ἐν δόρατι κέντρου — «и хвалящийся древком стрекала» (δόρυ — копьё, древко; κέντρον — стрекало, жало, палка-погонялка); слав. «хваляйся остном». βόας ἐλαύνων — «гоняющий волов» (βοῦς — вол; ἐλαύνω — гнать); καὶ ἀναστρεφόμενος ἐν ἔργοις αὐτῶν — «и обращающийся в делах их»; ἡ διήγησις αὐτοῦ ἐν υἱοῖς ταύρων — «повествование его — среди сынов быков» (διήγησις — рассказ; ταῦρος — бык)."
  26: "καρδίαν αὐτοῦ δώσει ἐκδοῦναι αὔλακας — «сердце своё отдаст тому, чтобы проводить борозды» (αὖλαξ — борозда; ἐκδίδωμι — отдавать); слав. «сердце свое даст возрыти бразды». ἡ ἀγρυπνία αὐτοῦ εἰς χορτάσματα δαμάλεων — «бдение его — на корм телиц» (ἀγρυπνία — бодрствование; χόρτασμα — корм; δάμαλις — телица); слав. «бдение его на насыщениих юниц»."
  27: "οὕτως πᾶς τέκτων καὶ ἀρχιτέκτων — «так всякий плотник и зодчий» (τέκτων — плотник, мастер; ἀρχιτέκτων — главный строитель); слав. «тако всяк древоделя и архитектон». ὅστις νύκτωρ ὡς ἡμέρας διάγει — «кто ночью как днём проводит [время]» (νύκτωρ — ночью; διάγω — проводить); οἱ γλύφοντες γλύμματα σφραγίδων — «вырезающие резьбу печатей» (γλύφω — вырезать; γλύμμα — резьба; σφραγίς — печать); ἡ ἐπιμονὴ αὐτοῦ ἀλλοιῶσαι ποικιλίαν — «постоянство его — изменять разнообразие [узора]» (ἐπιμονή — постоянство; ποικιλία — разнообразие); καρδίαν αὐτοῦ δώσει εἰς ὁμοιῶσαι ζωγραφίαν — «сердце своё отдаст уподобить изображение» (ζωγραφία — живопись); ἡ ἀγρυπνία αὐτοῦ τελέσαι ἔργον — «бдение его — завершить дело» (τελέω — завершать)."
  28: "οὕτως χαλκεὺς καθήμενος ἐγγὺς ἄκμονος — «так кузнец, сидящий близ наковальни» (χαλκεύς — кузнец; ἄκμων — наковальня); ἀτμὶς πυρὸς τήξει σάρκας αὐτοῦ — «пар огня растопит плоть его» (ἀτμίς — пар; τήκω — плавить); ἐν θέρμῃ καμίνου διαμαχήσεται — «в жаре горна будет бороться» (θέρμη — жар; κάμινος — горн, печь); φωνῇ σφύρης κλινεῖ τὸ οὖς αὐτοῦ — «звуком молота склонит ухо своё» (σφύρα — молот); κατέναντι ὁμοιώματος σκεύους οἱ ὀφθαλμοὶ αὐτοῦ — «напротив образа сосуда — глаза его» (ὁμοίωμα — подобие; σκεῦος — сосуд); κοσμῆσαι ἐπὶ συντελείας — «украсить при завершении» (κοσμέω — украшать)."
  29: "οὕτως κεραμεὺς καθήμενος ἐν ἔργῳ αὐτοῦ — «так горшечник, сидящий за делом своим» (κεραμεύς — горшечник); συστρέφων ἐν ποσὶν αὐτοῦ τροχόν — «вращающий ногами своими круг» (συστρέφω — вращать; τροχός — гончарный круг); ὃς ἐν μερίμνῃ κεῖται διὰ παντὸς ἐπὶ τὸ ἔργον αὐτοῦ — «кто в заботе лежит всегда о деле своём» (μέριμνα — забота); ἐναρίθμιος πᾶσα ἡ ἐργασία αὐτοῦ — «вся работа его — по числу» (ἐναρίθμιος — исчисляемый); слав. «изчисляемо все делание его»."
  30: "ἐν βραχίονι αὐτοῦ τυπώσει πηλόν — «мышцей (рукой) своей он придаст форму глине» (βραχίων — мышца, рука; τυπόω — придавать форму; πηλός — глина); слав. «мышцею своею вообразит брение». πρὸ ποδῶν κάμψει ἰσχὺν αὐτοῦ — «перед ногами согнёт силу свою» (κάμπτω — сгибать); καρδίαν ἐπιδώσει συντελέσαι τὸ χρῖσμα — «сердце отдаст на завершение натирания (глазури)» (χρῖσμα — натирание, помазание); слав. «сердце свое вдаст скончати сосуд». ἡ ἀγρυπνία αὐτοῦ καθαρίσαι κάμινον — «бдение его — очистить печь» (καθαρίζω — очищать; κάμινος — печь)."
  31: "Πάντες οὗτοι εἰς χεῖρας αὐτῶν ἐνεπίστευσαν — «все они на руки свои положились» (ἐμπιστεύω — вверять, полагаться); слав. «вси сии на руки своя надеются». ἕκαστος ἐν τῷ ἔργῳ αὐτοῦ σοφίζεται — «каждый в деле своём умудряется»; слав. «кийждо в деле своем умудряется»."
  32: "ἄνευ αὐτῶν οὐκ οἰκισθήσεται πόλις — «без них не заселится город» (οἰκίζω — заселять, строить); слав. «без тех не населится град». οὐ παροικήσουσιν οὐδὲ περιπατήσουσιν — «не будут жить [в нём] и не будут ходить» (παροικέω — обитать; περιπατέω — ходить); слав. «не вселятся, ни походят»."
  33: "ἀλλ᾿ εἰς βουλὴν λαοῦ οὐ ζητηθήσονται — «но в совет народа не будут призваны» (βουλή — совет; ζητέω — искать, призывать); слав. «в соборище не возмутся». ἐν ἐκκλησίᾳ οὐχ ὑπεραλοῦνται — «в собрании не возвысятся» (ἐκκλησία — собрание; ὑπεράλλομαι — перескакивать, возвышаться); в тексте — слав. «не будут взяты (приглашены)», вариант LXX — здесь. ἐπὶ δίφρον δικαστοῦ οὐ καθιοῦνται — «на седалище судьи не сядут» (δίφρος — седалище; δικαστής — судья); διαθήκην κρίματος οὐ διανοηθήσονται — «установление суда не уразумеют» (διαθήκη — завет, установление; διανοέομαι — разуметь); слав. «завета суду не размыслят»."
  34: "οὐδὲ μὴ ἐκφάνωσιν παιδείαν καὶ κρίμα — «и не проявят учения и суда» (ἐκφαίνω — проявлять; παιδεία — учение, наставление; κρίμα — суд); слав. «ниже имут извещати наказания и суда». ἐν παραβολαῖς οὐχ εὑρεθήσονται — «в притчах не найдутся» (παραβολή — притча); ἀλλὰ κτίσμα αἰῶνος στηρίσουσιν — «но творение века утвердят» (κτίσμα — творение; αἰών — век; στηρίζω — утверждать); ἡ δέησις αὐτῶν ἐν ἐργασίᾳ τέχνης — «моление их — в делании искусства» (δέησις — моление; τέχνη — искусство, ремесло)."
