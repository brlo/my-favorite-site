verses:
  0: "指揮者[しきしゃ]に。賛美[さんび]のうちに。ダビデの教[おし]え。ジフ人[じん]が来[き]て、「ダビデはわたしたちのところに隠[かく]れていないか」とサウルに告[つ]げたときのこと。"
  1: "神[かみ]よ、あなたの名[な]によってわたしを救[すく]い、あなたの力[ちから]によってわたしを裁[さば]いてください。"
  2: "神[かみ]よ、わたしの祈[いの]りを聞[き]き、わたしの口[くち]の言葉[ことば]に耳[みみ]を傾[かたむ]けてください。"
  3: "よそ者[もの]たちがわたしに立[た]ち向[む]かい、力[ちから]ある者[もの]たちがわたしの魂[たましい]を求[もと]めた。彼[かれ]らは神[かみ]を自分[じぶん]の前[まえ]に置[お]かなかった。"
  4: "見[み]よ、神[かみ]はわたしを助[たす]けてくださる。主[しゅ]はわたしの魂[たましい]の盾[たて]である。"
  5: "神[かみ]はわたしの敵[てき]にその悪[あく]を返[かえ]される。あなたの真実[しんじつ]によって、彼[かれ]らを滅[ほろ]ぼしてください。"
  6: "わたしは自[みずか]ら進[すす]んであなたにいけにえをささげ、主[しゅ]よ、あなたの名[な]をほめたたえる。それは良[よ]いことだからである。"
  7: "あなたはすべての苦[くる]しみからわたしを救[すく]い出[だ]してくださった。わたしの目[め]は、わたしの敵[てき]を見[み]ている。"

notes:
  0: "Εἰς τὸ τέλος, ἐν ὕμνοις· συνέσεως τῷ Δαυιδ, ἐν τῷ ἐλθεῖν τοὺς Ζιφαίους καὶ εἰπεῖν τῷ Σαουλ Οὐκ ἰδοὺ Δαυιδ κέκρυπται παρ᾽ ἡμῖν; — 指揮者に。賛美のうちに。ダビデの教え。ジフ人が来て、「ダビデはわたしたちのところに隠れていないか」とサウルに告げたときのこと (ἐν ὕμνοις — «в песнех», слав. «в песнех»; 賛美のうちに, как в Пс 6:1. Ζιφαῖοι — ジフ人, жители Зифа, ср. 1 Цар 23:19; вопрос зифеев передан 「」, как и речь Доега в Пс 51. Надписание — стих 0, скобками не маркируется.)"
  1: "Ὁ θεός, ἐν τῷ ὀνόματί σου σῶσόν με — 神よ、あなたの名によってわたしを救い (σῴζω — 救う). ἐν τῇ δυνάμει σου κρῖνόν με — あなたの力によってわたしを裁いてください (κρίνω — «судить», здесь в смысле «разбери моё дело, оправдай»; добавления «оправдай» нет)."
  2: "εἰσάκουσον τῆς προσευχῆς μου — わたしの祈りを聞き (εἰσακούω + род. — «услышать»). ἐνώτισαι τὰ ῥήματα τοῦ στόματός μου — わたしの口の言葉に耳を傾けてください (ἐνωτίζομαι — «внимать», как в Пс 48:1)."
  3: "ἀλλότριοι ἐπανέστησαν ἐπ᾽ ἐμέ — よそ者たちがわたしに立ち向かい (ἀλλότριος — «чужой»; ἐπανίστημι — «восставать», как в Пс 3:1). κραταιοὶ ἐζήτησαν τὴν ψυχήν μου — 力ある者たちがわたしの魂を求めた (ζητέω τὴν ψυχήν — «искать душу», т. е. покушаться на жизнь). οὐ προέθεντο τὸν θεὸν ἐνώπιον αὐτῶν — 彼らは神を自分の前に置かなかった (προτίθημι — «полагать пред собою», ср. Пс 53:5 в слав.). διάψαλμα не передаётся."
  4: "ἰδοὺ γὰρ ὁ θεὸς βοηθεῖ μοι — 見よ、神はわたしを助けてくださる (βοηθέω — «помогать»; настоящее время). ὁ κύριος ἀντιλήμπτωρ τῆς ψυχῆς μου — 主はわたしの魂の盾である (ἀντιλήμπτωρ — «заступник»; передано 盾, как в Пс 45:7)."
  5: "ἀποστρέψει τὰ κακὰ τοῖς ἐχθροῖς μου — 神はわたしの敵にその悪を返される (ἀποστρέφω — «обращать назад»; τὰ κακά — «злое»). ἐν τῇ ἀληθείᾳ σου ἐξολόθρευσον αὐτούς — あなたの真実によって、彼らを滅ぼしてください (ἐξολοθρεύω — «истреблять», как в Пс 43:2)."
  6: "ἑκουσίως θύσω σοι — わたしは自ら進んであなたにいけにえをささげ (ἑκουσίως — «добровольно»; θύω — «приносить жертву»). ἐξομολογήσομαι τῷ ὀνόματί σου, κύριε — 主よ、あなたの名をほめたたえる (ἐξομολογέομαι — «славить»). ὅτι ἀγαθόν — それは良いことだからである (не «благ», а «благо», поэтому 良いこと)."
  7: "ὅτι ἐκ πάσης θλίψεως ἐρρύσω με — あなたはすべての苦しみからわたしを救い出してくださった (ῥύομαι — «избавлять»; аорист). ἐν τοῖς ἐχθροῖς μου ἐπεῖδεν ὁ ὀφθαλμός μου — わたしの目は、わたしの敵を見ている (ἐπεῖδεν — «воззрел, увидел»; смысл — увидел их падение, но в текст это не добавлено)."
