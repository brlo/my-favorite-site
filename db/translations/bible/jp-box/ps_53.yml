# Бог — помощник (4–5), обетование жертвы и благодарения (6–7).
# Красного и синего нет. Кавычки: слова зифеев в надписании (ст. 0) — 「…」.
# 〔…〕 нет: все слова в gr-lxx-byz есть (проверено tmp/bracket_check.rb).
# セラ (διάψαλμα, в конце ст. 3) не передаётся — по решению пользователя, как у jp-joc.
# Сносок ⟨…⟩ нет: ジフ人, 盾, 祭壇 уже в корпусе.
# jp-ni не использовался.

