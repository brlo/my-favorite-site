# jp-box, Даниил, глава 7. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 7 (совпадает, 28 стихов).
# Язык — современный 常体; 〔…〕 нет; сносок ⟨…⟩ нет.
# Имена — транслитерация греческого (LXX), формы — по корпусу (ダニエル, バルタザル).
#
# Содержание: 1–8 видение четырёх зверей из моря (львица с орлиными крыльями,
# медведица с тремя рёбрами, барс о четырёх головах, четвёртый зверь с железными
# зубами и десятью рогами, среди них малый рог с глазами и устами); 9–12 престолы,
# Ветхий днями, огненная река, суд и книги, гибель зверя; 13–14 «как бы Сын
# человеческий» на облаках небесных, вечная власть и царство; 15–28 толкование:
# четыре царства, святые Всевышнего примут царство, десять царей, хула малого рога,
# «время и времена и полувремя», суд и вечное царство святых.
# Голоса: 1–15 и 28 — рассказ Даниила от первого лица, без кавычек; 5 — приказ
# зверю в 「…」; 17–18 — речь толкователя в 「…」 (вводка «彼は答えて語り» вне кавычек);
# 19–22 — снова рассказ Даниила; 23–27 — второе слово толкователя в 「…» (вводка
# «彼は言った» вне кавычек).
# Термины: 獣[けもの] — θηρίον; 角[つの] — κέρας; 王座[おうざ] — θρόνος;
# 日の老[お]いたる者[もの] — παλαιὸς ἡμερῶν; 人[ひと]の子[こ] — υἱὸς ἀνθρώπου;
# いと高き方[かた] — ὕψιστος; 聖[せい]なる者[もの]たち — ἅγιοι; 王国[おうこく] — βασιλεία;
# 権威[けんい] — ἐξουσία; 律法[りっぽう] — νόμος. Слав. дополнения и иные чтения
# (車輪 в 7:9, порядок 7:4, «велицыи» в 7:3) внесены в основной текст и оговорены
# в notes; 〔…〕 не ставились.
#
