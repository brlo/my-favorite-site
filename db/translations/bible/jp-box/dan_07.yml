verses:
  1: "バビロン地方[ちほう]の王[おう]バルタザルが治[おさ]め始[はじ]めて第一年[だいいちねん]、ダニエルは夢[ゆめ]を見[み]、寝床[ねどこ]の上[うえ]で頭[あたま]に幻[まぼろし]を見[み]た。そこでダニエルは、その幻[まぼろし]を言葉[ことば]の見出[みだ]しごとに書[か]き記[しる]した。"
  2: "わたしダニエルは、寝床[ねどこ]の上[うえ]で、夜[よる]の夢[ゆめ]の中[なか]に見[み]ていた。見[み]よ、天[てん]の四[よっ]つの風[かぜ]が大[おお]きな海[うみ]に激[はげ]しく吹[ふ]きつけた。"
  3: "そして、四頭[しとう]の大[おお]きな獣[けもの]が海[うみ]から上[のぼ]ってきた。それぞれ互[たが]いに異[こと]なっていた。"
  4: "第一[だいいち]のものは雌[め]の獅子[しし]のようで、鷲[わし]のような翼[つばさ]を持[も]っていた。わたしが見[み]ていると、その翼[つばさ]は抜[ぬ]き取[と]られ、それは地[ち]から起[お]こされて人間[にんげん]の足[あし]で立[た]ち、人間[にんげん]の心[こころ]が与[あた]えられた。"
  5: "見[み]よ、それに続[つづ]いて、雌熊[めぐま]に似[に]た別[べつ]の獣[けもの]がいた。それは片側[かたがわ]に立[た]ち、その口[くち]の中[なか]、歯[は]の間[あいだ]に三本[さんぼん]の肋骨[ろっこつ]があった。そして、こう言[い]われた。「立[た]ち上[あ]がって、多[おお]くの肉[にく]を食[く]らえ。」"
  6: "その後[あと]、わたしが見[み]ていると、豹[ひょう]のような別[べつ]の獣[けもの]がいた。その上[うえ]には鳥[とり]の翼[つばさ]が四[よっ]つ広[ひろ]がり、その獣[けもの]には四[よっ]つの頭[あたま]があった。そして、これに権威[けんい]が与[あた]えられた。"
  7: "その後[あと]、わたしは夜[よる]の幻[まぼろし]の中[なか]に見[み]た。見[み]よ、第四[だいし]の獣[けもの]は恐[おそ]ろしく、非常[ひじょう]に強[つよ]く、大[おお]きな鉄[てつ]の歯[は]を持[も]っていた。それは食[く]らい、砕[くだ]き、残[のこ]りを足[あし]で踏[ふ]みつけた。それは先[さき]のすべての獣[けもの]と甚[はなは]だしく異[こと]なり、十本[じゅうほん]の角[つの]があった。"
  8: "わたしがその角[つの]を眺[なが]めていると、見[み]よ、その中[なか]から小[ちい]さな別[べつ]の角[つの]が一[ひと]本[ぽん]生[は]え出[で]て、最初[さいしょ]の角[つの]のうち三本[さんぼん]がその前[まえ]で抜[ぬ]き取[と]られた。見[み]よ、この角[つの]には人間[にんげん]の目[め]のような目[め]があり、大[おお]きなことを語[かた]る口[くち]があった。そして、それは聖[せい]なる者[もの]たちと戦[たたか]いをした。"
  9: "わたしが見[み]ていると、ついに王座[おうざ]が置[お]かれ、日[ひ]の老[お]いたる者[もの]が座[すわ]った。その衣[ころも]は雪[ゆき]のように白[しろ]く、頭[あたま]の髪[かみ]は清[きよ]い羊毛[ようもう]のようであった。その王座[おうざ]は炎[ほのお]のようであり、その車輪[しゃりん]は燃[も]える火[ひ]であった。"
  10: "その前[まえ]から火[ひ]の川[かわ]が流[なが]れ出[で]ていた。千[せん]の千[せん]が彼に仕[つか]え、万[まん]の万[まん]が彼の前[まえ]に立[た]っていた。裁[さば]きの座[ざ]が据[す]えられ、書物[しょもつ]が開[ひら]かれた。"
  11: "そのとき、わたしは、あの角[つの]が語[かた]る大[おお]きな言葉[ことば]の声[こえ]を聞[き]きながら、見[み]ていた。そして、その獣[けもの]は打[う]ち殺[ころ]され、その体[からだ]は滅[ほろ]びて、火[ひ]で焼[や]かれるために渡[わた]された。"
  12: "また、ほかの獣[けもの]たちからは権威[けんい]が取[と]り去[さ]られ、その命[いのち]は、時[とき]と季節[きせつ]の来[く]るまで延[の]ばされた。"
  13: "わたしは夜[よる]の幻[まぼろし]の中[なか]に見[み]た。見[み]よ、天[てん]の雲[くも]の上[うえ]を、人[ひと]の子[こ]のような者[もの]が来[く]るのが。それは日[ひ]の老[お]いたる者[もの]のもとまで進[すす]み、その前[まえ]に連[つ]れて来[こ]られた。侍[はべ]る者[もの]たちが彼のそばに立[た]っていた。"
  14: "彼には権威[けんい]と栄誉[えいよ]と王国[おうこく]が与[あた]えられた。すべての民[たみ]、部族[ぶぞく]、言語[げんご]の異[こと]なる者[もの]たちが彼に仕[つか]える。彼の権威[けんい]は永遠[えいえん]の権威[けんい]で、過[す]ぎ去[さ]ることはなく、その王国[おうこく]は滅[ほろ]びることがない。"
  15: "わたしダニエルは、これらのことで霊[れい]が震[ふる]え、頭[あたま]に受[う]けた幻[まぼろし]がわたしをかき乱[みだ]した。"
  16: "わたしは立[た]っている者[もの]の一人[ひとり]に近[ちか]づいて、これらすべてのことの正確[せいかく]な意味[いみ]を尋[たず]ねた。すると彼は答[こた]えて語[かた]り、これらの言葉[ことば]の解[と]き明[あ]かしをわたしに示[しめ]した。"
  17: "「これらの大[おお]きな獣[けもの]は四[よっ]つの王国[おうこく]である。それらは地[ち]の上[うえ]に起[お]こる。"
  18: "しかし、いと高き方[かた]の聖[せい]なる者[もの]たちが王国[おうこく]を受[う]け、その王国[おうこく]を世[よ]々[よ]にわたって、とこしえに保[たも]つ。」"
  19: "そこで、わたしは第四[だいし]の獣[けもの]について、詳[くわ]しく知[し]りたいと願[ねが]った。この獣[けもの]はすべてを滅[ほろ]ぼし、非常[ひじょう]に恐[おそ]ろしく、その歯[は]は鉄[てつ]、その爪[つめ]は青銅[せいどう]で、周[まわ]りのすべてを食[く]らい尽[つ]くし、足[あし]で踏[ふ]みつけていた。"
  20: "また、その頭[あたま]にある十本[じゅうほん]の角[つの]と、後[のち]から生[は]えて、その前[まえ]で三本[さんぼん]が抜[ぬ]け落[お]ちたもう一[いち]本[ぽん]の角[つの]について。その角[つの]には目[め]があり、大[おお]きなことを語[かた]る口[くち]があり、その姿[すがた]はほかの角[つの]よりも大[おお]きかった。"
  21: "わたしは、あの角[つの]が聖[せい]なる者[もの]たちと戦[たたか]いを起[お]こし、彼らを制圧[せいあつ]していくのを眺[なが]めていた。"
  22: "ついに、日[ひ]の老[お]いたる者[もの]が来[こ]られ、裁[さば]きはいと高き方[かた]の聖[せい]なる者[もの]たちに与[あた]えられた。そして、時[とき]が来[き]て、聖[せい]なる者[もの]たちは王国[おうこく]を手[て]に入[い]れた。"
  23: "彼は言[い]った。「第四[だいし]の獣[けもの]は、地[ち]の上[うえ]に起[お]こる第四[だいし]の王国[おうこく]である。それはすべての王国[おうこく]にまさり、全[ぜん]地[ち]を食[く]らい尽[つ]くし、これを踏[ふ]みにじり、切[き]り刻[きざ]む。"
  24: "その十本[じゅうほん]の角[つの]は、その王国[おうこく]から起[お]こる十人[じゅうにん]の王[おう]である。その後[あと]に、もう一人[ひとり]の王[おう]が起[お]こる。彼は先[さき]の者[もの]たちにもまして悪[わる]いことを行[おこな]い、三人[さんにん]の王[おう]を倒[たお]す。"
  25: "彼はいと高き方[かた]に逆[さか]らう言葉[ことば]を語[かた]り、いと高き方[かた]の聖[せい]なる者[もの]たちを苦[くる]しめる。また、時[とき]と律法[りっぽう]を変[か]えようと考[かんが]える。そして、すべては彼の手[て]に渡[わた]され、時[とき]と二[ふた]つの時[とき]と半[はん]の時[とき]の間[あいだ]、そうなる。"
  26: "しかし、裁[さば]きの座[ざ]が設[もう]けられ、彼の権威[けんい]は取[と]り去[さ]られる。それは、彼を終[つい]わりまで滅[ほろ]ぼし尽[つ]すためである。"
  27: "そして、王国[おうこく]と権威[けんい]と大[だい]いなる栄光[えいこう]、天[てん]の下[した]にあるすべての王国[おうこく]の支配[しはい]は、いと高き方[かた]の聖[せい]なる民[たみ]に与[あた]えられる。その王国[おうこく]は永遠[えいえん]の王国[おうこく]であり、すべての権威[けんい]は彼に従[したが]い、彼に聞[き]き従[したが]う。」"
  28: "話[はなし]はここで終[お]わる。わたしダニエルは、非常[ひじょう]に驚[おどろ]き、思[おも]い巡[めぐ]らしに悩[なや]まされた。顔色[かおいろ]は変[か]わり、その言葉[ことば]を心[こころ]に留[と]めた。"

notes:
  1: "Ἔτους πρώτου βασιλεύοντος Βαλτασαρ χώρας Βαβυλωνίας — «в первый год царствования Валтасара над страной Вавилонской»; слав. «валтасара царя халдейска» — カルデアの王 (халдейский, не «вавилонский»), держим слав. Δανιηλ ὅραμα εἶδε παρὰ κεφαλὴν ἐπὶ τῆς κοίτης αὐτοῦ — «Даниил видел видение у головы своей на ложе своём» (παρὰ κεφαλήν — у изголовья); слав. «сон виде и видения главы его на ложи его» — по МТ, внесено (夢 и 幻). εἰς κεφάλαια λόγων — «в главы словес», т. е. по пунктам, кратко; отсюда 言葉[ことば]の見出[みだ]しごと; слав. короче («сон свой вписа»)."
  2: "Ἐπὶ τῆς κοίτης μου ἐθεώρουν — «на ложе моём я смотрел»; слав. «аз даниил видех в видении моем нощию» — имя внесено (わたしダニエルは), оно есть и в слав., и в LXX 7:1. τέσσαρες ἄνεμοι τοῦ οὐρανοῦ — «четыре ветра небесных»; ἐνέπεσον εἰς τὴν θάλασσαν τὴν μεγάλην — «упали (налегли) на море великое» (ἐμπίπτω), передано 激[はげ]しく吹[ふ]きつけた."
  3: "θηρία … διαφέροντα ἓν παρὰ τὸ ἕν — «звери, отличающиеся один от другого»; ἀνέβαινον ἐκ τῆς θαλάσσης — «выходили из моря». Слав. добавляет «велицыи» (большие) — нет в LXX, внесено (大[おお]きな)."
  4: "ὡσεὶ λέαινα — «как львица» (λέαινα, ж. р.; слав. «львица»), отсюда 雌[め]の獅子[しし]; πτερὰ ὡσεὶ ἀετοῦ — «крылья как у орла»; ἐτίλη τὰ πτερὰ αὐτῆς — «вырваны были крылья её» (τίλλω — щипать, вырывать); ἐπὶ ποδῶν ἀνθρωπίνων ἐστάθη — «стала на ноги человеческие»; ἀνθρωπίνη καρδία ἐδόθη — «сердце человеческое дано»."
  5: "ὁμοίωσιν ἔχον ἄρκου — «имеющий подобие медведицы» (ἄρκτος), отсюда 雌熊[めぐま]; ἐπὶ τοῦ ἑνὸς πλευροῦ ἐστάθη — «на одной стороне стало» (πλευρόν — бок, ребро); τρία πλευρά — «три ребра» (в МТ — клыки); слав. добавляет «среде зубов его» — нет в LXX, внесено (歯[は]の間[あいだ]). Ἀνάστα κατάφαγε σάρκας πολλάς — «встань, съешь мяса много»: слова, обращённые к зверю, — 「…」."
  6: "ὡσεὶ πάρδαλιν — «как барс» (πάρδαλις), 豹[ひょう]; πτερὰ τέσσαρα ἐπέτεινον ἐπάνω αὐτοῦ — «четыре крыла распростёрты над ним»; τέσσαρες κεφαλαί — «четыре головы». Слав. «и власть дадеся ему» — 権威[けんい]: в LXX здесь γλῶσσα ἐδόθη αὐτῷ, «дан язык»; держим слав., вариант LXX отмечен."
  7: "φοβερόν … ὁ φόβος αὐτοῦ ὑπερφέρων ἰσχύι — «страшный, и страх его превосходящий силою»; ὀδόντας σιδηροῦς μεγάλους — «зубы железные большие»; ἐσθίον καὶ κοπανίζον — «поедающий и раздробляющий» (κοπανίζω — толочь, дробить), 砕[くだ]く; κύκλῳ τοῖς ποσὶ καταπατοῦν — «вокруг ногами попирающий»; διαφόρως χρώμενον — «весьма отличный»; κέρατα δέκα — «десять рогов»."
  8: "βουλαὶ πολλαὶ ἐν τοῖς κέρασιν αὐτοῦ — тёмное место: «много замыслов в рогах его»; слав. «разсмотрях в розех его» — «я рассматривал рога его» (по МТ), отсюда 眺[なが]めていると. ἀνεφύη … μικρόν — «возрос малый»; τρία τῶν κεράτων … ἐξηράνθησαν — «три из прежних рогов иссохли»; слав. «исторгнушася» — вырваны, внесено (抜[ぬ]き取[と]られた). ὀφθαλμοὶ ἀνθρώπινοι — «глаза человеческие»; στόμα λαλοῦν μεγάλα — «уста, говорящие великое»; ἐποίει πόλεμον πρὸς τοὺς ἁγίους — «вёл войну со святыми»: в слав. этой клаузы нет (она в 7:21), внесена по LXX."
  9: "θρόνοι ἐτέθησαν — «престолы поставлены» (мн. ч.; в тексте 王座[おうざ] без числа); παλαιὸς ἡμερῶν — «Ветхий днями», 日[ひ]の老[お]いたる者[もの] (παλαιός — древний); περιβολὴ ὡσεὶ χιών — «одеяние как снег»; τρίχωμα τῆς κεφαλῆς — «волосы головы» (τρίχωμα); ἔριον λευκὸν καθαρόν — «шерсть белая чистая» (ἔριον — шерсть, 羊毛[ようもう]); θρόνος ὡσεὶ φλὸξ πυρός — «престол как пламя огня»; слав. добавляет «колеса его огнь палящь» — в LXX-модуле нет, внесено (車輪[しゃりん])."
  10: "ποταμὸς πυρὸς ἐξεπορεύετο κατὰ πρόσωπον αὐτοῦ — «река огненная исходила пред лицом его»; χίλιαι χιλιάδες ἐθεράπευον αὐτόν — «тысячи тысяч служили ему» (θεραπεύω — служить), передано 千[せん]の千[せん]が仕[つか]え; μύριαι μυριάδες παρειστήκεισαν — «тьмы тем предстояли» (μυριάς — десять тысяч), 万[まん]の万[まん]; κριτήριον ἐκάθισε — «судилище село» (κριτήριον — суд), 裁[さば]きの座[ざ]; βίβλοι ἠνεῴχθησαν — «книги открыты» (βίβλος), 書物[しょもつ]."
  11: "ἐθεώρουν τότε τὴν φωνὴν τῶν λόγων τῶν μεγάλων — «смотрел тогда на голос слов великих» (τὴν φωνήν — из-за голоса, по МТ); ἃ τὸ κέρας ἐλάλει — «которые говорил рог»; ἀπετυμπανίσθη τὸ θηρίον — «зверь был убит (забит)» (ἀποτυμπανίζω — казнить); ἀπώλετο τὸ σῶμα αὐτοῦ — «тело его погибло»; ἐδόθη εἰς καῦσιν πυρός — «отдано на сожжение огнём»."
  12: "τοὺς κύκλῳ αὐτοῦ ἀπέστησε τῆς ἐξουσίας αὐτῶν — «у окружающих его отнял власть их» (ἀφίστημι — отставлять); χρόνος ζωῆς ἐδόθη αὐτοῖς — «время жизни дано им»; ἕως χρόνου καὶ καιροῦ — «до времени и срока» (καιρός — срок, 季節[きせつ]); слав. «продолжение жития … до времене и времене»."
  13: "ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ — «на облаках небесных»; ὡς υἱὸς ἀνθρώπου — «как бы Сын человеческий», 人[ひと]の子[こ]のような者[もの] (ὡς — «как», не отождествление); ὡς παλαιὸς ἡμερῶν παρῆν — «как бы Ветхий днями присутствовал»; слав. «даже до ветхаго денми дойде и пред него приведеся» — «дошёл до Ветхого днями и приведён был к Нему», по нему переведено. οἱ παρεστηκότες παρῆσαν αὐτῷ — «предстоящие предстали ему»: в слав. нет, внесено (侍[はべ]る者[もの]たち)."
  14: "ἐδόθη αὐτῷ ἐξουσία — «дана ему власть»; слав. «власть и честь и Царство» — 権威[けんい]と栄誉[えいよ]と王国[おうこく] (честь — 栄誉; в LXX δόξα, «слава», отмечено); πάντα τὰ ἔθνη τῆς γῆς κατὰ γένη — «все народы земли по родам»; слав. «вси людие, племена и языцы» — すべての民[たみ]、部族[ぶぞく]、言語[げんご]の異[こと]なる者[もの]たち (по Феодотиону), держим слав.; ἐξουσία αἰώνιος … οὐ μὴ ἀρθῇ — «власть вечная, которая не отнимется»; βασιλεία … οὐ μὴ φθαρῇ — «царство, которое не разрушится» (φθείρω — губить)."
  15: "ἀκηδιάσας ἐγὼ Δανιηλ — «смутившись (унывая) я, Даниил» (ἀκηδιάω — томиться); слав. «вострепета дух мой в состоянии моем» — 霊[れい]が震[ふる]え; τὰ ὁράματα τῆς κεφαλῆς μου ἐτάρασσόν με — по слав. «видения главы моея смущаху мя», 頭[あたま]に受[う]けた幻[まぼろし]がかき乱[みだ]した; в LXX-модуле стих обрывается на «ἐν τῷ ὁράματι τῆς νυκτός»."
  16: "προσῆλθον πρὸς ἕνα τῶν ἑστώτων — «подошёл к одному из стоящих»; τὴν ἀκρίβειαν ἐζήτουν — «искал точности» (ἀκρίβεια), 正確[せいかく]な意味[いみ]; τὴν κρίσιν τῶν λόγων ἐδήλωσέ μοι — «объявил мне суд (истолкование) слов»; слав. «сказание словес», отсюда 解[と]き明[あ]かし."
  17: "Ταῦτα τὰ θηρία … εἰσὶ τέσσαρες βασιλεῖαι — «эти звери — четыре царства»; αἳ ἀπολοῦνται ἀπὸ τῆς γῆς — «которые погибнут от земли»; слав. «четыри царства востанут на земли» — 地[ち]の上[うえ]に起[お]こる, иное чтение, держим слав. С этих слов говорит толкователь — 「…」 до конца 18."
  18: "παραλήψονται τὴν βασιλείαν ἅγιοι ὑψίστου — «примут царство святые Всевышнего»; καθέξουσι — «будут держать» (κατέχω — удерживать, владеть), 保[たも]つ; ἕως τοῦ αἰῶνος καὶ ἕως τοῦ αἰῶνος τῶν αἰώνων — «до века и до века веков», 世[よ]々[よ]にわたって、とこしえに. Слав. «яже возмутся» в начале стиха относится к царствам 17-го, в тексте не повторено."
  19: "ἐξακριβάσασθαι — «точно выяснить» (ἐξακριβάζω); τοῦ διαφθείροντος πάντα — «губящего всё»; ὑπερφόβου — «весьма страшного»; ὄνυχες χαλκοῖ — «когти медные» (χαλκός — медь, бронза), 青銅[せいどう] (слав. «медяни»); κατεσθίοντες πάντας κυκλόθεν — «поедающие всех вокруг»."
  20: "τοῦ ἑνὸς τοῦ ἄλλου τοῦ προσφυέντος — «одного другого, приросшего»; ἐξέπεσαν δι' αὐτοῦ τρία — «выпали через него три»; εἶχεν ὀφθαλμοὺς καὶ στόμα λαλοῦν μεγάλα — «имел глаза и уста, говорящие великое»; ἡ πρόσοψις αὐτοῦ ὑπερέφερε τὰ ἄλλα — «вид его превосходил прочие» (πρόσοψις — вид), 姿[すがた]. Слав. «вид‹ние его более прочиих» — в слав. тексте на месте слова типографский знак ‹›."
  21: "κατενόουν — «я рассматривал, наблюдал» (κατανοέω); πόλεμον συνιστάμενον πρὸς τοὺς ἁγίους — «войну, которую он вёл со святыми» (συνίστημι — начинать, составлять); τροπούμενον αὐτούς — «обращающий их в бегство, побеждающий» (τροπόω), 制圧[せいあつ]する; слав. «укрепися на них»."
  22: "ἕως τοῦ ἐλθεῖν τὸν παλαιὸν ἡμερῶν — «до того, как пришёл Ветхий днями»; τὴν κρίσιν ἔδωκε τοῖς ἁγίοις — «дал суд святым»; ὁ καιρὸς ἐδόθη — «дано время»; τὸ βασίλειον κατέσχον — «царство получили (овладели)» (βασίλειον — царская власть), 王国[おうこく]を手[て]に入[い]れた; слав. «время приспе, и царство прияша святии»."
  23: "ἐρρέθη μοι — «сказано мне»; διοίσει παρὰ πᾶσαν τὴν γῆν — «будет отличаться от всей земли» (διαφέρω); ἀναστατώσει αὐτήν — «возмутит, ниспровергнет её»; слав. «пояст всю землю» — 食[く]らい尽[つ]くす, иное чтение, держим слав.; καταλεανεῖ — «размельчит, истолчёт» (λεαίνω — дробить), 切[き]り刻[きざ]む (слав. «посечет»)."
  24: "τὰ δέκα κέρατα τῆς βασιλείας — «десять рогов царства»; δέκα βασιλεῖς στήσονται — «десять царей восстанут»; ὁ ἄλλος … μετὰ τούτους — «иной после них»; διοίσει κακοῖς ὑπὲρ τοὺς πρώτους — «превзойдёт злобами прежних»; τρεῖς βασιλεῖς ταπεινώσει — «трёх царей смирит (унизит)», 倒[たお]す."
  25: "ῥήματα εἰς τὸν ὕψιστον λαλήσει — «слова против Всевышнего скажет»; κατατρίψει — «сотрёт, изнурит» (κατατρίβω), 苦[くる]しめる; προσδέξεται ἀλλοιῶσαι καιροὺς καὶ νόμον — «возьмётся изменить времена и закон»; παραδοθήσεται πάντα εἰς τὰς χεῖρας αὐτοῦ — «предано будет всё в руки его» (слав. «дастся в руку его»); ἕως καιροῦ καὶ καιρῶν καὶ ἕως ἡμίσους καιροῦ — «до времени и времён и до половины времени», передано 時[とき]と二[ふた]つの時[とき]と半[はん]の時[とき]の間[あいだ]."
  26: "ἡ κρίσις καθίσεται — «суд сядет»; τὴν ἐξουσίαν ἀπολοῦσι — «власть его погубят (отнимут)»; βουλεύσονται μιᾶναι καὶ ἀπολέσαι ἕως τέλους — тёмное: «умыслят осквернить и погубить до конца»; слав. «власть его преставят еже потребити и погубити до конца» — по нему переведено."
  27: "βασιλείαν καὶ ἐξουσίαν καὶ μεγαλειότητα αὐτῶν — «царство и власть и величие их»; слав. «величество царей, иже под всем небесем» — 天[てん]の下[した]にあるすべての王国[おうこく]の大[だい]いなる栄光[えいこう]; ἔδωκε λαῷ ἁγίῳ ὑψίστου — «дал народу святому Всевышнего»; βασιλεῦσαι βασιλείαν αἰώνιον — «чтобы царствовать в царстве вечном»; πᾶσαι αἱ ἐξουσίαι αὐτῷ ὑποταγήσονται καὶ πειθαρχήσουσιν — «все власти покорятся и будут послушны ему» (πειθαρχέω — слушаться)."
  28: "ἕως καταστροφῆς τοῦ λόγου — «до завершения слова» (καταστροφή — конец); σφόδρα ἐκστάσει περιειχόμην — «сильно объят был исступлением (изумлением)» (ἔκστασις); ἡ ἕξις μου διήνεγκεν ἐμοί — «вид мой изменился во мне» (ἕξις — состояние, вид), 顔色[かおいろ]; τὸ ῥῆμα ἐν καρδίᾳ μου ἐστήριξα — «слово утвердил в сердце моём», 心[こころ]に留[と]めた."
