verses:
  1: "シリアの軍[ぐん]の長[ちょう]ナアマンは、その主君[しゅくん]の前[まえ]に大[おお]きな者[もの]であり、だれからも重[おも]んじられていた。主[しゅ]が彼[かれ]によってシリアに救[すく]いを与[あた]えたからである。彼[かれ]は力[ちから]ある勇士[ゆうし]であったが、重[おも]い皮膚病[ひふびょう]にかかっていた。"
  2: "シリアから一隊[いったい]の者[もの]たちが出[で]て来[き]、イスラエルの地[ち]から小[ちい]さな少女[しょうじょ]を捕[と]らえて連[つ]れて行[い]った。彼女[かのじょ]はナアマンの妻[つま]のそばに仕[つか]えることになった。"
  3: "彼女[かのじょ]は女主人[おんなあるじ]に言[い]った。「ご主人[しゅじん]さまが、サマリアにいる神[かみ]の預言者[よげんしゃ]のもとへ行[い]かれたらよいのに。そうすれば、あの預言者[よげんしゃ]がご主人[しゅじん]さまの重[おも]い皮膚病[ひふびょう]を治[なお]してくださるのに。」"
  4: "ナアマンは入[はい]って行[い]き、自分[じぶん]の主君[しゅくん]に告[つ]げて言[い]った。「イスラエルの地[ち]から来[き]たあの少女[しょうじょ]は、こう言[い]った。」"
  5: "シリアの王[おう]はナアマンに言[い]った。「行[い]って来[こ]い。わたしはイスラエルの王[おう]に手紙[てがみ]を送[おく]ろう。」ナアマンは出[で]かけて、銀[ぎん]十[じゅう]タラント、金貨[きんか]六千枚[ろくせんまい]、着替[きが]えの衣[ころも]十着[じゅうちゃく]を携[たずさ]えて行[い]った。"
  6: "彼[かれ]はその手紙[てがみ]をイスラエルの王[おう]に届[とど]けた。手紙[てがみ]にはこう書[か]いてあった。「さて、この手紙[てがみ]があなたのもとに届[とど]いたなら、見[み]よ、わたしはわたしのしもべナアマンをあなたのもとへ遣[つか]わした。あなたは彼[かれ]の重[おも]い皮膚病[ひふびょう]を治[なお]しなさい。」"
  7: "イスラエルの王[おう]はその手紙[てがみ]を読[よ]むと、自分[じぶん]の衣[ころも]を引[ひ]き裂[さ]いて言[い]った。「わたしは人[ひと]を殺[ころ]したり生[い]かしたりする神[かみ]なのか。この男[おとこ]は、わたしに重[おも]い皮膚病[ひふびょう]の男[おとこ]を治[なお]させようとして、わたしのもとへ人[ひと]を遣[つか]わして来[き]た。よくよく分[わ]かって見[み]るがよい。彼[かれ]はわたしと言[いい]争[あらそ]う口実[こうじつ]を探[さが]しているのだ。」"
  8: "エリシャは、イスラエルの王[おう]が衣[ころも]を引[ひ]き裂[さ]いたと聞[き]くと、王[おう]のもとへ人[ひと]を遣[つか]わして言[い]った。「なぜあなたは衣[ころも]を引[ひ]き裂[さ]いたのか。ナアマンをわたしのところへ来[こ]させなさい。そうすれば、イスラエルに預言者[よげんしゃ]がいることを知[し]るだろう。」"
  9: "ナアマンは馬[うま]と戦車[せんしゃ]に乗[の]って来[き]て、エリシャの家[いえ]の戸口[とぐち]に立[た]った。"
  10: "エリシャは使者[ししゃ]を彼[かれ]に送[おく]って言[い]った。「行[い]って、ヨルダン川[がわ]で七度[しちど]体[からだ]を洗[あら]いなさい。そうすれば、あなたの肉[にく]は元[もと]どおりになり、きよめられる。」"
  11: "ナアマンは怒[いか]って立[た]ち去[さ]り、言[い]った。「わたしは、あの人がわたしのところへ出[で]て来[き]て立[た]ち、彼[かれ]の神[かみ]の名[な]を呼[よ]び、その場所[ばしょ]に手[て]を置[お]いて重[おも]い皮膚病[ひふびょう]を除[のぞ]いてくれると思[おも]っていた。"
  12: "ダマスコの川[かわ]アバナとファルファルは、ヨルダン川[がわ]やイスラエルのすべての水[みず]よりも良[よ]くはないのか。その水[みず]で体[からだ]を洗[あら]えば、きよめられないのか。」彼[かれ]は向[む]きを変[か]え、怒[いか]ったまま立[た]ち去[さ]った。"
  13: "彼[かれ]の若[わか]い者[もの]たちが近[ちか]づいて言[い]った。「ご主人[しゅじん]、もしあの預言者[よげんしゃ]が大[おお]きなことをあなたに命[めい]じたなら、それをなさらなかっただろうか。まして、『体[からだ]を洗[あら]って、きよくなりなさい』とだけ言[い]われたのだから。」"
  14: "ナアマンは下[くだ]って行[い]き、エリシャの言葉[ことば]のとおりに、ヨルダン川[がわ]で七度[しちど]身[み]を浸[ひた]した。すると、彼[かれ]の肉[にく]は幼[おさな]い子[こ]どもの肉[にく]のように戻[もど]り、彼[かれ]はきよめられた。"
  15: "彼[かれ]は自分[じぶん]の全[ぜん]軍[ぐん]とともにエリシャのもとへ戻[もど]って来[き]て、彼[かれ]の前[まえ]に立[た]ち、言[い]った。「わたしは今[いま]、イスラエルのほかには、この全[ぜん]地[ち]に神[かみ]はいないことを知[し]った。どうか、しもべから贈[おく]り物[もの]を受[う]け取[と]ってほしい。」"
  16: "エリシャは言[い]った。「わたしが御前[おんまえ]に仕[つか]える生[い]ける主[しゅ]にかけて、わたしは受[う]け取[と]らない。」ナアマンは無理[むり]に勧[すす]めたが、エリシャは応[おう]じなかった。"
  17: "ナアマンは言[い]った。「それなら、どうか、しもべにらば二頭[にとう]が運[はこ]べるだけの赤[あか]い土[つち]を授[さず]けてほしい。しもべはもう、ほかの神[かみ]々[がみ]に燔祭[はんさい]や犠牲[ぎせい]をささげず、ただ主[しゅ]にだけささげるからだ。"
  18: "ただ、このことだけは、主[しゅ]がしもべをお赦[ゆる]しくださるように。ご主人[しゅじん]さまがリンモンの神殿[しんでん]に、そこに礼拝[れいはい]するために入[はい]られるとき、しもべはご主人[しゅじん]さまの手[て]に寄[よ]りかかり、ご主人[しゅじん]さまがリンモンの神殿[しんでん]で礼拝[れいはい]するとき、しもべもリンモンの神殿[しんでん]で礼拝[れいはい]する。このことだけは、主[しゅ]がしもべをお赦[ゆる]しくださるように。」"
  19: "エリシャはナアマンに言[い]った。「安心[あんしん]して行[い]きなさい。」ナアマンは彼[かれ]のもとを去[さ]り、地[ち]を少[すこ]し行[い]ったところで止[と]まった。"
  20: "エリシャの従者[じゅうしゃ]ギエジは思[おも]った。「見[み]よ、わたしの主人[しゅじん]は、このシリア人[じん]ナアマンが持[も]って来[き]た物[もの]を、その手[て]から受[う]け取[と]らなかった。主[しゅ]は生[い]きておられる。わたしは彼[かれ]の後[あと]を追[お]って走[はし]り、何[なに]かを受[う]け取[と]ってみせる。」"
  21: "ギエジはナアマンの後[あと]を追[お]いかけた。ナアマンは自分[じぶん]の後[あと]を走[はし]って来[く]る者[もの]があるのを見[み]て、戦車[せんしゃ]から降[お]り、彼[かれ]を迎[むか]えた。"
  22: "ギエジは言[い]った。「無事[ぶじ]だ。わたしの主人[しゅじん]がわたしを遣[つか]わして言[い]った。『たった今[いま]、エフライムの山[やま]から、預言者[よげんしゃ]の弟子[でし]たちのうちの若[わか]い者[もの]二人[ふたり]がわたしのところへ来[き]た。彼らに銀[ぎん]一[いち]タラントと着替[きが]えの衣[ころも]二着[にちゃく]を渡[わた]してほしい。』」"
  23: "ナアマンは言[い]った。「二[に]タラント受[う]け取[と]ってほしい。」そして、銀[ぎん]二[に]タラントを二[ふた]つの袋[ふくろ]に入[い]れ、着替[きが]えの衣[ころも]二着[にちゃく]とともに、自分[じぶん]の若[わか]い者[もの]二人[ふたり]に渡[わた]して、彼[かれ]らの前[まえ]を運[はこ]ばせた。"
  24: "彼[かれ]らは暗[くら]い所[ところ]まで来[き]た。ギエジはその手[て]から物[もの]を受[う]け取[と]って家[いえ]に納[おさ]め、その者[もの]たちを帰[かえ]らせた。"
  25: "彼[かれ]は入[はい]って行[い]き、自分[じぶん]の主人[しゅじん]の前[まえ]に立[た]った。エリシャは彼[かれ]に言[い]った。「ギエジ、どこから来[き]たのか。」ギエジは言[い]った。「しもべはどこへも行[い]っていない。」"
  26: "エリシャは彼[かれ]に言[い]った。「あの男[おとこ]が戦車[せんしゃ]から降[お]りてあなたを迎[むか]えたとき、わたしの心[こころ]はあなたとともにそこにいたのではないか。今[いま]、あなたは銀[ぎん]を取[と]り、衣[ころも]を取[と]った。そして、それで園[その]やオリーブ畑[ばたけ]、ぶどう畑[ばたけ]、羊[ひつじ]や牛[うし]、男[おとこ]や女[おんな]の奴隷[どれい]を手[て]に入[い]れようというのか。"
  27: "ナアマンの重[おも]い皮膚病[ひふびょう]は、あなたとあなたの子孫[しそん]に、とこしえに付[つ]きまとう。」ギエジはエリシャの前[まえ]から出[で]て行[い]き、雪[ゆき]のように白[しろ]い皮膚病[ひふびょう]にかかっていた。"

notes:
  1: "ἄρχων τῆς δυνάμεως — военачальник (軍の長). ἀνὴρ μέγας ἐνώπιον τοῦ κυρίου αὐτοῦ — «муж великий пред господином своим». τεθαυμασμένος προσώπῳ — букв. «дивный лицом», т. е. видный, уважаемый (слав. «дивен лицем»); передано описательно. σωτηρίαν — «спасение», здесь победа. λελεπρωμένος — «поражённый проказой» (прич. перфекта от λεπρόω); в корпусе 重い皮膚病, а не 癩病."
  2: "μονόζωνοι — букв. «однопоясанные», т. е. отдельные отряды, одиночные набеги (слав. «воини»); передано «отряд». νεάνιδα μικράν — «малую девицу». ἦν ἐνώπιον τῆς γυναικὸς Ναιμαν — «была пред женою Наамана», т. е. прислуживала ей."
  3: "Ὄφελον — «о, если бы» (незавершённое желание). ἀποσυνάξει αὐτὸν ἀπὸ τῆς λέπρας αὐτοῦ — «снимет с него проказу» (ἀποσυνάγω здесь «убрать»); слав. «той бы очистил его»."
  4: "εἰσῆλθεν καὶ ἀπήγγειλεν — «вошёл и возвестил»; подлежащее не названо, по контексту Нааман (в ru добавлено «Нееман», в гр нет). Οὕτως καὶ οὕτως — «так и так»."
  5: "Δεῦρο εἴσελθε — «пойди, войди». βιβλίον — письмо (手紙). δέκα τάλαντα ἀργυρίου — десять талантов серебра. ἑξακισχιλίους χρυσούς — «шесть тысяч золотых» (χρυσοῦς — золотая монета; слав. «златник», в ru «сикли» — по МТ). ἀλλασσομένας στολάς — «перемены одежд» (着替えの衣)."
  6: "ὡς ἂν ἔλθῃ τὸ βιβλίον — «когда придёт письмо». ἀποσυνάξεις αὐτὸν ἀπὸ τῆς λέπρας — «снимешь с него проказу» (см. ст. 3); в письме царя та же формула, что у девушки."
  7: "διέρρηξεν τὰ ἱμάτια — «разодрал одежды» (знак ужаса и бессилия). Μὴ θεὸς ἐγὼ τοῦ θανατῶσαι καὶ ζωοποιῆσαι — «разве я Бог, чтобы умерщвлять и оживлять» (θανατόω, ζωοποιέω). προφασίζεται — «ищет предлога» (προφασίζομαι)."
  8: "Ἵνα τί — «для чего». ἐλθέτω δὴ πρός με — «пусть придёт ко мне». γνώτω — «пусть узнает» (γινώσκω)."
  9: "ἐν ἵππῳ καὶ ἅρματι — «на коне и колеснице» (в гр ед. ч.; слав. мн. ч. «на конех и на колесницех»). ἐπὶ θύρας οἴκου — «у дверей дома»."
  10: "λοῦσαι ἑπτάκις ἐν τῷ Ιορδάνῃ — «омойся семь раз в Иордане». ἐπιστρέψει ἡ σάρξ σού σοι — «возвратится плоть твоя к тебе», т. е. станет как прежде. καθαρισθήσῃ — «очистишься, будешь чист»."
  11: "ἐθυμώθη — «разгневался» (θυμόω). ἐπικαλέσεται ἐν ὀνόματι θεοῦ αὐτοῦ — «призовёт имя Бога своего». ἐπιθήσει τὴν χεῖρα ἐπὶ τὸν τόπον — «возложит руку на [больное] место». ἀποσυνάξει τὸ λεπρόν — «снимет проказу»."
  12: "Αβανα καὶ Φαρφαρ — Авана и Фарфар, реки Дамаска (в слав. те же имена). ὑπὲρ Ιορδάνην — «лучше Иордана». ἐξέκλινεν — «свернул, повернул» (ἐκκλίνω)."
  13: "οἱ παῖδες αὐτοῦ — «слуги, отроки его». Μέγαν λόγον — «великое слово, большое дело». οὐχὶ ποιήσεις — «разве не сделал бы». Λοῦσαι καὶ καθαρίσθητι — «омойся и очистись»."
  14: "κατέβη — «сошёл» (к Иордану). ἐβαπτίσατο — «погрузился» (βαπτίζω, здесь о погружении в воду; слав. «погрузися»). ὡς σὰρξ παιδαρίου μικροῦ — «как плоть малого ребёнка»."
  15: "ἐπέστρεψεν ... αὐτὸς καὶ πᾶσα ἡ παρεμβολὴ αὐτοῦ — «возвратился он и весь стан его». ἔγνωκα — перфект «узнал». οὐκ ἔστιν θεὸς ἐν πάσῃ τῇ γῇ ὅτι ἀλλ᾽ ἢ ἐν τῷ Ισραηλ — «нет Бога на всей земле, кроме как в Израиле». εὐλογία — здесь «дар, приношение» (слав. «благословение»)."
  16: "Ζῇ κύριος, ᾧ παρέστην ἐνώπιον αὐτοῦ — «жив Господь, которому я предстою». εἰ λήμψομαι — опущенная клятва: «[не приму], если приму». παρεβιάσατο — «принуждал» (παραβιάζομαι). ἠπείθησεν — «не послушал, отказал» (ἀπειθέω)."
  17: "γόμος ζεύγους ἡμιόνων — «груз пары мулов», т. е. столько земли, сколько унесут два мула (слав. «время, супруг мсков» — испорченное чтение; в ru «сколько снесут два лошака»). ἐκ τῆς γῆς τῆς πυρρᾶς — «из земли красной» (πυρρός — рыжий, красный; слав. «червленый»). ὁλοκαύτωμα καὶ θυσίασμα — всесожжение и жертва."
  18: "ἱλάσεται κύριος τῷ δούλῳ σου — «да простит Господь раба твоего» (ἱλάσκομαι). οἶκος Ρεμμαν — дом Риммона (в слав. «Ремман»; в тексте リンモン). ἐπαναπαύσεται ἐπὶ τῆς χειρός μου — «опрётся на руку мою». Троекратный повтор «в доме Риммона» в гр сохранён. Слав. переставляет начало стиха («по глаголу сему и о словеси сем»), порядок гр сохранён."
  19: "Δεῦρο εἰς εἰρήνην — «иди с миром». εἰς δεβραθα τῆς γῆς — тёмное место; вероятно «на расстояние [от него]» (слав. транслитерирует «на Хаврафа земли», в ru «на небольшое пространство земли»); передано «отойдя немного»."
  20: "ἐφείσατο — «пощадил» (φείδομαι). ζῇ κύριος ὅτι εἰ μὴ δραμοῦμαι — клятва: «жив Господь, [не иначе] как побегу». λήμψομαι παρ᾽ αὐτοῦ τι — «возьму у него что-нибудь»."
  21: "ἐδίωξε ... ὀπίσω — «погнался за» (διώκω). ἐπέστρεψεν ἀπὸ τοῦ ἅρματος — «сошёл с колесницы». Слав. добавляет вопрос «мир ли?» — в гр это первое слово ст. 22 (Εἰρήνη); граница стихов в слав. иная."
  22: "Εἰρήνη — «мир», т. е. «всё хорошо» (слав. «мир»). Ἰδοὺ νῦν ἦλθον ... δύο παιδάρια — «вот, сейчас пришли ко мне два отрока». ἐξ ὄρους Εφραιμ — с горы Ефремовой. ἀπὸ τῶν υἱῶν τῶν προφητῶν — из сынов пророческих (預言者の弟子たち)."
  23: "Λαβὲ διτάλαντον — «возьми два таланта» (διτάλαντον — двойной талант, т. е. два); слав. «возми два таланта». ἐν δυσὶ θυλάκοις — «в двух мешках» (θύλακος). В ru добавлено «и упрашивал его» — в гр нет."
  24: "εἰς τὸ σκοτεινόν — «в тёмное [место]»; вероятно холм или Офел (слав. «в сумраки», в ru «к холму» — по МТ). παρέθετο ἐν οἴκῳ — «положил, спрятал в доме» (παρατίθημι)."
  25: "παρειστήκει — плюсквамперфект «предстоял» (παρίστημι). Πόθεν — «откуда». Οὐ πεπόρευται ὁ δούλός σου ἔνθα καὶ ἔνθα — «не ходил раб твой ни туда ни сюда» (перфект)."
  26: "Οὐχὶ ἡ καρδία μου ἐπορεύθη μετὰ σοῦ — «разве сердце моё не шло с тобою»; слав. добавляет «и видех» — в гр этого нет. ἐπέστρεψεν ἀπὸ τοῦ ἅρματος εἰς συναντήν σοι — «обратился с колесницы навстречу тебе». λήμψῃ ἐν αὐτῷ κήπους καὶ ἐλαιῶνας — «купишь на это сады и масличные [рощи]» (ἐλαιών — оливковая роща). παῖδας καὶ παιδίσκας — рабов и рабынь."
  27: "κολληθήσεται ἐν σοί — «прильнёт к тебе» (κολλάομαι). εἰς τὸν αἰῶνα — «навек». ὡσεὶ χιών — «как снег»."
