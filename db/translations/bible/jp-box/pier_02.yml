# jp-box, Плач Иеремии, глава 2. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для Плача нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 2: 1–8 гнев Господа на дщерь Сиона (омрачение, поглощённые твердыни, сломанный
# рог, натянутый лук, разрушенная скиния, отвергнутый жертвенник, измеренная стена);
# 9–10 ворота в земле, закон погиб, пророки без видений, старцы в прахе; 11–12 слёзы
# пророка, дети и грудные младенцы на улицах; 13–14 обращение к Иерусалиму и ложные
# пророки; 15–17 проходящие и враги издеваются, Господь совершил Своё слово; 18–22
# плач и молитва города (18б–22).
# Акростих: в слав. перед каждым стихом стоит название евр. буквы (Алеф, Беф, Гимель,
# Далеф, Ге, Вав, Заин, Иф, Теф, Иод, Каф, Ламед, Мем, Нун, Самех, Аин, Фи, Цади, Коф,
# Реш, Шин, Фав) — по одной на стих, всего 22. Это разметка акростиха, а не слова
# текста: в перевод не включена, отмечена в notes каждого стиха; в японском акростих
# не воспроизводится. В gr-lxx-byz названий букв нет — они только в слав.
# Нумерация по gr: 22 стиха, совпадает с csl и ru; границы стихов внутри главы те же
# (в слав. 2:2 кончается запятой, но клауза та же; 2:3 начинается с «сокруши»).
# 〔…〕 нет: редакционных помет в скобках в слав. тексте этой главы нет.
# Кавычки: 2:12 — слова детей 「…」; 2:15 — слова проходящих 「…」; 2:16 — слова врагов
# 「…」; 2:18б–2:22 — одна непрерывная речь (плач и молитва города) в 「…」, открывается
# в 18 после «叫んだ», закрывается в 22. Вложенной речи нет.
# Сносок ⟨…⟩ нет: 聖所, 会衆, 粗布, 天幕, 幕屋, 祭壇, 律法, 預言者 уже в корпусе.
# Имена: シオン, エルサレム, ユダ, ヤコブ, イスラエル, ソドム — по корпусу.
# Повторяющиеся формулы: πῶς → どうして…のか (1:1; 2:1; 4:1);
# οὐκ ἔστιν ὁ παρακαλῶν → 慰める者がいない; ἐπιφυλλίζω → 摘み尽くす (1:22; 2:20; 3:51).

