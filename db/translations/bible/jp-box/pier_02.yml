verses:
  1: "どうして、主[しゅ]はその怒[いか]りのうちに、シオンの娘[むすめ]を暗[くら]くされたのか。イスラエルの栄光[えいこう]を天[てん]から地[ち]へ投[な]げ落[お]とし、その怒りの日[ひ]に、ご自分[じぶん]の足[あし]の台[だい]を思[おも]い出[だ]されなかった。"
  2: "主[しゅ]はあわれむことなく、ヤコブのすべての美[うつく]しいものを沈[しず]められた。その憤[いきどお]りのうちに、ユダの娘[むすめ]の砦[とりで]を打[う]ち倒[たお]し、地[ち]に貼[は]りつけ、その王[おう]と支配者[しはいしゃ]たちを汚[けが]された。"
  3: "その怒[いか]りの激[はげ]しさのうちに、イスラエルのすべての角[つの]を折[お]られた。敵[てき]の前[まえ]でその右[みぎ]の手[て]を引[ひ]き退[しりぞ]け、ヤコブのうちに炎[ほのお]のように火[ひ]を燃[も]え上[あ]がらせ、周[まわ]りのすべてを食[く]い尽[つ]くされた。"
  4: "主[しゅ]は敵[てき]のように弓[ゆみ]を引[ひ]き、向[む]かい合[あ]う者[もの]のように右[みぎ]の手[て]を構[かま]えて、わたしの目[め]の慕[した]わしいものすべてを、シオンの娘[むすめ]の天幕[てんまく]のうちで殺[ころ]された。その憤[いきどお]りを火[ひ]のように注[そそ]ぎ出[だ]された。"
  5: "主[しゅ]は敵[てき]のようになった。主はイスラエルを沈[しず]め、そのすべての宮殿[きゅうでん]を沈め、その砦[とりで]を滅[ほろ]ぼし、ユダの娘[むすめ]の卑[ひく]くされることを、重[かさ]ねて増[ふ]やされた。"
  6: "主[しゅ]はぶどうの木[き]のようにご自分[じぶん]の幕屋[まくや]を打[う]ち壊[こわ]し、その祭[まつ]りを滅[ほろ]ぼされた。主[しゅ]はシオンでご自分が造[つく]られた祭[まつ]りと安息日[あんそくび]とを忘[わす]れ、その怒[いか]りの憤[いきどお]りをもって、王[おう]と祭司[さいし]と支配者[しはいしゃ]を激[はげ]しく責[せ]められた。"
  7: "主[しゅ]はご自分[じぶん]の祭壇[さいだん]を突[つ]き放[はな]ち、聖所[せいしょ]を振[ふ]り捨[す]て、砦[とりで]の城壁[じょうへき]を敵[てき]の手[て]に砕[くだ]かせられた。人々[ひとびと]は主[しゅ]の家[いえ]で、祭[まつ]りの日[ひ]のように声[こえ]を上[あ]げた。"
  8: "主[しゅ]はシオンの娘[むすめ]の城壁[じょうへき]を壊[こわ]すために向[む]きを変[か]えられた。測[はか]り縄[なわ]を伸[の]べ、踏[ふ]みにじることをやめるためにその手[て]を引[ひ]き戻[もど]されなかった。外[そと]の城壁[じょうへき]は嘆[なげ]き、城壁[じょうへき]もともに弱[よわ]められた。"
  9: "その門[もん]は地[ち]に沈[しず]み、主[しゅ]はそのかんぬきを滅[ほろ]ぼして砕[くだ]かれた。その王[おう]と支配者[しはいしゃ]たちは諸国[しょこく]の民[たみ]の間[あいだ]にある。律法[りっぽう]はなくなり、その預言者[よげんしゃ]たちも主[しゅ]から幻[まぼろし]を見[み]なかった。"
  10: "シオンの娘[むすめ]の長老[ちょうろう]たちは地[ち]に座[すわ]して黙[だま]り込[こ]み、頭[あたま]に塵[ちり]を載[の]せ、粗布[あらぬの]を身[み]にまとった。エルサレムの処女[おとめ]たちの長[かしら]たちは、地[ち]へと頭[あたま]を下[さ]げた。"
  11: "わたしの目[め]は涙[なみだ]に尽[つ]きた。心[こころ]は騒[さわ]ぎ立[た]ち、わたしの栄光[えいこう]は、わたしの民[たみ]の娘[むすめ]の砕[くだ]かれるゆえに、地[ち]に注[そそ]ぎ出[だ]された。幼子[おさなご]と乳飲[ちの]み子[ご]が、都[みやこ]の広場[ひろば]で息絶[いきた]えるからである。"
  12: "彼ら[かれら]は母[はは]に言[い]った。「穀物[こくもつ]とぶどう酒[ぶどうしゅ]はどこにあるのか。」彼らは都[みやこ]の広場[ひろば]で、傷[きず]ついた者[もの]のように力[ちから]を失[うしな]い、母[はは]の胸[むね]のうちにその命[いのち]を注[そそ]ぎ出[だ]した。"
  13: "エルサレムの娘[むすめ]よ、わたしは何[なに]をあなたに証[しょう]し、何[なに]にたとえればよいのか。処女[おとめ]、シオンの娘[むすめ]よ、だれがあなたを救[すく]い、慰[なぐさ]めるのか。あなたの打[う]ち砕[くだ]きの杯[さかずき]は大[おお]きくなった。だれがあなたを癒[いや]すのか。"
  14: "あなたの預言者[よげんしゃ]たちは、あなたにむなしいことと愚[おろ]かなこととを見[み]せ、あなたの不法[ふほう]を明[あ]らかにして、あなたの捕囚[ほしゅう]を帰[かえ]らせることをしなかった。あなたに示[しめ]したのは、むなしい託宣[たくせん]と追[お]い出[だ]しの言葉[ことば]だけであった。"
  15: "道[みち]を行[ゆ]き交[か]う者[もの]はみな、あなたのことで手[て]を打[う]ち鳴[な]らし、口笛[くちぶえ]を吹[ふ]いて、エルサレムの娘[むすめ]のことで頭[あたま]を振[ふ]った。「これが、栄光[えいこう]の冠[かんむり]、全[ぜん]地[ち]の喜[よろこ]びと呼[よ]ばれていた都[みやこ]か。」"
  16: "あなたの敵[てき]はみな、あなたに向[む]かって口[くち]を開[ひら]き、口笛[くちぶえ]を吹[ふ]いて歯[は]を噛[か]み鳴[な]らし、言[い]った。「わたしたちはこれを呑[の]み込[こ]んだ。これこそ、わたしたちが待[ま]ち望[のぞ]んでいた日[ひ]だ。見[み]つけた、見[み]たのだ。」"
  17: "主[しゅ]は思[おも]い描[えが]かれたことを行[おこな]い、昔[むかし]から命[めい]じておられたご自分[じぶん]の言葉[ことば]を成[な]し遂[と]げ、惜[お]しむことなく打[う]ち倒[たお]された。主はあなたのことで敵[てき]を喜[よろこ]ばせ、あなたを苦[くる]しめる者[もの]の角[つの]を高[たか]く上[あ]げられた。"
  18: "彼ら[かれら]の心[こころ]は主[しゅ]に向[む]かって叫[さけ]んだ。「シオンの城壁[じょうへき]よ、昼[ひる]も夜[よる]も涙[なみだ]を川[かわ]のように流[なが]せ。自分[じぶん]に休[やす]みを与[あた]えるな。娘[むすめ]よ、あなたの目[め]を閉[と]じるな。"
  19: "起[お]き上[あ]がれ。夜[よる]の見張[みは]りが始[はじ]まるたびに、声[こえ]を上[あ]げよ。水[みず]のように、あなたの心[こころ]を主[しゅ]の前[まえ]に注[そそ]ぎ出[だ]せ。あなたの幼子[おさなご]たちの命[いのち]のために、飢[うえ]えによってすべての街角[まちかど]の始[はじ]めに倒[たお]れている者[もの]たちのために、主に向[む]かって両手[りょうて]を上[あ]げよ。"
  20: "主[しゅ]よ、ご覧[らん]ください。よく見[み]てください。あなたはだれにこのようにされたのか。女[おんな]たちが自分[じぶん]の腹[はら]の実[み]を食[た]べるというのか。料理人[りょうりにん]が摘[つ]み尽[つ]くしたのか。乳[ちち]を飲[の]む幼子[おさなご]たちが殺[ころ]されるというのか。あなたは主[しゅ]の聖所[せいしょ]のうちで、祭司[さいし]と預言者[よげんしゃ]を殺[ころ]されるのか。"
  21: "幼[おさな]い者[もの]も老人[ろうじん]も、通[とお]りに伏[ふ]して眠[ねむ]っている。わたしの処女[おとめ]たちも若者[わかもの]たちも、捕囚[ほしゅう]となって行[い]った。あなたは剣[つるぎ]と飢[うえ]えによって殺[ころ]し、怒[いか]りの日[ひ]に煮[に]て、惜[お]しまれなかった。"
  22: "あなたは周[まわ]りから、祭[まつ]りの日[ひ]のように、わたしの寄留[きりゅう]の者[もの]たちを呼[よ]び寄[よ]せられた。主[しゅ]の怒[いか]りの日[ひ]には、逃[のが]れ延[の]びる者[もの]も残[のこ]る者[もの]もいなかった。わたしが力[ちから]を得[え]、敵[てき]をすべて増[ふ]やしたかのようだ。」"

notes:
  1: "Πῶς ἐγνόφωσεν ἐν ὀργῇ αὐτοῦ κύριος τὴν θυγατέρα Σιων — «как омрачил в гневе Своём Господь дщерь Сиона»: та же формула πῶς, что в 1:1 и 4:1 (どうして…のか). κατέρριψεν ἐξ οὐρανοῦ εἰς γῆν δόξασμα Ισραηλ — «низринул с неба на землю славу Израиля» (δόξασμα — 栄光). οὐκ ἐμνήσθη ὑποποδίου ποδῶν αὐτοῦ — «не вспомнил подножия ног Своих» (ὑποπόδιον — 足の台; ср. Пс 98:5). Акростих: Алеф (в слав. — разметка, не слово текста; в японском не воспроизводится)."
  2: "Κατεπόντισεν κύριος οὐ φεισάμενος — «погрузил Господь, не пощадив» (καταποντίζω — потоплять): あわれむことなく…沈められた, как в 2:5. τὰ ὡραῖα Ιακωβ — «красоты Иакова» (ὡραῖος). τὰ ὀχυρώματα τῆς θυγατρὸς Ιουδα — «твердыни дщери Иуды» (ὀχύρωμα — 砦). ἐκόλλησεν εἰς τὴν γῆν — «прилепил к земле». ἐβεβήλωσεν βασιλέα αὐτῆς καὶ ἄρχοντας αὐτῆς — «осквернил царя её и князей её» (βεβηλόω). Акростих: Беф."
  3: "Συνέκλασεν ἐν ὀργῇ θυμοῦ αὐτοῦ πᾶν κέρας Ισραηλ — «сокрушил в гневе ярости Своей всякий рог Израиля» (κέρας — 角, образ силы). ἀπέστρεψεν ὀπίσω δεξιὰν αὐτοῦ ἀπὸ προσώπου ἐχθροῦ — «обратил вспять десницу Свою от лица врага». ἀνῆψεν ἐν Ιακωβ ὡς πῦρ φλόγα — «возжёг в Иакове, как огонь, пламя» (φλόξ — 炎). Акростих: Гимель."
  4: "Ἐνέτεινεν τόξον αὐτοῦ ὡς ἐχθρός — «натянул лук Свой, как враг» (ἐντείνω; τόξον — 弓). ἐστερέωσεν δεξιὰν αὐτοῦ ὡς ὑπεναντίος — «утвердил десницу Свою, как супостат» (ὑπεναντίος — противник), передано 向かい合う者のように…構えて. ἀπέκτεινεν πάντα τὰ ἐπιθυμήματα ὀφθαλμῶν μου — «убил всё вожделенное для глаз моих». ἐν σκηνῇ θυγατρὸς Σιων — «в скинии дщери Сиона» (σκηνή — 天幕). Акростих: Далеф."
  5: "Ἐγενήθη κύριος ὡς ἐχθρός — «стал Господь как враг». κατεπόντισεν πάσας τὰς βάρεις αὐτῆς — «погрузил все твердыни (башни) её» (βᾶρις — крепость, 宮殿). διέφθειρεν τὰ ὀχυρώματα αὐτοῦ — «разрушил твердыни его». ἐπλήθυνεν τῇ θυγατρὶ Ιουδα ταπεινουμένην καὶ τεταπεινωμένην — «умножил дщери Иудиной смиряемую и смиренную» (двойное причастие — усилительный оборот, передан 重ねて増やされた). Акростих: Ге."
  6: "διεπέτασεν ὡς ἄμπελον τὸ σκήνωμα αὐτοῦ — «распростёр, как виноградную лозу, скинию Свою» (ἄμπελος — ぶどうの木): в евр. «как сад» (כַּגַּן), LXX прочёл «как лозу» (כַּגֶּפֶן), держим LXX/csl. διέφθειρεν ἑορτὴν αὐτοῦ — «разрушил праздник его». ἐπελάθετο κύριος ὃ ἐποίησεν ἐν Σιων ἑορτῆς καὶ σαββάτου — «забыл Господь, что сотворил в Сионе: праздник и субботу» (σάββατον — 安息日). παρώξυνεν ἐμβριμήματι ὀργῆς αὐτοῦ βασιλέα καὶ ἱερέα καὶ ἄρχοντα — «возбудил негодованием гнева Своего царя, священника и князя» (ἐμβρίμημα — негодование). Акростих: Вав."
  7: "Ἀπώσατο κύριος θυσιαστήριον αὐτοῦ — «отринул Господь жертвенник Свой» (θυσιαστήριον — 祭壇). ἀπετίναξεν ἁγίασμα αὐτοῦ — «отряс святилище Своё» (ἀποτινάσσω — отрясать). συνέτριψεν ἐν χειρὶ ἐχθροῦ τεῖχος βάρεων αὐτῆς — «сокрушил рукою врага стену твердынь её». φωνὴν ἔδωκαν ἐν οἴκῳ κυρίου ὡς ἐν ἡμέρᾳ ἑορτῆς — «дали голос в доме Господнем, как в день праздника». Акростих: Заин."
  8: "ἐπέστρεψεν κύριος τοῦ διαφθεῖραι τεῖχος θυγατρὸς Σιων — «обратился Господь, чтобы разрушить стену дщери Сиона». ἐξέτεινεν μέτρον — «протянул меру (вервь)» (μέτρον — 測り縄). οὐκ ἀπέστρεψεν χεῖρα αὐτοῦ ἀπὸ καταπατήματος — «не отвратил руки Своей от попрания» (καταπάτημα — попрание). ἐπένθησεν τὸ προτείχισμα — «восстенало предградие (внешняя стена)» (προτείχισμα). τεῖχος ὁμοθυμαδὸν ἠσθένησεν — «стена вместе обессилела» (ὁμοθυμαδόν — единодушно, вместе). Акростих: Иф."
  9: "Ἐνεπάγησαν εἰς γῆν πύλαι αὐτῆς — «погрузились в землю ворота её» (ἐνεπάγην — быть ввергнутым). ἀπώλεσεν καὶ συνέτριψεν μοχλοὺς αὐτῆς — «погубил и сокрушил засовы её» (μοχλός — かんぬき). βασιλέα αὐτῆς καὶ ἄρχοντας αὐτῆς ἐν τοῖς ἔθνεσιν — «царя её и князей её — среди народов». οὐκ ἔστιν νόμος — «нет закона» (律法). καί γε προφῆται αὐτῆς οὐκ εἶδον ὅρασιν παρὰ κυρίου — «и пророки её не увидели видения от Господа» (ὅρασις — 幻). Акростих: Теф."
  10: "Ἐκάθισαν εἰς τὴν γῆν — «сели на землю». ἐσιώπησαν πρεσβύτεροι θυγατρὸς Σιων — «умолкли старцы дщери Сиона» (πρεσβύτερος — 長老). ἀνεβίβασαν χοῦν ἐπὶ τὴν κεφαλὴν αὐτῶν — «подняли прах на головы свои» (χοῦς — 塵). περιεζώσαντο σάκκους — «препоясались вретищами» (σάκκος — 粗布). κατήγαγον εἰς γῆν ἀρχηγοὺς παρθένους ἐν Ιερουσαλημ — «склонили к земле главных дев в Иерусалиме» (ἀρχηγός — начальствующий; слав. «старейшин дев»): тёмное место, передано 処女たちの長たち. Акростих: Иод."
  11: "Ἐξέλιπον ἐν δάκρυσιν οἱ ὀφθαλμοί μου — «иссякли в слезах глаза мои» (ἐκλείπω). ἐταράχθη ἡ καρδία μου — «взволновалось сердце моё». ἐξεχύθη εἰς γῆν ἡ δόξα μου — «излилась на землю слава моя» (δόξα — 栄光; в ru «печень» по МТ). ἐπὶ τὸ σύντριμμα τῆς θυγατρὸς τοῦ λαοῦ μου — «о сокрушении дщери народа моего» (σύντριμμα — 打ち砕き, 砕かれること). ἐν τῷ ἐκλιπεῖν νήπιον καὶ θηλάζοντα ἐν πλατείαις πόλεως — «когда иссякают младенец и грудной на площадях города». Акростих: Каф."
  12: "Ταῖς μητράσιν αὐτῶν εἶπαν· Ποῦ σῖτος καὶ οἶνος — «матерям своим сказали: где пшеница и вино?»: слова детей — 「…」 (σῖτος — хлеб, пшеница; οἶνος — вино). ἐν τῷ ἐκλύεσθαι αὐτοὺς ὡς τραυματίας ἐν πλατείαις πόλεως — «когда они изнемогают, как раненые, на площадях города» (ἐκλύω — расслабляться; τραυματίας — 傷ついた者). ἐν τῷ ἐκχεῖσθαι ψυχὰς αὐτῶν εἰς κόλπον μητέρων αὐτῶν — «когда изливаются души их в лоно матерей их» (κόλπος — 胸, лоно). Акростих: Ламед."
  13: "Τί μαρτυρήσω σοι ἢ τί ὁμοιώσω σοι — «что засвидетельствую тебе или чему уподоблю тебя» (μαρτυρέω — свидетельствовать; слав. «засвидетелствую»). τίς σώσει σε καὶ παρακαλέσει σε — «кто спасёт тебя и утешит». ὅτι ἐμεγαλύνθη ποτήριον συντριβῆς σου — «ибо возвеличилась чаша сокрушения твоего» (ποτήριον — 杯). τίς ἰάσεταί σε — «кто исцелит тебя». Акростих: Мем."
  14: "Προφῆταί σου εἴδοσάν σοι μάταια καὶ ἀφροσύνην — «пророки твои видели тебе пустое и безумие» (μάταιος — むなしい; ἀφροσύνη — 愚か). οὐκ ἀπεκάλυψαν ἐπὶ τὴν ἀδικίαν σου τοῦ ἐπιστρέψαι αἰχμαλωσίαν σου — «не открыли о беззаконии твоём, чтобы возвратить плен твой» (ἀποκαλύπτω — открывать). εἴδοσάν σοι λήμματα μάταια καὶ ἐξώσματα — «видели тебе пустые принятия (пророчества) и изгнания» (λῆμμα — в Иеремии «бремя, слово Господне» → 重荷; здесь по смыслу 託宣; ἐξώσματα — изгнания, 追い出し). Акростих: Нун."
  15: "Ἐκρότησαν ἐπὶ σὲ χεῖρας πάντες οἱ παραπορευόμενοι ὁδόν — «всплеснули о тебе руками все проходящие путём» (κροτέω). ἐσύρισαν καὶ ἐκίνησαν τὴν κεφαλὴν αὐτῶν — «свистнули и покачали головою». Ἦ αὕτη ἡ πόλις, ἣν ἐροῦσιν Στέφανος δόξης, εὐφροσύνη πάσης τῆς γῆς — «это ли город, который назовут венцом славы, радостью всей земли» (στέφανος — 冠; слав. «венец славы»): слова проходящих — 「…」. Акростих: Самех."
  16: "Διήνοιξαν ἐπὶ σὲ στόμα αὐτῶν — «разинули на тебя уста свои» (διανοίγω). ἔβρυξαν ὀδόντας — «скрежетали зубами» (βρύχω). Κατεπίομεν αὐτήν — «поглотили мы её» (καταπίνω — 呑み込む). πλὴν αὕτη ἡ ἡμέρα, ἣν προσεδοκῶμεν, εὕρομεν αὐτήν, εἴδομεν — «вот этот день, которого мы ждали: нашли его, увидели». Слова врагов — 「…」. Акростих: Аин."
  17: "Ἐποίησεν κύριος ἃ ἐνεθυμήθη — «сделал Господь, что замыслил» (ἐνθυμέομαι). συνετέλεσεν ῥήματα αὐτοῦ, ἃ ἐνετείλατο ἐξ ἡμερῶν ἀρχαίων — «исполнил слова Свои, которые заповедал от дней древних». καθεῖλεν καὶ οὐκ ἐφείσατο — «низложил и не пощадил». ηὔφρανεν ἐπὶ σὲ ἐχθρόν — «возвеселил о тебе врага». ὕψωσεν κέρας θλίβοντός σε — «вознёс рог теснящего тебя». Акростих: Фи."
  18: "Ἐβόησεν καρδία αὐτῶν πρὸς κύριον — «возопило сердце их к Господу»: вводка вне кавычек, дальше речь — 「…」 до конца главы. Τείχη Σιων, καταγάγετε ὡς χειμάρρους δάκρυα ἡμέρας καὶ νυκτός — «стены Сиона, лейте, как потоки, слёзы день и ночь» (χείμαρρος — 川, поток). μὴ δῷς ἔκνηψιν σεαυτῇ — «не давай себе покоя (отрезвления)» (ἔκνηψις — пробуждение, покой; слав. «не даждь покоя себе»). μὴ σιωπήσαιτο, θύγατερ, ὁ ὀφθαλμός σου — «да не умолкнет, дщерь, око твоё». Акростих: Цади."
  19: "Ἀνάστα ἀγαλλίασαι ἐν νυκτὶ εἰς ἀρχὰς φυλακῆς σου — «встань, взывай в ночи, в начале стражи твоей» (ἀγαλλιάομαι — ликовать, взывать; φυλακή — стража). ἔκχεον ὡς ὕδωρ καρδίαν σου ἀπέναντι προσώπου κυρίου — «изливай, как воду, сердце твоё пред лицом Господа». ἆρον πρὸς αὐτὸν χεῖράς σου περὶ ψυχῆς νηπίων σου — «воздвигни к Нему руки твои о душе младенцев твоих». τῶν ἐκλυομένων λιμῷ ἐπ᾿ ἀρχῆς πασῶν ἐξόδων — «изнемогающих от голода в начале всех исходов (улиц)»: 街角の始め, как в 4:1. Акростих: Коф."
  20: "Ἰδὲ κύριε καὶ ἐπίβλεψον τίνι ἐπεφύλλισας οὕτως — «воззри, Господи, и призри: кому Ты сделал так» (ἐπιφυλλίζω — обирать, 摘み尽くす, как в 1:22). εἰ φάγονται γυναῖκες καρπὸν κοιλίας αὐτῶν — «будут ли жёны есть плод чрева своего». ἐπιφυλλίδα ἐποίησεν μάγειρος — «повар сделал обирание» (μάγειρος — повар): LXX понял евр. טִפֻּחִים («носимые на руках младенцы») как «повара», странность сохранена (料理人). φονευθήσονται νήπια θηλάζοντα μαστούς — «будут ли убиваемы младенцы, сосущие грудь». ἀποκτενεῖς ἐν ἁγιάσματι κυρίου ἱερέα καὶ προφήτην — «убьёшь ли во святилище Господнем священника и пророка». Акростих: Реш."
  21: "Ἐκοιμήθησαν εἰς τὴν ἔξοδον παιδάριον καὶ πρεσβύτης — «уснули на улице отрок и старец» (ἔξοδος — улица, выход). ἐν ῥομφαίᾳ καὶ ἐν λιμῷ ἀπέκτεινας — «мечом и голодом Ты убивал». ἐν ἡμέρᾳ ὀργῆς σου ἐμαγείρευσας — «в день гнева Твоего Ты варил (стряпал)» (μαγειρεύω — готовить, варить): образ тот же, что в 2:20 (μάγειρος), 4:10 (ἥψησαν). οὐκ ἐφείσω — «не пощадил». Акростих: Шин."
  22: "Ἐκάλεσεν ἡμέραν ἑορτῆς παροικίας μου κυκλόθεν — «созвал, как день праздника, странствования мои отовсюду» (παροικία — 寄留; слав. «призвал еси яко день праздника пришелствия моя окрест»): тёмное место, передано わたしの寄留の者たちを呼び寄せられた. οὐκ ἐγένοντο ἐν ἡμέρᾳ ὀργῆς κυρίου ἀνασῳζόμενος καὶ καταλελειμμένος — «не оказалось в день гнева Господня ни спасаемого, ни оставленного» (ἀνασῴζω, καταλείπω). ὡς ἐπεκράτησα καὶ ἐπλήθυνα ἐχθρούς μου πάντας — «как я одолела и умножила всех врагов моих» (ἐπικρατέω): тёмное место, держим LXX/csl; в ru по МТ «тех, которых я вскормила и вырастила, враг мой истребил». Речь города закрывается. Акростих: Фав."
