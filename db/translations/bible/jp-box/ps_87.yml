verses:
  0: "歌[うた]、コラの子[こ]らの詩[うた]。指揮者[しきしゃ]に。マハラトについて、応答[おうとう]のために。イスラエル人[じん]エマンの教[おし]え。"
  1: "主[しゅ]よ、わたしの救[すく]いの神[かみ]よ。わたしは昼[ひる]も、夜[よる]も、あなたの前[まえ]に呼[よ]び求[もと]めた。"
  2: "わたしの祈[いの]りがあなたの前[まえ]に届[とど]きますように。主[しゅ]よ、わたしの願[ねが]いに耳[みみ]を傾[かたむ]けてください。"
  3: "わたしの魂[たましい]は災[わざわ]いで満[み]ち、わたしの命[いのち]は陰府[よみ]に近[ちか]づいたからである。"
  4: "わたしは穴[あな]に下[くだ]る者[もの]たちの中[なか]に数[かぞ]えられ、助[たす]けのない者[もの]となり、死[し]んだ者[もの]たちの間[あいだ]で解[と]き放[はな]たれた。"
  5: "わたしは、墓[はか]に眠[ねむ]る、傷[きず]ついて投[な]げ捨[す]てられた者[もの]のようになった。あなたはもう彼[かれ]らを思[おも]い出[だ]さず、彼[かれ]らはあなたの手[て]から退[しりぞ]けられた。"
  6: "あなたはわたしを最[もっと]も深[ふか]い穴[あな]に、暗[くら]いところに、死[し]の陰[かげ]に置[お]かれた。"
  7: "あなたの憤[いきどお]りはわたしの上[うえ]に重[おも]くのしかかり、あなたの波[なみ]をことごとくわたしの上[うえ]に引[ひ]き寄[よ]せられた。"
  8: "あなたはわたしの知[し]り合[あ]いをわたしから遠[とお]ざけられた。彼[かれ]らはわたしを忌[い]み嫌[きら]うものとした。わたしは引[ひ]き渡[わた]され、外[そと]へ出[で]ることもできない。"
  9: "わたしの目[め]は貧[まず]しさによって衰[おとろ]えた。主[しゅ]よ、わたしは一日中[いちにちじゅう]あなたに呼[よ]び、あなたに向[む]かって手[て]を広[ひろ]げた。"
  10: "あなたは死[し]んだ者[もの]たちに驚[おどろ]くべきわざを行[おこな]われるだろうか。医師[いし]たちが彼[かれ]らを生[い]き返[かえ]らせ、あなたに感謝[かんしゃ]するだろうか。"
  11: "墓[はか]の中[なか]で、滅[ほろ]びの場[ば]所[しょ]で、だれかがあなたのあわれみと真[しん]実[じつ]を語[かた]るだろうか。"
  12: "闇[やみ]の中[なか]で、忘[わす]れられた地[ち]で、あなたの驚[おどろ]くべきわざと義[ぎ]が知[し]られるだろうか。"
  13: "しかし、主[しゅ]よ、わたしはあなたに呼[よ]び求[もと]め、朝[あさ]早[はや]くから、わたしの祈[いの]りはあなたの前[まえ]に進[すす]む。"
  14: "主[しゅ]よ、なぜ、わたしの魂[たましい]を退[しりぞ]け、わたしから御顔[みかお]を背[そむ]けられるのか。"
  15: "わたしは貧[まず]しく、若[わか]い時[とき]から労苦[ろうく]のうちにあった。わたしは高[たか]く上[あ]げられては、低[ひく]くされ、途方[とほう]に暮[く]れた。"
  16: "あなたの怒[いか]りはわたしの上[うえ]を通[とお]り過[す]ぎ、あなたの脅[おど]しはわたしをかき乱[みだ]した。"
  17: "それらは一日中[いちにちじゅう]、水[みず]のようにわたしを囲[かこ]み、共[とも]にわたしを取[と]り巻[ま]いた。"
  18: "あなたはわたしから友[とも]と隣[となり]の人[ひと]を遠[とお]ざけ、わたしの知[し]り合[あ]いも苦[くる]しみのゆえに遠[とお]ざかった。"

notes:
  0: "Ὠιδὴ ψαλμοῦ τοῖς υἱοῖς Κορε — 歌、コラの子らの詩 (ᾠδή — 歌; ψαλμός — 詩). εἰς τὸ τέλος, ὑπὲρ μαελεθ τοῦ ἀποκριθῆναι — 指揮者に。マハラトについて、応答のために (μαελεθ — музыкальный термин, евр. махалаф; τοῦ ἀποκριθῆναι — «чтобы отвечать», т. е. для пения с ответом/антифонно, слав. «еже отвещати»). συνέσεως Αιμαν τῷ Ισραηλίτῃ — イスラエル人エマンの教え (σύνεσις — 教え, разумение, как в Пс 77:1; Αιμαν — Еман, 1 Пар 25; Ισραηλίτης — イスラエル人, у Синодального «Езрахита» по евр.). Надписание — стих 0."
  1: "Κύριε ὁ θεὸς τῆς σωτηρίας μου — 主よ、わたしの救いの神よ (σωτηρία — 救い). ἡμέρας ἐκέκραξα καὶ ἐν νυκτὶ ἐναντίον σου — 昼も夜も、あなたの前に呼び求めた (κράζω — «взывать»; ἐνώπιον — «пред лицом»)."
  2: "εἰσελθάτω ἐνώπιόν σου ἡ προσευχή μου — わたしの祈りがあなたの前に届きますように (εἰσέρχομαι — «входить»). κλῖνον τὸ οὖς σου εἰς τὴν δέησίν μου — わたしの願いに耳を傾けてください (κλίνω — «наклонять»; δέησις — «моление»)."
  3: "ὅτι ἐπλήσθη κακῶν ἡ ψυχή μου — わたしの魂は災いで満ち (πίμπλημι — «наполнять»; κακά — «бедствия»). ἡ ζωή μου τῷ ᾅδῃ ἤγγισεν — わたしの命は陰府に近づいた (ᾅδης — 陰府; ἐγγίζω — «приближаться»)."
  4: "προσελογίσθην μετὰ τῶν καταβαινόντων εἰς λάκκον — わたしは穴に下る者たちの中に数えられ (προσλογίζομαι — «причисляться»; λάκκος — «ров, яма»). ἐγενήθην ὡς ἄνθρωπος ἀβοήθητος — 助けのない者となり (ἀβοήθητος — «беспомощный»). ἐν νεκροῖς ἐλεύθερος — 死んだ者たちの間で解き放たれた (ἐλεύθερος — «свободный», т. е. отпущенный из жизни; слав. «в мертвых свободь»; перенесено буквально, хотя образ тёмен)."
  5: "ὡσεὶ τραυματίαι ἐρριμμένοι καθεύδοντες ἐν τάφῳ — 墓に眠る、傷ついて投げ捨てられた者のようになった (τραυματίας — «раненый»; ῥίπτω — «бросать»; τάφος — 墓). ὧν οὐκ ἐμνήσθης ἔτι — あなたはもう彼らを思い出さず (μνησθῇ — «вспомянуть»). ἐκ τῆς χειρός σου ἀπώσθησαν — 彼らはあなたの手から退けられた (ἀπωθέω — «отталкивать»; переход от ед. ч. к мн. ч. сохранён, как в греч.)."
  6: "ἔθεντό με ἐν λάκκῳ κατωτάτῳ — あなたはわたしを最も深い穴に置かれた (κατώτατος — «нижайший, преисподний»). ἐν σκοτεινοῖς καὶ ἐν σκιᾷ θανάτου — 暗いところに、死の陰に (σκοτεινός — «тёмный»; σκιά θανάτου — «сень смертная»)."
  7: "ἐπ᾽ ἐμὲ ἐπεστηρίχθη ὁ θυμός σου — あなたの憤りはわたしの上に重くのしかかり (ἐπιστηρίζω — «отягощать, утверждать на»). πάντας τοὺς μετεωρισμούς σου ἐπ᾽ ἐμὲ ἐπήγαγες — あなたの波をことごとくわたしの上に引き寄せられた (μετεωρισμός — «волнение, вал»; ἐπάγω — «наводить»). διάψαλμα не передаётся."
  8: "ἐμάκρυνας τοὺς γνωστούς μου ἀπ᾽ ἐμοῦ — わたしの知り合いをわたしから遠ざけられた (μακρύνω — «удалять»; γνωστός — «знакомый»). ἔθεντό με βδέλυγμα ἑαυτοῖς — 彼らはわたしを忌み嫌うものとした (βδέλυγμα — «мерзость»). παρεδόθην καὶ οὐκ ἐξεπορευόμην — わたしは引き渡され、外へ出ることもできない (παραδίδωμι — «предавать, заключать»)."
  9: "οἱ ὀφθαλμοί μου ἠσθέννησαν ἀπὸ πτωχείας — わたしの目は貧しさによって衰えた (ἀσθενέω — «изнемогать»; πτωχεία — «нищета, бедствие»). ἐκέκραξα πρὸς σέ, κύριε, ὅλην τὴν ἡμέραν — 主よ、わたしは一日中あなたに呼び. διεπέτασα πρὸς σὲ τὰς χεῖράς μου — あなたに向かって手を広げた (διαπετάννυμι — «простирать»)."
  10: "Μὴ τοῖς νεκροῖς ποιήσεις θαυμάσια; — あなたは死んだ者たちに驚くべきわざを行われるだろうか (θαυμάσιον — «чудо»; μή в вопросе ожидает отрицания). ἢ ἰατροὶ ἀναστήσουσιν, καὶ ἐξομολογήσονταί σοι; — 医師たちが彼らを生き返らせ、あなたに感謝するだろうか (ἀνίστημι — «воскрешать»; ἐξομολογέομαι — «славить, благодарить»)."
  11: "μὴ διηγήσεταί τις ἐν τάφῳ τὸ ἔλεός σου — 墓の中で、だれかがあなたのあわれみを語るだろうか (διηγέομαι — «возвещать»). τὴν ἀλήθειάν σου ἐν τῇ ἀπωλείᾳ — 滅びの場所で、あなたの真実を (ἀπώλεια — «погибель»)."
  12: "μὴ γνωσθήσεται ἐν τῷ σκότει τὰ θαυμάσιά σου — 闇の中で、あなたの驚くべきわざが知られるだろうか (γινώσκω — «знать»). ἡ δικαιοσύνη σου ἐν γῇ ἐπιλελησμένῃ — 忘れられた地で、あなたの義が (ἐπιλανθάνομαι — «забывать»)."
  13: "κἀγὼ πρὸς σέ, κύριε, ἐκέκραξα — しかし、主よ、わたしはあなたに呼び求め (κραυγάζω — «взывать»). τὸ πρωῒ ἡ προσευχή μου προφθάσει σε — 朝早くから、わたしの祈りはあなたの前に進む (πρωΐ — «утром рано»; προφθάνω — «предварять»)."
  14: "ἵνα τί, κύριε, ἀπωθεῖς τὴν ψυχήν μου — 主よ、なぜ、わたしの魂を退け (ἀπωθέω — «отталкивать, отвергать»). ἀποστρέφεις τὸ πρόσωπόν σου ἀπ᾽ ἐμοῦ — わたしから御顔を背けられるのか (ἀποστρέφω — «отвращать»)."
  15: "πτωχός εἰμι ἐγὼ καὶ ἐν κόποις ἐκ νεότητός μου — わたしは貧しく、若い時から労苦のうちにあった (κόπος — «труд, страдание»; νεότης — «юность»). ὑψωθεὶς δὲ ἐταπεινώθην καὶ ἐξηπορήθην — 高く上げられては、低くされ、途方に暮れた (ὑψόω / ταπεινόω — «возвышать / смирять»; ἐξαπορέομαι — «быть в недоумении, изнемочь»)."
  16: "ἐπ᾽ ἐμὲ διῆλθον αἱ ὀργαί σου — あなたの怒りはわたしの上を通り過ぎ (διέρχομαι — «проходить»). οἱ φοβερισμοί σου ἐξετάραξάν με — あなたの脅しはわたしをかき乱した (φοβερισμός — «устрашение»; ἐκταράσσω — «потрясать»)."
  17: "ἐκύκλωσάν με ὡς ὕδωρ ὅλην τὴν ἡμέραν — それらは一日中、水のようにわたしを囲み (κυκλόω — «окружать»). περιέσχον με ἅμα — 共にわたしを取り巻いた (περιέχω — «объемлить»; ἅμα — «вместе»)."
  18: "ἐμάκρυνας ἀπ᾽ ἐμοῦ φίλον καὶ πλησίον — あなたはわたしから友と隣の人を遠ざけ (φίλος — 友; πλησίον — «ближний»). τοὺς γνωστούς μου ἀπὸ ταλαιπωρίας — わたしの知り合いも苦しみのゆえに遠ざかった (ταλαιπωρία — «бедствие»; греч. оборот тёмен, передано по смыслу; слав. «знаемых моих от страсти»)."
