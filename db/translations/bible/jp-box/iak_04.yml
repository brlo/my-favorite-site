# jp-box, Соборное послание Иакова, глава 4. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 4: источник войн и ссор — похоти (1–3), дружба с миром — вражда с Богом (4),
# трудное место о духе и зависти (5), благодать смиренным (6), покорность Богу (7–10),
# не злословь брата (11–12), «если Господь позволит» (13–17).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет.
# Цитаты Писания в 「…」: 4:5 (слова, приписанные Писанию; в Ветхом Завете не найдены —
# см. 4:5 в notes), 4:6 (Притч 3:34).
# 〔…〕 в главе нет: все слова 4:5 в базе gr-lxx-byz есть (проверено по базе:
# κατῴκισεν, ἐπιποθεῖ, φθόνον на месте), поэтому стих не оборачивается.
# Сносок ⟨…⟩ нет: 悪魔, 高慢, 妬み уже встречались в корпусе. jp-ni не использовался.

tr_code: jp-box
book: iak
chapter: 4
draft: true

verses:
  1: "あなたがたの間[あいだ]の戦[たたか]いや争[あらそ]いは、どこから来[く]るのか。あなたがたの器官[きかん]のうちで戦[たたか]っている欲[よく]からではないか。"
  2: "あなたがたはむさぼっても、持[も]つことができない。人[ひと]を殺[ころ]し、妬[ねた]んでも、手[て]に入[い]れることができない。争[あらそ]い、戦[たたか]っても、持[も]つことができない。それは、あなたがたが求[もと]めないからである。"
  3: "求[もと]めても受[う]け取[と]れないのは、あなたがたが、自分[じぶん]の欲[よく]のために費[つか]い果[は]たそうとして、悪[わる]い求[もと]め方[かた]をするからである。"
  4: "姦淫[かんいん]の女[おんな]たちよ、世[よ]の友[とも]となることが神[かみ]への敵意[てきい]であることを、あなたがたは知[し]らないのか。だから、だれでも世[よ]の友[とも]になろうとする者[もの]は、神[かみ]の敵[てき]となるのである。"
  5: "それとも、聖書[せいしょ]がむなしく語[かた]っていると、あなたがたは思[おも]うのか。「わたしたちのうちに住[す]まわせた霊[れい]は、妬[ねた]むまでに慕[した]い求[もと]めるのか」と。"
  6: "しかし、さらに大[おお]きな恵[めぐ]みを与[あた]えてくださる。だから、こう言[い]われている。「神[かみ]は高慢[こうまん]な者[もの]に敵[てき]し、謙遜[けんそん]な者[もの]に恵[めぐ]みを与[あた]える」と。"
  7: "だから、神[かみ]に服[ふく]しなさい。悪魔[あくま]に立[た]ち向[む]かいなさい。そうすれば、悪魔[あくま]はあなたがたから逃[に]げ去[さ]る。"
  8: "神[かみ]に近[ちか]づきなさい。そうすれば、神[かみ]があなたがたに近[ちか]づいてくださる。罪人[ざいにん]たちよ、手[て]を清[きよ]めなさい。心[こころ]が二[ふた]つに分[わ]かれた者[もの]たちよ、心[こころ]を清[きよ]めなさい。"
  9: "苦[くる]しみ、悲[かな]しみ、泣[な]きなさい。あなたがたの笑[わら]いが悲[かな]しみに、喜[よろこ]びが憂[うれ]いに変[か]わるようにしなさい。"
  10: "主[しゅ]の前[まえ]にへりくだりなさい。そうすれば、主[しゅ]はあなたがたを高[たか]くしてくださる。"
  11: "兄弟[きょうだい]たちよ、互[たがい]に悪口[わるくち]を言[い]ってはならない。兄弟[きょうだい]の悪口[わるくち]を言[い]い、兄弟[きょうだい]を裁[さば]く者[もの]は、律法[りっぽう]の悪口[わるくち]を言[い]い、律法[りっぽう]を裁[さば]いているのである。あなたが律法[りっぽう]を裁[さば]くなら、あなたは律法[りっぽう]を行[おこな]う者[もの]ではなく、裁[さば]く者[もの]である。"
  12: "立法者[りっぽうしゃ]であり審判者[しんぱんしゃ]である方[かた]は、ただ一[ひと]りであり、救[すく]うことも滅[ほろ]ぼすこともできる。あなたは、隣人[となりびと]を裁[さば]く者[もの]でありながら、いったい何者[なにもの]なのか。"
  13: "さあ、今[いま]、「今日[きょう]か明日[あす]、わたしたちはあの町[まち]へ行[い]って一年[いちねん]そこに滞在[たいざい]し、商売[しょうばい]をして利[り]を得[え]よう」と言[い]う者[もの]たちよ。"
  14: "あなたがたは、明日[あす]の自分[じぶん]の命[いのち]がどんなものかを知[し]らない。あなたがたは、しばらく現[あらわ]れて、やがて消[き]えていく霧[きり]である。"
  15: "むしろ、あなたがたはこう言[い]うべきである。「主[しゅ]がお望[のぞ]みになるなら、わたしたちは生[い]きて、これか、あれをしよう」と。"
  16: "ところが、あなたがたは自分[じぶん]の高[たか]ぶりを誇[ほこ]っている。そのような誇[ほこ]りはすべて悪[あく]である。"
  17: "だから、善[ぜん]を行[おこな]うことを知[し]りながら、それを行[おこな]わない者[もの]には、罪[つみ]がある。"

notes:
  1: "Πόθεν πόλεμοι καὶ πόθεν μάχαι ἐν ὑμῖν — 戦いや争いは、どこから来るのか (πόλεμος — война; μάχη — сражение, распря). ἐκ τῶν ἡδονῶν ὑμῶν — 欲から (ἡδονή — наслаждение, похоть). τῶν στρατευομένων ἐν τοῖς μέλεσιν ὑμῶν — 器官のうちで戦っている (στρατεύομαι — воевать, ср. 1 Пет 2:11)."
  2: "ἐπιθυμεῖτε, καὶ οὐκ ἔχετε — むさぼっても、持つことができない. φονεύετε καὶ ζηλοῦτε — 人を殺し、妬んでも: в базе φονεύετε, не сглажено в «ненавидите». μάχεσθε καὶ πολεμεῖτε — 争い、戦っても. οὐκ ἔχετε διὰ τὸ μὴ αἰτεῖσθαι ὑμᾶς — あなたがたが求めないから."
  3: "αἰτεῖτε καὶ οὐ λαμβάνετε — 求めても受け取れない. κακῶς αἰτεῖσθε — 悪い求め方をする (κακῶς — плохо, во зло). ἵνα ἐν ταῖς ἡδοναῖς ὑμῶν δαπανήσητε — 自分の欲のために費い果たそうとして (δαπανάω — тратить, расточать)."
  4: "μοιχαλίδες — 姦淫の女たちよ (женский род мн. ч.; не сглажено в «прелюбодеи»). ἡ φιλία τοῦ κόσμου ἔχθρα τοῦ θεοῦ ἐστιν — 世の友となることは神への敵意 (φιλία — дружба; ἔχθρα — вражда). ἐχθρὸς τοῦ θεοῦ καθίσταται — 神の敵となる (καθίσταμαι — становиться)."
  5: "ἢ δοκεῖτε ὅτι κενῶς ἡ γραφὴ λέγει — それとも、聖書がむなしく語っていると思うのか (κενῶς — тщетно, попусту). Πρὸς φθόνον ἐπιποθεῖ τὸ πνεῦμα ὃ κατῴκισεν ἐν ἡμῖν — 「わたしたちのうちに住まわせた霊は、妬むまでに慕い求めるのか」. Трудное место: подлежащее τὸ πνεῦμα, πρὸς φθόνον — «до зависти, ревниво»; возможно и понимание «Бог ревниво желает духа, который вселил в нас» (так у Синодального), и «дух, вселённый в нас, влечётся к зависти». Оставлено чтение с духом-подлежащим, πρὸς φθόνον передаёт силу стремления; двусмысленность не разрешена, вопрос сохранён. Слова в базе есть — 〔〕 не ставятся."
  6: "μεῖζονα δὲ δίδωσιν χάριν — さらに大きな恵みを与えてくださる (подлежащее подразумевается — Бог; по-японски опущено, без добавления 神). Цитата Притч 3:34: Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται, ταπεινοῖς δὲ δίδωσιν χάριν — 「神は高慢な者に敵し、謙遜な者に恵みを与える」 (в LXX κύριος, в базе ὁ θεός — переведено по базе)."
  7: "ὑποτάγητε οὖν τῷ θεῷ — 神に服しなさい (ὑποτάσσω — подчинять). ἀντίστητε δὲ τῷ διαβόλῳ — 悪魔に立ち向かいなさい (ἀνθίστημι — противостоять, ср. 1 Пет 5:9). φεύξεται ἀφ' ὑμῶν — 逃げ去る."
  8: "ἐγγίσατε τῷ θεῷ, καὶ ἐγγιεῖ ὑμῖν — 神に近づきなさい。そうすれば、神が近づいてくださる (ἐγγίζω — приближаться). καθαρίσατε χεῖρας, ἁμαρτωλοί — 罪人たちよ、手を清めなさい. ἁγνίσατε καρδίας, δίψυχοι — 心を清めなさい、心が二つに分かれた者たちよ (δίψυχος, ср. 1:8 — тот же перевод)."
  9: "ταλαιπωρήσατε καὶ πενθήσατε καὶ κλαύσατε — 苦しみ、悲しみ、泣きなさい (ταλαιπωρέω — бедствовать; πενθέω — скорбеть). ὁ γέλως ὑμῶν εἰς πένθος μετατραπήτω — 笑いが悲しみに変わるようにしなさい (μετατρέπω — превращать). ἡ χαρὰ εἰς κατήφειαν — 喜びが憂いに (κατήφεια — уныние, помрачение)."
  10: "ταπεινώθητε ἐνώπιον κυρίου — 主の前にへりくだりなさい (без артикля, как в базе). ὑψώσει ὑμᾶς — 高くしてくださる (ὑψόω — возвышать, ср. 1:9 ὕψος)."
  11: "Μὴ καταλαλεῖτε ἀλλήλων — 互いに悪口を言ってはならない (καταλαλέω — злословить, клеветать). ὁ καταλαλῶν ἀδελφοῦ ἢ κρίνων τὸν ἀδελφὸν αὐτοῦ — 兄弟の悪口を言い、兄弟を裁く者. καταλαλεῖ νόμου καὶ κρίνει νόμον — 律法の悪口を言い、律法を裁く (повтор сохранён). οὐκ εἶ ποιητὴς νόμου ἀλλὰ κριτής — 律法を行う者ではなく、裁く者."
  12: "εἷς ἐστιν νομοθέτης καὶ κριτής — 立法者であり審判者である方はただ一人 (νομοθέτης — законодатель). ὁ δυνάμενος σῶσαι καὶ ἀπολέσαι — 救うことも滅ぼすこともできる. σὺ δὲ τίς εἶ, ὁ κρίνων τὸν πλησίον — あなたは、隣人を裁く者でありながら、いったい何者なのか."
  13: "Ἄγε νῦν — さあ、今 (ἄγε — побудительная частица). οἱ λέγοντες — 言う者たちよ. Σήμερον ἢ αὔριον πορευσόμεθα… — 「今日か明日、…行って…利を得よう」 (речь людей — 「」). ἐμπορευσόμεθα καὶ κερδήσομεν — 商売をして利を得る (ἐμπορεύομαι — торговать; κερδαίνω — получать прибыль)."
  14: "οἵτινες οὐκ ἐπίστασθε τῆς αὔριον ποία ἡ ζωὴ ὑμῶν — 明日の自分の命がどんなものかを知らない (ἐπίσταμαι — знать). ἀτμὶς γάρ ἐστε — あなたがたは霧である (ἀτμίς — пар, дымка). πρὸς ὀλίγον φαινομένη, ἔπειτα καὶ ἀφανιζομένη — しばらく現れて、やがて消えていく (ἀφανίζω — исчезать)."
  15: "ἀντὶ τοῦ λέγειν ὑμᾶς — むしろ、あなたがたはこう言うべきである (ἀντί — вместо). Ἐὰν ὁ κύριος θέλῃ, καὶ ζήσομεν καὶ ποιήσομεν — 「主がお望みになるなら、わたしたちは生きて…しよう」 (условие ἐάν с сослагательным; порядок членов сохранён)."
  16: "νῦν δὲ καυχᾶσθε ἐν ταῖς ἀλαζονείαις ὑμῶν — ところが、自分の高ぶりを誇っている (ἀλαζονεία — бахвальство, кичливость). πᾶσα καύχησις τοιαύτη πονηρά ἐστιν — そのような誇りはすべて悪である."
  17: "εἰδότι οὖν καλὸν ποιεῖν καὶ μὴ ποιοῦντι — 善を行うことを知りながら、それを行わない者には (дат. причастия). ἁμαρτία αὐτῷ ἐστιν — 罪がある."
