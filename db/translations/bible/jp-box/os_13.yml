chapter: 13
draft: true

verses:
  1: "「エフライムの言葉[ことば]によって、彼はイスラエルで正[ただ]しい定[さだ]めを受[う]け、それをバアルにささげて死[し]んだ。"
  2: "彼らはさらに罪[つみ]を重[かさ]ね、自分[じぶん]の銀[ぎん]で鋳物[いもの]の像[ぞう]を、偶像[ぐうぞう]の形[かたち]に造[つく]った。それは職人[しょくにん]の手[て]の業[わざ]である。彼らは言[い]う。『人[ひと]をいけにえにせよ。子牛[こうし]が尽[つ]きたから』と。"
  3: "それゆえ、彼らは朝[あさ]の雲[くも]、朝[あさ]早[はや]く消[き]える露[つゆ]、打[う]ち場[ば]から吹[ふ]き飛[と]ばされるもみがら、蝗[いなご]から立[た]つ煙[けむり]のようになる。"
  4: "わたしはあなたの神[かみ]である主[しゅ]、天[てん]を固[かた]め、地[ち]を造[つく]り、その手[て]で天[てん]のもろもろの軍[ぐん]を造[つく]られた者[もの]である。わたしはそれらをあなたに示[しめ]して、その後[あと]を歩[あゆ]ませなかった。わたしはあなたをエジプトの地[ち]から上[のぼ]らせた。あなたはわたしのほかに神[かみ]を知[し]ってはならない。わたしのほかに救[すく]う者[もの]はいない。"
  5: "わたしは荒野[こうや]で、人[ひと]の住[す]まない地[ち]であなたを飼[か]った。"
  6: "彼らは自分[じぶん]の牧[まき]場[ば]に従[したが]って満[み]ち足[た]り、満[み]ちるにつれて心[こころ]が高[たか]ぶくれ、それゆえわたしを忘[わす]れた。"
  7: "わたしは彼らにとって豹[ひょう]のようになり、アッシリアの道[みち]で大山猫[おおやまねこ]のようになる。"
  8: "わたしは子[こ]を失[うしな]った雌熊[めぐま]のように彼らに立[た]ち向[む]かい、その心[こころ]の閉[と]ざしを裂[さ]く。そこで獅子[しし]の子[こ]らが彼らを食[く]らい、野[の]の獣[けもの]が彼らを引[ひ]き裂[さ]く。"
  9: "イスラエルよ、あなたの滅[ほろ]びのとき、だれが助[たす]けるのか。"
  10: "あなたの王[おう]はどこにいるのか。彼があなたのすべての都[みやこ]であなたを救[すく]うがよい。あなたが『わたしに王[おう]と君[きみ]を与[あた]えよ』と言[い]ったその裁[さば]き手[て]が、あなたを裁[さば]くがよい。"
  11: "わたしは怒[いか]りをもってあなたに王[おう]を与[あた]え、激[はげ]しい怒[いか]りをもってそれを取[と]り去[さ]った。"
  12: "エフライムの不法[ふほう]は結[むす]ばれ、その罪[つみ]は隠[かく]されている。"
  13: "産[う]む女[おんな]の苦[くる]しみが彼に来[く]る。彼は知恵[ちえ]のない子[こ]である。子[こ]どもが砕[くだ]かれるとき、彼は立[た]ち耐[こた]えることができない。"
  14: "わたしは彼らをよみの手[て]から救[すく]い出[だ]し、死[し]から贖[あがな]い取[と]る。死[し]よ、おまえの訴[うった]えはどこにあるのか。よみよ、おまえの刺[とげ]はどこにあるのか。慰[なぐさ]めはわたしの目[め]から隠[かく]されている。"
  15: "彼は兄弟[きょうだい]たちの間[あいだ]を分[わ]ける。主[しゅ]は荒野[こうや]から焼[や]けつく風[かぜ]を彼の上[うえ]に送[おく]り、その脈[みゃく]を枯[か]らし、その泉[いずみ]を干[ひ]あがらせる。主[しゅ]は彼の地[ち]と、彼のすべての望[のぞ]ましい器[うつわ]を乾[かわ]かせる」。"

notes:
  1: "Κατὰ τὸν λόγον Εφραιμ δικαιώματα αὐτὸς ἔλαβεν ἐν τῷ Ισραηλ — «по слову Ефрема он принял оправдания (уставы) в Израиле» (δικαίωμα — устав, оправдание; тёмное место; слав. «по словеси ефремову оправдания прия сей во израили»; в ru «когда Ефрем говорил, все трепетали»); ἔθετο αὐτὰ τῇ Βααλ — «положил их Ваалу»; ἀπέθανεν — «и умер»."
  2: "προσέθετο τοῦ ἁμαρτάνειν ἔτι — «приложил ещё грешить»; ἐποίησαν ἑαυτοῖς χώνευμα ἐκ τοῦ ἀργυρίου αὐτῶν — «сделали себе литьё из серебра своего» (χώνευμα — литое изображение, 鋳物); κατ᾿ εἰκόνα εἰδώλων — «по образу идолов»; ἔργα τεκτόνων συντετελεσμένα — «дела художников совершенные» (τέκτων — мастер; συντελέω — завершать); Θύσατε ἀνθρώπους, μόσχοι γὰρ ἐκλελοίπασιν — «закалайте людей, ибо тельцы оскудели» (ἐκλείπω — иссякать; слав. «пожрите человеков, оскудеша бо телцы»; в ru «целуйте тельцов» — иное чтение). Слова их — 『…』."
  3: "ἔσονται ὡς νεφέλη πρωινή — «будут как облако утреннее»; ὡς δρόσος ὀρθρινὴ πορευομένη — «как роса утренняя уходящая»; ὥσπερ χνοῦς ἀποφυσώμενος ἀφ᾿ ἅλωνος — «как мякина, сдуваемая с гумна» (χνοῦς — пыль, мякина; ἀποφυσάω — сдувать); ὡς ἀτμὶς ἀπὸ ἀκρίδων — «как пар от саранчи» (ἀτμίς — пар; ἀκρίς — саранча; слав. «якоже дым из трубы» — иное)."
  4: "ἐγὼ κύριος ὁ θεός σου στερεῶν οὐρανὸν καὶ κτίζων γῆν — «Я Господь Бог твой, утверждающий небо и созидающий землю» (στερεόω, κτίζω); οὗ αἱ χεῖρες ἔκτισαν πᾶσαν τὴν στρατιὰν τοῦ οὐρανοῦ — «Которого руки создали всё воинство небесное» (στρατιά — воинство, 軍); οὐ παρέδειξά σοι αὐτὰ τοῦ πορεύεσθαι ὀπίσω αὐτῶν — «не показал тебе их, чтобы ходить вслед их»; θεὸν πλὴν ἐμοῦ οὐ γνώσῃ — «Бога кроме Меня не познаешь»; σῴζων οὐκ ἔστιν πάρεξ ἐμοῦ — «и спасающего нет кроме Меня»."
  5: "ἐποίμαινόν σε ἐν τῇ ἐρήμῳ — «Я пас тебя в пустыне» (ποιμαίνω — пасти); ἐν γῇ ἀοικήτῳ — «в земле необитаемой» (ἄοικος — без жителей)."
  6: "κατὰ τὰς νομὰς αὐτῶν — «по пастбищам их» (νομή — пастбище, 牧場); ἐνεπλήσθησαν εἰς πλησμονήν — «насытились до пресыщения» (πλησμονή — полнота); ὑψώθησαν αἱ καρδίαι αὐτῶν — «возвысились сердца их»; ἕνεκα τούτου ἐπελάθοντό μου — «из-за этого забыли Меня»."
  7: "ἔσομαι αὐτοῖς ὡς πανθήρ — «буду им как пантера (барс)» (πάνθηρ — 豹); ὡς πάρδαλις κατὰ τὴν ὁδὸν Ἀσσυρίων — «и как леопард на пути Ассирийцев» (πάρδαλις — леопард; слав. «рысь», принято 大山猫)."
  8: "ἀπαντήσομαι αὐτοῖς ὡς ἄρκος ἀπορουμένη — «выйду на них, как медведица, лишённая (детей)» (ἄρκος — медведица; ἀπορέω — быть в нужде, лишаться); διαρρήξω συγκλεισμὸν καρδίας αὐτῶν — «разорву затвор сердца их» (συγκλεισμός — заключение; слав. «соключение сердец»); καταφάγονται αὐτοὺς ἐκεῖ σκύμνοι δρυμοῦ — «съедят их там львята дубравы» (σκύμνος — львёнок; δρυμός — дубрава); θηρία ἀγροῦ διασπάσει αὐτούς — «звери полевые растерзают их» (διασπάω)."
  9: "τῇ διαφθορᾷ σου, Ισραηλ, τίς βοηθήσει — «в погибели твоей, Израиль, кто поможет?» (διαφθορά — погибель; βοηθέω — помогать)."
  10: "ποῦ ὁ βασιλεύς σου οὗτος — «где царь твой этот?»; διασωσάτω σε ἐν πάσαις ταῖς πόλεσίν σου — «пусть спасёт тебя во всех городах твоих» (διασῴζω); κρινάτω σε ὃν εἶπας — «пусть судит тебя тот, о ком ты сказал»; Δός μοι βασιλέα καὶ ἄρχοντα — «дай мне царя и князя» (слова народа — 『…』; слав. «даждь ми царя и князя»)."
  11: "ἔδωκά σοι βασιλέα ἐν ὀργῇ μου — «дал тебе царя в гневе Моём»; ἔσχον ἐν τῷ θυμῷ μου — «и взял (удержал) в ярости Моей» (ἔχω — держать; слав. «утвержахся в ярости моей»; в ru «отнял»), принято «取り去った»."
  12: "συστροφὴν ἀδικίας — «связку (узел) неправды» (συστροφή — скручивание, узел; слав. «согромаждение неправды»); ἐγκεκρυμμένη ἡ ἁμαρτία αὐτοῦ — «сокровен грех его» (ἐγκρύπτω — скрывать)."
  13: "ὠδῖνες ὡς τικτούσης ἥξουσιν αὐτῷ — «боли, как у рождающей, придут ему» (ὠδίν — родовая боль; τίκτω — рождать); ὁ υἱός σου οὐ φρόνιμος — «сын твой неразумен» (φρόνιμος — разумный, 知恵のある); οὐ μὴ ὑποστῇ ἐν συντριβῇ τέκνων — «не устоит в сокрушении детей» (ὑφίστημι — выдерживать; συντριβή — сокрушение)."
  14: "ἐκ χειρὸς ᾅδου ῥύσομαι αὐτούς — «из руки ада избавлю их» (ᾅδης — ад, よみ; ῥύομαι — избавлять); ἐκ θανάτου λυτρώσομαι αὐτούς — «от смерти искуплю их» (λυτρόω); ποῦ ἡ δίκη σου, θάνατε — «где распря (приговор) твоя, смерть?» (δίκη — суд, тяжба; слав. «пря»); ποῦ τὸ κέντρον σου, ᾅδη — «где жало твоё, ад?» (κέντρον — жало, 刺; ср. 1 Кор 15:55); παράκλησις κέκρυπται ἀπὸ ὀφθαλμῶν μου — «утешение сокрыто от очей Моих» (παράκλησις — утешение; слав. «утешение скрыся от очию моею»; в ru «раскаяния не будет»)."
  15: "οὗτος ἀνὰ μέσον ἀδελφῶν διαστελεῖ — «он между братьями разделит (отделит)» (διαστέλλω — разделять; слав. «разлучит»); ἐπάξει ἄνεμον καύσωνα κύριος ἐκ τῆς ἐρήμου ἐπ᾿ αὐτόν — «наведёт Господь ветер знойный из пустыни на него» (ἐπάγω); ἀναξηρανεῖ τὰς φλέβας αὐτοῦ — «иссушит жилы его» (φλέψ — жила, 脈); ἐξερημώσει τὰς πηγὰς αὐτοῦ — «опустошит источники его» (πηγή — 泉); καταξηρανεῖ τὴν γῆν αὐτοῦ — «иссушит землю его»; πάντα τὰ σκεύη τὰ ἐπιθυμητὰ αὐτοῦ — «все сосуды вожделенные его» (σκεῦος — сосуд, 器)."
