# jp-box, Осия, глава 13. Черновик для приёмки.
#
# Нумерация — по славяно-синодальной (решение автора): главы 1–2 и 11–12
# переразбиты относительно гр. модуля (слав. 1:10–11 = прежние 2:1–2;
# слав. 11:12 = прежний 12:1). Текст — с Септуагинты, слав. контроль.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# --- прежние заметки (нумерация по гр.) ---
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по gr-lxx-byz (= jp-ni); в этой главе совпадает со славяно-синодальной.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: 1 слово Ефрема, уставы и Ваал, смерть; 2 литые идолы, «закалайте людей»;
# 3 утренний облак, роса, мякина, дым; 4 «Я Господь Бог твой», воинство небесное,
# нет спасителя кроме Меня; 5–6 пастырь в пустыне, пресыщение и забвение; 7–8 пантера,
# леопард, медведица, львята; 9–11 «кто поможет?», царь и князья, царь в гневе;
# 12–13 связанное беззаконие, боли рождающей, сын неразумный; 14 «из руки ада избавлю»,
# «где жало твоё, ад?»; 15 знойный ветер, иссохшие жилы и источники.
# Голоса: 1–15 — одно слово Господа в 「…」 (в 2 слова их — 『…』; в 10 слова народа
# 『わたしに王と君を与えよ』; закрывается в 15).
# 13:1: LXX «δικαιώματα … ἔλαβεν» — «принял уставы» (тёмное место; слав. «оправдания
# прия»; в ru «все трепетали»).
# 13:2: «Θύσατε ἀνθρώπους, μόσχοι γὰρ ἐκλελοίπασιν» — «закалайте людей, ибо тельцы
# оскудели» (слав. «пожрите человеков»; в ru «целуйте тельцов» — иное чтение).
# 13:7: «πάρδαλις» — леопард; слав. «рысь», принято 大山猫.
# 13:11: «ἔσχον» — «взял (удержал)»; в ru «отнял», принято «取り去った».
#
