verses:
  1: "主[しゅ]はモーセに言[い]われた。"
  2: "「アロンとその子[こ]ら、およびイスラエルの子らすべてに語[かた]って言[い]いなさい。主[しゅ]が命[めい]じられた言葉[ことば]はこうである。"
  3: "イスラエルの家[いえ]の者[もの]、またあなたがたの間[あいだ]にいる寄留者[きりゅうしゃ]のうち、だれでも、宿営[しゅくえい]のうちで、あるいは宿営の外[そと]で、子牛[こうし]、羊[ひつじ]、山羊[やぎ]を屠[ほふ]るなら、"
  4: "すなわち、それを燔祭[はんさい]や、主[しゅ]に芳[かんば]しい香[かおり]として受[う]け入[い]れられる酬恩祭[しゅうおんさい]として献[ささ]げるために、証[あかし]の幕屋[まくや]の入口[いりぐち]に持[も]って来[こ]ないなら、また、主[しゅ]への捧[ささ]げ物[もの]として、主[しゅ]の幕屋の前[まえ]に持って来ないなら、その人[ひと]には血[ち]の罪[つみ]が負[お]わされる。その者[もの]は血を流[なが]したのであり、その魂[たましい]は民[たみ]のうちから断[た]たれる。"
  5: "これは、イスラエルの子[こ]らが野[の]で屠[ほふ]る犠牲[ぎせい]を携[たずさ]えて来[き]て、主[しゅ]の前[まえ]、証[あかし]の幕屋[まくや]の入口[いりぐち]の祭司[さいし]のもとへ持[も]って来、主[しゅ]への酬恩祭[しゅうおんさい]として屠るためである。"
  6: "祭司[さいし]はその血[ち]を、証[あかし]の幕屋[まくや]の入口[いりぐち]にある主[しゅ]の祭壇[さいだん]に、周[まわ]りに注[そそ]ぎかけ、脂肪[しぼう]を主[しゅ]に芳[かんば]しい香[かおり]として焼[や]く。"
  7: "彼[かれ]らはもはや、自分[じぶん]たちがその後[あと]を追[お]って淫[いん]行[こう]を重[かさ]ねているむなしい者[もの]たちに、自分たちの犠牲[ぎせい]を屠[ほふ]ってはならない。これはあなたがたの代々[よよ]にわたる永遠[えいえん]の定[さだ]めである。"
  8: "また、彼[かれ]らに言[い]いなさい。イスラエルの家[いえ]の者[もの]、またあなたがたの間[あいだ]にいる寄留者[きりゅうしゃ]のうち、だれでも、燔祭[はんさい]か犠牲[ぎせい]を献[ささ]げるなら、"
  9: "すなわち、それを主[しゅ]に献[ささ]げるために証[あかし]の幕屋[まくや]の入口[いりぐち]に持[も]って来[こ]ないなら、その人[ひと]は民[たみ]のうちから断[た]たれる。"
  10: "イスラエルの家[いえ]の者[もの]、またあなたがたの間[あいだ]にいる寄留者[きりゅうしゃ]のうち、だれでも、どんな血[ち]を食[た]べるなら、わたしはその血を食べる魂[たましい]に顔[かお]を向[む]け、その魂を民[たみ]のうちから滅[ほろ]ぼす。"
  11: "すべての肉[にく]の魂[たましい]はその血[ち]だからである。わたしは、あなたがたの魂のために贖[あがな]いをするものとして、それをあなたがたに祭壇[さいだん]の上[うえ]で与[あた]えた。血は魂の代[か]わりに贖いをするからである。"
  12: "だから、わたしはイスラエルの子[こ]らに言[い]った。あなたがたのうちのどの魂[たましい]も血[ち]を食[た]べてはならない。あなたがたの間[あいだ]にいる寄留者[きりゅうしゃ]も血を食べてはならない。"
  13: "イスラエルの子[こ]らのうち、またあなたがたの間[あいだ]にいる寄留者[きりゅうしゃ]のうち、だれでも、食[た]べられる獣[けもの]や鳥[とり]を狩[か]って捕[と]らえたなら、その血[ち]を流[なが]し出[だ]して、土[つち]で覆[おお]わなければならない。"
  14: "すべての肉[にく]の魂[たましい]はその血[ち]だからである。わたしはイスラエルの子[こ]らに言[い]った。あなたがたはどんな肉の血も食[た]べてはならない。すべての肉の魂はその血だからである。それを食べる者[もの]はだれでも断[た]たれる。"
  15: "死[し]んだもの、また獣[けもの]に裂[さ]かれたものを食[た]べた魂[たましい]は、その地[ち]の生[う]まれの者[もの]でも寄留者[きりゅうしゃ]でも、衣服[いふく]を洗[あら]い、水[みず]で体[からだ]を洗わなければならない。その者は夕[ゆう]べまで汚[けが]れているが、その後[あと]は清[きよ]い。"
  16: "もし衣服[いふく]を洗[あら]わず、体[からだ]を水[みず]で洗わないなら、その者[もの]は自分[じぶん]の不法[ふほう]を負[お]う。」"

notes:
  1: "ἐλάλησεν κύριος πρὸς Μωυσῆν λέγων — 主はモーセに言われた (ср. 15:1)."
  2: "Τοῦτο τὸ ῥῆμα, ὃ ἐνετείλατο κύριος — «вот слово, которое заповедал Господь»; ῥῆμα — слово, дело; λέγων в конце не передаётся."
  3: "ἄνθρωπος ἄνθρωπος — дистрибутивный повтор: «всякий человек» (ср. 15:2); τῶν προσηλύτων τῶν προσκειμένων — «пришельцев, присоединившихся»; σφάξῃ — заколет (σφάζω); ἐν τῇ παρεμβολῇ … ἔξω τῆς παρεμβολῆς — в стане … вне стана."
  4: "μὴ ἐνέγκῃ — «не принесёт» (φέρω при условии); ὥστε ποιῆσαι εἰς ὁλοκαύτωμα ἢ σωτήριον — «чтобы совершить во всесожжение или в мирную жертву» (σωτήριον — 酬恩祭); δεκτὸν εἰς ὀσμὴν εὐωδίας — «приятное в благоухание»; λογισθήσεται … αἷμα — «вменится кровь»; ἐξέχεεν — пролил (ἐκχέω); ἐξολεθρευθήσεται — истребится (ἐξολεθρεύω)."
  5: "ὅπως ἀναφέρωσιν — «чтобы приносили» (ἀναφέρω); ἐν τοῖς πεδίοις — «в полях»; θύσουσιν θυσίαν σωτηρίου — «заколют в жертву мирную» (вин. внутреннего объекта)."
  6: "προσχεεῖ — возольёт (προσχέω, ср. 1:5); κύκλῳ — вокруг; ἀπέναντι κυρίου — пред Господом; ἀνοίσει τὸ στέαρ — вознесёт тук; εἰς ὀσμὴν εὐωδίας — в благоухание."
  7: "τοῖς ματαίοις — «суетным» (μάταιος пустой, ничтожный; об идолах); ἐκπορνεύουσιν ὀπίσω αὐτῶν — «блудно ходят вслед их» (ἐκπορνεύω); νόμιμον αἰώνιον εἰς γενεάς — вечный устав в роды."
  8: "Ἄνθρωπος ἄνθρωπος … καὶ ἀπὸ τῶν υἱῶν τῶν προσηλύτων — всякий из сынов Израиля и из сынов пришельцев; ποιήσῃ ὁλοκαύτωμα ἢ θυσίαν — совершит всесожжение или жертву."
  9: "μὴ ἐνέγκῃ ποιῆσαι αὐτὸ τῷ κυρίῳ — «не принесёт, чтобы совершить это Господу»; ἐξολεθρευθήσεται ὁ ἄνθρωπος ἐκεῖνος — истребится человек тот."
  10: "φάγῃ πᾶν αἷμα — «съест всякую кровь», т. е. какую бы то ни было; ἐπιστήσω τὸ πρόσωπόν μου — «обращу лицо Моё» (ἐφίστημι); ἀπολῶ — погублю (ἀπόλλυμι)."
  11: "ψυχὴ πάσης σαρκός — «душа всякой плоти»; δέδωκα αὐτὸ ὑμῖν ἐπὶ τοῦ θυσιαστηρίου — «дал его вам при жертвеннике»; ἐξιλάσκεσθαι περὶ τῶν ψυχῶν — «чтобы совершать очищение за души»; ἀντὶ τῆς ψυχῆς — «вместо души»."
  12: "εἴρηκα — сказал (перфект); πᾶσα ψυχὴ ἐξ ὑμῶν — «всякая душа из вас»; οὐ φάγεται αἷμα — не будет есть крови."
  13: "θηρεύσῃ θήρευμα θηρίον ἢ πετεινόν — «поймает на охоте зверя или птицу» (θηρεύω, θήρευμα); ὃ ἔσθεται — «которое едят» (о дозволенном); ἐκχεεῖ τὸ αἷμα — выльет кровь; καλύψει τῇ γῇ — покроет землёй."
  14: "εἶπα — сказал (аорист, ср. 17:12); πᾶς ὁ ἔσθων αὐτὸ ἐξολεθρευθήσεται — всякий, кто ест её, истребится."
  15: "θνησιμαῖον ἢ θηριάλωτον — мертвечина или растерзанное зверем (θηριάλωτος «пойманный зверем»); ἐν τοῖς αὐτόχθοσιν ἢ ἐν τοῖς προσηλύτοις — у туземцев или у пришельцев; καθαρὸς ἔσται — будет чист."
  16: "μὴ πλύνῃ … μὴ λούσηται — не вымоет … не омоется (сослагательное при ἐάν); λήμψεται ἀνόμημα αὐτοῦ — «примет беззаконие своё», т. е. понесёт вину."
