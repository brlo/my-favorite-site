chapter: 7
draft: true

verses:
  1: "キリアト・ヤリムの人[ひと]たちは来[き]て、主[しゅ]の契約[けいやく]の箱[はこ]を運[はこ]び上[あ]げ、丘[おか]の上[うえ]にあるアミナダブの家[いえ]に運び入[い]れた。そしてその子[こ]エレアザルを聖別[せいべつ]して、主の契約の箱を守[まも]らせた。"
  2: "箱[はこ]がキリアト・ヤリムに置[お]かれた日[ひ]から日が重[かさ]なり、二十年[にじゅうねん]になった。イスラエルの全家[ぜんか]は主[しゅ]を慕[した]って目[め]を向[む]けた。"
  3: "サムエルはイスラエルの全家[ぜんか]に言[い]った。「もしあなたがたが心[こころ]を尽[つ]くして主[しゅ]に帰[かえ]るなら、あなたがたの間[あいだ]から他[た]の神々[かみがみ]と聖[せい]なる木立[こだち]を取[と]り除[のぞ]き、心を主に向[む]けて、主だけに仕[つか]えなさい。そうすれば、主はあなたがたをペリシテ人の手[て]から救[すく]い出[だ]してくださる。」"
  4: "イスラエルの子[こ]らはバアルの神々[かみがみ]とアシュタロテの聖[せい]なる木立[こだち]を取[と]り除[のぞ]き、主[しゅ]だけに仕[つか]えた。"
  5: "サムエルは言[い]った。「すべてのイスラエルをミツパに集[あつ]めなさい。わたしはあなたがたのために主[しゅ]に祈[いの]る。」"
  6: "彼[かれ]らはミツパに集[あつ]まり、水[みず]を汲[く]んで主[しゅ]の前[まえ]に注[そそ]ぎ、その日[ひ]は断食[だんじき]して言[い]った。「わたしたちは主の前に罪[つみ]を犯[おか]した。」サムエルはミツパでイスラエルの子[こ]らを裁[さば]いた。"
  7: "ペリシテ人は、イスラエルの子[こ]らがみなミツパに集[あつ]まったことを聞[き]いて、ペリシテ人の領主[りょうしゅ]たちはイスラエルに向[む]かって上[のぼ]って来[き]た。イスラエルの子らはこれを聞いて、ペリシテ人を恐[おそ]れた。"
  8: "イスラエルの子[こ]らはサムエルに言[い]った。「わたしたちのために、あなたの神[かみ]である主[しゅ]に叫[さけ]び求[もと]めるのをやめないでほしい。主がわたしたちをペリシテ人の手[て]から救[すく]ってくださるように。」サムエルは言った。「わたしがあなたがたのために祈[いの]るのをやめて、わたしの神である主から離[はな]れることなど、わたしには決[けっ]してありえない。」"
  9: "サムエルは乳[ちち]を飲[の]む小羊[こひつじ]一[いっ]匹[ぴき]を取[と]り、民[たみ]すべてとともに、それを主[しゅ]への燔祭[はんさい]としてささげた。サムエルはイスラエルのために主に叫[さけ]び求め、主は彼[かれ]に答[こた]えられた。"
  10: "サムエルが燔祭[はんさい]をささげているとき、ペリシテ人はイスラエルに戦[たたか]いを仕[し]かけて近[ちか]づいた。しかし主[しゅ]はその日[ひ]、大[おお]きな声[こえ]をもってペリシテ人の上[うえ]に雷[かみなり]を鳴[な]らされた。彼[かれ]らは混乱[こんらん]し、イスラエルの前[まえ]で打[う]ち倒[たお]された。"
  11: "イスラエルの人[ひと]たちはミツパから出[で]てペリシテ人を追[お]いかけ、ベテ・ホルの下[した]まで彼らを打[う]った。"
  12: "サムエルは一[ひと]つの石[いし]を取[と]って、ミツパと古[ふる]い町[まち]との間[あいだ]に立[た]て、その名[な]をアベン・エゼル、すなわち「助[たす]けの石」と名づけて言[い]った。「主[しゅ]はここまでわたしたちを助けてくださった。」"
  13: "主[しゅ]はペリシテ人を低[ひく]くされた。彼[かれ]らはもはやイスラエルの境[さかい]に攻[せ]めて来[こ]なかった。主の手[て]はサムエルのすべての日[ひ]に、ペリシテ人の上[うえ]にあった。"
  14: "ペリシテ人がイスラエルの子[こ]らから取[と]った町々[まちまち]は返[かえ]され、アシュケロンからアゾブに至[いた]るまでイスラエルに返された。イスラエルの境[さかい]もペリシテ人の手[て]から解[と]き放[はな]たれた。イスラエルとアモリ人[じん]の間[あいだ]には平和[へいわ]があった。"
  15: "サムエルは生涯[しょうがい]のすべての日[ひ]、イスラエルを裁[さば]いた。"
  16: "彼[かれ]は年[とし]ごとにベテルとギルガルとミツパを巡[めぐ]り、これらすべての聖[せい]なる場所[ばしょ]でイスラエルを裁[さば]いた。"
  17: "そしてラマに帰[かえ]った。そこに彼[かれ]の家[いえ]があったからである。彼はそこでイスラエルを裁[さば]き、主[しゅ]に祭壇[さいだん]を築[きず]いた。"

notes:
  1: "ἄνδρες Καριαθιαριμ — жители Кириаф-Иарима (Καριαθιαριμ, キリアト・ヤリム; в корпусе также キルヤト・ヤリム, здесь форма по 1ts 6:21). ἀνάγουσιν — возносят, поднимают (ἀνάγω). εἰς οἶκον Αμιναδαβ τὸν ἐν τῷ βουνῷ — в дом Аминадава, что на холме (βουνός; слав. «иже на холме»). τὸν Ελεαζαρ υἱὸν αὐτοῦ ἡγίασαν — Елеазара, сына его, освятили (ἁγιάζω); φυλάσσειν — хранить (φυλάσσω)."
  2: "ἀφ᾽ ἧς ἡμέρας — с того дня, как. ἐπλήθυναν αἱ ἡμέραι — умножились дни (πληθύνω). ἐγένοντο εἴκοσι ἔτη — стало двадцать лет. ἐπέβλεψεν — воззрел (ἐπιβλέπω); ὀπίσω κυρίου — «вслед Господа», т.е. обратился к Нему, отсюда 主を慕って目を向けた."
  3: "Εἰ ἐν ὅλῃ καρδίᾳ … ἐπιστρέφετε — если всем сердцем обращаетесь (ἐπιστρέφω). περιέλετε — удалите (περιαιρέω). τοὺς θεοὺς τοὺς ἀλλοτρίους — чужих богов (ἀλλότριος). τὰ ἄλση — священные рощи, 聖なる木立 (ἄλσος; ср. Суд 6:25). ἑτοιμάσατε τὰς καρδίας — приготовьте сердца. δουλεύσατε αὐτῷ μόνῳ — служите Ему одному (δουλεύω). ἐξελεῖται — избавит (ἐξαιρέω)."
  4: "Βααλιμ — «Ваалы», мн. ч. от Βααλ (バアル). ἄλση Ασταρωθ — рощи Астарот (Ἀσταρωθ; アシュタロテ); слав. «дубравы астарофа». ἐδούλευσαν κυρίῳ μόνῳ — служили Господу одному."
  5: "Ἀθροίσατε — соберите (ἀθροίζω). εἰς Μασσηφαθ — в Массифу (Μασσηφαθ, ミツパ; ср. Суд 11:34). προσεύξομαι περὶ ὑμῶν — помолюсь о вас."
  6: "συνήχθησαν — собрались (συνάγω). ὑδρεύονται ὕδωρ — черпают воду (ὑδρεύω); ἐξέχεαν ἐνώπιον κυρίου ἐπὶ τὴν γῆν — вылили пред Господом на землю (ἐκχέω) — знак плача и исповедания. ἐνήστευσαν — постились (νηστεύω), 断食. Ἡμαρτήκαμεν — согрешили (ἁμαρτάνω). ἐδίζαζεν — судил (δικάζω)."
  7: "συνηθροίσθησαν — собрались (συναθροίζω). ἀνέβησαν σατράπαι — поднялись князья (ἀναβαίνω). ἀκούουσιν … ἐφοβήθησαν ἀπὸ προσώπου — услышали и убоялись от лица (ἀπό προσώπου — «из-за, перед»)."
  8: "Μὴ παρασιωπήσῃς ἀφ᾽ ἡμῶν τοῦ μὴ βοᾶν — «не умолчи от нас, чтобы не взывать» (παρασιωπάω, βοάω). σώσει ἡμᾶς — спасёт нас (σῴζω). Вторая половина стиха — «И сказал Самуил: не буди мне еже отступити от Господа Бога моего и не вопити о вас с молением» — есть в csl, но отсутствует в gr (проверено: αποστη, γενοιτο — НЕТ), поэтому целиком в …; μὴ γένοιτο («да не будет») — обычная формула отказа."
  9: "ἄρνα γαλαθηνὸν ἕνα — одного сосущего ягнёнка (ἀρήν, γαλαθηνός), 乳を飲む小羊. ἀνήνεγκεν ὁλοκαύτωσιν σὺν παντὶ τῷ λαῷ — принёс всесожжение со всем народом. ἐβόησεν … περὶ Ισραηλ — воззвал о Израиле. ἐπήκουσεν αὐτοῦ κύριος — услышал его Господь (ἐπακούω)."
  10: "ἀναφέρων τὴν ὁλοκαύτωσιν — принося всесожжение. προσῆγον εἰς πόλεμον — приближались к войне (προσάγω). ἐβρόντησεν κύριος ἐν φωνῇ μεγάλῃ — возгремел Господь гласом великим (βροντάω); 大きな声をもって雷を鳴らす. συνεχύθησαν — пришли в смятение (συγχέω, pass.), в тексте 混乱し. ἔπταισαν — пали, споткнулись (πταίω)."
  11: "ἐξῆλθαν — вышли. κατεδίωξαν — погнались (καταδιώκω). ἕως ὑποκάτω τοῦ Βαιθχορ — до низа Вефхора (ὑποκάτω; Βαιθχορ, ベテ・ホル; слав. «до подолия вефхор»)."
  12: "ἀνὰ μέσον Μασσηφαθ καὶ ἀνὰ μέσον τῆς παλαιᾶς — «между Массифой и между старою» (παλαιά, субстантивировано; смысл темен, вероятно старое городище; Синод. «Сеном» — иное чтение, по базе 古い町). ἐκάλεσεν τὸ ὄνομα αὐτοῦ Αβενεζερ — назвал имя его Авен-Езер (אֶבֶן הָעֵזֶר, «камень помощи»; アベン・エゼル). Λίθος τοῦ βοηθοῦ — «камень помощника», 助けの石. Ἕως ἐνταῦθα ἐβοήθησεν ἡμῖν κύριος — «до сего места помог нам Господь» (βοηθέω)."
  13: "ἐταπείνωσεν — смирил, низложил (ταπεινόω). οὐ προσέθεντο ἔτι προσελθεῖν — «не приложили более приходить» (προστίθημι, προσέρχομαι). εἰς ὅριον Ισραηλ — в пределы Израиля. πάσας τὰς ἡμέρας τοῦ Σαμουηλ — во все дни Самуила."
  14: "ἀπεδόθησαν αἱ πόλεις — возвращены города (ἀποδίδωμι). ἃς ἔλαβον … παρὰ τῶν υἱῶν Ισραηλ — которые взяли у сынов Израиля. ἀπὸ Ἀσκαλῶνος ἕως Αζοβ — от Аскалона до Азоба (Αζοβ, アゾブ; место тёмное; слав. «от Аккарона даже до Гефа» — иное чтение, по базе). ἀφείλαντο — освободили, отняли (ἀφαιρέω). εἰρήνη ἀνὰ μέσον … τοῦ Αμορραίου — мир между Израилем и Аморреем (собир., アモリ人)."
  15: "ἐδίκαζεν τὸν Ισραηλ — судил Израиля. πάσας τὰς ἡμέρας τῆς ζωῆς αὐτοῦ — во все дни жизни его."
  16: "κατ᾽ ἐνιαυτὸν ἐνιαυτὸν — «год за годом» (ἐνιαυτός). ἐκύκλου — обходил кругом (κυκλόω). Βαιθηλ, Γαλγαλα, Μασσηφαθ — Вефиль, Галгал, Массифа (ベテル, ギルガル, ミツパ). ἐν πᾶσι τοῖς ἡγιασμένοις τούτοις — «во всех сих освящённых», т.е. в этих святых местах (ἁγιάζω)."
  17: "ἡ ἀποστροφὴ αὐτοῦ — возвращение его (ἀποστροφή). εἰς Αρμαθαιμ — в Армафем, т.е. Раму (Αρμαθαιμ, ラマ; ср. 1:1). ἐκεῖ ἦν ὁ οἶκος αὐτοῦ — там был дом его. ᾠκοδόμησεν θυσιαστήριον — построил жертвенник (οἰκοδομέω, θυσιαστήριον)."
