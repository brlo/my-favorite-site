# jp-box, 1-я Царств, глава 7. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в 1 Царств нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 7: ковчег в Кириаф-Иариме, двадцать лет (1–2), призыв Самуила (3–4),
# собрание в Массифе и пост (5–6), нападение филистимлян и гром (7–11),
# Авен-Езер (12), мир и возврат городов (13–14), суд Самуила (15–17).
# Речь — 「…」: 7:3 (Самуил), 7:5 (Самуил), 7:6 (народ), 7:8 (народ; слова Самуила
# в конце — в 〔…〕, это церковное добавление), 7:12 (Самуил). Вложенной речи нет.
# Красного и синего нет: <j>/<mo> не ставятся.
# 〔…〕: 7:8 — вторая половина стиха («И сказал Самуил: не буди мне…») есть в csl,
# но отсутствует в gr-lxx-byz (проверено: αποστη, γενοιτο — НЕТ), поэтому целиком
# в 〔…〕. Больше 〔…〕 нет.
# Сносок ⟨…⟩ нет: 契約の箱, 燔祭, 祭壇, 聖なる木立, 断食 уже в корпусе.
# Отличия LXX от слав./Синод.: 7:12 «между Массифой и между старою» (τῆς παλαιᾶς),
# у Синод. «Сеном» — перевод по базе; 7:14 в гр. «от Аскалона до Азоба», у слав.
# «от Аккарона до Гефа» — по базе.
# jp-ni не использовался.

