verses:
  1: "飢饉[ききん]はその地[ち]に激[はげ]しくなった。"
  2: "彼[かれ]らがエジプトから持[も]ち帰[かえ]った穀物[こくもつ]を食[た]べ尽[つ]くすと、父[ちち]は彼[かれ]らに言[い]った。「また行[い]って、わたしたちに少[すこ]しの食物[しょくもつ]を買[か]ってきなさい。」"
  3: "ユダは言[い]った。「あの人[ひと]はわたしたちに『あなたがたの末[すえ]の弟[おとうと]が一緒[いっしょ]でなければ、わたしの顔[かお]を見[み]ることはできない』と固[かた]く言[い]いました。"
  4: "もしあなたがわたしたちの兄弟[きょうだい]を一緒[いっしょ]に送[おく]ってくださるなら、わたしたちは下[くだ]って、あなたのために食物[しょくもつ]を買[か]ってきます。"
  5: "しかし、もし送[おく]ってくださらなければ、わたしたちは行[い]きません。あの人[ひと]が『あなたがたの末[すえ]の弟[おとうと]が一緒[いっしょ]でなければ、わたしの顔[かお]を見[み]ることはできない』と言[い]ったからです。」"
  6: "イスラエルは言[い]った。「なぜ、あなたがたは、もう一人[ひとり]兄弟[きょうだい]がいることをあの人[ひと]に話[はな]して、わたしに悪[わる]いことをしたのか。」"
  7: "彼[かれ]らは言[い]った。「あの人[ひと]はわたしたちと一族[いちぞく]のことを詳[くわ]しく尋[たず]ねて、『あなたがたの父[ちち]はまだ生[い]きているか。兄弟[きょうだい]はいるか』と言[い]いました。わたしたちはその尋[たず]ねに答[こた]えただけです。まさか、あの人[ひと]が『あなたがたの兄弟[きょうだい]を連[つ]れて来[こ]い』と言[い]うとは知[し]りませんでした。」"
  8: "ユダは父[ちち]イスラエルに言[い]った。「あの子[こ]をわたしと一緒[いっしょ]に送[おく]ってください。わたしたちは立[た]ち上[あ]がって行[い]きます。そうすれば、わたしたちも、あなたも、わたしたちの家[いえ]の者[もの]たちも、生[い]きて死[し]なずにすみます。"
  9: "わたしが彼[かれ]の責任[せきにん]を負[お]います。わたしから彼[かれ]を求[もと]めてください。もしわたしが彼[かれ]をあなたのところへ連[つ]れて来[き]て、あなたの前[まえ]に立[た]たせなかったなら、わたしはいつまでもあなたに対して罪[つみ]ある者[もの]となります。"
  10: "もしわたしたちがためらっていなかったら、もう二度[にど]は往復[おうふく]していたでしょう。」"
  11: "父[ちち]イスラエルは彼[かれ]らに言[い]った。「もしそうなら、こうしなさい。あなたがたの器[うつわ]にこの地[ち]の産物[さんぶつ]を入[い]れ、あの人[ひと]への贈[おく]り物[もの]として持[も]って行[い]きなさい。樹脂[じゅし]と蜂蜜[はちみつ]、乳香[にゅうこう]と没薬[もつやく]、テレビンの木[き]の実[み]と胡桃[くるみ]である。"
  12: "また、あなたがたの手[て]に銀[ぎん]を二倍[にばい]持[も]ちなさい。あなたがたの袋[ふくろ]の口[くち]に返[かえ]されていた銀[ぎん]も、自分[じぶん]たちの手[て]で返[かえ]しなさい。たぶん、それは何[なに]かの間違[まちが]いだったのでしょう。"
  13: "弟[おとうと]を連[つ]れて、立[た]ち上[あ]がってあの人[ひと]のところへ行[い]きなさい。"
  14: "わたしの神[かみ]が、あの人[ひと]の前[まえ]であなたがたに{恵[めぐ]み|恩寵[おんちょう]}を与[あた]え、あなたがたのもう一人[ひとり]の兄弟[きょうだい]とベニヤミンを返[かえ]してくださるように。このわたしは、子[こ]を失[うしな]うなら失[うしな]おう。」"
  15: "この人[ひと]たちはその贈[おく]り物[もの]と、二倍[にばい]の銀[ぎん]を手[て]に持[も]ち、ベニヤミンを連[つ]れて、立[た]ち上[あ]がってエジプトへ下[くだ]り、ヨセフの前[まえ]に立[た]った。"
  16: "ヨセフは彼[かれ]らと、同母[どうぼ]の弟[おとうと]ベニヤミンを見[み]ると、家[いえ]を預[あず]かる者[もの]に言[い]った。「この人[ひと]たちを家[いえ]に通[とお]し、家畜[かちく]を屠[ほふ]って用意[ようい]しなさい。この人[ひと]たちは昼[ひる]にわたしと一緒[いっしょ]にパンを食[た]べるのだから。」"
  17: "その人[ひと]はヨセフが言[い]ったとおりにして、この人[ひと]たちをヨセフの家[いえ]に通[とお]した。"
  18: "この人[ひと]たちは、ヨセフの家[いえ]に通[とお]されたのを見[み]て言[い]った。「わたしたちの袋[ふくろ]に返[かえ]されていた銀[ぎん]のことで、わたしたちは連[つ]れて来[こ]られたのだ。わたしたちに難[なん]くせをつけ、襲[おそ]いかかり、わたしたちとロバを奴隷[どれい]にするためだ。」"
  19: "彼[かれ]らはヨセフの家[いえ]を預[あず]かる人[ひと]のところへ近[ちか]づき、家[いえ]の門[もん]のところで彼[かれ]に話[はな]して言[い]った。"
  20: "「お願[ねが]いです、ご主人[しゅじん]さま。わたしたちは前[まえ]にも食物[しょくもつ]を買[か]いに下[くだ]って来[き]ました。"
  21: "そして、宿[やど]に着[つ]いて袋[ふくろ]を開[あ]けると、それぞれの銀[ぎん]が自分[じぶん]の袋[ふくろ]の中[なか]にありました。わたしたちの銀[ぎん]は量目[りょうめ]そのままで、今[いま]、わたしたちの手[て]に返[かえ]して持[も]って来[き]ました。"
  22: "また、食物[しょくもつ]を買[か]うための別[べつ]の銀[ぎん]も、わたしたちは持[も]って来[き]ました。だれがわたしたちの銀[ぎん]を袋[ふくろ]に入[い]れたのか、わたしたちには分[わ]かりません。」"
  23: "彼[かれ]は言[い]った。「安心[あんしん]しなさい。恐[おそ]れてはいけません。あなたがたの神[かみ]、あなたがたの父[ちち]たちの神[かみ]が、あなたがたの袋[ふくろ]に宝[たから]を置[お]かれたのです。あなたがたの銀[ぎん]は、たしかにわたしのところへ届[とど]いています。」そして、シメオンを彼[かれ]らのところへ連[つ]れ出[だ]した。"
  24: "また、彼[かれ]らに足[あし]を洗[あら]う水[みず]を運[はこ]ばせ、ロバに飼[か]い葉[ば]を与[あた]えた。"
  25: "彼[かれ]らは、ヨセフが昼[ひる]に来[く]るまでに贈[おく]り物[もの]を用意[ようい]した。そこで食事[しょくじ]をすることになっていると聞[き]いたからである。"
  26: "ヨセフが家[いえ]に入[はい]ると、彼[かれ]らは手[て]に持[も]っていた贈[おく]り物[もの]を家[いえ]の中[なか]へ運[はこ]び入[い]れ、地[ち]に伏[ふ]して彼[かれ]を拝[おが]んだ。"
  27: "ヨセフは彼[かれ]らに尋[たず]ねた。「元気[げんき]ですか。」そして言[い]った。「あなたがたが話[はな]していた、あなたがたの父[ちち]である老[お]いた人[ひと]は元気[げんき]ですか。まだ生[い]きておられますか。」"
  28: "彼[かれ]らは言[い]った。「僕[しもべ]どもの父[ちち]は元気[げんき]で、まだ生[い]きております。」そこで、彼[かれ]は言[い]った。「その人[ひと]は神[かみ]に祝福[しゅくふく]されています。」そして、彼[かれ]らは身[み]をかがめて拝[おが]んだ。"
  29: "ヨセフは目[め]を上[あ]げて、同母[どうぼ]の弟[おとうと]ベニヤミンを見[み]て言[い]った。「これが、あなたがたがわたしに話[はな]していた末[すえ]の弟[おとうと]か。」そして言[い]った。「子[こ]よ、神[かみ]があなたを憐[あわ]れんでくださるように。」"
  30: "ヨセフは弟[おとうと]のことで胸[むね]が締[し]めつけられるように感じ、泣[な]きたくなった。そして、奥[おく]の部屋[へや]に入[はい]って、そこで泣[な]いた。"
  31: "そして、顔[かお]を洗[あら]って出[で]て来[き]て、気[き]を持[も]ち直[なお]して言[い]った。「パンを出[だ]しなさい。」"
  32: "そして、食事[しょくじ]は、ヨセフだけに、兄弟[きょうだい]たちにも別[べつ]に、一緒[いっしょ]に食[た]べるエジプト人[じん]たちにも別[べつ]に出[だ]された。エジプト人[じん]はヘブライ人[じん]と一緒[いっしょ]にパンを食[た]べることができないからである。それはエジプト人[じん]にとって忌[い]むべきことなのである。"
  33: "彼[かれ]らは彼[かれ]の前[まえ]に座[すわ]った。最[もっと]も年長[ねんちょう]の者[もの]はその長子[ちょうし]の位[くらい]に従[したが]って、末[すえ]の弟[おとうと]はその若[わか]さに従[したが]って座[すわ]った。人[ひと]たちは、互[たが]いに顔[かお]を見合[みあ]わせて驚[おどろ]いた。"
  34: "そして、彼[かれ]のところから彼[かれ]らに料理[りょうり]が配[くば]られた。ベニヤミンの分[ぶん]は、だれの分[ぶん]よりも五倍[ごばい]多[おお]かった。彼[かれ]らは彼[かれ]と一緒[いっしょ]に飲[の]み、酔[よ]った。"

notes:
  1: "Ὁ δὲ λιμὸς ἐνίσχυσεν — 飢饉は激しくなった (ἐνισχύω — «усиливаться»)."
  2: "συνετέλεσαν καταφαγεῖν — 食べ尽くすと (συντελέω). μικρὰ βρώματα — 少しの食物 (ср. 42:2)."
  3: "Διαμαρτυρίᾳ διαμεμαρτύρηται — 固く言いました (букв. «свидетельством засвидетельствовал»; слав. «клятвою засвидетелствова»). Οὐκ ὄψεσθε τὸ πρόσωπόν μου — わたしの顔を見ることはできない. Вложенная речь человека — 『…』. Речь Иуды продолжается до 5-го стиха — кавычки сквозные."
  4: "ἀποστέλλεις — 送ってくださる. καταβησόμεθα καὶ ἀγοράσωμέν σοι βρώματα — 下って、あなたのために食物を買ってくる."
  5: "Повтор условия (ср. 3) сохранён, как в LXX; вложенная речь снова в 『…』."
  6: "Τί ἐκακοποιήσατέ με — なぜ…悪いことをしたのか (κακοποιέω). ἀναγγείλαντες — 話して."
  7: "Ἐρωτῶν ἐπηρώτησεν — 詳しく尋ねた (букв. «вопрошая вопросил»; слав. «вопрошая вопроси»). κατὰ τὴν ἐπερώτησιν ταύτην — その尋ねに答えただけ. μὴ ᾔδειμεν — 知りませんでした (в греч. риторический вопрос). Две вложенные цитаты — 『…』."
  8: "Ἀπόστειλον τὸ παιδάριον — あの子を送ってください (παιδάριον — «отрок»). ἀποσκευή — 家の者たち (букв. «скарб, обоз»; Синод. «дети наши», слав. «имение наше»)."
  9: "ἐγὼ ἐκδέχομαι αὐτόν — わたしが責任を負う (ἐκδέχομαι — «брать на себя»). ἐκ χειρός μου ζήτησον αὐτόν — わたしから求めよ (букв. «с руки моей взыщи его», то есть с меня спросишь). ἡμαρτηκὼς ἔσομαι — 罪ある者となる."
  10: "εἰ μὴ ἐβραδύναμεν — ためらっていなかったら (βραδύνω). ἤδη ἂν ὑπεστρέψαμεν δίς — もう二度は往復していた (ὑποστρέφω)."
  11: "καρποὶ τῆς γῆς — この地の産物. ῥητίνη — 樹脂 (смола, бальзам). μέλι — 蜂蜜. θυμίαμα — 乳香. στακτή — 没薬 (стакти, капли мирры). τερέμινθος — テレビンの木 (теревинф). κάρυα — 胡桃 (орехи). Сноски на 乳香 и 没薬 уже даны при первом упоминании в корпусе (Мф 2:11), здесь не повторяются."
  12: "ἀργύριον δισσόν — 銀を二倍 (δισσός — «двойной»). τὸ ἀποστραφὲν ἐν τοῖς μαρσίπποις — 袋の口に返されていた銀. μήποτε ἀγνόημά ἐστιν — たぶん何かの間違い (ἀγνόημα — «недосмотр»)."
  13: "ἀναστάντες κατάβητε — 立ち上がって下って行け."
  14: "δῴη ὑμῖν χάριν — 恵みを与えるように (opt.). ἀποστείλαι — 返す. καθὰ ἠτέκνωμαι, ἠτέκνωμαι — 子を失うなら失なおう (букв. «как я осиротел, осиротел»; слав. «якоже обезчадех, обезчадех»)."
  15: "ἔστησαν ἐναντίον Ιωσηφ — ヨセフの前に立った."
  16: "ὁ ἐπὶ τῆς οἰκίας αὐτοῦ — 家を預かる者 (управляющий). σφάξον θύματα — 家畜を屠って用意せよ (θύμα — «жертва»). ἄρτους — パン."
  17: "ἐποίησεν δὲ ὁ ἄνθρωπος καθὰ εἶπεν Ιωσηφ — その人はヨセフが言ったとおりにした."
  18: "εἰσήχθησαν — 通された. Διὰ τὸ ἀργύριον… τὴν ἀρχήν — 銀のことで、そもそも (τὴν ἀρχήν — «сначала, прежде всего»). συκοφαντῆσαι — 難くせをつける (συκοφαντέω). ἐπιθέσθαι ἡμῖν — 襲いかかる."
  19: "ἐν τῷ πυλῶνι τοῦ οἴκου — 家の門のところで."
  20: "Δεόμεθα, κύριε — お願いです、ご主人さま (δέομαι — «просить»). κατέβημεν τὴν ἀρχήν — 前にも下って来た."
  21: "εἰς τὸ καταλῦσαι — 宿に着いて (καταλύω — «останавливаться на ночлег»). ἐν σταθμῷ — 量目そのまま (σταθμός — «вес»)."
  22: "οὐκ οἴδαμεν τίς ἐνέβαλεν τὸ ἀργύριον — だれが銀を入れたのか分からない."
  23: "Ἵλεως ὑμῖν — 安心しなさい (букв. «милостив вам»; слав. «мир вам»). θησαυρούς — 宝. τὸ ἀργύριον ὑμῶν εὐδοκιμοῦν ἀπέχω — 銀はたしかに届いている (ἀπέχω — «получать сполна»). ἐξήγαγεν τὸν Συμεων — シメオンを連れ出した."
  24: "ὕδωρ νίψαι τοὺς πόδας — 足を洗う水. χορτάσματα τοῖς ὄνοις — ロバの飼い葉."
  25: "ἕως τοῦ ἐλθεῖν Ιωσηφ — ヨセフが来るまでに. ἀριστᾶν — 食事をする (ἀριστάω)."
  26: "προσήνεγκαν τὰ δῶρα — 贈り物を運び入れた. προσεκύνησαν ἐπὶ πρόσωπον ἐπὶ τὴν γῆν — 地に伏して拝んだ."
  27: "Πῶς ἔχετε — 元気ですか (букв. «как вы?»). ὁ πρεσβύτερος — 老いた (букв. «старший»). ἔτι ζῇ — まだ生きておられるか."
  28: "Ὑγιαίνει ὁ παῖς σου ὁ πατὴρ ἡμῶν — 僕どもの父は元気で. καὶ εἶπεν Εὐλογητὸς ὁ ἄνθρωπος ἐκεῖνος τῷ θεῷ — その人は神に祝福されている (в LXX это слова Иосифа; слав. «благословен человек оный Богу»; jp-joc тоже относит к нему). κύψαντες προσεκύνησαν — 身をかがめて拝んだ."
  29: "ἀναβλέψας τοῖς ὀφθαλμοῖς — 目を上げて. ὁμομήτριος — 同母の. ὁ θεὸς ἐλεήσαι σε, τέκνον — 神があなたを憐れんでくださるように、子よ (opt.)."
  30: "ἐταράχθη — 胸が締めつけられるように感じた (смутился). συνεστρέφετο γὰρ τὰ ἔντερα αὐτοῦ — внутренности сжимались. ἐζήτει κλαῦσαι — 泣きたくなった. ταμιεῖον — 奥の部屋."
  31: "νιψάμενος τὸ πρόσωπον — 顔を洗って. ἐνεκρατεύσατο — 気を持ち直した (ἐγκρατεύομαι). Παράθετε ἄρτους — パンを出しなさい."
  32: "παρέθηκαν αὐτῷ μόνῳ καὶ αὐτοῖς καθ᾽ ἑαυτοὺς καὶ τοῖς Αἰγυπτίοις καθ᾽ ἑαυτούς — 彼だけに、彼らにも別に、エジプト人にも別に. βδέλυγμα — 忌むべきこと. Слав. добавляет в скобках «всяк пастух овчий» (из евр. 46:34) — не переведено и не взято в 〔…〕: это пояснительная вставка к целому стиху, а не слово церковного чтения на месте греческого."
  33: "κατὰ τὰ πρεσβεῖα αὐτοῦ — 長子としての位に従って (πρεσβεῖα — «первородство»). κατὰ τὴν νεότητα αὐτοῦ — 若さに従って. ἐξίσταντο — 驚いた (ἐξίστημι)."
  34: "ἦραν μερίδας — 料理が配られた (μερίς — «порция»). ἐμεγαλύνθη — 多かった (μεγαλύνω). πενταπλασίως — 五倍. ἐμεθύσθησαν — 酔った (μεθύσκω)."
