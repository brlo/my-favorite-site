# jp-box, Евангелие от Иоанна, глава 12. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в notes.
# jp-ni не использовался.
#
# Глава 12: помазание в Вифании (1–8), заговор против Лазаря (9–11),
# вход в Иерусалим (12–16), свидетельство толпы (17–19), Еллины и Филипп (20–22),
# слово о пшеничном зерне (23–26), «душа Моя возмутилась» и голос Отца (27–30),
# суд над миром и вознесение (31–36), неверие и Исаия (37–43), последняя речь (44–50).
# Слова Христа — красным (<j>). Голос с неба (12:28) — НЕ красный: это слова Отца.
# Слова Иуды, толпы, Филиппа, Андрея, Исаии (в повествовании) — вне тегов.
# Мария в 12:1–8 — сестра Лазаря, не Магдалина; Богородицы в главе нет.
# Сносок нет: 過越祭 и デナリオン уже пояснены в корпусе; ヒソプ в этой главе нет (Ин 19:29).

