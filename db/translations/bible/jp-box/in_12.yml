verses:
  1: "過越祭[すぎこしまつり]の六日[むいか]前[まえ]、イエスはベタニアへ来[こ]られた。そこは、イエスが死[し]んだ者[もの]たちの中[なか]から復活[ふっかつ]させたラザロがいた所[ところ]である。"
  2: "そこで、人々[ひとびと]はイエスのために夕食[ゆうしょく]を用意[ようい]した。マルタは給仕[きゅうじ]をし、ラザロはイエスとともに食卓[しょくたく]に着[つ]いていた者[もの]の一人[ひとり]であった。"
  3: "そこで、マリアは純粋[じゅんすい]で高価[こうか]なナルドの香油[こうゆ]を一斤[いっきん]取[と]って、イエスの足[あし]に塗[ぬ]り、自分[じぶん]の髪[かみ]でその足[あし]を拭[ふ]いた。家[いえ]は香油[こうゆ]の香[かお]りで満[み]ちあふれた。"
  4: "弟子[でし]の一人[ひとり]で、のちにイエスを裏切[うらぎ]るイスカリオテのユダが言[い]った。"
  5: "「なぜ、この香油[こうゆ]を三百[さんびゃく]デナリオンで売[う]って、貧[まず]しい人々[ひとびと]に分[わ]け与[あた]えなかったのか。」"
  6: "彼[かれ]がこう言[い]ったのは、貧[まず]しい人々[ひとびと]を思[おも]ってのことではなく、彼[かれ]が盗人[ぬすびと]であり、金入[かねい]れを預[あず]かって、そこに入[はい]れられる金[かね]を盗[ぬす]んでいたからである。"
  7: "イエスは言[い]われた。「<j>そのままにしておきなさい。彼女[かのじょ]はわたしの葬[ほうむ]りの日[ひ]のために、それを蓄[たくわ]えておいたのだ。</j>"
  8: "<j>貧[まず]しい人々[ひとびと]なら、いつでもあなたがたと一緒[いっしょ]にいる。だが、わたしはいつでも一緒[いっしょ]にいるのではない。</j>」"
  9: "さて、ユダヤ人[じん]の多[おお]くの群衆[ぐんしゅう]は、イエスがそこにおられることを知[し]り、イエスのためだけではなく、死[し]んだ者[もの]たちの中[なか]から復活[ふっかつ]させたラザロを見[み]ようとして来[き]た。"
  10: "祭司長[さいしちょう]たちは、ラザロをも殺[ころ]そうと相談[そうだん]した。"
  11: "ラザロのゆえに、多[おお]くのユダヤ人[じん]が彼[かれ]らから離[はな]れて、イエスを信[しん]じるようになっていたからである。"
  12: "翌日[よくじつ]、祭[まつ]りのために来[き]ていた大[おお]きな群衆[ぐんしゅう]は、イエスがエルサレムへ来[こ]られると聞[き]いて、"
  13: "なつめやしの枝[えだ]を取[と]って、イエスを迎[むか]えに出[で]て、叫[さけ]んだ。「ホサナ。主[しゅ]の名[な]によって来[こ]られる方[かた]に、祝福[しゅくふく]があるように。イスラエルの王[おう]に。」"
  14: "イエスは子[こ]ろばを見[み]つけて、それに乗[の]られた。書[か]いてあるとおりである。"
  15: "「シオンの娘[むすめ]よ、恐[おそ]れるな。見[み]よ、あなたの王[おう]が来[く]る。ろばの子[こ]に乗[の]って。」"
  16: "弟子[でし]たちは初[はじ]め、これらのことを理解[りかい]しなかった。しかし、イエスが栄光[えいこう]を受[う]けられた後[のち]、これらのことがイエスについて書[か]かれていたこと、また人々[ひとびと]がイエスにこれらのことをしたことを、思[おも]い出[だ]した。"
  17: "イエスがラザロを墓[はか]から呼[よ]び出[だ]して、死[し]んだ者[もの]たちの中[なか]から復活[ふっかつ]させたとき、一緒[いっしょ]にいた群衆[ぐんしゅう]がそのことを証言[しょうげん]していた。"
  18: "群衆[ぐんしゅう]がイエスを迎[むか]えたのは、イエスがこのしるしを行[おこな]ったと聞[き]いたからである。"
  19: "そこで、ファリサイ派[は]の人々[ひとびと]は互[たが]いに言[い]った。「ご覧[らん]なさい。あなたがたは何[なに]の得[とく]にもなっていない。見[み]よ、世[よ]はこぞってあの男[おとこ]の後[あと]について行[い]った。」"
  20: "祭[まつ]りに礼拝[れいはい]するために上[のぼ]って来[き]た者[もの]たちの中[なか]に、ギリシア人[じん]が何人[なんにん]かいた。"
  21: "彼[かれ]らは、ガリラヤのベツサイダ出身[しゅっしん]のフィリポのところへ来[き]て、「先生[せんせい]、イエスにお会[あ]いしたいのですが」と頼[たの]んだ。"
  22: "フィリポは来[き]てアンデレに話[はな]し、アンデレとフィリポが来[き]てイエスに話[はな]した。"
  23: "イエスは彼[かれ]らに答[こた]えて言[い]われた。「<j>人[ひと]の子[こ]が栄光[えいこう]を受[う]ける時[とき]が来[き]た。</j>"
  24: "<j>よくよく言[い]っておく。麦[むぎ]の粒[つぶ]が地[ち]に落[お]ちて死[し]ななければ、それ一[ひと]つだけが残[のこ]る。しかし、死[し]ねば、多[おお]くの実[み]を結[むす]ぶ。</j>"
  25: "<j>自分[じぶん]の命[いのち]を愛[あい]する者[もの]は、それを失[うしな]う。この世[よ]で自分[じぶん]の命[いのち]を憎[にく]む者[もの]は、永遠[えいえん]の命[いのち]のために、それを保[たも]つ。</j>"
  26: "<j>わたしに仕[つか]える者[もの]は、わたしについて来[く]るがよい。わたしがいる所[ところ]に、わたしに仕[つか]える者[もの]もいる。わたしに仕[つか]える者[もの]を、わたしの父[ちち]は尊[とうと]んでくださる。</j>」"
  27: "「<j>今[いま]、わたしの魂[たましい]は激[はげ]しくかき乱[みだ]されている。何[なん]と言[い]おうか。『父[ちち]よ、この時[とき]からわたしを救[すく]ってください』と言[い]おうか。しかし、わたしはこの時[とき]のために来[き]たのだ。</j>"
  28: "<j>父[ちち]よ、あなたの名[な]を栄光[えいこう]に輝[かがや]かせてください。</j>」すると、天[てん]から声[こえ]が聞[き]こえた。「わたしはすでに栄光[えいこう]を輝[かがや]かせた。また、さらに輝[かがや]かせる。」"
  29: "そばに立[た]っていた群衆[ぐんしゅう]は、それを聞[き]いて「雷[かみなり]が鳴[な]ったのだ」と言[い]った。ほかの者[もの]たちは「天使[てんし]が彼[かれ]に語[かた]りかけたのだ」と言[い]った。"
  30: "イエスは答[こた]えて言[い]われた。「<j>この声[こえ]は、わたしのためではなく、あなたがたのために響[ひび]いたのだ。</j>"
  31: "<j>今[いま]、この世[よ]の裁[さば]きが行[おこな]われる。今[いま]、この世[よ]の支配者[しはいしゃ]が外[そと]へ追[お]い出[だ]される。</j>"
  32: "<j>わたしは地[ち]から上[あ]げられるとき、すべての人[ひと]をわたしのもとへ引[ひ]き寄[よ]せる。</j>」"
  33: "イエスがこれを言[い]われたのは、ご自身[じしん]がどのような死[し]を遂[と]げるかを示[しめ]すためであった。"
  34: "そこで、群衆[ぐんしゅう]は答[こた]えて言[い]った。「わたしたちは律法[りっぽう]から、キリストはとこしえにとどまると聞[き]いている。どうしてあなたは、人[ひと]の子[こ]が上[あ]げられなければならないと言[い]うのか。この人[ひと]の子[こ]とはだれか。」"
  35: "イエスは彼[かれ]らに言[い]われた。「<j>光[ひかり]はまだしばらく、あなたがたと一緒[いっしょ]にいる。闇[やみ]に襲[おそ]われないうちに、光[ひかり]がある間[あいだ]に歩[ある]きなさい。闇[やみ]の中[なか]を歩[ある]く者[もの]は、どこへ行[い]くのか分[わ]からない。</j>"
  36: "<j>光[ひかり]がある間[あいだ]に、光[ひかり]を信[しん]じなさい。光[ひかり]の子[こ]となるためである。</j>」イエスはこう言[い]ってから、彼[かれ]らを離[はな]れ、身[み]を隠[かく]された。"
  37: "イエスは彼[かれ]らの前[まえ]でこれほど多[おお]くのしるしを行[おこな]われたのに、彼[かれ]らはイエスを信[しん]じなかった。"
  38: "それは、預言者[よげんしゃ]イザヤが語[かた]った言葉[ことば]が成就[じょうじゅ]するためであった。「主[しゅ]よ、わたしたちの告[つ]げたことを信[しん]じた者[もの]が、だれおりましょうか。主[しゅ]の腕[うで]は、だれに現[あらわ]されたのでしょうか。」"
  39: "彼[かれ]らが信[しん]じることができなかったのは、イザヤがさらにこう言[い]っているからである。"
  40: "「主[しゅ]は彼[かれ]らの目[め]を見[み]えなくし、心[こころ]を頑[かたくな]にされた。目[め]で見[み]、心[こころ]で悟[さと]り、立[た]ち返[かえ]って、わたしが彼[かれ]らを癒[いや]すことのないようにするためである。」"
  41: "イザヤがこう言[い]ったのは、彼[かれ]がイエスの栄光[えいこう]を見[み]て、イエスについて語[かた]ったからである。"
  42: "しかし、指導者[しどうしゃ]たちの中[なか]にも多[おお]くの者[もの]がイエスを信[しん]じた。ただ、ファリサイ派[は]の人々[ひとびと]を恐[おそ]れて告白[こくはく]しなかった。会堂[かいどう]から追[お]い出[だ]されないためである。"
  43: "彼[かれ]らは神[かみ]の栄光[えいこう]よりも、人[ひと]からの栄光[えいこう]を愛[あい]したのである。"
  44: "イエスは叫[さけ]んで言[い]われた。「<j>わたしを信[しん]じる者[もの]は、わたしを信[しん]じるのではなく、わたしを遣[つか]わした方[かた]を信[しん]じるのである。</j>"
  45: "<j>わたしを見[み]る者[もの]は、わたしを遣[つか]わした方[かた]を見[み]るのである。</j>"
  46: "<j>わたしは光[ひかり]として世[よ]に来[き]た。わたしを信[しん]じる者[もの]が闇[やみ]にとどまらないためである。</j>"
  47: "<j>わたしの言葉[ことば]を聞[き]いて守[まも]らない者[もの]がいても、わたしはその者[もの]を裁[さば]かない。わたしが来[き]たのは、世[よ]を裁[さば]くためではなく、世[よ]を救[すく]うためである。</j>"
  48: "<j>わたしを拒[こば]み、わたしの言葉[ことば]を受[う]け入[い]れない者[もの]を裁[さば]く者[もの]がある。わたしが語[かた]ったその言葉[ことば]が、終[お]わりの日[ひ]にその者[もの]を裁[さば]くのである。</j>"
  49: "<j>わたしは自分[じぶん]から語[かた]ったのではない。わたしを遣[つか]わした父[ちち]ご自身[じしん]が、何[なに]を言[い]い、何[なに]を語[かた]るべきかを、わたしに命[めい]じられたのである。</j>"
  50: "<j>わたしは、父[ちち]の掟[おきて]が永遠[えいえん]の命[いのち]であることを知[し]っている。だから、わたしが語[かた]ることは、父[ちち]がわたしに言[い]われたとおりに語[かた]っているのである。</j>」"

notes:
  3: "πιστικῆς — «чистый/настоящий» (возможно и «верный»); 純粋で高価な. λίτρα — римский фунт, около 327 г; 一斤."
  6: "γλωσσόκομον — «ящик для денег»; 金入れ. ἐβάσταζεν — «носил [что туда опускали]»; передано 盗んでいた, так как он прямо назван κλέπτης."
  7: "Ἄφες αὐτήν, ἵνα εἰς τὴν ἡμέραν τοῦ ἐνταφιασμοῦ μου τηρήσῃ αὐτό — «оставь её, чтобы она сберегла это ко дню погребения Моего»; 蓄えておいた. Возможен и вариант понимания: «оставьте её; она сберегла это»."
  24: "ἀμὴν ἀμὴν λέγω ὑμῖν — よくよく言っておく, как в 10:1 и 10:7."
  27: "τετάρακται — «возмутилась»; 激しくかき乱されている. Не сглажено до «опечалилась»."
  28: "Голос с неба — слова Отца; по заданию не красный. Слова Христа в этом стихе — только до 「」."
  32: "ἑλκύσω — «привлеку»; 引き寄せる, с сохранением образа."
  34: "ἐκ τοῦ νόμου — «из закона»; 律法から. Толпа приводит общее место, а не конкретную цитату."
  40: "ἵνα μὴ … καὶ ἰάσομαι αὐτούς — «чтобы не увидели… и Я не исцелил их»; 癒すことのないように."
  42: "ἀποσυνάγωγοι γένωνται — «чтобы не стать отлучёнными от синагоги»; 会堂から追い出されないため."
