verses:
  0: "合唱[がっしょう]の長[ちょう]に歌[うた]わせる。イディフムのために。ダビデの歌[うた]。"
  1: "わたしは言[い]った。「舌[した]で罪[つみ]を犯[おか]さないように、自分[じぶん]の道[みち]を守[まも]ろう。罪[つみ]人[びと]がわたしの前[まえ]に立[た]つときは、口[くち]に枷[かせ]をはめよう」と。"
  2: "わたしは口[くち]を閉[と]ざして黙[だま]り、善[ぜん]いことさえ言[い]わずに沈[しず]んだ。しかし、わたしの痛[いた]みは新[あら]たになった。"
  3: "わたしの心[こころ]は内[うち]で熱[あつ]くなり、思[おも]い巡[めぐ]らすうちに火[ひ]が燃[も]え上[あ]がり、とうとう、わたしは舌[した]で言[い]った。"
  4: "主[しゅ]よ、わたしの終[お]わりと、わたしの日[ひ]の数[かず]がどれほどかを、わたしに知[し]らせてください。わたしがどれほどはかない者[もの]かを、知[し]るために。"
  5: "見[み]よ、あなたはわたしの日[ひ]を手[て]のひらほどの長[なが]さにされ、わたしの命[いのち]はあなたの前[まえ]では何[なに]でもない。まことに、生[い]ける人[ひと]はすべて、むなしい。"
  6: "人[ひと]は影[かげ]のように歩[ある]き回[まわ]るだけであり、むなしく騒[さわ]ぎ立[た]つ。人[ひと]は財[ざい]を蓄[た]えても、だれがそれを集[あつ]めるのかを知[し]らない。"
  7: "主[しゅ]よ、今[いま]、わたしが待[ま]ち望[のぞ]むのは何[なに]か。あなたのほかにない。わたしの望[のぞ]みは、あなたにこそある。"
  8: "わたしをすべての不[ふ]法[ほう]から救[すく]い出[だ]してください。あなたはわたしを、愚[おろ]かな者[もの]の嘲[あざけ]りに渡[わた]された。"
  9: "わたしは黙[だま]って、口[くち]を開[ひら]かなかった。あなたがわたしを造[つく]られたからである。"
  10: "あなたの打[う]ち撃[つ]ちを、わたしから離[はな]してください。あなたの手[て]の強[つよ]さに、わたしは消[き]え入[い]りそうである。"
  11: "あなたは不[ふ]法[ほう]のゆえに人[ひと]を責[せ]めて懲[こ]らしめ、その命[いのち]を、くもの巣[す]のように溶[と]け去[さ]らせる。まことに、人[ひと]はすべて、むなしく騒[さわ]ぐだけである。"
  12: "主[しゅ]よ、わたしの祈[いの]りを聞[き]き、わたしの願[ねが]いに耳[みみ]を傾[かたむ]けてください。わたしの涙[なみだ]に黙[だま]っていないでください。わたしはあなたのもとで旅人[たびびと]であり、すべての父[ちち]たちと同じく、寄[き]留[りゅう]の者[もの]であるからだ。"
  13: "わたしをゆるめ、去[さ]って行[ゆ]き、もはやいなくなる前[まえ]に、しばしの安[やす]らぎを得[え]させてください。"

notes:
  0: "Εἰς τὸ τέλος, τῷ Ιδιθουν· ᾠδὴ τῷ Δαυιδ — 合唱の長に歌わせる、イディフムに、ダビデの歌. Ιδιθουν — イディフム (jp-joc; евр. Едутун). εἰς τὸ τέλος — «в конец», церковное понимание «начальнику хора». Надписание — стих 0, скобками не маркируется."
  1: "Εἶπα Φυλάξω τὰς ὁδούς μου — рех: сохраню пути моя. τοῦ μὴ ἁμαρτάνειν ἐν γλώσσῃ μου — еже не согрешати ми языком моим. ἐθέμην τῷ στόματί μου φυλακήν — положих устом моим хранило (φυλακή «стража, охрана»); 枷[かせ] — образ стражи при устах. ἐν τῷ συστῆναι τὸν ἁμαρτωλὸν ἐναντίον μου — внегда востати грешному предо мною."
  2: "ἐκωφώθην καὶ ἐταπεινώθην — онемех и смирихся (κωφόω «делать немым»). ἐσίγησα ἐξ ἀγαθῶν — умолчах от благ, т. е. молчал даже о добром. τὸ ἄλγημά μου ἀνεκαινίσθη — болезнь моя обновися (ἀνακαινίζω «обновлять»)."
  3: "ἐθερμάνθη ἡ καρδία μου ἐντός μου — согреяся сердце мое во мне. ἐν τῇ μελέτῃ μου ἐκκαυθήσεται πῦρ — в поучении моем разгорится огнь (μελέτη «размышление»). ἐλάλησα ἐν γλώσσῃ μου — глаголах языком моим; речь продолжается в ст. 4–13 без кавычек: это молитва самого псалмопевца (как в Пс 3)."
  4: "Γνώρισόν μοι, κύριε, τὸ πέρας μου — скажи ми, Господи, кончину мою (γνωρίζω «давать знать»; πέρας «предел, конец»). τὸν ἀριθμὸν τῶν ἡμερῶν μου, τίς ἐστιν — число дней моих, кое есть. ἵνα γνῶ τί ὑστερῶ ἐγώ — да разумею, чесого лишаюся аз (ὑστερέω «недоставать, быть лишённым»); どれほどはかない者か — по смыслу контекста, букв. «чего я лишаюсь»."
  5: "παλαιστὰς ἔθου τὰς ἡμέρας μου — пяди положил еси дни моя (παλαιστή «ладонь, пядь»). ἡ ὑπόστασίς μου ὡσεὶ οὐθὲν ἐνώπιόν σου — состав мой яко ничтоже пред Тобою (ὑπόστασις «состав, существо»). πλὴν τὰ σύμπαντα ματαιότης, πᾶς ἄνθρωπος ζῶν — обаче всяческая суета, всяк человек живый. διάψαλμα в конце стиха не передаётся."
  6: "ἐν εἰκόνι διαπορεύεται ἄνθρωπος — образом ходит человек (εἰκών «образ»); 影[かげ] — по церковному пониманию (Синодальный «как призрак»), букв. «в образе». πλὴν μάτην ταράσσονται — обаче всуе мятется. θησαυρίζει καὶ οὐ γινώσκει τίνι συνάξει αὐτά — сокровищствует и не весть, кому соберет я."
  7: "καὶ νῦν τίς ἡ ὑπομονή μου; οὐχὶ ὁ κύριος; — и ныне кто терпение мое? не Господь ли? (ὑπομονή «ожидание, терпение»). ἡ ὑπόστασίς μου παρὰ σοῦ ἐστιν — состав мой от Тебе есть."
  8: "ἀπὸ πασῶν τῶν ἀνομιῶν μου ῥῦσαί με — от всех беззаконий моих избави мя. ὄνειδος ἄφρονι ἔδωκάς με — поношение безумному дал мя еси; аорист оставлен изъявительным, как в церковном тексте (Синодальный «поношением безумному дал мя еси»), в просьбу не переделан."
  9: "ἐκωφώθην καὶ οὐκ ἤνοιξα τὸ στόμα μου — онемех и не отверзох уст моих. ὅτι σὺ εἶ ὁ ποιήσας με — яко Ты еси сотворивый мя."
  10: "ἀπόστησον ἀπ᾽ ἐμοῦ τὰς μάστιγάς σου — отстави от мене раны Твоя (ἀφίστημι «удалять»). ἀπὸ τῆς ἰσχύος τῆς χειρός σου ἐγὼ ἐξέλιπον — от крепости руки Твоея аз исчезох (ἐκλείπω «исчезать, изнемогать»)."
  11: "ἐν ἐλεγμοῖς ὑπὲρ ἀνομίας ἐπαίδευσας ἄνθρωπον — во обличениих о беззаконии наказал еси человека. ἐξέτηξας ὡς ἀράχνην τὴν ψυχὴν αὐτοῦ — истаял еси яко паучину душу его (τήκω «плавить, растворять»; ἀράχνη «паутина»). πλὴν μάτην ταράσσεται πᾶς ἄνθρωπος — обаче всуе всяк человек мятется. διάψαλμα в конце стиха не передаётся."
  12: "εἰσάκουσον τῆς προσευχῆς μου — услыши молитву мою. τῆς δεήσεώς μου ἐνώτισαι — моление мое внуши (ἐνωτίζομαι «внимать»). τῶν δακρύων μου μὴ παρασιωπήσῃς — слез моих не премолчи (παρασιωπάω «молчать при»). πάροικος... καὶ παρεπίδημος — пришлец и пресельник (два слова: 旅人 и 寄留の者). καθὼς πάντες οἱ πατέρες μου — якоже вси отцы мои."
  13: "ἄνες μοι — ослаби ми (ἀνίημι «отпускать, ослаблять»). ἵνα ἀναψύξω — да почию (ἀναψύχω «освежиться, отдохнуть»). πρὸ τοῦ με ἀπελθεῖν καὶ οὐκέτι μὴ ὑπάρξω — прежде даже не отиду, и ктому не буду."
