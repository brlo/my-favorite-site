verses:
  1: "わたしの子[こ]どもたち、あなたがたが罪[つみ]を犯[おか]さないように、わたしはこのことを書[か]く。もしだれかが罪[つみ]を犯[おか]しても、父[ちち]の御前[みまえ]には、わたしたちのために助[たす]け主[ぬし]がおられる。すなわち、義[ただ]しい方[かた]イエス・キリストである。"
  2: "この方[かた]は、わたしたちの罪[つみ]のための贖[あがな]いである。わたしたちの罪[つみ]のためだけでなく、全世界[ぜんせかい]のためでもある。"
  3: "わたしたちがこの方[かた]を知[し]っていると分[わ]かるのは、その戒[いまし]めを守[まも]るときである。"
  4: "この方[かた]を知[し]っていると言[い]いながら、その戒[いまし]めを守[まも]らない者[もの]は偽[いつわ]り者[もの]であり、その人[ひと]のうちに真理[しんり]はない。"
  5: "しかし、その御言葉[みことば]を守[まも]る者[もの]のうちには、まことに神[かみ]の愛[あい]が全[まった]うされている。これによって、わたしたちがこの方[かた]のうちにいることが分[わ]かる。"
  6: "この方[かた]のうちにとどまると言[い]う者[もの]は、この方[かた]が歩[あゆ]まれたとおりに、自分[じぶん]も歩[あゆ]まなければならない。"
  7: "愛[あい]する者[もの]たちよ、わたしがあなたがたに書[か]いているのは、新[あたら]しい戒[いまし]めではなく、あなたがたが初[はじ]めから持[も]っている古[ふる]い戒[いまし]めである。この古[ふる]い戒[いまし]めとは、あなたがたが聞[き]いた言葉[ことば]である。"
  8: "しかし、わたしはあなたがたに新[あたら]しい戒[いまし]めを書[か]いている。このことは、この方[かた]においても、あなたがたにおいても真[まこと]である。闇[やみ]は過[す]ぎ去[さ]り、まことの光[ひかり]はすでに照[て]っているからである。"
  9: "光[ひかり]のうちにいると言[い]いながら、自分[じぶん]の兄弟[きょうだい]を憎[にく]む者[もの]は、今[いま]なお闇[やみ]のうちにいる。"
  10: "自分[じぶん]の兄弟[きょうだい]を愛[あい]する者[もの]は光[ひかり]のうちにとどまり、その人[ひと]のうちにつまずきとなるものはない。"
  11: "しかし、自分[じぶん]の兄弟[きょうだい]を憎[にく]む者[もの]は闇[やみ]のうちにいて、闇[やみ]のうちを歩[あゆ]み、どこへ行[い]くのかも知[し]らない。闇[やみ]がその人[ひと]の目[め]を盲目[もうもく]にしたからである。"
  12: "子[こ]どもたちよ、あなたがたの罪[つみ]は、この方[かた]の名[な]によって赦[ゆる]された。だから、わたしはあなたがたに書[か]いている。"
  13: "父[ちち]たちよ、あなたがたは初[はじ]めからおられる方[かた]を知[し]っている。だから、わたしはあなたがたに書[か]いている。若[わか]い者[もの]たちよ、あなたがたは悪[あく]しき者[もの]に勝[か]った。だから、わたしはあなたがたに書[か]いている。"
  14: "小[ちい]さな者[もの]たちよ、あなたがたは父[ちち]を知[し]っている。だから、わたしはあなたがたに書[か]いた。父[ちち]たちよ、あなたがたは初[はじ]めからおられる方[かた]を知[し]っている。だから、書[か]いた。若[わか]い者[もの]たちよ、あなたがたは強[つよ]く、神[かみ]の言葉[ことば]があなたがたのうちにとどまり、悪[あく]しき者[もの]に勝[か]った。だから、書[か]いた。"
  15: "世[よ]をも、世[よ]にあるものをも愛[あい]してはならない。もしだれかが世[よ]を愛[あい]するなら、父[ちち]の愛[あい]はその人[ひと]のうちにない。"
  16: "世[よ]にあるものはすべて、すなわち、肉[にく]の欲[よく]、目[め]の欲[よく]、暮[く]らしの高慢[こうまん]は、父[ちち]から出[で]たものではなく、世[よ]から出[で]たものである。"
  17: "世[よ]も、その欲[よく]も過[す]ぎ去[さ]る。しかし、神[かみ]の御心[みこころ]を行[おこな]う者[もの]は永遠[えいえん]に残[のこ]る。"
  18: "小[ちい]さな者[もの]たちよ、今[いま]は最後[さいご]の時[とき]である。あなたがたが、反[はん]キリストが来[く]ると聞[き]いたとおり、今[いま]すでに多[おお]くの反[はん]キリストが現[あらわ]れた。これによって、今[いま]が最後[さいご]の時[とき]であることが分[わ]かる。"
  19: "彼[かれ]らはわたしたちの中[なか]から出[で]て行[い]ったが、もともとわたしたちのものではなかった。もしわたしたちのものであったなら、わたしたちと一緒[いっしょ]にとどまっていたはずである。しかし、彼[かれ]らがすべてわたしたちのものではないことが明[あき]らかになるためであった。"
  20: "あなたがたには、聖[せい]なる方[かた]から受[う]けた注[そそ]ぎの油[あぶら]⟨キリストに結[むす]ばれた者[もの]に注[そそ]がれる油[あぶら]。神[かみ]から受[う]ける導[みちび]きの賜[たま]ものを指[さ]す。⟩があり、あなたがたは皆、知[し]っている。"
  21: "わたしがあなたがたに書[か]いたのは、あなたがたが真理[しんり]を知[し]らないからではなく、真理[しんり]を知[し]っており、偽[いつわ]りはすべて真理[しんり]から出[で]ていないからである。"
  22: "偽[いつわ]り者[もの]とはだれか。イエスがキリストであることを否認[ひてい]する者[もの]ではないか。父[ちち]と御子[みこ]を否認[ひてい]する者[もの]、それが反[はん]キリストである。"
  23: "御子[みこ]を否認[ひてい]する者[もの]は、父[ちち]をも持[も]っていない。御子[みこ]を告白[こくはく]する者[もの]は、父[ちち]をも持[も]っている。"
  24: "あなたがたが初[はじ]めから聞[き]いたことが、あなたがたのうちにとどまっているようにしなさい。あなたがたが初[はじ]めから聞[き]いたことがあなたがたのうちにとどまるなら、あなたがたも御子[みこ]と父[ちち]のうちにとどまるであろう。"
  25: "これが、この方[かた]ご自身[じしん]がわたしたちに約束[やくそく]されたものである。すなわち、永遠[えいえん]の命[いのち]である。"
  26: "わたしがこのことをあなたがたに書[か]いたのは、あなたがたを惑[まど]わす者[もの]たちについてである。"
  27: "あなたがたがこの方[かた]から受[う]けた注[そそ]ぎの油[あぶら]は、あなたがたのうちにとどまっており、だれからも教[おし]えを受[う]ける必要[ひつよう]はない。この方[かた]の注[そそ]ぎの油[あぶら]がすべてのことについてあなたがたを教[おし]え、それは真[まこと]であって偽[いつわ]りではない。だから、それがあなたがたに教[おし]えたとおりに、この方[かた]のうちにとどまりなさい。"
  28: "子[こ]どもたちよ、今[いま]、この方[かた]のうちにとどまりなさい。そうすれば、この方[かた]が現[あらわ]れるとき、わたしたちは大胆[だいたん]さを持[も]ち、その来臨[らいりん]のとき、この方[かた]の前[まえ]に恥[は]ずかしめられることがない。"
  29: "この方[かた]が義[ただ]しい方[かた]であることを知[し]っているなら、義[ぎ]を行[おこな]う者[もの]はすべてこの方[かた]から生[う]まれたことも、知[し]りなさい。"

notes:
  1: "Τεκνία μου — わたしの子どもたち. ἵνα μὴ ἁμάρτητε — 罪を犯さないように. παράκλητος — 助け主 (в Ин 14:16,26 то же слово и то же чтение; у jp-joc 保惠師). πρὸς τὸν πατέρα — 父の御前に (πρός при глаголе ходатайства — «у Отца»). δίκαιον — 義しい方."
  2: "ἱλασμός — 贖い (умилостивление; в Рим 3:25 иное слово — ἱλαστήριον, там 宥めの供え物). περὶ τῶν ἁμαρτιῶν — 罪のために (περί — за, ради). οὐ περὶ τῶν ἡμετέρων δὲ μόνον — わたしたちの罪のためだけでなく. ὅλου τοῦ κόσμου — 全世界のため (слово «грехи» не повторено, как и в греческом, где при ὅλου τοῦ κόσμου стоит только περί)."
  3: "ἐν τούτῳ γινώσκομεν — これによって…分かる (γινώσκω — познавать; в 2:4 ἐγνώκαμεν perfect — знать). τὰς ἐντολὰς αὐτοῦ τηρῶμεν — その戒めを守る (τηρέω — соблюдать, хранить)."
  4: "ὁ λέγων — 言いながら (причастие с ἀλλά в главном). ψεύστης — 偽り者. ἐν τούτῳ ἡ ἀλήθεια οὐκ ἔστιν — その人のうちに真理はない."
  5: "ὃς δ᾽ ἂν τηρῇ αὐτοῦ τὸν λόγον — その御言葉を守る者 (ὁ λόγος здесь — слово Христово, отсюда 御言葉; ср. 1:1 命の言葉). τετελείωται — perfect: 全うされている (совершено и пребывает). ἐσμεν — いる."
  6: "ὀφείλει — 〜なければならない (долг). καθὼς ἐκεῖνος περιεπάτησεν — この方が歩まれたとおりに (ἐκεῖνος у Иоанна — Христос, передано この方). περιπατεῖν — 歩む, образ жизни."
  7: "ἐντολὴν παλαιάν — 古い戒め. ἣν εἴχετε ἀπ᾽ ἀρχῆς — 初めから持っている. ὁ λόγος ὃν ἠκούσατε — あなたがたが聞いた言葉: «старая заповедь» и есть слышанное слово, тождество сохранено."
  8: "πάλιν — しかし (в смысле «с другой стороны», не «опять»). ὃ ἐστιν ἀληθὲς ἐν αὐτῷ καὶ ἐν ὑμῖν — このことは、この方においても、あなたがたにおいても真である (два ἐν сохранены). παράγεται — 過ぎ去り (2:17 то же слово). τὸ φῶς τὸ ἀληθινόν — まことの光."
  9: "ὁ λέγων ἐν τῷ φωτὶ εἶναι — 光のうちにいると言いながら. ἕως ἄρτι — 今なお. Стих без сказуемого-связки в конце: 闇のうちにいる."
  10: "σκάνδαλον — つまずき (не «соблазн» в узком смысле; то, обо что спотыкаются). ἐν αὐτῷ οὐκ ἔστιν — その人のうちに…ない."
  11: "ἐτύφλωσεν τοὺς ὀφθαλμοὺς αὐτοῦ — その人の目を盲目にした. οὐκ οἶδεν ποῦ ὑπάγει — どこへ行くのかも知らない."
  12: "Γράφω — настоящее время; в ст. 13 тоже γράφω, в ст. 14 — ἔγραψα (аорист). Разница времён передана: 書いている / 書いた. ἀφέωνται — perfect pass.: 赦された (совершено и действует). διὰ τὸ ὄνομα αὐτοῦ — この方の名によって."
  13: "В базе у ст. 13 два обращения — πατέρες и νεανίσκοι; обращение παιδία стоит в базе в ст. 14 (в критическом тексте иначе, чем у jp-joc, который перенёс παιδία в ст. 13). Порядок и состав стихов — по базе. τὸν ἀπ᾽ ἀρχῆς — 初めからおられる方. νενικήκατε τὸν πονηρόν — 悪しき者に勝った (perfect)."
  14: "ἔγραψα — аорист, 書いた: у Иоанна смена времени значима (2:12–13 настоящее, 2:14 прошедшее), сохранена. παιδία — 小さな者たち (в отличие от τεκνία — 子どもたち). ἰσχυροί ἐστε — 強い. ὁ λόγος τοῦ θεοῦ — 神の言葉."
  15: "Μὴ ἀγαπᾶτε — запрет, 愛してはならない. μηδὲ τὰ ἐν τῷ κόσμῳ — 世にあるものをも. ἐάν τις ἀγαπᾷ — もしだれかが愛するなら. ἡ ἀγάπη τοῦ πατρός — 父の愛 (род. субъекта и объекта не разрешён, как и в греческом)."
  16: "ἡ ἐπιθυμία τῆς σαρκός — 肉の欲; ἡ ἐπιθυμία τῶν ὀφθαλμῶν — 目の欲; ἡ ἀλαζονεία τοῦ βίου — 暮らしの高慢 (βίος — земная жизнь, средства к жизни, не ζωή). οὐκ ἔστιν ἐκ τοῦ πατρός — 父から出たものではなく."
  17: "παράγεται — 過ぎ去る (то же слово, что в 2:8). ὁ ποιῶν τὸ θέλημα τοῦ θεοῦ — 神の御心を行う者. μένει εἰς τὸν αἰῶνα — 永遠に残る (μένω — пребывать; здесь 残る, чтобы не путать с とどまる в 2:6,10,14,24,27,28)."
  18: "Παιδία — 小さな者たち. ἐσχάτη ὥρα — 最後の時. ἀντίχριστος — 反キリスト (первое место в корпусе; слово прозрачно, сноски нет). ἀντίχριστοι πολλοί — 多くの反キリスト. ὅθεν — これによって."
  19: "ἐξ ἡμῶν ἐξῆλθαν — わたしたちの中から出て行った. οὐκ ἦσαν ἐξ ἡμῶν — もともとわたしたちのものではなかった. μεμενήκεισαν ἂν μεθ᾽ ἡμῶν — とどまっていたはずである (contr. factum с ἄν). ἀλλ᾽ ἵνα φανερωθῶσιν — しかし、…明らかになるためであった (ἀλλά с ἵνα — эллипсис: «но [это произошло] чтобы»; передано ためであった, без добавления «так вышло»)."
  20: "χρῖσμα — 注ぎの油 (помазание, от χρίω — мазать, помазывать; не χάρισμα). ἀπὸ τοῦ ἁγίου — 聖なる方から (то есть от Христа). οἴδατε πάντες — あなたがたは皆、知っている: в базе πάντες (люди), а не πάντα (всё), поэтому 皆. Сноска при первом месте в корпусе."
  21: "οὐκ ἔγραψα… ὅτι οὐκ οἴδατε — 書いたのは…知らないからではなく. πᾶν ψεῦδος ἐκ τῆς ἀληθείας οὐκ ἔστιν — 偽りはすべて真理から出ていない (πᾶν — «всякое»)."
  22: "ὁ ψεύστης — 偽り者 (ср. 2:4). ὁ ἀρνούμενος ὅτι Ἰησοῦς οὐκ ἔστιν ὁ Χριστός — イエスがキリストであることを否認する者 (греч. отрицание в придаточном, по-японски утвердительное содержание + 否認). ὁ ἀρνούμενος τὸν πατέρα καὶ τὸν υἱόν — 父と御子を否認する者."
  23: "В базе стих полон в двух членах (в критическом издании вторая половина иногда опускается — здесь она есть). οὐδὲ τὸν πατέρα ἔχει — 父をも持っていない. ὁ ὁμολογῶν — 告白する者 (ὁμολογέω — открыто говорить то же, исповедовать)."
  24: "ὑμεῖς ὃ ἠκούσατε… ἐν ὑμῖν μενέτω — あなたがたが初めから聞いたことが…とどまっているようにしなさい (императив 3-го лица μενέτω; подлежащее — ὅ ἠκούσατε, поэтому ようにしなさい, а не とどまりなさい). Условие ἐάν…μείνῃ и следствие μενεῖτε переданы とどまるなら…とどまるであろう — двойное μένω сохранено."
  25: "ἐπαγγελία — 約束 (не 知らせ, как ἀγγελία в 1:5). ἣν αὐτὸς ἐπηγγείλατο ἡμῖν — この方ご自身がわたしたちに約束されたもの, чтобы не повторять 約束 дважды. τὴν ζωὴν τὴν αἰώνιον — 永遠の命 (винительный как приложение к ἐπαγγελία)."
  26: "Τοῦτα ἔγραψα — аорист. περὶ τῶν πλανώντων ὑμᾶς — あなたがたを惑わす者たちについて (πλανάω — вводить в заблуждение)."
  27: "τὸ χρῖσμα ὃ ἐλάβετε ἀπ᾽ αὐτοῦ — この方から受けた注ぎの油. οὐ χρείαν ἔχετε ἵνα τις διδάσκῃ ὑμᾶς — だれからも教えを受ける必要はない. ὡς…διδάσκει — 〜が…教え. ἀληθές ἐστιν καὶ οὐκ ἔστιν ψεῦδος — 真であって偽りではない. καθὼς ἐδίδαξεν ὑμᾶς, μένετε ἐν αὐτῷ — 教えたとおりに…とどまりなさい (императив, не изъявительное)."
  28: "μένω — とどまる. ἵνα…σχῶμεν παρρησίαν — 大胆さを持つ (παρρησία — свободная речь перед Богом, дерзновение; в корпусе 大胆さ). μὴ αἰσχυνθῶμεν ἀπ᾽ αὐτοῦ — この方の前に恥ずかしめられない. παρουσία — 来臨."
  29: "ἐὰν εἰδῆτε — 知っているなら. γινώσκετε — 知りなさい (императив). πᾶς ὁ ποιῶν τὴν δικαιοσύνην — 義を行う者はすべて. ἐξ αὐτοῦ γεγέννηται — この方から生まれた (perfect; γεννάω — рождать, ср. 3:9)."
