# jp-box, 1-е Послание Иоанна, глава 2. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 2: Ходатай и умилостивление (1–2), исполнение заповедей (3–6),
# заповедь старая и новая, свет и тьма (7–11), обращение к детям, отцам, юношам (12–14),
# не любить мира (15–17), антихристы (18–23), помазание и пребывание (24–29).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет.
# 〔…〕 в главе нет: стих 13 в базе короче, чем у jp-joc (нет обращения к παιδία) —
# эти слова стоят в базе в ст. 14, поэтому перенос сделан без скобок (проверено по gr-lxx-byz).
# Сноска ⟨…⟩ одна — 2:20 注ぎの油 (χρῖσμα), первое место в корпусе.
# παράκλητος — 助[たす]け主[ぬし], как в Ин 14:16,26; ἱλασμός — 贖[あがな]い; jp-ni не использовался.

tr_code: jp-box
