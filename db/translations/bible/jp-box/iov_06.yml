# jp-box, Иов, глава 6. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге только главы 1–2; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 6: ответ Иова. Формула (1), пожелание взвесить его горе (2–3), стрелы Господни
# и невыносимость (4–7), жажда смерти и краткость жизни (8–13), упрёк друзьям,
# которые оказались пересохшим потоком (14–21), он ничего у них не просил (22–23),
# просьба научить и не обличать пустыми словами (24–30).
# Голоса: 6:1 — повествование (формула вне кавычек); 6:2–30 — Иов, одна цитата.
# Речь Иова продолжается в главе 7, поэтому в 6:2 открывается 「 и закрывается
# в конце 6:30; в 7:1 кавычки снова открываются (продолжение без формулы).
# Нумерация по gr: 30 стихов, у csl тоже 30; граница 16/17 в csl иная: слова
# о снеге и льде слав. относит к 6:17, gr — к 6:16 (отмечено в notes).
# 〔…〕 нет: все стихи есть в gr-lxx-byz. Сносок ⟨…⟩ нет: 獅子, 青銅, 涸れ川 и пр.
# уже в корпусе. Имена: テマン, サボン (Σαβων).
# Вложенная речь (свои слова) — 『…』 в 7:4 и 7:13; в главе 6 вложенной речи нет.

