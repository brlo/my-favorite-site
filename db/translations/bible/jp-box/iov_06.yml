verses:
  1: "ヨブは答[こた]えて言[い]った。"
  2: "「ああ、わたしの怒[いか]りが量[はか]られ、わたしの苦[くる]しみがともに秤[はかり]にかけられたなら。"
  3: "それは浜[はま]の砂[すな]よりも重[おも]いであろう。しかし、見[み]るところ、わたしの言葉[ことば]は取[と]るに足[た]りない。"
  4: "主[しゅ]の矢[や]がわたしの体[からだ]に突[つ]き刺[さ]さり、その激[はげ]しい怒[いか]りがわたしの血[ち]を飲[の]み尽[つ]くす。わたしが語[かた]り始[はじ]めると、矢はわたしを刺[さ]す。"
  5: "何[なに]か。野[の]ろばがむだに鳴[な]くことがあろうか、飼[か]い葉[ば]を求[もと]めるときではないか。牛[うし]が飼い葉を持[も]ちながら、飼[か]い槽[おけ]の前[まえ]で鳴くことがあろうか。"
  6: "塩[しお]のないパンが食[た]べられるだろうか。むなしい言葉[ことば]に味[あじ]があるだろうか。"
  7: "わたしの魂[たましい]は静[しず]まることができない。わたしの食[た]べ物[もの]が、獅子[しし]のにおいのような悪臭[あくしゅう]に見[み]えるからである。"
  8: "どうか、わたしの願[ねが]いがかない、主[しゅ]がわたしの望[のぞ]みを与[あた]えてくださるように。"
  9: "主[しゅ]がわたしを刺[さ]し始[はじ]め、ついにはわたしを滅[ほろ]ぼされないように。"
  10: "わたしの都[みやこ]がわたしの墓[はか]となり、わたしがその城壁[じょうへき]の上[うえ]を跳[と]び回[まわ]るなら。わたしは自分[じぶん]を惜[お]しまない。わたしは自分の神[かみ]の聖[せい]なる言葉[ことば]に偽[いつわ]りを言[い]わなかったからである。"
  11: "わたしに何[なん]の力[ちから]があって、耐[た]え忍[しの]べるというのか。わたしに何の先[さき]があって、わたしの魂[たましい]は耐えているというのか。"
  12: "わたしの力[ちから]は石[いし]の力なのか。わたしの肉[にく]は青銅[せいどう]なのか。"
  13: "わたしは神[かみ]に頼[たよ]っていなかったのか。しかし、助[たす]けはわたしから遠[とお]ざかっている。"
  14: "憐[あわ]れみはわたしを拒[こば]み、主[しゅ]の顧[かえり]みはわたしを見[み]捨[す]てた。"
  15: "わたしに近[ちか]い者[もの]たちはわたしを見[み]ようとしなかった。彼[かれ]らは涸[か]れ川[がわ]のように、波[なみ]のように、わたしを通[とお]り過[す]ぎて行[い]った。"
  16: "わたしを恐[おそ]れていた者[もの]たちが、今[いま]は雪[ゆき]や凍[こお]った氷[こおり]のように、わたしに襲[おそ]いかかっている。"
  17: "雪[ゆき]は暑[あつ]さが来[く]ると溶[と]けて、もはや何[なに]であったかも分[わ]からなくなる。"
  18: "同[おな]じように、わたしもすべての者[もの]から見捨[みす]てられ、滅[ほろ]び、家[いえ]を失[うしな]った。"
  19: "見張[みは]る者[もの]たちよ、テマンの道[みち]を、サボンの小径[こみち]を見[み]よ。"
  20: "町[まち]や富[とみ]に頼[たよ]る者[もの]たちは恥[はじ]を負[お]う。"
  21: "しかし、あなたがたもまた、あわれみなくわたしに襲[おそ]いかかった。わたしの傷[きず]を見[み]て、恐[おそ]れるがよい。"
  22: "何[なに]か。わたしはあなたがたに何か頼[たの]んだだろうか。あなたがたの力[ちから]を必要[ひつよう]としただろうか、"
  23: "敵[てき]からわたしを救[すく]い、強[つよ]い者[もの]の手[て]から救[すく]い出[だ]すために、そう頼[たの]んだのだろうか。"
  24: "わたしに教[おし]えてくれ。わたしは黙[だま]ろう。わたしがどこかで誤[あやま]っているなら、それを告[つ]げてくれ。"
  25: "しかし、見[み]るところ、真実[しんじつ]な者[もの]の言葉[ことば]は取[と]るに足[た]りない。わたしはあなたがたに力[ちから]を求[もと]めているのではないからである。"
  26: "あなたがたが責[せ]めても、わたしは言葉[ことば]をやめない。わたしはあなたがたの言葉の響[ひび]きに耐[た]えられないからである。"
  27: "あなたがたは孤児[みなしご]に襲[おそ]いかかり、自分[じぶん]の友[とも]に跳[と]びかかっているだけだ。"
  28: "しかし今[いま]、あなたがたの顔[かお]を見[み]ながら、わたしは偽[いつわ]りを言[い]わない。"
  29: "さあ、座[すわ]れ。不[ふ]正[せい]があってはならない。もう一度[いちど]、正[ただ]しい者[もの]とともに集[つど]え。"
  30: "わたしの舌[した]に不正[ふせい]はない。わたしの喉[のど]は悟[さと]りを思[おも]い巡[めぐ]らしているではないか。」"

notes:
  1: "Повествование. Ὑπολαβὼν δὲ Ιωβ λέγει — «И отвечал Иов и сказал» (ὑπολαμβάνω — «подхватывать, отвечать»). Формула вне кавычек; речь Иова начинается в ст. 2."
  2: "Иов. εἰ γάρ τις ἱστῶν στήσαι — «о если бы кто, взвешивая, поставил» (ἵστημι — «ставить» на весы). ὀδύνας ἐν ζυγῷ — «боли на весах»; ὁμοθυμαδόν — «вместе». Условие-пожелание продолжается в ст. 3, поэтому стих кончается без точки. Здесь открывается 「: одна цитата до 7:21."
  3: "Иов. ἄμμου παραλίας βαρυτέρα — «тяжелее песка морского» (παραλία — «побережье»). ὡς ἔοικεν — «как кажется». τὰ ῥήματά μού ἐστιν φαῦλα — «слова мои ничтожны» (φαῦλος — «дурной, пустой»); слав. «зла суть», ru «неистовы» — иное чтение."
  4: "Иов. βέλη κυρίου — «стрелы Господни»; θυμὸς αὐτῶν — «ярость их» (θυμός), т. е. яд стрел; слав. «ярость». ἐκπίνει μου τὸ αἷμα — «выпивает кровь мою». κεντοῦσί με — «колют, пронзают меня» (κεντέω)."
  5: "Иов. διὰ κενῆς — «попусту, напрасно». ὄνος ἄγριος — «дикий осёл»; σῖτα — «корм, пища»; φάτνη — «ясли». Двойной риторический вопрос с ожиданием «нет»."
  6: "Иов. ἄρτος ἄνευ ἁλός — «хлеб без соли»; γεῦμα — «вкус»; ῥήματα κενά — «пустые слова». Смысл: невкусное не едят, а пустые слова не имеют вкуса."
  7: "Иов. παύσασθαι — «успокоиться, перестать»; βρόμος — «смрад, зловоние» (гапакс); ὀσμὴ λέοντος — «запах льва». Тёмное место: собственная пища кажется ему зловонной."
  8: "Иов. εἰ γὰρ δῴη — оптатив «о если бы дал»; αἴτησις — «прошение»; ἐλπίδα δῴη — «дал бы надежду». Пожелание продолжается в ст. 9."
  9: "Иов. τρωσάτω με — импер. «да поразит меня» (τιτρώσκω); εἰς τέλος — «до конца, совершенно»; ἀνελέτω — «да не уничтожит» (ἀναιρέω). Смысл: пусть Бог начнёт казнить, но не до конца."
  10: "Иов. εἴη μου πόλις τάφος — «да будет мне город гробом» (πόλις — подлежащее, τάφος — сказуемое); ἐφ᾿ ἧς ἐπὶ τειχέων ἡλλόμην — «на стенах которого я скакал» (ἅλλομαι). Тёмное и испорченное место LXX; слав. «на егоже стенах скаках в нем», ru по МТ иначе («Это было бы еще отрадою мне»). οὐ μὴ φείσομαι — «не пощажу»; ἐψευσάμην — «я солгал»."
  11: "Иов. τίς μου ἡ ἰσχύς — «какая моя сила»; ὑπομένω — «терплю, выдерживаю»; τίς μου ὁ χρόνος — «какое моё время», т. е. какой срок или исход. ἀνέχεταί μου ἡ ψυχή — «душа моя терпит»."
  12: "Иов. μὴ ἰσχὺς λίθων — «разве сила камней»; σάρκες χάλκειαι — «плоть медная, бронзовая» (χάλκειος). Два риторических вопроса о сверхчеловеческой выносливости."
  13: "Иов. ἐπ᾿ αὐτῷ ἐπεποίθειν — «я надеялся на него» (перфект от πείθω); αὐτῷ может относиться к Богу или к самому себе, в тексте 神. βοήθεια ἀπ᾿ ἐμοῦ ἄπεστιν — «помощь далека от меня»."
  14: "Иов. ἀπείπατό με ἔλεος — «отказало мне милосердие» (ἀπαγορεύω); ἐπισκοπὴ κυρίου ὑπερεῖδέν με — «посещение Господне презрело меня» (ὑπεροράω). Тёмное место: LXX и слав. говорят об отнятой милости, ru по МТ — о сострадании друга."
  15: "Иов. οἱ ἐγγύτατοι — «самые близкие»; χειμάρρους ἐκ λείπων — «поток из оскудевших [мест]» (χειμάρρους — зимний поток, вади); κῦμα — «волна». Друзья сравниваются с пересохшим потоком."
  16: "Иов. διευλαβοῦντο — «благоговели, боялись»; ἐπιπεπτώκασι — «напали» (ἐπιπίπτω). ὥσπερ χιὼν ἢ κρύσταλλος πεπηγώς — «как снег или замёрзший лёд»: у слав. эти слова стоят в начале ст. 17, поэтому граница 16/17 в слав. иная."
  17: "Иов. τακεῖσα — «растаяв» (τήκω); θέρμης γενομένης — «когда настала теплота»; οὐκ ἐπεγνώσθη ὅπερ ἦν — «не узнано, чем было». Речь о снеге и льде; слав. относит сюда и слова о снеге из ст. 16."
  18: "Иов. κατελείφθην ὑπὸ πάντων — «я оставлен всеми»; ἀπωλόμην — «погиб»; ἔξοικος ἐγενόμην — «стал бездомным» (ἔξοικος). Уподобление друзьям-потокам завершено."
  19: "Иов. ἴδετε — импер. «смотрите»; ὁδοὺς Θαιμανων — «пути Фемана» (テマン); ἀτραποὺς Σαβων — «тропы Савона» (Σαβων — サボン, слав. «савонския»); οἱ διορῶντες — «смотрящие, наблюдающие» (διοράω)."
  20: "Иов. αἰσχύνην ὀφειλήσουσιν — «постыдятся, будут должны стыд» (ὀφειλέω — «быть должным»); οἱ ἐπὶ πόλεσιν καὶ χρήμασιν πεποιθότες — «надеющиеся на города и имущество»."
  21: "Иов. ἐπέβητέ μοι — «вы наступили на меня, напали» (ἐπιβαίνω); ἀνελεημόνως — «без милости» (ἀνελεήμων). φοβήθητε — аористный императив «убоитесь», а не прошедшее время: слав. «убойтеся», ru передаёт как «испугались»."
  22: "Иов. ᾔτησα — «я просил» (αἰτέω); ἐπιδέομαι — «нуждаюсь» (с род.). Вопрос продолжается в ст. 23, поэтому стих кончается запятой."
  23: "Иов. σῶσαί με ἐξ ἐχθρῶν — «спасти меня от врагов»; ἐκ χειρὸς δυναστῶν ῥύσασθαι — «избавить из руки властителей» (ῥύομαι). Конец вопроса, начатого в ст. 22."
  24: "Иов. διδάξατε — импер. «научите»; κωφεύσω — «замолчу» (κωφεύω); εἴ τι πεπλάνημαι — «если в чём ошибся» (πλανάω); φράσατέ μοι — «скажите мне»."
  25: "Иов. φαῦλα ἀληθινοῦ ῥήματα — «ничтожны слова истинного [человека]»; οὐ παρ᾿ ὑμῶν ἰσχὺν αἰτοῦμαι — «не у вас прошу силы». Тёмное место: слав. «зла мужа истиннаго словеса», ru по МТ иначе."
  26: "Иов. ἔλεγχος — «обличение»; παύσει — «остановит»; φθέγμα — «звук, речь» (гапакс); ἀνέξομαι — «вынесу, потерплю» (ἀνέχομαι)."
  27: "Иов. ἐπ᾿ ὀρφανῷ ἐπιπίπτετε — «на сироту нападаете»; ἐνάλλεσθε — «прыгаете, наскакиваете» (ἐνάλλομαι, гапакс); ἐπὶ φίλῳ ὑμῶν — «на друга вашего»."
  28: "Иов. εἰσβλέψας εἰς πρόσωπα ὑμῶν — «взглянув в лица ваши» (εἰσβλέπω); οὐ ψεύσομαι — «не солгу»."
  29: "Иов. καθίσατε — импер. «сядьте»; μὴ εἴη ἄδικον — «да не будет неправды»; τῷ δικαίῳ συνέρχεσθε — «сойдитесь с праведным», т. е. признайте правоту."
  30: "Иов. ἐν γλώσσῃ μου ἄδικον — «в языке моём неправда»; λάρυγξ — «гортань, глотка»; σύνεσιν μελετᾷ — «поучается разуму» (μελετάω). Здесь закрывается цитата; речь Иова продолжается в главе 7, где в 7:1 кавычки снова открываются."
