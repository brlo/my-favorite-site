# jp-box, Второзаконие, глава 6. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — csl-ru (jp-joc в гл. 6 отсутствует).
# ru (Синодальный, с масоретского) — только для понимания, не источник.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 6: речь Моисея: увещание слушать и хранить (1–3), Шема (4–5),
# слова на сердце, обучение детей, знак на руке и мезузы (6–9),
# опасность забыть Бога в довольстве (10–19), вопрос сына и ответ отца (20–25).
# Шема 6:4–5 — по формуле корпуса: 主はわたしたちの神、主は一つである。
# Вопрос сына (20) и ответ отца (21–25) — 『…』 внутри речи Моисея.
# В gr-lxx-byz 6:4 начинается вводной формулой «И вот оправдания и суды…»,
# которую csl-ru относит к концу 6:3; переведена в начале 6:4, 〔…〕 не ставится.
# Красного и синего нет; 〔…〕 нет; сносок ⟨…⟩ нет: 嗣業, 契約, 証, 定め уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: vtor
chapter: 6
draft: true

verses:
  1: "「これが、あなたがたの神[かみ]である主[しゅ]が、あなたがたに教[おし]え、そう行[おこな]わせるように命[めい]じられた戒[いまし]めと定[さだ]めと裁[さば]きのすべてである。あなたがたが入[はい]って嗣業[しぎょう]として受[う]け継[つ]ぐ地[ち]でそう行[おこな]うためである。"
  2: "あなたが、あなたの神[かみ]である主[しゅ]を恐[おそ]れ、あなたも、あなたの息子[むすこ]も、その子[こ]も、あなたの生涯[しょうがい]のすべての日[ひ]々[び]に、わたしが今日[きょう]あなたに命[めい]じる主[しゅ]の定[さだ]めと戒[いまし]めのすべてを守[まも]るためである。そうすれば、あなたがたは長[なが]く生[い]きることができる。"
  3: "イスラエルよ、聞[き]いて、守[まも]って行[おこな]いなさい。そうすれば、あなたは幸[しあわ]せになり、あなたがたは非常[ひじょう]に多[おお]く増[ふ]える。あなたの父[ちち]たちの神[かみ]である主[しゅ]が、あなたに乳[ちち]と蜜[みつ]の流[なが]れる地[ち]を与[あた]えると言[い]われたとおりである。"
  4: "聞[き]け、イスラエル。主[しゅ]はわたしたちの神[かみ]、主[しゅ]は一[ひと]つである。"
  5: "あなたは、あなたの神[かみ]である主[しゅ]を、心[こころ]を尽[つ]くし、魂[たましい]を尽[つ]くし、力[ちから]を尽[つ]くして、愛[あい]しなさい。"
  6: "わたしが今日[きょう]あなたに命[めい]じるこれらの言葉[ことば]は、あなたの心[こころ]と魂[たましい]の中[なか]になければならない。"
  7: "あなたはそれらを自分[じぶん]の息子[むすこ]たちに教[おし]え、家[いえ]に座[すわ]っているときも、道[みち]を歩[あゆ]むときも、寝[ね]るときも、起[お]きるときも、それらについて語[かた]らなければならない。"
  8: "あなたはそれを、自分[じぶん]の手[て]の上[うえ]のしるしとして結[むす]びつけ、あなたの目[め]の前[まえ]に揺[ゆ]るがないものとして置[お]かなければならない。"
  9: "あなたがたはそれを、自分[じぶん]の家[いえ]の門柱[もんちゅう]と門[もん]に書[か]きなさい。"
  10: "あなたの神[かみ]である主[しゅ]が、あなたの父[ちち]たち、アブラハム、イサク、ヤコブに、あなたに与[あた]えると誓[ちか]われた地[ち]へ、あなたを導[みちび]き入[い]れられるとき、あなたが建[た]てなかった大[おお]きく良[よ]い町[まち]々[まち]、"
  11: "すべての良[よ]いもので満[み]ちた家[いえ]々[いえ]、あなたが掘[ほ]らなかった掘[ほ]り抜[ぬ]きの井戸[いど]、あなたが植[う]えなかったぶどう園[えん]とオリーブ畑[ばたけ]をあなたに与[あた]え、あなたが食[た]べて満[み]ち足[た]りるとき、"
  12: "自分[じぶん]に気[き]をつけなさい。あなたをエジプトの地[ち]から、奴隷[どれい]の家[いえ]から導[みちび]き出[だ]した、あなたの神[かみ]である主[しゅ]を忘[わす]れてはならない。"
  13: "あなたの神[かみ]である主[しゅ]を恐[おそ]れ、主[しゅ]に仕[つか]え、主[しゅ]に結[むす]びつき、主[しゅ]の名[な]によって誓[ちか]わなければならない。"
  14: "あなたがたは、あなたがたの周囲[しゅうい]にいる民[たみ]々[びと]の神[かみ]々[がみ]、ほかの神[かみ]々[がみ]に従[したが]って行[い]ってはならない。"
  15: "あなたの神[かみ]である主[しゅ]は、あなたがたの中[なか]におられる妬[ねた]む神[かみ]である。あなたの神[かみ]である主[しゅ]の怒[いか]りがあなたがたに対して燃[も]え上[あ]がり、主[しゅ]があなたを地[ち]の面[おもて]から滅[ほろ]ぼし尽[つ]くされないためである。"
  16: "あなたがたは、あなたがたの神[かみ]である主[しゅ]を試[ため]してはならない。あなたがたが試[ため]しの場所[ばしょ]で試[ため]したようにしてはならない。"
  17: "あなたがたは、あなたがたの神[かみ]である主[しゅ]の戒[いまし]めと、主[しゅ]があなたに命[めい]じられた証[あかし]と定[さだ]めを、固[かた]く守[まも]らなければならない。"
  18: "あなたは、あなたの神[かみ]である主[しゅ]の前[まえ]で、主[しゅ]に喜[よろこ]ばれ、良[よ]いことを行[おこな]いなさい。そうすれば、あなたは幸[しあわ]せになり、主[しゅ]があなたの父[ちち]たちに誓[ちか]われた良[よ]い地[ち]に入[はい]って、それを嗣業[しぎょう]として受[う]け継[つ]ぐことができる。"
  19: "主[しゅ]は、言[い]われたとおりに、あなたの敵[てき]をすべてあなたの前[まえ]から追[お]い払[はら]われる。"
  20: "あなたの息子[むすこ]が、後[のち]の日[ひ]にあなたに尋[たず]ねて『あなたがたの神[かみ]である主[しゅ]があなたがたに命[めい]じられたこの証[あかし]と定[さだ]めと裁[さば]きは、何[なん]ですか』と言[い]うなら、"
  21: "あなたは自分の息子[むすこ]に言[い]わなければならない。『わたしたちはエジプトの地[ち]でファラオの奴隷[どれい]であった。主[しゅ]は強[つよ]い手[て]と高[たか]く上[あ]げた腕[うで]によって、わたしたちをそこから導[みちび]き出[だ]された。"
  22: "主[しゅ]はエジプトで、ファラオとその家[いえ]に、わたしたちの目[め]の前[まえ]で、大[おお]きく悪[わる]いしるしと不思議[ふしぎ]を行[おこな]われた。"
  23: "そして、わたしたちをそこから導[みちび]き出[だ]し、わたしたちにこの地[ち]を与[あた]えるために、わたしたちを導[みちび]き入[い]れられた。"
  24: "主[しゅ]は、わたしたちがこれらの定[さだ]めをすべて行[おこな]い、わたしたちの神[かみ]である主[しゅ]を恐[おそ]れるように、わたしたちに命[めい]じられた。それは、わたしたちがすべての日[ひ]々[び]幸[しあわ]せであり、今日[きょう]もそうであるように生[い]きるためである。"
  25: "わたしたちが、わたしたちの神[かみ]である主[しゅ]の前[まえ]で、主[しゅ]がわたしたちに命[めい]じられたとおりに、これらの戒[いまし]めをすべて守[まも]って行[おこな]うなら、それがわたしたちの義[ぎ]となるであろう。』」"

notes:
  1: "αὗται αἱ ἐντολαί — вот эти заповеди. δικαιώματα, κρίματα — 定め, 裁き. εἰσπορεύεσθε ἐκεῖ κληρονομῆσαι — «входите туда наследовать» (ἐκεῖ плеоназм при εἰσπορεύεσθε; слав. «тамо»). οὕτως — так, именно так."
  2: "φοβῆσθε … φυλάσσεσθαι — дабы боялись и хранили (инфинитив как дополнение). ὅσας ἐντέλλομαί σοι — которые заповедую тебе (ед. ч., при «ты и сыны твои»). μακροημερεύσητε — долгоденствовать будете."
  3: "ἄκουσον … φύλαξαι ποιεῖν — слушай и храни исполнять. πληθυνθῆτε σφόδρα — умножитесь весьма. γῆν ῥέουσαν γάλα καὶ μέλι — землю, текущую молоком и мёдом. Слав. в конце стиха добавляет «И сия оправдания и суды… в пустыни» — эти слова в греч. стоят в начале 6:4, поэтому переведены там, а не здесь; 〔…〕 не ставим."
  4: "В gr-lxx-byz перед Шемой стоит вводная формула «И вот оправдания и суды, которые заповедал Господь сынам Израиля в пустыне, по выходе их из земли Египетской» (в масоретском тексте это 4:45); она повторяет 6:1, и в csl её нет. По решению держаться csl формула в текст не внесена, Шема начинается с Ἄκουε. Ἄκουε, Ισραηλ — слушай, Израиль. κύριος ὁ θεὸς ἡμῶν κύριος εἷς ἐστιν — Господь Бог наш Господь един есть."
  5: "ἐξ ὅλης τῆς καρδίας … ψυχῆς … δυνάμεως — всем сердцем, всей душой, всей силой; тройное ἐξ ὅλης сохранено: 心を尽くし、魂を尽くし、力を尽くして. ἀγαπήσεις — возлюбишь (будущее в значении повеления)."
  6: "ἔσται … ἐν τῇ καρδίᾳ σου καὶ ἐν τῇ ψυχῇ σου — будут в сердце твоём и в душе твоей (в Синодальном «в сердце твоём» без души). ῥήματα — слова, 言葉."
  7: "προβιβάσεις — наставишь, научишь (προβιβάζω «продвигать»). καθήμενος … πορευόμενος … κοιταζόμενος … διανιστάμενος — сидя, идя, лёжа и вставая; четыре обстоятельства сохранены. λαλήσεις ἐν αὐτοῖς — будешь говорить о них."
  8: "ἀφάψεις — привяжешь (ἅπτω). εἰς σημεῖον ἐπὶ τῆς χειρός — в знак на руку. ἀσάλευτον πρὸ ὀφθαλμῶν — непоколебимо пред глазами (ἀσάλευτος «недвижимый»); это не «повязка на лбу» — такое понимание масоретское."
  9: "γράψετε — напишете (мн. ч. после ед. ч. в ст. 8). φλιάς — косяки, 門柱. πύλας — ворота."
  10: "εἰσαγάγῃ σε — введёт тебя. ὤμοσεν τοῖς πατράσιν — клялся отцам. πόλεις μεγάλας καὶ καλάς — города большие и хорошие. Здесь начинается длинный период, который продолжается до 6:12."
  11: "οἰκίας πλήρεις πάντων ἀγαθῶν — дома, полные всякого добра. λάκκους λελατομημένους — высеченные водоёмы (λατομέω «высекать в камне»). ἀμπελῶνας καὶ ἐλαιῶνας — виноградники и масличные сады. ἐμπλησθείς — насытившись."
  12: "πρόσεχε σεαυτῷ — внимай себе. Слав. добавляет «да не разширится сердце твое»; в греч. этого нет (отголосок 8:14), поэтому не переводим и в 〔…〕 не берём. ἐξ οἴκου δουλείας — из дома рабства."
  13: "κύριον … φοβηθήσῃ — Господа бойся. αὐτῷ λατρεύσεις — Ему служи (без «единому»: это слав. добавка). πρὸς αὐτὸν κολληθήσῃ — к Нему прилепишься (κολλάω). τῷ ὀνόματι αὐτοῦ ὀμῇ — именем Его клянись."
  14: "οὐ πορεύσεσθε ὀπίσω — не пойдёте вслед. τῶν ἐθνῶν τῶν περικύκλῳ ὑμῶν — народов, окружающих вас (περικύκλῳ «вокруг»)."
  15: "θεὸς ζηλωτής — Бог ревнитель. μὴ ὀργισθεὶς θυμωθῇ — да не воспламенившись воспылает (удвоение). ἐξολεθρεύσῃ — истребит. ἀπὸ προσώπου τῆς γῆς — от лица земли."
  16: "ἐκπειράσεις — искусишь, испытаешь. ἐν τῷ Πειρασμῷ — «в Искушении»: LXX передаёт название места Масса (евр. «испытание») греческим словом; отсюда 試しの場所."
  17: "φυλάσσων φυλάξῃ — храня сохрани (удвоение). μαρτύρια — 証, свидетельства. δικαιώματα — 定め."
  18: "τὸ ἀρεστὸν καὶ τὸ καλόν — угодное и доброе. ἐναντίον κυρίου — пред Господом. ἵνα εὖ σοι γένηται — чтобы благо тебе было."
  19: "ἐκδιῶξαι — изгнать, прогнать (ἐκδιώκω). καθὰ ἐλάλησεν — как сказал."
  20: "ἐρωτήσῃ … αὔριον — спросит завтра (αὔριον здесь в значении «в будущем»; слав. «утре»). μαρτύρια, δικαιώματα, κρίματα — 証, 定め, 裁き. Вопрос сына — в 『…』."
  21: "Οἰκέται ἦμεν τῷ Φαραω — мы были рабами фараона. ἐν χειρὶ κραταιᾷ καὶ ἐν βραχίονι ὑψηλῷ — рукою крепкою и мышцею высокою. Ответ отца — в 『…』 до конца главы."
  22: "σημεῖα καὶ τέρατα μεγάλα καὶ πονηρά — знамения и чудеса великие и злые (πονηρά — о казнях; Синодальный сглаживает: «казни»). ἐνώπιον ἡμῶν — пред нами."
  23: "ἵνα εἰσαγάγῃ … δοῦναι — чтобы ввести и дать. ὤμοσεν τοῖς πατράσιν ἡμῶν — клялся отцам нашим."
  24: "ἐνετείλατο … ποιεῖν … φοβεῖσθαι — заповедал исполнять и бояться (два инфинитива). ἵνα ζῶμεν ὥσπερ καὶ σήμερον — чтобы жить, как и сегодня."
  25: "ἐλεημοσύνη — милостыня, милость (евр. צְדָקָה «правда»); слав. «милосердие», Синодальный «праведность». В контексте завета слово означает праведность, поэтому 義; греческое слово указано здесь."
