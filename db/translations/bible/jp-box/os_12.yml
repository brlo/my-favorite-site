chapter: 12
draft: true

verses:
  1: "エフライムは悪[わる]い霊[れい]で、一日[いちにち]中[じゅう]焼[や]けつく風[かぜ]を追[お]いかけた。むなしいこと、空[そら]しいことを重[かさ]ね、アッシリアと契約[けいやく]を結[むす]び、油[あぶら]をエジプトへ運[はこ]んだ。"
  2: "主[しゅ]はユダと争[あらそ]い、ヤコブの罰[ばつ]を求[もと]める。主[しゅ]は彼の道[みち]に従[したが]って、その行[おこな]いに従[したが]って彼に報[むく]いる。"
  3: "彼は母[はは]の胎[たい]で兄[あに]のかかとを掴[つか]み、力[ちから]を尽[つ]くして神[かみ]と争[あらそ]った。"
  4: "彼は御使[みつかい]と争[あらそ]って勝[か]った。彼らは泣[な]いてわたしに懇願[こんがん]した。彼らはオンの家[いえ]でわたしを見[み]つけ、そこで彼に語[かた]られた。"
  5: "主[しゅ]である全能[ぜんのう]の神[かみ]が、彼の記念[きねん]となる。"
  6: "あなたもまた、あなたの神[かみ]によって帰[かえ]る。あわれみと裁[さば]きを守[まも]り、いつもあなたの神[かみ]に近[ちか]づけ。"
  7: "カナンはその手[て]に不正[ふせい]のはかりを持[も]ち、人[ひと]を虐[しいた]げることを愛[あい]した。"
  8: "エフライムは言[い]った。『わたしは富[とみ]を得[え]、自分[じぶん]のために憩[いこ]いを見[み]つけた』と。彼のすべての労苦[ろうく]は、彼が犯[おか]した不法[ふほう]のゆえに、彼のものとして認[みと]められない。"
  9: "わたしはあなたの神[かみ]である主[しゅ]、あなたをエジプトの地[ち]から上[のぼ]らせた者[もの]である。わたしはあなたを、祭[まつ]りの日[ひ]のように、天幕[てんまく]に住[す]まわせる。"
  10: "わたしは預言者[よげんしゃ]たちに語[かた]り、幻[まぼろし]を多[おお]くし、預言者[よげんしゃ]たちの手[て]によって、わたしは彼らに似[に]た者[もの]とされた。"
  11: "もしギレアデがむなしいものでないなら、ギルガルでいけにえをささげる君[きみ]たちは偽[いつわ]り者[もの]であった。彼らの祭壇[さいだん]は荒[あ]れ地[ち]の亀[かめ]のようである。"
  12: "ヤコブはシリアの野[の]へ逃[に]げ、イスラエルは妻[つま]のために仕[つか]え、妻[つま]のために羊[ひつじ]を守[まも]った。"
  13: "主[しゅ]は預言者[よげんしゃ]によってイスラエルをエジプトから上[のぼ]らせ、預言者[よげんしゃ]によって彼を守[まも]られた。"
  14: "エフライムは激[はげ]しく怒[いか]って主[しゅ]を怒[いか]らせた。その血[ち]は彼の上[うえ]に注[そそ]がれ、主[しゅ]はその恥辱[ちじょく]を彼に返[かえ]される」。"

notes:
  1: "ὁ δὲ Εφραιμ πονηρὸν πνεῦμα — «Ефрем же — злой дух» (слав. «ефрем же зол дух»); ἐδίωξεν καύσωνα ὅλην τὴν ἡμέραν — «гнал зной весь день» (καύσων — палящий ветер, 焼けつく風); κενὰ καὶ μάταια ἐπλήθυνεν — «умножил пустое и суетное»; διαθήκην μετὰ Ἀσσυρίων διέθετο — «завет с Ассирийцами заключил»; ἔλαιον εἰς Αἴγυπτον ἐνεπορεύετο — «елей в Египет отвозил» (ἐμπορεύομαι — везти на продажу)."
  2: "καὶ κρίσις τῷ κυρίῳ πρὸς Ιουδαν — «и суд (тяжба) у Господа с Иудой»; τοῦ ἐκδικῆσαι τὸν Ιακωβ — «чтобы взыскать (отмстить) Иакова» (ἐκδικέω); κατὰ τὰς ὁδοὺς αὐτοῦ — «по путям его»; κατὰ τὰ ἐπιτηδεύματα αὐτοῦ ἀνταποδώσει αὐτῷ — «по делам его воздаст ему» (ἐπιτήδευμα — дело, занятие)."
  3: "ἐν τῇ κοιλίᾳ ἐπτέρνισεν τὸν ἀδελφὸν αὐτοῦ — «во чреве запнул (схватил за пяту) брата своего» (πτερνίζω — бить пятой; слав. «запя»); ἐν κόποις αὐτοῦ ἐνίσχυσεν πρὸς θεόν — «в трудах своих стал силён пред Богом» (κόπος — труд, усилие)."
  4: "ἐνίσχυσεν μετὰ ἀγγέλου καὶ ἠδυνάσθη — «стал силён с Ангелом и превозмог»; ἔκλαυσαν καὶ ἐδεήθησάν μου — «плакали и умоляли Меня» (παρακαλέω; мн. ч., хотя речь об Иакове); ἐν τῷ οἴκῳ Ων εὕροσάν με — «в доме Он нашли Меня» (= Вефиль, オンの家); ἐκεῖ ἐλαλήθη πρὸς αὐτόν — «там говорилось ему»."
  5: "ὁ κύριος ὁ θεὸς ὁ παντοκράτωρ — «Господь Бог Вседержитель» (παντοκράτωρ — 全能); ἔσται μνημόσυνον αὐτοῦ — «будет память его» (μνημόσυνον — памятование, 記念)."
  6: "καὶ σὺ ἐν θεῷ σου ἐπιστρέψεις — «и ты в Боге твоём обратишься»; ἔλεον καὶ κρίμα φυλάσσου — «милость и суд соблюдай» (φυλάσσω — хранить); ἔγγιζε πρὸς τὸν θεόν σου διὰ παντός — «приближайся к Богу твоему всегда» (ἐγγίζω)."
  7: "Χανααν ἐν χειρὶ αὐτοῦ ζυγὸς ἀδικίας — «Ханаан, в руке его весы неправды» (ζυγός — весы, ярмо; 不正のはかり); καταδυναστεύειν ἠγάπησε — «притеснять возлюбил» (καταδυναστεύω — насильствовать)."
  8: "καὶ εἶπεν Εφραιμ Πλὴν πεπλούτηκα — «и сказал Ефрем: я обогатился» (πλουτέω); εὕρηκα ἀναψυχὴν ἐμαυτῷ — «нашёл себе отраду» (ἀναψυχή — облегчение, прохлада); πάντες οἱ πόνοι αὐτοῦ οὐχ εὑρεθήσονται αὐτῷ δι᾿ ἀδικίας, ἃς ἥμαρτεν — «все труды его не найдутся у него из-за неправды, которою согрешил» (смысл тёмный, слав. «вси труды его не обрящутся ему ради неправд, имиже согреши»). Слова Ефрема — 『…』; вторая половина стиха — уже слово Господа (3-е лицо, «οὐχ εὑρεθήσονται αὐτῷ» — «не найдутся (не вменятся) ему»)."
  9: "ἐγὼ δὲ κύριος ὁ θεός σου ἀνήγαγόν σε ἐκ γῆς Αἰγύπτου — «Я же Господь Бог твой, изведший тебя из земли Египетской» (ἀνάγω); ἔτι κατοικιῶ σε ἐν σκηναῖς — «ещё поселю тебя в шатрах (кущах)» (σκηνή — шатёр, 天幕); καθὼς ἡμέρᾳ ἑορτῆς — «как в день праздника» (ἑορτή)."
  10: "καὶ λαλήσω πρὸς προφήτας — «и буду говорить к пророкам»; ἐγὼ ὁράσεις ἐπλήθυνα — «Я умножил видения» (ὅρασις — видение, 幻); ἐν χερσὶν προφητῶν ὡμοιώθην — «в руках пророков уподобился» (ὁμοιόω; слав. «в руках пророческих уподобихся»), т.е. говорил через них притчами."
  11: "εἰ μὴ Γαλααδ ἔστιν — «если Галаад не есть (не то)» (слав. «аще не галаад есть»); ἄρα ψευδεῖς ἦσαν ἐν Γαλγαλ ἄρχοντες θυσιάζοντες — «то лживы были в Галгале князья, приносящие жертвы»; τὰ θυσιαστήρια αὐτῶν ὡς χελῶναι ἐπὶ χέρσον ἀγροῦ — «жертвенники их как черепахи на невозделанном поле» (χελώνη — черепаха, 亀; в евр./ru «груды камней»; слав. «якоже желви на целизне польстей»)."
  12: "ἀνεχώρησεν Ιακωβ εἰς πεδίον Συρίας — «удалился Иаков на поле Сирии» (ἀναχωρέω); ἐδούλευσεν Ισραηλ ἐν γυναικὶ — «служил Израиль за жену» (δουλεύω); ἐν γυναικὶ ἐφυλάξατο — «и за жену стерёг (стада)» (φυλάσσω)."
  13: "ἐν προφήτῃ ἀνήγαγεν κύριος τὸν Ισραηλ ἐξ Αἰγύπτου — «через пророка вывел Господь Израиля из Египта» (ἐν προφήτῃ — «в пророке», т.е. через пророка); ἐν προφήτῃ διεφυλάχθη — «и через пророка сохранён был» (διαφυλάσσω)."
  14: "ἐθύμωσεν Εφραιμ καὶ παρώργισεν — «воспылал Ефрем и раздражил» (θυμόω, παροργίζω); τὸ αἷμα αὐτοῦ ἐπ᾿ αὐτὸν ἐκχυθήσεται — «кровь его на него изольётся» (ἐκχέω); τὸν ὀνειδισμὸν αὐτοῦ ἀνταποδώσει αὐτῷ κύριος — «и поношение его воздаст ему Господь» (ὀνειδισμός — поношение, 恥辱). Здесь слово Господа закрывается."
