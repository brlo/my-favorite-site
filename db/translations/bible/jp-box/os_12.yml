# jp-box, Осия, глава 12. Черновик для приёмки.
#
# Нумерация — по славяно-синодальной (см. шапку ниже).
#
# --- прежние заметки (нумерация по гр.) ---
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по gr-lxx-byz (= jp-ni): наш 12:1 в славяно-синодальной — 11:12,
# дальше сдвиг на один стих (наш 12:2 = слав. 12:1 и т.д.); в notes сверка по слав.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: 1 Ефрем окружил ложью, дом Израиля и Иуда нечестием, «народ святой»;
# 2 Ефрем — злой дух, гонит зной, завет с Ассирией, елей в Египет; 3 суд Господа с Иудой,
# воздаяние Иакову; 4–5 во чреве запнул брата, боролся с Богом и Ангелом, плакал,
# Вефиль; 6 Господь Вседержитель — память его; 7 обратись, милость и суд соблюдай;
# 8 Ханаан с неверными весами; 9 слова Ефрема «я разбогател»; 10–11 «Я Господь Бог твой
# от земли Египетской», кущи, видения и притчи пророков; 12 Галаад и Галгал, черепахи
# на поле; 13–14 Иаков в Сирии, пророк вывел из Египта; 15 гнев Ефрема, кровь на нём.
# Голоса: 1–15 — одно слово Господа в 「…」 (в 9 слова Ефрема — 『…』; закрывается в 15).
# 12:1: в слав. этот стих — 11:12 («Обыде мя лжею ефрем…»).
# 12:5: «ἔκλαυσαν» — мн. ч., хотя речь об Иакове; оставлено как в греческом.
# 12:12: «χελῶναι» — черепахи (слав. «желви»); в евр./ru «груды камней».
#
