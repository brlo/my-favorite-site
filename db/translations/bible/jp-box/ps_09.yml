verses:
  0: "指揮者[しきしゃ]に。子[こ]の隠[かく]れたことについて。ダビデの詩[うた]。"
  1: "主[しゅ]よ、わたしは心[こころ]を尽[つ]くしてあなたをほめたたえ、あなたのすべての驚[おどろ]くべきわざを語[かた]り告[つ]げる。"
  2: "わたしはあなたのうちで喜[よろこ]び、小躍[こおど]りする。いと高[たか]い者[もの]よ、わたしはあなたの名[な]をほめ歌[うた]う。"
  3: "わたしの敵[てき]が後[うし]ろへ退[しりぞ]くと、彼[かれ]らは弱[よわ]まり、あなたの前[まえ]から滅[ほろ]びる。"
  4: "あなたはわたしの裁[さば]きとわたしの訴[うった]えとをなされたからである。あなたは正[ただ]しい裁[さば]きをなさる方[かた]として、王座[おうざ]に着[つ]かれた。"
  5: "あなたは諸民[しょみん]をとがめ、悪[わる]い者[もの]は滅[ほろ]びた。あなたは彼[かれ]らの名[な]を、とこしえに、世々[よよ]に消[け]し去[さ]った。"
  6: "敵[てき]の剣[つるぎ]は全[まった]く尽[つ]き、あなたは町々[まちまち]を打[う]ち壊[こわ]された。彼[かれ]らの記[き]念[ねん]は響[ひび]きとともに滅[ほろ]びた。"
  7: "しかし、主[しゅ]はとこしえに座[すわ]しておられ、裁[さば]きのためにご自分の王座[おうざ]を備[そな]えられた。"
  8: "主[しゅ]は義[ぎ]をもって世[よ]を裁[さば]き、正[しょう]直[じき]をもって諸民[しょみん]を裁[さば]かれる。"
  9: "主[しゅ]は貧[まず]しい者[もの]の逃[に]げ場[ば]となられた。苦[くる]しみのうちにあるとき、折[おり]にかなった助[たす]けとなる方[かた]である。"
  10: "あなたの名[な]を知[し]る者[もの]はあなたに寄[よ]り頼[たの]むように。主[しゅ]よ、あなたはご自分を求[もと]める者[もの]を見捨[みす]てられないからである。"
  11: "シオンに住[す]まわれる主[しゅ]にほめ歌[うた]い、そのわざを諸民[しょみん]の間[あいだ]に告[つ]げ知[し]らせよ。"
  12: "主[しゅ]は彼[かれ]らの血[ち]を問[と]う方[かた]として、それを覚[おぼ]えておられ、苦[くる]しむ者[もの]の叫[さけ]びを忘[わす]れなかったからである。"
  13: "主[しゅ]よ、わたしをあわれみ、わたしの敵[てき]によるわたしの卑[ひ]下[げ]をご覧[らん]ください。あなたはわたしを死[し]の門[もん]から高[たか]く上[あ]げてくださる方[かた]である。"
  14: "それは、わたしがあなたのすべての賛美[さんび]を、シオンの娘[むすめ]の門[もん]で告[つ]げ知[し]らせるためである。わたしはあなたの救[すく]いによって小躍[こおど]りする。"
  15: "諸民[しょみん]は自分[じぶん]の造[つく]った滅[ほろ]びに沈[しず]み、自分[じぶん]の隠[かく]した網[あみ]に捕[つか]まれ、その足[あし]が捕[と]らえられた。"
  16: "主[しゅ]は裁[さば]きを行[おこな]う方[かた]として知[し]られている。罪[つみ]人[びと]は自分[じぶん]の手[て]のわざに捕[と]らえられた。"
  17: "罪[つみ]人[びと]は陰府[よみ]へ帰[かえ]るがよい。神[かみ]を忘[わす]れるすべての民[たみ]も。"
  18: "貧[まず]しい者[もの]は全[まった]く忘[わす]れられることはなく、苦[くる]しむ者[もの]の待[ま]ち望[のぞ]みはとこしえに滅[ほろ]びないからである。"
  19: "主[しゅ]よ、立[た]ち上[あ]がってください。人[ひと]が力[ちから]を強[つよ]めてはならない。諸民[しょみん]があなたの前[まえ]で裁[さば]かれるように。"
  20: "主[しゅ]よ、彼[かれ]らの上[うえ]に法[ほう]を定[さだ]める者[もの]を立[た]ててください。諸民[しょみん]が、自分[じぶん]たちは人[ひと]にすぎないことを知[し]るように。"
  21: "主[しゅ]よ、なぜ遠[とお]く立[た]ち、苦[くる]しみのとき、身[み]を隠[かく]されるのか。"
  22: "悪[わる]い者[もの]が高[たか]ぶるので、貧[まず]しい者[もの]は焼[や]かれる。彼[かれ]らは自分[じぶん]たちがめぐらす謀[はか]りごとに捕[つか]まる。"
  23: "罪[つみ]人[びと]はその魂[たましい]の欲[よく]によって自[みずか]らをほめ、利[り]を貪[むさぼ]る者[もの]は自[みずか]らをほめたたえる。"
  24: "罪[つみ]人[びと]は主[しゅ]を怒[いか]らせた。その怒[いか]りが多[おお]いので、彼[かれ]は問[と]おうともしない。そのすべての思[おも]いのうちに、神[かみ]はいない。"
  25: "その道[みち]はいつも汚[けが]れている。あなたの裁[さば]きは彼[かれ]の前[まえ]から取[と]り去[さ]られている。彼[かれ]はすべての敵[てき]を支[し]配[はい]する。"
  26: "彼[かれ]は心[こころ]のうちに言[い]った。「わたしは揺[ゆ]らがない。代々[よよ]、災[わざわ]いに遭[あ]わない」と。"
  27: "その口[くち]は呪[のろ]いと苦[にが]さと欺[あざむ]きに満[み]ち、その舌[した]の下[した]には労苦[ろうく]と痛[いた]みがある。"
  28: "彼[かれ]は富[とみ]ある者[もの]たちとともに、隠[かく]れた所[ところ]で待[ま]ち伏[ぶ]せして座[すわ]り、罪[つみ]のない者[もの]を殺[ころ]そうとする。その目[め]は貧[まず]しい者[もの]をうかがう。"
  29: "隠[かく]れた所[ところ]で、獅子[しし]がその穴[あな]にいるように待[ま]ち伏[ぶ]せる。貧[まず]しい者[もの]を捕[つか]まえ、引[ひ]き寄[よ]せて自分の網[あみ]に引[ひ]き入[い]れようと待[ま]ち伏[ぶ]せる。"
  30: "彼[かれ]は身[み]をかがめて伏[ふ]せる。貧[まず]しい者[もの]は、その強[つよ]い爪[つめ]に落[お]ちる。"
  31: "彼[かれ]は心[こころ]のうちに言[い]った。「神[かみ]は忘[わす]れた。顔[かお]を背[そ]けて、とこしえに見[み]ることはない」と。"
  32: "主[しゅ]、わたしの神[かみ]よ、立[た]ち上[あ]がって、手[て]を上[あ]げてください。貧[まず]しい者[もの]たちを忘[わす]れないでください。"
  33: "なぜ、悪[わる]い者[もの]は神[かみ]を怒[いか]らせるのか。彼[かれ]は心[こころ]のうちに言[い]った。「あなたは問[と]おうとしない」と。"
  34: "あなたは見[み]ておられる。労苦[ろうく]と怒[いか]りをあなたは顧[かえり]み、彼[かれ]らをあなたの手[て]に委[ゆだ]ねようとしておられる。貧[まず]しい者[もの]はあなたに委[ゆだ]ねられている。あなたはみなしごの助[たす]けである。"
  35: "罪[つみ]人[びと]と悪[わる]い者[もの]の腕[うで]を砕[くだ]いてください。その罪[つみ]は問[と]われても、もはや見[み]つからない。"
  36: "主[しゅ]は王[おう]として、とこしえに、世々[よよ]にいます。諸民[しょみん]よ、あなたがたは主[しゅ]の地[ち]から滅[ほろ]びる。"
  37: "主[しゅ]よ、あなたは貧[まず]しい者[もの]たちの願[ねが]いを聞[き]かれた。あなたは彼[かれ]らの心[こころ]の備[そな]えに耳[みみ]を傾[かたむ]けられた。"
  38: "みなしごと苦[くる]しむ者[もの]のために裁[さば]きを行[おこな]い、人[ひと]がもはや地[ち]の上[うえ]で高[たか]ぶって語[かた]らないようにするためである。"

notes:
  0: "Εἰς τὸ τέλος, ὑπὲρ τῶν κρυφίων τοῦ υἱοῦ· ψαλμὸς τῷ Δαυιδ — 指揮者に。子の隠れたことについて。ダビデの詩 (κρύφια τοῦ υἱοῦ — «тайны сына», в церковнослав. «о тайных сына»; Синодальный передаёт по евр. «по смерти Лавена»; в переводе — по греч.). Надписание — стих 0."
  1: "Ἐξομολογήσομαί σοι, κύριε, ἐν ὅλῃ καρδίᾳ μου — 主よ、わたしは心を尽くしてあなたをほめたたえ (ἐξομολογέομαι — «славить, исповедовать»; ἐν ὅλῃ καρδίᾳ — «всем сердцем»). διηγήσομαι πάντα τὰ θαυμάσιά σου — あなたのすべての驚くべきわざを語り告げる (διηγέομαι — «повествовать»; θαυμάσιος — «дивный»)."
  2: "εὐφρανθήσομαι καὶ ἀγαλλιάσομαι ἐν σοί — わたしはあなたのうちで喜び、小躍りする (εὐφραίνομαι — «веселиться»; ἀγαλλιάομαι — «ликовать»). ψαλῶ τῷ ὀνόματί σου, ὕψιστε — いと高い者よ、わたしはあなたの名をほめ歌う (ὕψιστε — звательная форма от ὕψιστος)."
  3: "ἐν τῷ ἀποστραφῆναι τὸν ἐχθρόν μου εἰς τὰ ὀπίσω — わたしの敵が後ろへ退くと (ἀποστρέφω — «поворачивать назад»; εἰς τὰ ὀπίσω — «вспять»). ἀσθενήσουσιν καὶ ἀπολοῦνται ἀπὸ προσώπου σου — 彼らは弱まり、あなたの前から滅びる (ἀσθενέω — «изнемогать»; ἀπὸ προσώπου — «от лица»)."
  4: "ὅτι ἐποίησας τὴν κρίσιν μου καὶ τὴν δίκην μου — あなたはわたしの裁きとわたしの訴えとをなされたからである (κρίσις — 裁き; δίκη — «тяжба, правда»). ἐκάθισας ἐπὶ θρόνου, ὁ κρίνων δικαιοσύνην — あなたは正しい裁きをなさる方として、王座に着かれた (θρόνος — 王座)."
  5: "ἐπετίμησας ἔθνεσιν — あなたは諸民をとがめ (ἐπιτιμάω — «запрещать, обличать»). ἀπώλετο ὁ ἀσεβής — 悪い者は滅びた. τὸ ὄνομα αὐτῶν ἐξήλειψας εἰς τὸν αἰῶνα καὶ εἰς τὸν αἰῶνα τοῦ αἰῶνος — 彼らの名を、とこしえに、世々に消し去った (ἐξαλείφω — «изглаживать»; удвоение «в век и в век века» передано とこしえに、世々に)."
  6: "τοῦ ἐχθροῦ ἐξέλιπον αἱ ῥομφαῖαι εἰς τέλος — 敵の剣は全く尽き (ἐκλείπω — «оскудевать»; ῥομφαία — «меч»; plural — 剣). πόλεις καθεῖλες — あなたは町々を打ち壊された (καθαιρέω — «разрушать»). ἀπώλετο τὸ μνημόσυνον αὐτῶν μετ᾽ ἤχους — 彼らの記念は響きとともに滅びた (μνημόσυνον — «память»; ἦχος — «звук, шум»)."
  7: "καὶ ὁ κύριος εἰς τὸν αἰῶνα μένει — しかし、主はとこしえに座しておられ (μένω — «пребывать»). ἡτοίμασεν ἐν κρίσει τὸν θρόνον αὐτοῦ — 裁きのためにご自分の王座を備えられた (ἑτοιμάζω — «готовить»)."
  8: "καὶ αὐτὸς κρινεῖ τὴν οἰκουμένην ἐν δικαιοσύνῃ — 主は義をもって世を裁き (οἰκουμένη — «вселенная»). κρινεῖ λαοὺς ἐν εὐθύτητι — 正直をもって諸民を裁かれる (εὐθύτης — «прямота, правота»)."
  9: "καὶ ἐγένετο κύριος καταφυγὴ τῷ πένητι — 主は貧しい者の逃げ場となられた (καταφυγή — «прибежище»; πένης — «нищий, бедный»). βοηθὸς ἐν εὐκαιρίαις ἐν θλίψει — 苦しみのうちにあるとき、折にかなった助けとなる方である (εὐκαιρία — «благовременность»; θλῖψις — «скорбь»)."
  10: "καὶ ἐλπισάτωσαν ἐπὶ σὲ οἱ γινώσκοντες τὸ ὄνομά σου — あなたの名を知る者はあなたに寄り頼むように (ἐλπίζω ἐπί — «надеяться на»). ὅτι οὐκ ἐγκατέλιπες τοὺς ἐκζητοῦντάς σε — あなたはご自分を求める者を見捨てられない (ἐγκαταλείπω — «оставлять»; ἐκζητέω — «взыскивать»)."
  11: "ψάλατε τῷ κυρίῳ τῷ κατοικοῦντι ἐν Σιων — シオンに住まわれる主にほめ歌い (ψάλλω — «петь под струны»; κατοικέω — «обитать»). ἀναγγείλατε ἐν τοῖς ἔθνεσιν τὰ ἐπιτηδεύματα αὐτοῦ — そのわざを諸民の間に告げ知らせよ (ἀναγγέλλω — «возвещать»; ἐπιτήδευμα — «дело, занятие»)."
  12: "ὅτι ἐκζητῶν τὰ αἵματα αὐτῶν ἐμνήσθη — 主は彼らの血を問う方として、それを覚えておられ (ἐκζητέω τὰ αἵματα — «взыскивать кровь», т. е. требовать ответа за пролитую кровь). οὐκ ἐπελάθετο τῆς κραυγῆς τῶν πενήτων — 苦しむ者の叫びを忘れなかった (ἐπιλανθάνομαι — «забывать»; κραυγή — 叫び)."
  13: "ἐλέησόν με, κύριε, ἰδὲ τὴν ταπείνωσίν μου ἐκ τῶν ἐχθρῶν μου — 主よ、わたしをあわれみ、わたしの敵によるわたしの卑下をご覧ください (ταπείνωσις — «уничижение»; ἐκ τῶν ἐχθρῶν — «от врагов», т. е. причиняемое ими). ὁ ὑψῶν με ἐκ τῶν πυλῶν τοῦ θανάτου — わたしを死の門から高く上げてくださる方 (πύλη — 門)."
  14: "ὅπως ἂν ἐξαγγείλω πάσας τὰς αἰνέσεις σου ἐν ταῖς πύλαις τῆς θυγατρὸς Σιων — わたしがあなたのすべての賛美を、シオンの娘の門で告げ知らせるためである (αἴνεσις — 賛美; θυγάτηρ Σιων — «дочь Сиона», т. е. Иерусалим). ἀγαλλιάσομαι ἐπὶ τῷ σωτηρίῳ σου — わたしはあなたの救いによって小躍りする (σωτήριον — «спасение»)."
  15: "ἐνεπάγησαν ἔθνη ἐν διαφθορᾷ, ᾗ ἐποίησαν — 諸民は自分の造った滅びに沈み (ἐμπήγνυμι — «увязать, погружаться»; διαφθορά — «погибель»). ἐν παγίδι ταύτῃ, ᾗ ἔκρυψαν, συνελήμφθη ὁ ποὺς αὐτῶν — 自分の隠した網に捕まれ、その足が捕らえられた (παγίς — «сеть, ловушка»; συλλαμβάνω — «ловить»)."
  16: "γινώσκεται κύριος κρίματα ποιῶν — 主は裁きを行う方として知られている. ἐν τοῖς ἔργοις τῶν χειρῶν αὐτοῦ συνελήμφθη ὁ ἁμαρτωλός — 罪人は自分の手のわざに捕らえられた (ᾠδὴ διαψάλματος в конце стиха — «песнь псалма», не передаётся)."
  17: "ἀποστραφήτωσαν οἱ ἁμαρτωλοὶ εἰς τὸν ᾅδην — 罪人は陰府へ帰るがよい (ᾅδης — 陰府; императив 3 л.). πάντα τὰ ἔθνη τὰ ἐπιλανθανόμενα τοῦ θεοῦ — 神を忘れるすべての民も (ἐπιλανθάνομαι — «забывать»)."
  18: "ὅτι οὐκ εἰς τέλος ἐπιλησθήσεται ὁ πτωχός — 貧しい者は全く忘れられることはなく (εἰς τέλος — «до конца, совершенно»). ἡ ὑπομονὴ τῶν πενήτων οὐκ ἀπολεῖται εἰς τὸν αἰῶνα — 苦しむ者の待ち望みはとこしえに滅びない (ὑπομονή — «терпение, ожидание», передано 待ち望み; πένης — «нищий»)."
  19: "ἀνάστηθι, κύριε, μὴ κραταιούσθω ἄνθρωπος — 主よ、立ち上がってください、人が力を強めてはならない (κραταιόω — «укрепляться»). κριθήτωσαν ἔθνη ἐνώπιόν σου — 諸民があなたの前で裁かれるように (κρίνω — 裁く)."
  20: "κατάστησον, κύριε, νομοθέτην ἐπ᾽ αὐτούς — 主よ、彼らの上に法を定める者を立ててください (καθίστημι — «поставлять»; νομοθέτης — «законодавец»). γνώτωσαν ἔθνη ὅτι ἄνθρωποί εἰσιν — 諸民が、自分たちは人にすぎないことを知るように (ἵνα-смысл; в Синодальном «да познают, что они — люди»). διάψαλμα не передаётся."
  21: "ВАЖНО: в gr-lxx-byz (и gr-ru) стихи 9:21–38 отсутствуют — дефект модуля: у псалма 9 стоят только строки 0–20, вторая половина LXX 9 (она же евр. Пс 10) в греческих модулях потеряна; в ru и csl-ru она есть (0–38). Раз держим церковную (LXX) нумерацию как в ru, стихи дописаны по церковному тексту: jp-joc (у него они стоят как 9:21–38) и ru/Синодальный для контроля. 〔…〕 не ставятся: это пробел модуля, а не церковное добавление. Ст. 21: «доколе, Господи, стоишь вдали» — 主よ、なぜ遠く立ち… (jp-joc 何ぞ遠く立ち、憂ひの時に己を隱す; ὑπεροράω — «не замечать, презирать», передано 身を隠される по церковному чтению; Синодальный «скрываешь Себя во время скорби»)."
  22: "ἐμπυρίζεται ὁ πτωχός — 貧しい者は焼かれる (образ горестного возгорания; jp-joc 陵ぐ — «притесняет», Синодальный «преследует»; образ огня в переводе сохранён). συλλαμβάνονται ἐν διαβουλίοις οἷς διαλογίζονται — 彼らは自分たちがめぐらす謀りごとに捕まる (συλλαμβάνω — «ловить»; διαβούλιον — «замысел»; Синодальный «да уловятся ухищрениями, которые сами вымышляют»)."
  23: "ἐπαινεῖται ὁ ἁμαρτωλὸς ἐν ταῖς ἐπιθυμίαις τῆς ψυχῆς αὐτοῦ — 罪人はその魂の欲によって自らをほめ (ἐπαινέω — «хвалить»; пассив передан возвратным 自らを). ὁ ἀδικῶν ἐνευλογεῖται — 利を貪る者は自らをほめたたえる (ἐνευλογέομαι — «благословлять себя», ср. Синодальный «корыстолюбец ублажает себя»)."
  24: "Παρώξυνεν τὸν κύριον ὁ ἁμαρτωλός — 罪人は主を怒らせた (παροξύνω — «раздражать, прогневлять»). κατὰ τὸ πλῆθος τῆς ὀργῆς αὐτοῦ οὐκ ἐκζητήσει — その怒りの多さによって、彼は問おうともしない (ἐκζητέω — «взыскивать»; αὐτοῦ — его собственный гнев). οὐκ ἔστιν ὁ θεὸς ἐνώπιον αὐτοῦ — そのすべての思いのうちに、神はいない (букв. «нет Бога пред ним»; ср. Синодальный «во всех помыслах его: нет Бога»)."
  25: "Βεβηλοῦνται αἱ ὁδοὶ αὐτοῦ ἐν παντὶ καιρῷ — その道はいつも汚れている (βεβηλόω — «осквернять»; jp-joc 恒に害あり). ἀνταναιρεῖται τὰ κρίματά σου ἀπὸ προσώπου αὐτοῦ — あなたの裁きは彼の前から取り去られている. πάντων τῶν ἐχθρῶν αὐτοῦ κατακυριεύσει — 彼はすべての敵を支配する (κατακυριεύω — «господствовать»; jp-joc и Синодальный читают как «смотрит с пренебрежением» — расхождение отмечено, выбран греч. смысл)."
  26: "Εἶπεν ἐν καρδίᾳ αὐτοῦ· Οὐ μὴ σαλευθῶ ἀπὸ γενεᾶς εἰς γενεὰν ἄνευ κακοῦ — 彼は心のうちに言った、「わたしは揺らがない。代々、災いに遭わない」 (σαλεύω — «колебать»; ἀπὸ γενεᾶς εἰς γενεάν — 代々; ἄνευ κακοῦ — «без зла»). Речь нечестивого — 「」."
  27: "Οὗ ἀρᾶς τὸ στόμα αὐτοῦ γέμει καὶ πικρίας καὶ δόλου — その口は呪いと苦さと欺きに満ち (ἀρά — 呪い; πικρία — 苦さ; δόλος — 欺き; тот же ряд цитируется в Рим 3:14). ὑπὸ τὴν γλῶσσαν αὐτοῦ κόπος καὶ πόνος — その舌の下には労苦と痛みがある (κόπος — «труд, мучение»; πόνος — «боль»; ср. Синодальный «под языком — его мучение и пагуба»)."
  28: "Ἐγκάθηται ἐνέδρᾳ μετὰ πλουσίων ἐν ἀποκρύφοις — 彼は富ある者たちとともに、隠れた所で待ち伏せして座り (ἐνέδρα — «засада»; πλούσιοι — «богатые», у jp-joc пропущено, в переводе сохранено). τοῦ ἀποκτεῖναι ἀθῷον — 罪のない者を殺そうとする (ἀθῷος — «невинный»). οἱ ὀφθαλμοὶ αὐτοῦ εἰς πτωχὸν ἀποβλέπουσιν — その目は貧しい者をうかがう."
  29: "Ἐνεδρεύει ἐν ἀποκρύφῳ ὡς λέων ἐν τῇ μάνδρᾳ αὐτοῦ — 隠れた所で、獅子がその穴にいるように待ち伏せる (μάνδρα — «загон, логово», передано 穴, как jp-joc 窟). ἐνεδρεύει τοῦ ἁρπάσαι πτωχόν… ἐν τῇ παγίδι αὐτοῦ — 貧しい者を捕まえ、引き寄せて自分の網に引き入れようと待ち伏せる (ἁρπάζω — «хватать»; παγίς — 網)."
  30: "Ταπεινώσει αὐτὸν καὶ κατακύψει — 彼は身をかがめて伏せる (ταπεινόω — «смирять»; κατακύπτω — «пригибаться»). ἐμπεσεῖται ἐν τῇ ἐξουσίᾳ αὐτοῦ ὁ πτωχός — 貧しい者は、その強い爪に落ちる (ἐξουσία — «власть, сила»; образ когтей — как у jp-joc 勁き爪)."
  31: "Εἶπεν ἐν τῇ καρδίᾳ αὐτοῦ· Ἐπιλέλησται ὁ θεός — 彼は心のうちに言った、「神は忘れた」. ἀπέστρεψεν τὸ πρόσωπον αὐτοῦ τοῦ μὴ βλέπειν εἰς τέλος — 顔を背けて、とこしえに見ることはない (ἀποστρέφω — «отвращать»; εἰς τέλος — «до конца»)."
  32: "Ἀνάστηθι, κύριε ὁ θεός, ὑψωθήτω ἡ χείρ σου — 主、わたしの神よ、立ち上がって、手を上げてください. μὴ ἐπιλάθῃ τῶν πενήτων — 貧しい者たちを忘れないでください (πένης — «нищий»; Синодальный «не забудь угнетенных»)."
  33: "Ἕνεκεν τίνος παρώξυνεν ὁ ἀσεβὴς τὸν θεόν — なぜ、悪い者は神を怒らせるのか (ἕνεκεν τίνος — «ради чего»). εἶπεν ἐν τῇ καρδίᾳ αὐτοῦ· Οὐκ ἐκζητήσει — 彼は心のうちに言った、「あなたは問おうとしない」 (в греч. 3 л. «не взыщет»; в Синодальном обращение «Ты не взыщешь» — передано обращением, потому что речь к Богу)."
  34: "Βλέπεις, ὅτι σὺ πόνου καὶ θυμοῦ ἐπιβλέπεις — あなたは見ておられる、労苦と怒りをあなたは顧み (ἐπιβλέπω — «призирать»). τοῦ παραδοῦναι αὐτοὺς εἰς χεῖράς σου — 彼らをあなたの手に委ねようとして. σοὶ ἐγκαταλέλειπται ὁ πτωχός — 貧しい者はあなたに委ねられている (ἐγκαταλείπω — «оставлять»; ср. Синодальный «Тебе предает себя бедный»). ὀρφανῷ σὺ ἦσθα βοηθός — あなたはみなしごの助けである (ὀρφανός — みなしご)."
  35: "Σύντριψον τὸν βραχίονα τοῦ ἁμαρτωλοῦ καὶ πονηροῦ — 罪人と悪い者の腕を砕いてください (βραχίων — «мышца», образ силы; συντρίβω — 砕く). ζητηθήσεται ἡ ἁμαρτία αὐτοῦ καὶ οὐ μὴ εὑρεθῇ δι᾽ αὐτήν — その罪は問われても、もはや見つからない (смысл: грех истреблён; ср. Синодальный «так чтобы искать и не найти его нечестия»)."
  36: "Κύριος βασιλεὺς εἰς τὸν αἰῶνα καὶ εἰς τὸν αἰῶνα τοῦ αἰῶνος — 主は王として、とこしえに、世々にいます (тройная формула века, как в ст. 5). ἀπολεῖσθε, ἔθνη, ἐκ τῆς γῆς αὐτοῦ — 諸民よ、あなたがたは主の地から滅びる (ἔθνη — 諸民; прямое обращение сохранено)."
  37: "Ἐπιθυμίαν τῶν πενήτων εἰσήκουσας, κύριε — 主よ、あなたは貧しい者たちの願いを聞かれた (ἐπιθυμία — «желание»). τὴν ἑτοιμασίαν τῆς καρδίας αὐτῶν προσέσχεν τὸ οὖς σου — あなたは彼らの心の備えに耳を傾けられた (ἑτοιμασία — «уготование»; προσέχω — «внимать»)."
  38: "Κρῖναι ὀρφανῷ καὶ ταπεινῷ — みなしごと苦しむ者のために裁きを行い (κρίνω — 裁く; ταπεινός — «смиренный, угнетённый»). ἵνα μὴ προσθῇ ἔτι μεγαλαυχεῖν ὁ ἄνθρωπος ἐπὶ τῆς γῆς — 人がもはや地の上で高ぶって語らないように (μεγαλαυχέω — «велеречити, величаться»; προστίθημι — «впредь»)."
