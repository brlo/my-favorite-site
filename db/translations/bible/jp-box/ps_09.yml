# jp-box, Псалтирь, псалом 9. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0.
# ВНИМАНИЕ (дефект модуля): в gr-lxx-byz и gr-ru у псалма 9 стоят только строки 0–20;
# вторая половина LXX 9 (ст. 21–38, она же евр. Пс 10) в греческих модулях отсутствует.
# В ru и csl-ru она есть (0–38). Держим церковную (LXX) нумерацию как в ru, поэтому
# стихи 21–38 дописаны по церковному тексту: jp-joc (у него они стоят как 9:21–38)
# и ru/Синодальный для контроля.
# 〔…〕 в ст. 21–38 НЕ ставятся: это не церковное добавление, а пробел модуля.
# Псалом 9: хвала за суд над врагами (1–6), Господь — судия века (7–9),
# упование на имя (10), проповедь народам (11–12), молитва о милости (13–14),
# гибель нечестивых в собственных сетях (15–17), надежда нищих (18–20),
# «доколе, Господи» — гонитель и его засады (21–30), суд над ним (31–38).
# Красного и синего нет. Прямая речь нечестивого (26, 31, 33) — 「…」.
# 〔…〕 нет нигде: 0–20 по gr-lxx-byz, 21–38 по церковному тексту (см. выше).
# セラ (διάψαλμα, в конце ст. 20; ᾠδὴ διαψάλματος в ст. 16) не передаётся — как у jp-joc.
# Сносок ⟨…⟩ нет: シオン, 陰府, 王座, みなしご уже в корпусе.
# jp-ni не использовался.

