# jp-box, 1-е Послание Иоанна, глава 4. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 4: различение духов (1–6), Бог есть любовь (7–12),
# пребывание в Боге и дерзновение (13–18), любовь к брату (19–21).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет.
# 〔…〕 одно — 4:3: в базе стоит только ὃ μὴ ὁμολογεῖ τὸν Ἰησοῦν, слова
# Χριστὸν ἐν σαρκὶ ἐληλυθότα (церковное чтение, у jp-joc есть) в базе отсутствуют,
# проверено запросом к gr-lxx-byz: σαρκι, χριστον — НЕТ.
# Сносок ⟨…⟩ в главе нет: 偽預言者, 霊, 反キリスト уже в корпусе.
# 4:20 — слова лжеца в 「…」 (прямая речь, первый уровень); 4:19 в базе без αὐτόν,
# поэтому «彼を愛する» не добавлено. πνεῦμα всюду без ἅγιον — 霊[れい]. jp-ni не использовался.

tr_code: jp-box
book: 1in
chapter: 4
draft: true

verses:
  1: "愛[あい]する者[もの]たちよ、すべての霊[れい]を信[しん]じてはならない。その霊[れい]が神[かみ]から出[で]たものかどうかを見分[みわ]けよ。多[おお]くの偽[にせ]預言者[よげんしゃ]が世[よ]に出[で]て来[き]たからである。"
  2: "神[かみ]の霊[れい]は、これによって見分[みわ]けられる。イエス・キリストが肉[にく]となって来[き]たことを告白[こくはく]する霊[れい]は、すべて神[かみ]から出[で]たものである。"
  3: "イエス〔・キリストが肉[にく]となって来[き]たこと〕を告白[こくはく]しない霊[れい]は、神[かみ]から出[で]たものではない。それが反[はん]キリストの霊[れい]である。あなたがたは、それが来[く]ると聞[き]いていたが、今[いま]すでに世[よ]のうちにいる。"
  4: "子[こ]どもたちよ、あなたがたは神[かみ]から出[で]た者[もの]であり、彼[かれ]らに勝[か]っている。あなたがたのうちにおられる方[かた]は、世[よ]のうちにいる者[もの]より大[おお]きいからである。"
  5: "彼[かれ]らは世[よ]から出[で]た者[もの]である。だから、世[よ]のことを語[かた]り、世[よ]が彼[かれ]らの言[い]うことを聞[き]くのである。"
  6: "わたしたちは神[かみ]から出[で]た者[もの]である。神[かみ]を知[し]る者[もの]はわたしたちの言[い]うことを聞[き]き、神[かみ]から出[で]ていない者[もの]は聞[き]かない。これによって、わたしたちは真理[しんり]の霊[れい]と惑[まど]わしの霊[れい]とを見分[みわ]ける。"
  7: "愛[あい]する者[もの]たちよ、互[たが]いに愛[あい]し合[あ]おう。愛[あい]は神[かみ]から出[で]ているからである。愛[あい]する者[もの]はすべて神[かみ]から生[う]まれ、神[かみ]を知[し]っている。"
  8: "愛[あい]さない者[もの]は神[かみ]を知[し]っていない。神[かみ]は愛[あい]であられるからである。"
  9: "神[かみ]の愛[あい]がわたしたちのうちに現[あらわ]れたのは、神[かみ]がその独[ひと]り子[こ]を世[よ]に遣[つか]わし、わたしたちがこの方[かた]によって生[い]きるようにされたことによってである。"
  10: "愛[あい]とはこれである。わたしたちが神[かみ]を愛[あい]したのではなく、神[かみ]がわたしたちを愛[あい]し、わたしたちの罪[つみ]のための贖[あがな]いとして御子[みこ]を遣[つか]わされたのである。"
  11: "愛[あい]する者[もの]たちよ、神[かみ]がこのようにわたしたちを愛[あい]してくださったのだから、わたしたちも互[たが]いに愛[あい]し合[あ]うべきである。"
  12: "神[かみ]を見[み]た者[もの]は、かつて一人[ひとり]もいない。わたしたちが互[たが]いに愛[あい]し合[あ]うなら、神[かみ]はわたしたちのうちにとどまり、神[かみ]の愛[あい]はわたしたちのうちで全[まった]うされている。"
  13: "わたしたちがこの方[かた]のうちにあり、この方[かた]がわたしたちのうちにおられることを知[し]るのは、この方[かた]がご自身[じしん]の霊[れい]をわたしたちに与[あた]えてくださったからである。"
  14: "わたしたちは見[み]て、証[あか]しをする。父[ちち]が御子[みこ]を世[よ]の救[すく]い主[ぬし]として遣[つか]わされたことである。"
  15: "イエスが神[かみ]の子[こ]であると告白[こくはく]する者[もの]のうちには神[かみ]がとどまり、その人[ひと]も神[かみ]のうちにとどまる。"
  16: "わたしたちは、神[かみ]がわたしたちのうちに持[も]っておられる愛[あい]を知[し]り、また信[しん]じた。神[かみ]は愛[あい]であられる。愛[あい]のうちにとどまる者[もの]は神[かみ]のうちにとどまり、神[かみ]もその人[ひと]のうちにとどまる。"
  17: "わたしたちのうちで愛[あい]が全[まった]うされているのは、わたしたちが裁[さば]きの日[ひ]に大胆[だいたん]さを持[も]つためである。この方[かた]がそうであられるように、この世[よ]においてわたしたちもそうであるからである。"
  18: "愛[あい]のうちには恐[おそ]れがない。完全[かんぜん]な愛[あい]は恐[おそ]れを外[そと]へ追[お]い出[だ]す。恐[おそ]れには罰[ばつ]が伴[ともな]うからである。恐[おそ]れる者[もの]は、愛[あい]において全[まった]うされていない。"
  19: "わたしたちが愛[あい]するのは、この方[かた]が先[さき]にわたしたちを愛[あい]してくださったからである。"
  20: "「神[かみ]を愛[あい]している」と言[い]いながら、自分[じぶん]の兄弟[きょうだい]を憎[にく]む者[もの]は偽[いつわ]り者[もの]である。見[み]えている兄弟[きょうだい]を愛[あい]さない者[もの]は、見[み]ていない神[かみ]を愛[あい]することができないからである。"
  21: "神[かみ]を愛[あい]する者[もの]は、自分[じぶん]の兄弟[きょうだい]をも愛[あい]すべきである。これが、わたしたちがこの方[かた]から受[う]けた戒[いまし]めである。"

notes:
  1: "μὴ παντὶ πνεύματι πιστεύετε — すべての霊を信じてはならない (πνεῦμα здесь — дух-вдохновитель, не Святой Дух; отсюда 霊[れい], без пары {聖霊｜聖神}). δοκιμάζετε τὰ πνεύματα — 霊を見分けよ (δοκιμάζω — испытывать, проверять; передано 見分ける, как в 4:6). ψευδοπροφῆται — 偽預言者."
  2: "ἐν τούτῳ γινώσκετε — これによって見分けられる. ὃ ὁμολογεῖ Ἰησοῦν Χριστὸν ἐν σαρκὶ ἐληλυθότα — イエス・キリストが肉となって来たことを告白する (винительный с причастием: «исповедует Иисуса Христа, пришедшего во плоти»). В базе стих полон — 〔…〕 не нужны."
  3: "ὃ μὴ ὁμολογεῖ τὸν Ἰησοῦν — в базе только «не исповедует Иисуса»; слова Χριστὸν ἐν σαρκὶ ἐληλυθότα отсутствуют (проверено: σαρκι, χριστον — НЕТ), это церковное чтение у jp-joc, поэтому в 〔…〕. τὸ τοῦ ἀντιχρίστου — 反キリストの霊. ὃ ἀκηκόατε ὅτι ἔρχεται — それが来ると聞いていた. ἐν τῷ κόσμῳ ἐστὶν ἤδη — 今すでに世のうちにいる."
  4: "ἐκ τοῦ θεοῦ ἐστε — 神から出た者. νενικήκατε αὐτούς — 彼らに勝っている (perfect; αὐτούς — лжепророки и духи). ὁ ἐν ὑμῖν — あなたがたのうちにおられる方 (Христос или Дух; не уточнено, как в греческом). ὁ ἐν τῷ κόσμῳ — 世のうちにいる者."
  5: "ἐκ τοῦ κόσμου εἰσίν — 世から出た者. ἐκ τοῦ κόσμου λαλοῦσιν — 世のことを語る (ἐκ — из, по образцу мира). ὁ κόσμος αὐτῶν ἀκούει — 世が彼らの言うことを聞く."
  6: "ὁ γινώσκων τὸν θεὸν ἀκούει ἡμῶν — 神を知る者はわたしたちの言うことを聞き. τὸ πνεῦμα τῆς ἀληθείας καὶ τὸ πνεῦμα τῆς πλάνης — 真理の霊と惑わしの霊 (πλάνη — заблуждение; не «дух лжи», а «дух заблуждения»)."
  7: "ἀγαπῶμεν ἀλλήλους — 互いに愛し合おう (сослагательное увещания, как 3:18). ἡ ἀγάπη ἐκ τοῦ θεοῦ ἐστιν — 愛は神から出ている. γεγέννηται — 生まれた (perfect)."
  8: "ὁ μὴ ἀγαπῶν οὐκ ἔγνω τὸν θεόν — 愛さない者は神を知っていない (ἔγνω — аорист: не познал). ὁ θεὸς ἀγάπη ἐστίν — 神は愛であられる (связка отсутствует в греческом, но по-японски нужна; であられる — гонорифик)."
  9: "τὸν υἱὸν αὐτοῦ τὸν μονογενῆ — その独り子 (μονογενής — единственный, единородный). ἀπέσταλκεν — perfect: 遣わし…された (послан и пребывает посланным). ἵνα ζήσωμεν δι᾽ αὐτοῦ — この方によって生きるように."
  10: "ἐν τούτῳ ἐστὶν ἡ ἀγάπη — 愛とはこれである. οὐχ ὅτι ἡμεῖς ἠγαπήκαμεν — わたしたちが愛したのではなく. ἱλασμὸν περὶ τῶν ἁμαρτιῶν — 罪のための贖い (то же слово, что 2:2). ἀπέστειλεν — аорист."
  11: "εἰ οὕτως ὁ θεὸς ἠγάπησεν ἡμᾶς — 神がこのように愛してくださったのだから (εἰ с изъявительным — реальное условие, передано причиной). ὀφείλομεν ἀλλήλους ἀγαπᾶν — 互いに愛し合うべきである."
  12: "θεὸν οὐδεὶς πώποτε τεθέαται — 神を見た者はかつて一人もいない (perfect; πώποτε — когда-либо). τετελειωμένη ἐν ἡμῖν ἐστιν — 全うされている (perfect pass., ср. 2:5; 4:17,18)."
  13: "ἐκ τοῦ πνεύματος αὐτοῦ δέδωκεν ἡμῖν — ご自身の霊を与えてくださった (πνεῦμα без ἅγιον — 霊, не 聖霊). ἐν αὐτῷ μένομεν καὶ αὐτὸς ἐν ἡμῖν — この方のうちにあり、この方も…おられる (взаимность сохранена)."
  14: "τεθεάμεθα καὶ μαρτυροῦμεν — 見て、証しをする (perfect + настоящее). σωτῆρα τοῦ κόσμου — 世の救い主. ἀπέσταλκεν — perfect. Порядок «Отец послал Сына Спасителем мира» сохранён."
  15: "ὃς ἐὰν ὁμολογήσῃ — 告白する者はだれでも (ἐάν с сослагательным — обобщение). Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ — イエスが神の子である. Взаимное пребывание: 神がとどまり、その人もとどまる."
  16: "ἐγνώκαμεν καὶ πεπιστεύκαμεν — 知り、また信じた (perfect; два глагола сохранены). τὴν ἀγάπην ἣν ἔχει ὁ θεὸς ἐν ἡμῖν — 神がわたしたちのうちに持っておられる愛. ὁ θεὸς ἀγάπη ἐστίν — 神は愛であられる (повтор 4:8)."
  17: "τετελείωται ἡ ἀγάπη μεθ᾽ ἡμῶν — わたしたちのうちで愛が全うされている (μετά — с нами; «любовь с нами достигла полноты»). ἵνα παρρησίαν ἔχωμεν ἐν τῇ ἡμέρᾳ τῆς κρίσεως — 裁きの日に大胆さを持つため. καθὼς ἐκεῖνός ἐστιν καὶ ἡμεῖς ἐσμεν ἐν τῷ κόσμῳ τούτῳ — この方がそうであられるように、この世においてわたしたちもそうである."
  18: "φόβος…ἔξω βάλλει — 恐れを外へ追い出す. κόλασιν ἔχει — 罰が伴う (κόλασις — наказание, мучение; не «страх наказания», а страх несёт в себе наказание). οὐ τετελείωται ἐν τῇ ἀγάπῃ — 愛において全うされていない."
  19: "ἡμεῖς ἀγαπῶμεν — в базе без αὐτόν, поэтому объект не добавлен: わたしたちが愛するのは. πρῶτος ἠγάπησεν ἡμᾶς — 先にわたしたちを愛してくださった. Добавление «彼を» потребовало бы 〔…〕, поэтому его нет."
  20: "ἐάν τις εἴπῃ ὅτι Ἀγαπῶ τὸν θεόν — 神を愛していると言いながら: слова лжеца — прямая речь, первый уровень, 「…」. ψεύστης — 偽り者. ὃν ἑώρακεν…ὃν οὐχ ἑώρακεν — 見えている…見ていない (два ὅν, противопоставление сохранено). οὐ δύναται ἀγαπᾶν — 愛することができない."
  21: "ταύτην τὴν ἐντολὴν ἔχομεν ἀπ᾽ αὐτοῦ — この方から受けた戒め. ἵνα ὁ ἀγαπῶν τὸν θεὸν ἀγαπᾷ καὶ τὸν ἀδελφὸν αὐτοῦ — 神を愛する者は、自分の兄弟をも愛すべきである (ἵνα раскрывает содержание заповеди)."
