verses:
  1: "ゴルギアスは五千[ごせん]の兵[へい]と精鋭[せいえい]の騎兵[きへい]千[せん]を率[ひき]い、陣[じん]は夜[よる]のうちに進[すす]んだ。"
  2: "ユダヤ人[じん]の陣[じん]に襲[おそ]いかかり、彼らを不意[ふい]に打[う]とうとしたのである。アクラの者[もの]たちが彼らの案内[あんない]役[やく]であった。"
  3: "ユダはこれを聞[き]いて、自分[じぶん]と力[ちから]ある者[もの]たちを率[ひき]い、エンマウスにいる王[おう]の軍勢[ぐんぜい]を打[う]つために進[すす]んだ。"
  4: "まだ軍勢[ぐんぜい]が陣[じん]から散[ち]らばっていた間[あいだ]のことであった。"
  5: "ゴルギアスは夜[よる]のうちにユダの陣[じん]へ来[き]たが、だれも見[み]つからなかった。彼らは山[やま]の中[なか]でユダたちを捜[さが]した。「あの者[もの]たちはわたしたちから逃[に]げた」と言[い]っていたからである。"
  6: "夜[よ]が明[あ]けると、ユダは三千[さんぜん]の兵[へい]とともに平野[へいや]に現[あらわ]れた。ただ、彼らには望[のぞ]むような盾[たて]も剣[つるぎ]もなかった。"
  7: "彼らは、強[つよ]く武具[ぶぐ]を着[き]た異邦人[いほうじん]の陣[じん]と、それを取[と]り囲[かこ]む騎兵[きへい]たちを見[み]た。彼らは戦[たたか]いに熟練[じゅくれん]した者[もの]たちであった。"
  8: "ユダはともにいる者[もの]たちに言[い]った。「彼らの多[おお]さを恐[おそ]れるな。彼らの突撃[とつげき]におののくな。"
  9: "わたしたちの父[ちち]たちが紅[べに]の海[うみ]で救[すく]われたことを思[おも]い起[おこ]せ。ファラオが軍勢[ぐんぜい]をもって彼らを追[お]ったときのことである。"
  10: "今[いま]、わたしたちは天[てん]に向[む]かって叫[さけ]ぼう。彼[かれ]がわたしたちを顧[かえり]み、父[ちち]たちとの契約[けいやく]を思[おも]い起[おこ]し、今日[きょう]、この陣[じん]をわたしたちの前[まえ]で砕[くだ]いてくださるように。"
  11: "そうすれば、すべての異邦人[いほうじん]は、イスラエルを贖[あがな]い救[すく]う者[もの]がいることを知[し]るだろう。」"
  12: "ペリシテ人[じん]たちは目[め]を上[あ]げて、彼らが向[む]こうから来[く]るのを見[み]た。"
  13: "そして陣[じん]から出[で]て戦[たたか]いに臨[のぞ]んだ。ユダの側[がわ]の者[もの]たちはラッパを吹[ふ]いた。"
  14: "両者[りょうしゃ]はぶつかり合[あ]い、異邦人[いほうじん]は砕[くだ]かれて平野[へいや]へ逃[に]げた。"
  15: "しかし、後[うし]ろの者[もの]たちは皆[みな]、剣[つるぎ]にかかって倒[たお]れた。彼らはガザラまで、イドマヤ、アゾトス、ヤムニアの平野[へいや]まで追[お]われ、三千[さんぜん]人[にん]ほどが倒[たお]れた。"
  16: "ユダとその軍勢[ぐんぜい]は彼らの追撃[ついげき]から引[ひ]き返[かえ]した。"
  17: "そして民[たみ]に言[い]った。「戦利品[せんりひん]を欲[ほ]しがってはならない。戦[たたか]いはまだわたしたちの前[まえ]にある。"
  18: "ゴルギアスとその軍勢[ぐんぜい]が山[やま]の上[うえ]、わたしたちの近[ちか]くにいる。今[いま]は敵[てき]の前[まえ]に立[た]って彼らと戦[たたか]え。その後[のち]、大胆[だいたん]に戦利品[せんりひん]を取[と]れ。」"
  19: "ユダがまだこう言[い]っていると、山[やま]から覗[のぞ]く一団[いちだん]が現[あらわ]れた。"
  20: "彼らは、味方[みかた]が敗走[はいそう]し、陣[じん]が焼[や]かれているのを見[み]た。立[た]ち上[のぼ]る煙[けむり]が、何[なに]が起[お]こったかを示[しめ]していたのである。"
  21: "彼らはこれを見[み]てひどく恐[おそ]れ、平野[へいや]に戦列[せんれつ]を整[ととの]えたユダの陣[じん]を見[み]て、"
  22: "皆[みな]、ペリシテ人[じん]の地[ち]へ逃[に]げた。"
  23: "ユダは陣[じん]の掠奪[りゃくだつ]に戻[もど]り、多[おお]くの金[きん]と銀[ぎん]、青[あお]い紫[むらさき]の布[ぬの]と海[うみ]の紫[むらさき]の布[ぬの]、そして大[おお]きな富[とみ]を取[と]った。"
  24: "彼らは帰[かえ]りながら、天[てん]に向[む]かって歌[うた]い、主[しゅ]を賛美[さんび]した。「主[しゅ]は良[よ]い方[かた]、その慈[じ]しみは永遠[えいえん]に至[いた]る」と。"
  25: "その日[ひ]、イスラエルに大[おお]きな救[すく]いがあった。"
  26: "ペリシテ人[じん]のうち生[い]き残[のこ]った者[もの]たちは、リュシアスのもとへ来[き]て、起[お]こったことをすべて告[つ]げた。"
  27: "彼はこれを聞[き]いて動揺[どうよう]し、意気消沈[いきしょうちん]した。事[こと]がイスラエルに対して自分[じぶん]の望[のぞ]んだとおりにならず、王[おう]が自分[じぶん]に命[めい]じたとおりにもならなかったからである。"
  28: "翌年[よくねん]、リュシアスは精鋭[せいえい]六万[ろくまん]の兵[へい]と五千[ごせん]の騎兵[きへい]を集[あつ]め、彼らと戦[たたか]おうとした。"
  29: "彼らはイドマヤへ来[き]てベテズルに陣[じん]を敷[し]き、ユダは一万[いちまん]の兵[へい]で彼らを迎[むか]えた。"
  30: "彼はその強[つよ]い陣[じん]を見[み]て祈[いの]り、言[い]った。「あなたはほむべき方[かた]、イスラエルの救[すく]い主[ぬし]である。あなたはかつて、あなたの僕[しもべ]ダビデの手[て]によって強[つよ]い者[もの]の突撃[とつげき]を砕[くだ]き、ペリシテ人[じん]の陣[じん]をサウルの子[こ]ヨナタンとその武具[ぶぐ]を運[はこ]ぶ者[もの]の手[て]に渡[わた]した。"
  31: "どうか、この陣[じん]をあなたの民[たみ]イスラエルの手[て]に閉[と]じ込[こ]めてほしい。彼らがその力[ちから]と騎兵[きへい]のゆえに恥[はじ]を受[う]けるように。"
  32: "彼らに恐[おそ]れを与[あた]え、その力[ちから]の大胆[だいたん]さを溶[と]かし、彼らが打[う]ち砕[くだ]かれて揺[ゆ]るがされるように。"
  33: "あなたを愛[あい]する者[もの]たちの剣[つるぎ]で彼らを倒[たお]してほしい。あなたの名[な]を知[し]る者[もの]が皆[みな]、賛美[さんび]の歌[うた]であなたをほめたたえるように。」"
  34: "そして両者[りょうしゃ]は戦[たたか]い、リュシアスの陣[じん]から五千[ごせん]人[にん]ほどが倒[たお]れ、彼らの前[まえ]に倒[たお]れた。"
  35: "リュシアスは自分[じぶん]の軍[ぐん]の敗走[はいそう]と、ユダの者[もの]たちの勇気[ゆうき]、彼らが雄々[おお]しく生[い]きるか死[し]ぬかの覚悟[かくご]でいるのを見[み]て、アンティオキアへ去[さ]り、さらに多[おお]くの傭兵[ようへい]を募[つの]って、またユダヤへ来[こ]ようと考えた。"
  36: "ユダとその兄弟[きょうだい]たちは言[い]った。「見[み]よ、わたしたちの敵[てき]は砕[くだ]かれた。上[のぼ]って聖所[せいしょ]を清[きよ]め、これを新[あら]たにしよう。」"
  37: "陣[じん]はすべて集[あつ]まり、シオンの山[やま]に上[のぼ]った。"
  38: "彼らは聖所[せいしょ]が荒[あ]れ果[は]て、祭壇[さいだん]が汚[けが]され、門[もん]が焼[や]かれ、庭[にわ]には森[もり]や山[やま]の中[なか]のように草木[くさき]が生[は]え、付属[ふぞく]の室[しつ]が壊[こわ]されているのを見[み]た。"
  39: "彼らは衣[ころも]を引[ひ]き裂[さ]き、大[おお]きな嘆[なげ]きの声[こえ]を上[あ]げ、頭[あたま]に灰[はい]を載[の]せ、"
  40: "地[ち]に顔[かお]を伏[ふ]せて倒[たお]れ、合図[あいず]のラッパを吹[ふ]き、天[てん]に向[む]かって叫[さけ]んだ。"
  41: "そのとき、ユダは聖所[せいしょ]を清[きよ]めるまで、アクラにいる者[もの]たちと戦[たたか]うように兵[へい]たちに命[めい]じた。"
  42: "彼は律法[りっぽう]を愛[あい]する、非[ひ]の打[う]ちどころのない祭司[さいし]たちを選[えら]び、"
  43: "彼らは聖所[せいしょ]を清[きよ]め、汚[けが]れの石[いし]を汚[けが]れた場所[ばしょ]へ運[はこ]び出[だ]した。"
  44: "そして、汚[けが]された燔祭[はんさい]の祭壇[さいだん]をどうしたらよいかと相談[そうだん]した。"
  45: "彼らに良[よ]い思[おも]いが浮[う]かんだ。それを壊[こわ]そうというのである。異邦人[いほうじん]がそれを汚[けが]したので、いつか彼らの辱[はずかし]めになるといけないからである。彼らはその祭壇[さいだん]を壊[こわ]し、"
  46: "その石[いし]を神殿[しんでん]の山[やま]のふさわしい場所[ばしょ]に置[お]いた。彼らについて答[こた]える預言者[よげんしゃ]が来[く]るまで、そこにおいておくためであった。"
  47: "彼らは律法[りっぽう]に従[したが]って切[き]り出[だ]したままの石[いし]を取[と]り、前[まえ]のとおりに新[あたら]しい祭壇[さいだん]を建[た]てた。"
  48: "そして聖所[せいしょ]と神殿[しんでん]の内部[ないぶ]を建[た]て直[なお]し、庭[にわ]を聖[せい]なるものとした。"
  49: "また新[あたら]しい聖[せい]なる器[うつわ]を造[つく]り、燭台[しょくだい]、香[こう]の祭壇[さいだん]、供[そな]えの机[つくえ]を神殿[しんでん]へ運[はこ]び入[い]れた。"
  50: "祭壇[さいだん]の上[うえ]で香[こう]をたき、燭台[しょくだい]の上[うえ]の灯[あか]りをともして、神殿[しんでん]を照[て]らした。"
  51: "机[つくえ]の上[うえ]にパンを置[お]き、垂[た]れ幕[まく]を掛[か]けた。こうして彼らは行[おこな]ったすべてのわざを仕上[しあ]げた。"
  52: "第九[だいきゅう]の月[つき]、すなわちキスレウの月[つき]の二十五[にじゅうご]日[にち]、第[だい]百四十八[ひゃくよんじゅうはち]年[ねん]の朝[あさ]早[はや]く、彼らは起[お]きた。"
  53: "そして律法[りっぽう]に従[したが]い、自分[じぶん]たちが造[つく]った新[あたら]しい燔祭[はんさい]の祭壇[さいだん]の上[うえ]に犠牲[ぎせい]をささげた。"
  54: "異邦人[いほうじん]がそれを汚[けが]したその時[とき]、その日[ひ]に、歌[うた]と琴[こと]と竪琴[たてごと]とシンバルによって、それが新[あら]たにされた。"
  55: "民[たみ]は皆[みな]顔[かお]を地[ち]に伏[ふ]せて拝[おが]み、彼らを幸[しあわ]せへと導[みちび]いた方[かた]を天[てん]に向[む]かって賛美[さんび]した。"
  56: "彼らは八日[ようか]の間[あいだ]、祭壇[さいだん]の奉献[ほうけん]を行[おこな]い、喜[よろこ]びをもって燔祭[はんさい]をささげ、救[すく]いと賛美[さんび]の犠牲[ぎせい]をささげた。"
  57: "彼らは神殿[しんでん]の正面[しょうめん]を金[きん]の冠[かんむり]と小[こ]盾[たて]で飾[かざ]り、門[もん]と付属[ふぞく]の室[しつ]を新[あら]たにし、それらに戸[と]を設[もう]けた。"
  58: "民[たみ]の中[なか]に非常[ひじょう]に大[おお]きな喜[よろこ]びがあり、異邦人[いほうじん]の辱[はずかし]めは遠[とお]ざけられた。"
  59: "ユダとその兄弟[きょうだい]たち、およびイスラエルの全会衆[ぜんかいしゅう]は、祭壇[さいだん]の奉献[ほうけん]の日[ひ]々[び]を、年[とし]ごとに定[さだ]められた時[とき]に、キスレウの月[つき]の二十五[にじゅうご]日[にち]から八日間[ようかかん]、喜[よろこ]びと楽しみをもって守[まも]ることに定[さだ]めた。"
  60: "その時[とき]、彼らはシオンの山[やま]の周[まわ]りに高[たか]い城壁[じょうへき]と堅固[けんご]な塔[とう]を建[た]てた。異邦人[いほうじん]が来[き]て、前[まえ]にしたようにそれを踏[ふ]みにじることがないためである。"
  61: "ユダはそこに、これを守[まも]る軍[ぐん]を置[お]き、ベテズルを堅[かた]めてこれを守[まも]らせた。民[たみ]がイドマヤに備[そな]えて砦[とりで]を持[も]つためである。"

notes:
  1: "παρέλαβεν Γοργίας — «взял Горгий» (ゴルギアス); πεντακισχιλίους ἄνδρας — «пять тысяч мужей»; χιλίαν ἵππον ἐκλεκτήν — «тысячу конницы избранной» (ἐκλεκτός); ἀπῆρεν ἡ παρεμβολὴ νυκτός — «двинулся стан ночью»."
  2: "ἐπιβαλεῖν ἐπὶ τὴν παρεμβολὴν τῶν Ιουδαίων — «напасть на стан Иудеев» (ἐπιβάλλω); πατάξαι ἄφνω — «поразить внезапно»; υἱοὶ τῆς ἄκρας — «сыны акры (крепости)»; ἦσαν αὐτῷ ὁδηγοί — «были ему вожатыми» (ὁδηγός)."
  3: "ἀπῆρεν αὐτὸς καὶ οἱ δυνατοί — «выступил он и сильные»; πατάξαι τὴν δύναμιν τοῦ βασιλέως τὴν ἐν Αμμαους — «поразить силу царя, что в Еммауме» (エンマウス)."
  4: "ἕως ἔτι ἐσκορπισμέναι ἦσαν αἱ δυνάμεις ἀπὸ τῆς παρεμβολῆς — «пока ещё рассеяны были силы от стана» (σκορπίζω — рассеивать). Слав. «еще бо силы расточены быша от полка»."
  5: "ἦλθεν Γοργίας εἰς τὴν παρεμβολὴν Ιουδου νυκτός — «пришёл Горгий в стан Иуды ночью»; οὐδένα εὗρεν — «никого не нашёл»; ἐζήτει αὐτοὺς ἐν τοῖς ὄρεσιν — «искал их в горах»; Φεύγουσιν οὗτοι ἀφ' ἡμῶν — «бегут эти от нас»: прямая речь внутри повествования, в греч. без вводной формулы."
  6: "ἅμα ἡμέρᾳ — «с (наступлением) дня»; ἐν τρισχιλίοις ἀνδράσιν — «с тремя тысячами мужей»; πλὴν καλύμματα καὶ μαχαίρας οὐκ εἶχον — «впрочем, ни покрывал (щитов), ни мечей не имели» (κάλυμμα — покрывало; слав. «щитов»); ὡς ἠβούλοντο — «как хотели»."
  7: "παρεμβολὴν ἐθνῶν ἰσχυρὰν καὶ τεθωρακισμένην — «стан народов сильный и облачённый в броню» (θωρακίζω); ἵππον κυκλοῦσαν αὐτήν — «конницу, окружающую его»; διδακτοὶ πολέμου — «наученные войне» (διδακτός)."
  8: "Μὴ φοβεῖσθε τὸ πλῆθος αὐτῶν — «не бойтесь множества их»; τὸ ὅρμημα αὐτῶν μὴ δειλωθῆτε — «устремления их не ужасайтесь» (ὅρμημα — 突撃[とつげき]; δειλόομαι)."
  9: "ἐν θαλάσσῃ ἐρυθρᾷ — «в море Чермном» (θάλασσα ἐρυθρά — 紅[べに]の海[うみ]); ὅτε ἐδίωκεν αὐτοὺς Φαραω ἐν δυνάμει — «когда гнал их фараон с силою»."
  10: "βοήσωμεν εἰς οὐρανόν — «возопиим на небо»; εἰ θελήσει ἡμᾶς — «если (Он) восхочет нас», т. е. сжалится; μνησθήσεται διαθήκης πατέρων — «вспомнит завет отцов»; συντρίψει τὴν παρεμβολὴν ταύτην — «сокрушит этот стан»."
  11: "γνώσονται πάντα τὰ ἔθνη — «узнают все народы»; ὁ λυτρούμενος καὶ σῴζων τὸν Ισραηλ — «избавляющий и спасающий Израиля» (λυτρόω — 贖[あがな]う)."
  12: "ἦραν οἱ ἀλλόφυλοι τοὺς ὀφθαλμοὺς αὐτῶν — «подняли иноплеменники глаза свои»; ἐξ ἐναντίας — «напротив (навстречу)»."
  13: "ἐξῆλθον ἐκ τῆς παρεμβολῆς εἰς πόλεμον — «вышли из стана на войну»; ἐσάλπισαν οἱ παρὰ Ιουδου — «затрубили бывшие с Иудой»."
  14: "συνῆψαν — «сразились» (συνάπτω); συνετρίβησαν τὰ ἔθνη — «сокрушены были народы»; ἔφυγον εἰς τὸ πεδίον — «побежали на равнину» (πεδίον — 平野[へいや])."
  15: "οἱ ἔσχατοι πάντες ἔπεσον ἐν ῥομφαίᾳ — «последние все пали мечом»; ἕως Γαζηρων — «до Газер» (ガザラ); ἕως τῶν πεδίων τῆς Ιδουμαίας — «до равнин Идумеи» (イドマヤ); Ἀζώτου καὶ Ιαμνείας — «Азота и Иамнии» (アゾトス, ヤムニア); εἰς ἄνδρας τρισχιλίους — «до трёх тысяч мужей». Слав. вм. Газера «ассаримофа» — иное чтение, отмечено."
  16: "ἀπέστρεψεν Ιουδας καὶ ἡ δύναμις — «возвратился Иуда и сила»; ἀπὸ τοῦ διώκειν ὄπισθεν αὐτῶν — «от преследования за ними»."
  17: "Μὴ ἐπιθυμήσητε τῶν σκύλων — «не возжелайте добычи»; πόλεμος ἐξ ἐναντίας ἡμῶν — «война напротив нас»."
  18: "Γοργίας καὶ ἡ δύναμις ἐν τῷ ὄρει ἐγγὺς ἡμῶν — «Горгий и сила на горе близ нас»; στῆτε νῦν ἐναντίον τῶν ἐχθρῶν — «станьте теперь против врагов»; λάβετε τὰ σκῦλα μετὰ παρρησίας — «возьмите добычу с дерзновением» (παρρησία)."
  19: "ἔτι πληροῦντος Ιουδου ταῦτα — «когда ещё Иуда говорил это» (πληρόω); μέρος τι ὤφθη ἐκκύπτον ἐκ τοῦ ὄρους — «часть некая показалась выглядывающей из горы» (ἐκκύπτω — 覗[のぞ]く)."
  20: "τετρώπωνται — «обращены в бегство» (форма от τρέπω; слав. «в бег обратишася»); ἐμπυρίζουσιν τὴν παρεμβολήν — «жгут стан» (ἐμπυρίζω); ὁ καπνὸς ὁ θεωρούμενος ἐνεφάνιζεν τὸ γεγονός — «видимый дым являл происшедшее» (ἐμφανίζω)."
  21: "οἱ δὲ ταῦτα συνιδόντες — «увидев это» (συνοράω); ἐδειλώθησαν σφόδρα — «устрашились весьма» (δειλόω); τὴν Ιουδου παρεμβολὴν ἐν τῷ πεδίῳ ἑτοίμην εἰς παράταξιν — «стан Иуды на равнине, готовый к построению (бою)» (παράταξις — 戦列[せんれつ])."
  22: "ἔφυγον πάντες εἰς γῆν ἀλλοφύλων — «побежали все в землю иноплеменников». В csl этот текст стоит в конце 4:21, а слав. 4:22 начинается «И обратися иуда на корысти ополчения»; держим распределение LXX, номер слав. сохранён."
  23: "ἀνέστρεψεν ἐπὶ τὴν σκυλείαν τῆς παρεμβολῆς — «обратился на разграбление стана» (σκυλεία); ὑάκινθον καὶ πορφύραν θαλασσίαν — «гиацинт и порфиру морскую» (ὑάκινθος — 青[あお]い紫[むらさき]; πορφύρα — 紫[むらさき]の布[ぬの]); πλοῦτον μέγαν — «богатство великое». В csl эта фраза открывает 4:22 — см. note к 22."
  24: "ἐπιστραφέντες ὕμνουν — «возвращаясь, воспевали» (ὑμνέω); εὐλόγουν εἰς οὐρανόν — «благословляли на небо»; ὅτι καλόν, ὅτι εἰς τὸν αἰῶνα τὸ ἔλεος αὐτοῦ — «ибо благ, ибо в век милость Его» (Пс 105:1; 117:1)."
  25: "ἐγενήθη σωτηρία μεγάλη τῷ Ισραηλ — «было спасение великое Израилю»."
  26: "ὅσοι… διεσώθησαν — «сколько спаслись»; παραγενηθέντες ἀπήγγειλαν — «придя, возвестили» (ἀπαγγέλλω); πάντα τὰ συμβεβηκότα — «всё случившееся» (συμβαίνω)."
  27: "συνεχύθη καὶ ἠθύμει — «смутился и унывал» (συγχέω; ἀθυμέω); οὐχ οἷα ἤθελεν, τοιαῦτα ἐγεγόνει — «не то, чего хотел, произошло»; οὐχ οἷα αὐτῷ ἐνετείλατο ὁ βασιλεύς — «не так, как заповедал ему царь»."
  28: "ἐν τῷ ἐρχομένῳ ἐνιαυτῷ — «в наступающем году»; συνελόχησεν ἀνδρῶν ἐπιλέκτων ἑξήκοντα χιλιάδας — «набрал мужей избранных шестьдесят тысяч» (συλλογίζω? здесь συλλοχάω — набирать); πεντακισχιλίαν ἵππον — «пять тысяч конницы»; ἐκπολεμῆσαι αὐτούς — «побороть их»."
  29: "εἰς τὴν Ιδουμαίαν — «в Идумею»; παρενέβαλον ἐν Βαιθσουροις — «расположились станом в Вефсурах» (ベテズル); συνήντησεν αὐτοῖς Ιουδας ἐν δέκα χιλιάσιν — «встретил их Иуда с десятью тысячами»."
  30: "προσηύξατο — «помолился»; ὁ συντρίψας τὸ ὅρμημα τοῦ δυνατοῦ — «сокрушивший устремление сильного»; ἐν χειρὶ τοῦ δούλου σου Δαυιδ — «рукою раба Твоего Давида» (1 Цар 17); παρέδωκας τὴν παρεμβολὴν τῶν ἀλλοφύλων εἰς χεῖρας Ιωναθου — «предал стан иноплеменников в руки Ионафана» (1 Цар 14; ヨナタン); τοῦ αἴροντος τὰ σκεύη αὐτοῦ — «носящего оружие его» (оруженосца). Молитва — 「…」 до 33."
  31: "σύγκλεισον τὴν παρεμβολὴν ταύτην ἐν χειρὶ λαοῦ σου — «заключи этот стан в руку народа Твоего» (συγκλείω); αἰσχυνθήτωσαν ἐπὶ τῇ δυνάμει καὶ τῇ ἵππῳ — «да постыдятся в силе и коннице»."
  32: "δὸς αὐτοῖς δειλίαν — «дай им робость» (δειλία); τῆξον θράσος ἰσχύος αὐτῶν — «расплавь дерзость силы их» (τήκω; θράσος — 大胆[だいたん]さ); σαλευθήτωσαν τῇ συντριβῇ αὐτῶν — «да поколеблются поражением своим» (σαλεύω)."
  33: "κατάβαλε αὐτοὺς ῥομφαίᾳ ἀγαπώντων σε — «низложи их мечом любящих Тебя» (καταβάλλω); αἰνεσάτωσάν σε… ἐν ὕμνοις — «да восхвалят Тебя… в гимнах» (αἰνέω)."
  34: "συνέβαλλον ἀλλήλοις — «сошлись (столкнулись) друг с другом» (συμβάλλω); ἔπεσον ἐκ τῆς παρεμβολῆς Λυσίου εἰς πεντακισχιλίους — «пало из стана Лисия до пяти тысяч»; ἔπεσον ἐξ ἐναντίας αὐτῶν — «пали напротив них (перед ними)»."
  35: "τροπὴν τῆς αὑτοῦ συντάξεως — «обращение в бегство своего войска» (τροπή — 敗走[はいそう]; σύνταξις); τὸ γεγενημένον θάρσος — «явившуюся храбрость» (θάρσος — 勇気[ゆうき]); ἢ ζῆν ἢ τεθνηκέναι γενναίως — «или жить, или умереть благородно» (γενναίως — 雄々[おお]しく); ἐξενολόγει — «набирал чужеземцев (наёмников)» (ξενολογέω); πλεοναστὸν πάλιν παραγίνεσθαι — «прийти снова с большим (войском)»."
  36: "ἀναβῶμεν καθαρίσαι τὰ ἅγια — «взойдём очистить святыни»; ἐγκαινίσαι — «обновить (освятить заново)» (ἐγκαινίζω). Слова Иуды и братьев — 「…」."
  37: "συνήχθη ἡ παρεμβολὴ πᾶσα — «собрался весь стан»; ἀνέβησαν εἰς ὄρος Σιων — «взошли на гору Сион» (シオン)."
  38: "τὸ ἁγίασμα ἠρημωμένον — «святилище опустошённое»; τὸ θυσιαστήριον βεβηλωμένον — «жертвенник осквернённый»; τὰς θύρας κατακεκαυμένας — «врата сожжённые» (κατακαίω); ἐν ταῖς αὐλαῖς φυτὰ πεφυκότα ὡς ἐν δρυμῷ — «во дворах растения выросшие, как в дубраве» (δρυμός — 森[もり]); τὰ παστοφόρια καθῃρημένα — «пастофории (боковые хранилища) разрушены» (παστοφόριον — 付属[ふぞく]の室[しつ])."
  39: "διέρρηξαν τὰ ἱμάτια — «разодрали одежды»; ἐκόψαντο κοπετὸν μέγαν — «подняли плач великий» (κόπτομαι); ἐπέθεντο σποδόν — «возложили пепел» (σποδός — 灰[はい])."
  40: "ἔπεσαν ἐπὶ πρόσωπον ἐπὶ τὴν γῆν — «пали лицом на землю»; ἐσάλπισαν ταῖς σάλπιγξιν τῶν σημασιῶν — «вострубили трубами знамений (сигналов)» (σημασία — 合図[あいず]); ἐβόησαν εἰς οὐρανόν — «возопили к небу»."
  41: "ἐπέταξεν… ἀνδρὰσιν πολεμεῖν τοὺς ἐν τῇ ἄκρᾳ — «повелел мужам воевать с сущими в акре»; ἕως καθαρίσῃ τὰ ἅγια — «пока не очистит святыни»."
  42: "ἐπελέξατο ἱερεῖς ἀμώμους — «избрал священников непорочных» (ἄμωμος); θελητὰς νόμου — «любящих (желающих) закон» (θελητής); слав. «волители закона Божия» — добавляет «Божия», редакционное, не внесено."
  43: "ἐκαθάρισαν τὰ ἅγια — «очистили святыни»; ἦραν τοὺς λίθους τοῦ μιασμοῦ — «вынесли камни осквернения» (μιασμός — 汚[けが]れ); εἰς τόπον ἀκάθαρτον — «в место нечистое»."
  44: "ἐβουλεύσαντο περὶ τοῦ θυσιαστηρίου τῆς ὁλοκαυτώσεως — «совещались о жертвеннике всесожжения»; τί αὐτῷ ποιήσωσιν — «что с ним сделать»."
  45: "ἔπεσεν αὐτοῖς βουλὴ ἀγαθή — «пришла им добрая мысль» (βουλή); καθελεῖν αὐτό — «низвергнуть его» (καθαιρέω); μήποτε γένηται αὐτοῖς εἰς ὄνειδος — «чтобы не стало им в поношение» (ὄνειδος); ὅτι ἐμίαναν τὰ ἔθνη αὐτό — «ибо осквернили его язычники» (μιαίνω)."
  46: "ἀπέθεντο τοὺς λίθους ἐν τῷ ὄρει τοῦ οἴκου — «положили камни на горе дома (храма)»; ἐν τόπῳ ἐπιτηδείῳ — «в месте удобном (подходящем)» (ἐπιτήδειος); μέχρι τοῦ παραγενηθῆναι προφήτην — «до прихода пророка»; τοῦ ἀποκριθῆναι περὶ αὐτῶν — «чтобы дать ответ о них» (ἀποκρίνομαι)."
  47: "λίθους ὁλοκλήρους κατὰ τὸν νόμον — «камни целые по закону» (ὁλόκληρος — нетронутый, цельный); ᾠκοδόμησαν θυσιαστήριον καινόν — «построили жертвенник новый»; κατὰ τὸ πρότερον — «по прежнему (образцу)»."
  48: "ᾠκοδόμησαν τὰ ἅγια καὶ τὰ ἐντὸς τοῦ οἴκου — «устроили святыни и внутреннее дома»; τὰς αὐλὰς ἡγίασαν — «дворы освятили» (ἁγιάζω)."
  49: "σκεύη ἅγια καινά — «сосуды святые новые»; τὴν λυχνίαν — «светильник» (燭台[しょくだい]); τὸ θυσιαστήριον τῶν θυμιαμάτων — «жертвенник курений» (θυμίαμα — 香[こう]); τὴν τράπεζαν — «трапезу (стол хлебов)»."
  50: "ἐθυμίασαν ἐπὶ τὸ θυσιαστήριον — «воскурили на жертвеннике» (θυμιάω); ἐξῆψαν τοὺς λύχνους — «зажгли светильники» (ἐξάπτω); ἔφαινον ἐν τῷ ναῷ — «светили в храме» (φαίνω)."
  51: "ἐπέθηκαν ἐπὶ τὴν τράπεζαν ἄρτους — «положили на трапезу хлебы»; ἐξεπέτασαν τὰ καταπετάσματα — «развесили (распростёрли) завесы»; ἐτέλεσαν πάντα τὰ ἔργα — «окончили все дела»."
  52: "ὤρθρισαν τὸ πρωΐ — «встали рано утром» (ὀρθρίζω — 朝[あさ]早[はや]く起[お]きる); τῇ πέμπτῃ καὶ εἰκάδι τοῦ μηνὸς τοῦ ἐνάτου — «в двадцать пятый день девятого месяца»; οὗτος ὁ μὴν Χασελευ — «это месяц Хаслев» (キスレウ); τοῦ ὀγδόου καὶ τεσσαρακοστοῦ καὶ ἑκατοστοῦ ἔτους — «года сто сорок восьмого» (148 г.)."
  53: "ἀνήνεγκαν θυσίαν κατὰ τὸν νόμον — «принесли жертву по закону»; ἐπὶ τὸ θυσιαστήριον τῶν ὁλοκαυτωμάτων τὸ καινόν — «на жертвенник всесожжений новый»; ὃ ἐποίησαν — «который сделали»."
  54: "κατὰ τὸν καιρὸν καὶ κατὰ τὴν ἡμέραν, ἐν ᾗ ἐβεβήλωσαν αὐτό — «в то время и в тот день, в который осквернили его»; ἐνεκαινίσθη — «обновлён был» (ἐγκαινίζω); ἐν ᾠδαῖς καὶ κιθάραις καὶ κινύραις καὶ κυμβάλοις — «с песнями, кифарами, кинурами и кимвалами» (ᾠδή — 歌[うた]; κιθάρα — 琴[こと]; κινύρα — 竪琴[たてごと]; κύμβαλον — シンバル)."
  55: "ἔπεσεν πᾶς ὁ λαὸς ἐπὶ πρόσωπον — «пал весь народ на лицо»; προσεκύνησαν — «поклонились»; τὸν εὐοδώσαντα αὐτοῖς — «благоустроившего (даровавшего успех) им» (εὐοδόω)."
  56: "ἐγκαινισμὸν τοῦ θυσιαστηρίου ἡμέρας ὀκτώ — «обновление жертвенника восемь дней»; ὁλοκαυτώματα μετ' εὐφροσύνης — «всесожжения с весельем»; θυσίαν σωτηρίου καὶ αἰνέσεως — «жертву спасения и хвалы» (σωτήριον — 救[すく]い)."
  57: "κατεκόσμησαν τὸ κατὰ πρόσωπον τοῦ ναοῦ — «украсили переднюю сторону храма» (κατακοσμέω); στεφάνοις χρυσοῖς καὶ ἀσπιδίσκαις — «венцами золотыми и щитками» (ἀσπίσκος — 小[こ]盾[たて]); ἐνεκαίνισαν τὰς πύλας — «обновили врата»; ἐθύρωσαν αὐτά — «сделали им двери» (θυρόω)."
  58: "εὐφροσύνη μεγάλη ἐν τῷ λαῷ σφόδρα — «радость великая в народе весьма»; ἀπεστράφη ὀνειδισμὸς ἐθνῶν — «отвращено поношение язычников»."
  59: "ἔστησεν Ιουδας καὶ οἱ ἀδελφοὶ αὐτοῦ καὶ πᾶσα ἡ ἐκκλησία Ισραηλ — «постановил Иуда, братья его и вся церковь (собрание) Израиля» (ἵστημι — устанавливать); ἄγωνται αἱ ἡμέραι τοῦ ἐγκαινισμοῦ — «чтобы праздновались дни обновления» (ἄγω); ἐνιαυτὸν κατ' ἐνιαυτόν — «год за годом»; ἀπὸ τῆς πέμπτης καὶ εἰκάδος — «от двадцать пятого (дня)»; μετ' εὐφροσύνης καὶ χαρᾶς — «с весельем и радостью». Так установлен праздник Обновления (ハヌカ)."
  60: "ᾠκοδόμησαν… τὸ ὄρος Σιων κυκλόθεν — «обстроили гору Сион кругом» (κυκλόθεν — 周[まわ]りに); τείχη ὑψηλὰ καὶ πύργους ὀχυρούς — «стены высокие и башни крепкие»; μήποτε παραγενηθέντα τὰ ἔθνη καταπατήσωσιν — «чтобы когда-нибудь пришедшие язычники не попрали» (καταπατέω)."
  61: "ἀπέταξεν ἐκεῖ δύναμιν τηρεῖν αὐτό — «отрядил там силу охранять его» (ἀποτάσσω); ὠχύρωσεν… τὴν Βαιθσουραν — «укрепил Вефсуру» (βαιθσουρα — ベテズル); τοῦ ἔχειν τὸν λαὸν ὀχύρωμα — «чтобы народ имел крепость»; κατὰ πρόσωπον τῆς Ιδουμαίας — «против Идумеи»."
