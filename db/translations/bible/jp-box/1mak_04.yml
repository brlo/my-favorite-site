# jp-box, 1 Маккавейская, глава 4. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz и csl-ru глава 4 имеет 61 стих.
# Расхождение распределения: в csl 4:21 оканчивается «бежаша вси в землю иноплеменников»,
# а 4:22 начинается «И обратися иуда на корысти ополчения»; в LXX эти слова стоят
# в 4:22 и 4:23. Держим LXX-распределение, номера слав. (отмечено в notes к 22–23).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: 1–4 Горгий идёт ночью на стан Иуды; 5–15 Иуда у Еммаума, речь и победа;
# 16–25 преследование, добыча, благодарение; 26–35 Лисий с шестьюдесятью тысячами
# разбит при Вефсуре; 36–51 очищение святилища и новый жертвенник; 52–59 освящение
# и установление праздника Обновления; 60–61 укрепление Сиона и Вефсуры.
# Голоса: 8–11 — речь Иуды в 「…」; 17–18 — его слова народу в 「…」; 30–33 — молитва
# Иуды в 「…」; 36 — слова Иуды и братьев в 「…」. Остальное — повествование.
# Термины: 聖所[せいしょ] — ἁγίασμα/τὰ ἅγια; 神殿[しんでん] — ναός; 祭壇[さいだん] — θυσιαστήριον;
# 燔祭[はんさい] — ὁλοκαύτωμα; 香[こう] — θυμίαμα; 燭台[しょくだい] — λυχνία; 垂[た]れ幕[まく] — καταπέτασμα;
# 再奉献[さいほうけん]/奉献[ほうけん] — ἐγκαινισμός (праздник Обновления); 異邦人[いほうじん] — ἔθνη/ἀλλόφυλοι;
# ペリシテ人[じん] — ἀλλόφυλοι; 騎兵[きへい] — ἵππος; 戦列[せんれつ] — παράταξις; ダビデ, ヨナタン, サウル.
#
