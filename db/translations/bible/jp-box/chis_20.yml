# jp-box, Числа, глава 20. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru).
# ru (Синодальный) — только для понимания, не источник. jp-joc в этой главе отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 20: смерть Мириам в Кадесе (1), ропот без воды (2–5), молитва Моисея
# и Аарона (6), повеление сказать скале (7–8), удар жезлом дважды и вода (9–11),
# приговор Моисею и Аарону (12), вода пререкания (13),
# посольство к Едому и отказ (14–21), приход к горе Ор (22),
# смерть Аарона и оплакивание (23–29).
# Речь Бога — 「…」 (8, 12, 24–26); слова Моисея — 「…」 (10);
# слова Израиля Едому — 「…」 (14–17); слова Едома — 「…」 (18, 20); красного нет.
# Нумерация: 29 стихов по gr-lxx-byz; в csl-ru 30 — csl 28–29 делят gr 28
# (28: снятие одежд, 29: смерть и сошествие), csl 30 = gr 29. Держимся gr.
# 〔…〕 нет; добавки csl (20:11 «(весь)») в текст не внесены.
# Сносок ⟨…⟩ нет: メリバ, ホル, エドム, カデス, 宿営 уже в корпусе или понятны.
# jp-ni не использовался.

