verses:
  1: "イスラエルの子[こ]ら、すなわち全会衆[かいしゅう]は、第一[だいいち]の月[つき]にシンの荒[あ]れ野[の]に来[き]て、民[たみ]はカデスにとどまった。そこでミリアムが死[し]に、そこに葬[ほうむ]られた。"
  2: "会衆[かいしゅう]には水[みず]がなかった。民[たみ]はモーセとアロンに逆[さか]らって集[あつ]まった。"
  3: "民[たみ]はモーセと争[あらそ]って言[い]った。「ああ、わたしたちも、兄弟[きょうだい]たちが主[しゅ]の前[まえ]で滅[ほろ]びたとき、ともに死[し]んでいればよかったのに。"
  4: "なぜ、あなたがたは主[しゅ]の会衆[かいしゅう]をこの荒野[こうや]へ連[つ]れ出[だ]して、わたしたちと家畜[かちく]を殺[ころ]そうとするのか。"
  5: "なぜ、あなたがたはわたしたちをエジプトから連[つ]れ出[だ]し、この悪[わる]い場所[ばしょ]へ来[こ]させたのか。ここは種[たね]をまくこともできず、いちじくも、ぶどうも、ざくろもなく、飲[の]む水[みず]もない所[ところ]である。」"
  6: "モーセとアロンは会衆[かいしゅう]の前[まえ]から証[あかし]の幕屋[まくや]の戸口[とぐち]へ行[い]き、顔[かお]を地[ち]につけて伏[ふ]した。すると、主[しゅ]の栄光[えいこう]が彼[かれ]らのほうに現[あらわ]れた。"
  7: "主[しゅ]はモーセに語[かた]って言[い]われた。"
  8: "「あなたは杖[つえ]を取[と]り、あなたとあなたの兄弟[きょうだい]アロンは会衆[かいしゅう]を集[あつ]めなさい。そして、彼[かれ]らの目[め]の前[まえ]で岩[いわ]に向[む]かって語[かた]りなさい。岩[いわ]はその水[みず]を出[だ]すであろう。あなたがたは岩[いわ]から水[みず]を出[だ]して、会衆[かいしゅう]とその家畜[かちく]に飲[の]ませなさい。」"
  9: "モーセは、主[しゅ]が命[めい]じられたとおりに、主[しゅ]の前[まえ]にある杖[つえ]を取[と]った。"
  10: "モーセとアロンは会衆[かいしゅう]を岩[いわ]の前[まえ]に集[あつ]め、彼[かれ]は言[い]った。「聞[き]きなさい、逆[さか]らう者[もの]たち。この岩[いわ]から、わたしたちがあなたがたのために水[みず]を出[だ]すというのか。」"
  11: "モーセは手[て]を上[あ]げ、杖[つえ]で岩[いわ]を二度[にど]打[う]った。すると、多[おお]くの水[みず]が流[なが]れ出[で]て、会衆[かいしゅう]とその家畜[かちく]は飲[の]んだ。"
  12: "主[しゅ]はモーセとアロンに言[い]われた。「あなたがたは、イスラエルの子[こ]らの前[まえ]でわたしを聖[せい]なる者[もの]として示[しめ]すことを信[しん]じなかった。それゆえ、あなたがたはこの会衆[かいしゅう]を、わたしが彼[かれ]らに与[あた]える地[ち]へ導[みちび]き入[い]れることはない。」"
  13: "これが争[あらそ]いの水[みず]である。イスラエルの子[こ]らが主[しゅ]の前[まえ]で争[あらそ]ったからであり、主[しゅ]は彼[かれ]らの中[なか]にあって、ご自身[じしん]を聖[せい]なる者[もの]として示[しめ]された。"
  14: "モーセはカデスから、エドムの王[おう]のもとへ使者[ししゃ]を遣[つか]わして言[い]った。「あなたの兄弟[きょうだい]イスラエルはこう言[い]う。あなたは、わたしたちに降[ふ]りかかったすべての苦労[くろう]を知[し]っている。"
  15: "わたしたちの父[ちち]たちはエジプトに下[くだ]り、わたしたちは長[なが]い間[あいだ]エジプトに住[す]んだ。エジプト人[じん]はわたしたちと父[ちち]たちを苦[くる]しめた。"
  16: "わたしたちが主[しゅ]に叫[さけ]ぶと、主[しゅ]はわたしたちの声[こえ]を聞[き]き、使[つか]いを遣[つか]わしてわたしたちをエジプトから連[つ]れ出[だ]された。そして今[いま]、わたしたちはカデスにいる。あなたの領界[りょうかい]の端[はし]にある町[まち]である。"
  17: "どうか、あなたの地[ち]を通[とお]らせてください。わたしたちは畑[はたけ]もぶどう畑[ばたけ]も通[とお]らず、井戸[いど]の水[みず]も飲[の]まない。王[おう]の道[みち]を歩[ある]き、あなたの領界[りょうかい]を過[す]ぎるまで、右[みぎ]にも左[ひだり]にもそれない。」"
  18: "エドムは言[い]った。「あなたはわたしのところを通[とお]ってはならない。もし通[とお]るなら、わたしは剣[つるぎ]をもってあなたを迎[むか]えに出[で]る。」"
  19: "イスラエルの子[こ]らは言[い]った。「わたしたちは山[やま]のふもとを通[とお]ります。もし、わたしと家畜[かちく]があなたの水[みず]を飲[の]むなら、その代価[だいか]を払[はら]います。それは取[と]るに足[た]らないことです。ただ、山[やま]のふもとを通[とお]るだけです。」"
  20: "しかし、エドムは言[い]った。「あなたは通[とお]ってはならない。」そしてエドムは、多[おお]くの民[たみ]と強[つよ]い手[て]をもって、彼[かれ]を迎[むか]えに出[で]た。"
  21: "エドムはイスラエルに自分[じぶん]の領界[りょうかい]を通[とお]らせることを望[のぞ]まなかった。そこでイスラエルは彼[かれ]から離[はな]れて行[い]った。"
  22: "彼[かれ]らはカデスを発[た]ち、イスラエルの子[こ]ら、全会衆[かいしゅう]はホル山[やま]に来[き]た。"
  23: "主[しゅ]は、エドムの地[ち]の領界[りょうかい]にあるホル山[やま]で、モーセとアロンに語[かた]って言[い]われた。"
  24: "「アロンは自分[じぶん]の民[たみ]に加[くわ]えられる。彼[かれ]は、わたしがイスラエルの子[こ]らに与[あた]える地[ち]に入[はい]らない。あなたがたが争[あらそ]いの水[みず]のところで、わたしの言葉[ことば]に逆[さか]らったからである。"
  25: "あなたはアロンとその子[こ]エレアザルを連[つ]れ、彼[かれ]らを全会衆[かいしゅう]の前[まえ]でホル山[やま]に登[のぼ]らせなさい。"
  26: "そして、アロンの衣[ころも]を脱[ぬ]がせ、それをその子[こ]エレアザルに着[き]せなさい。アロンはそこで民[たみ]に加[くわ]えられて死[し]ぬであろう。」"
  27: "モーセは主[しゅ]が命[めい]じられたとおりに行[おこな]い、彼[かれ]らは全会衆[かいしゅう]の見[み]ている前[まえ]でホル山[やま]に登[のぼ]った。"
  28: "モーセはアロンの衣[ころも]を脱[ぬ]がせ、それをその子[こ]エレアザルに着[き]せた。アロンは山[やま]の頂[いただき]で死[し]んだ。モーセとエレアザルは山[やま]から下[くだ]った。"
  29: "全会衆[かいしゅう]はアロンが死[し]んだのを見[み]て、イスラエルの全家[ぜんか]は三十日[さんじゅうにち]の間[あいだ]、アロンを泣[な]き悲[かな]しんだ。"

notes:
  1: "πᾶσα ἡ συναγωγή — весь сонм. ἔρημος Σιν — シンの荒れ野 (см. Исх 16:1; не Синай). κατέμεινεν — остался (καταμένω). ἐτελεύτησεν — скончалась (τελευτάω). ἐτάφη — погребена (θάπτω)."
  2: "ἠθροίσθησαν ἐπὶ Μωυσῆν — собрались против Моисея (ἐπί + винительный — «против»; ἀθροίζω — собирать)."
  3: "ἐλοιδορεῖτο — бранился, ссорился (λοιδορέω; ср. ст. 13 λοιδορία). Ὄφελον ἀπεθάνομεν — «о, если бы мы умерли»: ὄφελον с аористом выражает неисполнимое желание. ἐν τῇ ἀπωλείᾳ τῶν ἀδελφῶν — «в погибели братьев» (ἀπώλεια; речь о Корее и его сообщниках, гл. 16)."
  4: "ἀνηγάγετε — вывели (ἀνάγω). ἀποκτεῖναι — убить (ἀποκτείνω). τὰ κτήνη ἡμῶν — скот наш."
  5: "τόπος πονηρός — злое место. οὐ σπείρεται — не сеется. συκαῖ, ἄμπελοι, ῥόαι — смоковницы, виноградные лозы, гранаты (συκῆ, ἄμπελος, ῥόα). ὕδωρ πιεῖν — вода для питья."
  6: "ἀπὸ προσώπου τῆς συναγωγῆς — «от лица общества», т. е. от собрания. ἔπεσαν ἐπὶ πρόσωπον — пали на лицо своё (мн. ч. при двух подлежащих). ὤφθη ἡ δόξα κυρίου — явилась слава Господня (ὀπτάνομαι, страд.)."
  7: "Обычная формула введения речи; λέγων отдельно не передаётся."
  8: "ἐκκλησίασον — созови (ἐκκλησιάζω; ἐκκλησία — собрание). λαλήσατε πρὸς τὴν πέτραν — скажите скале (не ὄρος «гора», как в Исх 17:6). πέτρα — скала; δώσει τὰ ὕδατα αὐτῆς — «даст воды свои» (мн. ч.). ποτιεῖτε — напоите (ποτίζω)."
  9: "τὴν ῥάβδον τὴν ἀπέναντι κυρίου — жезл, что пред Господом (жезл Аарона из гл. 17). καθὰ συνέταξεν κύριος — как повелел Господь."
  10: "ἐξεκκλησίασεν — созвал. Ἀκούσατέ μου — послушайте меня. οἱ ἀπειθεῖς — непокорные, непослушные (ἀπειθής). μὴ … ἐξάξομεν — «разве выведем?»: μή с будущим в вопросе, ожидающем отрицания; множественное «мы» — Моисей и Аарон говорят о себе."
  11: "ἐπάρας — подняв (ἐπαίρω). ἐπάταξεν — ударил (πατάσσω). δίς — дважды. ὕδωρ πολύ — много воды. В csl добавлено «(весь)» — в греческом его нет."
  12: "ἐπιστεύσατε ἁγιάσαι με — «поверили, чтобы освятить Меня»: инфинитив цели при πιστεύω. εἰσάξετε — введёте (εἰσάγω). ἣν δέδωκα αὐτοῖς — которую Я дал им."
  13: "ὕδωρ ἀντιλογίας — «вода пререкания» (ἀντιλογία); евр. Мерива, в корпусе (Пс 81:8) メリバの水; в LXX имя передано нарицательно. ἡγιάσθη ἐν αὐτοῖς — «освятился в них» (страд.): Господь явил среди них святость."
  14: "ἀπέστειλεν ἀγγέλους — послал послов (ἄγγελος — посланник). Τάδε λέγει — так говорит. ἐπίστῃ — знаешь (ἐπίσταμαι). μόχθος — труд, тягота; τὸν μόχθον τὸν εὑρόντα ἡμᾶς — «труд, постигший нас»."
  15: "παρῳκήσαμεν — жили пришельцами (παροικέω). ἡμέρας πλείους — много дней. ἐκάκωσαν — озлобили (κακόω)."
  16: "ἀνεβοήσαμεν — воззвали (ἀναβοάω). εἰσήκουσεν τῆς φωνῆς — услышал голос (ἀκούω + род.). ἀποστείλας ἄγγελον — послав ангела (в Синодальном с большой буквы; здесь — 使い). πόλις ἐκ μέρους τῶν ὁρίων σου — «город в части пределов твоих», т. е. на краю твоих владений."
  17: "παρελευσόμεθα — пройдём (παρέρχομαι); будущее в значении просьбы (слав. «да прейдем»), отсюда 通らせてください. λάκκος — яма, колодец, цистерна. ὁδὸς βασιλική — царская дорога. ἐκκλινοῦμεν — уклонимся (ἐκκλίνω). ἕως ἂν παρέλθωμεν — доколе не пройдём."
  18: "εἰ δὲ μή — если же нет. ἐν πολέμῳ — с войной, с мечом (слав. «ратию»). εἰς συνάντησίν σοι — навстречу тебе."
  19: "παρὰ τὸ ὄρος — «подле горы» (слав. «под горою»). τιμή — цена, плата. τὸ πρᾶγμα οὐδέν ἐστιν — «дело ничтожно», т. е. ничего не стоит (Синодальный передаёт иначе: «ногами моими пройду»)."
  20: "ὄχλος βαρύς — тяжёлое, многочисленное множество (βαρύς — тяжёлый). χεὶρ ἰσχυρά — крепкая рука."
  21: "οὐκ ἠθέλησεν — не захотел (θέλω). ἐξέκλινεν — уклонился (ἐκκλίνω, ср. ст. 17)."
  22: "ἀπῆραν — отправились (ἀπαίρω). Ωρ τὸ ὄρος — гора Ор (Хор), близ Едома."
  23: "ἐπὶ τῶν ὁρίων γῆς Εδωμ — у пределов земли Едомской."
  24: "Προστεθήτω — «да приложится» (императив 3-го л.; эвфемизм смерти: приложиться к народу своему). παρωξύνατέ με — вы преогорчили, прогневали Меня (παροξύνω). ὕδωρ τῆς λοιδορίας — вода пререкания (λοιδορία; ср. ст. 13 ἀντιλογία)."
  25: "ἀναβίβασον — возведи (ἀναβιβάζω). ἔναντι πάσης τῆς συναγωγῆς — пред всем обществом."
  26: "ἔκδυσον — сними (ἐκδύω). ἔνδυσον — облеки (ἐνδύω). στολή — одежда, облачение (первосвященническое). προστεθεὶς ἀποθανέτω — «приложившись, да умрёт»."
  27: "ἐποίησεν καθὰ συνέταξεν κύριος — сделал, как повелел Господь. ἀνεβίβασεν — возвёл (ед. ч.: Моисей; слав. «возведе я»)."
  28: "ἐξέδυσεν — снял (Моисей с Аарона). ἐπὶ τῆς κορυφῆς τοῦ ὄρους — на вершине горы. κατέβη — сошёл. В csl этот стих разделён на два (28–29), поэтому в csl всего 30 стихов."
  29: "ἀπελύθη — «освободился», т. е. умер (ἀπολύω; слав. передаёт «умре»). ἔκλαυσαν τριάκοντα ἡμέρας — оплакивали тридцать дней. πᾶς οἶκος Ισραηλ — весь дом Израилев."
