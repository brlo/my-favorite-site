verses:
  1: "万軍[ばんぐん]の主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  2: "万軍[ばんぐん]の主[しゅ]はこう言[い]われる。「わたしはエルサレムとシオンのために、大[おお]きな熱[ねつ]心[しん]をもって熱心[ねっしん]になり、大[おお]きな憤[いきどお]りをもって、これを熱心[ねっしん]に求[もと]めた。」"
  3: "主[しゅ]はこう言[い]われる。「わたしはシオンに帰[かえ]り、エルサレムの中[なか]に住[す]む。エルサレムは真実[しんじつ]の都[みやこ]と呼[よ]ばれ、万軍[ばんぐん]の主[しゅ]の山[やま]は聖[せい]なる山[やま]と呼[よ]ばれる。」"
  4: "万軍[ばんぐん]の主[しゅ]はこう言[い]われる。「再[ふたた]び、老[お]いた男[おとこ]たちと老[お]いた女[おんな]たちがエルサレムの街路[がいろ]に座[すわ]る。それぞれ、多[おお]くの日[ひ]のゆえに、手[て]に杖[つえ]を持[も]つ。"
  5: "都[みやこ]の街路[がいろ]は、その街路[がいろ]で遊[あそ]ぶ男[おとこ]の子[こ]たちと女[おんな]の子[こ]たちで満[み]ちる。」"
  6: "万軍[ばんぐん]の主[しゅ]はこう言[い]われる。「もしこれが、この民[たみ]の残[のこ]りの者[もの]たちの目[め]に、これらの日[ひ]々[び]にできないことなら、わたしの目[め]にもできないことなのか、と万軍[ばんぐん]の主[しゅ]は言[い]われる。」"
  7: "万軍[ばんぐん]の主[しゅ]はこう言[い]われる。「見[み]よ、わたしはわたしの民[たみ]を、東[ひがし]の地[ち]から、西[にし]の地[ち]から救[すく]う。"
  8: "わたしは彼らを連[つ]れて来[き]て、エルサレムの中[なか]に住[す]まわせる。彼らはわたしの民[たみ]となり、わたしは真実[しんじつ]と正[ただ]しさをもって彼らの神[かみ]となる。」"
  9: "万軍[ばんぐん]の主[しゅ]はこう言[い]われる。「これらの日[ひ]に、これらの言葉[ことば]を預言者[よげんしゃ]の口[くち]から聞[き]くあなたがたは、手[て]を強[つよ]くせよ。万軍[ばんぐん]の主[しゅ]の家[いえ]の基[もとい]が据[す]えられ、神殿[しんでん]が建[た]てられた日[ひ]から。"
  10: "それらの日[ひ]の前[まえ]には、人[ひと]の報酬[ほうしゅう]は益[えき]とならず、家畜[かちく]の報酬[ほうしゅう]もなく、出[で]て行[い]く者[もの]にも入[はい]って来[く]る者[もの]にも、苦[くる]しみのゆえに平和[へいわ]がなかった。わたしはすべての人[ひと]を、互[たが]いに隣人[りんじん]に向[む]かって攻[せ]めさせた。"
  11: "しかし今[いま]、わたしはこの民[たみ]の残[のこ]りの者[もの]に対して、以前[いぜん]の日[ひ]々[び]のようにはしない、と万軍[ばんぐん]の主[しゅ]は言[い]われる。"
  12: "わたしは平和[へいわ]を示[しめ]す。ぶどうの木[き]は実[み]を結[むす]び、地[ち]は産物[さんぶつ]を出[だ]し、天[てん]は露[つゆ]を降[ふ]らせる。わたしはこれらすべてを、この民[たみ]の残[のこ]りの者[もの]に嗣業[しぎょう]として与[あた]える。"
  13: "ユダの家[いえ]とイスラエルの家[いえ]よ。あなたがたが民[たみ]の間[あいだ]で呪[のろ]いとなったように、わたしはあなたがたを救[すく]い、あなたがたは祝福[しゅくふく]となる。恐[おそ]れるな。あなたがたの手[て]を強[つよ]くせよ。」"
  14: "万軍[ばんぐん]の主[しゅ]はこう言[い]われる。「あなたがたの父[ちち]たちがわたしを怒[いか]らせたとき、わたしがあなたがたを罰[ばっ]しようと定[さだ]めて、思[おも]い直[なお]さなかったように、"
  15: "これらの日[ひ]に、わたしは再[ふたた]びエルサレムとユダの家[いえ]に善[よ]を行[おこな]おうと定[さだ]めた。恐[おそ]れるな。"
  16: "あなたがたが行[おこな]うべきことはこれである。互[たが]いに真実[しんじつ]を語[かた]り、あなたがたの門[もん]で真実[しんじつ]と平和[へいわ]の裁[さば]きをせよ。"
  17: "互[たが]いに心[こころ]のうちで隣人[りんじん]の悪[わる]を思[おも]うな。偽[いつわ]りの誓[ちか]いを愛[あい]するな。わたしはこれらすべてを憎[にく]んでいる、と主[しゅ]は言[い]われる。」"
  18: "万軍[ばんぐん]の主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  19: "万軍[ばんぐん]の主[しゅ]はこう言[い]われる。「第四[だいし]の月[つき]の断食[だんじき]、第五[だいご]の断食[だんじき]、第七[だいしち]の断食[だんじき]、第十[だいじゅう]の断食[だんじき]は、ユダの家[いえ]にとって喜[よろこ]びとなり、楽[たの]しみとなり、良[よ]い祭[まつ]りとなる。あなたがたは真実[しんじつ]と平和[へいわ]を愛[あい]せよ。」"
  20: "万軍[ばんぐん]の主[しゅ]はこう言[い]われる。「多[おお]くの民[たみ]と、多[おお]くの町[まち]の住民[じゅうみん]がまだ来[く]る。"
  21: "五[いつ]つの町[まち]の住[す]む者[もの]たちが一[ひと]つの町[まち]に集[あつ]まり、『さあ、主[しゅ]の御顔[みかお]を求[もと]めて祈[いの]ろう。万軍[ばんぐん]の主[しゅ]を尋[たず]ねよう』と言[い]う。そして、それぞれが『わたしも行[い]こう』と言[い]う。"
  22: "多[おお]くの民[たみ]と強[つよ]い国[くに]々[くに]が、エルサレムで万軍[ばんぐん]の主[しゅ]を尋[たず]ね、主[しゅ]の御顔[みかお]を求[もと]めて祈[いの]るために来[く]る。」"
  23: "万軍[ばんぐん]の主[しゅ]はこう言[い]われる。「その日[ひ]々[び]、すべての民[たみ]の言[こと]葉[ば]から十人[じゅうにん]の者[もの]が、ユダヤ人[じん]の衣[ころも]の裾[すそ]をつかみ、『あなたがたと一緒[いっしょ]に行[い]こう。神[かみ]があなたがたとともにいるのを聞[き]いたから』と言[い]う。」"

notes:
  1: "ἐγένετο λόγος κυρίου παντοκράτορος — «было слово Господа Вседержителя»."
  2: "Ἐζήλωσα τὴν Ιερουσαλημ καὶ τὴν Σιων — «возревновал о Иерусалиме и Сионе»; θυμῷ μεγάλῳ — «яростью великою»."
  3: "πόλις ἡ ἀληθινή — «город истинный»; ὄρος ἅγιον — «гора святая»."
  4: "πρεσβύτεροι καὶ πρεσβύτεραι — «старцы и старицы»; ῥάβδον — «посох, жезл»; ἀπὸ πλήθους ἡμερῶν — «от множества дней»."
  5: "παιδαρίων καὶ κορασίων παιζόντων — «отроков и отроковиц играющих»."
  6: "εἰ ἀδυνατήσει ἐνώπιον τῶν καταλοίπων — «если покажется невозможным (дивным) пред остатком»; μὴ καὶ ἐνώπιον ἐμοῦ ἀδυνατήσει — «разве и предо Мною невозможно?»."
  7: "ἀπὸ γῆς ἀνατολῶν καὶ ἀπὸ γῆς δυσμῶν — «из земли востока и из земли запада»."
  8: "εἰς λαόν — «в народ»; ἐν ἀληθείᾳ καὶ ἐν δικαιοσύνῃ — «в истине и правде»."
  9: "Κατισχυέτωσαν αἱ χεῖρες ὑμῶν — «да укрепятся руки ваши»; ἀφ' ἧς ἡμέρας τεθεμελίωται — «с того дня, как положено основание»."
  10: "μισθὸς τῶν ἀνθρώπων οὐκ ἔσται εἰς ὄνησιν — «плата людей не будет в пользу»; ἐξαποστελῶ πάντας… ἐπὶ τὸν πλησίον — «пошлю всех… на ближнего» (взаимная вражда)."
  11: "οὐ κατὰ τὰς ἡμέρας τὰς ἔμπροσθεν — «не по дням прежним»."
  12: "δείξω εἰρήνην — «покажу мир»; ἡ ἄμπελος δώσει τὸν καρπόν — «виноград даст плод»; δρόσος — «роса»."
  13: "ὃν τρόπον ἦτε ἐν κατάρᾳ — «как вы были в проклятии»; ἔσεσθε ἐν εὐλογίᾳ — «будете в благословении»; θαρσεῖτε — «дерзайте»."
  14: "Ὃν τρόπον διενοήθην τοῦ κακῶσαι — «как Я помыслил озлобить»; οὐ μετενόησα — «не раскаялся»."
  15: "οὕτως παρατέταγμαι… τοῦ καλῶς ποιῆσαι — «так Я расположился… благотворить»."
  16: "λαλεῖτε ἀλήθειαν — «говорите истину»; κρίμα εἰρηνικὸν κρίνατε — «суд мирный судите»."
  17: "μὴ λογίζεσθε ἐν ταῖς καρδίαις — «не помышляйте в сердцах»; ὅρκον ψευδῆ μὴ ἀγαπᾶτε — «клятвы ложной не любите»."
  18: "ἐγένετο λόγος κυρίου παντοκράτορος — «было слово Господа Вседержителя»."
  19: "νηστεία ἡ τετρὰς καὶ ἡ πέμπτη καὶ ἡ ἑβδόμη καὶ ἡ δεκάτη — посты 4-го, 5-го, 7-го и 10-го месяцев; εἰς χαρὰν καὶ εὐφροσύνην — «в радость и веселие»."
  20: "Ἔτι ἥξουσιν λαοὶ πολλοί — «ещё придут народы многие»."
  21: "συνελεύσονται κατοικοῦντες πέντε πόλεις εἰς μίαν πόλιν — «сойдутся жители пяти городов в один город» (слав.; в ru «из одного города к другому» — МТ); Πορευθῶμεν δεηθῆναι τοῦ προσώπου κυρίου — «пойдём помолиться лицу Господню»."
  22: "ἔθνη πολλὰ ἐκζητῆσαι τὸ πρόσωπον — «народы многие взыскать лицо»; ἐξιλάσκεσθαι — «умолить»."
  23: "ἐπιλάβωνται τοῦ κρασπέδου ἀνδρὸς Ιουδαίου — «возьмутся за край одежды Иудея»; δέκα ἄνδρες — «десять человек»; ὁ θεὸς μεθ' ὑμῶν — «Бог с вами»."
