verses:
  1: "デメトリオスは、ニカノルとその軍[ぐん]が戦[たたか]いで倒[たお]れたことを聞[き]くと、バッキデスとアルキモスを再[ふたた]びユダヤの地[ち]へ送[おく]り、右翼[うよく]の部隊[ぶたい]を彼[かれ]らに付[つ]け加[くわ]えた。"
  2: "彼[かれ]らはガルガラへの道[みち]を行[い]き、アルベラにあるメサロトに陣[じん]を敷[し]き、これを占領[せんりょう]して多[おお]くの人[ひと]の命[いのち]を奪[うば]った。"
  3: "百五十二年[ひゃくごじゅうにねん]の第一[だいいち]の月[つき]に、彼[かれ]らはエルサレムに向[む]かって陣[じん]を敷[し]いた。"
  4: "そしてそこを発[た]って、二万[にまん]の兵[へい]と二千[にせん]の騎兵[きへい]を率[ひき]いてベレアへ進[すす]んだ。"
  5: "ユダはエラサに陣[じん]を敷[し]いており、彼[かれ]とともに精鋭[せいえい]の兵[へい]三千人[さんぜんにん]がいた。"
  6: "彼[かれ]らは軍勢[ぐんぜい]の数[かず]が多[おお]いのを見[み]て非常[ひじょう]に恐[おそ]れ、陣営[じんえい]から多[おお]くの者[もの]が逃[に]げ去[さ]り、残[のこ]ったのはわずかに八百人[はっぴゃくにん]であった。"
  7: "ユダは自分[じぶん]の陣営[じんえい]が散[ち]り、戦[たたか]いが自分[じぶん]を圧迫[あっぱく]しているのを見[み]て、心[こころ]が砕[くだ]けた。彼[かれ]らを集[あつ]める時[とき]がなかったからである。"
  8: "彼[かれ]は力[ちから]を失[うしな]ったが、残[のこ]った者[もの]たちに言[い]った。「立[た]ち上[あ]がって、われわれに敵対[てきたい]する者[もの]たちのところへ上[のぼ]って行[い]こう。もしかすると、彼[かれ]らと戦[たたか]うことができるかもしれない。」"
  9: "しかし彼[かれ]らは彼[かれ]を引[ひ]き返[かえ]させて言[い]った。「われわれにはできない。今[いま]はただ自分[じぶん]たちの命[いのち]を救[すく]おう。兄弟[きょうだい]たちのもとへ戻[もど]って、彼[かれ]らとともに戦[たたか]おう。われわれは少[すく]ないのだから。」"
  10: "ユダは言[い]った。「そのようなことをして、彼[かれ]らから逃[に]げるなど、決[けっ]してあってはならない。もしわれわれの時[とき]が近[ちか]づいたのなら、兄弟[きょうだい]たちのために雄々[おお]しく死[し]のう。われわれの栄光[えいこう]に汚点[おてん]を残[のこ]してはならない。」"
  11: "軍勢[ぐんぜい]は陣営[じんえい]から進[すす]み出[で]て、彼[かれ]らと対峙[たいじ]した。騎兵[きへい]は二[ふた]つの部隊[ぶたい]に分[わ]かれ、石投[いしな]げ兵[へい]と弓兵[ゆみへい]が軍勢[ぐんぜい]の先[さき]を行[い]き、勇士[ゆうし]たちはすべて先頭[せんとう]に立[た]った。バッキデスは右翼[うよく]にいた。"
  12: "両側[りょうがわ]から部隊[ぶたい]が近[ちか]づき、ラッパを吹[ふ]き鳴[な]らした。ユダの側[がわ]の者[もの]たちもラッパを吹[ふ]いた。"
  13: "陣営[じんえい]の声[こえ]によって地[ち]が揺[ゆ]れ、戦[たたか]いは朝[あさ]から夕[ゆう]べまで続[つづ]いた。"
  14: "ユダは、バッキデスと陣営[じんえい]の主力[しゅりょく]が右側[みぎがわ]にいるのを見[み]て、心[こころ]の勇敢[ゆうかん]な者[もの]たちがすべて彼[かれ]のもとに集[つど]った。"
  15: "彼[かれ]らは敵[てき]の右翼[うよく]を砕[くだ]き、アゾトの山[やま]まで彼[かれ]らの後[あと]を追[お]った。"
  16: "左翼[さよく]にいた者[もの]たちは、右翼[うよく]が砕[くだ]かれたのを見[み]て、ユダとその仲間[なかま]たちの後[うし]ろに回[まわ]り、背後[はいご]から従[したが]った。"
  17: "戦[たたか]いは激[はげ]しくなり、双方[そうほう]から多[おお]くの者[もの]が傷[きず]ついて倒[たお]れた。"
  18: "ユダは倒[たお]れ、残[のこ]りの者[もの]は逃[に]げた。"
  19: "ヨナタンとシモンは兄弟[きょうだい]ユダを担[かつ]ぎ、父祖[ふそ]の墓[はか]に葬[ほうむ]った。それはモディンにあった。"
  20: "イスラエルは皆[みな]、彼[かれ]のために泣[な]き、大[おお]きな嘆[なげ]きをもって彼[かれ]を悼[いた]み、多[おお]くの日[ひ]を悲[かな]しみ、そして言[い]った。"
  21: "「どうして勇士[ゆうし]が倒[たお]れたのか、イスラエルを救[すく]う者[もの]が。」"
  22: "ユダの残[のこ]りの言葉[ことば]、彼[かれ]が行[おこな]った戦[たたか]いと武勇[ぶゆう]、その偉大[いだい]さは記[しる]されていない。それはあまりにも多[おお]かったからである。"
  23: "ユダの死後[しご]、不法[ふほう]な者[もの]たちがイスラエルのすべての境[さかい]に現[あらわ]れ、不正[ふせい]を行[おこな]う者[もの]がすべて芽[め]を出[だ]した。"
  24: "その日々[ひび]に非常[ひじょう]に大[おお]きな飢饉[ききん]があり、国[くに]は彼[かれ]らの側[がわ]についた。"
  25: "バッキデスは不敬虔[ふけいけん]な者[もの]たちを選[えら]び、その地方[ちほう]の支配者[しはいしゃ]とした。"
  26: "彼[かれ]らはユダの友[とも]たちを捜[さが]し出[だ]して調[しら]べ、バッキデスのもとへ連[つ]れて行[い]った。彼[かれ]は彼[かれ]らに復讐[ふくしゅう]し、嘲弄[ちょうろう]した。"
  27: "イスラエルに大[おお]きな苦難[くなん]が起[お]きた。預言者[よげんしゃ]が彼[かれ]らのもとに現[あらわ]れなくなった日[ひ]以来[いらい]、そのような苦難[くなん]はなかった。"
  28: "ユダの友[とも]たちは皆[みな]集[つど]って、ヨナタンに言[い]った。"
  29: "「あなたの兄弟[きょうだい]ユダが亡[な]くなってから、敵[てき]やバッキデス、またわれわれの民[たみ]を憎[にく]む者[もの]たちのところへ出[で]て行[い]き、また入[はい]って行[い]くのに、彼[かれ]に似[に]た者[もの]はない。」"
  30: "「今[いま]、われわれはあなたを、彼[かれ]の代[か]わりにわれわれの指導者[しどうしゃ]、われわれの戦[たたか]いを戦[たたか]う頭[かしら]として選[えら]んだ。」"
  31: "ヨナタンはその時[とき]、指導[しどう]の任[にん]を受[う]け、兄弟[きょうだい]ユダの代[か]わりに立[た]ち上[あ]がった。"
  32: "バッキデスはこれを知[し]り、彼[かれ]を殺[ころ]そうと求[もと]めた。"
  33: "ヨナタンとその兄弟[きょうだい]シモン、および彼[かれ]とともにいる者[もの]は皆[みな]これを知[し]り、テコエの荒野[こうや]へ逃[に]げて、アスファルの泉[いずみ]のほとりに陣[じん]を敷[し]いた。"
  34: "バッキデスは安息日[あんそくび]にそれを知[し]り、自分[じぶん]とその全軍[ぜんぐん]とともにヨルダンの向[む]こう岸[ぎし]へ渡[わた]った。"
  35: "ヨナタンは自分[じぶん]の兄弟[きょうだい]を民[たみ]の頭[かしら]として送[おく]り、自分[じぶん]の友[とも]であるナバタイ人[じん]たちに、多[おお]くの荷[に]を彼[かれ]らのもとに預[あず]けるよう頼[たの]んだ。"
  36: "しかし、メダバ出身[しゅっしん]のヤムブリの子[こ]らが出[で]て来[き]て、ヨハネと彼[かれ]が持[も]っていたすべてのものを捕[と]らえ、持[も]って行[い]った。"
  37: "これらのことの後[あと]、ヨナタンとその兄弟[きょうだい]シモンに次[つぎ]のように告[つ]げられた。ヤムブリの子[こ]らは大[おお]きな婚礼[こんれい]を行[おこな]い、カナンの大[おお]いなる有力者[ゆうりょくしゃ]の一人[ひとり]の娘[むすめ]をナダバトから、大[おお]きな行列[ぎょうれつ]とともに迎[むか]えている、と。"
  38: "彼[かれ]らは兄弟[きょうだい]ヨハネの血[ち]を思[おも]い起[お]こし、上[のぼ]って山[やま]の陰[かげ]に身[み]を隠[かく]した。"
  39: "彼[かれ]らが目[め]を上[あ]げて見[み]ると、見[み]よ、叫[さけ]び声[ごえ]と多[おお]くの荷[に]があり、花婿[はなむこ]とその友[とも]、その兄弟[きょうだい]たちが太鼓[たいこ]と楽師[がくし]、そして多[おお]くの武器[ぶき]とともに彼[かれ]らを迎[むか]えに出[で]て来[き]た。"
  40: "彼[かれ]らは待[ま]ち伏[ぶ]せから彼[かれ]らに襲[おそ]いかかって殺[ころ]し、多[おお]くの者[もの]が傷[きず]ついて倒[たお]れ、残[のこ]った者[もの]は山[やま]へ逃[に]げた。彼[かれ]らはすべての分捕[ぶんど]り物[もの]を取[と]った。"
  41: "婚礼[こんれい]は悲[かな]しみに変[か]わり、彼[かれ]らの楽師[がくし]の声[こえ]は嘆[なげ]きに変[か]わった。"
  42: "彼[かれ]らは兄弟[きょうだい]の血[ち]の復讐[ふくしゅう]を果[は]たし、ヨルダンの湿地[しっち]へ帰[かえ]った。"
  43: "バッキデスはそれを聞[き]いて、安息日[あんそくび]に大[おお]きな軍勢[ぐんぜい]を率[ひき]いてヨルダンの岸辺[きしべ]まで来[き]た。"
  44: "ヨナタンは自分[じぶん]の側[がわ]の者[もの]たちに言[い]った。「さあ、われわれの命[いのち]のために立[た]ち上[あ]がって戦[たたか]おう。今日[きょう]は昨日[きのう]や一昨日[おととい]とは違[ちが]う。」"
  45: "「見[み]よ、戦[たたか]いはわれわれの前[まえ]にも後[うし]ろにもある。ヨルダンの水[みず]がこちらにもあちらにもあり、沼[ぬま]と森[もり]があって、避[さ]ける場所[ばしょ]がない。」"
  46: "「だから今[いま]、天[てん]に向[む]かって叫[さけ]べ。そうすれば、あなたがたは敵[てき]の手[て]から救[すく]われる。」"
  47: "戦[たたか]いが始[はじ]まり、ヨナタンは手[て]を伸[の]ばしてバッキデスを打[う]とうとしたが、彼[かれ]は身[み]をかわして後[うし]ろへ退[しりぞ]いた。"
  48: "ヨナタンとその仲間[なかま]たちはヨルダンに飛[と]び込[こ]み、向[む]こう岸[ぎし]へ泳[およ]いで渡[わた]った。彼[かれ]らはヨルダンを越[こ]えて彼[かれ]らを追[お]わなかった。"
  49: "その日[ひ]、バッキデスの側[がわ]で千人[せんにん]ほどの者[もの]が倒[たお]れた。"
  50: "彼[かれ]はエルサレムに帰[かえ]り、ユダヤに堅固[けんご]な町々[まちまち]を建[た]てた。エリコの要塞[ようさい]、エンマウス、ベテ・ホロン、ベテル、タムナタ・ファラトン、テフォンで、高[たか]い城壁[じょうへき]と門[もん]と貫[つらぬ]き棒[ぼう]を備[そな]えた。"
  51: "彼[かれ]はイスラエルに敵対[てきたい]するために、そこに守備隊[しゅびたい]を置[お]いた。"
  52: "またベテズルの町[まち]とガザラとアクラを堅固[けんご]にし、そこに軍勢[ぐんぜい]と食糧[しょくりょう]の蓄[たくわ]えを置[お]いた。"
  53: "またその地方[ちほう]の指導者[しどうしゃ]たちの子[こ]らを人質[ひとじち]に取[と]り、エルサレムのアクラに監禁[かんきん]した。"
  54: "百五十三年[ひゃくごじゅうさんねん]の第二[だいに]の月[つき]に、アルキモスは聖所[せいしょ]の内庭[ないてい]の城壁[じょうへき]を壊[こわ]すよう命[めい]じ、預言者[よげんしゃ]たちの業[わざ]を壊[こわ]し、壊[こわ]し始[はじ]めた。"
  55: "その時[とき]、アルキモスは打[う]たれ、その業[わざ]は妨[さまた]げられ、口[くち]はふさがれ、麻痺[まひ]して、もはや言葉[ことば]を語[かた]ることも、自分[じぶん]の家[いえ]について命[めい]じることもできなかった。"
  56: "アルキモスはその時[とき]、大[おお]きな苦[くる]しみをもって死[し]んだ。"
  57: "バッキデスはアルキモスが死[し]んだのを見[み]て、王[おう]のもとへ帰[かえ]った。ユダの地[ち]は二年間[にねんかん]静[しず]まった。"
  58: "不法[ふほう]な者[もの]たちは皆[みな]、相談[そうだん]して言[い]った。「見[み]よ、ヨナタンとその仲間[なかま]たちは安心[あんしん]して平穏[へいおん]に住[す]んでいる。今[いま]、バッキデスを連[つ]れて来[こ]よう。彼[かれ]は一夜[いちや]のうちに彼[かれ]らを皆[みな]捕[と]らえるだろう。」"
  59: "彼[かれ]らは行[い]って、彼[かれ]と相談[そうだん]した。"
  60: "彼[かれ]は大[おお]きな軍勢[ぐんぜい]とともに来[く]ることにし、自分[じぶん]の味方[みかた]でユダヤにいる者[もの]たち皆[みな]に密[ひそ]かに手紙[てがみ]を送[おく]り、ヨナタンとその仲間[なかま]たちを捕[と]らえさせようとした。しかし彼[かれ]らはできなかった。彼[かれ]らの計略[けいりゃく]が知[し]られたからである。"
  61: "彼[かれ]らはその地方[ちほう]の悪[あく]の首領[しゅりょう]たちのうち五十人[ごじゅうにん]を捕[と]らえて殺[ころ]した。"
  62: "ヨナタンとシモン、およびその仲間[なかま]たちは荒野[こうや]にあるベテバシへ退[しりぞ]き、そこに壊[こわ]された所[ところ]を建[た]て直[なお]して、これを堅固[けんご]にした。"
  63: "バッキデスはこれを知[し]り、自分[じぶん]の全軍[ぜんぐん]を集[あつ]め、ユダヤから来[き]た者[もの]たちに命[めい]じた。"
  64: "彼[かれ]は来[き]てベテバシに陣[じん]を敷[し]き、多[おお]くの日[ひ]それを攻[せ]め、兵器[へいき]を造[つく]った。"
  65: "ヨナタンは兄弟[きょうだい]シモンを町[まち]に残[のこ]し、自分[じぶん]は地方[ちほう]へ出[で]て、わずかな人数[にんずう]で進[すす]んだ。"
  66: "彼[かれ]はオドメラとその兄弟[きょうだい]たち、ファシロンの子[こ]らを彼[かれ]らの天幕[てんまく]ごと打[う]った。彼[かれ]らは打[う]ち始[はじ]め、軍勢[ぐんぜい]とともに上[のぼ]って行[い]った。"
  67: "シモンとその仲間[なかま]たちは町[まち]から出[で]て、兵器[へいき]を焼[や]いた。"
  68: "彼[かれ]らはバッキデスと戦[たたか]い、彼[かれ]は彼[かれ]らによって砕[くだ]かれ、彼[かれ]らは彼[かれ]を非常[ひじょう]に苦[くる]しめた。彼[かれ]の計略[けいりゃく]も進軍[しんぐん]も空[むな]しかったからである。"
  69: "彼[かれ]は、自分[じぶん]にこの地方[ちほう]へ来[く]るよう勧[すす]めた不法[ふほう]な者[もの]たちに激[はげ]しく怒[いか]り、そのうちの多[おお]くを殺[ころ]し、自分[じぶん]の地[ち]へ帰[かえ]ることにした。"
  70: "ヨナタンはこれを知[し]り、彼[かれ]のもとへ使者[ししゃ]を送[おく]って、彼[かれ]と和[わ]を結[むす]び、捕虜[ほりょ]を返[かえ]してもらおうとした。"
  71: "彼[かれ]は受[う]け入[い]れ、自分[じぶん]の言葉[ことば]どおりに行[おこな]い、自分[じぶん]の生涯[しょうがい]のすべての日[ひ]、彼[かれ]に害[がい]を求[もと]めないと誓[ちか]った。"
  72: "彼[かれ]は以前[いぜん]にユダの地[ち]から奪[うば]った捕虜[ほりょ]を彼[かれ]に返[かえ]し、帰[かえ]って自分[じぶん]の地[ち]へ行[い]き、もはや彼[かれ]らの境[さかい]に来[こ]なかった。"
  73: "イスラエルから剣[つるぎ]が休[やす]んだ。ヨナタンはマクマスに住[す]み、民[たみ]を裁[さば]き始[はじ]め、イスラエルから不敬虔[ふけいけん]な者[もの]たちを滅[ほろ]ぼした。"

notes:
  2: "Μαισαλωθ τὴν ἐν Αρβηλοις — «Месалоф, что в Арвилах» (メサロト, アルベラ); Γαλγαλα — ガルガラ. Слав. «и взяша его» — в LXX προκατελάβοντο («заняли прежде»), то же."
  3: "ἔτους δευτέρου καὶ πεντηκοστοῦ καὶ ἑκατοστοῦ — «года второго и пятидесятого и сотого», т.е. 152-й год селевкидской эры; слав. «лета сто пятьдесят втораго»."
  5: "Ελασα — エラサ (слав. «елаас»); ἐκλεκτοί — «избранные», 精鋭."
  6: "ὀκτακόσιοι — «восемьсот»; слав. «осмь сот мужей», то же."
  8: "ἐξελύθη — «ослабел, изнемог» (слав. «ослабе»). Речь Иуды продолжается в 10."
  9: "ἀπέστρεφον αὐτὸν λέγοντες — «отвращали его, говоря»; σῴζωμεν τὰς ἑαυτῶν ψυχάς — «спасём свои души», т.е. жизни."
  11: "Βακχίδης δὲ ἦν ἐν τῷ δεξιῷ κέρατι — «Вакхид же был в правом крыле»: в LXX эта клауза стоит в конце 11, у слав. — в начале 12; держим LXX, содержание то же. σφενδονῆται — 石投げ兵 (пращники); πρωταγωνισταί — «передовые бойцы»."
  12: "У слав. «изыдите... вострубиша, иже бяху от страны иудины» отнесено к 13; в LXX трубы Иуды — в 12, конец. Держим LXX."
  15: "ἕως Αζωτου ὄρους — «до горы Азота» (アゾト)."
  18: "καὶ Ιουδας ἔπεσεν — «и Иуда пал». Слав. «прочии же бежаша»."
  20: "ἐκόψαντο ... κοπετὸν μέγαν — «оплакали плачем великим»; ἐπένθουν ἡμέρας πολλάς — «печалились дни многие». Плач — в 21 (в LXX и слав. 21 — отдельный стих «како паде сильный...»)."
  21: "Πῶς ἔπεσεν δυνατὸς σῴζων τὸν Ισραηλ — «как пал сильный, спасающий Израиля»; слав. «спасаяй израиля»."
  22: "τὰ περισσὰ τῶν λόγων — «прочее словес»; ἀνδραγαθίαι — «мужественные подвиги»; οὐ κατεγράφη — «не описано» (слав. «не суть писана»)."
  23: "ἐξέκυψαν — «высунулись, выглянули» (слав. «проникоша»); ἀνέτειλαν — «прозябли» (слав. «прозябоша»)."
  24: "αὐτομολέω — «перебежала» (слав. «отступи страна»); слав. «с ними», то же."
  26: "ἐξεδίκα αὐτοὺς — «мстил им» (слав. «мстяше им»); ἐνέπαιζεν — «издевался»."
  27: "ἥτις οὐκ ἐγένετο ἀφ᾿ ἧς ἡμέρας οὐκ ὤφθη προφήτης αὐτοῖς — «какой не было с того дня, как не явился им пророк»; слав. «яже не бысть от дний, в нихже не явися пророк»."
  29: "ἐξελθεῖν καὶ εἰσελθεῖν — «выйти и войти», т.е. вести войну (слав. «изыти противу врагов»); ἐν τοῖς ἐχθραίνουσιν τοῦ ἔθνους — «в ненавидящих народ наш»."
  30: "ᾑρετισάμεθα — «мы избрали» (слав. «избрахом»); εἰς ἄρχοντα καὶ ἡγούμενον — «в начальника и вождя»."
  33: "Θεκωε — テコエ; Ασφαρ — アスファル (слав. «ров асфар»; ru «озеро Асфар»)."
  34: "ἐν τῇ ἡμέρᾳ τῶν σαββάτων — «в день субботний»; πέραν τοῦ Ιορδάνου — «за Иордан»."
  35: "ἡγούμενον τοῦ ὄχλου — «вождя народа (толпы)»; Ναβαταῖοι — ナバタイ人; ἀποσκευή — «поклажа, обоз», 荷."
  36: "Ιαμβρι οἱ ἐκ Μηδαβα — «сыны Иамври из Мидавы» (sons of Jambri); Ιωαννην — ヨハネ, брат Иуды и Ионатана."
  37: "ποιοῦσιν γάμον μέγαν — «совершают брак великий»; ἀπὸ Ναδαβαθ — ナダバト; μετὰ παραπομπῆς μεγάλης — слав. «с гордостию велиею», т.е. с большой пышностью (παραπομπή — проводы, эскорт)."
  39: "θροῦς — «шум, крики»; ἀποσκευὴ πολλή — «много поклажи»; τυμπάνων καὶ μουσικῶν — «тимпаны и музыканты»; ὅπλων πολλῶν — «много оружия» (свадебный обычай)."
  40: "ἀπὸ τοῦ ἐνέδρου — «из засады»; слав. добавляет «иже при ионафане» — пояснение, внесено как ヨナタンとともに; σκῦλα — 分捕り物."
  42: "εἰς τὸ ἕλος τοῦ Ιορδάνου — «к болоту Иордана» (слав. «на брег иорданский»; ἕλος — болото, 湿地)."
  43: "ἕως τῶν κρηπίδων τοῦ Ιορδάνου — «до оснований (берегов) Иордана» (слав. «до брегов»)."
  44: "Ἀναστῶμεν δὴ καὶ πολεμήσωμεν περὶ τῶν ψυχῶν ἡμῶν — «встанем и будем сражаться за души (жизни) наши»; οὐ γάρ ἐστιν σήμερον ὡς ἐχθὲς καὶ τρίτην ἡμέραν — «ибо ныне не как вчера и третьего дня»."
  45: "ἔνθεν καὶ ἔνθεν — «с той и другой стороны»; οὐκ ἔστιν τόπος τοῦ ἐκκλῖναι — «нет места уклониться»."
  46: "Слав. в конце добавляет «и сразися брань» — в LXX эта клауза открывает 47 (καὶ συνῆψεν ὁ πόλεμος), поэтому оставлена в 47 и не дублируется."
  47: "ἐξέκλινεν ἀπ᾿ αὐτοῦ εἰς τὰ ὀπίσω — «уклонился от него назад» (слав. «уклонися от него вспять»)."
  48: "διεκολύμβησαν — «переплыли» (κολυμβάω — плавать); οὐ διέβησαν ἐπ᾿ αὐτοὺς τὸν Ιορδάνην — «не перешли за ними Иордана»."
  49: "παρὰ Βακχίδου — «у Вакхида» (слав. «от страны вакхидины»); εἰς χιλίους ἄνδρας — «до тысячи мужей»."
  50: "ὀχύρωμα τὸ ἐν Ιεριχω — «крепость в Иерихоне»; Αμμαους — エンマウス; Βαιθωρων — ベテ・ホロン; Βαιθηλ — ベテル; Θαμναθα Φαραθων — タムナタ・ファラトン; Τεφων — テフォン; μοχλοί — «запоры, засовы», 貫き棒."
  52: "Βαιθσουρα — ベテズル; Γαζαρα — ガザラ; ἄκρα — アクラ (иерусалимская крепость; так же в гл. 1–8, ср. 1:33; 3:45)."
  53: "τοὺς υἱοὺς τῶν ἡγουμένων τῆς χώρας — «сыновей вождей страны»; ὅμηρα — 人質."
  54: "τὸ τεῖχος τῆς αὐλῆς τῶν ἁγίων τῆς ἐσωτέρας — «стену двора святых, внутреннего» (слав. «стену двора святых внутренняго»); τὰ ἔργα τῶν προφητῶν — «дела пророков», т.е. построенное пророками (Аггеем, Захарией и др.)."
  55: "ἐπλήγη — «был поражён» (ударом); ἐνεποδίσθη — «воспрепятствованы»; ἀπεφράγη τὸ στόμα — «заградились уста»; παρελύθη — «разслаблен, парализован»."
  57: "καὶ ἡσύχασεν ἡ γῆ Ιουδα ἔτη δύο — «и умолкла земля Иудина лета два»."
  58: "πεποιθότες — «уповая, в безопасности» (слав. «уповающе»); ἐν νυκτὶ μιᾷ — «в одну ночь»."
  60: "συμμάχους — «союзникам» (слав. «споборителем»); ἡ βουλὴ αὐτῶν — «замысел их»."
  61: "ἀρχηγοὺς τῆς κακίας — «начальников злобы»; εἰς πεντήκοντα ἄνδρας — «до пятидесяти мужей»."
  62: "Βαιθβασι τὴν ἐν τῇ ἐρήμῳ — ベテバシ в пустыне; τὰ καθῃρημένα αὐτῆς — «разрушенное в ней»."
  64: "μηχαναί — 兵器 (осадные машины); ἡμέρας πολλάς — «дни многие»."
  65: "ἐν ἀριθμῷ — «с числом (немногими)» (слав. «в числе»; ru «с небольшим числом»)."
  66: "Οδομηρα — オドメラ (слав. «одомира»; ru «Одоааррин»); Φασιρων — ファシロン; ἐν τῷ σκηνώματι αὐτῶν — «в шатрах их»; ἀνέβαινον ἐν ταῖς δυνάμεσιν — «восходили с войсками»."
  68: "συνετρίβη ὑπ᾿ αὐτῶν — «сокрушён ими»; ἡ βουλὴ αὐτοῦ καὶ ἡ ἔφοδος αὐτοῦ κενή — «замысел его и поход его тщетны»."
  70: "πρέσβεις — 使者; τοῦ συνθέσθαι ... εἰρηνην — «заключить мир»; ἀποδοῦναι τὴν αἰχμαλωσίαν — «отдать плен»."
  71: "ὤμοσεν — «поклялся»; μὴ ἐκζητῆσαι ... κακόν — «не искать ему зла»."
  72: "ἣν ᾐχμαλώτευσεν τὸ πρότερον — «который прежде пленил»; οὐ προσέθετο ἔτι ἐλθεῖν — «не приложил более приходить»."
  73: "κατέπαυσεν ῥομφαία ἐξ Ισραηλ — «успокоился (перестал) меч от Израиля»; ἐν Μαχμας — マクマス; κρίνειν τὸν λαόν — «судить народ»; ἠφάνισεν — «истребил»."
