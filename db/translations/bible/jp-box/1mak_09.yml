# jp-box, 1 Маккавейская, глава 9. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; совпадает с gr (73 стиха).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: 1–3 Димитрий снова посылает Вакхида и Алкима; 4–18 поражение
# и смерть Иуды при Елеасе (14–15 разбит правый фланг, 16–17 бой с тыла,
# 18 падение Иуды); 19–22 погребение в Модине и плач («как пал сильный»);
# 23–27 гонение, скорбь «с того дня, как не стало пророка»; 28–31 Ионатан
# избран вождём; 32–42 бегство в пустыню, убийство Иоанна сынами Иамври
# и месть у Иордана; 43–49 бой с Вакхидом в субботу, переход Иордана;
# 50–53 Вакхид строит крепости; 54–57 кощунство и смерть Алкима, два года покоя;
# 58–70 новый поход Вакхида, Вефваси, мир и возвращение плена; 73 «меч унялся».
# Голоса: 8, 9, 10, 44–46 (речь Ионатана), 20–21 (плач — в 21), 28–30
# (слова друзей Иуды, «…» с 29 по 30), 58 («…» внутри стиха) — всё в 「…」.
# Слав. в 11–13 иначе делит клаузы (Вакхид в правом крыле — начало 12 у слав.,
# трубы Иуды — начало 13); держим деление gr, содержание то же.
# 9:46 — слав. добавляет в конце «и сразися брань»; в LXX эта клауза стоит
# в начале 47 (καὶ συνῆψεν ὁ πόλεμος), поэтому оставлена в 47.
#
