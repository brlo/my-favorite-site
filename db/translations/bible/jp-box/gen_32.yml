verses:
  1: "ラバンは朝[あさ]早[はや]く起[お]き、自分[じぶん]の息子[むすこ]たちと娘[むすめ]たちに口[くち]づけし、彼[かれ]らを祝福[しゅくふく]して、引[ひ]き返[かえ]し、自分[じぶん]の場所[ばしょ]へ帰[かえ]って行[い]った。"
  2: "ヤコブは自分[じぶん]の道[みち]を進[すす]んだ。目[め]を上[あ]げて見[み]ると、神[かみ]の陣営[じんえい]が陣[じん]を構[かま]えていた。神[かみ]の天使[てんし]たちが彼[かれ]に会[あ]った。"
  3: "ヤコブは彼[かれ]らを見[み]て言[い]った。「これは神[かみ]の陣営[じんえい]だ。」そしてその場所[ばしょ]の名[な]を「陣営[じんえい]」、すなわちマハナイムと名[な]づけた。"
  4: "ヤコブは自分[じぶん]の前[まえ]に使[つか]いの者[もの]たちを送[おく]り、兄[あに]エサウのもと、セイルの地[ち]、エドムの地方[ちほう]へ向[む]かわせた。"
  5: "そして命[めい]じて言[い]った。「わたしの主人[しゅじん]エサウにこう言[い]いなさい。『あなたの僕[しもべ]ヤコブはこう言[い]います。わたしはラバンのもとに寄留[きりゅう]し、今[いま]に至[いた]るまで長[なが]くとどまりました。"
  6: "牛[うし]もろばも羊[ひつじ]も、男[おとこ]奴隷[どれい]も女[おんな]奴隷[どれい]も、わたしにはあります。わたしは主人[しゅじん]エサウに告[つ]げるために人[ひと]を送[おく]りました。あなたの僕[しもべ]があなたの前[まえ]に{恵[めぐ]み|恩寵[おんちょう]}を得[え]るためです。』」"
  7: "使[つか]いの者[もの]たちはヤコブのもとへ帰[もど]って来[き]て言[い]った。「わたしたちはあなたの兄[あに]エサウのもとへ行[い]きました。見[み]よ、彼[かれ]は四百人[よんひゃくにん]の者[もの]たちとともに、あなたを迎[むか]えに来[き]ています。」"
  8: "ヤコブは非常[ひじょう]に恐[おそ]れ、心[こころ]が乱[みだ]れた。彼[かれ]は自分[じぶん]とともにいる民[たみ]、牛[うし]、羊[ひつじ]を二[ふた]つの陣営[じんえい]に分[わ]けた。"
  9: "彼[かれ]は言[い]った。「もしエサウが一[ひと]つの陣営[じんえい]に来[き]てそれを撃[う]ち破[やぶ]っても、もう一[ひと]つの陣営[じんえい]は救[すく]われるだろう。」"
  10: "ヤコブは言[い]った。「わたしの父[ちち]アブラハムの神[かみ]、わたしの父[ちち]イサクの神[かみ]、わたしに『あなたの生[う]まれた地[ち]へ帰[かえ]れ。わたしはあなたをよく遇[あしら]おう』と言[い]われた主[しゅ]よ。"
  11: "わたしは、あなたが僕[しもべ]に施[ほどこ]されたすべての正[ただ]しさとすべての真実[しんじつ]に足[た]りない者[もの]です。わたしはこのヨルダン川[がわ]を杖[つえ]一本[いっぽん]で渡[わた]ったが、今[いま]は二[ふた]つの陣営[じんえい]を持つ身[み]となっています。"
  12: "わたしを兄[あに]エサウの手[て]から救[すく]い出[だ]してください。彼[かれ]が来[き]て、わたしを、また子[こ]どもとともに母[はは]をも撃[う]つことを、わたしは恐[おそ]れています。"
  13: "しかし、あなたは言[い]われました。『わたしはあなたをよく遇[あしら]い、あなたの子孫[しそん]を、多[おお]さのゆえに数[かぞ]えられない海[うみ]の砂[すな]のようにしよう』と。」"
  14: "ヤコブはその夜[よる]、そこに宿[やど]った。そして、自分[じぶん]が持[も]っていたものから贈[おく]り物[もの]を取[と]り、兄[あに]エサウに送[おく]った。"
  15: "雌山羊[めやぎ]二百匹[にひゃっぴき]、雄山羊[おやぎ]二十匹[にじゅっぴき]、雌羊[めひつじ]二百匹[にひゃっぴき]、雄羊[おひつじ]二十匹[にじゅっぴき]、"
  16: "乳[ちち]を飲[の]ませるらくだとその子[こ]ら三十頭[さんじゅうとう]、雌牛[めうし]四十頭[よんじゅうとう]、雄牛[おうし]十頭[じゅっとう]、雌[め]ろば二十頭[にじゅうとう]、ろばの子[こ]十頭[じゅっとう]。"
  17: "そして、群[む]れを一[ひと]つずつ別[べつ]にして僕[しもべ]たちの手[て]に渡[わた]し、僕[しもべ]たちに言[い]った。「わたしの前[まえ]を進[すす]み、群[む]れと群[む]れの間[あいだ]に距離[きょり]を置[お]きなさい。」"
  18: "そして第[だい]一[いち]の者[もの]に命[めい]じて言[い]った。「もし兄[あに]エサウがあなたに会[あ]って、『おまえはだれのものか。どこへ行[ゆ]くのか。おまえの前[まえ]を行[い]くこれらの群[む]れはだれのものか』と尋[たず]ねたら、"
  19: "『あなたの僕[しもべ]ヤコブのものです。兄[あに]エサウへの贈[おく]り物[もの]を送[おく]りました。見[み]よ、彼[かれ]自身[じしん]もわたしたちの後[うし]ろにいます』と言[い]いなさい。」"
  20: "また第[だい]二[に]、第[だい]三[さん]の者[もの]、およびこれらの群[む]れの後[うし]ろを行[い]くすべての者[もの]にも命[めい]じて言[い]った。「エサウに会[あ]ったなら、このとおりのことを話[はな]しなさい。"
  21: "『見[み]よ、あなたの僕[しもべ]ヤコブがわたしたちの後[うし]ろに来[き]ます』と。彼[かれ]は『贈[おく]り物[もの]で彼[かれ]の顔[かお]をなだめ、その後[あと]でその顔[かお]を見[み]よう。もしかすると、彼[かれ]はわたしの顔[かお]を受[う]け入[い]れてくれるかもしれない』と言[い]ったからである。」"
  22: "贈[おく]り物[もの]は彼[かれ]の前[まえ]を進[すす]んで行[い]き、彼[かれ]はその夜[よる]、陣営[じんえい]で眠[ねむ]った。"
  23: "その夜[よる]、彼[かれ]は起[お]きて、二[ふた]人[り]の妻[つま]と二[ふた]人[り]の女奴隷[おんなどれい]、十一人[じゅういちにん]の子[こ]どもたちを連[つ]れて、ヤボクの渡[わた]し場[ば]を渡[わた]った。"
  24: "彼[かれ]らを連[つ]れて行[い]き、川[かわ]を渡[わた]って、自分[じぶん]のすべてのものも渡[わた]らせた。"
  25: "ヤコブは一[ひと]人[り]だけ残[のこ]された。すると、ある人[ひと]が朝[あさ]まで彼[かれ]と力[ちから]を争[あらそ]った。"
  26: "その人[ひと]は、自分[じぶん]が彼[かれ]に勝[か]てないのを見[み]て、彼[かれ]のもものつけ根[ね]に触[ふ]れた。ヤコブが彼[かれ]と力[ちから]を争[あらそ]っているとき、ヤコブのもものつけ根[ね]がしびれて動[うご]かなくなった。"
  27: "その人[ひと]は言[い]った。「わたしを放[はな]してくれ。夜明[よあ]けが上[のぼ]ったからだ。」ヤコブは言[い]った。「わたしを祝福[しゅくふく]してくださらなければ、放[はな]しません。」"
  28: "その人[ひと]は彼[かれ]に言[い]った。「あなたの名[な]は何[なに]か。」彼[かれ]は言[い]った。「ヤコブです。」"
  29: "その人[ひと]は言[い]った。「もはや、あなたの名[な]はヤコブとは呼[よ]ばれない。あなたの名[な]はイスラエルとなる。あなたは神[かみ]と、また人[ひと]と力[ちから]を争[あらそ]って勝[か]ったからである。」"
  30: "ヤコブは問[と]うて言[い]った。「あなたの名[な]をわたしに告[つ]げてください。」その人[ひと]は言[い]った。「なぜ、わたしの名[な]を問[と]うのか。」そして、そこで彼[かれ]を祝福[しゅくふく]した。"
  31: "ヤコブはその場所[ばしょ]の名[な]を「神[かみ]の姿[すがた]」、すなわちペヌエルと名[な]づけた。神[かみ]を顔[かお]と顔[かお]を合[あ]わせて見[み]、しかもわたしの魂[たましい]は救[すく]われたからである。"
  32: "彼[かれ]が「神[かみ]の姿[すがた]」の場所[ばしょ]を通[とお]り過[す]ぎたとき、太陽[たいよう]が彼[かれ]のために昇[のぼ]った。彼[かれ]はももを引[ひ]きずって歩[ある]いていた。"
  33: "それゆえ、イスラエルの子[こ]らは、もものつけ根[ね]にある、しびれた筋[すじ]を、今日[こんにち]に至[いた]るまで食[た]べない。彼[かれ]がヤコブのもものつけ根[ね]の筋[すじ]に触[ふ]れ、それがしびれたからである。"

notes:
  1: "Нумерация: в gr-lxx-byz это 32:1, в Синодальном (и в ru) — 31:55; поэтому вся глава сдвинута на стих. ἀναστὰς…τὸ πρωί — 朝早く起きて. κατεφίλησεν — 口づけした (καταφιλέω, «горячо целовать»). ἀποστραφεὶς — 引き返して (ἀποστρέφομαι)."
  2: "ἀπῆλθεν εἰς τὴν ἑαυτοῦ ὁδόν — 自分の道を進んだ. παρεμβολὴν θεοῦ παρεμβεβληκυῖαν — 神の陣営が陣を構えていた (παρεμβολή — «стан, ополчение»; глагол того же корня παρεμβάλλω). συνήντησαν αὐτῷ οἱ ἄγγελοι — 神の天使たちが彼に会った (в евр. «ангелы Божии», ср. 32:2 в Синодальном)."
  3: "Παρεμβολαί — 「陣営」 (LXX переводит евр. מַחֲנַיִם, Маханаим). В тексте перевод с приложением имени — тот же приём, что ベテル в 28:19 и ペヌエル в 32:31. ἡνίκα εἶδεν αὐτούς — 彼らを見て (в Синодальном эти слова стоят в ст. 2)."
  4: "ἀγγέλους — 使いの者たち (ἄγγελος здесь «посланники», не ангелы). εἰς γῆν Σηιρ εἰς χώραν Εδωμ — セイルの地、エドムの地方へ (Σηιρ — セイル, Едом — エドム)."
  5: "Οὕτως ἐρεῖτε τῷ κυρίῳ μου — わたしの主人にこう言いなさい (κύριος — вежливое обращение к старшему, не «Господь»; поэтому 主人). Вложенная речь — 『…』. παρῴκησα — 寄留した (παροικέω — «жить пришельцем»). ἐχρόνισα ἕως τοῦ νῦν — 今に至るまで長くとどまった."
  6: "καὶ ἐγένοντό μοι — わたしにはあります (καί — «и вот»). ἵνα εὕρῃ ὁ παῖς σου χάριν ἐναντίον σου — 僕があなたの前で恵みを得るため (ἵνα + сослагательное; χάριν εὑρεῖν — «обрести благоволение»)."
  7: "ἀνέστρεψαν — 帰って来た (ἀναστρέφω). τετρακόσιοι ἄνδρες — 四百人 (в евр. «четыреста мужей»)."
  8: "ἐφοβήθη σφόδρα καὶ ἠπορεῖτο — 非常に恐れ、心が乱れた (ἀπορέω — «быть в недоумении, теряться»). διεῖλεν — 分けた (διαιρέω). εἰς δύο παρεμβολάς — 二つの陣営に (слово, из которого имя Маханаим)."
  9: "ἐκκόψῃ — 撃ち破る (ἐκκόπτω — «вырубить, истребить»). εἰς τὸ σῴζεσθαι — 救われるため (инфинитив цели с εἰς τό)."
  10: "ὁ θεὸς τοῦ πατρός μου Αβρααμ — わたしの父アブラハムの神 (двойной «отец мой» — как в греч.). Ἀπότρεχε — 帰れ (букв. «беги обратно»; ср. 28:2 ἀπόδραθι). εὖ σε ποιήσω — あなたをよく遇おう (εὖ ποιέω — «благодетельствовать»)."
  11: "ἱκανοῦταί μοι ἀπὸ πάσης δικαιοσύνης — すべての正しさに足りない (букв. «достаточно мне от…»; евр. «я мал для всех милостей»; слав. «довлеет ми»). ἐν γὰρ τῇ ῥάβδῳ μου διέβην τὸν Ιορδάνην — 杖一本でこのヨルダン川を渡った (ῥάβδος — «посох»). γέγονα εἰς δύο παρεμβολάς — 二つの陣営を持つ身となった."
  12: "ἐξελοῦ με — 救い出してください (ἐξαιρέομαι). πατάξῃ με καὶ μητέρα ἐπὶ τέκνοις — わたしを、子どもとともに母をも撃つ (ἐπί с дательным — «вместе с»; слав. «матерь с чады»)."
  13: "Καλῶς εὖ σε ποιήσω — よく遇おう (καλῶς — «хорошо»; вложенная цитата — 『…』). θήσω τὸ σπέρμα σου ὡς τὴν ἄμμον τῆς θαλάσσης — 子孫を海の砂のようにしよう. ἣ οὐκ ἀριθμηθήσεται ἀπὸ τοῦ πλήθους — 多さのゆえに数えられない (ἀπό — «из-за»)."
  14: "ἐκοιμήθη ἐκεῖ τὴν νύκτα ἐκείνην — その夜、そこに宿った. ὧν ἔφερεν — 持っていたもののうちから (ᾗ ἔφερεν — «что нёс»). ἐξαπέστειλεν Ησαυ — エサウに送った (ἐξαποστέλλω)."
  15: "αἶγας διακοσίας, τράγους εἴκοσι, πρόβατα διακόσια, κριοὺς εἴκοσι — 雌山羊二百、雄山羊二十、雌羊二百、雄羊二十 (порядок и числа по греч.)."
  16: "καμήλους θηλαζούσας — 乳を飲ませるらくだ (θηλάζω — «кормить грудью»). βόας τεσσαράκοντα, ταύρους δέκα — 雌牛四十、雄牛十 (βοῦς — «корова», ταῦρος — «бык»). ὄνους…καὶ πώλους — 雌ろばと若いろば (πῶλος — «жеребёнок»)."
  17: "ποίμνιον κατὰ μόνας — 群れを一つずつ別に (κατὰ μόνας — «порознь»). Προπορεύεσθε — 先を行け. διάστημα ποιεῖτε — 距離を置け (διάστημα — «промежуток»)."
  18: "τῷ πρώτῳ — 第一の者に. Τίνος εἶ — だれのものか (букв. «чей ты»). τὰ προπορευόμενά σου — あなたの先を行くもの. Вопрос Исава — 『…』 (речь внутри речи Иакова)."
  19: "Τοῦ παιδός σου Ιακωβ — あなたの僕ヤコブのもの (ответ, который надо передать, — 『…』). δῶρα ἀπέσταλκεν — 贈り物を送った (perfect). ὀπίσω ἡμῶν — わたしたちの後ろに."
  20: "τῷ πρώτῳ καὶ τῷ δευτέρῳ καὶ τῷ τρίτῳ — 第一、第二、第三の者に (в греч. снова «первому», хотя первому уже сказано в 18-м; повтор сохранён). ἐν τῷ εὑρεῖν ὑμᾶς αὐτόν — 彼に会ったとき."
  21: "Ἰδοὺ ὁ παῖς σου Ιακωβ παραγίνεται ὀπίσω ἡμῶν — 見よ、僕ヤコブが後ろに来ます (слова для передачи — 『…』). Ἐξιλάσομαι τὸ πρόσωπον αὐτοῦ — 彼の顔をなだめよう (ἐξιλάσκομαι — «умилостивить»). ἴσως προσδέξεται τὸ πρόσωπόν μου — もしかすると受け入れてくれるかもしれない (προσδέχομαι; ἴσως — «быть может»)."
  22: "παρεπορεύοντο — 進んで行った (παραπορεύομαι). κατὰ πρόσωπον αὐτοῦ — 彼の前を (букв. «пред лицом его»)."
  23: "τὰς δύο γυναῖκας καὶ τὰς δύο παιδίσκας — 二人の妻と二人の女奴隷 (παιδίσκη — «рабыня»). τὰ ἕνδεκα παιδία — 十一人の子ども. τὴν διάβασιν τοῦ Ιαβοκ — ヤボクの渡し場 (διάβασις — «переправа»; Ιαβόκ — ヤボク川)."
  24: "τὸν χειμάρρουν — 川 (χειμάρρους — «зимний поток, поток»). διεβίβασεν πάντα τὰ αὐτοῦ — 自分のすべてのものも渡らせた (διαβιβάζω — «переправлять»)."
  25: "ὑπελείφθη μόνος — 一人だけ残された (ὑπολείπω — «оставить»). ἐπάλαιεν ἄνθρωπος μετ᾿ αὐτοῦ — ある人が彼と力比べをした (παλαίω — «бороться»; ἄνθρωπος без члена — «некто»). ἕως πρωί — 朝まで."
  26: "ἥψατο τοῦ πλάτους τοῦ μηροῦ — もものつけ根に触れた (πλάτος τοῦ μηροῦ — «широта бедра», то есть бедренный сустав). ἐνάρκησεν — しびれて動かなくなった (ναρκάω — «онеметь»; слав. «отерпе»). ἐν τῷ παλαίειν αὐτὸν μετ᾿ αὐτοῦ — 彼と力比べをしているとき."
  27: "Ἀπόστειλόν με — 放してくれ. ἀνέβη γὰρ ὁ ὄρθρος — 夜明けが上ったからだ (ὄρθρος — «рассвет»). Οὐ μή σε ἀποστείλω — 放しません (οὐ μή + сослагательное — усиленное отрицание). ἐὰν μή με εὐλογήσῃς — 祝福してくださらなければ."
  28: "Τί τὸ ὄνομά σού ἐστιν — あなたの名は何か. ὁ δὲ εἶπεν Ιακωβ — 彼は言った、ヤコブです (прямая речь, как в греч.)."
  29: "Οὐ κληθήσεται ἔτι τὸ ὄνομά σου Ιακωβ — もはやヤコブとは呼ばれない. Ισραηλ ἔσται τὸ ὄνομά σου — あなたの名はイスラエルとなる (עֵשֶׂר — «бороться» + אֵל — «Бог»). ἐνίσχυσας μετὰ θεοῦ καὶ μετὰ ἀνθρώπων δυνατός — 神と、また人と力比べをして勝った (ἐνισχύω — «укрепиться, осилить»; δυνατός — «сильный»; в Синодальном «боролся с Богом и человеков одолевать будешь»)."
  30: "Ἀνάγγειλόν μοι τὸ ὄνομά σου — あなたの名をわたしに告げてください. Ἵνα τί τοῦτο ἐρωτᾷς τὸ ὄνομά μου — なぜ、わたしの名を問うのか (ответ без имени — не сглажено). ηὐλόγησεν αὐτὸν ἐκεῖ — そこで彼を祝福した."
  31: "Εἶδος θεοῦ — 「神の姿」 (LXX переводит евр. פְּנוּאֵל, Пенуэл; в тексте перевод с приложением имени). εἶδον γὰρ θεὸν πρόσωπον πρὸς πρόσωπον — 神を顔と顔を合わせて見た (ср. Исх 33:20; Суд 6:22; 13:22). ἐσώθη μου ἡ ψυχή — わたしの魂は救われた (σῴζω)."
  32: "ἀνέτειλεν αὐτῷ ὁ ἥλιος — 太陽が彼のために昇った (ἀνατέλλω). ἡνίκα παρῆλθεν τὸ Εἶδος τοῦ θεοῦ — 「神の姿」の場所を通り過ぎたとき (LXX повторяет переведённое имя Пенуэла). ἐπέσκαζεν τῷ μηρῷ — ももを引きずって歩いた (ἐπισκάζω — «хромать»)."
  33: "ἕνεκεν τούτου — それゆえ. τὸ νεῦρον ὃ ἐνάρκησεν — しびれた筋 (νεῦρον — «жила, сухожилие»; ἐνάρκησεν — «онемело»). ἕως τῆς ἡμέρας ταύτης — 今日に至るまで. ἥψατο τοῦ πλάτους τοῦ μηροῦ Ιακωβ τοῦ νεύρου — ヤコブのもものつけ根の筋に触れた (порядок греческий, с повторением τοῦ νεύρου)."
