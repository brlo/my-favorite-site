# jp-box, Бытие, глава 32. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru),
# русский Синодальный (ru) и, где есть, jp-joc (1901, public domain).
# Язык — современный 常体, без 文語; порядок членов и деление на клаузы — по греческому.
# Глава 32: уход Лавана (1), стан Божий и Маханаим (2–3), посольство к Исаву (4–6),
# страх и разделение на два стана (7–9), молитва Иакова (10–13), дары Исаву (14–16),
# наставления слугам (17–21), Иавок и борьба до зари (22–26), имя Израиль (27–29),
# Пенуэл (30–31), восход солнца и жила (32–33).
# НУМЕРАЦИЯ: в gr-lxx-byz глава 32 имеет 33 стиха, и она сдвинута на один стих относительно
# Синодального: наш 32:1 = Синодальный 31:55 (уход Лавана), наш 32:2 = Синодальный 32:1.
# Поэтому и jp-joc, и ru, и jp-ni в главе 32 отстают на стих; номера даны строго по gr-lxx-byz.
# Красного и синего нет: речи людей — в 「…」，вложенная речь — 『…』.
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено по базе).
# LXX в 32:3 переводит имя Маханаим (Παρεμβολαί), в 32:31 — имя Пенуэл (Εἶδος θεοῦ);
# в тексте перевод с приложением имени (как ベテル в 28:19), греческое чтение — в notes.
# 32:25–29 — борьба с Богом и имя Израиль: не сглажено (ἐπάλαιεν — 力[ちから]を争[あらそ]う,
# ἐνίσχυσας — 勝った), см. notes.
# Имена: ラバン, ヤコブ, エサウ, セイル, エドム, イスラエル, ペヌエル, マハナイム, ヤボク.
# Сносок ⟨…⟩ нет: 陣営, 天使, 贈り物, もものつけ根 — понятные слова. jp-ni не использовался.

