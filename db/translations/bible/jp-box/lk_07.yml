verses:
  1: "イエスは民[たみ]の耳[みみ]にすべての言葉[ことば]を語[かた]り終[お]えて、カファルナウムに入[はい]られた。"
  2: "ある百人隊長[ひゃくにんたいちょう]の僕[しもべ]が病[やまい]で死[し]にかかっていた。この僕[しもべ]は主人[しゅじん]にとって大切[たいせつ]な者[もの]であった。"
  3: "百人隊長[ひゃくにんたいちょう]はイエスのことを聞[き]くと、ユダヤ人[じん]の長老[ちょうろう]たちを遣[つか]わして、来[き]て僕[しもべ]を助[たす]けてくださるよう願[ねが]った。"
  4: "長老[ちょうろう]たちは、イエスに会[あ]うと、しきりに願[ねが]った。「あの方[かた]は、そうなさるのにふさわしい人[ひと]です。"
  5: "わたしたちの民[たみ]を愛[あい]し、会堂[かいどう]を建[た]ててくださったのです。」"
  6: "イエスは彼[かれ]らとともに行[い]かれた。もう家[いえ]から遠[とお]くないところまで来[き]たとき、百人隊長[ひゃくにんたいちょう]は友人[ゆうじん]たちを遣[つか]わして言[い]わせた。「主[しゅ]よ、ご面倒[めんどう]をおかけにならないでください。あなたをわたしの屋根[やね]の下[した]に入[い]れる値打[ねう]ちは、わたしにはありません。"
  7: "ですから、あなたのもとへ行[い]くことさえ、自分[じぶん]にはふさわしくないと思[おも]いました。ただ一[ひと]言[こと]おっしゃってください。そうすれば、僕[しもべ]は癒[いや]されます。」"
  8: "わたしも権威[けんい]の下[した]に置[お]かれた者[もの]で、自分[じぶん]の下[した]に兵[へい]たちがいます。この者[もの]に『行[い]け』と言[い]えば行[い]き、あの者[もの]に『来[こ]い』と言[い]えば来[き]、僕[しもべ]に『これを行[おこな]え』と言[い]えば行[おこな]います。」"
  9: "イエスはこれを聞[き]いて感心[かんしん]し、振[ふ]り向[む]いて、従[したが]って来[き]る群衆[ぐんしゅう]に言[い]われた。「<j>あなたがたに言[い]う。イスラエルの中[なか]でも、これほどの信仰[しんこう]を見[み]たことがない。</j>」"
  10: "遣[つか]わされた者[もの]たちが家[いえ]へ帰[かえ]ると、僕[しもべ]は元気[げんき]になっていた。"
  11: "その後[のち]、イエスはナインという町[まち]へ行[い]かれた。弟子[でし]たちと大勢[おおぜい]の群衆[ぐんしゅう]も一緒[いっしょ]に行[い]った。"
  12: "町[まち]の門[もん]に近[ちか]づかれると、見[み]よ、死[し]んだ者[もの]が運[はこ]び出[だ]されていた。その母[はは]のひとり子[ご]で、母[はは]はやもめであった。町[まち]の人[ひと]が大勢[おおぜい]、彼女[かのじょ]と一緒[いっしょ]にいた。"
  13: "主[しゅ]は彼女[かのじょ]をご覧[らん]になって深[ふか]く憐[あわ]れみ、「<j>泣[な]くことはない。</j>」と言[い]われた。"
  14: "そして近[ちか]づいて棺[かん]に手[て]を触[ふ]れられると、運[はこ]ぶ者[もの]たちは立[た]ち止[ど]まった。イエスは言[い]われた。「<j>若者[わかもの]よ、わたしが言[い]う。起[お]きなさい。</j>」"
  15: "死[し]んだ者[もの]は起[お]き上[あ]がって座[すわ]り、話[はな]し始[はじ]めた。イエスはその人[ひと]を母[はは]に渡[わた]された。"
  16: "人々[ひとびと]は皆[みな]恐[おそ]れに包[つつ]まれ、神[かみ]をほめたたえて言[い]った。「大[おお]きな預言者[よげんしゃ]がわたしたちの中[なか]に現[あらわ]れた。神[かみ]はご自分[じぶん]の民[たみ]を訪[おとず]れになった。」"
  17: "このうわさは、ユダヤ全土[ぜんど]とその周[まわ]りの地方[ちほう]にまで広[ひろ]まった。"
  18: "ヨハネの弟子[でし]たちは、これらのことをすべてヨハネに知[し]らせた。そこでヨハネは、弟子[でし]のうちの二人[ふたり]を呼[よ]び、"
  19: "主[しゅ]のもとへ遣[つか]わして言[い]わせた。「来[きた]るべき方[かた]はあなたですか。それとも、ほかの方[かた]を待[ま]つべきでしょうか。」"
  20: "二人[ふたり]はイエスのもとへ来[き]て言[い]った。「洗礼者[せんれいしゃ]ヨハネが、『来[きた]るべき方[かた]はあなたですか。それとも、ほかの方[かた]を待[ま]つべきでしょうか』と言[い]って、わたしたちをあなたのもとへ遣[つか]わしました。」"
  21: "そのころ、イエスは多[おお]くの人[ひと]を病[やまい]や苦[くる]しみから、また悪[わる]い霊[れい]から癒[いや]し、多[おお]くの目[め]の見[み]えない人[ひと]に目[め]を開[ひら]かれた。"
  22: "イエスはお答[こた]えになった。「<j>行[い]って、あなたがたが見[み]たこと、聞[き]いたことをヨハネに伝[つた]えなさい。目[め]の見[み]えない人[ひと]は見[み]えるようになり、歩[ある]けない人[ひと]は歩[ある]き、重[おも]い皮膚病[ひふびょう]の人[ひと]は清[きよ]くなり、耳[みみ]の聞[き]こえない人[ひと]は聞[き]き、死[し]んだ人[ひと]は起[お]き返[かえ]り、貧[まず]しい人[ひと]には福音[ふくいん]が告[つ]げ知[し]らされる。</j>"
  23: "<j>わたしにつまずかない者[もの]は幸[さいわ]いである。</j>」"
  24: "ヨハネの使者[ししゃ]たちが帰[かえ]ると、イエスは群衆[ぐんしゅう]にヨハネのことを話[はな]し始[はじ]められた。「<j>あなたがたは何[なに]を見[み]に荒[あ]れ野[の]へ出[で]て行[い]ったのか。風[かぜ]に揺[ゆ]れる葦[あし]か。</j>"
  25: "<j>では、何[なに]を見[み]に出[で]て行[い]ったのか。柔[やわ]らかい衣[ころも]を着[き]た人[ひと]か。見[み]よ、華[はな]やかな衣[ころも]を着[き]てぜいたくに暮[く]らす者[もの]は、王[おう]の宮[みや]にいる。</j>"
  26: "<j>では、何[なに]を見[み]に出[で]て行[い]ったのか。預言者[よげんしゃ]か。そうだ、あなたがたに言[い]う。預言者[よげんしゃ]よりも優[すぐ]れた者[もの]である。</j>"
  27: "<j>この人[ひと]こそ、『見[み]よ、わたしはあなたの前[まえ]に使者[ししゃ]を遣[つか]わす。彼[かれ]はあなたの前[まえ]に道[みち]を備[そな]える』と書[か]かれている者[もの]である。</j>"
  28: "<j>あなたがたに言[い]う。女[おんな]から生[う]まれた者[もの]の中[なか]で、〔預言者[よげんしゃ]〕ヨハネより大[おお]きな者[もの]はいない。しかし、神[かみ]の国[くに]で最[もっと]も小[ちい]さい者[もの]でも、彼[かれ]よりは大[おお]きい。</j>"
  29: "これを聞[き]いた民[たみ]は皆[みな]、徴税人[ちょうぜいにん]も、ヨハネの洗礼[せんれい]を受[う]けて、神[かみ]を正[ただ]しいと認[みと]めた。"
  30: "しかし、ファリサイ派[は]と律法学者[りっぽうがくしゃ]たちは、ヨハネから洗礼[せんれい]を受[う]けず、自分[じぶん]たちに対[たい]する神[かみ]の御心[みこころ]を退[しりぞ]けた。"
  31: "「<j>では、この時代[じだい]の人々[ひとびと]を何[なに]にたとえようか。彼[かれ]らは何[なに]に似[に]ているか。</j>"
  32: "<j>彼[かれ]らは、広場[ひろば]に座[すわ]って互[たが]いに呼[よ]びかける子[こ]どもたちに似[に]ている。『わたしたちは笛[ふえ]を吹[ふ]いたのに、あなたがたは踊[おど]らなかった。弔[とむら]いの歌[うた]を歌[うた]ったのに、あなたがたは泣[な]かなかった』と言[い]う。</j>"
  33: "<j>洗礼者[せんれいしゃ]ヨハネが来[き]て、パンを食[た]べず、ぶどう酒[しゅ]を飲[の]まないと、あなたがたは『あの人[ひと]には悪霊[あくりょう]が憑[つ]いている』と言[い]う。</j>"
  34: "<j>人[ひと]の子[こ]が来[き]て食[た]べ、飲[の]むと、あなたがたは『見[み]よ、食[く]いしん坊[ぼう]で大酒飲[おおざけの]み、徴税人[ちょうぜいにん]や罪人[ざいにん]の友[とも]だ』と言[い]う。</j>"
  35: "<j>しかし、知恵[ちえ]は、その子[こ]らすべてによって正[ただ]しいと認[みと]められた。</j>」"
  36: "ファリサイ派[は]のある人[ひと]が、一緒[いっしょ]に食事[しょくじ]をしたいとイエスに願[ねが]った。イエスはそのファリサイ派[は]の人[ひと]の家[いえ]に入[はい]り、食卓[しょくたく]に着[つ]かれた。"
  37: "すると、その町[まち]に罪[つみ]深[ふか]い女[おんな]がいた。その女[おんな]は、イエスがファリサイ派[は]の人[ひと]の家[いえ]で食事[しょくじ]をしておられるのを知[し]ると、香油[こうゆ]の入[はい]ったアラバスターの壺[つぼ]を持[も]って来[き]て、"
  38: "泣[な]きながら、イエスの後[うし]ろの足[あし]もとに立[た]ち、涙[なみだ]でその足[あし]をぬらし始[はじ]め、頭[あたま]の髪[かみ]でぬぐい、その足[あし]に口[くち]づけし、香油[こうゆ]を塗[ぬ]った。"
  39: "イエスを招[まね]いたファリサイ派[は]の人[ひと]はこれを見[み]て、心[こころ]の中[なか]で思[おも]った。「この人[ひと]がもし預言者[よげんしゃ]なら、自分[じぶん]に触[さわ]っている女[おんな]が誰[だれ]で、どんな女[おんな]か、分[わ]かっているはずだ。罪[つみ]深[ふか]い女[おんな]だから。」"
  40: "イエスは彼[かれ]に言[い]われた。「<j>シモン、あなたに言[い]うことがある。</j>」シモンは言[い]った。「先生[せんせい]、お話[はなし]しください。」"
  41: "「<j>ある金貸[かねか]しに、二人[ふたり]の借[か]り主[ぬし]がいた。一人[ひとり]は五百[ごひゃく]デナリオン、もう一人[ひとり]は五十[ごじゅう]デナリオンを借[か]りていた。</j>"
  42: "<j>二人[ふたり]とも返[かえ]すことができなかったので、金貸[かねか]しは二人[ふたり]の借金[しゃっきん]を免除[めんじょ]してやった。では、二人[ふたり]のうち、どちらが彼[かれ]を多[おお]く愛[あい]するだろうか。</j>」"
  43: "シモンは答[こた]えた。「多[おお]く免除[めんじょ]してもらった方[ほう]ではないかと思[おも]います。」イエスは言[い]われた。「<j>あなたの判断[はんだん]は正[ただ]しい。</j>」"
  44: "そして女[おんな]の方[ほう]を振[ふ]り向[む]いて、シモンに言[い]われた。「<j>この女[おんな]が見[み]えるか。わたしがあなたの家[いえ]に入[はい]ったとき、あなたはわたしの足[あし]に水[みず]をかけてくれなかった。しかし、この女[おんな]は涙[なみだ]でわたしの足[あし]をぬらし、髪[かみ]でぬぐってくれた。</j>"
  45: "<j>あなたはわたしに口[くち]づけをしなかった。しかし、この女[おんな]は、わたしが入[はい]ってから今[いま]まで、わたしの足[あし]に口[くち]づけをやめない。</j>"
  46: "<j>あなたはわたしの頭[あたま]に油[あぶら]を塗[ぬ]らなかった。しかし、この女[おんな]は香油[こうゆ]をわたしの足[あし]に塗[ぬ]った。</j>"
  47: "<j>だから、あなたに言[い]う。この女[おんな]の多[おお]くの罪[つみ]は赦[ゆる]された。彼女[かのじょ]が多[おお]く愛[あい]したからである。しかし、少[すこ]ししか赦[ゆる]されない者[もの]は、少[すこ]ししか愛[あい]さない。</j>」"
  48: "そして女[おんな]に言[い]われた。「<j>あなたの罪[つみ]は赦[ゆる]された。</j>」"
  49: "一緒[いっしょ]に席[せき]に着[つ]いていた者[もの]たちは、心[こころ]の中[なか]で言[い]い始[はじ]めた。「いったいこの人[ひと]は誰[だれ]か。罪[つみ]まで赦[ゆる]すとは。」"
  50: "イエスは女[おんな]に言[い]われた。「<j>あなたの信仰[しんこう]があなたを救[すく]った。安心[あんしん]して行[い]きなさい。</j>」"

notes:
  1: "ἐπλήρωσεν πάντα τὰ ῥήματα — «исполнил все слова»; 語り終えて, как jp-joc「聽かしめ畢りて». εἰς τὰς ἀκοὰς τοῦ λαοῦ — «в уши народа»; 民の耳に."
  2: "ἔντιμος — «дорогой, в чести»; 大切な者."
  6: "μὴ σκύλλου — «не затрудняйся»; ご面倒をおかけにならないでください (то же слово в 8:49)."
  9: "ἐθαύμασεν — «удивился»; 感心し, без сглаживания в «похвалил»."
  11: "ἐν τῷ ἑξῆς — «в последующее [время]»; その後, без уточнения «на другой день»."
  14: "σοροῦ — одр, носилки; 棺. νεανίσκε, σοὶ λέγω, ἐγέρθητι — 若者よ、わたしが言う。起きなさい."
  16: "ἐπεσκέψατο — «посетил»; 訪れになった."
  20: "Слова Иоанна, переданные учениками, — вложенная цитата 『』, не красным."
  21: "μαστίγων — «бичей», т.е. мучительных недугов; 苦しみ."
  25: "τρυφῇ — «в роскоши»; ぜいたくに暮らす."
  28: "В критической базе нет προφήτης; Церковь (TR, jp-joc「大なる預言者は有らず」) читает — 〔預言者〕. В квадратных скобках критической базы стоят стихи 29–30 (колебание западной традиции, а не разночтение): в церковном тексте они есть, 〔〕 по этой причине не ставлю."
  29: "ἐδικαίωσαν τὸν θεόν — «оправдали Бога», т.е. признали Его правым; 神を正しいと認めた."
  30: "τὴν βουλὴν τοῦ θεοῦ ἠθέτησαν εἰς ἑαυτούς — «отвергли волю Божию о себе»; 自分たちに対する神の御心を退けた."
  31: "В критической базе нет ὁ κύριος; Церковь (TR, jp-joc「主又曰へり」) читает «Тогда Господь сказал» — 主は, без 〔〕: это замена обозначения говорящего, а не добавка по смыслу."
  32: "ηὐλήσαμεν — «играли на свирели»; 笛を吹いた. ἐθρηνήσαμεν — «пели плачевное»; 弔いの歌を歌った. Слова детей — вложенная цитата 『』."
  34: "φάγος καὶ οἰνοπότης — «обжора и пьяница»; 食いしん坊で大酒飲み."
  35: "ἐδικαιώθη ἡ σοφία ἀπὸ πάντων τῶν τέκνων αὐτῆς — «оправдана премудрость всеми чадами её»; 知恵は、その子らすべてによって正しいと認められた."
  36: "κατεκλίθη — «возлёг»; 食卓に着かれた."
  37: "ἀλάβαστρον μύρου — алавастровый сосуд с миром; 香油の入ったアラバスターの壺. ἁμαρτωλός — 罪深い女, без отождествления с другими лицами Евангелия."
  41: "δηνάρια πεντακόσια — 五百デナリオン; сноску не ставлю, デナリオン объяснён при первом упоминании (Мф 18:28)."
  42: "ἐχαρίσατο — «даром простил»; 免除してやった. Вопрос Христа сохранён без ответа в самой притче."
  47: "οὗ χάριν — «посему»; だから. ὅτι ἠγάπησεν πολύ — 多く愛したからである: причина, а не «доказательство» прощения."
