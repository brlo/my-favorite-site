# jp-box, 1-я Царств, глава 28. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет,
# jp-ni (811 стихов, под авторским правом) источником не был.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 28: филистимляне собираются на войну, Анхус берёт Давида с собою (1–2);
# Самуил умер, Саул истребил волшебников, но сам ищет волшебницу (3–7);
# ночной визит в Аэндор, явление Самуила (8–14); речь Самуила о гибели
# Саула и его сыновей (15–19); женщина подкрепляет Саула пищей (20–25).
# Речь персонажей — 「…」 (1–2, 7–19, 21–22); речь Самуила открывается в 16
# и закрывается в 19; вложенной речи нет. Красного нет.
# Нумерация по gr: 25 стихов, совпадает с csl/ru.
# 〔…〕 нет: в gr-lxx-byz на месте каждого стиха есть текст, знака «.» нет;
# добавлений церковного чтения не вносилось.
# Сносок ⟨…⟩ нет: 霊媒, 預言者, ペリシテ人, 王, アマレク уже пояснены в корпусе.

