verses:
  1: "そのころ、ペリシテ人[じん]はイスラエルと戦[たたか]うために、自分[じぶん]たちの陣[じん]に集[あつ]まった。アンクスはダビデに言[い]った。「あなたとあなたの者[もの]たちが、わたしとともに戦[たたか]いに出[で]ることを、よくよく知[し]っておけ。」"
  2: "ダビデはアンクスに言[い]った。「今[いま]に、あなたのしもべが何[なに]をするか、わかるだろう。」アンクスはダビデに言[い]った。「そうだ。わたしはあなたを、この先[さき]ずっと、わが親衛隊[しんえいたい]の長[ちょう]にしてやろう。」"
  3: "サムエルは死[し]んだ。イスラエルはみな彼[かれ]のために泣[な]き、彼[かれ]を自分[じぶん]の町[まち]アルマタイムに葬[ほうむ]った。サウルは霊媒[れいばい]と占[うらな]い者[もの]をこの地[ち]から除[のぞ]き去[さ]った。"
  4: "ペリシテ人[じん]は集[あつ]まって来[き]て、ソマンに陣[じん]を敷[し]いた。サウルもイスラエルのすべての男[おとこ]を集[あつ]め、ギルボアに陣[じん]を敷[し]いた。"
  5: "サウルはペリシテ人[じん]の陣[じん]を見[み]て恐[おそ]れ、その心[こころ]はひどく動揺[どうよう]した。"
  6: "サウルは主[しゅ]に問[と]うたが、主[しゅ]は彼[かれ]に答[こた]えなかった。夢[ゆめ]によっても、ウリムによっても、預言者[よげんしゃ]によっても、答[こた]えはなかった。"
  7: "サウルは家来[けらい]たちに言[い]った。「わたしのために霊媒[れいばい]の女[おんな]を探[さが]せ。その女[おんな]のところへ行[い]って、尋[たず]ねよう。」家来[けらい]たちは彼[かれ]に言[い]った。「見[み]よ、アエンドルに霊媒[れいばい]の女[おんな]がいる。」"
  8: "サウルは身[み]を包[つつ]み、ほかの衣[ころも]を着[き]て、自分[じぶん]と二人[ふたり]の男[おとこ]とで出[で]かけた。夜[よる]、彼[かれ]らはその女[おんな]のところへ来[き]て、サウルは言[い]った。「どうか、霊媒[れいばい]の術[じゅつ]でわたしのために占[うらな]い、わたしが告[つ]げる者[もの]を、わたしのために呼[よ]び上[あ]がらせよ。」"
  9: "女[おんな]は彼[かれ]に言[い]った。「ごらん、あなたはサウルが何[なに]をしたかを知[し]っている。この地[ち]から霊媒[れいばい]と占[うらな]い者[もの]を根[ね]絶[だ]やしたのだ。なぜ、あなたはわたしの命[いのち]に罠[わな]をかけて、わたしを殺[ころ]そうとするのか。」"
  10: "サウルは女[おんな]に誓[ちか]って言[い]った。「主[しゅ]は生[い]きておられる。このことのために、あなたに災[わざわ]いは及[およ]ばない。」"
  11: "女[おんな]が言[い]った。「あなたのために、だれを呼[よ]び上[あ]がらせようか。」サウルが言[い]った。「サムエルを、わたしのために呼[よ]び上[あ]がらせよ。」"
  12: "女[おんな]はサムエルを見[み]て、大[おお]きな声[こえ]で叫[さけ]んだ。そしてサウルに言[い]った。「なぜ、あなたはわたしを欺[あざむ]いたのか。あなたはサウルだ。」"
  13: "王[おう]は女[おんな]に言[い]った。「恐[おそ]れるな。何[なに]を見[み]たのか。」女[おんな]は彼[かれ]に言[い]った。「わたしには、地[ち]から上[のぼ]って来[く]る神[かみ]々[がみ]が見[み]える。」"
  14: "彼[かれ]は女[おんな]に言[い]った。「どんな姿[すがた]をしているのか。」女[おんな]は言[い]った。「地[ち]から上[のぼ]って来[く]る、まっすぐに立[た]った男[おとこ]で、長[なが]い衣[ころも]をまとっている。」サウルは、それがサムエルだと知[し]って、地[ち]に向[む]かって顔[かお]を伏[ふ]せ、彼[かれ]に礼[れい]をした。"
  15: "サムエルは言[い]った。「なぜ、わたしを呼[よ]び起[お]こして上[のぼ]らせたのか。」サウルは言[い]った。「わたしはひどく苦[くる]しんでいる。ペリシテ人[じん]がわたしを攻[せ]め、神[かみ]はわたしから離[はな]れ去[さ]って、もはや預言者[よげんしゃ]によっても夢[ゆめ]によっても、わたしに答[こた]えない。だから、どうすべきかを知[し]らせてもらおうと、あなたを呼[よ]んだのだ。」"
  16: "サムエルは言[い]った。「主[しゅ]があなたから離[はな]れ、あなたの隣人[りんじん]の側[がわ]に付[つ]いたのに、なぜ、わたしに問[と]うのか。"
  17: "主[しゅ]は、わたしの手[て]によって語[かた]られたとおりに、あなたに対[たい]して行[おこな]った。主[しゅ]はあなたの手[て]から王国[おうこく]を引[ひ]き裂[さ]き、あなたの隣人[りんじん]ダビデに与[あた]える。"
  18: "あなたは主[しゅ]の声[こえ]に聞[き]き従[したが]わず、アマレクに対[たい]して燃[も]える怒[いか]りを実行[じっこう]しなかった。それゆえ、主[しゅ]はこの日[ひ]、あなたにこのことを行[おこな]ったのだ。"
  19: "主[しゅ]はイスラエルを、あなたとともにペリシテ人[じん]の手[て]に渡[わた]す。明日[あした]、あなたとあなたの息子[むすこ]たちは、あなたとともに倒[たお]れる。主[しゅ]はイスラエルの陣[じん]もペリシテ人[じん]の手[て]に渡[わた]す。」"
  20: "サウルはただちに、立[た]ったままの姿勢[しせい]で地[ち]に倒[たお]れた。サムエルの言葉[ことば]に、ひどく恐[おそ]れたからである。彼[かれ]にはもはや力[ちから]がなかった。その日[ひ]もその夜[よる]も、パンを食[た]べていなかったからである。"
  21: "女[おんな]はサウルに近[ちか]づき、彼[かれ]がひどく動揺[どうよう]しているのを見[み]て言[い]った。「ごらん、はしためはあなたの声[こえ]に聞[き]き従[したが]い、自分[じぶん]の命[いのち]を危[あや]うくさらして、あなたがわたしに語[かた]った言葉[ことば]を聞[き]いた。"
  22: "今[いま]、どうか、はしための声[こえ]を聞[き]き入[い]れてほしい。あなたの前[まえ]にパンひときれを置[お]くから、食[た]べて力[ちから]をつけてほしい。あなたは道[みち]を行[い]かねばならないのだから。」"
  23: "彼[かれ]は食[た]べようとしなかった。家来[けらい]たちと女[おんな]が彼[かれ]を強[し]いて勧[すす]めたので、彼[かれ]はその声[こえ]に従[したが]い、地[ち]から起[お]き上[あ]がって椅子[いす]に座[すわ]った。"
  24: "女[おんな]の家[いえ]には肥[こ]えた子牛[こうし]がいた。女[おんな]は急[いそ]いでそれを屠[ほふ]り、粉[こな]を取[と]って練[ね]り、種[たね]を入[い]れないパンを焼[や]いた。"
  25: "女[おんな]はそれをサウルの前[まえ]と家来[けらい]たちの前[まえ]に持[も]って来[き]た。彼[かれ]らは食[た]べ、そして立[た]ち上[あ]がって、その夜[よる]のうちに去[さ]った。"

notes:
  1: "ἐν ταῖς ἡμέραις ἐκείναις — в те дни. συναθροίζονται ἀλλόφυλοι ἐν ταῖς παρεμβολαῖς αὐτῶν — филистимляне собираются в своих станах (παρεμβολή — стан, ополчение). ἐξελθεῖν πολεμεῖν μετὰ Ισραηλ — выйти воевать с Израилем. Γινώσκων γνώσει — «знанием узнай» (гебраизм; слав. «разумея разумей»), по-японски よくよく知っておけ. Ἀγχούς — アンクス (в ru Анхус; евр. Ахиш)."
  2: "Οὕτω νῦν γνώσει ἃ ποιήσει ὁ δοῦλός σου — «так теперь узнаешь, что сделает раб твой». ἀρχισωματοφύλακα — «начальника телохранителей» (ἀρχι- + σωματοφύλαξ; слав. «началника хранителей телу моему»), 親衛隊の長. πάσας τὰς ἡμέρας — во все дни, навсегда."
  3: "Σαμουηλ ἀπέθανεν — Самуил умер: LXX ставит это известие здесь, перед рассказом об Аэндоре. ἐκόψαντο — оплакали (κόπτομαι). ἐν Αρμαθαιμ ἐν πόλει αὐτοῦ — в Армафаиме, городе его (слав. «во армафеме», ru «в Раме»). περιεῖλεν — убрал, удалил. ἐγγαστρίμυθοι — 霊媒 (чревовещатели), γνώσται — 占い者 (знающие, гадатели)."
  4: "Σωμαν — Сонам (в евр. традиции Сунем), ソマン. Γελβουε — Гелвуе (ギルボア). συναθροίζει πάντα ἄνδρα Ισραηλ — собирает всех мужей Израиля. παρεμβάλλουσιν — располагаются станом."
  5: "ἐξέστη ἡ καρδία αὐτοῦ σφόδρα — «сердце его сильно пришло в смятение» (ἐξίστημι), ひどく動揺した."
  6: "ἐπηρώτησεν Σαουλ διὰ κυρίου — вопросил Саул через Господа. οὐκ ἀπεκρίθη αὐτῷ κύριος — не ответил ему Господь. ἐνυπνίοις — сновидения; δήλοις — «явным знакам» (LXX так передаёт урим; слав. «во явлениих», ru «урим»), в тексте ウリム. ἐν τοῖς προφήταις — через пророков."
  7: "Ζητήσατέ μοι γυναῖκα ἐγγαστρίμυθον — найдите мне женщину-чревовещательницу (霊媒の女). ζητήσω ἐν αὐτῇ — «вопрошу через неё». Αενδωρ — Аэндор (アエンドル; слав. «аендор»)."
  8: "συνεκαλύψατο — закутался, скрыл лицо. περιεβάλετο ἱμάτια ἕτερα — надел другие одежды. Μάντευσαι δή μοι — «погадай же мне» (μαντεύομαι). ἐν τῷ ἐγγαστριμύθῳ — чревовещанием, 霊媒の術. ἀνάγαγέ μοι — «выведи мне» (вызови мёртвого, ἀνάγω)."
  9: "ἐξωλέθρευσεν — истребил (ἐξολοθρεύω; слав. «истреби»). παγιδεύεις τὴν ψυχήν μου — «ставишь сеть душе моей» (παγιδεύω), 罠をかける. θανατῶσαι αὐτήν — чтобы умертвить её."
  10: "ὤμοσεν αὐτῇ λέγων — поклялся ей, говоря. Ζῇ κύριος — «жив Господь» (клятвенная формула). εἰ ἀπαντήσεταί σοι ἀδικία — «если постигнет тебя неправда»: условная форма клятвы, по смыслу — отрицание (слав. «аще срящет тя неправда»)."
  11: "Τίνα ἀναγάγω σοι — кого вывести тебе. Τὸν Σαμουηλ ἀνάγαγέ μοι — «Самуила выведи мне» (имя с артиклем τόν в винительном падеже)."
  12: "ἀνεβόησεν φωνῇ μεγάλῃ — вскричала громким голосом. παρελογίσω με — обманул меня (παραλογίζομαι; слав. «прельстил еси»)."
  13: "Μὴ φοβοῦ — не бойся. εἰπὸν τίνα ἑόρακας — скажи, кого ты увидела (ἑόρακας, перфект). Θεοὺς ἑόρακα — «богов видела» (слав. «боги видех»): евр. אֱלֹהִים может пониматься и как «бог» ед. ч., LXX понял как мн. ч."
  14: "Τί ἔγνως — «что ты узнала?», т. е. какой он видом. ἄνδρα ὄρθιον — «мужа прямого, стоящего» (ὄρθιος; слав. «мужа стара» — по евр. «старик»). διπλοΐδα ἀναβεβλημένος — «одетый в двойную, длинную одежду» (διπλοΐς; слав. «одеянием долгим»). ἔκυψεν ἐπὶ πρόσωπον — склонился лицом до земли."
  15: "παρηνώχλησάς μοι ἀναβῆναί με — «потревожил меня, чтобы я взошёл» (ἐνοχλέω). Θλῖβομαι σφόδρα — «сильно стеснён», ひどく苦しんでいる. ὁ θεὸς ἀφέστηκεν ἀπ᾽ ἐμοῦ — Бог отступил от меня. ἐν χειρὶ τῶν προφητῶν — «рукою пророков». γνωρίσαι μοι τί ποιήσω — возвестить мне, что мне делать."
  16: "ἐπερωτᾷς με — спрашиваешь меня. γέγονεν μετὰ τοῦ πλησίον σου — «стал с ближним твоим» (так gr и слав.); в ru «сделался врагом твоим» — по смыслу евр. текста."
  17: "πεποίηκεν κύριός σοι — «сделал тебе Господь». ἐν χειρί μου — «рукою моею». διαρρήξει — разорвёт (διαρρήγνυμι), 引き裂く. τῷ πλησίον σου τῷ Δαυιδ — ближнему твоему Давиду."
  18: "διότι οὐκ ἤκουσας φωνῆς κυρίου — ибо не послушал гласа Господня. οὐκ ἐποίησας θυμὸν ὀργῆς αὐτοῦ — «не исполнил ярости гнева Его» (θυμός, ὀργή). ἐν Αμαληκ — над Амаликом. τὸ ῥῆμα — слово, дело."
  19: "παραδώσει — предаст. μετὰ σοῦ — с тобою. αὔριον — завтра. πεσοῦνται — падут. В ru «будете со мною» — по евр. тексту; в gr «с тобою»."
  20: "ἔπεσεν ἑστηκὼς ἐπὶ τὴν γῆν — «упал, стоя на земле», т. е. во весь рост: 立ったままの姿勢で地に倒れた. οὐ γὰρ ἔφαγεν ἄρτον — ибо не ел хлеба. ὅλην τὴν ἡμέραν καὶ ὅλην τὴν νύκτα — весь тот день и всю ту ночь."
  21: "εἰσῆλθεν ἡ γυνὴ πρὸς Σαουλ — вошла женщина к Саулу. ἔσπευσεν σφόδρα — «поспешил», т. е. пришёл в сильное смятение. ἐθέμην τὴν ψυχήν μου ἐν τῇ χειρί μου — «положила душу мою в руке моей», рисковала жизнью: 命を危うくさらして. ἤκουσα τοὺς λόγους — послушала слов."
  22: "ψωμὸν ἄρτου — кусок хлеба (ψωμός). παραθήσω ἐνώπιόν σου — положу пред тобою. ἔσται ἐν σοὶ ἰσχύς — будет в тебе сила. ὅτι πορεύσῃ ἐν ὁδῷ — ибо ты пойдёшь в путь."
  23: "οὐκ ἐβουλήθη φαγεῖν — не захотел есть. παρεβιάζοντο — принуждали (παραβιάζομαι). ἀνέστη ἀπὸ τῆς γῆς — встал с земли. δίφρος — седалище, стул. В ru добавлено «и сказал: не буду есть» (по евр.) — в gr этого нет."
  24: "δάμαλις νομάς — «телушка кормовая», откормленный телёнок (слав. «юница питомая»). ἔθυσεν — заколола. ἄλευρα — мука. ἐφύρασεν — замесила. ἄζυμα — пресный хлеб, опресноки: 種を入れないパン."
  25: "προσήγαγεν — принесла, поставила. ἐνώπιον Σαουλ καὶ ἐνώπιον τῶν παίδων αὐτοῦ — пред Саулом и пред слугами его. ἀνέστησαν καὶ ἀπῆλθον τὴν νύκτα ἐκείνην — встали и ушли в ту ночь."
