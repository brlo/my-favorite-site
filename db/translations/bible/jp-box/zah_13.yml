# jp-box, Захария, глава 13. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной (совпадает с gr: 9 стихов).
# Язык — современный 常体; 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1 «в тот день» — всякое место открыто дому Давида, омовение и кропление;
# 2 истребление имён идолов, лжепророков и нечистого духа; 3 отец и мать против
# пророчествующего сына; 4–6 стыд пророков, «я не пророк, я земледелец», рубцы на руках;
# 7 меч на пастыря, овцы рассеются, рука на малых; 8–9 две части погибнут, третья
# через огонь, «это Мой народ», «Господь — Бог мой».
# Голоса: 1 пророческое описание (без кавычек); 2–9 слово Господа в 「…»; в 3 слова
# родителей в 『…』, в 5–6 слова пророка в 『…』, в 9 слова Господа и народа в 『…』.
# Термины: 偶像[ぐうぞう] — εἴδωλον; 偽[にせ]の預言者[よげんしゃ] — ψευδοπροφήτης;
# 毛皮[けがわ]の衣[ころも] — δέρρις τριχίνη; 契約[けいやく] — διαθήκη.
#
tr_code: jp-box
book: zah
chapter: 13
draft: true

verses:
  1: "その日[ひ]、ダビデの家[いえ]とエルサレムの住[す]む者[もの]たちのために、至[いた]るところが開[ひら]かれ、洗[あら]いと振[ふ]りかけの場[ば]となる。"
  2: "「その日[ひ]、万軍[ばんぐん]の主[しゅ]は言[い]われる。わたしは偶像[ぐうぞう]の名[な]をこの地[ち]から滅[ほろ]ぼし、もはやそれらは思[おも]い出[だ]されることもない。わたしは偽[にせ]の預言者[よげんしゃ]たちと汚[けが]れた霊[れい]をこの地[ち]から取[と]り除[のぞ]く。"
  3: "もしだれかが預言[よげん]するなら、その父[ちち]と母[はは]、すなわち彼を生[う]んだ者[もの]たちが彼に言[い]う。『おまえは生[い]きてはいけない。主[しゅ]の名[な]によって偽[いつわ]りを語[かた]ったからだ』と。そして、彼を生[う]んだ父[ちち]と母[はは]が、彼の預言[よげん]するとき、彼をつまずかせて倒[たお]す。"
  4: "その日[ひ]、預言者[よげんしゃ]たちはそれぞれ、預言[よげん]するとき、自分[じぶん]の見[み]た幻[まぼろし]を恥[は]じ、偽[いつわ]りを語[かた]ったゆえに、毛皮[けがわ]の衣[ころも]をまとう。"
  5: "彼は言[い]う。『わたしは預言者[よげんしゃ]ではない。わたしは土[つち]を耕[たがや]す者[もの]である。人[ひと]がわたしを若[わか]い時[とき]から生[う]んだからである』と。"
  6: "彼に言[い]う。『あなたの両手[りょうて]の間[あいだ]にある、これらの傷[きず]は何[なん]か』と。彼は言[い]う。『わたしの愛[あい]する者[もの]の家[いえ]で受[う]けた傷[きず]である』と。」"
  7: "「剣[つるぎ]よ、わたしの羊飼[ひつじか]いと、わたしの近[ちか]い者[もの]の上[うえ]に立[た]て。万軍[ばんぐん]の主[しゅ]は言[い]われる。羊飼[ひつじか]いを打[う]て。そうすれば羊[ひつじ]たちは散[ち]る。わたしはわたしの手[て]を小[ちい]さな羊飼[ひつじか]いたちに及[およ]ぼす。"
  8: "その日[ひ]、全[ぜん]地[ち]のうち、三分[さんぶん]の二[に]は滅[ほろ]ぼされて消[き]え失[う]せ、三分[さんぶん]の一[いち]はその中[なか]に残[のこ]る、と主[しゅ]は言[い]われる。"
  9: "わたしはその三分[さんぶん]の一[いち]を火[ひ]の中[なか]に通[とお]し、銀[ぎん]を溶[と]かすように彼らを溶[と]かし、金[きん]を試[ため]すように彼らを試[ため]す。彼らはわたしの名[な]を呼[よ]び、わたしは彼らに答[こた]える。わたしは言[い]う。『これはわたしの民[たみ]である』と。彼らは言[い]う。『主[しゅ]はわたしの神[かみ]である』と。」"

notes:
  1: "ἔσται πᾶς τόπος διανοιγόμενος — «будет всякое место отверзаемое» (слав.); слав. добавляет «живущим во Иерусалиме в предомовение и кропление» — нет в gr модуля, внесено (洗いと振りかけ); в ru «источник… для омытия греха и нечистоты» — иное чтение, не внесено."
  2: "ἐξολεθρεύσω τὰ ὀνόματα τῶν εἰδώλων — «истреблю имена идолов»; οὐκέτι ἔσται αὐτῶν μνεία — «не будет о них памяти»; τὸ πνεῦμα τὸ ἀκάθαρτον — «дух нечистый»."
  3: "συμποδιοῦσιν αὐτὸν — «запнут (собьют с ног) его», отсюда つまずかせて倒す; ὅτι ψευδῆ ἐλάλησας — «ибо ложь говорил»; ἐν τῷ προφητεύειν — «когда пророчествует»."
  4: "καταισχυνθήσονται — «устыдятся»; ἐκ τῆς ὁράσεως αὐτοῦ — «от видения своего»; δέρριν τριχίνην — «кожаный волосяной плащ» (毛皮の衣); ἀνθ' ὧν ἐψεύσαντο — «за то, что солгали»."
  5: "Οὔκ εἰμι προφήτης — «я не пророк»; ἄνθρωπος ἐργαζόμενος τὴν γῆν — «человек, возделывающий землю»; ἐγέννησέν με ἐκ νεότητός μου — «родил меня от юности моей» (тёмное, оставлено буквально)."
  6: "Τί αἱ πληγαὶ αὗται — «что эти язвы (рубцы)»; ἀνὰ μέσον τῶν χειρῶν — «между рук»; ἐν τῷ οἴκῳ τῷ ἀγαπητῷ μου — «в доме возлюбленного моего»."
  7: "Ῥομφαία, ἐξεγέρθητι — «меч, поднимись»; ἐπ' ἄνδρα πολίτην μου — «на мужа, ближнего (гражданина) Моего»; πατάξατε — «поразите» (мн. ч.); ἐπάξω τὴν χεῖρά μου — «наведу руку Мою»; слав. «на малыя пастыри» (в скобках) — 小さな羊飼いたち."
  8: "τὰ δύο μέρη ἐξολεθρευθήσεται — «две части истребятся»; τὸ τρίτον ὑπολειφθήσεται — «третья останется»."
  9: "διάξω τὸ τρίτον διὰ πυρός — «проведу третью часть через огонь»; πυρώσω… δοκιμῶ — «расплавлю… испытаю»; ἐπικαλέσεται τὸ ὄνομά μου — «призовёт имя Моё»; Λαός μου οὗτός ἐστιν — «народ Мой это»."
