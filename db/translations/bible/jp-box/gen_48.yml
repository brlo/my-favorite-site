# jp-box, Бытие, глава 48. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru).
# jp-joc в этой главе нет; ru — только для понимания, не источник.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 48: Иосиф приводит сыновей к больному отцу (1–7), усыновление Ефрема и Манассии
# и благословение с переменой рук (8–20), обетование о возвращении и дар Сикема (21–22).
# Красного и синего нет: говорит патриарх, не Христос.
# Кавычки: речь Иакова — 「…」 (3–7), слова Бога внутри неё — 『…』 (4),
# благословение с вложенной формулой — 「…『…』と。」 (20).
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено; 48:7 [αὕτη ἐστὶν Βαιθλεεμ] в базе есть,
# хотя критическое издание держит его в квадратных скобках, — поэтому скобок нет).
# Сносок ⟨…⟩ нет: 嗣業, 御使, 膝 понятны или уже в корпусе. jp-ni не использовался.

tr_code: jp-box
