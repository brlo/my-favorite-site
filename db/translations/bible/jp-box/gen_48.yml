verses:
  1: "これらのことの後[あと]、ヨセフに「あなたの父[ちち]が病[や]んでいる」と告[つ]げられた。彼[かれ]は二人[ふたり]の息子[むすこ]マナセとエフライムを連[つ]れて、ヤコブのもとへ来[き]た。"
  2: "ヤコブに「見[み]よ、あなたの子[こ]ヨセフがあなたのもとへ来[き]ています」と告[つ]げられた。イスラエルは力[ちから]を振[ふ]るって床[とこ]の上[うえ]に座[すわ]った。"
  3: "ヤコブはヨセフに言[い]った。「わたしの神[かみ]は、カナンの地[ち]のルズでわたしに現[あらわ]れ、わたしを祝福[しゅくふく]して"
  4: "言[い]われた。『見[み]よ、わたしはあなたを増[ふ]やし、多[おお]くし、あなたを諸国[しょこく]の民[たみ]の集[つど]いとしよう。わたしはこの地[ち]を、あなたと、あなたの後[あと]の子孫[しそん]に、永遠[えいえん]の所有[しょゆう]として与[あた]えよう。』"
  5: "今[いま]、あなたがエジプトで、わたしがあなたのもとへ来[く]る前[まえ]に生[う]まれたあなたの二人[ふたり]の子[こ]、エフライムとマナセは、わたしのものである。ルベンとシメオンがそうであるように、彼[かれ]らはわたしのものとなる。"
  6: "しかし、その後[あと]あなたが生[う]む子[こ]らはあなたのものであり、兄弟[きょうだい]たちの名[な]によって、彼[かれ]らの嗣業[しぎょう]の中[なか]で呼[よ]ばれる。"
  7: "わたしがシリアのメソポタミアから来[き]たとき、ラケルはカナンの地[ち]で、エフラタに来[く]る途中[とちゅう]、地[ち]のハブラタの競馬場[けいばじょう]のあたりで、わたしに先立[さきだ]って死[し]んだ。わたしは彼女[かのじょ]を競馬場[けいばじょう]の道[みち]に葬[ほうむ]った。これがベツレヘムである。」"
  8: "イスラエルはヨセフの息子[むすこ]たちを見[み]て言[い]った。「これらは誰[だれ]か。」"
  9: "ヨセフは父[ちち]に言[い]った。「神[かみ]がここでわたしに与[あた]えてくださったわたしの息子[むすこ]たちです。」ヤコブは言[い]った。「彼[かれ]らをわたしのところへ連[つ]れて来[き]なさい。わたしが彼[かれ]らを祝福[しゅくふく]しよう。」"
  10: "イスラエルの目[め]は老齢[ろうれい]のために重[おも]くなり、見[み]ることができなかった。彼[かれ]は彼[かれ]らを自分[じぶん]のそばに近[ちか]づけ、彼[かれ]らに口[くち]づけし、抱[だ]いた。"
  11: "イスラエルはヨセフに言[い]った。「わたしはあなたの顔[かお]を見[み]ることを失[しっ]わなかった。見[み]よ、神[かみ]はあなたの子孫[しそん]さえもわたしに示[しめ]された。」"
  12: "ヨセフは彼[かれ]らを父[ちち]の膝[ひざ]から引[ひ]き出[だ]し、地[ち]に顔[かお]を伏[ふ]せて礼拝[れいはい]した。"
  13: "ヨセフは二人[ふたり]の息子[むすこ]を取[と]った。エフライムを自分[じぶん]の右手[みぎて]に、イスラエルの左手[ひだりて]に対[たい]して置[お]き、マナセを自分[じぶん]の左手[ひだりて]に、イスラエルの右手[みぎて]に対[たい]して置[お]いて、彼[かれ]を近[ちか]づけた。"
  14: "イスラエルは右手[みぎて]を伸[の]ばしてエフライムの頭[かしら]に置[お]いた。彼[かれ]は弟[おとうと]であった。左手[ひだりて]をマナセの頭[かしら]に置[お]き、手[て]を入[い]れ替[か]えた。"
  15: "彼[かれ]は彼[かれ]らを祝福[しゅくふく]して言[い]った。「わたしの父[ちち]たちアブラハムとイサクがその御前[みまえ]に仕[つか]えて喜[よろこ]ばれた神[かみ]、生[う]まれたときから今日[きょう]までわたしを養[やしな]ってくださる神[かみ]、"
  16: "すべての悪[あく]からわたしを贖[あがな]い出[だ]してくださる御使[みつかい]よ。どうか、この子[こ]らを祝福[しゅくふく]し、わたしの名[な]と、わたしの父[ちち]たちアブラハムとイサクの名[な]が彼[かれ]らの中[なか]に呼[よ]ばれ、彼[かれ]らが地[ち]の上[うえ]で多[おお]い群[む]れとなりますように。」"
  17: "ヨセフは、父[ちち]が右手[みぎて]をエフライムの頭[かしら]に置[お]いたのを見[み]て、それを重[おも]く思[おも]った。ヨセフは父[ちち]の手[て]を取[と]って、エフライムの頭[かしら]からマナセの頭[かしら]へ移[うつ]そうとした。"
  18: "ヨセフは父[ちち]に言[い]った。「父[ちち]よ、そうではありません。こちらが長子[ちょうし]です。右手[みぎて]をその頭[かしら]に置[お]いてください。」"
  19: "父[ちち]は承知[しょうち]せず、言[い]った。「知[し]っている、わが子[こ]よ、知[し]っている。彼[かれ]もまた民[たみ]となり、彼[かれ]もまた高[たか]く上[あ]げられる。しかし、弟[おとうと]は彼[かれ]より大[おお]きくなり、その子孫[しそん]は諸国[しょこく]の民[たみ]の群[む]れとなる。」"
  20: "その日[ひ]、彼[かれ]は彼[かれ]らを祝福[しゅくふく]して言[い]った。「イスラエルはあなたがたによって祝福[しゅくふく]して言[い]うであろう。『神[かみ]があなたをエフライムのように、マナセのようにしてくださるように』と。」こうして彼[かれ]はエフライムをマナセより前[まえ]に置[お]いた。"
  21: "イスラエルはヨセフに言[い]った。「見[み]よ、わたしは死[し]ぬ。しかし神[かみ]はあなたがたとともにいて、あなたがたを父[ちち]たちの地[ち]に帰[かえ]らせてくださる。"
  22: "わたしはあなたに、兄弟[きょうだい]たちに勝[まさ]る特別[とくべつ]なもの、シケムを与[あた]える。それはわたしが剣[つるぎ]と弓[ゆみ]をもってアモリ人[じん]の手[て]から取[と]ったものである。」"

notes:
  1: "ἐνοχλεῖται — 病んでいる (ἐνοχλέω «отягощён, болен»; букв. «обеспокоен»). ἀναλαβὼν τοὺς δύο υἱούς — 二人の息子を連れて. ἦλθεν πρὸς Ιακωβ — ヤコブのもとへ来た (в ru этого нет: там стих кончается на «взял с собою»)."
  2: "ἐνισχύσας — 力を振るって (ἐνισχύω «укрепиться»). ἐκάθισεν ἐπὶ τὴν κλίνην — 床の上に座った (κλίνη «ложе»)."
  3: "Ὁ θεός μου ὤφθη μοι — わたしの神は…わたしに現れ (ὤφθη «явился»). ἐν Λουζα — ルズで (слав. «в лузе»)."
  4: "αὐξανῶ σε καὶ πληθυνῶ σε — 増やし、多くし. εἰς συναγωγὰς ἐθνῶν — 諸国の民の集いと (συναγωγή «собрание»). εἰς κατάσχεσιν αἰώνιον — 永遠の所有として."
  5: "ἐμοί εἰσιν — わたしのものである (усыновление: Ефрем и Манасе становятся его сыновьями, ср. 1 Пар 5:1). ὡς Ρουβην καὶ Συμεων — ルベンとシメオンのように."
  6: "τὰ ἔκγονα — 子ら (ἔκγονος «потомок»). ἐπὶ τῷ ὀνόματι τῶν ἀδελφῶν αὐτῶν κληθήσονται — 兄弟たちの名によって呼ばれる. ἐν τοῖς ἐκείνων κλήροις — 彼らの嗣業の中で (κλῆρος «жребий, удел»)."
  7: "ἀπὸ Μεσοποταμίας τῆς Συρίας — メソポタミア（シリア）から. κατὰ τὸν ἱππόδρομον χαβραθα — 地のハブラタの競馬場のあたり (ἱππόδρομος «ристалище»; χαβραθα оставлено транслитерацией; сноска ⟨…⟩ уже стоит при первом упоминании в корпусе, 35:16, поэтому здесь её нет). [αὕτη ἐστὶν Βαιθλεεμ] — これがベツレヘムである (в критическом издании в квадратных скобках, но в gr-lxx-byz есть, поэтому без 〔…〕)."
  8: "Τίνες σοι οὗτοι; — これらは誰か (букв. «кто тебе эти?»)."
  9: "Υἱοί μού εἰσιν, οὓς ἔδωκέν μοι ὁ θεὸς ἐνταῦθα — 神がここでわたしに与えてくださったわたしの息子たち. Προσάγαγέ μοι — わたしのところへ連れて来なさい (προσάγω)."
  10: "ἐβαρυώπησαν ἀπὸ τοῦ γήρως — 老齢のために重くなり (βαρυωπέω «отяжелеть глазами»). ἐφίλησεν… περιέλαβεν — 口づけし、抱いた."
  11: "τοῦ προσώπου σου οὐκ ἐστερήθην — わたしはあなたの顔を見ることを失わなかった (στερέω «лишаться»; слав. «лица твоего не лишихся»; в ru «не надеялся я видеть» — толковательно). ἔδειξέν μοι ὁ θεὸς καὶ τὸ σπέρμα σου — 神はあなたの子孫さえも示された."
  12: "ἀπὸ τῶν γονάτων αὐτοῦ — 父の膝から (γόνατα «колени»; дети сидели на коленях). προσεκύνησαν — 礼拝した (греч. мн. ч.; слав. тоже мн. — переведено по греч., хотя по смыслу кланяется Иосиф)."
  13: "ἐν τῇ δεξιᾷ ἐξ ἀριστερῶν δὲ Ισραηλ — 自分の右手に、イスラエルの左手に対して. ἐν τῇ ἀριστερᾷ ἐκ δεξιῶν — 自分の左手に、イスラエルの右手に対して."
  14: "οὗτος δὲ ἦν ὁ νεώτερος — 彼は弟であった. ἐναλλὰξ τὰς χεῖρας — 手を入れ替えた."
  15: "ᾧ εὐηρέστησαν οἱ πατέρες μου — 父たちがその御前に仕えて喜ばれた (εὐαρεστέω «благоугождать»). ὁ θεὸς ὁ τρέφων με — わたしを養ってくださる神 (τρέφω «питать»)."
  16: "ὁ ἄγγελος ὁ ῥυόμενός με ἐκ πάντων τῶν κακῶν — すべての悪からわたしを贖い出してくださる御使 (ῥύομαι «избавлять»; Ангел Господень, ср. 16:7). ἐπικληθήσεται ἐν αὐτοῖς τὸ ὄνομά μου — わたしの名…が彼らの中に呼ばれ. εἰς πλῆθος πολὺ ἐπὶ τῆς γῆς — 地の上で多い群れと."
  17: "βαρὺ αὐτῷ κατεφάνη — それを重く思った (βαρύς «тяжкий»). ἀντελάβετο τῆς χειρός — 手を取って (ἀντιλαμβάνομαι). ἀφελεῖν… ἐπὶ τὴν κεφαλὴν Μανασση — マナセの頭へ移そうとした."
  18: "Οὐχ οὕτως, πάτερ — 父よ、そうではありません. οὗτος γὰρ ὁ πρωτότοκος — こちらが長子です. ἐπίθες τὴν δεξιάν σου — 右手を置いてください."
  19: "Οἶδα, τέκνον, οἶδα — 知っている、わが子よ、知っている. εἰς λαόν — 民となり. ὑψωθήσεται — 高く上げられる. εἰς πλῆθος ἐθνῶν — 諸国の民の群れと."
  20: "Ἐν ὑμῖν εὐλογηθήσεται Ισραηλ — イスラエルはあなたがたによって祝福して言うであろう. Ποιήσαι σε ὁ θεὸς ὡς Εφραιμ — 神があなたをエフライムのように…してくださるように (оптатив). ἔθηκεν τὸν Εφραιμ ἔμπροσθεν τοῦ Μανασση — エフライムをマナセより前に置いた."
  21: "ἰδοὺ ἐγὼ ἀποθνῄσκω — 見よ、わたしは死ぬ. ἀποστρέψει ὑμᾶς — 帰らせてくださる (ἀποστρέφω)."
  22: "Σικιμα ἐξαίρετον ὑπὲρ τοὺς ἀδελφούς σου — 兄弟たちに勝る特別なもの、シケム (ἐξαίρετος «избранный, особый»; LXX понимает как имя города, евр. — «участок»; в ru «участок»). ἐν μαχαίρᾳ μου καὶ τόξῳ — 剣と弓をもって."
