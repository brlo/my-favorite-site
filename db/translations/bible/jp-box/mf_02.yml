verses:
  1: "ヘロデ王[おう]の治世[ちせい]、イエスはユダヤのベツレヘムでお生[う]まれになった。見[み]よ、占星術[せんせいじゅつ]の学者[がくしゃ]⟨星[ほし]の動[うご]きを読[よ]み、東[ひがし]から来[き]た賢者[けんじゃ]たち。⟩がエルサレムにやって来[き]て、"
  2: "言[い]った。「ユダヤ人[じん]の王[おう]としてお生[う]まれになった方[かた]は、どちらにおられるのでしょうか。わたしたちは東[ひがし]でその方[かた]の星[ほし]を目[め]にしたので、この方[かた]を拝[おが]むために参[まい]りました。」"
  3: "ヘロデ王[おう]はこれを聞[き]いて心[こころ]を騒[さわ]がせ、エルサレムの人々[ひとびと]も皆[みな]、彼[かれ]とともに動揺[どうよう]した。"
  4: "そこで王[おう]は、民[たみ]の祭司長[さいしちょう]たちと律法学者[りっぽうがくしゃ]たちを残[のこ]らず招[まね]き寄[よ]せ、「キリストはどこでお生[う]まれになるのか」と尋[たず]ねた。"
  5: "彼[かれ]らが答[こた]えた。「ユダヤのベツレヘムです。預言者[よげんしゃ]によって、こう記[しる]されています。"
  6: "『ユダの地[ち]、ベツレヘムよ。あなたはユダの支配者[しはいしゃ]たちの間[あいだ]で、決[けっ]して小[ちい]さくはない。あなたから、わたしの民[たみ]イスラエルを牧[ぼく]する者[もの]が現[あらわ]れるからである。』」"
  7: "そこでヘロデは、学者[がくしゃ]たちを人[ひと]目[め]につかないように呼[よ]んで、星[ほし]がいつ現[あらわ]れたのかを詳[くわ]しく問[と]いただした。"
  8: "そして、彼[かれ]らをベツレヘムへ遣[つか]わすとき、言[い]った。「行[い]って、あの子[こ]のことをよく調[しら]べなさい。見[み]つけたら、わたしに知[し]らせてほしい。わたしも行[い]って、その子[こ]を拝[おが]みたいのだ。」"
  9: "王[おう]の言葉[ことば]を聞[き]いて彼[かれ]らが立[た]ち去[さ]ると、見[み]よ、東[ひがし]で見[み]たあの星[ほし]が先[さき]に進[すす]み、ついに幼子[おさなご]のいる所[ところ]の上[うえ]に来[き]て止[と]まった。"
  10: "その星[ほし]を見[み]たとき、彼[かれ]らは非常[ひじょう]に大[おお]きな喜[よろこ]びに包[つつ]まれた。"
  11: "家[いえ]に入[はい]ると、幼子[おさなご]が母[はは]マリアと一緒[いっしょ]にいるのを見[み]た。彼[かれ]らは地[じ]にひれ伏[ふ]してその子[こ]を拝[おが]み、自分[じぶん]たちの宝[たから]の箱[はこ]を開[あ]けて、黄金[おうごん]、乳香[にゅうこう]⟨香[こう]として焚[た]く樹脂[じゅし]。⟩、没薬[もつやく]⟨香料[こうりょう]として用[もち]いる樹脂[じゅし]。⟩を贈[おく]り物[もの]として差[さ]し出[だ]した。"
  12: "そして、ヘロデのもとへ戻[もど]ってはならないと、夢[ゆめ]のうちに告[つ]げられたので、彼[かれ]らは別[べつ]の道[みち]から自分[じぶん]たちの国[くに]へ帰[かえ]って行[い]った。"
  13: "彼[かれ]らが去[さ]ると、見[み]よ、主[しゅ]の天使[てんし]が夢[ゆめ]のうちにヨセフに現[あらわ]れて言[い]った。「立[た]って、幼子[おさなご]とその母[はは]を連[つ]れ、エジプトへ逃[に]げなさい。わたしがあなたに告[つ]げるまで、そこにいなさい。ヘロデがその子[こ]を捜[さが]し出[だ]して殺[ころ]そうとしているからである。」"
  14: "そこでヨセフは立[た]ち、夜[よる]の間[あいだ]に幼子[おさなご]と母[はは]を連[つ]れて、エジプトへ向[む]かった。"
  15: "ヘロデが死[し]ぬまで、ヨセフはそこにいた。それは、主[しゅ]が預言者[よげんしゃ]を通[とお]して語[かた]られた言葉[ことば]が成就[じょうじゅ]するためであった。「わたしは、エジプトからわたしの子[こ]を呼[よ]び出[だ]した。」"
  16: "ヘロデは、自分[じぶん]が学者[がくしゃ]たちに欺[あざむ]かれたと知[し]ると、激[はげ]しく怒[いか]った。そして、人[ひと]を遣[つか]わして、ベツレヘムとその近辺[きんぺん]に住[す]む二歳[にさい]以下[いか]の男[おとこ]の子[こ]を、学者[がくしゃ]たちに問[と]いただしておいた時期[じき]に従[したが]って、残[のこ]らず殺[ころ]した。"
  17: "こうして、預言者[よげんしゃ]エレミヤによって語[かた]られた言葉[ことば]が成就[じょうじゅ]した。"
  18: "「ラマに声[こえ]が響[ひび]いた。泣[な]き声[ごえ]と、激[はげ]しい嘆[なげ]きである。ラケルは子[こ]らを悼[いた]んで泣[な]き、慰[なぐさ]められることを望[のぞ]まない。子[こ]らがもういないからである。」"
  19: "ヘロデが死[し]ぬと、見[み]よ、エジプトにいるヨセフに、主[しゅ]の天使[てんし]が夢[ゆめ]のうちに現[あらわ]れて、"
  20: "言[い]った。「立[た]って、幼子[おさなご]とその母[はは]を連[つ]れ、イスラエルの地[ち]へ行[い]きなさい。幼子[おさなご]の命[いのち]を求[もと]めていた者[もの]たちは、死[し]んだからである。」"
  21: "ヨセフは立[た]って、幼子[おさなご]と母[はは]を連[つ]れ、イスラエルの地[ち]へ戻[もど]った。"
  22: "しかし、アルケラオが父[ちち]ヘロデに代[か]わってユダヤの王[おう]となっていると聞[き]いて、そこへ行[い]くのを恐[おそ]れた。そして、夢[ゆめ]のうちに告[つ]げられたので、ガリラヤ地方[ちほう]へ退[しりぞ]き、"
  23: "ナザレという町[まち]へ行[い]って住[す]んだ。それは、預言者[よげんしゃ]たちを通[とお]して語[かた]られた「彼[かれ]はナザレの人[ひと]と呼[よ]ばれる」という言葉[ことば]が成就[じょうじゅ]するためであった。"

notes:
  1: "μάγοι — «волхвы» в слав., но по смыслу это восточные звездочёты, отсюда 占星術の学者; сноска при первом упоминании в книге. ἰδού — 見よ, как и в ст. 9, 13, 19."
  2: "ἐν τῇ ἀνατολῇ — «на востоке» (возможно и «при восходе»); оставил 東で, не добавляя «страны». εἴδομεν — 目にした, ἤλθομεν — 参りました."
  3: "ἐταράχθη — «смутился, пришёл в смятение», сильнее, чем 不安: 心を騒がせ. καὶ πᾶσα Ἱεροσόλυμα μετ᾽ αὐτοῦ — «и весь Иерусалим с ним»."
  4: "ἐπυνθάνετο — имперфект «расспрашивал»; в греч. косвенный вопрос, в японском передан прямой речью царя (「」), поэтому кавычки в стихе есть, а красного нет."
  5: "γέγραπται — perfect «написано»: 記されています. οὕτως γὰρ γέγραπται διὰ τοῦ προφήτου — «ибо так написано через пророка»."
  6: "Мих 5:2. ἡγεμόσιν Ἰούδα — «правителям / тысячам Иуды»: 支配者たち. ἐκ σοῦ ἐξελεύσεται ἡγούμενος — «из тебя произойдёт Вождь»; поставил 者, чтобы не дублировать 支配者. ποιμανεῖ — «будет пасти»: 牧する者. Стих спорный по разбиению — прошу сверить."
  7: "ἠκρίβωσεν — «точно выведал, выяснил»: 詳しく問いただした. λάθρᾳ — 人目につかないように."
  8: "πέμψας … εἶπεν — «послав, сказал»: 遣わすとき、言った. ὅπως κἀγὼ ἐλθὼν προσκυνήσω — придаточное цели; по-японски цель в прямой речи естественнее передать желанием: 拝みたいのだ. ἐξετάσατε ἀκριβῶς — よく調べなさい."
  9: "προῆγεν — имперфект «шёл впереди»; ἰδού — 見よ; ἕως ἐλθὼν ἐστάθη — ついに…来て止まった."
  10: "ἐχάρησαν χαρὰν μεγάλην σφόδρα — букв. «возрадовались радостью великою зело»: 非常に大きな喜びに包まれた."
  11: "πεσόντες — «падши»: 地にひれ伏して. Сноски на 乳香 и 没薬 — неочевидные для нехристианина реалии, первое упоминание в книге; 黄金 без сноски."
  12: "χρηματισθέντες κατ᾽ ὄναρ — «получив откровение во сне»: 夢のうちに告げられた. ἀνακάμψαι — «возвратиться»: 戻る."
  13: "ἴσθι ἐκεῖ ἕως ἂν εἴπω σοι — «будь там, доколе не скажу тебе»: そこにいなさい. μέλλει γὰρ… τοῦ ἀπολέσαι — 殺そうとしているからである."
  14: "νυκτός — «ночью»: 夜の間に. ἀνεχώρησεν — «удалился»: 向かった."
  15: "Ос 11:1. ἵνα πληρωθῇ — придаточное цели: формула «それは…成就するためであった»; цитата отдельным предложением (как в 13:35). ὑπὸ κυρίου в греч. есть — 主が."
  16: "ἀνεῖλεν — актив «умертвил» (не «велел убить»): 殺した. ἐνεπαίχθη — «был осмеян, обманут»: 欺かれた. κατὰ τὸν χρόνον… в конце, как в греч. ὁρίοις — 近辺."
  17: "τότε ἐπληρώθη — аорист: формула «こうして…成就した», цитата идёт в ст. 18."
  18: "Иер 31:15 (в LXX 38:15). ὀδυρμὸς πολύς — «плач и рыдание великое»; κλαίουσα τὰ τέκνα — 悼んで泣き (плакать по детям); οὐκ ἤθελεν παρακληθῆναι — 慰められることを望まない."
  19: "φαίνεται — исторический презенс «является»; в японском прошедшее время."
  20: "τεθνήκασιν — perfect «умерли»: 死んだ. οἱ ζητοῦντες τὴν ψυχήν — «искавшие души его»: 命を求めていた者たち."
  21: "εἰσῆλθεν εἰς γῆν Ἰσραήλ — «вошёл в землю Израиля»: 戻った."
  22: "βασιλεύει τῆς Ἰουδαίας ἀντὶ τοῦ πατρὸς αὐτοῦ — «царствует в Иудее вместо отца своего»: ユダヤの王となっている. χρηματισθεὶς δὲ κατ᾽ ὄναρ — второе откровение во сне, отсюда 夢のうちに告げられた."
  23: "ὅπως πληρωθῇ — цель, но в греч. нет ὑπὸ κυρίου, поэтому формула без 主. τὸ ῥηθὲν διὰ τῶν προφητῶν — «сказанное через пророков», мн. ч. Ναζωραῖος — «назорей»: ナザレの人 (как в 26:71)."
