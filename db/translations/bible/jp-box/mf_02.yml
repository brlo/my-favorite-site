# jp-box, Евангелие от Матфея, глава 2. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, «ru», jp-joc).
# Греческий сайта (критический) — свидетель; расхождения с ним — в 〔…〕.
# Глава 2: волхвы, бегство в Египет, избиение младенцев, возвращение в Назарет.
# Слов Христа в главе нет (речи ангелов и Ирода — не красные), <j>/<mo> не используются.
# Формулы исполнения пророчеств: ст. 15, 23 — придаточное цели («それは…ためであった»),
# ст. 17 — аорист («こうして…成就した»), цитата идёт в ст. 18.

