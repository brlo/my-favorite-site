verses:
  1: "国々[くにぐに]よ、近[ちか]づけ。そして、君[きみ]たちよ、聞[き]け。地[ち]とそこに住[す]む者[もの]たち、世界[せかい]とその中[なか]の民[たみ]たちも聞け。"
  2: "主[しゅ]の憤[いきどお]りはすべての国々[くにぐに]に、その怒[いか]りは彼[かれ]らの数[かず]のすべてに向[む]かう。彼らを滅[ほろ]ぼし、彼らを屠[ほふ]りに渡[わた]すために。"
  3: "彼[かれ]らの傷[きず]ついた者[もの]たちも、死者[ししゃ]たちも投[な]げ出[だ]され、その悪臭[あくしゅう]は上[のぼ]り、山々[やまやま]は彼らの血[ち]でぬれる。"
  4: "天[てん]の力[ちから]はすべて溶[と]け去[さ]り、天は書物[しょもつ]のように巻[ま]かれ、星[ほし]はすべて、ぶどうの木[き]から落[お]ちる葉[は]のように、いちじくの木から落ちる葉のように落ちる。"
  5: "「わたしの剣[つるぎ]は天[てん]で酔[よ]った。見[み]よ、それはイドマヤに下[くだ]り、滅[ほろ]びの民[たみ]に裁[さば]きをもって下る。"
  6: "主[しゅ]の剣[つるぎ]は血[ち]に満[み]ち、脂[あぶら]で肥[こ]えた——山羊[やぎ]と子羊[こひつじ]の血、山羊と雄羊[おひつじ]の脂で。ボソルに主への犠牲[ぎせい]が、イドマヤに大[おお]きな屠[ほふ]りがあるからである。」"
  7: "彼[かれ]らとともに強[つよ]い者[もの]たちが、雄羊[おひつじ]も若[わか]い牛[うし]も倒[たお]れる。地[ち]は血[ち]に酔[よ]い、彼らの脂[あぶら]で満[み]ちる。"
  8: "主[しゅ]の裁[さば]きの日[ひ]、シオンの裁きの報[むく]いの年[とし]であるからである。"
  9: "その谷[たに]々[たに]は瀝青[れきせい]に変[か]わり、その地[ち]は硫黄[いおう]となる。その地は瀝青のように燃[も]える。"
  10: "昼[ひる]も夜[よる]も、それは永遠[えいえん]の時[とき]まで消[き]えない。その煙[けむり]は上[のぼ]り、代[よ]々[よ]は荒[あ]れ果[は]て、長[なが]い時が続[つづ]く。"
  11: "そこには鳥[とり]、針鼠[はりねずみ]、トキ、烏[からす]が住[す]み着[つ]き、その上[うえ]に荒野[こうや]の測り縄[なわ]が投[な]げかけられ、オノケンタウロスがそこに住む。"
  12: "その君[きみ]たちはもはやいなくなる。その王[おう]たちも、その君たちも、その貴族[きぞく]たちも滅[ほろ]びに帰[き]すからである。"
  13: "その都[みやこ]々[みやこ]には茨[いばら]の木[き]が生[は]え、そのとりでにも生える。そこはセイレーンの住[す]みかとなり、ダチョウの庭[にわ]となる。"
  14: "悪霊[あくりょう]たちはオノケンタウロスと出会[であ]い、互[たが]いに呼[よ]び交[か]わす。そこにオノケンタウロスは憩[いこ]い、自分[じぶん]たちの安[やす]らぎを見[み]いだす。"
  15: "そこに針鼠[はりねずみ]が巣[す]をつくり、地[ち]はその子[こ]らを安全[あんぜん]に保[たも]つ。そこに鹿[しか]たちが出会[であ]い、互[たが]いの顔[かお]を見[み]る。"
  16: "彼[かれ]らは数[かず]を数[かぞ]えて通[とお]り過[す]ぎ、その一[ひと]つも滅[ほろ]びず、互いに求[もと]め合[あ]うこともない。主[しゅ]が彼らに命[めい]じ、その霊[れい]が彼らを集[あつ]めたからである。"
  17: "主[しゅ]ご自身[じしん]が彼[かれ]らに籤[くじ]を投[な]げ、その手[て]が彼らに牧[まき]場[ば]を分[わ]け与[あた]える。あなたがたは永遠[えいえん]の時[とき]までそれを嗣業[しぎょう]とし、彼らは代[よ]々[よ]そこに憩[いこ]う。"

notes:
  1: "Προσαγάγετε, ἔθνη — «приступите, народы» (προσάγω — приводить, приближать); слав. «Приступите, языцы». ἀκούσατε, ἄρχοντες — «услышьте, князья». ἀκουσάτω ἡ γῆ καὶ οἱ ἐν αὐτῇ — «да услышит земля и те, кто в ней» (императив 3 л.). ἡ οἰκουμένη — вселенная, обитаемый мир; ὁ λαὸς ὁ ἐν αὐτῇ — «народ, что в ней»."
  2: "θυμὸς κυρίου ἐπὶ πάντα τὰ ἔθνη — «ярость Господня на все народы» (θυμός — ярость, гнев); ὀργὴ ἐπὶ τὸν ἀριθμὸν αὐτῶν — «гнев на число их», т. е. на всё их множество (ἀριθμός — число); слав. «гнев на число их». τοῦ ἀπολέσαι αὐτοὺς καὶ παραδοῦναι αὐτοὺς εἰς σφαγήν — «чтобы погубить их и предать их на заклание» (σφαγή — заклание, резня). Син. «на все воинство их» — по МТ (צָבָא, «воинство»)."
  3: "οἱ τραυματίαι αὐτῶν ῥιφήσονται — «раненые их будут брошены» (τραυματίας — раненый; ῥίπτω — бросать); καὶ οἱ νεκροί — «и мёртвые [тоже]»; слав. «язвении их повергнутся и мертвецы». ἀναβήσεται αὐτῶν ἡ ὀσμή — «взойдёт смрад их» (ὀσμή — запах); слав. «взыдет их смрад». βραχήσεται τὰ ὄρη ἀπὸ τοῦ αἵματος αὐτῶν — «намокнут горы кровью их» (βρέχω — орошать, мочить); кровь не сглажена."
  4: "ἑλιγήσεται ὁ οὐρανὸς ὡς βιβλίον — «свиется небо, как свиток» (ἑλίσσω — сворачивать; βιβλίον — свиток, книга); слав. «свиется небо аки свиток». πάντα τὰ ἄστρα πεσεῖται ὡς φύλλα ἐξ ἀμπέλου — «все звёзды падут, как листья с лозы»; ὡς πίπτει φύλλα ἀπὸ συκῆς — «как падают листья со смоковницы» (συκῆ — смоковница). Слав. добавляет в начале «и истают вся силы небесныя» — в LXX этого нет, внесено в основной текст без 〔…〕 по паритету."
  5: "ἐμεθύσθη ἡ μάχαιρά μου ἐν τῷ οὐρανῷ — «упился меч Мой на небе» (μεθύσκω — поить допьяна, напитывать); слав. «Упися мечь мой на небеси». Речь Господа от 1 л. — в 「…」; вводной формулы в LXX нет. ἐπὶ τὴν Ιδουμαίαν καταβήσεται — «на Идумею сойдёт» (Ιδουμαία — Идумея; в тексте イドマヤ по корпусу, у Син. «на Едом»); ἐπὶ τὸν λαὸν τῆς ἀπωλείας — «на народ погибели» (род. качества: обречённый на погибель); μετὰ κρίσεως — «с судом»."
  6: "ἡ μάχαιρα κυρίου ἐνεπλήσθη αἵματος — «меч Господень наполнился крови»; ἐπαχύνθη ἀπὸ στέατος — «утучнел от тука» (παχύνω — делать тучным; στέαρ — тук, жир); ἀρνῶν καὶ τράγων καὶ κριῶν — агнцев, козлов и овнов. Слав. повторяет «от крове козлов и агнцев и от тука козлов и овнов» — повтор сохранён (кровь и тук). θυσία κυρίῳ ἐν Βοσορ — «жертва Господу в Восоре» (Βοσορ — Боцра; в тексте ボソル — форма корпуса, ср. 1 Пар 6:78); σφαγὴ μεγάλη ἐν τῇ Ιδουμαίᾳ — «заклание великое в Идумее»."
  7: "συμπεσοῦνται οἱ ἁδροὶ μετ᾿ αὐτῶν — «падут с ними тучные [сильные]» (ἁδρός — тучный, крепкий; συμπίπτω — падать вместе); слав. «падут с ними сильнии». οἱ κριοὶ καὶ οἱ ταῦροι — «овны и быки» (ταῦρος — бык); слав. «овны и юнцы». μεθυσθήσεται ἡ γῆ ἀπὸ τοῦ αἵματος — «упиётся земля кровью»; ἀπὸ τοῦ στέατος αὐτῶν ἐμπλησθήσεται — «и туком их насытится». Речь Господа (кавычки с 34:5) закрылась в конце ст. 6; здесь снова авторский текст."
  8: "ἡμέρα κρίσεως κυρίου — «день суда Господня»; ἐνιαυτὸς ἀνταποδόσεως κρίσεως Σιων — «год воздаяния суда Сиона» (ἀνταπόδοσις — воздаяние); слав. «лето воздаяния суда сионя»; Син. «год возмездия за Сион» (МТ)."
  9: "στραφήσονται αὐτῆς αἱ φάραγγες εἰς πίσσαν — «обратятся ущелья её в смолу» (φάραγξ — ущелье, лощина; πίσσα — смола, пек); καὶ ἡ γῆ αὐτῆς εἰς θεῖον — «и земля её в серу» (θεῖον — сера); ἔσται αὐτῆς ἡ γῆ καιομένη ὡς πίσσα — «будет земля её горящею, как смола». Слав. относит эту последнюю часть к своему 34:10 («и будет земля его горящи яко смола днем и нощию»); деление держим по gr."
  10: "νυκτὸς καὶ ἡμέρας — «ночью и днём»; οὐ σβεσθήσεται εἰς τὸν αἰῶνα χρόνον — «не угаснет в вечное время» (σβέννυμι — гасить). ἀναβήσεται ὁ καπνὸς αὐτῆς ἄνω — «взойдёт дым её вверх»; εἰς γενεὰς ἐρημωθήσεται καὶ εἰς χρόνον πολύν — «в роды опустеет и на время многое»; слав. «в роды своя опустеет», а слова «во время много» (εἰς χρόνον πολύν) переносит в начало своего 34:11 — деление gr иное. Син. добавляет «во веки веков никто не пройдёт по ней» (МТ) — в LXX/слав. этого нет, в текст не внесено."
  11: "ὄρνεα καὶ ἐχῖνοι καὶ ἴβεις καὶ κόρακες — «птицы, и ежи, и ибисы, и вороны» (ἐχῖνος — ёж; ἶβις — ибис; κόραξ — ворон); слав. «птицы и ежеве, совы и вранове» (ἴβεις переданы как «совы» — иная передача, в тексте トキ по LXX). σπαρτίον γεωμετρίας ἐρήμου — «вервь измерения пустыни» (σπαρτίον — верёвка, шнур; γεωμετρία — землемерие); слав. «уже землемерно пустыни». ὀνοκένταυροι — «онокентавры»: LXX передаёт евр. названия пустынных зверей словом «ослокентавр», мифическим существом; слав. «онокентаври», у Син. «пеликан и еж… филин и ворон» (МТ)."
  12: "οἱ ἄρχοντες αὐτῆς οὐκ ἔσονται — «князей её не будет»; οἱ βασιλεῖς αὐτῆς καὶ οἱ ἄρχοντες αὐτῆς καὶ οἱ μεγιστᾶνες αὐτῆς — «цари её, и князья её, и вельможи её» (μεγιστάν — вельможа, знатный); слав. опускает второе «и князья её» («царие бо и вельможи его»), в тексте оно есть по LXX. ἔσονται εἰς ἀπώλειαν — «будут в погибель»."
  13: "ἀναφύσει … ἀκάνθινα ξύλα — «произрастут колючие дерева» (ἀναφύω — произрастать; ἀκάνθινος — терновый); слав. «возникнут… терновая древеса». ὀχυρώματα — твердыни, укрепления; слав. «твердыни». ἔπαυλις σειρήνων — «жилище сирен» (ἔπαυλις — усадьба, жилище; σειρήν — сирена, мифическое существо, которым LXX передаёт евр. «шакалы»; слав. «селения сирином»); αὐλὴ στρουθῶν — «двор струфов», т. е. страусов (στρουθός здесь страус, как в Лев 11:16, где в корпусе ダチョウ; слав. «струфионом»)."
  14: "συναντήσουσιν δαιμόνια ὀνοκενταύροις — «встретятся бесы с онокентаврами» (δαιμόνιον — бес, демон); слав. «срящутся беси со онокентавры». βοήσουσιν ἕτερος πρὸς τὸν ἕτερον — «возопиют один к другому» (ἕτερος — другой). ἐκεῖ ἀναπαύσονται ὀνοκένταυροι — «там почиют онокентавры»; εὗρον γὰρ αὑτοῖς ἀνάπαυσιν — «ибо нашли себе покой»."
  15: "ἐνόσσευσεν ἐχῖνος — «свил гнездо ёж» (νοσσεύω — гнездиться); ἔσωσεν ἡ γῆ τὰ παιδία αὐτῆς μετὰ ἀσφαλείας — «сохранила земля детей его в безопасности» (σῴζω — сохранять; ἀσφάλεια — безопасность). ἔλαφοι συνήντησαν — «олени встретились» (ἔλαφος — олень; слав. «елени»); εἶδον τὰ πρόσωπα ἀλλήλων — «увидели лица друг друга». У Син. по МТ здесь «летучий змей» и «коршуны» — иное чтение."
  16: "ἀριθμῷ παρῆλθον — «числом прошли», т. е. прошли по счёту; καὶ μία αὐτῶν οὐκ ἀπώλετο — «и ни одна из них не погибла» (жен. род: стаи, существа). ἑτέρα τὴν ἑτέραν οὐκ ἐζήτησαν — «другая другую не искала», т. е. не искали друг друга. ὅτι κύριος ἐνετείλατο αὐτοῖς — «ибо Господь заповедал им»; τὸ πνεῦμα αὐτοῦ συνήγαγεν αὐτὰς — «дух Его собрал их». Син. по МТ: «Отыщите в книге Господней и прочитайте…» — в LXX этого нет, в текст не внесено."
  17: "ἐπιβαλεῖ αὐτοῖς κλήρους — «бросит им жребии» (κλῆρος — жребий); слав. «вержет им жребия». ἡ χεὶρ αὐτοῦ διεμέρισεν βόσκεσθαι — «рука Его разделила пастись» (διαμερίζω — разделять; βόσκω — пасти); слав. «раздели пастися». εἰς τὸν αἰῶνα χρόνον κληρονομήσετε — «в вечное время наследуете» (2 л. мн.); εἰς γενεὰς γενεῶν ἀναπαύσονται ἐπ᾿ αὐτῆς — «в роды родов почиют на ней» (3 л. мн.); смена лица в греч. сохранена."
