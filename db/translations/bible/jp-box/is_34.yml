# jp-box, Исаия, глава 34. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для Исаии есть фрагментами (гл. 3, 5–10,
# 13–14, 19, 25–29, 37–38, 40–43, 45, 48–50, 52, 54, 58, 60, 62–66) — главы 34 нет;
# jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 34: 1 призыв к народам слушать; 2–3 гнев Господень на все народы, убитые,
# смрад, горы в крови; 4 свиток неба и падающие звёзды; 5–7 меч Господень на Идумею,
# жертва в Восоре, кровь и тук; 8–10 день суда, смола и сера, негасимый дым;
# 11–15 пустыня и её обитатели (птицы, ежи, ибисы, вороны, онокентавры, сирены);
# 16–17 всё по числу, жребий Господень и вечное наследие.
# Голоса: 1–4 авторский текст; 5–6 речь Господа от 1-го лица («меч Мой») — 「…」
# (вводной формулы в LXX нет; в 6-м стихе о Господе говорится в 3-м лице);
# 7–17 авторский текст.
# Нумерация по gr: 17 стихов; у csl тоже 17, но внутри иначе: слав. относит
# «и будет земля его горящи яко смола» (конец гр. 34:9) к своему 34:10, а слова
# «во время много» (εἰς χρόνον πολύν, конец гр. 34:10) — к началу своего 34:11.
# Держимся деления gr.
# 〔…〕 нет: все стихи есть в gr-lxx-byz. Слав. добавление 34:4 «и истают вся силы
# небесныя» (нет в LXX) внесено в основной текст без скобок по паритету.
# 34:6 кровь и тук не сглажены: повтор слав. («от крове козлов и агнцев и от тука
# козлов и овнов») сохранён.
# Сносок ⟨…⟩ нет: 硫黄, 瀝青, 煙, 洞窟, 嗣業 уже в корпусе; オノケンタウロス,
# セイレーン, トキ объяснены в notes.
# Имена — транслитерация греческого (LXX): イドマヤ (Ιδουμαια; у Син. «Едом»),
# ボソル (Βοσορ; у Син. «Восор», евр. Боцра).

