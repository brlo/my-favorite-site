verses:
  1: "ユディトがイスラエルの神[かみ]に向[む]かって叫[さけ]ぶのをやめ、これらすべての言葉[ことば]を言[い]い終[お]わった。"
  2: "彼女[かのじょ]は伏[ふ]していたところから起[お]き上[あ]がり、女中[じょちゅう]を呼[よ]び、安息日[あんそくび]と自分の祭[まつ]りの日[ひ]に過[す]ごしていた家[いえ]へ下[くだ]って行[い]った。"
  3: "彼女[かのじょ]は着[き]ていた粗布[あらぬの]を取[と]り去[さ]り、やもめの衣[ころも]を脱[ぬ]いで、体[からだ]を水[みず]で洗[あら]い、濃[こ]い香油[こうゆ]を塗[ぬ]り、頭[あたま]の髪[かみ]をとかし、頭[あたま]の飾[かざ]りを載[の]せ、夫[おっと]マナセの生[い]きていた日[ひ]々[び]にまとっていた喜[よろこ]びの衣[ころも]を着[き]た。"
  4: "足[あし]にサンダルを取[と]り、首[くび]の飾[かざ]りと腕輪[うでわ]、指輪[ゆびわ]、耳飾[みみかざ]り、そのすべての飾[かざ]り物[もの]を身[み]に着[つ]け、見[み]るすべての男[おとこ]たちの目[め]を欺[あざむ]くために、ひどく美[うつく]しく装[よそお]った。"
  5: "女中[じょちゅう]に皮袋[かわぶくろ]のぶどう酒[しゅ]と油[あぶら]の壺[つぼ]を与[あた]え、袋[ふくろ]に麦[むぎ]の粉[こな]と干[ほ]し果実[くだもの]と清[きよ]いパンを満[み]たし、そのすべての器[うつわ]を包[つつ]んで女中[じょちゅう]に負[お]わせた。"
  6: "二人[ふたり]はベトリアの町[まち]の門[もん]へ出[で]て行[い]き、そこに立[た]っているオジヤと、町[まち]の長老[ちょうろう]たちハブリスとハルミスを見出[みいだ]した。"
  7: "彼らは彼女[かのじょ]を見[み]た。その顔[かお]は変[か]わり、着物[きもの]も変[か]わっていた。彼らはその美[うつく]しさにひどく驚[おどろ]いて、彼女[かのじょ]に言[い]った。"
  8: "「わたしたちの父[ちち]たちの神[かみ]があなたを{恵[めぐ]み|恩寵[おんちょう]}のうちに入[い]れ、あなたの企[くわだ]てをイスラエルの子[こ]らへの誇[ほこ]りと、エルサレムの高[たか]まりとして完成[かんせい]させてくださるように。」"
  9: "彼女[かのじょ]は神[かみ]を礼拝[れいはい]して彼らに言[い]った。「町[まち]の門[もん]をわたしのために開[あ]くよう命[めい]じてください。わたしは、あなたがたがわたしと語[かた]った言葉[ことば]を成[な]し遂[と]げるために出[で]て行[い]く。」そこで彼らは、彼女[かのじょ]が言[い]ったとおりに開[あ]くよう若者[わかもの]たちに命[めい]じた。"
  10: "彼らはそのとおりにした。ユディトは女中[じょちゅう]とともに出[で]て行[い]った。町[まち]の人[ひと]々[びと]は、彼女[かのじょ]が山[やま]を下[くだ]り、谷[たに]を通[とお]り過[す]ぎて、もはや見[み]えなくなるまで、彼女[かのじょ]を眺[なが]めていた。"
  11: "二人[ふたり]は谷[たに]をまっすぐに進[すす]んだ。そこへ、アッシリア人[じん]の前哨[ぜんしょう]が彼女[かのじょ]に出会[であ]った。"
  12: "彼らは彼女[かのじょ]を捕[つか]まえて尋[たず]ねた。「あなたはだれの者[もの]か、どこから来[き]たのか、どこへ行[い]くのか。」彼女[かのじょ]は言[い]った。「わたしはヘブライ人[じん]の娘[むすめ]である。彼らから逃[に]げて来[き]た。彼らはあなたがたの餌食[えじき]になるために引[ひ]き渡[わた]されるからである。"
  13: "わたしはあなたがたの軍[ぐん]の総大将[そうだいしょう]ホロフェルネスのもとへ行[い]く。真実[しんじつ]の言葉[ことば]を告[つ]げるためである。そして彼の前[まえ]で、彼が進[すす]んで山地[さんち]のすべてを支配[しはい]する道[みち]を示[しめ]す。そうすれば、彼の兵[へい]たちのうち、一[ひと]つの肉[にく]も、いのちの息[いき]も失[うしな]われることはない。」"
  14: "男[おとこ]たちは彼女[かのじょ]の言葉[ことば]を聞[き]き、その顔[かお]をじっと見[み]た。彼女は彼らの前[まえ]で、その美[うつく]しさにおいてひどく驚[おどろ]くべき者[もの]であった。そして彼らは彼女[かのじょ]に言[い]った。"
  15: "「あなたは急[いそ]いでわたしたちの主人[しゅじん]のもとへ下[くだ]って来[き]て、自分[じぶん]の命[いのち]を救[すく]った。さあ、彼の天幕[てんまく]へ近[ちか]づきなさい。わたしたちのうちから、あなたを彼の手[て]に引[ひ]き渡[わた]すまで、送[おく]り届[とど]ける者[もの]が出[で]る。"
  16: "あなたが彼の前[まえ]に立[た]つとき、心[こころ]で恐[おそ]れてはならない。あなたの言葉[ことば]のとおりに告[つ]げなさい。そうすれば、彼はあなたによくしてくれる。」"
  17: "彼らは自分[じぶん]たちのうちから百人[ひゃくにん]の男[おとこ]を選[えら]び、彼女[かのじょ]とその女中[じょちゅう]に添[そ]え、二人[ふたり]をホロフェルネスの天幕[てんまく]へ連[つ]れて行[い]った。"
  18: "陣営[じんえい]のすべてに人[ひと]々[びと]が駆[か]け集[あつ]まった。彼女[かのじょ]の到来[とうらい]が天幕[てんまく]のすべてに知[し]らされたからである。人[ひと]々[びと]は来[き]て、ホロフェルネスの天幕[てんまく]の外[そと]に立[た]っている彼女[かのじょ]を、彼に彼女[かのじょ]のことが告[つ]げられるまで取[と]り囲[かこ]んだ。"
  19: "彼らはその美[うつく]しさに驚[おどろ]き、彼女[かのじょ]のゆえにイスラエルの子[こ]らにも驚[おどろ]いた。そしてそれぞれが隣[となり]の者[もの]に言[い]った。「この民[たみ]をだれが蔑[さげず]むだろうか。この民[たみ]はこのような女[おんな]たちを自分[じぶん]たちのうちに持[も]っているのだ。この者[もの]たちから男[おとこ]を一人[ひとり]も残[のこ]さないのはよくない。残[のこ]された者[もの]たちは全[ぜん]地[ち]をうまく欺[だま]すことができるからである。」"
  20: "ホロフェルネスのそばに寝[ね]ていた者[もの]たちと、そのすべての僕[しもべ]たちが出[で]て来[き]て、彼女[かのじょ]を天幕[てんまく]のうちへ連[つ]れて入[はい]った。"
  21: "ホロフェルネスは、自分[じぶん]の寝台[しんだい]の上[うえ]、紫[むらさき]と金[きん]とエメラルドと貴重[きちょう]な石[いし]を織[お]り込[こ]んだ垂[た]れ幕[まく]のうちで休[やす]んでいた。"
  22: "彼らは彼に彼女[かのじょ]のことを告[つ]げた。彼は天幕[てんまく]の前室[ぜんしつ]へ出[で]て来[き]た。銀[ぎん]の灯火[ともしび]が彼の前[まえ]を進[すす]んだ。"
  23: "ユディトが彼とその僕[しもべ]たちの前[まえ]に来[く]ると、すべての者[もの]が彼女[かのじょ]の顔[かお]の美[うつく]しさに驚[おどろ]いた。彼女[かのじょ]は顔[かお]を地[ち]につけて彼を礼拝[れいはい]した。すると彼の僕[しもべ]たちが彼女[かのじょ]を起[お]こした。"

notes:
  1: "ἐπαύσατο βοῶσα — «перестала вопиять» (παύω, βοάω); συνετέλεσεν πάντα τὰ ῥήματα ταῦτα — «окончила все эти слова» (συντελέω). Стих служит переходом от молитвы гл. 9 к действию; слав. «бусть яко преста…». В греч. текст стиха не закончен и продолжается в ст. 2; по-японски разделено на фразы."
  2: "ἀνέστη ἀπὸ τῆς πτώσεως — «встала от падения» (πτῶσις — падение; она лежала ниц). ἅβρα — 女中 (приближённая служанка; ср. 8:10). κατέβη εἰς τὸν οἶκον — «сошла в дом»: вероятно, с кровли или горницы в жилую часть. ἐν ταῖς ἡμέραις τῶν σαββάτων καὶ ἐν ταῖς ἑορταῖς αὐτῆς — «в дни суббот и праздников своих»: дом, где она проводила субботы и праздники."
  3: "περιείλατο τὸν σάκκον — «сняла с себя вретище» (περιαιρέω; σάκκος — 粗布). ἐξεδύσατο τὰ ἱμάτια τῆς χηρεύσεως — «совлекла одежды вдовства» (χήρευσις — вдовство). περιεκλύσατο τὸ σῶμα ὕδατι — «обмыла тело водою» (περικλύω). ἐχρίσατο μύρῳ παχεῖ — «помазалась густым [драгоценным] миром» (παχύς — тучный, густой; слав. «богатым»; μύρον — 香油). διέξανε τὰς τρίχας — «расчесала волосы» (ξαίνω — чесать). μίτρα — 頭の飾り (повязка на голову). τὰ ἱμάτια τῆς εὐφροσύνης — «одежды веселия» (εὐφροσύνη — радость)."
  4: "σανδάλια — サンダル; χλιδῶνες — роскошные украшения (в тексте 首の飾り; слав. «мониста», ru «цепочки»); ψέλια — 腕輪; δακτύλιοι — 指輪; ἐνώτια — 耳飾り; κόσμος — наряд, украшение. εἰς ἀπάτησιν ὀφθαλμῶν ἀνδρῶν — «на прельщение очей мужей» (ἀπάτησις): цель украшения названа прямо. ὅσοι ἂν ἴδωσιν — «сколько бы ни увидели»."
  5: "ἀσκοπυτίνη οἴνου — «мех вина» (ἀσκοπυτίνη — кожаный мешок для вина), 皮袋のぶどう酒. καψάκη ἐλαίου — «сосуд масла» (καψάκη — небольшой ящичек, фляга), 油の壺. πήρα — 袋 (дорожная сумка). ἄλφιτα — ячменная мука, 麦の粉; παλάθη — плитка сушёных плодов, обычно смокв (干し果実); ἄρτοι καθαροί — чистые хлебы. περιεδίπλωσε πάντα τὰ ἀγγεῖα — «обернула все сосуды» (περιδιπλόω); ἐπέθηκεν αὐτῇ — «возложила на неё», т. е. дала нести."
  6: "ἐξήλθοσαν … εὕροσαν — аористы в двойственном числе (обе женщины). πύλη τῆς πόλεως — городские ворота. ἐφεστῶτα ἐπ᾿ αὐτῇ — «стоящих при них» (ἐφίστημι). Οζιας — オジヤ; Χαβρις καὶ Χαρμις — ハブリス и ハルミス (в тексте винительный Χαβριν καὶ Χαρμιν, как и в 8:10); πρεσβύτεροι τῆς πόλεως — 町の長老たち."
  7: "ἦν ἠλλοιωμένον τὸ πρόσωπον αὐτῆς — «лицо её было изменено» (ἀλλοιόω); τὴν στολὴν μεταβεβληκυῖαν — «одежда переменилась» (μεταβάλλω), винительный в конструкции с εἶδον. ἐθαύμασαν ἐπὶ τῷ κάλλει ἐπὶ πολὺ σφόδρα — «дивились красоте весьма много»: усиление ἐπὶ πολύ + σφόδρα."
  8: "δῴη σε εἰς χάριν — «да даст тебе благодать [благоволение]» (δίδωμι, χάρις); слав. «в благодать». χάρις передан калькой {恵み|恩寵}, как во всём корпусе. τελειώσαι τὰ ἐπιτηδεύματά σου — «да совершит начинания твои» (τελειόω, ἐπιτήδευμα — дело, замысел). εἰς γαυρίαμα υἱῶν Ισραηλ καὶ ὕψωμα Ιερουσαλημ — «в похвалу сынам Израиля и в возвышение Иерусалима» (γαυρίαμα — величие, ὕψωμα — высота). Слав. добавляет в конец «и поклонися Богу» — это начало гр. 10:9, оставлено в ст. 9."
  9: "προσεκύνησεν τῷ θεῷ — «поклонилась Богу» (προσκυνέω); слав. относит к ст. 8. Ἐπιτάξατε ἀνοῖξαί μοι — «повелите отворить мне» (ἐπιτάσσω, ἀνοίγω). εἰς τελείωσιν τῶν λόγων — «для исполнения слов» (τελείωσις). συνέταξαν τοῖς νεανίσκοις — «приказали юношам» (συντάσσω, νεανίσκος); καθότι ἐλάλησεν — «как она сказала»."
  10: "ἀπεσκόπευον — «смотрели вслед, наблюдали» (ἀποσκοπεύω). ἕως οὗ κατέβη τὸ ὄρος — «пока она не сошла с горы» (ὄρος — гора). αὐλών — долина, ущелье (谷). οὐκέτι ἐθεώρουν αὐτήν — «больше не видели её» (θεωρέω). Тире в конце стиха в греческом тексте — знак продолжения."
  11: "ἐπορεύοντο ἐν τῷ αὐλῶνι εἰς εὐθεῖαν — «шли долиною прямо» (εὐθεῖα — прямота, прямая дорога); слав. «идясте юдолию прямо». συνήντησεν αὐτῇ προφυλακὴ τῶν Ἀσσυρίων — «встретила её передовая стража ассирийцев» (προφυλακή — 前哨, сторожевой отряд)."
  12: "συνέλαβον — «схватили» (συλλαμβάνω). Τίνων εἶ καὶ πόθεν ἔρχῃ καὶ ποῦ πορεύῃ — «чья ты, откуда идёшь и куда идёшь»: три вопроса стражей. Θυγάτηρ εἰμὶ τῶν Εβραίων — «я дочь Евреев» (собирательное мн. ч.), ヘブライ人の娘. ἀποδιδράσκω ἀπὸ προσώπου αὐτῶν — «убегаю от лица их» (ἀποδιδράσκω). εἰς κατάβρωμα — «на съедение, в пищу» (κατάβρωμα)."
  13: "εἰς τὸ πρόσωπον Ολοφέρνου — «к лицу Олоферна», т. е. пред него. ἀρχιστράτηγος — 総大将 (главнокомандующий; ср. 2:4). ἀπαγγεῖλαι ῥήματα ἀληθείας — «возвестить слова истины». δείξω … ὁδὸν καθ᾿ ἣν πορεύσεται — «покажу путь, по которому он пойдёт». κυριεύσει πάσης τῆς ὀρεινῆς — «овладеет всею нагорною страною» (κυριεύω, ὀρεινή). οὐ διαφωνήσει … σὰρξ μία οὐδὲ πνεῦμα ζωῆς — «не потерпит урона ни одна плоть, ни дух жизни» (διαφωνέω — расходиться, недоставать; тёмное место, слав. «не погибнет… плоть едина, ниже дух жизни»)."
  14: "κατενόησαν τὸ πρόσωπον αὐτῆς — «всмотрелись в лицо её» (κατανοέω). ἦν ἐναντίον αὐτῶν θαυμάσιον τῷ κάλλει σφόδρα — «была пред ними чудом по красоте весьма» (θαυμάσιος). Тире в греч. тексте — вставная конструкция."
  15: "Σέσωκας τὴν ψυχήν σου — «ты спасла душу [жизнь] свою» (σῴζω). σπεύσασα καταβῆναι — «поспешив сойти» (σπεύδω). εἰς πρόσωπον τοῦ κυρίου ἡμῶν — «к лицу господина нашего». σκηνή — 天幕 (шатёр). ἀφ᾿ ἡμῶν προπέμψουσίν σε — «от нас проводят тебя» (προπέμπω). ἕως παραδώσουσίν σε εἰς χεῖρας αὐτοῦ — «пока не предадут тебя в руки его»."
  16: "ἐὰν στῇς ἐναντίον αὐτοῦ — «если станешь пред ним» (ἵστημι). μὴ φοβηθῇς τῇ καρδίᾳ σου — «не устрашись сердцем твоим» (φοβέομαι с дат.). ἀνάγγειλον κατὰ τὰ ῥήματά σου — «возвести по словам твоим». εὖ σε ποιήσει — «благо тебе сотворит» (εὖ ποιέω)."
  17: "ἐπέλεξαν ἐξ αὐτῶν ἄνδρας ἑκατόν — «избрали из себя сто мужей» (ἐπιλέγω). παρέζευξαν αὐτῇ — «приставили к ней» (παραζεύγνυμι, букв. «запрягли рядом»). ἤγαγον αὐτὰς — «повели их» (двух женщин; род. мн. ж.). σκηνή — 天幕."
  18: "συνδρομὴ ἐν πάσῃ τῇ παρεμβολῇ — «стечение во всём ополчении» (συνδρομή — сбег; παρεμβολή — 陣営). διεβοήθη εἰς τὰ σκηνώματα — «разгласилось по шатрам» (διαβοάω). ἐκύκλουν αὐτήν — «окружали её» (κυκλόω). ὡς εἱστήκει ἔξω τῆς σκηνῆς — «так как она стояла вне шатра»."
  19: "ἐθαύμαζον τοὺς υἱοὺς Ισραηλ ἀπ᾿ αὐτῆς — «дивились сынам Израиля из-за неё»: красота женщины — довод в пользу всего народа. Τίς καταφρονήσει τοῦ λαοῦ τούτου — «кто презрит народ этот» (καταφρονέω). οὐ καλόν ἐστιν ὑπολείπεσθαι ἐξ αὐτῶν ἄνδρα ἕνα — «нехорошо оставить из них ни одного мужа» (ὑπολείπω). κατασοφίσασθαι πᾶσαν τὴν γῆν — «перехитрить всю землю» (κατασοφίζομαι)."
  20: "οἱ παρακαθεύδοντες Ολοφέρνῃ — «спящие при Олоферне» (παρακαθεύδω — лежать рядом, т. е. охрана и прислужники в шатре). θεράποντες — 僕. εἰσήγαγον αὐτὴν εἰς τὴν σκηνήν — «ввели её в шатёр» (εἰσάγω)."
  21: "ἀναπαυόμενος ἐπὶ τῆς κλίνης — «отдыхающий на ложе» (ἀναπαύω, κλίνη). κωνώπιον — 垂れ幕 (по csl «завеса»; собственно полог от комаров, здесь занавес у ложа). ἐκ πορφύρας καὶ χρυσίου καὶ σμαράγδου καὶ λίθων πολυτελῶν — «из порфиры, золота, смарагда и драгоценных камней» (πορφύρα, σμάραγδος — エメラルド). καθυφασμένων — «вотканных» (καθυφαίνω)."
  22: "προσκήνιον — «предсение», передняя часть шатра (前室). λαμπάδες ἀργυραῖ — «лампады серебряные» (λαμπάς — светильник, факел). προάγουσαι αὐτοῦ — «шедшие пред ним» (προάγω)."
  23: "κατὰ πρόσωπον αὐτοῦ — «пред лицо его». ἐθαύμασαν πάντες ἐπὶ τῷ κάλλει τοῦ προσώπου αὐτῆς — «все дивились красоте лица её». πεσοῦσα ἐπὶ πρόσωπον προσεκύνησεν — «пав ниц, поклонилась» (πίπτω, προσκυνέω). ἤγειραν αὐτὴν οἱ δοῦλοι αὐτοῦ — «подняли её рабы его» (ἐγείρω)."
