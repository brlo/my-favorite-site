# jp-box, Иудифь, глава 10. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге нет; jp-ni (под авторским правом) не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 10: Иудифь снимает вретище и вдовьи одежды, умывается, умащается и надевает
# праздничные одежды (2–4); берёт служанку, вино, масло, хлеб (5); выходит к воротам,
# где Озияс и старейшины (6–9); выходит в долину (10); её задерживает стража (11–15);
# её приводят к Олоферну (16–18); хвала её красоте (19–20); Олоферн за завесой (21–23).
# Прямая речь: 8 (старейшины), 9 (Иудифь), 12–13 (Иудифь страже), 15–16 (стража),
# 19 (воины) — 「…」. Красного и синего нет.
# Нумерация по gr: 23 стиха. Слав. относит «и поклонися Богу» (гр. 10:9a) к своему
# ст. 8 — держимся деления gr.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: サンダル, 香油, 皮袋, 天幕, 垂れ幕, 女中 и пр. уже в корпусе;
# 総大将 — термин таблицы брифа (первое место в книге, 10:13).
# Имена — транслитерация греческого (LXX).

