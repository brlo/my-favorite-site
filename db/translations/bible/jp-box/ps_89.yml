# jp-box, Псалтирь, псалом 89. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация церковная (LXX): надписание — стих 0, стихи 1–17 по номерам gr-lxx-byz
# (в LXX ст. 5 и 6 разделены, поэтому строк на одну больше, чем в евр. и у jp-joc).
# Псалом 89 (евр. 90): молитва Моисея — Бог вечен, человек как трава (1–6),
# гнев Божий и краткость жизни (7–12), просьба о милости и о деле рук (13–17).
# Красного и синего нет. Кавычки: слова Бога в 3 — 「…」.
# 〔…〕 нет: все слова в gr-lxx-byz есть.
# セラ в этой главе нет.
# Сносок ⟨…⟩ нет: 逃げ場, 怒り, あわれみ, わざ уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: ps
chapter: 89
draft: true

verses:
  0: "神[かみ]の人[ひと]モーセの祈[いの]り。"
  1: "主[しゅ]よ、あなたは代[よ]々[よ]にわたしたちの逃[に]げ場[ば]となってくださった。"
  2: "山[やま]が生[う]まれ、地[ち]と世界[せかい]が形[かたち]づくられる前[まえ]、とこしえからとこしえまで、あなたはおられる。"
  3: "あなたは人[ひと]を塵[ちり]に帰[かえ]らせ、言[い]われる。「人[ひと]の子[こ]らよ、帰[かえ]れ」と。"
  4: "あなたの目[め]には、千年[せんねん]は過[す]ぎ去[さ]った昨日[きのう]の一日[いちにち]のようであり、夜[よる]の見張[みは]りの一[いっ]刻[こく]のようである。"
  5: "彼[かれ]らの無[む]に帰[き]すことが、彼[かれ]らの年[とし]となる。朝[あさ]には草[くさ]のように過[す]ぎ去[さ]り、"
  6: "朝[あさ]に花[はな]咲[さ]いて過[す]ぎ去[さ]り、夕[ゆう]べにはしおれて落[お]ち、こわばって枯[か]れる。"
  7: "まことに、わたしたちはあなたの怒[いか]りのうちに消[き]え去[さ]り、あなたの憤[いきどお]りのうちに慌[あわ]て惑[まど]う。"
  8: "あなたはわたしたちの不法[ふほう]をあなたの前[まえ]に置[お]き、わたしたちの隠[かく]れたことを、あなたの顔[かお]の光[ひかり]の前[まえ]に置[お]かれた。"
  9: "わたしたちの日[ひ]はすべて消[き]え去[さ]り、あなたの怒[いか]りのうちにわたしたちは消[き]え去[さ]った。わたしたちの年[とし]は、蜘蛛[くも]の巣[す]のように思[おも]い巡[めぐ]らされる。"
  10: "わたしたちの年[とし]の日[ひ]々[び]は、そのうちで七十[ななじゅう]年[ねん]、力[ちから]ある者[もの]でも八十[はちじゅう]年[ねん]である。その多[おお]くは労苦[ろうく]と苦[くる]しみである。まことに、それは速[すみやか]に過[す]ぎ去[さ]り、わたしたちは飛[と]び去[さ]る。"
  11: "だれがあなたの怒[いか]りの力[ちから]を知[し]るだろうか。だれがあなたへの恐[おそ]れに従[したが]って、あなたの憤[いきどお]りを知[し]るだろうか。"
  12: "あなたの右[みぎ]の手[て]を数[かぞ]えることを、そのように知[し]らせてください。心[こころ]を縛[しば]られた者[もの]たちにも、知恵[ちえ]のうちに示[しめ]してください。"
  13: "主[しゅ]よ、帰[かえ]ってきてください。いつまでこのままなのですか。あなたの僕[しもべ]たちをあわれんでください。"
  14: "朝[あさ]早[はや]く、あなたのあわれみでわたしたちを満[み]たしてください。そうして、わたしたちは日[ひ]々[び]のすべてを喜[よろこ]び、楽[たの]しむ。"
  15: "わたしたちを低[ひく]くされた日[ひ]々[び]に代[か]えて、わたしたちが見[み]た悪[わる]い年[とし]々[とし]に代[か]えて、わたしたちを喜[よろこ]ばせてください。"
  16: "あなたの僕[しもべ]たちとあなたのわざとに目[め]を留[と]め、彼[かれ]らの子[こ]らを導[みちび]いてください。"
  17: "わたしたちの神[かみ]である主[しゅ]の輝[かがや]きが、わたしたちの上[うえ]にありますように。わたしたちの手[て]のわざを、わたしたちのために確[かく]かなものとしてください。"

notes:
  0: "Προσευχὴ τοῦ Μωυσῆ ἀνθρώπου τοῦ θεοῦ — «Молитва Моисея, человека Божия» (προσευχή — 祈り; ἄνθρωπος τοῦ θεοῦ — 神の人). Надписание — стих 0."
  1: "Κύριε, καταφυγὴ ἐγενήθης ἡμῖν — 主よ、あなたは…わたしたちの逃げ場となってくださった (καταφυγή — 逃げ場, как по корпусу). ἐν γενεᾷ καὶ γενεᾷ — 代々に."
  2: "πρὸ τοῦ ὄρη γενηθῆναι — 山が生まれる前 (γίνομαι — «рождаться, возникать»). πλασθῆναι τὴν γῆν καὶ τὴν οἰκουμένην — 地と世界が形づくられる前 (πλάσσω — «лепить, образовывать»; οἰκουμένη — 世界). ἀπὸ τοῦ αἰῶνος ἕως τοῦ αἰῶνος σὺ εἶ — とこしえからとこしえまで、あなたはおられる (σὺ εἶ без сказуемого; jp-joc и слав. добавляют 神/Бог)."
  3: "μὴ ἀποστρέψῃς ἄνθρωπον εἰς ταπείνωσιν — あなたは人を塵に帰らせ (ἀποστρέφω — «возвращать»; ταπείνωσις — «уничижение», слав. «в смирение»; передано 塵 как образ тления, у jp-joc 塵). Греч. μή при сказуемом — особенность LXX, по смыслу и по jp-joc читается утвердительно. καὶ εἶπας Ἐπιστρέψατε, υἱοὶ ἀνθρώπων — 言われる、「人の子らよ、帰れ」と (слова Бога — 「」)."
  4: "χίλια ἔτη ἐν ὀφθαλμοῖς σου ὡς ἡ ἡμέρα ἡ ἐχθές — あなたの目には、千年は過ぎ去った昨日の一日のようであり. φυλακὴ ἐν νυκτί — 夜の見張りの一刻のよう (φυλακή — «стража, ночная смена»)."
  5: "τὰ ἐξουδενώματα αὐτῶν ἔτη ἔσονται — 彼らの無に帰すことが、彼らの年となる (ἐξουδένωμα — «уничижение, ничтожество»; тёмное место, слав. «уничижения их лета будут»; jp-joc сливает 5–6 в «Ты уносишь их, как наводнение; они как сон, как трава»). τὸ πρωῒ ὡσεὶ χλόη παρέλθοι — 朝には草のように過ぎ去り (χλόη — «зелень, трава»)."
  6: "τὸ πρωῒ ἀνθήσαι καὶ παρέλθοι — 朝に花咲いて過ぎ去り (ἀνθέω — «цвести»). τὸ ἑσπέρας ἀποπέσοι — 夕べにはしおれて落ち (ἀποπίπτω — «опадать»). σκληρυνθείη καὶ ξηρανθείη — こわばって枯れる (σκληρύνω — «делаться твёрдым»; ξηραίνω — «иссыхать»; о траве)."
  7: "ἐξελίπομεν ἐν τῇ ὀργῇ σου — わたしたちはあなたの怒りのうちに消え去り (ἐκλείπω — «исчезать»). ἐν τῷ θυμῷ σου ἐταράχθημεν — あなたの憤りのうちに慌て惑う (ταράσσω — «смущать»)."
  8: "ἔθου τὰς ἀνομίας ἡμῶν ἐνώπιόν σου — あなたはわたしたちの不法をあなたの前に置き (ἀνομία — 不法). ὁ αἰὼν ἡμῶν εἰς φωτισμὸν τοῦ προσώπου σου — わたしたちの隠れたことを、あなたの顔の光の前に置かれた (букв. «век наш в просвещение лица Твоего»; в евр. «тайное наше», так и у jp-joc и в Синодальном; передано 隠れたこと)."
  9: "πᾶσαι αἱ ἡμέραι ἡμῶν ἐξέλιπον — わたしたちの日はすべて消え去り. τὰ ἔτη ἡμῶν ὡς ἀράχνην ἐμελέτων — わたしたちの年は蜘蛛の巣のように思い巡らされる (ἀράχνη — «паутина»; μελετάω — «размышлять, заниматься»; тёмное место, у jp-joc «теряем лета наши, как звук»)."
  10: "αἱ ἡμέραι τῶν ἐτῶν ἡμῶν, ἐν αὐτοῖς ἑβδομήκοντα ἔτη — わたしたちの年の日々は、そのうちで七十年 (ἑβδομήκοντα — 七十). ἐὰν δὲ ἐν δυναστείαις, ὀγδοήκοντα ἔτη — 力ある者でも八十年 (δυναστεία — «крепость, сила»). τὸ πλεῖον αὐτῶν κόπος καὶ πόνος — その多くは労苦と苦しみ (κόπος — «труд»; πόνος — «боль, страдание»). ὅτι ἐπῆλθεν πραΰτης ἐφ᾿ ἡμᾶς, καὶ παιδευθησόμεθα — тёмное место; передано по церковному пониманию: 速やかに過ぎ去り、わたしたちは飛び去る (jp-joc, Синодальный; πραΰτης — «кротость»)."
  11: "τίς γινώσκει τὸ κράτος τῆς ὀργῆς σου — だれがあなたの怒りの力を知るだろうか (κράτος — «сила, мощь»). ἀπὸ τοῦ φόβου σου τὸν θυμόν σου — あなたへの恐れに従って、あなたの憤りを (букв. «от страха Твоего ярость Твою»)."
  12: "ἐξαριθμήσασθαι τὴν δεξιάν σου οὕτως γνώρισον — あなたの右の手を数えることを、そのように知らせてください (ἐξαριθμέω — «исчислять»; δεξιά — «правая рука»). τοὺς πεπεδημένους τῇ καρδίᾳ ἐν σοφίᾳ — 心を縛られた者たちにも、知恵のうちに (πεδέω — «связывать»; σοφία — 知恵). Место тёмное; jp-joc и Синодальный читают по евр.: «научи нас счислять дни наши»."
  13: "ἐπίστρεψον, κύριε· ἕως πότε — 主よ、帰ってきてください。いつまでこのままなのですか (ἐπιστρέφω — «возвращаться»). παρακλήθητι ἐπὶ τοῖς δούλοις σου — あなたの僕たちをあわれんでください (παρακαλέω — «умилостивлять, утешать»)."
  14: "ἐνεπλήσθημεν τὸ πρωῒ τοῦ ἐλέους σου — 朝早く、あなたのあわれみでわたしたちを満たしてください (ἐμπίπλημι — «наполнять»; аорист в молитве). ἠγαλλιασάμεθα καὶ εὐφράνθημεν ἐν πάσαις ταῖς ἡμέραις ἡμῶν — 日々のすべてを喜び、楽しむ (ἀγαλλιάομαι, εὐφραίνω — «ликовать, веселиться»)."
  15: "εὐφράνθημεν ἀνθ᾿ ὧν ἡμερῶν ἐταπείνωσας ἡμᾶς — わたしたちを低くされた日々に代えて、わたしたちを喜ばせてください (ἀντί — «вместо»; ταπεινόω — «смирять»). ἐτῶν, ὧν εἴδομεν κακά — わたしたちが見た悪い年々に代えて."
  16: "καὶ ἰδὲ ἐπὶ τοὺς δούλους σου καὶ τὰ ἔργα σου — あなたの僕たちとあなたのわざとに目を留め (ἐφοράω — «призирать, смотреть»). ὁδήγησον τοὺς υἱοὺς αὐτῶν — 彼らの子らを導いてください (ὁδηγέω — «вести»)."
  17: "ἔστω ἡ λαμπρότης κυρίου τοῦ θεοῦ ἡμῶν ἐφ᾿ ἡμᾶς — わたしたちの神である主の輝きが、わたしたちの上にありますように (λαμπρότης — «светлость, сияние»). τὰ ἔργα τῶν χειρῶν ἡμῶν κατεύθυνον ἐφ᾿ ἡμᾶς — わたしたちの手のわざを、わたしたちのために確かなものとしてください (κατευθύνω — «направлять, утверждать»)."
