# jp-box, Осия, глава 2. Черновик для приёмки.
#
# Нумерация — по славяно-синодальной (см. шапку ниже).
#
# --- прежние заметки (нумерация по гр.) ---
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по gr-lxx-byz (= jp-ni): в славяно-синодальной наш 2:1–2 — это 1:10–11,
# а слав. 2:1 = наш 2:3 (сдвиг на два стиха; в notes сверка дана по слав. номерам).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: 1–2 (слав. 1:10–11) умножение как песок морской, возвращение и единый
# глава; 3 имена детей обращены: «народ мой», «помилованная»; 4–15 обвинение матери
# и суд над нею (4–6 спор с матерью, обнажение; 7–10 любовники и хлеб; 11–14 отнятие
# одежд, праздников, виноградников; 15 дни Ваалов; 16–17 пустыня и долина Ахор;
# 18–20 упразднение Ваала, завет с творением; 21–22 обручение навек; 23–25 новый
# завет неба и земли, «помилую Непомилованную»).
# Голоса: 1–25 — одно слово Господа в 「…」 (в 5, 7, 14 — слова матери в 『…』;
# в 16 — имена 『わたしの夫』『バアル』; в 18 и 23 «говорит Господь» внутри речи);
# 3 — повеление детям, внутри того же слова.
# 2:3: Λαός μου / Ἠλεημένη — те же имена, что Ло-Амми и Ло-Рухама (1:9,6), здесь
# даны по смыслу, как в слав. («людие мои», «помилованная»).
# 2:17: LXX «διανοῖξαι σύνεσιν αὐτῆς» — «открыть разумение её» (слав. «отверсти смысл
# ея»), а не «дверь надежды» (ru/МТ); ταπεινωθήσεται — «смирится» (слав.), не «будет петь».
#
