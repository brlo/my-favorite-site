verses:
  1: "あなたがたの兄[あに]には『わたしの民[たみ]』と言[い]い、妹[いもうと]には『あわれまれた者[もの]』と言[い]え。"
  2: "あなたがたの母[はは]と争[あらそ]え、争[あらそ]え。彼女[かのじょ]はわたしの妻[つま]ではなく、わたしは彼女[かのじょ]の夫[おっと]ではない。彼女[かのじょ]の淫行[いんこう]をわたしの前[まえ]から、その姦淫[かんいん]をその乳房[ちぶさ]の間[あいだ]から取[と]り除[のぞ]こう。"
  3: "そうしてわたしは彼女[かのじょ]を裸[はだか]にして、生[う]まれた日[ひ]のようにし、荒野[こうや]のように、水[みず]のない地[ち]のようにして、渇[かわ]きによって殺[ころ]す。"
  4: "また、彼女[かのじょ]の子[こ]どもをあわれまない。淫行[いんこう]の子[こ]どもだからである。"
  5: "彼らの母[はは]は淫行[いんこう]をし、彼らを産[う]んだ者[もの]は恥[は]ずかしめを受[う]けた。彼女[かのじょ]は言[い]った。『わたしは自分[じぶん]の恋人[こいびと]たちの後[あと]を追[お]いかけよう。彼らはわたしにパンと水[みず]、衣服[いふく]と亜麻布[あまぬの]、油[あぶら]と、わたしにふさわしいすべての物[もの]を与[あた]えてくれる』と。"
  6: "それゆえ、見[み]よ、わたしは茨[いばら]で彼女[かのじょ]の道[みち]をふさぎ、その道[みち]々[みち]に壁[かべ]を築[きず]く。彼女[かのじょ]は自分[じぶん]の小径[こみち]を見[み]つけない。"
  7: "彼女[かのじょ]は恋人[こいびと]たちを追[お]いかけても追[お]いつかず、彼らを求[もと]めても見[み]つけない。そして言[い]う。『行[い]って、最初[さいしょ]の夫[おっと]のもとへ帰[かえ]ろう。あのときのほうが、今[いま]より良[よ]かったから』と。"
  8: "しかし、彼女[かのじょ]は知[し]らなかった。わたしが彼女[かのじょ]に穀物[こくもつ]とぶどう酒[しゅ]、油[あぶら]を与[あた]え、銀[ぎん]を多[おお]くしたことを。彼女[かのじょ]はそれでバアルのために銀[ぎん]と金[きん]の像[ぞう]を造[つく]った。"
  9: "それゆえ、わたしは帰[かえ]って、時[とき]が来[く]ればわたしの穀物[こくもつ]を、季節[きせつ]が来[く]ればわたしのぶどう酒[しゅ]を取[と]り戻[もど]し、わたしの衣服[いふく]と亜麻布[あまぬの]を取[と]り上[あ]げて、彼女[かのじょ]の恥[は]ずかしさを覆[おお]わせないようにする。"
  10: "今[いま]、わたしは彼女[かのじょ]の汚[けが]れを恋人[こいびと]たちの前[まえ]にさらす。だれも彼女[かのじょ]をわたしの手[て]から救[すく]い出[だ]せない。"
  11: "わたしは彼女[かのじょ]の喜[よろこ]びをすべて断[た]つ。祭[まつ]りも、新月[しんげつ]も、安息日[あんそくび]も、すべての祝[いわ]いも。"
  12: "わたしは彼女[かのじょ]のぶどうの木[き]といちじくの木[き]を滅[ほろ]ぼす。彼女[かのじょ]は言[い]った。『これらはわたしの恋人[こいびと]たちがわたしに与[あた]えた報[むく]いだ』と。わたしはそれらを林[はやし]にして、野[の]の獣[けもの]、空[そら]の鳥[とり]、地[ち]を這[は]うものが食[く]らうようにする。"
  13: "わたしは彼女[かのじょ]の上[うえ]にバアルの日[ひ]々[び]の罰[ばつ]を下[くだ]す。その日[ひ]々[び]、彼女[かのじょ]はバアルに香[こう]をたき、耳輪[みみわ]と首飾[くびかざ]りを身[み]につけて恋人[こいびと]たちの後[あと]を追[お]いかけ、わたしを忘[わす]れていた、と主[しゅ]は言[い]われる。"
  14: "それゆえ、見[み]よ、わたしは彼女[かのじょ]を誘[さそ]い出[だ]して荒野[こうや]に連[つ]れて行[い]き、彼女[かのじょ]の心[こころ]に語[かた]りかける。"
  15: "そこから彼女[かのじょ]にその持[も]ち物[もの]を与[あた]え、アコルの谷[たに]を、彼女[かのじょ]の悟[さと]りの開[ひら]かれる所[ところ]とする。彼女[かのじょ]はそこで、幼[おさな]かった日[ひ]々[び]、エジプトの地[ち]から上[のぼ]って来[き]た日[ひ]々[び]のように、へりくだる。"
  16: "その日[ひ]、と主[しゅ]は言[い]われる、彼女[かのじょ]はわたしを『わたしの夫[おっと]』と呼[よ]び、もはや『バアル』とは呼[よ]ばない。"
  17: "わたしは彼女[かのじょ]の口[くち]からバアルの名[な]を取[と]り除[のぞ]く。その名[な]はもはや思[おも]い起[おこ]されない。"
  18: "その日[ひ]、わたしは彼らのために野[の]の獣[けもの]、空[そら]の鳥[とり]、地[ち]を這[は]うものと契約[けいやく]を結[むす]び、弓[ゆみ]と剣[つるぎ]と戦[たたか]いをこの地[ち]から砕[くだ]いて、あなたを希望[きぼう]のうちに住[す]まわせる。"
  19: "わたしはあなたを永遠[えいえん]にわたしのものとして婚約[こんやく]する。義[ぎ]と裁[さば]きとあわれみと慈[いつく]しみによって、あなたをわたしのものとして婚約[こんやく]する。"
  20: "真実[しんじつ]によってあなたをわたしのものとして婚約[こんやく]する。あなたは主[しゅ]を知[し]るようになる。"
  21: "その日[ひ]、と主[しゅ]は言[い]われる、わたしは天[てん]に答[こた]え、天[てん]は地[ち]に答[こた]える。"
  22: "地[ち]は穀物[こくもつ]とぶどう酒[しゅ]と油[あぶら]に答[こた]え、それらはイズレエルに答[こた]える。"
  23: "わたしはこの地[ち]に彼女[かのじょ]をわたしのために蒔[ま]き、あわれみを得[え]なかった者[もの]をあわれむ。わたしの民[たみ]でない者[もの]に『あなたはわたしの民[たみ]だ』と言[い]い、その者[もの]は『あなたはわたしの神[かみ]だ』と言[い]う」。"

notes:
  1: "εἴπατε τῷ ἀδελφῷ ὑμῶν Λαός μου — «скажите брату вашему: народ Мой»; τῇ ἀδελφῇ ὑμῶν Ἠλεημένη — «и сестре вашей: Помилованная» (слав. «людие мои», «помилованная»). Обратный поворот имён 1:6,9; поэтому даны по смыслу."
  2: "Κρίθητε πρὸς τὴν μητέρα ὑμῶν — «судитесь с матерью вашей» (κρίνομαι — судиться, тягаться); αὐτὴ οὐ γυνή μου, καὶ ἐγὼ οὐκ ἀνὴρ αὐτῆς — «она не жена Моя, и Я не муж её»; ἐξαρῶ τὴν πορνείαν αὐτῆς ἐκ προσώπου μου — «удалю блуд её от лица Моего»; τὴν μοιχείαν αὐτῆς ἐκ μέσου μαστῶν αὐτῆς — «и прелюбодейство её из среды грудей её»."
  3: "ὅπως ἂν ἐκδύσω αὐτὴν γυμνήν — «чтобы обнажить её нагой»; ἀποκαταστήσω αὐτὴν καθὼς ἡμέρᾳ γενέσεως αὐτῆς — «поставлю её как в день рождения её» (слав. «поставлю ю якоже в день рождения ея»); θήσομαι αὐτὴν ὡς ἔρημον — «сделаю её как пустыню»; τάξω αὐτὴν ὡς γῆν ἄνυδρον — «поставлю её как землю безводную»; ἀποκτενῶ αὐτὴν ἐν δίψει — «убью её жаждой»."
  4: "τὰ τέκνα αὐτῆς οὐ μὴ ἐλεήσω — «детей её не помилую»; ὅτι τέκνα πορνείας ἐστίν — «ибо они дети блуда»."
  5: "ἐξεπόρνευσεν ἡ μήτηρ αὐτῶν — «блудила мать их»; κατῄσχυνεν ἡ τεκοῦσα αὐτά — «посрамила родившая их»; Ἀκολουθήσω ὀπίσω τῶν ἐραστῶν μου — «пойду за любовниками моими» (ἐραστής — любовник); τῶν διδόντων μοι τοὺς ἄρτους μου καὶ τὸ ὕδωρ μου καὶ τὰ ἱμάτιά μου καὶ τὰ ὀθόνιά μου καὶ τὸ ἔλαιόν μου — «дающих мне хлебы мои и воду мою, одежды мои и полотна мои, и елей мой» (ὀθόνη — полотно, тонкая ткань); πάντα ὅσα μοι καθήκει — «всё, что мне подобает»."
  6: "ἰδοὺ ἐγὼ φράσσω τὴν ὁδὸν αὐτῆς ἐν σκόλοψιν — «вот, Я заграждаю путь её тернием» (φράσσω — заграждать; σκόλοψ — терн, кол); ἀνοικοδομήσω τὰς ὁδοὺς αὐτῆς — «застрою (обнесу стеной) пути её» (слав. «возгражду распутия ея»); τὴν τρίβον αὐτῆς οὐ μὴ εὕρῃ — «тропы её не найдёт»."
  7: "καταδιώξεται τοὺς ἐραστὰς αὐτῆς καὶ οὐ μὴ καταλάβῃ — «погонится за любовниками и не настигнет»; ζητήσει αὐτοὺς καὶ οὐ μὴ εὕρῃ — «будет искать их и не найдёт»; Πορεύσομαι καὶ ἐπιστρέψω πρὸς τὸν ἄνδρα μου τὸν πρότερον — «пойду и возвращусь к первому мужу моему»; ὅτι καλῶς μοι ἦν τότε ἢ νῦν — «ибо лучше мне было тогда, нежели теперь»."
  8: "αὐτὴ οὐκ ἔγνω ὅτι ἐγὼ δέδωκα αὐτῇ τὸν σῖτον καὶ τὸν οἶνον καὶ τὸ ἔλαιον — «она не узнала, что Я дал ей хлеб и вино и елей» (σῖτος — хлеб в зерне, 穀物); ἀργύριον ἐπλήθυνα αὐτῇ — «серебра умножил ей»; ἀργυρᾶ καὶ χρυσᾶ ἐποίησεν τῇ Βααλ — «сделала серебряное и золотое Ваалу» (слав. «сребряны и златы сотвори ваалу»)."
  9: "ἐπιστρέψω καὶ κομιοῦμαι τὸν σῖτόν μου καθ᾿ ὥραν αὐτοῦ — «возвращусь и возьму хлеб Мой в своё время» (κομίζω — получать обратно, брать); ἀφελοῦμαι τὰ ἱμάτιά μου καὶ τὰ ὀθόνιά μου — «отниму одежды Мои и полотна Мои»; τοῦ μὴ καλύπτειν τὴν ἀσχημοσύνην αὐτῆς — «чтобы не покрывать срамоты её»."
  10: "νῦν ἀποκαλύψω τὴν ἀκαθαρσίαν αὐτῆς ἐνώπιον τῶν ἐραστῶν αὐτῆς — «ныне открою нечистоту её пред любовниками её»; οὐδεὶς οὐ μὴ ἐξέληται αὐτὴν ἐκ χειρός μου — «никто не исторгнет её из руки Моей» (ἐξαιρέω)."
  11: "ἀποστρέψω πάσας τὰς εὐφροσύνας αὐτῆς — «отвращу все веселья её»; ἑορτὰς αὐτῆς καὶ τὰς νουμηνίας αὐτῆς καὶ τὰ σάββατα αὐτῆς — «праздники её и новомесячия её и субботы её»; πάσας τὰς πανηγύρεις αὐτῆς — «все торжества её» (πανήγυρις — всенародное собрание, празднество)."
  12: "ἀφανιῶ ἄμπελον αὐτῆς καὶ τὰς συκᾶς αὐτῆς — «опустошу виноград её и смоковницы её»; Μισθώματά μου ταῦτά ἐστιν ἃ ἔδωκάν μοι οἱ ἐρασταί μου — «это плата моя, которую дали мне любовники мои» (μίσθωμα — плата, наёмная цена); θήσομαι αὐτὰ εἰς μαρτύριον — «обращу их в свидетельство» (слав. «в свидение»), т.е. в пустошь, знамение; καταφάγεται αὐτὰ τὰ θηρία τοῦ ἀγροῦ — «съедят их звери полевые»."
  13: "ἐκδικήσω ἐπ᾿ αὐτὴν τὰς ἡμέρας τῶν Βααλιμ — «взыщу с неё дни Ваалов»; ἐν αἷς ἐπέθυεν αὐτοῖς — «когда кадила им» (ἐπιθύω — совершать жертву, кадить); περιετίθετο τὰ ἐνώτια αὐτῆς καὶ τὰ καθόρμια αὐτῆς — «надевала серьги свои и ожерелья свои» (καθόρμιον — подвеска, ожерелье); ἐμοῦ δὲ ἐπελάθετο — «а Меня забыла»; λέγει κύριος — «говорит Господь»."
  14: "ἰδοὺ ἐγὼ πλανῶ αὐτὴν — «вот, Я увлеку (совращу) её» (πλανάω — водить, увлекать; слав. «соблажню ю»); τάξω αὐτὴν εἰς ἔρημον — «поставлю её в пустыню»; λαλήσω ἐπὶ τὴν καρδίαν αὐτῆς — «скажу к сердцу её» (слав. «возглаголю в сердце ея»)."
  15: "δώσω αὐτῇ τὰ κτήματα αὐτῆς ἐκεῖθεν — «дам ей владения её оттуда» (κτῆμα — имение, владение); τὴν κοιλάδα Αχωρ διανοῖξαι σύνεσιν αὐτῆς — «долину Ахор, чтобы открыть разумение её» (слав. «поляну ахорову, отверсти смысл ея»); ταπεινωθήσεται ἐκεῖ — «смирится там» (слав.), в ru/МТ «будет петь»; κατὰ τὰς ἡμέρας νηπιότητος αὐτῆς — «как во дни младенчества её»; ἀναβάσεως αὐτῆς ἐκ γῆς Αἰγύπτου — «восхождения её из земли Египетской»."
  16: "ἐν ἐκείνῃ τῇ ἡμέρᾳ, λέγει κύριος, καλέσει με Ὁ ἀνήρ μου — «в тот день, говорит Господь, назовёт Меня: муж мой» (3-е л. ед. ч.: она назовёт); οὐ καλέσει με ἔτι Βααλιμ — «и не назовёт Меня более: Ваали» (βααλιμ — мн. ч. или «Ваали»; в 16 — имя «мой Ваал»). Слова-имена — 『…』."
  17: "ἐξαρῶ τὰ ὀνόματα τῶν Βααλιμ ἐκ στόματος αὐτῆς — «удалю имена Ваалов из уст её»; οὐ μὴ μνησθῶσιν οὐκέτι — «и не вспомнятся более»."
  18: "διαθήσομαι αὐτοῖς ... διαθήκην μετὰ τῶν θηρίων τοῦ ἀγροῦ — «заключу с ними завет со зверями полевыми»; μετὰ τῶν πετεινῶν τοῦ οὐρανοῦ καὶ μετὰ τῶν ἑρπετῶν τῆς γῆς — «и с птицами небесными, и с пресмыкающимися земными»; τόξον καὶ ῥομφαίαν καὶ πόλεμον συντρίψω ἀπὸ τῆς γῆς — «лук и меч и войну сокрушу от земли»; κατοικιῶ σε ἐπ᾿ ἐλπίδι — «поселю тебя с надеждой» (слав. «вселю я со упованием»)."
  19: "μνηστεύσομαί σε ἐμαυτῷ εἰς τὸν αἰῶνα — «обручу тебя Мне навек» (μνηστεύομαι — обручать); ἐν δικαιοσύνῃ καὶ ἐν κρίματι καὶ ἐν ἐλέει καὶ ἐν οἰκτιρμοῖς — «в правде и в суде и в милости и в щедротах» (слав. «в правде и в суде и в милости и в щедротах»)."
  20: "μνηστεύσομαί σε ἐμαυτῷ ἐν πίστει — «обручу тебя Мне в вере (верности)»; ἐπιγνώσῃ τὸν κύριον — «и познаешь Господа»."
  21: "ἐπακούσομαι τῷ οὐρανῷ — «услышу небо» (ἐπακούω — внимать, отвечать); ὁ οὐρανὸς ἐπακούσεται τῇ γῇ — «небо услышит землю». Цепь ответов: небо — земля — хлеб (23–24)."
  22: "ἡ γῆ ἐπακούσεται τὸν σῖτον καὶ τὸν οἶνον καὶ τὸ ἔλαιον — «земля услышит хлеб и вино и елей»; αὐτὰ ἐπακούσεται τῷ Ιεζραελ — «они услышат Изрееля» (слав. «сии послушают иезраеля»). Имя Изреель здесь снова звучит как знак посева (ср. 1:4)."
  23: "σπερῶ αὐτὴν ἐμαυτῷ ἐπὶ τῆς γῆς — «посею её Мне на земле» (σπείρω — сеять; слав. «всею оную себе на земли»); ἐλεήσω τὴν Οὐκ ἠλεημένην — «помилую Непомилованную»; ἐρῶ τῷ Οὐ λαῷ μου Λαός μου εἶ σύ — «скажу не народу Моему: ты народ Мой»; αὐτὸς ἐρεῖ Κύριος ὁ θεός μου εἶ σύ — «он скажет: Господь Бог мой — ты». Здесь слово Господа закрывается."
