# jp-box, 2-я Паралипоменон, глава 23. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc для книги нет,
# jp-ni (под авторским правом) источником не был.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы —
# по греческому.
# Нумерация по gr: 21 стих, совпадает с csl/ru.
# Глава 23: заговор Иодая и клятва сотников (1–3), распределение стражи
# (4–7), сбор левитов (8), оружие Давида (9–10), помазание Иоаса (11),
# Аталия у храма и её смерть (12–15), завет (16), очищение от Ваала (17),
# восстановление богослужения (18–19), воцарение на престоле (20–21).
# Паритет: слав. чтения внесены в основной текст без скобок (1 «в дом
# Господень»); варианты LXX — в notes.
# Речь — 「…」 (3, 4–7, 11, 14), вложенная — 『…』 (14). Красного нет.
# 〔…〕 нет: на месте каждого стиха в gr-lxx-byz есть текст.
# Сносок ⟨…⟩ нет: 神殿, 祭壇, 契約, 王座, 百人隊長 уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
