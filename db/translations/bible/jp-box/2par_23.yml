draft: true

verses:
  1: "七年目[ななねんめ]に、ヨヤダは勇気[ゆうき]を出[だ]し、百人隊長[ひゃくにんたいちょう]たち、すなわちヨラムの子[こ]アザリヤ、ヨハナンの子[こ]イシュマエル、オベデの子[こ]アザリヤ、アダイヤの子[こ]マアセヤ、ゼカリヤの子[こ]エリシャファトを、自分[じぶん]とともに主[しゅ]の家[いえ]へ連[つ]れて来[こ]させた。"
  2: "彼[かれ]らはユダを巡[めぐ]り、ユダのすべての町[まち]からレビ人[びと]たちとイスラエルの氏族[しぞく]の長[おさ]たちを集[あつ]めて、エルサレムへ来[き]た。"
  3: "全会衆[ぜんかいしゅう]は神[かみ]の家[いえ]で王[おう]と契約[けいやく]を結[むす]んだ。ヨヤダは彼[かれ]らに王[おう]の子[こ]を見[み]せて言[い]った。「見[み]よ、王[おう]の子[こ]だ。主[しゅ]がダビデの家[いえ]について語[かた]られたとおり、この者[もの]が王[おう]とならなければならない。」"
  4: "「さあ、あなたがたが行[おこな]うべきことはこれである。祭司[さいし]とレビ人[びと]のうち、安息日[あんそくび]に務[つと]めに入[はい]る者[もの]の三分[さんぶん]の一[いち]は、入口[いりぐち]の門[もん]々[もん]に立[た]ち、"
  5: "三分[さんぶん]の一[いち]は王[おう]の家[いえ]に、三分[さんぶん]の一[いち]は中央[ちゅうおう]の門[もん]に。そして民[たみ]はすべて、主[しゅ]の家[いえ]の庭[にわ]にいなさい。"
  6: "祭司[さいし]とレビ人[びと]、およびレビ人[びと]のうちで務[つと]めをする者[もの]のほかは、だれも主[しゅ]の家[いえ]に入[はい]ってはならない。彼[かれ]らは聖[せい]なる者[もの]だから、入[はい]ることができる。民[たみ]はすべて主[しゅ]の見張[みは]りを守[まも]りなさい。"
  7: "レビ人[びと]たちは王[おう]の周[まわ]りを取[と]り囲[かこ]みなさい。それぞれ武器[ぶき]を手[て]に持[も]って。家[いえ]に入[はい]る者[もの]は殺[ころ]される。あなたがたは王[おう]が出入[でいり]するとき、いつも王[おう]とともにいなさい。」"
  8: "レビ人[びと]たちとユダの人[ひと]々[びと]はすべて、祭司[さいし]ヨヤダの命[めい]じたとおりに行[おこな]った。それぞれが、安息日[あんそくび]に務[つと]めに入[はい]る者[もの]たちを、安息日[あんそくび]に務[つと]めを終[お]えて出[で]る者[もの]たちとともに連[つ]れて来[き]た。ヨヤダが務[つと]めの組[くみ]を解[と]かなかったからである。"
  9: "祭司[さいし]は百人隊長[ひゃくにんたいちょう]たちに、神[かみ]の家[いえ]にあったダビデ王[おう]の剣[つるぎ]、盾[たて]、武具[ぶぐ]を渡[わた]した。"
  10: "彼[かれ]は民[たみ]すべてを、それぞれ武具[ぶぐ]を手[て]にして、神殿[しんでん]の右側[みぎがわ]から祭壇[さいだん]と神殿[しんでん]の左側[ひだりがわ]まで、王[おう]の周[まわ]りに立[た]たせた。"
  11: "彼[かれ]らは王[おう]の子[こ]を連[つ]れ出[だ]し、彼[かれ]に王冠[おうかん]と証[あかし]を授[さず]け、彼[かれ]を王[おう]とした。ヨヤダとその子[こ]らは彼[かれ]に油[あぶら]を注[そそ]いで言[い]った。「王[おう]よ、生[い]きよ。」"
  12: "アタリヤは、民[たみ]が走[はし]り、王[おう]をたたえ、賛美[さんび]する声[こえ]を聞[き]いて、民[たみ]のところへ、主[しゅ]の家[いえ]に入[はい]って来[き]た。"
  13: "彼女[かのじょ]が見[み]ると、王[おう]は自分[じぶん]の定[さだ]めの場所[ばしょ]に立[た]ち、入口[いりぐち]には首長[しゅちょう]たちとラッパが王[おう]のそばにあった。民[たみ]はすべて喜[よろこ]び、ラッパを吹[ふ]き鳴[な]らしていた。歌[うた]い手[て]たちは楽器[がっき]に合わせて歌[うた]い、賛美[さんび]を歌[うた]っていた。アタリヤは自分[じぶん]の衣[ころも]を裂[さ]いて叫[さけ]んだ。「謀反[むほん]だ、謀反[むほん]だ。」"
  14: "祭司[さいし]ヨヤダは出[で]て行[い]き、百人隊長[ひゃくにんたいちょう]たちと軍[ぐん]の長[おさ]たちに命[めい]じて言[い]った。「彼女[かのじょ]を家[いえ]の外[そと]へ連[つ]れ出[だ]せ。彼女[かのじょ]の後[あと]について来[く]る者[もの]は剣[つるぎ]で殺[ころ]せ。」祭司[さいし]が『主[しゅ]の家[いえ]で彼女[かのじょ]を殺[ころ]してはならない』と言[い]ったからである。"
  15: "彼[かれ]らは彼女[かのじょ]をそのまま通[とお]らせ、彼女[かのじょ]は王[おう]の家[いえ]の馬[うま]の門[もん]を通[とお]って行[い]き、そこで殺[ころ]された。"
  16: "ヨヤダは、自分[じぶん]と民[たみ]と王[おう]との間[あいだ]に契約[けいやく]を結[むす]び、彼[かれ]らが主[しゅ]の民[たみ]となるようにした。"
  17: "国[くに]の民[たみ]はすべてバアルの神殿[しんでん]へ行[い]き、それを打[う]ち壊[こわ]し、その祭壇[さいだん]と像[ぞう]を粉々[こなごな]に砕[くだ]き、バアルの祭司[さいし]マタンをその祭壇[さいだん]の前[まえ]で殺[ころ]した。"
  18: "祭司[さいし]ヨヤダは、主[しゅ]の家[いえ]の務[つと]めを祭司[さいし]たちとレビ人[びと]たちの手[て]に委[まか]ね、主[しゅ]の家[いえ]で燔祭[はんさい]をささげるためにダビデが定[さだ]めた祭司[さいし]たちとレビ人[びと]たちの組[くみ]を立[た]て直[なお]した。それはモーセの律法[りっぽう]に書[か]かれているとおり、喜[よろこ]びと歌[うた]をもって、ダビデの定[さだ]めに従[したが]って行[おこな]うためであった。"
  19: "彼[かれ]は主[しゅ]の家[いえ]の門[もん]々[もん]に門番[もんばん]たちを置[お]き、汚[けが]れた者[もの]が何[なに]ひとつ入[はい]って来[こ]ないようにした。"
  20: "彼[かれ]は氏族[しぞく]の長[おさ]たち、力[ちから]ある者[もの]たち、民[たみ]の首長[しゅちょう]たち、および国[くに]の民[たみ]すべてを連[つ]れて、王[おう]を主[しゅ]の家[いえ]から上[のぼ]らせた。彼[かれ]らは内側[うちがわ]の門[もん]を通[とお]って王[おう]の家[いえ]に入[はい]り、王[おう]を王国[おうこく]の王座[おうざ]に座[すわ]らせた。"
  21: "国[くに]の民[たみ]はすべて喜[よろこ]び、町[まち]は静[しず]かになった。人々[ひとびと]はアタリヤを剣[つるぎ]で殺[ころ]した。"

notes:
  1: "ἐκραταίωσεν Ιωδαε — «укрепился Иодай» (слав. «укрепися»; в ru «ободрился»). ἑκατόνταρχοι — сотники (百人隊長). Имена: Αζαριας υἱὸς Ιωραμ — Азария, сын Иерохама (アザリヤ; слав. «иорамля»), Ισμαηλ υἱὸς Ιωαναν — Исмаил, сын Иоханана (イシュマエル, ヨハナン), Αζαριας υἱὸς Ωβηδ — Азария, сын Овида (オベデ), Μαασαιας υἱὸς Αδαια — Маасея, сын Адаии (マアセヤ, アダヤ), Ελισαφαν υἱὸς Ζαχαρια — Елисафан, сын Захарии (エリシャファト). εἰς οἶκον — «в дом»; слав. «в дом Господень» — внесено в текст."
  2: "ἐκύκλωσαν — обошли (κυκλόω). ἄρχοντες πατριῶν — начальники отечеств (氏族の長). ἦλθον εἰς Ιερουσαλημ — пришли в Иерусалим."
  3: "διέθεντο … διαθήκην — заключили завет (διατίθημι). ἐκκλησία — собрание (全会衆). βασιλευσάτω — да царствует (императив 3 л.). ἐπὶ τὸν οἶκον Δαυιδ — «о доме Давида»."
  4: "ὁ λόγος οὗτος — «слово сие», т. е. дело. τὸ τρίτον ἐξ ὑμῶν — треть из вас. εἰσπορευέσθωσαν τὸ σάββατον — «пусть входят в субботу», т. е. в субботнюю смену. πύλαι τῶν εἰσόδων — ворота входов."
  5: "τὸ τρίτον — треть. πύλη ἡ μέση — средние ворота (в ru «ворота Иесод» — по МТ). αὐλαί — дворы (庭)."
  6: "ἐὰν μή — «кроме как». λειτουργοῦντες τῶν Λευιτῶν — служащие из левитов. ἅγιοι — святые. φυλασσέτω φυλακάς — «пусть несут стражи» (внутренний объект)."
  7: "κυκλώσουσιν — окружат. σκεῦος — оружие, доспех. ὁ εἰσπορευόμενος — входящий. ἀποθανεῖται — умрёт. ἔσονται μετὰ τοῦ βασιλέως — «будут с царём» (по смыслу повеление)."
  8: "ἀπ᾽ ἀρχῆς τοῦ σαββάτου ἕως ἐξόδου — «от начала субботы до исхода субботы», т. е. смена. οὐ κατέλυσεν τὰς ἐφημερίας — «не распустил чреды» (καταλύω; ἐφημερία — череда)."
  9: "μάχαιραι — мечи (剣). θυρεοί — щиты (большие, 盾). ὅπλα — оружие, доспехи (武具). В слав. добавлено «сотником по чину поставленным» — в гр этого нет."
  10: "ὠμία — плечо, здесь сторона здания (слав. «страна»). δεξιά… ἀριστερά — правая… левая. ἐπὶ τὸν βασιλέα κύκλῳ — вокруг царя."
  11: "τὸ βασίλειον — царское достоинство, венец (слав. «диадима»; принято 王冠, как 4Цар 11:12). τὰ μαρτύρια — свидетельства, знаки царской власти (слав. «свидения»). ἔχρισαν — помазали (χρίω). Ζήτω — да живёт."
  12: "τῶν τρεχόντων — бегущих (τρέχω). ἐξομολογουμένων — исповедующих, славословящих. αἰνούντων — хвалящих."
  13: "ἐπὶ τῆς στάσεως αὐτοῦ — «на своём стоянии», у своего места (слав. «на степени своем»). ὄργανα — музыкальные инструменты (楽器). ὑμνοῦντες αἶνον — воспевающие хвалу. διέρρηξεν τὴν στολήν — разодрала одежду (στολή). Ἐπιτιθέμενοι ἐπιτίθεσθε — «нападающие нападают» (игра форм); слав. «нападающе нападаете», принято «заговор» (ср. 4Цар 11:14)."
  14: "ἐνετείλατο — повелел. ἀρχηγοί τῆς δυνάμεως — начальники войска. Ἐκβάλετε — выведите (ἐκβάλλω). εἰσέλθατε ὀπίσω αὐτῆς — «войдите за нею» (слав. «изыдите вслед ея»). ἀποθανέτω μαχαίρᾳ — да умрёт мечом."
  15: "ἄνεσις — ослабление, свобода (слав. «ослаба»; в ru «место»). πύλη τῶν ἱππέων — ворота конников. ἐθανάτωσαν — умертвили."
  16: "διέθετο διαθήκην — заключил завет. ἀνὰ μέσον — между. εἶναι λαὸν τῷ κυρίῳ — «быть народом Господу»."
  17: "κατέσπασαν — низвергли (κατασπάω). θυσιαστήρια — жертвенники. εἴδωλα — идолы (偶像). ἐλέπτυναν — истолкли в пыль (λεπτύνω). Ματθαν — Матфан (マタン)."
  18: "ἐνεχείρησεν — поручил (ἐγχειρίζω). ἐφημερίαι — чреды. διέστειλεν — установил (διαστέλλω). ἀνενέγκαι — вознести. ἐν εὐφροσύνῃ — в веселии. διὰ χειρὸς Δαυιδ — «рукою Давида», по установлению Давида."
  19: "πυλωροί — привратники (門番). ἀκάθαρτος — нечистый. εἰς πᾶν πρᾶγμα — «на всякое дело» (слав. «во всяцей вещи»)."
  20: "πατριάρχαι — главы отечеств (氏族の長). δυνατοί — сильные, вельможи. ἀνεβίβασαν — возвели. πύλη ἡ ἐσωτέρα — внутренние ворота. θρόνος τῆς βασιλείας — престол царства (王座)."
  21: "ηὐφράνθη — возвеселился. ἡσύχασεν — успокоился (ἡσυχάζω). ἐθανάτωσαν μαχαίρᾳ — умертвили мечом."
