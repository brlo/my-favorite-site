# jp-box, Деяния апостолов, глава 12. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 12: убиение Иакова и заключение Петра (1–5), освобождение (6–11),
# в доме Марии (12–17), смерть Ирода (18–23), заключение (24–25).
# Красного в главе нет: 12:7–8 — слова ангела (не красным), 12:11 — слова Петра.
# 〔…〕: 12:3 [ἦσαν δὲ ἡμέραι τῶν ἀζύμων] в базе есть — без скобок; 12:25 церковное
# «из Иерусалима в Антиохию» при εἰς Ἰερουσαλήμ в базе — 〔…〕.
# Сноска: 12:3 除酵祭 — первое упоминание в Деяниях.
# jp-ni не использовался.

