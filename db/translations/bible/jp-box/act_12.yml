verses:
  1: "そのころ、ヘロデ王[おう]は教会[きょうかい]の何人[なんにん]かに害[がい]を加[くわ]えようと、手[て]を下[くだ]した。"
  2: "そして、ヨハネの兄弟[きょうだい]ヤコブを剣[つるぎ]で殺[ころ]した。"
  3: "ユダヤ人[じん]たちがこれを喜[よろこ]んでいるのを見[み]て、さらにペトロも捕[と]らえた。時[とき]は除酵祭[じょこうさい]⟨パン種[だね]を入[い]れないパンを食[た]べる、過越祭[すぎこしまつり]に続[つづ]く祭[まつ]り。⟩の期間[きかん]であった。"
  4: "彼[かれ]を捕[と]らえて獄[ごく]に投[とう]じ、四人[よにん]ずつ四組[よっくみ]の兵士[へいし]に守[まも]らせた。過越祭[すぎこしまつり]が終[お]わったら、民[たみ]の前[まえ]に引[ひ]き出[だ]そうと思[おも]ったのである。"
  5: "こうして、ペトロは獄[ごく]に監禁[かんきん]されていた。一方[いっぽう]、教会[きょうかい]は彼[かれ]のために熱心[ねっしん]に神[かみ]に祈[いの]っていた。"
  6: "ヘロデがペトロを引[ひ]き出[だ]そうとしていたその夜[よる]、ペトロは二[ふた]本[ほん]の鎖[くさり]で二人[ふたり]の兵士[へいし]の間[あいだ]につながれたまま眠[ねむ]っていた。番兵[ばんぺい]たちは戸口[とぐち]で獄[ごく]を見張[みは]っていた。"
  7: "すると、見[み]よ、主[しゅ]の天使[てんし]が現[あらわ]れ、光[ひかり]が獄[ごく]の中[なか]を照[て]らした。天使[てんし]はペトロの脇腹[わきばら]をたたいて起[お]こし、「早[はや]く立[た]ちなさい」と言[い]った。すると、鎖[くさり]が彼[かれ]の手[て]から落[お]ちた。"
  8: "天使[てんし]は彼[かれ]に言[い]った。「帯[おび]を締[し]めて、靴[くつ]を履[は]きなさい。」彼[かれ]がそうすると、天使[てんし]は言[い]った。「上着[うわぎ]をまとって、わたしについて来[き]なさい。」"
  9: "ペトロは外[そと]に出[で]て、ついて行[い]った。しかし、天使[てんし]がしてくれていることが本当[ほんとう]だとは分[わ]からず、幻[まぼろし]を見[み]ているのだと思[おも]っていた。"
  10: "彼[かれ]らは第一[だいいち]の見張[みは]り所[しょ]、第二[だいに]の見張[みは]り所[しょ]を通[とお]り過[す]ぎ、町[まち]へ通[つう]じる鉄[てつ]の門[もん]に来[き]た。門[もん]はひとりでに彼[かれ]らのために開[ひら]いた。彼[かれ]らは外[そと]に出[で]て、一[ひと]つの通[とお]りを進[すす]んだ。すると、天使[てんし]はすぐに彼[かれ]から離[はな]れた。"
  11: "そこでペトロは我[われ]に返[かえ]って言[い]った。「今[いま]、わたしは本当[ほんとう]に分[わ]かった。主[しゅ]は天使[てんし]を遣[つか]わして、ヘロデの手[て]から、またユダヤの民[たみ]が待[ま]ち望[のぞ]んでいたすべてのことから、わたしを救[すく]い出[だ]してくださったのだ。」"
  12: "彼[かれ]は思[おも]い巡[めぐ]らしてから、ヨハネ・マルコと呼[よ]ばれる者の母[はは]マリアの家[いえ]へ行[い]った。そこには多[おお]くの人[ひと]が集[あつ]まって祈[いの]っていた。"
  13: "ペトロが門[もん]の戸[と]をたたくと、ロダという名[な]の女中[じょちゅう]が、だれかと応対[おうたい]しようと近[ちか]づいて来[き]た。"
  14: "彼女[かのじょ]はペトロの声[こえ]だと分[わ]かると、喜[よろこ]びのあまり門[もん]を開[ひら]かず、家[いえ]の中[なか]へ駆[か]け込[こ]んで、ペトロが門[もん]の前[まえ]に立[た]っていると告[つ]げた。"
  15: "人々[ひとびと]は彼女[かのじょ]に言[い]った。「あなたはおかしくなったのか。」しかし、彼女[かのじょ]は本当[ほんとう]だと言[い]い張[は]った。人々[ひとびと]は言[い]った。「それは彼[かれ]の天使[てんし]だ。」"
  16: "その間[あいだ]もペトロはたたき続[つづ]けていた。人々[ひとびと]が門[もん]を開[ひら]けると、ペトロの姿[すがた]を見[み]て驚[おどろ]いた。"
  17: "ペトロは手[て]を振[ふ]って静[しず]かにさせ、主[しゅ]がどのように自分[じぶん]を獄[ごく]から連[つ]れ出[だ]したかを話[はな]した。そして、「このことをヤコブと兄弟[きょうだい]たちに伝[つた]えなさい」と言[い]い、外[そと]へ出[で]て、ほかの場所[ばしょ]へ行[い]った。"
  18: "夜[よ]が明[あ]けると、兵士[へいし]たちの間[あいだ]に、ペトロはいったいどうなったのかと、少[すく]なからぬ騒[さわ]ぎが起[お]こった。"
  19: "ヘロデはペトロを捜[さが]したが見[み]つからなかったので、番兵[ばんぺい]たちを取[と]り調[しら]べて、処刑[しょけい]を命[めい]じた。そして、ユダヤを離[はな]れてカイサリアへ下[くだ]り、そこに滞在[たいざい]した。"
  20: "ヘロデはティルスとシドンの人々[ひとびと]に激[はげ]しく怒[いか]っていた。彼[かれ]らは心[こころ]を合[あ]わせてヘロデのもとへ来[き]、王[おう]の寝室[しんしつ]係[がかり]のブラストを取[と]り込[こ]んで、和平[わへい]を求[もと]めた。彼[かれ]らの地方[ちほう]が王[おう]の領地[りょうち]から食糧[しょくりょう]の供給[きょうきゅう]を受[う]けていたからである。"
  21: "定[さだ]められた日[ひ]、ヘロデは王[おう]の衣[ころも]を着[き]、演壇[えんだん]に座[すわ]って、彼[かれ]らに向[む]けて演説[えんぜつ]した。"
  22: "民[たみ]は叫[さけ]んだ。「これは神[かみ]の声[こえ]だ。人[ひと]の声[こえ]ではない。」"
  23: "するとすぐに、主[しゅ]の天使[てんし]が彼[かれ]を打[う]った。神[かみ]に栄光[えいこう]を帰[かえ]さなかったからである。彼[かれ]は虫[むし]に食[く]われて息絶[いきた]えた。"
  24: "しかし、神[かみ]の御言葉[みことば]はますます広[ひろ]がり、増[ふ]えていった。"
  25: "バルナバとサウロは務[つとめ]を果[は]たして〔エルサレムからアンティオキアへ〕帰[かえ]り、ヨハネ・マルコと呼[よ]ばれる者[もの]を連[つ]れて行[い]った。"

notes:
  1: "ἐπέβαλεν… τὰς χεῖρας — «наложил руки», то есть начал действовать; 手を下した. Ἡρῴδης ὁ βασιλεύς — Ирод Агриппа I; ヘロデ王."
  3: "В критической базе [ἦσαν δὲ ἡμέραι τῶν ἀζύμων] в квадратных скобках — есть, 〔…〕 не ставится. 除酵祭 — сноска, первое упоминание в Деяниях."
  4: "τέσσαρσιν τετραδίοις — четыре смены по четыре воина; 四人ずつ四組. πάσχα — 過越祭."
  7: "Слова ангела — не красным. πατάξας τὴν πλευράν — «ударив в бок»; 脇腹をたたいて. ἅλυσεις — 鎖."
  9: "ἔδόκει δὲ ὅραμα βλέπειν — «думал, что видит видение»; 幻を見ているのだと思っていた."
  10: "πύλη σιδηρᾶ — железные ворота; αὐτομάτη — «сама собой»; ひとりでに. ῥύμη — улица; 通り (ср. 9:11)."
  11: "ἐν ἑαυτῷ γενόμενος — «придя в себя»; 我に返って. ἐξείλατό με — «избавил меня»; 救い出してくださった."
  12: "Μᾶρκος — евангелист Марк, ヨハネ・マルコ (ср. 12:25; 15:37)."
  15: "ὁ ἄγγελος αὐτοῦ — «его ангел» (ангел-хранитель); 彼の天使. Не «посланник»: речь о небесном ангеле."
  17: "Ἰάκωβος — Иаков, брат Господень; ヤコブ. κατασείσας τῇ χειρί — «махнув рукой»; 手を振って."
  20: "Βλάστος ὁ ἐπὶ τοῦ κοιτῶνος — постельничий, придворный сановник; 寝室係. θυμομαχῶν — «враждуя»; 激しく怒っていた."
  23: "σκωληκόβρωτος — «изъеденный червями»; 虫に食われて. ἐξέψυξεν — «испустил дух»; 息絶えた."
  25: "В критической базе ὑπέστρεψαν εἰς Ἰερουσαλήμ; церковный текст (Елизаветинская, jp-joc「イエルサリムよりアンティオヒヤに返れり」) читает ἐξ Ἰερουσαλὴμ εἰς Ἀντιόχειαν — 〔エルサレムからアンティオキアへ〕."
