verses:
  1: "この後[のち]、わたしは、もう一人[ひとり]の天使[てんし]が天[てん]から降[お]りて来[く]るのを見[み]た。その天使[てんし]は大[おお]きな権[けん]を持[も]ち、地[ち]はその栄光[えいこう]によって照[て]らされた。"
  2: "その天使[てんし]は力強[ちからづよ]い声[こえ]で叫[さけ]んだ。「大[おお]きなバビロンが倒[たお]れた、倒[たお]れた。悪霊[あくりょう]の住[す]みかとなり、あらゆる汚[けが]れた霊[れい]の巣[す]、あらゆる汚[けが]れた憎[にく]むべき鳥[とり]の巣[す]となった。"
  3: "すべての国民[こくみん]が彼女[かのじょ]の淫行[いんこう]の怒[いか]りの酒[さけ]を飲[の]まされたからである。地[ち]の王[おう]たちは彼女[かのじょ]と淫行[いんこう]を重[かさ]ね、地[ち]の商人[しょうにん]たちは彼女[かのじょ]のぜいたくの甚[はなは]だしさによって富[とみ]を築[きず]いた。」"
  4: "また、わたしは天[てん]からもう一[ひと]つの声[こえ]を聞[き]いた。「わたしの民[たみ]よ、彼女[かのじょ]の中[なか]から出[で]なさい。彼女[かのじょ]の罪[つみ]に関[かか]わり合[あ]いにならず、彼女[かのじょ]の災[わざわ]いを受[う]けないためである。"
  5: "彼女[かのじょ]の罪[つみ]は天[てん]にまで積[つ]み重[かさ]なり、神[かみ]は彼女[かのじょ]の不義[ふぎ]を思[おも]い起[おこ]された。"
  6: "彼女[かのじょ]がしたとおりに、あなたがたも彼女[かのじょ]に報[むく]い、その行[おこな]いに応[おう]じて二倍[にばい]にしなさい。彼女[かのじょ]が注[そそ]いだ杯[さかずき]に、二倍[にばい]のものを彼女[かのじょ]に注[そそ]ぎなさい。"
  7: "彼女[かのじょ]が自分[じぶん]を高[たか]め、ぜいたくを尽[つ]くしたほどに、苦[くる]しみと悲[かな]しみを与[あた]えなさい。彼女[かのじょ]は心[こころ]の内[うち]で『わたしは女王[じょおう]として座[すわ]している。やもめではない。悲[かな]しみを見[み]ることはない』と言[い]っているからである。"
  8: "それゆえ、一日[いちにち]のうちに彼女[かのじょ]の災[わざわ]いが来[く]る。すなわち、死[し]と悲[かな]しみと飢饉[ききん]である。彼女[かのじょ]は火[ひ]で焼[や]かれる。彼女[かのじょ]を裁[さば]く主[しゅ]なる神[かみ]は強[つよ]いからである。」"
  9: "彼女[かのじょ]と淫行[いんこう]を重[かさ]ね、ともにぜいたくを尽[つ]くした地[ち]の王[おう]たちは、彼女[かのじょ]が焼[や]かれる煙[けむり]を見[み]て、彼女[かのじょ]のために泣[な]き、嘆[なげ]く。"
  10: "彼女[かのじょ]の苦[くる]しみを恐[おそ]れて遠[とお]くに立[た]ち、こう言[い]う。「ああ、ああ、大[おお]きな都[みやこ]バビロン、強[つよ]い都[みやこ]よ。一[いち]時間[じかん]のうちにあなたの裁[さば]きが来[き]たからである。」"
  11: "地[ち]の商人[しょうにん]たちも彼女[かのじょ]のために泣[な]き、嘆[なげ]く。もはやだれも彼[かれ]らの積[つ]み荷[に]を買[か]わないからである。"
  12: "その積[つ]み荷[に]は、金[きん]、銀[ぎん]、宝石[ほうせき]、真珠[しんじゅ]、亜麻布[あまぬの]、紫[むらさき]の衣[ころも]、絹[きぬ]、赤[あか]い衣[ころも]、あらゆる香木[こうぼく]、あらゆる象牙[ぞうげ]の器[うつわ]、あらゆる貴[とうと]い木[き]、青銅[せいどう]、鉄[てつ]、大理石[たいりせき]の器[うつわ]、"
  13: "また、シナモン、香料[こうりょう]、香[こう]、香油[こうゆ]、乳香[にゅうこう]、ぶどう酒[しゅ]、油[あぶら]、小麦粉[こむぎこ]、小麦[こむぎ]、家畜[かちく]、羊[ひつじ]、馬[うま]、馬車[ばしゃ]、奴隷[どれい]、そして人[ひと]の命[いのち]である。"
  14: "あなたが心[こころ]から望[のぞ]んでいた果実[かじつ]は、あなたから去[さ]ってしまった。すべてのぜいたくなもの、輝[かがや]くものも、あなたから失[う]せ去[さ]り、もはやだれもそれを見[み]つけることはない。"
  15: "これらの品[しな]によって富[とみ]を築[きず]いた商人[しょうにん]たちは、彼女[かのじょ]の苦[くる]しみを恐[おそ]れて遠[とお]くに立[た]ち、泣[な]き、嘆[なげ]いて、"
  16: "こう言[い]う。「ああ、ああ、亜麻布[あまぬの]と紫[むらさき]の衣[ころも]と赤[あか]い衣[ころも]をまとい、金[きん]と宝石[ほうせき]と真珠[しんじゅ]で飾[かざ]られた大[おお]きな都[みやこ]よ。"
  17: "一[いち]時間[じかん]のうちに、これほどの富[とみ]が荒[あ]れ果[は]てたからである。」また、すべての船長[せんちょう]、すべて舟[ふね]に乗[の]る者[もの]、すべての水夫[すいふ]、すべて海[うみ]で働[はたら]く者[もの]たちは、遠[とお]くに立[た]ち、"
  18: "彼女[かのじょ]が焼[や]かれる煙[けむり]を見[み]て叫[さけ]び、「この大[おお]きな都[みやこ]に似[に]た都[みやこ]が、ほかにあるだろうか」と言[い]った。"
  19: "彼[かれ]らは頭[あたま]に土[つち]をかぶり、泣[な]き、嘆[なげ]き、叫[さけ]んで言[い]った。「ああ、ああ、大[おお]きな都[みやこ]よ。すべて海[うみ]に舟[ふね]を持[も]つ者[もの]たちが、彼女[かのじょ]のぜいたくによって富[とみ]を築[きず]いた都[みやこ]よ。一[いち]時間[じかん]のうちに、彼女[かのじょ]は荒[あ]れ果[は]てた。」"
  20: "天[てん]よ、聖[せい]なる者[もの]たち、使徒[しと]たち、預言者[よげんしゃ]たちよ、彼女[かのじょ]のゆえに喜[よろこ]べ。神[かみ]はあなたがたの裁[さば]きを彼女[かのじょ]の上[うえ]に行[おこな]われたからである。"
  21: "また、一人[ひとり]の強[つよ]い天使[てんし]が、大[おお]きなひきうすのような石[いし]を取[と]り、海[うみ]に投[な]げ入[い]れて言[い]った。「このように、大[おお]きな都[みやこ]バビロンは激[はげ]しく投[な]げ込[こ]まれ、もはや見[み]つけられることはない。"
  22: "琴[こと]を弾[ひ]く者[もの]たち、音楽[おんがく]を奏[かな]でる者[もの]たち、笛[ふえ]を吹[ふ]く者[もの]たち、ラッパを吹[ふ]く者[もの]たちの声[こえ]は、もはやあなたの中[なか]で聞[き]かれることはない。あらゆる技[わざ]の職人[しょくにん]も、もはやあなたの中[なか]で見[み]つけられることはない。ひきうすの音[おと]も、もはやあなたの中[なか]で聞[き]かれることはない。"
  23: "灯火[ともしび]の光[ひかり]は、もはやあなたの中[なか]で照[て]らすことはない。花婿[はなむこ]と花嫁[はなよめ]の声[こえ]も、もはやあなたの中[なか]で聞[き]かれることはない。あなたの商人[しょうにん]たちは地[ち]の大[おお]きな者[もの]たちであり、あなたの魔術[まじゅつ]によってすべての国民[こくみん]が惑[まど]わされたからである。"
  24: "彼女[かのじょ]の中[なか]には、預言者[よげんしゃ]たちと聖[せい]なる者[もの]たちの血[ち]、また地[ち]の上[うえ]で殺[ころ]されたすべての者[もの]の血[ち]が見[み]いだされた。」"

notes:
  1: "ἄγγελον καταβαίνοντα ἐκ τοῦ οὐρανοῦ — 天から降りて来る天使. ἔχοντα ἐξουσίαν μεγάλην — 大きな権を持つ. ἡ γῆ ἐφωτίσθη ἐκ τῆς δόξης αὐτοῦ — 地はその栄光によって照らされた."
  2: "ἐν ἰσχυρᾷ φωνῇ — 力強い声で. Ἔπεσεν, ἔπεσεν Βαβυλὼν ἡ μεγάλη — 倒れた、倒れた、大きなバビロン. κατοικητήριον δαιμονίων — 悪霊の住みか. φυλακὴ παντὸς πνεύματος ἀκαθάρτου — あらゆる汚れた霊の巣. φυλακὴ παντὸς ὀρνέου ἀκαθάρτου καὶ μεμισημένου — あらゆる汚れた、憎むべき鳥の巣."
  3: "ἐκ τοῦ οἴνου τοῦ θυμοῦ τῆς πορνείας αὐτῆς πεπώτικεν πάντα τὰ ἔθνη — すべての国民が彼女の淫行の怒りの酒を飲まされた. οἱ βασιλεῖς τῆς γῆς μετ᾿ αὐτῆς ἐπόρνευσαν — 地の王たちは彼女と淫行を重ね. ἐκ τῆς δυνάμεως τοῦ στρήνους αὐτῆς ἐπλούτησαν — 彼女のぜいたくの甚だしさによって富を築いた."
  4: "ἄλλην φωνὴν ἐκ τοῦ οὐρανοῦ — 天からのもう一つの声; говорящий не отождествлён, поэтому не красное. Ἐξέλθατε, ὁ λαός μου, ἐξ αὐτῆς — わたしの民よ、彼女の中から出なさい. ἵνα μὴ συγκοινωνήσητε ταῖς ἁμαρτίαις αὐτῆς — 彼女の罪に関わり合いにならないため. ἐκ τῶν πληγῶν αὐτῆς ἵνα μὴ λάβητε — 彼女の災いを受けないため."
  5: "ἐκολλήθησαν αὐτῆς αἱ ἁμαρτίαι ἄχρι τοῦ οὐρανοῦ — 彼女の罪は天にまで積み重なった. ἐμνημόνευσεν ὁ θεὸς τὰ ἀδικήματα αὐτῆς — 神は彼女の不義を思い起こされた."
  6: "ἀπόδοτε αὐτῇ ὡς καὶ αὐτὴ ἀπέδωκεν — 彼女がしたとおりに、あなたがたも彼女に与えなさい. διπλώσατε [τὰ] διπλᾶ κατὰ τὰ ἔργα αὐτῆς — その行いに応じて二倍にしなさい; [τὰ] в базе есть. ἐν τῷ ποτηρίῳ ᾧ ἐκέρασεν κεράσατε αὐτῇ διπλοῦν — 彼女が注いだ杯に二倍のものを注ぎなさい."
  7: "ὅσα ἐδόξασεν αὑτὴν καὶ ἐστρηνίασεν — 自分を高め、ぜいたくを尽くしたほど. βασανισμὸν καὶ πένθος — 苦しみと悲しみ. Κάθημαι βασίλισσα, καὶ χήρα οὐκ εἰμί — わたしは女王として座している、やもめではない. πένθος οὐ μὴ ἴδω — 悲しみを見ることはない. Её слова — 『』 внутри речи голоса."
  8: "ἐν μιᾷ ἡμέρᾳ — 一日のうちに. θάνατος καὶ πένθος καὶ λιμός — 死と悲しみと飢饉. ἐν πυρὶ κατακαυθήσεται — 火で焼かれる. ἰσχυρὸς κύριος ὁ θεὸς ὁ κρίνας αὐτήν — 彼女を裁く主なる神は強い."
  9: "οἱ μετ᾿ αὐτῆς πορνεύσαντες καὶ στρηνιάσαντες — 彼女と淫行を重ね、ともにぜいたくを尽くした. ὅταν βλέπωσιν τὸν καπνὸν τῆς πυρώσεως αὐτῆς — 彼女が焼かれる煙を見て. κλαύσουσιν καὶ κόψονται — 泣き、嘆く."
  10: "ἀπὸ μακρόθεν ἑστηκότες διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς — 彼女の苦しみを恐れて遠くに立ち. Οὐαὶ οὐαί — ああ、ああ (горе). ἡ πόλις ἡ μεγάλη, Βαβυλὼν ἡ πόλις ἡ ἰσχυρά — 大きな都バビロン、強い都. μιᾷ ὥρᾳ ἦλθεν ἡ κρίσις σου — 一時間のうちにあなたの裁きが来た. Плач царей — 『』 внутри речи голоса, не красное."
  11: "οἱ ἔμποροι τῆς γῆς — 地の商人たち. τὸν γόμον αὐτῶν οὐδεὶς ἀγοράζει οὐκέτι — もはやだれも彼らの積み荷を買わない."
  12: "γόμον χρυσοῦ καὶ ἀργύρου … — 積み荷の一覧. βύσσινον — 亜麻布. πορφύρα — 紫. σιρικόν — 絹. κόκκινον — 赤. ξύλον θύϊνον — 香木. σκεῦος ἐλεφάντινον — 象牙の器. ξύλον τιμιώτατον — 貴い木. χαλκός, σίδηρος, μάρμαρος — 青銅、鉄、大理石."
  13: "κιννάμωμον, ἄμωμον, θυμιάματα, μύρον, λίβανον — シナモン、香料、香、香油、乳香. σεμίδαλις, σῖτος — 小麦粉、小麦. κτῆνη, πρόβατα — 家畜、羊. ἵπποι, ῥέδαι — 馬、馬車. σώματα — 奴隷 (букв. «тела»); ψυχαὶ ἀνθρώπων — 人の命."
  14: "ἡ ὀπώρα σου τῆς ἐπιθυμίας τῆς ψυχῆς — あなたが心から望んでいた果実 (ὀπώρα — поздний плод). τὰ λιπαρὰ καὶ τὰ λαμπρά — ぜいたくなもの、輝くもの. οὐκέτι οὐ μὴ αὐτὰ εὑρήσουσιν — もはやだれもそれを見つけることはない."
  15: "οἱ ἔμποροι τούτων, οἱ πλουτήσαντες ἀπ᾿ αὐτῆς — これらの品によって彼女から富を得た商人たち. ἀπὸ μακρόθεν στήσονται — 遠くに立つ. κλαίοντες καὶ πενθοῦντες — 泣き、嘆いて."
  16: "ἡ περιβεβλημένη βύσσινον καὶ πορφυροῦν καὶ κόκκινον — 亜麻布と紫の衣と赤い衣をまとった. κεχρυσωμένη [ἐν] χρυσίῳ — 金で飾られた; [ἐν] в базе есть."
  17: "μιᾷ ὥρᾳ ἠρημώθη ὁ τοσοῦτος πλοῦτος — 一時間のうちにこれほどの富が荒れ果てた. πᾶς κυβερνήτης — すべての船長. πᾶς ὁ ἐπὶ τόπον πλέων — すべて舟に乗る者. ναῦται — 水夫. ὅσοι τὴν θάλασσαν ἐργάζονται — 海で働く者たち."
  18: "Τίς ὁμοία τῇ πόλει τῇ μεγάλῃ; — この大きな都に似た都がほかにあるだろうか. Плач — 『』."
  19: "ἔβαλον χοῦν ἐπὶ τὰς κεφαλὰς αὐτῶν — 頭に土をかぶり. ἐν ᾗ ἐπλούτησαν πάντες οἱ ἔχοντες τὰ πλοῖα ἐν τῇ θαλάσσῃ — すべて海に舟を持つ者たちが彼女によって富を得た. ὅτι μιᾷ ὥρᾳ ἠρημώθη — 一時間のうちに荒れ果てた."
  20: "Εὐφραίνου ἐπ᾿ αὐτῇ, οὐρανέ — 天よ、彼女のゆえに喜べ. οἱ ἅγιοι καὶ οἱ ἀπόστολοι καὶ οἱ προφῆται — 聖なる者たち、使徒たち、預言者たち. ἔκρινεν ὁ θεὸς τὸ κρίμα ὑμῶν ἐξ αὐτῆς — 神はあなたがたの裁きを彼女によって行なわれた."
  21: "ἄγγελος ἰσχυρός — 強い天使. λίθον ὡς μύλινον μέγαν — 大きなひきうすのような石. ὁρμήματι βληθήσεται — 激しく投げ込まれる. οὐ μὴ εὑρεθῇ ἔτι — もはや見つけられることはない."
  22: "φωνὴ κιθαρῳδῶν καὶ μουσικῶν καὶ αὐλητῶν καὶ σαλπιστῶν — 琴を弾く者、音楽を奏でる者、笛を吹く者、ラッパを吹く者の声. πᾶς τεχνίτης πάσης τέχνης — あらゆる職人のあらゆる技. φωνὴ μύλου — ひきうすの音."
  23: "φῶς λύχνου — 灯火の光. φωνὴ νυμφίου καὶ νύμφης — 花婿と花嫁の声. οἱ ἔμποροί σου ἦσαν οἱ μεγιστᾶνες τῆς γῆς — あなたの商人たちは地の大きな者たち. ἐν τῇ φαρμακείᾳ σου ἐπλανήθησαν πάντα τὰ ἔθνη — あなたの魔術によってすべての国民が惑わされた."
  24: "αἷμα προφητῶν καὶ ἁγίων εὑρέθη — 預言者たちと聖なる者たちの血が見いだされた. πάντων τῶν ἐσφαγμένων ἐπὶ τῆς γῆς — 地の上で殺されたすべての者の血."
