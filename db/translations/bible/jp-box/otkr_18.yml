# jp-box, Откровение Иоанна, глава 18. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 18: падение Вавилона (1–3); голос с неба «выйди из неё, народ Мой» (4–20);
# камень-жёрнов и окончательное запустение (21–24).
# Красного нет: 18:4–8 — голос с неба, говорящий не отождествлён (отмечено в notes),
# поэтому 「」 без <j>; 18:9–19 — рассказ тайнозрителя, плачи царей и купцов в 「」;
# 18:20 — возглас «радуйся, небо», говорящий не назван, поэтому без кавычек.
# 〔…〕 нет: все слова в gr-lxx-byz есть (проверено по базе; 18:6 [τὰ] в базе есть).
# Сносок ⟨…⟩ нет: 亜麻布, 花婿, 花嫁, ひきうす — обычные слова или уже в корпусе.
# jp-ni не использовался.

