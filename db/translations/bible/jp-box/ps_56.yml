# jp-box, Псалтирь, псалом 56. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный 常体, без 文語.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0.
# Псалом 56: молитва под крылами Божиими (1–3), среди львов (4),
# припев «вознесись, Боже» (5), сеть и ров врагов (6), готовое сердце (7–8),
# хвала среди народов (9–10), припев повторён (11).
# Красного и синего нет. Кавычек нет: припев — молитва, а не чужая речь.
# 〔…〕 нет: все слова в gr-lxx-byz есть (сверено с выгрузкой).
# セラ (διάψαλμα, в 3 и 6) не передаётся — по решению пользователя, как у jp-joc.
# Сносок ⟨…⟩ нет: 翼, 獅子, 網, 穴 уже встречались в корпусе.
# jp-ni не использовался.

