verses:
  0: "指揮者[しきしゃ]に。「滅[ほろ]ぼすな」の調[しら]べで。ダビデの詩[うた]、碑[ひ]文[ぶん]として。サウルから逃[に]げて洞[ほら]に身[み]を隠[かく]したとき。"
  1: "神[かみ]よ、わたしをあわれんでください。わたしをあわれんでください。わたしの魂[たましい]はあなたに寄[よ]り頼[たの]み、わたしはあなたの翼[つばさ]の陰[かげ]に望[のぞ]みを置[お]く。不[ふ]法[ほう]が過[す]ぎ去[さ]るまで。"
  2: "わたしは、いと高[たか]い神[かみ]、わたしに良[よ]いことをしてくださる神[かみ]に呼[よ]ばわる。"
  3: "神[かみ]は天[てん]から遣[つか]わして、わたしを救[すく]われた。わたしを踏[ふ]みにじる者[もの]を、恥[は]じの的[まと]とされた。神[かみ]はその恵[めぐ]みとその真[しん]実[じつ]とを遣[つか]わされた。"
  4: "神[かみ]はわたしの魂[たましい]を獅子[しし]の子[こ]らの中[なか]から救[すく]い出[だ]された。わたしは心[こころ]乱[みだ]れたまま眠[ねむ]った。人[ひと]の子[こ]らよ、その歯[は]は武具[ぶぐ]と矢[や]、その舌[した]は鋭[するど]い剣[つるぎ]である。"
  5: "神[かみ]よ、天[てん]の上[うえ]に上[あ]げられてください。あなたの栄光[えいこう]が全[ぜん]地[ち]の上[うえ]にあるように。"
  6: "彼[かれ]らはわたしの足[あし]に網[あみ]を仕掛[しか]け、わたしの魂[たましい]を押[お]し伏[ふ]せた。わたしの前[まえ]に穴[あな]を掘[ほ]り、自[みずか]らその中[なか]に落[お]ちた。"
  7: "わたしの心[こころ]は備[そな]わった、神[かみ]よ、わたしの心[こころ]は備[そな]わった。わたしは歌[うた]い、ほめたたえる。"
  8: "目[め]を覚[さ]ませ、わたしの栄光[えいこう]。目[め]を覚[さ]ませ、琴[こと]と竪琴[たてごと]。わたしは夜明[よあ]けに目[め]を覚[さ]ます。"
  9: "主[しゅ]よ、わたしは諸国[しょこく]の民[たみ]の間[あいだ]であなたに感謝[かんしゃ]をささげ、もろもろの民[たみ]の間[あいだ]であなたをほめたたえる。"
  10: "あなたの恵[めぐ]みは天[てん]にまで大[おお]きく、あなたの真[しん]実[じつ]は雲[くも]にまで届[とど]くからである。"
  11: "神[かみ]よ、天[てん]の上[うえ]に上[あ]げられてください。あなたの栄光[えいこう]が全[ぜん]地[ち]の上[うえ]にあるように。"

notes:
  0: "Εἰς τὸ τέλος· μὴ διαφθείρῃς· τῷ Δαυιδ εἰς στηλογραφίαν ἐν τῷ αὐτὸν ἀποδιδράσκειν ἀπὸ προσώπου Σαουλ εἰς τὸ σπήλαιον — 指揮者に。「滅ぼすな」の調べで。ダビデの詩、碑文として。サウルから逃げて洞に身を隠したとき. μὴ διαφθείρῃς — название напева (евр. al-tashheth, «не погуби»), оставлено как название, а не как содержание; στηλογραφία — 碑文 (см. Пс 55:0)."
  1: "Ἐλέησόν με… ἐλέησόν με — わたしをあわれんでください、の繰り返し сохранено. ἐπὶ σοὶ πέποιθεν ἡ ψυχή μου — 魂はあなたに寄り頼み (πείθω в perf. — «положиться»). ἐν τῇ σκιᾷ τῶν πτερύγων σου ἐλπιῶ — 翼の陰に望みを置く (σκιά — «тень»). ἕως οὗ παρέλθῃ ἡ ἀνομία — 不法が過ぎ去るまで."
  2: "κεκράξομαι πρὸς τὸν θεὸν τὸν ὕψιστον — いと高い神に呼ばわる (ὕψιστος — «Вышний»). τὸν θεὸν τὸν εὐεργετήσαντά με — わたしに良いことをしてくださる神 (εὐεργετέω — «благодетельствовать»)."
  3: "ἐξαπέστειλεν ἐξ οὐρανοῦ καὶ ἔσωσέν με — 天から遣わして救われた. ἔδωκεν εἰς ὄνειδος τοὺς καταπατοῦντάς με — 踏みにじる者を恥じの的とされた (ὄνειδος — «поношение»). ἐξαπέστειλεν ὁ θεὸς τὸ ἔλεος αὐτοῦ καὶ τὴν ἀλήθειαν αὐτοῦ — 恵みと真実とを遣わされた (повтор ἐξαπέστειλεν сохранён)."
  4: "ἐρρύσατο τὴν ψυχήν μου ἐκ μέσου σκύμνων — 獅子の子らの中から救い出された (σκύμνος — «львёнок»). ἐκοιμήθην τεταραγμένος — 心乱れたまま眠った (слав. «уснух смущен»). οἱ ὀδόντες αὐτῶν ὅπλον καὶ βέλη — その歯は武具と矢 (ὅπλον — «оружие»). ἡ γλῶσσα αὐτῶν μάχαιρα ὀξεῖα — その舌は鋭い剣."
  5: "ὑψώθητι ἐπὶ τοὺς οὐρανούς, ὁ θεός — 神よ、天の上に上げられてください (ὑψόω — «возносить»). ἐπὶ πᾶσαν τὴν γῆν ἡ δόξα σου — 栄光が全地の上にあるように. Припев повторён в ст. 11 дословно."
  6: "παγίδα ἡτοίμασαν τοῖς ποσίν μου — 足に網を仕掛け (παγίς — «ловушка, сеть»). κατέκαμψαν τὴν ψυχήν μου — 魂を押し伏せた (κάμπτω — «сгибать»). ὤρυξαν πρὸ προσώπου μου βόθρον — わたしの前に穴を掘り (βόθρος — «яма»). ἐνέπεσαν εἰς αὐτόν — 自らその中に落ちた."
  7: "ἑτοίμη ἡ καρδία μου… ἑτοίμη ἡ καρδία μου — 心は備わった、の繰り返し сохранено (ἕτοιμος — «готовый»). ᾄσομαι καὶ ψαλῶ — 歌い、ほめたたえる (ᾄδω и ψάλλω — два глагола)."
  8: "ἐξεγέρθητι, ἡ δόξα μου — 目を覚ませ、わたしの栄光 (ἐξεγείρω — «пробуждать»; «слава моя» — о душе/языке). ψαλτήριον καὶ κιθάρα — 琴と竪琴 (ψαλτήριον — 琴, как κιθάρα в корпусе; для различия двух инструментов взято 竪琴). ἐξεγερθήσομαι ὄρθρου — 夜明けに目を覚ます (ὄρθρος — «рассвет»)."
  9: "ἐξομολογήσομαί σοι ἐν λαοῖς, κύριε — 諸国の民の間であなたに感謝をささげ (ἐξομολογέομαι — «исповедовать, благодарить»). ψαλῶ σοι ἐν ἔθνεσιν — もろもろの民の間であなたをほめたたえる (λαοί/ἔθνη — 諸国の民/もろもろの民, различие сохранено)."
  10: "ἐμεγαλύνθη ἕως τῶν οὐρανῶν τὸ ἔλεός σου — 恵みは天にまで大きく (μεγαλύνω — «возвеличить»). ἕως τῶν νεφελῶν ἡ ἀλήθειά σου — 真実は雲にまで届く (νεφέλη — «облако»)."
  11: "Повтор ст. 5 — припев псалма; текст совпадает дословно, как в греч."
