book: prs
chapter: 8
draft: true

verses:
  1: "知恵[ちえ]は端[はし]から端まで力強[ちからづよ]く達[たっ]し、すべてのものを良[よ]く治[おさ]める。"
  2: "わたしはこの知恵[ちえ]を愛[あい]し、若[わか]いときから求[もと]め続[つづ]けた。これを自分[じぶん]の花嫁[はなよめ]として迎[むか]えようと探[さが]し求め、その美[うつく]しさに恋[こい]する者[もの]となった。"
  3: "知恵[ちえ]は神[かみ]とともに住[す]むことによって、その高貴[こうき]さを輝[かがや]かせている。すべてのものの支配者[しはいしゃ]である方[かた]も知恵を愛[あい]された。"
  4: "知恵[ちえ]は神[かみ]の知識[ちしき]の秘[ひ]を預[あずか]る者[もの]であり、神のわざを選[えら]び取[と]る者である。"
  5: "もし富[とみ]が人生[じんせい]において望[のぞ]ましい財産[ざいさん]であるなら、すべてのものを造[つく]り出[だ]す知恵[ちえ]よりも豊[ゆた]かなものがあるだろうか。"
  6: "もし悟[さと]りが働[はたら]くのであれば、存在[そんざい]するものの作り手[つくりて]として、知恵[ちえ]より優[すぐ]れた者[もの]がだれかいるだろうか。"
  7: "また、もしだれかが正義[せいぎ]を愛[あい]するなら、知恵[ちえ]の労苦[ろうく]は徳[とく]である。知恵は節制[せっせい]と悟[さと]り、正義[せいぎ]と勇気[ゆうき]を教[おし]える。人生[じんせい]において、これらよりも人[ひと]に役立[やくだ]つものはない。"
  8: "また、もしだれかが多[おお]くの経験[けいけん]を望[のぞ]むなら、知恵[ちえ]は昔[むかし]のことを知[し]り、これから起[お]こることを推[おし]し量[はか]る。言葉[ことば]の巡[めぐ]らし方[かた]と謎[なぞ]の解[と]き方をわきまえ、しるしと不思議[ふしぎ]を前[まえ]もって知[し]り、時[とき]と年[とし]の巡[めぐ]りの行方[ゆくえ]を見[み]通[とお]す。"
  9: "それゆえ、わたしは知恵[ちえ]を自分[じぶん]の伴侶[はんりょ]として迎[むか]えることに決[き]めた。知恵がわたしにとって、善[よ]いことの相談相手[そうだんあいて]となり、心配[しんぱい]や悲[かな]しみの慰[なぐさ]めとなると知[し]っていたからである。"
  10: "知恵[ちえ]のゆえに、わたしは若[わか]い者[もの]ながら、群[む]れの中[なか]で名誉[めいよ]を得[え]、年長者[ねんちょうしゃ]たちの前[まえ]で尊敬[そんけい]を受[う]ける。"
  11: "裁[さば]きにおいては鋭[するど]い者[もの]と見[み]られ、強[つよ]い者たちの前[まえ]では驚嘆[きょうたん]される。"
  12: "わたしが黙[だま]っていると、彼[かれ]らはわたしを待[ま]ち、わたしが語[かた]り出[だ]すと耳[みみ]を傾[かたむ]ける。わたしがさらに語り続けると、彼らは口[くち]に手[て]を当[あ]てる。"
  13: "知恵[ちえ]のゆえに、わたしは不死[ふし]を得[え]、わたしの後[あと]に来[く]る者[もの]たちに永遠[えいえん]の記憶[きおく]を残[のこ]す。"
  14: "わたしはもろもろの民[たみ]を治[おさ]め、国々[くにぐに]の民[たみ]はわたしに服[ふく]する。"
  15: "恐[おそ]ろしい暴君[ぼうくん]たちも、わたしのことを聞[き]いて恐[おそ]れる。多[おお]くの者[もの]の間[あいだ]では善[ぜん]い者として現[あらわ]れ、戦[いくさ]では勇敢[ゆうかん]な者として現れる。"
  16: "わたしは家[いえ]に入[はい]ると、知恵[ちえ]とともに休[やす]む。知恵との交[まじ]わりには苦[にが]さがなく、知恵とともに住[す]むことに痛[いた]みはなく、喜[よろこ]びと楽[たの]しみがあるからである。"
  17: "わたしはこれらのことを自分[じぶん]のうちで思[おも]いめぐらし、知恵[ちえ]と縁[えん]を結[むす]ぶことのうちに不死[ふし]があること、"
  18: "知恵[ちえ]との友情[ゆうじょう]には良[よ]い楽[たの]しみがあり、知恵の手[て]の労苦[ろうく]には尽[つ]きない富[とみ]があり、知恵との語[かた]らいの鍛錬[たんれん]のうちに悟[さと]りがあり、知恵の言葉[ことば]を分[わ]かち合[あ]うことに良[よ]い評判[ひょうばん]があることを、心[こころ]に思[おも]い、わたしはどうにかして知恵を自分[じぶん]のものにしようと、歩[ある]き回[まわ]った。"
  19: "わたしは素質[そしつ]に恵[めぐ]まれた子[こ]どもであり、良[よ]い魂[たましい]を受[う]け取[と]った。"
  20: "むしろ、善[よ]い者[もの]であったわたしは、汚[けが]れのない体[からだ]に入[はい]った。"
  21: "しかし、神[かみ]が与[あた]えない限[かぎ]り、自分[じぶん]はほかの仕方[しかた]では知恵[ちえ]を手[て]に入[い]れられないこと、また、恵[めぐ]みがだれのものかを知[し]ることも悟[さと]りのわざであることを知[し]って、わたしは主[しゅ]のもとへ行[ゆ]き、主に願[ねが]い、心[こころ]を尽[つ]くして言[い]った。"

notes:
  1: "διατείνει ... ἀπὸ πέρατος ἐπὶ πέρας εὐρώστως — «простирается от конца до конца мощно» (εὐρώστως — крепко, сильно; слав. «крепко»). διοικεῖ τὰ πάντα χρηστῶς — «управляет всем хорошо» (χρηστῶς — благо, полезно; слав. «благо»)."
  2: "Ταύτην ἐφίλησα — «её я возлюбил»; ἐκ νεότητός μου — «от юности моей» (слав. «от юности моея»). νύμφην ἀγαγέσθαι ἐμαυτῷ — «привести себе в невесту» (ἄγω — вести, брать в жёны; слав. «невесту привести себе»). ἐραστὴς τοῦ κάλλους αὐτῆς — «любитель красоты её» (ἐραστής — влюблённый; слав. «любитель»)."
  3: "εὐγένειαν δοξάζει — «благородство прославляет» (εὐγένεια — знатность, благородство; слав. «благородство славит»); συμβίωσιν θεοῦ ἔχουσα — «имея сожитие с Богом» (συμβίωσις — совместная жизнь; слав. «сожитие»). ὁ πάντων δεσπότης — «Владыка всех» (δεσπότης — господин, владыка)."
  4: "μύστις ... τῆς τοῦ θεοῦ ἐπιστήμης — «посвящённая в знание Божие» (μύστις — участница таинств, хранительница тайн; слав. «таибница»); ἐπιστήμη — знание. αἱρετὶς τῶν ἔργων αὐτοῦ — «избирательница дел Его» (αἱρετίς — та, что выбирает; слав. «обретателница»)."
  5: "εἰ ... πλοῦτός ἐστιν ἐπιθυμητὸν κτῆμα ἐν βίῳ — «если богатство есть вожделенное приобретение в жизни» (κτῆμα — имущество; слав. «притяжание»). τί σοφίας πλουσιώτερον τῆς τὰ πάντα ἐργαζομένης — «что богаче премудрости, всё делающей?»; слав. «еюже делаются вся» — «которой всё делается», страдательный оборот; в тексте по LXX — действительный."
  6: "εἰ δὲ φρόνησις ἐργάζεται — «если разумение действует» (φρόνησις; слав. «разум»). τίς αὐτῆς τῶν ὄντων μᾶλλόν ἐστιν τεχνῖτις — «кто более её художник существующего?» (τεχνῖτις — мастерица; слав. «художник»)."
  7: "οἱ πόνοι ταύτης εἰσὶν ἀρεταί — «труды её суть добродетели» (πόνος — труд, усилие; ἀρετή — добродетель; слав. «труды ея суть добродетели»). σωφροσύνη — целомудрие, здравомыслие (слав. «целомудрию»); φρόνησις — разумение (слав. «разуму»); ἀνδρεία — мужество (слав. «мужеству»). ὧν χρησιμώτερον οὐδέν — «полезнее чего нет ничего»."
  8: "πολυπειρία — «многоопытность» (слав. «многаго искусства»); τὰ ἀρχαῖα — «древнее»; τὰ μέλλοντα εἰκάζει — «будущее угадывает» (εἰκάζω — сравнивать, предполагать). στροφαὶ λόγων — «обороты, извития слов» (στροφή — поворот; слав. «извития словес»); λύσεις αἰνιγμάτων — «разрешения загадок». σημεῖα καὶ τέρατα προγινώσκει — «знамения и чудеса предузнаёт»; ἐκβάσεις καιρῶν καὶ χρόνων — «исходы сроков и времён» (ἔκβασις — выход, исход; слав. «сбытия»)."
  9: "ἔκρινα ... ἀγαγέσθαι πρὸς συμβίωσιν — «рассудил привести её к сожитию» (κρίνω — решать; слав. «судих»). σύμβουλος ἀγαθῶν — «советница благ»; παραίνεσις φροντίδων καὶ λύπης — собств. «увещание, наставление в заботах и печали» (παραίνεσις), слав. «утешение попечений и печали» — передано 慰め по csl."
  10: "ἕξω δι᾿ αὐτὴν δόξαν ἐν ὄχλοις — «буду иметь через неё славу в народе» (δόξα — слава, почёт; ὄχλος — толпа, народ; слав. «славу в народех»). τιμὴν παρὰ πρεσβυτέροις — «честь у старцев» (τιμή — честь; слав. «честь пред старцы»); ὁ νέος — «будучи юным» (слав. «юн сый»)."
  11: "ὀξὺς εὑρεθήσομαι ἐν κρίσει — «окажусь острым в суде» (ὀξύς — острый, проницательный; слав. «остр»). ἐν ὄψει δυναστῶν θαυμασθήσομαι — «пред лицом сильных буду дивим» (θαυμάζω — дивиться; слав. «лица сильных удивятся мне» — действительный оборот, в LXX страдательный)."
  12: "σιγῶντά με περιμενοῦσιν — «когда я молчу, ждут меня» (περιμένω — ждать); φθεγγομένῳ προσέξουσιν — «когда говорю, внимают» (φθέγγομαι — издавать голос, говорить; προσέχω — внимать). λαλοῦντος ἐπὶ πλεῖον — «когда говорю больше»; χεῖρα ἐπιθήσουσιν ἐπὶ στόμα αὐτῶν — «положат руку на уста свои», знак изумления и молчания."
  13: "ἀθανασία — «бессмертие» (слав. «безсмертие»), передано 不死 по терминологии корпуса. μνήμην αἰώνιον ... ἀπολείψω — «оставлю память вечную» (ἀπολείπω — оставлять; слав. «оставлю»); τοῖς μετ᾿ ἐμέ — «тем, кто после меня»."
  14: "διοικήσω λαούς — «буду управлять народами» (διοικέω — управлять; слав. «управлю люди»); ἔθνη ὑποταγήσεταί μοι — «народы покорятся мне» (ὑποτάσσω — подчинять; слав. «языцы покорятся ми»)."
  15: "φοβηθήσονταί με ... τύραννοι φρικτοί — «убоятся меня страшные тираны» (φρικτός — ужасный, вызывающий трепет; слав. «мучителие страшнии»). ἐν πλήθει φανοῦμαι ἀγαθός — «во множестве явлюсь добрым», т. е. среди народа (слав. «во множестве явлюся благ»); ἐν πολέμῳ ἀνδρεῖος — «на войне мужественный» (слав. «в брани крепок»)."
  16: "προσαναπαύσομαι αὐτῇ — «успокоюсь с нею» (προσαναπαύομαι — отдыхать вместе, находить покой; слав. «упокоюся с нею»). πικρία — горечь; ὀδύνη — боль (слав. «болезни»); συναναστροφή — общение, обращение (слав. «сообщение»); συμβίωσις — сожитие (слав. «сожитие»). εὐφροσύνη καὶ χαρά — «веселие и радость»."
  17: "ταῦτα λογισάμενος ἐν ἐμαυτῷ — «обдумав это в себе» (λογίζομαι — рассчитывать, обдумывать); φροντίσας ἐν καρδίᾳ μου — «позаботившись в сердце моём» (φροντίζω — заботиться, размышлять; слав. «печахся»). συγγένεια — родство, родственная связь (слав. «сродство»); передано 縁を結ぶこと. Греч. 8:17–18 — один период: придаточное ὅτι начинается в 17 и продолжается в 18, поэтому 8:17 кончается на 、."
  18: "ἐν φιλίᾳ αὐτῆς τέρψις ἀγαθή — «в дружбе с нею благое наслаждение» (τέρψις — услаждение; слав. «услаждение благо»). ἐν πόνοις χειρῶν αὐτῆς πλοῦτος ἀνεκλιπής — «в трудах рук её богатство неоскудевающее»; συγγυμνασία ὁμιλίας — «совместное упражнение в беседе» (συγγυμνασία — соупражнение; ὁμιλία — беседа; слав. «сообучение беседы»). εὔκλεια ἐν κοινωνίᾳ λόγων — «добрая слава в общении слов» (εὔκλεια — доброе имя; слав. «благославие»); περιῄειν ζητῶν ὅπως λάβω αὐτήν — «я ходил, ища, как бы взять её» (περιάγω/περίειμι — ходить кругом)."
  19: "παῖς ... εὐφυής — «дитя даровитое» (εὐφυής — хорошо одарённый, способный; слав. «остроумен»); παῖς — отрок, дитя (слав. «отрок»). ψυχῆς ... ἔλαχον ἀγαθῆς — «получил в удел добрую душу» (λαγχάνω — получать по жребию; слав. «получих»)."
  20: "μᾶλλον δὲ ἀγαθὸς ὤν — «скорее же, будучи добрым»; ἦλθον εἰς σῶμα ἀμίαντον — «пришёл в тело неосквернённое» (ἀμίαντος — нескверный; слав. «в тело нескверно»). Место догматически тёмное (речь о душе, входящей в тело); переведено буквально, без сглаживания."
  21: "γνοὺς ὅτι οὐκ ἄλλως ἔσομαι ἐγκρατής — «узнав, что иначе не овладею»; ἐγκρατής здесь «овладевший, удержавший» (слав. «одержу»), а не «воздержанный». ἐὰν μὴ ὁ θεὸς δῷ — «если Бог не даст»; χάρις — благодать, дар (слав. «благодать»); ἐνέτυχον τῷ κυρίῳ — «обратился к Господу» (ἐντυγχάνω — встречать, обращаться). Молитва начинается в 9:1."
