# jp-box, Премудрость Соломона, глава 8. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для 7–9 есть выборочно: его стихи не
# совпадают с делением gr, использован только для сверки; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 8: 1 премудрость у Бога; 2–8 её достоинства и богатство; 9–16 её дары
# Соломону; 17–21 его стремление и молитва. 8:17–18 — один греческий период
# (придаточное ὅτι), поэтому 8:17 кончается на 、, а сказуемое — в 8:18.
# 8:21 — введение к молитве, которая открывается в 9:1; в этой главе кавычек нет.
# Красного и синего нет.
# Нумерация по gr: 21 стих; деление совпадает с csl-ru и ru.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 不死, 全能者, 幕屋, 契約 и пр. уже в корпусе.
# Имена — транслитерация греческого (LXX).

