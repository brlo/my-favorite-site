verses:
  0: "ダビデの詩[うた]。"
  1: "主[しゅ]よ、わたしに不正[ふせい]を行[おこな]う者[もの]を裁[さば]き、わたしと戦[たたか]う者[もの]と戦[たたか]ってください。"
  2: "盾[たて]と甲[よろい]を取[と]り、わたしを助[たす]けるために立[た]ち上[あ]がってください。"
  3: "剣[けん]を抜[ぬ]いて、わたしを追[お]う者[もの]の行[ゆ]く手[て]をふさぎ、「わたしはあなたの救[すく]いである」と、わたしの魂[たましい]に告[つ]げてください。"
  4: "わたしの魂[たましい]を求[もと]める者[もの]は恥[は]じを受[う]け、辱[はずかし]められるように。わたしに災[わざわ]いを謀[はか]る者[もの]は退[しりぞ]けられ、恥[は]じを受[う]けるように。"
  5: "彼[かれ]らは風[かぜ]の前[まえ]の塵[ちり]のようになるように。主[しゅ]の使[つか]いが彼[かれ]らを追[お]い払[はら]う。"
  6: "彼[かれ]らの道[みち]は暗[くら]く、滑[すべ]りやすくなるように。主[しゅ]の使[つか]いが彼[かれ]らを追[お]いかける。"
  7: "彼[かれ]らはゆえなく、わたしのために滅[ほろ]びの罠[わな]を隠[かく]し、ゆえなくわたしの魂[たましい]を嘲[あざけ]ったからである。"
  8: "彼[かれ]らが知[し]らない罠[わな]が彼[かれ]らに来[き]たるように。彼[かれ]らが隠[かく]した網[あみ]が彼[かれ]らを捕[と]らえ、彼[かれ]らがその罠[わな]に落[お]ちるように。"
  9: "しかし、わたしの魂[たましい]は主[しゅ]にあって喜[よろこ]び、その救[すく]いを楽[たの]しむ。"
  10: "わたしの骨[ほね]はすべて言[い]う。「主[しゅ]よ、だれがあなたに似[に]ているだろうか。弱[よわ]い者[もの]を強[つよ]い者[もの]の手[て]から、貧[まず]しい者[もの]と乏[とぼ]しい者[もの]を、奪[うば]う者[もの]から救[すく]い出[だ]す方[かた]よ。」"
  11: "不正[ふせい]な証人[しょうにん]らが立[た]ち上[あ]がり、わたしの知[し]らないことをわたしに問[と]いただす。"
  12: "彼[かれ]らは良[よ]いことに悪[わる]いことで報[むく]い、わたしの魂[たましい]を子[こ]のない者[もの]とした。"
  13: "しかし、わたしは彼[かれ]らがわたしを苦[くる]しめるとき、粗布[あらぬの]をまとい、断食[だんじつ]してわたしの魂[たましい]を低[ひく]くした。わたしの祈[いの]りは、わたしのふところに返[かえ]ってきた。"
  14: "わたしは彼[かれ]を、隣[となり]人[ひと]のように、自分[じぶん]の兄弟[きょうだい]のようにいたわった。母[はは]を失[うしな]った者のように悲[かな]しみ、うなだれて歩[ある]んだ。"
  15: "しかし、彼[かれ]らはわたしに対して喜[よろこ]び、集[あつ]まった。わたしに鞭[むち]が集[あつ]まったが、わたしはそれを知[し]らなかった。彼[かれ]らはわたしを引[ひ]き裂[さ]き、心[こころ]を痛[いた]めることをしなかった。"
  16: "彼[かれ]らはわたしを試[ため]し、嘲[あざけ]りを重[かさ]ね、わたしに向[む]かって歯[は]をむいた。"
  17: "主[しゅ]よ、いつまで見[み]ておられるのか。彼[かれ]らの悪[わる]い仕業[しわざ]からわたしの魂[たましい]を、獅子[しし]からわたしのただ一[ひと]つの魂[たましい]を、取[と]り戻[もど]してください。"
  18: "主[しゅ]よ、わたしは大[おお]きな集[つど]いのうちであなたをたたえ、多[おお]くの民[たみ]の間[あいだ]であなたを賛美[さんび]しよう。"
  19: "不正[ふせい]にわたしと敵対[てきたい]し、ゆえなくわたしを憎[にく]み、目[め]くばせする者[もの]らが、わたしの上[うえ]に喜[よろこ]ばないように。"
  20: "彼[かれ]らはわたしに平和[へいわ]のことを語[かた]りながら、怒[いか]りのために偽[いつわ]りを企[たくら]んでいたからである。"
  21: "彼[かれ]らはわたしに向[む]かって口[くち]を大[おお]きく開[ひら]き、「よし、よし。わたしたちの目[め]がそれを見[み]た」と言[い]った。"
  22: "主[しゅ]よ、あなたは見[み]ておられる。黙[だま]っていないでください。主[しゅ]よ、わたしから離[はな]れないでください。"
  23: "わたしの神[かみ]、わたしの主[しゅ]よ、目[め]を覚[さ]まして、わたしの裁[さば]きに耳[みみ]を傾[かたむ]け、わたしのため争[あらそ]いを裁[さば]いてください。"
  24: "主[しゅ]、わたしの神[かみ]よ、あなたの義[ぎ]によってわたしを裁[さば]き、彼[かれ]らがわたしの上[うえ]に喜[よろこ]ばないようにしてください。"
  25: "彼[かれ]らが心[こころ]のうちで「よし、よし、わたしたちの望[のぞ]みどおりだ」と言[い]わないように。また、「わたしたちは彼[かれ]を飲[の]み込[こ]んだ」と言[い]わないように。"
  26: "わたしの災[わざわ]いを喜[よろこ]ぶ者[もの]らは、共[とも]に恥[は]じを受[う]け、辱[はずかし]められるように。わたしに向[む]かって大[おお]きなことを語[かた]る者[もの]らは、恥[は]じと辱[はずかし]めを着[き]るように。"
  27: "わたしの義[ぎ]を願[ねが]う者[もの]らは、喜[よろこ]び、楽[たの]しむように。主[しゅ]の僕[しもべ]の平和[へいわ]を願[ねが]う者[もの]らは、いつも「主[しゅ]は大[おお]いなる方[かた]となられる」と言[い]うように。"
  28: "わたしの舌[した]はあなたの義[ぎ]を思[おも]い巡[めぐ]らし、一日中[いちにちじゅう]あなたを賛美[さんび]する。"

notes:
  0: "Τῷ Δαυιδ — ダビデの詩. Надписание — стих 0."
  1: "Δίκασον, κύριε, τοὺς ἀδικοῦντάς με — 主よ、わたしに不正を行う者を裁き (δικάζω — «судить, вести тяжбу»). πολέμησον τοὺς πολεμοῦντάς με — わたしと戦う者と戦ってください; повтор корня сохранён."
  2: "ἐπιλαβοῦ ὅπλου καὶ θυρεοῦ — возьми оружие и щит (θυρεός — «большой щит»; ὅπλον — «доспех»; 盾と甲, как в Синодальном «щит и латы»). ἀνάστηθι εἰς βοήθειάν μου — わたしを助けるために立ち上がってください."
  3: "ἔκχεον ῥομφαίαν — извлеки меч (ῥομφαία — «меч»; ἐκχέω — «обнажать»). σύγκλεισον ἐξ ἐναντίας τῶν καταδιωκόντων με — わたしを追う者の行く手をふさぎ (συγκλείω — «затворять»). εἰπὸν τῇ ψυχῇ μου Σωτηρία σου ἐγώ εἰμι — 「わたしはあなたの救いである」と、わたしの魂に告げてください; это слова, которые псалмопевец просит Бога сказать, потому 「」."
  4: "αἰσχυνθήτωσαν καὶ ἐντραπήτωσαν οἱ ζητοῦντες τὴν ψυχήν μου — わたしの魂を求める者は恥じを受け、辱められるように (ἐντρέπω — «стыдить»). ἀποστραφήτωσαν εἰς τὰ ὀπίσω — 退けられ (букв. «да обратятся назад»). καταισχυνθήτωσαν οἱ λογιζόμενοί μοι κακά — わたしに災いを謀る者は恥じを受けるように (λογίζομαι — «замышлять»)."
  5: "γενηθήτωσαν ὡσεὶ χνοῦς κατὰ πρόσωπον ἀνέμου — 彼らは風の前の塵のようになるように (χνοῦς — «прах, мякина»; ср. Пс 1:4). ἄγγελος κυρίου ἐκθλίβων αὐτούς — 主の使いが彼らを追い払う (ἐκθλίβω — «теснить, изгонять»)."
  6: "γενηθήτω ἡ ὁδὸς αὐτῶν σκότος καὶ ὀλίσθημα — 彼らの道は暗く、滑りやすくなるように (ὀλίσθημα — «скользкое место»). ἄγγελος κυρίου καταδιώκων αὐτούς — 主の使いが彼らを追いかける."
  7: "ὅτι δωρεὰν ἔκρυψάν μοι διαφθορὰν παγίδος αὐτῶν — 彼らはゆえなく、わたしのために滅びの罠を隠し (δωρεάν — «без причины»; διαφθορά — «погибель»). μάτην ὠνείδισαν τὴν ψυχήν μου — ゆえなくわたしの魂を嘲った (ὀνειδίζω — «поносить»)."
  8: "ἐλθέτω αὐτοῖς παγίς, ἣν οὐ γινώσκουσιν — 彼らが知らない罠が彼らに来たるように (παγίς — «ловушка»). ἡ θήρα, ἣν ἔκρυψαν, συλλαβέτω αὐτούς — 彼らが隠した網が彼らを捕らえ (θήρα — «ловля, сеть»). ἐν τῇ παγίδι πεσοῦνται ἐν αὐτῇ — 彼らがその罠に落ちるように."
  9: "ἡ δὲ ψυχή μου ἀγαλλιάσεται ἐπὶ τῷ κυρίῳ — しかし、わたしの魂は主にあって喜び (ἀγαλλιάομαι — «ликовать»). τερφθήσεται ἐπὶ τῷ σωτηρίῳ αὐτοῦ — その救いを楽しむ (τέρπω — «услаждать»; σωτήριον — «спасение»)."
  10: "πάντα τὰ ὀστᾶ μου ἐροῦσιν — わたしの骨はすべて言う (образ целого человека). Κύριε, τίς ὅμοιός σοι — 「主よ、だれがあなたに似ているだろうか」; речь костей — 「」. ῥυόμενος πτωχὸν ἐκ χειρὸς στερεωτέρων αὐτοῦ — 弱い者を強い者の手から…救い出す方 (στερεός — «крепкий»). πτωχὸν καὶ πένητα ἀπὸ τῶν διαρπαζόντων αὐτόν — 貧しい者と乏しい者を、奪う者から (διαρπάζω — «расхищать»)."
  11: "ἀναστάντες μάρτυρες ἄδικοι — 不正な証人らが立ち上がり (μάρτυς — «свидетель»). ἃ οὐκ ἐγίνωσκον ἠρώτων με — わたしの知らないことをわたしに問いただす (ἐρωτάω — «спрашивать»)."
  12: "ἀνταπεδίδοσάν μοι πονηρὰ ἀντὶ καλῶν — 彼らは良いことに悪いことで報い (ἀνταποδίδωμι — «воздавать»). ἀτεκνίαν τῇ ψυχῇ μου — わたしの魂を子のない者とした (ἀτεκνία — «бездетство»; слав. «безчадие»; Синодальный «сиротством душе моей»)."
  13: "ἐγὼ δὲ ἐν τῷ αὐτοὺς παρενοχλεῖν μοι — しかし、わたしは彼らがわたしを苦しめるとき (παρενοχλέω — «досаждать, притеснять»); слав. «внегда им стужати ми», Синодальный и jp-joc по иному пониманию «когда они болели». ἐνεδυόμην σάκκον — 粗布をまとい (σάκκος — вретище). ἐταπείνουν ἐν νηστείᾳ τὴν ψυχήν μου — 断食してわたしの魂を低くした (νηστεία — «пост»). ἡ προσευχή μου εἰς κόλπον μου ἀποστραφήσεται — わたしの祈りは、わたしのふところに返ってきた (κόλπος — «лоно»)."
  14: "ὡς πλησίον, ὡς ἀδελφὸν ἡμέτερον, οὕτως εὐηρέστουν — わたしは彼を、隣人のように、自分の兄弟のようにいたわった (εὐαρεστέω — «быть благосклонным»). ὡς πενθῶν καὶ σκυθρωπάζων, οὕτως ἐταπεινούμην — 母を失った者のように悲しみ、うなだれて歩んだ (πενθέω — «оплакивать»; σκυθρωπάζω — «быть мрачным»; образ матери — как у jp-joc)."
  15: "κατ᾿ ἐμοῦ ηὐφράνθησαν καὶ συνήχθησαν — 彼らはわたしに対して喜び、集まった (εὐφραίνω — «веселить»; κατά с ген. — «против»); Синодальный по евр. добавляет «когда я претыкался», в греческом и славянском этого нет. συνήχθησαν ἐπ᾿ ἐμὲ μάστιγες — わたしへの鞭が集まった (μάστιξ — «бич»). οὐκ ἔγνων — わたしはそれを知らなかった. διεσχίσθησαν καὶ οὐ κατενύγησαν — 彼らはわたしを引き裂き、心を痛めることをしなかった (διασχίζω — «разрывать»; κατανύσσομαι — «сокрушаться»)."
  16: "ἐπείρασάν με — 彼らはわたしを試し (πειράζω — «искушать»). ἐξεμυκτήρισάν με μυκτηρισμόν — 嘲りを重ね (μυκτηρίζω — «издеваться»; внутренний объект передан усилением). ἔβρυξαν ἐπ᾿ ἐμὲ τοὺς ὀδόντας αὐτῶν — わたしに向かって歯をむいた (βρύχω — «скрежетать»)."
  17: "κύριε, πότε ἐπόψῃ — 主よ、いつまで見ておられるのか (ἐφοράω — «взирать»). ἀποκατάστησον τὴν ψυχήν μου ἀπὸ τῆς κακουργίας αὐτῶν — 彼らの悪い仕業からわたしの魂を…取り戻してください (ἀποκαθίστημι — «возвращать»; κακουργία — «злодейство»). ἀπὸ λεόντων τὴν μονογενῆ μου — 獅子からわたしのただ一つの魂を (μονογενής — «единственный»; ψυχή подразумевается, поэтому 魂 добавлено как восполнение эллипсиса, а не ひとり子)."
  18: "ἐξομολογήσομαί σοι, κύριε, ἐν ἐκκλησίᾳ πολλῇ — 主よ、わたしは大きな集いのうちであなたをたたえ (ἐκκλησία — 集い). ἐν λαῷ βαρεῖ αἰνέσω σε — 多くの民の間であなたを賛美しよう (βαρύς — «многолюдный»)."
  19: "μὴ ἐπιχαρείησάν μοι οἱ ἐχθραίνοντές μοι ἀδίκως — 不正にわたしと敵対する者が、わたしの上に喜ばないように (ἐπιχαίρω — «злорадствовать»). οἱ μισοῦντές με δωρεὰν καὶ διανεύοντες ὀφθαλμοῖς — ゆえなくわたしを憎み、目くばせする者ら (διανεύω — «перемигиваться»)."
  20: "ἐμοὶ μὲν εἰρηνικὰ ἐλάλουν — 彼らはわたしに平和のことを語りながら. ἐπ᾿ ὀργὴν δόλους διελογίζοντο — 怒りのために偽りを企んでいた (δόλος — «коварство»; διαλογίζομαι — «замышлять»)."
  21: "ἐπλάτυναν ἐπ᾿ ἐμὲ τὸ στόμα αὐτῶν — 彼らはわたしに向かって口を大きく開き (πλατύνω — «расширять»). εἶπαν Εὖγε εὖγε — 「よし、よし」と言った (εὖγε — «хорошо!»); слова врагов — 「」. εἶδαν οἱ ὀφθαλμοὶ ἡμῶν — わたしたちの目がそれを見た."
  22: "εἶδες, κύριε, μὴ παρασιωπήσῃς — 主よ、あなたは見ておられる、黙っていないでください. κύριε, μὴ ἀποστῇς ἀπ᾿ ἐμοῦ — 主よ、わたしから離れないでください (ἀφίστημι — «отступать»)."
  23: "ἐξεγέρθητι, κύριε, καὶ πρόσχες τῇ κρίσει μου — 目を覚まして、わたしの裁きに耳を傾け (ἐξεγείρω — «пробуждать»; προσέχω — «внимать»). ὁ θεός μου καὶ ὁ κύριός μου, εἰς τὴν δίκην μου — わたしの神、わたしの主よ、わたしのため争いを裁いてください (δίκη — «тяжба, суд»)."
  24: "κρῖνόν με κατὰ τὴν δικαιοσύνην σου — あなたの義によってわたしを裁き. κύριε ὁ θεός μου — 主、わたしの神よ. μὴ ἐπιχαρείησάν μοι — 彼らがわたしの上に喜ばないようにしてください."
  25: "μὴ εἴπαισαν ἐν καρδίαις αὐτῶν — 彼らが心のうちで…と言わないように. Εὖγε εὖγε τῇ ψυχῇ ἡμῶν — 「よし、よし、わたしたちの望みどおりだ」 (слова врагов — 「」). μηδὲ εἴπαισαν Κατεπίομεν αὐτόν — また、「わたしたちは彼を飲み込んだ」と言わないように (καταπίνω — «проглатывать»)."
  26: "αἰσχυνθείησαν καὶ ἐντραπείησαν ἅμα οἱ ἐπιχαίροντες τοῖς κακοῖς μου — わたしの災いを喜ぶ者らは、共に恥じを受け、辱められるように. ἐνδυσάσθωσαν αἰσχύνην καὶ ἐντροπὴν οἱ μεγαλορρημονοῦντες ἐπ᾿ ἐμέ — わたしに向かって大きなことを語る者らは、恥じと辱めを着るように (μεγαλορρημονέω — «велеречиво говорить»)."
  27: "ἀγαλλιάσαιντο καὶ εὐφρανθείησαν οἱ θέλοντες τὴν δικαιοσύνην μου — わたしの義を願う者らは、喜び、楽しむように. εἰπάτωσαν διὰ παντός Μεγαλυνθήτω ὁ κύριος — いつも「主は大いなる方となられる」と言うように (слова — 「」). οἱ θέλοντες τὴν εἰρήνην τοῦ δούλου αὐτοῦ — 主の僕の平和を願う者らは."
  28: "ἡ γλῶσσά μου μελετήσει τὴν δικαιοσύνην σου — わたしの舌はあなたの義を思い巡らし (μελετάω — «поучаться, размышлять»; как Пс 1:2). ὅλην τὴν ἡμέραν τὸν ἔπαινόν σου — 一日中あなたを賛美する (ἔπαινος — «хвала»)."
