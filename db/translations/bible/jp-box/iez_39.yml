verses:
  1: "「人[ひと]の子[こ]よ、ゴグについて預言[よげん]して言[い]え。主[しゅ]なる神[かみ]はこう言[い]われる。見[み]よ、わたしはあなたに敵対[てきだい]する。ゴグ、ロシュ、モソク、トベルの君[きみ]よ。"
  2: "わたしはあなたを集[あつ]め、あなたを導[みちび]き、北[きた]の果[は]てからあなたを上[のぼ]らせ、イスラエルの山[やま]々[やま]に連[つ]れて来[く]る。"
  3: "わたしはあなたの左[ひだり]の手[て]から弓[ゆみ]を、右[みぎ]の手[て]から矢[や]を奪[うば]い取[と]り、あなたを倒[たお]す。"
  4: "あなたはイスラエルの山[やま]々[やま]に倒[たお]れる。あなたとあなたの周[まわ]りのすべての者[もの]、あなたとともにいる国民[こくみん]たちは、多[おお]くの鳥[とり]、すなわちすべての翼[つばさ]ある鳥[とり]と野[の]のすべての獣[けもの]に与[あた]えられる。わたしはあなたを彼らの食[た]べ物[もの]として与[あた]えた。"
  5: "あなたは野[の]の面[おもて]に倒[たお]れる。わたしが語[かた]ったからである、と主[しゅ]は言[い]われる。"
  6: "わたしはゴグの上[うえ]に火[ひ]を放[はな]つ。島[しま]々[しま]は安[やす]らかに住[す]む。彼らはわたしが主[しゅ]であることを知[し]る。"
  7: "わたしの聖[せい]なる名[な]は、わたしの民[たみ]イスラエルの間[あいだ]で知[し]られる。彼らはもはやわたしの聖[せい]なる名[な]を汚[けが]さない。諸国民[しょこくみん]は、わたしがイスラエルにおいて聖[せい]なる主[しゅ]であることを知[し]る。"
  8: "見[み]よ、それは来[き]た。あなたはそれが起[お]こることを知[し]る、と主[しゅ]なる神[かみ]は言[い]われる。わたしが語[かた]ったあの日[ひ]である。"
  9: "イスラエルの町[まち]々[まち]に住[す]む者[もの]たちは出[で]て来[き]て、武具[ぶぐ]を焼[や]く。盾[たて]と槍[やり]、弓[ゆみ]と矢[や]、手[て]の杖[つえ]と投[な]げ槍[やり]を。彼らはそれらで火[ひ]を燃[も]やし、七[なな]年[ねん]の間[あいだ]そうする。"
  10: "彼らは野[の]から木[き]を取[と]らず、森[もり]から切[き]り出[だ]さない。ただ武具[ぶぐ]で火[ひ]を燃[も]やす。彼らは自分[じぶん]たちを奪[うば]った者[もの]を奪い、自分[じぶん]たちから取[と]った者[もの]から取[と]る、と主[しゅ]は言[い]われる。"
  11: "その日[ひ]、わたしはゴグに、イスラエルの中[なか]の名[な]ある墓[はか]の場所[ばしょ]を与[あた]える。海[うみ]の東[ひがし]に来[く]る者[もの]たちの、多[おお]くの者[もの]の墓[はか]である。人[ひと]々[びと]は谷[たに]の入口[いりぐち]をふさぐ。彼らはそこにゴグとそのすべての群[む]れを葬[ほうむ]る。そこはゴグの墓所[はかどころ]と呼[よ]ばれる。"
  12: "イスラエルの家[いえ]は、地[ち]が清[きよ]められるために、七[なな]か月[げつ]の間[あいだ]彼らを葬[ほうむ]る。"
  13: "地[ち]のすべての民[たみ]が彼らを葬[ほうむ]る。わたしが栄光[えいこう]を受[う]ける日[ひ]に、それは彼らのために名[な]となる、と主[しゅ]は言[い]われる。"
  14: "人[ひと]々[びと]は、地[ち]を巡[めぐ]り歩[ある]いて、地[ち]の面[おもて]に残[のこ]った者[もの]たちを葬[ほうむ]り、地[ち]を清[きよ]める者[もの]たちを絶[た]えず立[た]てる。七[なな]か月[げつ]の後[のち]、彼らは探[さが]し始[はじ]める。"
  15: "地[ち]を行[ゆ]き交[か]う者[もの]は、人[ひと]の骨[ほね]を見[み]ると、そのそばにしるしを立[た]てる。葬[ほうむ]る者[もの]たちが、それをゴグの墓所[はかどころ]に葬[ほうむ]るまで、そうする。"
  16: "町[まち]の名[な]は『墓所[はかどころ]』である。こうして地[ち]は清[きよ]められる。"
  17: "人[ひと]の子[こ]よ、言[い]え。主[しゅ]なる神[かみ]はこう言[い]われる。すべての翼[つばさ]ある鳥[とり]と野[の]のすべての獣[けもの]に言[い]え。集[あつ]められて来[こ]い。四方[しほう]から、わたしのいけにえ、すなわちわたしがあなたがたのために屠[ほふ]る大[おお]きないけにえ、イスラエルの山[やま]々[やま]の上のものに集まれ。あなたがたは肉[にく]を食[た]べ、血[ち]を飲[の]む。"
  18: "あなたがたは巨人[きょじん]の肉[にく]を食[た]べ、地[ち]の君[きみ]たちの血[ち]を飲[の]む。雄羊[おひつじ]と子牛[こうし]と雄山羊[おやぎ]、そして肥[こ]えた子牛[こうし]、すべての者[もの]である。"
  19: "あなたがたは、わたしがあなたがたのために屠[ほふ]ったわたしのいけにえから、脂[あぶら]を飽[あ]きるまで食[た]べ、血[ち]を酔[よ]うまで飲[の]む。"
  20: "あなたがたはわたしの食卓[しょくたく]で、馬[うま]と騎手[きしゅ]、巨人[きょじん]とすべての戦[いくさ]人[びと]で飽[あ]き足[た]りる、と主[しゅ]は言[い]われる。"
  21: "わたしはあなたがたの間[あいだ]にわたしの栄光[えいこう]を与[あた]える。すべての国民[こくみん]は、わたしが行[おこな]ったわたしの裁[さば]きと、わたしが彼らの上[うえ]に下[くだ]したわたしの手[て]を見[み]る。"
  22: "イスラエルの家[いえ]は、この日[ひ]から後[のち]も、わたしが彼らの主[しゅ]なる神[かみ]であることを知[し]る。"
  23: "すべての国民[こくみん]は、イスラエルの家[いえ]がその罪[つみ]のゆえに捕囚[ほしゅう]とされたこと、すなわち彼らがわたしを背[そむ]いたために、わたしが彼らから顔[かお]をそむけ、彼らを敵[てき]の手[て]に渡[わた]し、すべての者が剣[つるぎ]に倒[たお]れたことを知[し]る。"
  24: "わたしは彼らの汚[けが]れとその不法[ふほう]に従[したが]って彼らにそうし、彼らから顔[かお]をそむけた。"
  25: "それゆえ、主[しゅ]なる神[かみ]はこう言[い]われる。今[いま]、わたしはヤコブの捕囚[ほしゅう]を帰[かえ]し、イスラエルの家[いえ]をあわれみ、わたしの聖[せい]なる名[な]のために妬[ねた]む。"
  26: "彼らは、自分[じぶん]たちが行[おこな]った恥[はじ]と不法[ふほう]を負[お]う。それは、彼らが自分[じぶん]たちの地[ち]に安[やす]らかに住[す]み、恐[おそ]れさせる者[もの]がいなくなるときである。"
  27: "わたしが彼らを諸国民[しょこくみん]の間[あいだ]から帰[かえ]し、もろもろの国[くに]々[ぐに]から彼らを集[あつ]め、諸国民[しょこくみん]の前[まえ]で彼らのうちに聖[せい]とされるときである。"
  28: "わたしが諸国民[しょこくみん]の間[あいだ]で彼らに現[あらわ]れるとき、彼らはわたしが彼らの主[しゅ]なる神[かみ]であることを知[し]る。わたしは彼らを彼らの地[ち]に集[あつ]め、そこに彼らのうちの一人[ひとり]も残[のこ]さない。"
  29: "わたしはもはや彼らから顔[かお]をそむけない。わたしがイスラエルの家[いえ]にわたしの怒[いか]りを注[そそ]いだからである、と主[しゅ]なる神[かみ]は言[い]われる。」"

notes:
  1: "προφήτευσον ἐπὶ Γωγ — «изреки пророчество на Гога»; Ἰδοὺ ἐγὼ ἐπὶ σέ — «вот, Я на тебя» (формула 38:3); ἄρχοντα Ρως, Μοσοχ καὶ Θοβελ — ロシュ、モソク、トベル. Здесь открывается речь Господа — 「…」 до конца главы (29)."
  2: "συνάξω σε καὶ καθοδηγήσω σε — «соберу тебя и наставлю тебя» (καθοδηγέω); ἀναβιβῶ σε ἀπ᾽ ἐσχάτου τοῦ βορρᾶ — «возведу тебя от пределов севера»; ἀνάξω σε ἐπὶ τὰ ὄρη τοῦ Ισραηλ — «возведу тебя на горы Израилевы»."
  3: "ἀπολῶ τὸ τόξον σου ἀπὸ τῆς χειρός σου τῆς ἀριστερᾶς — «погублю (исторгну) лук твой из левой руки твоей»; τὰ τοξεύματά σου ἀπὸ τῆς χειρὸς τῆς δεξιᾶς — «стрелы твои из правой руки твоей» (τόξευμα); καταβαλῶ σε — «низложу тебя»."
  4: "πεσῇ σὺ καὶ πάντες οἱ περὶ σέ — «падёшь ты и все окрест тебя»; εἰς πλήθη ὀρνέων — «в множество птиц» (πλῆθος); παντὶ πετεινῷ — «всякой птице»; πᾶσι τοῖς θηρίοις τοῦ πεδίου — «всем зверям полевым»; δέδωκά σε καταβρωθῆναι — «Я отдал тебя на съедение» (καταβιβρώσκω)."
  5: "ἐπὶ προσώπου τοῦ πεδίου πεσῇ — «на лице поля падёшь»; ὅτι ἐγὼ ἐλάλησα — «ибо Я сказал»; λέγει κύριος — «говорит Господь»."
  6: "ἀποστελῶ πῦρ ἐπὶ Γωγ — «пошлю огонь на Гога» (слав. «на магога» — иное чтение, внесено по LXX); κατοικηθήσονται αἱ νῆσοι ἐπ᾽ εἰρήνης — «будут жить острова в мире»; γνώσονται ὅτι ἐγώ εἰμι κύριος — формула. Слав. переносит эту формулу в начало 7-го стиха — деление по LXX."
  7: "τὸ ὄνομά μου τὸ ἅγιον γνωσθήσεται — «имя Моё святое будет познано»; οὐ βεβηλωθήσεται ἔτι — «не будет более оскверняемо»; κύριος ἅγιος ἐν Ισραηλ — «Господь, Святый в Израиле». Слав. добавляет в начале «и уведят, яко аз есмь Господь» (перенос из 6-го) — повтор не внесён."
  8: "ἰδοὺ ἥκει — «вот, пришло»; γνώσῃ ὅτι ἔσται — «узнаешь, что будет»; αὕτη ἐστὶν ἡ ἡμέρα, ἐν ᾗ ἐλάλησα — «это день, о котором Я сказал»."
  9: "ἐξελεύσονται οἱ κατοικοῦντες τὰς πόλεις — «выйдут живущие в городах»; καύσουσιν ἐν τοῖς ὅπλοις — «будут жечь оружие» (ὅπλον — 武具); πέλταις καὶ κοντοῖς καὶ τόξοις — «щиты и копья и луки» (κοντός — 槍); ῥάβδοις χειρῶν — «жезлы ручные» (手の杖); λόγχαις — «сулицы» (投げ槍); πῦρ ἑπτὰ ἔτη — «огонь семь лет»."
  10: "οὐ μὴ λάβωσιν ξύλα ἐκ τοῦ πεδίου — «не возьмут дров с поля»; οὐδὲ μὴ κόψωσιν ἐκ τῶν δρυμῶν — «и не будут рубить из лесов» (δρυμός — 森); τὰ ὅπλα κατακαύσουσιν — «оружие сожгут»; προνομεύσουσιν τοὺς προνομεύσαντας — «ограбят грабивших» (cognatus); σκυλεύσουσιν τοὺς σκυλεύσαντας — «оберут обирающих»."
  11: "δώσω τῷ Γωγ τόπον ὀνομαστόν — «дам Гогу место именитое» (ὀνομαστός — 名ある); μνημεῖον ἐν Ισραηλ — «могилу в Израиле»; τὸ πολυάνδριον τῶν ἐπελθόντων πρὸς τῇ θαλάσσῃ — «многолюдное кладбище приходящих при море» (πολυάνδριον — 墓所); περιοικοδομήσουσιν τὸ περιστόμιον τῆς φάραγγος — «заградят устье ущелья» (περιστόμιον — 入口); κληθήσεται Τὸ γαι τὸ πολυάνδριον τοῦ Γωγ — «назовётся: Гай — многолюдное кладбище Гога»; слав. «дебрь» = 谷; слав. добавляет «на восток моря» — нет в LXX."
  12: "κατορύξουσιν αὐτοὺς οἶκος Ισραηλ — «погребут их дом Израилев» (κατορύσσω); ἵνα καθαρισθῇ ἡ γῆ — «чтобы очистилась земля»; ἐν ἑπταμήνῳ — «в семь месяцев» (ἑπτάμηνον)."
  13: "πᾶς ὁ λαὸς τῆς γῆς — «весь народ земли»; ἔσται αὐτοῖς εἰς ὀνομαστόν — «будет им в именитое»; ᾗ ἡμέρᾳ ἐδοξάσθην — «в день, когда Я прославился» (δοξάζω); λέγει κύριος."
  14: "ἄνδρας διὰ παντὸς διαστελοῦσιν — «мужей постоянно поставят» (διαστέλλω — отделять, назначать); ἐπιπορευομένους τὴν γῆν — «обходить землю»; θάψαι τοὺς καταλελειμμένους — «погребать оставшихся»; μετὰ τὴν ἑπτάμηνον — «после семи месяцев»; ἐκζητήσουσιν — «будут искать» (ἐκζητέω)."
  15: "πᾶς ὁ διαπορευόμενος τὴν γῆν — «всякий проходящий землю»; ἰδὼν ὀστοῦν ἀνθρώπου — «увидев кость человеческую»; οἰκοδομήσει παρ᾽ αὐτὸ σημεῖον — «построит при ней знак» (σημεῖον — しるし); ἕως ὅτου θάψωσιν αὐτό — «пока не погребут её»."
  16: "τὸ ὄνομα τῆς πόλεως Πολυάνδριον — «имя города — Многолюдное (кладбище)»; καθαρισθήσεται ἡ γῆ — «очистится земля». Слав. читает «имя месту» (а не городу) и добавляет «падение» — расхождение отмечено."
  17: "εἰπὸν παντὶ ὀρνέῳ πετεινῷ — «скажи всякой птице летающей»; πρὸς πάντα τὰ θηρία τοῦ πεδίου — «всем зверям полевым»; ἐπὶ τὴν θυσίαν μου — «на жертву Мою» (θυσία — いけにえ); θυσίαν μεγάλην — «жертву великую»; φάγεσθε κρέα καὶ πίεσθε αἷμα — «ешьте мясо и пейте кровь»."
  18: "κρέα γιγάντων — «мясо исполинов» (γίγας — 巨人); αἷμα ἀρχόντων τῆς γῆς — «кровь князей земли»; κριοὺς καὶ μόσχους καὶ τράγους — «баранов и тельцов и козлов» (κριός, μόσχος, τράγος); ἐστεατωμένοι — «откормленные» (στεατόω). Слав. «волы тучнии» вместо «тельцы» — расхождение, внесено по LXX."
  19: "στέαρ εἰς πλησμονήν — «жир до насыщения» (στέαρ — 脂; πλησμονή); αἷμα εἰς μέθην — «кровь до опьянения» (μέθη); ἀπὸ τῆς θυσίας μου — «от жертвы Моей»."
  20: "ἐμπλησθήσεσθε ἐπὶ τῆς τραπέζης μου — «насытитесь за столом Моим» (τράπεζα — 食卓); ἵππον καὶ ἀναβάτην — «коня и всадника»; γίγαντα καὶ πάντα ἄνδρα πολεμιστήν — «исполина и всякого мужа воинственного»."
  21: "δώσω τὴν δόξαν μου ἐν ὑμῖν — «дам славу Мою в вас»; ὄψονται πάντα τὰ ἔθνη τὴν κρίσιν μου — «увидят все народы суд Мой»; τὴν χεῖρά μου, ἣν ἐπήγαγον — «руку Мою, которую Я навёл» (ἐπάγω)."
  22: "γνώσονται οἶκος Ισραηλ — «узнает дом Израилев»; ὁ θεὸς αὐτῶν — «Бог их»; ἀπὸ τῆς ἡμέρας ταύτης καὶ ἐπέκεινα — «от сего дня и далее» (ἐπέκεινα)."
  23: "διὰ τὰς ἁμαρτίας αὐτῶν ᾐχμαλωτεύθησαν — «за грехи их пленены» (αἰχμαλωτεύω); ἀνθ᾽ ὧν ἠθέτησαν εἰς ἐμέ — «за то, что отверглись Меня» (ἀθετέω); ἀπέστρεψα τὸ πρόσωπόν μου — «отвратил лицо Моё»; ἔπεσαν πάντες μαχαίρᾳ — «пали все мечом»."
  24: "κατὰ τὰς ἀκαθαρσίας αὐτῶν καὶ κατὰ τὰ ἀνομήματα — «по нечистотам их и по беззакониям их» (ἀνόμημα); ἐποίησα αὐτοῖς — «сделал им»; ἀπέστρεψα τὸ πρόσωπόν μου ἀπ᾽ αὐτῶν — «отвратил лицо Моё от них»."
  25: "ἀποστρέψω τὴν αἰχμαλωσίαν Ιακωβ — «возвращу плен Иакова» (αἰχμαλωσία — 捕囚); ἐλεήσω τὸν οἶκον Ισραηλ — «помилую дом Израилев»; ζηλώσω διὰ τὸ ὄνομά μου — «возревную за имя Моё» (ζηλόω — 妬む)."
  26: "λήμψονται τὴν ἀτιμίαν ἑαυτῶν — «примут позор свой» (ἀτιμία); τὴν ἀδικίαν, ἣν ἠδίκησαν — «неправду, которую они делали» (cognatus); ἐπ᾽ εἰρήνης — «в мире»; οὐκ ἔσται ὁ ἐκφοβῶν — «не будет устрашающего» (ἐκφοβέω)."
  27: "ἐν τῷ ἀποστρέψαι με αὐτοὺς ἐκ τῶν ἐθνῶν — «когда возвращу их из народов»; συναγαγεῖν ἐκ τῶν χωρῶν — «собрать из стран»; ἁγιασθήσομαι ἐν αὐτοῖς ἐνώπιον τῶν ἐθνῶν — «освящусь в них пред народами»."
  28: "ἐν τῷ ἐπιφανῆναί με αὐτοῖς ἐν τοῖς ἔθνεσιν — «когда явлюсь им среди народов» (ἐπιφαίνω); здесь в LXX стих кончается. Слав. добавляет «и соберу я на землю их и не оставлю от них тамо ктому» — нет в LXX, внесено без 〔…〕."
  29: "οὐκ ἀποστρέψω οὐκέτι τὸ πρόσωπόν μου ἀπ᾽ αὐτῶν — «не отвращу более лица Моего от них»; ἀνθ᾽ οὗ ἐξέχεα τὸν θυμόν μου — «за то, что излил ярость Мою» (ἐκχέω). В Синодальном «изолью дух Мой» (МТ) — не источник; в LXX и слав. «ярость». Здесь речь закрывается."
