# jp-box, Иезекииль, глава 39. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 39 (совпадает; см. карту 20/21).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: 1–10 — гибель Гога на горах Израилевых: лук из левой руки, стрелы
# из правой, павшие отданы птицам и зверям, огонь на Гога, святое имя прославится;
# жители выйдут и семь лет будут жечь оружие, не рубя леса. 11–16 — погребение:
# место погребения у моря, «Гай — многолюдное кладбище Гога», семь месяцев очищения,
# постоянные погребатели, знак у кости, имя города — «Многолюдное». 17–20 — пир
# птицам и зверям: мясо исполинов, кровь князей, стол Господень. 21–29 — итог:
# слава Господня среди народов, дом Израилев знает Господа, плен за грехи,
# возвращение плена Иакова, излияние ярости (в Синодальном — Духа), лицо Господне
# больше не отвращается.
# Голоса: 1–29 — одна непрерывная речь Господа 「…»: пророк получает повеление
# (1) и слово к птицам и зверям (17–20) внутри той же речи, отдельной цитатой они
# не выделены (ср. 30:2; 37:4). Вложенной речи нет; в 16 название города дано
# в 『…』 как имя, а не как речь.
# «Точка»: в этой главе нет.
# Имена и термины: ゴグ、マゴグ、ロシュ、モソク、トベル; 墓所[はかどころ] (πολυάνδριον),
# 谷[たに] (τὸ γαι, слав. «дебрь»), 巨人[きょじん] (γίγας), 雄羊[おひつじ] (κριός),
# 子牛[こうし] (μόσχος), 雄山羊[おやぎ] (τράγος), 脂[あぶら] (στέαρ), 騎手[きしゅ]
# (ἀναβάτης), 戦[いくさ]人[びと] (ἄνδρας πολεμιστής), 捕囚[ほしゅう] (αἰχμαλωσία),
# 嗣業[しぎょう] не встречается; 主[しゅ]なる神[かみ] (κύριος κύριος).
#

