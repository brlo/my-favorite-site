# jp-box, Неемия, глава 10. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz): ezd 20 = Неем 10; контроль — церковнославянский
# (csl-ru), по паритету (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes);
# ru (Синодальный) — только для понимания, не источник. jp-ni в Неемии есть,
# но источником не был.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 10: подписание завета (1), подписавшие — священники (2–9), левиты (10–14),
# главы народа (15–28), обязательства общины (29–40).
# Речи нет (обязательство изложено от 1-го л. мн. ч.), красного нет.
# Нумерация — по греческой главе: 10:1 = csl/ru 9:38 («и во всех сих мы полагаем
# завет»), 10:2 = csl/ru 10:1 (Неемия, сын Ахалии); дальше весь список на стих
# сдвинут относительно csl/ru. Отмечено в notes.
# 〔…〕 нет: на месте каждого стиха в gr-lxx-byz есть текст.
# Сносок ⟨…⟩ нет: 契約, 十分の一, 初穂, 燔祭, 安息日 уже в корпусе.
# Имена — транслитерация греческого (LXX), известные — в принятой форме.

tr_code: jp-box
book: neem
chapter: 10
draft: true

verses:
  1: "このすべてのことのゆえに、私たちは堅[かた]い約束[やくそく]をして、それを書[か]き記[しる]す。そして、私たちの長[かしら]たち、レビ人[びと]たち、祭司[さいし]たちがみな、それに印[いん]を押[お]す。"
  2: "印[いん]を押[お]した者[もの]たちは、ネヘミヤ（アハリアの子[こ]）と、セラヤの子[こ]ゼデキヤ、"
  3: "アザルヤ、エレミヤ、"
  4: "パスクル、アマリヤ、マルキヤ、"
  5: "アトス、シェバニヤ、マルク、"
  6: "ハリム、メラモト、オバデヤ、"
  7: "ダニエル、ギナトン、バルク、"
  8: "メシュラム、アビヤ、ミヤミン、"
  9: "マアジヤ、ベルガイ、シェマヤ。これらは祭司[さいし]たちである。"
  10: "レビ人[びと]たちは、アザニヤの子[こ]イエシュア、ヘナダドの子[こ]らのうちのバナイ、カドミエル、"
  11: "また彼[かれ]の兄弟[きょうだい]たち、シェバニヤ、オドヤ、クリタ、ペラヤ、ハナン、"
  12: "ミカ、レホブ、ハシャビヤ、"
  13: "ザクル、サラビヤ、シェバニヤ、"
  14: "オドヤ、バヌナイの子[こ]らである。"
  15: "民[たみ]の長[かしら]たちは、パロシュ、パハト・モアブ、エラム、ザトゥア、"
  16: "バニの子[こ]ら、アスガド、ベバイ、"
  17: "エダニヤ、バゴイ、エディン、"
  18: "アテル、エゼキヤ、アズル、"
  19: "オドヤ、エサム、ベシ、"
  20: "アリフ、アナトト、ノバイ、"
  21: "マガピ、メシュラム、ヘジル、"
  22: "マセゼベル、サドク、イェドゥア、"
  23: "ファルティヤ、ハナン、アナヤ、"
  24: "ホセア、ハナニヤ、ハシュブ、"
  25: "アロエス、ファライ、ショベク、"
  26: "ラウム、エサバナ、マアセヤ、"
  27: "またアヒヤ、アイナン、エナン、"
  28: "マルク、ハリム、バアナ。"
  29: "そのほかの民[たみ]、祭司[さいし]たち、レビ人[びと]たち、門衛[もんえい]たち、歌[うた]い手[て]たち、ネティニム、およびその地[ち]のもろもろの民[たみ]から離[はな]れて神[かみ]の律法[りっぽう]に加[くわ]わった者[もの]たち、その妻[つま]たち、息子[むすこ]たち、娘[むすめ]たち、すなわち、知[し]って理解[りかい]できる者[もの]たちすべては、"
  30: "兄弟[きょうだい]たちとともに固[かた]く立[た]ち、呪[のろ]いをかけて誓[ちか]いを立て、神[かみ]のしもべモーセの手[て]によって与[あた]えられた神[かみ]の律法[りっぽう]に従[したが]って歩[あゆ]み、私たちの主[しゅ]のすべての戒[いまし]めとその裁[さば]きを守[まも]り行[おこな]うことにした。"
  31: "私たちは、自分[じぶん]の娘[むすめ]たちをその地[ち]のもろもろの民[たみ]に与[あた]えず、彼[かれ]らの娘[むすめ]たちを自分[じぶん]の息子[むすこ]たちに迎[むか]えない。"
  32: "その地[ち]のもろもろの民[たみ]が安息日[あんそくび]に商品[しょうひん]やあらゆる品物[しなもの]を携[たずさ]えて来[き]て売[う]るとき、私たちは安息日[あんそくび]にも聖[せい]なる日[ひ]にも彼[かれ]らから買[か]わない。また、第七[だいしち]年[ねん]には土地[とち]を休[やす]ませ、すべていかなる手[て]の負[お]いも免除[めんじょ]する。"
  33: "私たちはまた、自分[じぶん]たちに掟[おきて]を定[さだ]めて、私たちの神[かみ]の家[いえ]の務[つと]めのために、年[とし]ごとにディドラクマの三分[さんぶん]の一[いち]を納[おさ]めることにした。"
  34: "すなわち、供[そな]えのパン、絶[た]え間[ま]ない捧[ささ]げ物[もの]、絶[た]え間[ま]ない燔祭[はんさい]、安息日[あんそくび]、新月[しんげつ]、もろもろの祭[まつ]りのため、聖[せい]なるもののため、またイスラエルのために罪[つみ]の贖[あがな]いをするための犠牲[ぎせい]、および私たちの神[かみ]の家[いえ]の仕事[しごと]のためである。"
  35: "私たちは、祭司[さいし]たち、レビ人[びと]たち、民[たみ]のために、父[ちち]の家[いえ]ごとに、私たちの神[かみ]の家[いえ]に薪[たきぎ]を運[はこ]ぶ務[つと]めについてくじを引[ひ]き、年[とし]ごとに定[さだ]められた時[とき]に、私たちの神[かみ]である主[しゅ]の祭壇[さいだん]の上[うえ]で燃[も]やすことにした。それは律法[りっぽう]に記[しる]されているとおりである。"
  36: "また、私たちの地[ち]の初穂[はつほ]と、あらゆる木[き]の実[み]の初穂[はつほ]を、年[とし]ごとに主[しゅ]の家[いえ]に運[はこ]ぶことにした。"
  37: "また、律法[りっぽう]に記[しる]されているとおり、私たちの息子[むすこ]たちと家畜[かちく]の初子[ういご]、および私たちの牛[うし]の群[む]れと羊[ひつじ]の群[む]れの初子[ういご]を、私たちの神[かみ]の家[いえ]で務[つと]めをする祭司[さいし]たちのもとへ運[はこ]ぶことにした。"
  38: "私たちはまた、私たちの穀物[こくもつ]の初穂[はつほ]と、あらゆる木[き]の実[み]、ぶどう酒[しゅ]、油[あぶら]を、私たちの神[かみ]の家[いえ]の宝物庫[たからものこ]に納[おさ]める祭司[さいし]たちに運[はこ]び、私たちの地[ち]の十分[じゅうぶん]の一[いち]をレビ人[びと]たちに与[あた]える。レビ人[びと]たちは、私たちが働[はたら]くすべての町[まち]で十分[じゅうぶん]の一[いち]を受[う]け取[と]る者[もの]たちである。"
  39: "祭司[さいし]のうちアロンの子[こ]である者[もの]が、レビ人[びと]たちが十分[じゅうぶん]の一[いち]を取[と]る時[とき]にレビ人[びと]とともにいる。そして、レビ人[びと]たちはその十分[じゅうぶん]の一[いち]の十分[じゅうぶん]の一[いち]を、私たちの神[かみ]の家[いえ]の倉[くら]へ運[はこ]び上[のぼ]る。"
  40: "というのは、イスラエルの子[こ]らとレビの子[こ]らは、穀物[こくもつ]、ぶどう酒[しゅ]、油[あぶら]の初穂[はつほ]を宝物庫[たからものこ]に運[はこ]び、そこに聖[せい]なる器[うつわ]、務[つと]めをする祭司[さいし]たち、門衛[もんえい]たち、歌[うた]い手[て]たちがいるからである。私たちは私たちの神[かみ]の家[いえ]を捨[す]て去[さ]らない。"

notes:
  1: "ἐν πᾶσι τούτοις — при всём этом. διατιθέμεθα πίστιν — заключаем верное обязательство (πίστις здесь «верность, договор»); слав. «полагаем завет верен». γράφομεν — пишем. ἐπισφραγίζουσιν — запечатывают, ставят печать (ἐπισφραγίζω). В csl/ru этот стих — 9:38: в слав. делении он завершает 9-ю главу, в гр. открывает 20-ю (нашу 10-ю)."
  2: "ἐπὶ τῶν σφραγιζόντων — «из запечатывающих», т.е. список подписавших. Νεεμιας υἱὸς Αχαλια — Неемия, сын Ахалии (アハリア; слав. «артасаста сын ахалиев» — «тиршата» понято как имя). Σεδεκιας — Седекия. Гр. ставит «сын Сераии» в начало ст. 3 (υἱὸς Σαραια), слав. относит к Седекии в ст. 2 — по паритету отнесено к ст. 2 (セラヤの子ゼデキヤ). В csl/ru это 10:1; дальше нумерация сдвинута на стих."
  3: "Αζαρια — Азария (アザルヤ), Ιερμια — Иеремия (エレミヤ). В гр. стих начинается словами υἱὸς Σαραια («сын Сераии»), которые по смыслу относятся к Седекии и переданы в ст. 2. В csl/ru это 10:2."
  4: "Φασουρ — Пашхур (パスクル, форма 1 Пар 9:12), Αμαρια — Амария (アマリヤ), Μελχια — Малхия (マルキヤ; слав. «мелхиа»)."
  5: "Ατους — Хаттуш (アトス; слав. «аттус»), Σεβανι — Шевания (シェバニヤ), Μαλουχ — Маллух (マルク; слав. «маллух»)."
  6: "Ιραμ — Харим (ハリム; слав. «ирам»), Μεραμωθ — Меремоф (メラモト), Αβδια — Овадия (オバデヤ; слав. «авдиа»)."
  7: "Δανιηλ — Даниил, Γαναθων — Гиннефон (ギナトン; слав. «ганафон»), Βαρουχ — Варух (バルク)."
  8: "Μεσουλαμ — Мешуллам (メシュラム), Αβια — Авия (アビヤ), Μιαμιν — Миямин (ミヤミン; слав. «миамин»)."
  9: "Μααζια — Маазия (マアジヤ), Βελγαι — Вилгай (ベルガイ), Σαμαια — Шемаия (シェマヤ). οὗτοι ἱερεῖς — «сии священники»: конец списка священников."
  10: "οἱ Λευῖται — заголовок, レビ人. Ἰησοῦς υἱὸς Αζανια — Иешуа, сын Азании (アザニヤ; слав. «сын азариин» — иное чтение). Βαναιου ἀπὸ υἱῶν Ηναδαδ — Биннуй из сынов Хенадада (バナイ, ヘナダド; слав. «ваней от сынов инададовых»). Καδμιηλ — Кадмиил (カドミエル)."
  11: "οἱ ἀδελφοὶ αὐτοῦ — братья его. Σαβανια — Шевания (シェバニヤ), Ωδουια — Годия (オドヤ), Καλιτα — Клита (クリタ; слав. «калитан»), Φελεια — Фелаия (ペラヤ), Αναν — Ханан (ハナン)."
  12: "Μιχα — Миха (ミカ), Ροωβ — Рехов (レホブ; слав. «роов»), Εσεβιας — Хашавия (ハシャビヤ; слав. «асевиа»)."
  13: "Ζαχωρ — Закхур (ザクル), Σαραβια — Шеревия (サラビヤ), Σεβανια — Шевания (シェバニヤ; в списке второе лицо с этим именем)."
  14: "Ωδουια — Годия (オドヤ), υἱοὶ Βανουναι — сыны Биннуя (バヌナイ; слав. «сынове вануини»). Конец списка левитов."
  15: "ἄρχοντες τοῦ λαοῦ — главы народа (15–28). Φορος — Парош (パロシュ), Φααθμωαβ — Пахаф-Моав (パハト・モアブ), Ηλαμ — Елам (エラム), Ζαθουια — Затфу (ザトゥア). В гр. стих кончается словом υἱοί («сыны»), которое по-японски естественнее отнести к следующему стиху (как в слав.: «сынове ванниины»)."
  16: "Βανι — Ваний (バニ), Ασγαδ — Азгад (アスガド), Βηβαι — Бевай (ベバイ; слав. «вивай»). Слово «сыны» в гр. стоит в конце ст. 15."
  17: "Εδανια — Адония (エダニヤ; слав. читает «ананиа» — иное чтение), Βαγοι — Бигвай (バゴイ), Ηδιν — Адин (エディン)."
  18: "Ατηρ — Атер (アテル), Εζεκια — Езекия (エゼキヤ), Αζουρ — Азур (アズル)."
  19: "Οδουια — Годия (オドヤ), Ησαμ — Хашум (エサム), Βησι — Бецай (ベシ; слав. «висий»)."
  20: "Αριφ — Хариф (アリフ), Αναθωθ — Анафоф (アナトト), Νωβαι — Невай (ノバイ; слав. «новай»)."
  21: "Μαγαφης — Магпиаш (マガピ; слав. «мегафис»), Μεσουλαμ — Мешуллам (メシュラム), Ηζιρ — Хезир (ヘジル; слав. «изир»)."
  22: "Μεσωζεβηλ — Мешезавел (マセゼベル), Σαδδουκ — Садок (サドク), Ιεδδουα — Иаддуй (イェドゥア; слав. «иеддуа»)."
  23: "Φαλτια — Фелатия (ファルティヤ), Αναν — Ханан (ハナン), Αναια — Анаия (アナヤ; слав. «анаиа»)."
  24: "Ωσηε — Осия (ホセア), Ανανια — Ханания (ハナニヤ), Ασουβ — Хашшув (ハシュブ; слав. «асув»)."
  25: "Αλωης — Халлохеш (アロエス; слав. читает «адой», ru «Лохеш» — расхождение), Φαλαι — Пилха (ファライ; слав. «фалаа»), Σωβηκ — Шовек (ショベク)."
  26: "Ραουμ — Рехум (ラウム), Εσαβανα — Хашавна (エサバナ; слав. «ессавана»), Μαασαια — Маасея (マアセヤ)."
  27: "Αια — Ахия (アヒヤ), Αιναν — Ханан (アイナン; слав. «енан»), Ηναν — Анан (エナン; слав. «инам»). Слав. начинает стих с «и» (καί в гр. тоже есть)."
  28: "Μαλουχ — Маллух (マルク), Ηραμ — Харим (ハリム), Βαανα — Баана (バアナ). Конец списка глав народа."
  29: "οἱ κατάλοιποι τοῦ λαοῦ — остальные из народа. οἱ ναθινιμ — храмовые служители (ネティニム, ср. 3:26). ὁ προσπορευόμενος ἀπὸ λαῶν τῆς γῆς πρὸς νόμον τοῦ θεοῦ — приставший из народов земли к закону Божию (προσπορεύομαι). πᾶς ὁ εἰδὼς καὶ συνίων — всякий знающий и понимающий; стих обрывается, сказуемое — в 30."
  30: "ἐνίσχυον ἐπὶ τοὺς ἀδελφοὺς αὐτῶν — крепились, стояли твёрдо с братьями своими (ἐνισχύω). κατηράσαντο αὐτούς — прокляли их, т.е. произнесли проклятие над собою в случае измены (καταράομαι); слав. «заклинаша их». εἰσήλθοσαν ἐν ἀρᾷ καὶ ἐν ὅρκῳ — вошли в проклятие и клятву (ἀρά, ὅρκος). ὃς ἐδόθη ἐν χειρὶ Μωυσῆ — который дан рукою Моисея."
  31: "τοῦ μὴ δοῦναι θυγατέρας ἡμῶν τοῖς λαοῖς τῆς γῆς — не отдавать дочерей наших народам земли. τὰς θυγατέρας αὐτῶν οὐ λημψόμεθα — дочерей их не возьмём (λαμβάνω, буд. вр.)."
  32: "οἱ φέροντες τοὺς ἀγορασμοὺς καὶ πᾶσαν πρᾶσιν — приносящие товары и всякую продажу (ἀγορασμός, πρᾶσις). ἐν ἡμέρᾳ τοῦ σαββάτου ἀποδόσθαι — чтобы продать в день субботний. ἀνήσομεν τὸ ἔτος τὸ ἕβδομον — оставим (освободим) седьмой год (ἀνίημι). ἀπαίτησιν πάσης χειρός — взыскание всякой руки, т.е. всякий долг; слав. «даяние всех рук»."
  33: "στήσομεν ἐφ᾽ ἡμᾶς ἐντολάς — поставим на себя заповеди, обяжемся. τρίτον τοῦ διδράχμου κατ᾽ ἐνιαυτόν — треть дидрахмы в год (διδράχμον — двойная драхма, храмовая подать); слав. «третию часть дидрахмы», ru «по трети сикля». εἰς δουλείαν οἴκου θεοῦ — на служение дома Бога."
  34: "ἄρτοι τοῦ προσώπου — хлебы предложения (供えのパン; ср. 1 Пар 9:32). θυσία τοῦ ἐνδελεχισμοῦ — жертва постоянная (ἐνδελεχισμός), 絶え間ない捧げ物. ὁλοκαύτωμα τοῦ ἐνδελεχισμοῦ — постоянное всесожжение. νουμηνίαι — новомесячия (新月). τὰ ἅγια — святыни, священные вещи. τὰ περὶ ἁμαρτίας ἐξιλάσασθαι περὶ Ισραηλ — жертвы за грех, чтобы умилостивить за Израиля."
  35: "κλῆροι ξυλοφορίας — жребии о ношении дров (ξυλοφορία). οἱ ἱερεῖς καὶ οἱ Λευῖται καὶ ὁ λαός — три сословия участвуют в жребии. εἰς οἶκον πατριῶν ἡμῶν — по домам отцов наших. εἰς καιροὺς ἀπὸ χρόνων — в сроки, из года в год. ἐκκαῦσαι ἐπὶ τὸ θυσιαστήριον — сожигать на жертвеннике (ἐκκαίω). ὡς γέγραπται ἐν τῷ νόμῳ — как написано в законе."
  36: "πρωτογενήματα τῆς γῆς — первые плоды земли (πρωτογένημα), 初穂. πρωτογενήματα καρποῦ παντὸς ξύλου — первые плоды всякого дерева. ἐνιαυτὸν κατ᾽ ἐνιαυτόν — год за годом."
  37: "τὰ πρωτότοκα υἱῶν ἡμῶν καὶ κτηνῶν — первородное из сыновей и скотов (πρωτότοκος). τὰ πρωτότοκα βοῶν καὶ ποιμνίων — первородное из волов и стад. τοῖς ἱερεῦσιν τοῖς λειτουργοῦσιν — священникам, служащим (λειτουργέω) в доме Бога."
  38: "ἀπαρχὴ σίτων — начаток хлебов, т.е. зерна (ἀπαρχή, σῖτος). γαζοφυλάκιον — сокровищница, кладовая (γαζοφυλάκιον); 宝物庫. δεκάτη γῆς — десятина земли. οἱ Λευῖται δεκατοῦντες — левиты, берущие десятину (δεκατόω); слав. «десятину приемлют»."
  39: "ὁ ἱερεὺς υἱὸς Ααρων — священник, сын Аарона. ἐν τῇ δεκάτῃ τοῦ Λευίτου — при десятине левита, т.е. когда левиты собирают десятину. δεκάτη τῆς δεκάτης — десятина десятины. εἰς τὰ γαζοφυλάκια — в кладовые; 倉. Гр. повторяет «в дом Бога нашего» дважды (εἰς οἶκον θεοῦ ἡμῶν εἰς τὰ γαζοφυλάκια εἰς οἶκον τοῦ θεοῦ), в переводе повтор снят."
  40: "εἰς τοὺς θησαυρούς — в сокровищницы. ἀπαρχαὶ τοῦ σίτου καὶ τοῦ οἴνου καὶ τοῦ ἐλαίου — начатки хлеба, вина и елея (初穂). σκεύη τὰ ἅγια — священные сосуды. οἱ ἱερεῖς οἱ λειτουργοί — священники-служители. οὐκ ἐγκαταλείψομεν τὸν οἶκον τοῦ θεοῦ ἡμῶν — не оставим дома Бога нашего (ἐγκαταλείπω); 捨て去らない."
