# jp-box, Евангелие от Марка, глава 3. Переписано по новому конвейеру.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# jp-ni не использовался.
# Слова Христа — красным; слова фарисеев, родных, книжников и нечистых духов — нет.

tr_code: jp-box
book: mk
chapter: 3
draft: true

verses:
  1: "イエスはまた会堂[かいどう]に入[はい]られた。そこに、片手[かたて]の萎[な]えた人[ひと]がいた。"
  2: "人々[ひとびと]は、イエスを訴[うった]えるために、安息日[あんそくび]にこの人[ひと]を癒[いや]すかどうかと、じっと見[み]ていた。"
  3: "イエスは手[て]の萎[な]えた人[ひと]に言[い]われた。「<j>真[ま]ん中[なか]に立[た]ちなさい。</j>」"
  4: "そして彼[かれ]らに言[い]われた。「<j>安息日[あんそくび]に善[ぜん]を行[おこな]うこと、悪[あく]を行[おこな]うこと、命[いのち]を救[すく]うこと、殺[ころ]すことは、許[ゆる]されているか。</j>」しかし、彼[かれ]らは黙[だま]ったままであった。"
  5: "イエスは怒[いか]りを込[こ]めて彼[かれ]らを一人[ひとり]ひとり見回[みまわ]し、その心[こころ]の頑[かたくな]さを悲[かな]しまれて、その人[ひと]に言[い]われた。「<j>手[て]を伸[の]ばしなさい。</j>」その人[ひと]が手[て]を伸[の]ばすと、手[て]は元[もと]どおりになった〔、もう一方[いっぽう]の手[て]と同[おな]じように〕。"
  6: "ファリサイ派[は]の人々[ひとびと]は外[そと]へ出[で]ると、すぐにヘロデ派[は]の者[もの]たちと図[はか]って、どうやってイエスを殺[ころ]そうかと相談[そうだん]を始[はじ]めた。"
  7: "イエスは弟子[でし]たちと一緒[いっしょ]に湖[みずうみ]のほうへ退[しりぞ]かれた。すると、ガリラヤから大勢[おおぜい]の人々[ひとびと]が従[したが]って来[き]た。また、ユダヤから、"
  8: "エルサレムから、イドマヤから、ヨルダン川[がわ]の向[む]こう岸[ぎし]から、またティルスやシドンの周辺[しゅうへん]からも、大勢[おおぜい]の人[ひと]が、イエスのなさっていることを聞[き]いて、そのもとへ来[き]た。"
  9: "イエスは、群衆[ぐんしゅう]に押[お]しつぶされないようにと、小舟[こぶね]をそばに用意[ようい]しておくよう弟子[でし]たちに言[い]われた。"
  10: "イエスが多[おお]くの人[ひと]を癒[いや]されたので、病[やまい]を抱[かか]える者[もの]たちは皆[みな]、イエスに触[さわ]ろうとして押[お]し寄[よ]せていたからである。"
  11: "汚[けが]れた霊[れい]たちは、イエスを見[み]るたびにその足[あし]もとにひれ伏[ふ]し、叫[さけ]んで言[い]った。「あなたこそ神[かみ]の子[こ]である。」"
  12: "しかしイエスは、ご自分[じぶん]のことを明[あき]らかにしないようにと、彼[かれ]らを厳[きび]しく戒[いまし]められた。"
  13: "イエスは山[やま]に登[のぼ]り、ご自身[じしん]のお望[のぞ]みになっている者[もの]たちを呼[よ]ばれた。すると、彼[かれ]らはイエスのもとへ来[き]た。"
  14: "そして十二人[じゅうににん]を定[さだ]め〔、使徒[しと]とも名[な]づけ〕られた。それは、彼[かれ]らをご自身[じしん]と一緒[いっしょ]に置[お]き、宣[の]べ伝[つた]えさせるために遣[つか]わすためであった。"
  15: "また、〔病[やまい]を癒[いや]し、〕悪霊[あくりょう]を追[お]い出[だ]す権威[けんい]を持[も]たせるためでもあった。"
  16: "シモンにはペトロという名[な]を与[あた]え、"
  17: "ゼベダイの子[こ]ヤコブと、ヤコブの兄弟[きょうだい]ヨハネにボアネルゲスという名[な]を与[あた]えられた。これは「雷[かみなり]の子[こ]」という意味[いみ]である。"
  18: "さらに、アンデレ、フィリポ、バルトロマイ、マタイ、トマス、アルファイの子[こ]ヤコブ、タダイ、そして「熱心党[ねっしんとう]」と呼[よ]ばれたシモン、"
  19: "そしてイスカリオテのユダ。このユダがイエスを裏切[うらぎ]った者[もの]である。"
  20: "イエスは家[いえ]に入[はい]られた。すると、また群衆[ぐんしゅう]が集[あつ]まって来[き]て、イエスたちはパンを食[た]べることもできないほどであった。"
  21: "イエスの身内[みうち]の者[もの]たちはこれを聞[き]いて、イエスを連[つ]れ戻[もど]そうと出[で]て来[き]た。「あの人[ひと]は気[き]が変[へん]になった」と言[い]っていたからである。"
  22: "エルサレムから下[くだ]って来[き]た律法学者[りっぽうがくしゃ]たちは、「あの人[ひと]はベルゼブルに憑[つ]かれている」とか、「悪霊[あくりょう]の頭[かしら]の力[ちから]で悪霊[あくりょう]を追[お]い出[だ]しているのだ」と言[い]った。"
  23: "イエスは彼[かれ]らを呼[よ]び寄[よ]せて、たとえを語[かた]られた。「<j>サタンがどうしてサタンを追[お]い出[だ]せるだろうか。</j>」"
  24: "「<j>国[くに]が内輪[うちわ]で分裂[ぶんれつ]すれば、その国[くに]は立[た]ち行[ゆ]くことができない。</j>"
  25: "<j>家[いえ]が内輪[うちわ]で分裂[ぶんれつ]すれば、その家[いえ]も立[た]ち行[ゆ]くことができない。</j>"
  26: "<j>サタンが自分[じぶん]に逆[さか]らって分裂[ぶんれつ]したのなら、立[た]ち行[ゆ]くことはできず、それで終[お]わりである。</j>」"
  27: "「<j>だれも、まず強[つよ]い者[もの]を縛[しば]らないかぎり、その家[いえ]に入[はい]って家財[かざい]を奪[うば]うことはできない。縛[しば]ってしまえば、その家[いえ]を奪[うば]うことができる。</j>」"
  28: "「<j>はっきり言[い]っておく。人々[ひとびと]の犯[おか]す罪[つみ]は、どんな冒涜[ぼうとく]の言葉[ことば]であれ、すべて赦[ゆる]される。</j>"
  29: "<j>しかし、{聖霊[せいれい]|聖神[せいしん]}を冒涜[ぼうとく]する者[もの]は、永遠[えいえん]に赦[ゆる]されない。永遠[えいえん]の罪[つみ]の責[せき]を負[お]うのである。</j>」"
  30: "「あの人[ひと]は汚[けが]れた霊[れい]に憑[つ]かれている」と彼[かれ]らが言[い]ったからである。"
  31: "やがて、イエスの母[はは]と兄弟[きょうだい]たちが来[き]て、外[そと]に立[た]ち、人[ひと]を遣[つか]わしてイエスを呼[よ]ばせた。"
  32: "イエスの周[まわ]りには群衆[ぐんしゅう]が座[すわ]っていた。人々[ひとびと]が言[い]った。「ご覧[らん]なさい。あなたの母[はは]と兄弟[きょうだい]たち〔、姉妹[しまい]たち〕が外[そと]にいて、あなたを捜[さが]しています。」"
  33: "イエスは答[こた]えられた。「<j>わたしの母[はは]、わたしの兄弟[きょうだい]とはだれのことか。</j>」"
  34: "そして、周[まわ]りに座[すわ]っている人々[ひとびと]をぐるりと見回[みまわ]して言[い]われた。「<j>ごらん、わたしの母[はは]、わたしの兄弟[きょうだい]たちだ。</j>"
  35: "<j>神[かみ]の御心[みこころ]を行[おこな]う者[もの]こそ、わたしの兄弟[きょうだい]、姉妹[しまい]、母[はは]である。</j>」"

notes:
  2: "κατηγορήσωσιν — «чтобы обвинить»; 訴える. Наблюдатели — вне красного, это не их речь."
  4: "ἀγαθὸν ποιῆσαι ἢ κακοποιῆσαι — «сделать доброе или злое»; 善を行う…悪を行う. Вопрос без «что легче» — четыре инфинитива подряд, поэтому 許されているか, без добавленного どちら. οἱ δὲ ἐσιώπων — 黙ったままであった."
  5: "πώρωσις — «ожесточение, окаменение»; 心の頑なさ. В критическом тексте рука просто восстановлена; Церковь (TR, jp-joc 「其の手は健になりしこと、他の手の如し」) читает ὑγιὴς ὡς ἡ ἄλλη — 〔、もう一方の手と同じように〕."
  6: "Ἡρῳδιανοί — ヘロデ派 (как в Мф 22:16). συμβούλιον ἐδίδουν — «держали совет»; 相談を始めた."
  8: "Τύρος, Σιδών — ティルス, シドン (как в Мф 11:21, 15:21)."
  11: "Слова нечистых духов — не красным. Σὺ εἶ ὁ υἱὸς τοῦ θεοῦ — あなたこそ神の子である."
  14: "В критическом тексте καὶ ἀποστόλους ὠνόμασεν в квадратных скобках; Церковь читает — 〔、使徒とも名づけ〕."
  15: "θεραπεύειν τὰς νόσους в критическом тексте отсутствует, Церковь читает (TR, jp-joc 「權を以て病を醫し」) — 〔病を癒し、〕. ἐξουσία — 権威, как в 1:22,27."
  16: "В византийском здесь повторено καὶ ἐποίησεν τοὺς δώδεκα («поставил двенадцать»); по-японски повтор опущен, чтобы не дробить перечень. ὄνομα τῷ Σίμωνι Πέτρον — シモンにはペトロという名を与え."
  17: "Βοανηργές — «сыны грома»; имя оставлено транслитерацией, перевод дан в тексте. У jp-joc ワォアネルゲス, орфография приведена к современной."
  19: "Ἰσκαριώθ передано イスカリオテ — форма, принятая в книге (ср. Мф 10:4)."
  21: "οἱ παρ᾽ αὐτοῦ — «Его близкие»; 身内の者たち. ἐξέστη — «вышел из себя»; 気が変になった. Речь родных — не красным."
  22: "Βεελζεβούλ — ベルゼブル (как в Мф 10:25). ἄρχων τῶν δαιμονίων — 悪霊の頭."
  26: "ἀνέστη ἐφ᾽ ἑαυτόν — «восстал на себя»; 自分に逆らって. τέλος ἔχει — それで終わりである."
  27: "τὰ σκεύη — «утварь, добро»; 家財 (не «мебель»). Речь Христа открывается здесь и закрывается в этом же стихе, далее 28–29 — новое изречение."
  28: "τοῖς υἱοῖς τῶν ἀνθρώπων — «сынам человеческим», т.е. людям; передано 人々, чтобы не путать с 人の子 (ὁ υἱὸς τοῦ ἀνθρώπου)."
  29: "αἰωνίου ἁμαρτήματος — «вечного греха»; 永遠の罪の責を負う. {聖霊｜聖神} — пара для кнопки 伝統表記."
  31: "ἀπέστειλαν πρὸς αὐτὸν καλοῦντες — «послали за Ним, зовя»; 人を遣わしてイエスを呼ばせた."
  32: "В византийском тексте сайта только ἀδελφοί; Церковь читает καὶ αἱ ἀδελφαί σου (Елизаветинская «и сестры твоя», Синодальный «и сестры Твои»), в критическом тексте этого нет — 〔、姉妹たち〕. jp-joc сестёр не называет, но основа — текст Церкви."
  34: "περιβλεψάμενος … κύκλῳ καθημένους — «обведя взглядом сидящих вокруг»; ぐるりと見回して."
  35: "τὸ θέλημα τοῦ θεοῦ — 神の御心. Речь Христа открывается в 34 и закрывается здесь."
