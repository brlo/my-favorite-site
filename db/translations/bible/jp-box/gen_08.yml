# jp-box, Бытие, глава 8. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru),
# русский Синодальный (ru) и jp-joc (1901, public domain).
# Язык — современный 常体, без 文語; порядок членов и деление на клаузы — по греческому.
# Глава 8: вода спадает (1–5), ворон и голубь (6–12), земля высыхает (13–14),
# выход из ковчега (15–19), жертвенник и обетование (20–22).
# Красного и синего нет; речь Бога — 「…」 (16–17), слова Бога в 21–22 — тоже 「…」.
# 〔…〕 нет: все слова есть в gr-lxx-byz. 8:5 — LXX «в одиннадцатый месяц», слав. и Син. —
# десятый; следуем LXX. 8:4 — LXX 27-й день, Синодальный 17-й.
# Сноска ⟨…⟩ одна: 燔祭 (8:20, первое место в корпусе).
# jp-ni не использовался.

tr_code: jp-box
book: gen
chapter: 8
draft: true

verses:
  1: "神[かみ]はノアと、彼[かれ]とともに箱舟[はこぶね]にいたすべての獣[けもの]、すべての家畜[かちく]、すべての鳥[とり]、すべての這[は]うものを思[おも]い起[お]こされた。神[かみ]は地[ち]に風[かぜ]を吹[ふ]かせ、水[みず]は静[しず]まった。"
  2: "深[ふか]い淵[ふち]の源[みなもと]と天[てん]の窓[まど]は閉[と]ざされ、雨[あめ]は天[てん]から止[や]んだ。"
  3: "水[みず]は地[ち]から退[しりぞ]き続[つづ]け、百五十日[ひゃくごじゅうにち]の後[のち]、水[みず]は減[へ]っていった。"
  4: "箱舟[はこぶね]は第七[だいしち]の月[つき]の二十七日[にじゅうしちにち]に、アララトの山[やま]の上[うえ]に止[と]まった。"
  5: "水[みず]は第十[だいじゅう]の月[つき]まで減[へ]り続[つづ]け、第十一[だいじゅういち]の月[つき]の一日[ついたち]に、山[やま]の頂[いただき]が現[あらわ]れた。"
  6: "四十日[しじゅうにち]の後[のち]、ノアは自分[じぶん]が箱舟[はこぶね]に造[つく]った窓[まど]を開[ひら]き、"
  7: "からすを放[はな]った。それは出[で]て行[い]ったきり、水[みず]が地[ち]から乾[かわ]くまで戻[もど]らなかった。"
  8: "ノアはまた、水[みず]が地[ち]の面[おもて]から引[ひ]いたかどうかを見[み]るために、鳩[はと]を放[はな]った。"
  9: "鳩[はと]は足[あし]を休[やす]める所[ところ]を見[み]つけられず、ノアのところへ戻[もど]って来[き]た。地[ち]の全面[ぜんめん]に水[みず]があったからである。ノアは手[て]を伸[の]べて鳩[はと]を取[と]り、箱舟[はこぶね]の中[なか]の自分[じぶん]のところに入[い]れた。"
  10: "さらに七[なな]日[にち]待[ま]って、ノアは再[ふたた]び鳩[はと]を箱舟[はこぶね]から放[はな]った。"
  11: "夕方[ゆうがた]になると、鳩[はと]はノアのところへ戻[もど]って来[き]た。その口[くち]には、オリーブの葉[は]があった。ノアは、水[みず]が地[ち]から引[ひ]いたことを知[し]った。"
  12: "さらに七[なな]日[にち]待[ま]って、ノアは鳩[はと]を放[はな]った。しかし、鳩[はと]はもう戻[もど]って来[こ]なかった。"
  13: "ノアの生涯[しょうがい]の六百一[ろっぴゃくいち]年[ねん]、第一[だいいち]の月[つき]の一日[ついたち]に、水[みず]は地[ち]から引[ひ]いた。ノアは箱舟[はこぶね]の屋根[やね]を開[ひら]き、水[みず]が地[ち]の面[おもて]から引[ひ]いたのを見[み]た。"
  14: "第二[だいに]の月[つき]の二十七日[にじゅうしちにち]に、地[ち]は乾[かわ]いた。"
  15: "主[しゅ]なる神[かみ]はノアに言[い]われた。"
  16: "「箱舟[はこぶね]から出[で]よ。あなたと、あなたの妻[つま]、あなたの息子[むすこ]たち、息子[むすこ]たちの妻[つま]たちが、ともに。"
  17: "あなたとともにいるすべての獣[けもの]、すべての肉[にく]、鳥[とり]から家畜[かちく]まで、地[ち]を這[は]うすべてのものを、あなたとともに連[つ]れ出[だ]せ。それらは地[ち]の上[うえ]で増[ふ]え、多[おお]くなれ。」"
  18: "ノアは、その息子[むすこ]たち、妻[つま]、息子[むすこ]たちの妻[つま]たちとともに出[で]た。"
  19: "すべての獣[けもの]、すべての家畜[かちく]、すべての鳥[とり]、地[ち]を這[は]うすべてのものは、その種類[しゅるい]に従[したが]って箱舟[はこぶね]から出[で]た。"
  20: "ノアは神[かみ]のために祭壇[さいだん]を築[きず]き、すべての清[きよ]い家畜[かちく]とすべての清[きよ]い鳥[とり]から取[と]って、祭壇[さいだん]の上[うえ]に燔祭[はんさい]⟨焼[や]き尽[つ]くす供[そな]え物[もの]。獣[けもの]を丸[まる]ごと焼[や]いて神[かみ]に捧[ささ]げる。⟩を捧[ささ]げた。"
  21: "主[しゅ]なる神[かみ]はかんばしい香[かお]りを嗅[か]がれた。主[しゅ]なる神[かみ]は心[こころ]に考[かんが]えて言[い]われた。「わたしはもう、人[ひと]の業[わざ]のゆえに地[ち]を呪[のろ]わない。人[ひと]の心[こころ]の図[はか]りごとは、幼[おさな]いときから悪[あく]に傾[かたむ]いているからである。わたしはもう、かつてしたように、すべての生[い]きる肉[にく]を打[う]たない。"
  22: "地[ち]の続[つづ]く限[かぎ]り、種[たね]蒔[ま]きと刈[か]り入[い]れ、寒[さむ]さと暑[あつ]さ、夏[なつ]と春[はる]、昼[ひる]と夜[よる]は、決[けっ]して止[や]まない。」"

notes:
  1: "ἐμνήσθη ὁ θεὸς τοῦ Νωε — 神はノアを思い起こされた (μιμνήσκομαι). ἐπήγαγεν πνεῦμα — 風を吹かせた (πνεῦμα здесь «ветер»; слав. «дух»). ἐκόπασεν τὸ ὕδωρ — 水は静まった (κοπάζω)."
  2: "ἐπεκαλύφθησαν αἱ πηγαί — 源は閉ざされた (ἐπικαλύπτω). οἱ καταρράκται τοῦ οὐρανοῦ — 天の窓. συνεσχέθη ὁ ὑετός — 雨は止んだ (συνέχω)."
  3: "ἐνεδίδου — 退き続けた (ἐνδίδωμι, «уступать»). ἠλαττονοῦτο — 減っていった (ἐλαττονόω). μετὰ πεντήκοντα καὶ ἑκατὸν ἡμέρας — 百五十日の後."
  4: "ἐκάθισεν ἡ κιβωτός — 箱舟は止まった (καθίζω, «сесть»). μηνὶ τῷ ἑβδόμῳ, ἑβδόμῃ καὶ εἰκάδι — 七月の二十七日 (LXX; масоретский/Син. — 17-й день). ὄρη τὰ Αραρατ — アララトの山."
  5: "ἕως τοῦ δεκάτου μηνός — 十月まで. ἐν δὲ τῷ ἑνδεκάτῳ μηνί, τῇ πρώτῃ — 十一月の一日 (LXX; слав. и Син. — десятый месяц). αἱ κεφαλαὶ τῶν ὀρέων — 山の頂."
  6: "θυρίδα — 窓 (θυρίς, «оконце»). ἣν ἐποίησεν — 自分が造った."
  7: "τὸν κόρακα — からす. τοῦ ἰδεῖν εἰ κεκόπακεν — 水が引いたかを見るため. ἐξελθὼν οὐχ ὑπέστρεψεν — 出て行ったきり戻らなかった (ἕως — «до тех пор, пока»)."
  8: "τὴν περιστεράν — 鳩. ὀπίσω αὐτοῦ — その後を追わせて (слав. «по нем»)."
  9: "ἀνάπαυσιν τοῖς ποσίν — 足を休める所 (ἀνάπαυσις). ἐκτείνας τὴν χεῖρα — 手を伸べて. εἰσήγαγεν — 入れた."
  10: "ἐπισχὼν ἔτι ἡμέρας ἑπτὰ ἑτέρας — さらに七日待って (ἐπέχω)."
  11: "τὸ πρὸς ἑσπέραν — 夕方に (ἑσπέρα). φύλλον ἐλαίας κάρφος — オリーブの葉 (κάρφος — «соломинка, обрывок»; слав. «сучец»)."
  12: "οὐ προσέθετο τοῦ ἐπιστρέψαι — もう戻らなかった (προστίθημι)."
  13: "ἐν τῷ ἑνὶ καὶ ἑξακοσιοστῷ ἔτει — 六百一年. μιᾷ τοῦ μηνός — 一日. ἐξέλιπεν τὸ ὕδωρ — 水は引いた (ἐκλείπω). ἀπεκάλυψεν τὴν στέγην — 屋根を開いた (στέγη — «кровля»)."
  14: "μηνὶ τῷ δευτέρῳ, ἑβδόμῃ καὶ εἰκάδι — 二月の二十七日. ἐξηράνθη ἡ γῆ — 地は乾いた."
  15: "εἶπεν… λέγων — 言われた (λέγων — «говоря»; слав. «глаголя»)."
  16: "Ἔξελθε — 出よ. σὺ καὶ ἡ γυνή σου… — あなたと妻、息子たち、息子たちの妻."
  17: "πᾶσα σὰρξ ἀπὸ πετεινῶν ἕως κτηνῶν — 鳥から家畜までのすべての肉. ἐξάγαγε — 連れ出せ. αὐξάνεσθε καὶ πληθύνεσθε — 増えよ、多くなれ (мн. ч.)."
  18: "ἐξῆλθεν Νωε — ノアは出た."
  19: "κατὰ γένος αὐτῶν — その種類に従って. ἐξήλθοσαν — 出た (форма LXX)."
  20: "θυσιαστήριον — 祭壇 (от θυσία, «жертва»). ὁλοκαρπώσεις — 燔祭 (ὁλοκάρπωσις, «всесожжение»; сноска при первом месте в корпусе). ἀνήνεγκεν — 捧げた. τῷ θεῷ — 神のために (LXX; слав. «Господеви», Син. «Господу» — разночтение)."
  21: "ὠσφράνθη… ὀσμὴν εὐωδίας — かんばしい香りを嗅がれた (ὀσφραίνομαι; εὐωδία — «благоухание»). διανοηθείς — 心に考えて. διὰ τὰ ἔργα τῶν ἀνθρώπων — 人の業のゆえに (LXX; Син. «за человека» — с евр.). ἔγκειται ἡ διάνοια… ἐκ νεότητος — 心の図りごとは幼いときから悪に傾いている (ἔγκειμαι — «лежать, быть присущим»). πατάξαι — 打つ (πατάσσω)."
  22: "σπέρμα καὶ θερισμός — 種蒔きと刈り入れ. ψῦχος καὶ καῦμα — 寒さと暑さ. θέρος καὶ ἔαρ — 夏と春 (ἔαρ — «весна»; слав. «весна», Син. «зима» — с евр.). καταπαύσουσιν — 止む (καταπαύω)."
