verses:
  1: "ヤコブは自分[じぶん]の子[こ]らを呼[よ]んで言[い]った。「集[あつ]まれ。わたしは、後[のち]の日[ひ]々[び]にあなたがたに起[お]こることを告[つ]げよう。"
  2: "ヤコブの子[こ]らよ、集[あつ]まって聞[き]け。あなたがたの父[ちち]イスラエルに聞[き]け。"
  3: "ルベンよ、あなたはわたしの長子[ちょうし]、わたしの力[ちから]、わたしの子[こ]らのはじまり。耐[た]え難[がた]く、また強[ごう]情[じょう]な者[もの]。"
  4: "水[みず]のように荒[あ]れ狂[くる]った。沸[わ]き返[かえ]ってはならない。あなたは父[ちち]の床[とこ]に上[のぼ]ったからである。そのとき、あなたはわたしの寝床[ねどこ]を汚[けが]した。上[のぼ]ったのだ。"
  5: "シメオンとレビは兄弟[きょうだい]。彼[かれ]らは自分[じぶん]の好[この]みによって不正[ふせい]を成[な]し遂[と]げた。"
  6: "わたしの魂[たましい]よ、彼[かれ]らの計[はかり]ごとに入[はい]ってはならない。わたしの肝[きも]よ、彼[かれ]らの集[つど]いに加[くわ]わってはならない。彼[かれ]らは怒[いか]りの中[なか]で人[ひと]を殺[ころ]し、欲情[よくじょう]のままに雄牛[おうし]の腱[けん]を切[き]ったからである。"
  7: "彼[かれ]らの怒[いか]りは呪[のろ]われよ。それは強[ごう]情[じょう]だから。彼[かれ]らの憤[いきどお]りは呪[のろ]われよ。それは固[かた]くなったから。わたしは彼[かれ]らをヤコブの中[なか]で分[わ]け、イスラエルの中[なか]で散[ちら]そう。"
  8: "ユダよ、あなたの兄弟[きょうだい]たちはあなたを賛美[さんび]する。あなたの手[て]は敵[てき]の背[せ]の上[うえ]にある。父[ちち]の子[こ]らはあなたに伏[ふ]して拝[おが]む。"
  9: "ユダは若[わか]い獅子[しし]。子[こ]よ、あなたは若枝[わかえだ]から上[のぼ]って来[き]た。彼[かれ]は身[み]をかがめて、獅子[しし]のように、若[わか]い獅子[しし]のように伏[ふ]して眠[ねむ]った。誰[だれ]が彼[かれ]を起[おこ]こすのか。"
  10: "支配者[しはいしゃ]はユダから離[はな]れず、導[みちび]く者[もの]はそのももから離[はな]れない。彼[かれ]に定[さだ]められたものが来[く]るまで。彼[かれ]こそ諸国[しょこく]の民[たみ]の待[ま]ち望[のぞ]みである。"
  11: "彼[かれ]は自分[じぶん]のろばをぶどうの木[き]に、雌[めす]ろばの子[こ]をぶどうの蔓[つる]に繋[つな]ぐ。彼[かれ]は自分[じぶん]の衣[ころも]をぶどう酒[さけ]で、その装[よそお]いをぶどうの血[ち]で洗[あら]う。"
  12: "その目[め]はぶどう酒[さけ]によって輝[かがや]き、その歯[は]は乳[ちち]よりも白[しろ]い。"
  13: "ゼブルンは海辺[うみべ]に住[す]み、船[ふね]の泊[とま]り場[ば]のそばにいる。その境[さかい]はシドンまで及[およ]ぶ。"
  14: "イッサカルは嗣業[しぎょう]の間[あいだ]に休[やす]みながら、良[よ]いものを望[のぞ]んだ。"
  15: "そして、その休[やす]みが良[よ]いのを見[み]、地[ち]が肥[こ]えているのを見[み]て、その肩[かた]を労苦[ろうく]のために差[さ]し出[だ]し、地[ち]を耕[たがや]す者[もの]となった。"
  16: "ダンは自分[じぶん]の民[たみ]を裁[さば]く。イスラエルの中[なか]の一[ひと]つの部族[ぶぞく]のように。"
  17: "ダンは道[みち]の上[うえ]に伏[ふ]す蛇[へび]、小径[こみち]に潜[ひそ]む蝮[まむし]となれ。馬[うま]のかかとを噛[か]み、乗[の]り手[て]は後[うし]ろに落[お]ちる。"
  18: "わたしは主[しゅ]の救[すく]いを待[ま]ち望[のぞ]む。"
  19: "ガドには略奪[りゃくだつ]の群[む]れが彼[かれ]を襲[おそ]う。しかし彼[かれ]は彼[かれ]らのすぐ後[あと]を追[お]って略奪[りゃくだつ]する。"
  20: "アシェル、そのパンは肥[こ]えており、彼[かれ]は王[おう]たちにごちそうを出[だ]す。"
  21: "ナフタリは放[はな]たれた幹[みき]、その実[み]に美[うつく]しさを与[あた]える者[もの]。"
  22: "ヨセフは育[そだ]てられた子[こ]、育[そだ]てられた、誉[ほま]れ高[たか]い子[こ]、わたしの末[すえ]の子[こ]。わたしのもとへ帰[かえ]れ。"
  23: "彼[かれ]に対して計[はか]りつつ罵[ののし]り、弓[ゆみ]の主[あるじ]たちは彼[かれ]に迫[せま]った。"
  24: "しかし、彼[かれ]らの弓[ゆみ]は力[ちから]をもって砕[くだ]かれ、彼[かれ]らの手[て]の腕[うで]の筋[すじ]は解[と]かれた。ヤコブの強[つよ]き者[もの]の手[て]によって。そこから、イスラエルを強[つよ]くした方[かた]が来[く]る。"
  25: "あなたの父[ちち]の神[かみ]からである。わたしの神[かみ]はあなたを助[たす]け、あなたを祝福[しゅくふく]された。上[うえ]からの天[てん]の祝福[しゅくふく]、すべてを持[も]つ地[ち]の祝福[しゅくふく]をもって。乳[ちち]ぶさと胎[たい]の祝福[しゅくふく]のゆえに、"
  26: "あなたの父[ちち]と母[はは]の祝福[しゅくふく]がある。それは、変[か]わることのない山々[やまやま]の祝福[しゅくふく]、永遠[えいえん]の丘[おか]の祝福[しゅくふく]をしの[いで]て強[つよ]い。それらはヨセフの頭[かしら]と、彼[かれ]が率[ひき]いた兄弟[きょうだい]たちの頂[いただき]の上[うえ]に及[およ]ぶであろう。"
  27: "ベニヤミンは奪[うば]い取[と]る狼[おおかみ]。朝[あさ]には獲物[えもの]を食[く]らい、夕[ゆう]べには分[わ]け与[あた]える。」"
  28: "これらはすべてヤコブの十二[じゅうに]の子[こ]である。彼[かれ]らの父[ちち]は彼[かれ]らにこう語[かた]り、彼[かれ]らを祝福[しゅくふく]した。おのおのをその祝福[しゅくふく]に従[したが]って祝福[しゅくふく]した。"
  29: "彼[かれ]は彼[かれ]らに言[い]った。「わたしはわたしの民[たみ]に加[くわ]えられる。わたしを父[ちち]たちとともに、ヘト人[じん]エフロンの畑[はたけ]にある洞窟[どうくつ]に葬[ほうむ]れ。"
  30: "カナンの地[ち]のマムレの向[む]かいにある二重[にじゅう]の洞窟[どうくつ]、アブラハムがヘト人[じん]エフロンから墓所[ぼしょ]の所有[しょゆう]として買[か]い取[と]った洞窟[どうくつ]である。"
  31: "そこにアブラハムとその妻[つま]サラを葬[ほうむ]り、そこにイサクとその妻[つま]リベカを葬[ほうむ]り、そこにわたしはレアを葬[ほうむ]った。"
  32: "畑[はたけ]と、その中[なか]にある洞窟[どうくつ]は、ヘトの子[こ]らから買[か]ったものである。」"
  33: "ヤコブは子[こ]らに命[めい]じ終[お]えて、足[あし]を床[とこ]に収[おさ]め、息[いき]を引[ひ]き取[と]って、自分[じぶん]の民[たみ]に加[くわ]えられた。"

notes:
  1: "Ἐκάλεσεν… τοὺς υἱοὺς αὐτοῦ — 自分の子らを呼んで. ἐπ᾽ ἐσχάτων τῶν ἡμερῶν — 後の日に (букв. «в последние дни»; слав. «в последния дни»)."
  2: "ἀθροίσθητε καὶ ἀκούσατε — 集まって聞け (ἀθροίζω «собирать»). Двойное ἀκούσατε — 聞け…聞け — сохранено."
  3: "Ρουβην, πρωτότοκός μου σύ — ルベンよ、あなたはわたしの長子. ἰσχύς μου καὶ ἀρχὴ τέκνων μου — わたしの力、わたしの子らのはじまり (ἀρχή «начало»). σκληρὸς φέρεσθαι καὶ σκληρὸς αὐθάδης — 耐え難く、また強情な者 (σκληρός «жёсткий»; αὐθάδης «своевольный»)."
  4: "ἐξύβρισας ὡς ὕδωρ — 水のように荒れ狂った (ὑβρίζω «буйствовать»). μὴ ἐκζέσῃς — 沸き返ってはならない (ἐκζέω «вскипать»; слав. «да не воскипиши»). ἀνέβης ἐπὶ τὴν κοίτην τοῦ πατρός σου — 父の床に上った (κοίτη «ложе»). ἐμίανας τὴν στρωμνήν — 寝床を汚した (στρωμνή «постель»)."
  5: "Συμεων καὶ Λευι ἀδελφοί — シメオンとレビは兄弟. συνετέλεσαν ἀδικίαν ἐξ αἱρέσεως αὐτῶν — 自分の好みによって不正を成し遂げた (αἵρεσις «выбор, умысел»; слав. «от воли своея»)."
  6: "εἰς βουλὴν αὐτῶν μὴ ἔλθοι ἡ ψυχή μου — わたしの魂よ、彼らの計ごとに入ってはならない (βουλή «совет, замысел»). ἐπὶ τῇ συστάσει αὐτῶν μὴ ἐρείσαι τὰ ἥπατά μου — わたしの肝よ、彼らの集いに加わってはならない (ἥπαρ «печень» — средоточие чувств; ἐρείδω «примыкать»). ἐνευροκόπησαν ταῦρον — 雄牛の腱を切った (νευροκοπέω «перерезать жилы»)."
  7: "ἐπικατάρατος ὁ θυμός αὐτῶν — 彼らの怒りは呪われよ (ἐπικατάρατος «проклят»). αὐθάδης — 強情. ἐσκληρύνθη — 固くなった (σκληρύνω). διαμεριῶ… διασπερῶ — 分け…散らそう (διαμερίζω, διασπείρω)."
  8: "Ιουδα, σὲ αἰνέσαισαν οἱ ἀδελφοί σου — ユダよ、あなたの兄弟たちはあなたを賛美する (αἰνέω «хвалить»; оптатив). αἱ χεῖρές σου ἐπὶ νώτου τῶν ἐχθρῶν σου — あなたの手は敵の背の上に (νῶτον «спина»). προσκυνήσουσίν σοι — 伏して拝む."
  9: "σκύμνος λέοντος Ιουδα — ユダは若い獅子 (σκύμνος «львёнок»). ἐκ βλαστοῦ… ἀνέβης — 若枝から上って来た (βλαστός «побег, отросток»; в евр. и ru «с добычи» — иное чтение, не источник). ἀναπεσὼν ἐκοιμήθης ὡς λέων καὶ ὡς σκύμνος — 身をかがめて、獅子のように、若い獅子のように伏して眠った (σκύμνος «львёнок»; в ru «как львица» — масоретское чтение). τίς ἐγερεῖ αὐτόν; — 誰が彼を起こすのか."
  10: "οὐκ ἐκλείψει ἄρχων ἐξ Ιουδα καὶ ἡγούμενος ἐκ τῶν μηρῶν αὐτοῦ — 支配者はユダから離れず、導く者はそのももから離れない (ἄρχων «князь, правитель»; ἡγούμενος «вождь»; в евр. «скипетр» и «законодатель», в ru «Примиритель» — масоретское чтение, не источник; слав. «князь… вождь»). ἕως ἂν ἔλθῃ τὰ ἀποκείμενα αὐτῷ — 彼に定められたものが来るまで (τὰ ἀποκείμενα «отложенное»; слав. «отложеная ему»). αὐτὸς προσδοκία ἐθνῶν — 彼こそ諸国の民の待ち望み (προσδοκία «ожидание»)."
  11: "δεσμεύων πρὸς ἄμπελον τὸν πῶλον αὐτοῦ — 自分のろばをぶどうの木に繋ぐ (ἄμπελος «виноградная лоза»; πῶλος «ослёнок»). τῇ ἕλικι τὸν πῶλον τῆς ὄνου αὐτοῦ — 雌ろばの子をぶどうの蔓に (ἕλιξ «усик, извилина лозы»; ὄνος «ослица»). πλυνεῖ ἐν οἴνῳ τὴν στολήν — 衣をぶどう酒で洗う (πλύνω «мыть»). ἐν αἵματι σταφυλῆς τὴν περιβολήν — 装いをぶどうの血で (περιβολή «одеяние»)."
  12: "χαροποὶ οἱ ὀφθαλμοὶ αὐτοῦ ἀπὸ οἴνου — その目はぶどう酒によって輝き (χαροπός «радостный, сияющий»). λευκοὶ οἱ ὀδόντες αὐτοῦ ἢ γάλα — その歯は乳よりも白い (ἤ «чем» при сравнении; слав. «паче млека»)."
  13: "Ζαβουλων παράλιος κατοικήσει — ゼブルンは海辺に住み (παράλιος «приморский»). παρ᾽ ὅρμον πλοίων — 船の泊り場のそばに (ὅρμος «стоянка, пристань»). παρατενεῖ ἕως Σιδῶνος — その境はシドンまで及ぶ (παρατείνω «простираться»)."
  14: "Ισσαχαρ τὸ καλὸν ἐπεθύμησεν ἀναπαυόμενος — イッサカルは休みながら良いものを望んだ (ἐπιθυμέω «желать»). ἀνὰ μέσον τῶν κλήρων — 嗣業の間に (κλῆρος «жребий, удел»)."
  15: "ἰδὼν τὴν ἀνάπαυσιν ὅτι καλή — その休みが良いのを見. τὴν γῆν ὅτι πίων — 地が肥えているのを見 (πίων «тучный»). ὑπέθηκεν τὸν ὦμον αὐτοῦ εἰς τὸ πονεῖν — その肩を労苦のために差し出し (ὑποτίθημι «подставить»). ἐγενήθη ἀνὴρ γεωργός — 地を耕す者となった (γεωργός «земледелец»)."
  16: "Δαν κρινεῖ τὸν ἑαυτοῦ λαόν — ダンは自分の民を裁く. ὡσεὶ καὶ μία φυλὴ ἐν Ισραηλ — イスラエルの中の一つの部族のように (φυλή «колено»)."
  17: "γενηθήτω Δαν ὄφις ἐφ᾽ ὁδοῦ — ダンは道の上に伏す蛇となれ. ἐγκαθήμενος ἐπὶ τρίβου — 小径に潜む (τρίβος «тропа»). δάκνων πτέρναν ἵππου — 馬のかかとを噛み (πτέρνα «пята»). πεσεῖται ὁ ἱππεὺς εἰς τὰ ὀπίσω — 乗り手は後ろに落ちる."
  18: "τὴν σωτηρίαν περιμένω κυρίου — わたしは主の救いを待ち望む (περιμένω «ожидать»). В LXX это отдельный стих; славянская разбивка присоединяет его к ст. 17, но перевод по греческой."
  19: "Γαδ, πειρατήριον πειρατεύσει αὐτόν — ガドには略奪の群れが彼を襲う (πειρατήριον «разбойничий отряд»; πειρατεύω «разбойничать»). αὐτὸς δὲ πειρατεύσει αὐτῶν κατὰ πόδας — 彼は彼らのすぐ後を追って略奪する (κατὰ πόδας «по пятам»)."
  20: "Ασηρ, πίων αὐτοῦ ὁ ἄρτος — アシェル、そのパンは肥えており (πίων «тучный»). δώσει τρυφὴν ἄρχουσιν — 王たちにごちそうを出す (τρυφή «роскошь, лакомство»)."
  21: "Νεφθαλι στέλεχος ἀνειμένον — ナフタリは放たれた幹 (στέλεχος «ствол, стебель»; ἀνειμένος «отпущенный, свободный»). ἐπιδιδοὺς ἐν τῷ γενήματι κάλλος — その実に美しさを与える (γένημα «плод»)."
  22: "Υἱὸς ηὐξημένος Ιωσηφ — ヨセフは育てられた子 (αὐξάνω «растить»). υἱὸς ηὐξημένος ζηλωτός — 育てられた、誉れ高い子 (ζηλωτός «вызывающий ревность, восхищение»; слав. «ревностный»). υἱός μου νεώτατος — わたしの末の子. πρός με ἀνάστρεψον — わたしのもとへ帰れ (ἀναστρέφω «возвращаться»)."
  23: "εἰς ὃν διαβουλευόμενοι ἐλοιδόρουν — 彼に対して計りつつ罵り (διαβουλεύομαι «замышлять»; λοιδορέω «бранить»). ἐνεῖχον αὐτῷ κύριοι τοξευμάτων — 弓の主たちは彼に迫った (κύριοι τοξευμάτων «владыки стрел», т. е. лучники)."
  24: "συνετρίβη μετὰ κράτους τὰ τόξα αὐτῶν — 彼らの弓は力をもって砕かれ (συντρίβω «сокрушать»; κράτος «сила»). ἐξελύθη τὰ νεῦρα βραχιόνων χειρῶν αὐτῶν — 彼らの手の腕の筋は解かれた (νεῦρον «жила, сухожилие»). διὰ χεῖρα δυνάστου Ιακωβ — ヤコブの強き者の手によって (δυνάστης «крепкий, владыка»). ἐκεῖθεν ὁ κατισχύσας Ισραηλ — そこから、イスラエルを強くした方が来る (κατισχύω «укреплять»; в греч. эллипсис без глагола, ср. слав. «оттуду укрепися израиль»)."
  25: "παρὰ θεοῦ τοῦ πατρός σου — あなたの父の神から (продолжение ст. 24). ἐβοήθησέν σοι ὁ θεὸς ὁ ἐμός — わたしの神はあなたを助け. εὐλογίᾳ οὐρανοῦ ἄνωθεν — 上からの天の祝福. εὐλογίᾳ γῆς ἐχούσης πάντα — すべてを持つ地の祝福 (ἔχω «иметь»; слав. «имущия вся»). ἕνεκεν εὐλογίας μαστῶν καὶ μήτρας — 乳ぶさと胎の祝福のゆえに (μαστός «сосец»; μήτρα «утроба»)."
  26: "εὐλογίας πατρός σου καὶ μητρός σου — あなたの父と母の祝福 (LXX прибавляет «и матери твоей», слав. тоже; именное предложение, по-японски добавлено がある). ὑπερίσχυσεν ἐπ᾽ εὐλογίαις ὀρέων μονίμων — 変わることのない山々の祝福をしのいで強い (ὑπερισχύω «превосходить»; μόνιμος «постоянный»). θινῶν ἀενάων — 永遠の丘 (θίς «песчаная гряда, холм»; ἀέναος «вечный»). ἐπὶ κορυφῆς ὧν ἡγήσατο ἀδελφῶν — 彼が率いた兄弟たちの頂に (ἡγέομαι «предводительствовать»)."
  27: "Βενιαμιν λύκος ἅρπαξ — ベニヤミンは奪い取る狼 (ἅρπαξ «хищный»). τὸ πρωινὸν ἔδεται ἔτι — 朝には獲物を食らい (πρωινόν «утреннее»). εἰς τὸ ἑσπέρας διαδώσει τροφήν — 夕べには分け与える (διαδίδωμι «раздавать»)."
  28: "Πάντες οὗτοι υἱοὶ Ιακωβ δώδεκα — これらはすべてヤコブの十二の子. ἕκαστον κατὰ τὴν εὐλογίαν αὐτοῦ εὐλόγησεν — おのおのをその祝福に従って祝福した."
  29: "Ἐγὼ προστίθεμαι πρὸς τὸν ἐμὸν λαόν — わたしはわたしの民に加えられる (προστίθημι «прилагать»; формула смерти, ср. ст. 33). ἐν τῷ σπηλαίῳ… ἐν τῷ ἀγρῷ Εφρων τοῦ Χετταίου — ヘト人エフロンの畑にある洞窟に."
  30: "ἐν τῷ σπηλαίῳ τῷ διπλῷ τῷ ἀπέναντι Μαμβρη — マムレの向かいにある二重の洞窟 (διπλοῦς «двойной»; в евр. и ru место названо «Махпела», в LXX имени нет — потому в тексте только «二重の洞窟»). ἐν κτήσει μνημείου — 墓所の所有として (μνημεῖον «гробница»)."
  31: "ἐκεῖ ἔθαψαν Αβρααμ καὶ Σαρραν… Ισαακ καὶ Ρεβεκκαν… καὶ ἐκεῖ ἔθαψα Λειαν — そこに…葬り…そこにわたしはレアを葬った (смена 3 л. на 1 л., как в греч.)."
  32: "ἐν κτήσει τοῦ ἀγροῦ καὶ τοῦ σπηλαίου… παρὰ τῶν υἱῶν Χετ — 畑と…洞窟は、ヘトの子らから買ったもの."
  33: "κατέπαυσεν… ἐπιτάσσων — 命じ終えて (καταπαύω «прекращать»). ἐξάρας τοὺς πόδας αὐτοῦ ἐπὶ τὴν κλίνην — 足を床に収め (ἐξαίρω «поднять»). ἐξέλιπεν — 息を引き取った (ἐκλείπω). προσετέθη πρὸς τὸν λαὸν αὐτοῦ — 自分の民に加えられた."
