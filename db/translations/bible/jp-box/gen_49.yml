# jp-box, Бытие, глава 49. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru)
# и, где есть, jp-joc (1901, public domain). ru — только для понимания, не источник.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 49: благословение-пророчество о двенадцати коленах (1–27), итог (28),
# завещание о погребении в пещере Махпела и смерть Иакова (29–33).
# Красного и синего нет: пророчество патриарха, не речь Христа во плоти.
# Кавычки: речь Иакова — 「…」 (1–27 и 29–32); вложенных цитат в главе нет.
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено).
# Мессианские места переданы по LXX, а не по масоретскому тексту: 49:10 — ἄρχων/ἡγούμενος
# («князь/вождь»), а не «скипетр», и τὰ ἀποκείμενα αὐτῷ («отложенное Ему»), а не «Примиритель»;
# 49:9 — ἐκ βλαστοῦ («от побега»), а не «с добычи». Отличия — в notes, в скобки не берутся.
# jp-joc в этой главе есть только в ст. 1–2, 8–12 и 33; остальное — по csl-ru.
# Сносок ⟨…⟩ нет: 王杖, 嗣業, 獅子, 蛇, 狼, 墓 понятны или уже в корпусе. jp-ni не использовался.

