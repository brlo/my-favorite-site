verses:
  1: "また、わたしは天[てん]に、もう一[ひと]つの大[おお]きな驚[おどろ]くべきしるしを見[み]た。七人[しちにん]の天使[てんし]が七[なな]つの最後[さいご]の災[わざわ]いを持[も]っていた。神[かみ]の怒[いか]りは、これらの災[わざわ]いによって終[お]わるからである。"
  2: "また、わたしは、火[ひ]が混[ま]じったガラスの海[うみ]のようなものを見[み]た。また、獣[けもの]とその像[ぞう]と〔その刻印[こくいん]〕とその名[な]の数[かず]とに勝[か]った者[もの]たちが、ガラスの海[うみ]の上[うえ]に立[た]って、神[かみ]の琴[こと]を持[も]っていた。"
  3: "彼[かれ]らは、神[かみ]の僕[しもべ]モーセの歌[うた]と小羊[こひつじ]の歌[うた]を歌[うた]って言[い]った。「主[しゅ]なる神[かみ]、全能者[ぜんのうしゃ]よ。あなたの業[わざ]は大[おお]きく、驚[おどろ]くべきものである。あなたの道[みち]は正[ただ]しく、また真実[しんじつ]である。聖徒[せいと]たちの王[おう]よ。"
  4: "主[しゅ]よ、だれがあなたを畏[おそ]れず、あなたの名[な]をあがめないでしょうか。あなただけが聖[せい]なる方[かた]であるからです。すべての国民[こくみん]は来[き]て、あなたの前[まえ]に拝[はい]みます。あなたの正[ただ]しい裁[さば]きが明[あき]らかになったからです。」"
  5: "その後[そののち]、わたしは見[み]た。すると、天[てん]にある証[あかし]の幕屋[まくや]の神殿[しんでん]が開[ひら]かれた。"
  6: "七[なな]つの災[わざわ]いを持[も]つ七人[しちにん]の天使[てんし]たちが神殿[しんでん]から出[で]て来[き]た。彼[かれ]らは清[きよ]く輝[かがや]く亜麻布[あまぬの]を着[き]て、胸[むね]に金[きん]の帯[おび]を締[し]めていた。"
  7: "すると、四[よっ]つの生[い]き物[もの]の一[ひと]つが、七人[しちにん]の天使[てんし]たちに七[なな]つの金[きん]の鉢[はち]を渡[わた]した。その中[なか]には、世々[よよ]限[かぎ]りなく生[い]きておられる神[かみ]の怒[いか]りが満[み]ちていた。"
  8: "神殿[しんでん]は、神[かみ]の栄光[えいこう]と力[ちから]によって煙[けむり]で満[み]たされ、七人[しちにん]の天使[てんし]たちの七[なな]つの災[わざわ]いが終[お]わるまで、だれも神殿[しんでん]に入[はい]ることができなかった。"

notes:
  1: "ἄλλο σημεῖον … μέγα καὶ θαυμαστόν — もう一つの大きな、驚くべきしるし. ἑπτὰ πληγὰς τὰς ἐσχάτας — 七つの最後の災い. ἐν αὐταῖς ἐτελέσθη ὁ θυμὸς τοῦ θεοῦ — 神の怒りはこれらの災いによって終わる."
  2: "θάλασσαν ὑαλίνην μεμιγμένην πυρί — 火が混じったガラスの海. τοὺς νικῶντας ἐκ τοῦ θηρίου … — 獣に勝った者たち. В критической базе нет καὶ ἐκ τοῦ χαράγματος αὐτοῦ; церковный текст (Елизаветинская «и начертание его», jp-joc 其の印誌) читает — 〔その刻印〕 (проверено: χαραγμα в 15:2 НЕТ). ἑστῶτας ἐπὶ τὴν θάλασσαν τὴν ὑαλίνην — ガラスの海の上に立って. κιθάρας τοῦ θεοῦ — 神の琴."
  3: "τὴν ᾠδὴν Μωϋσέως τοῦ δούλου τοῦ θεοῦ καὶ τὴν ᾠδὴν τοῦ ἀρνίου — 神の僕モーセの歌と小羊の歌. Μεγάλα καὶ θαυμαστὰ τὰ ἔργα σου — あなたの業は大きく、驚くべきもの. δίκαιαι καὶ ἀληθιναὶ αἱ ὁδοί σου — あなたの道は正しく、真実. ὁ βασιλεὺς τῶν ἐθνῶν — в базе; церковный текст (Елизаветинская «Царю святых», jp-joc 諸聖の王) читает τῶν ἁγίων — 聖徒たちの王, замена без 〔〕. Песнь — 「」, не красная."
  4: "τίς οὐ μὴ φοβηθῇ … καὶ δοξάσει τὸ ὄνομά σου — だれがあなたを畏れず、名をあがめないか. μόνος ὅσιος — あなただけが聖なる方. πάντα τὰ ἔθνη ἥξουσιν καὶ προσκυνήσουσιν ἐνώπιόν σου — すべての国民は来て、あなたの前に拝む. τὰ δικαιώματά σου ἐφανερώθησαν — あなたの正しい裁きが明らかになった."
  5: "ὁ ναὸς τῆς σκηνῆς τοῦ μαρτυρίου — 証しの幕屋の神殿. ἠνοίγη ἐν τῷ οὐρανῷ — 天で開かれた."
  6: "οἱ ἑπτὰ ἄγγελοι [οἱ] ἔχοντες τὰς ἑπτὰ πληγάς — 七つの災いを持つ七人の天使; [οἱ] в базе в квадратных скобках. ἐνδεδυμένοι λίνον καθαρὸν λαμπρὸν — 清く輝く亜麻布を着て. περιεζωσμένοι περὶ τὰ στήθη ζώνας χρυσᾶς — 胸に金の帯を締めていた."
  7: "ἓν ἐκ τῶν τεσσάρων ζῴων — 四つの生き物の一つ. ἑπτὰ φιάλας χρυσᾶς — 七つの金の鉢. γεμούσας τοῦ θυμοῦ τοῦ θεοῦ τοῦ ζῶντος εἰς τοὺς αἰῶνας τῶν αἰώνων — 世々限りなく生きておられる神の怒りが満ちていた."
  8: "ἐγεμίσθη ὁ ναὸς καπνοῦ — 神殿は煙で満たされた. ἐκ τῆς δόξης τοῦ θεοῦ καὶ ἐκ τῆς δυνάμεως αὐτοῦ — 神の栄光と力によって. οὐδεὶς ἐδύνατο εἰσελθεῖν εἰς τὸν ναόν — だれも神殿に入ることができなかった. ἄχρι τελεσθῶσιν αἱ ἑπτὰ πληγαί — 七つの災いが終わるまで."
