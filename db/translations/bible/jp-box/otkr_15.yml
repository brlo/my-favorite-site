# jp-box, Откровение Иоанна, глава 15. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 15: семь ангелов с семью последними язвами (1); стеклянное море и песнь
# Моисея и Агнца (2–4); открытие храма и семь золотых чаш (5–8).
# Красного нет: 15:3–4 — песнь (славословие) в 「」, не слова Христа.
# 〔…〕: 15:2 — церковное καὶ ἐκ τοῦ χαράγματος αὐτοῦ (проверено: χαραγμα в базе НЕТ).
# 15:3 — замена чтения: в базе ὁ βασιλεὺς τῶν ἐθνῶν, Церковь читает τῶν ἁγίων
# (Елизаветинская, jp-joc 諸聖の王) — взято церковное 聖徒たちの王, без 〔〕
# (замена, а не добавка, как принято в корпусе).
# Сносок ⟨…⟩ нет: ガラス, 鉢, 亜麻布 — обычные слова или уже в корпусе.
# jp-ni не использовался.

