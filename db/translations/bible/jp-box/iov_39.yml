# jp-box, Иов, глава 39. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге только 1–2; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 39: продолжение речи Господа из бури (38:2). Вводной формулы нет, поэтому
# цитата открыта в первом стихе и закрыта в последнем стихе первой партии (39:30).
# Поэзия о животных: горные козы и лани (1–4), дикий осёл (5–8), единорог-дикий бык
# (9–12), страус (13–18), конь (19–25), ястреб и орёл (26–30). Затем — 31–35: ответ
# Господа Иову («И отвечал Господь…»), встречный вопрос («будет ли состязающийся…»)
# и краткий ответ Иова.
# Голоса: 1–30, 32 — Господь (1–30 одна цитата 「…」; 32 — отдельная цитата в пределах
# стиха). Слово коня в 39:25 — 『…』 (вложенная речь внутри речи Господа). 31 и 33 —
# авторские вводные формулы, вне кавычек; 34–35 — ответ Иова, одна цитата 「…」.
# Нумерация — славяно-синодальная (csl-ru), как и во всей книге: 35 стихов.
# В gr-lxx-byz эти пять стихов стоят в начале гл. 40 (gr 40:1–5): наш 39:31 = gr 40:1,
# 39:32 = gr 40:2, 39:33 = gr 40:3, 39:34 = gr 40:4, 39:35 = gr 40:5; наш 40:1 = gr 40:6.
# 〔…〕 нет: все 35 стихов есть в gr-lxx-byz (по номерам gr). Сносок ⟨…⟩ нет.
# Имена — транслитерация греческого (LXX): ヨブ, エリフ.

