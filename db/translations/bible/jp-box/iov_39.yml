verses:
  1: "「あなたは岩[いわ]に住[す]むアイベックスが産[う]む時[とき]を知[し]っているか。雌鹿[めじか]の産みの苦[くる]しみを見守[みまも]ったことがあるか。"
  2: "あなたは彼[かれ]らの産[う]みの月[つき]が満[み]ちるのを数[かぞ]えたか。その産みの苦しみを解[と]いたのか。"
  3: "あなたは彼らの子[こ]らを恐[おそ]れなく育[そだ]てたのか。その産みの苦しみを送[おく]り出[だ]すのか。"
  4: "彼[かれ]らは子[こ]を産[う]み落[お]とし、子孫[しそん]は増[ふ]え、出[で]て行[ゆ]き、二度[にど]と彼らのもとへは帰[かえ]らない。"
  5: "だれが野[の]ろばを放[はな]って自由[じゆう]にしたのか。だれがその綱[つな]を解[と]いたのか。"
  6: "わたしはその住[す]まいを荒[あ]れ野[の]とし、その天幕[てんまく]を塩[しお]の地[ち]とした。"
  7: "都[みやこ]の群[む]れを笑[わら]い、税[ぜい]を取[と]り立[た]てる者[もの]の咎[とが]めを聞[き]かない。"
  8: "彼[かれ]は山[やま]々[やま]を見[み]わたして自分[じぶん]の牧[まき]草[ぐさ]を探[さが]し、すべての緑[みどり]のものを追[お]い求[もと]める。"
  9: "野牛[やぎゅう]はあなたに仕[つか]えようと望[のぞ]むだろうか。あなたの飼[か]い葉[ば]桶[おけ]のそばに横[よこ]たわるだろうか。"
  10: "あなたは革紐[かわひも]でその軛[くびき]を結[むす]ぶのか。それは畑[はたけ]であなたの畝[うね]を引[ひ]くだろうか。"
  11: "その力[ちから]が多[おお]いからといって、あなたはそれを頼[たの]みとし、自分のわざをそれに任[まか]せるのか。"
  12: "あなたは、それが自分の種[たね]を返[かえ]し、あなたの脱穀場[だっこくじょう]に運[はこ]び入[い]れると信[しん]じるのか。"
  13: "喜[よろこ]び躍[おど]る者[もの]の翼[つばさ]、ネエラサ。もしアシダとネッサを身[み]ごもるなら。"
  14: "それは卵[たまご]を地[ち]に残[のこ]し、ちりの上[うえ]で暖[あたた]めるからである。"
  15: "足[あし]がそれを砕[くだ]き、野[の]の獣[けもの]がそれを踏[ふ]みつけることを忘[わす]れている。"
  16: "その子[こ]らを自分のものではないかのように心[こころ]を硬[かた]くし、恐[おそ]れもなく、むなしく労[ろう]した。"
  17: "神[かみ]がその鳥[とり]に知恵[ちえ]を隠[かく]し、悟[さと]りを分[わ]け与[あた]えなかったからである。"
  18: "時[とき]が来[く]れば、それは高[たか]みへと身[み]を上[あ]げ、馬[うま]とその乗[の]り手[て]を笑[わら]う。"
  19: "あなたは馬[うま]に力[ちから]を着[き]せ、その首[くび]に恐[おそ]れをまとわせたのか。"
  20: "あなたはそれに鎧[よろい]を着[き]せ、その胸[むね]の誉[ほま]れを大胆[だいたん]さで飾[かざ]ったのか。"
  21: "蹄[ひづめ]で野[の]を掘[ほ]って喜[よろこ]び躍[おど]り、力[ちから]を帯[お]びて野へ出[で]て行[ゆ]く。"
  22: "矢[や]に出会[であ]っても笑[わら]い、鉄[てつ]の前[まえ]から退[しりぞ]かない。"
  23: "その上[うえ]で弓[ゆみ]と剣[つるぎ]が躍[おど]る。"
  24: "怒[いか]りをもって地[ち]を滅[ほろ]ぼし、角笛[つのぶえ]が鳴[な]るまでは信[しん]じない。"
  25: "角笛[つのぶえ]が鳴[な]ると『よし』と言[い]い、遠[とお]くから戦[いくさ]のにおいを嗅[か]いで、跳[は]ね回[まわ]り、いななく。"
  26: "あなたの知[ち]恵[え]によって、鷹[たか]は翼[つばさ]を広[ひろ]げたまま動[うご]かずに立[た]ち、南[みなみ]の方を眺[なが]めるのか。"
  27: "あなたの命令[めいれい]によって鷲[わし]は高[たか]く上[のぼ]り、禿鷲[はげわし]は自分の巣[す]の上[うえ]に座[すわ]って宿[やど]るのか。"
  28: "岩[いわ]の頂[いただき]、隠[かく]れた所[ところ]に。"
  29: "そこにいて食物[たべもの]を求[もと]め、その目[め]は遠[とお]くを見張[みは]る。"
  30: "その雛[ひな]たちは血[ち]の中[なか]でまみれ、死[し]んだもののある所[ところ]には、ただちに見[み]つけられる」。"
  31: "主[しゅ]である神[かみ]はヨブに答[こた]えて言[い]われた。"
  32: "「力[ちから]ある方[かた]との裁[さば]きを避[さ]けるのか。神[かみ]を責[せ]める者[もの]は、これに答[こた]えよ。」"
  33: "ヨブは主[しゅ]に答[こた]えて言[い]った。"
  34: "「なぜ、わたしはなお裁[さば]かれるのか。何[なに]でもない者[もの]が、主[しゅ]に戒[いまし]められ、責[せ]められながら、このようなことを聞[き]くのか。わたしはこれに、どんな答[こた]えを返[かえ]すのか。わたしは口[くち]に手[て]を置[お]く。"
  35: "わたしは一度[いちど]語[かた]った。二度[にど]目[め]には、もう加[くわ]えない。」"

notes:
  1: "Господь. εἰ ἔγνως καιρὸν τοκετοῦ τραγελάφων πέτρας — «знаешь ли ты время рождения горных коз?» (τραγέλαφος — «горный козёл, ибекс»; πέτρα — «скала»; csl «коз живущих на горах каменных»); ἐφύλαξας δὲ ὠδῖνας ἐλάφων — «и соблюл ли ты муки ланей?» (φυλάσσω — «стеречь, соблюдать»; ὠδίν — «родовая боль»; ἔλαφος — «олень, лань»). Речь Господа продолжается из 38:2: цитата открыта здесь, закрыта в 39:30. τραγέλαφος в корпусе — アイベックス (Втор 14:5)."
  2: "Господь. ἠρίθμησας δὲ αὐτῶν μῆνας πλήρεις τοκετοῦ — «исчислил ли ты полные месяцы рождения их?» (ἀριθμέω — «считать»; τοκετός — «рождение»); ὠδῖνας δὲ αὐτῶν ἔλυσας — «и разрешил ли ты муки их?» (λύω — «разрешать, освобождать»; csl «болезни же их разрешил ли еси»)."
  3: "Господь. ἐξέθρεψας δὲ αὐτῶν τὰ παιδία ἔξω φόβου — «вскормил ли ты детёнышей их вне страха?» (ἐκτρέφω — «вскармливать»; παιδίον — «детёныш, дитя»; ἔξω φόβου — «вне страха»); ὠδῖνας αὐτῶν ἐξαποστελεῖς — «муки их отошлёшь ли?» (ἐξαποστέλλω — «отсылать», т. е. прекратить роды)."
  4: "Господь. ἀπορρήξουσιν τὰ τέκνα αὐτῶν — «они разверзнутся (разродятся) детьми своими» (ἀπορρήγνυμι — «отрывать, разражаться»; csl «извергнут чада своя»); πληθυνθήσονται ἐν γενήματι — «умножатся в порождении» (γένημα — «произведение, плод»); ἐξελεύσονται καὶ οὐ μὴ ἀνακάμψουσιν αὐτοῖς — «выйдут и не возвратятся к ним» (ἀνακάμπτω — «возвращаться»)."
  5: "Господь. τίς δέ ἐστιν ὁ ἀφεὶς ὄνον ἄγριον ἐλεύθερον — «кто пустил дикого осла на свободу?» (ἀφίημι — «отпускать»; ὄνος ἄγριος — «дикий осёл»; ἐλεύθερος — «свободный»); δεσμοὺς δὲ αὐτοῦ τίς ἔλυσεν — «и узы его кто разрешил?» (δεσμός — «узы»)."
  6: "Господь. ἐθέμην δὲ τὴν δίαιταν αὐτοῦ ἔρημον — «Я положил жилище его пустынею» (δίαιτα — «образ жизни, жилище»; ἔρημος — «пустыня»); τὰ σκηνώματα αὐτοῦ ἁλμυρίδα — «и селения его — солончаком» (σκήνωμα — «шатёр, жилище»; ἁλμυρίς — «солончак, солёная земля»; csl «сланость»)."
  7: "Господь. καταγελῶν πολυοχλίας πόλεως — «смеясь над многолюдством города» (καταγελάω — «осмеивать»; πολυοχλία — «большое скопление народа»); μέμψιν δὲ φορολόγου οὐκ ἀκούων — «и не слыша укора сборщика податей» (μέμψις — «укор, порицание»; φορολόγος — «сборщик подати»; csl «стужания данническаго»)."
  8: "Господь. κατασκέψεται ὄρη νομὴν αὐτοῦ — «высматривает горы как пастбище себе» (κατασκέπτομαι — «обозревать»; νομή — «пастбище»); ὀπίσω παντὸς χλωροῦ ζητεῖ — «вслед за всякою зеленью ищет» (χλωρός — «зелёный, свежий»; ζητέω — «искать»)."
  9: "Господь. βουλήσεται δέ σοι μονόκερως δουλεῦσαι — «захочет ли тебе единорог служить?» (μονόκερως — «единорог»; в евр. дикий бык, ср. Пс 21:22, где 野牛; в тексте 野牛, греч. слово в notes); ἢ κοιμηθῆναι ἐπὶ φάτνης σου — «или поспать при яслях твоих?» (φάτνη — «ясли, кормушка»)."
  10: "Господь. δήσεις δὲ ἐν ἱμᾶσι ζυγὸν αὐτοῦ — «привяжешь ли ремнями ярмо его?» (ἱμάς — «ремень»; ζυγόν — «ярмо»); ἢ ἑλκύσει σου αὔλακας ἐν πεδίῳ — «или проведёт тебе борозды в поле?» (ἑλκύω — «тащить, влечь»; αὖλαξ — «борозда»; πεδίον — «поле»)."
  11: "Господь. πέποιθας δὲ ἐπ᾽ αὐτῷ, ὅτι πολλὴ ἡ ἰσχὺς αὐτοῦ — «понадеешься ли на него, что велика сила его?» (πείθω — перфект, «доверять»; ἰσχύς — «сила»); ἐπαφήσεις δὲ αὐτῷ τὰ ἔργα σου — «и предоставишь ли ему дела твои?» (ἐπαφίημι — «отпускать, предоставлять»)."
  12: "Господь. πιστεύσεις δὲ ὅτι ἀποδώσει σοι τὸν σπόρον — «поверишь ли, что он возвратит тебе семя?» (πιστεύω; ἀποδίδωμι — «воздавать, возвращать»; σπόρος — «семя, посев»); εἰσοίσει δέ σου τὸν ἅλωνα — «и внесёт ли тебе гумно?» (εἰσφέρω — «вносить»; ἅλων — «гумно, ток»)."
  13: "Господь. πτέρυξ τερπομένων νεελασα — «крыло радующихся — нееласа» (πτέρυξ — «крыло»; τέρπομαι — «радоваться»; νεελασα — транслитерация евр. названия птицы, вероятно страуса); ἐὰν συλλάβῃ ασιδα καὶ νεσσα — «если зачнёт асиду и нессу» (συλλαμβάνω — «зачинать»; ασιδα, νεσσα — также транслитерации евр. названий птиц, csl «асида и несса»). В ru/МТ здесь «павлин» и «страус» — иное чтение, не внесено; в тексте транслитерация, как в LXX и csl."
  14: "Господь. ὅτι ἀφήσει εἰς γῆν τὰ ᾠὰ αὐτῆς — «ибо она оставит на земле яйца свои» (ἀφίημι — «оставлять»; ᾠόν — «яйцо»); καὶ ἐπὶ χοῦν θάλψει — «и на пыли согреет их» (χοῦς — «пыль, прах»; θάλπω — «согревать»)."
  15: "Господь. καὶ ἐπελάθετο ὅτι ποὺς σκορπιεῖ — «и забыла, что нога может раздавить» (ἐπιλανθάνομαι — «забывать»; πούς — «нога»; σκορπίζω — «рассеивать, разбрасывать»); θηρία ἀγροῦ καταπατήσει — «и звери полевые растопчут» (καταπατέω — «топтать»)."
  16: "Господь. ἀπεσκλήρυνεν τὰ τέκνα αὐτῆς ὥστε μὴ ἑαυτῇ — «ожесточилась на детей своих, как бы не своих» (ἀποσκληρύνω — «делать жёстким»; csl «ожесточися на чада своя, аки бы не ея»); εἰς κενὸν ἐκοπίασεν ἄνευ φόβου — «втуне трудилась без страха» (κοπιάω — «трудиться»; ἄνευ φόβου — «без страха»)."
  17: "Господь. ὅτι κατεσιώπησεν αὐτῇ ὁ θεὸς σοφίαν — «ибо Бог сокрыл от неё премудрость» (κατασιωπάω — «заставлять молчать»; csl «сокры Бог ей премудрость» — по csl в тексте 隠し, LXX в notes); οὐκ ἐμέρισεν αὐτῇ ἐν τῇ συνέσει — «и не уделил ей в разумении» (μερίζω — «делить, уделять»; σύνεσις)."
  18: "Господь. κατὰ καιρὸν ἐν ὕψει ὑψώσει — «в своё время высоко вознесётся» (καιρός — «время»; ὕψος — «высота»; ὑψόω — «возвышать»); καταγελάσεται ἵππου καὶ τοῦ ἐπιβάτου αὐτοῦ — «посмеётся коню и всаднику его» (καταγελάω; ἐπιβάτης — «всадник»)."
  19: "Господь. ἦ σὺ περιέθηκας ἵππῳ δύναμιν — «разве ты облёк коня силою?» (περιτίθημι — «облагать, надевать»; δύναμις — «сила»); ἐνέδυσας δὲ τραχήλῳ αὐτοῦ φόβον — «и облёк шею его страхом?» (ἐνδύω — «одевать»; τράχηλος — «шея»; φόβος — «страх»). В ru/МТ «гривою» — иное чтение (евр. רַעְמָה), в LXX и csl «страх», держимся их."
  20: "Господь. περιέθηκας δὲ αὐτῷ πανοπλίαν — «и облёк его в полное вооружение?» (πανοπλία — «полное вооружение»); δόξαν δὲ στηθέων αὐτοῦ τόλμῃ — «и славу груди его — дерзостью» (στῆθος — «грудь»; τόλμα — «дерзость, отвага»). Тёмный оборот: слава груди коня — в его отваге; передано 誉れを大胆さとした."
  21: "Господь. ἀνορύσσων ἐν πεδίῳ γαυριᾷ — «роя (землю) в поле, он веселится» (ἀνορύσσω — «разрывать, копать»; γαυριάω — «веселиться, гордиться»); ἐκπορεύεται δὲ εἰς πεδίον ἐν ἰσχύι — «и выходит в поле в силе» (ἐκπορεύομαι). Слав. добавляет «копытом» — этого нет в LXX, но по паритету внесено в текст (蹄で), отмечено здесь."
  22: "Господь. συναντῶν βέλει καταγελᾷ — «встречая стрелу, смеётся» (συναντάω — «встречать»; βέλος — «стрела»); καὶ οὐ μὴ ἀποστραφῇ ἀπὸ σιδήρου — «и не отвратится от железа» (ἀποστρέφω — «отвращаться»; σίδηρος — «железо», т. е. меч)."
  23: "Господь. ἐπ᾽ αὐτῷ γαυριᾷ τόξον καὶ μάχαιρα — «над ним веселятся лук и меч» (γαυριάω — «веселиться»; τόξον — «лук»; μάχαιρα — «меч»)."
  24: "Господь. καὶ ὀργῇ ἀφανιεῖ τὴν γῆν — «и в ярости истребит землю» (ὀργή — «гнев, ярость»; ἀφανίζω — «истреблять»); καὶ οὐ μὴ πιστεύσῃ, ἕως ἂν σημάνῃ σάλπιγξ — «и не поверит, доколе не протрубит труба» (πιστεύω; σημαίνω — «давать знак, трубить»; σάλπιγξ — «труба»). Тёмное место: конь не унимается, пока не протрубят."
  25: "Господь. σάλπιγγος δὲ σημαινούσης λέγει Εὖγε — «когда же труба протрубит, говорит: хорошо!» (Εὖγε — восклицание одобрения; слова коня — 『…』); πόρρωθεν δὲ ὀσφραίνεται πολέμου — «и издалека обоняет войну» (ὀσφραίνομαι — «обонять»); σὺν ἅλματι καὶ κραυγῇ — «с прыжками и криком» (ἅλμα — «прыжок»; κραυγή — «крик»; csl читает «ржанием» — «с прыжками и ржанием»; по паритету в тексте いななく, LXX в notes)."
  26: "Господь. ἐκ δὲ τῆς σῆς ἐπιστήμης ἕστηκεν ἱέραξ — «от твоего ли знания стоит ястреб?» (ἐπιστήμη — «знание, умение»; ἱέραξ — «ястреб»); ἀναπετάσας τὰς πτέρυγας ἀκίνητος — «распростёрши крылья, недвижим» (ἀναπετάννυμι — «распростирать»; ἀκίνητος — «неподвижный»); καθορῶν τὰ πρὸς νότον — «смотря на юг» (καθοράω — «смотреть, обозревать»; νότος — «юг»)."
  27: "Господь. ἐπὶ δὲ σῷ προστάγματι ὑψοῦται ἀετός — «по твоему ли повелению возносится орёл?» (πρόσταγμα — «повеление»; ὑψόω — «возносить»; ἀετός — «орёл»); γὺψ δὲ ἐπὶ νοσσιᾶς αὐτοῦ καθεσθεὶς αὐλίζεται — «и стервятник, сев на гнездо своё, водворяется?» (γύψ — «стервятник, гриф»; νοσσιά — «гнездо»; αὐλίζομαι — «водворяться»)."
  28: "Господь. ἐπ ἐξοχῇ πέτρας — «на вершине скалы» (ἐξοχή — «выступ, вершина»; πέτρα — «скала»); καὶ ἀποκρύφῳ — «и в сокровенном месте» (ἀπόκρυφος — «скрытый»). Стих продолжает 39:27 и обрывается."
  29: "Господь. ἐκεῖσε ὢν ζητεῖ τὰ σῖτα — «будучи там, ищет пищу» (ἐκεῖσε — «туда, там»; σῖτα — «пища»); πόρρωθεν οἱ ὀφθαλμοὶ αὐτοῦ σκοπεύουσιν — «издалека глаза его наблюдают» (πόρρωθεν — «издалека»; σκοπεύω — «высматривать»)."
  30: "Господь. νεοσσοὶ δὲ αὐτοῦ φύρονται ἐν αἵματι — «птенцы его валяются в крови» (νεοσσός — «птенец»; φύρομαι — «смешиваться, валяться»; αἷμα — «кровь»); οὗ δ᾽ ἂν ὦσι τεθνεῶτες, παραχρῆμα εὑρίσκονται — «где бы ни были мёртвые, тотчас находятся» (θνήσκω — «умирать»; παραχρῆμα — «тотчас»). Здесь закрывается речь Господа о животных (38:2–39:30). Слав. 39:31–35 (= gr 40:1–5) — новая партия: ответ Господа, вопрос и ответ Иова, см. notes 31–35."
  31: "Повествование (gr 40:1). Καὶ ἀπεκρίθη κύριος ὁ θεὸς τῷ Ιωβ καὶ εἶπεν — «И отвечал Господь Бог Иову и сказал» (в csl это 39:31: «И отвеща Господь Бог ко иову и рече»). Вводная формула, повествование, вне кавычек. В LXX здесь нет «из бури»; буря была в 38:1, а «из облака» появится в 40:1 (= gr 40:6)."
  32: "Господь (gr 40:2). Μὴ κρίσιν μετὰ ἱκανοῦ ἐκκλινεῖ — «разве уклонится от суда с Сильным» (ἱκανός — «достаточный, сильный», csl «всесильный»). ἐλέγχων θεὸν ἀποκριθήσεται αὐτήν — «обличающий Бога ответит на него» (ἐλέγχω — «обличать, изобличать»; будущее в значении повеления, поэтому 答えよ). Речь Господа, одна цитата в пределах стиха."
  33: "Повествование (gr 40:3). Ὑπολαβὼν δὲ Ιωβ λέγει τῷ κυρίῳ — «И отвечал Иов Господу и говорит» (csl 39:33: «Отвещав же иов, рече Господеви»). Вводная формула, повествование, вне кавычек."
  34: "Иов (gr 40:4). Τί ἔτι ἐγὼ κρίνομαι νουθετούμενος — «зачем ещё я сужусь, вразумляемый» (κρίνομαι — «быть судимым»; νουθετέω — «вразумлять»). ἐλέγχων κύριον ἀκούων τοιαῦτα οὐθὲν ὤν — «обличая Господа, слыша такое, будучи ничем» (действительный залог); csl «обличаемь от Господа» — страдательный, «обличаемый Господом»; по паритету взято csl; LXX: действительный залог, «обличая Господа». ἐγὼ δὲ τίνα ἀπόκρισιν δῶ — «какой ответ я дам»; χεῖρα θήσω ἐπὶ στόματί μου — «положу руку на уста мои» (жест молчания, ср. 21:5). Кавычка открыта здесь и продолжается в 39:35 (ответ Иова — одна речь; до перенумерации 4 и 5 были отдельными цитатами)."
  35: "Иов (gr 40:5). ἅπαξ λελάληκα, ἐπὶ δὲ τῷ δευτέρῳ οὐ προσθήσω — «однажды я говорил, а во второй раз не приложу» (csl «единою глаголах, вторицею же не приложу»). Здесь ответ Иова кончается и цитата закрывается; 40:1 (= gr 40:6) — новая формула Господа."
