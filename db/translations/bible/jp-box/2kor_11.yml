# jp-box, Второе послание к Коринфянам, глава 11. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 11: ревность Павла о Коринфе (1–6), его бескорыстие (7–12),
# лжеапостолы (13–15), похвала в безумии (16–21), перечень страданий (22–33).
# Красного и синего нет: прямой речи Христа и Богородицы в главе нет, <j>/<mo> не ставятся.
# 〔…〕 одно: 11:31 〔わたしたちの〕 — τοῦ κυρίου ἡμῶν Ἰησοῦ; в gr-lxx-byz и gr-ru ἡμῶν нет,
# церковный текст (слав. «Господа нашего», Синодальный, jp-joc「我等の主」) читает с ним.
# 11:3 καὶ τῆς ἁγνότητος в базе стоит в квадратных скобках, но слав. и jp-joc его не читают —
# не переводим (слово в базе есть, поэтому и не оборачиваем).
# Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

