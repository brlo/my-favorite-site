verses:
  1: "どうか、あなたがたがわたしの少[すこ]しの愚[おろ]かさを寛大[かんだい]に見[み]てくれるように。いや、あなたがたはすでに寛大に見てくれている。"
  2: "なぜなら、わたしは神[かみ]の熱心[ねつしん]をもって、あなたがたを熱心に思[おも]っているからである。わたしはあなたがたを清[きよ]い処女[おとめ]として一人[ひとり]の夫[おっと]に婚約[こんやく]させ、キリストに献[ささ]げようとしたのである。"
  3: "しかし、恐[おそ]れている。蛇[へび]がその狡猾[こうかつ]さによってエバを欺[あざむ]いたように、あなたがたの思[おも]いが、キリストに対する純朴[じゅんぼく]さから離[はな]れて堕落[だらく]してしまうのではないか、と。"
  4: "なぜなら、もし来[く]る者[もの]が、わたしたちが宣[の]べ伝[つた]えなかった別[べつ]のイエスを宣べ伝[つた]え、あるいはあなたがたが受[う]けなかった別の霊[れい]を受[う]け、あるいはあなたがたが受[う]け入[い]れなかった別の福音[ふくいん]を受[う]け入[い]れるなら、あなたがたはよくもそれを寛大[かんだい]に受け入れるものである。"
  5: "なぜなら、わたしは、あの超[ちょう]使徒[しと]たちに何[なに]ひとつ劣[おと]っていないと考[かんが]えるからである。"
  6: "たとえ話[はな]し方[かた]では素人[しろうと]であっても、知識[ちしき]ではそうではない。かえって、わたしたちはすべてのことにおいて、すべての人[ひと]に対して、あなたがたに明[あき]らかにしてきたのである。"
  7: "それとも、わたしが自分[じぶん]を低[ひく]くして、あなたがたが高[たか]くされるために、あなたがたに神[かみ]の福音[ふくいん]を無償[むしょう]で宣[の]べ伝[つた]えたことは、罪[つみ]を犯[おか]したことになるのか。"
  8: "わたしはほかの教会[きょうかい]を掠[かす]め奪[うば]って、あなたがたに仕[つか]えるための給金[きゅうきん]としたのである。"
  9: "あなたがたのところに居[い]て乏[とぼ]しくなっても、だれにも負担[ふたん]をかけなかった。わたしの乏しさは、マケドニアから来[き]た兄弟[きょうだい]たちが補[おぎな]ってくれたからである。そして、わたしはすべてのことにおいて、あなたがたに負担をかけないようにしてきたし、これからもそうするであろう。"
  10: "わたしのうちにあるキリストの真理[しんり]によって言[い]う。この誇[ほこ]りは、アカイアの各地[かくち]で、わたしに関[かん]して封[ふう]じられることはない。"
  11: "なぜか。わたしがあなたがたを愛[あい]していないからか。神[かみ]が知[し]っておられる。"
  12: "しかし、わたしがしていることを、これからも続[つづ]ける。それは、機会[きかい]を求[もと]めている者[もの]たちから、その機会を断[た]ち切[き]るためである。すなわち、彼[かれ]らが誇[ほこ]っている点[てん]で、自分[じぶん]たちもわたしたちと同[おな]じだと見[み]なされるためである。"
  13: "なぜなら、そのような者[もの]たちは偽[にせ]使徒[しと]、欺[あざむ]きの働[はたら]き手[て]であって、キリストの使徒[しと]に姿[すがた]を変[か]えているからである。"
  14: "何[なん]の不思議[ふしぎ]もない。サタン自身[じしん]が光[ひかり]の天使[てんし]に姿を変えるのだからである。"
  15: "だから、そのしもべたちが義[ぎ]のしもべのように姿を変えるのも、大[おお]したことではない。彼[かれ]らの終[お]わりは、その行[おこな]いに応[おう]じて来[く]るのである。"
  16: "もう一度[いちど]言[い]う。だれも、わたしを愚[おろ]かな者[もの]と思[おも]わないでほしい。もしそうでなければ、あなたがたはわたしを愚かな者として受[う]け入[い]れてほしい。わたしも少[すこ]しばかり誇[ほこ]るためである。"
  17: "わたしが語[かた]ることは、主[しゅ]に従[したが]って語るのではなく、愚[おろ]かさのうちに、この誇[ほこ]りの確信[かくしん]をもって語るのである。"
  18: "多[おお]くの人[ひと]が肉[にく]に従って誇[ほこ]るので、わたしも誇[ほこ]ろう。"
  19: "なぜなら、あなたがたは賢[かしこ]い者[もの]だから、喜[よろこ]んで愚[おろ]かな者[もの]たちを寛大[かんだい]に見[み]ているからである。"
  20: "実際[じっさい]、だれかがあなたがたを奴隷[どれい]にし、だれかがあなたがたを食[く]い尽[つ]くし、だれかがあなたがたから奪[うば]い、だれかがあなたがたに高[たか]ぶり、だれかがあなたがたの顔[かお]を打[う]っても、あなたがたは寛大に受[う]け入[い]れているからである。"
  21: "わたしは恥[は]ずかしながら言[い]う。わたしたちは弱[よわ]かったのだ、と。しかし、だれかが何[なに]かで大胆[だいたん]になるなら——愚[おろ]かなことを言うが——わたしも大胆になる。"
  22: "彼[かれ]らはヘブライ人[じん]か。わたしもそうだ。イスラエル人[じん]か。わたしもそうだ。アブラハムの子孫[しそん]か。わたしもそうだ。"
  23: "キリストの奉仕者[ほうししゃ]か。狂[きょう]ったことを言[い]うが、わたしはなおさらだ。労苦[ろうく]においてはるかに多く、獄[ひとや]においてはるかに多く、鞭打[むちう]ちにおいては度[ど]を越[こ]えて、死[し]に瀕[ひん]したこともたびたびである。"
  24: "ユダヤ人[じん]からは、四十[しじゅう]に一[ひと]つを欠[か]く三十九[さんじゅうきゅう]の鞭[むち]を五度[ごど]受[う]けた。"
  25: "三度[さんど]、杖[つえ]で打[う]たれ、一度[いちど]、石打[いしう]ちにされ、三度、船[ふね]が難破[なんぱ]し、一昼夜[いっちゅうや]を深[ふか]みに過[す]ごした。"
  26: "たびたび旅[たび]をし、川[かわ]の危険[きけん]、盗賊[とうぞく]の危険、同族[どうぞく]の危険、異邦人[いほうじん]の危険、町[まち]の中の危険、荒野[こうや]の中の危険、海[うみ]の中の危険、偽兄弟[にせきょうだい]の中の危険に遭[あ]い、"
  27: "労苦[ろうく]と苦労[くろう]、たびたび眠[ねむ]らず、飢[う]えと渇[かわ]き、たびたび断食[だんじき]し、寒[さむ]さと裸[はだか]に耐[た]え、"
  28: "これらのほかに、日[ひ]ごとにわたしに迫[せま]るものがある。すなわち、すべての教会[きょうかい]への気[き]づかいである。"
  29: "だれが弱[よわ]っているのに、わたしが弱らないでいられようか。だれがつまずくのに、わたしが心[こころ]を焼[や]かれないでいられようか。"
  30: "誇[ほこ]らねばならないのなら、わたしの弱[よわ]さについて誇[ほこ]ろう。"
  31: "〔わたしたちの〕主[しゅ]イエスの父[ちち]であり神[かみ]である方[かた]、とこしえにほめたたえられる方[かた]が、わたしが偽[いつわ]りを言[い]わないことを知[し]っておられる。"
  32: "ダマスコで、アレタ王[おう]の代官[だいかん]が、わたしを捕[つか]まえようとして、ダマスコの町[まち]を見張[みは]っていた。"
  33: "わたしは籠[かご]に乗[の]せられ、城壁[じょうへき]の窓[まど]から吊[つ]り下[おろ]されて、彼[かれ]の手[て]から逃[に]げたのである。"

notes:
  1: "ὄφελον — «о, если бы»; どうか…てくれるように. ἀφροσύνη — 愚かさ. ἀνέχεσθε — 堪忍する, 寛大に見る."
  2: "ζηλῶ… θεοῦ ζήλῳ — «ревную ревностью Божией»; 神の熱心をもって…熱心に思う. ἡρμοσάμην — «обручил»; 婚約させた. παρθένον ἁγνήν — 清い処女."
  3: "ἐξηπάτησεν — «обманул»; 欺いた. πανουργία — 狡猾さ. ἁπλότης — 純朴さ. καὶ τῆς ἁγνότητος в базе в квадратных скобках, но слав. и jp-joc его не читают — не переводим."
  4: "ἄλλον Ἰησοῦν — 別のイエス. πνεῦμα ἕτερον — 別の霊. καλῶς ἀνέχεσθε — ирония: «вы прекрасно терпите»; よくも…受け入れる."
  5: "ὑπερλίαν ἀποστόλων — «сверх-апостолы», ироническое обозначение противников; 超使徒 (то же в 12:11). ὑστερηκέναι — 劣っている."
  6: "ἰδιώτης τῷ λόγῳ — «невежда в слове»; 話し方では素人. γνῶσις — 知識. φανερώσαντες — «явившие»; 明らかにしてきた."
  7: "ἁμαρτίαν ἐποίησα — риторический вопрос; 罪を犯したことになるのか. δωρεάν — 無償で. ταπεινῶν — 自分を低くして."
  8: "ἐσύλησα — «обобрал»; 掠め奪った. ὀψώνιον — «плата, жалованье»; 給金."
  9: "κατενάρκησα — «не отяготил»; 負担をかけなかった. ὑστέρημα — 乏しさ. ἀβαρῆ — «не в тягость»; 負担をかけない."
  10: "κλίματα — «области, края»; 各地. φραγήσεται — «заградится, умолкнет»; 閉ざされる. ἀλήθεια Χριστοῦ ἐν ἐμοὶ — わたしのうちにあるキリストの真理."
  11: "Два риторических вопроса; ἀγαπῶ — 愛する. ὁ θεὸς οἶδεν — 神が知っておられる."
  12: "ἀφορμή — «повод, предлог»; 機会. ἐκκόψω — «отсеку»; 断ち切る. ἐν ᾧ καυχῶνται — 誇っている点."
  13: "ψευδαπόστολοι — 偽使徒. ἐργάται δόλιοι — 欺きの働き手. μετασχηματιζόμενοι — «преображающиеся»; 姿を変えている."
  14: "θαῦμα — 不思議. μετασχηματίζεται — 姿を変える. ἄγγελος φωτός — 光の天使. サタン — калька サタナ."
  15: "διάκονοι — しもべ. δικαιοσύνη — 義. τὸ τέλος — 終わり. κατὰ τὰ ἔργα — 行いに応じて."
  16: "ἄφρων — 愚かな者. δέξασθέ με — 受け入れてほしい. καυχήσωμαι — 誇る."
  17: "κατὰ κύριον — «по Господу»; 主に従って. ὑπόστασις — 確信. Речь Павла, не красная."
  18: "κατὰ σάρκα — 肉に従って."
  19: "ἡδέως — 喜んで. φρόνιμοι ὄντες — ирония: 賢い者だから."
  20: "καταδουλοῖ — 奴隷にする. κατεσθίει — 食い尽くす. ἐπαίρεται — 高ぶる. δέρει — 打つ."
  21: "κατὰ ἀτιμίαν — «к бесчестию»; 恥ずかしながら. ἠσθενήκαμεν — 弱かった. ἐν ἀφροσύνῃ — 愚かなことを言うが."
  22: "Три риторических вопроса: ヘブライ人・イスラエル人・アブラハムの子孫."
  23: "παραφρονῶν λαλῶ — «безумствуя, говорю»; 狂ったことを言うが. ὑπὲρ ἐγώ — なおさらだ. ἐν φυλακαῖς, ἐν πληγαῖς — 獄、鞭打ち. Порядок по базе (в слав. иначе)."
  24: "τεσσαράκοντα παρὰ μίαν — «сорок без одного», 39 ударов (Втор 25:3); 四十に一つを欠く三十九の鞭."
  25: "ἐραβδίσθην — «был бит палками»; 杖で打たれ. ἐλιθάσθην — 石打ちにされ. ἐναυάγησα — 難破した. νυχθήμερον — 一昼夜. βυθός — 深み."
  26: "Восемь «опасностей» (κινδύνοις) и «путешествия» (ὁδοιπορίαις) перечислены все; 異邦人 — ἔθνη, 偽兄弟 — ψευδάδελφοι."
  27: "κόπος καὶ μόχθος — 労苦と苦労. ἀγρυπνίαι — 眠らず. νηστεῖαι — 断食. ψῦχος καὶ γυμνότης — 寒さと裸."
  28: "ἐπίστασις — «натиск, давление»; 迫るもの. μέριμνα — 気づかい."
  29: "Два риторических вопроса; πυροῦμαι — «воспламеняюсь»; 心を焼かれる."
  30: "τὰ τῆς ἀσθενείας μου — わたしの弱さ."
  31: "В gr-lxx-byz и gr-ru: τοῦ κυρίου Ἰησοῦ, без ἡμῶν; церковный текст (слав. «Господа нашего», Синодальный, jp-joc「我等の主」) читает с ἡμῶν — 〔わたしたちの〕."
  32: "ἐθνάρχης — «этнарх, наместник»; 代官. Ἀρέτα — Арета IV, царь набатеев; アレタ王. ἐφρούρει — 見張っていた."
  33: "σαργάνη — «плетёная корзина»; 籠. θυρίς — 窓. ἐχαλάσθην — 吊り下ろされた."
