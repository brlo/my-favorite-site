verses:
  1: "翌日[よくじつ]、ホロフェルネスは自分の全軍[ぜんぐん]と、彼の加勢[かせい]に来[き]ていたすべての民[たみ]とに、ベトリアへ向[む]かって出発[しゅっぱつ]し、山地[さんち]の登[のぼ]り道[みち]をあらかじめ占領[せんりょう]して、イスラエルの子[こ]らと戦[たたか]いを交[ま]えるように命[めい]じた。"
  2: "その日、彼らのうちの力[ちから]ある者[もの]はみな出発[しゅっぱつ]した。彼らの軍勢[ぐんぜい]は、歩兵[ほへい]十七万[じゅうしちまん]人[にん]、騎兵[きへい]一万二千[いちまんにせん]人[にん]であった。これは陣営[じんえい]の荷[に]と、そのうちにいた歩[ある]く者[もの]たちのほかであり、きわめて多[おお]き群[む]れであった。"
  3: "彼らはベトリアの近[ちか]くの谷間[たにま]、泉[いずみ]のほとりに陣[じん]を敷[し]いた。そして、幅[はば]ではドタンからベルバイムまで、長[なが]さではベトリアからキアモンまで、すなわちエスドレロンに面[めん]する所[ところ]まで広[ひろ]がった。"
  4: "イスラエルの子[こ]らは、彼らの多[おお]さを見[み]て、ひどく動揺[どうよう]し、それぞれ隣[となり]の者[もの]に言[い]った。「今[いま]、これらの者[もの]は全[ぜん]地[ち]の面[おもて]をなめ尽[つ]くしてしまう。高[たか]い山[やま]も谷[たに]も丘[おか]も、彼らの重[おも]さに耐[た]えられない。」"
  5: "彼らはそれぞれ自分[じぶん]の武具[ぶぐ]を取[と]り、自分[じぶん]の塔[とう]の上[うえ]に火[ひ]を燃[も]やして、その夜[よ]を一晩中[ひとばんじゅう]、見張[みは]りながら過[す]ごした。"
  6: "二日目[ふつかめ]に、ホロフェルネスは自分のすべての騎兵[きへい]を、ベトリアにいたイスラエルの子[こ]らの前[まえ]に引[ひ]き出[だ]した。"
  7: "彼は彼らの町[まち]の登[のぼ]り口[ぐち]を視察[しさつ]し、水[みず]の泉[いずみ]を巡[めぐ]ってそれらを先[さき]に押[お]さえ、そこに戦士[せんし]たちの陣営[じんえい]を置[お]いた。彼自身[じしん]は自分の民[たみ]のもとへ戻[もど]った。"
  8: "エサウの子[こ]らのすべての長[かしら]たち、モアブの民[たみ]のすべての指導者[しどうしゃ]たち、および海岸[かいがん]地方[ちほう]の将軍[しょうぐん]たちが彼[かれ]のところへ来[き]て、言[い]った。"
  9: "「わたしたちの主人[しゅじん]よ、どうか一言[ひとこと]お聞[き]きください。あなたの軍[いくさ]に破[やぶ]れが生[しょう]じないためだ。"
  10: "この民[たみ]、イスラエルの子[こ]らは、自分[じぶん]の槍[やり]に頼[たよ]らず、自分[じぶん]が住[す]んでいる山[やま]の高[たか]みに頼っている。彼らの山[やま]の頂[いただき]に近[ちか]づくのは容易[ようい]ではないからだ。"
  11: "また今[いま]、主人[しゅじん]よ、彼らと、陣[じん]を整[ととの]えて戦[たたか]うようには戦わないでください。そうすれば、あなたの民[たみ]から男[おとこ]が一人[ひとり]も倒[たお]れることはない。"
  12: "あなたの陣営[じんえい]にとどまり、あなたの軍[いくさ]の男[おとこ]たちをすべて守[まも]っていてください。あなたのしもべたちに、山[やま]の根[ね]から流[なが]れ出[で]る水[みず]の泉[いずみ]を押[お]さえさせてください。"
  13: "ベトリアに住[す]む者[もの]はすべてそこから水を汲[く]んでいるからだ。渇[かわ]きが彼らを滅[ほろ]ぼし、彼らは自分[じぶん]の町[まち]を引[ひ]き渡[わた]すだろう。わたしたちとわたしたちの民[たみ]は、近[ちか]くの山[やま]の頂[いただき]に上[のぼ]り、そこに陣[じん]を敷[し]いて、町から男[おとこ]が一人[ひとり]も出[で]られないように見張[みは]ろう。"
  14: "彼らも、その妻[つま]たちも子[こ]どもたちも飢[う]えに衰[おとろ]え、剣[つるぎ]が彼らに臨[のぞ]む前[まえ]に、自分[じぶん]たちの住[す]まいの広場[ひろば]に打[う]ち倒[たお]されるだろう。"
  15: "あなたは、彼らが逆[さか]らい、あなたの顔[かお]に平和[へいわ]をもって会[あ]いに出[で]なかったゆえに、彼らに悪[わる]い報[むく]いを返[かえ]すだろう。」"
  16: "彼らの言葉[ことば]はホロフェルネスとそのすべてのしもべたちの前[まえ]で喜[よろこ]ばれ、彼は彼らが語[かた]ったとおりに行[おこな]うよう命[めい]じた。"
  17: "アンモンの子[こ]らの部隊[ぶたい]が、アッシリアの子ら五千人[ごせんにん]とともに進[すす]み出[で]た。彼らは谷間[たにま]に陣[じん]を敷[し]き、イスラエルの子らの水[みず]と水の泉[いずみ]を先[さき]に押[お]さえた。"
  18: "エサウの子らとアンモンの子らは上[のぼ]って、ドタンに面[めん]する山地[さんち]に陣を敷いた。彼らはそのうちの者[もの]たちを南[みなみ]と東[ひがし]へ、エグレベルに面する所[ところ]へ遣[つか]わした。エグレベルはホスの近[ちか]く、モクムル川[がわ]のほとりにある。アッシリアの残[のこ]りの軍[いくさ]は平野[へいや]に陣を敷き、地[ち]の面[おもて]をすべて覆[おお]った。その天幕[てんまく]と備[そな]えはおびただしい群[む]れとなって陣[じん]を敷[し]き、きわめて多[おお]き数[かず]となった。"
  19: "イスラエルの子[こ]らは自分[じぶん]たちの神[かみ]である主[しゅ]に向[む]かって叫[さけ]んだ。彼らの霊[れい]が挫[くじ]け、敵[てき]がすべて彼らを囲[かこ]み、その中[なか]から逃[に]げ出[だ]すことができなかったからである。"
  20: "アッシリアの陣営[じんえい]のすべてが、歩兵[ほへい]も戦車[せんしゃ]も騎兵[きへい]も、彼らの周[まわ]りに三十四日[さんじゅうよっか]とどまった。すると、ベトリアに住[す]む者[もの]たちの水[みず]の器[うつわ]はすべて尽[つ]きた。"
  21: "貯水池[ちょすいち]は空[から]になり、彼らは一日[いちにち]も水を腹[はら]一杯[いっぱい]に飲[の]むことができなかった。水は量[はか]って彼らに与[あた]えられていたからである。"
  22: "彼らの幼[おさな]子[ご]たちは気[き]を落[お]とし、女[おんな]たちも若者[わかもの]たちも渇[かわ]きのために力[ちから]尽[つ]き、町[まち]の広場[ひろば]や門[もん]の通[とお]り道[みち]に倒[たお]れた。もはや彼らのうちに立[た]ち上[あ]がる力はなかった。"
  23: "民[たみ]はすべて、若者[わかもの]たちも女[おんな]たちも子[こ]どもたちも、オジヤと町[まち]の長[かしら]たちのところに集[あつ]まり、大声[おおごえ]を上[あ]げて叫[さけ]び、すべての長老[ちょうろう]たちの前[まえ]で言[い]った。"
  24: "「わたしたちとあなたがたとの間[あいだ]を神[かみ]が裁[さば]いてくださるように。あなたがたはわたしたちに大[おお]きな不正[ふせい]を行[おこな]った。アッシリアの子[こ]らと平和[へいわ]の言葉[ことば]を交[か]わさなかったからである。"
  25: "今[いま]、わたしたちを助[たす]ける者[もの]はなく、神[かみ]はわたしたちを彼らの手[て]に売[う]り渡[わた]して、わたしたちが彼らの前[まえ]で渇[かわ]きと大[おお]きな滅[ほろ]びによって倒[たお]れるようにされた。"
  26: "今[いま]、彼らを呼[よ]び寄[よ]せろ。町[まち]をすべてホロフェルネスの民[たみ]とそのすべての軍[いくさ]に分捕[ぶんど]りとして引[ひ]き渡[わた]せ。"
  27: "彼らに奪[うば]い取[と]られるほうが、わたしたちにとってはましだ。わたしたちは奴隷[どれい]になっても、わたしたちの命[いのち]は生[い]き、自分[じぶん]の目[め]で幼[おさな]子[ご]たちの死[し]を見[み]ることも、妻[つま]たちや子[こ]どもたちが魂[たましい]を引[ひ]き取[と]るのを見[み]ることもないからだ。"
  28: "わたしたちは、天[てん]と地[ち]とわたしたちの神[かみ]、わたしたちの父[ちち]たちの主[しゅ]を、あなたがたへの証人[しょうにん]として呼[よ]ぶ。この方[かた]はわたしたちの罪[つみ]と父たちの罪[つみ]に応[おう]じてわたしたちを罰[ばっ]する。どうか、今日[きょう]という日[ひ]に、この言葉[ことば]どおりになさらないように。」"
  29: "すると、すべての集会[しゅうかい]のただ中[なか]で、一同[いちどう]が心[こころ]を一[ひと]つにして激[はげ]しく泣[な]き、声[こえ]を上[あ]げて神[かみ]である主[しゅ]に叫[さけ]んだ。"
  30: "オジヤは彼らに言[い]った。「兄弟[きょうだい]たちよ、勇気[ゆうき]を出[だ]せ。あと五日[いつか]、耐[た]え忍[しの]ぼう。その間[あいだ]に、わたしたちの神[かみ]である主[しゅ]はそのあわれみをわたしたちに返[かえ]してくださる。主はわたしたちを最後[さいご]まで見捨[みす]てることはないからである。"
  31: "もしその日[ひ]々[び]が過[す]ぎても、わたしたちに助[たす]けが来[こ]なければ、わたしはあなたがたの言葉[ことば]どおりにしよう。」"
  32: "こうして、彼は民[たみ]をそれぞれの陣営[じんえい]に散[ち]らした。彼らは自分[じぶん]の町[まち]の城壁[じょうへき]と塔[とう]へ行[い]き、女[おんな]たちと子[こ]どもたちを自分[じぶん]の家[いえ]へ帰[かえ]した。町[まち]はひどく打[う]ちひしがれていた。"

notes:
  1: "Τῇ δὲ ἐπαύριον — «на другой день» (ἐπαύριον). παρήγγειλεν — «приказал, передал приказ» (παραγγέλλω); ἀναζευγνύειν — «сниматься с лагеря, выступать» (ἀναζεύγνυμι), слав. «воздвигнутися». ἐπὶ τὴν συμμαχίαν αὐτοῦ — «на помощь, в союз к нему» (συμμαχία), слав. «на споборение». τὰς ἀναβάσεις τῆς ὀρεινῆς — «подъёмы, восходы нагорной страны» (ἀνάβασις, ὀρεινή); προκαταλαμβάνεσθαι — «занимать заранее» (προκαταλαμβάνομαι)."
  2: "ἀνὴρ δυνατός — «сильный, боеспособный муж». ἀνδρῶν πολεμιστῶν χιλιάδες πεζῶν ἑκατὸν ἑβδομήκοντα — 170 тысяч пеших воинов; ἱππέων χιλιάδες δέκα δύο — 12 тысяч всадников; слав. «сто седмьдесять тысящ… дванадесять». χωρὶς τῆς ἀποσκευῆς — «кроме обоза, поклажи» (ἀποσκευή), слав. «кроме приуготовления». πλῆθος πολὺ σφόδρα — «весьма великое множество»."
  3: "αὐλών — «ущелье, долина» (слав. «юдоль»); παρενέβαλον — «расположились лагерем» (παρεμβάλλω). παρέτειναν εἰς εὖρος — «растянулись в ширину» (παρατείνω, εὖρος), εἰς μῆκος — «в длину» (μῆκος). Βελβαιμ — ベルバイム (слав. «велфем», Син. «Велфем»); Κυαμων — キアモン (слав. «киамон»); ἥ ἐστιν ἀπέναντι τοῦ Εσδρηλων — «который напротив Ездрилона»: относительное ἥ жен. р., вероятно, согласовано с подразумеваемым κώμη («селение»)."
  4: "ὡς εἶδον αὐτῶν τὸ πλῆθος — «увидев их множество»; ἐταράχθησαν σφόδρα — «сильно смутились, пришли в смятение» (ταράσσω). ἐκλείξουσιν — буд. от ἐκλείχω, «слижут, вылижут»: яркая метафора, слав. «полижут», поэтому なめ尽くす. ὑποστήσονται τὸ βάρος — «выдержат тяжесть» (ὑφίστημι, βάρος). Слова каждого к ближнему — 「…」."
  5: "ἀναλαβόντες ἕκαστος τὰ σκεύη τὰ πολεμικά — «взяв каждый своё военное снаряжение» (σκεῦος, πολεμικός). ἀνακαύσαντες πυράς — «зажёгши огни» (ἀνακαίω, πυρά), ἐπὶ τοὺς πύργους αὐτῶν — «на башнях своих» (πύργος). ἔμενον φυλάσσοντες — «оставались, охраняя» (φυλάσσω)."
  6: "τῇ ἡμέρᾳ τῇ δευτέρᾳ — «на второй день» (δεύτερος). ἐξήγαγεν … πᾶσαν τὴν ἵππον — «вывел всю конницу» (ἵππος здесь собирательно, «конница»). κατὰ πρόσωπον τῶν υἱῶν Ισραηλ — «пред лицом сынов Израиля», т. е. напротив них."
  7: "ἐπεσκέψατο — «осмотрел, обследовал» (ἐπισκέπτομαι); τὰς ἀναβάσεις τῆς πόλεως — «подступы, восходы к городу». ἐφώδευσεν — «обошёл» (ὁδεύω в сложении); προκατελάβετο — «занял заранее» (προκαταλαμβάνω). ἐπέστησεν αὐταῖς παρεμβολὰς ἀνδρῶν πολεμιστῶν — «приставил к ним лагеря воинов» (ἐφίστημι, παρεμβολή), слав. «пристави к ним ополчения мужей ратных». ἀνέζευξεν εἰς τὸν λαὸν αὐτοῦ — «вернулся к своему народу»."
  8: "προσελθόντες — «подойдя» (προσέρχομαι). ἄρχοντες υἱῶν Ησαυ — «начальники сынов Исава» (エサウ). οἱ ἡγούμενοι τοῦ λαοῦ Μωαβ — «вожди народа Моава» (ἡγέομαι). οἱ στρατηγοὶ τῆς παραλίας — «военачальники приморья» (παραλία), слав. «воеводы примория». εἶπαν вводит речь, которая начинается в ст. 9."
  9: "ὁ δεσπότης ἡμῶν — «господин наш» (δεσπότης), обращение к Олоферну; слав. «владыка наш». Ἀκουσάτω δή — импер. 3 л. ед. ч.: «пусть послушает». θραῦσμα — «поражение, урон» (θραῦσμα, собств. «обломок»), слав. «сокрушение»."
  10: "οὐ πέποιθαν — перф. от πείθω, «не положились, не надеются»; ἐπὶ τοῖς δόρασιν — «на копья» (δόρυ). ἐπὶ τοῖς ὕψεσι τῶν ὀρέων — «на высоты гор» (ὕψος), слав. «на высоты гор своих». ἐνοικοῦσιν ἐν αὐτοῖς — плеоназм «живут в них»; εὐχερές — «легко, удобно» (εὐχερής); προσβῆναι ταῖς κορυφαῖς — «подступить к вершинам» (κορυφή)."
  11: "μὴ πολέμει — импер. наст. «не воюй» (πολεμέω). καθὼς γίνεται πόλεμος παρατάξεως — «как бывает война в строю, правильное сражение» (παράταξις), слав. «якоже бывает рать ополчения». οὐ πεσεῖται … ἀνὴρ εἷς — «не падёт ни один муж»."
  12: "ἀνάμεινον — импер. аор. «останься, подожди» (ἀναμένω); ἐπὶ τῆς παρεμβολῆς σου — «в лагере твоём». διαφυλάσσων — прич. «сохраняя» (διαφυλάσσω). ἐπικρατησάτωσαν — импер. 3 л. мн. ч. «пусть овладеют» (ἐπικρατέω). τῆς πηγῆς τοῦ ὕδατος, ἣ ἐκπορεύεται ἐκ τῆς ῥίζης τοῦ ὄρους — «источник воды, вытекающий из корня (подошвы) горы» (πηγή, ἐκπορεύομαι, ῥίζα), слав. «из корене горы»."
  13: "ὑδρεύονται — «черпают воду» (ὑδρεύω); ἀνελεῖ — «погубит, уничтожит» (ἀναιρέω); ἡ δίψα — «жажда» (δίψα); ἐκδώσουσι — «отдадут» (ἐκδίδωμι). ἀναβησόμεθα ἐπὶ τὰς πλησίον κορυφάς — «взойдём на ближние вершины». παρεμβαλοῦμεν … εἰς προφυλακήν — «расположимся лагерем для охраны» (προφυλακή); τοῦ μὴ ἐξελθεῖν … ἄνδρα ἕνα — «чтобы не вышел ни один муж»."
  14: "τακήσονται ἐν τῷ λιμῷ — «истают, изнемогут от голода» (τήκω, λιμός). πρὶν ἐλθεῖν τὴν ῥομφαίαν — «прежде чем придёт меч» (ῥομφαία, 剣). καταστρωθήσονται — «будут повержены, падут» (καταστρώννυμι); ἐν ταῖς πλατείαις τῆς οἰκήσεως αὐτῶν — «на улицах, площадях жилища их» (πλατεῖα, οἴκησις), слав. «на стогнах обитания своего»."
  15: "ἀνταποδώσεις … ἀνταπόδομα πονηρόν — «воздашь злым воздаянием» (ἀνταποδίδωμι, ἀνταπόδομα; тавтология греческого сохранена). ἀνθ᾽ ὧν ἐστασίασαν — «за то, что возмутились, взбунтовались» (στασιάζω), слав. «бокрамолствоваша». οὐκ ἀπήντησαν τῷ προσώπῳ σου ἐν εἰρήνῃ — «не вышли навстречу лицу твоему с миром» (ἀπαντάω)."
  16: "ἤρεσαν — «понравились, были угодны» (ἀρέσκω); ἐνώπιον Ολοφέρνου καὶ … τῶν θεραπόντων αὐτοῦ — «пред Олоферном и слугами его» (θεράπων). συνέταξε ποιεῖν καθὰ ἐλάλησαν — «приказал сделать, как они сказали» (συντάσσω)."
  17: "ἀπῆρεν — «выступил, двинулся» (ἀπαίρω); παρεμβολὴ υἱῶν Αμμων — «полк сынов Аммона» (παρεμβολή). χιλιάδες πέντε υἱῶν Ασσουρ — «пять тысяч сынов Ассура» (アッシリア). προκατελάβοντο τὰ ὕδατα καὶ τὰς πηγάς — «заняли воды и источники вод»."
  18: "ἀνέβησαν — «взошли» (ἀναβαίνω). ἐν τῇ ὀρεινῇ ἀπέναντι Δωθαιμ — «в нагорной [стране] напротив Дотаима». πρὸς νότον καὶ ἀπηλιώτην — «на юг и на восток» (ἀπηλιώτης — восточный ветер, восток). Εγρεβηλ, Χους, χειμάρρου Μοχμουρ — エグレベル, ホス, モクムル; χείμαρρος — «зимний поток, русло» (слав. «потоце»). αἱ ἀπαρτίαι αὐτῶν — «их снаряжение, обоз» (ἀπαρτία), слав. «припасы»; κατεστρατοπέδευσαν — «разбили лагерь» (καταστρατοπεδεύω)."
  19: "ἀνεβόησαν πρὸς κύριον — «воззвали к Господу» (ἀναβοάω). ὠλιγοψύχησεν τὸ πνεῦμα αὐτῶν — «пал духом их» (ὀλιγοψυχέω, букв. «малодушествовать»), слав. «возмалодушествова дух их»; поэтому 霊が挫けた, без сглаживания. ἐκύκλωσαν — «окружили» (κυκλόω); οὐκ ἦν διαφυγεῖν ἐκ μέσου αὐτῶν — «не было [возможности] убежать из среды их» (διαφεύγω)."
  20: "παρεμβολὴ Ασσουρ — «лагерь Ассирии». οἱ πεζοὶ καὶ ἅρματα καὶ οἱ ἱππεῖς — «пешие, колесницы и всадники» (ἅρμα). ἡμέρας τριάκοντα τέσσαρας — тридцать четыре дня. ἐξέλιπεν … πάντα τὰ ἀγγεῖα αὐτῶν τῶν ὑδάτων — «истощились все сосуды воды их» (ἐκλείπω, ἀγγεῖον)."
  21: "οἱ λάκκοι ἐξεκενοῦντο — «водоёмы (ямы-цистерны) опорожнялись» (λάκκος, ἐκκενόω), слав. «рвы оскудеваша»; в 8:31 то же слово — 貯水池. εἰς πλησμονήν — «до насыщения» (πλησμονή); ἐν μέτρῳ — «мерою» (μέτρον): воду выдавали порциями."
  22: "ἠθύμησεν — «упали духом, уныли» (ἀθυμέω); τὰ νήπια — «младенцы, дети» (νήπιος). ἐξέλιπον ἀπὸ τῆς δίψης — «изнемогли от жажды» (ἐκλείπω). ἐν ταῖς διόδοις τῶν πυλῶν — «в проходах ворот» (δίοδος). οὐκ ἦν κραταίωσις ἔτι ἐν αὐτοῖς — «не было уже крепости в них» (κραταίωσις), передано как 立ち上がる力."
  23: "ἐπισυνήχθησαν — «собрались» (ἐπισυνάγω); οἱ νεανίσκοι καὶ αἱ γυναῖκες καὶ τὰ παιδία — «юноши, жёны и дети» (νεανίσκος, παιδίον). ἀνεβόησαν φωνῇ μεγάλῃ — «возопили громким голосом». ἐναντίον πάντων τῶν πρεσβυτέρων — «пред всеми старейшинами» (πρεσβύτερος); речь начинается в ст. 24."
  24: "Κρῖναι ὁ θεὸς ἀνὰ μέσον ὑμῶν καὶ ἡμῶν — оптатив: «да рассудит Бог между вами и нами» (κρίνω, ἀνὰ μέσον). ἀδικίαν μεγάλην — «великую неправду» (ἀδικία). οὐ λαλήσαντες εἰρηνικὰ μετὰ υἱῶν Ασσουρ — «не сказав мирного с сынами Ассура» (εἰρηνικός), слав. «не глаголюще мирная»."
  25: "οὐκ ἔστιν ὁ βοηθὸς ἡμῶν — «нет помощника нашего» (βοηθός). πέπρακεν — перф. от πιπράσκω, «продал»; εἰς τὰς χεῖρας αὐτῶν — «в руки их». τοῦ καταστρωθῆναι — «чтобы быть поверженными» (καταστρώννυμι); ἐν δίψῃ καὶ ἀπωλείᾳ μεγάλῃ — «в жажде и великой погибели» (ἀπώλεια)."
  26: "ἐπικαλέσασθε — импер. аор. «призовите, позовите» (ἐπικαλέομαι); ἔκδοσθε — импер. «отдайте» (ἐκδίδωμι). εἰς προνομήν — «на разграбление, в добычу» (προνομή), слав. «в расхищение»; τῷ λαῷ Ολοφέρνου καὶ πάσῃ τῇ δυνάμει αὐτοῦ — «народу Олоферна и всему войску его»."
  27: "κρεῖσσον γὰρ ἡμῖν γενηθῆναι αὐτοῖς εἰς διαρπαγήν — «ибо лучше нам достаться им на расхищение» (κρείσσων, διαρπαγή). ἐσόμεθα εἰς δούλους — «будем рабами» (δοῦλος). ζήσεται ἡ ψυχὴ ἡμῶν — «жива будет душа наша». ἐκλειπούσας τὰς ψυχάς — «испускающих души» (ἐκλείπω + ψυχή): буквальный оборот сохранён (魂を引き取る)."
  28: "μαρτυρόμεθα ὑμῖν — «призываем вам во свидетели» (μαρτύρομαι с дат. лица); τὸν οὐρανὸν καὶ τὴν γῆν — «небо и землю». ἐκδικεῖ — «мстит, взыскивает» (ἐκδικέω). κατὰ τὰς ἁμαρτίας … κατὰ τὰ ἁμαρτήματα — различие ἁμαρτία/ἁμάρτημα (грех/прегрешение) передано одним 罪. ἵνα μὴ ποιήσῃ κατὰ τὰ ῥήματα ταῦτα ἐν τῇ ἡμέρᾳ τῇ σήμερον — «да не сотворит по словам сим в день сей»: пожелание, чтобы Бог не исполнил клятву сегодня."
  29: "κλαυθμὸς μέγας — «великий плач» (κλαυθμός); ἐν μέσῳ τῆς ἐκκλησίας — «посреди собрания» (ἐκκλησία, 集会). ὁμοθυμαδόν — «единодушно» (наречие). ἐβόησαν φωνῇ μεγάλῃ — «возопили громким голосом» (βοάω)."
  30: "Θαρσεῖτε — импер. «дерзайте, мужайтесь» (θαρσέω); διακαρτερήσωμεν — «потерпим, выдержим» (διακαρτερέω); ἔτι πέντε ἡμέρας — «ещё пять дней». ἐπιστρέψει τὸ ἔλεος αὐτοῦ ἐφ᾽ ἡμᾶς — «обратит милость Свою на нас» (ἐπιστρέφω, ἔλεος). οὐ γὰρ ἐγκαταλείψει ἡμᾶς εἰς τέλος — «не оставит нас вконец» (ἐγκαταλείπω, εἰς τέλος)."
  31: "ἐὰν δὲ διέλθωσιν αὗται — «если же пройдут они» (διέρχομαι; αὗται — о днях). βοήθεια — «помощь» (βοήθεια). ποιήσω κατὰ τὰ ῥήματα ὑμῶν — «сделаю по словам вашим», слав. «по словесем вашым»."
  32: "ἐσκόρπισεν — «рассеял, распустил» (σκορπίζω); εἰς τὴν ἑαυτοῦ παρεμβολήν — «в свой лагерь» (каждый в свой). ἐπὶ τὰ τείχη καὶ τοὺς πύργους — «на стены и башни» (τεῖχος, πύργος). ἐν ταπεινώσει πολλῇ — «в великом уничижении, подавленности» (ταπείνωσις), слав. «во смирении мнозе», Син. «в великой скорби»."
