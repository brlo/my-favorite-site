# jp-box, Иудифь, глава 7. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 7: приказ Олоферна выступать (1–3), ужас израильтян и ночная стража (4–5),
# конница перед городом (6–7), совет начальников Едома, Моава и приморья перекрыть
# воду (8–15), совет принят (16), лагерь вокруг источников (17–18), тридцать четыре
# дня осады и жажда (19–22), ропот народа (23–28), плач (29), речь Озии о пяти днях
# (30–31), народ распущен по домам (32).
# Прямая речь — 「…」: 4 (слова каждого к ближнему), 9–15 (совет), 24–28 (ропот),
# 30–31 (Озия); красного и синего нет.
# Нумерация по gr: 32 стиха; деление совпадает с csl.
# 〔…〕 нет: все стихи есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 陣営, 天幕, 将軍, 塔, 泉 и пр. уже в корпусе.
# Имена — транслитерация греческого (LXX).

