# jp-box, Притчи, глава 28. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для гл. 28 нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 28: бегство нечестивого и смелость праведного (1); грех и суды (2); притеснитель
# бедных и сравнение с ливнем (3), продолженное в 4; любящие закон (4); разумение суда (5);
# бедный в истине (6); хранящий закон сын (7); рост с лихвой (8); молитва отвергающего
# закон (9); совращающий прямых (10); богатый в своих глазах (11); слава при праведных
# (12); скрывающий и обличающий (13); боящийся и жестокосердый (14); волк над бедным
# народом (15); царь-клеветник (16); порука за убийцу и наказание сына (17); праведный
# и кривые пути (18); возделывающий землю (19); верный и злой (20); лицеприятие (21);
# завистливый (22); обличающий и льстящий (23); отвергающий родителей (24); надеющийся
# на Господа (25); дерзкое сердце (26); дающий нищему (27); стенание праведных (28).
# Прямой речи нет.
# Нумерация по gr: 28 стихов, деление совпадает с csl. В ст. 17 gr содержит подстих 17a
# (παίδευε υἱόν…), он есть и в csl — переведён в том же стихе, отдельного стиха нет.
# Сравнение ст. 3 продолжается в ст. 4 (οὕτως); в японском ст. 3 закончен, ст. 4
# начинается с そのように, чтобы стих не обрывался на полуслове.
# В ст. 12 у csl «погибают человецы» (LXX ἁλίσκονται «ловятся»); по паритету взято
# слав. чтение, вариант LXX — в notes.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).

