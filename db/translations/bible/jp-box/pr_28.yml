verses:
  1: "不敬[ふけい]な者[もの]は、だれも追[お]ってこないのに逃[に]げる。しかし、正[ただ]しい者[もの]は獅子[しし]のように大胆[だいたん]である。"
  2: "不敬[ふけい]な者[もの]たちの罪[つみ]によって裁[さば]きが起[お]こる。しかし、賢[かしこ]い人[ひと]はそれを消[け]し止[と]める。"
  3: "不敬[ふけい]な行[おこな]いのうちで大胆[だいたん]な者[もの]は貧[まず]しい者[もの]を中傷[ちゅうしょう]する。それは、激[はげ]しく降[ふ]る無益[むえき]な雨[あめ]のようである。"
  4: "そのように、律法[りっぽう]を捨[す]てる者[もの]たちは不敬[ふけい]をほめたたえる。しかし、律法を愛[あい]する者[もの]たちは自分[じぶん]に城壁[じょうへき]を巡[めぐ]らす。"
  5: "悪[わる]い人[ひと]たちは裁[さば]きを悟[さと]らない。しかし、主[しゅ]を求[もと]める者[もの]たちはすべてのことを悟る。"
  6: "多[おお]くの富[とみ]を持[も]ちながら偽[いつわ]りを行[おこな]う者[もの]よりも、真理[しんり]のうちを歩[あゆ]む貧[まず]しい者[もの]のほうが良[よ]い。"
  7: "思慮[しりょ]ある子[こ]は律法[りっぽう]を守[まも]る。しかし、放蕩[ほうとう]を牧[まき]する者[もの]は自分[じぶん]の父[ちち]を辱[はずかし]める。"
  8: "利息[りそく]と高利[こうり]によって自分[じぶん]の富[とみ]を増[ふ]やす者[もの]は、貧[まず]しい者[もの]をあわれむ者[もの]のためにそれを蓄[たくわ]える。"
  9: "律法[りっぽう]に聞[き]き従[したが]わないように耳[みみ]を背[そむ]ける者[もの]は、自分[じぶん]の祈[いの]りをも忌[い]まわしいものとする。"
  10: "正[ただ]しい者[もの]たちを悪[わる]い道[みち]へ迷[まよ]わせる者[もの]は、自[みずか]ら滅[ほろ]びに陥[おちい]る。不法[ふほう]な者[もの]たちは良[よ]いものを通[とお]り過[す]ぎて、それに入[はい]ることはない。"
  11: "富[とみ]める人[ひと]は自分[じぶん]を賢[かしこ]いと思[おも]う。しかし、貧[まず]しくても思慮[しりょ]ある者[もの]はその者[もの]を裁[さば]き定[さだ]める。"
  12: "正[ただ]しい者[もの]たちの助[たす]けによって栄光[えいこう]は大[おお]きくなる。しかし、不敬[ふけい]な者[もの]たちの場所[ばしょ]では人[ひと]が滅[ほろ]びる。"
  13: "自分[じぶん]の不敬[ふけい]を隠[かく]す者[もの]は栄[さか]えない。しかし、責[せ]めを告[つ]げ明[あ]かす者[もの]は愛[あい]される。"
  14: "敬虔[けいけん]のゆえにすべてのことを恐[おそ]れる人[ひと]は幸[さいわ]いである。しかし、心[こころ]を強[かた]くする者[もの]は災[わざわ]いに陥[おちい]る。"
  15: "飢[う]えた獅子[しし]、渇[かわ]いた狼[おおかみ]。自分[じぶん]も貧[まず]しいのに貧しい民[たみ]を虐[しいた]げ支配[しはい]する者[もの]は、そのとおりである。"
  16: "収入[しゅうにゅう]の乏[とぼ]しい王[おう]は大[おお]きな中傷者[ちゅうしょうしゃ]となる。しかし、不正[ふせい]を憎[にく]む者[もの]は長[なが]い年月[としつき]生[い]きる。"
  17: "殺人[さつじん]の罪[つみ]に問[と]われている者[もの]の保証人[ほしょうにん]となる者[もの]は逃亡者[とうぼうしゃ]となり、安全[あんぜん]のうちにはいない。子[こ]を戒[いまし]めよ。そうすれば、子はあなたを愛[あい]し、あなたの魂[たましい]に飾[かざ]りを与[あた]える。不法[ふほう]な民[たみ]に聞[き]き従[したが]ってはならない。"
  18: "正[ただ]しく歩[あゆ]む者[もの]は助[たす]けられる。しかし、曲[ま]がった道[みち]を歩む者[もの]は絡[から]め取[と]られる。"
  19: "自分[じぶん]の土地[とち]を耕[たがや]す者[もの]はパンに満[み]ち足[た]りる。しかし、怠惰[たいだ]を追[お]い求[もと]める者[もの]は貧[まず]しさに満ちる。"
  20: "信頼[しんらい]に値[あたい]する人[ひと]は多[おお]く祝福[しゅくふく]される。しかし、悪[わる]い者[もの]は罰[ばつ]を免[まぬか]れない。"
  21: "正[ただ]しい者[もの]たちの顔[かお]に遠慮[えんりょ]しない者[もの]は良[よ]くない。そのような者[もの]はパンのかけらのために人[ひと]を売[う]り渡[わた]す。"
  22: "妬[ねた]み深[ぶか]い人[ひと]は富[とみ]を築[きず]くことに急[いそ]ぐが、あわれみ深[ふか]い者[もの]が自分[じぶん]を支配[しはい]することになるのを知[し]らない。"
  23: "人[ひと]の道[みち]を責[せ]める者[もの]は、舌[した]でへつらう者[もの]よりも、のちに恵[めぐ]みを受[う]ける。"
  24: "父[ちち]や母[はは]を捨[す]てて、自分[じぶん]は罪[つみ]を犯[おか]していないと考[かんが]える者[もの]は、不敬[ふけい]な者[もの]の仲間[なかま]である。"
  25: "飽[あ]きることのない人[ひと]は無分別[むふんべつ]に裁[さば]く。しかし、主[しゅ]に信頼[しんらい]を置[お]く者[もの]は顧[かえり]みのうちに置[お]かれる。"
  26: "高[たか]ぶった心[こころ]に信頼[しんらい]する者[もの]は愚[おろ]かである。しかし、知恵[ちえ]のうちを歩[あゆ]む者[もの]は救[すく]われる。"
  27: "貧[まず]しい者[もの]に与[あた]える者[もの]は乏[とぼ]しくなることはない。しかし、目[め]をそらす者[もの]は大[おお]きな困窮[こんきゅう]に陥[おちい]る。"
  28: "不敬[ふけい]な者[もの]たちの場所[ばしょ]では正[ただ]しい者[もの]たちが嘆[なげ]く。しかし、彼[かれ]らが滅[ほろ]びると、正しい者[もの]たちは増[ふ]えていく。"

notes:
  1: "φεύγει ἀσεβὴς μηδενὸς διώκοντος — «бежит нечестивый, никто не гонящий» (διώκω — «гнать, преследовать»); δίκαιος δὲ ὥσπερ λέων πέποιθεν — «праведный же как лев уповает»: πέποιθεν, perfect от πείθω, «уверен, полагается». Слав. «праведный же яко лев уповая», Син. «смел, как лев»."
  2: "δι᾽ ἁμαρτίας ἀσεβῶν κρίσεις ἐγείρονται — «через грех нечестивых суды (тяжбы) воздвигаются» (κρίσις — «суд, распря»); ἀνὴρ δὲ πανοῦργος κατασβέσει αὐτάς — «муж же сметливый угасит их» (κατασβέννυμι — «гасить»; πανοῦργος — «ловкий, разумный»). Синодальный иной (по масоретскому тексту: «много начальников»)."
  3: "ἀνδρεῖος ἐν ἀσεβείαις συκοφαντεῖ πτωχούς — «дерзкий в нечестиях оклеветает бедных» (συκοφαντέω — «клеветать, вымогать»); ὥσπερ ὑετὸς λάβρος καὶ ἀνωφελής — «как дождь бурный и бесполезный» (λάβρος — «стремительный»; ἀνωφελής — «неполезный»). Сравнение завершается в ст. 4 (οὕτως), поэтому в японском ст. 3 закончен, а ст. 4 начинается с そのように."
  4: "οὕτως οἱ ἐγκαταλείποντες τὸν νόμον ἐγκωμιάζουσιν ἀσέβειαν — «так оставляющие закон хвалят нечестие» (ἐγκαταλείπω — «оставлять»); οἱ δὲ ἀγαπῶντες τὸν νόμον περιβάλλουσιν ἑαυτοῖς τεῖχος — «любящие же закон обносят себя стеной» (περιβάλλω — «облагать, обносить»; τεῖχος — «стена»); слав. «ограждают себе стену»."
  5: "ἄνδρες κακοὶ οὐ νοήσουσιν κρίμα — «мужи злые не уразумеют суда» (νοέω — «понимать»; κρίμα — «суд, приговор»); οἱ δὲ ζητοῦντες τὸν κύριον συνήσουσιν ἐν παντί — «ищущие же Господа уразумеют во всём» (συνίημι — «понимать, разуметь»)."
  6: "κρείσσων πτωχὸς πορευόμενος ἐν ἀληθεία πλουσίου ψευδοῦς — «лучше бедный, ходящий в истине, богатого лживого» (ψευδής — «лживый»); слав. «лучше нищ ходяй во истине, нежели богат ложь». Синодальный иной (по масоретскому тексту: «извращает пути свои»)."
  7: "φυλάσσει νόμον υἱὸς συνετός — «хранит закон сын разумный» (συνετός — «понятливый, разумный»); ὃς δὲ ποιμαίνει ἀσωτίαν, ἀτιμάζει πατέρα — «кто же пасёт распутство, бесчестит отца» (ποιμαίνω — «пасти»; ἀσωτία — «распутство, расточительность»); слав. «пасет несытость»."
  8: "ὁ πληθύνων τὸν πλοῦτον αὐτοῦ μετὰ τόκων καὶ πλεονασμῶν — «умножающий богатство своё с процентами и приростами» (τόκος — «процент, лихва»; πλεονασμός — «прибыток»); τῷ ἐλεῶντι πτωχοὺς συνάγει αὐτόν — «милующему нищих собирает его» (ἐλεάω — «миловать»; συνάγω — «собирать»)."
  9: "ὁ ἐκκλίνων τὸ οὖς αὐτοῦ τοῦ μὴ εἰσακοῦσαι νόμου — «уклоняющий ухо своё, чтобы не услышать закон» (ἐκκλίνω — «уклонять»; εἰσακούω — «внимать»); καὶ αὐτὸς τὴν προσευχὴν αὐτοῦ ἐβδέλυκται — «и сам молитву свою сделал мерзостью» (βδελύσσομαι — «гнушаться»), т. е. его молитва становится мерзкой."
  10: "ὃς πλανᾷ εὐθεῖς ἐν ὁδῷ κακῇ — «кто совращает прямых на путь злой» (πλανάω — «вводить в заблуждение»; εὐθύς — «прямой»); εἰς διαφθορὰν αὐτὸς ἐμπεσεῖται — «в погибель сам впадёт» (διαφθορά — «тление, гибель»); οἱ δὲ ἄνομοι διελεύσονται ἀγαθὰ καὶ οὐκ εἰσελεύσονται εἰς αὐτά — «беззаконные же пройдут мимо благ и не войдут в них»."
  11: "σοφὸς παρ᾽ ἑαυτῷ ἀνὴρ πλούσιος — «мудр у себя муж богатый» (παρ᾽ ἑαυτῷ — «в своих глазах»); πένης δὲ νοήμων καταγνώσεται αὐτοῦ — «бедный же разумный осудит его» (καταγινώσκω — «осуждать, признавать виновным»)."
  12: "διὰ βοήθειαν δικαίων πολλὴ γίνεται δόξα — «через помощь праведных многая бывает слава» (βοήθεια — «помощь»); ἐν δὲ τόποις ἀσεβῶν ἁλίσκονται ἄνθρωποι — «на местах же нечестивых ловятся (захватываются) люди» (ἁλίσκομαι — «быть пойманным»). По паритету взято слав. «погибают человецы», вариант LXX отмечен здесь; Синодальный иной («укрываются», по масоретскому тексту)."
  13: "ὁ ἐπικαλύπτων ἀσέβειαν ἑαυτοῦ οὐκ εὐοδωθήσεται — «скрывающий нечестие своё не будет иметь успеха» (ἐπικαλύπτω — «покрывать»; εὐοδόομαι — «успевать, преуспевать»); ὁ δὲ ἐξηγούμενος ἐλέγχους ἀγαπηθήσεται — «объявляющий обличения возлюблен будет» (ἐξηγέομαι — «изъяснять, объявлять»)."
  14: "μακάριος ἀνήρ, ὃς καταπτήσσει πάντα δι᾽ εὐλάβειαν — «блажен муж, который страшится всего из благоговения» (καταπτήσσω — «страшиться, робеть»; εὐλάβεια — «благоговение»); ὁ δὲ σκληρὸς τὴν καρδίαν ἐμπεσεῖται κακοῖς — «жёсткий же сердцем впадёт в злое» (σκληρός — «жёсткий, упорный»)."
  15: "λέων πεινῶν καὶ λύκος διψῶν — «лев голодный и волк жаждущий»; ὃς τυραννεῖ πτωχὸς ὢν ἔθνους πενιχροῦ — «кто тиранствует, будучи беден, над народом убогим» (τυραννέω — «угнетать, тиранствовать»; πενιχρός — «бедный»). Синодальный «как рыкающий лев и голодный медведь» (по масоретскому тексту)."
  16: "βασιλεὺς ἐνδεὴς προσόδων μέγας συκοφάντης — «царь, скудный доходами, — великий клеветник (вымогатель)» (ἔνδεια — «недостаток»; πρόσοδος — «доход»; συκοφάντης — «клеветник, вымогатель»); ὁ δὲ μισῶν ἀδικίαν μακρὸν χρόνον ζήσεται — «ненавидящий же неправду долгое время проживёт»."
  17: "ἄνδρα τὸν ἐν αἰτίᾳ φόνου ὁ ἐγγυώμενος φυγὰς ἔσται — «за мужа, виновного в убийстве, поручающийся будет беглецом» (αἰτία — «вина»; ἐγγυάομαι — «поручиться»; φυγάς — «беглец»); καὶ οὐκ ἐν ἀσφαλείᾳ — «и не в безопасности». Подстих 17a: παίδευε υἱόν, καὶ ἀγαπήσει σε — «наказывай сына, и возлюбит тебя»; δώσει κόσμον τῇ σῇ ψυχῇ — «даст украшение душе твоей» (κόσμος — «украшение»); οὐ μὴ ὑπακούσῃς ἔθνει παρανόμῳ — «не послушайся народа беззаконного». В gr и csl это один стих с 17a, отдельного стиха нет."
  18: "ὁ πορευόμενος δικαίως βεβοήθηται — «ходящий праведно получил помощь» (βοηθέω — «помогать»); ὁ δὲ σκολιαῖς ὁδοῖς πορευόμενος ἐμπλακήσεται — «ходящий же кривыми путями запутается» (σκολιός — «кривой»; ἐμπλέκομαι — «запутываться»)."
  19: "ὁ ἐργαζόμενος τὴν ἑαυτοῦ γῆν πλησθήσεται ἄρτων — «возделывающий свою землю насытится хлебами» (ἐργάζομαι — «возделывать»); ὁ δὲ διώκων σχολὴν πλησθήσεται πενίας — «гонящийся же за праздностью насытится нищеты» (σχολή — «досуг, праздность»; πενία — «бедность»)."
  20: "ἀνὴρ ἀξιόπιστος πολλὰ εὐλογηθήσεται — «муж достойный веры много благословится» (ἀξιόπιστος — «заслуживающий доверия»); ὁ δὲ κακὸς οὐκ ἀτιμώρητος ἔσται — «злой же не останется без наказания» (ἀτιμώρητος — «ненаказанный»). Синодальный «кто спешит разбогатеть» (по масоретскому тексту)."
  21: "ὃς οὐκ αἰσχύνεται πρόσωπα δικαίων, οὐκ ἀγαθός — «кто не стыдится лиц праведных, не хорош» (αἰσχύνομαι — «стыдиться»; πρόσωπον — «лицо», здесь о лицеприятии); ὁ τοιοῦτος ψωμοῦ ἄρτου ἀποδώσεται ἄνδρα — «такой за кусок хлеба продаст мужа» (ψωμός — «кусок»; ἀποδίδωμι — «продавать, отдавать»)."
  22: "σπεύδει πλουτεῖν ἀνὴρ βάσκανος — «спешит разбогатеть муж завистливый» (σπεύδω — «торопиться»; βάσκανος — «завистливый»); οὐκ οἶδεν ὅτι ἐλεήμων κρατήσει αὐτοῦ — «не знает, что милостивый одолеет его» (ἐλεήμων — «милостивый»; κρατέω — «овладевать»). Кто «милостивый» — Бог или милосердный бедняк; двусмысленность сохранена."
  23: "ὁ ἐλέγχων ἀνθρώπου ὁδοὺς χάριτας ἕξει — «обличающий пути человека благодарность получит» (ἐλέγχω — «обличать»; χάρις — «благодать, благодарность»); μᾶλλον τοῦ γλωσσοχαριτοῦντος — «более, чем льстящий языком» (γλωσσοχαριτέω — «льстить языком»)."
  24: "ὃς ἀποβάλλεται πατέρα ἢ μητέρα — «кто отвергает отца или мать» (ἀποβάλλομαι — «отталкивать, отвергать»); καὶ δοκεῖ μὴ ἁμαρτάνειν — «и думает, что не грешит» (δοκέω — «думать, казаться»); οὗτος κοινωνός ἐστιν ἀνδρὸς ἀσεβοῦς — «тот сообщник мужа нечестивого» (κοινωνός — «участник, сообщник»). Синодальный «обкрадывает» (по масоретскому тексту)."
  25: "ἄπληστος ἀνὴρ κρίνει εἰκῇ — «ненасытный муж судит наобум» (ἄπληστος — «ненасытный»; εἰκῇ — «напрасно, опрометчиво»); ὃς δὲ πέποιθεν ἐπὶ κύριον, ἐν ἐπιμελείᾳ ἔσται — «полагающийся же на Господа в попечении будет» (ἐπιμέλεια — «забота, попечение»); слав. «в прилежании будет», Син. «будет благоденствовать»."
  26: "ὃς πέποιθεν θρασείᾳ καρδίᾳ — «кто полагается на дерзкое сердце» (θρασύς — «дерзкий, самонадеянный»); ὁ τοιοῦτος ἄφρων — «тот глуп»; ὃς δὲ πορεύεται σοφίᾳ, σωθήσεται — «ходящий же в премудрости спасётся»."
  27: "ὃς δίδωσιν πτωχοῖς, οὐκ ἐνδεηθήσεται — «дающий нищим не оскудеет» (ἐνδεόμαι — «нуждаться»); ὃς δὲ ἀποστρέφει τὸν ὀφθαλμὸν αὐτοῦ, ἐν πολλῇ ἀπορίᾳ ἔσται — «отвращающий же око своё в великой нужде будет» (ἀπορία — «нужда, безвыходность»)."
  28: "ἐν τόποις ἀσεβῶν στένουσι δίκαιοι — «на местах нечестивых стонут праведные» (στένω — «стенать»); ἐν δὲ τῇ ἐκείνων ἀπωλείᾳ πληθυνθήσονται δίκαιοι — «в погибели же их умножатся праведные» (ἀπώλεια — «погибель»; πληθύνω — «умножать»)."
