verses:
  1: "「これによって、わたしの心[こころ]は震[ふる]え、その場[ば]から離[はな]れ去[さ]った。"
  2: "主[しゅ]の怒[いか]りの激[はげ]しさのうちにある声[こえ]を聞[き]け。その口[くち]から語[かた]りが出[で]て来[く]る。"
  3: "天[てん]のすべての下[した]にその治[し]めがあり、その光[ひかり]は地[ち]の翼[つばさ]の上[うえ]にある。"
  4: "彼[かれ]の後[うし]ろに声[こえ]が叫[さけ]び、彼はその威光[いこう]の声で雷[かみなり]を鳴[な]らし、それらを変[か]えない。彼がその声を聞[き]くからである。"
  5: "力[ちから]ある方[かた]はその声[こえ]によって、驚[おどろ]くべきことをとどろかせる。神[かみ]はわたしたちが知[し]らなかった大[おお]きなことを行[おこな]われたからである。"
  6: "雪[ゆき]に『地[ち]にあれ』と命[めい]じ、大雨[おおあめ]の嵐[あらし]を、その支配[しはい]のもとにある雨[あめ]の嵐を降[ふ]らされる。"
  7: "すべての人[ひと]の手[て]に印[しるし]を押[お]し、すべての人が自分[じぶん]の弱[よわ]さを知[し]るようにされる。"
  8: "獣[けもの]たちは覆[おお]いの下[した]に入[はい]り、寝[ね]どこで静[しず]まった。"
  9: "倉[くら]からはつむじ風[かぜ]が迫[せま]り来[く]る。峰[みね]からは寒[さむ]さが来る。"
  10: "力[ちから]ある方[かた]の息[いき]によって氷[こおり]が与[あた]えられ、水[みず]はその望[のぞ]むままに導[みちび]かれる。"
  11: "選[えら]ばれたものを雲[くも]で覆[おお]い、その光[ひかり]で雲を散[ち]らされる。"
  12: "巡[めぐ]り行[ゆ]くものを、その望[のぞ]むままに彼[かれ]らのわざへと向[む]け変[か]えられる。彼らに命[めい]じられることはすべて、地[ち]の上で彼によって定[さだ]められている。"
  13: "それが懲[こら]しめのためであれ、ご自分[じぶん]の地[ち]のためであれ、あわれみのためであれ、神[かみ]はそれを見出[みいだ]される。"
  14: "ヨブよ、これらのことに耳[みみ]を傾[かたむ]けよ。立[た]って、主[しゅ]の力[ちから]について教[おし]えられよ。"
  15: "わたしたちは知[し]っている。主[しゅ]はそのわざを定[さだ]め、闇[やみ]から光[ひかり]を造[つく]られた。"
  16: "主[しゅ]は雲[くも]の見分[みわ]けを知[し]り、不[ふ]敬[けい]な者[もの]の驚[おどろ]くべき転落[てんらく]を知っておられる。"
  17: "あなたの衣[ころも]は暖[あたた]かく、地[ち]は南[みなみ]から静[しず]められる。"
  18: "あなたは彼[かれ]とともに、いにしえのものを固[かた]め、鋳[い]た鏡[かがみ]のように強[つよ]くすることができるのか。"
  19: "なぜか。わたしたちが彼[かれ]に何[なに]を言[い]うべきか、わたしに教[おし]えよ。わたしたちは多[おお]くを語[かた]るのをやめよう。"
  20: "わたしのもとに書物[しょもつ]があり、書記[しょき]が立[た]っているので、わたしが立ったまま人[ひと]を黙[だま]らせることができるのか。"
  21: "光[ひかり]はすべての者[もの]に見[み]えるのではない。それはいにしえのもののうちで遠[とお]く輝[かがや]き、彼[かれ]から出[で]るもののように雲[くも]の上[うえ]にある。"
  22: "北[きた]から金[きん]に輝[かがや]く雲[くも]が来[く]る。これらの上[うえ]に、全能者[ぜんのうしゃ]の大[おお]いなる栄光[えいこう]と誉[ほま]れがある。"
  23: "わたしたちは、彼[かれ]の力[ちから]に似[に]た者[もの]をほかに見出[みいだ]さない。正[ただ]しいことを裁[さば]く彼が聞[き]かないと、あなたは思[おも]うのか。"
  24: "それゆえ、人[ひと]々[びと]は彼[かれ]を恐[おそ]れる。心[こころ]の知恵[ちえ]ある者[もの]も彼を恐れる」。"

notes:
  1: "Елиуй. καὶ ταύτης ἐταράχθη ἡ καρδία μου — «и от этого смутилось сердце моё» (ταράσσω — «волновать, потрясать»); ἀπερρύη ἐκ τοῦ τόπου αὐτῆς — «отторглось от места своего» (ἀπορρέω — «стекать, утекать»; csl «отторжеся от места своего»). Речь Елиуя продолжается из 36:33 (в 36:2–33 — та же цитата, закрытая в конце главы ради баланса): вводной формулы нет, поэтому здесь цитата снова открывается, а закрывается в 37:24. ταύτης — род. ж. р., «от этого» (о сказанном прежде)."
  2: "Елиуй. ἄκουε ἀκοὴν ἐν ὀργῇ θυμοῦ κυρίου — «слушай слух в гневе ярости Господней» (ἀκοή — «слух, весть»; ὀργή и θυμός — «гнев» и «ярость»); μελέτη ἐκ στόματος αὐτοῦ ἐξελεύσεται — «и поучение из уст Его изыдет» (μελέτη — «размышление, речь»; csl «поучение»). Место тёмное: ἀκοή и μελέτη переданы как 声 и 語り, без сглаживания."
  3: "Елиуй. ὑποκάτω παντὸς τοῦ οὐρανοῦ ἀρχὴ αὐτοῦ — «под всем небом власть Его» (ἀρχή — «начало, начальство, власть»; csl «началство»); τὸ φῶς αὐτοῦ ἐπὶ πτερύγων τῆς γῆς — «свет Его на крыльях земли» (πτέρυγες γῆς — края земли)."
  4: "Елиуй. ὀπίσω αὐτοῦ βοήσεται φωνή — «вслед Ему возопиет голос»; βροντάσει ἐν φωνῇ ὕβρεως αὐτοῦ — «возгремит голосом величия Своего»: LXX ὕβρις — «дерзость, высокомерие», csl читает «величие»; по паритету в тексте 威光 (csl), LXX в notes. οὐκ ἀνταλλάξει αὐτούς — «не изменит их» (ἀνταλλάσσω — «обменивать, переменять»); смысл тёмный, в ru «не останавливает»; ὅτι ἀκούσει φωνὴν αὐτοῦ — «ибо услышит голос Его»."
  5: "Елиуй. βροντάσει ὁ ἰσχυρὸς ἐν φωνῇ αὐτοῦ θαυμάσια — «возгремит Крепкий гласом Своим дивное» (ὁ ἰσχυρός — о Боге; θαυμάσια — «дивное»); ἐποίησεν γὰρ μεγάλα, ἃ οὐκ ᾔδειμεν — «ибо сотворил великое, чего мы не знали» (ᾔδειμεν — плюсквамперфект от οἶδα)."
  6: "Елиуй. συντάσσων χιόνι Γίνου ἐπὶ τῆς γῆς — «повелевающий снегу: будь на земле» (συντάσσω — «приказывать»; Γίνου — импер. от γίνομαι, «стань, будь»); χειμὼν ὑετός, καὶ χειμὼν ὑετῶν δυναστείας αὐτοῦ — «буря дождя и буря дождей власти Его» (χειμών — «зима, буря»; csl «буря дождя, и буря дождев могутства его»). Повтор сохранён. Слова Бога к снегу — 『…』 внутри речи Елиуя."
  7: "Елиуй. ἐν χειρὶ παντὸς ἀνθρώπου κατασφραγίζει — «в руке всякого человека полагает печать» (κατασφραγίζω — «запечатывать»); ἵνα γνῷ πᾶς ἄνθρωπος τὴν ἑαυτοῦ ἀσθένειαν — «чтобы всякий человек познал свою немощь» (ἀσθένεια — «слабость, немощь»). В ru/МТ «чтобы знали дело Его» — иное чтение, не внесено."
  8: "Елиуй. εἰσῆλθεν δὲ θηρία ὑπὸ σκέπην — «вошли звери под кров» (σκέπη — «кров, укрытие»; при θηρία ср. р. мн. ч. глагол в ед. ч.); ἡσύχασαν δὲ ἐπὶ κοίτης — «и умолкли на ложе» (κοίτη — «постель, логово»)."
  9: "Елиуй. ἐκ ταμιείων ἐπέρχονται δῖναι — «из хранилищ приходят вихри» (ταμιεῖον — «сокровищница, кладовая»; δῖναι — «вихри, круговороты»); ἀπὸ δὲ ἀκρωτηρίων ψῦχος — «и от вершин — стужа» (ἀκρωτήριον — «вершина, мыс»; ψῦχος — «холод»). Слав. читает «из хранилищ внутренних находят болезни» (δῖναι понято иначе) — это расходится и с LXX, и с контекстом, поэтому в тексте LXX, csl в notes."
  10: "Елиуй. ἀπὸ πνοῆς ἰσχυροῦ δώσει πάγος — «от дыхания Крепкого даст лёд» (πνοή — «дыхание»; πάγος — «лёд, мороз»; csl «от дыхания крепка даст лед»); οἰακίζει δὲ τὸ ὕδωρ ὡς ἐὰν βούληται — «и управляет водою, как хочет» (οἰακίζω — «править, направлять», от οἴαξ — «кормило»)."
  11: "Елиуй. ἐκλεκτὸν καταπλάσσει νεφέλη — «избранное обмазывает облаком» (καταπλάσσω — «обмазывать, покрывать»; ἐκλεκτόν — «избранное», вероятно о молнии, но слово оставлено без уточнения); διασκορπιεῖ νέφος φῶς αὐτοῦ — «рассеет облако свет Его». Место тёмное; csl «избранное устрояет облак: разженет облак свет его»."
  12: "Елиуй. κυκλώματα διαστρέψει — «круги (облаков) обратит» (κύκλωμα — «круг, круговорот»; διαστρέφω — «поворачивать»); ἐν θεεβουλαθω — транслитерация евр. слова, в LXX оставленного без перевода (вероятно, «по руководству»); csl читает «якоже хощет» — «как хочет», это чтение и взято в текст, LXX в notes. εἰς ἔργα αὐτῶν — «на дела их» (чья именно — в греч. неясно). πάντα, ὅσα ἂν ἐντείληται αὐτοῖς, ταῦτα συντέτακται παρ᾽ αὐτοῦ ἐπὶ τῆς γῆς — «всё, что ни повелит им, то определено Им на земле»."
  13: "Елиуй. ἐὰν εἰς παιδείαν — «если в наказание» (παιδεία — «воспитание, наказание»); ἐὰν εἰς τὴν γῆν αὐτοῦ — «если на землю Его»; ἐὰν εἰς ἔλεος — «если на милость» (ἔλεος); εὑρήσει αὐτόν — «найдёт его»: подлежащее и дополнение в греч. не названы, вероятно о дожде или облаке, которое Бог направляет к цели; csl «аще в наказание, аще на землю свою, аще на милость обрящет и»."
  14: "Елиуй. ἐνωτίζου ταῦτα, Ιωβ — «внимай сему, Иов» (ἐνωτίζομαι — «склонять ухо»); στῆθι νουθετοῦ δύναμιν κυρίου — «стань и вразумляйся силе Господней» (νουθετέω — «вразумлять, учить»; csl «стани учайся силе Господни»). Обращение к Иову внутри речи Елиуя."
  15: "Елиуй. οἴδαμεν ὅτι ὁ θεὸς ἔθετο ἔργα αὐτοῦ — «мы знаем, что Бог положил дела Свои»; φῶς ποιήσας ἐκ σκότους — «свет сотворив из тьмы» (σκότος). В csl «Господь» вместо ὁ θεός — по паритету в тексте 主, LXX в notes. В ru/МТ иное («как Бог располагает ими»), не внесено."
  16: "Елиуй. ἐπίσταται δὲ διάκρισιν νεφῶν — «и знает различение облаков» (διάκρισις — «различение, разбирание»; csl «различие облаков»); ἐξαίσια δὲ πτώματα πονηρῶν — «и дивные падения злых» (ἐξαίσιος — «необычайный»; πτῶμα — «падение»). Слав. «велия падения злых»; место тёмное, передано буквально, без отождествления с градом."
  17: "Елиуй. σοῦ δὲ ἡ στολὴ θερμή — «твоя одежда тепла» (στολή — «одежда»); ἡσυχάζεται δὲ ἐπὶ τῆς γῆς — «и успокаивается земля» (пассив). Слав. добавляет «от юга» — этого нет в LXX, но по паритету внесено в текст (南から), отмечено здесь. В ru/МТ стих передан как вопрос."
  18: "Елиуй. στερεώσεις μετ᾽ αὐτοῦ εἰς παλαιώματα — «утвердишь с Ним в древности» (στερεόω — «утверждать»; παλαίωμα — «древность, ветхое»); ἰσχυραὶ ὡς ὅρασις ἐπιχύσεως — «крепки, как вид литья» (ἐπίχυσις — «литьё, наливка»; т. е. литое зеркало, как в ru). Тёмное место передано буквально: いにしえのもの."
  19: "Елиуй. διὰ τί; — «почему?»; δίδαξόν με τί ἐροῦμεν αὐτῷ — «научи меня, что скажем Ему»; καὶ παυσώμεθα πολλὰ λέγοντες — «и перестанем много говорить» (παύω — «прекращать»)."
  20: "Елиуй. μὴ βίβλος ἢ γραμματεύς μοι παρέστηκεν — «разве книга или писец предстоит мне?» (βίβλος — «книга»; γραμματεύς — «писец, книжник»); ἵνα ἄνθρωπον ἑστηκὼς κατασιωπήσω — «чтобы я, стоя, заставил человека умолкнуть» (κατασιωπάω — «заставлять молчать»). Смысл тёмный: вероятно, у меня нет ни книги, ни писца, чтобы записать мои слова; в ru/МТ иначе."
  21: "Елиуй. πᾶσιν δ᾽ οὐχ ὁρατὸν τὸ φῶς — «не всем видим свет» (ὁρατός — «видимый»); τηλαυγές ἐστιν ἐν τοῖς παλαιώμασιν — «он светло сияет в древностях» (τηλαυγής — «далеко сияющий»); ὥσπερ τὸ παρ᾽ αὐτοῦ ἐπὶ νεφῶν — «как то, что от Него, на облаках». Тёмное место, передано буквально."
  22: "Елиуй. ἀπὸ βορρᾶ νέφη χρυσαυγοῦντα — «от севера облака, златовидные» (χρυσαυγέω — «сияться золотом»; csl «облацы златозарни»); ἐπὶ τούτοις μεγάλη ἡ δόξα καὶ τιμὴ παντοκράτορος — «на них великая слава и честь Вседержителя» (παντοκράτωρ — 全能者)."
  23: "Елиуй. οὐχ εὑρίσκομεν ἄλλον ὅμοιον τῇ ἰσχύι αὐτοῦ — «не находим иного, подобного крепости Его» (ἰσχύς — «сила, крепость»); ὁ τὰ δίκαια κρίνων — «судящий праведное» (τὰ δίκαια — «правое, праведное»; csl «иже судит праведно»); οὐκ οἴει ἐπακούειν αὐτόν — «не думаешь ли, что Он услышит?» (ἐπακούω — «выслушивать»)."
  24: "Елиуй. διὸ φοβηθήσονται αὐτὸν οἱ ἄνθρωποι — «посему убоятся Его люди»; φοβηθήσονται δὲ αὐτὸν καὶ οἱ σοφοὶ καρδίᾳ — «убоятся Его и мудрые сердцем» (σοφοὶ καρδίᾳ — «мудрые сердцем»). Здесь закрывается цитата речи Елиуя (37:1–24); в 38:1 — формула Господа."
