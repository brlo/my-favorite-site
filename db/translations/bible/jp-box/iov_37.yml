# jp-box, Иов, глава 37. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге только 1–2; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 37: продолжение речи Елиуя, начатой в 36:2 (новая формула — 36:1) и идущей
# из 36:33. Вводной формулы нет, поэтому цитата открыта в первом стихе и закрыта
# в последнем (37:24). Содержание: сердце Елиуя трепещет (1), голос Господа в громе (2–5),
# снег, дождь и печать на руке человека (6–7), звери в укрытии (8), вихри и стужа (9–10),
# облака, свет и суд (11–13), призыв внимать (14), дела Божии в небе (15–18),
# тайна суда и страх людей (19–24).
# Голоса: 37:1–24 — речь Елиуя, одна цитата 「…」. Прямой речи Бога в главе нет:
# в 37:2–5 говорится о голосе Господа, но это не слова Бога.
# Нумерация по gr: 24 стиха, как в csl-ru и ru.
# 〔…〕 нет: все стихи есть в gr-lxx-byz. Сносок ⟨…⟩ нет.
# Имена — транслитерация греческого (LXX): ヨブ, エリフ.

