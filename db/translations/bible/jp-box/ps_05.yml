verses:
  0: "指揮者[しきしゃ]に。受[う]け継[つ]ぎについて。ダビデの詩[うた]。"
  1: "主[しゅ]よ、わたしの言葉[ことば]に耳[みみ]を傾[かたむ]け、わたしの叫[さけ]びを悟[さと]ってください。"
  2: "わたしの王[おう]、わたしの神[かみ]よ、わたしの願[ねが]いの声[こえ]に心[こころ]を向[む]けてください。主[しゅ]よ、わたしはあなたに祈[いの]るからである。"
  3: "朝[あさ]には、あなたはわたしの声[こえ]を聞[き]いてくださる。朝[あさ]には、わたしはあなたの前[まえ]に立[た]ち、あなたを見[み]つめる。"
  4: "あなたは不法[ふほう]を喜[よろこ]ぶ神[かみ]ではないからである。悪[わる]を行[おこな]う者[もの]は、あなたのそばに宿[やど]ることができない。"
  5: "高[たか]ぶる者[もの]は、あなたの目[め]の前[まえ]に立[た]ち続[つづ]けることができない。あなたは不法[ふほう]を行[おこな]うすべての者[もの]を憎[にく]まれる。"
  6: "あなたは偽[いつわ]りを語[かた]るすべての者[もの]を滅[ほろ]ぼされる。血[ち]を流[なが]す者[もの]と謀[はか]りをめぐらす者[もの]を、主[しゅ]は忌[い]み嫌[きら]われる。"
  7: "しかし、わたしはあなたの豊[ゆた]かなあわれみによって、あなたの家[いえ]に入[はい]り、あなたを恐[おそ]れつつ、あなたの聖[せい]なる宮[みや]に向[む]かって伏[ふ]し拝[おが]む。"
  8: "主[しゅ]よ、わたしの敵[てき]のゆえに、あなたの義[ぎ]のうちにわたしを導[みちび]き、わたしの前[まえ]にあなたの道[みち]をまっすぐにしてください。"
  9: "彼[かれ]らの口[くち]には真実[しんじつ]がなく、その心[こころ]はむなしい。彼[かれ]らののどは開[あ]いた墓[はか]、その舌[した]で人[ひと]を欺[あざむ]く。"
  10: "神[かみ]よ、彼[かれ]らを裁[さば]いてください。彼[かれ]らが企[くわだ]てたことから、彼[かれ]らを倒[たお]れさせてください。その不法[ふほう]の多[おお]さに応[おう]じて彼[かれ]らを追[お]い出[だ]してください。彼[かれ]らはあなたを苦[くる]しめたからである、主[しゅ]よ。"
  11: "あなたに寄[よ]り頼[たの]むすべての者[もの]が喜[よろこ]ぶように。彼[かれ]らはとこしえに喜[よろこ]び歌[うた]い、あなたは彼[かれ]らのうちに住[す]まわれる。あなたの名[な]を愛[あい]するすべての者[もの]が、あなたによって誇[ほこ]るように。"
  12: "あなたは正[ただ]しい者[もの]を祝福[しゅくふく]されるからである。主[しゅ]よ、あなたは恵[めぐ]みの武具[ぶぐ]をもって、わたしたちを冠[かんむり]のように囲[かこ]まれた。"

notes:
  0: "Εἰς τὸ τέλος, ὑπὲρ τῆς κληρονομούσης· ψαλμὸς τῷ Δαυιδ — 指揮者に。受け継ぎについて。ダビデの詩 (κληρονομοῦσα — «наследующая»; в церковнослав. «о наследствующей»; Синодальный передаёт по евр. «на духовых орудиях»). Надписание — стих 0; по-японски 受け継ぎ, как 受け継ぎ в Пс 2:8, без добавления толкования."
  1: "Τὰ ῥήματά μου ἐνώτισαι, κύριε — 主よ、わたしの言葉に耳を傾け (ἐνωτίζομαι — «внимать, склонять ухо»; ῥῆμα — «слово, изречение»). σύνες τῆς κραυγῆς μου — わたしの叫びを悟って (συνίημι — «понимать, вникать»; κραυγή — «вопль, крик»)."
  2: "πρόσχες τῇ φωνῇ τῆς δεήσεώς μου — わたしの願いの声に心を向けて (προσέχω — «внимать»; δέησις — «прошение»). ὁ βασιλεύς μου καὶ ὁ θεός μου — わたしの王、わたしの神 (обращение к Богу как к Царю). ὅτι πρὸς σὲ προσεύξομαι, κύριε — 主よ、わたしはあなたに祈るからである."
  3: "τὸ πρωῒ εἰσακούσῃ τῆς φωνῆς μου — 朝には、あなたはわたしの声を聞いてくださる (πρωί — «утром»; повтор τὸ πρωί сохранён дважды, как в греч.). τὸ πρωῒ παραστήσομαί σοι — 朝には、わたしはあなたの前に立つ. ἐπόψομαι — あなたを見つめる (ἐφοράω — «взирать»; jp-joc «立ちて待たん»)."
  4: "οὐχὶ θεὸς θέλων ἀνομίαν σὺ εἶ — あなたは不法を喜ぶ神ではない (θέλων ἀνομίαν — «хотящий беззакония»). οὐδὲ παροικήσει σοι πονηρευόμενος — 悪を行う者は、あなたのそばに宿ることができない (παροικέω — «жить рядом, гостить»; πονηρεύομαι — «делать зло»)."
  5: "οὐ διαμενοῦσιν παράνομοι κατέναντι τῶν ὀφθαλμῶν σου — 高ぶる者は、あなたの目の前に立ち続けることができない (διαμένω — «пребывать»; παράνομος — «беззаконник»). ἐμίσησας πάντας τοὺς ἐργαζομένους τὴν ἀνομίαν — あなたは不法を行うすべての者を憎まれる."
  6: "ἀπολεῖς πάντας τοὺς λαλοῦντας τὸ ψεῦδος — あなたは偽りを語るすべての者を滅ぼされる. ἄνδρα αἱμάτων καὶ δόλιον βδελύσσεται κύριος — 血を流す者と謀りをめぐらす者を、主は忌み嫌われる (ἀνὴρ αἱμάτων — «муж кровей», т. е. кровопийца; δόλιος — «коварный»; βδελύσσομαι — «гнушаться»)."
  7: "ἐγὼ δὲ ἐν τῷ πλήθει τοῦ ἐλέους σου εἰσελεύσομαι εἰς τὸν οἶκόν σου — しかし、わたしはあなたの豊かなあわれみによって、あなたの家に入り (πλῆθος τοῦ ἐλέους — «множество милости»). προσκυνήσω πρὸς ναὸν ἅγιόν σου ἐν φόβῳ σου — あなたを恐れつつ、あなたの聖なる宮に向かって伏し拝む (ναός — «храм, святилище»)."
  8: "ὁδήγησόν με ἐν τῇ δικαιοσύνῃ σου ἕνεκα τῶν ἐχθρῶν μου — わたしの敵のゆえに、あなたの義のうちにわたしを導き (ὁδηγέω — «вести»; ἕνεκα — «ради»). κατεύθυνον ἐνώπιόν μου τὴν ὁδόν σου — わたしの前にあなたの道をまっすぐにしてください (κατευθύνω — «выпрямлять»)."
  9: "οὐκ ἔστιν ἐν τῷ στόματι αὐτῶν ἀλήθεια — 彼らの口には真実がない. ἡ καρδία αὐτῶν ματαία — その心はむなしい. τάφος ἀνεῳγμένος ὁ λάρυγξ αὐτῶν — 彼らののどは開いた墓 (λάρυγξ — «гортань, глотка»; ср. Рим 3:13). ταῖς γλώσσαις αὐτῶν ἐδολιοῦσαν — その舌で人を欺く (δολιόω — «обманывать»)."
  10: "κρῖνον αὐτούς, ὁ θεός — 神よ、彼らを裁いてください. ἀποπεσάτωσαν ἀπὸ τῶν διαβουλίων αὐτῶν — 彼らが企てたことから、彼らを倒れさせてください (διαβούλιον — «замысел, совет»; ἀποπίπτω — «отпадать»). κατὰ τὸ πλῆθος τῶν ἀσεβειῶν αὐτῶν ἔξωσον αὐτούς — その不法の多さに応じて彼らを追い出してください (ἀσέβεια — «нечестие»; ἐξωθέω — «выталкивать»). ὅτι παρεπίκρανάν σε, κύριε — 彼らはあなたを苦しめたからである (παραπικραίνω — «огорчать, раздражать»)."
  11: "εὐφρανθήτωσαν πάντες οἱ ἐλπίζοντες ἐπὶ σέ — あなたに寄り頼むすべての者が喜ぶように (εὐφραίνομαι — «веселиться»; императив 3 л. — пожелание). εἰς αἰῶνα ἀγαλλιάσονται — 彼らはとこしえに喜び歌い (ἀγαλλιάομαι — «ликовать»). κατασκηνώσεις ἐν αὐτοῖς — あなたは彼らのうちに住まわれる (κατασκηνόω — «обитать, водружать скинию»). καυχήσονται ἐν σοὶ πάντες οἱ ἀγαπῶντες τὸ ὄνομά σου — あなたの名を愛するすべての者が、あなたによって誇る (καυχάομαι — «хвалиться»)."
  12: "ὅτι σὺ εὐλογήσεις δίκαιον — あなたは正しい者を祝福されるからである. ὡς ὅπλῳ εὐδοκίας ἐστεφάνωσας ἡμᾶς — あなたは恵みの武具をもって、わたしたちを冠のように囲まれた (ὅπλον — «оружие, доспех»; εὐδοκία — «благоволение»; στεφανόω — «венчать, окружать как венцом»). 盾 не добавлено: в греч. ὅπλον — оружие."
