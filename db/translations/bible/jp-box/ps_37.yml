verses:
  0: "ダビデの詩[うた]。安息日[あんそくび]の記念[きねん]のために。"
  1: "主[しゅ]よ、怒[いか]りをもってわたしを責[せ]めないでください。憤[いきどお]りをもってわたしを懲[こ]らしめないでください。"
  2: "あなたの矢[や]がわたしに突[つ]き刺[さ]さり、あなたの手[て]がわたしの上[うえ]に重[おも]く置[お]かれたからである。"
  3: "あなたの怒[いか]りのゆえに、わたしの肉[にく]には健[すこ]やかなところがない。わたしの罪[つみ]のゆえに、わたしの骨[ほね]には安[やす]らぎがない。"
  4: "わたしの不[ふ]法[ほう]は頭[あたま]の上[うえ]まで積[つ]み上[あ]がり、重[おも]い荷[に]のように、わたしを押[お]しつぶす。"
  5: "わたしの傷[きず]は、わたしの愚[おろ]かさのゆえに、悪臭[あくしゅう]を放[はな]ち、うみただれている。"
  6: "わたしは打[う]ちひしがれ、すっかりうなだれ、一日中[いちにちじゅう]、暗[くら]い顔[かお]をして歩[ある]いている。"
  7: "わたしの腰[こし]は侮[あなど]りに満[み]ち、わたしの肉[にく]には健[すこ]やかなところがない。"
  8: "わたしは激[はげ]しく苦[くる]しみ、ひどく打[う]ちのめされ、心[こころ]の嘆[なげ]きのゆえに、うめき声[ごえ]を上[あ]げている。"
  9: "主[しゅ]よ、わたしの願[ねが]いはすべて、あなたの前[まえ]にあり、わたしの嘆[なげ]きはあなたに隠[かく]れていない。"
  10: "わたしの心[こころ]は騒[さわ]ぎ乱[みだ]れ、力[ちから]は尽[つ]き、目[め]の光[ひかり]さえ、わたしとともにない。"
  11: "わたしの友[とも]も近[ちか]しい者[もの]も、わたしに向[む]き合[あ]って立[た]ち、わたしの身近[みぢか]な者[もの]たちは遠[とお]く離[はな]れて立[た]っている。"
  12: "わたしの命[いのち]をねらう者[もの]たちは力[ちから]ずくで迫[せま]り、わたしに災[わざわ]いを求[もと]める者[もの]たちはむなしいことを語[かた]り、一日中[いちにちじゅう]、欺[あざむ]きを企[くわだ]てている。"
  13: "しかし、わたしは耳[みみ]の聞[き]こえない者[もの]のように聞[き]かず、口[くち]のきけない者[もの]のように、口[くち]を開[ひら]かなかった。"
  14: "わたしは、聞[き]こえず、口[くち]に反[はん]論[ろん]の言葉[ことば]も持[も]たない人[ひと]のようになった。"
  15: "主[しゅ]よ、わたしはあなたに寄[よ]り頼[たの]んだ。わたしの神[かみ]である主[しゅ]よ、あなたが聞[き]いてくださる。"
  16: "わたしは言[い]った。「わたしの敵[てき]がわたしの上[うえ]に喜[よろこ]びを上[あ]げないように。わたしの足[あし]がよろめくとき、彼[かれ]らはわたしに向[む]かって大[おお]きなことを言[い]う」と。"
  17: "わたしは打[う]たれることに備[そな]えができており、わたしの痛[いた]みはいつもわたしの前[まえ]にある。"
  18: "わたしは自分[じぶん]の不[ふ]法[ほう]を告[つ]げ、自分[じぶん]の罪[つみ]のために思[おも]い悩[なや]む。"
  19: "しかし、わたしの敵[てき]は生[い]きながらえて力[ちから]を増[ま]し、わたしを理由[りゆう]なく憎[にく]む者[もの]が多[おお]くなった。"
  20: "善[ぜん]に悪[あく]を返[かえ]す者[もの]たちが、わたしが善[ぜん]を追[お]い求[もと]めるゆえに、わたしを中傷[ちゅうしょう]した。彼[かれ]らは、愛[あい]されていたわたしを、忌[い]むべき死[し]骸[がい]のように投[な]げ捨[す]てた。"
  21: "主[しゅ]よ、わたしを捨[す]てないでください。わたしの神[かみ]よ、わたしから遠[とお]ざからないでください。"
  22: "わたしの救[すく]いである主[しゅ]よ、わたしを助[たす]けるために、目[め]を向[む]けてください。"

notes:
  0: "Ψαλμὸς τῷ Δαυιδ· εἰς ἀνάμνησιν περὶ σαββάτου — ダビデの詩、安息日の記念のために. εἰς ἀνάμνησιν «в воспоминание» (Синодальный «В воспоминание о субботе»; jp-joc 記念のために此を作れり). Надписание — стих 0, скобками не маркируется."
  1: "Κύριε, μὴ τῷ θυμῷ σου ἐλέγξῃς με — Господи, да не яростию Твоею обличиши мене (θυμός «ярость»; ἐλέγχω «обличать»). μηδὲ τῇ ὀργῇ σου παιδεύσῃς με — ниже гневом Твоим накажеши мене (ὀργή «гнев»; παιδεύω «наказывать, вразумлять»). Два разных греч. слова сохранены как 怒り и 憤り."
  2: "τὰ βέλη σου ἐνεπάγησάν μοι — стрелы Твои унзоша во мне (ἐμπήγνυμι «вонзать»). ἐπεστήρισας ἐπ᾽ ἐμὲ τὴν χεῖρά σου — утвердил еси на мне руку Твою (ἐπιστηρίζω «утверждать, налагать»)."
  3: "οὐκ ἔστιν ἴασις ἐν τῇ σαρκί μου — несть исцеления в плоти моей (ἴασις «исцеление»). ἀπὸ προσώπου τῆς ὀργῆς σου — от лица гнева Твоего, т. е. из-за гнева. οὐκ ἔστιν εἰρήνη τοῖς ὀστέοις μου — несть мира в костех моих; εἰρήνη здесь «покой, целость» — 安らぎ."
  4: "αἱ ἀνομίαι μου ὑπερῆραν τὴν κεφαλήν μου — беззакония мои превзыдоша главу мою (ὑπεραίρω «поднимать выше»). ὡσεὶ φορτίον βαρὺ ἐβαρύνθησαν ἐπ᾽ ἐμέ — как бремя тяжкое отяготеша на мне."
  5: "προσώζεσαν καὶ ἐσάπησαν οἱ μώλωπές μου — возсмердеша и согниша раны моя (ὄζω «пахнуть»; σήπω «гнить»; μώλωψ «рубец, рана»). ἀπὸ προσώπου τῆς ἀφροσύνης μου — от лица безумия моего (ἀφροσύνη «безумие, глупость»); 愚かさ."
  6: "ἐταλαιπώρησα καὶ κατεκάμφθην ἕως τέλους — пострадах и слякохся до конца (ταλαιπωρέω «бедствовать»; κατακάμπτω «сгибать»). ὅλην τὴν ἡμέραν σκυθρωπάζων ἐπορευόμην — весь день сетуя хождах (σκυθρωπάζω «быть мрачным»)."
  7: "αἱ ψύαι μου ἐπλήσθησαν ἐμπαιγμῶν — лядвия моя наполнишася поруганий (ψύα «чресла, поясница»; ἐμπαιγμός «поругание»); образ оставлен, не сглажен. οὐκ ἔστιν ἴασις ἐν τῇ σαρκί μου — ср. ст. 3."
  8: "ἐκακώθην καὶ ἐταπεινώθην ἕως σφόδρα — озлоблен бых и смирихся до зела. ὠρυόμην ἀπὸ στεναγμοῦ τῆς καρδίας μου — рыках от воздыхания сердца моего (ὀρύομαι «реветь, рычать»); うめき声 — сдержаннее, чем «реветь»."
  9: "ἐναντίον σου πᾶσα ἡ ἐπιθυμία μου — пред Тобою все желание мое (ἐπιθυμία «желание»). ὁ στεναγμός μου ἀπὸ σοῦ οὐκ ἐκρύβη — воздыхание мое от Тебе не утаися (κρύπτω «скрывать»)."
  10: "ἡ καρδία μου ἐταράχθη — сердце мое смятеся (ταράσσω «смущать»). ἐγκατέλιπέν με ἡ ἰσχύς μου — остави мя сила моя. τὸ φῶς τῶν ὀφθαλμῶν μου καὶ αὐτὸ οὐκ ἔστιν μετ᾽ ἐμοῦ — и свет очию моею, и той несть со мною; καί αὐτό усилено — さえ."
  11: "οἱ φίλοι μου καὶ οἱ πλησίον μου ἐξ ἐναντίας μου ἤγγισαν καὶ ἔστησαν — друзи мои и искреннии мои прямо мне приближишася и сташа (ἐξ ἐναντίας «напротив»). οἱ ἔγγιστά μου ἀπὸ μακρόθεν ἔστησαν — ближнии мои отдалече мене сташа; 身近な者 — οἱ ἔγγιστα."
  12: "ἐξεβιάσαντο οἱ ζητοῦντες τὴν ψυχήν μου — нуждахуся ищущии душу мою (ἐκβιάζομαι «принуждать, насильно добиваться»). ἐλάλησαν ματαιότητας — глаголаху суетная. δολιότητας ὅλην τὴν ἡμέραν ἐμελέτησαν — льстивыя весь день поучахуся (δολιότης «коварство»)."
  13: "ὡσεὶ κωφὸς οὐκ ἤκουον — как глухой не слышал (κωφός «глухой»). ὡσεὶ ἄλαλος οὐκ ἀνοίγων τὸ στόμα αὐτοῦ — как немой, не отверзаяй уст своих (ἄλαλος «немой»); αὐτοῦ при 1-м лице — гебраизм, по-японски 口[くち] без местоимения."
  14: "ὡσεὶ ἄνθρωπος οὐκ ἀκούων — как человек не слышащий. οὐκ ἔχων ἐν τῷ στόματι αὐτοῦ ἐλεγμούς — не имый в устех своих обличения (ἐλεγμός «обличение, укор»); 反論 — то, чем можно ответить."
  15: "ὅτι ἐπὶ σοί, κύριε, ἤλπισα — ибо на Тя, Господи, уповах. σὺ εἰσακούσῃ, κύριε ὁ θεός μου — Ты услышиши, Господи Боже мой (εἰσακούω «услышать»)."
  16: "εἶπα Μήποτε ἐπιχαρῶσίν μοι οἱ ἐχθροί μου — рех: да не когда порадуются мне врази мои (ἐπιχαίρω «радоваться чужой беде»). ἐν τῷ σαλευθῆναι πόδας μου — внегда сляцатися ногама моима (σαλεύω «колебать»). ἐπ᾽ ἐμὲ ἐμεγαλορρημόνησαν — на мя велеречеваша (μεγαλορρημονέω «говорить надменно»). Прямая речь — 「」."
  17: "εἰς μάστιγας ἕτοιμος — на раны готов (μάστιξ «бич, удар»). ἡ ἀλγηδών μου ἐνώπιόν μου διὰ παντός — болезнь моя предо мною есть выну (ἀλγηδών «боль»)."
  18: "τὴν ἀνομίαν μου ἐγὼ ἀναγγελῶ — беззаконие мое аз возвещу (ἀναγγέλλω «возвещать»). μεριμνήσω ὑπὲρ τῆς ἁμαρτίας μου — попекуся о гресе моем (μεριμνάω «заботиться, тревожиться»)."
  19: "οἱ ἐχθροί μου ζῶσιν καὶ κεκραταίωνται ὑπὲρ ἐμέ — врази мои живут и укрепишася паче мене (κραταιόομαι «крепнуть»). ἐπληθύνθησαν οἱ μισοῦντές με ἀδίκως — умножишася ненавидящии мя без правды; 理由なく — ἀδίκως."
  20: "οἱ ἀνταποδιδόντες κακά ἀντὶ ἀγαθῶν — воздающии ми злая воз благая. ἐνδιέβαλλόν με — оклеветаху мя (ἐνδιαβάλλω «клеветать»). ἐπεὶ κατεδίωκον δικαιοσύνην — зане гонях благостыню. καὶ ἀπέρριψάν με τὸν ἀγαπητὸν ὡσεὶ νεκρὸν ἐβδελυγμένον — и отвергли меня, возлюбленного, как мертвеца гнусного (ἀπορρίπτω «отбрасывать»; βδελύσσομαι «гнушаться»). В базе это чтение стоит в квадратных скобках критического издания, но слова есть, поэтому 〔…〕 не ставится; в церковном тексте (Синодальный, jp-joc) его нет — отмечено."
  21: "μὴ ἐγκαταλίπῃς με, κύριε — не остави мене, Господи. ὁ θεός μου, μὴ ἀποστῇς ἀπ᾽ ἐμοῦ — Боже мой, не отступи от мене."
  22: "πρόσχες εἰς τὴν βοήθειάν μου — вонми в помощь мою (προσέχω «обращать внимание, внимать»). κύριε τῆς σωτηρίας μου — Господи спасения моего."
