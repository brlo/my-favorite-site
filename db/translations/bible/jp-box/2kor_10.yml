# jp-box, Второе послание к Коринфянам, глава 10. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 10: кротость и власть Павла (1–11), оружие воинствования и пленение
# всякого помышления (4–6), мера, канон и похвала (12–18).
# Красного и синего нет: прямой речи Христа и Богородицы в главе нет, <j>/<mo> не ставятся.
# 〔…〕 в главе нет: проверено по базе — все 18 стихов в gr-lxx-byz на месте (`.` нет);
# 10:8 [τε] в базе есть, поэтому слово не оборачивается (ср. 12:5 [μου], 12:6 [τι]).
# Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

tr_code: jp-box
book: 2kor
chapter: 10
draft: true

verses:
  1: "さて、このわたしパウロが、キリストの柔和[じゅうわ]と寛容[かんよう]とによって、あなたがたに勧[すす]める。このわたしは、あなたがたと顔[かお]を合[あ]わせているときは謙[けん]遜[そん]で、離[はな]れているときはあなたがたに対して大胆[だいたん]である。"
  2: "どうか、わたしがあなたがたのところへ行[い]くとき、大胆[だいたん]になる必要[ひつよう]のないように。わたしは、わたしたちを肉[にく]に従[したが]って歩[あゆ]む者[もの]と見[み]なす人々[ひとびと]に対して、大胆に振[ふ]る舞[ま]おうと考[かんが]えているのである。"
  3: "なぜなら、わたしたちは肉[にく]にあって歩[あゆ]んでいるが、肉[にく]に従[したが]って戦[たたか]っているのではないからである。"
  4: "なぜなら、わたしたちの戦[いくさ]の武[ぶ]器[き]は肉[にく]に属[ぞく]するものではなく、神[かみ]によって砦[とりで]を打[う]ち破[やぶ]る力[ちから]があるものである。"
  5: "すなわち、もろもろの計[はかりごと]を打[う]ち破[やぶ]り、神[かみ]の知識[ちしき]に逆[さか]らって立[た]つすべての高[たか]ぶりを打ち破り、すべての思[おも]いを捕[とりこ]にして、キリストに従[したが]わせるのである。"
  6: "そして、あなたがたの従順[じゅうじゅん]が全[まっと]うされるなら、すべての不従順[ふじゅうじゅん]を罰[ばつ]する用意[ようい]ができているのである。"
  7: "あなたがたは、外見[がいけん]によって判断[はんだん]している。もしだれかが、自分[じぶん]はキリストに属[ぞく]する者[もの]だと確信[かくしん]しているなら、その人[ひと]はもう一度[いちど]、自分[じぶん]についてこう考[かんが]えるがよい。自分がキリストに属するように、わたしたちもまたキリストに属するのだ、と。"
  8: "なぜなら、たとえわたしが、主[しゅ]があなたがたを建[た]てるために、滅[ほろ]ぼすためにではなく与[あた]えてくださったわたしたちの権[けん]威[い]について、少[すこ]し誇[ほこ]り過[す]ぎたとしても、恥[は]ずかしい思[おも]いをすることはないからである。"
  9: "それは、わたしが手紙[てがみ]によってあなたがたを脅[おど]かしていると、思[おも]われないためである。"
  10: "というのは、「手紙[てがみ]は重[おも]くて強[つよ]いが、実際[じっさい]に会[あ]うと、その姿[すがた]は弱[よわ]く、話[はなし]は軽[かろ]んじられている」と言[い]う者[もの]がいるからである。"
  11: "そのような者[もの]は、わたしたちが離[はな]れているとき、手紙[てがみ]の言葉[ことば]においてどのような者[もの]であり、会[あ]っているとき、行[おこな]いにおいても同[おな]じ者[もの]であることを、考[かんが]えるがよい。"
  12: "なぜなら、わたしたちは、自分[じぶん]を推薦[すいせん]する者[もの]たちの仲間[なかま]に自分[じぶん]たちを加[くわ]えたり、比[くら]べたりする大胆[だいたん]さはないからである。しかし、彼[かれ]らは自分[じぶん]を自分[じぶん]で測[はか]り、自分を自分と比[くら]べているだけで、分別[ふんべつ]がないのである。"
  13: "しかし、わたしたちは量[りょう]を越[こ]えて誇[ほこ]るのではなく、神[かみ]がわたしたちに割[わ]り当[あ]ててくださった、あなたがたにまで届[とど]く量[りょう]に従[したが]って誇[ほこ]るのである。"
  14: "なぜなら、わたしたちはあなたがたに届[とど]いていない者[もの]のように、自分[じぶん]を広[ひろ]げ過[す]ぎているのではないからである。わたしたちはキリストの福音[ふくいん]によって、あなたがたのところまで届[とど]いたのだからである。"
  15: "わたしたちは、他人[たにん]の労苦[ろうく]によって量[りょう]を越[こ]えて誇[ほこ]るのではなく、あなたがたの信仰[しんこう]が育[そだ]つにつれて、わたしたちの区域[くいき]があなたがたの間[あいだ]で大[おお]いに広[ひろ]がることを望[のぞ]んでいるのである。"
  16: "それは、あなたがたより向[む]こうの地方[ちほう]にも福音[ふくいん]を宣[の]べ伝[つた]えるためであり、他人[たにん]の区域[くいき]で、すでに備[そな]わったものを誇[ほこ]らないためである。"
  17: "「誇[ほこ]る者[もの]は主[しゅ]によって誇[ほこ]れ。」"
  18: "なぜなら、自[みずか]ら自分[じぶん]を推薦[すいせん]する者[もの]ではなく、主[しゅ]が推薦[すいせん]する者[もの]こそ、認[みと]められた者[もの]なのである。"

notes:
  1: "πραΰτης καὶ ἐπιείκεια — 柔和と寛容. ὃς κατὰ πρόσωπον μὲν ταπεινός… ἀπὼν δὲ θαρρῶ — «смиренный в лицо, а в отсутствие смелый»; ирония противников; 顔を合わせてはいれば謙遜で、離れていれば大胆."
  2: "δέομαι — 願う. πεποίθησις — 確信. τολμῆσαι ἐπί τινας — «дерзнуть против некоторых»; 大胆に振る舞う. ὡς κατὰ σάρκα περιπατοῦντας — 肉に従って歩む者と見なす."
  3: "στρατευόμεθα — «воинствуем»; 戦っている. ἐν σαρκὶ… οὐ κατὰ σάρκα — антитеза сохранена."
  4: "ὅπλα τῆς στρατείας — 戦いの武器. ὀχυρώματα — «твердыни, крепости»; 砦. δυνατὰ τῷ θεῷ — «сильные Богом»; 神によって…力がある."
  5: "ὕψωμα — «возвышение, гордыня»; 高ぶり. νόημα — 思い; αἰχμαλωτίζοντες — «пленяя»; 捕りこにする. λογισμοί — 計らい (в базе стоят в конце 10:4; по смыслу отнесены к 10:5, как у jp-joc)."
  6: "παρακοή — «непослушание»; 不従順. ἐν ἑτοίμῳ ἔχοντες — 用意ができている."
  7: "τὰ κατὰ πρόσωπον — «внешнее, по лицу»; 外見. πέποιθεν ἑαυτῷ — «уверен в себе»; 確信している."
  8: "ἐξουσία — 権威. εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν — 建てるため、滅ぼすためではなく. В базе [τε] — слово в квадратных скобках, но есть; 〔〕 не ставится."
  9: "ἐκφοβεῖν — «устрашать»; 脅かす. ἵνα μὴ δόξω — «чтобы не показаться»; 思われないため."
  10: "φησίν — «говорит» (кто-то из противников); という者がいる. βαρεῖαι καὶ ἰσχυραί — 重くて強い. ἐξουθενημένος — 軽んじられている. Слова противников — в 「」, не красные."
  11: "τῷ λόγῳ δι' ἐπιστολῶν … τῷ ἔργῳ — «словом в письмах… делом»; антитеза 言葉/行い."
  12: "ἐγκρῖναι ἢ συγκρῖναι — «причислить или сравнить»; 加えたり比べたり. οὐ συνιᾶσιν — «не разумеют»; 分別がない."
  13: "τὰ ἄμετρα — «безмерное, сверх меры»; 量を越えて. κανών — «правило, удел»; 区域. ἐμέρισεν — 割り当てる."
  14: "ὑπερεκτείνομεν — «простираемся сверх»; 広げ過ぎる. ἐφθάσαμεν — 届いた."
  15: "ἐν ἀλλοτρίοις κόποις — 他人の労苦. μεγαλυνθῆναι — «быть увеличенным»; 広がる. κανών — 区域."
  16: "τὰ ὑπερέκεινα — «лежащее далее»; 向こうの地方. ἐν ἀλλοτρίῳ κανόνι — 他人の区域."
  17: "Иер 9:23–24. Цитата Писания — в 「」; в греч. нет формулы «написано», поэтому формула не добавлена."
  18: "ὁ ἑαυτὸν συνιστάνων — 自分を推薦する者. δόκιμος — «испытанный, одобренный»; 認められた者. συνίστησιν — 推薦する."
