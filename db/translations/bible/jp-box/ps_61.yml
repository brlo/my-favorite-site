# jp-box, Псалтирь, псалом 61. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный 常体, без 文語.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0.
# Псалом 61: только у Бога покой души (1–2), заговор против него (3–4),
# повтор (5–6), надежда и излияние сердца (7–8), суета сынов человеческих (9),
# не надеяться на богатство (10), слово Божие о силе и милости (11–12).
# Красного и синего нет. Кавычки: слова Бога в 12 — 「…」 (содержание того,
# что «сказал Бог» в 11; первый уровень, речь псалмопевца не в кавычках).
# 〔…〕 нет: все слова в gr-lxx-byz есть (сверено с выгрузкой).
# セラ (διάψαλμα, в 4 и 8) не передаётся — по решению пользователя, как у jp-joc.
# Сносок ⟨…⟩ нет: 秤, 壁, 垣 уже встречались в корпусе или понятны.
# jp-ni не использовался.

