verses:
  0: "指揮者[しきしゃ]に。イドトゥンのために。ダビデの詩[うた]。"
  1: "わたしの魂[たましい]は、神[かみ]にこそ身[み]をゆだねるのではないか。わたしの救[すく]いは神[かみ]から来[く]るからである。"
  2: "まことに、神[かみ]こそわたしの神[かみ]、わたしの救[すく]い主[ぬし]、わたしを守[まも]る方[かた]である。わたしはもはや揺[ゆ]るがない。"
  3: "いつまで、あなたがたはひとりの人[ひと]に襲[おそ]いかかるのか。あなたがたは皆、傾[かたむ]いた壁[かべ]のように、押[お]し崩[くず]された垣[かき]のように、その人[ひと]を殺[ころ]そうとする。"
  4: "彼[かれ]らはただ、わたしの誉[ほま]れを退[しりぞ]けようと企[くわだ]て、偽[いつわ]りに走[はし]った。その口[くち]では祝[しゅく]福[ふく]しながら、心[こころ]ではのろっていた。"
  5: "わたしの魂[たましい]よ、ただ神[かみ]に身[み]をゆだねよ。わたしの忍耐[にんたい]は神[かみ]から来[く]るからである。"
  6: "まことに、神[かみ]こそわたしの神[かみ]、わたしの救[すく]い主[ぬし]、わたしを守[まも]る方[かた]である。わたしはもはや移[うつ]り行[ゆ]かない。"
  7: "わたしの救[すく]いとわたしの栄光[えいこう]は神[かみ]にある。わたしを助[たす]ける神[かみ]、わたしの望[のぞ]みは神[かみ]にある。"
  8: "すべての民[たみ]の集[つど]いよ、神[かみ]に望[のぞ]みを置[お]け。神[かみ]の前[まえ]に、あなたがたの心[こころ]を注[そそ]ぎ出[だ]せ。神[かみ]はわたしたちの助[たす]けである。"
  9: "まことに、人[ひと]の子[こ]らは空[むな]しく、人[ひと]の子[こ]らは偽[いつわ]りである。彼[かれ]らは不[ふ]正[せい]の秤[はかり]にかけられ、ともに空[むな]しさよりも軽[かる]い。"
  10: "不[ふ]正[せい]に望[のぞ]みを置[お]いてはならない。奪[うば]い取[と]ることを求[もと]めてはならない。富[とみ]が流[なが]れ込[こ]んでも、心[こころ]をそれに添[そ]わせてはならない。"
  11: "神[かみ]は一度[いちど]語[かた]られた。わたしは二度[にど]、これを聞[き]いた。"
  12: "「力[ちから]は神[かみ]のものであり、主[しゅ]よ、恵[めぐ]みもあなたのものである。あなたは各人[かくじん]に、その行[おこな]いに応[おう]じて報[むく]いられる」。"

notes:
  0: "Εἰς τὸ τέλος, ὑπὲρ Ιδιθουν· ψαλμὸς τῷ Δαυιδ — 指揮者に。イドトゥンのために。ダビデの詩. Ιδιθουν — イドトゥン (у jp-joc イディフム), левит-певец, ср. 1 Пар 16:41."
  1: "Οὐχὶ τῷ θεῷ ὑποταγήσεται ἡ ψυχή μου — わたしの魂は、神にこそ身をゆだねるのではないか (ὑποτάσσω — «покорять»; вопрос с ожиданием «да»). παρ᾽ αὐτοῦ γὰρ τὸ σωτήριόν μου — わたしの救いは神から来る (σωτήριον — «спасение»)."
  2: "καὶ γὰρ αὐτὸς θεός μου καὶ σωτήρ μου — まことに、神こそわたしの神、わたしの救い主 (σωτήρ — 救い主). ἀντιλήμπτωρ μου — わたしを守る方 (ἀντιλήμπτωρ — «заступник»). οὐ μὴ σαλευθῶ ἐπὶ πλεῖον — もはや揺るがない (σαλεύω — «колебать»; ἐπὶ πλεῖον — «впредь»)."
  3: "ἕως πότε ἐπιτίθεσθε ἐπ᾽ ἄνθρωπον — いつまで、ひとりの人に襲いかかるのか (ἐπιτίθημι — «нападать»). φονεύετε πάντες — あなたがたは皆、殺そうとする (φονεύω). ὡς τοίχῳ κεκλιμένῳ καὶ φραγμῷ ὠσμένῳ — 傾いた壁のように、押し崩された垣のように (τοῖχος — «стена»; φραγμός — «ограда»; ὠσμένος — «толкаемый»)."
  4: "τὴν τιμήν μου ἐβουλεύσαντο ἀπώσασθαι — わたしの誉れを退けようと企て (τιμή — «честь»; βουλεύομαι — «замышлять»). ἔδραμον ἐν ψεύδει — 偽りに走った. τῷ στόματι αὐτῶν εὐλογοῦσαν — 口では祝福しながら. τῇ καρδίᾳ αὐτῶν κατηρῶντο — 心ではのろっていた (καταράομαι — «проклинать»)."
  5: "πλὴν τῷ θεῷ ὑποτάγηθι, ἡ ψυχή μου — わたしの魂よ、ただ神に身をゆだねよ (повтор мысли ст. 1 в обращении к себе). παρ᾽ αὐτοῦ ἡ ὑπομονή μου — わたしの忍耐は神から来る (ὑπομονή — «терпение, упование»; слав. «от Того бо терпение мое»)."
  6: "αὐτὸς θεός μου καὶ σωτήρ μου, ἀντιλήμπτωρ μου — 神こそわたしの神、救い主、守る方 (повтор ст. 2 с переменой в конце). οὐ μὴ μεταναστεύσω — もはや移り行かない (μεταναστεύω — «переселяться»; слав. «не преселюся»)."
  7: "ἐπὶ τῷ θεῷ τὸ σωτήριόν μου καὶ ἡ δόξα μου — わたしの救いと栄光は神にある. ὁ θεὸς τῆς βοηθείας μου — わたしを助ける神 (βοήθεια — «помощь»). ἡ ἐλπίς μου ἐπὶ τῷ θεῷ — わたしの望みは神にある."
  8: "ἐλπίσατε ἐπ᾽ αὐτόν, πᾶσα συναγωγὴ λαοῦ — すべての民の集いよ、神に望みを置け (συναγωγή — «собрание»). ἐκχέετε ἐνώπιον αὐτοῦ τὰς καρδίας ὑμῶν — 神の前に心を注ぎ出せ (ἐκχέω — «изливать»). ὁ θεὸς βοηθὸς ἡμῶν — 神はわたしたちの助け."
  9: "μάταιοι οἱ υἱοὶ τῶν ἀνθρώπων, ψευδεῖς οἱ υἱοὶ τῶν ἀνθρώπων — 人の子らは空しく、人の子らは偽り (повтор с усилением сохранён). ἐν ζυγοῖς τοῦ ἀδικῆσαι — 不正の秤にかけられ (ζυγός — «весы»). ἐκ ματαιότητος ἐπὶ τὸ αὐτό — ともに空しさよりも軽い (слав. «от суеты вкупе»; место тёмное)."
  10: "μὴ ἐλπίζετε ἐπὶ ἀδικίαν — 不正に望みを置いてはならない (ἀδικία — «неправда»). ἐπὶ ἅρπαγμα μὴ ἐπιποθεῖτε — 奪い取ることを求めてはならない (ἅρπαγμα — «грабёж»). πλοῦτος ἐὰν ῥέῃ, μὴ προστίθεσθε καρδίαν — 富が流れ込んでも、心をそれに添わせてはならない (προστίθημι καρδίαν — «прилагать сердце»)."
  11: "ἅπαξ ἐλάλησεν ὁ θεός, δύο ταῦτα ἤκουσα — 神は一度語られた、わたしは二度これを聞いた (числа сохранены; слав. «единою глагола Бог, двоя сия слышах»)."
  12: "τὸ κράτος τοῦ θεοῦ — 力は神のもの (κράτος — «держава»). σοί, κύριε, τὸ ἔλεος — 主よ、恵みもあなたのもの (ἔλεος — 恵み). σὺ ἀποδώσεις ἑκάστῳ κατὰ τὰ ἔργα αὐτοῦ — 各人にその行いに応じて報いられる (ἀποδίδωμι — «воздавать»). Это содержание сказанного Богом — 「」."
