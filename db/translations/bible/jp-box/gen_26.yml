verses:
  1: "アブラハムの時代[じだい]にあった飢[う]えとは別[べつ]に、この地[ち]に飢[う]えが起[お]こった。イサクはフィリスティ人[じん]の王[おう]アビメレクのもとへ、ゲラルへ行[い]った。"
  2: "主[しゅ]は彼に現[あらわ]れて言[い]われた。「エジプトへ下[くだ]ってはならない。わたしがあなたに告[つ]げる地[ち]に住[す]みなさい。"
  3: "この地[ち]に寄[き]留[りゅう]していなさい。わたしはあなたとともにいて、あなたを祝福[しゅくふく]しよう。あなたとあなたの子孫[ししそん]に、この地[ち]をすべて与[あた]え、あなたの父[ちち]アブラハムに誓[ちか]ったわたしの誓いを果[は]たすからである。"
  4: "わたしはあなたの子孫[ししそん]を天[てん]の星[ほし]のように増[ふ]やし、あなたの子孫にこの地[ち]をすべて与えよう。地[ち]のすべての民[たみ]は、あなたの子孫によって祝福[しゅくふく]を受[う]ける。"
  5: "それは、あなたの父[ちち]アブラハムがわたしの声[こえ]に聞[き]き従[したが]い、わたしの定[さだ]めと戒[いまし]めと掟[おきて]と法[のり]とを守[まも]ったからである。」"
  6: "イサクはゲラルに住[す]んだ。"
  7: "その土地[とち]の人々[ひとびと]が彼の妻[つま]リベカのことを尋[たず]ねると、彼は言った。「わたしの妹[いもうと]です。」妻と言[い]うのを恐[おそ]れたのである。その土地の人々がリベカのゆえに自分[じぶん]を殺[ころ]すかもしれないと思[おも]ったからだ。彼女[かのじょ]は見[み]た目[め]が美[うつく]しかった。"
  8: "彼がそこに長[なが]く滞在[たいざい]していたとき、ゲラルの王[おう]アビメレクが窓[まど]から身[み]を乗[の]り出[だ]して見[み]ると、イサクが妻[つま]リベカと戯[たわむ]れていた。"
  9: "アビメレクはイサクを呼[よ]んで言った。「やはり彼女[かのじょ]はあなたの妻[つま]ではないか。なぜ『わたしの妹[いもうと]です』と言[い]ったのか。」イサクは言った。「彼女のゆえに死[し]ぬことがないようにと思[おも]ったからです。」"
  10: "アビメレクは言った。「あなたはわたしたちに何[なん]ということをしたのか。あなたの妻[つま]と、わたしの民[たみ]の者[もの]が、もう少[すこ]しで床[とこ]をともにする所[ところ]だった。あなたはわたしたちに罪[つみ]を負[お]わせるところだった。」"
  11: "アビメレクは民[たみ]すべてに命[めい]じて言った。「この人[ひと]とその妻[つま]に手[て]を触[ふ]れる者[もの]は、誰[だれ]でも死刑[しけい]に処[しょ]せられる。」"
  12: "イサクはその地[ち]に種[たね]を蒔[ま]いた。その年[とし]は百倍[ひゃくばい]の大麦[おおむぎ]を収[しゅう]穫[かく]した。主[しゅ]が彼を祝福[しゅくふく]されたからである。"
  13: "その人[ひと]は高[たか]くされ、ますます大[おお]きくなって、ついには非常[ひじょう]に大[おお]きくなった。"
  14: "彼は羊[ひつじ]の群[む]れと牛[うし]の群れ、多[おお]くの農地[のうち]を持つようになった。そこでフィリスティ人[じん]は彼を妬[ねた]んだ。"
  15: "フィリスティ人[じん]は、彼の父[ちち]のしもべたちが父の時代[じだい]に掘[ほ]ったすべての井戸[いど]をふさぎ、土[つち]で埋[う]めた。"
  16: "アビメレクはイサクに言った。「わたしたちのもとから去[さ]ってくれ。あなたはわたしたちよりはるかに強[つよ]くなった。」"
  17: "イサクはそこを去[さ]り、ゲラルの谷[たに]に宿[やど]り、そこに住[す]んだ。"
  18: "イサクは再[ふたた]び、父[ちち]アブラハムのしもべたちが掘[ほ]った水[みず]の井戸[いど]を掘[ほ]り直[なお]した。それらはアブラハムの死[し]んだ後[のち]、フィリスティ人[じん]がふさいだものである。彼は父アブラハムがつけた名[な]と同[おな]じ名を、それらにつけた。"
  19: "イサクのしもべたちはゲラルの谷[たに]を掘[ほ]り、そこに生[い]ける水[みず]の井戸[いど]を見[み]つけた。"
  20: "ゲラルの羊飼[ひつじか]いたちはイサクの羊飼いたちと争[あらそ]い、「この水はわたしたちのものだ」と言った。そこでイサクはその井戸[いど]を「不正[ふせい]」と名[な]づけた。彼らが彼を害[そこな]ったからである。"
  21: "イサクはそこを去[さ]って別[べつ]の井戸[いど]を掘[ほ]った。その井戸についても争[あらそ]いが起[お]こったので、彼はそれを「敵意[てきい]」と名[な]づけた。"
  22: "彼はそこを去ってまた別の井戸[いど]を掘[ほ]った。その井戸については争[あらそ]いが起[お]こらなかった。そこで彼はそれを「広[ひろ]い所[ところ]」と名づけて言った。「今[いま]、主[しゅ]はわたしたちの所[ところ]を広[ひろ]げ、この地[ち]でわたしたちを増[ふ]やしてくださったからである。」"
  23: "彼はそこから、誓[ちか]いの井戸[いど]へ上[のぼ]って行[い]った。"
  24: "その夜[よる]、主[しゅ]は彼に現[あらわ]れて言[い]われた。「わたしはあなたの父[ちち]アブラハムの神[かみ]である。恐[おそ]れるな。わたしはあなたとともにいる。あなたの父アブラハムのゆえに、あなたを祝福[しゅくふく]し、あなたの子孫[ししそん]を増[ふ]やそう。」"
  25: "彼はそこに祭壇[さいだん]を築[きず]き、主[しゅ]の名[な]を呼[よ]び求[もと]め、そこに天幕[てんまく]を張[は]った。イサクのしもべたちはそこに井戸[いど]を掘[ほ]った。"
  26: "アビメレクはゲラルから彼のもとへ来[き]た。彼の婚[よ]びとりの介添[なかだち]オホザトと、その軍勢[ぐんぜい]の司令官[しれいかん]フィコルもともに来た。"
  27: "イサクは彼らに言った。「なぜわたしのところへ来[き]たのか。あなたがたはわたしを憎[にく]み、わたしをあなたがたのもとから追[お]い出[だ]したではないか。」"
  28: "彼らは言った。「わたしたちは、主[しゅ]があなたとともにいることをはっきりと見[み]ました。そこで、わたしたちとあなたとの間[あいだ]に誓[ちか]いを立[た]て、あなたと契約[けいやく]を結[むす]ぼうと思[おも]います。"
  29: "わたしたちに悪[わる]いことをしないでください。わたしたちはあなたを忌[い]み嫌[きら]わず、あなたによくして、あなたを平安[へいあん]のうちに送[おく]り出[だ]しました。今[いま]、あなたは主[しゅ]に祝福[しゅくふく]された方[かた]です。」"
  30: "イサクは彼らのために宴[うたげ]を設[もう]け、彼らは食[た]べ、飲[の]んだ。"
  31: "朝[あさ]早[はや]く起[お]きると、彼らは互[たが]いに誓[ちか]い合[あ]った。イサクは彼らを送[おく]り出[だ]し、彼らは無事[ぶじ]に彼のもとを去[さ]った。"
  32: "その日[ひ]、イサクのしもべたちが来[き]て、彼らが掘[ほ]った井戸[いど]のことを告[つ]げ、「わたしたちは水[みず]を見[み]つけませんでした」と言[い]った。"
  33: "そこで彼はその井戸を「誓[ちか]い」と名[な]づけた。それゆえ、その町[まち]の名[な]は今日[こんにち]まで「誓いの井戸[いど]」と呼ばれている。"
  34: "エサウは四十歳[よんじゅっさい]のとき、ヘト人[じん]ベエルの娘[むすめ]ユディンと、ヒビ人[じん]アイロンの娘[むすめ]バセマトを妻[つま]に娶[めと]った。"
  35: "彼女[かのじょ]たちはイサクとリベカに逆[さから]っていた。"

notes:
  1: "λιμὸς ἐπὶ τῆς γῆς χωρὶς τοῦ λιμοῦ τοῦ πρότερον — 以前の飢えとは別の飢え (χωρίς — «кроме, помимо»; слав. «кроме глада бывшаго прежде»). Ἀβιμελεχ βασιλέα Φυλιστιιμ — フィリスティ人の王アビメレク (Φυλιστιιμ — форма LXX; Син. «Филистимский»). εἰς Γεραρα — ゲラルへ."
  2: "ὤφθη δὲ αὐτῷ κύριος — 主は彼に現れて. Μὴ καταβῇς εἰς Αἴγυπτον — エジプトへ下ってはならない (запрет с аористом). κατοίκησον… ᾗ ἄν σοι εἴπω — わたしがあなたに告げる地に住みなさい (ᾗ ἄν — «в какой бы»)."
  3: "παροίκει ἐν τῇ γῇ ταύτῃ — この地に寄留していなさい (παροικέω). σοὶ γὰρ καὶ τῷ σπέρματί σου δώσω — あなたとあなたの子孫に…与える. στήσω τὸν ὅρκον μου — わたしの誓いを果たす (ἵστημι — «ставить, утверждать»). ὃν ὤμοσα Αβρααμ τῷ πατρὶ σου — あなたの父アブラハムに誓った (LXX: «отцу твоему»)."
  4: "πληθυνῶ τὸ σπέρμα σου ὡς τοὺς ἀστέρας τοῦ οὐρανοῦ — 子孫を天の星のように増やす. ἐνευλογηθήσονται ἐν τῷ σπέρματί σου πάντα τὰ ἔθνη — 地のすべての民はあなたの子孫によって祝福を受ける (ἐνευλογέομαι — «быть благословлённым в ком-либо»)."
  5: "ἀνθ᾽ ὧν — それは…からである (букв. «вместо того, что»; причина в конце главы). ὑπήκουσεν… τῆς ἐμῆς φωνῆς — わたしの声に聞き従った (ὑπακούω + родительный). τὰ προστάγματά μου καὶ τὰς ἐντολάς μου καὶ τὰ δικαιώματά μου καὶ τὰ νόμιμά μου — 定めと戒めと掟と法 (четыре термина сохранены; слав. «заповеди… повеления… оправдания… законы»; соответствия — как в Псалтири)."
  6: "κατῴκησεν Ισαακ ἐν Γεραροις — イサクはゲラルに住んだ (LXX сохраняет форму мн. ч. Γεραροις)."
  7: "Ἐπηρώτησαν… περὶ Ρεβεκκας — リベカのことを尋ねた (ἐπερωτάω). Ἀδελφή μού ἐστιν — わたしの妹です. ἐφοβήθη γὰρ εἰπεῖν — 言うのを恐れた (γάρ — причина). μήποτε ἀποκτείνωσιν — 殺すかもしれない (опасение). ὡραία τῇ ὄψει — 見た目が美しかった."
  8: "πολυχρόνιος ἐκεῖ — そこに長く滞在していた (πολυχρόνιος — «долговременный»). παρακύψας διὰ τῆς θυρίδος — 窓から身を乗り出して (θυρίς — «оконце»). παίζοντα μετὰ Ρεβεκκας — リベカと戯れていた (παίζω — «играть, ласкать»)."
  9: "Ἄρα γε — やはり (уверенный вывод). τί ὅτι εἶπας — なぜ…と言ったのか. Μήποτε ἀποθάνω δι᾽ αὐτήν — 彼女のゆえに死ぬことがないように (опасение, как в ст. 7)."
  10: "Τί τοῦτο ἐποίησας ἡμῖν; — 何ということをしたのか. μικροῦ — もう少しで (μικροῦ — «немного недостало»). ἐκοιμήθη τις… μετὰ τῆς γυναικός σου — 床をともにする所だった (эвфемизм). ἐπήγαγες ἐφ᾽ ἡμᾶς ἄγνοιαν — 罪を負わせるところだった (ἄγνοια — «неведение»; слав. «навел бы еси на ны неведение»; Син. «ввел бы нас в грех»)."
  11: "συνέταξεν… λέγων — 命じて言った (συντάσσω). ὁ ἁπτόμενος — 手を触れる者 (ἅπτομαι + родительный). θανάτου ἔνοχος ἔσται — 死刑に処せられる (ἔνοχος — «повинный»)."
  12: "ἑκατοστεύουσαν κριθὴν — 百倍の大麦 (ἑκατοστεύω — «приносить сторицей»; κριθή — «ячмень»). εὐλόγησεν… κύριος — 主が…祝福されたからである (причина в конце, как в LXX)."
  13: "ὑψώθη — 高くされた. προβαίνων μείζων ἐγίνετο — ますます大きくなって (προβαίνω — «продвигаться»). ἕως οὗ μέγας ἐγένετο σφόδρα — ついには非常に大きくなった."
  14: "κτήνη προβάτων καὶ κτήνη βοῶν — 羊の群れと牛の群れ (κτῆνος — «скот»). γεώργια πολλά — 多くの農地 (γεώργιον — «поле, хозяйство»). ἐζήλωσαν — 妬んだ (ζηλόω — «завидовать»)."
  15: "τὰ φρέατα, ἃ ὤρυξαν οἱ παῖδες τοῦ πατρὸς αὐτοῦ — 父のしもべたちが掘った井戸 (ὀρύσσω — «копать»; φρέαρ — 井戸). ἐνέφραξαν… καὶ ἔπλησαν αὐτὰ γῆς — ふさぎ、土で埋めた (ἐμφράσσω — «заваливать»)."
  16: "Ἄπελθε ἀφ᾽ ἡμῶν — 去ってくれ. δυνατώτερος ἡμῶν ἐγένου σφόδρα — わたしたちよりはるかに強くなった."
  17: "κατέλυσεν ἐν τῇ φάραγγι Γεραρων — ゲラルの谷に宿り (φάραγξ — «ущелье, долина»; καταλύω — «останавливаться»)."
  18: "ὤρυξεν τὰ φρέατα τοῦ ὕδατος — 水の井戸を掘り直した. μετὰ τὸ ἀποθανεῖν Αβρααμ — アブラハムが死んだ後. ἐπωνόμασεν αὐτοῖς ὀνόματα κατὰ τὰ ὀνόματα — 同じ名をつけた (букв. «имена по именам»)."
  19: "φρέαρ ὕδατος ζῶντος — 生ける水の井戸 (ὕδωρ ζῶν — «живая вода», т. е. родниковая)."
  20: "ἐμαχέσαντο οἱ ποιμένες — 羊飼いたちは争った. φάσκοντες αὐτῶν εἶναι τὸ ὕδωρ — 「この水はわたしたちのものだ」と言って (φάσκω — «утверждать»). Ἀδικία — 「不正」 (LXX переводит евр. имя Есек; слав. «обида», Син. «Есек»). ἠδίκησαν γὰρ αὐτόν — 彼を害したからである (ἀδικέω)."
  21: "ὤρυξεν φρέαρ ἕτερον — 別の井戸を掘った. ἐκρίνοντο — 争いが起きた (κρίνομαι — «судиться»). Ἐχθρία — 「敵意」 (слав. «вражда», Син. «Ситна»)."
  22: "οὐκ ἐμαχέσαντο περὶ αὐτοῦ — その井戸については争わなかった. Εὐρυχωρία — 「広い所」 (εὐρυχωρία — «простор»; слав. «пространство», Син. «Реховоф»). ἐπλάτυνεν κύριος ἡμῖν — 主はわたしたちの所を広げ (πλατύνω — «расширять»). ηὔξησεν ἡμᾶς ἐπὶ τῆς γῆς — この地でわたしたちを増やしてくださった."
  23: "ἐπὶ τὸ φρέαρ τοῦ ὅρκου — 誓いの井戸へ (LXX переводит название Вирсавии; слав. «ко кладязю клятвенному», Син. «в Вирсавию»)."
  24: "Ἐγώ εἰμι ὁ θεὸς Αβρααμ τοῦ πατρός σου — わたしはあなたの父アブラハムの神である (ἐγώ εἰμι — самораскрытие). μὴ φοβοῦ — 恐れるな. ηὐλόγηκά σε — perfect: благословил, и благословение остаётся. διὰ Αβρααμ — アブラハムのゆえに."
  25: "ᾠκοδόμησεν… θυσιαστήριον — 祭壇を築き (θυσιαστήριον — 祭壇). ἐπεκαλέσατο τὸ ὄνομα κυρίου — 主の名を呼び求めた (ἐπικαλέομαι). ἔπηξεν τὴν σκηνὴν αὐτοῦ — 天幕を張った (πήγνυμι — «втыкать, ставить»; σκηνή — 天幕). ὤρυξαν… φρέαρ — 井戸を掘った (слав. добавляет «в дебри герарстей»)."
  26: "Οχοζαθ ὁ νυμφαγωγός — 婚びとりの介添オホザト (νυμφαγωγός — «ведущий невесту, шафер»; евр. «друг его»; слав. «невестоводитель»; Син. «друг его»). Φικολ ὁ ἀρχιστράτηγος τῆς δυνάμεως — 軍勢の司令官フィコル (ἀρχιστράτηγος — «главный военачальник»)."
  27: "Ἵνα τί ἤλθατε πρός με; — なぜ来たのか. ἐμισήσατέ με καὶ ἀπεστείλατέ με — 憎み、追い出した (ἀποστέλλω — «отослать»)."
  28: "Ἰδόντες ἑωράκαμεν — はっきりと見ました (причастие + глагол — усиление, как в евр.). Γενέσθω ἀρὰ ἀνὰ μέσον ἡμῶν καὶ σοῦ — 誓いを立て (ἀρά — «клятва»; слав. «клятва»). διαθησόμεθα… διαθήκην — 契約を結ぼう (διαθήκη — 契約[けいやく]; слав. «завет»)."
  29: "μὴ ποιήσειν μεθ᾽ ἡμῶν κακόν — 悪いことをしないでください (инфинитив в значении просьбы). οὐκ ἐβδελυξάμεθα — 忌み嫌わず (βδελύσσομαι — «гнушаться»). ἐχρησάμεθά σοι καλῶς — よくして (χράομαι — «обходиться»). μετ᾽ εἰρήνης — 平安のうちに. εὐλογητὸς ὑπὸ κυρίου — 主に祝福された方 (в этом стихе — уже о Исааке, не славословие)."
  30: "ἐποίησεν αὐτοῖς δοχήν — 宴を設け (δοχή — «пир»)."
  31: "ὤμοσαν ἄνθρωπος τῷ πλησίον αὐτοῦ — 互いに誓い合った (букв. «человек ближнему своему»). μετὰ σωτηρίας — 無事に (букв. «со спасением, сохранно»)."
  32: "Οὐχ εὕρομεν ὕδωρ — 水を見つけませんでした (LXX: отрицание; Син. «мы нашли воду» — масоретское чтение, противоположное по смыслу; в 〔…〕 не берём)."
  33: "Ὅρκος — 「誓い」 (LXX переводит евр. название Шива/Беэр-Шева). ὄνομα τῇ πόλει Φρέαρ ὅρκου — その町の名は「誓いの井戸」 (евр. Беэр-Шева — ベエルシバ). ἕως τῆς σήμερον ἡμέρας — 今日まで."
  34: "Ιουδιν τὴν θυγατέρα Βεηρ τοῦ Χετταίου — ヘト人ベエルの娘ユディン (слав. «иудифу, дщерь веоха»). Βασεμμαθ θυγατέρα Αιλων τοῦ Ευαίου — ヒビ人アイロンの娘バセマト (Ευαῖος — «хиввей»; слав. и Син. читают «хеттеин» — масоретское чтение, в скобки не берём; Αιλων — евр. Элон). Имена даны по LXX."
  35: "ἦσαν ἐρίζουσαι τῷ Ισαακ καὶ τῇ Ρεβεκκα — イサクとリベカに逆らっていた (ἐρίζω — «препираться, враждовать»; слав. «противящеся», Син. «в тягость»)."
