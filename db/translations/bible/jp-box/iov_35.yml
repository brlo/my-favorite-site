# jp-box, Иов, глава 35. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге только 1–2; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 35: третья речь Елиуя — вопрос Иову (2–3), ответ ему и трём друзьям (4),
# небо выше человека (5), грех и правда человека не касаются Бога (6–8),
# вопль угнетённых и молчание Бога (9–13), призыв судиться с Богом (14),
# тёмное место о гневе и посещении (15), заключение об Иове (16).
# Голоса: 35:1 — вводная формула Елиуя, повествование, вне кавычек; 35:2–16 — его речь,
# одна цитата 「…」. Слова Иова внутри речи — 『…』: 2, 3; слова, которых никто
# не говорит, — 『…』: 10–11.
# Нумерация по gr: 16 стихов, как в csl-ru и ru. Расхождение: слав. относит
# «творящих беззаконная, и спасет мя» к концу 35:13, в LXX это начало 35:14 —
# держимся LXX (см. notes 13–14).
# 〔…〕 нет: все стихи есть в gr-lxx-byz. Сносок ⟨…⟩ нет.
# Имена — транслитерация греческого (LXX): ヨブ, エリフ.

tr_code: jp-box
book: iov
chapter: 35
draft: true

verses:
  1: "エリフはさらに答[こた]えて言[い]った。"
  2: "「あなたはこれを裁[さば]きにおいて何[なに]と思[おも]ったのか。『わたしは主[しゅ]の前[まえ]で正[ただ]しい』と言[い]うあなたは、何者[なにもの]なのか。"
  3: "また、あなたは『罪[つみ]を犯[おか]して、何[なに]をしようか』と言[い]うのか。"
  4: "わたしはあなたに、またあなたとともにいる三人[さんにん]の友[とも]に答[こた]えよう。"
  5: "天[てん]を見上[みあ]げて見[み]よ。雲[くも]を仰[あお]ぎ見[み]よ。それらはあなたより高[たか]い。"
  6: "もしあなたが罪[つみ]を犯[おか]しても、神[かみ]に何[なに]ができようか。あなたの不法[ふほう]が多[おお]くなっても、神に何[なに]ができるだろうか。"
  7: "もしあなたが正[ただ]しくても、神に何[なに]を与[あた]えられようか。神はあなたの手[て]から何[なに]を受[う]け取[と]られるだろうか。"
  8: "あなたの不敬[ふけい]はあなたに似[に]た人[ひと]に及び、あなたの正[ただ]しさは人[ひと]の子[こ]に及[およ]ぶ。"
  9: "多[おお]くの者[もの]に虐[しいた]げられて人[ひと]は叫[さけ]び、多[おお]くの者[もの]の腕[うで]のゆえに叫[さけ]ぶ。"
  10: "しかし、『わたしを造[つく]られた神[かみ]、夜[よる]の見張[みは]りを定[さだ]められた方[かた]、"
  11: "地[ち]の四[よ]つ足[あし]のものから、また天[てん]の鳥[とり]から、わたしを分[わ]け隔[へだ]てられた方[かた]は』と言[い]う者[もの]はいない。"
  12: "そこでは人[ひと]が叫[さけ]ぶが、神は聞[き]かれない。悪[あく]な者[もの]たちの傲慢[ごうまん]のゆえである。"
  13: "まことに、主[しゅ]は不合理[ふごうり]なことを見[み]ることを望[のぞ]まれない。全能者[ぜんのうしゃ]は見[み]る方[かた]である。"
  14: "不法[ふほう]を行[おこな]う者[もの]たちを見[み]ておられ、わたしを救[すく]われる。神の前[まえ]で、あなたは裁[さば]きを争[あらそ]え。もしあなたが、神をあるがままに、今[いま]も、ほめたたえることができるなら。"
  15: "そして今[いま]、神はその怒[いか]りをもって訪[おとず]れず、だれのそむきの罪[つみ]をもひどくは知[し]られない。"
  16: "ヨブはむなしく口[くち]を開[ひら]き、知識[ちしき]のないままに言葉[ことば]を重[おも]くしている。」"

notes:
  1: "Повествование (вводная формула): Ὑπολαβὼν δὲ Ελιους λέγει — «и отвечал же Елиус и говорит» (csl «Отвещав же еще елиус, рече»). Вне кавычек; с 35:2 начинается новая цитата, закрывается в 35:16."
  2: "Елиуй. Τί τοῦτο ἡγήσω ἐν κρίσει — «что это ты счёл в суде?» (ἡγέομαι — «считать, полагать»; κρίσις — «суд»; csl «что сие мнил еси на суде?»); σὺ τίς εἶ ὅτι εἶπας — «кто ты, что сказал»; Δίκαιός εἰμι ἔναντι κυρίου — «я прав пред Господом». Слова Иова — 『…』. В ru/МТ вопрос передан иначе («я правее Бога»), в LXX «прав пред Господом»."
  3: "Елиуй. ἢ ἐρεῖς — «или скажешь»; Τί ποιήσω ἁμαρτών — «что сделаю, согрешив?» (т. е. какая польза от греха; csl «что сотворю согрешив?»). Слова Иова — 『…』; в ru/МТ здесь добавлена вторая половина («какую прибыль я имел бы»), в LXX её нет."
  4: "Елиуй. ἐγὼ σοὶ δώσω ἀπόκρισιν — «я тебе дам ответ»; καὶ τοῖς τρισὶν φίλοις σου — «и трём друзьям твоим» (датив; csl «трием другом твоим»)."
  5: "Елиуй. ἀνάβλεψον εἰς τὸν οὐρανὸν καὶ ἰδέ — «воззри на небо и увидь» (ἀναβλέπω — «смотреть вверх»); κατάμαθε δὲ νέφη ὡς ὑψηλὰ ἀπὸ σοῦ — «всмотрись, как высоки облака от тебя» (καταμανθάνω — «всматриваться»; csl «смотри же на облаки, коль высоки суть от тебе»)."
  6: "Елиуй. εἰ ἥμαρτες, τί πράξεις — «если согрешил, что сделаешь?» (πράσσω); εἰ δὲ καὶ πολλὰ ἠνόμησας, τί δύνασαι ποιῆσαι — «если и много беззаконновал, что можешь сделать?» (ἀνομέω — «беззаконновать»). Мысль: грех человека Богу не вредит."
  7: "Елиуй. ἐπεὶ δὲ οὖν δίκαιος εἶ, τί δώσεις αὐτῷ — «если же ты праведен, что дашь Ему?»; ἢ τί ἐκ χειρός σου λήμψεται — «или что из руки твоей возьмёт?» (λαμβάνω; csl «что из руки твоея возмет?»)."
  8: "Елиуй. ἀνδρὶ τῷ ὁμοίῳ σου ἡ ἀσέβειά σου — «человеку, подобному тебе, нечестие твоё» (ἀσέβεια); καὶ υἱῷ ἀνθρώπου ἡ δικαιοσύνη σου — «и сыну человеческому правда твоя» (csl «мужеви подобному тебе нечестие твое, и сыну человеческому правда твоя»). Эллипсис сказуемого сохранён."
  9: "Елиуй. ἀπὸ πλήθους συκοφαντούμενοι κεκράξονται — «от множества обидчиков будут вопить» (συκοφαντέω — «притеснять, клеветать»); βοήσονται ἀπὸ βραχίονος πολλῶν — «возопиют от мышцы многих» (βραχίων — «мышца, сила»; csl «от мышцы многих»)."
  10: "Елиуй. καὶ οὐκ εἶπεν — «и не сказал» (ед. ч.); Ποῦ ἐστιν ὁ θεὸς ὁ ποιήσας με — «где Бог, создавший меня?»; ὁ κατατάσσων φυλακὰς νυκτερινάς — «устрояющий ночные стражи» (κατατάσσω — «ставить, устроять»; φυλακή — «стража»; csl «устрояяй стражбы нощныя»). Прямая речь в 『…』 продолжается в 35:11; вопрос имеет сказуемое ποῦ ἐστιν в начале стиха (10), в переводе оно перенесено в конец периода по законам японского порядка членов."
  11: "Елиуй. ὁ διορίζων με ἀπὸ τετραπόδων γῆς — «отделяющий меня от четвероногих земных» (διορίζω — «отделять, различать»; τετράποδα — «четвероногие»); ἀπὸ δὲ πετεινῶν οὐρανοῦ — «и от птиц небесных» (πετεινά). Мысль: Бог дал человеку разум, отличив его от скотов (в ru иначе: «научает нас более»). Здесь закрывается 『…』 и весь период: «и не сказал» по-гречески стоит в начале 35:10, в переводе период завершён в 11."
  12: "Елиуй. ἐκεῖ κεκράξονται — «там возопиют»; καὶ οὐ μὴ εἰσακούσῃ — «и не услышит» (в csl 2 л.: «не имаши услышати» — разночтение лица); ἀπὸ ὕβρεως πονηρῶν — «из-за дерзости злых» (ὕβρις — «наглость, надменность»; csl «от досады злых»)."
  13: "Елиуй. ἄτοπα γὰρ οὐ βούλεται ὁ κύριος ἰδεῖν — «ибо неуместного не хочет Господь видеть» (ἄτοπος — «неуместный, нелепый»; csl «безместная бо видети не хощет Господь»); αὐτὸς γὰρ ὁ παντοκράτωρ ὁρατής ἐστιν — «ибо Сам Вседержитель — зритель» (ὁρατής — «видящий»; в 35:14 при нём стоит род. падеж: «видящий делающих беззаконие»). Слав. добавляет «творящих беззаконная, и спасет мя» — это начало LXX 35:14, держимся деления LXX."
  14: "Елиуй. τῶν συντελούντων τὰ ἄνομα — род. падеж при ὁρατής из 35:13: «видящий делающих беззаконие» (συντελέω — «совершать»); καὶ σώσει με — «и спасёт меня» (σῴζω; csl относит оба к 35:13); κρίθητι δὲ ἐναντίον αὐτοῦ — «судись же пред Ним» (κρίνομαι — «судиться, вступать в суд»; передано 裁[さば]きを争[あらそ]え); εἰ δύνασαι αἰνέσαι αὐτόν, ὡς ἔστιν — «если можешь восхвалить Его, как Он есть» (αἰνέω). Слав. добавляет «и ныне» («якоже есть и ныне») — внесено как 今[いま]も."
  15: "Елиуй. καὶ νῦν — «и ныне»; ὅτι οὐκ ἔστιν ἐπισκεπτόμενος — «что нет посещающего» (ἐπισκέπτομαι — «посещать»; csl «несть посещаяй»); ὀργὴν αὐτοῦ — «гнев Его» (ὀργή); καὶ οὐκ ἔγνω παραπτώματι σφόδρα — «и не познал прегрешения весьма» (παράπτωμα — «прегрешение»; σφόδρα — «весьма»). Место тёмное и в LXX, и в csl; передано по csl («несть посещаяй гневом своим, и не позна прегрешения коеголибо зело»), буквальный LXX — «нет посещающего; гнев Его — и не познал прегрешения весьма»."
  16: "Елиуй. καὶ Ιωβ ματαίως ἀνοίγει τὸ στόμα αὐτοῦ — «и Иов напрасно открывает уста свои» (ματαίως — «всуе, напрасно»); ἐν ἀγνωσίᾳ ῥήματα βαρύνει — «в неведении слова отягощает» (ἀγνωσία — «неведение»; βαρύνω — «отягощать»; csl «неведением словеса отягощает»). Здесь закрывается цитата (35:2–16); в 36:1 — новая формула Елиуя."
