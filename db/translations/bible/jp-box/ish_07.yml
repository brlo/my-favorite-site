verses:
  1: "主[しゅ]はモーセに言[い]われた。「見[み]よ、わたしはあなたをファラオにとっての神[かみ]とした。あなたの兄弟[きょうだい]アロンは、あなたの預言者[よげんしゃ]となる。"
  2: "あなたは彼[かれ]に、わたしがあなたに命[めい]じるすべてのことを語[かた]り、あなたの兄弟[きょうだい]アロンはファラオに語[かた]り、イスラエルの子[こ]らをその地[ち]から去[さ]らせる。"
  3: "わたしはファラオの心[こころ]を頑[かたくな]にし、わたしのしるしと奇跡[きせき]をエジプトの地[ち]で増[ふ]やす。"
  4: "しかし、ファラオはあなたがたの言[い]うことを聞[き]かない。わたしはエジプトの上[うえ]に手[て]を置[お]き、大[おお]きな裁[さば]きによって、わたしの力[ちから]をもって、わたしの民[たみ]、イスラエルの子[こ]らをエジプトの地[ち]から導[みちび]き出[だ]す。"
  5: "わたしがエジプトの上[うえ]に手[て]を伸[の]べ、イスラエルの子[こ]らを彼[かれ]らの間[あいだ]から導[みちび]き出[だ]すとき、エジプト人[じん]はみな、わたしが主[しゅ]であることを知[し]る。」"
  6: "モーセとアロンは、主[しゅ]が命[めい]じられたとおりに行[おこな]った。そのとおりに行[おこな]ったのである。"
  7: "ファラオと語[かた]り合[あ]ったとき、モーセの年[とし]は八十[はちじゅう]、アロンの年[とし]は八十三[はちじゅうさん]であった。"
  8: "主[しゅ]はモーセとアロンに言[い]われた。"
  9: "「ファラオがあなたがたに『わたしたちにしるしや奇跡[きせき]を見[み]せよ』と言[い]ったなら、あなたはアロンに『杖[つえ]を取[と]って、ファラオの前[まえ]とその家来[けらい]たちの前[まえ]に投[な]げよ』と言[い]いなさい。それは大蛇[おおへび]になる。」"
  10: "モーセとアロンはファラオのところへ行[い]き、主[しゅ]が命[めい]じられたとおりに行[おこな]った。アロンは杖[つえ]をファラオの前[まえ]とその家来[けらい]たちの前[まえ]に投[な]げ、それは大蛇[おおへび]になった。"
  11: "ファラオはエジプトの賢[かしこ]い者[もの]たちと呪術師[じゅじゅつし]たちを呼[よ]び寄[よ]せた。エジプトの魔術師[まじゅつし]たちも、自分[じぶん]たちの呪術[じゅじゅつ]によって同[おな]じことをした。"
  12: "彼[かれ]らはそれぞれ杖[つえ]を投[な]げ、それが大蛇[おおへび]になった。しかし、アロンの杖[つえ]は彼[かれ]らの杖[つえ]を飲[の]み込[こ]んだ。"
  13: "ファラオの心[こころ]は頑[かたくな]になり、彼[かれ]らに聞[き]き従[したが]わなかった。主[しゅ]が言[い]われたとおりである。"
  14: "主[しゅ]はモーセに言[い]われた。「ファラオの心[こころ]は重[おも]くなっている。彼[かれ]は民[たみ]を去[さ]らせることを拒[こば]んでいる。"
  15: "明日[あした]、ファラオのところへ行[い]きなさい。見[み]よ、彼[かれ]は水[みず]のところへ出[で]て来[く]る。あなたはナイル川[がわ]の岸[きし]で彼[かれ]を迎[むか]え、蛇[へび]になったあの杖[つえ]を手[て]に取[と]り、"
  16: "彼[かれ]に言[い]いなさい。『ヘブライ人[じん]の神[かみ]である主[しゅ]が、わたしをあなたのもとへ遣[つか]わして言[い]われた。わたしの民[たみ]を去[さ]らせて、荒野[こうや]でわたしに仕[つか]えさせよ。しかし、あなたは今[いま]まで聞[き]き入れなかった。"
  17: "主[しゅ]はこう言[い]われる。これによって、わたしが主[しゅ]であることをあなたは知[し]る。見[み]よ、わたしは手[て]にあるこの杖[つえ]でナイル川[がわ]の水[みず]を打[う]つ。すると、それは血[ち]に変[か]わる。"
  18: "ナイル川[がわ]の魚[さかな]は死[し]に、川[かわ]は悪臭[あくしゅう]を放[はな]ち、エジプト人[じん]はナイル川[がわ]の水[みず]を飲[の]めなくなる。』」"
  19: "主[しゅ]はモーセに言[い]われた。「アロンに言[い]いなさい。『あなたの杖[つえ]を取[と]り、手[て]をエジプトの水[みず]の上[うえ]に、すなわち、その川[かわ]々[がわ]、その水路[すいろ]、その沼[ぬま]、すべての水[みず]の溜[た]まりの上[うえ]に伸[の]ばしなさい。』すると、それは血[ち]になる。」そして、エジプトの全土[ぜんど]で、木[き]の器[うつわ]にも石[いし]の器[うつわ]にも血[ち]があった。"
  20: "モーセとアロンは、主[しゅ]が命[めい]じられたとおりに行[おこな]った。アロンはファラオの前[まえ]とその家来[けらい]たちの前[まえ]で杖[つえ]を上[あ]げ、ナイル川[がわ]の水[みず]を打[う]った。すると、ナイル川[がわ]の水[みず]はすべて血[ち]に変[か]わった。"
  21: "ナイル川[がわ]の魚[さかな]は死[し]に、川[かわ]は悪臭[あくしゅう]を放[はな]ち、エジプト人[じん]はナイル川[がわ]の水[みず]を飲[の]めなかった。エジプトの全土[ぜんど]に血[ち]があった。"
  22: "エジプトの魔術師[まじゅつし]たちも、自分[じぶん]たちの呪術[じゅじゅつ]によって同[おな]じことをした。ファラオの心[こころ]は頑[かたくな]になり、彼[かれ]らに聞[き]き従[したが]わなかった。主[しゅ]が言[い]われたとおりである。"
  23: "ファラオは向[む]きを変[か]えて家[いえ]に帰[かえ]り、このことにも心[こころ]を留[と]めなかった。"
  24: "エジプト人[じん]はみな、飲[の]み水[みず]を得[え]ようとしてナイル川[がわ]の周[まわ]りを掘[ほ]ったが、ナイル川[がわ]の水[みず]を飲[の]むことはできなかった。"
  25: "主[しゅ]がナイル川[がわ]を打[う]たれてから、七日[なのか]が満[み]ちた。"
  26: "主[しゅ]はモーセに言[い]われた。「ファラオのところへ行[い]き、彼[かれ]に言[い]いなさい。『ヘブライ人[じん]の神[かみ]である主[しゅ]がこう言[い]われる。わたしの民[たみ]を去[さ]らせて、わたしに仕[つか]えさせよ。"
  27: "もし、あなたが去[さ]らせることを拒[こば]むなら、見[み]よ、わたしはあなたの全[ぜん]領土[りょうど]を蛙[かえる]で打[う]つ。"
  28: "ナイル川[がわ]は蛙[かえる]を吐[は]き出[だ]し、蛙[かえる]は上[あ]がって来[き]て、あなたの家[いえ]、寝室[しんしつ]の奥[おく]、寝床[ねどこ]、あなたの家来[けらい]たちと民[たみ]の家[いえ]、あなたの練[ね]り粉[こ]の中[なか]、かまどの中[なか]に入[はい]る。"
  29: "蛙[かえる]は、あなたの上[うえ]にも、あなたの家来[けらい]たちの上[うえ]にも、あなたの民[たみ]の上[うえ]にも上[あ]がって来[く]る。』」"

notes:
  1: "Ἰδοὺ δέδωκά σε θεὸν Φαραω — поставил тебя Богом фараону (LXX; слав. «дах тя Бога фараону»). προφήτης — пророк, т. е. уста Моисея."
  2: "λαλήσεις — будешь говорить. ἐντέλλομαι — заповедую. ὥστε ἐξαποστεῖλαι — чтобы отпустил."
  3: "σκληρυνῶ τὴν καρδίαν — ожесточу (σκληρύνω «делать твёрдым»). πληθυνῶ — умножу. σημεῖα καὶ τέρατα — знамения и чудеса (しるし、奇跡[きせき])."
  4: "ἐπιβαλῶ τὴν χεῖρά μου — наложу руку. ἐξάξω σὺν δυνάμει μου — выведу с силой Моей. σὺν ἐκδικήσει μεγάλῃ — с великим возмездием (ἐκδίκησις)."
  5: "ἐκτείνων τὴν χεῖρα — простирая руку. γνώσονται — узнают."
  6: "ἐποίησαν — сделали (аорист); повтор «так и сделали» сохранён."
  7: "ὀγδοήκοντα / ὀγδοήκοντα τριῶν — 80 и 83 года."
  8: "Краткое введение речи; в LXX стих обрывается на λέγων."
  9: "σημεῖον ἢ τέρας — знамение или чудо. ῥάβδος — жезл. δράκων — змей-дракон (大蛇), не ὄφις."
  10: "ἐγένετο δράκων — стал змеем; ср. 4:3."
  11: "σοφισταί — мудрецы. φαρμακοί — чародеи, зельевары (呪術師[じゅじゅつし]). ἐπαοιδοί — заклинатели, волхвы (魔術師[まじゅつし], слово задания). φαρμακεῖαι — чары, зелья."
  12: "κατέπιεν — поглотил."
  13: "κατίσχυσεν ἡ καρδία — сердце укрепилось (κατισχύω, не σκληρύνω); отсюда 頑[かたくな]になった."
  14: "βεβάρηται — отяжелело (βαρύνω, perfect); отсюда 重[おも]くなっている. τοῦ μὴ ἐξαποστεῖλαι — не отпустить."
  15: "ἐκπορεύεται ἐπὶ τὸ ὕδωρ — выходит к воде (утренний обряд). χεῖλος τοῦ ποταμοῦ — берег. ὄφις — змей (здесь уже не δράκων)."
  16: "Κύριος ὁ θεὸς τῶν Εβραίων — Господь, Бог Евреев. ἀπέσταλκέν με — послал меня (perfect). ἕως τούτου — до сих пор."
  17: "Ἐν τούτῳ γνώσῃ — по этому узнаешь. τύπτω — ударяю. μεταβαλεῖ εἰς αἷμα — превратится в кровь."
  18: "τελευτήσουσιν — умрут. ἐποζέσει — воссмердит (ὄζω «пахнуть»)."
  19: "διώρυγας — каналы, протоки. ἕλη — болота. πᾶν συνεστηκὸς ὕδωρ — всякая собранная вода. ἐν τοῖς ξύλοις καὶ ἐν τοῖς λίθοις — букв. «в деревьях и камнях», т. е. в деревянных и каменных сосудах."
  20: "ἐπάραs τῇ ῥάβδῳ — подняв жезл (подлежащее в греч. двусмысленно; по слав. и контексту — Аарон). ἐπάταξεν — ударил. μετέβαλεν — превратил."
  21: "ἐπώζεσεν — воссмердела. ἦν τὸ αἷμα — была кровь."
  22: "ἐσκληρύνθη ἡ καρδία — ожесточилось (пассив σκληρύνω, без указания на Бога)."
  23: "ἐπιστραφεὶς — обернувшись. οὐκ ἐπέστησεν τὸν νοῦν — не обратил ума (ἐφίστημι)."
  24: "ὤρυξαν κύκλῳ — копали вокруг."
  25: "ἀνεπληρώθησαν ἑπτὰ ἡμέραι — исполнилось семь дней."
  26: "Εἴσελθε πρὸς Φαραω — войди к фараону. ἵνα μοι λατρεύσωσιν — чтобы послужили Мне (λατρεύω — культовое служение). В слав. и масоретской нумерации это 8:1."
  27: "τύπτω πάντα τὰ ὅριά σου — поражаю все пределы твои. βάτραχοι — жабы. В слав. нумерации — 8:2."
  28: "ἐξερεύξεται — изрыгнет. ταμεῖα τῶν κοιτώνων — внутренние покои спален. φυράματα — квашни, замешанное тесто. κλίβανοι — печи. В слав. нумерации — 8:3."
  29: "ἀναβήσονται — взойдут. В слав. и масоретской нумерации — 8:4."
