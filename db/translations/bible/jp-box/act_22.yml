# jp-box, Деяния апостолов, глава 22. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 22: речь Павла к народу (1–21), возмущение (22–23), римское гражданство
# (24–29), Павел перед синедрионом (30).
# Красное: 22:7, 8, 10 (голос Господа по дороге в Дамаск), 22:18, 21 (Господь
# в видении в храме). Вопросы Павла (22:8, 10, 19–20) — не красные.
# jp-ni не использовался.

