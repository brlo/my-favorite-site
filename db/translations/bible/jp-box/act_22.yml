verses:
  1: "「兄弟[きょうだい]たち、父[ちち]たちよ、今[いま]、わたしがあなたがたに対[たい]して行[おこな]う弁明[べんめい]を聞[き]いてください。」"
  2: "彼[かれ]らは、パウロがヘブライ語[ご]で語[かた]りかけたのを聞[き]いて、いっそう静[しず]まりかえった。そこで、パウロは言[い]った。"
  3: "「わたしはユダヤ人[じん]で、キリキアのタルソで生[う]まれ、この都[みやこ]で育[そだ]ち、ガマリエルの足元[あしもと]で、先祖[せんぞ]の律法[りっぽう]を細[こま]かくまで教[おし]えられ、今日[こんにち]のあなたがたと同[おな]じように、神[かみ]に熱心[ねっしん]な者[もの]でありました。"
  4: "この道[みち]の者[もの]たちを、死[し]に至[いた]るまで迫害[はくがい]し、男[おとこ]も女[おんな]も縛[しば]り上[あ]げて牢[ろう]に閉[と]じ込[こ]めておりました。"
  5: "そのことは、大祭司[だいさいし]も、長老[ちょうろう]たちの会[かい]全体[ぜんたい]も、わたしのために証言[しょうげん]してくれます。わたしはこの人々[ひとびと]から兄弟[きょうだい]たちへの手紙[てがみ]を受[う]け取[と]り、ダマスコへ向[む]かいました。そこにいる者[もの]たちをも、罰[ばつ]を受[う]けさせるために、縛[しば]り上[あ]げてエルサレムへ連[つ]れて来[く]るためでした。"
  6: "ところが、旅[たび]を続[つづ]けてダマスコに近[ちか]づいたころ、真昼[まひる]ごろ、突然[とつぜん]、天[てん]から大[おお]きな光[ひかり]がわたしの周[まわ]りを照[て]らしました。"
  7: "わたしは地面[じめん]に倒[たお]れ、声[こえ]がわたしに言[い]うのを聞[き]きました。『<j>サウロ、サウロ、なぜわたしを迫害[はくがい]するのか。</j>』"
  8: "わたしは答[こた]えました。『主[しゅ]よ、あなたはどなたですか。』すると、わたしに言[い]われました。『<j>わたしは、あなたが迫害[はくがい]しているナザレ人[じん]イエスである。</j>』"
  9: "わたしと一緒[いっしょ]にいた者[もの]たちは、光[ひかり]を見[み]て〔恐[おそ]れを抱[いだ]き、〕わたしに語[かた]りかける声[こえ]は聞[き]き取[と]れませんでした。"
  10: "わたしは言[い]いました。『主[しゅ]よ、わたしは何[なに]をすればよいのですか。』主[しゅ]はわたしに言[い]われました。『<j>立[た]ち上[あ]がってダマスコへ行[い]け。そこであなたがなすべきことは、すべて告[つ]げられる。</j>』"
  11: "その光[ひかり]の輝[かがや]きのため、わたしは何[なに]も見[み]えなくなり、一緒[いっしょ]にいた者[もの]たちに手[て]を引[ひ]かれて、ダマスコに入[はい]りました。"
  12: "すると、アナニアという人[ひと]が来[き]ました。律法[りっぽう]に従[したが]って敬虔[けいけん]に生[い]き、ダマスコに住[す]むすべてのユダヤ人[じん]から証[あかし]を受[う]けている人[ひと]です。"
  13: "その人[ひと]がわたしのところへ来[き]て、そばに立[た]ち、『兄弟[きょうだい]サウロ、見[み]えるようになりなさい』と言[い]いました。すると、その時[とき]、わたしは彼[かれ]を見[み]ることができるようになりました。"
  14: "彼[かれ]は言[い]いました。『わたしたちの先祖[せんぞ]の神[かみ]は、あなたに御心[みこころ]を知[し]らせ、義[ぎ]なる方[かた]を見[み]させ、その口[くち]から声[こえ]を聞[き]かせるために、あらかじめあなたを選[えら]ばれたのです。"
  15: "あなたは、見[み]たこと、聞[き]いたことを、すべての人[ひと]の前[まえ]で、この方[かた]の証人[しょうにん]となるのです。"
  16: "さあ、なぜぐずぐずしているのですか。立[た]ち上[あ]がって洗礼[せんれい]を受[う]け、主[しゅ]の名[な]を呼[よ]び求[もと]めて、あなたの罪[つみ]を洗[あら]い清[きよ]めなさい。』"
  17: "そして、わたしがエルサレムに帰[かえ]り、神殿[しんでん]で祈[いの]っていたとき、夢[ゆめ]うつつになり、"
  18: "わたしは、主[しゅ]がわたしに言[い]われるのを見[み]ました。『<j>急[いそ]いで、すみやかにエルサレムを出[で]よ。わたしについてのあなたの証[あかし]を、ここでは受[う]け入[い]れないからである。</j>』"
  19: "わたしは言[い]いました。『主[しゅ]よ、あなたを信[しん]じる者[もの]たちを、わたしが会堂[かいどう]ごとに牢[ろう]に入[い]れ、むち打[う]っていたことを、彼[かれ]ら自身[じしん]が知[し]っています。"
  20: "また、あなたの証人[しょうにん]ステファンの血[ち]が流[なが]されたとき、わたしもその場[ば]に立[た]ち、その死[し]をよしとし、彼[かれ]を殺[ころ]す者[もの]たちの衣[ころも]を守[まも]っておりました。』"
  21: "すると、主[しゅ]はわたしに言[い]われました。『<j>行[い]け。わたしはあなたを遠[とお]くへ、異邦人[いほうじん]のもとへ遣[つか]わす。</j>』」"
  22: "彼[かれ]らは、パウロの言[い]うことをここまで聞[き]いていたが、そのとき、声[こえ]を上[あ]げて言[い]った。「このような者[もの]を地[ち]から取[と]り除[のぞ]け。生[い]かしておくべきではない。」"
  23: "彼[かれ]らは叫[さけ]び、衣[ころも]を投[な]げ、塵[ちり]を空[そら]にまき散[ち]らしながら、"
  24: "千人隊長[せんにんたいちょう]は、パウロを兵営[へいえい]に連[つ]れ込[こ]むように命[めい]じ、むちで打[う]って取[と]り調[しら]べるように言[い]った。なぜ彼[かれ]らがこのように叫[さけ]ぶのかを知[し]るためであった。"
  25: "彼[かれ]らが革[かわ]ひもでパウロを縛[しば]りつけたとき、パウロはそばに立[た]っていた百人隊長[ひゃくにんたいちょう]に言[い]った。「ローマ人[じん]で、しかも罪[つみ]を定[さだ]められていない者[もの]を、むちで打[う]つことが許[ゆる]されているのですか。」"
  26: "百人隊長[ひゃくにんたいちょう]はこれを聞[き]くと、千人隊長[せんにんたいちょう]のところへ行[い]って告[つ]げた。「どうなさるおつもりですか。この人[ひと]はローマ人[じん]です。」"
  27: "千人隊長[せんにんたいちょう]が来[き]て、パウロに言[い]った。「あなたはローマ人[じん]なのか、わたしに言[い]いなさい。」パウロは言[い]った。「そうです。」"
  28: "千人隊長[せんにんたいちょう]は言[い]った。「わたしは多[おお]くの金[かね]を払[はら]って、この市民権[しみんけん]を手[て]に入[い]れた。」パウロは言[い]った。「わたしは生[う]まれながらのローマ人[じん]です。」"
  29: "すると、パウロを取[と]り調[しら]べようとしていた者[もの]たちは、すぐに彼[かれ]から離[はな]れた。千人隊長[せんにんたいちょう]も、彼[かれ]がローマ人[じん]であること、また自分[じぶん]が彼[かれ]を縛[しば]っていたことを知[し]って、恐[おそ]れた。"
  30: "翌日[よくじつ]、ユダヤ人[じん]が彼[かれ]を訴[うった]えている理由[りゆう]をはっきり知[し]りたいと思[おも]い、パウロの縛[いまし]めを解[と]いて、祭司長[さいしちょう]たちと最高法院[さいこうほういん]の全員[ぜんいん]を集[あつ]めるように命[めい]じ、パウロを連[つ]れて来[く]て、彼[かれ]らの前[まえ]に立[た]たせた。"

notes:
  1: "ἀπολογία — «защитительная речь, оправдание»; 弁明. Обращение Ἄνδρες ἀδελφοὶ καὶ πατέρες — 兄弟たち、父たちよ."
  2: "Ἑβραῒς διάλεκτος — «еврейский язык» (здесь, вероятно, арамейский); ヘブライ語. παρέσχον ἡσυχίαν — «сохранили тишину»; いっそう静まりかえった."
  3: "κατὰ ἀκρίβειαν τοῦ πατρῴου νόμου — «по точности отеческого закона»; 細かくまで教えられ. ζηλωτὴς τοῦ θεοῦ — «ревнитель Бога»; 神に熱心な者."
  4: "ἡ ὁδός — «путь», самоназвание христиан; сноска уже стоит при первом упоминании в Деяниях (9:2), здесь не дублирую. ἄχρι θανάτου — 死に至るまで."
  7: "Слова Господа — красные; вопрос Павла в 22:8 — не красный. φωνῆς λεγούσης — 声が言うのを聞きました."
  8: "Ἐγώ εἰμι Ἰησοῦς ὁ Ναζωραῖος — ナザレ人イエス. Ответ Павла — не красный."
  9: "В критической базе только «свет видели, голоса не слышали»; церковный текст (Елизаветинская, jp-joc「光を見て懼れたり」) добавляет καὶ ἔμφοβοι ἐγένοντο — 〔恐れを抱き、〕."
  10: "Слова Господа — красные; вопрос Павла — не красный."
  14: "προεχειρίσατό σε — «предызбрал тебя»; あらかじめ選ばれた. ὁ δίκαιος — 義なる方, как в Деян 3:14; 7:52."
  16: "βάπτισαι — «крестись»; 洗礼を受け (не «омойся»). ἀπόλουσαι τὰς ἁμαρτίας — 罪を洗い清め."
  17: "ἐν ἐκστάσει — «в исступлении, трансе»; 夢うつつ."
  18: "Слова Господа — красные."
  19: "Слова Павла — не красные. φυλακίζων καὶ δέρων — 牢に入れ、むち打っていた."
  20: "συνευδοκῶν — «одобряя»; その死をよしとし. Стефан назван μάρτυς — 証人 (не «мученик»)."
  21: "Слова Господа — красные. εἰς ἔθνη μακράν — 遠くへ、異邦人のもとへ."
  25: "Ῥωμαῖος — римский гражданин; ローマ人 (сноска о правах римского гражданства — при первом упоминании, 16:37). ἀκατάκριτος — «неосуждённый»; 罪を定められていない者. Слова Павла — не красные."
  28: "πολιτεία — «гражданство»; 市民権. κεφάλαιον — «капитал, сумма»; 多くの金."
  30: "συνέδριον — 最高法院, как в Лк 22:66."
