verses:
  1: "主[しゅ]はモーセに語[かた]って言[い]われた。"
  2: "「あなたのもとから人[ひと]々[びと]を遣[つか]わし、わたしがイスラエルの子[こ]らに所有[しょゆう]として与[あた]えるカナン人[じん]の地[ち]を探[さぐ]らせなさい。部族[ぶぞく]ごとに、父[ちち]の家[いえ]の氏族[しぞく]ごとに、一[ひと]人[り]ずつ遣[つか]わしなさい。遣[つか]わす者[もの]はみな、彼[かれ]らのうちの長[かしら]としなさい。」"
  3: "モーセは主[しゅ]の言葉[ことば]によって、パランの荒野[こうや]から彼[かれ]らを遣[つか]わした。彼[かれ]らはみな、イスラエルの子[こ]らの長[かしら]である人[ひと]々[びと]であった。"
  4: "これが彼[かれ]らの名[な]である。ルベン部族[ぶぞく]からは、ザクフルの子[こ]サラミエル。"
  5: "シメオン部族[ぶぞく]からは、スリの子[こ]サファト。"
  6: "ユダ部族[ぶぞく]からは、イェフォンネの子[こ]カレブ。"
  7: "イッサカル部族[ぶぞく]からは、ヨセフの子[こ]イガアル。"
  8: "エフライム部族[ぶぞく]からは、ヌンの子[こ]アウシ。"
  9: "ベニヤミン部族[ぶぞく]からは、ラフの子[こ]ファルティ。"
  10: "ゼブルン部族[ぶぞく]からは、スディの子[こ]グディエル。"
  11: "ヨセフの子[こ]らのうちマナセ部族[ぶぞく]からは、スシの子[こ]ガディ。"
  12: "ダン部族[ぶぞく]からは、ガマリの子[こ]アミエル。"
  13: "アシェル部族[ぶぞく]からは、ミカエルの子[こ]サトゥル。"
  14: "ナフタリ部族[ぶぞく]からは、イアビの子[こ]ナビ。"
  15: "ガド部族[ぶぞく]からは、マキの子[こ]グディエル。"
  16: "これが、モーセが地[ち]を探[さぐ]らせるために遣[つか]わした人[ひと]々[びと]の名[な]である。モーセはヌンの子[こ]アウシをヨシュアと名[な]づけた。"
  17: "モーセはカナンの地[ち]を探[さぐ]らせるために彼[かれ]らを遣[つか]わし、彼[かれ]らに言[い]った。「この荒野[こうや]を上[のぼ]って行[い]き、山[やま]に上[のぼ]りなさい。"
  18: "そして、その地[ち]がどのようなものか、そこに住[す]む民[たみ]が強[つよ]いのか弱[よわ]いのか、少[すく]ないのか多[おお]いのかを見[み]なさい。"
  19: "彼[かれ]らが住[す]む地[ち]が良[よ]いのか悪[わる]いのか、彼[かれ]らが住[す]む町[まち]々[まち]が城壁[じょうへき]に囲[かこ]まれているのか、囲[かこ]まれていないのかも見[み]なさい。"
  20: "また、その地[ち]が肥[こ]えているのかやせているのか、木[き]があるのかないのかも見[み]なさい。勇[いさ]んで、地[ち]の実[み]をいくつか持[も]って来[き]なさい。」そのころは春[はる]の日[ひ]々[び]で、ぶどうの熟[じゅく]し始[はじ]めるころであった。"
  21: "彼[かれ]らは上[のぼ]って行[い]き、シンの荒野[こうや]から、エファトへ入[はい]る所[ところ]のラアブまで、その地[ち]を探[さぐ]った。"
  22: "彼[かれ]らは荒野[こうや]を上[のぼ]って行[い]き、ヘブロンまで来[き]た。そこにはエナクの一族[いちぞく]であるアヒマン、セスシ、テラミンがいた。ヘブロンはエジプトのタニスより七[なな]年[ねん]早[はや]く建[た]てられた。"
  23: "彼[かれ]らはぶどうの房[ふさ]の谷[たに]まで来[き]て、そこを探[さぐ]った。そして、そこからぶどうの枝[えだ]を一[ひと]本[ほん]、その上[うえ]に一[ひと]房[ふさ]のぶどうを付[つ]けたまま切[き]り取[と]り、二[ふた]人[り]で棒[ぼう]に掛[か]けて担[かつ]いだ。ざくろやいちじくも取[と]った。"
  24: "彼[かれ]らは、イスラエルの子[こ]らがそこから切[き]り取[と]ったぶどうの房[ふさ]のゆえに、その場所[ばしょ]をぶどうの房[ふさ]の谷[たに]と名[な]づけた。"
  25: "彼[かれ]らは四十日[よんじゅうにち]の後[のち]、地[ち]を探[さぐ]り終[お]えて、そこから帰[かえ]った。"
  26: "彼[かれ]らは行[い]って、パランの荒野[こうや]のカデスにいるモーセとアロン、およびイスラエルの子[こ]らの会衆[かいしゅう]全体[ぜんたい]のもとに来[き]た。そして、彼[かれ]らと会衆[かいしゅう]全体[ぜんたい]に答[こた]えを返[かえ]し、地[ち]の実[み]を見[み]せた。"
  27: "彼[かれ]らはモーセに語[かた]って言[い]った。「わたしたちは、あなたが遣[つか]わした地[ち]に行[い]きました。そこは乳[ちち]と蜜[みつ]の流[なが]れる地[ち]で、これがその実[み]です。"
  28: "しかし、そこに住[す]む民[たみ]は強[つよ]く、町[まち]々[まち]は城壁[じょうへき]で囲[かこ]まれ、非常[ひじょう]に大[おお]きいのです。そこではエナクの一族[いちぞく]も見[み]ました。"
  29: "アマレク人[じん]は南[みなみ]の地[ち]に住[す]み、ヘト人[じん]、エブ人[じん]、エブス人[じん]、アモリ人[じん]は山地[さんち]に住[す]み、カナン人[じん]は海[うみ]の岸[きし]とヨルダン川[がわ]の岸[きし]に住[す]んでいます。」"
  30: "カレブはモーセの前[まえ]で民[たみ]を静[しず]めて言[い]った。「いいえ、わたしたちは上[のぼ]って行[い]き、あの地[ち]を必[かなら]ず手[て]に入[い]れます。わたしたちは必[かなら]ず彼[かれ]らに勝[か]てますから。」"
  31: "しかし、彼[かれ]と共[とも]に上[のぼ]って行[い]った人[ひと]々[びと]は言[い]った。「わたしたちは上[のぼ]って行[い]きません。あの民[たみ]はわたしたちよりも強[つよ]く、とても太刀打[たちう]ちできません。」"
  32: "彼[かれ]らは、自分[じぶん]たちが探[さぐ]った地[ち]について、イスラエルの子[こ]らに恐[おそ]ろしい噂[うわさ]を広[ひろ]めて言[い]った。「わたしたちが通[とお]り抜[ぬ]けて探[さぐ]った地[ち]は、そこに住[す]む者[もの]を食[く]い尽[つ]くす地[ち]です。そこに見[み]た民[たみ]はみな、背[せ]の非常[ひじょう]に高[たか]い人[ひと]々[びと]でした。"
  33: "そこでわたしたちは巨人[きょじん]を見[み]ました。わたしたちは彼[かれ]らの前[まえ]ではいなごのようで、それどころか、彼[かれ]らの前[まえ]ではまさにいなごそのものでした。」"

notes:
  1: "ἐλάλησεν κύριος πρὸς Μωυσῆν λέγων — 主はモーセに語って言われた (λέγων отдельно не передаётся; содержание речи — ст. 2)."
  2: "Ἀπόστειλον σεαυτῷ — «пошли от себя» (σεαυτῷ — датив «для себя, от себя»). κατασκεψάσθωσαν — «пусть осмотрят» (κατασκέπτομαι — разведать, высмотреть). εἰς κατάσχεσιν — 所有 (κατάσχεσις — «владение, удел»). κατὰ δήμους πατριῶν — «по племенам отцов» (δῆμος — род, племя). πάντα ἀρχηγὸν ἐξ αὐτῶν — «всех их — начальников» (ἀρχηγός — 長)."
  3: "ἐξαπέστειλεν — выслал (ἐξαποστέλλω). διὰ φωνῆς κυρίου — «через голос Господень», т. е. по повелению (слав. «глаголом Господним»; Син. «по повелению Господню»). πάντες ἄνδρες ἀρχηγοί — все они мужи-начальники."
  4: "ταῦτα τὰ ὀνόματα αὐτῶν — これが彼らの名. τῆς φυλῆς Ρουβην — ルベン部族から (родительный при подразумеваемом «из»). Σαλαμιηλ υἱὸς Ζακχουρ — サラミエル、ザクフルの子 (LXX; в масоретском тексте Шаммуа, сын Закхура)."
  5: "Σαφατ υἱὸς Σουρι — サファト、スリの子 (LXX; масор. Шафат, сын Хори)."
  6: "Χαλεβ υἱὸς Ιεφοννη — カレブ、イェフォンネの子 (в LXX имя отца Ιεφοννη; масор. Иефонни)."
  7: "Ιγααλ υἱὸς Ιωσηφ — イガアル、ヨセフの子 (LXX; масор. Игал, сын Иосифа)."
  8: "Αυση υἱὸς Ναυη — アウシ、ヌンの子 (LXX Αυση = евр. Хошеа; Ναυη передано по корпусу как ヌン, ср. Исх 33:11)."
  9: "Φαλτι υἱὸς Ραφου — ファルティ、ラフの子 (LXX; масор. Фалтий, сын Рафу)."
  10: "Γουδιηλ υἱὸς Σουδι — グディエル、スディの子 (LXX; масор. Гаддиил, сын Соди)."
  11: "τῶν υἱῶν Μανασση — из сынов Манассии, т. е. из половины колена. Γαδδι υἱὸς Σουσι — ガディ、スシの子 (LXX; масор. Гаддий, сын Суси)."
  12: "Αμιηλ υἱὸς Γαμαλι — アミエル、ガマリの子 (LXX; масор. Аммиил, сын Гемаллия)."
  13: "Σαθουρ υἱὸς Μιχαηλ — サトゥル、ミカエルの子 (LXX; масор. Сефур, сын Михаила)."
  14: "Ναβι υἱὸς Ιαβι — ナビ、イアビの子 (LXX; масор. Нахби, сын Вофси)."
  15: "Γουδιηλ υἱὸς Μακχι — グディエル、マキの子 (LXX; масор. Геуил, сын Махия). Имя Γουδιηλ повторяет имя из ст. 10 — в переводе одинаково."
  16: "ἐπωνόμασεν … Ἰησοῦν — нарёк Иисусом (ἐπονομάζω). В LXX здесь уже Ἰησοῦς, поэтому в тексте ヨシュア (ср. Исх 24:13); слав. «Иисус»."
  17: "Ἀνάβητε ταύτῃ τῇ ἐρήμῳ — «взойдите этою пустынею» (ταύτῃ — датив пути). καὶ ἀναβήσεσθε εἰς τὸ ὄρος — и взойдёте на гору."
  18: "εἰ ἰσχυρότερός ἐστιν ἢ ἀσθενής — силён ли или слаб (сравнительная степень в косвенном вопросе). εἰ ὀλίγοι … ἢ πολλοί — мало или много."
  19: "τειχήρεσιν / ἀτειχίστοις — укреплённые стенами / без стен (τειχήρης, ἀτείχιστος; слав. «ограждени / не ограждени»)."
  20: "πίων ἢ παρειμένη — тучная или истощённая (πίων «жирный», παρίημι «ослабевать»). προσκαρτερήσαντες — «проявив настойчивость» (слав. «укрепившеся»; Син. «будьте смелы»). αἱ ἡμέραι ἡμέρας ἔαρος, πρόδρομοι σταφυλῆς — «дни были дни весны, предвестники винограда», т. е. время перед созреванием; передано описательно."
  21: "ἀπὸ τῆς ἐρήμου Σιν ἕως Ρααβ — от пустыни Син до Раава (Ρααβ = Рехов; Син. «Рехов»). εἰσπορευομένων Εφααθ — «при входе в Емаф» (Син. «близ Емафа»); Εφααθ передано как エファト."
  22: "γενεαὶ Εναχ — поколения Енака, エナクの一族. Χεβρων ἑπτὰ ἔτεσιν ᾠκοδομήθη πρὸ τοῦ Τάνιν — Хеврон построен за семь лет до Таниса (Τάνις = Цоан; Син. «Цоан»). ᾠκοδομήθη — аорист пассива."
  23: "Φάραγξ βότρυος — долина грозда (Есхол). κλῆμα καὶ βότρυν ἕνα — ветвь и одну кисть. ἀναφορεῦσιν — носилки, шесты (слав. «жердь»). ῥοῶν, συκῶν — гранаты, смоквы."
  24: "ἐπωνόμασαν — назвали; имя Φάραγξ βότρυος объяснено через βότρυν, который срезали."
  25: "μετὰ τεσσαράκοντα ἡμέρας — через сорок дней (эти сорок дней — ср. 14:34)."
  26: "ἀπεκρίθησαν αὐτῷ ῥῆμα — «отвечали ему слово» (ἀποκρίνομαι с винительным). πᾶσαν συναγωγήν — весь сонм, 会衆全体. ἔδειξαν τὸν καρπόν — показали плод."
  27: "διηγήσαντο — рассказали (διηγέομαι). ῥέουσαν γάλα καὶ μέλι — текущую молоком и мёдом (образ изобилия; ср. Исх 3:8)."
  28: "θρασύ — дерзкий, наглый (слав. «сильни»; Син. «силён»). ὀχυραὶ τετειχισμέναι — крепкие, обнесённые стенами (perfect от τειχίζω). γενεὰν Εναχ — род Енака."
  29: "Амалик, Хеттей, Евей, Иевусей, Аморрей, Хананей — народы земли; порядок по LXX. Ἀμαληκ — имя народа без «сыны». ὀρεινή — нагорная страна, 山地; παρὰ θάλασσαν καὶ παρὰ τὸν Ιορδάνην ποταμόν — при море и при Иордане."
  30: "κατεσιώπησεν — заставил замолчать, успокоил (κατασιωπάω; слав. «утиши»). Οὐχί — «нет же!». ἀναβάντες ἀναβησόμεθα — усилительное удвоение («взойдём непременно»). δυνατοὶ δυνησόμεθα — «сильные, сможем», т. е. непременно одолеем."
  31: "οἱ συναναβάντες — взошедшие вместе с ним. οὐ μὴ δυνώμεθα — решительное отрицание (οὐ μή с конъюнктивом). ἰσχυρότερον … μᾶλλον — «сильнее нас» с плеоназмом μᾶλλον."
  32: "ἐξήνεγκαν ἔκστασιν τῆς γῆς — «вынесли ужас земли» (ἔκστασις — исступление, ужас; слав. «ужас земли»); передано как «恐ろしい噂». γῆ κατέσθουσα τοὺς κατοικοῦντας — земля, поедающая жителей. ὑπερμήκεις — чрезмерно высокие (ὑπερμήκης)."
  33: "τοὺς γίγαντας — 巨人 (γίγας; слав. «исполины»). ὡσεὶ ἀκρίδες — как саранча (ἀκρίς). ἀλλὰ καὶ οὕτως ἦμεν ἐνώπιον αὐτῶν — букв. «и так мы были пред ними», повтор усиливает; передано «まさにいなごそのもの». Масоретский текст и Синодальный добавляют «в глазах наших», в LXX этого нет — не внесено. Слав. в ст. 34 (= gr 33) добавляет «сыны енаковы», Синодальный — «от исполинского рода»; в gr-lxx-byz их нет (bracket_check: εναχ в 13:33 — НЕТ), в текст не внесены, 〔…〕 не ставим."
