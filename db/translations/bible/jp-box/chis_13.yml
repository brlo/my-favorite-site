# jp-box, Числа, глава 13. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в главах 13–16
# отсутствует (фрагменты книги: 8:15–17; 11:16,17,24–29; 24:2,3,5–9,17,18).
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 13: посылка разведчиков и их имена (1–16), наставление Моисея (17–20),
# путь и осмотр земли (21–24), возвращение через сорок дней (25–26),
# рассказ о земле (27–29), призыв Халева и ропот остальных (30–33).
# Нумерация — по gr-lxx-byz: 33 стиха. В csl-ru и ru 34 стиха: у них ст. 1 —
# заключительный стих гл. 12 («И по сих воздвигошася людие от Асирофа…»),
# поэтому вся нумерация сдвинута на +1 (gr 13:1 = csl 13:2). Масоретские чтения
# (в т. ч. «в глазах наших» в 13:33) не вносим.
# Красного и синего нет. Речь Бога — 「…」 (2); речь Моисея — 「…」 (17–20);
# речь разведчиков, Халева и остальных — 「…」 (27–33).
# 〔…〕 нет: все слова есть в gr-lxx-byz. Слав. добавление в 13:34 (= gr 13:33)
# «сыны енаковы» и Син. «от исполинского рода» (от евр.) в текст не внесены — см. notes.
# Сносок ⟨…⟩ нет: 巨人 уже пояснено в Быт 6:4, остальные слова и имена понятны.
# jp-ni не использовался.

