verses:
  1: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。「行[い]って、エルサレムの耳[みみ]に呼[よ]ばわり、こう告[つ]げよ。『主[しゅ]はこう言[い]われる』」。"
  2: "「わたしはあなたの若[わか]い日[ひ]の慈[いつく]しみと、あなたが荒野[こうや]で、種[たね]の蒔[ま]かれない地[ち]で、イスラエルの聖[せい]なる方[かた]に従[したが]った、その愛[あい]の全[まった]きこととを覚[おぼ]えている、と主[しゅ]は言[い]われる」。"
  3: "「イスラエルは主[しゅ]にとって聖[せい]なるもの、その産[さん]物[ぶつ]の初穂[はつほ]であった。それを受[う]け取[と]る者[もの]はすべて罪[つみ]に定[さだ]められ、災[わざわ]いが彼[かれ]らの上[うえ]に来[く]る、と主[しゅ]は言[い]われる。」"
  4: "主[しゅ]の言葉[ことば]を聞[き]け、ヤコブの家[いえ]、イスラエルの家[いえ]のすべての氏族[しぞく]よ。"
  5: "主[しゅ]はこう言[い]われる。「あなたがたの父祖[ふそ]たちは、わたしのうちにどんな過[あやま]ちを見[み]つけたというのか。彼[かれ]らはわたしから遠[とお]く離[はな]れ、むなしいものに従[したが]って、むなしい者[もの]となった。"
  6: "彼[かれ]らは言[い]わなかった。『わたしたちをエジプトの地[ち]から導[みちび]き上[あ]げ、荒野[こうや]を、広[ひろ]くて通[とお]り抜[ぬ]けられない地[ち]を、水[みず]のない実[みの]らない地[ち]を、だれも通[とお]らず、人の住[す]まない地[ち]を、導[みちび]いてくださった主[しゅ]はどこにおられるのか』と。"
  7: "わたしはあなたがたをカルメルに導[みちび]き入[い]れ、その実[みの]りとその良[よ]いものとを食[た]べさせた。ところが、あなたがたは入[はい]って来[き]て、わたしの地[ち]を汚[けが]し、わたしの嗣業[しぎょう]を忌[い]むべきものとした。"
  8: "祭司[さいし]たちは『主[しゅ]はどこにおられるのか』と言[い]わず、律法[りっぽう]にすがる者[もの]たちもわたしを知[し]らず、牧者[ぼくしゃ]たちはわたしに背[そむ]き、預言者[よげんしゃ]たちはバアルによって預言[よげん]し、役[やく]に立[た]たないものたちに従[したが]って行[い]った。"
  9: "それゆえ、わたしはなお、あなたがたと裁[さば]きの場[ば]で争[あらそ]い、あなたがたの子[こ]らの子[こ]らとも争[あらそ]う、と主[しゅ]は言[い]われる。"
  10: "キティムの島々[しまじま]へ渡[わた]って見[み]よ。ケダルに使者[ししゃ]を遣[つか]わし、このようなことがかつて起[お]こったかどうかを、よくよく見定[みさだ]めよ。"
  11: "もろもろの民[たみ]が自分[じぶん]の神々[かみがみ]を取[と]り替[か]えるだろうか。彼[かれ]らは神[かみ]ではないのに。しかし、わたしの民[たみ]は自分[じぶん]の栄光[えいこう]を、役[やく]に立[た]たないものと取[と]り替[か]えた。"
  12: "天[てん]よ、このことで驚[おどろ]き、甚[はなは]だしくおののけ、と主[しゅ]は言[い]われる。"
  13: "わたしの民[たみ]は二[ふた]つの悪[あく]を行[おこな]った。すなわち、わたし、生[い]ける水[みず]の泉[いずみ]を捨[す]て、自分[じぶん]のために、水[みず]を蓄[た]えることのできない壊[こわ]れた水槽[すいそう]を掘[ほ]ったのだ。"
  14: "イスラエルは奴隷[どれい]なのか。家[いえ]に生[う]まれた僕[しもべ]なのか。なぜ、彼[かれ]は獲物[えもの]となったのか。"
  15: "若[わか]い獅子[しし]たちが彼[かれ]に向[む]かってほえたけり、声[こえ]を上[あ]げた。彼[かれ]らはその地[ち]を荒野[こうや]とし、その町々[まちまち]は焼[や]かれ、住[す]む者[もの]がなくなった。"
  16: "メンフィスとタフナヘスの子[こ]らも、あなたを知[し]り、あなたを嘲[あざけ]った。"
  17: "あなたが自分[じぶん]の神[かみ]である主[しゅ]を捨[す]てたことこそ、あなたにこのことをもたらしたのではないか、と主[しゅ]は言[い]われる。"
  18: "今[いま]、あなたにとってエジプトの道[みち]は何[なん]なのか。ギホンの水[みず]を飲[の]むためか。あなたにとってアッシリアの道[みち]は何[なん]なのか。川[かわ]の水[みず]を飲[の]むためか。"
  19: "あなたの背信[はいしん]があなたを懲[こ]らしめ、あなたの悪[あく]があなたを責[せ]める。あなたが自分[じぶん]の神[かみ]である主[しゅ]を捨[す]てたことが、いかに悪[わる]く、いかに苦[にが]いことかを知[し]り、悟[さと]れ、と主[しゅ]は言[い]われる。わたしはあなたを喜[よろこ]ばなかった、と主[しゅ]なる神[かみ]は言[い]われる。"
  20: "あなたは昔[むかし]から自分[じぶん]の軛[くびき]を折[お]り、自分[じぶん]の綱[つな]を引[ひ]き裂[さ]いて言[い]った。『わたしは仕[つか]えない』と。そして、すべての高[たか]い丘[おか]の上[うえ]、すべての茂[しげ]った木[き]の下[した]で、あなたは身[み]を横[よこ]たわめて淫行[いんこう]を重[かさ]ねた。"
  21: "わたしはあなたを、実[みの]りを結[むす]ぶ良[よ]いぶどうの木[き]、まったく真[しん]実[じつ]な種[たね]として植[う]えた。それなのに、どうしてあなたは苦[にが]みに変[か]わったのか、よそのぶどうの木[き]よ。"
  22: "たとえあなたが灰汁[あく]で身[み]を洗[あら]い、多[おお]くの草[くさ]を自分[じぶん]に用[もち]いても、あなたの罪[つみ]のしみはわたしの前[まえ]に残[のこ]っている、と主[しゅ]なる神[かみ]は言[い]われる。"
  23: "どうしてあなたは『わたしは汚[けが]れていない。バアルに従[したが]って行[い]ったことはない』と言[い]えるのか。谷[たに]でのあなたの道[みち]をよく見[み]よ。あなたがしたことを知[し]れ。駆[か]け回[まわ]る若[わか]い雌[め]らくだよ。夕暮[ゆうぐれ]には、その声[こえ]が泣[な]きわめいた。"
  24: "彼女[かのじょ]は荒野[こうや]の水[みず]のほとりへと道[みち]を広[ひろ]げ、その魂[たましい]の欲[よく]のままに風[かぜ]に吹[ふ]かれて行[い]った。彼女[かのじょ]は引[ひ]き渡[わた]された。だれが彼女を連[つ]れ戻[もど]せるのか。彼女を求[もと]める者[もの]はだれも疲[つか]れず、彼女の辱[はずかし]めの時[とき]に彼女を見[み]つける。"
  25: "あなたの足[あし]を荒[あ]れた道[みち]から、あなたののどを渇[かわ]きから引[ひ]き返[かえ]せ。しかし、彼女[かのじょ]は言[い]った。『いや、わたしは力[ちから]を出[だ]す。よその者[もの]たちを愛[あい]してしまったのだから、彼らに従[したが]って行[い]く』と。"
  26: "盗人[ぬすびと]が捕[つか]まったときの恥[はじ]のように、イスラエルの子[こ]らは恥[はじ]を受[う]ける。彼[かれ]らも、その王[おう]たちも、その君[きみ]たちも、その祭司[さいし]たちも、その預言者[よげんしゃ]たちも。"
  27: "彼[かれ]らは木[き]に『あなたはわたしの父[ちち]だ』と言[い]い、石[いし]に『あなたがわたしを生[う]んだ』と言[い]う。しかし、彼[かれ]らはわたしに背[せ]を向[む]けて顔[かお]を向[む]けなかった。災[わざわ]いの時[とき]には、彼らは『立[た]ち上[が]って、わたしたちを救[すく]え』と言[い]うだろう。"
  28: "では、あなたが自分[じぶん]のために造[つく]った神々[かみがみ]はどこにいるのか。もしできるなら、彼[かれ]らがあなたの災[わざわ]いの時[とき]に立[た]ち上[が]って、あなたを救[すく]うがよい。ユダよ、あなたの町[まち]の数[かず]だけあなたの神々[かみがみ]があり、エルサレムの通[とお]りの数[かず]だけ、あなたはバアルに犠牲[ぎせい]をささげている。"
  29: "なぜ、あなたがたはわたしと論[ろん]じ合[あ]うのか。あなたがたは皆[みな]、わたしに背[そむ]き、わたしに対して不法[ふほう]を犯[おか]した、と主[しゅ]は言[い]われる。"
  30: "わたしはあなたがたの子[こ]らをむなしく打[う]った。彼[かれ]らは懲[こら]しめを受[う]けなかった。あなたがたの預言者[よげんしゃ]たちは、滅[ほろ]ぼす獅子[しし]のように剣[つるぎ]に食[く]い尽[く]くされた。それでも、あなたがたは恐[おそ]れなかった。」"
  31: "主[しゅ]の言葉[ことば]を聞[き]け。主[しゅ]はこう言[い]われる。「わたしはイスラエルにとって荒野[こうや]であったのか。暗[くら]い地[ち]であったのか。なぜ、わたしの民[たみ]は『わたしたちは自分[じぶん]の主人[しゅじん]であり、もうあなたのもとへは行[い]かない』と言[い]うのか。"
  32: "娘[むすめ]はその飾[かざ]りを、花嫁[はなよめ]はその胸[むね]の帯[おび]を忘[わす]れるだろうか。しかし、わたしの民[たみ]はわたしを忘[わす]れた。数[かぞ]えきれない日々[ひび]の間[あいだ]、忘れている。"
  33: "なぜ、あなたは愛[あい]を求[もと]めるために、自分[じぶん]の道[みち]をうまく整[ととの]えるのか。そうではない。あなたはむしろ、自分の道[みち]を汚[けが]すことにまで悪[あく]を働[はたら]いた。"
  34: "あなたの手[て]には、罪[つみ]のない貧[まず]しい者[もの]たちの血[ち]が見[み]つかった。わたしは彼らを押[お]し入[い]り盗[ぬす]みの現場[げんば]で見[み]つけたのではない。すべての樫[かし]の木[き]のそばで見[み]つけたのだ。"
  35: "それなのに、あなたは『わたしは罪[つみ]がない。きっと、その怒[いか]りはわたしから離[はな]れる』と言[い]った。見[み]よ、わたしはあなたと裁[さば]きの場[ば]で争[あらそ]う。あなたが『わたしは罪[つみ]を犯[おか]していない』と言[い]うからだ。"
  36: "なぜ、あなたはそう軽[かる]々[がる]しく道[みち]を変[か]えるのか。あなたはエジプトによって恥[はじ]を受[う]けるだろう。アッシリアによって恥[はじ]を受[う]けたように。"
  37: "あなたはそこからも、頭[あたま]に手[て]を置[お]いて出[で]て行[い]く。主[しゅ]があなたの頼[たよ]りとするものを見放[みはな]されたからだ。あなたはそれによって栄[さか]えることはない。」"

notes:
  1: "В модуле gr-lxx-byz на месте 2:1 стоит «.» — лакуна (нумерация LXX здесь иная). Стих переведён по слав. 2:1 без 〔…〕: «И бысть слово Господне ко мне глаголющее: иди и вопий во ушы Иерусалиму, рекий: сия глаголет Господь». καὶ ἐγένετο λόγος κυρίου πρός με — вводная формула вне кавычек; «иди и возгласи» — поручение в 「…」; «ибо так говорит Господь» — вложенное 『…』. Заключительная формула слав. 2:1 («сия глаголет Господь») в греч. стоит в начале 2:2 (καὶ εἶπεν Τάδε λέγει κύριος), поэтому здесь оставлена, а в 2:2 не повторяется."
  2: "Τάδε λέγει κύριος Ἐμνήσθην ἐλέους νεότητός σου — «так говорит Господь: Я вспомнил милость юности твоей» (ἔλεος — милость, 慈しみ; νεότης — юность). καὶ ἀγάπης τελειώσεώς σου — «и любовь совершенства твоего» (τελείωσις — завершение, полнота). τοῦ ἐξακολουθῆσαί σε τῷ ἁγίῳ Ισραηλ — «что ты последовал Святому Израилеву» (ἐξακολουθέω — следовать). Слав. добавляет «в пустыни ненасеянней» (из МТ) — этого нет в LXX, внесено в основной текст без скобок (荒野、種の蒔かれない地). Греч. καὶ εἶπεν Τάδε λέγει κύριος — та же формула, что в конце слав. 2:1, поэтому не повторена (см. notes к 2:1)."
  3: "ἅγιος Ισραηλ τῷ κυρίῳ — «свят Израиль Господу», т. е. Израиль посвящён Господу (слав. «свят израиль Господеви»). ἀρχὴ γενημάτων αὐτοῦ — «начаток плодов его» (γένημα — произведение, плод; 初穂). πάντες οἱ ἔσθοντες αὐτὸν πλημμελήσουσιν — «все, кто ест его, согрешат», т. е. будут повинны (πλημμελέω — ошибаться, быть виновным); κακὰ ἥξει ἐπ᾽ αὐτούς — «злое придёт на них». Слав. «вси поядающии его согрешат». φησὶν κύριος — «говорит Господь» в конце, внутри кавычек."
  4: "ἀκούσατε λόγον κυρίου, οἶκος Ιακωβ — «слушайте слово Господне, дом Иаковлев»; πᾶσα πατριὰ οἴκου Ισραηλ — «всякое племя дома Израилева» (πατριά — род, племя; 氏族). Призыв пророка — вне кавычек, как вводная формула; слово Господа начинается в 2:5."
  5: "Τί εὕροσαν οἱ πατέρες ὑμῶν ἐν ἐμοὶ πλημμέλημα — «какую неправду нашли отцы ваши во Мне?» (πλημμέλημα — проступок, вина; слав. «кое обретоша отцы ваши во мне погрешение»). ὅτι ἀπέστησαν μακρὰν ἀπ᾽ ἐμοῦ — «что удалились далеко от Меня» (ἀφίστημι). ἐπορεύθησαν ὀπίσω τῶν ματαίων καὶ ἐματαιώθησαν — «пошли за суетными и осуетились» (μάταιος — пустой, суетный; ματαιόω — делать пустым): игра слов сохранена двумя оборотами."
  6: "καὶ οὐκ εἶπαν Ποῦ ἐστιν κύριος — «и не сказали: где Господь?»; слова народа — вложенная цитата 『…』. ὁ ἀναγαγὼν ἡμᾶς ἐκ γῆς Αἰγύπτου — «выведший нас из земли Египетской» (ἀνάγω). ὁ καθοδηγήσας ἡμᾶς ἐν τῇ ἐρήμῳ — «водивший нас по пустыне» (καθοδηγέω). ἐν γῇ ἀπείρῳ καὶ ἀβάτῳ — «в земле необъятной и непроходимой» (ἄπειρος, ἄβατος); ἐν γῇ ἀνύδρῳ καὶ ἀκάρπῳ — «в земле безводной и бесплодной». У ru (МТ) есть ещё «по земле тени смертной» — этого нет ни в LXX, ни в csl, не внесено."
  7: "εἰσήγαγον ὑμᾶς εἰς τὸν Κάρμηλον — «Я ввёл вас в Кармил»: у LXX и csl («в землю кармил») это имя нарицательное — плодоносная земля, не гора; в тексте оставлено как имя, смысл ясен из «плоды его и благая его». φαγεῖν τοὺς καρποὺς αὐτοῦ — «есть плоды его». ἐμιάνετε τὴν γῆν μου — «осквернили землю Мою» (μιαίνω); τὴν κληρονομίαν μου ἔθεσθε εἰς βδέλυγμα — «достояние Моё поставили в мерзость» (κληρονομία — 嗣業; βδέλυγμα — мерзость)."
  8: "οἱ ἱερεῖς οὐκ εἶπαν Ποῦ ἐστιν κύριος — «священники не сказали: где Господь?». οἱ ἀντεχόμενοι τοῦ νόμου οὐκ ἠπίσταντό με — «держащиеся закона не знали Меня» (ἀντέχομαι — держаться; слав. «держащии закон»). οἱ ποιμένες ἠσέβουν εἰς ἐμέ — «пастыри нечествовали против Меня» (ἀσεβέω). οἱ προφῆται ἐπροφήτευον τῇ Βααλ — «пророки пророчествовали Ваалу» (дательный при προφητεύω). ὀπίσω ἀνωφελοῦς ἐπορεύθησαν — «пошли за бесполезным» (ἀνωφελής — не приносящий пользы)."
  9: "ἔτι κριθήσομαι πρὸς ὑμᾶς — «ещё буду судиться с вами» (κρίνω в значении «вести тяжбу»; слав. «судом претися имам»). καὶ πρὸς τοὺς υἱοὺς τῶν υἱῶν ὑμῶν κριθήσομαι — «и с сынами сынов ваших буду судиться»: повтор глагола и нарастание сохранены; в тексте «裁きの場で争う»."
  10: "διέλθετε εἰς νήσους Χεττιιμ — «пройдите на острова Хиттим» (Χεττιιμ — Киттим, キティム); καὶ εἰς Κηδαρ ἀποστείλατε — «в Кидар пошлите» (Кедар — аравийское племя, ケダル). νοήσατε σφόδρα — «уразумейте весьма» (νοέω — понимать). ἴδετε εἰ γέγονεν τοιαῦτα — «посмотрите, было ли подобное»."
  11: "εἰ ἀλλάξονται ἔθνη θεοὺς αὐτῶν — «переменит ли народ богов своих?» (ἀλλάσσω — менять); καὶ οὗτοι οὔκ εἰσιν θεοί — «хотя они и не боги». ὁ δὲ λαός μου ἠλλάξατο τὴν δόξαν αὐτοῦ — «но народ Мой променял славу свою» (δόξα — слава; слав. «славу свою»). ἐξ ἧς οὐκ ὠφεληθήσονται — «на то, от чего не получат пользы» (ὠφελέω)."
  12: "ἐξέστη ὁ οὐρανὸς ἐπὶ τούτῳ — «ужаснулось небо об этом» (ἐξίστημι — изумляться, ужасаться); ἔφριξεν ἐπὶ πλεῖον σφόδρα — «содрогнулось чрезвычайно» (φρίσσω — трепетать); слав. «ужасеся небо о сем и вострепета попремногу зело». Два глагола ужаса в гр. переданы двумя (驚き、おののけ); λέγει κύριος в конце, внутри речи."
  13: "δύο πονηρὰ ἐποίησεν ὁ λαός μου — «два зла сделал народ Мой». ἐμὲ ἐγκατέλιπον, πηγὴν ὕδατος ζωῆς — «Меня оставили, источник воды живой» (πηγή — источник; 泉). ὤρυξαν ἑαυτοῖς λάκκους συντετριμμένους — «выкопали себе водоёмы разбитые» (λάκκος — яма, цистерна; συντρίβω — разбивать); οἳ οὐ δυνήσονται ὕδωρ συνέχειν — «которые не могут держать воды» (συνέχω — удерживать)."
  14: "Μὴ δοῦλός ἐστιν Ισραηλ ἢ οἰκογενής ἐστιν — «разве Израиль раб или домочадец?» (οἰκογενής — рождённый в доме; слав. «домочадец»). διὰ τί εἰς προνομὴν ἐγένετο — «почему стал добычей?» (προνομή — добыча, разграбление). Вопросы без ответа, как в греч."
  15: "ἐπ᾿ αὐτὸν ὠρύοντο λέοντες — «на него рыкали львы» (ὀρύομαι — рычать); ἔδωκαν τὴν φωνὴν αὐτῶν — «подали голос свой». οἳ ἔταξαν τὴν γῆν αὐτοῦ εἰς ἔρημον — «которые обратили землю его в пустыню» (τάσσω — ставить, обращать). αἱ πόλεις αὐτοῦ κατεσκάφησαν παρὰ τὸ μὴ κατοικεῖσθαι — «города его сожжены (срыты) так, что в них не живут» (κατασκάπτω — срывать)."
  16: "υἱοὶ Μέμφεως καὶ Ταφνας — «сыны Мемфиса и Тафны» (египетские города; タフナヘス — по брифу и как в ier 26:14; в Юдифи 1:9 корпуса та же форма Ταφνας передана как タフナス — расхождение в корпусе, для книги держим タフナヘス). ἔγνωσάν σε — «познали тебя», т. е. узнали и увидели твою слабость; κατέπαιζόν σου — «издевались над тобой» (καταπαίζω). У ru (МТ) «объели темя твоё» — иное чтение, не внесено."
  17: "οὐχὶ ταῦτα ἐποίησέν σοι τὸ καταλιπεῖν σε ἐμέ — «не это ли сделало тебе то, что ты оставил Меня?»: подлежащее — инфинитив с артиклем (τὸ καταλιπεῖν). λέγει κύριος ὁ θεός σου — «говорит Господь Бог твой». У ru (МТ) добавлено «когда Он путеводил тебя» — нет в LXX."
  18: "καὶ νῦν τί σοι καὶ τῇ ὁδῷ Αἰγύπτου — «и ныне что тебе и пути Египетскому?», т. е. что тебе до Египта (оборот τί σοι καί). τοῦ πιεῖν ὕδωρ Γηων — «чтобы пить воду Гихона» (Γηων — Гихон, здесь Нил); в тексте ギホン. ὕδωρ ποταμῶν — «воду рек», т. е. ассирийских рек (Евфрат). Слав. «воду геонскую… воду речную»."
  19: "παιδεύσει σε ἡ ἀποστασία σου — «накажет тебя отступничество твоё» (ἀποστασία — отступничество; παιδεύω — наставлять, наказывать). ἡ κακία σου ἐλέγξει σε — «злоба твоя обличит тебя» (ἐλέγχω — обличать). πικρόν σοι τὸ καταλιπεῖν σε ἐμέ — «горько тебе оставить Меня» (πικρός — горький). καὶ οὐκ εὐδόκησα ἐπὶ σοί — «и Я не благоволил к тебе» (εὐδοκέω); у ru (МТ) «страха Моего нет в тебе» — иное чтение."
  20: "ἀπ᾽ αἰῶνος συνέτριψας τὸν ζυγόν σου — «издавна ты сокрушил ярмо своё» (ζυγός — 軛; συντρίβω). διέσπασας τοὺς δεσμούς σου — «расторг узы свои» (δεσμός). εἶπας Οὐ δουλεύσω — «сказал: не буду служить»: слова народа — вложенная цитата 『…』. ἐπὶ πᾶν βουνὸν ὑψηλὸν καὶ ὑποκάτω παντὸς ξύλου κατασκίου — «на всяком холме высоком и под всяким деревом тенистым» (κατάσκιος — тенистый). ἐκεῖ διαχυθήσομαι ἐν τῇ πορνείᾳ μου — «там разольюсь в блуде моём» (διαχέω — разливаться)."
  21: "ἐγὼ δὲ ἐφύτευσά σε ἄμπελον καρποφόρον πᾶσαν ἀληθινήν — «Я насадил тебя как лозу плодоносную, всю истинную» (ἄμπελος — лоза; καρποφόρος — плодоносный; ἀληθινός — истинный, подлинный). πῶς ἐστράφης εἰς πικρίαν — «как обратилась ты в горечь?» (πικρία — горечь). ἡ ἄμπελος ἡ ἀλλοτρία — «лоза чужая» (ἀλλότριος — чужой): обращение в конце, сохранено."
  22: "ἐὰν ἀποπλύνῃ ἐν νίτρῳ — «если омоешься щёлочью» (νίτρον — природная сода, щёлок; слав. «нитром»; в тексте 灰汁). πληθύνῃς σεαυτῇ πόαν — «умножишь себе травы» (ποία — трава; имеется в виду мылящее растение, слав. «травы борифовы»). κεκηλίδωσαι ἐν ταῖς ἀδικίαις σου — «ты запятнана беззакониями твоими» (κηλιδόω — пятнать). ἐναντίον ἐμοῦ — «предо Мною»."
  23: "πῶς ἐρεῖς Οὐκ ἐμίανθην — «как скажешь: я не осквернилась?»: слова народа — вложенная 『…』. ὀπίσω τῆς Βααλ οὐκ ἐπορεύθην — «за Ваалом не ходила». ἰδὲ τὰς ὁδούς σου ἐν τῷ πολυανδρίῳ — «посмотри на пути твои в долине [многогробии]» (πολυάνδριον — общее место погребения, здесь долина сынов Енномовых); в тексте 谷. ὀψὲ φωνὴ αὐτῆς ὠλόλυξεν — «вечером голос её завыл» (ὀψέ — поздно, вечером; ὀλολύζω — выть, вопить). Gr кончается словами τὰς ὁδοὺς αὐτῆς, которые в слав. отнесены к 2:24 («пути своя разшири»); в японском «道を» отдано 2:24, чтобы не оставлять стих с висящим дополнением, — смысл не сдвинут (см. 2:24)."
  24: "ἐπλάτυνεν ἐφ᾽ ὕδατα ἐρήμου — «расширила [путь] на воды пустыни» (πλατύνω — расширять): дополнение τὰς ὁδοὺς αὐτῆς стоит в конце gr 2:23, в японском перенесено сюда. ἐν ἐπιθυμίαις ψυχῆς αὐτῆς ἐπνευματοφορεῖτο — «в похотях души своей носилась по ветру» (πνευματοφορέω — носить ветром). παρεδόθη — «предана»; τίς ἐπιστρέψει αὐτήν — «кто обратит её?». ἐν τῇ ταπεινώσει αὐτῆς εὑρήσουσιν αὐτήν — «в уничижении её найдут её» (ταπείνωσις — уничижение, течка); у ru (МТ) «в её месяце» — иное чтение."
  25: "ἀπόστρεψον τὸν πόδα σου ἀπὸ ὁδοῦ τραχείας — «отврати ногу твою от пути жёсткого» (τραχύς — суровый, каменистый); τὸν φάρυγγά σου ἀπὸ δίψους — «гортань твою от жажды» (φάρυγξ — гортань; δίψος — жажда). ἡ δὲ εἶπεν Ἀνδριοῦμαι — «она сказала: возмужаю», т. е. соберусь с силами, буду как муж (ἀνδρίζομαι); слав. «возмужаюся» — по LXX. У ru (МТ) «не надейся, нет!» — иное чтение, не внесено. ὅτι ἠγαπήκει ἀλλοτρίους — «ибо возлюбила чужих»; ὀπίσω αὐτῶν ἐπορεύετο — «за ними ходила»."
  26: "ὡς αἰσχύνη κλέπτου ὅταν ἁλῷ — «как стыд вора, когда пойман» (ἁλίσκομαι — быть пойманным). οὕτως αἰσχυνθήσονται οἱ υἱοὶ Ισραηλ — «так постыдятся сыны Израилевы». Перечень: αὐτοὶ καὶ οἱ βασιλεῖς … ἄρχοντες … ἱερεῖς … προφῆται — «они, цари, князья, священники, пророки»: пять членов, как в греч., без глагола в конце."
  27: "τῷ ξύλῳ εἶπαν ὅτι Πατήρ μου εἶ σύ — «дереву сказали: ты мой отец»; τῷ λίθῳ Σὺ ἐγέννησάς με — «камню: ты родил меня»: две вложенные цитаты 『…』. ἔστρεψαν ἐπ᾽ ἐμὲ νῶτα καὶ οὐ πρόσωπα αὐτῶν — «обратили ко Мне спины, а не лица свои» (νῶτον — спина): противопоставление сохранено. ἐν τῷ καιρῷ τῶν κακῶν αὐτῶν ἐροῦσιν Ἀνάστα καὶ σῶσον ἡμᾶς — «во время бед их скажут: встань и спаси нас» — третья вложенная цитата."
  28: "ποῦ εἰσιν οἱ θεοί σου, οὓς ἐποίησας σεαυτῷ — «где боги твои, которых ты сделал себе?» εἰ ἀναστήσονται καὶ σώσουσίν σε — «пусть встанут и спасут тебя», если смогут (εἰ с будущим — условие-вызов). κατ᾽ ἀριθμὸν τῶν πόλεών σου ἦσαν θεοί σου, Ιουδα — «по числу городов твоих были боги твои, Иуда». κατ᾽ ἀριθμὸν διόδων τῆς Ιερουσαλημ ἔθυον τῇ Βααλ — «по числу проходов Иерусалима приносили жертвы Ваалу» (δίοδος — проход, улица; слав. «путий»)."
  29: "ἵνα τί λαλεῖτε πρός με — «зачем вы говорите ко Мне?», т. е. препираетесь. πάντες ὑμεῖς ἠσεβήσατε — «все вы нечествовали» (ἀσεβέω); πάντες ὑμεῖς ἠνομήσατε εἰς ἐμέ — «все вы беззаконновали против Меня» (ἀνομέω). Двойной повтор «все вы» сохранён."
  30: "μάτην ἐπάταξα τὰ τέκνα ὑμῶν — «напрасно Я поражал детей ваших» (μάτην — напрасно; πατάσσω — поражать). παιδείαν οὐκ ἐδέξασθε — «наставления не приняли» (παιδεία — наказание, вразумление). μάχαιρα κατέφαγεν τοὺς προφήτας ὑμῶν ὡς λέων ὀλεθρεύων — «меч пожрал пророков ваших, как лев истребляющий» (ὀλεθρεύω — губить). οὐκ ἐφοβήθητε — «и не убоялись». Здесь закрывается слово Господа 2:5–30."
  31: "ἀκούσατε λόγον κυρίου — призыв вне кавычек, как в 2:4. Μὴ ἔρημος ἐγενόμην τῷ Ισραηλ ἢ γῆ κεχερσωμένη — «разве Я был для Израиля пустыней или землёй бесплодной?» (χερσόω — делать бесплодным, сухим). διὰ τί εἶπεν ὁ λαός μου Οὐ κυριευθησόμεθα καὶ οὐχ ἥξομεν πρὸς σὲ ἔτι — «зачем народ Мой сказал: мы не будем под властью и не придём к Тебе более?» (κυριεύω — господствовать): слова народа — вложенная 『…』."
  32: "μὴ ἐπιλήσεται νύμφη τὸν κόσμον αὐτῆς — «забудет ли невеста убор свой?» (ἐπιλανθάνομαι — забывать; κόσμος — украшение, убор; νύμφη — невеста, 花嫁). παρθένος τὴν στηθοδεσμίδα αὐτῆς — «дева повязку груди свою» (στηθοδεσμίς — нагрудная повязка; слав. «мониста персий своих»). ὁ δὲ λαός μου ἐπελάθετό μου ἡμέρας, ὧν οὐκ ἔστιν ἀριθμός — «но народ Мой забыл Меня на дни, которым нет числа»."
  33: "τί ἔτι καλὸν ἐπιτηδεύσεις ἐν ταῖς ὁδοῖς σου τοῦ ζητῆσαι ἀγάπησιν — «что ещё доброго ухитришься [сделать] на путях твоих, чтобы найти любовь?» (ἐπιτηδεύω — ухищряться, устраивать). οὐχ οὕτως, ἀλλὰ καὶ σὺ ἐπονηρεύσω — «не так, но и ты лукавствовала» (πονηρεύομαι). τοῦ μιᾶναι τὰς ὁδούς σου — «чтобы осквернить пути твои»."
  34: "ἐν ταῖς χερσίν σου εὑρέθησαν αἵματα ψυχῶν ἀθῴων — «в руках твоих найдена кровь душ неповинных» (ἀθῷος — невинный; слав. «кровь душ (убогих) неповинных»). οὐκ ἐν διορύγμασιν εὗρον αὐτούς — «не при взломе Я нашёл их» (διόρυγμα — подкоп, взлом): LXX ясен, слав. читает «не в ровех» (ямах) — иное понимание, поэтому в тексте по LXX, слав. отмечено. ἀλλ᾽ ἐπὶ πάσῃ δρυί — «но при всяком дубе» (δρῦς — дуб; места идольских капищ)."
  35: "καὶ εἶπας Ἀθῷός εἰμι — «и ты сказала: я невинна» (ἀθῷος); ἀλλὰ ἀποστραφήτω ὁ θυμὸς αὐτοῦ ἀπ᾽ ἐμοῦ — «но да отвратится гнев Его от меня»: слова народа — вложенная 『…』, внутри неё ещё одна. ἰδοὺ ἐγὼ κρίνομαι πρὸς σὲ — «вот, Я сужусь с тобой» (κρίνω — вести тяжбу). ἐν τῷ λέγειν σε Οὐχ ἥμαρτον — «за то, что ты говоришь: я не согрешила»: вторая вложенная цитата."
  36: "τί κατεφρόνησας σφόδρα τοῦ δευτερῶσαι τὰς ὁδούς σου — «зачем ты сильно пренебрегла, чтобы повторять пути твои?» (καταφρονέω — презирать, пренебрегать; δευτερόω — повторять, удваивать). ἀπὸ Αἰγύπτου καταισχυνθήσῃ — «от Египта постыдишься»; καθὼς κατῃσχύνθης ἀπὸ Ασσουρ — «как постыдилась от Ассура». Слав. «понеже презрела еси зело»."
  37: "ὅτι καὶ ἐντεῦθεν ἐξελεύσῃ — «ибо и оттуда выйдешь» (ἐντεῦθεν — отсюда, оттуда). αἱ χεῖρές σου ἐπὶ τῆς κεφαλῆς σου — «руки твои на голове твоей»: жест пленника и плача. ἀπώσατο κύριος τὴν ἐλπίδα σου — «отверг Господь надежду твою» (ἀπωθέω — отталкивать, отвергать). οὐκ εὐοδωθήσῃ ἐν αὐτῇ — «не будешь иметь успеха в ней» (εὐοδόω — давать успех). Кавычки закрываются, глава кончается."
