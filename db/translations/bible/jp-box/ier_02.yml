# jp-box, Иеремия, глава 2. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc по Иеремии — только фрагменты (гл. 11, 12, 31); в гл. 2 его нет.
# jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 2: 1 поручение пророку («иди и возгласи в уши Иерусалима»); 2–3 первая любовь
# юности и святость Израиля Господу; 4 призыв слушать; 5–13 обличение: отцы, священники,
# учители закона, пастыри, пророки; два зла — оставленный источник и выкопанные водоёмы;
# 14–19 рабство, львы, Мемфис и Тафна, путь в Египет и Ассирию, горечь отступничества;
# 20–28 ярмо, благородная лоза, мытьё, долина, дикая ослица, дерево и камень;
# 29–30 напрасные удары и убитые пророки; 31–37 «о, род», забывчивость, кровь невинных,
# запирательство и посрамление.
# Голоса: 2:1 вводная формула вне кавычек, поручение — 「…」 с вложенным 『…』; 2:2–3
# 「…」 (слово Господа, закрывается в конце 2:3); 2:4 призыв вне кавычек; 2:5–30 одна
# цитата (слова Господа; внутри вложенные 『…』 — слова народа в 2:6, 2:20, 2:23, 2:25,
# 2:27, 2:35); 2:31 призыв вне кавычек, затем 2:31–37 одна цитата.
# Нумерация по gr: 37 стихов, совпадает с csl и ru. В модуле gr 2:1 — «точка» (лакуна):
# стих переведён по слав. 2:1 без 〔…〕; слав. формула «сия глаголет Господь» в конце
# 2:1 соответствует греч. καὶ εἶπεν Τάδε λέγει κύριος в начале gr 2:2, поэтому в 2:2
# она не повторена (см. notes к 2:1–2). Gr 2:23 оканчивается словами τὰς ὁδοὺς αὐτῆς —
# дополнением к глаголу ἐπλάτυνεν из 2:24; «道を» отдано 2:24 (см. notes к 2:23–24).
# 〔…〕 нет. Сносок ⟨…⟩ нет: 灰汁, 水槽, 軛, 淫行, カルメル, キティム, ケダル,
# メンフィス, タフナヘス, ギホン, バアル уже в корпусе или пояснены в notes.

