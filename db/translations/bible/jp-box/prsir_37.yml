verses:
  1: "どんな友[とも]も「わたしもまた友[とも]となった」と言[い]う。しかし、名[な]だけの友もいる。"
  2: "仲間[なかま]や友[とも]が敵意[てきい]に変[か]わるとき、それは死[し]に至[いた]るまで悲[かな]しみではないだろうか。"
  3: "ああ、悪[わる]い思[おも]いよ、どこから転[ころ]がり込[こ]んで来[き]て、乾[かわ]いた地[ち]を偽[いつわ]りで覆[おお]うのか。"
  4: "友[とも]の仲間[なかま]は喜[よろこ]びのときには共[とも]に楽[たの]しむが、苦[くる]しみのときには敵[てき]に回[まわ]る。"
  5: "仲間[なかま]は腹[はら]のために友[とも]と苦[くる]しみを共[とも]にし、戦[いくさ]の前[まえ]には盾[たて]を取[と]る。"
  6: "友[とも]を心[こころ]から忘[わす]れてはならない。財産[ざいさん]のうちにあっても、その友を忘れてはならない。"
  7: "どんな助言者[じょげんしゃ]も自分[じぶん]の助言[じょげん]を持[も]ち上[あ]げる。しかし、自分[じぶん]のために助言する者[もの]もいる。"
  8: "助言者[じょげんしゃ]から自分[じぶん]の魂[たましい]を守[まも]り、まずその者[もの]に何[なに]が必[ひつ]要[よう]かを知[し]れ。その者もまた、自分自身[じぶんじしん]のために助言するからである。あなたの上[うえ]にくじを投[な]げることがないように。"
  9: "そして、あなたに「あなたの道[みち]は良[よ]い」と言[い]いながら、向[む]こう側[がわ]に立[た]って、あなたに起[お]こることを見[み]ようとする。"
  10: "あなたを疑[うたが]いの目[め]で見[み]る者[もの]と相談[そうだん]してはならない。あなたを嫉[ねた]む者[もの]たちから、あなたの計画[けいかく]を隠[かく]せ。"
  11: "妻[つま]とその妬[ねた]み合[あ]う相手[あいて]について、臆病[おくびょう]な者[もの]と戦[いくさ]について、商人[しょうにん]と交換[こうかん]について、買[か]う者[もの]と売[う]ることについて、妬[ねた]み深[ぶか]い者[もの]と感謝[かんしゃ]について、あわれみのない者と親切[しんせつ]について、怠[なま]け者とあらゆる仕事[しごと]について、年[とし]ぎめの雇[やと]い人[ひと]と仕上[しあ]げについて、怠[なま]ける奴隷[どれい]と多[おお]くの仕事について相談してはならない。これらの者[もの]たちに、どんな助言[じょげん]についても頼[たよ]ってはならない。"
  12: "ただ、敬虔[けいけん]な人[ひと]とだけは常[つね]に語[かた]り合[あ]いなさい。戒[いまし]めを守[まも]っているとあなたが知[し]っている人[ひと]、その心[こころ]があなたの心と同[おな]じである人[ひと]と。あなたがつまずいても、その人[ひと]はあなたと共[とも]に苦[くる]しむ。"
  13: "あなたの心[こころ]の計画[けいかく]を固[かた]く定[さだ]めよ。心ほどあなたに信[しん]頼[らい]できるものはないからである。"
  14: "人[ひと]の魂[たましい]は、高[たか]い所[ところ]の見張[みは]りに座[すわ]る七人[しちにん]の番人[ばんにん]よりも、多[おお]くのことを告[つ]げるのが常[つね]である。"
  15: "そのうえで、何[なに]よりもいと高[たか]き者[もの]に祈[いの]りなさい。あなたの道[みち]を真理[しんり]のうちに導[みちび]いてくださるように。"
  16: "どんな仕事[しごと]の始[はじ]めも言葉[ことば]であり、どんな行[おこな]いの前[まえ]にも計画[けいかく]がある。"
  17: "顔[かお]は心[こころ]の変[か]わりの跡[あと]であり、四[よっ]つの部分[ぶぶん]が現[あらわ]れる。"
  18: "善[ぜん]と悪[あく]、生[いのち]と死[し]。そのどれをも常[つね]に支配[しはい]しているのは舌[した]である。"
  19: "多[おお]くの者[もの]の教師[きょうし]でありながら、自分[じぶん]の魂[たましい]には役[やく]に立[た]たない狡猾[こうかつ]な者[もの]がいる。"
  20: "言葉[ことば]のうちに知[ち]恵[え]をひけらかして憎[にく]まれる者[もの]がいる。その者[もの]はどんな食物[しょくもつ]にもありつけない。"
  21: "主[しゅ]から彼[かれ]に恵[めぐ]みが与[あた]えられなかったからである。彼はすべての知恵[ちえ]を奪[うば]われている。"
  22: "自分[じぶん]の魂[たましい]のために知恵[ちえ]ある者[もの]がいる。その悟[さと]りの実[み]は、その口[くち]において確[たし]かである。"
  23: "知恵[ちえ]ある人[ひと]は自分[じぶん]の民[たみ]を教[おし]え、その悟[さと]りの実[み]は確[たし]かである。"
  24: "知恵[ちえ]ある人[ひと]は祝福[しゅくふく]に満[み]ち、彼を見[み]る者[もの]はみな、彼を幸[さいわ]いな者[もの]と呼[よ]ぶ。"
  25: "人[ひと]の生[いのち]は日[ひ]の数[かず]のうちにある。しかし、イスラエルの日々[ひび]は数[かぞ]えきれない。"
  26: "知恵[ちえ]ある者[もの]は自分[じぶん]の民[たみ]のうちで信頼[しんらい]を嗣業[しぎょう]として受[う]け、その名[な]は永遠[えいえん]に生[い]きる。"
  27: "子[こ]よ、生[い]きている間[あいだ]に自分[じぶん]の魂[たましい]を試[ため]し、何[なに]がそれに悪[わる]いかを見[み]て、それに与[あた]えてはならない。"
  28: "すべてのものがすべての人[ひと]に益[やく]するのではない。どんな魂[たましい]も、すべてのことを喜[よろこ]ぶのではない。"
  29: "どんなごちそうにも飽[あ]き足[た]りてはならない。食物[しょくもつ]に溺[おぼ]れてはならない。"
  30: "多[おお]くの食物[しょくもつ]のうちには病[やまい]があり、飽[あ]き足[た]りなさは激[はげ]しい下痢[げり]にまで及[およ]ぶからである。"
  31: "飽[あ]き足[た]りなさのゆえに多[おお]くの者[もの]が死[し]んだ。しかし、注意[ちゅうい]する者[もの]は生[いのち]を増[ま]す。"

notes:
  1: "Πᾶς φίλος ἐρεῖ Ἐφιλίασα κἀγώ — «всякий друг скажет: я подружился и я» (φιλιάζω — быть другом, дружить); слав. «всяк друг речет: содружихся ему и аз». ἀλλ᾿ ἔστιν φίλος ὀνόματι μόνον φίλος — «но есть друг только по имени друг» (ὄνομα — имя); слав. «но есть друг именем точию друг». Слова друга — 「…」."
  2: "οὐχὶ λύπη ἔνι ἕως θανάτου — «не печаль ли до смерти» (λύπη — печаль; ἔνι = ἔνεστι, есть внутри); слав. «печаль не пребывает ли до смерти». ἑταῖρος καὶ φίλος τρεπόμενος εἰς ἔχθραν — «товарищ и друг, обращающийся во вражду» (ἑταῖρος — товарищ; τρέπω — обращать; ἔχθρα — вражда); слав. «приятель и друг претворяяйся во врага»."
  3: "ὦ πονηρὸν ἐνθύμημα — «о злая мысль» (ἐνθύμημα — помышление, замысел); слав. «о, лукаво помышление». πόθεν ἐνεκυλίσθης — «откуда ты вкатилась» (κυλίω — катить); слав. «откуду извалилося еси». καλύψαι τὴν ξηρὰν ἐν δολιότητι — «покрыть сушу лукавством» (ξηρά — суша; δολιότης — коварство); слав. «покрыти сушу лестию»."
  4: "ἑταῖρος φίλου ἐν εὐφροσύνῃ ἥδεται — «товарищ друга в радости наслаждается» (εὐφροσύνη — веселие; ἥδομαι — наслаждаться); слав. «приятель о веселии дружни срадуется». ἐν καιρῷ θλίψεως ἔσται ἀπέναντι — «во время скорби будет напротив (против)» (θλῖψις — скорбь; ἀπέναντι — напротив); слав. «во время скорби противен будет»."
  5: "ἑταῖρος φίλῳ συμπονεῖ χάριν γαστρός — «товарищ другу сострадает (трудится вместе) ради чрева» (συμπονέω — сострадать, трудиться вместе; γαστήρ — чрево); слав. «приятель со другом труждается чрева ради». ἔναντι πολέμου λήμψεται ἀσπίδα — «пред войной возьмёт щит» (πόλεμος — война; ἀσπίς — щит); слав. «противу брани возмет щит»."
  6: "μὴ ἐπιλάθῃ φίλου ἐν τῇ ψυχῇ σου — «не забудь друга в душе твоей» (ἐπιλανθάνομαι — забывать); слав. «не забуди друга в души твоей». μὴ ἀμνημονήσῃς αὐτοῦ ἐν χρήμασίν σου — «не забывай его в имении твоём» (χρῆμα — имущество, деньги); слав. «не поминай его во имении твоем» передаёт иначе."
  7: "Πᾶς σύμβουλος ἐξαίρει βουλήν — «всякий советник возвышает совет» (σύμβουλος — советник; ἐξαίρω — выдвигать, возвышать); слав. «всяк советник возносит совет». ἀλλ᾿ ἔστιν συμβουλεύων εἰς ἑαυτόν — «но есть советующий для себя самого» (συμβουλεύω — советовать); слав. «но есть совещаяй о себе самем»."
  8: "ἀπὸ συμβούλου φύλαξον τὴν ψυχήν σου — «от советника сохрани душу твою» (φυλάσσω — хранить); слав. «от советника храни душу твою». γνῶθι πρότερον τίς αὐτοῦ χρεία — «узнай прежде, какова в нём нужда» (χρεία — нужда, потребность); καὶ γὰρ αὐτὸς ἑαυτῷ βουλεύσεται — «ибо и он сам себе советует»; μήποτε βάλῃ ἐπὶ σοὶ κλῆρον — «как бы не бросил на тебя жребий» (κλῆρος — жребий). Слав. относит конец к ст. 9."
  9: "καὶ εἴπῃ σοι Καλὴ ἡ ὁδός σου — «и скажет тебе: хорош путь твой» (καλός — хороший); слав. «и речет ти: добр путь твой». στήσεται ἐξ ἀναντίας ἰδεῖν τὸ συμβησόμενόν σοι — «станет напротив, чтобы увидеть, что случится с тобой» (ἀναντία — противоположная сторона; συμβαίνω — случаться); слав. «и станет прямо, видети, что сбудется тебе». Слова советника — 「…」."
  10: "μὴ βουλεύου μετὰ τοῦ ὑποβλεπομένου σε — «не советуйся с подозрительно смотрящим на тебя» (ὑποβλέπομαι — смотреть искоса, подозревать); слав. «не совещавай с подзирающим тя». ἀπὸ τῶν ζηλούντων σε κρύψον βουλήν — «от завидующих тебе скрой совет» (ζηλόω — завидовать; κρύπτω — скрывать); слав. «от завидящих ти скрый совет»."
  11: "μετὰ γυναικὸς περὶ τῆς ἀντιζήλου αὐτῆς — «с женой о сопернице её» (ἀντίζηλος — соперница); μετὰ δειλοῦ περὶ πολέμου — «с трусливым о войне» (δειλός — робкий); μετὰ ἐμπόρου περὶ μεταβολίας — «с купцом о мене» (ἔμπορος — купец; μεταβολή — обмен, мена); μετὰ ἀγοράζοντος περὶ πράσεως — «с покупающим о продаже» (πρᾶσις); μετὰ βασκάνου περὶ εὐχαριστίας — «с завистником о благодарности» (βάσκανος — завистник); μετὰ ἀνελεήμονος περὶ χρηστοηθείας — «с немилосердным о добронравии» (χρηστοήθεια — добрый нрав); μετὰ ὀκνηροῦ περὶ παντὸς ἔργου — «с ленивым о всяком деле» (ὀκνηρός — ленивый); μετὰ μισθίου ἐφετίου περὶ συντελείας — «с наёмником годовым о завершении» (μίσθιος — наёмник; ἐφέτιος — годовой); οἰκέτῃ ἀργῷ περὶ πολλῆς ἐργασίας — «с рабом праздным о многой работе» (οἰκέτης — раб, домочадец; ἀργός — праздный); μὴ ἔπεχε ἐπὶ τούτοις περὶ πάσης συμβουλίας — «не полагайся на них в любом совете» (ἐπέχω — держаться, полагаться). Слав. делит этот стих на ст. 10–14."
  12: "ἀλλ᾿ ἢ μετὰ ἀνδρὸς εὐσεβοῦς ἐνδελέχιζε — «но с мужем благочестивым постоянно [беседуй]» (εὐσεβής — благочестивый; ἐνδελεχίζω — постоянно делать); слав. «но токмо с мужем благоговейным присно буди». ὃν ἂν ἐπιγνῷς συντηροῦντα ἐντολάς — «которого узнаешь соблюдающим заповеди» (συντηρέω — соблюдать; ἐντολή — заповедь); ὃς ἐν τῇ ψυχῇ αὐτοῦ κατὰ τὴν ψυχήν σου — «кто в душе своей — как душа твоя»; ἐὰν πταίσῃς, συναλγήσει σοι — «если споткнёшься, будет сострадать тебе» (πταίω — спотыкаться; συναλγέω — сострадать)."
  13: "καὶ βουλὴν καρδίας στῆσον — «и совет сердца поставь (утверди)» (βουλή — совет, решение; ἵστημι — ставить); слав. «и совет сердца устави». οὐ γὰρ ἔστιν σοι πιστότερος αὐτῆς — «ибо нет тебе вернее его» (πιστός — верный); слав. «несть бо ти вернее его»."
  14: "ψυχὴ γὰρ ἀνδρὸς ... εἴωθεν — «душа человека ... обыкновенно [возвещает]» (εἴωθα — иметь обыкновение). ἀπαγγέλλειν ἐνίοτε ... ἢ ἑπτὰ σκοποὶ ἐπὶ μετεώρου καθήμενοι ἐπὶ σκοπῆς — «возвещать иногда более, чем семь стражей, сидящих на высоте на страже» (σκοπός — страж; μετέωρος — высокий, поднятый; σκοπιά — стража); слав. «паче седми блюстителие высоце седящии на стражи»."
  15: "καὶ ἐπὶ πᾶσι τούτοις δεήθητι ὑψίστου — «и при всём этом помолись Всевышнему» (δέομαι — молить; ὕψιστος — Всевышний); слав. «и о всех сих помолися вышнему». ἵνα εὐθύνῃ ἐν ἀληθείᾳ τὴν ὁδόν σου — «чтобы Он направил в истине путь твой» (εὐθύνω — выпрямлять, направлять; ἀλήθεια — истина); слав. «да управит во истине путь твой»."
  16: "Ἀρχὴ παντὸς ἔργου λόγος — «начало всякого дела — слово» (ἀρχή — начало; λόγος — слово); слав. «начаток всякаго дела слово». πρὸ πάσης πράξεως βουλή — «прежде всякого действия — совет» (πρᾶξις — действие, дело); слав. «прежде всякаго делания совет»."
  17: "ἴχνος ἀλλοιώσεως καρδίας — «след изменения сердца» (ἴχνος — след; ἀλλοίωσις — изменение); слав. «след изменения сердечна лице»: слово «лице» (πρόσωπον) в LXX отсутствует, но внесено в основной текст по паритету, как и в слав./ru. τέσσαρα μέρη ἀνατέλλει — «четыре части восходят» (μέρος — часть; ἀνατέλλω — восходить, произрастать); слав. «четыри части происходят»."
  18: "ἀγαθὸν καὶ κακόν, ζωὴ καὶ θάνατος — «добро и зло, жизнь и смерть»; слав. «добро и зло, живот и смерть». ἡ κυριεύουσα ἐνδελεχῶς αὐτῶν γλῶσσά ἐστιν — «властвующая постоянно над ними — язык» (κυριεύω — господствовать; ἐνδελεχῶς — постоянно; γλῶσσα — язык); слав. «обладаяй ими всегда язык есть»."
  19: "ἔστιν ἀνὴρ πανοῦργος πολλῶν παιδευτής — «есть муж хитрый, многих учитель» (πανοῦργος — хитрый, ловкий; παιδευτής — наставник); слав. «есть муж хитр и наказатель многим». τῇ ἰδίᾳ ψυχῇ ἐστιν ἄχρηστος — «для своей души бесполезен» (ἄχρηστος — негодный); слав. «а своей души неключимь есть»."
  20: "ἔστιν σοφιζόμενος ἐν λόγοις μισητός — «есть умствующий в словах, ненавистный» (σοφίζομαι — мудрствовать, хитрить; μισητός — ненавистный); слав. «есть умудряяйся в словесех ненавидимь». οὗτος πάσης τροφῆς καθυστερήσει — «он всякой пищи лишится» (τροφή — пища; καθυστερέω — отставать, лишаться); слав. «сей всякия пищи лишен будет»."
  21: "οὐ γὰρ ἐδόθη αὐτῷ παρὰ κυρίου χάρις — «ибо не дана ему от Господа благодать» (χάρις — благодать, дар); слав. «не дана бо бысть ему от Господа благодать». ὅτι πάσης σοφίας ἐστερήθη — «потому что он лишён всякой премудрости» (στερέω — лишать); слав. «яко всякия премудрости лишен бысть»."
  22: "ἔστιν σοφὸς τῇ ἰδίᾳ ψυχῇ — «есть мудрый для своей души»; слав. «есть премудр своей души». οἱ καρποὶ τῆς συνέσεως αὐτοῦ ἐπὶ στόματος πιστοί — «плоды разумения его на устах верны» (καρπός — плод; σύνεσις — разумение; πιστός — верный); слав. «плоды разума его во устех верны»."
  23: "ἀνὴρ σοφὸς τὸν ἑαυτοῦ λαὸν παιδεύσει — «муж мудрый свой народ научит» (παιδεύω — учить, наставлять); слав. «муж премудр люди своя накажет». οἱ καρποὶ τῆς συνέσεως αὐτοῦ πιστοί — «плоды разумения его верны»; слав. «плоды разума его верны»."
  24: "ἀνὴρ σοφὸς πλησθήσεται εὐλογίας — «муж мудрый исполнится благословения» (πίμπλημι — наполнять; εὐλογία — благословение); слав. «муж премудр исполнится благословения». μακαριοῦσιν αὐτὸν πάντες οἱ ὁρῶντες — «ублажат его все видящие» (μακαρίζω — ублажать; ὁράω — видеть); слав. «ублажат его вси зрящии»."
  25: "ζωὴ ἀνδρὸς ἐν ἀριθμῷ ἡμερῶν — «жизнь человека — в числе дней» (ἀριθμός — число); слав. «живот мужа в числе дний». αἱ ἡμέραι τοῦ Ισραηλ ἀναρίθμητοι — «дни Израиля неисчислимы» (ἀναρίθμητος — неисчислимый); слав. «а дние израилевы безчисленни»."
  26: "ὁ σοφὸς ἐν τῷ λαῷ αὐτοῦ κληρονομήσει πίστιν — «мудрый в народе своём наследует веру (доверие)» (κληρονομέω — наследовать; πίστις — вера, верность, доверие); слав. «премудрый во своих людех наследит веру». τὸ ὄνομα αὐτοῦ ζήσεται εἰς τὸν αἰῶνα — «имя его будет жить вовеки»; слав. «имя его живо будет во век»."
  27: "Τέκνον, ἐν ζωῇ σου πείρασον τὴν ψυχήν σου — «сын, в жизни твоей испытай душу твою» (πειράζω — испытывать); слав. «чадо, в животе твоем искуси душу твою». ἰδὲ τί πονηρὸν αὐτῇ — «увидь, что для неё зло» (πονηρός — злой); καὶ μὴ δῷς αὐτῇ — «и не давай ей» (δίδωμι — давать)."
  28: "οὐ γὰρ πάντα πᾶσιν συμφέρει — «ибо не всё всем полезно» (συμφέρω — быть полезным); слав. «ибо не вся всем на пользу». οὐ πᾶσα ψυχὴ ἐν παντὶ εὐδοκεῖ — «не всякая душа во всём благоволит» (εὐδοκέω — благоволить, находить удовольствие); слав. «не всяка душа во всем благоволит»."
  29: "μὴ ἀπληστεύου ἐν πάσῃ τρυφῇ — «не пресыщайся всякой роскошью» (ἀπληστεύω — быть ненасытным; τρυφή — роскошь, наслаждение); слав. «не пресыщайся во всяцей сладости». μὴ ἐκχυθῇς ἐπὶ ἐδεσμάτων — «не разливайся на яства» (ἐκχέω — изливать; ἔδεσμα — яство); слав. «не разливайся на брашна»."
  30: "ἐν πολλοῖς βρώμασιν ἔσται νόσος — «при многих яствах будет болезнь» (νόσος — болезнь); слав. «во мнозех брашнах недуг будет». ἡ ἀπληστία ἐγγιεῖ ἕως χολέρας — «ненасытность приблизит до холеры» (ἀπληστία — ненасытность; χολέρα — холера, в LXX тяжёлый понос, желчная болезнь); слав. «пресыщение приближит даже до холеры»."
  31: "δι᾿ ἀπληστίαν πολλοὶ ἐτελεύτησαν — «из-за ненасытности многие умерли» (τελευτάω — умирать); слав. «пресыщением бо мнози умроша». ὁ δὲ προσέχων προσθήσει ζωήν — «а внимающий приложит жизнь» (προσέχω — внимать; προστίθημι — прибавлять); слав. «внимаяй же приложит житие»."
