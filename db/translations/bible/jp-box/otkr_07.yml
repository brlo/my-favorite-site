chapter: 7
draft: true

verses:
  1: "その後[のち]、わたしは、地[ち]の四[よっ]つの隅[すみ]に立[た]つ四人[よにん]の天使[てんし]を見[み]た。彼[かれ]らは地[ち]の四[よっ]つの風[かぜ]を押[お]さえて、地[ち]にも海[うみ]にも、どの木[き]にも風[かぜ]が吹[ふ]かないようにしていた。"
  2: "また、日[ひ]の出[で]る方[かた]から上[のぼ]って来[く]る、生[い]ける神[かみ]の印[しるし]を持[も]つ別[べつ]の天使[てんし]を見[み]た。彼[かれ]は、地[ち]と海[うみ]を害[がい]する権[けん]を与[あた]えられた四人[よにん]の天使[てんし]たちに、大[おお]きな声[こえ]で叫[さけ]んだ。"
  3: "「わたしたちが、わたしたちの神[かみ]の僕[しもべ]たちの額[ひたい]に印[しるし]を押[お]すまで、地[ち]も海[うみ]も木[き]も害[がい]してはならない。」"
  4: "わたしは、印[しるし]を押[お]された者[もの]たちの数[かず]を聞[き]いた。十四万四千[じゅうよんまんよんせん]人[にん]である。イスラエルの子[こ]らすべての部族[ぶぞく]から、印[しるし]を押[お]された者[もの]たちがいた。"
  5: "ユダ族[ぞく]から一万二千[いちまんにせん]人[にん]、ルベン族[ぞく]から一万二千[いちまんにせん]人[にん]、ガド族[ぞく]から一万二千[いちまんにせん]人[にん]が、印[しるし]を押[お]された。"
  6: "アシル族[ぞく]から一万二千[いちまんにせん]人[にん]、ナフタリ族[ぞく]から一万二千[いちまんにせん]人[にん]、マナセ族[ぞく]から一万二千[いちまんにせん]人[にん]。"
  7: "シメオン族[ぞく]から一万二千[いちまんにせん]人[にん]、レビ族[ぞく]から一万二千[いちまんにせん]人[にん]、イッサカル族[ぞく]から一万二千[いちまんにせん]人[にん]。"
  8: "ゼブルン族[ぞく]から一万二千[いちまんにせん]人[にん]、ヨセフ族[ぞく]から一万二千[いちまんにせん]人[にん]、ベニヤミン族[ぞく]から一万二千[いちまんにせん]人[にん]が、印[しるし]を押[お]された。"
  9: "その後[のち]、わたしが見[み]ると、だれも数[かぞ]えることのできない大[おお]きな群[む]れが、あらゆる国民[こくみん]、部族[ぶぞく]、民[たみ]、言葉[ことば]の中[なか]から出[で]て、御座[みくら]の前[まえ]と小羊[こひつじ]の前[まえ]に立[た]っていた。彼[かれ]らは白[しろ]い衣[ころも]を着[き]、手[て]に棕櫚[しゅろ]の枝[えだ]⟨ヤシの一種[いっしゅ]で、祭[まつ]りに葉[は]を用[もち]いる。⟩を持[も]っていた。"
  10: "彼[かれ]らは大[おお]きな声[こえ]で叫[さけ]んで言[い]う。「救[すく]いは、御座[みくら]に座[すわ]っておられるわたしたちの神[かみ]と、小羊[こひつじ]とによる。」"
  11: "すべての天使[てんし]たちは、御座[みくら]と長老[ちょうろう]たちと四[よっ]つの生[い]き物[もの]の周[まわ]りに立[た]っていた。彼[かれ]らは御座[みくら]の前[まえ]に顔[かお]を地[じ]につけてひれ伏[ふ]し、神[かみ]を拝[はい]して、"
  12: "言[い]った。「アーメン。賛美[さんび]と栄光[えいこう]と知恵[ちえ]と感謝[かんしゃ]と尊[そん]敬[けい]と力[ちから]と強[つよ]さとが、わたしたちの神[かみ]に世々[よよ]限[かぎ]りなくあるように。アーメン。」"
  13: "すると、長老[ちょうろう]の一人[ひとり]がわたしに答[こた]えて言[い]った。「白[しろ]い衣[ころも]を着[き]ているこの人[ひと]たちは、だれか。どこから来[き]たのか。」"
  14: "わたしは言[い]った。「わたしの主[しゅ]よ、あなたがご存[ぞん]じです。」すると、彼[かれ]がわたしに言[い]った。「この人[ひと]たちは、大[おお]きな患難[かんなん]から出[で]て来[き]た者[もの]たちである。彼[かれ]らは自分[じぶん]の衣[ころも]を小羊[こひつじ]の血[ち]で洗[あら]い、白[しろ]くした。"
  15: "だから、彼[かれ]らは神[かみ]の御座[みくら]の前[まえ]にいる。彼[かれ]らは昼[ひる]も夜[よる]も、神[かみ]の神殿[しんでん]で神[かみ]に仕[つか]える者[もの]である。そして、御座[みくら]におられる方[かた]が、彼[かれ]らの上[うえ]に幕屋[まくや]を張[は]ってくださる。"
  16: "彼[かれ]らはもう飢[う]えることも、渇[かわ]くこともない。太陽[たいよう]も、どんな暑[あつ]さも、彼[かれ]らの上[うえ]に降[ふ]りかかることはない。"
  17: "御座[みくら]の真[ま]ん中[なか]におられる小羊[こひつじ]が羊飼[ひつじかい]となって彼[かれ]らを養[やしな]い、命[いのち]の水[みず]の泉[いずみ]へと導[みちび]いてくださる。そして、神[かみ]は彼[かれ]らの目[め]からすべての涙[なみだ]を拭[ふ]い取[と]ってくださる。」"

notes:
  1: "γωνίαι τῆς γῆς — 地の隅. κρατοῦντες τοὺς τέσσαρας ἀνέμους — 四つの風を押さえて. ἵνα μὴ πνέῃ — 吹かないように."
  2: "ἀνατολὴ ἡλίου — 日の出る方. σφραγὶς θεοῦ ζῶντος — 生ける神の印. οἷς ἐδόθη ἀδικῆσαι — 害する権を与えられた."
  3: "μέτωπον — 額. ἄχρι σφραγίσωμεν — 印を押すまで. Слова ангела — «…», не красные."
  4: "ἑκατὸν τεσσαράκοντα τέσσαρες χιλιάδες — 十四万四千人. ἐκ πάσης φυλῆς υἱῶν Ἰσραήλ — イスラエルの子らすべての部族から."
  5: "Порядок колен — как в базе: Иуда первым, Дана нет. δώδεκα χιλιάδες — 一万二千人."
  6: "Ἀσήρ, Νεφθαλίμ, Μανασσῆ — アシル、ナフタリ、マナセ."
  7: "Συμεών, Λευί, Ἰσσαχάρ — シメオン、レビ、イッサカル."
  8: "Ζαβουλών, Ἰωσήφ, Βενιαμείν — ゼブルン、ヨセフ、ベニヤミン. ἐσφραγισμένοι — 印を押された."
  9: "ὄχλος πολύς — 大きな群れ. στολαὶ λευκαί — 白い衣. φοίνικες — 棕櫚の枝; слово редкое, сноска при первом упоминании в корпусе."
  10: "ἡ σωτηρία τῷ θεῷ ἡμῶν — 救いは…わたしたちの神と小羊とによる (dat. источника). Гимн в «…», не красный."
  11: "ἐπὶ τὰ πρόσωπα αὐτῶν — 顔を地につけて. προσεκύνησαν τῷ θεῷ — 神を拝して."
  12: "Семь славословий; порядок базы: εὐλογία, δόξα, σοφία, εὐχαριστία, τιμή, δύναμις, ἰσχύς. ἀμήν в начале и в конце — アーメン."
  13: "περιβεβλημένοι τὰς στολὰς τὰς λευκάς — 白い衣を着ている. πόθεν ἦλθον — どこから来たのか."
  14: "ἐκ τῆς θλίψεως τῆς μεγάλης — 大きな患難から (ἐκ — «из», не «во время»). ἔπλυναν… ἐλεύκαναν — 洗い、白くした. Слова старца — «…», не красные."
  15: "λατρεύουσιν — 仕える (храмовое служение). σκηνώσει ἐπ᾽ αὐτούς — 幕屋を張る (σκηνή — шатёр)."
  16: "καῦμα — зной: 暑さ. οὐ μὴ πέσῃ ἐπ᾽ αὐτούς — 降りかかることはない."
  17: "ποιμανεῖ — 羊飼いとして養う. πηγαὶ ὑδάτων — 水の泉. ἐξαλείψει πᾶν δάκρυον — 涙を拭い取る."
