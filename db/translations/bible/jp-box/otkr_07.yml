# jp-box, Откровение Иоанна, глава 7. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий (gr-lxx-byz) — свидетель; чего в нём нет, то в 〔…〕.
# Глава 7: запечатление ста сорока четырёх тысяч (1–8); великое множество в белых одеждах
# и их блаженство (9–17).
# Красного <j> в главе нет: прямой речи Христа нет. Слова ангела (7:3), гимн 7:10 и
# славословие 7:12 — в «…», не красные; беседа со старцем (7:13–14) — тоже не красная.
# 〔…〕 в главе нет: порядок колен и все слова 7:5–8 в базе есть (проверено: ιουδα, βενιαμειν
# — ЕСТЬ); Дан в списке отсутствует и в базе, и у Церкви.
# Сноска ⟨…⟩ одна: 棕櫚 (7:9), первое упоминание в корпусе. jp-ni не использовался.

tr_code: jp-box
