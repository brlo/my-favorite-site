verses:
  1: "主[しゅ]はシナイ山[さん]でモーセに言[い]われた。"
  2: "「イスラエルの子[こ]らに語[かた]って言[い]いなさい。わたしがあなたがたに与[あた]える地[ち]に入[はい]ったなら、わたしがあなたがたに与えるその地[ち]は、主[しゅ]への安息[あんそく]として休[やす]まなければならない。"
  3: "六[むっ]つの年[とし]はあなたの畑[はたけ]に種[たね]を蒔[ま]き、六[むっ]つの年[とし]はあなたのぶどう畑[ばたけ]を刈[か]り込[こ]んで、その実[み]を集[あつ]めなさい。"
  4: "しかし七[なな]年目[ねんめ]は、地[ち]のための安息年[あんそくねん]、主[しゅ]への安息[あんそく]である。あなたは畑[はたけ]に種[たね]を蒔[ま]いてはならず、ぶどう畑[ばたけ]を刈[か]り込[こ]んではならない。"
  5: "あなたの畑[はたけ]に自然[しぜん]に生[は]えてくるものは刈[か]り取[と]ってはならず、あなたの聖別[せいべつ]されたぶどうの房[ふさ]も摘[つ]んではならない。それは地[ち]の休[やす]みの年[とし]である。"
  6: "地[ち]の安息[あんそく]によるものは、あなたと、あなたの奴隷[どれい]、あなたの女奴隷[おんなどれい]、あなたの雇[やと]われ人[びと]、あなたのもとに寄[よ]り添[そ]う移[わた]り住[す]みの者[もの]の食[た]べ物[もの]となる。"
  7: "あなたの家畜[かちく]にも、あなたの地[ち]にいる野[や]の獣[けもの]にも、その実[み]のすべてが食[た]べ物[もの]として与[あた]えられる。"
  8: "あなたは自分[じぶん]のために、七[なな]つの安息[あんそく]の年[とし]、すなわち七[なな]年[ねん]を七[なな]度[ど]数[かぞ]えなさい。七[なな]つの週[しゅう]の年[とし]は、四十九年[よんじゅうきゅうねん]となる。"
  9: "あなたがたは第七[だいしち]の月[つき]の十日[とおか]に、ラッパの音[ね]をあなたがたの全[ぜん]土[ど]に響[ひび]かせなさい。贖罪[しょくざい]の日[ひ]に、あなたがたはラッパをあなたがたの全土[ぜんど]に吹[ふ]き鳴[な]らしなさい。"
  10: "あなたがたは第五十[だいごじゅう]の年[とし]を聖[せい]なる年[とし]とし、その地[ち]に住[す]むすべての者[もの]に解放[かいほう]を告[つ]げ知[し]らせなさい。これはあなたがたの解放の年[とし]、ヨベルの年[とし]⟨五十年[ごじゅうねん]ごとに巡[めぐ]ってくる、土地[とち]や人[ひと]を元[もと]の状態[じょうたい]に戻[もど]す年[とし]。⟩である。あなたがたはおのおの自分[じぶん]の所有地[しょゆうち]に帰[かえ]り、おのおの自分[じぶん]の部族[ぶぞく]に帰りなさい。"
  11: "この解放[かいほう]の年[とし]、第五十の年[とし]は、あなたがたの年[とし]となる。あなたがたは種[たね]を蒔[ま]いてはならず、地[ち]に自然[しぜん]に生[は]えるものを刈[か]り取[と]っても、聖別[せいべつ]されたぶどうを摘[つ]んでもならない。"
  12: "それは解放[かいほう]の年[とし]であるからである。それはあなたがたに聖[せい]なるものである。あなたがたは畑[はたけ]からその実[み]を食[た]べなさい。"
  13: "この解放[かいほう]の年[とし]には、おのおの自分[じぶん]の所有地[しょゆうち]に帰[かえ]りなさい。"
  14: "もしあなたが隣人[りんじん]に何[なに]かを売[う]るにせよ、隣人[りんじん]から買[か]うにせよ、人[ひと]は互[たが]いに虐[しいた]げてはならない。"
  15: "あなたは解放[かいほう]の年[とし]の後[のち]の年数[ねんすう]に応[おう]じて隣人[りんじん]から買[か]いなさい。隣人[りんじん]は実[みの]りの年数[ねんすう]に応[おう]じて、あなたに売[う]るのである。"
  16: "年[とし]が多[おお]ければそれだけ、彼[かれ]は代価[だいか]を上[あ]げ、年[とし]が少[すく]なければそれだけ、代価[だいか]を下[さ]げる。彼[かれ]は実[みの]りの数[かず]に応[おう]じて、あなたに売[う]るからである。"
  17: "人[ひと]は互[たが]いに虐[しいた]げてはならない。あなたはあなたの神[かみ]であられる主[しゅ]を畏[おそ]れなさい。わたしは主[しゅ]、あなたがたの神[かみ]である。"
  18: "あなたがたはわたしのすべての定[さだ]めと、わたしのすべての裁[さば]きとを行[おこな]い、それらを守[まも]って行[おこな]いなさい。そうすれば、あなたがたはその地[ち]に安[やす]らかに住[す]む。"
  19: "地[ち]はその産物[さんぶつ]を与[あた]え、あなたがたは満[み]ち足[た]りるまで食[た]べ、その地[ち]に安[やす]らかに住[す]む。"
  20: "あなたがたが『この第七[だいしち]の年[とし]には、種[たね]を蒔[ま]かず、実[みの]りも集[あつ]めないのに、何[なに]を食[た]べようか』と言[い]うなら、"
  21: "わたしは第六[だいろく]の年[とし]に、あなたがたへわたしの祝福[しゅくふく]を送[おく]る。地[ち]は三年分[さんねんぶん]の実[みの]りを産[う]み出[だ]す。"
  22: "あなたがたは第八[だいはち]の年[とし]に種[たね]を蒔[ま]き、古[ふる]い実[みの]りを食[た]べる。第九[だいきゅう]の年[とし]になり、地[ち]の実[みの]りが来[く]るまで、あなたがたは古[ふる]いもののうちの古[ふる]いものを食[た]べるのである。"
  23: "地[ち]は永久[えいきゅう]に売[う]られてはならない。地[ち]はわたしのものであるからである。あなたがたはわたしの前[まえ]では寄留者[きりゅうしゃ]、移[わた]り住[す]みの者[もの]である。"
  24: "あなたがたの所有[しょゆう]のすべての地[ち]で、その地[ち]の贖[あがな]いを認[みと]めなさい。"
  25: "もしあなたとともにいるあなたの兄弟[きょうだい]が貧[まず]しくなり、その所有地[しょゆうち]の一部[いちぶ]を売[う]るなら、彼[かれ]の最[もっと]も近[ちか]い親族[しんぞく]が来[き]て、その兄弟[きょうだい]が売[う]ったものを買[か]い戻[もど]す。"
  26: "しかし、だれも彼[かれ]を買[か]い戻[もど]す親族[しんぞく]がいないで、彼自身[じしん]が力[ちから]を得[え]て、買[か]い戻[もど]すに足[た]るものを見出[みいだ]したなら、"
  27: "彼[かれ]は自分[じぶん]が売[う]った年数[ねんすう]を計算[けいさん]し、余[あま]る分[ぶん]を、自分[じぶん]が売[う]った相手[あいて]に返[かえ]して、自分[じぶん]の所有地[しょゆうち]に帰[かえ]る。"
  28: "しかし、彼[かれ]の手[て]に返[かえ]すに足[た]るものがないなら、売[う]られたものは、解放[かいほう]の年[とし]の第六[だいろく]の年[とし]まで、それを買[か]った者[もの]のものとなる。そして解放[かいほう]の年[とし]にそれは出[で]て行[い]き、彼[かれ]は自分[じぶん]の所有地[しょゆうち]に帰[かえ]る。"
  29: "もし人[ひと]が城壁[じょうへき]に囲[かこ]まれた町[まち]の住居[じゅうきょ]を売[う]るなら、その買[か]い戻[もど]しは、丸[まる]一[いち]年[ねん]が満[み]ちるまで認[みと]められる。"
  30: "もしその一年[いちねん]が満[み]ちるまでに買[か]い戻[もど]されないなら、城壁[じょうへき]のある町[まち]にあるその家[いえ]は、買[か]った者[もの]とその代々[よよ]のものとして確[かく]定[てい]し、解放[かいほう]の年[とし]にも出[で]て行[い]かない。"
  31: "しかし、周[まわ]りに城壁[じょうへき]のない村[むら]の家[いえ]は、その地[ち]の畑[はたけ]と同[おな]じに数[かぞ]えられる。それはいつでも買[か]い戻[もど]すことができ、解放[かいほう]の年[とし]には出[で]て行[い]く。"
  32: "レビ人[びと]の町々[まちまち]、すなわち彼[かれ]らの所有[しょゆう]の町々[まちまち]にある家[いえ]は、レビ人[びと]がいつでも買[か]い戻[もど]すことができる。"
  33: "また、レビ人[びと]から買[か]い戻[もど]す場合[ばあい]、その所有[しょゆう]の町[まち]にある家[いえ]の売[う]り買[か]いは、解放[かいほう]の年[とし]に出[で]て行[い]く。レビ人の町々[まちまち]の家[いえ]は、イスラエルの子[こ]らの間[あいだ]にある彼[かれ]らの所有[しょゆう]だからである。"
  34: "また、彼[かれ]らの町々[まちまち]に割[わ]り当[あ]てられた畑[はたけ]は売[う]られてはならない。それは彼[かれ]らの永遠[えいえん]の所有[しょゆう]であるからである。"
  35: "もしあなたとともにいるあなたの兄弟[きょうだい]が貧[まず]しくなり、あなたのもとで力[ちから]を失[う]うなら、あなたは彼[かれ]を、寄留者[きりゅうしゃ]や移[わた]り住[す]みの者[もの]のように支[ささ]えなさい。そうすれば、あなたの兄弟[きょうだい]はあなたとともに生[い]きる。"
  36: "彼[かれ]から利息[りそく]も増[ふ]え分[ぶん]も取[と]ってはならない。あなたはあなたの神[かみ]を畏[おそ]れなさい。わたしは主[しゅ]である。そうすれば、あなたの兄弟[きょうだい]はあなたとともに生[い]きる。"
  37: "あなたは彼[かれ]に銀[ぎん]を利息[りそく]付[つ]きで貸[か]してはならず、食[た]べ物[もの]を増[ふ]え分[ぶん]を求[もと]めて与[あた]えてはならない。"
  38: "わたしはあなたがたの神[かみ]、主[しゅ]である。あなたがたをエジプトの地[ち]から導[みちび]き出[だ]し、カナンの地[ち]を与[あた]えて、あなたがたの神[かみ]となるためである。"
  39: "もしあなたとともにいるあなたの兄弟[きょうだい]が貧[まず]しくなってあなたに売[う]られるなら、あなたは彼[かれ]に奴隷[どれい]の仕事[しごと]をさせてはならない。"
  40: "彼[かれ]はあなたのもとで、雇[やと]われ人[びと]か移[わた]り住[す]みの者[もの]のように、解放[かいほう]の年[とし]まで働[はたら]く。"
  41: "そして彼[かれ]は解放[かいほう]の年[とし]に、子[こ]どもたちとともに出[で]て行[い]き、自分[じぶん]の一族[いちぞく]に帰[かえ]り、父[ちち]の所有地[しょゆうち]へ帰[かえ]って行[い]く。"
  42: "彼[かれ]らはわたしがエジプトの地[ち]から導[みちび]き出[だ]した、わたしの奴隷[どれい]である。奴隷[どれい]の売[う]り買[か]いで売[う]られてはならない。"
  43: "あなたは彼[かれ]を酷[きび]しい労働[ろうどう]で苦[くる]しめてはならない。あなたはあなたの神[かみ]であられる主[しゅ]を畏[おそ]れなさい。"
  44: "あなたのところにいる奴隷[どれい]と女奴隷[おんなどれい]は、あなたの周[まわ]りにいる諸国民[しょこくみん]のうちから買[か]い取[と]りなさい。"
  45: "また、あなたがたの間[あいだ]にいる移[わた]り住[す]みの者[もの]の子[こ]らからも、あなたがたの地[ち]で生[う]まれた彼[かれ]らの親族[しんぞく]からも買[か]い取[と]ることができる。彼[かれ]らはあなたがたの所有[しょゆう]となる。"
  46: "あなたがたは彼[かれ]らを、自分[じぶん]たちの後[あと]の子[こ]らに分[わ]け与[あた]え、永遠[えいえん]にあなたがたのものとして所有[しょゆう]しなさい。しかし、あなたがたの兄弟[きょうだい]であるイスラエルの子[こ]らについては、だれもその兄弟[きょうだい]を酷[きび]しい労働[ろうどう]で苦[くる]しめてはならない。"
  47: "もしあなたのもとにいる寄留者[きりゅうしゃ]や移[わた]り住[す]みの者[もの]が力[ちから]を得[え]、あなたとともにいるあなたの兄弟[きょうだい]が貧[まず]しくなって、あなたのもとにいる寄留者[きりゅうしゃ]か、その生[う]まれながらの寄留者[きりゅうしゃ]に売[う]られるなら、"
  48: "売[う]られた後[あと]でも、彼[かれ]には買[か]い戻[もど]す権利[けんり]がある。彼[かれ]の兄弟[きょうだい]の一人[ひとり]が彼[かれ]を買[か]い戻[もど]す。"
  49: "彼[かれ]の父[ちち]の兄弟[きょうだい]、あるいは父[ちち]の兄弟[きょうだい]の子[こ]が彼[かれ]を買[か]い戻[もど]す。あるいは、彼[かれ]の肉[にく]の親族[しんぞく]、すなわちその部族[ぶぞく]の者[もの]が彼[かれ]を買[か]い戻[もど]す。あるいは、彼自身[じしん]が力[ちから]を得[え]て自分[じぶん]を買[か]い戻[もど]すなら、"
  50: "彼[かれ]は、自分[じぶん]を売[う]った年[とし]から解放[かいほう]の年[とし]まで、自分[じぶん]を買[か]った者[もの]と計算[けいさん]する。彼[かれ]の売[う]り値[ね]は雇[やと]われ人[びと]の賃金[ちんぎん]のようであり、年[とし]から年[とし]へと、彼[かれ]はその者[もの]とともにいる。"
  51: "もし残[のこ]りの年[とし]が多[おお]ければ、それに応[おう]じて、その売[う]り値[ね]の銀[ぎん]から自分[じぶん]の贖[あがな]い金[きん]を返[かえ]す。"
  52: "もし解放[かいほう]の年[とし]までに残[のこ]りの年[とし]が少[すく]なければ、それに応[おう]じて計算[けいさん]し、その年数[ねんすう]に従[したが]って自分[じぶん]の贖[あがな]い金[きん]を返[かえ]す。"
  53: "彼[かれ]は年[とし]から年[とし]へと、雇[やと]われ人[びと]としてその者[もの]のもとにいる。あなたは彼[かれ]を、あなたの前[まえ]で酷[きび]しい労働[ろうどう]で苦[くる]しめてはならない。"
  54: "もしこれらのとおりに買[か]い戻[もど]されないなら、彼[かれ]は解放[かいほう]の年[とし]に、子[こ]どもたちとともに出[で]て行[い]く。"
  55: "イスラエルの子[こ]らはわたしの奴隷[どれい]である。彼[かれ]らはわたしの僕[しもべ]、わたしがエジプトの地[ち]から導[みちび]き出[だ]した者[もの]たちである。わたしは主[しゅ]、あなたがたの神[かみ]である。」"

notes:
  1: "ἐν τῷ ὄρει Σινα — на горе Синай (Σινα indecl.). Формула введения речи; λέγων отдельно не передаётся."
  2: "ἀναπαύσεται ἡ γῆ — земля будет покоиться (ἀναπαύω). σάββατα τῷ κυρίῳ — субботы Господу (слав. «субботы Господу»; рус. «субботу Господню»). Повтор ἣν ἐγὼ δίδωμι ὑμῖν — как в LXX."
  3: "σπερεῖς — будешь сеять. τεμεῖς — будешь обрезывать (τέμνω, о винограднике). συνάξεις τὸν καρπὸν αὐτῆς — соберёшь плод его."
  4: "σάββατα ἀνάπαυσις ἔσται τῇ γῇ — суббота покоя будет земле. σάββατα τῷ κυρίῳ — субботы Господу. οὐ σπερεῖς … οὐ τεμεῖς — не сей … не обрезывай."
  5: "τὰ αὐτόματα ἀναβαίνοντα — самовольно вырастающее (αὐτόματος). οὐκ ἐκθερίσεις — не выжнешь (ἐκθερίζω). σταφυλὴ τοῦ ἁγιάσματος — гроздь освящения (ἁγίασμα; слав. «винограда отлучения твоего»), т.е. гроздья, оставленные, посвящённые. οὐκ ἐκτρυγήσεις — не соберёшь (τρυγάω). ἐνιαυτὸς ἀναπαύσεως — год покоя."
  6: "τὰ σάββατα τῆς γῆς — субботы земли. βρώματα — пища (βρῶμα). παιδί и παιδίσκη — раб и рабыня (слав. «рабу твоему и рабыни твоей»). μισθωτός — наёмник. πάροικος ὁ προσκείμενος — пришелец, приложившийся (πρόσκειμαι)."
  7: "κτῆνη — скот. θηρία — звери. πᾶν τὸ γένημα αὐτοῦ — весь плод его (αὐτοῦ — земли). εἰς βρῶσιν — в пищу."
  8: "ἐξαριθμήσεις σεαυτῷ — исчислишь себе (ἐξαριθμέω). ἑπτὰ ἀναπαύσεις ἐτῶν — семь субботних лет (ἀνάπαυσις здесь — «субботний год»). ἑπτὰ ἔτη ἑπτάκις — семь лет семь раз. ἑπτὰ ἑβδομάδες ἐτῶν — семь седмиц лет. ἐννέα καὶ τεσσαράκοντα — сорок девять."
  9: "διαγγελεῖτε — возвестите (διαγγέλλω). σάλπιγγος φωνῇ — голосом трубы. τῇ δεκάτῃ τοῦ μηνός — в десятый день месяца. ἡμέρα τοῦ ἱλασμοῦ — день очищения. Повтор διαγγελεῖτε σάλπιγγι — как в LXX."
  10: "ἁγιάσετε — освятите. τὸ ἔτος τὸ πεντηκοστόν — пятидесятый год. διαβοήσετε ἄφεσιν — возгласите отпущение (διαβοάω; ἄφεσις — «отпущение, освобождение»). ἐνιαυτὸς ἀφέσεως σημασία — год отпущения, [т.е.] трубный сигнал: σημασία — «знак, сигнал трубы» (слав. «знамение»); отсюда ヨベルの年. ἀπελεύσεται εἷς ἕκαστος — вернётся каждый; далее 2 л. мн. — как в LXX."
  11: "τὰ αὐτόματα — самовыросшее. τὰ ἡγιασμένα αὐτῆς — освящённое её (виноград). οὐ τρυγήσετε — не соберёте."
  12: "ἅγιον ἔσται ὑμῖν — святым будет вам. ἀπὸ τῶν πεδίων — с полей (πεδίον). τὰ γενήματα αὐτῆς — произведения её."
  13: "ἐπανελεύσεται — вернётся (ἐπανέρχομαι). κτῆσις — владение."
  14: "ἀποδῷ πρᾶσιν — продаст продажу (πρᾶσις — «продажа»). κτήσῃ παρὰ τοῦ πλησίον — купишь у ближнего. μὴ θλιβέτω — да не притесняет (θλίβω)."
  15: "κατὰ ἀριθμὸν ἐτῶν μετὰ τὴν σημασίαν — по числу лет после [трубного] знамения. ἀποδώσεταί σοι — будет продано тебе."
  16: "πληθύνῃ τὴν ἔγκτησιν — умножит приобретение (ἔγκτησις, здесь — цена). ἐλαττονώσῃ — уменьшит. ἀριθμὸν γενημάτων — число произведений."
  17: "μὴ θλιβέτω — ср. ст. 14. φοβηθήσῃ κύριον — убоишься Господа. ἐγώ εἰμι κύριος ὁ θεὸς ὑμῶν — формула."
  18: "δικαιώματα — постановления. κρίσεις — суды. φυλάξασθε — сохраните. πεποιθότες — с уверенностью (πείθω)."
  19: "ἐκφόρια — произведения, доходы (ἐκφόριον). εἰς πλησμονήν — до насыщения (πλησμονή)."
  20: "Τί φαγόμεθα — что будем есть (вопрос в 『』). ἐὰν μὴ σπείρωμεν — если не посеем. συναγάγωμεν — соберём."
  21: "ἀποστελῶ τὴν εὐλογίαν — пошлю благословение. ποιήσει τὰ γενήματα — произведёт произведения. εἰς τὰ τρία ἔτη — на три года."
  22: "τὸ ἔτος τὸ ὄγδοον — восьмой год. ἀπὸ τῶν γενημάτων παλαιά — из произведений старое. ἕως τοῦ ἔτους τοῦ ἐνάτου — до девятого года. παλαιὰ παλαιῶν — старое старого (усиление)."
  23: "εἰς βεβαίωσιν — в утверждение, навсегда (βεβαίωσις; слав. «во утверждение»). ἐμή ἐστιν ἡ γῆ — земля Моя. προσήλυτοι καὶ πάροικοι — пришельцы и поселенцы."
  24: "κατὰ πᾶσαν γῆν κατασχέσεως ὑμῶν — по всей земле владения вашего. λύτρα δώσετε — дадите выкуп (λύτρον), т.е. разрешите выкуп."
  25: "πένηται — обеднеет (πένω). ἀποδῶται ἀπὸ τῆς κατασχέσεως — продаст из владения. ὁ ἀγχιστεύων ἐγγίζων ἔγγιστα — ближайший родственник (ἀγχιστεύω — «быть близким»). λυτρώσεται — выкупит."
  26: "μὴ ᾖ τινι ὁ ἀγχιστεύων — не будет у кого выкупающего родственника. εὐπορηθῇ τῇ χειρί — обретёт достаток (εὐπορέω). τὸ ἱκανὸν λύτρα — достаточное для выкупа."
  27: "συλλογιεῖται — рассчитает (συλλογίζομαι). ὃ ὑπερέχει — что превышает (ὑπερέχω). ᾧ ἀπέδοτο ἑαυτὸν αὐτῷ — кому продал себя (в LXX так, хотя речь о земле; слав. «емуже продано бе оное»)."
  28: "μὴ εὐπορηθῇ ἡ χεὶρ αὐτοῦ — не достанет рука его. ἕως τοῦ ἕκτου ἔτους τῆς ἀφέσεως — до шестого года отпущения (LXX; точный смысл темен; слав. так же буквально; рус. «до юбилейного года»). ἐξελεύσεται τῇ ἀφέσει — выйдет при отпущении."
  29: "οἰκία οἰκητή — жилой дом. πόλις τετειχισμένη — обнесённый стеной город (τειχίζω). ἕως πληρωθῇ ἐνιαυτὸς ἡμερῶν — пока не исполнится год дней, полный год. Повтор ἡ λύτρωσις αὐτῆς — как в LXX."
  30: "κυρωθήσεται — утвердится (κυρόω). βεβαίως — твёрдо. εἰς τὰς γενεὰς αὐτοῦ — в роды его. οὐκ ἐξελεύσεται ἐν τῇ ἀφέσει — не выйдет при отпущении."
  31: "ἐπαύλεις — селения, хутора (ἔπαυλις). τεῖχος κύκλῳ — стена вокруг. λογισθήτωσαν — да будут сочтены (λογίζομαι). λυτρωταί — подлежащие выкупу."
  32: "πόλεις τῶν Λευιτῶν — города левитов. κατασχέσεως — владения. λυτρωταὶ διὰ παντός — всегда выкупаемы."
  33: "ὃς ἂν λυτρωσάμενος παρὰ τῶν Λευιτῶν — кто выкупил у левитов (LXX; слав. «иже аще искупит от левит»; рус. «кто из левитов не выкупит» — иное понимание). διάπρασις — продажа. ἐν μέσῳ υἱῶν Ισραηλ — среди сынов Израиля."
  34: "ἀφωρισμένοι — отделённые, назначенные (ἀφορίζω). κατάσχεσις αἰωνία — вечное владение."
  35: "ἀδυνατήσῃ ταῖς χερσίν — ослабеет руками. ἀντιλήμψῃ αὐτοῦ — поддержи его (ἀντιλαμβάνομαι). ὡς προσηλύτου καὶ παροίκου — как пришельца и поселенца. ζήσεται μετὰ σοῦ — будет жить с тобой."
  36: "τόκος — рост, проценты. ἐπὶ πλήθει — с прибавкой (πλῆθος; слав. «более данаго»). ἐγὼ κύριος — вставка в LXX."
  37: "ἐπὶ τόκῳ — в рост. ἐπὶ πλεονασμόν — на приумножение (πλεονασμός). βρώματα — пища."
  38: "ὁ ἐξαγαγὼν ὑμᾶς — выведший вас. δοῦναι ὑμῖν τὴν γῆν Χανααν — дать вам землю Ханаан. ὥστε εἶναι ὑμῶν θεός — чтобы быть вашим Богом."
  39: "ταπεινωθῇ — будет унижен, обеднеет (ταπεινόω; здесь не «смирять душу», как в гл. 23). πραθῇ σοι — будет продан тебе. δουλείαν οἰκέτου — работу раба."
  40: "μισθωτός — наёмник. πάροικος — поселенец. ἕως τοῦ ἔτους τῆς ἀφέσεως — до года отпущения. ἐργᾶται — будет работать."
  41: "ἐξελεύσεται τῇ ἀφέσει — выйдет при отпущении. εἰς τὴν γενεὰν αὐτοῦ — в род свой. εἰς τὴν κατάσχεσιν τὴν πατρικήν — в отцовское владение. ἀποδραμεῖται — устремится, убежит (ἀποδιδράσκω; слав. «возвратится»)."
  42: "οἰκέται μού εἰσιν — рабы Мои. οὐ πραθήσεται ἐν πράσει οἰκέτου — не будет продан продажей раба."
  43: "κατατενεῖς — будешь изнурять (κατατείνω). ἐν τῷ μόχθῳ — в тяжком труде (μόχθος)."
  44: "παῖς καὶ παιδίσκη — раб и рабыня. ἀπὸ τῶν ἐθνῶν — из народов. κύκλῳ σού — вокруг тебя. κτήσεσθε — приобретёте."
  45: "υἱοὶ τῶν παροίκων — сыны поселенцев. συγγενεῖς — родственники. ἔστωσαν ὑμῖν εἰς κατάσχεσιν — да будут вам во владение."
  46: "καταμεριεῖτε — разделите (καταμερίζω). κατόχιμοι — во владение (κατόχιμος). εἰς τὸν αἰῶνα — навек. οὐ κατατενεῖ — не изнурит."
  47: "εὕρῃ ἡ χείρ — обретёт рука, достаток. ἀπορηθείς — обеднев (ἀπορέω). ἐκ γενετῆς προσήλυτος — пришелец от рождения."
  48: "μετὰ τὸ πραθῆναι — после продажи. λύτρωσις ἔσται αὐτῷ — будет ему выкуп. εἷς τῶν ἀδελφῶν — один из братьев."
  49: "ἀδελφὸς πατρός — брат отца, дядя. υἱὸς ἀδελφοῦ πατρός — сын брата отца. οἱ οἰκεῖοι τῶν σαρκῶν — родные по плоти. ἐκ τῆς φυλῆς — из племени. εὐπορηθεὶς ταῖς χερσίν — обретший достаток."
  50: "συλλογιεῖται πρὸς τὸν κεκτημένον — рассчитается с владеющим (κτάομαι). ἀργύριον τῆς πράσεως — серебро продажи. ὡς μισθίου — как [плата] наёмника (μίσθιος). ἔτος ἐξ ἔτους — год за годом."
  51: "πλεῖον τῶν ἐτῶν — больше лет. ἀποδώσει τὰ λύτρα — отдаст выкуп. ἀπὸ τοῦ ἀργυρίου τῆς πράσεως — из серебра продажи."
  52: "ὀλίγον καταλειφθῇ — мало останется (καταλείπω). συλλογιεῖται αὐτῷ — рассчитает ему. κατὰ τὰ ἔτη αὐτοῦ — по годам его."
  53: "ὡς μισθωτὸς ἐνιαυτὸν ἐξ ἐνιαυτοῦ — как наёмник год за годом. ἐνώπιόν σου — в глазах твоих."
  54: "μὴ λυτρῶται — не выкупается. ἐξελεύσεται ἐν τῷ ἔτει τῆς ἀφέσεως — выйдет в год отпущения."
  55: "οἰκέται, παῖδές μου — рабы, слуги Мои (повтор). ἐγὼ κύριος ὁ θεὸς ὑμῶν — формула."
