# jp-box, Захария, глава 14. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной (совпадает с gr: 21 стих).
# Язык — современный 常体; 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1–2 день Господень, народы на Иерусалим, город взят, половина в плен;
# 3–5 Господь выступает, ноги на Елеонской горе, гора расседается, долина до Асила,
# «придёт Господь Бог мой и все святые с Ним»; 6–7 необычный день, свет вечером;
# 8 живые воды из Иерусалима; 9 Господь — Царь всей земли, имя едино; 10–11
# Иерусалим возвышен, ворота и башня Анамеила, «проклятия не будет более»;
# 12–15 поражение народов, смятение, Иуда и добыча, поражение скота; 16–19 праздник
# кущей и дождь, грех Египта; 20–21 «Святыня Господу» на уборах, котлы как чаши,
# «не будет более Хананея».
# Голоса: 1 пророческое объявление (без кавычек); 2 слово Господа в 「…»; 3–21
# описание (без кавычек).
# Термины: 主[しゅ]の日[ひ] — ἡμέρα κυρίου; オリーブ山[やま] — ὄρος τῶν ἐλαιῶν;
# 仮庵[かりいお]の祭[まつ]り — ἑορτὴ σκηνοπηγίας; 鍋[なべ] — λέβης; 聖[せい]なる —
# ἅγιον; カナン人[じん] — Χαναναῖος.
#
tr_code: jp-box
book: zah
chapter: 14
draft: true

verses:
  1: "見[み]よ、主[しゅ]の日[ひ]が来[く]る。あなたの獲物[えもの]はあなたの中[なか]で分[わ]けられる。"
  2: "「わたしはすべての民[たみ]をエルサレムに集[あつ]めて戦[たたか]わせる。都[みやこ]は取[と]られ、家[いえ]々[いえ]は奪[うば]われ、女[おんな]たちは辱[はずかし]められ、都[みやこ]の半[はん]分[ぶん]は捕囚[ほしゅう]となって出[で]て行[い]く。しかし、この民[たみ]の残[のこ]りは都[みやこ]から滅[ほろ]ぼされない。」"
  3: "主[しゅ]は出[で]て行[い]き、あの民[たみ]たちと戦[たたか]われる。戦[いくさ]の日[ひ]に戦[たたか]われるときのように。"
  4: "その日[ひ]、その足[あし]はエルサレムの前[まえ]、東[ひがし]にあるオリーブ山[やま]の上[うえ]に立[た]つ。オリーブ山[やま]は東[ひがし]から西[にし]へ、非常[ひじょう]に大[おお]きな谷[たに]となって裂[さ]け、その半[はん]分[ぶん]は北[きた]へ、半[はん]分[ぶん]は南[みなみ]へ退[の]く。"
  5: "わたしの山[やま]々[やま]の谷[たに]は埋[う]められ、谷[たに]はアシエルまで達[たっ]する。それは、ユダの王[おう]ウジヤの時代[じだい]の地震[じしん]のときに埋[う]められたように埋[う]められる。わたしの神[かみ]である主[しゅ]が、すべての聖[せい]なる者[もの]たちとともに来[こ]られる。"
  6: "その日[ひ]、光[ひかり]はなく、寒[さむ]さと霜[しも]がある。"
  7: "その日[ひ]は一[ひと]つであり、主[しゅ]にだけ知[し]られている。昼[ひる]も夜[よる]もなく、夕暮[ゆうぐ]れに光[ひかり]がある。"
  8: "その日[ひ]、生[い]ける水[みず]がエルサレムから流[なが]れ出[で]る。その半[はん]分[ぶん]は前[まえ]の海[うみ]へ、半[はん]分[ぶん]は後[あと]の海[うみ]へ流[なが]れる。夏[なつ]にも春[はる]にも、そうなる。"
  9: "主[しゅ]は全[ぜん]地[ち]の王[おう]となる。その日[ひ]、主[しゅ]は一[ひと]人[り]であり、その名[な]も一[ひと]つである。"
  10: "主[しゅ]は全[ぜん]地[ち]と荒野[こうや]を、ゲバからエルサレムの南[みなみ]のリモンまで巡[めぐ]られる。エルサレムは高[たか]く上[あ]げられ、その場所[ばしょ]にとどまる。ベニヤミンの門[もん]から第一[だいいち]の門[もん]の所[ところ]、隅[すみ]の門[もん]まで、またハナンエルの塔[とう]から王[おう]の酒[さか]ぶどう搾[しぼ]り場[ば]まで。"
  11: "人[ひと]々[びと]はその中[なか]に住[す]み、もはや呪[のろ]いはない。エルサレムは安[あん]全[ぜん]に住[す]まわれる。"
  12: "これが、エルサレムに攻[せ]め上[のぼ]ったすべての民[たみ]を主[しゅ]が打[う]つ災[わざわ]いである。彼らが自分[じぶん]の足[あし]で立[た]っているうちに、その肉[にく]は溶[と]け、その目[め]はその穴[あな]から流[なが]れ出[で]、その舌[した]はその口[くち]の中[なか]で溶[と]ける。"
  13: "その日[ひ]、主[しゅ]による大[おお]きな恐[おそ]れが彼らの間[あいだ]に起[お]こる。それぞれが隣人[りんじん]の手[て]をつかみ、その手[て]は隣人[りんじん]の手[て]と絡[から]み合[あ]う。"
  14: "ユダもまたエルサレムで戦[たたか]い、周[まわ]りのすべての民[たみ]の富[とみ]、すなわち金[きん]、銀[ぎん]、衣[ころも]を大[おお]いに集[あつ]める。"
  15: "馬[うま]、らば、らくだ、ろば、およびそれらの陣営[じんえい]にいるすべての家畜[かちく]にも、この災[わざわ]いが及[およ]ぶ。"
  16: "エルサレムに攻[せ]め上[のぼ]ったすべての民[たみ]のうち、残[のこ]った者[もの]たちは、年[とし]ごとに上[のぼ]って、王[おう]である万軍[ばんぐん]の主[しゅ]を拝[おが]み、仮庵[かりいお]の祭[まつ]りを祝[いわ]う。"
  17: "地[ち]の氏族[しぞく]のうち、エルサレムに上[のぼ]って王[おう]である万軍[ばんぐん]の主[しゅ]を拝[おが]まない者[もの]には、雨[あめ]が降[ふ]らない。"
  18: "エジプトの氏族[しぞく]が上[のぼ]って来[こ]ないなら、彼らにも、あの災[わざわ]いが及[およ]ぶ。主[しゅ]は、仮庵[かりいお]の祭[まつ]りを祝[いわ]いに上[のぼ]らない民[たみ]たちを打[う]つ、あの災[わざわ]いで彼らを打[う]つ。"
  19: "これがエジプトの罪[つみ]であり、仮庵[かりいお]の祭[まつ]りを祝[いわ]いに上[のぼ]らないすべての民[たみ]の罪[つみ]である。"
  20: "その日[ひ]、馬[うま]のくつわには「主[しゅ]に聖[せい]なる」と記[しる]され、主[しゅ]の家[いえ]の鍋[なべ]は、祭壇[さいだん]の前[まえ]の杯[さかずき]のようになる。"
  21: "エルサレムとユダにあるすべての鍋[なべ]は、万軍[ばんぐん]の主[しゅ]に聖[せい]なるものとなる。すべていけにえを献[ささ]げる者[もの]たちが来[き]て、それらを取[と]り、その中[なか]で煮[に]る。その日[ひ]、万軍[ばんぐん]の主[しゅ]の家[いえ]には、もはやカナン人[じん]は一人[ひとり]もいなくなる。"

notes:
  1: "Ἰδοὺ ἡμέραι ἔρχονται τοῦ κυρίου — «вот дни Господни приходят»; διαμερισθήσεται τὰ σκῦλά σου — «разделятся добычи твои»."
  2: "ἐπισυνάξω πάντα τὰ ἔθνη — «соберу все народы»; ἁλώσεται ἡ πόλις — «будет взят город»; αἱ γυναῖκες μολυνθήσονται — «жёны осквернятся»; τὸ ἥμισυ… ἐν αἰχμαλωσίᾳ — «половина… в плен»."
  3: "ἐξελεύσεται κύριος — «выйдет Господь»; παρατάξεται ἐν τοῖς ἔθνεσιν — «ополчится на народы»; καθὼς ἡμέρα παρατάξεως — «как день ополчения»."
  4: "οἱ πόδες αὐτοῦ… ἐπὶ τὸ ὄρος τῶν ἐλαιῶν — «ноги Его… на горе Елеонской»; σχισθήσεται — «расколется»; χάος μέγα — «пропасть великая»; κλινεῖ — «склонится»."
  5: "ἐμφραχθήσεται φάραγξ ὀρέων — «засыплется долина гор» (слав.; в ru «побежите в долину» — МТ, не внесено); ἕως Ιασολ — «до Иасила» (アシエル); ἐνεφράγη ἐν ἡμέραις Οζιου — «засыпана во дни Озии»; ὅσιοι — «святые»."
  6: "οὐκ ἔσται φῶς καὶ ψῦχος καὶ πάγος — «не будет света, и холод, и мороз» (слав.; в ru «светила удалятся» — МТ, не внесено)."
  7: "μίαν ἡμέραν — «один день»; γνωστὴ τῷ κυρίῳ — «известен Господу»; οὐχ ἡμέρα καὶ οὐ νύξ — «не день и не ночь»; πρὸς ἑσπέραν ἔσται φῶς — «к вечеру будет свет»."
  8: "ὕδωρ ζῶν — «вода живая»; θάλασσα ἡ πρώτη… ἡ ἐσχάτη — «море первое… последнее» (前の海・後の海; Мёртвое и Средиземное); ἐν θέρει καὶ ἐν ἔαρι — «летом и весною» (слав. «в жатву и в весну»)."
  9: "κύριος εἰς βασιλέα — «Господь в Царя»; εἷς καὶ τὸ ὄνομα αὐτοῦ ἕν — «един и имя Его едино»."
  10: "κυκλῶν πᾶσαν τὴν γῆν — «обходя всю землю» (слав.; в ru «как равнина» — МТ, не внесено); Ραμα — «Рама» (высота); πύλη Βενιαμιν — «ворота Вениамина»; πύργος Ανανεηλ — «башня Анамеила»; ὑπολήνια τοῦ βασιλέως — «точила царские»."
  11: "κατοικήσουσιν ἐν αὐτῇ — «будут жить в ней»; ἀνάθεμα — «заклятие, проклятие»; πεποιθότως — «безопасно»."
  12: "ἡ πτῶσις — «поражение»; τακήσονται αἱ σάρκες — «растают плоти»; ὀφθαλμοὶ ῥυήσονται — «глаза истекут»; γλῶσσα τακήσεται — «язык растает»."
  13: "ἔκστασις κυρίου — «исступление (смятение) Господне»; ἐπιλήμψονται τῆς χειρός — «возьмутся за руку»; συμπλακήσεται — «сцепится»."
  14: "ὁ Ιουδας παρατάξεται ἐν Ιερουσαλημ — «Иуда ополчится в Иерусалиме» (слав.; в ru «против Иерусалима» — МТ); συνάξει τὴν ἰσχύν — «соберёт силу (богатство)»."
  15: "ἡ πτῶσις τῶν ἵππων… — «поражение коней…»; ἡμίονοι — «мулы» (騾馬); κάμηλοι — «верблюды»; ὄνοι — «ослы»."
  16: "κατ' ἐνιαυτόν — «из года в год»; προσκυνῆσαι τῷ βασιλεῖ κυρίῳ — «поклониться Царю Господу»; ἑορτὴ σκηνοπηγίας — «праздник кущей» (仮庵)."
  17: "ἐὰν μὴ ἀναβῶσιν — «если не взойдут»; слав. добавляет «не будет на них дождя» — нет в gr, внесено (雨が降らない)."
  18: "φυλὴ Αἰγύπτου — «племя Египта»; ἡ πτῶσις — «поражение»; ὅσα ἐὰν μὴ ἀναβῇ — «которые не взойдут»; в ru добавлено «не будет дождя» — нет в LXX/слав., не внесено."
  19: "ἡ ἁμαρτία Αἰγύπτου — «грех Египта»; ἡ ἁμαρτία πάντων τῶν ἐθνῶν — «грех всех народов»."
  20: "τὸ ἐπὶ τὸν χαλινὸν τοῦ ἵππου — «то, что на узде коня»; ἅγιον τῷ κυρίῳ — «свято Господу»; λέβητες — «котлы» (鍋); φιάλαι — «чаши»."
  21: "πᾶς λέβης — «всякий котёл»; οἱ θυσιάζοντες — «приносящие жертвы»; ἑψήσουσιν — «сварят»; Χαναναῖος — «Хананей» (カナン人)."
