verses:
  1: "週[しゅう]の初[はじ]めの日[ひ]の朝[あさ]早[はや]く、まだ暗[くら]いうちに、マグダラのマリアが墓[はか]へ行[い]くと、石[いし]が墓[はか]から取[と]り除[の]けられているのを見[み]た。"
  2: "そこで、彼女[かのじょ]は走[はし]って、シモン・ペトロと、イエスが愛[あい]しておられたもう一人[ひとり]の弟子[でし]のところへ行[い]き、彼[かれ]らに言[い]った。「だれかが主[しゅ]を墓[はか]から運[はこ]び出[だ]して、どこに置[お]いたのか、わたしたちには分[わ]かりません。」"
  3: "そこで、ペトロともう一人[ひとり]の弟子[でし]は外[そと]へ出[で]て、墓[はか]へ向[む]かった。"
  4: "二人[ふたり]は並[なら]んで走[はし]ったが、もう一人[ひとり]の弟子[でし]はペトロより足[あし]が速[はや]く、先[さき]に墓[はか]に着[つ]いた。"
  5: "そして、かがみ込[こ]んでのぞくと、亜麻布[あまぬの]が置[お]かれているのが見[み]えたが、中[なか]には入[はい]らなかった。"
  6: "シモン・ペトロも彼[かれ]の後[あと]から来[き]て、墓[はか]の中[なか]へ入[はい]った。そして、亜麻布[あまぬの]が置[お]かれているのを見[み]、"
  7: "また、イエスの頭[あたま]に巻[ま]いてあった布[ぬの]が、亜麻布[あまぬの]と一緒[いっしょ]ではなく、別[べつ]の所[ところ]に巻[ま]かれたまま置[お]かれているのを見[み]た。"
  8: "そのとき、先[さき]に墓[はか]に着[つ]いたもう一人[ひとり]の弟子[でし]も中[なか]へ入[はい]り、見[み]て信[しん]じた。"
  9: "彼[かれ]らはまだ、イエスが死者[ししゃ]の中[なか]から復活[ふっかつ]されるべきことを、聖書[せいしょ]から知[し]っていなかったのである。"
  10: "それから、弟子[でし]たちはまた自分[じぶん]たちのところへ帰[かえ]って行[い]った。"
  11: "しかし、マリアは墓[はか]の外[そと]に立[た]って泣[な]いていた。そして、泣[な]きながら墓[はか]の中[なか]をのぞき込[こ]むと、"
  12: "イエスの遺体[いたい]が置[お]かれていた所[ところ]に、白[しろ]い衣[ころも]を着[き]た二人[ふたり]の天使[てんし]が座[すわ]っているのを見[み]た。一人[ひとり]は頭[あたま]のほうに、一人[ひとり]は足[あし]のほうにいた。"
  13: "二人[ふたり]が彼女[かのじょ]に言[い]った。「婦人[ふじん]よ、なぜ泣[な]いているのか。」彼女[かのじょ]は言[い]った。「だれかがわたしの主[しゅ]を運[はこ]び出[だ]して、どこに置[お]いたのか、わたしには分[わ]かりません。」"
  14: "こう言[い]ってから、彼女[かのじょ]は後[うし]ろを振[ふ]り返[かえ]り、イエスが立[た]っているのを見[み]たが、それがイエスだとは分[わ]からなかった。"
  15: "イエスは彼女[かのじょ]に言[い]われた。「<j>婦人[ふじん]よ、なぜ泣[な]いているのか。だれを捜[さが]しているのか。</j>」彼女[かのじょ]は、それが園[その]の番人[ばんにん]だと思[おも]って言[い]った。「主[しゅ]よ、あなたがこの方[かた]を運[はこ]び出[だ]したのなら、どこに置[お]いたのか教[おし]えてください。わたしが引[ひ]き取[と]ります。」"
  16: "イエスは彼女[かのじょ]に言[い]われた。「<j>マリア。</j>」彼女[かのじょ]は振[ふ]り向[む]いて、ヘブライ語[ご]で「ラボニ」と言[い]った。それは「先生[せんせい]」という意味[いみ]である。"
  17: "イエスは彼女[かのじょ]に言[い]われた。「<j>わたしに触[ふ]れてはいけない。わたしはまだ父[ちち]のもとへ上[のぼ]っていないからである。しかし、わたしの兄弟[きょうだい]たちのところへ行[い]って、こう伝[つた]えなさい。『わたしは、わたしの父[ちち]でありあなたがたの父[ちち]である方[かた]、わたしの神[かみ]でありあなたがたの神[かみ]である方[かた]のもとへ上[のぼ]る』と。</j>」"
  18: "マグダラのマリアは行[い]って、弟子[でし]たちに「わたしは主[しゅ]を見[み]た」と告[つ]げ、主[しゅ]が自分[じぶん]にこう言[い]われたことを伝[つた]えた。"
  19: "その日[ひ]、すなわち週[しゅう]の初[はじ]めの日[ひ]の夕方[ゆうがた]、弟子[でし]たちがユダヤ人[じん]たちを恐[おそ]れて集[あつ]まっていた家[いえ]の戸[と]が閉[し]ざされていたとき、イエスが来[き]て真[ま]ん中[なか]に立[た]ち、「<j>あなたがたに平和[へいわ]があるように</j>」と言[い]われた。"
  20: "こう言[い]って、手[て]と脇腹[わきばら]を彼[かれ]らにお見[み]せになった。弟子[でし]たちは主[しゅ]を見[み]て喜[よろこ]んだ。"
  21: "イエスはまた彼[かれ]らに言[い]われた。「<j>あなたがたに平和[へいわ]があるように。父[ちち]がわたしを遣[つか]わされたように、わたしもあなたがたを遣[つか]わす。</j>」"
  22: "こう言[い]って息[いき]を吹[ふ]きかけて、彼[かれ]らに言[い]われた。「<j>{聖霊[せいれい]|聖神[せいしん]}を受[う]けなさい。</j>"
  23: "<j>あなたがたがだれかの罪[つみ]を赦[ゆる]すなら、その罪[つみ]は赦[ゆる]される。あなたがたがだれかの罪[つみ]を留[とど]めるなら、その罪[つみ]は留[とど]められる。</j>」"
  24: "さて、十二人[じゅうににん]のうちの一人[ひとり]、ディディモと呼[よ]ばれるトマスだけは、イエスが来[こ]られたとき、その場[ば]に居合[いあ]わせていなかった。"
  25: "ほかの弟子[でし]たちは彼[かれ]に言[い]った。「わたしたちは主[しゅ]を見[み]た。」しかし、彼[かれ]は言[い]った。「あの方[かた]の手[て]に釘[くぎ]の跡[あと]を見[み]、この指[ゆび]をその釘[くぎ]の跡[あと]に入[い]れ、この手[て]をその脇腹[わきばら]に入[い]れなければ、わたしは信[しん]じない。」"
  26: "八日[ようか]たって、弟子[でし]たちはまた家[いえ]の中[なか]に集[あつ]まっていた。トマスも一緒[いっしょ]であった。戸[と]が閉[し]ざされていたのに、イエスが来[き]て真[ま]ん中[なか]に立[た]ち、「<j>あなたがたに平和[へいわ]があるように</j>」と言[い]われた。"
  27: "それから、トマスに言[い]われた。「<j>あなたの指[ゆび]をここに持[も]って来[き]て、わたしの手[て]を見[み]なさい。あなたの手[て]を持[も]って来[き]て、わたしの脇腹[わきばら]に入[い]れなさい。不信仰[ふしんこう]な者[もの]にならず、信仰[しんこう]ある者[もの]になりなさい。</j>」"
  28: "トマスは答[こた]えて言[い]った。「わたしの主[しゅ]、わたしの神[かみ]。」"
  29: "イエスは彼[かれ]に言[い]われた。「<j>あなたはわたしを見[み]たので信[しん]じたのか。見[み]ないで信[しん]じる者[もの]たちは幸[さいわ]いである。</j>」"
  30: "イエスはこのほかにも、多[おお]くのしるしを弟子[でし]たちの前[まえ]で行[おこな]われたが、それらはこの書[しょ]に書[か]かれていない。"
  31: "しかし、これらのことが書[か]かれたのは、イエスがキリスト、神[かみ]の子[こ]であることを、あなたがたが信[しん]じるためであり、また、信[しん]じて、その名[な]によって永遠[えいえん]の命[いのち]を受[う]けるためである。"

notes:
  1: "τῇ μιᾷ τῶν σαββάτων — «в первый день недели»; 週の初めの日. πρωῒ σκοτίας ἔτι οὔσης — 朝早く、まだ暗いうちに (ср. Лк 24:1). ἠρμένον — perfect, 取り除けられている."
  2: "τρέχει — исторический present; 走って. τὸν ἄλλον μαθητὴν ὃν ἐφίλει — もう一人の弟子; здесь φιλέω, но это устойчивое обозначение любимого ученика (в 21:7,20 — ἠγάπα), поэтому 愛しておられた. Ἦραν τὸν κύριον — 主を運び出した. Слова Марии — не красные."
  3: "ἐξῆλθεν … ἤρχοντο — 外へ出て、墓へ向かった."
  4: "προέδραμεν τάχιον — «побежал вперёд быстрее»; ペトロより足が速く; πρῶτος — 先に."
  5: "παρακύψας — «наклонившись»; かがみ込んでのぞく (ср. Лк 24:12). οὐ μέντοι εἰσῆλθεν — 中には入らなかった."
  6: "θεωρεῖ — «видит, разглядывает»; 見た. Стих обрывается на «и», продолжение — 20:7."
  7: "σουδάριον — 頭に巻いてあった布; χωρὶς ἐντετυλιγμένον εἰς ἕνα τόπον — 別の所に巻かれたまま (порядок сохранён)."
  8: "εἶδεν καὶ ἐπίστευσεν — 見て信じた; без пояснения, во что именно (ср. 20:9)."
  9: "οὐδέπω γὰρ ᾔδεισαν τὴν γραφήν — まだ聖書から知っていなかった; δεῖ … ἐκ νεκρῶν ἀναστῆναι — 死者の中から復活されるべき."
  10: "ἀπῆλθον … πρὸς αὑτούς — 自分たちのところへ帰って行った."
  11: "εἱστήκει — плюсквамперфект, «стояла»; 立って泣いていた. παρέκυψεν — のぞき込む (то же слово, что в 20:5)."
  12: "ἐν λευκοῖς — 白い衣; ἕνα πρὸς τῇ κεφαλῇ καὶ ἕνα πρὸς τοῖς ποσίν — 一人は頭のほうに、一人は足のほうに."
  13: "Γύναι, τί κλαίεις; — 婦人よ、なぜ泣いているのか. Слова ангелов — не красные; слова Марии — тоже. τὸν κύριόν μου — わたしの主."
  14: "ἐστράφη εἰς τὰ ὀπίσω — 後ろを振り返り; οὐκ ᾔδει ὅτι Ἰησοῦς ἐστιν — それがイエスだとは分からなかった."
  15: "κηπουρός — 園の番人; κύριε — 主よ (вежливое обращение к незнакомому, «господин»; она принимает Его за садовника, это ещё не исповедание — ср. 20:13,28). ἐβάστασας — 運び出した; ἀρῶ — 引き取る."
  16: "Ῥαββουνι — ラボニ (арам. «мой учитель»; сноска уже есть в Мк 10:51, не повторяю); ὃ λέγεται Διδάσκαλε — それは「先生」という意味. Из слов Христа красное — только マリア."
  17: "μή μου ἅπτου — present imperative: «не держись за Меня, перестань», わたしに触れてはいけない. Это не запрет навсегда (в 20:27 Он Сам предлагает Фоме осязать), а на время до вознесения: οὔπω γὰρ ἀναβέβηκα πρὸς τὸν πατέρα. Не сглажено в «не прикасайся». πατέρα μου καὶ πατέρα ὑμῶν — わたしの父でありあなたがたの父; θεόν μου καὶ θεὸν ὑμῶν — わたしの神でありあなたがたの神 (различие «мой/ваш» сохранено)."
  18: "ἀγγέλλουσα … ὅτι Ἑώρακα τὸν κύριον — 主を見たと告げ; ταῦτα εἶπεν αὐτῇ — こう言われたことを伝えた."
  19: "ὀψίας … τῇ μιᾷ σαββάτων — 週の初めの日の夕方; τῶν θυρῶν κεκλεισμένων — 戸が閉ざされていたのに (genitivus absolutus); εἰς τὸ μέσον — 真ん中に. Εἰρήνη ὑμῖν — あなたがたに平和があるように (ср. Лк 24:36)."
  20: "τὰς χεῖρας καὶ τὴν πλευράν — 手と脇腹; ἐχάρησαν … ἰδόντες τὸν κύριον — 主を見て喜んだ."
  21: "καθὼς ἀπέσταλκέν με ὁ πατήρ — 父がわたしを遣わされたように (perfect); κἀγὼ πέμπω ὑμᾶς — わたしもあなたがたを遣わす."
  22: "ἐνεφύσησεν — «дунул»; 息を吹きかけて (ср. Быт 2:7). Λάβετε πνεῦμα ἅγιον — 聖霊を受けなさい; 聖霊 дано калькой {聖霊｜聖神}, чтобы работал переключатель 聖神."
  23: "ἄν τινων ἀφῆτε … ἀφέωνται — 赦すなら…赦される; ἄν τινων κρατῆτε … κεκράτηνται — 留めるなら…留められる. Perfect в обеих частях: решение на земле отвечает уже совершённому."
  24: "Θωμᾶς … ὁ λεγόμενος Δίδυμος — ディディモと呼ばれるトマス (арам. и греч. «близнец»). οὐκ ἦν μετ᾽ αὐτῶν — その場に居合わせていなかった."
  25: "τύπον τῶν ἥλων — 釘の跡 (τύπος — «отпечаток», не «рана»); οὐ μὴ πιστεύσω — усиленное отрицание: 信じない. Слова Фомы — не красные."
  26: "μεθ᾽ ἡμέρας ὀκτώ — 八日たって (следующее воскресенье); τῶν θυρῶν κεκλεισμένων — 戸が閉ざされていたのに."
  27: "Φέρε … ὧδε — ここに持って来て; βάλε εἰς τὴν πλευράν μου — わたしの脇腹に入れなさい; μὴ γίνου ἄπιστος ἀλλὰ πιστός — 不信仰な者にならず、信仰ある者になりなさい."
  28: "Ὁ κύριός μου καὶ ὁ θεός μου — わたしの主、わたしの神. Слова Фомы — не красные (исповедание, а не слова Христа)."
  29: "Ὅτι ἑώρακάς με πεπιστευκας; — 見たので信じたのか (вопрос, а не утверждение); μακάριοι οἱ μὴ ἰδόντες καὶ πιστεύσαντες — 見ないで信じる者たちは幸いである."
  30: "πολλὰ … καὶ ἄλλα σημεῖα — このほかにも多くのしるし; ἐνώπιον τῶν μαθητῶν [αὐτοῦ] — αὐτοῦ в критической базе под скобками, по-японски не передаётся, 〔〕 не ставлю."
  31: "ἵνα πιστεύσητε … καὶ … ζωὴν ἔχητε — 信じるため、また…命を受けるため; ὁ Χριστὸς ὁ υἱὸς τοῦ θεοῦ — キリスト、神の子 (порядок греческого); ἐν τῷ ὀνόματι αὐτοῦ — その名によって."
