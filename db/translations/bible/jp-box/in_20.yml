# jp-box, Евангелие от Иоанна, глава 20. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий (gr-lxx-byz) — свидетель; расхождения — в 〔…〕 и notes.
# jp-ni не использовался.
#
# Глава Воскресения: пустой гроб (1–10), Мария Магдалина (11–18),
# явление ученикам (19–23), Фома (24–29), цель книги (30–31).
# Слова Христа — в <j>…</j> (15–17, 19, 21, 23, 26–27, 29); слова Марии
# Магдалины, ангелов, учеников, Фомы — вне тегов; синих стихов нет.
# 20:17 μή μου ἅπτου — 触れてはいけない, не запрет навсегда (см. notes).
# 20:22 聖霊 дано калькой {聖霊[せいれい]|聖神[せいしん]}, чтобы работал
# переключатель «伝統表記».

