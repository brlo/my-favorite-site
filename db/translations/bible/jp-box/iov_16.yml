# jp-box, Иов, глава 16. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге Иов есть только для глав 1–2; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 16: ответ Иова. Формула 16:1 — повествование вне кавычек; речь 16:2–22 — одна
# цитата. Речь Иова продолжается в главе 17 (новая формула только в 18:1), поэтому
# кавычка закрывается в конце ст. 22 и снова открывается в 17:1 — так каждая глава
# сбалансирована по кавычкам; в notes отмечено продолжение.
# Поэзия: тёмные места сохранены (16:2 «утешители зол», 16:5 «сила в устах», 16:8
# «ложь моя», 16:18 «да не будет места воплю», 16:19 μάρτυς/συνίστωρ).
# Нумерация по gr: 22 стиха. Слав. 16:7 вбирает начало гр. 16:8 («и ят мя» = ἐπελάβου μου),
# держимся деления gr. Син. в ряде мест (16:5, 7–16) следует евр. иначе; его чтения
# не вносились.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
# Голоса: 1 — повествование, 2–22 — Иов (продолжение в гл. 17).

