chapter: 16
draft: true

verses:
  1: "ヨブは答[こた]えて言[い]った。"
  2: "「わたしはこのようなことを何度[なんど]も聞[き]いた。あなたがたはみな、苦[くる]しみの中[なか]の慰[なぐさ]め手だ。"
  3: "風[かぜ]のような言葉[ことば]に限[かぎ]りはないのか。何[なに]があなたを苛立[いらだ]たせて、あなたは答[こた]えるのか。"
  4: "わたしもあなたがたのように語[かた]るだろう。もしあなたがたの魂[たましい]がわたしの魂の身代[みがわ]りに置[お]かれていたなら。そのとき、わたしは言葉[ことば]であなたがたに襲[おそ]いかかり、あなたがたに向[む]かって頭[あたま]を振るだろう。"
  5: "わたしの口[くち]に力[ちから]があり、わたしは唇[くちびる]の動[うご]きを惜[お]しまないだろう。"
  6: "わたしが語[かた]っても、傷[きず]は痛[いた]まない。しかし黙[だま]っていても、わたしの傷はどれほど軽[かる]くなるというのか。"
  7: "しかし今[いま]、神[かみ]はわたしを疲[つか]れ果[は]てさせ、愚[おろ]かな者とし、腐[くさ]らせた。"
  8: "あなたはわたしを捕[つか]まえ、それは証[あか]しとなった。わたしの内[うち]に偽[いつわ]りが起こり、わたしの顔[かお]に向[む]かって答[こた]えた。"
  9: "神[かみ]は怒[いか]りをもってわたしを倒[たお]し、わたしに向かって歯を噛み鳴らした。その略奪者[りゃくだつしゃ]たちの矢がわたしに降[ふ]りかかった。"
  10: "目[め]の鋭[するど]さでわたしに飛[と]びかかり、剣[つるぎ]でわたしの頬[ほお]を打[う]ち、一斉[いっせい]にわたしに殺到[さっとう]した。"
  11: "主[しゅ]はわたしを不[ふ]正[せい]な者[もの]の手[て]に渡[わた]し、不[ふ]敬[けい]な者[もの]たちの間[あいだ]に投[な]げ込[こ]んだ。"
  12: "わたしが平和[へいわ]にしていたとき、神[かみ]はわたしを打[う]ち砕[くだ]き、髪[かみ]をつかんで引[ひ]き裂[さ]き、わたしを的[まと]とした。"
  13: "彼[かれ]らは槍[やり]をもってわたしを囲[かこ]み、わたしの腎[じん]を射て惜[お]しむことなく、わたしの胆汁[たんじゅう]を地[ち]に注[そそ]ぎ出した。"
  14: "彼らはわたしを倒[たお]して、次[つぎ]から次へと倒し、力[ちから]ある者[もの]たちがわたしに走[はし]り寄[よ]って来る。"
  15: "わたしは自分[じぶん]の皮[かわ]の上[うえ]に粗布[あらぬの]を縫[ぬ]い着け、わたしの力[ちから]は地[ち]に消[き]えた。"
  16: "泣[な]き叫[さけ]ぶあまり、わたしの腹[はら]は焼け焦げ、死[し]の影[かげ]がまぶたの上[うえ]にある。"
  17: "わたしの手[て]には何[なに]の不正[ふせい]もなかった。わたしの祈[いの]りは清[きよ]い。"
  18: "地[ち]よ、わたしの血を覆[おお]うな。わたしの叫[さけ]びに休[やす]む場所[ばしょ]ができないように。"
  19: "今[いま]、見[み]よ、わたしの証人[しょうにん]は天[てん]にあり、わたしの事[こと]を知[し]る者[もの]は高[たか]き所[ところ]にある。"
  20: "わたしの願[ねが]いが主[しゅ]のもとに届[とど]き、わたしの目が主の前[まえ]に涙[なみだ]を滴[したた]らせますように。"
  21: "人[ひと]が主[しゅ]の前[まえ]で論[ろん]じ合い、人の子が隣人[りんじん]と論じ合うことができるように。"
  22: "数[かぞ]えられた年[とし]が来た。わたしは、もう引き返[かえ]すことのない道[みち]を行く。」"

notes:
  1: "Повествование: формула вводит речь Иова, вне кавычек. Ὑπολαβὼν δὲ Ιωβ λέγει — «и отвечал Иов и говорит». Слав. «Отвещав же иов, рече»."
  2: "Иов: Ἀκήκοα τοιαῦτα πολλά — «я слышал много такого»; παρακλήτορες κακῶν πάντες — «все вы утешители зол» (παρακλήτωρ — «утешитель»; κακῶν — «в бедах» или «приносящие зло»), двусмысленность сохранена (苦しみの中の慰め手). Син. «жалкие утешители все вы»."
  3: "Иов: τί γάρ; μὴ τάξις ἐστὶν ῥήμασιν πνεύματος — «что? разве есть порядок (предел) у слов ветра» (τάξις — «строй, порядок»); ἢ τί παρενοχλήσει σοι, ὅτι ἀποκρίνῃ — «или что тебе докучает, что ты отвечаешь» (παρενοχλέω). Слав. «еда чин есть во словесех ветра…»."
  4: "Иов: κἀγὼ καθ᾽ ὑμᾶς λαλήσω — «и я, как вы, буду говорить»; εἰ ὑπέκειτό γε ἡ ψυχὴ ὑμῶν ἀντὶ τῆς ἐμῆς — «если бы душа ваша лежала вместо моей» (ὑπόκειμαι — «быть подложенным»); ἐναλοῦμαι ὑμῖν ῥήμασιν — «наскачу на вас словами»; κινήσω καθ᾽ ὑμῶν κεφαλήν — «покачаю на вас головой». Слав. «наскочил бых на вы словесы…»."
  5: "Иов: εἴη ἰσχὺς ἐν τῷ στόματί μου — «да будет сила в устах моих»; κίνησιν χειλέων οὐ φείσομαι — «движения губ не пощажу» (φείδομαι). LXX буквально; Син. понимает как утешение («подкреплял бы вас языком моим»), в текст не внесено, двусмысленность сохранена."
  6: "Иов: ἐὰν λαλήσω, οὐκ ἀλγήσω τὸ τραῦμα — «если заговорю, не почувствую боль раны» (ἀλγέω — «болеть»); ἐὰν σιωπήσω, τί ἔλαττον τρωθήσομαι — «если замолчу, чем меньше буду уязвлён» (τιτρώσκω). Слав. «не возболю ли язвою… чим менше уязвен буду»."
  7: "Иов: νῦν δὲ κατάκοπόν με πεποίηκεν — «ныне же Он сделал меня изнурённым» (κατάκοπος); μωρόν, σεσηπότα — «глупым, сгнившим» (σήπω — «гнить»). Слав. добавляет «и ят мя», что в LXX относится к 16:8 (ἐπελάβου μου); по делению gr эта часть — в ст. 8."
  8: "Иов: ἐπελάβου μου — «ты взял меня» (ἐπιλαμβάνω); εἰς μαρτύριον ἐγενήθη — «это стало свидетельством»; ἀνέστη ἐν ἐμοὶ τὸ ψεῦδός μου — «восстала во мне ложь моя» (ψεῦδος); κατὰ πρόσωπόν μου ἀνταπεκρίθη — «против лица моего ответила». Тёмное: «ложь моя» — обвинение, будто я лжец; сохранено буквально."
  9: "Иов: ὀργῇ χρησάμενος κατέβαλέν με — «употребив гнев, низверг меня»; ἔβρυξεν ἐπ᾽ ἐμὲ τοὺς ὀδόντας — «скрежетал на меня зубами» (βρύχω); βέλη πειρατῶν αὐτοῦ ἐπ᾽ ἐμοὶ ἔπεσεν — «стрелы разбойников его пали на меня» (πειρατής — «разбойник»)."
  10: "Иов: ἀκίσιν ὀφθαλμῶν ἐνήλατο — «остриями очей наскочил» (ἀκίς — «остриё»; ἐνάλλομαι), т. е. сверкая глазами; ὀξεῖ ἔπαισέν με εἰς σιαγόνα — «острым ударил меня в щёку» (σιαγών — «челюсть, щека»); ὁμοθυμαδὸν κατέδραμον ἐπ᾽ ἐμοί — «единодушно сбежались на меня». Слав. «мечем порази мя в колена» (иное членение)."
  11: "Иов: παρέδωκεν γάρ με ὁ κύριος εἰς χεῖρας ἀδίκου — «ибо предал меня Господь в руки неправедного»; ἐπὶ ἀσεβέσιν ἔρριψέν με — «и к нечестивым бросил меня» (ῥίπτω)."
  12: "Иов: εἰρηνεύοντα διεσκέδασέν με — «мирного сокрушил меня» (διασκεδάννυμι); λαβών με τῆς κόμης διέτιλεν — «взяв меня за волосы, разорвал» (διατίλλω — «вырывать волосы»); κατέστησέν με ὥσπερ σκοπόν — «поставил меня как цель (мишень)» (σκοπός). Слав. «аки примету»."
  13: "Иов: ἐκύκλωσάν με λόγχαις βάλλοντες — «окружили меня, поражая копьями» (λόγχη); εἰς νεφρούς μου οὐ φειδόμενοι — «в почки (внутренности) мои не щадя»; ἐξέχεαν εἰς τὴν γῆν τὴν χολήν μου — «излили на землю жёлчь мою» (χολή). Слав. «во истесы моя» — иное чтение."
  14: "Иов: κατέβαλόν με πτῶμα ἐπὶ πτώματι — «низвергли меня падением на падение» (πτῶμα), т. е. удар за ударом; ἔδραμον πρός με δυνάμενοι — «прибежали ко мне сильные» (δύναμαι, прич.). Слав. «труп на труп… могущии»."
  15: "Иов: σάκκον ἔρραψα ἐπὶ βύρσης μου — «вретище я сшил на коже моей» (σάκκος — 粗布; βύρσα — «кожа»); τὸ σθένος μου ἐν γῇ ἐσβέσθη — «крепость моя на земле угасла» (σθένος; σβέννυμι)."
  16: "Иов: ἡ γαστήρ μου συγκέκαυται ἀπὸ κλαυθμοῦ — «чрево моё сожжено от плача» (συγκαίω); ἐπὶ βλεφάροις μου σκιά — «на веждах моих тень» (βλέφαρον — «веко»); слав. «стень смертная» добавляет «смертная» (死), чего в LXX нет; по паритету внесено в основной текст."
  17: "Иов: ἄδικον οὐδὲν ἦν ἐν χερσίν μου — «и не было неправды в руках моих»; εὐχὴ δέ μου καθαρά — «молитва же моя чиста» (εὐχή — «молитва, обет»)."
  18: "Иов: γῆ, μὴ ἐπικαλύψῃς ἐφ᾽ αἵματι τῆς σαρκός μου — «земля, не покрой [крови] над кровью плоти моей» (ἐπικαλύπτω); μηδὲ εἴη τόπος τῇ κραυγῇ μου — «и да не будет места воплю моему»: тёмное — либо крик не должен умолкнуть, либо ему нет места; сохранено 休む場所ができないように. Син. «не закрой моей крови…»."
  19: "Иов: ἐν οὐρανοῖς ὁ μάρτυς μου — «на небесах свидетель мой» (μάρτυς); ὁ συνίστωρ μου ἐν ὑψίστοις — «и сведущий мой в вышних» (συνίστωρ — «тот, кто знает вместе»); передано 事を知る者, чтобы не сгладить разницу с μάρτυς."
  20: "Иов: ἀφίκοιτό μου ἡ δέησις πρὸς κύριον — «да дойдёт моление моё к Господу» (ἀφικνέομαι; δέησις); ἔναντι αὐτοῦ στάζοι μου ὁ ὀφθαλμός — «пред Ним да каплет око моё» (στάζω — «капать»). Слав. «да каплет око мое»."
  21: "Иов: εἴη ἔλεγχος ἀνδρὶ ἔναντι κυρίου — «да будет обличение (состязание) человеку пред Господом» (ἔλεγχος); υἱὸς ἀνθρώπου τῷ πλησίον αὐτοῦ — «и сын человеческий — ближнему своему»: вторая половина без сказуемого, восполнена 論じ合う; Син. «о, если бы человек мог иметь состязание с Богом…»."
  22: "Иов: ἔτη ἀριθμητὰ ἥκασιν — «исчисленные годы пришли»; ὁδῷ, ᾗ οὐκ ἐπαναστραφήσομαι, πορεύσομαι — «путём, которым не возвращусь, пойду» (ἐπαναστρέφω). Здесь речь Иова прерывается на границе главы: она продолжается в 17:1 без новой формулы (кавычка закрыта для баланса главы и открывается вновь в 17:1)."
