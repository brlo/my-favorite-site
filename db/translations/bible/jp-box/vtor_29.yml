# jp-box, Второзаконие, глава 29. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в гл. 29 отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 29: завет в земле Моавитской (1); речь Моисея — что видели в Египте и в пустыне (2–8),
# призыв хранить завет (9), предстоящие пред Господом (10–13), завет не только с ними (14–15),
# предостережение против тайного отступничества (16–21), будущее запустение и вопрос народов
# (22–28), сокрытое и открытое (29).
# Кавычки: 29:1 — повествование; 29:2–29 — речь Моисея, 「…」 (глава кончается закрытой цитатой,
# как Левит 1/2, хотя глава 30 продолжает ту же речь). Слова народов внутри речи — 『…』 (24–26).
# 〔…〕: 29:3 — «крепкая рука и высокая мышца» (βραχίων, ἰσχύς) есть в csl-ru, в gr-lxx-byz нет
# (проверено: bracket_check «βραχι» — НЕТ, «ισχυ» — НЕТ).
# Сносок ⟨…⟩ нет: 契約, 嗣業, 寄留者, 裁き人, 監督 уже в корпусе или прозрачны.
# Отличия LXX: 29:19 — «чтобы грешник не погубил вместе с собою непорочного» (в ru по
# масоретскому — «сытый с голодным»); 29:26 — «которых не знали и не назначил им» (ru иначе);
# 29:15 — «с нами», а в csl «с вами». jp-ni не использовался.

