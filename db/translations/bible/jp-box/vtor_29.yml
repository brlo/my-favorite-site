verses:
  1: "これらは、主[しゅ]がモーセに命[めい]じて、モアブの地[ち]でイスラエルの子[こ]らと立[た]てさせた契約[けいやく]の言葉[ことば]である。ただし、ホレブで彼[かれ]らと結[むす]ばれた契約とは別[べつ]である。"
  2: "モーセはイスラエルの子[こ]らをすべて呼[よ]び集[あつ]め、彼[かれ]らに言[い]った。「あなたがたは、主[しゅ]がエジプトの地[ち]で、あなたがたの目[め]の前[まえ]で、ファラオとその僕[しもべ]たち、およびその全[ぜん]土[ど]に行[おこな]われたすべてのことを見[み]た。"
  3: "すなわち、あの大[おお]きな試[こころ]み、あなたの目[め]が見[み]たもの、あの大きな印[しるし]と奇[き]跡[せき]、〔強[つよ]い腕[うで]と高[たか]く上[あ]げられた御腕[みうで]〕である。"
  4: "主[しゅ]は、あなたがたに知[し]る心[こころ]も、見[み]る目[め]も、聞[き]く耳[みみ]も、今日[きょう]に至[いた]るまで与[あた]えられなかった。"
  5: "主[しゅ]は四十年[よんじゅうねん]の間[あいだ]、あなたがたを荒野[こうや]で導[みちび]かれた。あなたがたの衣服[いふく]は古[ふる]びず、あなたがたの履[は]き物[もの]も足[あし]からすり減[へ]らなかった。"
  6: "あなたがたはパンを食[た]べず、ぶどう酒[しゅ]も強[つよ]い酒[さけ]も飲[の]まなかった。それは、この方[かた]こそあなたがたの神[かみ]であられる主[しゅ]であることを、あなたがたが知[し]るためである。"
  7: "あなたがたがこの場所[ばしょ]まで来[き]たとき、エセボンの王[おう]シホンとバシャンの王オグが戦[いくさ]のためにわたしたちを迎[むか]えに進[すす]み出[で]て来た。わたしたちは彼[かれ]らを撃[う]ち、"
  8: "その地[ち]を取[と]って、くじによってルベンとガドとマナセの部族[ぶぞく]の半[はん]分[ぶん]に与[あた]えた。"
  9: "あなたがたはこの契約[けいやく]のすべての言葉[ことば]を守[まも]って行[おこな]いなさい。そうすれば、あなたがたが行うすべてのことに悟[さと]りを得[え]るであろう。"
  10: "あなたがたは今日[きょう]、あなたがたの神[かみ]であられる主[しゅ]の前[まえ]に、すべて立[た]っている。あなたがたの部族[ぶぞく]の長[ちょう]、あなたがたの長老[ちょうろう]、あなたがたの裁[さば]き人[びと]、あなたがたの監督[かんとく]たち、イスラエルのすべての男[おとこ]たち、"
  11: "あなたがたの女[おんな]たち、あなたがたの子[こ]どもたち、あなたがたの陣営[じんえい]の中[なか]にいる寄留者[きりゅうしゃ]、あなたがたの薪[たきぎ]を割[わ]る者[もの]から水[みず]を汲[く]む者に至[いた]るまで、"
  12: "あなたの神[かみ]であられる主[しゅ]の契約[けいやく]と、今日[きょう]、あなたの神であられる主があなたと定[さだ]められるその呪[のろ]いとに入[はい]るためである。"
  13: "それは、主[しゅ]があなたを御自身[ごじしん]の民[たみ]として立[た]て、あなたの神[かみ]となるためである。主があなたに語[かた]られたとおりに、またあなたの父祖[ふそ]アブラハム、イサク、ヤコブに誓[ちか]われたとおりに。"
  14: "わたしはこの契約[けいやく]とこの呪[のろ]いを、あなたがただけと結[むす]ぶのではない。"
  15: "今日[きょう]、あなたがたの神[かみ]である主[しゅ]の前[まえ]にわたしたちとともにここにいる者[もの]たちとも、今日ここにわたしたちといない者たちとも、結[むす]ぶのである。"
  16: "あなたがたは知[し]っている。わたしたちがエジプトの地[ち]にどのように住[す]んでいたか、あなたがたが通[とお]って来[き]た諸国[しょこく]の民[たみ]のただ中[なか]を、わたしたちがどのように通って来たかを。"
  17: "また、あなたがたは彼[かれ]らの憎[にく]むべきもの、彼らの偶像[ぐうぞう]を見[み]た。木[き]や石[いし]、銀[ぎん]や金[きん]で、彼らのもとにあるものを。"
  18: "あなたがたのうちに、男[おとこ]であれ女[おんな]であれ、氏族[しぞく]であれ部族[ぶぞく]であれ、その心[こころ]があなたがたの神[かみ]である主[しゅ]から離[はな]れて、あの諸国[しょこく]の民[たみ]の神々[かみがみ]に仕[つか]えるために行[い]こうとする者[もの]があってはならない。あなたがたのうちに、上[うえ]へ伸[の]びる根[ね]が、胆汁[たんじゅう]と苦[にが]さの中[なか]にあってはならない。"
  19: "もし、この呪[のろ]いの言葉[ことば]を聞[き]いても、心[こころ]のうちで自[みずか]らを祝[いわ]って『わたしには平和[へいわ]がある。たとえ心の迷[まよ]いに従[したが]って歩[ある]んでも』と言[い]う者[もの]があるなら、罪[つみ]深[ふか]い者が罪なき者を共[とも]に滅[ほろ]ぼさないために、"
  20: "主[しゅ]はその者[もの]を赦[ゆる]すことを望[のぞ]まれない。むしろそのとき、主の怒[いか]りとその嫉妬[しっと]がその人[ひと]の上[うえ]に燃[も]え上[あ]がり、この契約[けいやく]のすべての呪[のろ]い、この律法[りっぽう]の書[しょ]に書[か]かれているものが、その者に付[つ]きまとう。主はその名[な]を天[てん]の下[した]から消[け]し去[さ]られる。"
  21: "主[しゅ]はその者[もの]を、イスラエルのすべての子[こ]らの中[なか]から災[わざわ]いのために選[えら]び分[わ]け、この律法[りっぽう]の書[しょ]に書[か]かれたこの契約[けいやく]のすべての呪[のろ]いに照[て]らして、そうされる。"
  22: "次[つぎ]の世代[せだい]、あなたがたの後[あと]に起[お]こるあなたがたの子[こ]らと、遠[とお]い地[ち]から来[き]た異国人[いこくじん]は言[い]うであろう。彼[かれ]らはあの地の災[わざわ]いと、主[しゅ]がその地に下[くだ]された病[やまい]とを見[み]て、"
  23: "その全[ぜん]土[ど]が硫黄[いおう]と塩[しお]で焼[や]き尽[つ]くされ、種[たね]をまいても芽[め]は出[で]ず、そこには何[なに]一つ青[あお]いものも生[は]えないのを。ソドムとゴモラ、アドマとセボイムが、主[しゅ]が憤[いきどお]りと怒[いか]りをもって滅[ほろ]ぼされたときのように。"
  24: "すべての民[たみ]は言[い]うであろう。『なぜ主[しゅ]はこの地[ち]にこのようにされたのか。この大[おお]きな怒[いか]りの激[はげ]しさは何[なに]なのか。』"
  25: "そして彼[かれ]らは言[い]うであろう。『彼らが、彼らの父祖[ふそ]たちの神[かみ]である主[しゅ]の契約[けいやく]、すなわち、主が彼らをエジプトの地[ち]から導[みちび]き出[だ]されたときに、彼らの父祖たちと結[むす]ばれた契約を捨[す]てたからである。"
  26: "彼[かれ]らは行[い]って、自分[じぶん]たちが知[し]らなかった神々[かみがみ]、主[しゅ]が彼[かれ]らに何[なに]も割[わ]り当[あ]てられなかった神々に仕[つか]え、それらにひれ伏[ふ]した。』"
  27: "主[しゅ]はあの地[ち]に対して怒[いか]りを燃[も]やし、この律法[りっぽう]の書[しょ]に書[か]かれているすべての呪[のろ]いを、その上[うえ]に下[くだ]そうとされた。"
  28: "主[しゅ]は怒[いか]りと憤[いきどお]りと大[おお]きな激怒[げきど]をもって、彼[かれ]らをその地[ち]から引[ひ]き抜[ぬ]き、別[べつ]の地に投[な]げ捨[す]てられた。今[いま]もそうである。"
  29: "隠[かく]されていることは、わたしたちの神[かみ]であられる主[しゅ]のものであり、現[あらわ]されていることは、わたしたちとわたしたちの子[こ]らのものであって、永遠[えいえん]にこの律法[りっぽう]のすべての言葉[ことば]を行[おこな]うためである。」"

notes:
  1: "Οὗτοι οἱ λόγοι τῆς διαθήκης — слова завета. ἐνετείλατο κύριος Μωυσῇ στῆσαι — Господь повелел Моисею поставить (завет). πλὴν τῆς διαθήκης ἧς διέθετο ἐν Χωρηβ — кроме завета, который Он поставил в Хориве; πλήν здесь «кроме, помимо»."
  2: "ἐκάλεσεν … πάντας τοὺς υἱοὺς Ισραηλ — созвал всех сынов Израиля. ἑωράκατε — вы видели (perfect с настоящим значением). ἐνώπιον ὑμῶν Φαραω — пред вами фараону (датив). θεράπων — слуга, раб (僕)."
  3: "πειρασμοί — испытания (в ru «казни»). οἱ ὀφθαλμοί σου — глаза твои (переход на ед. ч.). σημεῖα καὶ τέρατα — знамения и чудеса. В gr стих кончается на ἐκεῖνα; «крепкую руку и высокую мышцу» (βραχίων, ἰσχύς) добавляет csl-ru — отсюда 〔…〕."
  4: "οὐκ ἔδωκεν κύριος … καρδίαν εἰδέναι — не дал Господь сердца знать. καί не противительный, а продолжающий; в ru «но до сего дня». Три дополнения: сердце, глаза, уши."
  5: "ἤγαγεν — вёл (ἄγω). τεσσαράκοντα ἔτη — сорок лет. ἐπαλαιώθη — обветшало (παλαιόω). ὑποδήματα — обувь. κατετρίβη ἀπὸ τῶν ποδῶν — не истёрлась с ног."
  6: "ἄρτον οὐκ ἐφάγετε — хлеба не ели. σίκερα — сикер, крепкий напиток (強い酒, ср. Лев 10:9). ἵνα γνῶτε — чтобы вы знали. οὗτος κύριος ὁ θεὸς ὑμῶν — «сей есть Господь Бог ваш» (в ru добавлено «Я»)."
  7: "Σηων βασιλεὺς Εσεβων — Сигон, царь Есевонский (エセボン); Ωγ βασιλεὺς τῆς Βασαν — Ог, царь Васанский. εἰς συνάντησιν ἡμῖν ἐν πολέμῳ — навстречу нам на войну. ἐπατάξαμεν — мы поразили. В gr нет точки в конце: стих переходит в 8."
  8: "ἐλάβομεν τὴν γῆν αὐτῶν — взяли землю их. ἐν κλήρῳ — в жребий, в удел. τῷ ἡμίσει φυλῆς Μανασση — половине колена Манассии. В csl в начале стиха повторено «и поразихом их на брани» (из 7), в gr этого нет."
  9: "φυλάξεσθε ποιεῖν — соблюдайте исполнять. ἵνα συνῆτε — чтобы вы разумели (συνίημι; в ru «иметь успех» по масоретскому смыслу). ὅσα ποιήσετε — всё, что ни сделаете."
  10: "ἑστήκατε — стоите (perfect). ἀρχίφυλοι — начальники колен. γερουσία — старейшины. κριταί — судьи. γραμματοεισαγωγεῖς — «книговодители» (監督; слав. «писмовводители»). πᾶς ἀνὴρ Ισραηλ — всякий муж Израилев."
  11: "γυναῖκες — жёны (в gr на первом месте; в ru — дети). ἔκγονα — потомство. προσήλυτος ἐν μέσῳ τῆς παρεμβολῆς — пришелец посреди стана. ἀπὸ ξυλοκόπου ἕως ὑδροφόρου — от дровосека до водоноса, т. е. все до последнего."
  12: "παρελθεῖν ἐν τῇ διαθήκῃ — вступить в завет. ἀραί — проклятия, заклятия (в csl «клятвы»). ὅσα … διατίθεται πρὸς σέ — которые … поставляет с тобою. Стих завершает перечисление 10–11."
  13: "στήσῃ σε αὐτῷ εἰς λαόν — поставит тебя Себе в народ. αὐτὸς ἔσται σου θεός — Он будет тебе Богом. ὃν τρόπον — как. ὤμοσεν τοῖς πατράσιν — клялся отцам."
  14: "οὐχ ὑμῖν μόνοις — не вам только. διατίθεμαι — поставляю (завет). ἀρά — проклятие/заклятие, здесь синоним заветной клятвы."
  15: "τοῖς ὧδε οὖσιν μεθ᾽ ἡμῶν — тем, кто здесь с нами (в csl «с вами»). τοῖς μὴ οὖσιν — тем, кого здесь нет; речь о будущих поколениях."
  16: "κατῳκήσαμεν — мы жили (κατοικέω). παρήλθομεν ἐν μέσῳ τῶν ἐθνῶν — прошли среди народов. οὓς παρήλθετε — через которые вы прошли (вин. при παρέρχομαι)."
  17: "βδελύγματα — мерзости. εἴδωλα — идолы. ξύλον καὶ λίθον, ἀργύριον καὶ χρυσίον — дерево и камень, серебро и золото. ἅ ἐστιν παρ᾽ αὐτοῖς — что у них есть."
  18: "μή τις … ἀνήρ ἢ γυνή — да не будет мужчина или женщина. πατριά — род (слав. «отечество»). φυλή — колено. διάνοια — мысль, расположение. ἐξέκλινεν — уклонилась. ῥίζα ἄνω φύουσα ἐν χολῇ καὶ πικρίᾳ — корень, вверх произрастающий, в желчи и горечи (ср. Евр 12:15)."
  19: "ἐπιφημίσηται ἐν τῇ καρδίᾳ — благословит себя в сердце (ἐπιφημίζω; слав. «похвалится»). Ὁσιά μοι γένοιτο — «да будет мне свято/благо», т. е. «я буду счастлив». ἀποπλάνησις — заблуждение. ἵνα μὴ συναπολέσῃ ὁ ἁμαρτωλὸς τὸν ἀναμάρτητον — чтобы грешник не погубил вместе с собою непорочного (в ru по масоретскому: «сытый с голодным»)."
  20: "οὐ μὴ θελήσῃ … εὐιλατεῦσαι — не пожелает умилостивиться, простить (εὐιλατεύω). ἐκκαυθήσεται — возгорится. ζῆλος — ревность, ярость. κολληθήσονται ἐν αὐτῷ — прилепятся к нему. ἐξαλείψει τὸ ὄνομα — изгладит имя. ὑπὸ τὸν οὐρανόν — под небом."
  21: "διαστελεῖ αὐτὸν εἰς κακά — отделит его на злое, на беду (διαστέλλω). ἐκ πάντων τῶν υἱῶν Ισραηλ — из всех сынов Израиля. κατὰ πάσας τὰς ἀράς — по всем проклятиям."
  22: "ἡ γενεὰ ἡ ἑτέρα — иной род, следующее поколение. οἳ ἀναστήσονται μεθ᾽ ὑμᾶς — которые восстанут после вас. ἀλλότριος — чужеземец. πληγαί — язвы, поражения. Долгий период: ἐροῦσιν (скажут) в 22, затем ὄψονται (увидят) в 22; ответ народов — в 24–26."
  23: "θεῖον καὶ ἅλα κατακεκαυμένον — сера и соль сожжённая. οὐ σπαρήσεται — не будет засеяна. οὐδὲ ἀνατελεῖ — и не произрастёт. πᾶν χλωρόν — всё зелёное. Σοδομα, Γομορρα, Αδαμα, Σεβωιμ — Содом, Гоморра, Адма, Севоим. ἐν θυμῷ καὶ ὀργῇ — в ярости и гневе."
  24: "πάντα τὰ ἔθνη — все народы. Διὰ τί — почему. τίς ὁ θυμὸς τῆς ὀργῆς ὁ μέγας οὗτος — «какая это великая ярость гнева». Слова народов — 『…』."
  25: "κατελίποσαν — оставили. διαθήκη κυρίου τοῦ θεοῦ τῶν πατέρων αὐτῶν — завет Господа Бога отцов их. ἃ διέθετο — который поставил. ὅτε ἐξήγαγεν — когда вывел."
  26: "ἐλάτρευσαν θεοῖς ἑτέροις — служили иным богам. προσεκύνησαν — поклонились. οἷς οὐκ ἠπίσταντο — которых не знали. οὐδὲ διένειμεν αὐτοῖς — и не назначил, не уделил им (в csl «не даде им ничтоже ни един»)."
  27: "ὠργίσθη θυμῷ — воспылал гневом. ἐπαγαγεῖν ἐπ᾽ αὐτήν — навести на неё. κατὰ πάσας τὰς κατάρας — по всем проклятиям. Инфинитив цели: «чтобы навести»."
  28: "ἐξῆρεν — изъял, исторг. ἐν θυμῷ καὶ ὀργῇ καὶ παροξυσμῷ μεγάλῳ σφόδρα — в ярости, гневе и весьма великом раздражении. ἐξέβαλεν εἰς γῆν ἑτέραν — изверг в иную землю. ὡσεὶ νῦν — как ныне."
  29: "τὰ κρυπτά — сокрытое; τὰ φανερά — явное. κυρίῳ τῷ θεῷ ἡμῶν — Господу Богу нашему (датив принадлежности). εἰς τὸν αἰῶνα — до века. Конец речи Моисея; глава 30 продолжает её."
