verses:
  1: "「<j>天[てん]の国[くに]は、朝[あさ]早[はや]く自分[じぶん]のぶどう園[えん]に働[はたら]き手[て]を雇[やと]いに出[で]かけた家[いえ]の主人[しゅじん]に似[に]ている。</j>"
  2: "<j>主人[しゅじん]は、一[いち]日[にち]につき一[いち]デナリオンで働[はたら]き手[て]たちと約束[やくそく]し、彼[かれ]らをぶどう園[えん]へやった。</j>"
  3: "<j>朝[あさ]の九時[くじ]ごろに出[で]て行[い]くと、市場[いちば]に何[なに]もせずに立[た]っている者[もの]たちがいたので、</j>"
  4: "<j>彼[かれ]らに『あなたがたもぶどう園[えん]へ行[い]きなさい。正当[せいとう]な賃金[ちんぎん]を払[はら]う』と言[い]った。</j>"
  5: "<j>彼[かれ]らは出[で]かけて行[い]った。主人[しゅじん]はまた、十二時[じゅうにじ]ごろと三時[さんじ]ごろにも出[で]て行[い]って、同[おな]じようにした。</j>"
  6: "<j>五時[ごじ]ごろにも出[で]て行[い]くと、まだ立[た]っている者[もの]たちがいたので、『なぜ、一[いち]日[にち]中[じゅう]ここに立[た]って何[なに]もしないのか』と言[い]った。</j>"
  7: "<j>彼[かれ]らは『だれもわたしたちを雇[やと]ってくれなかったからです』と言[い]った。主人[しゅじん]は『あなたがたもぶどう園[えん]へ行[い]きなさい。〔受[う]けるべきものは受[う]けるだろう〕』と言[い]った。</j>"
  8: "<j>夕方[ゆうがた]になると、ぶどう園[えん]の主人[しゅじん]は管理人[かんりにん]に言[い]った。『働[はたら]き手[て]たちを呼[よ]んで、最後[さいご]に来[き]た者[もの]から始[はじ]めて、最初[さいしょ]の者[もの]まで賃金[ちんぎん]を払[はら]いなさい。』</j>"
  9: "<j>五時[ごじ]ごろに呼[よ]ばれた者[もの]たちも来[き]て、一人[ひとり]一[いち]デナリオンずつ受[う]け取[と]った。</j>"
  10: "<j>最初[さいしょ]の者[もの]たちが来[き]て、もっと多[おお]くもらえると思[おも]っていたが、彼[かれ]らも一[いち]デナリオンずつ受[う]け取[と]った。</j>"
  11: "<j>そこで、彼[かれ]らはそれを受[う]け取[と]って、家[いえ]の主人[しゅじん]に不平[ふへい]を言[い]った。</j>"
  12: "<j>『この最後[さいご]の者[もの]たちは一時間[いちじかん]しか働[はたら]かなかったのに、あなたは、一[いち]日[にち]の重[おも]い労働[ろうどう]と暑[あつ]さに耐[た]えたわたしたちと同[おな]じにしたのですか。』</j>"
  13: "<j>主人[しゅじん]は一人[ひとり]に答[こた]えて言[い]った。『友[とも]よ、わたしはあなたに不正[ふせい]をしていない。あなたはわたしと一[いち]デナリオンで約束[やくそく]したではないか。</j>"
  14: "<j>あなたの分[ぶん]を持[も]って帰[かえ]るがよい。この最後[さいご]の者[もの]にも、わたしはあなたと同[おな]じ額[がく]を払[はら]ってやりたい。</j>"
  15: "<j>わたしが自分[じぶん]の物[もの]を思[おも]うままに使[つか]うのは、許[ゆる]されないことか。それとも、わたしが善[よ]いからといって、あなたの目[め]は悪[わる]いのか。』</j>"
  16: "<j>このように、後[あと]の者[もの]が先[さき]になり、先[さき]の者[もの]が後[あと]になる。〔召[め]される者[もの]は多[おお]いが、選[えら]ばれる者[もの]は少[すく]ない。〕</j>」"
  17: "エルサレムへ上[のぼ]る途上[とじょう]、イエスは十二人[じゅうににん]の弟子[でし]たちだけをわきへ呼[よ]び、道[みち]で彼[かれ]らに話[はな]し始[はじ]められた。"
  18: "「<j>これからわたしたちはエルサレムへ上[のぼ]る。すると、人[ひと]の子[こ]は祭司長[さいしちょう]たちと律法学者[りっぽうがくしゃ]たちの手[て]に渡[わた]され、彼[かれ]らは人[ひと]の子[こ]を死[し]に定[さだ]める。</j>"
  19: "<j>そして、人[ひと]の子[こ]を異邦人[いほうじん]に引[ひ]き渡[わた]して、嘲[あざけ]り、鞭打[むちう]ち、十字架[じゅうじか]につけさせる。人[ひと]の子[こ]は三日[みっか]目[め]に復活[ふっかつ]する。</j>」"
  20: "そのとき、ゼベダイの子[こ]たちの母[はは]が、息子[むすこ]たちと一緒[いっしょ]にイエスのところへ来[き]てひれ伏[ふ]し、何[なに]かお願[ねが]いしたいと申[もう]し出[で]た。"
  21: "イエスが「<j>何[なに]をしてほしいのか</j>」と言[い]われると、彼女[かのじょ]は言[い]った。「この二人[ふたり]の息子[むすこ]が、あなたの国[くに]で、一人[ひとり]はあなたの右[みぎ]に、一人[ひとり]は左[ひだり]に座[すわ]れるようにしてください。」"
  22: "イエスはお答[こた]えになって言[い]われた。「<j>あなたがたは、自分[じぶん]が何[なに]を願[ねが]っているのか分[わ]かっていない。わたしが飲[の]もうとしている杯[さかずき]を飲[の]み、〔わたしが受[う]ける洗礼[せんれい]も受[う]ける〕ことができるか。</j>」彼[かれ]らは「できます」と言[い]った。"
  23: "イエスは言[い]われた。「<j>あなたがたは確[たし]かに、わたしの杯[さかずき]を飲[の]み、〔わたしが受[う]ける洗礼[せんれい]も受[う]ける。〕しかし、わたしの右[みぎ]や左[ひだり]に座[すわ]ることは、わたしが与[あた]えることではない。わたしの父[ちち]が備[そな]えてくださった人々[ひとびと]に与[あた]えられるものである。</j>」"
  24: "十人[じゅうにん]の弟子[でし]たちはこれを聞[き]いて、二人[ふたり]の兄弟[きょうだい]に腹[はら]を立[た]てた。"
  25: "イエスは一同[いちどう]を呼[よ]び寄[よ]せて言[い]われた。「<j>あなたがたも知[し]っているとおり、異邦人[いほうじん]の支配者[しはいしゃ]たちは民[たみ]を思[おも]いのままに支配[しはい]し、偉[えら]い者[もの]たちは権力[けんりょく]を振[ふ]るいまわしている。</j>"
  26: "<j>あなたがたの間[あいだ]では、そうではない。あなたがたの中[なか]で大[おお]きくなろうとする者[もの]は、あなたがたの召[めし]使[つか]いにならなければならない。</j>"
  27: "<j>第一[だいいち]になりたい者[もの]は、あなたがたの僕[しもべ]となりなさい。</j>"
  28: "<j>人[ひと]の子[こ]も、仕[つか]えてもらうためではなく仕[つか]えるために、また多[おお]くの人[ひと]の贖[あがない]として自分[じぶん]の命[いのち]を差[さ]し出[だ]すために来[き]たのである。</j>」"
  29: "彼[かれ]らがエリコを出[で]て行[い]くと、大勢[おおぜい]の群衆[ぐんしゅう]がイエスに従[したが]った。"
  30: "すると、道端[みちばた]に座[すわ]っていた二人[ふたり]の盲人[もうじん]が、イエスが通[とお]りかかると聞[き]いて、「〔主[しゅ]よ、〕ダビデの子[こ]よ、わたしたちを憐[あわ]れんでください」と叫[さけ]んだ。"
  31: "群衆[ぐんしゅう]は彼[かれ]らを叱[しか]って黙[だま]らせようとしたが、彼[かれ]らはますます大声[おおごえ]で「主[しゅ]よ、ダビデの子[こ]よ、わたしたちを憐[あわ]れんでください」と叫[さけ]び続[つづ]けた。"
  32: "イエスは立[た]ち止[ど]まって彼[かれ]らを呼[よ]び、「<j>何[なに]をしてほしいのか</j>」と言[い]われた。"
  33: "二人[ふたり]は言[い]った。「主[しゅ]よ、わたしたちの目[め]が開[ひら]くようにしてください。」"
  34: "イエスは深[ふか]く憐[あわ]れみを抱[いだ]いて、彼[かれ]らの目[め]に触[ふ]れられた。すると、すぐに目[め]が見[み]えるようになり、彼[かれ]らはイエスに従[したが]った。"

notes:
  2: "δηνάριον — римская серебряная монета, дневной заработок; первое упоминание в Мф, отсюда сноска."
  7: "Церковь добавляет καὶ ὃ ἐὰν ᾖ δίκαιον λήψεσθε (jp-joc: 然らば至當の者を受けん); в критической базе нет — 〔…〕."
  16: "Церковь добавляет πολλοὶ γάρ εἰσιν κλητοὶ ὀλίγοι δὲ ἐκλεκτοί (jp-joc) — в критической базе нет, целиком в 〔〕."
  22: "Церковь читает и βαπτισθήσεσθε («крещением, которым Я крещусь, креститесь»; jp-joc: 我が受くる洗を受くることを能するか) — гармонизация с Мк 10:38; в критической базе только чаша, поэтому добавка в 〔〕. Так же в ст. 23."
  30: "κύριε в критической базе в квадратных скобках; Церковь читает — 〔主よ〕."
