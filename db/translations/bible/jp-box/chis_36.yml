# jp-box, Числа, глава 36. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в этой главе нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 36: просьба начальников Галаада о дочерях Салпаада (1–4), слово Господа
# о браке внутри рода (5–9), исполнение (10–12), заключительная формула (13).
# Речь: 2–4 — речь начальников 「…」; 5–9 — речь Моисея 「…」, внутри неё слова
# Господа (6–9) — 『…』, закрываются в конце 9-го стиха вместе с речью Моисея.
# Красного нет. Сносок ⟨…⟩ нет: 嗣業, 氏族, 部族, くじ, 父の家 уже в корпусе.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (сверено bracket_check.rb),
# в том числе ἔναντι Ελεαζαρ в 36:1 (bracket_check «36:1:ελεαζαρ» — ЕСТЬ;
# в ru это упоминание опущено).
# Имена: サルパアデ, マフラ, ノア, ホグラ, ミルカ, ティルツァ — формы 26:33; 27:1.
# В 36:11 порядок имён по LXX: Θερσα, Εγλα, Μελχα, Νουα, Μααλα.
# LXX/слав. расхождения: 36:4 ἡ ἄφεσις — «отпущение», т. е. юбилей (ヨベルの年;
# ср. Лев 25:10); 36:5 Οὕτως … λέγουσιν — «так говорят» (ru «правду говорит»);
# 36:6 Οὗ ἀρέσκει ἐναντίον αὐτῶν — «кто угоден пред ними» (ru «кто понравится
# глазам их»); 36:7 προσκολληθήσονται — «прилепятся» (слав. «женитися имут»);
# 36:11 в csl первая клауза ст. 12 («от сонма манассиина… быша в жены») отнесена
# к ст. 11, поэтому деление 11/12 в csl иное — стих переведён по делению gr.
# jp-ni не использовался.

tr_code: jp-box
book: chis
chapter: 36
draft: true

verses:
  1: "マナセの子[こ]であるマキルの子、ギレアデの子らの部族[ぶぞく]の長[かしら]たちが、ヨセフの子らの部族のうちから近[ちか]づいた。彼[かれ]らはモーセと祭司[さいし]エレアザル、およびイスラエルの子らの氏族[しぞく]の家[いえ]の長たちの前[まえ]で語[かた]った。"
  2: "「主[しゅ]はわたしたちの主人[しゅじん]に、イスラエルの子[こ]らに嗣業[しぎょう]の地[ち]をくじによって与[あた]えるよう命[めい]じられた。また主は、わたしたちの主人に、わたしたちの兄弟[きょうだい]サルパアデの嗣業をその娘[むすめ]たちに与えるよう命じられた。"
  3: "ところが、もし彼女[かのじょ]たちがイスラエルの子[こ]らの部族[ぶぞく]の一[ひと]つの者[もの]の妻[つま]になれば、彼女たちのくじは、わたしたちの父[ちち]たちの所有[しょゆう]から取[と]り去[さ]られ、彼女たちが妻となる部族の嗣業[しぎょう]に加[くわ]えられ、わたしたちの嗣業のくじから取り去られるであろう。"
  4: "そして、イスラエルの子[こ]らにヨベルの年[とし]が来[く]ると、彼女[かのじょ]たちの嗣業[しぎょう]は、彼女たちが妻[つま]となる部族[ぶぞく]の嗣業に加えられ、わたしたちの父[ちち]の氏族[しぞく]の部族の嗣業から、彼女たちの嗣業が取り去られるであろう。」"
  5: "モーセは、主[しゅ]の命令[めいれい]によって、イスラエルの子[こ]らに命[めい]じて言[い]った。「ヨセフの子[こ]らの部族[ぶぞく]が言[い]うことは、そのとおりである。"
  6: "サルパアデの娘[むすめ]たちについて、主[しゅ]が命[めい]じられた言葉[ことば]は次[つぎ]のとおりである。『彼女[かのじょ]たちの目[め]にかなう者[もの]の妻[つま]になってよい。ただ、父[ちち]の氏族[しぞく]のうちの者の妻にならなければならない。"
  7: "イスラエルの子[こ]らの嗣業[しぎょう]が、部族[ぶぞく]から部族へ移[うつ]ってはならない。イスラエルの子らは、おのおの、その父[ちち]の氏族の部族の嗣業に固[かた]く結[むす]びつくからである。"
  8: "イスラエルの子[こ]らの部族[ぶぞく]のうちで嗣業[しぎょう]を受[う]け継[つ]ぐ娘[むすめ]はだれでも、その父[ちち]の氏族[しぞく]のうちの一[ひと]つの者[もの]の妻[つま]にならなければならない。そうすれば、イスラエルの子らはおのおの、その父の嗣業を受け継ぐことができる。"
  9: "そして、くじが部族[ぶぞく]から他[ほか]の部族へ移ってはならない。イスラエルの子[こ]らは、おのおの自分[じぶん]の嗣業[しぎょう]に固[かた]く結びつくのである。』」"
  10: "主[しゅ]がモーセに命[めい]じられたとおりに、サルパアデの娘[むすめ]たちは行[おこな]った。"
  11: "ティルツァ、ホグラ、ミルカ、ノア、マフラは、サルパアデの娘[むすめ]たちであり、いとこたちの妻[つま]となった。"
  12: "彼女[かのじょ]たちは、ヨセフの子[こ]マナセの氏族[しぞく]の者[もの]の妻[つま]となり、その嗣業[しぎょう]は父[ちち]たちの氏族の部族[ぶぞく]にとどまった。"
  13: "これらは、主[しゅ]がモーセの手[て]によって、モアブの西[にし]、ヨルダン川[がわ]のほとり、エリコに面[めん]した所[ところ]でイスラエルの子[こ]らに命[めい]じられた戒[いまし]めと定[さだ]めと裁[さば]きである。"

notes:
  1: "οἱ ἄρχοντες φυλῆς υἱῶν Γαλααδ υἱοῦ Μαχιρ υἱοῦ Μανασση — начальники племени сынов Галаада, сына Махира, сына Манассии (цепь родительных). ἐκ τῆς φυλῆς υἱῶν Ιωσηφ — из племени сынов Иосифа. ἔναντι Ελεαζαρ — пред Елеазаром (в ru это упоминание опущено). ἄρχοντες οἴκων πατριῶν — начальники домов отцов (氏族の家の長)."
  2: "Τῷ κυρίῳ ἡμῶν — «господину нашему», т. е. Моисею (κύριος здесь о человеке, поэтому 主人, а не 主). ἀποδοῦναι — «отдать». ἐν κλήρῳ — по жребию. τῷ κυρίῳ συνέταξεν κύριος — «господину нашему заповедал Господь» (κύριος дважды, о разных лицах)."
  3: "ἔσονται ἑνὶ τῶν φυλῶν … γυναῖκες — «будут женами одному из племён» (дат.). ἀφαιρεθήσεται — «отнимется» (ἀφαιρέω). προστεθήσεται εἰς κληρονομίαν — «приложится к уделу» (προστίθημι). οἷς ἂν γένωνται γυναῖκες — «кому станут жёнами»."
  4: "ἡ ἄφεσις τῶν υἱῶν Ισραηλ — «отпущение сынов Израиля» (ἄφεσις; в Лев 25:10 так назван юбилей, ヨベルの年). προστεθήσεται … ἀφαιρεθήσεται — ср. ст. 3. φυλῆς πατριᾶς ἡμῶν — «племени отцовства нашего» (πατριά)."
  5: "διὰ προστάγματος κυρίου — «по повелению Господню» (πρόσταγμα). Οὕτως … λέγουσιν — «так говорят» (в ru «правду говорит» — толкование). Речь Моисея — с этого стиха."
  6: "τοῦτο τὸ ῥῆμα, ὃ συνέταξεν κύριος — «вот слово, которое заповедал Господь». Οὗ ἀρέσκει ἐναντίον αὐτῶν — «кто угоден пред ними» (ἀρέσκω). πλὴν ἐκ τοῦ δήμου τοῦ πατρὸς αὐτῶν — «только из рода отца их» (δῆμος — 氏族). Слова Господа внутри речи Моисея — 『…』 (6–9)."
  7: "περιστραφήσεται — «перейдёт, обратится» (περιστρέφω). προσκολληθήσονται — «прилепятся» (προσκολλάω; слав. передаёт «женитися имут» — толкование). τῆς πατριᾶς αὐτοῦ — «отцовства своего»."
  8: "θυγάτηρ ἀγχιστεύουσα κληρονομίαν — «дочь, наследующая удел» (ἀγχιστεύω — наследовать как близкая родственница). ἵνα ἀγχιστεύσωσιν … τὴν κληρονομίαν τὴν πατρικήν — «чтобы наследовали отцовский удел» (πατρικός)."
  9: "κλῆρος ἐκ φυλῆς ἐπὶ φυλὴν ἑτέραν — «жребий из племени в другое племя». ἐν τῇ κληρονομίᾳ αὐτοῦ — «в уделе своём»."
  10: "ὃν τρόπον συνέταξεν κύριος Μωυσῇ — «как заповедал Господь Моисею». ἐποίησαν θυγατέρες Σαλπααδ — «сделали дочери Салпаада»."
  11: "Θερσα, Εγλα, Μελχα, Νουα, Μααλα — ティルツァ, ホグラ, ミルカ, ノア, マフラ (формы 26:33; 27:1). τοῖς ἀνεψιοῖς αὐτῶν — «за двоюродных братьев своих» (ἀνεψιός; ru «за сыновей дядей своих»). В csl порядок имён иной: маала, ферса, егла, мелха, нуа."
  12: "ἐκ τοῦ δήμου τοῦ Μανασση υἱῶν Ιωσηφ — «из рода Манассии, сынов Иосифа». ἐγενήθησαν γυναῖκες — «стали жёнами». ἐγένετο ἡ κληρονομία αὐτῶν ἐπὶ τὴν φυλήν — «удел их остался в племени». В csl первая клауза отнесена к ст. 11, поэтому деление 11/12 расходится (стих переведён по gr)."
  13: "ἐν χειρὶ Μωυσῆ — «рукою Моисея», т. е. через Моисея. ἐπὶ δυσμῶν Μωαβ ἐπὶ τοῦ Ιορδάνου κατὰ Ιεριχω — на равнинах Моава при Иордане против Иерихона (ср. 33:50; 35:1)."
