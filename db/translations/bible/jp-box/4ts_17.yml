# jp-box, 4-я Царств, глава 17. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); второй свидетель церковного текста —
# церковнославянский (csl-ru), по паритету (docs/japanese-bible.md,
# «Паритет LXX и церковнославянского»); ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге нет; jp-ni (под авторским правом) не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 17: Осия и падение Самарии (1–6); причины пленения — грех Израиля
# и проповедь пророков (7–23); переселенцы и их боги (24–41).
# Речь — 「…」: Господь (13, 35–39), народ к царю (26), царь Ассирии (27).
# Красного нет.
# Нумерация по gr: 41 стих, у csl тоже 41, но csl иначе делит 17:32–33:
# вторую половину 17:32 («поставили жрецов высот») csl относит к 17:33.
# В тексте — по гр.
# Паритет LXX/csl: csl-чтения в основном тексте без 〔…〕; вариант LXX — в notes.
# Осознанно взяты csl-чтения: 17:9 («сокрыша словеса»), 17:14 (выя),
# 17:15 (отвергли завет), 17:19 («отвергошася Господа»), 17:20 (разгневася),
# 17:27 («единаго жерца»), 17:34 и 17:40 (отрицания по csl/МТ).
# 〔…〕 нет. Сносок ⟨…⟩ нет: 預言者, 契約, 木立, 高[たか]い所, 祭司 уже в корпусе.

