verses:
  1: "ユダの王[おう]アハズの第十[だいじゅう]二[に]年[ねん]に、エラの子[こ]ホシェアがサマリアでイスラエルの王[おう]となり、九[きゅう]年[ねん]治[おさ]めた。"
  2: "彼[かれ]は主[しゅ]の目[め]に悪[わる]を行[おこな]った。ただし、彼[かれ]より前[まえ]にいたイスラエルの王[おう]たちほどではなかった。"
  3: "アッシリアの王[おう]サルマナサルが彼[かれ]に攻[せ]め上[のぼ]り、ホシェアは彼[かれ]のしもべとなって、彼[かれ]に貢[みつ]ぎ物[もの]を納[おさ]めた。"
  4: "しかし、アッシリアの王[おう]はホシェアのうちに不正[ふせい]を見[み]いだした。彼[かれ]が使[つか]いをエジプトの王[おう]シゴルに送[おく]り、その年[とし]にはアッシリアの王[おう]に貢[みつ]ぎ物[もの]を納[おさ]めなかったからである。そこでアッシリアの王[おう]は彼[かれ]を包囲[ほうい]し、獄[ひとや]に縛[しば]りつけた。"
  5: "アッシリアの王[おう]は国[くに]の全土[ぜんど]に攻[せ]め上[のぼ]り、サマリアに上[のぼ]って、これに三年[さんねん]の間[あいだ]攻[せ]め寄[よ]せた。"
  6: "ホシェアの第九[だいきゅう]年[ねん]に、アッシリアの王[おう]はサマリアを取[と]り、イスラエルをアッシリアへ移[うつ]して、アラエとアボル、ゴザン川[がわ]のほとり、またメディアの山[やま]々[やま]に住[す]まわせた。"
  7: "こうなったのは、イスラエルの子[こ]らが、自分[じぶん]たちをエジプトの地[ち]から導[みちび]き上[のぼ]り、ファラオ、エジプトの王[おう]の手[て]の下[した]から連[つ]れ出[だ]した彼[かれ]らの神[かみ]である主[しゅ]に罪[つみ]を犯[おか]し、ほかの神[かみ]々[がみ]を畏[おそ]れたからである。"
  8: "そして、主[しゅ]がイスラエルの子[こ]らの前[まえ]から追[お]い払[はら]われた異邦[いほう]の民[たみ]の定[さだ]めに従[したが]い、イスラエルの王[おう]たちがしたとおりに行[おこな]った。"
  9: "イスラエルの子[こ]らは、彼[かれ]らの神[かみ]である主[しゅ]に背[そむ]くことをひそかに行[おこな]い、すべての町[まち]に、見張[みは]り櫓[やぐら]から堅固[けんご]な町[まち]に至[いた]るまで、高[たか]い所[ところ]を築[きず]いた。"
  10: "また、彼[かれ]らは自分[じぶん]たちのために石柱[せきちゅう]と木立[こだち]を、すべての高[たか]い丘[おか]の上[うえ]と、すべての茂[しげ]った木[き]の下[した]に立[た]てた。"
  11: "そこでは、主[しゅ]が彼[かれ]らの前[まえ]から移[うつ]された異邦[いほう]の民[たみ]と同[おな]じように、すべての高[たか]い所[ところ]で香[こう]をたいた。また、自分[じぶん]たちの仲間[なかま]となる者[もの]たちを造[つく]り、主[しゅ]を怒[いか]らせることをあからさまに始[はじ]めた。"
  12: "彼[かれ]らは、主[しゅ]が「このことをしてはならない」と言[い]われた偶像[ぐうぞう]に仕[つか]えた。"
  13: "主[しゅ]はイスラエルとユダに対[たい]して、そのすべての預言者[よげんしゃ]、すなわちすべての先見者[せんけんしゃ]の手[て]によって証[あかし]して言[い]われた。「悪[わる]い道[みち]から立[た]ち返[かえ]り、わたしの戒[いまし]めとわたしの定[さだ]め、およびわたしがあなたがたの父[ちち]たちに命[めい]じ、わたしのしもべである預言者[よげんしゃ]たちの手[て]によってあなたがたに送[おく]ったすべての律法[りっぽう]を守[まも]りなさい。」"
  14: "しかし、彼[かれ]らは聞[き]き入[い]れず、父[ちち]たちのうなじよりも強[かた]くうなじを固[かた]くした。父[ちち]たちも、自分[じぶん]たちの神[かみ]である主[しゅ]を信[しん]じなかったのである。"
  15: "彼[かれ]らは主[しゅ]の契約[けいやく]と、父[ちち]たちに授[さず]けられた定[さだ]めを捨[す]て、主[しゅ]が彼[かれ]らに証[あかし]された証[あかし]を守[まも]らなかった。また、空[むな]しいものに従[したが]って空[むな]しくなり、主[しゅ]が「彼[かれ]らのようになってはならない」と命[めい]じられた、周[まわ]りの異邦[いほう]の民[たみ]に従[したが]った。"
  16: "彼[かれ]らは自分[じぶん]たちの神[かみ]である主[しゅ]の戒[いまし]めを捨[す]て、鋳物[いもの]の像[ぞう]、すなわち二[ふた]つの子牛[こうし]を造[つく]り、木立[こだち]を造[つく]って、天[てん]のすべての軍[ぐん]を拝[おが]み、バアルに仕[つか]えた。"
  17: "彼[かれ]らは自分[じぶん]の息子[むすこ]たちと娘[むすめ]たちを火[ひ]の中[なか]に通[とお]らせ、占[うらな]いをし、鳥[とり]の飛[と]び方[かた]で吉凶[きっきょう]を計[はか]り、主[しゅ]の目[め]に悪[わる]を行[おこな]って彼[かれ]を怒[いか]らせるために、自分[じぶん]たちを売[う]り渡[わた]した。"
  18: "主[しゅ]はイスラエルに対[たい]して大[おお]いに怒[いか]り、彼[かれ]らを御前[おんまえ]から退[しりぞ]けられた。残[のこ]ったのは、ただユダの部族[ぶぞく]だけであった。"
  19: "しかし、ユダもまた、自分[じぶん]たちの神[かみ]である主[しゅ]の戒[いまし]めを守[まも]らず、イスラエルが定[さだ]めた定[さだ]めに従[したが]って歩[あゆ]み、主[しゅ]を捨[す]てた。"
  20: "主[しゅ]はイスラエルのすべての種[たね]に対[たい]して激[はげ]しく怒[いか]り、彼[かれ]らを揺[ゆ]さぶり、彼[かれ]らを略奪[りゃくだつ]する者[もの]たちの手[て]に渡[わた]された。そしてついに、彼[かれ]らを御前[おんまえ]から投[な]げ捨[す]てられた。"
  21: "それは、イスラエルがダビデの家[いえ]から離[はな]れ、自分[じぶん]たちのために王[おう]としてネバトの子[こ]ヤロブアムを立[た]てたからである。ヤロブアムはイスラエルを主[しゅ]の後[あと]から引[ひ]き離[はな]し、大[おお]きな罪[つみ]を犯[おか]させた。"
  22: "イスラエルの子[こ]らは、ヤロブアムが犯[おか]したすべての罪[つみ]の中[なか]を歩[あゆ]み、そこから離[はな]れなかった。"
  23: "ついに、主[しゅ]がそのすべてのしもべである預言者[よげんしゃ]たちの手[て]によって語[かた]られたとおりに、主[しゅ]はイスラエルを御前[おんまえ]から移[うつ]された。こうしてイスラエルは自分[じぶん]の土地[とち]からアッシリアへ移[うつ]され、今日[きょう]に至[いた]っている。"
  24: "アッシリアの王[おう]は、バビロン、クタ、アワ、ハマト、セパルワイムから人[ひと]々[びと]を連[つ]れて来[き]て、イスラエルの子[こ]らの代[か]わりにサマリアの町[まち]々[まち]に住[す]まわせた。彼[かれ]らはサマリアを継[つ]ぎ、その町[まち]々[まち]に住[す]んだ。"
  25: "彼[かれ]らがそこに住[す]み始[はじ]めたころ、主[しゅ]を畏[おそ]れなかったので、主[しゅ]は彼[かれ]らの間[あいだ]に獅子[しし]を送[おく]り、彼[かれ]らを殺[ころ]させた。"
  26: "そこで人[ひと]々[びと]はアッシリアの王[おう]に告[つ]げて言[い]った。「あなたが移[うつ]してサマリアの町[まち]々[まち]に住[す]まわせた国[くに]々[ぐに]の人[ひと]々[びと]は、その地[ち]の神[かみ]の定[さだ]めを知[し]らない。そこで神[かみ]は彼[かれ]らの間[あいだ]に獅子[しし]を送[おく]り、今[いま]、獅子[しし]が彼[かれ]らを殺[ころ]している。彼[かれ]らがその地[ち]の神[かみ]の定[さだ]めを知[し]らないからだ。」"
  27: "アッシリアの王[おう]は命[めい]じて言[い]った。「そこから、捕虜[ほりょ]のうちのひとりの祭司[さいし]を連[つ]れて行[い]かせ、そこへ行[い]って住[す]まわせなさい。その者[もの]が彼[かれ]らに、その地[ち]の神[かみ]の定[さだ]めを教[おし]えるであろう。」"
  28: "そこで彼[かれ]らは、サマリアから連[つ]れて来[き]た祭司[さいし]のひとりを連[つ]れて来[き]て、ベテルに住[す]まわせた。彼[かれ]は彼[かれ]らに、どのように主[しゅ]を畏[おそ]れるべきかを教[おし]えていた。"
  29: "しかも、それぞれの国[くに]の人[ひと]々[びと]は自分[じぶん]たちの神[かみ]々[がみ]を造[つく]り、サマリア人[びと]が造[つく]った高[たか]い所[ところ]の家[いえ]々[いえ]に置[お]いた。国[くに]ごとに、自分[じぶん]たちが住[す]む町[まち]に置[お]いたのである。"
  30: "バビロンの人[ひと]々[びと]はスコト・ベノトを造[つく]り、クタの人[ひと]々[びと]はネルガルを造[つく]り、ハマトの人[ひと]々[びと]はアシマを造[つく]った。"
  31: "アワの人[ひと]々[びと]はエブラゼルとタルタクを造[つく]り、セパルワイムの人[ひと]々[びと]は、自分[じぶん]たちの神[かみ]であるアドラメレクとアネメレクに、息子[むすこ]たちを火[ひ]で焼[や]いてささげた。"
  32: "彼[かれ]らは主[しゅ]を畏[おそ]れながらも、自分[じぶん]たちの忌[い]むべき物[もの]を、サマリアに造[つく]った高[たか]い所[ところ]の家[いえ]々[いえ]に、国[くに]ごとに、自分[じぶん]たちが住[す]む町[まち]に置[お]いた。また、主[しゅ]を畏[おそ]れながら、高[たか]い所[ところ]の祭司[さいし]たちを自分[じぶん]たちの中[なか]から立[た]て、高[たか]い所[ところ]の家[いえ]で務[つと]めさせた。"
  33: "彼[かれ]らは主[しゅ]を畏[おそ]れていたが、自分[じぶん]たちの神[かみ]々[がみ]にも仕[つか]えた。すなわち、自分[じぶん]たちがそこから移[うつ]されて来[き]た国[くに]々[ぐに]の定[さだ]めに従[したが]って仕[つか]えたのである。"
  34: "今日[きょう]に至[いた]るまで、彼[かれ]らは自分[じぶん]たちの裁[さば]きに従[したが]って行[おこな]っている。彼[かれ]らは主[しゅ]を畏[おそ]れず、自分[じぶん]たちの定[さだ]めによっても、その裁[さば]きによっても、主[しゅ]がヤコブの子[こ]らに、すなわち御名[みな]をイスラエルとされた者[もの]に命[めい]じられた律法[りっぽう]と戒[いまし]めによっても行[おこな]わない。"
  35: "主[しゅ]は彼[かれ]らと契約[けいやく]を結[むす]び、命[めい]じて言[い]われた。「あなたがたはほかの神[かみ]々[がみ]を畏[おそ]れてはならない。それらを拝[おが]んではならない。それらに仕[つか]えてはならない。それらに犠牲[ぎせい]をささげてはならない。"
  36: "ただ、大[おお]きな力[ちから]と高[たか]く挙[あ]げた腕[うで]をもって、あなたがたをエジプトの地[ち]から導[みちび]き出[だ]した主[しゅ]を畏[おそ]れ、その方[かた]を拝[おが]み、その方[かた]に犠牲[ぎせい]をささげなさい。"
  37: "また、主[しゅ]があなたがたのために書[か]かれた定[さだ]めと裁[さば]きと律法[りっぽう]と戒[いまし]めを、すべての日[ひ]々[び]に守[まも]って行[おこな]いなさい。ほかの神[かみ]々[がみ]を畏[おそ]れてはならない。"
  38: "あなたがたと結[むす]んだ契約[けいやく]を忘[わす]れてはならない。ほかの神[かみ]々[がみ]を畏[おそ]れてはならない。"
  39: "あなたがたの神[かみ]である主[しゅ]を畏[おそ]れなさい。主[しゅ]があなたがたをすべての敵[てき]の手[て]から救[すく]い出[だ]されるからである。」"
  40: "しかし、彼[かれ]らは聞[き]き入[い]れず、昔[むかし]からの自分[じぶん]たちの慣[なら]わしに従[したが]って行[おこな]った。"
  41: "これらの国[くに]々[ぐに]の人[ひと]々[びと]は主[しゅ]を畏[おそ]れながら、自分[じぶん]たちの彫[ほ]り物[もの]に仕[つか]えていた。その子[こ]たちも孫[まご]たちも、父[ちち]たちがしたとおりに、今日[きょう]に至[いた]るまでそうしている。"

notes:
  1: "Ἐν ἔτει δωδεκάτῳ τῷ Αχαζ — в двенадцатый год Ахаза; Ωσηε υἱὸς Ηλα — Осия, сын Илы (Ωσηε — ホシェア; csl «осиа»); ἐν Σαμαρείᾳ ἐπὶ Ισραηλ — в Самарии над Израилем; ἐννέα ἔτη — девять лет."
  2: "ἐποίησεν τὸ πονηρὸν ἐν ὀφθαλμοῖς κυρίου — делал злое в очах Господних; πλὴν οὐχ ὡς οἱ βασιλεῖς Ισραηλ — однако не так, как цари Израильские; οἳ ἦσαν ἔμπροσθεν αὐτοῦ — которые были прежде него."
  3: "ἐπ᾽ αὐτὸν ἀνέβη Σαλαμανασαρ — на него поднялся Салманассар (LXX Σαλαμανασαρ, евр. שַׁלְמַנְאֶסֶר; サルマナサル; csl «саламанассар»); ἐγενήθη αὐτῷ Ωσηε δοῦλος — стал ему Осия рабом; ἐπέστρεψεν αὐτῷ μαναα — приносил ему дань (μαναα — евр. מִנְחָה, «дань, приношение»)."
  4: "εὗρεν ... ἀδικίαν — нашёл неправду (ἀδικία); ἀπέστειλεν ἀγγέλους πρὸς Σηγωρ βασιλέα Αἰγύπτου — послал послов к Сигору, царю Египетскому (Σηγωρ — LXX-передача евр. סוֹא; csl «сигор»); οὐκ ἤνεγκεν μαναα — не принёс дани; ἐπολιόρχησεν ... καὶ ἔδησεν αὐτὸν ἐν οἴκῳ φυλακῆς — осадил и связал его в доме темницы."
  5: "ἀνέβη ... ἐν πάσῃ τῇ γῇ — поднялся по всей земле; ἐπολιόρχησεν ἐπ᾽ αὐτὴν τρία ἔτη — осаждал её три года. Csl «во всю землю (его)»: скобки издания, в текст не внесены."
  6: "ἐν ἔτει ἐνάτῳ Ωσηε — в девятый год Осии; συνέλαβεν τὴν Σαμάρειαν — взял Самарию; ἀπῴκισεν τὸν Ισραηλ εἰς Ἀσσυρίους — переселил Израиля к ассириянам; ἐν Αλαε καὶ ἐν Αβωρ, ποταμοῖς Γωζαν — в Алае и в Аворе, реках Гозан (Алае, Авор; csl «алаи», «аворе»); Ορη Μήδων — горы Мидийские (csl «пределы мидские»)."
  7: "ἥμαρτον οἱ υἱοὶ Ισραηλ τῷ κυρίῳ θεῷ αὐτῶν — согрешили сыны Израиля Господу Богу своему; τῷ ἀναγαγόντι αὐτοὺς ἐκ γῆς Αἰγύπτου — изведшему их из земли Египетской; ὑποκάτωθεν χειρὸς Φαραω — из-под руки фараона; ἐφοβήθησαν θεοὺς ἑτέρους — убоялись (чтили) иных богов."
  8: "ἐπορεύθησαν τοῖς δικαιώμασιν τῶν ἐθνῶν — пошли по уставам (δικαιώματα) народов; ὧν ἐξῆρεν κύριος ἀπὸ προσώπου υἱῶν Ισραηλ — которых изгнал Господь от лица сынов Израиля; καὶ οἱ βασιλεῖς Ισραηλ, ὅσοι ἐποίησαν — и цари Израильские, что они делали (фраза обрывочна)."
  9: "ὅσοι ἠμφιέσαντο ... λόγους — «сколько слов они надели на себя»: тёмное место (ἀμφιέννυμι — «одевать»); евр. וַיְחַפְּאוּ — «делали тайно»; csl «елицы сокрыша ... словеса» — «скрыли слова». В тексте — по смыслу csl: делали неугодное тайно. ᾠκοδόμησαν ἑαυτοῖς ὑψηλά — построили себе высоты; ἀπὸ πύργου φυλασσόντων ἕως πόλεως ὀχυρᾶς — от башни сторожей до города укреплённого."
  10: "ἐστήλωσαν ἑαυτοῖς στήλας καὶ ἄλση — поставили себе столпы (στήλη) и рощи (ἄλσος); ἐπὶ παντὶ βουνῷ ὑψηλῷ — на всяком холме высоком; ὑποκάτω παντὸς ξύλου ἀλσώδους — под всяким деревом тенистым. Csl «кумиры и дубравы»."
  11: "ἐθυμίασαν — воскурили; καθὼς τὰ ἔθνη, ἃ ἀπῴκισεν κύριος ἐκ προσώπου αὐτῶν — как народы, которых переселил Господь от лица их; ἐποίησαν κοινωνούς — сделали «сообщников» (κοινωνός; csl «общники»; точный смысл тёмен — вероятно, идолы-покровители); ἐχάραξαν — вырезали, начертали. Вторая половина в тексте по csl: «начаша яве прогневляти Господа» — «начали явно прогневлять Господа»; гр. ἐχάραξαν понято иначе."
  12: "ἐλάτρευσαν τοῖς εἰδώλοις — служили идолам (εἴδωλον); οἷς εἶπεν κύριος αὐτοῖς — о которых сказал им Господь; Οὐ ποιήσετε τὸ ῥῆμα τοῦτο κυρίῳ — «не сделаете дела этого Господу» (csl «не сотворите глагола сего Господеви»)."
  13: "διεμαρτύρατο κύριος — свидетельствовал (διαμαρτύρομαι) Господь; ἐν χειρὶ πάντων τῶν προφητῶν αὐτοῦ, παντὸς ὁρῶντος — рукою всех пророков Своих, всякого видящего (ὁρῶν — «прозорливец»; csl «прозорливаго»); Ἀποστράφητε ἀπὸ τῶν ὁδῶν ὑμῶν τῶν πονηρῶν — обратитесь от путей ваших лукавых; φυλάξατε τὰς ἐντολάς μου καὶ τὰ δικαιώματά μου — сохраните заповеди Мои и оправдания Мои."
  14: "ἐσκλήρυναν τὸν νῶτον αὐτῶν — ожесточили хребет (νῶτον — «спина») свой; ὑπὲρ τὸν νῶτον τῶν πατέρων αὐτῶν — более хребта отцов их. Csl и МТ: «выю» (עֹרֶף — «шея»), в тексте うなじ. Csl добавляет «иже не вероваша Господу Богу своему» — в гр. нет; внесено в текст."
  15: "τὰ μαρτύρια αὐτοῦ ... οὐκ ἐφύλαξαν — свидетельства Его не сохранили; ἐπορεύθησαν ὀπίσω τῶν ματαίων καὶ ἐματαιώθησαν — пошли вслед суетных и осуетились (μάταιος — «пустой, суетный»); ὀπίσω τῶν ἐθνῶν τῶν περικύκλῳ αὐτῶν — вслед народов окрест их; ὧν ἐνετείλατο ... τοῦ μὴ ποιῆσαι κατὰ ταῦτα — о которых заповедал не делать по сему. Начало «отвергоша завет его и оправдания, яже завеща отцем их» — csl, в гр. нет; внесено в текст."
  16: "ἐγκατέλιπον τὰς ἐντολὰς κυρίου — оставили заповеди Господа; χώνευμα, δύο δαμάλεις — литое изображение, двух телиц (δάμαλις; csl «две юницы слиты»); ἄλση — рощи; προσεκύνησαν πάσῃ τῇ δυνάμει τοῦ οὐρανοῦ — поклонились всему воинству небесному; ἐλάτρευσαν τῷ Βααλ — служили Ваалу."
  17: "διῆγον τοὺς υἱοὺς ... ἐν πυρί — проводили сыновей и дочерей через огонь; ἐμαντεύοντο μαντείας — гадали гаданиями (μαντεία); οἰωνίζοντο — гадали по птицам (οἰωνίζομαι); ἐπράθησαν — продали себя (πιπράσκω); παροργίσαι αὐτόν — прогневать Его."
  18: "ἐθυμώθη κύριος σφόδρα — воспылал Господь сильно; ἀπέστησεν αὐτοὺς ἀπὸ τοῦ προσώπου αὐτοῦ — отстранил (ἀφίστημι) их от лица Своего; οὐχ ὑπελείφθη πλὴν φυλὴ Ιουδα μονωτάτη — не осталось, кроме колена Иудина совершенно одного (μονωτάτη)."
  19: "καί γε Ιουδας οὐκ ἐφύλαξεν — и Иуда не сохранил; ἐπορεύθησαν ἐν τοῖς δικαιώμασιν Ισραηλ — пошли по оправданиям (уставам) Израиля; οἷς ἐποίησαν — которые они сделали. Csl добавляет «и отвергошася Господа» — в гр. нет; внесено в текст."
  20: "ἀπεώσαντο τὸν κύριον ἐν παντὶ σπέρματι Ισραηλ — «оттолкнули Господа во всём семени Израиля» (ἀπωθέομαι); ἐσάλευσεν αὐτοὺς — потряс (σαλεύω) их; ἔδωκεν ... ἐν χειρὶ διαρπαζόντων — отдал в руку расхищающих; ἕως οὗ ἀπέρριψεν — доколе не отверг (ἀπορρίπτω). Csl «разгневася Господь на все семя израилево» — иной субъект и глагол (по МТ וַיִּמְאַס); в тексте csl, вариант гр. отмечен здесь."
  21: "ὅτι πλὴν Ισραηλ ἐπάνωθεν οἴκου Δαυιδ — что Израиль отделился от дома Давида; ἐβασίλευσαν τὸν Ιεροβοαμ — воцарили Иеровоама; ἐξέωσεν ... ἐξόπισθεν κυρίου — изгнал (ἐξωθέω) от Господа; ἐξήμαρτεν ... ἁμαρτίαν μεγάλην — ввёл в великий грех (ἐξαμαρτάνω). Csl добавляет «поставиша себе царя» — внесено в текст."
  22: "ἐπορεύθησαν ἐν πάσῃ ἁμαρτίᾳ Ιεροβοαμ — ходили во всяком грехе Иеровоама; οὐκ ἀπέστησαν ἀπ᾽ αὐτῆς — не отступили от него."
  23: "μετέστησεν κύριος τὸν Ισραηλ ἀπὸ προσώπου αὐτοῦ — переселил Господь Израиля от лица Своего; καθὼς ἐλάλησεν ... ἐν χειρὶ πάντων τῶν δούλων αὐτοῦ τῶν προφητῶν — как говорил рукою всех рабов Своих пророков; ἀπῳκίσθη ... εἰς Ἀσσυρίους — переселён к ассириянам; ἕως τῆς ἡμέρας ταύτης — до сего дня."
  24: "ἤγαγεν ... ἐκ Βαβυλῶνος τὸν ἐκ Χουνθα καὶ ἀπὸ Αια καὶ ἀπὸ Αιμαθ καὶ Σεπφαρουαιν — привёл из Вавилона, из Куты, из Аввы, из Емафа и Сепарваима (Χουνθα — כותא, クタ; Αια — עוא, アワ; Αιμαθ — חמת, ハマト; Σεπφαρουαιν — ספרוים, セパルワイム; csl «хуфа», «аиа», «емаф», «сепфаруим»); κατῳκίσθησαν ... ἀντὶ τῶν υἱῶν Ισραηλ — поселены вместо сынов Израиля; ἐκληρονόμησαν τὴν Σαμάρειαν — наследовали Самарию."
  25: "ἐν ἀρχῇ τῆς καθέδρας αὐτῶν — в начале сидения (поселения) их (καθέδρα); οὐκ ἐφοβήθησαν τὸν κύριον — не убоялись Господа; ἀπέστειλεν ... τοὺς λέοντας — послал львов; ἦσαν ἀποκτέννοντες — убивали."
  26: "Τὰ ἔθνη, ἃ ἀπῴκισας καὶ ἀντεκάθισας — народы, которые ты переселил и посадил (ἀντικαθίζω); οὐκ ἔγνωσαν τὸ κρίμα τοῦ θεοῦ τῆς γῆς — не познали суда (κρίμα) Бога земли; ἰδού εἰσιν θανατοῦντες — вот, они умерщвляют; καθότι οὐκ οἴδασιν — поскольку не знают. Csl добавляет подлежащее «Господь» при «посла львы» — в гр. без подлежащего."
  27: "Ἀπάγετε ἐκεῖθεν — уведите оттуда; πορευέσθωσαν καὶ κατοικείτωσαν ἐκεῖ — пусть пойдут и живут там; φωτιοῦσιν αὐτοὺς τὸ κρίμα — просветят (φωτίζω) их суду. В гр. объект при Ἀπάγετε не назван (дефект текста); csl «единаго жерца от плененых» — «одного жреца из пленённых», внесено в текст; ср. ru «одного из священников»."
  28: "ἤγαγον ἕνα τῶν ἱερέων — привели одного из священников; ἐκάθισεν ἐν Βαιθηλ — сел в Вефиле; ἦν φωτίζων αὐτοὺς πῶς φοβηθῶσιν τὸν κύριον — просвещал их, как бояться Господа. Csl «бе просвещая жрец их» — добавляет «жрец их», в гр. нет."
  29: "ἦσαν ποιοῦντες ἔθνη ἔθνη θεοὺς αὐτῶν — делали народы, народы богов своих (повтор для распределительности); ἔθηκαν ἐν οἴκῳ τῶν ὑψηλῶν — поставили в доме высот; ὧν ἐποίησαν οἱ Σαμαρῖται — которые сделали самаряне; ἔθνος ἐν ταῖς πόλεσιν αὐτῶν — каждый народ в городах своих."
  30: "οἱ ἄνδρες Βαβυλῶνος — мужи Вавилона; Σοκχωθβαινιθ — Суккот-Беноф (סכות בנות; スコト・ベノト); Νηριγελ — Нергал (נרגל; csl «гигель»); Ασιμαθ — Ашима (אשימא; csl «асимаф»)."
  31: "οἱ Ευαῖοι — аввийцы (עוא; アワ人; csl «евее»); Εβλαζερ καὶ Θαρθακ — Евлазер и Тартак (в МТ Нивхаз и Тартак; エブラゼル, タルタク; csl «авлазер и фарфак»); κατέκαιον τοὺς υἱοὺς αὐτῶν ἐν πυρί — сожигали сыновей своих огнём; τῷ Αδραμελεχ καὶ Ανημελεχ — Адрамелеху и Анамелеху (אדרמלך, ענמלך; csl «андрамелеху и анемелеху»)."
  32: "ἦσαν φοβούμενοι τὸν κύριον — боялись Господа; κατῴκισαν τὰ βδελύγματα αὐτῶν — поселили мерзости свои (βδέλυγμα); ἐν τοῖς οἴκοις τῶν ὑψηλῶν — в домах высот; ἐποίησαν ἑαυτοῖς ἱερεῖς τῶν ὑψηλῶν — сделали себе священников высот; ἐν οἴκῳ τῶν ὑψηλῶν — в доме высот."
  33: "τὸν κύριον ἐφοβοῦντο καὶ τοῖς θεοῖς αὐτῶν ἐλάτρευον — Господа боялись и богам своим служили; κατὰ τὸ κρίμα τῶν ἐθνῶν — по суду (обычаю) народов; ὅθεν ἀπῴκισεν αὐτοὺς ἐκεῖθεν — откуда переселил их. Csl в 17:33 повторяет материал 17:32 («поставили жрецов») и иначе делит стихи; в тексте — по гр."
  34: "αὐτοὶ ἐποίουν κατὰ τὸ κρίμα αὐτῶν — они делали по своему суду (обычаю); αὐτοὶ φοβοῦνται καὶ αὐτοὶ ποιοῦσιν — они боятся и они делают (гр.); csl и МТ отрицают: «не бояхуся Господа, и не творяху по оправданием их»; в тексте csl. κατὰ τὰ δικαιώματα ... κατὰ τὴν κρίσιν ... κατὰ τὸν νόμον ... κατὰ τὴν ἐντολήν — по оправданиям, по суду, по закону, по заповеди; οὗ ἔθηκεν τὸ ὄνομα αὐτοῦ Ισραηλ — которому положил имя Своё Израиль."
  35: "διέθετο κύριος μετ᾿ αὐτῶν διαθήκην — положил Господь с ними завет (διατίθεμαι); Οὐ φοβηθήσεσθε θεοὺς ἑτέρους — не убоитесь богов иных; οὐ προσκυνήσετε ... οὐ λατρεύσετε ... οὐ θυσιάσετε — не поклонитесь, не послужите, не пожрёте."
  36: "ὅτι ἀλλ᾿ ἢ τῷ κυρίῳ — но только Господу; ὃς ἀνήγαγεν ὑμᾶς ἐκ γῆς Αἰγύπτου ἐν ἰσχύι μεγάλῃ καὶ ἐν βραχίονι ὑψηλῷ — который извёл вас из земли Египетской силою великою и мышцею высокою; αὐτὸν φοβηθήσεσθε ... θύσετε — Его убоитесь, Ему поклонитесь, Ему пожрите."
  37: "τὰ δικαιώματα καὶ τὰ κρίματα καὶ τὸν νόμον καὶ τὰς ἐντολάς — оправдания, суды, закон и заповеди; ἃς ἔγραψεν ὑμῖν — которые написал вам; φυλάσσεσθε ποιεῖν πάσας τὰς ἡμέρας — храните исполнять во все дни; οὐ φοβηθήσεσθε θεοὺς ἑτέρους — не убоитесь богов иных."
  38: "τὴν διαθήκην, ἣν διέθετο μεθ᾿ ὑμῶν, οὐκ ἐπιλήσεσθε — завета, который положил с вами, не забудете (ἐπιλανθάνομαι); οὐ φοβηθήσεσθε — не убоитесь."
  39: "τὸν κύριον θεὸν ὑμῶν φοβηθήσεσθε — Господа Бога вашего убоитесь; αὐτὸς ἐξελεῖται ὑμᾶς — Он избавит (ἐξαιρέω) вас; ἐκ πάντων τῶν ἐχθρῶν ὑμῶν — от всех врагов ваших."
  40: "οὐκ ἀκούσεσθε ἐπὶ τῷ κρίματι αὐτῶν — не послушаете суда их (гр. будущее); ὃ αὐτοὶ ποιοῦσιν — который они делают. Csl: «не послушаша сего, но по обычаем своим преждним твориша» — прошедшее время и «по обычаям своим прежним» (как МТ); в тексте csl."
  41: "ἦσαν ... φοβούμενοι τὸν κύριον — боялись Господа; τοῖς γλυπτοῖς αὐτῶν ἦσαν δουλεύοντες — изваяниям (γλυπτά) своим служили; οἱ υἱοὶ καὶ οἱ υἱοὶ τῶν υἱῶν αὐτῶν — сыны и сыны сынов их; καθὰ ἐποίησαν οἱ πατέρες αὐτῶν — как делали отцы их; ἕως τῆς ἡμέρας ταύτης — до сего дня."
