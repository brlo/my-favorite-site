# jp-box, Послание к Римлянам, глава 6. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 6: крещение в смерть Христову (1–11), не давать греху царствовать (12–14),
# рабство греха и рабство правды (15–23).
# Красного (<j>) и синего (<mo>) нет: прямой речи Христа и Богородицы в главе нет.
# 〔…〕 в главе нет: все стихи в gr-lxx-byz есть; [εἶναι] в 6:11 стоит в базе,
# поэтому не обёрнуто. Ключевые слова главы — βασιλεύω (王として君臨する),
# δουλεύω/δοῦλος (奴隷), δικαιοσύνη (義), ἁγιασμός (聖なる者とされること).
# jp-ni не использовался.

tr_code: jp-box
book: rim
chapter: 6
draft: true

verses:
  1: "それでは、何と言[い]おうか。恵[めぐ]みが多[おお]くなるために、罪[つみ]にとどまっていようか。"
  2: "決[けっ]してそうではない。罪[つみ]に対して死[し]んだわたしたちが、どうしてなお、その中[なか]に生[い]きることができようか。"
  3: "それとも、あなたがたは知[し]らないのか。キリスト・イエスに洗礼[せんれい]を受[う]けたわたしたちは皆[みな]、その死[し]に洗礼[せんれい]を受[う]けたのである。"
  4: "そこで、わたしたちは、死[し]へと向[む]かう洗礼[せんれい]によって、彼[かれ]とともに葬[ほうむ]られた。それは、キリストが父[ちち]の栄光[えいこう]によって死者[ししゃ]の中[なか]から起[お]こされたように、わたしたちもまた、新[あたら]しい命[いのち]のうちを歩[あゆ]むためである。"
  5: "もし、わたしたちが彼[かれ]の死[し]に似[に]た形[かたち]で彼[かれ]と結[むす]び合[あ]わされたのであれば、彼[かれ]の復活[ふっかつ]にも似[に]た形[かたち]で結[むす]び合[あ]わされるであろう。"
  6: "わたしたちはこのことを知[し]っている。わたしたちの古[ふる]い人[ひと]は彼[かれ]とともに十字架[じゅうじか]につけられた。それは、罪[つみ]の体[からだ]が滅[ほろ]ぼされて、わたしたちがもはや罪[つみ]の奴隷[どれい]とならないためである。"
  7: "死[し]んだ者[もの]は、罪[つみ]から義[ぎ]とされているからである。"
  8: "もし、わたしたちがキリストとともに死[し]んだのであれば、彼[かれ]とともに生[い]きることも信[しん]じている。"
  9: "キリストは死者[ししゃ]の中[なか]から復活[ふっかつ]して、もはや死[し]ぬことがないことを、わたしたちは知[し]っている。死[し]はもはや彼[かれ]を支配[しはい]しない。"
  10: "彼[かれ]が死[し]んだのは、ただ一度[いちど]、罪[つみ]に対して死[し]んだのであり、生[い]きているのは、神[かみ]に対して生[い]きているのである。"
  11: "同[おな]じように、あなたがたも、罪[つみ]に対しては死[し]んだ者[もの]、キリスト・イエスにあって神[かみ]に対しては生[い]きる者[もの]であると、自分[じぶん]自身[じしん]を思[おも]いなさい。"
  12: "だから、罪[つみ]が、あなたがたの死[し]すべき体[からだ]のうちに王[おう]として君臨[くんりん]し、その欲[よく]望[ぼう]に従[したが]うことがないようにしなさい。"
  13: "また、あなたがたの手足[てあし]を不[ふ]義[ぎ]の武[ぶ]器[き]として罪[つみ]に差[さ]し出[だ]してはならない。むしろ、死者[ししゃ]の中[なか]から生[い]きた者[もの]として自分[じぶん]自身[じしん]を神[かみ]に差[さ]し出[だ]し、あなたがたの手足[てあし]を義[ぎ]の武[ぶ]器[き]として神[かみ]に差[さ]し出[だ]しなさい。"
  14: "罪[つみ]は、あなたがたを支配[しはい]しない。あなたがたは律法[りっぽう]の下[もと]にあるのではなく、恵[めぐ]みの下[もと]にあるからである。"
  15: "それでは、どうなのか。わたしたちは律法[りっぽう]の下[もと]になく、恵[めぐ]みの下[もと]にあるのだから、罪[つみ]を犯[おか]そうか。決[けっ]してそうではない。"
  16: "あなたがたは知[し]らないのか。自分[じぶん]を差[さ]し出[だ]して従[したが]う者[もの]の奴隷[どれい]となれば、その従[したが]う者[もの]の奴隷[どれい]なのである。罪[つみ]の奴隷[どれい]となって死[し]に至[いた]るのか、それとも従順[じゅうじゅん]の奴隷[どれい]となって義[ぎ]に至[いた]るのか。"
  17: "しかし、神[かみ]に感[かん]謝[しゃ]する。あなたがたはかつて罪[つみ]の奴隷[どれい]であったが、伝[つた]えられた教[おし]えの型[かた]に、心[こころ]から従[したが]うようになったのである。"
  18: "そして、罪[つみ]から解放[かいほう]されて、義[ぎ]の奴隷[どれい]となったのである。"
  19: "わたしは、あなたがたの肉[にく]の弱[よわ]さのために、人[ひと]の言[こと]葉[ば]で話[はな]している。あなたがたがかつて、自分[じぶん]の手足[てあし]を汚[けが]れと不[ふ]法[ほう]の奴隷[どれい]として差[さ]し出[だ]し、不[ふ]法[ほう]へと向[む]かわせたように、今[いま]は、あなたがたの手足[てあし]を義[ぎ]の奴隷[どれい]として差[さ]し出[だ]し、聖[せい]なる者[もの]とされることに向[む]かわせなさい。"
  20: "あなたがたが罪[つみ]の奴隷[どれい]であったときには、義[ぎ]から自由[じゆう]であった。"
  21: "そのとき、あなたがたは何[なん]の実[み]を結[むす]んだのか。今[いま]はそれを恥[は]じている。その終[お]わりは死[し]である。"
  22: "しかし今[いま]、あなたがたは罪[つみ]から解放[かいほう]されて神[かみ]の奴隷[どれい]となったのだから、聖[せい]なる者[もの]とされることを実[み]として結[むす]び、その終[お]わりは永遠[えいえん]の命[いのち]である。"
  23: "罪[つみ]の報[むく]いは死[し]である。しかし、神[かみ]の賜[たま]物[もの]は、わたしたちの主[しゅ]イエス・キリストにあって、永遠[えいえん]の命[いのち]である。"

notes:
  1: "Τί οὖν ἐροῦμεν — それでは、何と言おうか. Возражение держится как вопрос, не переделано в утверждение."
  2: "μὴ γένοιτο — 決してそうではない (у jp-joc 非らず). Глава держит эту формулу трижды (6:2, 15; ср. 7:7, 13)."
  3: "εἰς Χριστὸν Ἰησοῦν — キリスト・イエスに, εἰς τὸν θάνατον αὐτοῦ — その死に. Оба εἰς переданы одним に, чтобы не разрушить параллель."
  4: "συνετάφημεν — ともに葬られた; καινότης ζωῆς — 新しい命. «Ходить в обновлённой жизни» — 新[あたら]しい命[いのち]のうちを歩[あゆ]む."
  5: "σύμφυτοι — «сращённые вместе»; 結び合わされた. ἀλλά в аподосисе (семитский оборот «то и») не передан союзом-противопоставлением, а уверенностью であろう."
  6: "καταργηθῇ — «упразднено, обессилено»; 滅ぼされて. τὸ σῶμα τῆς ἁμαρτίας — 罪の体."
  7: "δεδικαίωται ἀπὸ τῆς ἁμαρτίας — буквально «оправдан от греха»; оставлено 義とされている, чтобы сохранить юридическое слово, хотя у jp-joc 釋かれし. Смысл — освобождён, вне власти греха; ср. 6:18, 22."
  8: "πιστεύομεν — 信じている. Условное εἰ δέ с сотериологическим выводом."
  9: "οὐκέτι κυριεύει — もはや支配しない; ср. 6:14 ἁμαρτία ὑμῶν οὐ κυριεύσει."
  10: "ἐφάπαξ — ただ一度. τῇ ἁμαρτίᾳ / τῷ θεῷ — 罪に対して / 神に対して."
  11: "В базе [εἶναι] (в квадратных скобках) — есть, поэтому не обёрнуто. В византийском тексте далее «Господе нашем», в базе этого нет — не добавлено."
  12: "θνητός — 死すべき. εἰς τὸ ὑπακούειν — 従うことがないように (без добавления «вас»)."
  13: "ὅπλα — 武器 (у jp-joc 器). μέλη — 手足."
  14: "οὐ γάρ ἐστε ὑπὸ νόμον ἀλλὰ ὑπὸ χάριν — 律法の下になく、恵みの下にある. ὑπό — 下."
  15: "ἁμαρτήσωμεν…; μὴ γένοιτο — снова возражение и отвержение, как в 6:1–2."
  16: "ἤτοι… ἤ — 〜のか、それとも〜のか. δοῦλοι — 奴隷, не смягчено."
  17: "τύπος διδαχῆς — 教えの型. ἐκ καρδίας — 心から."
  18: "ἐλευθερωθέντες… ἐδουλώθητε — 解放されて…奴隷となった; парадокс сохранён."
  19: "ἀνθρώπινον λέγω — 人の言葉で話している. ἁγιασμός — 聖なる者とされること (не «освящение» как термин-калька, чтобы читалось как процесс)."
  20: "ἐλεύθεροι ἦτε τῇ δικαιοσύνῃ — 義から自由であった; датив отношения."
  21: "καρπός — 実; ἐπαισχύνεσθε — 恥じている; τέλος — 終わり."
  22: "νυνί δέ — しかし今. καρπός εἰς ἁγιασμόν — 聖なる者とされることを実として結ぶ."
  23: "ὀψώνια — «жалованье, плата» (военный термин); 報い. χάρισμα — 賜物. Контраст 報い/賜物 сохранён; ср. 5:15–16."
