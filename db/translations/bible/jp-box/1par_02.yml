# jp-box, 1-я Паралипоменон, глава 2. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); церковнославянский (csl-ru) — второй свидетель
# церковного текста: слав. чтения и добавки входят в основной текст без 〔…〕,
# вариант LXX — в notes. ru (Синодальный) — только для понимания, не источник.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 2: двенадцать сынов Израиля (1–2); сыны Иуды от Фамари (3–4); от Фареса
# до Давида (5–15), сёстры и племянники Давида (16–17); Халев, сын Есрома (18–24);
# род Иерахмеила (25–41); род Халева и кинеяне (42–55).
# Имена: где лицо есть в Быт 38, 46, Руфь 4 или 1–4 Цар, взята форма корпуса
# (ペレツ, アスロン, イェムエル, エッサイ, ボアズ, オベデ, ダビデ; アベシャ, ヨアブ,
# アサエル, アビガイル); остальные транслитерированы с греческого 1 Пар.
# Расхождения греческих форм с этими книгами и с csl/Синод. — в notes.
# Речи нет; красного нет. 〔…〕 нет: в gr-lxx-byz на месте всех стихов есть текст.
# Сносок ⟨…⟩ нет: 氏族, 側女, 父 (в значении «родоначальник»), 書記 уже в корпусе.
# jp-ni не использовался.

