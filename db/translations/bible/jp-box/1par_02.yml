verses:
  1: "ここに、イスラエルの子[こ]らの名[な]を挙[あ]げる。ルベン、シメオン、レビ、ユダ、イッサカル、ゼブルン、"
  2: "ダン、ヨセフ、ベニヤミン、ナフタリ、ガド、アシェルである。"
  3: "ユダの子[こ]らは、エル、オナン、シェラ。この三人[さんにん]は、カナン人[じん]シュアの娘[むすめ]によって彼[かれ]に生[う]まれた。ユダの長子[ちょうし]エルは主[しゅ]の前[まえ]に悪[わる]しき者[もの]であったので、主は彼を殺[ころ]された。"
  4: "タマル、すなわち彼[かれ]の嫁[よめ]は、彼にペレツとゼラを産[う]んだ。ユダの子[こ]らは皆[みな]、五人[ごにん]である。"
  5: "ペレツの子[こ]らは、アスロンとイェムエルである。"
  6: "ゼラの子[こ]らは、ザムブリ、アイタン、アイマン、カルカル、ダラ。皆、五人である。"
  7: "ハルミの子[こ]らは、アハル。彼[かれ]はイスラエルを煩[わずら]わせた者[もの]で、聖絶[せいぜつ]の物[もの]に対して背[そむ]いた。"
  8: "アイタンの子[こ]らは、アザルヤである。"
  9: "エスロンの子[こ]らで、彼[かれ]に生[う]まれた者[もの]は、イェラフメエル、ラム、カレブ、アラムである。"
  10: "アラムはアミナダブを生[う]み、アミナダブはナアソンを生[う]んだ。ナアソンはユダの家[いえ]のつかさであった。"
  11: "ナアソンはサルモンを生[う]み、サルモンはボアズを生[う]み、"
  12: "ボアズはオベデを生[う]み、オベデはエッサイを生[う]み、"
  13: "エッサイは長子[ちょうし]エリアブを生[う]み、次[つぎ]はアミナダブ、第三[だいさん]はサマア、"
  14: "第四[だいし]はナタナエル、第五[だいご]はラダイ、"
  15: "第六[だいろく]はオツェム、第七[だいしち]はダビデである。"
  16: "彼[かれ]らの姉妹[しまい]はサルイヤとアビガイル。サルイヤの子[こ]らは、アベシャ、ヨアブ、アサエル、三人[さんにん]である。"
  17: "アビガイルはアメサを産[う]んだ。アメサの父[ちち]はイシュマエル人[じん]イェテルであった。"
  18: "エスロンの子[こ]カレブは、妻[つま]アズバとイエリオトをめとった。彼女[かのじょ]の子[こ]らは、ヤシャル、ショバブ、アルドンである。"
  19: "アズバが死[し]ぬと、カレブはエフラタを妻[つま]に迎[むか]え、彼女[かのじょ]は彼[かれ]にオルを産[う]んだ。"
  20: "オルはウリを生[う]み、ウリはベツァレルを生[う]んだ。"
  21: "その後[のち]、エスロンはギレアデの父[ちち]マキルの娘[むすめ]のところに入[はい]った。彼[かれ]は六十歳[さい]のとき彼女[かのじょ]をめとり、彼女は彼にセグブを産[う]んだ。"
  22: "セグブはヤイルを生[う]んだ。ヤイルにはギレアデの地[ち]に二十三[にじゅうさん]の町[まち]があった。"
  23: "ゲシュルとアラムは、彼[かれ]らからヤイルの村[むら]々[むら]を奪[うば]い、ケナトとその村々を取[と]った。六十[ろくじゅう]の町[まち]である。これらはすべてギレアデの父[ちち]マキルの子[こ]らのものである。"
  24: "エスロンが死[し]んだ後[のち]、カレブはエフラタに入[はい]った。エスロンの妻[つま]アビヤは、彼[かれ]にアシュフルを産[う]んだ。アシュフルはテコアの父[ちち]である。"
  25: "エスロンの長子[ちょうし]イェラフメエルの子[こ]らは、長子ラム、バアナ、アラン、およびその兄弟[きょうだい]アソムである。"
  26: "イェラフメエルには、もう一人[ひとり]の妻[つま]がいた。その名[な]はアタラといい、オゾムの母[はは]である。"
  27: "イェラフメエルの長子[ちょうし]ラムの子[こ]らは、マアス、ヤミン、アコルである。"
  28: "オゾムの子[こ]らは、シャマイとヤダエ。シャマイの子[こ]らは、ナダブとアビシュルである。"
  29: "アビシュルの妻[つま]の名[な]はアビハイルといい、彼女[かのじょ]は彼[かれ]にアハバルとモリドを産[う]んだ。"
  30: "ナダブの子[こ]らは、サラドとアフアイム。サラドは子[こ]をもうけずに死[し]んだ。"
  31: "アフアイムの子[こ]らは、イェシミエル。イェシミエルの子[こ]らは、ソシャン。ソシャンの子[こ]らは、アフライである。"
  32: "ヤダエの子[こ]らは、アヒサマイ、イェテル、ヨナタン。イェテルは子[こ]をもうけずに死[し]んだ。"
  33: "ヨナタンの子[こ]らは、ファレトとオザザ。これらはイェラフメエルの子[こ]らである。"
  34: "ソシャンには息子[むすこ]がなく、娘[むすめ]たちだけであった。ソシャンにはエジプト人[じん]のしもべがいて、その名[な]をヨケルといった。"
  35: "ソシャンは自分[じぶん]の娘[むすめ]をしもべヨケルに妻[つま]として与[あた]え、彼女[かのじょ]は彼[かれ]にエタイを産[う]んだ。"
  36: "エタイはナタンを生[う]み、ナタンはザバドを生[う]み、"
  37: "ザバドはアファラルを生[う]み、アファラルはオベデを生[う]み、"
  38: "オベデはイエフを生[う]み、イエフはアザルヤを生[う]み、"
  39: "アザルヤはヘレスを生[う]み、ヘレスはエレアサを生[う]み、"
  40: "エレアサはソソマイを生[う]み、ソソマイはサルムを生[う]み、"
  41: "サルムはイェカミヤを生[う]み、イェカミヤはエリシャマを生[う]んだ。"
  42: "イェラフメエルの兄弟[きょうだい]カレブの子[こ]らは、長子[ちょうし]メシャ、すなわちジフの父[ちち]である。またマレシャの子[こ]ら、すなわちヘブロンの父[ちち]である。"
  43: "ヘブロンの子[こ]らは、コラ、タプアハ、レケム、シェマである。"
  44: "シェマはラハムを生[う]んだ。ラハムはヨルケアムの父[ちち]である。ヨルケアムはシャマイを生[う]んだ。"
  45: "マオンはシャマイの子[こ]であり、ベト・ツルの父[ちち]である。"
  46: "カレブの側女[そばめ]エファは、ハラン、モツァ、ガゼズを産[う]んだ。ハランはガゼズを生[う]んだ。"
  47: "ヤダイの子[こ]らは、レゲム、ヨタム、ゲシャン、ペレト、エファ、シャアフである。"
  48: "シェベルとティルハナは、カレブの側女[そばめ]マアハが産[う]んだ子[こ]らである。"
  49: "シャアフはマドマンナの父[ちち]、マフベナの父[ちち]シェワ、およびギブアの父[ちち]を生[う]んだ。カレブの娘[むすめ]はアクサである。"
  50: "これらはカレブの子[こ]らである。エフラタの長子[ちょうし]オルの子[こ]らは、キルヤト・ヤリムの父[ちち]ショバル、"
  51: "ベツレヘムの父[ちち]サルマ、ベト・ガデルの父[ちち]ハレフである。"
  52: "キルヤト・ヤリムの父[ちち]ショバルには、子[こ]らがあった。アラア、エシ、アマニト、"
  53: "エモスフェオスの諸氏族[しょしぞく]、ヤイルの町[まち]、アイタリム、ミフィティム、イサマティム、イマサライム。これらの者[もの]からサラタ人[じん]とエシュタオル人[じん]が出[で]た。"
  54: "サルマの子[こ]らは、ベツレヘム、ネトファ人[じん]、ヨアブの家[いえ]のアタロト、マナティの半分[はんぶん]、ハサレイ人[じん]、"
  55: "ヤベツに住[す]む書記[しょき]たちの氏族[しぞく]、ティルガティム、サマティム、スカティムである。これらは、レカブの家[いえ]の父[ちち]メシェマから出[で]たケニ人[じん]である。"

notes:
  1: "Ταῦτα τὰ ὀνόματα τῶν υἱῶν Ισραηλ — «вот имена сынов Израиля» (ὄνομα, υἱός). Двенадцать родоначальников в порядке рождения от Лии, затем остальные; ср. Быт 35:23–26 и 46:8–27. Имена — в формах корпуса (Быт 46:8–23): Ρουβην ルベン, Συμεων シメオン, Λευι レビ, Ιουδα ユダ, Ισσαχαρ イッサカル, Ζαβουλων ゼブルン."
  2: "Δαν, Ιωσηφ, Βενιαμιν, Νεφθαλι, Γαδ, Ασηρ — ダン、ヨセフ、ベニヤミン、ナフタリ、ガド、アシェル. Слав. «неффалим» (Неффалим), в корпусе ナフタリ. Список продолжает ст. 1, поэтому в японском точка только в конце."
  3: "Υἱοὶ Ιουδα· Ηρ, Αυναν, Σηλων, τρεῖς· ἐγεννήθησαν αὐτῷ ἐκ τῆς θυγατρὸς Σαυας τῆς Χαναανίτιδος. καὶ ἦν Ηρ ὁ πρωτότοκος Ιουδα πονηρὸς ἐναντίον κυρίου, καὶ ἀπέκτεινεν αὐτόν — エル、オナン、シェラ; «трое родились у него от дочери Шуи, Хананеянки» (θυγάτηρ, Χαναανῖτις). Греч. Σηλων, в корпусе シェラ (Быт 38:3–5); Σαυα — シュア (Быт 38:2). πονηρός ἐναντίον κυρίου — «злой пред Господом»; слав. «лукав пред Господем»."
  4: "καὶ Θαμαρ ἡ νύμφη αὐτοῦ ἔτεκεν αὐτῷ τὸν Φαρες καὶ τὸν Ζαρα. πάντες υἱοὶ Ιουδα πέντε — タマル, ペレツ, ゼラ; «невестка его» (νύμφη, 嫁). Греч. Φαρες, Ζαρα; формы корпуса ペレツ, ゼラ (Быт 38:29–30). «Пятеро» — Ер, Онан, Шела, Фарес, Зара."
  5: "υἱοὶ Φαρες· Αρσων καὶ Ιεμουηλ — アスロン、イェムエル (Быт 46:12). Греч. Αρσων; слав. «есром», Синод. «Есром, Хамул»."
  6: "καὶ υἱοὶ Ζαρα· Ζαμβρι καὶ Αιθαν καὶ Αιμαν καὶ Χαλχαλ καὶ Δαρα, πάντες πέντε — ザムブリ、アイタン、アイマン、カルカル、ダラ; «все пятеро». Те же лица, что в 3 Цар 4:31 (ガイタン、エマン、カルコル、ダルダ — формы корпуса), но 1 Пар даёт иные греч. формы: Αιθαν, Αιμαν, Χαλχαλ, Δαρα."
  7: "καὶ υἱοὶ Χαρμι· Αχαρ ὁ ἐμποδοστάτης Ισραηλ, ὃς ἠθέτησεν εἰς τὸ ἀνάθεμα — ハルミ、アハル. ἐμποδοστάτης — «ставящий преграду, смущающий» (слав. «иже смути израиля»); ἠθέτησεν εἰς τὸ ἀνάθεμα — «нарушил заклятие» (ἀθετέω, ἀνάθεμα — 聖絶). Ср. Нав 7:1, где то же лицо названо アハル."
  8: "καὶ υἱοὶ Αιθαν· Αζαρια — «сыны Ефана: Азария»; в гр. ед. число имени при мн. «сыны». Слав. «сынове ифамли азариа». Это продолжение рода Зары (ст. 6)."
  9: "καὶ υἱοὶ Εσερων, οἳ ἐτέχθησαν αὐτῷ· ὁ Ιραμεηλ καὶ ὁ Ραμ καὶ ὁ Χαλεβ καὶ Αραμ — イェラフメエル、ラム、カレブ、アラム; «которые родились у него» (τίκτω). Слав. и Синод. дают только три имени (без Рама): «иерамеил и арам и халови»; в LXX Рам — отдельный сын (в ст. 10 род Давида ведётся от Арама)."
  10: "καὶ Αραμ ἐγέννησεν τὸν Αμιναδαβ, καὶ Αμιναδαβ ἐγέννησεν τὸν Ναασσων ἄρχοντα τοῦ οἴκου Ιουδα — アミナダブ、ナアソン; «князь дома Иудина» (ἄρχων, οἶκος). Ср. Руфь 4:19–20; в 1 Пар греч. род ведётся от Арама."
  11: "καὶ Ναασσων ἐγέννησεν τὸν Σαλμων, καὶ Σαλμων ἐγέννησεν τὸν Βοος — サルモン、ボアズ (Руфь 4:20–21). Греч. Βοος, форма корпуса ボアズ."
  12: "καὶ Βοος ἐγέννησεν τὸν Ωβηδ, καὶ Ωβηδ ἐγέννησεν τὸν Ιεσσαι — オベデ、エッサイ (Руфь 4:21–22; 1 Цар 16:1). Греч. Ιεσσαι, форма корпуса エッサイ."
  13: "καὶ Ιεσσαι ἐγέννησεν τὸν πρωτότοκον αὐτοῦ Ελιαβ· Αμιναδαβ ὁ δεύτερος, Σαμαα ὁ τρίτος — エリアブ, アミナダブ, サマア (ср. 1 Цар 16:6–9; 17:13). πρωτότοκος — 長子; далее порядковые 第二、第三."
  14: "Ναθαναηλ ὁ τέταρτος, Ραδδαι ὁ πέμπτος — ナタナエル、ラダイ. В 1 Цар 17:13 братья Давида названы иначе (Елиав, Аминадав, Самма); в LXX 1 Пар здесь Роддай (Ραδδαι)."
  15: "Ασομ ὁ ἕκτος, Δαυιδ ὁ ἕβδομος — 第六、第七: オツェム、ダビデ. Слав. «асака»; Синод. «Оцем». Давид — младший из восьми сыновей (1 Цар 16:10–11), здесь седьмой, потому что один из братьев не назван."
  16: "καὶ ἀδελφὴ αὐτῶν Σαρουια καὶ Αβιγαια. καὶ υἱοὶ Σαρουια· Αβεσσα καὶ Ιωαβ καὶ Ασαηλ, τρεῖς — サルイヤ、アビガイル; アベシャ、ヨアブ、アサエル (2 Цар 2:18; 1 Цар 26:6). Сестры Давида, дочери Нааса (2 Цар 17:25)."
  17: "καὶ Αβιγαια ἐγέννησεν τὸν Αμεσσα· καὶ πατὴρ Αμεσσα Ιοθορ ὁ Ισμαηλίτης — アメサ; «отец Амессы — Иофор, Измаильтянин» (πατήρ — здесь «отец» в смысле родителя). В 2 Цар 17:25 отец назван Иеферой (Иеффер)."
  18: "Καὶ Χαλεβ υἱὸς Εσερων ἐγέννησεν τὴν Γαζουβα γυναῖκα καὶ τὴν Ιεριωθ. καὶ οὗτοι υἱοὶ αὐτῆς· Ιωασαρ καὶ Σωβαβ καὶ Ορνα — カレブ, アズバ, イエリオト; ヤシャル、ショバブ、アルドン. Греч. буквально «родил Азуву, жену, и Иериофу» — тёмное место; по слав. «поя жену азуву и иериофу» (взял в жёны), так и переведено. Ὀρνα — アルドン."
  19: "καὶ ἀπέθανεν Γαζουβα, καὶ ἔλαβεν ἑαυτῷ Χαλεβ τὴν Εφραθ, καὶ ἔτεκεν αὐτῷ τὸν Ωρ — エフラタ, オル. ἔλαβεν ἑαυτῷ — «взял себе» (λαμβάνω с дат. себе). Ωρ — отец Урии и дед Веселеила (ст. 20)."
  20: "καὶ Ωρ ἐγέννησεν τὸν Ουρι, καὶ Ουρι ἐγέννησεν τὸν Βεσελεηλ — ウリ、ベツァレル (Исх 31:2; 35:30). Греч. Βεσελεηλ, форма корпуса ベツァレル."
  21: "καὶ μετὰ ταῦτα εἰσῆλθεν Εσερων πρὸς τὴν θυγατέρα Μαχιρ πατρὸς Γαλααδ, καὶ οὗτος ἔλαβεν αὐτήν, καὶ αὐτὸς ἑξήκοντα ἦν ἐτῶν, καὶ ἔτεκεν αὐτῷ τὸν Σεγουβ — マキル、ギレアデ、セグブ; «вошёл к дочери Махира, отца Галаада, и взял её, а было ему шестьдесят лет». εἰσῆλθεν πρὸς — эвфемизм супружества."
  22: "καὶ Σεγουβ ἐγέννησεν τὸν Ιαιρ. καὶ ἦσαν αὐτῷ εἴκοσι τρεῖς πόλεις ἐν τῇ Γαλααδ — ヤイル; «двадцать три города в Галааде» (πόλις). Ср. Суд 10:3–4."
  23: "καὶ ἔλαβεν Γεδσουρ καὶ Αραμ τὰς κώμας Ιαιρ ἐξ αὐτῶν, τὴν Καναθ καὶ τὰς κώμας αὐτῆς, ἑξήκοντα πόλεις· πᾶσαι αὗται υἱῶν Μαχιρ πατρὸς Γαλααδ — ゲシュル、アラム, ケナト; «взяли у них селения Иаира... шестьдесят городов» (κώμη — 村). Греч. Γεδσουρ, форма корпуса ゲシュル."
  24: "καὶ μετὰ τὸ ἀποθανεῖν Εσερων ἦλθεν Χαλεβ εἰς Εφραθα. καὶ ἡ γυνὴ Εσερων Αβια, καὶ ἔτεκεν αὐτῷ τὸν Ασχωδ πατέρα Θεκωε — エフラタ、アビヤ、アシュフル; «отец Фекои» (πατήρ — родоначальник, テコア). Греч. Ἀσχωδ — евр. Ашхур."
  25: "καὶ ἦσαν υἱοὶ Ιερεμεηλ πρωτοτόκου Εσερων· ὁ πρωτότοκος Ραμ, καὶ Βαανα καὶ Αραν καὶ Ασομ ἀδελφὸς αὐτοῦ — ラム、バアナ、アラン、アソム; «и Асом, брат его». Греч. Ιερεμεηλ — イェラフメエル (обычная форма имени в этой книге); слав. «иерамеил»."
  26: "καὶ ἦν γυνὴ ἑτέρα τῷ Ιερεμεηλ, καὶ ὄνομα αὐτῇ Αταρα· αὕτη ἐστὶν μήτηρ Οζομ — アタラ, オゾム; «другая жена», «она — мать Озома» (ἕτερος, μήτηρ)."
  27: "καὶ ἦσαν υἱοὶ Ραμ πρωτοτόκου Ιερεμεηλ· Μαας καὶ Ιαμιν καὶ Ακορ — マアス、ヤミン、アコル. Греч. Ακορ, слав. «акор», Синод. «Екер»."
  28: "καὶ ἦσαν υἱοὶ Οζομ· Σαμαι καὶ Ιαδαε. καὶ υἱοὶ Σαμαι· Ναδαβ καὶ Αβισουρ — シャマイ、ヤダエ; ナダブ、アビシュル. Греч. Ιαδαε (Ядай), слав. «еддай»."
  29: "καὶ ὄνομα τῆς γυναικὸς Αβισουρ Αβιχαιλ, καὶ ἔτεκεν αὐτῷ τὸν Αχαβαρ καὶ τὸν Μωλιδ — アビハイル, アハバル、モリド. Греч. Αχαβαρ (Ахбар), слав. «озва»."
  30: "υἱοὶ Ναδαβ· Σαλαδ καὶ Αφφαιμ. καὶ ἀπέθανεν Σαλαδ οὐκ ἔχων τέκνα — サラド、アフアイム; «умер, не имея детей» (τέκνον). Причастие ἔχων передано оборотом «子をもうけずに»."
  31: "καὶ υἱοὶ Αφφαιμ· Ισεμιηλ. καὶ υἱοὶ Ισεμιηλ· Σωσαν. καὶ υἱοὶ Σωσαν· Αχλαι — イェシミエル、ソシャン、アフライ. Род идёт по одной линии — в греч. каждый раз «сыны» в ед. числе имени."
  32: "καὶ υἱοὶ Ιαδαε· Αχισαμαι, Ιεθερ, Ιωναθαν· καὶ ἀπέθανεν Ιεθερ οὐκ ἔχων τέκνα — アヒサマイ、イェテル、ヨナタン; «Иефер умер бездетным». Ср. ст. 30, та же формула."
  33: "καὶ υἱοὶ Ιωναθαν· Φαλεθ καὶ Οζαζα. οὗτοι ἦσαν υἱοὶ Ιερεμεηλ — ファレト、オザザ; итоговая формула «это сыны Иерахмеила» (οὗτοι ἦσαν)."
  34: "καὶ οὐκ ἦσαν τῷ Σωσαν υἱοί, ἀλλ᾿ ἢ θυγατέρες· καὶ τῷ Σωσαν παῖς Αἰγύπτιος καὶ ὄνομα αὐτῷ Ιωχηλ — ソシャン; «не было сыновей, а только дочери» (ἀλλ᾿ ἤ — «кроме как»); «раб Египтянин, имя его Иохел» (παῖς — слуга, しもべ)."
  35: "καὶ ἔδωκεν Σωσαν τὴν θυγατέρα αὐτοῦ τῷ Ιωχηλ παιδὶ αὐτοῦ εἰς γυναῖκα, καὶ ἔτεκεν αὐτῷ τὸν Εθθι — ヨケル, エタイ; «отдал дочь свою рабу своему в жену» (εἰς γυναῖκα). Греч. Εθθι — евр. Аттай."
  36: "καὶ Εθθι ἐγέννησεν τὸν Ναθαν, καὶ Ναθαν ἐγέννησεν τὸν Ζαβεδ — ナタン、ザバド. Род Ефана (ст. 6) через Шешана; ср. Лк 3:31 (Нафан — сын Давида, здесь иное лицо)."
  37: "καὶ Ζαβεδ ἐγέννησεν τὸν Αφαληλ, καὶ Αφαληλ ἐγέννησεν τὸν Ωβηδ — アファラル、オベデ. Греч. Αφαληλ (Афалил), слав. «офлад»."
  38: "καὶ Ωβηδ ἐγέννησεν τὸν Ιηου, καὶ Ιηου ἐγέννησεν τὸν Αζαριαν — イエフ、アザルヤ. Греч. Ιηου (Ииуй), винит. Αζαριαν."
  39: "καὶ Αζαριας ἐγέννησεν τὸν Χελλης, καὶ Χελλης ἐγέννησεν τὸν Ελεασα — ヘレス、エレアサ. Греч. Χελλης (Хеллис), слав. «хеллис»."
  40: "καὶ Ελεασα ἐγέννησεν τὸν Σοσομαι, καὶ Σοσομαι ἐγέννησεν τὸν Σαλουμ — ソソマイ、サルム. Греч. Σοσομαι (Сисмай), слав. «сосомай»."
  41: "καὶ Σαλουμ ἐγέννησεν τὸν Ιεχεμιαν, καὶ Ιεχεμιας ἐγέννησεν τὸν Ελισαμα — イェカミヤ、エリシャマ; конец рода Иерахмеила. Греч. Ιεχεμιας (Иекамия)."
  42: "καὶ υἱοὶ Χαλεβ ἀδελφοῦ Ιερεμεηλ· Μαρισα ὁ πρωτότοκος αὐτοῦ, οὗτος πατὴρ Ζιφ· καὶ υἱοὶ Μαρισα πατρὸς Χεβρων — メシャ, ジフ, マレシャ, ヘブロン; «Мареша, отец Хеврона». Греч. Μαρισα (Мареша), слав. «мариса»; πατήρ — родоначальник."
  43: "καὶ υἱοὶ Χεβρων· Κορε καὶ Θαπους καὶ Ρεκομ καὶ Σεμαα — コラ、タプアハ、レケム、シェマ. Греч. Θαπους (Таппуах), слав. «фафуй»."
  44: "καὶ Σεμαα ἐγέννησεν τὸν Ραεμ πατέρα Ιερκααν, καὶ Ιερκααν ἐγέννησεν τὸν Σαμαι — シェマ, ラハム, ヨルケアム, シャマイ. Греч. Ραεμ — евр. Рахам; Ιερκααν — Иоркеам (слав. «иеркаан»)."
  45: "καὶ υἱὸς αὐτοῦ Μαων, καὶ Μαων πατὴρ Βαιθσουρ — マオン, «отец Беф-Цура» (Βαιθσουρ, ベト・ツル). Сын Шаммая (ст. 44)."
  46: "καὶ Γαιφα ἡ παλλακὴ Χαλεβ ἐγέννησεν τὸν Αρραν καὶ τὸν Μωσα καὶ τὸν Γεζουε. καὶ Αρραν ἐγέννησεν τὸν Γεζουε — エファ (側女), ハラン、モツァ、ガゼズ; «и Харан родил Газеза». Греч. Γαιφα — евр. Ефа; Мωσα — Моца."
  47: "καὶ υἱοὶ Ιαδαι· Ραγεμ καὶ Ιωαθαμ καὶ Γηρσωμ καὶ Φαλετ καὶ Γαιφα καὶ Σαγαφ — ヤダイ、レゲム、ヨタム、ゲシャン、ペレト、エファ、シャアフ. Греч. Ιωαθαμ — Иофам, Γηρσωμ — Гешан (слав. «гирсом»)."
  48: "καὶ ἡ παλλακὴ Χαλεβ Μωχα ἐγέννησεν τὸν Σαβερ καὶ τὸν Θαρχνα — マアハ, シェベル、ティルハナ. Греч. Μωχα — евр. Мааха; παλλακή — 側女."
  49: "καὶ ἐγέννησεν Σαγαφ πατέρα Μαρμηνα καὶ τὸν Σαου πατέρα Μαχαβηνα καὶ πατέρα Γαιβαα· καὶ θυγάτηρ Χαλεβ Ασχα — Шагаф родил отца Мадманны, Шеву (Σαου) — отца Махбены — и отца Гивеи; дочь Халева — アクサ. Подлежащее в гр. не выражено (возможно, Мааха, ст. 48); по слав. «роди же сагаф...» — Шагаф, так и переведено. Ασχα — форма корпуса アクサ (Нав 15:16)."
  50: "οὗτοι ἦσαν υἱοὶ Χαλεβ. — υἱοὶ Ωρ πρωτοτόκου Εφραθα· Σωβαλ πατὴρ Καριαθιαριμ — ショバル, «отец Кириаф-Иарима» (Кирьятиарим). Греч. после тире начинает новый ряд: «сыны Ора, первенца Ефрафы». Слав. «сынове ора первенца ефрафова»."
  51: "Σαλωμων πατὴρ Βαιθλαεμ, Αριμ πατὴρ Βαιθγεδωρ — サルマ, ベツレヘム, ベト・ガデル. Греч. Σαλωμων здесь не Соломон, а Салма (евр. Салма); в ст. 54 то же лицо. Αριμ — Хареф."
  52: "καὶ ἦσαν υἱοὶ τῷ Σωβαλ πατρὶ Καριαθιαριμ· Αραα, Εσι, Αμμανιθ — アラア、エシ、アマニト; «у Шовала, отца Кириаф-Иарима, были сыны». Греч. Αμμανιθ — евр. Галменюхот (Синод.); текст испорчен."
  53: "Εμοσφεως, πόλις Ιαιρ, Αιθαλιμ καὶ Μιφιθιμ καὶ Ησαμαθιμ καὶ Ημασαραιμ· ἐκ τούτων ἐξήλθοσαν οἱ Σαραθαῖοι καὶ οἱ Εσθαωλαῖοι — エモスフェオス、キルヤト・ヤリム、アイタリム、ミフィティム、イサマティム、イマサライム; от них サラタ人 и エシュタオル人. Греч. πόλις Ιαιρ — «город Иаира»; слав. «кариафиарим» (Кириаф-Иарим), по нему и переведено."
  54: "υἱοὶ Σαλωμων· Βαιθλαεμ, Νετωφαθι, Αταρωθ οἴκου Ιωαβ καὶ ἥμισυ τῆς Μαναθι, Ησαρει — ベツレヘム、ネトファ人、アタロト, «дом Иоава», половина Манати, ハサレイ. Греч. Νετωφαθι — жители Нетофы (ネトファ人); οἶκος Ιωαβ — род Иоава."
  55: "πατριαὶ γραμματέων κατοικοῦντες Ιαβες, Θαργαθιιμ, Σαμαθιιμ, Σωκαθιιμ· οὗτοι οἱ Κιναῖοι οἱ ἐλθόντες ἐκ Μεσημα πατρὸς οἴκου Ρηχαβ — ヤベツに住む書記たちの氏族 (πατριά, γραμματεύς, 書記); ティルガティム、サマティム、スカティム; «это кенеи, пришедшие от Мешимы, отца дома Рехава» (Κιναῖος, ケニ人). Греч. Ρηχαβ — Рехав (не Раав); слав. «рихав», а «Месима» передана как «емаф»."
