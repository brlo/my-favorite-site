# jp-box, Премудрость Соломона, глава 19. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для 18–19 нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 19: нечестивые преследуют ушедших (1–5), облако и переход через море
# (6–12), наказание египтян и слепота (13–17), творение служит праведным (18–22).
# Прямой речи нет: вся глава — авторское повествование; красного и синего нет.
# Нумерация по gr: 22 стиха. Слав. (и Син.) — 21: csl 19:12 = gr 19:12 + gr 19:13a–b
# (до «праведне бо пострадаша за своя злобы»), csl 19:13 = gr 19:13c–14; далее
# csl N = gr N+1 (csl 19:14 = gr 19:15, ... csl 19:21 = gr 19:22). Поэтому наш
# 19:18 = csl 17, наш 19:19 = csl 18, наш 19:20 = csl 19, наш 19:21 = csl 20,
# наш 19:22 = csl 21. Перекрытие gr 19:12–14 в csl 12–13 отмечено в notes.
# В брифе сдвиг назван «19:18»; по выгрузке он фактически в 19:12–13 — держимся
# содержания gr и csl.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz. Сносок ⟨…⟩ нет: 紅海, うずら,
# ぶよ, 蛙, マナ уже в корпусе (Исх 7–16).
# Имена — транслитерация греческого (LXX); в тексте главы имён нет.

