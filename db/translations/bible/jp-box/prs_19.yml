verses:
  1: "しかし、不敬虔[ふけいけん]な者[もの]たちには、終[お]わりまであわれみのない激[はげ]しい怒[いか]りが臨[のぞ]んだ。彼[かれ]らの将来[しょうらい]のことも、前[まえ]もって知[し]っておられたからである。"
  2: "すなわち、彼[かれ]ら自身[じしん]が去[さ]ることを許[ゆる]し、急[いそ]いで彼らを送[おく]り出[だ]しておきながら、後[あと]から悔[く]いて彼らを追[お]うであろうということを。"
  3: "彼[かれ]らはまだ悲[かな]しみを手[て]の内[うち]に抱[かか]え、死者[ししゃ]の墓[はか]の前[まえ]で泣[な]き悲[かな]しみながら、さらに別[べつ]の愚[おろ]かな考[かんが]えを引[ひ]き寄[よ]せた。そして、懇願[こんがん]して追[お]い出[だ]した者[もの]たちを、逃亡者[とうぼうしゃ]として追[お]った。"
  4: "彼[かれ]らをこの終[お]わりへと引[ひ]き寄[よ]せたのは、彼らにふさわしい必然[ひつぜん]であった。それは、起[お]こったことへの忘[わす]れを彼らに植[う]え付[つ]け、彼らが苦[くる]しみに欠[か]けている罰[ばつ]を満[み]たし、"
  5: "あなたの民[たみ]は驚[おどろ]くべき旅[たび]を経験[けいけん]し、彼[かれ]らは奇妙[きみょう]な死[し]に出会[であ]うためであった。"
  6: "全[ぜん]ての被造物[ひぞうぶつ]は、あなたの命令[めいれい]に仕[つか]えながら、その種[しゅ]ごとに、再[ふたた]び上[うえ]から形[かたち]を造[つく]り変[か]えられていた。それは、あなたの子[こ]らが害[がい]を受[う]けずに守[まも]られるためであった。"
  7: "宿営[しゅくえい]を覆[おお]う雲[くも]があり、かつて水[みず]であったところから乾[かわ]いた地[ち]が現[あらわ]れ、紅海[こうかい]からは妨[さまた]げのない道[みち]が、激[はげ]しい波[なみ]からは草[くさ]の生[い]い茂[しげ]る野[の]が開[ひら]けた。"
  8: "あなたの手[て]に覆[おお]われた彼[かれ]らは、その道[みち]を全[ぜん]民[みん]とともに通[とお]り抜[ぬ]け、驚[おどろ]くべき不思議[ふしぎ]を見[み]た。"
  9: "彼[かれ]らは馬[うま]のように草[くさ]を食[は]み、子[こ]羊[ひつじ]のように跳[は]ね回[まわ]りながら、自分[じぶん]たちを救[すく]い出[だ]したあなたを、主[しゅ]よ、ほめたたえた。"
  10: "彼[かれ]らは、自分[じぶん]たちの寄留[きりゅう]の地[ち]でのことをまだ覚[おぼ]えていた。すなわち、動物[どうぶつ]の誕生[たんじょう]の代[か]わりに地がぶよを生[う]み出[だ]し、水[みず]の生[い]き物[もの]の代わりに川[かわ]が無数[むすう]の蛙[かえる]を吐[は]き出[だ]したことである。"
  11: "その後[あと]で彼[かれ]らは、鳥[とり]の新[あたら]しい種[しゅ]も見[み]た。すなわち、欲望[よくぼう]に駆[か]られて、贅沢[ぜいたく]な食物[しょくもつ]を求[もと]めたときのことである。"
  12: "彼[かれ]らを慰[なぐさ]めるために、海[うみ]からうずらが上[のぼ]って来[き]た。"
  13: "しかし、罪人[つみびと]たちには罰[ばつ]が臨[のぞ]んだ。それも、雷[かみなり]の力[ちから]による先[さき]のしるしなしではなかった。彼[かれ]らは自分[じぶん]の悪[あく]のゆえに正[ただ]しく苦[くる]しんだのである。実[じつ]に彼らは、さらに激[はげ]しい外国人嫌[がいこくじんぎら]いを行[おこな]った。"
  14: "一方[いっぽう]、ある者[もの]たちは、見知[みし]らぬ者[もの]が来[き]ても受[う]け入[い]れなかった。しかし、この者[もの]たちは、恩人[おんじん]である異邦人[いほうじん]を奴隷[どれい]にした。"
  15: "この者[もの]たちはそれだけでなく、異邦人[いほうじん]を敵意[てきい]をもって迎[むか]えたため、さらに訪[おとず]れの裁[さば]きを受[う]けることになる。"
  16: "彼[かれ]らは、喜[よろこ]びの宴[うたげ]をもって迎[むか]え入[い]れた者[もの]たち、すなわちすでに同[おな]じ権利[けんり]にあずかっていた者たちを、恐[おそ]ろしい労苦[ろうく]で苦[くる]しめた。"
  17: "彼[かれ]らは、あの者[もの]たちが正[ただ]しい人[ひと]の戸口[とぐち]で受[う]けたのと同[おな]じく、目[め]が見[み]えなくなることによって打[う]たれた。それは、彼らが大[おお]きく開[ひら]いた闇[やみ]に包[つつ]まれ、それぞれが自分[じぶん]の戸口への通[とお]り道[みち]を求[もと]めたときのことであった。"
  18: "元素[げんそ]たちは自[みずか]ら移[うつ]り変[か]わった。ちょうど、竪琴[たてごと]では音[おと]がリズムの名[な]を変[か]えながら、いつも同[おな]じ響[ひび]きを保[たも]っているようなものである。このことは、起[お]こったことの現[あらわ]れから正確[せいかく]に推[おし]し量[はか]ることができる。"
  19: "地[ち]の動物[どうぶつ]は水[みず]の動物に変[か]わり、泳[およ]ぐものは地の上[うえ]へ移[うつ]った。"
  20: "火[ひ]は水[みず]の中[なか]で自分[じぶん]の力[ちから]を保[たも]ち、水は消[け]す性質[せいしつ]を忘[わす]れた。"
  21: "炎[ほのお]は、逆[ぎゃく]に、滅[ほろ]びやすい動物[どうぶつ]たちがその中[なか]を歩[あゆ]んでも彼[かれ]らの肉[にく]を焦[こ]がさず、水晶[すいしょう]のように溶[と]けやすい不死[ふし]の食物[しょくもつ]も溶[と]かさなかった。"
  22: "主[しゅ]よ、あなたはすべてにおいて、あなたの民[たみ]を大[おお]きくし、栄光[えいこう]をお与[あた]えになった。あなたは、すべての時[とき]と場所[ばしょ]に立[た]ち会[あ]いながら、彼[かれ]らを見捨[みす]てることはなかった。"

notes:
  1: "Τοῖς δὲ ἀσεβέσιν — «нечестивым» (ἀσεβής; ср. 不敬虔). μέχρι τέλους — «до конца». ἀνελεήμων θυμὸς ἐπέστη — «немилостивая ярость наступила» (ἀνελεήμων; ἐφίστημι). προῄδει γὰρ αὐτῶν καὶ τὰ μέλλοντα — «ибо Он предвидел и будущее их» (προοἶδα); подлежащее подразумевается — Бог. Слав. «предведе бо их и будущая»."
  2: "ὅτι αὐτοὶ ἐπιτρέψαντες τοῦ ἀπιέναι — «что они сами, позволив уйти» (ἐπιτρέπω с инф.). μετὰ σπουδῆς προπέμψαντες — «с поспешностью отправив/выпроводив» (προπέμπω). διώξουσιν μεταμεληθέντες — «будут преследовать, раскаявшись» (μεταμέλομαι — «раскаиваться, передумывать»). Это содержание предведения из 19:1; в тексте передано оборотом …ということを."
  3: "ἔτι ... ἐν χερσὶν ἔχοντες τὰ πένθη — «ещё держа в руках печали/плач» (πένθος — «траур, плач»). προσοδυρόμενοι τάφοις νεκρῶν — «причитая над гробами мёртвых» (προσοδύρομαι). ἕτερον ἐπεσπάσαντο λογισμὸν ἀνοίας — «привлекли к себе другой помысл безумия» (ἐπισπάομαι; λογισμός). οὓς ἱκετεύοντες ἐξέβαλον — «тех, кого, умоляя, изгнали» (ἱκετεύω). ὡς φυγάδας ἐδίωκον — «преследовали как беглецов» (φυγάς)."
  4: "εἷλκεν ... ἡ ἀξία ... ἀνάγκη — «влекла их заслуженная необходимость» (ἕλκω; ἀξία — «достойная»; ἀνάγκη — «необходимость»). τῶν συμβεβηκότων ἀμνηστίαν ἐνέβαλεν — «вложила забвение происшедшего» (ἀμνηστία; ἐμβάλλω). ἵνα τὴν λείπουσαν ταῖς βασάνοις προσαναπληρώσωσιν κόλασιν — «чтобы восполнили недостающее к мучениям наказание» (προσαναπληρόω; βάσανος — «мучение»). Стихи 4–5 в LXX — одно предложение с ἵνα; 4 оканчивается на 満たし、."
  5: "ὁ μὲν λαός σου παράδοξον ὁδοιπορίαν πειράσῃ — «народ Твой испытает необычайное странствие» (παράδοξος; πειράω — «испытывать»). ἐκεῖνοι δὲ ξένον εὕρωσι θάνατον — «а те найдут странную смерть» (ξένος). Оба под ἵνα из 19:4; в тексте 5 завершает ためであった."
  6: "ὅλη ... ἡ κτίσις ἐν ἰδίῳ γένει πάλιν ἄνωθεν διετυποῦτο — «всё творение в своём роде снова свыше преобразовывалось» (κτίσις; γένος; διατυπόω — «придавать форму»). ὑπηρετοῦσα ταῖς σαῖς ἐπιταγαῖς — «служа Твоим повелениям» (ὑπηρετέω; ἐπιταγή). ἵνα οἱ σοὶ παῖδες φυλαχθῶσιν ἀβλαβεῖς — «чтобы Твои дети сохранились невредимыми» (ἀβλαβής)."
  7: "ἡ τὴν παρεμβολὴν σκιάζουσα νεφέλη — «облако, осеняющее стан» (παρεμβολή — «стан, ополчение»; σκιάζω). ἐκ ... προυφεστῶτος ὕδατος ξηρᾶς ἀνάδυσις γῆς ἐθεωρήθη — «из прежде бывшей воды явилось выступление сухой земли» (προϋφίστημι; ἀνάδυσις). ἐξ ἐρυθρᾶς θαλάσσης ὁδὸς ἀνεμπόδιστος — «из Красного моря беспрепятственный путь». χλοηφόρον πεδίον ἐκ κλύδωνος βιαίου — «зеленеющее поле из сильного волнения» (χλοηφόρος; κλύδων)."
  8: "δι᾽ οὗ πανεθνεὶ διῆλθον — «через который прошли всем народом» (πανεθνεί — «всем племенем/народом»). οἱ τῇ σῇ σκεπαζόμενοι χειρί — «покрываемые Твоей рукой» (σκεπάζω). θεωρήσαντες θαυμαστὰ τέρατα — «увидев дивные чудеса» (τέρας)."
  9: "ὡς ἵπποι ἐνεμήθησαν — «как кони паслись» (νέμω — «пасти»; слав. «насытишася» — 'насытились', в тексте 草を食み по LXX). ὡς ἀμνοὶ διεσκίρτησαν — «как агнцы взыграли» (διασκιρτάω). αἰνοῦντές σε, κύριε, τὸν ῥυσάμενον αὐτούς — «хваля Тебя, Господи, избавившего их» (αἰνέω; ῥύομαι). Слав. «якоже бо кони насытишася, и яко агнцы взыграшася»."
  10: "ἐμέμνηντο ... τῶν ἐν τῇ παροικίᾳ αὐτῶν — «помнили о том, что было в их странствовании/переселении» (παροικία). ἀντὶ μὲν γενέσεως ζῴων ἐξήγαγεν ἡ γῆ σκνῖπα — «вместо рождения животных земля произвела скнипов/мошек» (σκνίψ; ср. Исх 8:12–14, ぶよ). ἀντὶ δὲ ἐνύδρων ἐξηρεύξατο ὁ ποταμὸς πλῆθος βατράχων — «вместо водных [животных] река изрыгнула множество жаб» (ἐξερεύγομαι; βάτραχος)."
  11: "ἐφ᾽ ὑστέρῳ — «после, затем» (ὕστερος). γένεσιν νέαν ὀρνέων — «новое поколение/род птиц» (γένεσις). ὅτε ἐπιθυμίᾳ προαχθέντες ᾐτήσαντο ἐδέσματα τρυφῆς — «когда, побуждённые желанием, попросили яств роскоши» (προάγω; ἔδεσμα; τρυφή). Речь о перепелах (Исх 16:13)."
  12: "εἰς παραμυθίαν — «в утешение» (παραμυθία). ἐκ θαλάσσης ἀνέβη αὐτοῖς ὀρτυγομήτρα — «из моря поднялась им перепелиная стая» (ὀρτυγομήτρα — «перепел/перепелиный поток»); в тексте うずら, как в Исх 16:13. Слав. 19:12 включает и начало gr 19:13 («и мучения грешным наидоша...»), поэтому дальше слав. сдвинут: см. 13–14."
  13: "αἱ τιμωρίαι ... ἐπῆλθον οὐκ ἄνευ τῶν προγεγονότων τεκμηρίων — «наказания пришли не без прежде бывших знамений» (τιμωρία; τεκμήριον — «знак, доказательство»). τῇ βίᾳ τῶν κεραυνῶν — «силой молний/громов» (κεραυνός). δικαίως ... ἔπασχον ταῖς ἰδίαις αὐτῶν πονηρίαις — «справедливо страдали за собственные пороки» (πονηρία). χαλεπωτέραν μισοξενίαν ἐπετήδευσαν — «ввели в обычай более тяжкую ненависть к странникам» (μισοξενία). Слав. 19:12 содержит gr 19:13a–b, а csl 19:13 начинается с этого последнего оборота и включает gr 19:14; в нашем 19:13 — весь gr 19:13."
  14: "οἱ μὲν γὰρ τοὺς ἀγνοοῦντας οὐκ ἐδέχοντο παρόντας — «ибо те не принимали незнающих/неизвестных, когда те приходили» (ἀγνοέω; δέχομαι); речь о содомлянах (Быт 19). οὗτοι δὲ εὐεργέτας ξένους ἐδουλοῦντο — «а эти порабощали странников-благодетелей» (εὐεργέτης; δουλόω). Слав. 19:13 (вторая половина) = этот стих; в нашем тексте 19:14."
  15: "καὶ οὐ μόνον, ἀλλ᾽ ἤ τις ἐπισκοπὴ ἔσται αὐτῶν — «и не только, но будет некое посещение/суд над ними» (ἐπισκοπή — «посещение, попечение, суд»). ἐπεὶ ἀπεχθῶς προσεδέχοντο τοὺς ἀλλοτρίους — «так как враждебно принимали чужих» (ἀπεχθῶς; ἀλλότριος). Слав. 19:14 = этот стих («И не токмо, но аще кое разсмотрение будет их...»)."
  16: "οἱ δὲ μετὰ ἑορτασμάτων εἰσδεξάμενοι — «а те, кто принял с празднествами/ликованием» (ἑορτασμός; εἰσδέχομαι). τοὺς ἤδη τῶν αὐτῶν μετεσχηκότας δικαίων — «уже причастных тем же правам» (μετέχω; δίκαια — «права»); слав. «приобщившихся уже их обычаем» — иное чтение (обычаи), в тексте 同じ権利 по LXX, слав. в notes. δεινοῖς ἐκάκωσαν πόνοις — «измучили страшными трудами» (κακόω; πόνος). Слав. 19:15 = этот стих."
  17: "ἐπλήγησαν δὲ καὶ ἀορασίᾳ — «были поражены и невидением/слепотой» (ἀορασία). ὥσπερ ἐκεῖνοι ἐπὶ ταῖς τοῦ δικαίου θύραις — «как те при дверях праведника» (о содомлянах, Быт 19:11). ἀχανεῖ περιβληθέντες σκότει — «облечённые в зияющую/разверстую тьму» (ἀχανής — «зияющий»); в тексте 大きく開いた闇. ἕκαστος τῶν ἑαυτοῦ θυρῶν τὴν δίοδον ἐζήτει — «каждый искал прохода своих дверей». Слав. 19:16 = этот стих."
  18: "δι᾽ ἑαυτῶν ... τὰ στοιχεῖα μεθαρμοζόμενα — «стихии, изменяемые сами собой» (στοιχεῖον; μεθαρμόζω — «перестраивать, менять»). ὥσπερ ἐν ψαλτηρίῳ φθόγγοι τοῦ ῥυθμοῦ τὸ ὄνομα διαλλάσσουσιν — «как в псалтири звуки меняют имя ритма» (ψαλτήριον — 竪琴, струнный инструмент Псалтири; ῥυθμός; διαλλάσσω); слав. «в гуслех гласы сличия имя пременяют» — тёмное место. πάντοτε μένοντα ἤχῳ — «всегда оставаясь в звуке». ὅπερ ἐστὶν εἰκάσαι ... ἀκριβῶς — «что можно точно уразуметь по виду происшедшего» (εἰκάζω — «уподоблять, предполагать»). По выгрузке это csl 19:17, а не 19:18; слав. сдвиг начался в 12–13."
  19: "χερσαῖα ... εἰς ἔνυδρα μετεβάλλετο — «земные [животные] превращались в водных» (χερσαῖος; ἔνυδρος; μεταβάλλω). νηκτὰ μετέβαινεν ἐπὶ γῆς — «плавающие переходили на землю» (νηκτός). Этот стих в csl — 19:18; в нашем тексте 19:19 по gr."
  20: "πῦρ ἴσχυεν ἐν ὕδατι τῆς ἰδίας δυνάμεως — «огонь в воде сохранял свою силу» (ἰσχύω; δύναμις). ὕδωρ τῆς σβεστικῆς φύσεως ἐπελανθάνετο — «вода забывала свою гасящую природу» (σβεστικός; ἐπιλανθάνομαι). Слав. 19:19 = этот стих."
  21: "φλόγες ... εὐφθάρτων ζῴων οὐκ ἐμάραναν σάρκας ἐμπεριπατούντων — «пламя не иссушило/не опалило плоти легко разрушимых животных, ходящих в нём» (φλόξ; εὔφθαρτος; μαραίνω; ἐμπεριπατέω). οὐδὲ ... εὔτηκτον γένος ἀμβροσίας τροφῆς — «и не растопило легко тающего рода амброзийной/бессмертной пищи» (τηκτός; κρυσταλλοειδής — «кристалловидный»; ἀμβροσία — «амброзия, пища бессмертия»); слав. «сладостныя пищи» — иное чтение, в тексте 不死の食物 по LXX, слав. в notes. Слав. 19:20 = этот стих."
  22: "κατὰ πάντα ... ἐμεγάλυνας τὸν λαόν σου καὶ ἐδόξασας — «во всём Ты возвеличил и прославил народ Твой» (μεγαλύνω; δοξάζω). οὐχ ὑπερεῖδες — «не презрел» (ὑπεροράω). ἐν παντὶ καιρῷ καὶ τόπῳ παριστάμενος — «предстоя/присутствуя во всякое время и на всяком месте» (παρίστημι). Слав. 19:21 = этот стих; в нашем тексте 19:22 по gr."
