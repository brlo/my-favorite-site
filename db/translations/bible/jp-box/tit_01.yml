# jp-box, Послание к Титу, глава 1. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 1: надписание и приветствие (1–4), поручение оставить Крит и поставить
# пресвитеров по городам (5), качества епископа (6–9), лжеучители из обрезанных
# и «критский пророк» (10–14), «всё чисто чистым» и обличение неверных (15–16).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет.
# 〔…〕 в главе нет: [καὶ] (1:10) стоит в базе в квадратных скобках критического издания,
# слово в базе есть, поэтому не оборачивается (проверено запросом к gr-lxx-byz).
# 1:1–3 в греч. — анаколуф: период без главного сказуемого, синтаксис обрывается;
# деление на предложения только по-японски, порядок и содержание сохранены.
# 1:12 — цитата критского поэта Эпименида, НЕ Писание: оформлена 「…」, разбор в notes.
# Термины выровнены по 1–2 Тим: ἀνέγκλητος — 非の責めのない者 (1 Тим 3:10; там же ἀνεπίλημπτος —
# 非難されるところのない者), αἰσχροκερδής — 不正な利 (1 Тим 3:8), πάροινος — ぶどう酒にふけらず
# (1 Тим 3:3), πλήκτης — 人を打たず (там же), ἐλέγχω — 戒める (1 Тим 5:20).
# Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

tr_code: jp-box
book: tit
chapter: 1
draft: true

verses:
  1: "パウロ、神[かみ]の僕[しもべ]であり、イエス・キリストの使徒[しと]である。神[かみ]の選[えら]ばれた者[もの]たちの信仰[しんこう]に基[もと]づき、敬虔[けいけん]にかなう真理[しんり]の認識[にんしき]に基[もと]づいて、"
  2: "永遠[えいえん]の命[いのち]の希望[きぼう]を抱[いだ]き、この命[いのち]を、偽[いつわ]りのない神[かみ]は、永遠[えいえん]の昔[むかし]から約束[やくそく]してくださった。"
  3: "そして、それぞれの時[とき]に、ご自身[じしん]の言葉[ことば]を、宣教[せんきょう]によって明[あき]らかにされた。この宣教[せんきょう]は、わたしたちの救[すく]い主[ぬし]である神[かみ]の命令[めいれい]によって、わたしに託[たく]されたものである。"
  4: "共同[きょうどう]の信仰[しんこう]に基[もと]づく真[しん]の子[こ]テトスへ。恵[めぐ]みと平和[へいわ]が、父[ちち]である神[かみ]と、わたしたちの救[すく]い主[ぬし]イエス・キリストから、あなたにありますように。"
  5: "わたしがあなたをクレタに残[のこ]したのは、欠[か]けていることを補[おぎな]って整[ととの]え、また、わたしがあなたに命[めい]じたとおりに、町[まち]ごとに長老[ちょうろう]たちを立[た]てるためである。"
  6: "すなわち、非[ひ]の責[せ]めのない者[もの]、ひとりの妻[つま]の夫[おっと]であり、信[しん]じる子[こ]どもを持[も]ち、放蕩[ほうとう]や不[ふ]従[じゅう]の訴[うった]えのない者[もの]である。"
  7: "というのは、監督[かんとく]は神[かみ]の家[いえ]の管理[かんり]者[しゃ]として、非[ひ]の責[せ]めのない者[もの]でなければならないからである。わがままでなく、怒[いか]りっぽくなく、ぶどう酒[さけ]にふけらず、人[ひと]を打[う]たず、不正[ふせい]な利[り]を求[もと]めず、"
  8: "かえって、旅[たび]の人[ひと]を迎[むか]え入[い]れ、善[よ]を愛[あい]し、慎[つつし]み深く、正[ただ]しく、聖[せい]であり、自制[じせい]する者[もの]であり、"
  9: "教[きょう]えにかなう信[しん]実[じつ]な言葉[ことば]を固[かた]く守[まも]る者[もの]でなければならない。それは、健全[けんぜん]な教[きょう]えによって勧[すす]め、また反[はん]対[たい]する者[もの]を戒[いまし]める力[ちから]を持[も]つためである。"
  10: "というのは、不[ふ]従[じゅう]な者[もの]、むなしい論[ろん]を語[かた]る者[もの]、人[ひと]を惑[まど]わす者[もの]が多[おお]くいて、特[とく]に割礼[かつれい]を受[う]けた者[もの]たちの間[あいだ]に多[おお]いからである。"
  11: "彼[かれ]らの口[くち]をふさがなければならない。彼[かれ]らは、不正[ふせい]な利[り]のために、教[おし]えてはならないことを教[おし]えて、家[いえ]という家[いえ]を丸[まる]ごと覆[くつがえ]しているからである。"
  12: "彼[かれ]らのうちの一人[ひとり]、彼[かれ]ら自身[じしん]の預言[よげん]者[しゃ]がこう言[い]った。「クレタ人[じん]はいつも偽[いつわ]りを言[い]い、悪[わる]い獣[けもの]、怠惰[たいだ]な腹[はら]である」。"
  13: "この証言[しょうげん]は真実[しんじつ]である。だから、彼[かれ]らが信仰[しんこう]において健全[けんぜん]になるために、彼[かれ]らを厳[きび]しく戒[いまし]めなさい。"
  14: "それは、ユダヤ的[ゆだやてき]な作[つく]り話[ばなし]や、真理[しんり]から背[そむ]く人[ひと]々[びと]の掟[おきて]に、心[こころ]を向[む]けないようにするためである。"
  15: "清[きよ]い者[もの]には、すべてのものが清[きよ]い。しかし、汚[けが]れた者[もの]と信[しん]じない者[もの]には、何[なに]一つ清[きよ]いものはない。かえって、彼[かれ]らの知性[ちせい]も良心[りょうしん]も汚[けが]れている。"
  16: "彼[かれ]らは神[かみ]を知[し]っていると公言[こうげん]しながら、行[おこな]いによって神[かみ]を否[いな]んでいる。忌[い]まわしい者[もの]、不[ふ]従[じゅう]な者[もの]、すべての善[よ]い行[おこな]いについて失格[しっかく]の者[もの]である。"

notes:
  1: "Παῦλος δοῦλος θεοῦ, ἀπόστολος δὲ Ἰησοῦ Χριστοῦ — 神の僕であり、イエス・キリストの使徒. κατὰ πίστιν ἐκλεκτῶν θεοῦ καὶ ἐπίγνωσιν ἀληθείας τῆς κατ᾽ εὐσέβειαν — 神の選ばれた者たちの信仰に基づき、敬虔にかなう真理の認識に基づいて: два κατὰ при одном ἀπόστολος. ἐπίγνωσις — 認識, полное знание, а не «мнение». В греч. период 1–3 — анаколуф (нет главного сказуемого); на предложения делит только японский, содержание и порядок не переставлены."
  2: "ἐπ᾽ ἐλπίδι ζωῆς αἰωνίου — 永遠の命の希望を抱き (ἐλπίς — надежда как основание, не «ожидание»). ὁ ἀψευδὴς θεός — 偽りのない神 (ἀψευδής, «не лгущий»; ἁπ. λεγ. в НЗ). πρὸ χρόνων αἰωνίων — 永遠の昔から («прежде вековых времен», ср. 2 Тим 1:9; букв. «прежде времен вечных»)."
  3: "ἐφανέρωσεν δὲ καιροῖς ἰδίοις τὸν λόγον αὐτοῦ — それぞれの時に、ご自身の言葉を…明らかにされた (καιροῖς ἰδίοις — «в свои времена»). ἐν κηρύγματι — 宣教によって. κατ᾽ ἐπιταγὴν τοῦ σωτῆρος ἡμῶν θεοῦ — わたしたちの救い主である神の命令によって. σωτήρ — 救い主; в пастырских — титул и Бога, и Христа."
  4: "Τίτῳ γνησίῳ τέκνῳ — 真の子テトス (γνήσιος — законный, подлинный, не «любимый»). κατὰ κοινὴν πίστιν — 共同の信仰に基づく (κοινή — общая). χάρις καὶ εἰρήνη — 恵みと平和, формула приветствия. В базе формула без κυρίου; слова нет — не добавлено и не обёрнуто."
  5: "ἀπέλιπόν σε ἐν Κρήτῃ — あなたをクレタに残した. τὰ λείποντα ἐπιδιορθώσῃ — 欠けていることを補って整え (ἐπιδιορθόω — довершать недостающее, приводить в порядок). κατὰ πόλιν — 町ごとに. πρεσβύτεροι — 長老 (не «священники»: ср. Деян 14:23)."
  6: "ἀνέγκλητος — 非の責めのない者 (юридически не подлежащий обвинению, не «безгрешный»; как в 1 Тим 3:10; ср. ἀνεπίλημπτος в 1 Тим 3:2 — 非難されるところのない). μιᾶς γυναικὸς ἀνήρ — ひとりの妻の夫 (как в 1 Тим 3:2). τέκνα ἔχων πιστά — 信じる子どもたちを持ち (πιστά — верующие, не «верные»). μὴ ἐν κατηγορίᾳ ἀσωτίας ἢ ἀνυπότακτα — 放蕩や不従の訴えのない."
  7: "δεῖ γὰρ τὸν ἐπίσκοπον — 監督は…でなければならない (ἐπίσκοπος — 監督, как в Деян 20:28). ὡς θεοῦ οἰκονόμον — 神の家の管理者として (οἰκονόμος; ср. οἰκονομία в Еф 1:10, там 経綸). Пять отрицаний сохранены порознь: μὴ αὐθάδη — わがまま; μὴ ὀργίλον — 怒りっぽく; μὴ πάροινον — ぶどう酒にふけらず (как в 1 Тим 3:3); μὴ πλήκτην — 人を打たず (πλήκτης — «драчун»); μὴ αἰσχροκερδῆ — 不正な利を求めず (αἰσχροκερδής — «постыдная корысть»; как в 1 Тим 3:8)."
  8: "φιλόξενος — 旅の人を迎え入れ; φιλάγαθος — 善を愛し; σώφρων — 慎み深く; δίκαιος — 正しく; ὅσιος — 聖であり (ὅσιος — «преподобный, благочестивый»); ἐγκρατής — 自制する. Ряд продолжает δεῖ… εἶναι из ст. 7: по-японски «であり、», сказуемое — в ст. 9."
  9: "ἀντεχόμενον τοῦ κατὰ τὴν διδαχὴν πιστοῦ λόγου — 教えにかなう信実な言葉を固く守る (ἀντέχομαι — держаться). ἵνα δυνατὸς ᾖ — …力を持つため. διδασκαλία ὑγιαίνουσα — 健全な教え, формула пастырских. ἐλέγχειν — 戒める (ἐλέγχω — обличать; в корпусе 1 Тим 5:20 — 戒めなさい; здесь «обличать противящихся», без смягчения)."
  10: "В базе [καὶ] — слово стоит в квадратных скобках критического издания, но в базе есть, поэтому 〔…〕 не ставятся. ματαιολόγοι — むなしい論を語る者 (ματαιολόγος — «пустослов»; ср. ματαιολογία в 1 Тим 1:6 — むなしい論). φρεναπάται — 人を惑わす者 (φρεναπάτης, «обманывающий ум»). οἱ ἐκ τῆς περιτομῆς — 割礼を受けた者たち (о 割礼 уже была сноска в Деян, повторно не ставится)."
  11: "ἐπιστομίζειν — 口をふさぐ (букв. «надевать узду на рот»). ὅλους οἴκους ἀνατρέπουσιν — 家々を丸ごと覆す. ἃ μὴ δεῖ — 教えてはならないこと. αἰσχροῦ κέρδους χάριν — 不正な利のために (ср. αἰσχροκερδής в 1:7 и 1 Тим 3:8)."
  12: "Цитата критского поэта Эпименида (VI–V в. до Р. Х.); Павел называет его ἴδιος αὐτῶν προφήτης — 彼ら自身の預言者. Это НЕ Писание: оформлено 「…」 как цитата, но не красное и не сноска. Κρῆτες ἀεὶ ψεῦσται — クレタ人はいつも偽りを言い; κακὰ θηρία — 悪い獣; γαστέρες ἀργαί — 怠惰な腹 (букв. «праздные утробы»)."
  13: "ἡ μαρτυρία αὕτη ἐστὶν ἀληθής — この証言は真実である. δι᾽ ἣν αἰτίαν — だから. ἀποτόμως — 厳しく (ἀποτόμως — «резко, без снисхождения»). ἵνα ὑγιαίνωσιν ἐν τῇ πίστει — 信仰において健全になるために."
  14: "Ἰουδαϊκοὶ μῦθοι — ユダヤ的な作り話. ἐντολαῖς ἀνθρώπων ἀποστρεφομένων τὴν ἀλήθειαν — 真理から背く人々の掟 (ἀποστρέφω — отвращаться, отворачиваться). μὴ προσέχοντες — 心を向けない (προσέχω — внимать)."
  15: "πάντα καθαρὰ τοῖς καθαροῖς — 清い者には、すべてのものが清い (ср. Рим 14:20). μεμιαμμένοι — 汚れた者 (μιαίνω). οὐδὲν καθαρόν — 何一つ清いものはない. ὁ νοῦς καὶ ἡ συνείδησις — 知性も良心も (νοῦς — ум; здесь не «рассудок»)."
  16: "θεὸν ὁμολογοῦσιν εἰδέναι — 神を知っていると公言しながら. τοῖς ἔργοις ἀρνοῦνται — 行いによって否んでいる. βδελυκτοί — 忌まわしい (βδελύσσομαι — гнушаться). ἀπειθεῖς — 不従な. ἀδόκιμοι — 失格の (ἀδόκιμος — не выдержавший испытания; ср. 2 Кор 13:5)."
