# jp-box, 1-я Царств, глава 26. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет,
# jp-ni (под авторским правом) не использовался.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 26: зифеи выдают Давида (1); Саул в пустыне Зиф (2–4); Давид и Авесса
# в стане, копьё и сосуд с водой (5–12); укор Авениру со скалы (13–16);
# узнавание и речь Давида (17–20); раскаяние Саула и прощание (21–25).
# Речь персонажей — 「…」 (1, 6, 8, 9, 10–11, 14, 15–16, 17, 18–20, 21, 22–24, 25);
# вложенная речь — 『…』 (19 — слова изгнавших). Непрерывные речи 10–11, 15–16,
# 18–20, 22–24 не закрываются на границах стихов, как в греческом.
# Красного нет.
# Нумерация по gr: 25 стихов, совпадает с csl/ru.
# 〔…〕 нет: в gr-lxx-byz на месте каждого стиха есть текст, знака «.» нет;
# добавлений церковного чтения в текст не вносилось (слав. и масорет. вставки —
# в notes).
# Сносок ⟨…⟩ нет: 陣, 将軍, 槍, 器, 嗣業, 油を注がれた者 уже в корпусе.
# jp-ni не использовался.

