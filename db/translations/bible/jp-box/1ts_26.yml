verses:
  1: "ジフ人[じん]たちは乾[かわ]いた地[ち]から、サウルのところへ丘[おか]に上[のぼ]って来[き]て言[い]った。「見[み]よ、ダビデはわたしたちのもと、イェシムンの前[まえ]にあるエヘラの丘に身[み]を隠[かく]している。」"
  2: "サウルは立[た]って、イスラエルから選[えら]ばれた者[もの]三千人[さんぜんにん]とともにジフの荒野[こうや]へ下[くだ]り、ジフの荒野でダビデを探[さが]した。"
  3: "サウルは道[みち]に沿[そ]った、イェシムンの前[まえ]にあるエヘラの丘[おか]に陣[じん]を敷[し]いた。ダビデは荒野[こうや]に住[す]んでいた。ダビデは、サウルが自分[じぶん]の後[あと]を追[お]って荒野へ来[き]たのを見[み]た。"
  4: "ダビデは斥候[せっこう]たちを遣[つか]わし、サウルがケイラから来[き]たことを知[し]った。"
  5: "ダビデは立[た]って、ひそかにサウルが眠[ねむ]っている場所[ばしょ]へ行[い]った。そこには、サウルの将軍[しょうぐん]であるネルの子[こ]アベネルがおり、サウルは覆[おお]いのある車[くるま]の中[なか]で眠っていた。民[たみ]は彼[かれ]の周[まわ]りに陣[じん]を敷[し]いていた。"
  6: "ダビデは答[こた]えて、ヘテ人[じん]アヒメレクと、ヨアブの兄弟[きょうだい]であるツルヤの子[こ]アベシャに言[い]った。「だれがわたしとともにサウルのところへ、陣[じん]の中[なか]へ入[はい]るのか。」アベシャは言った。「わたしがあなたとともに入る。」"
  7: "ダビデとアベシャは夜[よる]、民[たみ]のところへ入[はい]って行[い]った。見[み]よ、サウルは覆[おお]いのある車[くるま]の中[なか]でぐっすり眠[ねむ]っており、その槍[やり]は頭[あたま]のそばの地面[じめん]に突[つ]き刺[さ]さっていた。アベネルと民も彼[かれ]の周[まわ]りで眠っていた。"
  8: "アベシャはダビデに言[い]った。「主[しゅ]は今日[きょう]、あなたの敵[てき]をあなたの手[て]に閉[と]じ込[こ]めた。今[いま]、わたしが彼[かれ]を槍[やり]で一[いち]度[ど]に地面[じめん]に突[つ]き刺[さ]そう。二度[にど]は繰[く]り返[かえ]さない。」"
  9: "ダビデはアベシャに言[い]った。「彼[かれ]を殺[ころ]してはならない。主[しゅ]の油[あぶら]を注[そそ]がれた者[もの]に手[て]をかけて、罰[ばつ]を受[う]けずに済[す]む者がだれかいるか。」"
  10: "ダビデは言[い]った。「主[しゅ]は生[い]きておられる。主が彼[かれ]を打[う]たれるか、彼の日[ひ]が来[き]て死[し]ぬか、あるいは戦[いくさ]に下[くだ]って取[と]り除[のぞ]かれるか、そのいずれかだ。"
  11: "主[しゅ]がわたしに、主の油[あぶら]を注[そそ]がれた者[もの]に手[て]をかけることをお許[ゆる]しにならないように。そして今[いま]、彼[かれ]の頭[あたま]のそばから槍[やり]と水[みず]の器[うつわ]を取[と]り、わたしたちは自分[じぶん]たちのところへ去[さ]ろう。」"
  12: "ダビデは頭[あたま]のそばから槍[やり]と水[みず]の器[うつわ]を取[と]った。彼[かれ]らは自分[じぶん]たちのところへ去[さ]った。見[み]る者[もの]も、知[し]る者も、起[お]きる者もなかった。すべての人[ひと]が眠[ねむ]っていた。主[しゅ]からの恐[おそ]れが彼らに落[お]ちたからである。"
  13: "ダビデは向[む]こう側[がわ]へ渡[わた]り、遠[とお]く、山[やま]の頂[いただき]に立[た]った。彼[かれ]らの間[あいだ]には多[おお]きな隔[へだ]たりがあった。"
  14: "ダビデは民[たみ]に呼[よ]びかけ、アベネルに言[い]った。「アベネル、答[こた]えないのか。」アベネルは答えて言った。「あなたはだれか。わたしを呼ぶ者[もの]は。」"
  15: "ダビデはアベネルに言[い]った。「あなたは男[おとこ]ではないか。イスラエルで、あなたに並[なら]ぶ者[もの]がだれかいるか。なぜ、あなたはあなたの主人[しゅじん]である王[おう]を守[まも]らないのか。民[たみ]の一人[ひとり]が入[はい]って、あなたの主人である王を滅[ほろ]ぼそうとしたのだ。"
  16: "あなたがしたことは良[よ]くない。主[しゅ]は生[い]きておられる。あなたがたは死[し]に定[さだ]められた者[もの]たちだ。あなたがたの主人[しゅじん]である王[おう]、主の油[あぶら]を注[そそ]がれた者を守[まも]らなかったのだから。そして今[いま]、見[み]なさい。王の槍[やり]と水[みず]の器[うつわ]はどこにあるか。頭[あたま]のそばにあったものだ。」"
  17: "サウルはダビデの声[こえ]を聞[き]き分[わ]けて言[い]った。「ダビデ、わが子[こ]よ、これはあなたの声か。」ダビデは言った。「わが主人[しゅじん]よ、王[おう]よ。あなたのしもべだ。」"
  18: "ダビデは言[い]った。「なぜ、わが主人[しゅじん]はそのしもべを追[お]うのか。わたしが何[なに]をし、わたしにどんな不正[ふせい]が見[み]つかったというのか。"
  19: "そして今[いま]、わが主人[しゅじん]、王[おう]よ、どうか、しもべの言葉[ことば]を聞[き]いてください。もし主[しゅ]があなたをわたしに向[む]けて動[うご]かしているのなら、どうか、主があなたの犠牲[ぎせい]の香[かおり]をかがれるように。しかし、もし人[ひと]の子[こ]らがそうしているのなら、彼[かれ]らは主の前[まえ]で呪[のろ]われた者[もの]たちだ。彼らは今日[きょう]、わたしを追[お]い出[だ]して、主の嗣業[しぎょう]の中[なか]に立[た]つことができないようにして、『行[い]って、ほかの神[かみ]々[がみ]に仕[つか]えよ』と言[い]っているのだから。"
  20: "そして今[いま]、どうか、わたしの血[ち]が主[しゅ]の前[まえ]で地[ち]に落[お]ちないように。イスラエルの王[おう]はわたしの魂[たましい]を求[もと]めて出[で]て来[き]たのだから。夜[よる]の鳥[とり]が山[やま]を追[お]いかけるように。」"
  21: "サウルは言[い]った。「わたしは罪[つみ]を犯[おか]した。ダビデ、わが子[こ]よ、戻[もど]って来[き]なさい。今日[きょう]、わたしの魂[たましい]があなたの目[め]に尊[とうと]かったのだから、わたしはもうあなたに害[がい]を加[くわ]えない。わたしは愚[おろ]かなことをし、大[おお]きく誤[あやま]った。」"
  22: "ダビデは答[こた]えて言[い]った。「見[み]よ、王[おう]の槍[やり]だ。若者[わかもの]の一人[ひとり]に渡[わた]って来[こ]させ、それを取[と]らせなさい。"
  23: "主[しゅ]はそれぞれの人[ひと]に、その正[ただ]しさとその誠実[せいじつ]を返[かえ]される。主は今日[きょう]、あなたをわたしの手[て]に渡[わた]されたのに、わたしは主の油[あぶら]を注[そそ]がれた者[もの]に手をかけることを望[のぞ]まなかった。"
  24: "そして見[み]よ、今日[きょう]、あなたの魂[たましい]がわたしの目[め]に尊[とうと]かったように、わたしの魂も主[しゅ]の前[まえ]で尊くなり、主がわたしを覆[おお]い、すべての苦[くる]しみから救[すく]い出[だ]してくださるように。」"
  25: "サウルはダビデに言[い]った。「子[こ]よ、あなたは祝福[しゅくふく]されている。あなたは必[かなら]ず成[な]し遂[と]げ、必ず勝[かち]を得[え]る。」ダビデは自分[じぶん]の道[みち]を行[い]き、サウルは自分の場所[ばしょ]へ帰[かえ]った。"
notes:
  1: "ἐκ τῆς αὐχμώδους — «из безводной, сухой [земли]» (αὐχμώδης; слав. «от знойныя»). εἰς τὸν βουνόν — «на холм» (βουνός). σκεπάζεται μεθ᾽ ἡμῶν — «скрывается у нас» (σκεπάζω). Ιεσσαιμουν — Иессимун, пустынное плато (слав. «иессемон»). κατὰ πρόσωπον — «напротив»."
  2: "τρεῖς χιλιάδες ἀνδρῶν ἐκλεκτοὶ ἐξ Ισραηλ — три тысячи отборных мужей из Израиля. κατέβη εἰς τὴν ἔρημον Ζιφ — сошёл в пустыню Зиф (ジフ)."
  3: "παρενέβαλεν ἐν τῷ βουνῷ — расположился станом на холме (παρεμβάλλω). ἐπὶ προσώπου τοῦ Ιεσσαιμουν ἐπὶ τῆς ὁδοῦ — «напротив Иессимуна, при дороге». ἐκάθισεν ἐν τῇ ἐρήμῳ — «жил в пустыне» (κάθημαι). ἥκει ὀπίσω αὐτοῦ — «пришёл за ним» (ἥκω)."
  4: "κατασκόπους — соглядатаев, разведчиков (κατάσκοπος); в корпусе 斥候. ἥκει Σαουλ ἕτοιμος ἐκ Κειλα — «пришёл Саул готовый из Кеиля»: ἕτοιμος («готовый») здесь неясно, в ru «действительно пришёл» (по МТ)."
  5: "λάθρᾳ — тайно (слав. «отай»). ἀρχιστράτηγος — военачальник (в корпусе 将軍, ср. гл. 29). ἐν λαμπήνῃ — «в крытой повозке, паланкине» (λαμπήνη; слав. «в колеснице царстей», в ru «в шатре»); в тексте 覆いのある車, буквально по гр. παρεμβεβληκὼς κύκλῳ — расположившийся станом вокруг (παρεμβάλλω, перфект)."
  6: "Αχιμελεχ τὸν Χετταῖον — Ахимелех Хеттеянин (ヘテ人). Αβεσσα υἱὸς Σαρουιας ἀδελφὸν Ιωαβ — Авесса, сын Саруи, брат Иоава. παρεμβολή — стан, 陣 (как в гл. 28–29)."
  7: "ὕπνῳ — «сном» (творительный, усиливает: спит глубоким сном). ἐμπεπηγὸς εἰς τὴν γῆν — «воткнутое в землю» (ἐμπήγνυμι). πρὸς κεφαλῆς αὐτοῦ — «у головы его». δόρυ — 槍."
  8: "Ἀπέκλεισεν κύριος — «заключил Господь» (ἀποκλείω; в ru «предал Бог» — по МТ). ἅπαξ — «один раз». οὐ δευτερώσω αὐτῷ — «не повторю ему» (δευτερόω)."
  9: "μὴ ταπεινώσῃς αὐτόν — «не унизь его» (ταπεινόω): эвфемизм вместо «не убивай», так и в слав.; в тексте 殺してはならない, как требует смысл. τίς ἐποίσει χεῖρα — «кто наложит руку» (ἐπιφέρω). ἀθῳωθήσεται — «останется ненаказанным» (ἀθῳόω)."
  10: "Ζῇ κύριος — «жив Господь» (клятва). ἐὰν μὴ κύριος παίσῃ αὐτόν — «если не Господь поразит его» (условие клятвы). ἡ ἡμέρα αὐτοῦ ἔλθῃ — «день его придёт». εἰς πόλεμον καταβῇ καὶ προστεθῇ — «сойдёт на войну и приложится», т. е. будет причтён к павшим (προστίθημι)."
  11: "μηδαμῶς μοι παρὰ κυρίου — «да не будет мне от Господа» (слав. «да не будет ми от Господа»). φακός — «фляга, мех для воды» (слав. «сосуд водный»). καθ᾽ ἑαυτούς — «к себе», отдельно."
  12: "θάμβος κυρίου — «изумление, оцепенение от Господа» (θάμβος; слав. «сон крепок от Господа» — иное понимание); в тексте 主からの恐れ. οὐκ ἦν ὁ βλέπων καὶ οὐκ ἦν ὁ γινώσκων — «не было видящего и не было знающего». ἐξεγειρόμενος — пробуждающийся (ἐξεγείρω)."
  13: "διέβη εἰς τὸ πέραν — перешёл на ту сторону (διαβαίνω). ἔστη ἐπὶ τὴν κορυφὴν τοῦ ὄρους μακρόθεν — стал на вершине горы издалека. πολλὴ ἡ ὁδὸς ἀνὰ μέσον αὐτῶν — «много пути между ними»."
  14: "προσεκαλέσατο τὸν λαόν — позвал народ (προσκαλέομαι). Οὐκ ἀποκριθήσει, Αβεννηρ — «не ответишь ли, Авенир?». Τίς εἶ σὺ ὁ καλῶν με — «кто ты, зовущий меня?»; в ru добавлено «что кричишь и беспокоишь царя» — по МТ."
  15: "Οὐκ ἀνὴρ σύ — «не муж ли ты?». τίς ὡς σὺ ἐν Ισραηλ — «кто как ты в Израиле». φυλάσσεις — стережёшь (φυλάσσω). διαφθεῖραι — погубить (διαφθείρω)."
  16: "υἱοὶ θανατώσεως ὑμεῖς — «сыны смерти вы», т. е. достойные смерти. τὸ ῥῆμα — «слово, дело». τὰ πρὸς κεφαλῆς αὐτοῦ — «то, что у головы его»."
  17: "ἐπέγνω — узнал (ἐπιγινώσκω). Ἦ φωνή σου αὕτη — «твой ли этот голос?». Δοῦλός σου, κύριε βασιλεῦ — «раб твой, господин, царь»; в ru «мой голос, господин мой, царь» — передача иная."
  18: "Ἵνα τί τοῦτο καταδιώκει — «зачем это преследует» (καταδιώκω). τί ἡμάρτηκα — «что я согрешил». ἀδίκημα — неправда, злодеяние."
  19: "εἰ ὁ θεὸς ἐπισείαι σε ἐπ᾽ ἐμέ — «если Бог возбуждает тебя против меня» (ἐπισείω). ὀσφρανθείη θυσίας σου — «да обоняет жертву твою», т. е. да примет её (ὀσφραίνομαι; слав. «да будет благовонна жертва твоя»). ἐπικατάρατοι — прокляты. ἐξέβαλόν με μὴ ἐστηρίσθαι ἐν κληρονομίᾳ κυρίου — «изгнали меня, чтобы я не утвердился в наследии Господнем» (στηρίζω; κληρονομία — 嗣業). Πορεύου δούλευε θεοῖς ἑτέροις — «иди, служи иным богам» (вложенная речь 『…』)."
  20: "μὴ πέσοι τὸ αἷμά μου ἐπὶ τὴν γῆν — «да не упадёт кровь моя на землю». ἐξελήλυθεν — вышел (перфект ἐξέρχομαι). νυκτικόραξ — «ночной ворон», филин (слав. «нощный вран»); в ru «куропатка» — иное чтение МТ; ru также добавляет «одну блоху», в gr этого нет."
  21: "Ἡμάρτηκα — согрешил (перфект ἁμαρτάνω). ἀνθ᾽ ὧν ἔντιμος ψυχή μου ἐν ὀφθαλμοῖς σου — «за то, что дорога была душа моя в глазах твоих» (ἔντιμος). μεματαίωμαι — «впал в тщету, обезумел» (ματαιόω; слав. «безумно сотворих»). ἠγνόηκα πολλὰ σφόδρα — «много весьма не знал» (ἀγνοέω)."
  22: "διελθέτω εἷς τῶν παιδαρίων — «пусть перейдёт один из отроков». λαβέτω αὐτό — пусть возьмёт его."
  23: "τὰς δικαιοσύνας αὐτοῦ καὶ τὴν πίστιν αὐτοῦ — «правды его и веру его» (слав. «по правде его и по вере его»). ἐπιστρέψει — воздаст, возвратит (ἐπιστρέφω). ἠθέλησα — захотел."
  24: "ἐμεγαλύνθη ἡ ψυχή σου — «возвеличилась душа твоя», т. е. стала драгоценной (μεγαλύνω). σκεπάσαι με — «покрыл меня» (σκεπάζω). ἐξελεῖταί με — «избавит меня» (ἐξαιρέω). θλῖψις — скорбь, теснота."
  25: "Εὐλογημένος σύ — «благословен ты». ποιῶν ποιήσεις καὶ δυνάμενος δυνήσει — усилительные конструкции «делая сделаешь и могущий сможешь» (слав. «творяй сотвориши и могий возможеши»). ἀνέστρεψεν εἰς τὸν τόπον αὐτοῦ — возвратился в место своё."
