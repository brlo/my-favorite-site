# jp-box, Числа, глава 25. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в этой главе нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 25: блуд Израиля с дочерями Моава и Ваал-Фегор (1–5), ревность Финееса
# и прекращение поражения (6–9), завет мира и вечное священство (10–13),
# имена убитых (14–15), повеление враждовать с Мидианитянами (16–18).
# Красного и синего нет: говорит Бог, но это не прямая речь Христа во плоти.
# Кавычки: речь Бога — 「…」; речь Моисея — 「…」.
# 〔…〕 нет: все слова есть в gr-lxx-byz (сверено bracket_check.rb).
# Отличия LXX: 25:4 παραδειγμάτισον — «выставить на позор, сделать примером»,
# а не «повесить» (масоретский текст и Синодальный); 25:5 ταῖς φυλαῖς — «племенам»,
# в ru «судьям»; 25:8 κάμινος — «печь», здесь «внутренняя комната» (слав. «блудилище»);
# 25:14 Σαλω — «Салу» (в csl «салмонь»); 25:15 Ομμωθ — «Оммоф» (в csl «соммофов»).
# Сносок ⟨…⟩ нет: 宿営, 淫行, 偶像, 契約, 贖い понятны по контексту, а 幕屋, 祭司,
# 会衆 уже пояснены в корпусе. jp-ni не использовался.

tr_code: jp-box
book: chis
chapter: 25
draft: true

verses:
  1: "イスラエルはサティンに宿営[しゅくえい]した。そして民[たみ]はモアブの娘[むすめ]たちと淫[いん]行[こう]して汚[けが]れた。"
  2: "彼[かれ]らは民[たみ]を自分[じぶん]たちの偶像[ぐうぞう]の犠牲[ぎせい]に招[まね]いた。民はその犠牲の肉[にく]を食[た]べ、偶像にひれ伏[ふ]した。"
  3: "イスラエルはバアル・ペオルに身[み]を委[ゆだ]ねた。主[しゅ]はイスラエルに激[はげ]しく怒[いか]った。"
  4: "「民[たみ]のすべての指導者[しどうしゃ]たちを連[つ]れて来[き]て、太陽[たいよう]の前[まえ]で、主[しゅ]のために彼[かれ]らをさらし者[もの]にしなさい。そうすれば、主の激[はげ]しい怒[いか]りはイスラエルから去[さ]るであろう。」"
  5: "モーセはイスラエルの部族[ぶぞく]たちに言[い]った。「それぞれ、バアル・ペオルに結[むす]びついた自分[じぶん]の身内[みうち]の者[もの]を殺[ころ]しなさい。」"
  6: "見[み]よ、イスラエルの子[こ]らの一人[ひとり]が、自分[じぶん]の兄弟[きょうだい]をミディアン人[じん]の女[おんな]のところへ連[つ]れて来[き]た。それはモーセの前[まえ]、イスラエルの子らの会衆[かいしゅう]すべての前であった。彼[かれ]らは証[あかし]の幕屋[まくや]の戸口[とぐち]で泣[な]いていた。"
  7: "祭司[さいし]アロンの子[こ]、エレアザルの子ピネハスは、これを見[み]て会衆の中[なか]から立[た]ち上[あ]がり、手[て]に槍[やり]を取[と]った。"
  8: "彼[かれ]はそのイスラエル人[じん]の男[おとこ]の後[あと]を追[お]って奥[おく]の間[ま]に入[はい]り、二人[ふたり]とも、そのイスラエル人の男とその女[おんな]を、女の胎[たい]を刺[さ]し貫[つらぬ]いて殺[ころ]した。こうして災[わざわ]いはイスラエルの子[こ]らから止[や]んだ。"
  9: "災[わざわ]いで死[し]んだ者[もの]は二万四千人[にん]であった。"
  10: "主[しゅ]はモーセに語[かた]って言[い]われた。"
  11: "「祭司[さいし]アロンの子[こ]、エレアザルの子ピネハスは、わたしが彼[かれ]らの中[なか]で熱心[ねっしん]に燃[も]えたことにより、イスラエルの子[こ]らからわたしの怒[いか]りを鎮[しず]めた。それでわたしは、わたしの熱心によってイスラエルの子らを滅[ほろ]ぼし尽[つ]くさなかった。"
  12: "それゆえ、彼[かれ]に言[い]いなさい。見[み]よ、わたしは彼に平和[へいわ]の契約[けいやく]を与[あた]える。"
  13: "そして、これは彼[かれ]と、彼の後[あと]の子孫[しそん]にとって、永遠[えいえん]の祭司職[さいしょく]の契約[けいやく]となるであろう。彼が自分[じぶん]の神[かみ]のために熱心[ねっしん]に燃[も]え、イスラエルの子[こ]らのために贖[あがな]いを成[な]したからである。」"
  14: "ミディアン人[じん]の女[おんな]とともに殺[ころ]されたイスラエル人[じん]の男[おとこ]の名[な]は、ザムブリといった。彼[かれ]はサロの子[こ]で、シメオンの氏族[しぞく]の家[いえ]の長[かしら]であった。"
  15: "ミディアン人[じん]の女[おんな]で殺[ころ]された者[もの]の名[な]は、コスビといい、オンモトの民[たみ]の長[かしら]であるツルの娘[むすめ]であった。彼女[かのじょ]はミディアンの氏族[しぞく]の家[いえ]に属[ぞく]していた。"
  16: "主[しゅ]はモーセに語[かた]って言[い]われた。「イスラエルの子[こ]らに語[かた]って言[い]いなさい。"
  17: "ミディアン人[じん]と敵対[てきたい]し、彼[かれ]らを打[う]ちなさい。"
  18: "彼[かれ]らは狡猾[こうかつ]さをもってあなたがたと敵対[てきたい]し、ペオルと、彼らの姉妹[しまい]であるミディアンの長[かしら]の娘[むすめ]コスビによって、あなたがたを欺[あざむ]いたからである。コスビはペオルのゆえの災[わざわ]いの日[ひ]に殺[ころ]された者[もの]である。」"

notes:
  1: "κατέλυσεν — расположился станом (καταλύω, «останавливаться»); Σαττιν — サティン (Шиттим). ἐβεβηλώθη — осквернился (βεβηλόω, «делать нечистым»). ἐκπορνεῦσαι εἰς τὰς θυγατέρας Μωαβ — «блудодействовать с дочерями Моава» (ἐκπορνεύω; слав. «осквернишася блужением»)."
  2: "ἐκάλεσαν αὐτοὺς ἐπὶ ταῖς θυσίαις — «позвали их на жертвы» (καλέω + ἐπί). εἰδώλων — 偶像 (εἴδωλον). ἔφαγεν ὁ λαὸς τῶν θυσιῶν αὐτῶν — «ел народ жертвы их» (партитивный генитив). προσεκύνησαν — поклонились (προσκυνέω)."
  3: "ἐτελέσθη Ισραηλ τῷ Βεελφεγωρ — «Израиль приобщился Ваал-Фегору» (τελέω в значении «посвящать, приобщать»; слав. «причастися»; ru «прилепился»). ὠργίσθη θυμῷ — воспылал гневом (ὀργίζομαι + θυμός, внутренний винительный)."
  4: "Λαβὲ πάντας τοὺς ἀρχηγοὺς τοῦ λαοῦ — возьми всех начальников народа. παραδειγμάτισον αὐτοὺς κυρίῳ — «выставь их на позор Господу», т. е. сделай примером (παραδειγματίζω); масоретский текст и ru читают «повесь», но LXX этого слова не имеет. ἀπέναντι τοῦ ἡλίου — «перед солнцем», открыто. ἀποστραφήσεται ὀργὴ θυμοῦ — «отвратится ярость гнева»."
  5: "ταῖς φυλαῖς Ισραηλ — «племенам Израиля» (φυλή); в ru «судьям» — иное чтение. Ἀποκτείνατε ἕκαστος τὸν οἰκεῖον αὐτοῦ — «убейте каждый своего близкого» (οἰκεῖος, «домашний, родственник»; слав. «ужика»). τὸν τετελεσμένον τῷ Βεελφεγωρ — приобщившегося Ваал-Фегору (perfect от τελέω)."
  6: "προσήγαγεν τὸν ἀδελφὸν αὐτοῦ πρὸς τὴν Μαδιανῖτιν — «привёл своего брата к мадианитянке» (так в LXX и csl; ru «к братьям своим» — иное чтение). ἐναντίον Μωυσῆ καὶ ἔναντι πάσης συναγωγῆς — пред Моисеем и всем обществом. αὐτοὶ δὲ ἔκλαιον — «а они плакали» (imperfect). παρὰ τὴν θύραν — у двери."
  7: "ἐξανέστη ἐκ μέσου τῆς συναγωγῆς — встал из среды общества. σειρομάστης — копьё, дротик (слав. «сулица»); слово редкое, отсюда 槍."
  8: "εἰσῆλθεν ὀπίσω τοῦ ἀνθρώπου … εἰς τὴν κάμινον — «вошёл вслед за человеком в печь»; κάμινος букв. «печь», но здесь, как и в слав. «блудилище», — внутренняя комната, спальня. ἀπεκέντησεν ἀμφοτέρους — пронзил обоих (ἀποκεντέω). διὰ τῆς μήτρας αὐτῆς — «через чрево её» (μήτρα, 胎). ἐπαύσατο ἡ πληγή — прекратилось поражение (παύω)."
  9: "τέσσαρες καὶ εἴκοσι χιλιάδες — двадцать четыре тысячи (порядок греч. «четыре и двадцать»)."
  10: "Стандартная формула: ἐλάλησεν κύριος πρὸς Μωυσῆν λέγων; λέγων отдельно по-японски не передаётся, речь — с 11-го стиха."
  11: "κατέπαυσεν τὸν θυμόν μου ἀπὸ υἱῶν Ισραηλ — «успокоил гнев Мой от сынов Израиля» (καταπαύω). ἐν τῷ ζηλῶσαί μου τὸν ζῆλον ἐν αὐτοῖς — «тем, что Я возревновал ревностью Моею в них» (ζηλόω, ζῆλος). οὐκ ἐξανήλωσα — не истребил до конца (ἐξαναλίσκω)."
  12: "οὕτως εἰπόν — «итак скажи» (εἶπον как imperativus aoristi). διαθήκην εἰρήνης — завет мира (слав. «завет мирен»)."
  13: "διαθήκη ἱερατείας αἰωνία — завет священства вечного (ἱερατεία, 祭司職). ἀνθ᾿ ὧν — «за то, что» (ἀντί + род.). ἐζήλωσεν τῷ θεῷ αὐτοῦ — возревновал по Боге своём. ἐξιλάσατο περὶ τῶν υἱῶν Ισραηλ — совершил умилостивление за сынов Израиля (ἐξιλάσκομαι; в Левите передано 贖いを成す)."
  14: "τοῦ πεπληγότος … ὃς ἐπλήγη — «убитого … который убит» (πλήσσω). Ζαμβρι υἱὸς Σαλω — ザムブリ, сын Салу (в csl «замврий сын салмонь» — иная форма отчества). ἄρχων οἴκου πατριᾶς τῶν Συμεων — начальник дома племени Симеонова (οἶκος πατριᾶς, 氏族の家)."
  15: "Χασβι θυγάτηρ Σουρ — コスビ, дочь Цура (в ru «Хазва», «Цур»). ἄρχοντος ἔθνους Ομμωθ — начальника племени Оммоф (ἔθνος; в csl «соммофов»). οἴκου πατριᾶς ἐστιν τῶν Μαδιαν — «из дома племени Мадиамского она»."
  16: "Формула с двойным λέγων: «сказал Господь Моисею, говоря: скажи сынам Израилевым, говоря»; второе λέγων вводит содержание 17-го стиха, поэтому кавычка открывается здесь и закрывается в 18-м."
  17: "Ἐχθραίνετε — «враждовать» (ἐχθραίνω, imperativus praesentis); πατάξατε — поразите (πατάσσω). В ru «враждуйте с Мадианитянами» — тот же смысл."
  18: "ἐν δολιότητι — в коварстве (δολιότης). ὅσα δολιοῦσιν ὑμᾶς — «скольким обманам подвергают вас» (δολιόω). διὰ Φογωρ — «через Фегора» (здесь краткое имя бога, ср. ст. 3). ἀδελφὴν αὐτῶν — «сестру их», т. е. мадианитянку, свою единоплеменницу. ἐν τῇ ἡμέρᾳ τῆς πληγῆς — в день поражения."
