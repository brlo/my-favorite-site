verses:
  1: "預言者[よげんしゃ]の弟子[でし]たちの妻[つま]の一人[ひとり]が、エリシャに叫[さけ]んで言[い]った。「あなたのしもべであるわたしの夫[おっと]は死[し]んだ。あなたも知[し]っているとおり、あのしもべは主[しゅ]を恐[おそ]れていた。ところが、貸[か]し主[ぬし]が来[き]て、わたしの二人[ふたり]の息子[むすこ]を自分[じぶん]の奴隷[どれい]として連[つ]れて行[い]こうとしている。」"
  2: "エリシャは彼女[かのじょ]に言[い]った。「わたしがあなたのために何[なに]をしようか。あなたの家[いえ]に何[なに]があるか、わたしに告[つ]げなさい。」彼女[かのじょ]は言[い]った。「はしための家[いえ]には何[なに]もない。ただ、体[からだ]に塗[ぬ]るための少[すこ]しの油[あぶら]があるだけだ。」"
  3: "彼[かれ]は言[い]った。「外[そと]へ出[で]て、近所[きんじょ]の人[ひと]々[びと]すべてから器[うつわ]を借[か]りて来[き]なさい。空[から]の器[うつわ]を。数[かず]を少[すく]なくしてはならない。"
  4: "そして家[いえ]に入[はい]り、自分[じぶん]と息子[むすこ]たちの後[うし]ろで戸[と]を閉[し]め、その器[うつわ]すべてに油[あぶら]を注[そそ]ぎなさい。満[み]たした器[うつわ]は片付[かたづ]けておきなさい。」"
  5: "彼女[かのじょ]は彼[かれ]のもとを去[さ]って、そのとおりに行[おこな]った。自分[じぶん]と息子[むすこ]たちの後[うし]ろで戸[と]を閉[し]めた。息子[むすこ]たちは彼女[かのじょ]のところへ器[うつわ]を持[も]って来[き]、彼女[かのじょ]はそれに注[そそ]いだ。"
  6: "器[うつわ]がみな満[み]ちるまで、それは続[つづ]いた。彼女[かのじょ]は息子[むすこ]たちに言[い]った。「もう一[ひと]つ器[うつわ]をこちらへ持[も]って来[き]なさい。」彼らは言[い]った。「もう器[うつわ]はない。」すると油[あぶら]は止[と]まった。"
  7: "彼女[かのじょ]は行[い]って、神[かみ]の人[ひと]にそのことを告[つ]げた。エリシャは言[い]った。「行[い]って油[あぶら]を売[う]り、借金[しゃっきん]を利子[りし]ごと返[かえ]しなさい。あとは残[のこ]った油[あぶら]で、あなたも息子[むすこ]たちも暮[く]らしていける。」"
  8: "ある日[ひ]、エリシャはスナムへ行[い]った。そこに身分[みぶん]のある女[おんな]がいて、彼[かれ]にしきりに勧[すす]めてパンを食[た]べさせた。それからというもの、彼[かれ]はそこを通[とお]るたびに、寄[よ]ってパンを食[た]べるようになった。"
  9: "女[おんな]は夫[おっと]に言[い]った。「ごらんなさい。いつもわたしたちのところへ通[かよ]って来[く]るあの方[かた]は、聖[せい]なる神[かみ]の人[ひと]だということが分[わ]かった。"
  10: "あの方[かた]のために、屋上[おくじょう]に小[ちい]さな部屋[へや]を一[ひと]つ造[つく]ろう。そこに寝台[しんだい]と机[つくえ]と椅子[いす]と灯[あか]りを置[お]こう。そうすれば、わたしたちのところへ来[こ]られたとき、そこに寄[よ]られるだろう。」"
  11: "ある日[ひ]、彼[かれ]はそこへ来[き]て、屋上[おくじょう]の部屋[へや]に寄[よ]り、そこで眠[ねむ]った。"
  12: "彼[かれ]は従者[じゅうしゃ]ギエジに言[い]った。「あのスナムの女[おんな]を呼[よ]んで来[き]なさい。」ギエジが彼女[かのじょ]を呼[よ]ぶと、彼女[かのじょ]は彼[かれ]の前[まえ]に立[た]った。"
  13: "彼[かれ]はギエジに言[い]った。「彼女[かのじょ]にこう言[い]いなさい。あなたはわたしたちのために、これほど気[き]を遣[つか]ってくれている。あなたのために何[なに]をしてやれるだろうか。王[おう]か軍[ぐん]の長[ちょう]に、あなたのことで話[はな]すべきことがあるだろうか。」彼女[かのじょ]は言[い]った。「わたしは自分[じぶん]の民[たみ]の中[なか]で暮[く]らしている。」"
  14: "彼[かれ]は言[い]った。「では、彼女[かのじょ]のために何[なに]をしてやろうか。」従者[じゅうしゃ]ギエジは言[い]った。「なるほど、彼女[かのじょ]には息子[むすこ]がなく、夫[おっと]も年[とし]を取[と]っている。」"
  15: "彼[かれ]は言[い]った。「彼女[かのじょ]を呼[よ]びなさい。」彼女[かのじょ]を呼[よ]ぶと、彼女[かのじょ]は戸口[とぐち]に立[た]った。"
  16: "エリシャは彼女[かのじょ]に言[い]った。「来年[らいねん]の今[いま]ごろ、あなたは男[おとこ]の子[こ]を抱[だ]いているだろう。」彼女[かのじょ]は言[い]った。「いいえ、ご主人[しゅじん]さま。神[かみ]の人[ひと]よ、はしためを欺[あざむ]かないでほしい。」"
  17: "女[おんな]は身[み]ごもり、エリシャが彼女[かのじょ]に語[かた]ったとおり、翌年[よくねん]の今[いま]ごろに男[おとこ]の子[こ]を産[う]んだ。"
  18: "子[こ]どもは育[そだ]った。ある日[ひ]、子[こ]どもが父[ちち]のもと、刈[か]り入[い]れをする者[もの]たちのところへ出[で]て行[い]くと、"
  19: "彼[かれ]は父[ちち]に言[い]った。「頭[あたま]が、頭[あたま]が。」父[ちち]は従者[じゅうしゃ]に言[い]った。「この子[こ]を母[はは]のところへ連[つ]れて行[い]け。」"
  20: "従者[じゅうしゃ]は彼[かれ]を母[はは]のところへ連[つ]れて行[い]った。子[こ]は母[はは]の膝[ひざ]の上[うえ]に伏[ふ]したまま昼[ひる]まで過[す]ごし、やがて死[し]んだ。"
  21: "彼女[かのじょ]は子[こ]を抱[だ]き上[あ]げ、神[かみ]の人[ひと]の寝台[しんだい]に寝[ね]かせ、その上[うえ]に戸[と]を閉[し]めて出[で]て行[い]った。"
  22: "そして夫[おっと]を呼[よ]んで言[い]った。「若[わか]い者[もの]を一人[ひとり]と、ろばを一頭[いっとう]、わたしに寄[よ]こしてほしい。神[かみ]の人[ひと]のところへ走[はし]って行[い]き、すぐに戻[もど]って来[く]る。」"
  23: "夫[おっと]は言[い]った。「どうして今日[きょう]、あの方[かた]のところへ行[い]くのか。今日[きょう]は新月[しんげつ]でも安息日[あんそくび]でもないのに。」彼女[かのじょ]は言[い]った。「大丈夫[だいじょうぶ]だ。」"
  24: "彼女[かのじょ]はろばに鞍[くら]を置[お]き、従者[じゅうしゃ]に言[い]った。「先[さき]に進[すす]んで行[い]け。わたしが乗[の]るのを妨[さまた]げるな。わたしが言[い]うとおりに、"
  25: "さあ、進[すす]め。神[かみ]の人[ひと]のところへ、カルメル山[やま]へ行[い]くのだ。」こうして彼女[かのじょ]が来[く]るのをエリシャが見[み]ると、彼[かれ]は従者[じゅうしゃ]ギエジに言[い]った。「見[み]よ、あのスナムの女[おんな]だ。"
  26: "今[いま]、走[はし]って彼女[かのじょ]を迎[むか]え、こう言[い]いなさい。『あなたは無事[ぶじ]か。夫[おっと]は無事か。子[こ]どもは無事か。』」ギエジは走[はし]って彼女[かのじょ]を迎[むか]え、そのとおりに言[い]った。彼女[かのじょ]は答[こた]えて言[い]った。「無事[ぶじ]だ。」"
  27: "彼女[かのじょ]は山[やま]の上[うえ]のエリシャのところへ来[き]て、その足[あし]にすがった。ギエジが彼女[かのじょ]を押[お]しのけようと近[ちか]づくと、エリシャは言[い]った。「そのままにしておきなさい。彼女[かのじょ]の魂[たましい]は苦[くる]しみに沈[しず]んでいる。主[しゅ]はそのことをわたしから隠[かく]し、お告[つ]げにならなかった。」"
  28: "彼女[かのじょ]は言[い]った。「わたしがご主人[しゅじん]さまに息子[むすこ]を求[もと]めたか。『わたしを欺[あざむ]かないでほしい』と言[い]ったではないか。」"
  29: "エリシャはギエジに言[い]った。「腰[こし]に帯[おび]をし、わたしの杖[つえ]を手[て]に取[と]って行[い]け。人[ひと]に会[あ]っても、その人[ひと]に挨拶[あいさつ]してはならない。人[ひと]があなたに挨拶[あいさつ]しても、答[こた]えてはならない。そして、わたしの杖[つえ]をあの子[こ]の顔[かお]の上[うえ]に置[お]きなさい。」"
  30: "子[こ]どもの母[はは]は言[い]った。「主[しゅ]は生[い]きておられる。あなたの魂[たましい]も生[い]きておられるように、わたしはあなたを離[はな]れない。」エリシャは立[た]ち上[あ]がり、彼女[かのじょ]の後[あと]について行[い]った。"
  31: "ギエジは彼女[かのじょ]より先[さき]に進[すす]み、杖[つえ]を子[こ]の顔[かお]の上[うえ]に置[お]いた。しかし、声[こえ]もなければ、聞[き]こえるものもなかった。ギエジは引[ひ]き返[かえ]してエリシャに会[あ]い、告[つ]げて言[い]った。「子[こ]は目[め]を覚[さ]まさない。」"
  32: "エリシャは家[いえ]に入[はい]った。見[み]ると、子[こ]は死[し]んで、彼[かれ]の寝台[しんだい]に横[よこ]たわっていた。"
  33: "エリシャは家[いえ]に入[はい]り、二人[ふたり]きりで戸[と]を閉[し]めて、主[しゅ]に祈[いの]った。"
  34: "彼[かれ]は上[あ]がって子[こ]の上[うえ]に伏[ふ]し、その口[くち]を子[こ]の口[くち]に、その目[め]を子[こ]の目[め]に、その手[て]を子[こ]の手[て]に重[かさ]ね、その上[うえ]に身[み]をかがめた。彼[かれ]は子[こ]に息[いき]を吹[ふ]きかけた。すると、子[こ]の体[からだ]は温[あたた]かくなった。"
  35: "彼[かれ]は向[む]きを変[か]えて家[いえ]の中[なか]を行[い]ったり来[き]たりし、また上[あ]がっては子[こ]の上[うえ]に身[み]をかがめた。それを七度[しちど]まで繰[く]り返[かえ]すと、子[こ]は目[め]を開[ひら]いた。"
  36: "エリシャはギエジを呼[よ]んで言[い]った。「あのスナムの女[おんな]を呼[よ]べ。」ギエジが呼[よ]ぶと、彼女[かのじょ]は彼[かれ]のところへ入[はい]って来[き]た。エリシャは言[い]った。「あなたの息子[むすこ]を抱[だ]きなさい。」"
  37: "女[おんな]は入[はい]って来[き]て、彼[かれ]の足[あし]もとに倒[たお]れ、地[ち]にひれ伏[ふ]した。そして息子[むすこ]を抱[だ]き上[あ]げて出[で]て行[い]った。"
  38: "エリシャはガルガラへ戻[もど]った。そのころ、地[ち]には飢[う]えがあり、預言者[よげんしゃ]の弟子[でし]たちが彼[かれ]の前[まえ]に座[すわ]っていた。エリシャは従者[じゅうしゃ]に言[い]った。「大[おお]きな鍋[なべ]を据[す]えて、預言者[よげんしゃ]の弟子[でし]たちのために煮物[にもの]を炊[た]きなさい。」"
  39: "一人[ひとり]が野[の]へ草[くさ]を摘[つ]みに出[で]て、野[の]でぶどうの木[き]を見[み]つけ、そこから野生[やせい]の実[み]を衣服[いふく]いっぱいに摘[つ]み取[と]って、煮物[にもの]の鍋[なべ]に放[ほう]り込[こ]んだ。彼[かれ]はそれが何[なに]か知[し]らなかった。"
  40: "それが人[ひと]々[びと]に注[そそ]がれ、彼[かれ]らが煮物[にもの]を食[た]べ始[はじ]めると、彼らは叫[さけ]んで言[い]った。「神[かみ]の人[ひと]よ、鍋[なべ]の中[なか]に死[し]がある。」そして、食[た]べることができなかった。"
  41: "彼[かれ]は言[い]った。「小麦粉[こむぎこ]を持[も]って来[き]て、鍋[なべ]に入[い]れなさい。」エリシャは従者[じゅうしゃ]ギエジに言[い]った。「人[ひと]々[びと]に注[そそ]いで、食[た]べさせなさい。」すると、鍋[なべ]の中[なか]に悪[わる]いものはもう何[なに]もなくなった。"
  42: "一人[ひとり]の男[おとこ]がベト・サリサから来[き]て、初穂[はつほ]の大麦[おおむぎ]のパン二十個[にじゅうこ]と、干[ほ]しいちじくの塊[かたまり]を神[かみ]の人[ひと]に持[も]って来[き]て言[い]った。「人[ひと]々[びと]に与[あた]えて、食[た]べさせなさい。」"
  43: "彼[かれ]の従者[じゅうしゃ]は言[い]った。「これで百人[ひゃくにん]の前[まえ]にどうして出[だ]せようか。」エリシャは言[い]った。「人[ひと]々[びと]に与[あた]えて、食[た]べさせなさい。主[しゅ]はこう言[い]われる。『彼らは食[た]べても、なお余[あま]る。』」"
  44: "人[ひと]々[びと]は食[た]べ、主[しゅ]の言葉[ことば]のとおりに、なお余[あま]りを残[のこ]した。"

notes:
  1: "γυνὴ μία ἀπὸ τῶν υἱῶν τῶν προφητῶν — одна из жён «сынов пророческих», т. е. учеников пророков (預言者の弟子たち). ἐβόα — имперфект «кричала, взывала». ὁ δανιστής — заимодавец, кредитор (слав. «заимодавец»). λαβεῖν ... ἑαυτῷ εἰς δούλους — «взять себе в рабы»: по закону должник мог быть продан в рабство (Исх 21:2–7; Лев 25:39). Слав. дважды называет мужа «раб твой»; в гр ὁ δοῦλός σου ὁ ἀνήρ μου и δοῦλος ἦν — повтор сохранён."
  2: "Τί ποιήσω σοι — «что мне сделать тебе» (слав. «что сотворю ти»). ἀνάγγειλόν μοι τί ἐστίν σοι ἐν τῷ οἴκῳ — «скажи мне, что у тебя в доме». ἀλλ᾽ ἢ ὃ ἀλείψομαι ἔλαιον — «кроме елея, которым я помажусь»; ἀλείφομαι — натираться маслом, не культовое помазание. Слав. добавляет «мало» («токмо мало елеа») — в гр этого слова нет; по паритету передано «少しの油». В ru «сосуд с елеем» — по МТ, в гр сосуда нет."
  3: "Δεῦρο αἴτησον σαυτῇ σκεύη — «пойди, попроси себе сосуды» (αἰτέω — просить, не занимать). ἔξωθεν παρὰ πάντων τῶν γειτόνων σου — «со стороны, у всех соседей твоих», т. е. обойдя соседей. σκεύη κενά — «сосуды пустые». μὴ ὀλιγώσῃς — «не умали» (ὀλιγόω): не бери слишком мало."
  4: "ἀποκλείσεις τὴν θύραν κατὰ σοῦ — «запрёшь дверь за собою». ἀποχεεῖς — «выльешь, нальёшь» (ἀποχέω); слав. «влиеши (от елеа твоего)». τὸ πληρωθὲν ἀρεῖς — «наполненное отставишь, уберёшь» (αἴρω)."
  5: "αὐτοὶ προσήγγιζον πρὸς αὐτήν — «они подносили к ней [сосуды]» (προσεγγίζω — приближать, подносить). Слав. «та приношаста к ней» — двойственное число, два сына. αὐτὴ ἐπέχεεν — «она наливала» (ἐπιχέω)."
  6: "ἕως ἐπλήσθησαν τὰ σκεύη — «пока не наполнились сосуды». Ἐγγίσατε ἔτι πρός με σκεῦος — «принесите мне ещё сосуд». ἔστη τὸ ἔλαιον — «остановилось масло» (ἵστημι): источник иссяк."
  7: "ἀπόδου τὸ ἔλαιον — «продай масло» (ἀποδίδωμι). ἀποτείσεις τοὺς τόκους σου — «уплатишь проценты твои» (τόκος — рост, проценты; слав. «лихву»); передано «долг с процентами». ζήσεσθε ἐν τῷ ἐπιλοίπῳ ἐλαίῳ — «будете жить остальным маслом»."
  8: "διέβη ... εἰς Σουμαν — «перешёл в Сонам» (Σουμαν; в тексте スナム). γυνὴ μεγάλη — «женщина великая», т. е. знатная, состоятельная (слав. «жена велия»), а не «большая». ἐκράτησεν αὐτὸν φαγεῖν ἄρτον — «удержала его поесть хлеба», т. е. настояла на угощении. ἀφ᾽ ἱκανοῦ τοῦ εἰσπορεύεσθαι — «с тех пор, как [стал] часто входить»; ἐξέκλινεν — «заворачивал, заходил» (ἐκκλίνω)."
  9: "ἄνθρωπος τοῦ θεοῦ ἅγιος — «святой человек Божий» (神の人). διαπορεύεται ἐφ᾽ ἡμᾶς διὰ παντός — «проходит мимо нас постоянно»."
  10: "ὑπερῷον τόπον μικρόν — «горницу, место малое» (ὑπερῷον — верхняя комната, 屋上の部屋). κλίνην καὶ τράπεζαν καὶ δίφρον καὶ λυχνίαν — постель, стол, седалище (δίφρος — стул) и светильник. ἔσται ἐν τῷ εἰσπορεύεσθαι πρὸς ἡμᾶς καὶ ἐκκλινεῖ ἐκεῖ — «будет, когда придёт к нам, заходить туда»."
  11: "ἐξέκλινεν εἰς τὸ ὑπερῷον — «зашёл в горницу»; ἐκοιμήθη — «лёг, спал» (κοιμάομαι)."
  12: "Γιεζι τὸ παιδάριον αὐτοῦ — Гиезий, слуга (букв. «отрок») Елисея; в книге 従者. Κάλεσόν μοι — «позови мне». ἔστη ἐνώπιον αὐτοῦ — «стала пред ним»."
  13: "ἐξέστησας ἡμῖν πᾶσαν τὴν ἔκστασιν ταύτην — букв. «ты произвела нам всё это исступление»; ἔκστασις здесь — «попечение, хлопоты» (слав. «удивила еси нас всем попечением сим»); передано «столько заботы». εἰ ἔστιν λόγος σοι πρὸς τὸν βασιλέα — «есть ли у тебя слово к царю», т. е. не нужно ли похлопотать. Ἐν μέσῳ τοῦ λαοῦ μου ἐγώ εἰμι οἰκῶ — «среди народа моего я живу» (слав. «посреде людий моих аз есмь живущи»)."
  14: "Καὶ μάλα — «и вправду, конечно» (усилительное; слав. «воистинну»). πρεσβύτης — «старый»."
  15: "В гр только ἐκάλεσεν αὐτήν, καὶ ἔστη παρὰ τὴν θύραν; слав. добавляет повеление «призови ю» («И рече призови ю») — по паритету включено в текст. παρὰ τὴν θύραν — «у двери», т. е. в дверях."
  16: "Εἰς τὸν καιρὸν τοῦτον ὡς ἡ ὥρα ζῶσα — букв. «в это время, как этот час живой», т. е. через год в это же время (слав. «якоже час сей живущи»). περιειληφυῖα υἱόν — «будешь держать сына на руках» (περιλαμβάνω). Μή ... μὴ διαψεύσῃ τὴν δούλην σου — «не обмани рабы твоей» (διαψεύδω; слав. «не солжи»)."
  17: "ἐν γαστρὶ ἔλαβεν — «зачала». ἔτεκεν — «родила». Формула времени повторена дословно, как в ст. 16."
  18: "ἡδρύνθη τὸ παιδάριον — «отрок возмужал, подрос» (ἁδρύνω). πρὸς τοὺς θερίζοντας — «к жнецам» (θερίζω — жать)."
  19: "Τὴν κεφαλήν μου, τὴν κεφαλήν μου — двойной повтор сохранён. Ἆρον αὐτόν — «подними, отнеси его» (αἴρω). В csl стоит пояснение «(болит)» — в гр его нет."
  20: "ἐκοιμήθη ἐπὶ τῶν γονάτων αὐτῆς ἕως μεσημβρίας — «лежал на коленях у неё до полудня» (κοιμάομαι здесь просто «лежать»). ἀπέθανεν — «умер»."
  21: "ἀνήνεγκεν — «подняла, отнесла» (ἀναφέρω). ἐπὶ τὴν κλίνην τοῦ ἀνθρώπου τοῦ θεοῦ — «на постель человека Божия». В слав. ст. 21 оканчивается добавлением «и призва мужа своего, и рече ему» — в гр это начало ст. 22; граница стихов в слав. сдвинута."
  22: "Ἀπόστειλον δή μοι ἓν τῶν παιδαρίων — «пришли мне одного из слуг». δραμοῦμαι — «побегу» (τρέχω). ἐπιστρέψω — «возвращусь»."
  23: "Τί ὅτι σὺ πορεύῃ — «что это ты идёшь» (удивление). οὐ νεομηνία οὐδὲ σάββατον — «не новомесячие и не суббота»: в эти дни ходили к пророкам (ср. 1 Цар 20:5; Ам 8:5). Εἰρήνη — «мир», т. е. «всё хорошо» (слав. «мир»)."
  24: "ἐπέσαξεν τὴν ὄνον — «оседлала ослицу» (ἐπισάττω). μὴ ἐπίσχῃς μοι τοῦ ἐπιβῆναι — «не задерживай меня сесть [на неё]» (ἐπέχω). ὅτι ἐὰν εἴπω σοι — оборот оборван и продолжается в ст. 25; в гр это одно предложение, слав. соединяет 24–25 в один стих («гряди, и иди, и прииди к человеку Божию на гору Кармилскую»)."
  25: "δεῦρο καὶ πορεύσῃ — «ступай и пойдёшь», продолжение речи из ст. 24. εἰς τὸ ὄρος τὸ Καρμήλιον — «на гору Кармил» (カルメル山; ср. 3 Цар 18)."
  26: "νῦν δράμε εἰς ἀπαντὴν αὐτῆς — «теперь беги навстречу ей». Εἰ εἰρήνη σοι; — «мир ли тебе?», т. е. всё ли благополучно (трижды: ей, мужу, ребёнку). Слав. добавляет, что Гиезий побежал и спросил («И тече во сретение ей и рече ей») — в гр только повеление; по паритету включено в текст."
  27: "ἐπελάβετο τῶν ποδῶν — «ухватилась за ноги». ἀπώσασθαι — «оттолкнуть» (ἀπωθέω). ἡ ψυχὴ αὐτῆς κατώδυνος — «душа её сокрушена, скорбна» (κατώδυνος). ἀπέκρυψεν ἀπ᾽ ἐμοῦ — «скрыл от меня»."
  28: "Μὴ ᾐτησάμην υἱὸν παρὰ τοῦ κυρίου μου — «разве я просила сына у господина моего». Οὐ πλανήσεις μετ᾽ ἐμοῦ — «не обманешь меня» (πλανάω; слав. «не прельсти мене»)."
  29: "Ζῶσαι τὴν ὀσφύν σου — «препояшь чресла твои» (ζώννυμι), т. е. приготовься к пути. βακτηρία — посох, жезл (杖). οὐκ εὐλογήσεις αὐτόν — «не приветствуй его» (εὐλογέω здесь «приветствовать»; слав. «да не благословиши его»). ἐπιθήσεις ... ἐπὶ πρόσωπον τοῦ παιδαρίου — «возложи на лицо ребёнка»."
  30: "Ζῇ κύριος καὶ ζῇ ἡ ψυχή σου — клятвенная формула «жив Господь и жива душа твоя». εἰ ἐγκαταλείψω σε — «если оставлю тебя»: при клятве подразумевается кара, в речи опущено «не оставлю». ἀνέστη — «встал»."
  31: "διῆλθεν ἔμπροσθεν αὐτῆς — «прошёл впереди неё». οὐκ ἦν φωνὴ καὶ οὐκ ἦν ἀκρόασις — «не было ни голоса, ни слуха» (ἀκρόασις — слышание, отклик). Οὐκ ἠγέρθη — «не пробудился, не встал» (ἐγείρω)."
  32: "τεθνηκὸς κεκοιμισμένον — «умерший, положенный [на постель]» (причастия перфекта); слав. «умерый положен»."
  33: "ἀπέκλεισεν τὴν θύραν κατὰ τῶν δύο ἑαυτῶν — «запер дверь за обоими собою», т. е. остался наедине с ребёнком."
  34: "ἀνέβη καὶ ἐκοιμήθη ἐπὶ τὸ παιδάριον — «поднялся и лёг на ребёнка». ἔθηκεν τὸ στόμα ... ἐπὶ τὸ στόμα — уста к устам, очи к очам, руки к рукам; троекратный параллелизм сохранён. διέκαμψεν ἐπ᾽ αὐτόν — «согнулся над ним» (διακάμπτω). Слав. добавляет «и дуну на него» — в гр и МТ этого нет; по паритету включено в текст. διεθερμάνθη ἡ σάρξ — «согрелась плоть»."
  35: "ἐπέστρεψεν καὶ ἐπορεύθη ἐν τῇ οἰκίᾳ ἔνθεν καὶ ἔνθεν — «повернулся и ходил по дому туда и сюда». συνέκαμψεν ... ἕως ἑπτάκις — «согнулся над ним до семи раз». ἤνοιξεν τοὺς ὀφθαλμούς — «открыл глаза». В ru «чихнул семь раз» — по МТ (в LXX чихания нет), в текст не внесено."
  36: "ἐξεβόησεν — «воззвал, крикнул» (ἐκβοάω). Κάλεσον — «позови». Λαβὲ τὸν υἱόν σου — «возьми сына твоего»."
  37: "προσεκύνησεν ἐπὶ τὴν γῆν — «поклонилась до земли». ἔλαβεν τὸν υἱὸν αὐτῆς — «взяла сына своего»."
  38: "Ἐπίστησον τὸν λέβητα τὸν μέγαν — «поставь большой котёл» (ἐφίστημι). ἕψε ἕψεμα — «свари варево» (ἕψω; ἕψεμα — похлёбка, 煮物). ὁ λιμός — голод."
  39: "συλλέξαι αριωθ — тёмное слово (ἀριώθ), вероятно передача евр. «зелень, травы»; слав. «зелия дивия» (дикие овощи) — переведено «полевые травы». ἄμπελος ἀγρία — «дикая лоза»; τολύπη ἀγρία — «дикий [плод]», скорее всего колоквинт (горький дикий огурец); слав. «яблока дивияго» (дикие плоды), ru «дикие плоды». ὅτι οὐκ ἔγνωσαν — «потому что не знали, [что это]»."
  40: "Θάνατος ἐν τῷ λέβητι — «смерть в котле». οὐκ ἠδύναντο φαγεῖν — «не могли есть»."
  41: "Λάβετε ἄλευρον — «возьмите муку» (ἄλευρον — пшеничная мука). ἔγχει τῷ λαῷ — «наливай народу» (ἐγχέω). οὐκ ἐγενήθη ἔτι ... ῥῆμα πονηρόν — «не стало более ничего худого» (ῥῆμα здесь «вещь, дело»; слав. «злаго глагола»)."
  42: "Βαιθσαρισα — Беф-Салиса (ベト・サリサ). πρωτογενημάτων — «первых плодов» (初穂). ἄρτους κριθίνους — ячменные хлебы. παλάθας — «плитки [сушёных плодов]» (παλάθη, лепёшка из смокв); слав. «смоквы», в ru «сырые зерна в шелухе» — по МТ."
  43: "λειτουργός — «служитель» (слав. «отрок»); в книге 従者. Τί δῶ τοῦτο ἐνώπιον ἑκατὸν ἀνδρῶν — «что дам это пред ста мужами». Φάγονται καὶ καταλείψουσιν — «съедят и оставят»: пророчество об умножении."
  44: "κατὰ τὸ ῥῆμα κυρίου — «по слову Господню». В гр не сказано, кто подал; в ru «он подал» — по смыслу."
