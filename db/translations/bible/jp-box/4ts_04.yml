# jp-box, 4-я Царств, глава 4. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 4: масло вдовы (1–7), сунамитянка, горница и рождение сына (8–17),
# смерть и воскрешение сына (18–37), ядовитая похлёбка (38–41), умножение
# хлебов (42–44).
# Нумерация по gr: 44 стиха, как и в csl; границы стихов 21/22 и 24/25 в слав.
# сдвинуты (см. notes), счёт стихов от этого не меняется.
# Речь — 「…」 первого уровня, вложенная — 『…』. Красного и синего нет.
# 〔…〕 нет: csl-чтения входят в основной текст без скобок, LXX-варианты
# и отличия от МТ отмечены в notes.
# Сносок ⟨…⟩ нет: 油, 預言者, 神の人, 寝台, 燔祭 уже в корпусе; новых терминов
# в главе нет.
# jp-ni не использовался.

