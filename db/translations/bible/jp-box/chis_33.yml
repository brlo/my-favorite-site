# jp-box, Числа, глава 33. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в этой главе нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 33: станы исхода от Рамесеса до равнин Моава (1–49), повеление об
# изгнании жителей Ханаана и разделе земли (50–56).
# Речь Бога — 「…」 (51–56). Красного нет; сносок ⟨…⟩ нет (宿営, 嗣業, 所有, くじ
# уже в корпусе или понятны по контексту).
# 〔…〕 нет: в csl 33:49 прибавлено «и воздвигошася от запада моавля» — это
# дублет начала стиха, в gr-lxx-byz глагола ἀπῆραν нет (bracket_check — НЕТ),
# поэтому слав. вставка в текст не внесена и не скоблится (см. note 49).
# Топонимы транслитерированы с греческого: ラメセス, スコト, ブタン, エイロト,
