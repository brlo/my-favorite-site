verses:
  1: "イスラエルの子[こ]らが、その軍勢[ぐんせい]とともに、モーセとアロンの手[て]によってエジプトの地[ち]を出[で]たときの宿営地[しゅくえいち]は、次[つぎ]のとおりである。"
  2: "モーセは、主[しゅ]の言葉[ことば]によって、彼[かれ]らの出発[しゅっぱつ]と宿営地[しゅくえいち]を書[か]き記[しる]した。これが彼らの旅[たび]の宿営地である。"
  3: "彼[かれ]らは第一[だいいち]の月[つき]、その月の十五日[じゅうごにち]にラメセスを発[た]った。過越[すぎこし]の翌日[よくじつ]、イスラエルの子[こ]らは高[たか]く上[あ]げた手[て]によって、すべてのエジプト人[じん]の見[み]ている前[まえ]を出[で]た。"
  4: "エジプト人[じん]は、主[しゅ]が彼[かれ]らのうちで打[う]ち殺[ころ]したすべての死[し]んだ者[もの]、すなわちエジプトの地[ち]のすべての初子[ういご]を葬[ほうむ]っていた。主は彼らの神々[かみがみ]の上[うえ]にも報復[ほうふく]を果[は]たされた。"
  5: "イスラエルの子[こ]らはラメセスを発[た]って、スコトに宿営[しゅくえい]した。"
  6: "スコトを発[た]って、荒野[こうや]の一部[いちぶ]であるブタンに宿営[しゅくえい]した。"
  7: "ブタンを発[た]って、ベエルセプフォンの前[まえ]にあるエイロトの入口[いりぐち]に宿営[しゅくえい]した。そしてマグドロの前に宿営した。"
  8: "エイロトの前[まえ]を発[た]って、海[うみ]の中[なか]を通[とお]って荒野[こうや]へ入[はい]り、荒野を三日[みっか]の道[みち]を行[い]って、ピクリアに宿営[しゅくえい]した。"
  9: "ピクリアを発[た]って、エリムに来[き]た。エリムには十二[じゅうに]の水[みず]の泉[いずみ]と七十本[ななじゅうほん]の棕櫚[しゅろ]の木[き]があり、彼[かれ]らはそこで水のそばに宿営[しゅくえい]した。"
  10: "エリムを発[た]って、紅海[こうかい]のほとりに宿営[しゅくえい]した。"
  11: "紅海[こうかい]を発[た]って、シンの荒野[こうや]に宿営[しゅくえい]した。"
  12: "シンの荒野[こうや]を発[た]って、ラファカに宿営[しゅくえい]した。"
  13: "ラファカを発[た]って、アイルスに宿営[しゅくえい]した。"
  14: "アイルスを発[た]って、ラフィディンに宿営[しゅくえい]した。そこには民[たみ]が飲[の]む水[みず]がなかった。"
  15: "ラフィディンを発[た]って、シナの荒野[こうや]に宿営[しゅくえい]した。"
  16: "シナの荒野[こうや]を発[た]って、欲[よく]の墓[はか]に宿営[しゅくえい]した。"
  17: "欲[よく]の墓[はか]を発[た]って、アシロトに宿営[しゅくえい]した。"
  18: "アシロトを発[た]って、ラタマに宿営[しゅくえい]した。"
  19: "ラタマを発[た]って、レムモン・ファレスに宿営[しゅくえい]した。"
  20: "レムモン・ファレスを発[た]って、レモナに宿営[しゅくえい]した。"
  21: "レモナを発[た]って、デッサに宿営[しゅくえい]した。"
  22: "デッサを発[た]って、マケラトに宿営[しゅくえい]した。"
  23: "マケラトを発[た]って、サファルに宿営[しゅくえい]した。"
  24: "サファルを発[た]って、ハラダトに宿営[しゅくえい]した。"
  25: "ハラダトを発[た]って、マケロトに宿営[しゅくえい]した。"
  26: "マケロトを発[た]って、カタアトに宿営[しゅくえい]した。"
  27: "カタアトを発[た]って、タラトに宿営[しゅくえい]した。"
  28: "タラトを発[た]って、マテッカに宿営[しゅくえい]した。"
  29: "マテッカを発[た]って、セルモナに宿営[しゅくえい]した。"
  30: "セルモナを発[た]って、マスルートに宿営[しゅくえい]した。"
  31: "マスルートを発[た]って、バナイアに宿営[しゅくえい]した。"
  32: "バナイアを発[た]って、ガドガドの山[やま]に宿営[しゅくえい]した。"
  33: "ガドガドの山[やま]を発[た]って、エテバタに宿営[しゅくえい]した。"
  34: "エテバタを発[た]って、エブロナに宿営[しゅくえい]した。"
  35: "エブロナを発[た]って、ゲシオンガベルに宿営[しゅくえい]した。"
  36: "ゲシオンガベルを発[た]って、シンの荒野[こうや]に宿営[しゅくえい]した。シンの荒野を発って、パランの荒野に宿営した。これがカデスである。"
  37: "カデスを発[た]って、エドムの地[ち]の近[ちか]くにあるホル山[やま]に宿営[しゅくえい]した。"
  38: "祭司[さいし]アロンは主[しゅ]の命令[めいれい]によって上[のぼ]り、そこで死[し]んだ。それは、イスラエルの子[こ]らがエジプトの地[ち]を出[で]てから四十年目[よねんめ]の第五[だいご]の月[つき]、その月の一日[ついたち]のことであった。"
  39: "アロンは、ホル山[やま]で死[し]んだとき、百二十三歳[さい]であった。"
  40: "アラドの王[おう]であるカナン人[じん]は、イスラエルの子[こ]らが入[はい]って行[い]くとき、それを聞[き]いた。彼[かれ]はカナンの地[ち]に住[す]んでいた。"
  41: "ホル山[やま]を発[た]って、セルモナに宿営[しゅくえい]した。"
  42: "セルモナを発[た]って、フィノに宿営[しゅくえい]した。"
  43: "フィノを発[た]って、オボトに宿営[しゅくえい]した。"
  44: "オボトを発[た]って、向[む]こう側[がわ]、モアブの領界[りょうかい]にあるガイに宿営[しゅくえい]した。"
  45: "ガイを発[た]って、ダイボン・ガドに宿営[しゅくえい]した。"
  46: "ダイボン・ガドを発[た]って、ゲルモン・デブラタイムに宿営[しゅくえい]した。"
  47: "ゲルモン・デブラタイムを発[た]って、ネボの前[まえ]にあるアバリムの山々[やまやま]に宿営[しゅくえい]した。"
  48: "アバリムの山々[やまやま]を発[た]って、モアブの西[にし]、ヨルダン川[がわ]のほとり、エリコに面[めん]した所[ところ]に宿営[しゅくえい]した。"
  49: "彼[かれ]らはヨルダン川[がわ]のほとり、アイシモトからベルサッティムに至[いた]るまで、モアブの西[にし]に宿営[しゅくえい]した。"
  50: "主[しゅ]は、モアブの西[にし]、ヨルダン川[がわ]のほとり、エリコに面[めん]した所[ところ]で、モーセに語[かた]って言[い]われた。"
  51: "「イスラエルの子[こ]らに語[かた]って言[い]いなさい。あなたがたはヨルダン川[がわ]を渡[わた]ってカナンの地[ち]に入[はい]ろうとしている。"
  52: "あなたがたの前[まえ]から、その地[ち]に住[す]む者[もの]をすべて滅[ほろ]ぼし、彼[かれ]らの見張[みは]り櫓[やぐら]をすべて取[と]り除[のぞ]き、彼らの鋳[い]た偶像[ぐうぞう]をすべて滅ぼし、彼らの石柱[せきちゅう]をすべて取り除きなさい。"
  53: "あなたがたは、その地に住む者をすべて滅ぼして、そこに住[す]みなさい。わたしが彼らの地をあなたがたに嗣業[しぎょう]として与[あた]えたからである。"
  54: "あなたがたは彼らの地を、自分[じぶん]たちの部族[ぶぞく]ごとに、くじによって嗣業[しぎょう]として受[う]け継[つ]ぎなさい。多[おお]い者[もの]にはその所有[しょゆう]を多くし、少[すく]ない者にはその所有を少なくしなさい。名[な]がそこに出[で]るなら、そこがその者のものとなる。あなたがたは父[ちち]たちの部族ごとに嗣業を受け継ぎなさい。"
  55: "もしあなたがたが、その地[ち]に住[す]む者を自分[じぶん]たちの前[まえ]から滅ぼさないなら、あなたがたが彼[かれ]らのうちに残[のこ]す者[もの]は、あなたがたの目[め]には刺[とげ]、わき腹[ばら]には矢[や]となり、あなたがたが住むその地であなたがたを敵[てき]として攻[せ]め立てるであろう。"
  56: "そして、わたしが彼[かれ]らにしようと決[き]めていたとおりのことを、あなたがたにするであろう。」"

notes:
  1: "σταθμοί — станы, стоянки (σταθμός); в тексте 宿営地, тогда как παρεμβάλλω в этой главе — 宿営する. σὺν δυνάμει αὐτῶν — «со своим войском (силою)» (δύναμις; слав. «с силою своею», ru «по ополчениям своим»). ἐν χειρὶ Μωυσῆ καὶ Ααρων — «рукою Моисея и Аарона», т. е. под их водительством."
  2: "ἀπάρσεις — «выступления, отправления» (ἄπαρσις, от ἀπαίρω). ἔγραψεν … διὰ ῥήματος κυρίου — «написал по слову Господню». πορεία — «путь, шествие»; σταθμοί повторено."
  3: "ἀπῆραν ἐκ Ραμεσση — отправились из Рамесеса (Ραμεσση; ru Раамсес). τῷ μηνὶ τῷ πρώτῳ τῇ πεντεκαιδεκάτῃ ἡμέρᾳ — в первый месяц, в пятнадцатый день (порядок греч.). τῇ ἐπαύριον τοῦ πασχα — «на следующий день Пасхи» (ἐπαύριον). ἐν χειρὶ ὑψηλῇ — «рукою высокою» (ὑψηλός), т. е. явно, силою Божией."
  4: "ἔθαπτον — хоронили (imperfect, действие длительное). ἐξ αὑτῶν — «из них». πᾶν πρωτότοκον — всякого первенца (初子). ἐποίησεν τὴν ἐκδίκησιν — «совершил отмщение» (ἐκδίκησις; слав. «сотвори отмщение»; ru «совершил суд»)."
  5: "παρενέβαλον εἰς Σοκχωθ — расположились станом в Сокофе (Σοκχωθ; в Исх 13:20 корпуса — スコト)."
  6: "Βουθαν — ブタン (слав. «вуфан»); ru «Ефам» — иное (масоретское) чтение. ὅ ἐστιν μέρος τι τῆς ἐρήμου — «что есть некая часть пустыни»."
  7: "ἐπὶ στόμα Ειρωθ — «при устье (входе) Ейрофа» (στόμα — «уста, устье»); ru «Пи-Гахироф». Βεελσεπφων — ベエルセプフォン (ru Ваал-Цефон). Μαγδώλου — род. пад. от Μαγδωλός, マグドロ (ru Мигдол). Дважды παρενέβαλον — «и расположились станом»."
  8: "ἀπὸ ἀπέναντι Ειρωθ — «от против Ейрофа» (ἀπέναντι). διέβησαν μέσον τῆς θαλάσσης — прошли среди моря. ὁδὸν τριῶν ἡμερῶν — путь трёх дней. Πικρίαις — ピクリア (Πικρίαι, «горькие»); это стан Мерры (マラ, Исх 15:23), в ru «Мерра»; в LXX имя передано нарицательно."
  9: "ἦλθον εἰς Αιλιμ — пришли в Елим (ἔρχομαι, а не παρεμβάλλω). πηγαὶ ὑδάτων — источники вод. στελέχη φοινίκων — стволы пальм (στέλεχος, φοῖνιξ). Слав. вставляет «(быша)» — глосса-связка, не чтение."
  10: "ἐπὶ θάλασσαν ἐρυθράν — у моря Чермного (紅海)."
  11: "ἔρημον Σιν — пустыня Син (не Синай; ср. 1:1)."
  12: "Ραφακα — Рафака (в ru «Дофка» — иное чтение)."
  13: "Αιλους — Аилус (ru «Алуш»)."
  14: "Ραφιδιν — Рафидин (ru «Рефидим»). οὐκ ἦν ὕδωρ τῷ λαῷ πιεῖν — «не было воды народу пить» (дат. с инфинитивом)."
  15: "ἔρημος Σινα — пустыня Сина, т. е. Синайская (シナの荒野, ср. 1:1; 10:12)."
  16: "Μνήμασιν τῆς ἐπιθυμίας — «гробам похоти» (μνῆμα, ἐπιθυμία); имя переведено, как в 11:34 (欲の墓), а не транслитерировано. ru «Киброт-Гаттаава»."
  17: "Ασηρωθ — Асироф (アシロト; ср. 11:35; 12:16). Μνημάτων ἐπιθυμίας — род. пад., «от гробов похоти»."
  18: "Ραθαμα — Ратама (ru «Рифма»)."
  19: "Ρεμμων Φαρες — Реммон-Фарес, два имени без καί (ru «Римнон-Фарец»)."
  20: "Λεμωνα — Лемона (ru «Ливна»; слав. «лемвон»)."
  21: "Δεσσα — Десса (слав. «рессан», ru «Рисса»)."
  22: "Μακελλαθ — Макеллаф (ru «Кегелафа»)."
  23: "Σαφαρ — Сафар (в csl «арсафаф» — иная форма; ru «гора Шафер»)."
  24: "Χαραδαθ — Харадаф (ru «Харада»)."
  25: "Μακηλωθ — Макелоф (слав. «макидоф», ru «Макелоф»)."
  26: "Κατααθ — Катааф (ru «Тахаф»)."
  27: "Ταραθ — Тараф (слав. «фараф», ru «Тарах»)."
  28: "Ματεκκα — Матекка (слав. «мафекка», ru «Мифка»)."
  29: "Σελμωνα — Селмон (слав. «аселмон», ru «Хашмона»)."
  30: "Μασσουρουθ — Массуруф (ru «Мосероф»)."
  31: "Βαναια — Ванаия (слав. «ванаккан», ru «Бене-Яакан»)."
  32: "τὸ ὄρος Γαδγαδ — гора Гадгад (Γαδγαδ; ru «Хор-Агидгад»)."
  33: "Ετεβαθα — Етевафа (ru «Иотвафа»)."
  34: "Εβρωνα — Еврон (слав. «еврон», ru «Аврона»); не Хеврон."
  35: "Γεσιωνγαβερ — Гесион-Гавер (ru «Ецион-Гавер»)."
  36: "Два стана в одном стихе: пустыня Син и пустыня Фаран (ἔρημος Φαραν). αὕτη ἐστὶν Καδης — «это Кадес» (Καδης)."
  37: "Ωρ τὸ ὄρος — гора Ор (ホル山; ср. 20:22). πλησίον γῆς Εδωμ — близ земли Едома."
  38: "ἀνέβη … διὰ προστάγματος κυρίου — взошёл по повелению Господню (διά + род.). ἐν τῷ τεσσαρακοστῷ ἔτει τῆς ἐξόδου — в сороковой год исхода. τῷ μηνὶ τῷ πέμπτῳ μιᾷ τοῦ μηνός — в пятый месяц, в первый день месяца."
  39: "τριῶν καὶ εἴκοσι καὶ ἑκατὸν ἐτῶν — «трёх и двадцати и ста лет» (порядок греч.: 123). ὅτε ἀπέθνῃσκεν — «когда умирал» (imperfect)."
  40: "ὁ Χανανις βασιλεὺς Αραδ — «Хананеянин, царь Арада» (Χανανίς — хананеянин). καὶ οὗτος κατῴκει — «и он жил». В ru добавлено «к югу земли Ханаанской» — в gr-lxx-byz этого нет."
  41: "ἐξ Ωρ τοῦ ὄρους — от горы Ор. εἰς Σελμωνα — в Селмон (то же имя, что в ст. 29)."
  42: "Φινω — Фино (слав. «финон», ru «Пунон»)."
  43: "Ωβωθ — Овоф (オボト; ср. 21:10)."
  44: "Γαι — Гай (Γαι; ru «Ийм-Аварим»). ἐν τῷ πέραν — «на той стороне». ἐπὶ τῶν ὁρίων Μωαβ — на пределах Моава."
  45: "Δαιβων Γαδ — Дивон-Гад (ダイボン・ガド, ср. 32:34)."
  46: "Γελμων Δεβλαθαιμ — Гелмон-Девлафаим (ru «Алмон-Дивлафаим»)."
  47: "ὄρη τὰ Αβαριμ — горы Аварим (アバリム). ἀπέναντι Ναβαυ — против Нево (ネボ; ср. 27:12, где Ναβαυ)."
  48: "ἀπὸ ὀρέων Αβαριμ — от гор Аварим. ἐπὶ δυσμῶν Μωαβ — «на запад от Моава», т. е. в западной части Моава. ἐπὶ τοῦ Ιορδάνου κατὰ Ιεριχω — при Иордане, против Иерихона."
  49: "παρὰ τὸν Ιορδάνην — при Иордане. ἀνὰ μέσον Αισιμωθ ἕως Βελσαττιμ — «между Аисимофом и до Белсаттима» (ru «от Беф-Иешимофа до Аве-Ситтима»). κατὰ δυσμὰς Μωαβ — к западу от Моава. В csl добавлено «и воздвигошася от запада моавля» — ἀπῆραν в этом стихе нет (bracket_check: НЕТ), поэтому слав. вставка в текст не внесена."
  50: "Формула ἐλάλησεν κύριος πρὸς Μωυσῆν … λέγων; место указано подробно, как в 22:1; 26:3; 31:12."
  51: "Ὑμεῖς διαβαίνετε — «вы переходите» (praesens); речь Бога — с 51-го стиха, кавычка открыта здесь."
  52: "σκοπιάς — «сторожевые башни, высоты» (σκοπιά; слав. «стражбы»; ru «изображения» — масоретское чтение). εἴδωλα χωνευτά — литые идолы (χωνευτός). στήλας — столбы, стелы (石柱)."
  53: "κατοικήσετε ἐν αὐτῇ — поселитесь в ней. δέδωκα — perfect: «Я дал», дар уже дан. ἐν κλήρῳ — «в удел, по жребию»."
  54: "τοῖς πλείοσιν πληθυνεῖτε — «многим умножите» (πληθύνω). κατάσχεσις — владение (所有). εἰς ὃ ἐὰν ἐξέλθῃ τὸ ὄνομα αὐτοῦ — «на что выйдет имя его», т. е. куда падёт жребий; в LXX здесь ὄνομα вместо κλῆρος (ru «кому где выйдет жребий»)."
  55: "σκόλοπες — колючки, тернии (σκόλοψ). βολίδες — стрелы, острия (βολίς; слав. «стрелы»). ἐχθρεύσουσιν — будут враждовать (ἐχθρεύω)."
  56: "καθότι διεγνώκειν ποιῆσαι αὐτούς — «как Я замыслил сделать им» (διεγνώκειν, pluperf. от διαγινώσκω). ποιήσω ὑμῖν — сделаю вам."
