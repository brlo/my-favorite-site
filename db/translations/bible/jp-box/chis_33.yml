# 33:16–17 Μνήματα τῆς ἐπιθυμίας передано 欲の墓 (так уже в 11:34), не транслитерация.
# Слав. скобочные связки («(быша)» в 33:9) не маркируются: это глосса, не чтение.
# Отличия LXX от масоретского/Синодального (по базе): 33:6 Βουθαν (ru Ефам);
