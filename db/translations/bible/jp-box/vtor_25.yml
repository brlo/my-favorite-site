# jp-box, Второзаконие, глава 25. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в этой главе нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 25 продолжает речь Моисея (вводной формулы нет): суд и телесное наказание
# (1–3), «не заграждай рта волу молотящему» (4), брак с женой умершего брата и
# «дом разутого» (5–10), женщина в драке (11–12), честные гири и меры (13–16),
# память об Амалике (17–19).
# Вся глава — речь Моисея: 「…」 открывается в 1-м стихе и закрывается в конце 19-го;
# слова женщины и мужчины внутри неё — 『…』 (7, 8, 9), прозвище в 10-м — тоже 『…』.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (проверено по выгрузке).
# Сносок ⟨…⟩ нет: 祭壇, レビ人 уже в корпусе; 分銅, 陰嚢 понятны по контексту.
# jp-ni не использовался.

tr_code: jp-box
book: vtor
chapter: 25
draft: true

verses:
  1: "「もし人[ひと]と人との間[あいだ]に争[あらそ]いが起[お]こり、彼[かれ]らが裁[さば]きの場[ば]に来[き]て、裁き人たちが裁いて、正[ただ]しい者[もの]を正しいと認[みと]め、悪[わる]い者を罪[つみ]ある者と定[さだ]めるなら、"
  2: "もしその者[もの]が鞭打[むちう]ちに値[あたい]するなら、あなたは彼を裁[さば]き人[びと]たちの前[まえ]に立[た]たせ、彼[かれ]らの前で、その悪[わる]の数[かず]に応[おう]じて彼を鞭で打[う]たせなさい。"
  3: "彼[かれ]を四十[しじゅう]の鞭[むち]で打[う]たせ、それ以上[いじょう]は加[くわ]えてはならない。もしこの鞭のほかに多[おお]く打って加えるなら、あなたの兄弟[きょうだい]はあなたの前[まえ]で見苦[みぐる]しい姿[すがた]になる。"
  4: "脱穀[だっこく]する牛[うし]の口[くち]を塞[ふさ]いではならない。"
  5: "もし兄弟[きょうだい]たちが一緒[いっしょ]に住[す]んでいて、そのうちの一人[ひとり]が死[し]に、子[こ]がないなら、死んだ者[もの]の妻[つま]は、親族[しんぞく]でない男[おとこ]のものになってはならない。彼女[かのじょ]の夫[おっと]の兄弟が彼女のもとに入[はい]り、彼女を自分[じぶん]の妻として迎[むか]え、彼女とともに住まなければならない。"
  6: "彼女[かのじょ]が産[う]む子[こ]は、死んだ者[もの]の名[な]によって立[た]てられ、その名がイスラエルから消[き]え去[さ]ることはない。"
  7: "もしその人[ひと]が兄弟[きょうだい]の妻[つま]を迎[むか]えようとしないなら、女[おんな]は町[まち]の門[もん]へ、長老[ちょうろう]たちのところへ上[のぼ]って行[い]き、『わたしの夫[おっと]の兄弟は、イスラエルにおいて自分の兄弟の名[な]を起[お]こそうとしない。わたしの夫の兄弟は、そうしようとしなかった』と言[い]う。"
  8: "その町[まち]の長老[ちょうろう]たちは彼を呼[よ]んで語[かた]りかける。もし彼が立[た]って『わたしは彼女[かのじょ]を迎[むか]えたくない』と言[い]うなら、"
  9: "その男[おとこ]の兄弟[きょうだい]の妻[つま]が長老[ちょうろう]たちの前[まえ]に進[すす]み出[で]て、彼の足[あし]から片方[かたほう]の履[は]き物[もの]を脱[ぬ]がし、彼の顔[かお]に唾[つば]をかけ、答[こた]えて言[い]う。『兄弟の家[いえ]を建[た]てない者[もの]には、このようにするのです』"
  10: "そして、その名[な]はイスラエルで『履[は]き物[もの]を脱[ぬ]がされた者[もの]の家[いえ]』と呼[よ]ばれる。"
  11: "もし人[ひと]とその兄弟[きょうだい]が一緒[いっしょ]に争[あらそ]って打[う]ち合[あ]い、一方[いっぽう]の妻[つま]が、自分[じぶん]の夫[おっと]を打つ者[もの]の手[て]から救[すく]い出[だ]そうとして近[ちか]づき、手を伸[の]ばしてその男[おとこ]の陰嚢[いんのう]を掴[つか]むなら、"
  12: "その女[おんな]の手[て]を切[き]り落[お]としなさい。あなたの目[め]は彼女[かのじょ]を惜[お]しんではならない。"
  13: "あなたの袋[ふくろ]の中[なか]に、分銅[ぶんどう]と分銅、大[おお]きいものと小[ちい]さいものがあってはならない。"
  14: "あなたの家[いえ]の中に、量[はか]りと量り、大[おお]きいものと小[ちい]さいものがあってはならない。"
  15: "あなたには、真実[しんじつ]で正[ただ]しい分銅[ぶんどう]と、真実で正しい量[はか]りがなければならない。それは、あなたの神[かみ]である主[しゅ]があなたに嗣業[しぎょう]として与[あた]える地[ち]で、あなたの日々[ひび]が長[なが]く続[つづ]くためである。"
  16: "これらのことを行[おこな]う者[もの]、不正[ふせい]を行なう者はすべて、あなたの神[かみ]である主[しゅ]にとって忌[い]まわしいものだからである。"
  17: "あなたがエジプトから出[で]て来[き]たとき、道[みち]でアマレクがあなたにしたことをすべて覚[おぼ]えていなさい。"
  18: "すなわち、彼が道[みち]であなたに逆[さか]らい、あなたの後[うし]ろにいた疲[つか]れた者[もの]たち、あなたのしんがりを断[た]ったこと、また、あなたが飢[うえ]て疲れていたときに、彼が神[かみ]を恐[おそ]れなかったことを。"
  19: "あなたの神[かみ]である主[しゅ]が、あなたに嗣業[しぎょう]として与[あた]えて受[う]け継[つ]がせる地[ち]で、あなたの周[まわ]りのすべての敵[てき]からあなたを休[やす]ませるとき、あなたはアマレクの名[な]を天[てん]の下[した]から消[き]し去[さ]らなければならない。忘[わす]れてはならない。」"

notes:
  1: "ἀντιλογία — тяжба, спор (слав. «пря»); προσέλθωσιν εἰς κρίσιν — придут на суд; δικαιώσωσιν τὸν δίκαιον — оправдают правого (δικαιόω — признать правым); καταγνῶσιν τοῦ ἀσεβοῦς — осудят нечестивого (καταγινώσκω с родительным — вынести обвинительный приговор)."
  2: "ἄξιος πληγῶν — достойный побоев (πληγή — удар, язва); καθιεῖς — поставишь (καθίημι; слав. «да поставиши его пред судиями»); μαστιγώσουσιν — будут бить бичами (μαστιγόω); κατὰ τὴν ἀσέβειαν αὐτοῦ ἀριθμῷ — по нечестию его, по числу ударов."
  3: "τεσσαράκοντα — сорок: LXX называет число прямо; οὐ προσθήσουσιν — не прибавят; ἀσχημονήσει — будет обезображен, посрамлён (ἀσχημονέω; слав. «срам будет»). В еврейской практике давали 39 ударов, чтобы не превысить сорока (ср. 2 Кор 11:24)."
  4: "Οὐ φιμώσεις — не заградишь рта, не наденешь намордник (φιμόω); βοῦν ἀλοῶντα — вола молотящего (ἀλοάω — молотить). Место цитируется в 1 Кор 9:9 и 1 Тим 5:18."
  5: "κατοικῶσιν ἐπὶ τὸ αὐτό — живут вместе; σπέρμα — семя, потомство; οὐκ ἔσται … ἔξω ἀνδρὶ μὴ ἐγγίζοντι — не выйдет за мужчину неродственного (ἐγγίζων — близкий, родственник; слав. «иному мужу несродну»); εἰσελεύσεται πρὸς αὐτήν — войдёт к ней (эвфемизм брака); συνοικήσει — будет жить с ней."
  6: "τὸ παιδίον … κατασταθήσεται ἐκ τοῦ ὀνόματος τοῦ τετελευτηκότος — дитя будет поставлено по имени умершего, т.е. записано в его род и названо его именем; ἐξαλειφθήσεται — изгладится (ἐξαλείφω); ἐξ Ισραηλ — из Израиля."
  7: "ἀναβήσεται … ἐπὶ τὴν πύλην ἐπὶ τὴν γερουσίαν — взойдёт к воротам, к старейшинам (место суда у городских ворот); ἀναστῆσαι τὸ ὄνομα — восстановить имя, т.е. поднять потомство умершему; повтор «не захотел брат мужа моего» сохранён."
  8: "καλέσουσιν — призовут; στὰς εἴπῃ — встав, скажет (поза и формула судебного ответа, ср. 19:17); Οὐ βούλομαι λαβεῖν αὐτήν — не хочу взять её."
  9: "ὑπολύσει τὸ ὑπόδημα — разует сандалию (ὑπολύω; знак отказа от права и обязанности); ἐμπτύσεται εἰς τὸ πρόσωπον — плюнет в лицо (ἐμπτύω); Οὕτως ποιήσουσιν — так сделают (в LXX будущее, формула приговора); οἰκοδομήσει τὸν οἶκον — созиждет дом, т.е. восстановит род брата."
  10: "κληθήσεται τὸ ὄνομα αὐτοῦ — будет названо имя его; Οἶκος τοῦ ὑπολυθέντος τὸ ὑπόδημα — «дом разутого» (прозвище; слав. «дом изутаго из сапога»); артикль при причастии указывает на конкретного человека."
  11: "μάχωνται — дерутся, ссорятся; ἐξελέσθαι — вырвать, избавить; τῶν διδύμων — букв. «близнецов», т.е. яичек; телесная подробность сохранена без смягчения."
  12: "ἀποκόψεις τὴν χεῖρα αὐτῆς — отсечёшь руку её (ἀποκόπτω); οὐ φείσεται ὁ ὀφθαλμός σου — не пощадит глаз твой (φείδομαι); ср. формулу «око за око» (19:21) и запрет жалеть (19:13)."
  13: "μαρσίππῳ — кошель, сумка (μάρσιππος); στάθμιον καὶ στάθμιον — гиря и гиря, т.е. два разных набора гирь; μέγα ἢ μικρόν — большая или малая. Повтор сохранён."
  14: "μέτρον καὶ μέτρον — мера и мера (мера объёма, ефа/бат); μέγα ἢ μικρόν — большая или малая; параллель к ст. 13 (гири в кошеле, меры в доме)."
  15: "στάθμιον ἀληθινὸν καὶ δίκαιον — гиря истинная и праведная; μέτρον ἀληθινὸν καὶ δίκαιον — мера истинная и праведная; πολυήμερος γένῃ — станешь многодневным, т.е. долговечным (πολυήμερος); ἐν κλήρῳ — в удел."
  16: "βδέλυγμα κυρίῳ — мерзость Господу (βδέλυγμα); πᾶς ποιῶν ταῦτα, πᾶς ποιῶν ἄδικον — всякий, делающий это, всякий, делающий неправду: двойной повтор подчёркивает тяжесть (слав. «мерзость… всяк творяй неправду»)."
  17: "Μνήσθητι — помни (μιμνῄσκομαι); ὅσα ἐποίησέν σοι Αμαληκ — что сделал тебе Амалик; ἐν τῇ ὁδῷ — на пути; ἐκπορευομένου σου ἐξ Αἰγύπτου — когда ты выходил из Египта (родительный абсолютный)."
  18: "ἀντέστη — противостал (ἀνθίστημι); ἔκοψέν σου τὴν οὐραγίαν — отсёк твой арьергард (οὐραγία — задняя часть войска, слав. «задний полк»); τοὺς κοπιῶντας ὀπίσω σου — утомлённых позади тебя; ἐπεῖνας καὶ ἐκοπίασας — был голоден и утомлён; οὐκ ἐφοβήθη τὸν θεόν — не побоялся Бога."
  19: "καταπαύσῃ σε — успокоит тебя (καταπαύω); ἀπὸ πάντων τῶν ἐχθρῶν … κύκλῳ σου — от всех врагов вокруг тебя; κατακληρονομῆσαι — наследовать, овладеть; ἐξαλείψεις τὸ ὄνομα — изгладишь имя (ἐξαλείφω); ἐκ τῆς ὑπὸ τὸν οὐρανόν — из поднебесной; οὐ μὴ ἐπιλάθῃ — усиленное «не забудь»."
