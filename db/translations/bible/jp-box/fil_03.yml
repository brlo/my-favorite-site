verses:
  1: "最後[さいご]に、わたしの兄弟[きょうだい]たち。主[しゅ]にあって喜[よろこ]びなさい。同[おな]じことをあなたがたに書[か]くのは、わたしには煩[わずら]わしくなく、あなたがたには安全[あんぜん]なことである。"
  2: "犬[いぬ]どもに気[き]をつけよ。悪[あく]い働[はたら]き手[て]どもに気[き]をつけよ。切[き]り裂[さ]きの者[もの]どもに気[き]をつけよ。"
  3: "というのは、わたしたちこそ割礼[かつれい]の者[もの]だからである。わたしたちは神[かみ]の霊[れい]によって礼拝[れいはい]し、キリスト・イエスを誇[ほこ]りとし、肉[にく]に頼[たの]らない。"
  4: "もっとも、わたし自身[じしん]は肉[にく]にも頼[たの]みとするところがある。もしほかのだれかが肉[にく]に頼[たの]めると思[おも]うなら、わたしはなおさらである。"
  5: "わたしは八日目[ようかめ]に割礼[かつれい]を受[う]け、イスラエルの民[たみ]の出[で]であり、ベニヤミンの支族[しぞく]に属[ぞく]し、ヘブライ人[じん]の中[なか]のヘブライ人[じん]であり、律法[りっぽう]についてはファリサイ人[じん]であり、"
  6: "熱心[ねっしん]の点[てん]では教会[きょうかい]を迫害[はくがい]し、律法[りっぽう]による義[ぎ]の点[てん]では、非[ひ]のうちどころがなかった。"
  7: "しかし、わたしにとって益[えき]であったそれらのものも、わたしはキリストのために損[そん]であると思[おも]うようになった。"
  8: "いや、それどころか、わたしは、わたしの主[しゅ]キリスト・イエスを知[し]ることが何[なに]にもまさっているゆえに、すべてのものを損[そん]と思[おも]っている。わたしはキリストのためにすべてを失[うしな]い、すべてを塵芥[ちりあくた]と思[おも]っている。キリストを得[え]るためである。"
  9: "そして、キリストのうちにいる者[もの]として見[み]いだされ、律法[りっぽう]から出[で]る自分[じぶん]の義[ぎ]ではなく、キリストへの信仰[しんこう]による義[ぎ]、すなわち、信仰[しんこう]に基[もと]づいて神[かみ]から与[あた]えられる義[ぎ]を持[も]つためである。"
  10: "キリストを知[し]り、その復活[ふっかつ]の力[ちから]を知[し]り、その苦[くる]しみにあずかり、その死[し]と同[おな]じ姿[すがた]となるためである。"
  11: "どうにかして、死者[ししゃ]の中[なか]からの復活[ふっかつ]に達[たっ]したい。"
  12: "わたしは、すでに手[て]に入[い]れたのでも、すでに完全[かんぜん]な者[もの]になったのでもない。ただ、キリスト・イエスがわたしを捕[と]らえた、その目標[もくひょう]を捕[と]らえようとして、追[お]い求[もと]めているのである。"
  13: "兄弟[きょうだい]たち、わたしは、自分[じぶん]がすでに捕[と]らえたとは思[おも]っていない。ただ一[ひと]つのこと、すなわち、後[うし]ろのものを忘[わす]れ、前[まえ]にあるものに手[て]を伸[の]ばし、"
  14: "キリスト・イエスにあって神[かみ]が上[うえ]から召[め]してくださった賞[しょう]の目標[もくひょう]へ向[む]かって、追[お]い求[もと]めている。"
  15: "それゆえ、わたしたちのうち、完全[かんぜん]な者[もの]はこのように思[おも]うべきである。もしあなたがたがこれと違[ちが]う思[おも]いを抱[いだ]いているなら、神[かみ]はそのこともあなたがたに示[しめ]してくださる。"
  16: "ただ、わたしたちがすでに達[たっ]しているところまでは、同[おな]じ歩[あゆ]みを続[つづ]け、〔同[おな]じ思[おも]いを抱[いだ]こう〕。"
  17: "兄弟[きょうだい]たち、わたしに倣[なら]う者[もの]となりなさい。また、わたしたちを模範[もはん]として歩[あゆ]んでいる者[もの]たちに目[め]を留[と]めなさい。"
  18: "というのは、多[おお]くの者[もの]が、わたしが何度[なんど]もあなたがたに言[い]ってきたように、今[いま]また涙[なみだ]ながらに言[い]うのだが、キリストの十字架[じゅうじか]の敵[てき]として歩[あゆ]んでいるからである。"
  19: "彼[かれ]らの終[お]わりは滅[ほろ]びであり、彼[かれ]らの神[かみ]は腹[はら]であり、彼[かれ]らの誇[ほこ]りは恥[はじ]のうちにあり、彼[かれ]らは地上[ちじょう]のことを思[おも]っている。"
  20: "というのは、わたしたちの国籍[こくせき]は天[てん]にあるからである。そこから、救[すく]い主[ぬし]、すなわち主[しゅ]イエス・キリストが来[こ]られるのを待[ま]ち望[のぞ]んでいる。"
  21: "この方[かた]は、すべてのものを御自分[ごじぶん]に服従[ふくじゅう]させることのできる働[はたら]きによって、わたしたちの卑[いや]しい体[からだ]を、ご自分[じぶん]の栄光[えいこう]の体[からだ]と同[おな]じ形[かたち]に変[か]えてくださる。"

notes:
  1: "Τὸ λοιπόν — 最後に. χαίρετε ἐν κυρίῳ — 主にあって喜びなさい. τὰ αὐτὰ γράφειν — 同じことを書く. ὀκνηρόν — 煩わしい. ἀσφαλές — 安全."
  2: "κύνας — 犬ども (бранное слово у иудеев). κακοὺς ἐργάτας — 悪い働き手ども. κατατομή — «обрезание, отрезание»; 切り裂きの者 (игра слов с περιτομή, ср. 3:3; у jp-joc 割). Слово 割礼 уже в корпусе, сноски нет."
  3: "ἡμεῖς γάρ ἐσμεν ἡ περιτομή — というのは、わたしたちこそ割礼の者だからである. πνεύματι θεοῦ λατρεύοντες — 神の霊によって礼拝し. καυχώμενοι ἐν Χριστῷ Ἰησοῦ — キリスト・イエスを誇りとし. οὐκ ἐν σαρκὶ πεποιθότες — 肉に頼らない."
  4: "καίπερ ἐγὼ ἔχων πεποίθησιν καὶ ἐν σαρκί — もっとも、わたし自身は肉にも頼みとするところがある. εἰ…ἄλλος…ἐγὼ μᾶλλον — ほかのだれか…なら、わたしはなおさら."
  5: "ὀκταήμερος — 八日目に割礼を受け. φυλῆς Βενιαμείν — ベニヤミンの支族. Ἑβραῖος ἐξ Ἑβραίων — ヘブライ人の中のヘブライ人. κατὰ νόμον Φαρισαῖος — 律法についてはファリサイ人."
  6: "κατὰ ζῆλος — 熱心の点では. διώκων τὴν ἐκκλησίαν — 教会を迫害し. κατὰ δικαιοσύνην τὴν ἐν νόμῳ — 律法による義の点では. ἄμεμπτος — 非のうちどころがない."
  7: "[ἀλλὰ] в базе в квадратных скобках — слово есть, 〔〕 не ставятся. ἅτινα ἦν μοι κέρδη — 益であったそれらのもの. ζημία — 損."
  8: "μενοῦνγε — いや、それどころか. ὑπερέχον τῆς γνώσεως — превосходство знания; 知ることが何にもまさっている. ἐζημιώθην — 失った. σκύβαλα — 塵芥 («сор, отбросы»). ἵνα Χριστὸν κερδήσω — キリストを得るため."
  9: "εὑρεθῶ ἐν αὐτῷ — キリストのうちにいる者として見いだされ. ἐμὴν δικαιοσύνην τὴν ἐκ νόμου — 律法から出る自分の義. διὰ πίστεως Χριστοῦ — キリストへの信仰による. ἐπὶ τῇ πίστει — 信仰に基づいて."
  10: "τοῦ γνῶναι αὐτόν — キリストを知り. δύναμις τῆς ἀναστάσεως — 復活の力. κοινωνία παθημάτων — 苦しみにあずかること. συμμορφιζόμενος τῷ θανάτῳ — 死と同じ姿となる."
  11: "εἴ πως — どうにかして. ἐξανάστασις ἡ ἐκ νεκρῶν — 死者の中からの復活."
  12: "Οὐχ ὅτι — …のではない. ἤδη ἔλαβον ἢ τετελείωμαι — すでに手に入れたのでも、完全な者になったのでも. διώκω — 追い求めている. ἐφ᾽ ᾧ — «для чего»; цель — Христос. κατελήμφθην — 捕らえられた."
  13: "ἐγὼ ἐμαυτὸν οὐ λογίζομαι κατειληφέναι — 自分がすでに捕らえたとは思っていない. ἓν δέ — ただ一つのこと. ἐπιλανθανόμενος…ἐπεκτεινόμενος — 忘れ…手を伸ばし."
  14: "κατὰ σκοπὸν διώκω — 目標へ向かって追い求めている. βραβεῖον — 賞. ἄνω κλῆσις — 上からの召し."
  15: "ὅσοι οὖν τέλειοι — それゆえ、完全な者は. τοῦτο φρονῶμεν — このように思うべきである. ἀποκαλύψει — 示してくださる."
  16: "πλὴν εἰς ὃ ἐφθάσαμεν — ただ、すでに達しているところまでは. τῷ αὐτῷ στοιχεῖν — 同じ歩みを続ける. В базе нет τὸ αὐτὸ φρονεῖν; церковный текст (jp-joc 「之を思い」, Синодальный «так и должны мыслить») добавляет — 〔同じ思いを抱こう〕. κανόνι («правило», у jp-joc 「規」) передан словом 歩み, отдельно не добавлен. Проверено по базе: φρονεῖν в ст. 16 — 0."
  17: "συμμιμηταί μου γίνεσθε — わたしに倣う者となりなさい. τύπον — 模範."
  18: "πολλοὶ γάρ — というのは、多くの者が…からである. κλαίων — 涙ながらに. ἐχθροὺς τοῦ σταυροῦ τοῦ Χριστοῦ — キリストの十字架の敵."
  19: "τὸ τέλος ἀπώλεια — 終わりは滅び. ὁ θεὸς ἡ κοιλία — 神は腹. δόξα ἐν τῇ αἰσχύνῃ — 誇りは恥のうちに. τὰ ἐπίγεια φρονοῦντες — 地上のことを思っている."
  20: "πολίτευμα ἐν οὐρανοῖς — 国籍は天にある. ἀπεκδεχόμεθα — 待ち望んでいる. σωτῆρα — 救い主."
  21: "μετασχηματίσει — 変えてくださる. σῶμα τῆς ταπεινώσεως — 卑しい体. σύμμορφον τῷ σώματι τῆς δόξης — 栄光の体と同じ形. κατὰ τὴν ἐνέργειαν τοῦ δύνασθαι — できる働きによって. ὑποτάξαι τὰ πάντα — すべてを服従させる."
