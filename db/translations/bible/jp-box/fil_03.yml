# jp-box, Послание к Филиппийцам, глава 3. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 3: «радуйтесь» и предостережение от лжеучителей (1–3), прежние преимущества
# Павла (4–6), всё — тщета ради Христа (7–11), «не достиг, но стремлюсь» (12–16),
# подражание и граждане неба (17–21).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет, <j>/<mo> не ставятся.
# 〔…〕 одно: 3:16 — церковное τὸ αὐτὸ φρονεῖν (в базе gr-lxx-byz нет, проверено: φρονεῖν — 0);
# πλὴν εἰς ὃ ἐφθάσαμεν в 3:16 передано «同じ歩みを続け» (τῷ αὐτῷ στοιχεῖν), добавка «同じ思いを抱く» — в 〔…〕.
# Цитат Писания в главе нет. Сносок ⟨…⟩ нет: 犬 и 割礼 уже встречались в корпусе. jp-ni не использовался.

