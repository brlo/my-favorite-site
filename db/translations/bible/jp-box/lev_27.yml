verses:
  1: "主[しゅ]はモーセに言[い]われた。"
  2: "「イスラエルの子[こ]らに語[かた]って言[い]いなさい。だれかが、自分[じぶん]の命[いのち]の評価[ひょうか]を主[しゅ]に献[ささ]げる誓願[せいがん]を立[た]てるなら、その評価はこうである。"
  3: "二十歳[はたち]から六十歳[ろくじゅうさい]までの男[おとこ]の評価[ひょうか]は、聖[せい]なる重[おも]さで銀[ぎん]五十[ごじゅう]シケルとする。"
  4: "女[おんな]の場合は、その評価[ひょうか]は三十[さんじゅう]シケルとする。"
  5: "五歳[ごさい]から二十歳[はたち]までなら、男[おとこ]の評価[ひょうか]は二十[にじゅう]シケル、女[おんな]は十[じゅう]シケルとする。"
  6: "一[いっ]か月[げつ]から五歳[ごさい]までなら、男[おとこ]の評価[ひょうか]は銀[ぎん]五[ご]シケル、女[おんな]は三[さん]シケルとする。"
  7: "六十歳[ろくじゅうさい]以上[いじょう]なら、男[おとこ]は銀[ぎん]十五[じゅうご]シケル、女[おんな]は十[じゅう]シケルとする。"
  8: "もしその人[ひと]が貧[まず]しくて、その評価[ひょうか]に及[およ]ばないなら、その人を祭司[さいし]の前[まえ]に立[た]たせなさい。祭司はその人を評価する。誓願[せいがん]を立てた者[もの]の手[て]の届[とど]くところに応[おう]じて、祭司はその人を評価する。"
  9: "もし、主[しゅ]に捧[ささ]げ物[もの]として献[ささ]げられる家畜[かちく]のうちのものであるなら、その中[なか]からだれかが主に与[あた]えるものは聖[せい]なるものとなる。"
  10: "それは良[よ]いものを悪[わる]いものと、悪いものを良いものと取[と]り替[か]えてはならない。もし家畜[かちく]を家畜と取り替えるなら、それもその取り替えも聖[せい]なるものとなる。"
  11: "もしそれが汚[けが]れた家畜[かちく]、すなわちその中から主[しゅ]に捧[ささ]げ物[もの]として献[ささ]げることのない家畜であるなら、その家畜を祭司[さいし]の前[まえ]に立[た]たせなさい。"
  12: "祭司[さいし]はそれが良[よ]いか悪[わる]いかを評価[ひょうか]する。祭司が評価したとおりに定[さだ]まる。"
  13: "もしその人[ひと]がそれを買[か]い戻[もど]すなら、その評価[ひょうか]に五分[ごぶ]の一[いち]を加[くわ]えなければならない。"
  14: "人[ひと]が自分[じぶん]の家[いえ]を主[しゅ]に聖[せい]なるものとして聖別[せいべつ]するなら、祭司[さいし]はそれが良いか悪いかを評価[ひょうか]する。祭司が評価したとおりに定[さだ]まる。"
  15: "もしそれを聖別[せいべつ]した者[もの]が自分[じぶん]の家[いえ]を買[か]い戻[もど]すなら、その評価[ひょうか]の銀[ぎん]に五分[ごぶ]の一[いち]を加[くわ]える。そうすればその家は彼[かれ]のものとなる。"
  16: "もし人[ひと]が自分[じぶん]の所有地[しょゆうち]の畑[はたけ]のうちから主[しゅ]に聖別[せいべつ]するなら、その評価[ひょうか]はその種[たね]まきに応[おう]じ、大麦[おおむぎ]一[いっ]コルにつき銀[ぎん]五十[ごじゅう]シケルとする。"
  17: "もしヨベルの年[とし]からその畑[はたけ]を聖別[せいべつ]するなら、その評価[ひょうか]のとおりに定[さだ]まる。"
  18: "もしヨベルの年[とし]の後[あと]、遅[おそ]くなってその畑[はたけ]を聖別[せいべつ]するなら、祭司[さいし]はヨベルの年までの残[のこ]りの年数[ねんすう]に応[おう]じて銀[ぎん]を計算[けいさん]し、その評価[ひょうか]から差[さ]し引[ひ]く。"
  19: "もしそれを聖別[せいべつ]した者[もの]がその畑[はたけ]を買[か]い戻[もど]すなら、その評価[ひょうか]の銀[ぎん]に五分[ごぶ]の一[いち]を加[くわ]える。そうすればその畑は彼[かれ]のものとなる。"
  20: "もしその畑[はたけ]を買[か]い戻[もど]さず、それをほかの人[ひと]に売[う]るなら、もはやそれを買い戻すことはできない。"
  21: "その畑[はたけ]は、ヨベルの年[とし]が過[す]ぎると、主[しゅ]に聖[せい]なるもの、すなわち聖別[せいべつ]されて取[と]り分[わ]けられた地[ち]のようになり、祭司[さいし]の所有[しょゆう]となる。"
  22: "もし人[ひと]が、自分[じぶん]が買[か]い取[と]った畑[はたけ]、すなわち自分の所有地[しょゆうち]の畑のうちのものではない畑を主[しゅ]に聖別[せいべつ]するなら、"
  23: "祭司[さいし]はヨベルの年[とし]までの評価[ひょうか]の額[がく]を計算[けいさん]し、その日[ひ]にその額を主[しゅ]への聖[せい]なるものとして納[おさ]める。"
  24: "ヨベルの年[とし]には、その畑[はたけ]は、それを買[か]った人[ひと]、すなわちその土地[とち]の所有[しょゆう]がもともとあった人に返[かえ]される。"
  25: "すべての評価[ひょうか]は聖[せい]なる重[おも]さによる。一[いっ]シケルは二十[にじゅう]オボロスである。"
  26: "あなたの家畜[かちく]のうちで最初[さいしょ]に生[う]まれたものは、すべて主[しゅ]のものであり、だれもそれを聖別[せいべつ]することはできない。それが子牛[こうし]であれ羊[ひつじ]であれ、主のものである。"
  27: "もしそれが汚[けが]れた四足[よつあし]の獣[けもの]のものであるなら、その評価[ひょうか]に従[したが]って取[と]り替[か]え、その上[うえ]に五分[ごぶ]の一[いち]を加[くわ]える。そうすればそれは彼[かれ]のものとなる。もし買[か]い戻[もど]さないなら、その評価に従って売[う]り渡[わた]される。"
  28: "しかし、人[ひと]が自分[じぶん]のすべてのものの中[なか]から主[しゅ]に聖絶[せいぜつ]として捧[ささ]げるものは、人から家畜[かちく]に至[いた]るまで、また自分の所有地[しょゆうち]の畑[はたけ]からであっても、売[う]ることも買[か]い戻[もど]すこともできない。すべて聖絶されたものは、主にとって最[もっと]も聖[せい]なるものである。"
  29: "人[ひと]のうちから聖絶[せいぜつ]として捧[ささ]げられた者[もの]は、だれも買[か]い戻[もど]すことができない。その者は必[かなら]ず死[し]に処[しょ]せられる。"
  30: "地[ち]のすべての十分の一[じゅうぶんのいち]は、地の種[たね]からであれ、木[き]の実[み]からであれ、主[しゅ]のものであり、主に聖[せい]なるものである。"
  31: "もし人[ひと]が、贖[あがな]い金[きん]を払[はら]って自分[じぶん]の十分の一[じゅうぶんのいち]を買[か]い戻[もど]すなら、それに五分[ごぶ]の一[いち]を加[くわ]えなければならない。そうすればそれは彼[かれ]のものとなる。"
  32: "牛[うし]と羊[ひつじ]の十分の一[じゅうぶんのいち]は、すべて杖[つえ]の下[した]を数[かぞ]えられて通[とお]るものの十番目[じゅうばんめ]が、主[しゅ]に聖[せい]なるものとなる。"
  33: "良[よ]いものを悪[わる]いものと取[と]り替[か]えてはならない。もしそれを取り替えるなら、それもその取り替えも聖[せい]なるものとなり、買[か]い戻[もど]されることはない。」"
  34: "これらは、主[しゅ]がシナイの山[やま]で、イスラエルの子[こ]らに向[む]けてモーセに命[めい]じられた戒[いまし]めである。"

notes:
  1: "καὶ ἐλάλησεν κύριος πρὸς Μωυσῆν λέγων — обычная формула введения речи; λέγων отдельно по-японски не передаётся (ср. Исх 25:1; 31:1)."
  2: "εὔξηται εὐχήν — «даст обет» (εὐχή — обет; в корпусе 誓願, ср. Деян 18:18). ὥστε τιμὴν τῆς ψυχῆς αὐτοῦ τῷ κυρίῳ — «по оценке души своей Господу»: обет посвятить человека по его оценке. τιμή — 評価 (цена)."
  3: "δίδραχμον — дидрахма, двойная драхма (в масоретском тексте здесь шекель, отсюда シケル, как Исх 30:13). σταθμῷ τῷ ἁγίῳ — по священному весу. ἀπὸ εἰκοσαετοῦς ἕως ἑξηκονταετοῦς — от двадцатилетнего до шестидесятилетнего."
  4: "τῆς δὲ θηλείας … ἡ συντίμησις — «женщины же оценка» (συντίμησις от συντιμάω — расценивать). Серебро (ἀργύριον) здесь не названо, как и в ст. 5, — в отличие от ст. 3, 6, 7."
  5: "ἀπὸ πενταετοῦς ἕως εἴκοσι ἐτῶν — от пятилетнего до двадцати лет. ἄρσεν/θῆλυς — мужского/женского пола; в переводе 男/女."
  6: "ἀπὸ μηνιαίου ἕως πενταετοῦς — от месячного до пятилетнего (μηνιαῖος). ἀργύριον названо только при мужском поле, как в греческом."
  7: "ἀπὸ ἑξηκονταετῶν καὶ ἐπάνω — от шестидесяти лет и выше. ἐὰν μὲν ἄρσεν ᾖ … ἐὰν δὲ θήλεια — «если мужского пола… если женского»."
  8: "ταπεινὸς ᾖ τῇ τιμῇ — «низок по оценке», т. е. беден и не может заплатить (ταπεινός — низкий; слав. «убог ценою своею»). καθάπερ ἰσχύει ἡ χεὶρ τοῦ εὐξαμένου — «насколько достаёт рука давшего обет» (ἰσχύω — быть в силах; χείρ — здесь достаток)."
  9: "ἀπὸ τῶν κτηνῶν τῶν προσφερομένων … δῶρον τῷ κυρίῳ — из скота, приносимого в дар Господу. ὃς ἂν δῷ ἀπὸ τούτων … ἔσται ἅγιον — «что кто даст из этого, будет свято»."
  10: "οὐκ ἀλλάξει … καλὸν πονηρῷ οὐδὲ πονηρὸν καλῷ — «не заменит хорошее плохим и плохое хорошим». ἀλλάσσων ἀλλάξῃ — усилительная конструкция (причастие + глагол). ἄλλαγμα — замена (取り替え)."
  11: "πᾶν κτῆνος ἀκάθαρτον — всякий скот нечистый. ἀφ᾽ ὧν οὐ προσφέρεται … δῶρον — «из тех, из которых не приносится дар»; относительное зависит от ἀκάθαρτον."
  12: "ἀνὰ μέσον καλοῦ καὶ ἀνὰ μέσον πονηροῦ — «между хорошим и между плохим», т. е. оценит, хорош он или плох. οὕτως στήσεται — «так и состоится» (ἵστημι — устанавливать, считать действительным)."
  13: "λυτρούμενος λυτρώσηται — «выкупая выкупит». λυτρόω — выкупать, возвращать себе; передано 買い戻す, как в гл. 25 (λυτρώσει — 買い戻す), чтобы не смешивать с ἐξιλάσκομαι — 贖う. ἐπίπεμπτον — добавочная пятая часть; в корпусе 五分の一 (ср. Быт 47:24). Так же в ст. 15, 19, 27, 31."
  14: "ἁγιάσῃ τὴν οἰκίαν αὐτοῦ ἁγίαν τῷ κυρίῳ — «освятит дом свой святым Господу» (двойной винительный). ἁγιάζω — 聖別する."
  15: "ὁ ἁγιάσας — освятивший. λυτρῶται — выкупает (λυτρόω). προσθήσει ἐπ᾽ αὐτὸ τὸ ἐπίπεμπτον τοῦ ἀργυρίου τῆς τιμῆς — «прибавит к нему пятую часть серебра оценки»."
  16: "ἀγρὸς τῆς κατασχέσεως αὐτοῦ — поле владения его (κατάσχεσις — владение, имение; 所有地). κατὰ τὸν σπόρον αὐτοῦ — по посеву его. κόρους κριθῶν — коры ячменя (κόρος — мера сыпучего, «хомер», ок. 220 л); πεντήκοντα δίδραχμα — пятьдесят дидрахм."
  17: "ἀπὸ τοῦ ἐνιαυτοῦ τῆς ἀφέσεως — «от года отпущения», т. е. от юбилея (ἄφεσις; ср. 25:10, ヨベルの年). κατὰ τὴν τιμὴν αὐτοῦ στήσεται — «по оценке его состоится»."
  18: "ἔσχατον μετὰ τὴν ἄφεσιν — «в конце, после отпущения», т. е. много позже юбилея. προσλογιεῖται — причтит, рассчитает (προσλογίζομαι). ἀνθυφαιρεθήσεται — будет вычтено (ἀνθυφαιρέω; слав. «отимется»)."
  19: "λυτρῶται τὸν ἀγρόν — выкупает поле. προσθήσει τὸ ἐπίπεμπτον τοῦ ἀργυρίου πρὸς τὴν τιμήν — прибавит пятую часть серебра к оценке."
  20: "μὴ λυτρῶται … καὶ ἀποδῶται — «не выкупит… и продаст». οὐκέτι μὴ λυτρώσηται — «уже не выкупит» (οὐ μή с аористом — сильное отрицание)."
  21: "ἐξεληλυθυίας τῆς ἀφέσεως — «когда пройдёт отпущение» (родительный абсолютный, perfect). ὥσπερ ἡ γῆ ἡ ἀφωρισμένη — «как земля отделённая, отлучённая» (ἀφορίζω — отделять, посвящать; слав. «якоже земля отлученая», Синодальный «как поле заклятое»). τῷ ἱερεῖ ἔσται κατάσχεσις — «священнику будет во владение»."
  22: "ἀγρὸς οὗ κέκτηται — поле, которое он приобрёл (κτάομαι). ὃς οὐκ ἔστιν ἀπὸ τοῦ ἀγροῦ τῆς κατασχέσεως αὐτοῦ — которое не из поля владения его: купленное поле возвращается в юбилей (ст. 24)."
  23: "λογιεῖται … τὸ τέλος τῆς τιμῆς — «исчислит… остаток, итог оценки» (τέλος — конец, итог; слав. «останок цены»). ἐκ τοῦ ἐνιαυτοῦ τῆς ἀφέσεως — от года отпущения. ἀποδώσει … ἐν τῇ ἡμέρᾳ ἐκείνῃ — отдаст в тот день."
  24: "ἐν τῷ ἐνιαυτῷ τῆς ἀφέσεως ἀποδοθήσεται — в год отпущения будет возвращено. παρ᾽ οὗ κέκτηται αὐτόν — у кого куплено. οὗ ἦν ἡ κατάσχεσις τῆς γῆς — чьё было владение земли."
  25: "σταθμίοις ἁγίοις — священными весами (σταθμίον). εἴκοσι ὀβολοὶ ἔσται τὸ δίδραχμον — «двадцать оболов — дидрахма» (ὀβολός — обол); по масоретскому счёту это 20 гер в сикле, отсюда 一シケルは二十オボロス (так же Исх 30:13)."
  26: "πρωτότοκον — первенец. οὐ καθαγιάσει οὐθεὶς αὐτό — «никто не посвятит его» (καθαγιάζω — посвящать). ἐάν τε μόσχον ἐάν τε πρόβατον — «будь то телёнок или овца»."
  27: "τῶν τετραπόδων τῶν ἀκαθάρτων — «из четвероногих нечистых». ἀλλάξει κατὰ τὴν τιμὴν αὐτοῦ — «заменит по оценке его»: так в byz и в слав. («да пременит»); Синодальный переводит «выкупить», и ниже в том же стихе стоит λυτρῶται («если не выкупается»). Буквальное чтение byz сохранено, разночтение отмечено здесь. πραθήσεται κατὰ τὸ τίμημα — будет продано по оценке."
  28: "ἀνάθεμα — «заклятое, преданное» (ἀνατίθημι — полагать, посвящать без возврата); слав. «обет», Синодальный «заклятое». В переводе 聖絶 (herem — посвящённое Богу без права выкупа). ἅγιον ἁγίων — 最も聖なるもの (ср. 2:3). οὐκ ἀποδώσεται οὐδὲ λυτρώσεται — не продастся и не выкупится."
  29: "ἀνατεθῇ ἀπὸ τῶν ἀνθρώπων — «будет посвящено из людей». θανάτῳ θανατωθήσεται — «смертью умрёт» (гебраизм: усилительный инфинитив), 必ず死に処せられる."
  30: "δεκάτη — десятина (十分の一). ἀπὸ τοῦ σπέρματος τῆς γῆς — от семени земли. καρποῦ τοῦ ξυλίνου — плода древесного (ξύλινος — деревянный; слав. «от плода древянаго»)."
  31: "λυτρῶται λύτρῳ — «выкупает выкупом» (λύτρον — выкуп, 贖い金, как в 25:51–52; датив средства). τὸ ἐπίπεμπτον προσθήσει — прибавит пятую часть. καὶ ἔσται αὐτῷ — и будет ему."
  32: "δεκάτη βοῶν καὶ προβάτων — десятина волов и овец. ὃ ἐὰν ἔλθῃ ἐν τῷ ἀριθμῷ ὑπὸ τὴν ῥάβδον — «что пройдёт по счёту под жезлом» (ῥάβδος — жезл, которым отсчитывали скот); τὸ δέκατον — десятое."
  33: "οὐκ ἀλλάξεις καλὸν πονηρῷ — «не заменишь хорошее плохим»; в csl-ru добавлено «ниже добрым злаго» — в греческом нет (ср. ст. 10). ἄλλαγμα — замена. οὐ λυτρωθήσεται — не будет выкуплено."
  34: "Αὗταί εἰσιν αἱ ἐντολαί — «вот заповеди» (ἐντολή — 戒め). ἐνετείλατο κύριος τῷ Μωυσῇ πρὸς τοὺς υἱοὺς Ισραηλ — «заповедал Господь Моисею к сынам Израилевым». ἐν τῷ ὄρει Σινα — на горе Синае; ср. 26:46, где формула иная (κρίματα, προστάγματα, νόμος)."
