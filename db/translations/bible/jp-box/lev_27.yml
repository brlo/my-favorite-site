# jp-box, Левит, глава 27. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в Левите отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 27: обеты и выкуп — оценка людей (1–8), скота (9–13), домов (14–15),
# полей (16–25), первенцев (26–27), заклятого (28–29), десятины (30–33),
# заключительная формула (34).
# Речь Бога — 「…」 (2–33); ст. 1 и 34 — повествование.
# Красного и синего нет. 〔…〕 нет: все слова есть в gr-lxx-byz (проверено по базе).
# Сносок ⟨…⟩ нет: シケル уже пояснён при первом упоминании (Исх 30:13), сноска не дублируется;
# 祭司, 誓願, 聖別, 十分の一 — в корпусе.
# Деньги: LXX δίδραχμον передано シケル (в масоретском тексте здесь шекель; так же
# передано τὸ δίδραχμον в Исх 30:13). 27:25 — «одна дидрахма = двадцать оболов».
# λυτρόω — 買い戻す (как в гл. 25), λύτρον — 贖い金 (как 25:51–52); ἐξιλάσκομαι — 贖う, чтобы не смешивать.
# ἁγιάζω — 聖別する (как в гл. 8, 16, 20–22).
# jp-ni не использовался.

