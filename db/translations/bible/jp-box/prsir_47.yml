verses:
  1: "そして、この人[ひと]の後[あと]にナタンが立[た]ち、ダビデの日々[ひび]に預言[よげん]した。"
  2: "平和[へいわ]のいけにえから取[と]り分[わ]けられた脂肪[しぼう]のように、ダビデはイスラエルの子[こ]らから取り分けられた。"
  3: "彼は獅子[しし]の間[あいだ]で子[こ]やぎのように、熊[くま]の間[あいだ]で羊[ひつじ]の子[こ]のように遊[あそ]んだ。"
  4: "彼は若[わか]いころ、巨人[きょじん]を殺[ころ]して民[たみ]からそしりを取[と]り除[のぞ]いたではないか。"
  5: "石[いし]を放[はな]つ手[て]を上[あ]げ、ゴリアトの高[たか]ぶりを打[う]ち倒[たお]したとき。"
  6: "彼は主[しゅ]、いと高[たか]き者[もの]を呼[よ]び求[もと]めた。すると主は彼の右[みぎ]の手[て]に力[ちから]を与[あた]え、戦[いくさ]に強[つよ]い者[もの]を除[のぞ]き去[さ]らせ、ご自分[じぶん]の民[たみ]の角[つの]を高[たか]く挙[あ]げさせた。"
  7: "彼に栄光[えいこう]の冠[かんむり]がもたらされたとき、こうして幾万[いくまん]もの者[もの]が彼をほめたたえ、主[しゅ]の祝福[しゅくふく]の中[なか]で彼を賛美[さんび]した。"
  8: "彼は周[まわ]りの敵[てき]を砕[くだ]き、立[た]ち向[む]かう者[もの]であるペリシテ人[じん]を無[む]に帰[き]した。彼らの角[つの]を今日[きょう]に至[いた]るまで砕いたのである。"
  9: "彼はすべてのわざにおいて、聖[せい]なるいと高[たか]き者[もの]に栄光[えいこう]の言葉[ことば]をもって告白[こくはく]をささげた。"
  10: "心[こころ]のすべてをもって歌[うた]い、自分[じぶん]を造[つく]った方[かた]を愛[あい]した。"
  11: "彼は歌[うた]い手[て]たちを祭壇[さいだん]の前[まえ]に立[た]て、その響[ひび]きによって歌[うた]を甘[あま]くした。"
  12: "祝[いわ]いの日に美[うつく]しさを与[あた]え、終[お]わりまで季節[きせつ]を整[ととの]えた。彼らが主[しゅ]の聖[せい]なる名[な]をほめたたえ、朝早[あさはや]くから聖所[せいしょ]に響[ひび]きを上[あ]げるために。"
  13: "主[しゅ]は彼の罪[つみ]を取[と]り除[のぞ]き、その角[つの]を永遠[えいえん]に高[たか]く挙[あ]げ、王[おう]たちの契約[けいやく]と栄光[えいこう]の王座[おうざ]をイスラエルにおいて彼に与[あた]えた。"
  14: "この人[ひと]の後[あと]に、知恵[ちえ]ある子[こ]が立[た]った。そのゆえに彼は広[ひろ]い所[ところ]に落[お]ち着[つ]いた。"
  15: "ソロモンは平和[へいわ]の日々[ひび]に王[おう]となった。神[かみ]が四方[しほう]に安[やす]らぎを与[あた]え、彼が主[しゅ]の名[な]によって家[いえ]を建[た]て、聖所[せいしょ]を永遠[えいえん]に備[そな]えるためであった。"
  16: "あなたは若[わか]いころ、なんと知恵[ちえ]に満[み]ちていたことか。川[かわ]のように悟[さと]りに満ちあふれていた。"
  17: "あなたの魂[たましい]は地[ち]を覆[おお]い、あなたはなぞめいたたとえでそれを満[み]たした。"
  18: "あなたの名[な]は遠[とお]くの島々[しまじま]にまで届[とど]き、あなたはその平和[へいわ]のゆえに愛[あい]された。"
  19: "歌[うた]と格言[かくげん]とたとえと解[と]き明[あ]かしによって、国々[くにぐに]はあなたに驚[おどろ]いた。"
  20: "イスラエルの神[かみ]と呼[よ]ばれる主[しゅ]の名[な]によって、"
  21: "あなたは金[きん]を銅[どう]のように集[あつ]め、銀[ぎん]を鉛[なまり]のように増[ふ]やした。"
  22: "あなたは腰[こし]を女[おんな]たちに傾[かたむ]け、自分[じぶん]の体[からだ]において支配[しはい]されるままになった。"
  23: "あなたは自分[じぶん]の栄光[えいこう]に傷[きず]を与[あた]え、自分の子孫[しそん]を汚[けが]した。それによって、あなたの子[こ]らに怒[いか]りを招[まね]き、あなたの愚[おろ]かさのゆえに彼らが嘆[なげ]き悲[かな]しむことになった。こうして支配[しはい]は二[ふた]つに分[わ]かれ、エフライムから不従順[ふじゅうじゅん]な王国[おうこく]が始[はじ]まった。"
  24: "しかし主[しゅ]はご自分[じぶん]のあわれみを捨[す]て去[さ]らず、その言葉[ことば]のうちから何[なに]一つ滅[ほろ]ぼさない。ご自分の選[えら]ばれた者[もの]の子孫[ししそん]を消[け]し去[さ]らず、ご自分を愛[あい]した者の種[たね]を断[た]ち切[き]らない。"
  25: "主はヤコブに残[のこ]り者[もの]を与[あた]え、ダビデにはその者[もの]から出[で]る根[ね]を与えた。"
  26: "ソロモンは父[ちち]たちとともに眠[ねむ]り、"
  27: "その後[あと]に、自分[じぶん]の子孫[しそん]から、民[たみ]の愚[おろ]かさと、"
  28: "悟[さと]りに劣[おと]るレハブアムを残[のこ]した。彼はその議[はか]りごとによって民を離[はな]れさせた。"
  29: "また、ナバトの子[こ]ヤロブアム。彼はイスラエルを罪[つみ]に導[みちび]き、エフライムに罪の道[みち]を与[あた]えた。"
  30: "彼らの罪は、彼らを自分[じぶん]たちの地[ち]から離[はな]れさせるほどに、甚[はなは]だしく増[ふ]え広[ひろ]がった。"
  31: "そして、彼らはあらゆる悪[あく]を求[もと]め続[つづ]け、ついに報[むく]いが彼らの上[うえ]に来[き]た。"

notes:
  1: "Καὶ μετὰ τοῦτον ἀνέστη Ναθαν προφητεύειν — «и после него восстал Нафан, чтобы пророчествовать» (μετὰ τοῦτον — после Самуила, ср. 46:20; ἀνίστημι — восставать). Слав. «по сем воста нафан пророчествовати во дни давидовы». Похвала отцам продолжается с 46:1; это авторский текст, без кавычек."
  2: "ὥσπερ στέαρ ἀφωρισμένον ἀπὸ σωτηρίου — «как тук, отделённый от жертвы мирной» (στέαρ — тук, жир; σωτήριον — жертва спасения, мирная; ἀφορίζω — отделять). Слав. «якоже тук отлучен от жертвы мирныя». Сравнение: Давид выделен из сынов Израиля, как лучшая часть жертвы."
  3: "ἐν λέουσιν ἔπαιξεν ὡς ἐν ἐρίφοις — «среди львов играл, как с козлятами» (παίζω — играть; ἔριφος — козлёнок; ἄρκος — медведь; ἀρήν, дат. мн. ἀρνάσι — агнец). Слав. «со львы играше яко с козлищи и с медведми яко со агнцы овчими». Опасное для пастуха стало для Давида игрой."
  4: "ἐν νεότητι αὐτοῦ οὐχὶ ἀπέκτεινεν γίγαντα — «в юности своей не убил ли он исполина» (γίγας — гигант; риторический вопрос с οὐχί). ἐξῆρεν ὀνειδισμὸν ἐκ λαοῦ — «снял поношение с народа» (ὄνειδος — поношение; ἐξαίρω — изымать)."
  5: "ἐν τῷ ἐπᾶραι χεῖρα ἐν λίθῳ σφενδόνης — «когда поднял руку с камнем пращи» (σφενδόνη — праща). καταβαλεῖν γαυρίαμα τοῦ Γολιαθ — «низложить гордыню Голиафа» (γαυρίαμα — похвальба, гордыня)."
  6: "ἐπεκαλέσατο γὰρ κύριον τὸν ὕψιστον — «ибо он призвал Господа Всевышнего» (ἐπικαλέομαι — призывать; ὕψιστος — Всевышний). ἔδωκεν ἐν τῇ δεξιᾷ αὐτοῦ κράτος — «дал в правую руку его крепость» (κράτος — сила, держава). ἐξᾶραι ἄνθρωπον δυνατὸν ἐν πολέμῳ — «убрать человека сильного на войне»; ἀνυψῶσαι κέρας λαοῦ αὐτοῦ — «возвысить рог народа его» (κέρας — рог, знак силы). Слав. даёт этот стих как 6-й."
  7: "οὕτως ἐν μυριάσιν ἐδόξασαν αὐτὸν — «так в мириадах прославили его» (μυριάς — тьма, десять тысяч; мн. ч. — «тьмы»). ᾔνεσαν — «восхвалили» (αἰνέω). ἐν τῷ φέρεσθαι αὐτῷ διάδημα δόξης — «когда приносили ему венец славы» (διάδημα — венец, диадема; φέρω — нести). Слав. «внегда носити ему венец славы»."
  8: "ἐξέτριψεν γὰρ ἐχθροὺς κυκλόθεν — «ибо он сокрушил врагов окрест» (ἐκτρίβω — стирать, сокрушать; κυκλόθεν — кругом). ἐξουδένωσεν Φυλιστιιμ τοὺς ὑπεναντίους — «уничижил филистимлян, противников» (ἐξουθενέω — вменять ни во что; ὑπεναντίος — противящийся). ἕως σήμερον συνέτριψεν αὐτῶν κέρας — «до сего дня сокрушил рог их» (συντρίβω — сокрушать). Φυλιστιιμ передано ペリシテ人, как в 1 Цар и 1 Пар."
  9: "ἐν παντὶ ἔργῳ αὐτοῦ ἔδωκεν ἐξομολόγησιν — «во всяком деле своём он дал исповедание, то есть благодарение» (ἐξομολόγησις — исповедание, славословие; слав. «даде исповедание»). ἁγίῳ ὑψίστῳ ῥήματι δόξης — «Святому Всевышнему словом славы» (ῥῆμα — слово, изречение)."
  10: "ὕμνησεν καὶ ἠγάπησεν τὸν ποιήσαντα αὐτόν — «воспел и возлюбил Сотворившего его» (ὑμνέω — воспевать)."
  11: "ἔστησεν ψαλτῳδοὺς κατέναντι τοῦ θυσιαστηρίου — «поставил певцов против жертвенника» (ψαλτῳδός — певец псалмов; κατέναντι — напротив). ἐξ ἠχοῦς αὐτῶν γλυκαίνειν μέλη — «от звука их услаждать напевы» (ἦχος — звук; γλυκαίνω — делать сладким; μέλος — песнь, напев). Слав. «и постави певцы прямо олтареви, и звуком их услаждати пение»."
  12: "ἔδωκεν ἐν ἑορταῖς εὐπρέπειαν — «дал праздникам благолепие» (ἑορτή — праздник; εὐπρέπεια — благолепие, красота). ἐκόσμησεν καιροὺς μέχρι συντελείας — «украсил времена до совершения» (καιρός — срок, время; συντέλεια — завершение). ἐν τῷ αἰνεῖν... καὶ ἀπὸ πρωίᾳς ἠχεῖν τὸ ἁγίασμα — «когда они хвалили святое имя Его и от утра оглашали святилище» (ἁγίασμα — святыня, святилище; ἠχέω — звучать)."
  13: "κύριος ἀφεῖλεν τὰς ἁμαρτίας αὐτοῦ — «Господь отнял грехи его» (ἀφαιρέω — отнимать). ἀνύψωσεν εἰς αἰῶνα τὸ κέρας αὐτοῦ — «возвысил навек рог его». διαθήκην βασιλέων — «завет царей» (διαθήκη — завет, договор): обетование о царском доме (2 Цар 7:12–16). θρόνον δόξης ἐν τῷ Ισραηλ — «престол славы в Израиле»."
  14: "Μετὰ τοῦτον ἀνέστη υἱὸς ἐπιστήμων — «после него восстал сын разумный» (ἐπιστήμων — сведущий, разумный): Соломон. δι᾿ αὐτὸν κατέλυσεν ἐν πλατυσμῷ — «ради него обитал в просторе» (καταλύω — селиться, останавливаться; πλατυσμός — широта, простор): царство досталось ему мирным и обширным. Слав. «сего ради обита в пространстве» и даёт стих как 14-й."
  15: "Σαλωμων ἐβασίλευσεν ἐν ἡμέραις εἰρήνης — «Соломон царствовал во дни мира». ᾧ ὁ θεὸς κατέπαυσεν κυκλόθεν — «которому Бог дал покой отовсюду» (καταπαύω — успокаивать). ἵνα στήσῃ οἶκον ἐπ᾿ ὀνόματι αὐτοῦ — «чтобы он поставил дом во имя Его» (ἵστημι — ставить); ἑτοιμάσῃ ἁγίασμα εἰς τὸν αἰῶνα — «приготовил святыню навек» (ἑτοιμάζω — готовить)."
  16: "ὡς ἐσοφίσθης ἐν νεότητί σου — «как ты умудрился в юности твоей» (σοφίζω — делать мудрым; восклицание). ἐνεπλήσθης ὡς ποταμὸς συνέσεως — «наполнился, как река, разумения» (σύνεσις — понимание, разум). С этого стиха речь обращена к Соломону во втором лице."
  17: "γῆν ἐπεκάλυψεν ἡ ψυχή σου — «землю покрыла душа твоя» (ἐπικαλύπτω — покрывать): мысль о полноте его премудрости, ср. 3 Цар 4:29–34. ἐνέπλησας ἐν παραβολαῖς αἰνιγμάτων — «наполнил притчами загадок» (παραβολή — притча; αἴνιγμα — загадка). Слав. «исполнил еси притчами гаданий»."
  18: "εἰς νήσους πόρρω ἀφίκετο τὸ ὄνομά σου — «до островов далёких дошло имя твоё» (ἀφικνέομαι — достигать; νῆσος — остров). ἠγαπήθης ἐν τῇ εἰρήνῃ σου — «ты был любим за мир твой» (εἰρήνη — мир): слава Соломона как царя мирного."
  19: "ἐν ᾠδαῖς καὶ παροιμίαις καὶ παραβολαῖς — «в песнях, и изречениях, и притчах» (ᾠδή — песнь; παροιμία — поговорка, притча; παραβολή). ἐν ἑρμηνείαις — «в изъяснениях» (ἑρμηνεία — толкование): слав. «во сказаниих». ἀπεθαύμασάν σε χῶραι — «дивились тебе страны» (θαυμάζω — дивиться; χώρα — страна)."
  20: "ἐν ὀνόματι κυρίου τοῦ θεοῦ τοῦ ἐπικεκλημένου θεοῦ Ισραηλ — «именем Господа Бога, наречённого Богом Израиля» (ἐπικαλέω — называть)."
  21: "συνήγαγες ὡς κασσίτερον τὸ χρυσίον — «собрал золото, как олово» (κασσίτερος — олово); слав. читает «яко медь злато» (медь, 銅), поэтому в тексте 銅, а вариант LXX — в этой заметке. ὡς μόλιβον ἐπλήθυνας ἀργύριον — «как свинец, умножил серебро» (μόλιβος — свинец)."
  22: "παρανέκλινας τὰς λαγόνας σου γυναιξίν — «ты склонил бока (чресла) твои к женщинам» (παρανεκλίνω — склонять в сторону; λαγών — бок, чресла). ἐνεξουσιάσθης ἐν τῷ σώματί σου — «ты подпал власти в теле твоём» (ἐνεξουσιάζομαι — быть под властью): страдательный залог сохранён. Слав. «поработился еси телом твоим»."
  23: "ἔδωκας μῶμον ἐν τῇ δόξῃ σου — «ты дал порок (пятно) славе твоей» (μῶμος — порок, пятно). ἐβεβήλωσας τὸ σπέρμα σου — «осквернил семя твоё» (βεβηλόω — осквернять). ἐπαγαγεῖν ὀργὴν ἐπὶ τὰ τέκνα σου — «навлечь гнев на детей твоих» (ἐπάγω — наводить). κατανυγῆναι ἐπὶ τῇ ἀφροσύνῃ σου — «быть уязвлёнными о безумии твоём» (κατανύσσομαι — быть пронзённым, сокрушённым; ἀφροσύνη — безумие); слав. «умилитися о безумии твоем». γενέσθαι δίχα τυραννίδα — «чтобы разделилась надвое держава» (δίχα — надвое; τυραννίς — власть, царство). ἐξ Εφραιμ ἄρξαι βασιλείαν ἀπειθῆ — «от Ефрема началось царство непокорное» (ἀπειθής — непослушный): разделение царства при Ровоаме и Иеровоаме. Слав. «еже разделитися на двое царству»."
  24: "ὁ δὲ κύριος οὐ μὴ καταλίπῃ τὸ ἔλεος αὐτοῦ — «Господь же не оставит милости Своей» (καταλείπω — оставлять; οὐ μή — решительное отрицание). οὐδὲ μὴ ἐξαλείψῃ ἐκλεκτοῦ αὐτοῦ ἔκγονα — «и не изгладит потомков избранного Своего» (ἐξαλείφω — изглаживать; ἔκγονος — потомок). σπέρμα τοῦ ἀγαπήσαντος αὐτὸν οὐ μὴ ἐξάρῃ — «семени возлюбившего Его не истребит» (ἐξαίρω — убирать)."
  25: "τῷ Ιακωβ ἔδωκεν κατάλειμμα καὶ τῷ Δαυιδ ἐξ αὐτοῦ ῥίζαν — «Иакову дал остаток и Давиду от него корень» (κατάλειμμα — остаток; ῥίζα — корень); ἐξ αὐτοῦ — «от него», вероятно от Иакова, поэтому в тексте その者."
  26: "Καὶ ἀνεπαύσατο Σαλωμων μετὰ τῶν πατέρων αὐτοῦ — «и почил Соломон с отцами своими» (ἀναπαύομαι — почивать)."
  27: "κατέλιπεν μετ᾿ αὐτὸν... λαοῦ ἀφροσύνην — «оставил после себя... безумие народа» (ἀφροσύνη — неразумие): родительный приложения при ἐκ τοῦ σπέρματος αὐτοῦ."
  28: "ἐλασσούμενον συνέσει Ροβοαμ — «умалённого разумом Ровоама» (ἐλασσόω — уменьшать; σύνεσις — разумение). ὃς ἀπέστησεν λαὸν ἐκ βουλῆς αὐτοῦ — «который отвратил народ советом своим» (ἀφίστημι — отставлять; βουλή — совет)."
  29: "Ιεροβοαμ υἱὸς Ναβατ — Иеровоам, сын Навата. ἐξήμαρτεν τὸν Ισραηλ — «ввёл в грех Израиля» (ἐξαμαρτάνω — совращать в грех, каузатив). ἔδωκεν τῷ Εφραιμ ὁδὸν ἁμαρτίας — «дал Ефрему путь греха»."
  30: "ἐπληθύνθησαν αἱ ἁμαρτίαι αὐτῶν σφόδρα — «весьма умножились грехи их». ἀποστῆσαι αὐτοὺς ἀπὸ τῆς γῆς αὐτῶν — «чтобы удалить их от земли их» (ἀφίστημι): пленение как следствие."
  31: "καὶ πᾶσαν πονηρίαν ἐξεζήτησαν — «и всякое злодейство изыскали» (πονηρία — злоба, лукавство; ἐκζητέω — разыскивать). ἕως ἐκδίκησις ἔλθῃ ἐπ᾿ αὐτούς — «доколе не пришло на них мщение» (ἐκδίκησις — отмщение, возмездие). Слав. даёт этот стих как 31-й, последний в главе."
