# jp-box, Евангелие от Иоанна, глава 4. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 4: беседа с самарянкой у колодца (1–26), ученики (27–38),
# обращение самарян (39–42), возвращение в Галилею (43–45),
# исцеление сына царедворца (46–54).
# Красное: 4:7, 4:10, 4:13–14, 4:16–18, 4:21–24, 4:26, 4:32, 4:34–38, 4:48, 4:50.
# Слова самарянки, учеников, царедворца — не красные.
# Церковное чтение: 4:42 (ὁ Χριστός) — в 〔…〕.
# jp-ni не использовался.

