verses:
  1: "イエスは、ご自身[じしん]がヨハネよりも多[おお]くの弟子[でし]を得[え]、洗礼[せんれい]を授[さず]けておられることをファリサイ派[は]が聞[き]いたと知[し]られ、"
  2: "（洗礼[せんれい]を授[さず]けておられたのは、実[じつ]はイエスご自身[じしん]ではなく、その弟子[でし]たちであった。）"
  3: "イエスはユダヤを去[さ]り、またガリラヤへ向[む]かわれた。"
  4: "イエスはサマリアを通[とお]らねばならなかった。"
  5: "そこで、サマリアのシカルという町[まち]へ来[こ]られた。ヤコブがその子[こ]ヨセフに与[あた]えた土地[とち]のそばである。"
  6: "そこにはヤコブの井戸[いど]があった。イエスは旅[たび]に疲[つか]れて、そのまま井戸[いど]のそばに座[すわ]られた。時[とき]はおよそ六時[ろくじ]であった。"
  7: "サマリアの女[おんな]が水[みず]を汲[く]みに来[き]た。イエスは彼女[かのじょ]に言[い]われた。「<j>わたしに飲[の]ませてくれ。</j>」"
  8: "弟子[でし]たちは、食[た]べ物[もの]を買[か]いに町[まち]へ出[で]かけていたからである。"
  9: "サマリアの女[おんな]は言[い]った。「あなたはユダヤ人[じん]なのに、どうしてわたしのようなサマリアの女[おんな]に、飲[の]ませてくれと頼[たの]まれるのですか。」ユダヤ人[じん]はサマリア人[じん]と交際[こうさい]しなかったからである。"
  10: "イエスは答[こた]えて言[い]われた。「<j>もしあなたが神[かみ]の賜[たま]物[もの]と、『わたしに飲[の]ませてくれ』と言[い]っている者[もの]が誰[だれ]かを知[し]っていたなら、あなたはその方[かた]に求[もと]めたはずであり、その方[かた]はあなたに生[い]ける水[みず]をお与[あた]えになっただろう。</j>」"
  11: "女[おんな]は言[い]った。「主[しゅ]よ、あなたには汲[く]む器[うつわ]もなく、井戸[いど]も深[ふか]いのに、その生[い]ける水[みず]をどこから手[て]に入[い]れるのですか。"
  12: "あなたは、わたしたちの父[ちち]ヤコブよりも大[おお]きい方[かた]なのですか。ヤコブはこの井戸[いど]をわたしたちに与[あた]え、自分[じぶん]も、子[こ]たちも、家畜[かちく]も、みなこれで飲[の]んだのです。」"
  13: "イエスは答[こた]えて言[い]われた。「<j>この水[みず]を飲[の]む者[もの]は、また渇[かわ]く。</j>」"
  14: "「<j>しかし、わたしが与[あた]える水[みず]を飲[の]む者[もの]は、永遠[えいえん]に渇[かわ]くことがない。わたしが与[あた]える水[みず]は、その人[ひと]の内[うち]で、永遠[えいえん]の命[いのち]へと湧[わ]き上[あ]がる水[みず]の泉[いずみ]となる。</j>」"
  15: "女[おんな]は言[い]った。「主[しゅ]よ、その水[みず]をわたしにください。もう渇[かわ]くことがなく、ここへ汲[く]みに来[こ]なくてもすむように。」"
  16: "イエスは言[い]われた。「<j>行[い]って、あなたの夫[おっと]を呼[よ]んで、ここへ来[き]なさい。</j>」"
  17: "女[おんな]は答[こた]えて言[い]った。「わたしには夫[おっと]がありません。」イエスは言[い]われた。「<j>『夫[おっと]がない』と言[い]ったのは、そのとおりだ。</j>」"
  18: "「<j>あなたには五[ご]人[にん]の夫[おっと]があった。そして今[いま]いる者[もの]は、あなたの夫[おっと]ではない。あなたは真[まこと]を言[い]ったのだ。</j>」"
  19: "女[おんな]は言[い]った。「主[しゅ]よ、あなたが預言者[よげんしゃ]であることが分[わ]かります。"
  20: "わたしたちの先祖[せんぞ]はこの山[やま]で礼拝[れいはい]しました。ところが、あなたがたは、礼拝[れいはい]すべき場所[ばしょ]はエルサレムにあると言[い]います。」"
  21: "イエスは言[い]われた。「<j>女[おんな]よ、わたしを信[しん]じなさい。この山[やま]でもなく、エルサレムでもなく、あなたがたが父[ちち]を礼拝[れいはい]する時[とき]が来[く]る。</j>」"
  22: "「<j>あなたがたが礼拝[れいはい]しているのは、知[し]らないものだ。わたしたちが礼拝[れいはい]しているのは、知[し]っている方[かた]だ。救[すく]いはユダヤ人[じん]から出[で]るからである。</j>」"
  23: "「<j>しかし、真[しん]の礼拝者[れいはいしゃ]が霊[れい]と真理[しんり]によって父[ちち]を礼拝[れいはい]する時[とき]が来[く]る。今[いま]が、その時[とき]である。父[ちち]は、そのように礼拝[れいはい]する者[もの]を求[もと]めておられる。</j>」"
  24: "「<j>神[かみ]は霊[れい]である。だから、礼拝[れいはい]する者[もの]は、霊[れい]と真理[しんり]によって礼拝[れいはい]しなければならない。</j>」"
  25: "女[おんな]は言[い]った。「わたしは知[し]っています。キリストと呼[よ]ばれる方[かた]が来[こ]られます。その方[かた]が来[こ]られたとき、すべてのことをわたしたちに告[つ]げてくださいます。」"
  26: "イエスは言[い]われた。「<j>このわたしである。あなたと話[はな]している者[もの]が、それだ。</j>」"
  27: "そのとき、弟子[でし]たちが帰[かえ]って来[き]た。彼[かれ]らは、イエスが女[おんな]と話[はな]しておられるのを不思議[ふしぎ]に思[おも]った。しかし、だれも『何[なに]をお求[もと]めですか』とも『なぜ彼女[かのじょ]と話[はな]しておられるのですか』とも言[い]わなかった。"
  28: "女[おんな]は水瓶[みずがめ]を置[お]いたまま町[まち]へ行[い]き、人々[ひとびと]に言[い]った。"
  29: "「来[き]て、わたしがしたことをすべて告[つ]げてくれた人[ひと]を見[み]てください。この人[ひと]がキリストではないでしょうか。」"
  30: "人々[ひとびと]は町[まち]を出[で]て、イエスのもとへ向[む]かった。"
  31: "その間[あいだ]、弟子[でし]たちは『ラビ、食[た]べてください』と勧[すす]めた。"
  32: "イエスは言[い]われた。「<j>わたしには、あなたがたの知[し]らない食[た]べ物[もの]がある。</j>」"
  33: "そこで弟子[でし]たちは互[たが]いに言[い]った。「だれかが、食[た]べ物[もの]を持[も]って来[き]たのだろうか。」"
  34: "イエスは言[い]われた。「<j>わたしの食[た]べ物[もの]は、わたしを遣[つか]わした方[かた]の御心[みこころ]を行[おこな]い、その業[わざ]を成[な]し遂[と]げることである。</j>」"
  35: "「<j>あなたがたは『まだ四[よ]か月[げつ]ある。それから刈[か]り入[い]れが来[く]る』と言[い]っているではないか。見[み]なさい、わたしはあなたがたに言[い]う。目[め]を上[あ]げて、畑[はたけ]を見[み]なさい。刈[か]り入[い]れにはもう白[しろ]くなっている。</j>」"
  36: "「<j>刈[か]る者[もの]は報[むく]いを受[う]け、永遠[えいえん]の命[いのち]へと実[み]を集[あつ]める。蒔[ま]く者[もの]も刈[か]る者[もの]も、ともに喜[よろこ]ぶためである。</j>」"
  37: "「<j>『一人[ひとり]が蒔[ま]き、ほかの者[もの]が刈[か]る』ということばは、ここでこそ真実[しんじつ]である。</j>」"
  38: "「<j>わたしは、あなたがたを遣[つか]わして、自分[じぶん]たちが労[ろう]しなかったところを刈[か]らせた。ほかの者[もの]たちが労[ろう]したのであり、あなたがたはその労[ろう]の中[なか]に入[はい]ったのである。</j>」"
  39: "その町[まち]の多[おお]くのサマリア人[じん]が、女[おんな]が証[あかし]したことばによってイエスを信[しん]じた。女[おんな]は「わたしがしたことをすべて、この人[ひと]は告[つ]げてくれた」と言[い]ったのである。"
  40: "サマリア人[じん]たちはイエスのもとへ来[き]て、自分[じぶん]たちのところに滞在[たいざい]してほしいと願[ねが]った。イエスは二日[ふつか]、そこに滞在[たいざい]された。"
  41: "そして、はるかに多[おお]くの人[ひと]が、イエスのことばそのものを聞[き]いて信[しん]じた。"
  42: "彼[かれ]らは女[おんな]に言[い]った。「もう、あなたのことばによって信[しん]じているのではない。わたしたち自身[じしん]が聞[き]いて、この方[かた]が確[たし]かに世[よ]の救[すく]い主[ぬし]、〔キリスト〕であることを知[し]ったからである。」"
  43: "二日[ふつか]の後[のち]、イエスはそこを立[た]ってガリラヤへ向[む]かわれた。"
  44: "イエスご自身[じしん]、預言者[よげんしゃ]は自分[じぶん]の故郷[こきょう]では尊[とうと]ばれないと証[あかし]されたのである。"
  45: "ガリラヤへ来[こ]られると、ガリラヤ人[じん]たちはイエスを迎[むか]えた。彼[かれ]らも過越祭[すぎこしまつり]に上[のぼ]っていて、イエスが祭[まつ]りの間[あいだ]にエルサレムでなさったことを、すっかり見[み]ていたからである。"
  46: "イエスはまた、ガリラヤのカナへ来[こ]られた。かつて水[みず]をぶどう酒[しゅ]に変[か]えられた、その場所[ばしょ]である。さて、カファルナウムに、ある王[おう]の役人[やくにん]がいた。その子[こ]が病[やまい]で伏[ふ]せていた。"
  47: "イエスがユダヤからガリラヤへ来[こ]られたと聞[き]くと、この人[ひと]はイエスのところへ行[い]き、下[くだ]って来[き]て子[こ]を癒[いや]してくださるよう願[ねが]った。子[こ]が死[し]にかけていたからである。"
  48: "イエスは彼[かれ]に言[い]われた。「<j>あなたがたは、しるしや奇跡[きせき]を見[み]なければ、決[けっ]して信[しん]じない。</j>」"
  49: "役人[やくにん]は言[い]った。「主[しゅ]よ、子[こ]が死[し]なないうちに、どうか下[くだ]って来[き]てください。」"
  50: "イエスは言[い]われた。「<j>帰[かえ]りなさい。あなたの子[こ]は生[い]きている。</j>」この人[ひと]は、イエスが言[い]われたことばを信[しん]じて帰[かえ]って行[い]った。"
  51: "下[くだ]って行[い]く途上[とじょう]、僕[しもべ]たちが迎[むか]えに出[で]て、「あなたの子[こ]は生[い]きています」と告[つ]げた。"
  52: "そこで、少[すこ]し楽[らく]になったのは何時[なんじ]ごろかと尋[たず]ねると、彼[かれ]らは言[い]った。「昨日[きのう]の七時[しちじ]に、熱[ねつ]が引[ひ]きました。」"
  53: "父[ちち]は、その時[とき]こそイエスが『あなたの子[こ]は生[い]きている』と言[い]われた時[とき]だと知[し]った。そして、自分[じぶん]も家[いえ]の者[もの]もすべて信[しん]じた。"
  54: "これが、イエスがユダヤからガリラヤへ来[こ]られてから行[おこな]われた第二[だいに]のしるしである。"

notes:
  1: "ποιεῖ μαθητάς — «делает учеников»; передал 弟子を得 (у jp-joc 門徒を得). Стихи 1–3 в греч. одно предложение, разрезано по стихам, как у jp-joc."
  2: "καίτοι γε — уступительное «хотя». В критической базе стих стоит в скобках (пояснение евангелиста), у jp-joc тоже в （）. Оставлено в （） без 〔〕: это не добавка Церкви, а авторское уточнение."
  4: "ἔδει — «должно было» (необходимость по промыслу); 通らねばならなかった."
  6: "ὡς ἕκτη — «около шестого часа», то есть около полудня; およそ六時. κεκοπιακώς — «утомившись»; 旅に疲れて. ἐκαθέζετο οὕτως — «сидел так, как был»; そのまま座られた."
  9: "Последняя фраза (οὐ γὰρ συγχρώμενοι…) в критической базе в скобках; у jp-joc без скобок. Передана как пояснение евангелиста, без 〔〕."
  10: "δωρεά — «дар»; 賜物. ὕδωρ ζῶν — «живая (текущая) вода»; 生ける水."
  14: "ἁλλομένου — «бьющей ключом, прыгающей»; 湧き上がる. εἰς ζωὴν αἰώνιον — 永遠の命へと."
  20: "Самаряне чтили гору Гаризим; この山."
  22: "ὃ οὐκ οἴδατε / ὃ οἴδαμεν — «то, чего не знаете» / «то, что знаем»; передано 知らないもの / 知っている方."
  24: "πνεῦμα ὁ θεός — «Бог есть дух»; 神は霊である (у jp-joc 神は神なり — след старого написания). ἐν πνεύματι καὶ ἀληθείᾳ — 霊と真理によって, как в 4:23."
  25: "У самарянки Μεσσίας, ὁ λεγόμενος Χριστός. По правилу книги メシア не пишем — キリストと呼ばれる方; оттенок самарянского ожидания (Тахеб) в тексте не передан, см. журнал решений."
  26: "ἐγώ εἰμι без сказуемого; このわたしである — ср. 6:20 (わたしだ), 8:24, 8:28."
  27: "ἐθαύμαζον ὅτι μετὰ γυναικὸς ἐλάλει — «удивлялись, что Он говорит с женщиной»; не сглажено. οὐδεὶς μέντοι εἶπεν — «но никто не сказал»."
  31: "Ῥαββί — ラビ; сноска при первом упоминании в корпусе (Мф 23:7), здесь не повторяется."
  35: "τετράμηνος — «четырёхмесячный» срок до жатвы; まだ四か月ある. λευκαί εἰσιν πρὸς θερισμόν — 刈り入れにはもう白くなっている."
  38: "εἰς τὸν κόπον αὐτῶν εἰσεληλύθατε — «вошли в труд их»; その労の中に入った."
  42: "ὁ σωτὴρ τοῦ κόσμου — 世の救い主. Церковный текст (Елизаветинская «Спас миру, Христос», jp-joc「世の救主ハリストス」) добавляет ὁ Χριστός; в критической базе этого слова нет — 〔キリスト〕."
  44: "πατρίς — «родина»; 故郷."
  48: "σημεῖα καὶ τέρατα — しるしと奇跡. ἴδητε — множественное число: обращение к царедворцу и его окружению; あなたがた."
  52: "ὥραν ἑβδόμην — седьмой час, около часа дня; 七時. κομψότερον ἔσχεν — «стало легче»; 少し楽になった."
  54: "δεύτερον σημεῖον — второй знак (первый — в Кане, 2:11); 第二のしるし."
