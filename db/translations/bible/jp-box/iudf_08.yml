# jp-box, Иудифь, глава 8. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 8: родословие Иудифи (1), муж Манассия и его смерть (2–3), вдовство три года
# и четыре месяца (4–5), пост и благочестие (6), красота и имение (7–8), она слышит
# о ропоте и клятве Озии (9), призывает старейшин (10), обличает их (11–27),
# Озия отвечает (28–31), Иудифь обещает дело (32–34), отпускает их (35–36).
# Прямая речь — 「…」: 11–27 (Иудифь), 28–31 (Озия), 32–34 (Иудифь), 35 (Озия
# и начальники); красного и синего нет.
# Нумерация по gr: 36 стихов; деление совпадает с csl.
# 〔…〕 нет: все стихи есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 天幕, 粗布, 断食, 祭壇, 嗣業, 聖所 и пр. уже в корпусе.
# Имена — по таблице книги (8:1 — цепочка по LXX; 8:10 — с csl-добавлением Озии).
# csl-чтения в основном тексте: 8:10 (Озия в числе призванных), 8:21 («от уст наших»
