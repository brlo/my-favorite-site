verses:
  1: "その日[ひ]々[び]のうちに、ユディトが聞[き]いた。ユディトはメラリの娘[むすめ]である。メラリはオクスの子[こ]、オクスはヨセフの子、ヨセフはオジエルの子、オジエルはエルキヤの子、エルキヤはアナニヤの子、アナニヤはギデオンの子、ギデオンはラファインの子、ラファインはアヒトブの子、アヒトブはエリウの子、エリウはヘルキヤの子、ヘルキヤはエリアブの子、エリアブはナタナエルの子、ナタナエルはサラミエルの子、サラミエルはサラサダイの子、サラサダイはイスラエルの子である。"
  2: "彼女の夫[おっと]マナセは、彼女と同[おな]じ部族[ぶぞく]、同[おな]じ氏族[しぞく]の者[もの]であった。彼は大麦[おおむぎ]の刈[か]り入[い]れの日[ひ]々[び]に死[し]んだ。"
  3: "彼は畑[はたけ]で束[たば]を縛[しば]る者[もの]たちの上[うえ]に立[た]っていたが、熱風[ねっぷう]が彼の頭[あたま]に来[き]た。彼は自分[じぶん]の寝台[しんだい]に伏[ふ]し、自分[じぶん]の町[まち]ベトリアで死[し]んだ。人[ひと]々[びと]は彼を、ドタンとバラモンの間[あいだ]にある畑[はたけ]に、父[ちち]たちとともに葬[ほうむ]った。"
  4: "ユディトは自分[じぶん]の家[いえ]で、三年[さんねん]と四[よっ]か月[げつ]、寡婦[かふ]として暮[く]らした。"
  5: "彼女は自分[じぶん]の家[いえ]の屋根[やね]の上[うえ]に自分[じぶん]のために天幕[てんまく]を設[もう]け、腰[こし]に粗布[あらぬの]を着[つ]け、その身[み]には寡婦[かふ]の衣[ころも]をまとっていた。"
  6: "彼女は、寡婦[かふ]としてのすべての日[ひ]々[び]に、安息日[あんそくび]の前[まえ]の日[ひ]、安息日、新月[しんげつ]の前の日、新月、イスラエルの家[いえ]の祭[まつ]りと喜[よろこ]びの日[ひ]々[び]を除[のぞ]いて、断食[だんじき]をした。"
  7: "彼女は姿[すがた]が美[うつく]しく、見目[みめ]もきわめて麗[うるわ]しかった。夫[おっと]マナセは彼女に金[きん]と銀[ぎん]、男奴隷[おとこどれい]と女奴隷[おんなどれい]、家畜[かちく]と畑[はたけ]を残[のこ]し、彼女はそれらを管理[かんり]していた。"
  8: "彼女に悪[わる]い言葉[ことば]を浴[あ]びせる者[もの]は一人[ひとり]もいなかった。彼女が神[かみ]をきわめて恐[おそ]れていたからである。"
  9: "彼女は、民[たみ]が長[かしら]に逆[さか]らって語[かた]った悪[わる]い言葉[ことば]、すなわち水[みず]が乏[とぼ]しくなって彼らが気[き]を落[お]としたことを聞[き]いた。またユディトは、オジヤが彼らに語[かた]ったすべての言葉[ことば]、すなわち五日の後[のち]に町[まち]をアッシリア人[じん]に渡[わた]すと彼らに誓[ちか]ったことを聞いた。"
  10: "彼女は、自分のすべての財産[ざいさん]を管理[かんり]している女中[じょちゅう]を遣[つか]わして、自分の町[まち]の長老[ちょうろう]たちであるオジヤ、ハブリス、ハルミスを呼[よ]んだ。"
  11: "彼らは彼女のところへ来[き]た。彼女は彼らに言[い]った。「ベトリアに住[す]む者[もの]たちの長[かしら]たちよ、わたしの話[はなし]を聞[き]いてください。あなたがたが今日[きょう]、民[たみ]の前[まえ]で語[かた]った言葉[ことば]は正[ただ]しくない。あなたがたは、神[かみ]とあなたがたとの間[あいだ]で語ったこの誓[ちかい]を立[た]て、もし主[しゅ]がその日[ひ]々[び]のうちにあなたがたに助[たす]けを返[かえ]さなければ、わたしたちの敵[てき]に町[まち]を渡[わた]すと言[い]ったのです。"
  12: "今[いま]、あなたがたは何者[なにもの]か。今日[きょう]、神[かみ]を試[こころ]み、人[ひと]の子[こ]らの間[あいだ]で神に代[か]わって立[た]とうとするとは。"
  13: "あなたがたは今、全能[ぜんのう]の主[しゅ]を吟味[ぎんみ]しているが、永遠[えいえん]に至[いた]るまで何[か]も知[し]ることはないだろう。"
  14: "あなたがたは人[ひと]の心[こころ]の深[ふか]みを見[み]いだすことも、その思[おも]いの言葉[ことば]を悟[さと]ることもできないからだ。まして、これらすべてを造[つく]られた神[かみ]をどうして探[さぐ]り出[だ]し、その心[こころ]を知[し]り、その思[おも]いを悟[さと]ることができるだろうか。兄弟[きょうだい]たちよ、決[けっ]してそうしてはならない。わたしたちの神[かみ]である主[しゅ]を怒[いか]らせてはならない。"
  15: "もし主[しゅ]が五日[いつか]のうちにわたしたちを助[たす]けることを望[のぞ]まれなくても、主は、望まれる日[ひ]々[び]にわたしたちを覆[おお]い守[まも]ることも、わたしたちの敵[てき]の前[まえ]でわたしたちを滅[ほろ]ぼすことも、その権威[けんい]を持[も]っておられるのです。"
  16: "あなたがたは、わたしたちの神[かみ]である主[しゅ]の計[はか]らいを抵当[ていとう]に取[と]ってはならない。神[かみ]は人[ひと]のように脅[おど]かされる方[かた]ではなく、人[ひと]の子[こ]のように裁[さば]かれて決[き]められる方でもないからだ。"
  17: "だから、わたしたちは主[しゅ]からの救[すく]いを待[ま]ちながら、わたしたちの助[たす]けのために主を呼[よ]び求[もと]めよう。主は、ご自分[じぶん]に喜[よろこ]ばしいことであれば、わたしたちの声[こえ]を聞[き]き入[い]れてくださる。"
  18: "昔[むかし]の日[ひ]々[び]にあったようには、わたしたちの代[よ]々[よ]のうちに、また今日[きょう]に至[いた]るまで、手[て]で造[つく]った神[かみ]々[がみ]に仕[つか]える部族[ぶぞく]も、氏族[しぞく]も、民[たみ]も、町[まち]も、わたしたちのうちに立[た]ったことはなく、今[いま]もない。"
  19: "そのゆえに、わたしたちの父[ちち]たちは剣[つるぎ]と略奪[りゃくだつ]に渡[わた]され、敵[てき]の前[まえ]で大[おお]いに倒れた。"
  20: "しかし、わたしたちは主[しゅ]のほかにほかの神[かみ]を知[し]らない。それゆえ、主がわたしたちを、またわたしたちの種族[しゅぞく]から出[で]る者[もの]さえ軽[かろ]んじられないことを、わたしたちは望[のぞ]んでいる。"
  21: "というのは、わたしたちがこのように捕[と]らえられれば、ユダヤ全[ぜん]体[たい]も同じように捕らえられ、わたしたちの聖所[せいしょ]も略奪[りゃくだつ]されるからだ。主は、その冒涜[ぼうとく]をわたしたちの口[くち]から求[もと]められる。"
  22: "主は、わたしたちの兄弟[きょうだい]たちの殺[ころ]されたこと、地[ち]の捕囚[ほしゅう]、わたしたちの嗣業[しぎょう]の荒廃[こうはい]を、わたしたちがそこで仕[つか]えることになる諸国民[しょこくみん]の間[あいだ]で、わたしたちの頭[あたま]に返[かえ]される。わたしたちは、自分[じぶん]たちを手[て]に入[い]れた者[もの]たちの前[まえ]で、つまずきと辱[はずかし]めとなるだろう。"
  23: "わたしたちの奴隷[どれい]の身[み]が恵[めぐ]みとなることはなく、わたしたちの神[かみ]である主[しゅ]はそれを辱[はずかし]めとされるからだ。"
  24: "今[いま]、兄弟[きょうだい]たちよ、わたしたちの兄弟たちに示[しめ]そう。彼らの命[いのち]はわたしたちに懸[か]かっており、聖所[せいしょ]も家[いえ]も祭壇[さいだん]も、わたしたちの上に支[ささ]えられていることを。"
  25: "これらすべてのほかに、わたしたちの神[かみ]である主[しゅ]に感謝[かんしゃ]しよう。主はわたしたちの父[ちち]たちを試[こころ]みたように、わたしたちをも試みておられるのです。"
  26: "アブラハムになさったこと、イサクを試[こころ]みたこと、ヤコブがシリアのメソポタミアで、母[はは]の兄弟[きょうだい]ラバンの羊[ひつじ]を飼[か]っていたときに彼に起[お]こったことを思[おも]い出[だ]してください。"
  27: "主は、あの者[もの]たちをその心[こころ]の試[ため]しのために火[ひ]にかけたようには、わたしたちを罰[ばっ]しなかった。むしろ主は、ご自分[じぶん]に近[ちか]づく者[もの]たちを、戒[いまし]めとして懲[こ]らされるのです。」"
  28: "オジヤは彼女に言[い]った。「あなたが言[い]ったことはすべて、良[よ]い心[こころ]をもって語[かた]ったものです。あなたの言葉[ことば]に逆[さか]らう者[もの]はだれもいない。"
  29: "あなたの知恵[ちえ]が明[あき]らかになったのは今日[きょう]からではなく、あなたの日[ひ]々[び]の始[はじ]めから、民[たみ]はすべてあなたの悟[さと]りを知[し]っている。あなたの心[こころ]の造[つく]りが良[よ]いからだ。"
  30: "しかし、民[たみ]はひどく渇[かわ]いている。それで彼らは、わたしたちが彼らに語ったとおりに行[おこな]い、わたしたちの上に誓[ちかい]を課[か]すよう、わたしたちに強[し]いたのです。その誓いは破[やぶ]らない。"
  31: "今[いま]、わたしたちのために願[ねが]ってください。あなたは敬虔[けいけん]な女[おんな]だからである。主[しゅ]はわたしたちの貯水池[ちょすいち]を満[み]たす雨[あめ]を送[おく]り、わたしたちはもはや尽[つ]きることはないだろう。」"
  32: "ユディトは彼らに言[い]った。「わたしの話[はなし]を聞[き]いてください。わたしは、わたしたちの種族[しゅぞく]の子[こ]らに、代[よ]々[よ]の代[よ]まで届[とど]くことをする。"
  33: "あなたがたは今夜[こんや]、門[もん]のところに立[た]っていてください。わたしは女中[じょちゅう]を連[つ]れて出[で]て行[い]く。あなたがたが敵[てき]に町[まち]を渡[わた]すと言[い]ったその日[ひ]々[び]のうちに、主[しゅ]はわたしの手[て]によってイスラエルを顧[かえり]みられるだろう。"
  34: "あなたがたはわたしのなすことを尋[たず]ねてはならない。わたしがすることを成[な]し遂[と]げるまでは、あなたがたに話[はな]さない。」"
  35: "オジヤと長[かしら]たちは彼女に言[い]った。「平和[へいわ]のうちに行[い]きなさい。主[しゅ]である神[かみ]が、わたしたちの敵[てき]への復讐[ふくしゅう]のために、あなたの前[まえ]におられるように。」"
  36: "彼らは天幕[てんまく]から去[さ]って、それぞれの隊[たい]のところへ帰[かえ]って行[い]った。"

notes:
  1: "Длинная филиация: θυγάτηρ Μεραρι υἱοῦ Ωξ υἱοῦ Ιωσηφ … υἱοῦ Ισραηλ — «дочь Мерари, сына Окса, сына Иосифа…»; греч. υἱοῦ повторено 15 раз, в японском цепочка «…の子」 даётся по звену. Слав. порядок имён тот же до Ηλιου, но Χελκιου (ヘルキヤ) между Ηλιου и Ελιαβ слав. опускает. В конце LXX читает υἱοῦ Ισραηλ (イスラエル); слав. «сына иеилева» и Син. «сына Иеиля» — уникальное чтение, расходящееся с LXX и с контекстом родословия, поэтому оставлен LXX."
  2: "ὁ ἀνὴρ αὐτῆς Μανασσης — «муж её Манассия» (マナセ). τῆς φυλῆς αὐτῆς καὶ τῆς πατριᾶς αὐτῆς — «из колена её и племени (рода) её» (φυλή, πατριά), слав. «от племене ея и отечества ея». ἐν ἡμέραις θερισμοῦ κριθῶν — «во дни жатвы ячменя» (θερισμός, κριθή)."
  3: "ἐπέστη ἐπὶ τοὺς δεσμεύοντας τὰ δράγματα — «стоял над вяжущими снопы» (ἐφίστημι, δεσμεύω, δράγμα); καύσων — «палящий зной, знойный ветер» (καύσων); ἔπεσεν ἐπὶ τὴν κλίνην — «слёг на постель» (κλίνη). ἐτελεύτησεν — «скончался» (τελευτάω). Βαλαμων — バラモン (слав. «валамон»)."
  4: "χηρεύουσα — «вдовствуя» (χηρεύω); ἔτη τρία καὶ μῆνας τέσσαρας — «три года и четыре месяца». Слав. «вдовствующи лета три и месяцы четыри»."
  5: "σκηνὴν ἐπὶ τοῦ δώματος — «шатёр на кровле» (σκηνή, δῶμα); ἐπέθηκεν ἐπὶ τὴν ὀσφὺν αὐτῆς σάκκον — «возложила на чресла свои вретище» (ὀσφύς, σάκκος); τὰ ἱμάτια τῆς χηρεύσεως — «одежды вдовства» (ἱμάτιον, χήρευσις)."
  6: "ἐνήστευε πάσας τὰς ἡμέρας τῆς χηρεύσεως — «постилась во все дни вдовства своего» (νηστεύω, χήρευσις). χωρὶς προσαββάτων καὶ σαββάτων καὶ προνουμηνιῶν καὶ νουμηνιῶν καὶ ἑορτῶν καὶ χαρμοσυνῶν οἴκου Ισραηλ — «кроме предсубботий и суббот, и предновомесячий и новомесячий, и праздников и торжеств (радостей) дома Израилева»: πρόσαββατον — канун субботы, προνουμηνία — канун новомесячия, χαρμοσύνη — радостное торжество. Все шесть членов перечислены в том же порядке, что в греческом; генитив οἴκου Ισραηλ отнесён к «праздникам и радостям»."
  7: "καλὴ τῷ εἴδει καὶ ὡραία τῇ ὄψει — «красива видом и прекрасна лицом» (εἶδος, ὄψις); ὑπελίπετο — «оставил» (ὑπολείπω). παῖδας καὶ παιδίσκας — «рабов и рабынь» (παῖς, παιδίσκη); κτήνη καὶ ἀγρούς — «скот и поля» (κτῆνος, ἀγρός). ἔμενεν ἐπ᾽ αὐτῶν — «пребывала над ними», т. е. управляла имением (μένω). Слав. порядок «сребро и злато» отличен от греч. χρυσίον καὶ ἀργύριον."
  8: "οὐκ ἦν ὃς ἐπήνεγκεν αὐτῇ ῥῆμα πονηρόν — «не было того, кто нанёс бы ей злое слово» (ἐπιφέρω, ῥῆμα); ἐφοβεῖτο τὸν θεὸν σφόδρα — «очень боялась Бога» (φοβέομαι)."
  9: "τὰ ῥήματα τοῦ λαοῦ τὰ πονηρὰ ἐπὶ τὸν ἄρχοντα — «злые слова народа против начальника» (ἐπί с вин.). ὠλιγοψύχησαν ἐν τῇ σπάνει τῶν ὑδάτων — «пали духом при недостатке воды» (ὀλιγοψυχέω, σπάνις). καὶ ἤκουσεν πάντας τοὺς λόγους Ιουδιθ, οὓς ἐλάλησεν πρὸς αὐτοὺς Οζιας: имя Ιουδιθ несклоняемое, поэтому здесь оно может быть подлежащим при ἤκουσεν («услышала Иудифь все слова»), что и поддержано Син. «услышала Иудифь и о всех словах»; слав. «слыша вся словеса иудиф, яже глаголаше к ним озиа». ὤμοσεν … παραδώσειν … μετὰ ἡμέρας πέντε — «поклялся предать через пять дней» (ὀμνύω, παραδίδωμι)."
  10: "τὴν ἅβραν αὐτῆς τὴν ἐφεστῶσαν πᾶσιν τοῖς ὑπάρχουσιν αὐτῆς — «служанку свою, поставленную над всем имуществом её» (ἅβρα, ἐφίστημι, ὑπάρχοντα). ἐκάλεσεν Χαβριν καὶ Χαρμιν τοὺς πρεσβυτέρους — «позвала Хавриса и Хармиса, старейшин»; Χαρμις в вин. падеже Χαρμιν, отсюда ハルミス. Слав. и Син. перед ними добавляют Озию («призва озию и хаврииа и хармина»); по паритету это чтение внесено в основной текст без 〔…〕 (в LXX Озии здесь нет, но в ст. 28 он отвечает)."
  11: "Ἀκούσατε δή μου — «послушайте же меня». ἄρχοντες τῶν κατοικούντων ἐν Βαιτυλουα — «начальники жителей Ветилуи» (κατοικέω). οὐκ εὐθὴς ὁ λόγος ὑμῶν — «не право слово ваше» (εὐθύς); ἐστήσατε τὸν ὅρκον — «вы поставили клятву» (ἵστημι, ὅρκος); ἀνὰ μέσον τοῦ θεοῦ καὶ ὑμῶν — «между Богом и вами». ἐὰν μὴ ἐν αὐταῖς ἐπιστρέψῃ κύριος βοήθειαν ὑμῖν — «если не в те [дни] обратит Господь помощь вам» (ἐπιστρέφω, βοήθεια). Речь Иудифи идёт с 11 по 27 в одних 「…」."
  12: "τίνες ἐστὲ ὑμεῖς — «кто вы». οἳ ἐπειράσατε τὸν θεόν — «которые искусили Бога» (πειράζω); ἵστατε ὑπὲρ τοῦ θεοῦ — «становитесь за (вместо) Бога» (ἵστημι, ὑπέρ с род.), слав. «устависте кроме Бога», Син. «ставшие вместо Бога». Резкость вопроса в греческом сохранена."
  13: "κύριον παντοκράτορα ἐξετάζετε — «Господа Вседержителя испытуете, выведываете» (παντοκράτωρ, ἐξετάζω); οὐθὲν ἐπιγνώσεσθε ἕως τοῦ αἰῶνος — «ничего не познаете до века» (ἐπιγινώσκω, αἰών)."
  14: "βάθος καρδίας ἀνθρώπου οὐχ εὑρήσετε — «глубины сердца человека не найдёте» (βάθος, εὑρίσκω); λόγους τῆς διανοίας αὐτοῦ οὐ διαλήμψεσθε — «слов мысли его не постигнете» (διάνοια, διαλαμβάνω). πῶς τὸν θεόν … ἐρευνήσετε — «как Бога будете исследовать» (ἐρευνάω); νοῦς — «ум» (νοῦς), λογισμός — «помысл» (λογισμός). μηδαμῶς — «никак, отнюдь»; μὴ παροργίζετε — «не прогневляйте» (παροργίζω)."
  15: "ἐὰν μὴ βούληται ἐν ταῖς πέντε ἡμέραις βοηθῆσαι ἡμῖν — «если не захочет в пять дней помочь нам» (βούλομαι). αὐτὸς ἔχει τὴν ἐξουσίαν — «Он имеет власть» (ἐξουσία); ἐν αἷς θέλει … ἡμέραις — «в какие хочет дни». σκεπάσαι — «покрыть, защитить» (σκεπάζω); ὀλεθρεῦσαι — «истребить» (ὀλεθρεύω)."
  16: "μὴ ἐνεχυράζετε τὰς βουλὰς κυρίου — «не берите в залог (не связывайте) советы Господни» (ἐνεχυράζω, βουλή), слав. «не одолжайте советами». οὐχ ὡς ἄνθρωπος ὁ θεὸς ἀπειληθῆναι — «Бог не таков, как человек, чтобы Его устрашить угрозами» (ἀπειλέω, страд. ἀπειληθῆναι); οὐδ᾽ ὡς υἱὸς ἀνθρώπου διαιτηθῆναι — «и не как сын человеческий, чтобы Ему указывать» (διαιτάω — «разбирать, арбитрировать»)."
  17: "ἀναμένοντες τὴν παρ᾽ αὐτοῦ σωτηρίαν — «ожидая от Него спасения» (ἀναμένω, σωτηρία); ἐπικαλεσώμεθα — «призовём» (ἐπικαλέομαι). εἰσακούσεται τῆς φωνῆς ἡμῶν — «услышит голос наш» (εἰσακούω); ἐὰν ᾖ αὐτῷ ἀρεστόν — «если будет Ему угодно» (ἀρεστός)."
  18: "οὐκ ἀνέστη … οὔτε φυλὴ οὔτε πατριὰ οὔτε δῆμος οὔτε πόλις — «не восстал… ни колено, ни племя, ни народ, ни город» (φυλή, πατριά, δῆμος, πόλις), слав. «ниже племя, ниже отечество, ниже сонм, ниже град». προσκυνοῦσι θεοῖς χειροποιήτοις — «поклоняются богам рукотворенным» (προσκυνέω, χειροποίητος); καθάπερ ἐγένετο ἐν ταῖς πρότερον ἡμέραις — «как было в прежние дни»."
  19: "ὧν χάριν — «из-за чего, поэтому» (χάριν с род.). ἐδόθησαν εἰς ῥομφαίαν καὶ εἰς διαρπαγήν — «преданы мечу и расхищению» (ῥομφαία, διαρπαγή). ἔπεσον πτῶμα μέγα — «пали великим падением» (πτῶμα — cognate accusative к πίπτω), слав. «падоша падением великим»."
  20: "ἕτερον θεὸν οὐκ ἔγνωμεν πλὴν αὐτοῦ — «иного Бога не познали, кроме Него» (γινώσκω, πλήν). ὅθεν ἐλπίζομεν — «потому надеемся» (ἐλπίζω); οὐχ ὑπερόψεται ἡμᾶς — «не презрит нас» (ὑπεροράω); οὐδ᾽ ἀπὸ τοῦ γένους ἡμῶν — «и никого из рода нашего» (γένος)."
  21: "ἐν τῷ λημφθῆναι ἡμᾶς — «при взятии нас [в плен]» (λαμβάνω, аор. инф.). προνομευθήσεται — «будет разграблено» (προνομεύω). ἐκζητήσει τὴν βεβήλωσιν αὐτῶν — «взыщет осквернение их» (ἐκζητέω, βεβήλωσις, 冒涜). ἐκ τοῦ αἵματος ἡμῶν — «от крови нашей» (αἷμα); слав. «от уст наших» — иное чтение, по паритету взято в текст (口から), LXX-вариант отмечен здесь."
  22: "τὸν φόνον τῶν ἀδελφῶν — «убиение братьев» (φόνος); αἰχμαλωσία τῆς γῆς — «пленение земли» (αἰχμαλωσία); ἐρήμωσις τῆς κληρονομίας — «опустошение наследия» (ἐρήμωσις, κληρονομία). ἐπιστρέψει εἰς κεφαλὴν ἡμῶν — «обратит на голову нашу» (ἐπιστρέφω, κεφαλή): образ возмездия. πρόσκομμα καὶ ὄνειδος — «соблазн (преткновение) и поношение» (πρόσκομμα, ὄνειδος); κτωμένων ἡμᾶς — «приобретших, овладевших нами» (κτάομαι)."
  23: "οὐ κατευθυνθήσεται ἡ δουλεία ἡμῶν εἰς χάριν — «не направится (не пойдёт на пользу) рабство наше в благодать, милость» (κατευθύνω, δουλεία, χάρις), слав. «не исправится служба наша в благодать». εἰς ἀτιμίαν θήσει αὐτήν — «в бесчестие положит его» (ἀτιμία, τίθημι)."
  24: "ἐπιδειξώμεθα — «покажем» (ἐπιδείκνυμι); ἐξ ἡμῶν κρέμαται ἡ ψυχὴ αὐτῶν — «от нас висит (зависит) жизнь их» (κρέμαμαι, ψυχή). τὰ ἅγια καὶ ὁ οἶκος καὶ τὸ θυσιαστήριον — «святыни, дом и жертвенник» (ἅγια, οἶκος, θυσιαστήριον); ἐπεστήρισται ἐφ᾽ ἡμῖν — «утверждается на нас» (ἐπιστηρίζω)."
  25: "παρὰ ταῦτα πάντα — «сверх всего этого, кроме сего» (παρά с вин.); εὐχαριστήσωμεν — «возблагодарим» (εὐχαριστέω). ὃς πειράζει ἡμᾶς καθὰ καὶ τοὺς πατέρας ἡμῶν — «Который испытует нас, как и отцов наших» (πειράζω, καθά)."
  26: "μνήσθητε — импер. аор. «вспомните» (μιμνήσκομαι). ὅσα ἐποίησεν μετὰ Αβρααμ — «что сделал с Авраамом» (μετά с род.); ὅσα ἐπείρασεν τὸν Ισαακ — «чем искушал Исаака» (πειράζω). ἐν Μεσοποταμίᾳ τῆς Συρίας — «в Месопотамии Сирии»; ποιμαίνοντι τὰ πρόβατα Λαβαν — «когда пас овец Лавана» (ποιμαίνω, πρόβατον); τοῦ ἀδελφοῦ τῆς μητρὸς αὐτοῦ — «брата матери его», т. е. дяди."
  27: "ἐπύρωσεν — «обжёг, расплавил, очистил огнём» (πυρόω); εἰς ἐτασμὸν τῆς καρδίας αὐτῶν — «в испытание (истязание) сердца их» (ἐτασμός). οὐκ ἐξεδίκησεν — «не взыскал, не отомстил» (ἐκδικέω); εἰς νουθέτησιν — «в наставление, вразумление» (νουθέτησις); μαστιγοῖ — «бичует» (μαστιγόω), передано 懲らす, как в Тов 13:2; τοὺς ἐγγίζοντας αὐτῷ — «приближающихся к Нему» (ἐγγίζω)."
  28: "ἐν ἀγαθῇ καρδίᾳ ἐλάλησας — «сказала от доброго сердца» (ἀγαθός, καρδία); οὐκ ἔστιν ὃς ἀντιστήσεται τοῖς λόγοις σου — «нет того, кто воспротивится словам твоим» (ἀνθίστημι). Речь Озии идёт с 28 по 31."
  29: "οὐκ ἐν τῇ σήμερον … πρόδηλός ἐστιν — «не с сегодняшнего дня явна» (πρόδηλος, σήμερον). ἀπ᾽ ἀρχῆς ἡμερῶν σου — «от начала дней твоих»; ἔγνω … τὴν σύνεσίν σου — «познал разум твой» (σύνεσις). τὸ πλάσμα τῆς καρδίας σου — «образ (устроение) сердца твоего» (πλάσμα), слав. «смышление сердца твоего»."
  30: "δεδίψηκεν σφόδρα — «сильно возжаждал» (διψάω, перф.). ἠνάγκασαν — «принудили» (ἀναγκάζω). ἐπαγαγεῖν ἐφ᾽ ἡμᾶς ὅρκον — «навести на нас клятву» (ἐπάγω, ὅρκος); ὃν οὐ παραβησόμεθα — «которую не преступим» (παραβαίνω)."
  31: "δεήθητι περὶ ἡμῶν — импер. аор. «помолись о нас» (δέομαι). γυνὴ εὐσεβής — «жена благочестивая» (εὐσεβής). ἀποστελεῖ … τὸν ὑετόν — «пошлёт дождь» (ὑετός); εἰς πλήρωσιν τῶν λάκκων — «во исполнение водоёмов» (πλήρωσις, λάκκος, как в 7:21); οὐκ ἐκλείψομεν ἔτι — «не оскудеем более» (ἐκλείπω)."
  32: "ποιήσω πρᾶγμα — «сделаю дело» (πρᾶγμα); ὃ ἀφίξεται εἰς γενεὰς γενεῶν — «которое дойдёт до родов родов» (ἀφικνέομαι, γενεά); υἱοῖς τοῦ γένους ἡμῶν — «сынам рода нашего» (γένος). Речь Иудифи — 32–34."
  33: "στήσεσθε ἐπὶ τῆς πύλης — «станете у ворот» (ἵστημι, πύλη); ἐξελεύσομαι … μετὰ τῆς ἅβρας μου — «выйду со служанкою моею» (ἐξέρχομαι, ἅβρα). ἐν ταῖς ἡμέραις, μεθ᾽ ἃς εἴπατε — «в те дни, после которых вы сказали»; ἐπισκέψεται κύριος τὸν Ισραηλ ἐν χειρί μου — «посетит Господь Израиля рукою моею» (ἐπισκέπτομαι, χείρ)."
  34: "οὐκ ἐξερευνήσετε τὴν πρᾶξίν μου — «не выпытывайте дело моё» (ἐξερευνάω, πρᾶξις); ἕως τοῦ τελεσθῆναι ἃ ἐγὼ ποιῶ — «доколе не совершится то, что я делаю» (τελέω)."
  35: "Πορεύου εἰς εἰρήνην — «иди с миром» (πορεύομαι, εἰρήνη), формула благословения (ср. 1 Цар 1:17). κύριος ὁ θεὸς ἔμπροσθέν σου — «Господь Бог пред тобою» (ἔμπροσθεν); εἰς ἐκδίκησιν τῶν ἐχθρῶν ἡμῶν — «на отмщение врагов наших» (ἐκδίκησις)."
  36: "ἀποστρέψαντες ἐκ τῆς σκηνῆς — «повернув, уйдя от шатра» (ἀποστρέφω, σκηνή); ἐπορεύθησαν ἐπὶ τὰς διατάξεις αὐτῶν — «пошли к своим отрядам (расположениям)» (διάταξις), слав. «ко ополчением своим»."
