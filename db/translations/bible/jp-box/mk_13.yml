verses:
  1: "イエスが神殿[しんでん]から出[で]て行[ゆ]かれるとき、弟子[でし]の一人[ひとり]が言[い]った。「先生[せんせい]、ご覧[らん]ください。なんという石[いし]、なんという建物[たてもの]でしょう。」"
  2: "イエスは言[い]われた。「<j>この大[おお]きな建物[たてもの]が見[み]えるか。ここでは、一[ひと]つの石[いし]も石[いし]の上[うえ]に残[のこ]らず、すべて崩[くず]されてしまう。</j>」"
  3: "イエスがオリーブ山[やま]で神殿[しんでん]に向[む]かって座[すわ]っておられたとき、ペトロ、ヤコブ、ヨハネ、アンデレがひそかに尋[たず]ねた。"
  4: "「お話[はな]しください。これらのことはいつ起[お]こるのですか。これらのことがすべて実現[じつげん]しようとしているとき、どんなしるしがあるのですか。」"
  5: "イエスは彼[かれ]らに語[かた]り始[はじ]められた。「<j>だれにも惑[まど]わされないように気[き]をつけなさい。</j>"
  6: "<j>多[おお]くの者[もの]がわたしの名[な]を名乗[なの]って来[き]て、『わたしこそ、その者[もの]だ』と言[い]い、多[おお]くの者[もの]を惑[まど]わす。</j>"
  7: "<j>戦争[せんそう]や戦争[せんそう]のうわさを聞[き]いても、恐[おそ]れてはならない。それは必[かなら]ず起[お]こるが、まだ終[お]わりではない。</j>"
  8: "<j>民[たみ]は民[たみ]に、国[くに]は国[くに]に敵対[てきたい]して立[た]ち上[あ]がり、各地[かくち]に地震[じしん]が起[お]こり、飢饉[ききん]が起[お]こる。これらは産[う]みの苦[くる]しみの始[はじ]まりである。</j>」"
  9: "「<j>あなたがたは自分自身[じぶんじしん]に気[き]をつけなさい。人々[ひとびと]はあなたがたを最高法院[さいこうほういん]に引[ひ]き渡[わた]し、会堂[かいどう]で打[う]ちたたき、わたしのゆえに総督[そうとく]や王[おう]たちの前[まえ]に立[た]たせて、彼[かれ]らへの証[あかし]とする。</j>"
  10: "<j>まず、福音[ふくいん]がすべての民[たみ]に宣[の]べ伝[つた]えられなければならない。</j>"
  11: "<j>あなたがたが引[ひ]き渡[わた]されて連[つ]れて行[ゆ]かれるとき、何[なに]を言[い]おうかと前[まえ]もって思[おも]い煩[わずら]ってはならない。そのとき与[あた]えられることを言[い]いなさい。語[かた]るのはあなたがたではなく、{聖霊[せいれい]|聖神[せいしん]}である。</j>"
  12: "<j>兄弟[きょうだい]は兄弟[きょうだい]を、父[ちち]は子[こ]を死[し]に渡[わた]し、子[こ]らは親[おや]に立[た]ち向[む]かって、親[おや]を殺[ころ]す。</j>"
  13: "<j>あなたがたはわたしの名[な]のゆえにすべての人[ひと]に憎[にく]まれる。しかし、最後[さいご]まで耐[た]え忍[しの]ぶ者[もの]は救[すく]われる。</j>」"
  14: "「<j>荒廃[こうはい]の憎[にく]むべきものが、あるべきでない所[ところ]に立[た]っているのを見[み]たら、読[よ]む者[もの]は悟[さと]るがよい。そのとき、ユダヤにいる者[もの]は山[やま]へ逃[に]げなさい。</j>"
  15: "<j>屋根[やね]の上[うえ]にいる者[もの]は、家[いえ]の中[なか]に降[お]りてはならない。物[もの]を取[と]りに家[いえ]に入[はい]ってもならない。</j>"
  16: "<j>畑[はたけ]にいる者[もの]も、上着[うわぎ]を取[と]るために後[うし]ろへ引[ひ]き返[かえ]してはならない。</j>"
  17: "<j>その日[ひ]、身[み]ごもっている女[おんな]と乳[ちち]を飲[の]ませている女[おんな]は不幸[ふこう]である。</j>"
  18: "<j>あなたがたの逃[に]げるのが冬[ふゆ]にならないように祈[いの]りなさい。</j>"
  19: "<j>その日々[ひび]は、神[かみ]が造[つく]られた創造[そうぞう]の初[はじ]めから今[いま]に至[いた]るまでなかったほどの苦難[くなん]である。今後[こんご]も決[けっ]してない。</j>"
  20: "<j>主[しゅ]がその日々[ひび]を短[みじか]くされなかったなら、だれひとり救[すく]われなかっただろう。しかし、主[しゅ]は選[えら]ばれた者[もの]たちのゆえに、その日々[ひび]を短[みじか]くされた。</j>"
  21: "<j>そのとき、だれかがあなたがたに『見[み]よ、キリストはここにいる』『見[み]よ、あそこにいる』と言[い]っても、信[しん]じてはならない。</j>"
  22: "<j>偽[にせ]キリストや偽[にせ]預言者[よげんしゃ]たちが起[お]こり、しるしと不思議[ふしぎ]を行[おこな]って、できれば選[えら]ばれた者[もの]たちさえ惑[まど]わそうとする。</j>"
  23: "<j>あなたがたは気[き]をつけなさい。わたしはすべてのことを前[まえ]もってあなたがたに言[い]っておいた。</j>」"
  24: "「<j>しかし、その日々[ひび]の苦難[くなん]の後[のち]に、太陽[たいよう]は暗[くら]くなり、月[つき]はその光[ひかり]を放[はな]たなくなる。</j>"
  25: "<j>星[ほし]は天[てん]から落[お]ち、天[てん]の力[ちから]ある者[もの]たちは揺[ゆ]り動[うご]かされる。</j>"
  26: "<j>そのとき、人々[ひとびと]は人[ひと]の子[こ]が大[おお]きな力[ちから]と栄光[えいこう]を帯[お]びて雲[くも]に乗[の]って来[く]るのを見[み]る。</j>"
  27: "<j>そのとき、人[ひと]の子[こ]は天使[てんし]たちを遣[つか]わし、地[ち]の果[は]てから天[てん]の果[は]てまで、四方[しほう]の風[かぜ]から選[えら]ばれた者[もの]たちを集[あつ]める。</j>」"
  28: "「<j>いちじくの木[き]からたとえを学[まな]びなさい。枝[えだ]が柔[やわ]らかになり、葉[は]が出[で]ると、夏[なつ]が近[ちか]いことが分[わ]かる。</j>"
  29: "<j>同[おな]じように、あなたがたも、これらのことが起[お]こるのを見[み]たら、時[とき]が戸口[とぐち]まで近[ちか]づいていることを知[し]りなさい。</j>"
  30: "<j>はっきり言[い]っておく。これらのことがすべて起[お]こるまで、この世代[せだい]は決[けっ]して過[す]ぎ去[さ]らない。</j>"
  31: "<j>天地[てんち]は過[す]ぎ去[さ]るが、わたしの言葉[ことば]は過[す]ぎ去[さ]らない。</j>」"
  32: "「<j>その日[ひ]、その時[とき]については、だれも知[し]らない。天[てん]の天使[てんし]たちも、子[こ]も知[し]らない。ただ父[ちち]だけが知[し]っておられる。</j>"
  33: "<j>目[め]を覚[さ]まして、見張[みは]っていなさい。その時[とき]がいつなのか、あなたがたには分[わ]からないからである。</j>"
  34: "<j>それは、旅[たび]に出[で]る人[ひと]が家[いえ]を後[あと]にして、僕[しもべ]たちに権限[けんげん]を与[あた]え、それぞれに仕事[しごと]を割[わ]り当[あ]て、門番[もんばん]には目[め]を覚[さ]ましているように命[めい]じるのと似[に]ている。</j>"
  35: "<j>だから、目[め]を覚[さ]ましていなさい。家[いえ]の主人[しゅじん]がいつ来[く]るか、夕方[ゆうがた]か、夜中[よなか]か、鶏[にわとり]の鳴[な]くころか、朝[あさ]か、あなたがたは知[し]らない。</j>"
  36: "<j>主人[しゅじん]が突然[とつぜん]帰[かえ]って来[き]て、あなたがたの眠[ねむ]っているところを見[み]つけないように。</j>"
  37: "<j>わたしがあなたがたに言[い]うことを、すべての人[ひと]に言[い]う。目[め]を覚[さ]ましていなさい。</j>」"

notes:
  3: "オリーブ山 — Масличная гора; у jp-joc 橄欖山."
  8: "В критической базе только λιμοί (голод); «мятежи» (ταραχαί) у jp-joc — из церковного текста, не добавлял."
  14: "Дан 9:27; 12:11. τὸ βδέλυγμα τῆς ἐρημώσεως — 荒廃の憎むべきもの. В критической базе стих без скобок, поэтому 〔〕 не ставил. Ремарку ὁ ἀναγινώσκων νοείτω оставил в красном: она стоит внутри речи Христа. У jp-joc добавлено «預言者ダニイルによりて言はれたる» — в критическом тексте этого нет, не включал."
  19: "θλῖψις — 苦難; «такой скорби не было от начала творения»."
  20: "πᾶσα σάρξ — «всякая плоть»; переведено «だれひとり»."
  32: "οὐδὲ ὁ υἱός — «ни Сын» есть и в церковном тексте Марка (в отличие от Мф 24:36), переведено как есть."
  33: "В критическом тексте βλέπετε ἀγρυπνεῖτε; «и молитесь» у jp-joc — церковная добавка, не включена."
  34: "ἄνθρωπος ἀπόδημος — «человек, уезжающий в чужую страну»."
