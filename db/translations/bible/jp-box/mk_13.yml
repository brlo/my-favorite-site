# jp-box, Евангелие от Марка, глава 13. Переписано заново с греческого.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Речь Христа на Елеонской горе (5–37) — вся красным, каждый стих со своей парой;
# повествовательная рамка (1, 3) — вне тегов.
# jp-ni не использовался.

