verses:
  1: "会議[かいぎ]の周[まわ]りにいた者[もの]たちの騒[さわ]ぎが静[しず]まると、アッシリアの軍勢[ぐんぜい]の総大将[そうだいしょう]ホロフェルネスは、異民族[いみんぞく]の民[たみ]すべての前[まえ]で、またモアブの子[こ]らすべてに向[む]かって、アヒオルに言[い]った。"
  2: "「おまえは何者[なにもの]だ、アヒオル。エフライムの雇[やと]われ人[びと]どもではないか。おまえは今日[きょう]、わたしたちの間[あいだ]で預言[よげん]し、イスラエルの一族[いちぞく]と戦[たたか]うなと言[い]った。彼[かれ]らの神[かみ]が彼[かれ]らを守[まも]るからだ、というのか。ネブカドネツァルのほかに、だれが神[かみ]か。この者[もの]がその威力[いりょく]を送[おく]り、彼[かれ]らを地[ち]の面[おもて]から滅[ほろ]ぼし尽[つ]くす。彼[かれ]らの神[かみ]も彼[かれ]らを救[すく]い出[だ]さない。"
  3: "しかし、わたしたち、そのしもべたちは、彼[かれ]らを一人[ひとり]の人間[にんげん]のように打[う]ち倒[たお]す。彼[かれ]らはわたしたちの馬[うま]の強[つよ]さに耐[た]えられない。"
  4: "われわれは彼[かれ]らを踏[ふ]みにじるからだ。彼[かれ]らの山[やま]は彼[かれ]らの血[ち]で酔[よ]い、その平野[へいや]は彼[かれ]らの死者[ししゃ]で満[み]ちる。彼[かれ]らの足[あし]の跡[あと]はわたしたちの前[まえ]に立[た]ちはしない。彼[かれ]らは滅[ほろ]びによって滅[ほろ]びる。全[ぜん]地[ち]の主[しゅ]である王[おう]ネブカドネツァルがこう言[い]う。『その言葉[ことば]の言葉[ことば]はむだにならない』と、彼[かれ]は言[い]ったからである。"
  5: "しかし、おまえは、アンモンの雇[やと]われ人[びと]アヒオルよ。おまえはこの言葉[ことば]を、自分[じぶん]の不法[ふほう]の日[ひ]に語[かた]った。おまえは今日[きょう]から、わたしがエジプトから出[で]た者[もの]たちの一族[いちぞく]に復讐[ふくしゅう]するまで、もはやわたしの顔[かお]を見[み]ることはない。"
  6: "そのとき、わたしの軍勢[ぐんぜい]の剣[つるぎ]と、わたしのしもべたちの民[たみ]が、おまえの脇腹[わきばら]を貫[つらぬ]く。わたしが戻[もど]ったとき、おまえは彼[かれ]らの傷[きず]ついた者[もの]たちの間[あいだ]に倒[たお]れる。"
  7: "わたしのしもべたちはおまえを山地[さんち]へ連[つ]れて行[い]き、上[のぼ]り道[みち]の町[まち]の一[ひと]つに置[お]く。"
  8: "おまえは、彼[かれ]らとともに滅[ほろ]ぼされるまで、死[し]ぬことはない。"
  9: "もしおまえが、心[こころ]のうちで、彼[かれ]らは捕[と]らえられないと望[のぞ]んでいるのなら、顔[かお]を伏[ふ]せてはならない。わたしは語[かた]った。わたしの言葉[ことば]は一[ひと]つも落[お]ちることはない。」"
  10: "ホロフェルネスは、自分[じぶん]の天幕[てんまく]のそばに立[た]っていたしもべたちに命[めい]じて、アヒオルを捕[と]らえ、ベトリアへ連[つ]れて行[い]かせ、イスラエルの子[こ]らの手[て]に引[ひ]き渡[わた]させた。"
  11: "しもべたちは彼[かれ]を捕[と]らえ、陣営[じんえい]の外[そと]の野[の]へ連[つ]れ出[だ]し、平野[へいや]の真[ま]ん中[なか]から山地[さんち]へ向[む]かって進[すす]み、ベトリアの下[した]にある泉[いずみ]のところへ来[き]た。"
  12: "町[まち]の人々[ひとびと]が山[やま]の頂[いただき]に彼[かれ]らを見[み]るや、武具[ぶぐ]を取[と]り、町[まち]の外[そと]へ出[で]て山[やま]の頂[いただき]に立[た]った。石[いし]を投[な]げる男[おとこ]はすべて、彼[かれ]らの上[のぼ]り道[みち]を押[お]さえ、彼[かれ]らに石[いし]を投[な]げつけた。"
  13: "彼[かれ]らは山[やま]の下[した]に下[お]りてアヒオルを縛[しば]り、山[やま]の根元[ねもと]に投[な]げ捨[す]てたままにして、自分[じぶん]たちの主[しゅ]のもとへ帰[かえ]って行[い]った。"
  14: "イスラエルの子[こ]らは自分[じぶん]たちの町[まち]から下[お]りて来[き]て彼[かれ]のそばに立[た]ち、縛[しば]りを解[と]いてベトリアへ連[つ]れて行[い]き、自分[じぶん]たちの町[まち]の長[かしら]たちの前[まえ]に立[た]たせた。"
  15: "そのころの長[かしら]たちは、シメオン部族[ぶぞく]に属[ぞく]するミカの子[こ]オジヤ、ゴトニエルの子[こ]ハブリス、メルキエルの子[こ]ハルミスであった。"
  16: "彼[かれ]らは町[まち]の長老[ちょうろう]たちすべてを呼[よ]び集[あつ]め、その若者[わかもの]たちと女[おんな]たちはすべて集会[しゅうかい]へ駆[か]け集[あつ]まった。彼[かれ]らはアヒオルを自分[じぶん]たちの民[たみ]すべての真[ま]ん中[なか]に立[た]たせ、オジヤは彼[かれ]に何[なに]が起[お]こったのかを尋[たず]ねた。"
  17: "彼[かれ]は答[こた]えて、ホロフェルネスの会議[かいぎ]での言葉[ことば]を告[つ]げ、またアッシリアの子[こ]らの長[かしら]たちの間[あいだ]で語[かた]ったすべての言葉[ことば]、ホロフェルネスがイスラエルの家[いえ]について傲慢[ごうまん]に語[かた]ったことをすべて告[つ]げた。"
  18: "民[たみ]はひれ伏[ふ]して神[かみ]を拝[おが]み、叫[さけ]んで言[い]った。"
  19: "「主[しゅ]よ、天[てん]の神[かみ]よ、彼[かれ]らの高慢[こうまん]に目[め]を注[そそ]ぎ、わたしたちの一族[いちぞく]の卑[いや]しさをあわれんでください。この日[ひ]、あなたに聖別[せいべつ]された者[もの]たちの顔[かお]を顧[かえり]みてください。」"
  20: "彼[かれ]らはアヒオルを慰[なぐさ]め、非常[ひじょう]にほめたたえた。"
  21: "オジヤは彼[かれ]を集会[しゅうかい]から自分[じぶん]の家[いえ]へ連[つ]れて行[い]き、長老[ちょうろう]たちのために酒宴[しゅえん]を開[ひら]いた。そして彼[かれ]らはその夜[よ]、一晩中[ひとばんじゅう]、イスラエルの神[かみ]を助[たす]けのために呼[よ]び求[もと]めた。"

notes:
  1: "κατέπαυσεν ὁ θόρυβος — «утих шум» (θόρυβος); τῶν ἀνδρῶν τῶν κύκλῳ τῆς συνεδρίας — «мужей вокруг совещания» (συνεδρία — совещание, 会議; слав. «заседание»). ἐναντίον παντὸς τοῦ δήμου ἀλλοφύλων — «пред всем народом иноплеменников» (ἀλλόφυλος); πρὸς πάντας υἱοὺς Μωαβ — «и ко всем сынам Моава»."
  2: "τίς εἶ σύ — «кто ты»; οἱ μισθωτοὶ τοῦ Εφραιμ — «наёмники Ефрема» (μισθωτός), презрительно; Ахиор — аммонитянин, здесь назван наёмником. ἐπροφήτευσας — «пророчествовал» (προφητεύω); ὑπερασπιεῖ — «защитит» (ὑπερασπίζω). τίς θεὸς εἰ μὴ Ναβουχοδονοσορ — «кто бог, если не Навуходоносор»; ἀποστελεῖ τὸ κράτος — «пошлёт силу свою»; ῥύσεται — «избавит» (ῥύομαι)."
  3: "πατάξομεν — «поразим» (πατάσσω); ὡς ἄνθρωπον ἕνα — «как одного человека»; οὐχ ὑποστήσονται — «не выдержат» (ὑφίστημι); τὸ κράτος τῶν ἵππων — «мощь коней» (ἵππος)."
  4: "κατακαύσομεν — «сожжём» (κατακαίω); в слав. «поперем» (растопчем) — иное чтение, взято церковное. ἐν αὐτοῖς — «в них» (неясно: в их земле или городах). μεθυσθήσεται — «упиется» (μεθύσκω, буд. пассив); πληρωθήσεται τῶν νεκρῶν — «наполнится мёртвыми» (генитив); ἴχνος τῶν ποδῶν — «след ног»; ἀπωλείᾳ ἀπολοῦνται — усилительное «погибелью погибнут»; λέγει ὁ βασιλεύς — «говорит царь» (пророческая формула); ματαιωθήσεται — «не окажется тщетным» (ματαιόω)."
  5: "μισθωτὲ τοῦ Αμμων — звательный «наёмник Аммона»; ἐν ἡμέρᾳ ἀδικίας σου — «в день неправды твоей»; οὐκ ὄψει ἔτι τὸ πρόσωπόν μου — «не увидишь более лица моего»; ἕως οὗ ἐκδικήσω — «доколе не отомщу» (ἐκδικέω); τὸ γένος τῶν ἐξ Αἰγύπτου — «род [вышедших] из Египта»."
  6: "διελεύσεται ὁ σίδηρος — «пройдёт железо» (σίδηρος — метонимия меча), слав. «мечь»; τὰς πλευράς σου — «рёбра твои» (πλευρά); πεσῇ ἐν τοῖς τραυματίαις — «падёшь между ранеными» (τραυματίας); ὅταν ἐπιστρέψω — «когда возвращусь»."
  7: "ἀποκαταστήσουσίν σε — «отведут тебя» (ἀποκαθίστημι); θήσουσίν σε ἐν μιᾷ τῶν πόλεων τῶν ἀναβάσεων — «поставят тебя в одном из городов восходов» (ἀνάβασις)."
  8: "οὐκ ἀπολῇ — «не погибнешь» (ἀπόλλυμι); ἕως οὗ ἐξολεθρευθῇς μετ᾿ αὐτῶν — «доколе не будешь истреблён с ними» (ἐξολεθρεύω)."
  9: "εἴπερ ἐλπίζεις τῇ καρδίᾳ σου — «если ты надеешься сердцем твоим» (ἐλπίζω с дативом); οὐ συλλημφθήσονται — «не будут взяты» (συλλαμβάνω, буд. пассив); μὴ συμπεσέτω σου τὸ πρόσωπον — «да не спадёт лицо твоё» (συμπίπτω), т. е. не падай духом; διαπεσεῖται — «не пропадёт» (διαπίπτω). Конец речи Олоферна."
  10: "προσέταξεν — «повелел» (προστάσσω); τοῖς δούλοις τοῖς παρεστηκόσιν ἐν τῇ σκηνῇ — «рабам, предстоящим в шатре» (σκηνή — 天幕); συλλαβεῖν — «взять» (συλλαμβάνω); ἀποκαταστῆσαι εἰς Βαιτυλουα — «отвести в Ветилую»; παραδοῦναι εἰς χεῖρας — «предать в руки»."
  11: "ἤγαγον ἔξω τῆς παρεμβολῆς — «вывели за стан» (παρεμβολή — 陣営); ἀπῆραν ἐκ μέσου τῆς πεδινῆς — «поднялись из середины равнины» (πεδινή); πηγαί — источники; ὑποκάτω Βαιτυλουα — «под Ветилуей»."
  12: "ἀνέλαβον τὰ ὅπλα — «взяли оружие» (ἀναλαμβάνω); πᾶς ἀνὴρ σφενδονήτης — «всякий муж-пращник» (σφενδόνη — праща), отсюда 石を投げる男; διεκράτησαν τὴν ἀνάβασιν — «удержали восход» (διακρατέω); ἔβαλλον ἐν λίθοις — «бросали камнями»."
  13: "ὑποδύσαντες ὑποκάτω τοῦ ὄρους — «подойдя под гору» (ὑποδύω); ἔδησαν — «связали» (δέω); ἀφῆκαν ἐρριμμένον — «оставили брошенным» (ῥίπτω, перфект пассив); ὑπὸ τὴν ῥίζαν τοῦ ὄρους — «под корень горы» (ῥίζα); ἀπῴχοντο — «ушли» (ἀποίχομαι)."
  14: "καταβάντες — «сойдя» (καταβαίνω); ἐπέστησαν αὐτῷ — «встали над ним» (ἐφίστημι); λύσαντες — «развязав» (λύω); ἀπήγαγον — «привели» (ἀπάγω); κατέστησαν ἐπὶ τοὺς ἄρχοντας — «поставили пред начальниками» (καθίστημι)."
  15: "οἳ ἦσαν ἐν ταῖς ἡμέραις ἐκείναις — «которые были в те дни», т. е. начальники, названные в ст. 14. Οζιας ὁ τοῦ Μιχα — «Озия, [сын] Михи» (род. падеж без υἱός); ἐκ τῆς φυλῆς Συμεων — «из племени Симеона». Χαβρις ὁ τοῦ Γοθονιηλ — «Хаврис, [сын] Гофониила»; Χαρμις υἱὸς Μελχιηλ — «Хармис, сын Мелхиила»; патронимы даны по LXX: ゴトニエル, メルキエル."
  16: "συνεκάλεσαν — «созвали» (συγκαλέω); πρεσβύτεροι — старейшины (長老); συνέδραμον — «сбежались» (συντρέχω); νεανίσκος — юноша; ἐκκλησία — собрание (集会); ἔστησαν ἐν μέσῳ — «поставили посреди»; ἐπηρώτησεν τὸ συμβεβηκός — «спросил о случившемся» (συμβαίνω, причастие перфекта)."
  17: "ἀποκριθεὶς ἀπήγγειλεν — «ответив, возвестил» (ἀπαγγέλλω); ῥήματα τῆς συνεδρίας — «слова совещания» (συνεδρία — 会議); ἐμεγαλορρημόνησεν — «велеречевал, высокомерно говорил» (μεγαλορρημονέω); εἰς τὸν οἶκον Ισραηλ — «о доме Израиля»."
  18: "πεσόντες — «падши» (πίπτω); προσεκύνησαν τῷ θεῷ — «поклонились Богу» (προσκυνέω); ἐβόησαν λέγοντες — «воззвали, говоря»: λέγοντες вводит молитву ст. 19."
  19: "Κύριε ὁ θεὸς τοῦ οὐρανοῦ — звательное обращение; κάτιδε — «воззри» (καθοράω); ὑπερηφανία — гордыня (ὑπερηφανία); ἐλέησον τὴν ταπείνωσιν — «помилуй смирение (унижение)» (ταπείνωσις); ἐπίβλεψον ἐπὶ τὸ πρόσωπον — «призри на лицо» (ἐπιβλέπω); τῶν ἡγιασμένων σοι — «освящённых Тебе» (ἁγιάζω, перфект пассив)."
  20: "παρεκάλεσαν — «утешили» (παρακαλέω); ἐπῄνεσαν σφόδρα — «похвалили весьма» (ἐπαινέω)."
  21: "παρέλαβεν εἰς οἶκον αὐτοῦ — «взял в дом свой» (παραλαμβάνω); ἐποίησεν πότον — «сделал пир» (πότος — пиршество), отсюда 酒宴; ἐπεκαλέσαντο — «призвали» (ἐπικαλέω); εἰς βοήθειαν — «на помощь» (βοήθεια); ὅλην τὴν νύκτα — «всю ночь»."
