verses:
  1: "さてニカノルは、ユダとその仲間[なかま]たちがサマリアの地方[ちほう]にいると知[し]ると、まったき安全[あんぜん]をもって安息日[あんそくび]の日[ひ]に彼らを襲[おそ]おうと考[かんが]えた。"
  2: "しかたなく彼[かれ]に従[したが]っていたユダヤ人[じん]たちが言[い]った。「どうか彼らをそんなにも残忍[ざんにん]に、野蛮[やばん]に滅[ほろ]ぼさないでください。すべてを見[み]る方[かた]によって聖[せい]なるものとされたこの日[ひ]に、名誉[めいよ]を認[みと]めてください。」"
  3: "すると、あの三度[さんど]も忌[い]まわしい者[もの]が尋[たず]ねた。「天[てん]に、安息日[あんそくび]の日[ひ]を守[まも]るように命[めい]じた支配者[しはいしゃ]がいるのか。」"
  4: "彼らが答[こた]えて言[い]った。「生[い]きておられる主[しゅ]ご自身が、天[てん]におられる支配者[しはいしゃ]であり、七日の安息[あんそく]を守[まも]るように命[めい]じられた方[かた]です。」"
  5: "すると彼[かれ]は言[い]った。「わたしも地上[ちじょう]の支配者[しはいしゃ]であり、武器[ぶき]を取[と]って王[おう]の務[つと]めを果[は]たすように命[めい]じているのだ。」しかし彼[かれ]は、その忌[い]まわしい企[くわだ]てを果[は]たすことはできなかった。"
  6: "ニカノルは、あらゆる高慢[こうまん]さをもって胸[むね]を張[は]り、ユダとその仲間[なかま]たちに対する共通[きょうつう]の戦勝[せんしょう]の記念[きねん]を建[た]てようと決[けっ]めていた。"
  7: "マッカバイオスは、あらゆる希望[きぼう]をもって、主[しゅ]から助[たす]けを受[う]けることを絶[た]えず信[しん]じていた。"
  8: "そして、自分[じぶん]とともにいる者[もの]たちに、異邦人[いほうじん]の進撃[しんげき]を恐[おそ]れず、かつて天[てん]から受[う]けた助[たす]けを心[こころ]に思[おも]い、今[いま]も全能[ぜんのう]の神[かみ]から来[く]る勝利[しょうり]を待[ま]つように勧[すす]めた。"
  9: "そして、律法[りっぽう]と預言者[よげんしゃ]たちの言葉[ことば]で彼らを慰[なぐさ]め、これまで果[は]たしてきた戦[たたか]いを思[おも]い起[おこ]させて、彼らを一層[いっそう]熱心[ねっしん]にした。"
  10: "また、彼らの心[こころ]を奮[ふる]い立[た]たせて、異邦人[いほうじん]の不法[ふほう]と誓[ちか]いの違反[いはん]を指[さ]し示[しめ]しながら、彼らを励[はげ]ました。"
  11: "そして、彼[かれ]は一人[ひとり]一人[ひとり]を、盾[たて]や槍[やり]の安全[あんぜん]ではなく、良[よ]い言葉[ことば]による励[はげ]ましで武装[ぶそう]させ、信[しん]じるに足[た]りる夢[ゆめ]の話[はなし]をして、すべての者[もの]を喜[よろこ]ばせた。"
  12: "彼[かれ]の見[み]たものは次[つぎ]のとおりであった。すなわち、かつて大祭司[だいさいし]であったオニアスを、立派[りっぱ]で善良[ぜんりょう]な人[ひと]、応対[おうたい]は丁寧[ていねい]で気質[きしつ]は穏[おだ]やか、語[かた]り方[かた]もふさわしく、幼[おさな]いころから徳[とく]に属[ぞく]することをすべて身[み]につけてきた人[ひと]として見[み]た。その彼[かれ]が手[て]を差[さ]し伸[の]べて、ユダヤ人[じん]の全[ぜん]体[たい]のために祈[いの]っていたのである。"
  13: "次[つぎ]に、白髪[しらが]と栄光[えいこう]の点[てん]で際立[きわだ]った人[ひと]が現[あら]われ、その周[まわ]りの威厳[いげん]は驚[おどろ]くべき、またこのうえなく立派[りっぱ]なものであった。"
  14: "オニアスが答[こた]えて言[い]った。「この人[ひと]は兄弟[きょうだい]を愛[あい]する者[もの]で、民[たみ]と聖[せい]なる都[みやこ]のために多[おお]く祈[いの]っている。神[かみ]の預言者[よげんしゃ]エレミヤである。」"
  15: "そしてエレミヤは右手[みぎて]を差[さ]し伸[の]べて、金[きん]の剣[けん]をユダに渡[わた]し、手渡[てわた]しながらこう言[い]った。"
  16: "「神[かみ]からの贈[おく]り物[もの]であるこの聖[せい]なる剣[けん]を受[う]け取[と]りなさい。これによってあなたは敵[てき]を砕[くだ]くであろう。」"
  17: "ユダの言葉[ことば]はたいそう立派[りっぱ]で、人[ひと]を勇気[ゆうき]へ駆[か]り立[た]て、若[わか]い者[もの]の魂[たましい]を強[つよ]くすることができるものだったので、彼らは励[はげ]まされ、陣地[じんち]に留[とど]まらず、雄々[おお]しく攻[せ]めかかり、すべての勇気[ゆうき]をもって戦[たたか]いに加[くわ]わって事[こと]を決[き]めようと決心[けっしん]した。都[みやこ]も、聖[せい]なるものも、神殿[しんでん]も危険[きけん]にさらされていたからである。"
  18: "妻[つま]や子[こ]ども、さらに兄弟[きょうだい]や親族[しんぞく]のための戦[たたか]いは、彼らにとっては軽[かる]いものとされた。しかも最大[さいだい]の、そして第一[だいいち]の恐[おそ]れは、汚[けが]された神殿[しんでん]のことであった。"
  19: "都[みやこ]に残[のこ]された者[もの]たちの不安[ふあん]もまた、並[なみ]たいしたものではなかった。野[の]での戦[たたか]いを思[おも]って心[こころ]を騒[さわ]がせていたからである。"
  20: "そして、すべての者[もの]が今[いま]や決着[けっちゃく]を待[ま]ち望[のぞ]み、敵[てき]もすでに近[ちか]づき、軍[ぐん]が整列[せいれつ]させられ、獣[けもの]が適切[てきせつ]な場所[ばしょ]に配置[はいち]され、騎兵[きへい]が両翼[りょうよく]に並[なら]べられたとき、"
  21: "マッカバイオスは、群衆[ぐんしゅう]の多[おお]さと、さまざまに整[ととの]えられた武具[ぶぐ]、獣[けもの]の荒々[あらあら]しさを見[み]て、天[てん]へ向[む]かって手[て]を差[さ]し伸[の]べ、奇跡[きせき]を行[おこな]われる主[しゅ]を呼[よ]び求[もと]めた。彼[かれ]は、武器[ぶき]によるのではなく、ご自分[じぶん]が良[よ]しとさばかれるままに、ふさわしい者[もの]に勝利[しょうり]を与[あた]えられることを知[し]っていたのである。"
  22: "そして、こう呼[よ]び求[もと]めながら言[い]った。「主[しゅ]よ、あなたはユダヤの王[おう]エゼキアスのときにあなたの天使[てんし]を遣[つか]わし、センナヘリブの陣営[じんえい]から十八万五千[じゅうはちまんごせん]人[にん]を殺[ころ]されました。"
  23: "今[いま]も、天[てん]の支配者[しはいしゃ]よ、わたしたちの前[まえ]に良[よ]い天使[てんし]を遣[つか]わして、彼らに恐[おそ]れと震[ふる]えを起こさせてください。"
  24: "あなたの腕[うで]の大[おお]きさによって、あなたの聖[せい]なる民[たみ]に冒瀆[ぼうとく]をもって迫[せま]る者[もの]たちが打[う]ちのめされますように。」このようにして彼[かれ]は祈[いの]りを終[お]えた。"
  25: "ニカノルとその仲間[なかま]たちは、ラッパと鬨[とき]の声[こえ]をあげて近[ちか]づいて来[き]た。"
  26: "しかしユダとその仲間[なかま]たちは、呼[よ]び求[もと]めと祈[いの]りをもって敵[てき]と戦[たたか]った。"
  27: "手[て]で戦[たたか]い、心[こころ]で神[かみ]に祈[いの]りながら、彼らは神[かみ]の顕現[けんげん]に大[おお]いに喜[よろこ]びつつ、三万五千[さんまんごせん]人[にん]を下[くだ]らない者[もの]を倒[たお]した。"
  28: "戦[たたか]いを終[お]えて喜[よろこ]びながら引[ひ]き揚[あ]げる途中[とちゅう]、彼らはニカノルが武具[ぶぐ]をつけたまま倒[たお]れているのを見[み]つけた。"
  29: "そして、叫[さけ]びと騒[さわ]ぎの中[なか]、彼らは父[ちち]たちの言葉[ことば]で支配者[しはいしゃ]をほめたたえた。"
  30: "そのとき、市民[しみん]のために体[からだ]も魂[たましい]も先頭[せんとう]に立[た]って戦[たたか]い、若[わか]いころの愛[あい]情[じょう]を同胞[どうほう]のために保[たも]ち続[つづ]けたユダは、ニカノルの首[くび]を切[き]り、手[て]を肩[かた]とともに切[き]ってエルサレムへ運[はこ]ぶように命[めい]じた。"
  31: "そしてそこへ行[い]き、同胞[どうほう]たちと祭司[さいし]たちを呼[よ]び集[あつ]め、祭壇[さいだん]の前[まえ]に立[た]たせて、城塞[じょうさい]から出[で]てきた者[もの]たちも呼[よ]び寄[よ]せた。"
  32: "そして、汚[けが]れたニカノルの首[くび]と、あの冒瀆[ぼうとく]する者[もの]の手[て]とを見[み]せた。その手[て]は、彼[かれ]が全能[ぜんのう]者の聖[せい]なる家[いえ]に向[む]かって差[さ]し伸[の]べ、大[おお]いばりに語[かた]ったものである。"
  33: "また、不敬[ふけい]なニカノルの舌[した]を切[き]り取[と]って、これを鳥[とり]に細[こま]かく切[き]って与[あた]える、と語[かた]り、その愚[おろ]かさへの報[むく]いとして、神殿[しんでん]の前[まえ]に残[のこ]りを吊[つ]るした。"
  34: "人[ひと]々[びと]はみな天[てん]に向[む]かって、現[あら]われた主[しゅ]をほめたたえ、こう言[い]った。「ほむべきかな、ご自分[じぶん]の場所[ばしょ]を汚[けが]れなく保[たも]たれた方[かた]。」"
  35: "そして、ニカノルの首[くび]を城塞[じょうさい]にさらし、すべての人[ひと]に明[あき]らかな、主[しゅ]の助[たす]けのしるしとした。"
  36: "そして、すべての者[もの]が共通[きょうつう]の決議[けつぎ]によって、この日[ひ]を決[けっ]して祝[いわ]いのない日[ひ]としてはならないと定[さだ]めた。"
  37: "すなわち、シリアの言葉[ことば]でアダルと呼[よ]ばれる第十二[だいじゅうに]の月[つき]の十三日[じゅうさんにち]を、マルドカイの日[ひ]の一[いち]日前[にちまえ]として、記念[きねん]の日[ひ]としたのである。"
  38: "ニカノルについての事[こと]は、このように運[はこ]んだ。そして、その時[とき]から都[みやこ]はヘブライ人[じん]の手[て]に保[たも]たれたので、わたしもここで言葉[ことば]を終[お]えよう。"
  39: "もしもこれをよく、ふさわしく書き記[しる]したのなら、それがわたしの望[のぞ]みでもあった。もしも貧[まず]しく、ほどほどにすぎないのなら、それはわたしの力[ちから]の及[およ]ぶところであった。"
  40: "というのは、ぶどう酒[しゅ]をそのまま飲[の]むのも、同じように水[みず]だけを飲むのも好[この]ましくない。しかし、ぶどう酒を水[みず]に混[ま]ぜると甘[あま]く、楽[たの]しい恵[めぐ]みを生[しょう]じる。同じように、言葉[ことば]を整[ととの]えることも、この書[しょ]に取[と]り組[く]む者[もの]の耳[みみ]を楽[たの]しませる。ここで終[おわ]りとしよう。"

notes:
  1: "μεταλαβὼν — «узнав (получив известие)»; ἐν τοῖς κατὰ Σαμάρειαν τόποις — «в самарийских местах»; τῇ τῆς καταπαύσεως ἡμέρᾳ — «в день покоя (субботу)» (κατάπαυσις); μετὰ πάσης ἀσφαλείας… ἐπιβαλεῖν — «со всякой безопасностью напасть»."
  2: "τῶν… κατ᾽ ἀνάγκην συνεπομένων αὐτῷ Ιουδαίων — «из поневоле сопровождавших его иудеев»; Μηδαμῶς οὕτως ἀγρίως καὶ βαρβάρως ἀπολέσῃς — «никак не губи так зверски и варварски»; δόξαν… ἀπομέρισον — «славу воздай» (ἀπομερίζω); τῇ προτετιμημένῃ ὑπὸ τοῦ πάντα ἐφορῶντος μεθ᾽ ἁγιότητος ἡμέρᾳ — «дню, предпочтённому Всевидящим со святостью» (προτιμάω). Прямая речь, 「…」 (без вложения)."
  3: "ὁ τρισαλιτήριος — «трижды нечестивый»; ἐπηρώτησεν εἰ ἔστιν ἐν οὐρανῷ δυνάστης — «спросил, есть ли на небе Владыка»; ὁ προστεταχὼς ἄγειν τὴν τῶν σαββάτων ἡμέραν — «повелевший праздновать день суббот»."
  4: "Ἔστιν ὁ κύριος ζῶν — «есть Господь живый»; αὐτὸς ἐν οὐρανῷ δυνάστης — «Сам на небе Владыка»; ὁ κελεύσας ἀσκεῖν τὴν ἑβδομάδα — «повелевший чтить седмицу» (ἀσκέω)."
  5: "Κἀγὼ… δυνάστης ἐπὶ τῆς γῆς — «и я — владыка на земле»; ὁ προστάσσων αἴρειν ὅπλα — «приказывающий брать оружие»; τὰς βασιλικὰς χρείας ἐπιτελεῖν — «царские нужды исполнять»; οὐ κατέσχεν ἐπιτελέσαι τὸ σχέτλιον αὐτοῦ βούλημα — «не смог исполнить своего нечестивого намерения» (σχέτλιος, βούλημα)."
  6: "μετὰ πάσης ἀλαζονείας ὑψαυχενῶν — «со всяким хвастовством поднимая шею (высокомеря)» (ὑψαυχενέω); κοινὸν τῶν περὶ τὸν Ιουδαν συστήσασθαι τρόπαιον — «поставить общий трофей над бывшими с Иудой» (τρόπαιον)."
  7: "ἀδιαλείπτως πεποιθὼς μετὰ πάσης ἐλπίδος — «непрестанно надеясь со всякой надеждой»; ἀντιλήμψεως τεύξασθαι παρὰ τοῦ κυρίου — «получить заступление от Господа» (ἀντίλημψις)."
  8: "μὴ δειλιᾶν τὴν τῶν ἐθνῶν ἔφοδον — «не робеть нашествия язычников» (δειλιάω); τὰ προγεγονότα αὐτοῖς ἀπ᾽ οὐρανοῦ βοηθήματα — «бывшие им прежде с неба помощи»; τὴν παρὰ τοῦ παντοκράτορος… νίκην — «победу от Вседержителя»."
  9: "παραμυθούμενος αὐτοὺς ἐκ τοῦ νόμου καὶ τῶν προφητῶν — «утешая их из закона и пророков» (παραμυθέομαι); προσυπομνήσας… τοὺς ἀγῶνας — «напомнив подвиги (борьбы)»; προθυμοτέρους αὐτοὺς κατέστησεν — «сделал их более ревностными»."
  10: "τοῖς θυμοῖς διεγείρας — «возбудив их дух (ярость)»; τὴν τῶν ἐθνῶν ἀθεσίαν — «нечестие (беззаконие) язычников» (ἀθεσία); τὴν τῶν ὅρκων παράβασιν — «нарушение клятв»."
  11: "καθοπλίσας οὐ τὴν ἀσπίδων καὶ λογχῶν ἀσφάλειαν — «вооружив не безопасностью щитов и копий»; τὴν ἐν τοῖς ἀγαθοῖς λόγοις παράκλησιν — «увещанием в добрых словах»; προσεξηγησάμενος ὄνειρον ἀξιόπιστον — «рассказав достойный веры сон» (ἀξιόπιστος); ὕπαρ τι — «нечто наяву»; ηὔφρανεν — «обрадовал» (εὐφραίνω)."
  12: "ἡ τούτου θεωρία — «его видение» (θεωρία); αἰδήμονα τὴν ἀπάντησιν — «скромного в обращении (ответе)» (αἰδήμων); πρᾶον τὸν τρόπον — «кроткого нравом»; λαλιὰν προιέμενον πρεπ όντως — «речь изрекающего подобающе»; ἐκ παιδὸς ἐκμεμελετηκότα πάντα τὰ τῆς ἀρετῆς οἰκεῖα — «с детства упражнявшегося во всём, что свойственно добродетели» (ἐκμελετάω)."
  13: "πολιᾷ καὶ δόξῃ διαφέροντα — «отличающегося сединой и славой» (πολιά); θαυμαστήν… καὶ μεγαλοπρεπεστάτην τὴν περὶ αὐτὸν ὑπεροχήν — «чудесное и великолепнейшее вокруг него превосходство» (ὑπεροχή)."
  14: "Ὁ φιλάδελφος — «братолюбец» (φιλάδελφος); ὁ πολλὰ προσευχόμενος περὶ τοῦ λαοῦ — «много молящийся о народе»; Ιερεμιας ὁ τοῦ θεοῦ προφήτης — «Иеремия, пророк Божий» (エレミヤ). Слова Онии в 「…」."
  15: "προτείναντα… τὴν δεξιὰν — «простершего правую руку»; ῥομφαίαν χρυσῆν — «меч золотой» (ῥομφαία); προσφωνῆσαι τάδε — «возгласить следующее»."
  16: "Λαβὲ τὴν ἁγίαν ῥομφαίαν δῶρον παρὰ τοῦ θεοῦ — «возьми святой меч, дар от Бога»; δι᾽ ἧς θραύσεις τοὺς ὑπεναντίους — «которым сокрушишь противников» (θραύω)."
  17: "τοῖς Ιουδου λόγοις… δυναμένοις ἐπ᾽ ἀρετὴν παρορμῆσαι — «словами Иуды, могущими побудить к добродетели» (παρορμάω); ψυχὰς νέων ἐπανδρῶσαι — «души юных укрепить (сделать мужами)» (ἐπανδρόω); διέγνωσαν μὴ στρατεύεσθαι — «решили не становиться станом»; ἐμπλακέντες κρῖναι τὰ πράγματα — «вступив в бой, решить дело»; μετὰ πάσης εὐανδρίας — «со всяким мужеством» (εὐανδρία)."
  18: "ὁ περὶ γυναικῶν καὶ τέκνων… ἐν ἥττονι μέρει κείμενος — «[страх] о жёнах и детях… в меньшей части лежащий» (ἥττων); ὁ περὶ τοῦ καθηγιασμένου ναοῦ φόβος — «страх о освящённом храме» (καθαγιάζω)."
  19: "τοῖς ἐν τῇ πόλει κατειλημμένοις — «оставленным (охваченным) в городе»; οὐ πάρεργος ἀγωνία — «немалое (не побочное) беспокойство» (πάρεργος); τῆς ἐν ὑπαίθρῳ προσβολῆς — «о нападении под открытым небом» (ὕπαιθρος)."
  20: "τὴν ἐσομένην κρίσιν — «будущее решение [боя]»; προσμειξάντων τῶν πολεμίων — «когда враги сблизились»; τῆς στρατιᾶς ἐκταγείσης — «когда войско было выстроено» (ἐκτάσσω); τῶν θηρίων ἐπὶ μέρος εὔκαιρον ἀποκατασταθέντων — «когда звери поставлены на удобное место»; τῆς ἵππου κατὰ κέρας τεταγμένης — «когда конница построена по крылам» (κέρας)."
  21: "τὴν τῶν πληθῶν παρουσίαν — «присутствие множеств»; τὴν ποικίλην παρασκευὴν — «пёстрое приготовление»; τὴν τῶν θηρίων ἀγριότητα — «дикость зверей»; ἀνατείνας τὰς χεῖρας — «простерев руки»; τὸν τερατοποιὸν κύριον — «чудотворящего Господа» (τερατοποιός); οὐκ ἔστιν δι᾽ ὅπλων… τοῖς ἀξίοις περιποιεῖται τὴν νίκην — «не оружием… достойным доставляет победу» (περιποιέω)."
  22: "ἀπέστειλας τὸν ἄγγελόν σου ἐπὶ Εζεκιου τοῦ βασιλέως — «послал Ангела Твоего при Езекии царе» (エゼキアス); ἀνεῖλεν ἐκ τῆς παρεμβολῆς Σενναχηριμ εἰς ἑκατὸν ὀγδοήκοντα πέντε χιλιάδας — «убил из лагеря Сеннахирима до ста восьмидесяти пяти тысяч». Начало молитвы в 「…」."
  23: "δυνάστα τῶν οὐρανῶν — «Владыко небес»; ἀπόστειλον ἄγγελον ἀγαθὸν ἔμπροσθεν ἡμῶν — «пошли доброго ангела пред нами»; εἰς δέος καὶ τρόμον — «в страх и трепет»."
  24: "μεγέθει βραχίονός σου — «величием мышцы Твоей» (βραχίων); καταπλαγείησαν — «да будут поражены» (καταπλήσσω); οἱ μετὰ βλασφημίας παραγινόμενοι ἐπὶ τὸν ἅγιόν σου λαόν — «приходящие с хулой на святой народ Твой»; ἐν τούτοις ἔληξεν — «на этом кончил»."
  25: "μετὰ σαλπίγγων καὶ παιάνων — «с трубами и победными песнями (пеанами)» (παιάν); προσῆγον — «приближались»."
  26: "μετὰ ἐπικλήσεως καὶ εὐχῶν — «с призыванием и молитвами»; συνέμειξαν τοῖς πολεμίοις — «сошлись с врагами»."
  27: "ταῖς μὲν χερσὶν ἀγωνιζόμενοι, ταῖς δὲ καρδίαις… εὐχόμενοι — «руками сражаясь, сердцами молясь»; κατέστρωσαν οὐδὲν ἧττον μυριάδων τριῶν καὶ πεντακισχιλίων — «повергли не менее тридцати пяти тысяч»; τῇ τοῦ θεοῦ… ἐπιφανείᾳ — «явлением Божиим»."
  28: "γενόμενοι ἀπὸ τῆς χρείας — «отойдя от дела (боя)»; ἀναλύοντες — «возвращаясь» (ἀναλύω); προπεπτωκότα Νικάνορα σὺν τῇ πανοπλίᾳ — «Никанора павшего со всеоружием» (πανοπλία)."
  29: "γενομένης… κραυγῆς καὶ ταραχῆς — «когда поднялся крик и смятение»; τὸν δυνάστην τῇ πατρίῳ φωνῇ — «Владыку на отеческом языке»."
  30: "ὁ καθ᾽ ἅπαν σώματι καὶ ψυχῇ πρωταγωνιστὴς ὑπὲρ τῶν πολιτῶν — «первоподвижник за граждан телом и душой» (πρωταγωνιστής); ὁ τὴν τῆς ἡλικίας εὔνοιαν εἰς ὁμοεθνεῖς διαφυλάξας — «сохранивший любовь своих лет к одноплеменникам» (εὔνοια); τὴν τοῦ Νικάνορος κεφαλὴν ἀποτεμόντας — «отсекши голову Никанора»; τὴν χεῖρα σὺν τῷ ὤμῳ — «руку с плечом»."
  31: "συγκαλέσας τοὺς ὁμοεθνεῖς καὶ τοὺς ἱερεῖς — «созвав одноплеменников и священников»; πρὸ τοῦ θυσιαστηρίου στήσας — «поставив пред жертвенником»; μετεπέμψατο τοὺς ἐκ τῆς ἄκρας — «призвал бывших из крепости» (μεταπέμπομαι, ἄκρα)."
  32: "τὴν τοῦ μιαροῦ Νικάνορος κεφαλήν — «голову скверного Никанора»; τὴν χεῖρα τοῦ δυσφήμου — «руку хульного» (δύσφημος); ἣν ἐκτείνας… ἐμεγαλαύχησεν — «которую простерев… хвалился» (μεγαλαυχέω)."
  33: "τὴν γλῶσσαν… ἐκτεμὼν — «язык вырезав» (ἐκτέμνω); κατὰ μέρος δώσειν τοῖς ὀρνέοις — «по частям дать птицам»; τὰ δ᾽ ἐπίχειρα τῆς ἀνοίας — «возмездие (произведения рук) безумия» (ἐπίχειρα); κατέναντι τοῦ ναοῦ κρεμάσαι — «напротив храма повесить»."
  34: "εἰς τὸν οὐρανὸν εὐλόγησαν τὸν ἐπιφανῆ κύριον — «к небу благословили явного Господа» (ἐπιφανής); Εὐλογητὸς ὁ διατηρήσας τὸν ἑαυτοῦ τόπον ἀμίαντον — «благословен сохранивший место Своё неосквернённым» (ἀμίαντος)."
  35: "ἐξέδησεν… τὴν τοῦ Νικάνορος προτομήν — «вывесил голову (бюст) Никанора» (προτομή); ἐκ τῆς ἄκρας — «из крепости»; ἐπίδηλον πᾶσιν… σημεῖον — «явное всем знамение» (ἐπίδηλος)."
  36: "ἐδογμάτισαν… μετὰ κοινοῦ ψηφίσματος — «постановили общим приговором»; μηδαμῶς ἐᾶσαι ἀπαρασήμαντον τήνδε τὴν ἡμέραν — «никак не оставить этот день без обозначения (торжества)» (ἀπαρασήμαντος). Здесь по слав. стих кончается; продолжение — наш 15:37."
  37: "τὴν τρισκαιδεκάτην τοῦ δωδεκάτου μηνός — «тринадцатый день двенадцатого месяца»; Αδαρ λέγεται τῇ Συριακῇ φωνῇ — «называется по-сирийски Адар» (アダル); πρὸ μιᾶς ἡμέρας τῆς Μαρδοχαικῆς ἡμέρας — «за один день до Мардохеева дня» (Мордехай, マルドカイ). В gr это конец ст. 36; в слав. отдельный стих (слав. 15:37)."
  38: "τῶν… κατὰ Νικάνορα χωρησάντων οὕτως — «дела с Никанором так произошли»; κρατηθείσης τῆς πόλεως ὑπὸ τῶν Εβραίων — «когда город удержан евреями»; αὐτὸς αὐτόθι τὸν λόγον καταπαύσω — «я здесь окончу слово»."
  39: "εἰ μὲν καλῶς εὐθίκτως τῇ συντάξει — «если хорошо и складно в сочинении» (εὔθικτος); τοῦτο καὶ αὐτὸς ἤθελον — «этого и я желал»; εἰ δὲ εὐτελῶς καὶ μετρίως — «если же скудно и умеренно» (εὐτελής); τοῦτο ἐφικτὸν ἦν μοι — «это было достижимо для меня» (ἐφικτός)."
  40: "καθάπερ… οἶνον κατὰ μόνας πίνειν, ὡσαύτως δὲ καὶ ὕδωρ πάλιν πολέμιον — «как вино в одиночку пить, так и воду опять — враждебно»; οἶνος ὕδατι συγκερασθεὶς ἡδὺς καὶ ἐπιτερπῆ τὴν χάριν ἀποτελεῖ — «вино, смешанное с водой, сладкое и приятную благодать производит» (συγκεράννυμι); τὸ τῆς κατασκευῆς τοῦ λόγου τέρπει τὰς ἀκοάς — «строй (устроение) слова услаждает слух» (κατασκευή); ἐνταῦθα δὲ ἔσται ἡ τελευτή — «здесь да будет конец»."
