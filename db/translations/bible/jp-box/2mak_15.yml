# jp-box, 2 Маккавейская, глава 15. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной: 40 стихов (у gr — 39). Слав. делит gr 15:36
# на два стиха: наш 15:36 = «постановили не оставлять день сей без торжества»,
# наш 15:37 = «иметь же праздником тринадцатый день двенадцатого месяца, Адар,
# за день до Мардохеева дня» (= хвост gr 15:36); далее наш 15:38–40 = gr 15:37–39.
# Это оговорённый добавочный стих по слав.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1–5 Никанор хочет напасть в субботу и его богохульство; 6–11 вера
# Иуды и его речь; 12–16 сон об Онии и Иеремии, золотой меч; 17–24 Иудеи
# решаются на бой, молитва Иуды при Езекии и Сеннахириме; 25–28 сражение и гибель
# Никанора; 29–35 торжество, голова и рука Никанора; 36–40 установление праздника
# и заключение автора.
# Голоса: 2 — речь иудеев «…»; 3 — вопрос Никанора «…»; 4 — ответ иудеев
# «…»; 5 — слова Никанора «…»; 14 — слова Онии «…»; 16 — слова Иеремии «…»;
# 22–24 молитва Иуды — 「…」 (закрывается в 24); 34 — слова всех «…».
# Имена: ニカノル, イウダ, オニアス, エレミヤ, エゼキアス, センナヘリブ, アダル,
# マルドカイ — новое; エルサレム, サマリア.

