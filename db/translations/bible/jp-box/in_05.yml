# jp-box, Евангелие от Иоанна, глава 5. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 5: исцеление расслабленного при купальне (1–9), спор об субботе (10–18),
# речь Христа о равенстве с Отцом, о суде и о свидетельствах (19–47).
# Церковные чтения: 5:3б (ожидание движения воды), 5:4 целиком (ангел),
# 5:7 (ναί), 5:16 (искали убить Его), 5:28 (глас Сына Божия) — в 〔…〕.
# Пояснительное «Отец» при «Пославшем Меня» (5:30) не помечено: 方 и так
# обозначает Отца, по-японски добавка ничего не меняет.
# Красное: 5:6, 5:8, 5:14, 5:17, 5:19–47. 5:18 — слова евангелиста, не красные.
# jp-ni не использовался.

