verses:
  1: "その後[のち]、ユダヤ人[じん]の祭[まつ]りがあり、イエスはエルサレムへ上[のぼ]られた。"
  2: "エルサレムには、羊[ひつじ]の門[もん]のそばに、ヘブライ語[ご]でベテスダ⟨「ベテスダ」はヘブライ語[ご]の地名[ちめい]で、意味[いみ]は定[さだ]かでない。「慈[いつく]しみの家[いえ]」の意[い]とする説[せつ]もある。⟩と呼[よ]ばれる池[いけ]があり、五[いつ]つの回廊[かいろう]があった。"
  3: "これらの回廊[かいろう]の中[なか]には、病[やまい]の人[ひと]、目[め]の見[み]えない人[ひと]、足[あし]の不自由[ふじゆう]な人[ひと]、体[からだ]の衰[おとろ]えた人[ひと]が大勢[おおぜい]横[よこ]たわっていた。〔水[みず]が動[うご]くのを待[ま]っていた。〕"
  4: "〔主[しゅ]の天使[てんし]が時[とき]が来[く]ると池[いけ]に下[くだ]って水[みず]を動[うご]かし、水[みず]が動[うご]いた後[あと]で先[ま]ず池[いけ]に入[はい]った者[もの]は、どんな病[やまい]にかかっていても癒[いや]された。〕"
  5: "そこに、三十八[さんじゅうはち]年[ねん]もの間[あいだ]、病[やまい]を患[わずら]っている人[ひと]がいた。"
  6: "イエスは、その人[ひと]が横[よこ]たわっているのをご覧[らん]になり、もう長[なが]い間[あいだ]患[わずら]っていることを知[し]って、言[い]われた。「<j>よくなりたいか。</j>」"
  7: "病人[びょうにん]は答[こた]えた。「主[しゅ]よ、〔そのとおりです。〕水[みず]が動[うご]いたとき、わたしを池[いけ]に入[い]れてくれる人[ひと]がありません。わたしが行[い]くうちに、ほかの人[ひと]が先[さき]に下[くだ]りてしまうのです。」"
  8: "イエスは言[い]われた。「<j>起[お]き上[あ]がり、床[とこ]を取[と]って歩[ある]きなさい。</j>」"
  9: "その人[ひと]はたちまち癒[いや]され、床[とこ]を取[と]って歩[ある]き出[だ]した。その日[ひ]は安息日[あんそくび]であった。"
  10: "ユダヤ人[じん]たちは、癒[いや]された人[ひと]に言[い]った。「今日[きょう]は安息日[あんそくび]だ。床[とこ]を取[と]ることは許[ゆる]されない。」"
  11: "その人[ひと]は答[こた]えた。「わたしを癒[いや]した方[かた]が、『床[とこ]を取[と]って歩[ある]け』と言[い]いました。」"
  12: "彼[かれ]らは尋[たず]ねた。「あなたに『取[と]って歩[ある]け』と言[い]ったその人[ひと]は、誰[だれ]か。」"
  13: "しかし、癒[いや]された人[ひと]は、その方[かた]が誰[だれ]か知[し]らなかった。その場所[ばしょ]には人[ひと]が多[おお]くいたので、イエスはその中[なか]を離[はな]れて行[い]かれたからである。"
  14: "その後[のち]、イエスは神殿[しんでん]でその人[ひと]を見[み]つけ、言[い]われた。「<j>見[み]なさい、あなたはすっかりよくなった。もう罪[つみ]を犯[おか]してはならない。もっと悪[わる]いことが、あなたに起[お]こらないように。</j>」"
  15: "その人[ひと]は行[い]って、自分[じぶん]を癒[いや]したのはイエスであるとユダヤ人[じん]たちに告[つ]げた。"
  16: "そのためユダヤ人[じん]たちはイエスを迫害[はくがい]し、〔イエスを殺[ころ]そうと図[はか]り〕、安息日[あんそくび]にこのようなことをしておられたからである。"
  17: "イエスは彼[かれ]らに答[こた]えて言[い]われた。「<j>わたしの父[ちち]は今[いま]に至[いた]るまで働[はたら]いておられ、わたしも働[はたら]く。</j>」"
  18: "そこでユダヤ人[じん]たちは、ますますイエスを殺[ころ]そうと考[かんが]えた。安息日[あんそくび]を破[やぶ]っただけでなく、神[かみ]をご自身[じしん]の父[ちち]と呼[よ]んで、自分[じぶん]を神[かみ]と等[ひと]しくしたからである。"
  19: "イエスは彼[かれ]らに答[こた]えて言[い]われた。「<j>よくよく言[い]っておく。子[こ]は、父[ちち]がなさるのを見[み]ないかぎり、自分[じぶん]からは何[なに]もできない。父[ちち]がなさることは、子[こ]も同[おな]じように行[おこな]うのである。</j>」"
  20: "「<j>父[ちち]は子[こ]を愛[あい]して、ご自身[じしん]がなさることをすべて子[こ]にお見[み]せになる。そして、これより大[おお]きな業[わざ]をお見[み]せになって、あなたがたが驚[おどろ]くためである。</j>」"
  21: "「<j>父[ちち]が死[し]んだ者[もの]を起[お]こして生[い]かされるように、子[こ]も、自分[じぶん]が望[のぞ]む者[もの]を生[い]かす。</j>」"
  22: "「<j>父[ちち]は誰[だれ]をも裁[さば]かない。裁[さば]きはすべて子[こ]に委[ゆだ]ねられた。</j>」"
  23: "「<j>それは、すべての人[ひと]が、父[ちち]を敬[うやま]うと同[おな]じように、子[こ]をも敬[うやま]うためである。子[こ]を敬[うやま]わない者[もの]は、子[こ]をお遣[つか]わしになった父[ちち]をも敬[うやま]わない。</j>」"
  24: "「<j>よくよく言[い]っておく。わたしの言葉[ことば]を聞[き]いて、わたしをお遣[つか]わしになった方[かた]を信[しん]じる者[もの]は、永遠[えいえん]の命[いのち]を持[も]っている。裁[さば]きを受[う]けることなく、死[し]から命[いのち]へと移[うつ]ったのである。</j>」"
  25: "「<j>よくよく言[い]っておく。死[し]んだ者[もの]が神[かみ]の子[こ]の声[こえ]を聞[き]く時[とき]が来[く]る。今[いま]が、その時[とき]である。聞[き]いた者[もの]は生[い]きる。</j>」"
  26: "「<j>父[ちち]がご自身[じしん]の内[うち]に命[いのち]を持[も]っておられるように、子[こ]にも、ご自身[じしん]の内[うち]に命[いのち]を持[も]つことをお与[あた]えになった。</j>」"
  27: "「<j>また、裁[さば]きを行[おこな]う権限[けんげん]をお与[あた]えになった。人[ひと]の子[こ]であるからである。</j>」"
  28: "「<j>このことに驚[おどろ]いてはならない。墓[はか]の中[なか]にいる者[もの]がすべて、〔神[かみ]の子[こ]の〕声[こえ]を聞[き]く時[とき]が来[く]る。</j>」"
  29: "「<j>そして、善[ぜん]を行[おこな]った者[もの]は命[いのち]の復活[ふっかつ]へ、悪[あく]を行[おこな]った者[もの]は裁[さば]きの復活[ふっかつ]へと出[で]て来[く]る。</j>」"
  30: "「<j>わたしは自分[じぶん]からは何[なに]もできない。聞[き]いたとおりに裁[さば]くので、わたしの裁[さば]きは正[ただ]しい。自分[じぶん]の望[のぞ]みではなく、わたしをお遣[つか]わしになった方[かた]の望[のぞ]みを求[もと]めるからである。</j>」"
  31: "「<j>もしわたしが自分[じぶん]について証[あかし]するなら、その証[あかし]は真実[しんじつ]ではない。</j>」"
  32: "「<j>わたしについて証[あかし]する別[べつ]の方[かた]がおられる。その方[かた]がわたしについてなさる証[あかし]が真実[しんじつ]であることを、わたしは知[し]っている。</j>」"
  33: "「<j>あなたがたはヨハネのもとへ人[ひと]を遣[つか]わした。ヨハネは真理[しんり]のために証[あかし]した。</j>」"
  34: "「<j>わたしは人[ひと]からの証[あかし]を受[う]けているのではない。ただ、あなたがたが救[すく]われるために、これらのことを言[い]っている。</j>」"
  35: "「<j>ヨハネは燃[も]えて輝[かがや]くともし火[び]であった。あなたがたはしばらくの間[あいだ]、その光[ひかり]の中[なか]で喜[よろこ]ぼうとした。</j>」"
  36: "「<j>しかし、わたしにはヨハネの証[あかし]よりも大[おお]きな証[あかし]がある。父[ちち]がわたしに成[な]し遂[と]げさせようとお与[あた]えになった業[わざ]、この業[わざ]そのものが、父[ちち]がわたしをお遣[つか]わしになったことを証[あかし]している。</j>」"
  37: "「<j>わたしをお遣[つか]わしになった父[ちち]ご自身[じしん]が、わたしについて証[あかし]しておられる。あなたがたは、その声[こえ]を聞[き]いたこともなく、その姿[すがた]を見[み]たこともない。</j>」"
  38: "「<j>また、その言葉[ことば]があなたがたの内[うち]にとどまっていない。お遣[つか]わしになった方[かた]を、あなたがたが信[しん]じないからである。</j>」"
  39: "「<j>聖書[せいしょ]を探[さぐ]りなさい。あなたがたは、そこに永遠[えいえん]の命[いのち]があると思[おも]っている。そして、わたしについて証[あかし]しているのは、ほかならぬその聖書[せいしょ]である。</j>」"
  40: "「<j>しかし、あなたがたは命[いのち]を得[え]ようとして、わたしのもとへ来[こ]ようとしない。</j>」"
  41: "「<j>わたしは人[ひと]からの栄光[えいこう]を受[う]けない。</j>」"
  42: "「<j>しかし、わたしはあなたがたを知[し]っている。あなたがたの内[うち]に神[かみ]への愛[あい]がない。</j>」"
  43: "「<j>わたしは父[ちち]の名[な]によって来[き]たのに、あなたがたはわたしを受[う]け入[い]れない。もしほかの者[もの]が自分[じぶん]の名[な]によって来[き]たら、その者[もの]は受[う]け入[い]れるだろう。</j>」"
  44: "「<j>互[たが]いに栄光[えいこう]を受[う]け合[あ]い、唯一[ゆいいつ]の神[かみ]からの栄光[えいこう]を求[もと]めないあなたがたが、どうして信[しん]じることができようか。</j>」"
  45: "「<j>わたしが父[ちち]の前[まえ]であなたがたを訴[うった]えると思[おも]ってはならない。あなたがたを訴[うった]える者[もの]はモーセである。あなたがたが望[のぞ]みをかけている、そのモーセである。</j>」"
  46: "「<j>もしあなたがたがモーセを信[しん]じるなら、わたしをも信[しん]じるはずである。モーセはわたしについて書[か]いたからである。</j>」"
  47: "「<j>しかし、その書[しょ]いたものを信[しん]じないなら、どうしてわたしの言葉[ことば]を信[しん]じるだろうか。</j>」"

notes:
  2: "Сноска ベテスダ — первое упоминание в корпусе. Βηθζαθά (в иных рукописях Βηθεσδά; слав. Вифезда); ベテスダ. πέντε στοάς — пять крытых галерей; 五つの回廊 (у jp-joc эти слова стоят в 5:3)."
  3: "В критической базе стих кончается на ξηρῶν; ἐκδεχομένων τὴν τοῦ ὕδατος κίνησιν («ожидавших движения воды») нет — церковное чтение (Елизаветинская, jp-joc「水の動くを待てり」) взято в 〔…〕."
  4: "Стиха нет в критической базе (ангел, возмущающий воду). Церковь его читает (Елизаветинская, jp-joc), поэтому стих целиком в 〔…〕."
  5: "τριάκοντα [καὶ] ὀκτὼ ἔτη — тридцать восемь лет; 三十八年もの間."
  7: "ἄνθρωπον οὐκ ἔχω — «человека не имею», то есть нет того, кто помог бы; わたしを池に入れてくれる人がありません. В критической базе ответ начинается с κύριε; церковный текст (Елизаветинская «ей, Господи», jp-joc「然り」) читает ναί, κύριε — 〔そのとおりです。〕."
  10: "ἆραι τὸν κράβαττον — 床を取る. κραβάττος — постель-носилки (уже в Мк 2:4)."
  14: "μηκέτι ἁμάρτανε — «больше не греши»; もう罪を犯してはならない. χεῖρόν τι — «нечто худшее»; もっと悪いこと."
  16: "В критической базе только ἐδίωκον («гнали»); καὶ ἐζήτουν αὐτὸν ἀποκτεῖναι («и искали убить Его») — церковное чтение (Елизаветинская, jp-joc「殺さんことを謀れり」), взято в 〔…〕."
  17: "ἕως ἄρτι — «до сих пор»; 今に至るまで. Субботний покой не отменяет действия Отца."
  18: "ἴσον ἑαυτὸν ποιῶν τῷ θεῷ — «делая Себя равным Богу»; 自分を神と等しくした. Стих — слова евангелиста, не красные."
  19: "ἀμὴν ἀμὴν λέγω ὑμῖν — よくよく言っておく (в этой книге; в синоптиках — はっきり言っておく). ἀφ᾽ ἑαυτοῦ — 自分から."
  24: "κρίσις — 裁き; μεταβέβηκεν — перфект «перешёл»; 移ったのである."
  25: "οἱ νεκροί — 死んだ者; «мёртвые услышат» не сглажено."
  27: "ὅτι υἱὸς ἀνθρώπου ἐστίν — «потому что Он Сын Человеческий»; основание права суда, не смягчено."
  28: "В критической базе τῆς φωνῆς αὐτοῦ («голос Его»); церковный текст (Елизаветинская «глас Сына Божия», jp-joc「神の子の聲」) читает τῆς φωνῆς τοῦ υἱοῦ τοῦ θεοῦ — 〔神の子の〕."
  29: "ἀνάστασις ζωῆς / ἀνάστασις κρίσεως — 命の復活 / 裁きの復活; буквально."
  33: "ἀπεστάλκατε — перфект «вы послали»; 人を遣わした."
  35: "ὁ λύχνος ὁ καιόμενος καὶ φαίνων — 燃えて輝くともし火."
  39: "ἐραυνᾶτε можно понять и как повелительное («исследуйте»), и как изъявительное («вы исследуете»); по-японски двусмысленность не сохранить. Взято повелительное — как в церковном тексте (Елизаветинская «Испытайте», jp-joc「探れ」); изъявительное чтение отмечено здесь."
  43: "ἐν τῷ ὀνόματι τοῦ πατρός μου — 父の名によって."
  44: "δόξαν παρὰ ἀλλήλων λαμβάνοντες — 互いに栄光を受け合い. τὴν δόξαν τὴν παρὰ τοῦ μόνου θεοῦ — 唯一の神からの栄光."
  45: "κατηγορήσω / ὁ κατηγορῶν — 訴える; Моисей как обвинитель."
  47: "γράμματα / ῥήματα — 書いたもの / 言葉."
