verses:
  1: "イスラエルの子[こ]らは旅立[たびだ]ち、モアブの西[にし]、ヨルダン川[がわ]のそば、エリコに面[めん]した所[ところ]に宿営[しゅくえい]した。"
  2: "バラクは、セポルの子[こ]で、イスラエルがアモリ人[じん]にしたことをすべて見[み]た。"
  3: "モアブはこの民[たみ]をひどく恐[おそ]れた。彼[かれ]らが多[おお]かったからである。モアブはイスラエルの子[こ]らのゆえに心[こころ]を痛[い]めた。"
  4: "モアブはミディアンの長老[ちょうろう]たちに言[い]った。「今[いま]、この会衆[かいしゅう]は、牛[うし]が野[の]の青草[あおくさ]をなめ尽[つ]くすように、私たちの周[まわ]りのすべてをなめ尽[つ]くす。」バラクは、セポルの子[こ]で、そのころモアブの王[おう]であった。"
  5: "彼[かれ]は使者[ししゃ]たちを、ベオルの子[こ]バラムのもとへ、すなわちその民[たみ]の子[こ]らの地[ち]の川[かわ]のほとりにあるファトゥラへ送[おく]り、彼[かれ]を呼[よ]ぶために言[い]った。「見[み]よ、エジプトから民[たみ]が出[で]て来[き]た。見[み]よ、彼[かれ]らは地[ち]の面[おもて]を覆[おお]い、私[わたし]のそばに居座[いすわ]っている。"
  6: "今[いま]、来[き]て、私[わたし]のためにこの民[たみ]を呪[のろ]ってくれ。彼[かれ]らは私[わたし]たちよりも強[つよ]いからだ。もしかすると、私たちは彼[かれ]らのうちの者[もの]を打[う]つことができ、私[わたし]は彼[かれ]らをこの地[ち]から追[お]い出[だ]せるかもしれない。私[わたし]は、あなたが祝福[しゅくふく]する者[もの]は祝福[しゅくふく]され、あなたが呪[のろ]う者[もの]は呪[のろ]われることを知[し]っている。」"
  7: "モアブの長老[ちょうろう]たちとミディアンの長老[ちょうろう]たちは、手[て]に占[うらな]いの品[しな]を携[たずさ]えて行[い]き、バラムのもとに来[き]て、バラクの言葉[ことば]を彼[かれ]に告[つ]げた。"
  8: "彼[かれ]は彼[かれ]らに言[い]った。「ここで夜[よる]を過[す]ごしなさい。主[しゅ]が私[わたし]に語[かた]られることに応[おう]じて、あなたがたに答[こた]えよう。」モアブの長[おさ]たちはバラムのもとに泊[と]まった。"
  9: "神[かみ]はバラムのもとに来[き]て言[い]われた。「あなたのもとにいるこの人[ひと]々[びと]は何者[なにもの]か。」"
  10: "バラムは神[かみ]に言[い]った。「モアブの王[おう]、セポルの子[こ]バラクが、私[わたし]のもとに彼[かれ]らを送[おく]って、こう言[い]いました。"
  11: "『見[み]よ、エジプトから出[で]て来[き]た民[たみ]が、地[ち]の面[おもて]を覆[おお]っている。今[いま]、来[き]て、私[わたし]のために彼[かれ]を呪[のろ]ってくれ。もしかすると、私[わたし]は彼[かれ]を打[う]ち、地[ち]から追[お]い出[だ]せるかもしれない』。」"
  12: "神[かみ]はバラムに言[い]われた。「彼[かれ]らとともに行[い]ってはならない。その民[たみ]を呪[のろ]ってもならない。彼[かれ]らは祝福[しゅくふく]されているからである。」"
  13: "バラムは朝[あさ]早[はや]く起[お]きて、バラクの長[おさ]たちに言[い]った。「あなたがたの主君[しゅくん]のもとへ帰[かえ]りなさい。神[かみ]は私[わたし]があなたがたとともに行[い]くのを許[ゆる]されない。」"
  14: "モアブの長[おさ]たちは立[た]ってバラクのもとへ行[い]き、言[い]った。「バラムは私[わたし]たちとともに来[こ]ることを望[のぞ]まなかった。」"
  15: "バラクはさらに、これらよりも多[おお]く、また尊[とうと]い長[おさ]たちを送[おく]った。"
  16: "彼[かれ]らはバラムのもとに来[き]て言[い]った。「バラク、セポルの子[こ]がこう言[い]う。どうか、私[わたし]のもとへ来[く]るのをためらわないでください。"
  17: "私[わたし]はあなたを厚[あつ]く遇[もてな]す。あなたが私[わたし]に言[い]うことは何[なん]でもする。どうか来[き]て、私[わたし]のためにこの民[たみ]を呪[のろ]ってください。」"
  18: "バラムは答[こた]えて、バラクの長[おさ]たちに言[い]った。「たとえバラクが、銀[ぎん]と金[きん]に満[み]ちたその家[いえ]を私[わたし]に与[あた]えても、私[わたし]は、主[しゅ]なる神[かみ]の言葉[ことば]を越[こ]えて、私[わたし]の心[こころ]で小[ちい]さなことでも大[おお]きなことでも行[おこな]うことはできない。"
  19: "しかし今[いま]、あなたがたも今夜[こんや]ここに残[のこ]りなさい。私[わたし]は、主[しゅ]がさらに私[わたし]に語[かた]られることを知[し]ろう。」"
  20: "神[かみ]は夜[よる]、バラムのもとに来[き]て言[い]われた。「もしこの人[ひと]々[びと]があなたを呼[よ]びに来[き]たのなら、立[た]って、彼[かれ]らとともに行[い]きなさい。ただし、私[わたし]があなたに語[かた]る言葉[ことば]、それを行[おこな]いなさい。」"
  21: "バラムは朝[あさ]早[はや]く起[お]きて、雌[め]ろばに鞍[くら]を置[お]き、モアブの長[おさ]たちとともに出[で]かけた。"
  22: "彼[かれ]が行[い]ったので、神[かみ]は怒[いか]りを燃[も]やされた。神[かみ]の使[つか]いは彼[かれ]を妨[さまた]げるために道[みち]に立[た]った。彼[かれ]は雌[め]ろばに乗[の]り、二人[ふたり]の従者[じゅうしゃ]が彼[かれ]とともにいた。"
  23: "雌[め]ろばは、神[かみ]の使[つか]いが手[て]に抜[ぬ]き身[み]の剣[つるぎ]を持[も]って道[みち]に立[た]っているのを見[み]て、道[みち]からそれて野[の]へ入[はい]った。バラムは雌[め]ろばを打[う]って、道[みち]に戻[もど]そうとした。"
  24: "神[かみ]の使[つか]いはぶどう畑[ばたけ]の畝[うね]の間[あいだ]に立[た]った。こちら側[がわ]に垣[かき]、あちら側[がわ]にも垣[かき]があった。"
  25: "雌[め]ろばは神[かみ]の使[つか]いを見[み]て、壁[かべ]に身[み]を押[お]し付[つ]け、バラムの足[あし]を壁[かべ]に押[お]し付[つ]けた。彼[かれ]はさらに雌[め]ろばを打[う]ち加[くわ]えた。"
  26: "神[かみ]の使[つか]いはさらに進[すす]んで、右[みぎ]にも左[ひだり]にもそれる所[ところ]のない狭[せま]い場所[ばしょ]に立[た]った。"
  27: "雌[め]ろばは神[かみ]の使[つか]いを見[み]て、バラムの下[した]に伏[ふ]した。バラムは怒[いか]りを燃[も]やし、杖[つえ]で雌[め]ろばを打[う]った。"
  28: "神[かみ]は雌[め]ろばの口[くち]を開[ひら]かれた。雌[め]ろばはバラムに言[い]った。「私[わたし]があなたに何[なに]をしたというので、あなたはもう三度[さんど]も私[わたし]を打[う]つのか。」"
  29: "バラムは雌[め]ろばに言[い]った。「お前[まえ]が私[わたし]を嘲[あざけ]ったからだ。もし私[わたし]の手[て]に剣[つるぎ]があったなら、今[いま]すぐにお前を刺[さ]し殺[ころ]していただろう。」"
  30: "雌[め]ろばはバラムに言[い]った。「私[わたし]はあなたの雌[め]ろばではないか。あなたは若[わか]いときから今日[きょう]まで、私[わたし]に乗[の]ってきた。私[わたし]がこれまで、そのようにあなたに振[ふ]る舞[ま]ったことがあったか。」彼[かれ]は言[い]った。「ない。」"
  31: "神[かみ]はバラムの目[め]を開[ひら]かれた。彼[かれ]は、主[しゅ]の使[つか]いが手[て]に抜[ぬ]き身[み]の剣[つるぎ]を持[も]って道[みち]に立[た]っているのを見[み]た。彼[かれ]は頭[あたま]を下[さ]げ、顔[かお]を地[ち]につけて拝[おが]んだ。"
  32: "神[かみ]の使[つか]いは彼[かれ]に言[い]った。「なぜ、あなたはもう三度[さんど]も雌[め]ろばを打[う]ったのか。見[み]よ、私[わたし]はあなたを妨[さまた]げるために出[で]て来[き]た。あなたの道[みち]は私[わたし]の前[まえ]で良[よ]くないからである。"
  33: "雌[め]ろばは私[わたし]を見[み]て、もう三度[さんど]も私[わたし]からそれた。もしそれが私[わたし]からそれなかったなら、今[いま]、私[わたし]はお前[まえ]を殺[ころ]し、雌[め]ろばは生[い]かしておいたであろう。」"
  34: "バラムは主[しゅ]の使[つか]いに言[い]った。「私[わたし]は罪[つみ]を犯[おか]した。あなたが道[みち]で私[わたし]に立[た]ち向[む]かっていることを知[し]らなかったからだ。今[いま]、もしそれがあなたの目[め]にかなわないなら、私[わたし]は引[ひ]き返[かえ]す。」"
  35: "神[かみ]の使[つか]いはバラムに言[い]った。「この人[ひと]々[びと]とともに行[い]きなさい。ただし、私[わたし]があなたに語[かた]る言葉[ことば]、それだけを語[かた]るようにしなさい。」バラムはバラクの長[おさ]たちとともに去[さ]った。"
  36: "バラクは、バラムが来[き]たことを聞[き]いて、アルノンの領界[りょうかい]にあるモアブの町[まち]へ、彼[かれ]を迎[むか]えに出[で]た。それは領界[りょうかい]の端[はし]にある。"
  37: "バラクはバラムに言[い]った。「私[わたし]はあなたを呼[よ]ぶために人[ひと]を送[おく]ったではないか。なぜあなたは私[わたし]のもとへ来[こ]なかったのか。私[わたし]は本当[ほんとう]にあなたを厚[あつ]く遇[もてな]すことができないとでもいうのか。」"
  38: "バラムはバラクに言[い]った。「見[み]よ、私[わたし]はあなたのもとに来[き]た。今[いま]、私[わたし]が何[なに]かを語[かた]ることができるだろうか。神[かみ]が私[わたし]の口[くち]に置[お]かれる言葉[ことば]、それを私[わたし]は語[かた]る。」"
  39: "バラムはバラクとともに行[い]き、彼[かれ]らは館[やかた]の町[まち]へ来[き]た。"
  40: "バラクは羊[ひつじ]と子牛[こうし]を屠[ほふ]り、バラムと、彼[かれ]とともにいる長[おさ]たちに送[おく]った。"
  41: "朝[あさ]になると、バラクはバラムを連[つ]れてバアルの高[たか]みに上[のぼ]らせ、そこから民[たみ]の一部[いちぶ]を彼[かれ]に示[しめ]した。"

notes:
  1: "παρενέβαλον ἐπὶ δυσμῶν Μωαβ — расположились станом к западу от Моава (δυσμαί — «запад», мн. ч.). παρὰ τὸν Ιορδάνην — при Иордане (ヨルダン川). κατὰ Ιεριχω — против Иерихона, напротив него."
  2: "ἰδὼν Βαλακ υἱὸς Σεπφωρ — увидел Валак, сын Сепфора (Σεπφωρ — セポル; слав. «сепфоров»). πάντα, ὅσα ἐποίησεν Ισραηλ τῷ Αμορραίῳ — всё, что сделал Израиль Аморрею (датив «против»: Аморрей — побеждённый)."
  3: "ἐφοβήθη … σφόδρα — убоялся сильно. ὅτι πολλοὶ ἦσαν — потому что их было много. προσώχθισεν ἀπὸ προσώπου — «отяготился от лица», т.е. стало ему тяжело, противно (προσοχθίζω; слав. «оскорбе»; ru «устрашились» — иное понимание)."
  4: "τῇ γερουσίᾳ Μαδιαμ — старейшинам Мадиама (γερουσία — «собрание старейшин»; ミディアン). ἐκλείξει — «слижет» (ἐκλείχω; образ поедания травы). ὡς ἐκλεῖξαι ὁ μόσχος τὰ χλωρά — как бык слизывает зелень (μόσχος — «телец, бык»; χλωρά — «зелень»). ἦν κατὰ τὸν καιρὸν ἐκεῖνον — был в то время."
  5: "ἀπέστειλεν … Φαθουρα, ὅ ἐστιν ἐπὶ τοῦ ποταμοῦ — послал в Фафуру, что на реке (LXX Φαθουρα; масоретский текст — Пефор, ру «в Пефор, который на реке Евфрате»). ἐξελήλυθεν — вышел (perfect ἔρχομαι). κατεκάλυψεν τὴν ὄψιν τῆς γῆς — покрыл лицо земли (ὄψις — «вид, лицо»). ἐγκάθηται ἐχόμενός μου — «сидит, держась меня», т.е. расположился вплотную (ἐγκάθημαι, ἔχομαι; слав. «седят при одержании моем»)."
  6: "ἄρασαί μοι — прокляни мне (ἀράομαι; слав. «проклени»). ἰσχύει … ἢ ἡμεῖς — сильнее, чем мы (ἤ после положительной степени — «чем»). ἐὰν δυνώμεθα — если сможем. οἶδα οὓς ἐὰν εὐλογήσῃς — знаю: кого ты благословишь (οἶδα с присоединённым относительным; εὐλόγηνται / κεκατήρανται — perfect pass.: состояние уже наступило)."
  7: "ἡ γερουσία Μωαβ καὶ ἡ γερουσία Μαδιαμ — старейшины Моава и старейшины Мадиама. τὰ μαντεῖα ἐν ταῖς χερσὶν αὐτῶν — «прорицания (или плата за ворожбу) в руках их» (μαντεῖα, мн. ч. от μαντεῖον; ru «подарки за волхвование»); 占いの品. τὰ ῥήματα Βαλακ — слова Валака."
  8: "Καταλύσατε αὐτοῦ τὴν νύκτα — переночуйте здесь (καταλύω — «останавливаться на ночь»; αὐτοῦ — «здесь»). ἀποκριθήσομαι … πράγματα — отвечу вам о деле (πρᾶγμα). ὃ ἐὰν λαλήσῃ κύριος πρός με — что скажет мне Господь. κατέμειναν — остались (καταμένω)."
  9: "ἦλθεν ὁ θεὸς πρὸς Βαλααμ — пришёл Бог к Валааму (в LXX без «во сне», ср. 22:20). Τί οἱ ἄνθρωποι οὗτοι παρὰ σοί; — «что эти люди у тебя?» (вопрос не о знании, а о причине их прихода)."
  10: "ἀπέστειλεν αὐτοὺς πρός με λέγων — послал их ко мне, говоря (речь Валака вводится причастием; в переводе — двоеточие и 『…』 в ст. 11)."
  11: "Ἰδοὺ λαὸς ἐξελήλυθεν ἐξ Αἰγύπτου — вот, народ вышел из Египта (повтор 22:5, но с ἐκβαλῶ ἀπὸ τῆς γῆς — «изгоню из земли», без «этой»). εἰ ἄρα δυνήσομαι — «не смогу ли» (εἰ ἄρα — «может быть»)."
  12: "Οὐ πορεύσῃ μετ᾽ αὐτῶν — не пойдёшь с ними (οὐ с будущим — запрет). οὐδὲ καταράσῃ — и не проклянёшь. ἔστιν γὰρ εὐλογημένος — ибо он благословен (perfect pass.)."
  13: "ἀναστὰς τὸ πρωῒ — встав рано утром. Ἀποτρέχετε — уходите (ἀποτρέχω). πρὸς τὸν κύριον ὑμῶν — к господину вашему (κύριος здесь о царе). οὐκ ἀφίησίν με — не позволяет мне (ἀφίημι)."
  14: "ἀναστάντες — встав. Οὐ θέλει … πορευθῆναι — не хочет идти (θέλω + inf.). Слав. добавляет «ему» («рекоша ему»), в LXX нет."
  15: "προσέθετο … ἔτι ἀποστεῖλαι — «прибавил ещё послать» (προστίθημι + inf. — снова, ещё раз). ἄρχοντας πλείους καὶ ἐντιμοτέρους — князей более многочисленных и более почтенных (ἔντιμος)."
  16: "Τάδε λέγει Βαλακ ὁ τοῦ Σεπφωρ — так говорит Валак, сын Сепфора (Τάδε λέγει — формула посольской речи). Ἀξιῶ σε — прошу тебя (ἀξιόω). μὴ ὀκνήσῃς ἐλθεῖν — не замедли прийти (ὀκνέω)."
  17: "ἐντίμως … τιμήσω σε — почту тебя почётно (ἐντίμως — наречие; слав. «честне бо тя почту»). ὅσα ἐὰν εἴπῃς, ποιήσω σοι — всё, что скажешь, сделаю тебе (σοι — «для тебя»). δεῦρο ἐπικατάρασαί μοι — приди, прокляни мне (ἐπικαταράομαι)."
  18: "ἀπεκρίθη … καὶ εἶπεν — отвечал и сказал (обычная для LXX пара). πλήρη τὸν οἶκον αὐτοῦ ἀργυρίου καὶ χρυσίου — полный дом серебра и золота (родительный содержания). παραβῆναι τὸ ῥῆμα — преступить слово (παραβαίνω). μικρὸν ἢ μέγα ἐν τῇ διανοίᾳ μου — малое или великое в уме моём (διάνοια — «помысел»; слав. «в разуме моем»). LXX без μου при «Бога» — 主なる神."
  19: "ὑπομείνατε … τὴν νύκτα ταύτην — подождите эту ночь (ὑπομένω — «оставаться, терпеть»). τί προσθήσει κύριος λαλῆσαι — что ещё приложит Господь сказать (προστίθημι + inf., ср. 15)."
  20: "νυκτός — ночью. Εἰ καλέσαι σε πάρεισιν — если пришли позвать тебя (πάρεσμι). ἀναστὰς ἀκολούθησον — встав, следуй. ἀλλὰ τὸ ῥῆμα ὃ ἂν λαλήσω … τοῦτο ποιήσεις — но слово, которое Я скажу, его сделаешь (ἀλλά — ограничение)."
  21: "ἐπέσαξεν τὴν ὄνον — оседлал ослицу (ἐπισάσσω — «навьючивать, седлать»; ὄνος — 雌ろば, как в 22:21–33). ἐπορεύθη μετὰ τῶν ἀρχόντων — пошёл с князьями."
  22: "ὠργίσθη θυμῷ — воспылал гневом (θυμός — 怒り; датив внутреннего объекта). ἐνδιαβάλλειν αὐτόν — воспрепятствовать ему (ἐνδιαβάλλω — букв. «подставлять, обвинять»; слав. «препяти»). ἐπιβεβήκει — сидел верхом (pluperfect ἐπιβαίνω). δύο παῖδες — двое слуг (παῖς — «отрок, слуга»)."
  23: "ἀνθεστηκότα — стоящего против (perfect part. ἀνθίστημι). ῥομφαίαν ἐσπασμένην — обнажённый меч (σπάω — «вытаскивать»; ῥομφαία — большой меч). ἐξέκλινεν … ἐπορεύετο εἰς τὸ πεδίον — свернула и шла в поле (imperfect). ἐπάταξεν τῇ ῥάβδῳ — ударил палкой (ῥάβδος; 杖). τοῦ εὐθῦναι αὐτήν — чтобы направить её (εὐθύνω)."
  24: "ἐν ταῖς αὔλαξιν τῶν ἀμπέλων — на бороздах (межах) виноградников (αὔλαξ — «борозда»; слав. «на броздах виноградных»). φραγμὸς ἐντεῦθεν καὶ φραγμὸς ἐντεῦθεν — ограда отсюда и ограда отсюда (φραγμός — «ограда, стена»; 垣)."
  25: "προσέθλιψεν ἑαυτὴν πρὸς τὸν τοῖχον — прижалась к стене (προσθλίβω — «прижимать»; τοῖχος — 壁). ἀπέθλιψεν τὸν πόδα Βαλααμ — прижала ногу Валаама (имя несклоняемое; слав. «прижме ногу валааму»). προσέθετο ἔτι μαστίξαι — прибавил ещё бить (μαστίζω — «бичевать»)."
  26: "ὑπέστη — стал (ὑφίστημι). ἐν τόπῳ στενῷ — в тесном месте (στενός). εἰς ὃν οὐκ ἦν ἐκκλῖναι δεξιὰν οὐδὲ ἀριστεράν — где нельзя было свернуть ни направо, ни налево (ἐκκλίνω; ἐλλειπτ. оборот)."
  27: "συνεκάθισεν ὑποκάτω Βαλααμ — «села под Валаамом», т.е. легла (συγκαθίζω). ἐθυμώθη — воспылал гневом (θυμόω). ἔτυπτεν — бил (τύπτω, imperfect — многократно)."
  28: "ἤνοιξεν ὁ θεὸς τὸ στόμα τῆς ὄνου — открыл Бог уста ослицы (LXX ὁ θεός; ru «Господь»). λέγει — говорит (настоящее время в рассказе). Τί ἐποίησά σοι ὅτι πέπαικάς με τοῦτο τρίτον; — «что сделал я тебе, что ты бьёшь меня это третье?» (παίω — «ударять»; πέπαικα perfect; τοῦτο τρίτον — «вот уже третий раз»)."
  29: "Ὅτι ἐμπέπαιχάς μοι — «потому что ты надо мной надругалась» (ἐμπαίζω — «насмехаться»; слав. «поругалося ми еси»). εἰ εἶχον μάχαιραν — если бы у меня был меч (нереальное условие с ἄν). ἤδη ἂν ἐξεκέντησά σε — уже пронзил бы тебя (ἐκκεντέω)."
  30: "Οὐκ ἐγὼ ἡ ὄνος σου — не я ли ослица твоя. ἐφ᾽ ἧς ἐπέβαινες — на которой ты ездил (ἐπιβαίνω). ἀπὸ νεότητός σου ἕως τῆς σήμερον ἡμέρας — от юности твоей до сего дня. μὴ ὑπεροράσει ὑπεριδοῦσα ἐποίησά σοι οὕτως; — «разве, презрев, презрела я, сделав тебе так?» (датив образа действия при ὑπεροράω; слав. «еда презорством презревши»); смысл: разве я так с тобой поступала. Οὐχί — нет."
  31: "ἀπεκάλυψεν … τοὺς ὀφθαλμούς — открыл глаза (ἀποκαλύπτω). ὁρᾷ — видит (настоящее время). κύψας — склонившись (κύπτω). προσεκύνησεν τῷ προσώπῳ αὐτοῦ — поклонился лицом своим (προσκυνέω + датив; слав. «поклонися ему лицем своим»)."
  32: "Διὰ τί ἐπάταξας … τοῦτο τρίτον; — зачем ты бил … вот уже третий раз. ἐξῆλθον εἰς διαβολήν σου — Я вышел на препятствие тебе (διαβολή — «препятствие, кознь»; слав. «на препятие»). οὐκ ἀστεία ἡ ὁδός σου ἐναντίον μου — «не блага дорога твоя предо Мной» (ἀστεῖος — «изящный, приятный»; слав. «неприятен»)."
  33: "ἰδοῦσά με — увидев Меня. ἐξέκλινεν ἀπ᾽ ἐμοῦ τρίτον τοῦτο — свернула от Меня вот уже третий. εἰ μὴ ἐξέκλινεν — если бы она не свернула (без ἄν при аористе — разговорный оборот). σὲ μὲν ἀπέκτεινα, ἐκείνην δὲ περιεποιησάμην — тебя бы убил, а её оставил в живых (περιποιέομαι — «сохранять»)."
  34: "Ἡμάρτηκα — я согрешил (perfect: состояние). οὐ γὰρ ἠπιστάμην — ибо не знал (ἐπίσταμαι). ἀνθέστηκας — Ты противостал (perfect ἀνθίστημι). εἰς συνάντησιν — «навстречу» (уточнение цели). εἰ μή σοι ἀρέσκει — если Тебе не угодно (ἀρέσκω). ἀποστραφήσομαι — возвращусь (ἀποστρέφω)."
  35: "Συμπορεύθητι — пойди вместе (συμπορεύομαι). πλὴν τὸ ῥῆμα ὃ ἐὰν εἴπω … τοῦτο φυλάξῃ λαλῆσαι — только слово, которое Я скажу, его соблюди, чтобы говорить (φυλάσσω + inf.; слав. «сие сохрани глаголати»). ἐπορεύθη … μετὰ τῶν ἀρχόντων Βαλακ — пошёл с князьями Валака."
  36: "ἥκει — пришёл (ἥκω, perfect с настоящим значением). εἰς πόλιν Μωαβ — в город Моав (имя города). ἐπὶ τῶν ὁρίων Αρνων — на пределах Арнона (ἐπί + род.). ὃ ἔστιν ἐκ μέρους τῶν ὁρίων — «что есть от части пределов», т.е. на краю области (слав. «на краи пределов»)."
  37: "Οὐχὶ ἀπέστειλα … καλέσαι σε; — не посылал ли я … позвать тебя? διὰ τί οὐκ ἤρχου; — почему ты не шёл (imperfect ἤρχου). ὄντως οὐ δυνήσομαι τιμῆσαί σε; — неужели я поистине не смогу почтить тебя (ὄντως — «действительно»; τιμάω)."
  38: "Ἰδοὺ ἥκω πρὸς σέ — вот, я пришёл к тебе. νῦν δυνατὸς ἔσομαι λαλῆσαί τι; — теперь смогу ли сказать что-нибудь (риторический вопрос). τὸ ῥῆμα ὃ ἐὰν βάλῃ ὁ θεὸς εἰς τὸ στόμα μου — слово, которое Бог вложит в уста мои (βάλλω — «бросать, влагать»; ср. 22:20, 23:5)."
  39: "πόλεις ἐπαύλεων — «города усадеб» (ἔπαυλις — «двор, усадьба»; слав. «грады селныя»); масоретский текст читает здесь имя Кириаф-Хуцоф (ру), LXX передаёт нарицательно — 館の町."
  40: "ἔθυσεν … πρόβατα καὶ μόσχους — заколол овец и тельцов (θύω; μόσχος — «телец»). ἀπέστειλεν τῷ Βαλααμ καὶ τοῖς ἄρχουσι — послал Валааму и князьям (т.е. угощение с жертвы)."
  41: "ἐγενήθη πρωΐ — было утром. ἀνεβίβασεν αὐτὸν ἐπὶ τὴν στήλην τοῦ Βααλ — возвёл его на «столп Ваала» (στήλη — «столп, стела»; слав. «на столп ваалов»); евр. «высоты Вааловы» (ру) — отсюда バアルの高み. ἔδειξεν … μέρος τι τοῦ λαοῦ — показал часть народа."
