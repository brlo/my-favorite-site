verses:
  1: "ああ、背[そむ]いた子[こ]らよ。主[しゅ]はこう言[い]う。「あなたがたはわたしによらずに計画[けいかく]を立[た]て、わたしの霊[れい]によらずに協定[きょうてい]を結[むす]び、罪[つみ]の上[うえ]に罪を加[くわ]えた。"
  2: "エジプトへ下[くだ]って行[い]きながら、わたしに問[と]いもしなかった。ファラオに助[たす]けられ、エジプト人[じん]に覆[おお]われようとして。"
  3: "ファラオの覆[おお]いはあなたがたにとって恥[はじ]となり、エジプトに望[のぞ]みを置[お]く者[もの]にとってそしりとなるからだ。"
  4: "タニスには彼[かれ]らの長[おさ]たちがいる。悪[わる]い使[つか]いたちである。彼[かれ]らはむだに労[ろう]する。"
  5: "助[たす]けにも益[えき]にもならず、かえって恥[はじ]とそしりとなる民[たみ]のもとへ。」"
  6: "荒[あ]れ野[の]にいる四足[しそく]の獣[けもの]についての幻[まぼろし]。苦[くる]しみと圧迫[あっぱく]のうちに、獅子[しし]と獅子の子[こ]ら、蝮[まむし]と飛[と]ぶ蝮の子[こ]らがそこから来[く]る。彼[かれ]らはろばとらくだに富[とみ]を負[お]わせ、助[たす]けにならず、かえって恥[はじ]とそしりとなる民[たみ]のもとへ運[はこ]ぶ。"
  7: "エジプト人[じん]はむだに、空[むな]しくあなたがたを益[えき]する。彼[かれ]らに告[つ]げよ。「あなたがたの慰[なぐさ]めはむだである」と。"
  8: "今[いま]、座[すわ]って、これらのことを板[いた]に書き、書[ほ]にも記[しる]せ。これらのことが後[のち]の日々[ひび]に、そして永遠[えいえん]に至[いた]るまで残[のこ]るためである。"
  9: "この民[たみ]は不従順[ふじゅうじゅん]な民、偽[いつわ]りの子[こ]らであり、神[かみ]の律法[りっぽう]を聞[き]こうとしなかったからだ。"
  10: "預言者[よげんしゃ]たちに「わたしたちに告[つ]げるな」と言[い]い、幻[まぼろし]を見[み]る者[もの]たちに言[い]う。「わたしたちに語[かた]るな。わたしたちには別[べつ]の迷[まよ]いを語り、告げよ。"
  11: "わたしたちをこの道[みち]から遠[とお]ざけ、この道をわたしたちから取[と]り去[さ]り、イスラエルの聖[せい]なる方[かた]をわたしたちから取り去れ。」"
  12: "それゆえ、主[しゅ]、イスラエルの聖[せい]なる方[かた]はこう言[い]う。「あなたがたはこの言葉[ことば]を拒[こば]み、偽[いつわ]りと不正[ふせい]に望[のぞ]みを置[お]き、それに寄[よ]りかかっている。"
  13: "それゆえ、この罪[つみ]はあなたがたにとって、堅[かた]い都[みやこ]の、今[いま]にも倒[たお]れようとする高[たか]い城壁[じょうへき]の裂[さ]け目のようになる。その倒れはたちまち来[く]る。"
  14: "その倒[たお]れは、陶工[とうこう]の器[うつわ]の砕[くだ]けるようになる。惜[お]しむことなく砕かれ、その破片[はへん]のうちに、火[ひ]を取[と]るかけらも、少[すこ]しの水[みず]を汲[く]むかけらも見[み]つからない。」"
  15: "主[しゅ]、イスラエルの聖[せい]なる方[かた]はこう言[い]う。「あなたがたは背[そむ]いてため息[いき]をつくとき、救[すく]われ、自分[じぶん]がどこにいたかを知[し]る。あなたがたがむだなものに望[のぞ]みを置[お]いたとき、あなたがたの力[ちから]はむだになった。あなたがたは聞[き]こうとしなかった。"
  16: "『いや、わたしたちは馬[うま]に乗[の]って逃[に]げよう』と言[い]った。それゆえ、あなたがたは逃げる。『わたしたちは速[はや]い馬に乗ろう』と言った。それゆえ、あなたがたを追[お]う者[もの]たちは速くなる。"
  17: "一人[ひとり]の声[こえ]によって千[せん]人が逃[に]げ、五[ご]人の声によって多[おお]くの者[もの]が逃げ、ついにあなたがたは山[やま]の上[うえ]の竿[さお]、丘[おか]の上[うえ]の旗[はた]のように残[のこ]される。」"
  18: "それゆえ、主[しゅ]はあなたがたをあわれむために待[ま]ち、あなたがたを憐[あわ]れむために高[たか]く上[あ]げられる。主[しゅ]なる神[かみ]は裁[さば]き主[ぬし]であるからだ。あなたがたはどこに自分の栄光[えいこう]を残[のこ]すのか。主のうちにとどまる者[もの]たちは幸[さいわ]いである。"
  19: "シオンには聖[せい]なる民[たみ]が住[す]む。エルサレムは泣[な]きながら叫[さけ]んだ。「わたしをあわれんでください。」主[しゅ]はあなたの叫[さけ]びの声[こえ]によってあなたをあわれみ、見[み]たとき、あなたの声を聞[き]かれた。"
  20: "主[しゅ]はあなたがたに苦[くる]しみのパンと圧迫[あっぱく]の水[みず]を与[あた]えられる。あなたを迷[まよ]わせる者[もの]たちは、もはやあなたに近[ちか]づかない。あなたの目[め]はあなたを迷わせる者たちを見[み]る。"
  21: "あなたの耳[みみ]は、あなたの後[うしろ]から「これが道[みち]だ、これを行[い]け」と言[い]う言葉[ことば]を聞[き]く。"
  22: "あなたは銀[ぎん]をかぶせた偶像[ぐうぞう]と、金[きん]をかぶせた像[ぞう]を取[と]り除[のぞ]き、それらを細[こま]かくし、月経[げっけい]の女[おんな]の水[みず]のようにふるい分[わ]け、汚物[おぶつ]のように投[な]げ捨[す]てる。"
  23: "そのとき、あなたの地[ち]の種[たね]に雨[あめ]が降[ふ]り、あなたの地の産[う]み出[だ]すパンは豊[ゆた]かで、こくがある。その日[ひ]、あなたの家畜[かちく]は広[ひろ]くゆったりした牧[まき]の場[ば]で草[くさ]を食[た]べる。"
  24: "あなたの若[わか]い雄牛[おうし]と、地[ち]を耕[たがや]す牛[うし]は、ふるい分[わ]けられた大麦[おおむぎ]に混[ま]ぜたもみがらを食[た]べる。"
  25: "その日[ひ]、高[たか]い山[やま]のすべてに、そびえる丘[おか]のすべてに水[みず]が流[なが]れる。多[おお]くの者[もの]が滅[ほろ]び、塔[とう]が倒[たお]れるときに。"
  26: "月[つき]の光[ひかり]は太陽[たいよう]の光のようになり、太陽の光は七倍[ななばい]になる。主[しゅ]がご自分[じぶん]の民[たみ]の砕[くだ]かれたものを癒[いや]し、その打[う]ち傷[きず]の痛[いた]みを癒される日[ひ]に。"
  27: "見[み]よ、主[しゅ]の名[な]は遠[とお]い時[とき]を経[へ]て来[く]る。その怒[いか]りは燃[も]え、栄光[えいこう]とともに来る。その唇[くちびる]の言葉[ことば]は怒りに満[み]ち、その怒りは火[ひ]のように食[く]らう。"
  28: "その霊[れい]は谷[たに]を引[ひ]き流[なが]す水[みず]のように、首[くび]にまで達[いた]する。それはむだな迷[まよ]いによって国々[くにぐに]をかき乱[みだ]すために分[わ]かたれ、迷いが彼[かれ]らを追[お]い、彼[かれ]らの面前[めんぜん]で彼らを捕[と]らえる。"
  29: "あなたがたはいつも喜[よろこ]び、いつも聖[せい]なる所[ところ]に入[はい]るべきなのか。祭[まつ]りを祝[いわ]う者[もの]のように、笛[ふえ]とともに喜んで主[しゅ]の山[やま]へ、イスラエルの神[かみ]のもとへ上[のぼ]るべきなのか。"
  30: "神[かみ]はその声[こえ]の栄光[えいこう]を聞[き]こえるようにし、その腕[うで]の激[はげ]しい怒[いか]りを、怒りと憤[いきどお]りと焼[や]き尽[つ]くす炎[ほのお]とともに示[しめ]される。激しく雷[かみなり]を落[お]とし、水[みず]と雹[ひょう]を激しく降[ふ]らす。"
  31: "主[しゅ]の声[こえ]によって、アッシリア人[じん]は、主が彼[かれ]らを打[う]つその打撃[だげき]によって敗[やぶ]れる。"
  32: "そこから彼[かれ]に助[たす]けの望[のぞ]みがあり、彼が頼[たよ]っていた所[ところ]が、彼の周[まわ]りを囲[かこ]むようになる。彼[かれ]らはタンバリンと竪琴[たてごと]をもって、変[か]わりつつ彼と戦[たたか]う。"
  33: "あなたは日[ひ]の前[まえ]に求[もと]められる。あなたにも王[おう]として治[おさ]めることが備[そな]えられたのではないか。深[ふか]い谷[たに]、横[よこ]たわる木[き]、火[ひ]と多[おお]くの木が。主[しゅ]の怒[いか]りは硫黄[いおう]で燃[も]える谷のようである。"

notes:
  1: "τέκνα ἀποστάται — «дети отступники» (ἀποστάτης — отступник; слав. «отступившая»); τάδε λέγει κύριος — вводная формула вне кавычек. ἐποιήσατε βουλὴν οὐ δι᾿ ἐμοῦ — «сделали совет не через Меня»; συνθήκας οὐ διὰ τοῦ πνεύματός μου — «соглашения не по духу Моему» (συνθήκη, слав. «заветы»). προσθεῖναι ἁμαρτίας ἐφ᾿ ἁμαρτίαις — «приложить грехи к грехам»."
  2: "οἱ πορευόμενοι καταβῆναι εἰς Αἴγυπτον — «идущие сойти в Египет» (καταβαίνω); ἐμὲ δὲ οὐκ ἐπηρώτησαν — «а Меня не спросили» (ἐπερωτάω — вопрошать). τοῦ βοηθηθῆναι ὑπὸ Φαραω — «чтобы получить помощь от фараона» (βοηθέω); σκεπασθῆναι ὑπὸ Αἰγυπτίων — «быть покрытыми египтянами» (σκεπάζω)."
  3: "ἡ σκέπη Φαραω εἰς αἰσχύνην — «покров фараона в стыд» (σκέπη — покров, слав. «покров»); ὄνειδος — «поношение, срам» (слав. «укоризна»)."
  4: "ἐν Τάνει ἀρχηγοὶ ἄγγελοι πονηροί — «в Танисе начальники, вестники злые» (ἀρχηγός — начальник; ἄγγελος — вестник; πονηρός — злой). У Син. «князья его уже в Цоане, послы его дошли до Ханеса» — МТ; LXX иное, сохранено. μάτην κοπιάσουσιν — «напрасно потрудятся» (κοπιάω), фраза продолжается в ст. 5."
  5: "πρὸς λαόν, ὃς οὐκ ὠφελήσει αὐτούς — «к народу, который не принесёт им пользы» (ὠφελέω); οὔτε εἰς βοήθειαν οὔτε εἰς ὠφέλειαν — «ни в помощь, ни в пользу». Фраза продолжает ст. 4, поэтому стих начинается с «民のもとへ»; конец стиха закрывает речь Господа. Граница 4/5: gr 30:4 кончается на μάτην κοπιάσουσιν («напрасно потрудятся»), у csl эти слова открывают 30:5 — держимся gr."
  6: "Ἡ ὅρασις τῶν τετραπόδων τῶν ἐν τῇ ἐρήμῳ — «видение четвероногих в пустыне»: заглавие, у csl опущено, у нас есть. σκύμνος λέοντος — «львёнок» (σκύμνος); ἀσπίδες καὶ ἔκγονα ἀσπίδων πετομένων — «аспиды и порождения летающих аспидов» (ἀσπίς — аспид, змея; ἔκγονον — отродье). οἳ ἔφερον ἐπ᾿ ὄνων καὶ καμήλων τὸν πλοῦτον αὐτῶν — «которые везли на ослах и верблюдах богатство своё»."
  7: "Αἰγύπτιοι μάταια καὶ κενὰ ὠφελήσουσιν ὑμᾶς — «египтяне тщетное и пустое принесут вам» (μάταιος, κενός). ἀπάγγειλον αὐτοῖς — «возвести им» (ἀπαγγέλλω): повеление пророку. Ματαία ἡ παράκλησις ὑμῶν αὕτη — «тщетно утешение ваше сие» (παράκλησις); в тексте — 「…」 как содержание возвещения. У Син. «сила их — сидеть спокойно» — МТ."
  8: "καθίσας γράψον ἐπὶ πυξίου — «сев, напиши на дощечке» (πυξίον — табличка, слав. «на дске»); εἰς βιβλίον — «в книгу». εἰς ἡμέρας καιρῶν — «на дни времён», т. е. на будущие времена (καιρός); ἕως εἰς τὸν αἰῶνα — «до века»."
  9: "λαὸς ἀπειθής — «народ непокорный» (ἀπειθής); υἱοὶ ψευδεῖς — «сыны лживые» (ψευδής); οὐκ ἠβούλοντο ἀκούειν τὸν νόμον τοῦ θεοῦ — «не хотели слушать закон Бога» (βούλομαι)."
  10: "οἱ λέγοντες τοῖς προφήταις Μὴ ἀναγγέλλετε — «говорящие пророкам: не возвещайте»; τοῖς τὰ ὁράματα ὁρῶσιν — «видящим видения» (ὅραμα). ἑτέραν πλάνησιν — «иное прельщение, заблуждение» (πλάνησις, слав. «прельщение»). Речь народа продолжается в ст. 11, поэтому 「…」 открывается здесь и закрывается в конце ст. 11."
  11: "ἀποστρέψατε ἡμᾶς ἀπὸ τῆς ὁδοῦ ταύτης — «отвратите нас от пути сего» (ἀποστρέφω); ἀφέλετε ἀφ᾿ ἡμῶν τὸν τρίβον τοῦτον — «уберите от нас стезю эту» (τρίβος — тропа, стезя). Слав. в конце читает «отимите от нас суд израилев» вместо «Святаго Израилева» (τὸν ἅγιον τοῦ Ισραηλ); это порча слав. текста, держимся LXX (так же в МТ), слав. вариант отмечен."
  12: "ὁ ἅγιος τοῦ Ισραηλ — «Святой Израилев» (титул, слав. «святый израилев»). ἠπειθήσατε τοῖς λόγοις τούτοις — «вы не покорились словам сим» (ἀπειθέω); ἠλπίσατε ἐπὶ ψεύδει — «надеялись на ложь»; ἐγόγγυσας — «ты возроптал» (γογγύζω), смена числа сохранена."
  13: "ὡς τεῖχος πῖπτον παραχρῆμα πόλεως ὀχυρᾶς ἑαλωκυίας — «как стена падающая внезапно города крепкого, взятого» (ἁλίσκομαι — быть взятым); ἧς παραχρῆμα πάρεστιν τὸ πτῶμα — «которого тотчас настоит падение» (πτῶμα — падение)."
  14: "ὡς σύντριμμα ἀγγείου ὀστρακίνου — «как сокрушение сосуда глиняного» (ὄστρακον — глина, черепок); ἐκ κεραμίου λεπτά — «на мелкие [черепки] из глины» (λεπτός — мелкий). ὄστρακον ἐν ᾧ πῦρ ἀρεῖς — «черепок, чтобы взять огонь» (αἴρω); ἀποσυριεῖς ὕδωρ μικρόν — «зачерпнуть немного воды» (ἀποσυρίζω)."
  15: "Ὅταν ἀποστραφεὶς στενάξῃς — «когда, обратившись, воздохнёшь» (στενάζω — вздыхать); τότε σωθήσῃ — «тогда спасёшься»; γνώσῃ ποῦ ἦσθα — «узнаешь, где ты был». ὅτε ἐπεποίθεις ἐπὶ τοῖς ματαίοις — «когда ты надеялся на суетное» (μάταιος); ματαία ἡ ἰσχὺς ὑμῶν ἐγενήθη — «тщетною стала сила ваша». В МТ и Син. здесь «в тишине и уповании крепость ваша»; в LXX и слав. этого оборота нет, поэтому в текст не внесён — важное расхождение отмечено. Слав. удваивает «Господь, Господь святый израилев», в LXX один κύριος."
  16: "Ἐφ᾿ ἵππων φευξόμεθα — «на конях убежим» (φεύγω); ἐπὶ κούφοις ἀναβάται ἐσόμεθα — «на быстрых будем всадниками» (κοῦφος — быстрый, лёгкий; ἀναβάτης — всадник). κοῦφοι ἔσονται οἱ διώκοντες ὑμᾶς — «быстрыми будут преследующие вас» (διώκω). Речи народа внутри речи Господа — 『…』."
  17: "διὰ φωνὴν ἑνὸς φεύξονται χίλιοι — «от голоса одного побегут тысячи»; ἕως ἂν καταλειφθῆτε — «доколе не останетесь» (καταλείπω). ὡς ἱστὸς ἐπ᾿ ὄρους — «как шест, мачта на горе» (ἱστός — мачта, ткацкая основа; слав. «щогла»); ὡς σημαίαν φέρων ἐπὶ βουνοῦ — «как знамя несущий на холме» (σημαία — знамя)."
  18: "μενεῖ ὁ θεὸς τοῦ οἰκτιρῆσαι ὑμᾶς — «Бог будет ждать, чтобы помиловать вас» (μένω — ждать, пребывать; οἰκτίρω — миловать); ὑψωθήσεται τοῦ ἐλεῆσαι — «возвысится, чтобы помиловать» (ἐλεάω). κριτὴς κύριος ὁ θεὸς ἡμῶν — «Судия — Господь Бог наш» (κριτής). ποῦ καταλείψετε τὴν δόξαν ὑμῶν — «где оставите славу вашу»; μακάριοι οἱ ἐμμένοντες ἐν αὐτῷ — «блаженны пребывающие в Нём» (ἐμμένω)."
  19: "λαὸς ἅγιος ἐν Σιων οἰκήσει — «святой народ в Сионе будет жить» (οἰκέω). Ιερουσαλημ κλαυθμῷ ἔκλαυσεν — «Иерусалим плачем восплакал» (κλαυθμός): гебраизм, усиление; слова города «помилуй меня» — в 「…」. ἡνίκα εἶδεν, ἐπήκουσέν σου — «когда увидел, услышал тебя» (ἐπακούω)."
  20: "ἄρτον θλίψεως καὶ ὕδωρ στενόν — «хлеб скорби и воду тесную» (θλῖψις, στενός); οὐκέτι μὴ ἐγγίσωσίν σοι οἱ πλανῶντές σε — «уже не приблизятся к тебе вводящие тебя в заблуждение» (πλανάω). οἱ ὀφθαλμοί σου ὄψονται — «глаза твои увидят»."
  21: "τὰ ὦτά σου ἀκούσονται τοὺς λόγους τῶν ὀπίσω σε πλανησάντων — «уши твои услышат слова совративших тебя назад» (ὀπίσω — сзади, назад). Αὕτη ἡ ὁδός, πορευθῶμεν ἐν αὐτῇ — «вот путь, пойдём по нему»; εἴτε δεξιὰ εἴτε ἀριστερά — «направо или налево» (δεξιός, ἀριστερός). Слова позади — в 「…」."
  22: "τὰ εἴδωλα τὰ περιηργυρωμένα καὶ τὰ περικεχρυσωμένα — «идолы, посеребрённые и позлащённые» (περιαργυρόω, περιχρυσόω). λεπτὰ ποιήσεις — «сделаешь их мелкими» (λεπτός); λικμήσεις ὡς ὕδωρ ἀποκαθημένης — «провеешь, как воду женщины в очищении» (λικμάω — веять; ἀποκαθημένη — женщина в месячном очищении); ὡς κόπρον ὤσεις αὐτά — «как помёт отбросишь их» (κόπρος, ὠθέω — толкать)."
  23: "ὁ ὑετὸς τῷ σπέρματι τῆς γῆς σου — «дождь семени земли твоей» (ὑετός — дождь); πλησμονὴ καὶ λιπαρός — «изобилие и тучность» (πλησμονή — полнота, λιπαρός — тучный). τόπον πίονα καὶ εὐρύχωρον — «место тучное и просторное» (πίων, εὐρύχωρος)."
  24: "οἱ ταῦροι ὑμῶν καὶ οἱ βόες — «волы ваши и быки» (ταῦρος — бык, βοῦς — вол); ἄχυρα ἀναπεποιημένα ἐν κριθῇ λελικμημμένα — «мякина, смешанная с провеянным ячменём» (ἄχυρον — мякина, ἀναποιέω — смешивать, λικμάω — веять)."
  25: "ὕδωρ διαπορευόμενον — «вода проходящая» (διαπορεύομαι); ὅταν ἀπόλωνται πολλοὶ καὶ ὅταν πέσωσιν πύργοι — «когда погибнут многие и когда падут башни»."
  26: "τὸ φῶς τῆς σελήνης ὡς τὸ φῶς τοῦ ἡλίου — «свет луны, как свет солнца»; ἑπταπλάσιον — «семеричный» (слав. «седмерицею»), в тексте 七倍. ὅταν ἰάσηται κύριος τὸ σύντριμμα τοῦ λαοῦ αὐτοῦ — «когда исцелит Господь сокрушение народа Своего» (ἴαμαι, σύντριμμα); τὴν ὀδύνην τῆς πληγῆς σου ἰάσεται — «боль язвы твоей исцелит» (ὀδύνη, πληγή). У Син. «как свет семи дней» — МТ."
  27: "τὸ ὄνομα κυρίου διὰ χρόνου ἔρχεται πολλοῦ — «имя Господне идёт через много времени», т. е. после долгого времени, издалека (χρόνος). καιόμενος ὁ θυμός — «горит гнев» (καίω). τὸ λόγιον τῶν χειλέων αὐτοῦ — «изречение уст Его» (λόγιον); ἡ ὀργὴ τοῦ θυμοῦ ὡς πῦρ ἔδεται — «ярость гнева, как огонь, поедает»."
  28: "ὡς ὕδωρ ἐν φάραγγι σῦρον — «как вода в долине влекущая» (φάραγξ — ущелье, долина; σύρω — влечь). ἕως τοῦ τραχήλου — «до шеи» (τράχηλος). τοῦ ἔθνη ταράξαι ἐπὶ πλανήσει ματαίᾳ — «чтобы смутить народы заблуждением суетным» (ταράσσω, πλάνησις). λήμψεται αὐτοὺς κατὰ πρόσωπον αὐτῶν — «возьмёт их перед лицом их»."
  29: "μὴ διὰ παντὸς δεῖ ὑμᾶς εὐφραίνεσθαι — «разве всегда должно вам веселиться?»: риторический вопрос с μή сохранён (слав. «еда присно подобает вам радоватися»). εἰσπορεύεσθαι εἰς τὰ ἅγιά μου — «входить во святая Моя» (ἅγια). ὡσεὶ ἑορτάζοντας — «как празднующие» (ἑορτάζω); μετὰ αὐλοῦ — «с свирелью» (αὐλός — флейта, свирель); εἰς τὸ ὄρος τοῦ κυρίου — «на гору Господню». У Син. это обещание («будут песни»), а не вопрос — МТ."
  30: "ἀκουστὴν ποιήσει … τὴν δόξαν τῆς φωνῆς αὐτοῦ — «сделает слышною славу голоса Своего» (ἀκουστός); τὸν θυμὸν τοῦ βραχίονος αὐτοῦ δείξει — «покажет ярость мышцы Своей». φλογὸς κατεσθιούσης — «пламени поедающего»; κεραυνώσει βιαίως — «поразит молнией сильно» (κεραυνόω — поражать молнией); ὡς ὕδωρ καὶ χάλαζα συγκαταφερομένη βίᾳ — «как вода и град, силою низвергаемые»."
  31: "ἡττηθήσονται Ἀσσύριοι — «будут побеждены ассирияне» (ἡττάομαι — быть побеждённым); τῇ πληγῇ, ᾗ ἂν πατάξῃ αὐτούς — «язвою, которою поразит их» (πληγή, πατάσσω)."
  32: "ἔσται αὐτῷ κυκλόθεν — «будет ему вокруг» (κυκλόθεν — кругом); ὅθεν ἦν αὐτῷ ἡ ἐλπὶς τῆς βοηθείας — «откуда была ему надежда помощи». αὐτοὶ μετὰ αὐλῶν καὶ κιθάρας πολεμήσουσιν αὐτόν — «они с свирелями и кифарой будут воевать против него»; слав. читает «со тимпаны и гусльми» (тимпаны и гусли), в тексте по csl, вариант LXX (αὐλῶν καὶ κιθάρας) отмечен. ἐκ μεταβολῆς — «с переменою», т. е. непрестанно меняясь."
  33: "σὺ γὰρ πρὸ ἡμερῶν ἀπαιτηθήσῃ — «ибо ты прежде дней будешь востребован» (ἀπαιτέω — требовать обратно, взыскивать); μὴ καὶ σοὶ ἡτοιμάσθη βασιλεύειν — «разве и тебе уготовано царствовать?». φάραγξ βαθεῖα, ξύλα κείμενα, πῦρ καὶ ξύλα πολλά — «глубокая долина, лежащие дрова, огонь и много дров». ὁ θυμὸς κυρίου ὡς φάραγξ ὑπὸ θείου καιομένη — «гнев Господень, как долина, горящая серою» (θεῖον — сера, слав. «жупелом»)."
