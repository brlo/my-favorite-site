# jp-box, Исаия, глава 30. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для Исаии есть фрагментами (гл. 25–29), использован только для
# сверки; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 30: 1–5 горе детям-отступникам, идущим в Египет; 6–7 видение четвероногих
# (бесполезный союз с Египтом); 8–11 повеление записать и речь мятежного народа;
# 12–14 сокрушение стены и сосуда; 15–17 «в обращении и вздохе спасение» (у МТ
# «в тишине и уповании» — в LXX этого нет); 18–26 обетование Сиону; 27–33 шествие
# Господа на Ассирию.
# Голоса: 1–5 слова Господа после формулы 「…」; 6–14 без кавычек, возвещение в 7,
# речь народа в 10–11 — 「…」; 15–17 слова Господа — 「…」, речи народа в 16 — 『…』;
# 18–33 без кавычек, слова города в 19 и слова позади в 21 — 「…」.
# Нумерация по gr: 33 стиха (совпадает с csl/ru).
# 〔…〕 нет: все 33 стиха есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 板, 角笛, 幻, 陶工, 硫黄 уже в корпусе или пояснены в notes.
# Имена — транслитерация греческого (LXX).

