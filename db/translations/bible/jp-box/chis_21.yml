# jp-box, Числа, глава 21. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru).
# ru (Синодальный) — только для понимания, не источник. jp-joc в этой главе отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 21: Хананей Арада и обет Израиля (1–3); стоянка у Ора, ропот и медный змей (4–9);
# стоянки от Овофа до Вамофа, песнь у колодца (10–20); Сигон, царь Аморреев (21–32);
# Ог, царь Васана (33–35).
# Красного нет. Кавычки: обет Израиля — 「…」 (2), слова народа — 「…」 (5, 7),
# речь Бога — 「…」 (8), песнь у колодца — 「…」 (17–18), слова Моисея Сигону — 「…」 (22),
# слова «загадочников» — 「…」 (27–30).
# 〔…〕: 21:8 — 〔青銅の〕. В gr-lxx-byz ст. 8 читает только ὄφιν («змея»), а «медяну»
# есть лишь в церковнославянском (csl-ru, в скобках); проверено по базе:
# bracket_check «21:8:χαλκουν» — НЕТ, «21:9:χαλκουν» — ЕСТЬ (в 9-м χαλκοῦν уже в LXX).
# Сносок ⟨…⟩ нет: новых неочевидных терминов в главе нет (聖絶 уже пояснено в Лев 27,
# 紅海 — в Исх 13:18, 井戸, 蛇, 祭壇 понятны по контексту). jp-ni не использовался.

