verses:
  1: "荒野[こうや]に住[す]むアラドの王[おう]、カナン人[じん]は、イスラエルがアタリムの道[みち]に来[き]たことを聞[き]いて、イスラエルと戦[たたか]い、彼[かれ]らのうちから捕[とりこ]を取[と]った。"
  2: "イスラエルは主[しゅ]に誓願[せいがん]を立[た]てて言[い]った。「もしあなたがこの民[たみ]を私[わたし]の手[て]に渡[わた]してくださるなら、私[わたし]は彼[かれ]とその町[まち]々を聖絶[せいぜつ]する。」"
  3: "主[しゅ]はイスラエルの声[こえ]を聞[き]き入[い]れ、カナン人[じん]を彼[かれ]の手[て]に渡[わた]された。彼[かれ]はカナン人[じん]とその町[まち]々を聖絶[せいぜつ]した。それゆえ、彼[かれ]らはその所[ところ]の名[な]をアナテマと名[な]づけた。"
  4: "彼[かれ]らはホル山[やま]から旅立[たびだ]ち、紅海[こうかい]への道[みち]を進[すす]んでエドムの地[ち]を回[まわ]り込[こ]んだ。しかし、民[たみ]は途中[とちゅう]で気[き]を落[お]とした。"
  5: "民[たみ]は神[かみ]とモーセに逆[さか]らって言[い]った。「なぜあなたは私[わたし]たちをエジプトから連[つ]れ出[だ]して、荒野[こうや]で殺[ころ]そうとするのか。ここにはパンも水[みず]もなく、私[わたし]たちの魂[たましい]はこの空[むな]しいパンにうんざりしている。」"
  6: "主[しゅ]は民[たみ]に、人[ひと]を殺[ころ]す蛇[へび]を送[おく]られた。蛇[へび]は民[たみ]を噛[か]み、イスラエルの子[こ]らの多[おお]くの者[もの]が死[し]んだ。"
  7: "民[たみ]はモーセのもとに来[き]て言[い]った。「私[わたし]たちは、主[しゅ]とあなたに逆[さか]らって語[かた]ったので、罪[つみ]を犯[おか]しました。どうか主[しゅ]に祈[いの]って、蛇[へび]を私[わたし]たちから取[と]り去[さ]ってください。」モーセは民[たみ]のために主[しゅ]に祈[いの]った。"
  8: "主[しゅ]はモーセに言[い]われた。「あなたのために〔青銅[せいどう]の〕蛇[へび]を作[つく]り、それを旗竿[はたざお]の上[うえ]に掲[かか]げなさい。蛇[へび]が人[ひと]を噛[か]んだとき、噛[か]まれた者[もの]はみな、それを見[み]て生[い]き延[の]びるであろう。」"
  9: "モーセは青銅[せいどう]の蛇[へび]を作[つく]り、それを旗竿[はたざお]の上[うえ]に掲[かか]げた。蛇[へび]が人[ひと]を噛[か]むと、その人[ひと]は青銅[せいどう]の蛇[へび]を見[み]つめ、生[い]き延[の]びた。"
  10: "イスラエルの子[こ]らは旅立[たびだ]ち、オボトで宿営[しゅくえい]した。"
  11: "彼[かれ]らはオボトから旅立[たびだ]ち、荒野[こうや]の向[む]こう側[がわ]、モアブの正面[しょうめん]、日[ひ]の昇[のぼ]る方[ほう]にあるアケルガイで宿営[しゅくえい]した。"
  12: "そこから彼[かれ]らは旅立[たびだ]ち、ザレトの谷[たに]で宿営[しゅくえい]した。"
  13: "そこから旅立[たびだ]ち、アモリ人[じん]の領界[りょうかい]から突[つ]き出[で]た荒野[こうや]の、アルノンの向[む]こう側[がわ]で宿営[しゅくえい]した。アルノンはモアブの領界[りょうかい]であり、モアブとアモリ人[じん]の間[あいだ]にあるからである。"
  14: "それゆえ、主[しゅ]の戦[いくさ]の書[しょ]に言[い]われている。「ゾオブを火[ひ]で焼[や]き、アルノンの谷川[たにがわ]を、"
  15: "イルに住[す]まわせるために据[す]え、モアブの領界[りょうかい]に添[そ]えた。」"
  16: "そこから彼[かれ]らは井戸[いど]へ来[き]た。これは、主[しゅ]がモーセに語[かた]られたあの井戸[いど]である。「民[たみ]を集[あつ]めよ。わたしは彼[かれ]らに飲[の]む水[みず]を与[あた]える。」"
  17: "そのとき、イスラエルはこの歌[うた]を井戸[いど]のそばで歌[うた]った。「これに向[む]かって歌[うた]え。"
  18: "井戸[いど]よ、それを長[おさ]たちが掘[ほ]り、国々[くにぐに]の王[おう]たちが、その王国[おうこく]のうちで、彼[かれ]らが支配[しはい]するときに、それを削[けず]り抜[ぬ]いた。」そして、井戸[いど]からマンタナインへ。"
  19: "マンタナインからナアリエルへ、ナアリエルからバモトへ。"
  20: "バモトから、モアブの野[の]にある谷[たに]へ。それは荒野[こうや]に面[めん]した、削[けず]り出[だ]された岩[いわ]の頂[いただき]からである。"
  21: "モーセはアモリ人[じん]の王[おう]シホンに、平和[へいわ]の言葉[ことば]をもって使者[ししゃ]たちを送[おく]り、言[い]った。"
  22: "「あなたの地[ち]を通[とお]る。野[の]にもぶどう畑[ばたけ]にもそれず、あなたの井戸[いど]の水[みず]も飲[の]まない。あなたの領界[りょうかい]を通[とお]り過[す]ぎるまで、王[おう]の道[みち]を行[ゆ]く。」"
  23: "しかしシホンは、イスラエルがその領界[りょうかい]を通[とお]るのを許[ゆる]さなかった。シホンはそのすべての民[たみ]を集[あつ]め、荒野[こうや]へ出[で]てイスラエルと戦[たたか]う備[そな]えを整[ととの]え、ヤッサに来[き]て、イスラエルと対[たい]陣[じん]した。"
  24: "イスラエルは彼[かれ]を剣[つるぎ]の刃[やいば]で打[う]ち、アルノンからヤボクまで、アンモンの子[こ]らに至[いた]るまで、その地[ち]を我[わ]がものとした。イアゼルはアンモンの子[こ]らの領界[りょうかい]だからである。"
  25: "イスラエルはこれらすべての町[まち]を取[と]り、イスラエルはアモリ人[じん]のすべての町[まち]に住[す]んだ。エセボンと、それに属[ぞく]するすべての町[まち]とに。"
  26: "エセボンはアモリ人[じん]の王[おう]シホンの町[まち]であったからである。彼[かれ]は以前[いぜん]、モアブの王[おう]と戦[たたか]い、彼[かれ]らはアロエルからアルノンまでのその全[すべ]ての地[ち]を取[と]った。"
  27: "それゆえ、謎[なぞ]を語[かた]る者[もの]たちは言[い]う。「エセボンに来[こ]い。シホンの町[まち]が建[た]てられ、整[ととの]えられるために。"
  28: "エセボンから火[ひ]が出[で]、シホンの町[まち]から炎[ほのお]が出[で]て、モアブまで食[く]い尽[つ]くし、アルノンの石柱[せきちゅう]を飲[の]み込[こ]んだからである。"
  29: "モアブよ、あなたは災[わざわ]いだ。ハモスの民[たみ]よ、あなたは滅[ほろ]びた。その息子[むすこ]たちは逃[に]げ延[の]びるために引[ひ]き渡[わた]され、その娘[むすめ]たちはアモリ人[じん]の王[おう]シホンに捕[とりこ]にされた。"
  30: "彼[かれ]らの種[たね]はエセボンからダイボンまで滅[ほろ]びる。女[おんな]たちはさらにモアブの上[うえ]に火[ひ]を燃[も]やし加[くわ]えた。」"
  31: "イスラエルはアモリ人[じん]のすべての町[まち]に住[す]んだ。"
  32: "モーセはイアゼルを探[さぐ]るために人[ひと]を送[おく]り、彼[かれ]らはイアゼルとその村[むら]々を取[と]り、そこに住[す]むアモリ人[じん]を追[お]い出[だ]した。"
  33: "彼[かれ]らは向[む]きを変[か]えて、バシャンへの道[みち]を上[のぼ]った。バシャンの王[おう]オグは、彼[かれ]らを迎[むか]えるために、すべての民[たみ]とともにエドラインへ戦[たたか]いに出[で]た。"
  34: "主[しゅ]はモーセに言[い]われた。「彼[かれ]を恐[おそ]れてはならない。わたしは彼[かれ]とそのすべての民[たみ]、そのすべての地[ち]をあなたの手[て]に渡[わた]したからである。あなたは、エセボンに住[す]んでいたアモリ人[じん]の王[おう]シホンにしたとおりに、彼[かれ]にも行[おこな]いなさい。」"
  35: "彼[かれ]らは彼[かれ]とその息子[むすこ]たち、そのすべての民[たみ]を打[う]ち、一[ひと]人[り]も生[い]き残[のこ]る者[もの]がないまでにした。そして彼[かれ]らの地[ち]を嗣業[しぎょう]として受[う]け継[つ]いだ。"

notes:
  1: "ἤκουσεν ὁ Χανανις βασιλεὺς Αραδ — услышал Хананей, царь Арада (Χανανις — «хананей», слав. «хананей»; не «царь Арада, хананей»). ἦλθεν γὰρ Ισραηλ ὁδὸν Αθαριν — ибо Израиль пришёл дорогой Афарим (γάρ — пояснение; LXX Αθαριν, ед. ч., передаёт евр. Атарим). κατεπρονόμευσαν ἐξ αὐτῶν αἰχμαλωσίαν — «захватили из них добычу пленников» (καταπρονομεύω — «разграблять»; мн. ч.: хананеи; слав. «взя от них плен»)."
  2: "ηὔξατο … εὐχὴν κυρίῳ — дал обет Господу (εὐχή — 誓願, как по корпусу). ἐὰν παραδῷς … ὑποχείριον — если предашь в руки (ὑποχείριος — «подручный»). ἀναθεματιῶ — положу заклятие, 聖絶 (ἀναθεματίζω; слав. «погублю»; в Лев 27 ἀνάθεμα — 聖絶)."
  3: "εἰσήκουσεν … τῆς φωνῆς — услышал голос (ἀκούω + род.). παρέδωκεν τὸν Χανανιν ὑποχείριον αὐτοῦ — предал Хананея в руки его. ἐπεκάλεσαν τὸ ὄνομα — нарекли имя (ἐπικαλέω). Ἀνάθεμα — «Заклятие»: LXX передаёт так евр. имя Хорма (חָרְמָה); отсюда アナテマ, а не перевод."
  4: "ἀπάραντες ἐξ Ωρ τοῦ ὄρους — отправившись от горы Ор (Ωρ — Хор, ホル山). ὁδὸν ἐπὶ θάλασσαν ἐρυθράν — путём к Красному (Чермному) морю, 紅海. περιεκύκλωσαν γῆν Εδωμ — обошли землю Едома кругом (περικυκλόω). ὠλιγοψύχησεν — пал духом, уныл (ὀλιγοψυχέω; слав. «малодушествоваша»)."
  5: "κατελάλει — говорил против, злословил (καταλαλέω; слав. «роптаху»); с πρός τόν θεόν и κατά Μωυσῆ — «на Бога и на Моисея». Ἵνα τί — «зачем» (вопрос-укор). ἄρτος διάκενος — «пустой хлеб» (διάκενος — «совершенно пустой»), т.е. манна; 空しいパン. προσώχθισεν — вознегодовала, опротивела (προσοχθίζω)."
  6: "τοὺς ὄφεις τοὺς θανατοῦντας — змеев умерщвляющих (θανατόω — «умерщвлять»; слав. «умерщвляющих»). ἔδακνον — жалили, кусали (δάκνω, imperfect — длительное действие). ἀπέθανεν λαὸς πολύς — умерло множество народа."
  7: "Ἡμάρτομεν ὅτι κατελαλήσαμεν — согрешили, что говорили против (καταλαλέω, ср. 5). εὖξαι — помолись (imper. aor. εὔχομαι). ἀφελέτω ἀφ᾽ ἡμῶν τὸν ὄφιν — пусть удалит от нас змея (ἀφαιρέω; ед. ч. собирательно, как в евр.). ηὔξατο περὶ τοῦ λαοῦ — помолился о народе."
  8: "Поίησον σεαυτῷ ὄφιν — сделай себе змея (σεαυτῷ — «себе»). ἐπὶ σημεῖου — на знамя, на шест (σημεῖον — «знак, знамя»; отсюда 旗竿). ὁ δεδηγμένος — ужаленный (perfect pass. δάκνω). ἰδὼν αὐτὸν ζήσεται — взглянув на него, будет жить. В 8-м χαλκοῦν нет — 〔青銅の〕 взято из csl (см. шапку)."
  9: "ὄφιν χαλκοῦν — медного змея (χαλκοῦς — «медный, бронзовый»; 青銅). ἔστησεν ἐπὶ σημεῖου — поставил на знамя. ἐπέβλεψεν ἐπὶ τὸν ὄφιν — взглянул на змея (ἐπιβλέπω — «взирать»). ἔζη — оставался жив (imperfect)."
  10: "παρενέβαλον ἐν Ωβωθ — расположились станом в Овофе (παρεμβάλλω — «ставить стан»; Ωβωθ — евр. Овот). Формула стоянок повторяется в 11–20."
  11: "ἐν Αχελγαι ἐκ τοῦ πέραν — в Ахалгае по ту сторону (Ἀχελγαι; слав. «ахалгеи»; アケルガイ). κατὰ πρόσωπον Μωαβ — напротив Моава. κατὰ ἀνατολὰς ἡλίου — к восходу солнца (букв. «по востокам солнца»)."
  12: "εἰς φάραγγα Ζαρετ — в долину (ущелье) Заред (φάραγξ — «ущелье, овраг»; ザレト)."
  13: "τὸ ἐξέχον ἀπὸ τῶν ὁρίων τῶν Αμορραίων — выступающее от пределов Аморрея (ἐξέχω — «выдаваться»; ὅρια — 領界). ἔστιν γὰρ Αρνων ὅρια Μωαβ — ибо Арнон — граница Моава. ἀνὰ μέσον Μωαβ καὶ … τοῦ Αμορραίου — между Моавом и Аморреем."
  14: "διὰ τοῦτο λέγεται ἐν βιβλίῳ Πόλεμος τοῦ κυρίου — поэтому сказано в книге «Война Господа» (βιβλίον — «книга»; слав. «в книзе брань Господня»). τὴν Ζωοβ ἐφλόγισεν — Зоов воспламенил (ἐφλόγισεν — «сжёг»; слав. «зоову попали»; евр. текст здесь тёмен, Вагеб в Суфе). Цитата продолжается в 15-м."
  15: "τοὺς χειμάρρους κατέστησεν κατοικίσαι Ηρ — потоки поставил, чтобы обитать Ир (χείμαρρος — «зимний поток, русло»; Ηρ — Ир). πρόσκειται τοῖς ὁρίοις Μωαβ — прилегает к пределам Моава (πρόσκειμαι). Место тёмное; держимся LXX буквально, не сглаживая."
  16: "τὸ φρέαρ — колодец, 井戸 (φρέαρ). ὃ εἶπεν κύριος πρὸς Μωυσῆν — о котором сказал Господь Моисею. Слова Господа — в 「…」. Слав. прибавляет «(воздвигошася)» — в текст не внесено."
  17: "ᾖσεν … τὸ ᾆσμα τοῦτο — воспел эту песнь (ᾄδω, ᾆσμα). ἐπὶ τοῦ φρέατος — у колодца (ἐπί + род.). Ἐξάρχετε αὐτῷ — «запевайте ему» (ἐξάρχω — «начинать петь»; слав. «начинайте ему»). Песнь продолжается в 18-м."
  18: "ὤρυξαν αὐτὸ ἄρχοντες — выкопали его князья (ὀρύσσω). ἐξελατόμησαν — высекли (ἐκλατομέω, от λατομέω — «резать камень»). βασιλεῖς ἐθνῶν — цари народов. ἐν τῷ κυριεῦσαι αὐτῶν — когда они господствовали (κυριεύω). ἀπὸ φρέατος εἰς Μανθαναιν — от колодца в Манфанаин (после песни возобновляется маршрут)."
  19: "Маршрут без глагола — как в LXX: καὶ ἀπὸ Μανθαναιν εἰς Νααλιηλ … (подразумевается «отправились»). Νααλιηλ — Наалиил; Βαμωθ — Вамоф (слав. «вамоф»)."
  20: "εἰς νάπην — в лощину, долину (νάπη — «лесистая лощина»); csl читает как имя «напин», ru — «Гай»; в тексте по LXX — 谷. ἀπὸ κορυφῆς τοῦ λελαξευμένου — с вершины высеченной [скалы] (λαξεύω — «высекать»). τὸ βλέπον κατὰ πρόσωπον τῆς ἐρήμου — обращённой лицом к пустыне."
  21: "ἀπέστειλεν … πρέσβεις — послал послов (πρέσβεις — 使者). λόγοις εἰρηνικοῖς λέγων — со словами мирными, говоря (датив образа действия)."
  22: "Παρελευσόμεθα — «мы пройдём» (futurum в значении просьбы, как в слав.). οὐκ ἐκκλινοῦμεν — не свернём (ἐκκλίνω). ἀγρός, ἀμπελών — поле, виноградник. ὁδῷ βασιλικῇ — царской дорогой (датив пути). ἕως παρέλθωμεν τὰ ὅριά σου — пока не пройдём пределов твоих."
  23: "οὐκ ἔδωκεν … παρελθεῖν — не дал пройти (δίδωμι + inf.). συνήγαγεν πάντα τὸν λαόν — собрал весь народ свой. ἐξῆλθεν παρατάξασθαι — вышел выстроиться в боевой порядок (παρατάσσομαι). εἰς Ιασσα — в Иассу (Ясса). παρετάξατο τῷ Ισραηλ — выстроился против Израиля (повтор, как в LXX)."
  24: "ἐπάταξεν … φόνῳ μαχαίρης — поразил избиением меча (φόνος — «убийство»; μάχαιρα — 剣). κατεκυρίευσαν τῆς γῆς αὐτοῦ — овладели землёй его (κατακυριεύω + род.). ἕως υἱῶν Αμμαν — до сынов Аммона. ὅτι Ιαζηρ ὅρια υἱῶν Αμμων ἐστίν — ибо Иазер — предел сынов Аммона."
  25: "ἔλαβεν … πάσας τὰς πόλεις ταύτας — взял все эти города. κατῴκησεν — поселился (κατοικέω). ἐν πάσαις ταῖς συγκυρούσαις αὐτῇ — во всех прилегающих к нему (συγκυρέω — «сходиться, прилегать»; слав. «подлежащих»)."
  26: "ἔστιν γὰρ Εσεβων πόλις Σηων — ибо Есевон — город Сигона (Σηων — シホン, как в Пс 134–135). ἐπολέμησεν βασιλέα Μωαβ τὸ πρότερον — воевал с царём Моава прежде (ἐπολέμησεν + винительный). ἔλαβον — мн. ч. «взяли» (он и его люди; слав. «взя» ед. ч.); в переводе сохранено мн. ч."
  27: "οἱ αἰνιγματισταί — «загадочники», сочинители притч-загадок (αἴνιγμα — «загадка»; слав. «приточницы»); отсюда 謎を語る者たち. ἵνα οἰκοδομηθῇ καὶ κατασκευασθῇ — чтобы построился и был устроен (οἰκοδομέω, κατασκευάζω). Цитата идёт до 30-го."
  28: "πῦρ ἐξῆλθεν ἐξ Εσεβων — огонь вышел из Есевона. φλόξ — пламя (炎). κατέφαγεν ἕως Μωαβ — пожрал до Моава (κατεσθίω). κατέπιεν στήλας Αρνων — поглотил столпы Арнона (καταπίνω; στήλη — «столп, стела»; слав. «столпы арнонския»); 石柱."
  29: "οὐαί σοι, Μωαβ — горе тебе, Моав. ἀπώλου — погиб ты (aor. med. ἀπόλλυμι). λαὸς Χαμως — народ Хамоса (Χαμως — бог Моава; ハモス). ἀπεδόθησαν … διασῴζεσθαι — отданы, чтобы спасаться (ἀποδίδωμι; слав. «продани быша … в заключение»; место тёмное). αἰχμάλωτοι τῷ βασιλεῖ … Σηων — в плен царю Сигону."
  30: "τὸ σπέρμα αὐτῶν ἀπολεῖται — семя их погибнет. Εσεβων ἕως Δαιβων — от Есевона до Дивона (Δαιβων — Дибон). αἱ γυναῖκες ἔτι προσεξέκαυσαν πῦρ ἐπὶ Μωαβ — женщины ещё разожгли огонь на Моава (προσεκκαίω — «прибавлять огня»; слав. «еще разожгоша огнь на моава»)."
  31: "Κατῴκησεν δὲ Ισραηλ — и поселился Израиль (краткое повторение 25-го; в LXX отдельный стих)."
  32: "ἀπέστειλεν … κατασκέψασθαι τὴν Ιαζηρ — послал высмотреть Иазер (κατασκέπτομαι — «осматривать, разведывать»). κατελάβοντο αὐτήν — овладели им (καταλαμβάνω). ἐξέβαλον τὸν Αμορραῖον — изгнали Аморрея."
  33: "ἐπιστρέψαντες ἀνέβησαν — повернув, поднялись (ἐπιστρέφω, ἀναβαίνω; дорога в Васан идёт в гору). εἰς συνάντησιν αὐτοῖς — навстречу им. εἰς πόλεμον εἰς Εδραιν — на войну к Едреи (Εδραιν — Едрея; エドライン)."
  34: "Μὴ φοβηθῇς — не бойся (аор. конъюнктив в запрете). παραδέδωκα — Я предал (perfect: решение уже состоялось). ποιήσεις αὐτῷ καθὼς ἐποίησας τῷ Σηων — поступишь с ним, как поступил с Сигоном. ὃς κατῴκει ἐν Εσεβων — который жил в Есевоне."
  35: "ἐπάταξεν αὐτὸν καὶ τοὺς υἱοὺς αὐτοῦ — поразил его и сыновей его. ἕως τοῦ μὴ καταλιπεῖν αὐτοῦ ζωγρείαν — до того, что не оставил ему никого живым (ζωγρεία — «добыча живых, пленные»; слав. «даже не оста в них живый»). ἐκληρονόμησαν τὴν γῆν αὐτῶν — наследовали землю их (мн. ч. αὐτῶν; 嗣業として受け継ぐ)."
