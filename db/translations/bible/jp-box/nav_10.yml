verses:
  1: "ヨシュアがアイを取[と]って聖絶[せいぜつ]したこと、すなわちエリコとその王[おう]にしたとおりにアイとその王[おう]にしたこと、またガバオンの住[す]む者[もの]たちがヨシュアとイスラエルに降[くだ]ったことを、エルサレムの王[おう]アドニベゼクが聞[き]いたとき、"
  2: "彼[かれ]らはひどく恐[おそ]れた。ガバオンは大[おお]きな町[まち]で、主要[しゅよう]な町[まち]の一[ひと]つに等[ひと]しく、その男[おとこ]たちはみな強[つよ]かったからである。"
  3: "そこで、エルサレムの王[おう]アドニベゼクは、ヘブロンの王[おう]アイラム、イエリムトの王[おう]フィドン、ラキシュの王[おう]イエフタ、オドラムの王[おう]ダビルに人[ひと]を遣[つか]わして言[い]った。"
  4: "「上[のぼ]って来[き]て、わたしを助[たす]けてくれ。われわれはガバオンを攻[せ]めよう。彼[かれ]らはヨシュアとイスラエルの人[ひと]々[びと]に降[くだ]ったからだ。」"
  5: "そこで、エブス人[じん]の五人[にん]の王[おう]、すなわちエルサレムの王[おう]、ヘブロンの王[おう]、イエリムトの王[おう]、ラキシュの王[おう]、オドラムの王[おう]が、彼[かれ]らとその民[たみ]すべてとともに上[のぼ]って来[き]て、ガバオンを取[と]り囲[かこ]み、これを攻[せ]めた。"
  6: "ガバオンの住[す]む者[もの]たちは、ガルガルの宿営[しゅくえい]にいるヨシュアのもとへ人[ひと]を遣[つか]わして言[い]った。「あなたのしもべたちから手[て]を離[はな]さないでください。すみやかにわたしたちのところへ上[のぼ]って来[き]て、わたしたちを救[すく]い出[だ]し、助[たす]けてください。山地[さんち]に住[す]むアモリ人[じん]の王[おう]たちがみな、わたしたちを攻[せ]めるために集[あつ]まっているからです。」"
  7: "ヨシュアはガルガルから上[のぼ]った。彼[かれ]と、彼[かれ]とともにいる戦[いくさ]の民[たみ]すべて、すなわち力[ちから]ある者[もの]すべてとともに。"
  8: "主[しゅ]はヨシュアに言[い]われた。「彼[かれ]らを恐[おそ]れてはならない。わたしは彼[かれ]らをあなたの手[て]に渡[わた]したからである。彼[かれ]らのうち、あなたがたの前[まえ]に立[た]ち残[のこ]る者[もの]は一[ひと]人[り]もいない。」"
  9: "ヨシュアは突然[とつぜん]彼[かれ]らの上[うえ]に襲[おそ]いかかった。ガルガルから夜[よ]通[どお]し行[い]進[しん]して来[き]たのである。"
  10: "主[しゅ]はイスラエルの人[ひと]々[びと]の前[まえ]で彼[かれ]らをかき乱[みだ]し、ガバオンで彼[かれ]らを非常[ひじょう]に大[おお]きく打[う]ち破[やぶ]られた。彼[かれ]らはオロニンの上[のぼ]り道[みち]を追[お]われ、アゼカとマケダに至[いた]るまで切[き]り倒[たお]された。"
  11: "彼[かれ]らがイスラエルの人[ひと]々[びと]の前[まえ]から逃[に]げ、オロニンの下[くだ]り坂[ざか]にさしかかったとき、主[しゅ]は天[てん]から大[おお]きな雹[ひょう]の石[いし]を、アゼカに至[いた]るまで彼[かれ]らに降[ふ]らせられた。雹[ひょう]の石[いし]のために死[し]んだ者[もの]は、イスラエルの人[ひと]々[びと]が戦[たたか]いの場[ば]で剣[つるぎ]で殺[ころ]した者[もの]よりも多[おお]かった。"
  12: "その日[ひ]、主[しゅ]がアモリ人[じん]をイスラエルの手[て]に渡[わた]し、ガバオンで彼[かれ]らを打[う]ち破[やぶ]って、彼[かれ]らがイスラエルの人[ひと]々[びと]の前[まえ]に敗[やぶ]れたとき、ヨシュアは主[しゅ]に語[かた]って言[い]った。「太陽[たいよう]よ、ガバオンの上[うえ]にとどまれ。月[つき]よ、アヤロンの谷[たに]の上[うえ]に。」"
  13: "太陽[たいよう]は止[と]まり、月[つき]も立[た]ち止[ど]まった。神[かみ]が彼[かれ]らの敵[てき]を討[う]たれるまで。太陽[たいよう]は天[てん]の真[ま]ん中[なか]に止[と]まり、一日[いちにち]の終[お]わりまで西[にし]へ進[すす]まなかった。"
  14: "このような日[ひ]は、以前[いぜん]にも後[のち]にもなかった。主[しゅ]が人[ひと]の声[こえ]を聞[き]き入[い]れられたような日[ひ]は。主[しゅ]がイスラエルのために戦[たたか]われたからである。"
  15: "〔ヨシュアは、イスラエルとともにガルガルの宿営[しゅくえい]へ帰[かえ]った。〕"
  16: "さて、この五人[にん]の王[おう]たちは逃[に]げて、マケダにある洞窟[どうくつ]に身[み]を隠[かく]した。"
  17: "ヨシュアに、「マケダの洞窟[どうくつ]に隠[かく]れている五人[にん]の王[おう]たちが見[み]つかった」と告[つ]げる者[もの]があった。"
  18: "ヨシュアは言[い]った。「洞窟[どうくつ]の口[くち]に大[おお]きな石[いし]を転[ころ]がし込[こ]み、彼[かれ]らを見張[みは]る者[もの]たちをそのそばに置[お]け。"
  19: "あなたがたはここで立[た]ち止[ど]まってはならない。あなたがたの敵[てき]の後[あと]を追[お]いかけ、そのしんがりを捕[と]らえ、彼[かれ]らが自分[じぶん]たちの町[まち]々に入[はい]るのを許[ゆる]してはならない。あなたがたの神[かみ]である主[しゅ]が彼[かれ]らをあなたがたの手[て]に渡[わた]されたからである。」"
  20: "ヨシュアとイスラエルの人[ひと]々[びと]が、彼[かれ]らをきわめて大[おお]きく打[う]ち、すっかり滅[ほろ]ぼし終[お]えたとき、助[たす]かった者[もの]たちは堅固[けんご]な町[まち]々へ逃[に]げ込[こ]んだ。"
  21: "民[たみ]はみな、無事[ぶじ]にマケダのヨシュアのもとへ帰[かえ]った。イスラエルの人[ひと]々[びと]に対[たい]して一言[ひとこと]も言[い]う者[もの]はなかった。"
  22: "ヨシュアは言[い]った。「洞窟[どうくつ]を開[ひら]き、あの五人[にん]の王[おう]たちを洞窟[どうくつ]から引[ひ]き出[だ]せ。」"
  23: "彼[かれ]らはそうして、五人[にん]の王[おう]たちを洞窟[どうくつ]から引[ひ]き出[だ]した。エルサレムの王[おう]、ヘブロンの王[おう]、イエリムトの王[おう]、ラキシュの王[おう]、オドラムの王[おう]である。"
  24: "彼[かれ]らをヨシュアのもとへ引[ひ]き出[だ]したとき、ヨシュアはイスラエル人[じん]すべてと、彼[かれ]とともに行[ゆ]く戦[いくさ]の長[おさ]たちを呼[よ]び寄[よ]せて、彼[かれ]らに言[い]った。「近[ちか]づいて、この王[おう]たちの首[くび]に足[あし]を置[お]け。」彼[かれ]らは近[ちか]づいて、その首[くび]に足[あし]を置[お]いた。"
  25: "ヨシュアは彼[かれ]らに言[い]った。「彼[かれ]らを恐[おそ]れてはならない。おののいてはならない。雄々[おお]しくし、強[つよ]くありなさい。あなたがたが戦[たたか]うすべての敵[てき]に、主[しゅ]はこのようにされるからである。」"
  26: "そのあと、ヨシュアは彼[かれ]らを打[う]ち殺[ころ]し、五本[ごほん]の木[き]にかけた。彼[かれ]らは夕[ゆう]べまで木[き]にかかったままだった。"
  27: "日[ひ]の沈[しず]むころ、ヨシュアは命[めい]じて、彼[かれ]らを木[き]から下[おろ]させ、彼[かれ]らが逃[に]げ込[こ]んだ洞窟[どうくつ]へ投[な]げ込[こ]ませ、洞窟[どうくつ]の口[くち]に大[おお]きな石[いし]を置[お]かせた。それらの石[いし]は今日[こんにち]に至[いた]るまでそこにある。"
  28: "彼[かれ]らはその日[ひ]、マケダを取[と]り、剣[つるぎ]の刃[やいば]にかけて、その中[なか]の息[いき]のあるものすべてを聖絶[せいぜつ]した。逃[に]げ延[び]びた者[もの]も逃[に]げ切[き]った者[もの]も、そこには一[ひと]人[り]も残[のこ]らなかった。彼[かれ]らはマケダの王[おう]に、エリコの王[おう]にしたとおりにした。"
  29: "ヨシュアとイスラエル人[じん]すべては、彼[かれ]とともにマケダからレブナへ進[すす]み、レブナを攻[せ]めた。"
  30: "主[しゅ]はそれをイスラエルの手[て]に渡[わた]された。彼[かれ]らはそれをその王[おう]ともども取[と]り、剣[つるぎ]の刃[やいば]にかけて、その中[なか]の息[いき]のあるものすべてを打[う]った。そこには、逃[に]げ延[び]びた者[もの]も逃[に]げ切[き]った者[もの]も一[ひと]人[り]も残[のこ]らなかった。彼[かれ]らはその王[おう]に、エリコの王[おう]にしたとおりにした。"
  31: "ヨシュアとイスラエル人[じん]すべては、彼[かれ]とともにレブナからラキシュへ進[すす]み、ラキシュを取[と]り囲[かこ]んで攻[せ]めた。"
  32: "主[しゅ]はラキシュをイスラエルの手[て]に渡[わた]された。彼[かれ]は二日目[ふつかめ]にそれを取[と]り、剣[つるぎ]の刃[やいば]にかけて、それを聖絶[せいぜつ]した。レブナにしたとおりである。"
  33: "そのとき、ガゼルの王[おう]アイラムがラキシュを助[たす]けるために上[のぼ]って来[き]たが、ヨシュアは彼[かれ]とその民[たみ]を剣[つるぎ]の刃[やいば]にかけて、逃[に]げ延[び]びた者[もの]も逃[に]げ切[き]った者[もの]も一[ひと]人[り]も残[のこ]さなかった。"
  34: "ヨシュアとイスラエル人[じん]すべては、彼[かれ]とともにラキシュからオドラムへ進[すす]み、オドラムを取[と]り囲[かこ]んで攻[せ]めた。"
  35: "主[しゅ]はそれをイスラエルの手[て]に渡[わた]された。彼[かれ]らはその日[ひ]にそれを取[と]り、剣[つるぎ]の刃[やいば]にかけて、その中[なか]の息[いき]のあるものすべてを打[う]った。ラキシュにしたとおりである。"
  36: "ヨシュアとイスラエル人[じん]すべては、彼[かれ]とともにヘブロンへ上[のぼ]り、ヘブロンを取[と]り囲[かこ]んだ。"
  37: "彼[かれ]らはそれを剣[つるぎ]の刃[やいば]にかけ、その中[なか]にあった息[いき]のあるものすべてを打[う]ち、逃[に]げ延[び]びた者[もの]は一[ひと]人[り]もいなかった。オドラムにしたとおりに、彼[かれ]らはそれを聖絶[せいぜつ]し、その中[なか]にあるものすべてを聖絶[せいぜつ]した。"
  38: "ヨシュアとイスラエル人[じん]すべては、ともにダビルへ向[む]かい、ダビルを取[と]り囲[かこ]んで、"
  39: "それをその王[おう]ともども、その村[むら]々ともども取[と]り、剣[つるぎ]の刃[やいば]にかけて、それを聖絶[せいぜつ]した。その中[なか]の息[いき]のあるものすべてを打[う]ち、逃[に]げ延[び]びた者[もの]を一[ひと]人[り]も残[のこ]さなかった。ヘブロンとその王[おう]にしたとおりに、ダビルとその王[おう]にもしたのである。"
  40: "こうしてヨシュアは、山地[さんち]の全[すべ]ての地[ち]、ネゲブ、平地[へいち]、アシドト、およびその王[おう]たちを打[う]った。逃[に]げ延[び]びた者[もの]を一[ひと]人[り]も残[のこ]さず、息[いき]のあるものすべてを聖絶[せいぜつ]した。イスラエルの神[かみ]である主[しゅ]が命[めい]じられたとおりである。"
  41: "すなわち、カデシュ・バルネアからガザまで、ゴソムの全[すべ]ての地[ち]をガバオンまで。"
  42: "また、彼[かれ]らの王[おう]たちすべてとその地[ち]を、ヨシュアは一[いち]度[ど]に打[う]った。イスラエルの神[かみ]である主[しゅ]がイスラエルのために戦[たたか]われたからである。"

notes:
  1: "Ὡς δὲ ἤκουσεν Αδωνιβεζεκ — когда услышал Адонибесек (Αδωνιβεζεκ; в слав. «адонивезек», в ru «Адониседек» — здесь транслитерация с греческого: アドニベゼク). ᾿Ον τρόπον ἐποίησαν τὴν Ιεριχω — как поступили с Иерихоном; вставка в тире есть в самом LXX, сохранена. αὐτομόλησαν — перебежали, сдались (αὐτομολέω; отсюда 降った). Стих обрывается на «καί» — продолжение в ст. 2."
  2: "ἐφοβήθησαν ἐν αὐτοῖς σφόδρα — устрашились в себе весьма; мн. ч. сохранено (ru сглаживает в ед. ч. «он испугался»). ὡσεὶ μία τῶν μητροπόλεων — «как один из городов-матерей», т.е. главных городов (μητρόπολις; слав. «яко един от великих градов», ru «как один из царских городов») — отсюда 主要な町. Слав./ru добавляют «и больше Гая» (масорет) — в гр. нет, не переводим."
  3: "ἀπέστειλεν … πρὸς Αιλαμ βασιλέα Χεβρων καὶ πρὸς Φιδων βασιλέα Ιεριμουθ καὶ πρὸς Ιεφθα βασιλέα Λαχις καὶ πρὸς Δαβιρ βασιλέα Οδολλαμ — имена царей даны по LXX: Αιλαμ (ヘブロン), Φιδων (イエリムト), Ιεφθα (ラキシュ), Δαβιρ (オドラム). В масорете и ru иные имена (Гогам, Фирам, Яфий, Девир) и иная привязка городов; следуем греческому. λέγων — «говоря»: речь в ст. 4."
  4: "Δεῦτε ἀνάβητε πρός με — придите, поднимитесь ко мне (δεῦτε — «идите сюда»). βοηθήσατέ μοι — помогите мне. ἐκπολεμήσωμεν Γαβαων — пойдём войной на Гаваон (ἐκπολεμέω). αὐτομόλησαν — сдались (ср. ст. 1)."
  5: "οἱ πέντε βασιλεῖς τῶν Ιεβουσαίων — пять царей иевусейских (в ст. 6 они же названы аморрейскими; расхождение самого LXX, сохранено: エブス人 / アモリ人). περιεκάθισαν — обложили, расположились вокруг (περικαθίζω). ἐξεπολιόρκουν — осаждали (imperfect, длительное действие; ἐκπολιορκέω)."
  6: "Μὴ ἐκλύσῃς τὰς χεῖράς σου ἀπὸ τῶν παίδων σου — «не ослабь (не отведи) рук твоих от рабов твоих» (ἐκλύω — «расслаблять»); отсюда 手を離さないでください. ἀνάβηθι … τὸ τάχος — поднимись скорее (τὸ τάχος — «быстро»). ἐξελοῦ — избавь (ἐξαιρέω). συνηγμένοι εἰσὶν ἐφ᾿ ἡμᾶς — собрались против нас (συνάγω). οἱ κατοικοῦντες τὴν ὀρεινήν — живущие на нагорье."
  7: "ἀνέβη Ἰησοῦς ἐκ Γαλγαλων — поднялся Иисус из Галгала. πᾶς ὁ λαὸς ὁ πολεμιστής — весь народ воинский (πολεμιστής — «воин»). πᾶς δυνατὸς ἐν ἰσχύι — всякий сильный крепостью (слав. «всяк сильный крепостию»)."
  8: "Μὴ φοβηθῇς αὐτούς — не бойся их (аорист в запрете). παραδέδωκα — Я предал (perfect: решение уже состоялось). οὐχ ὑπολειφθήσεται … οὐθεὶς ἐνώπιον ὑμῶν — никто не останется пред вами (ὑπολείπω; слав. «не останет … ни един»)."
  9: "ἐπιπαρεγένετο ἐπ᾿ αὐτοὺς ἄφνω — внезапно пришёл на них (ἐπιπαραγίνομαι; ἄφνω — «внезапно»). ὅλην τὴν νύκτα εἰσεπορεύθη — всю ночь шёл (εἰσπορεύομαι; слав. «всю бо нощь иде»)."
  10: "ἐξέστησεν — привёл в смятение, ошеломил (ἐξίστημι; слав. «ужаси»). συνέτριψεν … σύντριψιν μεγάλην — сокрушил сокрушением великим (внутренний объект, как в LXX). ὁδὸν ἀναβάσεως Ωρωνιν — дорогой восхождения Оронин (Ωρωνιν — евр. Беф-Хорон; в ru «Вефорон»); オロニン. κατέκοπτον — рубили, истребляли (imperfect). Αζηκα — Азека; Μακηδα — Македа."
  11: "ἐπὶ τῆς καταβάσεως Ωρωνιν — при спуске Оронин (κατάβασις — «сход, спуск»; ср. ἀνάβασις в ст. 10). λίθους χαλάζης — камни града (χάλαζα — «град»); отсюда 雹の石. ἐγένοντο πλείους οἱ ἀποθανόντες … ἢ οὓς ἀπέκτειναν … μαχαίρᾳ — умерших было больше, чем убитых мечом; сравнение сохранено."
  12: "ᾗ ἡμέρᾳ παρέδωκεν ὁ θεὸς τὸν Αμορραῖον ὑποχείριον — в тот день, когда Бог предал Аморрея в руки (ὑποχείριον — «под руку»). ἡνίκα συνέτριψεν … καὶ συνετρίβησαν — когда сокрушил их и они были сокрушены; двойное употребление глагола сохранено. Στήτω ὁ ἥλιος κατὰ Γαβαων — «да станет солнце над Гаваоном» (κατά + вин. — «против, над»); 太陽よ、ガバオンの上にとどまれ. φάραγξ Αιλων — долина Аялон (Αιλων; в брифу アヤロン). В брифу для ст. 12–13 стоит ギベオン, но в списке имён брифa и во всей главе — ガバオン; держимся единой формы ガバオン."
  13: "ἐν στάσει — в стоянии (στάσις; слав. «в стоянии»). ἕως ἠμύνατο ὁ θεὸς τοὺς ἐχθροὺς αὐτῶν — доколе Бог не отмстил врагам их (ἀμύνω — «отражать, мстить»); подлежащее — Бог, а не народ (ru сглаживает «доколе народ мстил»). κατὰ μέσον τοῦ οὐρανοῦ — посреди неба. οὐ προεπορεύετο εἰς δυσμάς — не продвигалось к западу (προπορεύομαι). εἰς τέλος ἡμέρας μιᾶς — до конца одного дня. Слав. вставляет перед этим «Не сие ли есть писано в книгах праведнаго» (книга Праведного, масорет) — в греч. нет, не переводим."
  14: "οὐκ ἐγένετο ἡμέρα τοιαύτη οὐδὲ τὸ πρότερον οὐδὲ τὸ ἔσχατον — не было такого дня ни прежде, ни после. ὥστε ἐπακοῦσαι θεὸν ἀνθρώπου — так что Бог послушал человека (ἐπακούω + род.). ὅτι κύριος συνεπολέμησεν τῷ Ισραηλ — ибо Господь воевал вместе с Израилем (συμπολεμέω)."
  15: "В gr-lxx-byz на месте этого стиха стоит точка: строки нет (в базе `.`), поэтому стих целиком в 〔…〕 по правилу документации. Содержание — слав. чтение: «И возвратися иисус и весь израиль с ним в полк в галгалы». У csl-ru эта же строка повторена ещё раз в ст. 43 (в греч. модуле ст. 43 отсутствует), отсюда разница нумерации: 42 стиха у гр. против 43 у csl. Это пробел греческого модуля, а не вставка Церкви; скобки поставлены по букве правила, в notes оговорено."
  16: "ἔφυγον οἱ πέντε βασιλεῖς … καὶ κατεκρύβησαν — убежали пять царей и скрылись (κατακρύπτω). εἰς τὸ σπήλαιον τὸ ἐν Μακηδα — в пещеру, что в Македе (σπήλαιον — 洞窟)."
  17: "ἀπηγγέλη τῷ Ἰησοῦ λέγοντες — возвещено было Иисусу, говоря (мн. ч. λέγοντες при безличном ἀπηγγέλη; слав. «поведаша»). Εὕρηνται … κεκρυμμένοι — найдены … скрывающимися (perfect). Донесение передано прямой речью в 「…」, как и в ru."
  18: "Κυλίσατε λίθους ἐπὶ τὸ στόμα τοῦ σπηλαίου — привалите камни к устью пещеры (κυλίω — «катить»). καταστήσατε ἄνδρας φυλάσσειν ἐπ᾿ αὐτούς — поставьте мужей стеречь их (φυλάσσω). Приказ продолжается в ст. 19, кавычки закрываются там."
  19: "μὴ ἑστήκατε καταδιώκοντες — «не стойте, преследуя» (запрет с perfect в значении «не оставайтесь стоять»). καταλάβετε τὴν οὐραγίαν αὐτῶν — захватите арьергард, тыл их (οὐραγία — «хвост войска»; отсюда しんがり). μὴ ἀφῆτε εἰσελθεῖν — не дайте войти (ἀφίημι). παρέδωκεν γὰρ αὐτοὺς κύριος ὁ θεὸς ἡμῶν — ибо предал их Господь Бог наш."
  20: "ὡς κατέπαυσεν Ἰησοῦς καὶ πᾶς υἱὸς Ισραηλ κόπτοντες — когда перестали Иисус и всякий сын Израиля истреблять (παύω в значении «прекращать»). κοπὴν μεγάλην σφόδρα ἕως εἰς τέλος — поражением великим весьма до конца. οἱ διασῳζόμενοι διεσώθησαν εἰς τὰς πόλεις τὰς ὀχυράς — уцелевшие спаслись в города укреплённые (ὀχυρός — «крепкий, укреплённый»)."
  21: "ἀπεστράφη πᾶς ὁ λαὸς πρὸς Ἰησοῦν εἰς Μακηδα ὑγιεῖς — возвратился весь народ к Иисусу в Македу здравым (ὑγιής — «здоровый, целый»). οὐκ ἔγρυξεν οὐθεὶς … τῇ γλώσσῃ αὐτοῦ — никто не пикнул языком своим (γρύζω — «ворчать, бормотать»; слав. «не возскомле … языком своим»); отсюда 一言も言う者はなかった."
  22: "Ἀνοίξατε τὸ σπήλαιον — откройте пещеру. ἐξαγάγετε τοὺς πέντε βασιλεῖς τούτους — выведите этих пять царей (ἐξάγω)."
  23: "ἐξηγάγοσαν — вывели (3-е л. мн. ч. аориста). Перечисление царей то же, что в ст. 5 и 3, в том же порядке; слав. прибавляет «к нему»."
  24: "ἐπεὶ ἐξήγαγον αὐτοὺς — когда вывели их. τοὺς ἐναρχομένους τοῦ πολέμου τοὺς συμπορευομένους αὐτῷ — начальствующих на войне, ходивших с ним (ἐνάρχομαι — «начальствовать»). ἐπίθετε τοὺς πόδας ὑμῶν ἐπὶ τοὺς τραχήλους αὐτῶν — положите ноги ваши на шеи их (τράχηλος — «шея»; знак полной победы)."
  25: "Μὴ φοβηθῆτε … μηδὲ δειλιάσητε — не бойтесь и не малодушествуйте (δειλιάω — «робеть»). ἀνδρίζεσθε καὶ ἰσχύετε — мужайтесь и крепитесь; в корпусе формула передана 雄々しくし、強くありなさい (1 Кор 16:13). καταπολεμεῖτε — воюете против (καταπολεμέω)."
  26: "ἀπέκτεινεν … καὶ ἐκρέμασεν αὐτοὺς ἐπὶ πέντε ξύλων — убил их и повесил на пяти деревьях (ξύλον — «дерево, столб»). ἕως ἑσπέρας — до вечера."
  27: "πρὸς ἡλίου δυσμάς — при заходе солнца (δυσμή). ἐνετείλατο Ἰησοῦς καὶ καθεῖλον — повелел Иисус, и сняли (καθαιρέω). εἰς ὃ κατεφύγοσαν ἐκεῖ — в которую они убежали (καταφεύγω). ἐπεκύλισαν λίθους — привалили камни (ἐπικυλίω). ἕως τῆς σήμερον ἡμέρας — до сего дня (今日に至るまで)."
  28: "Καὶ τὴν Μακηδα ἐλάβοσαν — «и Македу взяли» (3-е л. мн. ч.; подлежащее — израильтяне, слав. «взяша», ru сглаживает «взял Иисус»). ἐφόνευσαν αὐτὴν ἐν στόματι ξίφους — поразили её «устами меча», т.е. остриём меча (στόμα ξίφους — формула LXX); отсюда 剣の刃にかけて. πᾶν ἐμπνέον — всё дышащее (息のあるもの). οὐ κατελείφθη … διασεσῳσμένος καὶ διαπεφευγώς — не остался никто спасшийся и убежавший (причастия perfect)."
  29: "ἀπῆλθεν … ἐκ Μακηδα εἰς Λεβνα — пошёл из Македы в Ливну (Λεβνα — レブナ; в ru «Ливна»). ἐπολιόρκει — осаждал (imperfect)."
  30: "παρέδωκεν αὐτὴν κύριος εἰς χεῖρας Ισραηλ — предал её Господь в руки Израиля. ἔλαβον αὐτὴν καὶ τὸν βασιλέα αὐτῆς — взяли её и царя её. οὐ κατελείφθη ἐν αὐτῇ οὐδὲ εἷς — не остался в ней ни один. ὃν τρόπον ἐποίησαν τῷ βασιλεῖ Ιεριχω — как поступили с царём Иерихона."
  31: "περιεκάθισεν αὐτὴν καὶ ἐπολιόρκει αὐτήν — обложил её и осаждал (ср. ст. 29; повтор формулы LXX)."
  32: "ἐν τῇ ἡμέρᾳ τῇ δευτέρᾳ — во второй день (二日目). ἐξωλέθρευσαν αὐτήν — истребили её (ἐξολεθρεύω). ὃν τρόπον ἐποίησαν τὴν Λεβνα — как поступили с Ливной. В слав. добавлено «и все дышущее в нем» — в гр. нет."
  33: "τότε ἀνέβη Αιλαμ βασιλεὺς Γαζερ βοηθήσων τῇ Λαχις — тогда поднялся Аилам, царь Газера, на помощь Лахису (Γαζερ — ガゼル; в слав. «орам царь газерск», в ru «Горам»; LXX даёт здесь то же имя Αιλαμ, что и в ст. 3, — транслитерируем одинаково: アイラム). ἕως τοῦ μὴ καταλειφθῆναι αὐτῶν σεσῳσμένον καὶ διαπεφευγότα — до того, что не осталось у них ни спасшегося, ни убежавшего."
  34: "ἐκ Λαχις εἰς Οδολλαμ — из Лахиса в Одоллам (Οδολλαμ — オドラム). περιεκάθισεν … καὶ ἐπολιόρκησεν — обложил и осаждал (аорист, в отличие от imperfect в 31)."
  35: "παρέδωκεν αὐτὴν κύριος ἐν χειρὶ Ισραηλ — предал её Господь в руку Израиля (ἐν χειρί, ед. ч., как в LXX). ἐν τῇ ἡμέρᾳ ἐκείνῃ — в тот день. ὃν τρόπον ἐποίησαν τῇ Λαχις — как поступили с Лахисом."
  36: "ἀπῆλθεν … εἰς Χεβρων — пошёл в Хеврон; в гр. нет «из Еглона» (это догадка ru помасоретски). περιεκάθισεν αὐτήν — обложил его."
  37: "ἐπάταξεν αὐτὴν ἐν στόματι ξίφους καὶ πᾶν ἐμπνέον — поразил её остриём меча и всё дышащее. οὐκ ἦν διασεσῳσμένος — не было спасшегося. ὃν τρόπον ἐποίησαν τὴν Οδολλαμ — как поступили с Одолламом. В слав. добавлено «и царя его, и вся веси его» — в гр. нет."
  38: "ἀπέστρεψεν … εἰς Δαβιρ — обратился к Давиру (Δαβιρ — ダビル). περικαθίσαντες αὐτὴν — обложив его: причастие, продолжение в ст. 39, поэтому стих кончается «、»."
  39: "ἔλαβον αὐτὴν καὶ τὸν βασιλέα αὐτῆς καὶ τὰς κώμας αὐτῆς — взяли его, и царя его, и села его (κώμη — 村). ἐξωλέθρευσαν … καὶ πᾶν ἐμπνέον — истребили и всё дышащее. οὐ κατέλιπον αὐτῇ οὐδένα διασεσῳσμένον — не оставили в нём никого спасшегося. Слав. добавляет в конце «и якоже сотвориша левне и царю ея» — в гр. нет."
  40: "τὴν γῆν τῆς ὀρεινῆς — землю нагорную; τὴν Ναγεβ — Негев (ネゲブ, юг); τὴν πεδινὴν — низменность (平地); τὴν Ασηδωθ — Аседоф (אשדות, «склоны»; アシドト — форма, единая для 10:40; 11:22; 12:3, 8). πᾶν ἐμπνέον ζωῆς — всё дышащее жизнью. ὃν τρόπον ἐνετείλατο κύριος — как заповедал Господь."
  41: "ἀπὸ Καδης Βαρνη ἕως Γάζης — от Кадес-Варни до Газы (カデシュ・バルネア, ガザ). πᾶσαν τὴν Γοσομ — всю землю Госом (Γοσομ; в ru «Гошен»). ἕως τῆς Γαβαων — до Гаваона. Глагол остался в ст. 40; стих — продолжение перечня, поэтому без «。」 в начале и с «。」 в конце."
  42: "καὶ πάντας τοὺς βασιλεῖς αὐτῶν καὶ τὴν γῆν αὐτῶν ἐπάταξεν Ἰησοῦς εἰς ἅπαξ — и всех царей их и землю их поразил Иисус разом (εἰς ἅπαξ — «за один раз», слав. «единою»). ὅτι κύριος ὁ θεὸς Ισραηλ συνεπολέμει τῷ Ισραηλ — ибо Господь Бог Израилев воевал за Израиля (imperfect — постоянное действие)."
