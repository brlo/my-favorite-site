# jp-box, Иисус Навин, глава 10. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в главе отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 10: союз пяти царей против Гаваона (1–5); просьба гаваонитян (6);
# ночной переход из Галгала, поражение при Гаваоне, каменный град (7–11);
# солнце над Гаваоном и луна над Аялоном (12–14); пять царей в пещере Македа (15–27);
# поход на юг: Макед, Ливна, Лахис, Еглон, Хеврон, Давир (28–39); итог (40–42).
# Нумерация: 42 стиха — по gr-lxx-byz (у csl-ru 43). В гр. на месте ст. 15 стоит
# точка: «И возвратился Иисус и весь Израиль в стан, в Галгал» в греч. модуле нет
# (эта строка у csl повторена дважды — в 15 и в 43). По правилу «стих в базе `.' —
# целиком в 〔…〕» ст. 15 обёрнут в 〔…〕; это пробел греческого модуля, а не вставка
# Церкви, о чём сказано в notes. Ст. 43 в нашей нумерации нет.
# Кавычки: речь Адонибезека — 「…」 (4); просьба гаваонитян — 「…」 (6); речь Господа —
# 「…」 (8); молитва Иисуса — 「…」 (12); приказ Иисуса — 「…」 (18–19), (22), (24), (25).
# Красного <j> нет. Сносок ⟨…⟩ нет: 聖絶, 祭壇, 契約 уже в корпусе.
# Отличия LXX: 10:1–2 слав. и ru добавляют «и быша в них» и «больше Гая» — в гр. нет;
# 10:3 в гр. имена царей иные, чем в масорете (Αιλαμ, Φιδων, Ιεφθα, Δαβιρ) — держимся
# греческого; 10:5 гр. называет царей «иевусейскими», а 10:6 — «аморрейскими»;
# 10:13 слав. вставляет «Не сие ли есть писано в книгах праведнаго» (книга Праведного,
# масорет) — в гр. нет, не переводим; 10:15 — см. выше.
# jp-ni не использовался.

