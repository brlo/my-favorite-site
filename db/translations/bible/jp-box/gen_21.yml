verses:
  1: "主[しゅ]は言[い]われたとおりにサラを顧[かえり]み、主[しゅ]は語[かた]られたとおりにサラになさった。"
  2: "サラは身[み]ごもって、アブラハムの老[お]いに、主[しゅ]が彼[かれ]に語[かた]られた定[さだ]めの時[とき]に、男[おとこ]の子[こ]を産[う]んだ。"
  3: "アブラハムは、サラが彼[かれ]に産[う]んだ子[こ]、その生[う]まれた息子[むすこ]の名[な]をイサクと名[な]づけた。"
  4: "アブラハムは、神[かみ]が彼[かれ]に命[めい]じられたとおりに、八日[ようか]目[め]にイサクに割礼[かつれい]を施[ほどこ]した。"
  5: "アブラハムは、その子[こ]イサクが生[う]まれたとき、百歳[ひゃくさい]であった。"
  6: "サラは言[い]った。「主[しゅ]はわたしに笑[わら]いを与[あた]えてくださいました。聞[き]く者[もの]はみな、わたしとともに喜[よろこ]ぶでしょう。」"
  7: "そして言[い]った。「誰[だれ]がアブラハムに、『サラが子[こ]に乳[ちち]を飲[の]ませている』と告[つ]げるだろうか。わたしは年[とし]を取[と]ってから男[おとこ]の子[こ]を産[う]んだのに。」"
  8: "子[こ]は育[そだ]ち、乳[ちち]を離[はな]れた。アブラハムは、その子[こ]イサクが乳[ちち]を離[はな]れた日[ひ]に、大[おお]きな宴[うたげ]を開[ひら]いた。"
  9: "サラは、エジプト人[じん]ハガルがアブラハムに産[う]んだ子[こ]が、自分[じぶん]の子[こ]イサクと遊[あそ]んでいるのを見[み]た。"
  10: "そしてアブラハムに言[い]った。「この女奴隷[おんなどれい]とその子[こ]を追[お]い出[だ]しなさい。この女奴隷[おんなどれい]の子[こ]は、わたしの子[こ]イサクとともに跡[あと]を継[つ]ぐことはないからです。」"
  11: "このことばは、自分[じぶん]の子[こ]のことで、アブラハムには非常[ひじょう]に苦[くる]しく思[おも]えた。"
  12: "神[かみ]はアブラハムに言[い]われた。「その子[こ]のこと、女奴隷[おんなどれい]のことで、そのことばを苦[くる]しく思[おも]ってはならない。サラがあなたに言[い]うことは何[なに]でも、その声[こえ]を聞[き]きなさい。イサクによって、あなたの子孫[しそん]が名[な]づけられるからである。"
  13: "この女奴隷[おんなどれい]の子[こ]も、わたしは大[おお]きな民[たみ]とする。彼[かれ]はあなたの子孫[しそん]だからである。」"
  14: "アブラハムは朝[あさ]早[はや]く起[お]き、パンと水[みず]の皮袋[かわぶくろ]を取[と]ってアガルに与[あた]え、それを彼女[かのじょ]の肩[かた]に負[お]わせ、その子[こ]もまた負[お]わせて、彼女[かのじょ]を送[おく]り出[だ]した。彼女[かのじょ]は行[い]って、誓[ちか]いの井戸[いど]のあたりの荒[あ]れ野[の]をさまよった。"
  15: "皮袋[かわぶくろ]の水[みず]が尽[つ]きたので、彼女[かのじょ]は子[こ]を一本[いっぽん]のもみの木[き]の下[した]に投[な]げ出[だ]した。"
  16: "彼女[かのじょ]は行[い]って、弓[ゆみ]の届[とど]くほどの遠[とお]くに、子[こ]の向[む]かい側[がわ]に座[すわ]った。「わたしの子[こ]が死[し]ぬのを見[み]たくない」と、彼女[かのじょ]は言[い]ったからである。彼女[かのじょ]は子[こ]の向[む]かい側[がわ]に座[すわ]った。子[こ]は声[こえ]を上[あ]げて泣[な]いた。"
  17: "神[かみ]は、その子[こ]がいる場所[ばしょ]から、その子[こ]の声[こえ]を聞[き]かれた。神[かみ]の天使[てんし]は天[てん]からアガルを呼[よ]んで言[い]った。「アガルよ、どうしたのか。恐[おそ]れてはならない。神[かみ]は、その子[こ]がいる場所[ばしょ]から、その子[こ]の声[こえ]を聞[き]かれたのだ。"
  18: "立[た]ちなさい。その子[こ]を起[お]こし、手[て]で支[ささ]えなさい。わたしは彼[かれ]を大[おお]きな民[たみ]とするからである。」"
  19: "神[かみ]が彼女[かのじょ]の目[め]を開[ひら]かれたので、彼女[かのじょ]は生[い]きた水[みず]の井戸[いど]を見[み]た。彼女[かのじょ]は行[い]って皮袋[かわぶくろ]を水[みず]で満[み]たし、子[こ]に飲[の]ませた。"
  20: "神[かみ]はその子[こ]とともにいた。子[こ]は育[そだ]ち、荒[あ]れ野[の]に住[す]み、弓[ゆみ]を射[い]る者[もの]になった。"
  21: "彼[かれ]はパランの荒[あ]れ野[の]に住[す]んだ。母[はは]は彼[かれ]に、エジプトの地[ち]から女[おんな]を娶[めと]らせた。"
  22: "そのころ、アビメレクと、その婚礼[こんれい]の世話役[せわやく]オホザトと、その軍[ぐん]の将軍[しょうぐん]ピコルが、アブラハムに言[い]った。「神[かみ]はあなたのなさることすべてにおいて、あなたとともにいる。"
  23: "だから今[いま]、わたしに神[かみ]にかけて誓[ちか]ってください。わたしを欺[あざむ]かず、わたしの子孫[しそん]も、わたしの名[な]も欺[あざむ]かないと。わたしがあなたに対して行[おこな]った義[ぎ]に従[したが]って、あなたもわたしと、あなたが寄留[きりゅう]しているこの地[ち]に対して行[おこな]ってください。」"
  24: "アブラハムは言[い]った。「わたしは誓[ちか]います。」"
  25: "アブラハムは、アビメレクのしもべたちが奪[うば]った水[みず]の井戸[いど]のことで、アビメレクを責[せ]めた。"
  26: "アビメレクは言[い]った。「誰[だれ]がそんなことをしたのか、わたしは知[し]らなかった。あなたもわたしに告[つ]げなかったし、わたしも今日[きょう]まで聞[き]いていなかった。」"
  27: "アブラハムは羊[ひつじ]と牛[うし]を取[と]ってアビメレクに与[あた]え、二人[ふたり]は契約[けいやく]を結[むす]んだ。"
  28: "アブラハムは七匹[ななひき]の雌[めす]の子羊[こひつじ]を、別[べつ]に立[た]たせておいた。"
  29: "アビメレクはアブラハムに言[い]った。「あなたが別[べつ]に立[た]たせておいた、この七匹[ななひき]の雌[めす]の子羊[こひつじ]は、何[なん]のためか。」"
  30: "アブラハムは言[い]った。「この七匹[ななひき]の雌[めす]の子羊[こひつじ]を、わたしから受[う]け取[と]ってください。それは、この井戸[いど]をわたしが掘[ほ]ったという証[あかし]となるのです。」"
  31: "それゆえ、その場所[ばしょ]の名[な]は「誓[ちか]いの井戸[いど]」と呼[よ]ばれた。二人[ふたり]がそこで誓[ちか]ったからである。"
  32: "こうして彼[かれ]らは誓[ちか]いの井戸[いど]で契約[けいやく]を結[むす]んだ。アビメレクと、その婚礼[こんれい]の世話役[せわやく]オホザトと、その軍[ぐん]の将軍[しょうぐん]ピコルは立[た]って、フィリスティムの地[ち]へ帰[かえ]って行[い]った。"
  33: "アブラハムは誓[ちか]いの井戸[いど]のそばに畑[はたけ]を造[つく]り、そこで主[しゅ]の名[な]によって「永遠[えいえん]の神[かみ]」と呼[よ]んだ。"
  34: "アブラハムはフィリスティムの地[ち]に長[なが]く寄留[きりゅう]した。"

notes:
  1: "ἐπεσκέψατο τὴν Σαρραν — サラを顧みた (ἐπισκέπτομαι — «посещать, вспоминать»). καθὰ εἶπεν — 言われたとおりに. ἐποίησεν κύριος τῇ Σαρρα — 主はサラになさった (τῇ Σαρρα — дательный адресата)."
  2: "συλλαβοῦσα ἔτεκεν — 身ごもって産んだ (συλλαμβάνω — «зачинать»). εἰς τὸ γῆρας — 年老いたとき (букв. «в старость»). εἰς τὸν καιρόν — 定めの時に. καθὰ ἐλάλησεν αὐτῷ κύριος — 主が彼に語られたとおりに."
  3: "ἐκάλεσεν ... τὸ ὄνομα τοῦ υἱοῦ — 息子の名を…名づけた. τοῦ γενομένου αὐτῷ — 彼に生まれた (γίνομαι — «рождаться»). ὃν ἔτεκεν αὐτῷ Σαρρα — サラが彼に産んだ子."
  4: "περιέτεμεν ... τῇ ὀγδόῃ ἡμέρᾳ — 八日目に割礼を施した. καθὰ ἐνετείλατο αὐτῷ ὁ θεός — 神が命じられたとおりに (ἐντέλλομαι — «заповедать»)."
  5: "ἑκατὸν ἐτῶν — 百歳. ἡνίκα ἐγένετο αὐτῷ Ισαακ — イサクが生まれたとき."
  6: "Γέλωτά μοι ἐποίησεν κύριος — 主はわたしに笑いを与えてくださった (γέλως — «смех»; игра слов с именем Исаак). ὃς ἂν ἀκούσῃ, συγχαρεῖταί μοι — 聞く者はみな、わたしとともに喜ぶ (συγχαίρω — «радоваться вместе»)."
  7: "Τίς ἀναγγελεῖ τῷ Αβρααμ — 誰がアブラハムに告げるだろうか. ὅτι θηλάζει παιδίον Σαρρα; — サラが子に乳を飲ませていると (θηλάζω — «кормить грудью»). ἔτεκον υἱὸν ἐν τῷ γήρει μου — 年を取ってから男の子を産んだ."
  8: "ηὐξήθη τὸ παιδίον — 子は育った. ἀπεγαλακτίσθη — 乳を離れた (ἀπογαλακτίζω — «отнимать от груди»). δοχὴν μεγάλην — 大きな宴 (δοχή — «пир»)."
  9: "τὸν υἱὸν Αγαρ τῆς Αἰγυπτίας — エジプト人ハガルの子. παίζοντα μετὰ Ισαακ — イサクと遊んでいる (παίζω — «играть»; евр. «насмехаться», LXX — «играть»; держимся греческого)."
  10: "Ἔκβαλε τὴν παιδίσκην — 女奴隷を追い出しなさい (ἐκβάλλω — «выгонять»). οὐ γὰρ κληρονομήσει — 跡を継ぐことはない (κληρονομέω — «наследовать»)."
  11: "σκληρὸν ... ἐφάνη τὸ ῥῆμα σφόδρα — ことばは非常に苦しく思えた (σκληρός — «жестокий, тяжёлый»). περὶ τοῦ υἱοῦ αὐτοῦ — 自分の子のことで."
  12: "Μὴ σκληρὸν ἔστω — 苦しく思ってはならない. ἄκουε τῆς φωνῆς αὐτῆς — その声を聞きなさい. ἐν Ισαακ κληθήσεταί σοι σπέρμα — イサクによってあなたの子孫が名づけられる (κληθήσεται — «будет названо»)."
  13: "εἰς ἔθνος μέγα ποιήσω αὐτόν — 大きな民とする. ὅτι σπέρμα σόν ἐστιν — あなたの子孫だからである."
  14: "ἀνέστη ... τὸ πρωΐ — 朝早く起きた. ἀσκὸν ὕδατος — 水の皮袋 (ἀσκός — «мех»). ἐπέθηκεν ἐπὶ τὸν ὦμον καὶ τὸ παιδίον — 彼女の肩に、またその子も負わせた (греч. двусмысленно: «возложил на плечо и отрока»; слав. «возложи на плещи ея отроча»; двусмысленность сохранена). ἐπλανᾶτο τὴν ἔρημον — 荒れ野をさまよった. κατὰ τὸ φρέαρ τοῦ ὅρκου — 誓いの井戸のあたりで (φρέαρ — «колодец»; ὅρκος — «клятва»; евр. בְּאֵר שֶׁבַע, Вирсавия)."
  15: "ἐξέλιπεν τὸ ὕδωρ ἐκ τοῦ ἀσκοῦ — 皮袋の水が尽きた. ἔρριψεν τὸ παιδίον — 子を投げ出した (ῥίπτω — «бросать»). ὑποκάτω μιᾶς ἐλάτης — 一本のもみの木の下に (ἐλάτη — «ель, пихта»)."
  16: "ὡσεὶ τόξου βολήν — 弓の届くほど (τοξεύω — «стрелять из лука»). Οὐ μὴ ἴδω τὸν θάνατον — 死ぬのを見たくない (οὐ μή + аорист). ἀναβοῆσαν ... ἔκλαυσεν — 声を上げて泣いた (ἀναβοάω — «возопить»)."
  17: "εἰσήκουσεν ὁ θεὸς τῆς φωνῆς — 神は声を聞かれた (εἰσακούω + род.). ἐκ τοῦ τόπου, οὗ ἦν — いる場所から. Τί ἐστιν, Αγαρ; — アガルよ、どうしたのか. μὴ φοβοῦ — 恐れてはならない. ἐπακήκοεν — 聞かれた (perfect)."
  18: "ἀνάστηθι — 立ちなさい. κράτησον τῇ χειρί σου — 手で支えなさい (κρατέω — «держать»). εἰς ἔθνος μέγα — 大きな民に."
  19: "ἀνέῳξεν τοὺς ὀφθαλμούς — 目を開かれた. φρέαρ ὕδατος ζῶντος — 生きた水の井戸. ἔπλησεν τὸν ἀσκόν — 皮袋を満たした. ἐπότισεν τὸ παιδίον — 子に飲ませた."
  20: "ἦν ὁ θεὸς μετὰ τοῦ παιδίου — 神はその子とともにいた. ηὐξήθη — 育った. τοξότης — 弓を射る者 (τοξότης — «стрелок»)."
  21: "ἐν τῇ ἐρήμῳ τῇ Φαραν — パランの荒れ野に. ἔλαβεν αὐτῷ ἡ μήτηρ γυναῖκα — 母は彼に女を娶らせた (λαμβάνω — «брать» в значении «женить»). ἐκ γῆς Αἰγύπτου — エジプトの地から."
  22: "ἐν τῷ καιρῷ ἐκείνῳ — そのころ. Οχοζαθ ὁ νυμφαγωγός — 婚礼の世話役オホザト (νυμφαγωγός — «друг жениха, распорядитель свадьбы»). Φικολ ὁ ἀρχιστράτηγος — 軍の将軍ピコル (ἀρχιστράτηγος — «главнокомандующий»). Ὁ θεὸς μετὰ σοῦ ἐν πᾶσιν — 神はすべてにおいてあなたとともにいる."
  23: "ὄμοσόν μοι τὸν θεόν — わたしに神にかけて誓ってください. μὴ ἀδικήσειν με — 欺かないと (ἀδικέω — «обижать»). κατὰ τὴν δικαιοσύνην, ἣν ἐποίησα — わたしが行った義に従って. ᾗ σὺ παρῴκησας ἐν αὐτῇ — あなたが寄留している地."
  24: "Ἐγὼ ὀμοῦμαι — わたしは誓います."
  25: "ἤλεγξεν — 責めた (ἐλέγχω — «обличать»). περὶ τῶν φρεάτων — 井戸のことで. ὧν ἀφείλαντο οἱ παῖδες — しもべたちが奪った (ἀφαιρέομαι — «отнимать»)."
  26: "Οὐκ ἔγνων — 知らなかった. τίς ἐποίησεν τὸ πρᾶγμα τοῦτο — 誰がそんなことをしたのか. οὐδὲ σύ μοι ἀπήγγειλας — あなたも告げなかった. ἀλλ᾿ ἢ σήμερον — 今日まで (букв. «кроме как сегодня»)."
  27: "διέθεντο ἀμφότεροι διαθήκην — 二人は契約を結んだ (διατίθεμαι — «заключать»)."
  28: "ἑπτὰ ἀμνάδας προβάτων μόνας — 七匹の雌の子羊を別に (ἀμνάς — «ярочка»; μόνας — «отдельно»)."
  29: "Τί εἰσιν αἱ ἑπτὰ ἀμνάδες — 七匹の子羊は何のためか. ἃς ἔστησας μόνας — 別に立たせた."
  30: "λήμψῃ παρ᾿ ἐμοῦ — わたしから受け取ってください. εἰς μαρτύριον — 証として (μαρτύριον — «свидетельство»). ὤρυξα τὸ φρέας — 井戸を掘った (ὀρύσσω — «копать»)."
  31: "ἐπωνόμασεν τὸ ὄνομα τοῦ τόπου — その場所の名を…と呼んだ. Φρέαρ ὁρκισμοῦ — 誓いの井戸 (ὁρκισμός — «клятва»; евр. בְּאֵר שֶׁבַע, Беэр-Шева — «колодец семи» или «колодец клятвы»; в тексте не ベエルシバ). ὤμοσαν ἀμφότεροι — 二人が誓った."
  32: "διέθεντο διαθήκην ἐν τῷ φρέατι τοῦ ὅρκου — 誓いの井戸で契約を結んだ. ἐπέστρεψαν εἰς τὴν γῆν τῶν Φυλιστιιμ — フィリスティムの地へ帰った (Φυλιστιιμ — «филистимляне»; евр. פְּלִשְׁתִּים)."
  33: "ἐφύτευσεν ... ἄρουραν — 畑を造った (φυτεύω — «насаждать»; ἄρουρα — «пашня, поле»; евр. אֶשֶׁל, «тамариск», Синодальный — «рощу»). ἐπεκαλέσατο τὸ ὄνομα κυρίου — 主の名を呼んだ. Θεὸς αἰώνιος — 永遠の神 (букв. «Бог вечный»; имя-исповедание)."
  34: "παρῴκησεν ... ἡμέρας πολλάς — 長く寄留した (παροικέω — «жить пришельцем»)."
