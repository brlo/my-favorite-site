verses:
  1: "主[しゅ]はシナイの荒野[こうや]で、彼[かれ]らがエジプトの地[ち]を出[で]てから二年目[にねんめ]の第一[だいいち]の月[つき]に、モーセに語[かた]って言[い]われた。"
  2: "「イスラエルの子[こ]らに命[めい]じて、過越[すぎこし]をその定[さだ]めの時[とき]に行[おこな]わせなさい。"
  3: "第一[だいいち]の月[つき]の十四日[じゅうよっか]の夕[ゆう]べに、あなたはそれを定[さだ]めの時[とき]に行[おこな]いなさい。その法[のり]とその掟[おきて]に従[したが]って、それを行いなさい。」"
  4: "モーセはイスラエルの子[こ]らに、過越[すぎこし]を行[おこな]うように告[つ]げた。"
  5: "彼[かれ]らは第一[だいいち]の月[つき]の十四日[じゅうよっか]の夕[ゆう]べ、シナイの荒野[こうや]で過越[すぎこし]を行[おこな]った。主[しゅ]がモーセに命[めい]じられたとおりに、イスラエルの子[こ]らは行った。"
  6: "ところが、人[ひと]の死[し]体[たい]によって汚[けが]れた者[もの]たちが来[き]て、その日[ひ]に過越[すぎこし]を行[おこな]うことができず、その日、モーセとアロンの前[まえ]に進[すす]み出[で]た。"
  7: "あの人[ひと]たちはモーセに言[い]った。「わたしたちは人[ひと]の死[し]体[たい]で汚[けが]れています。それなのに、イスラエルの子[こ]らの間[あいだ]で定[さだ]めの時[とき]に主[しゅ]に捧[ささ]げ物[もの]を献[ささ]げることを、わたしたちは失[うしな]うのでしょうか。」"
  8: "モーセは彼[かれ]らに言[い]った。「そこに立[た]って待[ま]ちなさい。主[しゅ]があなたがたについて何[なに]を命[めい]じられるかを、聞[き]こう。」"
  9: "主[しゅ]はモーセに語[かた]って言[い]われた。"
  10: "「イスラエルの子[こ]らに語[かた]って言[い]いなさい。あなたがたのうち、またあなたがたの後[のち]の世代[せだい]のうちで、人[ひと]の死[し]体[たい]によって汚[けが]れた者[もの]、あるいはあなたがたから遠[とお]く離[はな]れた旅[たび]の途上[とじょう]にある者[もの]が、主[しゅ]の過越[すぎこし]を行[おこな]うときは、"
  11: "彼[かれ]らはそれを第二[だいに]の月[つき]の十四日[じゅうよっか]の夕[ゆう]べに行[おこな]う。種[たね]なしパンと苦[にが]い野菜[やさい]とともに、それを食[た]べる。"
  12: "そのうちの何[なに]も朝[あさ]まで残[のこ]してはならない。その骨[ほね]を一本[いっぽん]も砕[くだ]いてはならない。過越[すぎこし]の法[のり]のとおりに、それを行[おこな]いなさい。"
  13: "しかし、清[きよ]い者[もの]で、遠[とお]い旅[たび]の途上[とじょう]にもないのに過越[すぎこし]を行[おこな]わない者[もの]がいれば、その人[ひと]は民[たみ]から断[た]たれる。定[さだ]めの時[とき]に主[しゅ]への捧[ささ]げ物[もの]を献[ささ]げなかったからである。その人は自分[じぶん]の罪[つみ]を負[お]う。"
  14: "もし、あなたがたの地[ち]に寄留[きりゅう]する者[もの]がいて、主[しゅ]の過越[すぎこし]を行[おこな]うなら、その人[ひと]は過越の法[のり]とその掟[おきて]に従[したが]ってそれを行う。法は、あなたがたにも、寄留する者にも、この地[ち]に生[う]まれた者[もの]にも、同[おな]じ一[ひと]つである。」"
  15: "幕屋[まくや]が建[た]てられた日[ひ]、雲[くも]はその幕屋、すなわち証[あかし]の家[いえ]をおおった。夕[ゆう]べになると、朝[あさ]まで幕屋の上[うえ]に火[ひ]のようなものがあらわれた。"
  16: "いつもそうであった。雲[くも]は昼[ひる]はそれをおおい、夜[よる]は火[ひ]のようなものがあった。"
  17: "雲[くも]が幕屋[まくや]から上[あ]がるたびに、イスラエルの子[こ]らはその後[あと]から旅[たび]立[だ]った。雲がとどまった所[ところ]に、イスラエルの子[こ]らは宿営[しゅくえい]した。"
  18: "イスラエルの子[こ]らは主[しゅ]の命[めい]によって宿営[しゅくえい]し、主の命によって旅[たび]立[だ]った。雲[くも]が幕屋[まくや]の上[うえ]にとどまっている間[あいだ]は、イスラエルの子[こ]らはいつも宿営していた。"
  19: "雲[くも]が幾日[いくにち]も幕屋[まくや]の上[うえ]に長[なが]くとどまるとき、イスラエルの子[こ]らは主[しゅ]の務[つと]めを守[まも]って、旅[たび]立[だ]たなかった。"
  20: "雲[くも]が幕屋[まくや]の上[うえ]に数日[すうじつ]だけおおうこともあった。そのときも、彼[かれ]らは主[しゅ]の声[こえ]によって宿営[しゅくえい]し、主の命[めい]によって旅[たび]立[だ]った。"
  21: "雲[くも]が夕[ゆう]べから朝[あさ]までとどまり、朝に上[あ]がることもあった。そのときは、昼[ひる]でも夜[よる]でも、彼[かれ]らは旅[たび]立[だ]った。"
  22: "雲[くも]が幾月[いくつき]も幕屋[まくや]の上[うえ]をおおって長[なが]くとどまることもあった。その間[あいだ]、イスラエルの子[こ]らは宿営[しゅくえい]していて、旅[たび]立[だ]たなかった。"
  23: "彼[かれ]らは主[しゅ]の命[めい]によって旅[たび]立[だ]ち、主の命によって宿営[しゅくえい]した。こうして彼[かれ]らは主の務[つと]めを守[まも]り、モーセの手[て]による主の命に従[したが]った。"

notes:
  1: "ἐλάλησεν κύριος πρὸς Μωυσῆν — 主はモーセに語って言われた (λέγων отдельно не переводится, речь — ст. 2). ἐν τῇ ἐρήμῳ Σινα — シナイの荒野 (ἔρημος — «пустыня»). ἐν τῷ ἔτει τῷ δευτέρῳ ἐξελθόντων αὐτῶν ἐκ γῆς Αἰγύπτου — во второй год по выходе их из земли Египетской (род. самостоятельный). ἐν τῷ μηνὶ τῷ πρώτῳ — в первый месяц."
  2: "Εἰπὸν καὶ ποιείτωσαν — скажи, и пусть совершат (εἰπόν, императив от λέγω; ποιείτωσαν — 3-е л. мн. ч. повелительного). τὸ πασχα — 過越. καθ᾿ ὥραν αὐτοῦ — в своё (установленное) время."
  3: "τῇ τεσσαρεσκαιδεκάτῃ ἡμέρᾳ τοῦ μηνὸς τοῦ πρώτου — в четырнадцатый день первого месяца. πρὸς ἑσπέραν — к вечеру. κατὰ καιρούς — в назначенные сроки. κατὰ τὸν νόμον αὐτοῦ καὶ κατὰ τὴν σύγκρισιν αὐτοῦ — по закону его и по уставу его (σύγκρισις — «устроение, порядок»; слав. «устав»); здесь родительный «его» относится к Пасхе, поэтому その法・その掟. ποιήσεις — 2-е л. ед. ч. («ты совершишь»), хотя в ст. 2 было ποιείτωσαν (3-е л. мн.); обращение к Моисею сохранено."
  4: "ἐλάλησεν Μωϋσῆς τοῖς υἱοῖς Ισραηλ ποιῆσαι τὸ πασχα — сказал сынам Израилевым, чтобы совершили Пасху (инфинитив цели при глаголе речи)."
  5: "ἐναρχομένου τῇ τεσσαρεσκαιδεκάτῃ ἡμέρᾳ — когда начинался четырнадцатый день, т. е. с вечера (ἐνάρχομαι — «начинаться»; слав. «начинающуся»). καθὰ συνέταξεν κύριος τῷ Μωυσῇ — как повелел Господь Моисею (συντάσσω). οὕτως ἐποίησαν — так и сделали."
  6: "παρεγένοντο — пришли, явились (παραγίνομαι). ἀκάθαρτοι ἐπὶ ψυχῇ ἀνθρώπου — нечистые из-за души (т. е. тела) человека, осквернённые мёртвым (ψυχή у LXX часто «труп»; слав. «о души человечи»). οὐκ ἠδύναντο ποιῆσαι τὸ πασχα — не могли совершить Пасху. προσῆλθον ἐναντίον Μωυσῆ καὶ Ααρων — приступили пред Моисея и Аарона."
  7: "Ἡμεῖς ἀκάθαρτοι ἐπὶ ψυχῇ ἀνθρώπου — мы нечисты из-за мёртвого. μὴ οὖν ὑστερήσωμεν — неужели мы лишимся (ὑστερέω — «недоставать, быть лишённым»; μή перед вопросом ожидает отрицательного ответа). προσενέγκαι τὸ δῶρον κυρίῳ — принести дар Господу. κατὰ καιρὸν αὐτοῦ — в его время. ἐν μέσῳ υἱῶν Ισραηλ — среди сынов Израилевых."
  8: "Στῆτε αὐτοῦ — постойте здесь (ἵστημι + αὐτοῦ «тут»). ἀκούσομαι τί ἐντελεῖται κύριος — я услышу, что повелит Господь (ἐντέλλομαι — «заповедать»)."
  9: "ἐλάλησεν κύριος πρὸς Μωυσῆν λέγων — обычное введение речи (λέγων не переводится отдельно)."
  10: "Ἄνθρωπος ἄνθρωπος — человек человек (еврейский усилительный повтор, по-русски «если кто»). ἐπὶ ψυχῇ ἀνθρώπου — из-за мёртвого тела. ἢ ἐν ὁδῷ μακρὰν ὑμῖν — или в пути, далёком от вас (μακράν — наречие «далеко»). ἢ ἐν ταῖς γενεαῖς ὑμῶν — или в поколениях ваших. Слав. прибавляет здесь «или в вас» (ἢ ἐν ὑμῖν), в gr-lxx-byz этого нет. ποιήσει τὸ πασχα κυρίῳ — совершит Пасху Господу."
  11: "ἐν τῷ μηνὶ τῷ δευτέρῳ — во втором месяце. τὸ πρὸς ἑσπέραν — к вечеру. ἐπ᾿ ἀζύμων καὶ πικρίδων — с опресноками и горькими травами (πικρίς — «горькая зелень»). φάγονται αὐτό — будут есть её."
  12: "οὐ καταλείψουσιν ἀπ᾿ αὐτοῦ εἰς τὸ πρωΐ — не оставят от неё до утра. ὀστοῦν οὐ συντρίψουσιν — кости не сокрушат (συντρίβω — «сокрушать»). κατὰ τὸν νόμον τοῦ πασχα — по закону Пасхи."
  13: "ὃς ἐὰν καθαρὸς ᾖ καὶ ἐν ὁδῷ μακρᾷ οὐκ ἔστιν — кто чист и не в дальнем пути (условие отсутствия уважительной причины). ὑστερήσῃ ποιῆσαι — не совершит (ὑστερέω — «недостать, пропустить»). ἐξολεθρευθήσεται ἡ ψυχὴ ἐκεῖνη ἐκ τοῦ λαοῦ αὐτῆς — истребится душа та из народа своего (ἐξολεθρεύω; слав. «потребится»). ἁμαρτίαν αὐτοῦ λήμψεται — грех свой понесёт (λαμβάνω «принять на себя»)."
  14: "προσήλυτος — пришелец, поселенец (寄留する者). κατὰ τὸν νόμον τοῦ πασχα καὶ κατὰ τὴν σύνταξιν αὐτοῦ — по закону Пасхи и по чину её (σύνταξις — «устроение»). νόμος εἷς ἔσται ὑμῖν — один закон будет вам. τῷ προσηλύτῳ καὶ τῷ αὐτόχθονι τῆς γῆς — пришельцу и туземцу земли (αὐτόχθων — «рождённый на этой земле»)."
  15: "ᾗ ἐστάθη ἡ σκηνή — в день, когда была поставлена скиния (ἵστημι в страд. зал.). ἐκάλυψεν ἡ νεφέλη τὴν σκηνήν, τὸν οἶκον τοῦ μαρτυρίου — облако покрыло скинию, дом свидетельства (οἶκος τοῦ μαρτυρίου — то же, что скиния; чтобы не повторять 幕屋 трижды, передано 証の家). τὸ ἑσπέρας ἦν ἐπὶ τῆς σκηνῆς ὡς εἶδος πυρός — с вечера над скинией было как бы вид огня (εἶδος — «образ, вид»)."
  16: "οὕτως ἐγίνετο διὰ παντός — так было всегда (imperfect ἐγίνετο — «бывало»). ἡ νεφέλη ἐκάλυπτεν αὐτὴν ἡμέρας — облако покрывало её днём. εἶδος πυρὸς τὴν νύκτα — вид огня ночью (винительный времени)."
  17: "ἡνίκα ἀνέβη ἡ νεφέλη ἀπὸ τῆς σκηνῆς — когда поднималось облако от скинии (ἀναβαίνω). μετὰ ταῦτα ἀπῆραν — после этого отправлялись (ἀπαίρω — «сниматься со стоянки»). οὗ ἂν ἔστη ἡ νεφέλη — где бы ни встало облако. παρενέβαλον — становились станом (παρεμβάλλω)."
  18: "διὰ προστάγματος κυρίου — по повелению Господню (πρόσταγμα — «приказ»). παρεμβαλοῦσιν … ἀπαροῦσιν — становятся … отправляются (praesens historicum в правиле). ἐν αἷς σκιάζει ἡ νεφέλη ἐπὶ τῆς σκηνῆς — в те дни, когда облако осеняет скинию (σκιάζω — «осенять тенью»)."
  19: "ὅταν ἐφέλκηται ἡ νεφέλη … ἡμέρας πλείους — когда облако задерживается на многие дни (ἐφέλκω — «затягивать, задерживать»). φυλάξονται τὴν φυλακὴν τοῦ θεοῦ — будут соблюдать стражу (служение) Божию (φυλακή — «стража, соблюдение»; не «указание», как в Синодальном). οὐ μὴ ἐξάρωσιν — отнюдь не отправятся (οὐ μή + конъюнктив — сильное отрицание)."
  20: "σκεπάσῃ ἡ νεφέλη ἡμέρας ἀριθμῷ — облако покрывает на несколько дней (ἀριθμῷ — «по числу», т. е. считанные дни). διὰ φωνῆς κυρίου — по голосу Господню (φωνή; здесь, в отличие от πρόσταγμα, — «голос»)."
  21: "Место тёмное у LXX: ὅταν γένηται ἡ νεφέλη ἀφ᾿ ἑσπέρας ἕως πρωΐ καὶ ἀναβῇ … ἀπαροῦσιν ἡμέρας ἢ νυκτός — «когда облако будет от вечера до утра и поднимется утром, отправятся; днём или ночью». Смысл: поднятие облака в любое время суток есть знак пути; так и передано."
  22: "μηνὸς ἡμέρας πλεοναζούσης τῆς νεφέλης — когда облако умножается на месяц дней (πλεονάζω — «умножаться, длиться лишнее»; род. самостоятельный). σκιαζούσης ἐπ᾿ αὐτῆς — осеняя над нею. οὐ μὴ ἀπάρωσιν — отнюдь не отправятся. Слав. и Синодальный прибавляют здесь клаузы о поднятии облака по масоретскому тексту — в gr-lxx-byz их нет."
  23: "ὅτι διὰ προστάγματος κυρίου ἀπαροῦσιν — ибо по повелению Господню отправляются. τὴν φυλακὴν κυρίου ἐφυλάξαντο — стражу Господню соблюдали (винительный внутреннего объекта). ἐν χειρὶ Μωυσῆ — рукою Моисея (т. е. через Моисея)."
