# jp-box, Числа, глава 9. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в этой главе нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Фуригана — при первом появлении слова в стихе.
# Глава 9: вторая Пасха в пустыне Синай (1–5), вопрос осквернённых мёртвым (6–8),
# закон о второй Пасхе и о пришельце (9–14), облако над скинией и порядок станов (15–23).
# Кавычки: речь Бога — 「…」 (2–3, 10–14); речь осквернённых — 「…」 (7);
# речь Моисея — 「…」 (8). Красного нет.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (проверено по базе).
# Сносок ⟨…⟩ нет: 過越, 種なしパン, 幕屋, 祭司, 証の幕屋 уже пояснены в корпусе.
# LXX/слав. отличия (в notes): 9:5 ἐναρχομένου — «когда начинался четырнадцатый день»,
# т. е. вечером; 9:10 слав. прибавляет «или в вас», чего в LXX нет; 9:19.23 φυλακή —
# «стража/соблюдение», а не «указание»; 9:21 у LXX тёмное место о ночном облаке;
# 9:22 слав. и Синодальный прибавляют клаузы по масоретскому тексту («если поднимется
# облако — пойдут», «при отступлении его поднимались»), в LXX их нет.
