# jp-box, Руфь, глава 4. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 4: выкуп у ворот (1–6), обычай снятия обуви (7–8), свидетели и
# благословение (9–12), брак и рождение Овида (13–17), родословие от Фареса
# до Давида (18–22).
# Речи — 「…」: Боаз (1, 3–5, 9–10), родственник (4, 6, 8), старейшины и
# народ (11–12), женщины (14–15), соседки (17); слова, которые Боаз собирался
# сказать, — 『…』 (4).
# Красного нет.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (проверено по базе).
# Сносок ⟨…⟩ нет: 嗣業, 履き物, 証 уже в корпусе; новых терминов нет.
# jp-ni не использовался.

tr_code: jp-box
book: ruf
chapter: 4
draft: true

verses:
  1: "ボアズは町[まち]の門[もん]へ上[のぼ]って行[い]き、そこに座[すわ]った。見[み]ると、ボアズが話[はな]していた買[か]い戻[もど]し人[びと]が通[とお]りかかった。ボアズは彼[かれ]に言った。「あなた、こちらへ寄[よ]って、ここに座りなさい。」彼は寄って来て座った。"
  2: "ボアズは町[まち]の長老[ちょうろう]たちの中[なか]から十人[じゅうにん]の男[おとこ]を連[つ]れて来[き]て、言[い]った。「ここに座りなさい。」彼らは座った。"
  3: "ボアズは買[か]い戻[もど]し人[びと]に言[い]った。「わたしたちの兄弟[きょうだい]エリメレクの野[の]の区画[くかく]は、モアブの野[の]から帰[かえ]って来[き]たナオミに与[あた]えられている。"
  4: "わたしは、あなたの耳[みみ]に打[う]ち明[あ]けようと思[おも]って言[い]った。『座[すわ]っている者[もの]たちと、わたしの民[たみ]の長老[ちょうろう]たちの前[まえ]で、それを買[か]い取[と]りなさい。もし買い戻すなら、買い戻しなさい。もし買い戻さないなら、わたしに告[つ]げなさい。そうすれば分かる。あなたのほかに買い戻す者はいない。あなたの次[つぎ]はわたしだ。』」彼[かれ]は言った。「わたしが買い戻そう。」"
  5: "ボアズは言[い]った。「あなたがナオミの手[て]からその野[の]を買[か]い取[と]る日[ひ]には、死[し]んだ者[もの]の妻[つま]であるモアブの女[おんな]ルツも買い取り、死んだ者の名[な]をその嗣業[しぎょう]の上[うえ]に起[お]こさなければならない。」"
  6: "買[か]い戻[もど]し人[びと]は言[い]った。「わたしは自分のために買い戻すことはできない。わたしの嗣業[しぎょう]を損[そこ]なうことになるかもしれないからだ。あなたが、わたしの買い戻しの権利[けんり]を自分のために買い戻しなさい。わたしには買い戻せないのだ。」"
  7: "昔[むかし]、イスラエルでは、買い戻しや交換[こうかん]のとき、すべてのことを確[かく]実[じつ]にするために、このような慣[なら]わしがあった。すなわち、人[ひと]は自分[じぶん]の履[は]き物[もの]を脱[ぬ]いで、買い戻しの権利を譲[ゆず]る隣人[りんじん]にそれを渡[わた]した。これがイスラエルでの証[あかし]であった。"
  8: "買[か]い戻[もど]し人[びと]はボアズに言[い]った。「わたしの買い戻しの権利[けんり]を、あなたが自分のために買[か]い取りなさい。」そして、自分の履[は]き物[もの]を脱[ぬ]いで、彼に渡[わた]した。"
  9: "ボアズは長老[ちょうろう]たちとすべての民[たみ]に言[い]った。「あなたがたは今日[きょう]、証人[しょうにん]である。わたしは、エリメレクのものすべてと、キルヨンとマフロンに属[ぞく]するものすべてを、ナオミの手[て]から買[か]い取[と]った。"
  10: "また、マフロンの妻[つま]であったモアブの女[おんな]ルツも、死[し]んだ者の名[な]をその嗣業[しぎょう]の上[うえ]に起[お]こすために、わたしの妻として迎[むか]えた。死んだ者の名は、その兄弟[きょうだい]たちの間[あいだ]からも、その民[たみ]の部族[ぶぞく]からも、消[き]え去[さ]ることはない。あなたがたは今日[きょう]、その証人[しょうにん]である。」"
  11: "門[もん]にいたすべての民[たみ]と長老[ちょうろう]たちは言[い]った。「わたしたちは証人[しょうにん]だ。あなたの家[いえ]に入[はい]るあなたの妻[つま]を、主[しゅ]がラケルとレアのようにしてくださるように。この二人[ふたり]はイスラエルの家[いえ]を建[た]て、エフラタで力[ちから]ある者[もの]となった。あなたの名[な]がベツレヘムで高[たか]く挙[あ]げられるように。"
  12: "あなたの家[いえ]が、タマルがユダに産[う]んだファレスの家[いえ]のようになるように。主[しゅ]が、この若[わか]い女[おんな]によってあなたに与[あた]えられる子孫[しそん]によって。」"
  13: "ボアズはルツを迎[むか]えて妻[つま]とし、彼女[かのじょ]のところへ入[はい]った。主[しゅ]は彼女に身[み]ごもりを与[あた]え、彼女は男[おとこ]の子[こ]を産[う]んだ。"
  14: "女[おんな]たちはナオミに言[い]った。「主[しゅ]がほめたたえられるように。主は今日[きょう]、あなたから買[か]い戻[もど]し人[びと]を取[と]り去[さ]らなかった。あなたの名[な]がイスラエルで呼[よ]ばれるように。"
  15: "彼はあなたの魂[たましい]を生[い]き返[かえ]らせ、あなたの白髪[しらが]を養[やしな]う者[もの]となるだろう。あなたを愛[あい]するあなたの嫁[よめ]が彼を産[う]んだからだ。その嫁は、あなたにとって七人[しちにん]の息子[むすこ]にもまさる者[もの]だ。」"
  16: "ナオミはその子[こ]を取[と]り、自分[じぶん]の胸[むね]に抱[だ]き、その子の乳母[うば]となった。"
  17: "近所[きんじょ]の女[おんな]たちは、その子に名[な]をつけて言[い]った。「ナオミに男[おとこ]の子[こ]が生[う]まれた。」そして、その名をオベドと名[な]づけた。オベドは、ダビデの父[ちち]であるエッサイの父である。"
  18: "ファレスの系図[けいず]はこうである。ファレスはエスロムを生[う]み、"
  19: "エスロムはアラムを生[う]み、アラムはアミナダブを生み、"
  20: "アミナダブはナアソンを生[う]み、ナアソンはサルモンを生み、"
  21: "サルモンはボアズを生[う]み、ボアズはオベデを生み、"
  22: "オベデはエッサイを生[う]み、エッサイはダビデを生[う]んだ。"

notes:
  1: "ἀνέβη ἐπὶ τὴν πύλην — поднялся к воротам (городские ворота — место суда). ἀγχιστευτής — выкупающий (синоним ἀγχιστεύς). Ἐκκλίνας — свернув в сторону. κρύφιε — «тайный, скрытый», обращение к неназванному родственнику; передано как あなた (в csl опущено)."
  2: "ἀπὸ τῶν πρεσβυτέρων — из старейшин. Десять человек — обычное число свидетелей сделки."
  3: "μερίς — участок. ἣ δέδοται Νωεμιν — «которая дана Ноемини» (в ru «продает» — толкование, а не чтение)."
  4: "Ἀποκαλύψω τὸ οὖς σου — «открою ухо твоё», т. е. скажу наедине. κτῆσαι — купи. ἀγχίστευε — выкупай. πάρεξ σοῦ — кроме тебя. Вложенная речь 『…』 — слова, которые Боаз собирался сказать."
  5: "ἐν ἡμέρᾳ τοῦ κτήσασθαί σε — в день покупки. γυναικὸς τοῦ τεθνηκότος — жены умершего. καὶ αὐτὴν κτήσασθαί σε δεῖ — и её саму должно приобрести, т. е. взять в жёны. ἀναστῆσαι τὸ ὄνομα — восстановить имя (т. е. род) умершего. κληρονομία — 嗣業."
  6: "Οὐ δυνήσομαι ἀγχιστεῦσαι ἐμαυτῷ — не смогу выкупить себе. μήποτε διαφθείρω τὴν κληρονομίαν — как бы не погубить свой удел (διαφθείρω). ἀγχιστεία — право выкупа."
  7: "δικαίωμα — установление, обычай. ἀντάλλαγμα — обмен. ὑπελύετο τὸ ὑπόδημα — снимал обувь (ὑπολύω). μαρτύριον — свидетельство (証)."
  8: "ὑπελύσατο … καὶ ἔδωκεν αὐτῷ — снял обувь и дал ему (в ru «снял сапог свой» без «дал»; в греческом и csl — дал)."
  9: "Μάρτυρες ὑμεῖς — «вы свидетели». κέκτημαι — приобрёл (κτάομαι, perfect). Χελαιων καὶ Μααλων — Хилеон и Махлон (キルヨン, マフロン)."
  10: "ἐξολεθρευθήσεται — не истребится (ἐξολεθρεύω). ἀπὸ τῶν ἀδελφῶν … καὶ ἐκ τῆς φυλῆς — от братьев и от племени."
  11: "Δῴη κύριος — да даст Господь. Ραχηλ καὶ Λειαν — Рахиль и Лия (ラケル, レア). ᾠκοδόμησαν τὸν οἶκον Ισραηλ — устроили дом Израилев. ἐποίησαν δύναμιν ἐν Εφραθα — «сотворили силу в Ефрафе», т. е. стали сильными, прославились; ср. ru «приобретай богатство» (толкование)."
  12: "Φαρες — Фарес, сын Иуды от Фамари (Быт 38). ἐκ τοῦ σπέρματος, οὗ δώσει κύριός σοι — от семени, которое даст тебе Господь. παιδίσκη — служанка, здесь о Руфи."
  13: "ἐγενήθη αὐτῷ εἰς γυναῖκα — стала ему женой. ἔδωκεν αὐτῇ κύησιν — дал ей зачатие (κύησις)."
  14: "οὐ κατέλυσέ σοι τὸν ἀγχιστέα — не лишил тебя выкупающего (καταλύω — разрушать, отменять); ru «не оставил без наследника» — толкование. καλέσαι τὸ ὄνομά σου — да назовётся имя твоё."
  15: "ἐπιστρέφων ψυχήν — возвращающий душу, т. е. отрада, восстановитель жизни. διαθρέψαι τὴν πολιάν — пропитать седину (πολιά). ἑπτὰ υἱούς — семь сыновей (полнота)."
  16: "εἰς τὸν κόλπον αὐτῆς — на лоно своё (κόλπος). τιθηνός — кормилица, нянька."
  17: "Ἐτέχθη υἱὸς τῇ Νωεμιν — «родился сын у Ноемини» (ἐτέχθη, aor. pass.). Ωβηδ — Овид (オベド); πατὴρ Ιεσσαι — отец Иессея (エッサイ)."
  18: "γενέσεις Φαρες — «родословие Фареса» (γένεσις). Далее формула «родил», по LXX."
  19: "Αρραν — Арран (LXX), в csl и ru Арам; по-японски アラム, как в родословиях Мф 1 и Лк 3."
  20: "Σαλμαν — Салман (LXX), в родословиях Мф 1 — Салмон; по-японски サルモン (ср. csl «салмон»)."
  21: "Σαλμαν ἐγέννησεν τὸν Βοος — Салман родил Вооза. Родословие доводит линию до Давида."
  22: "Ωβηδ — Овид, Ιεσσαι — Иессей, Δαυιδ — Давид (ダビデ). Конец книги."
