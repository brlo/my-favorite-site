verses:
  0: "指揮者[しきしゃ]のために。朝[あさ]の助[たす]けのために。ダビデの詩[うた]。"
  1: "わたしの神[かみ]、わたしの神[かみ]よ、わたしに目[め]を留[と]めてください。なぜ、わたしをお見捨[みす]てになったのか。わたしの救[すく]いから遠[とお]く離[はな]れているのは、わたしの咎[とが]の言葉[ことば]である。"
  2: "わたしの神[かみ]よ、わたしは昼[ひる]に叫[さけ]んでも、あなたは答[こた]えず、夜[よる]も叫[さけ]ぶが、それはわたしの愚[おろ]かさではない。"
  3: "しかし、あなたは聖[せい]なる者[もの]たちのうちに住[す]まわれる方[かた]、イスラエルの賛美[さんび]である。"
  4: "わたしたちの父祖[ふそ]たちはあなたに寄[よ]り頼[たの]み、寄[よ]り頼[たの]んだので、あなたは彼[かれ]らを救[すく]い出[だ]された。"
  5: "彼[かれ]らはあなたに叫[さけ]んで救[すく]われ、あなたに寄[よ]り頼[たの]んで恥[はじ]をかかなかった。"
  6: "しかし、わたしは虫[むし]であって、人[ひと]ではない。人[ひと]のそしり、民[たみ]の蔑[さげす]みである。"
  7: "わたしを見[み]る者[もの]はみな、わたしを嘲[あざけ]り、唇[くちびる]を動[うご]かして頭[あたま]を振[ふ]る。"
  8: "「彼[かれ]は主[しゅ]に寄[よ]り頼[たの]んだ。ならば、主[しゅ]が彼[かれ]を救[すく]い出[だ]すがよい。彼[かれ]を喜[よろこ]ばれるなら、救[すく]ってくださるがよい」と。"
  9: "あなたはわたしを母[はは]の胎[はら]から引[ひ]き出[だ]し、母[はは]の乳房[ちぶさ]から、あなたはわたしの望[のぞ]みであったからである。"
  10: "わたしは生[う]まれる前[まえ]からあなたに委[ゆだ]ねられ、母[はは]の胎[はら]からあなたはわたしの神[かみ]である。"
  11: "わたしから離[はな]れないでください。苦[くる]しみが近[ちか]く、助[たす]ける者[もの]がいないからである。"
  12: "多[おお]くの若[わか]い雄牛[おうし]がわたしを取[と]り囲[かこ]み、肥[こ]えた雄牛[おうし]たちがわたしを囲[かこ]んだ。"
  13: "彼[かれ]らは、獲物[えもの]を奪[うば]って吼[ほ]える獅子[しし]のように、わたしに向[む]かって口[くち]を開[ひら]いた。"
  14: "わたしは水[みず]のように注[そそ]ぎ出[だ]され、骨[ほね]はすべて散[ち]らばった。わたしの心[こころ]は、腹[はら]の中[なか]で溶[と]ける蝋[ろう]のようになった。"
  15: "わたしの力[ちから]は陶器[とうき]の破片[はへん]のように乾[かわ]き、舌[した]は喉[のど]に貼[は]り付[つ]いた。あなたはわたしを死[し]の塵[ちり]に下[くだ]された。"
  16: "犬[いぬ]の群[む]れがわたしを囲[かこ]み、悪[わる]い者[もの]の集[つど]いがわたしを取り巻[ま]いた。彼[かれ]らはわたしの手[て]と足[あし]を刺[さ]し貫[つらぬ]いた。"
  17: "わたしは自分[じぶん]の骨[ほね]をすべて数[かぞ]えることができる。彼[かれ]らはわたしをじっと見[み]つめ、眺[なが]めている。"
  18: "彼[かれ]らはわたしの衣[ころも]を分[わ]け合[あ]い、わたしの衣服[いふく]の上[うえ]でくじを引[ひ]いた。"
  19: "しかし、主[しゅ]よ、あなたの助[たす]けを遠[とお]ざけないでください。わたしを助[たす]けるために目[め]を留[と]めてください。"
  20: "わたしの魂[たましい]を剣[つるぎ]から、わたしのただ一[ひと]つの命[いのち]を犬[いぬ]の手[て]から救[すく]い出[だ]してください。"
  21: "わたしを獅子[しし]の口[くち]から、わたしの貧[まず]しさを野牛[やぎゅう]の角[つの]から救[すく]ってください。"
  22: "わたしはあなたの名[な]を、わたしの兄弟[きょうだい]たちに告[つ]げ、集[つど]いの中[なか]であなたをほめ歌[うた]う。"
  23: "主[しゅ]を恐[おそ]れる者[もの]たちよ、主[しゅ]を賛美[さんび]せよ。ヤコブのすべての子孫[しそん]よ、主[しゅ]に栄光[えいこう]を帰[き]せよ。イスラエルのすべての子孫[しそん]よ、主[しゅ]を恐[おそ]れよ。"
  24: "主[しゅ]は貧[まず]しい者[もの]の願[ねが]いを蔑[さげす]まず、忌[いと]わず、その顔[かお]をわたしから背[そむ]けず、わたしが主[しゅ]に叫[さけ]んだとき、わたしの声[こえ]を聞[き]かれたからである。"
  25: "大[おお]きな集[つど]いの中[なか]で、わたしの賛美[さんび]はあなたから出[で]る。わたしは主[しゅ]を恐[おそ]れる者[もの]たちの前[まえ]で、自分の誓[ちか]いを果[は]たす。"
  26: "貧[まず]しい者[もの]たちは食[た]べて満[み]ち足[た]り、主[しゅ]を求[もと]める者[もの]たちは主[しゅ]を賛美[さんび]する。彼[かれ]らの心[こころ]は、とこしえに生[い]きる。"
  27: "地[ち]の果[は]てはすべて、思[おも]い起[おこ]して主[しゅ]に立[た]ち返[かえ]り、諸国民[しょこくみん]のすべての氏族[しぞく]は、あなたの前[まえ]にひれ伏[ふ]す。"
  28: "王国[おうこく]は主[しゅ]のものであり、主[しゅ]は諸国民[しょこくみん]を治[おさ]められるからである。"
  29: "地[ち]の肥[こ]えた者[もの]たちはみな、食[た]べて拝[おが]み、土[つち]に下[くだ]る者[もの]はすべて、主[しゅ]の前[まえ]にひれ伏[ふ]す。わたしの魂[たましい]は主[しゅ]によって生[い]きる。"
  30: "わたしの子孫[しそん]は主[しゅ]に仕[つか]え、来[きた]るべき世代[せだい]は主[しゅ]に告[つ]げられる。"
  31: "彼[かれ]らは、生[う]まれてくる民[たみ]に主[しゅ]の義[ぎ]を告[つ]げる。主[しゅ]がこれをなされたからである。"

notes:
  0: "Εἰς τὸ τέλος, ὑπὲρ τῆς ἀντιλήμψεως τῆς ἑωθινῆς — 指揮者のために、朝の助けのために. ἀντίλημψις — заступление; ἑωθινός — утренний (jp-joc 曉の時). Надписание — стих 0."
  1: "πρόσχες μοι — 目を留めてください. ἵνα τί ἐγκατέλιπές με — なぜ見捨てたのか. μακρὰν ἀπὸ τῆς σωτηρίας μου οἱ λόγοι τῶν παραπτωμάτων μου — 救いから遠いのは咎の言葉; трудное место (евр. «слова вопля моего», LXX «слова прегрешений»), передано по LXX."
  2: "κεκράξομαι — 叫ぶ. οὐκ εἰσακούσῃ — 答えず. οὐκ εἰς ἄνοιαν ἐμοί — これはわたしの愚かさではない (тёмное место; слав. «не в безумие мне»)."
  3: "ἐν ἁγίοις κατοικεῖς — 聖なる者たちのうちに住む. ὁ ἔπαινος Ισραηλ — イスラエルの賛美."
  4: "ἤλπισαν — 寄り頼んだ (повтор в греч. сохранён). ἐρρύσω — 救い出された."
  5: "ἐκέκραξαν — 叫んで. οὐ κατῃσχύνθησαν — 恥をかかなかった."
  6: "σκώληξ — 虫. ὄνειδος ἀνθρώπου — 人のそしり. ἐξουδένημα λαοῦ — 民の蔑み."
  7: "ἐξεμυκτήρισαν — 嘲り. ἐλάλησαν ἐν χείλεσιν — 唇を動かして. ἐκίνησαν κεφαλήν — 頭を振る."
  8: "Ἤλπισεν ἐπὶ κύριον — 主に寄り頼んだ. ῥυσάσθω — 救い出すがよい. σωσάτω — 救ってくださるがよい. θέλει — 喜ばれる. Слова насмешников — 「」."
  9: "ἐκσπάσας ἐκ γαστρός — 母の胎から引き出し. ἐλπὶς ἀπὸ μαστῶν — 乳房からの望み."
  10: "ἐπερρίφην ἐκ μήτρας — 生まれる前から委ねられ. θεός μου εἶ σύ — あなたはわたしの神."
  11: "μὴ ἀποστῇς — 離れないでください. θλῖψις ἐγγύς — 苦しみが近い. οὐκ ἔστιν ὁ βοηθῶν — 助ける者がいない."
  12: "μόσχοι πολλοί — 多くの若い雄牛. ταῦροι πίονες — 肥えた雄牛."
  13: "ἤνοιξαν τὸ στόμα — 口を開いた. λέων ἁρπάζων καὶ ὠρυόμενος — 獲物を奪って吼える獅子."
  14: "ἐξεχύθην ὡσεὶ ὕδωρ — 水のように注ぎ出され. διεσκορπίσθη τὰ ὀστᾶ — 骨は散らばった. κηρὸς τηκόμενος — 溶ける蝋."
  15: "ὄστρακον — 陶器の破片. γλῶσσα κεκόλληται τῷ λάρυγγι — 舌が喉に貼り付いた. χοῦς θανάτου — 死の塵."
  16: "κύνες — 犬. συναγωγὴ πονηρευομένων — 悪い者の集い. ὤρυξαν χεῖρας καὶ πόδας — 手と足を刺し貫いた."
  17: "ἐξηρίθμησα τὰ ὀστᾶ — 骨を数える. κατενόησαν — じっと見つめ."
  18: "διεμερίσαντο τὰ ἱμάτια — 衣を分け合い. ἔβαλον κλῆρον — くじを引いた."
  19: "μὴ μακρύνῃς — 遠ざけないでください. εἰς ἀντίλημψιν — 助けるために. πρόσχες — 目を留めてください."
  20: "ῥομφαία — 剣. μονογενής — ただ一つの命 (единородная)."
  21: "στόμα λέοντος — 獅子の口. κέρατα μονοκερώτων — 野牛の角 (LXX μονόκερως «единорог»; евр. reʼem — дикий бык). ταπείνωσις — 貧しさ."
  22: "διηγήσομαι τὸ ὄνομά σου — 名を告げ. ἐν μέσῳ ἐκκλησίας — 集いの中で. ὑμνήσω — ほめ歌う."
  23: "οἱ φοβούμενοι κύριον — 主を恐れる者たち. σπέρμα Ιακωβ — ヤコブの子孫. δοξάσατε — 栄光を帰せ. φοβηθήτωσαν — 恐れよ."
  24: "οὐκ ἐξουδένωσεν — 蔑まず. προσώχθισεν — 忌わず. δέησις τοῦ πτωχοῦ — 貧しい者の願い. ἀπέστρεψεν τὸ πρόσωπον — 顔を背けず."
  25: "παρὰ σοῦ ὁ ἔπαινός μου — 賛美はあなたから出る. εὐχάς — 誓い. ἀποδώσω — 果たす."
  26: "φάγονται πένητες — 貧しい者たちは食べて. ἐμπλησθήσονται — 満ち足り. ἐκζητοῦντες — 求める者. ζήσονται αἱ καρδίαι — 心は生きる."
  27: "μνησθήσονται — 思い起して. ἐπιστραφήσονται — 立ち返り. πέρατα τῆς γῆς — 地の果て. πατριαὶ τῶν ἐθνῶν — 諸国民の氏族."
  28: "βασιλεία — 王国. δεσπόζει — 治める."
  29: "οἱ πίονες τῆς γῆς — 地の肥えた者たち. καταβαίνοντες εἰς τὴν γῆν — 土に下る者. ἡ ψυχή μου αὐτῷ ζῇ — 魂は主によって生きる."
  30: "σπέρμα — 子孫. δουλεύσει — 仕える. γενεὰ ἡ ἐρχομένη — 来るべき世代."
  31: "ἀναγγελοῦσιν — 告げる. λαῷ τῷ τεχθησομένῳ — 生まれてくる民に. ὅτι ἐποίησεν ὁ κύριος — 主がこれをなされた."
