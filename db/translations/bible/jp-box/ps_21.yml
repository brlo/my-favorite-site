# молитва о спасении (20–22), обет хвалы и всемирное обращение (23–31).
# Красного и синего нет: это пророческий псалом, а не евангельская речь Христа.
# Кавычки: насмешки врагов в 8 — 「…」 (первый уровень).
# 〔…〕 нет: все слова в gr-lxx-byz есть.
# セラ (διάψαλμα) в этом псалме нет.
# Сносок ⟨…⟩ нет: 野牛, 陰府, 集い понятны или уже в корпусе.
