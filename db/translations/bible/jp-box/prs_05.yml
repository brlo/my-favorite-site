# jp-box, Премудрость Соломона, глава 5. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для главы есть фрагментами (5:1–7, 15–24) —
# служил контролем чтения, архаизмы не копировались; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 5: праведник на суде (1–3), раскаяние нечестивых в Шеоле — их прямая речь
# (4–13), надежда нечестивых как прах (14), награда и венец праведников (15–16),
# оружие Божие против нечестивых и гибель властителей (17–23).
# Кавычки: речь нечестивых — 「…」, открывается в ст. 4 и закрывается в ст. 13;
# вводка к ней («彼らは…言う」) — в ст. 3, как в греч. (καὶ ἐροῦσιν в конце 5:3),
# поэтому 「 стоит в начале ст. 4, а не в конце ст. 3. Остальное — авторский текст.
# Красного и синего нет.
# Нумерация по gr: 23 стиха. Слав. сдвиги: csl 5:3 вбирает начало гр. 5:4
# («сей бе, егоже имехом…»), но csl 5:4 берёт остаток того же греческого стиха,
# так что счёт до 5:22 совпадает; csl 5:24 — стих сверх gr (вторая половина гр. 5:23,
# «и опустошит всю землю беззаконие…»), он влит в наш 5:23, отдельного стиха нет.
# Держимся деления gr.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz. Сносок ⟨…⟩ нет.

