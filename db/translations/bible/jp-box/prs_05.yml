chapter: 5
draft: true

verses:
  1: "そのとき、正[ただ]しい者[もの]は大胆[だいたん]さをもって、自分[じぶん]を苦[くる]しめ、その労苦[ろうく]を蔑[ないがし]ろにした者[もの]たちの前[まえ]に立[た]つ。"
  2: "彼らはこれを見[み]て、ひどい恐[おそ]れに乱[みだ]れ、その救[すく]いの驚[おどろ]くべきことに驚き惑[まど]う。"
  3: "彼らは悔[く]い改[あらた]めて、互[たが]いに語[かた]り、霊[れい]の苦[くる]しみのゆえに嘆[なげ]きながら言[い]う。"
  4: "「あの者は、かつてわたしたちが笑[わら]い者[もの]とし、辱[はずかし]めの諺[ことわざ]とした者ではないか。愚[おろ]かなわたしたちは、その生[い]き方[かた]を狂[くる]いと見[み]なし、その終[お]わりを恥[は]ずべきものとした。"
  5: "どうして彼は神[かみ]の子[こ]らの中[なか]に数[かぞ]えられ、聖[せい]なる者[もの]たちの間[あいだ]にその分[ぶん]があるのか。"
  6: "それで、わたしたちは真理[しんり]の道[みち]から迷[まよ]い出[で]ていた。義[ぎ]の光[ひかり]はわたしたちに輝[かがや]かず、日[ひ]もわたしたちに昇[のぼ]らなかった。"
  7: "わたしたちは不法[ふほう]と滅[ほろ]びの道[みち]に満[み]たされ、通[とお]り抜[ぬ]けられない荒[あ]れ野[の]を歩[あゆ]み、主[しゅ]の道を知[し]らなかった。"
  8: "高慢[こうまん]がわたしたちに何[なに]の益[えき]をもたらしたのか。誇[ほこ]りとともにあった富[とみ]が、わたしたちに何を与[あた]えたのか。"
  9: "それらはすべて、影[かげ]のように、駆[か]け過[す]ぎる知[し]らせのように過[す]ぎ去[さ]った。"
  10: "波[なみ]立[だ]つ水[みず]を渡[わた]る船[ふね]のあと、その過ぎ去ったのちには、足跡[あしあと]を見[み]いだすことも、波[なみ]の間[あいだ]にその進[すす]む筋[すじ]を見いだすこともできない。"
  11: "また、空[そら]を飛[と]び過[す]ぎる鳥[とり]の通[とお]り道[みち]のしるしは、何[なに]ひとつ見[み]いだされない。翼[つばさ]の打[う]ちつける勢[いきお]いに打たれた軽[かる]い空気[くうき]は、羽[はね]の動[うご]きの激[はげ]しい風[かぜ]に裂[さ]かれて通り過ぎる。そののち、そこにその通り道のしるしは見いだされない。"
  12: "また、的[まと]に向[む]けて放[はな]たれた矢[や]のように、裂[さ]かれた空気[くうき]はただちに元[もと]の一[ひと]つに戻[もど]り、その通り道は分[わ]からなくなる。"
  13: "わたしたちも同じである。生[う]まれては消[き]え、徳[とく]のしるしを何[なに]ひとつ示[しめ]すことができず、ただ悪[あく]のうちに尽[つ]き果[は]てた。」"
  14: "不敬虔[ふけいけん]な者[もの]の望[のぞ]みは、風[かぜ]に運[はこ]ばれる塵[ちり]、嵐[あらし]に引[ひ]き裂[さ]かれる柔[やわ]らかな泡[あわ]、風[かぜ]に吹[ふ]き散[ち]らされる煙[けむり]のようであり、一日[いちにち]の客[きゃく]の記憶[きおく]のように過[す]ぎ去[さ]る。"
  15: "しかし、正[ただ]しい者[もの]たちはとこしえに生[い]きる。その報[むく]いは主[しゅ]のうちにあり、彼らへの顧[かえり]みは高[たか]い方[かた]のもとにある。"
  16: "それゆえ、彼らは主[しゅ]の手[て]から、美[うつく]しさの王国[おうこく]と麗[うるわ]しさの冠[かんむり]を受[う]ける。主は右[みぎ]の手[て]で彼らを覆[おお]い、腕[うで]で彼らを守[まも]られるからである。"
  17: "主[しゅ]はその熱意[ねつい]を完全武装[かんぜんぶそう]として取[と]り、被造物[ひぞうぶつ]を敵[てき]への報[むく]いのために武[ぶ]装[そう]させる。"
  18: "主は義[ぎ]を胸当[むねあ]てとして身[み]に着[つ]け、偽[いつわ]りのない裁[さば]きを兜[かぶと]として戴[いただ]く。"
  19: "打[う]ち破[やぶ]ることのできない盾[たて]として、聖[せい]なることを取[と]る。"
  20: "主は激[はげ]しい怒[いか]りを剣[つるぎ]として研[と]ぎ、世[よ]は主とともに狂[くる]った者[もの]たちと戦[たたか]う。"
  21: "稲妻[いなずま]の矢[や]は的[まと]を外[はず]さずに飛[と]び、円[まる]く張[は]った雲[くも]の弓[ゆみ]から放[はな]たれて、的[まと]に当[あ]たる。"
  22: "怒[いか]りの投石機[とうせきき]からは、満[み]ちあふれた雹[ひょう]が投[な]げ込[こ]まれる。海[うみ]の水[みず]は彼らに向かって怒り、川[かわ]は激[はげ]しく彼らを押[お]し流[なが]す。"
  23: "力[ちから]の霊[れい]が彼らに立[た]ち向[む]かい、つむじ風のように彼らを吹[ふ]き払[はら]う。不法[ふほう]は全地[ぜんち]を荒[あ]らし、悪行[あくぎょう]は強[つよ]い者[もの]たちの王座[おうざ]を覆[くつがえ]す。"

notes:
  1: "Τότε στήσεται — そのとき…立つ (ἵστημι — встать, предстать). ἐν παρρησίᾳ πολλῇ — 大胆さをもって (παρρησία — дерзновение, открытость); слав. «во дерзновении мнозе». τῶν ἀθετούντων τοὺς πόνους — その労苦を蔑ろにした者たち (ἀθετέω — отвергать; πόνος — труд, подвиг)."
  2: "ταραχθήσονται φόβῳ δεινῷ — ひどい恐れに乱れる (ταράσσω — смущать; δεινός — страшный). ἐκστήσονται — 驚き惑う (ἐξίστημι — изумляться, выходить из себя). ἐπὶ τῷ παραδόξῳ τῆς σωτηρίας — その救いの驚くべきこと (παράδοξος — неожиданный, дивный); слав. «о преславнем спасении» — 驚くべき, разночтение отмечено."
  3: "ἐροῦσιν ἐν ἑαυτοῖς — 互いに語る (ἐν ἑαυτοῖς — «между собой», «в себе»). μετανοοῦντες — 悔い改めて (μετανοέω); слав. «кающеся». διὰ στενοχωρίαν πνεύματος — 霊の苦しみのゆえに (στενοχωρία — теснота, стеснение). καὶ ἐροῦσιν — «и скажут»: в греч. вводка кончается здесь, а слова речи начинаются в ст. 4, поэтому 「 стоят в начале 5:4 (у csl 5:3 уже включает начало речи — «сей бе»)."
  4: "Οὗτος ἦν, ὃν ἔσχομέν ποτε εἰς γέλωτα — あの者は、かつてわたしたちが笑い者とした者 (γέλως — смех). εἰς παραβολὴν ὀνειδισμοῦ — 辱めの諺 (παραβολή — притча, поговорка). οἱ ἄφρονες — 愚かなわたしたち (ἄφρων — безумный). ἐλογισάμεθα — 見なした (λογίζομαι — считать). Начало прямой речи нечестивых в Шеоле; она идёт до конца 5:13."
  5: "κατελογίσθη — 数えられた (καταλογίζω — причислять); слав. «вменися». ἐν υἱοῖς θεοῦ — 神の子らの中に. ὁ κλῆρος αὐτοῦ — その分 (κλῆρος — жребий, доля); слав. «жребий его»."
  6: "ἐπλανήθημεν ἀπὸ ὁδοῦ ἀληθείας — 真理の道から迷い出ていた (πλανάω — блуждать). ἐπέλαμψεν — 輝かず (ἐπιλάμπω — озарять). ἀνέτειλεν — 昇らなかった (ἀνατέλλω — восходить). Слав. в начале стоит «~бо» (порча вместо «ибо»); в LXX ἄρα — «итак, стало быть»."
  7: "ἀνομίας ἐνεπλήσθημεν τρίβοις — 不法と滅びの道に満たされ (τρίβος — стезя, тропа; ἐμπίπλημι — наполнять). διωδεύσαμεν ἐρήμους ἀβάτους — 通り抜けられない荒れ野を歩み (ἄβατος — непроходимый; διοδεύω — проходить). τὴν ὁδὸν κυρίου οὐκ ἐπέγνωμεν — 主の道を知らなかった."
  8: "τί ὠφέλησεν ἡμᾶς ἡ ὑπερηφανία — 高慢が何の益をもたらしたか (ὠφελέω — приносить пользу). πλοῦτος μετὰ ἀλαζονείας — 誇りとともにあった富 (ἀλαζονεία — хвастовство, величание). συμβέβληται — 与えた (συμβάλλω — содействовать, приносить); слав. «что воздаде нам»."
  9: "παρῆλθεν … ὡς σκιά — 影のように過ぎ去った (σκιά — тень). ὡς ἀγγελία παρατρέχουσα — 駆け過ぎる知らせのように (ἀγγελία — весть; παρατρέχω — пробегать мимо); слав. «яко весть претекающая»."
  10: "ναῦς διερχομένη κυμαινόμενον ὕδωρ — 波立つ水を渡る船 (κυμαίνω — волновать). ἴχνος — 足跡 (след). ἀτραπὸν τρόπιος — 進む筋 (τρόπις — киль); слав. «стези шествия его». ἐν κύμασιν — 波の間に."
  11: "ὀρνέου διιπτάντος ἀέρα — 空を飛び過ぎる鳥 (διίπταμαι — пролетать). τεκμήριον πορείας — 通り道のしるし (τεκμήριον — доказательство, знак). πληγῇ μαστιζόμενον ταρσῶν — 翼の打ちつける勢いに打たれ (πληγή — удар; ταρσός — плоскость крыла); слав. «язвою… биемый дух легкий». ῥοῖζος — 激しい風音 (свист, шум). ἐπίβασις — 通ったこと (вступление, прохождение)."
  12: "βέλους βληθέντος ἐπὶ σκοπόν — 的に向けて放たれた矢 (σκοπός — цель). τμηθεὶς ὁ ἀήρ — 裂かれた空気 (τέμνω — резать). εἰς ἑαυτὸν ἀνελύθη — 元の一つに戻り (ἀναλύω — разрешаться, возвращаться); слав. «в себе самом заключен бысть». δίοδος — 通り道 (проход)."
  13: "γεννηθέντες ἐξελείπομεν — 生まれては消え (ἐκλείπω — исчезать, угасать); слав. «рождени оскудехом». ἀρετῆς σημεῖον — 徳のしるし (σημεῖον — знак). κατεδαπανήθημεν — 尽き果てた (καταδαπανάω — расточать, истреблять). Здесь прямая речь нечестивых заканчивается, закрывающая 「」."
  14: "ἐλπὶς ἀσεβοῦς — 不敬虔な者の望み (ἐλπίς — надежда). χνοῦς ὑπὸ ἀνέμου φερόμενος — 風に運ばれる塵 (χνοῦς — пыль, пух). πάχνη ὑπὸ λαίλαπος διωχθεῖσα — 嵐に追われる霜 (πάχνη — иней, изморозь); в csl на этом месте «пена мягка от бури расторгнена» — 泡, по паритету взято церковное чтение, вариант LXX в notes. καπνὸς διεχύθη — 煙は吹き散らされる (διαχέω). μνεία καταλύτου μονοημέρου — 一日の客の記憶 (κατάλυτος — постоялец, гость; μονοήμερος — однодневный); слав. «память пришелца единаго дне»."
  15: "Δίκαιοι … εἰς τὸν αἰῶνα ζῶσιν — 正しい者たちはとこしえに生きる. ὁ μισθὸς αὐτῶν — その報い (μισθός — плата, награда). ἡ φροντὶς αὐτῶν παρὰ ὑψίστῳ — 彼らへの顧みは高い方のもとにある (φροντίς — попечение; ὕψιστος — Всевышний, 高い方); слав. «попечение их у вышняго» (в слав. тексте «и во где мзда их» — порча вместо «в Господе»)."
  16: "βασίλειον τῆς εὐπρεπείας — 美しさの王国 (βασίλειον — царство, царский дворец; εὐπρέπεια — благолепие). διάδημα τοῦ κάλλους — 麗しさの冠 (διάδημα — венец; κάλλος — красота). τῇ δεξιᾷ σκεπάσει — 右手で覆い (σκεπάζω). τῷ βραχίονι ὑπερασπιεῖ — 腕で守る (ὑπερασπίζω — защищать); слав. «приимут Царствие благолепия и венец доброты»."
  17: "λήμψεται πανοπλίαν τὸν ζῆλον αὐτοῦ — その熱意を完全武装として取る (πανοπλία — всеоружие; ζῆλος — ревность, 熱意). ὁπλοποιήσει τὴν κτίσιν — 被造物を武装させる (ὁπλοποιέω — вооружать; κτίσις — творение). εἰς ἄμυναν ἐχθρῶν — 敵への報いのために (ἄμυνα — отмщение); слав. «приимет всеюружие рвение свое и вооружит тварь в месть врагом»."
  18: "ἐνδύσεται θώρακα δικαιοσύνην — 義を胸当てとして着る (θώραξ — панцирь, броня). περιθήσεται κόρυθα κρίσιν ἀνυπόκριτον — 偽りのない裁きを兜として戴く (κόρυς — шлем; ἀνυπόκριτος — нелицемерный); слав. «возложит шлем суд нелицемерен»."
  19: "ἀσπίδα ἀκαταμάχητον — 打ち破ることのできない盾 (ἀκαταμάχητος — непобедимый). ὁσιότης — 聖なること (святость, преподобие); слав. «преподобие». Стих продолжает перечень оружия (5:17–20)."
  20: "ὀξυνεῖ … ἀπότομον ὀργὴν εἰς ῥομφαίαν — 激しい怒りを剣として研ぐ (ὀξύνω — точить; ἀπότομος — резкий, суровый; ῥομφαία — меч). συνεκπολεμήσει αὐτῷ ὁ κόσμος — 世は主とともに戦う (συνεκπολεμέω — вместе воевать); слав. «споборет с ним мир». ἐπὶ τοὺς παράφρονας — 狂った者たちに対して (παράφρων — безумный)."
  21: "εὔστοχοι βολίδες ἀστραπῶν — 的を外さない稲妻の矢 (εὔστοχος — меткий; βολίς — стрела). ἀπὸ εὐκύκλου τόξου τῶν νεφῶν — 円く張った雲の弓から (εὔκυκλος — хорошо изогнутый); слав. «от благокругла лука облаков». ἐπὶ σκοπὸν ἁλοῦνται — 的に当たる (ἁλίσκομαι — быть захваченным, попадать)."
  22: "ἐκ πετροβόλου θυμοῦ — 怒りの投石機から (πετρόβολος — камнемётное орудие); слав. «от каменометныя ярости». χάλαζαι ῥιφήσονται — 雹が投げ込まれる (ῥίπτω — бросать). ἀγανακτήσει … ὕδωρ θαλάσσης — 海の水は怒る (ἀγανακτέω — негодовать). συγκλύσουσιν ἀποτόμως — 激しく押し流す (συγκλύζω — затоплять); слав. «потопят нагло»."
  23: "ἀντιστήσεται … πνεῦμα δυνάμεως — 力の霊が立ち向かう (ἀνθίστημι — противостоять). ὡς λαῖλαψ ἐκλικμήσει — つむじ風のように吹き払う (λαῖλαψ — вихрь; ἐκλικμάω — развеивать, как веялом). καὶ ἐρημώσει πᾶσαν τὴν γῆν ἀνομία — 不法は全地を荒らす: эта половина стиха у csl выделена в 5:24 («и опустошит всю землю беззаконие»), по паритету она входит в наш 5:23, отдельного стиха не добавляем. περιτρέψει θρόνους δυναστῶν — 強い者たちの王座を覆す (περιτρέπω — опрокидывать; δυνάστης — властитель)."
