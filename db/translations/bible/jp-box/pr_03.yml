# jp-box, Притчи, глава 3. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc (1901) есть для этой главы: использован как контроль церковного
# чтения, архаизмы не копировались. jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 3: хранение заповедей (1–4), надежда на Господа (5–8), честь Господу от
# трудов (9–10), принятие наказания (11–12), блаженство премудрости (13–20),
# наставление сыну и безопасность пути (21–26), милость к ближнему (27–31),
# участь нечестивых и праведных (32–35).
# Голос: авторские изречения без кавычек; в 3:28 слова, которые запрещено говорить,
# — 「…」 (единственная цитата в главе).
# Нумерация по gr: 35 стихов; подстихи 16a и 22a в gr входят в те же стихи 16 и 22
# (в csl 22a — в скобках), переведены на месте, см. notes. Слав. стихов сверх gr нет.
# 〔…〕 нет: все 35 стихов есть в gr-lxx-byz; квадратные скобки критического издания
# в 3:6 (ὁ δὲ πούς σου …) в тексте не маркируются. Сносок ⟨…⟩ нет: 倉, 酒ぶね,
# 初穂, 鞭打つ уже в корпусе.

tr_code: jp-box
