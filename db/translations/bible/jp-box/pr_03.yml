chapter: 3
draft: true

verses:
  1: "わが子[こ]よ、わたしの掟[おきて]を忘[わす]れるな。あなたの心[こころ]にわたしの言葉[ことば]を守[まも]らせよ。"
  2: "それらはあなたに生涯[しょうがい]の長[なが]さと命[いのち]の年[とし]と平和[へいわ]を加[くわ]えるからである。"
  3: "施[ほどこ]しと誠実[せいじつ]とがあなたから離[はな]れないように。それらをあなたの首[くび]に結[むす]びつけ、あなたの心[こころ]の板[いた]に書[か]き記[しる]せ。そうすれば、あなたは恵[めぐ]みを見[み]いだすであろう。"
  4: "主[しゅ]の御前[みまえ]と人[ひと]の前[まえ]に、良[よ]いことを心[こころ]に掛[か]けよ。"
  5: "心[こころ]を尽[つ]くして神[かみ]に信頼[しんらい]し、自分[じぶん]の知恵[ちえ]に高[たか]ぶるな。"
  6: "あなたのすべての道[みち]で知恵[ちえ]を知[し]れ。そうすれば、知恵はあなたの道をまっすぐにし、あなたの足[あし]はつまずかない。"
  7: "自分[じぶん]を賢[かしこ]いと思[おも]うな。神[かみ]を畏[おそ]れ、すべての悪[あく]から離[はな]れよ。"
  8: "そうすれば、あなたの体[からだ]に癒[いや]しが、あなたの骨[ほね]に手当[てあて]が与[あた]えられる。"
  9: "あなたの正[ただ]しい労苦[ろうく]から主[しゅ]を崇[あが]め、あなたの義[ぎ]の実[み]の初穂[はつほ]を主に献[ささ]げよ。"
  10: "そうすれば、あなたの倉[くら]は麦[むぎ]の豊[ゆた]かさで満たされ、あなたの酒[さか]ぶねはぶどう酒[ぶどうしゅ]を溢[あふ]れ流[なが]す。"
  11: "わが子[こ]よ、主[しゅ]の戒[いまし]めを軽[かろ]んじるな。主[しゅ]に責[せ]められても、気[き]を弱[よわ]らせるな。"
  12: "主[しゅ]は愛[あい]する者[もの]を戒[いまし]め、受[う]け入[い]れるすべての子[こ]を鞭打[むちう]つからである。"
  13: "知恵[ちえ]を見[み]いだした人[ひと]は幸[しあわ]せであり、思慮[しりょ]を知[し]った死[し]すべき者[もの]は幸せである。"
  14: "それを買[か]い求[もと]めることは、金[きん]と銀[ぎん]の宝[たから]を買い求めるよりも良[よ]いからである。"
  15: "それは価[あたい]の高[たか]い石[いし]よりも貴[とうと]い。それに逆[さか]らう悪[あく]は何[なに]一[ひと]つない。それは近[ちか]づくすべての者[もの]によく知[し]られており、すべて貴いものはそれに値[あたい]しない。"
  16: "その右[みぎ]の手[て]には生涯[しょうがい]の長[なが]さと命[いのち]の年[とし]が、その左[ひだり]の手には富[とみ]と栄光[えいこう]がある。その口[くち]からは義[ぎ]が流[なが]れ出[で]、その舌[した]には掟[おきて]と憐[あわ]れみを載[の]せている。"
  17: "その道[みち]は良[よ]い道であり、その細道[ほそみち]はすべて平和[へいわ]のうちにある。"
  18: "それは、それに執[と]りすがるすべての者[もの]にとって命[いのち]の木[き]であり、主[しゅ]に寄[よ]りかかるようにそれに寄りかかる者[もの]にとって揺[ゆ]るぎないものである。"
  19: "神[かみ]は知恵[ちえ]によって地[ち]を据[す]え、思慮[しりょ]によって天[てん]を整[ととの]えられた。"
  20: "その識見[しきけん]によって淵[ふち]は裂[さ]け、雲[くも]は露[つゆ]を滴[したた]らせた。"
  21: "わが子[こ]よ、それらを見過[みす]ごすな。わたしの計画[けいかく]と思[おも]いを守[まも]れ。"
  22: "そうすれば、あなたの魂[たましい]は生[い]き、あなたの首[くび]には恵[めぐ]みがある。あなたの肉[にく]には癒[いや]しが、あなたの骨[ほね]には手当[てあて]が与[あた]えられる。"
  23: "そうすれば、あなたはすべての道[みち]を平和[へいわ]のうちに、信頼[しんらい]して歩[あゆ]み、あなたの足[あし]はつまずかない。"
  24: "あなたが座[すわ]るときには恐[おそ]れがなく、眠[ねむ]るときには心地[ここち]よく眠るからである。"
  25: "あなたは降[ふ]りかかる恐怖[きょうふ]を恐[おそ]れず、襲[おそ]いかかる不敬[ふけい]な者[もの]の激[はげ]しい勢[いきお]いをも恐れない。"
  26: "主[しゅ]はあなたのすべての道[みち]にいて、あなたの足[あし]を固[かた]くし、あなたが揺[ゆ]るがないようにされるからである。"
  27: "あなたの手[て]に助[たす]ける力[ちから]があるときには、乏[とぼ]しい者[もの]に良[よ]いことをするのを控[ひか]えるな。"
  28: "「帰[かえ]って、また来[き]なさい。明日[あした]与[あた]えよう」と言[い]うな。あなたに良いことをする力[ちから]があるのに、そう言ってはならない。明日[あした]が何[なに]を生[う]むかを、あなたは知[し]らないからである。"
  29: "あなたの友[とも]があなたのそばに安[やす]らかに住[す]み、あなたに信頼[しんらい]しているのに、その友に悪[あく]を企[たくら]むな。"
  30: "理由[りゆう]もなく人[ひと]と争[あらそ]うな。その人[ひと]があなたに何[なに]か悪[あく]いことをするといけないからである。"
  31: "悪[わる]い者[もの]たちの非難[ひなん]を自分[じぶん]のものにするな。彼[かれ]らの道[みち]を妬[ねた]み慕[した]うな。"
  32: "すべて不法[ふほう]な者[もの]は主[しゅ]の前[まえ]に汚[けが]れており、正[ただ]しい者[もの]たちと同[とも]に座[すわ]ることはないからである。"
  33: "主[しゅ]の呪[のろ]いは不敬[ふけい]な者[もの]の家[いえ]にあり、正[ただ]しい者[もの]の住[す]まいは祝福[しゅくふく]される。"
  34: "主[しゅ]は高慢[こうまん]な者[もの]に逆[さか]らい、謙遜[けんそん]な者[もの]に恵[めぐ]みを与[あた]える。"
  35: "知恵[ちえ]ある者[もの]は栄光[えいこう]を受[う]け継[つ]ぎ、不敬[ふけい]な者[もの]は不名誉[ふめいよ]を高[たか]く掲[かか]げる。"

notes:
  1: "Υἱέ, ἐμῶν νομίμων μὴ ἐπιλανθάνου — «сыне, моих законов не забывай» (νόμιμος — «установление, закон», передано 掟); τὰ ῥήματά μου τηρείτω σὴ καρδία — «глаголы же моя да соблюдает твое сердце» (τηρέω — «хранить, соблюдать»)."
  2: "μῆκος βίου — «долгота жития» (βίος — «жизнь, срок жизни»); ἔτη ζωῆς — «лета жизни»; εἰρήνην προσθήσουσίν σοι — «мир приложат тебе» (προστίθημι — «прибавлять»)."
  3: "ἐλεημοσύναι καὶ πίστεις μὴ ἐκλιπέτωσάν σε — «милостыни и вера да не оскудевают тебе» (ἐλεημοσύνη — «милостыня, милосердие»; πίστεις — «верность», передано 誠実); ἄφαψαι αὐτὰς ἐπὶ σῷ τραχήλῳ — «обложи я на твоей выи»; καὶ εὑρήσεις χάριν — «и обрящеши благодать». У csl добавлено «и напиши я на скрижали сердца твоего» — этого нет в LXX; по паритету внесено в основной текст без скобок."
  4: "καὶ προνοοῦ καλὰ ἐνώπιον κυρίου καὶ ἀνθρώπων — «и промышляй добрая пред Господем и человеки» (προνοέω — «промышлять, заботиться»), передано 心に掛ける. У Син. «обретешь милость и благоволение» — это чтение ru, в gr и csl «найдешь благодать» стоит в 3:3."
  5: "ἴσθι πεποιθὼς ἐν ὅλῃ καρδίᾳ ἐπὶ θεῷ — «буди уповая всем сердцем на Бога» (πείθω — «доверять»); ἐπὶ σῇ σοφίᾳ μὴ ἐπαίρου — «о твоей премудрости не возносися» (ἐπαίρω — «поднимать, надмеваться»), передано 高ぶる. В gr θεῷ, у Син. «на Господа»."
  6: "ἐν πάσαις ὁδοῖς σου γνώριζε αὐτήν — «во всех путех твоих познавай ю»: αὐτήν — Премудрость (жен. род), поэтому 知恵. ἵνα ὀρθοτομῇ τὰς ὁδούς σου — «да исправляет пути твоя» (ὀρθοτομέω — «прямо резать, выпрямлять»). ὁ δὲ πούς σου οὐ μὴ προσκόπτῃ — «нога же твоя не поткнется»: в критическом издании в квадратных скобках, в csl отсутствует, но в gr-lxx-byz есть, поэтому переведено в основном тексте без 〔…〕."
  7: "μὴ ἴσθι φρόνιμος παρὰ σεαυτῷ — «не буди мудр о себе», т. е. не считай себя мудрым; φοβοῦ τὸν θεὸν καὶ ἔκκλινε ἀπὸ παντὸς κακοῦ — «бойся Бога и уклоняйся от всякаго зла»."
  8: "τότε ἴασις ἔσται τῷ σώματί σου — «тогда изцеление будет телу твоему» (ἴασις — «исцеление»); ἐπιμέλεια τοῖς ὀστέοις σου — «уврачевание костем твоим» (ἐπιμέλεια — «попечение, уход»), передано 手当."
  9: "τίμα τὸν κύριον ἀπὸ σῶν δικαίων πόνων — «чти Господа от праведных твоих трудов» (πόνος — «труд»; у Син. «от имения твоего» — иное чтение, не вносилось); ἀπάρχου αὐτῷ ἀπὸ σῶν καρπῶν δικαιοσύνης — «начатки давай ему от твоих плодов правды» (ἀπάρχομαι — «приносить начатки»), 初穂."
  10: "ἵνα πίμπληται τὰ ταμίειά σου πλησμονῆς σίτου — «да исполнятся житницы твоя множеством пшеницы» (ταμίειον — «житница, кладовая»; πλησμονή — «полнота, изобилие»), передано 豊かさ; οἴνῳ αἱ ληνοί σου ἐκβλύζωσιν — «вино же точила твоя да источают» (ληνός — «точило», 酒ぶね; ἐκβλύζω — «изливаться»)."
  11: "μὴ ὀλιγώρει παιδείας κυρίου — «не пренебрегай наказания Господня» (ὀλιγωρέω — «считать малым, презирать»); μηδὲ ἐκλύου ὑπ᾽ αὐτοῦ ἐλεγχόμενος — «ниже ослабевай от него обличаемь» (ἐκλύω — «расслаблять, изнемогать»)."
  12: "ὃν γὰρ ἀγαπᾷ κύριος παιδεύει — «егоже бо любит Господь, наказует»; μαστιγοῖ πάντα υἱὸν ὃν παραδέχεται — «биет же всякаго сына, егоже приемлет» (μαστιγόω — «бичевать», παραδέχομαι — «принимать»)."
  13: "μακάριος ἄνθρωπος ὃς εὗρεν σοφίαν — «блажен человек, иже обрете премудрость»; θνητὸς ὃς εἶδεν φρόνησιν — «смертен, иже уведе разум»: θνητός — «смертный», 死すべき者; εἶδεν — «увидел, познал»."
  14: "κρεῖττον γὰρ αὐτὴν ἐμπορεύεσθαι — «лучше бо сию куповати» (ἐμπορεύομαι — «торговать, приобретать»), передано 買い求める; ἢ χρυσίου καὶ ἀργυρίου θησαυρούς — «нежели злата и сребра сокровища»."
  15: "τιμιωτέρα λίθων πολυτελῶν — «честнейша камений многоценных» (πολυτελής — «драгоценный»); οὐκ ἀντιτάξεται αὐτῇ οὐδὲν πονηρόν — «не сопротивляется ей ничтоже лукаво» (ἀντιτάσσω — «противиться»); εὔγνωστος πᾶσιν τοῖς ἐγγίζουσιν αὐτῇ — «благознатна всем приближающымся ей»; πᾶν τίμιον οὐκ ἄξιον αὐτῆς — «всяко честное недостойно ея»."
  16: "μῆκος βίου καὶ ἔτη ζωῆς ἐν τῇ δεξιᾷ αὐτῆς — «долгота жития и лета жизни в деснице ея»; ἐν τῇ ἀριστερᾷ πλοῦτος καὶ δόξα — «в шуйце богатство и слава». Подстих 16a (ἐκ τοῦ στόματος αὐτῆς … ἔλεον ἐπὶ γλώσσης φορεῖ) в gr входит в тот же стих, как и в csl, поэтому переведён здесь же; φορεῖ — «носит»."
  17: "αἱ ὁδοὶ αὐτῆς ὁδοὶ καλαί — «путие ея путие добри»; πάντες οἱ τρίβοι αὐτῆς ἐν εἰρήνῃ — «вся стези ея мирны» (ἐν εἰρήνῃ — «в мире»)."
  18: "ξύλον ζωῆς ἐστι πᾶσι τοῖς ἀντεχομένοις αὐτῆς — «древо живота есть всем держащымся ея» (ἀντέχομαι — «держаться»); τοῖς ἐπερειδομένοις ἐπ᾽ αὐτὴν ὡς ἐπὶ κύριον ἀσφαλής — «воскланяющымся на ню, яко на Господа, тверда» (ἐπερείδω — «опираться»); сравнение ὡς ἐπὶ κύριον сохранено."
  19: "ὁ θεὸς τῇ σοφίᾳ ἐθεμελίωσεν τὴν γῆν — «Бог премудростию основа землю» (θεμελιόω — «полагать основание»); ἡτοίμασεν οὐρανοὺς ἐν φρονήσει — «уготова небеса разумом»."
  20: "ἐν αἰσθήσει ἄβυσσοι ἐρράγησαν — «в чувстве бездны разверзошася» (αἴσθησις — 識見; ῥήγνυμι — «разрывать»); νέφη ἐρρύησαν δρόσους — «облацы источиша росу» (δρόσος — «роса»). У csl «в чувстве его» — местоимение «его» добавлено, в LXX его нет; по паритету внесено в основной текст без скобок (その識見)."
  21: "Υἱέ, μὴ παραρρυῇς — «сыне, да не преминеши» (παραρρέω — «протекать мимо, упускать»); τήρησον ἐμὴν βουλὴν καὶ ἔννοιαν — «соблюди мой совет и мысль» (βουλή — 計画, ἔννοια — 思い)."
  22: "ἵνα ζήσῃ ἡ ψυχή σου — «да жива будет душа твоя»; χάρις ᾖ περὶ σῷ τραχήλῳ — «благодать будет на твоей выи». Подстих 22a (ἔσται δὲ ἴασις ταῖς σαρξί σου … τοῖς σοῖς ὀστέοις) в gr входит в тот же стих, в csl стоит в скобках, поэтому переведён здесь же; σάρξ — 肉, ἐπιμέλεια — 手当."
  23: "ἵνα πορεύῃ πεποιθὼς ἐν εἰρήνῃ πάσας τὰς ὁδούς σου — «да ходиши надеяся в мире во всех путех твоих»; ὁ πούς σου οὐ μὴ προσκόψῃ — «нога же твоя не поткнется» (προσκόπτω — «спотыкаться»)."
  24: "ἐὰν γὰρ κάθῃ, ἄφοβος ἔσῃ — «аще бо сядеши, безбоязнен будеши»; ἐὰν καθεύδῃς, ἡδέως ὑπνώσεις — «аще же поспиши, сладостно поспиши» (ἡδέως — «сладко, приятно»)."
  25: "οὐ φοβηθήσῃ πτύησιν ἐπελθοῦσαν — «не убоишися страха нашедшаго» (πτύησις — «устрашение, паника»); ὁρμὰς ἀσεβῶν ἐπερχομένας — «устремления нечестивых находящаго» (ὁρμή — «натиск, порыв»), передано 激しい勢い."
  26: "ὁ κύριος ἔσται ἐπὶ πασῶν ὁδῶν σου — «Господь будет на всех путех твоих»; ἐρείσει σὸν πόδα — «утвердит ногу твою» (ἐρείδω — «утверждать, подпирать»); ἵνα μὴ σαλευθῇς — «да не поползнешися» (σαλεύω — «колебать»)."
  27: "μὴ ἀπόσχῃ εὖ ποιεῖν ἐνδεῆ — «не отрецыся благотворити требующему» (ἀπέχω — «удерживаться»; ἐνδεής — «нуждающийся»); ἡνίκα ἂν ἔχῃ ἡ χείρ σου βοηθεῖν — «егда имать рука твоя помогати»."
  28: "μὴ εἴπης — «не рцы»: далее прямая речь в 「…」 — слова, которые запрещено говорить ближнему. Ἐπανελθὼν ἐπάνηκε καὶ αὔριον δώσω — «отшед возвратися, и заутра дам» (ἐπανέρχομαι — «возвращаться»); δυνατοῦ σου ὄντος εὖ ποιεῖν — «сильну ти сущу благотворити», gen. absolutus; οὐ γὰρ οἶδας τί τέξεται ἡ ἐπιοῦσα — «не веси бо, что породит день находяй» (τίκτω — «рождать»)."
  29: "μὴ τεκτήνῃ ἐπὶ σὸν φίλον κακά — «не соплетай на друга твоего зла» (τεκταίνομαι — «замышлять, строить»); παροικοῦντα καὶ πεποιθότα ἐπὶ σοί — «пришелца суща и уповающа на тя» (παροικέω — «жить рядом, быть пришельцем»)."
  30: "μὴ φιλεχθρήσῃς πρὸς ἄνθρωπον μάτην — «не враждуй на человека туне» (φιλεχθρέω — «враждовать»; μάτην — «напрасно, без причины»); μή τι εἰς σὲ ἐργάσηται κακόν — «да не что на тя содеет злое», т. е. чтобы он не сделал тебе зла. У Син. иначе («когда он не сделал зла тебе») — это чтение МТ, держимся LXX и csl."
  31: "μὴ κτήσῃ κακῶν ἀνδρῶν ὀνείδη — «не стяжи злых мужей поношения» (κτάομαι — «приобретать»; ὄνειδος — «поношение, укор»): не делай своим тот укор, который принадлежит злым; μηδὲ ζηλώσῃς τὰς ὁδοὺς αὐτῶν — «ни возревнуй путем их» (ζηλόω — «ревновать, завидовать»)."
  32: "ἀκάθαρτος γὰρ ἔναντι κυρίου πᾶς παράνομος — «нечист бо пред Господем всяк законопреступник»; ἐν δὲ δικαίοις οὐ συνεδριάζει — «и с праведными не сочетавается» (συνεδριάζω — «сидеть в совете»), передано 共に座る."
  33: "κατάρα θεοῦ ἐν οἴκοις ἀσεβῶν — «клятва Господня в домех нечестивых»: в gr θεοῦ, у csl «Господня» — взято церковное чтение (主の呪い); ἐπαύλεις δικαίων εὐλογοῦνται — «дворы же праведных благословляются» (ἔπαυλις — «жилище, усадьба»), 住まい."
  34: "κύριος ὑπερηφάνοις ἀντιτάσσεται — «Господь гордым противится» (ὑπερήφανος — 高慢な者); ταπεινοῖς δὲ δίδωσιν χάριν — «смиренным же дает благодать» (ταπεινός — 謙遜な者)."
  35: "δόξαν σοφοὶ κληρονομήσουσιν — «славу премудрии наследят»; οἱ ἀσεβεῖς ὕψωσαν ἀτιμίαν — «нечестивии же вознесоша безчестие» (ὑψόω — «возвышать», ἀτιμία — «бесчестие»). Аорист ὕψωσαν сохранён как совершившееся."
