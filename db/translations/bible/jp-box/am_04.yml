# jp-box, Амос, глава 4. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 4 (совпадает).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1–3 «телицы Васанские»: притесняют бедных, говорят господам
# «подавай, и мы будем пить»; клятва Господа, плен, нагота; 4–5 обличение
# богослужения в Вефиле и Галгале; 6–11 пять казней и рефрен «но вы не обратились
# ко Мне»: голод, бездождие, ржа и гусеница, мор и меч, истребление как Содом
# и Гоморра; 12–13 «приготовься к сретению Бога твоего», гимн Творцу.
# Голоса: 1 — речь пророка, слова телиц в 「…»; 2–3 — слово Господа в 「…»
# (клятва в 2 вне кавычек); 4–5 — слово Господа в 「…» (LXX/csl — изъявительное
# «вы вошли и беззаконновали», не императив); 6–13 — одно слово Господа в 「…»,
# рефрен 6, 8, 9, 10, 11 внутри речи; закрывается в 13.
# Рефрен: 「それでも、あなたがたはわたしに帰らなかった、と主は言われる。」
# Термины: 雌牛 (δάμαλις), 聖なる者 (ἅγιοι), 粗布, 歯を失う (γομφιασμός),
# 焼け病 (πύρωσις), 黄ばみ (ἴκτερος), 燃えさし (δαλός), 油を注がれた者 (χριστός).
# Имена: バシャン, サマリア, ベテル, ギルガル, イスラエル, ヨセフ, エジプト,
# ソドム, ゴモラ, レンマン.
#
tr_code: jp-box
book: am
chapter: 4
draft: true

verses:
  1: "バシャンの雌牛[めうし]たちよ、サマリアの山[やま]にいる者[もの]たちよ、この言葉[ことば]を聞[き]け。あなたがたは貧[まず]しい者[もの]を虐[しいた]げ、乏[とぼ]しい者を踏[ふ]みつけ、あなたがたの主人[しゅじん]たちに「飲[の]ませてくれ」と言[い]う。"
  2: "主[しゅ]である神[かみ]は、ご自分[じぶん]の聖[せい]なる者[もの]にかけて誓[ちか]われた。「見[み]よ、あなたがたの上[うえ]に日[ひ]が来[く]る。その日、あなたがたは武器[ぶき]で捕[と]らえられ、あなたがたとともにいる者[もの]は火[ひ]で熱[あつ]せられた鍋[なべ]に投[な]げ込[こ]まれる。"
  3: "あなたがたは裸[はだか]にされて、互[たが]いに向[む]かい合[あ]って連[つ]れ出[だ]され、レンマンの山[やま]へ投[な]げ捨[す]てられる。」と主[しゅ]である神[かみ]は言[い]われる。"
  4: "「あなたがたはベテルへ行[い]って罪[つみ]を犯[おか]し、ギルガルへ行って罪を増[ふ]やした。あなたがたは朝[あさ]ごとに供[そな]え物[もの]をささげ、三日[みっか]ごとに十分[じゅうぶん]の一[いち]をささげた。"
  5: "あなたがたは外[そと]で律法[りっぽう]を読[よ]み上[あ]げ、告白[こくはく]を唱[とな]えた。イスラエルの子[こ]らよ、あなたがたがこれらを愛[あい]したことを告[つ]げ知[し]らせよ。」と主[しゅ]である神[かみ]は言[い]われる。"
  6: "「わたしはまた、あなたがたのすべての町[まち]で歯[は]を失[うしな]わせ、すべての場所[ばしょ]でパンに乏[とぼ]しくさせた。それでも、あなたがたはわたしに帰[かえ]らなかった、と主[しゅ]は言[い]われる。"
  7: "わたしはまた、刈[か]り入[い]れの三か月前[みつきまえ]に、あなたがたから雨[あめ]を止[と]めた。わたしは一[ひと]つの町[まち]には雨を降[ふ]らせ、ほかの町には降らせなかった。一部[いちぶ]の畑[はたけ]には雨が降り、雨の降らない畑は枯[か]れた。"
  8: "二[ふた]つ、三[みっ]つの町[まち]の人[ひと]々[びと]が、水[みず]を飲[の]もうとして一つの町に集[あつ]まっても、満[み]たされない。それでも、あなたがたはわたしに帰らなかった、と主[しゅ]は言[い]われる。"
  9: "わたしはあなたがたを、焼[や]け病[びょう]と黄[き]ばみで打[う]った。あなたがたの園[その]とぶどう畑[ばたけ]、いちじく畑、オリーブ畑が増[ふ]えても、芋虫[いもむし]がそれを食[く]い尽[つ]くした。それでも、あなたがたはわたしに帰らなかった、と主[しゅ]は言[い]われる。"
  10: "わたしはあなたがたに、エジプトの道[みち]の死[し]を送[おく]り、あなたがたの若者[わかもの]たちを剣[つるぎ]で殺[ころ]し、あなたの馬[うま]を捕囚[ほしゅう]として連[つ]れ去[さ]らせ、あなたがたの陣営[じんえい]を、わたしの怒[いか]りの中[なか]で火[ひ]に渡[わた]した。それでも、あなたがたはわたしに帰らなかった、と主[しゅ]は言[い]われる。"
  11: "わたしはあなたがたのうちで、ソドムとゴモラを滅[ほろ]ぼした神[かみ]のように滅ぼした。あなたがたは火[ひ]の中から引[ひ]き抜[ぬ]かれた燃[も]えさしのようになった。それでも、あなたがたはわたしに帰らなかった、と主[しゅ]は言[い]われる。"
  12: "それゆえ、イスラエルよ、わたしはあなたにこうする。わたしがあなたにこうするのだから、イスラエルよ、あなたの神[かみ]を呼[よ]び求[もと]める準備[じゅんび]をせよ。"
  13: "見[み]よ、雷[かみなり]を据[す]え、風[かぜ]を造[つ]り、人[ひと]にご自分[じぶん]の油[あぶら]を注[そそ]がれた者[もの]を告[つ]げ、暁[あかつき]と霧[きり]を造り、地[ち]の高[たか]い所[ところ]を歩[あゆ]まれる方[かた]である。その名[な]は主[しゅ]である神[かみ]、全能者[ぜんのうしゃ]。」"

notes:
  1: "Ἀκούσατε τὸν λόγον τοῦτον, δαμάλεις τῆς Βασανίτιδος — «слушайте слово сие, телицы Васанские» (δάμαλις — молодая корова, 雌牛; Βασανῖτις — バシャン); αἱ ἐν τῷ ὄρει τῆς Σαμαρείας — «которые на горе Самарийской»; αἱ καταδυναστεύουσαι πτωχοὺς καὶ καταπατοῦσαι πένητας — «притесняющие бедных и попирающие нищих» (καταδυναστεύω — 虐げる; καταπατέω — 踏みつける); αἱ λέγουσαι τοῖς κυρίοις αὐτῶν Ἐπίδοτε ἡμῖν ὅπως πίωμεν — «говорящие господам своим: подайте нам, чтобы мы пили» (κύριος — господин/муж, 主人; ἐπιδίδωμι — подавать). Слова телиц — 「…」."
  2: "ὀμνύει κύριος κατὰ τῶν ἁγίων αὐτοῦ — «клянётся Господь святыми Своими» (ὀμνύω — клясться; ἅγιοι — 聖なる者; csl «святыми своими»); Διότι ἰδοὺ ἡμέραι ἔρχονται ἐφ' ὑμᾶς — «ибо вот, приходят на вас дни»; λήμψονται ὑμᾶς ἐν ὅπλοις — «возьмут вас оружием» (ὅπλα — оружие, 武器; csl «во оружии»); τοὺς μεθ' ὑμῶν εἰς λέβητας ὑποκαιομένους ἐμβαλοῦσιν ἔμπυροι λοιμοί — «сущих с вами в поджигаемые котлы ввергнут огненные губители» (λέβης — котёл, 鍋; ἔμπυρος — огненный; λοιμός — мор/губитель; тёмное место, передано по смыслу). В ru (МТ) «повлекут крюками и удами» — иное чтение, не внесено."
  3: "ἐξενεχθήσεσθε γυμναὶ κατέναντι ἀλλήλων — «вынесены будете нагие друг против друга» (γυμνός — 裸; κατέναντι — напротив, 向かい合って); ἀπορριφήσεσθε εἰς τὸ ὄρος τὸ Ρεμμαν — «брошены будете на гору Ремман» (Ρεμμαν — тёмное имя; ru «бросите всё убранство чертогов» — МТ, не внесено)."
  4: "Εἰσήλθατε εἰς Βαιθηλ καὶ ἠνομήσατε — «вы вошли в Вефиль и беззаконновали» (εἰσέρχομαι — входить; ἀνομέω — беззаконновать, 罪を犯す); εἰς Γαλγαλα ἐπληθύνατε τοῦ ἀσεβῆσαι — «в Галгал умножили нечестие» (πληθύνω — умножать, 増やす); ἠνέγκατε εἰς τὸ πρωῒ θυσίας ὑμῶν — «принесли утром жертвы ваши» (θυσία — 供え物); εἰς τὴν τριημερίαν τὰ ἐπιδέκατα ὑμῶν — «в тридневье десятины ваши» (τριημερία — трёхдневный срок, 三日ごと; ἐπιδέκατον — десятина, 十分の一). Греч. и csl — изъявительное наклонение (обвинение); в ru (МТ) императивы «идите… грешите» — иное чтение, не внесено."
  5: "ἀνέγνωσαν ἔξω νόμον — «читали вне закон» (ἀναγινώσκω — читать; ἔξω — вне); ἐπεκαλέσαντο ὁμολογίας — «призывали исповедания» (ὁμολογία — исповедание, 告白); ἀπαγγείλατε ὅτι ταῦτα ἠγάπησαν οἱ υἱοὶ Ισραηλ — «возвестите, что это возлюбили сыны Израилевы» (ἀπαγγέλλω — возвещать). В ru (МТ) «приносите в жертву благодарения квасное» — иное чтение, не внесено; место тёмное."
  6: "ἐγὼ δώσω ὑμῖν γομφιασμὸν ὀδόντων — «Я дам вам оскомину зубов» (γομφιασμός — стучание/оскомина; csl «оскомину зубом», 歯を失わせる); ἔνδειαν ἄρτων — «недостаток хлебов» (ἔνδεια — недостаток, 乏しく; ἄρτος — パン); καὶ οὐκ ἐπεστρέψατε πρός με — «и не обратились ко Мне» (ἐπιστρέφω — 帰る). Здесь начинается рефрен 6, 8, 9, 10, 11."
  7: "ἀνέσχον ἐξ ὑμῶν τὸν ὑετόν — «удержал от вас дождь» (ἀνέχω — удерживать; ὑετός — дождь, 雨); πρὸ τριῶν μηνῶν τοῦ τρυγήτου — «за три месяца до сбора винограда» (τρύγητος — 取り入れ); βρέξω ἐπὶ πόλιν μίαν, ἐπὶ δὲ πόλιν μίαν οὐ βρέξω — «пролью на один город, а на другой не пролью» (βρέχω — 降らせる); μερὶς μία βραχήσεται — «одна часть оросится» (μερίς — участок, 区画; βρέχω); μερίς, ἐφ' ἣν οὐ βρέξω, ξηρανθήσεται — «часть, на которую не пролью, высохнет» (ξηραίνω — 枯れる)."
  8: "συναθροισθήσονται δύο καὶ τρεῖς πόλεις εἰς πόλιν μίαν τοῦ πιεῖν ὕδωρ — «соберутся два и три города в один город, чтобы напиться воды» (συναθροίζω — 集まる); οὐ μὴ ἐμπλησθῶσιν — «не насытятся» (ἐμπίπλημι — 満たす); καὶ οὐκ ἐπεστρέψατε πρός με — рефрен."
  9: "ἐπάταξα ὑμᾶς ἐν πυρώσει καὶ ἐν ἰκτέρῳ — «поразил вас огнём (ржавчиной) и желтухой» (πύρωσις — воспаление/ржа, csl «раждожением», 焼け病; ἴκτερος — желтуха, csl «златеницею», 黄ばみ); ἐπληθύνατε κήπους ὑμῶν, ἀμπελῶνας… καὶ ἐλαιῶνας — «вы умножили сады ваши, виноградники… и масличные сады» (κῆπος — сад, 園; ἀμπελών — ぶどう畑; ἐλαιών — オリーブ畑); κατέφαγεν ἡ κάμπη — «поела гусеница» (κάμπη — 芋虫); καὶ οὐδ' ὧς ἐπεστρέψατε — рефрен (οὐδ' ὧς — «и при том»)."
  10: "ἐξαπέστειλα εἰς ὑμᾶς θάνατον ἐν ὁδῷ Αἰγύπτου — «послал на вас смерть на пути Египетском» (θάνατος — мор/смерть, 死; csl «смерть на пути египетстем»); ἀπέκτεινα ἐν ῥομφαίᾳ τοὺς νεανίσκους ὑμῶν — «убил мечом юношей ваших» (ῥομφαία — 剣; νεανίσκος — 若者); μετὰ αἰχμαλωσίας ἵππων σου — «с пленом коней твоих» (αἰχμαλωσία — 捕囚); ἀνήγαγον ἐν πυρὶ τὰς παρεμβολὰς ὑμῶν ἐν τῇ ὀργῇ μου — «возвёл в огне станы ваши в гневе Моём» (παρεμβολή — стан, 陣営; ἀνάγω — возводить; передано «火に渡した»); рефрен. В ru (МТ) «смрад от станов ваших поднимался в ноздри» — иное чтение."
  11: "κατέστρεψα ὑμᾶς, καθὼς κατέστρεψεν ὁ θεὸς Σοδομα καὶ Γομορρα — «ниспроверг вас, как ниспроверг Бог Содом и Гоморру» (καταστρέφω — 滅ぼす; Σοδομα, Γομορρα — ソドム, ゴモラ); ἐγένεσθε ὡς δαλὸς ἐξεσπασμένος ἐκ πυρός — «вы стали как головня, исторгнутая из огня» (δαλός — головня, 燃えさし; ἐκσπάω — вырывать); рефрен."
  12: "οὕτως ποιήσω σοι, Ισραηλ — «так сделаю тебе, Израиль»; πλὴν ὅτι οὕτως ποιήσω σοι — «итак, поскольку так сделаю тебе» (πλήν — однако/итак); ἑτοιμάζου τοῦ ἐπικαλεῖσθαι τὸν θεόν σου — «готовься призывать Бога твоего» (ἑτοιμάζω — готовить, 準備する; ἐπικαλέομαι — призывать, 呼び求める). В ru (МТ) «приготовься к сретению Бога твоего» — иное чтение, не внесено."
  13: "στερεῶν βροντὴν — «утверждающий гром» (στερεόω — утверждать, 据える; βροντή — 雷); κτίζων πνεῦμα — «создающий ветер/дух» (κτίζω — творить, 造る; πνεῦμα — 風); ἀπαγγέλλων εἰς ἀνθρώπους τὸν χριστὸν αὐτοῦ — «возвещающий людям Христа (помазанника) Своего» (χριστός — помазанник, 油を注がれた者; в МТ/ru «объявляет человеку намерения его» — иное чтение); ποιῶν ὄρθρον καὶ ὁμίχλην — «творящий утреннюю зарю и туман» (ὄρθρος — 暁; ὁμίχλη — 霧); ἐπιβαίνων ἐπὶ τὰ ὕψη τῆς γῆς — «восходящий на высоты земли» (ἐπιβαίνω — 歩む; ὕψη — 高い所); κύριος ὁ θεὸς ὁ παντοκράτωρ ὄνομα αὐτῷ — «Господь Бог Вседержитель имя Ему» (παντοκράτωρ — 全能者)."
