verses:
  0: "指揮者[しきしゃ]に。ダビデの詩[うた]。"
  1: "神[かみ]よ、わたしが願[ねが]うとき、その声[こえ]を聞[き]いてください。敵[てき]の恐[おそ]れから、わたしの魂[たましい]を救[すく]い出[だ]してください。"
  2: "あなたは、悪[わる]をなす者[もの]の徒党[ととう]から、不[ふ]法[ほう]を働[はたら]く多[おお]くの者[もの]から、わたしを覆[おお]ってくださった。"
  3: "彼[かれ]らはその舌[した]を剣[つるぎ]のように研[と]ぎ、苦[にが]いことを矢[や]として、その弓[ゆみ]を張[は]り、"
  4: "隠[かく]れた所[ところ]から罪[つみ]のない者[もの]を射[い]ようとする。彼[かれ]らは不意[ふい]にその人[ひと]を射[い]て、恐[おそ]れない。"
  5: "彼[かれ]らは悪[あく]い言葉[ことば]を固[かた]く定[さだ]め、罠[わな]を隠[かく]すことを語[かた]り合[あ]った。「だれが、わたしたちを見[み]るものか」と。"
  6: "彼[かれ]らは不[ふ]法[ほう]を探[さぐ]り、探[さぐ]りに探[さぐ]って、尽[つ]き果[は]てた。人[ひと]は深[ふか]い心[こころ]をもって近[ちか]づく。"
  7: "しかし、神[かみ]は高[たか]く上[あ]げられる。彼[かれ]らの打[う]ち傷[きず]は、幼[おさな]い者[もの]の矢[や]となった。"
  8: "彼[かれ]らの舌[した]は、彼[かれ]ら自身[じしん]を弱[よわ]らせた。彼[かれ]らを見[み]る者[もの]は、皆[みな]恐[おそ]れおののいた。"
  9: "すべての人[ひと]は恐[おそ]れ、神[かみ]のなされた業[わざ]を告[つ]げ知[し]らせ、その造[つく]られたものを見[み]て悟[さと]った。"
  10: "正[ただ]しい者[もの]は主[しゅ]によって喜[よろこ]び、主[しゅ]に望[のぞ]みを置[お]く。心[こころ]の正[ただ]しい者[もの]は、すべてほめたたえられる。"

notes:
  0: "Εἰς τὸ τέλος· ψαλμὸς τῷ Δαυιδ — 指揮者に。ダビデの詩 (εἰς τὸ τέλος — «в конец», начальнику хора)."
  1: "Εἰσάκουσον… τῆς φωνῆς μου ἐν τῷ δέεσθαί με — わたしが願うとき、その声を聞いてください (δέομαι — «просить»). ἀπὸ φόβου ἐχθροῦ ἐξελοῦ τὴν ψυχήν μου — 敵の恐れから魂を救い出してください (ἐξαιρέω — «изымать»)."
  2: "ἐσκέπασάς με ἀπὸ συστροφῆς πονηρευομένων — 悪をなす者の徒党から覆ってくださった (σκέπω — «покрывать»; συστροφή — «сборище, заговор»). ἀπὸ πλήθους ἐργαζομένων τὴν ἀνομίαν — 不法を働く多くの者から (πλῆθος — «множество»)."
  3: "ἠκόνησαν ὡς ῥομφαίαν τὰς γλώσσας αὐτῶν — 舌を剣のように研ぎ (ἀκονάω — «точить»). ἐνέτειναν τόξον αὐτῶν — 弓を張り (ἐντείνω — «натягивать»). πρᾶγμα πικρόν — 苦いことを (πικρός — «горький», т. е. злое дело)."
  4: "τοῦ κατατοξεῦσαι ἐν ἀποκρύφοις ἄμωμον — 隠れた所から罪のない者を射ようと (κατατοξεύω — «расстреливать из лука»; ἄμωμος — «непорочный»). ἐξάπινα κατατοξεύσουσιν αὐτὸν καὶ οὐ φοβηθήσονται — 不意に射て、恐れない (ἐξάπινα — «внезапно»)."
  5: "ἐκραταίωσαν ἑαυτοῖς λόγον πονηρόν — 悪い言葉を固く定め (κραταιόω — «утверждать»). διηγήσαντο τοῦ κρύψαι παγίδας — 罠を隠すことを語り合った (παγίς — «сеть, ловушка»). εἶπαν Τίς ὄψεται αὐτούς — 「だれが、わたしたちを見るものか」 (их речь — 「」)."
  6: "ἐξηρεύνησαν ἀνομίας — 不法を探り (ἐξερευνάω — «разыскивать»). ἐξέλιπον ἐξερευνῶντες ἐξερευνήσει — 探りに探って尽き果てた (повтор корня сохранён). προσελεύσεται ἄνθρωπος, καὶ καρδία βαθεῖα — 人は深い心をもって近づく (место тёмное; слав. «приступит человек, и сердце глубоко»)."
  7: "καὶ ὑψωθήσεται ὁ θεός — しかし、神は高く上げられる (ὑψόω). βέλος νηπίων ἐγενήθησαν αἱ πληγαὶ αὐτῶν — 彼らの打ち傷は、幼い者の矢となった (βέλος — «стрела»; πληγή — «удар, рана»; т. е. удары их бессильны)."
  8: "ἐξησθένησαν ἐπ᾿ αὐτοὺς αἱ γλῶσσαι αὐτῶν — 彼らの舌は彼ら自身を弱らせた (ἐξασθενέω — «обессилеть»). ἐταράχθησαν πάντες οἱ θεωροῦντες αὐτούς — 彼らを見る者は皆恐れおののいた (θεωρέω — «смотреть»)."
  9: "ἐφοβήθη πᾶς ἄνθρωπος — すべての人は恐れ (φοβέω). ἀνήγγειλαν τὰ ἔργα τοῦ θεοῦ — 神のなされた業を告げ知らせ (ἀναγγέλλω). τὰ ποιήματα αὐτοῦ συνῆκαν — その造られたものを見て悟った (ποίημα — «произведение»; συνίημι — «понимать»)."
  10: "εὐφρανθήσεται δίκαιος ἐπὶ τῷ κυρίῳ — 正しい者は主によって喜び (εὐφραίνομαι). ἐλπιεῖ ἐπ᾽ αὐτόν — 主に望みを置く (ἐλπίζω). ἐπαινεσθήσονται πάντες οἱ εὐθεῖς τῇ καρδίᾳ — 心の正しい者は、すべてほめたたえられる (εὐθύς — «прямой, правый»)."
