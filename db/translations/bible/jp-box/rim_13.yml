# jp-box, Послание к Римлянам, глава 13. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 13: покорность властям (1–7), долг любви (8–10), близость дня (11–14).
# Красного и синего нет. jp-ni не использовался.

tr_code: jp-box
book: rim
chapter: 13
draft: true

verses:
  1: "すべての人[ひと]は、上[うえ]にある権威[けんい]に従[したが]うべきである。というのは、神[かみ]によらない権威[けんい]はないからである。今[いま]ある権威[けんい]は、神[かみ]によって立[た]てられたものである。"
  2: "だから、権威[けんい]に逆[さか]らう者[もの]は、神[かみ]の定[さだ]めに逆[さか]らっている。逆[さか]らう者[もの]たちは、自分[じぶん]で自分[じぶん]に裁[さば]きを招[まね]くことになる。"
  3: "というのは、支配者[しはいしゃ]たちは、善[よ]い行[おこな]いにとって恐[おそ]ろしいものではなく、悪[わる]い行[おこな]いにとって恐[おそ]ろしいものだからである。権威[けんい]を恐[おそ]れたくないのか。善[よ]いことを行[おこな]いなさい。そうすれば、その権威[けんい]から褒[ほ]めを受[う]ける。"
  4: "というのは、その者[もの]はあなたの益[えき]のために神[かみ]の僕[しもべ]だからである。しかし、悪[わる]いことを行[おこな]うなら、恐[おそ]れなさい。その者[もの]が剣[つるぎ]を佩[お]びているのは、無駄[むだ]ではないからである。その者[もの]は神[かみ]の僕[しもべ]であり、悪[あく]を行[おこな]う者[もの]に怒[いか]りをもって報[むく]いる者[もの]なのである。"
  5: "だから、怒[いか]りを受[う]けるためだけでなく、良心[りょうしん]のためにも、従[したが]うことが必要[ひつよう]である。"
  6: "そういうわけで、あなたがたは税[ぜい]も納[おさ]めるのである。彼[かれ]らは神[かみ]の奉仕者[ほうししゃ]であり、まさにその務[つと]めに専念[せんねん]しているからである。"
  7: "すべての人[ひと]に、負[お]うべきものは返[かえ]しなさい。税[ぜい]を納[おさ]めるべき者[もの]には税[ぜい]を、貢[みつぎ]を納[おさ]めるべき者[もの]には貢[みつぎ]を、恐[おそ]れるべき者[もの]には恐[おそ]れを、敬[うやま]うべき者[もの]には敬[うやま]いを返[かえ]しなさい。"
  8: "互[たが]いに愛[あい]し合[あ]うこと以外[いがい]は、だれに対[たい]しても何[なに]も負[お]いを残[のこ]してはならない。というのは、人[ひと]を愛[あい]する者[もの]は、律法[りっぽう]を全[まっと]うしているからである。"
  9: "というのは、「姦淫[かんいん]してはならない、殺[ころ]してはならない、盗[ぬす]んではならない、〔偽証[ぎしょう]してはならない、〕むさぼってはならない」、また、ほかにどんな戒[いまし]めがあっても、それは「あなたの隣人[りんじん]を自分[じぶん]のように愛[あい]せよ」というこの言葉[ことば]に要約[ようやく]されるからである。"
  10: "愛[あい]は隣人[りんじん]に悪[あく]を働[はたら]かない。だから、愛[あい]は律法[りっぽう]を全[まっと]うするものである。"
  11: "また、あなたがたは時[とき]を知[し]っている。今[いま]こそ、眠[ねむ]りから目覚[めざ]める時[とき]である。というのは、わたしたちが信[しん]じた時[とき]よりも、今[いま]のほうが救[すく]いが近[ちか]づいているからである。"
  12: "夜[よる]は更[ふ]け、昼[ひる]は近[ちか]づいた。だから、闇[やみ]の行[おこな]いを脱[ぬ]ぎ捨[す]て、光[ひかり]の武具[ぶぐ]を身[み]に着[つ]けよう。"
  13: "昼[ひる]にふさわしく、行状[ぎょうじょう]を正[ただ]しくして歩[あゆ]もう。酒宴[しゅえん]や泥酔[でいすい]、不品行[ふひんこう]や好色[こうしょく]、争[あらそ]いや妬[ねた]みにふけってはならない。"
  14: "むしろ、主[しゅ]イエス・キリストを身[み]に着[つ]けなさい。そして、肉[にく]の欲[よく]を満[み]たすために、肉[にく]に備[そな]えをしてはならない。"

notes:
  1: "ἐξουσία — власть; 権威. ὑπερεχούσαις — «начальствующим, высшим»; 上にある. ψυχή — «душа», здесь синекдоха: すべての人. τεταγμέναι — «поставлены, учреждены»; 立てられた."
  2: "διαταγή — «установление, повеление»; 定め. κρῖμα — «суд, осуждение»; 裁きを招く."
  3: "οἱ ἄρχοντες — «начальники, правители»; 支配者. φόβος — «страх», здесь: внушающий страх; 恐ろしいもの."
  4: "διάκονος θεοῦ — «служитель Божий»; 神の僕 (дважды, как в греч.). μάχαιρα — меч; 剣. ἔκδικος εἰς ὀργήν — «отмститель в гнев»; 怒りをもって報いる者."
  5: "συνείδησις — совесть; 良心."
  6: "φόρος — подать, налог; τέλος (13:7) — пошлина, сбор; переданы 税 и 貢. λειτουργοί — «служители»; 奉仕者."
  7: "ἀπόδοτε — «воздайте»; 返しなさい. Четыре пары «должное — воздаяние» сохранены."
  8: "μηδενὶ μηδὲν ὀφείλετε — «никому ничего не оставайтесь должны»; 負いを残してはならない. πεπλήρωκεν — «исполнил»; 全うしている."
  9: "В критической базе четыре заповеди (без «не лжесвидетельствуй»); церковный текст (Елизаветинская, jp-joc「妄證する毋れ」) читает и её — 〔偽証してはならない、〕. ἀνακεφαλαιοῦται — «сводится, суммируется»; 要約される."
  10: "πλήρωμα νόμου — «полнота закона»; 律法を全うするもの."
  11: "καιρός — время, срок; ὥρα — час. ἐξ ὕπνου ἐγερθῆναι — «восстать от сна»; 眠りから目覚める. ἐγγύτερον — «ближе»; 近づいている."
  12: "προέκοψεν — «продвинулась»; 更け. ἀποθώμεθα — «сложим»; 脱ぎ捨て. ὅπλα τοῦ φωτός — «оружия света»; 光の武具."
  13: "εὐσχημόνως — «благопристойно»; 行状を正しくして. κῶμοι — пирушки, 酒宴; μέθαι — пьянство, 泥酔; κοῖται — блуд, 不品行; ἀσέλγεια — распутство, 好色; ἔρις — раздор, 争い; ζῆλος — зависть, 妬み."
  14: "ἐνδύσασθε — «облекитесь»; 身に着けなさい. πρόνοιαν ποιεῖσθαι — «промышлять, заботиться»; 備えをする."
