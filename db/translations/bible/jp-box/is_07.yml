# jp-box, Исаия, глава 7. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для Исаии есть фрагментами, но в этой
# главе он не привлекался; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 7: 1–2 нашествие Рецина и Факея, испуг дома Давида; 3–9 слово Господа Исаии
# и весть Ахазу (внутри — слова царей, 7:6); 10–17 речь Господа Ахазу: знамение
# Еммануила (14), масло и мёд (15–16), наведение царя Ассирийского (17);
# 18–25 опустошение земли, мухи и пчёлы, бритва, оскудевшие стада.
# Голоса: 1–2, 10, 18–25 авторское повествование; 3–9 слово Господа Исаии — 「…」,
# весть Ахазу внутри — 『…』, слова царей — 「…」 (трёхуровневое вложение, как в 4 Цар 1:6);
# 11–17 речь Господа — 「…」; 12 слова Ахаза — 「…」; 13–14 речь Господа продолжается.
# 7:14 παρθένος — 処女[おとめ] (LXX; МТ «молодая женщина» — в notes); имя Еммануил — 『…』.
# Нумерация по gr: 25 стихов; у csl тоже 25, деление по стихам совпадает, но csl 7:8
# добавляет «и глава дамаску расин» (нет в LXX) — внесено в основной текст, notes.
# 〔…〕 нет. Сносок ⟨…⟩ нет: 水ため, はえ, 蜂, シケル, 布さらし и пр. понятны
# или объяснены в notes. Имена — транслитерация греческого (LXX), кроме レツィン и
# ペカ, уже закреплённых в корпусе (4 Цар 15–16).

