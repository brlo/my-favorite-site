verses:
  1: "ユダの王[おう]アハズ、すなわちヨタムの子[こ]、ウジヤの子[こ]の日[ひ]々[び]に、アラムの王[おう]レツィンと、レマリヤの子[こ]であるイスラエルの王[おう]ペカが、エルサレムに攻[せ]め上[のぼ]ってこれと戦[たたか]おうとしたが、これを包囲[ほうい]することはできなかった。"
  2: "「アラムはエフライムと手[て]を組[く]んだ」と、ダビデの家[いえ]に告[つ]げられた。王[おう]の心[こころ]も民[たみ]の心も、林[はやし]の木[き]が風[かぜ]に揺[ゆ]れるように揺[ゆ]れ動[うご]いた。"
  3: "主[しゅ]はイザヤに言[い]われた。「あなたと、あなたの子[こ]で、残[のこ]された者[もの]であるイアスブは、アハズに会[あ]いに、布[ぬの]さらしの野[の]の上[かみ]の道[みち]にある水[みず]ためへ出[で]て行[い]き、"
  4: "『彼[かれ]に言[い]え。心[こころ]を静[しず]めて落[お]ち着[つ]き、恐[おそ]れてはならない。これら二[ふた]つの、煙[けむ]る燃[も]えさしの端[はし]———レツィンとアラム、レマリヤの子[こ]———の激[はげ]しい怒[いか]りに、あなたの心[こころ]を弱[よわ]らせてはならない。怒[いか]りの激[はげ]しさが起[お]こるとき、わたしは再[ふたた]び癒[いや]すからである。"
  5: "アラムの子[こ]とレマリヤの子[こ]が、あなたに対して悪[わる]い計画[けいかく]をめぐらし、こう言[い]っている。"
  6: "「さあ、ユダに攻[せ]め上[のぼ]り、彼[かれ]らと話[はな]し合[あ]って自分[じぶん]たちの側[がわ]に引[ひ]き寄[よ]せ、その地[ち]にタベエルの子[こ]を王[おう]として立[た]てよう。」"
  7: "しかし、万軍[ばんぐん]の主[しゅ]はこう言[い]われる。この計画[けいかく]は続[つづ]かず、成[な]り立[た]たない。"
  8: "アラムの頭[あたま]はダマスコであり、ダマスコの頭[あたま]はレツィンである。あと六十五[ろくじゅうご]年[ねん]たつと、エフライムの王国[おうこく]は民[たみ]のうちから消[き]え失[う]せる。"
  9: "エフライムの頭[あたま]はサマリアであり、サマリアの頭[あたま]はレマリヤの子[こ]である。もしあなたがたが信[しん]じないなら、決[けっ]して悟[さと]ることはない。』」"
  10: "主[しゅ]は再[ふたた]びアハズに語[かた]って言[い]われた。"
  11: "「あなたの神[かみ]である主[しゅ]から、しるしを求[もと]めよ。深[ふか]みにでも、高[たか]みにでも。」"
  12: "アハズは言[い]った。「わたしは求[もと]めません。主[しゅ]を試[こころ]みることはしません。」"
  13: "「聞[き]け、ダビデの家[いえ]よ。あなたがたが人[ひと]を煩[わずら]わせるのは、まだ小[ちい]さなことなのか。なぜ、主[しゅ]まで煩[わずら]わせようとするのか。"
  14: "それゆえ、主[しゅ]ご自身[じしん]があなたがたにしるしを与[あた]える。見[み]よ、おとめが身[み]ごもって男[おとこ]の子[こ]を産[う]む。あなたはその子を『インマヌエル』と呼[よ]ぶ。"
  15: "その子はバターと蜂蜜[はちみつ]を食[た]べる。悪[わる]いことを知[し]ってこれを退[しりぞ]ける前[まえ]に、良[よ]いことを選[えら]ぶ。"
  16: "この子[こ]が善[ぜん]と悪[あく]を知[し]り、悪[わる]を退[しりぞ]けて善[ぜん]を選[えら]ぶ前[まえ]に、あなたが恐[おそ]れている地[ち]は、あの二[ふた]人[り]の王[おう]の前[まえ]から捨[す]てられる。"
  17: "しかし、主[しゅ]はあなたとあなたの民[たみ]、あなたの父[ちち]の家[いえ]の上[うえ]に、エフライムがユダから離[はな]れた日[ひ]から今日[こんにち]まで、まだ来[こ]なかった日[ひ]々[び]を、アッシリアの王[おう]によって臨[のぞ]ませる。」"
  18: "その日[ひ]、主[しゅ]は口笛[くちぶえ]を吹[ふ]いて、エジプトの川[かわ]の端[はし]を治[おさ]めるはえと、アッシリアの地[ち]にいる蜂[はち]とを呼[よ]び寄[よ]せる。"
  19: "それらはみな来[き]て、谷[たに]という谷[たに]、岩[いわ]の裂[さ]け目[め]、洞窟[どうくつ]、すべての茂[しげ]みの中[なか]、すべての木[き]にとどまる。"
  20: "その日[ひ]、主[しゅ]は、川[かわ]の向[む]こう岸[ぎし]にいるアッシリアの王[おう]という、雇[やと]われた大[おお]きな剃刀[かみそり]で、頭[あたま]と足[あし]の毛[け]を剃[そ]り、ひげまでも取[と]り去[さ]る。"
  21: "その日[ひ]、人[ひと]は若[わか]い雌牛[めうし]一頭[いっとう]と羊[ひつじ]二匹[にひき]を飼[か]うようになる。"
  22: "乳[ちち]が多[おお]く出[で]るので、その人[ひと]はバターを造[つく]る。地[ち]に残[のこ]された者[もの]はみな、バターと蜂蜜[はちみつ]を食[た]べる。"
  23: "その日[ひ]、千[せん]本[ぽん]のぶどうの木[き]が千[せん]シケルに値[あたい]した所[ところ]は、すべて荒[あ]れ地[ち]となり、茨[いばら]になる。"
  24: "そこへは弓[ゆみ]と矢[や]を持[も]って入[はい]らねばならない。全[ぜん]地[ち]が荒[あ]れ地[ち]と茨[いばら]になるからである。"
  25: "耕[たがや]される山[やま]はすべて耕され、そこには恐[おそ]れが入[はい]って来[こ]ない。荒[あ]れ地[ち]と茨[いばら]が、羊[ひつじ]の牧場[ぼくじょう]となり、牛[うし]の踏[ふ]みつける所[ところ]となるからである。"

notes:
  1: "ἐν ταῖς ἡμέραις Αχαζ τοῦ Ιωαθαμ τοῦ υἱοῦ Οζιου βασιλέως Ιουδα — «во дни Ахаза, сына Иоафамова, сына Озии, царя Иудина». Ραασσων βασιλεὺς Αραμ — Рецин, царь Арама (Сирии); в корпусе это лицо передаётся как レツィン (4 Цар 15:37; 16:5), транслитерация ラアソン не вводится. Φακεε υἱὸς Ρομελιου — Факей, сын Ремалии (ペカ, как в корпусе); Αραμ — アラム. πολεμῆσαι αὐτὴν καὶ οὐκ ἠδυνήθησαν πολιορκῆσαι αὐτήν — «воевать против неё, и не смогли осадить её» (πολιορκέω — осаждать; слав. «разорити»)."
  2: "ἀνηγγέλη εἰς τὸν οἶκον Δαυιδ λέγοντες — «возвещено было дому Давида, говоря» (ἀναγγέλλω — возвещать). Συνεφώνησεν Αραμ πρὸς τὸν Εφραιμ — «сговорился Арам с Ефраимом» (συμφωνέω — быть в согласии; слав. «совещася»); Ефраим здесь — северное царство. ἐξέστη ἡ ψυχὴ αὐτοῦ — «потряслась душа его» (ἐξίστημι — ужасаться), в тексте 心 (слав. «ужасеся душа»). ὃν τρόπον ὅταν ἐν δρυμῷ ξύλον ὑπὸ πνεύματος σαλευθῇ — «как в дубраве дерево ветром колеблется» (δρυμός — дубрава; σαλεύω — колебать)."
  3: "Ἔξελθε εἰς συνάντησιν Αχαζ — «выйди навстречу Ахазу». ὁ καταλειφθεὶς Ιασουβ ὁ υἱός σου — «оставшийся Иасув, сын твой»: у пророка сын со значащим именем (евр. Шеар-ясув, «остаток вернётся»), LXX передаёт первую часть как определение; в тексте 残された者であるイアスブ. εἰς τὴν κολυμβήθραν τῆς ἄνω ὁδοῦ τοῦ ἀγροῦ τοῦ γναφέως — «к купели (водоёму) верхней дороги поля белильщика» (κολυμβήθρα — бассейн; γναφεύς — валяльщик, белильщик сукон; слав. «купель горняго пути села белилнича»)."
  4: "Φύλαξαι τοῦ ἡσυχάσαι — «блюди, чтобы успокоиться» (φυλάσσω — беречься; ἡσυχάζω — успокаиваться; слав. «блюди, еже молчати»). μηδὲ ἡ ψυχή σου ἀσθενείτω — «и да не ослабеет душа твоя». ἀπὸ τῶν δύο ξύλων τῶν δαλῶν τῶν καπνιζομένων τούτων — «от двух этих дымящихся головней» (δαλός — головня, факел; καπνίζω — дымить). ὅταν γὰρ ὀργὴ τοῦ θυμοῦ μου γένηται, πάλιν ἰάσομαι — «ибо когда придёт гнев ярости Моей, Я снова исцелю» (слав. «егда бо гнев ярости моея будет, паки изцелю»). Начало вести Ахазу — 『…』 внутри слова Господа Исаии."
  5: "ὁ υἱὸς τοῦ Αραμ καὶ ὁ υἱὸς τοῦ Ρομελιου — «сын Арама и сын Ремалии» (так LXX называет царей). ὅτι ἐβουλεύσαντο βουλὴν πονηρὰν περὶ σοῦ — «что замыслили злой совет против тебя» (βουλεύομαι βουλήν — плеоназм, сохранён). λέγοντες — «говоря»: вводное слово, речь царей начинается в 7:6."
  6: "Ἀναβησόμεθα εἰς τὴν Ιουδαίαν — «взойдём в Иудею». συλλαλήσαντες αὐτοῖς ἀποστρέψομεν αὐτοὺς πρὸς ἡμᾶς — «поговорив с ними, отвратим их к нам» (συλλαλέω — беседовать; ἀποστρέφω — поворачивать). βασιλεύσομεν αὐτῆς τὸν υἱὸν Ταβεηλ — «воцарим в ней сына Тавеила» (Ταβεηλ — евр. Тавеил, タベエル). Речь царей — 「…」 внутри 『…』 (трёхуровневое вложение, ср. 4 Цар 1:6)."
  7: "τάδε λέγει κύριος σαβαωθ — «так говорит Господь Саваоф» (в тексте 万軍の主). Οὐ μὴ ἐμμείνῃ ἡ βουλὴ αὕτη οὐδὲ ἔσται — «не пребудет совет сей и не состоится» (ἐμμένω — оставаться, держаться). Оракул остаётся внутри вести, которую Исаия должен передать Ахазу (『…』), — в LXX и слав. нового деления нет."
  8: "ἀλλ᾿ ἡ κεφαλὴ Αραμ Δαμασκός — «но глава Арама — Дамаск». Слав. добавляет «и глава дамаску расин» («глава Дамаска — Рецин») — этой фразы нет в LXX (чтение МТ); по паритету внесена в основной текст без 〔…〕 (ダマスコの頭はレツィン). ἀλλ᾿ ἔτι ἑξήκοντα καὶ πέντε ἐτῶν ἐκλείψει ἡ βασιλεία Εφραιμ ἀπὸ λαοῦ — «ещё шестьдесят пять лет — и иссякнет царство Ефраима от народа» (ἐκλείπω — исчезать, оскудевать; слав. «оскудеет»)."
  9: "ἡ κεφαλὴ Εφραιμ Σομορων — «глава Ефраима — Самария» (Σομορων — Самария, サマリア). καὶ ἐὰν μὴ πιστεύσητε, οὐδὲ μὴ συνῆτε — «если не поверите, то и не уразумеете» (συνίημι — понимать; слав. «ниже имате разумети»). ru «то потому, что вы не удостоверены» — игра слов МТ, в LXX/слав. её нет. Здесь закрываются 『…』 и слово Господа Исаии 「…」."
  10: "Καὶ προσέθετο κύριος λαλῆσαι τῷ Αχαζ — «и приложил (продолжил) Господь говорить Ахазу» (προστίθημι — прибавлять; слав. «приложи»). Новая вводная формула; далее речь Господа — 「…」 до конца 7:17."
  11: "Αἴτησαι σεαυτῷ σημεῖον παρὰ κυρίου θεοῦ σου — «проси себе знамения у Господа Бога твоего». εἰς βάθος ἢ εἰς ὕψος — «в глубину или в высоту» (слав. «во глубину, или в высоту»), т. е. в преисподнюю или в небеса."
  12: "Οὐ μὴ αἰτήσω οὐδ᾿ οὐ μὴ πειράσω κύριον — «не буду просить и не буду искушать Господа» (двойное отрицание усилено; πειράζω — испытывать). Слова Ахаза — 「…」: он отказывается просить знамение, ссылаясь на запрет искушать Господа."
  13: "Ἀκούσατε δή, οἶκος Δαυιδ — «слушайте же, дом Давидов» (δή — усилительная частица). μὴ μικρὸν ὑμῖν ἀγῶνα παρέχειν ἀνθρώποις — «разве мало вам давать труд (борьбу) людям?» (ἀγών — борьба, труд; παρέχω — доставлять). καὶ πῶς κυρίῳ παρέχετε ἀγῶνα — «и как даёте труд Господу?» В слав. перед стихом стоит глосса «(исаиа)»; в LXX говорит Сам Господь."
  14: "διὰ τοῦτο δώσει κύριος αὐτὸς ὑμῖν σημεῖον — «потому Сам Господь даст вам знамение» (αὐτός — усиление: Сам). ἡ παρθένος ἐν γαστρὶ ἕξει καὶ τέξεται υἱόν — «дева во чреве приимет и родит Сына»; παρθένος — дева, 処女[おとめ] (LXX; МТ עַלְמָה «молодая женщина» — в текст не внесено; в нашем Мф 1:23 — おとめ). καλέσεις τὸ ὄνομα αὐτοῦ Εμμανουηλ — «наречёшь имя Ему: Еммануил» (2-е л. ед. ч., как слав. «наречеши», а не «нарекут»); имя — 『インマヌエル』. Цит. Мф 1:23."
  15: "βούτυρον καὶ μέλι φάγεται — «масло (сбитое молоко) и мёд будет есть» (βούτυρον — バター; слав. «масло»). πρὶν ἢ γνῶναι αὐτὸν ἢ προελέσθαι πονηρὰ ἐκλέξεται τὸ ἀγαθόν — «прежде нежели узнает он, [как] предпочесть злое, изберёт доброе»: греч. тёмен (двойное ἤ), передан буквально, не сглажен."
  16: "πρὶν ἢ γνῶναι τὸ παιδίον ἀγαθὸν ἢ κακὸν ἀπειθεῖ πονηρίᾳ τοῦ ἐκλέξασθαι τὸ ἀγαθόν — «прежде нежели дитя познает доброе или злое, отвергнет злое, чтобы избрать доброе» (ἀπειθέω здесь — отвергать, отказываться; слав. «отринет лукавое, еже избрати благое»). καὶ καταλειφθήσεται ἡ γῆ, ἣν σὺ φοβῇ ἀπὸ προσώπου τῶν δύο βασιλέων — «и будет оставлена земля, которой ты боишься, от лица двух царей». Дублет к 7:15: в LXX оба стиха близки, оба сохранены."
  17: "ἐπάξει ὁ θεὸς ἐπὶ σὲ καὶ ἐπὶ τὸν λαόν σου καὶ ἐπὶ τὸν οἶκον τοῦ πατρός σου ἡμέρας — «наведёт Бог на тебя, и на народ твой, и на дом отца твоего дни» (ἐπάγω — наводить). αἳ οὔπω ἥκασιν ἀφ᾿ ἧς ἡμέρας ἀφεῖλεν Εφραιμ ἀπὸ Ιουδα — «каких ещё не приходило с того дня, как отделился Ефраим от Иуды» (ἀφαιρέω — отделять). τὸν βασιλέα τῶν Ἀσσυρίων — «царя Ассирийского». Слав. «Господь» вместо ὁ θεός; новой вводной формулы нет, речь Господа продолжается (Бог говорит о Себе в 3-м лице). Конец речи 「…」."
  18: "συριεῖ κύριος μυίαις — «просвистит Господь мухам» (συρίζω — свистеть, шипеть; слав. «позвиждет»): образ созыва врагов свистом. ὃ κυριεύει μέρους ποταμοῦ Αἰγύπτου — «которая владеет частью реки Египта» (κυριεύω — господствовать; имеются в виду рукава Нила). τῇ μελίσσῃ, ἥ ἐστιν ἐν χώρᾳ Ἀσσυρίων — «и пчеле, которая в земле Ассирийской». Поэтическая проза, без кавычек."
  19: "καὶ ἐλεύσονται πάντες — «и придут все» (мухи и пчёлы). ἐν ταῖς φάραγξι τῆς χώρας — «в ущельях страны» (φάραγξ — ущелье; слав. «в дебрех»). τρώγλαις τῶν πετρῶν — «в расселинах скал» (τρώγλη — нора, расселина); σπήλαια — пещеры; ῥαγάς — трещина. Перечисление сохранено, не сглажено."
  20: "ξυρήσει κύριος τῷ ξυρῷ τῷ μεγάλῳ καὶ μεμεθυσμένῳ — «обреет Господь бритвою великою и упоённою» (ξυρόν — бритва; μεθύσκω — поить допьяна). Слав. читает «бритвою наятою» (наёмною) — иное чтение, чем μεμεθυσμένῳ; по паритету в тексте 雇われた (слав.), вариант LXX — в этой заметке. ὅ ἐστιν πέραν τοῦ ποταμοῦ βασιλέως Ἀσσυρίων — «то есть за рекою, царя Ассирийского»: бритва — сам царь Ассирийский за Евфратом. τὴν κεφαλὴν καὶ τὰς τρίχας τῶν ποδῶν καὶ τὸν πώγωνα — «голову, и волосы ног, и бороду» (πώγων — борода)."
  21: "θρέψει ἄνθρωπος δάμαλιν βοῶν καὶ δύο πρόβατα — «человек будет кормить тёлку из крупного скота и двух овец» (δάμαλις — молодая корова; слав. «юницу от волов»). Картина оскудения: вместо стад — одна корова и две овцы."
  22: "ἀπὸ τοῦ πλεῖστον ποιεῖν γάλα βούτυρον — «по причине того, что [они] дают много молока, — масло» (πλεῖστον ποιεῖν γάλα — «производить очень много молока»; слав. «от множества творения млечнаго»). καὶ μέλι φάγεται πᾶς ὁ καταλειφθεὶς ἐπὶ τῆς γῆς — «и мёд будет есть всякий, оставшийся на земле». Земля опустеет, станет пастбищем, и остаток будет питаться молочным и мёдом."
  23: "πᾶς τόπος, οὗ ἐὰν ὦσιν χίλιαι ἄμπελοι χιλίων σίκλων — «всякое место, где будет тысяча лоз на тысячу сиклей» (ἄμπελος — виноградная лоза; σίκλος — сикль, シケル). εἰς χέρσον ἔσονται καὶ εἰς ἄκανθαν — «будут в пустошь и в терние» (χέρσος — сухая, невозделанная земля; ἄκανθα — колючка; слав. «в лядину и в терние»)."
  24: "μετὰ βέλους καὶ τοξεγματος εἰσελεύσονται ἐκεῖ — «со стрелою и луком войдут туда» (βέλος — стрела; τόξευμα — выстрел, лук; слав. «со стрелою и луком»). χέρσος καὶ ἄκανθα ἔσται πᾶσα ἡ γῆ — «вся земля будет пустошью и тернием». Земля зарастёт, и туда будут ходить только с оружием."
  25: "πᾶν ὄρος ἀροτριώμενον ἀροτριαθήσεται — «всякая гора, [прежде] возделываемая, будет возделываема» (ἀροτριάω — пахать; повтор корня сохранён). καὶ οὐ μὴ ἐπέλθῃ ἐκεῖ φόβος — «и не найдёт туда страх». ἔσται γὰρ ἀπὸ τῆς χέρσου καὶ ἀκάνθης εἰς βόσκημα προβάτου καὶ εἰς καταπάτημα βοός — «ибо [там] из пустоши и терния будет пастбище для овец и попрание для волов» (βόσκημα — пастбище, корм; καταπάτημα — попираемое место)."
