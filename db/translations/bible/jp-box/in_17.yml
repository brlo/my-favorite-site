verses:
  1: "イエスはこれらのことを話[はな]し、目[め]を天[てん]に上[あ]げて言[い]われた。「<j>父[ちち]よ、時[とき]が来[き]た。あなたの子[こ]に栄光[えいこう]を帰[き]してください。子があなたに栄光を帰するためです。</j>"
  2: "<j>あなたが子[こ]にすべての肉[にく]なるものの上[うえ]に権威[けんい]をお与[あた]えになったのは、子が、あなたがお与えになったすべての者[もの]に永遠[えいえん]の命[いのち]を与[あた]えるためです。</j>"
  3: "<j>永遠[えいえん]の命[いのち]とは、唯一[ゆいいつ]の真[しん]の神[かみ]であるあなたと、あなたが遣[つか]わしたイエス・キリストを知[し]ることです。</j>"
  4: "<j>わたしは地上[ちじょう]であなたに栄光[えいこう]を帰[き]しました。あなたがわたしに行[おこな]わせようとお与[あた]えになった業[わざ]を成[な]し遂[と]げたのです。</j>"
  5: "<j>父[ちち]よ、今[いま]、あなたご自身[じしん]のもとで、わたしに栄光[えいこう]を帰[き]してください。世[よ]ができる前[まえ]に、わたしがあなたとともに持[も]っていた栄光によって。</j>"
  6: "<j>わたしは、あなたが世[よ]の中[なか]からわたしに与[あた]えられた人々[ひとびと]に、あなたの名[な]を現[あらわ]しました。彼[かれ]らはあなたのものであり、あなたは彼らをわたしに与えられました。彼らはあなたの言葉[ことば]を守[まも]ってきました。</j>"
  7: "<j>今[いま]、彼[かれ]らは、あなたがわたしに与[あた]えられたものはすべて、あなたのもとから出[で]たものだと知[し]りました。</j>"
  8: "<j>あなたがわたしに与[あた]えられた言葉[ことば]を、わたしは彼[かれ]らに与[あた]えました。彼らはそれを受[う]け取[と]り、わたしがあなたのもとから出[で]たことを本当[ほんとう]に知[し]り、あなたがわたしを遣[つか]わされたことを信[しん]じました。</j>"
  9: "<j>わたしは彼[かれ]らのために願[ねが]います。世[よ]のためにではなく、あなたがわたしに与[あた]えられた者[もの]たちのために願います。彼らはあなたのものだからです。</j>"
  10: "<j>わたしに属[ぞく]するものはすべてあなたのものであり、あなたに属するものはわたしのものである。わたしは彼[かれ]らによって栄光[えいこう]を受[う]けた。</j>"
  11: "<j>わたしはもう世[よ]にいません。彼[かれ]らは世にいます。わたしはあなたのもとへ行[い]きます。聖[せい]なる父[ちち]よ、あなたがわたしに与[あた]えられたあなたの名[な]によって彼らを守[まも]ってください。わたしたちが一[ひと]つであるように、彼らも一つとなるためです。</j>"
  12: "<j>わたしが彼[かれ]らと一緒[いっしょ]にいたとき、あなたがわたしに与[あた]えられたあなたの名[な]によって彼らを守[まも]り、また守り通[とお]しました。彼らのうち、滅[ほろ]びの子[こ]のほかは、だれも滅[ほろ]びませんでした。聖書[せいしょ]が成就[じょうじゅ]するためです。</j>"
  13: "<j>今[いま]、わたしはあなたのもとへ行[い]きます。そして、わたしが世[よ]にあってこれらのことを話[はな]すのは、彼[かれ]らがわたしの喜[よろこ]びを、自分[じぶん]たちのうちに満[み]たされたものとして持[も]つためです。</j>"
  14: "<j>わたしは彼[かれ]らにあなたの言葉[ことば]を与[あた]えました。世[よ]は彼らを憎[にく]みました。わたしが世のものではないように、彼らも世のものではないからです。</j>"
  15: "<j>わたしが願[ねが]うのは、あなたが彼[かれ]らを世[よ]から取[と]り去[さ]ることではなく、彼らを悪[あく]から守[まも]ることです。</j>"
  16: "<j>わたしが世[よ]のものではないように、彼[かれ]らも世のものではありません。</j>"
  17: "<j>真理[しんり]によって彼[かれ]らを聖[せい]なる者[もの]としなさい。あなたの言葉[ことば]は真理です。</j>"
  18: "<j>あなたがわたしを世[よ]に遣[つか]わされたように、わたしも彼[かれ]らを世に遣わしました。</j>"
  19: "<j>わたしは彼[かれ]らのために、自分自身[じぶんじしん]を聖[せい]なる者[もの]とします。彼らも真理[しんり]によって聖なる者とされるためです。</j>"
  20: "<j>わたしは、ただ彼[かれ]らのためだけではなく、彼らの言葉[ことば]によってわたしを信[しん]じる者[もの]たちのためにも願[ねが]います。</j>"
  21: "<j>すべてのものが一[ひと]つになるように。父[ちち]よ、あなたがわたしにおり、わたしがあなたにいるように、彼[かれ]らもわたしたちのうちにいるように。世[よ]が、あなたがわたしを遣[つか]わされたことを信[しん]じるためです。</j>"
  22: "<j>あなたがわたしに与[あた]えられた栄光[えいこう]を、わたしは彼[かれ]らに与えました。わたしたちが一[ひと]つであるように、彼らも一つとなるためです。</j>"
  23: "<j>わたしが彼[かれ]らのうちにおり、あなたがわたしのうちにいます。彼らが一[ひと]つのものとして全[まった]きものとされるためです。世[よ]が、あなたがわたしを遣[つか]わされたこと、また、あなたがわたしを愛[あい]されたように彼らをも愛されたことを知[し]るためです。</j>"
  24: "<j>父[ちち]よ、あなたがわたしに与[あた]えられた者[もの]たちを、わたしのいる所[ところ]にわたしとともにいさせてください。わたしに与えられたわたしの栄光[えいこう]を、彼[かれ]らが見[み]るためです。あなたがわたしを愛[あい]されたのは、世[よ]の基[もと]が据[す]えられる前[まえ]のことでした。</j>"
  25: "<j>正[ただ]しい父[ちち]よ、世[よ]はあなたを知[し]りませんでしたが、わたしはあなたを知りました。また、この者[もの]たちは、あなたがわたしを遣[つか]わされたことを知りました。</j>"
  26: "<j>わたしは彼[かれ]らにあなたの名[な]を知[し]らせました。これからも知らせます。あなたがわたしを愛[あい]された愛[あい]が彼らのうちにあり、わたしも彼らのうちにいるためです。</j>」"

notes:
  1: "δόξασον — 栄光を帰する, как в 16:14. Молитва начинается с обращения 父よ и «час пришёл»."
  2: "πάσης σαρκός — «всякой плоти»; すべての肉なるもの, без смягчения до すべての人. καθώς («как») связано с прошением 1 ст.; по-японски передано оборотом のは…ためです, без вводного союза."
  3: "τὸν μόνον ἀληθινὸν θεόν — 唯一の真の神; порядок «Ты, единый истинный Бог, и посланный Тобою Иисус Христос» сохранён."
  5: "τῇ δόξῃ ᾗ εἶχον πρὸ τοῦ τὸν κόσμον εἶναι παρὰ σοί — «славою, которую Я имел у Тебя прежде бытия мира»; 世ができる前に…持っていた栄光."
  11: "ἐν τῷ ὀνόματί σου ᾧ δέδωκάς μοι — «в имени Твоём, которое Ты дал Мне»; あなたの名によって (имя как откровение), без перестройки."
  12: "ὁ υἱὸς τῆς ἀπωλείας — 滅[ほろ]びの子[こ] (ср. 2 Фес 2:3), не сглажено до «погибший»."
  17: "ἁγίασον ἐν τῇ ἀληθεία — 真理によって聖なる者としなさい; ὁ λόγος ὁ σὸς ἀλήθειά ἐστιν — あなたの言葉は真理です."
  19: "ἁγιάζω ἐμαυτόν — «освящаю Себя»; 自分自身を聖なる者とします, как в 17:17."
  21: "ἵνα πάντες ἓν ὦσιν — すべてのものが一つになるように; вложенные ἵνα сохранены тремя клаузами."
  23: "τετελειωμένοι εἰς ἕν — «совершенны воедино»; 一つのものとして全きものとされる."
  24: "πρὸ καταβολῆς κόσμου — «прежде основания мира»; 世の基が据えられる前."
