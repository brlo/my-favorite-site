verses:
  0: "安息日[あんそくび]の前[まえ]の日[ひ]、地[ち]が住[す]まいとなったときのもの。ダビデの賛歌[さんか]。"
  1: "主[しゅ]は王[おう]となられた。美[うつく]しさを身[み]にまとわれた。主[しゅ]は力[ちから]を身[み]にまとわれ、帯[おび]を締[し]められた。まことに、世界[せかい]は固[かた]く据[す]えられ、揺[ゆ]るぐことはない。"
  2: "あなたの王座[おうざ]は昔[むかし]から堅[かた]く据[す]えられ、あなたはとこしえからおられる。"
  3: "主[しゅ]よ、川[かわ]々[がわ]は声[こえ]を上[あ]げ、川[かわ]々[がわ]はその声[こえ]を上[あ]げる。"
  4: "多[おお]くの水[みず]の声[こえ]、海[うみ]の高[たか]い波[なみ]よりも、主[しゅ]は高[たか]い所[ところ]にあって驚[おどろ]くべき方[かた]である。"
  5: "あなたの証[あかし]はどこまでも確[たし]かである。主[しゅ]よ、聖[せい]なることはあなたの家[いえ]にふさわしく、日[ひ]の長[なが]く続[つ]くかぎり、そうである。"

notes:
  0: "Εἰς τὴν ἡμέραν τοῦ προσαββάτου — 安息日の前の日に (προσάββατον — «предсубботний день»). ὅτε κατῴκισται ἡ γῆ — 地が住まいとなったときのもの (κατοικίζω — «населять, водворять»; слав. «егда населися земля»). αἶνος ᾠδῆς τῷ Δαυιδ — ダビデの賛歌 (αἶνος — «хвала»). Надписание — стих 0."
  1: "ὁ κύριος ἐβασίλευσεν — 主は王となられた (βασιλεύω — «царствовать»). εὐπρέπειαν ἐνεδύσατο — 美しさを身にまとわれた (εὐπρέπεια — «благолепие, красота»; ἐνδύω — «облекаться»). ἐνεδύσατο κύριος δύναμιν καὶ περιεζώσατο — 主は力を身にまとわれ、帯を締められた (περιζώννυμι — «опоясываться»). ἐστερέωσεν τὴν οἰκουμένην, ἥτις οὐ σαλευθήσεται — 世界は固く据えられ、揺るぐことはない (στερεόω — «утверждать»; σαλεύω — «колебать»)."
  2: "ἕτοιμος ὁ θρόνος σου ἀπὸ τότε — あなたの王座は昔から堅く据えられ (ἕτοιμος — «готовый, утверждённый»; ἀπὸ τότε — «с тех пор, издревле»). ἀπὸ τοῦ αἰῶνος σὺ εἶ — あなたはとこしえからおられる (σὺ εἶ без сказуемого)."
  3: "ἐπῆραν οἱ ποταμοί, κύριε — 主よ、川々は声を上げ (ἐπαίρω — «поднимать»; ποταμός — 川). ἐπῆραν οἱ ποταμοὶ φωνὰς αὐτῶν — 川々はその声を上げる (повтор сохранён; у jp-joc добавлен третий член «поднимают волны», в gr-lxx-byz его нет)."
  4: "ἀπὸ φωνῶν ὑδάτων πολλῶν — 多くの水の声よりも (φωνή — 声). θαυμαστοὶ οἱ μετεωρισμοὶ τῆς θαλάσσης — 海の高い波 (μετεωρισμός — «возвышение, вздымание»; θαυμαστός — «дивный»; передано 驚くべき). θαυμαστὸς ἐν ὑψηλοῖς ὁ κύριος — 主は高い所にあって驚くべき方である."
  5: "τὰ μαρτύριά σου ἐπιστώθησαν σφόδρα — あなたの証はどこまでも確かである (μαρτύριον — 証; πιστόω — «делать верным, утверждать»). τῷ οἴκῳ σου πρέπει ἁγίασμα — 聖なることはあなたの家にふさわしく (πρέπει — «подобает»; ἁγίασμα — «святыня»). εἰς μακρότητα ἡμερῶν — 日の長く続くかぎり (μακρότης — «долгота»)."
