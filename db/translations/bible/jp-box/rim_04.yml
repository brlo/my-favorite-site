# jp-box, Послание к Римлянам, глава 4. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 4: Авраам оправдан верою (1–8), обрезание и вера (9–12),
# обещание по вере (13–17), вера Авраама и его оправдание (18–25).
# Красного и синего нет. 〔…〕 в главе нет: 4:19 — замена (οὐ κατενόησεν),
# дана в церковной форме без скобок; 4:11 и 4:16–17 в базе в квадратных скобках.
# Сносок ⟨…⟩ нет. jp-ni не использовался.

tr_code: jp-box
book: rim
chapter: 4
draft: true

verses:
  1: "それでは、わたしたちの先祖[せんぞ]アブラハムが肉[にく]に従[したが]って得[え]たものについて、何[なに]と言[い]おうか。"
  2: "なぜなら、もしアブラハムが行[おこな]いによって義[ぎ]とされたのなら、彼[かれ]には誇[ほこ]りがあるからである。しかし、神[かみ]の前[まえ]ではそうではない。"
  3: "聖書[せいしょ]は何[なに]と言[い]っているか。「アブラハムは神[かみ]を信[しん]じ、そのことが彼[かれ]の義[ぎ]と認[みと]められた。」"
  4: "働[はたら]く者[もの]には、その報酬[ほうしゅう]は恵[めぐ]みとしてではなく、当然[とうぜん]の負[お]い目[め]として与[あた]えられる。"
  5: "しかし、働[はたら]かない者[もの]でも、不敬虔[ふけいげん]な者[もの]を義[ぎ]とする方[かた]を信[しん]じるなら、その信仰[しんこう]が義[ぎ]と認[みと]められる。"
  6: "ダビデもまた、行[おこな]いとは別[べつ]に神[かみ]が義[ぎ]と認[みと]められる人[ひと]の幸[さいわ]いについて、こう言[い]っている。"
  7: "「罪[つみ]の赦[ゆる]された者[もの]、その罪[つみ]が覆[おお]われた者[もの]は幸[さいわ]いである。"
  8: "主[しゅ]が罪[つみ]を認[みと]めない人[ひと]は幸[さいわ]いである。」"
  9: "それでは、この幸[さいわ]いは割礼[かつれい]の者[もの]にあるのか、それとも無割礼[むかつれい]の者[もの]にもあるのか。わたしたちは、「アブラハムの信仰[しんこう]が義[ぎ]と認[みと]められた」と言[い]っているからである。"
  10: "では、どのようにして認[みと]められたのか。割礼[かつれい]の状態[じょうたい]にあったときか、無割礼[むかつれい]の状態[じょうたい]にあったときか。割礼[かつれい]の状態[じょうたい]ではなく、無割礼[むかつれい]の状態[じょうたい]であった。"
  11: "そして、彼[かれ]は、無割礼[むかつれい]の状態[じょうたい]にあるときの信仰[しんこう]による義[ぎ]の印[いん]として、割礼[かつれい]というしるしを受[う]けた。それは、彼[かれ]が、無割礼[むかつれい]のまま信[しん]じるすべての者[もの]の父[ちち]となり、彼[かれ]らにも義[ぎ]が認[みと]められるためである。"
  12: "また、割礼[かつれい]の者[もの]の父[ちち]ともなった。それは、割礼[かつれい]を受[う]けた者[もの]だけでなく、わたしたちの父[ちち]アブラハムが無割礼[むかつれい]のときに持[も]っていた信仰[しんこう]の足跡[あしあと]に従[したが]って歩[あゆ]む者[もの]たちのためである。"
  13: "なぜなら、アブラハム、あるいはその子孫[しそん]に与[あた]えられた、世界[せかい]の相続人[そうぞくにん]となるという約束[やくそく]は、律法[りっぽう]によるのではなく、信仰[しんこう]の義[ぎ]によるからである。"
  14: "なぜなら、もし律法[りっぽう]による者[もの]たちが相続人[そうぞくにん]なら、信仰[しんこう]は空[むな]しくなり、約束[やくそく]は無効[むこう]になったからである。"
  15: "律法[りっぽう]は怒[いか]りを生[しょう]じさせるからである。律法[りっぽう]のないところには、違反[いはん]もない。"
  16: "それゆえ、約束[やくそく]が信仰[しんこう]によるのは、恵[めぐ]みによるものとなるためであり、約束[やくそく]が子孫[しそん]すべてに、すなわち律法[りっぽう]による者[もの]だけでなく、アブラハムの信仰[しんこう]による者[もの]にも確[かく]かなものとなるためである。アブラハムはわたしたちすべての父[ちち]であり、"
  17: "「わたしはあなたを多[おお]くの民[たみ]の父[ちち]とした」と書[か]かれているとおりである。彼[かれ]は、死者[ししゃ]を生[い]かし、無[な]いものを有[あ]るかのように呼[よ]ばれる神[かみ]を信[しん]じた。その神[かみ]の前[まえ]で、彼[かれ]は父[ちち]となったのである。"
  18: "彼[かれ]は、望[のぞ]みのないところで、なお望[のぞ]みを抱[いだ]いて信[しん]じた。それは、彼[かれ]が多[おお]くの民[たみ]の父[ちち]となるためであった。「あなたの子孫[しそん]はこのようになる」と言[い]われているとおりである。"
  19: "彼[かれ]は信仰[しんこう]において弱[よわ]まることなく、自分[じぶん]の体[からだ]がすでに死[し]んだものとなっていること、またサラの胎[たい]が死[し]んでいることを顧[かえり]みなかった。彼[かれ]はおよそ百歳[ひゃくさい]であった。"
  20: "しかし、彼[かれ]は不信仰[ふしんこう]によって神[かみ]の約束[やくそく]を疑[うたが]わず、かえって信仰[しんこう]によって強[つよ]められ、神[かみ]に栄光[えいこう]を帰[き]した。"
  21: "また、神[かみ]が約束[やくそく]されたことを成[な]し遂[と]げる力[ちから]を持[も]っておられることを、確[たし]かに信[しん]じたのである。"
  22: "それゆえ、そのことが彼[かれ]の義[ぎ]と認[みと]められたのである。"
  23: "「彼[かれ]の義[ぎ]と認[みと]められた」と書[か]かれたのは、彼[かれ]のためだけではなく、"
  24: "わたしたちのためでもある。わたしたちは、わたしたちの主[しゅ]イエスを死者[ししゃ]の中[なか]から起[お]こされた方[かた]を信[しん]じる者[もの]であり、わたしたちにも義[ぎ]が認[みと]められるのである。"
  25: "この方[かた]は、わたしたちの罪[つみ]のゆえに引[ひ]き渡[わた]され、わたしたちが義[ぎ]とされるために復活[ふっかつ]されたのである。"

notes:
  1: "προπάτωρ — «праотец»; 先祖. κατὰ σάρκα — 肉に従って."
  2: "καύχημα — 誇り. οὐ πρὸς θεόν — «не перед Богом»; 神の前ではそうではない."
  3: "Цитата Быт 15:6. ἐλογίσθη — «вменено»; 認められた."
  4: "ὀφείλημα — «долг»; 当然の負い目."
  5: "τὸν δικαιοῦντα τὸν ἀσεβῆ — «оправдывающего нечестивого»; 不敬虔な者を義とする方."
  8: "Цитата Пс 31:1–2 (32:1–2)."
  9: "μακαρισμός — «блаженство, ублажение»; 幸い."
  10: "ἐν περιτομῇ / ἐν ἀκροβυστίᾳ — 割礼の状態/無割礼の状態."
  11: "σημεῖον περιτομῆς — 割礼というしるし. σφραγίς — 印. В базе [τὴν] в квадратных скобках — слово в базе есть, 〔〕 не ставятся."
  12: "στοιχοῦσιν τοῖς ἴχνεσιν — «идущим по следам»; 足跡に従って歩む."
  13: "ἐπαγγελία — 約束. κληρονόμος — 相続人."
  15: "οὐδὲ παράβασις — 違反もない; παράβασις — 違反 (ср. 2:25, 27)."
  16: "βεβαία — 確かな. В базе 4:16–17 часть текста стоит в квадратных скобках ([ὅς ἐστιν… τέθεικά σε]) — в базе есть, 〔〕 не ставятся."
  17: "Цитата Быт 17:5. ζῳοποιοῦντος — 生かす. καλοῦντος τὰ μὴ ὄντα ὡς ὄντα — 無いものを有るかのように呼ぶ."
  18: "παρ᾿ ἐλπίδα ἐπ᾿ ἐλπίδι — «сверх надежды, по надежде»; 望みのないところで、なお望みを抱いて. Цитата Быт 15:5."
  19: "В критической базе κατενόησεν без отрицания; церковный текст (Елизаветинская «не разсмотри», jp-joc「顧みず」) читает οὐ κατενόησεν — 顧みなかった (замена, без 〔〕). ἑκατονταετής που — «около ста лет»; およそ百歳."
  20: "διεκρίθη — «поколебался, усомнился»; 疑わず."
  22: "διό — それゆえ."
  23: "Стихи 23–24 в греч. одно предложение; ἀλλά в 24 передано だけでなく…でもある."
  25: "παρεδόθη διὰ τὰ παραπτώματα — «предан за преступления наши»; 罪のゆえに引き渡され. δικαίωσις — 義とされること."
